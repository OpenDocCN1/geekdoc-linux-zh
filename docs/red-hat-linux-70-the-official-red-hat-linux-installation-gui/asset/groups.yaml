  mdcn: "\n## D 获取技术支持\n\n### D.1 记得注册\n\n如果您拥有红帽 Linux 7.0 官方版本，请记得注册，以获取您作为红帽客户应享有的权益。\n\
    \n根据您购买的官方红帽 Linux 产品，您将有资格享受以下部分或全部权益：\n\n-   官方红帽支持 -- 从红帽公司（Red Hat, Inc.）的支持团队获得安装问题的帮助。\n\
    -   优先 FTP 访问权 -- 无需再在深夜访问拥挤的镜像站点。红帽 Linux 7.0 的所有者可以免费访问 priority.redhat.com，这是红帽为优选客户提供的\
    \ FTP 服务，全天候提供高带宽连接。\n-   红帽更新代理 -- 一旦有更新的 RPM 包可用，即可直接从红帽接收电子邮件通知。使用更新代理过滤器，您可以选择仅接收您感兴趣的主题的通知。\n\
    -   满载而出：官方红帽电子通讯 -- 每月直接从红帽获取最新新闻和产品信息。\n\n要注册，请访问 [http://www.redhat.com/now](http://www.redhat.com/now)。您可以在官方红帽\
    \ Linux 盒装套装中的红白卡片上找到您的 **个人产品 ID**。\n\n### D.2 红帽支持概览\n\n红帽为官方红帽 Linux 盒装套装产品提供安装协助，并覆盖单台计算机的安装。此协助旨在帮助客户成功安装红帽\
    \ Linux。安装协助通过电话和 Web 提供。\n\n红帽支持将尝试在安装过程开始之前回答您可能拥有的任何问题。包括以下内容：\n\n-   硬件兼容性问题\n\
    -   基本的硬盘分区策略\n\n红帽公司支持也可以在安装过程中提供协助：\n\n-   使受支持的硬件被红帽 Linux 操作系统识别\n-   驱动器分区协助\n\
    -   使用 Linux 启动加载器 LILO 配置红帽 Linux 和最多一个其他操作系统（仅限 Intel 平台）以实现双启动。请注意，第三方启动加载器和分区软件不受支持。\n\
    \n我们还可以协助您完成基本的安装后任务，例如：\n\n-   使用 XF86Setup 或 Xconfigurator 成功配置 X 窗口系统\n-  \
    \ 配置本地并口打印机以打印文本\n-   配置鼠标\n\n我们的安装协助服务旨在让您能够尽可能快速、简便地启动并使用红帽 Linux。但是，还有许多其他您可能希望对红帽\
    \ Linux 系统做的事情（从编译自定义内核到设置 Web 服务器），这些都不在覆盖范围内。\n\n对于这些任务的协助，有大量在线信息可供使用，形式包括\
    \ HOWTO 文档、Linux 相关网站和商业出版物。红帽 Linux 操作系统在安装 CD 的 `/doc/HOWTO` 目录中包含各种 Linux HOWTO\
    \ 文档，作为纯文本文件，可以很容易地从红帽 Linux 和其他操作系统中读取。\n\n有大量 Linux 相关网站可用。查找红帽 Linux 信息的最佳起点是红帽公司网站：\n\
    \n`http://www.redhat.com/`\n\n有许多 Linux 相关书籍可用。如果您是 Linux 新手，一本涵盖 Linux 基础知识的书将极具价值。我们可以推荐几本：Bill\
    \ Ball 的《使用 Linux》（Using Linux）；Bryan Pfaffenberger 的《Linux 清晰讲解》（Linux Clearly\
    \ Explained）；Jon \"maddog\" Hall 的《Linux 傻瓜指南》（Linux for Dummies）；以及 Mark G. Sobell\
    \ 的《实用 Linux 指南》（A Practical Guide to Linux）。\n\n### D.3 红帽支持的范围\n\n红帽公司只能向购买了官方红帽\
    \ Linux 盒装套装的客户提安装协助。如果您从其他任何公司获取了 Linux，您必须联系那家公司以获取支持。此类公司的例子如下：\n\n-   Macmillan\n\
    -   Sams/Que\n-   Linux Systems Labs (LSL)\n-   Mandrake\n-   CheapBytes\n\n此外，通过以下任何方式获取的红帽\
    \ Linux 均不符合红帽支持的资格：\n\n-   红帽 Linux PowerTools 存档\n-   通过互联网上的 FTP 下载\n-   包含在\
    \ Motif 或 Applixware 等软件包中\n-   从另一位用户的 CD 复制或安装\n\n### D.4 红帽支持系统\n\n截至 1999\
    \ 年 10 月，红帽公司已实施新的技术支持系统。如果您过去曾与红帽注册了技术支持，您可能需要再次注册。新系统将实施统一的登录名和密码，该凭证在整个红帽网站范围内有效。支持系统还将自动路由和跟踪服务请求。\n\
    \n如果您尚未注册，那么您应该注册。下面 D.5 节 *如何获取技术支持* 中提供了注册的说明。\n\n### D.5 如何获取技术支持\n\n为了获得您的官方红帽产品的技术支持，您首先需要注册。\n\
    \n每个官方红帽产品都附带一个个人产品识别码：一个 16 位字母数字字符串。红帽 Linux 7.0 的个人产品 ID 位于盒子内部的一张红白卡片上。您的个人产品\
    \ ID 印在一张可撕下的卡片上，您可以将其撕下并保存在安全的地方。您需要这个代码，所以不要弄丢卡片！\n\n> **请注意**\n> 不要丢弃带有您个人产品\
    \ ID 的卡片。您需要个人产品 ID 来获取技术支持。如果您丢失了证书，您可能无法获得支持。\n\n个人产品 ID 是使您能够获取技术支持以及您从红帽购买的其他任何权益或服务的代码，具体取决于您购买的红帽产品。根据您购买的产品，个人产品\
    \ ID 也可能在有限时间内启用优先 FTP 访问权。\n\n#### D.5.1 注册技术支持\n\n您需要：\n\n1.  在 [http://www.redhat.com/now](http://www.redhat.com/now)\
    \ 创建客户档案。您可能已经完成了这一步；如果是，请继续下一步。如果您尚未在红帽网站上拥有客户档案，请创建一个新的。\n2.  使用您的登录名和密码，请在位于\
    \ [http://www.redhat.com/support](http://www.redhat.com/support) 的红帽支持网站登录。\n\
    3.  如有必要，更新您的联系信息。\n\n> **请注意**\n> 如果您的电子邮件地址不正确，关于您技术支持请求的通信将无法送达给您，并且您将无法通过电子邮件找回您的登录名和密码。请确保您提供给我们正确的电子邮件地址。\n\
    \n如果您担心隐私问题，请参阅位于 [http://www.redhat.com/legal/privacy_statement.html](http://www.redhat.com/legal/privacy_statement.html)\
    \ 的红帽隐私声明。\n\n4.  将产品添加到您的档案中。请输入以下信息：\n    -   盒装套装产品的个人产品 ID\n    -   将安装红帽\
    \ Linux 产品的硬件描述\n    -   如果产品是合约，则输入支持证书编号或授权编号\n5.  设置您的客户偏好。\n6.  回答可选的客户问卷。\n\
    7.  提交表格。\n\n如果上述步骤成功完成，现在您可以在 http://www.redhat.com/support 登录并打开一个新的技术服务请求。但是，为了通过电话获得技术支持（如果您购买的产品附带电话支持），您仍然必须使用您的个人产品\
    \ ID。请不要弄丢您的个人产品 ID，否则您可能无法获得支持。\n\n### D.6 技术支持问题\n\n技术支持既是一门科学，也是一种神秘的技艺。在大多数情况下，支持技术人员必须依赖客户的观察以及与客户的沟通来诊断和解决问题。因此，在陈述问题和报告故障时，尽可能详细和清晰是极其重要的。您应该包含的内容示例如下：\n\
    \n-   问题的症状（例如：“Linux 无法访问我的 CD-ROM 驱动器。当它尝试时，我得到超时错误。”）\n-   问题开始的时间（例如：“我的系统运行正常，直到昨天，当时我所在区域发生了一场雷暴。”）\n\
    -   您对系统所做的任何更改（例如：“我添加了一个新硬盘，并使用 'Partition Wizzo' 添加了 Linux 分区。”）\n-   可能与您情况相关的其他信息，例如安装方法（CD-ROM、NFS、HTTP）\n\
    \n#### D.6.1 如何发送支持问题\n\n请登录 http://www.redhat.com/support 并打开一个新的服务请求，或者拨打支持电话号码。如果您的产品附带电话支持，或者您购买了一个\n\
    \n"
