    \n附录 3: 识别主要审计风险的建议文件和信息列表\n\n附录 4: 指南\n\n## 1 引言\n\n欢迎来到*官方 Red Hat Linux 安装指南*。本手册将指导你完成\
    \ Red Hat Linux 的典型工作站级¹安装。一旦你按照本手册所述完成安装，你将拥有一个完全功能正常的 Red Hat Linux 桌面系统。\n\n\
    在本手册中，你将发现以下符号：\n\n**提示**\n\n有关安装选项和安装后配置的建议。\n\n**请注意**\n\n你可能在安装过程中发现有用的额外信息。\n\
    \n**警告**\n\n指出某些选择或配置可能会导致系统设置出现问题。请在继续安装之前仔细阅读正文。\n\n¹ 工作站级安装是家用或桌面机器的完美解决方案。它将为你提供一个图形化工作环境以及你开始工作所需的所有基本应用程序。\n\
    \n![](img/f097eb927132822630978994ad35bce4_9_0.png)\n\n解释将发生的变化会对你的当前系统产生影响，例如删除现有数据。请仔细阅读以确定你做出的选择是否符合你的最佳利益。\n\
    \n## 1.1 如何使用本手册\n\n本手册侧重于工作站级安装，非常适合 Red Hat Linux 的新用户，以及希望快速简单安装解决方案的用户。它将帮助你为系统安装做准备，引导你完成安装，并协助你配置\
    \ Red Hat Linux 系统。\n\n对于需要执行*服务器*级²或*自定义*级³安装的用户，请参考文档 CD 上的*官方 Red Hat Linux\
    \ 参考指南*。\n\n![](img/f097eb927132822630978994ad35bce4_9_1.png)\n\n如果你目前使用 Red Hat\
    \ Linux 3.0.3（或更高版本），你可以执行升级。浏览第 3 章 *七步助你入门* 以复习基础知识，然后阅读第 5 章 *从头到尾安装 Red Hat\
    \ Linux*，并按照指示进行操作。一旦你在安装程序中选择了执行升级，请参阅附录 A *升级你的当前系统*。\n\n如果你是一个经验丰富的用户，想要执行工作站级安装，但不需要复习基础知识，你可以跳过直接到第\
    \ 5 章 *从头到尾安装 Red Hat Linux* 开始安装过程。\n\n2 服务器级安装设置典型的服务器环境。请注意，服务器级安装期间不安装图形环境。\n\
    \n3 自定义级安装允许你选择和配置系统的每个选项。虽然这允许最灵活的安装，但不建议新用户尝试这种安装类型。\n\n"
