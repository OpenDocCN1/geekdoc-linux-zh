    # ## 3.6 Step 6 - Is a Workstation-Class Installation Best For You?


    Although Red Hat Linux includes four different classes, or types of installations,
    this manual only discusses workstation-class installations.


    # ### 3.6.1 What a Workstation-Class Installation Will Do


    In choosing automatic partitioning, a workstation-class installation removes all
    Linux-related partitions on all installed hard drives (and uses all free unpartitioned
    disk space) to create the following partitions:


    +   - A 64MB swap partition.

    +   - A variable-sized root partition (mounted as /) in which all other files
    are stored (the exact size of this partition is dependent on your available disk
    space).

    +   - A 16MB partition (mounted as /boot) in which the Linux kernel and related
    files reside.


    > **Please Note**

    > You''ll need at least 900MB of free disk space in order to perform a workstation-class
    installation.


    This installation will remove *all* existing Linux partitions on *all* hard drives
    in your system; non-Linux partitions will not be removed.


    A workstation-class installation will install your choice of a GNOME or KDE (or
    both) desktop environment, and the X Window System.


    # ### 3.6.2 What a Workstation-Class Installation Will Not Do


    A workstation-class installation will not erase your Windows 3.1/95/98 configuration.
    Instead, it will automatically configure your system to dual-boot using LILO (the
    Linux Loader).


    A workstation-class installation will not allow you to customize your group package
    selection. If you do not want the installation program to select packages for
    you, please choose a custom-class installation and refer to the *Official Red
    Hat Linux Reference Guide* on the Documentation CD.'
