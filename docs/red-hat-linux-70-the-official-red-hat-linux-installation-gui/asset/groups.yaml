    Do whatever is appropriate to boot Red Hat Linux. You should see one or more screens
    of messages scroll by. Eventually, you should see a login: prompt or a GUI login
    screen (if you installed the X Window System and chose to start X automatically).


    # Tip


    If for some reason you need to disable the graphical boot screen, you can do so
    by editing the lilo.conf file and then rerunning LILO.


