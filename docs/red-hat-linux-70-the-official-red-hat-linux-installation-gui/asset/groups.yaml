    # **5.15.4 Unresolved Dependencies**


    The **Unresolved Dependencies** screen will only appear if you are missing certain
    packages that are needed by your selected packages.


    Many software packages, in order to work correctly, depend on other software packages
    that must be installed on your system. For example, many of the graphical Red
    Hat system administration tools require the **python** and **pythonlib** packages.
    To make sure your system has all the packages it needs in order to be fully functional,
    Red Hat Linux checks these package **dependencies** each time you install or remove
    software packages.


    If any package requires another package which you have not selected to install,
    the program presents a list of these **unresolved dependencies** and gives you
    the opportunity to resolve them (see Figure 5–17, *Unresolved Dependencies*).


    Under the list of missing packages, there is an **Install packages to satisfy
    dependencies** check box at the bottom of the screen which is selected by default.
    If you leave this checked, the'
