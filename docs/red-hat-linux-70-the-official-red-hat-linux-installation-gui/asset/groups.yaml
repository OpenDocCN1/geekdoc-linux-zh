    on your system. The next section has been broken down into basic steps that will
    take you screen by screen and help you make the correct choices while installing.


    This chapter only offers the basic information needed to perform a text mode installation.
    The content in the *Official Red Hat Linux Reference Guide* on the Documentation
    CD is more thorough and complete. We recommend that you only use this chapter
    as a quick reference for the material that is presented in the *Official Red Hat
    Linux Reference Guide*.


    ### 6.4 Language Selection


    Using the arrow keys, select the appropriate language to use both during the installation
    and as the system default, and press [Enter].

