  md: '# 5.2.5 Virtual Machine/Operating System Emulation


    A virtual machine is an execution environment in which a program cannot tell it
    is not running on the base hardware. (An application of this idea is discussed
    in Section 4.3.2.)


    The advantage to a virtual machine system is that the emulation software can adjust
    or modify what the program sees. For instance, the virtual machine can appear
    to possess peripherals which do not exist in the actual hardware.


    One of the difficulties in developing an operating system is that an entire machine
    has to be devoted to its development. Whenever a new version of the system is
    ready, the current version of the system must be shut down before the new version
    can be tested.


    A virtual machine provides a perfect environment in which to test or run other
    system kernels. It also provides an avenue for supporting programs written for
    different system kernels.


    # DOSEMU


    No matter how wonderful Linux is, there are some applications which are not available
    to run directly on a Linux system. These applications include many which are available
    to the MS-DOS user. The natural response of the Linux community, given that they
    couldn’t port the applications because of license or trade secret restrictions,
    was to introduce an MS-DOS-like environment to Linux.


    **dosemu** runs as a privileged Linux process—one which can access some of the
    special registers in the processor. This permits dosemu to emulate enough of the
    x86 hardware to trick a copy of MS-DOS into thinking it has full access to the
    x86 hardware. Thus, “dosemu” is somewhat of a misnomer because it does not emulate
    MS-DOS, “intelemu” might have been a better term.


    When **dosemu** starts execution, it loads a configuration file which specifies
