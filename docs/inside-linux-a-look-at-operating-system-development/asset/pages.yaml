- pgno: 244
  md: '# Chapter 9


    # Distribution of System


    Kernels, kits and disks are generated by authors, assemblers and publishers respectively.


    For a while, the Linux kernel was distributed only by way of a few ftp sites,
    and users were expected to get the rest of the system directly from wherever the
    parts were located. This distribution has been superseded by more formal mechanisms.
    Although the kernel versions are still being distributed on a regular basis by
    ftp, others have stepped in to build distribution kits. Each kit contains the
    kernel, a suite of tools ported to Linux, and several floppy disk images needed
    to bootstrap the system. Initially these distribution kits were distributed via
    ftp as well, but a number of publishers have collected one or more of these kits,
    along with an even larger suite of tools, to be published on compact disks.


    # 9.1 Dual Tracked Kernel Releases


    Initial releases of the Linux kernel were numbered 0.xx to indicate they were
    not really ready for prime time. This numbering scheme had some limitations, but
    questions such as “Does 0.11 come before or after 0.2?” were safely avoided and
    the numbering quickly arrived at a limiting value of 0.99. That version was widely
    distributed and it was regarded as the first full-featured version of the Linux
    kernel. There was by then a sizable community of users who depended on a stable
    version of the kernel. Although there were many patches and sub-patches to this'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'version (often arriving daily), the basic version 0.99 was suitable for release.\
    The great release took place at the start of 1994 when Linus Torvalds identified
    a stable patch level, 0.99pl14r, cleaned up a few last problems, and called it
    good. This operation was called a code freeze and resulted in version 0.99pl15,
    which held steady long enough for bug fixes, but no enhancements, to arrive.


    Part of the code freeze and the great release was the recognition that Linux had
    become a suitable foundation for production systems— systems devoted to doing
    useful work instead of being the direct object of a programmer’s interest. This
    posed a dilemma: how could Linux continue to evolve and yet be stable? The solution
    was simple: have two development paths starting from the same point. The even
    numbered releases (1.0.0, 1.0.1, etc.) followed a slow, careful evolution of a
    production system and the odd numbered releases (1.1.0, 1.1.1, 1.1.2, etc.) were
    to be fast-changing, development systems. Version 0.99pl15, with a few fixes,
    was the basis of these two systems. Some important fixes moved 1.0.0 to 1.0.8
    in the early months of 1994, but the production versions saw only a few more changes
    during the rest of the year. By contrast, the development system underwent over
    ninety-five changes in a year.


    In early 1995 a second major release occurred. Again, the stable and well-tested
    features of the development versions (up past 1.1.95) have been incorporated in
    production releases, which are not expected to exceed 1.2.14. Its twin, the development
    version, is the basis of yet more development work and has undergone over sixty
    changes in a year.


    One thing that also happened with the first great release was that the release
    itself no longer held a catalog of its changes. This shortcoming was corrected
    when Russ Nelson ${ }^{1}$ volunteered to distribute a change summary shortly
    after each patch was distributed. Michael Elizabeth Chastain ${ }^{2}$ has since
    volunteered to take up the duty. An archive is maintained on Nelson’s system ${
    }^{3}$.\ ¹ mailto://nelson@crynwr.com\ ² mailto://mec@tredian.shout.net\ ³ http://www.crynwr.com:80/kchanges'
  merge: -1
  img_proc: true
