    # Medium Term


    Short term scheduling deals with the immediate decision: “which process should
    be executing at this instant?” Medium term scheduling is concerned with how the
    system can be tuned to yield better performance. Most commonly, this scheduling
    is done by adjusting the priority of each process on a regular basis. Since Unix-like
    systems are often used for interactive work, interactive processes are generally
    given higher priority and compute-bound jobs are given lower priority. The definitions
    of interactive and compute-bound is a bit fuzzy, but the idea is a process which
    tends to block for keyboard or other I/O is regarded as interactive and a process
    which tends to use its entire time slice is regarded as compute-bound. There is
    also a bias towards smaller processes based on the hope that they’ll get their
    work done and get out of the system. (One method of identifying small processes
    is to integrate the memory use over time.)


    The medium term scheduler can take more severe action by swapping a process out
    of memory to disk. This swapping would be done because of thrashing resulting
    from memory oversubscription. (Although Linux does not swap processes at this
    time, Section 5.4.2 discusses thrashing in greater detail.)


    # Long Term


    This is most commonly found in batch processing systems. The long term scheduler
    decides when additional jobs should be admitted to the system.


    Some interactive systems make a similar judgement to allow more users to use the
    system. An example familiar to many is the mechanism within the ftp daemon which
    limits the number of users who can connect and transfer files.


    In either case, the long term scheduling decisions are performed by a process
    running outside of the kernel.'
