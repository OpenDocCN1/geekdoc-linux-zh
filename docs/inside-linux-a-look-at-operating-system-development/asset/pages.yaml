  md: '# # Chapter 7


    # ## Development Tools


    Most systems are bundled with a large set of development tools. As a consequence
    these tools are typically considered part of the operating system.


    # ### 7.1 Languages


    # #### 7.1.1 Assemblers and Compilers


    Computers decode instructions from bit patterns stored in memory. The instructions
    of early computers had somewhat regular structure due to the constraints of the
    decoding logic. This allowed early programmers to work with *machine code* by
    specifying the bit patterns of each word of instruction memory. This method of
    programming was soon replaced by one which used symbolic names which had some
    mnemonic content. An *assembler* was created to convert the program text into
    the machine code needed by the computer. The assembler improved programmer productivity
    and accuracy.


    # ##### Assemblers


    Assemblers grew in complexity by offering a growing set of features. Assembler
    directives could be used to reserve blocks of storage, skip blocks of memory,
    identify types of code, and most importantly, define and apply macros.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'A macro is a text fragment which is to be substituted for another text fragment
    according to some rule. For example, the fragments


    ```

    ```text

    #define MAJOR(a) (int)((unsigned short)(a) >> 8)

    #define MAX_BLKDEV 64

    ```

    ```


    say that the text


    ```

    ```text

    if (MAJOR(dev) >= MAX_BLKDEV)

    ```

    ```


    should be replaced by


    ```

    ```text

    if ((int)((unsigned short)(dev) >> 8) >= 64).

    ```

    ```


    Assembly language, even when supported by a large set of predefined macro definitions,
    is still a difficult tool with which to write programs. The programmer is forced
    to tend to a huge number of details which have nothing to do with the problem
    at hand. For example, the programmer must recall what information is being held
    in which register at what time.


    # Compilers


    This problem of keeping track of details has led to the design of ever higher
    level languages. Early languages focused on the data transformation found in an
    algebraic expression and converted them into the appropriate machine language
    sequence. These languages had rather primitive constructs for declaring data storage
    requirements and for controlling the sequence of the program. They placed severe
    limits on how data could be identified and how subroutines could be used.


    Over time the languages have grown in sophistication so that programs can be analyzed
    by a special calculus and claims about the program can be tested in a symbolic
    manner.


    For several decades, there had been a trade-off when deciding to use a high-level
    language. It had been commonly held that the machine code generated by a compiler
    wasn’t as good as that produced by an'
  merge: -1
  img_proc: true
