  md: '# ### 4.3.1  Shared File System


    The most common design is to have the system kernel deal with the mapping of file
    names to directory entries and disk block addresses. This design makes it much
    easier for processes (and their users) to share the file system space.


    For instance, as I compose this book, I have multiple processes running, each
    manipulating the various source and result files. One is a terminal session used
    to compose the text, another is a terminal session to edit the bibliography, another
    process is used to view the PostScript output and yet another to view the HTML
    output. Each of these processes is independent of the other, but they have access
    to a shared file system.


    This sharing can go further, where the processes are not only independent, but
    are being run by different users. A shared file system would permit David to share
    his compiler, Ellen to share her editor, Francis to offer an accounting package,
    etc. All they have to do is set access permissions to allow others to execute
    their programs.


    The design of a shared file system has many opportunities for interaction among
    the user processes. Some implementations make the whole file system a single critical
    section, but better systems are designed with finer granularity. The benefits
    are generally regarded as worth the additional effort.


    # **Elements of a File System**


    What distinguishes a file system from a raw disk is its structuring of the data,
    i.e., it keeps track of the locations of multiple files and directories.


    **Files—A Most Basic File System** The most basic file system splits the disk
    into uniform chunks and the user identifies them by an index. (This crude system
    has actually been used in the distant past.)


    **Directories—A Larger File System** Clearly this leads to the idea of the directory,
    a mechanism by which files are identified by a name rather than a number. The
    simplest organization has a fixed length directory with fixed length entries.
    A directory entry has the name of a'
