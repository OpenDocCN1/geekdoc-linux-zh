    # 2.2.6 Philosophy


    All these specific features led to a clear philosophy of how Unix tools should
    be designed as outlined by McIlroy *et al*:


    +   - Make each program do one thing well. To do a new job, build afresh rather
    than complicate old programs by adding new “features”.


    +   - Expect the output of every program to become the input to another, as yet
    unknown, program. Don’t clutter output with extraneous information. Avoid stringently
    columnar or binary input formats. Don’t insist on interactive input.


    +   - Design and build software, even operating systems, to be tried early, ideally
    within weeks. Don’t hesitate to throw away the clumsy parts and rebuild them.


    +   - Use tools in preference to unskilled help to lighten a programming task,
    even if you have to detour to build the tools and expect to throw some of them
    out after you’ve finished with them[35].


    Although this prescription hasn’t been universally followed, it still influences
    how many new tools are built.


