    # **Memory implementation** The Sequent Balance and Symmetry


    systems provide a bank of semaphore memory which aid processors without atomic
    read-modify-write instructions. When the processors read from these special locations,
    a test-and-set operation is performed *in the memory* and the appropriate value
    is returned. The process which *acquired* the semaphore must later write to that
    location to release the semaphore.


    The Tera MTA provides a semaphore per word of memory called the “*empty*/*full*”
