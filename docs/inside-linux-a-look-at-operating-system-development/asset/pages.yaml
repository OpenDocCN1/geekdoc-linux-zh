    # 2.4 Others


    A number of other historical systems have made contributions which have become
    an essential part of Linux.


    # 2.4.1 Multi-User (Timesharing)


    In the mid to late 1960s, while major computer centers were focusing on wringing
    the most performance out of rigidly structured batch processing environments,
    the Compatible Time-Sharing System (CTSS) and the Dartmouth Time Share System
    offered interactive access to computing to a large community of simultaneous users.


