  md: '# Bourne Shell


    Conditional statements differ in syntactic details among the shells, but in all
    cases they offer fundamentally the same capability. The most widely known shell,
    the “Bourne shell” (sh)⁴, has a conditional statement which relies on the status
    value returned by all Linux commands. The syntax of the basic conditional command
    is


    ```

    ```

    if list; then list; fi

    ```

    ```


    where `list` represents a list of `;` separated commands. The status of the last
    command in the first list is used to determine if the second list is to be executed.
    The “Korn shell” (ksh) and the “Bourne again shell” (bash) provide strictly upwardly
    compatible extensions to the Bourne shell.


    The command


    ```

    ```

    if false; true; then date; fi

    ```

    ```


    first executes **false** and then executes **true**. (The external commands **true**
    and **false** are provided by the system.) As a result of the **true** command
    returning success, the conditional command executes `date`. In contrast, the command


    ```

    ```

    if true; false; then date; fi

    ```

    ```


    first executes **true** and then executes **false**. As a result of the **false**
    command returning failure, the `date` command is not executed.


    # C Shell


    The C shell (csh) has a slightly different approach to evaluating the predicate
    of the conditional statement. Instead of executing a list of commands, the C shell
    evaluates an expression using the C-like syntax:


    ```

    ```

    if ( expression ) command

    ```

    ```'
