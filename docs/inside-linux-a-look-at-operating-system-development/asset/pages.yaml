    # 3.2.5 Startup


    One can start the X server and clients explicitly, and it''s instructive to do
    so. If you enter the command X after logging into Linux at the console, the screen
    will flash and, after a moment, it will present a background with a single X as
    the cursor (or pointer).


    This is rather boring because, until you start a client, all you can do is move
    the pointer around the screen.


    If you can get access to the system from another session, you can start one or
    more clients. Then X becomes useful, especially if one of the clients is a window
    manager.


    There are easier ways to start X. xinit is a program used to start the X server
    and run a client program or startup script. By default it starts the server program
    called X in the user''s search path and then it looks for and executes a script
    .xinitrc in the user''s home directory. (Note the leading "." in the file name.)


    If no script is found, xinit starts a client program called xterm in the user''s
    search path. (xterm is a terminal emulator program which normally opens a window
    80 characters wide by 24 lines deep.) By default, xterm starts a user shell which
    can be used to issue commands to load a resource database, initialize a window
    manager, start other windows, etc.


