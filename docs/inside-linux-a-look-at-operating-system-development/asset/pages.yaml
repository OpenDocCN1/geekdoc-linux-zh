    Symbolic links are another form of aliasing which have their own merits and shortcomings.
    For symbolic links, the calls symlink and readlink are used to create and examine
    symbolic links.


    A directory is a place in which to store a collection of file names. Directories
    are scanned with readdir calls and they are created and deleted with the mkdir
    and rmdir calls.


