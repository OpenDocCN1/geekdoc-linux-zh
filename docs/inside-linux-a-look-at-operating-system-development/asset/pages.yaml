    this to work, they must have a presence in some directory. The mknod system call
    is used to create a file system entry which holds information about the device.
    The catch-all function, ioctl, is used for all the fussy, funny things one needs
    to do to a peripheral device which have nothing to do with reading or writing
    characters.


