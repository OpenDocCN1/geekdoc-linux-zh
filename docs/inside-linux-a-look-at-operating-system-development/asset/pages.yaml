    faults and a minimum number of allocated frames. If a process doesn''t get some
    minimum number of frames, it may *never* finish. This is because any given instruction
    can address several different pages. If these pages are not all in memory, that
    instruction will never complete. (And if only $N$ frames are available, the process
    may crawl along because it may have to load a different set of $N$ pages for each
    instruction.) We also see that there is a point, $M$$_i$,'
