  md: '# 5.4.2 Thrashing and Level Of Multiprogramming


    At the time of this writing, Linux newsgroups are discussing at length the problem
    with run-away processes which steal resources from other processes. (Linux, like
    most other Unix implementations, uses a form of global replacement.)


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_195_0.png)


    Figure 5.30: Process memory requirements


    If we look at the behavior of a single process in a virtual memory system shown
