  md: 'fourth, etc., program can be loaded into the remaining free memory as shown
    in Figure 4.12b.


    Multiple processes can run in harmony provided the programs don’t need to grow
    (or sufficient memory was pre-allocated for each).


    After a while, memory will become fragmented, i.e., the free space will no longer
    be all in one contiguous place. Figure 4.13 shows how, after a few steps, the
    free space is fragmented into four smaller chunks. Each time a process is started,
    it is placed in the lowest addressed space which will hold it. When it finishes,
    the space is reclaimed, but the other processes aren’t shifted. As a consequence,
    it is possible that a program which needs less memory than there is free on a
    system will not fit because the free space isn’t contiguous.


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_108_0.png)


    Figure 4.13: Memory fragmentation'
