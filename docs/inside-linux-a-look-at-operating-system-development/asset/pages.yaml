    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_95_1.png)


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_95_2.png)


    Figure 4.3c: Timesliced computation


    A comparison of Figure 4.3a and Figure 4.3c shows how the overhead at every time
    slice causes P1 to take longer even if it is the only job on the system. This
    overhead is the price one pays for the convenience of interactive response. (If
    programs P1, P2 and P3 were not compute-bound, their slices would vary in size
    up to the maximum shown here. It’s also possible that the processor would be idle
    while all four programs await completion of their I/O. I’ve omitted these complications
    from the example.)


    Selecting the proper quantum is not easy. With too large a quantum, the interactive
    performance appears erratic; with too small a quantum, too much overhead is generated.


    Because it is possible to overload a processor, such that system overhead consumes
    all its power, a high level scheduler decision may limit the number of users or
    user programs on the system.


    These two issues of performance tuning—short term and long term scheduling—will
    be discussed later in Section 5.2.4.'
