    # ## 5.4 Memory Management


    Once the system kernel has been loaded, all unused memory becomes a resource which
    can be shared among the processes. (In the case of some micro-kernel systems,
    the rest of the kernel will provide additional processes competing for the dynamically
    allocated memory.) Memory use falls into two general categories: that which is
    visible to the processes and that which is used on behalf of the processes.


    # ### 5.4.1 Virtual Memory


    Any virtual memory system must be built from a set of resource allocation policies
    which decide when to bring a page into memory (Fetch), where to put it (Placement
    and Replacement), when to write dirty pages to storage (Cleaning), how much physical
    memory a process is allowed (Allocation), and how many processes can share the
    system (Load Control).


    # #### Fetch


    The most common fetch policy is *demand paging*. This policy loads a page only
    when it is required. Locality of reference suggests that if a page is needed in
    memory, its neighboring pages may be needed as well. However, *prepaging* hasn''t
    proven to be that useful except when restoring a process which was swapped out.


    # #### Placement


    In the case of segmented memory, placement is a very important issue. Figure 4.13
    showed how good placement decisions could maintain larger chunks of unallocated
    physical memory. Research in this area,'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'in terms of memory allocation, has been limited because most segmented memory
    has some form of paged memory below it, such as seen in Section 4.4.2.


    # Page Replacement


    Virtual memory almost always leads to *over-allocation* of physical memory. i.e.,
    the sum of pages of all processes exceeds the number of frames in the system.


    When the system discovers there are no free frames, it can either suspend or abort
    the needy process (a bad idea) or it can swap out another process (slightly less
    desirable) or it can free some other frames to make room in main memory.


    In the latter case, a *page replacement* algorithm is used to determine which
    is to be the *victim* frame. The most efficient algorithm is the one which results
    in the lowest *page-fault rate*.


    # Optimal Algorithm


    If the algorithm could see into the future, it could just replace the page which
    will not be used for the longest period of time. Obviously a page which will no
    longer be used is the best choice to be used for the incoming page. Less obvious
    is which page to choose among those which will be needed sometime in the future.
    Consider just three pages, P1—the needed page, P2—a resident page needed in the
    near future, and P3—the resident page needed the farthest in the future. We see
    that if P2 is chosen to be victim, P1 may still be active when P2 needs to be
    brought back into memory, but if we chose P3 to be the victim, P1 may no longer
    be needed when P2 has to be brought back into memory.


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_189_0.png)'
