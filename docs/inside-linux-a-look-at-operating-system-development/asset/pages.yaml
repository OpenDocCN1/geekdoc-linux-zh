- pgno: 208
  md: '# # Chapter 6


    # Networks


    It isn''t clear whether network support belongs inside or outside the kernel.
    Arguments can be made for either case. In the case of Linux (and most Unix systems),
    major elements of the networking code reside inside the kernel and other elements
    are user-level programs.


    # ## 6.1  User Process vs. Kernel Feature


    Although it is not really necessary to access the network hardware from within
    the kernel, it does improve performance quite a bit to put the lower layers in
    the kernel. Layers will be discussed in the next section, but suffice it to say
    that the closer the code is to manipulating the raw hardware, the stronger the
    case for kernel mode code.


    As the layers move away from the hardware, it becomes more practical to execute
    the code as a user process.


    # ## 6.2  Advantages of ISO OSI Model


    The International Standards Organization (ISO) developed a model called the Open
    Systems Interconnect Reference Model. It describes a network in terms of seven
    layers such that any layer is described in terms of its interface with adjacent
    layers.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   - *Application Layer* consists of application programs that use the network

    +   - *Presentation Layer* standardizes data presentation to the applications

    +   - *Session Layer* manages sessions between applications

    +   - *Transport Layer* provides end-to-end and error detection and correction

    +   - *Network Layer* manages connections across the network

    +   - *Data Link Layer* provides reliable data delivery across the physical layer

    +   - *Physical Layer* defines the physical characteristics of the network media


    This model is quite useful in that it captures what has been learned about implementing
    networks—keep the pieces (layers) small enough so that they can be understood,
    analyzed, and implemented correctly. Figure 6.1 captures the essence of this idea
    by showing how each layer adds or subtracts its own header (PREFIX), which can
    sometimes contain some trailing bytes as well (SUFFIX), without disturbing the
    encapsulated data.


    The data from the application layer are surrounded by control bits from the presentation
    layer, which are in turn surrounded by control bits from the session layer, etc.
    Upon receipt, the outermost bits are stripped off by the data link layer, the
    next outermost bits are stripped off by the network layer, etc. Each layer is
    concerned only with the control bits (often seen as a header) for its layer and
    is oblivious to what is contained inside. The advantage in this idiom is that
    a different instance of a layer can be substituted without disrupting other layers,
    e.g., the Ethernet Data Link and Physical layers can be replaced by Token Ring
    without affecting the other layers. The physical layer is not shown in this figure
    because it rarely adds any header. Instead it describes how a stream of bits are
    represented as some kind of signal,'
  merge: -1
