  md: 'to point to the two *different* kernel images.


    Although LILO is described as a Linux loader, it can also load MS-DOS. I''ve configured
    my system to boot Linux by default, but it pauses for a few seconds to allow me
    to override that selection and boot MS-DOS instead.


    `/sbin/lilo` does not build pointers to the MS-DOS kernel in the way it does for
    the Linux kernels. Instead it tells the secondary bootstrap to pass control to
    another bootstrap program, commonly held in `/boot/chain.b`, which in turn knows
    how to load and start the normal MS-DOS booting. Another bootstrap program, `/boot/os2d.d.b`,
    can boot OS/2 from a second hard disk.


    # LOADLIN


    Cautious users need not disrupt the master boot records (MBR) of their system
    with the Linux bootstrap loaders. Instead, they can use an MS-DOS-based utility
    called LOADLIN. LOADLIN runs in the so-called real mode of the x86 family (or
    with some effort from the v86 mode). It locates the Linux kernel, shifts itself
    to higher memory (0x90000+), loads the Linux kernel into lower memory, disables
    all MS-DOS operations, and passes control to Linux.


    This places MS-DOS and LOADLIN in the roles of tertiary and quaternary bootstrap
    code respectively.


    # 5.7.4 Network System Startup


    It''s possible to use the network to load Linux. Some utilities such as etherboot
    or nfsboot rely on existing bootstrap ROMs, while others use special ROMs.


    In any case, the program in the bootstrap ROM broadcasts a request on the local
    area network (LAN) for help. A server system recognizes the request and replies
    with an image to load.


    Once the kernel is loaded, the system startup proceeds normally, with the use
    of the NFS-mounted file system instead of hard disk-mounted file system as the
    only unusual aspect.


    > 25 ftp://sunsite.unc.edu/pub/Linux/system/Linux-boot'
