- pgno: 55
  md: 'Unix programs are started by issuing the **execve** system call. The arguments
    to this call are the name of the file containing that program and the arguments
    to be passed to that program. The file must be marked as executable in the access
    control bits. In any event, the new process will normally run with the same privileges
    as the calling process. Section 5.2.2 discusses this further.


    If the file has the **SUID** access control bit set, the new process will take
    on the identity and privileges of the owner of the file. In this way, a Unix user
    can amplify or change access rights for another user. (The Linux system changed
    this rule slightly. An SUID shell script is too easily subverted by crackers.
    For this reason, Linux does not support SUID shell scripts, only binary executables.
    System V has added the same restriction.)


    One classic example using this feature is the **ps** command. Many implementations
    of this command need read-access to kernel memory, something not normally allowed
    an ordinary user. The file containing this command is owned by **root**$^2$ with
    the SUID access bit set. When it is run, it acquires root access to the kernel
    memory. (The **/proc** file system renders this specific example obsolete in Linux,
    but the general need remains.)


    Another example, valid for Linux and all Unix systems, is the **passwd** program.
    The basic user account information is maintained in a password file which is read-only
    to all but the root user. The **passwd** program can override these permissions
    and modify the user''s entry in the password file because it acquires root user
    privileges through the SUID feature.


    Access permissions are also based on group membership. There is a feature called
    “set group id” (**SGID**) which is an analog of the SUID feature that sets the
    group of the executing process.


    As a precaution, the SUID and GUID bits are automatically cleared when the file
    is modified or when the owner or group is changed; the chance of accidentally
    conveying privileges to other processes is reduced. Page 153 has a brief discussion
    of how the execute and SGID bits


    > $^2$The root user, also called the super-user, has extraordinary privileges
    on Linux and Unix systems, including the ability to override access restrictions
    to read and write any file in the system.'
