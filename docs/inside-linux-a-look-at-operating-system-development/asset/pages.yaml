    the major number and minor number for the device. The major number identifies
    which device driver inside the kernel will process the system calls and the minor
    number identifies which port, partition, or other subcategory of the device is
    being accessed.


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_177_0.png)


    Although the file system code is normally the only code which accesses the disk,
    privileged users have direct access to block I/O (structured I/O) devices as well
    as character I/O (unstructured I/O) devices. More commonly, device access is to
    serial ports, keyboard and console, tape drive, floppy drive, line printer, etc.


