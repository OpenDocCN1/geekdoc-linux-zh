  md: '# # Appendix E

    ## Shell Syntax


    ```

    SH

    command:

    if list then list

    { elif list then list }*

    {else list } fi

    case word in [pattern list;]* esac


    while list do list done

    for name in word ; do list done

    for name in $@ ; do list done


    simple_command

    list:

    pipeline ;

    pipeline ; list

    pipeline & list

    pipeline && list

    pipeline || list

    pipeline:

    command

    command | pipeline

    ```'
