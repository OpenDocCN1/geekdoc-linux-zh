  md: '# ## Chapter 0


    # # Preface


    This book provides an informal introduction to a number of operating system issues
    by looking at the history of operating systems, by looking at how they are used,
    and by looking at the details of one operating system. The contents are a conscious
    effort to braid discussion of history, theory and practice so that the reader
    can see what goes on inside the system.


    Because of recurring references to the Linux system, this book doesn’t presume
    to cover “operating systems” in any formal way. Other books do that quite well[46,
    34]. Nor is this book intended to be just a series of tutorials on how to use
    some features of Linux or Unix. There is a growing list of such books on the market
    as well[53, 47]. In spite of these limits, this book will give the computer professional
    a deeper understanding of how Unix systems in general (and Linux in particular)
    operate. Because the Linux kernel code source files are readily available, the
    reader is encouraged to explore the details by examining or modifying the code.


    Traditionally the system kernel and run-time library have been shown as layers
    of software which surround the hardware and insulate the hardware from the user
    programs (Figure 0.1). This book focuses on the shaded areas in Figure 0.1, encompassing
    the system kernel, some parts of the run-time library, some parts of the hardware,
    some of the software development tools, and some user interfaces.'
  merge: -1
  img_proc: true
