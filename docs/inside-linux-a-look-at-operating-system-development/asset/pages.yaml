    # ## Kernel implications


    Why are these formats important to the kernel? First, the kernel must recognize
    the different executable file formats. Second, the run-time code must support
    these conventions.


    # ## Executable file types


    From the very first days of Unix, the first word an executable file contained
    was a magic word which the kernel used to determine how the executable was to
    be handled. By the seventh edition, this was enhanced to support direct execution
    of shell scripts. In the current Linux systems, if the word contains the value
    `0xc231 0x2f`, the hex values for the characters “#!”, the file is identified
    as a script file. Additional text on the first line identify what program is to
    interpret the rest of the file.


    The a.out format has several variants. The oldest magic word, `0407`, comes from
    the PDP-11 implementation of Unix. This specific value, when decoded as an instruction,
    means “jump over the rest of the header to the eighth word of the code”. Thus
    a type `0407` code file was directly executable at address zero.


    Other magic word values have been added for other forms of memory management.'
