  md: '# 1.3 Fundamental Shortcomings


    Linux is not perfect. It has some shortcomings and it is lacking some popular
    features. (I treat these as distinct characteristics because some popular features
    aren’t that beneficial.)


    # 1.3.1 Linux Is Not a Micro-kernel


    The term “micro-kernel” suggests that there is an even more fundamental kernel-like
    element within the kernel. The basic premise to a micro-kernel is that the kernel
    can be built from many nearly-orthogonal specialized kernel processes. These processes
    communicate by passing messages through the micro-kernel to one another.


    The MERT system was developed at Bell Laboratories according to these principles[33].
    Others have followed, including a successful commercial product, QNX$^{6}$, which
    has been in production since 1980; Plan 9$^{7}$ from the creators of Unix at AT&T
    Bell Laboratories; and VSTa$^{8}$, a copylefted$^{9}$ system originally written
    by Andrew Valencia.


    MACH$^{10}$ is a micro-kernel-based operating system from Carnegie Mellon University
    which has been under development since 1985. It has explored a number of ideas
    including


    +   - kernel level support for light-weight threads


    +   - support for multi-processors


    +   - support for different operating system interfaces, including BSD Unix and
    Linux$^{11}$


    Parts of MACH have been incorporated into other operating systems including DEC’s
    OSF/1 for the DEC Alpha, IBM’s OS/2 for the RS6000,'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'NexT OS, and the HURD¹². Further research and development on MACH is being
    done by the Open Software Foundation (OSF)¹³.


    The micro-kernel approach has the advantage of enforcing good modular design.
    If the design is done right, it can be extended to support multiple user threads
    and symmetrical multiple processors.


    There are two important points which must be made about the previous sentence.
    First, one can have a multi-threaded kernel and support multiple processors without
    a micro-kernel. This is the case for almost all commercial systems.


    Second, although it’s easy to implement user threads and symmetrical multiprocessor
    with a micro-kernel, it is hard to do this well. The problem is that careful attention
    must be paid to the design, otherwise bottlenecks will limit system performance.


    The down side to a micro-kernel is that a message passing kernel can often (but
    not always) take more resources than a monolithic kernel because message passing
    uses more instructions than subroutine calls. In the case of a multiprocessor
    system, this is a reasonable trade-off because of the improved performance. In
    the case of a uniprocessor, the required effort can be daunting. Nevertheless,
    there is discussion of how one might build a new Linux using this technology.


    In the meantime, the Linux kernel has the ability to load separately compiled
    modules into the kernel. This means that the kernel can be changed to support
    the actual hardware configuration without costly shutdown/reboot cycles. A developer
    can follow a modify-compile-load-test-unload-modify cycle in driver development.
    The latest efforts include tracking dependencies between modules and even automatic
    load-on-demand of modules.


    # ### 1.3.2 Linux Is Not a Distributed Operating System


    A multiprocessor system enjoys very small delays, comparable to memory access
    times, in communication between the processors. If the processors are moved far
    enough apart to become nodes on a network, and communication delays increase to
    milliseconds or longer, one has a'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'distributed operating system. Because of the increased delay, the division
    of labor shifts dramatically. Instead of sharing work equally and uniformly, different
    processors tend to specialize.


    An essential element remains: the processors are highly interdependent, but their
    presence may not be obvious to the user. Leslie Lamport is credited for the observation
    that “A distributed system is one in which the failure of a computer you didn’t
    even know existed can render your own computer unusable.”


    Linux takes a middle of the road position. It is a single computer system with
    network support. Each system can run stand-alone, but all systems can co-operate
    on the network.


    # ### 1.3.3 Linux Is Not Secure


    This deliberately scary heading exaggerates the case. This heading refers to systems
    which are claimed to be secure against malicious attacks because they fully close
    a lot of paths which are useful when those paths are slightly open. The “Oracle
    book” describes the steps one must take to qualify a system as secure[13]. Linux
    is not nearly any worse than other common systems—few systems are secure in a
    formal sense—and you wouldn’t like using those which are.


    For example, some levels of secure systems prevent a user from learning the names
    of the other users on the system. An even more extreme case involves what are
    called “covert channels”, tricks which permit programs to pass classified data
    by non-obvious methods to other programs in violation of security ratings. Since
    these methods can involve one process watching another process’ memory map or
    even the rate of spawning child processes, a process’ state is entirely hidden
    from other processes. These limitations are anathema to much of how Unix and Linux
    were developed.


    In spite of this warning about security, we are seeing constant improvements in
    Linux security. Unintended and undesirable security gaps are being regularly closed.
    Just don’t expect the Department of Defense, Ministry of Defense, Department of
    War (pick your country) to use Linux for keeping secrets.'
  merge: -1
  img_proc: true
