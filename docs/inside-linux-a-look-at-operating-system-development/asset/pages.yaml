  md: '# 5.4. MEMORY MANAGEMENT


    Although the optimal algorithm has no physical implementation, it is useful for
    post hoc comparison against actual implementations. One needs only to collect
    a reference string showing the order of references to memory pages by the system.
    The optimal page replacement algorithm and proposed page replacement algorithms
    can then be applied to this reference string to determine the page-fault rate
    that each algorithm would have generated. With enough data collection based on
    a good mix of user programs, such comparison will reveal good algorithms.


    **FIFO algorithm** The simplest algorithm to implement just notes the order that
    pages are brought into memory and chooses the oldest page in memory to be the
    victim. In doing so, we are hoping it will no longer be needed. This is clearly
    true if it held some initialization code. It is clearly false if the page holds
    some global variable that was initialized at the start of the program and is still
    being used.


    The FIFO algorithm exhibits a curious phenomenon called *Belady''s anomaly*. Normally,
    we would expect performance to increase (page faults to decrease) as the number
    of memory resident pages increases. As shown in Figure 5.28, applying the FIFO
    algorithm to the reference string 1 2 3 4 1 2 5 1 2 3 4 5 with more frames can
    yield more page faults!


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_190_0.png)


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_190_1.png)


    Figure 5.28: Belady’s anomaly'
