  md: '![](img/bd9544b8c1ad3b1347c84630c5d698e1_198_0.png)


    Figure 5.32: Changing working set size


    **Load Control**  Even with an effective way to determine or estimate the working
    set size of all processes, there remains the problem of keeping \( \Sigma|W_i(t,
    \Delta)| \) less than the memory size.


    This is deemed the "load control" problem and it is one of the most difficult
    issues in tuning system kernel performance. The difficulty lies in the trade-offs
    one must make in denying frames to one or more processes. (Load control is also
    known as balance set management[31].)


    We have seen how frame allocation algorithms are used to force pages out of memory
    on a one-by-one basis. Load control is used to swap entire processes out of memory.


    Swapping in a virtual memory system is motivated somewhat differently than the
    swapping described in Section 4.4.3. In that case, the system was forced to swap
    a process'' state to special storage because all the processes didn''t fit in
    memory. In this case, all the processes fit in virtual memory, but their presence
