    **ISA** This bus is 8–16 bits wide and operates at 8.33 MHz (but nonstandard to
    12.5 MHz). This is the “universal” standard.


    **EISA** This bus is 32 bits wide and operates at 8.33 MHz. This design also supports
    ISA peripherals.


    **VESA local bus** This bus is 32 bits wide and operates at 40  50 MHz. The development
    of this bus design was driven by needs of video controllers, but some storage
    interfaces also use this bus.


    **Micro Channel Architecture** This bus was developed by IBM to solve problems
    with other bus designs. Although a good design, its popularity has been hindered
    by licensing restrictions. It is not well supported by Linux.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'PCI This bus is 32–64 bits wide and operates at 0 33 MHz. This design addresses
    many of the same issues as the Micro Channel. Because it is more expensive to
    implement cards for this design, it is generally limited to high-end systems.


    PCMCIA This bus is an extension, of sorts, of the memory bus and thus is very
    fast. It is common to laptop systems where it provides an easy-to-plug-in expansion
    capability.


    # 8.1.3 Storage


    # Disks


    IDE and EIDE The Intelligent Drive Electronics interface was developed as the
    cost of disk-resident electronics dropped. The IDE interface provides low-cost
    access to disks from the personal computer. The original protocol was rather limited,
    e.g., only a single drive could be accessed and the data transfer rates were small.
    The Enhanced IDE has addressed some of these problems, resulting in quite respectable
    performance.


    SCSI The Small Computer Systems Interface defines a bus which can be used to exchange
    data among eight units. Typically one of these is a computer interface, allowing
    for up to seven peripheral units. Although these units are often individual disk
    drives, each unit supports up to eight Logical Unit Numbers (LUNs). This is especially
    convenient when a unit has multiple drives, such as a CD-ROM jukebox.


    # Tapes


    Although Linux has some support for the traditional 9 track tape, most users rely
    on some form of tape cartridge.


    QIC The Quarter Inch Cartridge tape has been an industry standard for many years.
    There are three or four common cartridge sizes, each with a variety of tape lengths.
    One can store from 100 Mbyte to 1 Gbyte on these drives.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '**8 mm** This is the same format as the small video tape. The dominant manufacturer
    in this market, Exabyte, provides drives which can store 2–5 Gbytes of data on
    a single tape.


    **4 mm** This is the same format as the Digital Audio Tape. Several manufactures
    co-operated in creating the standard for recording data on these tapes. While
    these drives hold less data than the 8 mm drives, some features such as “fast
    seek” are a bonus.


    # ### 8.1.4 Asynchronous Communication


    **individual ports** Almost every personal computer comes with one or two asynchronous
    ports. These are typically driven by single chip controllers, such as the 8250,
    16450 and 16550, which provide character buffering, bit stream serialization and
    modem control. They are often limited to speeds below 50 Kbits/sec.


    **multiplexor ports** Larger systems have a single interface card which provides
    support for a number of serial ports. These cards offer higher performance and
    a smaller burden to the system (in terms of interrupts/char, number of control
    ports, and number of interrupt vectors).


    # ### 8.1.5 Network Communication


    Until recently, the standard network connection for Linux systems took two forms:


    +   * Ethernet

    +   * serial async (SLIP or PPP)


    The Ethernet offers 10 Mbit/sec speeds, but is limited to a maximum of 500 meters
    (or a bit more with the use of bridges). The serial async connection has no such
    distance limits, but performs no better than 28.8 Kbit/sec.


    Linux now supports, or will soon support, direct connections to:


    +   * Token Ring'
  merge: -1
  img_proc: true
- pgno: 241
  md: '+   ISDN


    +   Frame Relay


    These will offer higher bandwidth than the serial async connections.


    # 8.2 Support of Unusual Peripherals


    **CD-ROMs** This device is not really that unusual, but the story behind the creation
    of the SCSI driver is interesting. Part of the driver depends on code common to
    all disks, but part of the protocol must deal with the different request-reply
    sequences that are device dependent. Someone posted a query about the CD-ROM sequence
    in a news group, someone else posted a list based on his work on a driver for
    MS-DOS, then someone else posted a patch file for the driver which incorporated
    this sequence. All of this discourse occurred within 48 hours—perhaps a record
    for adding support for a new device!


    **CD-ROM jukebox** This is a popular device for holding large collections of software
    on-line. Jukeboxes with SCSI interfaces are trivially added to Linux systems.
    The only requirement is that the kernel must be configured to support multiple
    LUNs (logical unit numbers). Once this is done, each LUN behaves as a distinct
    SCSI device. References to a LUN automatically trigger the jukebox to load the
    appropriate CD-ROM.


    **CED 1401** This laboratory interface has a package¹ for user program control.


    **Precision clocks** There is great advantage in keeping the system’s clock correct.
    If the system is constantly connected to the Internet, the ntp² utilities can
    be used to synchronize the system’s clock against other standards. As a bonus,
    this same software has support to talk to a number of specialized clocks which
    receive broadcast radio signals or have a precision time source inside.


    ¹ftp://tsx-11.mit.edu/pub/linux/packages/lab/ceddrv-xxv.tar.gz


    ²ftp://louie.udel.edu/pub/ntp'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Frame grabbers A television camera, a frame grabber, and software $ ^{3} $
    $ ^{4} $ are sufficient to give the Linux user access to images.


    GPIB Another interface for laboratory instrument control is the General Purpose
    Interface Bus, defined by the IEEE488 standard. There is at least one driver $
    ^{5} $ for this interface.


    MIDI Although this is not normally a part of Unix systems, the common availability
    of this interface for the PC has led to the early inclusion of a driver in the
    kernel.


    Now that loadable driver modules are a configurable feature of the Linux kernel,
    users find adding new drivers to be reasonably straightforward—especially if they
    can be derived from existing drivers.


