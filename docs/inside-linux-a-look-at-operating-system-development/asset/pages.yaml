    Normally, file system access passes through a run-time library and the system
    kernel to the disk hardware as shown by the dotted line on the left side of Figure
    5.26. This user level implementation binds an additional run-time layer to a program
    so that all I/O calls are monitored and if any deal with remote file access,'
