    # Data


    The blocks containing the data are rather ordinary. As has been suggested by the
    inode structure, data blocks can be scattered throughout the partition. One performance
    enhancing aspect is that the system attempts to cluster blocks to improve access
    performance. Each contiguous chunk in a file is better than holding the same data
    in non-contiguous blocks because a single disk transfer can load or store all
    the data.


    A space saving enhancement uses a single data block to hold the contents of several
    small files. Any of these files that would be extended beyond their fragment are
    copied to whole blocks and the fragments can be reclaimed.


    A final enhancement has been proposed to hold very small files, less than 50 bytes,
    in the inode where the pointers to data blocks are now held. Internally, this
    will be a distinct file type, but to the outside world it will appear as an ordinary
    data file. This enhancement improves performance and saves disk space.


    # Directories


    Both ordinary data files and directories are collections of text and data, but
    directories are the exception to the rule that Unix files are uninterpreted by
    the system kernel. Each directory contains names of a number of files and directories
    and the inode of each. A special call `readdir` is used to access directory entries.
    Linux and many recent Unix systems actually forbid accessing a directory with
    `read` calls. Earlier versions of Unix implemented `readdir` as a library call.


