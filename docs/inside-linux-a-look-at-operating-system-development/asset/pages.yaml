  md: '# CHAPTER 3. USER INTERFACE


    is first split into the tokens “(”, “date”, “;”, “echo”, “hello world”, “)”, “>”,
    and “tmp.file”. The “;” token separates two distinct commands. The shell executes
    the command date and then executes the command echo with the argument hello world.
    Because the tokens “(” and “)”) surround both of these commands, the output of
    both are redirected, because of the “>”, to the file tmp.file.


    Generally the shell will split strings into distinct tokens wherever it sees what
    is called whitespace (one or more blanks or tabs) unless some special quoting
    mechanism is used. You can see that something special has already happened because
    the pair of “" caused the string of characters “hello world” to be treated as
    a single token. You will also notice that there was no whitespace after the “(”
    or on either side of the “)”) or the “>”. This is because the shell also recognizes
    a number of characters as appropriate for delimiting a token without the need
    for whitespace.


    # Filename expansion


    Most shells support additional special characters, most importantly as wild card
    characters in file names. For instance “\*” stands for “zero or more characters”
    in a file name.


    When the shell discovers a string with one of these characters in it, it replaces
    that token with a sorted list of all the file names which match that string pattern.
    If the files “at”, “bad”, “bat”, “cat”, “flat”, “rot”, and “rat” are in the current
    directory, the string “\*at” is expanded to “at bat cat flat rat” and then tokenized
    into the list “at”, “bat”, “cat”, “flat”, and “rat”. Almost every shell has the
    “\*” wild card character. Different shells have different additional rules for
    wild card expansion.


    Some shells have argument expansion rules which do not depend on file names, but
    rather they create arguments according to a pattern-matching rule. For example,
    the C shell expands “\{a,b\}\{0,1\}” into the list “a0”, “a1”, “b0”, and “b1”,
    even if files by those names do not exist. A slightly different input, “\[a,b\]0,1”,
    would expand into the same list only if those files existed locally. That is,
    the tokens “[” and “]” are an extension of the wild card mechanism, but the tokens
    “{” and “}” provide an entirely different way to build strings.'
