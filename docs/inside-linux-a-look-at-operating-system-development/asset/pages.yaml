    it doesn’t use an architecture to emulate itself. Instead it qualifies as a system
    emulator which offers sufficient fidelity to support most every application which
    runs on a Macintosh. See the web$^{8}$ or ftp$^{9}$ sites for details.


    # 5.3 Input/Output


