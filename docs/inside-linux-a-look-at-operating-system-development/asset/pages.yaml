  md: '![](img/bd9544b8c1ad3b1347c84630c5d698e1_17_0.png)


    # 0.1 Motivation


    I''m a hacker who knows better.


    My first programming experience was in high school, when my algebra teacher wrangled
    some machine time from some of his former co-workers so that we could try our
    hand at FORTRAN II ($\dagger$) programming. In college I studied physics and mathematics—computer
    science degrees were only being offered at a few universities at the time.


    In spite of my lack of formal training—the college offered no classes in programming
    as such—I got a job at the college''s computer center and actually got paid for
    writing a program for one of my professors.


    That led to a ten year career in programming during which I learned a bit of computer
    science by watching and doing. It was only in the late 1970s that I held a position
    where we discussed what we were doing and how others might do it. During these
    discussions I realized how little I knew about my chosen field.


    About that time, I moved to a city that possessed a research university with a
    good policy for continuing education. One class led to another and I easily fell
    into a program of study that eventually led to graduate degrees in computer science.


    Unlike many of my fellow students, I had significant practical experience in compiler
    modification, networking, task schedulers for embedded applications, and system
    management. Because of this background, the material I was studying fell into
    four categories:


    +   • I know that—$I\ use\ it\ every\ day$'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'I knew that—but I had forgotten


    I didn’t know that—this is new


    You can do that?—this is amazing


    At the same time I was matriculated, I was hired by the department to install
    and manage their Unix systems. The Berkeley Software Distribution (BSD) contained
    all the sources, so when something broke or when something wasn’t clearly documented,
    I could dive in and find out what was really going on. I was able to examine the
    implementation of the theories being discussed in my courses. Later, I taught
    classes in programming languages, operating systems and software engineering.
    This course of work, study and preparation showed me the errors of my earlier
    ways—my bad habits and limited understanding were exposed. Although I now know
    how much more I don’t know, I also know more than I did when I started and I’d
    like to share this knowledge. There is a meme\(^1\) out in the world that “examination
    destroys appreciation.” I think this idea is wrong—one cannot appreciate craftsmanship
    without examination.


    I like to tell the story of my wife’s clearest demonstration of computer literacy.
    At the time she was a reluctant user of computers—except for games, she used them
    only for word processing. With the aid of \textbf{vi} and \textbf{nroff} she struggled
    through over twenty revisions of her thesis. I often watched over her shoulder
    and suggested new formatting commands or new methods of moving text around.


    She had gained enough sophistication to be horrified when she discovered the department
    secretary had been physically cutting and pasting output from a word processing
    system. The reason: “I’ve deleted and re-entered this paragraph several times,
    but it always comes out doubled.” She advised the secretary (correctly, it turned
    out) there had to be something embedded in the file that said “duplicate the following.”


    The key was that even though she had no experience with that specific system,
    she had learned what word processing systems could do in general and she could
    identify likely behavior.


    > ^1 This term was coined by Richard Dawkins to name a unit of replication in
    the ideosphere, e.g., an idea, catch-phrase, tune, or technique. Memes propagate
    by being passed from one person to another.'
