  md: '![](img/bd9544b8c1ad3b1347c84630c5d698e1_110_0.png)


    Figure 4.14: Program overlays


    # 4.4.2 Mapped


    If the programs do not co-operate, through malice or by mistake, they may corrupt
    one another by writing into the other''s space. A number of methods have been
    developed to provide hardware-based protection.


    Most of these rely on some mapping from the *logical address* generated by the
    program to the *physical address* used to access memory. When the *logical address*
    is not always mapped to some *physical address*, it is referred to as a *virtual
    address*.


    # Base & Bounds


    As mentioned earlier, the most simple program loading is to a known base address.
    A simple hardware mechanism, outlined in Figure 4.15, can be used to “trick” the
    program into running as if it were loaded into a different location. This relocation
    hardware relies on two internal registers: the “Base address” establishes the
    base address of a chunk'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'of physical memory and the “Boundary value” holds the size of that chunk. As
    the processor generates a “Logical address” (for instruction fetch, data storage,
    stack, etc.), the hardware simultaneously adds that address to the base address
    and compares it with the boundary value. If the logical address is positive and
    doesn’t violate the size limit, the physical address is used to access memory.
    If the logical address is negative or too large, the memory access is regarded
    as an error.


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_111_0.png)


    Figure 4.15: Hardware memory mapping


    With this hardware in place, the system and the program have different images
    of memory. With multiple programs running, the system must also change the base
    and bounds registers when it switches among the programs. As shown in Figure 4.16a,
    the system can see all of memory, but Figures 4.16b and 4.16c show the user programs
    only see the portion starting at the base address and the size given in the bounds
    register—and they see this memory as starting at location 0.


    If you’ve noticed, the user program can no longer directly access the system kernel
    or run-time library. This is not a flaw because there exist special instructions
    which allow the execution to switch from code in a user program to code in the
    system kernel.'
