- pgno: 26
  md: '# # Chapter 1


    # ## Why you need Linux


    Until recently, Linux has been regarded as a hobbyist''s system. It started out
    as a project by a student, Linus Torvalds, to see how the memory management hardware
    of the Intel 386 really worked. That is, Linus wanted to identify what detailed
    steps were required to build a practical virtual memory system with that hardware.
    Since he shared his code on the Internet, there was opportunity for others to
    make their own contributions to the system. This development process has now been
    in operation for over five years. Appendix D provides a timeline of the development
    of Linux.


    Although Linux clearly started out as a student project, it is now regarded as
    an appropriate foundation for many commercial products. Linux has become the operating
    system of choice for hundreds of thousands of users worldwide¹.


    Over the past decade we have seen the establishment of three categories of computer
    systems: the large scale systems supporting large commercial, engineering or scientific
    operations; the workstation supporting a single engineer or business worker; and
    the personal computer used at home. The large scale systems run expensive operating
    systems requiring a support staff for system management. The workstations run
    some flavor of Unix and are administered by a small staff or an experienced user.
    One might suggest the personal computer is run without management—at the whim
    and abilities of the individual.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The boundary between these categories is changing due to encroachment from
    below. The mini-computers and micro-computers have always held a price/performance
    advantage, but now that their absolute performance has grown, they are able to
    replace many traditionally larger and more expensive systems.


    Many large Unix systems are being replaced by high-end siblings of the Unix workstation
    and workstations are being replaced by high-end personal computers. This change
    has been characterized as the “attack of the killer micros”.


    These changes have fogged the boundary and one should not dismiss Apple and Microsoft
    systems as toys, nor should one assume Unix is only for workstations. No other
    operating system covers a wider performance spectrum. A Unix-like interface is
    available for the most powerful supercomputers and $1500 lap-top computers.


    Unlike the proprietary systems such as Apple Macintosh, MS-DOS and Windows 95,
    there is nobody to count licensed users of Linux because Linux requires no license
    to operate. It is largely covered by the GNU Public License (GPL), shown in Appendix
    F, which includes the idea that once you''ve got a copy, you can pass it on. Therefore,
    we can only estimate the number of Linux systems in operation. You are encouraged
    to register$^{2}$ your system(2).


    Because Linux is a complete operating system, it is an object worthy of study
    as a part of learning how operating systems work.


    # ### 1.1 Why Is Linux Popularity Growing?


    The next three paragraphs may put you into jargon overload. Don''t worry, we''ll
    explore what the terms mean in Sections 1.2, 1.3, and 1.4.


    Linux is clearly superior to all the competition because Linux is a free, robust,
    high performance, multitasking, multi-user, networking, virtual memory, open system
    with a large development toolset and a growing set of application programs that
    use cost effective hardware. No commercially produced operating system can claim
    all these features.


    Linux has what could be called shortcomings. It is not built on a micro-kernel,
    nor is it a distributed operating system. It is not secure'
  merge: -1
  img_proc: true
- pgno: 28
  md: '(according to strict criteria), nor was it formally designed or tested, nor
    is it written in a modern programming language. We''ll explore why these so-called
    shortcomings do not harm Linux''s reputation.


    Linux is undergoing rapid change. New kernel versions are distributed about once
    a week. Some of the changes are due to fixes, but most are new features or improvements.
    In addition, there are major new projects underway which will offer symmetrical
    multiprocessing, and support for MS-DOS and MS Windows programs.


    # ## 1.2 Features


    Linux has a multitude of attractive features. A detailed examination of all of
    them would fill this book, but the following sections give a brief overview. In
    some cases, the section will also explain *why* some feature is useful. (This
    explanation is necessary because some of these features may be foreign to the
    reader''s experience.)


    # ### 1.2.1 Linux Is Free


    Some software is expensive. Developers have found that they can profit by selling
    a small number of licenses at a high price. Other developers have discovered that
    they can profit by selling a very large number of licenses at modest price. Some
    have gone so far as to cut marketing and distribution cost to nothing and distribute
    their product free, asking that the users voluntarily send license fees directly
    to the developer.


    The Free Software Foundation$^{3}$ noted that software redistribution was limited
    by licenses. It also noted that all of the traditional licensing methods have
    one thing in common: the source is rarely available to the end user. In response,
    they developed the GNU Public License (GPL) which says in part:


    > > You may copy and distribute verbatim copies of the Program''s source code
    as you receive it, in any medium, provided that you conspicuously and appropriately
    publish on each'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'copy an appropriate copyright notice and disclaimer of warranty; keep intact
    all the notices that refer to this License and to the absence of any warranty;
    and give any other recipients of the Program a copy of this License along with
    the Program.


    This ensures that access to the source does not become restricted. It also says:


    > You may copy and distribute the Program ...in object code or executable form
    ...provided that you also...Accompany it with the complete corresponding machine-readable
    source code.... [or offer to make a copy upon demand].


    This ensures that the source must be made available with the object or executable.


    Linux is bound by this free-to-copy policy and, as a result, Linux distributions
    are readily available on the Internet at no cost to the user. The same license
    allows commercial distribution of the system on CD-ROMs. Since the system is freely
    available, the CD-ROMs are priced to include only modest profits and thus they
    include more software for less money than any other software in the world.


    # 1.2.2 Linux Is Robust


    Linux was not developed using formal methods or many of the modern software engineering
    techniques. It does, however, exploit one well-known method for building better
    software: code review.


    This code review is unlike that usually found in commercial software development
    environments. The recommended practice is for the author to meet with several
    reviewers - all of whom have studied the program before the meeting. The review
    is conducted by someone other than the author in a non-confrontational setting
    - where the goal is to identify flaws or misunderstandings.


    The Linux model cannot support meetings because the members of the development
    team are spread across many continents. Even if they lived in the same town, they''d
    be subject to the schedules of their job, family, etc. Therefore, they rely on
    a well understood process of'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'releasing code at various levels of confidence to an ever-growing user community
    on the Internet.


    This user community subjects the code to study and test according to the user
    expectations and, on rare occasion, the specifications. Since the entire program,
    in its source form, is exposed to the world, there is a rush to find and fix flaws
    that is rare in commercial software development settings.


    As a bonus, or perhaps as a side-effect, there is a certain amount of self-selection
    among the programmers. No one is directed to “design and code” something outside
    of their experience. Instead, changes are made because the contributor has some
    expertise to share.


    Finally, releases are not subject to external synchronization. Instead, they are
    made as soon as fixes or enhancements are completed. Thus Linux is *robust* but
    constantly changing.


    Some people are scared by a constantly changing system. They’d rather have a system
    with well known flaws and well known work-arounds. The danger with this approach
    is that on flag-day, when a major new release is finally installed, a large number
    of surprises ambush the users. For this reason, some users stick with years-old
    system releases. With Linux the changes are modest from one release to another.
    A cautious user can follow the crowd at a distance, upgrading to new versions
    at a modest rate, and have the assurance that no problems lie in ambush.


    This process of following the leaders is encapsulated in the dual track for releases.
    Section 9.1 describes this process in greater detail.


    # 1.2.3 Linux Offers High Performance


    The best performance is achieved when the application is executed with no system
    kernel overhead. Certainly this holds for what are called “embedded systems”,
    where the system’s function is limited and rigidly defined.


    Unfortunately this doesn’t apply when the system is intended to be general purpose.
    In that case, there’s always some overhead—the trick is to keep it small.


    Linux does a good job at that because there is constant pressure (and continual
    changes) to reduce the overhead of Linux system calls.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Other systems with comparable features use much more memory or run slower than
    Linux.


    Linux offers high performance in another sense: it has been ported to some of
    the fastest microcomputers on the market and it has been ported to symmetrical
    multiprocessor systems.


    # ### 1.2.4 Linux Has Multitasking


    Multitasking implies concurrent execution of peer programs. Each process is (potentially)
    entitled to the full resources of the system. Each process can be greedy in allocating
    resources—the system will mediate among the processes. Processes are created as
    children of parent processes. The new process acquires the privileges and has
    the same ownership as the parent process.


    Process scheduling is based on priority, history, resources, etc. Lower priority
    processes execute less than higher priority processes, and the priority of a process
    changes over time to meet scheduling goals as discussed in Section 5.2.4. (Internally
    the most important (greatest priority) process has the lowest value for its priority,
    but some utilities and system calls try to correct this so that more important
    processes have higher valued priorities. This is a trap in any discussion of Unix
    system priorities.)


    System calls are implemented as an extension of a user process and the code isn''t
    interrupted within the kernel. Because system calls are generally of short duration,
    this is usually no hardship. In the cases where the process must block, task switches
    do occur inside the kernel. This general design is common to almost all Unix kernels.


    # ### 1.2.5 Linux Is Multi-user


    Linux permits multiple users simultaneous access to the system such that each
    user is protected from accidents and malicious acts of other users. Each user
    can have a personalized environment, and resource use can be monitored and limited.
    Users can share programs and data and their programs can communicate with other
    user''s programs.


    Most other personal computer operating systems do not have this feature. This
    was claimed to be unnecessary because the computers'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'were “personal”. When we consider a family sharing a computer at home or colleagues
    sharing a computer at the office, we see this claim was ill-founded.


    # 1.2.6  Linux Has Networking


    Linux best shows its Unix heritage in its networking ability. All the common utilities
    such as `telnet`, `ftp`, NFS, `rlogin` (remote login), `rsh` (remote shell), and
    the X Window System are fully supported by code derived from code released by
    the University of California—Berkeley and MIT.


    In addition to these traditional utilities, other programs such as World Wide
    Web browsers and multi-user games have been ported to Linux.


    A number of physical device drivers have been added so that Linux can communicate
    via dial-up modem, leased line, Ethernet, parallel port, and ISDN.


    # 1.2.7  Linux Uses Virtual Memory


    Another great advantage of Linux is that it offers a simple memory model to the
    user programs—it has a uniform address space of $2^{32}$ bytes which can be addressed
    by a 32 bit pointer ${}^{4}$. Anyone who has programmed recent x86 hardware knows
    there are several memory models to choose from. Most commercially produced operating
    systems use a restrictive model, compatible with the oldest x86 processors, which
    requires segment registers to be changed in co-ordination with a pointer register.
    When Linux is used on an Intel based system, it demands a 386 or later processor
    and, as a consequence, it can offer a simple memory model which doesn’t require
    two registers to be manipulated when accessing all the memory on the computer.


    Linux presents a large address space to each user program. This space is divided
    into 4096-byte pages. If there is enough physical memory, and the demands of the
    user programs are small enough, the hardware just maps from pages to pieces of
    physical memory called


    > ${}^{4}$This is also called a flat address space.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'frames. If there is insufficient physical memory, Linux uses space on disk
    to hold copies of the pages which are moved into and out of memory as needed.
    This virtual memory is discussed further in Section 4.4.4.


    # ### Other uses for Physical Memory


    An outstanding feature of Linux is that it puts all physical memory, except that
    used to hold the kernel code, into a common pool. Memory is taken from this pool
    to provide frames for the virtual memory system and buffer blocks for disk caching.


    The results can be surprising to the uninitiated: when compiling a large program
    (such as the kernel) on a memory-rich system, one will find the disk rarely operates
    for the second and successive iterations. This is because all the disk data have
    been cached in memory. The system can just copy data between the cache buffer
    block and the user program instead of performing disk I/O.


    # ### 1.2.8 Linux Is an Open System


    This term requires some explanation because there are several meanings of open
    system. The first (and formal) sense is that a system conforms to published standards.
    This is intended to ensure that programs written to those standards can be ported
    to other open systems. The second (and often implied) sense is that there are
    no hidden elements. Some systems fail to meet this second meaning because, although
    they provide all the features of a standard, they provide some additional features
    which can only be exploited by the knowledgeable. Linux comes closer to meeting
    the POSIX[3] standards than any other operating system, and if there’s any doubt,
    all the source code is available for inspection by any interested party. These
    standards are discussed further in Section 5.1.1.


    # ### 1.2.9 Linux Has a Large Development Toolset


    Unix has been under development for over twenty-five years. During most of this
    time, it has been used by its developers for further development. This has led
    to Unix being the best tool for developing Unix.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Linux has followed the same path in its short life. Netnews, a net-work based
    bulletin board system, has been used to great advantage because it encourages
    the convenient discussion of problems. Since Linux is self-hosted, developers
    find it easy to add fixes for problems which get in their way.


    Linux has benefited greatly from the Free Software Foundation<sup>5</sup> GNU
    (GNU’s Not Unix) project. This project set out to replace Unix with a system free
    of the licensing constraints. Although FSF has recently released the HURD kernel,
    a large number of tools, including superior compilers and editors, have been released
    over the past years. Since these tools were written with an open system in mind,
    it was a simple matter to incorporate these tools into the Linux distribution.
    Most of these tools are of the system development and text processing flavor.


    The GPL, which was designed to promote free software, has sparked a remarkable
    amount of commercial development. Enlightened hard-ware vendors have contributed
    drivers for their hardware with the un-derstanding that this will promote sales
