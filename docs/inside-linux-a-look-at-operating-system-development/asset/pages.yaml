  md: '# ## Chapter 2


    ## Prologue to Linux


    Linux did not appear out of thin air. It is the outcome of years of computer system
    development. If we look back, we can identify a number of seminal ideas that have
    been incorporated into Linux from other systems.


    # ### 2.1 Multics


    In 1964-1965, General Electric, Bell Telephone Laboratories, and Project MAC at
    MIT entered into a partnership to build an operating system for a large computer.
    This system was to be known as Multics—an acronym for Multiplexed Information
    and Computing Service.


    Official support for this operating system has now been withdrawn by all of the
    original parties, but there still exist a few operational Multics sites. There
    is also a group of Multics fans and users which supports a net news group$^1$.


    A number of books and papers have been written about Multics, most significantly
    Organic[k37]. Some of these explore the demise of Multics. None suggests Multics
    had fundamental design problems and most extol a number of original ideas that
    are slowly making their way into other operating systems.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Although Multics has not inherited the full utility of security rings as used
    by Multics, they are mentioned here because they, along with an elaborate procedure-calling
    mechanism, were used to provide both great power and great security to the system.


    This led naturally to a layered model of an operating system, which in turn led
    to the natural conclusion that the interactive user’s access to the system kernel
    did not have to be integral to the system kernel.


    # 2.1.2 Shell


    Up to this time, installing a new command line interpreter was a difficult venture.
    With Multics, a system administrator, or even the user, could specify how terminal
    interaction was to be interpreted because command interpretation was performed
    by a separate program—called the shell.


    # 2.1.3 File System


    Files on the Multics system were accessed via high-level operations that concealed
    the block structure of the disk. The user simply invoked an operation (read/write/etc.)
    with a file handle, buffer, and byte count as arguments.


    Files were organized by a tree-like structure of directories, subdirectories and
    ultimately, files.


    File data were uninterpreted by the system kernel. Although the applications could
    apply any interpretation desired (records, numbers, etc.), the system kernel only
    manipulated streams of bytes.


    As a natural side effect, text files were treated as a stream of characters with
    a single end-of-line character separating lines. As a result, user programs could
    rely on easy access to data.


    # 2.1.4 Dynamic Libraries


    Most programs rely on collections of support subroutines held in special files
    called libraries. These libraries permit the programmer to reuse code others have
    written to parse a command line, sort an array of data,'
  merge: -1
