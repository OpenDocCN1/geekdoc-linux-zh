- pgno: 112
  md: '# Segmented Memory (Multiple Base & Bounds)


    Some shortcomings to a single base and bound system are that all of the process
    memory must reside in a *contiguous* area of physical memory and that all of the
    process memory is *equally accessible*.


    As the processor executes a program, it really references memory for several different
    uses. The processor can be extended to take advantage of this characterization
    of memory by using different base and bound register sets to access separate memory
    *segments*. To the user process, an arbitrary pointer to memory now has two components:
    the segment number (which yields a base and bound pair of registers) and the offset
    within a segment. Figure 4.17 shows how segment 0 can be used to address the run-time
    library, segment 1 can be used to address the program code, segment 2 can be used
    to address the heap, segment 3 can be used to address the stack, and (hypothetically)
    segment 4 could be used to address memory shared with another process, etc.


    Since different memory segments serve different purposes, it’s quite reasonable
    to *restrict access* to a specific purpose. That is, a code segment can permit
    instructions to be fetched for execution but they cannot be read as data; a data
    segment can be restricted to read-only access.


    This finer control over access permits processes to share code without the danger
    of the code becoming corrupted. Co-operating processes can share some data without
    yielding full access to all data to the other process.


    This has been taken to an extreme on some systems where the two components (segment
    number and offset) are taken as a single object to be passed about and used as
    a pointer. In these systems, the number of segments can be quite large, perhaps
    as many as one for each array, etc.


    # Paged Memory


    Segmented memory provides good access control and, if pointers consisting of segment
    number and offset are used directly by the processor, a large address space becomes
    available to the user.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/bd9544b8c1ad3b1347c84630c5d698e1_113_0.png)


    Figure 4.16: Mapping memory with base and bounds register


    While segmented memory makes better use of physical memory than either non-mapped
    memory or single base and bounds remapping, it is still restrictive because the
    size of memory segments cannot be changed with ease.


    The memory fragmentation problem shown in Figure 4.13 is not really solved by
    hardware support for segmented memory. The mapping hardware only relieves the
    system kernel from relocating (patching) the program and data when they are loaded
    into the system. Although memory is accessed indirectly through mapping hardware,
    each segment must reside in contiguous memory. This requirement for contiguous
    memory also makes it very difficult to extend a memory segment (such as one used
    for the stack or heap memory).'
  merge: -1
  img_proc: true
- pgno: 114
  md: '![](img/bd9544b8c1ad3b1347c84630c5d698e1_114_0.png)


    Figure 4.17: Mapping memory with multiple segments


    Both of these problems are addressed with a paged memory system. Paged memory
    can be thought of as a variation of segmented memory, where memory references
    consist of a page number and an offset instead of a segment number and offset.
    Because all pages are the same modest size, there is no need to validate the offset.
    There is, however, a need to validate the page number.


    In Figure 4.18, the page number part of the logical address is compared with a
    limit and if it is within an acceptable range, it is used to index into a page
    table. The Nth page table entry contains a frame number, which, when combined
    with the offset part of the logical ad-'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'dress, becomes the address in physical memory. Additional bits in the page
    table entry (not shown in this figure) can indicate the access permissions for
    that page.


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_115_0.png)


    Figure 4.18: Mapping memory through page table


    The big advantage in a paged memory system is that the pages need not map to contiguous
    physical memory. When a new process is loaded into memory, its size in pages must
    be satisfied by that number of free frames, but the frames need not be contiguous.


    The *external* memory fragmentation described in Section 4.4.1 is'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'now gone. Paged memory systems suffer from *internal fragmentation* because
    frames aren''t necessarily filled to the end, but this is generally much more
    desirable. While external memory fragmentation can easily render as much as 30%
    of memory unusable, internal memory fragmentation is limited to $\textit{number
    of processes} \times \textit{number of contiguous logical pages} \times 0.5 \times
    \textit{page size}$.


    Figure 4.19 has a few interesting subtleties. Global data in frame **o** are shared
    because page **C** in process 1 and page **J** in process 2 both point to it.
    Code in frame **i** is shared because page **D** in process 1 and page **K** in
    process 2 both point to it. The code in pages **E** and **F** in process 1 map
    to adjacent frames **j** and **k** and the code in pages **L** and **M** in process
    2 map to adjacent frames **a** and **b**. Finally, page **G** in process 2 has
    no frame to hold its data. (More on shared pages and unmapped pages in Section
    4.4.4.)


    **Hardware support** The careful reader may have noticed a likely disadvantage
    to a paged memory system: each memory reference appears to generate another reference
    to get the page table entry. Some systems, such as the DEC PDP-11, hold the entire
    page table in registers. This is practical because the PDP-11 has a small address
    space (64 Kbytes) holding only eight pages (of 8 Kbytes each). (To be precise,
    the PDP-11 memory management is an analog of paged memory and segmented memory.
    Each page also has a valid length, just like the memory segments mentioned earlier.)


    It is much more typical to store the page table in memory and then rely on *translation
    look-aside buffers* (*TLBs*) held in a special *associative memory* which caches
    a subset of the page table entries. (Associative memory is addressed by part of
    its contents, in this case the logical address, to provide a value, in this case
    the physical address.) Figure 4.20 shows when a logical address is generated,
    the page number is checked against TLBs to look for a match. If a match is found,
    that page table entry is used. Otherwise, the page table entry is fetched from
    the page table in memory.'
  merge: -1
  img_proc: true
