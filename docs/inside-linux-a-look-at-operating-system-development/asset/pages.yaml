- pgno: 19
  md: 'In a similar vein, I hope that this book will show you what is possible on
    a personal computer. Then, as an enlightened consumer, you''ll demand Linux for
    your system and you might even be tempted to make your own contribution. All this
    will help popularize Linux, my ultimate goal.


    # 0.2 Style and Structure


    The careful reader will notice some unusual things in the book. Some of them can
    be explained.


    # 0.2.1 Quotation Marks


    I acknowledge that the American typesetting convention of including punctuation
    within quotation marks is generally more attractive than placing punctuation outside
    quotation marks. Unfortunately, this convention is ambiguous with respect to what
    exactly is being quoted. Such a distinction is especially important when dealing
    with computer commands being quoted. Therefore, I use quotation marks to delimit
    exactly what is being quoted.


    # 0.2.2 Vocabulary


    As you''ll discover, "state" refers to two things: $state_{1}$ refers to what
    a process is doing, e.g., running, waiting, ready-to-run, and $state_{2}$ refers
    to everything about a process, including the contents of all its memory and registers,
    as well as what it is doing ($state_{1}$). It''s unfortunate that these two meanings
    are so closely related. The reader will have to be careful to distinguish them
    as there are no adequate substitutes which could be used to avoid confusion.


    The terms "process" and "task" are entirely too similar in meaning. If I were
    obliged to distinguish them, I would define "process" as a program in execution
    and "task" as something lighter than a process. ("Lighter" means having a smaller
    state.) I''ve taken the easy course and almost entirely avoided using "task" in
    my writing. I use "job" to refer to a set of procedures submitted to a batch stream.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 0.2. STYLE AND STRUCTURE


    The terms “multiprogramming” and “multitasking” are basically synonymous and refer
    to concurrent execution of multiple programs. I use “multitasking” throughout.
    (If you’re interested, “multiprocessing” refers to the use of multiple processors.)


    I use “thread” as shorthand for a thread of execution subordinate to a process.
    It shares much of its state with sibling threads.


    Careful use of the term “function” limits its use to a subroutine which returns
    a value and has no side-effects. Rather than be corrupted by the Unix convention
    of calling all subroutines functions, I’ve taken the opposite (and more correct)
    tack of calling all functions subroutines.


    The term “operating system” has two meanings—one which refers to the innermost
    code, i.e., that which directly manipulates the special control of the processor,
    and the other, much larger product, which includes ancillary programs. I’ve tried
    to use only kernel or system kernel for the former and have reserved operating
    system exclusively for the latter. “Linux” is used to refer to both the kernel
    and the larger product—you’ll have to pay attention to the way in which it is
    used.


    # 0.2.3 Names


    Although the proper form is “UNIX”, I’ve followed the convention adopted by Peter
    H. Salus (and justified by comments by McIlroy) of using the form “Unix”[44].
    This should be regarded as a typesetting convention only. It is not meant to identify
    a different product. Litigious types should apply the necessary conversion, others
    can enjoy the more pleasant appearance. Some authors have coyly substituted the
    struct $^\mathrm{UNIX}\times$ to name Unix-like things which don’t necessarily
    have full recognition by the trademark owners. I use the term “Unix-like” in the
    few cases it is strictly necessary.


    It remains to be decided if Linux is to be regarded as Unix or Unix-like. At least
    one distributor/developer of Linux, WorkGroup Solutions², has joined X/Open³,
    the current owner of the Unix trademark. Presumably they will qualify a version
    of Linux for branding as “Unix”. If that instance of Linux can be referred to
    as Unix, it’s hard'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'to say the qualification would not extend to other instances of Linux.


    # 0.2.4 Code


    Most of the code examples are given in ANSI4 C. In a few cases, I''ll be a bit
    loose with the language to allow assembly language constructs to drift into the
    examples.


    # 0.2.5 Typesetting


    This book was written in L²TeX, with extensions for arbitrary hyper-text links
    and raw HTML (hyper-text markup language). The on-line version (an HTML document
    produced via L²TeX²HTML⁵) can be read with a Web browser which allows you to skip
    ahead and back with ease as well as connect to other on-line sources. The printed
    version shows hypertext links as footnotes.


    Commands and file names are commonly displayed in typewriter font. Special terms
    are displayed in a special font and an entry in the index will lead you to a definition
    or explanation of the term.


    # 0.2.6 Errata


    Contrary to all the best intentions, there are sure to be errors and omissions
    in this book. An on-line errata page for this book⁶ is at the publisher''s Web
    page. You may send comments and corrections to bentson@ssc.com.


    # 0.3 Acknowledgments


    Linus Torvalds appears to be one of those “super students” who manages to do so
    much extracurricular stuff yet avoids dismissal from school. Thanks for starting
    all this. In addition, a multitude of volunteers have contributed to Linux. A
    partial list is given in Appendix G.


    ⁴ American National Standards Institute


    ⁵ http://cbl.leeeds.ac.uk/nikos/tex2html/doc/latex2html/latex2html.html


    ⁶ http://www.ssc.com/ssc/inisidelinux'
