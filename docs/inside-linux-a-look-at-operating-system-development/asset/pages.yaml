    # Monitors


    Semaphores are the assembly language of mutual exclusion. That is, they are primitive
    and difficult to use.


    It is clear that the problem they address is in the access to shared data, not
    the concurrent execution of code.


    Monitors are an invention which brings together the critical sections of code
    and the shared data which must be accessed in a mutually exclusive manner.


    The first step in this solution is to hide the data from the user, presenting
    instead subroutines which are the only method of access to the data. This results
    in something which the programmer cannot directly manipulate, but can manipulate
    in a strictly controlled manner, hence they are called *abstract objects*. (Actually,
    there are two classes of subroutines, those which are visible to the user and
    those which are used internally. This point is important, as we’ll see in a moment.)'
