  md: "+   • Each datagram identifies the protocol to be used to process the data\
    \ contained within.\n+   \n+   • Datagrams can be broken into smaller datagrams\
    \ while in transit. The identification, length, flags, and fragment offset can\
    \ be used to reassemble these fragments at the destination.\n+   \n+   • A checksum\
    \ ensures that the data are not corrupted.\n\n| version | hdr len | type of svc\
    \ | total length |\n|---|---|---|---|\n| identification | flags | frag offset\
    \ |\n| tim to live | protocol | checksum |\n| source IP address |\n| dest IP address\
