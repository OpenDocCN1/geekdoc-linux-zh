- pgno: 66
  md: '# Internal vs. external commands


    Shells have a few built-in commands—the list varies from one shell to another.
    The rest of the commands are located in files containing executable machine code
    or shell scripts ${ }^{3}$. Commands are known by the name of the file in which
    they are stored. When the user enters what looks like a command, and the command
    is not known internally, the shell will look in one or more likely directories
    for an executable file by that name. The list of places the shell looks is called
    the *search path*.


    # Search path


    The shell searches the directories in the order they are listed in the search
    path and uses the first file it finds with that name and the correct permissions.
    If no file is found with that name and the correct permissions, the shell may
    issue a warning naming the first file with that name but wrong permissions, or
    it may say nothing at all.


    All this searching can slow down execution, so some shells cache the names of
    executable files in the search list so that the search does not have to repeat
    for each command entered.


    An important aspect of the search path is that a command name can match the name
    of several executables in the search path, but the first one found in the order
    of the search path is the one which is used.


    Internal commands are directly executed by the shell, but when an external command
    is executed, it is done so as a child process of the shell. This gives the shell
    control over the process executing the command.


    # Redirection and pipes


    Both internal and external commands are subject to redirection and piping. Redirection
    permits the shell to send the output from a process to a file instead of the display
    and it permits the shell to send commands to a process from a file instead of
    the keyboard. Piping allows the shell to send the output of one process as input
    to another process.


    > ${ }^{3}$ A shell script contains commands which are interpreted by a command
    interpreter (shell). Shell scripts are a useful way to develop a program because
    one can start by noting the commands used to get the right results at the keyboard.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Redirection is based on the idea that a process inherits a standard input port
    and a standard output port from its parent process. In the case of interactive
    sessions such as the shell, these are connected to the keyboard and display respectively,
    but the process does not know this with certainty. It only knows that there are
    input and output streams of data.


    When the shell sees a “>” or “<”, it uses the next token as a source or destination
    file name and it removes those tokens and the file names from the command line.
    The rest of the command line is processed as before, but the command is started
    only after its output and input are redirected. Section 5.3.3 shows how this redirection
    is accomplished.


    The shell splits the command line into parts at each “|” token and decodes each
    part as a separate command. When the shell starts the processes, it connects the
    output of the process to the left with the input of the process on the right via
    a pipe. When processes are used in this manner, they are called filters. The details
    of this special kind of redirection is left to Section 5.3.3.


    Linux (and Unix) processes have an additional output port called “standard error”.
    Advanced shells have extensions to separately redirect the standard error data
    stream, or to combine it with the standard output data stream. The Georgia Tech
    new shell described on pages 157–160 shows a powerful extension of this basic
    idea.


    # Basic interaction with the shell


    The most common use of the shell is as a command line interpreter. In this mode
    of operation, the shell reads input from the keyboard and writes the results to
    the display. Normally, the shell processes input a line at a time, but in some
    circumstances, it will read multiple input lines before taking action. This provides
    the basic subroutine calling mechanism.


    # Substitution of variables


    In addition to file-name-based and pattern-matching-based expansion, most shells
    offer mechanisms to substitute some value in place of a named variable. The most
    common convention uses the character “$”'
  merge: -1
