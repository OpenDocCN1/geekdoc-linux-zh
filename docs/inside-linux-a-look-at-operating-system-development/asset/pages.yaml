    # Other I/O calls


    The file descriptor is used to index into a per-process set of structures that
    hold information about that file’s use as well as an indirect index into a system
    wide set of structures regarding that file.


    It indexes into a per-process table which in turn leads to a element of a linked
    list of structures, one per open file on the system.


    These structures are accessed through one level of indirection—the virtual file
    system mentioned above.


    Once a file has been opened, the application program moves to the desired offset
    (using `lseek`) and reads or writes a stream of bytes. The system kernel imposes
    no structure on the file, e.g., lines or records. This allows (requires) the application
    to interpret the data as appropriate.


