  md: 'off. When all processes are allocated $N$ or fewer pages, the system is effectively
    stopped.


    The goal for system management is therefore to allocate $M_{i}$ frames to each
    process and to keep $\sum M_{i}$ less than the size of available memory.


    # **Working Set**


    Denning calls the collection of frames being accessed by a process, $W(t, \Delta)$,
    its *working set*[12]. The working set is a function of $t$, the current process''
    execution time. The working set is also a function of how large an interval, $\Delta$,
    is considered.


    This leads to a better statement of system management goals—we have to ensure
    every process has $|W_{i}(t, \Delta)|$ frames allocated to it and we have to keep
    $\sum|W_{i}(t, \Delta)|$ less than the available memory to avoid thrashing.


    Over time, the size of the working set will establish different plateau values.
    The dashed and dotted lines in Figure 5.32 represent the contribution to the working
    set size made by different parts of a program. During the transition from one
    part of the program to another, these contributions sum to produce the solid line
    which has peaks between the plateaus.


    We would like to use the working set to develop a measure of how much memory is
    needed by all the processes. But once again, implementation of such a theoretical
    concept requires approximation, compromise and judgment.


    One way to estimate the working set size is to monitor the page fault frequency
    (PFF) of a process. For a fixed frame allocation, changes in the PFF are closely
    correlated with changes in the working set size. If the PFF is stable, the process
    is at a plateau. If the PFF changes, the process is shifting to a different plateau
    or has established a different plateau. The PFF algorithm does not satisfy the
    inclusion property, but, except for a few anomalies, it behaves within about $10
    \%$ of a proper working set algorithm.


    The system can treat the currently allocated memory (resident set size) as an
    approximation to the working set size when the page fault frequency is not quite
    zero.'
