  md: '# Chapter 4


    # System Kernel Requirements


    Chapter 1 listed a number of features possessed by Linux, Chapter 2 has noted
    some of its antecedents, and Chapter 3 looked at how a user interacts with Linux.
    In this chapter, we will develop a list of requirements for a system kernel. A
    checklist, if you will, of what we’ve come to expect of a system kernel. In broad
    terms, a system kernel must maximize processor availability, protect users from
    mishap and attack, and provide interactive response and background processing.
    We can refine some of these requirements by tracing the development of what we
    call “system kernels” and the rest by noting shortcomings of different systems.


    It would be a gross understatement to say the earliest computers were unwel­coming
    in their operation. Setting aside issues of large physical size, small storage
    size, modest speed, and low reliability, they still had a large number of architectural
    shortcomings. The high cost of logic meant they lacked instructions to perform
    even such common operations as multiplication. Operators had to load individual
    words of memory via front-panel switches and read results as strings of bits or
    digits on a display.


    Better input/output devices soon appeared, but more importantly, it didn’t take
    long for the designers to realize the computer itself could be used to make its
    operation more user-friendly. In 1947, Alan Turing wrote, “There need be no real
    danger of it ever becoming a drudge, for any processes that are quite mechanical
    may be turned over to the machine itself[22].”'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Although the computer hardware was fixed by design, the system could be extended
    by the addition of support software. If the computer couldn''t multiply, the programmer
    could call a subroutine to perform the multiplication. If the card punch required
    tricky timing, the programmer could call a subroutine that used the correct delays.


    This collection of specialized support subroutines has become what we now call
    the run-time library and the system kernel. Some of the subroutines may be bound
    to the application program as part of the compilation, others when the program
    is loaded into memory, still others as each subroutine is called, or at the point
    of each subroutine call.


    # ## 4.1 Scheduling


    A run-time library, along with a simple program loader, was the extent of early
    system kernels. The hardware was designed to read one card from the hopper into
    a fixed memory location and transfer control to that location. The first few cards
    held the program loader and the run-time library. The user program followed. When
    the user program was done, the system would halt and the next user program would
    be loaded.


    A modest design change placed the program loader in charge of loading one job
    after another from an input stream (card reader or tape drive), executing it and
    going to the next job. As long as the card hopper or the tape drive was full,
    the system would be busy doing useful work.


    This change was the start of the evolution of the operating system. Before this
    time, the support code in the run-time library was there to aid one program. After
    this time, the support code in the scheduler was there to aid all programs.


    Unfortunately, input and output operations (I/O) are typically much slower than
    the processor. Thus, while the system is waiting for I/O to complete, the computing
    logic is idle—and while computation is being performed, the I/O mechanism is idle.
    Figure 4.1a shows how jobs alternate between computing and performing I/O. When
    the processor starts I/O, it uses a polling loop to determine when the I/O is
    done. A polling loop is a cycle of “are you done?”—“no”—“are you done?”—“no”—“are
    you done?”—“no” that continues until the peripheral finally responds “yes”, at
    which time more I/O can be started or the'
