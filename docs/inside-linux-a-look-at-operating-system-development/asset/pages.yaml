    page faults for three or four frames respectively.


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_191_0.png)


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_191_1.png)


    **Figure 5.29: Optimal swapping**


    This problem leads directly to a goal called the *inclusion property*, which states
    that a larger memory shall hold all the pages that a smaller memory would hold
    at any point in the system’s execution history. The LRU algorithm described below
    satisfies this property.


    **LRU algorithm** Execution traces show that when programs reference some location,
    that location is more likely to be referenced again in the near future and other
    portions of code and data remain unused for significant periods. Although the
    choice of the oldest page in memory (as is done by the FIFO algorithm) might appear
    to be a good idea, it ignores any *locality of reference*, i.e., the tendency
    of the system to refer to pages which it has recently referenced. (The danger
    is that the oldest page in memory may also hold global data which is being constantly
    used or common code with is regularly executed.)


    This fact suggests we can do better than FIFO by choosing instead the page which
    has been *least recently used* (LRU). Even if we cannot tell what a page’s use
    will be in the future, we can base our guess on what it has been doing in the
    past. With LRU we are predicting that'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'the most recently used page is most likely to be used again in the near future.


    Even though the LRU algorithm doesn''t need to forecast the future (like the Optimal
    algorithm), it is almost as difficult to implement as the Optimal algorithm.


    **Time stamp** One way to implement LRU is to attach to each page an age register
    which notes the most recent reference to that page. The system maintains a counter
    that is incremented at every memory reference. The value of the counter is loaded
    into the age register each time that page is referenced. A simple scan of all
    the LRU registers will then show the page which was least recently used.


    **Stack** The same effect can be achieved by maintaining a stack of page numbers.
    When a new page is loaded, it is added to the stack top. When a page is referenced,
    it is moved to the stack top. The bottom of the stack then holds the least recently
    used page.


    **LRU approximation algorithm** Although simple to describe, the hardware implementation
    of LRU is terribly expensive. We therefore resort to methods which approximate
    the behavior of the LRU algorithm (which is itself an approximation to the Optimal
    algorithm).


    Some of these can be viewed as a very low precision version of the two implementations
    outlined above—sometimes with only one bit of information.


    **Reference Bits** While a counter provides strict ordering of pages by the time
    of their use, reference bits provide an approximate ordering. With a seven bit
    register, a value 1111111 says the page has been used during each of the past
    seven intervals. When it is no longer used, it will take on values,


    +   • 0111111

    +   • 0011111

    +   • 0001111'
