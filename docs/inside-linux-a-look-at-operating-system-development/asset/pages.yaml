    # **1.3.5 Linux Isn’t Built Using a Modern Programming Language**


    Linux is written almost entirely in C. (There are small fragments written in assembly
    language.)


    C has been characterized as both the world’s lowest high-level language and the
    world’s highest low-level language. This dual regard places it in a good position
    as a system implementation language. It also means that C is obliged to set aside
    some elegant idioms, such as abstract objects and multi-threading, for the sake
    of utility.


    If C wasn’t so popular, it would be regarded as a bad language. It has a number
    of questionable features, such as a cavalier approach towards functions and types,
    which have been firmly fixed in tradition.


    Several other programming languages were developed about the same time C came
