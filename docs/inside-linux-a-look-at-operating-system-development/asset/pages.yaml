- pgno: 87
  md: 'Resource definitions take the form:


    `name : value`


    where “name” has a rather complex form


    `object SEP subobject [SEP subobject]* SEP attribute`


    where SEP is a “.” or “*”.


    Each component of a resource name, the objects and subobjects, refer either to
    classes or instances of those classes. A class name refers to a class of objects
    or subobjects, such as buttons or colors, while an instance name refers to a specific
    object or subobject, such as the delete button or the border color. By convention,
    class names begin with uppercase letters and instance names begin with lowercase
    letters. When the “.” is used to separate the objects, the resource is said to
    be tightly bound. This means that a scans of the data base will require an exact
    match. When the “*” is use to separate the objects, the resource is said to be
    loosely bound. Such a resource will be offered as a response to a query which
    doesn’t match exactly.


    These two categories of distinction, class vs instance and loose vs tight, are
    used to qualify which matching resource is returned in response to a query. The
    four (or more) possible resources names are chosen by the rules that


    +   - instance names take precedence over class names

    +   - tight bindings take precedence over loose bindings


    This hierarchy of choice allows a user to specify general characteristics, such
    as text fonts are to be helvetica, and then override them with more localized
    characteristics, such as menu fonts are to be Times Roman.


    One disappointment is that one cannot determine exactly which resources are used
    by a given X program. Furthermore, resources which an X program discovers in configuration
    files are not loaded into the database. This can make it somewhat difficult to
    determine what really is happening in a system.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 3.2.7 Fonts


    Bitmapped displays offer us new possibilities and new problems. In the past, characters
    were defined by the hardware. Now they are defined by tables in files. One of
    the many resource categories deals with the fonts used in the several different
    parts of a window. An elaborate schema has been defined to allow the client (user
    application) to specify the desired font with as much or as little precision as
    desired.


    Through the X protocol, the server will advise the client of its ability to honor
    the client''s request use a given font for display.


    # 3.2.8 Keyboard Mapping


    Another area of great flexibility in X is in the mapping of keystrokes to arbitrary
    characters. Although an ordinary keyboard has about a hundred keys, it''s possible
    to create many times more distinct characters by using combinations of the different
    SHIFT, CONTROL, and ALT keys.


    This flexible mechanism for binding keys to meanings allow the application designer
    to rely on lots of specialized keys.'
