  md: 'most inefficient to have the client process wait for each display operation
    to complete before issuing another request. Instead, the client issues a stream
    of commands which can accumulate in a buffer. On occasion, the client issues a
    special command which says “make sure everything in the buffer is sent on the
    network”. This allows for efficient use of the network. At the same time, the
    server will be sending events to the client such as saying a mouse button was
    pressed at location \( < X, Y > \).


    Because the client and server can be on opposite ends of the network, the server
    has to direct its commands to some address. This address is most commonly given
    by the value of the “DISPLAY” environment variable. It can also be specified on
    the command line, usually as an argument to the **-display** option, or as a resource
    (discussed later in Section 3.2.6).


    When a client opens a window, a request to the server contains hints, among which
    are the size and location of the window.


    These are honored unless overridden by a special client called the window manager.
    Once the window is opened, the client could issue further requests to resize the
    window, move it around the screen, etc. This is almost never done, as these tasks
    are left to the control of a window manager such as described in Section 3.2.3.


    The boundary between command line interfaces and GUIs becomes muddled when the
    user uses a command line interface in a window emulating a terminal screen. In
    such a case, it’s best to realize that the terminal emulator, such as xterm, is
    a client program which is causing the server to open a window and display characters
    on it. The terminal emulator opens what is called a *pseudo-terminal* which allows
    the terminal emulator to play the role of a serial peripheral to application programs.


    Pseudo-terminals are similar to the named pipes described in Section 5.3.3. The
    critical difference is that they can accept *ioctl* control calls which are normally
    used only on peripheral devices.


    The shell that is started by the terminal emulator cannot tell it is not connected
    to a real terminal. The system uses pseudo-terminals in a similar manner to connect
    a telnet session to a shell.'
