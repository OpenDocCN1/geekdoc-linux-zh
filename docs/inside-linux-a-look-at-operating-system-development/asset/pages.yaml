- pgno: 96
  md: '# ## 4.1.2 Priority Scheduling


    A number of scheduling algorithms have been designed, most of which have some
    sense of process priority. This allows the system or user to designate a process
    as “really important” or “non-critical”. Section 5.2.4 explores this topic in
    more detail.


    # ## 4.1.3 Real-Time Scheduling


    Any formal definition of real-time scheduling will make note of a “strict requirement
    to meet deadlines”, but that’s really insufficient. Consider a payroll accounting
    system—everyone agrees it’s not real-time, but you better get those checks out
    on time! There appears to be an implicit, or at least rarely uttered, element
    to the definition: “deadlines are often less than a second in the future”.


    Real-time scheduling comes in three flavors. *Hard real-time* systems, such as
    used in airplane flight control software, are designed so that no processes can
    inappropriately block another. Some of this can be done by strict (and fast) priority
    based scheduling, but it also often relies on strict bounds on process execution
    times.


    Some systems go so far as to avoid the use of interrupts because unexpected delays
    of millisecond duration can occur. Instead, the system runs in a polling loop,
    calling each process as a co-routine (see Section 4.1.1) and each process must
    return within some fixed time. Some of these processes perform computations and
    others tend to peripheral I/O.


    *Soft real-time* systems can tolerate modest delays. An example of such a system
    would be a “high-tech home” with window shades which respond to time-of-day, sunlight,
    and room temperature and a sprinkler system which relies on moisture sensors,
    clocks, and motion detectors (to avoid ruining the lawn party). If some operation
    is delayed by a second, perhaps as much as a minute, no harm is done.


    Since a soft real-time system can work with context switching overhead, it’s possible
    to have lower priority processes doing non-real-time work. This means that these
    systems often have disk storage, network connections, interactive user command
    loaded processing, and (gasp) even *virtual* memory.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '(Virtual memory is anathema to real-time processing because a process is interrupted
    when it references a missing page. These interruptions, called page faults, delay
    a process until the kernel move data from disk to memory. With soft real-time
    systems, the real-time tasks are locked into physical memory so as to avoid delays
    due to page faults. Only those processes which are not designated “real-time”
    are affected by delays due to paging. See Section 4.4.4 for more discussion about
    virtual memory.)


    In a similar vein, a hard real-time system may allow lesser priority tasks to
    run, provided the system can force control back to the critical tasks in time
    to insure their deadlines are met.


    When resolution and consequences are left unmentioned, only *hype* is left. Until
    detailed descriptions of context switch time, interrupt latencies, priority scheduling
    algorithms, and execution speed are given, you can''t really count on having real-time
    behavior. Be wary of such systems.


    # 4.1.4  Linux As a Real-Time System


    Someday Linux may be able to claim to be a real-time system. Features have been
    developed to support this goal. System calls for memory locking and scheduler
    control have been added to the development kernel.


    These enhancements mean Linux is rapidly approaching the level of soft real-time
    support, but there are some tricky issues yet to be resolved. Markus Kulm¹ warns
    that a process is not awakened from an interrupt, but rather it is only made runnable,
    i.e., it may not run immediately after the interrupt completes. He also warns
    that some interrupt handlers may have to be rewritten and that there are some
    places in the kernel where interrupts are disabled for extended intervals.


    # 4.2  Synchronization


    With preemptive multitasking, a process can be interrupted at any time and control
    passed to another process. This can easily lead to situations where multi-part
    operations are corrupted. Consider two concurrently'
