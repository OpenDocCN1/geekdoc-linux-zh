  md: '# ### 1.4.4 Linux Doesn''t Have User Threads


    A thread is a process-like entity which shares much of its context with its siblings.
    Switching among sibling threads involves less overhead than switching between
    processes. This lower overhead means that threads can more easily exploit the
    parallelism *within* a program.


    The utility of threads and the pending approval of a POSIX standard for threads
    have made them more visible to the user community.


    Until recently, implementations of threads for Linux operated entirely as user
    code. There have been several different implementations, none of which have been
    made part of standard distributions.


    The kernel has been evolving towards support for user threads.


    Threads are explored more completely in Section 5.2.3.


    # ### 1.4.5 Linux Doesn''t Have Streams


    As data flow between user applications and the outside world, several transformations
    are applied, e.g., tabs are expanded to the appropriate number of spaces, parity
    is added to each character, packets of data have checksums applied, etc. In the
    past, these transformations have been built into the drivers. This made it difficult
    to install different transformations on a per-line or per-application basis.


    *Streams*, a introduced to Unix by designers at AT&T Bell Laboratories, give programs
    greater control over these transformations[42].


    Although the user community has shown great reluctance to shift Linux to this
    method, there is a (slowly progressing) project$^{28}$ to develop streams for
    Linux. Their hope is to make the use of streams a user option.


    # ### 1.4.6 Linux Doesn''t Have Symmetrical Multi-processing (SMP)


    Multiprocessing involves the use of multiple processors in a single system. Sometimes
    the extra processors have a dedicated function, such as that of an intelligent
    peripheral controller. Another configuration has'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'multiple processors connected so that each has the same relation to the system
    as the others, hence “symmetrical”. There is no master-slave relationship among
    the processors.


    As mentioned in Section 1.3.1, had Linux been written as a micro-kernel, it would
    have been fairly straightforward to extend to symmetrical multiprocessor systems.


    Instead, a small project group has extended the existing monolithic kernel by
    adding carefully placed semaphores (see Section 5.2.4) to protect shared data
    within the kernel. In addition, extra steps were required to identify and initialize
    the processors at the time the system is started. From a practical standpoint,
    this may lead eventually to a higher performance system that could be achieved
    via a micro-kernel.


    So, although no fully supported release exists, support for SMP is now a configuration
    option in the development kernel releases. Until such time as this project is
    complete, information is available on the web.²⁹


    # 1.4.7 Linux Has No Support For Real-Time Scheduling


    Section 4.1.3 notes that “real-time” is a somewhat slippery term, but most everyone
    agrees Linux doesn''t have it.


    The resolution of the clock is quite good, but the delivery of a signal from **setimer**
    has limited resolution. More importantly, any process can suffer severe arbitrary
    delays due to virtual memory paging and the scheduler behavior is not precisely
    defined. As a consequence, processes cannot guarantee to meet any deadline.


    Recent changes proposed for the kernel will correct these handicaps with little
    expense to general system performance.


    It is also possible that, in some cases, real-time performance can be faked by
    putting more into specialized device drivers.'
