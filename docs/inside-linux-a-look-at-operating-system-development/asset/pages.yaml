- pgno: 193
  md: '+   - 0000111

    +   - 0000011

    +   - 0000001

    +   - 0000000


    during successive intervals. If a page’s register value is interpreted as an unsigned
    integer, pages with the largest values have been used the most in recent times.
    (Note that this ordering will likely yield multiple pages of the least recently
    used category. Some form of tie-breaker algorithm will have to be used to select
    the victim page.)


    Second Chance The list of pages can be assembled into a circular queue. Whenever
    a page is needed, a search is initiated. If a page is found which has not been
    referenced (the single reference bit set) since it was last considered, it is
    made the victim. If a page has been referenced, it is ignored for the moment and
    its reference bit is cleared (it is given a second chance).


    Only after all pages have been checked will a second-chance page be selected for
    use.


    If a page is busy enough, it will always be referenced before it suffers a second
    chance selection.


    Enhanced Second Chance Since the virtual memory is certain to have a modify bit,
    it can be used with a single reference bit to yield a four-level preference.


    (0,0) Neither used nor modified—a great victim.


    (0,1) Not recently used, but modified—it will have to be written to disk before
    it can be reused.


    (1,0) Recently used, but not modified—it may soon be used again.


    (1,1) Recently used and modified—it is the worst choice as a victim.


    Scanning a list will yield both victim candidate pages and pages which should
    be flushed to storage. This leads to a prioritized flow of pages from memory to
    disk.'
