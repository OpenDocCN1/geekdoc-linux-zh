- pgno: 194
  md: '# **Page Buffering**


    Dirty pages, those with the modify bit set, are a hindrance to easy selection
    of victim pages. Even if a page hasn''t been used for a long time, it cannot be
    used to hold a new page until it is written to storage.


    A page buffering algorithm takes needed pages from a pool of clean pages and then
    initiates the write of a dirty victim page. That dirty page is then moved to the
    pool for later use.


    This basic algorithm can be extended to write dirty pages to storage whenever
    the disk is not otherwise in use.


    Once the page has been written to storage, it becomes a better candidate for replacement.
    (This is especially true if the page is category (0,1) in the Enhanced Second
    Chance algorithm mentioned above.)


    # Frame Allocation


    So far this discussion has not considered how many frames a process can have.
    If there is but one process, the answer is clearly “all which will fit”. But with
    any multiprogramming, there will be contention for the memory and the system must
    determine how many frames are to be allocated to each process.


    The simplest algorithm would allocate up to *m/n* frames to each process, where
    there are *n* processes contending for *m* frames. This algorithm is clearly wasteful
    if some processes don''t need *m/n* frames.


    A better allocation would give each process *m × sᵢ/Σsᵢ*, where *sᵢ* is the memory
    need of the *i*th process.


    Both of these algorithms are static—they don''t change the per-process allocation
    over time. They are said to perform *local replacement*, where each process pages
    against itself. Algorithms which perform *global replacement* will take pages
    from other processes.


    There is a clear trade-off: with local replacement, a process may be unnecessarily
    limited, but it cannot harm other processes and with global replacement a process
    can get what it needs, but a run-away process can harm other processes.


    In either case, the number and size of processes can affect how the system behaves.'
  merge: -1
  img_proc: true
