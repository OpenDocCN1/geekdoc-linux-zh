- pgno: 211
  md: '+   Internetwork—roughly the Network layer of the OSI model

    +   Network Access –the Physical and Data Link layers of the OSI model combined
    into one layer


    Linux implements the transport, internetwork, and network access layers inside
    the kernel. The transport layer is used by processes which implement the application
    layer. Other special processes use the network and network access layers to implement
    higher level protocols (which are experimental in nature or don’t require especially
    high performance). It was mentioned earlier, but it bears restatement: there can
    be many different implementations of any given layer. For instance, implementations
    of the Application, Transport, Internetwork, and Network Access layers could consist
    of telnet, TCP, IP, and Ethernet in one case and http daemon, UDP, IP, and SLIP
    in another.


    The Internet protocols are defined by a number of standards with the humble phrase
    "Request for Comments" in their titles. Each addresses some topic as a position
    paper, protocol specification, or catalog. They are now published by the Network
    Working Group and many RFCs are available on CD-ROM or by ftp on the Internet
    as text or Postscript files.


    The following three subsections discuss common configurations for the Transport
    and Application protocols. After this first look at the middle part of this model,
    we’ll look at the top and bottom ends. Application and Network Access.


    # 6.3.1     TCP/IP


    The *Transmission Control Protocol* (*TCP*), defined in RFC 793, and the *Internet
    Protocol* (*IP*), defined in RFC 791, are regarded as the core of the Internet.


    The IP protocol ensures that datagrams (or packets)—a collection of bytes as shown
    in Figure 6.2—are routed from the source node to the destination node. Critical
    parts of the protocol are that:


    +   • Each datagram holds 32-bit source and destination addresses. This is sufficient
    to address 4,294,967,296 different nodes.'
  merge: -1
  img_proc: true
