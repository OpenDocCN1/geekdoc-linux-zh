  md: "# Chapter 5\n\n# The Operating System Kernel\n\nAs seen in the previous chapter,\
    \ one view of a system kernel is through the interactive user interfaces associated\
    \ with that system. The programmer sees a system kernel from a different perspective,\
    \ one based on the system calls which can be made from within a program. This\
    \ viewpoint is the “true” one because the user interface (the command line interpreter\
