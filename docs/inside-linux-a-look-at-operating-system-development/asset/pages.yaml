    preserving its own state.


    Parent routine → P1


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_94_0.png)


    Figure 4.2: Coroutines exchanging control


    Implicit in most uses of the term co-routine is the idea these programs would
    work on some common problem by exchanging data. This combined concept is now well
    known by the name *producer–consumer*, whereby one program produces data to be
    placed in a buffer and another program consumes the data from the buffer.


    # Preemptive Multitasking


    A batch of jobs, where it doesn’t matter if one job or another is delayed for
    a bit, are perfect candidates for co-operative multitasking. But if the jobs are
    expected to offer any interactive response, the system will have to switch from
    one job to the next, even when the jobs don’t request the switch. This *preemptive
    multitasking* allows each user’s program to run either until it waits for some
    I/O to complete or until a “time quantum” expires. Compute-bound program P1 can
    be sliced up as shown in Figure 4.3a. Figure 4.3b shows how those slices can be
    interleaved with slices from programs P2 and P3. There is overhead (shown as the
    dark interval between each slice) in this preemptive context switching that would
    not appear in a co-operative multitasking or simple batch operating system.'
  merge: -1
