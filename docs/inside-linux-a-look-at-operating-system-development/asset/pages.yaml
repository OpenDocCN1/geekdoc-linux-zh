- pgno: 323
  md: '# **INSIDE LINUX**


    A Look at Operating System Development


    *Inside Linux* provides the reader with an inside look at operating system design
    and implementation considerations.


    *Inside Linux* looks at the history of operating systems, how they are used, and
    the details of one operating system—Linux. The contents interweave discussions
    of history, theory and practice, allowing the reader to see what happens inside
    the system.


    *Inside Linux* will give the computer professional a deeper understanding of how
    Unix systems in general (and Linux in particular) operate.


    # **About the Author:**


    Randolph Benton has been programming since 1969—writing more tasking kernels in
    assembly code than he wants to admit. His first high-level language operating
    system was the UCSD P-system.


    Dr. Benton has been working with Unix for nearly 16 years, and he''s been enjoying
    (and contributing to) Linux for the last 2 years.


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_323_0.png)


    **Published by:**

    Specialized Systems Consultants, Inc. (SSC)


    *Printed in USA*


    ISBN 0-916151-89-1


    ![](img/bd9544b8c1ad3b1347c84630c5d698e1_323_1.png)'
