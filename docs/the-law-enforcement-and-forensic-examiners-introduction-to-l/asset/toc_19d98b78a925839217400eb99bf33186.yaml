- - '###'
  - 这些是 Slackware 的默认运行级别：
- - '####'
  - 0 = halt
- - '####'
  - 1 = 单用户模式
- - '####'
  - 2 = 未使用（但与运行级别 3 相同）
- - '####'
  - 3 = 多用户模式（Slack 默认运行级别）
- - '####'
  - 4 = 带有 KDM/GDM/XDM 的 X11（会话管理器）
- - '####'
  - 5 = 未使用（但与运行级别 3 相同）
- - '####'
  - 6 = reboot
- - '####'
  - 默认运行级别。（不要设置为 0 或 6）
