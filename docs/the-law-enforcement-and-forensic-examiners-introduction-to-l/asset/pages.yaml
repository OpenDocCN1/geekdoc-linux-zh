    # Application Analysis - prefetch


    Understanding the caveats we provided earlier on the status of many of the libyal

    projects, be sure to browse some of them and try them out. Documentation can be
    sparse in

    places, but that''s where experimentation and testing comes in. In many cases,
    the libraries are

    provided to add capabilities to other programs – the provided utilities may simply
    export

    information from an artifact to XML or text format straight to standard output.
    이때 is an

    example of this and is used to access Windows prefetch files.


    Prefetch can be a useful forensic artifact for any number of reasons. They can

    provide additional execution times for timelines, they can be used to prove program
    execution

    even when an executable has been deleted, and they can be used to correlate other
    artifacts

    created during execution. More information can be found on the Internet³³⁵.


    Let’s have a look at a quick example, after installing libcca:


    ```

    barry@forensic1:~# su -

    Password:

    root@forensic1:~# sboinstall libcca

    libcca (libYAL Windows Prefetch File parser)

    libcca is a library to access the Windows Prefetch File (SCCA) format.

    Proceed with libccsa? [y]

    ...

    Cleaning for libcca-20170105...

    root@forensic1:~# exit

    ```


    > ³³⁵http://www.forensicswiki.org/wiki/Prefetch is a good standard.'
