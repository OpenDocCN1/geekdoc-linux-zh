    still have access to many KDE utilities, if you elected to install KDE during
    package selection. You can install more than one desktop and switch between them,
    if you like. The easiest way to switch is with the config command.


    # The Linux Kernel


    The Linux kernel is the "brain" of the system. It is the base component of the
    Operating System that allows hardware to interact with and manage other software
    and resources.


    As with all forensic tools, we need to have a clear view of any kernel version
    we interact with our forensic platforms and subject hardware. Almost all current
    distributions of Linux already come with a version 4 kernel installed by default,
    including Slack (4.4).


    You can determine your current kernel version with the uname command:


    ```

    root@forensic1# uname -a

    Linux forensic 4.4.14 #2 SMP Fri Jun 24 13:38:27 CDT 2016 x86_64 Intel(R) Core(TM)
    15-3550 CPU @ 3.30GHz GenuineIntel/Linux

    ```


    The key to the safe forensic use (from an evidentiary standpoint) of ANY system
    is knowledge of your environment and proper testing. Please keep in mind. You
    MUST understand how your hardware and software interact with any given operating
    system before using it in a "production" forensic analysis. If for some reason
    you feel the need to upgrade your kernel to a newer version (either through automated
    updates or manually), make sure you read the documentation and changelog so you
    have an understanding of any significant architectural changes that impact the
    forensic environment.


    One of the greatest strengths Linux provides is "total control". This requires
    thorough testing and understanding. Don''t lose sight of this in pursuit of an
    "easy" desktop experience.


    # Kernel and Hardware Interaction


