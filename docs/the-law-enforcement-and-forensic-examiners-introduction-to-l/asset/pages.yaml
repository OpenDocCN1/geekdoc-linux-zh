    [38:0:0] disk SanDisk Cruiser Mini 0.2 /dev/sdd

    ```


    ```

    root@forensic1:-# shasum /dev/sdc

    80db42ca23ba09169dcff8d0072d32ea97f36 /dev/sdc

    ```


