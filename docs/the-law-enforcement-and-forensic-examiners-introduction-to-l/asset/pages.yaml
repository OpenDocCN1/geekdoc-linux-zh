    In the output of **fls**, jet.jpg has two entries:


    +   39-128-1

    39-128-3


    Both entries have the same MFT record number but the attribute identifiers are
    different. This is an example of an Alternate Data Stream (ADS). Accessing the
    standard contents (39-128-1) of jet.jpg is easy, since it is an allocated file.
    However, we can access either data stream, the normal data or the ADS, by using
    the Sleuth Kit **icat**, much as we did with the files in our previous exercises.
    We simply call icat with the complete MFT record entry, to include the alternate
    identifier. Here we specify each of the data streams and send them to the **file**
    command using icat:


    ```

    barry@forensic1:/NTFS_Pract_2017$ icat -o 2048 NTFS_Pract_2017.E01 39 | file -
    /dev/stdin: MPEG sequence, vl, progressive Y''CbCr 4:2:0 video, CIF, NTSC, NTFS
    4:3, 29.97 fps, Constrained

    ```


