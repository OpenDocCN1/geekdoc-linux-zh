    +   There are basically three different files in the output above. These are:

    - Feature files: Files that contain the output of each scanner.

    - Histogram files: Files that show the frequency that each item in a feature file
    is encountered. We discuss the usefulness of these in more detail later.

    - The report file: A DFX formatted report of the output and environment.


    Any files that are 0 are empty and no features were noted. In this case the alerts.txt
    file is empty because we did not specify an alert file with the -r option. The
