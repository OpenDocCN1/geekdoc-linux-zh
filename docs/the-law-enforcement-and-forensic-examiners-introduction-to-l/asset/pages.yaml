- pgno: 216
  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    Notice that all of the files listed have an asterisk (*) before the inode. This
    indicates the file is deleted, which we expect in the above output since we specified
    the -d option to fls. We are presented with the meta-data entry (inode, MFT entry,
    etc.) followed by the filename.


    Have a look at the line of output for inode number 2138 (root/lolit_pics.tar.gz).
    The inode is followed by realloc. Keep in mind that fls describes the file name.
    The realloc means that the file name is listed as unallocated, even though the
    meta data entry (2138) is marked as allocated. In other words,...the inode from
    the deleted file may have been "reallocated" to a new file.


    According to Brian Carrier:


    > "The difference comes because there is a file name layer and a metadata layer.
    Every file has an entry in both layers and each entry has its own allocation status.


    > If a file is marked as "deleted" then this means that the file name and metadata
    entries are marked as unallocated. If a file is marked as "realloc" then this
    means that the file name is unallocated and its metadata is allocated.


    +   The latter occurs if:

    - The file was renamed and a new file entry was created for the file, but the
    metadata stayed the same.

    - NTFS resorted the names and the old copies of the name will be "unallocated"
    even though the file still exists. [note we are currently on an EXT system]

    - The file was deleted, but the metadata has been reallocated to a new file.


    In the first two cases, the metadata correctly corresponds to the deleted file
    name. In the last case, the metadata may not correspond to the name because it
    may instead correspond to a new file.


    In case of 2138, it looks as though the realloc was by the file being moved to
    the directory .001 (the fls listing of .001 on the previous page - inode 11085).
    This causes it to be deleted from its current directory (root/lolit_pics.tar.gz)
    and a new file created (.001/lolit_pics.tar.gz). The inode and the data blocks
    that it points to remain unchanged and in "allocated status", but it has been
    "reallocated" to the new name.


    Let''s continue our exercise using a couple of meta data (inode) layers included
    with the Sleuth Kit. In a Linux EXT file system, an inode has a unique number
    and is assigned to a file. The number corresponds to the inode table, allocated
    when a partition is formatted. The inode contains all the meta data available
    for a file, including the modified/accessed/changed (mac) times and a list of
    all the data blocks allocated to that file.


    217'
  merge: -1
  img_proc: true
