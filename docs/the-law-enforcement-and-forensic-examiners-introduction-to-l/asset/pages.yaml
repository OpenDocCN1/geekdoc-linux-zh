- pgno: 131
  md: '# Imaging Over the Wire


    There may occasions where you want or need to acquire an image of a computer using
    a boot disk and network connectivity. Most often, this approach is used with a
    Linux boot disk on the subject machine (the machine you are going to). Another
    computer, the imaging collection platform, is connected either via a network hub
    or switch; through a crossover cable. There are almost infinite configurations
    possible. These sorts of acquisitions take place across the country or around
    the world. The reasons and applications of this approach range from level of physical
    access to the hardware and interface interface to local resources. As an example,
    you might come across a machine that has a drive interface (USB for example),
    then you might need to resort to the network interface to transfer data. The drive
    is left in place, and your collection platform is attached through a hub, switch,
    or via crossover cable. Where possible, I would use either a crossover cable or
    my own small hub. Consider the most secure path between the subject and collection
    platform is most desirable. Consider the security and integrity of your data if
    you attempt to transfer it across an enterprise or external network. We will concentrate
    on the mechanics here, and the very basic commands required. As always, I urge
    you to follow.


    First, lets clarify some terminology for the purpose of our discussion here. In
    this instance, the computer we want to image will be referred to as the *subject
    computer*. The computer to which we are writing the image will be referred to
    as the *collection box*.


    In order to accomplish imaging across the network, we will need to setup our collection
    box to “listen” for data from our subject box. We do this using **netcat**, the
    **nc** command. The basic setup looks like this (image on the following page):'
