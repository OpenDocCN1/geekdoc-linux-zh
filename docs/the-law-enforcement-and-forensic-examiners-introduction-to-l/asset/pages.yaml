    * /home/$USER/.bash_profile This script is located in each user''s home directory
    ($USER) and can be edited by the user, allowing him or her to customize their
    own environment. In this file you can add aliases to change the way commands respond.
    Note that the dot in front of the filename makes it a "hidden" file.

