    Also, once Sleuth Kit (which we cover later) is installed, you might want to browse
    around http://www.sleuthkit.org/ for additional information on file systems and
    implementation.


    # The Layer Strategy for Approaching Analysis


    One of the reasons Linux is seen as both extremely efficient by its proponents
    and excessively complex by its detractors is it''s focus on modular programming
    where one tool accomplishes one task rather than the monolithic approach of many
    forensic suites. The design of Linux tools, both GNU command line utilities and
    forensic software such as the Sleuth Kit, can appear daunting when a student realizes
    they must try to remember multiple tools, outputs and command parameters in order
    to execute an effective examination rather than navigating a graphical menu based
    forensic tool where functions, options and output are displayed in an organized
    "one click away" fashion.


    Brian Carrier, author of The Sleuth Kit, utilizes a framework for storage device
    analysis in his book File System Forensic Analysis, which we mentioned earlier.
    As a result of this approach, Carrier organizes his tools into a series of virtual
    layers that define the purpose of each tool with respect to a specific layer.
    Conveniently, the Sleuth Kit tools are named after these layers. By introducing
    tools in a given category and defining their respective layer membership, students
    can better organize their understanding of each tool''s function and where it
    fits in an analysis.


    This approach can be easily extended and expanded to encompass additional tools
    outside Sleuth Kit. While some tools do not succinctly fit in this paradigm, they
    can still be addressed in a sequence that fits the overall analytical approach.


    This has the added benefit of giving students a way of conceptualizing the way
    tools are employed. The following figure provides a graphical summary of the layers
    Carrier designates for the analysis of evidence.'
  merge: -1
  img_proc: true
- pgno: 206
  md: "v.4.33  A Comprehensive Beginner's Guide to Linux as a Digital Forensic Platform\n\
    \n| Physical Media | Media Management | File System | Application |\n|---|---|---|---|-|\n\
    | Physical Description | | | |\n| Head Cyl Sectors | Partition Table | Boot Sector\
    \ / FAT / Data Areas | |\n| | Partition | ... | |\n| | | File | File Meta-data\
    \ |\n| | | | Content |\n|\n\n*Illustration 5: An example of layers and their associated\
    \ content based on Carrier's work*\n\nWe have a diverse set of tools to work with\
    \ in Linux, particularly when tackling an analysis from the command line is concerned.\
    \ Knowing when to use tools can be better mentally organized by extending this\
    \ layer approach to our entire analysis.\n\nUnderstanding which particular tools\
    \ fit into this approach will help us define, and for what purpose they should\
    \ be used. We've already covered a number of common tools like **dd, dc3dd, hdparm,\
    \ lssci, lsh** and others. These are examples of tools that work at the *physical\
    \ media* – looking directly at physical media and disk information, including\
    \ serial numbers, disk sector sizes and the physical bus on which the media resides.\n\
    \nWe've also looked at what tools act on the media management layer, like **fdisk,\
    \ gdisk, kpartx** and others. These tools act on information provided at the partition\
    \ table level, but without specifically acting on the file systems.\n\nAs we progress\
    \ through the rest of this guide, be aware that often a tool's place in the layer\
    \ approach is not defined by the tool itself, but by how you use it. We take **grep**\
    \ for example. **grep** for matching expressions in a file. So we could say it\
    \ on the file sub layer of the File System layer (refer to illustration 5 above).\
    \ However, when we use it against a forensic image of a physical disk (like our\
    \ *able_3.raw* file), we are not using it at the file layer of that image, but\
    \ at the *physical layer* of the image. We can **grep** for an expression in a\
    \ set of files, or we can **grep** for an expression in a disk image. *How I use\
    \ the tool defines its place, not the tool itself in many cases.\n\nSo we need\
    \ to adjust our thinking on how we approach our analysis, keeping in mind that\
    \ the tool organization of the Sleuth Kit may not always match our approach. But\
    \ we can summarize it like this:\n\n+   1. Analyze the physical device:\n   -\
    \ **lssci, lsh, hdparm**\n2. Analyze the media management layer:\n   - **fdisk,\
    \ gdisk, file** (partition type), **mml** (we'll cover in the Sleuth Kit section)\n\
    3. Analyze the file system layer:\n   - Sleuth tools (**fsstat, fls**), **file**\
    \ (file system type)\n4. Analyze the file sub layer:\n\n207"
