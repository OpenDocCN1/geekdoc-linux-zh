    Given that carving can be approached with a variety of algorithms, it might be
    a good idea to run your data through more than one tool. As a result of this,
    we''ll also look at **photorec**.


    # **photorec**


    Part of the testdisk package, **photorec** is another carving program. It does,
    however, take a very different approach. **photorec** was not originally designed
    as a forensic utility, but rather as a data recovery tool for people who lose
    files from SD cards and other media. It has evolved into a very useful tool for
    extracting many different files from media. As part of the testdisk package, it
    is installed alongside the **testdisk** tool itself (for recovering partitions).
    **identify** (same basic idea as the file command, but less verbose), and qphotorec.

    qphotorec** is a GUI front end to **photorec**.


