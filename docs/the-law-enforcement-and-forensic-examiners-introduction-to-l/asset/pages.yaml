- pgno: 112
  md: '# libewf and ewfacquire


    There may be times when you are asked to perform examinations collected by someone
    else, or perhaps your organization has elected to standardize on a given format
    for forensic images. In any case, chances you will eventually come across Expert
    Witness format files (EWF, commonly referred to as "EnCase" format). There are
    many tools that can read, convert or work with these images. In this section we
    will learn to acquire and manipulate evidence the EWF format.


    We will explore a set of tools belonging to the libewf project. These tools provide
    the ability to create, view, convert and work with expert witness evidences.


    One of the benefits of using libewf before advanced forensic utilities is because
    it needs to be installed first to support the required libraries for other packages
    to support EWF image formats. The libewf tools and detailed project information
    can be found at https://github.com/libyal/libewf/


    We will start by installing libewf using sbotools. Check your distribution documentation,
    or the install instructions at the website above if you are using a distribution
    other than Slack. Libewf has no additional requirements (you can view the info
    file with sfbind -tei libewf). When you start the installation process be sure
    to take the time to read the README file that displays.


    Cleaning for libewf-20140608...'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Once the download, compile, build, and installation of the resulting package
    is complete, the actual totals are placed in /usr/bin. We will have a closer look
    at the following:


    +   * ewfacquire

    * ewfverify

    * ewfinfo

    * ewfacquirestream (in a later section)


    We''ll start with the ewfacquire command used to create EWF files that can be
    used in other programs. The easiest way to describe how ewfacquire works is to
    run it. There are a number of options available. To get a list of options (there
    are many), just run ewfacquire -h. Simply issue the image with the name of the
    file or physical device you wish to image. Unless you memorize or script the options,
    this is the easiest way to run. You are prompted for required information, to
