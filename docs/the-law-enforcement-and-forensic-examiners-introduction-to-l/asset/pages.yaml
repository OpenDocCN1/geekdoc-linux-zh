- pgno: 297
  md: 'With libssca installed, let''s look for a prefetch file to view. We''ll search
    the NTFS image for files ending in .pf. You can see there are quite a few of them
    (output is truncated).


    ```

    barry@forensic1:-$ fls -o 2048 NTFS_Pract_2017/NTFS_Pract_2017.E01 |

    grep .pf*$

    r/r 72-128-2:

    Windows/Prefetch/58.0.3029.81_CHROME_INSTALLER-F0A66AC.exe

    r/r 73-128-2:

    Windows/Prefetch/AUDIODG.EXE-BFD3029.pf


    r/r 123-128-2:

    Windows/Prefetch/NMAP.EXE-69B77167.pf

    ...

    r/r 135-128-2:

    Windows/Prefetch/SEARCHFILTERHOST.EXE-77482212.pf

    ```


    Our familiar fls command is executed, looking for files only, recursively (-Fr)
    in the file system at offset 2048 (- 2048) in our NTFS EWF files. Using **grep**,
    we are looking for .pf at the end of the line (signed by the $). The list is long,
    but we''ll look at NMAP.EXE prefetch file (MFT entry 123-128-2). We can extract
    the file from the image with **icat**:


    ```

    barry@forensic1:-$ icat -o 2048 NTFS_Pract_2017/NTFS_Pract_2017.E01 123 >

    nmap.pf.123

    ```


    Let''s verify quite look at the header of the file with xxd. You can see why with
    the library we just installed libssca. The prefetch header is 84 bytes with the
    version at offset 0x00 and the SCCA header at offset 0x04.


    ```

    barry@forensic1:-$ xxd -l 84 nmap.pf.123

    00000000: 1700 0000 5343 4341 1100 0000 aaaa 0000      SCCA...

    00000010: 4e00 0204 4100 5000 2e00 4500 4800      N.M.A.P..E.E..X.E.

    00000020: 0e00 0200 0000 0d35 a3b2 071b 719d      ......5.{q.

    00000030: bb36 0382 0100 483d 4087 1100 0000      ......6......H=..).......gq.i

    00000040: 0000 0000 0000

    ```


    Some of the features we can find (be careful of byte order):


    +   - prefetch version = 0x6b17 (Version 23 - Windows 7)

    - SCCA header = 0x5343 0x4341 (SCCA)

    - executable name = 0x4e 0x4d 0x41 0x50 0x2e 0x45 0x58 0x58 (NMAP.EXE)

    - prefetch hash = 0x69b7 0x71167 (matches the hash in .pf filename)


    The last execution time can be found at offset 128 in the prefetch file (8 bytes
    long), and we can use WinTime. again to decipher it:


    > http://www.forensicswiki.org/wiki/Windows Prefetch File Format'
  merge: -1
  img_proc: true
