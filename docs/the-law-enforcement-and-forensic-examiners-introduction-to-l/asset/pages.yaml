- pgno: 204
  md: '# IX. Advanced Analysis Tools


    So now you have some experience using the Linux command line and the powerful
    tools that are provided with a Linux installation.


    However, as forensic examiners, we come to find out that time is a valuable commodity.
    While learning to use the command line native to a Linux install is useful for
    a myriad of tasks in the "real world", it can also be tedious. After all, there
    are Windows based tools out that allow you to do much of what we have discussed
    here in a single point and click GUI. Well, the same can be said for Linux.


    The popularity of Linux is growing at a fantastic rate. Not only do we see it
    in an enterprise environment and in big media, but it continues to grow in popularity
    within the field of computer forensics. In recent years we''ve seen the list of
    available forensic tools for Linux grow with the rest of the industry.


    In this section we will cover a number of forensic tools available to make your
    analysis easier and more efficient.


    AUTHOR''S NOTE: Inclusion of tools and packages in this section in no way constitutes
    an endorsement of those tools. Please test them to ensure that they meet your
    needs.


    Since this is a Linux document, I am covering available Linux tools. This does
    not mean that the common tools available for other platforms cannot be used to
    accomplish many of the results.


    Please keep in mind, as you work through these exercises, this document is NOT
    meant be an education in file system or physical volume analysis. As you work
    through the exercises you will come across terms like inode, MFT entry, allocation
    status, partition tables and direct indirect blocks, etc. These exercises are
    about using the tools, and are not meant to instruct you on basic forensic knowledge.
    Linux file systems or any other file systems. This is all about the tools.


    If you need to learn file structure as it relates to computer forensics, please
    read Brian Carrier''s: File Forensic Analysis (Published by Addison-Wesley, 2005).
    This is not the last time I will suggest.


    To get a quick overview of some file systems, can you do a quick search. There
    is a ton of information available if you need a primer. Here are some simple links
    to get started²⁶ If you have questions on any of these file systems, or how they
    work, I would suggest some light reading before diving into these exercises.


    NTFS:

    http://www.ntfs.com


    ²⁶ The author does not vouch for any of these sources. They are provided for your
    information only.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'http://en.wikipedia.org/wiki/NTFS


    EXT2/3/4:


    http://e2fsprog.sourceforge.net/ext2intro.html

    http://en.wikipedia.org/wiki/Ext3

