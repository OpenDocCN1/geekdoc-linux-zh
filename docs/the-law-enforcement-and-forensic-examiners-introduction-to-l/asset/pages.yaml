  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    # # Mounting Evidence


    We''ve already discussed the mount command and using it to access file systems
    on external devices. Now that we are working with forensic images, we''ll need
    to access those as well. There are two ways to do this: through forensic software
    "physically"; or through volume mounting "logically".


    When we access the image with forensic software, we are accessing the entire physical
    image including unallocated blocks and inactive artifacts that were successfully
    recovered and copied by our imaging software (hardware). We''ll cover some forensic
    software in later sections.


    For now we are going to look some tools and techniques we can use to view the
    contents of an image as a logically mounted file system.


    # ## Structure of the Image


    The first step in all is to determine what volumes and file systems are available
    for logical mounting within our image. "Structure", in this case, refers to the
    partitioning scheme and identification of volumes and file systems within the
    image.


    Given that our images have been physical disks, they should all have some sort
    of partition table in them. We can detect this partition table using fdisk or
    gdisk. We will cover more "forensically" oriented software for this later (mmls
    from the Sleuth Kit), but for now, fdisk and gdisk should be available on any
    modern Linux system.


    We will cover fdisk first as we previously discussed, earlier using the -l option.
    We get the partition information from /dev/sda, for example:


    ```

    root@forensic1:-$ fdisk -l /dev/sda

    Disk /dev/sda: 11.8 GiB, 120834123776 bytes, 234416648 sectors

    Units of 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size: 512 bytes / 512 bytes

    Disk type: gpt

    Disk identifier: 6F0B42E4-B5CF-4C8F-A974-28A65DADC779

    ```


    | Device Start End Size Type |

    | /dev/sda1 2048 206847 204800 100M Linux filesystem |

    | /dev/sda2 206848 859455 652607 4G Linux swap |

    | /dev/sda3 859456 234441614 225841659 107.7G Linux filesystem |


    So the output of fdisk shows that the partition label is of GPT. If we run the
    gdisk command on the same disk? Here''s the output:


