  md: 'v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    Examine these commands closely. The input file (if=able_3.raw) is the full disk
    image. The output files (of=able_3.part#.raw) will contain each of the partitions.
    The block size that we are using the sector size (bs=512), which matches the output
    of the fdisk command. Each dd section to start where each partition begins (skip=X),
    and cut as far as the partition goes (count=Y).


    This will leave you three able_3.part#.raw files in your current directory that
    can now be loop mounted without special programs.


    # Reconstructing the Subject File System Structure (Linux)


    Going back to our able_3 case raw images, we now have the original image along
    with the partitions that we carved out (plus the original split images).


    +   able_3.part1.raw (1st Partition)

    able_3.part2.raw (2nd Partition)

    able_3.part3.raw (3rd Partition)


    One of the benefits of Linux/Unix is the ability to separate the file system across
    partitions. This can be done for any number of reasons, allowing for flexibility
    where there are concerns about disk space or security,.


    For example, a system administrator may decide to keep the /var/log on its own
    partition. This might be done in an attempt to prevent rampant log files from
    filling the root (/ not root) partition and bringing the system down. Several
    years later, finding the /boot directory in its own partition was common as well.
    This allows the kernel image to be placed near the "front" (in terms of cylinders)
    of a boot volume, an issue in some older loader boots. There are also a variety
    of security implications addressed by this setup.


    So when you have a disk with multiple partitions, how do you find out the structure
    of the file system? Earlier in this paper we discussed the /etc/fstab file. This
    file maintains the information for each file system, including the partition;
    mount point, file system type, and options. Once we find this file, reconstructing
    the system is easy. With experience, you will start to get a feel for how partitions
    are set up, and where to look for the fstab. To make things simple, just mount
    each partition (loop, read only) and have a look around.


    One thing we might like to know what sort of file system is each partition before
    we try and mount them. We can use the file command to do this²⁴. Remember from
    our


    ²⁴ Keep in mind that the file command relies on the magic file to determine a
    the file type. If this command does not work for you in the following, then it
    is most likely because the magic file on your system does not include headers
    for file system types.


    201'
