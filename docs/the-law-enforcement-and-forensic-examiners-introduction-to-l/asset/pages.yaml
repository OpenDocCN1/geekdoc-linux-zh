    \    * Once the system is booted, you are presented with the keyboard map prompt\
    \ followed by the \"slack login\" prompt. READ THE ENTIRE SCREEN as instructed.\
    \ Login as root, and continue with your install routine.\n\n+   2) Partition and\
    \ format for Linux\n    * You will partition your Slack Linux system using **fdisk\
    \ or gdisk** (if you prefer a GPT layout).\n    * This step is normal part of\
    \ the installation process, or created in the distribution's documentation. You\
    \ can partition however you like. I like to have, at least, two partitions\n \
    \   * Root (/) as type \"Linux Native\"\n    * Swap as type \"Linux swap (use\
    \ 2x system memory as a starting point for swap). The size of a swap partition\
    \ is largely optional for machines with large amounts of RAM (>3GB). I still opt\
    \ to use it.\n    * You will hear a lot about using multiple partitions for different\
    \ directories. Don't let that confuse you. There are arguments for and against\
    \ using multiple partitions for a Linux file system. If you are just starting,\
    \ use one large root (/) and one swap partition as described above.\n\n+   3)\
    \ Package installation (system)\n    * The main install routine forer is started\
    \ with the command **setup**. You will need to ensure that you have your disk\
    \ properly partitioned **before** you enter the setup program.\n    * Take the\
    \ time to read each screen completely as it comes up.\n\n16"
