    already-used commands. Instead of re-typing a command over and again, you can
    access it from the history.

    * From the perspective of a forensic examiner, if you are examining a Linux system,
    you can access each user''s (don''t forget root) .bash_history file to see what
    commands were run from the command line. Remember that the leading " in the file
    name signifies that it is a hidden file.


