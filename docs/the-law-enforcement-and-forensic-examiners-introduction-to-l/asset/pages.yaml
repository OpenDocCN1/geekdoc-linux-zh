  md: '# Scalpel


    We''ll start by installing scalpel. Use sboinstall to install it, being sure to
    read the

    README file. If you are not using Slackware, go ahead and use your distribution''s
    package

    management tool. You will see that for Slack, scalpel has a single dependency
    that must

    be installed first TRE, which is handled automatically by sboinstall:


    ```

    root@forensic1:~ sboinstall scalpel

    Scalpel is a fast file carver that reads a database of header and footer

    definitions and extracts matching files or data fragments from a set of

    image files or raw device files. Scalpel is filesystem-independent and will

    carve files from FATX, NTFS, ext2/3, HFS+, or raw partitions. It is useful

    for digital forensics investigation and file recovery.

    ```


    To use it, you MUST have a conf file that defines the file types you want

    recover. Use the example scalpel.conf file from /usr/doc/scalpel


    See the man page for details

    ...

    Proceed with tre? [y]

    t added to install queue.

    ...

    Proceed with scalpel? [y]

    ...

    Install queue: tre scalpel

    Are you sure you wish to continue? [y]

    ...

    Package scalpel-2.0-x86_64-1-SBo.tgz installed.


    Cleaning for scalpel-2.0...


    If you read the README file (which you did, RIGHT?), you will see that we need
    to copy\and edit the scalpel.conf file before we can run the program. We can either
    edit and use it

    in place, or copy it to our working directory which scalpel uses default.


    For now, we''ll copy the scalpel.conf file that was installed with our package
    to a new

    carve sub directory in our /home directory, which we''ll create now, and edit
    it there.


    ```

    barry@forensic1:~$ mkdir ~/carve

    barry@forensic1:~$ cd ~/carve


    barry@forensic1:~/carve cp /usr/share/doc/scalpel-2.0/scalpel.conf .

    ```'
