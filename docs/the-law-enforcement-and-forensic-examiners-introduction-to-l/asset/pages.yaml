  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    Now let''s go one step further in on the fly compression demonstration. How about
    putting a few of these steps altogether? Recall our imaging over the network netcat.
    If you look at the different sizes of our compressed vs. uncompressed images,
    you''ll see there quite a difference in size (which will, of course, depend on
    the compress-ibility of the data on the volume being imaged). Do you think it
    might be faster to compress data before sending over the network? Let''s find
    out.


    Going back to our simple network setup, let''s do the same imaging, but this we''ll
    pipe to gzip -c on one side of the network and gzip -cd on the other, effectively
    sending compressed across the wire. The resulting image is NOT compressed. We
    decompress before it reaches the imaging tool. You can elect to leave that if
    you like and simply write a compressed image.


    We''ll start by hashing the subject hard drive again from our boot disk. Assuming
    the network settings are correct, and opening our netcat listener and dc3dd process
    on the collection box:


    ```

    root@bootdisk:# sha1sum /dev/sda

    8fcec10ae87d6ff4590ba809ba51358679738ed /dev/sda

    ```


    Open the listening process, redirecting the output to a file. I''m using dc3dd
    with hof= to collect and output hash to compare the sha1 above.


    ```

    root@forensic:/testcomp nc -l -p 2525 | gzip -cd dc3dd hash=sha1 hof=ncgzuncomp.raw
    log=ncgzuncomp.log

    ```


    And now start the imaging on the subject box:


    ```

    root@bootdisk:# dd if=/dev/sda | gzip -c | nc 192.168.0.1 2525

    ```


    When the imaging is complete, we can check the resulting dc3dd log, ncgzuncomp.raw,
    to verify the integrity of the resulting image:


    ```

    root@forensic:/testcomp ls -lh ncgzuncomp.raw

    -rw-r--r-- 1 root 12G M 6 13:46 ncgzuncomp.raw

