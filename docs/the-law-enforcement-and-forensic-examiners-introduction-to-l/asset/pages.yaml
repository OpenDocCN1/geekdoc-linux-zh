    ![](img/993644c785d68ca888a5ade02ca8088d_239_0.png)


    BLKLS IMAGE: 0 1 2 3 4 5 6 7 8 ...


    +   - Allocated

    - Unallocated


    blklcalc -o sfs_offset -u 3 original.dd = 49


    In the illustrated example above, the data in block #3 of the blkls image would
    map to block #49 in the original file system. We would find this with the blklcalc
    command as shown in Illustration 6.


    So, in simple terms, we have extracted the unallocated space, found a string of
    interest in a data block in the unallocated image, and then found the corresponding
    data block in the original image.


    If we look at the blkstat (data block statistics) output for block 5184 in the
    original image, we see that it is, in fact unallocated, which makes sense, since
    we found it within our extracted unallocated space (we''re back to the same results
    as in Exercise #2A). Note that we


