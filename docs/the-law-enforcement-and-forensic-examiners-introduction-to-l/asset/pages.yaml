  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    If you run the fls command with the -o option to specify the file system, then
    by default it will run on the file system''s root directory. This is inode 2 on
    an EXT file system and MFT entry 5 on an NTFS file system.


    In other words, an EXT file system, running:


    ```

    barry@forensic1:-~/abled$ fls -o 10260 able2.dd

    ```


    And...


    ```

    barry@forensic1:-~/abled$ fls -o 10260 able2.dd 2

    ```


    ...will result in the same output. In the second command, the 2 passed at the
    end of the command means "root directory"(for EXT), which is the default in the
    first command.


    So, in the following command, we run fls and only pass -o 10260. This results
    in a listing of the contents of the root directory:


    ```

    barry@forensic1:-~/abled$ fls -o 10260 able2.dd

    d/d 11: lost+found

