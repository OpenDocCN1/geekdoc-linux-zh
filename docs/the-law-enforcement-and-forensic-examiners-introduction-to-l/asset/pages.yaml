    You can see in the output above that this system has a number of USB devices and
    external media attached. This is a useful way of finding out what storage media
    are attached to a system. You will also notice that there are "disks" identified
    by lscsi that are not listed by lsblk. This is because lscsi is actually looking
    what is attached to the interface, not the actual media. lscsi is identifying
    media readers that have no media inserted. lscsi does not show on most platforms
    by default (although it does on Slackware).


