    Alternatively, you can query /proc/mounts. Where the mount is actually displaying
    the contents of /etc/mtab, /proc/mounts is actually more up to date. The /proc
    file system on Linux is a virtual hierarchical storage of system processes and
    information. Use cat /proc/mounts to view the output.


    The ability to mount and unmount file systems is an important skill in Linux.
    We use it to view the contents of a file system, and use it to mount external
    storage for collecting evidence files, etc. There are a large number of options
    that can be used with mount (some we will cover), and a number of ways the mounting
    can be done easily and automatically. Refer to the mount info or man pages for
    more information.


    In most modern distributions (Slackware), disks will be auto-detected, and an
    icon will appear on the desktop for it. We''ll cover that in an upcoming section.


    # The File System Table (/etc/fstab)


    It might seem like mount -t iso9660 /dev/cdrom /mnt/cdrom is a lot to every time
    you want to mount a CD. One way is to edit the file /etc/fstab ("file system table”).
    This file allows you to provide defaults for your mountable file systems, thereby
    shortening the commands required to mount them. My /etc/fstab looks like this:


    ```

    root@forensic1:-# cat /etc/fstab

    /dev/sda2    swap            swap        defaults      0 0

    /dev/sda3   /ext4        defaults      1 1

    /dev/sda1   /boot          ext4        defaults      2 1

    /dev/cdrom  /mnt/cdrom     auto        noauto,owner,ro 0 0

    devpts      /dev/pts      devpts      gid=5,mode=620 0 0

    proc        /proc          proc        defaults      0 0

    tmpfs       /dev/shm      tmpfs       defaults      0 0

    ```


    The columns are:


    ```

    <device>           <mount point>   <fst>          <default options>

    ```


    With this /etc/fstab, I can mount a CD by simply typing:'
