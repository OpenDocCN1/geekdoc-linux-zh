  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    we want extracted from the archive (lrk3/README). This is all redirected to a
    new file called lrkn.2139.README.


    If you read file (less), you will find that we have uncovered a "rootkit", full
    of programs used to hide a hacker''s activity.


    Briefly, let''s look at a different type of file recovered by icat. The concept
    is the same, but instead of extracting a file, you can stream it to stdout for
    viewing. Recall our previous directory listing of the .001 directory in inode
    11105:


    ```

    barry@forensic1:-able2$ fls -o 10260 able2.dd 11105

    r/r 2138: lolit_pics.tar.gz

    r/r 11107: lolitaz1

    r/r 11108: lolitaz10

    ...

    ```


    We can determine the contents of the (allocated) file with inode 11108, for example,
    by using icat to stream the inode''s data blocks through a pipe to the file command.
    We use the "-” to indicate that file is getting its input from the pipe:


    ```

    barry@forensic1:-able2$ icat -o 10260 able2.dd 11108 | file -

    /dev/stdin: GIF image data, version 89a, 233 x 220

    ```


    The output shows that we are dealing with a picture file. So we decide to use
    the display command to show us the contents. display is a useful program as it
    will take input stdin (from a pipe). This is particularly useful with the icat
    command.


    ```

    barry@forensic1:-able2$ icat -o 10260 able2.dd 11108 | display

    ```


    This results in an image opening in a window, assuming you are running in a graphical
    environment and have ImageMagick installed, which provides the display utility.'
