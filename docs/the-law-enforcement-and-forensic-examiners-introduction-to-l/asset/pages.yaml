    # Physical Carving


    We''ve seen a number of cases in previous exercises where we needed to locate
    headers to recover data. We saw a specific need for this with the ext4 exercise
    where we found that block pointers are no longer available for deleted files,
    making recovery very difficult. We also did manual recovery in our "Data Carving
    with dd", locating the header of a JPEG file in hex and using dd to physically
    "carve" the out. A useful skill, but a bit tedious on a large disk with potentially
    dozens, hundreds or even thousands of files that might require recovery. If you
    are unfamiliar with file carving, or need a refresher, you can start reading here:
    http://forensicwiki.org/wiki/File_Carving


    Since we gained a courtesy understanding of the mechanics of carving through our
    dd problem, we can move on more automated tools that do the work for us. There
    are a number of tools available to accomplish this. We are going to concentrate
    on just two Scalpel, and photorec. The latter is from the testdisk package.'
