- pgno: 300
  md: '# X. Integrating Linux with Your Work


    This guide covers a myriad of subjects that really just touch the surface of the
    command line capabilities of Linux as a forensic platform. And while it is a lengthy
    guide, it still implies a basic set of commands and utilities to allow you to
    learn and grow as a forensic examiner or digital investigator. The real power
    of Linux (as an heir of UNIX itself) is in thinking UNIX. The more you use commands
    and get used to the output they produce, the more you will learn to string them
    together, solving increasingly complex issues quickly and efficiently. Getting
    a solid grasp of command line pipes and redirection is a liberating process.


    Some of the repeated exercises we''ve done here were designed to kick start the
    repetition to anchor the command line into memory. It is not, however, realistic
    to expect that everyone will suddenly convert to Linux and forget other operating
    systems for forensic analysis. Linux is, at the end of the day, just another platform
    and tool set. I maintain that there is some value in every examiner to last familiar
    with and the tools it provides. We''ve talked about how the command line tools
    we''ve encountered (and there are *many*) are unique compared to common Windows
    tools. Much of this difference arises from the fact that they are generally designed
    with the UNIX approach of "do one thing and do it well". We see this in tools
    like grep, head, tail, tr, sed and utilities like icat, blkls and catdoc. They
    provide discrete output when they run on their output, but as you start piping
    them, you end accomplishing multiple steps in the same command line. This becomes
    very powerful not only when you learn what each tool is capable of, but when you
    also start to think in terms of a modular command line. Learning and remembering
    all this, means less of a burden on examiner resources. And so, one of the strengths
    of Linux is also, in fact, one of its weaknesses when it comes to mass appeal
    in the forensic community.


    So do we continue to use Linux, maintain what we''ve learned and continue learning,
    while remaining efficient? Let''s discuss how you can integrate a Linux platform
    into your lab or examination processes and continue to use it, if not on a daily
    basis, at least to maintain (and continue growing) the skills we''ve introduced.


    We''ve seen tools in this guide that can be used to access file data, file system,
    volume information, and block information, etc. It can be done quickly and without
    the need for licenses, multiple programs, or extra resources to lead and target
    wanted information. Being able to accomplish this on full disk image or blocks
    of separated data (like the unallocated output of blkls, for example) and even
    individual files, makes Linux an excellent platform for both tool validation and
    the cross-verification of findings.


    Validation, in this context, can be seen as comparing the output of different
    tools to test specific software functions (or in some cases, hardware functions)
    and hopefully determine that the output is *supposed* to give is actually produced.
    If your lab or organization'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    validation standards for forensic software and hardware, we can strengthen these
    by not only confirming similar functions in multiple tools, but by comparing the
    output of the tool being tested (a function of commercial software on Windows,
    for example) to an open source tool on an alternative (and also open source) operating
    system. Conclusive validation of functional output is find easier to test results
    when those results are from entirely different systems. Linux can provide environment
    where separate tools are running on an entirely different operating system kernel
    and environment completely, removing any potential appearance of interference.


    We can also use Linux for cross-verification. In those cases where you find specific
    evidence with one of your standard commercial forensic tools, you can verify those
    results by comparing them on an alternative operating system with alternative
    tools. This is not the same as validation. In this case we are testing a function,
    we are confirming a finding. For example, you might find a file or set of files
    pertinent to an investigation. The files were found in a particular volume, in
    a particular block (or cluster) that was associated with a particular meta-data
    entry (MFT). Running mmls, blstat and ifind, can help us verify those findings
    taken from a commercial tool. In cases where the data recovered may be contested
    or your recovery process inspected, having this cross-verification can never arguments
    against your procedures or tools more difficult.


    As a very example, let''s look at the SAM registry file that we worked on in the
    section covering layer analysis. If we commonly use Windows as our standard forensic
    platform, we might extract registry files with Access Data''s FTK and tools like
    RegRipper to parse them. If that was the case with the SAM file we examined previously,
    then I have found the following information:


    | Name | SAM |

    |---|-|

    | File Class | Regular File |

    | File Size | 262,144 |

