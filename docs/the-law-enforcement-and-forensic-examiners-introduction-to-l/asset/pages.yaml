    Let''s check the hash of the image parts and compare to the:


    ```

    root@forensic1:~/# cat able_3.00* | shasum

    2ddbfe3d00cc736172ec320df88f61afda3502

    ```


    Remember that the cat command streams the files one after the other and sends
    them through stdout. The shasum command takes the data from the pipe and hashes
    it. As we mentioned earlier, the - hash output indicates standard input was hashed,
    not a file. The hashes match and our image is good.


    Now suppose we want to mount the images to see the file systems or browse for
    specific files. One solution would be to use the cat command we did and redirect
    the output to a new file all of the segments.


    ```

    root@forensic1:~/# cat able_3.0* > able_3.raw

    ```


    ```

    root@forensic1:~/# ls -lh able_3.raw

    -rw-r--r-- 1 bary users 4k May 27 11:28 able_3.raw

    root@forensic1:~/# shasum able_3.raw

    2ddbfe3d00cc736172ec320df88f61afda3502 able_3.raw

    ```


    The problem with this approach is that it takes twice the space as we are essentially
    duplicating the acquired disk, but in a single image rather than split. Not efficient
    for resource management.


    We need a way to take the split images and create a virtual "whole disk" that
    we can mount using techniques we learned already. We''ll use affuse and the file
    system it provides. All we need to do is call affuse with the name of the first
    segment of our split image and provide a mount point where we can access the virtual
    disk image:


    ```

    root@forensic1:~/# mkdir /mnt/aff

    root@forensic1:~/# affuse able_3.000 /mnt/aff

    root@forensic1:~/# ls -lh /mnt/aff

    total 0

    ```'
