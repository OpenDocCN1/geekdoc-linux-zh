  md: "# v4.33\nA Comprehensive Beginner's Guide to Linux as a Digital Forensic Platform\n\
    \n+   - When asked to format the root partition, I would suggest selecting the\
    \ ext4 file system.\n- When asked packages to select for installation, it is usually\
    \ safe for a beginner to select \"everything\" or \"full\". This allows you to\
