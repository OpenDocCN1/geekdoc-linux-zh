- pgno: 187
  md: '# v4.33

    A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    Each line in the log files begin with a date and time stamp. Next comes the host
    followed by the name of the application that generated the log message. Finally,
    the actual message is printed.


    For the sake of our exercise, let''s assume these logs are from a victim system,
    and we want to analyze and parse the useful information. We are not going to worry
    about what we actually seeing here, our objective is to understand how to boil
    the information down to something useful.


    First of all, rather than parsing each file individually, let''s try and analyze
    all the logs at one. They are all in the same format, and essentially they comprise
    one large log. We use the cat command to add all the files together and send them
    to standard output. If we work on that data stream, we are essentially making
    one log out of five logs. Can you see a potential problem with this?


    ```

    barry@forensic1:~/Logs$ cat messages* | less

    Nov 17 04:02:14 hostname123 syslog 1.4.1: restart.

    Nov 17 04:05:46 hostname123 su(pam_unix) [19307]: session opened for user news

    Nov 17 04:05:47 hostname123 su(pam_unix) [19307]: session closed for user news


    Nov 23 18:27:58 hostname123 kernel: hda: hda1 hda2 hda3 hda4 < hda5 hda6 hda7
    >

    Nov 23 18:27:00 hostname123 rc.sysinit: Mounting proc filesystem: succeeded<--
    entries appear out of order

    Nov 10 04:02:08 hostname123 syslog 1.4.1: restart.

    Nov 04 04:05:55 hostname123 su(pam_unix) [151831]: session opened for user news

    Nov 11 04:05:55 hostname123 su(pam_unix) [151831]: session opened for user news

    Nov 11 04:06:09 hostname123 su(pam_unix) [32640]: session opened for user news

    Nov 11 04:06:10 hostname123 su(pam_unix) [32640]: session closed for user news

    ...

    ```


    If you look at the data and then (scroll up) you will see that the dates then
    jump to an earlier date and start to ascend again. This is because the log entries
    are added to the bottom of each file, so as the files are added together, the
    dates appear to be out of order. What we really want to do stream each file backwards
    so that they get added together with the most recent date in each file the top
    of the bottom. In this way, the files are added together they are in order. In
    order to accomplish this, we use tac (yes, that''s cat backwards).


    ```

    barry@forensic1:~/Logs$ tac messages* | less

    Nov 23 18:27:00 hostname123 rc.sysinit: Mounting proc filesystem: succeeded

    Nov 23 18:27:58 hostname123 kernel: hda: hda1 hda2 hda3 hda4 < hda5 hda6 hda7
    =

    Nov 23 18:27:58 hostname123 kernel: Partition created:

    ...

    ```'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    Beautiful. The dates are now in order. We can now work on the stream of log entries
    as if they were one large (in order) file. We will continue to work with this
    tac command to create our in-order stream with each command. We could redirect
    to another single log file that contains all the logs, but there''s no need to
    redirect right now and creating one large log file serves no real purpose.


    First, let''s gather some information. We might want to know, perhaps for our
    notes, how many entries are in each file, and how many entries total. Here''s
    a quick way of doing from that command:


    ```

    barry@forensic1:~/Logs$ tac messages* | wc -l

    374

    ```


    The same command is used to stream all the files together and send the output
    through the pipe to the wc ("word count"). The -l option specifies that we want
    to count just instead of the default output of lines, words and bytes. To get
    a count for all the files and at the same time, use wc -l on all the messages
    at one time:


    ```

    barry@forensic1:~/Logs$ wc -l messages*

    100 messages

    109 messages.1

    100 messages.2

    50 messages.3

    15 messages.4

    374 total

    ```


    Now we introduce a new command, awk, to help us use specific fields from the log
    entries, in this case, the dates. awk is an extremely powerful command. The version
    most often found on Linux systems is gawk (GNU awk). While we are going to use
    it as a stand-alone command, awk is a programming language on its own, and can
    be used to write scripts for organizing data. Our concentration will be centered
    on the awk "print" function. See man awk for details.


    Sets of repetitive data can be divided into columns or "fields", depending on
    the structure of the file. In this case, the log files are separated by simple
    white space (the awk default field separator). The data is comprised of the first
    two fields (month and day). So let''s have a look at awk in index:


    ```

    barry@forensic1:~/Logs$ tac messages* | awk ''{print $1 " "$2"}'' | less

    Nov 23

    Nov 23

    ```


