    -rw-r--r-- 1 root 2147479552 May 4 09:19 ddres.img.raw

    ```


    The above session shows the output of the completed ddrescue command followed
    by the contents of the map file. The ddres command shows the initial status line
    indicating where we left off, and then current status through image completion.
    The echo command converts our hexadecimal value to decimal, so we can illustrate
    that the total rescued is equal in size to the size of the image.


    The real power of the map file lies in the fact that we can start and stop the
    imaging process as needed and potentially attack the recovery from different directions
    (using the -R option to read the disk in reverse) until we''ve scraped together
    as much of the original data as you can. For example, if you had two identical
    disks, and both had bad or failing sectors, you could probably reconstruct a complete
    image with both ddrescue and the same map file (and output file). Once recovered
    and recorded as such in the map file, sectors are not accessed again. This limits
    the stress to the disk.


    Using a disk with known errors we''ll invoke ddrescue with some additional options.
    In this case, I have started imaging a subject disk using a common tool like dd
    or dc33d, and found the copy failed with errors. Knowing this, I''ll switch to
    using ddrescue. The options in the command below are -10 to indicate starting
    at offset 0. Offset is the default, but I''m being explicit here. There are situations
    where you might want to start at a different offset and then go back.. the map
    file allows for this. The -d option means that we are going to directly access
    the disk, bypassing the kernel cache. The -N option is provided to prevent ddrescue
    from "trimming" the bad areas that are found. This option allows ddrescue to start
    the recovery process by collecting good data first, disturbing the error areas
    as little as possible.


