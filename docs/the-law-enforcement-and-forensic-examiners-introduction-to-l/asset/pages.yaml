    root@forensic:~# usb-devices | less


    T: Bus=001 Lev=01 Prnt=01 Port=05 Cnt=05 Dev#=120 Spd=480 MxCh= 0

    D: Ver=2.0 Cls=(0)if Sub Prot=00 MxPs=64 #Cfgs= 1

    P: Vendor=148f Product=5372 Rev=01.01

    S: Manufacturer=Realtek

    S: Product=802.1 n WLAN

    C: Ifs=1 Config=1 Alt=80 MxPwr=450mA

    I: Iff=0 Alt=0 #Eps=7 Clfs(vend.) Sub-ff Prot=ff Driver=rt28000usb

    ```


    Note that the comments and methods for managing modules are largely abstract,
    but the

    locations of files and methods may differ. The process of identifying

    modules and hardware should be the same. Man (manual) pages and distribution

    documentation should always be relied on for primary problem solving.


    Keep in mind that these commands can be run against a subject computer

    using Linux forensic boot media. If you have the time, its a great way to inventory
    a

    subject computer either prior to seizure or if you seize the computer (only image
    it for

    whatever reason), but still wish to have a full hardware inventory.


    # Hotplug devices and Udev


    Starting with kernel version 2.6.13, Linux device management was handed over to

    a new system called Udev. Traditionally, the device nodes (representing the devices,

    located in the /dev directory) using in previous kernels were static, and that
    is exists'
