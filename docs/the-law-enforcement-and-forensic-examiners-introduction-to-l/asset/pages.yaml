    > Note that the “-” after su allows Linux to apply root''s environment (including
    root''s path) to your login. So you do not have to enter the full path of a command.
    Actually, su is a “switch user” command, and can allow you to become any user
    (if you know the password), not just root. Notice after you type exit as root,
    our prompt indicates that we are back to our normal measure.


    A word of caution: Be VERY judicious in your use of root login. It can be destructive.
    For simple tasks that require permission, su and use it sparingly. Some distributions
    (Ubuntu, for example) have decided that logging in as the root user is dangerous
    that the account is “disabled”. All commands that require permissions on Ubuntu
    utilize the sudo command to give access. sudo is similar to su, but is used on
    a per-command basis, so you never actually log in root.


    # Desktop Environment


    When talking about forensic suitability, your choice of desktop system can make
    a difference. First of all, the term “desktop environment” and “window manager”
    are NOT interchangeable. Lets briefly clarify the components of a common Linux
    GUI.


    +   * X Window – This is the GUI used in Linux. It is the application that provides
    the GUI framework, and is NOT part of the OS. X is a client / server program with
    complete network transparency.

    * Window Manager – This is a program that controls the appearance of windows in
    the X Window system, along with certain GUI behaviors (window focus, etc.). Examples
    are Kwin, Metacity, XFW, Enlightenment, etc.

    * Desktop Environment – A combination of Window Manager and a consistent interface
    that provides the overall desktop experience. Examples are XFCE, GNOME, KDE, etc.

    > The default Window Manager for KDE is Kwin.

    > The default Window Manager for XFCE is XWM.


    These defaults can be changed to allow for preferences in speed and resource'
