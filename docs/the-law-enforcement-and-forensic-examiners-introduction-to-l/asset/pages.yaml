    command), and multiply by 512 (the sector size). This gives us the offset from
    the start of our image to the first partition we want to mount. This is then passed
    to the mount command as an option, which essentially triggers the use of an available
    loop device to mount the specified file system. We can illustrate this by looking
    at the raw image of the file we exported with fwdiskexport in our earlier acquisitions
    exercise, the NTFS_Pract_2017.raw file. Go ahead and navigate to where you have
    saved the file.


    Very quickly, lets run through the steps we need to mount this image. First time
    round, we will determine the offset to the file system using fdisk, and then mount
    the file system using the command -o loop option.


    ```

    root@forensic1:~ fdisk -l NTFS_Pract_2017.raw

    NTFS_Pract_2017.raw: 500 MiB, 524288000 bytes, 102400 sectors

