  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    Once again, we see that the hash remains unchanged. The - at the end of the output
    denotes that we took our input from stdin, not from a file or device. In the command
    above, shasum receives its input directly from the cat command through the pipe.


    Another way of accomplishing multi-segment images would be to split the image
    as we create it (directly from a dd command). This is essentially the "on the
    fly" splitting we mentioned earlier. We do this by piping the output of the dd
    command our subject is to split, omitting the -of portion of the dd command. Assuming
    our drive is /dev/sdc, we would use the command:


    ```

    root@forensic1:/case1/images# dd if=/dev/sdc split -d a -3 2b -6 case1.disk.split

    78125000+ records in

    78125000+ records out

    4000000000 bytes (40 GB, 37 GiB) copied, 974.1 s, 41.1 MB/s

    ```


    In this case, instead of giving the name of the file to be split in the split
    command, we give a sample -(after the 2g, where we had the input name in our previous
    example). The single dash is a descriptor that means "standard input". In other
    words, the command is taking from its input into the pipe provided by the standard
    dd instead of a file. Any options you want to pass to dd (block size [bs], count,
    etc. go before the pipe). The output shows the familiar name of sectors is correct
    for what we are imaging.


    Once we have image, the same technique using cat will allow us to reassemble it
    for hashing or analysis as we did with the split images above.


    For practice, you can use a small USB drive if you have one available and try
    this method on, splitting it into a reasonable number of parts. You can use any
    sample drive, being sure to replace our device node in the following command with
    /dev/sdx (where x is your drive, other media). Obtain a hash first, so that we
    can compare the split files and original and make sure that splitting changes
    nothing.


    This example uses a 128M USB drive that is arbitrarily split into 32M chunks for
    manageable output. Follow along with the commands, and experiment with options
    while changing the results in the output. It''s the best way to learn. We''ll
    start identifying the thumb disk with lsblk as soon as it''s plugged in (output
    is abbreviated for readability):


