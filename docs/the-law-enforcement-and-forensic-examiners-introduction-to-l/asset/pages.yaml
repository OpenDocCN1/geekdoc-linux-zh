  md: 'v.4.33


    A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    # # Application Analysis


    We''ve now covered several of the layers we discussed previously, including the
    physical and media management layers for disk information and partition layout;
    file system tools for gathering information on the file system statistics; and
    to work on individual files to search content and identify type of interest. We''ve
    even done data recovery at the physical block layer – regardless of volume and
    file system through carving and extensive searches. So now that we have recovered
    files, what do we do with them?


    This is where the Application Layer of our analysis model comes. For our purposes
    here, the term "application" can be thought of as operating system or user interactive
    files - that is: files created by applications by the operating system or through
    user interaction (either with the operating system or external software).


    In simple terms, application analysis can be as simple as viewing the file directly
    for content – we use **catdoc** and **catcox** for MS Office Files, various image
    viewers like **geeqie**, **xv** and **display** for pictures, and simple text
    viewers like **less** for simple ASCII files. Forensic analysis is much more than
    simply recovering files and displaying the content. That sort of activity is just
    *data recovery*. Digital forensics, however, needs to include other techniques:


    +   - temporal analysis (when did it happen?)

    - attribution (who made it happen?)

    - activity mapping (how did it happen?)


    Obviously we can gle some of this information through the analysis we''ve done
    already, using file times in the **istat** output or the location of files in
    a particular user''s home directory or **User''s** folder.


    In order to dig a little deeper, we are going to look at some simple applications
    that will allow us to peer into the Windows Registry, Event logs, and other artifacts
