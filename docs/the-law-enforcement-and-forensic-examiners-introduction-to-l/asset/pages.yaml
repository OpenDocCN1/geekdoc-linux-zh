    # Updating the Operating System


    Keeping the operating system up to date is an important part of workstation security.
    Most Linux distributions come with some sort of mechanism for keeping the OS up
    to date with the latest security and stability patches. If you choose to use a
    distribution other than Slack, be sure to check the appropriate documentation.


    +   - Debian and Ubuntu - synaptic, aptitude

    - Fedora - yum

    - Arch Linux - pacman

    - Gentoo - portage

    - VMware - slackpkg


    From the perspective of a forensic workstation, Slackware takes a particularly
    conservative (and therefore safe) approach to updating the operating system. Once
    a Slackware release is considered ''stable'', the addition of updated library
    and binary packages is generally limited to those for properly patched OS. Little
    or no emphasis is placed on running the ''latest and greatest'' for the simple
    sake of doing so. I would strongly suggest against continuously updating software
    without having a good reason (security patches, for example). New versions of
    critical libraries and software should always be tested before use in a production
    forensic environment – this does not imply revalidation with every update. That''s
    up to your policies and procedures.


    Note that with some distributions, updating the OS on a regular basis, without
    proper and complex configuration, can result in a disaster or so new and updated
    packages every couple of weeks. In the context of a stable, well tested forensic
    platform, this is less than ideal. Also, Slackware developers tend not to patch
    upstream code, as is common among some other distributions. Slackware takes the
    approach of "if it ain''t broke, don''t fix it".


    This information is not meant to disparage other distributions. From it any. Any
    properly administered Linux distribution makes a fine forensic platform. These
    are, however, important considerations if you are running a forensic workstation
    in any sort of litigious setting. Too often, Linux Forensics beginners trust their
    platform to numerous untested, desktop oriented updates, without thinking about
    potential changes in behavior that can, in admittedly limited circumstances, raise
    questions.


