- pgno: 66
  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    to how you can trace running services, and find out what they do. If you are running
    Linux (any flavor), and you do not know what services are running and why, then
    you need to re-think your approach to securing your forensic workstation.


    So what does the comsat service do? We can simply run the man command on the server
    program that is called. In this case, the program is in.comsat. If we run man
    in.comsat, we see that this service is used to notify a user of incoming mail
    (biff).


    Now we''re going to do a little deeper and learn about some other Linux commands
    and files (being the point of this guide and all...) as we disable and enable
    the service. Pay attention to all of these commands on your workstation, regardless
    of the distribution. Knowing what is “normal” for your particular setup allows
    you to recognize when things have changed, either through malicious intent or
    by accident.


    The following commands, with everything else in this guide, are best learned by
    hands on experimentation – keeping in mind that if you are not using Slack, your
    output is likely to differ, especially if TCP wrappers is not being used in whatever
    distribution you happen to be running.


    First we explore the network port being used by service, and see if it is running.
    We know the service is called comsat. We can use the /etc/services file to determine
    the port number to service mapping name.


    ```

    root@forensici:~# cat /etc/services | grep comsat

    biff    512/udp      #used by mail system to notify users

    ```


    So, using the grep command to find the line containing comsat we find that it
    is using UDP port 512. To determine if 512 is open, we can use the netstat command:


    ```

    root@forensici:~# netstat -anu

    Active connections (servers and established)

    Proto Recv-Q Send Local Address           State

    udp 0               0.0.0.0:512             0.0.0.0:*

    udp 0               0.0.0.0:37              0.0.0.0:*

    udp 0               0.0.0.0:68              0.0.0.0:*

    ```


    The netstat command tells us about open, running and listening services on our
    system. We use the -a flag to show listening and non-listening sockets (a “listening
    socket” is one that is awaiting incoming connections). We also add the -n flag
    to display numeric port/address numbers rather than attempt to parse service names.
    The last option, -u, displays only UDP services. If you run netstat by itself,
    the output is a little overwhelming. We fare it down significantly by limiting
    the protocols we are interested in seeing. Our netstat command shows that UDP
    port 512 is open.'
