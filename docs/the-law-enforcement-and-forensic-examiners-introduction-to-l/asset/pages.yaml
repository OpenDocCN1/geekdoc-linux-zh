- pgno: 13
  md: '# v.4.33  A Comprehensive Beginner''s Guide to Linux as a Digital Forensic
    Platform


    available software for Linux forensics is specifically built for and supported
    Ubuntu (though not exclusively in most cases). On a personal note, I find Ubuntu
    less than ideal for learning Linux. It is NOT to say that Ubuntu or its variations
    do not make excellent platforms. But this guide is focused on learning, and part
    of that journey starts with a clean slate and understanding how the operating
    system works and is made to suit your environment. That for we focus on a more
    Unix-like distribution.


    If you are unsure where to start, will be using this guide as your primary reference,
    and are interested in forensic applications of Linux, then I would suggest Slackware.
    The original commercial distribution, Slackware has been around for years and
    provides a good Standard Linux that remains true to the Unix philosophy. Not-encumbered
    by GUI configuration tools, Slackware aims to produce the "Unix-like" Linux distribution
    available. One of my personal favorites, and in my humble opinion, one of the
    best for a forensic platform. (http://www.slackware.com/). This guide is tailored
    for you with a Slackware installation.


    One to keep in mind: As mentioned earlier, if you are going to use Linux in a
    forensic capacity, then not to rely on GUI tools too. Most settings and configurations
    in Linux are maintained in text files (usually in your home directory, or /etc).
    By learning to edit the files you avoid problems when the X Window system is not
    available, or when the specific GUI tool you rely on is not on a system you might
    come across. In addition, knowledge of the text configuration files will give
    you insight into what is "normal", and what might have been changed when you examine
    a subject Linux system (though that is not the focus of this document). Learning
    to interpret configuration files is all part of the experience.


    # SLACK and Using this Guide


    Because of differences in architecture, the Linux distribution of your choice
    can cause different results in commands'' output and different behavior. Additionally,
    some sections of this document describing configuration files, startup scripts
    or software installation, for example, might appear vastly different depending
    on the distro you select.


    If you are selecting a Linux distribution for the sole purpose of learning along
    with this document, then I would suggest Slackware. Slackware is stable and does
    not attempt to enrich the user''s experience with cutting edge file system hacks
    or automatic configurations that might hamper forensic work. Detailed sections
    of this guide on the inner workings of Linux will be written towards a basic Slackware
    14.2 64 bit installation (current of this writing).


    By default, Slackware''s current installation routine leaves disk partitioning
    to the user. There are no default schemes that result in surprising "volume groups"
    or other complex disk management techniques. The resulting file system table (also
    known as fstab) is standard and not requiring edit to provide for a forensically
    sound environment.


    14'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Slack Linux is stable, consistent, and simple. As always, Linux is Linux. Any
    distribution can be changed to function like any other (in theory). However, my
    philosophy has always been to start with an optimal system, rather than attempt
    to "roll back" to a heavily modified and optimized for the desktop rather than
    than a forensic workstation.


    If you are comfortable with another distribution, then by all means, continue
    to use and learn it. Just be aware that there may be customization and modifications
    made to the standard kernel and file system setups that might not be ideal for
    forensic use. These can always be remediied, but I prefer to start as close to
    optimal as possible.


    # Installation Methods


    Download the needed bootable media files, burn them to a DVD or removable drive
    and boot the media. This is the most common method of installing Linux. Most distros
    can be downloaded for free http, ftp, or torrent. Slack is available at http://www.slack.com.
    Have a look at http://distrowatch.com/ for information on downloading and installing
    other distributions.


    During a standard installation, much of the work is done for you, and relatively
    safe defaults are provided. As mentioned earlier, hardware detection has gone
    through some great improvements in recent years. I believe that many (if not Linux)
    Linux distros are far easier and faster to install other "mainstream" operating
    systems. Typical Linux installation is well documented (check your specific distribution''s
    website for more information). There are numerous books available on the subject,
    and most of these are supplied with a Linux distribution ready for install.


    Familiarize yourself with Linux disk and partition naming conventions (covered
    in Chapter II of this document) and you should be ready to start.


    # Slack Installation Notes


    If you decide to give Slack a shot, here are some simple guidelines. The documentation
    provided on Slack''s site is complete and easy to follow. Read first...please.


    Decide on standalone Linux or dual boot. Install Windows first in a dual boot
    system. Determine how you want the Linux system to be partitioned. A single root
    partition and a single swap partition are fine. You might find it easier when
    first starting out to install Linux in a virtual machine (VM), either through
    VirtualBox or VMware for example. This will allow you to snapshot along the way
    and recover from any errors. It also provides you with access to community support
    via the host while installing your Linux system in a VM. Using Linux in a virtual
    machine is a perfectly acceptable way to follow this guide, and probably the easiest
    if you are an absolute beginner.'
  merge: -1
  img_proc: true
