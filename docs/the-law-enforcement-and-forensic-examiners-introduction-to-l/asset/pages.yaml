    # Hardware Configuration


    It''s always useful to know exactly what hardware is on your system. There will
    be times when you might need to change or select different kernel drivers or modules
    to make a piece of hardware run correctly. Because there are so many different
    hardware configurations out there, specifically configuring for your system will
    remain outside the scope of this guide. Kernel detection and configuration of
    devices (network interfaces, graphics controllers, sound, etc.) is automatic in
    most cases. If you have any issues, make note of your hardware (see below) and
    do some searching. Google is your friend, and there is a list of helpful starting
    places for assistance at the end of this guide.


    There are a number of ways to determine what specific hardware you are running
    on your system. You can use lspci (list PCI devices), for those devices attached
    to the PCI bus. If you have issues and search for something like "network card
    not detected in linux", and follow a link to a support forum, you will always
    find the request to "post the output of lspci". It is one of the first diagnostic
    steps for determining many hardware issues in Linux. This command''s output can
    get increasingly detailed (or "verbose") by adding the -v, -vw, or -vww. Note
    that you can run lspci from the installation disk prior to the setup program


