    So here we a full disk image. We run fdisk on the image (image file is not a device
    file) and find the offset to the partition is 2048 bytes (in red for emphasis).
    We use arithmetic expansion to calculate the byte offset (2048*512=1048576) and
    pass that as the offset in our mount command. This effectively "jumps over" the
    boot sector of the first partition, allowing the mount command to work properly.
    We will explore this in further detail later.


    Note that you can do the calculations for the offset using arithmetic expansion
    in the mount command if you choose:


