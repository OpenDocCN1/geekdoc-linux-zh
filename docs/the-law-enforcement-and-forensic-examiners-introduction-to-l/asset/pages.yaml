- pgno: 207
  md: "# A Comprehensive Beginner’s Guide to Linux as a Digital Forensic Platform\n\
    \n - file (file types), find (locate files) grep (file name attributes), common\
    \ file system tools (ls, etc.)\n\n+   5. Analyze the application layer:\n- view\
    \ files content with less, cat\n- locate specific file with grep\n- utilize extremal\
    \ level tools to view file formats like xv (or display) and catdoc, etc. We will\
    \ cover additional specialized tools for this later.\n\nSo you can see from the\
    \ list above that we have tools apply to different layers. This speaks to the\
    \ simplicity of the Unix development approach that has been around for decades.\
    \ The tools generally do one thing, do it well, but can be versatile in their\
    \ employment.\n\nIn summary, all means that instead of taking the approach that\
    \ we might normally with multi-functional Windows forensic software:\n\n+   -\
    \ Open a program\n- Open (or acquire) an image file with that program\n- \"Index\"\
    \ the image file within the program\n- Navigate the menu, collecting data and\
    \ reporting.\n\n...we can sit at command prompt and step through the various layers\
    \ of our examination, collecting and redirecting information as we go, peeling\
    \ through layer by layer of our analysis until we reach our conclusion. Instead\
    \ of fumbling around the command line, we target our commands to the layer we\
    \ are currently examining.\n\n# Sleuth Kit\n\nThe first of the extremal tools\
    \ we will cover here is a collection of command line tools called the Sleuth Kit\
    \ (TSK). This is a suite of tools written by Brian Carrier and maintained at http://www.sleuthkit.org.\
    \ It is partially based on the Coroner’s Toolkit (TCT) originally written by Dan\
    \ Farmer and Weiner Sema. TSK adds additional file system support and allows you\
    \ to analyze any file system regardless of the platform you are currently working\
    \ on.\n\nLet’s start with a discussion of the tools first. Most of the information\
    \ is readily available in the Sleuth Kit documentation or on the Sleuth Kit website.\n\
    \nWe’ve already discussed the TSK’s organization of tool function by layers. Here’s\
    \ a list of the tools, and where they fit in (the layers defined here are different\
    \ from our overall analytical approach).\n\n+   - Media management layer – mmmls,\
    \ mmcat, mmstat\n- File system layer – fsstat\n- File name layer (“Human Interface”)\
    \ – fls, ffind\n- Meta data (inode) layer – icat, ifs, ifind, istat"
  merge: -1
  img_proc: true
- pgno: 208
  md: 'v.4.33  A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    +   - Content (data) layer - blkcalc blkcat blklis blkstat


    We also have tools that address physical disks and tools that address the “journals”
    of some systems.


    +   - Journal tools - jcat, jls

    - file content tools - hfind, fcat


    Notice that the commands that correspond to the analysis of a given layer generally
    begin with a common letter. For example, the file system command starts with fs
    and the inode (meta-data) layer commands start with i and so on.


    If the “layer” approach above seems a little confusing to you, you should take
    the time to read TSK tool overview at:


    http://wiki.sleuthkit.org/index.php?title=TSK Tool Overview


    The author does a fine job of defining and describing these layers and how they
    fit together for a forensic analysis. Understanding that TSK tools operate at
    different layers is extremely important.


    It should be noted here that the output of each tool is specifically tailored
    to the file system being analyzed. For example, the fsstat command is used to
    print file system details. The structure of the output and the descriptive fields
    change depending on the target file system. This will become apparent throughout
    the exercises.


    In addition to the tools already mentioned, there are some miscellaneous tools
    included with the Sleuth Kit that do not fall into the above categories:


    +   - tsk_recover recovers unallocated (or all) files from a file system.

    - tsk_gettimes creates a body file for timelines (file activity only)

    - sorter categorizes unallocated and allocated files based on type (images, executables,
    etc.). Extremely flexible and configurable.

    - img_cat allows for the separation of meta-data and original data from image
    files (metadata pictures).

    - img_stat provides information about a forensic image. The information it provides
    depends on the format (aff, ewf, etc.).

    - hfind - lookup tool. Creates and searches an indexed database.

    - sigfind searches a given file (forensic image, disk, etc.) for a hex signature
    at any specified offset (sector boundary). Used for finding data structures

    - mactime creates a time line of file activity. Useful for intrusion investigations
    where temporal relationships are critical.

    - srch_strings – like standard BSD strings command, but with the ability to parse
    different encodings.


    209'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Sleuth Kit Installation


    We can install TSK simply with sboinstall:


    ```

    root@forensic1:-$ sboinstall sleuthkit

    ...

    Proceed with sleuthkit? [y]

    Package sleuthkit-4.4.2-x86_64-1_SBo.tgz installed.

    ...

    ```


    When we install TSK using the SlackBuild through sboinstall, or if you install
    manually from source, you can watch the build process. It should be noted that
    in order for Sleuth Kit tools to have built-in support for Expert Witness format
    images (EWF images), we need to have libewf installed first. This is why we covered
    libewf and installed earlier in the document. While the Sleuth Kit is configuring
    its installation process, it searches the system for libraries that it supports.
    Unless it''s not told to include specific capabilities, it will compile itself
    accordingly. In this case, since we have libewf and afflib already installed,
    TSK will be built with those formats supported. This will allow us to work directly
    on EWF and AFF images.


    When the installation is finished, you will find the Sleuth Kit tools located
    in /usr/bin.


    You can view a list of what was installed (and other package information) by viewing
    the file at /log/packages/sleuthkit-<ver>_SBo:


    ```

    root@forensic1:-$ less /var/log/packages/sleuthkit-4.4.2-x86_64-1_SBo

    PACKAGE NAME: sleuthkit-4.4.2-x86_64-1_SBo

    ...

    usr/

    usr/bin/

    usr/bin/blcalc

    usr/bin/blcat

    usr/bin/blkls

    usr/bin/blkstat

    usr/bin/fcat

    usr/bin/ffind

    ...

    ```'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    # # Sleuth Kit Exercises


    This section remains one of the most popular sections of this document, providing
    hands on exercises for TSK and a sample of its tools.


    Like all of the other exercises in this document, I''d suggest you follow along
    if you can. Using these commands on your own is the only way to really learn the
    techniques. Read the included man pages and feel free the options to get other
    output. The image files used in the following examples are available for download,
    and some have already been downloaded and used early in the guide.


    There are a number of ways to tackle the problems. In some cases we''ll use affuse
    or ewfmount to fuse mounted images from EWF files or split files. We''ll do it
    for practice, feel free to run the tools directly on the image files themselves
    (there will be demonstrations of both). Practice and experiment.


    We''ll also use some of the older image files that were used in previous versions
    of the guide. While the images are old and the file systems somewhat deprecated,
    we use them here because they provide a perfect vehicle for demonstrating tool
    usage. You''ll understand this bit more as we progress. We can compare output
    on some of the newer images and understand the limitations.


    For the following set of exercises, we''ll use the able2 image, one of the older
    but more educational images we''ve used. Create a directory for the able2 image
    and then cd into the directory. As usual, download with wget and check the hash,
    making sure it matches what we have:


    ```

    barry@forensic1:-$ mkdir able2

    barry@forensic1:-$ cd able2

    barry@forensic1:~/able2$ wget http://www.linuxleo.com/Files/able2.tar.gz

    ...

    barry@forensic1:~/able2$ shasum able2.tar.gz

    a093ec9ead6054665b89aa82140803790be97a6e able2.tar.gz

    ```


    Untar the image and let''s get started. Get your hands on the keyboard and feel
    along.


    211'
