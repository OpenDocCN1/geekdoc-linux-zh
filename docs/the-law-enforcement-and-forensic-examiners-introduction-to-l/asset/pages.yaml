    sector the keyword is in, the offset in the volume, and finding which block and
    data entry is associated with the keyword hit.


    We''ll work with the first keyword hit (426596865:www.stopcyberbullying.org).
    The sector offset to our hit is found by dividing the byte offset by the sector
    size (512). We already know that there is only one partition in this image, we''ll
    run mls to be sure. We also run fsstat to confirm the block size (which we already
    know from previous exercises is 4096). Repeating these steps is just good practice:


