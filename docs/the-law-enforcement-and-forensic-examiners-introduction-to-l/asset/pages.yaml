    # Sleuth Kit Exercise #1A - Deleted File Identification and Recovery (ext2)


    We will start with a look at a couple of the file system and file name tools,
    fsstat and fls, running against our able image.


    Part of the TSK suite of tools, mls, provides access to the partition table within
    an image, and gives the partition offsets in sector units. mls provides much the
    same information as we get from fdisk and gdisk.


    ```

    barry@forensic1:~/$ mls able2.dd

    DOS Partition Table

    Offset Sector: 0

    Units are in 512-byte sectors

    ```


    | Slot | Start | End | Length | Description |

    |---|---|---|---|--|

    | 000: | 000000000 | 000000000 | 000000001 | Primary Table (#0) |

    | 001: | 000000000 | 000000056 | 000000057 | Unallocated |

    | 002: | 000:000005 | 000010259 | 000010203 | Linux (0x83) |

    | 003: | 001:0001026 | 000112859 | 00102600 | Linux (0x83) |

    | 004: | 002:0001286 | 000178694 | 000065835 | Linux Swap / Solaris (0x82) |

    | 005: | 003:0001786 | 000675449 | 000496755 | Linux (0x83) |


    For the sake of this information, we are looking for the root on the root partition
    (file system) of our image. The root (/) file system is located on the second
    partition. Looking at our mls output, we can see that partition starts at sector
    10260 (actually numbered 03 in the mls output, or slot 000:001).


    So, we run the Sleuth Kit fsstat command -o 10260 to gather file system information
    at that offset. Pipe the output less to page through:


    212'
