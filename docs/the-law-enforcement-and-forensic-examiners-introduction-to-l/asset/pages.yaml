    # Sleuth Kit Exercise #6 – Physical String Search & Allocation Status (NTFS)


    We''ve already done a few string searches, all of them have been on EXT file systems.
    We make a lot of assumptions when we search for strings in an image. We assume
    the strings are accessible (not in a container that requires pre-processing),
    and we assume they will be in a character encoding that our search utility will
    find. This is not always the case. Most of the string searches we''ve done so
    far have resulted in matches that are found in regular ASCII text files. When
    we search for strings on Windows systems, for example, that won''t always be the
    case. We''ll need to deal with compressed and encoded formats, and additional
    application overhead and considerations, like compressed'
