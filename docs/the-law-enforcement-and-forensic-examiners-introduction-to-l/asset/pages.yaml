    # Bash Shell Arithmetic Expansion


    If you are dealing with integers (or hex conversion), and floating point decimal
    responses are not required, you can use more bash (shell) Arithmetic Expansion.
    This is probably the quickest and easiest way to do calculations for simple addition
    or subtraction where integer offsets are needed and you are not likely to encounter
    fractional evaluations. Note that you need to use the echo command to evaluate
    the expression, or the evaluation itself will be interpreted by the shell as a
    command. Note that here hex values should be preceded by 0x (zero x) Here''s an
    example of evaluations:


    ```

    barry@forensic1:-$ echo $((2048*512))

    1048576

    ```


    ```

