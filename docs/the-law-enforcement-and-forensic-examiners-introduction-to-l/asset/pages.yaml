    Let''s install bulk_extractor now and have a closer look at the options.


    ```

    root@forensicl:-# sboinstall bulk_extractor

    ```


    bulk_extractor is a C++ program that scans a disk image, a file, or a directory
    of files and extracts useful information without parsing the system or file system
    structures...


    The searches performed by bulk_extractor are done using specific scanners that
    can be enabled and disabled depending on what you want to search for and how.
    It is these scanners that manage the parsing of PDF files or compressed archives
    and other formats. We get a look at available scanners by viewing the output of
    bulk_extractor -h. It''s a long list of command options, so you might want to
    pipe the output through


    ```

    barry@forensicl:-$ bulk_extractor -h | less

