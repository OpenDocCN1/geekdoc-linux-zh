    # Command Line Math


    When conducting an examination, you''ll often find yourself needing a quick way
    to make a simple calculation (sector offset, etc.). We''re going to cover some
    basic ways to accomplish this via the command line. We do this for two reasons:
    First that it''s easier to include command line calculations without having to
    grab a mouse, a GUI calculator and type in the numbers - why not just use the
    terminal and get your answer? Second, you may find yourself needing to use a terminal
    session or system that has no GUI. You might well learn how to use the command
    line for as much as you can and not rely on external resources. There are a number
    of ways to do this:


    **bc – the basic calculator***


    If we need to do some calculations on the command line, we can use **bc** and
    either open an interactive session, or pipe the expression to be evaluated via
    the **echo** command through **bc**. You''ll need these techniques to calculate
    byte offsets in later exercises. You don''t want to have to open a calculator
    app, do?


    For an interactive session, simply type **bc** at the prompt and you will be dropped
