    The output above shows a couple of things (highlights for emphasis). We have the
    completed run with the -N option, and the output shows that we have an trimmed
    area. The map file shows the position of unclipped area of the disk (0x00640000)
    and a size of 0x00010000 (65536 bytes). The status of this area is indicated with
    an asterisk. Note that the 65536 bytes are exactly 128 sectors, and this is the
    default "cluster" size used by ddresce. This does not mean that there are 128
    sectors that cannot be read. It means the entire cluster could not be read, and
    the -N option prevented "trimming", or paring the sectors down to smaller chunks.
