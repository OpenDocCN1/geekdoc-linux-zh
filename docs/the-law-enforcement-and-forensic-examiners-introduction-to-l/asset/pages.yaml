    The process can be reversed. If we want to reassemble the image from the split
    parts, we can use the cat command and redirect the output to a new file. Remember
    cat simply streams the specified files to standard output. If you redirect this
    output, the files are assembled into one.


    ```

    root@forensic:~/case1/images# cat case1.disk.split* > case1.disk.new.raw

    ```


    In the above command we have re-assembled the split parts into a 20GB image file.
    The original split files are not removed, so the command will essentially double
    your space requirements if you are writing to the same mounted device/directory.


    ```

    root@forensic:~/case1/images# cat case1.disk.split* > case1.disk.new.raw

    ```


    The same cat command can be used to check the hash of the resulting image parts
    by streaming all the parts of the image through a pipe to our hash command:


    ```

    root@forensic:~/case1/images# cat case1.disk.split* | sha1sum

