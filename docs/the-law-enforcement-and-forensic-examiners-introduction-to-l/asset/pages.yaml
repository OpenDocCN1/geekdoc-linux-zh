    belonged to, meta data associated with the file, and context. Finding potential
    evidence in a big block of aggregate unallocated space is of little use to us
    if we cannot at least make some effort at attribution in the original file system


    That''s where the other layer tools come in. We use blkcalc to calculate the location
    (by data block or fragment) in our original image. Once we''ve done that, we simply
    use the meta data layer tools to identify and potentially recover the original
    file, as we did in our previous effort.


    First need to gather a bit of data about the original file system. We run the
    fsstat command to determine the size of the data blocks we are working with. We''ve
    done this a number of times already, but the repetition is useful to drive home
    the importance of this information.


    ```

    barry@forensic1:~$ fsstat -o 10260 able2.dd | less

    FILE SYSTEM INFORMATION

    -----------------

    File Type: Ext2

    Volume Name:

    ...

    Source OS: Linux

    Dynamic Structure

    ...

    CONTENT INFORMATION

    Block Range: 0 - 51299

    Block Size: 1024

    ...

    ```


    In the fsstat command above, we see that the block size (in bold) is 1024. We
    take the offset from our grep output on the able2.blkl image and divide that by
    1024. This tells us how many unallocated data blocks into the unallocated image
    we found our string of interest. As usual, we use the echo command to pass the
    math expression to the command line calculator; bc


    ```

    barry@forensic1:~$ echo "1631299/1024" | bc

    1593

    ```


    We now know, from the above output, that the string cybernetic is in data block
    1593 of our extracted unallocated file, able2.blkl.


    This is where our handy blkcalc command comes in. We use blkcalc with the -u option
    to specify that we want to calculate the block address from an extracted unallocated'
