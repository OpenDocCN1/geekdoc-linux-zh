    # System Initialization


    After the boot loader initializes the kernel, the next step in the boot sequence
    starts with the program /sbin/init. This program really has two functions:


    +   - initialize the runlevel and startup scripts

    - terminal process control (respawn terminals)


    In short, the init program is controlled by the file /etc/inittab. It is this
    file that controls your runlevel and the global startup scripts for the system.
    This is, again, for a Slackware system. Some systems, like Ubuntu, use a systemd
    scheme for system control and configuration. If you are interested in the system
    startup routine for your particular distro (and you should be interested), research
    it online.


    # Runlevel


    The runlevel is a simple description of the system state. For our purposes, it
    is easiest to say that (for Slackware, at least - other systems, such as those
    using systemd, will differ:


    +   - runlevel 0 = shutdown

    - runlevel 1 = single user mode

    - runlevel 3 = full multiuser mode / text login (DEFAULT)

    - runlevel 4 = multiuser /X11 / graphical login⁴

    - runlevel 6 = reboot


    In the file /etc/inittab you will see a line similar to:


    > ⁴ This is largely distribution dependent. In some distributions, run level 5
    provides a GUI login. In Slack (and others), it''s run level 4.


    42'
