- pgno: 11
  md: "# I. Installation\n\nMuch has changed in the past few years with respect to\
    \ the robustness and feature set of the current Linux kernels. Hardware detection\
    \ and configuration used to present some unique challenges for Linux novices.\
    \ While issues can still arise, the fact is that setting up a Linux machine as\
    \ a simple workstation is no longer the nailing exercise that it once was. Kernel\
    \ detection of hardware has become the norm, and most distributions of Linux can\
    \ be installed with a minimum of fuss on all but the cutting edge hardware (and\
    \ usually even then).\n\nFor the vast majority of computers out there, the default\
    \ kernel drivers and settings will work “out of the box” for both old and new\
    \ systems. The range of online help available for any given distribution is far\
    \ wider than it was ten years ago, and most problems can be solved with a targeted\
    \ internet search. For the most part, solutions that are effective on one distribution\
    \ across the board. This may not always be the case, but if you are familiar with\
    \ your system, you can interpret solutions and apply them to your particular platform.\n\
    \nIf your Linux machine is to be a dual boot system with Windows, you can use\
    \ the Windows Device Manager to record all your hardware and the settings used\
    \ by Windows. Hardware compatibility and detection have been greatly improved\
    \ over the past couple of years. Most of the recent versions of Linux distributions\
    \ have extraordinary hardware detection. But it still helps to have a good idea\
    \ of the hardware you are using so if problems arise do your support queries be\
    \ targeted.\n\nAt a minimum, you are going to know and plan for:\n\n+   * Hard\
    \ drive partitioning scheme\n  * Size and partition layout\n* Network configuration\n\
    \  * DHCP or static?\n  * Gateway\n  * DNS, etc.\n\nMost distributions have a\
    \ plethora of documentation, including online help and documents in downloadable\
    \ form. Do a Web search and you are likely to find a number of answers to any\
    \ question you might have about hardware compatibility issues in Linux. A list\
    \ of useful Linux educational resources is provided at the end of this guide.\
    \ Use them. And remember to research first before jumping into a forum and asking\
    \ questions.\n\n# Distributions\n\nLinux comes in a number of different “flavors”.\
    \ These are most often referred to as “Linux distribution” or “distro”. Default\
    \ kernel configuration, tools that are included (system"
