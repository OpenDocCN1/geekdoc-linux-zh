    # Metacters


    The Linux command line (actually the bash shell in our case) also supports wild
    cards (meta-characters):


    +   * for multiple characters (including "")

    * ? for single characters.

    * ] for groups of characters or a range of characters or numbers.


    This is a complicated and very powerful subject, and will require further reading...
    Refer to "regular expressions" in your favorite Linux text, along with "globbing"
    or "shell expansion". There are important differences that can confuse a beginner,
    so don''t get discouraged by confusion over "*" means in different situations.


    # Command Hints


    +   1. Linux has a history of previously used commands (stored in the file named
    .bash_history in your home directory). Use the keyboard arrows to scroll through
    commands you''ve already typed.

    2. Linux supports command line editing. You can use the cursor to navigate a previous
    command and correct errors.

    3. Linux commands and filenames are CASE SENSITIVE.

    4. Learn output redirect to stdout and stderr ("1" and "2"). More on this later.

    5. Linux uses "/ for directories, MS Windows uses "$.

    6. Linux uses "-\ for command options, DOS uses "/".n7. Use q to quit from less
    or man sessions.

    8. To execute commands in the current directory (if the current directory is not
    in your PATH), use the syntax ./command. This tells Linux to look in the present
    directory for the command. Unless it is explicitly specified, the current directory
    is NOT part of the normal user path.'
