- pgno: 5
  md: '# Foreword


    It''s nearly ten years since this guide has been officially updated, and over
    fifteen years since its initial public release. In that time, we''ve seen significant
    changes to the forensic industry, a massive growth in the development of software
    and techniques to uncover evidence from an ever expanding universe of devices.
    The purpose of this document, remains unchanged. I am looking to provide an easy
    to follow and accessible guide for forensic examiners across the full spectrum
    of forensic discipline; law enforcement officers, incident responders, and all
    computer specialists responsible for the investigation of digital evidence. This
    guide continues to provide an introductory overview of the GNU/Linux (Linux) operating
    system as a forensic platform for digital investigators and forensic examiners.


    Above all, this remains a beginner''s guide. An introduction it is meant to be
    a full course on conducting forensic examinations. This document is about the
    tools and the concepts used to employ them. Introducing them, providing simple
    guidance using them, and some ideas on how they can be integrated into a digital
    forensics laboratory or investigative process. This is also a hand guide. The
    best way to learn and we''ll cover both basic GNU/Linux utilities and specialized
    software through short exercises.


    The content is meant to be “beginner” but as the forensic community evolves and
    the subject matter becomes more mainstream, the definition of “beginner” level
    material starts to blur. This guide makes an effort to keep the material as possible
    without omitting those subjects which are fundamental to the proper understanding
    of Linux and its potential as a digital forensic platform. If you''ve been forensic
    examinations for five years or never, but delved into Linux, then this is for
    you. If you''re a student at University and are interested in how forensic tools
    are employed, but cannot afford thousands of dollars in licenses...then this is
    for you.


    However, this is by no means meant to be the definitive “how-to” on forensic methods
    using Linux. Rather, it is a (somewhat extended) starting point for those who
    are interested in pursuing the self-education needed to become proficient in the
    use of Linux as an investigative tool. Not all of the commands offered here will
    work in all situations, but by describing the basic commands available to an investigator
    to “start the ball rolling”. I will present the commands, the readers need to
    follow-ups. Knowing how these commands work is every bit as important as knowing
    what to type at the prompt. If you are an intermediate Linux user, then much of
    what is contained in these pages will be review. Still, I hope you find it of
    useful.


    GNU/Linux is a constantly evolving operating system. Distributions come and go,
    and there are now a few “stand out” Linux flavors that are commonly used. In addition
    to balancing the beginner nature of the content of this guide with the advancing
    standards in forensic education, I also find myself trying to balance the level
    of detail required to actually teach useful tasks with the specific nature of
    many of the commands and configurations used.'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    As we will discuss in further detail later in this guide, many of the details
    are specific to one flavor of Linux. In most cases, the commands are quite portable
    and will work on any system. In other cases (package management and configuration
    editing, etc.) you may find that you need to do some research to determine what
    needs to be done on your platform of choice. The determination to provide specific
    details on actually configuring a system choice for the decision to use my Linux
    distribution of choices for forensics is an example.


    Over the years I have repeatedly heard from colleagues that have tried Linux by
    installing it, and then proceeded to sit back and wonder "what next? I have also
    entered a number of requests and suggestions for a more expansive exploration
    of tools and utilities available to Linux for forensic analysis at the application
    level as well as numerous requests for proper configuration guidelines for a baseline
    Linux workstation. You have a copy of this introduction. Now download the exercises
    and drive on. This is only the start of your reading. Utilized correctly, this
    guide should prompt many more questions and kick start your learning. In the years
    since this document was first released a number of excellent books with far more
    detail have cropped up open source tools and Linux forensics. I still like to
    think this guide will be useful for some.


    As always, I am open to suggestions and critique. My contact information is on
    the front page. If you have ideas, questions, or comments, please don''t hesitate
    to email me. Any feedback is welcome.


    This document is occasionally (infrequently, actually) updated. Check for newer
    versions (numbered on the front page) at the official site:


    http://www.LinuxLEO.com


    # A word about the "GNU" in GNU/Linux


    When we talk about the "Linux" operating system, we are actually talking about
    the GNU/Linux operating system (OS). Linux itself is not an OS. It is just a kernel.
    The OS is a combination of the Linux kernel and the GNU utilities that allow us
    (specifically our hardware) to interact with the kernel. Which is why the proper
    name for the OS is "GNU/Linux". We (incorrectly) call it "Linux" for convenience.


    # Why Learn Linux?


    One of the questions heard most often is: "why should I use Linux when I already
    have [insert Windows GUI forensic tool here]?" There are many reasons why Linux
    is quickly gaining ground as a forensic platform. I''m hoping this document will
    illustrate some of those attributes.


    7'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    +   - Control – not just over your forensic software, but the whole OS and attached
    hardware.

    - Flexibility – boot from a CD (to a complete OS), file system support, platform
    support, etc.

    - Power – A Linux distribution is (or can be) a forensic tool.


    Another point to be made is that knowing how Linux works is becoming more and
    more important. While many of the Windows based forensic packages used today are
    fully capable of examining Linux systems, the same cannot be said for the examiners.


    As Linux becomes more and more popular, but in the commercial world and with desktop
    users, the chance that an examiner will encounter a Linux system in a case becomes
    more likely (especially in network investigations). Even if you utilize a Windows
    forensic tool to conduct your analysis, you must at least be familiar with the
    OS you are examining. If you do not know what is normal, then how do you know
    what does not belong? This is true on so many levels, from the actual contents
    of various directories to strange entries into configuration files, all the way
    down to how files are stored. This document is more about Linux as a forensic
    tool rather than analysis of Linux, you can still learn a lot about how the OS
    works by actually using it.


    There is also the issue of cross-verification. A knowledge of Linux and its forensic
    utility can provide an examiner with alternative tools on an alternative platform
    to use as to verify the findings of other tools on other operating systems. Many
    examiners have spent hours learning and using industry standard Microsoft Windows
    forensic tools. It would be unrealistic to think that this guide will give an
    examiner the same level of confidence built through years of experience, as they
    have with their traditional tools of choice. What I hope is that this guide will
    provide enough information to give Linux as an alternative forensic platform provides
    a perfect way to check your work and verify your results, even if it is not your
    primary choice.


    We also need to consider the usefulness of Linux in academic and research applications.
    The open nature of Linux and the plethora of utilities included in a base system
    make it an almost tailor made for digital forensics. This is especially true in
    an academic environment where Linux provides a low cost solution to enable access
    to examining tools and file examination utilities that can be used to cover the
    foundations of digital forensics using tools in an environment that supports multiple
    formats and data types. For example, we can use the dd program for file imaging
    and carving; grep and xxd to locate and examine file system structures and text
    artifacts, and the file command again with xxd for signature identification and
    analysis. This provides us with much the same set of tools needed to present the
    very basics of digital forensics while still teaching Linux command line familiarity.
    Linux as a forensic platform can easily provide a primary means for digital investigations
    education. And in fact, prior versions of this guide have been referenced in many
    advanced degree and law enforcement programs that teach basic digital forensics.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Where''s the GUI tools?


    As much as possible, the tools represented in this guide are callable and require
    user interaction through the command line environment. This is not simple sadness.
    It''s a matter of actually learning Linux (and in some ways UNIX is a by-product).
    This point will be made throughout this document, the goal here is to introduce
    tools and how to interact through the command line. Reliance on GUI tools is understandable
    and not being wholly disparaged. If you are making the effort to read and follow
    along with this guide, then any assumption is being made that you want to learn
    Linux and follow the command line brings. There are two main points that we can
    focus on:


    The first is that Linux (and UNIX) find their foundation at the command line.
    Modern Linux and UNIX implementations are still, at their hearts, by system that
    is accessible from a command line interface. For this, knowing how to interact
    with the command line provides the widest range of capabilities regardless of
    the distribution or configuration of Linux encountered. Yes, this is also for
    forensic tools, but it''s also about becoming comfortable with Linux. It is for
    reason that we continue to learn a command line editor like vi and simple bit
    copying tools like dd. There''s a high probability that any Linux/Unix system
    you come across have these tools.


    Second is that knowing and understanding the command line is, and of itself, a
    powerful tool. Once you realize the power of command pipes and flow control (using
    directly on the command line), you will find yourself able to power through problems
    faster than you previously thought. Learning the proper use and power of utilities
    like awk, sed, and grep will provide some basic understanding of how those can
    be used. Once you understand and start to leverage this power, you will find yourself
    pining for a command line and its utilities when one is not available.


    Keep these points in mind as you go through the exercises. Understand why and
    how the tools work. Don''t memorize the commands themselves. That would miss the
    point.


    # The Exercises – New and Old


    There are updates across the board in this version of the guide. Where old (and
    still useful) exercises remain from previous versions, the output and tool usage
    has been refreshed to reflect the current versions of the tools used. While somewhat
    aging, these exercises and the files used to present them remain useful and have
    not been removed.


    New exercises have also been added to allow for additional content layer analysis
    tools and other additions to the Linux forensics arsenal. Keep in mind that while
    this document covers some forensic strategies and basic fundamentals, it is really
    about the tools we use and the concepts behind employing them. As some of the'
