  md: '# v.4.33

    A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    ```

    root@forensic1:~# make install

    Making install in lib

    make[1]: Entering directory ''/root/package''

    make install-am

    make[2]: Entering directory

    <continues moving files to appropriate directories>

    ```


    Our program is now installed and ready to use. Knowing how to use source packages
    for software installation is important of understanding how Linux works...just
    keep in mind that it''s generally a better idea to use distribution packages (or
    create your own). Note that the example above is for source packages built with
    autoconf/automake. You may also run across software that is Python or Perl based,
    these will differ in how they are built and installed. Most source packages will
    include a README or INSTALL.txt file when extracted. Read them.


    Unlike previous versions of this guide, we will avoid using this method of installing
    software from this point on.


    # Using Distribution Packages


    As we''ve already mentioned, just about every Linux distribution has some sort
    of "package manager" for installing and adding official Slacksoftware (included
    in the distribution). For updating and adding, we''ve introduced slackpkg. slackpkg
    is actually a front to pkgtool, which handles the work of adding and removing
    software packages from your system. For an excellent overview of pkgtool and its
    various commands, have a look at http://www.slack.com/config/packages.php


    Slack packages are just compressed archives that, when installed, place the package
    files in the proper place. To install a Slack package, when we are not using the
    slackpkg front, we use the pkgtool command installpkg.


    Our example here will be a pretend Slack package called software. Slack packages
    are generally named with the extension tgz or txz (since they are really just
    compressed archives). Once you''ve downloaded or prepared your package (our example
    is called software.tgz), you install it with the following command:


    ```

    root@forensic1:~# installpkg software.tgz

    Verifying package software.tgz.

    Installing package software.tgz:

    PACKAGE DESCRIPTION:

    # software

    #

    # This is where you will find a description

    ```'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    ```

    # of the software package you are installing

    #

    #

    #

    # Homepage:  http://www.software.homepage.com

    #

    Executing install script for software.tgz.

    Package software.tgz installed.

    ```


    Packages can be similarly removed or upgraded with removepkg or upgradepkg, respectively.


    You can find pre-made packages for all sorts of software for many distributions
    over the Internet. The problem with many of them is that they do not come from
    trusted sources and you have no idea what configuration options were used to build
    them.


    As a general rule of thumb, I always like to build my own packages for software
    that is not part of the Slack installation. This allows me to build the software
    I need (or without ones I dont!), optimized for my particular system, and it further
    allows me to control how the software is eventually installed. Luckily Slack provides
    a relatively easy way to create packages from source code. Slackbuild.


    # Building Packages – SlackBuilds


    In Short, SlackBuild is a script that (normally) takes source code and compiles
    it into (or .tx) a Slack .tgz file that we can install using pkgtools.


    The SlackBuild script handles the configure options and optimizations that the
    script author decides (but are visible and editable by you), and then installs
    the software and related files into a package that follows Slack conventions for
    executable and libraries, where assuming the author follows the template. The
    scripts are easily editable if you want to change some of the options or the target
    version, and provide for an easy, human readable way to control the build process.
    SlackBuilds for a large selection of software are available at http://www.Slackbuilds.org.


    The SlackBuild comes as a .tar.gz file that you extract with the tar command.
    The resulting directory contains the build script. The script is named software.SlackBuild,
    with software being the name of the program we are creating a package for. There
    are normal four files included in the Slack package:


    +   - info gives information about where to obtain the source code, the version
    of the software script is written for, the hash of the source code, required dependencies,
    and more.

    - README contains useful information about the package, potential pitfalls, and
    optional dependencies.


