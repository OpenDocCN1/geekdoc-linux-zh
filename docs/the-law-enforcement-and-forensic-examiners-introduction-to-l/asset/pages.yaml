- pgno: 219
  md: 'v.4.33 A Comprehensive Beginner’s Guide to Linux as a Digital Forensic Platform


    We are going to send the contents of the data blocks assigned to inode 2139 to
    a file for closer examination.


    ```

    barry@forensic1:~$ icat -o 10260 able2.dd 2139 > lrkn.tgz.2139

    ```


    This runs the icat command on the file system in our able2.dd image at sector
    offset 10260 (-o 10260) and streams the contents of the data blocks associated
    with inode 2139 to the file lrkn.tgz.2139. The filename is arbitrary; I simply
    chose the name of the file from fls and added the inode number to indicate that
    it was recovered. Normally this output should be directed to some results or specified
    evidence directory.


    Now that we have what we hope is a recovered file, what do we do with it Look
    at the resulting file with the file command:


    ```

    barry@forensic1:~$ file lrkn.tgz.2139

    lrkn.tgz.2139: gzip compressed data, was "lrkn.tar", last modified: Sat Oct 3
    09:04:08 1998, from Unix

    ```


    Have a look at the contents of the recovered archive (pipe the output through
    less...long). Remember that the t option to the tar command lists the contents
    of the archive.


    ```

    barry@forensic1:~$ tar zzvf lrkn.tgz.2139 | less

    drwx-xr-x /lp/j 0 1998-06-01 18:48 lrk3/

    -rwx-xr-x /lp/j 742 1998-06-27 11:30 lrk3/1

    -rw-r--r /lp/j 716 1998-11-02 16:38 lrk3/MCONFIG

    -rw-r--r /lp/j 6833 1998-10-03 05:02 lrk3/Makefile

    -rw-r--r /lp/j 6364 1998-12-27 22:01 lrk3/README

    -rwx-xr-x /lp/j 90 1998-06-27 12:53 lrk3/RUN

    ```


    We have not extracted the archive, we''ve just listed its contents. Note that
    there is a README file included in the archive. If we are curious about the contents
    of the archive, perhaps reading the README file would be a good idea, yes? Rather
    than extract the contents of the archive, we will go for reading the README using
    the following command:


    ```

    barry@forensic1:~$ tar xzvfo lrkn.tgz.2139 lrk3/README > lrkn.2139.README

    lrk3/README

    ```


    The difference with this tar command is that we specify that we want the output
    sent to stdout (O [capital letter "oh\]) so we can redirect. It also specifies
    the name of the file


