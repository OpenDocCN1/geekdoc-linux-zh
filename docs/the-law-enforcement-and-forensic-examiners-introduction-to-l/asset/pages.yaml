  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    As we seen previously with our software downloads, this file has a tar.gz extension.
    That means it is a compressed TAR archive. To review, the tar part of the extension
    indicates that the file was created using the tar command (see man tar for info).
    The gz extension indicates that the file was compressed (commonly with gzip).
    When you download a tar archive, particularly from un-trusted sources, you should
    always have a look at the contents of the archive before decompressing, extracting
    and haphazardly writing them to your drive. View the contents of the archive with
    the following command:


    ```

    root@forensic1:-# tar tzf NTFS_Pract_2017_E01.tar.gz

    NTFS_Pract_2017/

    NTFS_Pract_2017/NTFS_Pract_2017.E04

    NTFS_Pract_2017/NTFS_Pract_2017.E02

    NTFS_Pract_2017/NTFS_Pract_2017.E01

    NTFS_Pract_2017/NTFS_Pract_2017.E03

    ```


    The above tar command will list (t) and decompress (z) the file (f) NTFS_Pract_2017.E01.tar.gz.
    This allows you to see where the file will be extracted, and the output shows,
    there are five files that will be extracted to a new directory, NTFS_Pract_2017/,
    in the current directory. We will use the tar command extensively throughout this
    document for downloaded files.


    Now we actually utter the images with the tar x option and change into the directory:


    ```

    root@forensic1:-# tar xvzf NTFS_Pract_2017_E01.tar.gz

    NTFS_Pract_2017/

    NTFS_Pract_2017/NTFS_Pract_2017.E04

    NTFS_Pract_2017/NTFS_Pract_2017.E02

    NTFS_Pract_2017/NTFS_Pract_2017.E01

    NTFS_Pract_2017/NTFS_Pract_2017.E03

    ```


    ```

    root@forensic1:-# cd NTFS_Pract_2017

    root@forensic1:-/NTFS_Pract_2017#

    ```


    The first thing we can run is the ewinfo command on the image first file of the
    image set. This will return the meta-data that includes acquisition and media
    information, as we''ve seen previously. We learn the version of the software that
    the images were created with, along with the collection platform, date of acquisition,
    name of the examiner that created the image with the description and notes. Have
    a look at the output of ewinfo on our file set (you only need to provide the first
    file in the set as an argument to the command):


