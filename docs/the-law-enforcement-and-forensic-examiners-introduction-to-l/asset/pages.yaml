- pgno: 293
  md: 'So our target MFT entry here is 178. Now we''ll extract with icat and check
    the file type again with the file command. The file name we use on the extracted
    file is arbitrary. Name it however you like. Consistency is a good idea, though.


    ```

    barry@forensic:~$ icat -o 2048 NTFS_Pract_2017/NTFS_Pract_2017.E01 178 > SAM.178

    barry@forensic:~$ file SAM.178

    SAM.178: MS Windows registry file, NT/2000 or above

    ```


    Now we''ll create a mount point for the SAM file and use regfount to fuse the
    hive.


    ```

    barry@forensic:~$ mkdir sammnt

    barry@forensic:~$ regfount SAM.178 sammnt/

    regfount 201701330

    ```


    Since we already pulled the NTUSER.DAT file for the AlbertE account, let''s have
    a look at the same account in the SAM file. If we change directories down to SAM/Domains/Account/Users,
    we will see the list of potential accounts:


    ```

    barry@forensic:~$ cd sammnt/SAM/Domains/Account/Users/

    barry@forensic:~/sammnt/SAM/Domains/Account/Users$ ls

    (values)/ 000001F4/ 000001F5/ 000003E8/ 000003E9/ Names/

    ```


    What we see in the output above are a series of sub keys (those starting with
    0000*) that represent the hex value of account Relative ID. We can translate these
    with bc, as we would have index:


    ```

    echo "ibase=16; 000001F4" | bc

    ```


    But let''s do it all with once for a loop to repeat the command across all the
    directories (but only those that are a hex value):


    ```

    barry@forensic:~/sammnt/SAM/Domains/Account/Users$ for name in 0000*

    > do

    > echo "ibase=16;$name" | bc

    > done

    ```'
