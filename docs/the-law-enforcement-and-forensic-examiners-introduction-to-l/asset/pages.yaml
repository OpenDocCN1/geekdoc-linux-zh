    # Mount Multi Partition Images with kpartx


    Up to this point we''ve moved a simple file system image with the mount command,
    we''ve moved a file system from a full disk image with a single partition, and
    we''ve learned about the loop device and how to specify its association with a
    specific partition.


    Let''s look at a disk image that has multiple partitions. Our previous method
    of identifying each partition by offset and size, and passing those parameters
    to the Setup command would work fine to mount multiple file systems within a disk
    image (using different loop devices for each, but wouldn''t it be nice if we had
    a tool to do all of that for us?) kpartx is that tool.


    In simple terms, kpartx maps partitions within an image to separate loop devices
    that can then be mounted as any other volume (assuming a mountable file system).
    It is part of the multipath-tools package for Slackware, and can be installed
    via sbtools or through the SlackBuild available at SlackBuilds.org


    ```

    root@forensic1:~# sbfind multipath

