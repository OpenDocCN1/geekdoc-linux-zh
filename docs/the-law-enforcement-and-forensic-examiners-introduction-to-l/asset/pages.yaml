- pgno: 65
  md: 'v.4.33  A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    # # Host Based Access Control


    We continue our baseline security configuration discussion with a word on simple
    host access control. Note that this is NOT a firewall. This is access control
    at the host level. In simple terms, we can determine who can access our system
    by two files, /etc/hosts.deny and /etc/hosts.allow. For this we use TCP wrappers.


    Basically, TCP wrappers works like this: When a server configured to run through
    TCP wrappers receives a connection request, the inetd daemon calls the “wrapper”
    service, /usr/sbin/tcpd. The tcpd program checks the .hosts and hosts.allow file
    to see if the connection is permitted, and runs the requested service/server accordingly.


    Let''s run through an example of a service managed by tcpd first, then we will
    follow up with the two access control. If we look at /etc/inetd.conf we see most
    of the file is already commented out. The commented lines start with a #. If we
    want to see only those lines that are not commented, we can do a “reverse grep”.
    So if I want to see the lines in the file /etc/inetd.conf that are not comments,
    I can do this:


    ```

    root@forensics:~# cat /etc/inetd.conf | grep -v ^$

    time      stream tcp nowait root internal

    time      dgram udp wait   root internal

    comsat    dgram udp wait   /usr/sbin/tcpd in.comsat

    auth      stream tcp wait   /usr/sbin/in.ident in.identd

    ```


    The command shown shows the contents of /etc/inetd.conf on the terminal and pipes
    the output to grep. We will grep to display lines that DO NOT (-v) start with
    a #. The character “^” means “at start of the line”. Running the above command
    gives me only those lines that are actually used in the configuration.


    In order to understand how these services work and to find specific information
    on what is running on our system, let''s have a more detailed look at the third
    line in our output:


    ```

    comsat    dgram udp wait   root       /usr/sbin/tcpd in.comsat

    ```


    Since this line is not commented out, we know that the service is allowed to run
    on our system. Let''s find out what it does and show how we disable it, and confirm
    that it''s disabled.


    NOTE: The services that are left running on a basic Slack install are generally
    left for a reason. I would not recommend commenting out any of these lines without
    understanding the consequences. We deconstructing this particular service for
    educational purposes. At the end of the lesson, we''ll likely keep it enabled.
    The purpose of this exercise is


    66'
