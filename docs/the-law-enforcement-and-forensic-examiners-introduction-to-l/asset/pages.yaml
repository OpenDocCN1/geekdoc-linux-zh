- pgno: 70
  md: '# v.4.33

    A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    This basically reads as "ALLOW connections to sshd from systems only on the 192.168.55.0
    network". This limits connections to originating from machines on my local forensic
    network only. Read the man page and adjust to your needs.


    Understanding inetd.conf, and editing hosts.deny and hosts.allow gives us a good
    start on our security configuration. For a typical forensic workstation, this
    is pretty much as simple as it needs to be at the host level. For many forensic
    practitioners, simply commenting the lines in inetd.conf, adding "ALL:ALL" to
    hosts.deny and leaving hosts.allow totally empty might be sufficient.


    Remember, though, TCP wraps only controls access to those servers and services
    that are actually handled by the inetd daemon. In order to actually filter traffic
    at the network interface, we will need to set up a host firewall.


    # Host Based Firewall with iptables


    It is common practice for many forensic practitioners using other operating systems
    to utilize some sort of host based firewall program to monitor their network connections
    and provide some form of baseline protection from unsolicited access. You may
    want to do the same thing on your Linux workstation, or in some cases, be required
    to run a host based firewall by agency or corporate policy. In any event, the
    most commonly used Linux equivalent for this sort of thing is the iptables network
    packet filter.


    All of the subjects covered in this guide, this is one of the most complex, with
    direct relationship to actual forensic practice. It is however, too important
    not to cover if we are going to discuss workstation security. A host firewall
    may not be a requirement for a good forensic workstation, especially that many
    agencies and companies are already working in a well protected (or air gapped)
    network environment. However in my opinion, it''s a very good idea. It''s all
    too common to see Linux users rely on the notion that Linux is "just more secure"
    than other operating systems. And I know from personal experience that there are
    digital forensic practitioners out that have fully connected workstations and
    don''t take these precautions.


    Unlike most of the other subjects in this configuration setup, iptables requires
    a bit more explanation to effectively set it up from scratch than I''m willing
    to put in a simple practitioner''s guide. As a result, rather than giving a detailed
    description and step by step instructions, we are going to briefly discuss how
    to use the iptables configuration and provide a baseline script to get the reader
    started. Our "baseline" script has been provided by Bobby Workman (http://www.rworkman.com).


    First, we need to make sure we understand the differences between the protections
    provided by TCP wrappers vs. iptables. As we mentioned earlier, TCP wrappers blocks
    access at the application level, whereas iptables blocks traffic at the specified
    interface. This is an important distinction. iptables essentially sits between
    the network and TCP wrappers and accepts or rejects network packets at the kernel
    level.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    In simple terms, iptables deals with chains. The INPUT chain for incoming traffic,
    the OUTPUT chain for outgoing traffic, and the FORWARD chain that handles traffic
    with neither its origin or destination on the filtered interface. These chains
    have default policies, which additional rules can be appended.


    Let''s have a look at default iptables configuration in this case "empty configuration".
    To do this we can use iptables with the -S option to display the rules within
    each chain. If you do not provide the chain name (INPUT, for example), then the
    command will list all the chains and their rules, starting with the default policies:


    ```

    root@forensic1:-# iptables -S

    -P INPUT ACCEPT

    -P FORWARD ACCEPT

    -P OUTPUT ACCEPT

    ```


    So the above command lists the policies for each chain with any rules that may
    have been added. As you can see from the output here, the default policies are
    ACCEPT, and there are no other rules. None of our network traffic is filtered.


    It is desirable to hide our systems from all network traffic, including ping traffic.
    With our empty iptables configuration, from an external host, we can ping forensic
    workstation(192.168.55.32) and the ICMP packets come through:


    ```

    bgrundy@hermes:-# ping 192.168.55.32

    PING 192.168.55.32 (192.168.55.32) 56(84) ttl=64 time=0.185

    64 bytes from 192.168.55.32: icmp_seq=1 ttl=64 time=0.185

    64 bytes from 192.168.55.32: icmp_seq=2 ttl=64 time=0.249

    64 bytes from 192.168.55.32: icmp_seq=3 ttl=64 time=0.292

    ^C

    ---

    192.168.55.32 ping statistics

    3 packets transmitted, 3 received, 0% packet loss, time 1999ms

    rtt min/avg/mdev=0.185/0.242/0.292/0.043 ms

    ```


    Now we are to create an iptables script based heavily on the one found at http://www.rlworkman.net/conf/firewall/rc.firewall.generic


    Have a look at the following version of the script, created with vi (I''m told
    this is a good exercise in vi editing...), which we''ll say as /etc/rc.d/rc.firewall.
    It''s important that you get the right name as there is another script that is
    called from /etc/rc.d/rc.initet2, as we discussed earlier. Once the script is
    created and saved, let''s have a look at it.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    ```

    root@forensic1:~# less /etc/rc.d/rc.firewall

    # Define variables

    IPT=/usr/sbin/iptables      # change if needed

    EXT_IF=eth0                # external interface (connected to Internet)


    # Enable TCP Sync Cookie Protection

    if [ -e /proc/sys/net/ipv4/tcp_synookies ]; then

    echo 1 > /proc/sys/net/ipv4/tcp_synookies

    fi


    # Disable ICMP Redirect Acceptance

    echo 0 > /proc/sys/net/ipv4/conf/all/accept_redirects


    # Do not send Redirect Messages

    echo 0 > /proc/sys/net/ipv4/conf/all/send_redirects


    # Set default policy to DROP

    $IPT -P INPUT DROP

    $IPT -P OUTPUT DROP

    $IPT -P FORWARD DROP


    # Flush old rules

    $IPT -F


    # Allow loopback traffic

    $IPT -A INPUT -i lo -j ACCEPT

    $IPT -A OUTPUT -o lo -j ACCEPT


    # Allow packets of established connections and those related to them

    $IPT -A INPUT -i $EXT_IF -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT


    # Allow all outgoing packets

    $IPT -A OUTPUT -o $EXT_IF -j ACCEPT


    # Allow incoming ssh from Internet

    $IPT -A INPUT -i $EXT_IF -p tcp --dport 22 --syn -m conntrack \

    --ctstate NEW -j ACCEPT

    ```


    The file, shown above, with variable definitions, followed by a number of lines
    that set several kernel parameters for better security. We then continue with
    setting all the default policies for INPUT, OUTPUT and FORWARD to DROP, the far
    more secure than ACCEPT. We then define rules that are appended (-A) to the various
    chains. Note that I uncommented the last line in the script, referring to TCP
    traffic (-p tcp) on destination port (--dport 22). This will allow SSH traffic
    in.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# v4.33

    A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


