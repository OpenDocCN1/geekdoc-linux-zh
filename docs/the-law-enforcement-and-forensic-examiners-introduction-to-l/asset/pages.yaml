    # Conventions Used in this Document


    When illustrating a command and it''s output, you will see something like the
    following:


    ```

    root@forensic1:-# command

    output

    ```


    This is essentially a command line (terminal) session where...


    ```

    root@forensic1:-#

    ```


    ...is the command prompt, followed by the command typed by the user and then the
    command''s output. The command will be shown in bold text to further differentiate
    it from the resulting output (as may span multiple lines).


    In Linux, the command prompt can take different forms, depending on the environment
    settings (the default differs among distributions). In the example above, format
    is


    ```

    user@hostname:[present working directory] #

    ```


    meaning that we are the user "root" working on the computer "forensic1" currently
    working in the directory root (the user''s home directory – in this case, "home
    directory" is symbolized by the shorthand representation of the tilde (~). Note
    that for a root login command prompt''s trailing character is #. If we log as
    a regular user, the default prompt character changes to a $, as in the following
    example:


    > ''I know...not a pretty URL'
