    The messages logs contain entries from a variety of sources, including the kernel
    and

    other applications. The numbered files result from log rotation. As the logs are
    filled, they are

    rotated and eventually deleted. On most Unix systems, the logs are found in /var/log/
    or

    /var/adm. These are from a very old system, but again it''s the contents we are
