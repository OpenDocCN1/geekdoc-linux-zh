  md: 'Let''s figure out which partition (and file system) the match is in. Use bc
    to calculate sector of the image and therefore the original disk the keyword is
    in. Each sector is 512 bytes, by dividing the offset bytes by 512 tells us which
    sector:


    ```

    barry@forensic1:~/able2$ echo "10561603/512" | bc

    20628

    ```


    ![](img/993644c785d68ca888a5ade02ca8088d_227_0.png)


    The Sleuth Kit''s mmls command gives us the offset to each partition in the image:


    ```

    barry@forensic1:~/able2$ mmls able2.dd

    DOS Partition Table

    Offset Sector: 0

    Units are in 512-byte sectors

    ```


    | Slot | Start | End | Length | Description |

    |---|---|---|---|---||

    | 000: Meta | 00000000 | 00000000 | 000000001 | Primary Table (#0) |

    | 001: ---- | 000000000 | 000000056 | 000000057 | Unallocated |

    | 002: 000:000 | 000000057 | 000010259 | 000010203 | Linux (0xb3) |

    | 003: 000:001 | 000010260 | 000112859 | 000012600 | Linux (0xb3) |

    | 004: 000:002 | 000112860 | 000178694 | 000065835 | Linux Swap/Solaris x86 (0x82)
    |

    | 005: 000:003 | 000117869 | 000675449 | 000496755 | Linux (0xb3) |


    From the output of mmls above we see that our calculated sector, 20628, falls
    in the second partition (between 10260 and 112859). The offset to our file system
    for the Sleuth Kit commands will be 10260.'
