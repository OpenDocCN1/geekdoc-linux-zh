    # Registry Parsing #2 – SAM and Accounts


    Let''s look at another registry file, the SAM. The SAM hive can have a great deal
    of information available if there are local accounts present on the system. Again,
    we''re not going to go through a comprehensive analysis, we''re just going to
    have a look at a few values of the most important keys.


    We can get the SAM hive using the NTUSER.DAT, first searching for the MFT entry
    using fls and then using icat to extract the file:


    ```

    ry@forensic1:$ fls -Fr - 2048 NTFS_Pract_2017/NTFS_Pract_2017.E1 | grep SAM

    r/r 178-128-2: Windows/System32/config/SAM

    ```


