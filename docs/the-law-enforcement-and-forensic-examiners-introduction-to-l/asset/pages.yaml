    Back to our problem...To see why the jet.jpg is missing, let''s try another method
    of obtaining a file, the **fls** command. We can use the -f option to look only
    at directories, and -r to do it recursively. We''ll also **grep** for jet.jpg.
    You could use the directory MFT record numbers to download the file, which is
    quicker and more efficient:


    ```

    barry@forensic1:/NTFS_Pract_2017$ fls -o 2048 -Fr NTFS_Pract_2017.E01 | grep

