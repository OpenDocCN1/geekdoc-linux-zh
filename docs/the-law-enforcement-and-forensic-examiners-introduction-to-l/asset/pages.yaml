- pgno: 98
  md: '# Hashing Media


    One important step in evidence collection is verifying the integrity of your data
    both before the acquisition is complete. You can get a hash (MD5, or SHA) of the
    physical device in a number of different ways.


    Linux can provide hashes using the following tools:


    +   - md5sum - 128 bit checksum

    - sha1sum - 160 bit checksum

    - sha224sum - 224 bit checksum

    - sha256sum - 256 bit checksum

    - sha384sum - 384 bit checksum

    - sha512sum - 512 bit checksum


    In this example, we use the SHA. SHA is a hash signature generator that supplies
    a bit "fingerprint" of a file or disk (which is represented by a file-like device
    node). It is not feasible for someone to computationally recreate a file on the
    SHA hash. This means that matching signatures identify identical files. There
    has been a lot of talk in the digital forensic community over the years of (even
    recent) proof of "collisions" that render certain hash algorithms "obsolete."
    This guide is about learning the tools. Do your research and check your agency
    or community guidelines for additional information on which algorithm to select.


    We can get an SHA hash of a disk by running the following command (note that the
    following commands can be replaced with md5sum if you prefer to use the MD5 hash
    algorithm, or any of the other above listed checksums):


    ```

    root@forensic1:~ sha1sum /dev/sdc

    5175ffff1366d1d5dd02e2956d132304e71677      /dev/sdd

    ```


    or


    ```

    root@forensic1:~ sha1sum /dev/sdc > case1/case1.disk1.sha.txt

    ```


    The redirection in the second command allows us to store the signature in a file
    and use it for verification later on. To get a hash of a raw disk (/dev/sdc, /dev/sdd,
    etc.) the disk does NOT to be mounted. We are hashing the device (disk) not the
    contents. As we discussed earlier, Linux treats all objects, including physical
    disks, as files. So whether you are hashing a file or a hard drive, the command
    is the same.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    # Collecting a Forensic Image with dd


    Now that we have collected information on our subject media and obtained a hash
    of the physical disk for verification purposes, we can begin our acquisition.


    dd is the very data copying utility that comes with a standard GNU/Linux distribution.
    There are no, doubt, better imaging tools out there for use with Linux, but dd
    is the only standby. We''ll be covering some of the more forensic oriented tools
    in the following sections, but learning dd is important for much as soon as in.
    Like vi, you are bound to find dd on just any Unix machine you might come across.
    In some cases, the best imaging tool you have available just be the one you will
    always have access to.


    This is your standard forensic image of a suspect disk. The dd command will copy
    every bit from the kernel areas of the media to the destination of your choice
    (physical device or file). There are a couple of concepts to keep in mind when
    using dd. Some of these concepts also apply to the other forensic tools we will
    cover. In very basic form, the dd command looks like this:


    ```

    dd if=/dev/sdc of=evidence.raw bs=512

    ```


    +   - Input file (if): this is the source media. What are we imaging.

    - /dev/sdc

    - Output file (of): this is the destination. Where are we placing the image/copy.

    - evidence.raw

    - Output can be a file (as above). This is common.

    - Output can be a physical device. This is often referred to as a "clone".

    - Disk image (/dev/sdx): We can use the name for the entire device node.

    - Partition (/dev/sdx1): We can use the device name and the partition number to
    image a single partition/file system. # is the partition number (as returned fdisk
    -l, for example).

    - Block size (bs): the size of the device being imaged. The kernel usually handles
    this. This may become a issue as block sizes change with the evolution of storage
    media. For our current target (/dev/sdc), the hdparm -I output is showing 512
    bytes per sector (Logical/Physical Sector Size). Be aware of some newer devices
    that are 2048 bytes per sector.

    - There is also set of options that are often used to avoid problems in case there
    are bad sectors on the disk.

    - conv=noerror,sync

    This option instructs dd to bypass copying sectors with errors AND pad those matching
    sectors in the destination with zeros. The padding keeps offsets correct in any
    file system data and perhaps still result in a usable image (or on this later).
    I''m not a fan of using this


