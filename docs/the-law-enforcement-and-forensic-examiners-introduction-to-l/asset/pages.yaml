    BEFORE FILE SYSTEMS ON DEVICES CAN BE USED, THEY MUST BE MOUNTED

    nAny file systems on partitions you define during installation will be mounted
    automatically

    every time you boot. We will cover the mounting of file systems in the section
    that deals with

    Linux commands, after you have gained some navigation experience.


    Keep in mind, that when not mounted, devices can be written to. Simply

    mounting a file system does not protect it from being inadvertently changed by
    your

    actions or via mechanisms under your control.


    # Device Node Assignment – Looking closer


    Another common question arises when a user plugs a device in a Linux box and

    receives no feedback on how (or even if) the device was recognized. One easy method
    for

    determining how and if an inserted device is registered to use the dmesg command.


    For example, if I plug a USB drive into a Linux computer I may see an icon

    after the desktop for the disk. I might even see a folder open on the desktop
    allowing me

    to access the files automatically. If I''m at a terminal and there is no X desktop,
    I may get

    feedback at all. I plug the disk in and see nothing. I, of course, run the lssci
    command

    to see my list of media refreshed. But I may want more than that.


    So where can we look to see what node was assigned to our disk (/dev/sdc,

    /dev/sdd,etc?) How do we know if it was detected? Again, this question is

    particularly pertinent to the forensic examiner, since we may likely configure
    our system to be

    a little less "helpful" in automatically opening folders,


    Plugging in the thumb drive and immediately running the dmesg command provides
    me

    with the following (abbreviated for readability):


    ```

    root@forensic1:~# dmesg

    usb 2-4.2: new SuperSpeed device number 4 using xhci_hcd

    usb 2-4.2: new USB device found, idvendor=00781,idProduct=5583

    usb 2-4.2: new USB device strings: Mfr=1,Product=2, SerialNumber=3

