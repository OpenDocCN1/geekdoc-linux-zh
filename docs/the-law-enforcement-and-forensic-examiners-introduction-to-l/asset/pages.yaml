    root@forensic1:~# lsblk


    +   NAME MAJ:MIN SIZE RO TYPE MOPOINT

    sda 8:0 0 931.5G disk \n-sda1 8:1 0 256M part /boot

    -sda2 8:2 0 32G part [SWAP]

    -sda3 8:3 0 899.3G part /

    sdb 8:16 0 238.5G disk

    sdc 8:32 0 931.5G disk

    -sdc1 8:33 0 931.5G disk

    sdi 8:128 0 931.5G disk

    -sdil 8:129 0 931.5G part /run/media/berry/Evid

    sdj 8:144 1 29.3G disk

    -sdjj 8:145 1 29.3G part /run/media/berry/Kingston

    sr0 11:0 0 2.6G rom


    You can see from the output that disks and partitions are listed, and if any of
    the partitions are mounted, lsblk will also give you the current mount point.
    In this case we /dev/sda1 is mounted on /boot, /dev/sda2 is our swap partition,
    /dev/sda3 is our root partition, and we /dev/sddi is mounted as /run/media/berry/Evid
    and /dev/sdjj mounted as /run/media/berry/Kingston. The last two are from external
    devices, plugged in via the desktop.


    Another useful command that we use is lscsi. I prefer it because although it does
    not show partitions, it gives a better idea of what the values are


    root@forensic1:~# lscsi

