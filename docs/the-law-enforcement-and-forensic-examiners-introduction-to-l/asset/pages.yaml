- pgno: 90
  md: '# VII. Linux and Forensics


    # Evidence Acquisition


    In this section we''ll run through a few of acquisition tools that are available
    to us. We''ll cover some of the collection issues, device information, image verification
    and more advanced mounting options. Obviously, the first thing we need to make
    sure we have a proper place to output the results of our imaging and analysis.


    As we go through the following sections, try and use an old (smaller) hard drive
    to follow along. Find an old SATA drive (the one I''m using is 40GB) and attach
    it to your computer, either to the SATA bus directly, or through a USB (3.x) drive.
    That way you can follow along with the commands and compare the output with what
    we have. You can even use a USB thumb drive, and then the output for some of the
    media information collection sections will not provide comparable output. The
    best way to learn this material is to actually do and experiment with them.


    # Analysis Organization


    Before we start collecting evidentiary images and information that might become
    useful in a court or an administrative hearing, we might want to make sure we
    store all this data in an organized fashion. Obviously this is not something specific
    to Linux, but we need to make sure we have several system locations to store and
    retrieve data:


    +   n1. Case specific directories or volumes used to store forensic images for
    a given case.

    2. Case specific directories for storing forensic software and subject matter
    information.

    3. Specific directories to be used as mount points for evidence images.

    4. A log file of our actions. Documentation and note taking are an imperative
    part of proper forensics.


    Wherever you store your case data, you''ll want to keep it organized. In most
    cases, when you are conducting an analysis, you''ll want to make sure you are
    using "working copies" rather than the actual image. This goes without saying.
    Practitioners will often collect images or other data directly as evidence. Copies
    will then be made of that, with originals placed in some sort of controlled storage
    and additional copies (perhaps multiple copies) being made as "working copies".
    We will discuss the simple creation of directories to store these files as we
    move through the upcoming pages. For starters, though, we will at least need a
    place to store images and media information, for our evidence and for our working
    copy(s). The Following is just an example of how you might organize the various
    directories in which you are storing data. Obviously nothing will be written to
    the subject disk (the disk we are analyzing). In the next section will describe'
  merge: -1
  img_proc: true
