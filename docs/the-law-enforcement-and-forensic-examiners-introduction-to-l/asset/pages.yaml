    As expected, the keyword is in the only NTFS partition which resides at offset
    2048 (sectors). We can complete the math and determine the block the keyword resides
    in all at once:


    ```

    barry@forensic1:~/NTFS_Pract_2017$ echo "(42659865-(2048*512))/4096" | bc

    103893

    ```


    For review, this reads: "Take our offset to the keyword in our data (426596865),
    subtract the offset to the start of the partition (2048*512), and divide the resulting
    value by our file system block size (4096). Our file system block is 103893.


    ```

    barry@forensic1:~/NTFS_Pract_2017$ blstat -o 2048 NTFS_Pract_2017.E01 103893

    Cluster: 103893

    Not Allocated

