    So we know what file system we are dealing with, we need to mount the image as
    a device to see the contents. For that we can use a loop device.


    # The Loop Device


    We can mount the file system(s) within the image using the loop interface. Basically,
    this allows you to "mount" a file system within an image file (instead of a disk)
    to a mount point and browse the contents. In simple terms, the loop device acts
    as a "proxy disk" to serve up the file system as if it were on actual media.


    # Loop option to mount the command


    For a simple file system image (where there not multiple partitions in the image),
    we can use the same mount command and the options as any other file system on
    a device, but this time we include the option loop to indicate that we want to
    use the loop device to mount the file system within the image file. Change to
    the directory where placed the fat_fs.raw, and follow the following (skip the
    mkdir command if you already created this directory in our earlier section on
    mounting external file systems):


    ```

    root@forensic1:~# mkdir /mnt/analysis

    ```


    ```

    root@forensic1:~# mount -t vfat -o ro,loop fat_fs.raw /mnt/analysis/

    ```


    ```

    root@forensic1:~# ls /mnt/analysis/

    ```


