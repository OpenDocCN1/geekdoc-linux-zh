    tell dd to start cutting, and how much to cut. The output file will be our JPEG

    image. Easy, right? So here''s our plan, and the tools we''ll use:


    +   1) Find the start of the JPEG (xxd and grep)

    2) Find the end of the JPEG (xxd and grep)

    3) Calculate the start of the JPEG (in bytes using bc)

    4) Cut from the start to the end and output to a file (using dd)


    This exercise starts with the assumption that we are familiar with standard file
    headers.

    Since we will be searching for a standard JPEG image within the data chunk, we
    will start with\hent stipulation that the JPEG header begins with hex ff8d with
    a six-byte offset to the string

    JFIF. The end of the standard JPEG is marked by hex ffd9.


    Let''s go ahead with step 1: Using xxd, pipe the output of our image_carve.raw
    file

    and look for the start of the JPEG25.


    ```

    barry@forensic1:-$ xxd image_carve_2017.raw | grep ff8d

    0000f000: 901d cef7 b848 ac23 24ab 4f44 6d13.......#$.OM.

    0001b0a0: e79e a8d6 d7fb8 b357 a5f7 ff8d 85e9 e29d4......3.g......$

    00033b80: 84ae5 aec d7fb8 ff8d 33c7 052d 8a0e 6e7e.......<7.~~n~

    000636ac: 1676 761b e3d4 ff8d fe00 0010 4446 4946......JFIF

    ```


    The grep command found four lines that contain the potential header of our picture

    file. We are looking for a JPEG image, and we know that following an additional

    four bytes after the ff8d we should see the JFIF string. The last line of our
    output shows,

    mining is the correct match. This is shown in red above.


    A start of a JPEG file header has been found. The offset (hex) for the

    beginning of this line xxd output is 00836ac. Now we can calculate the byte offset
    by

    dec. We will use the bc command. As discussed in an earlier section, bc is a

    command "calculator", useful for conversions and calculations. It can be used
    either

    interactively or piped in. In this case we will echo the hex to bc, first telling
    it

    the value is in base 16. bc will return the decimal value.


    ```

    barry@forensic1:-$ echo ibase=16;36AC() | bc

    223936

    ```


    It''s important that you use uppercase letters in the hex file. Note that this
    is not

    start of the JPEG, just the start of the line in the xxd output. The ff8d string
    is actually located

    another six bytes further into the line (each hex is a character, and there are
    many


    > The perspective angle you will notice that this is a "perfect world" situation.
    There are a number of variables that can make this operation more difficult. The
    grep command can be adjusted for many

    situations using a complex regular expression (outside the scope of this document).


