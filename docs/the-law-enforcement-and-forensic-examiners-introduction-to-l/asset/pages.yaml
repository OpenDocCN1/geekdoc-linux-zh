    In addition, when using regular GNU dd, hashing functions are performed external
    to the imaging, by the md5sum or sha1sum commands, depending on the analyst preference
    for algorithm. dc3dd allows the user to run BOTH hashes concurrently on an acquisition
    and log the hashes. Before we run our split images with dc3dd, lets look at the
    hashing options a little closer.


    We select our algorithm with the option hash= md5, sha1, sha256, sha512, or a
    comma separated list of hashes. In this way you can select multiple hash methods
    for a single image file. These will be written to a log file we specify, or standard
    output if no log is specified.


    dc3dd also provides hof and hops parameters. The hof option acts much like of,
    but hashes the output, compares it to the input and records it. You must select
    a hash algorithm, hops acts much like of, splitting the output into chunk sizes
    by ofsz. The hops option differs in that it allows each hash of the input/output
    streams and compares logs for each chunk.


    You can pass the log=filename parameter to log all output in a single place, or
    you can log hashes separately using the hlog=filename option.


    Let us redo our dd with the 128M thumb drive. This time we will use dc3dd. Aside
    from the options covered above, we will also use the. We will discuss the options
