  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    Directory contents can include:


    +   * /bin Common commands.


    Another important when considering the file system is of relative explicit paths.
    When confusing at first, practice will make the idea second nature. Just remember
    that when you provide a path name to a command or file, including a “/” in front
    means an explicit path, and will define the location starting from the top level
    directory (root). Beginning a path name without “/” indicates that your path starts
    in the current directory and is referred to as a relative path. On this later.


    One useful resource for this topic is the File System Hierarchy Standard (FHS),
    the purpose of which is to provide a reference for developers and system administrators
    on file and directory placement. Read more about it at http://www.pathname.com/fhs/


    # Mount External File Systems


    There is a long list of file system types that can be accessed through Linux.
    You do by using the mount command. Linux has a couple of special directories to
    mount file systems to the existing directory tree. One directory is called /mnt.
    It is here that you can dynamically attach file systems from external (or internal)
    storage devices that were'
