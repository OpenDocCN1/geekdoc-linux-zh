    we are calculating the original data block in that image. The question we are
    answering here is "What data block in the original image is unallocated 1593?"


    ```

    berry@forensic1:~/$2 blklcalc -o 10260 -u 1593 able2.dd

    5184

    ```


    The command above is running blklcalc on the file system (-o 10260) on the original
    able2.dd, passing the data block we calculated from the blkls image (-u 1593).
    The result is a familiar block 5184 (see Exercise #2A again). The illustration
    below gives a visual representation of a simple example:


