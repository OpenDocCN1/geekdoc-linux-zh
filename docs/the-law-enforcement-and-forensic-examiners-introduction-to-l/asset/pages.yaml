    Not all media images are this simple, however...


    # Mounting Full Disk Images with losetup


    The example used in the previous exercise utilizes a simple stand alone file system.
    What happens when you are dealing with boot sectors and multi partition disk images?
    When you create a raw image of media with dd or similar commands you usually end
    up with a number of components to the image. These components can include a boot
    sector, partition table, and the various partitions.


    If you attempt to mount a full disk image with a loop device, you find that the
    mount command is unable to identify the file system. This is because mount does
    not know how to “recognize” the partition table. Remember, the mount handles file
    systems, not disks (or images). The easy way around this (although it is not very
    efficient for large disks) would be to create separate images for each disk partition
    that you want to analyze. For a simple hard drive with a single large partition,
    you could create two images.


    One for the entire disk:


    ```

    root@forensic1:~# dd if=/dev/sda of=image.raw

    ```


    And one for the partition:


    ```

    root@forensic1:~# dd if=/dev/sda1 of=image.raw

    ```


    The first command gets you a full image of the entire disk (sda) for backup purposes,
    including the boot sector and partition table. The second command gets you the
    first partition (sda1). The resulting image from the second command can be mounted
    via the loop device, just as our far_fs.raw, because it is a simple file system.


    Note that both of the above images will contain the same file system with the
    data, which obviously not match. Making separate images for each partition is
    very inefficient if it is only being done


    One method for handling full disks using the loop device is to send the mount
    command a message to skip the boot sector of the image and find the partition.
    These sectors are used to contain information (like the MBR) that is not part
    of a normal file system. We can'
