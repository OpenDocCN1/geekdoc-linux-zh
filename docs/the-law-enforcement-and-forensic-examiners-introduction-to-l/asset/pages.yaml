    # Over the Wire – Other Options


    Here''ve covered the very basics and mechanics of imaging media over a network
    pipe. netcat is not your solution to this, though it is one of the simpler options
    and is widely available on most boot disks and Linux systems.


    In reality, you might want to consider whether your data went encrypted as it
    traverses the network. In our example, we may have been connected via a crossover
    cable (interface to interface) or through a standalone network hub. What if you
    are in a situation where many of connection is collect? Or over enterprise hardware
    (switches, etc.)? In that case you would want encryption. For that you could use
    cryptcat, or ssh. Now that you understand the basic mechanics of this technique,
    you are urged to explore other tools and methods. There are projects out there
    like rdd https://sourceforge.net/projects/ddd/ and air://sourceforge.net/projects/air-image/)
    you might want to explore, for more than just network imaging. Compression on
    the fly with


    Another useful capability while imaging is compression. Considering our concern
    for forensic application here, we will be sure to manage our compression technique
    so that we can verify our hashes without decompress and write our images before
    checking them.


    For this exercise, we will use the GNU gzip application. gzip is a command line
    utility that allows us manage some fairly granular control over the compression
    process. There are other compression utilities (zip, xz, etc.), but we will concentrate
    on gzip for the reasons we learned dd and vi... always available, and starting
    point to learn the command line concepts. Most source packages for software is
    minimally available in a gz compressed format, but I urge you to explore other
    compression options on your own.


    First, for the sake of familiarity, let''s look at the simple use of gzip on a
    single file and explore some of the options at our disposal. I have created a
    directory called testcomp and I''ve copied the image file NTFS_Pract_2017.raw
    into that directory to practice. This gives me an uncluttered place to experiment.
    First, let''s double check the hash of the image:


    ```

    root@forens1:\# mkdir testcomp


    root@forens1:\# cp nt NTFS_Pract_2017.raw testcomp/


    root@forens1:\# cd testcomp


    root@forens1:~/testcomp# ls -lh

    total 501M

    -rw-r--r-- 1 root 500M 6 12:10 NTFS_Pract_2017.raw

    ```


    ```

    root@forens1:~/testcomp# sha1sum NTFS_Pract_2017.raw

    094123df4792b18a1f064f1e2fc609028695f85 NTFS_Pract_2017.raw

    ```


