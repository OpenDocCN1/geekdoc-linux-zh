- pgno: 303
  md: 'v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    Note that the times are different. Obviously this is because of the application
    of time zones. Differences in the output are not disqualifying as cross-verification
    if you are able to explain why the difference occurs. This is the foundation of
    knowing how your software works.


    Looking at the output of the Windows software registry parsing, we can verify
    with commands we used previously:


    ```

    barry@forensic1:/sammnt/SAM/Domains/Account/Users/000003E8/(values)$ xxd F

    00000000: 0200 0100 0000 0000 678e 5df7 7fc1 27d1.......G......

    00000010: 0000 0000 0000 0000 20d7 bf15 76ae 2d1.......V......

    00000020: ffff ffff ffff fff7 5ce9 5df2 7fc1 27d1.......\L....

    00000030: e803 0000 0000 1402 0000 0000 0000 0000

    00000040: 0000 0000 0700 0100 0000 4876 488a 3600......Hv.H.

    ```


    +   - Login Date : offset 8


    ```

    barry@forensic1:-../000003E8/(values)$ python ~/WinTime.py ''xxd -ps -s8 -l8 F''

    Sun Apr 30 21:23:09 2017

    ```


    With a simple few steps we''ve confirmed every critical output, using tools from
    a different platform, which can hopefully strengthen any testimony we may be required
    to give on the findings.


    Cross verification can also be used to confirm the very first and most important
    step of any forensic process: the acquisition and proper handling of collected
    evidence. We can verify through other tools'' media hashes, collection hashes,
    or media identification.


    If you can find a way to add Linux to your workflow, you could keep your skills
    current, learn additional skills, and perhaps learn to automate some of this workflow
    through scripting. There are several ways you can deploy Linux in your work, including
    virtual machines, standalone workstations, and bootable distributions.


    Virtual machines (VM) are growing in popularity, and have been for years. There
    are free options (like VirtualBox) that are robust and offer excellent compatibility
    and configuration options for a forensic examiner. You can run a VM on your forensic
    workstation and provide it access to evidence folders and files, allowing direct
    interface between the tool and the target image. VMs also have a "snapshot" feature
    so that when your work is complete, a snapshot of a clean and periodically updated
    operating system can be restored. Also note that VMs can be run the other way
    – I normally run Windows in a VM on a physical Slack Linux workstation. The reason
    I do highlights one of the drawbacks of VM usage – direct access to hardware.
    A VirtualBox, for example, will allow connections via a virtual USB controller.
    There are, however, times when I would want to query directly


    304'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# v4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    connected devices without the need of a virtual bridge. I prefer to use Linux
    for that, so Windows is relegated to a VM and Slackware is given direct access
    to hardware. That, however, is a matter of personal preference.


    The other way to run Linux is to have an actual dedicated workstation. This is
    fine if you have one you can devote to the purpose, and it alleviates the aforementioned
    hardware access and enumeration issues. A full work station is particularly useful
    when you might want to validate or cross verify hardware identification or enumeration.
    Having a physical workstation requires more monetary resources and can require
    more configuration effort for exotic or less common hardware, but it also provides
    the most complete forensic access for the operating system to interact with attached
    hardware.


    The final way you can continue using Linux is through a bootable distribution.
    These are always handy to keep around for times where you may need to boot a subject
    computer to acquire even or conduct a limited examination without imaging internal
    media. We used this approach in "dd over the wire" exercise. There are number
    of good bootable distributions available suitable for forensic use. Download a
    couple, try them out, and see what works best for you. It may be a good idea to
    have several different versions for different scenarios or hardware configurations.
    Two bootable Linux variants that come to mind immediately Caine and Kali Linux:


    Caine: http://www.caine-live.net/


    Kali: https://www.kali.org/'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# XI. Conclusion


    The examples and practical exercises presented to you here are relatively simple.
    There are quicker and more powerful ways of accomplishing some of what we have
    done in the scope of this document. The steps taken in these pages allow you to
    use common Linux tools and utilities that are helpful to the beginner. We''ve
    also incorporated more advanced tools and exercises to add some "real world" applicability.


    Once you become comfortable with Linux, you can extend the commands to encompass
    many more options. Practice will allow you to get more and more comfortable with
    piping commands together to accomplish tasks you never thought possible with a
    default OS load (and on the command line to boot!). The only way to become proficient
    on the command line is to use it. And once you get there, you may have a hard
    time going back.


    I hope that your time spent working with this guide was a useful investment. At
    the very least, I''m hoping it gave you something to do, rather than stare at
    Linux for the first time and wonder "what now?"'
  merge: -1
  img_proc: true
