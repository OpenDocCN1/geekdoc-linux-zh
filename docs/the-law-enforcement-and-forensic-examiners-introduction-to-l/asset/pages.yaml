- pgno: 12
  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    management architecture and configuration, etc.) and the package format (the software
    install and upgrade path) most commonly differentiate the various Linux distros.


    It is common to hear users complain that X works under one distribution, but not
    on another, etc. That device Y did not work under one version of a distribution,
    but a change to "fixed it". Most often, the difference is in the version of the
    Linux kernel being used and therefore the updated drivers, or the patches applied
    by the distribution vendor, not the version of the distribution (or the distribution
    itself).


    Previous versions of this guide provide a short list of distros and a summary
    description of each. That has been removed for a more descriptive explanation
    of why we have so many distributions, and how you can choose from them. Everyone
    has an opinion on these, and they all have their strengths and apparent weaknesses.


    One thing we''ve seen more and more lately is somewhat specialized distros, or
    in some cases, that are perceived as specialized. There are still "general workstation"
    flavors of Linux – CentOS, Debian, Ubuntu, Slackware, Gentoo, etc., but we also
    have specialization now – full distributions designed and distributed specifically
    for a target audience like pentesters, enterprise admins, etc.


    Some examples of specialized distributions that may be of interest to readers
    of this document:


    +   - The Parrot Project – A Security distribution that "includes a full portable
    laboratory" for security and digital forensic experts.

    - The SANS SIFT Workstation – An advanced incident response and digital forensics
