    # Mounting Split Image Files with affuse


    We are going to continue our exploration of mounting options for image files by
    addressing those occasions you might want to mount and browse an image file that
    has been split with dd/split or dc3dd, etc. For that we can use affuse from the
    afflib package.


    The Advanced Forensic Format (AFF) is an open format for forensic imaging, and
    the afflib package provides a number of utilities to create and manipulate images
    in the AFF format. We won''t cover those tools, or the AFF format in this document
    (at least not in this version), but we are interested in right now the affuse
    format.


    affuse provides virtual access to a number of image formats, split files among
    them. It does through the File System in User Space software interface. Commonly
    referred to as "fuse file systems", fuse allows us to create application level
    file system access mechanisms that can bridge to the kernel and the normal file
    system drivers.


    The afflib package is available as a SlackBuild for Slackware, and can be simply
    installed with sboinstall


    ```

    root@forensic1:-# sboinstall afflib

    ```


    afflib is library and set of tools to support of Advanced Forensic Format (AFF).


    Cleaning for afflib-3.7.7...


