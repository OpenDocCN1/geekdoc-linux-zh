    # Bulk Extractor – Comprehensive Searching


    In previous exercises, we discussed where simple text based string searches might
    be ineffective depending on character encoding and file formats (compression,
    etc.). There are a number of character set aware tools out there that we can use
    to overcome many of these issues, but detailed descriptions of character encoding
    and searches are not what we are aiming for. Instead we are to introduce a tool,
    bulk_extractor, that incorporates some excellent multi-format searching capabilities
    with some other very useful functions. bulk_extractor was created by Simon Garfield
    at the National Postgraduate School.


    For those of you who have not already heard of or used bulk_extractor, it is one
    of those tools I rarely use on every case. Even when I have a targeted extraction
    or analysis to perform, bulk_extractor can always find additional information
    or, at the least, provide an excellent overview of user activity or disk context.
    It is particularly useful in situations you have been given (or acquired yourself)
    a high volume of media and you want to quickly sort out the interesting data.
    This triage capability is one of the highlights of bulk_extractor.


    bulk_extractor differs from some other common tools in that it runs and searches
    independently of the file system. In this case, the content – whether allocated
    or unallocated, whole or fragmented, or even in compressed containers. bulk_extractor
    reads the data in blocks, without regard to the file system structure, and recursively
    searches those blocks for interesting features. Recursive in this case means the
    tool will, for example, decompress an archive to search the contents and extract
    text from PDF files to be further processed.


    A user’s manual for bulk_extractor is available at:


    http://downloads.digitalcorpora.org/downloads/bulk_extractor/BEUsersManual.pdf


    bulk_extractor also has a GUI tool, Biewer, commonly used to read the feature
    files and run the program. If you want to see this in action, you’ll need java
    installed. OpenJDK is the easiest to install from sbtool, but be sure to read
    the README. OpenJDK will


    257'
