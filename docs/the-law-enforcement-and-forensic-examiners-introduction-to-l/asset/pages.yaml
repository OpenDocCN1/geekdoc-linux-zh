    You can browse around the rest of the feature files and histograms to see what
    we may have uncovered. There''s quite a bit of information there and you can get
    a general idea of things like the user''s browsing activity by looking at url_histogram.txt.
    You certainly can create drawings, which are blocked by the regular scanner feature
    and provide some context to your investigation.


    One thing you may notice is that a large number of the features found by the email
    and url scanners (and others) come from known sources. Every operating system
    and the external software we use has manuals, and other documentation that contain
    email addresses, telephone numbers, and web addresses that are uninteresting,
    but will still end up in your bulk_extractor files and histograms. These false
    positives can be limited by using stop lists. Much like our my.txt file, a stop
    list can be a simple list of terms (or terms with context) that are blocked from
    the regular scanner feature files (but still reported in specially stopped.txt
    files for each scanner).


    A final bulk_extractor capability that we''ll mention briefly is the wordlist
    scanner. By default, the wordlist scanner creates lists of words that can be used
    to attempt password cracking. In a normal bulk_extractor run, you use -e wordlist
    to enable the scanner, or -E wordlist to run it on ones.


    Very quickly gets back and use our keyword hit on Uranium-235 to learn about a
    quick command line .docx file viewer catdoc. This is actually a very short script
    than a program, and it simply zip the file and makes the XML content readable.


