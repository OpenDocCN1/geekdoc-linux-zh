    previous fat_fs.raw exercise on a complete file system "rooted" at /mnt/evid.


    As always, you should know what you are doing when you mount a complete file system
    on your forensic workstation. Be aware of options for the mount command that you
    might want to use (check man mount for options nodev and nosuid, noatime, etc.).
    Take note of where links point to the subject file system. Note that we have mounted
    the partitions "read only" (ro). Remember to unmount (amount) each partition when
