    # Final Words on Imaging


    Anyone who has worked in the forensic field for any length of time can tell you
    that\hent acquisition process is the foundation of our business. Everything else
    can be cross

    verified and validated after the fact. But you only get one shot at a proper acquisition.

    You may have a limited amount of time on site, or one shot at recovering data
    from a disk

    drive. Make sure you understand how the tools work, and what the options actually
    do.

    Validating your approach prior to using it in live field is essential.


    This section has introduced a number of basic tools and a rough skillset.

    Requirements and procedures vary from jurisdiction to jurisdiction and across
    organizations.

    Know the requirements of your particular governing body, and adhere to them.


    Keep in mind also that technological advances will change much of how we do

    acquisitions. Solid state media and storage technologies are more than just changes
    to the

    interface that may require an adapter. The way data is physically stored and data
    blocks

    manipulated is a constant evolution. The entire approach to "obtaining an exact
    duplicate"

    changing as storage methods and technologies advance. Don''t get too comfortable!


