    Keep in mind that the Sleuth Kit supports a number of different file systems.
    istat

    (along with many of the Sleuth commands) will work on more than just an EXT file
    system.

    The descriptive output will change to match the file system being used. We will

    see of this a little later. You can see the supported file systems by running
    istat with -f

