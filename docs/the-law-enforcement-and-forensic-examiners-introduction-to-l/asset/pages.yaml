  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Fortress Platform


    One note on package management. A complete list of packages installed on your
    system is maintained in /var/log/packages. You can browse that directory to see
    what you have installed, as well as view the files themselves to see what was
    installed with the package. One nice thing about using SlackBuilds is that an
    SB tag is added to the package name. We can grep for this tag in /var/log/packages
    and see exactly which external packages we have installed via SlackBuilds This
    is one of the great advantages of using a package manager vs. simply compiling
    and installing software from source directly...the ability to track what versions
    of packages are installed.


    We have installed three packages using build scripts from SlackBuilds.org. One
    via manual download (sbotools), and two via sbotools (clamav and lshw). We use
    grep to see within the /var/log/packages directory (assuming this is a clean Slack
    system and you have installed no .tgz or .txz Slack packages):


    ```

    root@forensic1:~ ls /var/log/packages/ | grep SB

    clam-0.99.2-x86_64-1_SB

    sbotools-2.3-noarch-1_SB

    lshw-B.02.18-x86_64-1_SB

    ```


    When it comes to upgrade (or check for updates) software we''ve installed via
    sbotools/SlackBuilds, you can use sbocheck. Running this command will fetch fresh
    SlackBuild tree from SlackBuilds.org and compare your packages to those currently
    available.


    ```

    root@forensic1:~ sbocheck

    Updating SlackBuilds...

    0 0% 0.00kB/s 0:00:00 (ifr#0,to-chk=0/39799)

    Checking for updated SlackBuilds...

    ```


    sbotools 2.3 < needs updating (2.4 from SBO)


    A copy of the above result is kept in /var/log/sbocheck.log


    We can see from the output that a new version of sbotools is available. To upgrade,
    we simply use the command sbupgrade where we are using sbotools to upgrade sbotools:


    ```

    root@forensic1:~ sbupgrade sbotools

    sbotools (ports-like interface to SlackBuilds.org)

    Package sbotools-2.4-noarch-1_SBo.tgz installed.

    ```


    sbotools-2.0-noarch-1_SBo upgraded with new package /tmp/sbotools-2.4-noarch-1_SBo.tgz.'
