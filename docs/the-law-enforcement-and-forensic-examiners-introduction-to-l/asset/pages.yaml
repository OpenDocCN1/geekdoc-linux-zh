  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    If you look at the output of our last fls command, you will see a deleted file
    called lrkn.tgz located in the /root directory (the last file in the output of
    our fls command, before the list of orphan files -recall the asterisk indicates
    it is deleted):


    ```

    ...

    r/r * 2139: root/lrkn.tgz

    ...

    ```


    The inode displayed by fls for this file is 2139. This same inode also points
    to another deleted file in /dev earlier in the output (same file, different location).
    We can find all the file names associated with a particular data entry by the
    find command:


    ```

    barry@forensic1:-$ $ find -o 10260 -a able2.dd 2139

    * /dev/ttv20/lrkn.tgz

    * /root/lrkn.tgz

    ```


    Here we see that there are two file names associated with inode 2139, and both
    are deleted, as noted again by the asterisk (the -a ensures we get all the inode
    associations).


    Continuing on, we are going to use istat. Remember that fsstat took a file system
    as an argument and reported statistics about that file system. istat does the
    same thing; only it works on a specified inode or meta data entry. In NTFS, this
    would be an MFT entry, for example.


    We use istat -o to gather information about inode 2139:


    ```

    barry@forensic1:-$ istat -o 10260 able2.dd 2139 | less

