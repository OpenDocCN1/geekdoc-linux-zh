    Our file is still dc (if=/dev/sd), our output file is now

    case1.disk1.dc3dd.raw (of=case1.disk1.dc3dd.raw). One of the first you notice
    right away is that dc3dd returns more information while the program is running.
    It gives you a nice progress indicator, unlike dd. The correct number of sectors
    for /dev/sd were captured (7812500), and there were no "bad" sectors detected.
    The start and stop timestamps are also added by default. If you specify a log
