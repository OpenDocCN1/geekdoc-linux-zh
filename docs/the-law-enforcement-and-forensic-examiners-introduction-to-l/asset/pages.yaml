- pgno: 26
  md: 'v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    # II. Linux Disks, Partitions and the File System


    As you go through the following pages, please pay attention to your userid...you''ll
    need to be root for most of this.


    # Disks


    Linux treats devices as files. This is an important concept for forensic examiners.
    It means, as we will see later on, that many of the commands we can use on regular
    files, we can also use on disks "files". We can list them, hash and search them
    in the same way we do files in any standard user directory. The special directory
    where these device "files" are maintained is /dev. Older IDE disks were detected
    and assigned hdn. We rarely see them anymore.


    As we saw earlier, with the adoption of Udev, disks are not assigned device names
    dynamically, meaning that the names do not exist until the device (a thumb drive,
    for example) is connected to the system. Of when you boot a normally configured
    computer, you have at least one "boot" drive already connected. Under some circumstances,
    this will be named sda. These device nodes are populated by the /dev directory.
    The partitions (primary) are simply numbered.


    When referring to the entire device, use /dev/sda. When referring to a partition
    on that disk, we use the disk name and the name of the partition, /dev/sda1 for
    example.


    +   DEVICE: FILE NAME:

    1st disk (SATA, USB, etc.) /dev/sda

    - 1st Primary partition /dev/sda1

    - 2nd partition /dev/sda2, etc.

    2nd disk (SATA, USB, etc.) /dev/sdb

    - 1st Primary partition /dev/sdb1

    - 2nd partition /dev/sdb2, etc.

    CDROM Drive /dev/sr0


    The pattern described above is fairly easy to follow. If you are using a standard
    SATA disk, it will be referred to as sdx where the x is replaced with an a for
    the first detected device and b for the second. In the same way, the CDROM or
    DVD drives connected via the SATA bus will be detected as /dev/sr0 and then /dev/sr1.


    Note that the /dev/sdx device will include USB and Firmware devices. For example,
    a primary SATA disk will be assigned sda. It normally be detected as sdb, and
    so on.


    A simple way to see the disks and partitions that are attached to your system
    is to use the lsblk command:


    27'
