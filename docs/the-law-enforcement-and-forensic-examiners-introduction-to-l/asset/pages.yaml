  md: "# # The File System\n\nLike the Windows file system, the Linux file system\
    \ is hierarchical. the \"top\" directory is referred to as \"/root\" directory\
    \ and is represented by \"/\". Note that the following is not a complete list,\
    \ but provides an introduction to important directories.\n\n+   / (\"root\") not\
    \ to be confused with \"/\"\n--bin\n  |--<files> ls, chmod, sort, date, cp, dd\
    \ (user accessible binaries)\n--boot\n  |--<files> vmlinuz, system.map\n--dev\n\
    \  |--<devices> tty, sd*\n--etc\n  |--X11\n  |  |--<files> xorg.conf\n--home\n\
    \  |--barry (your user's name is in here)\n  |  |--<files> bashrc, bash_profile,\
    \ personal files\n  |  --other users\n--lib[64]\n  |--system libraries (32bit\
    \ in lib64 and 64bit in lib64)\n--media\n  |--cdrom0\n  |  |--dvd0\n--mnt\n  |--_other\
    \ temporary mount points\n--opt (some software installs here \"optional\")\n--root\n\
    \  |--<root user's home directory (not to be confused with \"/\" [file system\
    \ root])\n--run\n--sbin\n  |--<files> shutdown, cfdisk, fdisk, insmod (system\
    \ binaries)\n--sys\n--usr\n  |--local\n  |  |--lib\n  |  |--man\n--var\n  |--log\n\
    \nOn most Linux distributions, the directory structure is organized in the same\
    \ manner. Certain configuration files and programs are distribution dependent,\
    \ but the basic layout is similar to this. Note that the directory \"slash\" (/)\
    \ is opposite what most people are used to in Windows (\\)."
  merge: -1
  img_proc: true
