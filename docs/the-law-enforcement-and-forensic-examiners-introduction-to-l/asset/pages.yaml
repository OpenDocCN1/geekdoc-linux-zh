    So what happens with that loop option? When you pass the loop option in the mount
    command, you are actually calling a shortcut to creating loop devices with a special
    command, loopset. It is important that we understand the background here.


    losetup


    Creating loop devices is an important skill. Rather than letting the mount command
    take charge of that, let''s have a look at what is actually going on.


    Loop devices are created by the Linux kernel in the /dev directory, just like
    other devices.


    ```

    root@forensic1:-# ls /dev/loop*

    /dev/loop-control /dev/loop1 /dev/loop3 /dev/loop5 /dev/loop7

    /dev/loop0 /dev/loop2 /dev/loop4 /dev/loop6

    ```


    These are what can be utilized to associate files with a device. The /dev/loop-control
    device is an interface to allow associates to loop devices. The command we use
    to manage our loop devices is losetup. Invoked by itself, losetup will list loop
    devices (it will return nothing if no loop devices are in use). In simplest term,
    you simply call losetup with the device names (/dev/loopX) and the file you wish
    to associate with it:


    ```

    root@forensic1:-# losetup /dev/loop0 fat_fs.raw

    root@forensic1:-# losetup -l

    NAME SIZEELIZ OFFSET AUTOCLEAR RO BACK-FILE

    /dev/loop0 0 0 0 /root/fat_fs.fd

    ```'
