- pgno: 59
  md: '# V. Editing with Vi


    There are a number of terminal mode (non-GUI) editors available in Linux, including
    emacs and vi. You could always use one of the available GUI text editors in Xwindow,
    but if you are unsure to start X, or a windowing system is not available? The
    benefit of learning vi or emacs is your ability to use them from a terminal, a
    character terminal, or a telnet or ssh session, etc. We will discuss vi here.
    (I don''t know emacs :-)). vi in particular is useful, you will find it in on
    all versions of Unix. Learn vi and you should be able to edit a file on any Unix
    system.


    # The Joy of Vi


    You can start vi by simply typing vi at the command prompt, or you can specify
    the file you want to edit with vi filename. If the file does not already exist,
    it will be created for you.


    vi consists of two operating modes, command mode and insert mode. When you enter
    vi you will be in command mode. Command mode allows you to search for text, move
    around the file, and issue commands for saving, save-as, and exiting the editor
    (as well as a whole host of other functions). Insert mode is where you actually
    input and change text.


    In order to switch to insert mode, type a (append), i (for insert), or one of
    the other insert options listed on the next page. When you will see this "INSERT-"
    appear at the bottom of your screen (in most versions). You can now use input
    text. When you want to exit the insert mode and return to command mode, hit the
    escape key.


    You can use the arrow keys to move around the file in command mode. The vi editor
    was designed, to be exceedingly efficient, if not intuitive. The traditional way
    of moving around the file is to use the qwerty keys under your fingers. More on
    this below. In addition, there are a number of other navigation keys that make
    moving around in vi easier, like using $ to move to the end of the current line
    or w to move to the next text, etc.


    If you lose track of which mode you are in, hit the escape key twice. You will
    know that you are in command mode.


    In current Linux distributions, vi is usually a link to some newer implementation
    of vi, such as vim (vi improved), or in the case of Slackware, elvis. If your
    distribution includes vim, it should come with a nice tutorial. It is worth your
    time. Try vimutor at a command prompt. Work through the entire file. This is the
    single best way to start learning vi. The navigation keys mentioned above will
    become clear if you use vimutor.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Vi command summary


    Entering Edit Mode from Command Mode:


    +   - a : append text (after the cursor)

    - i : insert text (directly under the cursor)

    - o (the letter "oh") : open a new line under the current line

    - O (capital "oh") : open a new line above the current line


    +   Command (Normal) Mode:

    - 0 : move cursor to beginning of current line.

    - $ : move cursor to the end of current line.

    - x : delete (cut) the character under the cursor

    - X : delete (cut) the character before the cursor

    - dd : delete the entire line cursor is on

    - dw : delete (cut) to the end of the word

    - d$ : delete (cut) to the end of the line

    - v : enter visual mode (select text w/cursor)

    - y : yank (copy) text

    - yw : yank (copy) to the end of the word

    - y$ : yank (copy) to the end of the line

    - p : paste after the cursor

    - P : paste before the cursor

    - :w : save and continue editing

    - :wq : save and quit

    - :q : quit and discard changes

    - :w filename : save a copy to filename (save as)


    The best way to save yourself from a messed up edit is to hit <ESC> followed by
    :q That command will quit without saving changes.


    Another feature in command mode is the string search. To search for a particular
    string in a file, make sure you are in command mode and type


    ```

    /string

    ```


    Where is your search target. After issuing the command, you can move on to the
    next hit by typing n.


    vi is an extremely powerful editor. There are a huge number of commands and capabilities
    that are outside the scope of this guide. See man vi for more details. Keep in
    mind there are chapters in books devoted to this editor. There are also complete
    books devoted to vi alone. The forensic importance of vi is that you never know
    when you will find yourself responding to a Unix machine, at a terminal, and needing
    to change a file... vi will almost certainly be there for you.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    # VI. Configuring a Forensic Workstation


    There are many excellent guides, books and websites out on the Internet that provide
    some wonderfully detailed information on setting up a Linux installation for day
    to day. We are going to concentrate here subjects of particular interest in setting
    up a secure and usable forensic workstation. This is one of the most popular requests
    I''ve received over the past couple of years.


    As with the rest of this guide, the specific commands presented here for a Slackware
    14.2 installation. While the commands and capabilities provided by other distributions
    will differ (or greatly) the basic concepts should be the same. As always, check
    your distribution''s documentation before running these commands on a Non-Slackware
    system. And let me reiterate: These are just the basics. The guidelines set forth
    here offer only a starting point for workstation configuration and security. If
    you are not using Slack, not just skip this section... the information is useless.
    This is not an exhaustive treatise on security and configuration. It is simply
    the basics you have started.


    # Securing the Workstation


    These new few sections on setup scripts, tcpwalls and iptables are contained in
    detail in Slack documentation (the Slack Book, for example) and elsewhere for
    other distributions. I am going to mention them here so that the reader gets a
    baseline understanding of these subjects. The details can be found through further
    reading. Again, take note that if you are not using Linux, and your distribution
    of choice is not configured as I am about to describe, its still worth following
    along, the subject of determining network ports and tracing what they belong to
    is an important one.


    Anyone who has been working in the field of digital and computer forensics for
    any length of time can tell that forensic security is always a top priority. Some
    practitioners work on completely ''air gapped'' forensic networks with no connection
    to outside resources. Others find this too limiting and elect to heavily firewall
    and monitor forensic workstations while allowing some level of access to external
    networks. In either case, understanding your forensic security posture is extremely
    important. This document does not endorse or suggest any particular approach,
    and as with all things in this business, the requirements for your particular
    setup change day to day depending on the nature of the tasks you are working on,
    the evidence you handling, the physical or network environment you are working
    in and the policies set forth by your agency or company.


    The goal here is to ensure that, at a minimum, a forensic examiner understands
    the current security posture of the workstation, or at the very least, is conversant
    in addressing them. This is not meant to imply, in any way, that simple host security
    is enough to protect your forensic environment. The ideal lab will have edge routers
    and hardware appliances to properly secure data and network access. In some cases,
    contraband analysis investigation for example, air gaping may be the only realistic
    solution. In any'
