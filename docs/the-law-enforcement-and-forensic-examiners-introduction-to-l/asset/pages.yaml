  md: 'v4.33


    A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    We will rundupes twice (always good practice). The first run will show all the
    duplicated files, each pair on a single line. Review the output to ensure there
    are no unexpected files, and then re-run the command with the --delete option.


    ```

    barry@forensic1:~/carve$ fdupes -R photorec_out.1/ scalp_out2/

    scalp_out2/00000000.jpg photorec_out.1/f0012156.gif

    scalp_out2/00000003.jpg photorec_out.1/f0012206.jpg

    scalp_out2/00000004.jpg photorec_out.1/f0012262.jpg

    ```


    The options we use -R for recursion. There are no sub folders in this example,
    but it never hurts to allow recursion. Particularly on large scale examinations
    we carve output in particular (different file types in different directories).
    We also use the -1 option to put matches on the same line. This is personal preference.
    Run without this option and you may see what you prefer.


    Once the output has been reviewed, re-run the command with the --delete option
    to keep only the first file in each pair (or set). If you reviewed the output
    to delete, then you might want to add the -N option for "no prompt". Use at your
    own discretion. Without -N, if you have hundreds of pairs of matching files, you
    will need to confirm each deletion.


    ```

    barry@forensic1:~/carve$ fdupes -R -N --delete photorec_out.1/ scalp_out2/

    ```


    +   [+] scalp_out2/00000000.gif

    [-] photorec_out.1/f0012156.gif


    [+] scalp_out2/00000003.jpg

    [-] photorec_out.1/f0012206.jpg


    [+] scalp_out2/00000004.jpg

    [-] photorec_out.1/f0012262.jpg


    The output above indicates that the first file has been kept [+] and the second
    file deleted [-]. If there were more than one matching file in each set, then
    only the first one would remain. To better control this behavior, remove the -N
    option and you can select which files to keep.


    This concludes our physical carving section. We''ve learned how to carve files
    from unallocated space, view the files, sort them, and remove duplicates in an
    efficient manner.


