- pgno: 81
  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    +   - software.SlackBuild is the actual build script.

    - slack-desc a brief description of the file displayed during install.


    To build a Slack compatible package, you simply drop the source code for the software
    into the same directory and execute the SlackBuild script. The package is created
    and (normally) placed in the /tmp directory for installation via pkgtools.


    Of course, there are automated tools for handling Slackware packages for you.
    You can check out sppkg, sbootools, slpkg and a few others.


    A WORD OF CAUTION: Be careful about relying on automated tools for package management.
    Regardless of the platform you choose to run on, I would urge you to learn how
    to build packages yourself, or at the very least learn how to change package options
    or at minimum determine what build options were used before running software.
    This is not to say automated tools are bad...but one of the strengths of Linux
    that we often talk about is the control it gives over our system. Controlling
    your system is one aspect of that. You can use automated tools and still maintain
    control...you just need to be careful. We will use that approach here.


