- pgno: 77
  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    I would strongly suggest you take a minute to read the change log for the current
    version of Slack you are using. Understanding what you are updating and why is
    an important part of understanding your forensic platform. It may seem tedious
    at first, but it should be part of your common system maintenance tasks. You can
    read the file Changel.txt at the mirror you selected for updating your system,
    or simply go to: https://mirror.SlackBuilds.org/slack/slack64-14.2/Changelog.txt
    when updates are available.


    Using the **slackpkg** method is the easiest way to keep your OS to date with
    the latest *stable* fixes and patches. Periodically, you can run the **slackpkg
    update** and **slackpkg upgrade-all** to keep your system to date. The first two
    steps only need to be done on your system.


    Once again, if you are not using Slackpkg, be sure to check your distribution''s
    documentation to determine how to keep your workflow properly patched. Please
    continue to bear in mind that "latest and greatest" does not translate to "properly
    patched". An important distinction.


    # Installing and Updating "External" Source


    So we''ve discussed using **slackpkg** for updating the OS packages and keeping
    your system properly patched. What about "external" source, that, that is not
    included in a default installation, like our forensic utilities? There are a number
    of ways we can install this "external" source on our system.


    +   - Compile from source

    - Use a pre-built package (usually distro included)

    - Build your own package


    # Compiling from Source


    Compiling from source is the most basic method for installing software on Linux.
    It is generally distribution agnostic and will work for any package on most distributions,
    assuming dependencies are met. Correctly used, compiling from source has the benefit
    of being tailored to your environment, with better optimization. The biggest drawback
    is that compiling from source, without careful manipulation of configuration files,
    can "litter" your system with executables and libraries placed in less optimal
    locations. It can also result in difficult to manage upgrade paths for installed
    software, or even trying to remember what you have previously installed.


    The source files (containing source code) normally come in a package commonly
    referred to as a "tarball", or a tar.gz file (a **gzip** compressed **tar** archive).
    The archive is extracted, the source is compiled, and then an install script is
    executed to place the resulting program files and documentation in the appropriate
    directories. The following shows a very'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    abbreviated view of a quick source compilation. The normal course of commands
    is used

    (usually):


    ```

    tar xvzf packagename.tar.gz

    cd packagename

    ./configure

    make

    make install

    ```


    First we extract the package and change into the resulting directory. The ./configure

    command? sets environment variables and enables or disables program features based
    on

    available libraries and arguments. The make command compiles the program, using
    the

    parameters provided by the results of the previous ./configure command. Finally,
    the make

    install moves the compiled executables and documentation to their

    respective directories on the computer. Note that make install is generally not
    distribution

    aware, the resulting placement of program files may not fit the conventions for
    a given

    Linux distro, unless the proper variables are passed during configuration.


    Here''s a quick illustration:


    Once we have a package downloaded, we extract the tarball. After the package has

    extracted, we change into the resulting directory and then run a "configure script"
    to

    allow the program to ascertain our system configuration and prepare compiler options
    for our

    environment. We do this by issuing the command :configure:


    ```

    root@forensic1:~# tar xvzf package.tar.gz

    <package extracts>

    root@forensic1:~# cd package/

    ```


    ```

    root@forensic1:~# ./configure

    ...

    checking build system type... i686-pc-linux-gnu

    checking host system type... i686-pc-linux-gnu

    configure: autobuild project... package

    ...

    ```


    Assuming no errors, we type make and wait the compiler to work. Finally, we run

    t command that properly installs both tools to the proper path, and any required
    libraries

    to the proper directories. This is generally accomplished with make install.


    ```

    root@forensic1:~# make

    Making all in lib

    make[1]: Entering directory /root/package/lib

    <continue compiler output>

    ```


    > "The ./" indicates that the configure command is run from the current directory.'
