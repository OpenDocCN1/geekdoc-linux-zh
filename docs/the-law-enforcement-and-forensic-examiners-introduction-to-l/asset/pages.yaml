  md: '# v.4.33

    A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    First, let''s make sure we can find lshw, and then read the README file:


    ```

    root@forensic1:~#$ sbofind lshw

    SBo: lshw

