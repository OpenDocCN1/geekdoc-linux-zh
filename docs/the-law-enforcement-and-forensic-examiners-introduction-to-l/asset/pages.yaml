- pgno: 17
  md: '# v.4.33 A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    Slackware comes with a convenient script, **adduser**, to handle the details of
    setting up our additional account. Some of the items set by this script include:


    +   * Login Name

    * UID (user ID)

    * Initial Group and Group membership

    * Home Directory

    * Shell

    * Account Expiration Date

    * Account General Info (name, address, etc.)

    * Password


    For the most part, the defaults are acceptable (even the default groups – be careful
    not to skip this part). You invoke the script with command **adduser** (run as
    *root*, obviously) and the program will prompt you for the required information.
    When it asks you for additional groups, be sure to use the *up* arrow on your
    keyboard to display available groups. Accepting the default is for our purposes.


    Once complete, you can log out completely using the exit command and log back
    in as a normal user.


    # The Super User


    So, we''ve established that we need to run our system as a normal user. If Linux
    gives you an error message "Permission denied", then in all likelihood you need
    to be *root* to execute the command or edit the file, etc. You do not have to
    log out and log back in as *root* to do this. Just use the **su** command to give
    yourself root permissions (assuming you know root password). Enter the password
    when prompted. You now have root privileges (the system will prompt you with this).
    When you are finished using your su login, return to your original login by typing
    *exit*. Here is a sample su session:


    ```

    root@forensic1:~# barry@slackforensics:~$ whoami

    barry

    ```


    ```

    barry@forensic1:~$ su - /sbin/fdisk -l /dev/sda

    fdisk: cannot open /dev/sda: Permission denied

    ```


    ```

    barry@forensic1:~$ su -

    Password:

    root@forensic1:~# whoami

    root

    ```


    ```

    root@forensic1:~# /sbin/fdisk -l /dev/sda

    Disk /dev/sda: 20 GiB, 2147836480 bytes, 41943040 sectors

    Units: sectors of 1 * 512 = 512 bytes

    ```'
