    -A INPUT -i eth0 -p tcp -m tcp --dport 22 --tcp-flags FIN,SYN,RST,ACK SYN -m

    conntrack --ctstate NEW -j ACCEPT

    -A OUTPUT -o lo -j ACCEPT

    -A OUTPUT -o eth0 -j ACCEPT

    ```


    Here we see the default policies (-P) are set to DROP and we have several rules
    in

    chain. The lines starting with -A signify that we are applying a rule to our chain.
    Note

