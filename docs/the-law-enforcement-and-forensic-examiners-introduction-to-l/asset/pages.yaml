  md: '# A Comprehensive Beginner''s Guide to Linux as a Digital Forensic Platform


    # Making a List of File Types


    What if you are looking for JPEGs but the name of the file has been changed, or
    the extension is wrong? You can also run the command file on each file and see
    what it might contain. As we saw in earlier sections when looking at file systems,
    the file command compares each file''s header (the first few bytes of a raw file)
    with the contents of the "magic" file. It outputs a description of the file.


    Remember our use of the find command''s -exec option with shalsum? Let''s do the
    same thing with:


    ```

    barry@forensic1:/mnt/evid$ find -type f -exec file {} \; > ~/analysis/filetype.txt

    ```


    This creates a text file with the output of the file command for each file that
    the find command returns. The file is in ~/analysis/filetype.txt. Viewing the
    list with the cat command (or less). I separated the file entries below for readability:


    ```

    barry@forensic1:/mnt/evid$ cat -analysis/filetype.txt

    /Docs/Benchmarks.xls: Composite Document File V2, Little Endian, Os: Windows,
    Version 4.10, Code page: 1252, Author: Barry J. Grundy, Last Saved By: Barry J.
    Grundy, Name of Creation Application: Microsoft Excel, Create Time/Date: Sat 9
    19:53:35 1999, Security: 0

    ```


    ```

    /Docs/Computer.Build.xml: zip compressed data, from Unix

    /Docs/Law.doc: Composite Document File V2, Little Endian, Os: Windows, Version
