    \ that may be needed for software compilation.\n- Installation Configuration\n\
    \  - Boot Method (The boot loader, ..selects the OS to boot)\n    - Be mindful\
    \ of EFI vs. legacy BIOS options. Where possible, set the BIOS to legacy mode.\n\
    \  - LILO or GRUB.\n    - LILO is the default for Slackware. Find GRUB is more\
    \ flexible and secure. GRUB can be installed, if you like. Personally, I prefer\
    \ LILO.\n    - Usually select the option to install LILO to the master boot record\
    \ (MBR). The presence of other loaders (provided by other operating systems) determines\
    \ where to install LILO or GRUB.\n    - If you use EFI, skip this and install\
    \ elio or GRUB manually. You should read README_UEFLTXT on the install media's\
    \ root directory beginning the installation process.\n    - The boot loader contains\
    \ the code that points to the kernel to be booted.\n- Create a user name for yourself\
    \ – avoid root exclusively.\n- For more information, check the file CHANGES_AND_HINTS.\
    \ TX on the install media. This file is loaded with useful hints and changes of\
    \ interest from one release to another.\n\n# System Users\n\nLinux is a multi-user\
    \ system. It is designed for use on networks (remember, it is based on Unix).\
    \ The root is the system administrator, and is created by default installation.\
    \ Exclusive use of the root is DANGEROUS. Linux assumes that root knows what he\
    \ is and doing and allows \"root\" to do anything he she wants, destroying the\
    \ system. Do not log in as root unless you must. Having said this, some of the\
    \ work for forensic analysis will be done as root to allow access to devices and\
    \ system commands.\n\n# Adding a Normal User\n\nForensic analysis, most notably\
    \ acquisitions, and basic system administration will normally require root permissions.\
    \ By simply logging in as root and conducting your analysis, particularly from\
