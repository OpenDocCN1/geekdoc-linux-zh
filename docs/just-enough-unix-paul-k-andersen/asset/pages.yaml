- pgno: 13
  md: '# Bits, Bytes, Hertz, MIPS, and Flops


    Computer memory is usually measured in bits and bytes. *Bit* is short for *binary
    digit*; a *bit* can store either a 0 or a 1. *A byte* is a grouping of eight bits;
    a byte can store a single character. The following prefixes are used to express
    larger quantities:


    +   - kilo- (K) "thousand" ($10^3$)

    +   - mega- (M) "million" ($10^6$)

    +   - giga- (G) "billion" ($10^9$)


    Thus, 1 megabyte (Mbyte or MB) is approximately 1 million bytes of memory. A million
    bytes can hold a million characters, or about 500 typewritten pages of text.


    A CPU may be rated by the number of bits it can process at a time. For example,
    a 32-bit CPU manipulates 32 bits at a time. Another way to say this is that the
    CPU has a 32-*bit word size*.


    The rate at which words are processed by a CPU is determined by the *clock speed*.
    The *clock speed* is expressed in *megahertz* (*MHz*); 1 *megahertz* = 1 million
    pulses per second. Other things being equal, CPUs with larger word sizes and higher
    clock speeds are faster.


    A computer''s speed is sometimes expressed in terms of the number of arithmetic
    operations it can perform in a second. This is measured in *flops*, which is short
    for *floating-point operations per second*. Alternatively, a computer''s speed
    may be expressed by the number of *instructions* it can execute in a second. This
    is measured in *MIPS*, which is short for *millions of instructions per second*.


    > Sometimes these prefixes are meant as approximations—see Exercise 6.


    # ### 1.2 One User or Many?


    The computer represented in Figure 1–1 is a *single-user* computer, also called
    a *personal computer* or *workstation*. It has one keyboard and one video display,
    and is intended to serve just one person at a time. This is a common arrangement
    with smaller computers.


    Large computer systems, on the other hand, often have more power than one person
    can profitably use. These computers are commonly set up as *multiuser systems*,
    as depicted in Figure 1–2. Note that the multiuser computer has the same four
    basic parts as the single-user computer: CPU, main memory, mass storage, and input/output
    devices. (The *I/O* devices shown in Figure 1–2 are *terminals*, which consist
    of a keyboard and a video monitor.)


    > Workstations are more powerful than the typical personal computer.'
  merge: -1
  img_proc: true
