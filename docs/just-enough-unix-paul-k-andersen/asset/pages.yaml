  md: "![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_281_0.png)\n\n```\n```c\n/* Compute\
    \ reciprocals */\n#include <stdio.h>\n\nmain()\n{\n    int n, recip;\n    printf(\"\
    This program computes reciprocals.\\n\");\n    printf(\"Enter a number: \");\n\
    \    scanf(\"%d\", &n);\n    recip = 1/n;\n    printf(\"The reciprocal of %d is\
    \ %d.\\n\", n, recip);\n}\n```\n```\n\nThis program introduces a few new features\
    \ that were not in the previous program:\n\n+   - `int n, recip;`\n+     This\
    \ is a **declaration**. It tells the compiler to create two variables to hold\
    \ integers (`int`) and to give them the names `n` and `recip`. C requires that\
    \ you declare all variables before you use them.\n+   - `scanf(\"%d\", &n);`\n\
    +     `scanf()` is a standard C library function, used to get input from the standard\
    \ input. In this example, the function takes two arguments, `\"%d\"` and `&n`.\
    \ The first argument (`\"%d\"`) is called a *control string*; it tells the compiler\
    \ about the format of the input. In this case, the format specification `%d` stands\
    \ for a single decimal integer. The second argument (`&n`) tells `scanf()` to\
    \ store the integer that it reads in the variable `n`. The ampersand (`&`) is\
    \ the address operator; it is required in this context.\n+     \n+     > A common\
    \ mistake is to omit the address operator `&`.\n+   \n+   - `recip = 1/n;`\n+\
    \     This is how we compute the reciprocal. The computer first divides the integer\
    \ 1 by the contents of the variable `n`, and then assigns the result to the variable\
    \ `recip`. In C, `=` is called the **assignment operator**; it tells the compiler\
    \ to take the value of the expression on the right and assign it to the variable\
    \ on the left.\n+   - `printf(\"The reciprocal of %d is %d.\\n\", n, recip);`\n\
    +     This is another `printf()` function call, with a difference. There are three\
    \ arguments this time instead of one. The first argument is a string containing\
    \ two formats (`%d` and `%d`). The other two arguments are variables (`n` and\
    \ `recip`). The `printf()` function prints out the string, substituting the contents\
    \ of `n` and `recip` for the two formats."
