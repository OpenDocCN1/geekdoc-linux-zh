  md: '# 9.13  Command Summary


    | Counting Lines, Words, and Characters |

    | --- | --- |

    | wc file(s) | count lines, words, and characters in file(s) |

    | wc -l file(s) | count the lines in file(s) |

    | Searching | |

    | grep pattern file(s) | print line(s) in file(s) containing pattern |

    | grep -n pattern files(s) | as before, but print line numbers as well |

    | grep -l pattern files(s) | print the name of any file containing pattern |

    | grep -v pattern file(s) | print line(s) not containing pattern |

    | Sorting | |

    | sort file(s) | sort file(s) observing usual collating sequence |

    | sort -b file(s) | sort, ignoring leading blanks |

    | sort -f file(s) | sort, converting lowercase to uppercase |

    | sort -n file(s) | sort numerically |

    | sort -r file(s) | reverse sort (9 before 0, Z before A, etc.) |

    | sort +n file(s) | sort on field n + 1 (skip n fields) |

    | Sleeping | |

    | sleep n | sleep n seconds |

    | Foreground and Background Processing | |

    | ^C | interrupt (kill) a foreground process |

    | ^D | generate end-of-file signal |

    | ^Z | stop (suspend) a foreground process |

    | command & | run command in background |

    | ps | obtain process status |

    | kill n | terminate background process n |

    | Job Control | |

    | bg %n | move job n to background |

    | fg %n | move job n to foreground |

    | jobs | list status of all jobs |

    | kill %n | kill job n |'
