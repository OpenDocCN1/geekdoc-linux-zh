  md: '# 16.6 Ending the ftp Session


    Once you have finished working on the remote host, you should end the ftp session.


    +   * **Quit the ftp program**. Enter quit at the ftp prompt:


    ```

    ftp> quit `Return`


    ```


    You will see a UNIX shell prompt:


    ```

    $

    ```


    # 16.7 A Shortcut Method


    There is a quicker way to run an ftp session:


    +   1. **Enter the ftp command, followed by the Internet address of the remote
    machine**. Thus, if you had an account on the host farhost.xyz.edu, you would
    type

    +      $ ftp farhost.xyz.edu `Return`


    +   2. **Log into your remote account as usual**. This will require that you enter
    your login and password at the appropriate prompts.


    +   3. **When finished, close the connection using the quit command**. `ftp>`
    quit `Return` This will log you out and quit ftp. You should see a UNIX shell
    prompt:


    ```

    $

    ```


    # 16.8 Getting Files with Anonymous ftp


    Originally, ftp was intended to allow you to transfer files between two computers
    on which you have accounts. However, anonymous ftp allows you to get files from
    hosts on which you do not have an account. These hosts are called public ftp servers.


    For example, the Internet Network Information Center—known as InterNIC—is a joint
    operation of AT&T, General Atomics, and Network Solutions, Inc., that serves as
    a central clearinghouse for information on the operation of the Internet. InterNIC
    offers a wealth of information that you can obtain by anonymous ftp.


    +   1. **Start the ftp program and specify the server you want**. For example,
    to gain access to InterNIC''s public ftp server ds.internic.net, you would enter
    the command

    +      $ ftp ds.internic.net `Return`'
