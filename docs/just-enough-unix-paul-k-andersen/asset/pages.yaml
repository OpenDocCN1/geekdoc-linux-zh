  md: '# 22


    # Tutorial: Using csh

    Startup Files


    If you use the C Shell (csh) as your login shell, your login initialization file
    will be named `.login`, and your shell initialization file will be named `.cshrc`.
    In this chapter, you will learn how to make and modify these files.


    # 22.1 Listing the Environment Variables


    +   * List the current settings of the environment variables. This is done with
    the `setenv` command, used without arguments:

    +     ```

    +     % setenv

    +     ```

    +     The shell will display a list of variables and their current settings. Some
    variables you might see include the following:


    | **Variable** | **Contents** |

    | :----------- | :----------- |

    | HOME        | Pathname of your home directory     |

    | MAIL        | Pathname of your system mailbox      |

    | PATH        | Directories where shell is to look for commands |

    | Pwd         | Your current working directory        |

    | SHELL       | Pathname of shell (/bin/csh)        |

    | TERM        | The termcap code for your terminal   |

    | USER        | Your user name                       |


    You can examine the values of these variables one at a time using the `echo` command.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "# Using CSH STARTUP FILES\n\n# 22.2 Checking the Special csh Variables\n\n\
    +   1.  **Enter the `echo` command, specifying the variable you wish to examine.**\n\
    +   You must enter a dollar sign ($) as a prefix to the variable name. Thus, to\
    \ view the contents of the `SHELL` variable, type\n+   \n+       `% echo $SHELL\
    \ (Return)`\n+   \n+   This will display the absolute pathname of `csh`:\n+  \
    \ `/bin/csh`\n+   If you omit the dollar sign prefix, *the name* of the variable,\
    \ not its contents, will be displayed:\n+   `% echo SHELL (Return)`\n+   `SHELL`\n\
    \n# 22.2 Checking the Special csh Variables\n\nThe C Shell uses the same environment\
    \ variables as the Bourne Shell and Korn Shell, but it also has some special shell\
    \ variables of its own. You can check the settings of these variables using the\
    \ `set` command.\n\n+   1.  **Enter the `set` command without arguments.**\n+\
    \   \n+       `% set (Return)`\n+   \n+   This will list the special shell variables\
    \ and their current settings. For example:\n\n| Variable | Contents |\n|---|---|\n\
    | `cwd` | Pathname of current working directory |\n| `history` | Size of history\
    \ list |\n| `home` | Pathname of your home directory |\n| `path` | Directories\
    \ where shell is to look for commands |\n| `prompt` | Current prompt symbol (default:\
    \ %) |\n| `shell` | Pathname of shell (`/bin/csh`) |\n| `term` | The termcap code\
    \ for your terminal |\n| `user` | Your user name |\n\nNote that the `csh` special\
    \ variables are written in lowercase letters to distinguish them from the environment\
    \ variables.\n\n> These special shell variables are used only by csh, not by sh\
    \ or ksh."
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 22.3  Setting the Special csh Variables


    The set command is used to assign a value to a variable.


    +   1.  **Enter the set command.** For example, to set the value of the history
    variable, type the following:

    +       % set history = 100 `<Return>`

    +   2.  **Check the setting with echo.**

    +       % echo $history `<Return>`

    +       This should show the value stored in history:

    +       100


    The special csh variables home, path, shell, term, and user have a special relationship
    with their uppercase counterparts. When you change the value of the lowercase
    variable, the uppercase variable is changed as well. If you change the value of
    term, for example, the value of TERM is changed automatically to match.


    # 22.4  Making Backups of the Startup Files


    The first step in creating or editing .login or .cshrc is to see whether you already
    have such files. If so, you should prepare backup copies.


    +   1.  **If necessary, go to your home directory.** Remember, the cd command
    without arguments will take you to your home directory:

    +       % cd `<Return>`

    +   2.  **List all files in your home directory.** Enter the ls -a (“list -all”)
    command:

    +       % ls -a `<Return>`

    +       If you see files named .login and .cshrc, these were probably placed in
    your home directory when your account was created. You may want to consult with
    your instructor or system administrator before editing them.

    +   3.  **Make a backup copy of the existing startup file(s).**

    +       % cp .login .login.BAK `<Return>`

    +       % cp .cshrc .cshrc.BAK `<Return>`


    # 22.5  A Login Message


    In this section you will create a .login file (or edit an existing file) to display
    a message on the screen every time you log in. You will use the echo command to
    do this.'
  merge: -1
  img_proc: true
