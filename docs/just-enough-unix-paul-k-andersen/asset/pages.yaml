  md: 'You are not limited to using a single asterisk. For instance, the command

    `$ ls *ack*` [Return]

    will list file names that contain the sequence of letters *ack*:


    backgammon backpacking blackjack track


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_100_0.png)


    The asterisk wildcard is very powerful, and must be used with care. The following
    command, for example, can erase all of the files in the current directory:

    `$ rm *` [Return]


    +   - The question mark matches a single character.


    The question mark (\`?\`) wildcard matches just one character at a time. For example,

    `$ ls ?iking` [Return]

    biking hiking


    +   - The brackets specify the character(s) to match.


    The square brackets `[ ]` are used to instruct the shell to match any characters
    that appear inside the brackets. For example

    `$ ls team[ABXYZ]` [Return]

    teamA teamB teamX teamY teamZ


    You can also indicate a range of characters, rather than list each character:

    `$ ls team[1-4]` [Return]

    team1 team2 team3 team4


    You can combine the wildcards \`\*\`, \`?\`, and \`[ ]\`. Suppose you wanted to
    list all of the files in the directory Fun that begin with the letters *a*, *b*,
    or *c*. This command will do the trick:

    `$ ls [abc]*` [Return]


    The bracketed letters tell the shell to look for any file names that have *a*,
    *b*, or *c* at the beginning. The asterisk matches any other sequence of letters.
    The result is the list


    backgammon backpacking baseball basketball biking blackjack

    boxing bridge camping canoeing checkers chess crossword


    Likewise, to list all of the files having names that end with any letter from
    *m* through *z*, you could use the command

    `$ ls *m-z]` [Return]


    The asterisk matches any sequence of characters; the brackets match only letters
    from *m* through *z* that appear at the end of the file name.


    backgammon checkers chess hearts'
