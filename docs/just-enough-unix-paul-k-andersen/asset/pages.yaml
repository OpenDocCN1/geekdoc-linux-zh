    # ### 8.6 Grouping Commands


    Normally you type one command at a time, following each command by a (Return),
    which is the signal for the shell to begin its work. However, it is possible to
    put multiple commands on the same line, if you separate the commands with semicolons.
    Thus the command line


    ```

    $ who; ls; cal (Return)

    ```


    has the same effect as the three separate command lines


    ```

    $ who (Return)

    $ ls (Return)

    $ cal (Return)

    ```


    Grouping commands can be especially useful when you want to redirect the output
    into a file. You could make a calendar for the summer of 1999 in three steps:


    ```

    $ cal 6 1999 > summer99 (Return)

    $ cal 7 1999 >> summer99 (Return)

    $ cal 8 1999 >> summer99 (Return)

    ```


    You could accomplish the same thing with just one line:


    ```

    $ (cal 6 1999; cal 7 1999; cal 8 1999) > summer99 (Return)

    ```


    Note the parentheses; these are necessary to make sure the calendars for June,
    July, and August are all redirected into the same file. Suppose you were to omit
    the parentheses, like this:


    ```

    $ cal 6 1999; cal 7 1999; cal 8 1999 > summer99 (Return)

    ```


    In this case, the calendars for June and July would appear on the screen, and
    only the August calendar would be redirected into the file.


    # ### 8.7 Pipes


    Suppose you wanted to display the calendars for the years 1999, 2000, and 2001,
    one right after the other. You could type the command line


    ```

    $ cal 1999; cal 2000; cal 2001 (Return)

    ```'
