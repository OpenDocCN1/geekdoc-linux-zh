- pgno: 139
  md: '# 12.3 Finding Text


    The vi editor can locate particular words or groupings of characters anywhere
    in the file. This is useful when correcting spelling errors. For example, spell
    identified the misspelled word Delicious in the file poems.


    +   Open the file if it is not already open. Suppose you want to correct the misspelled
    words in the file poems. Type


    ```

    $ vi poems (Return)

    ```


    +   If necessary, put vi into the command mode.


    +   Type a slash (/) followed by the word or characters you want to find. Note
    that when you type the slash, the cursor jumps to the bottom of the screen:


    ```

    /Delicious (Return)

    ```


    When you press (Return), the cursor will move to the place where the word is located.
    You may then use vi’s editing commands to edit the text.


    +   To search for further occurrences of the same word or characters, return to
    the command mode and type a slash. There is no need to enter the word again:


    ```

    (Esc) / (Return)

    ```


    When vi can find no other instances of this word, it will tell you so:


    ```

    Pattern not found

    ```


    +   To search backward through a file from the current cursor location, use a
    question mark (?):


    ```

    (Esc)?wittle (Return)

    ```


    This will find one of the occurrences of the word wittle. To check for the next
    occurrence, type


    ```

    (Esc)? (Return)

    ```


    # 12.4 Global Substitution


    The forward search (/) and backward search (?) commands provide a quick way to
    find an error in a file. Once you have found the error, you can use the vi editor
    commands to make the necessary change. Although this approach works well if there
    are only one or two such changes to make, it is even faster to make the changes
    using the Global Substitution command.'
  merge: -1
  img_proc: true
