- pgno: 169
  md: '# Useful—and Quaint—Mail Conventions


    Although convenient, electronic mail lacks the expressive power of printed text
    or the spoken word. E-mail does not allow you to use **bold** or *italic* type
    for emphasis, or to indicate irony or sarcasm by vocal inflection.


    It is common practice to USE CAPS FOR EMPHASIS. (But be careful—EXCLUSIVE OR INDISCRIMINANT
    USE OF CAPS MAKES THE TEXT HARD TO READ.) Another way to emphasize text is to
    put it between asterisks *\*like this\**.


    Many people use *smileys* or *emoticons*, groups of characters are meant to suggest
    a face when viewed from a $90^{o}$ angle. For example, :-) represents a smiling
    face, and is often used as a way to say “just kidding.” Several of the more common
    smileys—there are hundreds of others—are listed below:


    +   -  -:)  Smile (indicates humor or irony)

    +     -  ;-)  Wink (sly humor or irony)

    +     -  :-(  Frown (sadness)


    Smileys should be used with caution (if at all) because some recipients may find
    them annoying.


    Finally, people in a hurry often abbreviate certain phrases to save typing. Here
    is a sampling of common e-mail abbreviations:


    +   -  BTW  By the way

    +     -  FAQ  Frequently Asked Questions

    +     -  FAQL  Frequently Asked Questions List

    +     -  FOAF  Friend of a friend

    +     -  FYA  For your amusement

    +     -  FYI  For your information

    +     -  IMHO  In my humble opinion

    +     -  IMO  In my opinion

    +     -  MOTAS  Member of the appropriate sex

    +     -  MOTOS  Member of the opposite sex

    +     -  WRT  With respect to


    As with smileys, these abbreviations should be used with care. They are acceptable
    for informal messages, but should be avoided otherwise.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 14.15 Command Summary


    Some of the commands discussed in this chapter are UNIX shell commands, others
    work only within mail or mail. All of these commands must be terminated by a (Return).


    # Reading Mail in Your Mailbox (UNIX shell commands)


    +   mail list e-mail messages received (Berkeley UNIX)

    +   mailx list e-mail messages received (AT&T UNIX)


    # Reading Mail in Your mbox File (UNIX shell commands)


    +   mail -f list messages stored in mbox file (Berkeley UNIX)

    +   mailx -f list messages stored in mbox file (AT&T UNIX)


    # Deleting, Saving and Replying (Mail or mailx command)


    +   dn delete message number n

    +   sn file save message number n in file

    +   Rn Reply to the sender of message number n

    +   rn same as Rn, but also sends reply to everyone who received the original
    message


    Note that R and r may have the reverse effects on some systems.


    # Sending Mail (UNIX shell commands)


    +   mail jdoe send message to user jdoe (BSD UNIX)

    +   mailx jdoe send message to user jdoe (AT&T System V UNIX)


    # Mailing a File (UNIX shell commands)


    +   mail jdoe < file mail file to user jdoe (BSD UNIX)

    +   mailx jdoe < file mail file to user jdoe (AT&T System V UNIX)


    # Editing a Message Using vi (Mail or mailx tilde escapes)


    +   ~v call up vi program to edit current message


    # Identifying a User


    +   finger user get the real name of the user with login user'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# ### 14.16  Exercises


    +   1.  Find someone with an account on your computer (or on the same network)
    and practice using `mailx` or `Mail` to exchange messages.

    +   2.  As you have seen, the s ("save") command is used inside the mail program
    to append a message to a file. The w ("write") command also appends messages to
    files. Mail yourself a message, then use the w command to put it into a file.
    Exit the mail program and examine the contents of the new file. What is the difference
    between w and s?

    +   3.  The mail S ("save") command will save a mail message in a file that has
    the same name as the sender’s login. (If such a file already exists, the message
    will be appended to the file.) Try out the S command.

    +   4.  The mail programs `mailx` and `Mail` make use of so-called *tilde escapes*.
    These are mail commands that begin with a tilde (~). You have seen how to use
    the tilde escape sequence `~v` to edit a message using the `vi` editor. Find out
    about other tilde escapes. Start up the mail program as if you were going to send
    a message. However, instead of typing a message, enter the tilde escape sequence
    `~?` (**Return**) to display a list of the tilde escapes. What do the following
    tilde escapes do?

    +       - `~p`

    +       - `~h`

    +       - `~q`

    +       - `~r`

    +       - `~S`

    +       - `~x`

    +   5.  You have seen how to mail a file using the redirection operator on the
    command line. Thus, to send the file `myfile` to the user `fred@host`, you would
    type

    +       ```

    +       $ Mail fred@host < myfile(Return)

    +       ```

    +       or

    +       ```

    +       $ mailx fred@host < myfile(Return)

    +       ```

    +       When `fred` receives the message, it will not have a subject. You can
    remedy this using the `-s` ("subject") option, like this:

    +       ```

    +       $ Mail -s "This is the subject" fred@host < myfile(Return)

    +       ```'
