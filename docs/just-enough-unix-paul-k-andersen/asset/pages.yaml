  md: '# 8 UNIX SHELL


    The *shell* is the UNIX command processor. When you type a command and press **Return**,
    it is the shell that interprets the command and takes the appropriate action.
    In this chapter, you will see how the shell works, and how you can make it work
    better for you.


    # 8.1 Your Login Shell


    There are three common UNIX shells available on most systems: the Bourne Shell
    (abbreviated sh), the C Shell (csh), and the Korn Shell (ksh). When your UNIX
    account was created, the system administrator selected a shell for you. This is
    called your *login shell*, because this is the shell you use each time you log
    in.


    Once you have worked with the various shells available on your system, you may
    decide to change your login shell. On some systems, you can do this yourself using
    the cshsh (“change shell”) command; on others, the system administrator must make
    the change for you.


    # 8.2 How the Shell Processes Commands


    The entire process can be summarized this way:


    +   1. **The shell displays a prompt symbol on the screen.** The prompt tells
    you the shell is ready to receive your commands.

    +   2. **You type in a command.** As you type, the shell stores the characters
    and also echoes them back to the terminal screen.

    +   3. **You type Return.** This is the signal for the shell to interpret the
    command and start working on it.

    +   4. **The shell looks for the appropriate software to run your command.** In'
