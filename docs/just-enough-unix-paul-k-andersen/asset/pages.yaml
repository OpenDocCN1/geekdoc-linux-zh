  md: '# 12.10 Command Summary


    You must press (**Return**) after a **spell** command and after each vi command
    that begins with a slash (`/`), question mark (`?`), or colon (`:`). None of the
    other commands listed here requires a (**Return**).


    # **Check Spelling (UNIX shell commands)**


    +   - **spell file**

    +       - list misspelled words found in **file**

    +   - **look word**

    +       - look for **word** in UNIX word list

    +   - **look pre**

    +       - look for words in UNIX word list beginning with **pre**


    # **Search for Word (vi command)**


    +   - **/word**

    +       - search forward through the file for the first occurrence of **word**

    +   - **/**

    +       - continue search for the next occurrence of **word**

    +   - **?word**

    +       - search backward for the first occurrence of **word**

    +   - **?**

    +       - continue search backward for the next occurrence of **word**


    # **Jump to Line (vi command mode)**


    +   - **n+**

    +       - jump forward (down) **n** lines

    +   - **n-**

    +       - jump backward (up) **n** lines

    +   - **nG**

    +       - Go to line number **n**

    +   - **G**

    +       - Go to the bottom of the file


    # **Line Numbers (vi command mode)**


    +   - **:set nu**

    +       - set line numbers on the screen

    +   - **:set nonu**

    +       - remove line numbers


    # **Yank and Put (vi command mode)**


    +   - **"knyy**

    +       - yank (copy) **n** lines into buffer "**k**

    +   - **"kp**

    +       - put the contents of buffer "**k** below the current line


    # **Substitute (vi command mode)**


    +   - **:\$s/old/new/g**

    +       - replace **old** by **new** everywhere in the file


    # **Edit Another File (vi command mode)**


    +   - **:e file**

    +       - edit **file**'
