    +   3. Refer to the Handbook to determine how to use Netscape to read electronic
    mail and network news.

    +   4. Refer to the Handbook to determine the functions of the Find, Reload, and
    Images buttons.

    +   5. Try out Netscape’s “What’s New” and “What’s Cool” buttons. What do these
    buttons do?

    +   6. *PC Magazine* maintains a list of Top 100 Web Sites, as chosen by their
    editors. Examine the list at http://www.pcmag.com.'
  merge: -1
