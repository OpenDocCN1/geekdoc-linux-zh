    # # 6.11 Printing on Other Printers


    If your computer system has more than one printer attached to it, the simple line
    printer command used in the previous section will send your files to the default
    printer. You can specify another printer with the -P or -d option. To do this,
    you first have to know the code for the printer you are to use; ask your instructor,
    consultant, or system administrator.


    +   •  Enter the line printer command and specify the printer and the file to
    be printed. On Berkeley UNIX you would type the following command, making sure
    to insert the proper printer code in place of code:


    ```

    $ lpr -Pcode 1999 (RETURN)

    ```


    Note that there is a space before the -P and before the file name, but not between
    the -P and the printer code.


    On AT&T UNIX, you would type the following command, inserting the printer code
    in place of code:


    ```

    $ lp -dcode 1999 (RETURN)

    ```


    Here again, there is a space before -d and before the file name, but not between
    the -d and the printer code.


    # # 6.12 Removing Unneeded Files


    When a file is no longer useful, you should remove it so that it won''t take up
    valuable storage space. This is done with the rm ("remove") command, which takes
    the pathname of the file to be removed. Since you probably don''t need two copies
    of the summer 1999 calendar, remove one of them.


    +   1  **Use the ls command to check the file name.** Since on many systems you
    cannot retrieve a file once it has been removed, it is a good idea to be sure
    of the file name:


    ```

    $ ls (RETURN)

    ```


    ```

    1999 august99 july99 june99 summer99 vacation99

    ```


    +   2  **Type rm, followed by the file''s pathname.** To remove vacation99, type
    the command line


    ```

    $ rm vacation99 (RETURN)

    ```


    +   3  **Verify that the file is gone.** UNIX does not tell you that the file
    has been removed, so you will have to check this yourself using the ls command:'
