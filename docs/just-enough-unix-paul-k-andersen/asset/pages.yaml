  md: '**EDITING WITH VI**


    *11.6 Writing the File and Quitting the Editor*


    # ### 11.6 Writing the File and Quitting the Editor


    If you want to save the changes you have made to the work buffer, you must “write”
    these changes into the file. (Remember, the editor always works on a copy of the
    file.)


    +   1. **Put vi into the command mode.** Press the ESC key.


    +   2. **To save your work, write the changes into the file.** From the command
    mode, press the colon (:) key, then the *w* key. Note that when you press the
    colon, the cursor jumps to the bottom of the screen:


    This appears at the bottom of the screen.


    ```

    :w Return

    ```


    The editor will show you how many lines and characters were written to the file:


    ```

    "poems" 4 lines, 66 characters

    ```


    Note that the cursor returned to the last character you typed. This will allow
    you to continue editing the file, if you wish.


    +   3. **If you are finished with the file, quit the editor.** This is done using
    the “quit” command.


    ```

    :q Return

    ```


    The computer will answer with the shell prompt to let you know you are out of
    vi and back in the UNIX shell:


    ```

    $

    ```


    If you try to quit the file without saving your changes, the computer will respond
    with the message


    ```

    No write since last change (:! overrides)

    ```


    At times, you may decide not to save the changes you have made. In that case,
    do not write the changes into the file, but enter the command


    ```

    :q! Return

    ```


    # ### 11.7 Appending Text


    In this section, you will see how to add text to the file using the a (“append”)
    command.


    +   1. **If the file is not already open, reopen it.** To edit the file *poems*,
    type


    ```

    $ vi poems Return

    ```'
