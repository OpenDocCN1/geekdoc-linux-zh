- pgno: 47
  md: '![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_47_0.png)


    You may have to experiment to discover how the buttons work on your mouse.


    +   - **Left Button (Button #1).** The left button is generally used for command
    selection and activation. This includes pulling down menus, selecting menu items,
    moving windows, and pressing on-screen buttons.

    +   - **Middle Button (#2).** On some systems, this button is used to grab and
    manipulate window scroll bars.

    +   - **Right Button (#3).** This button has traditionally been used to obtain
    pop-up menus.


    There are three ways to activate a mouse button:


    +   - **Click.** Press and quickly release the button.

    +   - **Double-click.** Press and release the button twice in rapid succession.

    +   - **Drag.** Press and hold the button while moving the mouse.'
