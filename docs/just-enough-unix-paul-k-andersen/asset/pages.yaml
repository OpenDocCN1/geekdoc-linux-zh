  md: '# WORKING WITH THE SHELL


    9.6 Using sort


    > The sorting order is also called the *collating sequence*.


    This may appear strange until you understand the sorting order that the **sort**
    utility employs. This varies from system to system, but the following is typical:


    +   1. Control characters

    +   2. White space (i.e., blanks and tabs)

    +   3. Numerals

    +   4. Uppercase letters

    +   5. Lowercase letters


    You can apply various options to modify the sorting order. Here are just a few
    possibilities:


    +   - **sort -b**    Ignore leading blanks

    +   - **sort -f**    Fold upper- and lowercase letters together (ignore case)

    +   - **sort -n**    Numeric sort

    +   - **sort -r**    Reverse usual order (e.g., Z precedes a)


    * **Sort on the first field, ignoring leading blanks and case.** Specifying a
    field offset of +0 will cause sort to examine the first field of each line:


    ```

    $ sort -bf +0 *.tmp<Return>

    /home/yourlogin

    1

    16 17 18 19 20 21 22

    2 3 4 5 6 7 8

    23 24 25 26 27 28 29

    30 31

    9 10 11 12 13 14 15

