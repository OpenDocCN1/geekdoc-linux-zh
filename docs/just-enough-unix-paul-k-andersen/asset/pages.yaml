- pgno: 217
  md: '# # 20 STARTUP FILES


    A startup file contains commands for the shell to execute when it begins running.
    Startup files greatly increase the convenience and flexibility of the shell by
    performing routine tasks such as setting up your terminal, customizing the shell
    prompt, and reminding you of upcoming events.


    # ## 20.1 Login and Shell Initialization Files


    There are two types of startup files. A login initialization file contains commands
    that are executed when you first log in. If your login shell is the Bourne Shell
    (sh) or Korn Shell (ksh), this file will be called .profile; if your login shell
    is the C Shell (csh), it will be called .login.


    The second type of startup file is the shell initialization file, which contains
    commands that are executed when a new ksh or csh process is started. This happens
    when you log in if you are using ksh or csh as your login shell. It also happens
    whenever you start ksh or csh as a subshell. Recall that you can run ksh as a
    subshell simply by entering the command line


    ```

    $ /bin/ksh (Return)

    ```


    When you do this, the new ksh shell process looks for commands in a file named
    .kshrc.


    Likewise, you can run csh as a subshell with the command line


    ```

    $ /bin/csh (Return)

    ```


    The new csh process looks for commands in a file named .cshrc.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# STARTUP FILES


    # 20.2 Startup Files Thus Far


    # Control Files


    Note that the various startup files are hidden files—their names begin with a
    period (...)—meaning that they will not be listed by the simple `ls` command.
    Most hidden files are used to control the way the system works. For this reason,
    they are sometimes called *control files*. Some of the more common control files
    are listed below, along with a description of their contents:


    +   - `.cshrc`    Commands to be run when a new shell starts up (*csh* only)

    +   - `.exrc`    Settings for `vi` editor

    +   - `.forward`    Addresses to which e-mail is forwarded

    +   - `.kshrc`    Commands to be run when a new shell starts up (*ksh* only)

    +   - `.login`    Commands to be run when you log in (*csh* only)

    +   - `.logout`    Commands to be run when you log out (*csh* only)

    +   - `.mailrc`    Mail aliases

    +   - `.mwmrc`    Commands to configure the Motif Window Manager (*mwm*)

    +   - `.newsrc`    List of newsgroups and messages read

    +   - `.plan`    Information displayed by `finger` command

    +   - `.profile`    Commands to be run when you log in (*sh* & *ksh*)

    +   - `.xinitrc`    Commands to configure the X Window System


    Remember too that a subshell is sometimes started for you by the login shell.
    For instance, when you run your own program or shell script, the login shell actually
    calls up a subshell to run the program. The same thing happens when you group
    several commands together using parentheses. In either case, the new subshell
    executes the commands it finds in the `.kshrc` or `.cshrc` file.


    # 20.2    Startup Files Thus Far


    Let’s summarize what we have learned about startup files:


    +   - `sh` uses one startup file, named `.profile`. The shell executes the commands
    in this file only once, when you first log in.

    +   - `ksh` uses two startup files. It executes the instructions in `.profile`
    and `.kshrc` when you first log in. After that, every `ksh` subshell executes
    the commands in `.kshrc`.'
