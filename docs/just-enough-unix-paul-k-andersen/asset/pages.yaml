  md: '# **STARTUP FILES**


    20.6 Listing the Environment Variables


    If you are using either `sh` or `ksh` as your login shell, you can put instructions
    in your `.profile` for setting up the values of the shell variables. For example,
    you could set the terminal type to be a vt100 by including the following command
    line in your `.profile`:


    There are no spaces around the equals sign.


    TERM=vt100


    This line would suffice to tell the login shell that you are working on a vt100,
    but you also need to get this information to any subshells that might be created.
    To do this, you must include the `export` command in your `.profile`:


    ```

    export TERM


    This will ensure that the subshells are given the value of `TERM`. If for some
    reason you did not want the subshells to know what kind of terminal you are using,
    you could simply omit the `export` command.


    The `csh` works a bit differently. You can set the terminal type and "export"
    it all at once by putting the `setenv` ("set environment") command in your `.login`
    file:

    ```


    setenv does not take an equals sign (=).


    ```

    setenv TERM vt100

    ```


    # **20.6** Listing the Environment Variables


    There are several ways to examine the value of a standard shell variable once
    it is set. If you are using `sh` or `ksh`, the `set` command without arguments
    will list the values of all the environment variables:


    (sh or ksh)


    ```

    $ set (Return)

    ```


    If you are using `csh`, the `setenv` command will accomplish the same thing:


    (csh)


    ```

    $ setenv (Return)


    You can also view the values of the individual variables one at a time with the
    `echo` command. For example, the following command line will display the current
    value of `TERM`:

    ```


    ```

    $ echo $TERM (Return)

    vt100


    Note the dollar sign ($) preceding `TERM`; this is a special character that tells
    `echo` you want to see the *contents* of the variable `TERM`, not just its name.
    If you omitted the dollar sign, this is what you would see:

    ```


    ```

    $ echo TERM (Return)

    TERM

    ```'
