  img_proc: true
- pgno: 103
  md: 'Whichever shell you are using, it assigns a process identification number or
    PID to every process running in the background. The C Shell and Korn Shell also
    assign a job number, which is the number in brackets. A prompt then lets you know
    that the shell is ready to process another command line, even if longrun is not
    yet finished:


    $ The PID is important if you want to terminate a background job before it finishes.
    This is done with the kill command. To kill background process number 3216, for
    example, you would use the command


    $ kill 3216 (Return)


    Incidentally, some hard-to-kill processes require stronger medicine. Using kill
    with the -9 option will usually deal with them:


    $ kill -9 3216 (Return)


    # 8.13 Job Control


    All of the three common shells allow you to run processes in the background with
    the ampersand (&) and eliminate them with the kill command. In addition, the C
    Shell and Korn Shell have a capability called job control, which allows you to
    stop processes temporarily, move background processes to the foreground, and move
    foreground processes to the background.


