- pgno: 312
  md: '# # A APPENDIX:

    TAMING YOUR TERMINAL


    The *stty* ("set terminal") command allows you to set parameters that affect the
    operation of your terminal. In this appendix you will see how to use *stty* to
    perform the following tasks:


    +   *   Set your terminal to handle lowercase input.

    +   *   Define the erase key.

    +   *   Ensure that the terminal echoes your input properly.


    # ## A.1 Correcting Uppercase-Only Output


    Sometimes the system may behave as if your terminal can handle only uppercase
    letters. (This can occur if you accidentally press the "Caps Lock" key before
    logging in.) The following command will correct the problem:


    ```

    `$ STTY -LCASE <Return>`

    ```


    # ## A.2 Defining the Erase Key


    Most users expect the `Backspace` key to erase characters on the command line.
    (Others prefer to use `Delete` or `(Control)-(H)` for this.) The following command
    will make `Backspace` the character-erase key:


    ```

    `$ stty erase <Backspace> <Return>`

    ```


    The following command will set `Delete` as the character-erase key:


    ```

    `$ stty erase <Delete> <Return>`

    ```


    To set the `(Control)-(H)` key combination as the character-erase key, use the
    command line'
  merge: -1
  img_proc: true
- pgno: 313
  md: '```

    $ stty erase ^h Return

    ```


    Note that the carat (^) is used to represent the Control key.


    # A.3 Setting the Terminal Echo


    As you type characters on the keyboard, the system is supposed to echo them back
    to you on the terminal screen (except when you are entering your password). If
    what you type does not appear on the screen, you can turn on the echo using the
    following command:


    ```

    $ stty echo Return

    ```


    On the other hand, if every character is being echoed twice, you should turn off
    the echo:


    ```

    $ stty -echo Return

    ```'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# # B APPENDIX: THE UNIX MANUAL


    The UNIX system is described in detail in a massive document called the UNIX Programmers
    Manual or User''s Reference Manual, or simply the User''s Manual. Your UNIX installation
    may have a printed (paper) copy of this manual, an on-line (electronic) version,
    or both.


    The UNIX manual has the reputation of being difficult to read. It has been said
    that if you can read the manual, you do not need the manual. That is a bit of
    an exaggeration, but the manual is terse and takes some getting used to. Even
    so, it is a good idea to get familiar with the manual—it can be very useful.


    # ## B.1 Organization of the Manual


    Most UNIX manuals have eight sections:


    +   Section 1     User Commands

    +   Section 2     UNIX and C System Calls

    +   Section 3     Library Calls

    +   Section 4     Device Drivers and Special Files

    +   Section 5     File Formats and Conventions

    +   Section 6     Games

    +   Section 7     Miscellany

    +   Section 8     System Administration Commands and Procedures


    Your system''s manuals may be arranged a bit differently. (For example, it is
    not uncommon to find that some sport has deleted the games from the system.)'
  merge: -1
  img_proc: true
- pgno: 315
  md: "In addition to the usual eight manual sections, you may find supplementary\
    \ articles and technical papers describing the UNIX system. These are usually\
    \ grouped together and called something like “Documents for Use with the UNIX\
    \ System,” or “UNIX User’s Supplement,” or perhaps “UNIX Programmer’s Manual,\
    \ Volume 2.” We won’t say much about this second part of the manual—if you happen\
    \ to find a copy, you might want to browse through it to see if it contains anything\
    \ of interest to you.\n\n# ## B.2 Using the man Command\n\nIf your system has\
    \ an on-line manual, you can read it using the man command, which has the general\
    \ form\n\n```\n    $ man command (Return)\n```\n\nFor example, to read the manual\
    \ entry for the cal command, you would type\n\n```\n    $ man cal (Return)\n```\n\
    \nIf your system has an on-line manual, this command will list a man page for\
    \ cal, as shown in Listing B-1.\n\n# ## B.3 Organization of a Manual Entry\n\n\
    All manual entries follow much the same format. Let’s examine the various parts\
    \ of the entry for the cal command:\n\n+   * CAL (1)      USER COMMANDS      CAL\
    \ (1)\n\nThe first line begins and ends with the name of the command, written\
    \ entirely in caps (CAL). The number in parentheses (1) gives the section of the\
    \ manual in which this entry is found.\n\n+   * NAME\n+       cal – display a\
    \ calendar\n\nThe name and a one-line description of the command are listed next.\n\
    \n+   * SYNOPSIS\n+       cal [ [ month ] year ]\n\nThis is probably the most\
    \ useful part of the man page. It shows how the command is actually used. Anything\
    \ shown in square brackets [ ] is optional. In this case, the brackets show that\
    \ you can use the cal command either by itself, with the year only, or with the\
    \ month and year. Thus, each of the following commands would be legal:"
  merge: -1
  img_proc: true
- pgno: 316
  md: "CAL(1)              USER COMMANDS               CAL(1)\n\nNAME\n\n     cal\
    \ - display a calendar\n\nSYNOPSIS\n\n     cal [ [ month ] year ]\n\nDESCRIPTION\n\
    \n     cal displays a calendar for the specified year. If a month is also specified,\
    \ a calendar for that month only is displayed. If neither is specified, a calendar\
    \ for the present month is displayed.\n\n     year can be between 1 and 9999.\
    \ Be aware that 'cal 78' refers to the early Christian era, not the 20th century.\
    \ Also, the year is always considered to start in January, even though this is\
    \ historically naive.\n\n     month is a number between 1 and 12.\n\n     The\
    \ calendar produced is that for England and her colonies.\n\n     Try September\
    \ 1752.\n\n# **Listing B--1**\n*The manual page for the cal command.*\n\n```\n\
    ```\n$ cal[Return]\n$ cal 1999[Return]\n$ cal 5 1999[Return]\n```\n```\n\nSome\
    \ commands take various options, which are typically preceded by a hyphen. The\
    \ options will be shown here, along with the other arguments.\n\n+   - DESCRIPTION\n\
    \nNext comes a written description of the command. This description may be as\
    \ short as a paragraph, or it may go on for several pages, depending on the command."
  merge: -1
  img_proc: true
- pgno: 317
  md: '# ### B.4 Other Categories


    The manual entry for the ca\ 1 command is rather simple because the ca\ 1 command
    itself is rather simple. Entries for other commands may contain still more headings.
    Depending on the command, you may see one or more of the following:


    +   - **FILES**—Files used or created by the command are listed here under this
    heading.

    +   - **SEE ALSO**—This entry will direct you to other entries in the manual that
    are related to the current topic.

    +   - **DIAGNOSTICS**—Some UNIX commands generate error messages. The more important
    or cryptic error messages will be described under this heading.

    +   - **BUGS**—Believe it or not, some UNIX commands contain minor errors—usually
    called "bugs"—that have been identified but yet not eliminated. If you are lucky,
    such bugs will be listed here.


    # ### B.5 Reading Longer Manual Pages


    The manual entry for ca\ 1 will probably fit entirely on your screen. Other manual
    entries are too long to be shown on the typical terminal screen all at once. For
    example, try reading the manual entry describing man itself:


    ```

    ```

    $ man man (Return)

    ```

    ```


    If the entire manual entry is too long to fit on the screen, you can pipe the
    output from the man command through the more or pg utility:


    ```

    ```

    $ man man | more (Return)

    ```

    ```


    or


    ```

    ```

    $ man man | pg (Return)

    ```

    ```


    The vertical line is called the *pipe symbol*.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# # APPENDIX: STARTING X AND MOTIF


    If your system does not have a display manager that starts the X server and window
    manager automatically, you will have to start them yourself. To do this, you should
    first log in according to the procedure presented in Sections 3.1 through 3.5.


    # ## C.1 Starting X


    +   1. **Look for evidence of windows on your screen.** If you see one or more
    windows, the X server is already running, and you can skip to Section C.2.


    +   2. **Start X.** One of the following commands should work:


    ```

    $ xinit (Return)


    $ startx (Return)


    $ openwin (Return)

    ```


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_318_0.png)


    +   3. **Wait for an xterm window to appear.** It should look something like the
    window shown in Figure C−1.


    # ## C.2 Starting the Motif Window Manager


    +   1. **If necessary, select the xterm window.** Use the mouse to move the pointer
    to the xterm window.


    +   2. **Start the window manager.** Enter the following command line:


    ```

    $ mwm & (Return)

    ```


    The ampersand (&) at the end of the command line causes mwm to be run “in the
    background.” (Remember, UNIX is a multitasking OS.) This way, mwm will not interfere
    with any other programs you run.


    327'
  merge: -1
  img_proc: true
