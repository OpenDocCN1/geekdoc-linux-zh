  md: '# Programming in Fortran

    27.8 Setting up recip.f for Debugging


    You should receive an error message, something like this:

    Arithmetic exception (core dumped)


    What happened? It is not hard to figure out. Division by zero is an undefined
    operation that caused the program to crash.


    +   3 Check for a core file. If you list the files in your directory, you should
    see a file named core:


    ```

    $ ls [Return]

    ```


    Since you cannot read the core file, and because it takes up so much room, you
    should delete it.


    +   4 Remove the core file.


    ```

    $ rm core [Return]

    ```


    # 27.8 Setting up recip.f for Debugging


    Although you cannot read a core file as you would a normal UNIX text file, you
    can use a debugger such as dbx to examine the file and determine what caused the
    program to crash.


    +   Compile the program using the debug option. With most compilers, the -g option
    indicates “debug”:


    ```

    $ f77 -g recip.f [Return]

    ```


    This causes the compiler to include additional information in the compiled code
    that can be used by dbx. If you would like to see how dbx is used, refer to Appendix
    F.


    # 27.9 The Trip Program


    Our next sample program illustrates the use of separate source files for putting
    to- gether a large program. Large programs are often the work of more than one
    pro- grammer; it is common for each programmer to work on his or her own files,
    which then are assembled to make a complete program.


    It is convenient to group the source files for a program in the same directory.


    +   1 Create a directory to hold the program. Use mkdir to create a directory
    named Trip:


    ```

    $ mkdir Trip [Return]

    ```


    +   2 Move to the new directory.'
