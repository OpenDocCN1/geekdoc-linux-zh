    that you could have performed the same action by using either the one-letter command
    shortcut or the alternate key combination.


    +   4. Click once on **Restore** with the left mouse button.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_49_0.png)


    The xterm window will return to its previous size. Note once again that you could
    have performed the same action by using either the one-letter command shortcut
    or the alternate key combination.


    You will learn more about the other window menu options in the next section. For
    now, you should just close the menu.


    # 4.6 Window Menu Options


    Before going on, let''s review the meaning of the various options offered on the
    window menu:


    +   • **Restore**. Returns a window to its original size once it has been maximized.

    +   • **Move**. Allows you to move the window to a different position in the root
    window. (This option is not often used.)

    +   • **Size**. Allows you to change the size of the window. (This option is not
    often used.)

    +   • **Minimize**. Converts the window into an icon. (This is sometimes called
    the “iconify” command.) You can restore the window by clicking on the icon.

    +   • **Lower**. Moves current window behind other windows.

    +   • **Close**. This command closes and eliminates the window, usually stopping
    any program that was running in it. Be careful not to confuse this with the Minimize
    command, which shrinks the window into an icon. (To confuse matters, on some windowing
    systems, “Close” does work just like “Minimize.”)


    Remember, an icon is a small picture or symbol.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 4.7 **Getting the Pop-Up Menus**


    Another kind of menu—a “pop-up” menu—appears when you click on the root win-

    dow. The choices presented by such a menu depend on how the system administrator

    has configured your system. Take a minute to examine these menus:


    +   1. **Move the pointer to the root window.**


    +   2. **Open a menu using the right button (#3).** Depending on how your system
    is

    +   set up, you may have to hold down the mouse button. (If no menu appears, try

    +   another button.) Note what you see on the menu. It might look something like

    +   this:


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_50_0.png)


    Before going on, be sure that you understand the various options offered on the
    win-

    dow menu:


    +   • **New Window.** This option starts another window, usually an xterm window.


    +   • **Shuffle up.** Just as you would shuffle a deck of cards, shuffling the
    windows

    +   puts some windows behind others. The shuffle up command takes the top win-

    +   dow and places it behind the others on the root window. The second window

    +   then becomes the active one.


    +   • **Shuffle down.** This brings the rearmost window forward and places it
    in front

    +   of the others on the root window. This window then becomes the active win-

    +   dow.


    +   • **Refresh.** Sometimes the images on the screen get jumbled. Refresh causes
    the

    +   computer to redraw the windows.


    +   • **Restart.** This stops the current mwm session and starts another one in
    its place.


    +   • **Logout.** You would use this command when you want to quit working on
    the

    +   machine. This closes all windows and stops any programs you have running.'
