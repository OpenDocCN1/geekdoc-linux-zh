- pgno: 20
  md: '# INTRODUCTION TO UNIX


    # 1.9 X Terminals


    window manager determines the “look and feel” of the GUI, controlling the appearance
    of the windows and determining how those windows are opened, closed, sized, resized,
    and moved.


    Three window managers are in common use:


    +   - *Tab Window Manager (twm)*. Originally developed at MIT and supplied as
    part of the X Window System, twm is a “plain vanilla” window manager that offers
    few frills. Even so, experienced UNIX programmers like twm because it can be configured
    to suit their personal tastes.


    +   - *Open Look Window Manager (olwm)*. Sun Microsystems has been the strongest
    promoter of Open Look, which has generally not been adopted by other manufacturers.


    +   - *Motif Window Manager (mwM)*. Motif was developed by the Open Software Foundation
    (OSF), a consortium of several leading UNIX vendors. Motif was designed to have
    a “look and feel” resembling the IBM Presentation Manager and Microsoft Windows,
    two widely used GUIs for personal computers.


    This book features the Motif Window Manager (mwm), which is emerging as the standard
    GUI for the X Window System.


    # 1.9  X Terminals


    The X Window System was designed to be portable. As a result, X runs on virtually
    every kind of computer, from Macintoshes to PCs to supercomputers. This has contributed
    greatly to its success.


    Character-based terminals are often called dumb terminals.


    However, X will not run on a conventional character-based terminal, because considerable
    computing power is required to support a graphical user interface. This has led
    to the development of a hybrid input/output device called an X terminal, which
    has a CPU and enough internal memory to run X, but is not a complete computer
    in itself. An X terminal is more expensive than a character-based terminal, but
    less expensive than a complete UNIX workstation.'
  merge: -1
  img_proc: true
