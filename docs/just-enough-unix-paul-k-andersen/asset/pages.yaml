  md: '# ## 17 TUTORIAL: READING THE NEWS


    In this chapter, you will learn how to process Usenet news with rn (“read news”).
    Although other news readers—such as trn, nn, tin, and xrn—have more features,
    rn has the advantage of being more widely available on UNIX systems. Once you
    have mastered rn, you should have no trouble learning to use one of the alternatives.


    # ### 17.1 Usenet Newsgroups and Hierarchies


    Tens of thousands of messages are posted on the Usenet every day. To make it possible
    for you to keep up with this volume of information, the network news is organized
    by topic into newsgroups. There are several thousand newsgroups, which are further
    organized into seven top-level groups called hierarchies:


    | comp | The `comp` (“computer”) hierarchy includes several hundred newsgroups
    devoted to computer issues. For example, |

    | `comp.ai` | `comp.sys.mac` |

    | `comp.compilers` | `comp.unix.questions` |

    | `comp.lang.c` | |

    | misc | Groups that deal with topics that do not fit neatly into any of the other
    hierarchies are put in the `misc` (“miscellaneous”) category. Some examples: |

    | `misc.headlines` | `misc.misc` |

    | `misc.jobs.offered` | `misc.taxes` |

    | news | Groups in the news hierarchy deal with the operation of the Usenet itself.
    This hierarchy includes several newsgroups that are intended for new users of
    the Usenet: |

    | `news.newusers.questions` | `news.announce.important` |

    | `news.announce.newusers` | `news.newusers.newgroups` |'
  merge: -1
  img_proc: true
