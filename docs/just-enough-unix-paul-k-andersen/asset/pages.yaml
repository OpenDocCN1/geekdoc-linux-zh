  md: "# WORKING WITH THE SHELL\n9.9 Interrupting a Foreground Process\n\n# 9.9 Interrupting\
    \ a Foreground Process\n\nIf you start a long-running process such as `sleep`\
    \ the usual way (that is, in the foreground), you cannot work on any other commands\
    \ until it finishes. If for some reason you do not wish to wait that long, you\
    \ must interrupt the process. This is done with the **Ctrl**-**C** key combination.\n\
    \n+   1.  **Start the process.** For example,\n+       ```\n+       $ (sleep 120;\
    \ echo I am awake now) [Return]\n+       ```\n+   2.  **Interrupt the process.**\
    \ Type\n+       ```\n+       [Control] - C\n+       ```\n+       This will interrupt\
    \ `sleep` and invoke the `echo` command:\n+       ```\n+       ^C I am awake now\n\
    +       $\n+       ```\n\n# 9.10 Running a Background Process\n\nAs we said before,\
    \ UNIX allows you to run a process in the “background” while you work on another\
    \ task in the foreground. This is useful for long-running processes, especially\
    \ those that do not require your attention. As an example of such a long-running\
    \ process, we will once again use the `sleep` command.\n\n+   1.  **Start a long-running\
    \ process in the background.** For example,\n+       ```\n+       $ (sleep 60;\
    \ echo I am awake now)& [Return]\n+       ```\n+       If you are running the\
    \ Bourne shell, you should see something like this:\n+       ```\n+       3271\n\
    +       ```\n+       In this example, the shell assigned a process identification\
    \ (PID) number of 3271. (The actual PID on your system may be different.)\n+ \
    \      \n+       If you are running C Shell or Korn Shell, you should see something\
    \ like this:\n+       ```\n+       [1]     3271\n+       ```\n+       Here, [1]\
    \ is the job number and 3271 is the PID.\n+       \n+       The shell will display\
    \ a prompt to let you know it is ready for more commands:\n+       ```\n+    \
    \   $\n+       ```\n+   2.  **Check status of the process.** Enter the `ps` (“process\
    \ status”) command to check on what is happening:\n+       ```\n+       $ ps [Return]\n\
    +       ```"
