    \ any copies:\n+   \n+   Cc: (Return)\n+   \n+   This will get you out of the\
    \ mail program and back into the UNIX shell:\n+   \n+   $ \n\n# 14.4 Your Mailboxes\n\
    \nThe mail program uses two kinds of mailboxes. Your *system mailbox* is a file\
    \ that holds mail you have received but have not read, deleted, or saved to another\
    \ file. On many systems, this file is located in the `/var/spool/mail` directory,\
    \ and has the same name as your user ID. For example, if your user ID is *jdoe*,\
    \ then your system mailbox is the file `/var/spool/mail/jdoe`.\n\nIn addition\
    \ to the system mailbox, you may have a *personal mailbox*. This is a file named\
    \ `mbx` in your home directory. Any mail messages you have read but not deleted\
    \ or saved in another file are automatically put into your `mbx` file when you\
    \ quit the mail program.\n\nIf you use either the Bourne Shell or Korn Shell,\
    \ your shell checks your system mailbox periodically and notifies you of any new\
    \ messages:\n\nNew mail has arrived.\n\nYou can also use the `biff` or `xbiff`\
    \ program to alert you when new mail arrives. These programs are discussed in\
