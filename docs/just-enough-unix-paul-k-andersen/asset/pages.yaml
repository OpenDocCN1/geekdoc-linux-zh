  md: '# ## 16.9 File-Compression Programs


    Large files are often compressed to save storage space and decrease the time needed
    to transfer them over the network. Depending on the file and the compression technique,
    a compressed text file may occupy as little as *40%* of the memory required by
    the original.


    A compressed file is typically distinguished from a normal file by a file name
    suffix, which indicates the program that was used to compress the file. Some of
    the more common compression/decompression programs, and their file name suffixes,
    are listed below:


    | Compression Program | Decompression Program | File Suffix | Sample File Name
    |

    |---|---|---|---|

    | compress | uncompress | .Z | textfile.Z |

    | cpio | cpio | .cpio | textfile.cpio |

    | gzip | gunzip | .gz | textfile.gz |

    | pack | unpack | .z | textfile.z |

    | Stuffit | unsit | .Sit | textfile.Sit |

    | Paktit | unpit | .pit | textfile.pit |

    | PKZIP | PKUNZIP | .ZIP | textfile.ZIP |

    | tar | tar | .tar | textfile.tar |


    Strictly speaking, *tar* and *cpio* are not compression programs; they are *file
    archive programs*. Such programs can combine a number of files and directories
    into a single file—called an *archive file*—for storage on tape or transferring
    across the Internet. An archive file is often compressed before it is transferred.


    Of the programs listed above, *compress* and *tar* are the ones most commonly
    found on UNIX systems. The procedure for preparing a file or set of files for
    compression using *tar* and *compress* is fairly straightforward, as you will
    see in the next few sections.


    # ## 16.10 Creating an Archive File


    The *tar* program is normally used to prepare multiple files and directories for
    storage or transfer. If you are working with just one file, you will probably
    not bother with *tar*; in that case, skip this section.


    +   1.  **Create an archive file using *tar*.** To archive all of the files in
    a directory, run the *tar* program with the `-cf` option, giving a name for the
    archive file and specifying the directory that is to be processed. Thus, to create
    an archive file'
  merge: -1
