  md: '# ## 8.11 Quoting Special Characters


    You will recall that UNIX file names should not contain any of the following special
    characters:

    & * \ % [ ] { } $ > < ( ) ? ? '' '' / ; ^ ! ~ %

    By now it should be clear why each of these characters has a special meaning to
    the shell. But sometimes this can be a problem. You may want to use a special
    character in its usual, everyday meaning. Consider, for example, the command line

    `$ echo What time is it?`

    The shell will interpret the question mark as a wildcard, and it will try to find
    a file name to match it. Unless you happen to have a file with a three-character
    name beginning with it, the shell will not be able to find a match, and it will
    complain:

    `$ echo: No match.`

    If you want the shell to treat a question mark as a question mark, not as a special
    character, you must quote it. One way to do this is to write a backslash (\) immediately
    before the question mark:


    ```

    ```

    $ echo What time is it?

    ```

    ```


    ```

    ```

    $ echo: No match.

    ```

    ```


    > Without the backslash, ? is treated as a wildcard.


    ```

    ```

    $ echo What time is it?

    ```

    ```


    This produces the output

    `What time is it?`

    Note that the backslash does not appear in the output; its only purpose is to
    cancel the special meaning of the question mark.

    The backslash only works on a single character. Thus, to produce the output

    `**** STARS ****`

    you would have to place a backslash in front of each of the special characters:

    `$ echo \*\*\*\*\ STARS \*\*\*\*`


    ```

    ```

    $ echo \*\*\*\*\ STARS \*\*\*\*

    ```

    ```


    Having to quote each special character individually like this can be tedious.
    As an alternative, you can quote the entire string of characters all at once using
    single quotes:

    `$ echo ''**** STARS ****''

    The single quotes (''...'') used here should not be confused with the backquotes
    (``...``). Backquotes, which are also called *grave accent marks*, are used to
    enclose commands that you want the shell to run. Thus, the command line

    `$ echo It is now date.`


    ```

    ```

    $ echo ''**** STARS ****''

    ```

    ```


    > Without the single quotes, the asterisks would be treated as wildcards.


    ```

    ```

    $ echo It is now `date`.

    ```

    ```


    > The backquotes run the date command.'
  merge: -1
  img_proc: true
