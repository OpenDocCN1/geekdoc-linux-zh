- pgno: 320
  md: '# ## D APPENDIX: ACCESS PRIVILEGES


    Anything you can do to one of your own files you could potentially do to files
    belonging to another user. Obviously, it would not be good if everyone were able
    to change someone else’s files without permission. To prevent chaos, and to preserve
    privacy, UNIX allows users to restrict access to their files.


    # ### D.1 The Long Listing


    To see the access permissions on a file or directory, use the `ls -l` (“list -long”)
    command:


    ```

    $ ls -l (Return)

    ```


    You should see listings that look something like this:


    ```

    drwxrwx---   2 you  engr    12 Apr   1 15:53 Cal

    -rw-rw----     1 you  engr   997 Mar  31 10:53 fun

    -rw-rw----     1 you  engr   401 Mar  31 10:30 summer99

    ```


    Let’s decipher the first listing:


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_320_0.png)


    +   * **File type.** A *d* in the leftmost position indicates a directory. An
    ordinary file will have a hyphen (-) in this position.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# ## Access Privileges


    # **D.2 Access Permissions**


    +   * **Access privileges.** These nine positions show who has permission to do
    what

    +   with the file or directory. More about this later.


    +   * **Links.** A *link* is a pseudonym for a file or directory. Directory files
    always

    +   have at least two links, because each directory contains the hidden entry
    "dot"

    +   as a pseudonym for itself. Most ordinary files have just one link. You can
    create

    +   more links yourself, although this is beyond the scope of this book; if you
    are

    +   interested, see the manual entry for the `ln` command.


    +   * **Owner.** This is the *login* of the person who owns the file.


    +   * **Owner''s group.** A *group* is a collection of users to which the owner
    of the file

    +   belongs. (On Berkeley systems, `ls -l` does not list the group name; to see
    it,

    +   you have to use the `ls -lg` command.)


    +   * **Size.** The size of the file is given in bytes.


    +   * **Date and time.** The date and time the file was last modified is shown
    here.


    +   * **File name.** The name of the file or directory is listed last.


    # ## D.2 Access Permissions


    The nine entries showing the access permissions deserve a closer look:


    ```

    ```code

    rwxrwx---

    ```

    ```


    Basically, there are three things that can be done to an ordinary file:


    +   * **Read.** Examine (but not change) the contents of the file.

    +   * **Write.** Change the contents of a file.

    +   * **Execute.** If the file contains a program, run that program.


    Likewise, there are three things that can be done to a directory:


    +   * **Read.** List the contents of the directory using the `ls` command.

    +   * **Write.** Change the contents of the directory by creating new files or
    removing

    +   existing files. (To edit an existing file requires write permission on that
    file.)

    +   * **Execute.** “Search” the directory using `ls -l`. Also, move to the directory

    +   from another directory, and copy files from the directory.


    When deciding who can have access to a file, UNIX recognizes three categories
    of

    users:


    +   * **Owner.** The owner of the file or directory.

    +   * **Group.** Other users belonging to the user’s group.

    +   * **Public.** All other users on the system.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'The first three permissions show what the owner may do; the next three show
    what the group may do; the last three show what the public may do. For example,


    +   * `rwxrwx---` owner has read, write, and execute privileges

    +   group has read, write, and execute privileges

    +   public has no privileges

    +   * `rw-rw----` owner has read and write privileges

    +   group has read and write privileges

    +   public has no privileges

    +   * `r--r--r--` owner has read privileges only

    +   group has read privileges only

    +   public has read privileges only


    # ### D.3 Changing File Modes


    The access privileges are sometimes called the *mode* of the file or directory.
    To change the mode, you use the **chmod** (“change mode”) command. chmod uses
    the following notation:


    +   * u user (owner) of the file

    +   * g group

    +   * o others (public)

    +   * a all (owner, group, and public)

    +   * = assign a permission

    +   * + add a permission

    +   * - remove a permission


    A few examples will help you see how **chmod** is used. To give the owner execute
    permission without changing any other permissions, you would use


    ```

    $ chmod u+x filename (Return)

    ```


    Note that there are no spaces between u and +, or between + and x.


    To remove read and write permissions from group members, you would use


    ```

    $ chmod g-rw filename (Return)

    ```'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'The following command will give everyone read permissions while removing any
    other permissions:


    ```

    $ chmod a=r *filename*(Return)

    ```


    To give everyone read and write permissions, you could use


    ```

    $ chmod a=rw *filename*(Return)

    ```'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# ## E APPENDIX:

    ## WRITE AND TALK


    The **write** and **talk** utilities are similar to each other in that both allow
    you to communicate directly with a user who is logged into the system. Whatever
    either of you types on your keyboard appears simultaneously on both screens. Of
    the two utilities, **write** is less convenient because the messages can become
    garbled if both of you try to type at the same time. **talk** separates the messages,
    even if both of you type simultaneously.


    # ### E.1 Sending and Receiving Messages


    Using either **write** or **talk** is a five-step process:


    +   1. **The first user requests a session with the second user.** Suppose, for
    example, that the user **george** wishes to communicate with **martha**. To do
    this, he would type

    +      ```

    +      $ talk martha Return

    +      ```

    +      or

    +      ```

    +      $ write martha Return

    +      ```

    +      2. **The second user is notified.** Thus, if **martha** is logged in and
    receiving messages, she will be alerted:

    +      ```

    +      Message from george...

    +      ```

    +      3. **The second user agrees to answer.** **martha** would have to type

    +      ```

    +      $ talk george Return

    +      ```

    +      or

    +      ```

    +      $ write george Return

    +      ```'
  merge: -1
  img_proc: true
- pgno: 325
  md: '**4** **The two users exchange messages.** Anything that either user types
    will be displayed on both terminals. Most people using write work out a convention
    whereby only one types at a time, signaling the end of a thought with an o (for
    “over”).


    **5** **When finished, they break off communication.** To quit talk, one of the
    parties has to type (Control)-<E>. To quit write, however, both users must type
    (Control)-<D>.


    # E.2 Refusing and Accepting Messages


    You can refuse to accept write or talk messages with the command

    $ msg n

    which is short for “messages—no.” Anyone trying to establish contact with you
    using write or talk will get the message:

    Your party is refusing messages.

    (Electronic mail will still get through, however.) To accept messages again, you
    would use the command

    $ msg y'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# F APPENDIX:

    USING DBX


    The standard UNIX debugger dbx can debug programs written in C, Fortran, or Pascal.
    To use dbx, you must compile your program using the -g option. For example, to
    debug the C program recip.c, you would use the command


    $ cc -g recip.c(**Return**)


    to compile the program. Once this is done, you can run dbx on the executable file:


    $ dbx a.out(**Return**)


    The computer will respond with a cryptic message (which you can ignore), something
    like


    Reading symbolic information...


    Then it will give you a prompt that shows you are inside dbx:


    (dbx)


    # F.1 Getting Help with dbx


    The first thing to try is the help command. At the dbx prompt type:


    (dbx) help(**Return**)


    The computer should respond with a listing of the various dbx commands:


    Command Summary


    Execution and Tracing

    catch clear cont delete ignore

    next rerun run status step

    stop trace when'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# F.2 Running the Program


    and so on. Take a moment to look over the entire list. You may notice a few UNIX
    shell commands (`cd`, `pwd`, `setenv`, `sh`), and some other commands whose purpose
    you can probably guess. (`edit`, for example, calls up the text editor so you
    can edit the source file from within dbx.) We will not try to go over all of the
    available commands; you can do quite a lot with just the following dozen commands:


    +   cont

    +   display

    +   help

    +   print

    +   quit

    +   rerun

    +   run

    +   sh

    +   step

    +   stop

    +   trace

    +   where


    You can use the `help` command to find out more information on any of these commands.
    Try using `help` on itself:


    ```

    (dbx) help help <kbd>Return</kbd>

    ```


    You should see a brief synopsis of the `help` command. (Note that `<cmd>` stands
    for any dbx command, `<topic>` stands for any topic, and so forth.) Although the
    `help` command does not provide much information on any of the commands, it is
    better than nothing.


    # ## F.2 Running the Program


    The command to run the program is, appropriately enough, `run`. Try this:


    ```

    (dbx) run <kbd>RETURN</kbd>

    ```


    Except for some additional information printed by dbx itself, your program should
    run as usual:


    ```

    Running: a.out

    (Access id 3431)

    This program calculates reciprocals.

    Enter a number:

    ```


    ```

    Enter the number 1 and press <kbd>Return</kbd>:

    ```


    ```

    Enter a number: 1 <kbd>Return</kbd>

    ```


    The output should resemble the following:


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_327_0.png)


    ```

    The reciprocal of 1 is 1.

    execution completed, exit code is 1

    (dbx)

    ```


    The message “exit code is 1” simply tells you that the program completed successfully.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'Running a program from inside dbx doesn''t seem too useful—after all, it is
    easier to run the program directly, without first calling up the debugger to do
    the job. What dbx allows you to do is step through the program, one line at a
    time, and examine the values of the variables and expressions as they change.


    # ## F.3 Listing the Source Code


    The list command will show you the source code. Try it:


    (dbx) list 1, 15 Return


    This tells dbx that you wish to see the source code from line 1 to line 15. dbx
    will display the file, numbering the lines as it does so. (The line numbers are
    not actually added to the source file.)


    # ## F.4 Setting Breakpoints


    A breakpoint is a place in the program where you want the execution to halt. Breakpoints
    may be set using the stop command. Let''s set a breakpoint at line 8:


    (dbx) stop at 8 Return


    dbx will tell you that it has set the breakpoint:


    stop at "recip.c":8


    Now use the run command to begin execution:


    (dbx) run Return


    The program will run until it reaches line 8, where it will stop. dbx will then
    display line 8:


    ```

    ```

    Running: a.out

    stopped in main at line 8 in file "recip.c"

    8 printf("This program calculates reciprocals.\n");

    (dbx)

    ```

    ```


    # ## F.5 Stepping through the Program


    At this point, you could resume execution of the program by using the cont ("continue")
    command, but it is more instructive to step through the program one line at a
    time. The step command allows you to do this:


    (dbx) step Return


    You should see something like this:'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'This program computes reciprocals.


    ```

    stopped in main at line 9 in file "recip.c"

    9\tprintf("Enter a number:");

    \(dbx\)

    ```


    Note that the first thing you see is the line that was printed out by the previous
    statement. Step again, but step two lines this time:


    ```

    \(dbx\)\tstep 2\(Return\)

    ```


    The prompt produced by line 9 now appears:


    ```

    Enter a number:

    ```


    Type in a 1 and press (Return).


    ```

    Enter a number: 1\(Return\)

    ```


    The program reads the number as it would normally. Then it proceeds to the next
    line of the program and stops:


    ```

    stopped in main at line 11 in file "recip.c"

    11\trecip = 1/n;

    \(dbx\)

    ```


    # **F.6\tPrinting Expressions**


    The print command allows you to examine the values of variables. For example,
    to view the value of n, you would enter


    ```

    \(dbx\)\tprint n\(Return\)

    ```


    dbx will respond with the current value of n:


