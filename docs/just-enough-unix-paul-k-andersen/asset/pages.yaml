    | `` `string` `` | Run any commands in `string`; output replaces `` `string` ``
    |


    # ### 8.12 Background Processing


    Processes that can run unattended are often put in the background.


    As we said before, UNIX is a multitasking operating system, which means that it
    can run more than one program for you at the same time. You can start a command
    and put it in the “background,” to continue running while you work on another
    one in the foreground.


    Running a background process is simple: Type an ampersand (&) at the end of the
    command line before pressing (Return). Consider a hypothetical long-running program
    called longrun. You could run this program in background with the command


    ```

    $ longrun & (Return)

    ```


    If you were running the Bourne Shell, you would then see something like this:


    ```

    3216

    $

    ```


    Running either the C Shell or the Korn Shell, you would see something like this:


    ```

    [1]       3216

    $

    ```


    3216 is the process identification number (PID).

    [1] is the job number; 3216 is the PID.'
