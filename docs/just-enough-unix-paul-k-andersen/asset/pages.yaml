  md: '# STARTUP FILES


    # 20.10 *The history Mechanism* (*csh* and *ksh*)


    If you do not give a value to the **HISTSIZE** variable, *ksh* will remember 128
    commands by default.


    Once the *history* mechanism is set up, typing

    $ history (Return)

    will produce a numbered list of the ten commands you have used most recently,
    including *history* itself:


    +   1  who | sort

    +   2  ls

    +   3  cal

    +   4  cd

    +   5  ls -l

    +   6  mkdir Stuff

    +   7  cd Stuff

    +   8  vi newstuff

    +   9  spell newstuff

    +   10 history


    You can repeat any of these commands by number. In *csh*, you simply type an exclamation
    mark (!) followed by the number. Thus, to repeat command number 5 on the *history*
    list, you would type

    $ !5 (Return)


    +   Repeat command #5 (*csh*.)


    The command will appear on the screen just as if you typed it again:

    !s -1


    You can repeat the most recent command by entering two exclamation marks:

    $ !! (Return)


    +   Repeat last command (*csh*.)


    The *ksh* *history* command uses *r* (for “repeat”) instead of an exclamation
    mark. Thus, to repeat the fifth command on the *history* list, you would type:

    $ r 5 (Return)


    +   Repeat command #5 (*ksh*.)


    The command is echoed on the screen:

    ls -1


    You can repeat the most recent command by entering the *r* command without a number:

    $ r (Return)


    +   Repeat last command (*ksh*.)'
