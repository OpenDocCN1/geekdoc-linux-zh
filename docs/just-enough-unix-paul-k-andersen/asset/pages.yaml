    # **9.8 Sleeping**

    sleep is not a filter.


    The sleep command creates a process that “sleeps” for a specified period of time.
    In other words, sleep waits the specified number of seconds before returning to
    the shell. It has the general format

    sleep n

    where n is a nonnegative integer that indicates the number of seconds the process
    is to sleep.


    +   Run the sleep command. To sleep for 15 seconds, enter

    +   $ sleep 15<Return>


    +   Use sleep to delay execution of another command. This is a common application
    of the sleep utility. For example,

    +   $ (sleep 60; echo I am awake now)<Return>


    +   Wait for the process to finish. When sleep finishes, echo will print a message:

    +   I am awake now'
