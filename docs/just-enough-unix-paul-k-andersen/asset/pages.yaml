  md: 'This means that wombat may be found by starting at the root, moving down to
    the directory home, then to the user directory j111, to the directory Marsupials,
    and finally to the file wombat itself.


    You may have noticed that the slash (//) serves two purposes in writing these
    path- names. The first slash in the sequence stands for the root; the other slashes
    serve merely as separators between the file names.


    As you can easily imagine by now, full pathnames can become long and unwieldy.
    There is a shorthand notation that allows you to abbreviate some absolute path-
    names. A tilde (\u003e) by itself stands for your home directory''s pathname;
    a tilde pre- ceding a user name stands for that user''s home directory. Thus,


    +   - \u003e = absolute pathname of your home directory

    +   - \u003ejack = absolute pathname of jack''s home directory


    # 5.5

    Relative Pathnames


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_66_0.png)


    More often than not, you are interested in the position of a file or directory
    relative to your current working directory. Relative pathnames start from the
    working direc- tory rather than the root.


    When writing out a relative pathname, a single period or dot (.) is the shorthand
    no- tation for your current working directory. Similarly, two dots (..) are used
    to signify the parent of your working directory—the one above it in the directory
    structure. These are usually called dot and dotdot. Hence


    +   - . ("dot") = current working directory

    +   - .. ("dotdot") = parent of the working directory


    For files in the current directory, the relative pathname is easy: it is simply
    the name of the file. Suppose you were working in the directory jack shown in
    Figure 5-2. The relative pathnames of the two directories in jack would be

    Continents Oceans


    The parent of jack is home. Therefore, the relative pathname of home would be

    ..


    Suppose now that you wanted the relative pathname of the directory that contains
    home, which is the root directory. From the directory jack this would be

    ../..


    To find the Marsupials directory from the directory jack, you would first move
    up to home (represented by dotdot), then down to j111, and finally down to Mar-
    supials itself. Putting this alltogether, the relative pathname becomes'
  merge: -1
