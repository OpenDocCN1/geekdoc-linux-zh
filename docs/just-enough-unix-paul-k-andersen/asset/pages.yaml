- pgno: 16
  md: '# # 1.4 The Operating System


    As important as the computer hardware is, it can do nothing without *software*,
    the coded instructions that tell the CPU what to do. An especially important type
    of software is the *operating system* (OS), which performs three vital functions:


    +   * The OS controls all of the various peripheral devices (printers, disk drives,
    terminals, and so on) that are attached to the computer.

    +   * The OS handles communications between the user and the computer, passing
    commands from the user to the computer and returning messages from the computer
    to the user.

    +   * The OS manages the way other programs are stored and run.


    Some operating systems are *proprietary*, meaning that they are designed to work
    only on certain types of computers. For example, MS-DOS—the most popular operating
    system of the 1980s—was designed for machines having an Intel CPU. Likewise, the
    original Apple Macintosh System ran only on machines using a Motorola CPU.


    In contrast, the UNIX operating system is nonproprietary—it will run on a wide
    variety of computer systems. One way to express this is to say that UNIX is a
    *portable* operating system. You will also hear people say that UNIX is an *open*
    system. However you choose to put it, UNIX is the leading portable (or open) operating
    system in the world today.


    # # 1.5 Multitasking and Time-Sharing


    UNIX is a *multitasking* operating system, meaning it enables the computer to
    work on more than one task at a time. With UNIX, you can run several programs
    “in the background” while you work on another task “in the foreground.”


    How does multitasking work? Although some computers actually can perform more
    than one task at a time, others cannot. However, by switching rapidly back and
    forth between tasks, performing a little here and a little there, a computer can
    create the illusion of doing many things simultaneously. This technique is called
    *time-sharing*, and it is feasible only because (a) the computer is very fast
    and (b) UNIX takes care of scheduling what is to be done and when.


    UNIX is also capable of interacting with more than one user at a time—in other
    words, it is a *multiuser* operating system. This capability is especially important
    on large mainframe computers that must serve a large number of users; without
    it, everyone would have to wait his or her turn to use the computer.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_16_0.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# The Origins of UNIX


    The UNIX story begins with a failed operating system, some fun-loving computer
    scientists with time on their hands, and a computer game named Space Travel. The
    failed operating system was Multics, a joint venture involving General Electric,
    MIT, and the AT&T Bell Laboratories. Multics was envisaged as a great technological
    leap forward: an interactive, multiserer operating system that would be years
    ahead of anything then available. But the project was too ambitious, and by 1969
    it was clear that Multics was in big trouble. Reluctantly, Bell Labs withdrew
    from the project, leaving the Bell researchers with nothing to do.


    One of those researchers, Ken Thompson, had written Space Travel, a computer game
    that allowed a Multics user to pilot an imaginary spacecraft to the major bodies
    of the solar system. While awaiting approval from Bell management for several
    new research projects, Thompson decided to keep busy by rewriting Space Travel
    to run on a little-used PDP-7 minicomputer in the lab. He enlisted the aid of
    Dennis Ritchie, another Bell computer scientist who had worked on the Multics
    project.


    It was no easy task. All programming had to be done on another machine, then transferred
    to the PDP-7 using punched paper tape. It did not take long for Thompson to wish
    that the PDP-7 had its own operating system, similar in some respects to Multics,
    but much simpler. So he wrote one. This was the first UNIX operating system, although
    it did not acquire that name until the following year. (The name was originally
    "Unics", a pun on the name Multics. Later this was changed to UNIX.)


    The PDP-7 had only about 9 Kbytes of main memory, less than some of today''s handheld
    calculators. Thompson and Ritchie requested a larger computer. In exchange, they
    offered to produce a UNIX-based word-processing system for the Bell Labs patent
    department. They got their new computer—a PDP-11 having 24 K of main memory—and
    delivered the word-processing system in 1971. It was an immediate success, and
    UNIX was launched.


    UNIX was originally written in assembly language, a kind of primitive programming
    language. Since each type of computer has its own assembly language, early versions
    of UNIX could run only on PDP-7 and closely related machines. But in 1973, UNIX
    was rewritten in C, a high-level programming language invented by Dennis Ritchie.
    C was much easier to write programs in C; just as important, C was designed to
    be a portable language, not tied to any particular type of computer hardware.
    As a result, UNIX itself became a portable operating system.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1.6 Major Components of UNIX


    The UNIX operating system consists of four main parts:


    +   - **Kernel.** *The kernel* is the master control program of the computer.
    It resides in the computer''s main memory, and it manages the computer''s resources.
    It is the kernel that handles the switching necessary to provide multitasking.


    +   - **Shell.** The part of UNIX that interprets user commands and passes them
    on to the kernel is called the *shell*. Three different shells are commonly used
    today: the Bourne Shell, the Korn Shell, and the C Shell, all of which are discussed
    in this book.


    +   - **File System.** UNIX organizes information into collections called *files*.
    You can put just about any kind of information into a file—a program you have
    written, a memo, data waiting to be analyzed, the manuscript for your next novel,
    even a letter to your mother. Files may be grouped together into collections called
    *directory files*, usually called *directories*.


    +   - **Utilities.** A *utility* is a useful software tool that is included as
    a standard part of the UNIX operating system. Utilities are often called *commands*.
    UNIX provides utilities for text editing and formatting, programming, database
    management, communications, and so on.


    # 1.7 Windows and Graphical User Interfaces


    It is difficult to take full advantage of a multitasking operating system like
    UNIX if you can only see output from one process at a time on your monitor. Fortunately,
    most recent UNIX systems have the ability to divide the monitor screen into multiple
    areas called *windows* (Figure 1-4), each of which acts as if it were a separate
    monitor. Using a windowing system, you could read your electronic mail in one
    window, compose a reply in another window, and run a spreadsheet program from
    a third window, all at the same time.


    The typical windowing system also offers what is called a *graphical user interface*
    (GUI or "gooey"), which allows you to work with pictures as well as character
    data. To run a particular program under a GUI, you might use a pointing device
    such as a mouse to select an *icon* (a symbol) that represents that program, rather
    than having to remember and type a command. Because most people find it easier
    to work with pictures and pointing devices, GUIs have become very popular.


    If you have used an Apple Macintosh or a PC running either Microsoft Windows or
    OS/2, you are already familiar with windows and GUIs. On UNIX systems, the GUI
    is usually based on the X Window System ("X" for short), which was originally
    developed at the Massachusetts Institute of Technology.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# **INTRODUCTION TO UNIX**

    *1.8 The Window Manager*


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_19_0.png)


    A server is software (or hardware) that provides a service to other software (or
    hardware).


    The X Window System works according to what is called a *client-server model*.
    In other words, X acts as a server for other programs (the clients) by providing
    a graphical user interface for them. This makes X especially well suited to networked
    computing because the clients and server can run on separate computers.


    # **1.8** **The Window Manager**


    Although the X Window System makes it possible to create a graphical user interface,
    X does not specify what the windows must look like or how they are manipulated
    by the user. That is the job of a program called the *window manager*. The'
  merge: -1
