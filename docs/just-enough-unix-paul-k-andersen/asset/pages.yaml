    # 8.10 Wildcards


    Typing and retyping file names can be a nuisance, especially if the names are
    long or there are very many of them. You can abbreviate file names using wildcards,
    which are characters that can stand for other characters (just as a joker in a
    pack of cards can stand for other cards in the pack). The wildcard symbols are
    the asterisk (*), the question mark (?), and the square brackets [ ]. To see how
    these symbols are used, suppose that you had a directory named Fun containing
    the following files:


    +   backgammon

    +   backpacking

    +   baseball

    +   basketball

    +   biking

    +   blackjack

    +   boxing

    +   bridge

    +   camping

    +   canoeing

    +   checkers

    +   chess

    +   crossword

    +   dancing

    +   eating

    +   fencing

    +   fishing

    +   football

    +   golf

    +   hearts

    +   hiking

    +   karate

    +   poker

    +   rugby

    +   sailing

    +   skiing

    +   softball

    +   swimming

    +   team1

    +   team2

    +   team3

    +   team4

    +   teamA

    +   teamB

    +   teamC

    +   teamD

    +   teamM

    +   teamW

    +   teamX

    +   teamY

    +   teamZ

    +   track

    +   wrestling


    The asterisk (*) is by far the most commonly used wildcard. It matches any character
    or string of characters, including blanks. As you can see, the directory Fun contains
    a large number of files. Using wildcards you can avoid having to list all of them
    when you are interested in just a few. For example, the command


    ```

    $ ls f* (Return)

    ```


    will cause the shell to list only those files beginning in f:


    ```

    fencing fishing football

    ```


    The command


    ```

    $ ls *ball (Return)

    ```


    will cause the shell to list the files that end in ball:


    ```

    baseball basketball football softball

    ```'
