- pgno: 175
  md: 'This means that the \`telnet\` program uses the \`Control-]`` key combination
    as an escape sequence. (This is not to be confused with the \`Esc`` key that is
    used with the \`vi`` editor.) The \`telnet`` escape character allows you to suspend
    your work on the remote host and give commands to the \`telnet`` program itself.


    +   1. **Enter the telnet escape character.** On most systems, this is the \`^]``
    combination:


    ```

    $ Control-]

    ```

    The computer will respond with the \`telnet`` prompt:


    ```

    ```

    telnet>

    ```

    ```


    +   2. **Display the list of telnet commands.** Enter a question mark (?\`?\`)
    at the prompt:


    ```

    ```

    telnet> ? Return

    ```

    ```


    The program will respond with a list of commands:


    ```

    ```

    close     close current connection

    display    display operating parameters

    mode       line-by-line or character-at-a-time mode

    open       connect to a site

    quit       exit telnet

    send       transmit special characters

    set        set operating parameters

    toggle     toggle operating parameters

    z          suspend telnet

    ?          print help information

    ```

    ```


    +   3. **Display a detailed command description.** To get more information on
    any of these commands, type the command name followed by a question mark:


    ```

    ```

    telnet> close ? Return

    ```

    ```


    The \`telnet`` program will show you a description of the \`close`` command:


    ```

    ```

    close closes current connection

    ```

    ```


    That does not tell you anything more than you already knew. However, some of the
    other commands give you considerably more information; take a moment and try them
    out.


    +   4. **Exit the telnet command mode.** This is done by pressing the \`Return``
    key at the \`telnet`` prompt:


    ```

    ```

    telnet> Return

    ```

    ```


    This will put you back into your remote UNIX account.'
  merge: -1
  img_proc: true
- pgno: 176
  md: "# ## 15.4  Ending the telnet Session\n\nOnce you have finished working on the\
    \ remote host, you should log out from that machine and end the `telnet` session.\n\
    \n+   1. **Log out from your remote account.** This is done the usual way (see\
    \ Chapter 3). One of the following commands should work:\n\n```\n`$ logout (Return)`\n\
    `$ exit (Return)`\n`$ (CONTROL)-D`\n```\n\nWhen you have logged out, you will\
    \ see a `telnet` prompt:\n\ntelnet>\n\nAt this point you could, if you wish, open\
    \ another remote session using the `open` command.\n\n+   2. **Quit the `telnet`\
    \ program.** Enter `quit` at the prompt:\n+   \n+   telnet> quit (Return)\n+ \
    \  \n+   You will see a UNIX shell prompt:\n+   $\n\n# ## 15.5  A Shortcut Method\n\
    \nThere is a quicker way to run a `telnet` session:\n\n+   1. **Enter the `telnet`\
    \ command, followed by the Internet address of the remote machine.** Thus, if\
    \ you had an account on the host computer `merlin.podunku.edu`, you would type\n\
    +   \n+   `$ telnet merlin.podunku.edu (Return)`\n+   \n+   Eventually, you will\
    \ see the `login` prompt:\n+   login:\n\n+   2. **Log into your remote account\
    \ as usual.**\n+   3. **When finished, close the connection.**\n+   \n+   telnet>\
    \ close (Return)\n+   \n+   This will usually log you out of the remote account\
    \ and quit `telnet`. You should see a UNIX shell prompt:\n+   $"
  merge: -1
