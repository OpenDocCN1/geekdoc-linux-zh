  md: '# TRANSFERRING FILES


    # 16.4 Getting a File


    shell, ftp uses the cd command to change the working directory. Thus, if you wanted
    to get a file from the subdirectory Marsupials, you would type


    ```

    ftp> cd Marsupials (Return)

    ```


    Depending on how ftp has been set up on your system, you may see a mes-

    sage that looks something like this:


    ```

    250 CWD command successful.

    ```


    +   List the files to find the one you want. With ftp, as with the UNIX shell,
    you

    +   can do this with the 1s command:


    ```

    ftp> ls (Return)

    ```


    This command will list the files in the current directory on the remote host.
    It

