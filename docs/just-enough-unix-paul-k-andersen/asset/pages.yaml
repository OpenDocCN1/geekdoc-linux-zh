    fairway machine. |


    # 13.7 Other Traditional Network Services


    Some of the most common services provided over the networks are listed below:


    +   * **Remote computing.** rlogin ("remote login") and telnet allow you to log
    into a remote computer host. rlogin works between two UNIX hosts; tel- net can
    be used to communicate with either UNIX or non-UNIX hosts. Both of these programs
    are described in Chapter 15.


    +   * **File transfer.** The rcp ("remote copy") and ftp ("File-Transfer Protocol")
    programs are designed for transferring files from one computer to another over
    the Internet. These programs are discussed in Chapter 16.


    +   * **Network news.** One of the most entertaining—and informative—features
    of the Usenet is the electronic news service. The Usenet news reader rn ("read
    news") is discussed in Chapter 17.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_154_0.png)


    # 13.8 Internet Navigation


    The tremendous growth of the Internet has increased the number of places you have
    to look for the information you want. This has led to the development of programs
    called *navigators* or *browsers*, which are intended to provide easier access
    to the resources of the Internet. One of the most popular of these is gopher,
    which was first developed at the University of Minnesota (home of the "Golden
    Gophers").


    The gopher software is designed according to a client-server model. The client
    is a program that runs on your local host; this is the program that you run when
    you invoke the gopher command. To obtain information, the client contacts the
    server program, which may be running on a remote computer.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'A gopher server presents a menu, each item of which refers either to a file
    of information or another menu. A menu item may even point to information located
    on another host elsewhere. If you select a choice that leads to a remote host,
    the gopher software takes care of contacting the gopher server on that host; most
    of the dirty work is done for you.


    # ## 13.9 The World Wide Web


    The World Wide Web (WWW) is not a separate network but rather a way of presenting
    information on the Internet in the form of *hypertext documents*. A hypertext
    document may contain links to other documents—just as an item on a gopher menu
    may point to another menu. The WWW goes far beyond gopher, however. Whereas gopher
    documents are entirely text-based, a WWW document can present information in textual,
    graphical, video, or audio form.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_155_0.png)


    The Web operates on a client-server model. The Web client is a program—called
    a *browser*—that runs on your local host. To obtain information, your browser
    communicates with the server program, which typically is running on a remote computer
    called the *Web site*. This is a five-step process.


    +   1. You instruct the client program on your local host to get a Web document.

    +   2. The client locates the remote Web site.

    +   3. The client sends a request over the Internet for the document you specified.

    +   4. The server on the Web site sends a copy of the document over the Internet.

    +   5. Your client program formats the document and displays it for you to view.


    Numerous Web browsers are available, with more appearing all the time. Easily
    the most popular—at least for now—is Netscape. You will learn how to use Netscape
    in Chapter 19.


    # ## 13.10 Universal Resource Locators


    Every page of information on the World Wide Web has its own unique identifier,
    called a *Universal Resource Locator* (URL), that tells the browser where to find
    the page and how to read it. For example, the Library of Congress in Washington,
    DC, has a WWW server. Its URL is


    ```

    http://cweb.loc.gov/homepage/1chp.html

    ```'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# ASCII, HTML, HTTP, GIF, JPEG, MPEG, and MIME


    It seems that every advance in technology unleashes a flood of new acronyms. Here
    is a selection of important acronyms related to the Internet and World Wide Web:


    +   * **ASCII.** Computers represent all data in terms of numbers—specifically,
    binary numbers. A standard scheme for representing text numerically is the *American
    Standard Code for Information Interchange*, more popularly known as ASCII (pronounced
    “ask-key”). This code represents uppercase and lowercase letters, numerals, and
    the common punctuation marks as 7-bit binary numbers. Although most users never
    actually see the ASCII representation, you may hear someone talk about “ASCII
    files.” This simply means a file containing text only—no graphics, video, or audio,
    for instance.

    +   * **HTML.** Many WWW documents are based on the *Hypertext Markup Language*
    (HTML). HTML documents contain instructions on how the pages are to be interpreted
    and displayed by a Web browser. Various versions of HTML have been developed,
    including SHTML, or the *Secure Hypertext Markup Language*, which is designed
    for providing security for financial transactions over the Web.

    +   * **HTTP.** To communicate with each other, Web clients and servers observe
    a set of rules called the *Hypertext Transport Protocol*, or HTTP. You need not
    know anything about HTTP yourself—your browser will take care of the details—but
    you will often use this acronym when requesting documents over the Web.

    +   * **GIF.** Graphics—drawings, diagrams, and photographs—are stored and transmitted
    differently from text. The *Graphic Interchange Format* or GIF (pronounced “jif”)
    was developed in the 1980s by CompuServe for efficiently transmitting images over
    networks. GIF employs a file-compression technique to minimize the size of the
    graphics files. (Unfortunately, the GIF compression algorithm limits the number
    of colors that may be used in the images.) GIF files are commonly identified by
    the *.gif* suffix.

    +   * **JPEG.** Although GIF is the most widely used graphics format on the Web,
    it is not the only one. An industry organization, the *Joint Photographic Experts
    Group* (JPEG), has defined an alternative file format that is optimized for compressing
    color photographs. JPEG file names typically carry a *.jpeg* or *.jpg* suffix.

    +   * **MPEG.** This MPEG file format, defined by the *Motion Picture Experts
    Group*, is commonly used to transmit compressed video and audio data. MPEG files
    are identified by a *.mpeg* suffix.

    +   * **MIME.** Originally, UNIX mail programs were limited to text (ASCII) messages.
    Some of the newer mailers also handle MIME (*Multi-Purpose Internet Mail Extensions*),
    which is a standard for including multimedia objects in electronic mail.'
  merge: -1
  img_proc: true
