  md: '# # PREFACE


    # ## What is UNIX?


    Mention computers, and most people tend to think of computer hardware—the physical
    device, consisting of circuit boards, a central processing unit (CPU), memory
    chips, and so on. Equally important, however, is the software—the programs that
    tell the hardware what to do. Without software, a computer is just a box with
    wires attached to it.


    An operating system is an important kind of software that manages the resources
    of the computer. You might think of the operating system as the master control
    program for the entire computer system, hardware and software.


    In this book you will learn about the UNIX operating system. UNIX is fast becoming
    the standard computer operating system in industry, government, and education.
    It is especially popular in academia: according to AT&T, where UNIX was developed,
    every major university in the United States now has at least one computer system
    running under UNIX.


    # ## Which Version of UNIX?


    Although UNIX originated at the AT&T Bell Laboratories, much of its subsequent
    development has occurred at the University of California, Berkeley. Computer manufacturers,
    too, have gotten into the act, producing their own variations on the UNIX theme.
    Examples include AIX, from IBM; A/UX, from Apple Computer; HP-UX, from Hewlett-Packard;
    SunOS, from Sun Microsystems; ULTRIX, from Digital Equipment Corporation; and
    XENIX, from Microsoft.'
  merge: -1
  img_proc: true
- pgno: 4
  md: "# PREFACE\n\nThese versions of UNIX are quite similar. Most can trace their\
    \ ancestry to either AT&T UNIX or Berkeley UNIX; some are amalgams of both. This\
    \ book presents features that are found on almost all UNIX systems, with special\
    \ emphasis on those that are common to AT&T System V and Berkeley System Distribution\
    \ (BSD) 4.3 UNIX.\n\n# Who Should Read This Book?\n\nThis book is intended for\
    \ anyone who wants to acquire a working knowledge of UNIX without having to become\
    \ a UNIX expert. It is especially appropriate for students of science, engineering,\
    \ or business who are taking their first computer programming course.\n\n# What\
    \ Does This Book Cover?\n\nThis book covers the basics of the UNIX operating system.\
    \ It has eight main parts:\n\n+   I INTRODUCTION TO UNIX  \n+   II UNIX FILE SYSTEM\
    \  \n+   III UNIX SHELL  \n+   IV THE VI EDITOR  \n+   V UNIX NETWORKING  \n+\
    \   VI STARTUP FILES  \n+   VII SHELL SCRIPTS  \n+   VIII PROGRAMMING UNDER UNIX\n\
    \n**INTRODUCTION.** In Part I, you will find an overview of the UNIX operating\
    \ system, and you will learn what you will need to start using it.\n\n**UNIX FILE\
    \ SYSTEM.** UNIX organizes information in collections called files. You will learn\
    \ how to create, name, rename, copy, and delete files in Part II. You will also\
    \ learn how UNIX keeps track of your files.\n\n**UNIX SHELL.** The part of UNIX\
    \ that interprets user commands and passes them on to the computer is called a\
    \ shell. Many different shells have been written for UNIX; the three most prevalent\
    \ are the Bourne Shell (standard on AT&T System V UNIX), the C Shell (standard\
    \ on Berkeley UNIX), and the Korn Shell. These shells are considered in Part III.\n\
    \n**THE VI EDITOR.** You can create or modify UNIX files using a utility program\
    \ called an editor. The most popular UNIX editor is called vi (“vee-eye”), which\
    \ is discussed in Part IV."
  merge: -1
