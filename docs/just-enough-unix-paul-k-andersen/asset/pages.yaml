- pgno: 58
  md: '# 4.20 Logging Out


    When you are finished working on the computer, you must “log out.” This tells
    the system that you are finished using it.


    > NEVER LEAVE THE TERMINAL WITHOUT LOGGING OUT FIRST. On some UNIX systems, your
    account will remain open even if your terminal is turned off. This invites the
    unscrupulous to get into the system and cause trouble.


    Unfortunately, the process for logging out varies from system to system. (When
    in doubt, check with your system administrator.)


    +   * If **Logout or Exit** appears on the root menu, select this option. You
    may have to wait a minute, but eventually the login screen should appear.

    +   * If you see **an icon labeled Logout, double-click on this icon**. This will
    either log you out or open up another window.

    +   * If you see **a window labeled Logout, double-click on this window**. Wait
    to see if the login screen appears.'
  merge: -1
  img_proc: true
