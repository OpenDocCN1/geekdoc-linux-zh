- pgno: 332
  md: '# F.8 Using where


    You cannot read a core file, but dbx can. In particular, the where command in
    dbx allows you to find out where in the program the error occurred. Start dbx
    on the a.out and core files:


    ```

    $ dbx a.out core\<Return>

    ```


    You might expect to see a few warnings before the dbx prompt appears:


    ```

    Reading symbolic information...\ncore header file read successfully.\nReading
    symbolic information...\nReading symbolic information...\nReading symbolic information...\nprogram
    terminated by signal FPE (integer divide by zero)\nCurrent function is main\n  11        recip
    = 1/n;\n(dbx)

    ```


    This tells you what you already know, namely that the core file was generated
    by a division by zero. It also shows that this occurred on line 11 in the main()
    function. Some versions of dbx require that you use the where command to determine
    where the error occurred:


    ```

    (dbx) where\<Return>\n[1] .div(0x1, 0x0, 0x4, ...\n[2] main(), line 11 in "recip.c"\n(dbx)

    ```


    The last line before the dbx prompt tells you that the error occurred on line
    11 of the function main().


    # F.9 Running Shell Commands in dbx


    The sh command allows you to run shell commands while you are still inside dbx.
    Use this command with rm to delete the core file:


    ```

    (dbx) sh rm core\<Return>

    ```


    Now use sh and ls to check that the core file has indeed been removed:


    ```

    (dbx) sh ls\<Return>

    ```'
  merge: -1
  img_proc: true
- pgno: 333
  md: "# # G APPENDIX: MAINTAINING PROGRAMS WITH MAKE\n\nThe UNIX **make** program\
    \ is designed to manage large, multifile projects by keeping track of any changes\
    \ that are made in the source files. It allows you to modify and recompile one\
    \ source file without having to recompile the entire program.\n\n# ## G.1 The\
    \ makefile\n\nThe **make** program looks for its instructions in a file named\
    \ either **makefile** or **Makefile**. For the program in the **Trip** directory,\
    \ create a file named **makefile**, and enter the lines shown in Listing G–1.\n\
    \n```\n```\n# Makefile for the Trip program\n\ntrip: main.o chicago.o indiana.o\
    \ indy.o\n\tCtrl+C cc -o trip main.o chicago.o indiana.o indy.o\n\nmain.o: main.c\n\
    \tCtrl+C cc -c main.c\n\nchicago.o: chicago.c\n\tCtrl+C cc -c chicago.c\n\nindiana.o:\
    \ indiana.c\n\tCtrl+C cc -c indiana.c\n\nindy.o: indy.c\n\tCtrl+C cc -c indy.c\n\
    \nclean:\n\tCtrl+C rm *.o\n```\n```\n\nListing G–1\nMakefile for the Trip program."
  merge: -1
  img_proc: true
- pgno: 334
  md: 'Let’s consider some of the interesting features of this file:


    +   # Makefile for the Trip program

    +   This is a *comment line*. *make* ignores anything that follows a pound sign
    (#).


    +   trip: main.o chicago.o indiana.o indy.o

    +   This is a called a *dependency line*. It indicates that the file **trip**
    depends on the object files **main.o**, **chicago.o**, **indiana.o**, and **indy.o**.
    Note that the dependency line must begin in the first column.


    +   (TAB)cc -o trip main.o chicago.o indiana.o indy.o

    +   This is an *action line*. It follows the dependency line and shows how the
    file **trip** is created from the files **main.o**, **chicago.o**, **indiana.o**,
    and **indy.o**. In this case, **cc** links the object files and puts the executable
    into **trip**. Action lines must begin with a tab.


    +   chicago.o: chicago.c

    +   This is another dependency line, showing that **chicago.o** depends on the
    source file **chicago.c**.


    +   (TAB)cc -c chicago.c

    +   This is an *action line*, showing that **chicago.o** is produced by compiling
    **chicago.c** using **cc** with the **-c** option.


    +   clean:

    +   This dependency line indicates that “clean” does not depend on any file. It
    is an example of an *empty dependency*. In this case, “clean” is not the name
    of a file, but rather a command, which you would run by typing


    $ make clean (Return)

    *make* will then look through *makefile*, find the empty dependency “clean,” and
    run the command on the next action line.


    +   (TAB)rm *.o

    +   This action line will remove any files ending in .o—in other words, the object
    files. This is the action that *make* will perform when you type


    $ make clean (Return)'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'G.2  Running make


    The first thing to do with make is to remove the executable and object files that
    were produced when you compiled the Trip program the first time. Try the 1s command
    to see the files in Trip:


    ```

    $ ls (Return)

    ```


    You should see something like this:


    ```

    a.out    indiana.c    indy.o     main.o

    chicago.c  indiana.o    main.c    makefile

    chicago.o  indy.c

    ```


    Now get rid of the old object files:


    ```

    $ make clean (Return)

    ```


    The "clean" dependency line in makefile causes the following command line to run:


    ```

    rm *.o

    ```


    Use the 1s command now to list the files remaining in Trip:


    ```

    $ 1s (Return)

    ```


    You should see:


    ```

    a.out    indiana.c    main.c

    chicago.c  indy.c     makefile

    ```


    Note that make did nothing to the old executable file a.out, because it was not
    instructed to do so.


    Next, use make to compile the program. Simply type make and press (Return):


    ```

    $ make (Return)

    ```


    make then follows the instructions in makefile to compile the program:


    ```

    cc -c main.c

    cc -c chicago.c

    cc -c indiana.c

    cc -c indy.c

    cc -o trip main.o chicago.o indiana.o indy.o

    ```


    Note that the files are not necessarily compiled in exactly the same order as
    they appear in makefile; instead, make figures out which files should be compiled
    first. Try the 1s command to see the files in Trip:


    ```

    $ 1s (Return)

    ```'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# # MAINTAINING PROGRAMS WITH MAKE


    G.2 *Running make*


    You should see something like this:


    a.out indiana.c indy.o makefile

    chicago.c indiana.o main.c trip

    chicago.o indy.c main.o


    trip contains the new executable code, which you can run simply by typing *trip*,
    followed by **Return**:


    ```

    $ trip**Return**

    ```


    The advantage of using *make* to compile the files becomes apparent when you begin
    making alterations in any of the source files. When you are finished, all you
    have to do is type *make*, and *make* will automatically recompile only those
    files that need it. And if you have not made any changes in the program, *make*
    will take no action. To see how this works, try running *make* again:


    ```

    $ make**Return**

    ```


    Assuming you have not made any changes in the files, you should see a message
    such as


    ''trip'' is up to date. **Return**'
  merge: -1
  img_proc: true
