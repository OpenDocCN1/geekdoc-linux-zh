    # 4.15 Minimizing and Restoring a Window


    In Motif, Minimize means iconify a window. Close means eliminate the window.


    Under the Motif Window Manager, the **Minimize** command on the Window menu converts
    the window into an icon. This is sometimes called “iconifying” the window. This
    operation is not to be confused with the Close command, which eliminates the window
    entirely. (Not all window managers conform to this usage. If you use a different
    window manager, you may find that the Close command iconifies the window.)


    +   1 **Select one of the xterm windows to be the active window.**


    +   2 **Open the window menu.** Remember, this is done by clicking on the window
    menu button in the upper left-hand corner of the window frame.


    +   3 **Select the Minimize option.** The window will shrink to an icon.


    +   4 **Double-click on the icon.** This will restore the window to its previous
    size.


    # 4.16 Changing Your Password


    Review Section 2.3 on selecting a password.


    A good password is one that is easy for you to remember but difficult for someone
    else to figure out. Often the initial passwords assigned by system administrators
    fail these criteria. It is a good idea to change your password frequently to prevent
    unauthorized use of your account. If you have not already done so, you should
    take a minute to think about a password.


