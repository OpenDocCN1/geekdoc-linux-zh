- pgno: 33
  md: '# # 3 TUTORIAL: GETTING STARTED


    In this chapter, you will learn how to log into your UNIX account, change your
    password, and try out some UNIX commands, using a character-based terminal. If
    you are working with an X terminal or workstation, you may wish to skip this chapter
    and go on to Chapter 4.


    If you haven’t done so already, ask your instructor, system administrator, or
    consultant about setting up an account. You will need the following information:


    +   - Your login name

    +   - Your password

    +   - The name of the computer you will be using


    # ### 3.1 Switching on the Power


    Skip to Section 3.2 if your terminal is already on.


    Some terminals are meant to be left on at all times, and should not be turned
    off. You cannot always tell by looking at the screen—your system may have a screen-saver
    program that blanks the display when it has been idle for a time. Therefore, the
    first step is to try to “wake up” the screen:


    +   1. **Press the spacebar or (RETURN) key.** This is usually enough to cancel
    the screen-saver. If it does, go on to Section 3.2, “Obtaining a Login Prompt.”

    +   2. **Find the power switch and turn it on.** The switch may be hidden under
    the front edge of the keyboard or on the back panel of the terminal. (See if you
    can find the power cord—the switch may be close to the point where the cord enters
    the terminal.) Turn on the terminal.

    +   3. **Allow the terminal to warm up.** After a while, you should see a small,
    blinking line or rectangle on the terminal screen. This is the cursor. It shows
    where the next typed character will appear.'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# 3.2 Obtaining a Login Prompt\n\nNow you must get the computer's attention.\
    \ What you want is for the computer to show you a *login prompt*, indicating that\
    \ it is ready for you to log in:\n\nlogin:\n\nHow you get a login prompt depends\
    \ on whether your terminal is connected to one or many computer hosts. If your\
    \ terminal is connected to one host, try the following procedure for obtaining\
    \ a login prompt:\n\n+   1.  Press **RETURN** several times. This may be enough\
    \ to cause the computer to display a login prompt: (RETURN)\n+       login:\n\n\
    +   2.  If the login prompt does not appear, try pressing **BREAK** or **RESET**.\
    \ Some systems may require that you press **BREAK** then **RETURN**. (BREAK) (RESET)\
    \ (BREAK) (RETURN)\n\n+   3.  If Steps 1 and 2 do not work, see your system administrator.\n\
    +   \n+   If your terminal is connected to a terminal server, it will be necessary\
    \ for you to select a host computer. How this is done depends on your system.\
    \ The following procedure is fairly typical:\n\n+   1.  Press **RETURN** several\
    \ times. Often this will suffice to get the terminal server to display its prompt.\
    \ Terminal-server prompts vary from system to system; here are some examples:\
    \ (RETURN)\n+       Which computer?\n+       Dial:\n+       UNIVERSITY-NET>\n\n\
    +   2.  Enter the name of the host computer at the prompt. If you wanted to work\
    \ with a machine named merlin, you would enter this name at the prompt: Which\
    \ computer?merlin**RETURN**\n+       The chosen host computer should respond with\
    \ a login prompt: (RETURN)\n+       login:\n\n+   3.  If Steps 1 and 2 do not\
    \ work, consult your system administrator.\n\n# 3.3 Logging In\n\nIf you have\
    \ reached this point, you should see a login prompt on the screen:\nlogin:\n\n\
    \n\nIf you already see this on the terminal screen, skip to Section 3.3."
  merge: -1
  img_proc: true
- pgno: 35
  md: '# GETTING STARTED

    3.4 Messages


    +   1. **Enter your login name and press RETURN**. If your login name were jsmith,
    you would enter this after the prompt:


    log in: jsmith (RETURN)


    Do not enter jsmith (unless that is your login). Enter your login here.


    The computer will respond by prompting you for your password:


    password:


    +   2. **Enter your password and press RETURN**.


    password:


    Enter your password here; it will not appear on the screen.


    Note that YOUR PASSWORD DOES NOT APPEAR ON THE SCREEN. The idea is to prevent
    others from looking over your shoulder and learning your password. (You will see
    how to change the password later.)


    +   3. **If you made an error typing either your login name or password, repeat
    Steps 1 and 2.** The computer will tell you that your login is incorrect, and
    it will give you the chance to log in again:


    Login incorrect

    log in:


    # 3.4 Messages


    Once you gain access to the computer, it may print a variety of messages, including


    +   - Type of UNIX.

    +   - Message of the day from the system administrator.

    +   - Mail alert, telling you there is electronic mail waiting for you.


    If you have mail, you will see how to read it later.


    # 3.5 Setting the Terminal Type


    Some UNIX systems are set up to ask you to specify your terminal type when you
    log in. If yours is such a system, it will show you a prompt like


    Set terminal type (vt100):


    Or perhaps


    TERM (vt100):'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'The **terminfo** code in the parentheses represents the *default terminal type*;
    the computer assumes that this is the terminal you are using.


    1. **If your terminal matches the default type, simply press \[RETURN\]** . Then
    skip to the next section, “UNIX Shell Prompt.”


    2. **Otherwise, enter the terminfo code for the type of terminal you are using.**
    (This is something you should have obtained from your system administrator.) Be
    sure to press \[RETURN\] after the code.


    # ## 3.6 UNIX Shell Prompt


    At this point, you should see a *shell prompt*, which is simply the shell’s way
    of telling you that it is ready to receive your instructions. If your login shell
    is the C Shell, the prompt is probably a percent sign:


    ```

    %

    ```


    If you are using the Bourne Shell or the Korn Shell as a login shell, the usual
    prompt is a dollar sign:


    ```

    $

    ```


    Other symbols are occasionally used for shell prompts, including the pound sign
    (#), the “greater than” sign (>), the asterisk (*), the “at” symbol (@), and the
    colon (:).


    Some systems are set up to include the host name as part of the prompt, like this:


    ```

    merlin %

    ```


    In this book, we will use the following as our “generic” prompt, to take the place
    of either the percent sign or the dollar sign:


    *In the examples that follow, do not enter the prompt symbol.*


    ```

    $

    ```


    # ## 3.7 Terminal Troubles


    Sometimes your terminal will not behave as you expect it to. Two problems are
    especially common:


    +   *   *Everything you type appears in uppercase letters.* The UNIX system acts
    as if your terminal cannot handle lowercase letters.

    +   *   *The usual erase key does not work.* For example, you may wish to use
    the \[BACKSPACE\] key to erase characters.


    If either of these problems occurs, you should refer to Appendix A, “Taming Your
    Terminal.”'
  merge: -1
  img_proc: true
- pgno: 37
  md: "# ### 3.8 Changing Your Password\n\nA good password is one that is easy for\
    \ you to remember but difficult for someone else to figure out. Often the initial\
    \ passwords assigned by system administrators fail these criteria. It is a good\
    \ idea to change your password frequently to prevent unauthorized use of your\
    \ account. If you have not already done so, you should take a minute to think\
    \ about a password.\n\n+   1.  **Enter the `passwd` command at the shell prompt.**\
    \ Note that this is `passwd`, not `password`:\n+   \n+       $ `passwd` (RETURN)\n\
    \nThe system will prompt for your old password:\n\nOld password:\n\n+   2.  **Enter\
    \ your old password, then press (RETURN).** As usual, your password will not appear\
    \ on the screen:\n+   \n+       Old password: `████████`\n\nThe computer will\
    \ then ask you to enter your new password:\n\nNew password:\n\n+   3.  **Enter\
    \ your new password, then press (RETURN).** As usual, your password will not appear\
    \ on the screen:\n+   \n+       New password: `████████`\n\nTo ensure that you\
    \ have made no mistakes, the computer will ask you to repeat your new password:\n\
    \nRetype new password:\n\n+   4.  **Repeat your new password.** If this is not\
    \ done exactly as before, the system will not accept the new password, and you\
    \ will have to start over:\n+   \n+       Retype new password: `████████`\n\n\
    You will know that the new password has been accepted when the shell prompt appears:\n\
    \n```\n$\n```"
  merge: -1
