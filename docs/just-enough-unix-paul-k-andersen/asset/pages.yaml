- pgno: 150
  md: '# **A Brief History of the Internet**


    What is now known as the Internet originated in work sponsored by the Advanced
    Research Projects Agency (ARPA), an agency of the U.S. Department of Defense.
    In the late 1960s, ARPA became interested in creating a long-distance network
    that could function even when some of its nodes were disabled (such as might happen
    in a war or other national emergency). The proposed network would use a communication
    method called *packet-switching*, in which messages are broken into units called
    *packets* and sent over the network, to be reassembled at their destinations.
    If part of the network fails, the packets are automatically rerouted to a working
    part of the system.


    ARPA awarded a contract to Bolt Beranek and Newman, a Massachusetts consulting
    firm, to develop software for a new packet-switching network. ARPANET, as it was
    called, began operations in 1969. It initially linked four computers located at
    UCLA, Stanford, UC Santa Barbara, and the University of Utah. Other hosts were
    soon added, at a rate of about twenty per year throughout the 1970s.


    A vital step in the development of the Internet occurred in 1974. Vinton Cerf
    and Robert Kahn described how computers could communicate using *TCP/IP* (Transmission
    Control Protocol/Internet Protocol). These protocols were tested on the ARPANET,
    and would in time become the basis for the worldwide Internet.


    Although funded by the Defense Department, ARPANET remained essentially a civilian
    research project. As such, it was not really suited for the day-to-day requirements
    of the armed forces. A separate military network named MILNET was formed in 1983.
    Three years later, in 1986, the National Science Foundation (NSF) created the
    NSFNET to provide access to five national supercomputing centers. NSFNET featured
    a high-speed, transcontinental backbone.


    ARPANET, MILNET, and NSFNET were funded and administered by different agencies;
    however, they were also interconnected, and it became common to think of them
    as a single entity. In 1991, Congress made it official by passing the High-Performance
    Computing Act, which combined all of the government-sponsored networks into one
    National Research and Education Network, or NREN.


    The National Information Infrastructure Act was passed in 1993 to promote private-sector
    development of the Internet. Government funding was reduced, and the cost of maintaining
    the Internet backbone was shifted to commercial operators such as MCI, Sprint,
    and America Online.


    The recent growth of the Internet has been phenomenal. It took twenty years to
    reach 100,000 hosts, but less than three more years to exceed 1 million hosts.
    Since then, the number of hosts has been doubling every year or so, with no end
    in sight.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 13.3 Internet Protocols


    Nearly every type of computer system can communicate over the Internet. This is
    possible only because everyone using the Internet has agreed to observe certain
    communications rules, or protocols, which govern how messages are sent, received,
    and interpreted. The most important of these are the Transmission Control Protocol
    (TCP) and the Internet Protocol (IP), which are usually lumped together and referred
    to by their acronyms: TCP/IP.


    TCP and IP are designed for communication over dedicated, high-speed transmission
    lines. Two alternative protocols, which are intended to be used over conventional
    telephone lines, are the Serial Line Internet Protocol (SLIP) and the Point-to-Point
    Protocol (PPP). Many commercial Internet providers offer SLIP connections to users
    who do not need (or cannot afford) a full TCP/IP connection.


    # Other Notable Networks


    ARPANET was not open to the general public; most of its host computers belonged
    to defense contractors or universities doing government-funded research. But the
    researchers at ARPANET were not the only ones interested in networks. The 1970s
    and 1980s saw the development of a number of other WANs, some of which are still
    in existence:


    +   - **Telenet**. Not to be confused with the **telnet** program, Telenet was
    a commercial version of ARPANET created in 1974.

    +   - **Usenet**. Begun in 1979 as an "electronic bulletin board" for sharing
    information between Duke University and the University of North Carolina, Usenet
    grew into a decentralized network connecting more than 200,000 UNIX users worldwide.
    Usenet is best known for its electronic news groups.

    +   - **BITNET**. The name is short for "Because It''s Time Network". BITNET was
    started at the City University of New York (CUNY) in 1981. It has since expanded
    to include more than 2,000 computers around the world. BITNET handles electronic
    mail, terminal-to-terminal messages, and file transfers.

    +   - **uucp**. The abbreviation uucp is short for "UNIX to UNIX copy." This is
    not really a network, but rather a set of programs designed for distributing UNIX
    software updates and electronic mail over ordinary long-distance telephone lines.
    However, some people do talk of the "uucp network."'
  merge: -1
  img_proc: true
