- pgno: 124
  md: 'The unnamed buffer is sometimes called the general-purpose buffer. When you
    change or delete text, the old text is not thrown away immediately. Instead, vi
    moves the old material into the unnamed buffer, and holds it there until you change
    or delete more material. The advantage of this is that it allows you to change
    your mind and restore the deleted text using the “undo” command:


    ```

    u

    ```


    This puts the old text back where it came from. Since vi has only one unnamed
    buffer, the undo command can only restore the most recent change you made; previous
    changes are lost.


    The named buffers and numbered buffers are useful for moving blocks of text around
    a file or between different files. In Chapter 12, for example, you will move four
    lines of text from one place in a file to another. You will do this by positioning
    the cursor at the beginning of the block of text and issuing the command


    ```

    "a4yy

    ```


    This is best understood when read backwards: yy stands for “yank,” which means
    in this case “copy”; the 4 refers to four lines of text; and “a (double quote-a)
    specifies a particular named buffer. Therefore, this command tells vi to copy
    four lines of text and place them in the named buffer “a.”


    To retrieve the text from the named buffer, place the cursor where you want the
    text to go and type the command


    ```

    "ap

    ```


    which tells vi to “put” a copy of the contents of the named buffer “a” into the
    work buffer.


    Remember that buffers are only temporary storage locations; their contents are
    lost once you leave vi.


    # 10.7 Spell and Look


    For the benefit of people who occasionally misspell words, UNIX offers the spell
    utility. (Strictly speaking, spell is not a part of vi, but we’ll discuss it here
    because you’ll most often use spell and vi together.) spell goes through a file
    and checks every word against the UNIX word list (sometimes called a “dictionary”).
    When spell encounters words or groups of characters that are not on the word list,
    it displays them on the screen.


    Although spell is very useful, it has its limitations. It cannot detect grammatical
    errors or words used incorrectly. (Few spelling checkers can.) Thus if you wrote
    “up” when you meant “down,” or “wait” instead of “weight,” spell cannot help you.'
  merge: -1
  img_proc: true
