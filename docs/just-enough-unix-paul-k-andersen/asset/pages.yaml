- pgno: 147
  md: '# 13 UNIX Networking


    A network is a group of computers that are interconnected to share information
    and resources. In this chapter, you will learn about networking of computers.
    You will also learn about various programs that allow you to communicate with
    other computer users.


    # 13.1 Local Area Networks (LANs)


    Computer networks are often classified according to size and geographical coverage.
    A Local Area Network or LAN consists of computers that are close to one another—often
    in the same building.


    As shown in Figure 13–1, local area networks can be laid out in a variety of configurations,
    which are often called topologies. Each of these arrangements has its advantages
    and drawbacks; however, from the standpoint of the average computer user, they
    all appear to be very similar.


    There is no generally accepted definition of how “local” a network must be to
    qualify as a local area network. Some LANs may be large enough to span a university
    campus or an entire city—although you may occasionally hear the terms Campus Area
    Network (CAN) or Metropolitan Area Network (MAN) used to describe these networks.
    Any network larger than this is generally called a Wide Area Network or WAN.


    The most common way to create a WAN is by linking together two or more LANs, as
    shown in Figure 13–2. The LANs may be located at widely separated sites, perhaps
    in different cities or even on different continents. Each LAN is equipped with
    a special-purpose computer called a gateway to handle communications with the
    other LANs making up the network. In many cases, the gateways communicate over
    a high-speed data channel called a backbone.'
  merge: -1
  img_proc: true
- pgno: 148
  md: "![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_148_0.png)\n\nFigure 13-1  \n*Typical\
    \ topologies for local area networks (LANs).*\n\n# **13.2** The Internet\n\nAn\
    \ Internet is a network of networks.\n\nThe linking together of networks to form\
    \ larger networks is called *internetworking*. Networks created this way can themselves\
    \ be linked together to form still larger networks. The end result of this process,\
    \ repeated many times, has been the creation of a super-internetwork called the\
    \ *Internet*. It is now connected to thousands of other networks around the world.\
    \ The Internet permits users to exchange electronic mail, to transfer files, and\
    \ to log in and work on remote machines almost anywhere on earth.\n\nThe Internet\
    \ grew out of a government research project. (See “A Brief History of the Internet.”)\
    \ But the government does not own the Internet. In fact, no one “owns” any more\
    \ of the Internet than their particular LAN or WAN. Nor is there a president,"
  merge: -1
  img_proc: true
