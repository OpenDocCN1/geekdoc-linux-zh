    | CPU | word size | kernel |

    | main memory | clock speed | shell |

    | secondary memory | flops | file |

    | mass storage | MIPS | file system |

    | external memory | server | directory |

    | I/O device | client | utility |

    | peripheral | host | command |

    | network | operating system | window |

    | bit | proprietary | GUI |

    | byte | portable | icon |

    | kilo- | open | window manager |


    +   2. What are the four main hardware components of most computer systems?


    +   3. What are the main components of the UNIX operating system?


    +   4. Name the three most commonly used X window managers.


    +   5. Name the three most common UNIX shells.


    +   6. When referring to the capacity of a computer’s memory, computer scientists
    often use prefixes like kilo-, mega-, and giga- only approximately. For example,
    a kilobyte of memory is not exactly 1,000 bytes, but rather $2^{10}$ bytes. Likewise,
    a megabyte is really $2^{20}$ bytes, and a gigabyte is really $2^{30}$ bytes.
    What is the difference between a thousand and $2^{10}$? A million ($10^6$) and
