  md: '# PROGRAMMING IN C


    # 26.3 Review of the Compilation Process


    +   2. Compile the source code. The standard C compiler is called `cc`. To compile
    the file, simply type `cc` followed by the name of the file. Remember that the
    file name must end in `.c`:

    +      `$ cc hello.c <Return>`


    +   3. If necessary, correct any compiler errors and repeat Step 2. If the compiler
    cannot compile your code because of syntax errors, it will try to tell you where
    the errors are located. Reopen the file and correct the errors.


    +   4. Run the program. By default, the linker gives the name `a.out` to the executable
    file. To run the program, type

    +      `$ a.out <Return>`

    +      You should see the message

    +      `Hello, world!`

    +      `$`

    +      The shell prompt appears when the program finishes, indicating that the
    shell is ready for your next command.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_279_0.png)


    # 26.3

    Review of the Compilation Process


    Recall the command you used to compile the `hello.c` program:

    `$ cc hello.c <Return>`


    The `cc` command appears simple, but it starts a fairly complicated chain of events
    involving three separate programs:


    +   1. The C preprocessor goes through the file `hello.c` and looks for preprocessor
    directives, which are marked by a leading pound sign (`#`). The preprocessor makes
    the requested changes and passes the altered code to the compiler.

