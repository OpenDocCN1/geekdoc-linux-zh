- pgno: 159
  md: '# 14 TUTORIAL: USING ELECTRONIC MAIL


    In this chapter, you will see how to use the standard UNIX mail programs `Mail`
    and `mailx` to send and receive text messages.


    One source of confusion is that on some systems, the `mail` command calls up either
    `Mail` or `mailx`; on other systems, the `mail` command calls up the older UNIX
    mail program.


    # 14.1 Sending Electronic Mail


    If you are just getting started with a new UNIX account, it is unlikely that anyone
    has sent you e-mail yet. However, you can start by sending messages to yourself.


    +   1 Enter the Mail command, followed by the mail address of the recipient. If
    you are using AT&T UNIX, try the `mailx` program:


    ```

    $ mailx address

    ```


    Enter the recipient''s mail address here.


    If you are using BSD UNIX, type


    ```

    $ Mail address

    ```


    Enter the recipient''s mail address here.


    The computer will prompt you for the subject of the message:


    ```

    Subject:

    ```


    +   2 Specify a subject. Enter a short description or title for your message:


    ```

    Subject: Test Message #1

    ```


    +   3 Enter the body of the message. The mail program has only limited editing
    capabilities: you can edit only one line at a time, and you cannot go back to
    edit a'
  merge: -1
  img_proc: true
