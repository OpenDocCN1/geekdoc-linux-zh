- pgno: 271
  md: "# # 25 PROGRAMMING UNDER UNIX\n\nUNIX was originally written by professional\
    \ programmers for the use of other pro- \nprofessional programmers. It is not\
    \ surprising, therefore, that UNIX provides a number \nof excellent programming\
    \ tools. Traditionally, UNIX systems have come equipped \nwith the C programming\
    \ language. (UNIX itself is written in C.) Many UNIX sys- \ntems also offer the\
    \ Fortran and Pascal languages, and other languages as well.\n\nIn this chapter,\
    \ we will see how Fortran, Pascal, and C programs can be written and \nrun under\
    \ UNIX.\n\n# ## 25.1 Programming Languages\n\n*A computer program* is a set of\
    \ coded instructions that tell the computer how to per- \nform some task. Computers\
    \ do not (yet) understand English or any other human lan- \nguage. Instead, computers\
    \ respond to what is called *machine language*, in which \neverything is represented\
    \ by binary numbers—combinations of 0s and 1s. Consider, \nfor example, how a\
    \ segment of a program might appear in binary form:\n\n```\n```text\n00000000011000110000000000000011000\n\
    00000000000000000000111000000010010\n00000000011100010000110000001000000\n00100000110001100000000000000000001\n\
    ```\n```\n\nObviously, it would be tedious to program in a binary code such as\
    \ this. A better al- \nternative would be to program in *assembly language*, which\
    \ represents each of the \nmachine's binary instructions symbolically. For example,\
    \ the previous four lines of \nbinary code might be represented by the following\
    \ four lines of assembly language:\n\n```\n```text\nmult $6, $6\nmflo $7\nadd\
    \ $2, $7, $2\naddi $6, $6, 1\n```\n```"
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Assembly language is clearly a step up from binary, but it is still fairly
    difficult to master. Moreover, programs written in assembly language are not portable
    because every type of computer has its own assembly language.


    Fortunately, high-level programming languages are available that make programming
    much easier. For example, the previous assembly-language code could be written
    in the C programming language like this:


    ```

    sum = sum + i * i ;

    i = i + 1 ;

    ```


    Not only is this much easier to write and understand than the assembly-language
    code; it is also much more portable because C programs can be run on nearly any
    kind of computer.


    # 25.2 Program Design


    The first step in creating a program is to design it. That is, you plan what the
    program is to do, and how. This is perhaps the most important and the most difficult
    part of programming. Entire volumes have been devoted to this topic; obviously,
    we can only scratch the surface in this short book.


    Program design often begins with the definition of the problem to be solved. To
    illustrate, let’s see how we would design a program to calculate the reciprocal
    of a number. The problem is simple to define:


    > Problem: Create a program to calculate the reciprocals of numbers entered by
    the user at the keyboard; display the results on the terminal screen.


    A common tool used in program design is *pseudocode*, which is an outline of the
    code written in abbreviated English. Pseudocode is laid out to resemble the structure
    of the actual program. Thus, the pseudocode for our reciprocal program might be:


    ```

    prompt the user for a number x

    read x

    calculate 1/x

    display the answer

    ```


    # 25.3 Source Code


    Once you are satisfied with your program design, you can begin to write the solution
    to the problem using a programming language. Listing 25-1 shows how the reciprocal
    program might appear when written in C.'
  merge: -1
  img_proc: true
- pgno: 273
  md: "+   Listing 25-1\n+   C code for computing reciprocals.\n\n```\n/* Compute\
    \ reciprocals */\n\n#include <stdio.h>\n\nmain()\n{\n    double x, recip;\n  \
    \  printf(\"This program computes reciprocals.\\n\");\n    printf(\"Enter a number:\
    \ \");\n    scanf(\"%lf\", &x);\n    recip = 1.0/x;\n    printf(\"The reciprocal\
    \ of %f is %f.\\n\", x, recip);\n}\n```\n\nA program written in a high-level language\
    \ is often called source code. Typically, you will use a text editor such as vi\
    \ to prepare a file containing the source code. You will follow the usual naming\
    \ rules for this file, but with one additional rule: files containing source code\
    \ always have a suffix that indicates the language in which they are written.\
    \ The suffix .c indicates C-language source code, the suffix .p indicates Pascal\
    \ source code, and the suffix .f indicates Fortran code. Thus, for our program\
    \ to compute reciprocals, we might have\n\nrecip.c (C version)\n\nrecip.p (Pascal\
    \ version)\n\nrecip.f (Fortran version)\n\n# 25.4 Compiling and Linking\n\n+ \
    \  Neither Fortran nor Pascal has a preprocessor.\n\nOnce you have finished the\
    \ source code, you must translate it into machine language. This is called compiling\
    \ the code, and the program that performs this task is called a compiler. If you\
    \ are programming in C, compilation is actually a three-step process:\n\n+   1.\
    \ Preprocessing. The preprocessor goes through your source code and makes certain\
    \ changes to the code.\n+   2. Compilation. The compiler translates your modified\
    \ source code into machine language. The output from the compiler is called object\
    \ code.\n+   3. Linking. Although object code consists of machine language, it\
    \ is not yet a complete program. The linker combines your object code with code\
    \ from the system software libraries to produce executable code."
  merge: -1
  img_proc: true
- pgno: 274
  md: 'The computer cannot think, so you have to do the thinking for it.


    Runtime errors are more commonly called *bugs*.


    # 25.5 Program Execution


    The file containing the executable code is given the name a.out by the linker
    (unless you specify another name). To execute the program, all you have to do
    is type


    ```

    $ a.out<Return>

    ```


    If you *want* to save the executable code, you can use the mv command to give
    this file an appropriate name.


    # 25.6 Errors


    The easiest thing about programming is making errors. Programming errors come
    in several varieties:


    +   • Logic errors. The computer does what you tell it to do, not what you want
    it to do. If you specify the wrong way to solve the problem—if you multiply when
    you should have divided, for instance—your program may run and produce output,
    but the output will not be correct.


    +   • Syntax errors. A syntax error results when you violate one of the rules
    of the programming language. Such errors are often called compilation errors because
    they will be detected by the compiler when you try to compile the program.


    +   • Runtime errors. More insidious than syntax errors are those errors that
    escape detection by the compiler. These are called runtime errors because they
    usually are not discovered until you run the program a few times. (And perhaps
    not even then—many runtime errors are never tracked down.)


    # 25.7 Debugging


    A serious runtime error, such as dividing by zero or taking the square root of
    a negative number, may cause the program to crash. When this happens, the program
    quits running and the UNIX shell sends you an error message of some sort. Usually,
    these messages are not very informative: they tell you that the program crashed,
    but they don’t always tell you the reason.


    When a program aborts because of a runtime error, the system produces a core dump,
    which is a file containing a “snapshot” of the main memory at the time the program
    failed. This is put into a file named core.


    The core file contains machine code, so it is not something you would try to read
    directly yourself. However, most UNIX systems include special programs called
    debuggers that are designed to help you exterminate bugs in your programs. A debugger
    can use the information in the core file to determine what the bug was and'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'where it occurred. One debugger found on many UNIX systems is called dbx; it
    is described in Appendix F.


    # 25.8 The make Utility


    When writing large programs, it is the usual practice to divide the source code
    up among several different files. This allows different programmers to work on
    different parts of the program. It is also more efficient to change and recompile
    one part of the program at a time, rather than having to compile the entire program
    whenever a small change is made. The make program is used to keep track of the
    files making up a large program and to recompile parts of the program as needed.
    Although **make** is most often used with programs, it can also be useful in updating
    any project consisting of multiple files.


    # 25.9 Other Programming Tools


    Most UNIX systems come equipped with a battery of programming utilities, most
    of which are designed for use in creating C programs:


    | Utility | Description | Function |

    | :--- | :--- | :--- |

    | cb | C beautifier | Formats C source code |

    | cflow | Flow analyzer | Shows flow of control in C programs |

    | ctrace | Execution tracer | Traces execution of a C program |

    | cxref | C tracer | Lists references to variables in C programs |

    | lint | C verifier | Warns of potential bugs, portability problems |

    | prof | Profiler | Tests efficiency |

    | time | Program timer | Times program execution |

    | timex | Program timer | Times program execution |'
