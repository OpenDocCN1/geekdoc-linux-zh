- pgno: 293
  md: '# # 27 TUTORIAL: PROGRAMMING IN FORTRAN


    > It is a good idea to keep a Fortran book handy as you read through this chapter.


    Fortran ("FORmula TRANslation") was one of the first and most successful programming
    languages. Although it was developed in the 1950s, it has been repeatedly updated
    over the years, and it is still popular with scientists and engineers. The latest
    version of Fortran is called Fortran 90; however, the most widely used version
    is still Fortran 77. Neither Fortran 77 nor Fortran 90 is a standard part of UNIX,
    but one or both are often found on UNIX systems.


    In this chapter, you will see how to write, compile, and run Fortran 77 programs
    on a UNIX system. This is not intended to teach you Fortran; for that, you should
    consult a standard text on Fortran.


    # ## 27.1 The hello.f Program


    We will begin with the program shown in Listing 27-1, which prints a message on
    the standard output.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_293_0.png)


    ```

    * First Fortran program.

    *234567


    PROGRAM HELLO

    WRITE(*,*) ''Hello, world!''

    END

    ```


    Let''s examine this program in more detail:


    +   * \* First Fortran program.


    Any line of text that begins with an asterisk (*) in the first column is treated
    as a comment and is ignored by the compiler. Comments are for the benefit of the
    programmer and anyone else who may read the program later.'
  merge: -1
  img_proc: true
- pgno: 294
  md: "+   * *234567*\n+     \n+     This is another comment line, included to help\
    \ you identify the first seven columns. Fortran 77 requires statements to begin\
    \ in the seventh column.\n+     \n+   * **PROGRAM** HELLO\n+     \n+     The **PROGRAM**\
    \ statement marks the beginning of the program and gives the program a name (**HELLO**).\
    \ Traditionally, Fortran statements have been written entirely in uppercase letters,\
    \ and this practice continues, although many Fortran compilers also will accept\
    \ lowercase letters. Thus, on many compilers the **PROGRAM** statement could also\
    \ be written as **program** **hello**.\n+     \n+   * **WRITE**(*,*) 'Hello, world!'\n\
    +     \n+     The **WRITE** statement is used to print output on the screen.\n\
    +     \n+   * **END**\n+     \n+     The **END** statement marks the end of the\
    \ program.\n\n# 27.2 Creating and Running hello.f\n\n+   1. **Create a source\
    \ file.** Use the vi editor to create a file named `hello.f`.\n+   \n+       \
    \  $ vi hello.f (Return)\n+   \n+         Enter the program exactly as shown in\
    \ Listing 27-1, then write to the file and quit the editor.\n+   \n+   2. **Compile\
    \ the source code.** The standard Fortran compiler is called **f77**. To compile\
    \ the file, simply type **f77** followed by the name of the file. Remember that\
    \ the file name must end in `.f`.\n+   \n+         $ f77 hello.f (Return)\n+ \
    \  \n+   3. **If necessary, correct any compiler errors and repeat Step 2.** If\
    \ the compiler cannot compile your code because of syntax errors, it will try\
    \ to tell you where the errors are located. Reopen the file and correct the errors.\n\
