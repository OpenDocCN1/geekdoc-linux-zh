    **rec**  The **rec** ("recreation") hierarchy comprises newsgroups dedicated to
    hobbies, sports, arts, and other avocations. A few of the **rec** newsgroups are

    `rec.arts.tv`  `rec.humor`

    `rec.birds`  `rec.music.classical`

    `rec.games.chess`  `rec.scuba`


    **sci**  The **sci** ("science") hierarchy includes newsgroups that deal with
    scientific and research issues. Here are some typical newsgroups in this hierarchy:

    `sci.astronomy`  `sci.lan.japan`

    `sci.bio.technology`  `sci.skeptic`

    `sci.engr.chem`  `sci.math.symbolic`


    **soc**  Newsgroups dealing with social issues are found in the **soc** hierarchy.
    Here is a random sample of the newsgroups in this hierarchy:

    `soc.couples`  `soc.misc`

    `soc.culture.jewish`  `soc.politics`

    `soc.men`  `soc.women`


    **talk**  The newsgroups in the **talk** hierarchy provide a place for people
    to debate, converse, exchange information, or just sound off:

    `talk.bizarre`  `talk.religion.misc`

    `talk.philosophy.misc`  `talk.politics.misc`


    # **17.2  Other Newsgroups and Hierarchies**


    The seven major hierarchies described in the previous section form the core of
    the Usenet, and are widely available. There are a number of other hierarchies
    that may or may not be available on your system; the decision is usually up to
    your system administrator. Here are some of the most common popular alternative
    hierarchies:


    **alt**  This hierarchy includes "alternative" newsgroups. These cover a wide
    range of interests, as you can see by the following sample:

    `alt.angst`  `alt.personals`

    `alt.books.reviews`  `alt.postmodern`

    `alt.fishing`  `alt.religion.computers`

    `alt.individualism`  `alt.stupidity`


    **biz**  The **biz** ("business") hierarchy consists of groups that discuss business
    issues. Unlike other newsgroups, many of the **biz** groups allow postings of


    Your system administrator decides which newsgroups to make available.'
