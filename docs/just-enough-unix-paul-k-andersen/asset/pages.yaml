    1 Move the pointer to the window menu button. This button is found at the upper
    left corner of the xterm window:


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_48_0.png)


    2 Click once with the left mouse button. A menu will appear:


    +   - This is called a *pull-down menu* because you pull it down from the window
    frame.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_48_1.png)


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_48_2.png)


