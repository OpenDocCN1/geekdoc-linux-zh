    A *U* in the first column indicates an unread message left over from the last
    time you logged in; an *N* indicates a new message. The messages are numbered
    (from 1 to 3 in this case). The login name of the sender is shown, along with
    the date and time the message was received and the number of lines and characters
    the message contains (lines/characters). Finally, the subject of the message is
    given in quotes. The ampersand (&) on the last line is the *mail prompt*.


    +   2  **Read your message(s).** Simply enter the message number after the mail
    prompt and press (RETURN):


