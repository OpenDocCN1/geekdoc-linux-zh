- pgno: 278
  md: "Lines that begin with a pound sign (#) in the first column are taken to be\
    \ instructions to the preprocessor. These are usually called preprocessor directives\
    \ or control lines. In this case, the directive tells the preprocessor to include\
    \ the contents of the file stdio.h (“standard input/output header” file) in the\
    \ program before it is compiled. The angle brackets < > tell the preprocessor\
    \ to search for stdio.h in the “usual place,” which for most UNIX systems is the\
    \ directory /usr/include. You can also tell the preprocessor to include files\
    \ that you have written yourself, in which case you would surround the file’s\
    \ pathname by double quotes. Thus the line\n\n#include “/home/mylogin/myfile.h”\n\
    \nwould direct the preprocessor to include /home/mylogin/myfile.h in the program\
    \ before it is compiled.\n\n+   - main()\n\nC programs consist of one or more\
    \ units called functions. Every C program must include a function named main()\
    \ where execution begins. We know that main() is the name of a function because\
    \ of the parentheses.\n\n+   - {\n\nEach function body begins with a left brace.\
    \ Braces are also used within the function body to group lines of code together.\n\
    \n+   - printf(\"Hello, world!\\n\");\n+   \n+   printf() is a standard C library\
    \ function used to “print” output on the standard output. The argument to the\
    \ function is a group of characters enclosed by double quotes, which is called\
    \ a string constant or string literal. At the end of the string (but inside the\
    \ double quotes) are the two characters \\n, which together stand for a NEWLINE\
    \ or (Return). The entire line is terminated by a semicolon.\n\n+   - }\n\nThe\
    \ function body ends with a right brace, which matches the left brace at the beginning\
    \ of the function body. The compiler will consider it an error if you omit either\
    \ brace.\n\n# 26.2 Creating and Running hello.c\n\n+   1  Create a source file.\
    \ Use the vi editor to create a file named hello.c:\n+   \n+       $ vi hello.c\
    \ (Return)\n\nEnter the program exactly as shown in Listing 26-1, then write to\
    \ the file and quit the editor."
