  md: '# 24.3    Removing Files Safely: del


    The `rm` command can be very dangerous because it allows you to remove a file,
    but does not give you a way of getting back a file you may have removed accidentally.
    If you are a `csh` or `ksh` user, you can create an alias for the `rm` with the
    `-i` ("interactive") option; it will ask you if you are sure you want to remove
    the file in question. But `sh` does not allow aliases. Let’s create a script that
    will duplicate the effect of the `rm -i` command. The script will also tell what
    action has taken.


    +   Listing 24-3A

    +   Summary of the `del` script.


    ```

    ```

    NAME

    del - delete a file interactively

