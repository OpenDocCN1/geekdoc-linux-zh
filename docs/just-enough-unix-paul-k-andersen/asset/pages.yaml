- pgno: 188
  md: '# 16.12 **Uncompressing Files**


    Once the compressed file has been transferred to its destination, it must be uncompressed.
    The `uncompress` command is used to restore files that have been processed with
    `compress`. If you are working with a compressed `tar` file, you should `uncompress`
    it before untarring it.


    +   1. Enter the `uncompress` command, followed by the name of the file to be
    restored. The file should have the `.Z` suffix:

    +      ```

    +      $ uncompress marsupials.tar.Z (Return)

    +      ```


    +   2. List the files. The compressed file will be gone, replaced by its uncompressed
    version:

    +      ```

    +      $ ls (Return)

    +      marsupials.tar

    +      ```


    In this example, the uncompressed file is a `tar` file; you should restore it
    next.


    # 16.13 **Restoring tar Files**


    The `tar` command is used with the `-x` ("extract") option to restore an archive
    file:


    +   1. Enter the `Extract` command. Type `tar -xf`, followed by the name of the
    `tar` file and the name of the directory where you want the untarred file(s) to
    go:

    +      ```

    +      $ tar -xf marsupials.tar Marsupials (Return)

    +      ```


    +   2. List the files.

    +      ```

    +      $ ls (Return)

    +      Marsupials marsupials.tar

    +      ```

    +      Note that the `tar` file is not removed.


    # 16.14 **Finding Files witharchie**


    You now know how to retrieve and `uncompress` files from an anonymous `ftp` server,
    but how do you find the files you want? The `archie` program, developed at McGill
    University in Montreal, provides a way to search the anonymous `ftp` servers connected
    to the Internet.


    Perhaps the easiest way to run `archie` is from an Internet navigator such as
    `gopher` or a WWW browser. (`archie` is often available as a menu choice.) However,
    it is also possible to run `archie` from the UNIX command line; refer to your
    system manual if you are interested.'
  merge: -1
  img_proc: true
