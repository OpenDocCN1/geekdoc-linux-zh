- pgno: 307
  md: "+   Listing 28-2B\n+   Pascal code for the recip.p program.\n\n```\n{ Compute\
    \ reciprocals }\nprogram reciprocal(input, output);\nvar n, recip: integer;\n\
    begin\nwriteln('This program computes reciprocals.');\nwrite('Enter a number:\
    \ '); \nreadln(n);\nrecip := 1 div n;\nwriteln('The reciprocal of ', n, ' is ',\
    \ recip)\nend.\n```\n\nThis program introduces a few features that were not in\
    \ the previous program:\n\n+   *   `{ Compute reciprocals }`\n+   An alternative\
    \ way to write comments is to surround the comment with braces `{...}`.\n\n+ \
    \  *   `var n, recip: integer;`\n+   This is a **declaration**. It tells the compiler\
    \ to create two variables (var) to hold integers and to give them the names `n`\
    \ and `recip`. Pascal requires that you declare all variables before you use them.\
    \ A semicolon is placed at the end of this line to separate it from those that\
    \ follow.\n\n+   *   `write('Enter a number: ');`\n+   `write` is a standard Pascal\
    \ procedure, used to write output on the standard output. Unlike `writeln`, `write`\
    \ does not start a new line after it finishes printing.\n\n+   *   `readln(n);`\n\
    +   This `readln` statement obtains the user’s input from the standard input and\
    \ stores it in the variable `n`.\n\n+   *   `recip := 1 div n;`\n+   This line\
    \ computes the reciprocal. The computer first divides the integer `1` by the contents\
    \ of the variable `n`, then assigns the result to the variable `recip`. In Pascal,\
    \ `div` is used for dividing two integers. The pair of symbols `:=` is treated\
    \ as one operator, called the *assignment operator*. It assigns the value of the\
    \ expression `1 div n` to the variable `recip`.\n\n+   *   `writeln('The reciprocal\
    \ of ', n, ' is ', recip)`\n+   This is a `writeln` with four arguments. It will\
    \ print out the string `\"The reciprocal of \"`, followed by the value of the\
    \ variable `n`, the string `\" is \"`, and finally the value of the variable `recip`."
  merge: -1
  img_proc: true
