    \ its word list. Consequently, it will not detect words that are used out of context.\n\
    \n# ## 12.2 Looking up Words\n\nIf you are unsure of the spelling of a word, you\
    \ can use the `look` utility to check its spelling in the UNIX word list. Suppose\
    \ you wanted to know how to spell relief. Is it \"ri\" before \"ef\" or \"ef\"\
    \ before \"ri\"?\n\n+   *   At the UNIX shell prompt, type `look`, followed by\
    \ the word in question:\n+   \n+       ```\n+       $ look relief (Return)\n+\
    \       ```\n\nIf the word appears on the UNIX word list, look will print it on\
    \ the screen:\n\n```\nrelief\n```\n\nIf the word is not on the list, look will\
    \ print nothing. Instead, you will see the UNIX shell prompt:\n\n```\n$ \n```\n\
    \nYou can also use `look` to examine all of the words on the UNIX word list that\
    \ begin with a particular sequence of letters.\n\n+   *   At the UNIX shell prompt,\
    \ type `look`, followed by the prefix of interest.\n+       For example, to see\
    \ the words that begin with re, type\n+   \n+       ```\n+       $ look re (Return)\n\
    +       ```"
  merge: -1
