  md: '# ### 21.2 Showing the Value of a Variable with echo


    You can examine the values of these variables one at a time using the `echo` command.


    +   - **Enter the `echo` command, specifying the variable you wish to examine.**
    You must enter a dollar sign ($) as a prefix to the variable name. Thus, to view
    the contents of the PS2 variable, type


    ```

    $ echo $PS2 (Return)

    ```


    PS2 contains the secondary prompt. Its default value is


    ```

    >

    ```


    If you omit the dollar sign prefix, the *name* of the variable, not its contents,
    will be displayed:


    ```

    $ echo PS2 (Return)

    PS2

    ```


    # ### 21.3 The Secondary Prompt


    The secondary prompt is a symbol that indicates that the shell is waiting for
    you to finish an incomplete command line. In this section, you will see how this
    works.


    +   1. **Enter an incomplete command line.** Try the following line, making sure
    not to type any closing quotes:


    ```

    $ echo "This is an (Return)

    ```


    Because you did not provide the closing quotes, the shell assumes that there is
    more to come, and it displays the secondary prompt stored in PS2:


    ```

    >

    ```


    +   2. **Enter the rest of the command line.** Be sure to finish it off with double
    quotes, before pressing (Return):


    ```

    >incomplete command line." (Return)

    ```


    The shell will echo back the entire message:


    ```

    This is an incomplete command line.

    ```'
