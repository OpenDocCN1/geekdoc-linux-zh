  md: "14.5 \t **Reading Your Mail**\n\nYou can read the messages in your system mailbox\
    \ with the same electronic mail program that you used to send messages:\n\n1 \t\
    \ **Start the mail program without specifying a recipient**. How you do this depends\
    \ on whether your system uses `mail` or `mailx`:\n\n`$ mail` `Return`\n\nor\n\n\
    `$ mailx` `Return`\n\nThe mail program will list the messages in your system mailbox:\n\
    \n```\n```\n>U 1 yourlogin Thu Nov 22 15:27 11/321 \"Test Message\"\nN 2 yourlogin\
    \ Thu Nov 22 15:35 11/321 \"Test Message #2\"\nN 3 yourlogin Thu Nov 22 15:42\
    \ 20/442\n&\n```\n```\n\nThe `>` in the first column points to the current message.\
    \ A `U` indicates a previously unread message; `N` indicates a new message. The\
    \ messages are numbered (1 through 3 in this case). The login name and address\
    \ of the sender is shown, along with the date and time the message was received\
    \ and the number of lines and characters the message contains (lines/characters).\
    \ The subject of the message is given in quotes.\n\nThe ampersand (`&`) on the\
    \ last line is the *mail prompt*. It tells you that the mail program is awaiting\
    \ your instructions. Some systems use a question mark (`?`) as a prompt.\n\n2\
    \ \t **If necessary, list the next screenful of messages**. If there are too many\
    \ messages in your mailbox to list on one screen (perhaps because you have many\
    \ admirers or have not been keeping up with your mail), you can list the next\
    \ screenful by typing a `z` at the mail prompt:\n\n`&z` `Return`\n\nYou can list\
    \ the previous screenful of messages again by typing `z-` (`z` hyphen):\n\n`&z-`\
    \ `Return`\n\nTo list the current screenful of messages, enter `h` at the mail\
    \ prompt:\n\n`&h` `Return`\n\n3 \t **Select a message to read**. To do this, simply\
    \ type in the message number at the prompt and press `Return`. To see the second\
    \ message, for example, type\n\n`&2` `Return`"
  merge: -1
  img_proc: true
