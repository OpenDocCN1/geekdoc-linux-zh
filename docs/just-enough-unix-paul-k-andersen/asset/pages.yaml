  md: "# STARTUP FILES\n\n# 20.7 *The Search Path*\n\n# 20.7 The Search Path\n\nIn\
    \ Chapter 8, we summarized how the shell processes commands:\n\n+   1.  **The\
    \ shell displays a prompt symbol on the screen.** The prompt tells you the shell\
    \ is ready to receive your commands.  \n+   2.  **You type in a command.** As\
    \ you type, the system stores the characters and also echoes them back to the\
    \ terminal screen.  \n+   3.  **You type ⟨Return⟩.** This is the signal for the\
    \ shell to interpret the command and start working on it.  \n+   4.  **The shell\
    \ looks for the appropriate software to run your command.** In most cases, it\
    \ looks for a file having the same name as the command. If the shell can't find\
    \ the right software, it gives you an error message; otherwise, the shell asks\
    \ the kernel to run it.  \n+   5.  **The kernel runs the requested software.**\
    \ While the command is running, the shell \"goes to sleep.\" When the kernel finishes,\
    \ it \"wakes up\" the shell.  \n+   6.  **The shell again displays a prompt symbol.**\
    \ This indicates that the shell is once again ready to receive your commands.\n\
    \nHow does the shell know where to find software to run (Step 4)? The answer is\
    \ that the shell examines the value of the environment variable PATH. This variable\
    \ holds the *search path*, which is a list of pathnames telling the shell where\
    \ to look.\n\nIf you are using either sh or ksh, the pathnames of the search path\
    \ are separated by colons (:). The PATH variable can be set like this:\n\n![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_221_0.png)\n\
    \n```\nPATH=/bin:/usr/bin:/usr/yourlogin/bin:  \nexport PATH\n```\n\nThis tells\
    \ the shell to look first in the /bin directory. If it cannot find the right software\
    \ in that directory, it is to search /usr/bin, then /usr/yourlogin/bin, and finally,\
    \ the current directory. (Placing a colon by itself at the beginning or end of\
    \ the path, or two colons in a row within the path, tells the shell to search\
    \ the current directory.)\n\nA csh search path uses spaces instead of colons to\
    \ separate the directory pathnames, and it uses the setenv command to set the\
    \ value of PATH:\n\n![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_221_1.png)\n\n```\n\
    setenv PATH ( /bin /usr/bin /usr/yourlogin/bin . )\n```\n\nThis tells csh to search\
    \ /bin, then /usr/bin, then /usr/yourlogin/bin, and finally, the current directory\
    \ (.)."
  merge: -1
  img_proc: true
- pgno: 222
  md: '# **STARTUP FILES**


    # *20.8 User-Defined Variables*


    # ## 20.8 User-Defined Variables


    In addition to the standard shell variables, you can define your own variables.
    This is done by giving the variable a name and a value. Suppose, for example,
    that you were frequently using a long directory name such as `/usera/george/bin/stuff`
    and would prefer not to have to type it out each time. If you are using the `sh`
    or `ksh`, you could place the following line in your `.profile` to define a variable
    to hold the pathname:


    ```

    ```text

    stuff=/usera/george/bin/stuff

    ```

    ```


    Neither `sh` or `ksh` allows spaces around the equals sign.


    This creates a variable named `stuff`, and gives it the pathname as a value. This
    variable will be known only to the login shell; if you also want it to be available
    to any subshells, you will have to "export" it:


    ```

    ```text

    export stuff

    ```

    ```


    (If you are a `ksh` user, you could also make `stuff` available to the subshells
    by defining it in the `.kshrc` file.)


    `csh` handles user-defined variables somewhat differently. To create the variable
    `stuff` you could use the `set` command in your `.login` file:


    `csh` allows spaces around the equals sign.


    ```

    ```text

    set stuff = /usera/george/bin/stuff

    ```

    ```


    This would define `stuff` for the login shell, but the definition would not carry
    over to any subshells. If you want your subshells to be able to use this variable,
    you have two choices. First, you could use the `setenv` command in your `.login`
    file:


    Do not use an equals sign with `setenv`.


    ```

    ```text

    setenv stuff /usera/george/bin/stuff

    ```

    ```


    Or you could use the `set` command in your `.cshrc` file:


    ```

    ```text

    set stuff = /usera/george/bin/stuff

    ```

    ```


    Remember, any command in your `.cshrc` is run each time a new shell process is
    started, including subshells.


    Having defined the variable `stuff` and given it a value, you can use it to save
    keystrokes. For example, you could list the files in the directory `/usera/george/bin/stuff`
    with the following command line:


    ```

    ```text

    $ ls $stuff<Return>

    ```

    ```


    Note the dollar sign preceding the variable name.


    Traditionally, user-defined variable names are spelled in lowercase letters, to
    distinguish them from the standard shell variables.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# 20.9 The calendar Utility


    Do not confuse this with the cal utility, which displays a calendar on the screen.


    Most UNIX systems offer the **calendar** utility, a kind of electronic datebook
    that can remind you of important assignments, appointments, project deadlines,
    and so on. If you want to use **calendar**, you must include the following line
    in your startup file:


    ```

    calendar

    ```


    This command tells UNIX to search through a file named **calendar** for any lines
    that contain today''s date or tomorrow''s date; it then displays those lines on
    the screen. (On weekends, it also displays Monday''s messages.) Suppose you wanted
    to remember to call Adam Smith on April 12. You might put the following line in
    **calendar**, which will be displayed when you log in on April 11:


    ```

    Call Adam Smith April 12

    ```


    The same line will be displayed when you log in on April 12. Any of the following
    messages would have the same effect:


    ```

    Call Adam Smith on 4/12

    April 12: call Adam Smith

    Call Adam Smith on Apr 12

    ```


    The date may appear anywhere on the line, and it may be spelled out (April 12),
    abbreviated (Apr 12), or written in numerals (4/12). However, you must put the
    month before the date. (Do not write 12 April, 12 Apr, or 12/4.) If you include
    the year, it will be ignored; **calendar** always assumes the current year.


    # 20.10 The history Mechanism (csh and ksh)


    The Bourne Shell does not have a history mechanism.


    Another useful feature of the C Shell and the Korn Shell is the **history** mechanism,
    which keeps track of the most recent commands you have issued and gives you a
    quick way to repeat those commands.


    You can specify how many commands you want **history** to remember for you. If
    you are a **csh** user, you can set **history** to remember the last ten commands
    by putting the following line in your **.cshrc** file:


    ```

    set history = 10

    ```


    To set **ksh** to remember the last ten commands, you would put the following
    line in your **.kshrc** file to set the value of the variable **HISTSIZE**:


    ```

    HISTSIZE=10

    ```


    csh allows spaces around the equals sign.


    ksh does not allow spaces around the equals sign.'
