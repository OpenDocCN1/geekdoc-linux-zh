- pgno: 52
  md: '# ### 4.10 Keyboard Focus


    Although you may have multiple **xterm** windows open simultaneously, only one
    of these windows can receive input from the keyboard at a time. The window that
    gets the input is said to have the *keyboard focus*; this is sometimes called
    the *active window*. Most window managers change the color or shading of the frame
    and/or title bar of the active window to distinguish it from other windows.


    There are two ways to select the window that will get the keyboard focus:


    +   * **Point-to-focus method.** On some systems, merely moving the pointer to
    an xterm window changes the focus to that window. (This is also referred to as
    the *point-to-type method.*)

    +   * **Click-to-focus method.** Some systems require that you point to a window
    and click the left mouse button. (This is also called the *click-to-type method.*)


    Take a moment now to determine which method your system employs.


    # ### 4.11 UNIX Shell Prompt


    If you examine the contents of the xterm window, you will see a *shell prompt*,
    which is simply the shell’s way of telling you that it is ready to receive your
    instructions. If your login shell is the C Shell, the prompt is probably a percent
    sign:


    ```

    %

    ```


    If you are using the Bourne Shell or the Korn Shell as a login shell, the usual
    prompt is a dollar sign:


    ```

    $

    ```


    Other symbols are occasionally used for shell prompts, including the pound sign
    (*#*), the “greater than” sign (*>*), the asterisk (*\**), the “at” symbol (*@*),
    and the colon (*:*). Some systems are set up to include the host name as part
    of the prompt, like this:


    ```

    merlin %

    ```


    In this book, we will use the following as our “generic” prompt, to take the place
    of either the percent sign or the dollar sign:


    ```

    $\%

    ```


    In the examples that follow, do not enter the prompt symbol.


    # ### 4.12 Starting xterm Using a Command Line


    You have already seen how to start a new **xterm** window using a pop-up menu.
    There is another way to open a new window:'
