  md: '# 4.3 The xterm Window


    You will do most of your work in the xterm window. The name xterm is short for
    “X Terminal,” and as the name suggests, the xterm window acts like a conventional
    terminal screen. Some of the parts of the xterm window are shown in Figure 4–3.
    (Later in this chapter, you will learn what these do.)


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_46_0.png)


    **Figure 4–3** Parts of the xterm window.


    # 4.4 Getting Acquainted with the Mouse


    If you have previously worked with a personal computer, you are undoubtedly familiar
    with the use of a mouse with a GUI. As you move the mouse on its pad or the table
    top, an arrow-shaped pointer also moves on the screen.


    Unlike many personal computers—which typically work with a mouse having just one
    or two buttons—the Motif Window Manager is designed to operate with a three-button
    mouse (Figure 4–4).


    Unfortunately, there is no universally accepted standard that sets the functions
    of the mouse buttons—each system can be configured according to the administrator’s
    (or user’s) personal preferences. The following arrangement is fairly typical:'
