  md: '![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_123_0.png)


    # 10.6 Buffers and More Buffers


    Recall that vi actually works on a copy of the file in the work buffer. While
    using vi, you have access to other buffers as well. There are 36 of these:


    +   • unnamed buffer

    +   • named buffers "a", "b", "c", . . . , "z"

    +   • numbered buffers "1", "2", "3", . . ."9"'
