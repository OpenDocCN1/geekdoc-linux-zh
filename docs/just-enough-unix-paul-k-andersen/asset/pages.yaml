    +   Select the file transfer mode. As far as ftp is concerned, there are two types

    +   of files. An ASCII file contains text; a binary file contains other kinds
    of infor-

    +   mation (such as graphics, audio recordings, or compressed text). Depending
    on

    +   the type of information that is in the file, enter either ascii or binary
    at the

