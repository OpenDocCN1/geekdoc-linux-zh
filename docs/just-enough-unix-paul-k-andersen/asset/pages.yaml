- pgno: 207
  md: '# # 19 Tutorial: Browsing the WWW


    > You cannot use Netscape without a GUI, but you may be able to use a text-based
    browser such as Lynx—see Exercise 12.


    In this chapter, you will learn how to use Netscape, a powerful World Wide Web
    (WWW) browser. Netscape is not the only WWW browser available, but it is the most
    widely used. Versions of Netscape are available for the Apple Macintosh, for IBM-compatible
    personal computers running Microsoft Windows, and for UNIX machines running the
    X Window System.


    A word of warning: It seems that nothing on the World Wide Web stays the same
    for long. Do not be surprised, therefore, if some of the Web documents are no
    longer where we say they are, or if their appearance is not exactly as shown.


    # ## 19.1 Starting Netscape


    There are basically two ways to start the Netscape browser, depending on how your
    system administrator has set up your account.


    +   1. **If necessary, start X and the window manager.** You will not be able
    to use Netscape on a text-only display.

    +   2. **Select the Netscape option on one of the pop-up menus.** This assumes,
    of course, such an option has been provided on your system.

    +   3. **If Netscape is not available as a menu option, start the program from
    the command line.** At the shell prompt, type netscape, an ampersand (&), and
    Return.


    ```

    `$ netscape & (Return)`

    ```


    It may take a moment or two for Netscape to start up. Eventually, you will see
    your *default home page*; in most cases, this will be the Netscape company home
    page, as shown in Figure 19-1. Note that the URL for this page is shown in the
    box marked "Location."'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# BROWSING THE WWW


    # 19.2 *The Netscape Window*


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_208_0.png)


    Netscape window, showing the Netscape home page. The content and layout of this
    page change frequently.


    # 19.2 The Netscape Window


    You should take a moment to acquaint yourself with the various parts of the Netscape
    window (Figure 19–2). Be sure you can locate and identify the following:


    +   * **Menu Bar.** Nine pull-down menus are available from the menu bar near
    the top of the window. Reading from left to right, these are the File, Edit, View,
    Go, Bookmarks, Options, Directory, Window, and Help menus.

    +   * **Toolbar Buttons.** Nine buttons are located in a row beneath the menu
    bar. These are the Back, Forward, Home, Reload, Images, Open, Print, Find, and
    Stop buttons.

    +   * **Netscape Company Logo.** This is located to the right of the toolbar buttons.

    +   * **Location Field.** The URL of the currently displayed page appears in this
    area.

    +   * **Directory Buttons.** These buttons provide links to interesting information
    and helpful tools. Handbook and Net Search are especially useful.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   •  **Content Area.** Whenever you receive a page from a Web site, the page
    is displayed in this part of the window.


    +   •  **Message Status Field.** Whenever the browser sends or receives information
    over the Web, it prints an appropriate message in the Message Status Field to
    let you know what is happening.


    +   •  **Mail Icon.** Pressing this icon will bring up an electronic-mail window.


