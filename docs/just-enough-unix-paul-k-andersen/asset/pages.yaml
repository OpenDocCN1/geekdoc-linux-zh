- pgno: 67
  md: '.../jill/Marsupials


    While absolute pathnames always begin with a slash (/, representing the root directory,
    relative pathnames begin either with dot (.), dotdot (..), or the name of a file
    or directory in your current working directory.


    # 5.6 Listing Files


    You now know how to write absolute pathnames and relative pathnames, but you may
    reasonably wonder what good this is. To answer that, consider how pathnames may
    be used with a few UNIX commands. Start with the ls ("list") command.


    Suppose jack is working in his home directory, and he wants to remind himself
    which files he has in his home directory. He would type the command


    ```

    $ ls(Return)

    ```


    The response would be


    Continents Oceans


    Now suppose jack wants to know what jill has in her Marsupials directory. From
    his home directory, he would use the ls command with the pathname of Marsupials:


    ```

    $ ls ../jill/Marsupials(Return)

    ```


    The computer''s answer would be


    bandicoot kangaroo wombat


    Thus, without leaving home, jack can list files in a distant directory—even a
    directory belonging to another user—if he knows the directory''s pathname.


    # 5.7 Hidden Files and Directories


    A hidden (or invisible) file is one that is not listed when you use the simple
    ls command. A file or directory will be hidden if its name begins with a period.
    For example,


    ```

    .hidden .jim .lost .profile .login . ..

    ```


    would all be hidden—they would not be listed by the simple ls command. To list
    all of the files in a directory, including the hidden ones, requires the ls -a
    ("list all") command. Suppose, for example, that jack is working in his home directory,
    and he types


    ```

    $ ls -a(Return)

    ```'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'He would see


    ```

    . . Contineants Oceans

    ```


    Similarly, if jack were to use this command with the pathname of jill''s Marsupials
    directory, he would see something like this:


    ```

    $ ls -a ../jill/Marsupials (Return)

    ```


    ```

    . . bandicoot kangaroo wombat

    ```


    Note that dot (. ) and dotdot (..) are both names of hidden directories, and that
    both appear when jack uses the ls -a command. Remember, dot is just another name
    for the current directory, while dotdot refers to the parent of the current directory.


    # 5.8 Renaming and Moving Files


    The ls command takes one pathname; now consider a command that uses two. The mv
    (“move”) command has the general form


    ```

    mv pathname1 pathname2

    ```


    This can be interpreted to mean “move the file found at pathname1 to the position
    specified by pathname2.” To see how this works, consider how jill might tidy up
    her home directory using mv.


    The file name possum is wrong because the proper name for the animal is “opossum.”
    If jill is still working in her home directory, the pathname of the file possum
    is just the file name. To change the name of the file without changing its location,
    she simply uses mv with the new name:


    ```

    $ mv possum opossum (Return)

    ```


    This tells UNIX “move the contents of possum (in the current directory) into the
    file opossum (also in the current directory).” Since there is no existing opossum
    file, one is created, and the old file name disappears.


    Next, jill remembers that the opossum is a marsupial, and therefore should be
    moved to the Marsupials directory. The mv command will do the trick:


    ```

    $ mv opossum Marsupials (Return)

    ```


    This means “move opossum from the current directory into the Marsupials directory.”
    Thus jill can use the mv command twice, once to rename a file and again to move
    it to another directory. The end result is shown in Figure 5-3.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_69_0.png)


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_69_1.png)


    jill could have moved the file and renamed it at the same time using the command

    `$ mv possum Marsupials/opossum (Return)`


    This means “move the contents of possum to the Marsupials directory and into a
    file named opossum.”


    # **5.9 Creating a File**


    There are four common ways to create a UNIX file:


    +   1. Copy an existing file.

    +   2. Redirect the “standard output” from a UNIX utility.

    +   3. Open a new file using a text editor.

    +   4. Write a computer program that opens new files.


    Of these, (1) and (2) are considered in this chapter; (3) is covered later in
    the book.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# ### 5.10 Copying Files


    The `cp` (“copy”) command has the form


    `cp pathname1 pathname2`


    This means “copy the file found at `pathname1` and place the copy in the position
    specified by `pathname2`.” Suppose that *jack* has developed a sudden interest
    in wombats and asks *jill* for a copy of her file on the subject. From her home
    directory, *jill* uses the command


    `$ cp Marsupials/wombat ../../jack/Continents (Return)`


    to make a copy of the *wombat* file and put it in the `Continents` directory.
    The result is shown in Figure 5-4.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_70_0.png)'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# ## 5.11 Creating a File by Redirection


    The second method of creating a new file is to redirect the output of a command.
    In other words, instead of displaying the results of the command on the screen,
    UNIX puts the results into a file. As an example, consider what happens if Jill
    moves to her Marsupials directory and issues the `ls` command:


    ```

    `$ ls (Return)`

    ```


    ```

    bandicoot  kangaroo  opossum  wombat

    ```


    Suppose now that she wants to redirect this list into a file named `filelist`.
    She does this using the *output redirection symbol* `>`:


    ```

    `$ ls > filelist (Return)`

    `$`

    ```


    This time, nothing appears on the screen because the output was rerouted into
    the file. In UNIX terminology, the information was redirected from the *standard
    output* (the terminal screen) to the file. If Jill lists her files now, she will
    see that there is a new one named `filelist` in the directory:


    ```

    `$ ls (Return)`

    `bandicoot  filelist  kangaroo  opossum  wombat`

    ```


    Redirection is powerful and convenient, but it can be dangerous. If you redirect
    the output into a file that already exists, the original contents of the file
    will be lost. If you want to add something to the end of an existing file without
    losing the original contents, you can use the *append* operation, which requires
    two redirection symbols (`>>`):


    ```

    `$ ls >> filelist (Return)`

    `$`

    ```


    # ## 5.12 Access Privileges


    The UNIX operating system is designed to make it easy for users to share files.
    However, there are times when you do not want others to copy, move, or even examine
    the contents of your files and directories. You can easily control access to the
    files in your home directory. To see how this is done, refer to Appendix D, “Access
    Privileges.”'
  merge: -1
  img_proc: true
