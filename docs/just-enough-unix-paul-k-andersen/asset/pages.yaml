- pgno: 30
  md: 'Of these, the CONTROL key deserves special mention. A large number of UNIX
    commands are executed by holding down the CONTROL key while simultaneously pressing
    another key. For example, on many terminals the erase function can be invoked
    by the key combination


    CONTROL-H


    When referring to this combination of keys in print, you will often see the notation
    ^H, where the caret (^) stands for the CONTROL key.


    Later in the book, you will learn about many of the functions that involve the
    CONTROL key. For now, there are four special functions that you should ask about:


    | Function | Purpose | Key Combination | Alternative |

    | :------- | :------ | :--------------- | :---------- |

    | erase    | deletes a character | CONTROL-H | ^H, BACKSPACE |

    | interrupt | stops a program | CONTROL-C | ^C, DELETE |

    | stop    | freezes the terminal | CONTROL-S | ^S, ? |

    | continue | unfreezes the terminal | CONTROL-Q | ^Q, ? |


    Note that there may be more than one way to delete a character or interrupt a
    program. As shown in Appendix A, UNIX provides a way for you to change the keys
    that invoke these functions.


    # 2.9 Printer Codes


    Almost every UNIX system has a printer for producing paper output. (Paper output
    is called hardcopy.) A large computer installation may have many printers. Individual
    printers are identified by a code name, which typically reflects the type and
    location of the device. For example, suppose that one of the printers connected
    to your UNIX system were an Apple LaserWriter 360, located in Room 12. The system
    administrator might give this printer one of the following code names:


    alw360-12


    1w360r12


    room121w


    You get the idea. There are no standard rules on naming printers, so it is a good
    idea to ask your system administrator for the names of the printers that are part
    of your system.


    Your system

    administrator can tell

    you which keys

    perform these

    functions.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# Teletypes and Terminals\n\nWhen Thompson and Ritchie rewrote UNIX to run\
    \ on the PDP-11 for the Bell Patent Department, the primary input/output devices\
    \ were Teletype terminals. These were slow, noisy electromechanical devices that\
    \ produced their output on rolls of paper.\n\nThe Teletype keyboard had the usual\
    \ typewriter keys for upper- and lowercase letters, numbers, and punctuation.\
    \ It also had a special \\\"Control\\\" key that was used in combination with\
    \ other keys to perform special functions. (For example, holding down the Control\
    \ key and typing the letter B caused a bell to ring.)\n\nAlthough Teletypes are\
    \ now obsolete, they are not entirely forgotten. The keyboards of newer I/O devices\
    \ still have a Control key that is used in combination with other keys to perform\
    \ special functions. In the vocabulary of UNIX, the abbreviation tty (short for\
    \ Teletype) is still used to mean \\\"terminal.\\\" And \\\"print\\\" is still\
    \ used to mean \\\"display output on a terminal,\\\" even though most terminals\
    \ today print to a video screen rather than paper.\n\n# 2.10 \\t\\t\\t\\tExercises\n\
    \n+   Be sure you can define the following terms:\n+   \n+   system administrator\n\
    +   account name\n+   login name\n+   login\n+   logging in\n+   password\n+ \
    \  home directory\n+   group\n+   login shell\n+   BSD\n+   System V\n+   term\\\
    info code\n+   termcap code\n+   control key\n+   interrupt\n+   tty\n+   print\n\
    +   hardcopy\n\n+   What version of UNIX will you be using? Is it based on AT&T\
    \ or on BSD UNIX?\n\n+   How are login names assigned for users on your system?\
    \ Are you allowed to choose your own login, or is one chosen for you?\n\n+   What\
    \ are the rules for choosing a password on your system? Keeping those rules in\
    \ mind, choose two or three passwords to use later. (Do not write down your passwords\
    \ or divulge them to anyone.)"
  merge: -1
