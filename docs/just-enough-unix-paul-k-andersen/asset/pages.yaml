  img_proc: true
- pgno: 305
  md: "+   * program Hello*World*(output);\n\nEvery Pascal program must begin with\
    \ the word *program*, which is a *reserved word* in Pascal. This means that *program*\
    \ has a predefined meaning in Pascal and cannot be used any other way by the programmer.\
    \ Every program must also have a name or *identifier*—in this case, *HelloWorld*.\
    \ The predefined textfile *output* represents the standard output. The semicolon\
    \ ( `;` ) at the end of the line is used to separate statements.\n\n+   * begin\n\
    \nThe beginning of the program body is indicated by the reserved word *begin*.\n\
    \n+   * writeLn('Hello, world!')\n\n*writeLn* is a standard Pascal procedure used\
    \ to “write” a line on the standard output. The argument to the procedure is a\
    \ group of characters enclosed by single quotes, which is called a *string*.\n\
    \n+   * end.\n\nThe program body ends with the reserved word *end* and a period\
    \ ( `.` ).\n\n# 28.2 Creating and Running hello.p\n\n1.  Create a source file.\
    \ Use the vi editor to create a file named hello.p:\n\n```\n$ vi hello.p (Return)\n\
    ```\n\nEnter the program exactly as shown in Listing 28–1, then write to the file\
    \ and quit the editor.\n\n2.  Compile the source code. On most systems, the Pascal\
    \ compiler is called pc. To compile the file, simply type pc followed by the name\
    \ of the file. Remember that the file name must end in .p:\n\n```\n$ pc hello.p\
    \ (Return)\n```\n\n3.  If necessary, correct any compiler errors and repeat Step\
    \ 2. If the compiler cannot compile your code because of syntax errors, it will\
    \ try to tell you where the errors are located. Reopen the file and correct the\
    \ errors.\n\n4.  Run the program. By default, the executable file is given the\
    \ name a.out. To run the program, type\n\n```\n$ a.out (Return)\n```\n\nYou should\
    \ see the message\n\n```\nHello, world!\n$ \n```"
  merge: -1
  img_proc: true
- pgno: 306
  md: "The shell prompt appears when the program finishes, indicating that the shell\
    \ is ready for your next command.\n\n# ### 28.3  Renaming the Executable File\n\
    \nNote that the file containing the executable code is given the name `a.out`.\
    \ If you want to save the executable code, you must use the `mv` command to give\
    \ this file another name—otherwise, it will be overwritten the next time you use\
    \ the `pc` compiler.\n\n**1 Use the `mv` command to rename the executable file.**\
    \ It is common practice to give the executable code the same name as the source\
    \ code, but without the `.p` suffix:\n\n```\n```\n$ mv a.out hello\n```\n\n```\n\
    \n**2 Run the program.** Enter the new name of the executable file:\n\n```\n```\n\
    $ hello\nHello, world!\n$ \n```\n\n```\n\nAs we shall see, you can compile the\
    \ source code and rename the executable file all at once using `pc` with the `-o`\
    \ option:\n\n```\n```\n$ pc hello.p -o hello\n```\n\n```\n\nNote that the arguments\
    \ can be written in a different order:\n\n```\n```\n$ pc -o hello hello.p\n```\n\
    \n```\n\n# ### 28.4  The recip.p Program\n\nOur next program calculates reciprocals\
    \ of numbers entered by the user at the keyboard. A pseudocode outline for this\
    \ program is shown in Listing 28–2A; the corresponding Pascal code is shown in\
    \ Listing 28–2B.\n\n![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_306_0.png)"
