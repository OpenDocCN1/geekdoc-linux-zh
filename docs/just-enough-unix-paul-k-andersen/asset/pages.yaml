  md: '- *csh* also uses two startup files. It executes the instructions in *.cshrc*
    and *.login* when you first log in. After that, every *csh* subshell executes
    the commands it finds in *.Cshrc*.


    # **20.3 Variables**


    One of the most important uses for a startup file is to set the values of variables
    used by the shell. A *variable* is a named storage location that can hold a value.
    Three types of variables are commonly used by the shell:


    +       - *Environment Variables.* Also called *special shell variables*, *keyword
    variables*, *predefined shell variables*, or *standard shell variables*, they
    hold information about the computer system that the shell needs to operate correctly.

    +       - *User-created Variables.* You can name your own variables and assign
    them values. These are also called *personal variables*.

    +       - *Positional Parameters.* These are used in shell programs.


    In this chapter we will discuss the environment and user-created variables. We
    will discuss positional parameters when we take up shell scripts in Chapter 23.


    # **20.4 Environment Variables**


    The environment shell variables provide information to the shell about the way
    your account is set up. Here are some of the more common environment variables:


    | Variable | Contents |

    |:---|:---|

    | HOME | Pathname of your home directory |

    | PATH | Directories where shell is to look for commands |

    | TERM | The termcap code for your terminal |

    | USER | Your user name |

    | PWD | Your current working directory |

    | MAIL | Pathname of your system mailbox |

    | SHELL | Pathname of shell |


    # **20.5 Setting the Environment Variables**


    Some of the standard shell variables (such as **HOME** and **SHELL**) are set
    automatically for you when you log in. Others (such as **TERM**) you may have
    to set yourself. This is usually done in your login initialization file.'
