    # ### 4.19 Reading the UNIX Manual


    Many UNIX systems come equipped with a detailed on-line manual that you can read
    using the man command. The manual describes the commands that are available on
    the system. To see how this is done, try the following command:


    ```

    $ man cal ENTER

    ```


    The cal command is one that we will use in later chapters; it displays a calendar
    on the screen. If your system has the on-line manual, you should see a description
    of cal. (For more information on how to make sense of the manual, see Appendix
    B.) Otherwise, you will see the message

    man: Command not found.'
