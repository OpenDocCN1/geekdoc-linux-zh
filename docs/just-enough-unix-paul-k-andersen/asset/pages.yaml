- pgno: 74
  md: '# 6 **TUTORIAL:**

    **WORKING WITH FILES**


    In this chapter, you will learn how to create, view, copy, rename, and print files.
    All of your work will take place in your home directory—you''ll see how to make
    subdirectories in the next chapter.


    # 6.1 **Printing a Calendar**


    Many of the examples in this chapter make use of the UNIX utility `cal`, which
    displays a calendar for any month or any year from AD 1 to AD 9999. To see how
    this works, try some examples:


    +   1. **Print a calendar for a given month.** For example, to show the calendar
    for the fifth month of the year 1999, type the command


    ```

    $ cal 5 1999 (RETURN)

    ```


    The computer will respond with the calendar:


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_74_0.png)


    +   2. **Print a calendar for an entire year.** To do this, specify the year but
    not the month:


    ```

    $ cal 1999 (RETURN)

    ```'
