  md: "20.11 *Command Aliases (csh and ksh)*\n\n# ## 20.11 \t\t\t\tCommand Aliases\
    \ (csh and ksh)\n\nThe C and Korn Shells allow you to rename UNIX commands. A\
    \ renamed command—called an *alias*—may be used to shorten long commands or to\
    \ protect you from accidentally deleting an important file. Most users set up\
    \ a list of aliases in their shell initialization file (`.cshrc` or `.kshrc`),\
    \ so that the aliases are defined automatically each time a new shell is started.\n\
    \nThe `alias` command is used to define aliases in `csh`. Placing the following\
    \ line in the `.cshrc` file tells the shell to treat m as an alias for the `mailx`\
    \ command:\n\n```\n(csh)\n\talias m mailx\n```\n\nThe `alias` command works a\
    \ bit differently with `ksh`. The following line may be placed in the `.kshrc`\
    \ file to create a ksh alias for the `mailx` command:\n\n```\n(ksh)\n\talias m='mailx'\n\
    ```\n\nOnce the alias is set, you could send mail to the user bfranklin with the\
    \ command line\n\n```\n$ m bfranklin (Return)\n```\n\nYou can remove an alias\
    \ with the `unalias` command:\n\n```\n$ unalias m (Return)\n```\n\n# ## 20.12\
    \ \t\t\t\tProtecting Existing Files (csh and ksh)\n\nOne of the common uses of\
    \ command aliases is to protect files from being deleted accidentally. When you\
    \ specify the `-i` (\"interactive\") option with the `cp`, `mv`, or `rm` command,\
    \ you will be asked to confirm your intentions if you try to do something that\
    \ would destroy an existing file. For example, suppose you tried to remove a file\
    \ named `oldfile` using the `rm -i` command:\n\n```\n$ rm -i oldfile (Return)\n\
    ```\n\nThe command will prompt you to confirm that this is what you want:\n\n\
    ```\nrm: remove oldfile?\n```\n\nIf you enter a y (for \"yes\"), the file will\
    \ be removed. Otherwise, no action will be taken. The `-i` option works similarly\
    \ with the `cp` or `mv` commands, should you try to overwrite an existing file.\n\
    \nIf you are a `csh` user, you can create a \"safe\" alias for `rm` by placing\
    \ the following line in the `.cshrc` file:\n\n```\n(csh)\n\talias rm 'rm -i'\n\
    ```\n\nIf you use `ksh`, you would put this line in your `.kshrc` file:"
