- pgno: 38
  md: '# 3.9 Trying Out Some UNIX Commands


    Next, try a few UNIX commands to see how they work.


    +   **1 Start with the date command**. Type `date` after the prompt, and press
    *(RETURN)*:


    ```

    ```

    $ date (RETURN)

    ```


    ```


    The computer will respond with the date and time. For example, if you were to
    give this command on Friday, August 13, 1999, at 8:35 pm (Eastern Standard Time),
    the output would be something like


    ```

    ```

    Fri  Aug 13  20:35:41 EST  1999

    ```


    ```


