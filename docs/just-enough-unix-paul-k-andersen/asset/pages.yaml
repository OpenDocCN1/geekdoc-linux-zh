- pgno: 5
  md: '**UNIX NETWORKING.** The recent growth of the Internet and World Wide Web around
    the world has been phenomenal. UNIX systems are a considerable part of this development.
    Internet and Web tools are presented in Part V.


    **STARTUP FILES.** One of the great advantages of the UNIX operating system is
    its flexibility. A startup file contains commands for the shell to execute when
    it begins running. Startup files are examined in Part VI.


    **SHELL SCRIPTS.** The UNIX shell is also a sophisticated programming language.
    A file containing a program for the UNIX shell is called a shell script. Shell
    scripts are described in Part VII.


    **PROGRAMMING UNDER UNIX.** Most UNIX systems include the programming languages
    C and Fortran. Many also include Pascal and other languages such as C++, BASIC,
    Lisp, and COBOL. UNIX also offers a selection of software tools that are used
    in programming. UNIX programming is discussed in Part VIII, with emphasis on C,
    Fortran, and Pascal.


    # ## How to Use This Book


    Anyone who is just starting with UNIX should read straight through Parts I, II,
    III, and IV. The remaining parts may be read in any order. If your interest is
    in the Internet and the World Wide Web, read Part V. If you would like to learn
    about shell scripts and startup files, read Parts VI and VII. If you are interested
    primarily in using UNIX to program in C, FORTRAN, or Pascal, read Part III.


    Each part of this book begins with a chapter that explains the material without
    requiring the use of the computer. Other chapters are called “tutorials.” These
    are intended to be read at the computer terminal. You should plan to spend about
    an hour at the terminal to cover each tutorial.


    At the end of each section, you will find some short exercises. To derive the
    maximum benefit from this text, be sure to work through all of the exercises.


