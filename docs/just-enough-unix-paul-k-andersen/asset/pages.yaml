  md: '# **11.10 Correcting Mistakes**


    Everyone makes an occasional error, so vi thoughtfully provides several means
    of correcting mistakes. These commands work only in the command mode. (When in
    doubt, hit `Esc` to get into the command mode.)


    +   * x&nbsp;&nbsp;&nbsp;&nbsp; delete one character

    +   * dd&nbsp;&nbsp; delete entire line

    +   * u&nbsp;&nbsp;&nbsp;&nbsp; undo most recent change

    +   * U&nbsp;&nbsp;&nbsp;&nbsp; Undo any changes made to current line

    +   * :q quit without saving changes


    *To delete a single character, move the cursor over that character and press the
    x key. To delete an entire line, type dd. To delete n lines (where n is any positive
    integer), move the cursor to the first of the lines to be deleted and type n dd.*


    If you make a change and then think better of it, you can undo the most recent
    change by the u ("undo") command


    ```

    `Esc` u `Return`

    ```


    If you want to undo several changes to the line you are currently working on,
    you can restore the current line to its previous condition with the U ("Undo")
    command:


    ```

    `Esc` U `Return`

    ```


    Note, however, that U works only so long as you remain on the line; if you go
    to another line, you cannot go back and use the U command to undo the changes.


    If you make too many changes to undo with the u or U commands, you can always
    use the command


    ```

    `Esc` :q! `Return`

    ```


    which quits the text editor without saving any changes.


    # **11.11 Command Summary**


    You have learned to use a number of the most important vi commands, which are
    listed on the next page. Note that the commands beginning with a colon (:) appear
    at the bottom of the screen and must be followed by `Return`. Also note that none
    of the other commands given in the vi command mode appear on the screen as you
    type them.'
  merge: -1
  img_proc: true
