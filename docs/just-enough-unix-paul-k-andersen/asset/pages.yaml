- pgno: 43
  md: '# # 4 TUTORIAL: GETTING STARTED WITH X


    In this chapter, you will learn how to use an X terminal or workstation to log
    into your UNIX account, change your password, and try out some UNIX commands.
    If you haven''t done so already, ask your instructor, system administrator, or
    consultant about setting up an account. You will need the following information:


    +   - Your login name

    +   - Your password

    +   - The name of the computer you will be using


    This chapter assumes that your system is set up to start the X server and window
    manager automatically. If this is not true for your system, you will have to start
    them yourself. In that case, you should log in according to the procedure presented
    in Sections 3.1 through 3.7; then refer to Appendix C, “Starting X and Motif.”


    # ## 4.1 Logging into the Display Manager


    The X program that controls your login procedure is called the display manager.


    1 Wake up the display. Most X terminals are equipped with a screen saver, a program
    that blanks out the screen when it has been idle for a time. Pressing a key or
    moving the mouse is usually enough to cancel the screen saver.


    The display manager will produce a login screen that may look something like Figure
    4-1.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_43_0.png)


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_43_1.png)'
