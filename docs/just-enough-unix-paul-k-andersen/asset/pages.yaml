- pgno: 173
  md: "# # 15 TUTORIAL:  \nLOGGING IN REMOTELY\n\nRunning either the rlogin or telnet\
    \ utility on your local host computer, you can log in and work on a remote computer\
    \ system on which you have an account. The difference is that the rlogin utility\
    \ allows you to connect only to another UNIX system; telnet can also connect to\
    \ non-UNIX hosts. telnet can also be used to gain access to certain Internet services\
    \ that do not require that you have an account on the remote host.\n\n# ## 15.1\
    \ Running rlogin\n\nIn this section you will see how to use rlogin to log into\
    \ your account on a remote UNIX host. (If you do not have an account on another\
    \ machine, you can practice with your local account.)\n\n+   1. **Start the rlogin\
    \ program, specifying the remote host and your remote login name.** Thus, if you\
    \ had an account named jsmith on the remote UNIX host merlin.podunku.edu, you\
    \ would type  \n+   $ rlogin merlin.podunku.edu -l jsmith \\texttt{<Return>} \
    \ \n+   On some systems, that will be enough to get you into the remote system;\
    \ no password is needed. Other systems will require that you enter a password:\n\
    \npassword:\n\n+   2. **If necessary, enter the password that you use for the\
    \ remote host.** This may not be the same as the password used on your local host.\n\
    \n+   3. **When you finish working on your remote account, log out from that account.**\
    \ One of the following commands should work (see Chapter 3):"
  merge: -1
  img_proc: true
- pgno: 174
  md: "```\n$ logout (Return)\n$ exit (Return)\n$ CONTROL-D\n```\n\n# ## 15.2 Running\
