  md: '# ### 27.18 Command Summary


    Each of these commands is entered at the shell prompt and is terminated by a Return.


    | f77 file.f | compile and link the source code in file.f |

    |---|---|

    | f77 -c file.f | compile but do not link; put output in file.o |

    | f77 -g file.f | compile file.f; set up for the debugger |

    | f77 -o file file.f | compile file.f; put executable code in file |

    | f77 file.f -o file | same as previous |


