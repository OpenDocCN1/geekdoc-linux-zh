  md: '![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_203_0.png)


    # # 18.4 Searching Gopherspace


    Burrowing through the gopher menus can be a lot of fun, but at times you may want
    a more efficient way of finding the information you need. There are several ways
    that gopher can conduct a search for the items you want. The easiest is to find
    a menu item that leads to a search program. For example, one of the choices on
    the University of Minnesota''s main gopher menu shown above allows you to search
    the menus on that server:


    10. Search Gopher Titles at the University of Minnesota <?>


    Note the tag <?> at the end of the line; this marks a menu choice that calls up
    a search program. Using such a program is fairly easy:


    +   1. **Find a menu that has a search option.** Suppose, for example, that you
    were interested in finding out what information is available at the University
    of Minnesota related to "earthquakes." You would first go to the main menu of
    the University of Minnesota gopher server.

    +   2. **Select the search option.** On the Minnesota menu shown above, option
    10 is the one you want.


    View item number: 10 (Return)'
