  md: "# 14.7\n\nSaving Messages\n\nYou may decide to keep some messages for future\
    \ reference. You can save a message in a file with the s (“save”) command.\n\n\
    +   Enter the **Save** command, followed by the **message number**. Thus, to save\
    \ the message 1 in a file named `message1.file1`, type\n+   `&s1 message1.file1\
    \ (Return)`\n\nThis creates a new file in your home directory named `message1.file1`,\
    \ and places in it the text of the message, including the mail header. (If you\
    \ already have a file named `message1.file1` in your home directory, the message\
    \ is appended to the file.) The original message is deleted from your system mailbox.\
    \ The mail program will tell you that the message has been saved.\n\n# 14.8\n\n\
    Deleting Messages\n\nSome messages are not worth saving. You should delete these\
    \ with the d (“delete”) command.\n\n+   1.  Enter the **Delete** command, followed\
    \ by the **message number**. For example, to delete the third message, type\n\
    +       `&d3 (Return)`\n+       \n+       Normally, the mail program does not\
    \ tell you that it has deleted a message. Instead, it will simply show you a mail\
    \ prompt:\n+       \n+       `&`\n\n+   2.  **Check that the message has been\
    \ deleted.** The h (“headers”) command will list the messages remaining in the\
    \ mailbox:\n+       `&h (Return)`\n+       \n+       A deleted message will no\
    \ longer appear in the list of mail headers.\n\n# 14.9\n\nRestoring Deleted Messages\n\
    \nWhat if you delete a message by accident and want to get it back? If you have\
    \ not exited the mail program, you can retrieve deleted messages using the **Undelete**\
    \ command.\n\n+   Enter the **Undelete** command, followed by the **message number**.\
    \ For example, to restore the third message, type\n+   `&u3 (Return)`"
  merge: -1
  img_proc: true
- pgno: 166
  md: "# 14.10  Quitting the Mail Program\n\nThe x command is useful when you accidentally\
    \ deleted a message you want to keep.\n\nThere are two common ways you can quit\
    \ the e-mail program after reading your mail, which differ in what is done to\
    \ the messages in your mailbox. The q (\"quit\") command puts any messages that\
    \ you read, but did not delete, into a file named **mbox** in your home directory.\
    \ Unread messages are left in the system mailbox. The x (\"ex-it\") command quits\
    \ the mail program without changing the mailbox, restoring any deleted messages.\n\
    \nOf these, the q command is more commonly used:\n\n+   * **Type q, then ⏎ (Return):**\
    \  \n+     \n+     &q ⏎ (Return)\n+     \n+     Some versions of the mail program\
    \ will tell how many messages were saved in the mailbox and how many were placed\
    \ in your mbox file:\n+     \n+     Saved 3 messages ...\n\n# 14.11  Reading Your\
    \ mbox File\n\nYour **mbox** file receives messages that you have read but not\
    \ deleted or saved in another file. Using the mail program with the -f (\"file\"\
    ) option allows you to read and process the messages in your **mbox** file just\
    \ as you did with the messages in your system mailbox.\n\n+   1. **Start the mail\
    \ program with the -f option.**\n+   \n+      $ mail -f ⏎ (Return)\n+   \n+  \
    \    or\n+   \n+      $ mailx -f ⏎ (Return)\n+   \n+      The mail program will\
    \ list the messages in your **mbox**.\n+   \n+   2. **Process the messages.**\
    \ You can use the usual mail commands to read, reply to, and delete messages.\n\
    +   \n+   3. **Quit the mail program.** Either the q or x command will do this."
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 14.12 Getting Help


    Any time you forget what commands are used by mailx or Mail, type the ? (“help”)
    command after the mail prompt. This will display a list of commands.


    +   - h print out active message headers


    +   - m [user list] mail to specific users


    +   - n goto and type next message


    +   - p [message list] print messages


    +   - pre [message list] send messages back to system mailbox


    +   - q quit (unresolved messages in mbox)


    +   - R [message list] reply to sender (only) of messages


    +   - r [message list] reply to sender and recipients


    +   - s [message list] file append messages to file


    +   - t [message list] type messages (same as print)


    +   - top [message list] show top lines of messages


    +   - u [message list] undelete messages


    +   - v [message list] edit messages with display editor


    +   - w [message list] file append to file, without from line


    +   - x quit, do not change system mailbox


    +   - z display next page of headers


    +   - z- display previous page of headers


    +   - ! shell escape


    A [message list] consists of integers, ranges of same, or user names separated
    by spaces. If omitted, Mail uses the current message.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 14.13 Obtaining an Address


    Before you can send mail to someone, you must know his or her login. If you can
    ask the person directly for his or her login, fine. Otherwise, you may have to
    make an intelligent guess at the login, and then use the `finger` command to confirm
    your guess. `finger` tells you the real name of the person who uses a particular
    login name.


    When used without an argument, `finger` lists everyone who is currently logged
    into the system.


    +   *   **Enter the `finger` command, giving the person''s login as an argument.**

    +   The first time, you might try it on your own login:


    ```

    $ `finger` `yourlogin` **<Return>**

    ```


    You should see information about the user:

    Login name: `yourlogin`

    In real life: Your Name

    Your office:

    Phone: 555-5555


    However, if the `finger` command is not available, the system will say so:

    `finger:` **Command not found**


    Some versions of `finger` can tell you the login name of a user, given his or
    her last name.


    +   *   **Enter the `finger` command, giving the person''s last name as an argument.**

    +   The first time, you might try it on your own name:


    ```

    $ `finger` `yourname` **<Return>**

    ```


    This should produce either a list of users having your last name or an error message
    of some sort.


    # 14.14 write and talk


    `write` and `talk` are discussed in Appendix E.


    The `write` and `talk` utilities allow two users who are logged into the system
    to send typed messages to each other. If someone tries to communicate with you
    this way, you will receive a message like this:

    Message from george on tty10

    To learn how to respond using `write` or `talk`, refer to Appendix E.'
