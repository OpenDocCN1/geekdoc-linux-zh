  md: "The shell prompt appears when the program finishes, indicating that the shell\
    \ is ready for your next command:\n$ \n\n# **27.3    Review of the Compilation\
    \ Process**\n\nRecall the command you used to compile the hello.f program:\n$\
    \ f77 hello.f(Return)\n\nThe f77 command appears simple, but it starts a fairly\
    \ complicated chain of events involving three separate programs:\n\n+   1.  The\
    \ Fortran 77 compiler goes through the source code in the file hello.f and makes\
    \ certain substitutions specified by the PARAMETER statements, if there are any.\n\
    \n+   2.  The Fortran 77 compiler translates the Fortran source code into object\
    \ code, which it places in a file named hello.o. (If there are syntax errors,\
    \ the compiler will not produce object code; instead, it will try to tell you\
    \ where the errors are to be found.)\n\n+   3.  The linker combines your object\
    \ code with any code your program may need from the UNIX standard libraries to\
    \ produce executable code. The executable code is placed in a file named a.out.\
    \ (In some cases, the object file hello.o is deleted automatically.)\n\nThe compiler\
    \ works on a copy of the code; it does not actually alter hello.f.\n\n# **27.4\
    \    Renaming the Executable File**\n\nNote that the file containing the executable\
    \ code is given the name a.out by the linker. If you want to save the executable\
    \ code, you must use the mv command to give this file another name—otherwise,\
    \ it will be overwritten the next time you use the f77 compiler.\n\n+   1.  **Use\
    \ the mv command to rename the executable file.** It is common practice to give\
    \ the executable code the same name as the source code, but without the .f suffix:\n\
    +   $ mv a.out hello(Return)\n\n+   2.  **Run the program.** Enter the new name\
    \ of the executable file:\n+   $ hello(Return)\n+   Hello, world!\n+   $"
  merge: -1
  img_proc: true
