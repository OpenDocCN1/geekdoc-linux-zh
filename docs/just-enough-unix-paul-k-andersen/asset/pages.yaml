    # ## 12.5 Jumping around the File


    The vi editor provides a convenient way to move the cursor rapidly to a specific
    line in the file.


    +   1. **If necessary, open the file with vi.**


    +   2. **In the command mode, type the line number and the Go command.** Thus,
    to go to the seventh line of the file, type `7G` in which the G stands for "Go."


    +   3. **To go to the bottom of the file, type G.** No line number is necessary:
    `G`


    You can also jump a certain number of lines above or below your current position:


    +   - **To jump backward, enter the number of lines you wish to jump, followed
    by a minus sign (-).** Thus, to jump back 9 lines from your current position,
    type `9-`


    +   - **To jump forward, enter the number of lines you wish to jump, followed
    by a plus sign (+).** Thus, to jump forward 5 lines from your current position,
    type `5+`


    # ## 12.6 Setting Line Numbers


