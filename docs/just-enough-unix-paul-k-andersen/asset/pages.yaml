- pgno: 97
  md: 'This will print the calenders on the standard output, but they will scroll
    by so fast that you cannot read them. One way around this problem is to redirect
    the output into a file:


    ```

    $ (cal 1999; cal 2000; cal 2001) > temp (Return)

    ```


    Now you can view the contents of temp using the more or pg utility:


    ```

    $ more temp (Return)

    ```


    or


    ```

    $ pg temp (Return)

    ```


    This will work, but it requires that you create a temporary file just to look
    at the output from the commands. You can avoid creating a file by using what is
    called a *pipe* which connects the output from one utility to the input of another.
    A vertical bar (|) is the pipe symbol. You would pipe the output from *command1*
    to *command2* like this:


    ```

    command1 | command2

    ```


    Thus, to view the calenders for 1999, 2000, and 2001, we can pipe the output of
    the cal utility to either more or pg:


    ```

    $ (cal 1999; cal 2000; cal 2001) | more (Return)

    ```


    or


    ```

    $ (cal 1999; cal 2000; cal 2001) | pg (Return)

    ```


    Note how this differs from redirection with > or >>. Redirection places the output
    from a utility into a file; the piping operation directs the output to another
    utility.


    # 8.8 Tees


    A *tee* allows you to save the output from a command in a file at the same time
    the output is piped to another command. We could take the output from **command1**
    and send it to the file **outfile** and to **command2** like this:


    ```

    command1 | tee outfile | command2

    ```


    Thus the command line


    ```

    $ (cal 2000; cal 2001) | tee calfile | more (Return)

    ```


    places copies of the calenders for 2000 and 2001 into the file *calfile* as they
    are also displayed on the terminal screen by *more*.'
