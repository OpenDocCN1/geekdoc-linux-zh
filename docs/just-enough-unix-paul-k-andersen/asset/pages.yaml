    +   5. Select a hyperlink link. Look down the list of links to find one that seems
    to offer what you are looking for.


    # 19.9 Quitting Netscape


    +   1. Pull down the File menu. This is located near the upper left corner of
    the Netscape window.

    +   2. Select the Exit option.


    # 19.10 Exercises


    +   1. Study the following sections from the Netscape Handbook:

    +       “Learn Netscape”

    +       “Graphical Elements”

    +       “Answers to Tough Questions”

    +   2. Refer to the Handbook to find out how to print a Web document on a printer
