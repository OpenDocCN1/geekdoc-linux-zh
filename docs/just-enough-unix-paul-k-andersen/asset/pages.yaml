- pgno: 62
  md: '# # 5 UNIX File System


    A UNIX *file* is a collection of related information—anything from a chocolate
    cake recipe to a computer program. Ordinary UNIX files are organized into special
    files called *directories*. The distinction between an ordinary file and a directory
    file is simple: ordinary files hold information; directories hold ordinary files
    and other directories. In this chapter, you will learn how the UNIX system keeps
    track of your files and directories.


    # ## 5.1 Home and Working Directories


    When you first log into your UNIX account, you enter what is known as your *home
    directory*. This is where you will keep any files or directories that you create.
    The name of your home directory is the same as your login name.


    After you have logged into your home directory, you are free to move to other
    directories in the system. Whatever directory you happen to be working in at the
    time is called your *current directory* or *working directory*. When you first
    log in, your working directory is your home directory.


    Each user on the system is given a home directory. On a typical large UNIX system,
    there may be hundreds of these home directories, each containing scores of other
    files and directories.


    # ## 5.2 The UNIX File Tree


    Figure 5–1 is a simplified diagram of a typical UNIX system. It looks something
    like an upside-down tree, with its root at the top. In fact, the directory at
    the very top, the one that contains all of the other directories, is called the
    *root*. Various other directories reside inside the root directory:'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# ### 5.2 The UNIX File Tree


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_63_0.png)


    **bin** This directory contains the software for the shell and the most commonly
    used UNIX commands. Although `bin` is short for “binary,” you may want to think
    of it as a “bin” for holding useful software tools.


    **dev** The name is short for “devices”; this directory holds the software needed
    to operate peripheral devices such as terminals and printers.


    **etc** Various administrative files are kept in this directory, including the
    list of users that are authorized to use the system, as well as their passwords.


    **home** Users'' home directories are kept here. On some large systems there may
    be several directories holding user files.


    **tmp** Temporary files are often kept in this directory.


    **usr** Some versions of UNIX keep users'' home directories in `usr`; others keep
    such useful things as the on-line manual pages here.


    **var** Files containing information that varies frequently are kept in the `var`
    directory. An example would be user mailboxes, which are typically found in the
    `/var/mail` directory.


    Although your particular UNIX system may be set up a bit differently, all UNIX
    systems have a root directory at the top.


    A directory will sometimes be referred to as the “parent” or the “child” of another
    directory. For example, `root` is the parent of `bin`, `dev`, `etc`, `home`, `tmp`,
    `usr`, and `var`; these directories, in turn, are the children of `root`. (Child
    directories are often called *subdirectories*.) Note that every directory except
    `root` has exactly one parent, but may have many children.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 5.3 File and Directory Names


    Every file and directory has a name. The name of your home directory is the same
    as your login, and you normally cannot rename it. However, you must choose names
    for any other files and directories you make. UNIX file names may comprise from
    one to fourteen of the following characters, in any combination:


    +   - Uppercase letters (A to Z)

    +   - Lowercase letters (a to z)

    +   - Numerals (0 to 9)

    +   - Period (.), underscore (_), comma (,)


    The file name should not contain spaces or any of the following special characters:

    & * \ | [ ] { } $ < > ( ) # ? '' \", ; ^ ! ~ %


    It is a good idea to choose reasonably short names (to save typing) that convey
    information about the contents of the file. Also, avoid using UNIX command names
    as file names.


    This book follows the convention that ordinary file names are given in lowercase
    letters, while directory names inside users'' home directories are capitalized.
    This will help you distinguish at a glance directories from ordinary files.


    # 5.4 Absolute Pathnames


    To use a file in your current directory, all you need is the file''s name. However,
    if the file is located in another directory, you will need to know the file''s
    *pathname*. A pathname is an address that shows the file''s position in the file
    system.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_64_0.png)


    *Absolute or full* pathnames give the location of a file in relation to the top
    of the file system. The simplest full pathname is for the root directory, which
    is represented by a slash:

    /

    The absolute pathnames for the root''s child directories, shown in Figure 5-1,
    are

    /bin /dev /etc

    /home /tmp /usr

    /var


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_64_1.png)


    Note that each of these begins with a slash ( / ), which tells you that the path
    starts at the root.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# **UNIX FILE SYSTEM**

    **5.4 Absolute Pathnames**


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_65_0.png)


    **Figure 5-2**

    **The home directories**

    **jack and jill. A**

    **large UNIX system**

    **may contain hundreds**

    **of home directories.**


    Figure 5-2 shows **home** and two of the users'' home directories it contains
    (**jack** and **jill**). You have already seen that the pathname for **home**
    is

    **/home**


    The full pathname for the user directory **jill** is

    **/home/jill**


    This is called the pathname of **jill** because it tells what path to follow to
    get from the root directory to **jill**. In this case, the path goes from the
    root directory, to the directory **home**, and finally to **jill**. Continuing
    further, the subdirectory **Marsupials** has the absolute pathname

    **/home/jill/Marsupials**


    Ordinary files also have absolute pathnames. For example, the pathname of the
    file **wombat** is

    **/home/jill/Marsupials/wombat**'
  merge: -1
