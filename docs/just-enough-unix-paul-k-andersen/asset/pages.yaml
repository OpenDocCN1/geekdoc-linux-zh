    # 16.11  Compressing Files


    The most common compression program found on UNIX systems is **`compress`**, which
    is very simple to operate:


    +   1  **Compress the file.** This is done by typing the **`compress`** command,
    followed by the name of the file to be compressed:


    ```

    ```

    $ compress marsupials.tar(Ret)

    ```

    ```


    +   2  **Check that the compressed file has been created.** Once again, enter
    the `ls` command to list the files:


    ```

    ```

    $ ls(Ret)

    ```

    ```


    You should see the names of both the original directory and the newly compressed
    file:


    `Marsupials marsupials.tar.Z`


    The **`compress`** program attaches the `.Z` suffix automatically.


    Once you have compressed the file, it is ready to be transferred by **`ftp`**.
    When using **`ftp`** to send a compressed file, be sure to specify **binary**
    (not **ascii**) file transfer type.'
