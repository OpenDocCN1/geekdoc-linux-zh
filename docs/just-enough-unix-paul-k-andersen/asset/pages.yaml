  md: '# 10 THE VI EDITOR


    A text editor is a program that you can use to create and modify files. UNIX systems
    typically offer a choice of text editors of which the vi editor is the most common.
    In this chapter, you will learn about UNIX text editors in general and about vi
    in particular.


    # 10.1 Text Editors versus Word Processors


    Before learning what a text editor is, you should understand what it is not. A
    text editor is not a word processor. True, both text editors and word processors
    are used to create and edit text files, but that is where the similarity ends.


    A word processor typically does more than a text editor. Besides adding text to
    a file, most word processing programs allow you to control the appearance of the
    text—the page layout, paragraph styles, typefaces, and so on—when it is printed.
    With some word processor programs, you can create tables and mathematical equations,
    and insert graphics.


    In contrast, a text editor does just that: edit text. Most text editors have limited
    text formatting capabilities. Generally speaking, a text editor is not intended
    to format text for printing.


    # 10.2 UNIX Text Editors


    There are a number of different text editors available on most UNIX systems:


    +   vi (pronounced “vee-eye”)—This editor was written by Bill Joy, a graduate
    student at the University of California at Berkeley (who later became one of the
    founders of Sun Microsystems.) Although originally found only on Berkeley UNIX,
    vi is now the standard editor on most UNIX systems.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '+   - **emacs**. Originally written by Richard Stallman at MIT, **emacs** is
    a powerful, feature-rich editor known for its flexibility: **emacs** can be personalized
    to fit the personal tastes of the user. Some versions of **emacs** supported windowing
    before windowing systems became common on UNIX.


    +   - **pico**. This editor is thought by many to be the easiest to use of the
    widely available UNIX editors. The menu structure of **pico** makes it especially
    friendly to the beginner.


    +   - **xedit**. This X client is a simple window-based text editor. It is available
    on most systems that run X.


    Because *vi* is likely to be found on nearly all UNIX systems, it is the editor
    featured in this book.


    # ### 10.3 How a Text Editor Works


    Regardless of the text editor you choose, the process of editing a text file can
    be summarized like this:


    +   1. You start the editor and give it the name of a file to edit.


    +   2. If you specified an existing file, the editor makes a copy of it and places
    the copy in a temporary workspace called the work buffer. If you are creating
    a new file, the editor simply opens up an empty work buffer.


    +   3. You use editor commands to add, delete, and/or change the text in the work
    buffer. When you are satisfied with the changes you have made, you tell the editor
    to \"write into the file.\""


    +   4. The editor saves the contents of the work buffer in the file. If you are
    editing an existing file, the editor replaces the original file with the updated
    version in the buffer.


    Note that you do not work directly on the file, but only on the copy that is in
    the buffer. This means that if you leave the editor without writing your changes
    into the file, the changes are lost, and the original file is not altered.


    # ### 10.4 Line and Screen Editors


    All editors do much the same thing, but some are decidedly easier to use than
    others. The original UNIX editor *ed* is called a *line editor*, because it makes
    changes in the buffer line by line. To make a change using a line editor, you
    must first specify the line where you want the change to be made, and then you
    must specify the'
