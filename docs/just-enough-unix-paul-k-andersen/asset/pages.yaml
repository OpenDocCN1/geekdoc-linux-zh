    change itself. This can be a lot of work for even minor changes. Furthermore,
    it can be difficult to keep in mind the way the changes fit into the text as a
    whole because you are working with just one line or group of lines at a time.


    ![](img/52d592fcd97ba67dcb2b4a36fde4eb4c_122_0.png)


    *A full screen editor*, on the other hand, allows you to view and to work with
    as much of the work buffer as will fit on your screen. You can easily move the
    cursor around the screen, making changes to characters, words, and paragraphs
    as well as lines. Any changes you make are always apparent because the screen
    is updated immediately. And you can see clearly how the changes affect the rest
    of the text because you can view many lines at the same time. The *vi* editor
    is a screen editor that was originally written for Berkeley UNIX, but is now found
    on almost all UNIX systems.


    # 10.5 vi Modes


    To use vi, you have to know something about its operating modes (Figure 10-1).
    When you first enter the *vi* editor, it is set to the *command mode*. This means
    that *vi* will treat all keystrokes as *editing commands*, and not as text to
    be entered into the file. Pressing **<Return>**, **<Backspace>**, or the space
    bar while in the *command mode* moves the cursor without introducing new lines
    or spaces into the text.


    To add text to the file, you must switch to the *insert mode*, which you can do
    using any of the following commands:


    +   * i    insert text to the left of the current cursor location

    +   * I    Insert text to the left of the current line

    +   * a    append text to the right of the cursor

    +   * A    Append text to the end of the current line

    +   * R    Replace (type over) existing text

    +   * o    open a new line below the current line and move the cursor there

    +   * O    Open a new line above the current line and move the cursor there


    None of these *insert-mode* commands appears on the screen, but everything typed
    in afterward does. Pressing the **<Esc>** key returns vi to the *command mode*.


    In general, you use the *insert mode* when adding text to the file, and the *command
    mode* for everything else (moving around the file, deleting text, etc.).


    Perhaps the most common difficulty that beginning vi users have is remembering
    which mode they are working in. When in doubt, hit the **<Esc>** key a couple
    of times to get back to the *command mode*. (If the terminal beeps or the screen
    flashes when you press **<Esc>**, that is a signal that you are in the *command
    mode*.)


    121'
