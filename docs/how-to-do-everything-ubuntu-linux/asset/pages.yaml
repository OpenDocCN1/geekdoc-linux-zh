  md: '# Chapter 12 All Your Base 151


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_172_0.png)


    FIGURE 12-2 What to do after you save the database


    Yes, register the database for me is chosen. Leave this option and move to the
    second question, After the database file has been saved, what do you want to do?
    Here you can opt to Open the database for editing, or you can choose to Create
    tables using the table wizard. Since these are check boxes and not radio buttons
    as in the previous question, you can also decide to select both of them so you
    can edit the database and create tables once the database has been saved. For
    our purposes, select both and then click the Finish button.


    # What It Means to Register a Database


    Registering a database does not list your database, or the data, in some file
    online in the OpenOffice.org web site. Instead, registering your database creates
    an entry in the OpenOffice.org data structure on your computer. Essentially, you
    are giving OpenOffice.org ownership of that database. If you were working with
    other database applications like MySQL or Oracle, you might not want to register
    your database. Unlike Microsoft Access, which assumes you will only be working
    with Access, the OpenOffice.org Database lets you choose. Again, this goes back
    to the core philosophies of GNU/Linux, Free Software, and Ubuntu.'
