  md: '# Chapter 5  Installing Peripherals  73


    Configuring is simple and similar to what someone coming from a Microsoft Windows
    environment may be used to.


    Unlike the days of old, GNU/Linux and the community that it supports have made
    great strides toward establishing a huge collection of peripheral devices that
    work seamlessly, and flawlessly, with this operating system. Now Dell has begun
    to offer brand-new computers complete with Ubuntu installed on them, you can bet
    that even more peripheral manufacturers will be making sure that their products
    work with Ubuntu and other GNU/Linux distributions. And as more business users
    begin to embrace GNU/Linux, more business class peripheral devices will soon be
    ready to work with this operating system out of the box.


    Of course, the resources listed in this chapter merely scratch the surface of
    the support GNU/Linux, and especially Ubuntu, receives from its community when
    it comes to peripheral devices and getting them to work properly. A good homework
    would be to search the Internet for more sites that offer this information.


    Should you find that any of your existing devices don''t work with Ubuntu, don''t
    be afraid to post a message in the Ubuntu forums. Let the community know that
    you are a newbie and need some help. More than not, an answer will be posted much
    sooner than you can imagine. Keep in mind, some things just won''t work. People
    who are switching to Ubuntu from a computer Windows Millennium Edition may find
    little support for their legacy ink-jet printer. Don''t forget, though, this same
    device will most likely not work with Microsoft Windows Vista either.'
