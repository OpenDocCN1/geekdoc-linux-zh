- img_proc: true
  md: '# Chapter 13 Drawn to Open Source 167


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_188_0.png)


    Now that the square is selected, we need to look up at the Lines And Fills toolbar
    where it reads "Blue 8." If we click on this, we are given a drop-down menu from
    which we can select from a wide range of colors. Scroll down until you find Ubuntu
    Orange and select that. Notice the color of the square changes to a nice, brilliant
    orange.


    Now let''s change the color by using a different method for changing the color
    for this shape. Again, use the Pointer tool to select the cloud. On the Lines
    And Fills toolbar, you should see a Paint Bucket icon. Click on the Paint Bucket
    to bring up a color called *Area*. From here, select Ubuntu Yellow and click OK.
    Now the cloud should have changed to yellow.


