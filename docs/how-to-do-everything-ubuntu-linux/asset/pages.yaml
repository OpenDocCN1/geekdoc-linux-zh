    # Fine Wine


    No, we are not taking a break for refreshments. Instead, we are going to look
    at the third way that you can run applications built for Microsoft Windows in
    your Ubuntu environment. Wine HQ, or "Wine" as it is commonly called, is another
    recursive acronym "Wine Is Not an Emulator". Wine is an application that allows
    computers using Unix-based operating systems to run Windows applications, not
    emulate them. The way this works is that Wine is an implementation of the Windows
    application programming interface (API). It''s okay if your reaction was "Huh?
    An application programming interface is actually the interface that one program,
    let''s say Microsoft Word, to communicate with another program, Microsoft. When
    applications written for Microsoft Windows use a format that GNU/Linux operating
    systems can''t understand, it is due to the API.


    Wine actually implements the APIs, so it acts as a translator for an operating
    system like Ubuntu. When a Windows application tries to do something Ubuntu doesn''t
    understand, Wine takes the program''s instruction and modifies it into something
    Ubuntu will understand.


    What does that mean? It means with Wine, you can run programs designed for Microsoft
    Windows on your Ubuntu computer! That''s right, Microsoft Word, PowerPoint, Excel,
    even Microsoft Access all run on any Unix-based operating system using Wine.


    > Although the programs you find under Ubuntu repositories and many of the others
    that exist in the open source community may be free of charge, many applications
    written for Microsoft Windows are not. Make sure that you abide by all licensing
    and purchase agreements if you plan on using Wine. Because you are using a free
    operating system doesn''t mean all of your software is going to be free.


    Using Wine has distinct advantages over the other two solutions we have discussed.
    First and foremost, you don''t need to purchase a Microsoft Windows license. Since
    you are not installing Windows and you are emulating Windows, you don''t need
    a license. Wine, like Ubuntu, is free.


    With Wine, you don''t have to reboot the computer to use with a dual-boot system.
    Also, your processor doesn''t have to share resources with a virtual machine as
    you would if you relied on VirtualBox. While both of the prior solutions are solid
    and have their merits, I truly believe that Wine is a much better solution for
    the home and small business user.'
  merge: -1
