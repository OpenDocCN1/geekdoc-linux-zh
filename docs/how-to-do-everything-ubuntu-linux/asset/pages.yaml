  md: '# Chapter 11 I’m Impressed 141


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_162_0.png)


    # 11-3 Slide transitions and presentation type


    The third step in the presentation wizard allows you to select the slide transitions.
    Transitions describe how the slides in your presentation change from one to the
    next. Choosing No Effect means the next slide will just appear. If you choose
    the Effect drop-down list, you will see many different options to choose from.
    As with the background in the previous step, a Preview window will show you how
    the slide will look so you can select the right one for your presentation. You
    can also select the speed of the transition here.


    Below the area where you select the slide transition is an area where you can
    select what type of presentation you will be creating (see Figure 11-3). If you
    leave it to Default, you cannot change any options here. If you select Automatic,
    you have the option of changing how long the slide will show on the screen through
    the Duration Of Page setting. The Duration Of Pause tells the presentation how
    Long to wait until restarting the slide show. If you leave it on Default, the
    slide show will restart immediately after the end of the show.


    # Transitions Say Quite a Bit About Your Presentation


    Many times when we are creating a slide show presentation, we get caught up in
    the neat transitions we can set. It is important to know your audience when using
    transitions. While checkerboards and diagonal squares may look impressive, they
    are not thought to be businesslike. For more formal presentations, make use of
    fades and wipes rather than transitions that have a great deal of activity.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# 142 Part III Open the Door to OpenOffice


    Once so you have chosen your transition and the presentation type, you can click
    the Create button on the window. This will bring up the Imp window. Like the other
    office applications, Impress has a Menu bar, a Standard toolbar, and a Formatting
    toolbar:


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_163_0.png)


    Below these three toolbars are three windows, each giving you information about
    the slides you are creating.


    # The Slides Window


    The Slides window will give you an organizational view of the different slides
    you have created for your slide show presentation. It will number each one and
    provide a visual of what the slides contains as far as graphics and text are concerned.
    You can add slides to your presentation in this window by right-clicking underneath
    the last slide in the window. If you right-click between two slides, Impress will
    insert the new slide there. You can also rearrange slides in your presentation
    here by left-clicking a slide. While holding down the left mouse button, drag
    the slide to its location.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_163_1.png)


    # The Workspace


    The workspace window, in the middle of the screen (see the following illustration),
    is where you can add text, graphics, and notes to your slides. The first tab,
    Normal, is where you will do most of your creative work on the individual slides.
    Once you have created your slide, you can choose one of the tabs to add other
    components to your presentation. The Outline tab will let you create one outline
    of your presentation that can help provide talking points when you are delivering
    your slide show to a live audience. The Notes tab is similar in that it lets you
    write notes about individual slides that give you a basis for what you should
    be talking about the slide is on the screen. The Handout tab allows you to print
    your slide show'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Chapter 11 I’m Impressed 143


    presentation on paper so that you can give a copy to each member of your audience.
    The handouts will also have space available for audience members to take notes.
    The Slide Sorter tab will give you the same information as the Slides window at
    left.


    # The Tasks Window


    The default menu in the Tasks window, at the right of the screen, is the Layouts
    menu. This allows you to select various layouts for your slides. Initially, you
    are given a blank slide to work with, but you can select any of the different
    styles in the Layouts area by left-clicking on the chosen layout.


    Once you have chosen a layout for your slide, you will see in the slide that acts
    as a placeholder. For example, select the layout to the right of the blank page
    to bring a Title Slide layout to your slide. It should look like the layout in
    Figure 11-4. Move your mouse to where the slide reads “Click to add title” and
    click there. When the text disappears, you are presented with a text box. Go ahead
    and type in a new title, but not press ENTER unless you want a carriage return.
    To get out of the text box, click another area of the slide. Try clicking “Click
    to add text,” and type some text in there.


    This can be done on any of the layouts. They serve as a template for you to work
    from. You can resize the text on the layouts, move them around, or even delete
    ones you you don’t. To do any of these things, you need to bring up the sizing
    handles, the little boxes that allow you to resize the area. This is done by moving
    your mouse to the edge of the text box until you see what looks like a little
    fist.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_164_0.png)'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# 144 Part III Open the Door to OpenOffice


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_165_0.png)


    FIGURE 11-5 Resizing a text box


    Now when you click the mouse, you will see the text box has changed and has little
    green boxes (see Figure 11-5). Pressing DELETE will delete this box. You can also
    grab the box to move it or grab a resize box to change the size of the box.


    > Note Other items in the Tasks window that we have not covered will be covered
    in upcoming sections of this chapter.


    # The Drawing Toolbar


    At the bottom of the Impress window is the Drawing toolbar. This is one of the
    most essential aspects of the Impress application. It allows you to select the
    tools to create the content of your slides. If you want to add shapes, symbols,
    extra text boxes, callouts, or even flow charts to your presentation, this is
    the place where you can find the tools to do that. If you are unsure as what the
    different icons are in the drawing toolbar, simply hover the mouse pointer over
    that, and a caption will appear to let you know what it will do.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_165_1.png)


    # Inserting a Graphic


    Slide shows are supposed to give your audience a visual during your presentation.
    What better way to do this than by inserting pictures, charts, and other graphics
    that can help your presentation jump off the screen?'
