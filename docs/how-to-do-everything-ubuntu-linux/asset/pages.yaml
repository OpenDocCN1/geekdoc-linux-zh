  md: '# Chapter 1 Ubuntu-Who? Get to Know Ubuntu 9


    To build his new operating system, Shuttle formed a company called Canonical,
    Ltd., to sponsor this project and pay the initial developers working on the software.
    The first team was a collection of programmers he had come to know from his work
    with Debian. Knowing that an open source project required the efforts of a community
    for success, the name Ubuntu was chosen, which stems from Shuttle''s home country
    of South Africa, exemplified the community process involved in the building of
    the operating system and a philosophy of “humanity towards others” in which this
    loose translation has come to exemplify Shuttle''s commitment to philanthropy.


    To create an operating system that could encompass the best of the open source
    / free software movement and the user friendliness of proprietary operating systems,
    the initial group of developers laid a foundation based on the characteristics
    they thought should be found in the ideal operating system. Some of the characteristics
    they felt important to the development of their distribution were


    +   * A frequent release cycle that users could count on

    * An operating system that was easy to use with a desktop that would be familiar

    * A strong focus on community that would work with existing Open/free software
    projects

    * The ability for the community to give back what they could


    This team ambitiously set a release date for six months later, but did not release
    this information to the public. Knowing that with such a quick turnaround time,
    the distribution was bound to have a few “warts,” they named the first version
    of the operating system Warty Hedgehog. Version 4.10 was then released to the
    public and immediately became a hit, reaching the number 13 spot on DistWatch.com
    ranking for 2004. After being out in public for only three months, it found itself
    only one spot behind the industrial giant Red Hat!


    > A GNU/Linux distribution consists of the Linux kernel, libraries and utilities
    from the GNU project, and applications that are assembled by a company or community.
    A version represents a change made to the distribution.


