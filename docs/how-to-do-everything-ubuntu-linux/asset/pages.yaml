    # Cedega


    Early in this book I made the distinction that not all open source software is
    free of charge. Cedega is an example of this. Cedega is built off of the Wine
    code to allow GNU/Linux users the opportunity to run applications for Microsoft
    Windows on their computer systems. While Wine strives to support any and all applications,
    Cedega focuses on many video games.


    Cedega works on a monthly subscription service. By paying the subscription, you
    are entitled to updates for the software, support for your product, and access
    to the forums of TransGaming, the company that produces Cedega. Since this is
    a commercial product, the people creating updates and monitoring Cedega''s support
    are actual employees of TransGaming.


    > Many opinions as to whether Cedega is better than Wine or vice versa. Many people
    in the community forums suggest trying Wine since it is free. Many others suggest
    Cedega it is built specifically for gaming and is easier to configure. If you
    have noticed, the communities surrounding open source software can offer a bit
    of help, but often are laden with individual opinions. Take the advice of those
    who are well enough to use what works best for you.


    To install Cedega, you will have to subscribe to TransGaming''s web site. In the
    address bar This will take you to the home page of TransGaming Technologies, where
    you need to click on Register Now. You will be required to provide personal information
    to TransGaming as well as payment information. Once you have purchased your subscription,
    TransGaming will send you a temporary password and your login information. After
    you log into the TransGaming site, select Downloads | Cedega from the top menu
    bar. You will be taken to a page like that in 18-2.


    You can also download the Cedega Quick Start and Troubleshooting guides here you
    need them.


    From the Downloads page, you need to select the package to install. Scroll down
    to the middle of the page, locate cedega-small_6.0.2_all.deb, and double-click
    it. The download window should now open and ask what you would like were Firefox
    to do with this file. Since it is a DEB package, you have the option to leave
    the default Open With GDebi Package Installer, or you can choose Save File, which
    will save the package to your desktop to open. Let''s keep the default, choose
    the Open Option with, and then click OK. Doing so will launch the Package Installer
    window'
