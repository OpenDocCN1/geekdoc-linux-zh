  md: '# We Are Running Out of IP Addresses


    As many devices nowadays have some sort of ability to communicate with other devices,
    the number of available IP addresses is running low. The current IP addressing
    scheme is called IPv4 (internet protocol version 4) in a binary format, and allows
    for 4,294,967,296 unique addresses. This may seem like a few, but if you take
    into consideration how many people are on the planet, and how many devices each
    person and business have connected to the Internet, you will see how quickly they
    can be used up.


    To protect against potential disaster, some really smart people came up with IPv6,
    which uses a hexadecimal addressing scheme and can provide up to 340 undecillion
    (3.403×³⁸) addresses in a format that resembles this: 2001:0db8:85a3:08d3:1319:842e:0370:7334.


    To access the network-admin application, you need to know that the interface will
    be grayed out and unusable. Not to worry though, this is a security feature built
    into Ubuntu. You must first unlock the user interface by clicking on the Unlock
    button. After you do this, you will need to supply your password when asked; then
    click the Authenticate button or press ENTER.


    # Configuring Ethernet Settings


    In the early days of connecting to the Internet, people used dial-up modems connected
    to a phone jack in the wall with a phone cord. While they served their purpose,
    they are too slow for today''s graphic-intensive work and an unreasonable choice
    for home networking. Nowadays, users connect to the Internet with high speed DSL
    or cable access. To handle the higher speeds, computers connecting directly to
    the high speed utilize the Ethernet card and a thicker networking cable. Other
    computers, especially laptops, make use of wireless networking. Wireless networking
    works in the same way as a wired connection, but without being tethered by a cable.


    When the network-manager tool is unlocked, you are presented with the Network
    Settings window that lists all of the available network connections. Figure 14-2
    shows Wired Connection, which is the Ethernet connection, and Point To Point Connection,
    which is the dial-up modem on the computer. Yes, most computers still come with
    a dial-up modem installed. If a wireless connection or additional Ethernet connections
    are available on your computer, these will appear as well.'
