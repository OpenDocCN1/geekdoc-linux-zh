  md: '# 13


    # Drawn to Open Source


    HOW TO...


    +   - Draw simple shapes

    - Format drawings

    - Save a screenshot

    - Import a graphic

    - Create a flowchart


    Almost anyone who has used Microsoft Windows has spent their fair share of computer
    time playing around with Microsoft Paint. This small graphics program allows users
    to both create simple drawings and to modify screenshots that can be used in a
    document or presentation.


    Ubuntu has included a similar application from the OpenOffice.org suite called
    Draw allows users to do many of the same things they were used to in Microsoft
    Paint and more. Opening OpenOffice.org Draw is different from how you opened previous
    applications from this suite. Draw is automatically installed with Ubuntu, it
    is not under the Office category of Applications. To open Draw, you must go to
    Applications | Graphics | OpenOffice.org Drawing. Figure 13-1 shows the result.


    # Drawing Simple Shapes


    When you look at the new drawing, you will see the blank canvas in front of you
    and a list of Pages on the left side of the screen similar to the Slides pane
    we saw in Impress. Like other OpenOffice.org applications, the Menu bar is at
    the top of the screen. Underneath this is the Standard toolbar followed by the
    Line And Filling toolbar. At the bottom of the screen is the Drawing toolbar.
    This is where most of the work is done in Draw. Makes perfect sense, right?'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# 164 Part III Open the Door to OpenOffice


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_185_0.png)


    FIGURE 13-1 New drawing


    # Did You Know?


    In OpenOffice.org, you can customize your toolbars with the little arrows to the
    far right of the toolbar. Clicking on these provides you with drop-down menus
    featuring many different options for your toolbars. You can add or remove buttons,
    change the icons, assign hot keys, and customize your toolbar in many other ways.


    > Note Hot keys allow you to use a quick combination of keystrokes to allow you
    to move between functions in a particular program.'
