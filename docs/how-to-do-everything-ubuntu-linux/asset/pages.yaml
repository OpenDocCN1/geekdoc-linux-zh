- img_proc: true
  md: '# 276 Part V Having Fun with Ubuntu


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_297_0.png)


    FIGURE 20-4 One of the more kid-friendly themes found in Edubuntu


    Many schools are the recipients of older-model computers, and teachers often find
    that the computers are too old to run the latest version of Microsoft Windows.
    This is where Edubuntu can help. Included in Edubuntu is the Linux Terminal Server
    Project (LTSP). What this does allows schools to turn old computers that may not
    have the computing power to run Microsoft Windows, Microsoft Office, or even Ubuntu
    into what are called thin clients. Thin clients are computers that run off the
    processing and storage of a central server. Basically, one really powerful computer,
    the server, handles all of the computing tasks and data storage for each individual
    thin client. Schools save money because they don''t need to buy pricey computers
    but can rely on inexpensive thin clients or even turn old computers into thin
    clients. Not only do schools save money on the purchase of computers, but they
    also save in reduced administrative costs since they only have to install and
    maintain the software on the server. Also, if a thin client should need repair,
    it can be replaced by just plugging a new thin client into the network.'
  merge: -1
