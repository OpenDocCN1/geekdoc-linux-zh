- img_proc: true
  md: '# Chapter 10 Spread Out with Calc 131


    data in your spreadsheet, make sure that everything you enter in the cells you
    will be working with a number.


    # Adding Numbers in a Row or Column


    The simplest calculation you can perform in Calc is totaling numbers through addition.
    Although you can type a formula that adds the content of each cell, A1 + A2 +
    A3..., it is far easier to select the Sum button, Σ


    To use the Sum button, simply select the cell at the end of the row or column
    whose cells you wish to total. Now, click the Sum button, and it will list the
    appropriate cells in a format like this: =A1:A5 in the Formula bar. This means
    "add the numbers from cells A1 to A5 and place the total in the cell you have
    selected." If you wish to select other cells, simply place the cursor in the Formula
    bar, and type the address of the cells you wish to total.


    Another way to select the appropriate cells for the Sum calculation is after you
    click the Sum button, a thin border will appear around one or more cells. Using
    the mouse, you can drag this border to encompass all of the cells in a row or
    column that you wish to total.


    # Calculating Averages


    After totaling a series of numbers, the most common calculation made in a spreadsheet
    is finding the average of a series of numbers. Calc makes this an easy job as
    well. In Figure 10-4, we see a spreadsheet with a series of numbers in column
    A. In cell A6, the $24.00 represents the average of the cells in this column.


    Take a look at the Formula bar in Figure 10-4, and you will see that it reads
    = "AVERAGE(A1:A5).\ To do this, you need to select cell A6. Then click the = button
    on the Formula bar, and the = will appear in the Formula bar. After the , type
    AVERAGE(A1:A5), and the average of these cells will be placed in A6 for you.


    > numerical character, if you type it in front of your numbers, Calc will assume
    it is a Currency field. Even though $ is not a numerical character, you can still
    perform mathematical calculations with Currency fields.


    # Arithmetic


    You can set a formula for any arithmetical sentence in the Formula bar just like
    you did with the Average. Select the cell you wish the result of the formula to
    be placed in, click'
