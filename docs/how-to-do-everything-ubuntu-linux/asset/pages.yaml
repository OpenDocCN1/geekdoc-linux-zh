    and burned cleanly out to a CD by Checking CD For Defects. The CD-ROM has checked
    and comes out okay, you will be asked to Press Any Key to Reboot the System. You
    can now press any key on the keyboard; do not look for a specific key called Any...it
    does not exist! If the CD-ROM has any errors, you will have to burn a new copy
