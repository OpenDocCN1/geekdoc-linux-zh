  md: '# Chapter 13 Drawn to Open Source 165


    To add shapes to a new drawing, let''s take a look at the Drawing toolbar. The
    following table provides you with the various icons listed in the default toolbar
    along with a description of what they do:


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_186_0.png)


    | Pointer | Description |

    | --- | --- |

    | Pointer | Allows you to move and manipulate shapes, text boxes, or any other
    items in Draw |

    | Line | Used for drawing lines |

    | Arrow | Used to add arrowheads to lines |

    | Rectangle | Used to draw rectangles and squares |

    | Ellipse | Used to draw rounded shapes |

    | Text | Allows you to insert text boxes |

    | Curve | Used to draw shapes and polygons |

    | Connector | Allows you to connect shapes and boxes to one another |

    | Line and Arrows | Menu activated with the line and arrow tools; allows you to
    choose different lines and arrows |

    | Basic Shapes | Menu activated with the Rectangle or Ellipse tool; allows you
    to choose other basic shapes |

    | Symbol Shapes | Used to insert predefined symbols |

    | Block Arrows | Used to insert large arrows into a drawing |

    | Flowchart | Lets you insert flowchart shapes |

    | Callout | Allows you to insert callout boxes |

    | Stars | Lets you choose from different stars |

    | Points | Allows you to manipulate the points on different shapes |

    | Glue | Allows you to insert a glue point to connect different shapes |


    To draw a basic shape, you need to simply choose the appropriate tool from the
    Drawing toolbar so you are given a cross hair. This cross hair will serve as your
    starting point. Once it is placed at the point of the canvas you can left-click
    the mouse and drag the mouse until the shape is the size you like. If the shape
    is too large or too small, it can be resized using the Pointer tool. With the
    Pointer tool, you can hover over one of the Points on the shape until the resize
    arrow appears. Now simply hold down the left mouse button to resize. Objects can
    be moved with the pointer tool as well, by moving the pointer over the shape until'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'you see the little hand pointer. Again, hold down the left mouse button, and
    drag the shape to wherever you desire on the canvas. You can do this for any of
    the various shapes that Draw has drawn for you.


    # Formatting a Drawing


    Draw would be pretty weak if all it did draw blue shapes for you like those shown
    in Figure 13-2. Without much effort, you can format the different shapes by changing
    the colors, adding shadows, adding a gradient, and changing the lines.


    # Changing Colors


    Let''s take a look at the square and the cloud from Figure 13-2. Suppose you want
    to change the color of these two shapes. Using the Pointer tool, select the square
    by clicking on it. Once it is selected, you should see the points at all four
    corners and the middle of each side.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_187_0.png)


    FIGURE 13-2 Various shapes'
  merge: -1
