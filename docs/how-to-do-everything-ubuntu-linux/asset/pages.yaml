    # # Restoring Data


    While we would hope that you never have to restore lost data, sometimes this process
    is necessary. Since you have made a commitment to maintain a consistent backup
    schedule, restoring data should be fairly easy.


    > Home User Restore exists in the Applications menu; however, in some versions
    of Ubuntu, launching this application from there has not been effective. Instead,
    you can launch Home User Restore from the terminal to avoid any issues.


    To restore the backup files you created, you need to launch the terminal by selecting
    Accessories | Applications | Terminal. In the Terminal window, type the following:


    ```

    sudo -x /path/your_archive_file -R /path/targetfolder

    ```


    In this example, path would be the path to your archive file and target_folder
    would be the folder you want to send your restore files to. Using the files I
    created and saving them to a folder on my desktop named “backup,” I would type
    the following to restore them to a folder named Restore on my desktop:


    ```

    dar -x /home/backup/jeff-master-archive -R /home/Restore

    ```'
