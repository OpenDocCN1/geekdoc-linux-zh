  md: '# Appendix Install Ubuntu 319


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_340_0.png)


    FIGURE A-16 Completing the Ubuntu setup


    If you are going to continue to work in Microsoft Windows, you can choose the
    I Want To Manually Reboot Later option and then click Finish. This will keep your
    Windows session active and allow you to continue in the Windows environment. When
    you next restart the computer, you will be given the option as to which operating
    system you wish to boot.'
