    # Installing Antivirus Software


    One misconception about GNU/Linux is that no viruses exist for this operating
    system. This is simply not true. For some time GNU/Linux did not feel the constant
    pressure of malware attacks that Microsoft Windows did. While researchers did
    viruses that could infect the GNU/Linux operating systems, they were for research
    purposes only. However, viruses have since released that have the ability to infect
    computers running a GNU/Linux operating system. More and more, people are beginning
    to see viruses “in the wild” that can damage these operating systems.


    > A virus that has been released to the public is said to be “in the wild.” While
    how security experts can differentiate between a virus that is for research and
    one whose intent is to cause harm to a computer system. Partly as a hobby people
    collect malware “in the wild” so that they can analyze the code of the malware
    and fight against it.


    Ubuntu, remember, was built on the philosophy that Ubuntu “Just Works.” For Ubuntu
    to work properly, antivirus software needs to be made available to the users of
    Ubuntu. Antivirus software works in many ways. First of all, this software needs
    to detect malware on a computer system by knowing what to look for. This information
    is provided by a signatures file that the software will download and install automatically.
    If these signatures are outdated, then the computer is vulnerable to the latest
    malware.


    Signature files are also called “definition files” by certain antivirus applications.


    Since most antivirus software manufacturers charge not only for the application
    but also for a yearly subscription for the virus definitions, finding one that
    fits the Ubuntu software model might seem a bit difficult. Fortunately, quite
    a few companies have opted not to charge home users for antivirus and the definitions.
    From this list, the Ubuntu community chose ClamTk since it falls under the GNU
    Public License.'
