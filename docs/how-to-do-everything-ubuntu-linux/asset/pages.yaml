  md: '# About the Author


    **Jeffrey Orloff** is the director of technology and one of the founding members
    of Safewave, LLC, where he oversees the IT department and security for the iLAND5.com
    network for kids. Through his work with Safewave and the iLAND5.com project, he
    is actively involved with the Safewave Foundation, a not-for-profit organization
    that helps promote safety for kids.


    Jeffrey has also spent over 13 years working with educational technology as a
    classroom teacher, a technology coordinator for the School District of Palm Beach
    County, a network administrator for Survivors Charter School, a post-secondary
    instructor for courses including IT security, Windows Server, and GNU/Linux, and
    as part of an educational software development team.


    # About the Technical Editor


    Since 1995, and under the cover of darkness, **Bill Bruns** has been a technical
    editor, working on more than 125 books relating to operating systems, the Internet,
    web servers, HTML, and Office applications. In his day job, he is the webmaster
    for the Student Center at Southern Illinois University Carbondale (www.siucstudent.org).
    He is also involved with several other not-for-profit organizations as a stalwart
    volunteer, always being asked to undertake the challenge of webmaster. Over the
    years, he has managed all sorts of servers and workstations, and been pleased
    with the performance of Linux and Ubuntu. Bill holds bachelor''s degrees in Telecommunications
    and English Literature from Indiana University and a Masters of Public Administration
    from New York University.'
