    # ## Updates for Security’s Sake


    For most companies, a rush to get their individual software packages into the
    marketplace ahead of the competition is the most important factor in the development
    process. Whether the software is an operating system, a productivity suite, or
    a specific tool, profits often hinge on being the first one on the shelves. Whenever
    software developers are under intense pressure to release their product in a hurry,
    things are often overlooked, and steps like testing can be cut short. Unfortunately
    for the consumer, this rush to market is also considered to be the cause of many
    vulnerabilities by malicious hackers to compromise computer systems.

    Fortunately, most software comes with an automated update package that is installed
    on the computer when the software itself is installed. For those familiar with
    Microsoft Windows, Windows Update is an example of this. Whenever Microsoft developers
    issue an upgrade or a patch, a little icon in the lower-right corner of the screen
    pops up and alerts the user that an update is available.

    Of course, computers are supposed to make your life easier. So for those who do
    not want to be bothered by constant warnings and alerts from Microsoft, the updates
    can be automatically set to download and install at a specific time. Generally,
    this time is set to when the computer is not being used so that the process happens
    much more quickly.'
  merge: -1
