    # Advanced Design


    Okay, the web page we created here is pretty basic compared with some of the huge
    data-driven, dynamic sites out there on the Web. Don''t get discouraged! If web
    design is something you are interested in, begin by learning more about Cascading
    Style Sheets. This will not only make your life easier, but also allow you to
    create pages where the entire site is updated with a few clicks of mouse.


    If you are really into functionality, the Ubuntu Server Edition allows you to
    set up a LAMP environment for hosting dynamic web sites. LAMP contains Linux,
    your Ubuntu operating system; Apache, a web server; MySQL, a database; and PHP/Perl/Python,
    the scripting languages that tie everything together. Web design has changed how
    the world communicates, shops, entertains itself, you you name it. Being able
    to harness the capability presented by the Web is a marketable tool that can take
    you anywhere you want to go.'
