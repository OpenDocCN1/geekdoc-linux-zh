  md: '# Chapter 14 Share and Share Alike—Networking Ubuntu 183


    # Installing Samba


    To get started with Samba, you need to first get your computer set up. In Figure
    14-5, you saw how to find the name of your computer. Make sure that you have noted
    this name. The one we have been using throughout this book is jef-desktop.


    Now you need to install the Samba GUI by going to Applications | Add/Remove and
    searching for “Samba”. When you have found Samba, place a check mark next to it,
    and click Changes to install the application.


    Now you need to add your user account to the shareshare group. Go to System |
    Administration | Users Groups. Once the settings window opens, you will need to
    unlock the configuration by clicking the Unlock button. Now click Manage Groups.
    When the Group settings appear, scroll down until you see “sambashhare.” Select
    samba and then click Properties. Under Group make sure your username and the usernames
    of anyone else you want to have this privilege selected. Now you can click OK
    and then click Close on the other windows to continue.


    Next, you need to create a Samba share by clicking on System | Administration
    | Samba. When you click this, you will see the Samba Server Configuration window.
    Click the Add Share button (shown next) to open the Create Samba Share window
    you see in Figure 14-6. Use the Browse button to find the folder you want to share.
    Once you have selected the folder, click OK. Now you can define how users can
    make use of this. If importantly, you want people to be able to save to this folder,
    make sure Writable is checked. If you want users to be able to see the folder,
    make Visible is checked. Click the Access tab and choose the users you want to
    share this folder with. If you want anyone on the network or workgroup to access
    this folder, select Allow To instead of selecting individuals. Click OK to create
    the share. If you ever need to edit the settings, you can select the shared folder
    in the Samba Share Configuration window and select Properties.


    | Ele Preferences Help |

    |---|---|---||

    | + Add Share Properties Delete | ? Help |

    | Directory | Share name | Permissions Visibility Description |

    | /var/lib/samba/printers print$ | Read Only Visible Printer Drivers |


    Tip You can also enable sharing by right-clicking a folder and going to Sharing
    Options. All you have to do is place a check mark to Share This Folder and sharing
    will be enabled. This method is quicker, but it does not allow for as much configuration.
    You can only allow permissions and guest access through this method.'
