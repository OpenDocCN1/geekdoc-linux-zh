  md: '# Chapter 5 Installing Peripherals 71


    # What Is a Wiki?


    Most people who are familiar with the World Wide Web are familiar with the term
    “wiki.” A wiki is defined as a collection of web pages, or online resources, that
    the user community can edit by adding to, deleting from, or changing it at any
    time. The term wiki comes from the Hawaiian word for “quick,” as it can be edited
    quickly. For the Ubuntu Wiki, registered members can add and change pages whenever
    it is necessary. If you were to visit https://wiki.ubuntu.com/HardwareSupport,
    the content would likely be different from what you see in the accompanying graphs.
    The reason for this is that community members can add content daily to this wiki.


    Wikis are extremely handy tools. Companies like Canonical use wikis to support
    their products, but some contain random information, like the popular Wikipedia,
    which is a web-based encyclopedia that any registered member can add information
    to...


    You may be wondering about the accuracy of a wiki if anyone can add or edit a
    page. This can be a problem since not everyone has their facts straight all of
    the time. Thanks to the support of community members, errors found in wiki entries
    are often corrected immediately to keep the integrity of the document intact.
    After all, if a wiki is full of inaccuracies, no one is going to continue to use
    it.


    At the bottom of a page is a link to page listing wikis that do not require proprietary
    firmware. In addition to device drivers, peripheral devices have programs that
    help control their operation. A firmware program does not run on your computer,
    but is stored on the circuitry of the device itself, usually in a ROM chip. These
    wikis work well with GNU/Linux distributions and gain extra support from the Free
    Software Foundation, which maintains this list. The Ubuntu distribution is considered
    a free software system, the wikis listed on this page, www.sf.org/resources/hw/cameras,
    should work without any problems. The Free Software Foundation keeps a list of
    many other devices that work with free software. This list can be viewed by going
    to www.sf.org/resources/hw.


    Organizations like the Free Software Foundation work off of people who use their
    sites and information. As a member of the GNU/Linux community, you may want to
    consider a donation of money or volunteer work for one or more of these organizations.
    They are happy to accept any type of donation, and don''t worry about a gift being
    too small.


    # Installing Peripheral Devices


    Once you have the peripheral device, you need to install it so that it works with
    your computer. Like Microsoft Windows, Ubuntu is a plug-and-play feature. Plug-and-play
    means that if the operating system, the BIOS, and the device all support plug-and-play,'
