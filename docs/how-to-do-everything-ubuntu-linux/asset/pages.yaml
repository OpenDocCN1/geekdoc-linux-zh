  md: '# Chapter 15 Can We Talk? Communications and the Internet 199


    # How Smart E-Mail Programs Are


    As e-mail becomes more and more a part of our daily lives, it can become burdensome
    for people who receive hundreds of e-mails a day to organize them effectively.
    To help keep e-mails under control, e-mail programs often allow users to set up
    filters for their incoming e-mails. These filters can send e-mail from designated
    addresses to an assigned folder, send mail with a particular subject line to another
    folder, and send mail with attachments to yet another folder. Filters can be set
    to look for just anything in an e-mail message and respond to it in any way that
    the e-mail program is directed to.


    Once you have determined how Evolution will handle incoming e-mail, it is time
    to configure how it will handle e-mails that you send from the Sending screen
    (see Figure 15-9). For the Sending Email server Server Type option, you will probably
    use the default, SMTP. Under Server Configuration, you will type the outgoing
    server''s


