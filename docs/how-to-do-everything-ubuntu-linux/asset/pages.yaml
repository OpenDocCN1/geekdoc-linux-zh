    Creating a flowchart is simple. In the Drawing toolbar, select the Flowcharts
    menu to bring the various shapes that are offered. Choose which shape you will
    be, and with the other shapes, draw it on the canvas.


    > Did You Know?

    What a PNG Is


    The file extension .png stands for a Portable Network Graphic file and describes
    a format in which you can store pictures. This type of file is similar to JPEG
    and GIF files, and it was created to reduce bandwidth when transferring a web
    page from server to computer because it has better compression than JPEG, while
    offering many colors. PNG files provide more colors than GIFs, making the use
    of a PNG file more attractive than its counterparts.'
