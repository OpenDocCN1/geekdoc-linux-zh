    look at the bottom of the F-Spot window for the editing icons (see Figure 19-7).
    Here, you can select the Crop tool to cut out part of the picture, the Red Eye
    Remover to take out any red spots on the pupils, use Convert To Black And White
    or Convert To Sepia to make more stylistic changes to the picture.'
