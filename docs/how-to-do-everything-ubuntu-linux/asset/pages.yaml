  md: '# Tux the Penguin


    Tux appears on most web sites dedicated to Linux and has been dressed in many
    different costumes by users who freely manipulate the artwork.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_27_0.png)


    One of the biggest projects to come out of Stallman''s free software movement
    was an operating system that he and other programmers in 1990 called GNU, a recursive
    acronym for GNU''s Not Unix. This operating system was designed as a completely
    free OS. Not only would programmers have the opportunity to modify the source
    code, but the operating system software itself would cost us nothing!


    > A recursive acronym is one that refers to itself in the acronym.


    However, this operating system was not yet complete. It was missing a vital component
    called a kernel. This essential piece of the operating system controls the allocation
    of the computer''s resources, interfacing with hardware devices, accessing programs,
    and security, to name a few. The GNU team found this central piece of their operating
    system in a kernel written in 1991 by a programmer named Lin Torvalds. "Linux"
    or Unix," was the name given to this kernel. The operating system of this marriage
    was called the GNU/Linux operating system. Since then, the GNU has been dropped
    from the name in many circles, and the operating system is known simply as Linux.
    However, Stallman and others still refer to the operating system by its full name,
    stating that Linux is the name of the kernel that runs the operating system not
    the software as a whole. According to Stallman, not referring to GNU/Linux by
    its whole name does not give credit to those who worked so hard on other aspects
    of the operating system.


    # The History of GNU/Linux


    Although the GNU/Linux operating system was generally free to anyone but open
    source and in price, it did not catch on the commercial computer market. For starters,
    GNU/Linux didn''t come packaged like other operating systems, such as Microsoft
    Windows. Instead, a great deal of programming knowledge was needed'
