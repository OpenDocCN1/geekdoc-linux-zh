  md: '# Chapter 6 Beyond the Basics: Install Extra Software 81


    # Using the Ubuntu Disc


    Sometimes you find yourself unable to connect to the Internet. Without a connection,
    you won''t be able to download files from the Ubuntu repositories for installation.
    If you should find yourself in this predicament, you have the option to install
    applications from the Ubuntu installation CD if you have this feature enabled
    in the software sources in Synaptic Package Manager. To enable this feature, navigate
    to System | Administration | Software Sources. Now check the box in the section
    that reads; Install from CD-ROM/DVD.


    # Installing Software from the Outside World


    Ubuntu has thousands of applications available in its repositories. For some of
    us, that may not be enough. Suppose there''s one video game that you have to play,
    and you need to download and install the application to your computer. One of
    the best sites for a GNU/Linux newbie is tucows.com/linux. Actually, it''s a great
    site for the old hand as well. Tucows groups applications into categories and
    subcategories. Let''s look at Figure 6-4, where we are going to download a backgammon
    game from Tucows.


    Once the file has been downloaded, you are presented with a new dialog box offering
    to open kbufs-1.0.5.tar.gz. If you are moving over from Microsoft Windows, you
    may notice that the program''s dialog box resembles the ZIP file extraction utility.
    Choose which folder you would like to extract the file and then click Extract.
    In this instance, we will be extracting the file to the desktop.


