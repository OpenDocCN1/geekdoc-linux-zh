  md: '# Accessibility


    The Accessibility tab provides you with choices regarding what users see, hear,
    and can do at login. The option to Enable Accessible Login should be left unchecked.
    The Themes section allows users greater control over their greener screen. The
    Sounds section gives you the most configuration options, allowing you to choose
    what sounds users hear at successful and failed login attempts.


    > If you hover over the different choices, you will be provided with more information
    about what that option does. Under this tab, references are made to GTK+. GTIMP
    Tool Kit, which is used to create the graphical user interface (GUI).


    # Security


    The security section helps you protect your computer from unauthorized login attempts,
    idle logins, and permissions for heightened security. While a great deal of security
    is a good thing when it comes to computers, a great deal of common sense is often
    better. You may be inclined to set all of the security settings to their strictest
    levels, but keep in mind that experts warn that the higher a computer''s (or network''s)
    security levels are elevated, the less user friendly the computer (or network)
    becomes.


    In the Security tab, you should only worry about two sections as a novice Ubuntu
    user. The first is the Enable Automatic Login option. By default, this first option
    is left unchecked. Checking it allows you to select a user that your Ubuntu computer
    will automatically log in as. If you are trying to protect your computer, leave
    this option unchecked, forcing users to provide a username and password at the
    login screen. Instances where someone would enable the automatic login may be
    to allow small children or guests to use the computer.


    The other that you should worry about now is the one below the Enable Automatic
    Login, which is Enable Timed Login. Again, this is unchecked by default. Choosing
    this option by checking the box would automatically log in after a certain amount
    of time. For instance, a coffee shop running Ubuntu can set all of the computers
    to log in to the Guest account if no one else logs in after 30 seconds. This gives
    an employee, or a member, the opportunity to log in with his or her account before
    the Guest login automatically takes place. The time set before the timed login
    is determined in this tab as well. Obviously, too short a time period does not
    allow users the opportunity to log in, and too long a wait can be annoying to
    the user.


    # Users


