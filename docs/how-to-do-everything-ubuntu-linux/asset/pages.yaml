    FIGURE 19-7 Photo editing


    # Recording Sound and Video


    If you are ready to become the next Internet sensation, let''s plug in the webcam
    and get rolling... With your webcam plugged in and the drivers installed, the
    webcam will open up the software bundled with the device. Using this software,
    you can record video and audio if your hardware is supported by Ubuntu. These
    videos can then be saved in your file system under Videos.


    Since you may not get everything perfect on the first take, it may be necessary
