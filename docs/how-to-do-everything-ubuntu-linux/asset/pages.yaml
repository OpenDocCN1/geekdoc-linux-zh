    # How to What Hardware You Have


    Whether or not you are going to add new hardware to your computer, you may want
    to see exactly what hardware computer is running. The Ubuntu community supports
    a KDE program called Device Manager that can be added to your Applications menu
    using the Add/Remove tool. Perform a search for Device Manager to find this application
    to install. This program is quite informative and gives you a really nice interface
    for all of the hardware on your computer.


    While Device Manager is nice, this information can be accessed from the terminal
    as well. This is another way to get some practice in the terminal, so take a moment
    to bring up the terminal window and type


    ```

    sudo lshw

    ```


    Now you will be asked for your password. Once you enter your password, you will
    be given a long list of all the hardware on your computer. Using the lshw command
    will even give you the appropriate driver information for the device you are looking
    at. Alternatively, you can type the following in the terminal to access other
    hardware information; just make sure to type sudo before the command, to run as
    a super user.


    | lshw -short | Provides you with a shorter summary of hardware information |

    | lspci | Provides you with a list of devices connected through a PCI bus |

    | lsusb | Provides you with a list of devices connected to your computer through
    a USB port |

    | cat /proc/cpuinfo | Provides you with information about your computer''s processor
    |

    | lshw -class network | Provides you with information about networking devices
    |'
