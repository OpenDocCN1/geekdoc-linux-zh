  md: '# Chapter 22 The Emacs Text Editor 299


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_320_0.png)


    The toolbars is the editing buffer. This is where the actual typing will be done.
    Underneath the editing buffer is a line that says "GNU Emacs." This is called
    the mode line. The mode line separates the buffer and the message area. The message
    area will display the commands you enter into the editor and will also display
    any responses or messages from Emacs.


    # Buffers


    When you open a file in Emacs, you are not really opening a file. You are opening
    the file into a buffer. When you are working in the buffer, the actual file does
    not change, because you''re only working on a copy of the file stored in memory.
    When you save the buffer, the file is permanently changed on the disk.


    # Region


    When you highlight text in Emacs to manipulate, you are "marking" the text. Marked
    text is called the region.'
  merge: -1
