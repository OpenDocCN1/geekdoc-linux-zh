    # # Customizing Firefox


    The Firefox browser has many different settings that you can use to change the
    appearance of the web browser to fit your tastes. More importantly, you can also
    make changes to give Firefox added functionality.


    Changing the look of Firefox can be done in a few ways through the View tab. If
    you post the pointer to click on the View tab, you are presented with a drop-down
    menu of options (see Figure 15-2). The first option, Toolbars, can be used to
    change the icons on the toolbars, or delete icons, or even to add additional toolbars
    to the browser. Moving the list, you can use Sidebar to add a Bookmarks sidebar
    or a History sidebar to your browser.


    The Zoom option is another that you may find extremely useful. This option allows
    you to increase or decrease the size of the browser window by zooming in or out.
    You may also choose to zoom only the text of the web page for easier readability.


    > Note Next to some of the options, you may notice things like CTRL-R, F13, and
    so on. These represent shortcuts to the various options. For instance, if you
    would like to quickly refresh a web page, simply hold down the CTRL key and press
    R.


    As the Web has grown in popularity, so has its functionality. If you go to Edit
    | Preferences, you are presented with a window that allows you to change how Firefox
    handles these different functions, as follows.'
  merge: -1
