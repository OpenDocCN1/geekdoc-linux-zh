  md: '# Chapter 12 All Your Base 155


    The third window of the wizard will allow you to set a primary key for your database.
    As you can see on your screen or in Figure 12-5, the primary key is essential
    to your database. Without a primary key, you cannot link tables to create a large
    database. In fact, you are warned that without a primary key, you cannot enter
    data in the table. Since we have no for empty database, let''s set the primary
    key. The default is to Automatically add a primary key. This will add an auto-numbered
    field for you the primary key needs to be unique. Since you have a field named
    ContactID, choose this as the primary key by selecting Use existing field as a
    primary key. When you select this radio button, you are to choose ContactID. Also
    set this to Auto Value so it will create a number for you. Again, click.


    The final screen of the Table Wizard is the Create Table screen, which first allows
    you to name your table. Most databases have many different tables, it is important
    to give your table a unique, descriptive name. In fact, rename the table from
    Contacts to Ubuntu.


    In the Create Table window, you can also choose to Insert Data Immediately. If
    this option is selected, you can begin entering data in a table format as much
    as you would in a spreadsheet. The Table Design allows you to change the format
    and type of the fields. Finally, you can choose to Create a form based on this
    table. This option allows you to create a form, or user interface, that allows
    you to enter data into the database table through a much more user friendly format.
    Select this option, as shown in Figure 12-6, and then click the Finish button.
    This will bring up the Form Wizard.


