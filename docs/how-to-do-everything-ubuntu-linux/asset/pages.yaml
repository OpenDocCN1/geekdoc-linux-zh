    FIGURE 10-4 Averaging numbers


    the = key on the Formula bar, and then type the sentence between the parenthesis.
    The following table shows how to enter basic arithmetical sentences in Calc:


    | Addition | =(A1+A2) |

    | Subtraction | =(A1-A2) |

    | Multiplication | =(A1*A2) |

    | Division | =(A1/A2) |


    # Sorting Data


    Another reason to use a spreadsheet rather than a table in a word processor is
    that you can sort your data in a spreadsheet like Calc. Looking at Figure 10-5,
    you can see'
