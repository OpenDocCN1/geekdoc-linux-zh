  md: '# Part I Meet Ubuntu


    # ### Is GNU/Linux More Secure than Microsoft Windows?


    GNU/Linux is considered a more stable and more secure operating system than Microsoft
    Windows. The belief behind this comes from two schools of thought. The first is
    that the open source / free software alliance makes the GNU/Linux operating system
    less of a target for attackers who wish to cause trouble for the commercial enterprise-backed
    operating system.


    The other school of thought states that the stability and security come from the
    fact that many developers are looking at, probing, and testing the source code
    that is freely available. With such a large community of developers looking over
    the code, bugs and errors are found and fixed more quickly. GNU/Linux opponents
    have raised the point that one unethical programmer could insert malicious code
    into the project. However, the number of people who are examining the source code
    practically ensures that would be detected almost immediately.


    Another reason behind some the strength of the GNU/Linux operating system is that
    there is no rush to market. Many software packages need to be released by a certain
    date in order to meet sales projections. Security experts argue at this thought
    when software is rushed, not enough time is spent fixing vulnerabilities in the
    code. With GNU/Linux, often hundreds of volunteers are pouring over the source
    code looking for these vulnerabilities.


    # # Enter Ubuntu


    In April 2004, a South African entrepreneur by the name of Mark Shuttleworth envisioned
    a new type of operating system. Shuttleworth made his fortune early in life when
    he founded a certificate authority and Internet security company called Tawta.
    Through his work, Tawta became the second-largest certificate authority on the
    Web behind VerSign. VeriSign, seeing a great deal of potential in Tawta''s open
    sources, bought the company in 1999 for a stock purchase worth $575 million.


    A big supporter of the free software movement, Shuttleworth believed that open
    source and free software played a large role in the future of computing. Having
    recognized, that for an operating system using GNU/Linux to be accepted by casual
    computer users, it is easy to install, operate, and upgrade. As a contributor
    to the Debian Linux project, Shuttleworth toyed with the idea of taking the reins
    of Debian to confirm all popular Linux distribution to his ideal operating system.
    In time, he realized to accomplish what he truly wanted, he would have to start
    from scratch. His new operating system was to be focused on the cornerstones of
    time-based releases so the community would know when to expect updates, a strong
    Debian foundation on which to build, the GNOME desktop to give users a friendly
    interface in which to work, and a strong commitment to freedom.'
  merge: -1
