    Dual booting has a plus side. In this scenario, the software runs in the environment
    it is written for. If your must-have program is written for Windows, you can run
    it in Windows.


    # Virtual Machines


    Virtual machines are a really cool concept in computing that is becoming a big
    part of enterprise computing. A virtual machine (VM) is a computer that is simulated
    on a host computer via a software package. This simulated, virtual, computer behaves
    as if it were a separate altogether. Virtual machines are useful in a business
    environment because they allow system administrators to set up test systems where
    they can see a new program, software patch, or anything else that will installed
    on a computer affects the operating system or the computer itself: Multiple virtual
    machines can run simultaneously to simulate a network environment to help network
    administrators see what effect a change can have on a network as well as the individual
    computer.


    So how does a virtual machine help us? Much like the dual-boot solution, creating
    a virtual machine will allow you to run—in a Microsoft Windows environment—software
    designed for Windows. While the environment is actually simulated, the program
    will run as if it were installed directly on a computer running Microsoft.


    Since Windows is being installed, you''ll need a licensed version of the operating
    system. If you have an old copy of Windows that is not being used, you can put
    it to use as a virtual machine. If you don''t have an extra copy lying around
    and will be installing a virtual machine running Windows, you will have to purchase
    a license before installing.


    > Virtual machines are not limited to running only Microsoft Windows. You can
    create a virtual machine of just about any operating system you can think of.


    Where virtual machines find their advantage over a dual-boot system is that the
    virtual machine can be run simultaneously with the host operating system. In plain
    English, you can run a virtual Windows while your host Ubuntu operating system
    is running. You need not to reboot the computer each time you want to change environments.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_238_0.png)'
