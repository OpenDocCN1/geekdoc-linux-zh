  md: '# 22


    # The Emacs Text Editor


    HOW TO...


    +   * Install Emacs

    * Move around the buffer

    * Create a new Emacs file

    * Open and edit an Emacs file

    * Configure Gnus for newsgroups

    * Configure Gnus to send and receive e-mail


    Text editors are used for writing or editing programming code, editing files,
    editing configuration files, and writing editing markup languages. If you are
    a converted Microsoft Windows user, then you may have had some familiarity with
    the Notepad text editor used by the Windows family. Throughout this book, we have
    used the GNOME-based editor called edit


    Text editors look similar to word processors, and quite a few people have used
    in their capacity. This is like using a wrench to pound a nail. It may work, but
    it is the wrong tool. Word processors are made for creating documents. You often
    manipulate the font size or color. Or add graphics or other visuals to make the
    document stand out. Word processors are large applications and can take time to
    start when launched. On the other hand, text editors are used for writing or modifying
    the text of a file. They are much more scaled-down tools that can launch quickly
    so changes to a file can be made with little waiting.


    While many text editors are available to you as an Ubuntu user, the two popular
    ones in the GNU/Linux community are Emacs (Editor Macros) and Vi or Vim (both
    of which stand for Vi Improved). Both Emacs and Vi are excellent tools for programming
    or configuring files, but proper etiquette dictates that you choose one or the
    other to use since supporters of both editors have started what has become known
    as the "editor wars."'
  merge: -1
