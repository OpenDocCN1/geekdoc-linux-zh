- img_proc: true
  md: '# Chapter 2 Exploring the Ubuntu Desktop 31


    The GNOME environment is packaged with most GNU/Linux distributions and is the
    default for Ubuntu, so throughout the course of this book, we will be using the
    GNOME desktop. Since using open source software is all about what feels best for
    the user and works best for user, try out the other desktop environments to see
    which one suits your individual needs and taste.


    # Finishing Up with the Live CD


    After you have played around with Ubuntu for a while, you may have made some changes
    to the desktop environment. Maybe you added some icons or changed the background.
    Quite possibly, you used Open Office and created a document or spreadsheet. Unfortunately,
    you cannot save your changes or work to your computer''s hard drive in the live
    environment. The purpose of the Live CD is to allow you to get a feel for GNU/Linux
    and see if it is compatible with your computer before installing the software.
    If you sat down to a live session and completed the Great American Novel on Writer,
    or knotted your computer''s quarterly projections on Calc, not to fear. You can
    still save this work on a USB drive or some other removable media. The desktop
    changes, however, will not stay when you shut down your live session.


    Shutting down a live session is simple. Move your cursor over to the System menu
    and select Log Out. You will be presented with a splash screen that asks if you
    want to Log Out, Shut Down, or Restart. Choose either Shut Down or Restart since
    you are not really logged into anything.


