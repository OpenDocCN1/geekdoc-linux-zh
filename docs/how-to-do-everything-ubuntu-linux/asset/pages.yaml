    While this provides you with some insight as to OpenOffice.org''s application,
    it is in no way a complete tutorial on this program. Writer is an extremely rich
    application that would need another book to cover every feature and tool that
    comes with it. With what you have been given in these pages, you can navigate
    through the user interface and learn how to take advantage of everything this
    application has to offer.


