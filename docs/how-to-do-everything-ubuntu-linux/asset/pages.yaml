    # Basic Network Troubleshooting


    Things go wrong with computers and networks. Sometimes these simple fixes are
    simple fixes to the problem. Sometimes these simple fixes aren''t so simple if
    you aren''t familiar with computer networking. To round out this chapter, we will
    go through some of the basic troubleshooting steps that may have your network
    up and running again no time. If they don''t work, you can always sound smart
    to the tech support person you need to call.


    This may sound ridiculous, but the first step in troubleshooting is to check if
    everything is plugged in. Don''t assume, Network cables can be tricky, so make
    sure they are snugly plugged into the computer and into the modem/router. If you
    are using a wireless connection, make sure that it is connected.


    If everything is plugged in, check your modem/router. Are all the lights on? If
    they are not, you may need to restart your modem/router. This can be done by switching
    it off or unplugging it for 30 seconds, and then powering it again.


    If everything appears to be working but still have network connection problems,
    the following commands can be used from the terminal to check your connections:


    | Command Type | Description | Command |

    | Ping | Sends a request to another address to test data transmission | ping hostname
    -c4

    The -c4 means it will send four pings. If there is no count, it will send indefinitely.
    |

    | Ifconfig | Lists the configuration of the network connection | Ifconfig |

    | Traceroute | Gives the name of various stops a packet takes on its way to a
    destination | traceroute hostname |


    > Note

    The hostname can be a name like www.ubuntu.com or an IP address. Many ISPs do
    not allow their computers to be pinged. The reason is a denial-of-service attack
    called the Ping of Death that can be used to flood a server with ping requests
    to the point that the server crashes.


    As I said, these commands can be used to perform some basic troubleshooting. The
    results can inform you as what your network problem is. If you are unable to ping
    computers outside of your network, your router may not be working properly.'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'If you run a traceroute, you can see where a packet stops transmitting. If
    it stops on the local network, it is a problem you need to solve. If it is elsewhere,
    then it may be a service issue. Ifconfig can let you know if you have an IP address
    and what that address is.


    If all of your troubleshooting efforts still yield no results, then go ahead and
    call your technical support department. Make sure you let them know the steps
    you have taken and the results that were produced. They may take a different attitude
    with you when they realize you know what you are doing!'
