- img_proc: true
  md: '# Chapter 1 Ubunt-Who? Get to Know Ubuntu 5


    computer programmers and developers the ability to once again alter a program''s
    source code to make it better. Free software didn''t mean that it shouldn''t be
    sold, but rather that the code should be allowed to be viewed and modified by
    the people using it. Stallman believed that people who use computers and software
    are entitled to four essential freedoms, described as follows.


    **Freedom 0** The freedom to run the program for any purpose. Stallman wanted
    to make sure that people who wrote, enhanced, hacked, or used free software could
    use it any way wished. Eventually, this freedom would also come to mean that the
    software could be on any operating system as well.


    No, that isn''t a type in the list of the four freedoms. Stallman utilized the
    number zero to start his list as a little programmer''s joke. When writing code,
    zero, not begins everything.


    **Freedom 1** The freedom to study the software''s source code and modify it if
    you want to. This is one of the main ideals behind the open source movement as
    well. The ability to study a program''s source code means you can read all of
    the commands and programming that the programmer used to write the software. This
    may not mean much to many people, but to software developers, it not only gives
    them a way to learn new things, but it also gives them a foundation on which to
    build a newer, better program. This is done through modifying, or hacking, the
    source code. "Hacking" to the early programmers merely changing something around
    so that it works better.


    **Freedom 2** The freedom to distribute copies of software to other people. This
    was an essential characteristic, as much of the focus of the early computer programmers
    was to help others out in the computer community. Many years before Ubuntu was
    to enter this community, the fundamental philosophy was there!


    Adding to this freedom, Stallman also stated that in being able to freely distribute
    software, others should be allowed to republish the software and source code as
    well.


    **Freedom 3** The freedom to publish your modifications of a software package.
    Again, if you make a program better through hacking and modifying the source code,
    share your findings with others! Think back to Mandela''s quote on Ubuntu, "Are
    you going in order to enable the community around you to improve?”


    In much of the computer world, the term "hacker" does not carry the connotation
    given by the media. Hacker is actually a term used to describe those who study
    something like a network or a program and alter it to make it work better for
    them. Hacking has taken on a negative definition since it was used to describe
    people who use their computer skills not for learning and modification, but for
    unethical purposes. The proper name for these unethical individuals is the term
    "cracker."'
