  md: '# What Beryl Is


    As you wander around the different Ubuntu or GNU/Linux forums, you may come across
    something called Beryl. Beryl is a 3-D windows manager that can be installed over
    GNOME, KDE, or XFACE. Beryl is a stunning enhancement to any desktop environment
    in GNU/Linux. Since Beryl is so visually stunning, it takes a bit of computing
    power and specific video cards to work. If you are interested in installing Beryl
    on your Ubuntu system, make sure that your computer has at least 512MB of RAM,
    although 1GB RAM is recommended.


    Likewise, the Visual Effects tab allows you to enhance the visual effects of the
    GNOME desktop environment. Although many people opt for the most visually pleasing
    desktop available, the more your effects are enhanced, the more computer resources
    are used. High-performance computers may not notice much difference; most home
    computers can be noticeably slower when these effects are used up.


    For computers that are not high-end machines, the visual effects can be set to
    No Effects to maximize computing power for other programs, or to Simple Effects
    that allow for a balance between aesthetics and computing power. For computers
    with enough processing power, the visual effects option can be set to Extra. The
    Extra option makes the desktop as visually stimulating as possible.


    Finally, there is a Custom option for users who want to pick and choose the visual
    effects for their computer. To determine which setting is best for your computer,
    take the time to try each one. If you feel that the Extra effects put too many
    demands on your processor, switch to Simple, or try to customize the effects,
    enhancing the features you want and leaving the less important ones alone.'
