  md: '# Chapter 6 Beyond the Basics: Install Extra Software 77


    Of course, many other applications are preinstalled for you. These are just like
    the most popular ones. If you are following along with your computer, or else
    when you have a chance, click on one of the category tabs to see what other applications
    are preinstalled for you.


    # Installing Using the Add/Remove Tool


    Looking back at Figure 6-1, you see that the last item in the menu is Add/Remove.
    This provides a graphical interface for adding/removing software applications
    from any one of the four Ubuntu repositories, or removing software from your computer
    system. These repositories are broken into categories, called *components*, based
    on Ubuntu''s ability to support the software and how the software aligns with
    the goals of the Ubuntu Free Software Philosophy.


    # The Main Component


    The main component contains applications that are free software, can be freely
    distributed, and that are supported by the Ubuntu team. These applications are
    handpicked by the Ubuntu developers and deemed important enough for the development
    team to maintain security updates and technical support on these packages.


    # The Restricted Component


    The restricted component contains commonly used software applications supported
    by the Ubuntu team that do not fall under a completely free license. For example,
    if a problem occurs when running the software on Ubuntu, the Ubuntu developers
    may not have the leeway to fix the problem themselves. Instead, they would have
    to forward the issue to the software developers and work with them to resolve
    the issue. Some software from the restricted component is included on the Ubuntu
    CD.


    # The Universe Component


    Software applications found in the universe component come from the open source
    / free software community. Quite a bit of software is free in this component;
    however, you have no guarantee that there will be security patches or support
    for these applications.


    # The Multiverse Component


    This component consists of software that is not free. This software does not meet
    the main or restricted component licensing. Failure to meet any one of the following
    will cause the application to be listed here: must allow distribution, must not
    require any fees or royalties, must allow all rights to be passed on, must not
    discriminate, must not be dependent on Ubuntu, and must not contaminate other
    licenses.'
