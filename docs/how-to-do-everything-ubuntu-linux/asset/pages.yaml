    # Scanning the Computer


    While most antivirus applications that run on Microsoft Windows actively scan
    the computer for malware, ClamTk does not. Instead, you are required to do a passive
    scan where you actually tell it to scan the computer for malware. Remember, while
    some malware can infect a computer running GNU/Linux, the odds of picking up a
    virus in the wild are slim, and if you only install software from the repositories,
    you have a good chance of never having an infection. However, it is still a good
    idea to scan the computer from time to time. Once a week is a good schedule for
    most users, while those who download a large number of files and open e-mail attachments
    may want to scan their computer more often.


