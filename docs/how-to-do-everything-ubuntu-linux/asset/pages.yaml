    # How to... Encrypt Files


    Encryption may seem like one of the latest buzzwords thrown around the computer
    world, but in fact it is a concept that has been around since the days of Julius
    Caesar, who first protected a message by wrapping the recipient around a stick
    to read it. If the stick, or key wasn''t the same size, the message was still
    illegible.


    Modern encryption works the same way. If someone encrypts an e-mail message or
    data on a drive, the information is scrambled. Only way to make sense of it is
    to have the proper key.


    To open the Passwords And Encryption Keys window, select Applications | Accessories
    | Passwords And Encryption Keys. When the window appears, select Key | Create
    New Key. When the Create New key window appears, select PGP Key and click the
    Continue button. When the New PGP Key window opens, you will be asked to provide
    your full name and e-mail address. When you have entered this information, click
    Create.


    Now you will need to enter a pass-phrase for your PGP key. In the Password box,
    enter a pass-phrase. Click the Confirm box, enter the same phrase. If they are
    identical, the OK button will be available. Click OK and the key will be generated
    for you.


    Encrypting messages depends on the main client you are using, but encrypting folders
    is simple. On a folder that you want to protect, simply right-click the folder
    or file and select Encrypt. You are then asked which key to use. Select the key
    and then click OK. If you are encrypting a folder, you will be asked how you would
    like to package your files for encryption. Select the compression format and then
    click OK. If you are encrypting a single file, you will not need to choose a compression
    format. Encrypting files and folders is a good practice to use if you have a laptop,
    millions of pieces of sensitive data have been found on unprotected laptops that
    have been either lost or stolen.'
