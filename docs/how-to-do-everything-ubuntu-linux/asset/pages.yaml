    # Creating a Query


    The purpose of a query is to fetch data from the database. If you have large amounts
    of data stored in a database, queries make it possible to sort through everything
    you don''t need and get right to what you are looking for.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_179_0.png)


    FIGURE 12-9 Newly created form'
