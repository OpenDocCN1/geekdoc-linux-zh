    # Opening the Computer Case


    You have identified the piece of hardware you are going to replace, you know that
    it has drivers that will work with Ubuntu, and you have purchased the hardware.
    What next? Now you have to install the hardware into the computer itself. That''s
    right, you have to open that computer and plug in the hardware.


    At this point, some of you, in the time it took me to write this sentence, have
    already opened the case and installed new, shiny piece of hardware. For those
    of whose response was, "You want me to do what?" have no fear. The next part of
    this chapter will guide you through the actual installation process.


    Note If you have never opened your computer before or if you are hesitant to do
    so, you can have a professional install the hardware for you. At the very least,
    if you are new to this, you may want to have someone who can watch over what you
    are doing—just to be on the safe side. If you do install hardware by yourself,
    never, I repeat, never, never the power supply. The power supply can carry a charge
    that lasts well after a computer is turned off, and it is strong enough that it
    can cause injury, even death.


    The first thing you need to do is set up a work area that is clean and free from
    static electricity. Working on a computer on a shag carpet during a cold winter
    day'
