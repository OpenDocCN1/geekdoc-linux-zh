    philosophies, it is equally important to look at the values that drive the Ubuntu
    developers and the promises they have made to the Ubuntu community. The Ubuntu
    Developer’s Philosophy:


    +   * Every computer user should have the freedom to download, run, copy, distribute,
    study, share, change, and improve their software for any purpose without licensing
    fees.'
