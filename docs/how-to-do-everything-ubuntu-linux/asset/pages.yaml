  md: '# Chapter 12 All Your Base 161


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_182_0.png)


    FIGURE 12-12 Report Wizard


    After you click the Next button, you are brought to the Labeling Fields window.
    Here, you can change the labels to ones that are more descriptive or easier to
    read. For example, you can change the "LastName" and "FirstName" to "Last Name"
