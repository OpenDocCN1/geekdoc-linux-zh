  md: '# 308 How to Do Everything: Ubuntu


    # Clean Installation


    A clean install of Ubuntu means that you are installing a fresh copy of the operating
    system on a computer. No other operating system exists in this scenario. To perform
    a clean installation of Ubuntu, you have to make sure that you have set your BIOS
    settings to boot from your CD-ROM drive. Once this is done, insert the Ubuntu
    CD-ROM into your CD-ROM drive and start up your computer.


    When your computer boots from the Ubuntu CD-ROM, the first thing you will see
    is the Language selection menu (see Figure-1). The default will be English, so
    if you wish to change this, you can do so here. If you are keeping English, press
    ENTER.


    After you have selected the language for your installation, you will be presented
    with another menu that asks what you would like to do. Use the DOWN arrow key,
    scroll to Install Ubuntu, and press ENTER. See Figure A-2.


