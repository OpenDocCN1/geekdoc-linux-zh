  md: '# Chapter 19 Play Funky Music—Making the Most of Multimedia 249


    # # Playing Music


    Now that you actually have some music on your computer, you can start listening
    to it. If you look back to the first part of this chapter, you may recall that
    when you insert a music CD into your computer, the music player Rhythmbox opens
    up automatically for you (see Figure 19-2). Rhythmbox allows you to listen to
    your CD, listen to music you have ripped from your CD, visit online stores to
    purchase music, listen to podcasts, and listen to Internet radio stations. Rhythmbox
    also gives you the ability to rip music from a CD to your library. When you insert
    a CD, you can click the Copy To Library button on the top menu bar.


    While Rhythmbox will rip tracks from a CD to your library, its primary function
    is to play music. There is quite a bit of debate in the Ubuntu community as to
    whether Rhythmbox should be used to rip CDs. The fact that Sound Juicer was written
    for extracting music tracks means that it is a better program for this task. The
    argument for Rhythmbox is that the extraction is good enough and that it is easier
    to use one program for everything.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_270_0.png)


    Figure 19-2 Rhythmbox'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Playing Music from a CD


    When Rhythmbox opens, playing a CD is simple. Just Press Play! Okay, so that was
    borrowed from Aerosmith, but we are talking about music, aren''t we? Seriously
    though, clicking the Play button on the top menu bar will bring playback of the
    selected song. You can skip between song tracks by clicking the Next or Previous
    buttons, or by clicking a song to highlight it.


    When you play music from a CD, the front cover of the album may also appear. This
    is another feature that is courtesy of the MusicBrainz database. The album artwork
    is downloaded to your computer and is shown when you play a song from that album.


    # Playing Music from the Library


    While it is easy enough to play music directly from a CD, playing music from your
    library requires a few extra steps, but it is worth it. Keeping a library means
    no one has to handle your CDs, so the risk of them damaged is lessened. You can
    also create playlists of music from different CDs and different artists whose
    music is in your library.


    You can choose to import a file by selecting Music | Import File and navigating
    to the folder where the file you wish to import. Once you have selected the file
    to import, click the Open button to send it to the Rhythmbox music player.


    > When choosing a Import File option, you can import multiple files from a folder
    by holding down the CTRL key. When you hold down this, you can use the mouse to
    make multiple selections.


    You can play a song from Rhythmbox by selecting the song from the library at the
    bottom and clicking Play. Alternatively, you can double-click the song to play.
    One nice feature to use if you are playing songs from your entire library is the
    Shuffle feature. If you click the Shuffle button and then the Play button, Rhythmbox
    will randomly select music from your library to play for you.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Chapter 19 Play that Funky Music—Making the Most of Multimedia 251


    # Playlists


    Another way to organize your music is by creating playlists. Playlists are simply
    collections of music files from your library. The way they are organized allows
    you to play the entire collection of music from that specific playlist at one
    time. Playlists are great for organizing genres of music, or for mood music. This
    way, you can make sure that when you are in the mood for aggressive rock music,
    *Core''grato* doesn''t find its way into the mix.


    Starting a playlist by selecting Music | Playlist | New Playlist. Once the window
    changes, you should see “Playlists” in the lower-left of the window (see Figure
    19-3). A space with an icon of two musical notes is highlighted. This is your
    new playlist, so type the name here and press ENTER. For example purposes, I have
    named my playlist **My New Playlist**.


    Now you need to add some music to this playlist. Let''s get back to the Rythmbox
    library by clicking Music under the Library heading. Locate a song from the library
    and right-click the Title. Select Add To Playlist | My New Playlist. If you have
    more


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_272_0.png)


    FIGURE 19-3 Creating My New Playlist'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# 252 Part V Having with Ubuntu


    than one playlist, they will all be listed here. You can also create a new playlist
    by selecting New Playlist instead of one of your existing lists.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_273_0.png)


    After you have added a few songs to My New Playlist, you can select My New Playlist
    from the Playlist section on the left. All of the songs you have added will be
    here as well as the Rhythmbox box.


    When you create a playlist and add songs to this, they are not removed from the
    main library. Music files remain in the main library; the playlist is actually
    a list of songs that the music player knows as a group.


    # Buy Music Online


    On the left side of the window is a section called Stores. Unlike other online
    music stores, Jamendo and Magnatune allow artists to upload their music to Jamendo
    file sharing service to collect 50 percent of the revenue generated and almost
    100 percent of the donations that users are encouraged to give to the artists.
    Magnatune is actually the storefront for an independent record label.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Chapter 19 Play that Funky Music—Making the Most of Multimedia 253


    As with Jamendo, artists make 50 percent of the revenue that is generated from
    sales. Both stores sell music that falls under the Creative Commons License, the
    use and sharing of the music available on these two sites is not as restrictive
    as the traditional copyright licensing.


    Obtaining music from either of these services is easy. Click on Jamendo or Magnatune
    to bring up the store. You can then browse by artist or album in the top two panes
    of the window, or browse by all of the files in the store. In Jamendo you will
    notice two buttons in the top menu bar, Download Album and Donate To Artist. On
    Magnatune the buttons Purchase Album and Purchase Physical CD appear. Clicking
    any of these buttons will take you to the appropriate web site you requested.


    # Listening to Podcasts


    When we think of multimedia, music and media often come to mind. With the popularity
    of the Apple iPod, a new type of media emerged, the Podcast is a portmanteau,
    or a combination of words—“iPod” and “broadcast.” Basically, a podcast is a digitally
    recorded broadcast that resembles a radio window. Unlike live radio shows, podcasts
    are delivered via the Internet in a file where they can be stored and downloaded,
    as streaming audio, or syndicated. Anyone with the right software can create a
    podcast on any topic they choose. Likewise, anyone with a media player that can
    play podcasts can listen to them.


    > Many self-proclaimed experts are on the Internet. Anyone of them can create
    a podcast. If you rely on a podcast to provide accurate information, make sure
    it comes from a trustworthy source.


    To listen to a podcast, you will have to point Rhythmbox to a podcast feed. If
    you click Podcasts under the Library menu, you will see that two new buttons appear
    in the top menu bar, New Podcast Feed and Update All Feeds. If you click New Podcast,
    a pop-up window appears in which you can enter the URL of the podcast you wish
    to subscribe to (see Figure 14). When you have typed or pasted the URL of the
    podcast into the text box, click the Add button. The podcast will now download
    the episodes of podcasts for you. Although you subscribe to, you can click the
    Update All Feeds button to manually bring all of your podcasts up to date with
    the latest episodes as well. To find other podcasts, enter a topic into the search
    box and press ENTER. Rhythmbox will search for different podcasts related to that
    topic for you to listen to. Should you want to remove an episode of a podcast
    from Rhythmbox, simply select the episode that you want to remove, and from the
    toolbar select Edit | Remove.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 254 Part V Having with Ubuntu


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_275_0.png)


    FIGURE 19-4 Adding a new podcast


    You will be asked if you want to remove just the episode or the episode and the
    file. Choose the latter to completely remove this from your computer. To delete
    an entire podcast, right-click the podcast and select Delete Podcast Feed. You
    can choose to delete only the feed or delete the feed and all of the files.


    > Did You Know?

    # Where Else to Find Podcasts


    Finding podcasts isn''t difficult at all. Quite a few of the most popular sites
    on the Internet provide a URL for those interested in subscribing to their podcast.
    You can also use Google to search for podcasts by typing **podcast +** the topic
    of your choice. For example, typing **Ubuntu + podcasts** will provide you with
    the URL for the podcast you see in Figure 19-4.

    You can also visit sites like www.PodcastDirectory.com that provide viewers with
    categorized pages of podcasts that anyone can subscribe to.'
  merge: -1
