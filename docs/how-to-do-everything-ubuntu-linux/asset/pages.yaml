    second is by process number. Killing a process by name is very simple. For instance,
    you downloaded the beta for the new Firefox browser and can want to try it out.
    You install it and start it up, only to find that it hangs up on you because the
    bugs still haven''t been worked out. You try to close the program but that is
    unresponsive.'
