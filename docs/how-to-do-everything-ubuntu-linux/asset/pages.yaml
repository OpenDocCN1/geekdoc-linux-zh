  md: '# #8 Keep It Safe—Securing Ubuntu


    HOW TO...


    +   * Practice safe, smart computing

    * Install and configure Firestarter

    * Install and configure antivirus software

    * Install and configure backup/restore software


    Computer security is talked about on the news, in consumer computer magazines
    and IT trade magazines, and all over the Internet. It is such a hot topic that
    some people believe it is hyped up so that security vendors can sell more software
    to a frightened people. After all, who wouldn''t pay $19.95 to make sure the evil
    hackers couldn''t steal their identity and credit cards? True, some unethical
    people out there are riding the computer security wave all the free and open source
    pop-ups claiming "your system has been infected—click here to buy my software
    to clean and protect your computer." However, if the computer security threat
    was all hype, why are the free and open source software communities involved in
    this area of computing?


    Computers are at risk whenever we connect to the Internet. The risks include viruses,
    Trojans, spyware, rootkits, malicious hackers, phishing, pharming, and social
    engineering. A saying that IT professionals use when discussing security is "the
    only way to secure a computer is to seal it up in a steel box"; basically, don''t
    use the computer and you will be safe. This is impractical because we use computers
    every day. Instead of being afraid, be smart. Understanding what constitutes smart
    computing practices and what security measures you should take could mean the
    difference between happy computer users and those who lost all their files.


    # ## Best Practices in Computer Security


    Before we start learning how to secure a computer running Ubuntu, some important
    terms need to be understood, and some basic principles need to be'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Part II Manage Ubuntu


    brought to your attention. After reading this section, you may think, “Why are
    you telling me this stuff? This is just common sense!” As we all know, common
    sense isn''t always common. If it were, I wouldn''t need to include this chapter
    in the book.


    # Terms to Know


    The following terms will be discussed throughout this chapter. It is important
    to know them because they are frequently used in the Ubuntu and other security-related
    forums.


    +   - **Botnet** A collection of computers (zombies) controlled by another computer
    or user. Usually, this is done by using a virus or other type of malware.

    - **Cracker** A person who enters a computer system without permission.

    - **Exploit** A software bug that is taken advantage by crackers and malicious
    hackers to gain access to a computer system or network.

    - **Firewall** A software or hardware package whose purpose is to prevent unauthorized
    access to a computer system or network.

    - **Hacker** A person who uses skill and ingenuity to solve complex problems.

    - **Malware** The term “malware” is short for “malicious software.” Basically,
    it is any software that can harm your computer system. Examples are viruses, Trojans,
    and worms.

    - **Pharming** A technique where the DNS entries of a web site are changed so
    that a person is redirected to a fraudulent web site they intended to visit. This
    is often used to collect banking and other personal data from unsuspecting users.

    - **Phishing** A technique where an e-mail, or instant message, is sent to a user
    falsely claiming to be a legitimate entity such as a bank or service. The message
    usually asks the user to send their account information and passwords to resolve
    a problem with their account. These messages may also contain links to fraudulent
    websites where the user is asked to enter this information to be collected by
    criminals.

    - **Rootkit** Malware that allows an attacker to have root access to a GNU/Linux
    machine. In Windows, the attacker would gain administrator access.

    - **Social engineering** A high-tech version of a con game. A method of tricking
    users using information that may lead to “authorized” access to a computer system
    or network.

    - **Trojan** Short for “Trojan horse,” a computer program that is installed under
    the guise of another program. This piece of malware then allows an attacker through
    a back door it creates.

    - **Virus** A piece of software that can copy itself to infect a computer without
    the operator knowing about it. Viruses can destroy or alter data on the computer
    they infect.

    - **Vulnerability** A weakness in a computer system, procedures, or network defense
    that can be exploited by crackers to gain access.

    - **Worm** A piece of malware that can replicate itself to spread over computer
    networks.

    - **Zombie** A computer infected by a virus that allows someone else to control
    it.'
