- img_proc: true
  md: '# 292 Part VI Advanced Ubuntu


    Now, what if you remembered a string of characters you are looking for began with
    a capital A? That is where expressions come into play. Using certain characters,
    you can narrow down your search with an expression.


    | Character | Meaning |

    | :(period) | Match any one character in the string except at the end of a line
    |

    | *(period + asterisk) | Match any number or type of characters in the string
    |

    | [] | Match the character(s) listed in the brackets |

    | [\\] | Does not match the character(s) listed in the bracket |

    | \< | Beginning of a word |

    | >/ | End of a word |


    So if we are looking for any word that does not end in e in the file Hello, we
    could use the following expression with grep:


    ```

    grep ''>[e].*'' Hello

    ```


    The grep command is case sensitive.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_313_0.png)


    # Find


    While grep searches for strings of characters and is great for searching log files
    and code, the find command is something that you may use more often. The find
    command allows you to search for files within your system. For example, if you
    were looking for a file named Hello throughout the entire file system, you would
    use the:


    ```

    sudo find -name ''Hello''

    ```


    Here you give the find command followed by the / to designate the path you want
    to search, which is in the entire file system. The -name lets the find command
    know what follows will be the name of the file, which need to be in quotes.


    Let''s say you know that the filename starts with "Hello", but you know that more
    was added on. Maybe it was "HelloEarth" or "HelloAll". If you want to add a wildcard
    before or after a string of text, you can use the:


    ```

    sudo find -name ''Hello''

    ```


    Now, find will return any filename that starts with "Hello" just as in Figure
    21-4.


    # Finding Help


    You have many available options when using tools like the find and grep commands—so
    that many a beginner would have no way to memorize all of them. To cut down on
    the frustration level for new users, the shell comes with its manual ready at
    a moment''s notice.'
