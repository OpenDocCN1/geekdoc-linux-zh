    # Playing Nice with Windows


    HOW TO...


    +   - Install Wine

    - Use Windows applications in Ubuntu


    After you''ve read page after page of how great Ubuntu is, you scream, "Just when
    I thought I was out, they pull back in! True, plenty of open source and free applications
    can give any Windows application run for its money. However, sometimes you may
    run into a situation where you have to run an application that was made for Windows.
    Unfortunately, the differences in the operating systems do not allow you to install
    the latest version of Microsoft Office on your Ubuntu computer outright.


    If you know your computer history, you may remember the days when the Apple Macintosh
    was first released. After initial success, sales of the Macs started to dwindle.
    One of the biggest contributors to the lackluster sales was that consumers felt
    there was just not enough software for the Mac. GNU/Linux experienced this well
    as in the earlier years. Even computer enthusiasts who were not frightened by
    GNU/Linux stayed away from its mainstream use because not enough programs could
    be run on GNU/GNU/Linux for their taste.


    All of that has changed. Not only plenty of software run on GNU/Linux, but also
    additional tools now allow the user of an operating system like Ubuntu to install
    and run applications that were built for Windows. Of course, plenty of GNU/Linux
    community members will swear that even programs written specifically by Microsoft
    run more smoothly and crash less when run on GNU/Linux. Is it true? You be the
    judge as we dive into how we can make Ubuntu play nice with Windows applications.


    # Dual Booting


    If you are among the Ubuntu converts who still need to run Windows-based software,
    dual booting is one option you might consider. Dual booting is when two or more


