    # Playing Games Designed for Windows


    Though we know GNU/Linux as a much more secure, stable operating system that believes
    its users have the freedom to do what they want with a product they own, is a
    hard fact that Microsoft Windows is still a much more popular operating system.
    The simple economics of the gaming industry creates a situation where most developers
    have a job creating video games do so for the Microsoft Windows platform.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_257_1.png)


    # Games Played in Wine Need to Be Configured


    While most applications in Wine are simply installed and then launched from the
    Applications menu, video games may not be easy to install.


    Unfortunately, video games are often copied and sold illegally, prompting many
    video developers to install extra copy-protection into their games. Sometimes
    games may need to be run with Wine in the CD tray, or they may rely on changes
    to the Registry for copy protection.


    Not only do developers look to illegal distribution of their work, but they also
    use the Internet to enhance it. With many people making use of a broadband Internet
    connection in their home, developers can have their games go to the Internet and
    download new content for the game.


    If you are using Wine to run your games, you may need to configure how your games
    work with Ubuntu or any GNU/Linux flavor you be. Before installing a game using
    Wine, visit winehq.com and read the instructions for getting the individual game
    to work with Wine. Like most open-source communities, the Wine community is extremely
    helpful to newbies.'
