    # Ubuntu Emerges


    With the backing of a multimillionaire philanthropist and the support of a huge
    community, Ubuntu made unbelievable waves in the open source and Linux communities.
    Its popularity has soared over the past few years to the point where computer
    manufacturer Dell has selling machines with Ubuntu preloaded in France, Germany,
    the UK, and the USA.


    Such has the popularity of Ubuntu that it has spurred several spinoff projects.
    The first of these is Kubuntu, a version of the Ubuntu distribution that made
    use of the KDE desktop environment, which is traditionally more popular with users
    new to the GNU/Linux operating system since it resembles the desktop environments
    of Windows or Macs so much. KDE also runs applications that are unique to that
    some users find more favorable than their counterparts that run specifically in
    the GNOME environment. Although applications built for KDE can run in the GNOME
    environment, and vice versa, they require the proper libraries to be installed.


    Designed for systems that conserve resources, such as older computers, the Xfce-based
    Ubuntu is thought to be the best choice in desktop environments over GNOME or
    KDE. Since this desktop environment does not have all the bells and whistles of
