    # Analyzing Network Traffic


    One way security experts can tell if a computer system has been compromised is
    by using a Network Traffic Analyzer tool such as Wireshark. Wireshark is an open
    source tool that logs network traffic like Firestarter, but it also allows a person
    to analyze this traffic and the packets of data that are being sent and forth.
    Since computers and networks often have a certain amount of data being transferred
    on their network device, network administrators will establish a baseline, or
    a set amount of traffic that is normal. When the traffic is outside of this baseline
    for no reason, they begin to look for possible intrusions or malware.'
