  md: '# Ubuntu File Extensions


    If you are coming from a Microsoft Windows environment, you are accustomed to
    using an EXE file when installing a new program. Ubuntu, like other GNU/Linux
    distributions, do not support the .exe file extension. Instead, GNU/Linux distributions
    use either .deb or .rpm extensions for the software packages. Packages that end
    in the .deb file extension are designed specifically for Debian-based distributions.
    The .rpm packages are named for the Red Hat Package Manager and are used with
    distributions such as Fedora Core, SUSE Linux, and Mandriva. While you can install
    packages with the .rpm extension, they are not designed for Ubuntu or any other
    Debian forks. When installing .rpm packages, you need to convert them to DEB packages
    through a program called Alien.


    +   Just like a fork in the road, different GNU/Linux distributions may have forks.
    These forks are distributions, like Ubuntu, that have split off from another distribution.
    Since Ubuntu is built from Debian, it is considered a fork of Debian.


    systems are installed on the same computer. When the computer boots up, users
    are presented with the option of choosing which operating system they would like
    to use.


    This works because the hard drive is divided into different parts called partitions.
    For instance, if your computer has a 120GB (gigabyte) hard drive, you can create
    two partitions of 60GB. If you don''t want to split the hard drive equally, you
    can also create one partition of 100GB and another containing 20GB. You can essentially
    create as many partitions as you want, as long as they all total up to the amount
    of space on the hard drive.


    +   Partitions should be set up during the installation of the first operating
    system.


    The partition solution sounds too good to be true, that because it is. Partitioning
    can take a bit of work, and you need a pretty good understanding of file systems
    and the different types of partitions available. If you decide to get into the
    business of partitioning your hard drive and setting up a dual boot system, see
    the Appendix, where the installation of the Ubuntu operating system is discussed.
    You can also find plenty of information on the Web and in different forums to
    help you get a better understanding of disk partitioning, so don''t let the difficulty
    level scare you away. It can be done; it just not something to jump into unprepared.


    Other issues with dual booting can make this solution for running Windows software
    less attractive. The first such concerns licensing. If you want to install Microsoft
    Windows on your computer, you have to pay for it. Right now, a downloaded'
