    # Setting a New Screensaver


    When an image remains on a CRT monitor for too long, the screen can suffer from
    what is screen burn. Screen burn can damage the portion of the screen covered
    by the image and result in having to replace the monitor. To prevent this, many
    people use a screensaver. Screens work by displaying moving images on the computer
    screen and were originally used to prevent screen burn. Nowadays, screensavers
    are an expression of the computer user or are used for enhanced security; whereas
    LCD monitors utilize a different technology, so they do not usually suffer from
    permanent screen burn.


    Screensavers can also be a great way to express your individuality. By selecting
    System and then Preferences, you can move down to Screensaver where you can select
    from a long list of screensavers to help protect your monitor. If you venture
    enough down the list, you will see a modernized version of the flying toasters
    screensaver that was popular in the 1990s. Another even mimics the computer code
    in the movie The Matrix.'
