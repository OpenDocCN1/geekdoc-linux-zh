    # Saving Your Work and Sharing with Others


    When you are done up that nice report for your boss, you are probably going to
    want to save that document. Saving a document is as easy as opening one. All you
    have to do is select File | Save As. This will bring up the Save window shown
    next. Simply give your document a name, and select the folder you want to save
