    # Residual Config Packages


    After you uninstall a package from your computer, there are often times dependency
    packages that are left behind. Dependency packages are additional packages required
    by the software application in order for it to run properly. When the main application
    has been uninstalled, dependency packages that remain on the computer are called
    residual config packages. To get rid of residual config packages, open up the
    Synaptic Package Manager by choosing System | Administration | Synaptic Package
    Manager. The window opens, click the Status button in the bottom left. In a list
    above the Status button you will see All, Installed (Auto Remove), Installed (Local
    and Obsolete), Not installed. There are no residual config packages on your computer.
    If the list includes Not Installed (Residual config), then click Not Installed
    (Residual config) and a list of packages will appear on the right. For each package,
    click the box and Mark For Remove Removal. Once you have done this for each package,
    click Apply and the Synaptic Package Manager will remove these files for you.


    # Orphaned Packages


    While the Synaptic Package Manager is still open, click the Search button and
    find gtorphan in the search box. When the application appears in the box to the
    right, click the box and select Mark for Installation. Now click Apply to have
    the Synaptic Package Manager install gtorphan for you.


    Once the application is installed, close the package manager and select System
    | Administration | Remove Orphaned Packages. Select the packages you wish to remove
    and then click OK.


