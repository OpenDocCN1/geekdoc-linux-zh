  md: '# 316 How to Do Everything: Ubuntu


    # Dual Booting with Windows


    If you plan to install Ubuntu on a computer that is already running Microsoft
    Windows, you can have both operating systems run side-by-side in a dual-boot scenario.
    If you are using this option, when the computer is booting, you will be presented
    with an option of which operating system you wish to boot. Using the arrow keys,
    you can select your choice and press ENTER. If a selection is not made in a timely
    manner, the computer will boot to the default operating system, which is usually
    the first one that was installed.


    If you are planning to set up a dual-boot computer, the best way to do this is
    to start up your computer without the CD-ROM in the tray. Allow Microsoft Windows
    to fully boot, then insert the CD-ROM in the tray and close the tray. The Ubuntu
    CD has an autorun file that should start the Ubuntu CD menu shown in Figure A-13.
    If autorun is disabled, you can start the CD by clicking Start | My Computer and
    double-clicking on the CD-ROM drive, which should now have the Ubuntu logo.


    From the Ubuntu CD menu, click the Install Windows button to begin the installation
    process.


    Choosing the dual-boot option will not install Ubuntu over your existing Windows
    installation.


    > Note


    The next step in the dual-boot installation process is to define how you wish
    to set up your Ubuntu operating system. Each option presented to you is defined.
    See Figure A-14.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_337_0.png)


    FIGURE A-13 The Ubuntu CD menu'
