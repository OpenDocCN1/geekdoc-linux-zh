    box in the terminal. This is a security feature to alert you that the permissions
    are different from the default.


    # Searching for the Shell


    To find information using the shell, you can put two different commands to use,
    grep and find. The grep command allows you to search for a file for string of
    text. To narrow a search using grep, you can add expressions to your string. For
    a basic search using grep, you can search for the string "Hello" by typing the
    following:


    ```

    grep ''Hello''

    ```


    Since we didn''t designate a file or directory to look for the string in, it may
    take a while.'
