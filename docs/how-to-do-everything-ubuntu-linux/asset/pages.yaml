  md: '# Acknowledgments


    When I began writing this book, I quickly found out that there is more to writing
    a book than just, "writing the book." There are many people involved in the process
    who I would like to take a moment to thank.


    I need to start with Neil Salkind, who brought me into this project. Neil, thank
    you for being such a good mentor and advocate from the very beginning. To my two
    contacts at McGraw-Hill Professional, Roger Stewart and Carly Stapleton—I can''t
    thank you enough for being so patient and coaching me through this process. I
    would also like to thank my editorial supervisor, Janet Walden, and my project
    manager from ITC, Aparna Shukla, for their work in bringing everything together
    in the production process so well. You guys have been an outstanding help.


    Bill Bruns, technical editor, I really appreciate the time you put into making
    all of my directions were clear and that everything worked the same way I explained
    it. One last thing, Bill—Go, White Sox! I would also like to thank my copy editor,
    Jan Jee, who made sure that everything flowed nice and smooth throughout the book.


    To my family and friends who supported me and encouraged me through this entire
    process, I can''t thank you enough. Mom and Dad, thank you for your support throughout
    the years and for reading every piece of material that I put in front of you.
    To my brothers, Todd and Ryan, thanks for being there whenever I needed anything.
    Finally I need to thank my wife, Jackie, and my two children, Priscilla and Jeffrey.
    Jackie, I appreciate all of the time you spent all of the extras so I could focus
    on writing. Your patience has been outstanding. Priscilla and Jeffrey, you guys
    have been so understanding and helpful. Yes, Jeffrey, the book is done!'
  merge: -1
