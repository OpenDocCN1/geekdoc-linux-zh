  md: '# Can We Talk? Communications and the Internet


    # HOW TO...


    +   - Use Firefox to surf the Web

    - Send and receive e-mail

    - Use instant messaging totals


    In the last years, the Internet has become the foremost medium for business, education,
    and social communication. Many businesses have developed e-commerce web sites
    so they can sell directly to their customers from any location. If a business
    is not selling merchandise over the Internet, you can be sure that it has at least
    a web presence. Schools, universities, and other educational organizations have
    also made use of the Internet to deliver information to students, parents, and
