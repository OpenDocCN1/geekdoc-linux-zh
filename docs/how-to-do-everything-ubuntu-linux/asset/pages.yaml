  md: '# 286 Part VI Advanced Ubuntu


    /media The media directory serves as the mount point for all external devices
    like CDs or DVDs. Devices mounted to the media directory are done automatically.


    /mnt The mnt directory is home to temporarily mounted devices like a network shared
    folder. Mounts to the mnt directory are done manually as opposed to automatically
    with the media directory.


    /opt The opt directory is used to store software that is not managed by the package
    manager. These are generally add-on software packages that the user downloads
    outside of the Ubuntu repositories.


    /proc The proc directory is actually a virtual directory that provides a means
    for the kernel to communicate with the processes running on the computer. Each
    process that is running is assigned a numbered entry, which we will learn more
    about shortly.


    /sbin This directory contains files and commands like the bin directory; however,
    the programs housed in sbin are only used in system administration tasks and require
    superuser privileges to run them. When you run something using the sudo command,
    odds are it comes from this directory.


    /srv This directory is home to the data files used to run services like HTTP,
    FTP, or TELNET.


    /sys This is another virtual file system that was added for plug-and-play devices.
    It contains files showing the resources that are allocated to each device on the
    system.


    /tmp The tmp directory stores temporary files. Nothing more, nothing less.


    /usr This is the directory that stores everything for the user''s applications
    such as dictionaries for spell checkers, documentation, and source code files.
    Subdirectories such as /usr/bin and /usr/lib are here for each individual user
    binaries and libraries.


    /var Files that change while the system is running are stored here. Log files,
    print spools, cache files, and anything else that would be considered a dynamic
    file that would be found in the var directory.


    # Making Directories


    When using the shell, you will sometimes need to make new directories on your
