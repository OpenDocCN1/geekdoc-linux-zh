    Clicking Next brings you to the Choose Layout window, where you can select the
    data is presented in the report as well as the layout of any headers and footers.
    Finally, you can choose if you want the page orientation to be Portfolio or Landscape.
    After you have selected the layout, Create Report, allows you to change the Title
    Of Report (see Figure 12-13). Here, you will enter **Ubuntu Users by City**. You
    also have the option of choosing a Static Report, where the data either stays
    the same as the day you created the report, or a Dynamic Report. A dynamic report
    will change the data in the report if it is modified in the database. Dynamic
    Report is generated by default, so leave it as is. Also leave the Create Report
    Now option instead of choosing Modify Report Layout. After you you can click the
    Finish button.


    Once the button is clicked, the report is generated for you automatically. Figure
    12-14 shows how much a better report looks compared with the output of a query.


    Databases are much more powerful than what we have covered in this introduction.
    Entire books are actually written on database alone! While the open source community
    can offer you plenty of help when it comes to database design, other resources
    can help you take from a novice database designer to someone who is creating large
    back-end databases for an interactive web site.'
