    in the current directory named Ubuntu, you simply need to type this into your
    terminal window:


    mkdir Ubuntu


    Once you press ENTER, the directory will be created. You can double-check that
    your directory was created by typing the ls at the prompt. If your new directory
    is listed, then you were successful.


    Now that you have created a new directory called Ubuntu, let''s create a subdirectory
    in Ubuntu called images. You could use the cd Ubuntu command to change to the
    Ubuntu directory first and then create the images subdirectory, or you could do
    it easier way. Since working from the shell is all about doing things the easy
    way, let''s give it a try. This time, type


    mkdir Ubuntu/images


    If you wish to this directory, change to the Ubuntu directory and then type the
    ls command, and you will see the images right where it belongs.

    You can use the mkdir command to create multiple directories as well. Let''s say
    in the Ubuntu directory you wished to create images directory, a documents directory,
    and a sounds directory. You can use one of commands to create all three at once.
    Start by navigating to the Ubuntu directory, Ubuntu:~~/ and then type


    mkdir images documents sounds


    When you press ENTER, all three directories will be created in the Ubuntu directory.

    If you make a mistake creating a directory, you can simply remove it with the
    rmdir command. For example, we don''t have any sounds associated with Ubuntu,
    so let''s delete the sounds directory. While in the Ubuntu directory, you need
    only type the following to remove the sounds directory:


    rmdir sounds


