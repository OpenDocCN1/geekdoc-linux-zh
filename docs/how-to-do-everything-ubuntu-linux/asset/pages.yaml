  md: '# 10


    # Spread It Out with Calc


    HOW TO...


    +   - Start a new spreadsheet

    - Format cells

    - Perform calculations

    - Add a chart

    - Work with Excel


    An application that allows you to create spreadsheets is one tool that most businesses
    cannot live without. Although the most commonly used spreadsheet application is
    Microsoft Excel, OpenOffice.org made sure to include this tool in their office
    suite as well. To meet the needs of business users, OpenOffice.org includes a
    program called Calc in their office suite.


    Spreadsheets collect data in small boxes called cells. These cells make up a series
    of rows and columns on the spreadsheet. On the surface, a spreadsheet looks like
    a large table that organizes the data placed in it. However, what makes a spreadsheet
    superior to a table is that the cells can be sorted, and that you can perform
    calculations with numerical data.


    Let''s take a roster for a high school football team as an example of how a spreadsheet
    can sort data. A typical roster will have the player''s name, position, height,
    and weight. In a spreadsheet, someone could sort the data by any one of the fields
    (categories) listed. No need for coaches to create a roster by name, by position,
    and so on. All they have to take their spreadsheet and perform a sort by the column
    they wish to organize. The fun doesn''t stop there. The coaches can sort sort
    of their players by position, and then perform a secondary sort by height. They
    can even add another sort by weight if they want.


    The ability to perform calculations shows the true power of a spreadsheet application.
    Let''s say you need to put together a budget. With a spreadsheet, you can enter
    all of your line items in one column of cells, and then the corresponding costs'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# 126 Part III Open the Door to OpenOffice


    in a column next to it. Now, instead of relying on a calculator or adding machine,
    you can use the function built into your spreadsheet to calculate the subtotals
    and total for your budget—the name "Calc" for this application.


    # Starting a New Spreadsheet


    Opening a new spreadsheet in Calc is as easy as using any of the other OpenOffice.org
    applications. Opening Calc will automatically bring you a new, blank spreadsheet.
    If you are already in the Calc program, you can open a new spreadsheet by selecting
    File | New | Spreadsheet.


    You can open an existing spreadsheet by selecting File | New | Open. You then
    need to navigate to the folder your spreadsheet was saved in and choose it. When
    you click the Open button, the file will open in Calc for you.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_147_0.png)


    # The Toolbars


    Now that the spreadsheet is opened, you will notice four toolbars similar to those
    in Writer. The Menu bar, shown, sits at the top and gives you the ability to run
    most of the basic commands in Calc like opening a new or existing spreadsheet;
    using the cut, copy, and paste commands; inserting information; formatting text
    and cells; sorting data; and many other functions.


    | File | Edit | View | Insert | Fgmat | Tools | Data | Window | Help | x


    Below the Menu bar is the Standard toolbar. Like the Menu bar, the Standard toolbar
    gives you access to commands like New, Open, Print, and so on. However, unlike
    the drop-down menu style of the Menu bar, the Standard toolbar is made up of graphical
    icons, shown next. Clicking one of these icons runs the command that is associated
    with it. If you are unsure as to what icon goes with what, hover your pointer
    over the icon, it will pop up.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_147_1.png)


    The third toolbar is the Formatting toolbar (shown next), which allows you to
    change the font, align text in the cells, set borders around cells, and anything
    else that has to do with the way your spreadsheet looks.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_147_2.png)'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Chapter 10 Spread It with Calc 127


    The final toolbar, where the real power of the spreadsheet comes into play, is
    the Formula bar. This is where you can type in the different mathematical formulas
    that perform all of the spreadsheets calculations. We will get into how this works
    a little later on in this chapter.


    ```

    B10 f(x) Σ = |

    ```


    # The Spreadsheet


    Now that you understand what all of the toolbars do, let''s take a look at the
    spreadsheet itself (see Figure 10-1). Across the top row is a series of letters,
    running down the leftmost column of the spreadsheet is a series of numbers. These
    provide you with the cell address, which is shown in the Address box at the end
    of the Formula bar. Much like the squares on a chessboard, the cells of a spreadsheet
    are given an address. The first cell in your spreadsheet is known as A1. Move
    to the right two cells and down five cells, and you will be at C6. The addresses
    extremely important when we begin with the calculations.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_148_0.png)


    FIGURE 10-1 A Calc spreadsheet'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# 128 Part III Open the Door to OpenOffice


    # Formatting Cells and Data


    Like any other OpenOffice application, the layout and data of your spreadsheet
    can be formatted to your taste. In an open spreadsheet, type 1234 in cell A1 and
    -4231 in cell A2. Now, right-click one of the cells and select Format Cells. You
    will see the Format Cells window shown in Figure 10-2.


    From here, you can change anything you wish as far as the cells or data are concerned.
    From the Numbers tab, you can choose from the Category list to show how Currency,
    or the Date and Time are displayed in the cell. In the Format area, you can choose
    how you want to separate the thousands place, or Options you can choose to display
    negative numbers in red. This can be extremely useful if you are doing a spreadsheet
    based on a budget or any other financial data. Go ahead and select the Negative
    Numbers Red check box and close the window. The data in cell A2 will be red.


    # Font and Font Effects


    Looking at Figure 10-2, you will see that there are many more tabs on the Format
    Cells window. The Font and Font Effects tabs determine how you display the text
    inside the cells. You can set the font, font size, and font color, or even give
    the text a shadow.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_149_0.png)


    FIGURE 10-2 Format Cells window'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Chapter 10 Spread It with Calc 129


    # Alignment


    The Alignment tab allows you to choose where in a cell you want your text to be
    displayed. Horizontally, you can choose Left, Right, Center, Justified, or Filled.
    Vertically, you can opt for text to appear at the Top, Bottom, or Middle of the
    cell. If you are planning on entering multiple lines of text, you can choose Wrap
    Text Automatically. Without this option selected, a long string of text will continue
    in a row. If you wrap the text, you can drop down to start the next line of text
    in that column instead of continuing across other columns.


    # Borders


    On the computer screen, your cells appear in nicely framed cells. But if you were
    to print this spreadsheet, you would notice that the borders around the cells
    were only onscreen reference and do not print. This can be remedied with the Borders
    on your Format Cells window. Here you can select which part of the cell or cells
    you would like to give a border to. You can also select how wide and even what
    color you want the border to be.


    # Background


    The Background tab allows you to change the background color of a cell or group
    of cells. This is often used when someone wants to use colors on alternating rows
    to make a spreadsheet easier to read. The background of a header row is often
    changed as well to differentiate this row from cells that contain actual data.


    # Change the Size of a Row or Column


    If you need to change the size of a row or column, this can be done in two ways.
    The first method is to move the pointer over the border of two column heads that
    the Resize tool arrows show. Once they appear, you can drag the column to the
    width you want. The same method can be used on the cell''s rows to increase or
    decrease the height of the row.


    You can also adjust the size of the rows and columns by choosing Format | Row
    and Format | Column. From there, you can set the height and width respectively
    by typing in the size in inches or fractions of an inch (see Figure 10-3). You
    can also select Optimal to let the height and/or width be automatically set to
    fit the text of the row or column.'
  merge: -1
