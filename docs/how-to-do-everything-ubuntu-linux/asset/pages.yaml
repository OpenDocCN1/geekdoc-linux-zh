  md: '# Chapter 20 Get Smart! Educational Software 275


    In the education world, web apps are becoming increasingly popular since they
    are easy to develop, platform independent, and easy to deliver to the end user.
    Programs developed for the web range from calculators to web-based office suites,
    and from online research tools to multiplayer online role-playing games like Food
    Force or Peacemaker.


    As anything else in the world of GNU/Linux, the philosophy of "if you can''t beat
    ''em, join ''em" prevails. Of course, I am talking about using Wine to run specific
    educational software that has only been written for the Microsoft Windows operating
    system. While educational games may not boast the largest category in the WineHQ
    database, you have a good-sized library to choose from. Of course, if there are
    any educational applications that are not included, you can get to them running
    yourself and move up the ranks in the open source community, or you can ask one
    of the community members to help.


    # It''s Educational...


    Earlier, when you were introduced to the Ubuntu family of operating systems, Edubuntu
    was one of the packages mentioned. Edubuntu is a system designed for school environments,
    but is also a popular choice for students to use at home. Many similarities exist
    between Edubuntu and Ubuntu outside the names. To begin with, Edubuntu is based
    on the Ubuntu architecture. Many of the developers who work on Ubuntu lend a hand
    on the Edubuntu version as well. Edubuntu also follows the same development cycle
    as Ubuntu follows, with an expected release every six months.


    Edubuntu differs from Ubuntu in the software that is installed with the system
    itself. Many of the educational applications found in the Ubuntu repositories
    are already preinstalled in Edubuntu. Also, Edubuntu comes with some extra, kid-friendly
    themes (see Figure 20-4).


    You might be wondering why having a completely different version of the operating
    system would be needed just to have a few applications installed and some extra
    artwork to choose from. The answer is twofold. First of all, the developers wanted
    Edubuntu to be easy for kids to take home and run on their computers. Like all
    versions of Ubuntu, Edubuntu has a CD that allows the entire operating system
    and its applications to run without installing anything. Kids who use Gcompr or
    the KDE Edutainment Suite at school can pop an Edubuntu CD into their computers
    at home and enjoy the same learning environment without download, decompress,
    or install, and without regard for the operating system that the home computer
    is running.


    The second reason for the Edubuntu release is that schools without a dedicated
    IT staff can successfully run the software on any type of computer just as the
    kids would at home. Edubuntu also helps schools that have very limited budgets
    to buy new computers.'
