- img_proc: true
  md: '# Part II Manage Ubuntu


    host a web server. In any event, when a port on the computer is opened, you need
    a firewall. If you decide to keep the installation as is and not to open any ports,
    a firewall can still provide you with important security information. When running
    a firewall, you are provided information about other computers that are scanning
    your computer for open ports. While most of these are just random, should you
    see that a particular computer is continually scanning your computer, you may
    have a problem that you need to contact your Internet provider. As you become
    comfortable with Ubuntu, you may want to set policies on Firestarter. Policies
    are the rules that the firewall must abide by and are broken down into inbound
    and outbound policies. By default, Firestarter adheres to the following policies:


    +   * New inbound connections from the Internet to the firewall or client hosts
    are blocked.

    * The firewall host is freely allowed to establish new connections.

    * All client hosts are allowed to establish new connections to the Internet, but
    not to the firewall host.

    * Traffic from the Internet in response to connection requests from the firewall
    or client hosts is allowed back through the firewall.


    Installing Firestarter is simple. By going to the Applications menu, and then
    go to Add/Remove tool is launched, search for the term "Firestarter" in all available
    applications. Now go through the normal application installation procedures as
    you in the past. Once the software is installed, you will need to go to Applications
    | Internet | Firewall to launch the program. Once you do this, you will be asked
    to provide your password. There''s security at work! Once you launch the program,
    you will be presented with Figure 8-1.


