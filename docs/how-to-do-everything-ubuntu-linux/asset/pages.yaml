    # Working with Excel


    Like Writer, Calc has a Microsoft counterpart that makes up a large share of the
    spreadsheet market. Microsoft Excel is currently the top-selling spreadsheet application,
    so Calc had better work well with it. To make sure Calc users are not left out,
    you to open Excel spreadsheets and save them in a format that is readable by Excel.'
