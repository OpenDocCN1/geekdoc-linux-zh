  md: '# Part II Manage Ubuntu


    FIGURE 8-6 Firestarter is running.


    Once you have familiarized yourself with Firestarter, notice the blue circle with
    a black arrowhead in your toolbar (see Figure 8-6). This is an icon to open the
    Firestarter window and lets you know that the firewall is active.


    If you click this icon, the Firestarter window will disappear, but the firewall
