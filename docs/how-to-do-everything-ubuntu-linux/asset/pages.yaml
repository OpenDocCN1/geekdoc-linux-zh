  md: '# Chapter 1 Ubuntu-Who? Get to Know Ubuntu 7


    to piece together the hundreds of little programs, written by hundreds of different
    programmers, which comprised the operating system. Sometimes, a piece of hardware
    would be lacking an essential piece of software called a device driver to allow
    that hardware to work. In cases like these, individuals would have to write the
    program themselves to get their computer up and running.


    Almost immediately, programmers began to realize the difficulty that computer
    non-experts were having with the GNU/Linux operating system. Again, their sense
    of community kicked in, and people began packaging all the necessary programs
    to successfully install the Linux operating system. These collections of programs
    were called distributions, or distros for short. In 1992, a company called Yggdrazil
    created the first CD-ROM distribution. This opened floodgates for many other companies
    to piece together Linux distributions for people to use. Some of the more popular
    distributions throughout the years are Red Hot, SUSE, Mandriva (formerly Mandrake),
    and Debian, which the Ubuntu distribution is based on; Figure 1-1 shows their
    logos.


    While the distro made the installation of the operating system easier, it was
    the development of a program called the X Window System that brought GNU/Linux
    from only the computers of experts to those of hobbyists as well. The X Window
    System was a project that had been in 1984 with the purpose of giving a graphical
    user interface, GUI, to the Unix operating system. From this project, the three
    most popular desktop environments were: GNOME, KDE, and Xfcfe. Now, GNU/Linux
    users were not limited to a command line to run. The X Window System now gave
    them a desktop rivaling the commercial operating systems like Microsoft Windows
    and the Apple Mac OS.


    Despite the fact that the GNU/Linux operating system was free, it was still limited
    in use to true enthusiasts. GNU/Linux was in the early days of Windows when system
    crashes became the fodder for many Microsoft-related jokes. Still, the popularity
    of GNU/Linux didn''t grow much. Even in the days when viruses and worms began
    to emerge in Windows computers and networks, the immune GNU/Linux operating system
    still sat on the sidelines.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_28_0.png)


    FIGURE 1-1 The logos of some the early GNU/Linux distributions are easily recognizable
    by the GNU/Linux community.'
