  md: '# # Chapter 21 A Guide to GNU/Linux Shell Commands 283


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_304_0.png)


    FIGURE 21-1 Using the `ls` command


    > Remember—when you are in the terminal, *everything is case sensitive*. If you
    were to type `ls /pictures`, you would receive a message telling you that there
    is "No such file or directory."On the other hand, `ls /Pictures` provides the
    names of the files and folders under Pictures.


    Now you want to get into the Pictures directory to do some work. You know what
    files and folders are in this directory from the `ls` command, but if you were
    to type `pwd`, you would see that you are still in the `/home/jeff` directory
    and not in `/home/jeff/Pictures`, where you want to be. This is where the `cd`
    (change directory) command comes into play. For example, if you want to go into
    the Pictures directory, you would type


    ```

    cd Pictures

    ```


    at the prompt. If you press ENTER, your prompt will change as well to resume

    jeff@jeff-desktop:~/Pictures$`


    If you want to go back to the home folder, simply type `cd` again and press ENTER.


    > When you are typing filenames and folder names, you can use a little shortcut
    to speed through this. After you have typed the first few letters of either a
    folder or filename already exists, press TAB and the rest of the name will be
