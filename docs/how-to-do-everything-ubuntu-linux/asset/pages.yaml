  md: '# Chapter 15 Can We Talk? Communications and the Internet 201


    Note


    Evolution email is a great program, and it comes preinstalled with your Ubuntu
    distribution. However, you can get other free mail programs like Thunderbird from
    Mozilla (the same people who made Firefox).


    # Instant Messaging


    "FWIW IM is a GR8 way to communicate, BICBW." If you can read that, you are one
    of the many people adept communicating via instant message. Instant messaging
    (IMing) works through a little program that runs on your computer, allowing you
    to chat in real time with another computer user anywhere in the world. Unlike
    chat, instant messaging happens between two people rather than a large group.
    For young people, instant messaging has become a common form of communicating.
    For the business world, instant messaging allows for communication and collaboration.


    Note


    If you are trying to figure out what the first sentence means, do a quick Internet
    search for "IM Acronyms."


    Users of Ubuntu have the ability to install any number of instant messaging programs
    on their computer. While many of these can be installed through the Add/Remove
    tool, a program *Pidgin* has been preinstalled on Ubuntu so that users can start
    IMing their friends from start.


    Pidgin is actually a multiprotocol instant messaging client. Common instant message
    programs like ICQ, MSN, AIM, and others can only communicate with computer users
    who are running the same program. For instance, someone using ICQ can only IM
    other ICQ users. Unfortunately, most people use more than one instant messaging
    program. It is not uncommon for a person to have an ICQ account, an MSN account,
    an AIM account, and a Yahoo! account. Pidgin, a multiprotocol client, allows users
    to manage all of their accounts from one client.


    Note


    Pidgin gets its name from the term *pidgin* to describe a mixture of languages
    that develops from neighboring countries to allow for trade.


    Start by selecting Applications | Internet | Pidgin. If this is the first time
    you have opened Pidgin, you will be alerted to the fact that no IM accounts have
    been configured. Click Add to get started configuring Pidgin.


    After clicking, you are brought to the Accounts screen. The first step in adding
    an account is selecting the protocol to be used. The Protocol menu allows you
    to select what IM service you are setting up your account. For instance, if you
    have an MSN account, select that from the protocol list.


    Note


    You can add more protocols to Pidgin at any time by going to Accounts | Manage
    | Add from within the Pidgin Buddy List window.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# 202 Part IV Reach Out


    After you have selected the protocol, you need to provide your Screen Name, Password,
    and Local Alias that you use for your instant messaging service. You can also
    select the Remember Password option if you do not wish to supply your password
    every time you use the protocol. If you have forgotten any of this information,
    you may have to log in through the client provided by your service to finish it.


    The Add Account window has an Advanced tab that allows you to change the port
    number for your IM protocol and to change the proxy options. If you are setting
    this up on account, you probably won''t have to worry about the Advanced tab.
    If this is something you are installing at work, check with your network administrator
    to see if these are the right settings.


    Once you have added an account to Pidgin, you can log in and start communicating.
    If you are new to instant messaging, you need to add some buddies to your list.
    To add a buddy, you will need his or her screen name. Once you have that, go to
    Buddies | Add Buddy. If you look over the Buddies menu, you can see from here
    how to add a group to organize your buddies, show different information about
    your buddies, sort them, and get information about other users. To send a message,
    go to Buddies | New Message. You will need to enter the name of the person you
    are messaging IM, and then you can send your message if they are online. Since
    instant messaging oftentimes takes the place of a phone conversation, emphasis
    and tone can be communicated as well. When sending a message, you can use the
    Smile button to bring up various emotions that can set the tone for your message.
    Emoticons are extremely popular when sending IMs.


    # How to... Block a User in Pidgin


    Unfortunately, not everyone uses Internet communication responsibly. Countless
    people have been harassed online through e-mail, IMs, and chat rooms. Most IM
    clients allow a user to block another user from sending them messages, and Pidgin
    is no different.


    If a user sends a message to you and you want to block him or her from contacting
    you, select Conversation from the message window. Then Select Block Block will
    ask you to confirm that you want to block that user, so you will have to click
    Block again when asked. This prevents a user from sending you messages from the
    IM account they were using when you blocked them. If the person you are blocking
    creates a new account to contact you again, you have the option to contact your
    Internet service provider and your local authorities regarding harassment.'
  merge: -1
