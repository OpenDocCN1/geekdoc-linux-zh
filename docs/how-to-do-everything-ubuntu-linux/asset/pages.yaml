- img_proc: true
  md: 'To open a spreadsheet created in Microsoft Excel, go to the Menu bar and select
    File | Open. Once you navigate to the folder where the spreadsheet has been saved,
    choose the file and Calc will open it.


    Saving a file to work with Microsoft Excel is just as simple. When you are ready
    to save, select File | Save As. In the Save window, type the name of your spreadsheet.
    Where it says File Type, click the arrow to display the drop-down menu. Look through
    the menu until you see the version of Microsoft Excel you wish to save as and
    high-light it. Once you click Save, the spreadsheet will be able to be opened
    in Excel as well as Calc.


    > Microsoft Excel files contain the .xls file extension, and Calc files use the
    .ods (OpenDocument Spreadsheet) extension.


