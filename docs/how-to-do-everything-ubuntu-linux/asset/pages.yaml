    # The Difference Between Peer-to-Peer and Client/Server Networks


    Client/server networks are often large and complex. They generally take a great
    deal of planning to get them up and running. In return, they provide users with
    many services. Large numbers of files can be stored and accessed; servers regulate
    which users access to certain files; software can be managed by a single computer;
    central databases can be used by multiple users; and much more.


    Peer-to-peer networks are usually pretty easy to set up. Since no single computer
    acts as a central server, all computers are generally equal, so little planning
    is needed. These smaller networks do not have the same capability as the large
    client/server networks. Usually, these networks are used in a home or small office
    setting, earning them the nickname “SOHO (small home, office networks).” They
    are limited to sharing basic resources such as Internet access, and to basic file
    sharing.


    kids’ bedroom, and in the living room. All of these computers have a high speed
    Internet access account through a router. How does your home network know where
    to send the data? After all, your kids might not want your TPS reports inside
    of Hannah Montana!


    Networks know where (data) needs to be delivered by using addresses much like
    your home’s address. These addresses, IP addresses, keep data going to the right
    place on a network. These addresses are often presented in a form dotted decimal.
    For example, 192.168.1.1 is an IP address generally used by a modem as the gateway
    address to the Internet. Addresses can be assigned by your network, or you can
    choose which address to use. If you allow the network to assign the addresses,
    which is the easiest to network your computers, you are using the Dynamic Host
    Configuration Protocol (DHCP). If you assign the addresses to your network devices,
    you will be assigning them statically and dynamically assigned.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_198_1.png)


    Your modem/router will have two IP addresses. The external address is assigned
    by your Internet service provider, and the internal address will be provided by
    the network or by you statically assign your addresses.


    So what part of the computer gets the IP address? A home may have its address
    on its mailbox or on the front of the house to distinguish it from its neighbors.
    Computers lack both of these locations. Instead, they have what are called Ethernet
    cards. Ethernet cards allow for the transfer of data between network devices.
    Ethernet cards can be wired if they have a plug into them or wireless if they
    transmit data over the air. While many computers have both wireless and wired
    Ethernet cards, generally only one is used to connect to other devices at any
    given time. We are going'
