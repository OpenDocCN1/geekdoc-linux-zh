  md: '# Chapter 17 Playing Nice with Windows 227


    All you have to do to run your program is to Applications | Wine | Programs |
    FileZilla FTP Client | FileZilla. Each time you install a software application
    with Wine, it will appear in the Programs menu for you. Try it with Internet Explorer
    or Windows Media Player. Both of these applications are free to download, and
    you can run them perfectly by Wine.


    # Wine Is Not Genuine


    If you have been using Microsoft Windows lately, then you have probably encountered
    the Windows Genuine Advantage. Due to the popularity of Microsoft Windows and
    the cost of its software, Microsoft products are often pirated. Pirated software
    is an illegal copy of the software that contains a crack of some sort that allows
    it to run. While cracked software may run with little or no problems, pirated
    Windows products will not pass the Windows Genuine Advantage check.


    Unfortunately, some Microsoft products running under Wine do not pass this check
    either. If you wish to use Internet Explorer or Media Player, you will have no
    problems. If you wanted to run Microsoft Office, you would run into trouble if
    you were to download templates for the Office suite.


    # Closing Thoughts


    So you may be thinking, “If I am moving to Ubuntu, why should I care about Microsoft
    Windows applications?” If this has crossed your mind, excellent! You are already
    starting to realize that open source software is necessary to the future of computing.


    However, remember that the philosophy of Ubuntu deals with software use and the
    freedoms involved. Therefore, a user should have the choice to run software that
    does not fall under the open source philosophy. To not support an application
    that gives its users more options would go against the very core ideals that Ubuntu
    was built on. I''m not saying you have to run Windows programs or that they are
    better than open source programs, but if you want to use them or have to use them,
    you should be able to use them.'
