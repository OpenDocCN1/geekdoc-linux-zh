    # Adding Charts


    Sometimes sheer numerical data is not enough to emphasize your point. If you like
    to use graphs and charts to highlight data and results, Calc can do this for you
    as well. If we refer to Figure 10-7, we see a spreadsheet with names and numbers.
    Let''s say that Column A represents monthly sales, and you want a graph showing
    a comparison among your sales team.


    From the Menu bar, you will need to select Insert | Chart, and the Wizard will
    appear on your screen, as in Figure 10-8. This wizard will walk you through each
    step of building your chart. First, it will ask you to choose your chart type
    from column, bar, pie, area, and so on. When you click Next, it will ask you where
    you want to pull your data from. The Data Range can be manually typed in, or you
    can click the Select Data Range button on the wizard to choose which cells you
    want to represent.'
