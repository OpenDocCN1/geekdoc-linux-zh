- img_proc: true
  md: '# Chapter 12 All Your Base 159


    To create a query, you need to first select Queries from the Database pane in
    the Ubuntu Users database. In the Tasks pane, use Wizard To Create Query by double-clicking
    on it.


    Like forms, queries are based on tables. In the Query Wizard, we are first asked
    to select the table to query. Again, Ubuntu Users is the only table, so we will
    use it. From the Available Fields, select City, FirstName, and LastName and then
    click Next.


    If there are other tables available, you can select fields from more than one
    table as long as there is a relationship. Relationships are the links that can
    be created between two or more tables in a database when each table has the same.


    The second window in the wizard allows you to sort the data that will be retrieved
    by one or more of the fields selected. As with the sort ability in a spreadsheet,
    you can sort database in either Ascending or Descending order. Once the sort conditions
    are defined, click Next to the most important part of the query, the search conditions.


    The search window allows the user to select what data will be extracted from the
    query. The first option asks you to query Match All Of Match Any Of The Following.
    You can choose which fields you want, the Condition, and the Value of the data.
    Figure 12-10 shows how you have selected to query the data from Ubuntu Users.


    In this query, the first two conditions read “is equal to,” meaning the value
    will be an exact match. That read “Cabo Frio” or “Cabo fri” because they are not
    exact matches. In the third conditional statement, the word “like” is used. “like”
    is used instead of “is equal to,” the value “West Palm beach” will yield the result
    “West Palm Beach” even though the case is different.


    At this point, we can click the Finish button to bring us to the Database window.
    The query can now be run by double-clicking Query_Ubuntu Users in the Queries
    pane. The results are shown in Figure 12-11.


    # Creating a Report


    Since the output of this query, just shown in Figure 12-11, isn’t very attractive,
    it may not quite have the impact you wanted it to. To dress up the way your query
    looks, you can use the report tool. To access the Report Wizard, select Reports
    from the Database pane, and then double-click Use Wizard To Create Report.


    Instead of pulling the data from only a table, the Report Wizard (see Figure 12-12)
    allows you to choose either a table or query. You want to see the output of the
    Ubuntu Users Query, select this from the Tables Or Queries drop-down menu, and
    select all of the fields available.'
