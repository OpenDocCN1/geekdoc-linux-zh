  md: '# 86 Part II Manage Ubuntu


    # Did You Know? You Need to Keep Cool


    Heat generated by electricity inside of the computer is the number one enemy of
    your hardware, especially the central processing unit. The fans hum while you
    are working on a computer are actually there to draw heat away from these sensitive
    parts.


    To keep your computer parts from overheating, make sure that the airflow is not
    blocked on the outside of the computer and that there is little to no dust builddup
    around the fans and the inside of the computer itself. If you find that dust is
    accumulating in and around your computer, use the appropriate dust removal tool,
    which is a kind of compressed air that you can buy at most office supply stores.
    Do not use vacuum cleaners because they can ruin your computer.


    When upgrading or replacing hardware, your first step should be to research the
    Ubuntu hardware support page, which is in the form of a wiki. This document can
    be found by pointing your browser to https://wiki.ubuntu.com/HardwareSupport.
    On the list of hardware components, a part of which is shown in Figure 7-1, you
    should


