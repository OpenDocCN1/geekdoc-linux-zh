  md: '# 16


    # # Master of Your Domain—Web Design Tools


    +   ### HOW TO...


    * Obtain a hosting service and domain name for your web site

    * Install a web development program

    * Design a basic web site

    * Publish your web site to the Internet


    In the last chapter, you saw how you can use Firefox, a web browser included with
    Ubuntu, to view web sites hosted on the Internet. In this chapter, you are going
    to learn how to create your own web sites. Why would you want to create a web
    site? The simplest answer is—to get information to other people. Businesses create
    web sites to communicate with customers and provide them with up-to-minute information.
    People create personal web sites as well. You may want to share information with
    family members living far away, or you may have a hobby that you want to share
    with others, or maybe you want to share your views and opinions with other people.
    A web site can help you share information for whatever reason.


    Once you decide to create your own web site, it is wise to plan it before you
    get started designing it. Decide how many pages you want to include in your site
    and what information you want to display on each page. If your site will contain
    pictures and other graphics, gather them together as well. The more quality time
    you put into planning your site, the better it will look, and the easier it will
    be for your users to navigate through the pages. Many resources on the Web can
    help you plan your web site. It is wise to do a little reading on the subject
    first—kind of like reading the instruction manual before you try to put the home
    theater system together.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Creating a Well-Designed Site


    Some web sites are designed entirely to pointing out the most poorly designed
    sites on the Internet. Poor color schemes, too many images, cluttered pages, broken
    links, and many other factors can be enough to get a site listed on one of these
    "what not to do" collections. Avoiding the same mistakes, a bit of research on
    web usability may help.


    Web usability refers to how user friendly a web site is, taking into consideration
    the site''s design, navigation, and functionality. Again, plenty of resources
    found on the Internet can educate you to this topic.


    # Finding a Host


    Unless you are running your own server, you need to find somebody to host your
    web site. A web host is a company that will allow you to upload all of the files
    for your web site to server, where you can manage the site and they manage the
    hardware.


    You can choose between two kinds of a web hosting service: a company that will
    host your site for free or one that will charge you. The obvious benefit to a
    free host is that it won''t cost you anything. Most of these hosts are extremely
    reliable, offer a decent amount of space on their to host your site, and provide
    extras to help you make your site more functional. The drawbacks of using a free
    service are that many of them force ads onto your site that you have no control
    over, and many of them offer little or no technical support.


    Paying for a hosting service is generally not too expensive. You can expect to
    pay about $5–10 a month to a company to host your web site. This cost usually
    includes technical support. Most hosting services also give discounts if you commit
    an entire year or two.


    # Your Domain Name


    To have a web site, you have have a name for it. The name you register for your
    site is its domain name. The name becomes part of your domain address. For example,
    Ubuntu registers Ubuntu.com as their name. This web site address www.ubuntu.com.
    You will need to register a domain name as well for your web site address. Some
    of the hosting companies that charge you may even entice you to use their service
    by registering your domain name for free or at a discount, expect to pay $10–15
    per year for your hosting provider. If there is no discount, hosting companies
    that do not charge may also give you a free domain name as well, but this is usually
    a subdomain. For example, the domain name of the hosting company may be jefffreesites.com.
    Your site then becomes the subdomain http://yoursitejefffreesites.com.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Chapter 16 Master of Your Domain—Web Design Tools 205


    Unfortunately, many domain names have been registered over the years, so your
    first choice may not be available. If this is the case, be creative. Eventually
    something that sounds good and reflects your site will come to you. Once you have
    registered your domain name and signed up for a hosting provider, you are ready
    to start building your web site.


    # Installing Web Development Software


    Ubuntu itself does not have any web development software that is preinstalled
    with the operating system; however, one program called Screen can be installed
    with the Add/Remove tool. While Screen is perfectly capable of helping you build
    your web site, I like KompoZer better, but you will have to install it from the
    terminal. Go to Applications | Accessories | Terminal. When the terminal is open,
    type the following:

    sudo apt-get install kompozer


    Remember that sudo means ''super user''. Since you are telling Ubuntu to run this
    program as the super user, it will ask for your password. After you enter your
    password correctly, Ubuntu will begin the installation process. Right before KompoZer
    is installed, you may be informed that the installation will use a certain amount
    of disk space, as shown in this illustration.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_226_0.png)


    This process is common when installing software in Ubuntu. When presented with
    this information, press y at the prompt, and then press ENTER to begin installing
    the program. Once the installation is done, you can close out the terminal window.
    To run KompoZer, go to Applications | Internet | KompoZer. Figure 16-1 shows the
    window that appears.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 206 Part IV Reach Out


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_227_0.png)


    FIGURE 16-1 KompoZer


    If you are using Screen, you will launch from Applications | Programming | Screem.


    > Note


    When you open KompoZer, you will be given a tip at startup. It may be wise to
    scroll through a couple of these tips the first few times by clicking the Next
    button. If you don''t want to see these tips when you open KompoZer, uncheck the
    box that shows Tips At Startup. After picking up a few tips, click the Close button
    to get started.


    Web sites are written in a language called HTML (Hypertext Markup Language). You
    may remember we briefly discussed this in Chapter 15. In HTML (see Figure 16-2),
    content is formatted with tags. These tags tell the browser how to display the
    content, it texts, images, or whatever your page consists of.


    Back in the early days of the Wide Web, every web page had to be hand-coded in
    HTML. As the Web grew in popularity, software companies developed applications
    that allowed people with little or no understanding of HTML to create web pages
    by taking care of the HTML for them. These applications are called WYSIWYG ("wisee-wyg")
    programs. WYSIWYG is an acronym for "What You See Is What You Get." Both Screen
    and KompoZer are WYSIWYG web development tools. To see how easy it is to work
    with KompoZer, Hello World! Welcome to my first web page! in the window. After
    you save this file, you will have created your first web page. If you go to File
    | Browse Page, your newly created web site will open in your web browser. See
    Figure 16-3.'
  merge: -1
