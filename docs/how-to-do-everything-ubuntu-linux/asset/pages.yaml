    remember that one of your clients uses Microsoft Word. If he receives a document
    created in Writer, it won''t open. If he doesn''t get a copy of this report, you
    could lose your red Swing stapler and wind up in the basement. Well, not to worry.
    Microsoft Office products may not acknowledge OpenOffice.org documents, but the
    OpenOffice.org developers recognize this. Built into Writer is the ability to
    save a document as another file. Again, select File | Save. This time, click the
    arrow next to File Type (see Figure 9-10). Here, you will be presented with a
    scrollable list that starts with OpenDocument Text. If you scroll down the list,
