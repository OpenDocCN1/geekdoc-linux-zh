- img_proc: true
  md: '# 264 Part V Having Fun with Ubuntu


    This will give quite a bit of output. Search through this to find iPod and determine
    Ubuntu recognizes this device. It will be something like "/dev/sda," so we will
    use this for the example. More than likely, the iPod will have two partitions:
    one, "/dev/sda, which contains the device''s firmware, and the other, "/dev/sda2,
    which contains your music and other goodies. This is the partition you need to
    mount.


    Back in the Terminal, enter


    ```

    sudo mkdir /mnt/ipod

    ```


    This will create the folder you are mounting the iPod to. Type


    ```

    sudo edit /etc/fstab

    ```


    When the editor opens, add


    ```

    /dev/sda2 /mnt/ipod vfat user,noauto,umask=000 0 0

    ```


    Be sure to save this file. Now you can mount your iPod by typing this in the Terminal:


    ```

    sudo mount /dev/sda2

    ```


    Once the iPod is mounted, you need to install a program called gtkpod. This program
    allows you to transfer files to from your iPod. Installing gtkpod can be done
    through the Add/Remove tool under Applications. When the Add/Remove window opens,
    type gtkpod in the search box. Once it is found, click Apply to install. If you
    go to Applications | Sound & Video | gtkpod, you see the window shown in Figure
    19-8. Minus the bells and whistles of iTunes, gtkpod doesn''t look all that different
    in terms of functionality.


