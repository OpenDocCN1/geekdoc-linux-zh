- img_proc: true
  md: '# Networking Basics


    Most people who work in an office, hospital, or school have experience with computer
    networks. These networks are often large, complex networks that span cities, states,
    even countries. Users usually have to authenticate to the network through a login
    process that requests a username and password. Once users are authenticated, they
    are given access to certain parts of the network depending upon the credentials
    associated with their username. Networks that behave like this are referred to
    as client/server networks since resources and authentication require computers
    to process information for the desktop computers, called clients. Servers run
    a special operating system such as Microsoft Windows Server 2008. Ubuntu also
    has a version for servers called the Ubuntu Server Edition.


    For most users, the network is not complex. In fact, it bears little resemblance
    to a client/server network. Most home networks do not require authentication.
    A user merely turns on his or her computer and is joined immediately to the home
    network. In this instance, user credentials are stored on the individual computer
    so an individual can set a username and password if or she likes, however, it
    is not necessary. In this instance, the network is called a peer-to-peer network.
    There is no server that controls authentication and resources on this type of
    network, and for the most part, all users have equal credentials. See Figure 14-1.


    When you have more than one computer linked, essentially creating a network, one
    fundamental issue that needs to be addressed is how the data knows where to go.
    For example, let''s say that you have a computer in your home office, one in your


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_197_0.png)


    FIGURE 14-1 A sample home network'
