    # Password


    Choose the password for your Ubuntu operating system. You will need to enter the
    password twice, the same in both boxes, or you will not be able to continue. See
    the note earlier in this appendix for advice about good password choices.


    Once you have chosen how you want Ubuntu to be up, you can click the Install button
    and begin the installation process. See Figure A-15. If for any reason you wish
    to stop the installation process, click the Cancel button.


    When Ubuntu has finished, you will be asked to restart your computer. You have
    the options of Reboot Now or I Want To Manually Reboot Later. See Figure A-16.
    If you are anxious to start using and configuring Ubuntu, choose the Reboot Now
    option and then click Finish. Your computer will now eject the CD-ROM and restart.
    Keep an eye on the boot process, because you will be asked to choose which operating
    system you wish to boot. When this question appears, use the arrow key to select
    Ubuntu, and then press ENTER.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_339_0.png)


    FIGURE A-15 Ubuntu installation'
