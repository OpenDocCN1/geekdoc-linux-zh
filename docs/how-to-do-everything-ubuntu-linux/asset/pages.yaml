  md: '# # Introduction


    Why do people choose to use GNU/Linux? Some choose this because they are making
    a statement once you buy or own something, it should be yours to do with what
    you want. Some want to take their computing skills up a notch and learn something
    completely new. Others use GNU/Linux because simple economics since most GNU/Linux
    distributions don''t cost anything! Whatever your reason for choosing how to use
    GNU/Linux, choosing the Ubuntu distribution is one of the wisest decisions you
    can make.


    # ## Is Ubuntu Different from Other Distributions?


    If you are reading this book, you may have a good idea as how Ubuntu differs from
    a distribution like Red Hat or SUSE Linux. For those who don''t, I will explain.
    In the open source world, community is king. Most of the support, updates, manuals,
    and tutorials come from the community that stands behind the project. Ubuntu understood
    this from the beginning, coining the name from a South African word meaning “humanity
    towards others.” The community as a whole adopts this premise dealing dealing
    with any that may arise. While other GNU/Linux communities may seem intimidating,
    Ubuntu''s extremely welcoming because it is the new user who is important to bringing
    Ubuntu forward.


    This attitude welcoming the new user is evident when you install the Ubuntu operating
    system. Right from the get-go, you are made to feel at ease, as installation is
    only a few mouse clicks away, compared with some of the heavy text-based installations
    of other distributions. While many GNU/Linux distributions are made for power,
    stability, and security, Ubuntu was made for the user’s comfort—without losing
    the power, stability, and security.'
  merge: -1
