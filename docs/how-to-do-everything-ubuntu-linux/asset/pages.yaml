  md: '# Chapter 22 The Emacs Text Editor 301


    # Moving Around the Buffer


    Programmers find that using the mouse slows them down. Everything is done with
    keystrokes. The following table gives you some of the basic keystrokes to move
    around the buffer area. In Emacs, the letter C stands for the CTRL key, and the
    letter M stands for meta key. With the exception of keyboards by Sun Microsystems,
    keyboards do not have a meta key; however, the term remains from the old days
    of computing. To emulate the meta key, press release ESC, and then the key that
    corresponds to the action you wish to take. Alternatively, you can hold ALT and
    the corresponding key and release them at the same time. You can also work your
    way around the buffer using the arrow keys on your keyboard.


    | Key Binding | Keys Used | Function |

    |---|---|---||

    | C-B | CTRL-B | Move back one character. |

    | C-F | CTRL-F | Move forward one character. |

    | C-P | CTRL-P | Move up one line. |

    | C-N | CTRL-N | Move down one line. |

    | C-A | CTRL-A | Move to the beginning of the line. |

    | C-E | CTRL-E | Move to the end of the line. |

    | C-G | CTRL-G | Quit operation. |

    | C-V | CTRL-V | Move down one page. |

    | C-X C-S | CTRL-X then CTRL-S | Save buffer. |

    | C-X U | CTRL-X then U | Undo last operation. |

    | M-V | ESC, V, or ALT-V | Move up one page. |

    | M-F | ESC, F, or ALT-F | Move forward one word. |

    | M-B | ESC, B, or ALT-B | Move backwards one word. |


    > Note Often the combination of keystrokes to do is called a keyboard shortcut.
    In Emacs, these combinations are referred to as key bindings.


    # Creating a New Emacs File


    Since Emacs is first and foremost a programmer''s tool, we are going to use it
    to write a little program. If you have done any programming in the past, then
    you are probably familiar with the basic Hello World! program. We will be using
    Emacs to write this program, and then we will go back to the terminal to run it.
    So if you have skipped Chapter 21, now is a good time to go back to it! For those
    who have never written a program before, you are in a treat. Most programmers
    learned how to program with the Hello! program no matter what language they learned
    to write in. Don''t be afraid, because this program is easy to write.'
  merge: -1
