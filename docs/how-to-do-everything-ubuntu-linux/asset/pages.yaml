  md: '# 12


    # All Your Base


    +   HOW TO...

    * Open a new database

    * Create a table

    * Create a form

    * Create a query

    * Create a report


    All computers are tools used to harness information. We use the Internet to gather
    information, we use word processors and slide show presentations to provide information,
    and we use e-mail to send information. Most networks have computers like fileservers
    and mainframes whose entire reason for existing is to house information. While
    there are some exceptions, at the core of most information repositories is a database.
    A database is defined as a collection of organized data—information—that can be
    updated and retrieved by a computer.


    Most databases that provide information available through the Internet or through
    large corporations are enormous programs that utilize multiple computers known
    as database clusters. OpenOffice.org provides a database application that you
    use on your personal computer. Like the other OpenOffice.org applications, Base
    is available to you for free along with the Ubuntu/Linux distribution.


    > Relational databases, like those cited in Base, use a language called Structured
    Query Language to manipulate, sort, and display data. Structured Query Language
    is often called SQL, pronounced “sequel,” and is a cornerstone of most Web 2.0
    applications.


    # Opening a New Database


    Since Base is not installed with the initial Ubuntu installation, you will need
    to add this application to your computer. Remember how to add a program? Start
    by clicking'
