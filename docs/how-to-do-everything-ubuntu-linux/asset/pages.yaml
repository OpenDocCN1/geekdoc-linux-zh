  md: '# Part II Manage Ubuntu


    is not the best idea. Static, like heat, can ruin your computer. While heat takes
    some time to slowly chip at your computer''s functionality, static is a quick
    and quiet killer. One zap is enough to ruin a processor.


    In addition to a clean area, you will most likely need a small Phillips head screwdriver.
    Also, this is a perfect time to clean out the inside of your computer, so a can
    of compressed air to get rid of any dust buildup is a good thing to have around
    well.


    To open the computer, follow these steps explicitly:


    +   1. Turn the computer off. After you''ve shut down the operating system, check
    to see if the power supply in the back of the computer has a switch. If it does,
    turn this off well.

    2. Unplug from computer the power cable, all external cables, and all attached
    devices.

    3. Remove the side panel retaining screws. There should be four screws that mount
    each side panel to the case, two on each panel. Make sure that you do not remove
    the screws that are connected to the power supply; you will need to hold that
    in place.

    4. Slide the side panel off the computer.


    > Some computers, especially Dells, do not require you to unscrew anything to
    open the case. These computers have a button that you can hold down to open the
    case. If you are unsure how to open your computer, check with the owner''s manual
    or search online.


    # Where Do I Plug This Thing In?


    Now that you have your computer in parts lying in front of you, I have thought
    about ending the chapter here and seeing how you have learned using the Ubuntu
    community for support. However, I was warned that too much hate would surely bog
    down your e-mail account, so let''s learn how to put this thing back together.


    With the case opened up, you want to make sure that you (a) install the hardware
    device in the right place on the computer and (b) use the right cables to connect
    your new hardware to the motherboard.


    # CD, DVD, and Hard Disk Drives


    If you are adding an additional hard drive or are installing a CD or DVD drive,
    you will need to mount this in the front of the computer through one of the drive
    bays. If you are replacing a CD, DVD, or hard drive, you do not have to open a
    drive bay. If you are adding a secondary device, you will need to open up a slot
    for the new hardware. Most computer cases will have a plastic cover that you can
    remove to make room for a CD/DVD drive. Simply take the cover off, and slide the
    drive into place.'
