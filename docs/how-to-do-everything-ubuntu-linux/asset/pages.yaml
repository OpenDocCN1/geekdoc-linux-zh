  md: '# Chapter 19 Play with Funky Music—Making the Most of Multimedia 247


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_268_0.png)


    If your Sound Juicer opens with this information, it is because the information
    from your CD is found in the MusicBrainz open source, online music database. This
    database contains information about thousands of songs to provide the users of
    open source players with a way to organize their music. Since all of the information
    is provided, you do not have to extract it; all you have to do is send it over
