  md: '# 112 Part III Open the Door to OpenOffice


    # # What Is OpenOffice.org?


    Without a comparable office, GNU/Linux would have a hard time drawing users to
    its operating system, and people wouldn''t switch from Microsoft Windows to Ubuntu
    so readily. After all, if people can''t use their computer to type a letter or
    build a monthly budget spreadsheet, they lost a great deal of its functionality,
    right? To provide Ubuntu users with a solid office suite, a software package called
    OpenOffice.org is installed automatically with the Ubuntu distribution. OpenOffice.org
    is a fully functional office suite that provides Writer, a word processor; Calc,
    spreadsheet software; Base, which allows users to create rich databases; and Math
    and Draw allow users to create complex mathematical functions and to communicate
    through graphics and charts.


    Math is a component that can be used by itself or inside Writer and Impress Draw
    is a program that is comparable to Microsoft Visio for creating organizational
    charts, flow charts, and so on. These two components to the OpenOffice.org suite
    are outside the scope of this book. For more information on how to use these programs,
    check with the OpenOffice community pages.


    Not only OpenOffice.org is compatible with many features of the Microsoft Office
    suite, but it is completely free for you to use. It has no trial period and absolutely
    no licensing fees. With the Ubuntu distribution you can use the software, upgrade
    it, and freely give copies of it to your friends at no cost whatsoever! Pass it
    along to friends who use Microsoft Windows as well. OpenOffice.org can be downloaded
    for Microsoft Windows, Mac OS, Solaris, and of course, GNU/Linux. Equally, the
    community that supports OpenOffice.org is extremely large and just as helpful
    as that of Ubuntu.


    # # Features in OpenOffice.org’s Writer Not Found in Microsoft Word for Windows


    +   * **Export To PDF** Select File | Export To PDF and Writer will turn your
    document into a portable document that can be posted on a web site or opened by
    anyone with the free Acrobat Reader.


    # # How to... Install the Entire Suite


    Not every application available in the OpenOffice.org suite is installed for you.
    When you install Ubuntu, you are given Impress, Writer, Draw, and Calc. To install
    Base and Math, you will need to go to Applications | Add/Remove. Now, select the
    office from the left. When you select this, you will see that most of the applications
    have been selected, but if you scroll down, you will see OpenOffice.org Formula,
    OpenOffice.org Database, and OpenOffice.org Suite. Place a check mark next to
    each of these applications, and then click the Apply button.'
  merge: -1
