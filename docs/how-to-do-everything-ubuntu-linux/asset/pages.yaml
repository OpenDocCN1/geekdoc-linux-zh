  md: '# Manage Which Components You Use


    Versions of Ubuntu prior to Hardy Heron, 08.04, only allowed a user to install
    applications from the main and the restricted components by default. To install
    universe and multiverse, the user needed to change the configuration. With the
    latest LTS version, all four components are accessed by default. Now, the user
    has the option to turn these off. This can be done by navigating to System | Administration
    | Software Sources, Ubuntu will ask you to enter your password, and you will be
    presented with software downloadable from the Internet. You can remove the checks
    from any components you don''t want to download. You can also add third-party
    software repositories by selecting the Third-Party Software tab. Of course, you
    will have to know the URL of the third-party site.


    If you started installing software applications, you need to open the Add/Remove
    tool. This is the easiest way for someone new to Ubuntu to install applications.
    By clicking on the Applications in the top bar of the desktop, you will see the
    thing as you would in Figure 6-1. Now, click on the Add/Remove item, which will
    bring you to a screen like the one in Figure 6-2 that shows the Add/Remove Applications
    window. This window is broken down into four parts. The first part is the top
    of the window where you have the ability to search for applications and also choose
    what type of applications to show based on the component they reside. The second
    part is the left pane of the window where you are given a wide range of categories
    from which you can choose to narrow down your search. The third part is the pane
    directly in the middle of the window. This is where you can see a list of applications
    in the category specified. Finally, the fourth pane is located at the bottom of
    the window. This section gives you a detailed description of the software package
    that is selected.


    So let''s have a fun here and install a new game. The first thing you will want
    to do is select the Games category from the list. The available applications will
    now appear in the appropriate pane. You scroll through the list. Notice that there
    are stars next to each game. These represent the popularity of each application.
    If you are following along, click on one of the games listed, and you will see
    a description of the game directly below the list of applications. So, havinged
    through the list of games, let''s go ahead and select Potato Guy. The description
    seems interesting, so we can go ahead and click the check box next to the application.
    At the bottom-right corner of the window, you will see the Apply Changes button.
    Click that to begin the installation. It will ask you for the administration password
    and then install the application. That''s it, you''re done! You can access your
    newly installed application from the Applications menu. Not only is installing
    from the Add/Remove tool easy, but guess what? If the application is supported
    by Ubuntu, it will notify you when there are updates through the Update Manager
    as


    If you are installing than one application at a time, you can check all of the
    boxes before you click Apply Changes to install everything at once.'
