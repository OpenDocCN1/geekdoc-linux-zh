  md: '# 248 Part V Having Fun with Ubuntu


    In the area for Artist, enter the artist''s name. You can also enter the genre,
    year, and CD number if it is part of a multisk set, enter the Title of the song.
    Once you are done entering the information, go to Disc | Submit Track Names. This
    will take you to the MusicBrainz web site to update the information in the database.


    You may need to create an account for MusicBrainz in order to submit information
    to MusicBrainz. This process is entirely up to you. If you decide not to log in,
    the CD''s information will remain attached to your songs when you extract them
    to their library.


    To find the music you just ripped to your computer, click on Places | Music. You
    should see a folder with the artist''s name; double-click the folder. The name
    of the album will be displayed. Double-click the album folder, and you will see
    a listing of all the tracks from that album that you extracted. See Figure 19-1.

    If you look at the file extension for your music, you will notice that it is not
    .mp3 or .wma but .ogg. This file format is dealt with Ogg Vorbis, which is an
