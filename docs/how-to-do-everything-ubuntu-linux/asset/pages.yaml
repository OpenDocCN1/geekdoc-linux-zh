  md: '# Chapter 21 A Guide to GNU/Linux Shell Commands 285


    named Ubuntu forum, you would need to enter Ubuntu forum. The other way to enter
    a path that contains a space is to enclose the filename in quotation marks, for
    example, "home/jeff/Documents/Ubuntu forum".


    To work your way around the shell, you must have a good understanding of the Ubuntu
    directory tree. Understanding that directories contain files is essential to your
    exploration and mastery of the shell. Listed below, you will find each of the
    directories under the root directory, along with some of the important files and
    subdirectories housed therein.


    Unless you are doing heavy-duty configuring of your computer, you never have to
    go into some of these directories; however, it is good to know what they are used
    for so that you don''t accidentally do anything to the files you are working in
    the shell.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_306_0.png)


    There is a difference between the root directory, which is /, and a root subdirectory.
    The / directory is the directory where everything branches out. This is what we
    consider root. The /root subdirectory is the home folder for the root user. If
    you use a different distribution of GNU/Linux in the past, you have been asked
    to create a root account. When you installed Ubuntu, no account was created. This
    is so that you don''t have a habit of logging in as root and accidentally do damage
    to the directories mentioned here.


    /bin The bin directory contains the commands and utilities that are most commonly
    in GNU/Linux like ls, cd, and rm. Since these are executable binaries, the directory
    is named for short.


    /boot The boot directory contains the Linux kernel, the bootloader configuration
    files, and all other files that the system needs in order to start up, or boot.


    /dev This is where all the device files for the system are stored. This directory
    is unique since the files are actually the hardware devices themselves and are
    just like files that you can read and write. The label /dev/sda (or /dev/hda)
    refers to the computer''s first hard drive. SCSI drives are labeled sda, with
    IDE drives as hda.


    /etc Pronounced "et-see", this directory is home to all the system-global configuration
    files for all users. For example, /etc/passwd contains information that defines
    all of the user accounts, while /etc/init.d is the scripts that run when Ubuntu
    is booting up.


    /home Home is where the files are—the user''s files, that is. This is where documents,
    music, pictures, videos, and so on, are stored for the individual user. Each user
    on a computer has his or her directory under /home.


    /lib Shared libraries and kernel modules are stored in this directory. The files
    are similar to DLL files in Microsoft Windows.'
