    Now that you can add basic text to a web page, we need to put the "design" in
    "web design." Let''s go ahead and dress up the page a bit with some images, tables,
    and different fonts.


    # Inserting an Image


    Back in the days when dial-modems were the rule for household Internet connections,
    web pages had to be extremely careful about the size of the images they included.
    Images that were too large caused loading times for the slower modems, and users
    became frustrated when they had to wait. Now that most users are on some type
    of high-speed Internet connection, Cable or DSL, web pages laden with multiple
    images load with ease. In KompoZer, inserting images is simple. First, place the
    cursor in the editor you would like to image by. Next, click the Image button
    on the toolbar. Once you have clicked this, you will be asked for the Image Location
    (see Figure 16-4). If you don''t know the path to the image location, you can
    click on the small yellow folder at its right to browse for the image you want
    to use. Once the image is selected, you will need to enter an Alternate Text for
    browsers that cannot display the image. Enter a description of the image you are
    using. You can click the OK button here, and your image will appear on the page,
    or you can edit the image.


    # How to... Change Advanced Image Options


    The Advanced Edit button in the Image Properties window allows you to change the
    attributes as the source of the image, its alignment, and any other attribute
    allowed by HTML. Clicking the button opens the Advanced Property Editor, something
    that will make use of you if you decide to learn more about web design. You can
    also add JavaScript to the image. JavaScript is a programming language that works
    within web and provides the page with added functionality.'
