    # View and Edit Pictures


    One of the greatest things about owning a home computer is that you can store
    thousands of pictures on the hard drive. With advances in digital photography,
    no longer have to go out and buy film for developing costs. You can easily transfer
    your pictures from your camera to your computer. If you have the right, you can
    make any high quality copies of a photograph as you want without having to leave
    the house.


    As with music, video, and documents, Ubuntu creates an appropriate folder for
    you, in case you have guessed, this called *Pictures*. This is a storage location
    for your digital photographs and any other graphics you bring to the computer.


    Not only does Ubuntu provide a place to store pictures, but the people at Canonical
    made sure that Ubuntu came with an application that would help your digital pictures.
    This program, called *F-Spot*, can be accessed by selecting Applications | Graphics
    | F-Spot Manager. F-Spot supports 16 graphical file types including JPEG, TIFF,
    GIF, and PNG. If you need to touch your pictures before sharing them on the Web,
    you can remove eye, crop pictures, resize, and even adjust the brightness and
    contrast. With most everything in Ubuntu, you are provided a fully functional
    tool for absolutely free!


    # Importing Pictures


    To get started with F-Spot, you need some pictures. Beginning by launching F-Spot.
    When the application window appears (see Figure 19-6), insert the media that contains
    the pictures you are going to import. Click the Import button on the image menu
    bar to bring up the Import window. Next, select where you are importing from.
    Under Source use the drop-down menu to select the CD. As soon as you select the
    CD, the pictures on that disc begin to load. When F-Spot is loading the pictures,
    you can click the Import button.'
