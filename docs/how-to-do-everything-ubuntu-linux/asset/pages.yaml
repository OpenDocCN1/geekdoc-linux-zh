  md: 'to the terminal to do something, you have been using the terminal to enter
    commands

    for the shell! Much of what you have done so far was limited to the apt-get install

    command, but stay tuned because your knowledge of the shell is going to go a lot
    further.


    For further clarification, the terminal is used to enter commands that the shell

    interprets for the computer.


    # # Navigating the Terminal


    Learning to navigate the terminal is the first step in mastering the

    power of Bash. After all, you have to know where you are going and

    how to get there. Let''s start by creating a launcher for the terminal

    since we will be using so often in this chapter. To begin, select

    Applications | Accessories. Normally, you would select Terminal

    here, this time right-click the terminal and select Add This

    Launcher To Desktop. This will create a shortcut icon on the desktop that you
    can

    neever you need the terminal.


    Now you you want to do work in the terminal, you can double-click you

    to see something like `jeff@jeff-desktop: ~ $`.


    This means the user name jeff is logged into the computer named jeff-desktop.

    Now you are going to enter your first command, which will show you the path of
    the

    current directory. At the prompt, type in the letters pwd (print working directory).

    The pwd command is useful because it will let you know exactly where you are in

    the file system. Now that you have entered your pwd command, press ENTER, and
    you

    should see the following output:


    ```

    jeff@jeff-desktop:-$ pwd

    /home/jeff

    jeff@jeff-desktop:-$

    ```


    Let''s take a look at what files and folders are in the /home/jeff directory.
    At the

    command, type ls and then press ENTER. The ls command will list all of the files
    and

    folders in the current working directory, as shown in Figure 21-1.


    If you want to see files in a folder other than the current working directory,
    you

    use the ls command to do that as well. For instance, if you wanted to see what

    was in the Pictures folder, you could type


    ```

    ls /home/jeff/Pictures

    ```


    Or, you can use a shortcut to access this ./ as a substitute for /home/jeff:


    ```

    ls ./Pictures

    ```


    Figure 21-1 shows the output when these commands are entered into the terminal.


