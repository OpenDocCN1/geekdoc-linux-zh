  md: '# The Meaning of Root


    Root has two meanings in GNU/Linux. The root user is the administrator of the
    computer. Ubuntu does not create a root account, because normal operations of
    the computer when logged in as root can cause damaging results.


    The other definition of root in GNU/Linux is also called the root directory, which
    is the highest-level directory in the file system. When adjusting the crontab
    file, you are retrieving this from the root directory.


    After you enter this command in the terminal, press ENTER. You should now be asked
    for your password. Use the same one you set up for your account. When you enter
    this password, nothing will show up as you type. This is typical of a GNU/Linux
    system daemon looking over your shoulder to see how many characters your password
    has. This is a security feature that prevents people from looking over your shoulder.
    These "shoulder surfers" could make an educated guess at your password with this
    knowledge. Again after you enter your password, press ENTER. After a couple of
    seconds, you should see the crontab editor open. Click the editor''s window to
    make sure you have a cursor and type the following:


    ```

    00 * * * * /usr/bin/apt-get update && /usr/bin/apt-get upgrade -y

    ```


    Let''s analyze this before we save the changes. The command starts with a series
    of zeros. The crontab file tells us what time to run the command. Thus, 00 would
    mean 12 A.M. If you wanted to set the time to run this file at 4:30 p.M., the
    command should run 16 30. The three asterisks following the time give us the ability
    to control the date, month, and/or day of the week. The date can contain a value
    from 1 to 31, the month can range from 1 to 12, and the day of the week can be
    between 0 and 6, with 6 being a Sunday. The asterisk runs every day.


    The rest of the command tells the operating system what to and where to do it.
    The file location is /usr/bin, apt-get is the actual program that runs to update
    and upgrade your software. Update Manager is the graphical interface for the update/upgrade
    portion of the apt-get program. The -y means answer to any questions that may
    be asked during the process.


    If you wish to leave your command run at 12:00 A.M., then you can leave your file
    alone at this point and select | Save. If you wish to set a different time, or
    even to adjust the date, go ahead and adjust this and then save your file. This
    file has been saved, you can choose your crontab editor and your terminal, and
    then take pride that you once again have journeyed into the depths of GNU/Linux
    and lived to tell you about it! But be careful, when you work more and more in
    the terminal, you really begin to feel how much control you have over your operating
    system. After a while, you may find yourself ignoring the graphical interfaces
    in Ubuntu and beginning to make your terminal of choice!'
  merge: -1
