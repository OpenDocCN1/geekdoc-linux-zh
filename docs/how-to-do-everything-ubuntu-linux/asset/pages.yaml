  md: '# Chapter 8 Keep It Safe—Securing Ubuntu 95


    If you have spent time researching GNU/Linux and Ubuntu on the Internet, you have
    probably seen articles and forum postings showing how much more secure this operating
    system is than Microsoft Windows. If you haven''t, do a Google search with the
    terms "GNU/Linux + security," you will see what I am talking about.


    When users install Microsoft Windows, they are asked to create an initial account.
    This account was always given administrator privileges, meaning nothing was considered
    off-limits to the user account. Therefore, if a piece of malware were run under
    this account, it would have free run of the computer. Ubuntu takes a different
    approach. The initial users created during the installation process are not free
    to do whatever they want. Remember when you are installing applications from the
    terminal and you have to type "sudo" this is because the user is not the administrator,
    or root, as we call it in GNU/Linux. It''s the same as the Add/Remove tool or
    the Synaptic Package Manager asks for password when you try to install something.
    This concept obviously works because Microsoft now uses a similar procedure in
    the Windows operating system.


    Another reason GNU/Linux is much more secure than Windows is that a disproportionate
    amount of malware affects Windows compared with GNU/Linux. More importantly, the
    two operating systems have different types of users. Microsoft Windows is this
    large market share many users who do not practice or care about good computer
    security. People who use GNU/Linux are a different—most have taken a step beyond
    casual computer users to delve into a broader world of computing. With this curiosity
    comes more awareness. Of course, this is only a theory, and millions adopt Windows
    users. This theory emphasizes the importance of the user plays in keeping a computer
    secure. As a user, it is up to you to install applications like antivirus software
    and a firewall. It is up to you to make sure this software and all other applications
    are updated frequently. Most importantly, it is up to you to use these security
    applications.


    # Installing Frankly


    We are not installing a copy of Drew Barrymore''s early work. We are installing
    one of the most essential parts of a sound computer security plan, the firewall.
    Over the years, the term "firewall" has been misunderstood by some. It is sometimes
    defined as a tool that restricts access to web sites. Although some firewalls
    contain content filters, this is not the main purpose of a firewall. A firewall
    is a tool that restricts access to a computer system or network by controlling
    access to a computer''s ports, which serve as endpoints to data connections. In
    Ubuntu, the default installation does not open any ports on the computer. Most
    computer systems have no need for any ports to be opened, so opening no ports
    during installation does not hinder the performance of the computer.


    If Ubuntu does not open any ports, why do you need a firewall? Good question.
    Although you have no open ports on your computer from the start, you may decide
    to open certain ports later for features such as remote access, or to'
  merge: -1
