  md: '# Chapter 12 All Your Base 153


    which allows you to directly type in the Field Name, Field Type, and Description:


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_174_0.png)


    Also in the Task pane, you can choose to Use Wizard To Create Table. If you choose
    the wizard, you will be taken through the various steps necessary to create a
    table. Since you chose to create a table in the Database window, you will be taken
    through the steps in the wizard automatically.


    You have performed the initial save of the database, you are then taken to the
    Table Wizard (see Figure 12-3). By default, the Table Category is set to Business,
    and the Sample Tables will be set to Assets. Since you are creating a database
    of users, change Assets to Contacts with the drop-down menu. Now, you can choose
    the fields from the available fields offered. To choose a field, you can double-click
    the field, or you can single-click the field and then click the > button. The
    same steps can be done to delete a field from your Selected Fields box. Clicking
    the > or the < button will move all of the fields to the other box. For example,
    select the Address, ContactID, FirstName, LastName, and EmailAddress for this
    database. Once this is done, you can click the Next button.


    Step 2 of the Table Wizard allows you to set the field types and format the fields
    (see Figure 12-4). The field type can be set to Images, Integers, Numbers, Decimals,
    Date, Time, Date/Time, or any of the other options presented to you. Most of these
    choices are used if you are going to tie your database into a programming language
    to perform different equations. For most databases, you can stick to the basics
    like Text, Numbers, and Images.'
