  md: '# 80 Part II Manage Ubuntu


    # # The Synaptic Package Manager


    In Chapter 4, we introduced the Synaptic Package Manager when we learned how to
    clean up residual packages and orphaned packages. This same tool can be used to
    install software much as you did with the Add/Remove tool. By navigating to System
    | Administration | Synaptic Package Manager, you can launch another graphical
    interface that allows you to install and uninstall software applications. Like
    the Add/Remove tool, Synaptic will ask you for your password and then open into
    a window as seen in Figure 6-3.


    So aside from looks, what is the difference between Synaptic and Add/Remove as
    installation tools? Both are graphical interfaces for the dpkg/apt-command that
    would run in the terminal window, which installs, removes, and provides information
    on the different packages in Ubuntu and other Debian-based distributions. Synaptic
    lists the packages—collections of programs, procedures, or rules—associated with
    the application as a whole. Synaptic is a more advanced interface allowing the
    user to specify the different packages to download or fix. Add/Remove can be thought
    of as a more friendly interface for the beginner.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_101_0.png)


    Figure 6-3 Synaptic Package Manager'
