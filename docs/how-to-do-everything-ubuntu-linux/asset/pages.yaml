  md: '# Chapter 21 A Guide to GNU/Linux Shell Commands 291


    use the a setting. To add permissions, you will use the +, and to take permissions
    away, you use the -. So if you want to give all rwx permissions to the Jackeline
    directory, you would type


    ```

    sudo chmod a+rwx Jackeline

    ```


    To take away others'' permission to execute anything in the Pri directory, the
    following would be typed into the terminal:


    ```

    sudo chmod o-x Pri

    ```


    Another way to change permissions is to use binary numbers that represent read,
    write, and execute. Binary numbers are the computer''s language because everything
    is represented by a 1 or a 0. The number 1 can mean things yes, or an electrical
    impulse; the number 0 can mean no, off, or no electrical impulse. The computer
    translates all of the 1s and 0s into everything we see a computer do. The following
    numbers can be used to set file permissions as well:


    | Permission | Explanation |

    |---|---|

    | 7 | 111 in binary code. This gives read, write, and execute permissions. |

    | 6 | 110 in binary code. This gives read and write permissions but not execute.
    |

    | 5 | 101 in binary code. This allows read and execute permissions, but not write.
    |

    | 4 | 100 in binary code. This allows for only read permissions. |

    | 0 | 000 in binary code. No permissions granted. |


    So if you want to give everybody read, write, and execute permissions to the directory
    you would type


    ```

    sudo chmod 777 Videos

    ```


    Any combination of the numbers in the previous table can be used to set permissions
    for a file or directory''s permissions in Ubuntu, the text will be with the chmod
    command.


