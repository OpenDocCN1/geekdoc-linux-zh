  md: '# Chapter 1 Ubuntu-Who? Get to Know Ubuntu 11


    You may have noticed that a few things in Table 1-1 may be a bit off conventionality
    and previous statements about the release cycle. First of all, the version numbers
    do not seem to follow any conventional numbering scheme. At first glance, there
    appears to be no rhyme or reason to the version numbers listed. After all, there
    is no version! Now take a second look at the table, and you may see that “4.10”
    is the European method for writing “October 2004.” Each of the different versions
    follows this method.


    Some of the names have interesting histories to them. Warty Warthog was named
    such due to a conversation between Mark Shuttleworth and developer Collins. When
    told that Ubuntu would be released in a maximum of six months, Collins thought
    that such short time would not allow for much to polish the product. Shuttleworth
    responded, “So we will have to nickname it the warty release.” The meaning that
    the release would be full of hearts. Hoary Hedgehog came from a change in the
    name of the third release. Originally, it was going to be called Grumpy Hedgehog,
    Shuttleworth stated on the Ubuntu Wiki that he did not like the connotation of
    the word “grumpy” and opted for Breezy Badger instead. Then names followed alphabetical
    order to help organize the naming scheme. There are no promises from Shuttleworth
    and team that will follow the letters of the alphabet, but you can be assured
    that concept will be for some time.


    Speaking of the names, they just seem bit peculiar, don''t they? The release names,
    just like everything else deals with Ubuntu, are driven by the community itself.
    The community members suggest the “animal adjective” release names not in the
    form of a competition, but as a way to work together yet another part of the Ubuntu
    project. Remember, members are encouraged to contribute in any possible way.


    Secondly, you''ll notice that version 6.06 doesn''t follow the traditional six-month
    release cycle. No, the developers weren''t on a long vacation this time. The Dapper
    release brought a new version of the Linux kernel and new versions of Open Office,
    Mozilla Firefox, X, and GNOME. While support for the desktop version will last
    until 2009, the server edition will last until 2011.


    So than giving each release a catchy name, what else changes? Just as Windows
    and Mac have upgrades and new releases to fix flaws in the operating system, address
    security issues, or give the users a new, sleek desktop environment, those who
    created GNU/Linux do the same. Being a community-driven project, Ubuntu focuses
    on requests and criticisms from the community at-large when creating a new release.
    Each time the operating system is upgraded, certain issues have been addressed
    by the development team. To date, there have been no fundamental changes in how
    Ubuntu runs or how a user interfaces with the operating system. Remember, Ubuntu
    is Linux for human beings. To make drastic changes in how the user sees the operating
    system would go against all of the Ubuntu fundamental philosophies.'
