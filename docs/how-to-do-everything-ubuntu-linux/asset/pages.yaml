  md: '# Coming Out of Your Shell—A Guide to GNU/Linux Shell Commands


    HOW TO...


    +   - Navigate the file system through the shell

    - Make directories

    - Move and copy files and directories

    - Create users

    - Set file and folder permissions

    - Search using grep and find

    - Find help

    - Control processes


    By now you should be extremely comfortable with Ubuntu. You have learned to install
    programs, drivers, test hardware, and you''ve even used the terminal. Consider
    this chapter your graduation from the GUI. No longer will you be trapped in the
    box of the graphical user interface. As you walk across this stage and flip your
    tassel, you will enter the world of the GNU/Linux called Bash (Bourne Again Shell).
    The name is a pun on an earlier shell used by Unix called the Bourne Shell, written
    by Stephen Bourne. The Bourne Again Shell has the default shell used by GNU/Linux
    operating systems and the Mac OS X operating system.

    Contrary to GNOME, which provides the user with a graphical interface (TUI), Bash
    relies on a text-based user interface which means all of the commands are entered
    through your computer''s keyboard. Until the development of the graphical user
    interfaces like GNOME or KDE, this was the way GNU/Linux users operated their
    computers. Every time you have turned already had some experience with Bash commands.'
  merge: -1
