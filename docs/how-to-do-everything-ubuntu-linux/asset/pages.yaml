  md: '# Chapter 8 Keep It Safe—Securing Ubuntu 101


    # Installing ClamTk


    Installing ClamTk is very easy. Start by going to the Add/Remove tool. You do
    remember how to get there, right? From the categories on your left, select System
    Tools and then scroll the list until you see Virus Scanner. From here simply select
    this application and then click Apply Changes as you have done before. Voila!
