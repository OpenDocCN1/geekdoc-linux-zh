    #  Learning to Samba


    No dancing Brazilians here. This type of Samba actually deals with the Server
    Message Block (SMB) protocol. SMB is important to networking because it is the
    protocol used for sharing files, shared printers, and serial ports on a network.


    > Did You Know?


    # Why We Need Samba


    While we have discussed the SMB protocol is responsible for, you may be wondering
    what Samba does.


    The SMB protocol is used primarily by Microsoft Windows Networks. If you look
    in the Network Neighborhood when using a computer running a Microsoft Windows
    operating system, you will see all of the shared files on that network. If you
    add a computer Ubuntu hosted on your Ubuntu computer will not be available to
    the computers running Microsoft Windows. This is because GNU/Linux computers commonly
    use the Network File System Protocol (NFS).


    Samba is a software implementation of the SMB protocol for computers that do not
    use the NFS protocol. In plain English, a computer running Microsoft Windows can
    access files on a computer that uses Ubuntu for its operating system by using
    Samba.'
  merge: -1
