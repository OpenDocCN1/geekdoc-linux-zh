  md: '# 82 Part II Manage Ubuntu


    A .tar, as in “tar.gz,” in GNU/Linux stands for “tarball.” The .gz stands for
    “GNU zip” or “gzip.” A TAR file is actually a collection of many files that are
    archived into one file. This file, called tarball, is then compressed using a
    tool like gzip. This compressed file can be easily and quickly sent by e-mail
    or other data transfer method. Since it is compressed, it takes up less storage
    space as well. The newly compressed file is named file.tar.gz.


    Now to open the kfib-1.0.5.tar.gz file, you need to uncompress it with a tool
    like gzip, as shown in Figure 6-5.


    Now you need to get into the terminal and install this application. First, navigate
    to the terminal through Applications | Accessories | At the terminal, you will
    need to navigate to the directory where you extracted the application. In this
    instance, you extracted to the Desktop, so let’s learn a bit more about the terminal.


    When the terminal opens, you will see something like


    ```

    jeff@jeff-desktop:-$

    ```


    On your computer, it will be your username in place of the first “jeff,” and your
    computer name in place of the second “jeff.” When you have it on screen, type
    Is as the prompt follows, and then press ENTER:


    ```

    jeff@jeff-desktop:$ ls

    ```


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_103_0.png)


    FIGURE 6-5 The GNU zip (gzip) extraction tool'
