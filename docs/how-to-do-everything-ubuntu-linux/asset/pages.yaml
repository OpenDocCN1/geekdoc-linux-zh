  md: '# The Ubuntu Community


    As with any open source project, the community that contributes makes the project
    success. The community that has helped to make Ubuntu what it is today is no different.
    Community members are encouraged to contribute what they can to the building of
    Ubuntu. To some, this means writing the code that makes up the operating system
    software. Others contribute by answering questions on the forums on installing,
    configuring, and using Ubuntu. Artists contribute by creating logos (see Figure
    1-2) and themes for the software. Others help to translate documentation into
    other languages. Even those who are casual users can make a contribution by submitting
    animal adjective names for future versions of the operating system.

    The community itself is broken into three categories: Contribute, Help and Information,
    and Community Structure. Under each of these categories, users and contributors
    can find exactly what they are looking for. The Ubuntu Community home page can
    be found at www.ubuntu.com/community.


    # Contribute


    Under the Contribute category, community members can work in any of four areas.
    Development is for those wishing to submit software code to the project, test
    the software, or debug the existing code. This makes up the central part of the
    software creation and is one of the most important jobs a community member can
    undertake. There are some bounty programmers that in this area where from $100
    to $500 is paid to the person who finds a working solution to the problem. Those
    who are not strong coders also submit ideas for other programmers to work on that
    can help make Ubuntu a better operating system.


    For those with a flair for words, the documentation team is always looking for
    help in writing the Ubuntu documentation or contributing to the Ubuntu Wiki. In
    addition to writing the actual content, community members can review text for
    grammatical errors and follow written instructions to ensure they make sense and
    work as they are supposed.


    One of the greatest tasks a community can take on is support other community members
    through questions asked in the forums or on the Internet Relay Chat (IRC) channels
    dedicated to Ubuntu. Questions range from beginners looking to get Ubuntu up and
    running to to advanced users who are looking to implement Ubuntu in their corporate
    networks. Answers to many questions and problems are found in these forums for
    other users to read as well.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_33_0.png)


    FIGURE 1-2 The Ubuntu logo created by community members'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Chapter 1 Ubuntu-Who? Get to Know Ubuntu 13


    The fourth area of the Contribute category is artwork. Skilled graphic artists
    submit not only logo ideas, but also other graphics used in the desktop interfaces
    offered by Ubuntu including, desktop backgrounds, and the themes that give individual
    Ubuntu users the ability to configure the look of their desktop environment.


    # Help and Information


    Two areas of Help and Information overlap with the Contribute category, documentation
    and support. Where the Contribute category provides more information regarding
    how individual members can work in these areas, Help and Information gives community
    members seeking support an avenue in to search for solutions. Additionally, there
    are unique areas called community blogs and news.


    Community blogs are maintained by Ubuntu developers and contributors. They give
    a look into the lives of these community members and often give insight as to
    who is working on what projects and what future holds for Ubuntu. These blogs
    give other community members a place to look at how Ubuntu has progressed and
    how different issues were addressed by the development team.


    News provides community members with access to all news related to Ubuntu. Full
    Circle, the magazine of the Ubuntu community, can be read here as the weekly newsletter
    for Ubuntu. Members of the community can also read other snippets of news such
    as upcoming events and other informative content related to Ubuntu. The name of
    the news site is the Fridge, since anything cool and fresh can be found to the
    outside of it.


    # Community Structure


    This category defines the Ubuntu community and serves as a way to organize projects,
    members, and the way Ubuntu is run. Like the other categories, Community Structure
    is broken down into four areas.


    Governance and process defines the organizational structure of the Ubuntu community
    and defines how people are chosen to take on certain responsibilities for various
    projects. This serves as a type of bylaws for the community as a whole.


    The code of conduct governs how community members should act when in anything
    related to Ubuntu. The ground rules are simple:


    +   * Be considerate.

    * Be respectful.

    * Be collaborative.

    * When you disagree, consult others.

    * When you are unsure, ask for help.

    * Step down considerately.


    > The last rule, "step down considerately," means that if you are leaving a project
    or discussion, so do in a way that others can pick up where you left off with
    little or no disruption.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_34_0.png)'
  merge: -1
