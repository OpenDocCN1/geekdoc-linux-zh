    software. Purchasing this software through the Windows Marketplace can cost $400
    for the standard version and $500 for the professional version! After spending
    a good chunk of change for the computer itself, the last thing most of us want
    to do is shell out a few hundred dollars for the software we feel making owning
    a computer worthwhile. However, most people will spend the money for this software
    suite because Microsoft Office provides us with a powerful word processor, spreadsheet,,
    database author tool, and presentation builder. Without these tools, a computer
    feels kind of barebones.


    > Note Microsoft Office comes with other programs such as Outlook and Publisher.
    These are not discussed here because the context of this book addresses only the
    key tools: Word, Excel, Access, and PowerPoint.'
