    To rip the music off the CD, you will need to select the songs you want to extract.
    By default, if there are any tracks you don''t want to extract, remove the check
    mark next to them. Once you have selected the tracks that you want to rip to your
    library, click the Extract button. Sound Juicer will start extracting the songs
    which could take a while depending on the length of the songs selected. As Sound
    Juicer rips a song from the CD, the check mark is removed. Once all of the songs''
    check marks are gone, the extraction is complete.


    > NotenSound Juicer has a Play button next to the Extract button. You can use
    Sound Juicer as a music player if you wish; it is a great tool to use for choosing
    which songs you want to extract. Although Sound Juicer can be used as a music
    player, Rhythmbox is a much more robust application for playing music.


    If you open Sound Juicer and your CD''s information does not appear in the appropriate
    boxes, then the CD''s information is not present in the MusicBrainz database.
    If this should be the case for a CD you are using, this is a great opportunity
    for you to give back to the open source community! When you open Sound Juicer,
    you are alerted to the fact that the tracks are not in the database. You are given
    the option to Submit Album or to Cancel. Click Cancel for now. Under Title, enter
    the name of the album.'
