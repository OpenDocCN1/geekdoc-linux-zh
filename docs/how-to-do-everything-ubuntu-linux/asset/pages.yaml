    FIGURE 16-7 The finished page


    # Publishing Your Site


    Did you ever wonder what the http stands for in the beginning of a web address?
    HTTP stands for Hypertext Transport Protocol. This is the method of requesting
    a web page from the server and then sending it to the server to your browser.
    Most browsers assume you are using http when you type a web address to the address
    bar.


    For publishing your web site, you are going to use a different transfer protocol
    FTP (File Transfer Protocol). FTP can be used for sending programs, music, videos,
    and others from one computer to an FTP server where the file can be transferred
    to other computers as well. Some of the other files are the files that you make
    up your web site.


    To transfer files via FTP, you need an FTP client, the address of the FTP server,
    a username, and a password. Luckily for Kompozer has an FTP tool for sending your
    web site to the server. The other information needed for the file transfer was
    probably sent to you by your hosting company. If you don''t have this information,
    contact your tech support to obtain it.


    The next step in publishing your web site is to launch the Publish Page (see Figure
    16-8) by clicking the Publish icon on the Kompozer toolbar. Once the Publish Page
    is launched, you will need to provide a Site Name. Any name will do here. Next,
    the Publish Page will ask for your web site address. Enter the complete web site
    address in something like this format: www.yoursite.com. Next, you will need to
    enter the address for the Publishing Server. This is your FTP server.'
