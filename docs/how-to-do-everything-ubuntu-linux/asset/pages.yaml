  md: '# 5


    # # Installing Peripherals


    ### HOW TO...


    +   - Understand what peripherals are

    - Understand device drivers

    - Find device drivers

    - Install peripheral devices


    The days of a system consisting of a computer, mouse, keyboard, and monitor are
    long gone. As people became more comfortable with the home needed printers, the
    need to add additional devices grew. Kids using computers to type up book reports
    needed printers. Multimedia capabilities gave rise to cameras, speakers, and microphones.
    Scanners were introduced to digitize images and documents. Then, of course, gamers
    needed gamepads and joysticks to remain competitive as they played online against
    their friends. While peripheral devices may not always be needed for a computer
    to do its job, it makes owning a computer much more fun.


    # # What Are Peripheral Devices?


    Over the past few years, the typical desktop computer has branched out to include
    all sorts of devices like printers, cameras, scanners, music players, and a host
    of other components that make the computer system a much more powerful tool. These
    devices that are outside of the computer system unit are referred to as peripheral
    devices because they exist in the peripheral area of the computer, not inside
    of it.


    With the advent of USB technology, these peripheral devices are easily plugged
    into unplugged from a computer without the need to reboot the system, allowing
    a user to swap devices on-the-fly. Add the fact that computers now come with at
    least four USB ports in their standard configuration, and it is easy to see how
    most home computer systems are loaded with external devices.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Are the Mouse and Keyboard Peripheral Devices?


    Most people think of printers, scanners, and cameras as the most common peripheral
    devices. In the early days of computing, that is, before the development of the
    personal computer, the base system consisted of the motherboard, the central processing
    unit, and the memory. Taking into this consideration, the keyboard and mouse were
    originally considered peripheral devices. To this day, some still consider these
    two devices to be peripherals because so many of them require device drivers to
    be installed with.


    # Peripherals and the Early Days of GNU/Linux


    Early in this book, I explained that at time GNU/Linux was thought to be an operating
    system for the computer enthusiast. Okay, it was thought to be strictly for computer
    geeks. One of the primary reasons it was not used by many average users was it
    lacked support for peripheral devices. It wasn''t that the devices were not made
    to work with GNU/Linux operating systems, it was that the systems didn''t have
    device drivers for the devices. Most computer users had one of the GNU/Linux distributions
    on their machine either knew how to write their own device drivers for the hardware
    they installed, or knew someone who had a workable device driver. Many times these
    GNU/Linux pioneers would hack existing drivers to save them time.


    > Remember, *hack* is not a negative term! Hacking means something to make it
    work for you. Most early adopters of GNU/Linux hacked programs out of necessity.
    In fact, hacking in the open source world is encouraged. The media turned this
    into a Four-letter word. For criminals who break into computer systems, the term
    "cracker" or "malicious hacker" is more appropriate.


    # What Is a Device Driver?


    Device drivers are programs that tell pieces of computer hardware and higher-level
    programs how to communicate with each other through the computer bus that essentially
    transfers these communications. Device drivers are operating-system dependent,
    a printer driver for Microsoft Windows will not work with Ubuntu. The following
    section on Ubuntu drivers will give you a better idea of how this process works.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Chapter 5 Installing Peripherals 67


    After a while, the GNU/Linux community grew. Their fondness for sharing spread
    drivers amongst the users. Soon, people did not need to know how to write device
    drivers; they just needed to know where to look for them. With everything else
    that has to do with computers, the World Wide Web made it easier for average computer
    hobbyists to find drivers for their GNU/Linux distributions. Eventually, the popularity
    of GNU/Linux distributions like Red Hat, SUSE, and Ubuntu began to grow. These
    and others found their way into businesses, governments, and homes around the
    world. Wanting to miss out on this growing market, many hardware manufacturers
    began issuing drivers with their products that would work with these operating
    systems. Nowadays, if users want to buy a webcam for their computer running Ubuntu,
    they all have to do research which models have device drivers already written.
    Let''s set up the computer and see how easy it is to find peripherals that are
    Ubuntu friendly!


    # We Can I Get Those Wonderful Toys?


    With the Internet so easily accessible, many people have come to use it as a way
    to shop, specifically for computer items. Thousands of web sites are devoted to
    providing Internet shoppers with customer reviews of different products, product
    comparisons, and where to find the lowest prices. These same techniques can be
    used for peripheral devices that have device drivers specifically for the GNU/Linux
    operating system.


    Once you have determined what manufacturer and model you are looking to, you can
    take two routes to make sure that your device work with your computer. The first
