  md: '# 284 Part VI Advanced Ubuntu


    Now you''ve played around a bit in your own backyard, so it''s time to take a
    trip outside of the home folder and into the rest of the Ubuntu file system. Remember
    the commands you have just learned, and you can find your way back home.


    # The Ubuntu Directory Tree


    The directory tree is the hierarch structure that organizes directories and files
    in a Unix-based system. With any organizational chart, there is a hierarchy. In
    the Ubuntu tree, the top order of the hierarchy is the root directory. Underneath
    the root directory are many other directories, subdirectories, and files that
    branch out form the treelike structure. If you look at the Unix directory tree
    as an actual tree, think of root as the trunk, the subdirectories under root as
    main branches, and the files as leaves on the tree.


    To all Microsoft Windows converts: what calls traditional GNU/Linux users call
    directories. The terms become interchangeable with folders being a more generic
    term that is used. For the purpose of discussing the Unix system in Chapter 21,
    we will use the directory tree more often.


    To access a file from the terminal, you need to type in the file''s path. There
    are two different types of paths you can use to access a file. The first type
    of path is an absolute path. When you use an absolute path to access a file, it
    starts in the root folder and makes its way down the tree. For example, if I have
    a file saved in my Documents folder, the absolute path for this document would
    be /home/jeff/Ubuntu. The slash (/) is the symbol for the root folder. The folder
    underneath root is the home folder, followed by the current user (in my case,
    jeff), the Documents folder, and lastly, the file named Ubuntu.


    The root directory should not be confused with the root user. The root is the
    account that has complete access to all files and directories on a computer or
    network and is similar to the administrator account in a Windows system. When
    malicious hackers claim that they have "root" on a system, this is what they are
    talking about; it gives them complete access to the computer or network.


    A relative path is the path that is taken when you are not starting from root,
    /, but are pointing to a file or directory that is within the current working
    directory. Let''s use our previous example to show a relative path. Suppose we
    have changed directories to the Documents folder cd ~/home/jeff/Documents. Since
    the current working directory is Documents, the relative path to the file would
    be Ubuntu.


    When navigating the directory structure of Ubuntu, a few special characters help
    you on your journey. The . is used to refer to the current directory, and .. ~
    is used to refer to the current user''s home directory. Also, if you have a filename
    that contains a space, you will need to use the backslash (\ for the space. For
    example, if you have a file'
  merge: -1
