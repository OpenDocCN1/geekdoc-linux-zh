  md: '# 54 Part II Manage Ubuntu


    # Unpatched Systems and the Sasser Worm


    Installing newly released patches is a necessity in this day of malware running
    wild. An example of what can happen to unpatched systems is the aftereffects of
    the Sasser worm, which was released April 30, 2004. Sasser spread quickly over
    networks and the Internet to disable computers by making them shut down on their
    own. The worm removed, the computer had to have a security patch installed before
    attaching the computer back to a corporate network or the Internet.

    This resulted in airlines flights canceling, foreign military branch services
    being disabled, financial institutions being unable to trade, and in a hospital
    having its imaging shut down, making its x-ray patients go to another hospital.


    Even though Ubuntu is not driven by corporate profits, the developers still issue
    updates and patches to the operating system. While Microsoft products are targets
    of the majority of attacks by malicious hackers exploiting vulnerabilities in
    their software and operating systems, Ubuntu is not. To combat these vulnerabilities,
    a patch is issued by the developer. This type of “patches” holes, or vulnerabilities,
    in the software, making it immune to that particular exploit. To make the operating
    system more secure for its users, Ubuntu also provides a notification system whenever
    a patch or update is available.


    For the standard desktop and server versions of the Ubuntu operating system, security
    updates are provided for 18 months. Long Term Support (LTS) releases like Hardy
    Heron provide a longer life for security updates. The desktop version is supported
    for three years, while the server version of an LTS release is supported for five
    years.


    # Updates for a Better World


    Not all updates for Ubuntu or for other operating systems are in response to a
    security vulnerability. Sometimes the development community comes out with updates
    that can make the operating system better. Ubuntu has an upgrade to the operating
    system every six months. This ensures that the Ubuntu community is provided with
    the latest functions of the operating system and its accompanying software packages.


    By now, you should have had a chance to look at the Ubuntu web site and to see
    all of the opportunities to get one way or another in the development of Ubuntu.
    In case you''ve not taken a minute or two to visit https://blueprints.launchpad.net/ubuntu/hardy
    you can see a list of goals that have been accepted by Canonical and the community
    for the Hardy Heron LTS release (see Figure 4-1). As a member of the Ubuntu community,
    you can suggest updates as well.


    One feature that Ubuntu prides itself on is the belief that Ubuntu provides “Everything
    you need on one CD.” We have discussed in earlier chapters the fact that the Ubuntu
    package you receive contains useful productivity, entertainment,'
