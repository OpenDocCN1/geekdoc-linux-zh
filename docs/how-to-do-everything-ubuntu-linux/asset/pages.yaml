  md: '# A


    # # Install Ubuntu


    Ubuntu can be installed in multiple ways on a computer system. You can install
    over a network, you need to a USB drive, and you can even use floppy disks to
    install the Ubuntu operating system. This guide takes you through the installation
    process using a CD-ROM. Remember, Ubuntu will ship you a copy of the CD-ROM free
    of charge, but it can take a while for it to get to you, so they recommend downloading
    the ISO image and burning your copy.


    Once you have a copy of Ubuntu, you need to check to see if your computer meets
    the system requirements for Ubuntu. Most modern computers exceed the recommended
    settings for installation, but still you would be wise to make sure.


    # ## Minimal System Requirements:


    +   * 300 MHz x86 processor

    * 64MB of system memory (RAM)

    * At least 4GB of disk space on your hard drive

    * VGA graphics card capable of 640 × 480 resolution

    * CD-ROM drive or network card


    # ## Recommended System Settings:


    +   * 700 MHz x86 processor

    * 384MB of system memory (RAM)

    * 8GB of disk space on your hard drive

    * Graphics card capable capable of 1024 × 768 resolution

    * Sound card

    * A network or Internet connection'
  merge: -1
