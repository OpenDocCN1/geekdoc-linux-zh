- img_proc: true
  md: '# Playing Online Games


    Some of the most popular games played on personal computers are small games that
    are hosted on web sites. These games utilize two technologies from Adobe, formerly
    Macromedia, called Flash and Shockwave. Flash is an animation tool that allows
    designers of web sites to embed animated movies and interactive games into their
    sites to give their visitors more content.


    Flash is used so frequently that Adobe has developed a Flash plugin-in for the
    Firefox browser that runs in Ubuntu and other flavors of GNU/Linux. The Free Software
    Foundation also supports an open source flash player called Gnash, GNU flash that
    can be run on open source browsers. Without a flash player, you will not be able
    to view flash content. When you encounter a site that hosts Flash games, you will
    be prompted to install at least one flash player plug-in from a list. Once the
    plug-in is installed, you will have no problems when you come upon a web site
    that makes use of flash animations.


    Shockwave is a similar technology to Flash and is developed by the same company.
    While Shockwave is much more robust than Flash, it is not as popular. This is
    a good thing for Ubuntu users since currently no Shockwave plug-in exists for
    Firefox running on a GNU/Linux platform.


    When you encounter a web site that uses Shockwave, you will be told to Click Here
    To Download Plugin. If a plug-in existed, your life would be easy. Since one does
    not, you have the option to skip the web site, or you can use Wine as a workaround.


    If you choose to use Wine to solve this problem, download a version of Firefox
    for Microsoft Windows. Once you have this EXE file, install it as you would any
    other program using Wine. When you come across a web site that makes use of Shockwave
    for animation, fire up your Windows version of Firefox and visit the web site
    from there.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Play that Funky Music—Making the Most of Multimedia


    HOW TO...


    +   * Rip music from a CD

    * Play music

    * Install a music player

    * Use a video player

    * View and edit pictures

    * Record sound and video

    * Get your iPod to watch Ubuntu


    Everywhere you look nowadays, you see people with the bulky portable cassette
    player attached to their ears. Gone are the days no longer concerned that the
    compact disc will skip if so much as move with your portable CD player. The media
    player of today is a streamlined piece of high-tech equipment that has more functionality
    than most home computers of the early dot-com days.


    Not only has the technology of portable media improved in the few years, but the
    types of media available have grown. While previous portable devices could only
    play music, today''s portable media player can play digitally recorded music,
    movies and television shows, podcasts, audio books, and e-books, and can keep
    users up to date with RSS (Really Simple Syndication) on any topic of interest.


    While portable media devices have seen their share of growth over the years, computer
    manufacturers highlight a model''s multimedia capability as a selling point in
    the home computer market since people want to share music, videos, pictures, and
    a vast assortment of different media with their friends and family. Computers
    have even come to replace the variety of components that once made up the home
    entertainment system.'
  merge: -1
