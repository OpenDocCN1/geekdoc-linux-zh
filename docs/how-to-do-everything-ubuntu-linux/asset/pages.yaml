- img_proc: true
  md: '# Run Your Program


    To run your Hello World program, you need to be in the terminal. If you started
    Emacs by typing the command emacs into the terminal, you will need to close Emacs
    release the terminal to a command line. Alternatively, you can open a new terminal
    to start your program.


    Now that the terminal is opened to a command line, make sure that it is in the
    home directory. If Hello is listed, you need to first give the shell permission
    to run this script, and then give the command to run the script. At the prompt,
    enter


    ```

    chmod 755 Hello

    ./Hello

    ```


    In your terminal, you should see the words "Hello World!" If you do, then you
    just write your working program in Emacs!


    In the Emacs toolbar, select File | Visit New File. At first glance, nothing happens.
    If you look at the message area, you will see the cursor flashing; the Emacs message
    reads


    Find file: ~/


    Where the cursor is flashing, type Hello and press ENTER. A new buffer that is
    blank will open. In the new buffer, type the following code:


    ```

    #!/bin/bash

    #My First Script in Emacs

    echo "Hello World!"

    ```


    Each line is important to the program to run the script. In this case, you are
    using /bin/bash. Other languages be Perl, PHP, Python, or others. The second line
    is a command. Programmers use comments to let them or other programmers know what
    a line of code does. Comments are not seen by the program. The third line is the
    program itself.


    Now that you have entered all of the text, use your appropriate key binding to
    save your file. Hold down CTRL followed by x and then by s. Emacs will ask you,
    in the message area, "Save file /home/yourusername/Hello? (y, n, !, q, C-r d or
    C-h).\ All you need to do is press y, and you will write the file to your home
    directory to use.


    # Open a File to Edit


    Now that you have created a file with Emacs and saved that file, let''s open it
    back up and configure it to read something else. Your Emacs editor and select
    File | Open File. In the message area, type Hello since this is the name of the
    file we wish to open. Press ENTER and the code for the Hello program will be in
    the buffer, as seen in Figure 22-3.'
