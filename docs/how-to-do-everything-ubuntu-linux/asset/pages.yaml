  md: '# Chapter 7 Time to Upgrade: Installing New Hardware 89


    > Did You Know? You Need to Set Your Jumpers


    Hard drives and CD/DVD drives are bootable devices, so they have what are called
    jumpers attached to them. Make sure to consult the documentation that came with
    your new hardware get the correct jumper settings for your device. Not having
    them set properly could prevent your hardware from working properly.


    Once it''s in place, make sure to secure it to the case using the screws with
    the drive. Hard drives can also be slid into place and attached to the case. Make
    sure to screw in both sides. Securing only one side can cause noise from vibration.
    Once the device is mounted in the drive bay, you will need to plug in the power
    cable, the interface cable, and for CD/DVD drives, you will need to attach the
    audio cable if you want to play music or movies from this device. If it is used
    as a secondary device or as a recording device, you don''t need to have an audio
    cable connecting it to your soundcard.


    # Using the Card Slots


    Most hardware devices, like video cards, networking cards, and audio cards, use
    card slots towards the back of the computer as a home rather than the drive bays.
    If you look towards the back of the motherboard, you will see a few different
    ports, or slots where you can install these devices. These these slots are housed
    on the motherboard, usually no cables need to be connected to them.


    Like the drive bays, slots have something protecting them from the outside world
    called blanks. These blanks are usually made of metal and can be unscrewed from
    the case when they need to be removed. Figure 7-2 shows where the blanks are located.
    Some people believe that removing all of the blanks can help keep a computer cool
    since the heat has one more place to escape. Not true. The engineers who designed
    the case did so to maximize air flow. Removing blanks and not replacing them with
    a card will disrupt the airflow in the computer.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_110_0.png)


    FIGURE 7-2 Blanks'
