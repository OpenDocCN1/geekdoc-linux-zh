    # GNU, Linux, and the Free Software Movement


    In 1983, a computer programmer from MIT by the name of Richard M. Stallman grew
    skeptical of the commercial software packages that were selling for a few bucks
    at computer stores. Since this software was a commercial product, its source code
    was often protected, and the alteration, or hacking, of the code was prohibited.
    A robust product of the early days of computers when programmers shared software
    code with one another, Stallman encouraged the use of what was known as free software,
    to give'
  merge: -1
