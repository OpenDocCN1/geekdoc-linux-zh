  md: '# 146 Part III Open the Door to OpenOffice


    # Adding Animation to Text and Graphics


    Right above the Slide Transition menu in the Tasks menu is the Custom Animation
    menu on the arrow next to it. Before you get involved with the Custom Animation
    menu, which can be expanded by clicking on it, you need to first select what you
    want to animate in your slide.


    Now, when you first bring up this menu, your only option is to click the Add button.
    After you do this, you will have the option to animate the selected item''s Entrance
    to the slide, animate the item with an Emphasis, animate the item Exits the screen,
    or to set the Motion Path. With the transitions, you can also set the speed of
    the animation.


    Animations can create a bit of activity on a slide. Be cautious about animating
    too much on one slide as it can have a negative effect on how your audience views
    your presentation.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_167_0.png)


    # Export Your Presentation to Flash


    Like all other OpenOffice applications, Impress allows you to save presentations
    in a way that allows its Microsoft counterpart, PowerPoint, to open and edit the
    file. To save a presentation from the Menu bar, select File | Save As. With all
    other OpenOffice applications, you can select the file type to match Microsoft
    PowerPoint or keep it as an .odp file that is native to Impress.


    Nowadays, the Wide Wide Web is one of the most widely methods of displaying information.
    To accommodate this, Impress allows you to export your presentation to be displayed
    on the Web. To do this, select File | Export, and the Export window will open
    you. Here you have the option to export your slide show as an HTML document, which
    is written in the language of the Web, or as a PDF document that can be opened
    by anyone who uses the free Adobe Reader.


    Although there are other file types you can export your presentation to, none
    is as impressive as the ability to export to Adobe Flash. Adobe Flash is a program
    for creating rich Internet applications for web sites. From the Export option,
    can turn your presentation into a Flash movie that can run on any web site. This
    option is unique to Impress as Microsoft PowerPoint requires a third-party application
    to perform this.


    # Tips for Effective Presentations


    At times we have had to watch a presentation where the presenter simply read each
    slide word for word. This is probably one of the worst uses of such an excellent
    tool. Slide show presentations should provide content for the audience to refer
    to, not provide a script for the presenter.'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'Other important tips to keep in mind when designing a presentation:


    +   - Don''t have too many slides. Keep slides to about one per minute to avoid
    losing the audience.

    - Limit slide content to key phrases or ideas. Too much content on one slide can
    cause the audience to lose interest.

    - Flashy transitions can become distracting.

    - Excessive and cutes animations can hurt your credibility as a presenter.

    - Rehearse!'
  merge: -1
