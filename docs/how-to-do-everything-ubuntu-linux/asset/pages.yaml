    into these directories for storage. The first command you will use to move a file
    is the cp (copy) command. Copy does not move a file; it only creates a duplicate
    of the file. So if you wanted to copy an existing file named list and name it
    list2, you would enter


    cp list list2


    > If you are following along, you can create an empty file list by using the command
    touch list in the terminal. This creates a file named list in the current directory.'
