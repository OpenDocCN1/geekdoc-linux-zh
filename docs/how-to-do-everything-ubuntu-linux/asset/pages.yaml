- img_proc: true
  md: '# 224 Part IV Reach Out


    That''s not to say that there are no drawbacks to using Wine. Where Wine will
    run a few programs flawlessly, some programs may encounter small errors when running
    through Wine. Also, Wine will not run every program written for Microsoft Windows.
    While the list of programs that run with no issues is constantly growing, it is
    by no means complete. Currently, close to 10,000 applications are in the Wine
    database; these are some of the more popular ones:


    | Application | Description |

    | --- | --- |

    | Dreamweaver | Web authorizing tool |

    | Flash | Web animation tool |

    | Microsoft Office | Office suite |

    | Kayako Live Response | Help desk suite |

    | Timbuktu Pro | Computer remote control suite |

    | Counter-Strike | Popular game |

    | Madden NFL 08 | Popular game |

    | Inspiration | Visual thinking software used by schools |

    | ExamView | Software for creating tests |

    | Encarta | Encyclopedia |


    If you want to find more applications that run on Wine, visit their web site for
    a complete database of applications and notes on how well they run, http://appdb.winehq.org/appbrowse.php.


    # # Installing Wine


    Although Wine can be installed through the Add/Remove tool, you are going to install
    it through the terminal to get the latest and most stable package. Before you
    launch the terminal, make sure that you have enabled all of the repositories by
    going to System | Administration | Software Sources.


    Now launch the terminal by going to Applications | Accessories | Terminal. At
    the terminal window, type the following:


    ```

    sudo aptitude update

    ```


    This will update all of the repositories with the latest packages. Now type


    ```

    sudo aptitude install wine

    ```


    Once the Wine installation is complete, you need to configure it, so type


    ```

    winecfg

    ```


    Once the directory is created, and then updated, you should get a window that
    eer similar to something you would see in Microsoft Windows. This configuration
    folder is actually a hidden folder where a fake C: drive is located as well as
    registry files'
