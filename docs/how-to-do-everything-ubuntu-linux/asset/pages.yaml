  md: '# 11


    # # I''m Impressed


    HOW TO...


    +   * Start a new presentation

    * Add backgrounds to the slides

    * Insert graphics

    * Change transitions between slides

    * Animate text and graphics

    * Export to Flash

    * Use helpful tips


    Microsoft PowerPoint made electronic slide show presentations the method of choice
    for delivering information. Teachers use slide shows in the classroom daily. Sales
    professionals rely on slide shows to introduce their products to potential customers.
    Slide shows are used to introduce business plans, sales reports, and trainings.
    If you can think of a situation where you need to deliver information to an audience,
    a slide show can make your presentation that much better.


    As slide shows are so popular, the OpenOffice developers have included an application
    in their office suite for people to create visually stunning slide presentations.
    Impress is installed with Ubuntu the other applications we have looked at so far.
    You can open a new slide show by selecting Applications | Office | OpenOffice.org
    Presentation. Once you do this, you are presented immediately with the Presentation
    Wizard, as shown in Figure 11-1. Here can select whether you want to start working
    with Impress by using an empty presentation, a template, or a presentation that
    you have been working on.


    # # Starting a New Presentation


    When you open the Presentation Wizard, select Empty Presentation and then click
    Next. The next step in the wizard will ask you to select a design for your slides.
    The default slide is blank white, but you can select from the many different presentation'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 140 Part III Open the Door to OpenOffice


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_161_0.png)


    FIGURE 11-1 The Impress Presentation Wizard


    backgrounds by selecting Presentation Backgrounds or Presentations from the dropdown
    menu that appears. To the right of the slide designs is a Preview window so you
    can see what each background will look like as a slide.

    Once you have settled on the right background for your slides, you have the option
    of choosing what type of output medium your slide show will use (see Figure 11-2).
    If you are going to show your presentation on a large screen, leave the default.
    Otherwise, you can choose from one of the other options. Once you have done this,
