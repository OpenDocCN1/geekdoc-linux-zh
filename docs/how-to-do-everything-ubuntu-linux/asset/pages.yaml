- img_proc: true
  md: '# 298 Part VI Advanced Ubuntu


    # Did You Know? Emacs vs. Vi: The Pepsi, Dame/USC, Yankees/Red Sox, whatever


    People love rivalries. Coke/Notre Dame/USC, Yankees/Red Sox, whatever the topic,
    some take one side and take the other. Such is the case with Emacs and Vi. The
    editor wars between the two trace their roots to the flame started between the
    two in many of the programming and hacker forums found on the Internet. Fueling
    the fire was the creation of the Church of Emacs by Emacs creator Richard Stallman.
    The Emacs people stand by choice for its ability to be customized and its larger
    library of commands. The Vi supporters counter with the state that Vi is faster
    and more efficient when it comes to your CPU.


    > Richard Stallman wrote the first Emacs text editor in 1976 with Guy L. Steele.
    In 1984, he revisited the Emacs text editor and created GNU Emacs. GNU Emacs is
    one of the many text editors that make up the Emacs family.


    # Installing Emacs


    Since Emacs is the brainchild of Richard Stallman, and you can do much more with
    Emacs, we will be learning how to use this application. This is not a knock on
    the Ubuntu repositories.


    Emacs is not installed by Ubuntu; however, it is available to you from the Ubuntu
    repositories. To install Emacs, open the Terminal using the launcher you created
    in Chapter 21, or go to Applications | Accessories | Terminal. Once the terminal
    is opened, type the following command to install Emacs:


    ```

    sudo apt-get install emacs22

    ```


    After the package is installed, you can launch Emacs from the terminal by entering
    emacs at the prompt in your terminal and pressing ENTER. You can also launch Emacs
    by going to Applications | Accessories | Emacs 22(X 11). See Figure 22-1.


    # Important Emacs Basics


    Before we learn how to go through Emacs, let''s cover a few basic things that
    will help you understand this text editor better.


    # The Emacs Layout


    Looking at Figure 22-1, you see the Emacs window. At the top are the toolbars.
    The first consists of drop-down menus, and the second toolbar has a row of icons.'
  merge: -1
  pgno: 319
