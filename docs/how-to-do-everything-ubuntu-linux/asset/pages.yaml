- img_proc: true
  md: '# 300 Part VI Advanced Ubuntu


    # Point


    The point is the active section where editing takes place. If you place the cursor
    on the $b$ in “Ubuntu,” the point will be between the $U$ and the $b$.


    # Windows and Frames


    A window in Emacs is the area of the screen where your buffer is displayed; it
    is not what we traditionally consider a window to be. When you start up Emacs,
    you will have one window on the screen. To open a new window lie the lower one
    shown in Figure 22-2, you would go to File | Split Window. To get rid of a split
    window, select File | Remove Splits.


    In Emacs, *frames* are what we would normally call a window. If you go to File
    | New Frame, an Emacs frame will open.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_321_0.png)'
