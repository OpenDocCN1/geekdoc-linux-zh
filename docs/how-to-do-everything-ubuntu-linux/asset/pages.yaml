    - Check existing hardware


    Most of us buy computers out of the box. All we have to do is plug everything
    into the color-coordinated sockets and turn the power on. For a while, setting
    up a computer this way was limited to ones running Microsoft Windows and Apple
    Mac OS. The adventurous souls using GNU/Linux or Unix were required to actually
    install their operating system. Now that Dell and Acer have partnered with Ubuntu
    to provide their desktops and laptops with Ubuntu preinstalled, GNU/Linux users
    can join the out-of-the-box crowd as well.

    If you buy your computer as a preconfigured machine, one of two things is likely
    to happen. The first is that a piece of hardware could go bad. After years of
    use, the heat that is generated by computers can cause any number of hardware-related
    problems. Odds are, if you have been around computers long enough, you have seen
    hardware failure. The second instance is that, as a computer user gaining more
    and more skills, will feel the need to upgrade some of your old hardware. In instance,
    you need to be ready. This chapter will walk you through the basics of basically
    installing a hardware device; however, this can be a challenging task for some.


    # Selecting Appropriate Hardware


    Back in Chapter 5, we covered selecting peripheral devices to add to your computer.
    Like these peripheral devices, any hardware you are adding to your computer requires
    device drivers so that the software and the hardware get along.'
