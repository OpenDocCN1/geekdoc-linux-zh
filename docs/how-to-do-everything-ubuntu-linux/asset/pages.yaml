  md: '# Chapter 19 Play that Funky Music—Making the Most of Multimedia 255


    # Listening to Internet Radio


    While podcasts allow anyone anywhere to create their own audio content that can
    be distributed over the Internet, radio stations have made use of the content
    distribution available on the Internet as well. By streaming their shows, radio
    stations and individual radio shows can reach a worldwide audience instead of
    that is limited by the signal strength of the broadcast station.


    In the Library section on the left side of the Rhythmbox window, you can click
    the Radio button to bring up the program''s radio player. As with the Podcasts
    section, you can search for radio stations that provide you with the content you
    like. Likewise, you can choose to add a radio station by clicking New Internet
    Radio Station. Again, you will need to have the URL of the radio station you wish
    to add to Rhythmbox.


    # Installing a New Music Player


    Rhythmbox is the default music player for the Ubuntu operating system, but it
    is not the only music player. If you select Applications | Add/Remove to install
    new software, choose Sound & Video from the categories on the left. Under Show,
    make that All Applications is chosen. In the search box, enter Music Player and
    press ENTER. Now sort through the various music players to find one that suits
    you. You have quite a few to choose from, but if you are looking for a replacement
    for Rhythmbox, the best choices would be Banshee or Amarok. To install one or
    the other, or both, place a check in the box next to the music player you wish
    to install, and then click Apply Changes. Next, click Apply and then enter your
    password to install the software. As we have seen with other applications, the
    music player will be downloaded and installed for you to use.


    > If you install Banshee, the first time you run the application it will allow
    you to import your music from Rhythmbox.


    # Watching Videos from Ubuntu


    Long before YouTube videos and video podcasts were all the rage, people used their
    computers as a means to play DVDs and streaming video. Whether the computer was
    part of a home theater system or was a simple desktop system that contained a
    DVD player, the ability to play back video has become a standard in home computing.
    While sites like YouTube embed video into the web page, other types of video rely
    on a separate application to play back video for the user.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 256 Part V Having Fun with Ubuntu


    If you download a video or plan to watch a DVD, you need a separate video player.
    That is where Totem comes in. Totem is the video player that is installed as a
    default program with the Ubuntu operating system. To launch Totem, simply go to
    Applications | Sound & Video | Movie Player. See Figure 19-5.


    # Install Extra Codecs


    There will be times when you try to watch a video and you are informed that you
    do not have the right codec to play the file. Codecs are programs that compress
    and decompress media files so that they are portable. Movies on DVD require codecs
    to get the file to fit on the disc, and videos on the Internet require codecs
    to compress the files so they can be transferred quickly. Without the proper codec
    on your end, the file cannot be decompressed and thus be played.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_277_0.png)


    The repositories are full of codecs that you may need to install for your videos
    to play properly. These codecs can be installed through the Add/Remove Tools in
    Ubuntu. Just search for the term codec, and you will be presented with a long
    list of files. You can choose to install all of them at once or wait until you
    need them to play a file before installing.


    Totem may also volunteer to search for an acceptable codec for you to install
    for a particular video. Simply if Totem is so gracious as to do all of the work
    for you, let it it. Follow the instructions you are given, and the codecs will
    be installed.


    When installing codecs, you will be alerted to the fact that the use of codecs
    can be restricted. If you read the entire warning, you will see that using codecs
    in your country of residence is fine, so when asked, you can confidently click
    Confirm.'
  merge: -1
