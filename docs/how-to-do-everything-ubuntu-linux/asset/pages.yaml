    FIGURE 14-4 Providing DNS server addresses


    DNS takes the IP address of a computer or of a computer hosting a web site, and
    translates it into the common name. For example, if you type www.google.com into
    your address bar in Mozilla Firefox, a DNS server will know to send this request
    for a web page to 74.125.47.147 and vice versa. After changing the properties
    for the Ethernet device, you will be brought back to the Network Settings window.
    Here you can find the DNS tab to make any changes necessary (see Figure 14-4).


    # Setting the Host Name


    When you first install Ubuntu, you are asked to provide a host name for your computer.
    On each computer, each host name must be unique. Local DNS servers will know to
    associate a computer''s IP address with its host name. Should you wish to change
    the host name for a specific computer, you can do so from the Network Settings
    window (see Figure 14-5). Choosing the General tab allows you to bring up the
    Host Settings to change the Host Name. There is also a place where you can enter
    the network''s Domain Name. This can be left blank unless you are joining a client/server
    network.


    Of course, the easiest method for configuring your network settings is simply
    to leave the Enable Roaming Mode option selected.'
