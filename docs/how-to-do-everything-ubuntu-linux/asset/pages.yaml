  md: '# Disable Your Pop-Up Blocker


    Pop-up blockers are great tools, and they have saved the sanity of many web surfer
    by stopping the annoying ads that just start popping up on your screen when you
    are on the Web. Unfortunately, some legitimate web sites use pop-up technology.
    To circumvent the pop-up blocker on trusted sites, simply press CTRL. This will
    temporarily disable the pop-up blocker.


    The next tab, named Tabs, interestingly enough, allows you to set tabbed browsing
    options. This feature enables you to specify how your Firefox browser handles
    linked pages. With tabbed browsing, you can open links in a new window, or keep
    the default and have the page open in a new tab to organize in one window the
    pages you have open.


    The Content area is an important area to cover because it allows you to determine
    how your browser handles many of the things that make the Web an interactive place.
    Here, you can disable JavaScript and Java from running on your browser, change
    the colors of the fonts, change how your browser handles images, and control the
    Firefox pop-up blocker.


    Java and JavaScript are enabled by default. This allows for a certain amount of
    functionality with many web sites, but can pose a security risk since you are
    essentially relying on an outside source to run a program on your computer. While
    these are great tools, make sure you trust the site if you are running these scripts
    and applications.


    Probably the most important tabs in the Firefox Preferences are the Privacy and
    Security tabs. These allow you to set how your browser handles passwords, cookies,
    your browsing history, and other stored information. Cookies and your history
    can be useful to others because they let them know about your web use and store
    information like account numbers and passwords. Working from the Privacy tab (see
    Figure 15-5), you can tell Firefox when and how to clear this data, and you can
    perform a manual cleaning by clicking on the Clear Now button. In the Security
    tab (see Figure 15-6), you can change how your stored passwords are handled and
    even when you are alerted to possible malicious web sites.


    Cookies are small files that are downloaded onto your computer when you visit
    a certain web site. Cookies are generally used for shopping cart information,
    or to help you customize a web site to your liking. While cookies can help make
    your web surfing experience more productive and personal, they can also give people
    information about your web surfing habits.'
  merge: -1
