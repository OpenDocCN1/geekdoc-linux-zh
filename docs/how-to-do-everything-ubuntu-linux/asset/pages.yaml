  md: '# 30 Part I Meet Ubuntu


    > Did You Know?


    # What Is a Mounted Drive?


    In GNU/Linux, the term mounted drive describes a drive such as a hard drive, a
    CD-ROM, or a USB drive that has been made ready to use by the operating system.
    The term itself comes from the old days of computing when a computer operator
    had to physically mount a magnetic tape drive on a spindle before he or she could
    use it to read or write data.


    In earlier versions of GNU/Linux, mounting a drive required quite a bit of knowledge
    about the operating system and the hardware itself. Mounting a drive in Ubuntu
    is simple. Later chapters will show you how simply plugging in a USB drive will
    cause Ubuntu to mount the drive for you without any configuration.


    Some time to explore the Ubuntu desktop drive environment on your. After becoming
    more familiar with it, you will find that it is an extremely user-friendly environment
    to work in. Those who are switching over from another desktop environment will
    find that the transition is much easier than expected.


    You may remember that in addition to the GNOME desktop environment, Ubuntu has
    released a KDE desktop environment called Kubuntu and an Xfce desktop environment
    they have called Xubuntu. Figure 2-7 shows how visually similar the three desktop
    environments are. Ubuntu and Kubuntu can be obtained in the same way that the
    GNOME-based Ubuntu is. Although the Xfce environment was created for older computers
    that do not have the resources that modern computers provide, the differences
    between KDE and GNOME are relatively small and reflect more of a personal choice
    for the user rather than one based on computing power or use.


    ![](img/9d3cb4de39be7a8cb0681b91aae792bc_51_0.png)


    FIGURE 2-7 The Ubuntu (left) and Kubuntu (right) desktops'
  merge: -1
