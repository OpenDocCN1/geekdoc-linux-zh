  md: '# 14


    # # Share and Share Alike—Networking Ubuntu


    ### HOW TO...


    +   - Understand basic networking

    - Configure Ethernet settings

    - Learn to Samba

    - Perform basic troubleshooting


    Back in the early days of home computing, most households were lucky to have one
    computer for the entire family to share. As the cost of home computers has dropped
    significantly and their use has increased proportionately, most homes have multiple
    computers. Some computers may exist in multiple bedrooms to be used as a tool
    for learning; some are housed in the family room as a multimedia computer for
    movies, music, and games; some are hand-held devices like PDAs or iPhones.


    When these devices are connected to other devices, they are considered to be networked.
    Computers and other devices are networked so they can share resources or information.
    A resource can be just about anything. For instance, the Internet connection is
    a commonly shared resource between networked computers. Likewise, printers and
    files are resources that the multiple computers in a network frequently share.
    To understand how computers running Ubuntu can be networked, it is important to
    first look at some of the basics concerning networking.


    > Note Much of the networking that we cover is done at the installation of Ubuntu,
    unless you want to share files or printers with other computers, you may never
    have to touch the Networking interface of Ubuntu.'
  merge: -1
