  md: '# 1


    # # Ubunt-Who?


    # # Get to Know Ubuntu


    HOW TO...


    +   - Understand what Ubuntu is all about

    - Understand what “free” and open source software is

    - Understand the history of GNU/Linux

    - Understand the history of Uubuntu

    - Become a member of the Ubuntu community


    Before we dive into Ubuntu, let''s take a moment to find out what Ubuntu is all
    about. What do you know about Ubuntu, for starters? If you answered, "It has a
    funny name," then you are right on track. Ubuntu, which is pronounced "oo-BOON-too,"
    finds its origins in the South African Bantu language.


    # # The Ubuntu Philosophy


    Ubuntu means humanity toward others. However, simple explanations can sometimes
    leave people scratching their heads. To truly understand the philosophy of Ubuntu,
    it might be wise to take a quote from Nelson Mandela who describes the concept
    of Ubuntu:


    > A traveller through our country would stop at a village, and he didn''t have
    to ask for food or water. When he stops, the people give him food, entertain him.
    That is one aspect of Ubuntu but Ubuntu has various aspects. Ubuntu does not mean
    that people should not enrich themselves. The question, therefore, is: Are you
    going to do so in order to enable the community around you to improve?'
