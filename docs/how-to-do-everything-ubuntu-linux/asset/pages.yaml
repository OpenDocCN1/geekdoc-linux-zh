    > > Note For the formatting changes to take effect, the target cell(s) or text
    need to be selected. This is done by clicking the cell with the mouse. Text or
    multiple cells can be selected by holding down the left mouse button and dragging
    the pointer over whatever you want to select.


    # Calculating and Sorting Data


    As stated earlier, the true power of a spreadsheet application comes from its
    ability to perform mathematical calculations with the data you enter into the
    cells. Of course, the data has to be numerical to be calculated. If you plan on
    totaling or averaging'
  merge: -1
