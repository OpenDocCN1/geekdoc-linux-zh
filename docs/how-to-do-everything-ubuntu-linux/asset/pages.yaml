  md: '# 180 Part IV Reach Out


    When you open the eth0 Properties window, the options may be gray out. If this
    is the case, you need to uncheck the Enable Roaming Mode at the top of the window.
    Roaming mode is often enabled by default. This option allows Ubuntu to automatically
    connect to the current network using the network settings available. Under the
    Connections Settings you have four options: Configuration, IP Address, Subnet
    Mask, and Gateway Address.


    # Configuration


    The Configuration option gives you a drop-down menu where you can choose Static
    IP Address, which allows you to manually enter your network settings, Automatic
    Configuration (DHCP), which allows the network to assign the network settings
    automatically using a DHCP server; and Local Zeroconf Network (IPv4LL), which
    will configure the network settings automatically if no DHCP server is present
    on the network.


    # IP Address


    Here you would enter the IP address if you were statically assigning the network
    settings. Each address on the network would need to be unique to avoid conflicts.


    # Subnet Mask


    This is where the subnet portion of the IP address would be entered when you''re
    statically assigning a network setting. This needs to be the same on all computers.
    A specific formula is available for finding the Subnet Mask for a given IP address
    range. While this is beyond the scope of this book, many resources are available
    on the Internet that can help you with this.


    # Gateway Address


    The Gateway Address is the internal address for your router/modem. This would
    be the same on each computer on the network. If you are statically assigning an
    IP address, this would be entered here.


    # DNS


    If you are statically assigning an IP address, you will need to provide the DNS
    address for the server for your network. Large networks often have DNS servers
    on site; however, most home networks utilize the DNS addresses provided by their
    Internet service provider (ISP). If you do not have these addresses, you will
    need to contact your ISP for them.'
