    If you look back to Figure 16-1, you should notice a series of tabs at the bottom
    of your screen: Normal, HTML Tags, Source, Preview. Normal is what you would work
    in for WYSIWYG environment. If you click on HTML Tags, you can see all of the
    tags that your web page uses with the corresponding content. Clicking on the Source
    tab shows you all of the HTML for your web page. Preview will give you a glimpse
