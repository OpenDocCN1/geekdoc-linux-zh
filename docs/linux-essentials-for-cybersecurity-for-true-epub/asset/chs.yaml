  \ Linux 不支持的组件。\n\n\n\n\n**Julia**: 还有一点：考虑不要只有一种解决方案。多个发行版可能符合你的需求。你的目标是先排除那些不符合你需求的，然后尝试确定剩下的中最好的。祝你好运！\n\
  \n\n通常，安全不是组织使用虚拟机的主要原因（更好的硬件利用率通常是主要原因）。但是，如果你选择在环境中使用虚拟机，应该仔细考虑安全影响并将其纳入你的安全策略中。出于学习\
  \ Linux 的目的，我们将使用 Oracle VirtualBox。它是免费提供的，并在多个平台上运行良好，包括 Microsoft Windows（这最可能是你已经在自己的系统上安装的操作系统）。Oracle\
  \ VirtualBox 可以从 [`www.virtualbox.org`](https://www.virtualbox.org) 下载。安装非常简单：只需接受默认值或阅读安装文档（[`www.virtualbox.org/wiki/Downloads#manual`](https://www.virtualbox.org/wiki/Downloads#manual)）。\n\
