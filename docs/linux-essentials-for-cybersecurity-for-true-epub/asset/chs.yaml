  Jan 19 17:09:03 ubuntu ovpn-client[1407]: Options error: --cert fails with 'client.crt':\n\
  No such file or directory\nJan 19 17:09:03 ubuntu ovpn-client[1407]: Options error:\
  \ --key fails with 'client.key': No\nsuch file or directory\nJan 19 17:09:03 ubuntu\
