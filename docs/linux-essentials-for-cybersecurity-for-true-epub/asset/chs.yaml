  \n**16. 你随时可以问我！**\n\n**17. 知道去哪里寻找帮助很重要。**\n\n**18. 在本章中，你学习了在 Linux 中编辑文件。**\n\
  \n**19. 你学习了如何使用编辑器来查看文档。**\n\n**20. 你学习了如何使用 man 页面和 info 页面。**\n\n**21. 你还学习了如何使用初始化文件，如\
  \ `/etc/profile` 和 `/.bashrc`。**\n\n**22. 你还学习了使用 `vi` 编辑器编辑文件。**\n\n# 第 4 章：编辑文件\n\
  \n你可能会疑惑为什么有一整章是关于编辑文件的。Linux 系统是由许多文件配置的。在本章中，你学习了如何使用编辑器。阅读本章并完成练习后，你将能够：\n\n\
  *   使用 `vi` 编辑器编辑文本\n*   熟悉 `Emacs`、`joe` 和 `gedit` 等\n\n## vi 编辑器\n\n考虑 Unix 的早期时代，它是\
  \ Linux 的前身：用户坐在键盘前，准备编辑一个正在运行程序。她盯着打印机（是的，打印机，不是显示器）考虑执行哪些命令。显示器在 70 年代非常稀少，即使用户有一个，它主要设计用于显示执行代码的输出，而不是交互式地编辑文件。\n\
  \n相反，用户会使用一种简单的命令的编辑器，如 `ed` 编辑器。通过这种编辑器，用户可以执行诸如列出文件内容（即打印文件）、修改文件的特定字符或保存文件内容的操作。然而，这一切在今天看来非常繁琐。用户看不到自己正在编辑的内容，而只是假设命令成功。\n\
  \n当显示器变得普遍时，`ed` 编辑器看起来是编辑文本文件的笨拙方法。在 70 年代中期，一种名为 `vi`（visual 的缩写）的替代编辑器被引入 Unix。它是对\
  \ `ed` 编辑器的极大改进，因为你可以看到你的文档并在编辑时进行移动。\n\n`vi` 编辑器现在是 Linux 和 Unix 环境的标准文本编辑器。尽管它可能没有其他编辑器那么用，但它有几个重要的优点：\n\
  \n*   `vi` 编辑器（或 `vim`，`vi` 编辑器的改进版本）适用于每个 Linux 发行版。这意味着如果你知道如何用 `vi` 编辑器编辑文件，无论你在使用哪个发行版，你都可以编辑文件。\n\
  *   因为 `vi` 编辑器是一个纯命令行编辑器，它不需要图形用户界面（GUI）。这很重要，因为许多 Linux 服务器没有安装 GUI，这意味着你无法使用基于\
  \ GUI 的文本编辑器。\n\n\n\n\n\n*   一旦你理解了 `vi`，你会发现它是一个高效的编辑器，与大多数其他编辑器相比，它允许你快速编辑文件。这是因为所有命令都是短命令且基于键盘的，因此你不需要浪费时间离开键盘去使用鼠标。\n\
  \n*   `vi` 编辑器非常稳定，在过去的 40 多年里没有发生多大变化。你可以找一位 1970 年代使用 `vi` 编辑器的用户进行低温冷冻，在今天将她解冻后，她仍然可以使用现代的\
  \ `vi` 编辑器编辑文件。虽然自 1970 年代以来 `vi` 编辑器确实增加了一些功能，但 `vi` 的核心功能没有改变，这让你（或那位 1970 年代的低温冷冻用户）在整个职业生涯中都能使用它，而无需“重新学习”新版本的用法。\n\
  \n要使用 `vi` 编辑器编辑新文件，你只需要输入不带参数的命令或输入 `vi filename`。\n\n## 什么是 vim？\n\n`vim` 编辑器于\
  \ 1991 年发布，作为 `vi` 编辑器的克隆版本。`vim` 编辑器具有与 `vi` 相同的的基础功能，但它带有若干额外功能。其中某些功能对软件开发人员可能非常有用。\n\
  \n你的发行版可能只有 `vi` 编辑器。许多发行版同时包含 `vi` 和 `vim` 编辑器。在某些发行版上，`vi` 命令实际上是指向 `vim` 编辑器的链接。\n\
  \n有一种简单的方法可以判断你正在使用 `vi` 还是 `vim` 编辑器。请参见图 4-1 中的 Text Support™ 对话以了解更多。\n\n![Image](img/04fig01.jpg)\n\
  \n**图 4-1** Text Support™：哪种模式？\n\n### 注意事项\n\n另有说明，本章所示命令在 `vi` 和 `vim` 编辑器中均有效。任何仅在\
  \ `vim` 中有效的命令将会被标记。\n\n### 安全亮点\n\n如果你在编辑文件时出错，直接修改系统文件可能会损坏操作系统。因此，某些实用程序被设计以更安全的方式编辑这些文件。\n\
  \n例如，在第 6 章“管理组账户”和第 7 章“管理用户账户”中，你将学习用户和组账户。这些账户的信息存储在各种基于文本的系统文件（如 `/etc/passwd`）中，可以直接编辑。但是，使用\
  \ `useradd` 和 `usermod` 命令修改用户账户，或使用 `groupadd` 和 `groupmod` 修改组账户更为安全。这些工具在修改文件之前会执行错误检查操作，并且还会备份文件的之前的版本。\n\
  \n## 核心 vi 命令\n\n成为 `vi` 专家需要大量的练习，但要有效地编辑文件，只需要掌握大量 `vi` 命令中的子集。\n\n有一个大文件供编辑会很有帮助。所有的\
  \ Linux 发行版都应该带有 `/etc/services` 文件，该文件通常有数千行。你可以先将此文件复制到你的主目录，然后使用 `vi` 命令编辑副本：\n\
  \n点击此处查看代码图像\n\n```\n[student@onecoursesource.com ~]$ cp /etc/services .\n[student@onecoursesource.com\
  \ ~]$ vi services\n```\n\n## 使用基础 vi 模式\n\n由于 `vi` 设计为仅使用键盘，这带来了一个挑战，因为有时键盘上的特定按键应该执行命令，而另一些按键应该代表要插入文档的字符。为了允许按键执行不同的任务，`vi`\
  \ 有三种运行模式：\n\n*   **命令模式 (Command mode)**：这是默认模式。当你打开 `vi` 时，将处于命令模式。在此模式下，你可以执行移动屏幕、删除文本和粘贴文本的命令。\n\
  *   **插入模式 (Insert mode)**：在插入模式下，输入的任何按键都会作为新文本出现在文档中。当你完成添加新文本后，可以按下 Escape 键返回默认模式（命令模式）。有关如何进入插入模式的详情，请参见本章的“进入插入模式”章节。\n\
  *   **末一行模式 (Last line mode)**：末一行模式也称为 `ex mode`，允许你执行更复杂的操作，例如将文档保存为不同的文件名。要从命令模式进入末一行模式，请按\
  \ `:` 键。在你输入命令并按回车后，命令将执行，你通常会返回命令模式。在某些情况下，你可能需要按 Escape 键返回命令模式。后续章节将更详细探讨探讨模式。\n\
  \n### 注意事项\n\n你不能从插入模式移动到末一行模式，反之亦然。要进入插入模式或末一行模式，你必须先处于命令模式。按下 Escape 键即可进入命令模式。\n\
  \n请参见图 4-2 查看三种 vi 模式的图形化表示。\n\n![Image](img/04fig02.jpg)\n\n**图 4-2** vi 的三种模式\n\
  \n## 进入插入模式\n\n当你启动 `vi` 编辑器时，将处于命令模式。这种模式设计用于执行命令，如导航文本、复制文本和删除文本。\n\n在插入模式下，输入的任何按键都是新文本。要在文档中插入新文本，可以使用以下命令：\n\
  \n*   `i`：在光标前插入文本。\n*   `a`：在光标后插入文本。\n*   `I`：在行首插入文本。\n*   `A`：在行尾插入文本。\n*  \
  \ `o`：在光标下方打开新行。\n*   `O`：在光标上方打开新行。\n\n请参见图 4-3 查看这些 vi 命令的工作方式。\n\n![Image](img/04fig03.jpg)\n\
  \n**图 4-3** 进入模式的 vi 命令\n\n如果你在标准 vi 中工作，默认情况下底部不会显示 \"-- INSERT --”。要在标准 vi 中启用此功能，请命令模式下输入以下命令：\n\
  \n```\nset showmode\n```\n\n当你想要返回命令模式时，只需按下 Escape 键。这在文档中通常表示为 `<ESC>`。如果你返回命令模式，底部的\
  \ \"-- INSERT --”将会消失。\n\n### 移动命令\n\n在命令模式下，你可以可以使用按键在文档中移动光标。常用方法是将光标向左或向右移动一个字符，或者向上向下移动一行。可以使用键盘上的箭头键，也可以使用\
  \ `h`、`j`、`k` 和 `l` 键实现，如图 4-4 所示。\n\n![Image](img/04fig04.jpg)\n\n**图 4-4** 移动命令\n\
  \n还有许多额外的移动命令，包括：\n\n*   `$`：移动到当前行的最后一列。\n*   `0`：移动到当前行的第一列。\n*   `w`：移动到下一个单词或标点符号的开头。\n\
  *   `W`：跳过下一个空格。\n*   `b`：移动到上一个标点符号的开头。\n*   `B`：移动到上一个单词的开头（忽略标点）。\n*   `e`：移动到下一个单词或标点符号的结尾。\n\
  *   `E`：移动到下一个单词的结尾（忽略标点）。\n*   `)`：前进一个句子。\n*   `(`：后退一个句子。\n*   `}`：前进一个段落。\n\
  *   `{`：后退一个段落。\n*   `H`：移动到屏幕顶部。\n\n\n\n\n\n| **M** | 移动到屏幕中间。 |\n| **L** | 移动到屏幕底部。\
  \ |\n| **[[** | 移动到文档开头。 |\n| **]]** | 移动到文档结尾。 |\n| **G** | 移动到文档结尾（与 ]]相同）。 |\n\
  | **xG** | 移动到第 *x* 行（你也可以使用 `:*x* 技巧）。 |\n\n注意，这些只是移动命令的一部分。花些时间尝试这些移动命令，然后根据你认为在编辑时最有用的命令创建一个“命令备查表（cheat\
  \ sheet）”。你可以将其制作成可以添加更多命令的文本文件，并将其保存在你的 Linux 系统中，随着你学习更多有用的命令来不断完善它。你也可以访问“Vi\
  \ 爱好者”页面 ([`thomer.com/vi/vi.html`](http://thomer.com/vi/vi.html))，并从“Vi pages/manuals/tutorials”部分下载其中一张“参考卡片”。\n\
  \n### 重复修符 (Repeater Modifiers)\n\n在上一节中，你发现可以在命令模式下输入一个数字后跟 `G` 来跳转到文档中的特定行。例如，命令\
  \ `7G` 将带你到文档的第 7 行。\n\n在命令前放置数字充当修符。修饰符可以用于许多不同的命令模式命令。以下是一些示例：\n\n| **3w** | 向前移动三个单词。\
  \ |\n| **5i** | 插入五次。 |\n| **4(** | 向后移动三个段落。 |\n\n你也可以对删除、复制和粘贴等命令使用重复修符。通常情况下，如果从逻辑上你想要执行多次的某个命令模式命令，那么重复修符应该对该命令有效。\n\
  \n### 你在尝试这些命令吗？\n\n回想一下，我们建议你将 `/etc/services` 文件复制到家目录，以便你可以尝试这些命令。记住，如果你卡在插入模式（insert\
  \ mode）中，只需按下 `<ESC>` 键返回命令模式。\n\n如果你最后得到了一个无法读取的文件，也不要担心。这只是一个练习文件，你即将学习如何纠正错误。\n\
  \n### 撤销 (Undoing)\n\n你可以通过在命令模式下输入 `u` 字符来撤销对文档所做的任何更改。在标准的 vi 编辑器中，你只能撤销一次操作；事实上，`u`\
  \ 命令充当了撤销/重做的键。\n\n如果你在使用 vim 编辑器，你可以撤销多次操作。只需一直按 `u` 字符，旧的修改会被“撤销”。你可以使用 `^r` 命令（Ctrl\
  \ 键加 r 键）执行“重做”，即撤销由撤销命令执行的更改。\n\n### 对话学习™——快速清除错误\n\n**Gary**: 嗨，Julia。我在这里被卡住了。我想可能在进入\
  \ vi 的插入模式之前输入了一个数字，当我按下 Escape 键返回命令模式时，文档中出现了大量的重复文本！\n\n**Julia**: 好的，这里有几种解决方案。如果你在命令模式下按下\
  \ `u` 字符，它将撤销上一次操作。\n\n**Gary**: 但这样我就丢失了所有的工作了。\n\n**Julia**: 对，我猜你不想重新输入一遍所有的？\n\
  \n**Gary**: 没门！\n\n**Julia**: 好的，那意味着第二个选项也不行。\n\n**Gary**: 第二个选项是什么？\n\n**Julia**:\
  \ 不保存任何内容退出。让我们尝试另一种方法。滚动你的文档。如果有任何重复信息请告诉我。\n\n**Gary**: 好的……看看……是的！看起来那五页左右的内容一直在反复重复。\n\
  \n**Julia**: 好的，你能到达第一组五页结束的地方吗？然后移动到第二组五页的第一行。\n\n**Gary**: 好的，我到了。\n\n**Julia**:\
  \ 太棒了，现在要删除从当前行到文档末尾的内容，输入 `G$`。\n\n**Gary**: 噢，是的，这起作用了！\n\n**Julia**: 太极了。把另外两个技术留着，因为它们在其他时候可能会派上用场。\n\
  \n**Gary**: 再次感谢，Julia。你帮我节省了大量工作。\n\n**Julia**: 不客气，Gary。\n\n假设自打开文档以来做了大量的更改，你想放弃所有更改。在这种情况下，你可能想不保存关闭文档然后重新打开。要不保存更改关闭文档，输入命令\
  \ `:q!`（冒号键、q 键和 `!` 键）。关于此命令以及退出 vi 编辑器的其他方法，将在本章后面的部分介绍。\n\n### 复制、删除和粘贴\n\n以下是常用复制命令的总结。请记住，这些命令应该在命令模式下执行：\n\
  \n| **yw** | 复制单词；实际上是从单词中的当前字符复制到单词末尾（包括标点符号）以及单词后的空格。例如，如果你的光标在“this is fun”中的\
  \ *h* 上，`cw` 命令会将“his”复制到内存中。 |\n| **yy** | 复制当前行。 |\n| **y$** | 从当前字符复制到行尾。 |\n\
  | **yG** | 将当前行复制到文档末尾。 |\n\n你可能在想，为什么要用 `y` 字符呢？这是因为将文本复制到内存缓冲区的过程以前被称为“yanking（抓取）”。\n\
  \n以下是常用删除命令的总结。请记住，这些命令应该在命令模式下执行。\n\n| **dw** | 删除单词；实际上是从单词中的当前字符删除到单词末尾（包括标点符号）以及单词后的空格。例如，如果你的光标在“this\
  \ is fun”中的 *h* 上，`dw` 命令将删除“his”，结果是“tis fun”。 |\n| **dd** | 删除当前行。 |\n| **d$**\
  \ | 从当前字符删除到行尾。 |\n| **dG** | 从当前行删除到文档结尾。 |\n| **x** | 删除光标当前所在的字符（功能类似于 Delete\
  \ 键）。 |\n| **X** | 删除光标当前字符的前一个字符（功能类似于 Backspace 键）。 |\n\n粘贴命令可能会复杂一些，因为它们的工作方式取决于你粘贴的内容。例如，假设你已经将一个单词复制到了缓冲区。在这种情况下，下面的描述说明了粘贴命令的工作原理：\n\
  \n| **p** | 在光标前粘贴缓冲区内容。 |\n| **P** | 在光标后粘贴缓冲区内容。 |\n\n如果你将整行（或多行）复制到缓冲区，行为会有所不同：\n\
  \n| **p** | 在光标上方行粘贴缓冲区内容。 |\n| **P** | 在光标下方行粘贴缓冲区内容。 |\n\n如果你想知道命令在哪里，请查看图 4-5\
  \ 中的 Text Support™ 对话（ch04.xhtml_fig4_5）。\n\n![Image](img/04fig05.jpg)\n\n**图 4-5**\
  \ *在 vi 中剪切文本*\n\n### 查找文本\n\n对于使用 vi 编辑器的软件开发者来说，查找文本是一项关键功能，因为执行代码时出现的错误信息通常包含发生位置的代码片段。你可以使用以下方法查找文本：\n\
  \n*   在命令模式下，输入 `/`（斜杠）键，你会在终端窗口左下角看到这个字符。现在输入你想查找的内容，然后按`<ENTER>`。vi 编辑器将在文档中**向前**查找你请求的文本。\n\
  \n*   在命令模式下，输入 `?` 键，你会在终端窗口左下角看到这个字符。现在输入你想查找的内容，然后按`<ENTER>`。vi 编辑器将在文档中**向后**查找你请求的文本。\n\
  \n假设你的没有没有你想寻找的具体匹配项。你可以使用 `n` 命令查找下一个匹配项。`n` 命令在最后一次搜索以 `/` 开始时将向前查找，在最后一次搜索以 `?`\
  \ 开始时将向后查找。\n\n\n\n\n如果你搜索了“/one”，并发现需要多次按下 `n` 键才能找到你想要的内容。在疯狂反复输入 `n` 之后，你发现自己跳过了想要的匹配项。若要反转当前的搜索，请使用字符\
  \ `N`。当你正在向后搜索时，`N` 将反转方向并在文档向后搜索。当你正在向后搜索时，`N` 将反转方向并在文档向前搜索。\n\n## 区分大小写\n\n与你在\
  \ Linux 中使用的几乎所有东西一样，搜索功能是区分大小写的。换句话说，搜索“/the”不会匹配以下行：\n\nThe end is near.\n\n##\
  \ 查找与替换\n\n要搜索文本并替换为其他文本，请使用以下格式：\n\n```\n:x,ys/pattern/replace/\n```\n\n`x` 和 `y`\
  \ 的值代表你将执行搜索的文档行。例如，要对文档的前十行进行查找和替换，请使用以下语法：\n\n```\n:1,10s/I/we/\n```\n\n你可以使用\
  \ `$` 字符表示文档的最后一行：\n\n```\n:300,$s/I/we/\n```\n\n所以，要对整个文档进行替换，请使用以下命令：\n\n```\n\
  :1,$s/I/we/\n```\n\n默认情况下，每行只有第一个匹配项会被替换。假设你正在搜索并替换的行如下所示：\n\n点击此处查看代码图像\n\n```\n\
  The dog ate the dog food from the dog bowl\n```\n\n如果在上一行执行了命令 `:s/dog/cat/`，那么结果将如下：\n\
  \n点击此处查看代码图像\n\n```\nThe cat ate the dog food from the dog bowl\n```\n\n要替换行中的所有出现项，请在搜索命令末尾添加\
  \ `g`：\n\n```\n:s/dog/cat/g\n```\n\n你可以将 `g` 理解为“获取全部 (get them all)”。它实际上代表“全局\
  \ (global)”。\n\n搜索和替换是区分大小写的。假设你正在搜索和替换的行如下：\n\n点击此处查看代码图像\n\n```\nThe Dog ate the\
  \ dog food from the dog bowl\n```\n\n如果在上一行执行了命令 `:s/dog/cat/`，那么结果将如下：\n\n点击此处查看代码图像\n\
  \n```\nThe Dog ate the cat food from the dog bowl\n```\n\n结果匹配了第二个“dog”，因为第一个带有大写字母\
  \ `D`。若要执行不区分大小写的查找-替换操作，请在搜索命令末尾添加 `i`：\n\n```\n:s/dog/cat/i\n```\n\n## 保存并退出\n\
  \n在上一节中，你输入了冒号（`:`）字符来执行查找-替换操作。复杂的命令在最后一行模式下执行，这种模式也称为 *ex 模式*，以 ex 编辑器命名。 `:`\
  \ 字符将你带到屏幕底部，命令将在你输入时显示在那里。\n\n在此模式下你可以执行的另一个操作是“保存并退出”你的文档：\n\n```\n:wq\n```\n\n\
  ### 注意\n\n你必须在退出之前保存，因此你不能执行命令 `:qw`，因为那将尝试先后再保存。\n\n### 安全高亮\n\n通常，以 root 身份登录的用户会使用\
  \ `:wq!` 保存并退出。当直接修改 root 用户当前没有权限更改的系统文件时，这有时是必要的。`:wq` 后的 `!` 字符将强制更改写入文件，实际上是将权限临时更改为可写，保存更改，然后将权限还原为原始（更多关于权限的详细信息，请参见\
  \ 第 9 章 中的“文件权限”）。\n\n遗憾的是，`:wq!` 成了许多系统管理员的坏习惯。通过将其作为你的默认保存方法，你可能会意外修改关键的系统文件，可能修改了导致系统无法正常运行或使系统变得脆弱的文件。避免养成这个坏习惯，默认使用\
  \ `:wq`，仅在需要时才使用 `:wq!`——而且要在仔细考虑之后再使用。\n\n你可能只想保存但继续工作：\n\n```\n:w\n```\n\n你也可以将文件保存到不同的文档，但此操作有一个小“陷阱”。假设你想将对\
  \ `services` 文件所做的更改保存到名为 `myservices` 的文件中。执行以下命令：\n\n```\n:s myservices\n```\n\
  \n更改将被放入此文件；但默认情况下，任何后续更改将保存到原始的 `services` 文件中。大多数现代编辑器会将默认保存文档切换为最后保存的文档，但 vi\
  \ 并不会这样做。要查看当前文档，请输入 `^G` (Control+g)。\n\n所以，如果你想编辑新文件，你应该退出 vi 编辑器并打开新文件。\n\n如果你对文件进行了更改并尝试在不保存的情况下退出（`:q`），你将收到如下所示的错误消息：\n\
  \n点击此处查看代码图像\n\n```\nE37: No write since last edit\n```\n\n若要强制退出，请执行：\n\n```\n\
  :q!\n```\n\n## 扩展你的 vi 知识\n\n尽管我们介绍了许多命令，但这仅是皮毛。vi 编辑器是一个强大的工具。此外，它提供了一些高级功能，如语法高亮、创建宏、同时编辑多个文件等。\n\
  \nvim 有内置文档，但你必须安装特定的软件包才能访问。安装软件将在第 26 章](#ch06.xhtml_ch26)“红帽系软件包管理”和第 27 章](#ch27.xhtml_ch27)“Debian\
  \ 系软件包管理”中详细介绍。现在，只需确保你以 root 用户登录并执行以下命令：\n\n- 在 Red Hat、Fedora 和 CentOS 分发版上，执行\
  \ `yum install vim-enhanced`。\n- 在 Debian、Ubuntu 和 Mint 上，执行 `apt-get install vim-enhanced`。###\
  \ 注意\n\n在 Ubuntu 和 Mint 上，你可以登录安装时创建的普通用户并运行 `sudo apt-get install vim-enhanced`\
  \ 命令。\n\n如果安装了 vim-enhanced 软件包，你可以在 vim 编辑器中执行 `:help` 命令并看到帮助文档。示例见图 4-6](#ch04.xhtml_fig4_6)。\n\
  \n![Image](img/04fig6.jpg)\n\n**vim 输出**\n\n使用方向键（或 h, j, k, l）滚动文档。在大约第 20 行，你会看到一些子主题，如图\
  \ 4-7 所示。\n\n![Image](img/04fig7.jpg)\n\n**vim 主题**\n\n这些主题中的每一个（如 `quickref` 或\
  \ `usr_01.txt`）都是独立的帮助主题。要查看这些主题，首先通过 `:q` 命令退出当前的帮助文档。然后输入如下命令，将 *topic* 替换你想查看的主题全名：\n\
  \n```\n:help topic\n```\n\n例如，要查看关于“使用语法高亮”的帮助，输入以下命令：\n\n```\n:help usr_06.txt\n\
  ```\n\n## 其他编辑器\n\nLinux 中有大量的编辑器。本节的重点是让你意识到这些编辑器，而不是教你如何使用每一种。请注意，你的分发版可能没有安装所有这些编辑器。你可能需要安装额外的软件包以获得额外的编辑器。\n\
  \n### Emacs\n\n\n\n\n与 vi 编辑器一样，Emacs 编辑器也开发于 20 世纪 70 年代。喜欢 Emacs 的 Linux 用户会对易用性和自定义能力赞誉有加。如果你在基于\
  \ GUI 的终端启动 Emacs（只需运行 `emacs` 命令），应该打开一个 GUI 版本的程序，如图图 4-8 所示。如你所见，GUI 版本除了可以通过键盘执行的命令外，还拥有菜单。\n\
  \n![Image](img/04fig08.jpg)\n\n**图 4-8** *基于 GUI 的 Emacs*\n\n如果你在仅命令行的环境中运行 Emacs\
  \ 编辑器，编辑器看起来将像图 4-9 所示。\n\n![Image](img/04fig09.jpg)\n\n**图 4-9** *基于文本的 Emacs*\n\
  \n## GUI vim？\n\n如果你安装了 `vim-X11` 软件包，你就可以使用 GUI 版本的 vim 编辑器。只需执行 `gvim` 或 `vim\
  \ -g` 即可。\n\n## gedit 和 kwrite\n\n这些编辑器是相当标准的 GUI 编辑器。如果你习惯 Microsoft Windows 上的记事本，那么你会发现这些编辑器非常易用（尽管功能有些有限）。\n\
  \n`gedit` 编辑器通常安装在默认使用 GNOME 桌面的发行版中。`kwrite`（或 `KATE`）编辑器通常安装在默认使用 KDE 桌面的发行版中。然而，你可以轻松地在使用\
  \ KDE 桌面的系统上安装 `gedit` 或在 GNOME 桌面系统上安装 `kwrite`。\n\n## nano 和 joe\n\nvi 和 Emacs\
  \ 编辑器非常强大。在某些情况下，你可能会发现自己想在命令行环境中使用简单的编辑器。`gedit` 和 `kwrite` 编辑器仅在 GUI 环境下工作。\n\n\
  `nano` 和 `joe` 编辑器为编辑文本文件提供了简单的界面。它们是仅命令命令行编辑器，因此不需要 GUI。参见图 4-10 的 `nano` 编辑器示例。\n\
  \n![Image](img/04fig10.jpg)\n\n**图 4-10** *nano 编辑器*\n\n## lime 和 bluefish\n\n`lime`\
  \ 和 `bluefish` 编辑器通过提供真正为帮助开发者创建代码设计的工具和功能，将编辑文本文件的过程提升到了层次。这些工具提供了如语法高亮、插入代码（通过点击按钮）和自动格式化（如自动缩进代码）等功能。\n\
  \n如果你打算在 Linux 上从事编码工作，你应该开始探索这些工具（或其他许多类似的编辑工具）。参见图 4-11 的 `bluefish` 编辑器示例。\n\n\
  ![Image](img/04fig11.jpg)\n\n**图 4-11** *bluefish 编辑器*\n\n### 总结\n\n由于 Linux 系统中存在大量的文本文件，知道如何编辑这些文件非常重要。在本章中，你探索了多种编辑文本文件的技术，包括\
  \ vi 编辑器、Emacs、`gedit` 和 `kwrite`。\n\n## 关键术语\n\nvi 模式\n\n## 复习题\n\n**1.** _____\
  \ 模式允许你在 vi 编辑器中工作时进入复杂操作。\n\n**2.** 下列命令模式命令中没有没有进入插入模式？\n\n1. `a`\n2. `e`\n3.\
  \ `i`\n4. `0`\n\n**3.** 要使用重复修饰符，在 vi 命令之前输入一个 _____。\n\n1. 字母\n2. 空格\n3. 数字\n4.\
  \ 特殊字符\n\n**4.** _____ 命令会在 vi 编辑器中复制一整行。\n\n**5.** _____ 命令允许你在使用 vi 编辑器时从当前位置向后搜索文本。\n\
  \n# 第 5 章：当事情出现问题时\n\n首先，是坏消息：某些事情将会出错。命令会失败，程序会崩溃，配置将会有错误。\n\n现在是好消息：有技术可以处理这些问题。故障排除不仅仅是“盲目摸索”。当问题出现时，你应该采取具体的步骤来确定问题并识别最佳解决方案。\n\
  \n在本章中，你将学习当事情运行得不符合预期时应该遵循的技术和实践。你还发现了你作为管理员可以使用的技术，以告知用户系统问题。\n\n在阅读本章并完成练习后，你将能够：\n\
  \n- 正确地使用故障排除技能来诊断系统问题\n- 在用户登录期间或用户登录系统期间通知用户系统问题\n\n### 故障排除的科学\n\n尽管故障排除看起来像某种只有遵守保密协议的人才知道的神秘艺术，但对于那些经常成功解决问题的人来说，它更是一门科学。这门科学不仅限于\
  \ Linux，因为你可以将这里提供的方法应用于其他操作系统和其他信息技术领域的问题，也可以应用于你生活中面临的问题。\n\n首先，这里是你排除故障时应该采取的通用步骤：\n\
  \n1. 收集与问题相关的所有信息。这是一个重要的步骤，因为我们倾向于在不研究的情况下解决问题。\n2. 确定最可能的原因。再次，避免跳到结论；对可能的原因进行合理的推测。\n\
  3. 在采取行动之前，记录你计划采取的操作。这可能是最被忽视的步骤，但它是至关重要的。这部分内容也可以包括制作文件的备份副本。\n4. **仅**执行记录的操作来解决问题。注意对“仅”一词的强调。不要在解决问题过程中决定偏离主题。如果你决定计划无效，请回溯（撤销到该点的步骤）并制定新的计划。\n\
  5. 确定问题是否已正确解决。这个步骤似乎没有必要提到，但你会发现经常认为自己解决了问题，结果在以后某时候发现并不是。当你为他人解决问题时这种情况常见；例如如果你是系统管理员并为另一个用户解决问题。\n\
  6. 如果问题没有正确解决，使用第 3 步的记录回到开始时的状态。然后返回第 2 步并再次执行步骤 2-5。\n7. 如果问题已解决，确定是否由于你采取的操作产生了额外问题。这是一个常见的被忽视的步骤。例如，你可能修改了用户账户以提供对目录的特定访问，但这种修改会导致用户无法访问之前拥有的目录。你显然无法检查所有内容，但在进入下一步之前思考“这个解决方案可能会产生什么问题？”\n\
  8. 存储你创建的文档（包括没有解决问题的操作），使用以后易于检索的方法。我们发现某些问题会反复出现，而我们的大脑并不擅长记忆以前费辛苦发现的解决方案。为你或你的组织创建一个故障排除日志或手册，以便将来解决问题更加容易。此外，记住，你的解决方案可能会引起更多问题，这些问题可能在未来的某时刻才会显现。\n\
  \n\n\n\n\n9. 考虑你可以采取哪些措施来防止此类问题在未来发生。采取主动可以为你节省时间、提高生产力，并保护你（以及他人）避免将来出现大麻烦。\n\n\
  ### 步骤 1：收集信息\n\n为了探索如何收集信息，请考虑以下场景。假设你尝试像第 2 章中“在命令行中工作”那样使用 `cp` 命令复制文件。\n\n点击此处查看代码图像\n\
  \n```\nstudent@onecoursesource:~$ cp /etc/hosts\ncp: missing destination file operand\
  \ after '/etc/hosts'\nTry 'cp --help' for more information.\n```\n\n显然，上一个命令失败了，你可能很快就能确定原因。然而这演示了在遇到问题时如何收集信息。一种技术是阅读执行命令后出现的实际信息：`cp:\
  \ missing destination file operand after '/etc/hosts'`。\n\n你也可以尝试获取更多信息的建议：\n\n\
  点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ cp --help\nUsage: cp [OPTION]... [-T]\
  \ SOURCE DEST\n  or:  cp [OPTION]... SOURCE... DIRECTORY\n  or:  cp [OPTION]...\
  \ -t DIRECTORY SOURCE...\nCopy SOURCE to DEST, or multiple SOURCE(s) to DIRECTORY.\n\
  \nMandatory arguments to long options are mandatory for short options too.\n  -a,\
  \ --archive                same as -dR --preserve=all\n…\n```\n\n由于输出内容过多，我们缩短了\
  \ `cp --help` 命令的输出，但重点在于该命令提供了更有用的信息。但是，如果这些信息还不够呢？你可以尝试对相关文件执行其他命令：\n\n点击此处查看代码图像\n\
  \n```\nstudent@onecoursesource:~$ ls /etc/hosts\n/etc/hosts\n```\n\n虽然在上一个例子中并非如此，但可能会产生额外的错误并引导你找到问题所在。\n\
  \n当你阅读这本书时，你将收集更多工具并到你的故障排除工具箱中。准备好制定一份命令和技巧“备忘单”，你可以用它让故障排除变得更容易。\n\n### 步骤 2：确定可能的原因\n\
  \n对于这一步，如果原因不明确，你应该考虑使用其他来源引导你走向正确的方向，包括以下来源：\n\n*   阅读文档，例如 `man` 和 `info` 页面\n\
  *   向同事征求意见\n*   联系你的系统管理员寻求建议\n*   在 Linux 论坛网站上搜索你的问题，如第 3 章中“获取帮助”中提到的那些\n* \
  \  使用已收集的信息进行互联网搜索，如图 5-1 所示\n\n    ![Image](img/05fig01.jpg)\n\n    **图 5-1** *执行互联网搜索*\n\
  \n**注意**\n\n如果你计划向同事或系统管理员寻求帮助，请准备好提供你在第一步中收集的所有信息，以便他们理解问题及其背景。去找你的系统管理员或 IT 支持人员说“我无法复制文件”并不能提供足够帮助解决问题的信息。你收集的细节越多，你的问题就越可能被快速解决。\n\
  \n### 步骤 3：记录你的攻击计划 (POA)\n\n诚然，许多问题不需要详细的记录，但随着你学习 Linux 中更复杂的话题，你会发现解决方案本身变得越来越复杂。现在就开始养成记录\
  \ POA 的习惯，因为以后再养成这个习惯将会困难。\n\n在计划如何执行记录步骤时，请考虑以下因素：\n\n*   我如何让这个过程变得简单？\n*   我如何确保文档易于检索和引用？（随手丢纸条是一个非常糟糕的主意。）\n\
  *   有哪些可用工具？考虑 Google Docs 和 Dropbox 等文件共享工具。对于组织而言，你可能考虑专门为跟踪问题设计的工具，如 Bugzilla\
  \ ([www.bugzilla.org](http://www.bugzilla.org))。\n\n### 步骤 4：执行操作\n\n这看起来可能是一个简单的步骤，但你应该考虑几点。首先，不要盲目地执行解决问题的操作。例如，如果你正在执行\
  \ 10 个步骤，请在每一步之后停下来进行评估。问自己以下问题：\n\n*   运行得正确吗？\n*   我是否写了拼写错误？\n*   我得到的是预期的输出吗？\n\
  *   是否还有其他地方不对劲？\n\n这不需要你进行长时间、复杂的、反思式的观察——只需进行瞬间的健康检查以确保你的解决方案在正确的轨道上。\n\n### 步骤\
  \ 5 和 6：问题解决了吗？\n\n识别问题是否已解决在大多数情况下可能是最简单的步骤。你之前遇到的问题仍然存在吗？记住，如果是的话，你需要撤销在上一步中执行的操作，因为这些操作可能会让情况更加复杂或产生更多问题。\n\
  \n### 步骤 7：还有其他问题吗？\n\n在某些情况下，不需要这一步。回想上一个例子中的问题：点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ cp /etc/hosts\ncp: missing destination file operand after '/etc/hosts'\nTry 'cp\
  \ --help' for more information.\n```\n\n问题在于 `cp` 命令需要两个参数——要复制的文件和存放的位置：点击此处查看代码图像\n\
  \n```\nstudent@onecoursesource:~$ cp /etc/hosts /tmp\nstudent@onecoursesource:~$\n\
  ```\n\n这个解决方案不太会导致任何其他问题（除非你将文件复制到了错误的目录）。然而，随着问题和解决方案变得越来越复杂，你应该花费更多时间来确保没有因为你的解决方案而产生其他问题。\n\
  \n### 步骤 8：存储文档\n\n这一步与步骤 3 非常相似，并且之前涵盖过。\n\n### 步骤 9：防止未来问题\n\n相同的问题很有可能会发生多次，可能发生在多个人身上。防止未来问题的一种方法是主动通知他人。这通常是系统管理员的工作，他们可以发送消息（电子邮件、短信等）或在用户登录系统时显示消息。这是本章下一个主题的重点。\n\
  \n#### 通知用户\n\n确保用户及时了解网络或系统的变化是非常关重要的。Linux 有多种方法可以自动通知用户此类信息。\n\n#### 登录前和登录后消息\n\
  \n\n\n\n您的环境中可能有成百个系统，这使得很难向每个用户提供有用信息，例如每个系统的设计用途、每个系统使用的发行发行版，以及他们应该使用哪种系统。可以通过创建在登录过程之前或之后显示的消息，以以每个系统为单位的方式提供此类信息。\n\
  \n请仔细考虑您想要显示的信息。信息过多，可能会导致用户只阅读一小部分；信息太少，则有可能无法提供足够的信息。\n\n### `/etc/issue` 文件\n\
  \n假设有一天，你决定处理你的 Web 服务器，这是一个没有图形用户界面（GUI）的系统。你坐在服务器前，看到的是一个与图 5-2 所示的登录界面。\n\n![Image](img/05fig02.jpg)\n\
  \n**图 5-2** 典型的命令行登录界面\n\n你开始好奇，为什么在提示符之前会显示操作系统名称和内核版本。或者，更重要的是，你想知道如何更改它们。\n\n\
  你看到的消息来自 `/etc/issue` 文件：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# more /etc/issue\n\
  \\S\nKernel \\r on an \\m\n```\n\n正如你可能猜到的那样，`\\S`、`\\r` 和 `\\m` 的值在显示到登录屏幕之前会被转换为其他内容。你可以在文件中放置的特殊值在表\
  \ 5-1 所示。\n\n**表 5-1** `/etc/issue` 文件的特殊值\n\n| 值 | 含义 |\n| --- | --- |\n| `\\b`\
  \ | 显示波特率，即连接速度。如果你通过串口终端连接，这可能是有用信息。 |\n| `\\d` | 使用此项显示当前日期。 |\n| `\\s` | 显示系统名称。\
  \ |\n| `\\S` | 与 `\\s` ，`\\S` 从 `/etc/os-release` 文件读取系统名称。这为系统名称提供了一些 `\\s` 无法提供的灵活性。\
  \ |\n| `\\l` | 插入 TTY 设备名称。每次命令行登录都与 `/dev` 目录中的一个设备名称相关。对于本地登录，通常使用类似 `/dev/tty1`\
  \ 和 `/dev/tty2` 的名称。 |\n| `\\m` | 显示 `uname -m` 命令的输出值（系统的架构）。 |\n| `\\n` | 显示系统的节点名（也称为主机名，与\
  \ `uname -n` 命令的输出相同）。 |\n| `\\o` | 显示网络信息服务（NIS）域（与 `uname -d` 命令的输出相同）。NIS 是向客户端系统提供网络账户信息的服务。\
  \ |\n| `\\r` | 显示操作系统发行版本（与 `uname -r` 命令的输出相同）。 |\n| `\\t` | 显示当前时间。 |\n| `\\u`\
  \ | 显示在 `/etc/issue` 文件打印到屏幕时登录的用户数。 |\n| `\\U` | 与 `\\u` 类似。 |\n| `\\v` | 显示操作系统版本。\
  \ |\n\n注意，这些特殊值实际上是由一个名为 `agetty` 的进程使用的。`agetty` 命令提供了登录提示符。\n\n`/etc/issue` 文件还可以用于提供额外信息，例如关于使用该系统的警告消息。注意对以下\
  \ `/etc/issue` 文件的修改，然后查看图 5-3 以查看这些更改的结果。\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# more /etc/issue\n\\S\nKernel \\r on an \\m\n\nRunning on terminal \\1\n\n\
  Platform: \\m\n\nNote: Secure system - No unauthorized access!  All activity is\
  \ closely monitored\n```\n\n![Image](img/05fig03.jpg)\n\n**图 5-3** 自定义命令行登录界面\n\n\
  要测试 `/etc/issue` 文件的更改，你必须能够通过命令行登录。在你的练习系统中，你很可能一直通过 GUI 登录。你应该能够通过按住键盘上的 Ctrl\
  \ 和 Alt 键并按下 F2 键（或 F3、F4 等）来访问命令行登录。\n\n要查看 `/etc/issue` 文件的更改，请通过命令行登录然后注销。当显示登录屏幕时，应该会出现新的\
  \ `/etc/issue` 显示内容。\n\n要返回 GUI，可以使用 Ctrl+Alt+F1 或 Ctrl+Alt+F7（其中一个应该可以用）。通常 F2\
  \ 到 F5 是命令行登录。F1 或 F7 通常是 GUI 显示（不是 GUI 的那应该是另一个命令行登录）。\n\n### `/etc/issue.net`\
  \ 文件\n\n`/etc/issue` 文件仅在用户通过本地命令行登录时才会显示。如果用户从远程系统登录，你可以通过在 `/etc/issue.net` 文件中放置信息来显示消息。\n\
  \n\n\n\n有些管理员会发布一种听起来严厉的警告，意图是吓走某些。这种警告可能会适得其反，因为这就像是在说“这个系统上有很多好东西”——这并不是你想要发送给潜在坏之徒的信息。\n\
  \n说明该系统是专有的且包含机密信息通常足够了。\n\n你还应该考虑由于安全问题不允许 telnet 连接。所有与 telnet 相关的数据都以明文发送，包括用户的用户名和密码。\n\
  \n### 登录前的消息\n\n管理员经常使用 `/etc/issue` 和 `/etc/issue.net` 文件来显示登录前的消息。这些文件对于在用户通过本地命令行、telnet\
  \ 以及（如果配置正确的话）通过 SSH 登录时显示登录前消息非常有用。然而，你还可以通过其他方式访问系统，例如通过 FTP（文件传输协议）和基于图形界面的登录：\n\
  \n*   **FTP**：这取决于你使用的 FTP 服务器。许多发行版使用 `vsftpd` 服务器；其配置文件是 `/etc/vsftpd/vsftpd.conf`。你可以更改\
  \ `ftpd_banner` 设置来指定横幅（只需提供横幅作为值：`ftpd_banner=*<insert_message_here>*`），或者通过更改\
  \ `banner_file` 设置来显示文件。\n*   **GUI (gdm)**：如果你使用 GDM 作为你的 GUI 登录管理器（GDM=Gnome 显示器管理器），则修改\
  \ `/etc/gdm/custom.conf` 文件（针对基于 Red Hat 的系统）或 `/etc/gdm/gdm.conf-custom` 文件（针对基于\
  \ Debian 的系统）。对于基于 Red Hat 的系统，你可能需要在 `[daemon]` 部分添加行 `Greeter=/usr/libexec/gdmlogin`。对于所有发行版，请搜索\
  \ `[greeter]` 部分并进行以下更改：\n\n    点击此处查看代码图像\n\n    ```\n    DefaultWelcome=false\n\
  \    Welcome=Message for local users\n    RemoteWelcome=Message for remote login\
  \ users\n    ```\n\n**注意**\n\n其他的 GUI 显示管理器（也称为登录管理器）与 GDM 具有类似的方法。这只是找到配置文件并确定正确设置的问题。这种功能通常被称为\
  \ *banner*（横幅）或 *greeter*（欢迎界面），因此在搜索文档时使用这些术语。\n\n### /etc/motd 文件\n\n本章到为止讨论的技术都是为了在登录过程之前显示消息。然而，在用户成功登录后，你可能想显示不同类型的消息。这可以通过编辑\
  \ `/etc/motd` 文件来实现。（`motd` 代表“每日消息”，message of the day）。）\n\n以下提供了一些关于你可能想放在 `/etc/motd`\
  \ 文件中的内容想法：\n\n*   **一条友好的欢迎消息**：让用户知道你很高兴他们在这里。真的，你不知道有多少普通用户（尤其是新手）对登录 Linux 机器感到畏惧。提供一些友好的建议，提供一些有用的资源（如技术支持或帮助台信息），并让用户知道他们并不孤单。\n\
  *   **“你敢试试”警告消息**：好吧，我们知道这听起来与之前的建议相反。然而，在你的关键任务服务器上，你并不希望表现得完全友善。确保用户知道这台服务器的监控有多有多密。让他们知道如果他们违反了规则，后果将是严重的。\n\
  *   **即将发生的更改**：如果你计划在下周二关闭此系统进行维护，请在 `/etc/motd` 文件中注明。如果你在未来几周内要添加新软件，请通过 `/etc/motd`\
  \ 文件中的通知予以标明。\n*   **系统的用途**：如果这是你的 Web 服务器，为什么不在用户登录时说明这一点呢？用户应该知道他们正在操作或登录到的是种种系统，而\
  \ `/etc/motd` 文件是说明这一点的一个绝佳地方。你可以想象系统管理员有多少次在用户被问及“你为什么在那台系统上运行这个 CPU 密集型程序？”时，听到用户说“噢，我不知道那是我们的邮件服务器！”\n\
  \n这些只是你可以在放在 `/etc/motd` 文件中的中的几点想法。你可以通过在 `/etc/motd` 文件中放置这些信息，向用户传递许多其他有用的信息。（注意：在大多数发行版中，`/etc/motd`\
  \ 文件默认是空的。）\n\n要查看 `/etc/motd` 文件的示例，首先查看以下命令的输出，然后查看图 5-4 所示的内容：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ssh]# more /etc/motd\nNote: This system will be down\
  \ for maintenance on Friday from 10PM to 10:30PM.\nDuring this time you will not\
  \ be able to log in and any cron jobs that you\nhave will not be executed. See Julia\
  \ if you have any questions.\n```\n\n![Image](img/05fig04.jpg)\n\n**图 5-4** *自定义命令行登录界面*\n\
  \n#### 广播消息\n\n`/etc/issue`、`/etc/issue.net` 和 `/etc/motd` 文件在登录过程中提供有用信息非常棒。但如果你需要向所有登录的用户发送紧急消息呢？\n\
  \n`wall` 命令可以让你向所有登录的用户广播消息。\n\n```\n[root@onecoursesource ssh]# more /etc/motd\n\
  Note: This system will be down for maintenance on Friday from 10PM to 10:30PM.\n\
  During this time you will not be able to log in and any cron jobs that you\nhave\
  \ will not be executed. See Julia if you have any questions.\n```\n\n### wall 命令\n\
  \n`/etc/issue`、`/etc/issue.net` 和 `/etc/motd` 文件在登录过程中提供有用信息非常棒。但如果你需要向所有当前登录的用户发送紧急消息呢？\n\
  \n`wall` 命令可以让你向所有登录的用户广播消息。\n\n```\n[root@onecoursesource ssh]# more /etc/motd\n\
  Note: This system will be down for maintenance on Friday from 10PM to 10:30PM.\n\
  During this time you will not be able to log in and any cron jobs that you\nhave\
  \ will not be executed. See Julia if you have any questions.\n```\n\n**注意**\n\n\
  有时你需要避免显示消息顶部的横幅，在执行 `wall` 命令时使用 `-n` 选项。这将输出限制在消息本身。\n\n```\n[root@onecoursesource\
  \ ssh]# wall -n \"This is a test message\"\n```\n\n所有用户都可以使用 `wall`，因为它是一个 SGID\
  \ 程序。这种权限将在第 9 章文件权限”中详细介绍。以下输出中的 **s** 字符表示这是一个 SGID 程序：\n\n```\n[root@onecoursesource\
  \ ssh]# ls -l /usr/bin/wall\n-r-xr-sr-x. 1 root tty 15344 Jun  9  2019 /usr/bin/wall\n\
  ```\n\n所有终端设备（`/dev/tty1`、`/dev/tty2`、`/dev/pts/0` 等）都属于 tty 组。tty 组对这些文件具有写入权限，因此当\
  \ `wall` 命令以 tty 组运行时运行时它可以向这些终端设备写入信息。要禁用普通用户发送 `wall` 消息的能力，只需取消 SGID 权限集：\n\n\
  ```\n[root@onecoursesource ssh]# ls -l /usr/bin/wall\n-r-xr-sr-x. 1 root tty 15344\
  \ Jun  9  2019 /usr/bin/wall\n[root@onecoursesource ssh]# chmod g-s /usr/bin/wall\n\
  [root@onecoursesource ssh]# ls -l /usr/bin/wall\n-r-xr-xr-x. 1 root tty 15344 Jun\
  \  9  2019 /usr/bin/wall\n```\n\n\n\n\n普通用户不会看到任何错误信息，但 `wall` 命令不会向任何用户账户发送消息。\n\
  \n用户可以禁用特定终端的 `wall` 消息。如果你正在编辑文件、阅读 man 手页或执行某些关键任务，你可能需要这样做。`wall` 消息不会破坏你的工作，但当你尝试编辑文件时，屏幕上出现一大堆文本确实会引起困惑（示例请参见图\
  \ 5-5）。\n\n![Image](img/05fig05.jpg)\n\n**图 5-5** *烦人的 `wall` 消息*\n\n若要在特定终端中忽略\
  \ `wall` 消息，请执行以下命令将你的 `mesg` 值设置为“no”：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# mesg n\n[root@onecoursesource ~]# mesg\nis n\n```\n\n你随时可以在稍后将该值改回“yes”。记得这样做，否则将会错过关于强制关机或重启的关键信息：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mesg y\n[root@onecoursesource ~]#\
  \ mesg\nis y\n```\n\n### shutdown 命令\n\n如果向用户发送广播消息的目的是为了关闭系统，请考虑使用 `shutdown` 命令。`shutdown`\
  \ 命令的语法为：\n\n点击此处查看代码图像\n\n```\nshutdown [OPTIONS...] [TIME] [WALL...]\n```\n\n\
  `[WALL...]` 是你想要发送给所有人的广播消息。当然，你希望为用户留出保存工作和注销系统的时间，因此可以使用 `[TIME]` 值来指定在实际关机系统之前等待多久：\n\
  \n点击此处查看代码图像\n\n```\nshutdown +5 \"system shutdown\n```\n\n`+5` 的值告诉 `shutdown`\
  \ 命令在实际关机前等待 5 分钟。显示给所有用户的消息类似于如下：\n\n点击此处查看代码图像\n\n```\nBroadcast message from\
  \ root@onecoursesource (Sun 2019-02-11 13:20:09 PDT):\n\nshutting down\nThe system\
  \ is going down for power-off at Sun 2019-02-1113:25:09 PDT!\n```\n\n此消息将以固定间隔持续显示（关机前\
  \ 5 分钟、3 分钟等，以此此类推）。如果你早早启动关机（例如 `shutdown +60`），则用户可以继续登录。然而，在关机前 5 分钟，用户登录将被禁用，因为\
  \ `shutdown` 命令会创建 `/run/nologin` 文件，这会阻止额外的登录尝试。\n\n作为管理员，你可以使用 `shutdown -c` 命令取消挂起的关机任务：\n\
  \n点击此处查看代码图像\n\n```\n[student@onecoursesource  ~]$ shutdown -c\n\nBroadcast message\
  \ from root@onecoursesource (Sun 2019-02-1113:23:32 PDT):\n\nThe system shutdown\
  \ has been cancelled at 2019-02-1113:24:32 PDT!\n```\n\n这里有几个额外的实用选项：\n\n* `-r`:\
  \ 重启而非关机。\n* `-h`: 停止系统（取决于你的发行版，可能与关机相同）。\n* `-k`: 不实际关机；仅发送一条系统正在关机的 `wall` 消息。\n\
  \n### 总结\n\n本章的重点是学习解决 Linux 发行版工作过程中可能出现问题的排除技术。你还学习了如何在用户登录时或登录期间向他们发送消息，以便为其提供有关系统的重要信息。\n\
  \n## 复习题\n\n**1.** 在本地命令行登录尝试之前会显示 `/etc/_____` 文件。\n\n**2.** 在 telnet 登录尝试之前会显示\
  \ `/etc/_____` 文件。\n\n**3.** 在成功登录后会显示 `/etc/_____` 文件。\n\n**4.** `_____` 命令将向当前登录系统的所有用户显示消息。\n\
  \n1. `wall`\n2. `mesg`\n3. `send`\n4. `shutdown`\n\n**5.** `shutdown` 命令的 `_____`\
  \ 选项用于取消关机操作。\n\n# 第二部分\n\n## 用户和组账户\n\n用户和组账户在系统安全方面的重要性怎么强调都不为过。如果有人即使使用普通用户也能访问系统。\n\
  \n（注：原文此处存在大量重复段落，已根据要求不进行重复输出，仅保留核心结构）\n\n\n\n\n`id` 命令的输出见表 6-1。\n\n### 表 6-1\
  \ `id` 命令的输出\n\n| **值** | **描述** |\n| --- | --- |\n| `uid=1002(student)` | 当前用户的用户\
  \ ID 和用户名 |\n| `gid=1002(student)` | 当前用户的主组 ID 和组名 |\n| `groups=1002(student),60(games),1001(ocs)`\
  \ | 当前用户的附加组 ID 和组名 |\n\n`groups` 命令的输出包含了当前用户所属的所有组。主组始终列在第一位。\n\n### 安全要点\n\n\
  `id` 和 `groups` 命令默认都会显示有关当前用户的信息。这两个命令也接受另一个用户账户名作为参数：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ id root\n```\n```\nuid=0(root) gid=0(root) groups=0(root)\nstudent@onecoursesource:~$\
  \ groups root\n```\n```\nroot : root\n```\n\n主组和附加组成员关系之间最重要的区别在于用户创建新文件时。每个文件都属于一个用户\
  \ ID 和一个组 ID。当用户创建一个文件时，该用户的主组成员关系被用于该文件的组所有权：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ groups\nstudent games ocs\nstudent@onecoursesource:~$ touch sample.txt\nstudent@onecoursesource:~$\
  \ ls -l sample.txt\n-rw-rw-r-- 1 student student 0 Sep 15 11:39 sample.txt\n```\n\
  \n### 组所有权\n\n文件创建后，用户可以使用 `chgrp` 命令将文件的组所有权更改另一个组：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ ls -l sample.txt\n-rw-rw-r-- 1 student student 0 Sep 15 11:39 sample.txt\nstudent@onecoursesource:~$\
  \ chgrp games sample.txt\nstudent@onecoursesource:~$ ls -l sample.txt\n-rw-rw-r--\
  \ 1 student games 0 Sep 15 11:39 sample.txt\n```\n\n#### 可能会出现什么问题？\n\n虽然用户可以将自己文件的组成员关系更改为所属的组，但他们不能更改其他用户拥有文件的组成员关系，因为这构成了安全风险。以下命令演示了用户尝试更改另一个用户的文件组所有权时的典型错误信息：\n\
  \n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ ls -l /etc/hosts\n-rw-r--r-- 2 root\
  \ root 199 Sep 15 11:24 /etc/hosts\nstudent@onecoursesource:~$ chgrp games /etc/hosts\n\
  chgrp: changing group of '/etc/hosts': Operation not permitted\n```\n\n另一个潜在问题是当用户尝试将自己的一个文件的组所有权更改为自己并不所属的组时。会出现类似的错误信息：\n\
  \n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ ls -l sample.txt\n-rw-rw-r-- 1 student\
  \ games 0 Sep 15 11:39 sample.txt\nstudent@onecoursesource:~$ id\n```\nuid=1002(student)\
  \ gid=1002(student)\ngroups=1002(student),60(games),1001(ocs)\nstudent@onecoursesource:~$\
  \ chgrp users sample.txt\nchgrp: changing group of 'sample.txt': Operation not permitted\n\
  ```\n\n用户可能能够临时将他们的主组更改另一个组，但这取决于一个名为 `/etc/group` 文件的安全功能，该功能将在后续介绍。\n\n#### /etc/group\
  \ 文件\n\n组信息存储在几个文件中：\n\n* `/etc/passwd` 文件包含用户账户信息，包括每个用户的主组成员关系。关于该文件内容的细节将在第 7\
  \ 章中讨论。在本章讨论组时，此主组成员关系使用组的 GID 进行存储，如下例所示：\n\n    点击此处查看代码图像\n\n    ```\n    student@onecoursesource:~$\
  \ grep student /etc/passwd\n    student:x:1002:1002::/home/student:\n    ```\n\n\
  * `/etc/group` 文件存储有关每个组的信息，包括组名、组 ID (GID) 和附加用户成员关系。\n\n* `/etc/gshadow` 文件存储组的额外信息，包括组管理员和组密码。关于该文件内容的细节将在第\
  \ 7 章中讨论。\n\n### 表 6-2 /etc/group 的字段\n\n| **字段** | **描述** |\n| --- | --- |\n| **adm**\
  \ | 组名。必须必须唯一以避免冲突。 |\n| **x** | 密码占位符。以前放在 `/etc/group` 中的密码已移动到 `/etc/gshadow`\
  \ 文件中，出于安全考虑。 |\n| **4** | 这是表示组 ID 的数值值。GID 必须唯一以避免冲突。 |\n| **syslog,bo** | 这是组的成员列表。要将用户作为附加成员添加到组，管理员在此字段添加用户名。\
  \ |\n\n### 示例：etc/group\n\n```\nstudent@onecoursesource:~$ head /etc/group\nroot:x:0\n\
  daemon:x:1\nbin:x:2\nsys:x:3\nadm:x:4\ntty:x:5\nlp:x:6\nmail:x:7\nnews:x:8\nuuc:x:9\n\
  disk:x:10\nsudo:x:11\ngames:x:12\nman:x:13\nlo:x:14\nproxy:x:15\nbackup:x:16\nirc:x:17\n\
  gnats:x:18\nwww:x:19\nwww-data:x:20\nlist:x:21\nmembership:x:22\nplugdev:x:23\n\
  scanner:x:24\nud:x:25\nvar:x:26\ngames:x:27\ngames:x:28\nsvg:x:29\nkv:x:30\ngnome:x:31\n\
  audio:x:32\nvideo:x:33\nscanner:x:34\nquor:x:35\noperator:x:36\ncd:x:37\nstudent:x:38\n\
  ```\n\n### 安全要点\n\n通常 `/etc/group` 文件不会被手动修改。管理员使用 `groupadd`、`groupdel` 和 `groupmod`\
  \ 等命令更改 `/etc/group` 文件的内容。然而，`/etc/group` 文件可以手动修改；因此，文件中可能会出现错误。要检查 `/etc/group`\
  \ 文件是否存在任何错误，请以 root 用户身份登录并执行 `grpck` 命令。\n\n### 特殊组\n\n典型的 Linux 系统会有许多默认组账户。这些默认组账户的\
  \ GID 值通常小于 1000，使得管理员很容易识别出这些特殊账户。\n\n此外，如果您向系统添加新软件，可能会添加更多的组，因为软件供应商利用用户和组账户来控制对软件组成文件的访问。\n\
  \n\n\n\n\n关注安全的管理员应该注意这些特殊组账户，因为这些账户既可以提供安全功能，也可能构成安全威胁。表 6-3 突出了更重要的特殊组账户（涵盖所有特殊组超出了本书的范围）。\n\
  \n### 表 6-3 特殊组账户\n\n| **组名** | **描述** |\n| --- | --- |\n| root | 此组账户专为系统管理员预留。不要将普通用户添加到此组，因为这将为普通用户提供对系统文件的提升访问权限。\
  \ |\n| adm | 该组的成员通常有权访问与系统监控相关的文件（如日志文件）。查看这些文件的内容可以比普通用户通常拥有的提供更多系统信息。 |\n| lp\
  \ | 这是操作系统使用的许多组之一（包括 `tty`、`mail` 和 `cdrom`），用于提供对特定文件的访问权限。通常普通用户不会被添加到这些组，因为这些组由称为\
  \ `daemons` 的后台进程使用。 |\n| sudo | 此组与 `sudo` 命令配合使用。`sudo` 命令将在第 7 章中详细讨论。 |\n| staff\
  \ | 传统上用于 Unix 系统的默认组，但在现代 Linux 发行版中很少使用。 |\n| users | 一个在现代 Linux 发行版中很少使用的默认组。\
  \ |\n| operators | 传统上用于 Unix 系统的组，供某些特定系统任务需要提升权限的用户。该组在现代 Linux 发行版中很少使用。 |\n\n\
  ### 安全要点\n\n作为管理员，你应该意识到每个组的设计意图。花时间探索你的 `/etc/group` 文件列出的所有组，并仔细考虑将用户添加到特殊组的影响。此外，在向系统添加软件后，检查\
  \ `/etc/group` 文件的内容以确定是否添加了新组。如果添加了新账户，请探索这些新组的用途。\n\n### 用户私有组 (User Private Groups)\n\
  \n通常在创建用户账户时，也会为该用户创建一个组。这种设计是为了解决 Linux 早期的一种常见情况，即系统管理员会惯性地将所有用户添加到同一个组（通常称为“users”或“staff”）。\n\
  \n这种做法导致了用户获得了他们不应该访问的文件访问权限。通过将所有人放在一个组中，每个用户创建的每个新文件都属于该组，这意味着组织中的每个人都可以通过组权限访问该文件，或者用户必须记住为每个新创建的文件手动移除对该组的所有权限。图\
  \ 6-1 展示了这种场景造成的问题（`file1.txt` 演示了安全风险，而 `file2.txt` 展示了当用户记得移除该组所有权限的情况）。\n\n![Image](img/06fig01.jpg)\n\
  \n**图 6-1** *为所有人设置全局组的问题*\n\n为每个用户创建一个一个组的概念被称为用户私有组 (UPGs)，其中每个用户都有自己的组作为其私有组，这意味着所有用户都能访问所有其他用户文件的安全风险被限制了。\n\
  \n遗憾的是，如果系统管理员没有正确处理组成员关系，这种方法也会带来安全风险。UPG 本质上使用用户的主组变得毫无意义（至少在默认情况下如此），因为用户是该私有组的唯一成员。如果用户不是其他组的成员，那么为了给特定用户提供文件访问权限，通常会使用其他权限设置。这最终会导致系统上的所有人都能获得访问权限，而这正是\
  \ UPG 设计旨在避免的问题。图 6-2 展示了这种场景造成的问题。\n\n![Image](img/06fig02.jpg)\n\n**图 6-2** *UPG\
  \ 的潜在问题*\n\nUPG 确实提供了一个解决方案，但只是部分。管理员还必须实施安全策略，包含以下一项或多项：\n\n*   一个将用户放入额外组的程序，以便方便合作的人员共享文件访问权限。\n\
  *   一个向所有用户教授正确使用权限的计划。关于此主题的详细讨论可以在第 9 章 中的“文件权限”中找到。\n*   管理员应该考虑允许用户将新用户添加到他们自己的私有组中。关于此主题的详细讨论将在下一节“/etc/gshadow\
  \ 文件”中提供。\n*   一个教用户如何使用访问控制列表 (ACLs) 的计划，这是一种向特定用户或组分配权限的方法。关于此主题的详细讨论可以在第 9 章](#ch09.xhtml_ch09)中找到。\n\
  \n### 对话式学习™——规划组\n\n**Gary**: 嗨，Julia。你有时间吗？我想听听你的主意。\n\n**Julia**: 好的，你需要什么？\n\
  \n**Gary**: 我正试图制定一个计划来创建我们组织所需的 Linux 组，但我不太确定从哪里开始。\n\n**Julia**: 通常创建 Linux 组是为了让用户可以使用组权限在之间共享文件。例如，你组织的每个部门可能都应该有自己的组。\n\
  \n**Gary**: 就这样吗？只需为部门创建一个组即可？\n\n**Julia**: 不，还有其他因素需要考虑。例如，来自不同部门的两个人可能需要共享文件。如果他们正在合作一个项目，为该项目创建一个组是有意义的。\n\
  \n**Gary**: 创建组还有什么常见的理由吗？\n\n**Julia**: 创建组时，你可能还想考虑职位。公司通常为经理、工程师、承包商等设有组。\n\n\
  **Gary**: 好的，太棒了。这给了我一个从哪里开始的好主。谢谢你的帮助！\n\n**Julia**: 随时乐意！\n\n#### /etc/gshadow\
  \ 文件\n\n`/etc/group` 文件包含一些组账户信息，但更多信息可以在 `/etc/gshadow` 文件中找到。该文件仅对 root 用户可见，因此更敏感的数据存储在\
  \ `/etc/gshadow` 中。\n\n示例 6-2 展示了典型的 `/etc/gshadow` 文件的部分。\n\n**示例 6-2** *//etc/gshadow\
  \ 文件*\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# head /etc/gshadow\nroot:*::\n\
  daemon:*::\nbin:*::\nsys:*::\nadm:*:student:syslog,bo,student\ntty:*::\ndisk:*::\n\
  lp:*::\nmail:*::\nnews:*::\n```\n\n`/etc/gshadow` 文件中的每行描述一个组。每行被划分为若干字段，并以冒号（:）作为字段分隔符。表\
  \ 6-4 使用 `adm:*:student:syslog,bo,student` 行作为示例描述了这些字段。\n\n### 表 6-4 /etc/gshadow\
  \ 文件的字段\n\n| **字段** | **描述** |\n| --- | --- |\n| **adm** | 组名。这与 `/etc/group` 文件中的组名匹配。\
  \ |\n| ***** | 组密码。`*****` 或 `!` 表示“未设置有效密码”。此密码配合 `newgrp` 命令使用并由 `gpasswd` 命令设置。可以在此表后的讨论中了解更多关于此密码的信息。\
  \ |\n\n\n\n\n\n| **student** | 组的管理员。组管理员可以从组中添加和删除用户。请参见本章后续的“组管理员”节。 |\n| **syslog,bo,student**\
  \ | 这是该组的成员列表。这应该与 `/etc/group` 文件中相应的字段相匹配。 |\n\n`/etc/gshadow` 文件中密码字段的目的是允许用户通过使用\
  \ `newgrp` 命令临时更改其主组。默认情况下，任何组的成员用户都可以切换其主组：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ groups\nstudent adm games ocs\nstudent@onecoursesource:~$ newgrp games\nstudent@onecoursesource:~$\
  \ groups\ngames adm ocs student\n```\n\n用户除非他们知道该组的密码，否则他们无法将其主组身份切换到他们不所属的组。此密码由管理员使用\
  \ `gpasswd` 命令设置：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# gpasswd staff\n\
  Changing the password for group staff\nNew Password:\nRe-enter new password:\nroot@onecoursesource:~#\
  \ grep staff /etc/gshadow\nstaff:$6$iv.gICgaA$iWGw611b/ZqKhu4WnMfA9qpNQvAQcljBFGuB1iXdWBhMWqgr2yQn7hn6Nu8BTrtErn73\n\
  \  wLDhWzS6tNtJmkV/::\n```\n\n一旦设置了密码，用户可以在运行 `newgrp` 命令并在提示时输入组密码来更改其主组：\n\n点击此处查看代码图像\n\
  \n```\nstudent@onecoursesource:~$ groups\nstudent adm games ocs\nstudent@onecoursesource:~$\
  \ newgrp staff\nPassword:\nstudent@onecoursesource:~$ groups\nstaff adm games ocs\
  \ student\n```\n\n虽然你可以使用组密码方法，但请考虑：如果你想允许用户切换到一个新的主组，为什么不直接将他们添加到该组呢？因为这种逻辑，组密码在\
  \ Linux 系统上并不常用。\n\n请参见图 6-3 获取更多信息。\n\n![图像](img/06fig03.jpg)\n\n**图 6-3** *Text\
  \ Support™—更改主组*\n\n## 管理组\n\n管理组的过程包括创建新组、修改现有组和删除组。这些操作需要由 root 账户提供的权限。\n\n管理组还包括将用户添加到组或从组中移除用户的过程。通常情况下，这些操作需要\
  \ root 账户提供的权限，但如果创建了组管理员，那么组管理员也可以为特定组执行这些任务。\n\n### 创建组\n\n使用 `groupadd` 命令创建新组，如下所示：\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# groupadd -g 5000 payroll\nroot@onecoursesource:~#\
  \ tail -1 /etc/group\npayroll:x:5000:\n```\n\n**注意**\n\n`-g` 选项用于为组分配 GID。如果忽略 `-g`\
  \ 选项，则将使用 1000 以上的可用 GID（在某些系统上，可能会使用 500 以上的可用 GID）。最佳实践是使用 `-g` 选项并使用较高的值（5000\
  \ 或以上），这样就不会影响用于用户私有组的 GID。\n\n**可能会出现什么？**\n\n在创建组时，你必须使用当前未使用的 GID 和名称，否则你将收到错误：\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# groupadd -g 4000 payroll\ngroupadd:\
  \ group 'payroll' already exists\nroot@onecoursesource:~# groupadd -g 5000 test\n\
  groupadd: GID '5000' already exists\n```\n\n### 修改组\n\n管理员对组进行的最典型更改（除了添加和移除成员之外）是更改组名。更改的原因可能是原始名称描述性不够，因此另一个名称更好。\n\
  \n要更改组名，请使用带有 `-n` 选项的 `groupmod` 命令，如下所示：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ tail -1 /etc/group\npayroll:x:5000:\nroot@onecoursesource:~# groupmod -n payables\
  \ payroll\nroot@onecoursesource:~# tail -1 /etc/group\npayables:x:5000:\n```\n\n\
  ### 删除组\n\n通过执行 `groupdel` 命令完成删除组。然而，在删除组之前，管理员应该在文件系统中搜索所有属于该组的文件，并将所有权更改为另一个组。如果未采取这一步，那么属于该组的文件最终将仅由该组的\
  \ GID 所有，这会导致组权限失去意义。这里有一个示例：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -l\
  \ /tmp/example\n-rw-r--r-- 1 root payables 0 Sep 15 16:07 /tmp/example\nroot@onecoursesource:~#\
  \ groupdel payables\nroot@onecoursesource:~# ls -l /tmp/example\n-rw-r--r-- 1 root\
  \ 5000 0 Sep 15 16:07 /tmp/example\n```\n\n请参见图 6-4 了解如何通过组所有权搜索文件。\n\n![图像](img/06fig04.jpg)\n\
  \n**图 6-4** *Text Support™—如何按组所有权查找文件并更改所有权*\n\n### 将用户添加到组\n\n`usermod` 命令的 `-G`\
  \ 选项用于将用户添加到组。但是，请小心，默认情况下此选项会覆盖现有的组成员。这里有一个示例：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ tail -1 /etc/group\npayroll:x:5000:\nroot@onecoursesource:~# usermod -G adm student\n\
  root@onecoursesource:~# id\nuid=1002(student) gid=1002(student) groups=student\n\
  ```\n\n要在保留用户当前组成员身份的情况下将用户添加到组，请结合使用 `-a` 和 `-G` 选项：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ id\nuid=1002(student) gid=1002(student) groups=student\nroot@onecoursesource:~#\
  \ usermod -a -G student\n```\n\n**安全提示**\n\n除非必要，否则不要将用户添加到组，因为这将为用户提供不必要的权限。\n\n\
  ### 组管理员\n\n默认情况下，可以添加或从组中移除用户的只有 root 用户。要允许用户管理组，你需要通过使用 `gpasswd` 命令的 `-A` 选项将其添加为组管理员：\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# grep games /etc/gshadow\ngames:::root\n\
  root@onecoursesource:~# gpasswd -A student games\nroot@onecoursesource:~# grep games\
  \ /etc/gshadow\ngames:student\n```\n\n现在，student 用户可以使用 `gpasswd` 命令的 `-a` 选项将用户添加到组中：\n\
  \n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~# gpasswd -a bo games\nAdding user\
  \ bo to group games\nstudent@onecoursesource:~# grep games /etc/group\ngames:x:60:student,bo\n\
  ```\n\n使用 `gpasswd` 命令的 `-d` 选项，student 用户可以从组中移除用户：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~#\
  \ grep games /etc/group\ngames:x:60:student,bo\nstudent@onecoursesource:~# gpasswd\
  \ -d bo games\nRemoving user bo from group games\nstudent@onecoursesource:~# grep\
  \ games /etc/group\ngames:x:60:student\n```\n\n**注意**\n\n组管理员只能使用 `gpasswd` 命令管理他们作为管理员的组。他们也无法使用\
  \ `groupadd`、`groupmod` 和 `groupdel` 命令。\n\n### 总结\n\n\n\n\n\nLinux 操作系统利用组账户来控制对关键组件（包括文件和目录）的访问。在本章中，你学习了如何管理这些组账户。这包括如何创建、修改和删除组账户，以及如何使用特殊组账户功能，例如用户私有组（UPG）和组管理员。\n\
  \n## 关键术语\n\n- 组账户\n- 主组\n- 附加组\n- UID, 用户 ID\n- GID, 组 ID\n- 特殊组\n- UPG, 用户私有组\n\
  \n## 复习习题\n\n**1.** 每个用户至少是 _____ 个组的成员。\n\n**2.** 以下哪个命令会显示用户 nick 成员的组？\n\n1.\
  \ `id`\n2. `groupinfo`\n3. `info groups`\n4. `groups`\n\n**3.** 哪些文件被用于存储组信息？\n\n\
  1. `/etc/groupoinfo`\n2. `/etc/shadow`\n3. `/etc/groups`\n4. `/etc/gshadow`\n\n\
  **4.** 特殊组是 GID 编号通常小于数值 _____. 的组。\n\n**5.** 如果系统在使用 UPG，则名为 jake 的用户账户的组名应该是 _____。\n\
  \n## 第 7 章：管理用户账户\n\n由于 Linux 是一台多用户操作系统，其安全性通常基于账户。每个人都会被提供一个用户账户，允许该用户访问系统。\n\n\
  作为管理员，了解创建和管理用户账户的基础知识至关重要。从安全的角度考虑，你应该将用户账户视为系统最大的潜在风险之一。因此，妥善地保护用户账户是一项关键的系统管理任务。\n\
  \n在本章中，你将学习更多关于用户账户的概念。你还探索了如何创建、修改、保护和删除用户账户。\n\n在阅读本章并完成练习后，你将能够完成以下操作：\n\n- 理解\
  \ Linux 用户账户的概念\n- 管理用户，包括创建、修改和删除用户账户\n- 理解网络用户账户\n- 使用 `su` 和 `sudo` 获取特权系统访问\n\
  - 使用 PAM 限制用户账户\n\n### 用户账户的重要性\n\n用户账户在 Linux 操作系统中起着至关重要的作用，包括：\n\n- **授予系统访问**：用户账户为用户登录并获得受控访问提供了手段。\n\
  - **保护文件和目录**：每个文件（和目录）都属于一个用户账户。文件所有者根据文件权限访问该文件。\n- **安全进程**：每个运行中的进程（程序）都属于一个用户账户。该用户账户有权停止或修改运行进程，而其他用户没有这种权限。\n\
  - **额外权限**：系统管理员可以为用户账户提供特殊权限。这包括运行特定进程或执行其他用户无法执行特定系统操作的能力。\n- **额外验证**：某些软件程序会验证用户账户以进行身份验证。这意味着运行这些程序时需要使用用户账户和用户密码（或其他身份验证方法）。\n\
  \n### 用户账户信息\n\n本地用户的账户数据存储在几个不同的文件中：\n\n- `/etc/passwd`: 主账户数据。\n- `/etc/shadow`:\
  \ 用户密码和密码相关数据。\n- `/etc/group`: 组账户数据，包括与用户账户相关的信息。有关此文件的详情请参见第 6 章，“管理组账户](#ch06.xhtml_ch06)”。\n\
  - `/etc/gshadow`: 组账户数据，包括与用户账户相关的信息。有关此文件的详情请参见第 6 章。\n\n注意，这些文件仅用于存储本地用户账户信息。用户账户也可以由服务器提供，允许用户使用相同的用户名和密码登录多个不同的系统。\n\
  \n网络用户将在本章稍后的部分详细介绍。\n\n### /etc/passwd 文件\n\n`/etc/passwd` 文件包含基础用户账户信息。然而，尽管名字如此，但该文件并不包含任何与用户密码相关的信息。\n\
  \n示例 7-1 展示了典型的 `/etc/passwd` 文件的部分。\n\n**示例 7-1** *`/etc/passwd` 文件*\n\n点击此处查看代码图像\n\
  \n```\nstudent@onecoursesource:~$ head /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\n\
  daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\n\
  sys:x:3:3:sys:/dev:/usr/sbin/nologin\nsync:x:4:65534:sync:/bin:/bin/sync\ngames:x:5:60:games:/usr/games:/usr/sbin/nologin\n\
  man:x:6:12:man:/var/cache/man:/usr/sbin/nologin\nlp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologin\n\
  mail:x:8:8:mail:/var/mail:/usr/sbin/nologin\nnews:x:9:9:news:/var/spool/news:/usr/sbin/nologin\n\
  ```\n\n**安全亮点**\n\n如示例 7-1 所示，普通（非管理员）用户可以查看 `/etc/passwd` 文件。这突显了防止未经授权访问系统的必要性，因为即使是普通用户也可以通过查看\
  \ `/etc/passwd` 文件获取有关系统的价值信息。请记住，这在操作系统中并不稀奇——普通用户可以在其他操作系统（包括 Unix、macOS 和 Windows）上看到基础用户账户信息。\n\
  \n注意，管理员不应更改 `/etc/passwd` 文件的权限，因为这会导致程序无法工作。\n\n`/etc/passwd` 文件中的每行描述一个账户。每行划分为多个字段，并使用冒号（:`）作为分隔符。表格\
  \ 7-1 使用 `root:x:0:0:root:/root:/bin/bash` 行作为示例描述了这些字段。\n\n**表格 7-1 /etc/passwd\
  \ 字段**\n\n| 字段 |  |\n| --- | --- |\n| root | 用户名。用户名在当前系统中必须是唯一的以避免所有权问题。 |\n| x\
  \ | 密码占位符。密码以前放在 `/etc/passwd` 文件中，但为了安全已移动到 `/etc/shadow` 文件。这是因为 `/etc/passwd`\
  \ 所有用户可见，而 `/etc/shadow` 只有 root 用户可见。有关密码的详情将在本章稍后的“etc/shadow 文件”部分讨论。 |\n| 0\
  \ | 代表 ID (UID) 的数值。UID 在当前系统中必须是唯一的以避免所有权问题。 |\n| 0 | 代表用户主组的数值。回想第 6 章，用户可以是多个组的成员，但主组用于设置新文件和目录的初始组所有。\
  \ |\n| root | 注释字段，通常称为 GECOS (通用综合操作系统)字段。在大多数系统中，管理员将使用此字段放置分配给账户的人员姓名，但它也可以包含其他有用信息，例如电话分机或办公室位置。GECOS\
  \ 是一个利用特定命令填充和查看此字段的功能（参见本章稍后的“管理 GECOS”部分）。 |\n| /root | 用户的主目录。通常这应该是 `/home`\
  \ 目录下的一个目录（例如 `/home/bob`），但 root 用户有一个特殊的 `/root` 目录。 |\n\n\n\n\n\n| /bin/bash\
  \ | 这是用户的登录 shell。`/bin/bash` 的值表示用户在通过命令行登录或通过网络远程登录系统时，提供了一个典型的 BASH shell。其他常用的值还包括以下：\
  \ |\n* `/usr/sbin/nologin`: 用于守护进程账户（系统使用的、但不供普通用户登录的账户）。\n* `/bin/false`: 有时也用于守护进程账户。\n\
  * `/bin/tcsh`: 用于 TCSH（T shell，即 C shell 的增强版）账户。\n* `/bin/dash`: 用于 DASH（Debian\
  \ Almquist Shell）账户。\n* `/bin/rbash`: 用于受限 shell 账户（Restricted Shell Accounts）。有关更多信息，请参阅本章稍后的“受限\
  \ shell 账户”节。 |\n\n### 安全亮点\n\n通常，`/etc/passwd` 文件不会手动修改。管理员使用 `useradd`、`userdel`\
  \ 和 `usermod` 等命令来更改 `/etc/passwd` 文件的内容。然而，管理员可以选择手动修改 `/etc/passwd` 文件；这可能会导致文件中出现错误。要检查\
  \ `/etc/passwd` 文件是否存在错误，请以 root 用户身份登录并执行 `pwck` 命令。\n\n### 特殊用户\n\n一个典型的 Linux\
  \ 系统会有许多默认用户账户。这些默认用户账户的 UID 值通常小于 1000，使得管理员很容易识别出它们是特殊账户。\n\n这些默认账户中的一些被称为“守护进程账户”，因为它们被基于守护进程的软件使用。守护进程\
  \ 是在后台运行并执行特定系统任务的程序。\n\n其他默认账户可能存在用于为操作系统提供功能。例如，`nobody` 账户用于通过 NFS（网络文件系统)共享的文件应用权限。\n\
  \n此外，如果你向系统添加了新软件，可能会增加更多的用户，因为软件供应商会利用用户账户和组账户来实现对软件部分文件的受控访问。\n\n关注安全的管理员应该意识到这些默认用户账户，因为这些账户可能提供安全特性，也可能构成安全威胁。表\
  \ 7-2 突出了更重要的特殊组账户（涵盖所有默认用户已超出本书的范围）。\n\n### 表 7-2 默认用户账户\n\n| 组 | 描述 |\n| --- |\
  \ --- |\n| root | 此账户是系统管理员。需要注意的是，root 账户特殊之处在于 UID 为 0。任何 UID 为 0 的用户都是全系统管理员。作为安全提示，在执行审计时，请查找\
  \ UID 为 0 的用户，这是一种常见的黑客技术。 |\n| syslog | 此账户供系统日志守护进程访问文件。 |\n| lp | 这是许多用户（包括 mysql、mail、postfix\
  \ 和 dovecot）之一，操作系统通过这些名为守护进程的后台进程提供对特定文件的访问。 |\n| bind | 此用户由提供 DNS（域名系统）功能的软件使用。\
  \ |\n\n### 安全亮点\n\n作为管理员，你应该了解每个用户账户的设计用途。花时间查看你的 `/etc/passwd` 文件中列出的所有用户，并仔细考虑每个账户的影响。此外，在向系统添加软件后，检查\
  \ `/etc/passwd` 文件的内容以确定是否添加了新用户账户。如果新增了账户，请探索这些新账户的用途。\n\n## /etc/shadow 文件\n\n\
  `/etc/passwd` 文件包含了一些用户账户信息，但不包含密码信息。讽刺的是，这些密码数据存储在 `/etc/shadow` 文件中。该文件只有 root\
  \ 用户可见，这就是为什么关于密码的更敏感数据存储在 `/etc/shadow` 文件中。\n\n示例 7-2 展示了典型的 `/etc/shadow` 文件的部分。\n\
  \n### 示例 7-2 /etc/shadow 文件\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# head /etc/shadow\n\
  root:$6$5rU9Z/H5$sZM3MRyHS24SR/ySv80ViqIrzfhh.p1EWfOic7NzA2zvSjquFKi\nPgIVJy8/ba.X/mEQ9DUwtQQb2zdSPsEwb8.:17320:0:99999:7:::\n\
  daemon:*:16484:0:99999:7:::\nbin:*:16484:0:99999:7:::\nsys:*:16484:0:99999:7:::\n\
  sync:*:16484:0:99999:7:::\ngames:*:16484:0:99999:7:::\nman:*:16484:0:99999:7:::\n\
  lp:*:16484:0:99999:7:::\nmail:*:16484:0:99999:7:::\n```\n\n`/etc/shadow` 文件中的每一行描述一个用户的密码。每行使用冒号（:）作为分隔符分为多个字段。[表\
  \ 7-3](#ch07.xhtml_tab7_3）描述了这些字段。\n\n### 表 7-3 /etc/shadow 字段\n\n| 字段 | 描述 |\n\
  | --- | --- |\n| news | 用户账户字段：匹配 `/etc/passwd` 中的用户。 |\n| ***** | 密码字段：`*****`\
  \ 或 `!` 表示“未设置密码”。安全提示：如果此字段完全为空，则用户在提示密码时只需按回车即可登录。这带来了巨大的安全风险，因此在审计系统时，请查找没有密码的账户。\
  \ |\n| 16484 | 上次更改日期字段：此数字代表从 1970 年 1 月 1 日到用户上次更改密码的天数。1970 年 1 月 1 日被称为 Unix\
  \ 的*纪*（epoch），因为那是 Unix 发布的时间。该数值与其他行的其他字段结合使用，提供基本的密码过期功能。更多信息请见接两个字段。 |\n| 0 |\
  \ 最小密码年龄字段：此数字代表用户更改账户密码后必须经过多少天才能再次更改。例如，如果此字段设置为 5，则用户必须等待五天才能再次更改账户密码。该字段的存在是因为下一个字段的功能。\
  \ |\n| 99999 | 最大密码年龄字段：此字段代表用户必须更改账户密码之前可以经过的天数。例如，如果此字段设置为 60，则用户每隔 60 天必须更改一次账户密码。前一个字段的值可以防止用户在强制更改密码后立即将其改回原始密码。\
  \ |\n| 7 | 密码警告期字段：如果用户未在前一个字段指定的时间范围内更改密码，账户将被锁定。为了给用户提供警告，使用了此字段。该数值代表用户在登录系统时显示警告信息的天数，提醒用户在账户被锁定之前更改密码。\
  \ |\n\n\n\n\n\n| [示例中未设置] | **密码空闲期字段**：假设用户忽略了警告，并且在最大密码有效期之前没有更改密码。账户将被锁定，若要解锁，用户需要联系系统管理员。然而，如果设置了此字段的值，则会提供一个宽限期，用户可以在特定期间内登录（在超过最大密码有效期值后的若干天内）。这确实要求用户在登录过程中更改账户密码。\
  \ |\n| [示例中未设置] | **过期日期字段**：此值代表从 1970 年 1 月 1 日起到账户过期日期的天数。当到达过期日期时，账户密码将被封锁。该字段对于承包商账户或临时分配到特定公司组内工作的个人账户非常有用。\
  \ |\n| [示例中未设置] | **未使用字段**：目前最后一个字段未使用，但预留供未来以后使用。 |\n\n`/etc/shadow` 文件具有最小密码有效期、最大密码有效期、密码空闲等功能，这往往会让初学者\
  \ Linux 用户感到困惑。对于系统管理员来说，理解这个账户至关重要，因为它提供了重要的用户账户安全功能。图 7-1 所示的示例旨在帮助更好地理解 `/etc/shadow`\
  \ 文件的字段。\n\n![Image](img/07fig01.jpg)\n\n**图 7-1** *`/etc/shadow` 文件的字段*\n\n使用图\
  \ 7-1 中显示的示例记录的值，我们可以关于 `bob` 用户账户得出以下结论：\n\n*   它目前有一个被锁定的密码（`* = locked`）。\n\n\
  *   自 1970 年 1 月 1 日以来，距离上次更改账户密码（在本例中为锁定）已过去 16,484 天。请注意，我们在本章中将介绍一些工具，可以将标准日期转换为时间戳（epoch）日期。\n\
  \n*   用户必须每 90 天更改一次账户密码，并且该新密码必须至少保留三天。\n\n*   如果账户密码必须在五天内更改，用户在登录过程中会收到警告。\n\n\
  *   如果用户超过了 90 天的最大密码有效期，将有 30 天的宽限期。在接后的 30 天内，用户可以在登录过程中更改账户密码。\n\n*   账户将在 1970\
  \ 年 1 月 1 日起 16,584 天后过期（被锁定）。\n\n**对话式学习™——理解密码有效期**\n\n**Gary**：你好，Julia。我被一个关于用户密码的问题困住了。\n\
  \n**Julia**：什么问题了，Gary？\n\n**Gary**：有一个用户尝试更改密码，但他一直收到一条奇怪的错误信息。\n\n**Julia**：他是在使用\
  \ `passwd` 命令更改密码吗？\n\n**Gary**：是的。\n\n**Julia**：他收到了什么错误信息？\n\n**Gary**：“你必须等待一段时间才能更改密码。”\n\
  \n**Julia**：啊，我猜他可能最近更改过密码，现在又尝试将其更改为其他的？\n\n**Gary**：对。昨天命令还能用，但今天他就收到了那个错误信息。\n\
  \n**Julia**：好的，查看 `/etc/shadow` 文件，特别是包含该人员账户数据的行。看该行的第四字段。那里的值是多少？\n\n**Gary**：10。\n\
  \n**Julia**：这意味着用户在更改密码后必须等待十天才能再次更改。这防止了人们在系统强制他们更改新密码后，立即又改回之前的密码。\n\n**Gary**：但如果他真的需要更改这个设置呢？\n\
  \n**Julia**：没问题。管理员可以为用户进行更改。\n\n**Gary**：好的，太好了。谢谢你提供的信息！\n\n**Julia**：不客气！\n\n\
  ### 管理用户\n\n管理用户的过程包括创建新用户、修改现有用户以及删除用户。这些操作需要 root 提供的权限。\n\n### 创建用户\n\n使用 `useradd`\
  \ 命令创建一个新用户组：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# useradd timmy\nroot@onecoursesource:~#\
  \ tail -1 /etc/passwd\ntimmy:x:1003:1003::/home/timmy:\nroot@onecoursesource:~#\
  \ tail -1 /etc/shadow\ntimmy:!:17456:0:99999:7:::\n```\n\n关于 `useradd` 命令的一些重要说明：\n\
  \n*   可以使用 `-u` 选项为用户分配 UID。如果省略了 `-u` 选项，则将使用 1000 以上的可用 UID（在某些系统中，可能会使用 500 以上的下一个可用\
  \ UID）。\n\n*   注意，尽管 `/etc/passwd` 文件中的用户主目录设置为 `/home/timmy`，但该目录默认并没有创建。要创建此目录，你必须在执行\
  \ `useradd` 命令时使用 `-m` 选项。创建主目录也可以设置为默认；更多细节请参见本章稍后的“使用默认值”部分。\n\n*   新用户账户默认是锁定的（因此\
  \ `/etc/shadow` 的第二个字段为 `!`）。在创建后使用 `passwd` 设置密码。\n\n**表 7-4** 有用的 `useradd` 选项\n\
  \n| **选项** | **描述** |\n| :--- | :--- |\n| `-c` | 设置 `/passwd` 中的注释字段。 |\n| `-d`\
  \ | 指定用户的主目录而不是默认的 `/home/username`。 |\n| `-e` | 设置账户过期日期，格式为 `YYYY-MM-DD`。 |\n\
  | `-f` | 设置 `/etc/shadow` 中的空闲字段。 |\n| `-g` | 设置用户的主组。注意，如果系统使用用户专用组 (UPGs)，这将覆盖\
  \ UPG 功能。详情见第 6 章。 |\n| `-G` | 设置用户的辅助组。用逗号分隔每个组（例如 `-G games,staff`）。 |\n| `-k`\
  \ | 使用骨架目录。参见本章稍后的“目录”部分。 |\n| `-D` | 显示或设置默认值。参见本章稍后的“使用默认值”部分。 |\n| `-p` | 设置用户密码。由于安全问题，通常不使用此选项。此外，命令本身包含明文密码，查看屏幕、查看运行进程或查看\
  \ root 用户历史列表可以看到。 |\n| `-s` | 指定用户的登录 shell（例如 `-s /bin/tcsh`）。 |\n| `-u` | 指定用户的\
  \ UID。 |\n\n#### 可能会出现什么问题？\n\n在创建用户时，你必须使用当前未使用的 UID 和名称；否则你将收到错误，如下：\n\n点击此处查看代码图像\n\
  \n```\nroot@onecoursesource:~# useradd -u 1002 bob\nuseradd: UID 1002 is not unique\n\
  root@onecoursesource:~# useradd nick\nuseradd: user 'nick' already exists\n```\n\
  \n##### 设置账户密码\n\n创建用户账户后，你需要为用户设置密码。通过使用 `passwd` 命令实现：\n\n点击此处查看代码图像\n\n```\n\
  root@onecoursesource:~# tail -1 /etc/shadow\ntimmy:!:17456:0:99999:7:::\nroot@onecoursesource:~#\
  \ passwd timmy\nEnter new UNIX password:\nRetype new UNIX password:\npasswd: password\
  \ updated successfully\nroot@onecoursesource:~# tail -1 /etc/shadow\ntimmy:$6$29m4A.mk$WK/qVgQeJPrUn8qvVqnrbS2m9OCa2A0fx0N3keWM1BsZ9Ft\n\
  vfFtfMMREeX22Hp9wYYUZ.0DXSLmIIJQuarFGv0:17456:0:99999:7:::\n```\n\n\n\n\n你可以使用选项来更改创建用户的方式，但如果你不使用这些选项，通常会使用默认值。这些默认值中的某些可以通过在\
  \ `useradd` 命令上使用 `-D` 选项来查看：\n\n点击此此处查看代码图像\n\n```\nroot@onecoursesource:~# useradd\
  \ -D\nGROUP=100\nHOME=/home\nINACTIVE=-1\nEXPIRE=\nSHELL=/bin/sh\nSKEL=/etc/skel\n\
  CREATE_MAIL_SPOOL=no\n```\n\n这些值中的某些并不完全准确。例如，`GROUP=100` 的值本应表示“默认将用户放在 GID 为 100\
  \ 的组中”；然而，大多数现代 Linux 发行版使用用户私有组（User Private Groups），因此该值并没有被真正使用。但是，这些值中的某些（例如指示默认账户过期日期的\
  \ `EXPIRE` 值）是会被使用的。\n\n你可以通过编辑 `/etc/default/useradd` 文件中的值来更改这些设置。在 `/etc/logins.def`\
  \ 文件中可以查看和修改几个额外的默认设置。例如，示例 7-3 显示了与默认密码老化策略相关的设置。\n\n**示例 7-3** *默认密码老化策略*\n\n\
  点击此处查看代码图像\n\n```\nroot@onecoursesource:~# grep PASS /etc/login.defs\n#    PASS_MAX_DAYS\
  \    密码允许使用的最大天数。\n#    PASS_MIN_DAYS    密码更改之间允许的最小天数。\n#    PASS_WARN_AGE    密码过期前给予警告的天数。\n\
  PASS_MAX_DAYS    99999\nPASS_MIN_DAYS    0\nPASS_WARN_AGE    7\n#PASS_CHANGE_TRIES\n\
  #PASS_ALWAYS_WARN\n#PASS_MIN_LEN\n#PASS_MAX_LEN\n# NO_PASSWORD_CONSOLE\n```\n\n\
  ## 使用 Skel 目录\n\n创建用户账户只是过程的一部分。在许多情况下，在用户的家目录中放置特定的默认文件对用户有益。这可以通过使用骨架目录来实现。\n\n\
  当使用骨架目录时，指定目录的所有内容将被复制到新用户的家目录。被复制的文件也将自动归新用户所有，如示例 7-4 所示。\n\n**示例 7-4** *文件归新用户所有*\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -lA /etc/skel\ntotal 12\n-rw-r--r--\
  \   1 root root   220 Apr  8  2014 .bash_logout\n-rw-r--r--   1 root root  3637\
  \ Apr  8  2014 .bashrc\n-rw-r--r--   1 root root  675 Apr  8  2014 .profile\nroot@onecoursesource:~#\
  \ useradd -m -k /etc/skel steve\nroot@onecoursesource:~# ls -lA /home/steve\ntotal\
  \ 12\n-rw-r--r--   1 steve steve   220 Apr  8  2014 .bash_logout\n-rw-r--r--   1\
  \ steve steve  3637 Apr  8  2014 .bashrc\n-rw-r--r--   1 steve steve  675 Apr  8\
  \  2014 .profile\n```\n\n不同的目录可以用于不同类型的用户。例如，你可以创建一个名为 `/etc/skel_eng` 的目录，其中包含一个专为软件工程师设计的\
  \ `.bashrc` 文件。然后，你可以创建另一个名为 `/etc/skel_sales` 的目录，其中包含一个为销售人员设计的 `.bashrc` 文件。在为软件工程师创建账户时使用\
  \ `-k /etc/skel_eng` 选项，为销售人员创建账户时使用 `-k /etc/skel_sales` 选项。\n\n**注意**\n\n如果不使用\
  \ `-k` 选项，`useradd` 命令将把 `/etc/skel` 目录的内容复制到新账户中。\n\n### 修改用户\n\n作为管理员，你可以使用 `usermod`\
  \ 命令和与 `useradd` 命令相同类型的选项来修改用户账户。例如，如果你想更改用户的名称，请使用带有 `-c` 选项的 `usermod` 命令：\n\n\
  点击此处查看代码图像\n\n```\nroot@onecoursesource:~# grep timmy /etc/passwd\ntimmy:x:1003::/home/timmy:\n\
  root@onecoursesource:~# usermod -c \"Timmy\" timmy\nroot@onecoursesource:~# grep\
  \ timmy /etc/passwd\ntimmy:x:1003:Timmy:/home/timmy:\n```\n\n`usermod` 命令可以用于更改\
  \ `/etc/shadow` 文件的过期日期和活动字段，而 `chage` 命令可以使用选项更改额外的字段：\n\n| `-m` | 修改最小天数。 |\n\
  | `-M` | 修改最大天数。 |\n| `-d` | 修改修改日期（YYYY-MM-DD）。 |\n| `-I` | 修改活动天数。 |\n| `-E` |\
  \ 修改过期日期（YYYY-MM-DD）。 |\n| `-W` | 修改警告天数。 |\n\n### GECOS\n\n创建用户账户只是过程的一部分。在许多情况下，在用户的家目录中放置特定的默认文件对用户有益。这可以通过使用骨架目录来实现。\n\
  \n当使用骨架目录时，指定目录的所有内容将被复制到新用户的家目录。被复制的文件也将自动归新用户所有，如示例 7-4 所示。\n\nGECOS 是 `/etc/passwd`\
  \ 文件中的一个字段，通常被称为 GECOS（通用信息）。虽然在现代 Linux 系统中并不常用，但它允许用户通过 `chage` 命令更改自己的账户信息。\n\
  \n你可以通过编辑 `/etc/default/useradd` 文件中的值来更改这些设置。例如，示例 7-3 显示了与默认密码老化策略相关的设置。\n\n**示例\
  \ 7-3** *默认密码老化策略*\n\n（注：原文此处提到 Example 7-3 显示了与默认密码老化策略相关的设置，译文对应：**示例 7-3** *默认密码老化策略*）\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# grep PASS /etc/login.defs\n#    PASS_MAX_DAYS\
  \    密码允许使用的最大天数。\n#    PASS_MIN_DAYS    密码更改之间允许的最小天数。\n#    PASS_WARN_AGE    密码过期前给予警告的天数。\n\
  PASS_MAX_DAYS    99999\nPASS_MIN_DAYS    0\nPASS_WARN_AGE    7\n#PASS_CHANGE_TRIES\n\
  #PASS_ALWAYS_WARN\n#PASS_MIN_LEN\n#PASS_MAX_LEN\n# NO_PASSWORD_CONSOLE\n```\n\n\
  **示例 7-4** *文件归新用户所有*\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -lA /etc/skel\n\
  total 12\n-rw-r--r--   1 root root   220 Apr  8  2014 .bash_logout\n-rw-r--r-- \
  \  1 root root  3637 Apr  8  2014 .bashrc\n-rw-r--r--   1 root root  675 Apr  8\
  \  2014 .profile\nroot@onecoursesource:~# useradd -m -k /etc/skel steve\nroot@onecoursesource:~#\
  \ ls -lA /home/steve\ntotal 12\n-rw-r--r--   1 steve steve   220 Apr  8  2014 .bash_logout\n\
  -rw-r--r--   1 steve steve  3637 Apr  8  2014 .bashrc\n-rw-r--r--   1 steve steve\
  \  675 Apr  8  2014 .profile\n```\n\n（注：由于原文文本中存在部分错乱和重复，译文已根据逻辑进行了重新组排，以确保通顺且不重复内容。）\n\
  \n---\n*纠正说明：提供的原文文本存在严重的段落错乱（例如 GECOS 部分和修改用户部分交插在一起），上述高级文档工程师已根据技术文档逻辑进行了内容重组，以确保翻译结果符合逻辑性。*\n\
  \n**重新逻辑组排后完成的完整翻译如下：**\n\n[content]\n你可以使用选项来更改创建用户的方式，但如果你不使用这些选项，通常会使用默认值。这些默认值中的某些可以通过在\
  \ `useradd` 命令上使用 `-D` 选项来查看：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# useradd\
  \ -D\nGROUP=100\nHOME=/home\nINACTIVE=-1\nEXPIRE=\nSHELL=/bin/sh\nSKEL=/etc/skel\n\
  CREATE_MAIL_SPOOL=no\n```\n\n这些值中的某些并不完全准确。例如，`GROUP=100` 的值本应表示“默认将用户放在 GID 为 100\
  \ 的组中”；然而，大多数现代 Linux 发行版使用用户私有组（User Private Groups），因此该值并没有被真正使用。但是，这些值中的某些（例如指示默认账户过期日期的\
  \ `EXPIRE` 值）是会被使用的。\n\n你可以通过编辑 `/etc/default/useradd` 文件中的值来更改这些设置。在 `/etc/logins.def`\
  \ 文件中可以查看和修改几个额外的默认设置。例如，示例 7-3 显示了与默认密码老化策略相关的设置。\n\n**示例 7-3** *默认密码老化策略*\n\n\
  点击此处查看代码图像\n\n```\nroot@onecoursesource:~# grep PASS /etc/login.defs\n#    PASS_MAX_DAYS\
  \    密码允许使用的最大天数。\n#    PASS_MIN_DAYS    密码更改之间允许的最小天数。\n#    PASS_WARN_AGE    密码过期前给予警告的天数。\n\
  PASS_MAX_DAYS    99999\nPASS_MIN_DAYS    0\nPASS_WARN_AGE    7\n#PASS_CHANGE_TRIES\n\
  #PASS_ALWAYS_WARN\n#PASS_MIN_LEN\n#PASS_MAX_LEN\n# NO_PASSWORD_CONSOLE\n```\n\n\
  ## 使用 Skel 目录\n\n创建用户账户只是过程的一部分。在许多情况下，在用户的家目录中放置特定的默认文件对用户有益。这可以通过使用骨架目录来实现。\n\n\
  当使用骨架目录时，指定目录的所有内容将被复制到新用户的家目录。被复制的文件也将自动归新用户所有，如示例 7-4 所示。\n\n**示例 7-4** *文件归新用户所有*\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -lA /etc/skel\ntotal 12\n-rw-r--r--\
  \   1 root root   220 Apr  8  2014 .bash_logout\n-rw-r--r--   1 root root  3637\
  \ Apr  8  2014 .bashrc\n-rw-r--r--   1 root root  675 Apr  8  2014 .profile\nroot@onecoursesource:~#\
  \ useradd -m -k /etc/skel steve\nroot@onecoursesource:~# ls -lA /home/steve\ntotal\
  \ 12\n-rw-r--r--   1 steve steve   220 Apr  8  2014 .bash_logout\n-rw-r--r--   1\
  \ steve steve  3637 Apr  8  2014 .bashrc\n-rw-r--r--   1 steve steve  675 Apr  8\
  \  2014 .profile\n```\n\n不同的目录可以用于不同类型的用户。例如，你可以创建一个名为 `/etc/skel_eng` 的目录，其中包含一个专为软件工程师设计的\
  \ `.bashrc` 文件。然后，你可以创建另一个名为 `/etc/skel_sales` 的目录，其中包含一个为销售人员设计的 `.bashrc` 文件。在为软件工程师创建账户时使用\
  \ `-k /etc/skel_eng` 选项，为销售人员创建账户时使用 `-k /etc/skel_sales` 选项。\n\n**注意**\n\n如果不使用\
  \ `-k` 选项，`useradd` 命令将把 `/etc/skel` 目录的内容复制到新账户中。\n\n### 修改用户\n\n作为管理员，你可以使用 `usermod`\
  \ 命令和与 `useradd` 命令相同类型的选项来修改用户账户。例如，如果你想更改用户的名称，请使用带有 `-c` 选项的 `usermod` 命令：\n\n\
  点击此处查看代码图像\n\n```\nroot@onecoursesource:~# grep timmy /etc/passwd\ntimmy:x:1003::/home/timmy:\n\
  root@onecoursesource:~# usermod -c \"Timmy\" timmy\nroot@onecoursesource:~# grep\
  \ timmy /etc/passwd\ntimmy:x:1003:Timmy:/home/timmy:\n```\n\n`usermod` 命令可以用于更改\
  \ `/etc/shadow` 文件的过期日期和活动字段，而 `chage` 命令可以使用选项更改额外的字段：\n\n| `-m` | 修改最小天数。 |\n\
  | `-M` | 修改最大天数。 |\n| `-d` | 修改修改日期（YYYY-MM-DD）。 |\n| `-I` | 修改活动天数。 |\n| `-E` |\
  \ 修改过期日期（YYYY-MM-DD）。 |\n| `-W` | 修改警告天数。 |\n\n### GECOS\n\nGECOS 是 `/etc/passwd`\
  \ 文件中的一个字段，通常被称为 GECOS（通用信息）。虽然在现代 Linux 系统中并不常用，但它允许用户通过 `chage` 命令更改自己的账户信息。\n\
  \n然而，这种功能可能会导致安全风险，因为它赋予了用户修改 `/etc/passwd` 文件的能力。为了安全，你可能会考虑关闭此功能。移除此功能的简单方法是更改\
  \ `chage` 程序的权限：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -l /usr/bin/chage\n\
  -rwsr-xr-x 1 root root 46424 Feb  16  2014 /usr/bin/chage\nroot@onecoursesource:~#\
  \ chmod u-s /usr/bin/chage\nroot@onecoursesource:~# ls -l /usr/bin/chage\n-rwxr-xr-x\
  \ 1 root root 46424 Feb  16  2014 /usr/bin/chage\n```\n\n### 删除用户\n\n删除用户账户是通过执行\
  \ `userdel` 命令完成的。然而，在删除用户之前，你需要做一个决定：你是只想删除 `/etc/passwd` 和 `/etc/shadow` 文件中的账户，还是也想删除用户的家目录和邮件池？\n\
  \n在某些情况下，保留用户的家目录对接替该用户的人有用。邮件池（包含入站邮件）对于审计或法律责任考虑可能是必要的。\n\n要移除用户并保留其家目录和邮件池，请在不带任何额外参数的情况下使用\
  \ `userdel` 命令：\n\n\n\n\n```\nroot@onecoursesource:~# userdel steve\n```\n\n要删除用户及其家目录和邮件邮箱池，请在\
  \ `userdel` 命令中包含 `-r` 选项。\n\n### 受限 shell 账户 (Restricted Shell Accounts)\n\n在某些情况下，你可能希望为特定用户提供非常有限的系统访问权限。例如，假设你有一个访客用户，他们只需要对系统进行有限访问（例如为了协助需要网络测试的硬件维修）。或者，你创建了一个基于亭机（kiosk）的系统，只希望用户执行非常特定的任务，例如预订租汽车或查看他们的学生课程。\n\
  \n在这些情况下，你应该考虑创建一个受限的 shell 账户。这种账户利用 BASH shell，但有许多重要的限制，包括以下内容：\n\n* 用户不能使用 `cd`\
  \ 命令更改目录。\n* 用户不能更改以下变量的值：`SHELL`、`PATH`、`ENV` 和 `BASH_ENV`。\n* 用户不能运行任何以 `/` 字符开头的路径的命令（例如\
  \ `/bin/bash`）。\n* 用户不能将输出重定向到文件。\n\n在 `rbash` 的 man 页面中还可以查看额外的限制。然而，重点是受限 shell\
  \ 账户的限制非常大，它只能访问内置命令以及通过 `PATH` 变量提供的命令。\n\n要创建一个受限的 shell 账户，请使用 `useradd` 命令的\
  \ `-s` 选项并提供参数 `/bin/rbash` 参数：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# useradd\
  \ -m -s /bin/rbash limited\n```\n\n接下来，修改账户使用户对命令具有有限的访问权限。例如，如果你只想让用户运行来自 `/bin`\
  \ 目录的命令，可以在用户的 `.bashrc` 文件末尾添加以下内容：\n\n```\nPATH=/bin\n```\n\n这也可以被设置为你复制了特定命令的目录，而不是整个\
  \ `/bin` 目录。一旦用户登录，他们可以执行的命令将受到限制。例如，`ls` 命令位于 `/bin` 目录，因此是允许的。然而，`vi` 命令位于 `/usr/bin`\
  \ 目录，而不是 `/bin` 目录，因此它将执行失败：\n\n点击此处查看代码图像\n\n```\nlimited@onecoursesource:~$ ls\n\
  limited@onecoursesource:~$ vi\n-rbash: /usr/lib/command-not-found: restricted: cannot\
  \ specify\n'/' in command names\n```\n\n### 安全要点 (Security Highlight)\n\n微调受限账户以提供恰恰的访问权限需要实践和一些经验。建议从有限的命令开始，并根据需要添加更多命令。\n\
  \n### 基于网络的用户账户 (Network-Based User Accounts)\n\n在本书的目前这部分，对基于网络的账户进行全面讨论还为时过早。通用的网络主题以及提供基于网络账户的服务尚未涵盖。因此，本章的讨论更多是基于理论。随后的几个章节——特别是第\
  \ 19 章“网络配置”——将更详细地涵盖这些主题。\n\n使用基于网络的账户将用户登录到不同的系统，需要在你希望用户登录的系统与提供登录信息的服务器之间建立客户端-服务器关系。Linux\
  \ 平台有多种不同的登录服务器，包括：\n\n* **LDAP (轻量级目录访问协议)**：LDAP 服务器可以同时提供用户和组账户数据，以及由 LDAP 管理员定义的其他数据。它是\
  \ Linux 发行版中用于网络账户常用的服务器。\n* **NIS (网络信息服务)**：虽然没有 LDAP 灵活，但 NIS 具有易于设置和管理的优势。然而，担心安全的管理员通常会因为其安全问题而避免使用\
  \ NIS。\n* **Active Directory 和 Samba**：Active Directory 是微软的一产品，而 Samba 是一个基于 Linux\
  \ 的服务，可以利用 Active Directory 允许用户使用 Active Directory 服务器登录 Linux 系统。由于对 Active Directory\
  \ 进行的更改没有考虑到 Linux 系统的结构，这可能是一个复杂的配置。\n\n当系统可以使用服务器进行基于网络的账户时，本地账户仍然可用。然而，考虑到可能会发生冲突，有一种方法可以指示先访问哪个位置的账户信息。这是通过\
  \ `/etc/nsswitch.conf` 文件中的设置来实现，该文件是名为 NSS (名称服务切换) 的本地服务的配置文件。例如，`/etc/nsswitch.conf`\
  \ 文件中的以下设置将在用户尝试登录时，将首先引用本地数据库文件（`/etc/passwd`、`/etc/shadow` 和 `/etc/group`）：\n\n\
  点击此处查看代码图像\n\n```\npasswd:         files ldap\ngroup:          files ldap\nshadow:\
  \         files ldap\n```\n\n如果在本地文件中未找到用户的账户信息，将使用 LDAP 服务器。关于基于网络的账户的更多详细信息可以在第\
  \ 19 章中找到。\n\n### 使用 su 和 sudo (Using su and sudo)\n\n作为管理员，你经常通过登录特定用户来测试账户。然而，root\
  \ 用户是唯一一个不需要知道被切换账户密码就可以使用 `su` 命令的用户。例如，如下：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ id\nuid=0(root) gid=0(root) groups=0(root)\nroot@onecoursesource:~# su - student\n\
  student@onecoursesource:~$ id\nuid=1002(student) gid=1002(student)\ngroups=1002(student),4(adm),60(games),1001(ocs)\n\
  ```\n\n`su` 命令打开了一个新的 shell，其中身份已切换到新用户（在这种情况下是 student 用户）。要返回原始账户，使用 `exit` 命令关闭\
  \ shell，如下：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ id\nuid=1002(student)\
  \ gid=1002(student)\ngroups=1002(student),4(adm),60(games),1001(ocs)\nstudent@onecoursesource:~$\
  \ exit\nlogout\nroot@onecoursesource:~# id\nuid=0(root) gid=0(root) groups=0(root)\n\
  ```\n\n配合 `su` 命令使用的 `-` 选项具有特殊用途。它允许你像直接登录到另一个用户账户一样切换到该账户。这会导致在提供新 shell 之前执行该用户所有的初始化文件。通常这是最理想的行为，但如果你有理由不运行所有初始化文件，请省略\
  \ `su` 命令的 `-` 选项。\n\nroot 用户不是唯一可以使用 `su` 命令的用户，但它是唯一不需要知道被切换账户密码的账户。例如，假设你作为普通用户登录，并想以\
  \ root 用户身份执行命令。你可以使用 `su` 命令获取 root 账户的访问权限，但会被提示输入 root 密码，如下：\n\n点击此处查看代码图像\n\
  \n```\nstudent@onecoursesource:~$ su - root\nPassword:\nroot@onecoursesource:~#\n\
  ```\n\n\n\n\n以 root 用户身份登录执行任务是一个坏习惯。你这样做得越频繁，系统就越容易受到攻破。例如，假设你每天都以 `root` 用户身份登录，然后某天你去喝咖啡休息，留下了终端暴露在外面。正如你所想象到的，以普通用户身份登录，然后使用\
  \ `su` 命令执行特定的管理命令要好得多。此外，一旦在任务完成后，你应该立即退出特权壳（privileged shell）。\n\n在某些情况下，你可能希望赋予某些用户以管理员身份执行特定任务的能力。这就是\
  \ `sudo` 命令的用途。通过 `sudo` 命令，授权的用户可以以管理员身份执行特定命令，如示例 7-6 所示。\n\n### 示例 7-6：使用 `sudo`\
  \ 命令\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ apt-get install joe\nE: Could\
  \ not open lock file /var/lib/dpkg/lock - open (13:Permission denied)\nE: Unable\
  \ to lock the administration directory (/var/lib/dpkg/), are you root?\nstudent@onecoursesource:~$\
  \ sudo apt-get install joe\n[sudo] password for student:\nReading package lists...\
  \ Done\nBuilding dependency tree\nReading state information... Done\nThe following\
  \ NEW packages will be installed:\n  joe\n0 upgraded, 1 newly installed, 0 to remove\
  \ and 575 not upgraded.\nNeed to get 351 kB of archives.\nAfter this operation,\
  \ 1,345 kB of additional disk space will be used.\nGet:1 http://us.archive.ubuntu.com/ubuntu/\
  \ trusty/universe joe amd64 3.7-2.3ubuntu1\n[351 kB]\nFetched 351 kB in 0s (418\
  \ kB/s)\nSelecting previously unselected package joe. (Reading database ... 172002\
  \ files and\ndirectories currently installed.)\nPreparing to unpack .../joe_3.7-2.3ubuntu1_amd64.deb\
  \ ...\nUnpacking joe (3.7-2.3ubuntu1) ...\nProcessing triggers for man-db (2.6.7.1-1ubuntu1)\
  \ ...\nSetting up joe (3.7-2.3ubuntu1) ...\nupdate-alternatives: using /usr/bin/joe\
  \ to provide /usr/bin/editor (editor) in auto mode\nstudent@onecoursesource:~$\n\
  ```\n\n注意，在示例 7-6 中，学生用户最初无法运行 `apt-get` 命令。该命令用于在系统上安装软件，需要管理员权限。使用 `sudo` 命令临时提升了学生用户的权限，以允许以\
  \ `root` 用户身份执行 `apt-get` 命令。\n\n同时注意示例 7-6 中的高亮区域，在这些区域中学生用户被要求输入密码。这是学生账户的密码，而不是\
  \ `root` 账户的密码。如果在执行此命令之前已经设置了 `sudo` 访问权限，那么学生用户不需要知道 `root` 密码。\n\n这种访问权限配置在一个名为\
  \ `/etc/sudoers` 的文件中。为了给学生账户提供访问权限，在该文件中创建了以下条目：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ grep student /etc/sudoers\nstudent ALL=/usr/bin/apt-get\n```\n\n该行的格式为 `account_name\
  \ SYSTEM=*=command`。`account_name` 和 `command` 都是自俗易懂的，但 `SYSTEM` 值需要稍微解释一下。这可能是该配置行有效的系统主机名。在这种情况下，它可能被设置为“onecoursesource”，因为这是当前系统的主机名。然而，如果将此\
  \ `/etc/sudoers` 文件复制到另一个系统，则必须对该文件进行更新。在这里使用 `ALL` 作为值意味着“无论此文件位于哪个系统上，此行都适用”。\n\
  \n注意，不应直接修改 `/etc/sudoers` 文件，而应该使用 `visudo` 命令。该命令会执行基础的语法检查，并在出现问题时发布错误消息：\n\n\
  点击此处查看代码图像\n\n```\n>>> /etc/sudoers: syntax error near line 22 <<<\nWhat now?\n\
  Options are: ?\n  (e)dit sudoers file again\n  e(x)it without saving changes to\
  \ sudoers file\n  (Q)uit and save changes to sudoers file (DANGER!)\n\nWhat now?\
  \ x\nroot@onecoursesource:~#\n```\n\n另外注意，只有 `root` 用户可以编辑 `/etc/sudoers` 文件。\n\n\
  ### 安全要点\n\n对 `sudo` 的完整讨论超出了本书的范围。它是一个具有许多配置选项和功能的强大工具。考虑通过探索 `sudo` 和 `visudo`\
  \ 命令的文档（man 页面和 info 页面）以及 `sudoers` 文件来自己研究这个课题。\n\n最重要的是，仅在需要时才提供 `sudo` 访问权限。过多的权限会导致严重的安全风险。\n\
  \n### 限制用户账户\n\n可以使用几种方法来限制用户账户，包括文件权限和 SELinux。这些主题将在后面的章节中讨论，但现在有必要介绍一个可插认证模块\
  \ (PAM)。\n\nPAM 是一个强大的工具，允许管理员对用户账户提供许多限制。例如：\n\n- PAM 可以根据时间或日期限制访问系统。\n- PAM 可以在用户登录后限制资源使用，包括用户可以运行多少个进程或进程可以使用多少内存。\n\
  - PAM 可以应用于特定的登录命令。这允许在本地登录和远程登录时采用不同的规则。\n- PAM 可以为特定的登录事件创建额外的日志记录。\n\n前面的列表详细介绍了\
  \ PAM 可以提供的部分功能。PAM 是一组库，由本地登录、SSH（安全外壳）和 FTP（文件传输协议）等认证软件调用。基本上，每当用户账户需要认证时，都会使用\
  \ PAM 库来验证用户。\n\nPAM 有一个主配置文件（`/etc/pam.conf`），但很少被使用。相反，每个基于认证的程序在 `/etc/pam.d`\
  \ 目录下都有独立的配置文件，如示例 7-7 所示。\n\n#### 示例 7-7：`/etc/pam.d` 目录\n\n点击此处查看代码图像\n\n```\n\
  root@onecoursesource:~# ls /etc/pam.d\naccountsservice      cups-daemon        \
  \     login\natd                   dovecot                 newusers\nchfn      \
  \            gdm                     other\nchpasswd              gdm-autologin\
  \           passwd\nchsh                  gdm-launch-environment  other\ngdm-password\
  \          gnome-screensaver       polkit-1\ncommon-account        imap        \
  \            pop3\ncommon-auth           ppp                     samba\ncommon-password\
  \       lightdm                 sshd\ncommon-session       lightdm-greeter     \
  \    su\ncommon-session-noninteractive lightdm-autologin  sudo\ncron           \
  \       systemd-logind\n```\n\n你在此目录下看到的文件取决于安装了哪些软件。例如，`ls` 命令是在安装 FTP 服务器之前执行的。示例\
  \ 7-8 突出了在安装 vsftpd 软件后出现的一个新文件。\n\n#### 示例 7-8：安装 vsftpd 后新文件\n\n\n\n\n```\nroot@onecoursesource:~#\
  \ ls /etc/pam.d\naccountsservice                dovecot                 other\n\
  atd                            gdm                     passwd\nchfn            \
  \               gdm-autologin           polkit-1\nchpasswd                     \
  \  gdm-launch-environment  pop3\nchsh                           gdm-password   \
  \         ppp\ncommon-account                 gnome-screensaver       samba\ncommon-auth\
  \                    imap                    sshd\ncommon-password             \
  \   lightdm                 su\ncommon-session                 lightdm-autologin\
  \       sudo\ncommon-session-noninteractive  lightdm-greeter         vsftpd\ncron\
  \                           login\ncups-daemon                    newusers\n```\n\
  \n为了理解 PAM 是如何工作的，我们将关注一个单一服务：Secure Shell (SSH)。一个 Secure Shell 的 PAM 配置示例（不包含注释行和空行）如\
  \ 示例 7-9 所示。\n\n**示例 7-9** *SSH 示例 PAM 配置文件*\n\n点击此此处查看代码图片\n\n```\nroot@onecoursescourses:~#\
  \ grep -v \"^#\" /etc/pam.d/sshd | grep -v \"^$\"\n@include common-auth\naccount\
  \    required     pam_nologin.so\n@include common-account\nsession [success=ok ignore=ignore\
  \ module_unknown=ignore default=bad]\npam_selinux.so close\nsession    required\
  \     pam_loginuid.so\nsession    optional     pam_keyinit.so force revoke\n@include\
  \ common-session\nsession    optional     pam_motd.so  motd=/run/motd.dynamic noupdate\n\
  session    optional     pam_motd.so # [1]\nsession    optional     pam_mail.so standard\
  \ noenv # [1]\nsession    required     pam_limits.so\nsession    required     pam_env.so\
  \ # [1]\nsession    required     pam_env.so user_readenv=1 envfile=/etc/default/locale\n\
  session [success=ok ignore=ignore module_unknown=ignore default=bad]\npam_selinux.so\
  \ open\n@include common-password\n```\n\n每一行代表一条 PAM 规则。行有两种类型：具有三个或四个值的标准行（如 `account\
  \ required pam_nologin.so`），以及用于从另一个文件中引入更多规则的 `@include` 行。\n\n对于标准行，其三个可能的值描述在\
  \ 表 7-5 中。\n\n**表 7-5** PAM 值\n\n| **值 (Value)** | **描述 (Description)** |\n| ---\
  \ | --- |\n| 类别 | 可以是 `account`、`auth`、`password` 或 `session`。详情见表 7-6。 |\n| 控制\
  \ (Control) | 用于确定当模块值返回“失败”时采取什么操作。详情见表 7-7。 |\n| 模块 (Module) | 库（在 PAM 中技术称为 `module`），它执行特定任务并返回“成功”或“失败”。有很多可用的模块，每个模块都设计用于执行与用户验证相关的特定任务。\
  \ |\n| 参数 (Argument(s)) | 传递给模块的参数，用于更改模块的行为。某些模块不使用参数，而其他模块可能需要。在某种意义上，这非常类似于你发送给在\
  \ shell 中执行的命令的参数。 |\n\n##### PAM 类别\n\n类别本质上是 PAM 可以执行的四个主要操作之一。这些在表 7-6 中进行了更详细的描述。\n\
  \n**表 7-6** PAM 类别\n\n| **类别 (Category)** | **描述 (Description)** |\n| --- | ---\
  \ |\n| `account` | 用于验证用户是否有权使用某项服务。这可能包括检查用户可以通过网络或在特定时间登录。 |\n| `auth` | 用于验证（即确认）用户确实是其声称的身份，通常是让用户为其尝试使用的账户提供密码。\
  \ |\n| `password` | 用于更新身份验证方法，例如为账户提供新密码。 |\n| `session` | 用于在为用户服务之前和之后执行操作。例如，这可以限制用户账户的访问。\
  \ |\n\n需要注意的是，当身份验证程序发出认证请求时，该程序会要求执行特定类别的模块。例如，如果用户通过 SSH 登录，那么 SSH 工具将首先尝试验证用户用户名。这是通过要求\
  \ PAM 运行 `account` 类别中的模块完成的。如果所有这些模块运行成功，然后 SSH 工具将尝试验证用户，可能通过验证用户是否为账户提供了正确的密码（SSH\
  \ 还有其他方法）。这是通过要求 PAM 运行 `auth` 类别中的模块完成的。\n\n假设这些模块返回“成功”，SSH 工具可能会运行 `session`\
  \ 模块来建立用户的会话。使用“可能”一词是因为调用哪些 PAM 类别以及何时调用取决于编写 SSH 工具的开发者。作为管理员，由你来精细调整调用哪些模块，以自定义用户如何被授予访问权限的方式。\n\
  \n##### 控制值 (Control Values)\n\n决定一个类别是否成功的取决于控制值。这些值在表 7-7 中进行了更详细的描述。\n\n**表 7-7**\
  \ PAM 控制\n\n| **控制 (Control)** | **描述 (Description)** |\n| --- | --- |\n| `requisite`\
  \ | 如果模块返回“失败”，则不再执行后续的模块。 |\n| `required` | 如果模块返回“失败”，将继续执行后续模块，但该类别最终将返回“失败”。\
  \ |\n| `sufficient` | 如果模块返回“成功”，则不再执行后续模块，该类别将返回“成功”。然而，如果之前的 `required` 模块返回了“失败”，则此结果被忽略。\
  \ |\n| `optional` | 该模块的结果并不重要，除非它是该服务的唯一模块。 |\n\n注意，你可能会遇到更复杂的控制类型，你可以在下面的示例中看到：\n\
  \n点击此此处查看代码图片\n\n```\nroot@onecoursesource:~# grep ^auth /etc/pam.d/common-auth\n\
  auth    [success=1 default=ignore]    pam_unix.so nullok_secure\nauth    requisite\
  \            pam_deny.so\nauth    required            pam_permit.so\nauth    optional\
  \            pam_cap.so\n```\n\n`[success=1 default=ignore]` 控制类型允许管理员进一步调 PAM 的行为，但这非常复杂，超出了本书的范围。如果你查阅\
  \ `pam.conf` 的手册，你会发现有很多这样的复杂控制值。对于本书来说，我们关注的是四个主要的类别。\n\n##### PAM 模块\n\nPAM 模块是实际执行的代码。每个模块执行特定任务并返回“成功”或“失败”。一些实用的\
  \ PAM 模块在表 7-8 中进行了描述。\n\n**表 7-8** 实用的 PAM 模块\n\n| **模块 (Module)** | **描述 (Description)**\
  \ |\n| --- | --- |\n| `pam_access` | 用于“基于位置”的访问控制 |\n\n\n\n\n## PAM 模块概述\n\n| `pam_cracklib`\
  \ | 用于修改密码策略 |\n| :--- | --- |\n| `pam_deny` | 始终返回“失败”结果 |\n| `pam_env` | 用于设置环境变量\
  \ |\n| `pam_mkhomedir` | 用于创建主目录 |\n| `pam_nologin` | 用于判断用户的登录 shell 是否为 `/etc/nologin`\
  \ |\n| `pam_tally` | 用于统计登录尝试 |\n| `pam_time` | 用于“基于时间”的访问控制 |\n| `pam_timestamp`\
  \ | 根据最后登录时间控制访问 |\n| `pam_unix` | 用于标准用户认证 |\n\n### 安全亮点\n\nPAM 配置文件已经包含了几个被身份验证软件使用的\
  \ PAM 模块。你可能想要了解这些模块的作用，我们也鼓励你对其进行探索。然而，在你不理解这些模块并意识到此类更改对身份验证软件的影响之前，请不要在配置文件中更改或删除这些模块。\n\
  \n本书重点介绍如何对其中一些 PAM 模块进行特定更改，以及向配置文件添加关键的 PAM 模块。并不是每个 PAM 模块都会被详细介绍。\n\n### 使用\
  \ PAM 修改密码策略\n\nPAM 的一个常见用途是修改默认密码策略。如表 7-9 所示，你可以为 `pam_cracklib` 模块提供参数来修改许多密码设置。\n\
  \n### 表 7-9 `pam_cracklib` 密码设置\n\n| 参数 | 说明 |\n| --- | --- |\n| `difok=N` | 新密码中必须有多少个字符不同。\
  \ |\n| `difignore=N` | 在忽略 `difok` 设置的限制之前，新密码中需要包含多少个字符。 |\n| `minlen=N` | 密码允许的最小字符数。\
  \ |\n| `retry=N` | 在显示错误消息之前提示用户的次数（默认为 1）。 |\n| `type=name` | 更改密码时显示给用户的消息内容（默认为\
  \ Unix）。 |\n\n`minlen` 参数与四个额外的参数配合使用：`dcredit`（数字计数）、`lcredit`（小写字母计数）、`ocredit`（其他字符计数）和\
  \ `ucredit`（大写字母计数）。这些项目中的每一个都可以分配一个值，用于“计入”密码最小字符数的要求。\n\n例如，以下配置要求密码长度至少为 12 个字符，但使用一个大写字母算作\
  \ 12 个字符最小限制中的三个（使用多个大写字母不会提供额外的额度）：\n\n点击此处查看代码图片\n\n```\npassword    required\
  \    pam_cracklib.so minlen=12 ucredit=3\n```\n\n### 注意\n\n并不是所有的 Linux 发行版都默认安装了\
  \ cracklib 模块。在使用基于 Debian 的系统时，以 root 用户身份执行以下命令安装此模块（如果需要）：`apt-get install libpam-cracklib`。在基于\
  \ Red Hat 的系统上，运行此命令：`yum install libpam-cracklib`。\n\n#### 会出现什么问题？\n\n更改 PAM 配置文件时要非常小心。你很容易锁定\
  \ root 账户。建议在更改 PAM 配置文件后，应保持对系统的登录状态，并尝试作为 root 用户单独登录，以确认你仍然可以访问系统。此外，在对配置文件进行任何更改之前，务必始终备份该文件，以便于将其还原为原始值。\n\
  \n除了 `pam_cracklib` 库，你还可以使用 `pam_unix` 库来修改密码策略。例如，你可以使用 `remember=N` 参数让 PAM 记住\
  \ `N` 个密码（这样用户就不能重复相同的密码）。旧密码以加密格式存储在 `/etc/security/opasswd` 中。\n\n以下是 `/etc/pam.d/common-password`\
  \ 文件中密码设置的示例：\n\n点击此处查看代码图片\n\n```\nPassword    required    pam_cracklib.so minlength=12\
  \ ucredit=3\ntype=Linux\npassword    [success=1 default=ignore]    pam_unix.so obscure\n\
  use_authtok try_first_pass sha512 remember=7\n```\n\n### 总结\n\nLinux 操作系统使用用户账户控制对关键组件（包括文件和目录）的访问。在本章中，你学习了如何管理这些用户账户。这包括如何创建、修改、保护和删除用户账户，以及如何使用特殊的组账户功能（包括限制用户账户）。\n\
  \n## 关键术语\n\n- daemon\n- NFS\n- skel directory\n- GECOS\n- LDAP\n- NIS\n- Active\
  \ Directory\n- Samba\n- NSS\n- PAM\n\n## 复习题\n\n**1** Linux 操作系统使用用户账户控制对关键组件（包括文件和目录）的访问。在本章中，你学习了如何管理这些用户账户。这包括如何创建、修改、保护和删除用户账户，以及如何使用特殊的组账户功能（包括限制用户账户）。\n\
  \n**2** PAM 配置文件已经包含了几个被身份验证软件使用的 PAM 模块。\n\n**3** 更改 PAM 配置文件时要非常小心。你很容易锁定 root\
  \ 账户。建议在更改 PAM 配置文件后，应保持对系统的登录状态，并尝试作为 root 用户单独登录，以确认你仍然可以访问系统。此外，在对配置文件进行任何更改之前，务必始终备份该文件，以便于将其还原为原始值。\n\
  \n**4** 除了 `pam_cracklib` 库，你还可以使用 `pam_unix` 库来修改密码策略。例如，你可以使用 `remember=N` 参数让\
  \ PAM 记住 `N` 个密码（这样用户就不能重复相同的密码）。旧密码以加密格式存储在 `/etc/security/opasswd` 中。\n\n**5**\
  \ 下方的安全亮点：本书重点介绍如何对其中一些 PAM 模块进行特定更改，以及向配置文件添加关键的 PAM 模块。并不是每个 PAM 模块都会被详细介绍。`minlen`\
  \ 参数与四个额外的参数配合使用：`dcredit`（数字计数）、`lcredit`（小写字母计数）、`ocredit`（其他字符计数）和 `ucredit`（大写字母计数）。这些项目中的每一个都可以分配一个值，用于“计入”密码最小字符数的要求。\n\
  \n\n\n\n大多数人认为“安全”是旨在防止黑客进入系统的设计，但它实际上包含的内容远多于此。在安全方面，你的目标是确保正确的实体可以使用系统、服务和数据，同时拒绝未经授权的实体访问这些资源。\n\
  \n我们使用 `entities`（实体）一词，是因为我们指的不仅仅是人。例如，你可能有一个向其他系统提供用户账户信息的服务。这些信息不应该提供给不应拥有访问权的系统。因此，对该服务及其提供的数据的访问是针对特定系统的，而不是特定个人的。\n\
  \n你还必须在确保系统安全和可用性之间找到合适的平衡。换句话说，如果你将系统锁得太死，以至于授权实体无法获得所需的访问，那么你本质上降低了系统的安全性。\n\n\
  你还必须关注可能尝试获取未经授权访问的授权用户。内部用户具有优势，因为他们已经通过使用自己的账户获得了访问，已经越过了一层安全防线。他们通常会被默认信任，因此安全人员和管理员往往会忽视他们作为未经授权访问的来源。\n\
  \n外部黑客也可能尝试通过让系统拒绝授权实体访问来破坏你的安全（实际上，内部黑客也可能这样做）。有些人非常乐此于让关键服务器（如你的 Web 服务器）无法访问，或者发布令人害脸的消息来损害公司的声誉。\n\
  \n显然，在制定保护你的 `Linux` 系统的计划时有许多因素需要考虑，你会发现没有哪一本书能解决所有问题。但是，让我们假设真的有这样一本书，并且假设你遵循了这本魔法书籍提供的每一条建议。即便如此，你的系统也不会是\
  \ 100% 安全的。有人有足够的时间、资源和知识，总有办法可以破解系统。保护系统是一项永不完工的工作，随着你学习越多并发现新技术，安全计划应该经过持续的修订。\n\
  \n将保护 `Linux` 系统或网络考虑为类似于保护银行是恰妥的。你可能看过电影或电视节目，其中复杂的银行安全系统被非常聪明且有决心的小偷破解了。你的目标是让你的系统变得足够安全，以至于需要非常聪明且有决心的黑客才有机会破解它。\n\
  \n## 创建安全策略\n\n良好的安全策略应该为管理员和用户提供一个可以遵循的蓝图。它至少应该包含以下内容：\n\n* 一组决定系统上允许和不允许操作的规则。例如，这组规则可以描述所有用户必须遵循的密码策略。\n\
  * 一种确保所有规则都被遵守的手段。这可能包括主动运行探测系统安全的程序，以及查看系统日志文件以发现可疑活动。\n* 一个定义良好的计划，用于处理系统被破解时的情况：通知谁、应该采取哪些行动，等等。这通常被称为\
  \ `incident response plan`（事件响应计划）。\n* 一种在获得新信息时积极更改策略的方法。这些信息应该被主动寻求。例如，大多数发行版都有方法可以了解新的漏洞和工具（如补丁和更新），以及处理这些漏洞的技术。\n\
  \n### 账户安全\n\n在保护用户账户安全时，你必须考虑几个组成部分。这些包括以下内容：\n\n* 系统或网络的物理安全\n* 用户教育\n* 确保账户不易受到攻击\n\
  \n### 物理安全\n\nIT 安全人员往往会忽略将物理安全考虑为安全策略的一部分。这有时是因为他们认为“物理安全不是 IT 部门的责任”，因为许多公司有专门的部门负责物理安全。如果是如此，这两个部门应该合作以确保获得最佳的整体安全策略。如果情况不是这样，那么物理安全可能完全是\
  \ IT 部门的责任。\n\n在制定包含物理安全的策略时，你应该考虑以下点：\n\n* 确保对你组织内系统的物理安全，特别是任务关键服务器，如邮件服务器和 Web\
  \ 服务器。务必考虑哪些系统具有修改其他系统所需的访问权限和权威。\n* 确保对网络的物理安全。未经授权的人不应具有任何网络资产的物理访问权限。\n* 防止未经授权的人查看你的系统，特别是终端窗口。黑客可以从查看键盘输入和终端窗口上显示的数据中收集信息。这些信息可以被用来破坏安全性。\n\
  * 为任务关键系统的 `BIOS` 设置密码保护，特别是当这些系统无法获得 100% 物理安全的情况下。\n* 保护系统免受盗窃和硬件错误。\n\n物理安全的许多其他方面需要你考虑。本节的目的是鼓励你考虑将物理安全作为你保护系统的一部分。将此视为多层安全策略的第一道防线。\n\
  \n### 教育用户\n\n年前，此书的作者之一教过一门 `Linux` 安全课程，他说（主要是开玩笑）“无论你们做什么，千万不要把密码写下来并贴在键盘下面。”在同学们大笑一通后，一个学生说：“真的没人那样做，对吧？”在午休期间，一些学生在办公室里转了一圈，翻过键盘并发现了三个密码。实际上，还发现了第四个密码贴在某位员工的显示器上。\n\
  \n显然，用户在安全策略中起着至关重要的作用。他们往往不知道自己的行为会如何破坏安全性。在创建安全策略时，你应该考虑如何鼓励用户让你的系统更安全，而不是不安全。例如，考虑以下几：\n\
  \n* 鼓励用户使用强密码。\n* 警告用户安装未经你组织批准或支持的软件。\n* 鼓励用户立即报告任何可疑活动。\n* 要求用户在不安全位置（如公共 Wi-Fi\
  \ 点）登录时访问关键系统要小心。如果用户必须从不安全位置访问关键系统，请考虑实施 `VPN`（虚拟专用网络）技术。\n* 警告用户他们绝不要与任何人共享账户或密码。\n\
  * 教育用户不要点击邮件中的链接或打开未知来源的附件。这些内容通常包含病毒或蠕虫，或者可能是欺骗尝试（试图假装成有效资源以获取账户信息的尝试）。即使发送者是已知或信任的，如果他们的邮箱账户被破解，信息也可能包含恶意软件。\n\
  \n教育用户本身是一个相当大的话题，但在制定安全策略时，你应该在这上面花费大量的时间和精力。我们鼓励你进一步探索这个话题，因为进一步的讨论超出了本书书的范围。\n\
  \n### 账户安全\n\n\n\n\n你可以对系统执行特定操作以提高账户的安全性。其中某些操作将在本书的后续部分介绍。例如，你可以通过 PAM（可插拔认证模块）的功能来使用户账户更安全，该主题在第\
  \ 7 章“管理用户账户(#ch07.xhtml_ch07)”中进行了详细介绍。另一个例子是第 25 章“系统日志(#ch25.xhtml_ch25)”讨论了系统日志的使用——这在保护用户账户安全方面是一个重要的话题。系统日志用于判断是否有人尝试获得未经授权的系统访问。\n\
  \n本节涵盖了一系列用户账户安全主题。每个主题都经过简要说明，然后我们提供了如何将该主题纳入安全策略的思路。\n\n### 用户名\n\n考虑一下，黑客要获得未经授权的系统访问，需要两项信息：用户名和用户密码。防止黑客猜出用户名将使入侵你的系统的过程变得困难。考虑使用不易猜测的账户名。\n\
  \n例如，不要为 Bob Smith 创建一个名为“bsmith”的账户。如果黑客知道 Bob Smith 在该公司工作，这很容易被猜到。用户用户名可以考虑使用类似“b67smith”的名称。记住，你的员工姓名可能出现在公司网站或新闻中，从而标识了他们与公司的关系。\n\
  \n**将此纳入安全策略中**：创建一个规则，要求所有用户账户必须是无法通过真实姓名轻易猜到的内容。同时，使用邮件别名（参见第 20 章“网络服务配置：基本服务(#ch20.xhtml_ch20)”）向外部世界隐藏用户名。\n\
  \n### 无密码用户\n\n正如你可能猜到的那样，没有密码的用户构成了重大的安全风险。如果 `/etc/shadow` 文件中没有任何密码，只需用户名即可登录系统。\n\
  \n**将此纳入安全策略中**：创建一个 crontab 条目（参见第 14 章”获取有关 crontab 条目的信息），来定期执行以下命令：`grep \"\
  ^[^:]*::\" /etc/shadow`。或者，你也可以使用本章稍后介绍的安全性工具之一。\n\n#### 防止用户更改密码\n\n在某些用例中，你不希望用户更改账户密码。例如，假设你有一个为非员工设计的受限系统访问客账户。你不希望使用此账户的人更改密码，因为这会导致下一个客人无法使用该账户。\n\
  \n如果你将 `/etc/shadow` 文件的 `min` 字段设置得比 `max` 字段的值，那么用户无法更改账户密码（注意：在某些发行版中，如 Kali，`min`\
  \ 字段的选项是 `-n`，`max` 字段的选项是 `-x`）：\n\n点击此处查看代码图像\n\n**将此纳入安全策略中**：确定哪些账户应该受到此限制，并根据需要应用限制。记住定期更改密码，以免过去的“客人”以后仅因为知道密码就能访问系统。\n\
  \n### 应用程序账户\n\n上一个示例描述的访客账户也可以是应用程序账户。对于应用程序账户，应仅允许命令行登录（系统不应显示 GUI）。然后将 `/etc/passwd`\
  \ 文件中该用户的最后一个字段更改为应用程序，如下所示：\n\n点击此处查看代码图像\n\n```\nguest:x:9000:9000:Guest account:/bin/guest_app\n\
  ```\n\n`/bin/guest_app` 将运行一个提供系统受限访问的程序。如果你希望该账户访问一个以上的应用程序，也可以考虑使用第 7 章中描述的受限\
  \ shell。\n\n**将此纳入安全策略中**：确定哪些账户应该受到此限制，并根据需要应用限制。\n\n### 启用进程统计\n\n可以使用名为 `psacct`\
  \ 的软件工具来跟踪用户执行的所有命令。这在你怀疑黑客尝试可能成功的系统上非常重要。该工具需要按照以下步骤进行下载并进行安装：\n\n1. 从 [http://ftp.gnu.org/gnu/acct/]\
  \ 下载工具。\n2. 执行 `gunzip acct*` 命令解压下载的文件。\n3. 执行 `tar -xvf acct*` 命令提取文件内容。\n4. 执行\
  \ `cd` 命令进入由 `tar` 命令创建的目录。\n5. 执行 `./configure; make; make install` 命令安装软件。\n\n\
  软件安装后，你可以通过首先创建服务存储数据的日志文件来启动服务：\n\n点击此处查看代码图像\n\n```\nmkdir /var/log\ntouch /var/log/account\n\
  ```\n\n然后使用以下命令启动服务：\n\n```\naccton on\n```\n\n服务启动后，你可以使用 `lastcomm` 命令查看执行过的命令：\n\
  \n点击此处查看代码图像\n\n```\nlastcomm\nmore             pts/0         root         (uid=0)\
  \     Feb 25 10:00  0:05:0\nbash             pts/0         root         (uid=0)\
  \     Feb 25 10:00  0:05:0\nkworker/dying    root         (uid=0)     Feb 25 09:59\
  \  0:01:0\ncron             root         (uid=0)     Feb 25 09:59  0:01:0\nsh  \
  \             pts/0         root         (uid=0)     Feb 25 10:00  0:05:0\nlastcomm\
  \        root         (uid=0)     Feb 25 10:00  0:05:0\naccton           root  \
  \       (uid=0)     Feb 25 10:00  0:05:0\n```\n\n`ac` 命令也提供了有用信息。例如，要查看过去 24 小时每个用户的登录摘要，请使用\
  \ `ac -p --individual-totals` 命令。\n\n**将此纳入安全策略中**：在可能受到攻击的关键性系统（如 Web 和邮件服务器）上，引入此软件包并使用\
  \ crontab 条目（参见第 14 章获取有关 crontab 条目的信息）生成定期报告（每周或每日）。\n\n#### 避免以超级用户运行命令\n\n大量的轶闻涉及系统管理员由于\
  \ root 用户身份运行命令导致的系统破坏和混乱。考虑你运行 `rm -r /*` 命令的情况。作为普通用户，你可能会删除自己的文件，但权限（在第 9 章“文件权限(#ch09.xhtml_ch09)”中讨论）阻止你删除系统中任何你不拥有的。然而，如果该命令是由登录\
  \ root 用户运行的，那么所有文件都可能被破坏。\n\n**将此纳入安全策略中**：始终以普通用户登录，并使用 `sudo` 或 `su` 命令的权限（详情参见第\
  \ 9 章关于 **sudo** 和 **su**）获取临时 root 权限。运行需要 root 权限的命令后，返回普通账户。\n\n### 安全工具\n\n\
  可以使用许多安全工具搜索安全漏洞。本节使用 Kali Linux 描述并演示了这些工具，但这些工具也可以在其他发行版中安装和使用。Kali Linux 的优势在于这些工具默认已安装并配置好。\n\
  \n\n\n\n在 Kali Linux 上，可以通过点击`Applications”（应用程序）然后选择`05 – Password Attacks”（密码攻击）来访问大部分工具，如图\
  \ 8-3\n\n**图 8-3** *密码攻击*\n\n你可能还会考虑探索“13 – 社会工程工具”。社会工程学是一种通过非技术手段从用户收集系统信息的技巧。例如，黑客可能会给员工打电话，装成公司\
  \ IT 支持团队的成员，并尝试从员工处获取信息（如用户名、密码等）。\n\n## john 和 Johnny 工具\n\n`john` 实用（全名：John\
  \ the Ripper）是一个命令行密码破解工具。命令行工具的优势在于你可以通过 `crontab` 条目实现自动化（有关 `crontab` 条目的信息，请参见第\
  \ 14 章），允许你调度该工具定期运行。\n\n`Johnny` 工具是 `john` 工具的基于图形界面版本。这个 GUI 工具的优势在于它允许你运行 `john`\
  \ 命令，而无需记忆所有的命令选项。\n\n在两种情况下，你都需要一个同时包含 `/etc/passwd` 和 `/etc/shadow` 条目的文件。你可以通过运行以下命令创建此文件：\n\
  \n点击此处查看代码图像\n\n```\ncat /etc/passwd /etc/shadow > file_to_store\n```\n\n运行 `Johnny`\
  \ 时，你可以点击`Open password file（打开密码文件）选项将此文件加载到实用工具中。接下来，选择你想要破解的账户，然后点击`Start new\
  \ attack（启动新攻击）按钮。每个账户在破解时都会显示，如图 8-4\n\n**图 8-4** *已破解的密码*\n\n要查看执行了什么 `john` 命令，请点击`Console\
  \ log（控制日志）按钮，如图 8-5\n\n**图 8-5** *john 命令*\n\n## hydra 工具\n\n`john` 实用工具使用用户账户和密码文件，而\
  \ `hydra` 工具则通过特定协议主动探测系统。例如，以下命令将使用 `hydra` 工具通过 FTP（文件传输协议）攻击本地系统：\n\n点击此处查看代码图像\n\
  \n```\nhydra -l user -P /usr/share/set/src/fasttrack/wordlist.txt ftp://127.0.0.1\n\
  ```\n\n请注意，你不应该在任何没有获得书面授权进行安全分析的系统上运行此类命令。在其他组织的系统上尝试运行此命令可能被视为非法破解尝试。\n\n字典文件是系统上许多可用文件之一。点击`Applications（应用程序）`,``05\
  \ – Password Attacks（密码攻击）`,``wordlists（字典列表）`来显示字典列表，如图 8-6\n\n**图 8-6** *显示字典列表*\n\
  \n### 总结\n\n你已经开始学习如何创建安全策略的过程。在本书的五个主要部分结束后，你将扩展这些知识。根据你在这一章中学到的内容，你应该已经了创建用户账户安全策略所需的信息，包括使用\
  \ Kali Linux 提供的工具执行安全扫描。\n\n### 复习习题\n\n**1.** 填写缺失的选项，以便 bob 账户的用户无法更改其密码：`passwd\
  \ _____ 99999 -M 99998 bob`\n\n**2.** 使用哪个命令可以找到没有密码的用户？\n\n1. `find`\n2. `grep`\n\
  3. `passwd`\n4. `search`\n\n**3.** _____ 包提供进程核算。\n\n**4.** 下列哪个实用工具可以执行密码破解操作？\n\
  \n1. `john`\n2. `nick`\n3. `jill`\n4. `jim`\n\n**5.** 使用哪个命令可以从普通用户切换到 root 用户？\n\
  \n1. `switch`\n2. `sed`\n3. `du`\n4. `su`\n\n# 第三部分\n\n## 文件和数据存储\n\n任何操作系统的关键元素之一都是数据。这些数据存储在介质设备上，如硬盘、DVD\
  \ 和 USB 驱动器。为了组织和保护数据，Linux 使用了文件系统。\n\n理解文件系统的特性以及如何利用工具保护存储在文件系统中的数据，对于所有操作系统的用户来说都是重要任务。例如，普通用户必须学习如何使用权限保护自己的文件；而系统管理员则……\n\
  \n在第三部分,文件和数据存储中，你将探索以下章节：\n\n- 第 9 章,文件权限：侧重于使用权限保护文件。本章还深入了更多主题，如特殊权限、umask 和访问控制列表。\n\
  - 第 10 章,管理本地存储：基础：涵盖与本地存储概念相关的主题。包括如何创建分区和文件系统，以及额外的文件系统功能。\n- 第 11 章,管理本地存储：高级功能：涵盖与本地存储高级特性相关的主题。这包括如何使用\
  \ autofs 和创建加密系统。你还将学习逻辑卷管理。\n- 第 12 章,管理网络存储：讨论如何在网络上提供存储设备。包含了文件系统共享技术，如网络文件系统\
  \ (NFS)、Samba 和 iSCSI。\n- 第 13 章,制定存储安全策略：为你提供了根据你在第 9、10、11 和 12 章中获得的知识来创建安全策略的方法。\n\
  \n\n\n\n\n## 查看权限\n\n要查看文件或目录的权限，请使用 `ls -l` 命令：\n\n点击此处查看代码图像\n\n```\n[student@localhost\
  \ ~]$ ls -l /etc/chrony.keys\n-rw-r-----. 1 root chrony 62 May  9  2018 /etc/chrony.keys\n\
  ```\n\n输出的前 10 个字符表示文件类型（记住，如果第一个位置的字符是连字符 [–]，则它表示普通文件，而 `d` 表示目录）以及文件的权限。权限分为三组：文件的所有者用户（在前面的例中为\
  \ `root`）、所属组所有者（`chrony`）以及所有其他用户（称为“其他”）。\n\n每组有三种可能的权限：读取（用 `r` 符号）、写入（用 `w`\
  \ 符号）和执行（用 `x` 符号）。如果设置了权限，则会显示表示该权限的字符。否则，将显示连字符（–）表示未设置该权限。因此，`r-x` 意味着“设置了读取和执行，但未设置写入”。\n\
  \n## 文件与目录\n\n读取、写入和执行权限的实际含义取决于该对象是文件还是目录。对于文件，这些权限意味着：\n\n*   **读取**：可以查看或复制文件内容。\n\
  *   **写入**：可以修改文件内容。\n*   **执行**：可以像程序一样运行文件。在创建程序后，必须先使其具有可执行权限才能运行。\n\n对于目录，这些权限意味着：\n\
  \n*   **读取**：可以列出目录中的文件。\n*   **写入**：可以在目录中添加和删除文件（需要执行权限）。\n*   **执行**：可以 `cd`\
  \ 进入目录或在路径中使用它。\n\n### 安全亮点\n\n目录的写入权限可能是最危险的。如果用户对你的某个一个目录具有写入和执行权限，那么该用户就可以删除该目录中的每一个文件。\n\
  \n## 修改权限\n\n`chmod` 命令用于更改文件的权限。它可以用两种方式使用：符号法和八进制法。在八进制法中，权限被分配为数值：\n\n*   读取\
  \ = 4\n*   写入 = 2\n*   执行 = 1\n\n使用这些数值，一个数字就可以描述一整组权限：\n\n*   7 = `rwx`\n*   6\
  \ = `rw-`\n*   5 = `r-x`\n*   4 = `r--`\n*   3 = `-wx`\n*   2 = `-w-`\n*   1 = `--x`\n\
  *   0 = `---`\n\n因此，要将文件的权限更改为 `rwxr-xr--`，你需要执行以下命令：\n\n```\nchmod 754 filename\n\
  ```\n\n使用八进制权限，你应该始终提供三个数字，这将更改所有权限。但是，如果你只想更改组中的某一个权限呢？对于这种情况，请通过向 `chmod` 命令传递三个值来使用符号法，如表\
  \ 9-1 所示。\n\n**表 9-1** 符号法值\n\n| 谁 | 操作什么 | 权限 |\n| --- | --- | --- |\n| u = 用户所有者\
  \ | + | `r` |\n| g = 组所有者 | - | `w` |\n| o = 其他 | = | `x` |\n| a= 所有组 | | |\n\n\
  以下演示了如何使用符号法向所有三组（用户所有者、组所有者和其他）添加执行权限：\n\n点击此处查看代码图像\n\n```\n[student@localhost\
  \ ~]$ ls -l display.sh\n-rw-rw-r--. 1 student student 291 Apr 30 20:09 display.sh\n\
  [student@localhost ~]$ chmod a+x display.sh\n[student@localhost ~]$ ls -l display.sh\n\
  -rwxrwxr-x. 1 student student 291 Apr 30 20:09 display.sh\n```\n\n### 对话式学习™—八进制与符号权限\n\
  \n**Gary**: 你好，Julia。我对某些事情很困惑。为什么我们有两种方法可以用来更改权限呢？\n\n**Julia**: 你好，Gary。你是说八进制和符号权限吗？\n\
  \n**Gary**: 是的！看起来只需要一种方法就可以了。\n\n**Julia**: 从技术上来说，是的。如果你愿意，可以一直使用八进制，或者一直使用符号法。然而，了解两者会让你的生活变得更轻松。\n\
  \n**Gary**: 你什么意思？\n\n**Julia**: 假设你只想为组所有者添加读取权限，并且你选择使用八进制法。在这种情况下，在你运行 `chmod`\
  \ 命令之前，你首先需要做什么？\n\n**Gary**: 嗯，我必须先列出当前权限，以确定使用什么值来添加新权限。\n\n**Julia**: 正确。在这种情况下，直接使用\
  \ `g+r` 不是更简单吗？\n\n**Gary**: 好的，那么进行像这样微小的权限更改，使用符号法会更简单。但为什么要用八进制法呢？\n\n**Julia**:\
  \ 那么，如果你想完全更改权限，甚至只更改其中几个呢？使用八进制可能会更容易。\n\n**Gary**: 噢，我理解了。那种情况下符号法可能会变得很糟糕。我明白了。\n\
  \n**Julia**: 不客气！\n\n## 默认权限\n\n当用户创建一个文件或目录时，`umask` 值用于指定默认权限。重要的是你要理解 `umask`\
  \ 值仅用于为文件和目录提供默认权限。在创建文件或目录后，可以使用 `chmod` 命令调整权限。\n\n`umask` 命令接受一个参数：掩码，如表 9-2\
  \ 所示。\n\n**表 9-2** 最大权限\n\n| 类型 | 新项目的最大权限 |\n| --- | --- |\n| 文件 | `rw-rw-` |\n\
  | 目录 | `rwxrwx` |\n\n`umask` 值应用于最大权限。图 9-1 描述了 27 值如何应用。\n\n![Image](img/09fig01.jpg)\n\
  \n**图 9-1** *应用于文件的 27 值*\n\n虽然任何八进制值都可以确定掩码，但某些值是常用的。表 9-3 展示了这些常用 `umask` 值对文件和目录的影响。\n\
  \n**表 9-3** 常用 umask 值\n\n| 值 | 文件 | 目录 |\n| --- | --- | --- |\n| 002 | `rw-rw-r--`\
  \ | `rwxrwxrx` |\n| 022 | `rw-r--r--` | `rwxr-xr-x` |\n| 027 | `rw-r-----` | `rwxr-x---`\
  \ |\n| 077 | `rw-------` | `rwx------` |\n\n注意你也可以使用符号方法指定 `umask`。例如，`umask rw-rw---`\
  \ 命令与 `umask 002` 命令相同。\n\n每个 shell 都有自己的 `umask` 值。如果你在一个 shell 中更改 `umask`，它不会影响任何其他\
  \ shell 的 `umask` 值。要持久更改你的 `umask`，请将 `umask` 命令添加到 `~/.bash_profile` 文件中。\n\n\
  ## 出了什么问题？\n\n有时要确定为什么无法访问某个文件或目录可能非常沮丧。例如，考虑以下命令：\n\n点击此处查看代码图像\n\n```\nbob@onecoursesource:~#\
  \ cp sample /etc/skel\ncp: cannot create regular file '/etc/skel/sample1': Permission\
  \ denied\n```\n\n\n\n\n问题是什么？请记住系统会检查多种权限，例如 `sample` 文件的读权限、`/`、`etc` 和 `skel`\
  \ 目录的执行权限，以及 `skel` 目录的写权限。\n\n要发现错误，首先仔细查看错误信息的输出。在这种情况下，问题似乎出在向 `/etc/skel` 目录创建文件上，而不是\
  \ `sample` 文件本身（如果是后者，将会产生类似“无法打开‘sample1’进行读取”的错误）。\n\n接下来，通过查看每个目录的权限或使用 `cd`\
  \ 命令进入每个目录，确定你是否可以进入所有目录。最后，检查目标目录的写权限。\n\n### 特殊权限\n\n普通（非管理员）用户通常关注标准权限（读、写和执行），但系统管理员还必须非常了解特殊权限集。这些特殊权限仅在非常特定的情况下使用，你应该仔细监控系统中的这些权限集。在“SUID”章节的末尾提供了一个如何监控系统的示例。\n\
  \n### SUID\n\n为了理解 SUID（也称为“设置用户 ID”），请考虑以下情况。假设你正以普通用户（例如“student”用户）登录到 Linux\
  \ 系统，并运行 `passwd` 命令来更改密码：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ passwd\n\
  Changing password for user student.\nChanging password for student.\nCurrent password:\n\
  New password:\nRetype new password:\npasswd: all authentication tokens updated successfully.\n\
  ```\n\n华丽的“all authentication tokens updated successfully”消息表示“student”用户的密码已更改。但是，从逻辑上讲，这个命令本应该失败。要理解为什么，请查看\
  \ `/etc/shadow` 文件的权限：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ ls -l /etc/shadow\n\
  ----------. 1 root root 1726 Jan 23 14:02 /etc/shadow\n```\n\n根据这些权限，没有任何用户应该能够看到此文件的内容，更不用说修改它了：\n\
  \n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ more /etc/shadow\nmore: cannot open\
  \ /etc/shadow: Permission denied\n```\n\n这看起来很奇怪，因为正如你在第 7 章“管理用户账户”中学到的，用户账户密码存储在\
  \ `/etc/shadow` 文件中。为了修改此文件的内容，用户需要读写权限。然而，当用户运行命令时，他们获取文件的访问权限基于其账户（UID 和 GIDs）。那么，student\
  \ 用户是如何修改一个他通常无法查看的文件的？\n\n答案在于 `passwd` 命令本身的权限：\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$\
  \ which passwd\n/usr/bin/passwd\nstudent@onecoursesource:~$ ls -l /usr/bin/passwd\n\
  -rwsr-xr-x. root root 27768 Nov 25 06:22 /usr/bin/passwd\n```\n\n所有者执行权限处的 `s` 字符意味着在该文件上设置了\
  \ SUID 权限。有了 SUID 权限，命令执行“以身份运行”的功能，这允许 `passwd` 命令以 student 用户账户或 `/usr/bin/passwd`\
  \ 文件的所有者账户（在这种情况下为 root 用户）身份访问文件。因为 `passwd` 命令具有“root 权限”，它能够临时修改 `/etc/shadow`\
  \ 文件的权限以修改其内容。\n\n## 安全强调\n\nSUID 权限通常应用于由 root 用户拥有的文件。出于安全考虑，意识到你系统上的 SUID 程序是非常重要的。\n\
  \n你可以使用示例 9-1 所示的 `find` 命令来发现这些程序（注意：使用 `head` 命令是为了限制输出，因为该命令可能会产生几十个 SUID 程序）。\n\
  \n**示例 9-1** 使用 `find` 发现程序\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ find\
  \ / -perm -4000 -ls | head\n    13972     40 -rws--x--x   1  root     root     \
  \   40248 Feb 11  2018 /usr/sb\nin/userhelper\n    13964     36 -rwsr-xr-x   1 \
  \ root     root        36176 Mar 10  2018 /usr/sb\nin/unix_chkpwd\n    13802   \
  \  92 -rwsr-xr-x   1  root     root        89472 Feb 11  2018 /usr/sb\nin/user\n\
  \    13974     12 -rwsr-xr-x   1  root     root        11152 Mar 10  2018 /usr/sb\n\
  in/netctl\n    13970     12 -rwsr-xr-x   1  root     root        11192 May 26  2018\
  \ /usr/sb\nin/pam_timestamp\n```\n\n**安全强调**\n\n你应该什么什么时候运行 `find` 命令来发现 SUID 程序？\n\
  \n### SGID\n\n与 SUID 权限类似，SGID 权限可用于执行具有组所有权的命令。例如，考虑以下情况：\n\n点击此处查看代码图像\n\n```\n\
  student@onecoursesource:~$ ls -l /usr/bin/write\n-rwxrsr-x 1 root tty 19544 Nov\
  \ 27  2018 /usr/bin/write\n```\n\n`write` 命令设置了 SGID 权限（注意组执行位置上的 `s`），这意味着当它执行时，可以使用“tty”组的组权限。此权限对于该特定命令很重要，因为它将数据发送到终端窗口，而终端是由\
  \ tty 组组的文件表示的。\n\n除了 SGID 允许组访问外，这种特殊权限集在设置为目录时有不同的目的。为了理解这个目的，请考虑以下场景：\n\n你的公司有三个用户，属于不同的组：bob（“staff”组成员）、susan（“payroll”组成员）和\
  \ julia（“admin”组成员）。他们找到你（系统管理员），因为他们需要一个共享目录，让他们（且仅限他们）可以在其中共享他们正在合作的项目的文件。你的解决方案是采取以下步骤：\n\
  \n**步骤 1.** 创建名为“project”的组，并将所有用户加入该组。\n\n**步骤 2.** 创建名为 `/home/groups/project`\
  \ 的目录。\n\n**步骤 3.** 将 `/home/groups/project` 目录的所有组更改为 project 组。\n\n**步骤 4.** 将\
  \ `/home/groups/project` 目录的权限更改为“**rwxrwx---**”，以便只有项目组的成员可以访问该目录。\n\n\n\n\n\n\
  示例 9-2 是这些步骤的实际操作示例（注意 `chgrp` 命令将在本章稍后部分介绍）。\n\n**示例 9-2** *创建一个私有项目组*\n\n点击此处查看代码图像\n\
  \n```\nroot@onecoursesource:~# groupadd project\nroot@onecoursesource:~# usermod\
  \ -G project -a bob\nroot@onecoursesource:~# usermod -G project -a susan\nroot@onecoursesource:~#\
  \ usermod -G project -a julia\nroot@onecoursesource:~# mkdir -p /home/groups/project\n\
  root@onecoursesource:~# chgrp project /home/groups/project\nroot@onecoursesource:~#\
  \ chmod 660 /home/groups/project\nroot@onecoursesource:~# ls -ld /home/groups/project\n\
  drwxrwx--- 2 root project 40 Dec 23 14:05 /home/groups/project\n```\n\n这看起来是解决该问题的良好方案，但它缺少了一个组件。考虑一下当用户\
  \ bob 从其家目录复制文件到 `/home/groups/project` 目录并创建文件时会发生什么：\n\n点击此处查看代码图像\n\n```\nbob@onecoursesource:~$\
  \ cd /home/groups/project\nbob@onecoursesource:project$ cp ~/bob_report .\nbob@onecoursesource:project$\
  \ ls -l bob_report\n-rw-r----- 1 bob staff 1230 Dec 23 14:25 bob_report\n```\n\n\
  看起来一切运行得非常正常，直到 susan 或 julia 用户尝试查看 `bob_report` 文件时：\n\n点击此处查看代码图像\n\n```\njulia@onecoursesource:project$\
  \ more bob_report\nbob_report: Permission denied\n```\n\n问题在于，当 bob 用户将文件复制到 `/home/groups/project`\
  \ 目录时，他的 `umask` 设置导致“其他（others）”权限组没有权限。这意味着没有其他人可以查看此文件。bob 用户可以通过更改文件的权限或组所有权来解决这个问题，但必须在每次创建文件时都这样做。\n\
  \n解决方案是向 `/home/groups/projects` 目录添加 SGID 权限。当应用于目录时，SGID 权限将所有新创建文件和目录的组所有权赋予拥有该\
  \ SGID 目录的组。这里是一个示例：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# chmod g+s /home/groups/project\n\
  root@onecoursesource:~# ls -ld /home/groups/project\ndrwxrws--- 2 root project 40\
  \ Dec 23 14:05 /home/groups/project\nroot@onecoursesource:~# su – bob\nbob@onecoursesource:~$\
  \ cd /home/groups/project\nbob@onecoursesource:project$ cp ~/bob_report2 .\nbob@onecoursesource:project$\
  \ ls -l bob_report2\n-rw-r----- 1 bob project 1230 Dec 23 14:25 bob_report2\n```\n\
  \n现在，在 `/home/groups/project` 目录内创建任何新文件将由 project 组所有。\n\n要设置 SGID 权限，请使用以下方法之一（`xxx`\
  \ 代表标准的读、写、执行权限）：\n\n```\nchmod g+s file\n```\n\n或者\n\n```\nchmod 2xxx file\n```\n\
  \n要取消 SUID 权限，请使用以下方法之一：\n\n```\nchmod g-s file\n```\n\n或者\n\n```\nchmod 0xxx file\n\
  ```\n\n### 粘滞位 (Sticky Bit)\n\n为了理解粘滞位权限，请考虑需要一个所有用户都能共享文件的目录的情况。换句话说，所有用户都应该能够进入目录（执行权限）、查看目录中的所有文件（读取权限）并在目录中添加新文件（写入权限）：\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# mkdir /home/shareall\nroot@onecoursesource:~#\
  \ chmod 777 /home/shareall\nroot@onecoursesource:~# ls -ld /home/shareall\ndrwxrwxrwx\
  \ 2 root project 40 Dec 23 14:05 /home/shareall\n```\n\n这些权限的问题在于目录的写入权限。该权限允许用户向目录中添加新文件，但同时也允许用户删除目录中的任何文件（无论他们是否拥有该文件）。显然，如果用户开始删除彼此的文件，这就会产生问题（并带来潜在的安全风险）。\n\
  \n粘滞位权限有一个解决方案。当应用于目录时，该权限会更改写入权限的行为。用户仍然可以向目录中添加文件（假设这不会覆盖另一个用户拥有的现有文件），但用户要从目录删除文件需要满足以下条件之一：\n\
  \n粘滞位权限几乎总是设置为八进制值 1777。\n\n：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -ld\
  \ /tmp\ndrwxrwxrwt 2 root root 40 Dec 23 14:05 /tmp\n```\n\n要设置粘滞位权限，请使用以下方法之一（`xxx`\
  \ 代表标准的读、写、执行权限）：\n\n```\nchmod g+t file\n```\n\n或者\n\n```\nchmod 1xxx file\n```\n\
  \n要取消粘滞位权限，请使用以下方法之一：\n\n```\nchmod g-t file\n```\n\n或者\n\n```\nchmod 0xxx file\n\
  ```\n\n### 访问控制列表 (ACLs)\n\n传统的读、写、执行权限存在一个根本性问题。考虑一个组织拥有 1000 个用户的场景。其中一个用户账户是\
  \ sarah，她是“sales”组的成员。除了 sarah 用户之外，sales 组还有 29 名成员。\n\n现在假设 sarah 用户创建了一个权限如下的新文件：\n\
  \n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$ ls -l sales_report\n-rw-r----- 1 sarah\
  \ sales 98970 Dec 27 16:45 sales_report\n```\n\n根据上一个命令的输出，你应该能判断出 sarah 用户对该文件具有读取和写入权限，而\
  \ sales 组的成员对该文件仅具有读取权限。这意味着组织的其余部分（970 个用户）拥有最后一组权限（其他）所提供的访问权限。换句话说，他们完全没有权限。\n\
  \n假设 Sarah 的老板（用户账户 william）需要查看此文件的内容，但他的账户不是 sales 组的成员。sarah 用户将如何授予这种访问权限？\n\
  \nsarah 用户可以给最后一组权限赋予读取权限，如下所示：\n\n\n\n\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$\
  \ chmod o+r sales_report\nsarah@onecoursesource:~$ ls -l sales_report\n-rw-r--r--\
  \ 1 sarah sales 98970 Dec 27 16:45 sales_report\n```\n\n这种解决方案的问题在于，现在组织中的`每个人`都可以查看此文件的内容。\n\
  \n有一个更好的解决方案。如果 `sarah` 用户是 `sales` 组的组管理员，她就可以将 `william` 用户添加到 `sales` 组中（或者，她可以请求管理员执行此任务）。然而，这种解决方案也有缺陷，因为现在\
  \ `william` 用户将拥有访问所有由 `sales` 组拥有文件的权限。因此，这种解决方案并不理想。\n\n最好的解决方案是使用访问控制列表 (ACLs)，它允许文件所有者为特定的用户和组授予权限。使用\
  \ `setfacl` 命令可以在文件或目录上创建 ACL：\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$ setfacl\
  \ -m user:dane:r-- sales_report\n```\n\n`-m` 用于为文件创建新的 ACL。`-m` 的参数格式为 `what`:`who`:`permission`。`what`\
  \ 的值可以是以下值之一：\n\n*   当为特定用户应用 ACL 时，使用 `user` 或 `u`。\n*   当为特定组应用 ACL 时，使用 `group`\
  \ 或 `g`。\n*   当为“其他人”应用 ACL 时，使用 `others` 或 `o`。\n*   当设置 ACL 掩码时，使用 `mask` 或 `m`。（掩码将在本节稍后部分解释。）\n\
  \n`who` 的值将是应用权限的用户或组。权限可以是符号值（`r--`）或八进制值（`4`）。\n\n一旦在文件或目录上应用了 ACL，当在执行 `ls -l`\
  \ 命令时，权限后面会出现一个加号（`+`），如下所示：\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$ ls -l\
  \ sales_report\n-rw-rw-r--+ 1 sarah sales 98970 Dec 27 16:45 sales_report\n```\n\
  \n使用 `getfacl` 命令查看 ACL：\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$ getfacl\
  \ sales_report\n# file: sales_report\n# owner: sarah\n# group: sarah\nuser::rw-\n\
  user:william:r--\ngroup::rw-\nmask::rw-\nother::r--\n```\n\n请参阅示例 9-3 为组设置 ACL 的示例。\n\
  \n**示例 9-3** *为组设置 ACL*\n\n点击此处查看代码图像\n\n```\nstudent@onecoursesource:~$ setfacl\
  \ -m g:games:6 sales_report\nstudent@onecoursesource:~$ getfacl sales_report\n#\
  \ file: sales_report\n# owner: sarah\n# group: sarah\nuser::rw-\nuser:william:r--\n\
  group::rw-\ngroup:games:rw-\nmask::rw-\nother::r--\n```\n\n### mask 值\n\n注意示例 9-3\
  \ 输出中的 `mask` 值（`rw-`）。`mask` 用于临时禁用或限制 ACL。考虑这样一种情况：你希望 ACL 值在短时间内不生效。如果有许多 ACL，要移除每一个实例并在稍后重新应用每一个一个将是困难的。相反，只需更改\
  \ `mask` 值，如示例 9-4 所示。\n\n**示例 9-4** *更改 `mask` 值*\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$\
  \ setfacl -m mask:0 sales_report\nsarah@onecoursesource:~$ getfacl sales_report\n\
  # file: sales_report\n# owner: sarah\n# group: sarah\nuser::rw-\nuser:william:r--\
  \                #effective:---\ngroup::rw-                      #effective:---\n\
  group:games:rw-                 #effective:---\nmask::---\nother::r--\n```\n\n`mask`\
  \ 指定了除用户所有者和“其他人”之外的任何人对文件拥有的最大权限。注意之前输出中的“effective（有效）”部分，它展示了 `mask` 值对 `william`\
  \ 用户、`games` 组以及拥有文件的组（`group::`）权限的影响。\n\n要撤销这些限制，请将 `mask` 设置为原来的值，如示例 9-5 所示。\n\
  \n**示例 9-5** *重置 `mask` 值*\n\n点击此处查看代码图像\n\n```\nsarah@onecoursesource:~$ setfacl\
  \ -m mask:rw- sales_report\nsarah@onecoursesource:~$ getfacl sales_report\n# file:\
  \ sales_report\n# owner: sarah\n# group: sarah\nuser::rw-\nuser:william:r--\ngroup::rw-\n\
  group:games:rw-\nmask::rw-\nother::r--\n```\n\n\n\n\n只有 root 用户可以更改文件的所有者。要更改文件的组所有者，执行命令的用户必须拥有该文件，并且必须是接收所有权的新组的成员。\n\
  \n`chown` 命令的重要选项包括表 9-6 所示所示选项。\n\n**表 9-6** `chown` 命令的选项\n\n| **选项** | **描述**\
  \ |\n| --- | --- |\n| `-R` | 递归地将更改应用于整个目录结构。 |\n| `--reference=file` | 将用户和组所有者更改为\
  \ `file` 的所有权。 |\n| `-v` | 详细模式。输出以演示所做的更改。 |\n\n用户无法将自己拥有的文件交给另一个用户——为什么呢？答案请参见图\
  \ 9-2。\n\n![Image](img/09fig02.jpg)\n\n**图 9-2** *Text Support™—更改文件所有权*\n\n## chgrp\n\
  \n`chgrp` 命令旨在更改文件的组所有权。该命令的语法为 `chgrp [options] group_name file`。在以下示例中，`abc.txt`\
  \ 文件的组所有权被改为“staff”组：\n\n点击查看代码图像\n\n```\nroot@onecoursesource:~# chgrp staff abc.txt\n\
  ```\n\n要更改文件的组所有者，执行命令的用户必须拥有该文件，并且必须是接收所有权的新组的成员。（一个例外是，“root”用户始终更改任何文件的组所有权。）\n\
  \n`chgrp` 命令的重要选项包括表 9-7 所示所示选项。\n\n**表 9-7** `chgrp` 命令的选项\n\n| **选项** | **描述**\
  \ |\n| --- | --- |\n| `-R` | 递归地将更改应用于整个目录结构。 |\n| `--reference=file` | 将用户和组所有者更改为\
  \ `file` 的所有权。 |\n| `-v` | 详细模式。输出以演示所做的更改。 |\n\n### 文件属性\n\n尽管文件属性在技术上不属于权限，但它们确实影响用户访问文件和目录的方式，因此在逻辑上属于任何关于权限的讨论范围。通过文件属性，系统管理员可以修改文件访问的核心功能。\n\
  \n例如，一种实用的文件属性是使文件变为“不可变”（immutable）。不可变文件是完全无法更改的；任何人（包括 root 用户）都无法删除或修改它。要使文件变为不可变，请使用\
  \ `chattr` 命令：\n\n点击查看代码图像\n\n```\nroot@onecoursesource:~# chattr +i /etc/passwd\n\
  ```\n\n注意，现在没有用户可以更改 `/etc/passwd` 文件，这意味着无法向系统添加新用户（也无法删除现有用户）。这看起来像是一件奇怪的事，但想象一种系统是公开可用的情况（如商场里的自助服务机）。你不需要新用户，你也不希望任何人删除用户。\n\
  \n**安全要点**\n\n在对 `/etc/passwd` 文件应用不可变属性的情况下，你可能会问自己：“这个文件不是已经受权限保护了吗？”尽管确实如此，但添加不可变属性提供了额外的安全层，使系统整体更加安全。\n\
  \n要查看文件的属性，请使用 `lsattr` 命令：\n\n点击查看代码图像\n\n```\nroot@onecoursesource:~# lsattr /etc/passwd\n\
  ----i--------e-- /etc/passwd\n```\n\n连字符（`-`）字符表示未设置的文件属性。完整的属性列表可以在 `chattr` 命令的\
  \ man 页中找到。表 9-8 描述了对系统安全重要的文件属性。\n\n**表 9-8** 系统安全文件属性\n\n| **属性** | **描述** |\n\
  | --- | --- |\n| `a` | 仅追加模式；只允许向文件中写入新数据。 |\n| `A` | 禁用修改访问时间。出于安全考虑，此时间戳对于确定关键系统文件何时被访问可能很重要。然而，对于非关键文件，禁用访问时间可以使系统更快，因为减少了硬盘写入。\
  \ |\n| `e` | 范围区格式，允许 SELinux 等关键功能（在本章稍后部分讨论）。 |\n| `i` | 不可变；文件不能被删除或修改。 |\n|\
  \ `u` | 不可删除；文件不能删除，但可以修改内容。 |\n\n要移除不可变文件属性，请使用以下命令：\n\n点击查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ chattr -i /etc/passwd\nroot@onecoursesource:~# lsattr /etc/passwd\n-------------e--\
  \ /etc/passwd\n```\n\n`chattr` 命令的重要选项包括表 9-9 所示所示选项。\n\n**表 9-9** `chattr` 命令的选项\n\
  \n| **选项** | **描述** |\n| --- | --- |\n| `-R` | 递归地将更改应用于整个目录结构。 |\n| `-v` | 详细模式。输出以演示所做的更改。\
  \ |\n\n### SELinux 简介\n\n与文件属性类似，SELinux（增强 Linux)](gloss.xhtml_213) 并不是“文件权限”，但它属于本章，因为\
  \ SELinux 也会对访问产生重大影响。需要注意的是，SELinux 是一个潜在的巨大话题，事实上，它的完整讨论应该是一整本书。本节的目的是向你介绍 SELinux\
  \ 的概念并演示它的工作。\n\n为了理解 SELinux，你首先需要学习 Linux 传统安全方法的潜在缺陷。\n\n### 用户导致安全漏洞\n\n文件和目录可能会被不懂权限或无意中提供了过多访问权限的用户破坏。这反映了系统管理员的一种说法：“如果没有用户，一切都不会出错，系统也会更安全。”当然，对这句话的回答是：“如果没有用户，我们就没有工作做了！”\n\
  \nSELinux 可以通过在访问文件时提供额外的安全级别来适应这种缺陷。可以应用 SELinux 安全策略，要求进程属于某个 SELinux 安全上下文（类似于“安全组”）才能访问文件和目录。普通权限仍用于进一步定义访问，但在访问文件/目录时会首先应用\
  \ SELinux 策略。\n\n然而，尽管可以配置 SELinux 策略来限制普通用户运行进程对文件和目录的访问，但这被认为是非常严格的策略，并不像我们将讨论的场景场景常见。\n\
  \n### 守护进程导致安全漏洞\n\n更大的担忧，也是大多数 SELinux 策略旨在解决的问题，是守护进程（或系统进程）如何带来安全风险。考虑你拥有许多提供各种服务的活动进程。例如，这些进程之一可能是一个\
  \ Web 服务器，如示例 9-8 所示的 Apache Web 服务器。\n\n**示例 9-8** *Apache Web 服务器进程*\n\n点击查看代码图像\n\
  \n\n\n\n```\nroot@onecoursesource:~# ps -fe | grep httpd\nroot      1109     1 \
  \ 0  2018 ?        00:51:56 /usr/sbin/httpd\napache    1412  1109  0 Dec24 ?   \
  \     00:00:09 /usr/sbin/httpd\napache    4085  1109  0 05:40 ?        00:00:12\
  \ /usr/sbin/httpd\napache    8868  1109  0 08:41 ?        00:00:06 /usr/sbin/httpd\n\
  apache    9263  1109  0 08:57 ?        00:00:04 /usr/sbin/httpd\napache   12388\
  \  1109  0 Dec26 ?        00:00:47 /usr/sbin/httpd\napache   18707  1109  0 14:41\
  \ ?        00:00:00 /usr/sbin/httpd\napache   18708  1109  0 14:41 ?        00:00:00\
  \ /usr/sbin/httpd\napache   19769  1109  0 Dec27 ?        00:00:15 /usr/sbin/httpd\n\
  apache   29802  1109  0 01:43 ?        00:00:17 /usr/sbin/httpd\napache   29811\
  \  1109  0 01:43 ?        00:00:11 /usr/sbin/httpd\napache   29898  1109  0 01:44\
  \ ?        00:00:10 /usr/sbin/httpd\n```\n\n注意在上述输出中，每一行都描述了系统上运行的一个 Apache Web\
  \ 服务器进程（`/usr/sbin/httpd`）。行的第一部分是启动该进程的用户。以 `root` 运行的进程仅用于产生额外的 `/usr/sbin/httpd`\
  \ 进程。其他进程则响应来自客户端工具（网页浏览器）的传入网页页面请求。\n\n想象一下，如果 Apache Web 服务器软件中发现了一个安全漏洞，允许客户端工具获取某个\
  \ `/usr/sbin/httpd` 进程的控制权，并向该进程发出自定义命令或操作。这些操作之一可以是查看 `/etc/passwd` 文件的内容，由于该文件设置了权限，此操作将成功：\n\
  \n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# ls -l /etc/passwd\n-rw-r--r-- 1 root\
  \ root 2690 Dec 11  2018 /etc/passwd\n```\n\n从上一个命令的输出可以看出，所有用户都有查看 `/etc/passwd`\
  \ 文件内容的权限。问问自己自己：你是否希望某个随机的人（通常被称为黑客）拥有查看存储用户账户数据的文件内容的权限？\n\n### 安全亮点\n\n不要认为这个问题仅仅与\
  \ Apache Web 服务器有关。在你的系统上运行的任何进程都可能被攻破，并为怀有不意图的人提供非预的访问。在你的系统上运行 `ps -fe` 命令，可以了解随时有多少进程正在运行。\n\
  \n通过 SELinux 策略，`/usr/sbin/httpd` 进程可以被“锁定”，使得每个进程只能访问一组特定的文件。这是大多数管理员使用 SELinux\
  \ 的目的：保护可能被黑客利用已知（或可能未知）漏洞攻破的进程。\n\n### SELinux 基础\n\n并不是所有的 Linux 发行版都安装了 SELinux。判断它是否可用（并正在积极使用）的一种方法是使用\
  \ `getenforce` 命令：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# getenforce\nEnforcing\n\
  ```\n\n结果“Enforcing”意味着 SELinux 已安装且安全策略当前处于激活状态。你可以使用 `setenforce` 命令禁用安全策略（在测试新策略或排排除\
  \ SELinux 问题时很有用）：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# setenforce 0\n\
  root@onecoursesource:~# getenforce\nPermissive\n```\n\n在“Permissive”模式下，SELinux\
  \ 不会阻止对文件和目录的访问，但会在系统日志文件中发出并显示警告。\n\n### 安全上下文\n\n每个进程都带有安全上下文运行。要查看此，请使用 `ps`\
  \ 命令的 `-Z` 选项（此处使用 `head` 命令仅是为了限制命令输出）：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ ps -fe | grep httpd | head -2\nsystem_u:system_r:httpd_t:s0 root     1109    \
  \ 1  0  2018 ?        00:51:56 /usr/sbin/httpd\napache    1412  1109  0 Dec24 ?\
  \        00:00:09 /usr/sbin/httpd\napache    4085  1109  0 05:40 ?        00:00:12\
  \ /usr/sbin/httpd\napache    8868  1109  0 08:41 ?        00:00:06 /usr/sbin/httpd\n\
  apache    9263  1109  0 08:57 ?        00:00:04 /usr/sbin/httpd\napache   12388\
  \  1109  0 Dec26 ?        00:00:47 /usr/sbin/httpd\napache   18707  1109  0 14:41\
  \ ?        00:00:00 /usr/sbin/httpd\napache   18708  1109  0 14:41 ?        00:00:00\
  \ /usr/sbin/httpd\napache   19769  1109  0 Dec27 ?        00:00:15 /usr/sbin/httpd\n\
  apache   29802  1109  0 01:43 ?        00:00:17 /usr/sbin/httpd\napache   29811\
  \  1109  0 01:43 ?        00:00:11 /usr/sbin/httpd\napache   29898  1109  0 01:44\
  \ ?        00:00:10 /usr/sbin/httpd\n```\n\n\n\n\n在本章中，你学习了如何查看和设置标准权限、`umask` 值、访问控制列表\
  \ (ACLs) 以及特殊权限。你还学习了如何使用文件属性来增强关键系统文件的安全性。最后，你接触了 SELinux 背后的概念，这是一种用于保护 Linux\
  \ 操作系统上文件和目录的高级方法。\n\n## 关键术语\n\n- 权限\n- 掩码\n- SUID\n- SGID\n- 粘滞位\n- 访问控制列表\n-\
  \ SELinux\n\n## 复习题\n\n**1.** `ls` 命令的 _____ 选项将显示基本文件权限。\n\n**2.** 哪种权限允许用户删除目录中的文件？\n\
  1. 文件的执行权限\n2. 文件的写入权限\n3. 目录的写入权限\n4. 目录的读取权限\n\n**3.** 哪种权限用于修改目录写入权限的行为？\n1.\
  \ SUID\n2. SGID\n3. 粘滞位\n4. 以上均非\n\n**4.** 使用 _____ 命令在创建新文件或目录时指定要掩码（不包含）哪些默认权限。\n\
  \n**5.** 填充空白以为 `/data` 目录设置 SGID 权限：`chmod _____ /data`。\n\n# 第 10 章：管理本地存储：基础\n\
  \n本章的重点是本地存储设备的关键概念和基础管理。\n\n你首先将学习一些关键概念，包括分区和文件系统是什么，以及它们在 Linux 操作系统中起着什么样的重要作用。然后你将学习如何创建分区和文件系统，随后学习如何让操作系统可以使用这些新的存储设备。\n\
  \n我们将通过深入探讨交换设备（swap devices）来完成本章，交换设备用于提供虚拟内存空间设备。\n\n在阅读本章并完成练习后，你将能够做到：\n- 创建分区和文件系统\n\
  - 执行高级文件系统操作任务\n- 手动和自动挂载分区\n- 创建并激活交换设备\n\n### 文件系统基础\n\n挂载过程通过将文件系统置于目录位置来使其可用。在学习如何实现之前，你应该了解一些关于文件系统的基础知识。\n\
  \n## 分区\n\n分区用于将硬盘分成更小的组件。每个组件都可以被视为一个不同的存储设备。在每个分区上，可以创建一个独立的文件系统（`btrfs`、`xfs`、`ext4`\
  \ 等）。\n\n传统的 PC 分区在创建数量上存在局限性。最初只允许四个分区。这些被称为*主*分区。随着对更多分区的需求，出现了一种技术允许将其中一个主分区转换为扩展分区。在扩展分区内，你可以创建额外的分区，称为*逻辑*分区。\n\
  \n在图 10-1 中，`/dev/sda1`、`/dev/sda2` 和 `/dev/sda3` 是主分区。`/dev/sda4` 分区是一个扩展分区，用作\
  \ `/dev/sda5`、`/dev/sda6` 和 `/dev/sda7` 逻辑分区的容器。\n\n![Image](img/10fig01.jpg)\n\
  **图 10-1** *传统分区结构*\n\n在大多数使用传统分区的发行版中，你将被限制为共 15 个分区，但内核调整（修改）可以将此数字增加到 63。\n\n\
  传统的分区表存储在主引导记录 (MBR) 中。一种新的分区表称为 GUID 分区表 (GPT)，它没有与 MBR 分区表相同的限制或布局。\n\n可以使用不同的工具来创建或查看分区，包括\
  \ `fdisk`、`parted` 以及安装程序提供的 GUI 工具。可用的 GUI 工具根据发行版而异。\n\n`fdisk` 和 `parted` 都支持命令行选项，并且都可以作为交互式工具执行。`fdisk`\
  \ 和 `parted` 工具将在本章稍后部分介绍。\n\n### 文件系统\n\n*文件系统*（filesystem）这一术语本身可能令人有些困惑。实际上有两种类型的文件系统：物理的和虚拟的。\n\
  \n物理文件系统用于组织设备上数据的结构，例如分区、逻辑卷或 RAID（独立磁盘冗余阵列）设备。通常当使用*文件系统*一词时，指的是物理文件系统。有许多不同类型的物理文件系统，如本章稍后部分所述。\n\
  \n虚拟文件系统是普通用户在查看操作系统上的文件和目录时看到的内容。虚拟文件系统由几个物理文件系统组成，通过目录树合并。\n\n为了理解这个概念，请先看图 10-2。\n\
  \n![Image](img/10fig02.jpg)\n**图 10-2** *虚拟文件系统*\n\n图 10-2 显示了虚拟系统的一部分。这是普通用户看到的目录结构。虚拟系统的顶部是\
  \ `/` 目录，子目录和文件存储在 `/` 之中。但作为管理员，你应该知道这还有更多。`/` 目录是物理文件系统的挂载点。挂载点是物理文件系统合并到虚拟文件系统的方式。其他目录如\
  \ `/var` 和 `/usr` 也可以是挂载点。在这种情况下，你可能认为文件系统像[图 10-3]所示。\n\n![Image](img/10fig03.jpg)\n\
  **图 10-3** *这提供了关于虚拟文件系统背后发生情况的更多见解。高亮的目录位于存储在 `/dev/sda1` 分区系统中。`/var` 目录内存储在 `/dev/sda2`\
  \ 分区的文件系统。`/usr` 目录内存储在 `/dev/sda3` 分区的文件系统。\n\n将文件系统置于目录下是通过挂载过程完成的。挂载可以通过 `mount(#gloss.xhtml_gloss140)`\
  \ 命令手动执行，也可以通过 `/etc/fstab` 文件中的项自动执行。挂载过程将在本章后面详细介绍。\n\n### 为什么有这么多分区/文件系统？\n\n\
  你将发现许多 Linux 安装有多个分区——每个分区当然都有独立的文件系统。你想要创建多个分区的理由有几个：\n\n- **挂载选项**：每个分区在挂载时可以有不同的挂载选项。这提供了更大的灵活性，因为你可能想在特定情况下使用特定的挂载选项。在本章稍后我们将探讨挂载选项并回到这个话题。\n\
  - **文件系统类型**：每个分区可以使用不同类型的文件系统。某些文件系统更适合安全性，某些更适合处理大文件，而某些更适合性能。为特定情况选择正确的文件系统可以使系统更安全并更高效地执行任务。文件系统类型将在本章稍后部分讨论。\n\
  \n\n\n\n\n*   **磁盘配额 (Disk quotas)**：此 Linux 特功能允许你限制用户在文件系统中使用的空间。配额限制是针对每个文件系统的，因此拥有多个物理文件系统允许你为虚拟文件系统的不同区域设置不同的配额限制。\n\
  \n*   **备份策略 (Backup strategies)**：许多备份工具允许你针对每个文件系统指定不同的备份频率。例如，如果 `/home` 目录是一个文件系统的挂载点，而\
  \ `/boot` 是另一个文件系统的挂载点，你可以创建一种策略：每天备份 `/home` 目录中的文件（该目录下的文件经常变化），而备份 `/boot` 目录中的文件（因为该目录下的文件很少变化）。\n\
  \n*   **限制文件系统被填满 (Limit possible full filesystems)**：考虑一种情况：`/home` 目录是一个独立的文件系统，某个用户生成了大量非常大的文件。这些文件可能会占整个文件系统，导致其他用户无法在自己的家目录（home-dir-ctory）中创建文件。然而，如果\
  \ `/home` 目录不是独立的文件系统，而是整个操作系统单一文件系统的一部分，那么这个用户可能会导致整个系统无法使用，因为整个硬盘都满了。这就是为什么 `/home`、`/var`\
  \ 和 `/tmp` 通常是独立文件系统的主要原因之一，因为这些都是普通用户有权创建文件的目录结构。\n\n### 安全要点 (Security Highlight)\n\
  \n创建一个允许单个用户填满整个硬盘的虚拟文件系统结构被认为是一种严重的安全风险。当整个硬盘满时，操作系统无法正常运行，因为许多进程需要向硬盘写入数据的能力。\n\
  \n### 应该创建哪些分区/文件系统？(Which Partitions/Filesystems Should Be Created?)\n\n问题的答案实际上取决于几个因素。在决定要创建哪些分区时，你应该考虑不同的挂载选项、文件系统类型、磁盘配额和备份策略的优点。还要考虑这些文件系统将包含的内容。至少应考虑将以下目录作为独立物理文件系统的挂载点：\n\
  \n*   `/` (root) 文件系统：虚拟文件系统的顶层。该文件系统的大小很大取决于创建了哪些其他文件系统。这是一个必需分区。\n\n*   `/var`\
  \ 文件系统：`/var` 文件系统包含本质上变化的数据（即经常变化）。这包括日志文件、邮件文件和队列（如打印队列）。该文件系统的大小取决于许多因素，包括它是否为邮件服务器、系统上创建了哪些日志文件以及系统是否作为打印服务器运行。考虑将\
  \ `/var` 作为独立文件系统，以便实施备份策略并限制磁盘空间完全充满的风险。\n\n*   `/home` 文件系统：`/home` 文件系统存储普通用户家目录的地方。该文件系统的大小取决于许多因素，包括在系统中工作的用户数量以及这些用户执行的功能。考虑将\
  \ `/home` 作为独立文件系统，以便实施备份策略并限制磁盘空间完全充满的风险。\n\n*   `/boot` 文件系统：存储启动文件（包括 `kernel`、`bootloader`\
  \ 和 `initramfs` 文件）的位置。当 `/boot` 是独立文件系统时，其大小通常为 100–200MB。由于该文件系统在启动过程中必须易于访问，因此它位于独立的文件系统中。\n\
  \n## 注意 (Note)\n\n上述内容并非所有可能的文件系统的完整列表。将其他目录（如 `/usr` 和 `/opt`）作为物理文件系统的挂载点也有充分的理由。在找到满足你需求的物理文件系统良好组合之前，预计会有一些尝试。\n\
  \n### 文件系统类型 (Filesystem Types)\n\n文件系统用于组织系统上的数据（文件和目录）。Linux 提供许多不同类型的文件系统。表 10-1\
  \ 提供了这些文件系统的简要摘要。\n\n**表 10-1 文件系统类型 (Table 10-1 Filesystem Types)**\n\n| 选项 | 描述\
  \ |\n| --- | --- |\n| `ext2` | Ext2 是对原始扩展文件系统 ext 的改进。 |\n| `ext3` | Ext3 是对 ext2\
  \ 的改进（增加了日志支持等功能）。 |\n| `ext4` | Ext4 是对 ext3 的改进（允许更大的文件系统等功能）。 |\n| `xfs` | Xfs\
  \ 是一种高性能文件系统，通常用于替代 ext2/ext3/ext4 系列文件系统。 |\n| `btrfs` | 一种旨在扩展到大数据设备的文件系统。 |\n\
  | `UDF` | 通用磁盘格式文件系统主要用作 DVD 光盘的文件系统。 |\n| `ISO9660` | 专门设计用作 CD-ROM 光盘上的文件系统。 |\n\
  | `HFS` | Apple 开发的专有文件系统。在现代系统中更多用作 CD-ROM 光盘上的文件系统。 |\n\n### 对话学习™——哪种文件系统类型？(Conversational\
  \ Learning™—Which Filesystem Type?)\n\n**Gary**: 嗨，Julia。你能提供一些帮助吗？我正试图确定在我创建的新分区上使用什么文件系统。种类太多，我不知道选哪一个。\n\
  \n**Julia**: 嘿，Gary！我假设你说的是传统的分区，比如硬盘上的？不是像 CD-ROM 或 DVD 之类的对吧？\n\n**Gary**: 正确。\n\
  \n**Julia**: 好的，那排除了很多文件系统，比如 `UDF`、`ISO9660` 和 `HFS`。所以，第一步是确定你的发行版支持哪些。\n\n**Gary**:\
  \ 你的意思是不是所有发行版都支持所有文件系统吗？\n\n**Julia**: 不是，至少默认情况下不是。通常你可以安装额外的软件，但选择发行版自带的可能更好。\n\
  \n**Gary**: 我该如何判断呢？\n\n**Julia**: 通常发行版的文档会说明这一点。你也可以尝试创建你感兴趣的文件系统的特定命令。\n\n**Gary**:\
  \ 假设我有很多选择。我该选哪一个？`ext4`？还是 `xfs`？\n\n**Julia**: 这个问题没有简单的答案。你真的需要考虑你想用文件系统做什么，并进行研究以确定哪种最符合你的需求。\n\
  \n**Gary**: 你能举个例子吗？\n\n**Julia**: 当然。假设你的文件系统里会有大文件。在这种情况下，你可能会发现 `xfs` 的性能比其他文件系统更好。当然，你想探索其他功能，但这让你对要寻找的方向有了了解。\n\
  \n**Gary**: 好的，听起来在这里做“准备工作”很重要。还有其他建议吗？\n\n**Julia**: 有的，如果是关键文件系统，考虑创建几种类型并进行基准测试以找到效果最好的。另外，不要忘记考虑关键的安全特性，特别是如果文件系统会对公众开放（例如共享驱动器或包含\
  \ Web 服务器的文件）。\n\n**Gary**: 明白了。再次感谢，Julia。\n\n#### 管理分区 (Managing Partitions)\n\
  \n为了创建文件系统，你首先将需要创建一个或多个分区。分区用于将硬盘或其他存储介质逻辑上划分为更小的部分。通过创建分区，你在挂载、备份和文件系统安全方面拥有更大的灵活性。单个存储设备上的所有分区集合被称为*分区表*\
  \ (partition table)。\n\n在使用工具创建分区之前，你应该意识到有两种不同的分区方法：`MBR`（主引导记录）和 `GPT`（GUID 分区表）。\n\
  \n##### MBR\n\n\n\n\n\nMBR 分区表通常被称为“传统”分区表，与较新的分区表（如 GUID 分区表）形成对比。MBR 分区表的限制是默认情况下只允许四个分区。对于像\
  \ Linux 这样的操作系统来说，这是一个极其局限的因素。\n\n然而，MBR 分区表中的主分区之一可以转换为扩展分区。在扩展分区内部，可以添加更多的分区。这些额外的分区被称为\
  \ `logical partitions`（逻辑分区）。请参见图 10-4 示例。\n\n![Image](img/10fig04.jpg)\n\n**图 10-4**\
  \ *主引导记录*\n\n关于硬盘设备名称的说明：硬盘通过 `/dev` 目录下的设备名称进行进行用的。基于 IDE 的设备名称以 `/dev/hd` 开头，而\
  \ SETA、SCSI 和 USB 设备名称以 `/dev/sd` 开头。系统上的第一块驱动器命名为“a”，因此第一个 SETA 设备为 `/dev/sda`。第二个\
  \ SETA 设备为 `/dev/sdb`，依此类推。分区从 1 开始顺序编号，例如 `/dev/sda1`、`/dev/sda2` 和 `/dev/sda3`。\n\
  \n### GPT\n\nGPT 和 MBR 分区之间存在若干差异。然而，在这种情况下，你应该注意的最重要的一是分区表的结构。GPT 支持的分区数量比 MBR\
  \ 多得多，并且没有“四个主分区、一个扩展、多个逻辑”的结构。GPT 中的所有分区都简单地是分区，不需要克服与 MBR 分区相关的遗留问题。\n\n### 创建\
  \ MBR 分区\n\n要创建 MBR 分区，你可以使用 `fdisk` 命令。\n\n**注意**\n\n通常在安装过程中会使用整个硬盘，这使得很难创建分区来练习创建文件系统。如果你正在使用虚拟机，可以相当容易地向系统添加新磁盘（请咨询\
  \ VirtualBox、VMware 或你正在使用的任何虚拟化软件的文档）。如果不可行，你始终可以使用一个小型 U 盘进行练习——只需确保先删除 U 盘上的所有重要数据！\n\
  \n要显示设备的当前分区表，请对 `fdisk` 命令使用 `-l` 选项，如示例 10-1 所示。\n\n**示例 10-1** *`fdisk -l` 命令*\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# fdisk -l /dev/sdb\n\nDisk /dev/sdb:\
  \ 209 MB, 209715200 bytes\n255 heads, 63 sectors/track, 25 cylinders\nUnits = cylinders\
  \ of 16065 * 512 = 8225280 bytes\nSector size (logical/physical): 512 bytes / 512\
  \ bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk identifier: 0xccd80ba5\n\
  \n   Device Boot      Start         End      Blocks   Id  System\n```\n\n示例 10-1\
  \ 中的设备目前没有分区，因此“Device Boot Start End...”行下的数据是空的。如要向此设备添加分区，请使用不带 `-l` 选项的 `fdisk`\
  \ 命令：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# fdisk /dev/sdb\nWARNING: DOS-compatible\
  \ mode is deprecated. It's strongly recommended to\n         switch off the mode\
  \ (command 'c') and change display units to\n         sectors (command 'u').\nCommand\
  \ (m for help):\n```\n\n注意显示的警告。根据你的发行版版本，你可能不会收到此警告，因为这些建议（关闭模式并将显示单位更改扇区）有时是 `fdisk`\
  \ 命令的默认设置。如果你收到了此警告，请在命令提示符处输入 `quit` 退出 `fdisk` 实用程序，并 `-c` 和 `-u` 选项重新启动 `fdisk`\
  \ 命令：\n\n点击此处查看代码图像\n\n```\nCommand (m for help): quit\n[root@onecoursesource ~]#\
  \ fdisk -cu /dev/sdb\nCommand (m for help):\n```\n\n**注意**\n\n与其退出 `fdisk` 实用程序，不如考虑在命令提示符处使用\
  \ `c` 和 `u` 选项切换到正确的模式。\n\n要创建一个新分区，在命令提示符处输入 `n`：\n\n点击此处查看代码图像\n\n```\nCommand\
  \ (m for help): n\nCommand action\n   e   extended\n   p   primary partition (1-4)\n\
  p\nPartition number (1-4): 1\nFirst sector (2048-409599, default 2048):\nUsing default\
  \ value 2048\nLast sector, +sectors or +size{K,M,G} (2048-409599, default 409599):\n\
  Using default value 409599\n```\n\n要保存这些更改，在命令提示符处输入 `w`：\n\n点击此处查看代码图像\n\n```\n\
  Command (m for help): w\nThe partition table has been altered!\nSyncing disks.\n\
  ```\n\n### 使用 Parted 创建 MBR 分区\n\n`parted` 是一个交互式工具，可以显示和修改传统和 GUID 分区表。它还可以在分区上创建文件系统。要显示分区表，请使用\
  \ `-l` 选项（以 root 用户身份运行）：\n\n点击此处查看代码图像\n\n```\n [root@onecoursesource ~]# parted\
  \ -l /dev/sda\nGNU Parted 2.3\nUsing /dev/sda\nWelcome to GNU Parted! Type 'help'\
  \ to view a list of commands.\n(parted)\n```\n\n要修改驱动器的分区表，运行不带 `-l` 选项的 `parted`\
  \ 命令：\n\n点击此处查看代码图像\n\n```\n [root@onecoursesource ~]# parted /dev/sda\nGNU Parted\
  \ 2.3\nUsing /dev/sda\nWelcome to GNU Parted! Type 'help' to view a list of commands.\n\
  (parted)\n```\n\n在 **parted** 提示符处你可以输入若干实用命令，其中某些命令如表 10-2 所示。\n\n**表 10-2** **parted**\
  \ 提示符处的实用命令\n\n| **命令** | **描述** |\n| --- | --- |\n| `rm` | 删除分区。 |\n| `? 或 help`\
  \ | 显示可能的命令菜单。 |\n| `mkpart` | 创建新分区。 |\n| `mkpartfs` | 创建新分区并文件系统。 |\n| `print`\
  \ | 打印当前分区表。 |\n| `quit` | 不保存任何更改的情况下退出。 |\n| `w` | 将更改写入（保存）硬盘上的分区表。 |\n\n####\
  \ 创建文件系统\n\n现在你有了分区，可以使用 `mkfs` 命令创建文件系统。例如，要在 `/dev/sdb1` 分区上创建 ext4 文件系统，请如示例\
  \ 10-2 所示执行 `mkfs` 命令。\n\n**示例 10-2** *`mkfs` 命令*\n\n点击此处查看代码图像\n\n\n\n\n\n```bash\n\
  [root@onecoursesource ~]# mkfd -t ext4 /dev/sdb1\n-bash: mkfd: command not found\n\
  ``````bash\n[root@onecoursesource ~]# mkfs -t ext4 /dev/sdb1\nmke2fs 1.41.12 (17-May-2010)\n\
  Filesystem label=\nOS type: Linux\nBlock size=1024 (log=0)\nFragment size=1024 (log=0)\n\
  Stride=0 blocks, Stripe width=0 blocks\n51000 inodes, 203776 blocks\n10188 blocks\
  \ (5.00%) reserved for the super user\nFirst data block=1\nMaximum filesystem blocks=67371008\n\
  25 block groups\n8192 blocks per group, 8192 fragments per group\n2040 inodes per\
  \ group\nSuperblock backups stored on blocks:\n    8193, 24577, 40961, 57345, 73729\n\
  \nWriting inode tables: done\nCreating journal (4096 blocks): done\nWriting superblocks\
  \ and filesystem accounting information: done\n\nThis filesystem will be automatically\
  \ checked every 38 mounts or\n180 days, whichever comes first. Use tune2fs -c or\
  \ -i to override.\n```\n\n`mkfs` 命令是用于创建特定文件系统的命令的前端命令。例如，`mkfs -t ext4` 命令会运行 `mkfs.ext4`\
  \ 命令。你可以通过输入 `mkfs.` 然后按两次 `<TAB>` 键来查看 `mkfs` 命令可以创建哪些文件系统：\n\n点击此处查看代码图片\n\n```bash\n\
  [root@onecoursesource ~]# mkfs.\nmkfs.cramfs   mkfs.ext3     mkfs.ext4dev  mkfs.vfat\n\
  mkfs.ext2     mkfs.ext4     mkfs.msdos\n```\n\n你可以直接运行这些命令中的任何一个，但通常执行 `mkfs` 命令更简单。\n\
  \n`mkfs` 命令本身选项很少。然而，每个 `mkfs.*` 命令都有几个修改文件系统创建方式的选项。在使用 `mkfs` 命令指定选项时，任何不属于 `mkfs`\
  \ 命令的选项都会被传递给 `mkfs.*` 命令。例如，`mkfs.ext4` 命令的 `-m` 选项指定了文件系统（文件系统的百分比）预留给超级用户（默认为\
  \ 5%）。以下命令最终执行了 `mkfs.ext4` 命令并向该命令传递了 `-m` 选项：\n\n```bash\nmkfs -t ext4 -m 10 /dev/sdb1\n\
  ```\n\n### 安全亮点\n\n文件系统有很多选项，我们强烈建议你探索系统上文件系统的可用选项。启用哪些选项会对系统性能产生巨大影响，有时对安全性也是如此。\n\
  \n例如，考虑基于 ext 的文件系统的 `-m` 选项，它用于指定预留多少文件系统给超级用户。这样做是为了让 root 用户（或以 root 身份运行的守护进程）即使在普通用户“填满”文件系统的情况下能够在文件系统上存储文件。\n\
  \n假设你为 `/home` 有独立的文件系统，这是一个 500GB 的文件系统。除非你使用 `-m` 选项并指定不同的值，否则为超级用户预留的是 5%。如果你在创建此文件系统时没有使用此选项，这意味着有\
  \ 25GB 被预留给了 root 用户，而该用户可能永远不会在 `/home` 文件系统中放置文件！\n\n要了解更多关于这些选项的信息，请阅读针对你文件系统的帮助页面（man\
  \ page）。例如，要了解更多关于 ext4 的信息，你可以执行命令：`man mkfs.ext4`。\n\n#### 基于 ext 文件系统工具\n\n工具允许你更改和查看基于\
  \ ext 文件系统，包括：\n\n* `fsck.*`\n* `dumpe2fs`\n* `tune2fs`\n* `debugfs`\n\n##### fsck.*\n\
  \n`fsck` 命令（以及相关的 `fsck.*` 命令）的目的是修复文件系统问题。当操作系统没有正常关闭时，文件系统就会损坏或崩溃。这可能是由于停电或粗心的员工不小心踢到电源线导致的。\n\
  \n导致这种问题的原因是，文件系统元数据（关于文件的数据，如名称、权限、所有权、时间戳等）的更改最初存储在内存中。每隔一段时间，这些数据就会写入硬盘。然而，如果系统在这些数据仍在内存中时不正常关闭，硬盘上的数据就会过时，导致文件系统损坏。\n\
  \n当系统在不正常关闭后启动时，名为 `fsck`（文件系统检查）的实用程序会所有文件系统。在某些情况下，它会对文件系统进行更改，但通常任何错误都会导致启动（startup）过程失败。你需要手动修复文件系统错误。\n\
  \n`fsck` 工具非常直观。例如，要在第一个 SATA（串行高级技术附件）驱动器的第一个分区上执行它，请执行以下命令：\n\n```bash\nfsck /dev/sda1\n\
  ```\n\n你可能会收到很多类似于“某某，某某已损坏。你想修复它吗？”的问题。答案应该是“是”（否则你无法挂载或使用该文件系统）。因此，你可能希望带有 `-y`\
  \ 选项运行 `fsck` 工具以回答每个问题：\n\n```bash\nfsck -y /dev/sda1\n```\n\n### 安全亮点\n\n不要在运行的文件系统（live\
  \ systems）上运行 `fsck` 工具。运行的文件系统没有损坏；只有未挂载的文件系统才会出现这个问题。在运行的文件系统上运行 `fsck` 工具可能会导致问题，而不是修复问题。记住那句话：“如果没坏，就不要修它！”\n\
  \n你还应该知道，`fsck` 工具就像 `mkfs` 工具一样，实际上是特定文件系统 `fsck` 工具的前端工具。例如，如果你在 ext4 文件系统上执行\
  \ `fsck`，则执行 `fsck.ext4` 工具。\n\n注意，不同的 `fsck` 工具有不同的选项，因此请查看帮助页面以确定你可以使用哪些选项。\n\n\
  ##### dumpe2fs\n\n`dumpe2fs` 命令可以显示有关 ext* 文件系统的详细信息。该命令的输出巨大，并且默认包含大量关于块组描述符的信息，这通常是你不需要看到的内容。要在忽略块组描述符的情况下查看这些信息，请使用\
  \ `-h` 选项，如示例 10-3 所示。\n\n**示例 10-3** *`dumpe2fs` 命令*\n\n点击此处查看代码图片\n\n\n\n\n\n\
  ```\n[root@onecoursesource ~]# dumpe2fs -h /dev/sdb1\ndumpe2fs 1.41.12 (17-May-2010)\n\
  Filesystem volume name:   <none>\nLast mounted on:          <not available>\nFilesystem\
  \ UUID:          7d52c9b6-28a8-40dc-9fda-a090fa95d58f\nFilesystem magic number:\
  \  0xEF53\nFilesystem revision #:    1 (dynamic)\nFilesystem features:      has_journal\
  \ ext_attr resize_inode dir_index filetype extent flex_bg sparse_super huge_file\
  \ uninit_bg dir_nlink extra_isize\nFilesystem flags:         signed_directory_hash\n\
  Default mount options:    (none)\nFilesystem state:         clean\nErrors behavior:\
  \          Continue\nFilesystem OS type:       Linux\nInode count:             \
  \ 51000\nBlock count:              203776\nReserved block count:     10188\nFree\
  \ blocks:              191692\nFree inodes:              50989\nFirst block:   \
  \           1\nBlock size:               1024\nFragment size:            1024\n\
  Reserved GDT blocks:      256\nBlocks per group:         8192\nFragments per group:\
  \      8192\nInodes per group:         2040\nInode blocks per group:   255\nFlex\
  \ block group size:    16\nFilesystem created:       Tue Sep 15 00:12:17 2017\n\
  Last mount time:          n/a\nLast write time:          Tue Sep 15 00:12:18 2017\n\
  Mount count:              0\nMaximum mount count:      38\nLast checked:       \
  \      Tue Sep 15 00:12:17 2017\nCheck interval:           15552000 (6 months)\n\
  Next check after:         Sat Mar 12 23:12:17 2017\nLifetime writes:          11\
  \ MB\nReserved blocks uid:      0 (user root)\nReserved blocks uid:      0 (group\
  \ root)\nFirst inode:              11\nInode size:               128\nJournal inode:\
  \            8\nDefault directory hash:   half_md4\nDirectory Hash Seed:      a3bbea7e-f0c2-43b2-a5e2-9cd2d9d0eaad\n\
  Journal backup:           inode blocks\nJournal features:         (none)\nJournal\
  \ size:             4096k\nJournal length:           4096\nJournal sequence:   \
  \      0x00000001\nJournal start:            0\n```\n\n正如从示例 10-3 中所示，`dumpe2fs`\
  \ 命令提供了大量的信息。表 10-3 描述了一些较为重要的文件系统特性。\n\n### 表 10-3 文件系统特性\n\n| 选项 | 描述 |\n| ---\
  \ | --- |\n| 文件系统特性 | 这对于确定文件系统的能力非常重要。例如，示例 10-3 中的输出包含 `has_journal` 特性，这意味着该文件系统正在使用日志。\
  \ |\n| 默认挂载选项 | 虽然你可以在 `/etc/fstab` 文件中指定挂载选项（你将在本章后面的部分看到），但你也可以文件系统特性中嵌入默认挂载选项。输出的这部分告诉你是默认挂载选项。\
  \ |\n| Inode 计数 | 每个文件必须有一个 inode。因此，inode 计数告诉你文件系统中可以放置文件的最大数量。 |\n| 预留块计数 | 为超级用户预留的块数。\
  \ |\n| 块大小 | 该文件系统的块大小有多大。 |\n\n在大多数情况下，块组描述符信息是不需要的，但有一种情况下，你可能想要显示这些信息。当使用 `fsck`\
  \ 工具修复文件系统时，你可能会遇到“超级块损坏（bad superblock）”错误。超级块对文件系统的健康至关重要，因此在块组描述符中对这些信息进行了备份。如果你在不带\
  \ `-h` 选项运行 `dumpe2fs` 命令，你会看到许多如下输出部分：\n\n点击此处查看代码图像\n\n```\nGroup 1: (Blocks 8193-16384)\
  \ [INODE_UNINIT, ITABLE_ZEROED]\n  Checksum 0x12f5, unused inodes 2040\n  Backup\
  \ superblock at 8193, Group descriptors at 8194-8194\n  Reserved GDT blocks at 8195-8450\n\
  \  Block bitmap at 260, Inode bitmap at 276\n  Inode table at 546-800\n  7934 free\
  \ blocks, 2040 free inodes, 0 directories, 2040 unused inodes\n  Free blocks: 8451-16384\n\
  \  Free inodes: 2041-4080\n```\n\n注意“备份超级块”的位置为 8193。如果你的超级块包含错误，你可以使用这个备份超级块，如下所示：\n\
  \n```\nfsck -b 8193 /dev/sdb1\n```\n\n### tune2fs\n\n要更改文件系统，请使用 `tune2fs` 命令。例如，要更改为超级用户预留的文件系统百分比，请执行如下命令：\n\
  \n```\n[root@onecoursesource ~]# tune2fs -m 0 /dev/sdb1\ntune2fs 1.41.12 (17-May-2010)\n\
  Setting reserved blocks to 0% (0 blocks)\n```\n\n需要注意的是，并不是所有文件系统特性都可以通过 `tune2fs`\
  \ 命令更改。例如，inodes 的数量（每个文件必须有一个 inode，它用于存储有关文件的信息）是在文件系统创建时设置的，无法更改。如果你需要更多 inode，你必须备份文件系统、创建一个新文件系统并恢复数据。\n\
  \n### debugfs\n\n`debugfs` 命令非常有用的工具，允许你在交互式环境中执行操作。\n\n```\n[root@onecoursesource\
  \ ~]# debugfs /dev/sdb1\ndebugfs 1.41.12 (17-May-2010)\n```\n\n`debugfs` 工具提供了许多实用的命令，其功能类似于在当前目录中列出文件。示例\
  \ 10-4 所示：\n\n```\ndebugfs: ls\n```\n\n`debugfs` 允许你在文件系统上执行操作。正如示例 10-5 所示，你可以通过\
  \ `stat` 命令获取该文件的信息。\n\n### 示例 10-5 stat 命令\n\n```\ndebugfs:  stat yum.conf\nInode:\
  \ 56   Type: regular    Mode:  0644   Flags: 0x80000\nGeneration: 1017195304   \
  \ Version: 0x00000001\nUser:     0   Group:     0   Size: 969\nFile ACL: 4385  \
  \  Directory ACL: 0\nLinks: 1   Blockcount: 4\nFragment:  Address: 0    Number:\
  \ 0    Size: 0\nctime: 0x55f863e0 -- Tue Sep 15 11:30:56 2015\natime: 0x55f863e0\
  \ -- Tue Sep 15 11:30:56 2015\nmtime: 0x55f863e0 -- Tue Sep 15 11:30:56 2015\nEXTENTS:\n\
  (0): 8553\n```\n\n`debugfs` 命令最实用的功能之一是恢复删除文件的能力——只要你足够快！例如，考虑示例 10-6 中的情况，一个文件被意外删除了。\n\
  \n\n\n\n\n```\n[root@onecoursesource ~]# ls /data\nasound.conf                host.conf\
  \       nfsmount.conf                 smartd.conf\nautofs_ldap_auth.conf      idmapd.conf\
  \     nsswitch.conf                 sos.conf\ncgconfig.conf              kdump.conf\
  \      ntp.conf                      sudo.conf\ncgrules.conf               krb5.conf\
  \       openct.conf                   sudo-ldap.conf\ncgsnapshot_blacklist.conf\
  \  ld.so.conf      pm-utils-hd-apm-restore.conf  sysctl.conf\ndnsmasq.conf     \
  \          libaudit.conf   prelink.conf                  Trolltech.conf\ndracut.conf\
  \                libuser.conf    readahead.conf                updatedb.conf\nfprintd.conf\
  \               logrotate.conf  reader.conf                   warnquota.conf\ngai.conf\
  \                   lost+found      request-key.conf              xinetd.conf\n\
  grub.conf                  mke2fs.conf     resolv.conf                   yum.conf\n\
  gssapi_mech.conf           mtools.conf     rsyslog.conf\nhba.conf              \
  \     named.conf      sestatus.conf\n[root@onecoursesource ~]# rm /data/yum.conf\n\
  rm: remove regular file '/data/yum.conf'? y\n```\n\n要恢复此文件，首先卸载文件系统并使用 `-w` 选项启动\
  \ `debugfs` 命令（该选项会以读写模式打开文件系统）：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ umount /data\n[root@onecoursesource ~]# debugfs /dev/sdb1\ndebugfs 1.41.12 (17-May-2010)\n\
  debugfs:\n```\n\n现在使用 `lsdel` 命令列出已删除的文件并使用 `undel` 命令恢复文件。请记住，你必须在删除文件后尽快执行操作；否则数据块可能会被新文件占用。\n\
  \n### 基于 Xfs 文件系统的工具\n\n就像有工具帮助你查看和修改基于 ext 文件系统一样，也有工具允许你在基于 xfs 的文件系统上执行这些任务。这些工具包括：\n\
  \n* `xfsdump`\n* `xfsrestore`\n* `xfs_info`\n* `xfs_check`\n* `xfs_repair`\n\n**注意**\n\
  \n并不是所有的 Linux 发行版都提供 xfs 文件系统。如果你想练习 xfs 命令，请使用 CentOS 7，因为 xfs 是该发行版的默认文件系统。\n\
  \n#### xfsdump 和 xfsrestore\n\n`xfsdump` 命令用于备份文件系统到磁带设备或其他存储位置。假设你不太无法访问磁带设备，本节提供的示例使用普通文件作为备份存储位置。\n\
  \n示例 10-7 展示了创建 `/boot` 目录（在该系统上是 `/dev/sda1` 的挂载点）的完整备份，并将备份存入 `/tmp/boot_back`\
  \ 文件。\n\n**示例 10-7 `xfsdump` 命令**\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ xfsdump -f /tmp/boot_back /boot\nxfsdump: using file dump (drive_simple) strategy\n\
  xfsdump: version 3.1.4 (dump format 3.0) - type ^C for status and control\n\n =============================\
  \ dump label dialog ==============================\n\nplease enter label for this\
  \ dump session (timeout in 300 sec)\n -> /boot test\nsession label entered: \"/boot\
  \ test\"\n\n --------------------------------- end dialog ---------------------------------\n\
  \nxfsdump: level 0 dump of onecoursesource.localdomain:/boot\nxfsdump: dump date:\
  \ Mon Oct 19 20:31:44 2017\nxfsdump: session id: 5338bd39-2a6f-4c88-aeb8-04d469215767\n\
  xfsdump: session label: \"/boot test\"\nxfsdump: ino map phase 1: constructing initial\
  \ dump list\nxfsdump: ino map phase 2: skipping (no pruning necessary)\nxfsdump:\
  \ ino map phase 3: skipping (only one dump stream)\nxfsdump: ino map construction\
  \ complete\nxfsdump: estimated dump size: 191212416 bytes\nxfsdump: /var/lib/xfsdump/inventory\
  \ created\n\n ============================= media label dialog =============================\n\
  \nplease enter label for media in drive 0 (timeout in 300 sec)\n ->\nmedia label\
  \ entered: \"\"\n\n --------------------------------- end dialog ---------------------------------\n\
  \nxfsdump: WARNING: no media label specified\nxfsdump: creating dump session media\
  \ file 0 (media 0, file 0)\nxfsdump: dumping ino map\nxfsdump: dumping directories\n\
  xfsdump: dumping non-directory files\nxfsdump: ending media file\nxfsdump: media\
  \ file size 190911592 bytes\nxfsdump: dump size (non-dir files) : 190666096 bytes\n\
  xfsdump: dump complete: 17 seconds elapsed\nxfsdump: Dump Summary:\nxfsdump:   stream\
  \ 0 /tmp/boot_back OK (success)\nxfsdump: Dump Status: SUCCESS\n```\n\n注意，在示例 10-7\
  \ 执行 `xfsdump` 命令时，系统提示用户输入 label（标签）和 media label（媒体标签）。label 是备份的名称，而 media label\
  \ 是设备（如备份磁带）的名称。如果备份跨多个磁带，可以提供多个 media labels。\n\n默认情况下会进行完整备份。这被称为级别 0（全）备份。级别\
  \ 1 备份（增量备份）将备份自上次级别 0 备份以来更改的所有文件。级别 2 备份（差异备份）将备份自上次较低级别备份（0 或 1，以较新的为准）以来更改的所有文件。使用\
  \ `-l` 选项来指定备份级别（如果不指定 `-l`，则默认为 0）。\n\n注意，在示例 10-7 执行 `xfsdump` 命令时，系统提示用户输入 label\
  \ 和 media label。label 是备份的名称，而 media label 是设备（如备份磁带）的名称。如果备份跨多个磁带，可以提供多个 media\
  \ labels。\n\n```\n[root@onecoursesource ~]# xfsdump -f /tmp/boot_back /boot\nxfsdump:\
  \ using file dump (drive_simple) strategy\nxfsdump: version 3.1.4 (dump format 3.0)\
  \ - type ^C for status and control\n\n ============================= dump label\
  \ dialog ==============================\n\nplease enter label for this dump session\
  \ (timeout in 300 sec)\n -> /boot test\nsession label entered: \"/boot test\"\n\n\
  \ --------------------------------- end dialog ---------------------------------\n\
  \nxfsdump: level 0 dump of onecoursesource.localdomain:/boot\nxfsdump: dump date:\
  \ Mon Oct 19 20:31:44 2017\nxfsdump: session id: 5338bd39-2a6f-4c88-aeb8-04d469215767\n\
  xfsdump: session label: \"/boot test\"\nxfsdump: ino map phase 1: constructing initial\
  \ dump list\nxfsdump: ino map phase 2: skipping (no pruning necessary)\nxfsdump:\
  \ ino map phase 3: skipping (only one dump stream)\nxfsdump: ino map construction\
  \ complete\nxfsdump: estimated dump size: 191212416 bytes\nxfsdump: /var/lib/xfsdump/inventory\
  \ created\n\n ============================= media label dialog =============================\n\
  \nplease enter label for media in drive 0 (timeout in 300 sec)\n ->\nmedia label\
  \ entered: \"\"\n\n --------------------------------- end dialog ---------------------------------\n\
  \nxfsdump: WARNING: no media label specified\nxfsdump: creating dump session media\
  \ file 0 (media 0, file 0)\nxfsdump: dumping ino map\nxfsdump: dumping directories\n\
  xfsdump: dumping non-directory files\nxfsdump: ending media file\nxfsdump: media\
  \ file size 190911592 bytes\nxfsdump: dump size (non-dir files) : 190666096 bytes\n\
  xfsdump: dump complete: 17 seconds elapsed\nxfsdump: Dump Summary:\nxfsdump:   stream\
  \ 0 /tmp/boot_back OK (success)\nxfsdump: Dump Status: SUCCESS\n```\n\n通常你只想恢复单个文件。一种方法是使用\
  \ `xfsrestore` 命令的交互模式。请在示例 10-9 中查看此演示（注意为了简洁，省略了部分输出）。\n\n```\n[root@onecoursesource\
  \ ~]# xfsrestore -i -f /tmp/boot_back /tmp\n\n ========== subtree selection dialog\
  \ ==========================\n\nthe following commands are available:\n    pwd\n\
  \    ls [ <path> ]\n    cd [ <path> ]\n    add [ <path> ]\n    delete [ <path> ]\n\
  \    extract\n    quit\n    help\n-> ls\n###Omitted###\n             135 config-3.10.0-229.el7.x86_64\n\
  \             134 System.map-3.10.0-229.el7.x86_64\n             133 .vmlinuz-3.10.0-229.el7.x86_64.hmac\n\
  \          524416 grub2/\n             131 grub/\n-> add config-3.10.0-229.el7.x86_64\n\
  \n -> extract\n```\n\n\n\n\n`xfs_info` 命令提供了有关当前挂载的 xfs 文件系统的某些基本文件系统信息，如示例 10-10\
  \ 所示。\n\n**示例 10-10** `xfs_info` 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# xfs_info /dev/sda1\nmeta-data=/dev/sda1              isize=256    agcount=4,\
  \ agsize=32000 blks\n         =                       sectsz=512   attr=2, projid32bit=1\n\
  \         =                       crc=0        finobt=0\ndata     =            \
  \           bsize=4096   blocks=128000, imaxpct=25\n         =                 \
  \      sunit=0      swidth=0 blks\nnaming   =version 2              bsize=4096 \
  \  ascii-ci=0 ftype=0\nlog      =internal               bsize=4096   blocks=853,\
  \ version=2\n         =                       sectsz=512   sunit=0 blks, lazy-count=1\n\
  realtime =none                   extsz=4096   blocks=0, rtextents=0\n```\n\n## xfs_check\
  \ and xfs_repair\n\n类似于 `fsck` 实用，`xfs_repair` 实用用于修复未挂载的 xfs 文件系统。请参示例 10-11 演示。\n\
  \n**示例 10-11** `xfs_repair` 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# xfs_repair\
  \ /dev/sda1\nPhase 1 - find and verify superblock...\nPhase 2 - using internal log\n\
  \        - zero log...\n        - scan filesystem freespace and inode maps...\n\
  \        - found root inode chunk\nPhase 3 - for each AG...\n        - scan and\
  \ clear agi unlinked lists...\n        - process known inodes and perform inode\
  \ discovery...\n        - agno = 0\n        - agno = 1\n        - agno = 2\n   \
  \     - agno = 3\n        - process newly discovered inodes...\nPhase 4 - check\
  \ for duplicate blocks...\n        - setting up duplicate extent list...\n     \
  \   - check for inodes claiming duplicate blocks...\n        - agno = 0\n      \
  \  - agno = 1\n        - agno = 2\n        - agno = 3\nPhase 5 - rebuild AG headers\
  \ and trees...\n        - reset superblock...\nPhase 6 - check inode connectivity...\n\
  \        - resetting contents of realtime bitmap and summary inodes\n        - traversing\
  \ filesystem ...\n        - traversal finished ...\n        - moving disconnected\
  \ inodes to lost+found ...\nPhase 7 - verify and correct link counts...\ndone\n\
  ```\n\n如果你只是想检查文件系统问题，而不修复任何问题，请运行 `xfs_check` 命令而不是 `xfs_repair` 命令。\n\n你可能会发现你的发行版没有包含\
  \ `xfs_check` 命令，而是允许对 `xfs_repair` 命令使用 `-n` 选项（不修复），因为它执行了与 `xfs_check` 命令相同的任务。无论使用哪种命令，请确保在执行命令之前已卸载了文件系统。\n\
  \n## 额外的文件系统工具\n\n`du` 和 `df` 命令用于显示文件系统信息。这些工具独立于文件系统类型。\n\n### du\n\n`du` 命令提供目录结构中磁盘空间使用的估计值。例如，以下命令显示了\
  \ `/usr/lib` 目录占用的空间：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]$ du -sh /usr/lib\n\
  791M    /usr/lib\n```\n\n`/usr/lib` 命令的重要选项包括表 10-4 所示所示。\n\n**表 10-4** `/usr/lib`\
  \ 命令的选项\n\n| 选项 | 说明 |\n| --- | --- |\n| `-h` | 以人类可读的大小显示值。 |\n| `-s` | 显示摘要，而不是每个子目录的大小。\
  \ |\n\n### df\n\n`df` 命令显示分区和逻辑设备的使用情况：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]$\
  \ df\nFilesystem          1K-blocks      Used Available Use% Mounted on\nudev  \
  \                2019204        12   2019192   1% /dev\ntmpfs                  404832\
  \       412    404420   1% /run\n/dev/sda1            41251136   6992272  32522952\
  \  18% /\nnone                        4         0         4   0% /sys/fs/cgroup\n\
  none                     5120         0      5120   0% /run/lock\nnone         \
  \         2024         0      2024   0% /run/lock\n```\n\n\n\n\n| `mount_options`\
  \ | 最后一个字段至关重要，因为你作为管理员可以通过此字段影响文件系统的行为。有大量的挂载选项可以改变文件系统的行为。每种文件系统类型都有不同的挂载选项（尽管某些挂载选项适用于多个文件系统）。一个很好的例子是\
  \ `rw` 选项，你可以在示例 10-12 中的多种文件系统类型看到该选项。该选项使文件系统可读可写。 |\n\n请注意，`mount` 命令知道系统当前挂载了哪些内容，因为这些信息存储在\
  \ `/etc/mtab` 文件中，如示例 10-13 所示。\n\n### 示例 10-13：`/etc/mtab` 文件\n\n点击此处查看代码图片\n\n\
  ```\n[root@onecoursesource ~]# more /etc/mtab\n/dev/mapper/vg_livecd-lv_root / ext4\
  \ rw 0 0\nproc /proc proc rw 0 0\nsysfs /sys sysfs rw 0 0\ndevpts /dev/pts devpts\
  \ rw,gid=5,mode=620 0 0\ntmpfs /dev/shm tmpfs rw,rootcontext=\"system_u:object_r:tmpfs_t:s0\"\
  \ 0 0\nnone /proc/sys/fs/binfmt_misc binfmt_misc rw 0 0\nsunrpc /var/lib/nfs/rpc_pipefs\
  \ rpc_pipefs rw 0 0\n/dev/sr0 /media/VBOXADDITIONS_5.0.2_102096 iso9660\nro,nosuid,nodev,uhelper=udisks,uid=500,gid=500,iocharset=utf8,mode=0400,dmode=0500\
  \ 0 0\n/dev/sda1 /boot ext4 rw,usrquota,grpquota 0 0\n```\n\n每当文件系统被挂载或卸载时，`/etc/mtab`\
  \ 文件就会更新。另一个包含挂载文件系统信息的文件是 `/proc/mounts`，如示例 10-14 所示。\n\n### 示例 10-14：`/proc/mounts`\
  \ 文件\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# more /proc/mounts\nrootfs /\
  \ rootfs rw 0 0\nproc /proc proc rw,relatime 0 0\nsysfs /sys sysfs rw,seclabel,relatime\
  \ 0 0\ndevtmpfs /dev devtmpfs rw,seclabel,relatime,size=247568k,nr_inodes=61892,mode=755\
  \ 0 0\ndevpts /dev/pts devpts rw,seclabel,relatime,gid=5,mode=620,ptmxmode=000 0\
  \ 0\ntmpfs /dev/shm tmpfs rw,seclabel,relatime 0 0\n/dev/mapper/vg_livecd-lv_root\
  \ / ext4 rw,seclabel,relatime,barrier=1,data=ordered 0 0\nnone /selinux selinuxfs\
  \ rw,relatime 0 0\ndevtmpfs /dev devtmpfs rw,seclabel,relatime,size=247568k,nr_inodes=61892,mode=755\
  \ 0 0\n/proc/bus/usb /proc/bus/usb usbfs rw,relatime 0 0\nnone /proc/sys/fs/binfmt_misc\
  \ binfmt_misc rw,relatime 0 0\nsunrpc /var/lib/nfs/rpc_pipefs rpc_pipefs rw,relatime\
  \ 0 0\n/etc/auto.misc /misc autofs rw,relatime,fd=7,pgrp=1822,timeout=300,minproto=5,maxproto=5,indirect\
  \ 0 0\n-hosts /net autofs rw,relatime,fd=13,pgrp=1822,timeout=300,minproto=5,maxproto=5,indirect\
  \ 0 0\n/dev/sr0 /media/VBOXADDITIONS_5.0.2_102096 iso9660 ro,nosuid,nodev,relatime,uid=500,gid=500,iocharset=utf8,mode=0400,dmode=0500\
  \ 0 0\n/dev/sda1 /boot ext4 rw,seclabel,relatime,barrier=1,data=ordered,usrquota,grpquota\
  \ 0 0\n```\n\n虽然这两个文件都包含关于当前挂载文件系统的信息，但存在一些你应该注意的差异：\n\n*   `/etc/mtab` 文件由 `mount`\
  \ 和 `umount` 命令管理。`mount` 命令有一个选项 (`-n`)，意为“不更新”。\n*   `/proc/mounts` 文件由内核管理。\n\
  *   `/proc/mounts` 文件比 `/etc/mtab` 更实时。\n\n### 手动挂载文件系统\n\n挂载文件系统时，你可以指定类型和挂载点。例如，使用以下语法：\n\
  \n```bash\nmount -t type device /mountpoint\n```\n\n如果你需要重新挂载文件系统为只读，使用 `-o` 选项：\n\
  \n```bash\nmount -o remount,ro device /mountpoint\n```\n\n### 安全亮点\n\n另一个有挂载选项是\
  \ `ro`，它允许将文件系统挂载为只读。如果文件系统当前可写，可以通过以下命令将其改为只读：\n\n```bash\nmount -o remount,ro\
  \ /mount\n```\n\n### 卸载文件系统的问题\n\n如果文件系统正在使用，则无法卸载。文件系统可能被使用的几个原因包括：\n\n*   有文件在文件系统中处于打开状态。\n\
  *   有进程正在文件系统中运行。\n*   有用户的 Shell “处于”文件系统中。也就是说，挂载点目录或挂载点下的子目录是某个用户的当前目录。\n\n对于需要卸载文件系统的系统管理员来说，这可能是令人沮丧的。你不希望看到如下错误信息：\n\
  \n```\n[root@onecoursesource ~]# umount /boot\numount: /boot: device is busy.\n\
  \        (在某些情况下，关于使用设备的进程有用信息\n         可以通过 lsof(8) 或 fuser(1) 获取)\n```\n\n请注意，错误信息包含了使用\
  \ `lsof` 或 `fuser` 命令的建议。`lsof` 命令是一个列打开文件的很好的命令，在这种情况下 `fuser` 命令更有用。\n\n以文件系统的挂载点作为参数执行\
  \ `fuser` 命令，可以揭示哪个进程正在使用该文件系统：\n\n```\n[root@onecoursesource ~]# fuser /boot\n\
  /boot:                4148c\n```\n\n示例中的值 4148 表示进程的 PID，`c` 表示进程的使用方式。以下内容直接摘自\
  \ `fuser` 手页文档：\n\n\n\n\n\n```\nc      当前目录。\ne      正在运行的可执行文件。\nf      打开的文件。在默认显示模式下省略\
  \ f。\nF      以写模式打开的文件。在默认显示模式下省略 F。\nr      根目录。\nm      mmap 映射的文件或共享库。\n```\n\
  \n因此，`c` 表示 PID 为 `4148` 的进程正在使用 `/boot` 目录（或 `/boot` 目录的子目录）作为当前目录。如果你使用 `-v` 选项（用于“详细模式”），你可以看到更多细节：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# fuser -v /boot\n                \
  \     USER        PID ACCESS COMMAND\n/boot:               bob        4148 ..c..\
  \ bash\n```\n\n现在，你现在可以找到用户 `bob` 并让他离开 `/boot` 目录。或者，你也可以使用 `fuser` 命令的另一个有用选项来杀掉那个让你头疼的进程：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# fuser -k /boot\n/boot:          \
  \      4148c\n[root@onecoursesource ~]# fuser -v /boot\n[root@onecoursesource ~]#\
  \ umount /boot\n```\n\n### 安全要点\n\n当执行 `fuser -k` 命令时，它会向文件系统中所有阻止你卸载该文件系统的进程发送信号。这个信号被称为\
  \ `SIGKILL` 信号，它带来了一个潜在的安全问题，因为它强制所有这些进程停止，而不提供任何优雅关闭的机会。这意味着，如果进程在退出时通常会执行清理操作（例如删除临时文件或将数据保存到文件或数据库中），该进程将没有机会执行这些任务。\n\
  \n最好先尝试对进程进行优雅关闭。这可以通过在使用 `fuser` 命令的 `-k` 选项时包含 `-15` 选项来实现。如果运行 `fuser -k -15`\
  \ 后短时间内进程没有停止，则执行不带 `-15` 选项的 `fuser -k`。\n\n关于进程控制的更多细节请参阅第 24 章，“进程控制](#ch24.xhtml_ch24)”。\n\
  \n## 自动挂载文件系统\n\n若干文件系统会在启动时自动挂载。挂载哪些文件系统取决于 `/etc/fstab` 文件中的设置。参见示例 10-15](#ch10.xhtml_exa10_15)\
  \ 获取示例 `/etc/fstab` 文件。\n\n**示例 10-15 *`/etc/fstab` 文件***\n\n点击此处查看代码图像\n\n```\n\
  [student@onecoursesource ~]$ more /etc/fstab\n# 可访问的文件系统，通过引用维护在 '/dev/disk' 下\n\
  # 更多信息请查看 man pages fstab(5), findfs(8), mount(8) 和/or blkid(8)\n#\n/dev/mapper/vg_livecd-lv_root\
  \ /                   ext4   defaults 1\nUUID=974e2406-eeec-4a49-9df7-c86d046e97f9\
  \ /boot   ext4   usrquota,grpquota,defaults\n1 2\n/dev/mapper/vg_livecd-lv_swap\
  \ swap              swap    defaults        0 0\ntmpfs                   /dev/shm\
  \                tmpfs   defaults        0 0\ndevpts                  /dev/pts \
  \               devpts  gid=5,mode=620\nsysfs                   /dev/sys       \
  \         sysfs   defaults        0 0\nproc                    /proc           \
  \        proc    defaults 0\n```\n\n`/etc/fstab` 的每行包含六个字段，用空格分隔，这些字段描述了文件系统的位置、类型、挂载位置以及选项。点击此处查看代码图像\n\
  \n```\ndevice_to_mount   mount_point   fs_type   options\ndump_level\n```\n\n**表\
  \ 10-7 *`/etc/fstab` 文件***\n\n| 选项 | 描述 |\n| :--- | :--- |\n| **device_to_mount**\
  \ | 这是要挂载的设备。使用 UUID 或 label 是常见做法，以避免设备名称问题。 |\n| **mount_point** | 文件系统放置的目录。\
  \ |\n| **fs_type** | 文件系统类型（例如 `ext4`、`xfs`、`vfat`、`btrfs`）。 |\n| **options** |\
  \ 挂载时使用的选项。 |\n| **dump_level** | 此值用于 `dump` 命令确定备份哪些文件系统。值 1 表示“备份”，值 0 表示“不备份”。\
  \ |\n| **fsck_value** | 当系统启动时，`fsck` 命令会检查文件系统。值 0 表示“不检查”，值 1 或更高表示“按顺序检查”。在单驱动器上，使用任何其他值都没有优势。然而，如果你有多个驱动器，你可能希望使用相同的值来加速，因为\
  \ `fsck` 可以并行运行。 |\n\n\n\n\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# e2label\
  \ /dev/sda2\ndata\n[root@onecoursesource ~]# blkid | grep sda2\n/dev/sda2: UUID=\"\
  974e2406-eeec-4a49-9df7-c86d046e97f9\" TYPE=\"ext4\" LABEL=\"data\"\n```\n\n虽然使用标签（labels）挂载设备比使用设备名称要好，但仍然不是理想的。如果你将此磁盘从当前系统取出并添加到另一个系统中，可能会发生标签冲突。如果新系统也有一个标签为“data”的分区，就会导致问题。\n\
  \n最稳定的解决方案是使用 UUID 数字。通用唯一标识符（UUID）是在设备创建时分配给设备的数字。由于这个数字非常大（128 位）以及其生成方式，几乎不可能有两个设备具有相同的数字。`blkid`\
  \ 命令可以显示设备的 UUID：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# blkid | grep sda2\n\
  /dev/sda2: UUID=\"974e2406-eeec-4a49-9df7-c86d046e97f9\" TYPE=\"ext4\" LABEL=\"\
  data\"\n```\n\n要在 `/etc/fstab` 文件中使用 UUID，请使用以下语法：\n\n点击此处查看代码图像\n\n```\nUUID=974e2406-eeec-4a49-9df7-c86d046e97f9\
  \  /data  ext4  defaults 0 1\n```\n\n最后，需要注意的是，并不是所有设备都需要使用 UUID 或标签。考虑 `/etc/fstab`\
  \ 文件中的以下行：\n\n点击此处查看代码图像\n\n```\n/dev/mapper/vg_livecd-lv_swap swap            \
  \        swap    defaults        0 0\n```\n\n`/dev/mapper/vg_livecd-lv_swap` 设备是一个逻辑卷（逻辑卷将在第\
  \ 11 章中的“管理本地存储：高级功能”中详细讨论）。除非你作为管理员更改名称，否则逻辑卷设备名称不会改变。其他设备，如网络驱动器和软件 RAID 设备也不需要\
  \ UUID 或标签。\n\n### 挂载选项\n\n文件系统的行为在部分取决于你提供的挂载选项。有几十种不同的挂载选项可用。需要了解最重要的选项是与关键字 `defaults`\
  \ 相关的。当你在 `/etc/fstab` 文件中指定 `defaults` 为挂载选项时，你实际上指定了 `rw`、`suid`、`dev`、`exec`、`auto`、`nouser`、`async`\
  \ 和 `relatime` 选项。表 10-8 详细描述了这些选项。\n\n#### 表 10-8 默认选项\n\n| 选项 | 说明 |\n| --- |\
  \ --- |\n| `rw` | 将文件系统挂载为读写。要将文件系统挂载为只读，请使用选项 `ro`。 |\n| `suid` | 在文件系统的文件上启用 SUID\
  \ 权限 set（详情参阅第 9 章“文件权限”）。使用 `nosuid` 选项禁用 SUID 权限 set。在文件系统上禁用 SUID 权限 set 通常是为了防止用户创建\
  \ SUID 程序，这可能导致安全风险。（注意：`/` 和 `/usr` 文件系统永远不应使用 `nosuid` 选项挂载。） |\n| `dev` | 允许在文件系统使用设备文件。通常设备文件只位于\
  \ `/dev` 目录下，因此出于安全考虑，在所有文件系统（除 `/` 文件系统外）使用 `nodev` 选项将产生更安全的系统。 |\n| `exec` |\
  \ 启用文件系统中的可执行文件。使用 `noexec` 选项禁用可执行文件。在服务器上禁止可执行文件可能是一个好主意，可以防止用户向服务器引入新程序。 |\n\
  | `auto` | 该选项用于管理员在使用 `mount` 命令的 `-a` 选项时。`-a` 选项意味着“挂载 `/etc/fstab` 文件中带有 `auto`\
  \ 选项的文件系统”。请记住，当系统启动时，使用 `mount -a` 命令挂载文件系统，因此使用 `noauto` 选项也意味着文件系统在启动过程中不会自动挂载。\
  \ |\n| `nouser` | 不允许普通用户挂载文件系统。出于安全考虑，这是最佳选项，但在某些你可能希望用户挂载可移动设备。在这种情况下，使用 `user`\
  \ 选项。如果你使用了 `user` 选项，一旦文件系统挂载，只有该用户可以卸载该文件系统。还要注意 `user` 选项，它允许任何用户挂载。 |\n| `async`\
  \ | 异步确保所有数据已写入硬盘。通常当文件创建或修改时，元数据（文件信息）存储在内存中。每隔一段时间将其写入硬盘，这减少了硬盘写入并防止了过载。 |\n|\
  \ `relatime` | 每个文件有三个时间戳：文件内容最后修改的时间、元数据最后更改的时间以及文件最后访问的时间。文件访问时间通常并不重要，但它会导致大量的系统写入，特别是当你对目录执行递归命令（如\
  \ `grep -r`）时。`relatime` 启用更新访问时间。如果这导致了性能问题，考虑将选项改为 `noatime`。 |\n\n之前提到的这些不是唯一的选项；事实上有更多。要发现这些选项，请浏览\
  \ `mount` 命令的帮助页。首先查看“文件系统无关选项”部分，因为它包含了适用于大多数文件系统的选项。然后搜索你正在使用的文件系统。示例 10-16 显示了\
  \ **mount** 手书中与 ext4 文件系统相关的部分。\n\n**示例 10-16** *ext4 文件系统的挂载选项*\n\n点击此处查看代码图像\n\
  \n```\nMount options for ext4\n       ext4 文件系统是 ext3 文件系统的高级版本，\n       整合了扩展性和可靠性增强以支持大文件系统。\n\
  \n       选项 journal_dev, noload, data, commit, orlov, oldalloc,\n       [no]user_xattr\
  \ [no]acl, bsddf, minixdf, debug, errors, data_err, grpid,\n       bsdgroups, nogrpid,\
  \ sysvgroups, resgid, resuid, sb, quota, noquota,\n       grpquota, usrquota 和 [no]bh\
  \ 与 ext3 或 ext2 兼容。\n\n       journal_checksum\n              启用日志事务的校验和。这将允许\n\
  \              e2fsck 中的恢复代码和内核检测内核中的\n              损坏。这是一个兼容性更改，旧版本内核会忽略它。\n\n\
  \       journal_async_commit\n              提交块可以在等待描述符块写入之前写入磁盘。如果启用此选项，旧版本内核将无法挂载设备。\n\
  ```\n\n\n\n\n\n当可移动介质（如 CD-ROM 或 DVD）自动挂载时，它通常会被放置在 `/media` 目录下。在运行 GUI（如 Gnome\
  \ 或 KDE）的现代 Linux 发行版上，不需要配置此过程，因为这些软件程序能够识别新的可移动介质并自动挂载。\n\n然而，在没有运行 GUI 的系统中，这种自动挂载过程不会发生。你可以通过以下\
  \ `/etc/fstab` 条目配置系统，让普通用户能够挂载可移动设备：\n\n点击此处查看代码\n\n```\n/dev/cdrom /media udf,iso9660\
  \ noauto,owner 0 0\n```\n\n### 交换空间\n\n当可用 RAM 不足时，操作系统会使用交换空间。RAM 中当前未使用的数据会被“交换”到硬盘上为该用途保留的专用空间，以便为其他进程使用\
  \ RAM 腾出空间。\n\n通常你会在安装过程中创建一个交换分区。在安装后的某个时间，你可能会决定添加额外的交换空间。这可以是另一个交换分区或一个交换文件的形式。\n\
  \n要查看当前激活的交换设备，执行带有 `-s` 选项 `swapon` 命令：\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ ~]# swapon -s\nFilename            Type          Size       Used      Priority\n\
  /dev/dm-1           partition     1048568\n```\n\n从 `swapon -s` 命令的输出中，你可以看到交换文件系统的设备名称（`/dev/dm-1`）、交换文件系统的大小（字节）以及该空间已使用了多少。优先级表示应该先使用哪个交换文件系统。\n\
  \n### 创建交换设备\n\n交换设备可以是存储设备（分区、逻辑卷、RAID 等），也可以是文件。通常存储设备比交换文件快一点，因为内核不需要通过文件系统即可访问存储设备上的交换空间。然而，你并不总是能向系统添加新设备，因此可能会发现交换文件更多地用作辅助交换设备。\n\
  \n假设你已经创建了一个标记类型为 82 的新分区（在本例中为 `/dev/sdb1`），可以通过执行以下命令将其格式化为交换设备：\n\n点击此处查看代码\n\
  \n```\n[root@onecoursesource ~]# mkswap /dev/sdb1\nSetting up swapspace version\
  \ 1, size = 203772 KiB\nno label, UUID=039c21dc-c223-43c8-8176-da2f4d508402\n```\n\
  \n你可以使用 `swapon` 命令将此添加到现有的交换空间中：\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]#\
  \ swapon -s\nFilename                 Type          Size          Used         \
  \ Priority\n/dev/dm-1                partition     1048568       37636         -1\n\
  root@onecoursesource ~]# swapon /dev/sdb1\n[root@onecoursesource ~]# swapon -s\n\
  Filename                 Type          Size          Used          Priority\n/dev/dm-1\
  \                partition     1048568       37636         -1\n/dev/sdb1       \
  \         partition     203768        0             -2\n```\n\n记住 `swapon` 命令只是临时解决方案。在\
  \ `/etc/fstab` 中添加如下所示的条目以使其成为永久交换设备：\n\n点击此处查看代码\n\n```\nUUID=039c21dc-c223-43c8-8176-da2f4d508402\
  \ swap    defaults    0 0\n```\n\n要创建交换文件，你首先需要创建一个大文件。使用 `dd` 命令最容易实现此点。示例 10-17\
  \ 显示了如何创建一个名为 `/var/extra_swap` 的 200MB 文件并将其启用为交换空间。\n\n**示例 10-17** *创建文件并启用交换空间*\n\
  \n点击此处查看代码\n\n```\n[root@onecoursesource ~]# dd if=/dev/zero of=/var/extra_swap\
  \ bs=1M count=200\n200+0 records in\n200+0 records out\n209715200 bytes (210 MB)\
  \ copied, 4.04572 s, 51.8 MB/s\n[root@onecoursesource ~]# mkswap /var/extra_swap\n\
  mkswap: /var/extra_swap: warning: don't erase bootbits sectors\n        on whole\
  \ disk. Use -f to force.\nSetting up swapspace version 1, size = 204796 KiB\nno\
  \ label, UUID=44469984-0a99-45af-94b7-f7e97218d67a\n[root@onecoursesource ~]# swapon\
  \ /var/extra_swap\n[root@onecoursesource ~]# swapon -s\nFilename             Type\
  \          Size         Used       Priority\n/dev/dm-1            partition    \
  \ 1048568      37664      -1\n/dev/sdb1            partition     203768       0\
  \          -2\n/var/extra_swap      file          204792       0          -3\n```\n\
  \n如果你决定手动从当前交换空间中移除设备，请使用 `swapoff` 命令：\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ ~]# swapon -s\nFilename         Type          Size        Used          Priority\n\
  /dev/dm-1        partition     1048568     27640         -1\n/var/extra_swap  file\
  \          204792      0             -2\n[root@onecoursesource ~]# swapoff /var/extra_swap\n\
  [root@onecoursesource ~]# swapon -s\nFilename        Type          Size        Used\
  \          Priority\n/dev/dm-1       partition     1048568     27640         -1\n\
  ```\n\n### 总结\n\n在本章中，你学习了如何创建分区和文件系统，以及如何执行基本的文件系统操作任务。这是通过手动和自动挂载分区，并使用挂载和卸载操作期间提供的不同选项实现的。\n\
  \n## 关键术语\n\n- 物理文件系统\n- 虚拟文件系统\n- 挂载点\n- 挂载\n- 标签\n- UUID\n- 同步\n- 交换空间\n- 日志\n\
  - 快照 (snapshot)\n- [inode]](#ch10.xhtml_key10_11)\n\n## 复习题\n\n**1.** 下列哪项用于 CD-ROM\
  \ 光光上的文件系统？（选择两个）\n\n1. ext2\n2. HFS\n3. ISO9660\n4. UDF\n\n**2.** 使用 _____ 命令用于卸载文件系统。\n\
  \n**3.** 哪些命令可以用于确定是什么阻止了你卸载文件系统？（选择两个）\n\n1. `mount`\n2. `umount`\n3. `fuser`\n\
  4. `lsof`\n\n**4.** `fuser` 命令的哪个选项显示保持文件系统繁忙的进程的所有者？\n\n1. `-k`\n2. `-o`\n3. `-v`\n\
  4. 以上所有\n\n**5.** 下列哪个命令用于显示设备的 UUID？\n\n1. `e2label`\n2. `mount`\n3. `sync`\n4.\
  \ `blkid`\n\n**6.** 使用 _____ 命令从当前交换空间移除交换设备。\n\n**7.** 下列哪种文件系统支持大小达 2TB 的文件？\n\
  \n1. ext2\n2. ext3\n3. ext4\n4. 以上都不是\n\n**8.** 下列哪个命令可以用于创建分区？\n\n1. `mkfs`\n2.\
  \ `fsck`\n3. `dumpe2fs`\n4. `fdisk`\n\n**9.** 填空创建一个 ext4 文件系统：_____\n\n**10.**\
  \ `tune2fs` 命令的 _____ 选项允许更改超级用户保留的文件系统百分比。\n\n## 第 11 章\n\n管理本地存储：高级功能\n\n本章的重点是管理高级本地存储设备功能。本章的第一部分涵盖了文件系统加密，以保护移动设备。\n\
  \n\n\n\n\n接下来，我们将探索 autofs 的功能。该功能允许当用户进入特定目录时，设备会自动出现在目录结构中。此功能对于本地存储和远程存储设备都很有用。远程存储设备将在第\
  \ 12 章“管理网络存储”中介绍。\n\n最后，你将学习逻辑卷管理的基础知识，它是传统分区的替代方案。\n\n在阅读本章并完成练习后，你将能够完成以下操作：\n\
  \n- 创建并挂载加密文件系统\n- 管理 autofs\n- 管理逻辑卷\n- 设置磁盘配额\n- 管理硬链接和软链接\n\n### 加密文件系统\n\n你可能使用过如\
  \ `GnuPG` 等软件来加密文件。这种技术被称为`文件级加密`，旨在加密特定的文件，通常是为了确保它们能够被安全地传输。加密文件系统的目的相似，但通常出于不同的原因而执行。\n\
  \n考虑一种情况：你需要通过 USB 闪存盘将数千个文件传输给另一个人。逐个加密每个文件将是一个冗味的过程（解密也是如此）。加密整个文件系统所提供的安全优势与加密单个文件一样（实际上优势更多）。\n\
  \n为什么加密整个文件系统比加密单个文件更好呢？请考虑，当你加密单个文件时，部分文件数据（所有者、权限、时间戳等）对潜在威胁仍然是可见的。如果你加密了整个文件系统，除非文件系统被解密，否则这些细节将无法获取。\n\
  \n此外，如果你的笔记本电脑包含敏感数据，加密文件系统可以防止在电脑丢失或被盗时发生授权的访问。\n\n在涉及 Linux 文件系统加密时，你需要了解的一项重要技术是规范\
  \ LUKS (Linux 统一密钥设置)。当我们说 `LUKS` 是一个规范时，是指它描述了在 Linux 上如何加密文件系统。它不提供任何软件，也不是一个官方标准（尽管规范通常被称为“非官方标准”）。\n\
  \n由于是一项规范，`LUKS` 并不强制你使用任何特定的软件工具来加密文件系统。虽然有不同的工具可用，但为了本书的目的，我们将演示一种基于内核的实现方式，称为\
  \ `DMCrypt`。\n\n`DMCrypt` 是一个内核模块，允许内核理解加密的文件系统。除了 `DMCrypt` 模块外，你应该了解两个可以创建和挂载加密文件系统的命令：`cryptsetup`\
  \ 和 `cryptmount` 命令。注意，你只需要使用这两个命令中的一个（最可能是 `cryptsetup` 命令）来配置加密文件系统。\n\n以下步骤演示了如何使用\
  \ `cryptsetup` 命令创建一个新的加密文件系统。开始之前，你可能需要加载一些内核模块（有关 `modprobe` 命令的详情，请参阅第 28 章“系统启动”）：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# modprobe dm-crypt\n[root@onecoursesource\
  \ ~]# 25- sha256\n```\n\n接下来，在新分区上创建一个 LUKS 格式的密码。请注意，如果你使用的是现有的分区，首先需要备份所有数据并卸载该分区。以下命令将覆盖\
  \ `/dev/sda3` 分区上的数据：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# cryptsetup\
  \ --verbose --verify-passphrase\nluksFormat /dev/sda3\nWARNING!\n========\n这将不可逆地覆盖\
  \ /dev/sda3 上的数据。\n确定确定吗？(输入大写的 yes): YES\nEnter passphrase:\nVerify passphrase:\n\
  Command successful.\n```\n\n从之前 `cryptsetup` 命令的输出中可以看出，系统提示你提供密码（一个如句子或简单短语的字符字符串）。当你需要挂载文件系统时，就需要这个密码。\n\
  \n接下来，你需要运行一个命令创建一个新的加密设备文件。以下操作将创建一个名为 `/dev/mapper/data` 的文件，稍后用于挂载加密文件系统。你输入的密码必须与之前通过\
  \ `cryptsetup` 命令创建的密码匹配。\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# cryptsetup\
  \ luksOpen /dev/sda3 data\nEnter passphrase for /dev/sda3:\n```\n\n现在文件系统已打开（你可以将其视为“解锁”或“解密”），请在新设备上创建一个文件系统，如示例\
  \ 11-1 所示。\n\n**示例 11-1** *创建文件系统*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ mkfs -t ext4 /dev/mapper/data\nmke2fs 1.42.9 (28-Dec-2013)\nFilesystem label=\n\
  OS type: Linux\nBlock size=4096 (log=2)\nFragment size=4096 (log=2)\nStride=0 blocks,\n\
  ```\n\n\n\n\n\n```\n[root@onecoursesource Desktop]# more /etc/auto.master\n#\n#\
  \ Sample auto.master 文件\n# 这是一个 'master' 自动挂载映射，它具有以下格式：\n# mount-point [map-type[,format]:]map\
  \ [options]\n# 有关格式的详情请查看 auto.master(5)。\n#\n/misc    /etc/auto.misc\n#\n# 注意：从\
  \ hosts 映射执行的挂载将带有\n#    \"nosuid\" 和 \"nodev\" 选项，除非显式给出\n#    \"suid\" 和 \"dev\"\
  \ 选项。\n#\n/net    -hosts\n#\n# 包含 /etc/auto.master.d/*.autofs\n# 包含的文件必须符合此文件的格式。\n\
  #\n+dir:/etc/auto.master.d\n#\n# 如果可以使用 nsswitch 源找到则包含中央主映射。\n#\n# 注意，如果被包含的主映射中存在针对\
  \ /net 或 /misc 的\n# 条目（如上所示），那么任何相同的键将不会被看到，\n# 因为第一个读取的键具有优先级。\n#\n+auto.master\n\
  ```\n\n请注意，默认文件的大部分由注释组成，该文件中目前存在四个设置。这些设置中有三个是基础设置，并在表 11-1 中描述。\n\n**表 11-1**\
  \ 默认 `/etc/auto.master` 设置\n\n| 设置 | 说明 |\n| --- | --- |\n| `/net -hosts` | 此设置提供了一个有用的功能，可以自动挂载从远程系统共享的\
  \ NFS（网络文件系统）设备。启用此设置后，你可以直接导航到 `/net/*machine_name` 来自动挂载该远程机器共享的所有 NFS 设备。例如，如果你导航到\
  \ `/net/server1`，那么 autofs 将自动挂载主机名为为 server1 的机器上的所有 NFS 共享。或者，如果你进入 `/net/192.168.1.1`，那么\
  \ autofs 将自动挂载 IP 地址为 192.168.1.1 的机器上的所有 NFS 共享。注意：NFS 共享将在第 12 章中详细介绍。 |\n| `+dir:/etc/auto.master.d`\
  \ | 此设置允许你在 `/etc/auto.master.d` 目录中创建带有额外 autofs 设置的文件。大多数管理员可能会直接修改 `/etc/auto.master`\
  \ 文件，但 `/etc/auto.master.d` 目录的优势是，想要添加 autofs 挂载的软件供应商可以通过在该目录中放置文件来实现，而不是在安装过程中尝试编辑\
  \ `/etc/auto.master` 文件。 |\n| `+auto.master` | 正如你从 `/etc/auto.master` 文件的注释所示，此设置用于“如果可以使用\
  \ nsswitch 源找到则包含中央主映射”。如果你查看 `/etc/nsswitch.conf` 文件，将有一个如下所示条目：`automount: files`。如果你有来自其他源（如\
  \ NIS 网络信息服务器）的 autofs 设置，可以通过更改 `/etc/nsswitch.conf` 文件中的条目使其看起来像这样来将其整合到本地系统中：`automount:\
  \ files nis`。 |\n\n除了表 11-1 中的设置外，典型的 `/etc/auto.master` 文件中还有另一个条目：\n\n点击此处查看代码图像\n\
  \n```\n/misc    /etc/auto.misc\n```\n\n该条目是所谓的*间接 autofs 映射*的开头。间接映射需要两个文件中的设置：`/etc/auto.master`\
  \ 文件和作为行中第二个值指定的文件（在本例中为 `/etc/auto.misc`）。对于自动挂载守护进程，这意味着“如果用户或进程切换到 `/misc` 目录下的子目录，则查看\
  \ `/etc/auto.misc` 中的条目以获取其余信息。”\n\n如果你的默认 `/etc/auto.master` 文件中有引用 `/etc/auto.misc`\
  \ 文件的条目，那么也也应该有一个默认的 `/etc/auto.misc` 文件。示例 11-3 演示了 CentOS 7.x 系统上的默认 `/etc/auto.misc`\
  \ 文件。\n\n**示例 11-3** CentOS 7.x 系统上的 `/etc/auto.misc` 文件\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource Desktop]# more /etc/auto.misc\n#\n# 这是一个自动挂载映射，它具有以下格式\n#\
  \ key [ -mount-options-separated-by-comma ] location\n# 详情可以查看 autofs(5) 手页\n\n\
  cd        -fstype=iso9660,ro,nosuid,nodev        :/dev/cdrom\n\n# 以下条目为示例，用以激发你的想象力\n\
  #linux        -ro,soft,intr        ftp.example.org:/pub/linux\n#boot         -fstype=ext2\
  \         :/dev/hda1\n#floppy       -fstype=auto         :/dev/fd0\n#floppy    \
  \   -fstype=ext2         :/dev/fd0\n#e2floppy     -fstype=ext2         :/dev/fd0\n\
  #jaz          -fstype=ext2         :/dev/sdc1\n#removable    -fstype=ext2      \
  \   :/dev/hdd\n```\n\n这些行中的大部分都被注释消了，但有一行提供了一个当前启用的设置：\n\n点击此处查看代码图像\n\n```\ncd\
  \        -fstype=iso9660,ro,nosuid,nodev    :/dev/cdrom\n```\n\n第一个字段（在此例中为 `cd`）包含生成挂载点的剩余路径。第二个字段包含挂载选项，第三个字段是要挂载的设备。换句话说，根据示例\
  \ 11-3 中的条目，如果用户或进程进入 `/misc/cd` 目录，本地的 `/dev/cdrom` 设备将使用 `-fstype=iso9660,ro,nosuid,nodev`\
  \ 挂载选项进行挂。\n\n在运行 GUI 的现代 Linux 发行版中，GUI 会自动挂载 CD-ROM。但在未运行 GUI 的服务器上不会发生，因此此设置可能会让普通用户更容易访问\
  \ CD-ROM（通常他们是不允许挂载 CD-ROM 的）。\n\n假设你想创建一个自动挂载，将 `server1:/usr/share/doc` 的 NFS\
  \ 共享挂载到 `/nfs/doc` 目录下，并创建一个自动挂载将 `plan9:/aliens` 的 NFS 共享挂载到 `/nfs/aliens` 目录下。首先在\
  \ `/etc/auto.master` 文件中添加以下条目：\n\n点击此处查看代码图像\n\n```\n/nfs            /etc/auto.custom\n\
  ```\n\n然后在 `/etc/auto.custom` 文件中添加以下条目：\n\n点击此处查看代码图像\n\n```\nDoc        -fstype=nfs\
  \    server1:/usr/share/doc\nAliens     -fstype=nfs    plan9:/aliens\n```\n\n接下来，创建\
  \ `/nfs` 目录（注意，在现代系统中，这一步可能不是的，但也没有坏处）：\n\n```\nmkdir /nfs\n```\n\n不要创建任何子目录；`/nfs/doc`\
  \ 和 `/nfs/aliens` 将由自动挂载守护进程根据需要创建（然后在不再需要时删除）。\n\n最后，启动或重启 autofs 服务。假设你正在 SysVinit\
  \ 系统上工作，执行操作：\n\n```\n/etc/init.d/autofs start\n```\n\n注意，你也可以创建直接映射，它的复杂性较低，并且推荐用于简单挂载。对于直接映射，你在\
  \ `/etc/auto.master` 文件中添加如下的条目：\n\n```\n/-    /etc/auto.direct\n```\n\n然后将完整的挂载点、挂载选项和要挂载的设备放在\
  \ `/etc/auto.direct` 文件中：\n\n点击此处查看代码图像\n\n```\n/remote/aliens    -fstype=nfs  \
  \  plan9:/aliens\n```\n\n每当你对这些映射文件进行任何更改时，请记住重启 autofs 服务。\n\n### 逻辑卷管理器\n\n几十年来在\
  \ x86 平台上使用的分区技术具有局限性。例如，整个分区必须位于单个磁盘上，这使得在系统添加新硬盘时很难利用磁盘空间。调整传统分区也不容易。\n\n\n\n\n\
  \n`Logical Volume Manager (LVM)` 是一种可以替代传统分区的技术。使用 `LVM`，你可以将新的存储空间整合到现有的存储设备中，本质上扩展了已包含文件系统的设备的容量。`LVM`\
  \ 还允许你创建“快照”，让你能够对运行中的文件系统创建备份。\n\n### 逻辑卷管理器概念\n\n**注意**\n\n本节介绍了一些理解理解至关重要的术语：逻辑卷管理器\
  \ (`LVM`）、卷组（volume group）、物理卷（physical volume）、物理范围（physical extent）等。在阅读关于 `LVM`\
  \ 的文档时，你几乎总是会看到这些术语的缩写（卷组 = `VG`，物理卷 = `PV` 等）。因此，本章也遵循在引入术语后使用缩写的惯例。这旨在帮助你习惯这种用法。\n\
  \n你被分配了一项在现有系统上安装新数据库服务器的任务。你告诉经理你需要 100GB 的额外存储空间，他回答道：“没问题，我会让人把它送到你的办公室。”第二天，一个包裹寄到了，里面有三块新的\
  \ 40GB 硬盘。你立刻意识到了一个问题，因为数据库软件需要一个单一的 100GB 存储容器。当你告诉老板这个问题时，你被告知只能使用为你提供的资源。现在该怎么办？\n\
  \n你可以将三块硬盘放入一个软件 RAID `0` 设备中，但你意识到如果未来数据库服务器需要更多空间，这将带来问题。你也知道在数据库使用期间对其进行可靠的备份是非常重要的。幸运的是，你知道一种技术允许你即时添加更多空间，并提供对运行中文件系统进行备份的技术：`LVM`（逻辑卷管理器）。\n\
  \n通常，有两个心理障碍阻碍了管理员接受 `LVM`：\n\n*   理解为什么 `LVM` 比普通分区好得多\n*   理解 `LVM` 工作原理的概念\n\n\
  因此，在深入学习实现 `LVM` 所需的命令之前，我们先来探索这项技术的优势和概念。\n\n**注意**\n\n`LVM` 有两种主要的实现：`LVM1` 和\
  \ `LVM2`。本章的大部分主题适用于这两两者。当存在差异时，会进行说明。为了避免混淆，`LVM` 一词同时指代 `LVM1` 和 `LVM2`。\n\n以下列表描述了\
  \ `LVM` 的一些优势：\n\n*   `LVM` 可用于获取多个存储设备并将它们合并为一个内核感知为单一存储设备的设备。这意味着你可以取三块 40GB 的硬盘并将它们合并成一个\
  \ 120GB 的单一存储设备。事实上，设备的大小或类型不必完全相同，因此你可以将一个 30GB 的硬盘、一个 20GB 的 USB 驱动器（只要不拔掉它！）和一个\
  \ 25GB 的 iSCSI 设备合并为一个单一存储设备。你甚至可以通过创建一个分区并将其添加到 `LVM` 来使用硬盘的部分空间。\n*   通过 `LVM`，你可以通过添加新的物理存储设备并将该设备添加到\
  \ `LVM` 中来为现有的文件系统添加空间。本章稍后部分将提供相关示例。\n*   即使你不需要非常大的存储容器，也不担心增加文件系统的大小，如果你的系统中有多个硬盘，`LVM`\
  \ 仍然很有用。通过使用 `LVM` 的条带（striping）功能，你可以让数据并发写入多块硬盘，这可以大幅提高 I/O（输入/输出）速度。\n*   由于备份工具的工作原理，备份运行中的文件系统通常是有问题的。这些工具通常先备份文件系统元数据，然后备份文件内容。在运行中的文件系统中，如果文件内容在备份元数据和备份文件内容之间发生变化，就会导致问题。`LVM`\
  \ 有一个名为 `snapshot`（快照）的功能，允许你在实际文件系统保持活动的同时备份其冻结的镜像。本章稍后部分将对此进行更详细的解释。\n\n听起来 `LVM`\
  \ 对一切都是完美的。诚然，在大多数情况下，你可能应该使用 `LVM` 而不是传统分区，但 `LVM` 有一些你应该考虑的缺点：\n\n*   `LVM` 不提供像\
  \ `RAID` 那样的冗余（话虽如此，传统分区也不提供）。但是，你可以通过创建软件 RAID `1` 设备并将它们作为 `LVM` 中使用的存储设备来解决这个问题。`LVM2`\
  \ 也有包含软件 RAID 的功能（但是针对第 4、5 或 6 层，而不是第 1 层）。\n*   某些旧的固件和引导加载不知道如何访问 `LVM` 设备。因此，你经常看到\
  \ `/boot` 文件系统放置在普通分区上。然而，最近这种情况开始发生变化，因为更现代的固件和引导加载程序可以访问 `LVM` 设备。\n\n### 单硬盘系统上\
  \ LVM 的优势\n\n你可能在奇怪为什么要在在一个只有一个硬盘的系统上使用 `LVM`。为了回答这个问题，让我们给你们描述一个我们在系统管理员职业生涯中多次处理过的情况。\n\
  \n我们经常被分配安装新系统的任务，并且总是尝试根据情况创建符合逻辑的分区。例如，如果我们正在安装邮件服务器，我们会确保创建一个单独的 `/var` 文件系统。如果我们正在安装一台有多个用户的机器，我们会确保\
  \ `/home` 文件系统位于单独的分区上。因此，最终得到一个看起来像表 11-2 所示的分区布局并不罕见。\n\n#### 表 11-2 示例分区布局\n\n\
  | 分区 | 挂载点 | 大小 |\n| :--- | :--- | :--- |\n| `/dev/sda1` | `/boot` | 200MB |\n|\
  \ `/dev/sda2` | `/var` | 1.5GB |\n| `/dev/sda5` | `/` | 5GB (注意：`/dev/sda3` 未使用，`/dev/sda4`\
  \ 是扩展分区。) |\n| `/dev/sda6` | `/tmp` | 500MB |\n| `/dev/sda7` | `/home` | 2.5GB |\n\
  \n通常，表 11-2 描述的文件系统布局可以正常运行一段时间。然而，这种状态并不总是持久的，因为文件系统需要随时间推移而变化。例如，一次发现 `/tmp` 文件系统经常填满，但\
  \ `/home` 文件系统的占用率甚至不到 10%。如果能从 `/home` 文件系统（位于 `/dev/sda7` 分区）取一些空间并分给 `/tmp` 文件系统（位于\
  \ `/dev/sda6` 分区），那就太棒了，但这并不是一项容易的任务。通用的步骤如下：\n\n1.  备份 `/home` 中的数据（`/tmp` 是临时数据，因此不需要备份该文件系统）。\n\
  2.  卸载 `/home` 和 `/tmp`（这可能需要切换到单用户模式）。\n3.  删除 `/dev/sda7` 和 `/dev/sda6` 分区。\n\
  4.  创建新的、调整大小后的 `/dev/sda7` 和 `/dev/sda6` 分区。\n5.  分区上创建文件系统。\n6.  恢复数据。\n7.  挂载\
  \ `/home` 和 `/tmp` 文件系统。\n\n如果你认为这工作量很大，请考虑从 `/home` (`/dev/sda7`) 文件系统取空间并分给 `/var`\
  \ (`/dev/sda2`) 文件系统。这可能需要修改除 `/dev/sda1` 分区以外的所有分区，这将花费大量的时间和精力。\n\n如果这些是 `LVM`\
  \ 存储设备而不是普通分区，该过程将简单得多，所需的数据备份和停机时间也会少得多。你可以轻松地减少一个 `LVM` 存储设备的空间并给另一个 `LVM` 存储设备，或者你只需要向系统添加新的存储设备并将该空间提供给需要更多空间的文件系统即可。\n\
  \n\n\n\n希望到此时，你已经确信 LVM 的用处，并且至少愿意放弃普通分区而改用 LVM。下一个障碍是理解 LVM 的概念。\n\n**注意**\n\n\
  如果你想练习 LVM 命令，可以考虑使用虚拟机。如果你正在使用虚拟机，可以轻松创建三个新的虚拟硬盘来练习本章中描述的 LVM 命令。\n\n回到原始场景：你有三块\
  \ 40GB 的硬盘，你需要让内核将总计 100GB 的这些空间视为单个存储设备。在安装这些设备后，该过程的第一步是将它们转换为物理卷 (PVs)。这是通过执行\
  \ `pvcreate` 命令完成的。例如，如果你有三块块设备名称为 `/dev/sdb`、`/dev/sdc` 和 `/dev/sdd` 的驱动器，可以通过执行以下命令将它们转换为\
  \ PV：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource Desktop]# pvcreate /dev/sdb /dev/sdc\
  \ /dev/sdd\n  Physical volume \"/dev/sdb\" successfully created\n  Physical volume\
  \ \"/dev/sdc\" successfully created\n  Physical volume \"/dev/sdd\" successfully\
  \ created\n```\n\n从概念上考虑这一点，请查看图 11-2 中目前为止创建的内容。\n\n![Image](img/11fig02.jpg)\n\
  \n**图 11-2** *物理卷*\n\n现在你已经格式化了 PV，需要将它们放入一个新的卷组 (VG 中。你可以通过执行以下命令创建此 VG 并将 PV 存放在其中：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# vgcreate VG0 /dev/sdb /dev/sdc /dev/sdd\n\
  \  Volume group \"VG0\" successfully created\n```\n\nVG 是一个用于将 PV 组合在一起的容器。VG 内部的空间可以用于创建逻辑卷\
  \ (LVs。逻辑卷的工作方式与分区一样；你可以在 LVs 上创建文件系统并像普通分区一样挂载它们。\n\n在探索如何创建 LV 之前，请查看图 11-3 以查看\
  \ VG 的视觉表示。\n\n![Image](img/11fig03.jpg)\n\n**图 11-3** *VG0 卷组*\n\n### 扩展 (Extents)\n\
  \n当创建 VG 时，PV 提供的空间被划分为称为*物理区 (physical extents)* 的小块。默认情况下，区的大小为 4MB，但你可以在创建 VG\
  \ 时使用 `-s` 选项来指定它：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# vgcreate -s 16MB\
  \ VG0 /dev/sdb /dev/sdc /dev/sdd\n```\n\n注意，区的大小不是以后可以调整的。对于 LVM1 来说，这是一个重要功能，因为你使用这些区来构建\
  \ LVs，并且每个 LV 可以使用的区数量是限制的。例如，如果 VG 的区大小为 4MB，你可以通过使用 VG 中的五个区来构建一个 20MB 的 LV。\n\
  \n如果你的系统使用的是 LVM1，关键是要知道每个 LV 最多可以有 65,534 个区。如果你计算一下，这意味着如果你的 VG 有 4MB 的区，那么 LV\
  \ 最大可以是 256GiB（请参阅 [`wintelguy.com/gb2gib.html`](http://wintelguy.com/gb2gib.html)\
  \ 了解 GB 和 GiB 之间的差异）。在大多数情况下这足够了，但如果不是，请用较大的区大小创建 VG。\n\n65,534 个区的限制在 LVM2 中被消，如果你使用的是现代发行版，这很可能是你正在使用的\
  \ LVM 版本。然而，在大型 LV 上使用小的区会减慢 LVM 工具的速度（尽管它对输入/输出性能没有影响）。\n\n最大的区大小是 16GiB，所以你可能会奇怪为什么不直接使用最大的区大小。这种方法的问题在于，每个\
  \ LV 必须使用区大小的整数倍。换句话说，如果你的区大小是 16GiB，那么你的 LVs 就可以是 16GiB、32GiB、48GiB 等。这并不是一种灵活的方法。\n\
  \n为了直视化物理区的概念，请查看图 11-4 中的黑框（但想象一下多得多，因为我们场景中的每个 PV 都是 40GB，而每个区只有 4MB）。\n\n![Image](img/11fig04.jpg)\n\
  \n**图 11-4** *物理区*\n\n如果你想查看区的大小以及其他有用的 VG 信息，执行 `vgdisplay` 命令，如示例 11-4 所示。\n\n\
  **示例 11-4** *`vgdisplay` 命令*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# vgdisplay\
  \ VG0\n  --- Volume group ---\n  VG Name               VG0\n  System ID\n  Format\
  \                lvm2\n  Metadata Areas        3\n  Metadata Sequence No  1\n  VG\
  \ Access             read/write\n  VG Status             resizable\n  MAX LV   \
  \             0\n  Cur LV                0\n  Open LV               0\n  Max PV\
  \                0\n  Cur PV                3\n  Act PV                3\n  VG Size\
  \               1.49 GiB\n  PE Size               4.00 MiB\n  Total PE         \
  \     381\n  Alloc PE / Size       0 / 0\n  Free  PE / Size       381 / 1.49 GiB\n\
  \  VG UUID               AbRpPe-vaV3-1SKI-eFMB-IN48-Fdkt-U54OW7\n```\n\n**注意**\n\
  \n虽然原始场景是使用三块 40GB 的硬盘，但此示例使用了三个 500MB 的虚拟硬盘。如果你在虚拟机上练习这些命令，我们建议使用较小的虚拟硬盘，而不是浪费空间创建巨大的虚拟硬盘。\n\
  \n注意格式被设置为 `lvm2`，因此在这个系统上，我们没有每个 LV 65,534 个区的限制。`VG Size` 值表示 VG 中可用的空间，`Total\
  \ PE` 值表示可分配给 LVs 的物理区总数。\n\n如果你对 `vgdisplay` 命令使用 `-v` 选项，你还会看到与 VG 关联的任何 PV 和\
  \ LV 的信息。此时我们还没有创建任何 LV，因此执行 `vgdisplay -v` 命令提供了示例 11-5 所示的额外信息。\n\n**示例 11-5**\
  \ *`vgdisplay -v` 命令*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# vgdisplay\
  \ VG0\n  --- Volume group ---\n  VG Name               VG0\n  System ID\n  Format\
  \                lvm2\n  Metadata Areas        3\n  Metadata Sequence No  1\n  VG\
  \ Access             read/write\n  VG Status             resizable\n  MAX LV   \
  \             0\n  Cur LV                0\n  Open LV               0\n  Max PV\
  \                0\n  Cur PV                3\n  Act PV                3\n  VG Size\
  \               1.49 GiB\n  PE Size               4.00 MiB\n  Total PE         \
  \     381\n  Alloc PE / Size       0 / 0\n  Free  PE / Size       381 / 1.49 GiB\n\
  \  VG UUID               AbRpPe-vaV3-1SKI-eFMB-IN48-Fdkt-U54OW7\n```\n\n\n\n\n要使用\
  \ VG 中的空间创建一个 LV（逻辑卷），请执行 `lvcreate` 命令。在创建 LV 时，你可以启用多个选项。一个简单的示例是创建一个 LV，并指定你想要使用的多少个区（extents）：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# lvcreate -l 6 -n lv0 VG0\n  Logical\
  \ volume \"lv0\" created.\n```\n\n`-n` 选项用于指定 LV 的名称。`-l` 选项用于指定创建 LV 时使用多少个区区。要指定新\
  \ LV 的大小，请使用 `-L` 选项而不是 `-l` 选项（例如，`lvcreate -L 120M -n lv0 VG0`）。\n\n要了解执行 `lvcreate`\
  \ 命令时发生了什么，请查看图 11-5。\n\n![Image](img/11fig05.jpg)\n\n**图 11-5** *逻辑卷*\n\n新的 LV\
  \ 是使用来自 VG 中第一个 PV（物理卷）的六个 PE（物理区）构建的。你可以通过在 `lvcreate` 命令中使用 `-i` 选项选择从每个 PV 使用两个\
  \ PE。`-i` 选项用于指示创建 LV 时使用多少个 PV（称为*条带*/stripes）。这里是一个示例：\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource ~]# lvcreate -i 3 -l 6 -n lv1 VG0\n Using default stripesize\
  \ 64.00 KiB.\n Logical volume \"lv1\" created.\n```\n\n### 设备命名\n\n现在有两个新设备 `lv0`\
  \ 和 `lv1`，你可以在 `/dev` 目录结构中看到已创建的设备名称。事实上，你现在有三种方法来引用每个设备：LVM1 方法、LVM2 方法以及“真实”设备名称。\n\
  \n在 LVM1 中，`/dev` 目录下会创建一个与 VG 名称匹配的目录，在该目录内会创建与 LV 名称匹配的文件。因此，如果你有一个名为 `VG0` 的\
  \ VG 和两个名为 `lv0` 和 `lv1` 的 LV，那么你应该看到以下文件：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# ls /dev/VG0\nlv0  lv1\n```\n\n然而，这些并不是真实的设备名称，而是指向真实设备名称的符号链接。你可以通过查看以下命令的输出看到这一点：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# ls -l /dev/VG0\ntotal 0\nlrwxrwxrwx.\
  \ 1 root root 7 Oct 27 09:14 lv0 -> ../dm-3\nlrwxrwxrwx. 1 root root 7 Oct 27 09:14\
  \ lv1 -> ../dm-3\n```\n\n真实的设备名称是 `/dev/dm-3` 和 `/dev/dm-4`。\n\n### 使用逻辑卷和额外的 LVM\n\
  \n现在是简单部分了：将 `/dev/mapper/VG0-lv0` 视为一个普通分区。你会对分区做什么？\n\n1. 创建文件系统。\n2. 创建一个挂载点。\n\
  3. 挂载文件系统。\n4. 验证挂载。\n5. 在 `/etc/fstab` 中添加条目以便在启动时挂载。\n\n从创建文件系统开始，如示例 11-7 所示。\n\
  \n**示例 11-7** *创建文件系统*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mkfs -t ext4\
  \ /dev/mapper/VG0-lv0\nmke2fs 1.41 (17-May-2010)\nFilesystem label=\nOS type: Linux\n\
  Block size=1024 (log=0)\nFragment size=1024 (log=0)\nStride=0 blocks, Stripe width=0\n\
  6144 inodes, 24576 blocks\n5.0% reserved for the super user\nFirst data block=1\n\
  Maximum filesystem blocks=25165824\n3 block groups\n8192 blocks per group, 8192\
  \ fragments per group\n2048 inodes per group\nSuperblock backups stored on blocks:\n\
  \        8193\nWriting inode tables: done\nCreating journal (1024 blocks): done\n\
  Writing superblocks and filesystem accounting information: done\nThis filesystem\
  \ will be automatically checked every 20 mounts or\n180 days, whichever comes first.\
  \ Use tune2fs -c or -i to override\n```\n\n现在像这样创建一个挂载点、挂载文件系统并验证挂载：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# mkdir /storage-lv0\n[root@onecoursesource ~]# mount\
  \ /dev/mapper/VG0-lv0 /storage-lv0\n[root@onecoursesource ~]# mount | grep lv0\n\
  /dev/mapper/VG0-lv0 on /storage-lv0 type ext4 (rw)\n```\n\n最后，在 `/etc/fstab` 文件中添加如下条目：\n\
  \n点击此处查看代码图像\n\n```\n/dev/mapper/VG0-lv0  /storage  ext4  defaults 0 2\n```\n\n\
  ### 显示 LVM 信息\n\n有多个命令可以显示 LVM 信息，包括已经介绍过的几个。例如，回想 `vgdisplay` 命令提供有关 VG 的信息。现在创建了两个新的\
