  \n输出中的每个 cell 部分都描述了一个无线路由器。以下是一些重要值：\n\n*   **ESSID**: 扩展服务集标识（Extended Service\
  \ Set Identification）；这基本上是赋予无线路由器的名称，用于与其他附近的无线路由器区分。某些供应商将其简单称为 SSID。这是管理员分配无线接入点的名称。\n\
