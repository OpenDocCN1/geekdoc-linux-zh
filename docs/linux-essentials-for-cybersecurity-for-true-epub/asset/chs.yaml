  需要 351 KB 的存档。\n此后将占用 1345 KB 的磁盘空间。\n获取:1 http://us.archive.ubuntu.com/ubuntu/\
  \ trusty/universe joe amd64 3.7-2.3ubuntu1\n[351 KB]\n获取 351 KB ...\n1 个软件包将下载并安装。\n\
  下载了 351 KB。\n此后将使用 1345 KB 。\n正在选择 joe。\n解压 joe (3.7-2.3ubuntu1)...\n设置 joe (3.7-2.3ubuntu1)...\n\
