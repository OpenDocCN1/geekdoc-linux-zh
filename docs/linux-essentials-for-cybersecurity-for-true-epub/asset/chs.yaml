  \ 所示。\n\n![Image](img/21fig10.jpg)\n\n**图 21-10** *Firefox 菜单选项*\n\n**步骤 2.** 点击\
  \ `Preferences`（偏选项）按钮。在某些浏览器上，此按钮标记为 `Options`（选项）。结果与图 21-11 所示。\n\n![Image](img/21fig11.jpg)\n\
  \n**图 21-11** *Firefox 偏选项*\n\n**步骤 3.** 通常代理设置位于 `Advanced`（高级）部分。在本例中，点击左侧菜单中的\
  \ `Advanced`，然后点击出现菜单上的 `Network`（网络）（参见图 21-12\n\n**图 21-12** *Firefox 高级网络设置*\n\
  \n**步骤 4.** 点击 `Configure how Firefox connects to the Internet`（配置 Firefox 如何连接互联网）旁边的\
