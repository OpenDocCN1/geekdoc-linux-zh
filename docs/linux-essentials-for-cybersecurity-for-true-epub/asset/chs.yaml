  server 3.fedora.pool.ntp.org iburst\n\n# Enable public key cryptography.\n#crypto\n\
  \nincludefile /etc/ntp/crypto/pw\n\n# Key file containing the keys and key identifiers\
  \ used when operating\n# with symmetric key cryptography.\nkeys /etc/ntp/keys\n\
  ```\n\n`pool.ntp.org` 地址是一个地理上分布在世界各地的 NTP 服务器集群。这些服务器可以在 `/etc/ntp.conf` 文件中自由使用。例如，以下服务器由\
  \ Fedora 项目提供（注意，这些通常是镜像，指向其他系统，因此一旦你连接到这些服务器，结果的主机名将会不同）：\n\n0.fedora.pool.ntp.org\n\
  \n1.fedora.pool.ntp.org\n\n2.fedora.pool.ntp.org\n\n3.fedora.pool.ntp.org\n\n`ntpq`\
  \ 命令允许你对 NTP 服务器执行查询。例如，示例 23-6 中所示的 `ntpq` 命令显示了 NTP 服务器状态的摘要。\n\n**示例 23-6** `ntpq`\
  \ 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# ntpq -p\n     remote      \
  \     refid      st t when poll reach   delay   offset  jitter\n============================================================\n\
  *propjet.latt.ne 68.110.9.223     2 u  120 1024  377   98.580    7.067   4.413\n\
  -services.quadra 208.75.88.4      3 u  272 1024  377   72.504  -10.689   1.612\n\
  +mirror          216.93.242.12    3 u  287 1024  377   20.406   -2.555   0.822\n\
  +108.61.194.85.v 200.23.51.102    2 u  741 1024  377   69.403   -3.670   1.610\n\
  ```\n\n表 23-4 列出了 `ntpq` 命令的一些重要选项。\n\n**表 23-4** `ntpq` 命令的选项\n\n| `选项` | `描述`\
  \ |\n| --- | --- |\n| `-d` | 启用调试模式 |\n| `-n` | 列出主机 IP 地址而不是名称 |\n| `-p` | 打印所有对的列表\
  \ |\n\n**注意：使用 Kali Linux**\n\nKali Linux 提供了一些极好的工具，可以让你探测系统的网络安全。然而，鉴于我们尚未完全涵盖书中介绍的所有网络安全主题，对这些工具的进一步讨论将推到后面的章节。\n\
  \n### 总结\n\n在本章中，你学习了制定网络安全策略的几个关键要素，包括内核参数和如何实现 TCP Wrappers。你还学习了如何手动以及通过 NTP\
  \ 配置系统时钟。\n\n## 关键术语\n\nNTP\n\n路由器 (router)\n\nlibwrap\n\nDoS 攻击\n\nDDoS 攻击\n\n\
  SYN 洪水攻击 (SYN flood)\n\nIP 源 (IP source)\n\n中间人攻击 (man-in-the-middle attack)\n\n\
  ## 复习题\n\n1 主要配置文件是 `_____`。\n\n[2] Kali Linux 提供了一些极好的工具，可以让你探测系统的网络安全。然而，鉴于我们尚未完全涵盖书中介绍的所有网络安全主题，对这些工具的进一步讨论将推到后面的章节。下列哪些是使用的？（多选）\n\
  1. `/etc/hosts`\n2. `/etc/allow`\n3. `/etc/deny`\n4. `/etc/passwd`\n\n[3] `_____`\
  \ 允许你对 NTP 服务器执行查询。\n\n[4] `_____` 用于实现 TCP Wrappers。\n\n[5] 下列哪些是？（多选）\n1. `/etc/inetd`\n\
  2. `/etc/ntp.conf`\n3. `/etc/hosts`\n4. `/etc/shadow`\n\n[6] `_____` 用于创建日志条目。\n\
  \n[7] `_____` 用于系统健康状况。\n\n[8] `_____` 可用于系统性能。\n\n\n\n\n\n-   `TTY`]: 这是启动该进程的终端窗口。终端窗口本质上是用户能够从命令行命令的地方。最初，这是一个物理终端（一种向操作系统提供键盘输入的机器）。事实上，`TTY`\
  \ 代表 *Teletype*（电传打字机），是一种用于连接到某些原始 Unix 系统的终端。以“pts”开头的终端是基于 GUI 的虚拟终端，即运行 shell\
  \ 程序的窗口，或者是远程连接（例如 `SSH` 连接）。你还可能会看到“tty”，它表示非基于 GUI 的虚拟终端。“??”表示该进程不是从终端启动的，而是从另一个进程启动的（可能是在系统启动期间）。\n\
  \n-   **`TIME`**: CPU 时间；该进程在 CPU 上执行代码所花费的时间。虽然这个数字会随着时间推移，但通常是一个非常小的数字（几秒钟或几分钟，但很少更多），除非进程出现问题。\n\
  \n-   **`CMD`**: 命令名。\n\n要列出系统上运行的所有进程，请添加 `-e` 选项，所示。这很有用，因为你想查看的进程可能是从不同的 shell（或由不同的用户）启动的，但此命令的结果可能是几十行、甚至数百行的输出。\n\
  \n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$ps -e | wc -l\n194\n```\n\n记得 `wc\
  \ -l` 将显示数据的行数；在在上例中，那是 `ps` 命令产生的行数。每个进程单独显示在一行，因此该系统有 193 个进程正在运行（其中一行是表头信息——\
  \ PID、`TTY`、`TIME` 等）。因此，你可能想使用 `grep` 命令按命令名过滤输出内容：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource\
  \ ~]$ps -e | grep xeyes\n 4896 pts/2    00:00:00 xeyes\n```\n\n`ps` 命令的另一个有用选项是\
  \ `-f` 选项，它显示关于进程的“完整信息”：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$ps -f\n\
  UID        PID  PPID  C STIME TTY          TIME CMD\nstudent    3872  3693  0 16:41\
  \ pts/5    00:00:00 bash\nstudent    4934  3872  0 21:05 pts/5    00:00:00 ps -f\n\
  ```\n\n当使用 `-f` 选项时，包含以下新数据列：\n\n-   **`UID`**: 用户 ID；启动该进程的用户名。该用户“拥有”该进程，这很重要，因为要控制进程，你要么是\
  \ root 用户，要么拥有该进程。\n\n-   **`PPID`**: 父进程 ID；这是启动此行所描述进程的的 `PID`。例如，在之前的输出中，`ps\
  \ -f` 命令是由 `bash` 命令启动的，因此 `ps -fe` 命令的 `PPID` 匹配 `bash` 命令的 `PID`。当当前有多个命令或程序的执行实例在运行时，这有助于找到特定的进程。\n\
  \n-   **`C`**: 状态；值为 1 表示当前正在 CPU 上执行代码（或在 CPU 队列中有代码），值为 0 表示它目前处于“睡眠”状态（等待某事发生以便执行操作）。\n\
  \n-   **`STIME`**: 时间；命令启动的时间。如果一个命令运行超过 24 小时，它将显示为日期而不是时间。\n\n`ps` 命令还有许多其他有用的选项。在这种情况下，你确实想要探索文档并找到对你的日常工作有用的额外选项。\n\
  \n### `pgrep` 命令\n\n你通常会结合使用 `ps` 和 `grep` 来显示特定的进程：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource\
  \ ~]$ps -e | grep xeyes\n 4896 pts/2    00:00:00 xeyes\n```\n\n`pgrep` 命令也可以提供类似的功能：\n\
  \n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$pgrep sleep\n194\n```\n\n`pgrep`\
  \ 的重要选项如表 24-1 所示。\n\n**表 24-1 `pgrep` 选项**\n\n| 选项 |  |\n| :--- | :--- |\n| `-G`\
  \ | 按组匹配进程。 |\n| `-l` | 显示进程名。 |\n| `-n` | 显示最近启动的。 |\n| `-u` | 按用户匹配进程。 |\n\n###\
  \ `top` 命令\n\n`top` 命令显示系统统计数据和进程信息。它定期更新（默认每 2 秒更新一次）。\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource\
  \ ~]$ps -f\nUID        PID  PPID  C STIME TTY          TIME CMD\nstudent    3872\
  \  3693  0 16:41 pts/5    00:00:00 bash\nstudent    4934  3872  0 21:05 pts/5  \
  \  00:00:00 ps -f\n```\n\n在 `top` 运行时，你可以输入交互命令来执行诸如更改值、重新排序列表和杀死（停止）进程等操作。这些交互命令是单个字符。交互命令见表\
  \ 24-3。\n\n**表 24-3 `top` 执行期间的命令**\n\n| 命令 | 说明 |\n| :--- | :--- |\n| `h` | 帮助；显示交互命令摘要。\
  \ |\n| `E` | 将默认值从字节更改另一个值；可用值会“循环”，直到显示回到字节。 |\n| `Z` | 开启颜色高亮；使用小写 `z` 切换颜色和非颜色。\
  \ |\n| `B` | 开启或关闭粗体。 |\n| `<>` | 将排序列向左 (`<`)或向右 (`>`)。 |\n| `s` | 设置更新值为默认 2 秒以外的值。\
  \ |\n| `k` | 通过提供 `PID` 杀死进程。 |\n| `q` | 退出 `top` 命令。 |\n\n`top` 命令还支持多个命令行选项。重要选项如表\
  \ 24-4 所示。\n\n**表 24-4 `top` 的重要选项**\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-d` | 设置数据刷新之间的时间。例如，`top\
  \ -d 5` 意味着每 5 秒刷新一次，而不是默认的每 2 秒一次。 |\n| `-n` *number* | `top` 命令退出前的最大数据刷新次数。 |\n\
  | `-u` *username* | 仅显示 *username* 拥有的进程。 |\n\n#### `uptime` 命令\n\n\n\n\n\n虽然 `uptime`\
  \ 命令不显示单个进程的数据，但它确实提供了有关整体进程状态的统计信息。`uptime` 命令显示了系统运行的时间以及其平均负载，如下所示：\n\n点击此处查看代码图片\n\
  \n```\n[student@onecoursesource ~]$ uptime\n 15:06:13 up 2 days,  9:09,  3 users,\
  \  load average: 0.01, 0.02, 0.05\n```\n\n负载平均值表示了过去 1、5 和 15 分钟的 CPU 使用率（例如 0.01、0.02\
  \ 和 0.05）。负载平均值与 CPU 的数量有关，如接下来所述：\n\n*   在单 CPU 系统上，负载平均值为 1.0 意味着利用率为 100%。\n\
  *   在单 CPU 系统上，负载平均值为 2.0 意味着利用率为 200%（这意味着进程经常在等待 CPU，因为 CPU 处于忙状态）。\n*   在具有两个\
  \ CPU 的系统上，负载平均值为 1.0 意味着利用率为 50%。\n*   在具有两个 CPU 的系统上，负载平均值为 2.0 意味着利用率为 100%。\n\
  \n`uptime` 命令的信息对于判断 CPU 是否过载非常有用。CPU 利用率持续超过 100% 表示存在问题，并可能导致服务器响应时间延迟。\n\n###\
  \ 安全亮点\n\n高负载平均值可能预示着黑客尝试。更糟糕的是，这可能是攻击成功的的结果，黑客在系统上放置了情报收集脚本。\n\n### free 命令\n\n\
  `free` 命令显示内存统计信息。虽然该命令没有显示每个进程使用多少内存，但它确实提供了关于可用内存和当前使用内存的良好概览。这是一个示例：\n\n点击此处查看代码图片\n\
  \n```\n[student@onecoursesource ~]$ free\n             total       used       free\
  \     shared    buffers     cached\nMem:       4048292    3891592     156700   \
  \     460     370640    1617812\n-/+ buffers/cache:    1903140    2145152\nSwap:\
  \       400000          0          0\n```\n\n值默认以字节（bytes）显示。需要关注的重要区域是总内存量以及可用内存量。`shared`、`buffers`\
  \ 和 `cache` 列对开发者来说更为重要。\n\n`Swap` 指“交换空间”，该主题在第 10 章“管理本地存储：基础”以及第 11 章“管理本地存储：高级特性所示。\n\
  \n#### 表 24-5 free 命令的选项\n\n| 选项 | 描述 |\n| --- | --- |\n| `-k` | 以千字节（KB）显示内存使用情况。\
  \ |\n| `-m` | 以兆字节（MB）显示内存使用情况。 |\n| `-g` | 以吉字节（GB）显示内存使用情况。 |\n| `-s n` | 每隔 `n`\
  \ 秒更新一次显示。 |\n| `-t` | 显示一行显示每列的总和。 |\n\n### 运行进程\n\n通常，进程是作为前台作业启动的。当进程在前台运行时，启动该进程的\
  \ BASH shell 将不可用。在后台运行的进程会留出 BASH shell 供用户执行额外的命令。\n\n`job` 和 `process`（进程）术语本质上是可以互换的。系统上运行的任何程序都是进程。作业是从命令行执行的进程。每个\
  \ BASH shell 都会跟踪从该 shell 启动的作业。\n\n#### 谈话式学习™——进程与作业\n\n**Gary**: 你好，Julia。你能给我解释一下某个东西吗？我不太理解进程和作业之间的区别。\n\
  \n**Julia**: 你好，Gary。没问题。让我们从描述进程开始。进程是运行在系统上的任何命令、程序或应用程序。这包括启动过程中启动的、由其他用户启动的或由其他进程启动的程序。\n\
  \n**Gary**: 好的，我理解这个。\n\n**Julia**: 作业也是进程。将作业看作系统上运行的所有进程的子集。并不是所有进程都是作业。例如，启动时的任何进程都不被视为作业。\n\
  \n**Gary**: 那么，哪些进程被认为是作业呢？\n\n**Julia**: 任何由用户在 shell 中启动的进程。换句话说，你在 shell 中通过输入命令或程序名称启动的任何命令或程序。\n\
  \n**Gary**: 为什么这些进程被称为作业？\n\n**Julia**: 因为在作业上可以使用某些命令和功能，而这些在其他进程上无法。例如，`jobs`\
  \ 命令显示在当前 shell 中启动的所有进程。\n\n**Gary**: 好的，但我也可以通过 `ps` 命令看到这些“作业进程”，对吧？\n\n**Julia**:\
  \ 是的，但点在于，你通常只想关注由当前 shell 启动的进程，因此在这种情况下 `jobs` 命令通常更有意义。此外，作业具有每个 shell 独有的作业编号。你可以通过\
  \ `jobs` 命令查看这些作业编号，并可以在类似 `kill` 的命令中使用它们。\n\n**Gary**: 好的，现在这些听起来更有道理了。谢谢！\n\n\
  在后台运行进程 允许你继续在 BASH shell 中工作并执行额外的命令。要在后台执行进程，请在命令末尾添加一个安培符（`&`）：\n\n点击此处查看代码图片\n\
  \n```\n[student@onecoursesource ~]$xeyes &\n```\n\n每个 BASH shell 都会跟踪从该 shell 运行的进程。这些进程被称为\
  \ `jobs`。要列出当前运行的作业，在 BASH shell 中执行 `jobs` 命令：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource\
  \ ~]$jobs\n[1]-  Running                 xeyes&\n[2]+  Running                 777\
  \ &\n```\n\n每个作业分配有一个作业编号。通过以下语法引用该作业：`%*job_number*`。\n\n#### 暂停与恢复进程\n\n要暂停在前台运行的程序，按住\
  \ `Ctrl` 键并按 `z`。可以通过运行 `jobs` 命令查看该作业是否已停止（暂停）。\n\n暂停的作业可以通过 `bg` 命令在后台恢复，如下所示：\n\
  \n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$jobs\n[1]+  Stopped           \
  \      sleep 999\n[student@onecoursesource ~]$bg %1\n[1]+ sleep 999 &\n[student@onecoursesource\
  \ ~]$jobs\n[1]+  Running                 sleep 999 &\n```\n\n暂停的作业可以通过 `fg` 命令在前台恢复，如下所示：\n\
  \n点击此处查看代码图片\n\n```\n[student@onecoursesource ~]$jobs\n[1]+  Stopped           \
  \      sleep 999\n[student@onecoursesource ~]$fg %1\nsleep 999\n```\n\n### 杀死进程\n\
  \n虽然听起来很残忍，但“杀死进程”这个短语被用来描述完全停止一个进程，而不只是暂停。有多种方法可以杀死进程，包括：\n\n*   `kill` 命令\n* \
  \  `pkill` 命令\n*   `killall` 命令\n*   `xkill` 命令\n*   点击 GUI 程序的关闭框\n\n#### kill\
  \ 命令\n\n`kill` 命令可更改进程的状态，包括停止（杀死）进程。要停止进程，首先确定其进程 ID 或作业编号，然后将该编号作为 `kill` 命令的参数。进程\
  \ ID 和作业编号方法在示例 24-1 中均有演示。\n\n\n\n\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource\
  \ ~]$jobs\n[1]-  Running                 sleep 999 &\n[2]+  Running            \
  \     sleep 777 &\n[student@onecoursesource ~]$kill %2\n[student@onecoursesource\
  \ ~]$jobs\n[1]-  Running                 sleep 999 &\n[2]+  Terminated         \
  \     sleep 777\n[student@onecoursesource ~]$ps -fe | grep sleep\nstudent  17846\
  \ 12540  0 14:30 pts/2    00:00:00 sleep 999\nstudent  17853 12540  0 14:31 pts/2\
  \    00:00:00 grep --color=auto sleep\n[student@onecoursesource ~]$kill 17846\n\
  [student@onecoursesource ~]$ps -fe | grep sleep\nstudent  17856 12540  0 14:31 pts/2\
  \    00:00:00 grep --color=auto sleep\n[1]+  Terminated              sleep 999\n\
  ```\n\n`kill` 命令向进程发送一个信号，告知进程应该采取什么操作。该信号可以指定为数值参数或关键字参数。示例 24-2 演示了你如何列出 `kill`\
  \ 命令可以发送给进程的所有可能信号。\n\n**示例 24-2** *列出 Kill 信号*\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource\
  \ ~]$ kill -l | head -5\n 1) SIGHUP 2) SIGINT3) SIGQUIT4) SIGILL 5) SIGTRAP\n 6)\
  \ SIGABRT7) SIGBUS8) SIGFPE 9) SIGKILL10) SIGUSR1\n11) SIGSEGV12) SIGUSR213) SIGPIPE14)\
  \ SIGALRM15) SIGTERM\n16) SIGSTKFLT17) SIGCHLD18) SIGCONT19) SIGSTOP20) SIGTSTP\n\
  21) SIGTTIN22) SIGTTOU23) SIGURG24) SIGXCPU25) SIGXFSZ\n```\n\n示例 24-2 中的输出使用 `head`\
  \ 命令进行了截断，因为较后的 kill 信号更加晦涩，且没有输出中显示的早期信号那样重要。一些更重要的 kill 信号在表 24-6 中进行了描述。\n\n\
  **表 24-6** 重要的 Kill 信号\n\n| `信号` | `描述` |\n| --- | --- |\n| `-1` 或 `SIGHUP` | 发送一个\
  \ HUP 信号。更多信息请参见本章后面的“`nohup` 命令”节。示例：`kill -1 PID*`。 |\n| `-2` 或 `SIGINT` | 键盘中断；等同于按下\
  \ Ctrl+C 停止正在前台运行的进程。注意某些进程会忽略信号 2，因此这可能无法停止这些进程。示例：`kill -2 PID*`。 |\n| `-9` 或\
  \ `SIGKILL` | 强制杀死；不为进程提供任何选择，强制进程移出内存。一个潜在的负面影响是进程没有机会执行保存数据或删除临时文件等操作。示例：`kill\
  \ -9*PID*`。 |\n| `-15` 或 `SIGTERM` | 标准杀死；此信号是默认发送的。注意某些进程会忽略信号 15，因此它无法停止那些进程。示例：`kill\
  \ -15 PID*`。 |\n\n**安全强调**\n\n由于潜在的负面影响，在停止进程时避免使用信号 9，至少最初如此。通过发送普通的 `kill` 命令允许进程优雅关闭，等待约\
  \ 30 秒，然后尝试使用 `kill -9` 命令。\n\n如果你尝试停止的程序开发者决定忽略普通的 kill 信号，或者黑客已经控制了系统或在系统上执行了潜在有害的进程，那么\
  \ `-9` 选项可能是必要的。\n\n#### pkill 命令\n\n使用 `kill` 命令向进程发送信号时，你通过提供 PID（进程 ID）来指定哪个进程。使用\
  \ `pkill` 命令，你可以提供进程名、用户名或其他方法来指定向哪个进程（或进程）发送信号。例如，以下命令将向用户 sarah 拥的所有进程发送 kill\
  \ 信号：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$pkill -u sarah\n```\n\n\
  重要的选项包括表 24-7 所示。\n\n**表 24-7** `pkill` 命令的选项\n\n| `选项` | `描述` |\n| --- | --- |\n\
  | `-G` `name` | 按组 `name` 匹配进程。 |\n| `-u` `name` | 按用户 `name` 匹配进程。 |\n\n#### killall\
  \ 命令\n\n`killall` 命令用于停止特定名称的所有进程。这是一个示例：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource\
  \ ~]$killall firefox\n```\n\n重要的选项包括表 24-8 所示。\n\n**表 24-8** `killall` 命令的选项\n\n\
  | `选项` | `描述` |\n| --- | --- |\n| `-I` | 忽略大小写匹配。 |\n| `-i` | 交互式；在向进程发送信号之前进行提示。\
  \ |\n| `-r` `pattern` | 按正则表达式 `pattern` 匹配进程。 |\n| `-s` `signal` | 向进程发送 `signal`\
  \ 而不是默认信号。 |\n| `-v` | 详细模式；报告是否成功向进程发送信号。 |\n\n#### xkill 命令\n\n你可以通过运行 `xkill`\
  \ 命令然后直接点击你想停止的进程来杀死该进程。参考图 24-3 运行 `xkill` 命令后直接点击你想停止的进程。\n\n![图像](img/24fig3)\n\
  \n**图 24-3** *启动 xkill*\n\n运行 `xkill` 命令后然后直接点击你想停止的进程。参考图 24-3 运行 `xkill` 命令后直接点击你想停止的进程。在图\
  \ 24-4 中查看运行 `xkill` 命令后显示的窗口。\n\n![图像](img/24fig4)\n\n**图 24-4** *停止 eyes 程序*\n\
  \n#### nohup 命令\n\n每个进程都有一个启动它的父进程。例如，如果你在 BASH shell 中执行命令，那么父进程就是 BASH shell。当父进程停止时，子进程会收到\
  \ HUP 信号。为了避免这种情况，使用 `nohup` 命令执行命令：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource\
  \ ~]$nohup some_command\n```\n\n这种技术通常用于远程登录系统并希望在断开连接后继续运行。\n\n#### 进程优先级\n\n“Nice”值用于告知\
  \ CPU 哪个进程具有更高的优先级。值的范围从 `-20`（最高优先级）到 `19`（最低优先级）。任何用户创建的任务的默认优先级为 `0`。你可以通过运行\
  \ `nice` 命令为新进程设置优先级值。更改现有进程的优先级，使用 `renice` 命令。\n\n#### nice 命令\n\n要指定不同于默认的“nice”值，通过\
  \ `nice` 执行作业：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$nice -n 5 firefox\n\
  ```\n\n注意普通用户不能分配负 nice 值。这些值只有 root 用户可以使用。\n\n查看进程的 nice 值，使用 `ps` 命令的 `-o` 并包含“nice”的值：\n\
  \n点击此处查看代码图像\n\n```\n[student@onecoursesource ~] ps -o nice,pid,cmd\n NI   PID CMD\n\
  \  0 23865 -bash\n  5 27967 firefox\n  0 27969 ps -o nice,pid,cmd\n```\n\n#### renice\
  \ 命令\n\n使用 `renice` 命令更改现有作业的 nice 值，如示例 24-3 所示。\n\n\n\n\n\n```\n[student@onecoursesource\
  \ ~] ps -o nice,pid,cmd\n NI   PID CMD\n  0 23865 -bash\n 5 28235 sleep 999\n  0\
  \ 28261 ps -o nice,pid,cmd\n[student@onecoursesource ~] renice -n 10 -p 28235\n\
  28235 (process ID) old priority 5, new priority 10\n[student@onecoursesource ~]\
  \ ps -o nice,pid,cmd\n NI   PID CMD\n  0 23865 -bash\n 10 28235 sleep 999\n  0 28261\
  \ ps -o nice,pid,cmd\n```\n\n## Note\n\n普通（非 root）用户只能将现有进程的优先级更改为较低优先级。只有 root\
  \ 用户可以将进程优先级更改为高优先级。\n\n`renice` 命令的重要选项包括表 24-9 所示所示。\n\n## 表 24-9 `renice` 命令的选项\n\
  \n| 选项 | 描述 |\n| --- | --- |\n| `-g` *group* | 更改所有属于该*组*的文件优先级。 |\n| `-u` *user*\
  \ | 更改所有属于该*用户*的文件优先级。 |\n\n## Summary\n\n在本章中，你探索了如何控制进程，包括如何启动、暂停、恢复和停止进程。你还学习了几种显示进程信息以及更改进程\
  \ CPU 优先级的技巧。\n\n## 关键术语\n\n进程\nPID\nTTY\n终端\nkill\n作业\n后台进程\n前台进程\nHUP\n\n## 复习题\n\
  \n**1.** `_____` 命令用于显示系统上运行的所有进程。\n\n**2.** 哪个命令可以定期显示进程信息（默认每 2 秒显示一次）？\n1. `free`\n\
  2. `uptime`\n3. `top`\n4. `jobs`\n\n**3.** 进程的最高 CPU 优先级由 _____ 的 nice 值指定。\n\n\
  **4.** 哪个命令可以停止进程执行？（选择所有适用项。）\n1. `stop`\n2. `skill`\n3. `pkill`\n4. `xkill`\n\n\
  **5.** `_____` 命令可以用于在当父进程停止运行时防止进程终止。\n\n## 第 25 章：系统日志\n\n系统日志由于几个原因而至关重要：这些日志为管理员提供了有用的信息以帮助故障排除。它们对于识别潜在的黑客尝试也有帮助。此外，日志可用于提供有关服务的通用信息，例如\
  \ Web 服务器提供了哪些网页。\n\n一个使问题复杂的领域是 Linux 可用的不同日志方法。某些发行版使用名为 `syslog` 的旧技术（或较新版本的\
  \ `syslog`称为 `rsyslog` 或 `syslog-ng`），而另一些发行版使用名为 `journald` 的较新技术。这两种技术在本章中都会介绍。\n\
  \n阅读本章并完成练习后，你将能够做到：\n* 查看系统日志\n* 配置 `syslog` 创建自定义日志项\n* 轮转旧日志文件\n* 查看 `journald`\
  \ 日志\n* 定制 `journald`\n\n## Syslog\n\nsyslog 服务自 1980 年以来一直存在。尽管在创建时非常先进，但随着对更复杂日志技术的需求，它的局限性随着时间的推移而增加。20\
  \ 世纪 90 年代后期，创建了 `syslog-ng`。21 世纪 00 代中期，创建了 `rsyslog` 以扩展 `syslog` 的功能。这两种技术在本章中都会介绍。\n\
  \n（注：原文中存在大量段落重复，此处根据指令“不要重复输出原文”的原则，仅保留核心内容翻译）\n\n\n\n\n\n非 `syslogd` 日志文件与由 `syslogd`\
  \ 管理的日志同样重要。当你制定处理日志文件的安全策略时，请务考虑这些额外的日志文件。\n\n### `/etc/syslog.conf` 文件\n\n`/etc/syslog.conf`\
  \ 文件是 `syslogd` 守护进程的配置文件，它告诉守护进程将收到的日志记录发送到何处。以下展示了一个典型的 `syslog.conf` 文件，其中已删除了注释和空行：\n\
  \n点击此处查看代码图像\n\n```\n[root@localhost ~]# grep -v \"^$\" /etc/syslog.conf | grep\
  \ -v \"^#\"\n*.info;mail.none;authpriv.none;cron.none       /var/log/messages\n\
  authpriv.*                                      /var/log/secure\nmail.*        \
  \       -/var/log/maillog\ncron.*                                          /var/log/cron\n\
  *.emerg                                        *\nuucp,news.crit               \
  \                   /var/log/spooler\nlocal7.*                /var/log/boot.log\n\
  ```\n\n每一行代表一条日志规则，分为两个主要部分：选择器（例如，`uucp,news.crit`）和动作（例如 `/var/log/spooler`）。选择器也分为两部分：设施（facility）（例如\
  \ `uucp,news`）和优先级（priority）（例如 `crit`）。\n\n以下列表列出了可用的设施及其简要描述：\n\n*   `auth (or\
  \ security)`：与系统认证相关的日志消息（例如用户登录时）。\n*   `authpriv`：与非系统认证相关的日志消息（例如 Samba 等服务验证用户身份时）。\n\
  *   `cron`：从 `crond` 守护进程发送的日志消息。\n*   `daemon`：从各种守护进程发送的日志消息。\n*   `kern`：从内核发送的日志消息。\n\
  *   `lpr`：从旧版打印机服务器发送的日志消息。\n*   `mail`：从邮件服务器（通常是 sendmail）发送的日志消息。\n*   `mark`：旨在在日志文件中放置时间戳的日志消息。\n\
  *   `news`：新闻服务器的日志消息（一种过时的 Unix 服务器）。\n*   `syslog`：由 `syslogd` 生成的日志消息。\n*   `user`：用户级日志消息。\n\
  *   `uucp`：由 uucp 生成的日志消息（一种过时的 Unix 服务器）。\n*   `local0 到 local7`：由非标准服务或 shell\
  \ 脚本生成的自定义日志消息。更多细节请参见本章稍后对 `logger` 命令的讨论。\n*   `*`：代表所有设施。\n\n以下列表按严重程度从低到高列出了可用的优先级级别：\n\
  \n*   `debug`：与调试服务问题相关的消息。\n*   `info`：关于服务的一通用信息。\n*   `notice`：比 info 消息稍严重，但尚未达到需要警告的程度。\n\
  *   `warning (or warn)`：表示某些轻微错误。\n*   `err (or error)`：表示更严重的错误。\n*   `crit`：非常严重的错误。\n\
  *   `alert`：表示必须解决某种情况，因为系统或服务即将崩溃。\n*   `emerg (or panic)`：系统或服务正在崩溃或已完全崩溃。\n*\
  \   `*`：代表所有级别。\n\n实际上，由软件开发者决定使用什么优先级级别发送消息。例如，开发 `crond` 守护进程的人可能认为 `crontab`\
  \ 文件中的错误是警告级优先级，或者他们可能选择将其错误级优先级。通常情况下，`debug`、`info` 和 `notice` 优先级是供参考（FYI）类型的消息，而\
  \ `warning` 和 `error` 意味着“你应该检查一下”，而 `crit`、`alert` 和 `emerg` 意味着“不要忽略这个；这里有严重问题”。\n\
  \n一旦确定了严重性，`syslogd` 守护进程需要确定针对日志记录采取的操作。以下列表显示了可用动作：\n\n*   `Regular file`（普通文件）：放在\
  \ `/var/log` 目录的文件。\n*   `Named pipes`（命名管道）：用于进程通信的管道。\n*   `Console or devices`（控制台或设备）：显示在终端上。\n\
  *   `Remote hosts`（远程主机）：将日志发送到另一台服务器。\n*   `User(s)`（用户）：针对特定用户的日志记录。\n\n### 安全\n\
  \n非 `syslogd` 日志文件与由 `syslogd` 管理的日志同样重要。当你制定处理日志文件的安全策略时，请考虑这些额外的日志文件。\n\n####\
  \ 对话式学习——远程服务器\n\n**Gary**：Julia……有个问题想问你。\n**Julia**：什么问题？\n**Gary**：我被要求向远程服务器发送一条消息。这为什么很重要？\n\
  **Julia**：啊，这在系统中很常见，特别是当它们连接到互联网时。想象一下你是一个黑客，已经未经授权访问了服务器。一旦你获得了访问权限，你可能想隐藏掉你的足迹。猜猜你会做什么？\n\
  **Gary**：噢，我明白了！我会删除日志文件！这样就没人知道我是怎么进去的。\n**Julia**：没错，但如果那些日志文件也被复制到了另一台服务器呢？\n\
  **Gary**：啊，那么隐藏我的足迹就会困难得多了。我必须黑进另一个系统，可能是一个具有不同账户和服务的系统，这会变得非常困难。\n**Julia**：现在你知道为什么你想把日志副本发送到另一台服务器了。\n\
  **Gary**：谢谢你，Julia！\n**Julia**：很乐意提供帮助，Gary。\n\n### `/etc/rsyslog.conf` 文件\n\n大多数现代系统使用\
  \ `rsyslog` 守护进程而不是 `syslogd` 守护进程。较新的 `rsyslog` 守护进程具有更多功能，但旧 `syslogd` 守护进程的大多数功能仍然可用。\n\
  \n例如，尽管 `/etc/rsyslog.conf` 文件中存在一些 `/etc/syslog.conf` 中不存在的功能，但本章之前描述的内容对于新的配置文件仍然有效。\n\
  \n你应该注意注意 `/etc/rsyslog.conf` 文件中的一些新功能。其中一个功能是使用模块的能力。模块提供了更多功能；例如，以下模块将允许 `rsyslogd`\
  \ 守护进程通过 TCP 协议从远程系统接受日志消息：\n\n点击此处查看代码图像\n\n```\n# 提供 TCP syslog 接收\n#$ModLoad\
  \ imtcp\n#$InputTCPServerRun 514\n```\n\n此外，`/etc/rsyslog.conf` 文件中的一个新章节 `GLOBAL\
  \ DIRECTIVES`（全局指令）允许你为所有日志记录提供设置。例如，以下内容将为 `rsyslogd` 守护进程创建的任何新日志设置用户所有者、组所有者和权限。\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```\n# 为所有日志文件设置默认权限。\n#\n$FileOwner syslog\n$FileGroup\
  \ adm\n$FileCreateMode 0640\n```\n\n最后一个重大变化是，大多数日志规则不再存储在 `/etc/rsyslog.conf`文件中，而是存储在\
  \ `/etc/rsyslog.d` 目录下的文件中。这些文件可以按如下方式包含在主文件中：\n\n点击此处查看代码图像\n\n```\n# 包含 /etc/rsyslog.d/\
  \ 下的所有配置文件\n#\n$IncludeConfig /etc/rsyslog.d/*.conf\n```\n\n通过使用“包含”目录，你可以通过向该目录添加或删除文件，来快速添加或移除大量日志规则。\n\
  \n#### 创建您自己的 /etc/syslog.conf 条目\n\n能够读取现有的 `/etc/syslog.conf` 条目是重要的，但能够创建自己的条目同样很有用。创建条目包括首先修改\
  \ `/etc/syslog.conf` 文件，然后重启 `syslogd` 服务。在 `syslogd` 服务重启后，你应该使用 `logger` 命令测试你的新条目。\n\
  \n### 添加条目\n\n首先，确定你想捕获什么种类型的条目。例如，通常所有的 `crond` 守护进程日志消息都会发送到 `/var/log/cron` 文件，因为\
  \ `/etc/syslog.conf` 文件中有如下条目：\n\n点击此处查看代码图像\n\n```\ncron.*                    \
  \                      /var/log/cron\n```\n\n如果你还想将 `crit` 优先级及以上的 `cron` 消息发送到\
  \ root 用户的终端窗口怎么办？你可以向 `/etc/syslog.conf` 文件添加以下条目：\n\n点击此处查看代码图像\n\n```\ncron.crit\
  \                                       root\n```\n\n当你指定一个优先级时，所有该优先级级别及以上（更严重）的消息都会发送到目的地。若要仅捕获特定优先级级别的消息，请使用以下语法：\n\
  \n点击此处查看代码图像\n\n```\ncron.=crit                                      root\n```\n\
  \n另一种发送消息的方法是从你创建的脚本发送。你可以在脚本中执行 `logger` 命令（见下一节）来创建日志条目，但你不想使用标准设施（如 `cron` 和\
  \ `mail`），因为这些已经与特定的服务关联。相反，请使用自定义设施之一（`local0`、`local1` 等）。这些值中最大的是 `local7`。这里是一个示例：\n\
  \n```\nlocal7.* /var/log/custom\n```\n\n在做出这些更改并保存 `/etc/syslog.conf` 文件后，重启 `syslogd`\
  \ 服务（有关重启服务的详情请参阅 第 28 章，“系统启动”）。然后使用 `logger` 命令测试你的新条目。\n\n**可能会出现什么问题？**\n\n\
  `/etc/syslog.conf` 文件中的错误可能会对现有的日志规则产生影响。确保你始终使用 `logger` 命令测试新规则。\n\n### 使用 logger\
  \ 命令\n\n`logger` 实用程序可以将日志条目发送到 `syslogd` 守护进程：\n\n点击此处查看代码图像\n\n```\n[root@localhost\
  \ ~]# logger -p local7.warn \"warning\"\n```\n\n`logger` 命令的重要选项见表 25-2。\n\n**表\
  \ 25-2** 重要的 `logger` 命令选项\n\n| **选项** | **描述** |\n\n| --- | --- |\n| `-i` | 记录\
  \ logger 进程的 PID。 |\n| `-s` | 将消息输出到 STDERR 的同时将其发送到 syslogd 守护进程。 |\n| `-f` `file`\
  \ | 使用 `file` 的内容作为发送到 syslogd 守护进程的消息。 |\n| `-p` | 指定设施（facility）和优先级。 |\n| `-t`\
  \ | 为日志条目标记标签以便搜索。 |\n\n### The logrotate 命令\n\n`logrotate` 命令是一个工具，用于确保存放日志文件的分区有足够的空间处理日志文件。随着条目的增加，日志文件的大小会随时间增长。`logrotate`\
  \ 命令定期创建旧日志文件的备份并最终删除旧备份，从而限制日志占文件系统空间。\n\n该命令通过 `/etc/logrotate.conf` 文件和 `/etc/logrotate.d`\
  \ 目录下的文件配置。通常，`logrotate` 命令被配置为作为 `cron` 作自动运行：\n\n点击此处查看代码图像\n\n```\n[root@localhost\
  \ ~]# cat /etc/cron.daily/logrotate\n#!/bin/sh\n\n/usr/sbin/logrotate /etc/logrotate.conf\n\
  EXITVALUE=$?\n```\n\n### /etc/logrotate.conf 文件\n\n`/etc/logrotate.conf` 文件是 `logrotate`\
  \ 的主配置文件。`/etc/logrotate.conf` 文件的顶部用于启用适用于所有由 `logrotate` 实用程序旋转文件的全局设置。这些全局设置可以通过类似下面的部分对单个文件进行覆盖：\n\
  \n点击此处查看代码图像\n\n```\ndaily\nrotate 4\ncreate 0640 root root\ncompress\nnotifempty\n\
  ```\n\n`/etc/logrotate.d` 目录中的文件用于覆盖 `logrotate` 实用程序在 `/etc/logrotate.conf` 中的默认设置。这些文件的设置与\
  \ `/etc/logrotate.conf` 文件的设置相同。\n\n通过使用这个“包含”目录，你可以通过在 `/etc/logrotate.d` 目录中添加或删除文件，轻松地插入或移除日志轮规则。\n\
  \n\n\n\n\n在现代 Linux 系统上，日志进程由 `systemd-journald` 服务处理。要查询 `systemd` 日志条目，请使用 `journalctl`\
  \ 命令，如示例 25-2 所示。\n\n**示例 25-2** *使用 `journalctl` 命令*\n\n点击此处查看代码图像\n\n```\n[root@localhost\
  \ ~]#journalctl | head\n-- Logs begin at Tue 2019-01-24 13:43:18 PST, end at Sat\
  \ 2019-03-04 16:00:32 PST. --\nJan 24 13:43:18 localhost.localdomain systemd-journal[88]:\
  \ Runtime journal is using 8.0M (max allowed 194.4M, trying to leave 291.7M free\
  \ of 1.8G available → current\nlimit 194.4M).\nJan 24 13:43:18 localhost.localdomain\
  \ systemd-journal[88]: Runtime journal is using 8.0M (max allowed 194.4M, trying\
  \ to leave 291.7M free of 1.8G available → current\nlimit 194.4M).\nJan 24 13:43:18\
  \ localhost.localdomain kernel: Initializing cgroup subsys cpuset\nJan 24 13:43:18\
  \ localhost.localdomain kernel: Initializing cgroup subsys cpu\nJan 24 13:43:18\
  \ localhost.localdomain kernel: Initializing cgroup subsys cpuacct\nJan 24 13:43:18\
  \ localhost.localdomain kernel: Linux version 3.10.0-327.18.2.el7.x86_64 (builder@kbuilder.dev.centos.org)\
  \ (gcc version 4.8.3 20140911 (Red Hat 4.8.3-9) (GCC) ) #1 SMP Thu May 12 11:03:55\
  \ UTC 2016\nJan 24 13:43:18 localhost.localdomain kernel: Command line: BOOT_IMAGE=/vmlinuz-3.10.0-327.18.2.el7.x86_64\
  \ root=/dev/mapper/centos-root ro rd.lvm.lv=centos/root rd.lvm.lv=centos/swap crashkernel=auto\
  \ rhgb quiet LANG=en_US.UTF-8\nJan 24 13:43:18 localhost.localdomain kernel: e820:\
  \ BIOS-provided physical RAM map:\nJan 24 13:43:18 localhost.localdomain kernel:\
  \ BIOS-e820: [mem 0x0000000000000000-0x000000000009fbff] usable\n```\n\n`journalctl`\
  \ 命令的重要选项包括表 25-4 所示。\n\n**表 25-4** `journalctl` 命令选项\n\n| **选项** | **描述** |\n|\
  \ --- | --- |\n| `--all or -a` | 以完整格式显示所有字段。 |\n| `-r` | 反转日志顺序，使最新的条目最先显示。 |\n\
  | `-k` | 仅显示内核消息。 |\n| `--priority=value` | 仅显示匹配优先级 `value`（`emerg`, `alert`, `crit`,\
  \ `err`, `warning`, `notice`, `info` 或 `debug`）的消息。 |\n\n### `/etc/systemd/journald.conf`\
  \ 文件\n\n`/etc/systemd/journald.conf` 文件用于配置 `systemd-journald` 服务。通常，该文件默认包含所有注释掉的值。`/etc/systemd/journald.conf`\
  \ 文件的重要设置包括表 25-5 所示。\n\n**表 25-5** `/etc/systemd/journald.conf` 文件的设置\n\n| **设置**\
  \ | **描述** |\n| --- | --- |\n| `Storage=value` | 存储日志日期的位置；`value` 可以是 `volatile`,\
  \ `persistent`, `auto` 或 `none`。如果将其设置为 `persistent`，则 `systemd-journald` 服务将日志条目存储在\
  \ `/var/log/journal` 目录下的文件中。 |\n| `Compress=1` | 如果设置为 `1`（真），则日志条目在写入文件之前会进行压缩。\
  \ |\n\n### 总结\n\n在本章中，你探索了如何使用 `syslogd` 服务之一查看和创建日志文件条目。你还学习了如何防止日志文件增长到迅速填满 `/var`\
  \ 分区的大小。\n\n## 关键术语\n\n日志\n\n设施\n\n优先级\n\n## 复习题\n\n**1** `/etc/systemd/journald.conf`\
  \ 文件用于配置。**\n\n**2** 哪个服务被用于。**\n\n**3** `/var/`**\n\n**4** 该。**\n\n**5** `syslogd`**\n\
  \n## 第 26 章\n\n### 基于 Red Hat 的软件管理\n\n大多数发行版都提供了各种工具来管理软件。对于基于 Red Hat 的发行版，有三种常用的工具。`rpm`\
  \ 命令允许你查看关于……的各种信息。本章将涵盖这些软件管理工具以及关于软件包的额外理论。\n\n在阅读本章并完成练习后，你将能够完成以下操作：\n\n使用 `rpm`\
  \ 和 `yum` 命令查看包信息\n\n使用 `rpm` 和 `yum` 命令安装软件包\n\n执行高级包操作，包括创建\n\n### Red Hat 软件包\n\
  \n软件包是一个包含软件程序和其他额外所需组件的文件。例如，考虑一个 Web 服务器软件程序。该程序为网络客户端提供网页，但它需要额外的数据（如配置文件数据）来执行其工作。\n\
  \n在某种意义上，软件包类似于第 2 章“在命令行上工作”中讨论的 tar 文件。它包含了构成完整软件文件的集合。然而，它还包含了额外信息，如元数据（关于软件的信息；谁创建的、何时发布的等）和依赖项。*依赖项](#gloss.xhtml_40)*\
  \ 是指一个软件程序依赖另一个程序的术语。\n\n\n\n\n\n图 26-1 Red Hat 包名称的组件\n\n包名提供了关于软件包本身的基本信息。软件包可能会根据该包提供的主要命令命名，也可能根据整个软件项目命名。\n\
  \n软件包版本可能会有点令人惑，因为关于版本没有统一的规则。通常，版本中的第一个数字（例如 `ntpdate-4.7.6p5-22.fc27.x86_64.rpm`\
  \ 中的“4”）是主发行版本，第二个数字（例如 `ntpdate-4.7.6p5-22.fc27.x86_64.rpm` 中的“7”）是次要发行版本。除此之外，这完全取决于软件供应商。某些供应商在版本中使用多达六个数字，而有些则使用字母（例如“6p5”）。\n\
  \n维护 Linux 发行版的开发者通常会在包名中添加一个“distro”数字。例如，图 26-1 中的“fc27”意味着“Fedora release 27”。这表明在软件重新打包之前，可能专门针对该发行版进行了某些更改。\n\
  \n架构通常是 32 位平台（“x86”）或 64 位平台（“x86_64”），但支持非 Intel 平台的发行版将具有不同的架构值。你可能看到“noarch”，这意味着包中的软件不依赖于任何特定架构。\n\
  \n### 如何获取软件包\n\n如果你正在使用如 `yum` 或 `dnf` 的命令，这些工具可以自动为你下载软件包。然而，如果你正在使用 `rpm` 命令安装软件包，则你需要手动查找并下载包（或使用\
  \ `rpm` 命令的选项来告诉它从哪里获取包）。\n\n软件包有多个来源，包括以下这些：\n\n* **发行版官方网站**：每个发行版都有自己的服务器。\n\
  * [www.rpmfind.net](http://www.rpmfind.net)：一个拥有 RPM 包的网站。\n* [rpm.pbone.net](http://rpm.pbone.net)：一个拥有\
  \ RPM 包的网站。\n* **独立项目网站**：任何创建了用于运行在基于 Red Hat 的发行版上的软件的供应商，可能都有一个可以直接下载软件的网站。\n\
  * [GitHub.com](http://GitHub.com)：许多软件供应商还通过此网站共享代码。\n\n### 安全提示\n\n下载软件时务必非常小心。因为软件必须由\
  \ root 用户安装，这为黑客攻破你的系统提供了一种方便的方法。这些黑客会将有效的软件重新打包，并带有一些旨在破坏你系统的额外工具。\n\n### /var/lib/rpm\
  \ 目录\n\n虽然你很少需要直接对 `/var/lib/rpm` 目录执行任何任务，但你应该意识到这是存储所有软件包元数据的地方。软件包元数据是关于软件包的信息，例如软件包的构建日期和构建包的供应商。每当你安装新软件（或删除软件）时，`/var/lib/rpm`\
  \ 目录中的数据库就会发生变化：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#ls /var/lib/rpm\n\
  Basenames     __db.002  Group       Obsoletename  Requirename  Triggername\nConflictname\
  \  __db.003  Installtid  Packages      Sha1header\n__db.001      Dirnames  Name\
  \        Providename   Sigmd5\n```\n\n虽然你应该意识到该目录的存在以及其目的是存储软件包信息，但你不应该直接修改这些文件中的任何一个。偶尔你可能需要重新构建这些文件中的数据库，但这应该通过执行\
  \ `rpm --rebuilddb` 命令来完成。\n\n### 使用 rpm 命令\n\nRPM 最初是 Red Hat Package Manager（红帽软件包管理器）的缩写。随着越来越多的发行版开始使用\
  \ RPM 系统管理软件包，RPM 被重新定义为 RPM Package Manager（一个递归缩写——技术上说是一个“反缩写”，因为该缩写已经存在，并且提供了一个定义）。许多发行版使用\
  \ RPM，包括 RHEL（红帽企业 Linux）、Fedora、CentOS 和 SUSE。\n\n`yum` 和 `dnf` 命令是最终运行 `rpm` 命令的“前端”应用程序。虽然你可能发现\
  \ `yum` 或 `dnf` 命令更容易使用，但你会遇到某些使用 `rpm` 命令更好的情况。阅读“对话式学习™”框以了解为什么直接执行 `rpm` 命令是有用的。\n\
  \n**对话式学习™——为什么使用 rpm 命令？**\n\n**Gary**: 嗨，Julia。我想知道你能不能为我解释一下关于 `rpm` 命令的一些事情？\n\
  \n**Julia**: 我会尽力的。\n\n**Gary**: 好，看起来 `yum` 和 `dnf` 更用，并且提供了更多功能，比如下载并自动安装依赖包的能力。那么，我为什么还要用\
  \ `rpm` 命令呢？\n\n**Julia**: 有几个原因。例如，假设你有一个没有依赖项的包文件。你可以用 `rpm` 命令轻松地安装它。\n\n**Gary**:\
  \ 好，还有其他情况吗？\n\n**Julia**: 有的，你会发现 `rpm` 命令非常擅长执行查询。虽然许多查询是由 `yum` 和 `dnf` 完成的，但\
  \ `rpm` 命令拥有更多功能。\n\n**Gary**: 啊，说得好。别的吗？\n\n**Julia**: 假设有人给你了一个 `rpm` 文件，而你想在不安装的情况下查看信息。\n\
  \n**Gary**: 好，说得对。\n\n**Julia**: 没错，你可以从包中提取文件而无需安装它。\n\n**Gary**: 好，我应该详细研究一下 `rpm`\
  \ 命令。\n\n### 列出 rpm\n\n要显示所有软件包，请执行 `rpm -qa` 命令。`-q` 代表“query”（查询），`-a` 代表“all”（全部）（注意，使用了\
  \ `head` 来限制输出，因为通常有数百个包，如 示例 26-1 所示）。\n\n**示例 26-1 rpm -qa 命令**\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]#rpm -qa | head\npciutils-libs-3.3.0.fc20\niptables-services-1.4.19-1.fc20\n\
  bouncycastle-pg-1.46-10.fc20\nperl-HTTP-Negotiate-6.0.1.fc20\nphp-pdo-5.5.26-1.fc20\n\
  vim-filesystem-7.4.475-2.fc20\nsisu-inject-0.0.0-4.M20\nperl-DBD-Pg-2.19.3-6.fc20\n\
  php-bcmath-5.5.26-1.fc20\nzlib-1.2.8-3.fc20\n```\n\n要查看基本的包信息，请执行命令：`rpm -qi pkgname`。将\
  \ `pkgname` 替换为要显示的包名。请参见示例 26-2](#ch26.xhtml_exa26_2)。\n\n**示例 26-2 查看包信息**\n\n\
  点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#rpm -qi zlib\nName        : zlib\nVersion\
  \     : 1.2.11\nRelease     : 3.fc28\nArchitecture: x86_64\nInstall Date: Tue 6\
  \ Feb 2019 09:09:01 AM PST\nGroup       : System Environment/Libraries\nSize   \
  \     : 188163\nLicense     : zlib and Boost\nSignature   : RSA/SHA256, Tue 28 Aug\
  \ 2017 02:04:04 AM PDT, Key ID 2eb161fa246110c1\nSource RPM  : zlib-1.2.8-3.fc20.src.rpm\n\
  Build Date  : Sat 26 Aug 2017 06:42:20 AM PDT\nBuild Host  : buildvm-05.phx2.fedoraproject.org\n\
  Relocations : (not relocatable)\nPackager    : Fedora Project\nVendor      : Fedora\
  \ Project\nURL         : http://www.zlib.net/\nSummary     : The compression and\
  \ decompression library\nDescription :\nZlib 是一个通用的无专利、无损数据压缩\n库，被许多不同的程序使用。\n```\n\
  \n\n\n\n请注意，`rpm -qi` 命令输出中的重要信息包括版本、发布版本和安装日期。描述部分也有助于判断该软件包的设计用途。\n\n要列出随该包安装的文件，请执行以下命令：`rpm\
  \ -ql *pkgname*`。在安装软件软件包后立即运行此命令非常有用，这样你就能了解系统中添加了哪些新文件。这里是一个示例：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]# rpm -ql zlib\n/usr/lib64/libz.so.1\n/usr/lib64/libz.so.1.2.8\n\
  /usr/share/doc/zlib\n/usr/share/doc/zlib/ChangeLog\n/usr/share/doc/zlib/FAQ\n/usr/share/doc/zlib/README\n\
  ```\n\n如果该软件包提供了某种服务，那么该服务可能会有配置文件。要列出软件包的配置文件，请执行以下命令：`rpm -qc *pkgname*`。例如：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -qc vsftpd\n/etc/logrotate.d/vsftpd\n\
  /etc/pam.d/vsftpd\n/etc/vsftpd/ftpusers\n/etc/vsftpd/user_list\n/etc/vsftpd/vsftpd.conf\n\
  ```\n\n注意，上一个示例没有没有 `zlib` 软件包，因为它没有配置文件：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# rpm -qc zlib\n[root@onecoursesource ~]#\n```\n\n查看软件包提供的文档文件也有用。这允许你查看有关如何使用随软件包软件的详情。要列出文档文件，请执行以下命令：`rpm\
  \ -qd *pkgname*`。例如：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -qd zlib\n\
  /usr/share/doc/zlib/ChangeLog\n/usr/share/doc/zlib/FAQ\n/usr/share/doc/zlib/README\n\
  ```\n\n如果你发现某个文件已经存在于系统中，你想知道是否还有其他内容作为软件包的一部分被安装了？当该文件被修改时，这非常有用，因为你可以直接从软件包中检索原始文件。要查看某个文件源自哪个软件包，使用\
  \ `rpm -qf *filename*` 命令：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -qf\
  \ /usr/lib64/libz.so.1\nzlib-1.2.8-3.fc20.x86_64\n```\n\n如果软件包中的一个文件被修改或删除，那么来自相同软件包的其他文件也可能被修改或删除。要获取软件包中所有文件的状态列表，请使用\
  \ `rpm -V *pkgname*` 命令：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -V\
  \ clamd\n.....UG..    /var/clamav\nmissing     /var/run/clamav\n```\n\n`rpm -V`\
  \ 命令的输出可能有点难以习惯。如果软件包安装的文件不再存在系统中，输出将把该文件标记为“missing”（缺失）。如果文件被修改过，该命令将提供一组字符（以及“点”或句号），用来指示发生了哪些更改。这些字符在\
  \ `rpm` 命令的帮助页中定义，如示例 26-3 所示。\n\n**示例 26-3** *`rpm -V` 命令输出的帮助页描述*\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]#man rpm\n…\n       S file Size differs\n       M\
  \ Mode differs (includes permissions and file type)\n       5 digest (formerly MD5\
  \ sum) differs\n       D Device major/minor number mismatch\n       L readLink(2)\
  \ path mismatch\n       U User ownership differs\n       G Group ownership differs\n\
  \       T mTime differs\nP caPabilities differ\n…\n```\n\n### 安全要点\n\n发现软件包文件发生了更改并不意味着自动存在问题。例如，如果配置文件的大小发生了变化，可能意味着管理员编辑了该文件，以自定义软件的运行方式。\n\
  \n仔细考虑哪些文件应该和不应该更改。例如，`/bin` 和 `/usr/bin` 目录下的文件通常是二进制（非文本）文件，大小不应该改变。`/etc` 目录下的文件通常是配置文件，你会预计这些文件的大小会发生变化。\n\
  \n### 查看软件包依赖\n\n软件包通常需要其他软件包的功能。这些功能被称为*依赖关系*（dependencies）。要列出软件包的依赖关系，请执行以下命令：`rpm\
  \ -qR *pkgname*`。参见示例 26-4。\n\n**示例 26-4** *`rpm -qR` 命令*\n\n点击此处查看代码图片\n\n```\n\
  [root@onecoursesource ~]#rpm -qR vsftpd\n/bin/bash\n/bin/sh\nconfig(vsftpd) = 3.0-2-6\n\
  libc.so.6()(GLIBC_14)\nlibc.so.6(GLIBC_15)\nlibc.so.6(GLIBC_2.5)\nlibc.so.6(GLIBC_2.4)\n\
  libc.so.6(GLIBC_2.7)\nlibcap.so.2()\nlibcrypto.so.10()\nlibcrypto.so.10(libcrypto.so.10)\n\
  libdl.so.2()\nlibnsl.so.2.0\nlibpam.so.0()\nlibpam.so.0(._so.0)\nlibssl.so.10(libssl.so.10)\n\
  libwrap.so.0()\nlogrotate\nrpmlib(FileNames) <= 3.0-4\nrpmlib(FileDigests) <= 4.6-1\n\
  rpmlib(PayloadPrefix) <= 4.0-1\nrtld(GNU_HASH)\nrpmlib(PayloadIs) <= 5.2-1\n```\n\
  \n注意依赖项不仅是包名，也是由软件包提供的特性。例如，在示例 26-4 的输出中，“logrotate”表示对`logrotate`包的依赖，而 `/bin/bash”表示对`/bin/bash`的依赖。大多数行表示库（其他程序共享的小程序）。\n\
  \n要列出提供依赖关系的软件包，请执行以下命令：`rpm -q --whatprovides *capability*`。示例 26-5 提供了一些示例。\n\n\
  **示例 26-5** *`rpm -q --whatprovides` 命令*\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]#rpm -q --whatprovides /bin/bash\nbash-4.2.53-2.fc28.x86_64\n[root@onecoursesource\
  \ ~]#rpm -q --whatprovides \"libc.so.6()(64bit)\"\nglibc-2.18-19.fc28.x86_64\n[root@onecoursesource\
  \ ~]#rpm -q --whatprovides /sbin/ldconfig\nglibc-2.18-19.fc28.x86_64\n[root@onecoursesource\
  \ ~]#rpm -q --whatprovides \"libwrap.so.0()(64bit)\"\ntcp_wrappers-libs-7.6-76.fc28.x86_64\n\
  ```\n\n你可能还会想：“如果一个包需要这个依赖项，还有哪些包也需要？”要列出还需要该依赖关系的包，请执行以下命令：`rpm -q --whatrequires\
  \ *capability*`。例如，参见示例 26-6 的输出。\n\n**示例 26-6** *`rpm -q --whatrequires` 输出*\n\n\
  点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# rpm -q --whatrequires \"libwrap.so.0()(64bit)\"\
  \nnet-snmp-agent-libs-5.7.2-18.fc28.x86_64\nnet-snmp-5.7.2-18.fc28.x86_64\nquota-4.01-11.fc28.x86_64\n\
  sendmail-8.14.8-2.fc28.x86_64\naudit-2.4.1-1-fc28.x86_64\nvsftpd-3.0.2-6-fc28.x86_64\n\
  pulseaudio-libs-5.0-25-fc28.x86_64\nopenssh-server-6.4p1-8-fc28.x86_64\nsystemd-208-31-fc28.x86_64\n\
  proftpd-1.3.4e-3.fc28.x86_64\n```\n\n前面的输出可以非常有用。例如，我们可以知道，如果移除提供“libwrap.so.0()(64bit)”库的软件包，那么上述\
  \ `rpm -q --whatrequires` 命令列出的包将不再正常工作。\n\n一旦确定了哪个软件包提供了特定的依赖关系，你可能还想查看该软件包提供的其他依赖关系。要列出这些其他依赖关系，请执行以下命令：`rpm\
  \ -q--provides *pkgname*`。例如：\n\n点击此处查看代码图片\n\n\n\n\n```\n[root@onecoursesource\
  \ ~]# rpm -q --provides tcp_wrappers-libs-7.6-76.fc28.x86_64\nlibwrap.so.0()(64bit)\n\
  tcp_wrappers-libs = 7.6-76.fc28\ntcp_wrappers-libs(x86-64) = 7.6-76.fc28\n```\n\n\
  ### 软件包列表技巧\n\n`rpm` 命令以其具有列出软件包信息的强大功能而闻名世。例如，假设你怀疑某个新软件包导致了系统出现问题，但你不记得最近安装了哪些软件包（或者你怀疑有黑客安装了一些新软件包）。可以考虑运行\
  \ `rpm -qa --last` 命令，它将按照安装日期的顺序列显示已安装的软件包：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# rpm -qa --last | head -n 5\nperl-Pod-Checker-1.60-292.fc28.noarch      Fri\
  \ 10 Feb 2019 11:09:09 AM PST\nperl-Pod-Parser-1.61-3.fc28.noarch         Fri 10\
  \ Feb 2019 11:09:08 AM PST\nperl-Readonly-1.03-24.fc28.noarch          Fri 10 Feb\
  \ 2019 10:10:25 AM PST\nperl-Readonly-XS-1.05-16.fc28.x86_64       Fri 10 Feb 2019\
  \ 10:10:24 AM PST\nlibX11-devel-1.6.1-1.fc28.x86_64           Thu 26 Jan 2019 10:26:50\
  \ AM PST\n```\n\n回想起 `rpm -qi` 命令提供了已安装软件包的信息。要查看尚未安装的软件包的此类信息，请执行命令 `rpm -qip *pkgname.rpm`。注意\
  \ `-p` 选项意味着“这是一个软件包文件，而不是已安装的软件包”。请参见示例 26-7 示例。\n\n**示例 26-7 `rpm -qip` 命令**\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#rpm-qip fedora/packages/tcl-8.5.14-1.fc28.x86_64.rpm\n\
  Name        : tcl\nEpoch       : 1\nVersion     : 8.5.14\nRelease     : 1.fc28\n\
  Architecture: x86_64\nInstall Date: (not installed)\nGroup       : Development/Languages\n\
  Size        : 4592249\nLicense     : TCL\nSignature   : RSA/SHA256, Thu 15 Aug 2017\
  \ 10:36:45 AM PDT, Key ID 2eb161fa246110c1\nSource RPM  : tcl-8.5.14-1.fc28.src.rpm\n\
  Build Date  : Thu 15 Aug 2017 02:04:19 AM PDT\nBuild Host  : buildvm-13.phx2.fedoraproject.org\n\
  Relocations : (not relocatable)\nPackager    : Fedora Project\nVendor      : Fedora\
  \ Project\nURL         : http://tcl.sourceforge.net/\nSummary     : Tool Command\
  \ Language, pronounced tickle\nDescription :\nThe Tcl (Tool Command Language) 提供了一个强大的平台，\n\
  用于创建集成应用程序，将不同的应用程序、协议、设备和框架连接在一起。与 Tk 工具包配合时，Tcl 提供了一种快速且强大的创建跨平台 GUI 应用程序的方法。Tcl\
  \ 还可以用于各种与网络相关的任务，并为应用程序创建强大的命令行。\n```\n\n哪些软件包占用了最多的硬盘空间？要按大小列表软件包，请执行以下命令：`rpm\
  \ -qa --queryformat ‘%{name} %{size}\\n’ | sort -n -k 2 -r`。例如：\n\n点击此处查看代码图像\n\n\
  ```\n[root@onecoursesource ~]# rpm -qa --queryformat '%{name} %{size}\\n' |\nsort\
  \ -n -k 2 -r | head -n 5\nkernel 151587581\nkernel 147584558\nkernel 146572885\n\
  firefox 126169406\nmoodle 122344384\n```\n\n注意，在前面的命令行中，`head` 命令被用于减少输出量，只保留最大的五个文件。`sort`\
  \ 命令对每行的第二个字段（软件包的字节大小）进行反向数字排序（较大的数字显示在前面）。虽然单位是字节，但可以使用许多在线计算器之一将其轻松转换为兆字节或千字节（例如，[`whatsabyte.com/P1/byteconverter.htm`](http://whatsabyte.com/P1/byteconverter.htm)）。\n\
  \n在某些情况下，你可能想列出所有来自特定供应商的软件包。可以通过执行以下命令来实现：`rpm -qa --qf ‘%{name} %{vendor}\\n’\
  \ | grep vendor-name`。将 `vendor-name` 替换为供应商名称，如下：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# rpm -qa --qf '%{name} %{vendor}\\n' | grep  \"Virtualmin, Inc.\"\nvirtualmin-base\
  \ Virtualmin, Inc.\n```\n\n**注意**\n\n如果你的系统中没有来自来自“Virtualmin, Inc.”的软件，那么之前的命令在你的系统上可能无效。那么，我们是如何选择这个特定供应商的？我们首先运行了\
  \ `rpm -qa --qf ‘%{name} %{vendor}\\n’` 命令，这产生了数百行输出。这些行大部分显示供应商名称为“Fedora Project”，因为我们正在操作的发行版是\
  \ Fedora。接下来，我们运行了 `rpm -qa --qf ‘%{name} %{vendor}\\n’ | grep -v “Fedora Project”`\
  \ 命令来显示所有不是“Fedora Project”提供的软件包（记得 `grep` 命令的 `-v` 选项意味着“匹配所有不包含此模式的行”）。然后我们只是随机从结果中挑选了一个进行演示。这段描述的重点在于说明，了解诸如\
  \ `grep` 这样强大的命令行工具可以让你的生活变得简单得多！\n\n**安全亮点**\n\n添加或删除软件需要你以 root 用户身份登录。然而，任何用户都可以查看软件包信息。这突显了保护普通用户账户的重要性，因为了解系统中安装了哪些软件可以为黑客提供手段，以确定可能进一步损害系统的攻击技术。因此，如果黑客能够以普通用户的身份访问系统，那么黑客就可以获得有价值的信息。\n\
  \n### 使用 rpm 安装软件包\n\n可以使用三种不同的选项通过 `rpm` 命令安装软件软件包。表 26-1 描述了这三个选项。\n\n**表 26-1\
  \ rpm 命令的安装方法**\n\n| 场景 | `rpm -i` | `rpm -U` | `rpm -F` |\n| --- | --- | --- |\
  \ --- |\n| 软件包之前的版本已安装在系统中。 | 安装了第二个（可能冲突）的版本。 | 软件包升级到新版本。 | 软件包升级到新版本。 |\n| 软件包之前的版本尚未安装在系统中。\
  \ | 安装软件包。 | 安装软件包。 | 不采取操作。 |\n\n只有在你确定没有安装之前的版本时，才使用 `-i` 选项。`kernel` 软件包是一个例外。两个\
  \ `kernel` 软件包没有冲突的文件。大多数情况下，你应该使用 `-U` 选项安装或升级软件包。然而，`-F` 选项在某些情况下非常有用。例如，假设管理员将发行版的所有更新软件包拷贝到一个网络共享目录。该共享包含比你当前安装的要得多。如果你在这些软件包所在的目录执行\
  \ `rpm -U` 命令，你不仅会升级现有软件包，还会安装许多新软件包。如果你执行 `rpm -F` 命令，则只会升级现有软件包，所有“新”软件包都不会安装。\n\
  \n**注意**\n\n某些软件包可能需要长时间才能安装。由于 `rpm` 命令在软件包完全安装之前通常没有任何输出，这可能会导致你认为命令没有“做任何事情”。考虑使用\
  \ `-h` 选项，它会在软件包安装时在屏幕上显示“哈希标记”：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ rpm -ih /var/cache/yum/x86_64/20/\nfedora/packages/joe-3.7-13.fc28.x86_64.rpm\n\
  ################################# [100%]\nUpdating / installing...\n#################################\
  \ [100%]\n```\n\n\n\n\n\n考虑一种情况：你从互联网或通过电子邮件获取了一个软件包。你该如何判断该软件包是确实来自正确的源，还是被黑客篡改过的软件包？你永远不应该从不受信任的源安装软件软件包，尤其是在关键系统上。\n\
  \n在安装之前，你还应该检查软件包的内容。使用病毒或蠕虫扫描工具也是一个好主意。\n\n即使你从认为受信的源获取了软件包，也应该考虑验证该软件包。你可以采用类似于验证信件是否由特定某人写的方法来实现。如果你知道那个人的签名是什么样的，就可以查看信件上的签名以验证它是否真的来自那个特定人员。\n\
  \n创建软件包的组织应该提供一个数字签名，这是一个唯一的“密钥”，只有该组织可以将其放在软件包上。你可以使用一个工具来验证此数字签名，但首先你需要从一个受信的位置（直接从该组织本身）获取签名文件。\n\
  \n接下来，使用以下命令将签名导入 RPM 数据库：`rpm --import */location/key-file`\n\n一旦你在 RPM 数据库中有了签名，就可以在安装软件包之前，对\
  \ RPM 文件的签名进行验证，如下所示：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# rpm -K /var/cache/yum/x86_64/20/fedora/packages/joe-3.7-13-fc28.x86_64.rpm\n\
  /var/cache/yum/x86_64/20/fedora/packages/joe-3.7-13-fc28.x86_64.rpm: rsa sha1 (md5)\
  \ pgp md5 OK\n```\n\n你主要寻找的是输出末的“OK”。不要信任任何未提供此信息的软件包。\n\n要列出 RPM 数据库中当前所有的签名，请使用以下命令：`rpm\
  \ -qa gpg-pubkey*`。例如：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource rpm -qa gpg-pubkey*\n\
  gpg-pubkey-11f63c51-3c7dc11d\ngpg-pubkey-5ebd2744-418ffac9\ngpg-pubkey-4520afa9-50ab914c\n\
  gpg-pubkey-246110c1-51954fca\ngpg-pubkey-a0bdbcf9-42d1d837\n```\n\n使用 `rpm -qi`\
  \ 查看特定签名的详情，如[示例 26-8 所示。\n\n### 示例 26-8：显示签名详情\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]#rpm -qi gpg-pubkey-a0bdbcf9-42d1d837\nName        : gpg-pubkey\nVersion   \
  \  : a0bdbcf9\nRelease     : 42d1d837\nArchitecture: (none)\nInstall Date: Thu 15\
  \ Jan 2015 09:02:46 AM PST\nGroup       : Public Keys\nSize        : 0\nLicense\
  \     : pubkey\nSignature   : (none)\nSource RPM  : (none)\nBuild Date  : Sun 10\
  \ Jul 2005 07:23:51 PM PDT\nBuild Host  : localhost\nRelocations : (not relocatable)\n\
  Packager    : Virtualmin, Inc. <security@virtualmin.com>\nSummary     : gpg(Virtualmin,\
  \ Inc. <security@virtualmin.com>)\nDescription :\n-----BEGIN PGP PUBLIC KEY BLOCK-----\n\
  Version: rpm-4.11.1 (NSS-3)\n```\n\n**注意**\n\n不要被示例 26-8 输出中的构建日期所困扰。\n\n#### 软件包\n\
  \n要移除软件包，请使用 `rpm -e` 命令。如果你想在不实际移除软件包的情况下查看会发生什么，请使用 `--test` 。\n\n要移除软件包及其所有依赖项，请使用\
  \ `--remove` 。如果你想在不检查依赖关系的情况下移除软件包，请使用 `--nodeps` 。\n\n**可能出现的问题**\n\n如果你在移除软件包时遇到错误，可能是因为其他软件包依赖于它。在这种情况下，你应该考虑先移除依赖软件包。\n\
  \n\n\n\n\n仓库（Repos）可以通过 `FTP`、`HTTP` 或 `HTTPS` 在网络上共享，也可以存储在系统的本地目录中（硬盘或可移动介质）。当通过网络共享仓库时，仓库配置的一部分包括配置\
  \ FTP 服务器或 Web 服务器。有关如何配置这些服务器的详情，请参阅第 20 章“网络服务配置：基本服务](#ch20.xhtml_ch20)”以及第 21\
  \ 章“网络服务配置：Web 服务](#ch21.xhtml_ch21)”。\n\n## 访问仓库\n\n要访问仓库，你需要知道如何配置 `yum` 命令。这是通过构构成的\
  \ `/etc/yum.conf` 文件和 `/etc/yum.repos.d` 目录下的文件组合实现的。\n\n`/etc/yum.conf` 文件是 `yum`\
  \ 命令的主要配置文件。例如，请参考示例 26-9。\n\n### 示例 26-9 *`/etc/yum.conf` 文件*\n\n点击此处查看代码图像\n\n\
  ```\n[main]\ncachedir=/var/cache/yum/$basearch/$releasever\nkeepcache=0\ndebuglevel=2\n\
  logfile=/var/log/yum.log\nexactarch=1\nobsoletes=1\ngpgcheck=1\nplugins=1\ninstallonly_limit=5\n\
  bugtracker_url=http://bugs.centos.org/set_project.php?project_id=23&ref=\n http://bugs.centos.org/bug_report_page.php?category=yum\n\
  distroverpkg=centos-release\n```\n\n`/etc/yum.conf` 文件的关键设置见表 26-2。\n\n### 表 26-2\
  \ `/etc/yum.conf` 文件的设置\n\n| 设置 | 描述 |\n| --- | --- |\n| `cachedir` | 下载后放置 RPM\
  \ 软件包的目录。 |\n| `logfile` | 包含 `yum` 操作记录的日志文件位置。 |\n| `gpgcheck` | 值为 `1` 表示“执行\
  \ `gpg` 检查以确保包有效”；值为 `0` 表示“不执行 `gpg` 检查”（这可以通过每个仓库配置文件的特定设置进行覆盖）。更多详情请参阅对 `/etc/yum.repos.d`\
  \ 目录的后续描述。 |\n| `assumeyes` | 值为 `1` 表示“对任何是/否提示始终回答‘是’”；值为 `0` 表示“不进行任何假设，而是提供提示”。\
  \ |\n\n`/etc/yum.repos.d` 目录包含以 `.repo` 结尾的文件。这些文件用于指定 `yum` 仓库的位置。每个文件定义了一个或多个仓库，如图\
  \ 26-2 所示。\n\n![Image](img/26fig02.jpg)\n\n### 图 26-2 *`/etc/yum.repos.d` 目录中文件的格式*\n\
  \n## 创建仓库\n\n创建仓库涉及以下步骤：\n\n1. 创建存储软件包的目录。\n2. 将所有软件包复制到该目录中。\n3. 运行命令 `createrepo\
  \ */directory`（将 `*/directory` 替换为步骤 1 中创建的目录）。注意，系统默认通常不包含 `createrepo` 命令。你应该安装\
  \ `createrepo` 软件包以获取该命令的使用。\n\n### 使用 yum 命令\n\n`yum` 命令用于从仓库安装软件。它也可以用于删除软件和显示有关软件的信息。表\
  \ 26-3 列出了主要的 `yum` 命令和选项。\n\n### 表 26-3 主要 `yum` 命令和选项\n\n| 命令/选项 | 描述 |\n| ---\
  \ | --- |\n| `install` | 从仓库安装软件包及任何依赖包（例如，`yum install zip`）。 |\n| `groupinstall`\
  \ | 从仓库安装整个软件组。 |\n| `update` | 更新指定的软件包。 |\n| `remove` | 移除指定的软件包。 |\n| `groupremove`\
  \ | 移除指定的软件组。 |\n| `list` | 列出有关软件包的信息。 |\n| `grouplist` | 列出软件组的信息。 |\n| `info`\
  \ | 提供软件包的信息。 |\n| `groupinfo` | 提供软件组的信息。 |\n| `-y` | 对任何提示回答“yes”。 |\n\n### 使用\
  \ yum 显示软件包信息\n\n要使用 `yum` 命令显示信息，你需要知道如何配置 `yum` 命令。这是通过组合 `/etc/yum.conf` 文件和\
  \ `/etc/yum.repos.d` 目录下的文件组合实现的。\n\n`/etc/yum.conf` 文件是 `yum` 命令的主要配置文件。例如，请参考示例\
  \ 26-9。\n\n### 示例 26-9 *`/etc/yum.conf` 文件*\n\n点击此处查看代码图像\n\n```\n[main]\ncachedir=/var/cache/yum/$basearch/$releasever\n\
  keepcache=0\ndebuglevel=2\nlogfile=/var/log/yum.log\nexactarch=1\nobsoletes=1\n\
  gpgcheck=1\nplugins=1\ninstallonly_limit=5\nbugtracker_url=http://bugs.centos.org/set_project.php?project_id=23&ref=\n\
  \ http://bugs.centos.org/bug_report_page.php?category=yum\ndistroverpkg=centos-release\n\
  ```\n\n## 可能出现什么问题？\n\n为了让 `yum` 命令正常工作，你需要访问互联网。如果命令失败，请测试你的网络连接。\n\n`yum` 命令还支持\
  \ `search` 功能，可以匹配包名中的通配符。它还会尝试匹配描述和 URL。例如，示例 26-11 中的命令显示了所有包含“joe”的软件包。\n\n###\
  \ 示例 26-11 *使用 `yum` 命令搜索软件包*\n\n点击此处查看代码图像\n\n```\n[root@onecourses]#yum search\
  \ joe\nLoaded plugins: fastestmirror, verify\nLoading mirror speeds from cached\
  \ hostfile\n * atomic: www6.atomicorp.com\n * fedora: mirrors.rit.edu\n * updates:\
  \ mirrors.rit.edu\n=============================== N/S matched: joe ===============================\n\
  libjoedog-devel.i686 : Development files for libjoedog\nlibjoedog-devel.x8664 :\
  \ Development files for libjoedog\njoe.x8664 : An easy to use, modeless text editor\n\
  jupp.x8664 : Compact and feature-rich WordStar-compatible editor\njwm.x8664 : Joe's\
  \ Window Manager\nlibjoedog.i686 : Repack of the common code base of fido and siege\n\
  libjoedog.x8664 : Repack of the common code base of fido and siege\ntexlive-jknapltx.noarch\
  \ : Miscellaneous packages by Joerg Knappen\n```\n\n你可能疑惑为什么 `jupp.x86_44` 软件包在示例\
  \ 26-11 的命令中匹配。如果你运行 `yum info jupp.x86_64` 命令，你会发现该命令的输出包含了示例 26-12 所示的内容。\n\n\
  ### 示例 26-12 *显示 `yum` 信息*\n\n点击此处查看代码图像\n\n\n\n\n\n```\nDescription : Jupp 是一个紧凑且功能丰富的\
  \ WordStar 兼容编辑器，\n            同时也也是 JOE 3.x 编辑器的 MirOS 分支，它为以前的\n            PC\
  \ 用户提供了方便的转换，并为程序员提供了强大的\n            功能，同时不会执行像“自动”换行这样\n            烦人的操作。它可以作为十六进制编辑器使用，并附带\n\
  \            字符映射以及 Unicode 支持。此外，它包含一个可以可视化显示制表符和空格的扩展，具有一个经过清理、扩展和美化的选项菜单、更多 CUA\
  \ 风格的键位绑定、改进的数学功能以及一个与 Xterm 自动使用的括号粘贴模式。\n```\n\n### 软件组\n\n`yum` 命令相比 `rpm` 命令的优点之一是在仓库中创建软件组。通过将软件包分组，可以更容易安装一组套件或系列软件包。\n\
  \n要显示现有仓库中提供的某些软件组，请使用命令 `yum group list`，如示例 26-13 所示。\n\n### 示例 26-13：`yum group\
  \ list` 命令\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#yum group list\nLoaded\
  \ plugins: fastestmirror, verify\nLoading mirror speeds from cached hostfile\n *\
  \ atomic: www6.atomicorp.comyu\n * fedora: mirrors.rit.edu\n * updates: mirrors.rit.edu\n\
  Installed environment groups:\n   Minimal Install\nAvailable environment groups:\n\
  \   GNOME Desktop\n   KDE Plasma Workspaces\n   Xfce Desktop\n   LXDE Desktop\n\
  \   Cinnamon Desktop\n   MATE Desktop\n   Sugar Desktop Environment\n   Development\
  \ and Creative Workstation\n   Web Server\n   Infrastructure Server\n   Basic Desktop\n\
  Installed groups:\n   Development Tools\nAvailable Groups:\n   3D Printing\n   Administration\
  \ Tools\n   Audio Production\n   Authoring and Publishing\n   Books and Guides\n\
  \   C Development Tools and Libraries\n   Cloud Infrastructure\n   D Development\
  \ Tools and Libraries\n   Design Suite\n   Editors\n   Educational Software\n  \
  \ Electronic Lab\n   Engineering and Scientific\n   Fedora Eclipse\n   FreeIPA Server\n\
  \   Games and Entertainment\n   LibreOffice\n   Medical Applications\n   Milkymist\n\
  \   Network Servers\n   Office/Productivity\n   RPM Development Tools\n   Robotics\n\
  \   Security Lab\n   Sound and Video\n   System Tools\n   Text-based Internet\n\
  Done\n```\n\n`yum group list` 命令并没有显示所有的软件组。某些组默认是隐藏的，可以通过执行 `yum group list hidden`\
  \ 命令来查看。该命令的输出太大，无法在书中显示。为了演示使用 `hidden` 选项将显示更多的软件组，请查看以下输出：\n\n点击此处查看代码图像\n\n\
  ```\n [root@onecoursesource ~]#yum group list | wc -l\n51\n[root@onecoursesource\
  \ ~]#yum group list hidden | wc -l\n142\n```\n\n注意，`wc -l` 将显示上一个命令输出的行数。每行代表一个软件组（除了几行不包含组名的行外），因此\
  \ 142 行对比 51 行意味着，如果你不使用 `hidden` 选项，会有大约 90 个未显示的额外软件组。\n\n你可以使用 `yum group info`\
  \ 命令显示有关软件组的信息，如示例 26-14 所示。\n\n### 示例 26-14：`yum group info` 命令\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]#yum group info \"LibreOffice\"\nLoaded plugins:\
  \ fastestmirror, verify\nLoading mirror speeds from cached hostfile\n * atomic:\
  \ www6.atomicorp.com\n * fedora: mirrors.rit.edu\n * updates: mirrors.rit.edu\n\
  Group: LibreOffice\n Group-Id: libreoffice\n Description: LibreOffice Productivity\
  \ Suite\n Mandatory Packages:\n   +libreoffice-calc\n   +libreoffice-draw\n   +libreoffice-emailmerge\n\
  \   +libreoffice-graphicfilter\n   +libreoffice-impress\n   +libreoffice-math\n\
  \   +libreoffice-writer\n Optional Packages:\n   libreoffice-base\n   libreoffice-pyuno\n\
  ```\n\n在下一节中，你将学习如何使用软件包组安装软件包。\n\n### 使用 yum 安装软件\n\n当你使用 `yum` 命令安装软件包时，可以指定软件包名、通配符（glob）或软件包内的文件名。例如，示例\
  \ 26-15 演示了通过名称安装 `joe` 软件包。\n\n### 示例 26-15：使用 `yum` 安装软件包\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource ~]#yum install joe\nLoaded plugins: fastestmirror, verify\n\
  Loading mirror speeds from cached hostfile\n * atomic: www6.atomicorp.com\n * fedora:\
  \ mirrors.rit.edu\n * updates: mirrors.rit.edu\nResolving Dependencies\n--> Running\
  \ transaction check\n---> Package joe.x86_64 0:3.7-13.fc28 will be installed\n-->\
  \ Finished Dependency Resolution\n\nDependencies Resolved\n\n===================================================================\n\
  \ Package    Arch         Version              Repository     Size\n===================================================================\n\
  Installing:\n joe        x86_64       3.7-13.fc28          fedora         382 k\n\
  \nTransaction Summary\n===================================================================\n\
  Install  1 Package\n\nTotal size: 382 k\nInstalled size: 1.2 M\nIs this ok [y/d/N]:\
  \ y\nDownloading packages:\nRunning transaction check\nRunning transaction test\n\
  Transaction test succeeded\nRunning transaction (shutdown inhibited)\n  Installing\
  \ : joe-3.7-13.fc28.x86_64                                       1/1\n  Verifying\
  \  : joe-3.7-13.fc28.x86_64                                       1/1\n\nInstalled:\n\
  \  joe.x86_64 0:3.7-13.fc28\n\nComplete!\n```\n\n在下一个示例中，使用了通配符来匹配软件包名：`yum install\
  \ joe*`。\n\n如果你知道某个属于软件包的文件，可以指定文件名：`yum install /bin/joe`。\n\n默认情况下，`yum` 命令会在下载或安装软件包之前提示你。为了避免该提示并自动回答“是”，请使用\
  \ `-y` 选项。\n\n如果你只想下载软件包而不安装任何内容，请使用 `--downloadonly` 选项。这会将软件包放置在 `/var/cache/yum`\
  \ 目录下的子目录下（例如，对于 Fedora 28 版本，为 `/var/cache/yum/x86_64/28`）。这在你创建自己的仓库时非常有用，因为它提供了一种在不实际安装的情况下下载软件包的方便方法。\n\
  \n要从组安装软件包，请使用 `yum group install groupname*` 命令（例如 `yum group install \"LibreOffice\"\
  `）。\n\n## 使用 yum 移除软件\n\n使用 `yum remove` 命令移除软件包。你可以指定软件包名、通配符或文件名作为 `yum remove`\
  \ 命令的参数：\n\n*   `yum remove joe`\n*   `yum remove ruby*`\n*   `yum remove /usr/bin/ruby`\n\
  \n默认情况下，系统会要求你确认是否要移除软件包。使用 `-y` 选项可以自动回答“是”。\n\n### 可能会出现什么问题？\n\n在结合 `-y` 选项和包含通配符的软件包参数时要务必小心。你可能会删除比预期多多的软件包。\n\
  \n要移除软件组，请使用以下语法：`yum group remove groupname*`。\n\n## 使用 yum 插件\n\n插件用于为 `yum` 提供更多功能和特性。一些常用的\
  \ `yum` 插件示例：\n\n*   `fastmirror`：从镜像列表中找到最快的镜像；镜像是仓库的一个功能，允许仓库在不同的系统之间分散客户端请求。\n\
  *   `snapshot`：在更新期间自动对文件系统快照；文件系统快照允许在 `yum` 操作产生问题时恢复文件。\n\n\n\n\n\n*   `versionlock`:\
  \ 启用一项“锁定”软件包的功能；当软件包锁定后，将不会对该软件包进行任何更新。\n\n你可以通过执行以下命令显示当前安装的插件：`yum info yum`。此命令会产生大量的输出，因此示例\
  \ 26-16 设计为仅显示一个已安装的插件。\n\n**示例 26-16** *显示 `yum` 插件*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]#yum info yum | head -n 25\nLoaded plugins: fastestmirror, verify\nLoading mirror\
  \ speeds from cached hostfile\n * atomic: www6.atomicorp.com\n * fedora: mirrors.rit.edu\n\
  \ * updates: mirrors.rit.edu\nInstalled Packages\nName        : yum\nArch      \
  \  : noarch\nVersion     : 3.4.3\nRelease     : 152.fc20\nSize        : 5.6 M\n\
  Repo        : installed\nFrom repo   : updates\nSummary     : RPM package installer/updater/manager\n\
  URL         : http://yum.baseurl.org/\nLicense     : GPLv2+\nDescription : Yum is\
  \ a utility that can check for and automatically\n            : download and install\
  \ updated RPM packages.\n            : Dependencies are obtained and downloaded\n\
  \            : automatically, prompting the user for permission as\n           \
  \ : necessary.\n```\n\n你可以通过多种方式启用和禁用插件：\n\n*   可以通过其特定配置文件中的“enabled”设置来启用或禁用每个插件。这些配置文件位于\
  \ `/etc/yum/pluginconf.d` 目录。例如，要为所有 `yum` 命令启用 `fastestmirror` 插件，请在 `/etc/yum/pluginconf.d/fastestmirror.conf`\
  \ 文件中设置 `enabled=1`。要为所有 `yum` 命令禁用此插件，请在 `/etc/yum/pluginconf.d/fastestmirror.conf`\
  \ 文件中设置 `enabled=0`（注：原文此处可能笔误，写成了 1，逻辑上应为 0）。\n\n*   要为特定的 `yum` 命令禁用插件，请使用 `--disableplugin`\
  \ 选项。例如：`yum --disableplugin=fastestmirror`。\n\n*   要启用插件，请编辑 `/etc/yum.conf` 文件并将\
  \ `plugins` 设置的值更改为 1 (`plugins=1`)）。这不会启用所有插件，仅启用在上述配置文件中显式启用的插件。要为所有 `yum` 命令禁用所有插件，请编辑\
  \ `/etc/yum.conf` 文件并将 `plugins` 设置的值更改为 0 (`plugins=0`)）。\n\n*   要为特定的 `yum` 命令禁用所有插件，请使用\
  \ `--noplugins` 选项。\n\n系统中还有其他当前未安装的可用插件。你可以通过执行以下命令显示可用的插件：\n\n点击此处查看代码图像\n\n```\n\
  yum provides \"/usr/lib/yum-plugins/*\"\n```\n\n此 `yum` 命令会产生大量的输出；示例 26-17 使用 `head`\
  \ 命令来限制输出。\n\n**示例 26-17** *使用 `head` 命令限制输出*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# yum provides \"/usr/lib/yum-plugins/*\" | head\nLoaded plugins: fastestmirror,\
  \ verify\nLoading mirror speeds from cached hostfile\n * atomic: www6.atomicorp.com\n\
  \ * fedora: mirrors.rit.edu\n * updates: mirrors.rit.edu\nPackageKit-yum-plugin-0.8.13-1.fc22.x86_64\
  \ : Tell PackageKit to\n                                           : check for updates\n\
  \                                           : when yum exits\nRepo        : fedora\n\
  Matched from:\nFilename    : /usr/lib/yum-plugins/refresh-packagekit.py\n```\n\n\
  要安装插件，请使用以下命令：`yum install *plugin_name`（例如，`yum install PackageKit-yum-plugin`）。\n\
  \n### 额外工具\n\n在使用 RPM 的发行版中，你会发现有一些与软件管理相关的额外工具：\n\n*   **SUSE**：该发行版有一个名为 `zypper`\
  \ 的命令行工具，其工作方式与 `yum` 命令非常相似。它是 `rpm` 命令的前端实用，用于处理软件依赖。\n\n*   **Red Hat/CentOS/Fedora**：这些发行版有一个名为\
  \ `PackageKit` 的图形界面工具，可以通过菜单栏访问。它提供了与 `yum` 命令类似的功能，但以图形界面的形式呈现。\n\n*   **Fedora**：在较新的\
  \ Fedora 版本中，提供了一个旨在替换 `yum` 的新工具：DNF (Dandified yum)。与 `yum` 命令相比，它提供了更好的性能、更优的依赖解析以及额外的改进。它也与\
  \ `yum` 命令兼容，并使用了大部分相同的选项（某些选项已删除，而另一些则已添加）。作为 `dnf` 新功能的示例，如果你输入一个已不存在的命令，`dnf`\
  \ 会建议一个用于安装正确软件包以提供缺失命令的命令。请注意，本章描述的几乎每个 `yum` 特性在较新的 Fedora 版本上也可以作为 `dnf` 命令执行。\n\
  \n**可能会出现什么问题？**\n\n在较新的 Fedora 系统上，`yum` 命令在技术上仍然存在，但它实际上执行的是 `dnf` 命令。因此，任何仅适用于\
  \ `yum` 命令（而不适用于 `dnf` 命令）的特性在较新的 Fedora 系统上都会失败，即使你执行的是 `yum` 而不是 `dnf`。\n\n###\
  \ 总结\n\n在本章中，你学习了在基于 Red Hat 的发行版上管理软件包的几种方法。你学习了 `rpm` 命令，它主要用于查看软件包信息，但也可以用于简单的软件包安装。你还学习了\
  \ `yum` 命令提供的高级软件包管理工具，包括从仓库下载软件软件包和处理软件包依赖。\n\n## 关键术语\n\n软件包 (Package)\n\n元数据\
  \ (metadata)\n\nRPM\n\n依赖 (dependency)\n\n数字签名 (digital signature)\n\n仓库 (repository)\n\
  \n递归缩写 (recursive acronym)\n\n库 (library)\n\n插件 (plug-in)\n\n镜像 (mirror)\n\n## 复习题\n\
  \n**1.** 包含软件包元数据的 RPM 数据库存储在 `/var/lib/_____` 目录下。\n\n**2.** 哪个命令会列出所有当前安装的软件包？\n\
  \n1.  `rpm -ql`\n2.  `rpm -qp`\n3.  `rpm -qa`\n4.  以上都不对。\n\n**3.** `_____` 命令将在指定目录下创建一个仓库。\n\
  \n**4.** `rpm` 命令的 `_____` 选项将只升级系统中已安装了旧版本的软件包。\n\n1.  `-i`\n2.  `-F`\n3.  `-g`\n\
  4.  `-U`\n\n**5.** `yum` 命令的 `_____` 功能将匹配软件包名称和摘要中的通配符。\n\n## 第 27 章\n\n## 基于 Debian\
  \ 的软件管理\n\n在第 26 章“基于 Red Hat 的软件管理”中，你学习了如何在使用 RPM 的发行版上管理软件包。另一种流行的软件包管理系统最初用于\
  \ Debian，适用于 Ubuntu 和 Mint 等发行版。它不使用 `rpm`、`yum` 和 `dnf` 命令，而是使用 `dpkg`、`apt`、`apt-get`\
  \ 和 `apt-cache` 命令。\n\n从概念上讲，这两个软件包管理系统非常相似。差异在于特定的命令、选项，以及在某些情况下提供的功能。本章重点关注基于\
  \ Debian 的软件包管理系统，并强调了 Debian 和 Red Hat 软件管理之间的主要区别。\n\n**注意**\n\n由于这是书中介绍软件包的第二个章节，重点更多在于“如何操作”，而不是软件包管理的理论和概念。请务必回顾第\
  \ 26 章以获取有关理论和概念的信息。\n\n\n\n\n\n在阅读本章并完成练习后，你将能够完成以下操作：\n\n- 使用 `dpkg` 命令查看、安装和删除软件包\n\
  - 为 APT 创建软件源\n- 使用 APT 命令查看、安装和删除软件包\n\n## 使用 dpkg 管理软件包\n\n在许多方面，Debian 软件包管理工具与\
  \ Red Hat 软件包管理工具非常相似。例如，`rpm` 命令的对应命令是 `dpkg` 命令。这两个命令都适用于显示已安装软件包的信息，以及安装本地下载的软件包文件。\n\
  \nDebian 软件包管理器被用于许多 Linux 发行版，包括 Debian、Ubuntu 和 Mint。软件包文件以 `.deb` 扩展名发行。\n\n\
  ### 使用 dpkg 列出软件包信息\n\n要查看所有当前安装的软件包，请使用带有 `-l` 选项 `dpkg` 命令，如示例 27-1 所示。\n\n**示例\
  \ 27-1** 使用 `-l` 选项的 `dpkg` 命令\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# dpkg\
  \ -l | head\nDesired=Unknown/Install/Remove/Purge/Hold\n| Status=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-aWait/Trig-pend\n\
  |/ Err?=(none)/Reinst-required (Status,Err: uppercase=bad)\n||/ Name\nVersion  \
  \                                           Architecture Description\n+++-=========================================-\n\
  ===================================================-============-\n================================================================================\n\
  ii  account-plugin-aim                        3.8.6-0ubuntu9.2\n               \
  \                 amd64        Messaging account plugin for AIM\nii  account-plugin-google\
  \                     0.11+14.04.20140409.1-0ubuntu2\n                    all  \
  \        GNOME Control Center account plugin for single signon\nii  account-plugin-jabber\
  \                     3.8.6-0ubuntu9.2\n                                amd64  \
  \      Messaging account plugin for Jabber/XMPP\nii  account-plugin-salut      \
  \                3.8.6-0ubuntu9.2\n                                amd64       \
  \ Messaging account plugin for Local XMPP\n (Salut)\nii  account-plugin-yahoo  \
  \                    3.8.6-0ubuntu9.2\n                                amd64   \
  \     Messaging account plugin for Yahoo!\n```\n\n由于输出格式的原因，列出所有软件包时显示的输出可能有些难以理解。查看单个软件包会稍微简单一些，如图\
  \ 27-1 所示。\n\n![Image](img/27fig01.jpg)\n\n**图 27-1** `dkpg -l` 命令的输出\n\n图 27-1\
  \ 中显示的输出的最后一行的第一个字符与 `Desired=Unknown/Install/Remove/Purge/Hold` 相关。这个 `i` 表示该软件包的正常（期望）状态是“安装”。可以将其视为对软件包应该状态的建议。\n\
  \n图 27-1 中显示的输出的最后一行的第二个字符与 `Status=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-aWait/Trig-pend`\
  \ 相关。在这种情况下，`i` 表示软件包当前已安装。\n\n图 27-1 中显示的输出的最后一行的第三个字符用于表示软件包的任何问题或错误。在这种情况下，它是一个空格，意味着该软件包没有错误。\n\
  \n图 27-1 中显示的输出的最后一行的其余部分非常直观：软件包名称、已安装软件包的版本、软件包构建的架构以及软件包的描述。\n\n要显示有关软件包的详细信息，请使用\
  \ `-s` 选项，如示例 27-2 所示。\n\n**示例 27-2** 查看软件包信息\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~#\
  \ dpkg -s joe | head -n 20\nPackage: joe\nStatus: install ok installed\nPriority:\
  \ optional\nSection: editors\nInstalled-Size: 1313\nMaintainer: Ubuntu Developers\
  \ <ubuntu-devel-discuss@lists.ubuntu.com>\nArchitecture: amd64\nVersion: 3.7-2.3ubuntu1\n\
  Depends: libc6 (>= 2.14), libtinfo5\nBreaks: jupp (<< 3.1.18-2~)\nConffiles:\n /etc/joe/ftyperc\
  \ 3c915f0bb617c0e4ac2bc10a7c4e649b\n /etc/joe/jicerc.ru b7db1f92397dc0a7598065442a6827c1\n\
  \ /etc/joe/jmacsrc dd24e67b67c03810922d740cebc258cc\n /etc/joe/joerc 6f9cf4e8ce4649d312c2da6a337852\n\
  \ /etc/joe/jpicorc 0be5c286a0a9a14b733e2fa4e2d5828\n /etc/joe/jstarrc 2fbf22556f6199ea49cc52630c518\n\
  \ /etc/joe/rjoerc 158e89ba1c657089b21567cc638ff\nDescription: user friendly full\
  \ screen editor\n Joe, the's Own Editor, has the feel of most PC editors: the\n\
  ```\n\n`dpkg -s` 命令的输出包含了软件包的配置文件列表。要查看软件包包含的文件列表，请使用 `-L` 选项：点击此处查看代码图像。\n\n```\n\
  root@onecoursesource:~# dpkg -L joe | head -n 10\n/./etc\n/etc/joe\n/etc/joe/jicerc.ru\n\
  /etc/joe/rjoerc\n/etc/joe/jstarrc\n/etc/joe/ftyperc\n/etc/joe/jpicorc\n/etc/joe/macsrc\n\
  ```\n\n你还可以通过 `-S` 命令确定哪个软件包提供了特定文件：点击此处查看代码图像。\n\n```\nroot@onecoursesource:~#\
  \ dpkg -S /etc/joe/joerc\njoe: /etc/joe/joerc\n```\n\n从软件包安装的文件的更改可以使用 `-V` 选项显示：点击此处查看代码图像。\n\
  \n```\nroot@onecoursesource:~# dpkg -V joe\n???????? c /etc/joe/joerc\n```\n\n输出与第\
  \ 26 章中过的 `rpm -V` 命令输出非常相似，你可以从 `dpkg` 命令的手页摘中看到这一点：点击此处查看代码图像。\n\n```\n输出格式可以通过\
  \ --verify-format 选项进行选择，默认使用 rpm 格式，但未来可能会发生，因此解析此命令输出的程序应该明确它们期望的格式。\n```\n\n\
  要查看未安装软件包的内（文件列表），请使用 `-c` 选项，如示例 27-3 所示。\n\n**示例 27-3** 使用 `-c` 选项\n\n点击此处查看代码图像\n\
  \n```\nroot@onecoursesource:~# dpkg -c /tmp/joe_3.7-2.ubuntu1_amd64.deb | head\n\
  drwxr-xr-x root/root 0 2014-02-17 14:12 ./\ndrwxr-xr-x root/root 0 2014-02-17 14:12\
  \ ./etc\ndrwxr-xr-x root/root 0 2014-02-17 14:12 ./etc/joe\n-rw-r--r-- root/root\
  \ 38076 2014-02-17 14:12 ./etc/joe/jicerc.ru\n-rw-r--r-- root/root 32368 2014-02-17\
  \ 14:12 ./etc/joe/rjoerc\n-rw-r--r-- root/root 32215 2014-02-17 14:12 ./etc/joe/jstarrc\n\
  -rw-r--r-- root/root 9327 2014-02-17 14:12 ./etc/joe/ftyperc\n-rw-r--r-- root/root\
  \ 30127 2014-02-17 14:12 ./etc/joe/jpicorc\n-rw-r--r-- root/root 37722 2014-02-17\
  \ 14:12 ./etc/joe/joerc\n-rw-r--r-- root/root 34523 2014-02-17 14:12 ./etc/joe/jmacsrc\n\
  ```\n\n### 安全亮点\n\n在安装软件包之前，你应该列出软件包的内容，特别是如果你是从不太靠的源获取的软件包。寻找如 `/etc/passwd` 和\
  \ `/etc/shadow` 这样的可疑文件。黑客会在软件包中注入恶意文件以破坏系统。\n\n要显示尚未安装的软件软件包信息，请使用 `-I` 选项，如示例\
  \ 27-4 所示。\n\n**示例 27-4** 使用 `-I` 选项\n\n点击此处查看代码图像\n\n\n\n\n\n```\nroot@onecoursesource:~#\
  \ dpkg -I /tmp/joe_3.7-2.3ubuntu1_amd64.deb | head\n new debian package, version\
  \ 2.0.\n size 350818 bytes: control archive=1821 bytes.\n     118 bytes,     7 lines\
  \      conffiles\n    1812 bytes,    34 lines      control\n    1400 bytes,    28\
  \ lines   *  postinst             #!/bin/sh\n     133 bytes,     7 lines   *  postrm\
  \               #!/bin/sh\n     357 bytes,    13 lines   *  preinst            \
  \  #!/bin/sh\n     310 bytes,     9 lines   *  prerm                #!/bin/sh\n\
  \ Package: joe\n Version: 3.7-2.3ubuntu1\n```\n\n# 使用 dpkg 安装软件\n\n要使用 `dpkg` 命令安装软件包，请使用\
  \ `-i` 选项，如示例 27-5 所示。\n\n**示例 27-5** 使用 `-i` 选项的 `dpkg` 命令\n\n点击此处查看代码\n\n```\n\
  root@onecoursesource:~# dpkg -i /tmp/joe_3.7-2.3ubuntu1_amd64.deb\nSelecting previously\
  \ unselected package joe.\n(Reading database ... 177428 files and directories currently\
  \ installed.)\nPreparing to unpack .../joe_3.7-2.3ubuntu1_amd64.deb ...\nUnpacking\
  \ joe (3.7-2.3ubuntu1) ...\nSetting up joe (3.7-2.3ubuntu1) ...\nupdate-alternatives:\
  \ using /usr/bin/joe to provide /usr/bin/editor (editor) in auto mode\nProcessing\
  \ triggers for man-db (2.6.7.1-1ubuntu1) ...\n```\n\n你也可以指定一个目录作为 `-i` 选项的参数。如果参数是一个目录，则该目录内所有以\
  \ `.deb` 结尾的文件将作为软件包安装。\n\n## 可能会出现什么问题？\n\n很容易混淆 `-I` 选项（显示软件包文件信息）和 `-i` 选项（安装软件包）。在此务必小心，因为这两个选项都用于软件包文件，所以你可能在本想显示软件包信息时却不小心安装了它。\n\
  \n# 使用 dpkg 重新配置软件\n\n软件包管理的功能之一是可以在安装（和删除）过程中执行自定义操作。这是通过通常具有交互性的脚本实现的。在某些情况下，在软件包安装后的某个时间点再次执行这些脚本可能是很有用的。\n\
  \n例如，`keyboard-configuration` 软件包旨在配置默认系统键盘。如果你决定将系统发送到另一个具有不同键盘布局的国家，那么再次执行该软件包的配置脚本将非常之用。你可以通过执行\
  \ `dpkg-reconfigure` 命令来实现这一点。图 27-2 提供了执行 `dpkg-reconfigure keyboard-configuration`\
  \ 命令结果的演示。\n\n![Image](img/27fig02.jpg)\n\n**图 27-2** `dpkg-reconfigure keyboard-configuration`\
  \ 命令\n\n## 可能会出现什么问题？\n\n使用 `dpkg-reconfigure` 命令时要小心，因为你可能会“毁掉”一个花费了大量精力精调的配置。\n\
  \n# 从 Debian 软件包中提取文件\n\n回想第 26 章，你可以从 RPM 软件包中提取文件而无需在系统中安装该软件包。这对于探索软件包文件（寻找恶意代码）以及替换缺失或损坏的系统文件非常有用。\n\
  \n在基于 Debian 的系统中执行此任务的技术是使用 `dpkg` 命令的 `-x` 选项：\n\n点击此处查看代码\n\n```\nroot@onecoursesource:~#\
  \ mkdir /tmp/joe_files\nroot@onecoursesource:~# dpkg -x /tmp/joe_3.7-2.3ubuntu1_amd64.deb\n\
  /tmp/joe_files\nroot@onecoursesource:~# ls /tmp/joe_files\netc  usr\nroot@onecoursesource:~#\
  \ ls /tmp/joe_files/etc\njoe\nroot@onecoursesource:~# ls /tmp/joe_files/etc/joe\n\
  ftyperc  jicerc.ru  jmacsrc  joerc  jpicorc  jstarrc  rjoer\n```\n\n### 安全要点\n\n\
  由于 `-x` 是 `dpkg` 命令的一个选项，因此总是担心你在尝试提取软件包文件时不小心漏掉它。这将导致安装软件包，如果软件包包含恶意软件，可能会导致严重问题。\n\
  \n# 使用 dpkg 命令移除软件包\n\n在基于 Debian 的系统中移除软件包有两种方法：\n\n*   `dpkg -r pkg_name`：此方法移除软件包，但在系统上保留其配置文件。\n\
  *   `dpkg –P pkg_name`：此方法移除软件包，包括该软件包的所有配置文件。\n\n示例 27-6 展示了使用 `dpkg -r`。\n\n**示例\
  \ 27-6** 移除软件包 `dpkg -r`\n\n点击此处查看代码\n\n```\nroot@onecoursesource:~# dpkg -r joe\n\
  (Reading database ... 177428 files and directories currently installed.)\nRemoving\
  \ package joe (3.7-2.3ubuntu1)...\nProcessing triggers for man-db (2.6.7.1-1ubuntu1)\
  \ ...\n```\n\n对比示例 27-7 在使用 `-P` 选项时的 `ls` 输出。\n\n**示例 27-7** 移除软件包 `dpkg -P`\n\n\
  点击此处查看代码\n\n```\nroot@onecoursesource:~# dpkg -P joe\n(Reading database ... 177428\
  \ files and directories currently installed.)\nRemoving package joe (3.7-2.3ubuntu1)...\n\
  update-alternatives: using /usr/bin/joe to provide /usr/bin/editor (editor) in auto\
  \ mode\nProcessing triggers for man-db (2.6.7.1-1ubuntu1) ...\nPurging configuration\
  \ files for joe (3.7-2.3ubuntu1) ...\n```\n\n`/etc/joe`（joe 软件包配置位置）的缺失表明这些文件已被移除。\n\
  \n## 对话式学习——使用 ping\n\n**Gary**: 你好，Julia。我刚刚学习了 `dpkg` 命令的 `-r` 和 `-P` 选项，我有一个问题。\n\
  \n**Julia**: 尽管问吧！\n\n**Gary**: 我正在尝试理解为什么要用其中一个选项而不是另一个。\n\n**Julia**: 啊，这个，使用\
  \ `-r` 选项的优势是，对配置文件所做的任何自定义在以后重新安装软件包时仍然可用。\n\n**Gary**: 所以，如果我想以后会再次安装软件包并想使用之前的配置，我应该使用\
  \ `-r` 选项，对吗？你能给我举个例子吗？\n\n**Julia**: 当然。假设你有一个完全配置好的服务器，但你现在想移除该软件。你花费了很长时间来配置那个\
  \ Web 服务器，你不想再次做这些工作，也不尝试从备份中恢复配置。\n\n**Gary**: 好的，那么为什么要用 `-P` 选项呢？\n\n...\n\n\
  # 使用 APT 管理软件包\n\n高级软件包工具 (APT) 是一系列命令，提供了与 Red Hat 系统的 `yum` 或 `dnf` 相同的功能。APT\
  \ 包含了许多工具，但以下是主要的几个：\n\n*   `apt`: 该实用程序用于大多数基本的软件包管理命令。\n\n\n\n\n\n*   `apt-get`:\
  \ 该实用工具为更高级的软件包管理提供了额外功能。\n*   `apt-cache`: 该实用工具为更高级的操作和软件包查询提供了额外功能。\n\n### APT\
  \ 仓库\n\n与 `yum` 和 `dnf` 命令一样，APT 命令利用存储库，从那里可以下载软件包。这些存储库在 APT 中被称为 *源]*，它们可以存放在本地驱动器（如\
  \ CD-ROM、USB 驱动器等）上，也可以通过网络提供。\n\n要配置系统访问 APT 源，你可以编辑 `/etc/apt/sources.list` 文件或位于\
  \ `/etc/apt/sources.list.d` 目录下的文件。在某些发行版中，`/etc/apt/sources.list` 文件的使用已被弃用，取而代之的是\
  \ `/etc/apt/sources.list.d` 目录中的文件。在这些系统上，`/etc/apt/sources.list` 文件可能根本不存在，或者是一个空文件。\n\
  \n在具有 `/etc/apt/sources.list` 文件的系统上，它通常是一个文档详尽的配置文件。每行定义一个源。示例 27-8 显示了一些典型的条目（注意，通过\
  \ `grep` 命令删除了空行和注释行）。\n\n**示例 27-8** `/etc/apt/sources.list`\n\n点击此处查看代码图像\n\n\
  ```\nroot@onecoursesource:~# grep -v \"^$\" /etc/apt/sources.list | grep -v \"^#\"\
  \ | head\ndeb http://us.archive.ubuntu.com/ubuntu/ trusty main restricted\ndeb-src\
  \ http://us.archive.ubuntu.com/ubuntu/ trusty main restricted\ndeb http://us.archive.ubuntu.com/ubuntu/\
  \ trusty-updates main restricted\ndeb-src http://us.archive.ubuntu.com/ubuntu/ trusty-updates\
  \ main restricted\ndeb http://us.archive.ubuntu.com/ubuntu/ trusty universe\ndeb-src\
  \ http://us.archive.ubuntu.com/ubuntu/ trusty universe\ndeb http://us.archive.ubuntu.com/ubuntu/\
  \ trusty-updates universe\ndeb-src http://us.archive.ubuntu.com/ubuntu/ trusty-updates\
  \ universe\ndeb http://us.archive.ubuntu.com/ubuntu/ trusty multiverse\ndeb-src\
  \ http://us.archive.ubuntu.com/ubuntu/ trusty multiverse\n```\n\n图 27-3 显示了 APT\
  \ 源配置文件的典型数据字段。\n\n![Image](img/27fig03.jpg)\n\n**图 27-3** APT 源配置文件的字段\n\nAPT 源配置文件的字段在\
  \ 表 27-1 中进行了更详细的描述。\n\n**表 27-1** APT 配置字段描述\n\n| 字段 | 描述 |\n| --- | --- |\n| 类型\
  \ (Type) | 该字段指示此源仓库中的软件包是普通软件包（可以安装的软件包，由“deb”定义）还是源软件包（可以下载以查看源代码的软件包，由“deb-src”定义）。\
  \ |\n| 源位置 (Source location) | 源的 URI（统一资源标识符)。这可以是一个网络位置（例如通过 Web 服务器共享），也可以是一个本地资源（例如放置在本地硬盘器上）。\
  \ |\n| 发行版 (Suite) | 每个源 URI 都可以有多个存储库，位于不同的目录中。suite 的值是存储软件包文件的 URL 下的子目录。 |\n\
  | 组件 (Component) | 指明在该源上发现了什么种的软件包。有四种常用的组件：**Main (主)**：由发行版官方支持并应该是开源的。**Restricted\
  \ (受限)**：由发行版官方支持但是闭源软件。**Universe (宇宙)**：由社区支持和维护，但应该是开源的。**Multiverse (多重宇宙)**：社区或发行版不支持。可能是闭源软件，还可能涉及版权和专利问题。\
  \ |\n\n图 27-3 和 表 27-1 中描述的 APT 源配置文件使用名为“单行”的样式。某些发行版使用一种名为 DEB822 的较新样式。该样式的格式如下：\n\
  \n点击此处查看代码图像\n\n```\nTypes: deb deb-src\nURIs: uri\nSuites: suite\nComponents: [component1]\
  \ [component2] [...]\noption1: value1\noption2: value2\n```\n\n结果，在图 27-3 中用单行样式描述的示例可以使用以下方式用\
  \ DEB822 样式编写：\n\n点击此处查看代码图像\n\n```\nTypes: deb\nURIs: http://us.archive.ubuntu.com/ubuntu/\n\
  Suites: trusty\nComponents: main restricted\n```\n\n两种样式可以使用多个不同的选项。例如，你可以使用以下 DEB822\
  \ 样式为源指定软件包的架构：\n\n点击此处查看代码图像\n\n```\nTypes: deb\nURIs: http://us.archive.ubuntu.com/ubuntu/\n\
  Suites: trusty\nComponents: main\n```\n\n更多信息请查阅 `sources.list` 手册。\n\n### 创建源\n\
  \n以下步骤描述了如何创建一个源：\n\n1. 安装 `dpkg-dev` 软件包（如果尚未安装）。`apt-get install dpkg-dev`。\n\
  2. 创建目录。`mkdir`。\n3. 将软件包拷贝到 `/var/cache/apt`（这是该位置）。\n4. 运行以下命令：`dpkg-scanpackages\
  \ . /dev/null`。\n\n### 使用 APT 命令列出软件包信息\n\n要列出所有软件包，请使用 `apt list` 命令，如示例 27-9 所示。\n\
  \n**示例 27-9** `apt list` 命令\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# apt list\
  \ | head\n\nWARNING: apt 还没有稳定的 CLI 界面。在脚本中使用请小心。\n列出中...\n0ad/trusty 0.15+dfsg-3\
  \ amd64\n0ad-data/trusty 0.15-1 all\n0ad-data-common/trusty 0.15-1 all\n0ad-dbg/trusty\
  \ 0.15+dfsg-3 amd64\n0xffff/trusty 0.6~20130406-1 amd64\n2ping/trusty 2.0-1 all\n\
  2vcard/trusty 0.5-3 all\n3270-common/trusty 3.3.10ga4-22 amd64\n389-admin/trusty\
  \ 1.1.35-0ubuntu1 amd64\n```\n\n`apt list` 命令有两个关键选项：\n\n*   `--installed`：显示已安装的软件包\n\
  *   `--upgradable`：显示有新版本的安装软件包\n\n`apt` 命令也支持使用搜索词列软件包。然而，更强大的搜索方法是使用 `apt-cache`\
  \ 命令，它提供了使用正则表达式搜索软件包的方法：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource:~# apt-cache\
  \ search \"^joe\"\njoe - user friendly full screen text editor\njoe-jupp - reimplement\
  \ the joe Debian package using jupp\nscheme2c - Joel Bartlett's fabled Scheme->C\
  \ system\n```\n\n考虑使用 `apt` 命令进行简单的软件包列出，使用 `apt-cache` 命令进行更复杂的软件包列出。\n\n要显示特定软件包的信息，请使用\
  \ `apt show` 命令，如示例 27-10 所示。\n\n**示例 27-10** 使用 `apt show` 列出软件包信息\n\n点击此处查看代码图像\n\
  \n\n\n\n#### 使用 APT 命令安装软件包\n\n`apt install` 命令将从源安装软件包，如 示例 27-12 所示。\n\n### 示例\
  \ 27-12 `apt install` 命令\n\n点击此处查看代码\n\n```\nroot@onecoursesource:~# apt install\
  \ joe\n读取列表... 完成\n正在构建依赖树\n读取状态信息... 完成\n将安装下列软件包：\n  joe\n0 个升级，1 个新安装，0 个将移除，587\
