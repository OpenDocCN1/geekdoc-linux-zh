  \     A       202.12.27.33\nm.root-servers.net.    3600000 IN      AAAA    2001:dc3::35\n\
  ```\n\n请参见图 20-1 查看上述查询的演示。\n\n![Image](img/20fig01.jpg)\n\n**图 20-1** *查询根 DNS\
  \ 服务器*\n\n这些根服务器知道顶级域（如 .com、.edu 等）的 DNS 服务器。尽管它们并不知道 `www.onecoursesource.com`\
  \ 域名，但它们能够将查询导向负责“.com”域名的 DNS 服务器，如图 20-2 所示。\n\n![Image](img/20fig02.jpg)\n\n\
  **图 20-2** *查询“.com” DNS 服务器*\n\n“.com” DNS 服务器同样不知道 `www.onecoursesource.com` 域名，但它们知道哪些\
  \ DNS 服务器负责 `onecoursesource.com` 域名。查询被传递给负责 `onecoursesource.com` 域名的 DNS 服务器，该服务器随后返回了\
  \ `www.onecoursesource.com` 域名的 IP 地址（参见图 20-3）。\n\n![Image](img/20fig03.jpg)\n\n\
  **图 20-3** *查询“onecoursesrouce.com” DNS 服务器*\n\n### 基础 BIND 配置\n\n配置 BIND 涉及许多组件。你将配置哪些组件取决于多个因素，例如\
  \ BIND 服务器的类型（缓存、转发器或权威）以及你希望 BIND 服务器具备哪些功能（例如安全功能）。\n\n本章重点是基础配置文件。\n\n#### `/etc/named.conf`\
  \ 文件\n\nBIND 服务器的主配置文件是 `/etc/named.conf` 文件。该文件在 BIND 服务器（称为 `named`）启动时被读取。参见示例\
  \ 20-2 获取 `/etc/named.conf` 示例文件。\n\n**示例 20-2** *`/etc/named.conf` 文件*\n\n```\n\
  //\n// named.conf\n// 由 Red Hat 提供，用于配置 ISC named(8)\n// 服务器仅作为缓存。\n// 参见 /usr/share/doc/bind*/sample/\
  \ 获取示例文件。\n//\n\noptions {\n        listen-on port 53 { 127.0.0.1; };\n        listen-on-v6\
  \ port 53 { ::1; };\n        directory       \"/var/named\";\n        dump-file\
  \       \"/var/named/cache_dump.db\";\n        statistics-file \"/var/named/named_stats.txt\"\
  ;\n        memstatistics-file \"/var/named/mem_stats.txt\";\n        allow-query\
  \     { localhost; };\n\n        /*\n         - 如果你正在构建权威 DNS 服务器，请勿启用递归。\n    \
  \     - 如果你正在构建递归（缓存）DNS 服务器，你需要启用\n           递归查询。\n         - 如果你的递归 DNS 服务器具有公网\
  \ IP 地址，你必须对\n           合法用户启用访问控制。在你的网络中实施 BCP38\n           将极大减少攻击面\n      \
  \  */\n        recursion yes;\n\n        dnssec-enable yes;\n        dnssec-validation\
  \ yes;\n        dnssec-lookside auto;\n\n        /* ISC DLV 密钥路径 */\n        bindkeys-file\
  \ \"/etc/named.islv.key\";\n\n        managed-keys-directory \"/var/named/dynamic\"\
  ;\n\n        pid-file \"/run/named/named.pid\";\n        session-keyfile \"/run/named/session.key\"\
  ;\n};\n\nlogging {\n        channel default_debug {\n                file \"data/named.run\"\
  ;\n                severity dynamic;\n        };\n};\n\nzone \".\" IN {\n      \
  \  type hint;\n        file \"named.ca\";\n};\n\ninclude \"/etc/named.rfc1912.zones\"\
  ;\ninclude \"/etc/named.root.key\";\n```\n\n不要被这些设置吓到！一旦你理解了 DNS 服务器的工作原理，大多数设置都非常直观。\n\
  \n重要的是，示例 20-2](#ch20.xhtml_exa20_2)中提供的配置是针对缓存服务器的（回顾该术语在本章前面已定义）。当你安装 BIND 包时，提供的默认配置文件是缓存服务器的。这实际上非常方便，因为它使得配置缓存服务器变得非常简单：只需安装\
  \ BIND 服务器包并启动它即可。\n\n\n\n\n查看表 20-1 以了解示例 20-1 中显示的文件中 `options` 部分的各种设置。`options`\
  \ 部分用于为 DNS 服务器提供通用设置。\n\n**表 20-1 `default /etc/named.conf` 文件中的设置**\n\n| 设置 |\
  \ 含义 |\n| --- | --- |\n| `listen-on` | 这包含 BIND 服务器将“监听”的端口号和接口。例如，示例 20-2 中的值为\
  \ `port 53 { 127.0.0.1; };`，这意味着“在 IP 地址为 127.0.0.1 的接口上对发往端口 53 的入入请求进行监听”。这意味着服务器只监听来自本地机器的请求。假设主网卡的\
  \ IP 地址为 `192.168.1.1\\.`。要让 BIND 服务器监听该接口上的请求（换句话说，监听该接口所在的网络），请将 `listen-on` 值调整为：`listen-on\
  \ port 53 { 127.0.0.1; 192.168.1.1; };`。你也可以指定多个 `listen-on` 语句，如果你想为另一个接口监听不同的端口号，这将非常有用。注释掉此指令将导致服务在所有接口上监听\
  \ 53 端口。 |\n| `listen-on-v6` | 与 `listen-on` 设置的概念相同，但 `listen-on` 用于 IPv4 地址，而此设置用于\
  \ IPv6 地址。 |\n| `directory` | 服务器的“工作目录”。这是可以找到额外信息（包括区域文件）的位置。在大多数情况下，这应该是 `/var/named`\
  \ 目录。然而，如果你在“chroot 监狱监狱”中运行 DNS 服务器，它将被设置为不同的目录，这是本章稍后将讨论的话题。 |\n| `allow-query`\
  \ | `listen-on` 指定了监听入入请求的端口和接口，而 `allow-query` 设置指示了 BIND 服务器将响应的系统。关于此设置的更多信息可以在本章稍后找到。\
  \ |\n| `recursion` | 如果此设置为 `yes`，则 DNS 服务器将尝试通过执行所有必要的 DNS 查询来查找答案。如果此设置为 `no`，则\
  \ DNS 服务器将带有引导数据（基本上是下一个查询哪个 DNS 服务器）进行响应。 |\n| `dnssec-enable` | 当设置为 `yes` 时，此设置启用\
  \ DNSSEC（域名系统安全扩展）。DNSSEC 的主要目的是提供一种验证 DNS 数据的手段。本章稍后将详细介绍 DNSSEC。 |\n| `dnssec-validation`\
  \ | 当设置为 `yes` 时，此设置将使用“受信任”或“托管”密钥。 |\n| `dnssec-lookaside` | 当设置为 `auto` 时，此设置将使用\
  \ `bindkeys-file` 设置中定义的替代信任密钥库（通常是由 dlv.isc.org 托管的库）。 |\n| `bindkeys-file` | 当\
  \ `dnssec-lookaside` 设置为 `auto` 时使用的文件。 |\n| `managed-keys-directory` | 此设置指示了用于存储\
  \ DNSSEC 受信任密钥列表的目录。 |\n| `pid-file` | DNS 服务器的进程 ID 存储在此文件中。 |\n| `session-keyfile`\
  \ | 此设置包含存储 TSIG 会话密钥的文件名。TSIG（事务签名）用于允许对 DNS 数据库进行身份验证更新。`nsupdate` 命令使用 TSIG 密钥允许这些经过验证的\
  \ DNS 数据库更新。本章稍后将介绍 TSIG。 |\n\n#### allow-query 设置\n\n在某些情况下，你可能希望限制哪些系统可以查询你的 DNS\
  \ 服务器。实现此点的方法之一是使用 `/etc/named.conf` 文件中的 `allow-query` 设置。`allow-query`接受接受为 `{\
  \ address_match_list; address_match_list; ...};` 的参数，其中 `address_match_list` 可以是以下之一：\n\
  \n*   一个 IPv4 或 IPv6 地址。\n*   格式为 `192.168.100/24` 或 `2001:cdba:9abc:5678::/64`\
  \ 的网络。\n*   ACL，即分配给多个 IP 地址或网络的别名。\n*   预定义地址。提供四种选项：`none` 不匹配任何 IP 地址，`any` 匹配所有\
  \ IP 地址，`localhost` 匹配 DNS 服务器自身的 IP 地址，`localnets` 匹配 DNS 服务器所在网络上的所有 IP 地址。\n\n\
  你也可以使用 `!` 字符来反转上述值之一。例如，`!192.168.100.1` 意味着*不是* `192.168.100.1\\.`。当你想要从网络中排除\
  \ IP 地址时，这非常有用。例如，以下将允许来自 `192.168.100/24` 网络中每台机器的传输，但 IP 地址为 `192.168.100.1` 的机器：\n\
  \n点击此处查看代码\n\n\n\n\n在本章之前的内容中，你通过修改 `/etc/named.conf` 文件学习了 BIND 的基础配置。该文件中的设置之一\
  \ `directory` 设置用于指示额外配置文件的位置，如下所示：\n\n点击此处查看代码图像\n\n```\n[root@onesourcesource\
  \ ~]#grep \"directory\" /etc/named.conf\n        directory       \"/var/named\"\
  ;\n```\n\n在标准的 BINDset 中，区域文件（zone files）存储在 `/var/named` 目录。这些区域文件用于定义主机到 IP 地址的转换，以及关于\
  \ DNS 域的额外信息。\n\n在本节中，你将学习如何为一个或多个域的权威型 DNS 服务器配置这些区域文件。你将学习这些区域文件的语法，以及如何在区域文件中创建和管理资源记录。\n\
  \n## 区域文件基础\n\n默认情况下，你应该在 `/var/named` 目录中看到两个区域文件：\n\n* `/var/named/named.ca`：此文件包含根服务器列表。在大多数情况下，你不应该直接修改此文件。如果添加了更多根服务器（罕见事件），BIND\
  \ 软件的未来更新将更新 `/var/named/named.ca` 文件。\n* `/var/named/named.localhost`：此文件定义本地主机。它也很少被修改，因为它只用于定义单个主机。示例\
  \ 20-3 显示了一个典型的 `/var/named/named.localhost` 文件。\n\n**示例 20-3** 示例 `/var/named/named.localhost`\
  \ 文件\n\n点击此处查看代码图像\n\n```\n[root@onesourcesource ~]#more /var/named/named.localhost\n\
  $TTL 1D\n@       IN SOA  ns.onecoursesource.com. root.onecoursesource.com. (\n \
  \                                       0       ; serial\n                     \
  \                   1D      ; refresh\n                                        1H\
  \      ; retry\n                                        1W      ; expire\n     \
  \                                   3H )    ; minimum\n        NS      ns.onecoursesource.com\n\
  \        A       127.0.0.1\n        AAAA    ::1\n```\n\n你在示例 20-3 中看到的每个设置将在本章后面的部分进行更详细介绍。\n\
  \n## /etc/named.conf 文件中的区域条目\n\n要使用区域文件，你需要在 `/etc/named.conf` 文件中创建条目。如果区域更改是在本地机器上创建的，你需要创建一个如下的条目：\n\
  \n点击此处查看代码图像\n\n```\nzone \"onecoursesource.com\" {\ntype master;\nfile \"named.onecoursesource.com\"\
  ;\n};\n```\n\n这定义了一个正向区域文件，可用于将域名转换为 IP 地址。类型 `master` 标识该机器是对区域文件进行更改的机器。`file`\
  \ 设置指定了包含区域信息的文件位置，该位置相对于之前的 `directory` 设置（`/var/named`）。\n\n通常，你会设置另一台 DNS 服务器，它包含一个从主服务器获取的区域文件副本，该过程被称为区域传输。要设置这台备用\
  \ DNS 服务器（DNS *从* 服务器），请在另一台备用机器的 `/etc/named.conf` 文件中放置以下条目：\n\n点击此处查看代码图像\n\n\
  ```\nzone \"onecoursesource.com\" {\ntype slave;\nfile \"named.onecoursesource.com\"\
  ;\nmasters { 38.89.136.109; }\n};\n```\n\n同时拥有主服务器和从服务器的优势是，可以在不同机器之间分散查询负载。另一个优势是，如果一台服务器不可用，会有另一台服务器可以响应查询。\n\
  \n*主名称服务器*（master name server）、*从名称服务器*（slave name server）和权威名称服务器（authoritative\
  \ name server）这些术语可能会有点让人困惑：\n\n* 主名称服务器是你直接更改区域文件的系统。\n* 从名称服务器是持有主名称服务器区域文件副本的系统。\n\
  * 权威名称服务器是有权响应 DNS 查询的名称服务器。这包括主名称服务器和从名称服务器。\n\n虽然不是强制要求的，但你可能想要定义反向查找区域。通过反向查找区域，查询提供\
  \ IP 地址，DNS 服务器返回域名。要创建反向查找区域，你首先需要在 `/etc/named.conf` 文件中创建一个如下的条目：\n\n点击此处查看代码图像\n\
  \n```\nzone    \"136.89.38.in-addr.arpa\" {\ntype   master;\nfile   \"db.38.89.136\"\
  ;\n};\n```\n\n### 安全要点\n\n虽然你不被要求提供反向查找，但你应该意识到，不创建反向查找可能会破坏某些网络服务。其中一些服务通过执行正向查找然后执行反向查找来验证主机名和\
  \ IP 地址，以确保值在“两个方向”上致的。因此，如果没有反向查找区域文件，这些网络服务在执行此安全检查时将返回失败。\n\n注意区域定义的格式：`136.89.38.in-addr.arpa`。这是反转的网络地址（字节），并在末尾添加了\
  \ `in-addr.arpa`。与正向查找区域文件一样，你应该定义一个主 DNS 服务器，并可选定义额外的从 DNS 服务器。\n\n之前描述的 `/etc/named.conf`\
  \ 区域条目是你需要的最小设置。表 20-2 描述了在设置区域文件条目时应该考虑的额外设置。\n\n**表 20-2** /etc/named.conf 文件中的区域设置\n\
  \n| 设置 | 描述 |\n| --- | --- |\n| allow-query | 与 `options` 部分中的 `allow-query` 条目一样，但区域设置中的\
  \ `allow-query` 仅适用于此特定区域。 |\n| allow-transfer | 如果你计划拥有从 DNS 服务器，此设置非常。你可以通过在主\
  \ DNS 的 `/etc/named.conf` 区域设置中创建此条目，限制哪些 DNS 服务器可以传输整个区域文件。 |\n| allow-update |\
  \ 如果你决定实现名为动态 DNS 的 DNS 功能，则非常有用；此功能允许 DHCP 服务器更新主 DNS 区域文件中的记录。`allow-update` 设置允许指定哪些\
  \ IP 地址可以更新它们的域名。 |\n\n## 区域文件语法\n\n区域文件（你放在 `/var/named` 目录中的文件）的语法必须正确；否则 DNS\
  \ 服务器将无法正常加载区域文件。大多数情况下，最好复制现有的区域文件并对其进行修改以适应你的需求。简单的互联网搜索就能许多示例区域文件。\n\n在创建区域文件时需要考虑以下几点：\n\
  \n* 注释行以分号（`;`）字符开头并持续到行尾。\n* 每行定义一条记录，在大多数情况下，行尾就是记录的结束。在某些情况下，记录可以跨越多行（参见本章后面的\
  \ SOA 示例）。\n* 每条记录由由空格或制表符（空白字符）分隔的数据字段组成。这些字段定义为 `name`、`ttl`、`record class`（记录类）、`record\
  \ type`（记录类型）和 `record data`（记录数据）。每个字段在表 20-3 中都有更详细描述。\n\n**表 20-3** 区域文件记录字段\n\
  \n| 字段 | 描述 |\n| --- | --- |\n| name | 与此记录关联的域名。 |\n\n\n\n\n\n| `ttl` | 记录的生存时间。这是该记录在存储于缓存名称服务器（或网络浏览器等客户端程序）上时被认为有效的持续时间。在此时间段之后，客户端应从本地缓存中删除该记录。注意，此字段可以省略。如果记录省略了此字段，将使用区域文件的默认值。该默认值由\
  \ `$TTL` 指令定义（例如 `$TTL 1D`）。 |\n| `record class` | 这是一个预定义值，最常用的是 `IN`（代表 Internet）。虽然有几个认可的类，但你几乎总是会使用\
  \ `IN` 记录类。 |\n| `record type` | 记录的类型。有很多可用类型，将在本章稍后部分定义。 |\n| `record data` |\
  \ 记录数据取决于记录类型。根据记录类型，它可以是一个单值，也可以一组值。这些数据的示例将在本章稍后部分进行描述。 |\n\n- 字符` 字符在区域文件中具有特殊含义。它意味着“当前源”，指的是当前域名。因此，在\
  \ `onecoursesource.com` 域名的正向区域文件中，`@` 字符意味着 `onecoursesource.com`。（注意末尾的点字符，这在区域文件中是要求的。）你可以通过使用\
  \ `$ORIGIN` 设置来更改 `@` 字符的含义（例如 `$ORIGIN example.com.`）。\n\n- 每个区域文件都应该以 `$TTL` 设置开头，用于设置默认生存时间（TTL）。TTL\
  \ 是缓存 DNS 服务器存储来自此 DNS 服务器信息的时间长度。此默认 TTL 可以被单个记录覆盖；请参见表 20-3 中的 `ttl` 字段。\n\n-\
  \ 当区域文件中给出时间值时，默认时间单位是秒。例如，`$TTL 86400` 条目将默认生存时间设置为 86,400 秒（等同于一天）。你可以指定分钟（例如\
  \ `30m`）、小时（`1h`）、天（`1d`）或周（`1w`）为单位的时间值。此选项不区分大小写（稍后的示例使用大写字母，这是我们通常使用的格式），你甚至可以组合值（例如\
  \ `1h30m`）。\n\n**注意**：在区域文件中使用 FQDN（完全限定域名）时，务必包含末尾的点字符（`onecoursesource.com.` 结尾的句号）。相对域名不需要末尾的点，因为它们会被前加在\
  \ `$ORIGIN` 的值之前。\n\n## 区域记录类型\n\n尽管有几十种可能的记录类型，但你不需要了解每一种。在本节中，将学习区域文件中常用的区域记录类型。\n\
  \n### SOA 记录类型\n\nSOA（起始起始）记录类型用于定义关于该区域的权威信息（可以将其想象成该区域的操作指南）。典型的 SOA 记录类型如下：\n\
  \n```\n@ IN SOA ns.onecoursesource.com. root.onecoursesource.com. ( 0 ; serial 1D\
  \ ; refresh 1H ; retry 1W ; expire 3H )\n```\n\n括号允许你将数据跨多行分布，并为每个数据值提供注释。虽然为了方便阅读但这并不是强制要求的。你可能会看到单行格式的记录：\n\
  \n```\n@ IN SOA ns.onecoursesource.com. root.onecoursesource.com. 0 1D 1H 1W 3H\n\
  ```\n\n在 `name` 字段中，应提供整个域名的名称。记住快捷值 `@` 代表当前域名，该域名由 `/etc/named.conf` 文件中的 `zone`\
  \ 条目决定的。通常，通过省略 `ttl` 字段将其设置为默认值。几乎总是使用 `IN` 类，且记录类型被设置为 `SOA`。记录数据字段包含七个值，如表 20-4\
  \ 所示。\n\n#### 表 20-4 SOA 记录数据\n\n| 数据 |  |\n| --- | --- |\n| 名称服务器 | 这是主名称服务器的域名。例如：`ns.onecoursesource.com.`\
  \ |\n| 电子邮件地址 | 该域名的 DNS 管理员的电子邮件地址。不再使用 `@` 来分隔用户名和域名，而是使用 `.` 字符。例如，`root.onecoursesource.com.`\
  \ 等同于 `root@onecoursesource.com`。 |\n| 序列号 | 如果有从服务器，这个数字非常重要，因为该值用于判断是否应启动区域传输。从服务器会定期查询主服务器以确定序列号已更新。例如，假设当前序列号为\
  \ `100` 且主服务器上的区域文件被修改了。执行修改的管理员应将序列号至少增加 1（例如 `101`）。然后从服务器就知道了发生了更改，并通过一个名为*区域传输*（zone\
  \ transfer）的过程向主服务器请求这些更改。序列号限制为共 10 位数字。然而，这允许你使用始终产生递增数字的格式，同时记录区域文件最后一次修改的时间：`YEARmonthrev`。`YEAR`\
  \ 是四位年份，`month` 是两位月份，`DAY` 是两位日期，而 `rev` 是该特定当天文件的版本。例如，2017 年 1 月 31 日的第一次区域文件更改序列号为\
  \ `2017013100`。这允许从 2017 年直到 9999 年 12 月 31 日，每天可以进行多达 100 次区域文件更新。如果你好奇每天需要更新区域文件超过\
  \ 100 次会发生什么，你真的应该考虑你是如何管理区域文件的。每天更新区域文件超过几次是非常罕见的。如果你在好奇 10,000 年会发生什么，我们建议那很可能是别人的问题了！\
  \ |\n| 刷新 (Refresh) | 从服务器多久查询主服务器以确定序列值是否更改？刷新值为从服务器提供了这些信息。通常使用像 `1D` 这样的值告诉从服务器每\
  \ 24 小时检查一次；但在区域文件频繁变化的域中，你可能选择 `1H` 或 `6H` 等值，让从服务器分别每小时或六小时查询一次主服务器。 |\n| 重试 (Retry)\
  \ | 假设刷新设置为 `1D`，且从服务器尝试查询主服务器更新。如果主服务器没有响应，则检查重试值。重试值是 DNS 从服务器在再次尝试查询 DNS 主服务器之前等待的时间。例如，`1H`\
  \ 值可以让从服务器等待一小时，然后再次尝试查询主服务器。 |\n| 过期 (Expiry) | 如果主服务器持续无法访问，使用过期值来确定从服务器何时应停止响应\
  \ DNS 客户端请求。这里的想法是，由于 DNS 主服务器已经长时间没有响应，DNS 条目可能不再有效。通常这设置为一周或两周。 |\n\n\n\n\n\n\
  | Minimum | 这一项比较棘手；考虑以下情况：你的公司有一台缓存服务器，你尝试解析域名 `test.onecoursesource.com`。这是一台新机器，其\
  \ DNS 记录尚未主 DNS 服务器上更新，因此你的缓存服务器收到了“无此类主机（no such host）”的响应。由于它是缓存服务器，它会将此存储在缓存中。但应该存储多久呢？记住，默认的生存时间（TTL）通常设置为一天，这对于缓存负向\
  \ DNS 响应来说时间太长了。一旦这个新域名被添加到主 DNS 服务器上，你不希望你的缓存服务器在接下来的 24 小时内继续提供“无此类主机”的响应。最小设置用于提供缓存负向\
  \ DNS 响应的时间长度。如果你的域名更新频繁，你希望这个值是一个低值（可能是 `1h` 或更短）。如果你的域名很少更改，你希望这个值是一个高值（但可能不会高于\
  \ `1d`）。 |\n\n## 地址记录类型 (The Address Record Type)\n\n地址记录用于定义从域名到 IP 地址的转换。一个典型的例子如下：\n\
  \n点击此处查看代码图像\n\n```\nwww          IN     A     38.89.136.109\n```\n\n第一个字段是域名（例如，`www`）。在这种情况下，域名是相对于由\
  \ `$ORIGIN` 定义的默认域提供的，但也可以以完全限定域名提供：\n\n点击此处查看代码图像\n\n```\nwww.onecoursesource.com.\
  \         INA38.89.136.109\n```\n\n`A` 的值表示此行代表一个地址记录类型，而 `38.89.136.109` 的值与 `www.onecoursesource.com.`\
  \ 域名相关的 IP 地址。\n\n注意，地址记录仅放置正向查找区域文件中。\n\n## 规范别名类型 (The Canonical Name Type)\n\n\
  在某些情况下，你域名中的一个主机可能提供多个角色，因此应该能够通过多个域名访问。例如，`onecoursesource.com` 的 Web 服务器可能兼任 FTP\
  \ 服务器，因此，让这个单一系统可以通过 `www.onecoursesource.com` 或 `ftp.onecoursesource.com` 访问是有意义的。\n\
  \n然而，每个 IP 地址应该只有一个地址记录。因此，为了允许多个域名翻译到单个 IP 地址，请使用规范记录（canonical records）。规范记录（也称为\
  \ `cname`）就像一个昵号，通常如下所示代码段中的第二条记录：\n\n点击此处查看代码图像\n\n```\nwww.onecoursesource.com.\
  \         IN     A     38.89.136.109\nftp                                      \
  \              IN     CNAME     www\n```\n\n有了这样的条目，域名 `ftp.onecoursesource.com`\
  \ 将被翻译为域名 `www.onecoursesource.com`，然后进一步翻译为 IP 地址 `38.89.136.109`。\n\n## 名称服务器记录类型\
  \ (The Name Server Record Type)\n\n如所述，每个域名可以有一个或多个名称服务器；这些可以通过 `NS` 记录定义。主（或主从）名称服务器在\
  \ `SOA` 记录中指定，但也需要有一个 `NS` 记录。额外的（从或备用）名称服务器也需要用 `NS` 记录定义。你可以通过创建如下记录来定义名称服务器：\n\
  \n点击此处查看代码图像\n\n```\n@     INNSns.sample.com.\n@     IN     NSns2.sample.com.\n\
  ```\n\n你所有的名称服务器都应该有一个 `NS` 条目，即使是主服务器也是如此。此外，`NS` 条目数据指定的是域名而不是 IP 地址，因此为每个名称服务器准备一个地址记录也是重要的。\n\
  \n注意，NS 示例中的 `@` 字符可以完全删除。如果省略数据的第一个字段，则假设其为 `$ORIGIN` 的值。\n\n## 邮件交换记录类型 (The Mail\
  \ eXchange Record Type)\n\n假设有一封邮件发送到 `info@onecoursesource.com`。发送域的 MTA（邮件传输代理）需要能够确定哪台机器处理\
  \ `onecoursesource.com` 域的入站邮件。MTA 通过查询域名名称服务器的邮件交换（`MX`）记录来实现这一点。\n\n域的 `MX` 记录通常如下：\n\
  \n点击此处查看代码图像\n\n```\n@INMX10mail1.onecoursesource.com\n@INMX20mail2.onecoursesource.com\n\
  ```\n\n一旦你理解了记录类型，大多数 MX 记录现在应该很显易懂了。`10` 和 `20` 的值与你目前看到的不同。这些数字提供了一个优先级值，数字越小，优先级越高。\n\
  \n优先级值经常让管理员感到困惑。如果一台邮件服务器的优先级为 `10`，而另一台的优先级为 `20`，发送域的 MTA 最初会尝试向优先级为 `10` 的服务器发送邮件。如果该服务器没有响应，将联系优先级为\
  \ `20` 的邮件服务器。第二台邮件服务器可能永远不会被使用，因为大多数邮件服务器都是 24/7 小时可用。\n\n更常见的情况为每个邮件服务器设置相同的优先级值以实现负载均衡。在这种情况下，邮件服务器的利用率大致相等（“大致”是因为缓存\
  \ DNS 服务器可能会稍微导致负载平衡）。\n\n只有一个 MX 记录并不罕见，因为许多中小型公司不需要多个邮件服务器来处理入站邮件。\n\n## 指针记录类型\
  \ (The Pointer Record Type)\n\n以前描述的地址记录类型用于正向查找区域文件将域名翻译为 IP 地址。指针（`PTR`）记录类型用于反向查找区域文件，将\
  \ IP 地址翻译为域名。这里是一个典型的指针记录示例：\n\n点击此处查看代码图像\n\n```\n109.136.89.38.in-addr.arpa. IN\
  \ PTR www.onecoursesource.com.\n```\n\n至关重要的一点是，指针类型的 IP 地址是以实际 IP 地址的反向形式给出的，后面跟着\
  \ `in-addr.arpa`。例如，值 `109.136.89.38.in-addr.arpa.` 对应 IP 地址 `38.89.136.109`。\n\n\
  在大多数情况下，你不需要指定这个完全限定 IP 地址名称，因为 `$ORIGIN` 应该设置为当前的反向查找网络域（例如，`.136.89.38.in-addr.arpa.`）。如果是这样，你只需要提供\
  \ IP 地址的主机部分：\n\n点击此处查看代码图像\n\n```\n109 IN PTR www.onecoursesource.com.\n```\n\n\
  ## 整合一切 (Putting It All Together)\n\n从零开始创建一个 DNS 服务器对于初级 DNS 管理员来说来说通常是一项艰巨的任务。当你创建自己的第一台\
  \ DNS 服务器时，请使用 KISS 原则（保持简单，愚蠢如初）。如果你尝试实现许多花哨的 DNS 设置，将很难确定出了什么问题。\n\n当工作不正常时，查看日志文件也是重要的。我们往往对自己的错误视而不见（特别是简单的拼写错误），因此日志文件在确定问题所在方面非常有用。\n\
  \n在关注细节之后，查看大局有时会有帮助。基于此，让我们来看一个简单的 DNS 配置。在这个示例中，我们为 sample.com 域创建必要的文件。由于这只是一个测试域，我们使用了私有\
  \ IP 地址。\n\n首先，请参考示例 20-4 中的 `/etc/named.conf` 文件。注意，为了简洁，该文件已删除了注释。\n\n\n\n\n\n\
  ```\noptions {\n        listen-on port 53 { 127.0.0.1; };\n        listen-on-v6\
  \ port 53 { ::1; };\n        directory       \"/var/named\";\n        dump-file\
  \       \"/var/named/data/cache_dump.db\";\n        statistics-file \"/var/named/data/named_stats.txt\"\
  ;\n        memstatistics-file \"/var/named/data/named_mem_stats.txt\";\n       \
  \ allow-query     { localhost; };\n        recursion yes;\n        dnssec-enable\
  \ yes;\n        dnssec-validation yes;\n        dnssec-lookaside auto;\n       \
  \ bindkeys-file \"/etc/named.iscdlv.key\";\n        pid-file \"/run/named/named.pid\"\
  ;\n        session-keyfile \"/run/named/session.key\";\n};\n\nlogging {\n      \
  \  channel default_debug {\n                file \"data/named.run\";\n         \
  \       severity dynamic;\n        };\n};\n\nzone \".\" IN {\n        type hint;\n\
  \        file \"named.ca\";\n};\n\ninclude \"/etc/named.rfc1912.zones\";\ninclude\
  \ \"/etc/named.root.key\";\n\nzone \"sample.com\" {\ntype master;\nfile \"named.sample.com\"\
  ;\n};\n\nzone    \"1.168.192.in-addr.arpa\" {\n        type   master;\n        file\
  \   \"db.192.168.1\";\n};\n```\n\n根据示例 20-4 中的条目，你应该能够看出了正向和反向查找区域。此外，你还可以确定该系统作为\
  \ `sample.com` 域的主名称服务器，这意味着对区域文件的所有更改都应该在该机器上进行。\n\n如果这是一个从服务器，你将不会创建区域文件，因为这些文件是从主服务器进行第一次区域传输时自动创建的。然而，由于这是主服务器，你需要创建一个正向区域文件，如示例\
  \ 20-5 所示。\n\n**示例 20-5** *`/var/named/named.sample.com` 文件*\n\n点击此处查看代码图像\n\n```\n\
  $TTL 1D\n@       IN SOA  ns.sample.com. root.sample.com. (\n                   \
  \                     0       ; serial\n                                       \
  \ 1D      ; refresh\n                                        1H      ; retry\n \
  \                                       1W      ; expire\n                     \
  \                   3H )    ; minimum\n; Nameservers:\n@    INNSns1.sample.com.\n\
  @    INNSns2.sample.com.\n; Address records:\nwwwINA    192.168.1.100\nns1     \
  \       INA    192.168.1.1\nns2            INA    192.168.1.2\nmail1          INA\
  \    192.168.1.200\nmail2          IN    A    192.168.1.201\ntest           INA\
  \    192.168.1.45\n\n; Aliases:\nftpINCNAMEwww\n\n; MX records\n@        IN    MX\
  \    10    mail1.onecoursesource.com.\n@        INMX20mail2.onecoursesource.com.\n\
  ```\n\n### 可能会出现什么问题？\n\n编辑区域文件时可能会有很多错误。在完成这些更改后，重启你的 BIND 服务器并进行一些简单的测试（可以使用 `dig`\
  \ 命令完成，如本文稍后讨论所示）。\n\n你应该创建一个反向区域文件，这要简单得多，因为你只需要一个 SOA 记录、NS 记录和指针（Pointer）记录（参见示例\
  \ 20-6）。\n\n**示例 20-6** *`/var/named/db.192.168.1` 文件*\n\n点击此处查看代码图像\n\n```\n$TTL\
  \ 1D\n@       IN SOA  ns.sample.com. root.sample.com. (\n                      \
  \                  0       ; serial\n                                        1D\
  \      ; refresh\n                                        1H      ; retry\n    \
  \                                    1W      ; expire\n                        \
  \                3H )    ; minimum\n; Nameservers:\n@    INNSns1.sample.com.\n@\
  \    INNSns2.sample.com.\n; Address records:\nwwwINA    192.168.1.100\nns1     \
  \       INA    192.168.1.1\nns2            INA    192.168.1.2\nmail1          INA\
  \    192.168.1.200\nmail2          IN    A    192.168.1.201\ntest           INA\
  \    192.168.1.45\n\n; Aliases:\nftpINCNAMEwww\n\n; MX records\n@        IN    MX\
  \    10    mail1.onecoursesource.com.\n@        INMX20mail2.onecoursesource.com.\n\
  ```\n\n### 从服务器\n\n本节提供的示例描述了如何设置从服务器。了解设置从服务器的细节超出了测试 `/etc/named.conf` 文件的范范围。\n\
  \n*   向 `/etc/named.conf` 中添加从服务器。\n*   为从服务器设置区域。\n*   修改 `/etc/named.conf` 文件以允许传输。\n\
  \n### 测试 DNS 服务器\n\n在设置好 DNS 配置后，你可以使用 `named-conf` 和 `named-zone` 命令来验证它。\n\n`named-conf`\
  \ 命令用于验证文件的语法。如果没有问题，则不会产生输出。然而，如果有错误，你将收到如下错误消息：\n\n点击此处查看代码图像\n\n```\nroot@onesourcesource\
  \ ~]# named-conf\n/etc/named.conf:12: missing ';' before 'listen-on\n```\n\n上一个示例的错误消息包含了文件名、行号（12）和语法错误。`named-conf`\
  \ 最好的部分可能是它能够感知哪些设置是有效的，哪些无效的。例如，考虑以下命令的输出：\n\n点击此处查看代码图像\n\n```\nroot@onesourcesource\
  \ ~]# named-conf\n/etc/named.conf:12: unknown option 'listen-onv6\n```\n\n`named-zone`\
  \ 命令检查特定区域文件的语法。除了将区域文件指定参数外，你还需要指定区域名称：\n\n点击此处查看代码图像\n\n```\nroot@onesourcesource\
  \ ~]# named-zone sample.com\n/var/named/named.sample.com\nzone sample.com/IN: loaded\
  \ serial 0\nOK\n\nroot@onesourcesource ~]# named-zone 1.168.192.in-addr.arpa\n/var/named/db.192.168.1\n\
  zone 1.168.192.in-addr.arpa/IN: loaded serial 0\nOK\n```\n\n错误消息并不完美，但它们确实帮助你找到问题。例如，考虑以下内容的输出：\n\
  \n点击此处查看代码图像\n\n```\nroot@onesourcesource ~]# named-zone sample.com\n/var/named/named.sample.com\n\
  zone sample.com/IN: NS 'ns1.sample.com.sample.com' has no address\nrecords (A or\
  \ AAAA)\nzone sample.com/IN: not loaded due to errors.\nroot@onesourcesource ~]#\
  \ grep ns1 /var/named/named.sample.com\n@       IN      NS      ns1.sample.com\n\
  ```\n\n文件中的问题是 `ns1.sample.com` 结尾缺少一个点字符。（它应该是 `ns1.sample.com.`）。\n\n#### dig\
  \ 命令\n\n点击此处查看代码图像\n\n```\nroot@onesourcesource ~]# dig sample.com\n```\n\n来自 `named-zone`\
  \ 的错误是：`zone sample.com/IN: NS 'ns1.sample.com.sample.com' has no address\nrecords\
  \ (A or AAAA)`。这是因为 `ns1.sample.com` 条目缺少末尾的点，导致 DNS 解析器再次追加了域名。\n\n\n\n\n\n```\n\
  [root@onesourcesource ~]#dig www.sample.com @localhost\n; <<>> DiG 9.9.4-RedHat-9.9.4-18.el7_1.5\
  \ <<>> www.sample.com @localhost\n;; global options: +cmd\n;; Got answer:\n;; ->>HEADER<<-\
  \ opcode: QUERY, status: NOERROR, id: 28530\n;; flags: qr aa rd ra; QUERY: 1, ANSWER:\
  \ 1, AUTHORITY: 2, ADDITIONAL: 3\n\n;; OPT PSEUDOSECTION:\n; EDNS: version: 0, flags:;\
  \ udp: 4096\n;; QUESTION SECTION:\n;www.sample.com.                       IN   \
  \   A\n\n;; ANSWER SECTION:\nwww.sample.com.        86400   IN      A       192.168.1.100\n\
  \n;; AUTHORITY SECTION:\nsample.com.            86400   IN      NS      ns1.sample.com.\n\
  sample.com.            86400   IN      NS      ns2.sample.com.\n\n;; ADDITIONAL\
  \ SECTION:\nns1.sample.com.        86400   IN      A       192.168.1.1\nns2.sample.com.\
  \        86400   IN      A       192.168.1.2\n\n;; Query time: 0 msec\n;; SERVER:\
  \ ::1#53(::1)\n;; WHEN: Mon Nov 30 07:38:52 PST 2018\n;; MSG SIZE  rcvd: 127\n```\n\
  \n`dig` 命令产生大量的输出，如果你不熟悉 DNS 区域文件语法，阅读起来会很困难。但现在你熟悉了这种语法，就可以发现响应格式与区域文件记录格式相同。例如，考虑下方\
  \ **ANSWER SECTION**（回答部分）的输出：\n\n点击此处查看代码\n\n```\nwww.sample.com.        86400\
  \   IN      A       192.168.1.100\n```\n\n此输出包含了完全限定的主机名（包括末尾的“.”字符）、该记录的 TTL（86400\
  \ 秒，即一天）、记录类型（`IN`）、记录类型（代表地址的 `A`）以及 IP 地址。请记住，这是 DNS 服务器提供的信息，并不完全等同于区域文件中的内容。例如，你可能没有包含\
  \ TTL 值，但服务器在响应 `dig` 请求时包含了该值。\n\n## 确保 BIND 的安全性\n\nBIND 服务器通常可以直接从互联网访问。每当你拥有一个可以通过互联网直接访问的系统时，安全性就会变成一个大关注的问题。担忧包括有人篡改服务器上的数据（有时被称为数据“投毒”）以及黑客接管暴露的服务器进程，从而允许被劫持的服务器对其他系统文件进行未经授权的访问。\n\
  \n本节介绍了加固 BIND 服务器的一些常用方法。\n\n### 将 BIND 送入监狱（Jail）\n\n在我们深入研究将 named 服务器放入“监狱”之前，有两点你需要理解：什么是监狱（jail），以及为什么要锁住\
  \ BIND 服务器。\n\n传统上，`named` 进程以 root 用户身份运行，但在现代 Linux 发行版中这已经很少见了，因为 `named` 进程通常以“named”用户身份运行。这种用户也被称为服务账户：\n\
  \n点击此处查看代码\n\n```\n[root@onecoursesource ~]# ps -fe | grep named\nroot      9608\
  \  9563  0 17:35 pts/3    00:00:00 grep --color=auto named\nnamed    19926     1\
  \  0 Nov30 ?        00:00:07 /usr/sbin/named -u named\n```\n\n以非 root 用户运行比以 root\
  \ 用户运行好得多，因为 `named` 进程对操作系统进行关键更改的能力有限。然而，当 `named` 进程作为非 root 用户运行时，仍然存在一些安全问题。\n\
  \n首先，考虑到这样一个事实：`named` 进程在处理入的 DNS 查询时将与基于连接进行交互。任何可以通过网络访问的进程都有可能受到劫持攻击的风险。在这种攻击中，远程系统上的用户将接管本地进程。一旦该用户获得了控制权，他们就可以访问本地系统，包括查看或修改文件。\n\
  \n当被劫持的进程以非 root 用户运行时，危险是有限的。但请考虑关键系统文件，例如 `/etc/passwd` 文件：\n\n点击此处查看代码\n\n```\n\
  [root@onecoursesource ~]# ls -l /etc/passwd\n-rw-r--r--. 1 root root 2786 Sep  7\
  \ 07:46 /etc/passwd\n```\n\n系统上的每个用户（包括 named 用户账户）都可以查看 `/etc/passwd` 文件的内容，因为每个人对该文件都有读取权限。现在问问自己：你希望某个未知的黑客破解你的\
  \ named 服务器并查看你的 `/etc/passwd` 文件（或任何系统文件）的内容吗？\n\nchroot 监狱的目的是限制对系统文件的访问。`named`\
  \ 进程被放入监狱中，它只能看到与 BIND 相关的文件。这是通过将 BIND 配置文件放在特定的子目录下，并启动 `named` 进程使得文件系统根目录看起来是上述子目录（chroot\
  \ 代表 `change root`，意为“更改此进程的文件系统根目录”）来实现的。\n\n### 安全要点\n\n尽管本章未详细介绍，但你应该了解另一种保护系统文件免受进程侵害的方法：SELinux。通过\
  \ SELinux，你可以限制进程可以访问的文件和目录，无论运行该进程的用户是谁。\n\n##### 创建 chroot 目录和文件\n\n要开始创建 chroot\
  \ 监狱的流程，你首先需要创建存放所有文件的目录：\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]# mkdir -p\
  \ /chroot/named\n[root@onecoursesource ~]# mkdir -p /chroot/named/dev\n[root@onecoursesource\
  \ ~]# mkdir -p /chroot/named/etc\n[root@onecoursesource ~]# mkdir -p /chroot/named/var/named\n\
  [root@onecoursesource ~]# mkdir -p /chroot/named/var/run\n```\n\n你可能在奇怪这些目录的用途。以下列表描述了每个目录的用途：\n\
  \n*   `/chroot/named/dev`：`named` 进程所需的设备文件所在。\n*   `/chroot/named/etc`：`named.conf`\
  \ 文件所在。根据你当前的配置，你可能还需要在 `/chroot/named/etc` 目录下创建额外的文件和子目录，例如 `/chroot/named/etc/named`\
  \ 目录。查看你系统中 `/etc` 目录的当前内容，看看还需要创建什么。\n*   `/chroot/named/var/named`：区域文件存放的位置。\n\
  *   `/chroot/named/var/run`：`named` 进程存储数据（如进程 PID）的位置。\n\n在下一步中，你将文件从当前配置复制到新位置：\n\
  \n点击此处查看代码\n\n```\n[root@onecoursesource ~]# cp -p /etc/named.conf /chroot/named/etc\n\
  [root@onecoursesource ~]# cp -a /var/named/* /chroot/named/var/named\n[root@onecoursesource\
  \ ~]# cp /etc/localtime /chroot/named/etc\n```\n\n上述命令假设了一个相当标准的 DNS 配置。根据 DNS 服务器的定制化情况，你可能需要复制额外的文件。\n\
  \n接下来，确保所有新文件都归属于 named 用户和组账户（尽管如果你在上述所有 `cp` 命令中使用了 `-p` 和 `-a` 选项，则下面的 `chown`\
  \ 命令将是需要）：\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]# chown -R named:named /chroot/named\n\
  ```\n\n最后，你需要创建几个设备文件：\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]# mknod /chroot/named/dev/null\
  \ c 1 3\n[root@onecoursesource ~]# mknod /chroot/named/dev/random c 1 8\n[root@onecoursesource\
  \ ~]# chmod 666 /chroot/named/dev/*\n```\n\n##### 配置 named 在监狱中启动\n\n\n\n\n\n在创建并复制所有适当的文件和目录后，你需要配置\
  \ `named` 进程使其在 chroot 监狱（jail）中启动。具体操作取决于你使用的发行版。以下示例适用于大多数基于 Red Hat 的系统：\n\n\
  点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# more /etc/sysconfig/named\n# BIND named\
  \ process options\n-t /chroot/named\n```\n\n`named` 命令的 `-t` 会将 `named` 服务置于 chroot\
  \ 监狱中。在对 `/etc/sysconfig/named` 文件进行此更改后，重启你的 `named` 服务。\n\n### 注意事项\n\n如果你想练习创建\
  \ chroot 监狱，可以使用较旧的发行版，例如 CentOS 5.x。现代发行版提供了一个名为 `bind-chroot` 的包，它可以自动为 BIND 配置\
  \ chroot 监狱。\n\n如果可用该包，那么它被认为是为 BIND 创建 chroot 监狱的推荐（且要简单得多）的方法。然而，如果没有该包，你应该了解如何手动创建\
  \ chroot 监狱。此外，`bind-chroot` 包使用的技术与手动方法类似，因此通过理解手动方法，你将能够更好地理解 `bind-chroot` 包。\n\
  \n### 拆分 DNS 配置\n\n为了理解拆分 DNS（split DNS）服务器配置，你首先应该理解最初为什么要配置这种设置。考虑你拥有三个“面向外部”的服务器的情况：\n\
  \n* `www.onecoursesource.com`\n* `ftp.onecoursesource.com`\n* `secure.onecoursesource.com`\n\
  \n在这种情况下，你希望互联网上的任何机器都能通过查询你的 DNS 服务器来获取这三台机器的域名到 IP 地址的解析。但是，假设你的公司内部还有其他不打算供外部访问的主机。这可能包括域名形如\
  \ `sales.onecoursesource.com`、`test.onecoursesource.com` 和 `eng.onecoursesource.com`\
  \ 的系统。\n\n这些系统可能位于防火墙之后，防止从私有网络外部进行访问。或者，它们可能拥有私有 IP 地址，只能通过 NAT（网络地址转换）访问互联网。换句话说，虽然你希望组织内部的用户能够对这些内部域名（以及面向外部的系统）执行\
  \ DNS 查询，但没有理由让这些内部系统被私有网络外部访问。解决方案：拆分 DNS。\n\n你实际上可以使用几种不同的技术来创建这种拆分 DNS 环境：\n\n\
  * **使用 DNS 视图 (views)**：通过 `view` 语句（放在 `/etc/named.conf` 文件中），你可以让 DNS 服务器根据查询的来源来响应\
  \ DNS 查询。例如，你可以为内部网络设置一个视图，使用包含所有 DNS 记录的区域文件；为外部网络设置另一个视图，使用仅包含少量 DNS 记录（面向外部的系统）的区域文件。视图创建拆分\
  \ DNS 的简单方法。\n\n* **使用两个 DNS 服务器**：这种方法更安全，因为你创建了两个 DNS 主服务器：一个拥有完整区域文件的私有服务器和一个拥有部分区域文件的公共服务器。它之所以更安全，是因为如果外部\
  \ DNS 服务器的 `named` 进程被破坏（劫持），那些私有域名和 IP 地址就不会暴露。而使用视图时，这些数据是可见，因为 `named` 进程可以查看任何区域文件，因为对\
  \ `named` 进程来说它是可读的。\n\n使用两个服务器配置拆分 DNS 并不复杂。概念可能更具挑战性，因此提供了更详细的示例。首先，图 20-4 显示了内部网络（灰色框）和外部网络（白色框）。之前提到的系统也显示在它们所属的网络中（例如，www\
  \ = www.onecoursesource.com）。\n\n![Image](img/20fig04.jpg)\n\n**图 20-4** *内部网络与外部网络*\n\
  \n接下来，我们引入两个 DNS 服务器：`in-ns.onecoursesource.com` 和 `ex-ns.onecoursesource.com`。`in-ns`\
  \ 名称服务器区域文件包含私有域名和公共域名，而 `ex-ns` 名称服务器区域文件仅包含公共域名。当然，私有网络需要与外部世界通信，因此图中添加了路由器（它可以充当防火墙或\
  \ NAT 系统）。请参见图 20-5 的视觉示例。\n\n![Image](img/20fig05.jpg)\n\n**图 20-5** *内部和外部名称服务器*\n\
  \n你还可以额外采取一步。在这种情况下，内部 DNS 服务器使用外部 DNS 服务器作为转发器（forwarder）是常见的。回想一下，转发器放置在 `/etc/named.conf`\
  \ 文件中，当 DNS 服务器在其区域文件中没有查询答案时使用。\n\n例如，假设内部查询人员对 `www.sample.com` 执行了查询。该域名不在 `in-ns.onecoursesource.com`\
  \ DNS 服务器的区域文件中。它需要被转发到顶级（根）服务器或另一个 DNS 服务器。\n\n为什么要将此转发到外部服务器？请记住，你正试图向外部网络隐藏内部\
  \ IP 地址和域名。即使仅仅是从内部 DNS 服务器发出的转发查询也可能导致潜在的安全泄露，因为外部 DNS 服务器将获知你的内部 DNS 服务器的存在。通过通过你的外部\
  \ DNS 服务器汇流请求，你使你的内部 DNS 服务器变得更安全一些。\n\n**安全要点**\n\n我们没有提供配置拆分 DNS 的完整示例，因为一旦你理解了概念，设置就很简单。只需使用在本章之前章节中学到的信息来创建你的内部\
  \ DNS 服务器。将这些文件复制到你的外部 DNS 服务器，并从区域文件中的私有地址和指针记录。在两个 DNS 服务器正常工作后，在内部服务器的 `/etc/named.conf`\
  \ 文件的 `options` 语句中添加 `forwarder` 语句并指向外部服务器。\n\n让你的内部系统指向内部 DNS 服务器（通过使用 `/etc/resolv.conf`\
  \ 文件中的 `nameserver` 设置），并与世界共享外部 DNS 服务器。\n\n### 签名\n\n在本章之前的部分，讨论了 DNS 主服务器和从服务器的概念。回想一下，两种类型的\
  \ DNS 服务器都可以响应 DNS 查询，但主服务器是你直接更改区域文件的系统。从服务器通过一个称为*区域传输*（zone transfer）的过程将这些信息复制到它们的区域文件中。\n\
  \n本文还简要涵盖了限制哪些机器发起区域传输。`allow-transfer` 设置可以应用于特定区域（通过在 `/etc/named.conf` 文件的区域设置中放置\
  \ `allow-transfer`），也可以应用于整个主服务器（通过在 `/etc/named.conf` 文件的选项设置中放置 `allow-transfer`）。通过限制哪些系统执行区域传输，你正在创建一个更安全的环境。如果任何系统都能执行区域传输，潜在的黑客将很容易收集你域名内所有域名和\
  \ IP 地址的列表。\n\nDNS 系统中可能存在另一个潜在的安全风险。当执行查询时，虚假的 DNS 服务器可能会提供错误数据。这被称为*DNS 缓存污染*（DNS\
  \ cache poisoning）或*DNS 欺骗*（DNS spoofing）。这里的担忧是，敏感系统（如银行网站）的域名到 IP 地址转换可能会指向一个旨在捕获用户名和密码的恶意服务器。\n\
  \n**安全要点**\n\n\n\n\n\nDNS 缓存污染的一个例子是中国大防火城（也称为“金盾工程”）。该项目由中国政府公安部设计并实施。该项目的目标之一是防止中国公民访问被认为“不恰当”的网站。这是通过\
  \ DNS 缓存污染实现的；中国境内的 DNS 服务器不会为中国政府认为不恰当网站相关的域名提供正确的 IP 地址。\n\n大防火城的缓存污染并不局限于中国境内的人。2010\
  \ 年，这些无效的 DNS 响应“逃出”中国，并在美国的许多 DNS 缓存服务器上被发现。\n\n有一种方法可以限制 DNS 缓存污染的概率：使用事务签名（TSIG）。通过\
  \ TSIG，可以使用私钥和公钥数字签名来确保 DNS 数据来自正确的源。该技术可以验证区域传输，也可以验证 DNS 查询。为 DNS 实施 TSIG 的最方法是使用\
  \ DNS 安全扩展（DNSSEC）。\n\n### The `dnssec-keygen` 命令\n\n要使用 DNSSEC，你首先需要创建一个私钥和一个公钥。这通过首先切换到包含区域文件的目录（例如\
  \ `/var/named`），然后执行 `dnssec-keygen` 命令来实现。这里有一个示例：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# cd /var/named\n[root@onecoursesource named]# dnssec-keygen -a RSASHA1 -b 768\n\
  -n ZONE sample.com\nGenerating key pair.....++++++++ ........++++++++\nKsample.com.+005+05451\n\
  ```\n\n注意，`dnssec-keygen` 命令可能会出现挂起（冻结），特别是在最近启动、不活跃或已虚拟化的系统上。这是因为该命令使用了 `/dev/random`\
  \ 文件中的数据，该文件包含了源自系统活动的随机数据，例如鼠标移动、磁盘活动或键盘击键。\n\n你可以通过执行此类操作来加快处理速度，但这可能需要大量的大量的鼠标移动或疯狂敲击键盘。填充\
  \ `/dev/random` 文件的快速方法是使用以下 `rngd` 命令：\n\n点击此处查看代码图像\n\n```\nrngd -r /dev/urandom\
  \ -o /dev/random -b\n```\n\n执行 `dnssec-keygen` 命令后，当前目录下有两个新文件：\n\n点击此处查看代码图像\n\n\
  ```\n[root@onecoursesource named]# ls K*\nKsample.com.+005+05451.key  Ksample.com.+005+05451.private\n\
  ```\n\n`Ksample.com.+005+05451.key` 文件包含公钥。此文件应该提供给其他 DNS 服务器，例如 DNS 从用服务器服务器。DNS\
  \ 内部没有允许将此文件传输到其他系统的方法，因此你应该使用其他技术，如安全外壳（SSH）。\n\n`Ksample.com.+005+05451.private`\
  \ 文件包含私钥。它用于生成数字签名区域文件。\n\n### The `dnssec-signzone` 命令\n\n在实施 DNSSEC 时使用的区域文件不是标准的区域文件。相反，使用的是数字签名区域文件。该数字签名区域文件是使用\
  \ `dnssec-keygen` 命令生成的私钥创建的，且数字签名只能通过 `dnssec-keygen` 命令生成的公钥进行验证。\n\n要创建此加密区域文件，首先创建一个纯文本区域文件，然后使用\
  \ `dnssec-signzone` 命令生成加密文件（注意，在你的发行版上，你可能需要使用 `-S` 选项进行智能签名）：\n\n点击此处查看代码图像\n\n\
  ```\n [root@onecoursesource named]# dnssec-signzone -o sample.com\nnamed.sample.com\
  \ Ksample.com.+005+15117\n```\n\n结果是一个名为 `named.sample.com.signed` 的新文件，你现在应该将其作为该域名的区域文件。\n\
  \n### 安全要点\n\n此过程包含比本书描述的更多内容。例如，你应该确保在 `/etc/named.conf` 文件中有一些额外的设置（例如 `dnssec-enable`\
  \ 设置）。本节的重点是 `dnssec-keygen` 和 `dnssec-signzone` 命令背后的概念。\n\n### DHCP 服务器\n\nDHCP（动态主机配置协议）让你能够动态地向客户端系统分配网络相关信息。这些信息可以包括为系统提供\
  \ IP 地址、子网掩码和 DNS 服务器信息。\n\n在任何主机移动的网络中（例如笔记本电脑、平板电脑和手机手机），DHCP 特别重要。这些设备经常从一个网络移动到另一个网络，设备所有希望有一种简单的方法将设备连接到网络。该过程的一部分是为设备分配\
  \ IP 网络信息。\n\n大多数发行版的默认安装不包含 DHCP 服务器包。（然而，DHCP 客户端包几乎总是默认安装的。）包名在不同发行版之间可能会不同。常见的\
  \ DHCP 服务器包名称包括 `dhcp`、`dhcp-server`、`isc-dhcp-server`、`dhcp3-server` 和 `dhcp4-server`。\n\
  \n注意，在大多数情况下，我们建议使用虚拟机来练习配置。但这对 DHCP 来说产生了一定的问题，因为通常虚拟机管理器充当 DHCP 服务器。虽然有解决方法，但在这种情况下，实际使用两台连接到物理网络（非无线）的物理机器来设置\
  \ DHCP 服务器和客户端更容易。\n\n#### 可能出现什么问题？\n\n不要将你的 DHCP 服务器连接到其他系统使用的网络。否则，你的 DHCP 服务器可能会向这些系统提供错误信息。创建“流氓”DHCP\
  \ 服务器会导致整个网络无法正常工作。\n\n#### DHCP 配置基础\n\n安装正确的 DHCP 服务器包后，你可以通过编辑 `/etc/dhcpd.conf`\
  \ 文件来配置服务器（在某些发行版上，配置文件可能是 `/etc/dhcp/dhcpd.conf` 文件）。通常，此文件是完全空的或仅包含注释，如下输出所示：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# more /etc/dhcpd.conf\n#\n# DHCP Server\
  \ Configuration file.\n#   see /usr/share/doc/dhcp*/dhcpd.conf.sample\n#\n```\n\n\
  `/etc/dhcpd.conf` 文件提到的示例文件对于组合初始 `/etc/dhcpd.conf` 文件很有用。请参示例 20-8 获取示例文件的内容。\n\
  \n**示例 20-8** 示例 `dhcpd.conf` 文件*\n\n\n\n\n\n```\n[root@onecoursesource ~]# more\
  \ /usr/share/doc/dhcp*/dhcpd.conf.sample\nddns-update-style interim;\nignore client-updates;\n\
  \nsubnet 192.168.0.0 netmask 255.255.255.0 {\n\n# --- 默认 gateway\n        option\
  \ routers                  192.168.0.1;\n        option subnet-mask            \
  \  255.255.255.0;\n\n        option nis-domain               \"domain.org\";\n \
  \       option domain-name              \"domain.org\";\n        option domain-name-servers\
  \      192.168.1.1;\n\n        option time-offset              -18000; # 东部标准时间\n\
  #       option ntp-servers              192.168.1.1;\n#       option netbios-name-servers\
  \     192.168.1.1;\n# --- 选择点对点节点（默认是混合模式）。除非你#非常了解 Netbios，否则不要更改此项\n#       option\
  \ netbios-node-type 2;\n\n        range dynamic-bootp 192.168.0.128 192.168.0.254;\n\
  \        default-lease-time 21600;\n        max-lease-time 43200;\n\n        # 我们希望名称服务器出现在一个固定地址上\n\
  \        host ns {\n                next-server marvin.redhat.com;\n           \
  \     hardware ethernet 12:34:56:78:AB:CD;\n                fixed-address 207.175.42.254;\n\
  \        }\n}\n```\n\n示例 20-8 中显示的文件包含三个主指令，包括 `subnet` 指令。在 `subnet` 指令内部还有额外的选项（option）指令，其中某些也可以作为主指令提供（你有时会在\
  \ `subnet` 指令之外看到这些指令，因为每条指令都可以作为全局网络指令）。\n\n在[示例 20-8]中所示的默认文件中，某些指令超出了本书的范围。本节的其余部分重点关注关键指令。\n\
  \n### ddns-update-style 和 ignore client-updates 指令\n\n动态 DNS（DDNS）的概念在本章前面的部分已简要介绍过。在\
  \ `/etc/named.conf` 文件（DNS 服务器的配置文件）中，`allow-update` 设置描述如下：“如果你决定实现一种名为动态 DNS 的\
  \ DNS 功能，则该设置非常有用；此项功能允许 DHCP 服务器更新主 DNS 区域文件中的记录。”\n\n该功能的实现方式由 `/etc/dhcpd.conf`\
  \ 文件中的 `ddns-update-style` 指令定义。`ddns-update-style` 指令可以设置四种可能的值：\n\n*   `none`：不尝试更新\
  \ DNS 服务器。\n*   `ad-hoc`：基于脚本语言，这是一种在 DHCP 4.3.0 中被弃用的旧方法。\n*   `interim`：用 C 语言编写，被认为是比\
  \ `ad-hoc` 更好的解决方案。被称为“interim”（过渡）是因为它作为 `ad-hoc` 缺点的临时解决方案。它在新的动态 DNS 标准编写期间发布。\n\
  *   `standard`：最新的技术在 DHCP 4.3.0 中发布。它旨在结合新的 DDNS 标准而设计。\n\nDHCP 客户端也可以执行 DDNS 更新。`ignore\
  \ client-updates` 指令告诉 DHCP 服务器建议客户端自行执行更新。`deny client-updates` 指令告诉 DHCP 服务器通知客户端不允许其执行自己的更新。\n\
  \n### subnet 指令\n\n`subnet` 指令用于定义 DHCP 服务器提供 IP 信息的网络。该指令有许多可能的子指令。理解 `subnet`\
  \ 指令的最好方法是一个显示了典型最小子指令的示例：\n\n点击此处查看代码图像\n\n```\nsubnet 192.168.0.0 netmask 255.255.255.0\
  \ {\n        option routers                  192.168.0.1;\n        option subnet-mask\
  \              255.255.255.0;\n        option domain-name              \"domain.org\"\
  ;\n        option domain-name-servers      192.168.1.1;\n        range 192.168.0.128\
  \ 192.168.0.254;\n        default-lease-time 21600;\n        max-lease-time 43200;\n\
  }\n```\n\n这些指令中的每一个在表 20-5 中都有描述。\n\n**表 20-5 subnet 指令的组件**\n\n| 组件 | 说明 |\n| ---\
  \ | --- |\n| `subnet 192.168.0.0 netmask 255.255.255.0 { }` | `subnet` 指令以网络 IP\
  \ 地址、`netmask` 关键字以及子网地址开始。该指令的最后部分是花括号内列出的子指令集合。 |\n| `option routers` | 定义 DHCP\
  \ 客户端的路由器。 |\n| `option subnet-mask` | 定义 DHCP 客户端的子网掩码。 |\n| `domain-name` | 定义\
  \ DHCP 客户端的域名。 |\n| `domain-name-servers` | 定义 DHCP 客户端的 DNS 服务器。 |\n| `range` |\
  \ 这是可以分配给 DHCP 客户端的 IP 地址范围。注意不要包含分配给 DHCP 服务器的静态 IP 地址。 |\n| `default-lease-time`\
  \ | DHCP 信息分发给 DHCP 客户端持续一段时间。这被称为 `DHCP 租约`（lease）。`default-lease-time` 告诉客户端它获得了一个特定时期的\
  \ IP 地址租约；该值默认单位为秒。在此时间之后，客户端可以请求续租租约。如果不请求续租，IP 地址将被释放并供另一个 DHCP 客户端使用。客户端可以请求更长的初始租约时间，在这种情况下不会使用默认租约时间。注意：此指令可以放在\
  \ `subnet` 指令之外。 |\n| `max-lease-time` | DHCP 客户端可以保留租约的最长时间。 |\n\n### 配置静态主机\n\n\
  假设你有一个用户将笔记本电脑带到同一个网络。为了确保这台笔记本获得相同的 IP 地址，你需要在 `subnet` 指令中定义静态主机（也称为预留），`/etc/dhcpd.conf`\
  \ 文件：\n\n点击此处查看代码图像\n\n```\nhost julia {\n        hardware ethernet 12:34:56:78:AB:CD;\n\
  \        fixed-address 192.168.0.101;\n}\n```\n\n`host` 指令的值是主机名（示例中为 `julia`）。该主机名可以在客户端定义，也可以通过\
  \ `option host-name` 指令分配。关键在于 `hardware ethernet` 指令。你必须确定客户端的以太网（MAC）地址以创建这种分配。\n\
  \n有几种确定方法。一种是在客户端上执行 `ifconfig` 命令。另一种是查看服务器上的 `dhcp.leases` 文件（通常位于 `/var` 目录下）。它包含了已分配租约详情。典型的条目如下（取决于\
  \ DHCP 版本）：\n\n点击此处查看代码图像\n\n```\nlease 192.168.0.101{\n    starts 6 2018/12/27\
  \ 00:40:00;\n    ends 6 2018/12/27 12:40:00;\n    hardware ethernet 12:34:56:78:AB:CD;\n\
  \    uid 01:00:50:04:53:D5:57;\n    client-hostname \"julia\";\n}\n```\n\n使用 `dhcp.leases`\
  \ 文件确定以太网地址需要远程机器首先从服务器获取 DHCP 租约。另一种技术是查看 `arp` 命令提供的信息：\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource ~]# arp\nAddress           HWtype  HWaddress           Flags\
  \ Mask    Iface\n192.168.1.1       ether   C0:3F:0E:A1:84:A6   C             eth0\n\
  192.168.1.101     ether   12:34:56:78:AB:CD   C             eth0\n```\n\n## DHCP\
  \ 日志文件\n\n\n\n\n除了之前提到的 `dhcpd.leases` 文件外，你还应该注意到 DHCP 服务器可能会将日志信息存储在 `/var/log/messages`\
  \ 文件（基于 Red Hat 的系统）或 `/var/log/daemon.log` 文件（基于 Debian 的系统）中。示例 20-9 展示了一条条潜在的\
  \ DHCP 服务器消息。我们刻意在配置文件中制造了一个错误，当 DHCP 服务器启动时，它提供了一条非常有用的信息（见加粗的行）。\n\n**示例 20-9\
  \ `/var/log/messages` 条目**\n\n点击此处查看代码图像\n\n```\nJan  6 20:26:16 localhost dhcpd:\
  \ Internet Systems Consortium DHCP Server V3.0.5-RedHat\nJan  6 20:26:16 localhost\
