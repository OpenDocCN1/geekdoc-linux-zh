  \n尽管 Linux 有多种不同的 shell，但到目前最流行的 shell 是 BASH shell。BASH shell 是从一个名为 Bourne Shell\
  \ 的旧 shell 开发而来的（BASH 代表 Bourne Again SHell）。因为它如此受欢迎，它将是本书讨论的重点关注。\n\n*   你将选择哪种发行版？如前所述，你有大量的选择。\n\
