  \ Proxy` 旁边的框中填写你的 Squid 服务器的 IP 地址。如果你将 Squid 服务器设置在本地机器，可以使用本地机器的 IP 地址或 `127.0.0.1`。\n\
  \n**步骤 6.** 点击 `OK` 完成。在某些情况下，你可能需要重启 Firefox 以便此新的代理设置正常工作。\n\n### 总结\n\n在本章中，你学习了如何设置和保护\
  \ Apache Web 服务器。你还学习了如何实现两种不同的代理服务器：Squid 和 Nginx。\n\n## 关键术语\n\n虚拟主机\n\nApache\n\
  \nHTTP\n\nHTML\n\nPHP\n\nPerl\n\nHTTPS\n\nSSL\n\nTLS\n\n非对称加密\n\nPKI\n\nCA\n\n中间人攻击\n\
  \n自签名\n\n代理服务器\n\n## 复习题\n\n**1.** 用于指定由 Apache 服务器提供目录的指令是 `_____` 指令。\n\n**2.**\
  \ 下列哪个 Apache Web 服务器指令用于指定记录到 `error_log` 文件中的将是什么种级别的消息？\n\n**3.** 填空：\n\n点击此处查看代码图片\n\
  \n```\n<Directory />\n    AllowOverride All\n    Require all granted\n<_____>\n\
  ```\n\n**4.** 填空以创建一个基于名称的虚拟主机：\n\n点击此处查看代码图片\n\n```\n_____ 192.168.1.100\n\n<VirtualHost\
  \ 192.168.1.100\n     ServerName www.example.com\n     DocumentRoot /var/www/example/html\n\
  </VirtualHost>\n\n<VirtualHost 192.168.1.100>\n     ServerName www.sample.com\n\
  \     DocumentRoot /var/www/sample/html\n</VirtualHost>\n```\n\n**5.** 当网络浏览器使用\
  \ SSL 与 Apache Web 服务器 通信时，使用 `_____` 协议。\n\n**6.** 下列哪些是 SSL 安全问题？（选择所有适用项。）\n\n\
  *   中间人攻击\n*   虚拟主机\n*   公钥的安全性\n*   私钥的安全性\n\n\n\n\n大多数网络中都可以找到不同类型的网络服务器，你将需要创建到这些服务器的连接并维护这些连接。轻量级目录访问协议（LDAP）服务器为关键网络信息（如网络用户和组）提供类似于数据库的访问。文件传输协议（FTP）服务器用于在系统之间传输文件。当你需要连接到任何远程\
  \ Linux 系统以便在该系统上运行命令时，安全外壳（SSH）是最常用的方法。\n\n本章将讨论这些服务器的基本设置和配置，以及如何从客户端侧与每个服务器进行连接和通信。\n\
  \n在读完本章并完成练习后，你将能够完成以下操作：\n\n- 配置 LDAP 服务器\n- 在 LDAP 服务器中定义值\n- 将客户端系统连接到 LDAP 服务器\n\
  - 配置并连接到 FTP 服务器\n- 通过 SSH 建立安全连接\n\n## LDAP\n\n`LDAP`（轻量级目录访问协议）是一种分布式目录服务。目录服务通常与数据库进行类比，从某种意义上说，它们以组织化的方式存储信息，就像数据库程序一样。然而，数据库仅仅是信息的集合。数据库并不真正为客户端系统提供任何类型的服务；数据库提供可以使用各种工具访问的信息。\n\
  \n目录服务与数据库之间存在几点区别。数据库的设计在写入数据和读取数据方面的效率通常相等。而目录服务的设计旨在提供一种高效的数据读取方法。目录服务还专门设计用于提供按分级结构组织的记录集（类似于互联网的域名结构）。因此，目录服务提供的公司数据反映了公司的结构。\n\
  \n有多种不同类型的基于 LDAP 的软件可用。例如，微软的 `Active Directory` 是一种基于 LDAP 的目录服务。对于 Linux 而言，`OpenLDAP`\
  \ 是最常用的开源目录服务（还有几种基于 LDAP 的商业 Linux 程序）。\n\n在连接到 LDAP 服务器之前，你必须先有一个可用的服务器。因此，我们首先讨论\
  \ LDAP 的基础知识，然后是它的安装和配置，最后是如何连接到 LDAP 服务器。\n\n大多数 Linux 发行版默认并不并不安装 `OpenLDAP` 软件。配置\
  \ OpenLDAP 服务器的第一步是安装 `openldap-server` 软件包（有关如何安装软件包的信息，请参阅第 26 章“基于 Red Hat 的软件管理”和第\
  \ 27 章“基于 Debian 的软件管理”）。\n\n安装软件后，系统应该已经保存了一个 OpenLDAP 服务器的配置文件。通常，它位于 `/etc/openldap`\
  \ 目录下，文件名为 `slapd.conf`。OpenLDAP 服务器的名称为 `slapd`。\n\n# LDAP 关键术语\n\nLDAP 让新 LDAP\
  \ 管理员面临挑战的一个方面是学习许多 LDAP 术语。这些术语列于表 22-1，对于理解 LDAP 概念和正确管理它至关重要。\n\n**表 22-1** 关键\
  \ LDAP 术语\n\n| 术语 | 说明 |\n| --- | --- |\n| Object（对象） | `object`（也称为 `entry` 或 `record`）是\
  \ LDAP 目录中的单个项目。对象用于描述计算机、用户帐户或架构允许的任何其他数据结构等。对象的定义称为对象类（object class）。它定义在名为 `schema`\
  \ 的文件中。 |\n| Attribute（属性） | `attribute` 是对象的一个组成部分。例如，如果对象类型是用户账户，那么该账户的 `UID`（用户\
  \ ID）就是一个属性。这些属性共同构成了对象。这些属性不是随机的数据位，而是由 `schema` 定义的数据类型。 |\n| Schema（架构） | `schema`\
  \ 用于定义属性和对象。例如，架构可以将用户账户对象定义为具有 `UID` 属性、用户名属性和主目录属性的对象——但希望不仅仅是这三个属性！架构还定义了属性并规定了这些属性可以存储的内容。例如，你不希望在\
  \ `UID` 属性中存储 `ABC` 的值。因此，可以使用架构将 `UID` 属性定义为“从 0 到 65,000 的整数值”。关于架构的更多详细信息将在本章随后的章节中提供。\
  \ |\n| LDIF | LDAP 数据交换格式用于创建 LDAP 对象。通过使用对象类型的属性以及这些属性的特定值，你可以将 `LDIF` 格式放在文件中并使用它来创建对象。\
  \ |\n| DN（区分名） | 每个对象在 LDAP 服务器目录中必须有一个唯一的名称。该名称通过创建容器来生成，这些容器用于在目录中创建组织化的结构。例如，你可以创建一个名为“com”的顶层容器，并在\
  \ com 容器下创建一个名为“example”的二级容器。每个容器也被称为域名组件（domain component），简称为 `DC`。在 example\
  \ 容器内，你可以创建一个名为“bob”的用户帐户对象。`DN`（distinguished name）是该对象的全名，包含了它所在的域名。它在 LDAP 中的写法如下：`cn=bob,dc=example,dc=com`。将\
  \ `CN` 视为文件而将 `DC` 视为目录可能会有所帮助。从这个意义上说，你拥有类似于文件完整路径的内容，只不过顺序与你习惯的相反。 |\n| CN（通用名称）\
  \ | `CN`（或 common name）是对象的相对名称。该名称不包含存储该对象的容器。例如，在以下 `DN` 中的 bob 就是一个 `CN`：`cn=bob,dc=example,dc=com`\
  \ |\n| SSSD | 系统安全服务守护（System Security Services Daemon）的功能是使用提供用户数据的不同服务对用户帐户进行验证。例如，你可以使用\
  \ `SSSD` 使用来自 LDAP 服务器的数据进行验证。 |\n\n在配置 LDAP 服务器之前，你真的应该考虑要使用哪种结构。明智地选择；以后更改这种结构并不容易！\n\
  \n\n\n\n这些架构可以直接放置在 `slapd.conf` 文件中，但由于它们很大，会使得主 OpenLDAP 配置文件难以管理。此外，通过使用这些 `include`\
  \ 语句，你可以通过下载（或创建）架构文件，并在 `slapd.conf` 文件中使用 `include` 语句来向 LDAP 添加更多架构。\n\n### 定制你的\
  \ LDAP 域\n\n你可能永远不会进行任何架构更改，但当公司需要新的对象类型时，你应该知道如何包含新架构。然而，以下高亮显示的设置是你绝对应该考虑更改的：\n\
  \n点击此处查看代码图片\n\n```\ndatabase        bdb\nsuffix          \"dc=my-domain,dc=com\"\
  \nrootdn          \"cn=Manager,dc=my-domain,dc=com\"\n# Cleartext passwords, especially\
  \ for the rootdn, should\n# be avoided. See slappasswd(8) and slapd.conf(5) for\
  \ details.\n# Use of strong authentication encouraged.\n# rootpw               \
  \ secret\n# rootpw                {crypt}ijFYNcSNctBYg\n```\n\n表 22-2 描述了此示例中的粗体行。\n\
  \n**表 22-2** LDAP 配置设置\n\n| 设置 | 说明 |\n| --- | --- |\n| **suffix “dc=my-domain,dc=com”**\
  \ | 该设计用于启动 LDAP 结构的顶层。请考虑 图 22-1 中描述的目录结构。要启动该目录结构，你如下所示修改 suffix 行：**`suffix “dc=OCS,dc=com”`**。图\
  \ 22-2 中描述的目录结构的 suffix 行将是：**`suffix “dc=OCS”`** |\n| **rootdn “cn=Manager,dc=my-domain,dc=com”**\
  \ | 这是 LDAP 服务器的根账户。注意，这不是普通的 Linux 账户，而是仅限 LDAP 的账户。这个根 LDAP 账户非常重要，因为它将用于向 LDAP\
  \ 目录中添加新对象。考虑 图 22-1 中描述的目录结构。要为此结构设置 `rootdn`，请使用以下行：**`rootdn \"cn=root,dc=OCS,dc=com\"\
  `**。注意：我们倾向于使用实际名为“root”的 LDAP 管理员账户。 |\n| **rootpw** | 这是 `rootdn` LDAP 账户的密码。此时，你会看到有两行被注释掉。一个演示了明文密码，另一个演示了加密密码。明文密码更容易管理，但确实存在风险。如果\
  \ `slapd.conf` 文件显示在不安全的显示器上，有人可能会看到 `rootdn` 密码。虽然文件的权限应该保持其安全，但权限的更改可能会导致文件可见。要创建加密密码，请使用\
  \ `slappasswd` 命令：点击此处查看代码图片 |\n\n```\n[root@onecoursesource ~]# slappasswd\n  \
  \  New password:\n    Re-enter new password:\n{SSHA}lpEFwp3XkQPEEZ8qJCDxCT+EPvfleMBf\n\
  ```\n\n### 配置日志记录\n\n`slapd.conf` 配置设置中，你应该注意的一个不在默认配置文件中的设置是 `loglevel` 设置。`loglevel`\
  \ 设置允许你指定想要发送到系统日志记录记录的日志信息类型。\n\n此设置比大多数 Linux 服务定义记录内容的方式要复杂一些。日志消息被放在类别中；以下是\
  \ `slapd.conf` 手页中定义的这些类别描述：\n\n点击此处查看代码图片\n\n```\n1      (0x1 trace) trace 函数调用\n\
  2      (0x2 packets) 调试数据包处理\n4      (0x4 args) 深度跟踪调试（函数参数）\n8      (0x8 conns)\
  \ 连接管理\n16     (0x10 BER) 打印发送和接收的数据包\n32     (0x20 filter) 搜索过滤器处理\n64     (0x40\
  \ config) 配置文件处理\n128    (0x80 ACL) 访问控制列表处理\n256    (0x100 stats) 统计日志连接/操作/结果\n\
  512    (0x200 stats2) 统计日志发送的条目\n1024   (0x400 shell) 打印与 shell 后端的通信\n2048   (0x800\
  \ parse) 条目解析\n4096   (0x1000 cache) 缓存（未使用）\n8192   (0x2000 index) 数据索引（未使用）\n\
  16384  (0x4000 sync) LDAP 同步\n32768  (0x8000 none) 无论日志级别设置，只记录的消息\n```\n\n每个类别可以用三种方式之一描述：十进制、十六进制或名称。例如，条目解析可以称为整数值\
  \ `2048`、十六进制值 `0x800` 或名称 `parse`。\n\n\n\n\n\n`ldapsearch` 命令旨在从客户端系统查询目录信息。虽然本章稍后会讨论该命令的详细信息，但使用该命令验证\
  \ OpenLDAP 服务器是否对查询做出响应是非常有用的。要进行此验证，请先安装 `openldap-clients` 软件包，然后运行示例 22-1 所示的命令。如果\
  \ `DN` 结果与你在配置文件中设置的内容匹配，则说明服务器运行正常。\n\n**示例 22-1** *测试 OpenLDAP 服务器*\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# ldapsearch -x -b '' -s base '(objectclass=*)' namingContexts\n\
  # extended LDIF\n#\n# LDAPv3\n# base <> with scope baseObject\n# filter: (objectclass=*)\n\
  # requesting: namingContexts\n#\n\n#\n\ndn:\nnamingContexts: dc=OCS,dc=com\n\n#\
  \ search result\nsearch: 2\nresult: 0 Success\n\n# numResponses: 2\n# numEntries:\
  \ 1\n```\n\n在示例 22-1 所示的 `ldapsearch` 命令中使用了以下选项：\n\n* `-x`: 表示使用简单身份验证代替 SASL（简单身份验证和安全层）。在这种情况下，不需要额外的身份验证。\n\
  * `-b`: 搜索基底。空字符串值（两个单引号，如示例 22-1 所示）从 LDAP 目录结构的顶层开始搜索。\n* `-S`: 决定返回值的顺序。更多信息请参见\
  \ `ldap_sort` 的帮助页。\n\n### OpenLDAP 对象\n\n要在 OpenLDAP 中创建对象，你首先需要创建一个 LDIF (LDAP\
  \ 数据交换格式) 文件。该文件的格式如下：\n\n点击此处查看代码图像\n\n```\ndn: dc=OCS,dc=com\ndc: OCS\ndescription:\
  \ A training company\nobjectClass: dcObject\nobjectClass: organization\no: OCS,\
  \ Inc.\n```\n\n在某些情况下，根据你学到的对象知识，你可能会发现 LDIF 文件的部分。例如，你现在应该意识到上一个示例中的第一行（`dn: dc=OCS,dc=com`）指定了一个已经存在的容器。要理解其余部分，你需要了解一些架构（Schemas）。\n\
  \n**安全要点**\n\nLDIF 文件可以存储在任何目录中，因为它仅用于创建对象。然而，在创建对象后，你应该删除该文件，或者确保该文件位于安全目录中（仅 root\
  \ 用户应有访问权限），因为它可能包含存储其中的敏感账户数据。\n\n### OpenLDAP 架构\n\n回想一下，架构被用于组织数据在 OpenLDAP 目录中的存储方式。具体来说，它用于定义对象类型以及哪些属性构成了对象的组件。\n\
  \n对于常规的 LDAP 配置，你不需要了解架构格式的细节。但是，如果你真的想管理 OpenLDAP 服务器，你应该学习架构是如何格式化的。核心架构（位于 `/etc/openldap/schema/core.schema`\
  \ 文件中）包含了示例 22-2 所示的条目。\n\n**示例 22-2** *格式化架构*\n\n点击此处查看代码图像\n\n```\nobjectclass\
  \ ( 2.5.6.4 NAME 'organization'\n        DESC 'RFC2256: an organization'\n     \
  \   SUP top STRUCTURAL\n        MUST o\n        MAY ( userPassword $ searchGuide\
  \ $ seeAlso $ businessCategory $\n                x121Address $ registeredAddress\
  \ $ destinationIndicator $\n                preferredDeliveryMethod $ telexNumber\
  \ $ teletexTerminalIdentifier $\n                telephoneNumber $ internationaliSDNNumber\
  \ $\n                facsimileTelephoneNumber $ street $ postOfficeBox $ postalCode\
  \ $\npostalAddress $ physicalDeliveryOfficeName $ st $ l $ description ) )\n```\n\
  \n你不需要担心所有这些设置。以下是最重要的：\n\n* 每个对象类型定义都被称为 `objectclass`。每个 `objectclass` 都有一个唯一的对象\
  \ ID（上例中为 2.5.6.4）。这个对象 ID 应该是全局唯一的。这些唯一 ID 由互联网分配数字机构 (IANA) 维护。\n* 如何确定对象的名称（`NAME\
  \ ‘organization’`）。\n* 读取 `DESC` 以确定对象的用途。\n* 理解 `MUST` 指定哪些属性是强制的，而 `MAY` 描述哪些属性是允许但非强制的。\n\
  \n回想之前显示的 LDIF 文件，并注意加粗的行：\n\n点击此处查看代码图像\n\n```\ndn: dc=OCS,dc=com\ndc: OCS\ndescription:\
  \ A training company\nobjectClass: dcObject\nobjectClass: organization\no: OCS,\
  \ Inc.\n```\n\n这两行创建了一个具有所需 `o` 属性的组织对象。`o` 属性类型是什么？以下是根据架构的定义：\n\n点击此处查看代码图像\n\n\
  ```\nattributetype ( 2.5.4.10 NAME ( 'o' 'organizationName' )\n        DESC 'RFC2256:\
  \ organization this object belongs to'\n        SUP name )\n```\n\n你可能会遇到术语 *架构白页\
  \ (schema white page)*，它指的是专门设计用于提供用户信息的架构。该术语来自电信公司使用的“白页”用于发布地理区域内的电话号码。\n\n###\
  \ OpenLDAP 数据库更改\n\n要将 LDIF 文件的内容添加到 LDAP 目录，请执行 `ldapadd` 命令，如示例 22-3 所示。\n\n**示例\
  \ 22-3** *'ldapadd 命令*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# more ldif.txt\n\
  dn: dc=OCS,dc=com\ndc: OCS\ndescription: A training company\nobjectClass: dcObject\n\
  objectClass: organization\no: OCS, Inc.\n[root@onecoursesource ~]# ldapadd -x -D\
  \ \"cn=root,dc=OCS,dc=com\" -W -f ldif.txt\nEnter LDAP Password:\nadding new entry\
  \ \"dc=OCS,dc=com\"\n```\n\n在示例 22-3 所示的 `ldapadd` 命令中使用的选项如下：\n\n* `-x`: 表示使用简单身份验证代替\
  \ SASL（简单身份验证和安全层）。在这种情况下，因为要修改数据，你必须提供 `rootdn` 账户的密码。\n* `-D`: 授权管理服务器的 OpenLDAP\
  \ 账户的 `DN`（即 `rootdn` 的 `DN`）。\n* `-W`: 让 `ldapadd` 命令查询 `rootdn` 密码。\n* `-f`: 用于指定包含\
  \ LDIF 信息的文件。\n\n你可以通过运行 `slapcat` 命令来验证这些更改，如示例 22-4 所示。\n\n**示例 22-4** *'slapcat\
  \ 命令*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# slapcat\ndn: dc=OCS,dc=com\n\
  dc: OCS\ndescription: A training company\nobjectClass: dcObject\nobjectClass: organization\n\
  o: OCS, Inc.\nstructuralObjectClass: organization\nentryUUID: 2159172e-4ab6-1035-90c7-df99939a0cfb\n\
  creatorsName: cn=root,dc=OCS,dc=com\ncreateTimestamp: 20160109004614Z\nentryCSN:\
  \ 20160109004614Z#000000#00#000000\nmodifiersName: cn=root,dc=OCS,dc=com\nmodifyTimestamp:\
  \ 20160109004614Z\n```\n\n**注意**\n\n`slapcat` 命令的一个好处是输出格式为 LDIF。这意味着你可以使用这些信息创建自己的\
  \ LDIF 文件，然后通过修改这些文件来生成新内容。\n\n你还应该了解用于修改 OpenLDAP 数据库的额外命令：\n\n* `ldapmodify`:\
  \ 使用 LDIF 文件更改现有的对象。\n* `ldapdelete`: 用于删除现有对象。该命令不需要 LDIF 文件；对象在命令行中指定。\n\n\n\n\
  \n\n*   `slapindex`: 索引用于更方便地查找数据。请记住，LDAP 作为目录服务，是针对数据读取进行了优化的。为数据建立索引可以加快读取速度。`slapindex`\
  \ 命令为数据库中的对象创建此类索引。\n\n成功执行这些命令的能力取决于一种名为*访问控制*（access control）的安全特性。在 `slapd.conf`\
  \ 文件中，你可以创建规则，用于定义谁可以修改 LDAP 数据库中的内容。当你的组织规模变大、此数据库变得难以管理时，将某些工作分配给其他人是非常有用的。\n\n\
  这种做法的缺点是访问控制的语法非常复杂。`slapd.access` 手册页描述了详细信息；然而，对这些细节的完整讨论超出了本书的范围。为了让你对配置访问控制的复杂性有一个直观概念，请查看示例\
  \ 22-5，它展示了 OpenLDAP 文档提供的 `olcAccess` 指令的语法。\n\n**示例 22-5** *访问控制示例*\n\n点击此处查看代码图像\n\
  \n```\nolcAccess: <access directive>\n<access directive> ::= to <what>\n       \
  \         [by <who> [<access>] [<control>] ]+\n<what> ::= * |\n                [dn[.<basic-style>]=<regex>\
  \ | dn.<scope-style>=<DN>]\n                [filter=<ldapfilter>] [attrs=<attrlist>]\n\
  <basic-style> ::= regex | exact\n<scope-style> ::= base | one | subtree | children\n\
  <attrlist> ::= <attr> [val[.<basic-style>]=<regex>] | <attr> , <attrlist>\n<attr>\
  \ ::= <attrname> | entry | children\n<who> ::= * | [anonymous | users | self\n \
  \                       | dn[.<basic-style>]=<regex> | dn.<scope-style>=<DN>]\n\
  \                [dnattr=<attrname>]\n                [group[/<objectclass>[/<attrname>][.<basic-style>]]=<regex>]\n\
  \                [peername[.<basic-style>]=<regex>]\n                [sockname[.<basic-style>]=<regex>]\n\
  \                [domain[.<basic-style>]=<regex>]\n                [sockurl[.<basic-style>]=<regex>]\n\
  \                [set=<setspec>]\n                [aci=<attrname>]\n<access> ::=\
  \ [self]{<level>|<priv>}\n<level> ::= none | disclose | auth | compare | search\
  \ | read | write | manage\n<priv> ::= {=|+|-}{m|w|r|s|c|x|d|0}+\n<control> ::= [stop\
  \ | continue | break]\n```\n\n### 使用 `ldapdelete` 命令\n\n在填充数据库后，你可能决定删除数据库中的某条条目。这不需要创建\
  \ LDIF 文件。相反，你可以在命令行上指定你想要删除的内容：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#\
  \ ldapdelete \"uid=named,ou=People,dc=OCS,dc=com\"\n-x -D \"cn=root,dc=OCS,dc=com\"\
  \ -W\nEnter LDAP Password:\n```\n\n这种情况属于“没有消息就是好消息”的情况之一。如果对象没有被删除，你将看到错误消息：\n\n\
  点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# ldapdelete \"uid=named,ou=People,dc=OCS,dc=com\"\
  \n-x -D \"cn=root,dc=OCS,dc=com\" -W\nEnter LDAP Password:\nldap_delete: No such\
  \ object (32)\n        matched DN: ou=People,dc=OCS,dc=com\n```\n\n你可以使用 `slapcat`\
  \ 命令来确保条目已被删除：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# slapcat | grep named\n\
  ```\n\n同样，没有消息就是好消息。如果命名对象在数据库中，`grep` 命令将显示某些内容。\n\n你也可以使用下一节介绍的 `ldapsearch` 工具。\n\
  \n以下是 `ldapdelete` 命令不同组成部分的详细说明：\n\n*   `“uid=named,ou=People,dc=OCS,dc=com”` 是你想要删除的内容。\n\
  *   `-x` 表示“使用简单身份验证”。因为要对数据库进行更改，所以需要密码。\n*   `-D “cn=root,dc=OCS,dc=com”` 指定可以进行更改的\
  \ LDAP 账户（rootdn）。\n*   `-W` 指定提示用户输入密码。你也可以通过 `-w` 选项在命令行中包含密码，但这带来潜在的安全问题（附近的人可能会偷看、命令行会记录在历史记录中等）。\n\
  \n### 使用 ldapsearch 命令\n\n在向数据库中填充了信息后，你会发现 `slapcat` 命令很难使用：\n\n点击此处查看代码图像\n\n\
  ```\n[root@onecoursesource ~]# slapcat | grep\n```\n\n同样，没有消息就是好消息。如果命名对象在数据库中，`grep`\
  \ 命令将显示某些内容。\n\n你也可以使用下一节介绍的 `ldapsearch` 工具。\n\n以下是 `ldapdelete` 命令不同组成部分的详细说明：\n\
  \n*   `“uid=named,ou=People,dc=OCS,dc=com”` 是你想要删除的内容。\n*   `-x` 表示“使用简单身份验证”。因为要对数据库进行更改，所以需要密码。\n\
  *   `-D “cn=root,dc=OCS,dc=com”` 指定可以进行更改的 LDAP 账户（rootdn）。\n*   `-W` 指定提示用户输入密码。你也可以通过\
  \ `-w` 选项在命令行中包含密码，但这带来潜在的安全问题（附近的人可能会偷看、命令行会记录在历史记录中等）。\n\n（注：提供的源文本在“ldapsearch”部分包含大量重复/故障；我已根据指令清理了冗余流程，同时保留了指令中提供的核心逻辑。）*\n\
  \n\n\n\n\n```\n[root@onecoursesource ~]# ldapsearch -LL -x -b 'ou=People,dc=OCS,dc=com'\n\
  '(cn=bin)' uid\nversion: 1\n\ndn: uid=bin,ou=People,dc=OCS,dc=com\nuid: bin\n\n\
  [root@onecoursesource ~]# ldapsearch -LLL -x -b 'ou=People,dc=OCS,dc=com'\n'(cn=bin)'\
  \ uid\ndn: uid=bin,ou=People,dc=OCS,dc=com\nuid: bin\n```\n\n在指定过滤器时，你可以使用逻辑运算符：\n\
  \n- `|` 是逻辑或（OR）运算符\n- `&` 是逻辑与（AND）运算符\n- `!` 是逻辑非（NOT）运算符。\n\n不过，你可能会发现这些复杂过滤器的语法有点奇怪：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# ldapsearch -LLL -x -b 'ou=People,dc=OCS,dc=com'\n\
  '(|(cn=bin)(cn=root))' uid\ndn: uid=root,ou=People,dc=OCS,dc=com\nuid: root\n\n\
  dn: uid=bin,ou=People,dc=OCS,dc=com\nuid: bin\n```\n\n过滤器表达式还具有灵活性：\n\n- `=`: 必须匹配。\n\
  - `=*string*string**`: 星号用作通配符。\n- `>=`: 大于等于。\n- `<=`: 小于等于。\n- `~=`: 模糊匹配。\n\n\
  这是一个示例：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# ldapsearch -LLL -x -b 'ou=People,dc=OCS,dc=com'\n\
  '(cn=*bo*)' uid\ndn: uid=nobody,ou=People,dc=OCS,dc=com\nuid: nobody\n\ndn: uid=vboxadd,ou=People,dc=OCS,dc=com\n\
  uid: vboxadd\n```\n\n### 使用 ldappasswd 命令\n\n从下面的命令可以看出，OpenLDAP 数据库中的用户账户密码存储在\
  \ `userPassword` 属性中：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# ldapsearch\
  \ -LLL -x -b 'ou=People,dc=OCS,dc=com'\n'(cn=bin)' uid userPassword\ndn: uid=bin,ou=People,dc=OCS,dc=com\n\
  uid: bin\nuserPassword:: e2NyeXB0fSo=\n```\n\n你可以通过执行 `ldappasswd` 命令来更改 OpenLDAP\
  \ 密码：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# ldappasswd -x -D \"cn=root,dc=OCS,dc=com\"\
  \ -s\nnewpassword -W uid=bin,ou=People,dc=OCS,dc=com\nEnter LDAP Password:\nResult:\
  \ Success (0)\n```\n\n`-x`、`-D` 和 `-W` 选项与 `ldapdelete` 和 `ldapadd` 命令的含义相同。`-s`\
  \ 选项允许你为 OpenLDAP 用户指定新密码。命令输出应为“Success”，你可以通过再次运行 `ldapsearch` 命令来验证更改：\n\n点击此处查看代码图片\n\
  \n```\n[root@onecoursesource ~]# ldapsearch -LLL -x -b 'ou=People,dc=OCS,dc=com'\n\
  '(cn=bin)' uid userPassworddn: uid=bin,ou=People,dc=OCS,dc=com\nuid: bin\nuserPassword::\
  \ e1NTSEF9NGNUcW81U29taW1QS3krdFdOUHowS2hLdXp2UzZ5Ris=\n```\n\n如果你想在执行 `ldappasswd`\
  \ 命令时避免在命令行中直接指定新密码，请使用 `-S` 选项代替 `-s` 选项：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ ~]# ldappasswd -x -D \"cn=root,dc=OCS,dc=com\" -S -W\nuid=bin,ou=People,dc=OCS,dc=com\n\
  New password:\nRe-enter new password:\nEnter LDAP Password:\nResult: Success (0)\n\
  ```\n\n前两个密码提示是用于 OpenLDAP 用户的新密码的。第三个提示是用于 rootdn 密码。\n\n### 连接到 LDAP 服务器\n\nLDAP\
  \ 服务器可以有多种方式使用，因为 LDAP 服务器的目的是为客户端系统提供信息，且 LDAP 服务器具有存储各种类型信息的灵活性。尽管如此，LDAP 服务器通常用于以下两个特定操作：作为组织内部\
  \ DNS 的替代品，以及作为为客户端系统提供登录信息的手段。\n\n不同的发行版有不同的工具帮助你管理 LDAP。例如，如果你在 Ubuntu 上工作：\n\n\
  1. 确保已安装 `openldap`。\n2. 确保已安装 `nscd`。\n3. 确保已安装 `libldap-utils`。\n4. 使用 `/etc/ldap.conf`\
  \ 配置设置。\n5. 使用 `/etc/nsswitch.conf` 进行映射。\n6. 使用 `ldapsearch` 测试连接。\n\n如果你在 Red\
  \ Hat 上工作：\n\n1. 确保已安装 `openldap-servers`。\n2. 确保已安装 `openldap-clients`。\n3. 确保已安装\
  \ `ldap-utils`。\n4. 使用 `/etc/ldap.conf` 配置设置。\n5. 使用 `/etc/nsswitch.conf` 进行映射。\n\
  6. 使用 `ldapsearch` 测试连接。\n\n### FTP 服务器\n\nFTP（文件传输协议）服务器用于跨网络传输文件。目前有几种 FTP 服务器可用：\n\
  \n- `vsftpd`：非常安全的 FTP 守护进程是一个流行的选择。请记住，FTP 协议本身是不安全的，因为数据是非加密传输的。`vsftpd` 软件提供了额外功能，包括带宽限制、基于\
  \ IP 的限制以及按用户配置。\n- `Pure-FTPd`: 该软件被设计为简单（但安全）FTP 服务器。虽然它可能没有 `vsftpd` 那么样的强大功能，但它提供了大多数组织所需的组件。\n\
  - `ProFTPd`: 该软件设计得更易用且高度可配置。\n\n尽管这些服务器的配置方式有所不同，但它们的设计旨在执行相同的功能。因此，本书将详细介绍 `vsftpd`\
  \ 服务器。\n\n#### 配置 vsftpd\n\n你应该能够在任何发行版上使用 `yum` 或 `apt-get` 命令来安装 `vsftpd` 软件包（详情见第\
  \ 26 和 27 章）。事实上，它可能已经安装在你的系统中。`/etc/vsftpd/vsftpd.conf` 文件用于配置此服务器。与本书讨论的任何服务器一样，`vsftpd`\
  \ 有许多可用配置，但你只需要掌握一部分即可执行基本管理任务。\n\n##### 匿名 FTP\n\n匿名 FTP 功能允许人们即使没有本地用户账户也能连接到\
  \ FTP 服务器。通常，这种设置仅允许匿名用户下载内容而不上传，因为上传可能会引发法律问题和其他问题。\n\n**安全提示**\n\n允许匿名账户上传内容是一个糟糕的主意。一旦发现这种漏洞，人们可能会利用你的\
  \ FTP 服务器进行非法活动，例如共享版权内容（电影、音乐、书籍等）。这会让你的组织面临风险。\n\n此外，允许匿名账户上传内容可能会导致 `/var` 分区迅速填满。这会影响需要向\
  \ `/var` 分区写入数据的系统服务，例如邮件、日志文件和打印队列处理。\n\n\n\n\n\n`/etc/vsftpd/vsftpd.conf` 文件中的几个设置与匿名\
  \ FTP 有关。有关这些设置的详细信息，请参见表 22-3。\n\n### 表 22-3 匿名 FTP 设置\n\n| **设置** | **描述** |\n\
  | --- | --- |\n| `anonymous_enable=` | | 如果设置为 `YES`，则允许用户通过匿名账户连接。值 `NO` 则不允许匿名访问。重要：如果此设置不存在或被注释掉，则使用默认值\
  \ `YES`。 |\n| `anon_upload_enable=` | | 如果设置为 `YES`，则允许匿名用户上传内容。值 `NO` 则不允许匿名用户上传内容。重要：如果此设置不存在或被注释掉，则使用默认值\
  \ `NO`。 |\n| `anon_mkdir_write_enable=` | | 如果设置为 `YES`，则允许匿名用户创建目录。值 `NO` 则不允许匿名用户创建目录。重要：如果此设置不存在或被注释掉，则使用默认值\
  \ `NO`。 |\n| `local_enable=` | | 对于允许匿名访问的 FTP 服务器，通常会禁用普通用户的 FTP 访问。若不允许普通用户登录\
  \ FTP 服务器，请将 `local_enable` 设置为 `NO` 或注释掉 `local_enable` 选项，因为默认值为 `NO`。 |\n| `dirmessage_enable=`\
  \ | | 如果设置为 `YES`，当用户进入目录时将显示消息文件的内容。这对于提醒匿名用户正确使用此 FTP 服务器很有用。 |\n\n要测试您的 `vsftpd`\
  \ 服务器是否具有了的匿名设置，可以启动或重启服务器，然后尝试使用 `anonymous` 账户或 `ftp` 账户连接（从 FTP 的角度来看，它们是同一个账户）。示例\
  \ 22-9 展示了一个允许匿名访问的 FTP 服务器。\n\n### 示例 22-9 *允许匿名访问*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# ftp localhost\nConnected to localhost.localdomain.\n220 (vsFTPd 2.0.5)\n530\
  \ Please login with USER and PASS.\n530 Please login with USER and PASS.\nKERBEROS_V4\
  \ rejected as an authentication type\nName (localhost:root): anonymous\n331 Please\
  \ specify the password.\nPassword:\n230 Login successful.\nRemote system type is\
  \ UNIX.\nUsing binary mode to transfer files.\nftp>\n```\n\n注意，密码可以是任何内容。在“过去”，它应该是你的电子邮件地址，但现在没有必要了。（而且毕竟，它是如何知道那是你的电子邮件地址的呢？）\n\
  \n示例 22-10 展示了一个不允许匿名访问的 FTP 服务器。\n\n### 示例 22-10 *不允许匿名访问*\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource ~]# ftp localhost\nConnected to localhost.localdomain.\n220\
  \ (vsFTPd 2.0.5)\n530 Please login with USER and PASS.\n530 Please login with USER\
  \ and PASS.\nKERBEROS_V4 rejected as an authentication type\nName (localhost:root):\
  \ anonymous\n331 Please specify the password.\nPassword:\n530 Login incorrect.\n\
  Login failed.\nftp>\n```\n\n### 限制用户账户\n\n您可以选择限制哪些普通用户可以访问 FTP 服务器。这可以通过使用 PAM\
  \ 提供的功能（详见第 7 章，“管理用户账户”关于 PAM 的详细信息）或通过使用嵌入 `vsftpd` 服务器中的功能来实现。\n\nPAM 功能允许您向\
  \ `/etc/vsftpd.ftpusers` 文件添加用户账户名称，以防止用户通过 FTP 登录。该功能的存在是因为 `/etc/pam.d/vsftpd`\
  \ 文件中存在 `pam_listfile.so` 行，如示例 22-11 所示。\n\n#### 示例 22-11 *pam_listfile.so*\n\n\
  点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# more /etc/pam.d/vsftpd\n#%PAM-1.0\n\
  session    optional     pam_keyinit.so    force revoke\nauth       required    \
  \ pam_listfile.so item=user sense=deny file=/etc/vsftpd/ftpusers\nonerr=succeed\n\
  auth       required     pam_shells.so\nauth       include      system-auth\naccount\
  \    include      system-auth\nsession    include      system-auth\nsession    required\
  \     pam_loginuid.so\n```\n\n`/etc/vsftpd.ftpusers` 文件应该每行包含一个用户名：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# more /etc/vsftpd.ftpusers\nroot\nstudent\n```\n\
  \n### 安全要点\n\n这种 PAM 技术非常有用，因为通常你希望限制访问的少数几个用户。但是，如果你只想允许少数用户访问呢？如果你有 100 个用户，而只有\
  \ 5 个人可以通过 FTP 登录，那么需要将 95 个用户名添加到 `/etc/vsftpd.ftpusers` 文件中将非常痛苦。此外，你必须记住将任何新用户添加到此文件中，除非他们也应该被允许使用\
  \ FTP。\n\n另一个解决方案是使用 `userlist_enable`、`userlist_file` 和 `userlist_deny` 指令：\n\n\
  *   当设置为 `YES` 时，`userlist_enable` 指令允许您使用由 `userlist_file` 指令定义的文件来允许或阻止用户访问 FTP\
  \ 服务器。`userlist_enable` 指令默认设置为 `NO`。\n*   `userlist_file` 指令允许您指定一个存储用户账户列表的文件。如果未设置，则使用默认的\
  \ `/etc/vsftpd/user_list`。\n*   `userlist_deny` 指令允许您指定文件中的用户是被允许还是被拒绝访问。如果设置为 `YES`，它与\
  \ PAM `/etc/vsftpd.ftpusers` 文件的作用相同，即拒绝这些用户访问 FTP 服务器。该指令的默认值为 `YES`。\n\n这些指令的最常用的用法如下所示。这允许您将授权访问\
  \ FTP 服务器的用户名放在 `/etc/vsftpd/user_list` 文件中（其他用户将被拒绝）：\n\n点击此处查看代码图像\n\n```\nuserlist_enable=YES\n\
  # userlist_file  - 注释是因为大多数管理员使用默认值\nuserlist_deny=NO\n```\n\n#### 其他设置\n\n您可以在\
  \ `/etc/vsftpd/vsftpd.conf` 中设置许多指令。表 22-4 提供了一些重要指令的摘要。\n\n### 表 22-4 vsftpd.conf\
  \ 指令\n\n| **设置** | **描述** |\n| --- | --- |\n| `banner_file=` | banner 是在登录尝试之前显示的消息。默认情况下，`vsftpd`\
  \ 服务器显示其版本信息：`220 (vsFTPd 2.0.5)`这会导致安全问题，因为知道服务器版本可以为黑客提供利用服务器的信息。与其显示 `vsftpd`\
  \ 服务器版本，不如创建一个关于机密或正确使用的警告的文件，并将 `banner_file=` 指令指向该警告文件。 |\n| `ftpd_banner=` |\
  \ 只需要显示一个小的登录前消息吗？与其使用文件，只需使用 `ftpd_banner`*您的消息*。当然，将*您的消息*替换为您的实际消息。 |\n| `chroot_local_users=`\
  \ |设置为 `YES` 时，该指令将本地用户账户置于 chroot 环境，将系统访问限制在自己的家目录内。 |\n| `write_enable=` |设置为\
  \ `NO` 时，该指令不允许普通用户上传文件。 |\n| `max_clients=` | 限制同时连接到服务器的 FTP 客户端数量。这对防止 DDoS 攻击很有用。\
  \ |\n| `max_per_ip=` | 限制单个 IP 地址连接的 FTP 客户端数量。当使用 `max_clients` 指令时，这对于防止一个用户占用所有可能的连接非常重要。\
  \ |\n\n\n\n\n\n| `anon_max_rate=` | 匿名用户可以传输的速率（每秒字节数）。这限制了匿名用户通过数据传输操作对 FTP 服务器进行泛洪。\
  \ |\n| `local_max_rate=` | 普通用户可以传输的速率（每秒字节数）。这限制了本地用户通过数据传输操作对 FTP 服务器进行泛洪。 |\n\
  \n#### 连接到 FTP 服务器\n\n如前文所示，你通过执行 `ftp` 命令并紧跟 FTP 服务器的主机名或 IP 地址来连接到 FTP 服务器。一旦你成功登录，你就可以执行一系列命令来传输文件或在远程系统上执行其他任务。要查看这些命令的摘要，请在\
  \ `ftp>` 提示符下使用 `help` 命令，如示例 22-12 所示。\n\n**示例 22-12** *使用 `ftp> help` 查看命令摘要*\n\
  \n点击此处查看代码图像\n\n```\nftp> help\nCommands may be abbreviated.  Commands are:\n\n\
  !        dir         mdelete    qc         site\n$        disconnect  mdir     \
  \  sendport   size\naccount  exit        mget       put        status\nappend  \
  \ form        mkdir      pwd        struct\nascii    get         mls        quit\
  \       system\nbell     glob        mode       quote      sunique\nbinary   hash\
  \        modtime    recv       tenex\nbye      help        mput       reget    \
  \  tick\ncase     idle        newer      rstatus    trace\ncd       image      \
  \ nmap       rhelp      type\ncdup     ipany       nlist      rename     user\n\
  chmod    ipv4        ntrans     reset      umask\nclose    ipv6        open    \
  \   restart    verbose\ncr       lcd         prompt     rmdir      ?\ndelete   ls\
  \          passive    runique\ndebug    macdef      proxy      send\n```\n\n要查看其中某条命令的简要描述，请执行如下所示的命令：\n\
  \n点击此处查看代码图像\n\n```\nftp> help ls\nls            list contents of remote directory\n\
  ```\n\n需要注意的是，当命令在“远程”系统上执行操作时，它是在 FTP 服务器上执行该操作。例如，`cd` 命令更改远程服务器上的目录：\n\n点击此处查看代码图像\n\
  \n```\nftp> help cd\ncd            change remote working directory\nftp> cd /tmp\n\
  250 Directory successfully changed.\n```\n\n当命令在“本地”系统上执行操作时，它是在你最初运行 `ftp` 命令连接服务器的系统上执行的：\n\
  \n点击此处查看代码图像\n\n```\nftp> help lcd\nlcd           change local working directory\n\
  ftp>lcd /etc\nLocal directory now /etc\n```\n\n许多命令与你已经学习的 Linux 命令非常相似：\n\n点击此处查看代码图像\n\
  \n```\nftp> help ls\nls            list contents of remote directory\nftp> ls\n\
  200 PORT command successful. Consider using PASV.\n150 Here comes the directory\
  \ listing.\n-rw-------    1 1000     1000            0 Jan 21 15:44 config-err-qCpjfZ\n\
  226 Directory send OK.\n```\n\n**安全亮点**\n\n注意警告“Consider using PASV.”。这是一个重要的安全功能，将在下一节中讨论，标题为“主动模式与被动模式”。\n\
  \n要从当前本地目录复制文件到当前远程目录，使用 `put` 命令：`put file123`。可以使用 `mput` 命令和通配符复制多个文件：`mput *.txt`。\n\
  \n要从当前远程系统复制文件到当前本地目录，使用 `get` 命令：`get file123`。可以使用 `mget` 命令和通配符复制多个文件：`mget *.txt`。\n\
  \n#### 可能出现什么？\n\n与普通的 Linux 命令不同，复制文件时永远不要使用路径。命令始终对当前本地和远程目录生效。\n\n##### 主动模式与被动模式\n\
  \n要理解主动模式和被动模式的区别，你首先需要理解防火墙中的一个常用功能。管理员通常希望允许内部机器向外部机器建立连接，但在少数特殊情况外，防止反向连接。\n\n\
  例如，你的公司 Web 服务器可能位于公司防火墙之后，因此防火墙可能配置为允许端口 80 和 443 的入站连接。从防火墙外部任何其他端口发起的通信都会被拦截。\n\
  \n通常，从防火墙内部发起的任何通信（无论端口如何）都是被允许的。因此，如果你位于防火墙内的主机上并尝试连接到防火墙外的 SSH 服务器，防火墙应该允许该连接。\n\
  \n这对于几乎所有服务器都有效，但 FTP 是一个例外。默认情况下，FTP 连接使用名为“主动”的功能。在主动 FTP 连接中，FTP 客户端使用随机的非特权端口（大于\
  \ 1023 的端口号）来发起到 FTP 服务器上 21 端口（称为命令端口）的连接。FTP 服务器最初做出响应。\n\n\n\n\n\nSecure Shell（安全壳）旨在取代不安全的远程通信操作，例如\
  \ `telnet`、`ftp`、`rlogin`、`rsh`、`rcp` 和 `rexec` 命令/协议。以前通信方法的主要问题是它们以明文格式跨网络传输，而不是加密格式。在某些情况下（例如\
  \ `telnet` 和 `ftp`），这可能包括在网络上以明文发送用户账户数据（用户名和密码）。\n\nSecure Shell（SSH）协议通过对跨网络传输的数据加密提供了更高水平的安全。SSH\
  \ 已经成为 Linux 的一种标准，几乎所有的分发版都默认包含了客户端和服务器软件。如果你的系统上没有安装这些软件，你应该安装 `openssh`、`openssh-server`、`openssh-clients`\
  \ 和 `openssh-askpass` 软件包（有关安装软件的更多细节，请参见第 26 章）。\n\n## 配置 Secure Shell 服务器\n\n\
  `/etc/ssh` 目录是存储 Secure Shell 配置文件的位置。SSH 服务器的配置文件是 `/etc/ssh/sshd_config`。不要将其与\
  \ `/etc/ssh/ssh_config` 文件混淆，后者用于配置客户端程序，例如 `ssh`、`scp` 和 `sftp` 命令。\n\n### 基础配置设置\n\
  \n两种不同的 SSH 协议编号为 1 和 2。这些并不是版本，而是为了提供安全数据连接而开发的两种独立协议。曾有一段时间两种协议都很常用，但现在几乎所有的 SSH\
  \ 客户端只使用协议 2。要设置你的 SSH 服务器接受的协议，请使用 `Protocol` 关键字：\n\n```\nProtocol 2\n```\n\n\
  你有某些需要协议 1 的旧版 SSH 客户端，可以在 `/etc/ssh/sshd_config` 文件中使用以下关键字设置，让你的 SSH 服务器接受两种协议连接：\n\
  \n```\nProtocol 1,2\n```\n\n**安全亮点**\n\n协议 1 不再被支持，应尽可能避免。协议 2 具有更好的安全特性并且正在积极接受改进。通常情况下，你应该始终远离不再支持或不再积极维护的软件，因为当黑客发现安全漏洞时，这些漏洞不会被修复。\n\
  \n在某些情况下，你可能拥有多个网卡（或虚拟接口），并且你想限制 SSH 服务器仅监听某些网卡。要实现这一点，请使用 `ListenAddress` 关键字并指定分配给\
  \ SSH 应接受连接的网卡的 IP 地址。点击此处查看代码图像\n\n```\nListenAddress 192.168.1.100:192.168.1.101\n\
  ```\n\nSSH 服务器监听的标准端口号是 22 端口。你可以通过 `Port` 关键字修改 SSH 服务器以监听另一个端口：\n\n```\nPort 2096\n\
  ```\n\n**安全亮点**\n\n使用非标准端口会让黑客发现服务变得稍微困难一些。然而，有一些工具允许黑客探测系统中“开放”的端口（即服务提供响应的端口）。因此，更改端口并不会完全隐藏\
  \ SSH 服务。但是，许多黑客也只是使用带有硬编码值（如端口号）的脚本，因此你可能通过使用不同的端口号来避免随意的攻击尝试。\n\n你可能需要更改 SSH 服务器记录的日志消息类型。这可以通过\
  \ `LogLevel` 关键字进行设置。以下是可用级别：\n\n* `QUIET`\n* `FATAL`\n* `ERROR`\n* `INFO`\n* `VERBOSE`\n\
  * `DEBUG`\n* `DEBUG1`（同 `DEBUG`）\n* `DEBUG2`\n* `DEBUG3`\n\n类似于系统日志（参见第 25 章，“系统日志](#ch25.xhtml_ch25)”），这些级别是层层级的。例如，`INFO`\
  \ 级别包含了 `ERROR` 和 `FATAL` 级别生成的所有日志（技术上也包含 `QUIET`，但该级别没有消息）。切换到 `DEBUG`、`DEBUG2`\
  \ 或 `DEBUG3` 时要小心，因为可能会导致真实 SSH 服务器出现安全问题。\n\n**安全亮点**\n\n`sshd_config` 手页指出：“使用\
  \ DEBUG 级别的日志会违反用户隐私，不建议这样做。”如果你在测试机器上将 `LogLevel` 关键字设置为 `DEBUG` 并重启 SSH 服务器，连接到\
  \ SSH 服务器并查看 `/var/log/secure` 文件（Red Hat 系）或 `/var/log/auth.log` 文件（Debian），你应该看到原因（如用户名和密码等数据被捕获）。\n\
  \n### 影响用户访问的设置\n\n要禁止 root 用户通过 SSH 登录，请将 `PermitRootLogin` 值改为 `no`：\n\n```\n\
  PermitRootLogin no\n```\n\n**安全亮点**\n\n你可能希望考虑不允许 root 用户直接登录，特别是当系统连接到互联网时。更好的选择是允许使用\
  \ `su` 或 `sudo` 命令许可普通用户登录。\n\n有一个没有理由通过 SSH 登录的普通用户怎么办？在这种情况下你有选择：`AllowUsers`\
  \ 或 `DenyUsers`。如果你使用 `AllowUsers` 关键字，只允许这些用户连接到 SSH 服务器。如果你使用 `DenyUsers` 关键字，除了列出的用户外，所有用户都可以连接到\
  \ SSH 服务器。注意，如果同时使用这两个关键字，`DenyUsers` 优先。\n\n你可以使用通配符匹配模式：\n\n点击此处查看代码图像\n\n```\n\
  DenyUsers guest*#拒绝任何以 \"guest\" 开头的用户名\nDenyUsers ????app#拒绝任何长度为 4 字符且以 \"app\"\
  \ 结尾的用户\n```\n\n**安全亮点**\n\n你还可以使用 `AllowGroups` 和 `DenyGroups` 关键字。\n\nSSH 服务器提供了几种不同的身份验证方法。以下是你应该了解的关键方法：\n\
  \n* `PasswordAuthentication`：当设置为 `yes`（默认值）时，此设置允许用户通过提供用户名和密码登录。如果设置为 `no`，用户仅可以使用身份密钥登录。身份密钥将在本章稍后的部分详细介绍。\n\
  \n* `PubkeyAuthentication`：当此设置为 `yes` 时，用户可以在服务器上存储公钥。公钥是由用户客户端系统上的 `ssh-keygen`\
  \ 命令生成的。该过程将在本章的后续部分进行更详细的介绍。\n\n表 22-5 描述了影响用户登录的额外有用 SSH 服务器设置。\n\n**表 22-5**\
  \ SSH 服务器设置\n\n| **设置** | **描述** |\n| --- | --- |\n| `Banner` | 指定一个文件，在用户身份验证之前显示该文件的内容。\
  \ |\n| `PrintMotd` | 如果设置为 `yes`（默认值），当用户通过 SSH 登录系统时，将显示 `/etc/motd` 文件的内容。 |\n\
  | `X11Forwarding` | 如果设置为 `yes`（默认值为 `no`），这提供了一种简单的方法，允许在 SSH 服务器上执行图形程序并显示在 SSH\
  \ 客户端上。这要求执行 SSH 命令（`ssh` 命令）时带有 `-X` 或 `-Y` 选项。 |\n| `MaxAuthTries` | 设置一个数值，指示用户输入正确密码的尝试次数。默认值为\
  \ `6`。 |\n\n\n\n\n\n| `PermitEmptyPasswords` | 如果此项设置为 `no`（默认值），如果用户账户的密码字段为空，用户将无法通过\
  \ SSH 登录。 |\n\n## Secure Shell 客户端命令\n\n你需要了解几种不同的 SSH 客户端命令，包括以下这些：\n\n* `ssh`:\
  \ 允许你登录 SSH 服务器并通过命令行在服务器上进行工作\n\n* `scp`: 允许你通过命令行向 SSH 服务器传输文件或从 SSH 服务器传输文件\n\
  \n* `sftp`: 允许你连接到 SSH 服务器并执行类似 FTP 的命令\n\n你应该了解这些命令中每个的功能，以及 `/etc/ssh/ssh_config`\
  \ 文件中的一些关键设置。\n\n### ssh_config 文件\n\n`ssh_config` 文件中的几个组件与 `sshd_config` 文件不同。首先，有一个系统级的\
  \ `/etc/ssh/ssh_config` 文件，它适用于所有用户。此外，每个用户都可以在其家目录（`~/.ssh/config`）下创建一个文件，该文件可用于覆盖\
  \ `/etc/ssh/ssh_config` 文件中的设置。\n\n除了文件之外，命令行选项也可以覆盖配置文件中指定的值。以下是所有这些信息的解析顺序：\n\n\
  1. 命令行选项\n2. 用户的 `~/.ssh/config` 文件\n3. `/etc/ssh/ssh_config` 文件\n\n**重要**\n\n找到第一个参数即为使用的参数。例如，如果在用户的\
  \ `~/.ssh/config` 文件中设置了 `ConnectTimeout`，而在 `/etc/ssh/ssh_config` 文件中设置了不同的值，则将使用用户的配置文件来设置此值。\n\
  \n`ssh_config` 文件与 `sshd_config` 文件之间的另一个重要区别是，`ssh_config` 文件中的大多数设置都是 `Host` 设置的子设置。`Host`\
  \ 设置允许你为你正在连接的不同的 SSH 服务器指定不同的规则。例如，以下内容将在连接到 `server1.onecoursesource.com` 时应用\
  \ `0` 的 `ConnectTimeout` 值，并且在连接到 `test.example.com` 时应用 `600` 的值：\n\n点击此处查看代码图像\n\
  \n```\nHost server1.onecoursesource.com\nConnectTimeout 0\nHost test.example.com\n\
  ConnectTimeout 600\n```\n\n`ssh_config` 文件中的许多设置与 SSH 服务器配置文件中的设置相关。例如，回以下 `/etc/ssh/sshd_config`\
  \ 文件设置：\n\n```\nX11Forwarding yes\n```\n\n在客户端，通常通过在执行基于 `ssh` 的命令时使用 `-X` 或 `-Y`\
  \ 选项来启用此功能。但是，如果你想让此功能成为默认，可以在 `/etc/ssh/ssd_config` 或 `~/.ssh/config` 文件中使用以下设置：\n\
  \n```\nForwardX11 and ForwardX11Trusted\n```\n\n### ssh 命令\n\n当你第一次尝试通过 `ssh` 命令连接到机器时，系统会提示你验证\
  \ RSA 密钥指纹：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$ ssh 192.168.1.22\n\
  无法建立主机 '192.168.1.22 (192.168.1.22)' 的真实性。\nRSA 密钥指纹为 7a:9f:9b:0b:7b:06:3a:f0:97:d1:c7:e9:94:a8:84:03。\n\
  你确定要继续连接吗 (yes/no)？yes\n警告: 已将 '192.168.1.22' (RSA) 永久添加到已知主机列表中。\nstudent@192.168.1.22'\
  \ 的密码:\n[student@testmachine ~]$\n```\n\n将 RSA 密钥指纹看作就像一个真实的指纹。许多现代笔记本电脑和手机都有指纹扫描仪，通过验证你的身份来作为登录或解锁设备的手段。要使用此功能，你首先需要注册它。当你对\
  \ `ssh` 提示“你确定要继续连接吗 (yes/no)?”回答 `yes` 时，发生的就是这种情况。\n\n当你在笔记本电脑或手机上注册指纹时，设备就认为你就是你所声称的（账户或设备的所有者）。本质上，这就是接受\
  \ RSA 密钥指纹时发生的情况。你是在接受你所连接的计算机是正确的计算机。\n\n将来连接到这台计算机的尝试将触发一个过程，在该过程中 SSH 服务器上的当前指纹将与你首次连接时接受的指纹匹配。此指纹存储在\
  \ `~/.ssh/known_hosts` 文件中（每个用户有一组独立的已接受指纹）：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource\
  \ ~]$ cat .ssh/known_hosts\n192.168.1.22 ssh-rsa AAAAB3NzaC1yc2EAAAABIwAAAQEAz98zgUakM93uWfXw/iF5QhCsPrSnNKHVBD/\n\
  o9qwSTh8sP6MKtna8vMw1U2PltXN33/BMm7hrT0sWe1hjkAqFjrx7Hp6uzjs1ikfPSRerybsE+CAR+KywbiiInvp\n\
  4ezm/IHPjhwjasskSzcWHwdQ+1YaYNkoaoGrRz87/xbiXUxWVb7VVn6RZKxiVIh2+XgCr4dWct0ciJf3eM9eel-\n\
  2SL81G5M1jUMB8g9jzUpWITvuj2e86LJw8RwpqRZ9oUaCwZFkp8FaBpLvA1xBTaGIjB6J9qBAoERfTv5TChqG-\n\
  MoK1zyz/KF9LC/22dwZ2hnU21fdS34COJ6RuxNA4P/hSGFxrw==\n```\n\n作为用户，你并不真的需要了解指纹的细节；此过程是由\
  \ SSH 客户端工具和 SSH 服务器处理的。\n\n\n\n\n\n```\n[student@onecoursesource ~]$ sftp 192.168.1.22\n\
  Connecting to 192.168.1.22...\nstudent@192.168.1.22's password:\nsftp>cd /tmp\n\
  sftp>ls\ngconfd-root            hosts                  keyring-GhtP1j         mapping-root\n\
  nis.6788.ldif          nis.6818.ldif          nis.6836.ldif          orbit-root\n\
  ssh-ysXgwO2672         uplist                 virtual-root.9QNCsb\nsftp>get hosts\n\
  Fetching /tmp/hosts to hosts\n/tmp/hosts                                       \
  \   100%  187     0.2KB/s   00:00\nsftp>ls h*\nhosts\nsftp>quit\n```\n\n### 高级 SSH\
  \ 特性\n\n新手管理员经常问的一个问题是：SSH 如何加密数据传输以确保其安全？所使用的技术涉及公钥和私钥。当 SSH 客户端连接到 SSH 服务器时，服务器会向客户端提供其公钥。\n\
  \n在建立会话期间，客户端和服务器会生成一个对称会话密钥，该密钥随后用于加密主机之间交换的所有数据。然后，客户端在将所有数据发送到服务器之前，使用公钥进行加密。数据只能通过私钥解密，而私钥仅存储在服务器上。\n\
  \n这些密钥在安装 SSH 服务器时创建，并存储在 `/etc/ssh` 目录。\n\n如果用户经常登录到特定的 SSH 服务器，该用户可能希望设置无密码登录。要做到这一点，您按照以下步骤操作：\n\
  \n**步骤 1.** 在 SSH 客户端机器上，执行 `ssh-keygen` 命令，如示例 22-15 所示。当提示输入密码短时，按回车键留空（或者您可以使用\
  \ `ssh-keygen` 命令的 `-N` 选项，这样就不会有密码短提示）。\n\n**示例 22-15** *ssh-keygen 命令*\n\n点击此处查看代码图像\n\
  \n```\n[student@onecoursesource ~]$ ssh-keygen -t rsa\nGenerating public/private\
  \ rsa key pair.\nEnter file in which to save the key (/home/student/.ssh/id_rsa):\n\
  Enter passphrase (empty for no passphrase):\nEnter same passphrase again:\nYour\
  \ identification has been saved in /home/student/.ssh/id_rsa.\nYour public key has\
  \ been saved in /home/student/.ssh/id_rsa.pub.\nThe key fingerprint is:\nb4:77:29:40:b8:aa:d1:1c:3a:cb:e6:b8:5d:9b:07:fb\
  \ student@localhost.localdomain\nThe key's randomart image is:\n+--[ RSA 2048]----+\n\
  |       ..       |\n|      ..        |\n|       .o        |\n|    . .. o   .  |\n\
  |   + o  S o o    |\n|  + =    . o     |\n| . =.o           |\n| o=..o.        \
  \ |\n|o+o ooE          |\n+-----------------+\n```\n\n**步骤 2.** 现在 `~/.ssh/id_rsa.pub`\
  \ 文件中有一个公钥。这需要将其复制到远程服务器，放入远程机器上账户的 `~/.ssh/authorized_keys` 文件中（您可能需要创建此目录并将权限设置为\
  \ `770`）。这可以使用以下命令完成：\n\n点击此处查看代码图像\n\n```\nstudent@localhost ~]$ cat .ssh/id_rsa.pub\
  \ | ssh 192.168.1.22 'cat >> .ssh/authorized_keys'\nstudent@192.168.1.22's password:\n\
  ```\n\n**步骤 3.** 将 `authorized_keys` 文件的权限设置为 `640`：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource\
  \ ~]$ ssh 192.168.1.22 'chmod 640 /home/student/.ssh/\nauthorized_keys'\nstudent@192.168.1.22's\
  \ password:\n```\n\n### 安全亮点\n\n在某些发行版中，您可以使用 `ssh-copy-id` 命令同时完成步骤 2 和步骤 3。然而，您也应该知道如何使用这些步骤中描述的手动方法。\n\
  \n您现在应该能够无密码登录 SSH 服务器：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource ~]$ ssh 192.168.1.22\
  \ date\nMon Jan 11 16:59:32 PST 2019\n```\n\n一些安全专家指出，为密钥没有设置密码短会带来安全风险。但是，如果您设置了密码短，每次从客户端尝试连接到\
  \ SSH 服务器时，不是要求输入密码，而是要求输入密码短（而输入密码/密码短正是您最初想要避免的）：\n\n点击此处查看代码图像\n\n```\n[student@onecoursesource\
  \ ~]$ ssh 192.168.1.22 date\nEnter passphrase for key '/home/student/.ssh/id_rsa':\n\
  Mon Jan 11 17:17:00 PST 2019\n```\n\n一种可以为 RSA 密钥设置密码短并避免每次连接都输入它的方法是使用名为 `ssh-agent`\
  \ 的实用程序。以下步骤演示了工作原理：\n\n**步骤 1.** 使用 `ssh-agent` 实用启动一个新的 BASH shell：\n\n```\nssh-agent\
  \ /bin/bash\n```\n\n**步骤 2.** 执行以下命令：\n\n```\nssh- add ~/.ssh/id_rsa\n```\n\n从现在起，当您使用该\
  \ `ssh-agent` shell 远程连接到 SSH 服务器时，连接将无需密码短。\n\n### 总结\n\n本章的重点是配置、安全以及连接到密钥服务器。您学习了\
  \ LDAP 服务器以及它如何为网络用户账户等功能提供基于目录的信息。您还学习了如何使用 FTP 服务器共享文件。最后，您学习了如何通过 SSH 连接到远程 Linux\
  \ 系统。通过 SSH，您已经能够登录到远程系统并执行命令。\n\n## 关键术语\n\nLDAP\n\nOpenLDAP\n\nActive Directory\n\
  \nobject\n\nattribute\n\nschema\n\nLDIF\n\nDN\n\nCN\n\nSSSD\n\nwhite pages\n\nanonymous\
  \ FTP\n\nactive FTP mode\n\npassive FTP mode\n\n## 复习题\n\n**1.** 一个 _____ 是对象的一个组成部分。\n\
  \n**2.** 用于创建 LDAP 对象的文件的格式被称为 _____。\n\n1. schema\n2. LDAP\n3. LDIF\n4. DN\n\n\
  **3.** 使用哪个命令来创建 rootdn 密码？\n\n1. `rootpw`\n2. `slappasswd`\n3. `ldappasswd`\n4.\
  \ `rootpasswd`\n\n**4.** OpenLDAP 目录的权限应该设置为 _____。\n\n**5.** 使用 _____ 命令可以测试 OpenLDAP\
  \ 配置。\n\n**6.** 在命令行中填充空白以提供 rootdn 密码：\n\n点击此处查看代码图像\n\n```\nldapadd -x -D \"cn=root,dc=OCS,dc=com\"\
  \ _____ rootdnp -f newpasswd.ldif\n```\n\n1. -p\n2. -r\n3. -a\n4. -w\n\n**7.** 使用基于\
  \ `ldap` 的命令（如 `ldapsearch`）时，哪个选项表示“使用简单认证”？\n\n1. -S\n2. -x\n3. -p\n4. -a\n\n\
  **8.** `vsftpd.conf` 中的 _____ 指令用于允许匿名 FTP 连接。\n\n**9.** 以下哪些 `vsftpd.conf` 指令与创建允许特定用户访问\
  \ FTP 服务器的列表有关（选择所有适用）。\n\n1. `userlist_enable`\n2. `userlist_file`\n3. `userlist_allow`\n\
  4. `userlist_deny`\n\n**10.** `/etc/ssh/sshd_config` 文件中的 _____ 设置用于指定在哪些接口上接受 SSH\
  \ 连接。\n\n**11.** `/etc/ssh/sshd_config` 文件中的 _____ 设置用于指定哪些用户可以连接到 SSH 服务器。\n\n\n\
  \n\n\n对于每个网络服务，可以使用多种方法来确保其安全性。例如，保护 BIND DNS 服务的部分方法包括将 BIND 置于 chroot 监狱中、实施拆分\
  \ BIND 配置以及使用事务签名（这些在第 20 章“网络服务配置：基本服务”中都介绍过），但可以使用许多额外的安全设置来使 BIND 服务器更安全。\n\n\
  您的安全策略应该包含特定的步骤，以妥善地保护每个基于网络的服务。这可能是一项艰巨的任务，因为有许多不同的服务，其中许多本书并未涵盖。\n\n之前的三个章节涵盖了几个基于网络的服务。书中涵盖了每个服务的本质安全功能，因此在本章中将不再重复介绍。然而，请意识到，在创建安全策略时，这些安全功能是非常重要的。同样重要的是这些基于网络的服务所提供的额外安全功能（如果你最终在生产环境中实现这些服务，你将需要对此进行更多探索）。\n\
  \n此外，书的后部分将更详细地介绍某些网络级安全功能。例如，防火墙（在第 31 章“防火墙”中详细介绍）可用于阻塞进入系统的传入连接。尽管防火墙是任何网络安全策略的重要部分，但本章并不讨论它们。相反，本章专注于网络安全策略的三个关键组件：内核参数、TCP\
  \ Wrappers 和网络时间协议。\n\n阅读本章并完成练习后，你将能够完成操作：\n\n* 修改内核参数以提供更好的网络安全\n* 实现 TCP Wrappers\n\
  * 手动配置系统时间\n* 配置系统使用网络时间协议服务器\n\n### 内核参数\n\n第 28 章“系统启动”向你介绍了一个与内核参数相关的主题。你可以使用内核参数通过调整关键功能来修改内核的行为。它们可以更改内核管理设备的方式、优化内存使用并增强系统的安全性。\n\
  \n由于第 28 章中提供了内核参数的完整讨论，本章将重点关注内核参数的要要素以及一些对网络安全重要的内核参数。\n\n#### `/etc/sysctl.conf`\
  \ 文件\n\n可以通过修改 `/etc/sysctl.conf` 文件来修改内核参数；请参阅示例 23-1 查看该文件的示例。\n\n**示例 23-1**\
  \ `/etc/sysctl.conf` 文件\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#head /etc/sysctl.conf\n\
  # Kernel sysctl configuration file for Red Hat Linux\n#\n# 对于二进制值，0 表示禁用，1 表示启用。更多详情请参阅\
  \ sysctl(8) 和\n# sysctl.conf(5)。\n\n# 控制 IP 数据包转发\nnet.ipv4-ip_forward = 0\n\n#\
  \ 控制源路由验证\nnet.ipv4.conf.default.rp_filter = 1\n```\n\n若要修改内核参数，你需要在该文件中将参数的值（例如\
  \ `net.ipv4-ip_forward`）设置为新值。例如，`net.ipv4-ip_forward` 内核参数决定了该系统是否充当路由器。路由器将在网络之间转发网络数据包。如果你将\
  \ `net.ipv4-ip_forward` 设置为 1（0=假或否，1=真或是），那么这台机器就可以充当路由器。一个完整的路由器还需要两个网络连接（每个网络一个），但本讨论的重点在于说明如何更改内核参数，而不是如何设置路由器。\n\
  \n注意，你对 `/etc/sysctl.conf` 文件所做的任何更改都不会立即生效，因为该文件的内容仅在系统启动时读取。请重启系统或运行 `systemctl\
  \ --system` 命令以使更改立即生效。\n\n重要的是，有数千千个内核参数，其中许多设计是为了使系统更安全。本章仅涵盖了一些较常见的基于安全性的内核参数。\n\
  \n#### 忽略 ping 请求\n\n`ping` 命令通常用于确定远程主机是否可以通过网络访问。它通过向远程主机发送 Internet 控制消息协议 (ICMP)\
  \ 回显请求数据包来实现，如果远程系统可达，则期望收到响应数据包。这构成了两个安全挑战：\n\n* 黑客可以使用 `ping` 来探测活动系统，试图寻找他们可以入侵的系统。虽然这不是探测活动系统的唯一方法（参见第\
  \ 30 章“足迹扫描”查看其他方法），但这是一个非常常用的方法。因此，对于关键任务系统，最好忽略 `ping` 请求。\n\n* 响应 `ping` 请求可能会导致系统容易受到拒绝服务\
  \ (DoS) 攻击。DoS 攻击是指向系统发送大量网络数据包，导致系统难以处理所有数据。\n\n若要忽略 `ping` 请求，请在 `/etc/sysctl.conf`\
  \ 文件中使用以下设置：\n\n点击此处查看代码图像\n\n```\nnet.ipv4.icmp_echo_ignore_all = 1\n```\n\n**可能会出现什么问题？**\n\
  \n如果你将所有系统设置为忽略 `ping` 请求，这意味着你无法使用 `ping` 命令来确定机器是否通过网络做出响应。在尝试排除网络问题时请记住这一点。\n\
  \n#### 忽略广播请求\n\n广播请求可用于 DoS 和 DDoS 攻击，其技术与 `ping` 请求类似。若要忽略广播请求，请在 `/etc/sysctl.conf`\
  \ 文件中使用以下设置：\n\n点击此处查看代码图像\n\n```\nnet.ipv4.icmp_echo_ignore_broadcasts = 1\n```\n\
  \n#### 启用 SYN 保护\n\nSYN 洪水攻击 是另一种 DoS 攻击，使用 SYN 请求使系统无响应。若要忽略 SYN 请求，请在 `/etc/sysctl.conf`\
  \ 文件中使用以下设置：\n\n点击此处查看代码图像\n\n```\nnet.ipv4.tcp_syncookies = 1\n```\n\n#### 禁用 IP\
  \ 源路由\n\nIP 源路由 是一种允许数据包发送者指定应采取的网络路由的功能。此功能绕过了路由表并使你的系统变得脆弱，因为黑客可以利用中间人攻击（在客户端到服务器的通信之间插入系统），或者他们可以使用此功能来映射你的网络或绕过你的防火墙。\n\
  \n每个网络接口都有独立的 IP 源路由内核参数。因此，若要从特定的网络设备禁用此功能，请使用如下设置：\n\n点击此处查看代码图像\n\n```\nnet.ipv4.conf.eth0.accept_source_route\
  \ = 0\n```\n\n### TCP Wrappers\n\n\n\n\n当编译了 `libwrap](#gloss.xhtml_gloss116)` 库的服务器程序在系统尝试访问该服务时调用该库时，就会使用\
  \ TCP Wrappers。例如，当有人尝试连接到 Secure Shell 服务时，Secure Shell 服务器（`sshd`）会调用 `libwrap`\
  \ 库。`libwrap` 库使用配置文件根据发起连接的机器来决定是否允许 SSH 连接。使用的文件是 `/etc/hosts.allow` 和 `/etc/hosts.deny`\
  \ 文件。\n\n在探索配置文件之前，你首先需要确定哪些服务使用了 `libwrap` 库。实现此点的简单方法是使用 `ldd` 命令：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# ldd /usr/sbin/sshd | grep libwrap\nlibwrap.so.0\
  \ => /lib64/libwrap.so.0 (0x00007efeb9df7000)\n```\n\n如果 `ldd` 命令返回 `libwrap.so.0`，则该程序使用了\
  \ TCP Wrappers。找到这些“被 libwrap ”的服务的一种方法是执行如示例 23-2 所示的命令。\n\n**示例 23-2** 显示“被 libwrap\
  \ ”的程序\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# for i in /usr/sbin/*\n>do\n\
  >ldd $i | grep libwrap && echo $i\n>done\nlibwrap.so.0 => /lib64/libwrap.so.0 (0x00007facd0b05000)\n\
  /usr/sbin/exportfs\nlibwrap.so.0 => /lib64/libwrap.so.0 (0x00007fd295593000)\n/usr/sbin/rpcinfo\n\
  libwrap.so.0 => /lib64/libwrap.so.0 (0x00007fd87537c000)\n/usr/sbin/rpc.mountd\n\
  libwrap.so.0 => /lib64/libwrap.so.0 (0x00007f5251e30000)\n/usr/sbin/rpc.rquotad\n\
  libwrap.so.0 => /lib64/libwrap.so.0 (0x00007f96e8b39000)\n/usr/sbin/sshd\nlibwrap.so.0\
  \ => /lib64/libwrap.so.0 (0x00007f5a93020000)\n/usr/sbin/xinetd\n```\n\n**注意**\n\
  \n`/usr/bin` 和 `/sbin` 目录中可能存在使用 `libwrap` 库的服务，因此你也应该搜索这些目录。\n\n要理解 `/etc/hosts.allow`\
  \ 和 `/etc/hosts.deny` 文件如何工作，你首先需要理解这两个文件的评估顺序。当服务（例如 `sshd`）请求 `libwrap` 库授权连接时，它会首先查找\
  \ `/etc/hosts.allow` 文件以确定是否有任何匹配的规则。规则将进行更详细的描述，但本质上包含一个服务（`sshd`）和一个机器规格（IP 地址、主机名等）。如果\
  \ `/etc/hosts.allow` 文件中有匹配的规则，该库工具将告诉服务允许此类访问。\n\n如果 `/etc/hosts.allow` 文件中没有匹配的规则，则\
  \ `libwrap` 库将查看 `/etc/hosts.deny` 文件中的规则。如果该文件中存在匹配规则，则 `libwrap` 库将告诉服务不要允许此类访问。\n\
  \n如果两个文件中都没有匹配的规则，则 `libwrap` 库将告诉服务允许此类访问。这意味着默认策略是允许访问，你需要在 `/etc/hosts.deny`\
  \ 中设置一条规则来阻止访问。请参见图 23-1 获取此过程的可视化表示。\n\n![Image](img/23fig01.jpg)\n\n**图 23-1**\
  \ TCP Wrappers\n\n`/etc/hosts.allow` 和 `/etc/hosts.deny` 文件中规则的语法为：\n\n点击此处查看代码图像\n\
  \n```\nservice_list: client_list [options]\n```\n\n服务是二进制可执行服务程序的名称（例如，`sshd` 或\
  \ `xinetd`）。客户端列表是该规则应适用于哪些系统。考虑以下简单示例：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# more /etc/hosts.allow\n[root@onecoursesource ~]# more /etc/hosts.deny\nsshd:\
  \ test.onecoursesource.com\n```\n\n在之前的示例中，所有客户端都允许访问本地系统以连接到任何服务，但来自 test.onecoursesource.com\
  \ 的客户端除。客户端列表可以包含多个服务：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# more /etc/hosts.allow\n\
  [root@onecoursesource ~]# more /etc/hosts.deny\nsshd: test.onecoursesource.com\n\
  ```\n\n上一个示例将拒绝 `sshd`。关键字 `ALL` 也可以用于指定所有服务：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# more /etc/hosts.allow\n[root@onecoursesource ~]# more /etc/hosts.deny\nsshd:\
  \ test.onecoursesource.com\n```\n\n以下列表显示了一些更常用的格式：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# more /etc/hosts.allow\n[root@onecoursesource ~]# more /etc/hosts.deny\nsshd:\
  \ test.onecoursesource.com\n```\n\n### 网络时间\n\n保持准确的时间对于网络安全至关重要。尽管使用 NTP 服务器更为理想，但在本节中，我们首先介绍如何手动设置系统时钟。\n\
  \n#### 手动设置时间\n\n你可以使用 `date` 命令显示系统时钟：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]#date\nTue Feb 28 22:15:33 PST 2019\n```\n\n`date` 命令的输出通常用于生成唯一文件名，因为该命令的格式非常灵活。这是一个示例：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]#date \"+%F\"\n2019-02-28\n[root@onecoursesource\
  \ ~]#touch data-$(date \"+%F\")\n[root@onecoursesource ~]#ls data*\ndata-2019-02-28\n\
  ```\n\n表 23-1 详细列了一些更常用的日期格式。\n\n**表 23-1** 日期格式\n\n| **格式** | **描述** |\n| --- |\
