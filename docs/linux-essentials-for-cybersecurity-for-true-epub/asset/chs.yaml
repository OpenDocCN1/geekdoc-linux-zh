  \ iSCSI。作为目标系统的系统也可以作为启动器。这在测试之外通常不会这样做，但它确实为你提供了一个测试这些命令的方便方法。\n- 你可能会发现 iSCSI\
  \ 在不同发行版上的工作存在细微差异。书中提供的 iSCSI 示例是在 CentOS 7.x 系统上执行的。\n\n### 总结\n\n在本章中你学习了如何管理远程存储设备。首先，你接触了\
