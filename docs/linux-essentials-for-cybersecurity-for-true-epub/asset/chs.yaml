  \ dhcpd: All rights reserved.\nJan  6 20:26:16 localhost dhcpd: For info, please\
  \ visit http://www.isc.org/sw/dhcp/\nJan  6 20:26:16 localhost dhcpd: Address range\
  \ 192.168.1.128 to 192.168.1.254 not on net\n192.168.0.0/255.255.255.0!\nJan  6\
  \ 20:26:16 localhost dhcpd:\nJan  6 20:26:16 localhost dhcpd: If you did not get\
  \ this software from ftp.isc.org, please\nJan  6 20:26:16 localhost dhcpd: get the\
  \ latest from ftp.isc.org and install that before\nJan  6 20:26:16 localhost dhcpd:\
  \ requesting help.\nJan  6 20:26:16 localhost dhcpd:\nJan  6 20:26:16 localhost\
