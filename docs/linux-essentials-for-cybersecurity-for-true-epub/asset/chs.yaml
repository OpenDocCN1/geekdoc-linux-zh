  b.root-servers.net.    3600000 IN      A       192.228.79.201\nc.root-servers.net.\
  \    3600000 IN      A       192.33.4.12\nd.root-servers.net.    3600000 IN    \
  \  A       199.7.91.13\nd.root-servers.net.    3600000 IN      AAAA    2001:500:2d::d\n\
  e.root-servers.net.    3600000 IN      A       192.203.230.10\nf.root-servers.net.\
  \    3600000 IN      A       192.5.5.241\nf.root-servers.net.    3600000 IN    \
  \  AAAA    2001:500:2f::f\ng.root-servers.net.    3600000 IN      A       192.112.36.4\n\
  h.root-servers.net.    3600000 IN      A       128.63.2.53\nh.root-servers.net.\
  \    3600000 IN      AAAA    2001:500:1::803f:235\ni.root-servers.net.    3600000\
  \ IN      A       192.36.148.17\ni.root-servers.net.    3600000 IN      AAAA   \
  \ 2001:7fe::53\nj.root-servers.net.    3600000 IN      A       192.58.128.30\nj.root-servers.net.\
  \    3600000 IN      AAAA    2001:503:c27::2:30\nk.root-servers.net.    3600000\
  \ IN      A       193.0.14.129\nk.root-servers.net.    3600000 IN      AAAA    2001:7fd::1\n\
  l.root-servers.net.    3600000 IN      A       199.7.83.42\nl.root-servers.net.\
