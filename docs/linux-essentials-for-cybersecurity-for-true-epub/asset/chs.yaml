  \ localhost dhcpd: yet read the README, please read it before requesting help.\n\
  Jan  6 20:26:16 localhost dhcpd: If you intend to request help from the\ndhcp-server@isc.org\n\
  Jan  6 20:26:16 localhost dhcpd: mailing list, please read the section on the README\
  \ about\nJan  6 20:26:16 localhost dhcpd: submitting bug reports and requests for\
  \ help.\nJan  6 20:26:16 localhost dhcpd:\nJan  6 20:26:16 localhost dhcpd: Please\
  \ do not under any circumstances send requests for\nJan  6 20:26:16 localhost dhcpd:\
  \ help directly to the authors of this software - please\nJan  6 20:26:16 localhost\
  \ dhcpd: send them to the appropriate mailing list as described in\nJan  6 20:26:16\
  \ localhost dhcpd: the README file.\nJan  6 20:26:16 localhost dhcpd:\nJan  6 20:26:16\
  \ localhost dhcpd: exiting.\n```\n\n### 邮件服务器\n\n在本节中，你将学习管理邮件服务器的技术——特别是 Postfix。Postfix\
  \ 已经成为 Linux 上最广泛使用的邮件服务器，许多发行版都将其作为默认邮件服务器。你将学习诸如配置电子邮件地址、实施邮件配额以及管理虚拟邮件域等功能。\n\
  \n在本书其中一位作者之一的职业生涯早期，他曾请求一位高级管理员解释什么是 SMTP（简单邮件传输协议） 和 `sendmail`（这在当时是主流的邮件服务器）。那位高级管理员说：“去读读\
  \ RFC 821，一旦你理解了所有内容，我再向你解释 `sendmail`。”如果你看一眼 RFC 821（实际上，你应该看 2821，它定义了更现代的 ESMTP，扩展\
  \ SMTP），你会发现这个玩笑是开给作者的。这份文档确实定义了 SMTP，但它并不是为心细者准备的，对初级管理员来说也不是一种愉快的阅读体验。\n\n幸运的是，你不需要阅读\
  \ RFC 821 或 2821 就能理解 SMTP 的精髓。然而，你应该意识到，SMTP 协议的基础知识是理解邮件服务器如何运作的关键。\n\n#### SMTP\
  \ 基础\n\n作为一种协议，SMTP 定义了邮件如何传输和存储。它是 TCP/IP 协议的应用层的一部分，提供了所有程序遵循的规则。为了理解 SMTP，最好了解它的主要组件：邮件用户代理（MUA）、邮件提交代理（MSA）、邮件传输代理（MTA）以及邮件投递代理（MDA）。\n\
  \n-   **MUA (邮件用户代理)**：用户用于创建和读取邮件的程序，例如 Outlook、Thunderbird 或 Web 界面。\n-   **MSA\
  \ (邮件提交代理)**：接收来自 MUA 的邮件并将其发送到 MTA。\n-   **MTA (邮件传输代理)**：负责接收邮件并将其发送到目标目的地或接收方的\
  \ MTA。\n-   **MDA (邮件投递代理)**：从 MTA 接收邮件并将其投递到用户的邮箱（通常是磁盘上的一个文件）。\n\n-   SMTP（简单邮件传输协议）\
  \ 和 邮局协议 (POP) 以及 互联网邮件访问协议 (IMAP) 是 MUA 用于检索邮件的协议。\n-   邮件池 通常是邮件服务器上 `/var/spool`\
  \ 下的一个文件。\n-   扩展 SMTP 是更现代的 SMTP 定义。\n\n-   示例 20-9 展示了一条潜在的 DHCP 服务器消息。我们刻意在配置文件中制造了一个错误，当\
  \ DHCP 服务器启动时，它提供了一条非常有有用的信息（见加粗的行）。\n\n-   **示例 20-9 `/var/log/messages` 条目**\n\
  \n-   点击此处查看代码图像\n\n```\n\nJan  6 20:26:16 localhost dhcpd: Internet Systems Consortium\
  \ DHCP Server V3.0.5-RedHat\nJan  6 20:26:16 localhost dhcpd: Copyright 2004-2006\
  \ Internet Systems Consortium.\nJan  6 20:26:16 localhost dhcpd: All rights reserved.\n\
  Jan  6 20:26:16 localhost dhcpd: For info, please visit http://www.isc.org/sw/dhcp/\n\
  Jan  6 20:26:16 localhost dhcpd: Address range 192.168.1.128 to 192.168.1.254 not\
  \ on net\n192.168.0.0/255.255.255.0!\nJan  6 20:26:16 localhost dhcpd:\nJan  6 20:26:16\
  \ localhost dhcpd: If you did not get this software from ftp.isc.org, please\nJan\
  \  6 20:26:16 localhost dhcpd: get the latest from ftp.isc.org and install that\
  \ before\nJan  6 20:26:16 localhost dhcpd: requesting help.\nJan  6 20:26:16 localhost\
  \ dhcpd:\nJan  6 20:26:16 localhost dhcpd: If you did get this software from ftp.isc.org\
  \ and have not\nJan  6 20:26:16 localhost dhcpd: yet read the README, please read\
  \ it before requesting help.\nJan  6 20:26:16 localhost dhcpd: If you intend to\
  \ request help from the\ndhcp-server@isc.org\nJan  6 20:26:16 localhost dhcpd: mailing\
  \ list, please read the section on the README about\nJan  6 20:26:16 localhost dhcpd:\
  \ submitting bug reports and requests for help.\nJan  6 20:26:16 localhost dhcpd:\n\
  Jan  6 20:26:16 localhost dhcpd: Please do not under any circumstances send requests\
  \ for\nJan  6 20:26:16 localhost dhcpd: help directly to the authors of this software\
  \ - please\nJan  6 20:26:16 localhost dhcpd: send them to the appropriate mailing\
  \ list as described in\nJan  6 20:26:16 localhost dhcpd: the README file.\nJan \
  \ 6 20:26:16 localhost dhcpd:\nJan  6 20:26:16 localhost dhcpd: exiting.\n```\n\n\
  -   图 20-6 展示了邮件传输过程的可视化。在此图中，user1 想向 user2 发邮件。在 MUA 上，user1 编写并发送邮件。邮件被发送到 MSA，然后是\
  \ MTA（尽管这些可能是同一个系统）。高亮框表示 user1 域的 MTA 和 user2 的 MTA 之间的多个 MTA。\n\n![图像](img/20fig06.jpg)\n\
  \n**图 20-6 传输邮件**\n\n邮件最终到达 user2 域的 MTA。从那里开始，它可能会被直接发送到邮件池（通常是邮件服务器上 `/var/spool`\
  \ 下的一个文件），但可能会先发送到 MDA 进行过滤——为了 user1 考虑，希望它能通过垃圾过滤器！当 user2 想读取新邮件时，他的 MUA 连接到\
  \ POP 或 IMAP 服务器下载邮件。\n\n**可能出现的问题？**\n\n请记住，发送邮件的过程中还有另一个重要部分。发送 MTA 必须确定哪个 MTA\
  \ 负责接收邮件。这是通过 DNS 服务器提供的 MX 记录处理的，该主题在本章之前已经介绍过。**注意**\n\n虽然你对 Postfix 的大部分更改都在\
  \ `/etc` 目录的文件中，但你应该注意到 Postfix 将入站邮件信息存储在 `/var/spool/postfix` 目录中。邮件最初存储在子目录中，直到过滤进程（如\
  \ `qmgr` 工具）处理邮件并将每个存储在用户的邮箱（以用户名命名的文件：`/var/spool/mail/*username***）。\n\nPostfix\
  \ 的主配置文件是 `/etc/postfix/main.cf`。该文件中的设置格式就像设置 shell 变量一样：\n\n```\nsetting = value\n\
  ```\n\n\n\n你可以手动修改此文件，也可以使用 `postconf` 命令进行更改。`postconf` 命令的优点是可以提供一些基本的语法检查，这减少了出错的概率。它还可用于轻松地显示\
  \ Postfix 的当前配置。通常情况下，默认显示所有设置（这里的第一个命令只是为了向你展示有多少设置）：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# postconf |wc -l\n816\n[root@onecoursesource ~]# postconf | head -5\n2bounce_notice_recipient\
  \ = postmaster\naccess_map_defer_code = 450\naccess_map_reject_code = 554\naddress_verify_cache_cleanup_interval\
  \ = 12h\naddress_verify_default_transport = $default_transport\n```\n\n如你所见，`postconf`\
  \ 命令默认显示所有配置设置。这包含了所有的默认设置，而不仅仅是配置文件中指定的那些。如果你只想查看配置文件中定义的自定义设置，请对 `postconf` 命令使用\
  \ `-n` 选项，如示例 20-10 所示。\n\n**示例 20-10** *`postconf -n` 命令*\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource ~]# postconf -n\nalias_database = hash:/etc/aliases\nalias_maps\
  \ = hash:/etc/aliases\ncommand_directory = /usr/sbin\nconfig_directory = /etc/postfix\n\
  daemon_directory = /usr/libexec/postfix\ndata_directory = /var/lib/postfix\ndebug_peer_level\
  \ = 2\ndebugger_command = PATH=/bin:/usr/bin:/usr/local/bin:/usr/X11R6/bin ddd\n\
  $daemon_directory/$process_name $process_id & sleep 5\nhtml_directory = no\ninet_interfaces\
  \ = localhost\ninet_protocols = all\nmail_owner = postfix\nmailq_path = /usr/bin/mailq.postfix\n\
  manpage_directory = /usr/share/man\nmydestination = $myhostname, localhost.$mydomain,\
  \ localhost\nnewaliases_path = /usr/bin/newaliases.postfix\nqueue_directory = /var/spool/postfix\n\
  readme_directory = /usr/share/doc/postfix-2.10.1/README_FILES\nsample_directory\
  \ = /usr/share/doc/postfix-2.10.1/samples\nsendmail_path = /usr/sbin/sendmail.postfix\n\
  setgid_group = postdrop\nunknown_local_recipient_reject_code = 550\n```\n\n你也可以通过提供设置名称作为参数来查看特定的设置：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# postconf inet_interfaces\ninet_interfaces\
  \ = localhost\n```\n\n要进行更改，请使用 `-e` 选项和以下语法：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# postconf -e inet_interfaces=all\n[root@onecoursesource ~]# postconf inet_interfaces\n\
  inet_interfaces = all\n```\n\n虽然并不完美，但 `postconf` 命令确实包含了一些错误检查。例如，它能够识别 `main.cf`\
  \ 文件中允许哪些合法的设置：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# postconf ine_interfaces\n\
  postconf: warning: ine_interfaces: unknown parameter\n```\n\n### 重要 Postfix 设置\n\
  \n如你通过运行 `postconf` 命令所见，Postfix 服务器有数百种可能的设置：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# postconf |wc -l\n816\n```\n\n如果你打算管理一个全公司的 Postfix 服务器，你肯定想要探索这些设置中的许多。然而，对于基础\
  \ Postfix 配置，表 20-6 中描述的设置就足够了。\n\n**表 20-6** 核心 Postfix 设置\n\n| **设置项** | **描述**\
  \ |\n| --- | --- |\n| **myhost** | 系统的完全限定主机名。通常你不需要设置此，因为该值是由 Postfix 通过执行 `hostname`\
  \ 命令派生的。 |\n| **disable_vrfy_command** | 在公共可访问的 Postfix 服务器上应设置为 `yes`，以防止用于收集电子邮件地址的技术（例如，mail.onecoursesource.com）。\
  \ |\n| **mydomain** | 系统主机名的域名部分。如果未设置，将使用 `myhostname` 设置的值，并移除相对主机名（例如，onecoursesource.com）。\
  \ |\n| **myorigin** | 如果客户端系统没有提供出站主机名（这是 MUA 的一项配置功能），将使用 `myorigin` 设置的值。如果未设置，则使用\
  \ `myhostname` 设置的值。 |\n| **inet_interfaces** | Postfix 应该在哪些接口上监听。默认设置为 `localhost`，这意味着它只接受来自本地机器的入站电子邮件。将其设置为\
  \ `all` 或特定的网络接口以接受来自本地之外的电子邮件。 |\n| **mydestination** | 默认设置为 `myhostname` 的值，这是\
  \ Postfix 接收电子邮件的域名或主机列表。请记住这是一个目标地址，因此将 `mydestination` 设置为 onecoursesource.com\
  \ 意味着 Postfix 正在接收面向 onecoursesource.com 域的入站电子邮件。 |\n| **relay_domains** | 如果你想让\
  \ Postfix 作为中继（向其他域名发送电子邮件），使用此设置并跟用逗号分隔的 Postfix 可以中继列表。 |\n| **relayhost** | 在某些情况下，你可能希望将消息发送到组织内部的出站\
  \ SMTP 服务器，而不是让 Postfix 直接将其发送到互联网。`relayhost` 选项接受此出站 SMTP 服务器的值。 |\n\n**注意**\n\
  \n更改配置后，请确保重启 Postfix 使设置生效。\n\n### 别名\n\n你可能想为 Postfix 服务器配置一些别名。例如，系统用户账户可能是 bob，但你想要一个具描述性的电子邮件地址，如\
  \ `bob.smith@onecoursesource.com`。在 `/etc/aliases` 文件中创建它，类似于示例 20-11。\n\n**示例 20-11**\
  \ `/etc/aliases` 文件\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# head -20 /etc/aliases\n\
  #  此文件中的别名不会在邮件头中展开\n#  但在网络或 /bin/mail 中可见。\n#\n#       >>>>>>>>>>      更新此文件后必须运行\n\
  #       >> NOTE >>      newaliases 程序\n#       >>>>>>>>>>\n\n# 基础系统别名 —— 这些必须存在。\n\
  mailer-daemon:  postmaster\npostmaster:     root\n\n# 伪账户的通用重定向。\nbin:         \
  \   root\ndaemon:         root\nadm:            root\nlp:             root\nsync:\
  \           root\nshutdown:       root\n```\n\n此文件中的每行都遵循以下格式：\n\n```\n别名:本地账户\n\
  ```\n\n因此，为了将 bob.smith 的邮件送到本地账户 bob，请向 `/etc/aliases` 添加以下内容：\n\n```\nbob.smithbob\n\
  ```\n\n你也可以将电子邮件发送到多个账户。例如，为了让 webmaster 的邮件发送到 bob、sue 和 nick 本地账户，请向 `/etc/aliases`\
  \ 文件添加以下行：\n\n```\nwebmaster: bob, sue, nick\n```\n\n在更改 `/etc/aliases` 文件后，你必须运行\
  \ `newaliases` 命令。这会将文本文件转换为 Postfix 使用的二进制文件（即 `/etc/aliases.db` 文件）：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# newaliases\n[root@onecoursesource ~]# ls /etc/aliases*\n\
  /etc/aliases  /etc/aliases.db\n```\n\n\n\n\n`/etc/aliases` 文件用于将电子邮件重定向到本地用户账户。`/etc/postfix/virtual`\
  \ 文件的设计用于执行类似的任务，但它不仅仅是将邮件重定向到本地账户，还可以配置为将邮件重定向到虚拟和远程目的地。这在你拥有多个域名或想要隐藏目的地位置时非常有用。\n\
  \n`/etc/postfix/virtual` 文件的格式如下：\n\n```\ninbound_addressrelay.to_address\n```\n\
  \n例如，假设 Postfix 服务器器处理来自两个域名的入站邮件：example.com 和 sample.com。可以使用以下 `/etc/postfix/virtual`\
  \ 文件设置：\n\n点击此处查看代码图像\n\n```\nbob@example.combobsmith\nbob@sample.combobjones\n\
  ```\n\n你也可以使用以下行将一个账户的入站邮件转发到另一个账户：\n\n```\nbob@example.combob@sample.com\n```\n\
  \n在修改 `/etc/postfix/virtual` 文件后，你必须执行几个步骤才能使其生效。第一步是修改 `/etc/postfix/main.cf` 文件以包含以下行：\n\
  \n点击此处查看代码图像\n\n```\nvirtual_alias_maps = hash:/etc/postfix/virtual\n```\n\n接下来，你必须执行以下命令将基于文本的\
  \ `/etc/postfix/virtual` 文件转换为二进制文件（因此在上一行使用了 hash）：\n\n```\npostmap /etc/postfix/virtual\n\
  ```\n\n最后，你需要重启 Postfix 服务或重新加载其配置文件。\n\n### 管理本地邮件投递\n\n本节重点介绍 procmail 工具。procmail\
  \ 程序设计用于对电子邮件消息进行过滤。这对于执行诸如拦截垃圾邮件、将邮件重定向到其他用户账户，以及复制邮件消息并将其发送到其他账户等操作非常有用。\n\n虽然之前介绍的技术允许你使用别名将邮件重定向到其他用户账户，但该技术局限于基于入站用户名的重定向。使用\
  \ procmail，你可以创建复杂的规则，使用正则表达式来匹配邮件消息任何部分的数据。因此，procmail 程序提供了一种更健壮的入站邮件过滤方法。\n\n\
  某些系统（如 Postfix）不使用 procmail，而是让 MTA 直接将入站邮件存储在邮件队列池（mail spool）中。这可能会让你怀疑为什么要使用\
  \ procmail。\n\nprocmail 优于 MTA 的优势在于，可以在消息发送到邮件队列池之前使用规则对其执行操作。这些规则可以是从简单的（将消息从一个账户重定向到另一个账户）到复杂的（对消息内容进行正则表达式模式匹配）。\n\
  \n### procmail 基础知识\n\n需要注意的是，procmail 并不是在启动时启动的典型服务。相反，它是 MTA 在需要时调用的程序。大多数发行版默认安装了\
  \ procmail 包，并且通常为 Postfix 和 sendmail 启用了它。\n\n确定 MTA 是否自动使用 procmail 的一种方法是在用户的\
  \ procmail 配置文件（径 HOME/.procmailrc` 文件）中创建一个简单的规则：\n\n```\n:0c:\n$HOME/mail.backup\n\
  ```\n\n上述规则应将所有入站消息备份到该用户主目录下的 `mail.backup` 目录（下一节将详细介绍该规则如何工作）。作为该用户（下例中的学生用户），请创建以下备份目录：\n\
  \n点击此处查看代码图像\n\n```\n[student@localhost ~]# mkdir $HOME/mail.backup\n```\n\n现在，作为\
  \ root 用户，向该用户账户发送消息：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mail student\n\
  Subject: test\ntest\nEOT\n```\n\n结果应该如下所示：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# ls /home/student/mail.backup\nmsg.e1mmB  msg.f1mmB\n```\n\n你可能会奇怪，如果这些消息位于不同的目录，你如何读取它们？大多数邮件客户端都有方法为邮件队列池指定不同的目录。例如，使用命令行\
  \ mail 程序，你需要执行以下操作：\n\n点击此处查看代码图像\n\n```\n[student@localhost ~]$ mail -f mail.backup/msg.e1mmB\n\
  Heirloom Mail version 12.5 7/5/10\\. Type ? for help.\n\"mail.backup/msg.e1mmB\"\
  : 1 message 1 unread\n>U  1 root                  Sat Jan 16 14:47  19/622   \"\
  test\"\n&\n```\n\n那么，如果不起作用怎么办？那意味着你的 MTA 未配置为自动使用 procmail。你可以配置它自动使用 MTA，但更好的解决方案是让想要使用\
  \ procmail 的用户在他们的主目录下添加以下文件。（注意：请检查你系统中 procmail 的位置，因为它可能与此处指定的路径不同。）\n\n点击此处查看代码图像\n\
  \n```\n[student@localhost ~]$ more .forward\n| /bin/procmail\n```\n\n为什么这比重新配置 MTA\
  \ 好？有几点需要考虑：\n\n*   虽然你可以制作全局的 procmail 配置（`/etc/procmailrc` 文件），但这通常在你将 procmail\
  \ 作为垃圾邮件过滤器时才会这样做。由于特定的垃圾邮件过滤器程序通常比 procmail 更健壮，因此 procmail 通常不用于此功能（除非是针对个人用户）。如果没有有效的\
  \ procmail 配置文件，则仅使用个人配置文件。\n\n*   并非所有用户都想使用 procmail。大多数新手用户发现创建规则的过程具有挑战性。如果\
  \ MTA 配置为使用 procmail 且只有少数用户在创建规则，那么 procmail 就会在没有理由的情况下被反复调用。\n\n### 安全要点\n\n\
  作为系统管理员，你可以将 procmail 规则放在 `/etc/procmailrc` 文件中。然而，你应该避免放置任何执行外部命令的规则。这些命令将以 root\
  \ 用户身份运行，可能会导致安全问题。\n\n因此，除非大多数用户都在使用 procmail 规则或你正在使用全局配置，否则让用户通过自己的 `.forward`\
  \ 文件调用 procmail 是合理的。你还为用户提供了一种简单的方法，通过注释掉 `.forward` 文件中的该行来临时禁用 procmail。\n\n\
  ### procmail 规则\n\n`procmail` 规则的语法如下：\n\n点击此处查看代码图像\n\n```\n:0 [flags] [:[lockfile]]\n\
  * [conditions]\nAction\n```\n\n`:0` 告诉 procmail 这是一个新规则的开始。`[flags]` 用于修改规则匹配的工作。表\
  \ 20-7 描述了这些标志。\n\n**表 20-7** procmail 标志\n\n| **标志** | **描述** |\n| --- | --- |\n\
  | **H** | 仅匹配消息的头部部分。这是默认值。 |\n| **B** | 在消息正文中进行匹配。 |\n| **D** | 区分大小写的匹配。（默认不区分大小写。）\
  \ |\n| **c** | 对抄送 (cc) 进行匹配。 |\n| **w** | 等待操作完成。如果操作失败；procmail 将继续解析匹配规则。 |\n\
  | **W** | 功能与 **w** 类似，但抑制“程序失败”消息。 |\n\n可以通过执行 `procmail -h` 命令查看一些额外的过滤器，如示例 20-12\
  \ 所示。\n\n**示例 20-12** *`procmail-h` 命令*\n\n点击此处查看代码图像\n\n\n\n\n\n```\n[student@localhost\
  \ ~]$ procmail -h 2>&1 | tail -12\nRecipe flag quick reference:\n        H  egrep\
  \ header (default)       B  egrep body\n        D  distinguish case\n        A \
  \ also execute this recipe if the common condition matched\n        a  same as 'A',\
  \ but only if the previous recipe was successful\n        E  else execute this recipe,\
  \ if the preceding condition didn't match\n        e  on error execute this recipe,\
  \ if the previous recipe failed\n        h  deliver header (default)     b  deliver\
  \ body (default)\n        f  filter                       i  ignore write errors\n\
  \        c  carbon copy or clone message\n        w  wait for a program        \
  \   r  raw mode, mail as is\n        W  same as 'w', but suppress 'Program failure'\
  \ messages\n```\n\n`[:[lockfile]]` 是一个文件名（或 `:` 字符），它告诉 `procmail` 实用程序使用哪个文件来通知其他进程它正在处理该文件。这防止了对同一条消息发生重复操作。在大多数情况下，只需为锁文件指定\
  \ `:` 即可，让 `procmail` 实用程序自行选择文件名。\n\n`[conditions]` 行用于执行模式匹配本身。`[condition]` 行必须以\
  \ `*` 字符开头方为有效。\n\n`procmail` 实用程序使用 `egrep` 命令来执行模式匹配。你应该根据之前的经验熟悉 `egrep` 命令；表\
  \ 20-8 作为对 `egrep` 实用程序支持的一些较重要的模式匹配字符的提醒。\n\n### 表 20-8 egrep 模式匹配字符\n\n| 字符 |\
  \ 说明 |\n| --- | --- |\n| `*` | 匹配前一个字符的零次或多次。 |\n| `+` | 匹配前一个字符的一次或多次。 |\n| `{x,y}`\
  \ | 匹配前一个字符 x 到 y 次。 |\n| `.` | 匹配任意单个字符（换行符除外）。 |\n| `[range]` | 匹配方括号列出的单个字符。\
  \ |\n| `^` | 匹配行首。 |\n| `$` | 匹配行尾。 |\n| `\\|` | 选择（或操作）：`this|that`。 |\n| `\\n`\
  \ | 匹配换行符。 |\n\n要查看 `egrep` 命令支持的额外正则表达式字符，请查看 `egrep` 命令的 man 页。\n\n规则的最后部分是动作。这可以是不同的动作，包括\
  \ 表 20-9 中描述的。\n\n### 表 20-9 procmail 动作\n\n| 动作 | 说明 |\n| --- | --- |\n| 文件名 |\
  \ 这可以是文件名或目录名。如果是目录名，它会告诉 `procmail` 实用程序将消息存储在哪个目录。文件名或目录名可以是绝对路径，也可以相对于 `$MAILDIR`\
  \ 变量。也可以使用其他变量，如 `$HOME`。消息可以以两种格式存储：mbox 和 Maildir。默认是 mbox，但你可以通过在路径末尾提供 `/` 字符来让\
  \ `procmail` 实用程序以 Maildir 格式存储消息。 |\n| 另一个程序 | 你可以使用以下语法将消息发送到另一个程序： |\n```\n|program_name\n\
  ``` | |\n| 电子邮件地址 | 要将消息发送到另一个电子邮件地址，请使用以下语法： |\n```\n~email_address\n``` | |\n\
  | 嵌套块 | 你可以将一个规则放在另一个规则内部。例如，如果你想执行一个复杂的匹配，包括专门匹配头头中的某些内容，然后在消息正文中匹配其他内容。这需要两个独立的规则集。你可以使用以下语法将第二个集合作为动作的一部分：点击此处查看代码图像\
  \ |\n```\n:0 [flags] [:[lockfile]]\n* [conditions]\n{\n    :0 [flags] [:[lockfile]]\n\
  \    * [conditions]\n    action\n}\n``` | |\n\n#### procmail 示例\n\n为了理解 procmail\
  \ 规则，查看一些示例会有帮助。以下示例分类了所有发送给 bob 的邮件消息，并将它们放在 `bobfile` 目录中：\n\n```\n:0:\n* ^TObob\n\
  bobfile\n```\n\n下一个规则更复杂。示例 20-13 中的规则匹配任何来自 support 且主题行中包含“reboot”的消息。如果匹配成功，消息的副本将发送到\
  \ `bo@onecoursesource.com`，并将消息存储在 `$MAILDIR/support-reboot` 目录中。\n\n**示例 20-13\
  \ 复杂的 procmail 规则**\n\n点击此处查看代码图像\n\n```\n:0:\n* ^From.*support.*\n* ^Subject:.*reboot.*\n\
  {\n   :0 c\n   ! bo@onecoursesource.com\n   :0\n   support-reboot\n}\n```\n\n**注意**\n\
  \n编写良好的规则需要非常精通正则表达式。还需要大量的测试和足够的耐心！\n\n#### mbox 和 Maildir 格式\n\n使用两种不同的格式来存储邮件消息：mbox\
  \ 和 Maildir。mbox 格式长期以来一直是 MTA 使用的标准格式。在这种格式下，用户的所有邮件都存储在一个文件中，通常位于 `/spool/mail`。每个用户都有一个以用户名命名的文件。因此，用户\
  \ bob 将有一个 `/var/spool/mail/bob` 文件。当新消息发送到 MTA 给 bob 时，MTA 会锁定 `/var/spool/mail`\
  \ 文件并将消息附加到末尾。处理完成后，文件解锁。\n\n单文件格式的好处是用户可以使用 `grep` 等工具搜索其所有邮件。我曾这样做来寻找一条在我下载时神秘消失的特定邮件。\n\
  \n这种单文件格式的问题是锁定过程有时会导致问题。文件还可能损坏，导致邮件丢失。\n\nPostfix 默认写入 mbox 格式，但也可以配置为写入 Maildir\
  \ 格式。使用 Maildir 格式为每个接收邮件的用户创建一个目录。该目录包含三个子目录：**new**、**cur** 和 **temp**。\n\n你应该知道\
  \ procmail 工具理解这两种格式，Dovecot 程序（一种 MDA）也是如此，它将在下一节中讨论。\n\n### 远程邮件投递\n\n通过回顾本章之前的\
  \ 图 20-6 来回顾邮件从源系统传输到目的地的方式。像 Postfix 这样的服务器作为 MTA（邮件传输代理），这些服务器的主要任务是将邮件从一个域传输到另一个域。MTA\
  \ 被称为推服务器，因为发送端 MTA 会积极将消息“推”向目的地。\n\n一旦邮件到达并经过过滤过程（回顾 procmail 程序），消息就会被放在邮件池中。它会在邮件池中等待，直到用户的\
  \ MUA（邮件用户代理）请求发送消息。该请求使用 POP 或 IMAP 协议发送到服务器 MDA（邮件投递代理）。由于请求源于客户端，MDA 被称为拉服务器。\n\
  \n#### IMAP 和 POP 基础\n\n管理 MDA 服务器时，你需要对 POP 和 IMAP 协议有基本的了解。这种知识水平与你在管理 MTA 服务器时对\
  \ SMTP 的了解水平相似：你不需要成为专家，但应该了解基础知识。\n\n\n\n\n\n在某些方面，理解 IMAP 和 POP 比理解 SMTP 更重要，因为你可以选择让\
  \ MDA 服务器使用其中一种（或两者都用）。这两者的设计目的都是为了允许 `MUA` 请求访问邮件消息，但它们之间存在差异，可能使得某种协议在特定情况下比另一种协议更好。\n\
  \n表 20-10 提供了这两个协议之间主要差异的总结。\n\n### 表 20-10 IMAP 对比 POP\n\n| 特性 | POP | IMAP |\n\
  | --- | --- | --- |\n| 实现易性 | POP 通常被认为是一种更简单的协议，实现也更容易。 | IMAP 更复杂，这导致实现难度较大。 |\n\
  | 消息处理 | 默认情况下，大多数 POP 服务器在邮件被 MUA 下载后会删除该邮件。这样做的好处是减少邮件服务器的磁盘空间占用。但这意味着如果从 MUA\
  \ 上删除了，可能会导致消息丢失。 | 默认情况下，大多数 IMAP 服务器会在服务器上留存消息副本。MUA 接收消息副本并存储在本地。 |\n| 文件夹（邮箱）\
  \ | POP 没有文件夹的概念。 | IMAP 支持文件夹或邮箱功能，并允许客户端执行创建、重命名或删除邮箱等操作。 |\n| 连接 | 当前只有一个客户端可以连接到邮箱。\
  \ | 允许多个客户端同时连接。 |\n| 获取 | 获取所有消息内容。 | 可以单独获取消息的各个部分。 |\n\n#### Dovecot 服务器\n\n\
  Dovecot 同时支持 IMAP 和 POP 协议。Dovecot 还支持两种类型的邮箱：`mbox` 和 `Maildir`。\n\n极有率情况下，你的发行发行版中已经安装了\
  \ Dovecot 服务器，因为该包是大多数发行版的标准 MDA。Dovecot 服务器通过修改主配置文件 `/etc/dovecot/dovecot.conf`\
  \ 文件进行配置。\n\nDovecot 的一个很棒的特性是可以通过执行 `dovecot -n` 命令来查看清理后的、整洁的配置，如 示例 20-14 所示。你不需要通读配置文件，只需执行此命令即可查看当前设置。这非常有用，因为\
  \ `/etc/dovecot/dovecot.conf` 文件的大部分内容是由命令组成的。此外，`/etc/dovecot/conf.d` 目录下的配置文件也被包含在内，这使得很难看到\
  \ `dovecot -n` 命令所提供的全景。\n\n**示例 20-14 `dovecot -n` 命令**\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource ~]# dovecot -n\n# 2.2.10: /etc/dovecot/dovecot.conf\n# OS:\
  \ Linux 3.10.0-229.14.1.el7.x86_64 x86_64 CentOS Linux release 7.1.1503 (Core)\n\
  mbox_write_locks = fcntl\nnamespace inbox {\n  inbox = yes\n  location =\n  mailbox\
  \ Drafts {\n    special_use = \\Drafts\n  }\n  mailbox Junk {\n    special_use =\
  \ \\Junk\n  }\n  mailbox Sent {\n    special_use = \\Sent\n  }\n  mailbox \"Sent\
  \ Messages\" {\n    special_use = \\Sent\n  }\n  mailbox Trash {\n    special_use\
  \ = \\Trash\n  }\n  prefix =\n}\npassdb {\n  driver = pam\n}\nssl = required\nssl_cert\
  \ = </etc/pki/dovecot/certs/dovecot.pem\nssl_key = </etc/pki/dovecot/private/dovecot.pem\n\
  userdb {\n  driver = passwd\n}\n```\n\n大多数默认 Dovecot 配置文件主要由注释组成，用于解释更重要的设置。这些设置的格式是标准的\
  \ `setting=value`；然而，有一个特殊之处，因为值实际上可以包含多个值，并且当值后面跟着一组大括号（`{}`）时，可能存在子设置，可以覆盖针对特定值的默认设置。如果你再次查看\
  \ 示例 20-14，你可以通过查看 `namespace` 设置看到这一点。\n\nDovecot 服务器有许多可能的设置。表 20-11 描述了其中一些最重要的设置。\n\
  \n### 表 20-11 Dovecot 设置\n\n| 设置 | 描述 |\n| --- | --- |\n| protocols | 描述支持哪些协议。例如：`protocols\
  \ = imap pop3`。 |\n| listen | 定义监听哪个本地网络接口以接收入站请求。值 `*` 表示所有 IPv4 接口。值 `::` 表示所有\
  \ IPv6 接口。要同时指定两者，请使用逗号。 |\n| include | 包含 `/etc/dovecot/conf.d` 目录中的配置文件，这使得很难看到\
  \ `dovecot -n` 命令所提供的全景。 |\n| mail_location | 定义邮件的存储位置。可以指定 `mbox` 或 `Maildir`\
  \ 格式。 |\n\n\n\n\n\n```\n[root@onecoursesource ~]# telnet localhost 110\nTrying 127.0.0.1...\n\
  Connected to localhost.localdomain (127.0.0.1).\nEscape character is '^]'.\n+OK\
  \ Dovecot ready.\nuser student\n+OK\npass student\n+OK Logged in.\nretr 1\n+OK 537\
  \ octets\nReturn-Path: <root@localhost.example.com>\nX-Original-To: student@localhost\n\
  Delivered-To: student@localhost.example.com\nReceived: from example.com (localhost.localdomain\
  \ [127.0.0.1])\n        by ldap.example.com (Postfix) with SMTP id 6575F11802F\n\
  \        for <student@localhost>; Sun, 31 Jan 2019 15:36:34 -0800 (PST)\nSubject:\
  \ Sending a message without a MUA\nMessage-Id: <20160131233644.6575F11802F@ldap.example.com>\n\
  Date: Sun, 31 Jan 2019 15:36:34 -0800 (PST)\nFrom: root@localhost.example.com\n\
  To: undisclosed-recipients:\n\n\n\nBody of message\n```\n\n### 总结\n\n在本章中，你探索了如何配置几项重要的网络服务。你学习了如何正确设置和保护\
  \ `BIND` DNS 服务器，以及如何配置 `DHCP` 服务器。你还学习了如何配置各种邮件服务器，包括 `Postfix`、`procmail` 和 `Dovecot`。\n\
  \n## 核心术语\n\n- 推推式服务器\n- 拉取服务器\n- 邮件邮件池\n- mbox\n- Maildir\n- SMTP\n- ESMTP\n- MUA\n\
  - MSA\n- MDA\n- POP\n- IMAP\n- DHCP\n- 静态主机\n- 域名系统服务 (DNS)\n- 完全限定域名 (FQDN)\n-\
  \ 子域名\n- 名称服务器\n- 权威名称服务器\n- 记录\n- 缓存名称服务器\n- 正向查询\n- 反向查询\n- DNS 转发器\n- 伯克利互联网域名系统\
  \ (BIND)\n- 根服务器\n- DNS 主服务器\n- DNS 备服务器\n- 区域传输\n- 正向 DNS 查找\n- 反向 DNS 查找\n- 生存时间\
  \ (TTL)\n\n## 复习题\n\n**1.** 在区域文件中你会找到以下哪项内容？\n\n1. `directory` 设置\n2. `A` 记录\n\
  3. `dump-file` 设置\n4. `recursion` 设置\n\n**2.** 哪种类型的名称服务器根据存储在系统本地的原始记录返回结果？\n\n\
  1. 缓存名称服务器\n2. 转发器名称服务器\n3. 权威名称服务器\n4. 本地名称服务器\n\n**3.** `_____` 文件用于存储 IP 地址到域名的名称转换信息（也称为“记录”）。\n\
  \n**4.** 在空白处填空以在 `/etc/named.conf` 文件中创建一个主 DNS 服务器条目：\n\n```\nzone \"onecoursesource.com\"\
