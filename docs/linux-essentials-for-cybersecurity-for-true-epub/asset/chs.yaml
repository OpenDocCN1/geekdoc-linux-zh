  \ 美国特定的 CERT。\n\n## 术语表\n\n**绝对路径 (absolute path)** 从根目录到文件或目录的指示。\n**访问控制列表 (access\
  \ control lists)** ACLs 用于授予特定用户或组权限。\n**活动目录 (Active Directory)** 一种基于 `LDAP` 协议的\
  \ Windows 产品，旨在存储信息并提供各种用途的数据，例如用户认证。\n**主动模式 (active FTP mode)** 在此模式下，FTP 服务器发起数据连接。\n\
  **别名 (alias)** 允许通过发布单个命令来执行一组命令的 Shell 功能。\n**Amanda** 第三方备份工具。\n**匿名 FTP (anonymous\
  \ FTP)** 一种 FTP 功能，允许使用特殊账户在不需要密码或本地访问权限的情况下连接 FTP 服务器。\n**Apache** 一种常见的 Web 服务器（正式名称为\
  \ Apache Hypertext Transfer Protocol Server）。\n**参数 (argument)** 提供给命令的参数，告诉命令要对某个事物执行什么操作。\n\
  **ARP** 地址解析协议；该协议定义了如何将 IP 地址转换为 MAC 地址。\n**ARP 表 (ARP table)** 包含 IP 地址和相应 MAC\
  \ 地址的内存表。\n**非对称加密 (asymmetric cryptography)** 一种加密技术，一个密钥（公钥）用于加密数据，另一个密钥（私钥）用于解密数据。也称为\
  \ PKC（公钥加密）。\n**at** 一个用于在未来特定时间调度一个或多个命令的系统。\n**属性 (attribute)** 对象的组件。\n**权威名称服务器\
  \ (authoritative name server)** 根据存储在系统本地的记录返回结果的名称服务器。参见 name server。\n**autofs**\
  \ 一种按需自动挂载文件系统的系统。\n**后台进程 (background process)** 在不影响父进程执行额外程序的情况下运行的进程。\n**Bacula**\
  \ 第三方备份工具。\n**伯克林域名 (BIND)** 互联网上广泛使用的 DNS 软件。\n**BIOS** 基本输入输出系统；启动操作系统过程的固件。\n\
  **引导加载程序 (bootloader)** 操作系统提供的软件程序，用于访问硬盘上的文件（特别是内核）并启动操作系统。\n**CA** 证书颁发机构；用于数字签名证书以验证另一个身份的系统。CA\
  \ 具有层次结构，顶层 CA 称为 `root`。\n**缓存名称服务器 (caching name server)** 根据从另一个名称服务器（如权威名称服务器）获取的信息返回结果的名称服务器。\n\
  **CERT** 计算机应急响应小组；原型是卡内基梅隆大学的 CERT Coordination Center (CERT-CC)。\n**证书 (certificate)**\
  \ 对于 SSH，证书用于允许无密码认证。\n**链 (chain)** 防火墙规则集，包括类型和过滤点。\n**子目录 (child directory)**\
  \ 参见 subdirectory。\n**CIDR** 无分类域间路由；类似于 VLSM，CIDR 提供子网掩码，但指定网络保留多少 IPv4 地址。\n**CIFS**\
  \ 通用互联网文件系统；在 Microsoft Windows 系统流行的 SMB 协议。\n**CLI** 命令行界面；通过 Shell 程序中输入命令与操作系统通信的一种。\n\
  **CN** 通用；对象的相对名称。\n**组件 (component)** 在 Debian 包配置中，这是一个用于分类软件包的功能。常见组件包括 Main、Restricted\
  \ 和 Multiverse。\n**条件表达式 (conditional expression)** 编程术语，意味着根据真假测试的结果执行语句。\n**crontab**\
  \ 用于在未来特定时间调度进程的系统。\n**当前目录**\n**CVE** 常见漏洞与披露；旨在提供单一位置的系统，让安全人员了解安全相关的软件问题。\n**守护进程\
  \ (daemon)** 在后台运行并执行特定系统任务的程序。\n**DDoS 攻击** 分布式拒绝服务；当从多个系统发送数据包以淹没主机时。\n**默认链策略\
  \ (default chain policy)** 当链中没有规则被匹配时使用的目标。\n**依赖 (dependency)** 在软件包方面，依赖是包正确运行所需的功能。\n\
  **DFS** 分布式文件系统；跨网络共享文件和目录的技术。\n**DHCP** 动态主机配置协议；为管理员提供向客户端系统动态分配网络相关信息的能力。\n**数字签名\
  \ (digital signature)** 组织可以放在软件包上的唯一“密钥”，以提供验证软件包来源的方法。\n**发行版 (distribution)**\
  \ Linux 操作系统系统的特定实现。\n**distro** 参见 distribution。\n**DN** 别名；对象的全名。\n**DNS** 域名系统；用于将主机名转换为\
  \ IP 地址。\n**DNS 转发器 (DNS forwarder)** 旨在接收互联网网络 DNS 查询并将其发送到外部 DNS 服务器的 DNS 服务器。\n\
  **DNS 主服务器 (DNS master)** 进行区域文件更改的 DNS 服务器。\n**DNS 从服务器 (DNS slave)** 持有 DNS 主服务器区域文件副本的\
  \ DNS 服务器。\n**域名系统 (Domain Name Service (DNS))** 允许主机名到 IP 地址解析的协议。\n**DoS 攻击 (DoS\
  \ attack)** 拒绝服务；当向系统发送大量网络数据包，使系统难以处理所有数据从而导致系统无响应。\n**点分十进制法 (dotted decimal notation)**\
  \ 分为四个八字节的 32 位数字，用于定义 IPv4 地址或子网掩码。\n**环境变量 (environment variable)** 从当前 Shell\
  \ 传递到从 Shell 调用的任何程序或命令的变量。\n\n**ESMTP** 扩展 SMTP。参见 SMTP。\n\n\n\n\n\n`ESSID` 扩展服务集标识符；赋予无线路由器的名称，用于与其他无线路由器区分来。\n\
  \n`eth0` 主要以太网设备名称。\n\n`Ethernet` 以太网；一种允许主机形成网络的技术——主机之间的物理连接线。\n\n`exit status`\
  \ 退出状态；命令或程序返回给调用进程（shell）的数值值。值为 0 表示成功，而值为 1 表示失败。\n\n`extension module` 扩展模块；在\
  \ `iptables` 中，扩展模块是一个可选功能。\n\n`facility` 设施；在系统日志记录中，设施是发送系统日志的服务。\n\n`fiber optic`\
  \ 光纤；一种允许主机形成网络的高速技术——主机之间的物理连接线。\n\n`file glob` 文件通配符；在命令行中指定文件时用于匹配文件名模式的符号。\n\
  \n`file system` 文件系统；用于组织操作系统上文件和目录的结构。\n\n`Filesystem Hierarchy Standard` 文件系统层次结构标准；规定了特定文件应存储在哪些目录的标准。\n\
  \n`filtering point` 过滤点；防火墙中放置规则的组件。\n\n`firewall` 防火墙；一种设计用于允许或阻塞网络流量的网络设备。\n\n\
  `firewalld` 一种前端实用程序，旨在简化使用 `iptables` 配置防火墙的过程。\n\n`firmware` 固件；嵌入在硬件中的程序。\n\n\
  `footprinting` 足迹扫描；也称为侦察（reconnaissance），是指发现有关网络或系统信息的过程，意图利用这些信息破坏安全措施。\n\n`foreground\
  \ process` 前台进程；一种阻止父进程在以前台进程终止之前执行任何额外程序的进程。\n\n`forward DNS lookup` 正向 DNS 查询；当查询提供域名时，DNS\
  \ 服务器提供该域名对应的 IP 地址的过程。\n\n`forward lookup` 正向解析；将 IP 地址翻译为域名的过程。\n\n`FTP` 文件传输协议；用于在主机之间传输文件。\n\
  \n`fully qualified domain name (FQDN)` 完全限定域名；一个从 DNS 结构顶端开始的主机域名。\n\n`gateway`\
  \ 网关；一种连接两个网络的网络设备。也称为路由器。\n\n`GECOS` 通用综合操作系统；一种利用特定命令来填充和查看 `/etc/passwd` 文件注释字段的功能。\n\
  \n`GID` 参见 `group ID`。\n\n`group account` 组账户；用户可以分配到的账户以提供额外的系统访问。\n\n`group ID`\
  \ 组 ID；分配给组账户的唯一数值值。\n\n`GRUB`  {统一引导加载程序；现代 Linux 发行版中最常用的引导加载程序。\n\n`GUI` 图形用户界面；通过使用鼠标和键盘的窗口化环境与操作系统通信的一种。\n\
  \n`hexadecimal notation` 十六进制表示；将 128 位数字分为八个等份，用于定义 IPv6 地址。\n\n`HIDS` 基于主机的入侵检测系统；运行在特定系统上的入侵检测系统，用于判断是否发生了入侵尝试。\n\
  \n`host` 主机；在网络上进行通信的设备。\n\n`HTML` 超文本标记语言；用于开发网页的语言。\n\n`HTTP` 超文本传输协议（或简称为 `hypertext`）；自\
