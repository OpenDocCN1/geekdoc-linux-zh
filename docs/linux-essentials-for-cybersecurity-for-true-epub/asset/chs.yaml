  </IfModule>\n```\n\n### 步骤 4. 重启 Apache Web 服务器\n\n请记住，之前的步骤应该已经提供了基本的 PHP 功能。对于真实世界的\
  \ Apache Web 服务器，可能还有你想要探索的额外配置设置。\n\n如何判断它是否生效了？首先，在 `DocumentRoot` 目录（例如 `/var/www/html`）中创建以下文件（命名为\
  \ `hello.php`）：\n\n点击此处查看代码图片\n\n```html\n<html>\n<head>\n<title>PHP Test</title>\n\
  </head>\n<body>\n<?php echo '<p>Hello World</p>'; ?>\n</body>\n</html>\n```\n\n\
  然后，通过将浏览器指向 `localhost/hello.php` URL 来测试脚本。结果应该看起来像图 21-2。\n\n![图像](img/21fig02.jpg)\n\
  \n**图 21-2** *PHP 测试页面*\n\n#### 可能会出现什么问题？\n\n`IfModule prefork.c` 指令用于指定何时加载模块。关键元素是\
  \ `LoadModule` 行，因此请勿删除此值。\n\n要启用 Perl 脚本，请执行以下步骤：\n\n#### 步骤 1. 确保系统上安装了 Perl Apache\
  \ 模块\n\n例如，以下命令验证 CentOS 系统上安装了 PHP：\n\n点击此处查看代码图片\n\n```\n[root@localhost ~]# yum\
  \ list installed | grep mod_perl\nmod_perl.x86_64                        2.0.8-10.20140624svn1602105.el7\
  \ @epel\n```\n\n#### 步骤 2. 验证 `mod_perl.so` 文件是否在 Apache Web 服务器模块目录中\n\n该文件应已 mod_perl\
  \ 软件软件包一起安装。在 CentOS 系统上，Apache Web 服务器模块位于 `/etc/httpd/modules` 目录：\n\n点击此处查看代码图片\n\
  \n```\n[root@localhost ~]# ls /etc/httpd/modules/*perl*\n/etc/httpd/modules/mod_perl.so\n\
  ```\n\n#### 步骤 3. 配置 Apache Web 服务器以启用 Perl\n\n这可以通过修改主配置文件或在模块的 `include` 目录中创建文件来实现，如下：\n\
  \n点击此处查看代码图片\n\n```\n[root@localhost ~]# cat /etc/httpd/conf.modules.d/02-perl.conf\n\
  #\n# Mod_perl 将 Perl 解释器整合到 Apache Web 服务器中，\n# 这样 Apache Web 服务器就可以直接执行 Perl 代码。\n\
  # Mod_perl 将 Perl 运行时库链接到 Apache Web 服务器\n# 并为 Apache 的 C 语言 API 提供面向对象的 Perl 接口。\n\
  # 结果是更快的 CGI 脚本处理过程，\n# 因为不需要启动外部的 Perl 解释器。\n#\nLoadModule perl_module modules/mod_perl.so\n\
  ```\n\n#### 步骤 4. 在主 Apache Web 服务器配置文件中添加以下内容\n\n点击此处查看代码图片\n\n```\n<Directory\
  \ /var/www/html/perl>\nAllowOverride All\nSetHandler perl-script\nPerlHandler ModPerl::Registry\n\
  PerlOptions +ParseHeaders\nOptions ExecCGI\nOrder allow,deny\nAllow from all\n</Directory>\n\
  ```\n\n这允许你将 Perl 脚本放置在 `/var/www/html/perl` 目录下。\n\n#### 步骤 5. 重启 Apache Web 服务器\n\
  \n如何判断它是否生效了？首先，在 `/var/www/html/perl` 目录下创建以下文件（命名为 `hello.pl`）：\n\n点击此处查看代码图片\n\
  \n```perl\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\nprint \"hello\\n\";\n\
  ```\n\n然后，通过将浏览器指向 `localhost/perl/hello.pl` URL 来测试脚本。结果应该看起来像图 21-3。\n\n![图像](img/21fig02.jpg)\n\
  \n**图 21-3** *PHP 测试页面*\n\n\n\n\n| `MaxSpareServers` | 如果 Apache Web 服务器的需求减少，可能会有一大量\
  \ `httpd` 进程“闲置”等待客户端请求。`MaxSpareServers` 指令用于告诉 Apache 在不使用时“杀掉”多余服务器。 |\n| `MaxClients`\
  \ | 在某种意义上，这可以被称为“最大服务器数”。请记住，每个服务器处理一个客户端。如果将 `MaxClients` 指令设置为 `150`，则将启动最多 150\
  \ 个服务器。结果是客户端的最大数量也是 150。 |\n| `MaxRequestsPerChild` | 在拒绝服务 (DoS) 攻击中，多个客户端机器可能会向\
  \ Apache Web 服务泛洪大量请求。如果有足够多的客户端机器（数量等于 `MaxClients` 的数量），这种攻击可以有效地禁用 Web 服务器。将\
  \ `MaxRequestPerChild` 设置为 `5000` 等值可以限制 DoS 攻击的效性。 |\n\n### 示例 21-1 启动 `httpd`\
  \ 进程\n\n点击此处查看代码图像\n\n```\n[root@localhost perl]# ps -fe | grep httpd\nroot    \
  \ 24007     1  2 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\napache  \
  \ 24009 24007  0 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\napache  \
  \ 24010 24007  0 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\napache  \
  \ 24011 24007  0 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\napache  \
  \ 24012 24007  0 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\napache  \
  \ 24013 24007  0 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\napache  \
  \ 24014 24007  0 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\napache  \
  \ 24015 24007  0 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\napache  \
  \ 24016 24007  0 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\napache  \
  \ 24017 24007  0 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\napache  \
  \ 24018 24007  0 17:02 ?        00:00:00 /usr/sbin/httpd -DFOREGROUND\n```\n\n####\
  \ 用户身份验证\n\n在公共 Web 服务器上，你可能决定限制对特定目录的访问。这可以通过设置一种验证方法来实现，该方法要求客户端用户知道用户名和密码。（注意，这些不是普通用户名，而是专门为\
  \ Apache Web 服务器准备的用户名。）\n\n要使用此功能，你需要确保加载了 `mod_auth` 模块。该模块可以从主配置文件加载，也可以从模块的\
  \ `include` 目录加载。\n\n为了保护网站的部分内容，你需要创建一个密码文件。执行 `htpasswd` 命令，如下所示：\n\n点击此处查看代码图像\n\
  \n```\n[root@localhost ~]# htpasswd -c /etc/httpd/conf/password bob\nNew password:\n\
  Re-type new password:\nAdding password for user bob\n```\n\n`-c` 选项创建一个密码文件。`-c`\
  \ 选项后的参数是密码文件的位置。它应该存放在安全的地方；合适的地方是 `/etc/httpd/conf` 目录（或你系统中存储 Apache Web 服务器配置文件的任何位置）。最后一个参数\
  \ (`bob`）是与密码关联的用户名。\n\n你有两个地方可以选择为特定目录配置安全性。在主配置文件中你可以添加类似下方的条目：\n\n点击此处查看代码图像\n\
  \n```\n<Directory /var/www/html/secure>\nAuthName \"Secure folder\"\nAuthType Basic\n\
  AuthUserFile /etc/httpd/conf/password\nRequire valid-user\n</Directory>\n```\n\n\
  或者你可以在 `/var/www/html/secure` 目录下创建一个名为 `.htaccess` 的文件。该文件将具有以下指令：\n\n点击此处查看代码图像\n\
  \n```\nAuthName \"Secure folder\"\nAuthType Basic\nAuthUserFile /etc/httpd/conf/password\n\
  Require valid-user\n```\n\n### 虚拟主机\n\n在某些情况下，你可能想要托管多个网站。（此处原文存在大量重复，已根据要求精简并翻译）。\n\
  \n**会话学习™——基于 IP 与基于名的虚拟主机**\n\n**Gary**: 嘿，Julia。我正在设置一些 Web 服务器，我不确定该用哪种技术。\n\n\
  **Julia**: 你说的“哪种技术”是指什么？\n\n**Gary**: 嗯，我需要在一个系统上设置三个 Web 服务器，我可以采用基于 IP 的方法或基于名的方法。\n\
  \n**Julia**: 噢，是的，好的。通常，如果你要成为 Web 服务器提供商并想在单机上托管多个不同的网站，你会使用基于 IP 的技术。\n\n**Gary**:\
  \ 为什么呢？\n\n\n\n\n\n**Julia**: 好的，请记住，使用基于 IP 的方法，你可能只有一张网卡，并且将为这块网卡分配多个 IP 地址。这对于\
  \ 托管机构是非常理想的，因为他们不想安装大量的网卡，而且每个网站都应该有一个独立的 IP 地址。\n\n**Gary**: 好的，那么这应该是最好的解决方案吗？\n\
  \n**Julia**: 这可能取决于情况。你计划让这些成为内部服务器，还是互联网上可用的服务器？\n\n**Gary**: 仅限内部。\n\n**Julia**:\
  \ 那么你可能会发现基于名称的技术更简单。你只需要在那块网卡上使用一个 IP 地址，只需要更新名称服务器，让它为每个域名或 URL 提供相同的 IP 地址即可。\n\
  \n**Gary**: 好的，这看起来确实是这种情况的最佳办法。谢谢你，Julia。\n\n### HTTPS\n\n发工资了！到了是你登录银行在线网站并支付那些账单的时间了。你输入银行的\
  \ URL，注意到“https://”这几个字母神奇地出现在网站名称之前。在本章的早些部分，你已经接触了 HTTP（超文本传输协议，但现在这个缩写后面增加了一个“s”。\n\
  \nHTTPS 是一种更新、更安全的协议。大多数人将其称为 HTTP Secure 或 HTTP SSL（SSL 代表安全套接层，一种基于安全的协议）。HTTPS\
  \ 提供了两个主要优势：网站的身份经过了验证，并且客户端（网页浏览器）与服务器（Web 服务器）之间交换的数据更加安全，因为它们经过了加密。\n\n**注意**\n\
  \n如果你查看关于 HTTPS 的文档，你会发现现在也经常使用一种名为 TLS（传输层安全) 的更新的加密协议。TLS 的设计是为了取代 SSL，但社区经常将\
  \ TLS 称为 SSL。\n\n在管理 Apache Web 服务器时，你应该意识到 HTTPS 使用 443 端口进行网络通信，而 HTTP 使用 80 端口。\n\
  \n### SSL 基础知识\n\nSSL 采用的技术被称为`非对称加密`](gloss.xhtml_gloss12)（它也被称为 `PKC`](gloss.xhtml_gloss172)\
  \ 或 `公钥加密`）。在非对称加密中，使用了两个密钥：一个公钥和一个私钥。这些密钥用于加密和解密数据。\n\n公钥用于加密发送到 Apache Web 服务器的数据。该密钥在收到请求时提供给所有系统。例如，当网页浏览器首次连接到使用\
  \ SSL 的 Apache Web 服务器时，浏览器会请求服务器的公钥。这个公钥会免费提供给浏览器。\n\n从网页浏览器发送到服务器的任何额外数据（如用户名和密码）都会使用此公钥进行加密。这些数据只能由服务器使用私钥进行解密。这就是`非对称加密`术语出现的地方。在`对称加密`中，使用同一个密钥来加密和解密数据。使用非对称加密时需要两个独立的密钥：一个用于加密数据，另一个用于解密。这意味着只有\
  \ Web 服务器可以解密网页浏览器发送的数据。\n\n你可能会好奇网页浏览器到底是如何知道自己连接的是正确的 Web 服务器而不是某个“流氓”Web 服务器的。当服务器发送它的公钥时，它包含一个数字签名（也称为`消息摘要`）。这个数字签名可以发送到\
  \ CA（证书机构） 服务器，这是一个用于验证数字签名的受信任第三方系统。\n\n从用户的角度来看，这一切都发生在幕后，并且完全透明——除非发生错误且网页浏览器显示了警告信息。因为数字证书通常有有效期，最常见的问题是\
  \ CA 没有更新的数字证书——或者用户更改了他们计算机上的日期！\n\n请参见 图 21-4 获取此过程的视觉示例。\n\n![Image](img/21fig04.jpg)\n\
  \n**图 21-4** *SSL 流程*\n\n### SSL 问题\n\nSSL 并不是一个完美的解决方案。以下是关于使用 SSL 的一些安全考虑：\n\n\
  * 拥有大量的证书机构 (CA) 机器增加了一个被攻破的可能性。大多数网页浏览器都有一个可以使用的 CA 大型列表。\n* 信任也是一个问题。数字签名的目的是让你的网页浏览器不会盲目信任与其通信的网站。然而，你的网页浏览器在某种程度上确实在盲目地信任\
  \ CA。CA 存在层级结构，最顶层是根 CA。这个概念是，子 CA 受到信任是因为它的父级 CA 是这么说的，但在结构的顶端，根 CA 并没有办法去说“因为其他某个\
  \ CA 是这么说的，所以信任我”。它基本上是在说“信任我，因为我是根 CA”。\n* `中间人攻击`](gloss.xhtml_gloss131) 也是可能的。这将发生在你通过路由器（通常是不可信的无线路由器）连接时，该路由器可以利用连接并在数据传输时读取数据。\n\
  * 如果你有虚拟主机，SSL 也是一个挑战。每个虚拟主机都应该有自己的数字签名。然而，当客户端（网页浏览器）首次联系服务器（Apache Web 服务器）时，客户端在请求公钥时不包含网站名称。结果是服务器不知道应该向客户端发送哪个数字签名。这个问题有解决方法，但其细节超出了本书的范围。你应该意识到在使用\
  \ SSL 时虚拟主机所带来的问题。\n* 与任何非对称加密技术一样，私钥的安全性至关重要。如果此密钥提供给了错误的元素，加密数据可能会被破解。\n\n###\
  \ 自签名\n\n需要注意的是，并不是所有网站都使用第三方 CA 来验证网站身份（尽管你的银行网站是这样）。组织让第三方 CA 执行验证是需要成本的。因此，较小组织通常使用被称为`自签名证书`](gloss.xhtml_gloss212)\
  \ 的过程。\n\n本质上，自签名证书是不需要第三方 CA 验证的。自签名证书时，服务器展示其公钥和数字签名，本质上是在说“信任我，我是正确的网站。”\n\n\
  ### SSL 与 Apache\n\n你可以通过多种方式实现 SSL。本节的技术是使用名为 `mod_ssl` 的模块。另一种方法是使用名为 [Apache-SSL](http://www.apache-ssl.org/)\
  \ 的 Apache Web 服务器。这是核心 Apache Web 服务器与 OpenSSL 项目软件的结合。某些产品也提供定制的 SSL Apache Web\
  \ 服务器。\n\n实现 `mod_ssl` 非常简单。你只需要在 Apache 配置文件中添加一行：\n\n```\nLoadModule ssl_module\
  \ /path/to/modules/mod_ssl.so\n```\n\n事实上，可能比这更简单。如果你安装了 `mod_ssl` 软件包，配置过程可能会自动发生。例如，在典型的\
  \ CentOS 系统上，安装 `mod_ssl` 软件包后会出现以下文件：\n\n```\n[root@localhost ~]# ls /etc/httpd/conf.modules.d\n\
  00-base.conf  00-lua.conf  00-proxy.conf  00-systemd.conf  02-perl.conf\n00-dav.conf\
  \   00-mpm.conf  00-ssl.conf  01-cgi.conf      10-php.conf\n[root@localhost ~]#\
  \ more /etc/httpd/conf.modules.d/00-ssl.conf\nLoadModule ssl_module modules/mod_ssl.so\n\
  ```\n\n\n\n\n回想本章前面的内容，`/etc/htppd/conf.modules.d` 目录下的文件已包含在该 CentOS 系统的 Apache\
  \ Web 服务器的配置过程中。\n\n如果现在重启 Apache Web 服务器，它将同时接受普通的 HTTP 和 HTTPS 请求。很可能你只想接受 HTTPS\
  \ 请求；但目前这产生了一点问题，因为此时你尝试此时通过 HTTPS 连接到 Web 服务器，你将收到一条类似图 21-5 所示的警告消息。\n\n![Image](img/21fig05.jpg)\n\
  \n**图 21-5** 浏览器警告消息\n\n出现此警告是因为你没有设置数字签名并让 CA（证书颁发机构）对其签名。该过程将在下一节中描述。\n\n### SSL\
  \ 服务器证书\n\n要创建 SSL 证书，你必须安装 `openssl` 软件包。回想一下你有两个选择：可以由 CA 对你的证书进行数字签名，也可以进行自签名。如果你打算使用\
  \ CA，首先要执行 `openssl` 命令来生成 RSA 密钥文件。语法如下：\n\n点击此处查看代码图像\n\n```\n[root@localhost\
  \ ~]# openssl genrsa -des3 -out server.key 1024\nGenerating RSA private key, 1024\
  \ bit long modulus\n..++++++\n.......................................................................................................................++++++\n\
  e is 65537 (0x10001)\nEnter pass phrase for server.key:\nVerifying - Enter pass\
  \ phrase for server.key:\n```\n\n参数 `genrsa` 通知 `openssl` 命令创建一个 RSA 密钥文件。另一个选项是生成\
  \ DSA 密钥文件；然而，在这种情况下通常优选 RSA。DSA 的签名速度快，但验证速度慢（当与 Web 服务器配合时，验证发生的频率比签名高得多）。\n\n\
  **注意**\n\nRSA 代表什么？该缩写由该技术发明者姓氏的首字母组成：Ron Rivest、Adi Shamir 和 Leonard Adleman。DSA\
  \ 代表什么？数字签名算法（Digital Signature Algorithm）。\n\n`-des3` 参数指定用于加密的算法（三重 DES），`server.key`\
  \ 参数指示存储密钥的文件名，而 `1024` 参数指定密钥的位大小。如果你使用密钥文件中的数据，则需要密码短语。\n\n下一步是执行示例 21-4 中的命令来生成\
  \ CSR（证书签名请求）。\n\n**示例 21-4** 生成 CSR\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# openssl\
  \ req -new -key server.key -out server.csr\nEnter pass phrase for server.key:\n\
  You are about to be asked to enter information that will be incorporated\ninto your\
  \ certificate request.\nWhat you are about to enter is what is called a Distinguished\
  \ Name or a DN.\n有许多字段，但你可以留空\n对于某些字段将有一个默认值，\n如果你输入 '.'，则该字段将留空。\n-----\nCountry\
  \ Name (2 letter code) [XX]:US\nState or Province Name (full name) []:CA\nLocality\
  \ Name (eg, city) [Default City]:San Diego\nOrganization Name (eg, company) [Default\
  \ Company Ltd]:OCS\nOrganizational Unit Name (eg, section) []:\nCommon Name (eg,\
  \ your name or your server's hostname) []:OCS\nEmail Address []:bo@onecoursesource.com\n\
  \nPlease enter the following 'extra' attributes\nto be sent with your certificate\
  \ request\nA challenge password []:linuxrocks\nAn optional company name []:\n```\n\
  \n`req` 参数用于指定你想创建一个 CSR，`-new` 参数用于创建一个新的 CSR，`-key` 参数用于指定你之前创建的密钥，而 `-out` 参数用于创建发送给\
  \ CA 的文件。\n\n要对密钥自签名，你首先需要安装 `openssl-perl` 软件包。然后执行示例 21-5 所示的命令。（注意：`CA.pl` 文件的具体位置在你的系统中可能有所不同。）\n\
  \n**示例 21-5** 设置 CA\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]# mkdir /tmp/test\n\
  [root@localhost ~]# cd /tmp/test\n[root@localhost test]#  /etc/pki/tls/misc/CA.pl\
  \ -newca\nCA certificate filename (or enter to create)\n\nMaking CA certificate\
  \ ...\nGenerating a 2048 bit RSA private key\n....................................+++\n\
  ...+++\nwriting new private key to '/etc/pki/CA/private/cakey.pem'\nEnter PEM pass\
  \ phrase:\nVerifying - Enter PEM pass phrase:\n-----\nYou are about to be asked\
  \ to enter information that will be incorporated\ninto your certificate request.\n\
  What you are about to enter is what is called a Distinguished Name or a DN.\n有许多字段，但你可以留空\n\
  对于某些字段将有一个默认值，\n如果你输入 '.'，则该字段将留空。\n-----\nCountry Name (2 letter code) [XX]:US\n\
  State or Province Name (full name) []:CA\nLocality Name (eg, city) [Default City]:San\
  \ Diego\nOrganization Name (eg, company) [Default Company Ltd]:OCS\nOrganizational\
  \ Unit Name (eg, section) []:\nCommon Name (eg, your name or your server's hostname)\
  \ []:OCS\nEmail Address []:bo@onecoursesource.com\n\nPlease enter the following\
  \ 'extra' attributes\nto be sent with your certificate request\nA challenge password\
