  \n## 第 20 章 网络服务配置：基本服务\n\n作为管理员，你应该知道如何正确设置和保护关键网络服务器。在本章中，你将探索其中一些服务器，包括 DNS、DHCP\
  \ 和邮件服务器。\n\n\n\n\n你将从学习域名命名服务（DNS）的关键组件以及如何配置 BIND DNS 服务器开始。然后你将学习如何设置动态主机配置协议（DHCP）服务器，并发现此服务器如何与\
  \ DNS 服务器交互。\n\n本章将以对电子邮件服务的深入讨论结束，包括设置和配置 Postfix、procmail 和 Dovecot。\n\n在阅读本章并完成练习后，你将能够做到：\n\
  \n- 配置并加固 BIND DNS 服务器\n- 设置 DHCP 服务器\n- 解释关键的电子邮件功能\n- 配置 Postfix 服务器\n- 配置邮件投递软件，包括\
  \ procmail 和 Dovecot\n\n## DNS 服务器\n\n`DNS`（域名命名服务）是一种旨在提供名称到 IP 地址解析的协议。它是标准 TCP/IP\
  \ 协议族的一部分，也是若干种可以提供此功能的协议之一；其他协议还包括网络信息服务（NIS）和 LDAP。\n\nDNS 与其他类似协议的区别在于，它的唯一重点是名称解析；而\
  \ `NIS` 和 `LDAP` 提供其他解析操作，例如网络用户和组账户。`DNS` 也是大多数连接到互联网的系统的标准名称解析解决方案。\n\nDNS 客户端配置非常简单——只需在本地系统的\
  \ `/etc/resolv.conf` 文件中指定 DNS 服务器即可：\n\n点击此处查看代码图像\n\n```\n[root@onesourcesource\
  \ ~]#cat /etc/resolv.conf\nnameserver 192.168.1.1\n```\n\nDNS 服务器的配置可能复杂得多。为了正确地配置\
  \ DNS 服务器，你应该理解 DNS 背后的一些概念。\n\n### 核心术语\n\n以下是与 DNS 相关的一些重要术语：\n\n- **主机 (Host)**：主机通常是指连接到网络上的计算机（台式机、笔记本电脑、平板电脑或手机）。该术语的另一个角度是主机是可以在网络上通信的设备。\n\
  - **域名 (Domain name)**：互联网上的主机使用 IP 地址数字进行互相通信。这些数字对人类来说很难记忆，因此通常给主机分配一个唯一的名称。当此名称在授权的\
  \ DNS 服务器上注册时，该名称被视为“域名”。\n- **顶级域名 (Top-level domain)**：域名在结构上是按树状方式组织的，就像文件在虚拟文件系统结构中的组织方式一样。DNS\
  \ 结构的最顶层简单称为“点”，并用 `.` 字符表示。`.` 下方的域名是顶级域名。原始的顶级域名有 .com、.org、.net、.int、.edu、.gov\
  \ 和 .mil。最近又添加了许多其他的。\n- **FQDN**：`FQDN`或全限定域名，是从 DNS 结构顶部开始的主机域名。例如，`www.onecoursesource.com.`\
  \ 就是一个 `FQDN`。注意 FQDN 最末尾的点（`.`）。它是顶级域名之上的域名。普通用户在提供域名时通常会省略这个字符，因为在大多数情况下点被认为是\
  \ FQDN 的最后一个字符。然而，如果你将管理 DNS 服务器，就应该习惯包含这个点字符，因为它在某些 DNS 服务器配置文件中是必需。\n- **子域名 (Subdomain)**：子域名是较大域的组成部分的任何域名。例如，假设你想在组织中设置三个域名来从功能上组织主机。你可能会将这些域名称为“sales”、“eng”和“support”。如果你的公司域名是\
  \ `onecoursesource.com.`，那么这三个子域名将分别被称为 `sales.onecoursesource.com.`、`eng.onecoursesource.com.`\
  \ 和 `support.onecoursesource.com.`。\n- **名称服务器 (Name server)**：名称服务器是响应 DNS 客户端请求的系统。名称服务器提供\
  \ IP 地址到域名的翻译（有时也提供反向翻译：域名到 IP 地址的翻译）。注意，名称服务器要么在本地存储此信息的副本（称为 `zone file`），要么将从其他名称服务器获取的信息临时存储在内存中，或者将查询传递给拥有信息的另一个或多个服务器。\n\
  - **权威名称服务器 (Authoritative name server)**：权威名称服务器是根据存储在系统本地的信息（原始主记录）返回结果的服务器。\n\
  - **区域文件 (Zone file)**：用于存储 IP 地址到域名的翻译信息（即 DNS 记录）的文件名。该文件还包含用于定义域本身的信息。\n- **记录\
  \ (Record)**：在区域文件中，记录是定义区域内单块信息的条目，例如将 IP 地址翻译为域名的数据。\n- **缓存名称服务器 (Caching name\
  \ server)**：缓存名称服务器是根据从另一个名称服务器（例如权威名称服务器）获取的信息返回结果的服务器。缓存名称服务器的主要优势是它可以加速 IP 地址到域名的解析，因为它会缓存结果并能够使用缓存中的信息响应未来的请求。\n\
  - **TTL**：存储在缓存名称服务器中的数据通常不是永久存储的。提供数据的名称服务器还会为缓存名称服务器提供 `TTL`，或“生存时间”（time to live）。缓存名称服务器将信息存储在内存中，直到此\
  \ `TTL` 结束。通常这段时间是 24 小时，但取决于权威名称服务器中记录更新的频率。\n- **DNS 转发器 (DNS forwarder)**：旨在接收内部网络的\
  \ DNS 查询并将其发送到外部 DNS 服务器的服务器。\n- **正向查询 (Forward lookup)**：将 IP 地址翻译为域名的过程。大多数 DNS\
  \ 服务器提供此功能。\n- **反向查询 (Reverse lookup)**：将域名翻译为 IP 地址的过程。虽然许多 DNS 服务器提供此功能，但它比正向查询常见。\n\
  - **BIND**：伯克利互联网域名；互联网上使用最广泛的 DNS 软件。该软件最初在加州大学伯克利分校开发。`BIND` 当前版本被称为 BIND 9。\n\
  \n### 解析是如何工作的\n\n以下示例特意简化，旨在让你了解解析是如何工作的原理。许多因素可能会改变此过程运行的确切性质，包括示例中描述的每个 DNS 服务器的具体配置情况。\n\
  \n对于此示例，考虑一种情况：你正在使用浏览器访问 `www.onecoursesource.com` 域名。为了确定该域名的 IP 地址，你的系统首先需要确定它可以查询哪些\
  \ DNS 服务器。需要查询 `/etc/resolv.conf` 文件获取此类信息：\n\n点击此处查看代码图像\n\n```\n[root@onesourcesource\
  \ ~]#cat /etc/resolv.conf\nnameserver 192.168.1.1\n```\n\n大多数情况下，最好有两个名称服务器设置。如果第一个名称服务器不可用，第二个可以回答查询。然而，你会发现一些小公司只为他们的系统提供一个名称服务器。此外，如果你使用虚拟机（VM），通常虚拟机管理器将作为虚拟机的唯一名称服务器。因此，如果你发现\
  \ `/etc/resolv.conf` 文件中只有一个名称服务器设置，请不要惊讶。\n\n\n\n\n查询被发送到 IP 地址为 `192.168.1.1`\
  \ 的名称服务器，这是组织内的 DNS 服务器。你可以判断这一点，因为该 IP 地址是一个“私有”IP（在互联网上不可路由）。尽管此 DNS 服务器可能缓存了之前对\
  \ `www.onecoursesource.com` 查询的结果，但我们暂假设本地 DNS 服务器没有这些信息。在这种情况下，DNS 服务器需要将请求传递给另一个\
  \ DNS 服务器。\n\n虽然可以配置 DNS 服务器将请求传递给其他特定的 DNS 服务器，但在大多数情况下，查询是传递给位于 DNS 域名结构顶部的 DNS\
  \ 服务器的。这些被称为“根服务器”，共有 13 个；示例 20-1 显示了在 `BIND` 区域文件中描述的这些服务器。\n\n### 示例 20-1 *根服务器*\n\
  \n点击此处查看代码图像\n\n```\n;; ANSWER SECTION:\n.                      518400  IN     \
  \ NS      a.root-servers.net.\n.                      518400  IN      NS      b.root-servers.net.\n\
  .                      518400  IN      NS      c.root-servers.net.\n.          \
