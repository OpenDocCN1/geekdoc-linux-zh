  \ 谢谢，Julia！\n\n### 总结\n\n知道去哪里寻找帮助很重要。在本章中，你学习了在 Linux 中编辑文件。你学习了如何使用编辑器来查看文档。你学习了如何使用\
  \ man 页面和 info 页面。你还学习了如何使用初始化文件，如 `/etc/profile` 和 `/.bashrc`。你还学习了使用 `vi` 编辑器编辑文件。\n\
  \n### 术语\n\n*   使用 `vi` 编辑器编辑文本](#ch03.xhtml_fig3_4)\n*   使用 info 页面查看信息](#ch03.xhtml_fig3_4)\n\
  \n### 习题\n\n**1. 想要否定互联网搜索的价值。**\n\n**2. 假设你已经具备搜索互联网的技能。**\n\n**3. 一个警告你可能已经知道了。**\n\
  \n**4. 在互联网上找到的所有并不都是准确的。**\n\n**5. 使用错误信息除了让你感到沮丧，还可能带来安全风险。**\n\n**6. 我应该从哪里开始？**\n\
