  Jan 19 17:45:15 ubuntu ovpn-client[3389]: Use --help for more information.\n```\n\
  \n### gpg\n\nGNU 隐私守护工具 `gpg` 可用于创建公钥和私钥密钥。这些密钥可以用于多个功能，包括加密文件，以便数据在传输到另一个系统时更加安全。\n\
  \n第一步是使用 `gpg --gen-key` 命令创建加密密钥。该命令的结果是 `~/.gnupg` 目录下的文件集，可用于加密数据或对消息进行数字签名。参见\
  \ 示例 33-6。\n\n**示例 33-6** *`gpg --gen-key` 命令*\n\n点击此处查看代码图片\n\n\n\n\n\n如果你收到“可用随机字节不足。请执行其他工作以给操作系统留出收集更多熵的机会！”的消息，请继续操作你的系统，它最终会生成足够的随机字节。*发生此错误的原因是系统从随机访问内存（RAM）中的随机项生成加密密钥，而这些项会根据系统操作进行填充。*如果你不耐烦，可以尝试运行一个系统密集型命令，例如\
  \ `sudo find / -type f | xargs grep blahblahblah > /dev/null`。\n\n为了让用户能够加密数据并发送给你，他们需要你的公钥。要将此公钥发送给用户，请先执行以下命令创建一个公钥文件：\n\
  \n点击此处查看代码\n\n```\ngpg --output pub_key_file  --export 'June Jones'\n```\n\n`--output`\
  \ 选项用于指定公钥文件名。`--export` 选项用于指定你想发送的密钥。\n\n发送公钥后，接收用户通过执行以下命令将密钥导入其 GPG 数据库中（`pub_key_file`\
  \ 是他们从你处接收的文件）：\n\n```\ngpg --import pub_key_file\n```\n\n然后用户可以使用以下命令加密文件：\n\n\
  点击此处查看代码\n\n```\ngpg --encrypt --recipient june@jones.com data.txt\n```\n\n在文件被加密后，唯一的解密方法是使用你系统上的私钥通过\
  \ `gpg --decrypt` 命令。\n\n## 安全警报服务\n\n安全警报服务提供有关当前安全问题、漏洞和利用的及时信息。目前有多项服务旨在为你提供重要的安全警报。以下是其中一些服务：\n\
  \n*   **BugTraq**: 该服务是一个基于电子邮件的程序，由 Security Focus 赞助([www.securityfocus.com](http://www.securityfocus.com))）。根据网站介绍，“BugTraq\
  \ 是一个受审核的全公开披露邮件列表，用于*详细*讨论和发布计算机安全漏洞：它们是什么、如何利用它们以及如何修复它们。”如需订阅该列表，请访问以下链接：[`www.securityfocus.com/archive/1/description#0.3.1`](http://www.securityfocus.com/archive/1/description#0.3.1)。\n\
  \n*   **CERT**：通常情况下，CERT 代表计算机应急响应小组（Computer Emergency Response Teams）。但在在这种情况下，指的是一个特定的\
  \ CERT：卡内基梅隆大学（CMU）的 CERT 协调中心（CERT-CC）。该机构是 CMU 一个较大的组织软件工程学院（SEI）的一部分。CERT 提供多种功能，包括漏洞分析工具、漏洞说明知识库以及与私人和政府组织就安全问题协调。访问\
  \ [www.cert.org](http://www.cert.org) 了解更多关于该机构的信息。\n\n*   **US-CERT**: 美国 CERT\
  \ ([www.us-cert.gov](http://www.us-cert.gov))。在该网站可以找到网络安全通信中心（NCCIC）。根据网站介绍，US-CERT\
  \ 是“国家旗舰级的网络防御、事件响应和业务集成中心”，其使命是“减少国家面临系统性网络安全和通信挑战的风险”。\n\n### 总结\n\n涉及到安全时，你会发现总有学不完的内容。本章涵盖了一些在逻辑上不适合本书其他章节的额外安全主题。你发现了如何使用\
  \ `gpg` 工具加密文件以确保传输过程安全。你还学习了如何配置 fail2ban 和 OpenVPN。最后，你了解了可以提供有关安全问题重要信息的安全网站。\n\
