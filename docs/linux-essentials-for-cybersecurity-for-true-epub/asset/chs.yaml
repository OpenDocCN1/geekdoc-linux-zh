  \ |\n| 6 | 游戏 |\n| 7 | 杂项 |\n| 8 | 系统管理员命令 |\n| 9 | 内核例程 |\n\n`man -f` 命令将列出任何现有手册页的所有章节。如果你不知道命令或配置文件的精确名称，可以使用\
  \ `man` 命令的 `-k` 选项来搜索“关键词”，如示例 3-1](#ch03.xhtml_exa3_1）所示。\n\n```\nman -k password\
  \ | head -n 5\nchage (1)            - 更改用户密码信息\nchpasswd (8)        - 批量更新组密码\n\
  chpasswd (8)         - 批量更新密码\ncpgr (8)             - 锁定并复制文件到密码\ncppw (8)     \
  \        - 锁定并复制文件到密码\n```\n\n**注意**\n\n`man -f` 命令与 `whatis` 命令相同。\n\n在某些情况下，当你使用\
  \ `man -f` 或 `man -k` 命令时可能得不到响应。例如，你可能会得到如下的内容：\n\n```\nman -k passwd\npasswd:\
  \ 没有适当的内容。\n```\n\n这可能是因为存储手册页及其描述的数据库尚未构建或更新。要构建此数据库，请以 root 用户身份运行 `mandb` 命令，如示例\
  \ 3-2](#ch03.xhtml_exa3_2）所示。\n\n```\nmandb\n```\n\n\n\n\n\n```\nroot@onecoursesource.com:~#\
  \ mandb\nPurging old database entries in /usr/share/man...\nProcessing manual pages\
  \ under /usr/share/man...\n…\nProcessing manual pages under /usr/share/man/pt_BR...\n\
  Processing manual pages under /usr/local/man...\n0 man subdirectories contained\
  \ newer manual pages.\n456 manual pages were added.\n0 stray cats were added.\n\
  7 old database entries were purged.\n```\n\n### 手帮助页的位置\n\n在某些情况下，`man` 命令可能不在标准位置。这通常发生在你安装第三方软件，且软件开发者选择将帮助页放置在非典型安装位置时。\n\
  \n在这种情况下，你应该为帮助页指定一个备选位置。要指定备用帮助页位置，你可以使用 `-M` 选项：\n\n点击此处查看代码图片\n\n```\n[student@onecoursesource.com\
  \ ~]$ man -M /opt/man testcmd\n```\n\n或者，你可以创建一个 `MANPATH` 变量：\n\n点击此处查看代码图片\n\n\
  ```\n[student@ onecoursesource.com ~]$ MANPATH=/opt/man\n[student@ onecoursesource.com\
  \ ~]$ man testcmd\n```\n\n**注意**\n\n之前的示例仅用于演示，除非你在 `/opt/man` 目录中拥有 `testcmd` 的帮助页，否则它们在你的系统中无法运行。\n\
  \n### 命令帮助选项\n\n某些命令支持一个提供基本帮助功能的选项。大多数情况下，通过使用 `--help` 选项显示帮助，如示例 3-3 所示。\n\n\
  **示例 3-3** *`date --help` 命令输出的前几行*\n\n点击此处查看代码图片\n\n```\nstudent@onecoursesource.com:~$\
  \ date --help | head -n 3\nUsage: date [OPTION]... [+FORMAT]\n  or:  date [-u|--utc|--universal]\
  \ [MMDDhhmm[[CC]YY][.ss]]\n以给定的 FORMAT 显示当前时间，或设置系统日期。\n```\n\n此输出可以帮助你记住命令的选项和功能，而无需阅读该命令的整个帮助页。\n\
  \n**注意**\n\n少数命令使用 `-h` 代替 `--help` 来显示基本帮助功能。\n\n### help 命令\n\n`help` 命令仅为内置 Shell\
  \ 命令提供信息，因为这些命令没有独立的帮助页。例如，你可能认为 `cd` 命令有一个帮助页，因为它是一个有效命令，但由于它是 Shell 内置命令，因此它没有帮助页，如下所示：\n\
  \n点击此处查看代码图片\n\n```\nstudent@localhost:~$ man cd\nNo manual entry for cd\n```\n\n\
  `cd` 命令有一个帮助页，可以通过运行命令 `help cd` 来查看。\n\n提示：不要尝试去背记哪些命令是 Shell 内置命令。当你尝试查看帮助页时遇到“No\
  \ manual entry...”错误时，请直接尝试使用 `help` 命令。或者，你可以通过运行 `help -s` 命令获取所有内置命令的列表，如示例 3-4\
  \ 所示。\n\n**示例 3-4** *`help -s` 命令输出的最后十行*\n\n点击此处查看代码图片\n\n```\nstudent@onecoursesource.com:~$\
  \ help -s | tail\nexport [-fn] [name[=va>  typeset [-aAfFgilrtux>\n false      \
  \              ulimit [-SHabcdefilmn>\n fc [-e ename] [-lnr] [>  umask [-p] [-S]\
  \ [mode>\n fg [job_spec]            unalias [-a] name [na>\n for NAME [in WORDS\
  \ ...>  unset [-f] [-v] [-n] >\n for (( exp1; exp2; exp>  until COMMANDS; do CO>\n\
  \ function name { COMMAN>  variables - Names and>\n getopts optstring name>  wait\
  \ [-n] [id ...]\n hash [-lr] [-p pathnam>  while COMMANDS; do CO>\n help [-dms]\
  \ pattern .>  { COMMANDS ; }\n```\n\n### info 命令\n\n几乎每个命令和配置文件都有帮助页，因为这是记录这些功能的常用技术。相对较新的[info\
  \ 页。每个帮助页仅仅是一个文本文档，而 info 页更像是来自网站的内容，带有超链接以提供更丰富的结构。\n\n例如，输入命令 `info ls` 并使用方向键向下移动到“*\
  \ Menu:”部分。你会看到一个类似于图 3-3 的“目录”。\n\n![Image](img/03fig03.jpg)\n\n**图 3-3** *`ls`\
  \ Info 页中的超链接*\n\n如果你将光标移动到“* Sorting the output”并按回车键，将跳转到该章节。返回主菜单按 `n`。进入下一个章节按\
  \ `n`。返回上一个章节按 `p`。退出 info 查看器按 `q`。\n\n你还可以通过按 `/` 后跟搜索字符串在 info 页中进行搜索。查看器将突出显示首次首次字符串，你可以按\
  \ `n` 查找下一个出现处，或按 `p` 查找上一个。\n\n### 互联网资源\n\n\n\n\n\n获取信息的一个极佳来源就是你正在使用的发行版的官方网站。所有主要的发行版都以指南的形式提供额外的文档。例如，图\
  \ 3-4 展示了红帽企业级 Linux (Red Hat Enterprise Linux)([`access.redhat.com/documentation/en-us/red_hat_enterprise_linux`](https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux))\
  \ 网站提供的几个指南。\n\n![图像](img/03fig04.jpg)\n\n**图 3-4** 红帽企业级 Linux 的可用文档\n\n除了发行版提供的文档外，你还应该考虑\
  \ Linux 包含了许多开源项目。这些项目每个通常都有一些文档，可能会为你提供额外信息或用户指南。\n\n例如，在第 2 章“在命令行上工作](#ch02.xhtml_ch02)”中，介绍了\
  \ `gzip` 工具。该工具是 GNU 软件基金会提供的众多项目之一。它在网站 [`www.gnu.org/software/gzip/manual/gzip.html`](https://www.gnu.org/software/gzip/manual/gzip.html)\
  \ 上有一份非常优秀的指南。\n\n由于这类项目非常多，提供所有文档页的完整列表是不行的。通常，对应命令的 man 页面或 info 页面会提供一个 URL，但你也可以通过简单的互联网搜索找到这些网站。\n\
  \n此外还有许多提供额外 Linux 文档、博客、新闻和论坛的网站。由于太多，无法在书中列出，但以下列表提供了几个非常有用的网站：\n\n*   **Linux\
  \ 文档项目 (The Linux Documentation Project)**: [`www.tldp.org/`](http://www.tldp.org/)。注意，该网站上的某些内容已过时，但《高级\
  \ Bash 脚本编写》指南是一块石中之玉。\n*   **Linux Today**: [www.linuxtoday.com](http://www.linuxtoday.com)。\n\
  *   **Linux 论坛 (Linux Forums)**: [`www.linuxforums.org`](http://www.linuxforums.org)。\n\
  \n## 安全强调\n\n作者并不否定互联网搜索或“Google”搜索的价值。然而，前提是你已经具备了搜索互联网的技能。有一点警告你可能已经知道了：你在互联网上找到的所有内容并不都是准确的，因此在利用互联网作为来源时，始终尝试寻找多个信息源。使用错误信息除了让你感到沮丧，还可能带来安全风险。\n\
