  \ 命令\n\n还有几十个额外的 LVM 命令（LVM 是一个非常的话的话题。几乎所有与 LVM 相关的命令都是 `lvm` 命令的子命令，这很有用。\n\n\
  本章演示的 LVM 命令通常通过指向 `/sbin/lvm` 命令的符号链接来执行：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# which pvcreate\n/sbin/pvcreate\n[root@onecoursesource ~]# ls -l /sbin/pvcreate\n\
  lrwxrwxrwx. 1 root root 3 Oct 22 10:55 /sbin/pvcreate -> lvm\n```\n\n这在救援环境中可能是至关重要的，在救援环境中，`lvm`\
  \ 命令存在，但指向 `lvm` 命令的链接命令不存在。（注意：救援环境是指从恢复 CD 启动系统并尝试修复系统问题的环境。）\n\n当不带参数执行 `lvm`\
  \ 命令时，你将得到一个 `lvm>` 提示符，你可以在其中执行这些子命令，如示例 11-10 所示。\n\n**示例 11-10** *`lvm` 命令*\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# lvm\nlvm> help\n  Available lvm commands:\n\
  \  Use 'lvm help <command>' for more information\n\n  dumpconfig      导出活动配置\n \
  \ formats         列出可用的元数据格式\n  help            显示命令的帮助\n  lvchange        更改逻辑卷的属性\n\
  \  lvconvert       更改逻辑卷布局\n  lvcreate        创建逻辑卷\n  lvdisplay       显示逻辑卷信息\n\
  \  lvextend        为逻辑卷添加空间\n  lvmchange       使用设备映射器，此命令已过时且不起作用\n  lvmdiskscan\
  \     列出可以作为物理卷的设备\n  lvmsadc         收集活动数据\n  lvmsar          创建活动报告\n  lvreduce\
  \        减小逻辑卷的大小\n  lvremove        从系统中删除逻辑卷\n  lvrename        重命名逻辑卷\n  lvresize\
  \        调整逻辑卷的大小\n  lvs             显示逻辑卷信息\n  lvscan          列出所有卷组中的逻辑卷\n  pvchange\
  \        更改物理卷属性\n  pvresize        调整物理卷的大小\n  pvck            检查物理卷的一致性\n  pvcreate\
  \        初始化物理卷供 LVM 使用\n  pvdata          显示物理卷的磁盘元数据\n  pvdisplay       显示物理卷的各种属性\n\
  \  pvmove          在物理卷之间移动区\n  pvremove        从物理卷上删除 LVM 标签\n  pvs          \
  \   显示物理卷信息\n  pvscan          列出所有物理卷\n  segtypes        列出可用的段类型\n  vgcfgbackup\
  \     备份卷组配置\n  vgcfgrestore    恢复卷组配置\n  vgchange        更改卷组属性\n  vgck       \
  \     检查卷组的一致性\n  vgconvert       更改卷组元数据格式\n  vgcreate        创建卷组\n  vgdisplay\
  \       显示卷组信息\n  vgexport        从系统中注销卷组\n  vgextend        向卷组添加物理卷\n  vgimport\
  \        注册导出的卷组\n  vgmerge         合并卷组\n  vgmknodes       在 /dev 创建卷组设备的特殊文件\n\
  \  vgreduce        从卷组中移除物理卷\n  vgremove        删除卷组\n  vgrename        重命名卷组\n\
  \  vgs             显示卷组信息\n  vgscan          搜索所有卷组\n  vgsplit         将物理卷移动到新的或现有的卷组\n\
  \  version         显示软件和驱动版本信息\nlvm> quit\n```\n\n#### 调整逻辑卷的大小\n\n\n\n\n调整 LV（逻辑卷）的大小是一个两步过程。如果你要缩小\
  \ LV 的大小，首先需要缩小文件系统的大小，然后使用 `lvreduce` 命令缩小 LV。某些文件系统不允许你缩小文件系统的大小，不过缩小 LV 大小的情况并不罕见。\n\
  \n你很可能是要增大 LV 的大小。在这种情况下，你首先增大 LV，然后“增长”文件系统。注意，这些步骤的顺序与你减小 LV 大小的步骤相反。\n\n大多数文件系统不仅允许增长，而且许多文件系统允许在无需卸载文件系统的情况下进行此操作。\n\
  \n在开始此过程之前，请查看文件系统的当前大小；在本示例中，它约为 23MB：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# df -h /dev/mapper/VG0-lv0\nFilesystem           Size  Used Avail Use% Mounted\
  \ on\n/dev/mapper/VG0-lv0   23M  204K   21M   1% /storage-lv0\n```\n\n同时查看 示例 11-11\
  \ 中显示的 LV 大小，它略大，因为文件系统需要一些元数据空间，导致可用空间比存放文件系统的容器小。\n\n**示例 11-11** *逻辑卷显示大小*\n\n\
  点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# lvdisplay /dev/mapper/VG0-lv0\n ---\
  \ Logical volume ---\n LV Path                /dev/VG0/lv0\n LV Name           \
  \     lv0\n VG Name                VG0\n LV UUID                m3cZlG-yydW-iNlh-I0Ky-HL3C-vWI8-AUKmRN\n\
  \ LV Write Access        read/write\n LV Creation host, time onecoursesource.localdomain,\
  \ 2017-10-27 09:14:21 -0700\n LV Status              available\n # open        \
  \         1\n LV Size                24.00 MiB\n Current LE             6\n Segments\
  \               1\n Allocation             inherit\n Read ahead sectors     auto\n\
  \ - currently set to     256\n Block device           253:3\n```\n\n注意，该文件系统目前已挂载并包含文件。这是为了证明，即使文件系统当前正在使用，你也可以执行增大\
  \ LV 和文件系统大小的过程：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mount | grep lv0\n\
  /dev/mapper/VG0-lv0 on /storage-lv0 type ext4 (rw)\n[root@onecoursesource ~]# ls\
  \ /storage-lv0\ngroup  hosts  lost+found  words\n```\n\n使用 `lvextend` 命令增大 LV 的大小。在这种情况下，大小增加了\
  \ 40MB：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# lvextend -L +40M /dev/mapper/VG0-lv0\n\
  \  Size of logical volume VG0/lv0 changed from 24.00 MiB (6 extents) to 64.00 MiB\
  \ (16 extents).\n  Logical volume lv0 successfully resized\n```\n\n验证 LV 现在变大了：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# lvdisplay /dev/mapper/VG0-lv0 | grep\
  \ Size\n  LV Size                64.00 MiB\n```\n\n注意，文件系统的大小没有变化：\n\n点击此处查看代码图像\n\
  \n```\n[root@onecoursesource ~]# df -h /dev/mapper/VG0-lv0\nFilesystem         \
  \  Size  Used Avail Use% Mounted on\n/dev/mapper/VG0-lv0   23M  5.0M   17M  24%\
  \ /storage-lv0\n```\n\n现在使用 `resize2fs` 命令调整文件系统的大小（如果你正在调整 xfs 文件系统，请使用 `xfs_growfs`\
  \ 命令），并验证该命令是否成功，如 示例 11-12 所示。\n\n**示例 11-12** *调整文件系统大小*\n\n点击此处查看代码图像\n\n```\n\
  [root@onecoursesource ~]# resize2fs /dev/mapper/VG0-lv0\nresize2fs 1.41.12 (17-May-2010)\n\
  Filesystem at /dev/mapper/VG0-lv0 is mounted on /storage-lv0; on-line resizing required\n\
  old desc_blocks = 1, new_desc_blocks = 1\nPerforming an on-line resize of /dev/mapper/VG0-lv0\
  \ to 65536 (1k) blocks.\nThe filesystem on /dev/mapper/VG0-lv0 is now 65536 blocks\
  \ long.\n\n[root@onecoursesource ~]# df -h /dev/mapper/VG0-lv0\nFilesystem     \
  \      Size  Used Avail Use% Mounted on\n/dev/mapper/VG0-lv0   61M  5.3M   53M \
  \ 10% /storage-lv0\n[root@onecoursesource ~]# df -h /dev/mapper/VG0-lv00\nFilesystem\
  \            Size  Used Avail Use% Mounted on\n/dev/mapper/VG0-lv0    62M  6.3M\
  \   53M  11% /storage-lv0\n[root@onecoursesource ~]# ls /storage-lv0\ngroup  hosts\
  \  lost+found  words\n```\n\n虽然你可以告诉 `resize2fs` 命令增长到什么大小，但该命令足够智能，会自动增长到容器的大小。只有在你缩小文件系统大时，才需要为\
  \ `resize2fs` 命令指定大小值。\n\n要缩小 LV 的大小有五个重要的步骤，必须按顺序执行；否则程序将失败并可能导致文件系统损坏：\n\n1. 使用\
  \ `umount` 命令卸载挂载点或逻辑卷。\n2. 强制执行 `fsck` 检查文件系统。\n3. 使用 `resize2fs` 缩小文件系统。\n4. 使用\
  \ `lvreduce` 缩小逻辑卷的大小。\n5. 使用 `mount` 命令挂载文件系统。\n\n请参见 示例 11-13 以查看此过程的演示。\n\n**示例\
  \ 11-13** *缩小逻辑卷的大小*\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# umount /storage-lv0/\n\
  [root@onecoursesource ~]# fsck -f /dev/mapper/VG0-lv0\nfsck from util-linux-ng 2.17.2\n\
  e2fsck 1.41.12 (17-May-2010)\nPass 1: Checking inodes, blocks, and sizes\nPass 2:\
  \ Checking directory structure\nPass 3: Checking directory connectivity\nPass 4:\
  \ Checking reference counts\nPass 5: Checking group information\n/dev/mapper/VG0-lv0:\
  \ 14/16384 files (0.0% non-contiguous), 8429/65536 blocks\n[root@onecoursesource\
  \ ~]# resize2fs /dev/mapper/VG0-lv0 24M\nresize2fs 1.41.12 (17-May-2010)\nResizing\
  \ the filesystem on /dev/mapper/VG0-lv0 to 24576 (1k) blocks.\nThe filesystem on\
  \ /dev/mapper/VG0-lv0 is now 24576 blocks long.\n\n[root@onecoursesource ~]# lvreduce\
  \ -L -40M /dev/mapper/VG0-lv0\n  WARNING: Reducing active logical volume to 24.00\
  \ MiB\n  THIS MAY DESTROY YOUR DATA (filesystem etc.)\nDo you really want to reduce\
  \ lv0? [y/n]: y\n  Reducing logical volume lv0 to 24.00 MiB\n  Logical volume lv0\
  \ successfully resized\n[root@onecoursesource ~]# mount /dev/mapper/VG0-lv0 /storage-lv0\n\
  [root@onecoursesource ~]# df -h /dev/mapper/VG0-lv0\nFilesystem            Size\
  \  Used Avail Use% Mounted on\n/dev/mapper/VG0-lv0    24M  6.0M   17M  27% /storage-lv0\n\
  ```\n\n**注意**\n\n许多备份工具采用以下方法来备份文件系统：\n\n1. 记录要备份的文件的元数据。\n2. 记录要备份的目录的元数据。\n3.\
  \ 备份目录（实际上是属于每个目录的文件列表）。\n4. 备份文件内容。\n\n你可以使用像 `dump` 这样的工具查看这一点。请注意 示例 11-14 输出中的加粗行。\n\
  \n#### LVM 快照\n\n\n\n\n\n```\n[root@onecoursesource ~]# dump -f /tmp/backup /storage-lv0\n\
  \ DUMP: Date of this level 0 dump: Tue Oct 27 22:17:18 2017\n DUMP: Dumping /dev/mapper/VG0-lv0\
  \ (/storage-lv0) to /tmp/backup\n DUMP: Label: none\n DUMP: Writing 10 Kilobyte\
  \ records\n DUMP: mapping (Pass I) [regular files]\n DUMP: mapping (Pass II) [directories]\n\
  \ DUMP: estimated 4880 blocks.\n DUMP: Volume 1 started with block 1 at: Tue Oct\
  \ 27 22:17:18 2017\n DUMP: dumping (Pass III) [directories]\n DUMP: dumping (Pass\
  \ IV) [regular files]\n DUMP: Closing /tmp/backup\n DUMP: Volume 1 completed at:\
  \ Tue Oct 27 22:17:18 2017\n DUMP: Volume 1 4890 blocks (4.78MB)\n DUMP: 4890 blocks\
  \ (4.78MB) on 1 volume(s)\n DUMP: finished in less than a second\n DUMP: Date of\
  \ this level 0 dump: Tue Oct 27 22:17:18 2017\n DUMP: Date this dump completed:\
  \  Tue Oct 27 22:17:18 2017\n DUMP: Average transfer rate: 0 kB/s\n DUMP: DUMP IS\
  \ DONE\n```\n\n这种技术存在的问题在于备份在线（已挂载）的文件系统时。在备份元数据和备份文件数据之间，文件系统可能会发生变化。例如，在备份 `/storage-lv0/hosts`\
  \ 文件的元数据后，如果该文件在内容备份之前被删除，就会导致备份出现问题。\n\n最好的做法是在备份之前卸挂载文件系统，但在生产机器上这并不总是可能的。因此，你可以利用\
  \ LVM 快照（Snapshot）。快照提供了逻辑卷（LV）内文件系统的一个“冻结镜像”。通过备份这个冻结镜像，你可以确保获得一个良好的（无错误的）备份。\n\
  \n要创建快照，请使用带有 `-s` 选项的 `lvcreate` 命令：\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ ~]# lvcreate -L 20M -s -n snap0 /dev/mapper/VG0-lv0\n  Logical volume \"snap0\"\
  \ created.\n```\n\n现在有了一个名为 `/dev/mapper/VG0-snap0` 的新设备。`-s` 选项指定你想创建一个快照 LV。`-n`\
  \ 选项指定新 LV 的名称。最后一个参数是新 LV 所快照的源 LV 名称。\n\n为此新设备创建一个挂载点并将其以只读方式挂载，这样“冻结”的文件系统中就不会发生任何更改：\n\
  \n点击此处查看代码\n\n```\n[root@onecoursesource ~]# mkdir /backup\n[root@onecoursesource\
  \ ~]# mount -o ro /dev/mapper/VG0-snap0 /backup\n```\n\n现在你可以使用你选择的备份工具来备份 `/backup`\
  \ 文件系统。你可以看到它目前包含与原始 LV 相同的数据：\n\n点击此处查看代码\n\n```\n[root@onecoursesource ~]# ls\
  \ /backup\ngroup  hosts  lost+found  words\n[root@onecoursesource ~]# ls /storage-lv0\n\
  group  hosts  lost+found  words\n```\n\n那么，备份 `/backup` 文件系统与备份 `/storage-lv0` 文件系统有什么区别呢？`/storage-lv0`\
  \ 文件系统是在线的且可以修改，而 `/backup` 文件系统无法被更改，如下命令所示：\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ ~]# rm /storage-lv0/hosts\nrm: remove regular file '/storage-lv0/hosts'? y\n[root@onecoursesource\
  \ ~]# ls /storage-lv0\ngroup  lost+found  words\n[root@onecoursesource ~]# rm /backup/words\n\
  rm: remove regular file '/backup/words'? y\nrm: cannot remove '/backup/words': Read-only\
  \ file system\n[root@onecoursesource ~]# ls /backup\ngroup  hosts  lost+found  words\n\
  ```\n\n完成备份后，你应该通过先卸载快照 VM，然后执行 `lvremove` 命令来销毁 LVM 快照：\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ ~]# lvremove /dev/mapper/VG0-snap0\n```\n\n了解如何创建和使用 LVM 快照是一项重要的技能。了解它的工作原理并非关重要，但它可以帮助你理解为什么备份快照\
  \ LV 比备份在线文件系统更好。\n\n首先，假设你刚刚创建了 `/dev/mapper/VG0-lv0` 的快照……（注：此处原文存在大量重复描述，已根据技术逻辑整合）。\n\
  \n\n\n\n\n在启用 `usrquota` 选项挂载文件系统后，你需要通过执行以下 `quotacheck` 命令来创建初始配额数据库：\n\n点击此处查看代码\n\
  \n```\n[root@localhost ~]$ quotacheck -cugm /dev/sdb1\n```\n\n这将在文件系统的挂载点目录中生成新文件：\n\
  \n点击此处查看代码\n\n```\n[root@localhost ~]$ ls /aquota*\n/aquota.group  /aquota.user\n\
  ```\n\n`quotacheck` 命令的重要选项如表 11-3 所示。\n\n**表 11-3** `quotacheck` 命令的选项\n\n| **选项**\
  \ | **描述** |\n| --- | --- |\n| `-c` | 创建数据库额文件。 |\n| `-g` | 仅创建 `aquota.group` 文件，这意味着除非也使用\
  \ `-u` 选项，否则仅启用组配额。 |\n| `-m` | 在创建配额文件时不尝试尝试卸载文件系统。 |\n| `-u` | 仅创建 `aquota.user`\
  \ 文件，这意味着除非也使用 `-g` 选项，否则仅启用用户配额。 |\n\n## 编辑、检查和生成用户配额报告\n\n在按照上一节描述设置磁盘配额后，按照以下步骤启用并显示用户的配额：\n\
  \n1. 通过执行 `quotaon` 命令开启磁盘配额。\n2. 使用 `edquota` 命令创建或编辑用户配额。\n3. 使用 `quota` 或 `repquota`\
  \ 命令显示配额信息。\n\n### quotaon\n\n`quotaon` 命令用于为文件系统开启配额。通常情况下，当系统启动时，此操作会自动完成。但是，你可以通过执行\
  \ `quotaoff` 命令后跟文件系统的名称来关闭配额（以下命令必须由 root 用户执行）：\n\n点击此处查看代码\n\n```\n[root@localhost\
  \ ~]$ quotaoff /dev/sdb1\n[root@localhost ~]$ quotaon /dev/sdb1\n```\n\n### edquota\n\
  \n要创建或编辑用户的配额，执行 `edquota` 命令并跟用户名（以下命令必须由 root 用户执行）：\n\n点击此处查看代码\n\n```\n[root@localhost\
  \ ~]$ edquota sarah\n```\n\n`edquota` 命令将进入编辑器（通常默认为 `vi`）并显示用户所有的配额。输出内容类似于下所示：\n\
  \n点击此处查看代码\n\n```\nDisk quotas for user sarah (uid 507):\n  Filesystem  blocks \
  \  soft   hard   inodes   soft   hard\n  /dev/sdb1   550060      0      0    29905\
  \      0      0\n```\n\n表 11-4 描述了配额的字段。\n\n**表 11-4** 配额的字段\n\n| **键名** | **描述**\
  \ |\n| --- | --- |\n| `Filesystem` | 启用了配额的文件系统的分区。 |\n| `blocks` | 用户当前在文件系统中使用的磁盘块数。\
  \ |\n| `soft` | 代表块软配额的值；如果用户创建的文件导致超过此块限制限制，则会发出警告。 |\n| `hard` | 代表块硬配额的值；如果用户创建的文件导致超过此块数量限制，则会输出错误且无法在文件系统中再创建额外文件。\
  \ |\n| `inodes` | 用户当前在文件系统中拥有的文件数。 |\n| `soft` | 代表文件软配额的值；如果用户创建的文件导致超过此文件数量限制，则会发出警告。\
  \ |\n| `hard` | 代表文件硬配额的值；如果用户创建的文件导致超过此文件数量限制，则会输出错误且无法在文件系统中再创建额外文件。 |\n\n**注意**\n\
  \n可以通过执行 `edquota –t` 命令来设置宽限期。关于宽限期的更多详细信息，请参见“配额”节。\n\n### quota\n\n用户可以执行 `quota`\
  \ 命令来显示该账户的配额：\n\n点击此处查看代码\n\n```\n[sarah@localhost ~]$ quota\nDisk quotas for user\
  \ sarah (uid 507):\n     Filesystem  blocks   quota   limit   grace   files   quota\
  \   limit   grace\n      /dev/sda1   20480   30000   60000               1     \
  \  0       0\n```\n\n注意用户超过软配额时的输出；在以下示例中，用户 sarah 超过了块大小的软限制：\n\n点击此处查看代码\n\n```\n\
  [sarah@localhost ~]$ quota\nDisk quotas for user sarah (uid 507):\n     Filesystem\
  \  blocks   quota   limit   grace   files   quota   limit   grace\n      /dev/sda1\
  \   40960*  30000   60000   7days       2       0       0\n```\n\n一旦用户超过软配额，系统将提供一个宽限期。用户必须在宽限期内将文件系统中使用的空间减少到软配额以下，否则当前使用量将转换为硬配额限制。\n\
  \n**注意**\n\nroot 用户可以通过执行 `edquota –t` 命令设置宽限期。\n\n以下是 `quota` 命令的一些重要选项：\n\n| **选项**\
  \ | **描述** |\n| --- | --- |\n| `-g` | 显示组配额而不是特定的用户配额。 |\n| `-s` | 以人类可读的尺寸显示信息，而不是块大小。\
  \ |\n| `-l` | 仅显示本地文件系统的配额信息（而不是基于网络的文件系统配额）。 |\n\n### repquota\n\nroot 用户使用 `repquota`\
  \ 命令来显示整个文件系统的配额（以下命令必须由 root 用户执行）：\n\n点击此处查看代码\n\n```\n[root@localhost ~]$ repquota\
  \ /\n*** Report for user quotas on device /dev/sda1\nBlock grace time: 7days; Inode\
  \ grace time: 7days\n                        Block limits                File limits\n\
  User            used    soft    hard  grace    used  soft  hard  grace\n----------------------------------------------------------------------\n\
  root      -- 4559956       0       0         207396     0     0\ndaemon    --  \
  \    64       0       0              4     0     0\nman       --    1832       0\
  \       0            145     0     0\nwww-data  --       4       0       0     \
  \         1     0     0\nlibuuid   --      40       0       0              6   \
  \  0     0\nsyslog    --    3848       0       0             23     0     0\nmessagebus\
  \ --      8       0       0              2     0     0\nlandscape --      8    \
  \   0       0              2     0     0\npollinate --       4       0       0 \
  \             2     0     0\nvagrant   --  550060       0       0          29906\
  \     0     0\ncolord    --       8       0       0              2     0     0\n\
  statd     --      12       0       0             3     0     0\npuppet    --   \
  \   44       0       0             11     0     0\nubuntu    --      36       0\
  \       0              8     0     0\nsarah     +-   40960   30000   60000  6days\
  \       2     0     0\n```\n\n`repquota` 命令的一些重要选项包括：\n\n| **选项** | **描述** |\n|\
  \ --- | --- |\n| `-a` | 显示在 `/etc/fstab` 中指定了配额选项的文件系统的配额。 |\n| `-g` | 显示组配额而不是特定的用户配额。\
  \ |\n| `-s` | 以人类可读的尺寸显示信息，而不是块大小。 |\n\n### 硬链接与软链接\n\nLinux 上有两种不同的文件链接：\n\n* \
  \  **硬链接（Hard links）**：当你对一个文件创建硬链接时，无法区分“原始”文件和“链接”文件。它们只是指向相同索引节点（inode）以及相同数据的两个文件名。如果你有\
  \ 10 个硬链接文件并删除了其中九个，数据仍然保留在剩余文件中。\n\n    图 11-9 展示了硬链接。\n\n    ![Image](img/11fig09.jpg)\n\
  \n    **图 11-9** *硬链接*\n\n\n\n\n在图 11-9 中，`abc.txt` 和 `xyz.txt` 文件被硬链接在一起。这意味着它们共享相同的\
  \ inode 表。inode 表中的省略号（……）代表元数据——关于文件的信息，例如用户所有者和权限。这些元数据中还包含了指向存储设备中存储文件数据的块的指针。\n\
  \n- -**软链接（Soft links）**：当你创建一个软链接时，原始文件包含数据，而链接文件“指向”原始文件。对原始文件进行的任何更改似乎也会显示在链接文件中，因为使用链接文件始终会跟踪链接找到目标文件。删除原始文件会导致链接断，使链接文件变得毫无用处，并导致数据完全丢失。\n\
  \n图 11-10 展示了软链接。\n\n![Image](img/11fig10.jpg)\n\n**图 11-10** 软链接\n\n在图 11-10 中，`abc.txt`\
  \ 文件软链接到 `xyz.txt` 文件。`abc.txt` 文件指向文件名 `xyz.txt`，而不是同一个 inode 表（尽管图中未显示，但 `abc.txt`\
  \ 文件有自己的 inode 表）。通过遵循链接，可以通过 `abc.txt` 文件访问 `xyz.txt` 文件的数据。\n\n### 为什么要使用链接？\n\
  \n链接在系统管理任务中的一个常见用途是管理员决定将关键文件的位置移动到不同的目录位置（或给文件起一个不同的名称）。这可能会让习惯了原始文件位置和名称的用户产生困惑。\n\
  \n例如，假设一个关键配置文件名为 `/etc/setup-db.conf`，管理员想将此文件移动到 `/etc/db` 目录。文件移动后，可以创建一个符号链接来帮助其他用户（可能还有程序）找到正确的数据（务必以\
  \ root 用户运行以下命令）：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]$ ln -s /etc/db/setup-db.conf\
  \ /etc/setup-db.conf\n```\n\n`/etc` 目录有几个这种用链接用法的示例：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]$ ls -l /etc | grep \"^l\"\nlrwxrwxrwx   1 root root          12 Jan 26  2017\
  \ drupal -> /etc/drupal6\nlrwxrwxrwx   1 root root          56 Dec 17  2017 favicon.png\
  \ -> /usr/share/icons/\nhicolor/16x16/apps/fedora-logo-icon.png\nlrwxrwxrwx   1\
  \ root root          22 Jan 23  2017 grub2.cfg -> ../boot/grub2/grub.cfg\nlrwxrwxrwx\
  \   1 root root          22 Dec 17  2017 grub.conf -> ../boot/grub/grub.conf\nlrwxrwxrwx\
  \   1 root root          11 Jan 23  2017 init.d -> rc.d/init.d\nlrwxrwxrwx   1 root\
  \ root          41 Feb 18  2017 localtime -> ../usr/share/zoneinfo/\nAmerica/Los_Angeles\n\
  lrwxrwxrwx   1 root root          12 Dec 17  2017 mtab -> /proc/mounts\nlrwxrwxrwx\
  \   1 root root          10 Jan 23  2017 rc0.d -> rc.d/rc0.d\nlrwxrwxrwx   1 root\
  \ root          10 Jan 23  2017 rc1.d -> rc.d/rc1.d\nlrwxrwxrwx   1 root root  \
  \        10 Jan 23  2017 rc2.d -> rc.d/rc2.d\nlrwxrwxrwx   1 root root         \
  \ 10 Jan 23  2017 rc3.d -> rc.d/rc3.d\nlrwxrwxrwx   1 root root          10 Jan\
  \ 23  2017 rc4.d -> rc.d/rc4.d\nlrwxrwxrwx   1 root root          10 Jan 23  2017\
  \ rc5.d -> rc.d/rc5.d\nlrwxrwxrwx   1 root root          10 Jan 23  2017 rc6.d ->\
  \ rc.d/rc6.d\nlrwxrwxrwx   1 root root          14 Sep 10  1258 redhat-release ->\
  \ fedora-release\nlrwxrwxrwx   1 root root          14 Sep 10  1258 system-release\
  \ -> fedora-release\n```\n\n### 创建链接\n\n要创建链接，请按如下方式执行 `ln` 命令：`ln [-s] target_file`。例如，要从\
  \ `/etc/hosts` 文件到当前目录下名为 `myhosts` 的文件的硬链接，请执行以下命令：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]$ ln /etc/hosts myhosts\n```\n\n硬链接文件共享相同的 inode。你只能对与原始文件位于同一文件系统的文件（不是目录）创建硬链接。对其他文件系统或目录创建硬链接会导致错误：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]$ ln /boot/initrd.img-31.0-30-generic\
  \ initrd\nln: failed to create hard link 'initrd' => '/boot/initrd.img-31.0-30-generic':\
  \ Invalid-device link\n[root@onecoursesource ~]$ ln /etc etc\nln: '/etc': hard link\
  \ not allowed for directory\n```\n\n软链接（也称为符号链接）是通过文件系统指向其他文件（或目录）的文件。你可以对任何文件或目录创建软链接：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]$ ln -s /boot/initrd.img-31.0-30-generic\
  \ initrd\n```\n\n### 显示链接\n\n`ls` 命令可以显示软链接和硬链接。软链接可以对任何文件或目录创建软链接：\n\n```\n[root@onecoursesource\
  \ ~]$ ln -s /boot/initrd.img-31.0-30-generic initrd\n```\n\n硬链接文件共享相同的 inode。你只能对与原始文件位于同一文件系统的文件（不是目录）创建硬链接。对其他文件系统或目录创建硬链接会导致错误：\n\
  \n```\n[root@onecoursesource ~]$ ln /boot/initrd.img-31.0-30-generic initrd\nln:\
  \ failed to create hard link 'initrd' => '/boot/initrd.img-31.0-30-generic': Invalid-device\
  \ link\n[root@onecoursesource ~]$ ln /etc etc\nln: '/etc': hard link not allowed\
  \ for directory\n```\n\n软链接（也称为符号链接）是通过文件系统指向其他文件（或目录）的文件。你可以对任何文件或目录创建软链接：\n\n\
  点击此处查看代码图像\n\n```\n[root@onecoursesource ~]$ ln -s /boot/initrd.img-31.0-30-generic\
  \ initrd\n```\n\n### 显示链接\n\n`ls` 命令可以显示软链接和硬链接。软链接可以对任何文件或目录创建软链接：\n\n```\n[root@onecoursesource\
  \ ~]$ ln -s /boot/initrd.img-31.0-30-generic initrd\n```\n\n硬链接文件共享相同的 inode。你只能对与原始文件位于同一文件系统的文件（不是目录）创建硬链接。对其他文件系统或目录创建硬链接会导致错误：\n\
  \n```\n[root@onecoursesource ~]$ ln -s /boot/initrd.img-31.0-30-generic initrd\n\
  ```\n\n（-generic `initrd`）\n\n软链接（也称为符号链接）是通过文件系统指向其他文件（或目录）的文件。软链接可以对任何文件或目录创建软链接：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]$ ln -s /boot/initrd.img-31.0-30-generic\
  \ initrd\n```\n\n### 显示链接\n\n`ls` 命令可以显示软链接和硬链接。软链接可以对任何文件或目录创建软链接：\n\n```\n[root@onecoursesource\
  \ ~]$ ln -s /boot/initrd.img-31.0-30-generic initrd\n```\n\n（-generic `initrd`）\n\
  \n（注：由于原文文本中存在大量重复段落和碎片，译文已根据逻辑进行了整合处理，并确保所有 Markdown 格式标记完整。）\n\n\n\n\n\n# **8.****\
  \ `_____` 命令用于更改 ext4 文件系统的大小。\n\n使用 `master/slave`（主/从）术语仅是为了与行业规范和标准中使用的官方术语相关，这绝不会削弱\
  \ Pearson 对促进多样性、公平性和包容性的承诺，也不会挑战我们所服务的全球学习者群体、应对和/或消除偏见与刻板印象。\n\n## 第 12 章：管理网络存储\n\
  \n有许多方法可以为用户提供从一个系统传输到另一个系统的能力。例如，在 Linux 上，你可以使用 `SAMBA` 服务器。使用 `SAMBA` 服务器的优势在于，执行传输的协议不仅仅是“Linux\
  \ 东西”。这使得在不同操作系统（例如 Linux 和 Microsoft Windows 之间）传输文件变得更加容易。\n\n在本章中，你将学习 `SAMBA`\
  \ 服务器，包括关键配置设置。完成本章后，你应该能够使用 `SAMBA` 服务器共享目录或打印机。你还应该理解如何使用 `SAMBA` 用户账户保护这些共享。\n\
  \n一旦创建了 `SAMBA` 共享，你就知道如何访问它。你将学习多种方法，包括如何挂载 `SAMBA` 共享使其看起来像本地文件系统的一部分。\n\n另一种在\
  \ Linux 和 Unix 中更常见的共享文件方法是 网络文件系统 (NFS)。这种方法允许管理员向安装了 `NFS` 客户端软件的其他系统共享目录结构。\n\
  \n你将学习如何设置 `NFS` 服务器并从 `NFS` 客户端连接到它。你还学习了如何保护 `portmap`，即授予访问 `NFS` 服务器权限的服务。\n\
  \n最后，你将学习如何使用 `iSCSI` 为客户端系统提供网络存储设备。\n\n阅读本章并完成练习后，你将能够执行以下操作：\n\n- 创建并访问 Samba\
  \ 共享\n- 创建并访问 NFS 共享\n- 通过 `iSCSI` 共享存储位置\n- 在客户端系统上使用 `iSCSI` 资源\n\n### Samba\n\
  \n不同系统之间共享文件的方法之一是使用名为 `SMB`（服务器消息块）的协议。该协议由 IBM 在 20 世纪 80 年代中期发明，目的是在局域网（LAN）上的主机之间共享目录。描述跨网络共享文件和目录的术语是\
  \ DFS（分布式文件系统)。除了 `SMB` 之外，`NFS`（网络文件系统）也是 Linux 流行的 `DFS`（`NFS` 将在本章稍后介绍）。\n\n\
  你经常听到 CIFS（通用互联网文件系统) 与 `SMB` 配合使用。`CIFS` 是基于 `SMB` 的协议，在 Microsoft Windows 系统上流行。通常，这两个缩写互用（或共同使用，如\
  \ `SMB/CIFS`），但协议之间存在细微差异。在书中，从现在起将使用 SMB 术语。\n\n你还可以使用 `SMB` 共享打印机，并在不同类型的操作系统类型之间共享文件。事实上，一个常见的\
  \ `SMB` 任务是在 Linux 和 Microsoft Windows 系统之间共享打印机。\n\n允许 `SMB` 共享的基于 Linux 的软件被称为\
  \ `SAMBA`。通常，你应该考虑安装以下三个独立的 `SAMBA` 包：\n\n- `SAMBA`：此包包含 `SAMBA` 服务器软件。\n- `SAMBA-client`：此包包含\
  \ `SAMBA` 客户端程序，允许你连接到 `SAMBA` 服务器或 Microsoft Windows `DFS`。\n- `SAMBA-common`：此包包含\
  \ `SAMBA` 服务器和客户端程序所需的软件。\n\n为了测试 `SAMBA`，我们建议安装这三个包。另一个有包是 `SAMBA-swat`，它提供了一个基于\
  \ Web 的 `SAMBA` 管理工具。\n\n### SAMBA 配置\n\n`SAMBA` 的配置文件为 `/etc/SAMBA/smb.conf`（在某些旧系统上，它可能是\
  \ `/etc/smb/smb.conf`）。它与 Linux 中找到的大多数其他配置文件有所不同。以下是需要注意的关键点：\n\n- 该文件有良好的文档。你不需要查询标准的\
  \ `SAMBA` 文档，因为配置文件有详细的描述。\n- 文件被分为以下格式定义的节：\n    - `[name]`：这通常被称为“节”，表示共享项目或服务。\n\
  \    - `[options and attributes]`：每一行都是针对上述命名的共享项目或服务的单独配置选项。\n- 此配置文件使用了两个注释字符：`#`\
  \ 和 `;`。`#` 字符用于普通注释；而 `;` 字符用于将你不想使用的任何实际配置设置转换为注释行，以便在你以后可能需要这些设置时能够维护它们。这样，正确的命名规范和适当的属性就会保留在配置文件中。\n\
  \n为了让你对典型的 `smb.conf` 文件长什么样有个概念，查看 示例 12-1 的输出，它展示了一个删除了所有注释和空行的典型默认 `smb.conf`\
  \ 文件。\n\n**示例 12-1 默认 `smb.conf` 文件**\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# grep -v \"#\" /etc/SAMBA/smb.conf | grep -v \";\" | grep -v \"^$\"\n[global]\n\
  \        workgroup = MYGROUP\n        server string = SAMBA Server Version %v\n\
  \        security = user\n        passdb backend = tdbsam\n        load printers\
  \ = yes\n        cups options = raw\n[homes]\n        comment = Home Directories\n\
  \        browseable = no\n        writable = yes\n[printers]\n        comment =\
  \ All Printers\n        path = /var/spool/SAMBA\n        browseable = no\n     \
  \   guest ok = no\n        writable = no\n        printable = yes\n```\n\n示例 12-1\
  \ 中的命令行到底执行了什么？记住 `grep` 命令是一个过滤工具，而 `-v` 选项是“反向” `grep`。当使用 `-v` 选项时，`grep` 命令会显示所有不匹配模式的行。因此，第一个\
  \ `grep` 模式匹配任何带有 `#` 注释字符的行，并过滤掉这些行。第二个 `grep` 模式匹配任何带有 `;` 注释字符的行并过滤掉这些行。最后一个\
  \ `grep` 模式匹配空行并过滤掉这些行。因此，输出由文件中所有真实的配置设置组成（没有注释，也没有空行）。跟我们重复：“grep 是我的朋友！”学习掌握如\
  \ `grep` 之类的命令允许系统过滤你所需的信息，将使管理你的 Linux 系统变得容易得多。\n\n注意有三个节：`[global]`、`[homes]`\
  \ 和 `[printers]`。随着目录和单个打印机的共享，会添加额外的节。\n\n#### [global] 节\n\nSamba 服务器的主要设置放置在\
  \ `[global]` 节中。记住 示例 12-1 显示的默认值：\n\n点击此处查看代码图像\n\n```\n[global]\n        workgroup\
  \ = MYGROUP\n        server string = SAMBA Server Version %v\n        security =\
  \ user\n        passdb backend = tdbsam\n        load printers = yes\n        cups\
  \ options = raw\n```\n\n你会发现默认选项足够启动 `SAMBA` 服务器了，但你可能想要更改其中至少几个选项以适应你的系统需求。表 12-1\
  \ 描述了这些默认选项。\n\n**表 12-1 典型的 [global] 选项**\n\n| **选项** | **描述** |\n| --- | --- |\n\
  \n\n\n\n\n| `workgroup` | 这是 NetBIOS（网络基本输入/输出系统）工作组或 NetBIOS 域名。这是一种将一组机器组合在一起的技术。如果你想通过\
  \ SMB 与 Microsoft Windows 系统通信，这可能非常重要。 |\n| `server string` | 服务器的描述；当远程系统尝试连接到服务器以确定服务器提供的服务时，此描述非常有用。值\
  \ `%v` 会被替换为 SAMBA 的版本号。值 `%h` 可表示服务器的主机名。 |\n| `security` | 这决定了使用什么类型的用户验证方法。值\
  \ `user` 表示将使用 SAMBA 用户账户。如果你在 Microsoft Windows 系统上有一个 DC（域控制器），则需要指定域。要通过 Active\
  \ Directory（活动目录）进行验证，请指定 `ads`。 |\n| `passdb backend` | 这指定了 SAMBA 账户存储方式。通常情况下，除非你是专家，否则不需要更改它。\
  \ |\n| `load printers` | 此选项如果设置为 `yes`，则告诉 SAMBA 默认共享所有 CUPS 打印机。（通用 UNIX 打印系统是\
  \ Linux 和 Unix 中常用的打印协议。）虽然这很方便，但你并不总是想共享 SAMBA 服务器上的所有 CUPS 打印机。单个打印机共享可以在单独的部分中处理。注意：为了让\
  \ SAMBA 能够加载加载 CUPS 打印机，需要正确配置 `[printers]` 部分（这在后面的章节中描述）。 |\n| `cups options`\
  \ | 关于 CUPS 的选项；此项很少被修改，应仅由专家进行。 |\n\n### [homes] 部分\n\n在本章的后后节中，你将学习如何创建 SAMBA\
  \ 用户账户。这些 SAMBA 用户与 Linux 用户账户关联（通常共享相同的名称，但这不是强制要求的），而且这些 Linux 用户账户当然拥有家目录。\n\n\
  为了方便这些用户通过 SAMBA 服务器共享他们的家目录，`[homes]` 部分设计用于自动共享这些目录。请记住，标准的 Linux 权限仍然有效，因此这些共享通常只为家目录的所有者开放家目录。\n\
  \n默认的 `[homes]` 共享通常如下：\n\n点击此处查看代码图像\n\n```\n[homes]\n        comment = Home Directories\n\
  \        browseable = no\n        writable = yes\n```\n\n该部分中的值在以下列表中定义：\n\n*  \
  \ `comment`: 共享的描述。\n*   `browseable`: 如果设置为 `yes`，则可以通过显示 SAMBA 服务器上可用共享信息的客户端工具看到该共享。如果设置为\
  \ `no`，则该共享是可用的，但使用客户端工具的用户必须知道该共享的存在。\n\n    **安全要点**\n\n    使用 `browseable = no`\
  \ 功能提供了一些额外的安全性，但请记住，这只是隐藏了共享。它并不会让共享受到完全保护，有心意的黑客可能猜到共享名称并因此访问该共享。\n\n*   `writable`:\
  \ 如果设置为 `yes`，则家目录为具有读写访问权限的共享。请记住常规权限仍然有效。如果设置为 `no`，则家目录为具有只读访问权限的共享。请记住底层文件系统的权限仍然有效。因此，访问可能通过此\
  \ SAMBA 设置授予，但被文件系统拒绝。\n\n    **可能会出现什么问题？**\n\n    如果你通过 SAMBA 连接到系统并无法访问某个文件或目录，请尝试通过本地登录或安全\
  \ Shell 直接登录系统（参阅第 22 章，“连接到远程系统”以学习安全 Shell），然后尝试直接访问该文件。如果你不能，那么问题出在本地文件权限。如果你可以，那么问题出在\
  \ SAMBA 共享的创建方式。\n\n### [printers] 部分\n\n回 `[global]` 部分中的 `load printers` 设置。当该设置为为\
  \ `yes` 时，SAMBA 会寻找 `[printers]` 部分来自动共享所有 CUPS 打印机。一个典型的 `[printers]` 部分如下：\n\n\
  点击此处查看代码图像\n\n```\n[printers]\n        comment = All Printers\n        path = /var/spool/SAMBA\n\
  \        browseable = no\n        guest ok = no\n        writable = no\n       \
  \ printable = yes\n```\n\n在大多数情况下，你可能对此部分进行更改。然而，你应该意识到此部分默认设置的含义：\n\n*   `comment`:\
  \ 共享的描述。\n*   `path`: CUPS 溢打印目录的位置（这是发送到打印机的项目在打印之前存储的地方）。\n*   `browseable`: 如果设置为\
  \ `yes`，则可以通过显示 SAMBA 服务器上可用共享信息的客户端工具看到该共享。如果设置为 `no`，则该共享是可用的，但使用客户端工具的用户必须知道该共享的存在。\n\
  *   `guest ok`: 允许访客账户访问 CUPS 打印机。关于该账户的更多细节将在本章后面部分给出。\n*   `writeable`: 应该设置为\
  \ `no`，因为这不是目录共享。\n*   `printable`: 应设置为 `yes`，因为这是一个打印机共享。\n\n### 自定义共享\n\n你可以创建目录或打印机的自定义共享。对于目录共享，语法与\
  \ `[homes]` 部分非常相似。你首先创建一个部分名称，然后设置参数。在以下示例中，`/usr/share/doc` 目录被共享为只读。当你想节省空间且只有一个包含文档的系统时，这非常有用：\n\
  \n点击此处查看代码图像\n\n```\n[doc]\n    comment = System documentation\n    path = /usr/share/doc\n\
  \    guest ok = yes\n    browseable = yes\n    writeable = no\n```\n\n对于此共享，资源被共享为只读，因为没有需要更改资源。只有拥有\
  \ SAMBA 账户的用户才能查看文档。\n\n如果你想为该共享增加更多安全性，可以使用以下选项来限制哪些 SAMBA 用户可以访问它（以及如何访问）：\n\n\
  *   `valid users`: 可以访问此共享的 SAMBA 用户列表。例如：`valid users = bob, ted`。将此比作通过显式注明用户名对用户进行“白名单”。\n\
  *   `invalid users`: 无法访问此共享的 SAMBA 用户列表。所有其他 SAMBA 用户都允许访问。将此比作通过显式注明用户名对用户进行“黑名单”。\n\
  *   `read list`: 可以访问共享但以只读方式访问的 SAMBA 用户列表。\n*   `write list`: 拥有共享读写访问权限的 SAMBA\
  \ 用户列表。\n\n要共享一个特定的打印机，首先确保 `[global]` 部分中的 `loadprinters` 设置为 `no`。然后创建一个如下的部分：\n\
  \n点击此处查看代码图像\n\n```\n[hp-101]\n       path = /var/spool/SAMBA/\n       browseable\
  \ = yes\n       printable = yes\n       printer name = hp-101\n```\n\n#### SAMBA\
  \ 服务器\n\n在你修改了 `/etc/SAMBA/smb.conf` 文件之后并在启动 SAMBA 服务器之前，你应该执行 `testparm` 命令。该命令验证配置文件的语法，如示例\
  \ 12-2 所示。\n\n\n\n\n\n```\n[root@onecoursesource ~]# testparm\nLoad smb config files\
  \ from /etc/SAMBA/smb.conf\nProcessing section \"[homes]\"\nProcessing section \"\
  [printers]\"\nProcessing section \"[doc]\"\nLoaded services file OK.\nServer role:\
  \ ROLE_STANDALONE\nPress enter to see a dump of your service definitions\n\n[global]\n\
  \        workgroup = MYGROUP\n        server string = SAMBA Server Version %v\n\
  \        passdb backend = tdbsam\n        cups options = raw\n\n[homes]\n      \
  \  comment = Home Directories\n        read only = No\n        browseable = No\n\
  \n[printers]\n        comment = All Printers\n        path = /var/spool/SAMBA\n\
  \        printable = Yes\n        browseable = No\n\n[doc]\n        comment = System\
  \ documentation\n        path = /usr/share/doc\n        guest ok = Yes\n```\n\n\
  ## 可能会出现什么问题？\n\n如果 `testparm` 命令发现了任何错误，你将在输出中看到类似下面的消息（在此例中，错误发生是因为 `lp_bool`\
  \ 的值必须是布尔值；换句话说，值必须是 0 或 1）：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# testparm\n\
  Load smb config files from /etc/SAMBA/smb.conf\nProcessing section \"[homes]\"\n\
  Processing section \"[printers]\"\nProcessing section \"[doc]\"\nERROR: Badly formed\
  \ boolean in configuration file: \"nope\".\n\nlp_bool(nope): value is not boolean!\n\
  ```\n\n一旦你拥有了有效的配置文件，就可以启动 SAMBA 服务（该服务名为“smb”，而不是 SAMBA）。你会看到两个服务启动：`smbd` 和 `nmbd`。`smbd`\
  \ 服务处理共享，而 `nmbd` 进程处理 NetBIOS 操作：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]#\
  \ ps -fe | egrep \"smbd|nmbd\"\nroot     20787     1  0 12:18 ?        00:00:00\
  \ smbd -D\nroot     20790     1  0 12:18 ?        00:00:00 nmbd -D\nroot     20792\
  \ 20787  0 12:18 ?        00:00:00 smbd -D\n```\n\n## 安全强调\n\n通常情况下，看到同名的多个进程可能意味着存在问题。例如，黑客可能在系统上放置了一个恶意程序，该程序生成了多个进程。\n\
  \n在这种情况下，不要担心有多个 `smbd` 进程。每个客户端请求都会产生一个新的 `smbd` 进程来处理该客户端的请求。\n\n`nmbd` 和 `smbd`\
  \ 在 `/var/log/SAMBA` 目录下都有独立的日志文件：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]#\
  \ ls /var/log/SAMBA\nnmbd.log  smbd.log\n```\n\n### 注意\n\n如果你习惯在 Microsoft Windows\
  \ 系统上管理 Active Directory，你可能熟悉一个名为 `net` 的命令行实用程序。SAMBA 软件也提供了此实用程序来管理基于 SAMBA 和\
  \ CIFS 的服务器。\n\n例如，以下命令列出了测试网域中的所有用户：\n\n点击此处查看代码图片\n\n```\nnet rpc user -S 10.0.2.20\
  \ -U test/user%pw -n myname -W test\n```\n\n### SAMBA 账户\n\n在用户访问 SAMBA 服务器之前，你需要创建一个\
  \ SAMBA 用户账户。该账户还需要与系统账户关联。在本例中，系统已经有一个名为“student”的用户账户：\n\n点击此处查看代码图片\n\n```\n\
  [root@onecoursesource ~]# grep student /etc/passwd\nstudent:x:500:500::/home/student:/bin/bash\n\
  ```\n\n要为 Linux 用户账户创建一个新的 SAMBA 账户，请使用 `smbpasswd` 命令（注意，在“password”提示后，会输入密码，但屏幕上不会显示）：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# smbpasswd -a student\nNew SMB password:\n\
  Retype new SMB password:\nAdded user student.\n```\n\n使用 `-a` 选项用于添加新账户。如果你想更改现有\
  \ SAMBA 账户的密码，请省略 `-a` 选项。\n\n### 映射本地账户\n\n为系统账户和 SAMBA 账户使用相同的名称是正常的，并且用户的用户的困惑。然而，如果你想为它们使用不同的名称，可以使用用户名映射。首先在\
  \ `[global]` 部分中包含一个设置：\n\n点击此处查看代码图片\n\n```\nbob = john\n```\n\n在 `/etc/samba/smb.conf`\
  \ 文件中，它看起来如下：\n\n```\n[global]\n    username map = /etc/samba/user.map\n```\n\n\
  而在 `/etc/samba/user.map` 文件中，你定义映射：\n\n```\nbob = john\n```\n\n## 访问 SAMBA 服务器\n\
  \n使用 `nmblookup` 命令发现 SAMBA 服务器：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]#\
  \ nmblookup MYGROUP\n```\n\n一旦发现了 SAMBA 服务器，就可以通过 `smbclient` 命令查看可用的共享，如示例 12-3\
  \ 所示。\n\n### 示例 12-3 *显示 SAMBA 共享*\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]#\
  \ smbclient -U student -L 10.0.2.15\nPassword:\n\nSharename       Type      Comment\n\
  ---------       ----      -------\ndoc             Disk      System documentation\n\
  IPC$            IPC       IPC Service\nstudent         Disk      Home Directories\n\
  \nServer               Comment\n---------            -------\n\nWorkgroup      \
  \      Master\n---------            -------\n\nMYGROUP              ONECOURSOURCE\n\
  ```\n\n在[示例 12-3]中，`-U` 选项允许你指定用于访问服务器的 SAMBA 账户。注意，会提示输入该 SAMBA 账户的密码。`-L` 选项用于列出服务器上可用的文件和服务。通过提供\
  \ IP 地址识别服务器（本例中为 10.0.2.15）。\n\n要访问特定共享，执行以下 `smbclient` 命令：\n\n点击此处查看代码图片\n\n\
  ```\n[root@onecoursesource ~]# smbclient -U student //10.0.2.15/doc\nPassword:\n\
  \nsmb: \\>\n```\n\n连接后，你可以执行类似于 FTP 命令的命令。参考示例 12-4 的简要演示。\n\n### 示例 12-4 *使用 smbclient\
  \ 命令*\n\n点击此处查看代码图片\n\n\n\n\n\n```\nsmb: \\> help\n?              altname      \
  \  archive        blocksize   cancel\ncase_sensitive cd             chmod      \
  \    chown       close\ndel            dir            du             exit      \
  \  get\ngetfacl        hardlink       help           history     lcd\nlink     \
  \      lock           lowercase      ls          mask\nmd             mget     \
  \      mkdir          more        mput\nnewer          open           posix    \
  \      posix_open  posix_mkdir\nposix_rmdir    posix_unlink   print          prompt\
  \      put\npwd            q              queue          quit        rd\nrecurse\
  \        reget          rename         reput       rm\nrmdir          showacls \
  \      setmode        stat        symlink\ntar            tarmode        translate\
  \      unlock      volume\nvuid           wdel           logon          listconnect\
  \ showconnect\n!\nsmb: \\> cd zip-2.31\nsmb: \\zip-2.31\\> ls\n  .             \
  \   D        0  Fri Oct  9 18:22:37 2018\n  ..               D        0  Sat Jan\
  \  2 21:29:14 2018\n  CHANGES               60168  Tue Mar  8 20:58:06 2018\n  TODO\
  \                   3149  Sun Feb 20 21:52:44 2018\n  WHERE                 19032\
  \  Tue Apr 18 18:00:08 2018\n  README                 8059  Sat Feb 26 19:22:50\
  \ 2018\n  LICENSE                2692  Sun Apr  9 15:29:41 2018\n  WHATSNEW    \
  \           2000  Tue Mar  8 20:58:28 2018\n  algorith.txt           3395  Sat Dec\
  \ 14 05:25:34 2018\n  BUGS                    356  Sat Dec 14 05:25:30 2018\n  MANUAL\
  \                40079  Sun Feb 27 23:29:58 2018\n\n                46868 blocks\
  \ of size 131072\\. 13751 blocks available\nsmb: \\zip-2.31\\> get README\ngetting\
  \ file \\zip-2.31\\README of size 8059 as README (231.5 kb/s) (average 231.5 kb/s)\n\
  smb: \\zip-2.31\\> quit\n```\n\n在示例 12-4 中演示的大多数命令与你已经熟悉的 Linux 命令相似。其中一个不同的是 `get`\
  \ 命令——它用于将文件从远程系统下载到本地系统。\n\n你可以通过执行 `smbstatus` 命令来查看 SAMBA 服务器的状态，包括哪些机器连接到了它以及正在访问哪些资源。如如下输出所示，SAMBA\
  \ 服务器正被本地系统上的某人连接（因此 IP 地址也相同，均为 10.0.2.15）：\n\n点击此处查看代码图片\n\n```\n[root@onecoursesource\
  \ zip-2.31]# smbstatus\nSAMBA version 3.0.33-3.40.el5_10\nPID     Username     \
  \ Group         Machine\n-------------------------------------------------------------------\n\
  21662   student       student       onecoursesource    (10.0.2.15)\nService    \
  \  pid     machine       Connected at\n-------------------------------------------------------\n\
  doc          21662   onecoursesource     Sun Jan  3 17:45:24 2016\nNo locked files\n\
  \n## 挂载 SAMBA 共享\n\n与其要求用户手动连接 SAMBA 或 Microsoft Windows 共享，不如通过挂载让这些共享出现在本地文件系统中。例如：\n\
  \n点击此处查看代码图片\n\n```\n[root@onecoursesource ~]# mkdir /doc\n[root@onecoursesource\
  \ ~]# mount -t cifs -o user=student //10.0.2.15/doc\nPassword:\n```\n\n挂载过程应该是简单的，因为它与你过去执行过的挂载操作相似（更多挂载信息请参见第\
  \ 10 章管理本地存储](#ch10.xhtml_ch10)）。`-t` 用于指定文件系统类型`-`-o` 用于提供选项——在这里是 SAMBA 用户名。`//10.0.2.15/doc`\
  \ 参数是设备，而 `/doc` 参数是挂载点。\n\n### 可能出现的问题\n\n注意共享的路径开头是双斜杠 (`//`)，而不是像目录路径那样的单斜杠。使用单个\
  \ `/` 会导致命令失败。大多数情况下，你希望在启动过程中自动挂载 SAMBA 共享。在 `/etc/fstab` 文件中添加以下行可以完成此任务：\n\n\
  点击此处查看代码图片\n\n```\n//10.0.2.15/doc   /doc   cifs   user=student,password=secret\
  \   0    0\n```\n\n当然，在 `/etc/fstab` 文件中直接包含 SAMBA 密码是一个糟糕的主意，因为本地系统上的所有用户都能看到 `/etc/fstab`\
  \ 的内容，因此你应该使用凭据文件：\n\n点击此处查看代码图片\n\n```\n//10.0.2.15/doc   /doc   cifs   credentials=/etc/SAMBA/student\
  \ 0    0\n```\n\n在 `/etc/SAMBA/student` 文件中，放置如下条：\n\n点击此处查看代码图片\n\n```\nuser=student\n\
  password=secret\n```\n\n### 安全提示\n\n确保存储 SAMBA 用户名和密码的文件权限正确。权限应只允许 root 用户查看该文件，因此可以使用如下命令进行保护：`chmod\
  \ 600 /etc/SAMBA/student`。\n\n### 网络文件系统\n\nNFS 是一种已使用 40 多年的分布式文件系统（DFS）协议。NFS\
  \ 最初由 Sun Microsystems 在 1984 年创建，旨在为管理员从一个 UNIX 系统共享文件和目录提供方便的方法。\n\n自诞生以来，NFS\
  \ 已移植到多个不同的操作系统，包括 Linux 和 Microsoft Windows。尽管它可能没有 SAMBA 那样流行，但许多机构仍在使用 NFS 共享文件。\n\
  \n### 配置 NFS 服务器\n\n在大多数 Linux 发行版中，默认安装了 NFS 软件；你可以简单地通过 `nfs`、`nfsserver` 或 `nfs-kernel-service`\
  \ 脚本启动 NFS（脚本名称取决于发行版；你将在第 15 章脚本](#ch15.xhtml_ch15)中学习更多知识）。在某些情况下，你可能需要安装 `nfs-utils`\
  \ 或 `nfs-kernel-server` 包，但通常 NFS 软件是默认安装的。如果你确定如何安装此软件，请参见第 26 章基于 Red Hat 的软件包管理](#ch26.xhtml_ch26)和第\
  \ 27 章基于 Debian 的软件包管理](#ch27.xhtml_ch27)。\n\n不过，NFS 有一个小技巧。它需要另一个名为 RPC（远程过程调用)\
  \ 的服务。RPC 充当 NFS 客户端和 NFS 服务器之间交互的中间人。RPC 服务由名为 `portmap` 的工具提供；当你尝试启动 NFS 服务器时，如果\
  \ `portmap` 服务器未运行，你会收到类似的错误消息：\n\n点击此处查看代码图片\n\n```\nCannot register service: RPC:\
  \ Unable to receive; errno = Connection refused\nrpc.rquotad: unable to register\
  \ (RQUOTAPROG, RQUOTAVERS, udp).\n```\n\n#### /etc/exports 文件\n\nNFS 服务器的主要配置是 `/etc/exports`\
  \ 文件。这是你用于指定想要与 NFS 客户端共享哪些目录的文件。该文件的语法为：\n\n```\nDirectory    hostname(options)\n\
  ```\n\n**Directory** 的值应替换为想要共享的目录名称（例如 `/usr/share/doc`）。**hostname** 的值应该是可以解析为\
  \ IP 地址的客户端主机名。**options** 值用于指定如何共享资源。\n\n例如，`/etc/exports` 文件中的以下条目将 `/usr/share/doc`\
  \ 目录共享给 NFS 客户端 jupiter（具有读写选项）和 NFS 客户端 mars（具有只读选项）：\n\n点击此处查看代码图片\n\n```\n/usr/share/doc\
  \ jupiter(rw) mars(ro)\n```\n\n\n\n\n\n请注意，`jupiter` 与主机名/ 选项之间存在空格，但主机名与其对应的选项之间没有空格。新手管理员的一个常见错误是提供如下的条目：\n\
  \n```\n/usr/share/doc jupiter (rw)\n```\n\n上一行将使用默认选项将 `/usr/share/doc` 目录与 `jupiter`\
  \ 主机共享，并且所有其他主机将以读写权限访问此共享。\n\n当你在 `/etc/exports` 文件中指定主机名时，允许以下方法：\n\n*   `hostname`：可以解析为\
  \ IP 地址的主机名。\n*   `netgroup`：使用 `@groupname` 标识的 NIS 网络组。\n*   `domain`：使用通配符的域名。例如，`*.onecoursesource.com`\
  \ 将包含 `onecoursesource.com` 域中的任何机器。\n*   `Network`：使用 VLSM（可变长度子网掩码）或 CIDR（无类域间路由）通过\
  \ IP 地址定义的网络。例如：`192.168.1.0/255.255.255.0` 和 `192.168.1.0/24`。\n\n有许多 NFS 共享选项，包括以下：\n\
  \n*   `rw`：以读写方式共享。请记住标准的 Linux 权限仍然有效。（注意这是一个默认选项。）\n*   `ro`：以只读方式共享。\n*   `sync`：文件数据更改立即写入磁盘，这会影响性能，但不太可能导致数据丢失。在某些发行版中这是默认的。\n\
  *   `async`：`sync` 的相反；文件数据更改最初写入内存。这会提高性能，但更有可能导致数据丢失。在某些发行版中这是默认的。\n*   `root_squash`：将\
  \ NFS 客户端的 root 用户和组账户映射到匿名账户，通常是 `nobody` 账户或 `nfsnobody` 账户。更多详情请参见下一节“用户 ID 映射”。注意这是一个默认选项。）\n\
  *   `no_root_squash`：将 NFS 客户端的 root 用户和组账户映射到本地 root 用户和组账户。更多详情请参见下一节“用户 ID 映射”。\n\
  \n### 用户 ID 映射\n\n为了使从 NFS 服务器向 NFS 客户端共享资源的过程尽可能透明，请确保两个系统上使用相同的 UIDs（用户 ID） 和\
  \ GIDs（组 ID）。要理解这一概念，请先查看图 12-1。\n\n![Image](img/12fig01.jpg)\n\n**图 12-1** NFS\
  \ ID 映射——相同的用户名和组名\n\n在图 12-1 中，NFS 服务器和 NFS 客户端都拥有相同的学生用户和组账户。两个系统对这些账户使用 `500`\
  \ 的 `UID` 和 `500` 的 `GID`。NFS 服务器与 NFS 客户端共享 `/share` 目录，客户端将其挂载在 `/access` 目录下。现在当学生用户尝试访问\
  \ `/access/example` 文件时，该用户对该文件拥有 `rw-` 权限。\n\n现在考虑图 12-2 中描述的情况。\n\n![Image](img/12fig02.jpg)\n\
  \n**图 12-2** NFS ID 映射——不同的用户名和组名\n\n图 12-2 示例中的 NFS 客户端有一个名为 `bob` 的用户和组，被分配了 `500`\
  \ 的 `UID` 和 `GID`。这意味着当 NFS 客户端上的 `bob` 用户访问 `/access/example` 文件（这实际上是 NFS 服务器上的\
  \ `/share/example` 文件）时，`bob` 将获得该文件的所有权。换句话说，NFS 客户端上的用户 `bob` 对 NFS 服务器上学生用户拥有的具有读写权限！\n\
  \n这就是为什么你在局域网之外看不到 NFS 的原因之一。还有其他原因（如安全问题），但这种 `UID` 和 `GID` 映射是理解 NFS 的一个重要方面。\n\
  \n### 安全亮点\n\n避免账户不匹配的一种方法是使用中央认证系统，例如 NIS 或 LDAP 服务器。使用中央认证系统比在多个系统上使用本地账户更安全（想象一下在几十个系统上删除或锁定同一个账户的头疼，更不用说你可能会忘记其中一个或多个）。\n\
  \nNIS 和 LDAP 配置涵盖第 19 章“网络配置”。\n\n回想 `/etc/exports` 文件的共享选项之一是 `root_squash`。这是因为你可能不希望\
  \ NFS 客户端上的 root 账户对 NFS 服务器上的文件拥有 root 权限。`root_squash` 共享选项会导致罕见的情况，即普通用户对文件系统中某些内容的权限比\
  \ root 用户还要。这是一个示例：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mount | tail\n\
  ```\n\n\n\n\n将 `portmap` 实用程序想象成老式的电话接线员。你可能在旧电影中见过这些场景，有人拿起电话说：“接线员，请帮我接通波士顿 4567。”接线员知道建立哪种连接来接通双方。如果你无法想象这个例子，可以认为\
  \ `portmap` 提供了计算机上各种服务和程序正在使用的端口映射表，就像地图上的图例标识每个元素一样。\n\n这就是 `portmap` 的主要工作。当基于\
  \ RPC 的服务启动时，它会通过向 `portmap` 提供网络端口号来告诉 `portmap` 如何访问它。当客户端系统尝试连接到服务器时，它会询问 `portmap`\
  \ 实用程序该服务在使用哪个端口。\n\n如果你已登录到 NFS 服务器，可以通过执行 `rpcinfo` 命令查看此信息，如示例 12-6\n\n```\n\
  [root@onecoursesource ~]# rpcinfo -p\n   program vers proto   port\n    100000 \
  \   2   tcp    111  portmapper\n    100000    2   udp    111  portmapper\n    100021\
  \    1   udp  56479  nlockmgr\n    100021    3   udp  56479  nlockmgr\n    100021\
  \    4   udp  56479  nlockmgr\n    100021    1   tcp  36854  nlockmgr\n    100021\
  \    3   tcp  36854  nlockmgr\n    100021    4   tcp  36854  nlockmgr\n    100011\
  \    1   udp    758  rquotad\n    100011    2   udp    758  rquotad\n    100011\
  \    1   tcp    761  rquotad\n    100011    2   tcp    761  rquotad\n    100003\
  \    2   udp   2049  nfs\n    100003    3   udp   2049  nfs\n    100003    4   udp\
  \   2049  nfs\n    100003    2   tcp   2049  nfs\n    100003    3   tcp   2049 \
  \ nfs\n    100003    4   tcp   2049  nfs\n    100005    1   udp    772  mountd\n\
  \    100005    1   tcp    775  mountd\n    100005    2   udp    772  mountd\n  \
  \  100005    2   tcp    775  mountd\n    100005    3   udp    772  mountd\n    100005\
  \    3   tcp    775  mountd\n```\n\n### 安全要点\n\n你也可以通过包含服务器的 IP 地址从远程系统查看此信息（例如，`rpcinfo\
  \ -p 192.168.1.22`）。这就是某些管理员倾向于使用 Samba 而不是 NFS 的原因之一（开放许多可见的网络端口会带来潜在的安全风险）。\n\n\
  你还可以通过阻止访问 `portmap` 服务来阻止特定的 NFS 客户端访问 NFS 服务器。`portmap` 服务使用名为 TCP Wrappers 的库，也称为\
  \ `libwrap`。\n\nTCP Wrappers 使用两个文件来提供允许或阻止访问服务的手段：`/etc/hosts.allow` 和 `/etc/hosts.deny`\
  \ 文件。这两个文件都包含设计用于匹配连接尝试的规则。例如，以下规则匹配了来自 192.168.1.100 机器连接到 `portmap` 服务的尝试：\n\n\
  ```\nportmap: 192.168.1.100\n```\n\n规则按照以下方式应用：\n\n1. 如果规则在 `/etc/hosts.allow` 文件中匹配，则连接被*准许*。\n\
  2. 如果规则在 `/etc/hosts.deny` 文件中匹配，则连接*不被允许*。\n3. 如果两个文件中都没有匹配的规则，则连接被*准许*。\n\n因此，两个文件中都没有任何规则，意味着来自所有系统的所有连接都被准许了。假设你想拒绝对\
  \ 192.168.1.0/24 网络中所有机器的访问，但允许该网络中的一台机器（192.168.1.100），并允许该网络之外的所有机器访问 `portmap`\
  \ 实用程序。你可以使用以下规则：\n\n点击此处查看代码图像\n\n```\nroot@onecoursesource ~]# more /etc/hosts.allow\n\
  portmap: 192.168.1.100\nroot@onecoursesource ~]# more /etc/hosts.deny\nportmap:\
  \ 192.168.1.0/24\n```\n\n大多数情况下，你希望准许几台机器访问并拒绝所有其他机器。例如，以下规则集将允许 192.168.1.0/24\
  \ 网络中的所有机器访问 `portmap` 实用程序并拒绝所有其他机器：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# more /etc/hosts.allow\nportmap: 192.168.1.0/24\nroot@onecoursesource ~]# more\
  \ /etc/hosts.deny\nportmap: ALL\n```\n\n**注意**\n\nTCP Wrappers 的内容远比本章讨论的要。要获取更全面的\
  \ TCP Wrappers ，请参阅第 23 章“制定网络安全策略](#ch23.xhtml_ch23)”。\n\n### NFS 服务器命令\n\n可以在\
  \ NFS 服务器上使用 `exportfs` 命令来显示当前共享的内容：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource\
  \ ~]# exportfs\n/share          <world>\n```\n\n`exportfs` 命令也可以用于临时共享资源，前提是 NFS\
  \ 服务已经启动：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# exportfs -o ro 192.168.1.100:/usr/share/doc\n\
  [root@onecoursesource ~]# exportfs\n/usr/share/doc  192.168.1.100\n/share      \
  \    <world>\n```\n\n`-o` 选项用于指定共享选项。参数包括要共享的系统名称以及要共享的目录，之间用冒号（`:`）分隔。\n\n如果你修改了\
  \ `/etc/exports` 文件，任何新添加的共享将在重启后生效。\n\n#### 配置 NFS 客户端\n\n挂载 NFS 共享与挂载分区或逻辑卷没有太大区别。首先创建一个普通目录：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mkdir /access\n```\n\n接下来，使用 `mount`\
  \ 命令挂载 NFS 共享：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mount 192.168.1.22:/share\
  \ /access\n```\n\n你可以通过执行 `mount` 命令或查看 `/proc/mounts` 文件来验证挂载是否成功。查看 `/proc/mounts`\
  \ 文件的优势在于它提供了更详尽的信息：\n\n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# mount | tail\
  \ -1\n192.168.1.22:/share on /access type nfs (rw,addr=192.168.1.22)\n[root@onecoursesource\
  \ ~]# tail -1 /proc/mounts\n192.168.1.22:/share /access nfs rw,relatime,vers=3,rsize=131072,wsize=131072,namlen=255,hard,proto=tcp,\
  \ timeo=600,retrans=2,sec=sys,mountaddr=192.168.1.22,mountvers=3,mountport=772,mountproto=udp,local_lock=none,addr=192.168.1.22\
  \ 0 0\n```\n\n如果重启 NFS 客户端，此挂载在系统启动后不会重新建立。为了实现重启后的持久挂载，请在 `/etc/fstab` 文件中添加如下条目：\n\
  \n点击此处查看代码图像\n\n```\n[root@onecoursesource ~]# tail -1 /etc/fstab\n192.168.1.22:/share\
  \      /access  nfs      defaults      0      0\n```\n\n在 `/etc/fstab` 文件中添加此条目后，卸载\
  \ NFS 共享（如有必要），并在执行 `mount` 命令时仅提供挂载点来测试新条目：\n\n点击此处查看代码图像\n\n```\n\n\n\n\n```\n\
  [root@onecoursesource ~]# umount /access\n[root@onecoursesource ~]# mount /access\n\
  [root@onecoursesource ~]# mount | tail -1\n192.168.1.22:/share on /access type nfs\
  \ (rw,addr=192.168.1.22)\n```\n\n请记住，`/etc/fstab` 文件的第四字段包含挂载选项。NFS 有多种挂载选项，包括一些默认挂载选项。表\
  \ 12-2 描述了这些选项，其中**粗体**为默认选项。\n\n### 表 12-2 NFS 挂载选项\n\n| 选项 | 说明 |\n| --- | ---\
  \ |\n| `soft`|`hard` | NFS 会在特定时间内挂载 NFS 服务器。如果服务器没有响应且使用了 `hard` 选项，NFS 客户端将无限尝试挂载。如果使用\
  \ `soft` 选项，NFS 客户端将停止尝试挂载服务器。这在启动过程中非常重要。你不希望系统挂起，反复尝试挂载一个无法访问的 NFS 服务器资源（可能是服务器宕机或存在网络问题）。\
  \ |\n| `fg`|`bg` | 在启动过程中执行前台 (`fg`) 挂载或后台 (`bg`) 挂载。如果你决定使用 `hard` 选项，考虑将挂载放在 `bg`\
  \ 模式，这样系统在 NFS 服务器不可用时继续启动，而不会可能挂起。 |\n| `timeo=` | 使用 1/10 秒设置超时值。例如，`timeo=300`\
  \ 表示 30 秒的超时值。 |\n| `retrans=` | 指定重试挂载 NFS 共享的次数。默认情况下进行三次 UDP 尝试和两次 TCP 尝试。 |\n\
  | `retry=` | 在超时之前尝试的次数。默认值取决于你的发行版和 NFS 版本。 |\n| `rsize=` | 每个读取 请求的最大字节数。管理员通常将其此为值\
  \ 8192（默认值可以是 1024、4096 或 8192，取决于你的发行版）。最大值取决于你的 NFS 版本。建议通过基准测试（测试不同的配置以确定最佳配置）来确定最佳速率。\
  \ |\n| `wsize=` | 每个写入 请求的最大字节数。管理员通常将其置为值 8192（默认值可以是 1024、4096 或 8192，取决于你的发行版）。最大值取决于你的\
  \ NFS 版本。建议通过基准测试确定最佳速率。 |\n| `rw`|`ro` | 尝试以读写 (`rw`) 或只读 (`ro`) 挂载 NFS 共享。如果资源是以只读方式共享的，无论此选项如何，挂载都是只读的。\n\
  \n#### iSCSI\n\niSCSI (互联网小型系统接口) 基于 SCSI 提供的通信协议的网络存储解决方案。记住 SCSI 是一种在内核与 SCSI\
  \ 设备之间提供接口的协议。\n\n##### 对话式学习™—iSCSI 的优势\n\n**Gary**: 嘿，Julia。可以听听你的建议吗？\n\n**Julia**:\
  \ 随时欢迎。\n\n**Gary**: 我正试图理解 iSCSI 提供了哪些优势。\n\n**Julia**: 嗯，你真正需要考虑的是远程存储相对于本地存储提供的优势。请记住，与本地硬盘不同，iSCSI\
  \ 提供了对远程存储设备的访问。\n\n**Gary**: 好的，我明白。例如，本地磁盘空间可能非常有限，而远程存储可以使用大型数据中心的设备，对吧？\n\n\
  **Julia**: 这是优势之一。还有其他优势，但你的方向是对的。例如，考虑网络连接的可靠性。如果你使用远程存储，这一点非常重要。\n\n**Gary**:\
  \ 那么，如果我决定使用远程存储，我有哪些选择？\n\n**Julia**: 你可以使用像 Samba 或 NFS 这样的文件共享服务。这些通常被称为 NAS，即网络附属存储。虽然这些服务有一些优势，但它们的设计实际上是为了共享文件系统的一部分。iSCSI\
  \ 为客户端系统提供了一个工作类似于本地硬盘的设备，但显然位于远程。\n\n**Gary**: 好的，那么还有其他我应该考虑的 iSCSI 替代方案吗？\n\n\
  **Julia**: 是的，你也可以选择光纤（Fibre Channel），通常被称为 FC。\n\n**Gary**: 那么，FC 的优缺点是什么？\n\n\
  **Julia**: 这并不总是一目了然的，但通常 FC 将非常非常性能和可靠性，但成本比 NAS 和 iSCSI 解决方案高。此外，FC 在局域网中提供很好的解决方案，而\
  \ NAS 和 iSCSI 是广域网更好的解决方案。\n\n**Gary**: 好的，这给了我一个很好的起点。听起来在做决定之前，我应该获取每种解决方案的更多细节。\n\
  \n**Julia**: 是的，这种事情你不直接跳进去。在采取任何行动之前，规划你的网络存储需求并确定哪种解决方案最合适。\n\n**Gary**: 更多的作业！我想我应该习惯这一点。\n\
  \n**Julia**: 只要尽力避免得到“F”就行！\n\n要理解 iSCSI，你首先需要知道一些关键术语：\n\n*   **Target (目标)**：此术语描述位于服务器上的存储设备。服务器可以是局域网，也可以是广域网。将目标视为被共享的存储设备。此外，请记住，目标被视为设备而不是文件系统。当客户端系统访问此设备时，可以像对待硬盘一样处理它。\n\
  *   **Initiator (启动器)**：这是连接到目标的客户端。在某些情况下，启动器被称为 iSCSI 客户端。\n*   **WWID**：全球标识符（World\
  \ Wide Identifier）；这是一个保证在全球范围内唯一的标识符。对于连接到互联网的 iSCSI 设备，这个唯一数字很重要，以确保没有其他 iSCSI\
  \ 设备具有相同的标识号。它在概念上类似于网卡上的 MAC 地址（这是其他网卡都没有的唯一标识符）。在 iSCSI 服务器上，将通过符号链接文件和实际设备文件名建立关联。WWN（全球名称）术有时与\
  \ WWID 互换使用。\n*   **LUN**：逻辑单元号（Logical Unit Number）；这是目标用于识别 iSCSI 设备的值。该概念源于 SCSI，在每个系统中，每个\
  \ SCSI 设备可以通过像这样的 LUN 来识别，格式如下：`/dev/dsk/c0t0d0s0`。`c0t0d0s0` 表示你要访问的 SCSI 设备的控制器卡、目标、磁盘和切片（分区）。对于\
  \ iSCSI 来说，重要的是理解 WWID 是互联网上唯一的名称，而 LUN 仅在本地系统中是唯一的。\n\n##### 目标配置\n\n要将你的系统配置为\
  \ iSCSI 服务器，你首先需要安装 `scsi-target-utils` 包及其依赖项。该包在大多数发行版中通常不会默认安装。（参见 第 26 章“基于\
  \ Red Hat 的软件管理](#ch26.xhtml_ch26)”和 第 27 章“基于 Debian 的软件管理](#ch27.xhtml_ch27)”获取如何管理软件包的信息。）请记住，`scsi-target-utils`\
  \ 包还有也需要安装的依赖包。如果不确定如何安装此软件，请查看第 [26] 章和第 [27] 章。\n\n安装软件包后，编辑 `/etc/tgt/targets.conf`\
  \ 文件以创建目标。条目应该像所示：\n\n点击此处查看代码图像\n\n```\n<target iqn.2018-10.localdomain.onecoursesource:test1>\n\
  \        backing-store /dev/VolGroup/iscsi\n        initiator-address 10.0.2.15\n\
  </target>\n```\n\n\n\n\n\n在这里，`iqn.2018-10.localdomain.onecoursesource:test1` 是为该目标创建唯一名称的方法，类似于前文提到的\
  \ WWID。其格式应为 `iqn.year-month.domain_in_opposite_order:name_for_target`。例如，如果你想在\
  \ `test.sample.com` 机器上创建一个名为 `firefly` 的目标，且现在是 2018 年 10 月，那么你创建的名称就是 `iqn.2018-10.com.sample.test:firefly`。\n\
  \n`backing-store` 值应该是一个没有数据或文件系统的设备，例如新创建的分区或逻辑卷。请记住，你创建的是设备目标，而不是共享现有的文件系统。\n\n\
  `initiator-address` 描述哪些系统允许访问此目标。\n\n接下来，启动 `tgtd` 守护进程。在 SysVinit 系统上，执行以下命令：\n\
  \n点击此处查看代码\n\n```\n[root@onecoursesource ~]# /etc/init.d/tgtd start\nStarting SCSI\
  \ target daemon:                            [  OK  ]\n```\n\n最后，执行 `tgt-admin --show`\
  \ 命令来验证目标已启用，如示例 12-7 所示。\n\n**示例 12-7 `tgt-admin --show` 命令**\n\n点击此处查看代码\n\n```\n\
  [root@onecoursesource ~]# tgt-admin --show\nTarget 1: iqn.2018-10.localdomain.onecoursesource:test1\n\
  \    System information:\n        Driver: iscsi\n        State: ready\n    I_T nexus\
  \ information:\n    LUN information:\n        LUN: 0\n            Type: controller\n\
  \            SCSI ID: IET     00010000\n            SCSI SN: beaf10\n          \
  \  Size: 0 MB, Block size: 1\n            Online: Yes\n            Removable media:\
  \ No\n            Prevent removal: No\n            Readonly: No\n            Backing\
  \ store type: null\n            Backing store path: None\n            Backing store\
  \ flags:\n        LUN: 1\n            Type: disk\n            SCSI ID: IET     00010001\n\
  \            SCSI SN: beaf11\n            Size: 264 MB, Block size: 512\n      \
  \      Online: Yes\n            Removable media: No\n            Prevent removal:\
  \ No\n            Readonly: No\n            Backing store type: rdwr\n         \
  \   Backing store path: /dev/VolGroup/iscsi\n            Backing store flags:\n\
  \    Account information:\n    ACL information:\n        10.0.2.20\n```\n\n### 启动器配置\n\
  \n要将你的系统配置为 iSCSI 启动器（initiator），你首先需要安装 `iscsi-initiator-utils` 包及其依赖项。大多数发行版默认通常不会安装此包。\n\
  \n安装该包后，你可以使用 `iscsiadm` 命令查看 iSCSI 服务器提供的目标名称。要执行此任务，请使用以下 `iscsiadm` 命令：\n\n点击此处查看代码\n\
  \n```\n[root@onecoursesource ~]# iscsiadm -m discovery -t sendtargets -p 10.0.2.15\n\
  Starting iscsid:                                      [  OK  ]\n10.0.2.20:3260,\
  \ iqn.2018-10.localdomain.onecoursesource:test1\n```\n\n注意，第一次执行此命令时，它会自动启动 `iscsid`\
  \ 守护进程。\n\n你在 `iscsiadm` 命令的输出中寻找的是哪些机器可以作为启动器（在这种情况下为 10.0.2.20）以及 IQN（iSCSI 限定名称）。启动器列表应该包含你执行命令的机器（客户端），这样你才能连接到\
  \ iSCSI 目标。\n\n现在目标已经被发现，连接到它的简单方法是启动 `iscsi` 服务：\n\n点击此处查看代码\n\n```\n[root@onecoursesource\
  \ ~]# /etc/init.d/iscsi restart\n```\n\n`iscsi` 脚本启动 `iscsid` 守护进程，它负责管理启动器端的 iSCSI\
  \ 目标。虽然你可能不会更改 `iscsid` 守护进程的配置，但你应该知道它位于 `/etc/iscsi/iscsid.conf` 文件。\n\n`iscsi`\
  \ 脚本也是确定目标在本地系统中分配的设备名称的好方法，如示例 12-8 中高显示的输出所示。\n\n**示例 12-8 确定 iSCSI 目标的本地设备名称**\n\
