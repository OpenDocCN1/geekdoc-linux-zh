  \n`VLSM` 可变长度子网掩码（Variable-Length Subnet Mask）；一个分为四个字节的 32 位数字，用于定义 IPv4 子网掩码。\n\
  \n`VM` 参见 `virtual machine`。\n\n`VPN` 虚拟专用网络（Virtual private network）；提供物理网络上可用隐私的虚拟网络。\n\
  \n`WAN` 广域网（Wide area network）；这种网络描述了通过一系列路由器或交换机通信的局域网集合。\n\n`WAP` Wi-Fi 安全访问（Wi-Fi\
