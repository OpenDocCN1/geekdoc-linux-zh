  3. 号\n4. 以上均不是\n\n## 第 21 章\n\n### 网络服务配置：Web 服务\n\n在本章中，你探索了如何配置几项重要的网络服务。你学习了如何正确设置和保护\
  \ `BIND` DNS 服务器，以及如何配置 `DHCP` 服务器。你还学习了如何配置各种邮件服务器，包括 `Postfix`、`procmail` 和 `Dovecot`。\n\
  \n最常见的服务器类型之一是 Web 服务器。根据估计，有超过一亿服务器直接连接到互联网，但也有用于公司和政府内部。由于大多数这些服务器可以通过互联网访问，因此安全性至关重要。在本章中，你不仅学习了如何配置\
  \ Apache，还将学习安全功能。阅读本章并完成练习后，你能够：\n\n- 配置 Apache Web 服务器\n- 启用安全功能\n- 配置代理服务器\n\n\
  ### Apache Web 服务器\n\n通常，当人们说他们安装了 Apache 时，指的是 Apache 软件基金提供的 Web 服务器。该组织实际上提供了许多开源项目，但由于它最著名的项目，Apache\
  \ 在软件术语中已成为该服务器的代名词。\n\n超文本传输协议（HTTP，或简单的 *hypertext*）自 20 世纪 90 年代以来的标准。该协议允许客户端程序（网络浏览器）从服务器程序（例如\
  \ `httpd` 进程）请求数据。通常这些数据由超文本标记语言（HTML）进行格式化，然后被转换为人类可读的网页。\n\n在开始配置 Apache Web 服务器之前，你首先需要找到主配置文件的位置。根据你使用的发行版，该文件可能位于以下目录之一：\n\
  \n*   `/etc/apache`\n*   `/etc/apache2`\n*   `/etc/httpd`\n*   `/etc/httpd/conf`\n\
  \n例如，在 Ubuntu 系统上，配置文件位于 `/etc/apache2` 目录，而在 CentOS 系统上，它位于 `/etc/httpd/conf` 目录。甚至主配置文件名也会根据发行版而不同，例如它在\
  \ CentOS 上命名为 `httpd.conf`，在 Ubuntu 上命名为 `apache2.conf`。尽管这可能令人沮丧，但好消息是，无论配置文件在哪里，文件内部语法应该是相同的。\n\
  \n### 基础 Apache Web 服务器配置\n\n\n\n\n默认的 Apache Web Server 配置文件由注释和指令（directives）组成，指令是参数，因此可以被赋值。以下是\
  \ Apache 配置文件的部分内容示例：\n\n点击此处查看代码图像\n\n```\n# ServerRoot: 目录树的顶层，服务器的\n# 配置、错误和日志文件都保存在该目录之下。\n\
  #\n# 不要在目录路径末尾添加斜杠。如果你将\n# ServerRoot 指向非本地磁盘，如果使用了基于文件的互斥（file-based mutexes），\n\
  # 请务必在 Mutex 指令中指定本地磁盘。如果你希望为多个 httpd\n# 守护进程共享相同的 ServerRoot，你将需要至少修改\n# PidFile。\n\
  #\nServerRoot \"/etc/httpd\"\n```\n\n通常情况下，每个指令（至少是默认指令）都有详细的注释 `#*comment`，这使得更容易确定每个指令的作用。有数百种可能的指令，其中某些指令将在本章的稍后部分进行详细描述。你应该了解的基本指令已在表\
  \ 21-1 中描述。（注释格式的描述直接取自配置文件。）\n\n**表 21-1** 基础 Apache 指令\n\n| `Directive` | `Description`\
  \ |\n| --- | --- |\n| `ServerRoot` | 点击此处查看代码图像 |\n```\n# ServerRoot: 目录树的顶层，服务器的\n\
  # 配置、错误和日志文件都保存在该目录之下。\n```\n示例：`ServerRoot \"/etc/httpd\"` |\n| `Listen` | 点击此处查看代码图像\
  \ |\n```\n# Listen: 允许将 Apache 绑定到特定的 IP 地址和/或\n# 端口，而不是默认设置。另见 <VirtualHost>\n\
  # 指令。\n```\n示例：`Listen 12.34.56.78:80` 示例：`Listen 80` 关于此指令的进一步讨论将在本章稍后部分出现。 |\n\
  | `DocumentRoot` | 点击此处查看代码图像 |\n```\n# DocumentRoot: 你提供文档的\n# 目录。默认情况下，所有请求都来自此目录，但\n\
  # 可以符号链接和别名（aliases）来指向其他位置。\n```\n示例：`DocumentRoot \"/var/www/html\"` |\n| `LogLevel`\
  \ | 点击此处查看代码图像 |\n```\n# LogLevel: 控制记录到 error_log 中的消息数量。\n# 可能的值包括：debug, info,\
  \ notice, warn, error, crit,\n# alert, emerg。\n```\n示例：`LogLevel warn` 当你的 Web 服务器运行不正常时，这可能是一个关键设置。考虑将\
  \ LogLevel 更改为 `debug` 并重启你的 Web 服务器。现在日志文件中会现在许多有用的日志消息。 |\n\n在某些情况下，指令需要多个值。多行指令的语法与单行指令不同：点击此处查看代码图像\n\
  \n```\n<Directory />\n    AllowOverride All\n    Require all\n</Directory>\n```\n\
  `<Directory />` 行开始指令，并持续到 `</Directory>`。在先先的示例中，`AllowOverride` 和 `Require` 也是指令（你可以将这些视为子指令）。\n\
  \n### 启动 Apache Web Server\n\n在安装 Apache Web Server 软件包后，你应该能够使用默认配置文件启动服务器。虽然它不会提供有用的内容，但知道服务器在不需要进行任何更改的情况下正常运行是一件好事。\n\
  \nApache Web Server 进程的名为 `httpd`。你可以使用常规脚本或使用 `apache2`（或 `apachectl`）程序启动此进程。启动服务器后，你可以通过在与服务器同一台机器上打开\
  \ Web 浏览器并在 URL 中输入 `localhost` 来验证它是否响应请求。结果应该像图 21-1 所示的那样。\n\n![图像](img/21fig01.jpg)\n\
  **图 21-1** 默认 Apache 页面\n\n默认情况下，网页所在的位于是 `/var/www/html` 目录（你可以通过查找主配置文件中的 `DocumentRoot`\
  \ 设置来确认或更改确切位置）。在全新安装 Apache 软件后，此目录应该是空的。如果你想进一步测试服务器的功能，可以在 `/var/www/html` 目录中创建一个小型文本文件（如果你熟悉该语言，则创建\
  \ HTML）：点击此处查看代码图像\n\n```\n[root@localhost ~]# echo \"testing, 1, 2, 3, testing\"\
  \ > /var/www/html/test\n```\n\n### Apache 服务器日志文件\n\n在测试和排错 Apache Web Server 时，两个日志文件非常有用：`access_log`\
  \ 和 `error_log`。`access_log` 包含了尝试从 Web 服务器访问内容的信息。`error_log` 包含了关于 Web 服务器上出现的问题的消息。\n\
  \n以下演示了 `access_log` 中的最后两个条目：点击此处查看代码图像\n\n```\n[root@localhost ~]# tail -2 /var/log/httpd/access_log\n\
  ::1 - [09/Dec/2018:05:02:22 -0800] \"GET /tes HTTP/1.1\" 404 20 \"-\" \"Mozilla/5.0\
  \ (X11; Linux x86_64; rv:38.0) Gecko/2010 Firefox\n::1 - [09/Dec/2018:05:02:28 -0800]\
  \ \"GET /test HTTP/1.1\" 200 26 \"-\" \"Mozilla/5.0 (X11; Linux x86_64; rv:38.0)\
  \ Gecko/2010 Firefox\n```\n\n注意在每一行中，`\"GET\"` 部分指示请求的文件。`access_log` 并不指示文件是否被实际发送，只指示了请求。\n\
  \n**安全提示**：许多随机访问可能是有人试图入侵你的系统。定期监控访问日志，特别是 404 错误（表示有人尝试获取不存在的网页）、403 错误（拒绝）以及\
  \ 401 错误（由于安全原因拒绝访问）。这些通常都是探测攻击的示例。\n\n### 启用脚本\n\n你可以通过启用模块为 Apache Web Server\
  \ 添加功能。许多模块随 Apache 默认安装提供，其他的可以在互联网上获得。你至少应该知道如何启用 Perl 和 PHP 脚本。这些模块允许 Web 开发人员使用脚本创建更多动态网页。\n\
  \n**安全提示**：这是在 Web 服务器上启用脚本的简要介绍。在现实世界中，你应该谨慎实施脚本，因为它可能允许黑客未经许可访问你的系统。虽然你需要了解这些基础，但在实际服务器上部署之前，考虑深入探讨此主题。\n\
  \n要启用 PHP 脚本，请采取以下步骤：\n\n**步骤 1.** 确保系统上已安装 PHP。例如，以下命令验证 CentOS 系统上已安装 PHP（请参见第\
  \ 26 章“基于 Red Hat 的软件管理](#ch26.xhtml_ch26)”和 27 章“基于 Debian 的软件管理](#ch27.xhtml_ch27)””，有关如何安装软件的说明，如有必要）：点击此处查看代码图像\n\
  \n```\n[root@localhost ~]# yum list installed | grep php\nphp.x86_64           \
  \               7.2.3-36.el7_1                 @updates\nphp-cli.x86_64        \
  \              7.2.3.el7_1                    @updates\nphp-common.x86_64      \
  \             7.2.3.el7_1                    @updates\n```\n\n**步骤 2.** 验证 `libphp7.so`\
  \ 文件位于 Apache Web Server 模块目录。该文件应该随着 PHP 软件包一起安装。在 CentOS 系统上，Apache Web Server\
  \ 模块位于 `/etc/httpd/modules` 目录。\n\n\n\n\n\n点击此处查看代码图片\n\n```\n[root@localhost ~]#\
  \ ls /etc/httpd/modules/*php*\n/etc/httpd/modules/libphp7.so\n```\n\n### 步骤 3. 配置\
  \ Apache Web 服务器以启用 PHP\n\n这可以通过修改主配置文件或在模块的 `include` 目录中创建文件来实现。例如，在 CentOS 系统上，主配置文件中出现以下行：\n\
  \n点击此处查看代码图片\n\n```\n[root@localhost ~]# grep Include /etc/httpd/conf/httpd.conf\n\
  Include conf.modules.d/*.conf\n    #   Indexes Includes FollowSymLinks SymLinksifOwnerMatch\
  \ ExecCGI\nMultiViews\n    # (你可能还需要向 \"Options\" 指令中添加 \"Includes\"。)\nIncludeOptional\
  \ conf.d/*.conf\n```\n\n在 `/etc/httpd/conf.modules.d` 目录下，存在以下文件：\n\n点击此处查看代码图片\n\
  \n```\n[root@localhost ~]# cat /etc/httpd/conf.modules.d/10-php.conf\n#\n# PHP 是一种\
  \ HTML 嵌入脚本语言，旨在让开发者\n# 轻松地编写动态生成的网页。\n#\n<IfModule prefork.c>\n  LoadModule php5_module\
  \ modules/libphp5.so\n</IfModule>\n```\n\n### 步骤 4. 重启 Apache Web 服务器\n\n请记住，之前的步骤应该已经提供了基本的\
  \ PHP 功能。对于真实世界的 Apache Web 服务器，可能还有你想要探索的额外配置设置。\n\n如何判断它是否生效了？首先，在 `DocumentRoot`\
  \ 目录（例如 `/var/www/html`）中创建以下文件（命名为 `hello.php`）：\n\n点击此处查看代码图片\n\n```html\n<html>\n\
  <head>\n<title>PHP Test</title>\n</head>\n<body>\n<?php echo '<p>Hello World</p>';\
  \ ?>\n</body>\n</html>\n```\n\n然后，通过将浏览器指向 `localhost/hello.php` URL 来测试脚本。结果应该看起来像图\
  \ 21-2。\n\n![图像](img/21fig02.jpg)\n\n**图 21-2** *PHP 测试页面*\n\n#### 可能会出现什么问题？\n\n\
  `IfModule prefork.c` 指令用于指定何时加载模块。关键元素是 `LoadModule` 行，因此请勿删除此值。\n\n要启用 Perl 脚本，请执行以下步骤：\n\
  \n#### 步骤 1. 确保系统上安装了 Perl Apache 模块\n\n例如，以下命令验证 CentOS 系统上是否安装了 PHP：\n\n点击此处查看代码图片\n\
  \n```\n[root@localhost ~]# yum list installed | grep mod_perl\nmod_perl.x86_64 \
  \                       2.0.8-10.20140624svn1602105.el7 @epel\n```\n\n#### 步骤 2.\
  \ 验证 `mod_perl.so` 文件是否在 Apache Web 服务器模块目录中\n\n该文件应已 mod_perl 软件软件包一起安装。在 CentOS\
  \ 系统上，Apache Web 服务器模块位于 `/etc/httpd/modules` 目录：\n\n点击此处查看代码图片\n\n```\n[root@localhost\
  \ ~]# ls /etc/httpd/modules/*perl*\n/etc/httpd/modules/mod_perl.so\n```\n\n####\
  \ 步骤 3. 配置 Apache Web 服务器以启用 Perl\n\n这可以通过修改主配置文件或在模块的 `include` 目录中创建文件来实现，如下：\n\
  \n点击此处查看代码图片\n\n```\n[root@localhost ~]# cat /etc/httpd/conf.modules.d/02-perl.conf\n\
  #\n# Mod_perl 将 Perl 解释器整合到 Apache Web 服务器中，\n# 这样 Apache Web 服务器就可以直接执行 Perl 代码。\n\
  # Mod_perl 将 Perl 运行时库链接到 Apache Web 服务器，\n# 并为 Apache 的 C 语言 API 提供面向对象的 Perl 接口。\n\
  # 结果是更快的 CGI 脚本处理过程，\n# 因为不需要启动外部的 Perl 解释器。\n#\nLoadModule perl_module modules/mod_perl.so\n\
  ```\n\n#### 步骤 4. 在主 Apache Web 服务器配置文件中添加以下内容\n\n点击此处查看代码图片\n\n```\n<Directory\
  \ /var/www/html/perl>\nAllowOverride All\nSetHandler perl-script\nPerlHandler ModPerl::Registry\n\
  PerlOptions +ParseHeaders\nOptions ExecCGI\nOrder allow,deny\nAllow from all\n</Directory>\n\
  ```\n\n这允许你将 Perl 脚本放置在 `/var/www/html/perl` 目录下。\n\n#### 步骤 5. 重启 Apache Web 服务器\n\
  \n如何判断它是否生效了？首先，在 `/var/www/html/perl` 目录下创建以下文件（命名为 `hello.pl`）：\n\n点击此处查看代码图片\n\
  \n```perl\nprint \"Content-type: text/plain\\r\\n\\r\\n\";\nprint \"hello\\n\";\n\
  ```\n\n然后，通过将浏览器指向 `localhost/perl/hello.pl` URL 来测试脚本。结果应该看起来像图 21-3。\n\n![图像](img/21fig02.jpg)\n\
  \n**图 21-3** *PHP 测试页面*\n\n#### 可能会出现什么问题？\n\n`IfModule prefork.c` 指令用于指定何时加载模块。关键元素是\
  \ `LoadModule` 行，因此请勿删除此值。\n\n要启用 Perl 脚本，请执行以下步骤：\n\n#### 步骤 1. 确保系统上安装了 Perl Apache\
  \ 模块\n\n（此处重复翻译内容逻辑已与上文一致）\n\n#### 步骤 2. 验证 `mod_perl.so` 文件是否在 Apache Web 服务器模块目录中\n\
  \n（此处重复翻译内容逻辑已与上文一致）\n\n#### 步骤 3. 配置 Apache Web 服务器以启用 Perl\n\n（此处重复翻译内容逻辑已与上文一致）\n\
  \n#### 步骤 4. 在主 Apache Web 服务器配置文件中添加以下内容\n\n（此处重复翻译内容逻辑已与上文一致）\n\n#### 步骤 5. 重启\
