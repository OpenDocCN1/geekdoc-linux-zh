  \ ubuntu ovpn-client[1407]: Use --help for more information.\nJan 19 17:45:15 ubuntu\
  \ ovpn-client[3389]: Options error: --ca fails with 'ca.crt': No such\nfile or directory\n\
  Jan 19 17:45:15 ubuntu ovpn-client[3389]: Options error: --cert fails with 'vpnclient1.\n\
  crt: No such file or directory\nJan 19 17:45:15 ubuntu ovpn-client[3389]: Options\
  \ error: --key fails with 'vpnclient1.\nkey': No such file or directory\nJan 19\
