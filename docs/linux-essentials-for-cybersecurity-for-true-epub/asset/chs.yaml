  .                      518400  IN      NS      i.root-servers.net.\n.          \
  \            518400  IN      NS      j.root-servers.net.\n.                    \
  \  518400  IN      NS      k.root-servers.net.\n.                      518400  IN\
  \      NS      l.root-servers.net.\n.                      518400  IN      NS  \
  \    m.root-servers.net.\n;; ADDITIONAL SECTION:\na.root-servers.net.    3600000\
