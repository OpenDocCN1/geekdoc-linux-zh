  \ 是一种较老的加密规范；WPA 设计用于取代 WEP。\n\n### 总结\n\n在本章中，你学习了几个关键网络概念。本章的目标不是让你成为网络专家，而是向你介绍这些概念，以便配置、维护、故障排除和安全网络的过程变得更容易。\n\
