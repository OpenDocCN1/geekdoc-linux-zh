    Invoke a function by its name: function_name


    ### Input and Output Handling


    Reading User Input: Using read command to get input from the user.


    Output Redirection: Redirecting output to files or other commands using > or |.


    ### Script Debugging and Best Practices


    Debugging: Use -x option to trace script execution: bash -x script.sh.


    Best Practices:


    Include comments for documentation.


    Write clean, readable code.


    Handle errors gracefully.


    ### Advanced Shell Scripting Techniques


    Parameter Expansion: Manipulating strings and variables.


    Regular Expressions: Pattern matching in text processing.


    Scripting for Automation: Automating system administration tasks like backups,
    user management, and monitoring.


    Shell scripting is a powerful tool in the Linux ecosystem, enabling administrators
    and developers to automate tasks, streamline processes, and configure systems
    efficiently. This chapter provides a foundational understanding of shell scripting
    basics, from simple scripts to more complex automation tasks. By mastering shell
