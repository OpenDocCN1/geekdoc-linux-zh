  md: '# Chapter 2 • Installation


    Linux with only a single native partition and use a swap file, but this is not
    recommended. This is because having multiple small partitions can limit damage
    in the event of a power failure. A small root partition reduces the chances that
    the root partition will get corrupted, allowing you to at least boot and restore
    the system by hand before performing a full reinstall. On the downside, a small
    root partition may fill quickly.


    At a bare minimum, you should set up partitions to keep the system software-separate
    from third-party software and user files plus the swap space partition.


    Swap space is similar to temp space under Windows or virtual memory in macOS:
    it is space on disk that can be used to supplement the physical memory (RAM) if
    needed. Of course, it is about two orders of magnitude slower than the main memory.


    A common, arbitrary, rule of thumb is to make the swap space somewhere-between
    one and two times the size of the physical memory. Depending on what the system
    is to be used for and how much RAM it has, you may want or need to assign more
    swap space than this, possibly spread between partitions.


    Assigning partitions for use under Linux is easy for a new drive or new system.
    However, if Windows is already installed and you want to use that drive, you''ll
    need to shrink the existing Windows partition. You will then have enough space
    on the hard drive to create Linux partitions. If you''re a fan of commercial software,
    try using Partition Magic, which allows you (from Windows or Linux) to modify
    partitions on-the-fly. From Windows, you can shrink the size of a Windows partition
    and assign the remaining space to Linux. Also available is the free ips package;
    however, the authors have not used this package, so your experience with this
    program may vary. For new users, getting a new drive is recommended.


    When the install program drops into fdisk, you will see a prompt like this:


    Command (m for help):


    The m command lists this page of helpful information:


    Command (m for help): m


    Command action


    +   a toggle a bootable flag

    b edit disklabel

    c toggle the dos compatibility flag

    d delete a partition

    l list known partition types

    m print this menu

    a add a new partition'
