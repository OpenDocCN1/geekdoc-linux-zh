    # 20.3 Tape Drives


    There is a rather large and bewildering selection of tape drives. In a reasonable
    amount of time, if you need to back up large amounts of data you can eliminate
    ones using the parallel port as they have lower outputs. ATAPI (IDE) tape drives
    also exist.


    Assuming you decide to use a SCSI tape drive, you will need to enable SCSI tape
    support in your kernel, or have the st.o module loaded. As in installing any SCSI
    device, make to sure you have chosen a unique ID for your tape drive before installing
    it.


    Device files for tape drives contain the letters “st.”. If your tape is SCSI ID
    6, it will have two devices: st6 and nst6. The first is used if the device is
    rewinding and the second is it. Most tape drives are non-rewinding so you will
    need to refer to them as /dev/nst, when n is the device number.


    To test a new tape drive, you can use one of the backup programs included with
    Red Hat, or you can use the tar command to put files on the tape, then tar the
    files off again.


    # 20.4 UPS


    Until recently, few people thought of uninterruptible power supplies (UPSs) as
    peripherals for the reason that the computer and UPS did not exchange information
    or take action based on the state of one or the other. Now though, this is not
    the case. A few years ago, UPSs with serial ports appearing, along with snazzy
    GUI front-ends, allow the battery and power level to be monitored and for actions
    to be set up on conditions reported. However, only commercial OSes are supported.
    Some manufacturers have even published the language used to communicate with their
    UPS, allowing others to write their own programs for interacting with it.


    There are two ways UPSs can be categorized: by how they perform their function
    of providing uninterrupted power, and by the level of interaction they have with
    the computer to which they are attached. The first has three types: stand-by,
    in-line, and line-interactive.'
