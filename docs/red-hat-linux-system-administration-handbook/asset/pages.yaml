    These rules are explained below.


    # IP Accounting Rules


    The accounting rules for ipfwadm track numbers and types of packets that go out
    the TCP/IP interface. This can track incoming packets, outgoing packets, or both
    (which is the default). The rules for packet accounting are the same as building
    rules for about everything else, so let''s go through some of what it takes to
    build an ipfwadm command.


    ```

    /sbin/ipfwadm -A -P tcp -S 0.0.0.0/0 http -D 0.0.0.0/0

    ```


    The first -A indicates that we are building an accounting rule, and is about the
    only thing that differentiates this from a packet filtering rule. The -a indicates
    that we are going to append a rule at the end of the current set of rules. For
    accounting purposes, this doesn''t matter as much; however, when you start building
    complex filtering rules, this will matter more. For our example, this could just
    be replaced with -i for insert at the beginning of the list of rules. Next is
    -P tcp, which tells ipfwadm to pay attention to the TCP protocol instead of UDP,
    ICMP, or all protocols. Specifying the protocol is required when you''re filtering
    specific ports, and we''ll get to that in a minute. Next is the -S 0.0.0.0/0 http
    statement. This matches a source address of anything, but coming from the HTTP
    port. So, an incoming packet from port 80 would be caught by this rule, but not
    HTTP data on port 8080, or FTP or SMTP data. The destination is specified with
    the -D 0.0.0.0/0 statement, and as you can guess, this matches to any destination.
    Since this is on a machine acting as a router, any machine on the internal network
    that gets information from port 80 from any outside source will be caught by this
    rule.


    To take a look at the rulesets already finished, use the /sbin/ipfwadm -A -1 command
    as follows:


    ```

    [root@server mark]# /sbin/ipfwadm -A -1

    IP accounting rules

    pkts bytes dir source destination ports

    14 12756 i/o tcp anywhere anywhere http-> any

    [root@server mark]#

    ```


