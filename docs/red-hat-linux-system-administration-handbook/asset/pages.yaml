  md: '# 21.6 Summary


    When connecting a LAN to the Internet in a secure way, there are three items to
    consider:


    +   1. Selecting a private (i.e., non-routable) network.

    2. Connecting your firewall machine to the LAN and the Internet; in this example,
    via an on-demand dial-up line using PPP.

    3. Allowing certain machines on your LAN access to the Internet and possibly disallowing
    access from various external machines or networks.'
