    matches the first rule, and the session is connected. Any connection from another
    host (say 192.168.2.10) will not match the first rule, but will match the second
    rule. Since the second rule says to reject the packets, the connection is denied.


    # Masquerade Rules


    Masquerading under Linux allows a single router to act as a many-to-one connection.
    In locations where a single IP address is available to connect to the Internet,
    masquerading allows a Linux machine to share that one IP address with a network.
    The hosts inside the network do not need any additional software (aside from the
    TCP/IP stack) and can share all the single connection to the Internet.


    This is very to configure under Linux. To get this working, you need to have a
    machine with two interfaces on it – one going to the Internet and the other going
    to a local Ethernet containing the hosts you want to masquerade. You will also
    need to have the machine set up as a router. Make sure this is all set in netfilter.conf.


    Then you''ll want two commands:


    ```

    /sbin/ipfwadm -F -p p deny

    /sbin/ipfwadm -F a m -S 192.168.1.0/24 -D 0.0.0.0/0

    ```


    These tell ipfwadm to masquerade packets from 192.168.1.0 going to anywhere. Packets
    that get out the return IP address of the Linux machine that is running the masque
    are tracked using some UDP and TCP information, and as a result, you may have
    to load some kernel modules for programs like FTP, Quake, IRC, and Real-Audio.
    These modules are already compiled on Red Hat and are located in /lib/modules/preferred/ipv4.
    These modules will be known because they’re prefaced with “ip-masq”, as in ip_masq_ftp.


    Once you have the Linux machine configured, set a client to use the Linux machine
    as its default gateway, and start generating some traffic on the Internet.


    5 Such as modem dial-ups or some cable modems.'
