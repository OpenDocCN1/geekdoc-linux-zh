    tions for accomplishing various tasks, a proficient enough C programmer can write
    a program to do it just as fast, if not faster.


    The reason people use higher-level (often interpreted) languages is that the development
    time for applications is much shorter. For the smaller tasks often addressed by
    high-level languages, the performance trade-off is more than acceptable. It is
    also very easy to write a program and test it out. Since the programs written
    in Perl or Python are small, there are a few requirements for building makefiles
    or waiting for code to compile. You can write and test in seconds. This is not
    to say that larger applications can''t be written in an interpreted language.
