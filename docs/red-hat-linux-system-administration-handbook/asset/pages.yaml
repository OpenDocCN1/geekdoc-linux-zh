  md: '# # Applications 11

    for Linux


    Linux can be more than just a server—there are a growing number of desktop applications
    for it as well


    This chapter is a survey of the more popular applications for Linux. These applications
    run the gamut from integrated office suites to symbolic math programs to emulators
    for running software from other operating systems.


    # 11.1 Office Products, Word Processors, and Editors


    In this category fall the multitude of office suites, standalone word processors,
    spreadsheets, editors, and publishing tools.


    # Applixware


    Made by Applix, Inc. (http://www.apprix.com/), Appixware is probably the most
    complete and tightly integrated office suite available for Linux. It is still
    not as slick as similar products from Corel, Claris, or Microsoft, but it is making
    strides toward that goal.'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'Applware is invoked by typing applix at a shell prompt. This brings up the
    main window (Figure 11–1), from which you can start Words (a full-featured word
    processor), Graphics (a drawing tool), Spreadsheets (a spreadsheet-program), Presents
