    all the time. In case you''re interested in what''s currently in the queue,

    mailq command will list what sendmail has. The mailq program will also list

    t reason why an email message is stuck in the queue. If there is a lot of

    email in the queue, you may have a network or configuration problem.


    You can verify that sendmail is running by connecting to TCP port 25.


    ```

    [markk@wayga ~ ]# telnet localhost 25.0

    Trying 127.0.0.1...

    Connected to localhost.

    Escape character is ''^''

    220 wayga.net SMTP Sendmail 8.7.6/8.7.3; Fri, 18 Apr 1997 00:26:18 -

    0400

    ```


    As you see, the connection works, and there is a bit of information

    out about the host we connected to: status, hostname, type of SMTP

    (Extended SMTP), the Sendmail program (instead of qmail or the like) ver-

    sion 8.7.6, and the current time and date that the computer thinks it.


    The configuration options for sendmail are typically located in /etc/send-

    mail.cf. Examine the file if you like, but don''t change anything unless you

    know what you''re doing! Small changes can render your email system use-

    less. As always, back up files that you want to edit, just in case.


    A few options you may want to note:


    +   - OA—Can set another file that contains aliases. We''ll get into this with

    ajomain.

    - Mlocal—Specifies what program will act as the Mail Delivery Agent

    (MDA). This can be something like /bin/mail or /usr/bin/procmail

    (we''ll get to this later, too).

    - DS—Contains a pointer to a “smart” relay host. If you have a very slow

    connection to the Internet or don''t have DNS set up, you can specify

    another machine to accept all your email and deliver it for you. For dial-\dup
    links, you only have to send the email once, and a machine that is

    permanently connected to the Internet can hold it in its queue.

    - Cw—This option works if you have one Internet host that has multiple

    names (for example, wayga.net and ratatosk.org). This entry will

    allow you to specify which hosts you will receive email as.'
