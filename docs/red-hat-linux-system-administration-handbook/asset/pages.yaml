    To correct these errors, new values must be provided for the hard disk and control-loader.
    In the example, the 4GB hard disk shown above has 64 heads, 32 sectors, and 4095
    cylinders, for a total capacity of 64*32*4095 bytes = 4095MB.


    If you set the number of heads to 255 and the number of sectors to 63 (a hint
    that this value is correct in the error messages shown above), the partition must
    still be 4095MB. So, if 255*63*cylinders = 4095MB, then the number of cylinders
    will be 522.


    These new values must be entered in fdisk in the expert mode with the x command,
    and then you enter the new parameters for the heads, sectors, and cylinders. In
    expert mode, the commands c (cylinders), h (heads), and s (sectors) can be used.
    According to the calculation above, these values should be 255 heads and 63 sectors.


    Note that if you are using DOS on your system, never enter a head count of 256.
    This value will cause DOS to crash without comment.


    Below is how the screen looks like as you enter these new values in fdisk.


    ```

    Expert command (m for help): h Number of heads (1-256): 255

    Expert command (m for help): s Number of sectors (1-63): 63

    Warning: Setting sector offset for DOS compatibility

    Expert command (m for help): c Number of cylinders (1-65535): 522

    ```'
