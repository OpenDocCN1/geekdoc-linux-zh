  md: '# Setting Up FTP Services 10


    Virtual, anonymous, and more


    The File Transfer Protocol (FTP) is one of the most frequently used services available
    on the Internet. Setting up an anonymous FTP server is fairly straightforward.
    Other services, like virtual FTP hosts and FTP-only accounts, are a little more
    tricky.


    # 10.1 FTP under Red Hat Linux


    Along with telnet-like applications, FTP is one of the most basic TCP/IP services.
    Red Hat Linux comes with a clone of the standard FTP UNIX command-line FTP client,
    as well as the more full-featured nftpd. The default FTP daemon under Red Hat
    is wu-ftpd.


    We will cover the setup and configuration of wu-ftpd for anonymous and user access,
    as well as the setup of virtual FTP servers. Next we''ll talk about setting up
    these services with two other FTP daemons: ProFTPD and Bero-'
