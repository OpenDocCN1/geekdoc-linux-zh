    # 3.6 Red Hat Rescue Diskette


    For a proper Red Hat installation, you should have four diskettes. Two for install
    (only one disk may be needed), one for the emergency kernel that gets created
    after installation, and one for the rescue floppy. Using the rescue floppy and
    the first installation diskette (labeled boot), you can have a Linux system up
    and running using only the two floppy diskettes. The purpose of this is that it
    helps you determine where a problem is and fix it without using the hard drive,
    in case that''s your problem. For example, if your root partition fails, you won''t
    be able to use the emergency diskette to boot. But, if you have the boot floppy
    and rescue disk, you can start the system up and use fsck (which is on the rescue
    disk) to fix the problem.


    Making the rescue diskette is as easy as making boot diskettes. Just enter:


    ```

    dd if=rescue.img of=/dev/fd0

    ```


    assuming rescue.img is in the current working directory. Then, use the boot diskette
    to start the system. Type in rescue at LILO prompt. You''ll get prompted to insert
    the rescue disk and the system will start.


    # 3.7 System Shutdown


    Shutting Linux down is somewhat easier than starting it, since all you need to
    do is kill all the available processes and tell the kernel to stop or reboot the
    system.


    > If your CD-ROM and BIOS support booting from CD-ROM, you can skip it and just
    boot from the CD-ROM. You can boot rescue from the CD-ROM as well.'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'There are a few ways to shut the system down, depending on how and when you
    want it to happen. The safest way is the following:


    ```

    sync;sync;sync; /sbin/halt

    ```


    The three sync commands tell the system to sync up the internal hard drive cache
    and the hard drive itself. Anything that has to get written to the hard drive
    gets done at this time. Why three sync commands? There are varying reasons, but
    the simplest one is by the time the last sync is done, the buffers have had time
    to clear.


    There are a few other methods of telling the machine to halt, including kill -9
    and telinit 0. In typical UNIX fashion, more than one command will work. Red Hat
    also provides for shutdown using the linux interface. You can read more about
    linuxconf in the next chapter.


    If you choose to reboot the system, you can replace halt with reboot or telinit
    6.


    All of the above commands are for shutting the system immediately. If you choose
    to have a planned shutdown and want to give users time to finish their work and
    log out in an orderly fashion, you''ll want to use the shutdown-command.


    # Shutdown Command


    When shutdown is run, the following options are available:


    +   - -r—Reboot after shutdown.

    - -h—Halt after shutdown.

    - -c—Cancel an already running shutdown.

    - time—When to shut down, either +minutes or hh:mm for an absolute time. You can
    also use it now, which requires a value of +0.

    - message—Warning message to send to all users.


    Once shutdown is started, only root can log in until the machine is rebooted or
    the shutdown is canceled.


    Shutdown is a nice front-end to the init process, since once shutdown has determined
    it''s time to shut down, it sends a signal to init to change to Runlevel 6 or
    0.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# 3.8 Keeping PC Safe from Reboots


    # The powered Daemon


    If you have a UPS that works with Linux, then you may have the power monitor daemon
    (powerd) installed. If the power goes off and the UPS activates, it will trigger
    a safe shutdown in two minutes. However, if the power comes back on during those
    two minutes, the shutdown will cancel.


    You can get a copy of powerd from contrib.redhat.com. It works with a wide variety
    of UPSes that have serial outputs. You can also enable network support so if you
    have multiple machines connected to one UPS, they can all shut down in an orderly
    manner.


    # CTRL+ALT+DELETE


    Yes, the "three-finger salute"—CTRL+ALT+DELETE—will shut down Linux as well, in
    a pinch. The init process is watching for this and will shut the machine down
    if it receives this signal. The default setting is to run the reboot command immediately.


    If you''re in a common lab area and don''t just want to be able to reboot a machine
    on a whim, you''re all set. Unfortunately, this doesn''t prevent malicious people
    from hitting the power switch or pressing the reset button. The next section shows
    how to disable rebooting via CTRL+ALT+DELETE.


    # 3.8 Keeping a PC Safe from Reboots


    During a reboot, a Linux box has very low security. If you''re trying to keep
    a PC safe, the standard architecture makes it very hard to do. The PC can boot
    an OS (DOS) that can fit on a floppy, plus contain enough programs on it to completely
    run a hard drive. A virus can infect the MBR of a hard drive, which is what Linux
    needs to boot, or a user can bring their own Linux floppy to get root access,
    mount the hard drive, and start editing the /etc/passwd file.


    Additionally, the chance of users hitting the power switch or reset button is
    always a factor. Running any kind of program remotely on a publicly accessible
    system is not a good idea, as the system can go down at any time. Here are a few
    suggestions for keeping a publicly available Linux machine for X86 safe.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Chapter 3 • Linux Boot and Shutdown


    +   1. Protect the Basic Input/Output System (BIOS)—This is the first thing you
    need to do, as many of the other protections depend on this. Password-protect
    access to the BIOS. Most modern ones will allow this. Also, be sure that no one
    can open the case. Locks are available for many cases. In the event that you forget
    the password, you can disconnect the on-board battery or make a jumper connection
    on the motherboard and the BIOS will be set to its default values.


    +   2. Prevent booting from the floppy drive—Many BIOSES allow you to specify
    that only the hard drive can be booted first, forcing the computer to go into
    Linux or another OS without checking the floppy drive. This will not only prevent
    booting into DOS, but also prevent a boot sector virus or two from infecting the
    hard drive.


    +   3. Use Linux only—Booting into DOS or Windows can cause trouble, especially
    if someone intends to harm a computer. Booting into Linux will minimize this risk,
    since they cannot run any DOS programs.


    +   4. Don''t use LILO unless you have to—LILO can boot off another device if
    you tell to (and if you have a Linux boot disk). Putting the Linux kernel on the
    MBR of the first hard drive can help prevent other OSes from being loaded inadvertently.


    +   5. If necessary, disconnect the reset and power switches—This may force you
    to have people nearby who can power-cycle in the event of a crash.


    +   6. Don''t give out the root password—This goes without saying, but just in
    case . . . it''s been said.


    +   7. Be on guard—These steps will not make your computer bulletproof, but they
    should help prevent major damage to Linux systems.


    +   8. Disable CTRL+ALT+DELETE in /etc/inittab—The line you''ll want to look for
    is probably similar to this:


    ```

    ca::ctrlaltdel:/sbin/shutdown -t3 -r now

    ```


    Once you have your machine secure against reboots, you can set the machine up
    in a lab for public use.


    > If this is the case, you should also take DOSEMU off the Linux system.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# 3.9 Summary


    In this chapter, we covered the following:


    +   * LILO is used to start up the kernel. There are a few different ways to install
    it on your hard drive.

    * The kernel, on bootup, displays a number of messages regarding the drivers and
    devices it finds.

    * Back up your system often, and keep emergency diskettes handy in case of any
    problems.

    * The init process is Process 1 (PID=1). Killing it will reboot your Linux machine.

    * Even though the X86 architecture is not very security-conscious, there are steps
    you can take to secure a Linux setup.

    * Killing the init process is the same as telling Linux to shut down.'
