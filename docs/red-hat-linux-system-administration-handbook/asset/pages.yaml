  md: '# 15.6 User Programs


    The default X setup has a bunch of user programs, including shells, utilities,
    and a couple of games. These programs all have a few default options that you
    can set when you first start them. We''ll show this by introducing xterm, which
    is the X terminal emulator. It is almost the same as logging into the shell. The
    big difference is that the .login file is not read, but .xshrc is instead.


    Here are a few of the common options you can use with almost all X programs:


    ```

    -display <host>:<display>

    ```


    ends the display (not just the output) to the named host and display number. In
    most cases, the display can be 0.0, which means the first X server and the first
    display on the X server still gets executed on the remote CPU, but the window
    gets displayed elsewhere. This setting will override the DISPLAY environment variable
    if it''s set. If the DISPLAY variable is set and the -display option is not used,
    the window will automatically be displayed on the host and the display set in
    DISPLAY.


    ```

    -bg <color>

    ```


    sets the background color of the window. The color setting can either be a name
    of a color (grey or blue) or a collection of RGB (red, green, blue) values in
    hex. The syntax for this is rgb:h/h/h, where h is a number relating to the amount
    of red (in the first slot), green (in the second slot), and blue (in the third
    slot) needed to make a particular color. The hex number can be one to four characters
    long, depending on the number of colors your server supports. For example, rgb:0/0/0
    is black, while rgb:ffff/0/0 is red. A list of colors that has names is available
    in the /usrX11/lib/x11/rgb.txt file. Each entry has the RGB values in decimal
    (0 to 255) and a name, which can be used instead of the rgb:h/h/h entry.


    ```

    -fg <color>

    ```


    sets the color of the foreground.


    ```

    -fn <font>

    ```


    specifies the default font to use in the window. You can get lists of available
    fonts using the xfontsel or xlsfonts programs.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# 15.6 User Programs


    -geometry <WIDTH>x<HEIGHT>+<XOFF>+<YOFF>


    sets the size and position of the window. For xterm, this is in terms of characters,
    so is a geometry of:


    ```

    > xterm -geometry 80x25

    ```


    would create a window that is 80 characters wide and 25 lines long. XOFF and YOFF
    set where the upper-hand corner of the window should be placed. In the case of
    a positive XOFF or YOFF, the offset is from the left or top side, respectively.
    For a negative XOFF or YOFF, the offset is from the right or bottom side, respectively.
    Here are some example screen placements:


    +   +0+0 Upper left-hand corner.

    -0+0Upper right-hand corner.

    -0-0Lower right-hand corner.

    +0-0Lower left-hand corner.


    Note that you can enter either a geometry or an offset, but you can''t enter only
    XOFF or a width by itself. Both the geometry and the offset must be entered as
    a pair. That is, you can''t enter:


    ```

    > xterm -geometry 80

    ```


    or


    ```

    > xterm -geometry +0

    ```


    but the following will work:


    ```

    > xterm -geometry 80x25

    ```


    or


    ```

    > xterm -geometry +0+0

    ```


    There''s one other way to specify default settings for X programs, and this is
    through the .xdefaults file. Anything you can set through the command line can
    be stored in the .xdefaults file, so when you start the program, you don''t need
    to give all the options. These options are known as resources.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# 15.7 X Resources


    An X resource can consist of four item types:


    program.widget[.widget..].resource: value


    where:


    +   * program—Program name.

    * widget—One or more levels of widgets, which are sub-portions of the window.
    A widget can be a button, menu, scrollbar, option list, and so on.

    * resource—The “least denominator” of the widgets. The resource may be used by
    more than one program. For example, geometry is used by all X programs and is
    a resource.

    * value—What the resource gets set to. Can be a number, Boolean (true or false),
    color, or some other value. It depends on the resource.


    Any text from an exclamation point (!) to the end of the line is commented out.


    To get from the most-specific widget (program) to the least specific widget (resource),
    the widgets must be combined. These combinations can be specified by either a
    period (.) or a star (*). A period indicates a tight binding, and a star (asterisk)
    represents a loose binding.


    In a loose binding, the link between two widgets does not have to be direct, and
    it almost looks like a regular expression in grep. That is, you can have an entry
    such as:


    ```

    *geometry: 80x25

    ```


    This says that all geometry settings will be 80x25. While this is good for text-based
    programs, a graphical application with a setting of 80x25 pixels would be rather
    small indeed.


    If you have a particular program, you can then become more specific. That is,
    if you want all programs that use the vt100 widget to have a geometry of 80x25,
    you can make the setting like this:


    ```

    *vt100.geometry: 80x25

    ```'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# 15.8 X Applications


    And you can get even more specific. Say that you want your terminal emulators
    to have a size of 80x25, and you want your Seyon^2 emulator to have a size of
    80x40. Then you will have two sets of:


    ```

    xterm.vt100.geometry: 80x25

    Seyon.vt100.geometry: 80x40

    ```


    Here you have tight bindings. The Seyon program uses the vt100 widget, which sets
    the geometry. Using a loose binding for Seyon as follows:


    ```

    Seyon*geometry: 80x40

    ```


    would cause all of the windows that seyon creates to be 80x40. This would bring
    us back to having graphical windows that are 80 pixels by 40 pixels.


    Note that you can replace tight bindings with loose bindings. The followings two
    examples have identical effects:


    ```

    xterm.vt100.geometry: 80x40

    Seyon.vt100*geometry: 80x40

    ```


    Here are a few sample examples that apply to xterm:


    ```

    xterm*scrollBar: true ! -- Turn the scroll bar on the left side

    xterm*geometry: 80x25 ! -- Set the size to 80x25

    xterm*background: gray68 ! -- Gray background

    xterm*foreground: black ! -- Black characters

    ```


    # 15.8 X Applications


    With xterm and Seyon, there are a number of other client programs that you can
    run. Almost all X programs use the -display, -geometry, and -background commands,
    plus some extra options. Note while these options override the settings in the
    .Xdefaults file, it is really up to the window manager to make the settings. These
    options (and the settings in .xdefaults) are really suggestions to the window
    manager. The window manager often allows to ignore the requests, but there may
    be a case where the window manager does its own thing.


    +   -fg <color> or -foreground <color>Foreground color.


    > 2 Seyon is a terminal emulator.'
