  md: '# 12.1 MySQL and mSQL


    probably the best place to ask for help. Information about it can be found in
    the FAQ at the MySQL home page or any of its mirrors.


    Once you have MySQL compiled, you can run the optional make check and then proceed
    to running the make install. This will install MySQL in subdirectories of your
    install base as follows: binaries in bin/, libraries in lib/, mysql, header files
    in include/mysql, and the data area will be in var/.


    # Installing from a Binary Distribution


    Unpack the tarball where you want the mysql directory to be created. It will create
    a directory named mysql-version info-><platform info>; you can then create a link
    using ln it or just rename it to mysql. The MySQL binaries will now be in /usr/local/mysql/bin,
    libraries in /usr/local/mysql/lib, header files in /usr/local/mysql/include, and
    /usr/local/mysql/data will be the home of the data files and subdirectories.


    # Setting up the Grants Database and Other Data Files


    The next step in our installation is to set up the grants database. Unless you''ve
    done some fiddling with the installation, you should be able to run it and let
    it do its thing. What it sets up is tables for access control for users. These
    users do not need to be system users, they do not need /etc/password entries.


    The name of the grants database is simply mysql. It has three tables: db, host,
    and user. The db table lists access for the combination of user, database, and
    host from which the user is connecting, host controls access for the pairing of
    host and database. Finally, user combines host, user, and password.


    To initialize the mysql database, you need to run mysql_install_db. If you used
    a binary distribution, run the following command in the directory created when
    you unpacked the archive type:


    ```

    scripts/mysql_install_db

    ```


    If you compiled from source, run the above command in the top level of the source
    tree. This will set up root as a "superuser" when connecting locally, allow remote
    users, and force other local users to be granted access on a per-data-base level
    in the db table. It will also set up db to allow access to the test database,
    or any database starting with test_ to any user. It will start the MySQL daemon,
    mysqld, for the first time as well.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Chapter 12 • Linux Database Software


    Since the grants database is probably the most complex aspect of using MySQL,
    we''ll give a few examples here. There are a few things to remember when manipulating
    the access tables:


    +   * Passwords are stored encrypted.

    * The tables are sorted, putting wildcard and " " entries last. The first match
    is then used. Host table is sorted first, then user, and last, for the db table.

    * The host table is only consulted if the host field in the user table is " “.
    The privileges that are listed by the user table are logically ANDed with those
    in the host table.

    * The results of the previous step are ORed (once again in the logical sense)
    with the user table.

    * If there is no matching entry in db, the matching entry from host is ANDed with
    the matching user entry.


    To start manipulating the mysql database, as root, enter:


    ```

    mysql mysql

    ```


    If you installed from a binary distribution, you will likely have to specify the
    path to the mysql binary.

    The following set of entries will lock out all local users that don''t otherwise
    have an entry for a particular database in db:


    INSERT INTO user VALUES

    (''localhost'','''','''','''',''N'', ''N'', ''N'', ''N'', ''N'', ''N'', ''N'',
    ''N'');

    INSERT INTO user VALUES

    (''myhost'','''','''',''N'', ''N'', ''N'', ''N'', ''N'', ''N'', ''N'', ''N'');

    INSERT INTO host VALUES (''localhost'',''%'',''Y'', ''Y'', ''Y'', ''Y'', ''Y'',
    ''Y'', ''Y'');

    INSERT INTO host VALUES (''myhost'',''%'',''Y'', ''Y'', ''Y'', ''Y'', ''Y'', ''Y'',
    ''Y'');


    In the above and following examples, myhost stands for the name of the computer
    where mysql is running.

    Now, to grant the user cary full access to the database notebooks, we would add
    this row to the db table:


    ```

    INSERT INTO db VALUES

    (''%'',''notebooks'',''cary'', ''Y'', ''Y'', ''Y'', ''Y'', ''Y'');

    ```


    If we wanted to give all other users access to the data in notebooks, but not
    let them modify the table:'
