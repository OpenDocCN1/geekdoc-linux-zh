    # 2.6 Upgrading Red Hat Linux


    Linux and Red Hat distributions are continually evolving. This is driven by the
    need for new features, bug fixes, support for new hardware, and new software-integration.


    Red Hat releases a new version of its distribution about every six months. Between
    releases they provide updates and bug fixes. You can find these on their Web site
    or mirror in the updates/subdirectory of the distribution directory for the version
    of Red Hat you are currently using.


    Installing these intermediate upgrades is a matter of using RPM to install or
    upgrade the packages. Typically, you would use a command like this:


    ```

    # rpm -U <package name>.rpm

    ```


    If you have a number of packages you want to upgrade all at once, you can process
    them with:


    +   - rpm -U *.rpm


    RPM should install packages in the correct order to comply with any dependencies.
    You may still run into dependency problems, especially if you have some libraries
    in non-standard locations. You can use --nodeps --force to override dependency
    checking if you are sure the package should install and work regardless of problems
    RPM is reporting.'
