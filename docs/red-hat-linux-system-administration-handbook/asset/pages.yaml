    # ## ''config'' Metadata


    This file is only present if you installed from RPM. It contains definitions for
    a number of variables used by the startup script installed at /etc/rc.d/init.d/atalk.


    One of the variables you are likely to want to change is the maximum number of
    simultaneous connections, AFPD_MAX_CLIENTS. The default is 5, unless you have
    a very small network, which will be too small. Other options you might want to
    change enabling the guest account, setting its username, and choosing which daemons
    to run. If you do not want to share your print queues, set PAPD_RUN to No. Similarly,
    if you do not want to share any filesystems, set PAPD_RUN to No.


    Note that some of the options in config are not actually supported yet and therefore
    shouldn''t be turned on.


    # Hardware Considerations


    There are few hardware caveats related to Ethernet cards. Netatalk doesn''t function
    on cards based on DEC''s Tulip chip, though it appears that activating the interface
    in promiscuous mode has been reported to fix this problem. Also, the driver for
    your card must support multicasting; check the Ethernet HOWTO to determine if
    your card''s driver does.


    Aside from these functional considerations, the best hardware investment is a
    good, fast disk. Spend the extra money to buy a faster disk and/or faster disk
    controller.'
