  md: '# 19.5 Backup Strategies


    How often you make what kind of backup depends on several factors, including:


    +   * The capacity and speed of your backup device, which are particularly important
    characteristics for unattended backup.


    * How active are your filesystems. The number of files that change per day or
    week. Most likely, this will vary from partition to partition.


    * Whether or not you can make live backups.


    * If you can''t make live backups, how much downtime is acceptable and when is
    it least inconvenient.


    In general, if more than twenty percent of a particular filesystem is changing
    daily, you should perform incremental backups every day or two, a lower-level
    backup weekly, and a full backup monthly. Lower activity levels mean you can space
    this out more, though there''s no excuse for not performing a full backup once
    a month.


    Another method (if you have enough tape drives) is to perform a full backup every
    night. Keep 28 tapes so that you have a total of four weeks worth of data at any
    one time. In the event of a bug that corrupts data going back a few days (or a
    particular backup getting corrupted), you can restore a tape from a days before.
    Then, cycle tapes every six months or so. Since heavy use of tapes can cause them
    to deteriorate, you''ll want to replace the tapes with new ones well before this
    point. This allows you to store information for an indefinite amount of time.
    This is at a higher cost, however, since you have to buy a lot of tapes and you
    may not have enough storage on the tapes; it''s one of the best and easiest ways
    to backup and restore your data.


    Buy lots of whatever your backup media is; it''s cheaper than having to pay the
    office for a day of working a second time.


    For very active systems which more or less can be taken off except at 3 AM on
    a Sunday, it would be wise to invest in a backup utility that can perform live
    backups during periods of low traffic. You should be able to perform unattended,
    incremental backups, and depending on your capacity and amount of data, unattended
    full backups.


    More complicated databases are typically problematic when it comes to live backups.
    Usually, your backup utility cannot make a proper snapshot from the database''s
    point of view. Fortunately, most databases can create a snapshot of themselves,
    and that can be placed in your archive. Failing this, the database will have to
    be taken off-line before being backed up.'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'You will probably want to keep some backups off-site in case of a big disaster
    (flood, UFO crashing into your office, dinosaur rampage, etc.). You may have to
    buy a new system, but at least you''ll have what is likely hundreds, if not thousands,
    of hours of work saved.


    # 19.6 RAID and Disk Mirroring


    These are other techniques for protecting the integrity of your data. RAID stands
    for Redundant Array of Inexpensive Disks. It is a fairly new concept, having been
    introduced in 1987 at the University of California, Berkeley.


    The basic idea behind RAID is that by using multiple disks (as opposed to a few
    large disks) and possibly additional “parity” data, you will be able to reconstruct
    data loss when one of the disks fails instead losing a few gigabytes (albeit temporarily,
    assuming that you have a backup).


    There are several different levels of RAID, cleverly numbered from 0 to 5. Their
    features are given below. Only levels 1, 4, and 5 are available for Linux, and
    only in software (as opposed to a hardware-level implementation).


    +   0 Data striping—This doesn''t actually provide any protection against data
    loss, but enhances performance. Requires a controller that supports synchronized
    disks; none are available for Linux.


    +   1 Disk mirroring—A second set of disks is used to provide a complete copy
    of your data. An expensive option, since you need twice as many disks.


    +   2 Level 0 with a check disk for storing error correction information. Poor
    performance has made this option unpopular.


    +   3 Level 0 with a separate disk for byte-level parity information to help reconstruct
    data loss. If the parity disk is lost, you lose all data integrity. Synchronized
    disks help boost performance despite the bottleneck of the single-parity disk.


    +   4 Level 3 with block-level parity information stored on a separate disk. Better
    read performance, but worse write performance than level 3. Since synchronized
    disks aren''t used, it can be implemented in software.


    +   5 Level 4 with the parity information spread over the disks as well. Higher
    performance, since a separate parity disk is no longer a potential bottleneck.
    Write performance is still not as good as for level 3.'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'To implement RAID on your Linux box, you need a kernel patch from http://www.linuxhq.com/patch/20-p0632.html
    and a 2.0.30 kernel.

    The patch is still in beta and supports RAID levels 1, 4, and 5.

    nSeparately available, raidtools-0.3 can be used to create or repair a set of
    RAID disks.


    # 19.7 Summary


    A variety of backup and restore tools were discussed in this chapter, ranging
    from simple ones that ship with every Linux distribution to commercial ones with
    enhanced functionality and interfaces.


    In general, for sites where short amounts of down-time are acceptable, the built-in
    tools are fine. For “hot” backups, you will probably have to resort to commercial
    means.'
