  md: '138  Chapter 7 • Printing and Print Sharing


    To print from Linux to a Windows machine, the procedure is a bit different. Red
    Hat allows you (via the printtool) to add a printer that is connected via Server
    Message Block (SMB), and the printtool takes care of the rest. The Windows machine
    picks up the print job and sends it off to the printer.


    Windows NT can also handle the LPD protocol, so you may want to use it instead.


    # 7.6 Managing Print Queues


    Now that the printer is connected and working, people are going to try printing
    data to it. At this point, it''s time to put on the “print master” and get to
    work.


    Print queues are FIFO (First In First Out), so the first one in line gets to access
    to the printer. If one job gets stuck, or the printer runs out of paper, the queue
    will begin to fill and you deounded by users desperately trying to find their
    printouts. Not to worry.


    The commands you''ll want to know about are lpc, lrm, and lq. The lpc command
    shows what''s in the queue and gives the current status of the printer, as well
    as lpc can figure that information out. Some printers will be able to tell lpd
    they are out of paper or that the connection is down, and these errors will show
    up in the lq listing.


    The lrm command will remove jobs from the queue. Only root and the person who
    submitted the print job can remove a job from the queue. If an accidental print
    job is 3MB in size and is currently tying out the queue, it is best to remove
    it. As root, you can remove all jobs owned by a particular user with the command
    lrm user.


    The lpc command is the “lpc control.” It can activate and deactivate queues and
    printers, rearrange jobs in the queue, and get a status of any printer listed
    in /etc/printcap (to paraphrase the man page).


    lpc can run interactively, and you can put commands directly on the lpc command
    line. Here''s a list of the most important lpc commands:


    +   - disable { all|printer }Disables the named printer. New jobs cannotnot be
    added, but printing will continue.

    - down { all|printer }Disables the named printer completely. No new jobs can be
    added, and printing stops.

    - enable { all|printer }New jobs can be added to the queue (reverse of disable).'
