    # Facilities and Priorities


    The facility/priority combination you list will report all the messages that get
    sent to syslog for that priority and higher. A priority of debug will report all
    messages, and a priority of none will not report messages. Replacing either the
    facility or priority with an asterisk (*) will report for all facilities or all
    priorities, depending on where you put the asterisk (before or after the period).
    You can combine multiple facilities with one priority by separating them with
    a comma. The syslog Linux uses a few extensions that are not in the original BSD
    version of syslog. Putting an equal sign (=) in front of a priority says to report
    only this priority in a list. Putting an exclamation point (!) says to ignore
    that priority and all higher priorities. Combining the two (!=) would ignore only
    priority.


    The man pages for the particular programs you want to monitor will list what facilities
    the program uses. Note that there are eight user-defined facilities you can use
    in your programs or other scripts.


    # Actions


    The second field lists where a message should be sent. This can be a file (if
    the destination starts with a /), a remote host (if the destination starts with
    an @), all logged-in users (if the destination is an *), or a specific user (if
    it starts with none of the above three characters). The file destination can also
    be a tty file, such as /dev/console, which will send the message to the Linux
    console. You can also use the | character to pipe the message to an external command
    or FIFO.


    Using remote host logging can centralize a group of computers to log all their
    messages to one machine. However, if the system experiences a severe problem (the
    Ethernet card goes bad, the kernel panics, etc.), the message'
