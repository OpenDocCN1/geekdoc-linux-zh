    4. Install the binary RPM (cd /usr/src/redhat/RPMS/i386 ; rpm -UHV file-2.1.rpm).

    5. Uninstall the source RPM (cd /usr/src/redhat/SPECS ; rpm rmsource file-2.1.spec).

