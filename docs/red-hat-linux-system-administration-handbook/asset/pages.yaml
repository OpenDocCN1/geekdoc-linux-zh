    # 9.3 MIME


    When SMTP was first designed, it would handle only 7-bit (plain ASCII) data. Hence
    the "Simple" in the protocol name. With things like JPEG images, sound files,
    application data, and compressed files to be sent via email, there had to be some
    way of sending binary (8-bit) data through a 7-bit stream. The first method of
    handling this was via the uencode program. This program would turn two bytes of
    8-bit data into three bytes of 7-bit data. The file size was two-thirds larger,
    but it would now squeeze through the 7-bit path that SMTP provided. Another problem
    in addition to the file size was that the remote side had to decode the data (uldecode).
    This turned into a tedious procedure, the sender encoding the data and manually
    including it in a mail file and the receiver trying to strip it.


    In the early 1990s, the Multipurpose Internet Mail Extension (MIME) was developed
    to do this, and it is used today on the Web for determining file types. MIME encoded
    each data type such that any MIME-capable mail reader would understand what kind
    of data was in the message. Once a file type was detected, each individual user
    could have a file type (.mailcap) that would list what file types you know about,
    and what application to run you found that file type. For example, if a JPEG image
    were sent, the receiving side might start up the xv program and display the image
    in an X window. Another user might have set up so the image was converted into
    PostScript and sent directly to the printer.³ Most mail clients today have the
    ability to handle MIME mail, and there should be little to no interaction that
    you as an administrator have to worry about.


