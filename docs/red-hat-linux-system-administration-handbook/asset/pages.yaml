  md: '# Samba 8


    # How to let your Linux machine serve files and printers to Windows machines


    SMB (Server Message Block) is the primary file and print sharing protocol for
    MS-Windows-based machines. Linux can provide services to and receive services
    from SMB-based machines.


    The other printing and print option is called Samba, developed mainly by some
    nice folks in Australia. TCP/IP and SMB work quite nicely together. In fact, they
    work so well one could piggyback a packet of SMB data onto a TCP/IP packet. 1
    This relationship is one that Samba uses to get Windows machines to talk to Linux.
    The latest version of Samba can be found at http://www.samba.org/.


    Let''s quickly go through a small network.


    > 1Which itself is piggybacked onto Ethernet, FDDI, ATM, PPP, or what-have-you.'
