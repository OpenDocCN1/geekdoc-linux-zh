    on Solaris or Linux (even NT) with only minor changes.


    One of the first projects I worked on involved Remedy, our call tracking software.
    One feature I wanted to add was the ability to have E-mail that comes in or out
    to be automatically added to a customer''s call. This involves a few steps:


    +   1. Make sure the Subject: line for a call has a four-digit number.

    2. Extract that four-digit number.

    3. Take the body of the message and the sender and add them to the call.


    The first two items are actually easy, since Perl was designed as a more powerful
    version of awk, the pattern-matching program. Searching the Internet produced
    a group of people who gave a Perl interface to Remedy. This interface allowed
    me to log in to the Remedy server, modify the database to add the new entry, and
    then log out. The total size of the program was under 100 lines of code, and most
    of it was re-used from a sample program that came with the interface.


    Another project was to monitor our phone system and make a listing every day of
    the number of incoming calls and the average length of each call. Someone else
    wrote a program to get the information and dump it in a file. All I had to open
    the file, read until I hit a certain day''s records, and then add up the times.
    Since Perl is for string manipulation, I can pull out the hours, minutes, and
    seconds of a call, convert them to seconds, and then build a total number of incoming
    calls for the day. I can then divide that by the number of calls, divide again
    to get hours, minutes, and seconds, and dump that into another file. If you add
    a cron process to do this every night right after midnight, there''s the program.


