- img_proc: true
  md: 'The following pages include descriptions of a simple masquerading firewall,
    with some minor protection from in-depth information is required, read the ipfwadm
    pages and perhaps one of the many books dedicated to firewalls. Most books will
    not discuss ipfwadm specifically, but will give theories that can be applied to
    your Linux box.


    Below is a sample /etc/rc.d/rc.firewall. As with dial, you should call it from
    rc.local upon boot-time.


    ```

    #!/bin/sh


    PATH=/sbin:/bin:/usr/sbin:/usr/bin


    #

    # /etc/rc.d/rc.firewall, define the firewall configuration,

    # invoked from rc.local.

    #


    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MY_ETH0=192.168.1.1

    MY_NET=192.168.1.0

    MY_STATIC=111.222.333.444


    # Forwarding rules

    # first flush any old rules from memory

    ipchains -F forward

    # then set a default policy to deny everything

    ipchains -P forward -j reject

    # lastly, we want to masquerade the IPs from MY_NET (eth0) to

    # the ppp0 interface, (but we need to stop at the s10

    # interface if dial needs to start the ppp connection first!)

    ipchains -A forward -i ppp0 -j MASQ

    ipchains -A forward -j slo -j MASQ

    # Set rules

    # first, flush all old rules from memory

    ipfwadm -F input

    ipfwadm -F output

    #then set a default policy to deny everything

    ipchains -P input -j reject

    ipchains -P output -j reject

    # packets coming in from my local network (can only be eth0) to any-where else
    are allowed

    ipchains -P input -j accept -s $MY_NET/24 -d 0.0.0.0/0

    ipchains -P input -j accept -s 0.0.0.0/0 -s $MY_NET/24

    ```


    ```

    echo "done"

    ```'
