    # 4.6 Interaction with Users


    This section is more for the human side of interaction. The way you interact

    with your users determines how they will interact with you. The first thing to

    remember is that your users will probably not know as much about Linux as

    you do. They may need simple concepts or programs explained to them. Giv-

    ing a lot of low-level gibberish makes you look cool, but it probably

    won''t answer their questions.


    As an example, you could say, “Well, sendmail is thinking your mail host is

    when it should be bar, so I''ll have to go change the /etc/aliases file

    on NIS server to make it point to the right server.” Or you could say, “The

    mail isn''t in the right location. I''ll try and make it.” If you know absolutely

    out about computers, which would make you feel better? Don''t let your

    sadis side get the better of you, no matter how tempting it is.


    One other thing you should do is keep your users informed. If

    you need to shut down the server, be sure to give everyone at least a few min-

    utes'' warning before you do it. If you have to take the server down for main-

    tenance, do it near the end of the day and give everyone a few hours to get

    the work done. Just dropping people off the server may cause them to lose

    files and work. Also be sure that your backups work and test the backups fre-\quent
    so you can be sure you can restore them if needed.


    Some administrators have the notion that the people they''re assisting in

    day-to-day activities are not really customers—they''re just people they

    work with. We see it differently. Your primary job, if you''re an administrator,

    is to make sure that the people you''re helping are able to do their jobs. If

    they can''t do their jobs, then you won''t have one to do. So, it would be fair
    to

    think of the people you''re helping as customers. As such, you would be nice to

    to them and should be ready to drop what you''re doing to make sure they can

    keep their jobs.'
