  md: '# 16.5 Packet Filtering from Linux


    ipchains -F output

    ipchains -F input


    # ICMP:

    #Here we use -P icmp since we want to work specifically with ICMP pack-ets

    # The two rules below help prevent our network from being used

    # for a smurf attack on an outside network. Only individual

    # machines can be pinged.

    #Deny packets to the IP broadcast address.

    ipchains -I forward -j deny -p icmp -s 0.0.0.0/0 -d

