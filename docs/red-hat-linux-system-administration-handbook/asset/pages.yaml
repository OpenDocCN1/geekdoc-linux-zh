    In addition to all this, there are also save and restore scripts ipchains-save
    and ipchains-restore that save and restore firewall scripts. If you have a pre-built
    firewall script for ipfwadm, you can use the ipfwadm-wrapper script to import
    scripts into ipchains-save format. Once in ipchains format, you can use ipchains-save
    to store the new commands. Examine them to make sure there are no security issues,
    and you will be set with the rules in the newer ipchains format.


    On additional feature of both ipchains and ipfwadm is that you can block incoming
    and outgoing connections without having to forward a packet. One could use this
    for blocking ads from known advertisement sites. Another would be to prevent attacks
    from a specific host or network without modifying your packet filter or firewall
    software. Instead of using -A forward, use -A input or -A output. In the case
    of blocking ads, you would block the output, preventing the request from going
    to the ad site in the first place. You would use - reject to make the request
    fail immediately. In the case of a cracking attempt, you''d block the input, preventing
    any packets from reaching your IP stack in the first place.


    # 16.6 Summary


    Even the best of sites can get cracked with a small security hole. With your Linux
    servers physically secure and secured on your network, you will make it harder
    to get cracked.'
