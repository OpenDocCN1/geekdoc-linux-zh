    world is everyone else. If you belong to the eng group (engineers) and want anyone
    else in the eng group to read a file, make sure the file resides in the eng group:


    ```

    chgrp eng README

    ```


    Then, set appropriate permissions on the file:


    ```

    chmod 660 README

    ```


    This particular chmod command gives read and write permissions to the owner (you)
    and anyone else in the eng group. No other users have access to this file.


    The chmod command actually uses four octal numbers (0-8) to specify permissions:


    | Ownership | User | Group | Others |

    |---|---|---|--|

    | 0—no setting | 0—no permissions | 0—no permissions | 0—no permissions |

    | 1—save text image | 1—execute | 1—execute | 1—execute |

    | 2—set GID | 2—write | 2—write | 2—write |

    | 4—set UID | 4—read | 4—read | 4—read |


    The ownership settings are rather special that they give extra functionality,
    but they are also security holes. "save text image" setting means that once a
    program has finished running, it will save only the text in memory to decrease
    the amount of time it takes the program to load later on. This can quickly eat
    up memory if many programs have this, but if you use some programs a lot, this
    might be helpful.


    "set GID" setting means that once a program runs, set the group ID of the user
    to be that of the file. For example, if a program is in the sales group and has
    its GID bit set, when you run that program, you will be in the sales group only
    within that program while it is running. Some email programs use "set GID to lock
    files in the /var/spool/mail directories. The user becomes part of the "mail"
    group while the E-mail program is running and can write to /var/spool/mail.


    "setUID" is the same as "setGID," but works with user IDs instead. Some programs,
    like network sniffers, require the use of devices or functions that can run only
    by root. By setting it to "set UID," everyday users can run the ping program.
    If you set a program to "set UID," be careful. If a program creates a new shell
    process, it will have the UID of the owner of the file. If the owner of the file
    is root, this can lead to common'
