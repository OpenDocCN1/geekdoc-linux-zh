  md: '# Chapter 13 • Programming Languages


    In general, SQLs syntax is fairly simple and English-like. Some implementation
    features function like embedded query statements, full regular expressions, or
    full-blown programming languages. Others may support very little beyond being
    able to select, delete, insert, and update.


    Here are a few simple examples of common SQL commands:


    ```

    select * from table;

    ```


    ```

    Get all entries from all records in table.

    ```


    ```

    select name, address from customer_list;

    ```


    ```

    Gets only name and address from all records in customer_list.

    ```


    ```

    select name,address from customer_list where cust_id=1;

    ```


    ```

    Gets name and address from customer_list, where the cust_id field is equal to
    1.

    ```


    ```

    insert into table values (1, TRUE, "abcdef");

    ```


    Creates a new record in table with the values 1 (integer), TRUE (Boolean), and
    "abcdef" (text).


    SQL also defines things like Access Control Lists (ACLs), rollbacks (to undo changes
    to the database in the event of a problem), and in some cases, embedded applications.
    How each of these features operate, if the DBMS has that capacity, is described
    in the documentation.


    # 13.9 PHP


    ```

    http://www.php.org/

    ```


    Finally, a language we both agree on. While PHP isn''t a true language for programming,
    it makes writing CGI a lot easier. PHP has hooks into most databases we''ve listed,
    is embedded in HTML, and is easily added to the Apache Web server. Web-based mail
    readers, inventory tracking systems, order forms, and other sorts of programs
    have been written using PHP.


    Since PHP is really for Web servers, we describe it in more detail in the Web
    server chapter. If you have to do a lot of CGI scripting and HTML programming
    at the same time, PHP is worth looking at.'
