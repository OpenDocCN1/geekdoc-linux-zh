- img_proc: true
  md: '# 17.4 Adding Kernels to LILO


    You will also want to make a copy of your existing kernel and set up LILO, so
    you are able to boot in case your new kernel has something wrong with it simply
    won''t boot.


    Also, you will want to have a bootable floppy (which you should have already)
    in case things really awry. If you need to make a boot floppy, see the chapter
    on bootup and shutdown. Also, if you are a little paranoid, you might want to
    back up your root partition.


    # 17.4 Adding Kernels to LILO


    As mentioned above, it is good practice to keep an old, reliable kernel around
    that you can boot up in a pinch. LILO is the utility that allows you to choose
    which kernel to boot at startup. With LILO, you can also boot 386BSD, DOS, Windows
    98, UnixWare, and most other operating systems.


    LILO uses a configuration file, lilo.conf, located in /etc. Here is an example
    of one:


    ```

    # LILO config file: /etc/lilo.conf

    #

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    verbose=2

    prompt

    timeout=100

    message=/boot/message

    image=/vmlinux

    label=apm

    root=/dev/hda

    read-only

    image=/boot/vmlinux

    label=linux

    root=/dev/hda

    read-only

    ```


    The first line tells LILO which partition contains the boot sector, or if a device
    is specified (i.e., /dev/hda instead of /dev/hda), which device contains the MBR
    (Master Boot Record). Next, the map file is specified (/boot/map is the default);
    it tells LILO where all the files are that it needs to boot an OS. This is the
    boot loader. It is loaded into the BIOS and subsequently loads the selected kernel.
    Next is the verbosity level—higher is more verbose. The prompt entry tells LILO
    to present a prompt to allow you'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# 310 Chapter 17 • Kernel Administration


    choose which kernel to boot. The timeout defines long LILO will wait in tenths
    of a second before booting the default kernel. If no timeout line is present,
    LILO will wait indefinitely. In either case, simply pressing ENTER at the prompt
    boots the default kernel. The next line specifies the message file that contains
    text to be displayed before the LILO prompt.


    The next sections tell LILO about the specific kernels you want to boot. As expected,
    the first entry is the default. In this case (as is typical), it points to where
    the kernel is installed by default: /vmlinuz. The label-entry is the text that
    is given at the LILO prompt to boot this kernel, apm in this case. This represents
    a kernel recompiled to take advantage of AP support. The root line specifies the
    partition containing the root directory for the OS or kernel. The read-only line
    tells Linux to mount the root partition read only, so that fck can be run at boot.
    The fck program cannot run on a partition that is mounted-write.


    Subsequent entries specify additional Linux kernels, each with their, unique label,
    but otherwise the same as the first. A good portion of the time, this is all you
    will need to know about LILO, especially if you bought your Linux system already
    configured. You may also want to use DOS and MS Windows or Windows 98 (for games,
    etc.). Adding entries into your /etc/lilo.conf for other OSes is fairly straightforward.
    Here is an example of an entry to boot MS DOS from a different partition:


    ```

    other=/dev/hda5

    label = dos

    table = /dev/hda

    loader = /boot/chain.b

    ```


    There are two new parameters here: the first specifies the location of the partition
    table for the foreign OS and the second what chain loader use to boot up the OS’s
    kernel.


    The most important thing to remember with regard to LILO is to run / sbin/lilo
    after changing anything to do with LILO (editing any of the files associated with
    it, updating a kernel with an existing lilo.conf entry, and so forth). Failure
    to do so could potentially prevent your machine from booting.


    # 17.5 Modules or Compiled In?


    One thing to note here is that not all drivers behave the same as a module when
    compiled into the kernel. This can range from slight differences in functionality
    to their simply not working at all.'
