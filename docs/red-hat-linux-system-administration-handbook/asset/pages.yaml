    Here''s a simple set of ipfwadm commands:


    ```

    # Set default rules:

    # By default, reject any packets wanting to get forwarded

    ipfwadm -F -p reject

    #Accept all incoming and outgoing packets

    ipfwadm -I -p accept

    ipfwadm -O -p accept

    # Flush (-f) any old rules. This is always good to run.

    ipfwadm -F -f

