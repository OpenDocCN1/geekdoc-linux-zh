  md: '# Chapter 20 • Talking to Your Peripherals


    meant 9600 interrupts per second. Each of these CPU interrupts prevented the CPU
    from doing something else. The 16550 chips have a 16-byte buffer, which means
    that at 9600 bps, there are fewer than 1000 interrupts per second.¹ This gives
    the CPU a net gain of 8600 interrupts per second to devote to other things, such
    as running programs. When speeds reach 38400 bps, the difference is even greater.
    Most of the “dumb” serial boards use 16450 or 16550 chips to do their processing,
    while “smart” serial cards use anything from an Intel 80186 to a Cirrus Logic
    CD-2401 chip to provide greater speeds and extra functionality, like multiple
    serial ports per IRQ.


    # Modem Types


    One question that is frequently asked is: “What kind of modem should I get?” There’s
    a choice between getting an external or internal modem for your PC. Internal modems
    are cheaper and have their own UARTs built in, which prevents data loss at high
    speeds. External modems don''t take up a precious ISA slot in your machine (assuming
    your machine has an ISA slot) and give you pretty lights to look at when downloading
    Web pages and FTP files. The best kind of modem you can get for Linux is an external
    modem, especially if you have a good 16550-based serial port² for the following
    reasons:


    +   1. You get the pretty lights to show that everything is working. With internal
    modems, you have to rely on other software to get modem states and so on.

    2. You won''t accidentally buy a “WinModem.” These modems actually require a lot
    of CPU time and are not supported by Linux.

    3. If you need to move modems, it’s pretty easy to do so.

    4. It will work with all versions of Linux, be it Linux on Sun, Linux on Alpha,
    Linux on PPC, or Linux on i386. RS-232 is a cross-platform standard.


    > ¹When you have a fairly large buffer, you have a point (high-water mark) where
    the buffer is close to being full and should be emptied. Thus, you may not always
    have 16 bytes in the buffer when an interrupt occurs.


    > ²Linux will report what kind of UART is in your machine. You can also look at
    the motherboard, and you may find the chip.'
