    # 9.5 Mailing Lists


    Mailing lists allow larger groups of people to communicate via email. In many
    cases, it is preferable to use USENET since mailing lists do not need approval
    from anyone other than the administrator to be created.


    Anyone with a machine connected to the Internet can create a mailing list on any
    subject. Getting members to subscribe to it is a different issue, however.


    Mailing lists can control who subscribes. The mailing list administrator can make
    so anyone can subscribe, or he/she can make that it is the only one who can add
    new members to the mailing list. The administrator can also remove offending members
    if a problem arises.


    Mailing lists can control content. This isn’t as bad as it sounds, since it is
    the alternative to the anarchy that USENET. The administrator can set the list
    to be open and provide a healthy discussion area (such as for developers working
    on a piece of software). Alternatively, the list can be set up that the administrator
    has to approve each piece of email that gets to the list, like moderated USENET
    groups. Moderated lists are good for new releases, humor lists, or any other list
    where the amount of discussion is low.


    # Majordomo


    The best mailing list program in use has to be majordomo. Majordomo provides all
    the features listed above, plus a few other features, such as sending out regular
    digests, or archiving for future use. We’ll get back to these later on.


    The first thing that needs to be set up is majordomo itself if it’s not already
    installed. The source for it is located on the CD-ROM. You need to have Perl 5
    installed on the system (as well as GCC, of course) to use it. Create a majordomo
    user. Given the eight-character limitations of Linux usernames, the username will
    have to be shortened to majordom. Thanks to /etc/aliases, no one ever has to know
    this. You should also create a home directory for /home/majordom if you like,
    or /usr/local/majordomo if you prefer, or anywhere you have space.'
