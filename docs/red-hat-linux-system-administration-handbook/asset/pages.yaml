    ```


    You can customize access by adding additional lines starting with + or -. For
    example, deny the user carry access, but allow all others (at least to the extent
    they have on any other NIS client) like this:


    ```

    +:::::

    ```


    ```

    -cary

    ```


    The "+::::" entry is not mandatory. Additionally, you can control access by groups,
    using ".". This entry:


    ```

    -paul

    ```


    ```

    -entry

    ```'
