  md: '# Additional /dev Directory Entries


    # Locally-defined Links


    The following links may be established locally to conform to the system configuration.
    This is merely a tabulation of existing practice, and does not constitute a recommendation.
    However, if they exist, they should have the following.


    ```

    /dev/mouse    mouse port       symbolic Current mouse device

    /dev/tape     tape device      symbolic Current tape device

    /dev/cdrom    CD-ROM device   symbolic Current CD-ROM device

    /dev/modem   modem port      symbolic Current dialout device

    /dev/root     root device      symbolic Current root filesystem

    /dev/swap     swap device      symbolic Current swap device

    ```


    /dev/modem should not be used for a modem that supports dial-in as well dial-out,
    as it tends to cause lock file problems. If it exists, /dev/modem should point
    to the appropriate dial-out (alternate) device.


    # Sockets and Pipes


    Non-transient sockets and named pipes may exist in /dev. Common entries are:


    ```

    /dev/printer  socket  lpd local socket

    /dev/log      socket  syslog local socket

    ```'
