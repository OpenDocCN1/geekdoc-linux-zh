- img_proc: true
  md: '# Boot Floppies


    If you are not fortunate, you will have to make at least one disk to boot from
    to start the installation. There are four boot floppies that you may need, depending
    on your setup:


    +   1. The normal boot floppy, called boot.img. This is used for 90% of the installations.
    If you are not installing over a network, and are not using PCMCIA devices to
    perform the installation, this floppy will work for you.

    2. The boot floppy for a network install, called bootnet.img. This image is needed
    if you are installing over a network, be from a local FTP or NFS server, or over
    the Internet from Red Hat or one of its mirrors.

    3. The PCMCIA supplemental boot floppy (pcmcia.img). This image is needed only
    if you require PCMCIA services to install Red Hat. If your laptop has a built-in
    CD-ROM, this floppy is not required. However, if you have a CD-ROM that is accessed
    via a PCMCIA card, or perform a network install using a PCMCIA network card, which
    will require this diskette.

    4. The rescue diskette (rescue.img). This diskette is Linux on a floppy. You can''t
    perform an install using this floppy, but if you run into problems and boot to
    Linux, you can use this floppy to access to the rest of the system.


    The files, or images, as they are more properly called, for the disks are located
    on the CD-ROM in the images/ subdirectory. The images cannot simply be copied
    onto a floppy. They must be transferred in raw mode. If you are starting this
    procedure from DOS or Windows, you will need the rawwrite program from the desutils
    directory. If you have Linux or another UNIX-like operating system, you can use
    the dd command.


    The various images can all be found in the images/ directory of the Red Hat CD.
    If you are getting Red Hat from an FTP site, you will first need to locate the
    root of the Red Hat mirror. Of course, if you are on Red Hat''s FTP site itself,
    this is trivial. Once, you can find a duplicate of the CD-ROM directory tree for
    the latest stable version of Red Hat at current/i386/. If you are using the Sparc
    or Alpha distributions, replace i386 with sparc or alpha, respectively.'
  merge: -1
