    # 20.9 ZIP AND JAZ Drives


    Hard drives that support removable media became almost popular about a decade
    ago, but then faded. Iomega has resurrected them in the form of its JAZ and ZIP
    drives. Other companies have begun making comparable products, but none is currently
    supported under Linux.


    ZIP drives have a capacity of 100MB and JAZ drives can hold 1GB. Because of their
    relatively large sizes, they are much better suited for use as backup media than
    floppy drives. Additionally, both have considerably better performance than floppy
    drives. In the case of JAZ drives, the performance is comparable to a SCSI-I hard
    drive. A ZIP drive has a seek time that is a few times longer and a transfer rate
    about one-fourth of that of a JAZ drive.


    # Installing a ZIP Drive


    An external SCSI ZIP drive is shipped with its own controller based on Adaptec''s
    AHA1520, which Linux supports. Optionally, you can connect it to your existing
    controller. The parallel port version actually comes with a parallel-to-SCSI adapter,
    which will make the ZIP drive appear as if it were a SCSI device.


    If you have the parallel port version of a ZIP drive, you will need to enable
    support for it in the kernel either compiled or as a module. If you have only
    one parallel port and other devices you want to attach to, it is possible to daisy-chain
    them. However, Linux will not allow more than one driver to be active on the port.
    The solution is to compile all the various drivers (ZIP, Ip, PLIP, etc.) as modules
    and then load and unload as needed.


    If you have the SCSI version, you need to only support SCSI, SCSI disks, and your
    controller. Thus, if you plan to use the drive on an existing control-'
