    # # /etc/skel Directory


    This directory contains a “skeleton” user. That is, it contains files that you
    can use as a base for other users. It contains setup files for X, /bash configuration
    files, and .login. You can add or change these files as you like, but remember
    that existing users will not have these changes taken into account. Only new users
    will see them. If you want to have common settings for all users, you can use
    the /etc/.login, /etc/csh.cshrc, and so on.


    # # 4.2 Deleting or Disabling Users


    To disable a account (that is, prevent the user from logging in again), replace
    the password in the /etc/passwd file with an asterisk (*) or some other character.
    Since the * is not a valid encrypted password, there is no password that will
    allow you to log into that account.


    To delete an account, remove the entire line from the /etc/passwd file. The user
    will cease to exist to the system, and cannot run as that user.

    The differences? If you disable an account, the account technically still exists.
    That user can still receive mail, has a home directory (that other people can
    access if the permissions are correct), and has all the rights of any other account.
    The user can''t log in. When an account is deleted, the system will bounce any
    mail that comes to that user, and all files owned by the former user will now
    be owned by the UID that the user had. Also, any accesses to the home directory
    (cd ~bob, for example) will not work.


    # # When to Disable and When to Delete


    So, when should you disable an account and when should you delete it? It depends
    on what information you want to keep. If you''re an Internet Service Provider
    (ISP) and a customer cancels, you may just want to delete the


    > ²The root user can still use su to enter that account, as su does not ask root
    for passwords.


    > ³A deleted user can still have an entry in /etc/aliases to forward mail to another
    system.'
