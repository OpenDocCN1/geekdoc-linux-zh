    # 2.7 Migrating from Other Distributions


    Unfortunately there is no magic recipe for migrating, say, a Caldera Open-Linux
    system to Red Hat. The only solution is to make copies or notes of your setup
    files and then overwrite the system partitions/filesystems with the new Red Hat
    installation.


    You should not need to touch your data partitions (such as /home), but you might
    want to back them up just to be safe. You will also need to re-create users, networking
    setups, and other information. It''s best to consider migration as a fresh install.


