    The nameserver is the program that matches an IP address

    (208.197.103.125) to a hostname (wayga.net). It also provides for matching

    in the opposite direction as well, informing you that the machine has a

    address 208.197.103.125 is called wayga.net. Since one of the jobs of a

    nameserver is to look up and cache DNS requests from client machines, it

    can be used at one end of a slow link (between two offices perhaps) and'
