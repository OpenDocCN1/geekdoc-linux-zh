  md: '# Introduction


    # What''s this Linux thing?


    Linux is probably one of the fastest growing operating systems around. It has
    about 10 million worldwide users, and that number is growing each day. For something
    that started as an idea by a college student in Finland in 1991, that is pretty
    damn good.


    Linux is now used everywhere there is a need for a good, robust operating system.
    Companies run their businesses on Linux, but many may not know it. It is used
    for email servers, WWW servers, and to provide file and printer access for Microsoft
    and Apple machines, and even other UNIX machines.


    This is a guide to give you (the reader) as much knowledge as we (the authors)
    have attained in our years of Linux administration. Our administrative projects
    have been varied, but they all have had a common base—managing users, email, the
    network, hardware, and making sure that we didn''t mess up anything too badly
    while trying to make an improvement.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 1.1 Oh No! Not Another Linux Book!


    This is not just a Linux book. This is the Linux book. Anyone can write some theoretical
    book about the way networks should run, but how many of these authors are actually
    network administrators? How many are stuck in the trenches, reading the cryptic
    man pages to while users are complaining about their printouts? We''ve been there,
    we are there, we will be there. We enjoy it.


    The proof of this attitude exists throughout the book. While everyone goes on
    IDE drives, we personally and professionally recognize the power of the small
    computer systems interface (SCSI) bus and use it in our systems. It''s more expensive
    and to work, at a time to work with, but with the benefits are enormous.


    Anyone can tell you how a program like Samba is set up, but what happens in the
    real world where things aren''t quite the same as they are in the man pages?


    # 1.2 Linux Theory


    The UNIX theory is “Do it your way,” but Linux is more than a slogan for a chain
    of hamburgers. Linux allows you to not choose what you want for your hamburger,
    but also what''s in it, how the cow grows, what spices are added to the mixture,
    and how long it is cooked. Linux gives you all the same abilities that commercial
    UNIX packages (such as Solaris or AIX) give, plus a lot more.


    # 1.3 Is It Really Free?


    Yes and no. The GNU''s Not UNIX (GNU) Public License (which is how Linux is licensed)
    says that you can charge for a binary distribution, but the source code must be
    either included or available for the cost of duplication. In days of the Internet
    and CD-ROMs, the cost for duplicating is low indeed.


    Note that this really covers only the Linux kernel, and the GNU utilities included
    with most distributions. This does not prevent a company like Red Hat from assembling
    all these programs, adding a few special ones (installation and administration
    scripts, for example), producing a CD-ROM, and charging you $80 for it. The Linux
    kernel and source code is there. The source code to all the other GNU utilities
    is either available or pointers'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# 1.4 Why Linux?


    to the source code exist. Thus, companies have met their end of the GNU license.
    Many of these also sponsor Linux-related events or offer free CD-ROMs to software
    contributors.


    Companies such as Red Hat have a more expensive product, but they add things that
    may not be covered by the GNU Public License (GPL). For example, Red Hat sells
    a copy of their distribution for three different architectures for about $80.


    # 1.4 Why Linux?


    So why would you (or your company) want to use Linux in a personal or business
    setting? The answer goes past the shortsighted “anti-Microsoft” response. Microsoft
    makes a fair product for a new user. But so does Apple. Linux gives you things
    that Windows 95 can only dream about:


    +   * Source code for the entire kernel.

    * Full configurability of the operating system.

    * Ability to turn features of the system on and without rebooting.

    * 32-bit operating system, 64-bit for the Alpha and Sparc processors. As new chips
    arrive (Pentium III and Merced), Linux will be ported to these new chips.

    * Access to the 25 years of software experience that make up the UNIX world. This
    includes compilers, Web servers, editors, games, and internet tools.

    * A growing application base with generally rapid and responsive software development,
    a supportive user community, and growing commercial acceptance.


    As an inexpensive Web server, Linux will beat NT down for performance on expensive
    hardware. As a network server, a Linux machine hidden in the corner of an office
    can handle a small workday or a large office with months between reboots (usually
    to upgrade the kernel or add new hardware). With the emergence of Java as a truly
    portable language, companies can easily port their software to Linux just as fast
    as applications for NT or Windows 98. Many commercial applications (Netscape,
    WordPerfect,


    > Linux was one of the first operating systems to handle Java applications in
    the kernel.'
