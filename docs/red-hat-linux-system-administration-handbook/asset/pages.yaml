- img_proc: true
  md: '# 17.6 Dive On In!


    The choice of when to make a particular feature available as a module or compile
    it is usually fairly straightforward. In general, if it is infrequently used and
    performs as needed as a module, you should compile it as a module. This often
    includes things like floppy disk drivers (in this day of networking, how often
    do you really use the thing?), drivers for other filesystem types, CD-ROM drivers
    for sound cards, and networking drivers on a machine that uses dial-in Ppp for
    its access.


    If a feature is used frequently or continually, then there really isn''t much
    point in compiling it as a module since it will be loaded all the time anyway.
    This includes items such as your hard disk controller or SCSI controller, network
    drivers on a machine permanently networked, AppleTalk drivers on a fileserver
    for your Mac network, and so forth.


    In cases where functionality between the compiled version and module version differs,
    it is usually noted in the help pop-up for that option and any related HOWTOs.


    It should be noted that these are, for the most part, just guidelines. Ultimately,
    you need to compile in your kernel only what you need to boot your machine.


    # 17.6 Dive On In!


    Let''s go through and outline how you might roll a kernel for a networked Linux
    machine you are using your desktop machine and a file server for a network of
    Windows and Mac machines. You also have a sound card (they''re cheap and you have
    a hundred CDs at home you could also listen to at work). The machine has a SCSI
    controller with a CD-ROM and hard drives attached to it.


    First, make sure you have the kernel sources installed. Even if you do, you may
    decide to get more recent versions. The default location is in /usr/src/linux
    (linux may be a link to linux-x.y.z, where x is kernel revision). Once you make
    your way into /usr/src/linux, makeconfig (assuming you are in X, which is highly
    recommended). This will do some preliminary work and then bring up a window with
    buttons that take you to various sections of the kernel configuration.


    As you may have guessed, the first time through it is best to start at the top
    and go through all the menus.


    To the right of each button is a help button that gives a small amount of information
    on the driver and some hints to help you if you want to enable it or not.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Configuring the Kernel


    If you are in X, run make xconfig from /usr/src/linux. If you are using a character
    terminal, run make menuconfig. And, if you are using a character terminal with
    poor emulation, you are stuck running make config.

    When you run make with the xconfig option, a nice GUI pops up as seen in Figure
    17-1.


    ![](img/142e1b4a4b104ce5c6de1544ac62324a_325_0.png)


    Figure 17-1 Main Xconfig screen


    Once you go into a submenu, you can get help on the various options there. See
    Figures 17-2 and 17-3 for examples.'
