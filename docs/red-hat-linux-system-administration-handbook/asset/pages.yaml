    # Extensions for Apache


    One of the more complicated extensions with a difficult setup process, suEXEC
    is a wrapper that allows CGI programs to be executed under a different UID than
    under which the server is running. This is often used by ISPs that let their users
    maintain their own CGIs; this forces the scripts to execute as those users. This
    obviously strongly encourages the user to create good, secure CGI scripts. It
    also allows access control to that allowed by the password file.


    Because suEXEC can open some serious security holes, its security model imposes
    several additional restrictions. The target program must reside in the Apache
    Web space and thus, the path to it cannot start with / or have back references
    (.. Obviously, the user and group must be valid and their IDs must be above a
    minimum (typically 100 or 500), which will prohibit execution as the root user
