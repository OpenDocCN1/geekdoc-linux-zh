  md: '# 13.10 Other Languages


    ing features, it does not specifically address a particular problem set. Its syntax
    is similar to C, but with a much higher level of semantics.


    It is well suited to systems programming, though as a high-level compiled language,
    it is certainly useful and is used for shorter but computationally intensive tasks.
    Similar to Smalltalk, it was designed with the programmer in mind. This is not
    as friendly as the Smalltalk slogan, but the point is clear: Icon''s high-level
    design allows for rapid application development.


    As an aside, the name Icon is not an acronym and it was chosen for the language
    before its usage to refer to window manager "icons".


    # Rxx


    ```

    http://www.rexxla.org/

    ```


    According to its creator, Rexx is "a procedural language that allows programs
    and algorithms to be written in a clear and structured way." Rexx''s syntax is
    not particularly unique or unusual. It was designed to be a generic macro language
    to be used with another application. When its parser encounters a function that
    it does not recognize, it asks the application to handle it. This way, if Rexx
    is used as the macro language for multiple applications, users need to learn only
    one macro language and the functions for each application, which presumably will
    be known from normal use of the application.


