    Linux version instead of the Windows version.


    #  15.9 Using Remote Displays


    The biggest advantage of X over Macintosh, Windows 95, and even standard Windows
    NT is that X can send the output of a program to another X server. That is, you
    could be running a program in New York, with the display in an office in Massachusetts.
    Or, programs can run across an office, allowing you to control a Linux machine
    from anywhere.


    Three things are required for remote displays to work. First, there has to be
    a TCP/IP connection between the two machines. This can be Ethernet, PPP, ATM,
    and the like. Next, the X server (where you''ll be watching the program) has to
    know that a client wants to send a display. This can be with the xhost program.
    Running xhost + will allow connections to your X server from anywhere. Running
    xhost +host adds xhost to the list of machines that can access your display. You
    can deny access to xhost. Note that by default, the local machine has access to
    your display. Every other machine that wants to send a window to your display
    must be given access. The third item is that the client program needs to know
    where to send the display. This can be done using -display or by setting the DISPLAY
    environment variable. We prefer setting the DISPLAY variable.


    Displays are set with two items: the host to display on and the X server running
    on that host to display. The server itself is broken into two parts: the server
    number and display number. Since X can handle multiple monitors at the same time,
    you will need to specify the host, X server, and monitor to send the client program
    to.


    Fortunately for most Linux installations, this is easy. The X server and monitor
    always begin counting at 0, making the first X server 0.0. Tie this in with the
    hostname (let''s call it wayga), and you get the setup shown in Figure 15–11.


    ```

    setenv DISPLAY wayga:0.0

    ```'
  merge: -1
