    the available class C networks, allowing 254 machines on your network. For this
    chapter, we will use the class C network of 192.168.1.0. There are two reserved
    IPs in the 192.168.1.0 block: 192.168.1.0, which represents the network itself,
    and 192.168.1.255, which is the broadcast address for the gateway machine. Another
    address to set aside would be 192.168.1.1. This is commonly for the firewall,
    and in our case, the firewall. This is not necessary; it is just a rule of thumb.


    In /etc/sysconfig/network/, you will find a file named ifcfg-eth0 that should
    look like the following:


    ```

    #!/bin/sh

    #>>>Device: ethernet


    #>>>Variable declarations

    DEVICE=eth0

    IPADDR=192.168.1.1

    NETMASK=255.255.255.0

    NETWORK=192.168.1.0

    BROADCAST=192.168.1.255

    GATEWAY=none

    ONBOOT=yes

    #>>>End variable declarations

    ```


