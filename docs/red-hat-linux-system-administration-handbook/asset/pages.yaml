    controller, make sure bus termination is disabled or you will likely be unable
    to talk to SCSI devices after reboot.


    One final note: The ZIP drive''s SCSI ID can be set only to 5 or 6. This could
    potentially conflict with other devices on the SCSI bus, so you may need to do
    a little rearranging.


    # Installing a JAZ Drive


    Since the recently available parallel port version of the JAZ drive is not yet
    supported in Linux, you will obviously have to use the SCSI version. As you need
    only support for SCSI disks (and SCSI obviously) and the controller itself.


    The drive is shipped with its own controller. There are two versions in use. One
    is based on the Adaptec AHA78x series. This series of controllers is supported
    by the AHA2940 drive. The other is based on the Advanced Systems family of controllers,
    which is also supported under Linux. As before, you may instead choose to place
    the drive on an existing controller. JAZ drives may be assigned any SCSI ID between
    0 and 6.


    # Caveats


    It is generally difficult or impossible to have two identical SCSI controllers
    in the same system because various settings frequently conflict. If you already
    have a controller of the type that your ZIP or JAZ drive uses, you should probably
    consider just putting the device on the existing controller. This will also help
    conserve system resources like IRQs, which are frequently in short supply.


    # Using the Drive


    After you reboot, you may need to check the boot information to get the device
    that corresponds to your drive. You can retrieve boot output with the dmesg command.
    Find the section where your ZIP or JAZ drive is detected and scan a few lines
    to locate the device report for your drive.


    Once you know the device, you can mount a disk in the drive. Typically, the disk
    shipped with the drive has a filesystem on its fourth partition. Unless you need
    compatibility with the OS that supports the filesystem type, you will likely want
    to format the drive with the Linux native ext23fs. (See the section on installing
    a new hard drive for instructions on formatting a disk.)'
