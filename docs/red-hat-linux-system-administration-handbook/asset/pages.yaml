  md: '# Networking with Linux


    Let your Linux box connect to other machines using PPP and Ethernet


    One of the biggest benefits of Linux and UNIX is the built-in TCP/IP networking.
    This networking gives you E-mail, remote connections, and World Wide Web (WWW)
    access.


    To connect your machine to a network, you''ll need either an Ethernet card or
    a modem and a PPP provider.¹ Once this is done, you''ll have to reconfigure the
    Linux kernel to take advantage of the networking hardware. There are more networking
    options available in Linux than just those for the Ethernet card and Point to
    Point Protocol (PPP), but these are the two most common methods. For example,
    you could use PLIP (Parallel Line IP), ATM, Frame Relay, or AX.25.


    > ¹This can be your Internet Service Provider (ISP), employer, or university.'
