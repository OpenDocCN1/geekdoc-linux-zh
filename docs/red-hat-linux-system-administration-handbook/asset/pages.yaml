    If this is a completely new installation, you will want to destroy any existing
    partitions. Press p to list the current partition table and then use d to delete
    the factory-created partitions.


    When creating your partitions, keep in mind the machine''s intended use. For a
    desktop workstation, a simple partition scheme is probably fine. For a server,
    you will likely want to set aside partitions for /tmp (where temporary files are
    written), /var (where most log files are kept), and/or the var/spool/mail.


    Another advantage of making separate partitions for an area like /var is that
    it isolates those from the system area. Thus, a runaway log file can only fill
    the logging partitions and leave the system untouched.


    There are two types of partitions: primary and extended. The disk can, at most,
    support four primary or extended partitions. Extended partitions, however, are
    just containers for more partitions, called logical partitions. Extended partitions
    are not mountable or usable as regular filesystems, but logical partitions are.
    SCSI disks can have up to 15 logical partitions in an extended partition and IDE
    disks up to 63; ironic in view of the fact that SCSI disks are available in larger
    sizes.


    In any event, you need to make some partitions. The following is a short example
    using the first IDE drive:


