  md: '# 3.3 init


    There are other messages that will probably display as programs start up. For
    example, output of things like fsck will not be in a dmesg output. messages that
    will be added to dmesg include changes of CD-ROMs and flop-pies (VPS disk change
    detected on device xx:xx) or if modules get loaded (for PPP or the parallel port,
    for example).


    These messages are also stored in the /var/log/messages file, which is the default
    location where syslog stores its messages.


    # 3.3 init


    After the boot messages you saw above, you''ll see more screens of text as other
    programs start up. These programs are not started as part of the kernel bootup,
    but are started by the init program. The init program is always Process ID (PID)
    1, and is started automatically by the kernel. This program then starts up rest
    of the daemons and other programs.


    The /etc/initittab file is read by init, which tells it what init level to start
    out and on what processes to start. This would include programs like getty (which
    is what gives you the login prompt on the console). Other scripts are run based
    on runlevel you''ve entered.


    An entry in the /etc/initittab file has four fields:


    ```

    10:0:wait:/etc/rc.d/0

    ```


    Colons delimit the above fields. The first field is unique to the file and is
    just an arbitrary two-letter (or -digit) sequence. The second field tells init
    what runlevel to reference this field. In this case, it runlevel 0. The third
    field is an option to init on what to do while the script is running. Since you
    don''t want to cause problems by having multiple runlevel change scripts running
    at once, init will wait until the script has finished before running any other
    scripts. Options include include, which will restart the process if it dies or
    stops (for getty), and once, meaning that the process should be run once and never
    again. The fourth field lists the script or process to run. You can see how these
    scripts work below.


    # 3.4 What''s a Runlevel?


    The runlevel of a machine determines what functionality the system should be providing.
    Just as Windows 98 provides a safe mode, UNIX has a singleuser safe mode, plus
    other configurations available:'
