- img_proc: true
  md: '# Processor Type and Features


    Set the processor type appropriately, unless you have an old version of GCC for
    some reason. In that case, you will have to say 386 or 486. If you have mulitple
    CPUs, enable SMP as well. If you have a Pentium Pro or Pentium II/III and are
    using the machine as a workstation, you will be running X windows, enable MTRTR
    as it should improve video performance.


    # Loadable Module Support


    As you might guess, we highly recommend that you enable the use of loadable modules
    and kernel daemon support. Under the 2.0 series of kernels, the kernel daemon,
    keld, is the program that manages the loading and unloading of modules. It is
    available separately from the kernel distribution, but ships with Red Hat. Under
    Linux 2.2 (Red Hat 6.0 and later), kernel modules are loaded and unloaded by the
    kernel itself, using the kmod facility. If you are using a 2.2 kernel, you should
    therefore enable the kernel module loader option as well.


    While kmod is not as flexible as keld, it removes a step in the locating and loading
    of a module. Since the kernel never used any of the other features of kernel,
    replacement was made.


    Both keld and kmod call modprobe to load a module, as well as modules it may depend
    on. Often it is desirable to tune modprobe''s behavior. This is done in its configuration
    file, /etc/conf.modules. Those that find this name backwards can move it to /etc/modules.conf,
    which modprobe also knows to check.


    This file has several types of entries, but two are the most common: alias and
    options.


    An alias line does pretty much what one would expect. It assigns an alias to a
    real module name. This can also be used to turn a module off. Options lines set
    up options for use with specified modules. Examples are things like i/o memory
    addresses of peripherals and IRQ settings.


    One module that almost always requires an option entry in /etc/conf.modules is
    the sound module. For example, the entries for the Crystal CS423x on-board sound
    chipset would look something like this:


    ```

    alias cs4232

    alias midi opl3

    options opl3 io=0x388

    options cs4232 io=0x534 irq=5 dma=1 dma2=0

    ```'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# 17.6 Dive On In!


    Options lines can use a real module name or an alias. The main benefit of


    alias entries is to make it easier to use modules in general. It is easier to

    remember that your sound card support can be referenced by sound instead

    of the module named after the chipset.


    To turn a module off, use an entry each like this:


    ```

    alias net-pf-4 off

    ```


    This turns off the IPX module and also prevents the display of warning

    messages about it being missing should an attempt to load it be made if it

    isn''t present.


    For more details about kmod and modules in general, read the man page

    on modprobe and the kernel documentation on modules, typically found at /

    usr/src/linux/Documentation/modules.txt.


    We don''t recommend that you enable version information on loadable

    modules, but rather you reinstall modules each time you install a new

    kernel.


    When compiling the kernel, it is generally better to enable more options as

    modules than not compile them or build them into the kernel. Since modules

    do not take up any memory or CPU space when not in use, they allow you to

    have more options available for when you need them. Also, modules allow

    y to change options when you change cards. Installing a new sound card no

    longer requires recompiling the kernel; you just change the options in /etc/

    conf.modules.


    # General Setup


    You will definitely want to enable networking support and System V IPC.

    Unless you have a very old system without a PCI bus, enable PCI support as

    well. You should also enable a .out, probably as a module, since nearly every

    executable binary is in ELF format. Choose either support for ELF OR

    MISC. Select MISC if you want to be able to run other binary formats via a

    wrapper. This includes things like Python, Java, LISP, or even DOS programs

    via DOSEMU. You should also read bfmt_mic.txt and java.txt in the

    Documentation/ directory for more detailed instructions on using this fea-

    ture. Most people, however, will be fine with just ELF support and running

    the Python scripts the old-fashioned way.'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# Block Devices


    Enable floppy disk support, probably as a module, unless you use the floppy drive
    to talk. Leave out (E)IDE support if you are sure you do not need it, i.e., you
    have a SCSI-only system.


    The various chipset support options and bug fixes can be left off unless you have
    an older motherboard, particularly one that uses Intel''s Neptune chipset.


    For the rest of the options, it should be obvious if you need them or not. Enable
    as you see fit.


    # Networking Options


    There are several options you will definitely want here—namely, TCP/IP networking,
    UNIX domain sockets, and packet sockets.


    Most of the rest of the IP and network-related options you will not need unless
    your machine is acting as a TCP/IP router/gateway or Firewall. You might need
    to enable multicasting if you are going to be accessing the MBONE, which sits
    on top of the Internet. If you enable routing, you will be presented with options
    for routing strategies in the QoS and/or Fair Queuing menu.


    Further down you will find support for other networking protocols: IPX, AppleTalk,
    and AX.25. Enable these if you need them. If your machine is going to be a server
    using one of these protocols, you might as well compile it into the kernel. It
    will likely end up being loaded nearly all of the time anyhow.


    You can also enable support for IPv6. IPv6 is the next generation IP protocol.
    Its most compelling features are a vastly expanded address space (128 bits instead),
    authentication, and privacy. Most Internet providers do not support IPv6 yet,
    but Linux will be ready when they.


    # SCSI Support


    Assuming we have beaten the dead horse, you will need at least SCSI support and
    SCSI disk support for your SCSI-based machine. You might also need SCSI tape and
    CD-ROM support as well. If you have other SCSI devices, like a scanner, you will
    also need to enable generic SCSI support. Unless you have a device with multiple
    logical unit numbers, you should say No to the option for probing all logical
    unit numbers (LUNs). An example of such a device is a CD jukebox.


    If you are having problems with your SCSI bus, you may want to enable verbose
    error reporting to help track the errors.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# 17.6 Dive On In!


    # SCSI Low-level Drivers


    Enable the driver(s) for your SCSI adapters. If you are using a built-in ZIP or
    JAZ drive on your controller, you will need to enable its driver. See the chapter
    on peripherals for more information.


    If you are using a ZIP drive on the parallel port, you will need to enable support
    for it here, too. This type of drive contains a parallel-to-SCSI converter that
    essentially turns the port into a SCSI host.


    # Network Device Support


    Enable network device support (duh). After that, enable other options as you need
    them. In most cases, your choice should be a list of Ethernet cards. Once again,
    further down in this pop-up, the correct choice should be obvious, assuming you
    know what kind of card is in your system. Enable more than one if you have multiple
    cards.


    # Amateur Radio Support and IrDA Subsystem


    These two menus control support for amateur (HAM or AX25) radio and infrared ports.
    Infrared ports are commonly found on laptops and PDAs.


    > Amateur radio users should consult the HAM HOWTO or the AX25 HOWTO and http://www.tapr.org/html/pkthome.html.


    More documentation on IR support can be found in the IR HOWTO.


    # ISDN Subsystem


    Enable this if you need it. You will likely have to contact your service provider
    to find out if they support synchronous PPP and compression. Enable the driver
    for your ISDN adapter as well. Enable the remaining options as needed.


    # Old CD-ROM Drivers


    Hopefully you will not need this. But if your CD-ROM interface is ATAPI-(IDE)
    or SCSI-based, you will require this. In many cases, older sound cards or proprietary
    CD-ROM interfaces will require this setup. This should only be the case on older
    systems, however.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Character Devices


    You will almost definitely want to have virtual terminal support, unless you plan
    to only use the machine from the network and/or serial port. It is also likely
    that you will want standard serial port support, though you can leave it out if
    you have a bus mouse and no modem.


    Intelligent multiport serial card support is also set here. If you have a dumb
    serial port card (based on the 16550 or similar), it is enabled as part of the
    standard serial port support.


    Further down are options for Unix98 pty support, which you should always have
    enabled; parallel printer support, which you should enable also if you have a
    parallel port ZIP drive; non-serial, i.e., bus mice; non-SCSI drives; speech cards;
    and various devices relating to timing.


    If you said yes to bus mice, you will be given a list of drivers to choose from
    the Mice menu. Similarly, if you enabled watchdog timer support, a list of drivers
    for watchdog cards will appear.


    # Video for Linux


    This supports video and audio capture devices and FM tuners. User programs for
    accessing the devices can be found at ftp://ftp.uk.linux.org/pub/linux/video4linux.


    # Joystick Support and Ftape, the Floppy Tape Device Driver


    Here is another pair of fairly self-explanatory devices, at least if you''ve been
    using PCs for awhile. Enable and select the appropriate driver if you have this
    hardware. The joystick driver is recommended if you''re going to play games, and
    Ftape is needed for some of the older 250MB tape systems. We don''t recommend
    using these tapes for most systems due to the low capacity and slow speed. Most
    newer tape systems use either SCSI or ATAPI and have higher capacities and higher
    backup and restore stores.


    # Filesystems and Network File Systems


    If your machine is used for shell access, you may want to enable quota support.
    Quota support will also work with AppleTalk users since they are “real” users
    and have /etc/passwd entries. Depending on how Samba or IPX is set up, it may
    be useful to enable quota for their users as well.


    Leave mandatory lock support unless you know you''ll need it for newer AppleTalk,
    NFS, and/or Samba daemons.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# 17.6 Dive On In!


    Enable the second extended filesystem support. This is Linux''s native filesystem
    type. It will likely be safe to leave Minix, the first extended filesystem, and
    xiaiafs as they are older and not needed in newer Linux systems.


    It may be useful to enable the DOS- and Windows-related filesystem types since
    these are so ubiquitous. Enable them as modules unless you use them.


    Enable /proc. This is needed by several programs. You really should not even be
    given the option to turn it off.


    You will know whether or not you need the rest of the options: enable them as
    necessary. In particular, you will want to include CD-ROM (ISO9660) filesystem
    support.


    If you have a very heterogeneous LAN, you may want to enable virtually all of
    these for use with removable media (floppy, ZIP or JAZ drives).


    # Partition Types


    If you want to mount and use foreign partition types, enable them here.


    # Native Language Support


    If you enabled support for Microsoft filesystems, you can also enable support
    for internationalization and foreign language character sets here.


    # Sound and Low-level Sound Drivers


    If you use the console of the machine and have a sound card, you will want to
    enable support for it here. You will definitely need the manual for your sound
    card, as there are a number of hardware parameters you need to compile into the
    kernel.


    There are a large number of combinations of hardware and parameters—too many to
    cover here. If you are careful and keep your card''s manual handy, you should
    not have any serious trouble getting your card fully supported (at least as far
    as the current drivers will allow) under Linux. Some manuals can be a bit sparse,
    and you may have to fiddle with the settings to get your card working.


    Depending on the driver you enable on the Sound menu, you will be given options
    for additional drivers in the Low Level Sound Drivers menu.


    # Kernel Hacking


    Unless you are hacking and debugging the kernel, say No to Magic SysRq Key.'
