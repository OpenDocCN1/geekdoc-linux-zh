    Wine(http://www.winehq.com/) not an emulator, or so the authors say. Wine is really
    two components in one. First, it is a way of running many Win16 and Win32 applications
    under Linux. Second, it is a way of compiling Windows applications for use under
    Linux. Companies like Corel are assisting with Wine development since it will
    reduce the amount of time needed to port their applications to Linux. A full list
    of applications that are supported under Wine can be found at the Wine Web site.
    Additionally, Wine will run only on Linux for x86 chips.


    # VNC


    VNC stands for Virtual Network Console. Using a browser that runs Java, like Netscape,
    or a Java client that runs on any OS that runs Java, you can view a UNIX or Windows
    95/98/NT screen on a remote display. In a UNIX machine, you get a new X display
    started, and under MS Windows, you get control of the actual screen. This makes
    it similar to PCAnywhere. Using this, you can get an X display on Windows, or
    access a Windows machine from a Linux box. Very cool stuff.


