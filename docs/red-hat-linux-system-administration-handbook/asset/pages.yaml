    software. There is a strong emphasis on mechanisms and techniques to promote reliability
    and low bug rates.


    Eiffel is an open system and several commercial implementations exist. A GPL implementation
    exists as well. SmallEiffel is still in beta development, but is very usable.
    More information on it can be found at http://smalleiffel.loria.fr/


