  md: '# Chapter 6 • Networking with Linux


    Each Ethernet packet has to and from Ethernet addresses along with IP to from
    addresses, followed by the data, and finally some error checking to verify that
    a packet arrives complete. A typical Ethernet packet can be no larger than 1514
    bytes. IPv4 takes up 40 bytes, and the Ethernet framing takes up another 18 bytes,
    leaving a maximum of 1456 bytes of data.


    Even though all the other Ethernet adapters on a cable see a message, they do
    not answer or respond. The only message that all Ethernet adapters should receive
    is an Ethernet broadcast. Network monitors take advantage of this feature of Ethernet
    to give an overall view of a particular Ethernet run.


    For a packet (say an IP packet) to get across a network to another Ethernet run,
    a router is used. The router does not look at the Ethernet header, but instead
    looks at the protocol being used. If the router knows that a particular packet
    needs to be forwarded to another network, it forwards the packet.


    What allows Linux (and TCP/IP) to make connections to an Ethernet network and
    an IP address is the Address Resolution Protocol (or ARP) cache. When the Linux
    machine starts talking on an Ethernet network, it starts asking (via ARP) what
    the MAC addresses for other machines on the subnet are. Here is how it works:


    Linux first sends an Ethernet broadcast asking for a mapping from an IP address
    to a MAC address. The receiving end with IP address responds with an ARP reply,
    giving the IP address and its MAC address. Linux stores that MAC address in an
    ARP cache for future use. The cache times out every now and then, and this may
    happen several times a day. Don''t worry, though—there are plenty of 10 Mbps for
    everyone on the network. If a packet has to go through a router to somewhere else,
    Linux addresses the Ethernet packet to the router (or gateway), and the router
    then picks it up and forwards it to another network.


    In the reverse situation, the BOOTP protocol involves a Reverse ARP (RARP) that
    announces its MAC address, asking which IP address to use. For diskless machines,
    or even Windows machines using Dynamic Host Configuration Protocol (DHCP), this
    is the way that these machines can get themselves configured. A machine that has
    RARP or DHCP running responds with the IP address and other information (the gateway
    and nameserver, for example).


    Even though the Ethernet protocol is a standard, there are three main ways of
    implementing the physical layer. Thicknet is a 15-pin connection with heavy gauge
    wire that is no longer in use. The best thing you can do with a thick connection
    is attach a transceiver on it to convert it to another physical layer.¹ Thin,
    or coax, runs one line, which has all the Ethernet adapters tapping or T-connectors
    along the wire to con-'
