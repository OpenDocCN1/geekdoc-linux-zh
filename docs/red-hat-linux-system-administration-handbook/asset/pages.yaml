  md: '# Chapter 19 • Backing Up Your Data


    The cpio program has (at least count) a billion available switches to it. Much
    like tar, these can be shortened (by us anyway) down to a major ones you need
    to know about. These include: -F <file> to output to a file instead of STDOUT,
    -i for extract, and -o for create. These seem to make less sense than the tar
    commands, except for the fact that cpio thinks of the extract command as “copy
    in” and the create command as “copy out”.


    A few examples might clarify things. One of the simplest things you can do with
    cpio is archive the files in a directory (ignoring subdirectories):


    ```

    # ls cpio -o /tmp/stuff.cpio

    ```


    To include directories, you do this:


    ```

    # find -print -depth | cpio -o ~/morestuff.cpio

    ```


    To create the file on another machine (assuming you have permission, usually via
    an entry in ~/.rhosts):


    ```

    # find .print -depth | cpio -o -F Cary@loki:/archive/stuff.cpio

    ```


    To extract the files from the archive:


    ```

    # cpio -i < stuff.cpio

    ```


    Note that cpio will not preserve directory structure unless explicitly told to
    as follows:


    ```

    # cpio -id < ~/morestuff.cpio

    ```


    # 19.3 dump and restore


    dump is probably the best free copy of the filesystem. Because of this, any type
    of file (including sockets and block and character devices) can be archived and
    files that have empty blocks in them are properly saved. Additionally, it can
    perform incremental backups and archives can span multiple tapes. One final nicety
    is that dump has no limit on the length of file- and pathnames.


    Incremental backups are controlled by assigning a dump level to a particular backup.
    Dump levels range from 0 to 9, and when a dump of a certain level N is performed,
    all files that have changed since the last dump of level N-1 or lower are sent
    to the tape. As you might guess, a level 0 will dump the entire filesystem.'
