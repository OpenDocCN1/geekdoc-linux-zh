    versus http://www.ratosk.org/artists/surreal/d.html). This is typically something
    like /home/httpd/html or /home/httpd/htdocs (so the second URL above would retrieve
    /home/httpd/html/artists/surreal/d.html).


    +   2. Where are the configuration files? Typically, /etc/httpd/conf/, /home/httpd/conf/,
    /usr/local/etc/httpd/conf, or something similar is the directory used for these
    files.'
