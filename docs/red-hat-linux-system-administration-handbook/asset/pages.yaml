    # Reverse DNS


    If your machine is doing reverse DNS, the SOA is the same, but the records themselves
    are slightly different. First, as you can tell with named.boot, the IP address
    is reversed. Instead of the 127.0.0 network, it becomes 0.0.127-in-addr.arpa.
    Reverse the network you''re using and using that the domain in /etc/named.boot.
    Since the network for wayga.net is 208.197,103, the domain becomes 103.197.208-in-addr.arpa.


    The records for wayga.net and galileo.wayga.net would look like this we were doing
    reverse DNS:


    ```

    21 IN PTR galileo.wayga.net.

    125 IN PTR wayga.net.

    ```


    As you can see, the hostnames need a period (.) at the end, since reverse DNS
    can span physical IP addresses. The record type is also different—PTR. The IP
    address needs only the portion of the network not already in the domain listed
    above.


    Once this is complete, you can start named and verify your configuration with
    nslookup.


