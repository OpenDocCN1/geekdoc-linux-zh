  md: '# 8.4 SWAT (Samba Web Administration Tool)


    machine, and are by default stored in /var/log/samba, the log file for Samba''s
    interaction with If you have a host called ''saturn'' that uses Samba, the log
    is kept in /var/log/samba/log.saturn. To keep log files from getting too large,
    there is a default limit of 50KB per log. If the log file gets bigger than that,
    it gets backed up as an .old file and a new log file is created. A log file of
    0 means that there is no upper limit on log file size.


    # Tuning and Printing


    Here you can enter OS-specific tuning options, mostly related to the TCP/IP stack.
    You will probably not need to change from the default of TCP_NODELAY, which is
    said to be one of the biggest boosts in performance for sending data to a Windows
    client. You can check /usr/doc/samba-2.0.3/docs/textdocs/Speed.txt for more information
    on tuning Samba for high-performance environments.


    The printcap name contains the location of the printcap file. There should be
    no need to change it from the default of /etc/printcap.


    # Browse WINS Options


    These two sections are somewhat related, so we''ll cover both here. When an SMB
    network is set up on a local network, each of the machines in that network sees
    the others and has an election to see who will handle browse requests from clients.
    That is, when you start up the Network Neighborhood, where do you get the information?
    In an NT-only environment, this would be your PDC. In a Samba-only environment,
    this will be mbd (the Netbios daemon). In a mixed environment, it depends on the
    settings you have in these sections.


    The os level is a number that is really a bias in the election on the local network,
    and can be between 0 and 255. To give you a number to pick from, Windows 95 and
    98 clients have an os level of 2, and an NT server has a level of 32. Anything
    higher than this will win a local election, except against other Samba servers.


    If the preferred master is set, Samba will force an election on startup, and give
    itself a slight advantage in the election. If local master is set, Samba will
    participate in elections, with the os level specified earlier. The domain master
    option selects whether or not Samba will try to allocate a special Netbios name
    to collect workgroup information across subnets. If you have a PDC, you should
    set this to No, as the PDC will automatically try to allocate this special name.'
