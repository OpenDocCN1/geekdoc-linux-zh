    \ real *.ratostat.org\nclass ratostat-anon anonymous *.ratostat.org\n#\n# Lock\
    \ users from the group 'ftponly' to their home directories\nguestgroup ftpponly\n\
    #\n# Define the email address that will be substituted for the\n # %E magic cookie.\
