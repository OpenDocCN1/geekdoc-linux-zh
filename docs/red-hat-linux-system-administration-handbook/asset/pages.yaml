  md: '# System and Network Monitoring 18


    Keep an eye on your system and the rest of the network


    Monitor your Linux machine from the console or remotely using the syslog program
    and other utilities.


    # 18.1 Syslog


    The syslog program monitors kernel and user events and routes messages based on
    what you want to do. These events can be minor things, such as the root logging
    in, or they can be serious, such as a hard drive failure, kernel panic, or reboot.


    The syslog program gets started up at boot-time and uses the /etc/syslog.conf
    to know what to do. Here''s a sample configuration file:


    ```

    # Log all kernel messages to the console.

    # Logging much else clutters up the screen.

    #kern.* /dev/console

    ```


    ```

    # Log anything (except mail) of level info or higher.

    ```'
  merge: -1
  pgno: 336
- img_proc: true
  md: '```

    # Don''t log private authentication messages!    /var/log/messages

    *.info:mail.none;authpriv.none

    ```


    ```

    # The authpriv file has restricted access.

    authpriv.*                               /var/log/secure

    ```


    ```

    # Log all the mail messages in one place.

    mail.*                               /var/log/maillog

    ```


    ```

    # Everybody gets emergency messages, plus log them on another

    *.emerg

    ```


    ```

    # Save mail and news errors of level err and higher in a

    uucp.news.crit    /var/log/spooler

    ```


    Any line with a # in front of it is ignored because it is a comment. Other lines
    are entries and consist of two fields. The first field lists the events to monitor.
    The second field lists what to do once an event has occurred.


    Each event is in two parts, separated by a period. The first part is the facility,
    or type of program generating the event. The second part is the priority or severity
    of the event, ranging from debug to emerg.

    There are twenty facilities available:


    +   * auth

    * auth-priv

    * cron

    * daemon

    * kern

    * lpr

    * mail

    * mark

    * news

    * syslog

    * user

    * uucp

    * local0 through local7


    There are eight priorities available:


    +   * debug'
