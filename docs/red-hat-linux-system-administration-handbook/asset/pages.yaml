  md: '# Base Options


    The netbios name should be used if you want to have a shorter name that appears
    as the Netbios name. You probably won''t want to set this, but it can be done
    if your Netbios name gets set to your FQDN (see the section on smount for more
    on this). The server string sets the comment as it appears in a browse list. By
    default, it sets to Samba server, but you can change this to your needs. The interfaces
    field is used if your Samba server acts as a router or has multiple Ethernet interfaces
    on it. You can specify an IP network address and 192.168.1.0/24, known as a bitmask
    since masking the first 24 out of 32 bits, or 192.168.1.0/255.255.255.0, known
    as a bitmask. Put a space between the two entries here.


    # Security Options


    Here you list the kind of security you want to have. The first security option
    we described under “Password Authentication” above. If you have chosen to use
    encrypted passwords on your machine (after reading /usr/doc/samba-2.0.3/docs/ENCRYPTION.txt),
    set encrypted passwords to yes. The update encrypted setting is used to assist
    in building an encrypted password database. As users log in, their password is
    encrypted using the SMB hash, and then it is stored. Once all accounts have been
    encrypted in this format, you can turn the update encrypted off. The guest account
    is the account to be used when no authentication is provided. Some shares have
    no passwords to access them. Even in these cases, some valid Linux user must access
    the file on the Samba side. In this case, that user is “guest”.


    The hosts sets up a list of hosts (space-separated) to deny access to the server.
    can be either IP addresses or FQDNs, meaning an entry could have 192.168.1 or
    markk.wayga.net in. In the first case, you would block off the entire 192.168.1.0
    network, and in the second, you would block off access to a single machine. The
    hosts allow sets up hosts to be allowed access to the server. In the event of
    a conflict between a deny entry and an allow entry, the allow entry wins out.
    Going back to the example, the hosts allow could have 192.168.1.0 network, except
    for 192.168.1.5, which could access the server.


    # Logging Options


    As the log level increases, more data is captured to the log file. Setting a log
    level of 0 indicates that no logging is to be done. The logs are kept per'
