  md: '# Chapter 21 • Connecting to the Internet


    Another good test is to use a Web browser to try to pull up your favorite Web
    page, or telnet to a shell account provided by your ISP.

    After testing the link, execute ppp-off. After this, attempting to telnet to a
    remote host should come back with an error stating host not found.


    # Dial


    Dial, written by Eric Schenk, is available from http://www.dna.lth.se/~erics/dial.html.
    Dial is a utility used to automatically connect your machine via a modem or ISDN
    to your ISP when external data is requested. It will automatically disconnect
    when the connection has been idle for a specified period of time. If your PPP
    connection dies for some reason, dial will automatically try to reconnect. If
    you have a static IP and are in the middle of downloading the Linux kernel, this
    feature can be a real stress reliever. Have you ever downloaded 10MB over a 28.8
    and had the modem die the last 5 percent?


    Dial''s only system requirements are that you compile the kernel with SLIP enabled,
    and that you configure your connect protocol (PPP in these examples). Dial uses
    SLIP to monitor network traffic, and if a non-local IP is requested, dial tells
    the modem to dial out and connect to your ISP.


    Installation is as simple as obtaining the source code, unpacking it, performing
    a make depend, followed by a make, and then a make install as root. In the three
    versions we have installed on two machines, we have never had an error message.


    After installing the latest version (at the time of writing, there are three files
    that you will need to check. The first is /usr/lib/dial/dial.defs. This file is
    a list of internal filter rules for dial and does usually need to be touched.
    If you need to make any changes, refer to the dial pages on the format of this
    file.


    The second file to examine is /usr/lib/standard.filters. You may wish to copy
    this file to a different location and name, for example, /etc/dial.conf. While
    leaving it in /usr/lib should work, we have some problems that were solved by
    moving it to /etc/dial.conf, the location of the configuration file of previous
    versions of dial. This file is a list of services from /etc/services, and how
    many seconds each service will get of up-time. This doesn''t mean that if you
    are telnetting somewhere dial will automatically kick you off while you''re typing.
    What it means is after many seconds of idle time, dial will shut the modem link
    down. The default file is well-documented and easy to understand.'
