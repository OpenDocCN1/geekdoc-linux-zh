    sends one at least once a second. If a malicious cracker sends pings that were
    2K in size, it would flood a 28.8K modem link, making it unusable for downloading
    data, receiving email, browsing the Web, or anything else. The entire link would
    be taken up responding to pings. Linux has some protection against this, but any
    system is susceptible to it. Another similar attack involves sending SYN packets
