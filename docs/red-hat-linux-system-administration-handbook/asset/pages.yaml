    | primary a-muse.org named.a-muse |

    | primary 0.0.127.in-addr.arpa named.local |


    In this case, named.boot does all three things. The directory statement tells
    named that any references to files are going to be /var/named directory. Next,
    it says that the cache file is going to be for all domains and is kept in the
    named.ca file. The three primary statements say DNS information for hosts is provided
    in the wayga.net and a-muse.org domains, and the information about those hosts
    is stored in wayga.net and named.a-muse, respectively. The third primary statement
    indicates that any reverse DNS requests on the 127.0.0 network (also known as
    the loopback device) are be done by looking at the named.local file.


