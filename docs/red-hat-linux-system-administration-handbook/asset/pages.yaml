  md: '# 2.2 Preparing for the Install


    via their Web site and is recommended for users who are familiar with Linux. The
    cost for this release is about $40.


    The third release is the least expensive and most widely available. Red Hat makes
    a free version of their distribution available on their FTP site and mirrors.
    This release is free to modify, and many companies put this FTP distribution on
    a CD-ROM and sell it for about $2, plus shipping. Since Red Hat does not sell
    this, there is no manual, application CD, or telephone support. If you are very
    familiar with Red Hat, you can use this method. You may also choose this method
    if you want to perform an installation over the Internet via FTP or NFS.


    We should also note some of the distributions (such as Mandrake) that are based
    on the free Red Hat distribution, but have changes in the distribution that may
    not be to everyone''s tastes or needs. These distributions use the RPM package
    format, and in some cases, you may use the source code to compile Red. For example,
    Mandrake uses KDE as their default window manager instead of GNOME, which is used
    by Red Hat. Mandrake also compiled all the applications to make use of the Pentium
    chip. This makes applications faster on Pentium and above chip, but these these
    may not be as fast as 386- or 486-based machines. Aside from this, Mandrake 6.0
    claims to be 100% compatible with Red Hat 6.0, so much of what we describe here
    will work with Mandrake. Other distributions may differ.


    # 2.2 Preparing for the Install


    Below we give an overview of the installation process. In the next section, we
    cover some of the more problematic steps and give some examples.


    # CD-ROM


    If you have a newer motherboard that supports booting from CD-ROM (as well as
    a CD-ROM reader, obviously!) and are installing from a CD-ROM, you are in luck.
    The CD-ROM supplied is bootable and you do do not need to make boot floppies.
    You will need to check the documentation with your system or motherboard to determine
    how to boot from the CD-ROM, as many systems default booting from the first hard
    drive or floppy drive.


    Sun Sparacs and Alpha-based machines typically support booting from CD-ROM, and
    so they don''t require boot floppies.'
