  md: '# 19.4 Commercial Backup Products


    The dump program requires you to know the length and density of the media being
    used for the backup. In the case of devices using data compression, there is a
    virtual length associated with the device, which is simply the compression ratio
    times the actual tape length. It is usually best to be conservative; the compression
    ratio is really an average—not all files compress equally. If you over-estimate
    the amount of compression, dump will try to write after the tape has run out and
    the dump will be ruined.


    dump is one of the lowest-level methods for backing up your system, and it is
    also one of the least fault-tolerant. Unless you understand it and your backup
    device very well, you may want to choose another method of backing up your system.


    # 19.4 Commercial Backup Products


    # BRU


    The Backup and Restore Utility (BRU) is strongly based on tar but adds many more
    features. It runs a daemon that manages the backup schedule. It comes in two versions,
    the more expensive of which supports backing up NFS disks; the less expensive
    version works only on local disks.


    BRU also comes with a menu-driven interface in both X and ASCII. The concept of
    backup levels is supported, and backup targets can be any character device.


    Other features include the following:


    +   - Keeps track of the number of uses of a tape to help you decide when to throw
    out older tapes.

    - Contains powerful features for recovering data from corrupt archives.

    - Has support for NIS (Network Information Services, a networked system for passwd,
    group, and host files, and much more).

    - Has support for SMB (Samba) and Netware volumes.

    - Supports archives that span more than one backup device.


    BRU is available for Linux on the x86, Alpha, and PowerPC, and a lite version
    is included with the commercial version of Red Hat. See http://www.estinc.com/
    for more information.'
