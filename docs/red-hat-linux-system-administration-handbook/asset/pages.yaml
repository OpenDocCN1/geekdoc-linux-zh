    \ns00 Link encap:Serial Line IP\n  inet addr:111.222.333.444 P-t-P:555.666.777.888\n\
    \  Mask:255.255.255.0\n  UP POINTPOINT RUNNING MTU:1500 Metric:1\nRX packets:0\
    \ errors:0 dropped:0 overruns:0\n  TX packets:2 errors:0 dropped:0 overruns:0\n\
    \npp0 Link encap:Point-Point Protocol\n  inet addr:111.222.333.444 P-t-P:555.666.777.888\n\
    \  Mask:255.255.255.0\n  UP POINTPOINT RUNNING MTU:1500 Metric:1\nRX packets:5\
    \ errors:0 dropped:0 overruns:0\n  TX packets:5 errors:0 dropped:0 overruns:0\n\
    ```\n\n# 21.5 IP Masquerading\n\nThe Linux kernel is able to masquerade IP addresses\
    \ behind a single IP address. Also, note that currently, all forms of network\
    \ traffic are not supported. Common forms of traffic, such as mail (POP and SMTP),\
    \ telnet, FTP, Web (HTTP), news (NNTP), ping, and many more are supported. Some\
    \ other protocols (mostly UDP-related) are either not supported or require kernel\
    \ modules to be loaded. Red Hat has modules for IRC, RealAudio, Quake, FTP, cuseeme,\
    \ and others.\n\nThe simplest form of an IP masquerading firewall is two lines:\n\
    \n```\nichchains -P forward -j DENY\nichchains -A forward -i pp0 -j MASQ\n```\n\
    \nThese are known as firewall rules. The first line sets a default policy (-j)\
    \ to “deny” to all connections unless specifically stated. You can also do a default\
    \ policy of “accept,” but this would defeat the purpose of the firewall. The second\
    \ line appends (-A) a masquerade (-j) policy from the (-i) interface of pp0.\n\
    \nYou can find out more information about masquerading and rules for iptchains\
    \ in Chapter 16."
  merge: -1
