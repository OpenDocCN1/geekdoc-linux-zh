  md: "# 21.4 PPP 367\n\nsuggested to be used because they are security holes. We\
    \ suggest doing the following.\n\nThere are three main script/configuration files\
    \ for use with PPP. They are /usr/local/bin/ppp-on, /usr/local/bin/ppp-off, and\
    \ /etc/ppp-chatfile. For security reasons, ppp-chatfile should be owned by root\
    \ and file permissions should be set to 0600. This file will contain passwords\
    \ and UIDs. Also, pppd and chat should be SUID (chmod +s) to allow them to read\
    \ ppp-chatfile.\n\nThere are also security problems involved with this method.\
    \ A fully secure method would be to use a C wrapper program that calls ppp-on\
    \ and ppp-off. Both of these scripts should then be set with permissions of 0700,\
    \ and pppd and chat should have the permissions set to 0100. The ppp-on script\
    \ should check the ownership and file type of ppp-chatfile and make sure the lock\
    \ directory is owned only writable by root. This will ensure that a PPP session\
    \ can only be started with the flags set in ppp-chatfile and that no non-root\
    \ user can create his/her own file to dial out.\n\n/usr/local/bin/ppp-on should\
    \ read\n\n```\n#!/bin/sh\n# ppp-on\n# Set up a PPP link\n\nLOCKDIR=/var/lock\n\
    DEVICE=modem\nOUR_IP_ADDR=111.222.333.444\nREMOTE_IP=555.666.777.888\nNETMASK=255.255.255.0\n\
    CONNECT_SCRIPT=\"/usr/sbin/chat -v -f /etc/ppp/ppp-chatfile\"\n\nif [ -f $LOCKDIR/LCK$DEVICE\
    \ ]\nthen\n  echo \"PPP device is locked\"\n  exit 1\nfi\n```\n\n/usr/sbin/fix-cua\
    \ $DEVICE\n\n/bin/stty 19200 -tstop\n\n/usr/sbin/pppd asyncmap 0 lock netmask\
    \ $NETMASK defaultroute modem\ncrtscts \\ $OUR_IP_ADDR:$REMOTE_IP /dev/$DEVICE\
    \ connect\n\"$CONNECT_SCRIPT\""
  merge: -1
  pgno: 380
- img_proc: true
  md: "For most applications, only OUR_IP_ADDR will change. If you have a\nstatic\
    \ IP, place it here; otherwise, change it to 0.0.0.0 to obtain a dynamic IP.\n\
    Note that some ISPs will provide you with a static IP number, even if you\nleave\
    \ this as 0.0.0.0. Also, the -v option, included in CONNECT_SCRIPT for\ndebugging\
    \ purposes, may be removed. The -v flag will log the conversations\nthat it had\
    \ with your ISP to /var/log/messages.\nYou may also have to REMOTE_IP, sometimes\
    \ referred to as the gateway.\nSome ISPs will automatically supply it during PPP\
    \ negotiation.\n\n```\n/usr/local/bin/ppp-poiff\n#!/bin/sh\nDEVICE=ppp0\n\n# If\
    \ the ppp0 pid file is present then the program is running. Stop it.\nif [ -r\
