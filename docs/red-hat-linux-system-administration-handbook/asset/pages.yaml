  md: '# Linux Boot and Shutdown


    What happens when you boot? What happens when you shut down the machine?


    Booting Linux is not like starting DOS, but the concepts are somewhat similar.


    The first process that Linux kicks off once the kernel has entered memory and
    the root (/) partition is mounted is init. The init process is always process
    1. Killing this process will do the same thing as running halt or shutting down.
    The advantage to the Red Hat startup method is that it''s the same as other commercial
    operating systems (OS) such as Solaris 2.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# 3.1 LILO


    # Configuring the Linux Loader


    The LILO program allows you to select a boot partition for your system. If you
    have multiple operating systems (Linux, Windows 98, NT, etc.) all on different
    partitions and want to choose one to boot, LILO will let you do this.


    In addition, LILO allows you to send boot parameters to the kernel before it starts
    up, much as the Sun architecture allows you to send boot parameters to Solaris.
    For example, you can specify the root drive and what devices you have installed,
    and pass instructions to the `init` command.


    # The Boot Prompt


    When you start your machine after installing Linux, you will probably have the
    LILO prompt awaiting your command. At this point, you can choose to boot whatever
    operating systems were configured previously (Linux or DOS, for example). If you
    starting something like DOS or Windows 95, there isn''t much you to worry about,
    and you can just type in DOS, Win95, or however you configured LILO when it was
    installed. If you forget, you can press the TAB key to see a list of what operating
    systems LILO knows about will boot.


    If you are starting Linux, there''s a bunch of configuration parameters you can
    add to the name you use to start Linux. For example, let''s say that we configured
    the startup name to be `linux`.


    root=partition—This signals Linux to use a different root partition than what
    is configured in the kernel. When you build Linux kernel on one system, it assigns
    a default of what the current root partition is. For example, if you build a Linux
    kernel on an SCSI-based machine with the root partition on the first drive, first
    partition, Linux will assign the boot device to be `/dev/sda1`. If you were to
    put this kernel on a floppy drive and use it to boot an IDE-based system, it would
    not boot correctly since there is no SCSI system to boot off of. Adding `root=/dev/hda1`,
    for example, would tell the kernel to boot off of the first IDE drive, first partition.
    So, the same kernel can be used for multiple systems.


    > ¹ Assuming, of course, that all the drivers that each system needs are installed.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# 3.1 LILO


    ro—This signals Linux to mount the root filesystem in read-only mode. No changes
    can be made to the filesystem when in read-only mode. The advantage is that the
    startup scripts can perform a filesystem check (fsck) to verify the integrity
    of the filesystem. If fsck succeeds, the root partition is mounted read-write
    and normal boot continues. If there is a problem with fsck, the partition remains
    in read-only mode and the administrator will have to either do a manual fsck or
    reload from tape if the problem is. Read-only mode is used by default, so it would
    be rare for you to need this flag.


    rw—This signals Linux to mount the root filesystem in read-write mode, as opposed
    to read-only mode (see above). This is dangerous, since a file system check of
    the root filesystem cannot be performed.


    mem=Some BIOSes will not recognize 64MB of RAM in your system. Since Linux recognizes
    the BIOS to tell it how much memory is installed, systems with more than 64MB
    of RAM will be incorrectly reported. The mem= option tells Linux to ignore the
    BIOS and determine how much memory there is. You can either use a hexadecimal
    address (mem=0x1000000, which is 16MB) or a number followed by k or M (16384 or
    16M).


    NOTE: If you lie here and tell Linux 128MB when you really have only 64MB, it
    will crash at some point. Also, due to paging and some BIOS settings, you may
    not have the full amount of memory accessible to your system. Check your BIOS
    or motherboard documentation for how much memory is used.


    Additionally, the Linux 2.2 kernel is better at recognizing more than 64MB on
    most motherboards. We leave this in case you need to use it.


    debug—Kernel hackers may want to use this when booting experimental kernels. Kernel
    messages are sent to the screen instead of being sent to disk or to the syslog
    facility. Most users may not need this.


    init=Specifies what program to boot as the init program. Normally, the kernel
    looks for /sbin/init, /etc/init, then gives up and runs /bin/sh. This way, if
    the init program is corrupted, you can still get into the system.


    panic=Whenever your kernel panics, it normally waits for the administrator to
    come and physically press the power or reset switch. This option will allow the
    kernel to try to reboot x seconds after a panic. For example, a setting of panic=60
    will have the kernel try to reboot 60 seconds after a panic.'
  merge: -1
