    location for packets that do not match any other route to. In this case, it

    go onto the 192.168.1.0 network to the machine with an IP address of

    192.168.1.15. If this machine were acting as a company-wide router, this

    address would point to the router box installed by the ISP. Since Linux now

    know how to route packets between the 1.0 and 2.0 networks, any packets

    that get directed to it go to a network will automatically be sent there.

    192.168.1.10 and 192.168.2.10 now become gateways for anyone on those

    respective networks.


    This example shows how to use static routing. There are other meth-

    of routing, such as RIP (which is handled by routed), and OSPF (han-

    dled by gated). Since the networks we administer are not large, and that

    many configuration issues are only in a few locations, we prefer to use static

    routes so we know exactly what our networks look like. For some networks,

    y may need the above programs.


    If you replace eth0 with ppp0, you now have a routing PPP dialin.

    The Linux machine is dialed into another machine, and is able to route data

    bween the local Ethernet network and the remote PPP link. As previously

    mentioned, this method works for any two (or more) IP connections.


    # Security Issues


    By default, all packets are allowed to pass between connected networks. If

    you want to implement some sort of security to prevent violation attempts,

    you''ll need to get familiar with the built-in packet filtering tools ipfwadm
    and

    ipchains. The older 2.0 and 2.1 kernels used the ipfwadm command to

    implement packet monitoring, filtering, and accounting. The newer 2.2 and

    2.3 kernels use ipchains, which implements all the functionality of ipfwadwm

    plus some. See the next chapter for information on how to boost security

    between networks.'
