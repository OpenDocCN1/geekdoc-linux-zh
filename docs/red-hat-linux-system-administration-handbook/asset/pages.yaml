  md: '# 8.2 Installing Samba


    # Password Authentication


    Even if you see the Linux machine listed in the browse list, you still need to
    connect to a share. First, there are public connections that do not require a
    valid login. These kinds of connections are easy to make, but are very short on
    security, since there is no authentication. However, it is a good start for making
    sure you can mount shares. If you choose to do this, the public=yes option in
    the configuration for the share.


    Let''s assume you have this working (since it''s not that hard to do). Let''s
    go into connecting to a share. To do this, you have to understand how SMB transfers
    passwords.


    There are three methods of authenticating a user to access a share. First is user,
    where a username and password are authenticated against /etc/passwd. This method
    of connection requires the username under Linux and the SMB client match. When
    a user logs into Windows 98, the username and password given at the login screen
    are sent to Samba.


    The second method is to forward authentication requests to another server. This
    is insecure, but allows Linux to handle encrypted passwords, such as those from
    NT 4 running Service Pack 3 and above. This is called server authentication, and
    you have to trust the machine to which you are forwarding requests.


    The third method of authentication is called share and does not require the usernames
    under Linux and the SMB client match. When a connection is made to a share, many
    SMB clients (like Windows 98 or NT) ask for a password each time the share is
    connected.


    SMB allows for both encrypted and un passwords. The good news is that encrypted
    passwords increase security. The bad news is that passwords are encrypted with
    a one-way hash. Passwords in /etc/passwd and the Samba password file (smpasswd)
    don''t mix all that easily. NT 4 Service Pack 3 and above send encrypted passwords
    by default, and the only way to change this is to go into the Registry and change
    it. In our opinion, there are two ways to handle this. If you have an existing
    PDC (Primary Domain Controller), set the Linux box to forward passwords to the
    PDC. You can do this by setting the password server to the PDC and security=user
    (both settings are under [Global]). The other option (if you don''t have a PDC)
    is to set up the Linux box to handle encrypted passwords. Read the /usr/samba*/ENCRYPTION.txt
    file to go over what you need to do to handle encrypted passwords.'
  merge: -1
