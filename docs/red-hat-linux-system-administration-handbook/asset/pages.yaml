    # 6.5 Network Information Services (NIS and NIS+)


    The Network Information Services (NIS) is a set of programs for managing

    users and various network services from one master server. Recently, an

    enenhanced version of NIS, NIS+ has been introduced. NIS+ is more secure,

    works better in large networks, but is more difficult to set up.


    NIS began as Yellow Pages. Yellow Pages, however, is a registered

    trademark of British Telecom, so the name was changed. The original name''s

    legacy is still around since most of the programs associated with NIS begin

    with “yp”.


    NIS stores its information in a set of directories and GDBM (GNU Data-

    Management) files rooted in /var/yp. NIS refers to these files as

    “maps”. The maps are then available to other machines in the NIS

    domain (not the same as a DNS domain!) via RPC (Remote Procedure

    Calls). NIS also allows for secondary slave servers. Slave servers get their

    maps from the master and answer requests if the master is slow, much which (and

    only one) NIS server on it. Since clients can request NIS information

    through an IP broadcast, there should be no NIS slave server per subnet.

    Each of these slaves points to the NIS server.


    NIS maps are built from the various setup files found mostly in /etc:

    passwd, group, hosts, services, aliases, and so on. It is not necessary to use

    every map. Only the password and group maps are used, since most of

    the other files change infrequently.


    One of the biggest problems with NIS is the security hole opened by

    broadcasting NIS requests. Anyone could set up a server that would have a

    chance of answering the requests. Recent versions of ybind allow the speci-

    ification of the domain server either by IP number or name.


    # NIS Client Setup


    It is most likely that your first encounter with NIS will be as a client. Setting

    your Linux machine to be an NIS client is fairly straightforward.


    Red Hat makes the process of working in an NIS network easy with two

    scripts included with the system: /etc/rc.d/init.d/ypbind and /etc/'
