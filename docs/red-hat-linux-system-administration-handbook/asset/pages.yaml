  md: '# Linux SMB Connections


    So now that you have the Windows machines talking to the Linux box via Samba,
    how do you get access to SMB shares from Linux? Easy: by using the client side
    of Samba and other SMB utilities for Linux.


    # smbfs


    Linux has a Virtual File System (VFS) that provides a generic interface for mounting
    filesystems. One advantage of this is that it provides for mounting an SMB share
    like NFS or local mounting. However, instead of mounting, we use the smbmount
    program, which is part of the smbfs RPM, The umount program can be used to unmount
    mounted shares.


    Operation of smbmount is a bit more complicated than mount, but you''ll get to
    use it for after a while:


    ```

    smbmount mount-point [options]

    ```


    where service is the Netbios name of the SMB share you want, replacing a character
    with /. A sample service is //nebula/users or //auratek/market. The mount-point
    is the local mount point in the Linux file hierarchy.

    Since you have to use smbmount as root, and you probably don''t have a root user
    on your NT server, you''ll need to make use of the options. The two we run into
    are -U for what user to authenticate as, and -c to list a Netbios name for your
    client machine, otherwise the FQDN is sent. markk.wayga.net isn''t a valid Netbios
    name, adding-c wayga tells the server''s client is just wayga. If the name can
    be resolved to a hostname, you''ll get asked for a password for the given user.
    If you want to skip this step, add -P passwd, replacing passwd with your password
    on the SMB server.


    There are two big drawbacks using smbmount. Since SMB doesn''t translate UID or
    GID per file, you won''t get any of that information in directory listings. And,
    due to the nature of NFS and SMB, you won''t be able to mount an SMB share and
    export it via NFS. Keep these in mind, and


    # smbclient


    The smbclient program is part of the Samba distribution and provides an FTP-style
    interface to an SMB server. This is really written for use by operat-'
  merge: -1
