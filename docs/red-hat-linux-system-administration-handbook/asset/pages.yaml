    # 13.2 C++


    ```

    http://www.accu.org/

    ```


    C++ is an object-oriented, compiled language whose roots lie in C (as its name
    suggests). It is not as popular as C, mainly because both it and OOP are younger
    than C. C++ and C mix very well together. It is easy to link object files from
    either language and mix the two languages within an application. VRWeb, a VRML
    scene viewer, and MySQL, a freeware database server, are two applications that
    do this. Since windowing systems are thought of as object-oriented, many libraries
    and programming for X are done solely in C++ (like the Qt library).


    GNU''s g++ is the C compiler shipped with Red Hat. To dispel a common misconception,
