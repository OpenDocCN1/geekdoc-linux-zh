    For normal VGA modes, this is the x_VGA file. Going from there, the Mach32 server
    is called xF86_Mach32, the S3 server is called xF86_S3, and so on. Since these
    servers are included on the Red Hat CD-ROM as .rpm files, you can easily install
    the desired server. See the chapter on RPM for more information on installing
    .rpm files.


    The XF86config program allows you to set up some default video modes. Starting
    the program as root gives you a few configuration screens and some text to read.
    Then you get into the configuration section. Select your mouse type (Microsoft,
    MouseSystems, Bus, etc.). The preference is to select a three-button mouse, since
    X will allow you to use all three buttons. If you select a two-button mouse, you
    need to press the left and right mouse buttons to simulate the middle button.


    The next options depend on the type of mouse you selected. If you selected a three-button
    mouse, then you won''t need to select Emulate3Buttons. Next you''ll need to enter
    the location of the mouse, which may be /dev/mouse. If /dev/mouse does not exist,
    the /dev/file that has your mouse is. Remember that COM1: under DOS is /dev/tty0
    under Linux, and so on. A few other options may follow, including using the ALT
    key as the "meta" key to generate characters not normally available on your keyboard.


    > When you Emulate 3 Buttons later on, this is what it''s talking about.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Chapter 15 • X Windowing System


    Next is the monitor configuration section. This is where you need to know the
    horizontal sync range. There are nine predefined monitors you can choose from,
    and a tenth allows you to define your range.


    WARNING: Be sure that the numbers entered here are correct, because a wrong monitor
    and video card pair can damage your monitor, video card, or both.


    Next is the vertical sync. Here you have a choice of about four monitors, plus
    one to let you define your own. Once the vertical sync is set, you can enter information
    about your monitor. This section isn''t necessary, as it allows XFree86 to use
    multiple monitors at the same time. You can either press ENTER and use the default
    for each, or enter a unique identifier for your monitor, along with a vendor name
    and model name.


    Once this is completed, you set up the video card. It''s important to select the
    correct video card because two video cards from the same vendor have very different
    hardware internally. Selecting the wrong card can damage your card or monitor.


    Now you get to select the type of server to run. If you selected a video card
    that has an accelerator chip supported by XFree86, you''ll be able to select that
    X server.


    The options are as follows:


    +   1. The XF86_Mono server, which has 640x480 resolution with two colors, black
    and white. This should work for all VGA cards. If you suspect a problem with your
    video card or are unsure of the type of video card you have, this may be a good
    starting point.

    2. XF86_VGA16 server, which is also 640x480, but with 16 colors. This should also
    work with all VGA-compatible cards.

    3. XF86_SVGA server, which provides super VGA (SVGA) resolutions with 256 colors.
    Most SVGA cards will work with it, but may not have the best acceleration.

    4. Accelerated server, which is for accelerated cards. This gives more than 256
    colors for most servers, and higher resolutions. These servers also utilize any
    of the faster chipsets in most modern video cards.

    5. The server for the video card you selected earlier.


    If you select the fifth option, the best server for your card is set up for installation.'
