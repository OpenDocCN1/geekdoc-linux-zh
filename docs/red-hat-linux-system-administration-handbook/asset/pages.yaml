  md: "# Appendix B\n\n 34-223 UNALLOCATED\n\n 224-254 LOCAL USE\nAllocated for local/experimental\
    \ use\n\n     Please note that MAX_CHRDEV and MAX_BLKDEV in\nlinux/include/linux/major.h\
    \ must be set to a value\ngreater than the highest used major number. For a\n\
    kernel using local/experimental devices, it is\nprobably easiest to set both of\
    \ these equal to 256. The\nmemory cost above of using the default value of 64\
    \ is 3K.\n\n 255 RESERVED\n\n# Additional /dev Directory Entries\n\nThis section\
    \ details additional entries that should or may exist in the /dev\ndirectory.\
    \ It is preferred that symbolic links use the same form (absolute or\nrelative)\
    \ as is indicated here. Links are classified as “hard” or “symbolic\"\ndending\
    \ on the preferred type of link; if possible, the indicated type of link\nshould\
    \ be used.\n\n# Compulsory Links\n\nThese links exist on all systems:\n\n+   /dev/fd\
    \ /proc/self/fd symbolic File descriptors\n/dev/stdin /fd/0 symbolic stdin file\
    \ descriptor\n/dev/stdout /fd/1 symbolic stdout file descriptor\n/dev/stderr /fd/2\
    \ symbolic stderr file descriptor\n\n# Recommended Links\n\nIt is recommended\
    \ that these links exist on all systems:\n\n+   /dev/XOR null symbolic Used by\
    \ iBCS-2\n/dev/nfsd symbolic Used by iBCS-2\n/dev/core /proc/kcore symbolic Backward\
    \ compatibility\n/dev/scd? /dev/cd? hard Alternate SCSI CD-ROM name"
