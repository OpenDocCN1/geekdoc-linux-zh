    replacement, correcting misspelled URIs, and tracking users through the site using
    cookies. New modules are being added all the time and are not shipped with the
    source. Check the Apache Web site for the most up-to-date list.


    # 14.7 Streaming Audio and Video


    Streaming is an alternate way to deliver content. Rather then waiting for an entire
    file to download before starting it, the data are displayed as they are sent (more
    or less; there is some buffering). This, of course, means that the client can
    start displaying the data much sooner. Additionally, it is easy to send and output
    streams from streaming input (as opposed to a static file).


    With the rising demand for multimedia content on the Web, sooner or later (probably
    sooner!) you will need to be able to serve streaming audio and video from your
    Web server. Lucky for Linux, RealNetworks makes its RealServer for Linux.


    The basic version is free and intended for personal and single-site use (i.e.,
    ISPs do not get to use the free version). Installation is as simple as uncompressing
    the distribution file, running the setup script, and answering some configuration
    questions.'
