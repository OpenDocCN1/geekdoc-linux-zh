    # CGI and SSI


    The Common Gateway Interface (CGI) and Server Side Includes (SSI) are the two
    most common ways to execute external programs. CGI is designed to both receive
    and send information from and to the server. SSI is one-way; mainly it sends information.
    SSI can do more than simply call external programs. It can also include files,
    echo some simple system information such as the local time, and execute CGI.


    Perl is the preemptive language for CGI programming. This is something of a double-edged
    sword. On one hand, large collections of “canned” scripts for various common CGI
    tasks exist. It also has powerful features for processing strings, involving a
    large set of regular atoms and operators. Since CGI frequently involves large
    amounts of text processing, this helps to fuel Perl''s popularity. On the other
    hand, Perl is not the easiest to learn, nor is its syntax particularly easy to
    read (there are Perl contests!).


    After Perl, there are several languages that are popular for use in CGI programs:
    Python, Tcl, and Java. Additionally, there are languages that can be embedded
    in HTML and parsed by a CGI program; PHP (discussed later) falls into this category.
    The PHP parser can also be embedded into Apache and servers based on it.


    The number of books published on CGI is considerable and they cover the topic
    more thoroughly than is suitable for us to do here. One criticism of most of the
    literature is that it tends to focus nearly entirely on Perl, ignoring, for the
    most part, C, Python, and other languages. C, in particular, is very useful, as
    a compiled language, CGI written in it is faster and lighter weight. Of course,
    development times in C are much longer.


    At this point in time, all of the languages mentioned have more or less equivalent
    extensions/modules/libraries for dealing with the peculiarities of CGI and interlacing
    with everything from TCP/IP sockets to the operating'
