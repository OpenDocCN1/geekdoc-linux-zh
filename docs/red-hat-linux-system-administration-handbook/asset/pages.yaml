  md: '# Apache


    The Apache configuration and compilation are straightforward. Move into the source
    directory, edit the file Configuration, and make the changes indicated at the
    end of the PHP make. The configuration file is loaded with various modules you
    can disable or enable by commenting or uncommenting the appropriate lines in the
    file. In general, the slimmer you can make the server, the better. Comment out
    what you obviously don''t need. If you''re not sure, leave the module in. If you
    anticipate large numbers of users to authenticate, you will probably want to enable
    a database-based authentication scheme using (dbm, MySQL, or mSQL). A complete
    list of modules and their descriptions can be found at http://www.apache.org/


    After you have finished editing, run the Configure script and then make. If you
    have linking errors, 90 percent of the time they can be solved by rearranging
    the list of libraries in LFLAGS in the Configuration file. Most of the rest of
    the time it is simply a forgotten library or library path. Persevering though
    a little trial and error should result in http binary. After testing the server
    a little, you will likely want to strip it to save on memory requirements.


    If you still get your server to link, the best forums for help will be the PHP
    and/or MySQL mailing lists, unless you believe the problem is unrelated to the
    addition of these packages.


    Now check httpd.conf and srm.conf.

    Under Linux, Apache is commonly set up as:


    +   * The httpd binary lives in /usr/sbin.

    * The logs are kept in /var/log/httpd.

    * The configuration files are in /etc/http/conf.

    * The document root is /home/httpd/htdocs.


    All of these are alterable. Obviously, you can keep the server binary wherever
    you choose. The configuration files'' location is settable on the command line,
    and the log location and document root is settable in the configuration files.

    To tell Apache .php files with the embedded PHP parser, add a line like this to
    your srm.conf:


    ```

    AddType application/x-httpd-php .php3

