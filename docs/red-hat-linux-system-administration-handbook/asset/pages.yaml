  md: '# Chapter 6 • Networking with Linux


    PPP depends on one machine running pppd server on one end of the phone line, and
    a pppd client running on the machine dialing up (yours). Unlike Ethernet, you
    have to configure the software differently, depending on whether you''re the client
    or the server.


    PPP doesn''t quite have the overhead of Ethernet since no MAC addresses are used.
    Also, some compression is added to the IP frames to boost the amount of data that
    can be sent in a packet.


    Like Ethernet, PPP can carry more than just IP traffic. It can route IPX, AppleTalk,
    or DECNET along with IP over a PPP link. Linux does not really take advantage
    of this functionality, but many people need it. Since SMB packets can be encapsulated
    inside TCP/IP packets, you can use Samba or NT shares over a dial-up line from
    Linux.


    # PPP Client


    Setting up a PPP client requires a modern, phone line, a PPP server at some phone
    number, and PPP support compiled into the kernel. Check the dmsg command to see
    if PPP support has been compiled into it. You can also check the /lib/modules/
    directory for ppp.o and see if it was compiled as a module. If support is not
    compiled into it, recompile the kernel and reboot using the new kernel.


    The quick way of verifying a PPP connection is by doing something similar to the
    following:


    ```

    pppd connect ''chat -v "*" ATDTphone CONNECT " login: login word: \

    /dev/cual 38400 debug crtscts modem defaultroute

    ```


    The phone, line and password are assigned to you by whoever is providing the PPP
    account. Also, change /dev/cual to be the location of your modem. Remember that
    /dev/cual under Linux is the same as COM2 under DOS and Windows. The chat command
    is used to dial the modem and provide the login and password information. Once
    chat returns success (that is, once it makes a successful connection), PPP takes
    over the line and starts a connection. The server and client negotiate settings
    like Maximum Transit Units (MTU), compression, and a few other settings. This
    will take a few seconds, but once it''s done, you should be able to use the /sbin/ifconfig
    command to examine the network connections. If you see a ppp0 listed, you''re
    ready to go.


