    # 14.2 Hardware Issues


    One of the primary considerations if you are using a forking server or lots of
    interpreted CGI is memory. Each server child obviously takes up at least as much
    memory as the size of the executable. Each CGI script requires the loading of
    its respective interpreter. Dynamic linking of the executables can alleviate the
    problem to some extent. There are four subsystems that you need to consider beyond
    the choice of a good personal computer interconnect (PCI) motherboard: memory,
    CPU, hard disk, and network. The PCI has a bus throughput of 133 Mb/s, which is
    several times faster than even an ultra SCSI 3 adapter, and thus is simply well-equipped
    to handle fast peripherals.


    However, there is no substitute for more RAM—swap space (your hard disk is pitifully
    slow compared to on-board memory), not CPU (if you are swapping to disk, your
    disk is what''s slowing you down), and not a faster network card. RAM is cheap;
    buy a lot of it.


    After RAM, the next most important subsystem is either disk or CPU, depending
    on the peculiarities of your site. If you make extensive use of CGI, SSI, or database
    transactions, you will probably want to put a little more CPU in your system.
    A note here: Don''t bother with MMX CPUs. There''s really no gain to be had in
    this situation; just get a faster CPU for the same price, or put the money into
    RAM or the hard disk.'
