  md: '# Linux Database Software 12


    Linux has benefited in the realm of DBMSs by being a UNIX-like OS. A number of
    software vendors have ported their database servers to Linux. Better yet, a few
    have been developed under Linux. In the last year or so, major commercial database
    makers have also made versions of their systems for Linux.


    This chapter actually started as a section, but it got so big and DBMSs are becoming
    such an important aspect of computing, we made it a chapter. We first talk about
    two very popular, lightweight servers in detail. Then we have a less detailed
    listing of other native database servers. Finally, a description of a couple of
    databases with partial Linux support round out the chapter.


    This is not an attempt to enumerate every database server for Linux. It is a list
    of databases we''ve used and/or found interesting. For a more complete listing
    of commercial databases, see the Linux Commercial HOWTO.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 202 Chapter 12 • Linux Database Software


    Lastly, let''s go over a few acronyms and terms for those of you who are not familiar
    with the world of databases:


    +   * SQL—Structured Query Language, a language for performing queries on relational
    databases.

    * DBMS—Database Management System.

    * Key—A column or set of columns that organizes a table. Often, but not always,
    keys will be unique, that is, a particular combination of values of the columns
    that make up the key must be unique (for one-column key, this means each value
    in the column must be unique).

    * Schema—An interrelated set of tables and/or databases. Also a description of
    how a set of tables are joined via keys.

    * RDBMS—Relational DBMS.

    * ODBMS—Object Oriented DBMS.


    # 12.1 MySQL and mSQL


    These two servers are often mentioned together as they developed somewhat in parallel
    and MySQL was initially based off of mSQL. Both are used for similar tasks as
    well.


    # mSQL


    mSQL stands for mini-SQL, a shareware database server (free for non-commercial
    use). It supports, as its name suggests, a subset of the normal SQL specification.
    Additionally, it has some extensions to mSQL. Before we go further, it is probably
    best to list what mSQL can''t do so you can decide if it''s worth your while to
    use it for your particular application.


    +   * There is no grants database or “logging in” to the database. Access is granted
    to users listed in /etc/passwd to read and/or write on a per-data-base basis.

    * Databases can be accessed locally via a UNIX domain socket or remotely via a
    TCP/IP socket. If you grant TCP/IP access to a database, you do so for all usernames,
    even though the username on the remote host is not necessarily the same person
    as on the local system. There is no method for finer grained remote versus local
    access control.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# 12.1 MySQL and mSQL


    +   - It does not support the BLOB data type and is thus not really suitable for
    storing large blocks of data.

    - It has no ALTER command. This means that, for example, once a table is created,
    columns cannot be added, removed, or changed. While you may think that careful
    planning can minimize the inconvenience of this, don''t. Invariably, some outside
    force, be it a new product, new marketing strategy, or simple oversight will force
    you to alter your carefully planned database schema.

    - It is single-threaded, meaning it can only process one query at a time. As long
    as the load is not too heavy and the queries are not too complex, this shouldn''t
    be a problem. What exactly too heavy and too complex mean will depend on your
    system and may require some experimentation on your part.


    Despite these shortcomings, mSQL is still a useful database server. For small
    datasets with a simple schema and low likelihood of simultaneous accesses, it
    is well-suited. There are several other reasons you might want to use mSQL:


    +   - It is lightweight, consuming only a small amount of system resources when
    simply running (as opposed to monsters like Oracle or Sybase, which require many
    megabytes of RAM simply to start up).

    - It is free for non-commercial use and the shareware fee for commercial use is
    only $200.

    - It has a large install base and widespread support out the ''net''.

    - As a side effect of its popularity, most of the more popular languages have
    support for mSQL: C (the API is for C), Python, Java, Perl, PHP.

    - It has two enhanced LIKE operators: RLIKE, which allows use of the regular expression
    library, and CLIKE, which is case-insensitive. Since there is a separate RLIKE
    that implements REGEX, and CLIKE and CLIKE do not need to and thus are faster
    than most other SQL operators, which typically implement at least a subset of
    regex''s functionality.


    # Lite and W3-mql


    These two additional packages are part of the standard mSQL distribution. Lite
    is a scripting language designed for use with mSQL. Its syntax is similar to Perl.
    Its variables are dynamically typed, arrays are dynamically sized,'
  merge: -1
