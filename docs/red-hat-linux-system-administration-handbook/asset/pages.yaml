  md: '# 15.5 Using X Window Managers


    # KDE


    In case you ever wanted the functionality that Windows 98 has without all the
    excess baggage, there’s KDE. Like Windows 98, many of the functions of the desktop
    are integrated with the application software. KDE comes with its own HTML browser
    that, while not as full-featured as Netscape, does the job quite-well. The only
    drawback is that for applications to take full advantage of KDE, they have to
    be written to work with KDE, and they the Qt library. However, there are a number
    of applications already written in KDE from CD players to editors to games.


    When KDE is installed on a system, you can switch to KDE as your default window
    manager by using the switchdesk command. This will allow you to change window
    managers and select KDE, GNOME, or AfterStep.


    Once that’s done, you can start X and KDE will start with default settings. One
    feature of KDE (and GNOME, for that matter) is that both can run each other’s
    programs, so you could have a GNOME-based application running within the KDE window
    manager. GNOME also share drag-and-drop functionality, you could drag from a GNOME
    application to a KDE application and the data will get transferred correctly.


    # The Desktop


    By default, the KDE screen looks like a jungle of collects from Windows 95, MacOS,
    and CDE. That intentional. The top menu bar contains a list of running programs,
    no matter what virtual screen you are in. The bottom menu bar contains the Start
    button (which looks like a large ‘K’) and icons representing other menus or applications
    along the width of the bar. The center contains a list of the virtual screens
    available. By default, four virtual screens are started. To the immediate left
    of these tabs are two small buttons, one an x and the other padlock. The x will
    quit KDE and X, returning to character mode. The padlock will lock the screen.
    We’ll get to configuration of this later on. The right side contains “docked”
    applications. These are applications that may be running in the background, but
    not necessarily require a window. This is similar to the docked applications you
    see under Windows 98. Sample applications that this include the PPP dialer, malay
    programs, Kpilot (for 3Com PDAs), and language settings. To the right of these
    docked applications are the current date and time.


    You’ll note that spaces at the far left and far right of this menu bar contain
    small arrows pointing offseason. These arrows allow you to collapse the entire
    bar to the left or right side, hiding it from view altogether. If you click one
    of the arrows, you’ll see the bar collapse and be replaced with a'
