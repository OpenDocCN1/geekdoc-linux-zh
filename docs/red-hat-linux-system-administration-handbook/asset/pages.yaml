  md: '# Chapter 18 • System and Network Monitoring


    for this may not get sent to the remote host. Of course, the same thing could
    be said for logging to the hard drive should the drive or its controller go bad.


    # Logging Procedures


    How you log depends on what you want to log. For an initial setup, you should
    probably start by logging just about everything. For programs like pppd, this
    will greatly increase the amount of debugging information you have. As the system
    becomes stable and is working correctly, continue debugging, but change the priority
    to something like warn or err to keep regular debugging information. You may also
    choose to have different facilities for different files. For example, you may
    want to send all email logs to /var/log/mailog, and bad logins to /var/log/authlog.
    This can make it easier to separate problems if they arrive. Bad login problems?
    Check the authentication log. The downside is that some logs may be intertwined.
    For example, a bad login may be the result of someone cracking into sendmail.
    If you don''t examine the mail log, you may not realize what''s going on.


    # 18.2 Network Monitoring


    There are a number of ways to keep an eye on the network to see what''s going
    on and track potential problems. As an example, two machines share the same IP
    address could easily cause trouble of which it is hard to locate the source. Other
    issues such as bad network cards or routers and hubs can also cause very sporadic
    and annoying problems. Having the right tools on hand can help you locate the
    source of trouble and fix it.


    # tcpdump


    The tcpdump program puts the Ethernet card into promiscuous mode to see what''s
    happening on the network. All packets seen by the card are displayed on the screen.
    Filters exist to see only the data that you want to see. Here are a few packets
    related to ARP:


    ```

    21:49:12.480000 arp who-has mymachine.insidehost.com tell gateway.insidehost.com

    21:49:12.480000 arp reply mymachine.insidehost.com is-at

    0:0:c1:b4:4f:dc

    ```'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# 18.2 Network Monitoring


    The first line is a request from gateway asking for the Ethernet address for my
    machine. The next line is a reply with the MAC address for that particular machine.
    This is fairly common, since ARP caches do not last all that long. On a good-sized
    network, you may see many ARP requests and (maybe) replies per minute. Since an
    ARP request is an Ethernet broadcast, machines hooked by switches or hubs will
    see the packet. Only those machines on the same Ethernet run as the replying machine
    and the requestmachine will see the response, so don''t worry if you don''t see
    a lot of replies.


    Here are some ICMP-related packets:


    ```

    21:50:05.510000 mymachine.insidehost.com > ping.outsidehost.com: icmp:

    echo request

    21:50:05.650000 ping.outsidehost.com > mymachine/insidehost.com: icmp:

    echo request

    ```


    Here we see a ping (one ping) going from my machine to a remote site (ping.outsidehost.com).
    About 140ms later, the ping is answered with a reply. Since a ping is really sending,
    asking the remote site to echo data, this is how tcpdump reports it.


    In this example, we''re going to run tcpdump on the second Ethernet (also known
    as eth1):


    ```

    [root@server mark~ # /usr/sbin/tcpdump -i eth1

    tcpdump: listening on eth1

    23:12:59.510000 192.168.1.15.listen > server.telnet: . ack 760059009nwin 7842
    (D)

    23:12:59.510000 server.telnet > 192.168.1.15.listen: P 129(28) ack 0

    win 32736

    (DF)

    23:12:59.710000 192.168.1.15.listen > server.telnet: . ack 29 7814

    (DF)

    23:12:59.710000 server.telnet > 192.168.1.15.listen: P 29:199(170) ack 0

    win 36 (DF)

    ```


    4 packets received by filter

    0 packets dropped by kernel

    [root@server mark~]


    This example is pretty poor, since we''re logged into the machine via the second
    Ethernet port. So, what we''re really seeing is the data from tcpdump being sent
    over the Ethernet line through the telnet window. It gets messy, but it tells
    us a lot.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Chapter 18 • System and Network Monitoring


    Let''s take a look at two of these packets:


    ```

    23:12:59.510000 server.telnet > 192.168.1.15.listen: P 1:29(28) ack 0

    win 32736 (DF)

    23:12:59.710000 192.168.1.15.listen > server.telnet: . ack 29 7814

    (DF)

    ```


    The first line is a packet leaving the telnet port on server (the machine connected
    via telnet) and going to 192.168.1.15 on the TCP port. Because we''re on a Windows
    98 machine, it doesn''t matter what port the data comes in. The timestamp indicates
    that the time is almost 11:13 PM. You''ll note that the timing goes past seconds,
    since Ethernet can handle 10MBps and that''s a lot of data to put in a second.


    After the destination is listed, any special TCP/IP flags are mentioned. In this
    case, the P represents "Push". This could also be S (Syn), F (Fin), R (Rst) or
    a period (.), meaning no flags. Next comes the data sequence number (1:29(28)).
    This allows the IP layer to reassemble the packets as they come in. Next is the
    ack 0, meaning that it''s expecting an acknowledgment, which is in the next line.
    The win refers to the size of the remaining buffer. As this buffer fills, less
    data will come in until the IP layer can handle all the packets remaining in the
    buffer.


    The second line is the acknowledgment packet from the target machine to the server.
    If you are communicating via TCP, you need to acknowledge all packets that come
    in. In UDP, this is not necessary.


    Among others, tcpdump shows ARP requests, NFS traffic, DNS lookups, and other
    information that you may not be aware of. Since tcpdump attempts to use names
    instead of IP addresses whenever possible, you may see a lot of traffic from your
    own machine trying to find out who everyone is. If you want to turn this off,
    use the -n option.


    Another option available to tcpdump is filtering. For example, you could filter
    out all telnet information and get information about who is browsing the Web with
    this:


    ```

    /usr/sbin/tcpdump -i eth port http

    ```


    This matches both local machines going out to the Web and outside machines getting
    information from your Web servers.


    Since tcpdump only sees traffic on the local Ethernet, you''ll only be able to
    see Ethernet traffic on your segment. You won''t be able to see traffic on the
    other side of a router, firewall, or even a switch, unless it''s an Ethernet broadcast
    (such as ARP or DHCP requests).'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# 18.2 Network Monitoring


    # Queso


    If you have a number of Ethernet segments and find an offending IP address, it
    may be hard to find out what machine actually is. Is it running Windows NT? Linux?
    Is it a Sparse workstation? Queso (http://www.apostools.org/projectz/queso/) knows.
    There are a few functions of TCP/IP that are technically undefined, and it''s
    up to the vendor how to respond. Queso is a program that checks this functionality,
    matches it against a data-base, and tells you what OS a particular machine is
    running. Seven packets are sent to the IP address (all valid) and the response
    matches the list of known OSes, the name of the operating system is found. A tool
    like this can quickly map out what is running on a network.


    # Statnet


    If you want to keep an eye on a network, you can use the statnet (http://www.skypoint.com/-sewilco/statnet.htm)
    program. It gives a single screen with an overall view of network traffic on your
    segment. If you start seeing spikes in usage, you can prevent serious problems
    before they start.


    # SNMP


    SNMP stands for Simple Network Management Protocol. It defines a hierarchy of
    settings for an individual computer to use to tell others about its health, statistics
    about its usage, and configuration and location information. SNMP is implemented
    in three parts: the SNMP daemon, MIB (Management Information Base) is provided,
    and an SNMP manager.


    The SNMP daemon is in Red Hat 6.0 as the ucd-snmp package. It also includes a
    series of MIB files which are a way of describing capabilities your machine has.
    Some of these can be found out from the SNMP daemon itself, but other things have
    to be entered. The SNMP manager is a client, or reader. These applications can
    query a SNMP daemon, or they can be set to receive SNMP “traps” or alerts. An
    alert would be something like low resources, such as a hard drive out of space.
    An alert would be sent to the SNMP manager, which would process the alert in whatever
    way it wants (send an email, page, fax, blink the screen and so on).


    Part of the security of SNMP includes two ways of getting information. The “public”
    group (also called a community) is typically allowed to read but not write information.
    The “private” community is more for system managers'
