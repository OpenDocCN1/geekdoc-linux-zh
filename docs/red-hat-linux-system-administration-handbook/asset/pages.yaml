    PCMIA cards. A full list of cards that can be found under /usr/doc/pcmia-*/SUPPORTED.CARDS.
    CardBus is a faster form of PCMIA and is used in some high-speed devices, such
    as Ethernet and SCSI cards.

    PCMIA support is included with Red Hat, is installed as the pcmia-cs package,
    and if cards are found at boot-time, they''re activated. If after booting a new
    card is inserted, it will automatically get started. Cards can be removed without
    deactivated, and the PCMIA card manager (cardmgr) will attempt to unload the drivers.
