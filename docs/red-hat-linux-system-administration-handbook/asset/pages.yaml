  md: '# Menus


    Besides the regular Start menu that has the same configurability as the Windows
    95 start menu, there are also menus available if you left-click on the root window.
    These menus are defined in .fvwmrc file. The menus are pretty much self-documenting.
    The AddToMenu line adds a menu definition called Quit-Verify that has a title
    of Really Quit FVWM?


    The next lines define the items in that menu. A + at the beginning of a line means
    it''s part of the menu, followed by the text in the menu. You can include an icon
    in this if you enclose the name in &. The last part of the menu line is the actual
    command. The Restart in this menu means to quit FVWM and then start the named
    program. This allows you to quit FVWM and start another window manager. If a menu
    option has no text and another of Nop then it will create a separator in the menu.
    Replacing Restart with Exec will start the new program without quitting FVWM—but
    note that it''s not a good idea to start multiple windows FVWM.


    ```

    #

    # This menu is invoked as a sub-menu—allows you to quit,

    # restart, or switch to another WM.

    # AddToMenu "Quit-Verify" "Really Quit Fwm?" Title

    + "Restart&mini-turn.xpm" Restart fwm95-2

    + Nop

    + Start twm Restart /usr/X11R6/bin/twwm

    + Mwm Restart /usr/X11R6/bin/mwm

    + Start olwm&mini-olwm.xpm" Restart /usr/openwin/bin/olwm

    + Start olwm&mini-olwm.xpm" Restart /usr/openwin/bin/olwm

    + Nop

    + Yes, Really Quit&mini-exclam.xpm" Quit

    + "No, Don''t&mini-cross.xpm" Nop

    ```


    # Modules


