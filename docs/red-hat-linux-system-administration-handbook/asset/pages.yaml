  md: '# Securing Linux 16


    > It may not seem easy, but it has to be done


    With most of the machines in the world connected via the Internet, security is
    a big concern, whether you have hundreds of machines or one dial-up machine.


    No system can be completely secure from outside attacks. Anyone determined enough
    has a good chance of cracking¹ into your system. The best thing you can do is
    to prepare yourself and your machine, make it as hard as possible, and be able
    to detect when you''re being cracked.


    > ¹Contrary to popular belief, people who break into systems are called “crackers”
    and not “hackers.”'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# 16.1 Physical Security


    The first part of keeping a system secure is making sure the hardware cannot be
    tampered with. Part of the C2 security specification for computer systems says
    that the computer must not be physically accessible to anyone without access.
    That is, it can''t be on the network and must be in a locked room to begin with.
    Chapter 2 has a good list of instructions to keep a typical PC reasonably secure
    from outside attacks. To quickly sum up:


    +   - Lock the BIOS and set the BIOS to boot only from the C drive.

    - Don''t use LILO or at least make it boot directly into Linux.

    - Don''t have DOS or any other OS on the machine.

    - Lock the PC case.


    You should also have people on hand to assist with problems and prevent anyone
    from having the chance to take a computer apart.


    # 16.2 Software Security


    This section is just a bit larger than the hardware security section, and for
    good reason. With TCP/IP having over 65,000 ports available for connecting to
    a single machine, this gives anywhere up to 65,000 and beyond possible ways for
    a cracker to enter your system.


    # Monitoring Software


    Programs like COPS and TripWire allow you to routinely monitor your system to
