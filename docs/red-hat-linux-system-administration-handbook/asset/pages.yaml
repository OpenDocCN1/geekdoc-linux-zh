  md: '# Chapter 12 • Linux Database Software


    MySQLs home page is http://www.tcx.se/; there are also numerous mirrors in the
    U.S. (http://www.buoy.com/mysql), Australia (http://mysql.bluep.com/), and many
    others, all listed on the home page. Also on the home page are pointers to FTP
