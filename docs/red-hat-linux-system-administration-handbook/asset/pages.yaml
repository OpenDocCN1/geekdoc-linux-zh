  md: '# Installing from Source


    The latest netatalk-1.4b2+asun distribution can always be found at ftp://ftp.u.washington.edu/public/asun/.
    When you install from source, the installation is rooted at /usr/local/atalk by
    default. There, a nominal set of directories (bin, etc, include, lib, and man)
    is created for the netatalk binaries, config config files, and so forth.


    There are only a few differences between source-based installation and RPM-based
    installation. The config directory is /usr/local/atalk/etc. It contains the following
    configuration files: AppleVolumes.default, AppleVolumes.system, atalk.conf, afpd.conf
    and papd.conf. There is no config file, so you will have to edit the startup script
    yourself to change or add options.


    Second, the startup script is named rc.atalk. It is installed in /usr/local/atalk/etc/.
    You will need to add a line to /etc/rc.d/rc.local to call it upon bootup.


    Lastly, as is the case for many network services, you will need to make a few
    entries in /etc/services as well (RPM does for you), including:


    ```

    rtmp    1/ddp    # Routing Table Maintenance Protocol

    bp     2/ddp    # Name Binding Protocol

    echo    4/ddp    # AppleTalk Echo Protocol

    zip     6/ddp    # Zone Information Protocol

    ```'
