  md: '# # Backing Up

    Your Data


    When all else fails . . .

    restore from backup!


    Keeping good backups is frequently the way to recover from some accidents, disasters,
    or break-ins. Linux has a number of methods for archiving your data, ranging from
    tools like tar or cpio that come with Linux to feature-rich, sophisticated, commercial
    packages.


    There are a number of ways to keep backups, ranging from simply taxing your entire
    filesystem to a tape using dump and a well-designed backup schedule to running
    high-end commercial backup and restore programs.


    Of course, you also have a variety of backup media to choose from: floppies (if
    you are truly desperate), tape drives (from old nine tracks up to DAT), write
    once many (WORM) drives, magneto-optical floppies (written magnetically, read
    optically), and ZIP and JAZ drives. Of these, only the newer tape options and
    JAZ drives have gigabyte capacity, and only exabyte and DAT can handle more than
    a couple of gigabytes. Unfortunately, tapes are in many ways the most cumbersome
    to work with because of their sequential access nature.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 334 • Chapter 19 • Backing Up Data


    With the new proposed standards for CD-ROM-(and thus WORM-) based filesystems,
    this media will soon sport multiple gigabyte capacity. Though they will still
    write once, the easier access (instead of sequential) will likely make them popular
    once their price drops into the affordable range. In actuality, the technology
    for the current standard has existed for some time, but the popularity of the
    current standard has kept it from being replaced. However, the need to store large
    amounts of data reliably has grown tremendously in recent years, and CD-ROMs are
    a big win over tape in both ease of access and longevity (decades versus years).


    The rest of this chapter assumes you have some form of large capacity media on
    which to back up your data, though many of the guidelines are useful regardless
    of the media being used or its capacity.


    In general, you will want to run your backup during times of low activity for
    two reasons. One, it is not a good idea to have lots of files open or changing
    while the backup is running. Some programs will lock a file and the backup will,
    at best, be able to skip it, or at worst, the backup will exit or crash. Second,
    backing up your system will tend to consume a lot of system resources, and if
    your server is fairly loaded already, it will likely be bogged down considerably
    if you try to run the backup during “normal” business hours (whatever those might
    be).


    # 19.1 tar and mt


    The name “tar” stands for tape archive. Before the most recent versions of GNU,
    tar was not really suitable for use as a backup tool. It has no easy way of performing
    incremental backups and properly handling files with holes (so-called sparse files).


    At the base level, you can create a cron job that will compress and archive all
    of your filesystems and network volumes to a tape drive every night or every few
    nights. There are a couple of drawbacks to this method, however.


    Typically, only a small fraction of the filesystem changes over the course of
    a week. Making a copy of the whole filesystem every other night is overkill. It
    would be better if incremental backups could be made.


    It’s very possible that you could have more stuff to back up your capacity on
    your particular combination of tape and drive. In this case, you would have to
    break up the backup and change tapes at some point to complete the backup. Once
    again, incremental backups would alleviate this.


    If your backup, or sections thereof, is small enough, you may want to put more
    than one on a single tape, and then you may need some way to access a'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# 19.1 tar and mt


    particular archive at some later point. You could use tar''s append feature, but
    then the maintain different versions is lost. When the archive is unpacked, the
    appended files will overwrite ones with the same names that were extracted earlier.


    # Using tar


    The tar command has three major functions: create a tar file, list the contents
    of a tar file, and extract files from an existing tar file. In terms of switches
    to tar, there are c, t, and x, respectively. These switches combined with others
    to create an efficient means of accomplishing backup and recovery.


    Other commonly used switches include f for filename, v for verbose, and z to enable
