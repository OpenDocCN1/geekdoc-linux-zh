  md: '# Chapter 21 • Connecting to the Internet


    Try to ping:

    localhost: ping 127.0.0.1

    local IP: ping 192.168.1.1

    other IP addresses on the network


    If you cannot ping 127.0.0.1 or 192.168.1.1, recheck your configuration files.
    If none of the machines on your local network responds, check the cabling from
    your machine to the rest of the network. If you cannot ping some of the machines
    on the local network, chances there is a problem with them, and not with the firewall
    machine.


    # Nameservers


    Before continuing to the PPP section, two other files should be checked:


    ```

    /etc/resolv.conf

    order hosts,bind

    search localdns_server, isname.net

    nameserver <IPForNameserver1>

    nameserver <IPForNameserver2>

    ```


    ```

    /etc/hosts

    127.0.0.1 localhost

    192.168.1.1 gateway.localether.net

    192.168.1.2 bob.localether.net

    192.168.1.5 ralph.localether.net

    ```


    We suggest keeping the hosts table simple—only the names of the machines on your
    local Ethernet. While it is true that adding the names of some commonly used machines
    to the hosts file will save a little time when looking up names, it can lead to
    problems if you have a machine that has changed its IP address.


    # 21.4 PPP


    PPP connectivity is fairly easy, since there are few configuration files to deal
    with. There are only two main programs to use for PPP: pppd, the daemon itself,
    and the connection script. Distributed with it commonly used is a program known
    as chat. It is a program solely designed to do a "wait for this string, and then
    send this string" application. Another well-known program is expect, but its flexibility
    and features are overkill for our application. The default configuration files
    distributed with PPP will work fine, but are not'
