    +   - Optimized queries, including optimizations for joins (all joins are done
    in one pass)


    +   - It is multithreaded and able to handle multiple requests concurrently. This
    mean that subsequent queries will not have to wait on a large, time-consuming
    query that was presented to the server first.


    +   - It has much looser licensing requirements. Basically, unless you are going
    to sell mSQL, you don''t need to purchase a license for it.


    +   - It is currently serving larger databases (as many as 50 million rows) than
    mSQL. This isn''t to say that mSQL couldn''t handle so large a database, it is
    just an empirical observation.


    Some disadvantage of MySQL include:


    +   - Not lightweight as mSQL.


    +   - More complex access control system, which is probably the most difficult
    aspect of MySQL to master.


    In the past year or two, MySQL''s popularity has exploded. It has replaced mSQL
    in many places. Virtually every common programming language has a module or wrapper
    that implements the C API. Support on Internet mailing lists and on the Web is
    excellent.


    In general, if you are frustrated with mSQL''s limitations or licensing, you should
    definitely look into MySQL. If your favorite language doesn''t have an interface
    and you know a little C, it is probably worth your while to port mSQL modules
    to MySQL.


    # Installing MySQL


    MySQL is free in almost every circumstance license, the one exception being that
    if you wish to sell it, you have to purchase a license. Getting a legal copy of
    it for your use is thus a matter of FTPing the distribution. The source code is
    available, or if you choose, you can get a Linux binary distribution. Binaries
    also exist for Solaris and SunOS, as well as a growing number of other OSes.'
