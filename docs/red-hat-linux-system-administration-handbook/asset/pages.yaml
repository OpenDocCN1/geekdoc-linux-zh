  md: '# 15.12 Summary


    # Metro-X


    Metro-X is another commercial Xserver. It also boasts support for more cards and
    monitors than XFree86, though not as many as AcceleratedX. Its performance is
    not as good as AcceleratedX''s either. It does, however, cost less and consumes
    fewer resources. Metro-X has support for up to four displays built in.


    # X Libraries


    In addition to the many additional freeware or shareware X libraries and toolkits,
    there are a couple of commercial toolkits for X.


    # Motif


    Motif was developed by the Open Software Foundation. Its specification is freely
    available, which has allowed the LessTif project to work on a free clone of Motif.


    Motif is popular because it provides a number of widgets that allow the building
    of complex and powerful, but aesthetically pleasing, GUIs. It is somewhat resource-intensive,
    but most developers find it a fair trade.


    Red Hat (http://www.redhat.com/) ships Motif 2.0.1 for the x86, Alpha, and Sparc
    platforms.


    # OpenGL


    OpenGL is a three-dimensional graphics library developed by SGI. It has quickly
    became a standard part of nearly every 3D developer''s toolkit. Most Linux users
    use the Mesa library and a supported 3D card on Linux.


    # CDE


    The Common Desktop Environment (CDE) is an effort by several commercial vendors
    to make a common X/Motif-based environment for use on all X desktops, providing
    a common look and feel, regardless of which platform you are using.


    # 15.12 Summary


    X is the most popular standard for graphics display on Linux and UNIX. It can
    be configured however you want, providing the control and interface that suits
    you best, instead of changing the way you work to suit the operating system. The
    applications that are available for X rival those of Windows 98, and more are
    being written every day.'
