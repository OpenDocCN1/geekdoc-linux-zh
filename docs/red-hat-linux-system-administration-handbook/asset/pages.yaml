  md: '# 10.5 BeroFTPD


    ging options, an include directive for use inside ftppass, a built-in ls command,
    and support for Kerberos5 for secure logins.


    A recent version of BeroFTPD in binary RPM format can usually be found in the
    Red Hat contrib area. The source code is available from ftp:/ /bero.x5/pub/. As
    of this writing, the current version is 1.3.4.


    # Virtual FTP Servers


    As mentioned, BeroFTPD has enhanced support for virtual FTP servers, including
    support for IP-less virtual hosts. In addition to wju-ftp virtual host support
    (private banners and messages), BeroFTPD supports individual configuration files,
    ftpusers, ftpgroups, fthosts, and ftpconversions for each virtual FTP server.


    To make use of virtual host support under BeroFTPD, you need to add a couple of
    lines to the ftppass file and create an ftpserver file. Two directives must be
    added to ftppass:


    ```

    root /ftp

    logfile /var/log/xferlog

    ```


    These specify the default root and logfile locations of the virtual hosts, as
    well as the root and logfile for connections to the “real” server. ftppass should
    contain a line for each virtual host that defines the directory where the configuration
    files for that host reside. These can also be defined on per-domain basis.


    ```

    cheese.ratatask.org /etc/ftpd/config/cheese.ratatosk.org

    foobar.com /etc/ftpd/config/foobar.com

    10.10.10.76 /etc/ftpd/config/hey.you.com

    ```


    Within these directories, you can create configuration files to customize the
    server just as you would a standalone server. Note that the virtual host completely
    overwrites directives from the master ftppass file and nothing is inherited from
    the master configuration files except for the default root and logfile locations
    from ftppass.


    Another useful feature is limiting throughput for particular files. The syntax
    of this directive is:throughput<root-dir><subdir-glob><file-list>=bytes-per-second×bytes-per-second×remote-glob-list>.


    ```

    throughput /home/ftp * README.help. * oo - -

    throughput /home/ftp/pub/dogs *cat* * 2000 0.8 *.nm.ms

    ```'
