  md: '# The rdev Command


    The rdev command allows you to change parameters without using LILO. For example,
    you can use the dd command to put a Linux kernel on a diskette, then move it to
    another machine to boot. To change the root partition, just use the following
    command:


    ```

    rdev kernel root

    ```


    where kernel is the kernel file and root is the new root partition to use. If
    the kernel is on a floppy diskette (used dd to put it there or make floppy when
    compiling the kernel), the command would look like this:


    ```

    rdev /dev/fd0 /dev/hda1

    ```


    This would configure the kernel file on /dev/fd0 (the floppy diskette) to change
    its root partition to use /dev/hda1 instead of the default. For a list of other
    features rdev has, use the rdev -h command.


