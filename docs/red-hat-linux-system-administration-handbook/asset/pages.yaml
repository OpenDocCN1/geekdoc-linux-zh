    \ is when they don't clean up correctly,\nwhich happens when a program crashes\
    \ before it finishes running. Then you\nhave lock files for programs that are\
    \ no longer running, preventing other-\ngrams from using a device.\n\n# Flow Control\n\
    \nThe DTE and DCE know when to start transmitting, there are two\n methods of\
    \ stopping communication temporarily. First is software (or\nin-band) flow control,\
    \ which sends a ^Q in the stream of data. Once the\nremote side sees this character,\
    \ it stops sending data until it sees a ^s. The\nproblem with this is that it\
    \ breaks down at high speed. At anything above\n9600 bps, too much data may come\
    \ down the line between the time that the\nreceiving side sees the ^Q, and the\
    \ sending side processes that character and\nstops transmitting data. This can\
    \ cause data loss. The advantage of in-band\nflow control is that only three wires\
    \ are needed: Tx, Rx, and GND.\n\nThe other method is using hardware (or out-of-band)\
    \ flow control. In this\nsetup, two pins (RTS and CTS) are used outside the data\
    \ stream to start and\nstop the flow of data. Since that is all signals used for,\
    \ processing a\nstop in out-of-band flow control is much quicker than in-band,\
    \ and is\nrecommended for all speeds greater than 9600 bps.\n\n# UARTs\n\nA UART\
