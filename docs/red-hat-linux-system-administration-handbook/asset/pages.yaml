  md: '# 14.3 Apache and ApacheSSL/Stronghold


    In a situation where you are simply serving large numbers of static pages, a good,
    fast disk is probably a good investment. Spend some money to go from a fast or
    ultra SCSI 2 to ultra SCSI 3. We''re assuming that you have the good sense not
    to use IDE (or even EIDE) drives in a server.


    If you need higher network throughput and are saturating your T1 (i.e., you have
    no LAN congestion issues), you may want to look into having your server cohosted
    at an ISP that has T3 access to the Internet backbone, and consider moving from
    10 Mb/s Ethernet to 100 Mb/s (fast) Ethernet. A properly configured Linux Web
    (and/or FTP) server can saturate a fast Ethernet card and thus multiple T3.


    # 14.3 Apache and ApacheSSL/Stronghold


    Because of its popularity, rich feature set, extensibility, and power, we will
    concentrate on Apache, although much of the information here will apply to any
    Web server.


    As mentioned above, Apache is freely available with source code. Apache also provides
    an API. These two features allow for a great deal of customization and extensibility.
    Additionally, Apache is HTTP 1.1-compliant. This latest revision of HTTP introduces
    many performance enhancements to the protocol.


    # Getting Started


    Since Apache is freely available, a number of Linux distributions are shipped
    with it, Red Hat included.


    +   1. Where is the document root for the server? In other words, where is the
    directory that contains the root of the directory tree that is served when someone
