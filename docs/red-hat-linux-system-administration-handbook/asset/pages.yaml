    # 9.6 Qmail: An Alternative to Sendmail


    One of the better known replacements for sendmail is called qmail. There are two
    reasons for its popularity: ease of use and security. This doesn''t mean that
    qmail is best for everyone, since there are a number of changes that your system
    has to go through to use qmail. It''s also not perfect in a large installation
    (yet) because of some of the ways that sendmail and qmail differ. The configuration
    for qmail is much simpler than sendmail, but it doesn''t offer the "Swiss army
    knife" of Mail Transport Agents (MTAs) that many expect to see. Here''s a few
    of the ways in which qmail and sendmail differ in methodology:


    +   - Mail file location—Sendmail prefers to use /usr/spool/mail/user as a location
    for incoming mail. Qmail prefers to use -user/Mailbox as a location for storing
    mail files. This is for two reasons. First, putting the mail in the user''s home
    directory provides for better quota checking and prevents overfilling a central
    location. Second, there are fewer security problems since there isn''t a central
    location to store files.

    - Permissions—Sendmail runs almost always as root, or with root privileges, to
    write files and post. Qmail runs as root only when necessary and otherwise runs
    as a qmail user, who has no special permissions.

    - Mailing list integration—Sendmail has external programs to create and administer
    mailing lists, but Qmail supports a method where individual users can have their
    own mailing lists and administer them themselves with no extra accounts or permissions.

    - Size—Sendmail is a monolithic MTA, where everything is done in the program itself.
    Qmail has a number of smaller programs to handle each aspect of mail receipt,
    delivery, sending, and so forth.


    # Installing Qmail


    You can download qmail in either RPM format or source code (also called a tarball,
    due to the fact it''s in tar format). Both files can be found at http://'
