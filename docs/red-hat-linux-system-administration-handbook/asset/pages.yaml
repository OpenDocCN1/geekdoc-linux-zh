- img_proc: true
  md: '# 15.3 Setting X Manually


    Now you must give information about your video card. First you''ll probably be
    asked about the amount of video memory on your card. You''ll get selections from
    256K to 4096K (4MB), and a sixth selection that allows you to enter your own amount.


    Once that is completed, you will be allowed to enter a description for your video
    card similar to the monitor descriptions above. You can either press ENTER through
    the entries, or type in the description, vendor, and model of your video card.


    If you have an S3- or AGX-based video card, you may need to know the type of random
    access memory digital-to-analog converter (RAMDAC) the card has. The RAMDAC is
    used to get high color (greater than about 32K colors) from the server. Choose
    the appropriate option if you have cards and know the RAMDAC type, or you can
    just press ENTER.


    Some video cards also have a programmable clock. Some clocks are not programmable,
    but if yours is (some Diamond cards and some S3 cards are), enter the type of
    clockchip you have. It should be found in your owner''s manual, or on the card
    itself. If you don''t have a clockchip, just press ENTER.


    At this point, the XF86config program will attempt to find the clocks that your
    card supports by using the X -probe command. This command doesn''t start X itself,
    but asks the video card to return which clocks it knows about. These clocks are
    important to determine the correct resolutions you can use.


    # Starting X


    Now you should be ready to start X. Doing this is simply a matter of getting to
    a command prompt and typing:


    ```

    > startx

    ```


    This will start the X server in the lowest color depth and resolution you selected.
    If you configured your server to use 8-bit color (256 colors) and also 16-bit
    color (65K colors), just typing startx will start the X server in 8-bit mode.
    To start it up in 16-bit mode, use the following:


    ```

    > startx -- -bpp 16

    ```


    For the sake of extra memory, you may want to log out of other virtual consoles
    (VCs) before starting X. You can start multiple shells called xterms within X.
    You can switch to a VC while X is running by pressing CTRL-ALT-Fn, where'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'n is a number between 1 and 6. The first X server usually uses VC 7. You can
    see what VC is being used when X starts up, or by going through the VCs.


    Once you enter the startx command, you will see some text off the screen. The
    screen will change to a graphic screen and a mouse cursor. The window manager
    will then start. If something doesn''t work right, you can press CTRL-BACKSPACE
    and this will immediately drop you out of X.


    While you cannot change color depths within X, you can change the resolution by
    pressing CTRL-ALT-Minus (--) and CTRL-ALT-Plus (+). These will cycle through the
    resolutions set up for your color depth in increasing order, respectively.


    # 15.4 gdm


    The gdm program is a graphical window that is used instead of the regular text-based
    login and password prompt most UNIX users are familiar with. It''s better for
    newer users or in a lab environment, the user doesn''t have to issue any commands
    to start X. You can automatically have gdm start on boot by changing the default
    runlevel to 5 (see Chapter 3 for more information on runlevels). You can test
    out gdm by switching to Runlevel 5 using the telinit 5 command.


    # 15.5 Using X Window Managers


    The way that X is determined by two things: the contents of the window and the
    window manager. The windows merely interact with the X server and there is no
    real way of moving the windows around the screen, or resizing the windows. This
    is the job of the window manager. The window manager places a border around the
    window and can provide maximize (full-screen) and minimize (iconize) buttons.
    The window manager also allows you to resize, move, or kill windows. The window
    manager provides for menus and the general ''look and feel'' of the X display.
    Operating systems like Windows NT combine both the display manager and the window
    manager, so if you''re new to Linux, this may take some getting used to.


    There are a few different window managers available with Red Hat, such as fwm-95,
    AfterStep, KDE, and GNOME. Each window manager has its own look. Some of these
    window managers (such as Enlightenment and GNOME or KDE) have their own libraries,
    so programs can be specifically written to tie the application into the window
    manager.'
  merge: -1
