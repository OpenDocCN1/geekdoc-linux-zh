    # TeX/LaTex


    TeX is the original UNIX typesetting program. TeX is not a word processor and
    has no editing environment. TeX files can be created with any text editor. They
    are subsequently processed by TeX to create a formatted document. Some word processors
    (such as LyX) write their files as TeX, so you can get a WYSIWYG screen with the
    power of TeX.


    Because TeX source is plain text and because TeX is free and has been ported to
    virtually every platform, documents created with it are completely portable.


    When a TeX or related file is processed, the output is sent to a DVI (device independent)
    file. DVI is a flexible format that can be viewed with a simple, lightweight viewer
    or translated into other formats, for example, PostScript, for printing.


    Over the years, a number of extensions and utilities for TeX have been developed:


    +   LaTeX—By far the most common TeX extension. LaTeX is actually a set of macros
    to allow a higher level of interaction with TeX, which makes it easier to use.
    It provides specific modes for articles, books, and letters.'
