  md: "# Kernel 17\nAdministration\n\n# Managing the\nstate-of-the-art Linux kernel\n\
    \nThe kernel is the heart and soul of your operating system. It\nmanges the memory,\
    \ CPU, and disks; every piece of hard-\n in your system needs it to function.\
    \ The Linux kernel is\none of the most flexible and customizable in existence,\
    \ and\nmanaging it is fairly straightforward, but can be tricky at times.\n\n\
    # 17.1 Customizing Your Kernel\n\nIn virtually every flavor of UNIX, it is possible\
    \ to configure the kernel to\ns extent. Usually this is done by specifying a set\
    \ of external, loadable\nmodules to insert into the kernel at boot-time. With\
    \ Linux, you can do this\nand much more. In addition to being able to insert code\
    \ modules manually\nbootup, Linux can also load modules on-demand and unload them\
    \ later.\n\nOn top of all that, you can, since the code for the Linux kernels\
    \ is freely\navailable, compile into your own custom kernel. This includes specifying\
    \ which"
  merge: -1
