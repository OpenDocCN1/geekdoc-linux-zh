  md: '# 17.6 Dive On In!


    ![](img/142e1b4a4b104ce5c6de1544ac62324a_326_0.png)


    Figure 17–2 Module support screen


    ![](img/142e1b4a4b104ce5c6de1544ac62324a_326_1.png)


    Figure 17–3 Sample help screen


    Now you are ready to start configuring your new kernel.


    # Code Maturity Level Options


    Answering Yes to the option here will not change the kernel. It will give you
    options later on for various experimental or incomplete drivers. Say Yes; it doesn''t
    hurt anything. You can always say No to any experimental drivers you are offered.


    Some experimental modules available in the current 2.2 kernels include enhanced
    support for some IDE controller chipsets, IPv6, Ethernet bridging, write support
    for UFS and NTFS filesystem types, CODA (a next-generation network filesystem),
    and support for numerous pieces of less common hardware.'
