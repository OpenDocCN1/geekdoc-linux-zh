    \ AppleTalk packets among them.\n\nMinimal atalkd.conf for use with multiple AppleTalk\
    \ zones looks like the following:\n\n```\neth0 -zone \"Production\"\n```\n\nThe\
    \ zone is basically a free-form string, although it must be 31 characters or less\
    \ in length.\n\nUnless you are on a very large network, you can let atalkd set\
    \ up your AppleTalk address. If this is not the case, you will have to assign\
    \ one (or get one, if you are not in charge of the assignment of these addresses).\
    \ Addresses are specified by network and node, like this:\n\n```\n-addr 45.10\n\
    ```\n\nIn this example, the 45 is the network, while 10 is the node on that network.\
    \ -net option is used to specify which address range is covered in this zone.\
    \ This option lets you set the address range, which is automatically detected\
    \ at server startup. If you have no zones, this number is irrelevant. The first\
    \ number corresponds to the first network address of coverage in this range, and\
    \ the optional last number corresponds to the last address covered in this range.\
    \ The address range should include netatalk's address number set with the -addr\
    \ net.node option.\n\nFor example:\n\n```\n-net 106-110\n```\n\n -zone option\
    \ sets the name of the zone that atalkd should represent when talking on the network.\
    \ This option, as discussed before, is merely a means of classification. It will\
    \ be authoritatively broadcast if the -seed option is used and there are routers\
    \ on the network whose zones don't conflict with that given after the -zone option."
