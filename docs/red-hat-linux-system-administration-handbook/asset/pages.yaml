    Once connected, the commands are mostly the same as FTP. Commands like get, put,
    ls, cd, and del (even prom) all work the same as in FTP. Here''s a description
    of some of the lesser known commands:


    +   - mget and mput - Gets or puts multiple files at once.

    - prom - Toggles prompt mode when using mget or mput.

    - lcd - Changes directory on the client side.

    - ! or !command - Starts a shell or runs the given command.


