    # # Configuring netatalk


    In AppleTalk, there are two levels of access: guest and registered user. Being
    a guest user is basically like the nobody user in UNIX: You have highly limited
    access to the server and typically can write only to areas that are world-writable.
    Often the guest account will also have printing privileges.

    Under netalk, users authenticate themselves using the user and password information
    in /etc/passwd, that is, they must have an account on the machine. If you don''t
    want these users to have shell access, you can give them the shell /bin/false.
    This is analogous to what is done when setting up FTP-only accounts. If you would
    like to let your users change their passwords by logging in with ssh, telnet,
    or something similar, you can give them the shell /bin/passwd. If you choose to
    do this, be sure to add /bin/passwd to the /etc/shells so that it is a valid shell.


    In the configuration files for netatalk, you define which directories are available
    at the two levels of access, including the home directory of registered users,
    if wanted. For each instance of the AppleTalk daemon, you can specify a set of
    directories for guests and registered users to access.


    Netatalk uses five configuration files. The RPM version also uses a sort of "meta"
    configuration file that serves to collect much of the configuration data in one
    place.


