    ```

    INSERT INTO db VALUES (''%'',''notebooks'','''','''',''N'',''N'',''N'',''N'',''N'');

    ```


    To give the user mark full access with the password osprey from any host:


    ```

    INSERT INTO user VALUES (''%'',''mark'',''pass-

    word(''osprey''),''Y'',''Y'',''Y'',''Y'',''Y'',''Y'',''Y'',''Y'');

    ```


    To test your access, you can use mysclient. The syntax is very

    straightforward: mysqlaccess [host] [database]. There are a number of

    options that control the amount and format of the output well; the --help

    option lists them.


    In general, it is easiest to give a user no access at all in the user table; simply

    set their username and password. Then, do all the access control in the db

    table. Of course have been given full privileges in user. Also, if you

    want to give a user shutdown or reload privileges, you can only do this in the

    user table as well.


    Now, you may be a little worried about slinging your usernames

    and passwords over your LAN. You need not to be worried, or at least not

    as worried as since MySQL encrypts your network traffic

    at least make it difficult to sniff out users and passwords. (Of course, no\decryptable
    encryption scheme is 100% foolproof. Cracking encryption is a

    matter of patience, perseverance, and lots of CPU power).


    You''re ready to start populating your database! Just a couple of last

    notes. When storing data in binary large objects (BLOBs) or variable-length

    text (VARCHARs), MySQL doesn''t allocate space on the disk until

    there is data. This can substantially reduce the amount of disk space

    used by your data compared to servers, where space for the entire VAR-

    CHAR or BLOB (or TEXT in mSQL) is allocated when the row is created,

    regardless of how much is actually stored in it.


