  md: '# # Printing and Print Sharing


    # ## Getting the most out of a single printer across multiple machines


    Print sharing allows you to set up a single printer so that everyone on the network
    has access to it.


    Print setup and sharing under Linux give you a number of choices. You can print
    to a local printer, or just have Linux point to a remote printer on an AppleTalk,
    TCP/IP, or SMB network. You can also share your locally-connected printer with
    others using any of those protocols.


    # ### 7.1 Connecting Printers to Linux


    To use a printer under Linux, it must first be configured. By default, Red Hat
    configures the parallel port as a module. See the chapter on kernel configuration
    for more information on loading and configuring modules. Once you have the 1p
    module active (you can tell by seeing something like 1p1 at 0x0378, (polling)
    by using the dmesg command), you should be ready to'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'print. Assuming your printer can handle plain ASCII (most do), you can send
    a text file to the printer by using something similar to:


    ```

    cat /etc/motd > /dev/lp1

    ```


    This should print a copy of your motd file to the printer. If you get an error,
    you may want to see dmesg specified something other than lp1 (for example, lp0
    or lp2) and try again. Once this is set up, you can get on with configuring the
    printer.


    # 7.2 Serial vs. Parallel vs. Ethernet Printers


    Using parallel ports the obvious choice for driving a printer since there are
    no baud rates or to worry about and the speed is much greater (parallel ports
    run at about 150 Kbps as opposed to 38.4 Kb for a serial printer). But, there
    are limitations to the parallel port. The greatest of these is the distance. A
    parallel port can run only about 20 feet or so before the signal degrades too
    much and causes errors. A serial printer can run 50 feet at 38.4K, and much longer
    if you choose to use an electrical interface like EIA-530 (RS-422). Also, a serial
    cable can technically run through an RJ-45 (8-pin) wire, or three wires if you
    feel lucky. This is a big advantage over the 25 pins that the parallel port needs.
    Many low-end printers these days have only the parallel port connection, but most
    of the higher-end printers for workgroups or print servers have serial connections
    as well, or are options available after the purchase.


    And there are the Ethernet connections you have to have a printer (see the remote
    printer section below). This is a great idea for some printers, since Ethernet
    runs through most buildings anyway. In a computer situation, where Ethernet is
    running through the room, and the server is in another room, this is an excellent
    idea. As long as the Ethernet printer supports the LPD protocol, and most do,
    you can print directly to the printer via Linux. For ease of configuration, many
    network printers can be configured via DHCP so that you don''t need to install
    extra drivers to get access to them. See the networking chapter for more information
    on configuring DHCP for your network.'
  merge: -1
