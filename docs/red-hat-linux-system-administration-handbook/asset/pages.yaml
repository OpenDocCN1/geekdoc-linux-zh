    We discussed how to troubleshoot the most common stumbling blocks, but

    less common, more esoteric ones certainly exist.


    The best places for information on how to deal with problematic hardware

    are the HOWTOs, the manuals for the hardware and the manufacturers. Also,

    some hardware types have their own newsgroups or mailing lists. These are

    likely to be the best places to ask for help on particularly problems.'
