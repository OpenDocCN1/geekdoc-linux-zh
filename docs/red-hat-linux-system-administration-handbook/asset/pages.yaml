  md: '# 6.7 Internet Agencies


    # 6.7 Internet Agencies


    # InterNIC


    In the early 1990s, domains were free for the taking. If you filled out your template
    and sent in the form, you got yourself a domain name. Everyone thought this would
    go on forever, but alas...


    In the mid 1990s, the National Science Foundation (NSF) started cutting off funding
    to the Internet and allowed other commercial organizations to begin using the
    Internet to sell and advertise. The response was an explosive growth in the number
    of domains being added. This got into the hundreds of thousands per year. To impose
    some order on and make up for the missing NSF funding, InterNIC (http://www.internic.net)
    was created to provide for a top-level DNS domain and to register new organizations
    within the United States. The downside was this a new Internet fee: $70 for the
    first two years, then $35 each year after. After paying this fee, you are entitled
    to have your domain registered in the InterNIC database and your domain can be
    recognized by the rest of the Internet. This doesn''t mean that the InterNIC will
    give you anything else, like DNS services or an Internet link. You will just have
    your domain name registered and a pointer to a DNS server. You''re still responsible
    for getting Internet service and a DNS


    The InterNIC only handles U.S. domains: .edu, .net, .org, .com, .gov, and .int.
    Other domains, such as .us or other country-based domains, are not registered
    with the InterNIC, and you will have to find out who handles your regional DNS
    service to register with them. Many of these have a fee, but some (like .us) are
    free or have a smaller fee than the InterNIC. To register the .us domain, go to
    http://www.isi.edu. The .us domain doesn''t give the kind of general quality that,
    for example, .com would give. For example, instead of wayga.net, you''d probably
    get something like wayga.billerica.ma.us but I could still build a domain under
    that such as ftp.wayga.ma. In some ways, this is preferable to a .com domain since
    it allows you to specify the location of a site (ibm.ark.ny.us) directly. Foreign
    companies have slightly different divisions and may subdivide by location, type
    of organization (commercial, educational, etc.), or a combination of these. To
    find out the contacts for a particular country''s top-level domain, check out
    http://www.isi.edu/div7/iana/domain-names.html.'
