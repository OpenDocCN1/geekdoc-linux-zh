    has smbfs, this program can be used in areas where multiple people may have access
    to a single machine. Operation of smclient is a bit different- from smbmount:


    smclient service options


    where service is the Netbios name of the SMB server and its share name. Unlike
    smbmount, service is listed as \nebula\users\auratek\market. Since the \is an
    an escape character under many shells, you may need to escape it and make something
