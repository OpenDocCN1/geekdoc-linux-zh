    you use are written in C. If you don''t know C now, in the course of compiling
    and installing software, you will at least become a little familiar with it.


    GCC is the "native" C compiler for Linux. It supports everything a good compiler
    should: optimization, debugging, ANSI C support, and POSIX compliance. Not more
    than a lot of compilers are shipped with or are available for some commercial
    OSes. SunOS in particular have a very lame compiler, but it was enough to compile
    the first stage of GCC to bootstrap your way up to a full GCC compiler, which
    is all we ever used it for.


    C is the most popular compiled language for high-performance, general programming.
    Because it is compiled, it is typically faster than an interpreted language like
    Perl or Python C is also a fairly low-level language. This type leads to longer
    development times for software. On the other hand, because it is a low-level language,
    it is possible to tune code to achieve higher performance than high-level languages.


    Because compilers exist for virtually every OS and platform, it is usually possible
    to port a C program to other platforms. Architecture or OS-specific libraries
    obviously complicate this process (GUI libraries especially), but frequ-ently
