  md: '# 9.7 Remote Email (POP and IMAP)


    POP (Post Office Protocol) and IMAP (Internet Message Access Protocol) are two
    of the standards for receiving email from a remote machine. The best example of
    remote email use is in an office situation where there is a Linux server and Windows
    (Mac, or other UNIX) clients also running on the net-work. The clients can receive
    their email in a number of ways (Eudora, Netscape, PC-Mine, etc.) and still have
    one central mail server.


    Each protocol has strengths, weaknesses, and assorted Mail User Agents (MUAs)
    that support them. Both are available in a Red Hat install setup ready to run.
    Authentication of email is done by the same PAM scheme that is used to log in.
    One of the advantages of using POP or IMAP is that little user setup is required.
    You can typically install and run client software with-out trouble.


    # POP


    POP (Post Office Protocol, defined in RFCs 937 and 1225) was one of the first
    methods for retrieving and sending email to/from a remote machine. The protocol
    is rather simple. You can get, list, and delete mail. That''s it. The good thing
    about it, though, is that you can pick up your email at the office from home.
    The downside to POP is that the email on the server is often deleted once you
    send it to you.⁹ While you can get your email from work to home, then you have
    to send the email back from home to work, or you won''t have any email at work.
    Netscape, Outlook, and most PC-based email programs handle POP.


    The POP server (popper) is included in a typical Red Hat distribution of the imap-4.5
