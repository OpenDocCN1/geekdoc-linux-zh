  md: '# 15.5 Using Window Managers


    Pager—Sets up a virtual desktop, allowing you to have multiple desktops to work
    in. FVWM can also be configured to start specific programs in specific virtual
    desktops for easier use.

    Task bar—This is one of the critical parts of FVWM-2, the current time, status
    of any incoming email, and the ever-popular start menu.


    Buttons—If you look up the task bar in the FVWM2-95 window, you''ll see a series
    of buttons, a clock, and the desktop (the pager module). This is the button module,
    and it cannot only create buttons to start programs (Netscape, xterm, etc.), but
    it can also have the output of some programs running inside it. The clock and
    FVWM pager are two examples of this. Some users have CD players, system load programs,
    and other programs running within the buttons. With as most FVWM functions, the
    style, size, contents, and location of the buttons can be set from within the
    .fvwmrc file.


    Audio—Yes, if you choose, you can have FVWM make noises when you do things within
    FVWM (opening windows, starting FVWM, stopping FVWM, etc.).


    Auto—This module allows you to automatically “raise” (bring to the front) a window
    after a certain amount of time. The window must have the focus for the allotted
    time before the window gets raised.


    # GNOME


    GNOME stands for the GNU Network Object Model Environment. GNOME’s goal is similar
    to KDE: It aims to provide an open source, user-friendly, feature-rich desktop
    environment. Unlike KDE, it does not have a built-in window manager; rather, one
    may use any of several window managers that make use of GNOME’s features. GNOME
    is also standards-compliant, using common, open standards for object brokering,
    drag-and-drop, documentation, and 3D programming.


    GNOME uses GTK+ as its toolkit. One of the greatest features of GTK+ is its themeability.
    This feature allows you to change the look and feel of GTK+ applications without
    recompiling them.


    GNOME also uses an object model named Baboon for interoperabilty between its components.
    Baboon complies with the CORBA specification.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Getting GNOME


    GNOME 1.0 comes with Red Hat 6.0 and subsequent versions should include current
    or nearly current versions of GNOME. At the present time, development is proceeding
    rapidly enough that you will likely want to update GNOME independently of Red
    Hat.


    Information on getting and installing GNOME can be found at http://www.gnome.org/start/getting.html.
    Unfortunately, the number of packages that comprise the base GNOME installation
    is quite large. The total is nearly 50 RPM packages. In addition, if you plan
    to compile or develop GNOME software, you will need the additional 17 or so GNOME
    development packages.


    Download all the files to the same directory and run -Uvh *.rpm to upgrade/install
    all the packages. You may run into version dependency problems. If you do, you
    will likely have to remove the conflicting packages.


    Alternately, you can compile GNOME and its associated programs from source. There
    are still about 50 archives to download and compile, for which you will need a
    couple hundred megabytes of disk space and a lot of time.


    # GNOME Features and Applications


    The family of GNOME-aware applications is growing and developing at a rapid pace.
    Many applications are still in beta or even alpha, but are still usable.


    All GNOME software applications share these features:


    +   - Session awareness—When you restart an application, it is restored to the
    state it was in when shutdown occurred


    +   - Drag-and-drop—GNOME supports several drag-and-drop protocols, including
    Xde and the X windowing system''s drag-and-drop protocol.


    +   - Internationalization—The uniform internationalization standard and localization
    allow a new language to be supported without recompilation.


    +   - 3D—GNOME uses Mesa, a free implementation of OpenGL, a popular 3D programming
    application.


    +   - DocBook SGML standard—Documentation can be viewed directly with the GNOME
    help browser, converted to HTML for viewing over the Web, or converted to PostScript
    for printing.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# 15.5 Using X Window Managers


    A number of traditional Linux utilities and user programs have GNOME-aware versions.
    To name a few:


    gtop—A graphical replacement for top, gtop shows the normal top-like display,
    plus graphs of memory or CPU usage.


    gftp—A graphical FTP client. It supports simultaneous downloads, resuming of interrupted
    downloads, proxies, and more.


    Electric Eyes—ee is an image viewer, similar to xv.


    gEdit—A simple GNOME-aware-based text editor.


    gtalk—A talk daemon and GTK-based talk client.


    gmc—A GNOME-aware file manager.


    Balsa—A GNOME application for reading email. It supports POP and IMAP, as well
    as the reading of local mail.


    Scores of other GNOME-aware, or at least GTK, applications exist: IRC clients,
    GNOME interfaces to other languages (Python, Perl, C++, Pike), games, financial
    packages (a la QuickBooks), and scientific programs, just to name a few.


    For a complete list of software, as well as information on its state of development,
    see the GNOME software map at http://www.gnome.org/applist/list-martin.shtml.


    # Configuring GNOME


    The GNOME Control Center can be used to configure nearly every aspect of GNOME.
    Functional items such as which window manager to use, keyboard and mouse parameters,
    session management and MIME handlers can be configured, as well as more trivial
    aspects as backgrounds, themes and sound triggers.


    The following shows a screenshot of the control center.'
  merge: -1
