- img_proc: true
  md: '# 14.8 Summary


    Because of its popularity, extensibility, and power, we went into detail about
    Apache and its two secure derivatives: Apache-SSL, a freeware secure server of
    questionable legality in the U.S.; and Stronghold, a commercially supported and
    legal secure server available in and outside the U.S.


    We also discussed various methods for interacting with the system server is running
    on: CGI and SSI, as well as PHP, a scripting language designed to be embedded
    into HTML and then parsed by the PHP interpreter running on CGI or FastCGI or
    compiled into Apache.


    Setup and configuration of a server for streaming audio and video were examined.
    Additionally, tools for creating content files were also discussed.


    Lastly, we went through the compilation and setup of a non-secure Apache server
    with PHP compiled into it. In turn, PHP was configured with MySQL support so it
    could access MySQL databases locally or remotely on other machines.'
