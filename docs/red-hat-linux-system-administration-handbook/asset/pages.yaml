  md: '# 14.3 Apache and ApacheSSL/Stronghold


    server will return a 404 (File not Found) error instead of displaying the directory’s
    listing.


    To make the entire filesystem off-limits to the server, a directive like this
    would be placed in the access.conf:


    ```

    <Directory />

    AllowOverride None

    Order deny,allow

    Deny from all

    Options None

    </Directory>

    ```


    “Wait a second! I want to serve Web pages!” Ah... then you need to tell Apache
    what directories it can serve pages from. A statement like this:


    ```

    <Directory /home/*/*/public_html>

    Order allow,deny

    Allow from all

    AllowOverridesIncludesNOEXEC

    </Directory>

    ```


    lets you serve pages from your users’public_html (this is the default directory)
    from which files are served when a request that ends in ~username is received)
    directories and lets them use SSI that doesn’t execute external programs or CGI
    scripts,


    ```

    <Directory /home/*/httdocs>

    Order deny,allow

    Allow from all

    AllowOverrides All

    </Directory>

