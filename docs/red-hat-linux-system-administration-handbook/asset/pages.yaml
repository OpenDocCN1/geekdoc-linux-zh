  md: '# 14.4 Logging


    # 14.4 Logging


    As you might expect, Apache supports the Common Log Format (CLF). It can also
    write its logs in the format used by NCSA’s server; this is nice if you have homegrown
    log analysis tools developed for NCSA httpd.


    The number of tools for analyzing httpd access logs is bewildering. Many are free,
    but there are commercial tools out there as well, though few run on Linux. On
    the other hand, many of the free ones run on Linux on Mac or Windows machines.


    Which one you choose is a matter of taste. We will describe a couple below, but
    you will likely just have to try some and see if you like them.


    The log analysis tool we have found most useful is http-analyze. It is free and
    information on it can be found at http://www.netstore.de/Supply/http-analyze/index.html.


    One particular tool deserves special note: 3Dstats. It formats its output in VRML,
    which you can view with a VRML scene viewer like vrbeh. 3Dstats’s home page is
    http://www.netstore.de/Supply/3Dstats/ and vrbeh is http://www.iicm.edu/vrbeh.


    To investigate other analysis tools for your httpd logs, a search on http log
    analysis will produce more choices than you will have time to try.


    # 14.5 Databases and Web Servers


    With the desire for dynamic content in the presentation of large amounts of information,
    it is natural that databases would enter the Web equation. They are the best and
    fastest way (not the most space-efficient, though!) to organize and retrieve data.
    There is support for free and commercial databases in the popular languages used
    for CGI, including Python, Perl, and C.


    The choice of database to use is dependent on many factors. Among the most important
    is easy access via CGI or PHP if you choose to employ one of them. For a list
    of database servers available for Linux, see the chapter on applications.


    # 14.6 Setting Up a Killer Web Server


    This section will walk you through setting up a “complete” Web server: Apache
    with PHP compiled and integrated support for MySQL, a free'
