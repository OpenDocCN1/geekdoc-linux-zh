  md: '# Wabi


    Wabi is a commercial MS Windows 3.1 emulator developed by Sun Micros. It has been
    ported to Linux by Caldera. It provides for cutting and pasting between applications,
    remote display, application sharing between users, Winsock networking, OLE (Object
    Linking and Embedding), DDE (Dynamic Data Exchange), access to serial and parallel
    ports, and many other features.


    Wabi has a few limitations. It requires 8-bit color, so if you are running X with
