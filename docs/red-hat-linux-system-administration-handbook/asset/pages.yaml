    # 14.8 Summary


    This chapter scratched the surface of what has become an incredibly huge and complicated
    subject in just a few short years. We discussed two types of servers, secure and
    insecure, as well as two methods of implementing them, the common forking server
    and the newer and less common multiplexing server.'
