    **Figure 15-2** Basic E desktop


    IceWM is a leaner, less feature-full window manager. It tries to be compatible
    with mwm (the CDE window manager), as well as faster and less resource-intensive
    than E. It is not designed to be highly configurable or support fancy looks. Like
