    near the front of the disk for your kernel and auxiliary boot files.

    Once you are finished, enter w to commit your changes and exit, returning

    to the install. near the front of the disk for your kernel and auxiliary boot
    files.


    # 2.4 LILO Installation


    LILO stands for Linux loader. It is what is actually run by your system''s BIOS

    at bootup, normally called a bootstrap program (since it pulls the system up

    by its bootstraps). It must be installed on the first IDE hard disk if IDE disks

    are present. If you have a SCSI-only system, it must be on a disk whose SCSI

    ID is 0 or 1. LILO allows you to boot your choice of operating systems at

    boot, allowing you to boot Linux, DOS, Windows, and so on. LILO also

    allows you to pass commands to the Linux kernel on startup. We cover more

    of LILO in the next chapter.


    Red Hat''s installer gives you the choice of installing LILO in the MBR or

    of the first partition of the first drive. You may also install LILO in the

    root partition where Linux was installed. If you have another boot loader

    (like System Commander), install LILO to the root partition. This leaves the

    previous boot loader intact, allowing you to boot Linux using LILO.


    If you have other operating systems that LILO can boot, you will be given

    the opportunity to configure these as well. This includes most DOS variants,

    Microsoft Windows 95/98 and NT, OS/2, and SCO UNIX.


    If you have a Linux/NT dual-boot system, you can also use NT''s boot-

    loader to start LILO. This is a somewhat involved process and we summarize

    the steps here.


    # Using Linux with the NT Bootloader


    You should install NT first. If you have only one disk, be sure to leave part
    of

    it free to install Linux into. Some people have reported difficulties using NT''s

    Disk Administrator to set up the Linux partitions, so it is best to leave the

    Linux section of the disk unpartitioned and use Linux''s fdisk to do this.


    Install Linux next. The installer may report the NTFS partition as HPFS,

    and it may ask you where you want to mount. Ignore these comments.

    After the install, if you want, you can add NTFS support to the kernel and

    a a mount point. When the installer asks where to install LILO, tell it the

    Linux boot partition. If you tell it the MBR, you will overwrite NT''s boot-'
