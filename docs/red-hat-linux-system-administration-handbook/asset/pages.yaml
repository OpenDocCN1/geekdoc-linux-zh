  md: '# 6.5 Network Information Services (NIS and NIS+)


    rc.d/init.d/autofs. The second script is only needed if you have automount maps
    in your NIS server. You can also set NIS client configuration during the installation
    process. See the installation chapter for more information on this.


    You should make sure that the time service is enabled in /etc/inetd.conf. If it
    is not, uncomment it and restart inetd.


    You will need to set the NIS domain that you''re in. Edit (create) the /etc/defaultdomain
    file to have one line—that of the NIS domain you''re in. Remember that NIS domains
    and DNS names are not the same (did we mention this yet?). Newer versions of Red
    Hat (like the 6.0 release) use the /etc/yp.conf file to edit the NIS domain or
    server to bind to.


    By default, ybind will send an IP broadcast through the network to find an NIS
    server. If the NIS server is on another network, or you want to prevent spoofing
    on the network, you can manually specify an NIS server to use. Edit the /etc/yp.conf
    file and add the hostname for the server. Make sure the host listed is listed
    here in /etc/hosts:


    ypserver nisserver.host.com


    In the examples below, we''ve assumed /etc/passwd is fairly minimal, containing
    entries for the superuser, various daemons, and so forth, but no mortal user entries.


    To append the whole NIS password map to the local /etc/passwd file, add after
    this line:


    ```

