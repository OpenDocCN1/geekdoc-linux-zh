  md: '# 9.7 Remote Email (POP and IMAP)


    office email system, and turn it on at home. This way, all your email gets downloaded
    at work, and you can only get new email from home. IMAP is a much better solution
    to this problem.


    # IMAP


    IMAP (RFC 2060) was created to handle some of the deficiencies of POP. IMAP is
    designed to be a client/server setup, where the server keeps the mail until the
    client requests that it be deleted. In POP, all the email is downloaded at once,
    which is a bit of a problem for large messages over slow links. IMAP allows for
    downloading only the body of a message when it is required, allowing you to quickly
    download header information and read only the messages you want to read. Email
    can be stored in different files (often called folders) to allow you to organize
    your mail easier. These folders remain on the server side and can be accessed
    by the client software at any time.


    Another feature of IMAP is disconnected mode, sometimes called offline. If the
    client supports it, you can have the client download one or more folders to your
    local machine, usually by selecting an option to go offline, download folders,
    or offline mode. You can then read, modify, delete, reply, and so on without being
    connected to a network. When you return to your network, you can return to online
    mode and synchronize the client and server. A list of clients and their support
    for IMAP can be found at the official IMAP home page, http://www.imap.org. Both
    Netscape Communications and MS Outlook support IMAP and offline mode.


    The IMAP server is included with Red Hat in the imap-4.5 RPM, and is configured
    to get files from /var/spool/mail. To configure it using qmail, you''ll need to
    recompile the server. Client setup is about the same as POP; set the server name
    and the username/password. One option that you may want to look at is the server
    directory option. This option tells the client what directory on the server contains
    the mail folders (not the mbox or new mail—that''s hard-coded on the server).
    By default, this is the user''s home directory, and if a user does not store other
    files in that directory, you''re okay. However, if you share user home directories
    via Samba or NFS, like ~user/Mail, you''ll want to change the server directory
    to something. The downside is that you have to set it each time you configure
    someone for IMAP. The benefit is that your users won''t confuse their email with
    their regular files.


    By default, mbox (mail that was read and not put in another mail folder) is stored
    in the same file used by the UNIX mail program. New mail is checked for in /var/spool/mail.
    If you need to'
