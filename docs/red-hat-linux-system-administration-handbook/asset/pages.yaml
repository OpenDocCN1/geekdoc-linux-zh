    # NFS


    The Network File System (NFS) allows a server to export a directory or an entire
    filesystem to other systems. This feature provides for not only getting the most
    out of hard drives, but it can also allow a user''s home directory to exist anywhere
    on the network, just as if it were local.


    Setting up NFS for use is easy, as Linux installations start up the necessary
    software at boot time. All that''s left to configure the NFS servers. If NFS isn''t
    started on booting, all you need to do is fire up rpc.mountd and rpc.nfs on startup.
    This is a script in the /etc/rc.d/rc3.d directory. The other item that needs to
    exist is the /etc/exports file. The /etc/exports file lists directories which
    can be exported to other machines. The /etc/exports file has a setup of the following:


    ```

    directory options

    ```


    where directory is the directory to be exported, and options are any additional
    options to work on that export. The options are many and provide different options
    per host. Any options not enclosed in a host are assumed to be for any hosts.
    Options can be the following:


    +   * insecure—Allows non-authenticated access.

    * ro—Mounts read only (good for use with insecure)

    * rw—Mount read write.

    * root_squash—Prevents the root user from having any special access to the NFS
    drive by mapping UID 0 (root) to UID 65524. This option is by default.'
