  md: '# 6.5 Network Information Services (NIS and NIS+)


    # Setting Up an NIS Master Server


    Make sure that you have the ypserv package installed. If you need to install it,
    it can be found on the Red Hat CD, FTP site, or one of their mirrors.

    Next, edit /var/yp/Makefile to add or remove the maps you will be serving. The
    line starting with all: contains the list of maps.

    Now edit /var/yp/securenets and /etc/ypserv.conf. The first defines the IPs from
    which the server will answer requests. It is fairly simple and well-commented.


    ```

    # Sample /var/yp/securenets

    #

    #

    # Allow localhost access. This is necessary!

    #

    host 127.0.0.1

    #

    # Allow access from machines on the local network

    #

    255.255.255.0 10.10.10.0

    #

    # Access from two class C networks 209.1.2.0 and 209.1.3.0

    #

    255.255.254.0 209.1.2.0

    ```


    The /etc/ypserv.conf file lets you further customize the server''s behavior at
    the host or network level on a per map basis. There are two types of entries:
    options and access rules. Options have the simple format of <>: yes|no, i.e.,
    the option is either on or off. Access rules have the format host : map : security
    : password_mangle. Access rules are read until a match is found for the host and
    map being requested, then the rule is applied.

    An option that is commonly turned on is dns. The following line would tell the
    NIS master to consult DNS if it finds a host in its host maps.


    dns: on


    The following lines simulate shadow passwords for a particular network for privileged
    ports (those numbered under 1024) and deny access to the maps to other hosts:


    ```

    10.10.10.0/255.255.255.0 : password.byname : port : yes

    10.10.10.0/255.255.255.0 : password.byuid : port : yes

    * : password.byname : port : yes

    ```'
