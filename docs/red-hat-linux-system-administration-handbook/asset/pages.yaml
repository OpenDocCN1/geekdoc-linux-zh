  md: '# 7.3 Configuring a Printer


    # 7.3 Configuring a Printer


    Linux uses the BSD style of printing. That is, there is a /etc/printcap file that
    has to be modified, and the commands are lpr, lpq, lpc, lpr, and so on. One advantage
    of the BSD method over SYSV is that it makes printing-inters and modifying printer
    setups very easy. Here''s a copy of the printcap for an HP LaserJet 4L connected
    to the parallel port on Red Hat:


    ```

    lp:

    :sd=/var/sp/lpd/lp:

    mx#0:

    lp=/dev/lp1:

    if=/var/sp/lpd/lp/filter:\n:sh

    ```


    This printcap entry is really all one line. You can tell because in the Linux
    world, a line that ends in \ is automatically added to the next line. Each printcap
    entry is one line, but that line can be extremely long. The first line (the lp:)
    defines the name of the printer. You can add alias names for the printer by adding
    |<alias>. Once the name is given, the options can be put in any order. Here are
    what the above options means.


    +   - sd—Spool directory. This is where the files that have to be sent to the
    printer are stored. This is usually /var/sp///</<printernamenn--—— set a a maximum
    maximum size size that can to the the.. # # means there is no maximum file size.
    The The is is 1000 blocks,, which which to ton- lp—The device name for output.
    The /dev/lp1 specifies a parallel printer, but you can also use a serial device
    if you wish.

    - if—Input filter. Any file going to the printer gets piped to this command before
    being put in the queue. This is where the Red Hat Printer Manager comes in and
    does its work, and where other magic filters get installed as well.

    - sh—Suppresses printing of burst pages. Burst pages list the user, the name of
    the file being printed, and the job number, along with other information. Think
    of this as a fax cover page. In a small network, you don''t need burst pages,
    but if you have five or more people using the printer, it''s a good idea to have
    it.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'The printcap man page has a list of all the options, what they''re used for,
    and the default settings. If you''re using a serial printer, you will want to
    add the following settings:


    +   - br—Baud rate to use. Any valid baud rate will work.

    - ms—tty settings give to the serial port after opening and before sending data.
    This is usually to set up things like hardware flow control.


    A sample line addition of an 8-bit connection using hardware flow and running
    at a rate of 38.4 Kbps:


    ```

    br#3840:cs8,-parenb,-cstopb,crtscts\

    ```


    # 7.4 Print Filters


    Print filters are programs that convert from multiple file types to one that your
    printer can understand. In most cases, this will be either PostScript (really
    easy to do) or PCL (harder, but not by much). The reason PostScript is so easy
    to use with printers is because of the higher-end printers are connected to UNIX
    machines, and therefore the programs were written to output in PostScript. Now
    that PCL is being used more often in the lower-end printers, and since Linux is
    everywhere, you''ll probably need some kind of converter. This is where print
    filters come in.


    Red Hat comes with a collection of filters that can correctly change just any
    file format into something your specific printer can understand. The filters take
    longer to convert a PostScript file to PCL, but the output is similar, and you
    don''t have to spend hundreds to get a PostScript cartridge for your printer (if
    one is even available). Fortunately, you won''t have to worry much about the filters
    being installed. All you need to do is configure the printer via the Red Hat printtool
    and you''re all set.

    Now, let''s hook that printer into a network.


    # 7.5 Printers on the Network!


    When the printcap is set up, you''ll need to restart the printer daemon (lpd),
    which should already be running and will be once Linux starts. To inform Linux
    of the changes on the /etc/printcap file, you can send a HUP signal (1 for Linux)
    to the lpd process. This will cause it to reread the /etc/print-'
