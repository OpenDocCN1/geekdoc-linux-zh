  md: '# Installation 2


    Here we try to cover a few common installation types from servers to desktop systems,
    as well as some of the pitfalls that are encountered when dealing with very old,
    very obscure, or very new hardware.


    Depending on your needs, desired setup, and hardware, installing Linux can be
    as easy as pie or more like taking a tiger by the tail. Anyone who has installed
    an operating system knows this is true for any OS, particularly on the x86 platform.


    Red Hat has gone out of their way to provide a very clean, easy, and user-friendly
    installation. Recent releases include autodetection of some cards, allow for a
    LAN or Internet install, and provide for pre-configured default installations
    to let you get started quickly. Red Hat also is the only company to have distributions
    that install on x86, Sparc, and Alpha-based systems. Once installed, the distributions
    are pretty much all the same.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'The 6.0 release of Red Hat adds a number of new features to one of the best
    Linux distributions, and many of these we cover later in this book:


    +   - The latest 2.2 kernel, which provides improved support for RAID and SMP

    - GNOME, the windowing environment and the Enlightenment Window Manager.

    - KDE Window Manager.

    - Better support for laptops.

    - Three default configurations, "workstation" and "server", to automatically set
    up and install a system with a minimum of questions, plus a custom that allows
    for a more personalized configuration.

    - The latest versions of most software.


    If you have an existing Red Hat system and want to upgrade, check the section
    on upgrading later in this chapter. You may also want to review the sections on
    booting since you will need to use a boot floppy or CD-ROM. While we are focussing
    here on the x86 platform, much of this information is applicable regardless of
    the architecture you are using.


    # Getting Linux


    Red Hat has three versions of their distribution that are available to you.

    First is the "100% official" release, as Red Hat calls it¹. This shrink-wrapped
    version sells for about $80, has three CD-ROMs, a boot diskette, two manuals with
    installation and getting starting guides, and 30 days of telephone support. This
    release is available in most computer stores and bookstores. Of the CD-ROMs, one
    is for binary installation of packages, and the other CD-ROM in the jewel case
    contains source code for all the applications that have source code. The third
    is not in the jewel case. That is an application CD full of trial versions of
    commercial applications. We cover the contents of this CD later in this chapter.
    If you are new to Linux, this is the version for you.


    The second release is the Power Users version of Red Hat. This includes CD-ROMs
    with the install and source code, but no application CD, no manuals, and no telephone
    support. This version is available only from Red Hat


    > We’ll call this the official release from here on.'
  merge: -1
