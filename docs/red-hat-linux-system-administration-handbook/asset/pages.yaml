- img_proc: true
  md: 'drivers and features you wish to compile directly into the kernel and which
    you wish to leave as loadable modules.


    The Linux developers have worked hard to make this as painless as possible, this
    flexibility has not cost much in ease of use as you might have expected. The kernel
    has two menu-driven configuration options: one X-based and the other screen-based.
    Additionally, there is the simple line-based, linear configuration.


    # 17.2 Which Kernel?


    If you are familiar with Linux, you probably already know that at any given time,
    there are two current kernel versions: a production version and a developmental
    version. The developmental (sometimes called experimental) kernels typically have
    experimental and sometimes buggy or unstable features, though it should be noted
    that a truly buggy release of either a production or developmental kernel will
    be fixed very quickly with a new release.


    Production kernels always have an even minor release number, while development
    kernels have odd minor releases. The minor release number is the second of the
    three numbers that make up the kernel version number. For example, 2.1.121 is
    a development kernel, and 2.2.3 is a production kernel. The next minor revision
    up from a production kernel is developed in parallel with the production kernel.


    In general, unless you need a feature available only in a developmental kernel,
    it is usually best to stick with a recent production kernel.


    Since Red Hat includes most kernel options as modules, it is very easy to include
    support for one device or another by loading in the module, or by letting insmod
    do it for you. There are, however, a few features that cannot be included as modules
    such as APM support. In these cases, you''ll need to recompile the kernel.


    # 17.3 Getting Ready


    There are a few things you will need or want to have handy while you are rolling
    out a new kernel. The manuals for your peripherals and your motherboard are good
    starting points. You will at least need to know the number of your various peripherals
    and, in some cases, some hardware settings like interrupt request lines (IRQs)
    and memory addresses.'
  merge: -1
