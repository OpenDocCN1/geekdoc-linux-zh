    # 20.6 USB Support


    USB (Universal Serial Bus) is a method of trying to connect low-speed devices
    through a single connection on a motherboard. USB allows you to connect keyboards,
    mice, scanners, video cameras, digital speakers, and even Ethernet interfaces
    directly into a machine. USB provides for low-speed (1.5MB) and high-speed (12MB)
    devices, allowing for up to 127 devices per machine. USB is plug-and-play, meaning
    you can swap devices at will.


