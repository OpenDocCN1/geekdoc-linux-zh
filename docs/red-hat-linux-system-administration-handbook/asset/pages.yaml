    and install its .rpm


    # Setting Up Anonymous FTP


    In the instructions below, /home/ftp is the home of the anonymous FTP user as
    specified in the /etc/passwd file.

    The FTP daemon, ifptpd, recognizes the anonymous user and adjusts some aspects
    of the account. The root directory for access is set to /home/ftp. This means
    that access is limited to the directories and files in /home/ftp at best. Permissions
    can, of course, restrict access further. The filesystem root is changed, several
    directories and files need to be set up to allow the necessary minimum level of
    functionality. The anftp RPM does this.

    The directory structure should be set up as follows:


    +   * /home/ftp—should be owned and only writable by root.

    * /home/ftp/bin—should also be owned and only writable by root. /home/ftp/bin
    should be owned by root and contain the follow pro-'
