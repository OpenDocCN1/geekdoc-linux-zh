  md: '# 10.7 FTP Clients


    Today, probably the most common way to access anonymous FTP sites with a Web browser.
    These are typically the only clients that support anonymous FTP well. It is possible
    to access sites with a username and password with URLs of the form `ftp://username:password@host.name/`.
    You should leave password empty, to avoid displaying it in clear text. Your browser
    should then provide a pop-up for you to enter it in.


    There are also a number of other FTP clients, ranging from the simple command
    line like the ftp program to full-screen clients like NcFTP to graphical clients
    like XFTP.


    # ftp


    The ftp program is a command-line-based program. It is not particularly friendly,
    but should always be available on any Linux (or UNIX system).


    # NcFTP


    NcFTP is a full-screen (still ASCII) FTP client. It sports a number of features,
    including:


    +   - A list of shortcuts for FTP hosts, including storage for usernames and passwords
    (if so desired) for each host.

    - Automatic connection as anonymous (sends anonymous as the username and a string
    you supply as the password defaults to username@host; the anonymous FTP password
    is stored in the .ncftp/prefs file of your home directory.

    - The screen is split into a command typing area and an output area.

    - File and directory name completion using the TAB key.

    - Viewing of remote files with a pager like less or more.

    - Support for wildcard expressions when putting or getting files, without having
    to use separate mput or mget commands.

    - Support for FTP: URLs, for example, ftp://www.snerdwump.org/pub/wump-1.2.4.gz.

    - Batch operation.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# gFTPTP


    If Gnome is installed, you can also use gFTPTP, which is a graphical FTP client
    that makes full use of the Gnome environment. It allows for drag-and-drop if you
    are running a window manager that is Gnome-compliant, such as WindowMaker or Enlightenment.


    gFTPTP''s features include multithreading for multiple simultaneous downloads,
    proxy support, passive and active transfer modes, immunity to buffer overflows
    from malicious FTP servers, directory caching, bookmarking, and editing of local
    and remote files.


    # XFTP


    XFTP is an X/Motif-based FTP client. It supports things such as selecting groups
    of files for upload or download. It can also move files between other computers
    (i.e.


    Local and remote files can be viewed with a built-in pop view or with a user-specified
    viewer such as emacs, less, or more. Additionally, you can specify a program to
    use for various graphic formats.


    Finally, the interface allows for a large amount of user configuration.


    # 10.8 Summary


    FTP is an incredibly useful service—one of the few that has not been eclipsed
    by the Web. (Things like Gopher, Archie, and WAIS are all dead now, replaced by
    Web equivalents.)


    Most of you will, at worst, have to set up an anonymous FTP server and possibly
    make sure users can access their accounts via FTP. This can be trivial if your
    machine was set up to handle FTP initially, as most Linux boxes are. You may have
    to create a few files and directories, however.


    The trickier things to set up are FTP-only accounts and virtual FTP clients. Hopefully,
    we''ve provided enough information to get you started


    +   * By default, anonymous FTP is rooted at /home/ftp.

    * Not all FTP clients are created equal; a graphical interface isn''t a guarantee
    of ease of use.'
