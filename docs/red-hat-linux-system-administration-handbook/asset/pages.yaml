    # Connecting to an Ethernet Network


    To get hooked into an Ethernet network, get yourself an Ethernet card. Most should
    work, but you may want to check out the Ethernet HOWTO for a list of cards. The
    most part, if it''s from a major provider like 3Com, there is probably support
    for that card. Install the card in your machine and there reboot. If the kernel
    recognizes your card, you''re set for now. If not, recompile the kernel and be
    sure to add support for your particular Ethernet card. The first Ethernet card
    is usually designated eth0.


    To add networking for this Ethernet card, you have to first initialize and set
    up the IP interface, then you have to set up routing for the interface just set
    up. No, the two are not the same. The IP interface merely gives the kernel IP
    address to work. It still needs to know when a packet wants to go out and what
    interface it should use. Otherwise, you''re likely to use the loopback interface
    and your packets will get nowhere fast.


    The /sbin/ifconfig program will register the Ethernet card with the TCP/IP services.
    The typical syntax is:


    ```

    /sbin/ifconfig eth0 netmask <addr> broadcast <addr> <IP address>

    ```


