  md: '# 4 Chapter 1 • Introduction


    Applix, Motif, Oracle are already available for Linux, with more being

    added.


    # 1.5 Is Linux SYSV or BSD?


    The simple answer to this is "Yes." Linux takes the best of System Five

    (SYSV) (like startup files) and the Berkley System Distribution (BSD) (ps

    aux, getty) and combines them. As a downside, some features of each are

    missing (like streams) and you should make yourself aware of what features

    each are in Linux. If you''re compiling or porting software, you will proba-

    bly find luck writing towards BSD. Check the man pages for system

    calls for more information on this.


    # 1.6 Support


    Contrary to popular belief, commercial support for Linux is available. While

    there is seldom a need for it, Red Hat has telephone and email support for

    the Linux distribution. With the number of users that have Linux on their

    machines, devices from the latest 3Dfx-based 3D cards to the Mattel Power-

    Glove have drivers available, and everything in between. The support is often

    somewhat better than other operating systems, as the author of a partic-

    ular driver is sometimes available via email and is often willing to help if your

    driver is not behaving properly. Some hardware drivers have released patches

    within 24 hours to users.


    More companies are starting to add 24x7 support for Linux, including

    large companies such as HP.


    # 1.7 What You Need


    So do you need to run Linux? It varies greatly, depending on what you

    want to do with it. If you''re going to use Linux to dial up the Internet, a low-

    end Pentium will suffice. If you want have a dial-in pool to get access to

    traveling engineers or salespeople, a 100-Mhz 846 is great. If you want a\iller
    deadly system or something to write a book, with a Pentium II or

    6-III will just do fine.


    What? You have a spare Spare Classic with nothing better to do? Turn it

    to a Linux Samba server. Let the people running Windows 98 or NT access'
