    # Tape Operations


    Another feature of tar is its use of different device names. Based on the device
    name that tar uses, it can make the tape rewind to the beginning or remain in
    place after completing. This is important, if tar backs up a directory, rewinds,
    and backs up another directory, the first backup is overwritten. Using mt to advance
    the tape is time-consuming and increases the amount of coding you need to do calculate
    how far to advance the tape.


    Using the /dev/st0 device name will tell the tape device to not rewind after completing.
    Note that you will need to use this when advancing the tape with mt, or else the
    tape will rewind after being advanced! The regular /dev/st0 will rewind after
    the command is completed, and can be used after a restore to automatically rewind
    the tape. The mt command also supports an explicit rewind, and if the tape device
    supports it, it can also eject the tape. These commands are mt -f /dev/st0 rewind
    and -f /dev/st0 offline, respectively. Other commands to include retension (forward
    to the end of the tape, then rewind), status (to give a status of the tape drive),
    erase (to erase the tape), and a number of SCSI-only options relating to hard-compression,
    buffering, density, and others. Check the man page for mt for a complete list
    of the available options.


    # 19.2 cpio


    In many ways, cpio is similar to tar. It supports more formats (including the
    format used by tar) and can also deal with archives from machines with different
    byte orders. Like tar, cpio can write or read to network devices as well as local
    ones. Finally, cpio can be used in pass-through mode to copy directory trees.


    The choice between using cpio or tar to perform backups is largely a matter of
    preference. If you come across a system that does not have Red Hat installed on
    it, other Red Hat systems (or the RPM install file) contain a program called rpmcpio.
    The purpose of this program is to convert an RPM file to cpio so that it can be
    extracted and installed on other systems.'
