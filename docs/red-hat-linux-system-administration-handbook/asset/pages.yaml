    IP address should work in a pinch to get you up and running. You can also put
    multiple nameserver entries here, and it will search in order until it makes a
    connection to a DNS server.^8


    If you plan on running named (the DNS server software) locally, you should change
    the IP address to read 127.0.0.1. Be sure to have a few other IP addresses in
    there case name goes down.


    # Should You Be a DNS Server?


    You should use the DNS server only in the following cases:


    +   1. You own a domain and want to control over a slow link.

    2. You run a large network over a slow link.

    3. You have no connection to the Internet.


    For item 1, many ISPs will offer to handle your DNS serving for you, but if you''re
    in an environment where machines change frequently, it may be easier to do it
    yourself wait for the ISP to update their tables. For item 2, named can act as
    a cache to store frequently used hosts, and this will reduce some of the traffic.
    In 3...well if there''s no other DNS host on your network, someone should do it,
    and it may be as well as you. If you don''t match any of these three, you probably
    don''t need a DNS server running.


    > 7Yes, if you are using NIS.


