  md: "# 15.5 Using X Window Managers\n\nEven though the windows look different, they\
    \ perform many of the same functions. One advantage that most of the window managers\
    \ have over Windows 98 or NT is support for virtual desktops. That is, you can\
    \ have more than one main window (also called the root window) available to you\
    \ at one time. This lets you have a neater X desktop, or it can you open more\
    \ windows and be able to see all of them.\n\n# fwwm2-95\n\nThe fwwm2-95 program\
    \ is an extension of FVWM, which has a Windows 95 look and feel. However, the\
    \ interface is much more configurable. You have the advantages of the task bar\
    \ and start menu, but you get additional features such as “focus mouse,” where\
    \ the current window is wherever the mouse is. You also get the advantage of configuring\
    \ all the mouse buttons however you you like. This is the most popular window\
    \ manager for those coming from the MS Windows environment since it's so familiar.\
    \ The nice advantage, that is that fwwm2-95 doesn't crash.\n\nThe .fwwm2rc (or\
    \ .fwwm2rc95) file contain startup information for FVWM. Many of the commands\
    \ are similar between fwwm2 and fwwm2-95. Since for our purposes the two window\
    \ managers are rather similar, we'll use .fwwm2rc to talk about both the .fwwm2rc\
    \ and .fwwm2rc95 files.\n\n# Focus\n\nThere are three ways to determine which\
    \ window has the “focus,” that is, which window will be controlled by the keyboard.\
    \ The first method is the one you're most familiar with—click in the window to\
    \ make it the active window. This is called ClickToFocus and it is turned on in\
    \ the .fwwmrc file with the following:\n\n *** ClickToFocus\n\nThe other two methods,\
    \ MouseFocus and SloppyFocus, are very similar. MouseFocus means that wherever\
    \ the mouse pointer is has the control. SloppyFocus is the same as MouseFocus,\
    \ with the exception that if the mouse pointer leaves the window but not enter\
    \ another window (for example, goes to the root window), the window you were just\
    \ in remains focused. You can turn on this focus method with either of these options:\n\
    \nStyle *** MouseFocus\n\nStyle *** SloppyFocus"
