- img_proc: true
  md: '# 7.7 Ghostscript


    +   - restart { all|printer }—Tries to restart a print daemon. Sometimes the lpd
    process will die or get stuck, and this will try to restart a new daemon.

    - status { all|printer }—Gets a status of the printers and lists whether or not
    queues are up or whether printing is enabled.

    - topq printer [job..]—Prints the jobs listed at the top of the queue.


    The lpc man page has more on the commands available, but these will get you started
    with queue administration.


    In the worst case scenario, where the lpc commands do not work, you can use the
    /etc/rc.d/init.d/lpd.init stop command to stop the lpd program altogether. The
    /etc/rc.d/init.d/lpd.init start command will start lpd up.


    For more information or help on how the print services work, check out the Printing
    HOWTO and the Printing Usage HOWTO.


    # 7.7 Ghostscript


    Ghostscript is used by Red Hat''s printing system to convert postscript into other
    forms that can be handled by printers. Since many desktop laser and inkjet printers
    cannot talk Postscript; you need something that can speak both the language of
    Postscript, and the PCL or other printer language used by your printer.


    Postscript has long been a default output method in Linux. It easily handles text
    and graphics, has fonts defined, and it''s easy to create postscript files from
    just about any program. Its downsides include the fact that Postscript usually
    creates large files. There''s also the previously listed fact that not all printers
    talk Postscript. Again, this is where ghostscript comes in. It has a number of
    defined output devices. This allows ghostscript to import Post-script and output
    just about anything, including an X window. While ghostscript can directly output
    to an X window, the ghostview program handles this little easier, allowing you
    to read files from a menu instead of the command line.


    For the most part, you won''t have to worry about how ghostscript works since
    the printtool will convert from whatever format you send to whatever the printer
    can handle.'
