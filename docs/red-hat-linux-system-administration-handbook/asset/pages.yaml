    The Qt library from TrollTech is the library basis for the KDE Window Manager.
    It is written entirely in C++, though there are hooks to interfaces with Python
    and Perl. One of the limiting factors of KDE and Qt is the licensing of the library.
    Qt has recently greatly relaxed its licensing requirements, and many have confirmed
    that the Qt library can now be considered open source.


