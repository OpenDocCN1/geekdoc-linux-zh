  md: "# ipchains\n\nThe ipchains method of network administration is superior to\
    \ the older ipf-wadm for the following reasons:\n\n+   - Works with fragmented\
    \ packets.\n- Handles protocols other than TCP, UDP, and ICMP.\n- Provides for\
    \ easier management.\n- Inserts or deletes chains anywhere in the list.\n\nAs\
    \ an example of how it's easier to manage ipchains, here's the list of commands\
    \ needed to set up masquerading, assuming you already have routing:\n\n```\nipchains\
    \ -P forward -j DENY\nipchains -A forward -i eth0 -j MASQ\\u000\n```\n\nAs you\
    \ can see, the commands are pretty much the same, but you don't need to specify\
    \ IP addresses. All you need to know is which interface is the external one.\n\
    \nMuch like ipfwadm, ipchains is based on a list of rules, each rule having to\
    \ be passed before the packet is allowed into (or out of) the interface. You also\
    \ get the three standard directions: input, output, and forward; they work the\
    \ same way as in ipfwadm.\n\nAfter this, things start to get different—or at least\
    \ the options are different. Here's a sample ipchains firewall that is similar\
    \ to the above firewall. You'll notice that many of the commands look similar.\
    \ One important difference is that port listings with -s and -d (known in ipfwadm\
    \ as -S and -D) can have only one port or range per command. This increases the\
    \ number of commands needed.\n\n```\n#Set default rules:\n# By default, reject\
    \ any packets waiting to get forwarded\nipchains -P forward -j reject\n#Accept\
    \ all incoming and outgoing packets\nipchains -P input -j accept\nipchains -P\
    \ output -j accept\n# Flush (-F) all old rules. \tThis is always good to run.\n\
    ipchains -F forward\n```\n\n> At this time, ipchains only handles TCP, UDP, and\
    \ ICMP. However, hooks are in to handle other protocols (like IPX) as needed in\
    \ the future."
  merge: -1
