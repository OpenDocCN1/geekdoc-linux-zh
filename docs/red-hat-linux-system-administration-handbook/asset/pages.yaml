  md: '160


    Chapter 9 • Email


    The primary program that is the Mail Transport Agent (or MTA) is send-mail. There
    are others available, sendmail is pretty much the standard for most Linux installations.
    You may have seen that really thick book with a bat on it that gets you into the
    nitty-gritty of sendmail. It gets really nitty-gritty.


    The upshot of all this is that you don''t always need sendmail to set up a simple
    email server. The thing you should know about sendmail is this: Always be sure
    you have the latest version. Each version of sendmail, while patching various
    bugs, seems to have a security problem with it. Sometimes it seems like you need
    to upgrade your sendmail software more often than the Linux kernel.


    Enough of that. Let''s get to the sendmail options you will see on start-up. Most
    Linux installations have sendmail kick on boot. Red Hat (being SYSV-ish) has an
    /etc/rc.init.d/sendmail.init script that runs on star-up. An installation could
    start the actual command like:


    ```

    echo -n "Starting sendmail: *

    daemon sendmail -bd -qlh

    echo

    touch /var/lock/subsys/sendmail

    ```


    As you can see, the sendmail program starts with the -bd and -qlh options. The
    -bd signifies that sendmail should start up as a daemon and run in the background,
    waiting for connections, the same way that a Web server is always running, waiting
    for a connection. The -qlh means that sendmail should go through its queue at
    least once an hour and to send any data in its queue.


    There are a number of reasons why an email message would be held in a queue. For
    example:


    +   - You have a dialup-only connection to the Internet, and you send a note while
    you''re not connected.

    - The remote host is not dialed in (same thing in reverse)

    - The remote host is down for upgrades or it crashed.

    - There is no connection to the remote host (the network is down).


    In any of these cases, you''ll want to make sure that your email gets through.
    Leaving the email in sendmail''s queue allows you to do this. A machine directly
    connected to the Internet or on a LAN can change this to


    > ¹If you have anything to do with setting up sendmail, get this book.'
  merge: -1
