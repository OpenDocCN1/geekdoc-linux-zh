    # 6.6 Routing with Linux


    To start routing with Linux, you first have to have two Ethernet ports. This doesn''t
    mean two Ethernet cards, but you do need something like an Ethernet port and a
    PPP connection, or similar. Routing allows you to connect two Ethernet networks
    with the Linux machine in the center. Unlike a switch, which connects two physical
    runs and segregates the two networks on an Ethernet layer, a router segregates
    at the IP layer. Each side of the router has its own subnet. This is good for
    things like PPP dialer servers, or to create links to remote offices, to create
    a safe network that holds the WWW, FTP, and email servers. In the case of Linux,
    a router can also act as a packet filter and provide IP masquerade services.


    Let''s say you''re connecting two physical networks located in the same building
    (say the first and second floors). You have two Ethernet cables in your hand,
    hopefully of the 10-BaseT variety. Now what?


    Get two Ethernet cards in your system, and use kernelmod to load in the modules.
    You can verify the modules are loaded using the dmesg command. The two Ethernet
    cards do not have to be the same type, but it helps if'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# 6.6 Routing with Linux


    they''re different, since this allows you to explicitly know which card is.

    The example below has a 3Com 3c503 and a Digital 21140-based card.

    nThe /etc/conf.modules looks like this:


    ```

    alias eth0 tulip

    alias eth1 3c503

    alias char-major-14 off

    alias sound off

    ```


    options eth1 xcvr=1

    Because of the above setup, we know that eth0 (the first Ethernet port) is

    go to be the tulip (which is the name for the Digital/Intel chip). The sec-

    net port is the 3c503 card. The last line that starts with options

    tells kerneld to pass xcvr=1 when loading the 3c503 module. This allows us

    to use the AUI port instead of the coax port on the card.


    You may want to change /etc/conf.modules and restart kerneld,

    load the modules by hand the first few times to make sure you don''t have any

    problems. If you''re using kerneld to load modules, they won''t get loaded

    til until you actually use them. You can use the Red Hat netcfg program to

    start up both Ethernet cards on their respective networks.


    # Routing Using Red Hat netcfg


    The netcfg program does many of the routing setups that would normally

    have to be done by hand automatically and on startup. These files get stored

    in /etc/sysconfig and are compatible with linuxconf''s routing scheme.


    # Routing by Hand


    These commands, entered by hand, will allow you to route between two net-

    works:


    ```

    /sbin/ifconfig eth0 192.168.1.10

    /sbin/route add -net 192.168.1.0

    /sbin/ifconfig eth1 192.168.2.10

    /sbin/route add -net 192.168.2.0

    /sbin/route add default gateway 192.168.1.15

    ```


    If you use these in a file like rc.local, it will work, but it is not compatible

    with the way that linuxconf or netcfg stores its routing information. Make

    sure you are not conflicting with these other methods'
