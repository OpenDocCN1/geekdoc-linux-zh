    have to be loaded in memory. This allows one configuration to have a very bare-bones
    setup, while another setup may have all the bells and whistles (literally).


    Modules started either in the .fvwmrc file or they can be started by the menu.
    Here are some of the major modules you''ll see in FVWM2:'
