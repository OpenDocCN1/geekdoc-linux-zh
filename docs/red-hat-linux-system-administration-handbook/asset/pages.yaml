    # 6.4 AppleTalk


    To round out the list of Linux-supported networking/file sharing protocols, we
    turn to AppleTalk. Using Linux as an Apple fileserver has several advantages:


    +   - No limit on simultaneous users. Apple''s AppleTalk, however, sets a limit
    of 10 concurrent users. To go beyond this limit, you must upgrade to Appleshare,
    which isn''t free.

    - It is extremely versatile. The Linux server can also, as discussed earlier,
    serve disks (possibly the same disks) via NFS, SMB (Server Message Block, as Samba,
    used by the Windows OSes) and IPX (Novell Network).

    - You can take advantage of the superior remote access features of Linux, which
    none of the popular non-Unix-based OSes can rival.

    - Because Linux is truly multitasking and has less overhead than MacOS, performance
    will generally be better. Mac OS X, with its kernel, will likely narrow this performance
    gap.


    There are a couple of minor disadvantages. First


    Second, the MacOS filesystem (HFS) supports a very loose file naming convention
    after a fashion. Considering how restrictive traditional UNIX file naming conventions
    are, it supports it very well. However, some characters must escape or be encoded
    somehow and then filenames may look different when viewing them from the Linux
    side of things.'
