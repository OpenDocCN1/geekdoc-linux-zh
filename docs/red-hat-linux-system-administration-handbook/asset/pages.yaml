  md: '# 8.1 Setting Up an MS Windows Network


    This is actually easy, if you have Windows 98 or Windows NT. So from here on in,
    we''ll just say “Windows” to relate to all versions of the OS, and you''ll have
    to do some reading to match what we tell you to your particular version of Windows.


    # What You''ll Need


    First, get the Ethernet cards and drivers loaded. Also, install your backbone.
    The best available networking scheme for the money is 10-BaseT, as there are fewer
    problems that can cause the entire network to go down. But it''s more expensive;
    you have to buy hubs, patch cables, patch panels, run one cable to each machine,
    and so on. But it is certainly worth the money.


    If you want a cheaper Ethernet, or you have a very small network, you can get
    the very affordable 10-Base2. This is also known as “thinnet”. All you have to
    be concerned about in a 1-Base2 network is that both ends are terminated with
    a 50-ohm resistor. This has the disadvantage that if one section of cable goes
    bad, the entire network goes down.


    Check the chapter on networking for more on networking concepts and how to set
    up a TCP/IP network.


    You''ll also need to make sure that each Windows user has an account on the Linux
    server. If you want, make the shell something like /bin/false. If you want users
    to be able to change their passwords, set the shell to be /bin/passwd. Also, be
    to add /bin/true or /bin/passwd to the /etc/shells file. If you have an existing
    NT server that has passwords for user accounts, you can have Samba authenticate
    passwords against the NT server.


    Once you have your network and Linux box set up, get the software working. Windows
    will allow you to use the Windows networking option to create a simple network.
    Be sure to use the same workgroup name across all the machines.


    # What''s a Workgroup?


    A workgroup is a logical collection of users within the same subnet. A subnet
    breaks up physically, as you need a router or bridge to get from one subnet to
    another. A workgroup is a more logical breakdown. For example, you can have accounting,
    manufacturing, and sales all on the same subnet, but all in different workgroups.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# 8.2 Installing Samba


    Once the software has been set up, you should be able to browse the network and
    see all the other machines, at least those on the same subnet you. If you can''t,
    get the software to this point. If something''s wrong, you''ll usually get a somewhat
    cryptic explanation of the problem and how to fix it.


    In a workgroup, there is typically no central server. Usernames and passwords
    are authenticated as needed against a server.


    # What''s a Domain?


    A Windows NT domain has a central password server that authenticates users when
    they log into their Windows machines. Instead of checking a local password from
    the Windows login screen, the password gets sent to the PDC (Primary Domain Controller),
    which grants access to services on all the servers within that domain.


    If you have a PDC on the network and choose to have Samba authenticate off that,
    you can set up your network as a domain. Otherwise, choose a workgroup.


    # Installing TCP/IP Stack


    Windows 98 and Windows NT both come with a TCP/IP stack already in the installation.
    When Windows asks for a username and password, be sure to give the username that
    would work against whatever system you''re authenticating.


    We''ll assume you know how to set up a TCP/IP network. If not, check the networking
    chapter for information on how to do this. Once you have the TCP/IP stack loaded
    on all the Windows machines, try having them ping each other, or ping the Linux
    box. The Linux box should also be able to ping machines in other subnets.


    # 8.2 Installing Samba


    Now the Windows machines are set up, let''s go to the Linux machine. Samba is
    installed if you selected DOS/Windows Connectivity on the Red


    You won''t be able to see outside your subnet unless your bridge forwards TCP/IP
    packets. A router usually won''t forward SMB packets, since it deals with TCP/IP
    only. But since Samba piggybacks on TCP/IP, you can still connect to machines
    in other subnets.'
