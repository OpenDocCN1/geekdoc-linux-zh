  md: '# 21.4 PPP


    The third and last file is a script to dial up. We suggest starting it from rc.local
    by adding the line /etc/rc.d/rd.diald to the end of your /etc/rc.d/rc.local file.
    You may even just add the lines to your rc.local file, but it is more convenient
    to keep things separate it can run as a standalone program. Notice that we are
    using the same chat file in the PPP section, but we are not using the ppp-on program:


    ```

    /etc/rc.d/rc.diald

    !/bin/sh

    echo -n "Starting auto-dialer: "

    /usr/sbin/dial /dev/modem accounting-log "/var/log/diald" -m ppp

    defaultroute modem | crtsct 111.222.333.444 remote 0.0.0.0

    connect "/usr/sbin/chat -f /etc/ppp/chatfile*" fifo /etc/dial.fifo

    echo "dial"

    ```


    The local option, and maybe the remote option, will have to be changed. If you
    have a dynamic IP (setting local to 0.0.0.0), this may cause some difficulties
    when telnetting to a machine on your local network. A static IP is highly recommended
    when using dial up or the IP masquerading described in the following section.
    Also, if you know the remote IP, we suggest setting it.


    The fifo argument is optional. It allows dial to communicate with a few programs
    that come with the dial distribution for monitoring the dial activity. If you
    find that your connection is slow, or ifconfig reports that there are errors of
    the PPP link, you may wish to remove the fifo option.


    The accounting-log argument is also optional. It writes information about call
    duration to a file. It is useful if you wish to find exactly how long your modem
    has been active.


    After customizing this file, you may either reboot or execute the file by hand.
    Depending on how recent your /etc/services file is, dial modem may complain about
    unknown services. A common one we''ve seen is tcp.www. If you receive one of these
    errors, there are two solutions. One solution is to comment out the offending
    line in /etc/diald.conf give that the latch chain at the bottom of /etc/diald.conf
    give service up-time. The other solution is to update your /etc/services file
    to contain the appropriate information. Ideally, you should update /etc/services;
    this will give you greater control over dial, as it will allow you to narrow down
    modem usage.


    If you check the output from netstat without ifconfig dial making the connection
    to your ISP, you should see the following:

    The output from netstat -nr should read:


    Kernel routing table'
