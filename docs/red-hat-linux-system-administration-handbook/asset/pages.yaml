    # ipfwadm


    The firewall administration program (ipfwadm) allows some of the functionality
    of tcpd, but in the kernel space, before any user programs see a packet. Unlike
    tcpd, ipfwadm can also filter packets that are being forwarded to another network.


    Configuration of ipfwadm is based on a set of rules that you input using the ipfwadm
    program. One other advantage of ipfwadm is that it handles both incoming and outgoing
    packets. From your machine, you could use ipfwadm to not allow any data to restrictedsite.com.
    The request for a connection to restrictedsite.com gets blocked before it ever
    goes out on the PPP link or Ethernet line or however you connect to the Internet.

    There are a total of five rules that ipfwadm administers:


    +   - Input accounting.

    - Input rules (packets coming into the machine).

    - Output rules (packets leaving the machine).

    - Forwarding rules (for when the machine in question is a router).


