  md: '# Upgrading from Previous Red Hat Releases


    Upgrading to a new version is more complicated, but no more than installation.
    In all likelihood, it should be easier.


    It almost goes without saying that you should back up the system before starting.
    In particular, you should back up setup files that may overwrite it. A good practice
    is to make separate backups of /etc and /var.


    The preliminary steps to upgrading are the same as they are for installing. You
    will need the same types of boot disks if you needed them before. You should also
    make sure your manuals handy if you need to give parameters to the installer/upgrade
    during the process.


    Start up the system as you would for installation. When you are presented with
    the choice of install or Upgrade from 2.0 or later, choose the latter.


    The upgrade process will search for your existing Red Hat installation and update
    all the packages with new versions. No partitions will be formatted, and you won''t
    get a chance to do things like create partitions or choose packages to install.
    The only case where additional packages are installed is where dependencies change.
    You''ll be prompted if you need to install additional packages.


    As packages get installed, some configuration files may be changed as the /etc/sendmail.cf
    file. In this case, the file on the drive is backed up to have an .rpmsave extension,
    making the original file /etc/sendmail.cf.rpmsave. You can find a full list of
    files that were modified by looking at /tmp/install.log after the upgrade is complete.
    You can then examine the changes and determine what you want to do.


    To install packages after the upgrade process is complete, you can use the rpm
    command. Check the chapter on RPM for more information on this.


    # Recovering a Failed Upgrade


    You should choose as reliable an upgrade method as possible. We recommend a local
    upgrade, if possible, from a CD-ROM or local hard disk. After that, a LAN upgrade,
    NFS, or local FTP is preferred. An offsite FTP-based upgrade should not be used
    unless absolutely necessary.


    Depending on where the upgrade fails, you may be able to recover fairly early.
    If the failure occurs before the actual package upgrade/installation begins, you
    can simply start over. If the upgrade fails during upgrading completion, it is
    likely that you will have to run a full install to recover your system. But it''s
    worth trying to run the upgrade again, just in case. If the'
