  md: 'We''ll take the safe path first and show you the actual process of burning
    a CD-ROM. First, you must create an ISO9660 image. This requires space on a local
    drive to store a new image file. If you''re going to build a CD-ROM that takes
    up 600MB of space, you''ll need at least that much free space on a partition.
    The basic syntax for the mkisofs command is:


    ```

    mkisofs -R -o file.raw /some/directory

    ```


    - -R does a recursive copy, everything under /some/directory gets included in
    the raw file. The -o file.raw indicates that the output of the mkisofs command
    will go into file.raw. This is where you''ll need the space. There are two other
    options you may want to use. The -v text option includes text as a CD-ROM label
    that shows up under Windows or MacOS. The ISO9660 specification indicates that
    files have to be in the old DOS format of eight characters, a dot and a three-character
    file extension. Fortunately, there is an extension to ISO9660 that allows for
    extended filenames Joliet. Joliet allows for 64 characters in the name of each
    file. If you choose to use Joliet and an extended filename, -J.


    Now that the ISO image has been created, you can test it out by mounting it and
    taking a look at it. The command to do this is:


    ```

    mount -t isofs -o loop file.raw /mnt/cdrom

    ```


    Replace file.raw with the raw image you just created. You can also replace /mnt/cdrom
    with some other directory to mount on. The -o loop indicates that a file instead
    of an actual device is going to be used. This will work, and you can traverse
    the directories as if they were a CD-ROM. Once you''re sure the image is correct,
    you can unmount the directory and prepare for writing.


    With the raw image created, you can now burn the CD-R with cdrecord. First you''ll
    need to know the SCSI ID of the CD-R. This can be found either by looking under
    /proc/scsi, or by using cdrecord -scanbus and looking at the results. You''ll
    also need to know what speed your CD-R can handle. Most drives are either double-speed
    (2x) or quad-speed (4x) for writing. Check your documentation for the capabilities
    of the CD-R.


    Now down to the actual burning. The basic syntax for cdrecord is:


    ```

    cdrecord -v speed=4 dev=5,0 file.raw

    ```


    You''ll need to change the speed based on the capability of your CD-R. The lowest
    speed is 1, so if you run into compatibility issues, try knocking the speed down.
    The -v gives a verbose listing of what''s going on. The dev=5,0'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# 20.12 Summary


    lists the SCSI ID for the CD-R device. In this case, it''s a SCSI ID of 5 and
    a

    UN of 0. For single CD-R writers, the LUN will be 0. You can replace

    file.raw with the raw image file you created and earlier. During the

    write process, it''s best not to use the machine while the writing is complete.

    The CD-R is dependent on a FIFO buffer to be full to writing to the

    CD at a constant rate. If that rate drops for any reason, the writing will fail

    and you''ll be left with a coaster.


    The time to write the CD-R depends both on the size of the image you''re

    making and the size of the CD-R. A quad-speed CD-ROM can write a 74-

    minute CD-R in about 18 minutes, and winds up being about 650MB in size.


    Once the CD-R is complete, you can put it in your CD-ROM drive and

    test it out.


    The above instructions describe the hard way, but also the safest. Once

    you''re comfortable with the process, you can turn everything into one step.

    The following command will create a Joliet CD-ROM on a quad-speed

    writer at SCSI ID 5:


    ```

    (nice --18 mkisos -V text -J -R /some/directory) | cdrecord -v

    speed=4 dev=5,0 - )

    ```


    The nice command provides a high priority to mkisos, allowing it to

    dedicate more CPU time to building the ISO image, which is passed via a

    pipe to the cdrecord program.


    # 20.12 Summary


    In this chapter, we''ve tried to discuss a reasonably large list of hardware,
    but

