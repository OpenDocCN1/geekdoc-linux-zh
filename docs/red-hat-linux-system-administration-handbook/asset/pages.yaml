  md: '# Chapter 4 • Account Administration


    +   * Managing accounts on a large number of machines.

    * Ensuring security on each machine.


    In the first case, it was inconvenient to synchronize /etc/passwd files on each
    machine, especially if you had a lot of machines to handle. NIS and NIS+ helped
    this situation a bit, but NIS and NIS+ had their problems. In the second case,
    there were a number of ways of ensuring password authentication on each machine.
    They ranged from your typical /etc/passwd with passwords encrypted to /etc/shadow
    to one-time passwords such as S/KEY. For programs such as login, ridicul, and
    even locking screensavers to understand the fact that a machine could have multiple
    ways of verifying a password, there had to be some method of verifying passwords,
    no matter what you chose.


    Linux is starting to get a handle on both issues. Red Hat makes it easier using
    the Pluggable Authentication Module (PAM). PAM creates independent modules that
    verify passwords and tell the appropriate program (login) that the entered password
    is correct. This greatly increases security (since PAM can tell that a given password
    is too easy to guess), and also increases the ways of authenticating a user. PAM
    can verify passwords from a variety of sources, from NIS to NT server to LDAP
    server. PAM also handles changing passwords and can apply methods to passwords,
    such as timing out a password and forcing a user to change their password.


    A useful starting point for information is the /usr/doc/* directory. Underneath
    there are three documents: The Linux-PAM System Administrator''s Guide, The Linux-PAM
    Module Writer''s Guide, and The Linux-PAM Application Developer''s Guide. These
    three documents cover most of what PAM is as it''s implemented on Red Hat. Since
    we''re mostly concerned with system administration here, you''ll probably want
    to print out or read The Linux-PAM System Administrator''s Guide.


    Here are some of the highlights of account administration using PAM:


