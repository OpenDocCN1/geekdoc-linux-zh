    # Autonomter Client Startup


    The automounter will (as the name implies) automatically mount partitions over
    NFS based on an NIS map. The two typical maps used are auto.home and auto.vol,
    which mount off /home and /vol, respectively. If you have these maps in your NIS
    domain, you can start the Linux autofs automounter using the following command:


    ```

    /etc/rc.d/init.d/autofs start

    ```


    It should be noted that the automounter under Linux performs some of the functions
    as void under Solaris. CD-ROMs, floppy disks, local volumes, and NFS filesystems
    can be automatically mounted when the user changes to a certain directory. By
    default, Red Hat 6 includes /misc/cd and /misc/kernel, which mount /dev/cdrom
    onto /misc/cd and /ftp.kernel via NFS onto /misc/kernel. We mention the automounter
    with NIS, since that is the most frequently used reason for using it.


    # NIS+


    NIS+ is Sun''s successor to NIS. It has better security and handles a large number
    of clients. Historically, support for NIS+ under Linux was poor and limited to
    the client side only. Fortunately, recent Red Hat versions are based on glibc,
    which supports NIS+ more fully, though still not completely.'
