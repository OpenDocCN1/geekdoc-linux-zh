    # 6.3 Network Applications


    Now that the network is set up, what are you going to do with it? Most of the

    standard topics (Web, FTP, email) have already been covered, but the rest of

    this chapter will cover applications that work across the network for the bene-

    efit of everyone. DNS (the nameserver) and NFS (the network file server)

    are such applications.


