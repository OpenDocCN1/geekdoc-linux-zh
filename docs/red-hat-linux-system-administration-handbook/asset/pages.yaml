  md: 'There are many other options you can turn on and off, including the symbolic
    links, indexing, and multiviews. For details on them, look at the Apache documentation.


    # Useful Modules and Directives


    Whole books have been written on Apache, and since this is only one chapter, we''re
    only going to touch on the more interesting and useful features. We''re arent
    going to talk about most of the directives that appear in the configuration files
    it''s fairly easy to understand their syntax from the usage, and they are explained
    fairly well in the Apache documentation.


    We''ve already met some of them: .htaccess, <Directory>, Options, AllowOverride,
    Allow, and Deny, and we''ve given a few examples of their use. Now we''ll discuss
    the other most common and useful directives.


    +   - User and Group—Set these UID and GID under which the server will run.


    +   - ServerRoot—This is the root of the server''s directory tree. It is typically
    the directory where the log file, .conf file, and document root directories are.
    The locations of these can be overridden on the command line or in the configuration
    files.


    +   - DocumentRoot—This is the base of the document tree.


    +   - UserDir—This is the subdirectory within a user''s home directory, which
    is the root of that user''s web space.


    +   - ServerType—This specifies the type of server (obviously), either standalone
    or proxy. Unless you are setting up a proxy server, this should be standalone.


    +   - Port—This is the TCP/IP port at which the server will listen. Port 80 is
