  md: '# Baud and BPS


    To start this section, there is no such thing as a 56,000-baud modem that works
    with plain old telephone lines. If there were, we''d have some really fast modems
    out there. Until the age of 2400-bps modems, baud and bps are synonymous. A baud
    is defined as the number of changes in a signal second. To get higher-speed modems,
    more bits were encoded in each baud. Thus, a 9600-bps modem has 4 bits per baud,
    and a 14400-bps modem has 6 bits per baud. On top of this, compression of the
    actual data is used to increase the throughput, making some 28.8-Kbps modems send
    data up to 115.2 Kbps.


    # 20.11 CD-ROMs and CD-R Writers


    CD-ROMs are fairly self-explanatory, as support for all ATAPI (IDE) and SCSI CD-ROMs
    is included with Linux. ATAPI CD-ROMs get their dev entry on where they are in
    the chains. The master device of the primary IDE chain is /dev/hda, and the slave
    on the primary chain is /dev/hdb. The master on the secondary is /dev/hdc, and
    the slave on the secondary is /dev/hdd. Note that these entries represent the
    entire disk, and should only be used for specifying CD-ROMs, as they''re one large
    partition. You can find out where your ATAPI CD-ROM is by examining bootup messages
    or by looking through the output of the dmesg command.


    SCSI CD-ROMs are handled a bit differently than the first CD-ROM gets an entry
    of /dev/sr0 instead of being with the hard drives under /dev/. second CD-ROM gets
    an entry of /dev/sr1, and so on. The results of the dmesg command can assist telling
    you what devices are recognized. Another way of finding out is to check the /proc/scsi
    directory. This won''t tell you what assigned to which dev entry, but it will
    list which SCSI devices were found.


    CD-R writers (also called CD-R burners and on) are now getting affordable enough
    to actually purchase them. Linux has the ability to use many different kinds of
    CD-R and CD-RW (rewritable) devices. Two packages are first required to use them.
    First is the mkisos package, which is included with the Red Hat CD-ROM. This program
    creates an ISO9660 image suitable for writing to a CD-R or CD-RW. The second program
    is cdrecord, which does the actual burning of the CD-R/CD-RW. The authors have
    only had access to a SCSI CD-R, so your experience may be different, but not by
    much.'
