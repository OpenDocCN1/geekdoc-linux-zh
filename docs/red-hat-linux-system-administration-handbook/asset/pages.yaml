    # 20.10 Quick Guide to Serial Ports


    You''re probably familiar with how serial ports need speed (BPS), bit size, parity,
    and stop bit settings. Those settings are on the software side. On the hardware
    side, things are a bit more complicated. The typical serial port has nine pins
    associated with it, as described in Table 20-1.


    Table 20-1 Serial Port Pin Settings

    | Pin | Signal | Meaning |

    |---|---|---|

    | 1 | DCD | Carrier Detect |

    | 2 | Rx | Receive Data (Date comes in this line) |

    | 3 | Tx | Transmit Data (Date goes out this line) |

    | 4 | DTR | Data Terminal Ready |

    | 5 | GND | Signal Ground |

    | 6 | DSR | Data Set Ready |

    | 7 | RTS | Ready to Send (1/2 of out-of-band flow control) |

    | 8 | CTS | Clear to Send (1/2 of out-of-band flow control) |

    | 9 | RI | Ring Indicator (Not used) |


    Table 20-1 describes the pinout for a standard 9-pin PC serial connection. When
    a device like a terminal is connected to the serial port, you need a special pin
    connection called a null-modem cable. In short, pins 2 and 3 are crossed (leading
    Tx to Rx, and vice versa) and the RTS/CTS lines are crossed. When connecting to
    a modem, a “straight through” connection is sufficient.'
