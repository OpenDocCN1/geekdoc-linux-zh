  md: '# 6.1 TCP/IP


    The Transmission Control Protocol / Internet Protocol (TCP/IP) is the way that
    UNIX machines talk to each other. This is also the primary way of connecting to
    using the Internet. The entire TCP/IP world (as it''s defined right now, anyway)
    is based on a 32-bit number. This allows for four billion hosts to be all on the
    Internet and talking to each other. For us humans to figure this out, these 32-bit
    numbers are referenced by 8-bit bytes, also known as an IP address; for example,
    192.33.4.10. For the further sanity of the human race, these IP addresses can
    also be referenced as names (ns.psi.net) to make it easier for us to use. Note
    that these two addresses are not the same. Linux prefers using numbers, and we
    humans prefer using names. The middle ground comes in the form of the DNS (Domain
    Name Service), which allows for mapping IP addresses to domain names, and vice


    DNS works with a root nameserver, which can be located in various parts of the
    world. When a user has their Web browser point to www.wayga.net, the machine asks
    the local DNS server to map name to an IP address. The local DNS server first
    looks at the root nameservers. These nameservers know that the nameserver for
    the wayga.net domain is 208.197.103.125. The DNS server connects to 208.197.103.125
    and requests the IP address for www.wayga.net. The DNS server at 208.197.103.125
    responds by saying that www.wayga.net''s IP address is 208.197.103.125. The local
    DNS server stores that IP address in its cache in case it is needed again and
    provides that IP address to the user application. The user application completes
    the connection and pops the Web page.


    DNS servers really do more than this. They also provide for the first pass at
    mail routing, aliases for machine names, reverse DNS, and even give basic system
    and location information.


    At an application or system level, TCP/IP has over 65,000 ports available for
    connecting. This allows for FTP, telur, E-mail, WWW, DNS, and hundreds of other
    functions to happen all at the same time. When a Web Coincidence? You decide.


    > 2Coincidence or conspiracy?


    > 3There are a few thousand IP addresses that aren''t used because they''re broadcast
    or reserved numbers. Don''t worry if you think that we''re running out of IP addresses
    too quickly. IPv6 has 128-bit IP addresses (that''s a 39-digit number for those
    of you without calculators).'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# 6.1 TCP/IP


    browser connects to a server, Linux opens one those unused ports and makes a connection
    to the server. The server monitors one specific port (port 80 for WWW), sees a
    connection request, opens an unused port on its side, and tells the client what
    port is available for connection. Other TCP/IP ports include port 25 (E-mail),
    port 23 (telnet), and ports 20 and 21 (FTP). A list of the known ports and their
    uses is kept in the /etc/services file. Note that for security reasons, ports
    lower than 1024 can be opened by root only. This is why the main web server has
    to run as root, and its clients can run as other users.


    TCP/IP has two main connection methods that you''ll probably run into: UDP (User
    Datagram Protocol) and TCP (Telnet Control Protocol). UDP is a connectionless
    protocol. The packets are usually small, and interaction between the client and
    server really consists of a number of openings and closings of network connections.
    UDP is a bit faster and less resource-intensive than TCP, but does not guarantee
    transmission of a packet. NFS is a protocol that uses UDP. TCP is a connection-based
    protocol. The client talks to the server, the port is opened, and the connection
    begins. When the connection closes, it should be because both programs have finished
    their need for the network. TCP guarantees packet delivery, and most protocols
    (Telnet, HTTP, SMTP, etc.) use TCP, but the connections may be longer in time
    than UDP connections.


    Ethernet was developed in the 1970s as a broadcast-style network. In the commonly
    used coax network, Ethernet cable was run in one long cable and each end was terminated
    with a 50-ohm resistor. Each machine was on the Ethernet network hooked into this
    cable using a tap.


    For machines to identify themselves, each Ethernet adapter has a unique address
    (Media Access Connector, or MAC address) assigned to it by the Ethernet adapter
    manufacturer. When an Ethernet adapter wants to talk to another Ethernet adapter,
    it sends a message containing its own MAC address, as well as the receiving MAC
    address, down the entire Ethernet cable. If the receiving MAC address is on that
    run, it gets the message. Collisions occur when two Ethernet adapters try to transmit
    at the same time. If this happens, both adapters stop transmission, wait a random
    amount of time, and retransmit. Having too many collisions indicates a network
    that has very heavy traffic and is running inefficiently. A link that has a high
    number of collisions should be broken up into two or more separate Ethernet runs.


    # Ethernet'
