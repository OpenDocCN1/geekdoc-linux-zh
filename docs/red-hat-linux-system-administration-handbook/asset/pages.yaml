  md: '3. Is the server running? Depending on how the server was configured when Linux
    was installed, the HTTP daemon may start automatically at boot time. You can use
    the ps command to check if httpd is running as follows: ps -waux | grep httpd.
    If it is not, you need to invoke it as root and tell it to find the directory
    containing the configuration files. For example, if your configuration directory
    is /etc/httpd/conf you would type something like httpd -d /etc/httpd. If the directory
    containing your httpd binary is not in your path, you will need to use the absolute
    path to invoke it. Typically, httpd lives in one of the sbin directories such
    as /usr/local/sbin, /usr/bin, or on rare occasions, /sbin.


    Aside from the various modules that can be used to extend Apache at time, there
    are many items that can be specified at run-time in the .conf files, httpd.conf
    and sm.conf. These two files control parameters, such as aliases for directories,
    aliases for icons, images, CGI scripts/programs, virtual host directives, the
    document root directory, the file to be served from a directory if no other file
    is specified in the URL, and various access control and authentication directives.


    # <Directory> and .htacces


    These two tools are used to modify access of all types for directory trees. <directory>
    directives typically reside in the sm.conf or httpd.conf file. They can also occur
    in the <Virtualhost> directive (more on this later.) The .htacces file resides
    somewhere in a directory tree of HTML documents. In both instances, directives
    placed in the directories are recursively effective for all the files and subdirectories
    in those directories. To enforce basic authorization for a directory and all its
    contents, for example, to put the following in a .htacces file in that directory
    (say /home/web):


    ```

    AuthType Basic

    UserFile /home/cary/etc/passwd

    AuthGroup /dev/null

    AuthName Realm of the Kazoos

    <LIMIT GET POST PUT>

    require valid-user

    </LIMIT>

    ```


    or in a <Directory> directive:


    ```

    <Directory /home/web>

    ```'
