    # Access via SMB (Windows Networking)


    The best way to get a Linux printer seen on a Windows network is to run

    Samba. We''ll get into Samba in the next chapter, but we''ll focus on setting
    up

    print services here. The important thing to know is that Samba should be

    configured to use the /etc/printcap file and BSD-style printing. That is

    about the entire configuration Linux needs to serve a printer to a Windows

    98 or Windows NT machine.² Users will be able to use the standard Wind-

    down print management tools (print queues), see the entire print queue,

    and even remove their job if they choose. Use Samba to install a print driver

    under Windows for the kind of printer you have installed, as the print filter

    on Linux should just pass the data along to the printer.


    ¹Using hosts.equiv could be a security hole, especially if you''re in a network
    of

    Linux or UNIX machines.


    ²You could serve another Linux (or UNIX) machine running Samba as well.

    That would just be silly, but still in “the UNIX way.".'
