- img_proc: true
  md: '# 20.4 UPS


    The first type simply sits and waits for the power to drop below a certain level
    and then, usually in a matter of milliseconds, switches to providing power via
    its batteries. The second actually filters all power through itself. thus can
    condition the power that it puts out and kick in during brownouts. This method
    also provides about half wear and tear on the batteries, obviously shortening
    their lifetime.


    There are several programs, most of them with some sort of GUI, for talking to
    your UPS. Most of them are somewhat feature-poor when compared to their Microsoft
    Windows-based counterparts. To date, Best is the only vendor that supplies UPS
    control software that can be compiled for use under Linux. Most of the other tools
    are fairly generic and can talk to UPSs in dumb mode.


    checkups.tar—Straight from Best’s Web site, this package will control their UPSs
    in dumb and a more advanced mode (not really a full “smart” mode). It includes
    the source code, which you will need to compile. In the less dumb mode, the following
    alarms can be detected: High Ambient Temperature, Near Low Battery, Low AC Out,
    or User Test Alarm. You can also tell checkups to start a shutdown when it detects
    that it has a particular amount of power.


    powerd-2.0—This is not the same powerd shipped with the System V init package.
    It differs in that it can be run in a master or slave mode, allowing you to manage
    the shutdown of other machines on the same UPS or LAN from a single, master machine.
    Also, powerd-2 uses a configuration file, whereas the stock power requires you
    to edit the code and recompile it when changing the configuration.


    Enhanced_APC_UPS-v1.4—Support for America Power Conversion (APC) UPSs in both
    smart and dumb modes.


    apcd-0.5—Another APC controller. Includes support for master and slave machines.
    The machine designated as the “master” will signal the other machines to shut
    down during a power outage or low battery condition.


    smupsd—A third program for APC UPSs. Supports APC UPSs in “very smart” dumb mode.
    Uses a Java-based tool for monitoring the UPS.


    genpower-1.0.1—A more generic UPS package. It comes with sample configurations
    for UPSs from Tripp and APC. Probably the best documented package mentioned thus
    far.'
