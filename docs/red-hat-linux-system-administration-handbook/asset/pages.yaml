    # Compiling and Installing MySQL


    If you choose to compile MySQL yourself, you will need a multithreading library.
    If you have Red Hat 5.02 or later, the threading is built into the C library.
    Otherwise, you will need the LinuxThreads library. You will also need a C++ compiler,
    presumably g++ and libg++. Note that libg++ is distributed separately from GCC/g++/gobj-c,
    as GNU libc. Lastly, you will need recent versions of GCC, at least 2.7.2; GNU
    make, at least 3.75; and lib 5.4.12 or glibc 2.0.2.


    GNU autoconf is used, so the common sequence of configure, make, and make install
    works. Useful options for the MySQL configure are:


    +   --prefix==/path/to/ mysql/install/base Where to install MySQL

    --localstatedir==/ path/to/mysql/ datafiles Where to keep the datafiles.

    --without-server Only compile client libraries and binaries.

    --enable-shared Build mysclient as a shared library.


    Other configure options can be listed with the --help option. You may want to
    run an optional make check before installing.

    We''re not going to go into a lot of detail about how to deal with a-compile,
    since you can always fall back to a binary distribution. One thing to note is
    that unpacking the binary distribution and installing from the compiled source
    distribution will place things in slightly different directories. The binary distribution
    creates a directory named mysql--version> and subdirectories from the source makes
    mysql subdirectories in /usr/local/lib and /usr/local/include. This is important
    to keep in mind if you compile MySQL-dependent programs or modules.


    Beyond making sure that you have the right versions of the tools needed to compile,
    there is little to check. If you run into trouble, mysql listing is'
