  md: '# Chapter 6 • Networking with Linux


    The SOA indicates the Start Of Authority line. This line tells named which domain
    file is working on. The SOA line is constant up to the point after the SOA. It
    then has the following information:


    +   * Machine name acting as the DNS server.

    * Contact name (replace the @ in the email address with a period).

    * Open parenthesis.

    * Serial number, which should be incremented every time you change the file—Since
    this is the first revision of the file, it has a serial number of 1.

    * Refresh time in seconds, or how often to recheck the SOA record—The 3600 says
    to refresh once an hour.

    * Retry time, or when a secondary server should retry contacting the primary server
    if something goes wrong.

    * Expire time, or when the secondary server should flush its cache if it can''t
    contact the primary server.

    * Minimum time to live—This defines how other servers should keep the records
    in their cache before flushing out. If it''s too short, too much time requesting
    addresses it should already know, and if it''s too long, the wiring IP information
    may be reported if a host changes IPs or over IP addresses.

    * Close parenthesis.

    * NS (to indicate the nameserver).

    * Name of the nameserver host (the local host).


    Once the SOA is complete, you can begin adding hosts. This entry has four sections
    to it:


    +   1 Name of the domain or hostname—If the name does not end in a period (.),
    the domain name (in our case, wayga.net) is appended. If the address ends in a
    period (.), it is assumed it is the Fully Qualified Domain Name (FQDN).

    2 IN—This separates the hostname from the rest of the record.

    3 Type of record—The record type can be any of the following:

    * A—Directly maps a hostname to an IP address. All other records must point to
    an A record.

    * MX—Mail exchanger, which lists what hosts will accept E-mail for that host or
    domain. Before the record contents, you can indicate a num-'
