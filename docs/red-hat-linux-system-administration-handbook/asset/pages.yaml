  md: '# Chapter 3 • Linux Boot and Shutdown


    | Runlevel | Functionality |

    |---|---|

    | 0 | Halt |

    | 1 | Single-user mode |

    | 2 | Multiuser, no NFS |

    | 3 | Multiuser, with NFS |

    | 4 | Un |

    | 5 | X11 console (xdm, gdm, or kcm)^a |

    | 6 | Reboot |


    > a. In Solaris 2.x, runlevel 5 will power down the system. It won''t do that
    in Linux.


    Two of these runlevels are really for stopping or rebooting the machine. Runlevel
    1 allows only to log in, and only the root partition is mounted. This is primarily
    for emergency situations where one of the other partitions is corrupted. The default
    runlevel for Red Hat is 3, which is a typical multiuser system and starts the
    network filesystem daemons as well. If you''re not using NFS, you can use runlevel
    2 if you need. Runlevel 5 automatically starts X with a login prompt. Normally,
    this is the xdm process. Red Hat 6.0 uses the gdm (GNOME Display Manager, KDE)
    but you can change the entry in /etc/initab to use xdm, gdm, or the KDE Display
    Manager, kcm.


    The first script that runs by init, no matter what runlevel you''re using, is
    the /etc/rc.d/rc.sysinit script. This script activates partitions, checks the
    filesystem consistency on any partitions it''s about to mount, and performs a
    few functions which we won''t worry about. In short, the rc.sysinit script runs
    all the programs that would be required no matter what runlevel you''d be using.


    Once the rc.sysinit script completes successfully, init goes on and calls the
    /etc/rc.d/rc script with an option being the number of the runlevel to enter (0-6).
    Here''s where things get interesting.


    Under the /etc/rc.d directory are six directories to look at called rc.[0-6].d.
    Each directory has a number of scripts that start with a “K” or an “S”, a two-digit
    number, and a program name. The “S” is for start scripts, and they are run when
    init enters that runlevel. This is for starting up programs that are specific
    to that runlevel. The “K” is for kill scripts, and they do the reverse of the
    S scripts, killing any programs that are not in a runlevel. The numbers'
