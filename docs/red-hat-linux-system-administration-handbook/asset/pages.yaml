    \ is not active\"\n\texit 1\n\n/etc/ppp/ppp-chatfile\nABORT'\t\\BUSY\\r'\nABORT'\t\
    \\nNO ANSWER\\r'\n'\tATZ\nOK\tATDT5551212\nCONNECT\nlogin:\t<your account>\npassword:\t\
