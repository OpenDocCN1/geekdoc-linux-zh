  md: '# Chapter 6 • Networking with Linux


    One other thing to remember about country codes is that they may not be what you
    think they are. For example, .ch is Switzerland, not China, and .ca is Canada,
    not California.


    # Registering a Domain


    You''ll need to have a domain name first. Take one that isn''t already taken (obviously),
    and make sure the domain you take isn''t a registered trademark of someone else.
    Sure, you could take mcdonalds.com but their lawyers get more than yours, and
    there''s more of them. The InterNIC does not take sides in these kinds of disputes,
    don''t think that you got a domain that you own it for all time.


    There are a few choices when registering a domain. The .edu is for educational
    institutions (most colleges and universities—elementary and secondary schools
    usually get a state-based domain). The .com is for commercial organizations that
    don''t necessarily provide Internet access or aren necessarily based on the Web.
    The .org domain is for organizations, formal or a group of people getting together
    (.apache or linux, for example). The .net domain is for groups that resell Internet
    access or provide access to other groups. The .gov and .mil are for the government
    and military, respectively. This leaves you with three probable choices: .com,
    .net, or .org. Pick the one appropriate for your organization.


    Next, you''ll need to up to three people: one is the technical contact, one is
    the administrative contact, and the third is the billing contact. The technical
    contact is the person who typically registers the domain and is the Manager of
    Information Services (MIS). The administrative contact is probably you gets the
    bills. They can all be the same person if you wish. These names and addresses
    will be compiled into the database as well, giving a handle that you can use later
    at the InterNIC instead of reentering your address, phone number, and so on.


    The last important items are the primary and secondary DNS servers. Since the
    InterNIC does not provide you with DNS service, you must enter the two hosts that
    will be able to provide IP addresses for your domain. You are required so that
    one can act as a backup, in case the primary is down or busy.


    The InterNIC also asks for information such as, "What does your organization do?"
    Fill in all the information requested and waited. In a few days, you''ll get email
    saying the domain was added. If you''re changing a domain, the administrative,
    technical, and billing contacts will receive requests from the InterNIC verify
    the new information. This prevents one contact from changing information without
    the knowledge of the other two, and it pre-'
  merge: -1
