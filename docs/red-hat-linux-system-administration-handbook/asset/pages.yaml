    # Web Pages for Your Users


    In a situation where you have multiple users on your machine, be it at an ISP
    or at a publisher, some of them will likely be interested in setting up a home
    page for themselves. This is not something that will typically consume a large
    amount of resources on your server, unless you have a large number of home pages
    or very popular users. Additionally, serving static HTML poses no security concerns
    beyond those of running the server itself. All that aside, there will almost certainly
    be users who want to use CGI, SSI, or some other server-parsed content that will
    add a dynamic element to their Web pages. Now, you have a security issue.


    The various solutions range from allowing users full access to tools like SSI
    and CGI (in a situation where you trust all your users) to some sort of limited
    SSI/CGI to completely forbidding the use of them. You can also allow or disallow
    the use of them on a user-by-user basis.


    In a small business, or possibly on a corporate LAN, you may likely choose the
    former route, while at an ISP, where you know few of the users personally, you
    will likely choose one of the latter two routes.


    Fortunately, Apache makes controlling access to these and other tools easily via
    the .htaccess file and <Directory> directive.


    # Restricting the Use of CGI and SSI


    The <Directory> directive is your friend. It is the way you specify what can and
    can''t be done in which directories. Couple this with Linux user and group permissions,
    and you can exercise fine control over who can do what in areas of your Web space.


    In general, unless the server is already insecure it doesn''t matter, or you can
    trust your users to not inadvertently or purposefully write CGI that promises
    your server in some way, you will not want CGI to be executable from arbitrary
    directories. Of course, if the server is accessible only to you and possibly a
    few others, you can leave things fairly open and not worry about it.


    Additionally, you will likely want to prohibit browsers from roaming through the
    filesystem, be it a particular user''s or the root filesystem. In other words,
    if a URL points to a directory that does not contain an index file, the'
