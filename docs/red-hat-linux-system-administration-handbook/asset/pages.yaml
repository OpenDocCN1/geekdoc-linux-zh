    Tcl by itself is actually not a particularly good scripting language. What it
    is

    designed for is "gluing" together other languages and programs. It is arguably

    t most extensive language listed here, with the possible exception of

    Python. By using Tcl and Tk together, you can quickly develop your own

    graphical interfaces to text-based programs (as an example).


    The latest major release, version 8, enhances the level of native look and

    feel for Tk across X, macOS, and Windows. This should make it very popular

    for building cross-platform GUIs. Those familiar with Tcl and Tk may recall

    that the last full releases of them were 7.6 and 4.2, respectively, and they may

    wonder what has happened to versions 5, 6, and 7 of Tcl. The version numbers of

    both were synchronized and Scriptics plans to release subsequent versions

    concurrently.


    Because of Tcl''s popularity, it has interfaces to several databases (MySQL,

    mSQL, and Sybase) and even a Netscape plug-in. Additionally, Tcl is, for

    rogramming, including a commercial-grade Tcl GUI builder, an on-the-fly com-

    piler, and maintenance of the current, native look-and-feel ports to MacOS

    Windows.


    Tcl''s extensibility has allowed for several extensions to both it and Tk.

    Extended Tcl (Tcl) provides additional functionality with the idea of creating

    a more standalone scripting language. Object Tcl is just what might guest you

    is—a Tcl written in Tcl. TkPerl is an interface to Tk for Perl 5.


    One of the most useful Tcl extensions is Expect. It is a tool for interacting

    with other command-line-driven programs that require user interaction.

    Thus it is possible to automate any number of tasks which might otherwise

    require a much more complicated solution for automation.


    # 13.8 SQL


    The Structured Query Language (SQL) is the language used to talk to rela-

    tional databases. In reality, it is a set of standards to which DBMS vendors

    add their own extensions. Because implementations of SQL differ so much,

    we didn''t include a link for SQL; instead, we suggest you consult the docu-

    ment for your particular DBMS. We include a list of DBMS applica-

    t in our chapter on applications and in the chapter on the Red Hat

    application CD-ROM.'
