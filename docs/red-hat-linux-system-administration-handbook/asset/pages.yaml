  md: '# 4.3 Using Shadow Passwords


    account. If you''re in a business and an employee quits, you''d probably want
    to make the account disabled for six months to give everyone else time to transfer
    files to other users, or to back up the account to tape.

    The best criterion for this is: If the user has data in their home directory that
    others would want or need to, disable the account. Once the files needed by the
    disabled account have been moved to other locations, delete the account. If the
    account has no information needed by other users, back up the home directory and
    any other files the user owns and delete the account.


    # 4.3 Using Shadow Passwords


    There are a few advantages to using shadow passwords instead of /etc/passwd. One
    is encrypted passwords are not stored in a location where just anyone can read
    them. The /etc/shadow file contains the encrypted passwords for users and is readable
    by root. Thus, only processes running as root can access the passwords. Another
    advantage is that /etc/shadow stores more than just passwords. It can also store
    data such as the last time a user changed their password. To maintain good security,
    you should have users change their passwords at least once every six months or
    so, immediately if there is the possibility that the password has been compromised.

    The disadvantage of using shadow passwords is rather large—many Linux programs
    may assume you''re not using them. This can cause a major headache while compiling
    programs. Also, many installations do not give shadow passwords by default, meaning
    that you''ll have to put them in after installation.


    # Setting Up Your System for Shadow Passwords


    You can easily add shadow passwords to your system, or remove them if you choose.
    The command to implement shadow passwords is pwconv. To restore a shadow password
    system back to using /etc/passwd and /etc/group, use the pwconv command.


