    \ page, http://www.proftpd.org, and a recent binary RPM version can be found at\
    \ http://ftp.contrib.redhat.com/mirror.\n\nThere are few differences between the\
    \ source and binary distributions. If you install from source, the configuration\
    \ file, proftpd.conf, is installed in /usr/local/etc and the server binary (proftpd)\
    \ is in /usr/local/sbin. The RPM installs proftpd.conf in /etc and the binary\
    \ in /usr/sbin.\n\nAs mentioned above, ProFTPD aims to be highly configurable\
