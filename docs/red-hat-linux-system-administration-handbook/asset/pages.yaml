  md: 'use dhcpd instead. These packages exist on the Red Hat CD as dhcpd and dhcpcd.
    Note that in some instances, dhcp will be configured to automatically start at
    boot, so you should only install dhcp on one machine per subnet.


    The configuration file that dhcp uses is /etc/dhcpd.conf. This file contains MAC
    addresses, IP information, and router/WINS/nameserver information. Other files
    created when dhcp is running are /etc/dhcp.leases and /etc/dhcp.pid. The .pid
    file contains the PID of the running dhcp to make stopping or restarting dhcp
    easier. The lease file is used if you have dynamic IP addresses used in a network.
    It contains information about who is being leased IP addresses, and how long the
    leases last. In the last event of a reboot or restart of dhcp, the dhcp.lease
    file should not be deleted as it is re-read on the startup of dhcp to know what
    dynamic IP addresses have already been assigned.


    Here''s a sample configuration for dhcp, along with some running commentary:


    ```

    # What''s the DNS name of this server?

    server-identifier wayga.auroratech.com

    #Identify the DNS name that clients will be under

    option domain-name "auroratech.com"

    #What DNS servers clients look at? (at least 2)

    option domain-name-servers auratek.auroratech.com, row.auroratech.com;

    # Define a Class C network (192.168.1.0->192.168.1.255)

    subnet 192.168.1.0 mask 255.255.255.0 {

    #Set the network mask (again)

    option subnet-mask 255.255.255.0;

    option domain-name "auroratech.com"

    option domain-name-servers auratek.auroratech.com, row.aurorat-ech;

    #Define how long a lease for an IP address should be.

    default-lease-time 600;

    #Max lease time, in case that''s what the

    # client requests.

    -max-lease-time 7200;

    #Specify the default router.

    option routers 192.168.1.142;

    #The below IP range will be dynamically

    # allocated to clients whose MAC address

    # doesn''t match any of the following hosts.

    range 192.168.1.46 192.168.1.50;

    }

