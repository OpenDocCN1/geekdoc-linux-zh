    ```

    printf("locked; hit Enter to unlock...");

    /* Wait for the user to hit Enter. */

    getchar();


    printf("unlocking\n");

    /* Release the lock. */

    lock_type = F_UNLCK;

    fcntl(fd, F_SETLKKW, &lock);


