  md: '# 11.3 Modules 251


    Gathering process data and formatting it as an HTML table is broken down into
    several simpler operations:


    +   - get_uid_gid extracts the IDs of the owning user and group of a process.
    To do this, the function invokes stat (see Section B.2, “stat,” in Appendix B)
    on the process’s subdirectory in /proc (see Section 7.2, “Process Entries,” in
    Chapter 7). The user and group that own this directory are identical to the process’s
    owning user group.

    - get_user_name returns the username corresponding to a UID. This function simply
    calls the C library function getpwuid, which consults the system’s /etc/passwd
    file and returns a copy of the result. get_group_name returns the group name corresponding
    to a GID. It uses getgid call.

    - get_program_name returns the name of the process running in a specified process.
    This information is extracted from the stat entry in the directory under /proc
    (see Section 7.2, “Process Entries,” in Chapter 7). We use this entry rather than
    using the symbolic link (see Section 7.2.4, “Process Executable,” in Chapter 7)
    or cmdline entry (see Section 7.2.2, “Process Argument List,” in Chapter 7) because
    the latter two are inaccessible if the process running isn''t owned by the same
    user as the process being examined. Also, reading from stat doesn''t force Linux
    to page the process back into memory, if it happens to be swapped out.

    - get_rss returns the resident set size of a process. This is available as the
    second element in the contents of the process’s stat entry (see Section 7.2.6,
    “Process Memory Statistics,” in Chapter 7) in /proc subdirectory.

    - format_process_info generates a string containing HTML elements for a single
    table row, representing a single process. After calling the functions listed previously
    to obtain this information, it allocates a buffer and generates HTML using sprintf.

    - module_generate generates the entire HTML page, including the table. The output
    consists of one string containing the start of the page and the table (in page_start),
    one string for each row (generated by format_process_info), and one string containing
    the end of the table and the page (in page_end).


    module_generate determines the PIDs of the processes running on the system by
    examining the contents of /proc. It obtains a list of this directory using opendir
    and readdir (see Section B.6, “Reading Directory Contents,” in Appendix B). It
    scans the contents, looking for entries whose names are composed entirely of digits;
    these are taken to be process entries.


    Potentially a large number of strings must be written to the client socket—one
    for each page start and end, plus one for each process. If we were to write each
    string to the client socket file descriptor with a separate call to write, this
    would generate unnecessary network traffic because each string may be sent in
    a separate network packet.'
