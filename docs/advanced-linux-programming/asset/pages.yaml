  md: '# 12 Chapter 1 Getting Started


    The first step is to run your program inside the debugger. Just enter the command
    crash happened and any program arguments. Try running the program without any
    arguments, like this:


    ```

    (gdb) run

    Starting program: reciprocal


    Program received signal SIGSEV, Segmentation fault.

    __strtol_internal(nptr=0x, endptr=0x, base=10, group=0)

    at strtol.c:287

    287 strtol.c: No such file or directory.

    (gdb)

    ```


    The problem is that there is no error-checking code in main. The program expects
    one argument, but in this case the program ran with no arguments. The SIGSEV message
    indicates a program crash. GDB knows that the actual crash happened in a function
    called __strtol_internal. That function in the standard library, the source is
    not installed, explains the "No such file or directory" message. You can see the
    stack by using the command:


    ```

    (gdb) where

    # __strtol_internal(nptr=0x, endptr=0x, base=10, group=0)

    at strtol.c:287

    #1 0x40096b6 in atoi(nptr=0x0) at ../stublib/stdlib.h:251

    #2 0x804863e in main(argc=1, argv=0xbffff5e4) at main.c:8

    ```


    You can go up two levels in the stack until you reach main by using the up command:


    ```

    (gdb) up 2

    #2 0x804863e in main(argc=1, argv=0xbffff5e4) at main.c:8

    8 i = atoi(argv[1])

    ```


    Note that gdb is capable of finding the source for main.c, and it shows the line
    where the erroneous function call occurred. You can view the value of variables
    using the print command:


    ```

    (gdb) print argv[1]

    $2 = 0x

    ```


    That confirms that the problem is indeed a NULL pointer passed into atoi.

    You can set a breakpoint using the break command:


    ```

    (gdb) break main

    Breakpoint 1 at 0x804862e: file main.c, line 8.

    ```'
