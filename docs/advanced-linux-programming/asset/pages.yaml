  md: '# 2.2 Coding Defensively


    Writing programs that run correctly under "normal" use is hard; writing programs
    that behave gracefully in failure situations is harder. This section demonstrates
    some coding techniques for finding bugs early and for detecting and recovering
    from problems in a running program.


    The code samples presented later in this book deliberately skip error checking
    because this would obscure the basic functionality being presented. However, the
    final example in Chapter 11, "Sample GNU/Linux Application," comes back to demonstrating
    how to use these techniques to write robust programs.


    # 2.2.1 Using assert


    A good objective to keep in mind when coding application programs is that bugs
    or unexpected errors should cause the program to fail dramatically, as early as
    possible. This will help you find bugs earlier in the development and testing
    cycles. Failures that do not exhibit themselves are often missed and do not show
    up until the application is in users'' hands


    One of the simplest methods to check for unexpected conditions is the C assert
    macro. The argument to this macro is a Boolean expression. The program is terminated
    if the expression evaluates to false, after printing an error message containing
    the source file and line number and the text of the expression. The assert macro
    is very useful for a variety of consistency checks internal to a program. For
    instance, use assert to test the validity of function arguments, to test preconditions
    and postconditions of function calls (and method calls, in C++), and to test for
    unexpected return values.


    Each assert serves not only as a runtime check of a condition, but also as documentation
    about the program''s operation within the source code. If your program contains
    an assert (condition) that says to someone reading your source code that condition
    should be true at that point in the program, and if condition is not, it''s probably
    a bug in the program.


    For performance-critical code, runtime checks like those of assert can impose
    a significant performance penalty. In such cases, you can compile your code with
    the DEBUG macro defined, by using the NDEBUG flag on your compiler command line.
    With NDEBUG, appearances of the assert macro will be preprocessed away. It''s
    a good idea to do this only when necessary for performance reasons, though, and
    only with performance-critical source files.


    Because it is possible to preprocess assert macros away, be careful that any expression
    use has no side effects. Specifically, you shouldn''t call functions inside assert
    expressions, assign variables, or use modifying operators such as ++.'
