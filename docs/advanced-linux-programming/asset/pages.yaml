  md: 'A time-critical program may lock physical memory because the time delay of
    paging memory out and back may be too long or too unpredictable. High-security
    applications may also want to protect sensitive data from being written to a swap
    file, where they might be recovered by an intruder after the program terminates.


    Locking a region of memory is as simple as calling mock with a pointer to the
    start of the region and the region''s length. Linux divides memory into pages
    and can lock only entire pages at a time; each page contains part of the memory
    region specified by mock. The getpagesize function returns the system''s page
    size, which is 4KB on x86 Linux.


    For example, to allocate 32MB of address space and lock it into RAM, you would
    use this:


    ```

    int alloc_size = 32 * 1024 * 1024;

    char* memory = malloc(alloc_size);

    mock(memory, alloc_size);

    ```


    Note that simply allocating a page of memory and locking it with mock doesn''t
    reserve physical memory for the calling process because the pages may be copy-on-write.
    Therefore, you should write a dummy value to each page as:


    ```

    size_t i;

    size_t page_size = getpagesize();

    for (i = 0; i < alloc_size; i++)

    memory[i] = 0;

    ```


    The write to each page forces Linux to assign a unique, unshared memory page to
    the process for that.


    To unlock a region, call munock, which takes the same arguments as mock.

    If you want your program''s entire address space locked into physical memory,
    call mlockall. This system call takes a single flag argument: MCL_CURRENT locks
    all currently allocated memory, but future allocations are not locked; MCL_FUTURE
    locks all pages that are allocated after the call into memory both current and
    subsequent allocations.


    Locking large amounts of memory, especially using mlockall, can be dangerous to
    the entire Linux system. Indiscriminate memory locking is a good method of bringing
    your system to halt because other running processes are forced to compete for
    smaller physical memory resources and swap rapidly into and out of memory (this
    is known as thrashing). If you lock too much memory, the system will run out of
    memory entirely and Linux will start killing off processes.


    For this reason, only processes with superuser privilege may lock memory with
    mlock or mlockall. If a nonuser process calls one of these functions, it will
    fail, return -1, and set errno to EPERM.


    The munlockall call unlocks all memory locked by the current process, including
    memory locked with mlock and mlockall.


    Copy-on-write means that Linux makes a private copy of a page of memory for a
    process when that process writes a value somewhere into it.'
