  md: '# B

    Low-Level I/O


    PROGRAMMERS ON GNU/Linux HAVE TWO SETS OF INPUT/OUTPUT functions at their disposal.
    The standard C library I/O functions provide printf, fopen, and so on.¹ The Linux
    kernel itself provides another set of I/O operations that operate at a lower level
    than the C library functions.


    Because this book is for people who already know the C language, we''ll assume
    that you have encountered and know how to use the C library I/O functions.


    Often there are good reasons to use Linux''s low-level I/O functions. Many of
    these are kernel system calls and provide the most direct access to underlying
    capabilities that is available to application programs. In fact, the standard
    C library I/O routines are implemented on top of the Linux low-level I/O system
    calls. Using the latter is usually the most efficient way to perform input and
    output operations—and is sometimes more convenient, too.


    +   1. The C++ standard library provides istreams with similar functionality.
    The standard C library is also available in the C++ language.

    2. See Chapter 8, "Linux System Calls," for an explanation of the difference between
    a system call and an ordinary function call.'
