  md: '# 1.3 Automating the Process with GNU Make 9


    the -l option. In Linux, library names almost always start with lib. For example,
    the Pluggable Authentication Module (PAM) library is called libpam.a. To link
    in you use a command like this:


    The compiler automatically adds the lib prefix and the .a suffix. As header files,
    the linker links for libraries in some standard places, including the /lib and
    /usr/lib directories that contain the standard libraries. If you want to search
    for other directories then you should use the -L option, which is the parallel
    of the -T option discussed earlier. You can use this line to instruct the linker
    to look for libraries in the /usr/local/lib/pam directory before looking in the
    usual places:


    +   * g++ -o reciprocal main.o reciprocal.o -L/usr/local/lib/pam -lpam


    Although you do not have to use the -I option to get the preprocessor to search
    the current directory, you do have to the -L option to get the linker to search
    the current directory. In particular, you could use the following to instruct
    the linker to find the test library in the current directory:


    +   * gcc -o app app.o -L.test


    # 1.3 Automating the Process with GNU Make


    If you''re accustomed to programming for the Windows operating system, you''re
    probably accustomed to working with an Integrated Development Environment (IDE).
    You add source files to your project, and then the IDE builds your project automatically.
    Although IDEs are for Linux, this book doesn''t discuss them. Instead, this book
    shows you how to use GNU Make to automatically recompile your code, which is what
    most Linux programmers actually do.


    The basic idea behind make is simple. You tell what targets you want to build
    and then give rules how to build them. You also specify dependencies that indicate
    when a particular target should be rebuilt.


    In our sample project, there are three objects: reciprocal.o, main.o, and the
    reciprocal itself. You already have rules in building these targets in the form
    of the command lines given previously. The dependencies require a little bit of
    thought. Clearly, reciprocal depends on reciprocal.o and main.o because you can''t
    link the complete program until you have built each of the object files. The object
    files should be rebuilt whenever the source files change. There''s one more twist
    in that change to reciprocal.hpp should also cause both of the object files to
    be rebuilt because both source files include header file.


    In addition to the obvious targets, there should always be a clean target. This
    target removes all the generated object files and programs so that you can start
    fresh. The rule for this target uses the rm command to remove the files.'
  merge: -1
