  md: '# 6.4 Hardware Devices 35


    Occasionally, you''ll want to write data directly to character devices—for example:


    +   - A terminal program might access a modem directly through a serial port device.

    Data written to read or from the devices is transmitted via the modem to a remote
    computer.


    +   - A backup program might write data directly to a tape device. The backup
    program could implement its own compression and error-checking format.


    +   - A program can write directly to the first virtual terminal? writing data
    to /dev/tty1.


    Terminal windows running in a graphical environment, or remote login terminal
    sessions, are not associated with virtual terminals; instead, they''re associated
    with pseudo-terminals. See Section 6.6, "PTYs," for information about these.


    +   - Sometimes a program needs using to access the terminal device with which
    it is associated.


    For example, your program may need to prompt the user for a password. For security
    reasons, you might want to ignore redirection of standard input and always read
    the password from the terminal, no matter how the user invokes the command. One
    way to do this is to open /dev/tty, which always corresponds to the terminal device
    associated with the process that opens it. Write the prompt message to that, and
    read the password from it. By ignoring standard input and output, this prevents
    the user from feeding your program from a file using shell syntax such as:


    ```

    % secure_program < my-password.txt

    ```


    If you need to authenticate users in your program, you should learn about GNU/Linux''s
    PAM family. See Section 10.5, "Authenticating Users," in Chapter 10, "Security,"
    for more information.


    +   - A program can play sounds through the system''s card by sending audio data
    to /dev/audio. Note that the audio data must be in Sun audio format (usually associated
    with the .au extension).


    For example, many GNU/Linux distributions come with the classic sound file /usr/share/sndconfig/sample.au.
    If your system includes this file, playing it by invoking the following:


    ```

    % cat /usr/share/sndconfig/sample.au > /dev/audio

    ```


    If you''re planning on using sound in your program, you should investigate the
    various sound libraries and services available for GNU/Linux. The Gnome environment
    using the Enlightenment Sound Daemon (ESound), at http://www.txt.org/~ricude/ESound.html.
    KDE uses aRTs, at http://space.tw.de/~stefan/kde/arts-mop-doc/. If you use one
    of these systems instead of writing directly to /dev/audio, your program will
    cooperate better with other programs that use the computer''s sound card.


    +   3. On most GNU/Linux systems, you can switch to the first virtual terminal
    by pressing Ctrl+Alt+F1. Use Ctrl+Alt+F2 for the second virtual terminal, and
    so on.'
