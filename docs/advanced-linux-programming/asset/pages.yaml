  md: '# 4.4 Synchronization and Critical Sections 79


    Now suppose that two threads happen to finish a job at about the same time, but
    only one job remains in the queue. The first thread checks whether job_queue is
    null; finding that it isn''t, the thread enters the loop and stores the pointer
    to the job object in next_job. At this point, Linux manages to interrupt the first
    thread and schedules the second. The second thread also checks job_queue and finding
    it is non-null, also assigns the same pointer to next_job. By unfortunate coincidence,
    we now have two threads executing the same job.


    To make worse, one will unlink the job from the queue, leaving job_queue containing
    null. When the other thread evaluates job_queue->next, a segmentation fault will


    This is an example of a race condition. Under "lucky" circumstances, this particular
    schedule of the two threads may never occur, and the race condition may never
    exhibit itself. Only under different circumstances, perhaps when running on a
    heavily loaded system (or on an important customer''s multiprocessor server!)
    may it exist.


    To eliminate race conditions, you need a way to make operations atomic. An atomic
    operation is indivisible and uninterruptible; once the operation starts, it will
    not be paused or interrupted until it completes. In this particular example, you
    want to check job_queue; if it''s not empty, remove the first job, all as a single
    atomic operation.


    # 4.4.2 Mutexes


    The solution to the job queue race problem is to let only one thread access the
    queue of jobs at a time. A thread starts looking at the queue, no other thread
    should be able to access it until the first thread has decided whether to process
    a job and, if so, has removed the job from the list.


    Implementing this requires support from the operating system. GNU/Linux provides
    mutexes, for Mutual Exclusion. A mutex is a special lock that allows only one
    thread may lock at a time. If a thread locks a mutex and then a second thread
    tries to lock the mutex, the second thread is blocked, or put on hold. Only when
    the first thread unlocks the mutex is the second thread unblocked—allowed to resume
    execution. GNU/Linux guarantees that race conditions do not occur among threads
