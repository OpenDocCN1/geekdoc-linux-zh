  md: "To get the user ID and group ID for the current process, you can use the getuid\
    \ and getegid functions, declared in <unistd.h>. These functions don't take any\
    \ parameters, and they always work; you don't have to check for errors. Listing\
    \ 10.1 shows a simple program that provides a subset of the functionality by the\
    \ id command:\n\n# Listing 10.1 (simple.c) Print User and Group IDs\n\n```\n#include\
    \ <sys/types.h>\n#include <unistd.h>\n#include <stdio.h>\n\nint main() {\n   \
    \ uid_t uid = getuid();\n    uid_t gid = getegid();\n    printf(\"uid=%d gid=%d\\\
    n\", (int)uid, (int)gid);\n    return 0;\n}\n```\n\nWhen this program is run (by\
    \ the same user who ran the real id program) the output is as follows:\n./simple\n\
    uid=501 gid=501\n\n# 10.3 File System Permissions\n\nA good way to see users and\
    \ groups in action is to look at file system permissions. By examining how the\
    \ system associates permissions with each file and then seeing how the kernel\
    \ checks to see who is allowed to access which files, the concepts of user ID\
    \ and group ID should become clearer.\n\nEach file has exactly one owning user\
    \ and exactly one group. When you create a new file, the file is owned by the\
    \ user and group of the creating process.\nThe basic things that you can do with\
    \ files, as far as Linux is concerned, are read from them, write to them, and\
    \ execute them. (Note that creating a file and removing a file are not things\
    \ you can do with the file; they're considered things you can do with the directory\
    \ containing the file. We'll get to this a little later.) If you can't read a\
    \ file, Linux won't let you examine the file's contents. If you can't write a\
    \ file, you can't change its contents. If there's a program file for which you\
    \ do not have execute permission, you cannot run the program.\n\n+   2. Actually,\
    \ there are some rare exceptions, involving sticky bits, discussed later in Section\
    \ 10.3.2, \"Sticky Bits.\""
