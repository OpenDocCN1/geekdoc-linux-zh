  md: '# 38 Chapter 2 Writing Good GNU/Linux Software


    Now suppose that test.o is combined with some other object files to produce the
    libtest.a archive. The following command line will not work:


    ```

    gcc -o app -L.-libtest app.o

    app.o: in function ''text+0x4'': undefined reference to ''f''

    collect2: ld returned 1 exit status

    ```


    The error message indicates that though libtest.a contains a definition of f,
    the linker did not find it. That''s because libtest.a was searched when it was
    first encountered, and at that point the linker hadn''t seen any references to
    f.

    On the other hand, if we use this line, no error messages are issued:


    ```

    gcc -o app app.o -L.-test

    ```


    The reason is that the reference to f in app.o causes the linker to include the
    test.o object file from the libtest.a archive.


    # 2.3.2 Shared Libraries


    A shared library (also known as a shared object, or a dynamically linked library)
    is similar to an archive in that it is a grouping of object files. However, there
    are many important differences. The most fundamental difference is that when a
    shared library is linked into a program, the final executable does not actually
    contain the code that is present in the shared library. Instead, the executable
    merely contains a reference to the shared library. If several programs on the
    system are linked against the same shared library, they will all reference the
    library, but none will actually be included. Thus, the library is "shared" among
    all the programs that link with it.


    A second important difference is that a shared library is not merely a collection
    of object files, out of which the linker chooses those are needed to satisfy undefined
    references. Instead, the object files that compose the shared library are combined
    into a single object file so that a program that links against a shared library
    always includes all of the code in it, rather than just those portions that are
    needed.


    To create a shared library, you must compile the objects that will make up the
    library using the -fPIC option to the compiler, like this:


    ```

    gcc -c -fPIC test1.c

    ```


    The -fPIC option tells the compiler that you are going to use test.o as part of
    a shared object.


    # Position-Independent Code (PIC)


    PIC stands for position-independent code. The functions in a shared library may
    be loaded at different addresses in different programs, so the code in the shared
    object must not depend on the address (or position) at which it is loaded. This
    consideration has no impact on you, as the programmer, except you must remember
    to use the -fPIC flag when compiling code that will be used in a shared library.


    ![](img/c4e64f1f40e77d2bb7fe9245699d2ea5_63_0.png)'
