    # 10.6.2 Race Conditions in /tmp


    Another very common problem involves the creation of files with predictable names,

    typically in the /tmp directory. Suppose that your program running as root,

    always creates a temporary file called /tmp/prog and writes some vital information

    a malicious user can create a symbolic link from /tmp/prog to any other file on

    the system. When your program goes to create the file, the open system call will
    suc-

    cceed. The data that you will not go to /tmp/prog; instead, it will be

    written to some arbitrary file of the attacker''s choosing.


    This kind of attack is said to exploit a race condition. There is implicitly a
    race

    between you and the attacker. Whoever manages to create the file first wins.


    This attack is used to destroy important parts of the file system by creating

    the appropriate links, the attacker can trick a program running as root that is
    supposed

    to write a temporary file into overwriting an important system file instead. For
    exam-

    by making a symbolic link to /etc/passwd, the attacker can wipe out your system''s

    password database. There are also ways in which a malicious user can obtain root

    access using this system.


    One attempt at this device is to use a randomized name for the file.

    For example, you can read from /dev/random to get some bits in the name of the

    file. This makes it harder for a malicious user to guess the filename, but it

    does''t make it impossible. The attacker might create a large number of symbolic

    links, using many potential names. Even if she has to try 10,000 times before
    winning

    t race condition, one could be disastrous.


    Another approach is to use the O_EXCL flag when calling open. This flag opens

    to fail if the file already exists. Unfortunately, if you''re using the Network
    File System

    (NFS), or if anyone is using your program might ever using NFS, that''s not a

    sufficient robust approach because O_EXCL is not reliable when NFS is in use.

    You can never know for sure whether your code will be used on a system that uses

    NFS, so if you''re highly paranoid, don''t use O_EXCL.


    In Chapter 2, "Writing GNU/Linux Software," Section 2.1.7,"Using

    Temporary Files, we showed how to use mktemp to create temporary files.


    Unfortunately, mktemp does on Linux is open with O_EXCL after trying to

    p a name that is hard to get. In other words, mktemp is insecure if /tmp

    mounted over NFS. So, using mktemp is better than nothing, but it''s not fully
    secure.


    +   8. Some programmers believe that C++ is a horrible and overly complex language.
    The

    arguments about multiple inheritance and other complications have some merit,
    but it is

    easier to write code that avoids buffer overflows and other problems in C++ than
    in C.


    +   9. Obviously, if you''re also a system administrator, you shouldn''t mount
    /tmp over NFS.'
