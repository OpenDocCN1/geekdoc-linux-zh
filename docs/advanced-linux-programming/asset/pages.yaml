    # 10


    # Security


    MUCH THE POWER OF A GNU/LINUX SYSTEM COMES FROM ITS support for multiple users
    and for networking. Many people can use the system at once, and they can connect
    to the system from remote locations. Unfortunately, with this power comes risk,
    especially for systems connected to the Internet. Under some circumstances, a
    remote "hacker" can connect to the system and read, modify, or remove files that
    are stored on other''s files. Or, two users on the same machine can read, modify,
    or remove each other''s files when they should not be allowed to do so. When this
    happens, the system''s security is said to have compromised.


    The Linux kernel provides a variety of facilities to ensure that these events
    do not take place. To avoid security breaches, ordinary applications must be careful
    as well. For example, imagine that you are developing accounting software. Although
    you might want all users to be able to approve reports with the system, you wouldn''t
    want all users to be able to approve those reports. You might want users to be
    able to view their own pay payroll information, but you certainly wouldn''t want
    them to be able to view everyone else''s payroll information. You might want managers
    to be able to view the salaries of employees in their departments, but you wouldn''t
    want them to view the salaries of employees in other departments.'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'To enforce these kinds of controls, you have to be very careful. It''s amazingly
    easy to make a mistake that allows users to do something you didn''t intend for
    them to do. The best approach is to enlist the help of security experts. Still,
    every application developer ought to understand the basics.


    # 10.1 Users and Groups


    Each Linux user is assigned a unique number, called a user ID, or UID. Of course,
    when you log in, you use a username rather than a user ID. The system converts
    your username to a particular user ID, and from then on it''s only the ID counts.


    You can actually have more than one username for the same user ID. As far as the
    system is concerned, the use IDs, not the usernames, matter. There''s no way to
    give one username more power than if they both correspond to the same user ID.


    You can control access to a file or other resource by associating it with a particular
    user ID. For example, you can create a file that only that user can access the
    resource, or a directory in which only you can create new files. That''s good
    enough for many simple cases.


    Sometimes, however, you want to share a resource among multiple users. For example,
    if you''re a manager, you might want to create a file that any manager can read
    but ordinary employees cannot. Linux doesn''t allow you to associate multiple
    user IDs with a file, so you can''t create a list of all the people to whom you
    want to give access and attach them all to the file.


    You can, create a group. Each group is assigned a unique number, called a group
    ID, or GID. Every single user ID can be a member of many groups, but groups contain
    groups; they contain only users. Like users, groups have names. Also like usernames,
    however, the group names don''t really matter; the system uses the group ID internally.


    Continuing our example, you could create a managers'' group and put the user IDs
    for all the managers in this group. You could then create a file that can be read
    by anyone in the managers'' group but not by people who aren''t in the group.
    In general, you can associate only one group with a resource that users can access
    only if they''re in either group 7 or group 42, for example.


    If you''re curious to see what your ID is and what groups you are in, you can
    use the id command. For example, the output might look like this:


    ```

    $ id

    uid=501(mitchell) gid=501(mitchell) groups=501(mitchell),503(cs1)

    ```


    The first part shows you that the user ID for the user who ran the command was
    501. The command also figures out what the corresponding username is and displays
    that in parentheses. The command shows that user ID 501 is actually in two groups:
    group 501 (called mitchell) and group 503 (called cs1). You''re probably wondering
    why group 501 appears twice: once in the gid field and once in the groups field.
    We''ll explain this later.'
