    The same permission applies to directories, but they have different meanings.\
    \ If a user is allowed to read from a directory, the user is allowed to see the\
    \ list of files that are present in that directory. If a user is allowed to write\
    \ to a directory, the user is allowed to add or remove files from directory. Note\
    \ that a user may remove files from a directory if she is removing it. If a user\
    \ is allowed to write to a directory, even if she does not have permission to\
    \ modify the directory. If a user is allowed to execute a directory, the user\
    \ is allowed to enter that directory and access the files therein. Without access\
