  md: "# 1.1 Editing with Emacs\n\n# 1.1.2 Automatic Formatting\n\nIf you're accustomed\
    \ to programming in an Integrated Development Environment (IDE), you'll also be\
    \ accustomed to having the editor help you format your code. Emacs provide the\
    \ same kind of functionality. If you open a C or C++ source file, Emacs automatically\
    \ figures out that the file contains source code, not just ordinary text. If you\
    \ hit the Tab key on a blank line, Emacs moves the cursor to an appropriately\
    \ indented point. If you hit the Tab key on a line that already contains some\
    \ text, Emacs indents the text. So, for example, suppose that you have typed in\
    \ the following:\n\n```\nint main ()\n    printf ('Hello, world');\n}\n```\n\n\
    If you press the Tab key on the line with the call to printf, Emacs will reformat\
    \ your code to look like this:\n\n```\nint main ()\n    printf ('Hello, world');\n\
    }\n```\n\nNotice how the line has been appropriately indented.\nAs you use Emacs,\
    \ you'll see how it can help you perform all kinds of complicated formatting tasks.\
    \ If you're ambitious, you can program Emacs to perform literally any kind of\
    \ automatic formatting you can imagine. People have used this facility to implement\
    \ Emacs modes for editing just about every kind of document, to implement games,\
    \ and to implement database front ends.\n\n# 1.1.3 Syntax Highlighting\n\nIn formatting\
    \ your code, Emacs can make it easier to read C and C++ by coloring different\
    \ syntax elements. For example, Emacs can turn keywords one color, built-in types\
    \ such as int another color, and comments another color.\nUsing colors makes it\
    \ a lot easier to spot some syntax errors.\nThe easiest way to turn on coloring\
    \ is to edit the file -/.emacs and insert the following string:\n\n```\n(global-font-lock-mode\
    \ t)\n```\n\nSave the file, exit Emacs, and restart. Now open a C or C++ source\
    \ file and enjoy!\nYou might have noticed that the string you inserted into your\
    \ .emacs looks like code from the LISP programming language. That's because it\
    \ is LISP code! You can add functionality to Emacs by writing more LISP code.\n\
    \nTry running the command M-x dunnet if you want to play an old-fashioned adventure\
