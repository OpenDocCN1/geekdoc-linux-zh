  md: 'Throughout this book, we assume that you are familiar with the calls described
    in this

    appendix. You may already be familiar with them because they''re nearly the same
    as

    provided on other UNIX and UNIX-like operating systems (and on the Win32

    platform as well). If you''re not familiar with them, however, read on; you''ll
    find the

    rest of the book much easier to understand if you familiarize yourself with this

    material first.


    # B.1 Reading and Writing Data


    The first I/O function you likely encountered when you learned the C language

    was printf. This formats a text string and prints it to standard output. The gener-

    alized version, `fprintf`, can print the text to a stream other than standard
    output. A

    stream is represented by a FILE* pointer. You obtain a FILE* pointer by opening
    a file

    with fopen. In addition to fprintf, you can close it with fclose. You can use
    functions like fput, fputs, and fwrite to write data to the stream, or

    scanf, fscanf, gets, and fread to read data.


    With the Linux low-level I/O operations, you use a handle called a file descriptor

    instead of a FILE* pointer. A file descriptor is an integer that refers to a particu-

    lar an open file in a single process. It can be opened for reading, writing,

    or for both reading and writing. A file descriptor doesn''t have to refer to an
    open file;

    it can represent a connection with another system component that is capable of
    send-

    ing or receiving data. For example, see Chapter 6, "Devices", as an open socket
    (see Chapter 5,

    "Interprocess Communication," Section 5.5, "Sockets") or one end of a pipe (see

    Section 5.4, "Pipes").


    Include the header <stdio.h>, <sys/types.h>, <sys/stat.h>, and <unistd.h>

    if you use any of the low-level I/O functions described here.


    # B.1.1 Opening a File


    To open a file and produce a file descriptor that can access that file, use the
    open call.

    It takes arguments as the path name of the file, as a character string, and flags

    sifying how to open it. You can use open to create a new file; if you do, pass
    a third

    argument that specifies the access permissions to the new file.


    If the second argument is O_RDONLY, the file is opened for reading only; an error

    will if you subsequently try to write to the resulting file descriptor. Similarly,

    O_WRONLY causes the file descriptor to be write-only. Specifying O_RDWR produces
    a file

    descriptor that can be used for both reading and writing. Note that not all files

    may be opened in all three modes. For instance, the permissions on a file might
    forbid

    a particular process from opening it for reading or writing; a file on a read-only

    device such as a CD-ROM drive may not be opened for writing.'
