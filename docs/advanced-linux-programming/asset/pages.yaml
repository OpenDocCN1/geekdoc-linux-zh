    # Other Development Tools


    DEVELOPING CORRECT, FAST C OR C++ GNU/Linux PROGRAMS requires more than just understanding
    the GNU/Linux operating system and its system calls. In this appendix, we discuss
    development tools to find runtime errors such as illegal use of dynamically allocated
    memory and to determine which parts of a program are taking most of the execution
    time. Analyzing a program''s source code can reveal some of this information;
    by using these runtime tools and actually executing the program, you can find
    out much more.


    # A.1 Static Program Analysis


    Some programming errors can be detected using static analysis tools that analyze
    the program''s source code. If you invoke GCC with -Wall and -pedanticic, the
    compiler issues warnings about risky or possibly erroneous programming constructions.
    By eliminating such constructions, you''ll reduce the risk of program bugs, and
    you''ll find it easier to compile your programs on different GNU/Linux variants
    and even on other operating systems.'
  merge: -1
  pgno: 284
- img_proc: true
  md: "# Appendix A Other Development Tools\n\nUsing various command options, you\
    \ can cause GCC to issue warnings about many different types of questionable programming\
    \ constructs. The -Wall option enables most of these checks. For example, the\
    \ compiler will produce a warning about a comment that begins within another comment,\
    \ about an incorrect return type specified for main, and about non void function\
    \ omitting a return statement. If you specify the -pedantic option, GCC emits\
    \ warnings demanded by ANSI C and ISO C++ compliance. For example, the GNU asm\
    \ extension causes a warning using this option. A few GNU extensions, as using\
    \ alternate keywords with __ (underscores), will not trigger warning messages.\
    \ Although the GCC info pages deprecate use of this option, we recommend that\
    \ you avoid and most GCC language extensions because GCC extensions tend to change\
    \ through time and frequently interact with poor code optimization.\n\n# Listing\
    \ A.1 (hello.c) Hello Program\n\n```\nmain ()\n  printf(\\'Hello, world.\\n\\\
    ');\n}\n```\n\nConsidering compiling the \"Hello World\" program shown in Listing\
    \ A.1. Though GCC compiles the program without complaint, the source code does\
    \ not obey ANSI C rules. If you enable warnings by compiling with the -Wall -pedantic,\
    \ GCC reveals three questionable constructs.\n\n```\n% gcc -Wall -pedantic, gcc\n\
    hello.c:2: warning: return type defaults to 'int'\nhello.c: In function 'main':\n\
    hello.c:3: warning: implicit declaration of function 'printf'\nhello.c:4: warning:\
    \ control reaches end of non-void function\n```\n\nThese warnings indicate that\
    \ the following problems occurred:\n\n+   - The return type for main was not specified.\n\
    - The function printf is implicitly declared because <stdio.h> is not included.\n\
    - The function, implicitly declared to return an int, actually returns no value.\n\
    \nAnalyzing a program's source code cannot find all programming mistakes and inefficiencies.\
    \ In the next section, we present four tools to find mistakes in using dynamically\
    \ allocated memory. In the subsequent section, we show how to analyze the program's\
    \ execution time using the gprof profiler."
