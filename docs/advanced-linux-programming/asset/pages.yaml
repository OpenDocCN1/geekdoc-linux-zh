  md: "# 9.3 Extended Assembly Syntax\n\nIn the subsections that follow, we describe\
    \ the syntax rules for asm statements. Their sections are separated by colons.\n\
    \nWe will refer to this inline assembly statement, which computes the Boolean\
    \ expression x y :\n\n```\nasm (\"%fucomp %%st(1), %%st; seta %%al\" :\n  ==\"\
    a\" (result) : \"c\" (y), \"t\" (x) : \"cc\", \"st\");\n```\n\nFirst, fucomp compares\
    \ its two operands x and y, and stores values indicating result into the condition\
    \ code register. Then seta sets these values into a 0 or 1 result.\n\n# 9.3.1\
    \ Assembler Instructions\n\nThe first section contains the assembler instructions,\
    \ enclosed in quotation marks. The example asm contains two assembly instructions,\
    \ fucomp and seta, separated by semi-colons. If the assembler does not permit\
    \ semicolons, use newline characters (n) to separate instructions.\n\nThe compiler\
    \ ignores the contents of this first section, except that one level of percentage\
    \ signs is removed, so %% changes to %. The meaning of %%st(1) and other terms\
    \ is architecture-dependent.\n\nGCC will complain if you specify the -traditional\
    \ option or the -ansi option when compiling a program containing asm statements.\
    \ To avoid producing errors, such as in header files, use the alternative keyword\
    \ __asm__.\n\n# 9.3.2 Outputs\n\nThe second section specifies the instructions'output\
    \ operands using C syntax. Each operand is specified by an operand constraint\
    \ string followed by a C expression in parentheses. For output operands, which\
    \ must be values, the constraint string should begin with an equals sign. The\
    \ compiler checks that the C expression for each output operand is in fact an\
    \ value.\n\nLetters specifying registers for a particular architecture can be\
    \ found in the GCC source code, in the REG_CLASS_FROM_LETTER macro. For example,\
    \ the gcc/config/i386/i386.h configuration file in GCC lists the register letters\
    \ for the x86 architecture. Table 9.1 summarizes these.\n\n+   3. You'll need\
    \ to have some familiarity with GCC's internals to make sense of this file."
