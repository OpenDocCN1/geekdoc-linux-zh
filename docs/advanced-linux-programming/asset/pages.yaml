  md: "# B.1 Reading and Writing Data\n\nThe lseek call enables you to reposition\
    \ a file descriptor in a file. Pass it the file descriptor and two additional\
    \ arguments specifying the new position.\n\n+   - If the third argument is SEEK_SET,\
    \ lseek interprets the second argument as a position, in bytes, from the start\
    \ of the file.\n- If the third argument is SEEK_CUR, lseek interprets the second\
    \ argument as an offset, which may be positive or negative, from the current position.\n\
    - If the third argument is SEEK_END, lseek interprets the second argument as an\
    \ offset from the end of the file. A positive value indicates a position beyond\
    \ the end of the file.\n\nThe call to lseek returns the new position, as an offset\
    \ from the beginning of the file. The type of the offset is off_t. If an error\
    \ occurs, lseek returns -1. You can't lseek with some types of file descriptors,\
    \ such as socket file descriptors.\nIf you want to find the position of a file\
    \ descriptor in a file without changing it, specify a 0 from the current position—for\
    \ example:\noff = lseek(fd, 0, SEEK_CUR);\nLinux enables you to use lseek to position\
    \ a file descriptor beyond the end of the file. Normally, if a file descriptor\
