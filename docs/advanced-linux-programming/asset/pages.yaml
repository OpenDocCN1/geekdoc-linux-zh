    # 7.5.3 Mounts


    The /proc/mounts provides a summary of mounted file systems which corresponds
    to a single mount descriptor and lists the mounted device, the mount point, and
    other information. Note that /proc/mounts contains the same information as the
    ordinary file /etc/mtab, which is automatically updated by the mount command.

    These are the elements of a mount descriptor:


    +   - The first element on the line is the mounted device (Chapter 6). For special
    file systems such as /, this is none.

    - The second element is the mount point, the place in the root file system at
    which the file system contents appear. For the root file system itself, the mount
    point is listed as /. For swap drives, the mount point is listed as swap.'
