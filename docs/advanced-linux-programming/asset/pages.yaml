  md: "# Chapter 2 Writing Good GNU/Linux Software\n\nUsing mktemp function creates\
    \ a unique temporary filename from a filename template, creates the file with\
    \ permissions so that only the current user can access it, and opens the file\
    \ for read/write. The filename is a string ending with \"XXXXXX\" (six character\
    \ X); mktemp replaces the X's characters so that the filename is unique. The return\
    \ value is a file descriptor; use the write function of functions to write to\
    \ the temporary file.\n\nTemporary files created with mktemp are not deleted automatically.\
    \ It's up to you to remove the temporary file when it's no longer needed. (Programmers\
    \ should be very careful to clean up temporary files; otherwise, the /tmp file\
    \ system will fill up, rendering the system inoperable.) If the temporary file\
    \ is for internal use and won't be accessed by another program, it's a good idea\
    \ to call unlink on the temporary file immediately. The unlink function removes\
    \ the directory corresponding to a file; because files in a file system are reference-counted,\
    \ the file itself is not removed until there are no open file descriptors for\
    \ it, either. This way, your program may continue to use the temporary file, and\
    \ the file goes away automatically as soon as you close the file descriptor. Because\
    \ Linux file descriptors will be removed if your program terminates normally.\n\
    \nThe pair of functions in Listing 2.5 demonstrates mktemp. Used together, they\
    \ make it easy to write a memory buffer to a file (so that memory can be freed\
    \ or reused) and then read it back.\n\n# Listing 2.5 (temp_file.c) Using mktemp\n\
    \n```\n#include <stdlib.h>\n#include <unistd.h>\n\n/* A handler for a temporary\
    \ file created with write_temp_file. In\nthis implementation, it's just a file\
    \ descriptor. */\ntypedef int temp_file_handle;\n\n/* Writes length from BUFFER\
