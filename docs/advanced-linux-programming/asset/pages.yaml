  md: '# # Writing Good GNU/Linux Software


    THIS CHAPTER COVERS SOME BASIC TECHNIQUES THAT MOST GNU/Linux programmers use.
    By following the guidelines presented, you''ll be able to write programs that
    work well within the GNU/Linux environment and meet GNU/Linux users'' expectations
    of how programs should operate.


    # ## 2.1 Interaction With the Execution Environment


    When you first studied C or C++, you learned that the special main function is
    the primary entry point for a program. When the operating system executes your
    program, it automatically provides certain facilities that help the program communicate
    with the operating system and the user. You probably learned about the two parameters
    to main, usually argc and argv, which receive inputs to your program.

    You learned about the stdout and stdin (or the cout and cin streams in C++) that
    provide console input and output. These features are provided by the C and C++
    languages, and they interact with the GNU/Linux system in certain ways. GNU/Linux
    provides other ways for interacting with the operating environment, too.'
