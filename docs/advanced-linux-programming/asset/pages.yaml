    \ a NULL. */\n    };\n    /* Spawn a child process running the \"ls\" command.\
    \ Ignore the returned child process ID. */\n    spawn (\"ls\", arg_list);\n  \
    \  /* Wait for the child process to complete. */\n    wait(&child_status);\n \
    \   if (WIFEXITED(child_status))\n        printf(\"the child process exited normally,\
    \ with exit code %d\\n\", WEXITSTATUS(child_status));\n    else\n        printf(\"\
    the child process exited abnormally\\n\");\n    return 0;\n}\n```\n\nSeveral similar\
    \ system calls are available in Linux, which provide more information about the\
    \ exiting child process. The waitpid function can be used to wait for a specific\
    \ process to exit instead of any child process. The wait3 function returns CPU\
    \ usage statistics about the exiting child process, and the wait4 function allows\
    \ you to specify additional options about which processes to wait for.\n\n# 3.4.3\
    \ Zombie Processes\n\nIf a child process terminates while its parent is calling\
    \ a wait function, the process vanishes and its termination status is passed to\
    \ its parent via the wait call. But what happens when a child process terminates\
    \ and the parent is not calling wait? Does it simply vanish? No, because information\
    \ about its termination—such as whether it exited normally and, if so, what its\
    \ exit status is—would be lost. Instead, when a child process terminates, it becomes\
    \ a zombie process."
