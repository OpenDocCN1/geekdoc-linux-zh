  md: '# 2.3 Writing and Using Libraries 39


    Then you combine the object files into a shared library, like this:


    ```

    % gcc -shared -fPIC -o libtest.so test1.o test2.o

    ```


    -shared option tells the linker to produce a shared library rather than an ordinary
    executable. Shared libraries use the extension .so, which stands for shared object.
    Like static archives, the name always begins with lib to indicate that the file
    is a library.


    Linking with a shared library is just like linking with a static archive. The
    following line will link with libtest.so if it is in the current directory, or
    one of the standard library search directories on the system:


    ```

    % gcc -o app.o -L. -ltest

    ```


    Suppose that both libtest.a and libtest.so are available. Then the linker will
    choose one of the libraries and not the other. The linker searches each directory
    (first one specified with -L options, and then in the standard directories). The
    linker finds a directory that contains either libtest.a or libtest.so, the linker
    stops search directories. If only one of the two variants is present in the directory,
    the linker chooses that variant. Otherwise, the linker chooses the shared library
    version unless you explicitly use thestatic option to demand static archives.
    For example, the following line will use the libtest.a archive, even if libtest.so
    shared library is also available:


    ```

    % gcc -static -o app.o -L. -ltest

    ```


    The ldd command displays the shared libraries that are linked into an executable.
    These libraries need to be available when the executable is run. Note that ldd
    will list an additional library called ld-linux.so, which is a part of /GNU/Linux''s
    dynamic linking mechanism.


    # Using LD_LIBRARY_PATH


    When you link a program with a shared library, the linker does not put the full
    path to the shared library in the resulting executable. Instead, it places the
    name of the shared library. When the program is actually run, the system searches
    for the shared library and loads it. It searches only /lib and /usr/lib, by default.
    If a shared library that is linked into your program is installed outside those
    directories, it will not be found, and the system will refuse to run the program.


    One solution to this problem is to use the -Wl, -rpath option when linking the
    program. Suppose that you use this:


    ```

    % gcc -o app.o -L. -ltest -Wl,-rpath,/usr/local/lib

    ```


    Then, when app is run, the system will search /usr/local/lib for any required
    libraries.'
