    # # HTTP


    The Hypertext Transfer Protocol (HTTP) is used for communication between Web clients
    and servers. The client connects to the server by establishing a connection to
    a well-known port (usually port 80 for Internet Web servers, but any port may
    be used). HTTP requests and headers are composed of plain text. Once connected,
    the client sends a request to the server. A typical request is GET /page HTTP/1.0.
    The GET method indicates that the client is requesting that the server send it
    a Web page. The second element is the path to the server. The third element is
    the protocol and version. Subsequent lines contain header fields, formatted similarly
    to email headers, which contain extra information about the client. The header
    has a blank line.


    The server sends a response indicating the result of processing the request. A
    typical response is HTTP/1.0 200 OK. The first element is the protocol version.
    The next two elements indicate the result; in this case, 200 indicates that the
    request was processed successfully. Subsequent lines contain header fields, formatted
    similarly to email headers. The header ends with a blank line. The server may
    then send arbitrary data to satisfy the request.


    Typically, the server responds to a page request by sending back HTML source for
    the Web page. In this case, the response headers will include Content-type: text/html,
    indicating that the result is HTML source. The HTML source follows immediately
    after the header.


    See the HTTP specification at http://www.w3.org/Protocols/ for more information.


