    # B.3 Vector Reads and Writes


    The write call takes as arguments a pointer to the start of a buffer of data and
    the length of that buffer. It writes a contiguous region of memory to the file
    descriptor. However, a program often will need to write several items of data,
    each residing in a different part of memory. To use this, the program will either
    have to copy the items into a single memory region, which obviously makes inefficient
    use of CPU cycles and memory, or will make multiple calls to write.


    For some applications, multiple calls to write are inefficient or undesirable.
    For example, when writing to a network socket, two calls to write may cause two
    packets to be sent across the network, whereas the same data could be sent in
    a single packet if a single call to write were possible.


    The write call enables you to write multiple discontiguous regions of memory to
    a file descriptor in a single operation. This is called a vector write. The cost
    of using write is that you must set up a data structure specifying the start and
    length of each region of memory. This data structure is an array of struct iovec
    elements. Each element specifies one region of memory to write; the fields iovec_base
    and iovec_len specify the address of the start of the region and the length of
    the region, respectively. If you know ahead of how many regions you''ll need,
    you can simply declare a struct iovec array; if the number of regions can vary,
    you must allocate the array dynamically.


    Call write passing a file descriptor to write to, the struct iovec array, and
    the number of elements in the array. The return value is the total number of bytes
    written.


    The program in Listing B.7 writes its command-line arguments to a file using a
    single write call. The first argument is the name of the file, and the subsequent
    arguments are written to the file of that name, one on each line. The program
    allocates an array of struct iovec elements that is twice as long as the number
    of arguments it is writing—for each argument it writes the text of the argument
    itself as well as a new line character. Because we don''t know the number of arguments
    in advance, the array is allocated using malloc.'
