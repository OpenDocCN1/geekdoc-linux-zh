  md: '# B.2 stat


    Using open and read, you can extract the contents of a file. But how about other
    information? For instance, invoking ls -1 displays, for the files in the current
    directory, such information as the file size, the last modification time, permissions,
    and the owner.


    The stat call obtains information about a file. Call with the path to the file
    you are interested in and a pointer to a variable of type struct stat. If the
    call to stat is successful, it returns 0 and fills the fields of the structure
    with information about that file; otherwise, it returns -1.


    These are the most useful fields in struct stat:


    +   - st_mode contains the file''s access permissions. File permissions are explained
    in Section 10.3, "File Permissions."


    +   - In addition to the access permissions, the st_mode field encodes the type
    of the file in higher-order bits. See the text immediately following this bulleted
    list for instructions on decoding this information.


    +   - st_uid and st_gid contain the IDs of the user and group, respectively, to
    the file belongs. User and group IDs are described in Section 10.1, "Users and
    Groups."


    +   - st_size contains the file size, in bytes.


    +   - st_atime contains the time when this file was last accessed (read or written).


    +   - st_mtime contains the time when this file was modified.


    These macros check the value of the st_mode field value to figure out what kind
    of file you''ve invoked on. A macro evaluates to true if the file is of that type.


    ```

    S_ISBLK (mode) block device

    S_ISCHR (mode) character device

    S_ISDIR (mode) directory

    S_ISFIFO (mode) fifo (named pipe)

    S_ISLN (mode) symbolic link

    S_ISREG (mode) regular file

    S_ISSOCK (mode) socket

    ```


    The st_dev field contains the major and minor device number of the hardware device
    on which this file resides. Device numbers are discussed in Chapter 6. The major
    device number is shifted left 8 bits; the minor device number occupies the least
    significant bits. The st_ino field contains the inode number of this file. This
    locates the file in the file system.'
