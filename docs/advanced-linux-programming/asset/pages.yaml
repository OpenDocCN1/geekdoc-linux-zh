  md: '# 9.2 Simple Inline Assembly


    Here we introduce the syntax of asm assembler instructions with an x86 example
    to shift a value 8 bits to the right:


    ```

    asm ("shrl $8, %%0" : "r" (answer) : "cc");

    ```


    The keyword asm is followed by a parenthetic expression consisting of sections
    separated by colons. The first section contains an assembler instruction and its
    operands. The first section, shrl right-shifts the bits in its first operand.
    Its first operand is represented by %%0. The second operand is the constant $8.


    The second section specifies the outputs. The instruction''s one output will be
    placed in the C variable answer, the string "*r" contains an equal sign indicating
    an output operand and an r indicating that answer is stored in a register.


    The third section specifies the inputs. The C variable operand specifies the value
    to shift. The string "%r" indicates that it is stored in a register but omits
    an equal sign because it is an input operand, not an output operand.


    The fourth section indicates that the instruction changes the value in the condition
    code cc.


    # 9.2.1 Converting an asm to Assembly Instructions


    GCC''s treatment of asm statements is very simple. It produces assembly instructions
    to deal with asm''s operands, and replaces the asm statement with the instruction
    that you specify. It does not analyze the instruction in any way.


    For example, GCC converts this program fragment


    ```

    double foo, bar;

    asm ("mycool_asm %%1, %%0" : "r" (bar) : "r" (foo));

    ```


    to these x86 assembly instructions:


    ```

    mov -8(%ebp),%edx

    mov -4(%ebp),%ecx

    #APP

    mycool_asm %ecx,%edx

    #NO_OP

    mov %edx,-16(%ebp)

    mov %ecx,-12(%ebp)

    ```


    Remember that foo and bar each require two words of stack storage on a 32-bit
    x86 architecture. The register ebp points to the stack.

    The first instructions copy foo into registers EDX and ECX on when mycool_asm
    operates. The compiler decides to use the same registers to store the answer,
    which is copied into bar by the final two instructions. It chooses appropriate
    registers, even reusing the same registers, and copies operands to and from the
    proper locations automatically.'
