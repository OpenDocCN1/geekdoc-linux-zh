  md: '# 3.3 Signals 53


    When a process receives a signal, it may do one of several things, depending on
    the signal''s disposition. For each purpose, there is a default disposition, which
    determines what happens to the process if the program does not specify some other
    behavior. For most signal types, a program may specify some other behavior—either
    to ignore the signal or to call a signal-handler function to respond to the signal.
    If a signal handler is passed, the currently executing program is executed, and
    when the signal handler returns, the program resumes.


    The Linux system sends signals to processes in response to specific conditions.
    For instance, SIGBUS (bus error), SIGSEGV (segmentation violation), SIGFPE (floating
    exception) may be sent to a process to perform an illegal operation. The default
    disposition for these signals is to terminate the process and produce a core file.


    A process may also send a signal to another process. One common use of this mechanism
    is to send it SIGTERM or SIGKILL signal. Another common use is to send a command
    to a running program. “user-defined” signals are reserved for this purpose: SIGUSR1
    and SIGUSR2. The SIGHUP signal is used for some purpose as well, to wake up an
    idling program or cause a process to reload its configuration files.


    The signal function can be used to set a signal disposition. The first parameter
    is the signal number. The next two parameters are pointers to signal structures;
    the first of these contains the desired disposition for that number, while the
    second receives the previous disposition. The most important field in the second
    signal structure is sa_handler. It can take one of three values:


    +   - SIGDFL, which specifies the default disposition for the signal.

    - SIGIGN, which specifies that the signal should be ignored.

    - A pointer to a signal-handler function. The function should take one argument,
    the signal number, and return void.


    Because signals are asynchronous, the main program may be in a very fragile state
    when a signal is processed and while a signal handler executes. Therefore, you
    should avoid performing any I/O operations or calling most library and system
    functions from signal handlers.


    A signal handler should perform the minimum work necessary to respond to the signal,
    and then return control to the main program (or terminate the program). In most
    cases, this consists of simply recording the fact that a signal occurred. The
    main program then checks whether a signal has occurred and acts accordingly.


    It is possible for a signal handler to be interrupted by another signal. While
    this may sound like a rare occurrence, if it does occur, it will be very difficult
    to diagnose and debug the problem (This is an example of a race condition, discussed
    in Chapter 4, “Threads,” Section 4.4, “Synchronization and Critical Sections.”)
    Therefore, you should be careful about what your program does in a signal handler.


    +   3. What’s the difference? The SIGTERM signal asks a process to terminate;
    the process may ignore it by masking or ignoring the signal. The SIGKILL signal
    always kills the process immediately because the process may not mask or ignore
    SIGKILL.'
