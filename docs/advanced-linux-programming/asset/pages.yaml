    # # Table of Signals


    TABLE C.1 LISTS SOME OF THE LINUX SIGNALS YOU''RE MOST LIKELY to encounter or
    use. Note that some signals have multiple interpretations, depending on where
    they occur.


    The names of the signals listed here are defined as preprocessor macros. To use
    them in your program, include <usr/include/sys/signal.h>, which is included as
    part of <signal.h>.


    For a full list of Linux signals, including a short description of each and the
    default behavior when the signal is delivered, consult the signal man page in
    Section 7 by invoking the following:


    ```

    % man 7 signal

    ```


    | Name | Description |

    | --- | --- |

    | SIGHUP | Linux sends a process signal when it becomes disconnected from a terminal.
    Many Linux programs use SIGHUP for an unrelated purpose: to indicate to a running
    program that it should reread its configuration files. |


    continues'
