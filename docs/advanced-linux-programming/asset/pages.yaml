  md: '# 2.2 Coding Defensively 33


    # 2.2.3 Error Codes from System Calls


    A majority of system calls return zero if the operation succeeds, or a nonzero
    value if the operation fails. (Many, though, have different return value conventions;
    instance, `errno` returns a null pointer to indicate failure. Always read the
    man page when using a system call.) Although this information may be enough to
    determine whether the program should continue execution as usual, it probably
    does not provide enough information for a sensible recovery from errors.


    Most system calls use a special variable errno to store error. When a call fails,
    the system sets errno to a value indicating which went wrong. Because all system
    calls use the same errno to store information, you should copy the value into
    another variable immediately after the failed call. The value of errno will be
    overwritten the next time you make a system call.


    Error values are possible values given by preprocessor macros, by convention named
    in all capitals and starting with "E”—for example, EAGAIN and ETVAL. Always use
    these macros to refer to error values rather than integer values. Include the
    `<errno.h>` header if you use errno.


    GNU/Linux provides a convenient function, strerror, that returns a character string
    description of an error code, suitable for use in error messages. Include `<string.h>`
    if you use strerror.


    GNU/Linux also provides perror, which prints the error description to `stderr`.
    Pass to perror a character string prefix to print the error description, which
    should usually include the name of the function that failed. Include `<stdio.h>`
    if you use perror.


    This code fragment attempts to open a file; if the open call fails, it prints
    an error message and exits the program. Note that the open call returns an open
    file descriptor if the open operation succeeds, or -1 if the operation fails.


    ```

    fd = open("inputfile.txt", O_RDONLY);

    if (fd == -1 /* The open failed. Print an error message and exit. */

    printf(stderr, "error opening file: %s\n", strerror(errno));

    exit(1);

    ```


    Depending on your program and the nature of the system call, the appropriate action
    in case of failure might be to print an error message, to cancel an operation,
    to abort the program, to try again, or even to ignore the error. It''s important,
    though, to include logic that handles all possible failure modes in some way or
    another.


    Actually, for reasons of thread safety, errno is implemented as a macro, but it
    is used like a global variable.'
