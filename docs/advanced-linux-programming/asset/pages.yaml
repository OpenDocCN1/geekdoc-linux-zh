    What happens when the main make-zombie process ends when the parent process exits,
    without ever calling wait? Does the zombie process stay around? No—try running
    again, and note that both of the make-zombie processes are gone. When a process
    exits, its children are inherited by a special process, the init program, which
    always runs with process ID of 1 (it''s the first process started when Linux boots).
    The init process automatically cleans any child processes that it inherits.


    # 3.4.4 Cleaning Up Children Asynchronously


    If you''re using a child process to exec another program, it''s fine to call wait
    immediately in the parent process, which will block until the child process completes.
    But, you''ll want the parent process to continue running, as one or more children
    execute asynchronously. How can you be sure that you clean up child processes
    that have completed so that you don''t leave zombies, which consume system resources
    around?


    One approach would be for the parent process to call wait3 or wait4 periodically,
    to clean up zombie children. Calling wait for this purpose doesn''t work well,
    if no children have terminated, the call will block until one does. However, wait3
    and wait4 with an additional flag parameter let you pass the flag value WOHANG.
    With this flag, the function runs in nonblocking mode—it will return if there
    isn''t. The return value of the call is the process ID of the terminated child
    in the former case, or zero in the latter case.



    A more elegant solution is to notify the parent process when a child terminates.

    There are several ways to do this using the methods discussed in Chapter 5, "Interprocess
    Communication," but fortunately Linux does for you, using signals. When a child
    process terminates, Linux sends the parent SIGCHLD. The default disposition of
    this signal is to do nothing, which is why you might not have noticed before.


    Thus, an easy way to clean up processes is by handling SIGCHLD. Of course, when
    cleaning up the child process, it''s important to store its termination status
    if that information is needed, because once the process is cleaned up using wait,
    that information is no longer available. Listing 3.7 is what it looks like for
    a program to use a SIGCHLD handler to clean up its child processes'
