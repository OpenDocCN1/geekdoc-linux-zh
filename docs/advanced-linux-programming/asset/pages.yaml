  md: '# 4.1.4 More on Thread IDs


    Occasionally, it is useful for a sequence of code to determine which thread is
    executing it. The pthread_self function returns the thread ID of the thread in
    which it is called. This thread ID may be compared with another thread ID using
    the pthread_equal_function().


    These functions can be useful for determining whether a particular thread ID corresponds
    to the current thread. For instance, it is an error for a thread to pthread_join
    to join itself. (In this case, pthread_join would return the error code EDEADLK.)
    To check for this beforehand, you might use code like:


    ```

    if (pthread_equal (pthread_self (), other_thread))

    pthread_join(other_thread, NULL);

    ```


    # 4.1.5 Thread Attributes


    Thread attributes provide a mechanism for fine-tuning the behavior of individual
    threads. Recall that pthread_create accepts an argument that is a pointer to a
    thread attribute object. If you pass a null pointer, the default attributes are
    used to configure the new thread. However, you may create and customize a thread
    attribute object to specify other values for the attributes.


    To specify customized thread attributes, you must follow these steps:


    +   1. Create a pthread_attr_t object. The easiest is to declare an automatic
    variable of this type.

    2. Call pthread_attr_init, passing a pointer to this object. This initializes
    the attributes to their default values.

    3. Modify the attribute object to contain the desired attribute values.

    4. Pass a pointer to the attribute object when calling pthread_create.

    5. Call pthread_attr_destroy to release the attribute object. The pthread_attr_t
    default is not deallocated; it may be reinitialized with pthread_attr_init.


    A single thread attribute may be used to start several threads. It is not necessary
    to keep the thread attribute around after the threads have been created.


    For GNU/Linux programming tasks, only one thread attribute is typically of interest
    (the other attributes are primarily for reality real-time programming). This attribute
    is the thread''s state attribute. A thread may be created as a joinable thread
    (the default) or as a detached thread. A joinable thread, like a process, is not
    automatically cleaned up by GNU/Linux when it terminates. Instead, the thread''s
    exit status hangs in the system (like a zombie process) until another thread calls
    pthread_join to obtain its return value. Only then are its resources released.
    A detached thread, in contrast, is immediately cleaned up automatically when it
    terminates. Because a detached thread, another thread may not synchronize on its
    completion using pthread_join or obtain its return value.'
