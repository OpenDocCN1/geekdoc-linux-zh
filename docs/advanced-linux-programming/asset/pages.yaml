  md: 'Be aware, however, the names, semantics, and output formats of entries in the
    /proc file system might change in new Linux kernel revisions. If you use them
    in a program, you should make sure that the program''s behavior degrades gracefully
    if the /proc entry is missing or formatted unexpectedly.


    # 7.2 Process Entries


    The proc file system contains a directory for each process running on the GNU/Linux
    system. The name of each directory is the process ID of the corresponding process.
    These directories appear and disappear dynamically as process start and terminate
    on the system. Each directory contains several entries providing access to information
    about the running process. From these process directories the /proc system gets
    its name.


    Each process directory contains these entries:


    +   - cmdline contains the argument list for the process. The cmdline entry is
    described in Section 7.2.2, "Process Argument List."

    - cwd is a symbolic link that points to the current working directory of the process
    (as set, for instance, with the chdir call).

    - environ contains the process''s environment. The environ entry is described
    in Section 7.2.3, "Process Environment."

    - exe is a symbolic link that points to the executable running in the process.
    The exe entry is described in Section 7.2.4, "Process Executable."

    - fd is a subdirectory that contains entries for the file descriptors opened by
    the process. These are described in Section 7.2.5, "Process File Descriptors."

    - maps displays information about files mapped into the process''s address. See
    Chapter 5, "Interprocess Communication," Section 5.3, "Mapped Memory," for details
    of memory-mapped files. For each mapped file, maps displays the range of addresses
    in the process''s address space into which the file is mapped, the permissions
    on these addresses, the name of the file, and other.


    The maps table for each process displays the executable running in the process,
    any loaded shared libraries, and other files that the process has mapped.


    +   - root is a symbolic link to the root directory for this process. Usually,
    this is a symbolic link to /, the system root directory. The root directory for
    a process can be changed using the chroot call or the chroot command.


    +   1. On some UNIX systems, the process IDs are padded with zeros. On GNU/Linux,
    they are not.


    +   2. The chroot call and command are outside the scope of this book. See the
    chroot man page in Section 1 for information about the command (invoke man 1 chroot),
    or the chroot man page in Section 2 (invoke man 2 chroot) for information about
    the call.'
