    \ function or returning from main) or died from an unhandled signal. In the latter\
    \ case, use the WTERMSIG macro to extract from its exit status the signal number\
    \ by which it died.\n\nHere is the main function from the fork and exec example\
    \ again. This time, the parent process calls wait to wait until the child process,\
    \ in which the ls command executes, is finished.\n\n```\nint main () {\n    int\
