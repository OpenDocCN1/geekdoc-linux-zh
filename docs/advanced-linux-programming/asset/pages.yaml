  md: "# 7.1 Extracting Information from /proc 149\n\nA simple way to extract a value\
    \ from this output is to read the file into a buffer and parse it in memory using\
    \ scanf. Listing 7.1 shows an example of this. The program includes the function\
    \ get_cpu_clock_speed that reads from /proc/cpuinfo into memory and extracts the\
    \ first CPU's clock speed.\n\nListing 7.1 (clock-speed.c) Extract CPU Clock Speed\
    \ from /proc/cpuinfo\n\n```\n#include <stdio.h>\n#include <string.h>\n\n/* Returns\
    \ the clock speed of the system's CPU in MHz, as reported by\n/proc/cpuinfo. On\
    \ a multiprocessor machine, returns the speed of\nthe first CPU. On error returns\
    \ zero. */\n\nfloat get_cpu_clock_speed () {\n    FILE *fp;\n    char buffer[1024];\n\
    \    size_t bytes_read;\n    char* match;\n    float clock_speed;\n\n    /* Read\
    \ the entire content of /proc/cpuinfo into the buffer. */\n    fp = fopen(\"/proc/cpuinfo\"\
    , \"r\");\n    bytes_read = fread(buffer, 1, sizeof(buffer), fp);\n    close(fp);\n\
    \    /* Bail if read failed or if buffer isn't big enough. */\n    if (bytes_read\
    \ == 0 || bytes_read == sizeof(buffer))\n        return 0;\n    /* NUL-terminate\
    \ the text. */\n    buffer[bytes_read] = '\\0';\n    /* Locate the line that starts\
    \ with \"cpu MHz\". */\n    match = strstr(buffer, \"cpu MHz\");\n    if (match\
    \ == NULL)\n        return 0;\n    /* Parse the line to extract the clock speed.\
    \ */\n    sscanf(match, \"cpu MHz : %f\", &clock_speed);\n    return clock_speed;\n\
    }\n\nint main ()\n{\n    printf(\"CPU clock speed: %4.0f MHz\\n\", get_cpu_clock_speed\
    \ ());\n    return 0;\n}\n```"
