  md: '# 10.4 Real and Effective IDs 205


    To set the sticky bit programmatically, call chmod with the S_ISVTX flag. For

    example, to set the sticky bit of the directory specified by dir_path to those
    of the

    tmp and get full read, write, execute permissions to all users, use this:


    ```

    chmod (dir_path, S_IRWX | S_IRWX0 | S_ISVTX);

    ```


    # 10.4 Real and Effective IDs


    Until now, we''ve talked about the user ID and group ID associated with a process
    as if

    there were only one such user ID and one group ID. But, actually, it''s not quite

    that.


    Every process has two user IDs: the effective user ID and the real user ID. (Of

    course''s also an effective group ID and real group ID. Just about everything
    that''s

    true about your user ID is also true about group IDs.) Most of the time, the kernel
    checks

    only the effective user ID. For example, if a process tries to open a file, the
    kernel

    checks the effective user ID when deciding whether to let the process access the
    file.


    The getuid and getgid functions described previously return the effective user

    ID and the effective group ID. Corresponding getuid and getgid return the

    real user ID and real ID


    If the kernel cares about the effective user ID, it doesn''t seem like there''s

    much point in having a distinction between a real user ID and an effective user
    ID.

    However, there is one very important case in which the real user ID matters. If
    you

    want to change the effective user ID of an already running process, the kernel
    looks at

    the real user ID as the effective user ID.


    Before looking at how you can change the effective user ID of a process, let''s
    exam-

    ine why you would want to do such a thing by looking back at our accounting-

    age. Suppose there''s a server process that might need to look at any file on
    the

    regard of the user who created it. This process must run as root because

    only root can be guaranteed to be capable of looking at any file. But now suppose

    that request comes from a particular user (say, mitchell) to access some file.
    The

    server process could carefully examine the permissions associated with the files
    in

    question and decide whether mitchell should be allowed to access those files.

    But that would mean duplicating all the permissions that the kernel would normally
    do

    to check access permissions. Reimplementing that logic would be complex, error-

    , and tedious.


    A better approach is to temporarily change the effective user ID of the

    process from root to mitchell and then try to perform the operations required.
    If

    mitchell is not allowed to access the data, the kernel will prevent the process
    from

    doing so and return appropriate indications of error. After all the operations
    taken

    behalf of mitchell are complete, the process can restore its original effective
    user

    ID to root.'
  merge: -1
