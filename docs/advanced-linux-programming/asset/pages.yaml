  md: '# 2.2.2 System Call Failures


    Most of us were originally taught how to write programs that execute to completion
    along a well-defined path. We divide the program into tasks and subtasks, and
    each function completes a task by invoking other functions to perform corresponding
    sub-tasks. Given appropriate inputs, we expect a function to produce the correct
    output and side effects.


    The realities of computer hardware and software intrude into this idealized dream.
    Computers have limited resources; hardware fails; many programs make mistakes.
    It''s often at the boundary between the application and the operating system that
    these realities exhibit themselves. Therefore, when using system calls to access
    system resources, to perform I/O, or for other purposes, it''s important to understand
    not only what happens when the call succeeds, but also how and when the call fail.


    System calls can fail in many ways. For example:


    +   - The system can run out of resources (or the program can exceed the resource
    limits enforced by the system of a single program). For example, the program might
    try to allocate too much memory, write too much to a disk, or to open many files
    at the same time


    +   - Linux may block a certain system call when a program attempts to perform
    an operation for which it does not have permission. For example, a program might
    attempt to write to a file marked read-only; to access the memory of another process,
    or to kill another user''s program.


    +   - The arguments to a system call might be invalid, either because the user
    provided invalid input or because of a program bug. For instance, the program
    might pass an invalid memory address or an invalid file descriptor to a system
    call. Or, a program might attempt to open a directory as an ordinary file, or
    pass the name of an ordinary file to a system call that expects a directory.


    +   - A system call can fail for external reasons to a program. This happens most
    often when a system call accesses a hardware device. The device might be faulty
    or might not support a particular operation, or perhaps a disk is not inserted
    in the drive.


    +   - A system call can sometimes be interrupted by an external event, such as
    the delivery of a signal. This might not indicate outright failure, but it is
    the responsibility of the calling program to restart the system call, if desired.


    In a well-written program that makes extensive use of system calls, it is often
    the case that more code is devoted to detecting and handling errors and other
    exceptional circumstances to the main work of the program.'
