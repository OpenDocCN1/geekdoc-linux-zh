    \ to the file.This call can also be\n to delete other file system objects, such\
    \ as named pipes (\"FIFOs\") or devices (see Chapter 6).\nActually, unlink doesn't\
    \ necessarily delete the file's contents. As its name implies,\nit unlinks the\
    \ file from the directory containing it. The file is no longer listed in\ndirectory,\
    \ but if any process holds an open file descriptor to the file, the file's\ncontents\
    \ are not removed from the disk. So, if one process opens a file for read-\ning\
    \ or writing and then a second process unlinks the file and creates a new file\n\
    with the same name, the first process sees the old contents of the file rather\
    \ than\nt new contents (unless it closes the file and reopens it).\n- rename renames\
    \ or moves a file. Its two arguments are the old path and the new\npath for the\
