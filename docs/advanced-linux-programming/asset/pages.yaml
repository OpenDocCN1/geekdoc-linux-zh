  md: '# Chapter 9 Inline Assembly Code


    Observe that unlike ordinary assembly code instructions, asm statements permit
    you to specify input and output operands using C syntax.

    To read more about the x86 instruction set, x86 which we will use in this chapter,
    see http://developer.intel.com/design/pentium/manuals/ and http://www.x86-64.org/documentation.


    # 9.1 When to Use Assembly Code


    Although asm statements can be abused, they allow your programs to access the
    computer hardware directly, and they can produce programs that execute quickly.
    You can use them when writing operating system code that directly needs to interact
    with hardware. For example, /usr/include/asm/io.h contains assembly instructions
    to access input/output ports directly. The Linux source code file /usr/src/linux/x86/kernel/process.s
    provides another example, using hit in idle loop code. See other Linux source
    files in /usr/src/linux/arch/ and /usr/src/linux/drivers.


    Assembly instructions can also speed the innermost loop of computer programs.
    For example, if the majority of a program''s running time is computing the sine
    and cosine of the same angles, this innermost loop could be recoded using the
    fsincos x86 instruction.² See, for example, /usr/include/bits/mathline.h, which
    wraps it into macros inline assembly sequences that speed transcendental function
    computation.


    You should use inline assembly to speed code only as a last resort. Current compilers
    are quite sophisticated and know a lot about the details of the processors for
    which they generate code. Therefore, compilers can often choose code sequences
    that may seem unintutive or roundabout but actually execute faster than instruction
    sequences. Unless you understand the instruction set and scheduling of your processor
    well, you''re probably better off letting the compiler''s optimizers generate
    assembly code for you most operations.


    Occasionally, one or two assembly instructions can replace several lines of higherlevel
    language code. For example, determining the position of the most significant nonzero
    bit of a nonzero integer using the C programming languages requires a loop or
    floating-point computations. Many architectures, including the x86, have the use
    of one assembly instruction (bsr) to compute this bit position. We''ll demonstrate
    the use of one of these in Section 9.4, "Example":


    +   2. Algorithmic or data structure changes may be more effective in reducing
    a program''s running time than using assembly instructions.'
