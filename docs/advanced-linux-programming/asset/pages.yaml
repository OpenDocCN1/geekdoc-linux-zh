    # 7.6 System Statistics


    Two entries in /proc contain useful system statistics. The /proc/loadavg file
    contains information about the system load. The first three numbers represent
    the number of active tasks on the system—processes that are actually running—averaged
    over the last 1, 5, and 15 minutes. The next entry shows the instantaneous current
    number of runnable tasks—processes that are currently scheduled to run rather
    than blocked in a system-call—and the total number of processes on the system.
    The final entry is the process ID of the process that most recently ran.


