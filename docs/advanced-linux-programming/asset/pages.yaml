  md: '# 5.5.1 Socket Concepts


    When you create a socket, you must specify three parameters: communication style,
    namespace, and protocol.


    A communication style controls how the socket treats transmitted data and specifies
    the number of communication partners. When data is sent through a socket, it is
    packed into chunks packets. The communication style determines how packets are
    handled and how they are addressed from the sender to the receiver.


    +   - Connection styles guarantee delivery of all packets in the order they were
    sent. If packets are lost or reordered by problems in the network, the receiver
    automatically requests their retransmission from the sender.

    - A connection-style socket is like a telephone call: The addresses of the sender
    and receiver are fixed at the beginning of the communication when the connection
    is established.

    - Datagram style do not guarantee delivery or arrival order. Packets may be lost
    or reordered in transit due to network errors or other conditions. Each packet
    must be labeled with its identity and is guaranteed to be delivered with "best
    effort," so packets may disappear or arrive in a different order than shipping.

    - A datagram-style socket behaves more like postal mail. The sender specifies
    the receiver''s address for each individual message.


    A socket namespace specifies how socket addresses are written. A socket address
    identifies one of a socket connection. For example, socket addresses in the "local
    name-space" are ordinary filenames. In "Internet namespace," a socket address
    (also known as an Internet Protocol address or IP address) of a host attached
    to the network and a port number. The port number distinguishes among multiple
    sockets on the same host.


    A protocol specifies how data is transmitted. Some protocols are TCP/IP, the primary
    networking protocols used over the Internet; the Apple/Talk network protocol;
    and the UNIX local communication protocol. Not all combinations of styles, namespaces,
    and protocols are supported.


    # 5.5.2 System Calls


    Sockets are more flexible than previously discussed communication techniques.
    Are the system calls involving sockets:


    +   - socket—Creates a socket

    - closes—Destroys a socket

    - connect—Creates a connection between two sockets

    - bind—Labels a server socket to accept with an address

    - listen—Configures a socket to accept conditions

    - accept—Accepts a connection and creates a new socket for the connection


    Sockets are represented by file descriptors.'
