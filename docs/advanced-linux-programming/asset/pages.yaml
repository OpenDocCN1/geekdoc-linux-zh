    \ when another thread accesses the same data structure, chaos is likely to ensue.\
    \ Often, buggy threaded programs contain a code that will work only if one thread\
    \ gets scheduled more often—or sooner—than another thread. These bugs are called\
    \ race conditions; the threads are racing one another to change the same data\
    \ structure.\n\n# 4.4.1 Race Conditions\n\nSuppose that your program has a series\
    \ of queued jobs that are processed by several concurrent threads. The queue of\
    \ jobs is represented by a linked list of struct job objects.\n\nAfter each thread\
    \ finishes an operation, it checks the queue to see if an additional job is available.\
