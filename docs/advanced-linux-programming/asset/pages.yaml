    The condition protected by a condition variable can be arbitrarily complex. However,
    before performing any operation that may change the sense of the condition, a
    mutex lock should be required, and the condition variable should be signaled afterward.


    A condition variable may also be used without a condition, simply as a mechanism
    for blocking a thread until another thread "wakes it up." A semaphore may also
    be used for that purpose. The principal difference is that a semaphore "remembers"
    the wake-up call if no thread was blocked on it at the time, while a condition
    variable discards the wake-up call unless some thread is actually blocked on it.
    Also, a semaphore delivers only a single wake-up post; pthread_cond_broadcast,
    an arbitrary and unknown number of blocked threads may be awakened at the same
    time.


    # 4.4.7 Deadlocks with Two or More Threads


    Deadlocks can occur when two (or more) threads are blocked, waiting for a condition
    to occur that only the other can cause. For instance, if thread A is blocked on
    a condition variable waiting for thread B to signal it, and thread B is blocked
    on a condition variable waiting for thread A to signal it, a deadlock has occurred
    because neither will ever signal the other. You should take care to avoid the
    possibility of such situations because they are difficult to detect.


    A common error that can cause a deadlock involves a problem in which more than
    one thread is trying to lock the same set of objects. For example, consider a
    program in which different threads, running two different thread functions, need
    to lock the same mutexes. Suppose that thread A locks mutex 1 and then mutex 2,
    and thread B happens to lock mutex 2 before mutex 1. In a sufficiently unlucky
    scheduling, Linux may schedule thread A long enough to lock mutex 1, and then
    thread B, promptly locks mutex 2. Now neither thread can progress because each
    is blocked on a mutex that the other thread holds locked.


    This is an example of a more general deadlock problem, which can involve not only
    synchronization objects such as mutexes, but also other resources, such as locks
    on files or devices. The problem occurs when multiple threads try to lock the
    same set of resources in different orders. The solution is to make sure that all
    threads lock more than one resource lock in the same order.'
