  md: '# 6.5 Special Devices 137


    6.5.3 /dev/full

    The entry /dev/full behaves as if it were a file on a file system that has no
    more

    room. A write to /dev/full fails and sets `errno` to ENOSPC, which ordinarily
    indicates

    that the written-to-device is full.


    For example, you can-try to write to /dev/full using the cp command:

    % cp /etc/fstab /dev/full

    cp: /dev/full: No space left on device


    The /dev/full entry is primarily useful to test how your program behaves if it
    runs

    out of disk space while writing to a file.


    # 6.5.4 Random Number Devices


    The special devices /dev/random and /dev/urandom provide access to the Linux kernel''s
    built-in random number-generation facility.


    Most functions for generating random numbers, such as the random function in the
    standard C library, actually generate pseudorandom numbers. Although these numbers
    satisfy some properties of random numbers, they are reproducible: If you start
    with the same seed value, you''ll obtain the same sequence of pseudorandom numbers
    every time. This behavior is inevitable because computers are intrinsically deterministic
    and predictable. For certain applications, this behavior is undesirable; for instance,
    it is possible to break a cryptographic algorithm if you can obtain the sequence
    of random numbers it employs.


    To obtain better random numbers in computer programs requires an external source
    of randomness. The Linux kernel harnesses a particularly good source of randomness:
    you! By measuring the time delay between your actions, such as keystrokes and
    mouse movements, Linux is capable of generating an unpredictable stream of high-quality
    random numbers. You can access this stream by reading /dev/random and /dev/urandom.
    The data that you read is a stream of randomly generated bytes.


    The difference between the two devices exhibits itself when Linux exhausts its
    source of randomness. If you try to read a large number of bytes without input
    actions (don''t move, the mouse, or perform a similar action), Linux blocks the
    read operation. Only when you provide randomness does Linux generate more random
    bytes and return them to your program.


    For example, try displaying the contents of /dev/urandom using the od command.
    Each row of output shows 16 random numbers.


    +   We use od instead of the hexdump program presented in Listing B.4, even though
    they do pretty much the same thing, because hexdump terminates when it runs out
    of data, while it waits for more data to become available. The -t x option allows
    you to print file contents in hexadecimal.'
