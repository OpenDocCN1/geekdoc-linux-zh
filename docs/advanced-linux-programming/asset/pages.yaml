  md: '# 7.4.3 Memory Usage


    The /proc/meminfo entry contains information about the system''s memory usage.
    Information is presented both for physical memory and swap space. The first three
    lines present memory totals, in bytes; subsequent lines summarize this information
    in kilobytes—for example:


    ```

    $ cat /proc/meminfo

    total: used: free: shared: buffers: cached:

    Mem:     529694720 519618068 10084352 82612224 10977280 82108416

    Swap:   271397268 44803328 227389440

    MemTotal: 517208 kB

    MemFree:  9840 kB

    MemShared: 88676 kB

    Buffers:  10720 kB

    Cached:   80184 kB

    BigTotal: 0 kB

    BigFree:  0 kB

    SwapTotal: 265032 kB

    Swapfree: 222066 kB

    ```


    This shows 512MB physical memory, of which about 9MB is free, and 258MB of swap
    space, of which 216MB is free. The row corresponding to physical memory, three
    other values are presented:


    +   - The Shared column displays total shared memory currently allocated on the
    system (see Section 5.1, "Shared Memory")

    - The Buffers column displays the memory allocated by Linux for block device buffers.
    These buffers are used by device drivers to hold blocks of data being read from
    and written to disk.

    - The Cached column displays the memory allocated by Linux to the page cache.
    This memory is used to cache accesses to mapped files.


    You can use the free command to display the system memory information.


    # 7.5 Drives, Mounts, and File Systems


    The /proc/file system also contains information about the disk drives present
    in the system and the file systems mounted from them.


    # 7.5.1 File Systems


    The /proc/filesystems entry displays the file system types known to the kernel.
    Note that this list is not very useful because it is not complete: File systems
    can be loaded and unloaded dynamically as kernel modules. The contents of /proc/filesystems
    list only file system types that are either statically linked into the kernel
    or are currently loaded. Other file system types may be available on the system
    as modules but might not be loaded yet.'
