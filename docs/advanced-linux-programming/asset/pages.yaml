  md: '# 6.5 Special Devices 139


    # 6.5.5 Loopback Devices


    A loopback device enables us to simulate a block device using an ordinary disk
    file. Imagine a disk drive device for which data is written to and read from a
    file named disk-image rather than to the tracks and sectors of an actual physical
    disk drive or partition. (Of course, the file-image must reside on an actual disk,
    which must be larger than the simulated disk.) A loopback device enables you to
    use a file in this manner.


    Loopback devices are named /dev/loop0, /dev/loop1, and so on. Each can be used
    to simulate a single block device at one time. Note that only the superuser can
    set up a loopback device.


    A loopback device can be used in the same way as any other block device. In particular,
    you can construct a file system on the device and then mount it file system as
    you would mount the file system on an ordinary disk or partition. Such a file
    system, which resides in its entirety within an ordinary disk file, is called
    a virtual file system.'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'To construct a virtual file system and mount it with a loopback device, follow
    these steps:


    +   1. Create an empty file to hold the virtual file system. The size of the file
    will be the apparent size of the loopback device after it is mounted.


    One convenient way to construct a file of a fixed size is with the `dd` command.

    This command copies blocks (by default, 512 bytes each) from one file to another.
    The `/dev/zero` file is a convenient source of bytes to copy from.


    +   2. To construct a 10MB file named `disk-image`, invoke the following:

    ```bash

    ddd if=/dev/zero of=/tmp/disk-image count=20480

    20480+ records in

    20480+ records out

    ls -l /tmp/disk-image

    -rw-r--r-- 1 root 1048576 Mar 8 01:56 /tmp/disk-image

    ```


    The file you''ve created is filled with 0 bytes. Before you mount it, you must
    construct a file system. This sets up the various control structures needed to
    organize and store files, and builds the root directory.


    You can build any type of file system you like in your disk image. To construct
    an ext2 file system (the type most commonly used for Linux disks), use the `mke2fs`
    command. Because it''s usually run on a block device, not an ordinary file, it
    asks for confirmation:


    ```

    $ mke2fs -q /tmp/disk-image

    mke2fs 1.18, 11-Nov-1999 for EXT2 FS 0.5b, 95/08/09

    disk-image is not a block special device.

    ```

    ```


    Proceed anyway? (y,n) y

    The -q option suppresses summary information about the newly created file system.
    Leave this option out if you''re curious about it.


    Now `disk-image` contains a brand-new file system, as if it were a freshly initialized
    10MB disk drive.'
  merge: -1
