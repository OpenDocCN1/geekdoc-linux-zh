    # 2.1.4 Standard I/O


    The standard C library provides standard input and output streams (stdin and stdout,
    respectively). These are used by scanf, printf, and other library functions. In
    the UNIX tradition, use of input and output is customary for GNU/Linux programs.
    This allows the chaining of multiple programs using shell pipes and output redirection.


    The C library also provides stderr, the error stream. Programs print warning and
    error messages to stderr instead of standard output. This allows users to separate
    normal output and error messages, for instance, by redirecting standard output
    to a file while allowing standard error to print on the console. The fprintf function
    can be used to print to stderr, for example:


    ```

    fprintf(stderr, "Error: ...\n");

    ```


    These streams are all accessible with the underlying UNIX I/O commands (read,
    write, and so on) via file descriptors. These are file descriptors 0 for stdin,
    1 for stdout, and 2 for stderr.


    When invoking a program, it is sometimes useful to redirect both standard output
    and error to a file or pipe. The syntax for this varies among shells; for Bourne-style
    shells (including bash, the default shell on GNU/Linux distributions), the syntax
    is:


    +   % program > output_file.txt 2>&1

    % program 2>&1 | filter


    The 2>&1 syntax indicates that file descriptor 2 (stderr) should be merged into
    file descriptor1 (stdout). Note that 2>&1 must follow a redirection (the first
    example) but must precede a pipe (the second example).'
