  md: '# Chapter 5 Interprocess Communication


    Its second parameter specifies the number of bytes in the segment. Because segments
    are allocated using pages, the number of actually allocated bytes is rounded up
    to an integral multiple of the page size.


    The third parameter is the bitwise or flag value which specify options to shmget.
    The flag values include:


    +   * IPC_CREAT—This flag indicates that a new segment should be created. This
    creates a new segment while specifying a key value.

    * IPC_EXCL—This flag, which is always used with IPC_CREAT, causes shmget to fail
    if a segment already exists. Therefore, for the calling process to have an "exclusive"
    segment. If this flag is not given and the key of an existing segment is used,
    shmget returns the existing segment instead of creating a new one.

    * Mode flags—This value is made of 9 bits indicating permissions granted to owner,
    group, and world to control access to the segment. Execution bits are ignored.
    An easy way to specify permissions is to use the constants defined in <sys/stat.h>
    and documented in the section 2 stat man page. S_IRUSR and S_IWUSR read and write
    permissions for the owner of the shared memory segment, and S_IROTH and S_IWOTH
    read and write permissions for others.


    For example, this invocation of shmget creates a new shared memory segment (or
    access to an existing one, if shm_key is already used) that is readable and writable
    to the other user but not others.


    ```

    int shm_id = shmget(shm_key, getpagesize(),

    n              IPC_CREAT | S_IRUSR | S_IWUSR);

    ```


    If the call succeeds, shmget returns a segment. If the shared memory segment already
    exists, the permissions are verified and a check is made to ensure that the segment
    is not marked for destruction.


    # 5.1.4 Attachment and Detachment


    To make the shared memory segment available, a process must use shmat, "Shared
    Memory Attach." Pass it the shared memory segment identifier returned by shmget.
    The second argument is a pointer that specifies where in your process''s address
    space you want to map the shared memory; if you specify NULL, Linux will choose
    an available address. The third argument is a flag, which can include the following:


    +   * SHM_RDND indicates that the address specified for the second parameter should
    be rounded down to a multiple of the page size. If you do not specify this flag,
    you must page-align the second argument to shmat yourself.

    * SHM_RDONLY indicates that the segment will be only read-only, not writable.


    1. These permission bits are the same as those used for files. They are described
    in Section 10.3,"File System Permissions."'
