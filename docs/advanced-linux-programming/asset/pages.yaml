    # 7.2.6 Process Memory Statistics


    The statm entry contains a list of seven numbers, separated by spaces. Each number
    is a count of the number of pages of memory used by the process in a particular
    category. The categories, in the order the numbers appear, are listed here:


    +   * The total process size

    * The size of the process resident in physical memory

    * The memory shared with other processes—that is, memory mapped both by this process
    and at least one other (such as shared libraries or untouched copy-write pages)

    * The size of the process—that is, the size of loaded executable code

    * The size of shared libraries mapped into this process

    * The memory used by this process for its stack

    * The number of dirty pages—that is, pages of memory that have been modified by
    the program


    # 7.2.7 Process Statistics


    The status entry contains a variety of information about the process, formatted
    for comprehension by humans. Among this information is the process ID and parent
    ID, the real and effective user and group IDs, memory usage, and bit masks specifying
    which signals are caught, ignored, and blocked.


    # 7.3 Hardware Information


    Several of the other entries in the /proc file system provide access to information
    about the system hardware. Although these are typically of interest to system
    configurators and administrators, the information may occasionally be of use to
    application programmers as well. We''ll present some of the more useful entries
    here.'
