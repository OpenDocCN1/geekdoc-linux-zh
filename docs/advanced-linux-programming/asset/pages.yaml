  md: 'There is one important exception: Processes running as root (those with user
    ID 0) are always allowed to access any file, regardless of the permissions associated
    with it.


    # 10.3.1 Security Hole: Programs Without Execute Permissions


    Here''s a first example of where security gets very tricky. You might think that
    if you disallow execution of a program, nobody can run it. After all, that''s
    what it means to disallow execution. But a malicious user can make a copy of the
    program, change the permissions to make it executable, and then run the copy!
    If you rely on users not being able to run programs that aren''t executable but
    then don''t prevent them from copying the programs, you have a security hole—a
    means by which users can perform some action that you didn''t intend.


    # 10.3.2 Sticky Bits


    In addition to read, write, and execute programs, there is a magic bit called
    the sticky bit. This bit applies only to directories.


    A directory that has the sticky bit set allows you to delete a file if you are
    not the owner of the file. As mentioned previously, you can ordinarily delete
    a file if you have write access to the directory, even if you are not the file''s
    owner. When the sticky bit is set, you *still* must have write access to the directory,
    but you must also be the owner of the file that you want to delete.


    A few directories on the typical GNU/Linux system have the sticky bit set. For
    example, /tmp, in which any user can place temporary files, has the sticky bit
    set. This directory is specifically designed to be used by all users, so the directory
    must be writable by everyone. It would be bad if one user could delete another
    user''s files, so the sticky bit is set on the directory. Then only the owning
    user (or root, of course) can remove a file.


    You can see the sticky bit is set because of the t at the end of the permission
    bits when you run `ls /tmp`:


    ```

    $ ls -ld /tmp root 2048 Jan 24 17:51 /tmp

    ```


    The corresponding constant to use stat creates directories that behave like /tmp,
    in where lots of people put things there but shouldn''t be able to remove other''s
    files, then you should set the sticky bit on a directory with the chmod command
    by invoking the following:


    ```

    $ chmod o+t directory

    ```


    5 This name is anachronistic; it goes back a time when setting the sticky bit
    caused a program to be retained in main memory when it was doing execution. The
    pages allocated to the program were "stuck" in memory.'
