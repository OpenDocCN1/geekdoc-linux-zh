    # 9.5 Optimization Issues


    GCC''s optimizer attempts to rearrange and rewrite programs'' code to minimize
    execution time in the presence of asm expressions. If the optimizer determines
    that an asm''s output values are unused, the instruction will be omitted unless
    the keyword volatile occurs between asm and its arguments. (As a special case,
    GCC will not move an asm without output outside a loop.) Any asm can be moved
    in ways that are difficult to predict, even across jumps. The only way to guarantee
    a particular assembly ordering is to include all the instructions in the same
    asm. Using asm can restrict the optimizer''s effectiveness because the compiler
    does not know the asm''s semantics. GCC is forced to make conservative guesses
    that may prevent some optimizations. Caveat emptor!


    # 9.6 Maintenance and Portability Issues


    If you decide to use nonportable, architecture-dependent asm statements, encapsulating
    these statements in macros or functions can aid in maintenance and porting. Placing
    all these macros in one file and documenting them will ease portability to a different
    architecture, something that occurs with surprising frequency even for "temporary"
    programs. Thus, the programmer will need to rewrite only one file for the different
    architecture.


    For example, most asm statements in the Linux source code are grouped into /usr/src/linux/include/asm
    and /usr/src/linux/include/asm-i386 header files, and /usr/src/linux/arch/i386/
    and /usr/src/linux/drivers/ source files.'
