  md: '# Chapter 4 Threads


    A condition variable enables to implement a condition under which a thread executes,
    and inversely, the condition under which the thread is blocked. As long as every
    thread that potentially changes the sense of the condition uses the condition
    variable properly, Linux guarantees that threads blocked on the condition will
    be unblocked when the condition changes.


    As with semaphore, a thread may wait on a condition variable. If thread A waits
    on a condition, it is blocked until some other thread, B signals the same condition
    variable. Unlike a semaphore, a condition variable has no counter or memory; thread
    A must wait on the condition variable before thread B signals it. If thread B
    signals the condition variable before thread A waits on it, the signal is lost,
    and thread A blocks until some other thread signals the condition variable again.


    This is how you would use a condition variable to make the previous sample more
    efficient:


    +   - The loop in thread_function checks the flag. If the flag is not set, the
    thread waits on the condition variable.

    - The set_thread_flag signals the condition variable after changing the flag value.
    That is, if, thread_function is blocked on the condition variable, it will be
    unblocked and will check the condition again.


    There''s one problem with this: there''s a race condition between checking the
    flag value and signaling or waiting on the condition variable. Suppose that thread_function
    checked the flag and found that it was not set. At that moment, the Linux scheduler
    paused and resumed the main one. By some coincidence, the main thread is in set_thread_flag.
    It sets the flag and then signals the condition variable. Because no thread is
    waiting on the condition variable at the time (remember that thread_function was
    paused before it called the condition variable), the signal is lost. Now, when
    Linux reschedules the other thread, it starts waiting on the condition variable
    and ends up blocked forever.


    To solve this, we need to lock the flag and the condition variable together with
    a single mutex. Fortunately, GNU/Linux provides exactly this mechanism. Each condition
    variable must be used in conjunction with a mutex, to prevent this sort of race
    condition. Using this scheme, the thread follows these steps:


    +   - 1. The loop in thread_function locks the mutex and reads the flag value.

    - 2. If the flag is set, it unlocks the mutex and executes the work function.

    - 3. If the flag is not set, it atomically unlocks the mutex and waits on the
    condition variable.


    The critical feature here is in step 3, in GNU/Linux allows you to unlock the
    mutex and wait on the condition variable atomically, without the possibility of
    another thread intervening. This eliminates the possibility that another thread
    may change the flag value and signal the condition variable in between thread_function''s
    test of the flag value and wait on the condition variable.'
