  md: '# 10.2 Process User IDs and Process Group IDs 199


    # 10.1.1 The Superuser


    One user account is very special. This user has user ID 0 and usually has the
    username root. It is also sometimes referred to as the superuser account. The
    root user can do just anything: read any file, remove any file, add new users,
    turn off network access, and so forth. Lots of special operations can be performed
    by processes running with root privilege—that is, running as user root.


    The trouble with this design is that a lot of programs need to be run by root
    because a lot of programs need to perform one of these special operations. If
    any of these programs behaves, chaos can result. There''s no effective way to
    contain a program when it is by root; it can do anything. Programs run by root
    must be written carefully.


    # 10.2 Process User IDs and Process Group IDs


    Until now, we''ve talked about commands being executed by a particular user. That''s
    not quite accurate because the computer never knows who is using it. If Eve Alice''s
    username and password, then Eve can log in as Alice, and the computer will let
    Eve do everything Alice can. The system knows only which user is in use, not who
    is typing the commands. If Alice cannot be trusted to keep her password, for example,
    nothing you do as an application developer will prevent Eve from accessing Alice''s
    files. The responsibility for system security is shared among the developer, the
    users of the system, and the administrators of the system.


    Every process has an associated user ID and group ID. When you invoke a command,
    it typically runs in a process whose user and group IDs are the same as your user
    and group IDs. When we say that a user performs an operation, we really mean that
    a process with the corresponding user ID performs that operation. When the process
    makes a system call, the kernel decides whether the operation to proceed. It makes
    that determination by examining the parameters associated with the resources that
    the process is trying to access and by checking the user ID and group ID associated
    with the process performing the action.


    Now you know what that middle field provided by the id command is all about it.
    It''s showing the group ID of the current process. Even though user 501 is in
    multiple groups, the current process can have only one group ID. In the example
    previous, the current group ID is 501.


    If you have to manipulate user IDs and group IDs in your program (and you will,
    if you''re writing programs that deal with security), you should use the uid_t
    and gid_t types defined in <sys/types.h>. Even though user IDs and group IDs are
    essentially integers, avoiding any assumptions about how many bits are used in
    these types or perform arithmetic operations on them. Just treat them as opaque
    handles for user and group identity.


    +   1. The fact that there is only one special user AT&T the name for the UNIX
    operating system. In contrast, an earlier operating system that had multiple special
    users was called MULTICS. GNU/Linux, of course, is mostly compatible with UNIX.'
  merge: -1
