    # A.3.2 Collecting Profiling Information


    The first step in profiling a program is to annotate its executable to collect
    profiling information. To do so, use the -pg compiler flag when both compiling
    the object files and linking. For example, consider this:


    ```

    % gcc -pg -c -o calculator.o calculator.c

    % gcc -pg -c -o stack.o stack.c

    % gcc -pg -c -o number.o number.c

    % gcc -pg -o number.o number.o -o calculator

    ```


    This enables collecting information about function calls and timing information.
    To collect line-by-line use information, also specify the debugging flag -g. To
    count basic block executions, such as de-loop iterations, use -a.


    The second step is to run the program. While it is running, profiling data is
    collected into a file named gmon.out, only for those portions of the code that
    are executed. You must vary the program''s input or commands to exercise the sections
    you want to profile. The program must terminate normally for the profiling file
    to be written.


    # A.3.3 Displaying Profiling Data


    Given the name of an executable, gprof analyzes the gmon.out file to display information
    about how much time each function executed. For example, consider the "flat" profiling
    data for computing 1787 x 13 - 1918 using our calculator program, which is produced
    by executing gprof ./calculator:


