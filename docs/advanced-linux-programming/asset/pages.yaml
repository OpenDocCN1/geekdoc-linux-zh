  md: "# Chapter 3 Processes\n\nA zombie process is a process that has terminated\
    \ but has not been cleaned up yet. It is the responsibility of the parent process\
    \ to clean up its zombie children. The wait functions do this, too, it's not necessary\
    \ to track whether your child process is still executing before waiting for it.\
    \ Suppose, for instance, a program forks a child process, performs some computations,\
    \ and then calls wait. If the child process has not terminated at that point,\
    \ the parent process will block in the wait call until the child process finishes.\
    \ If the child process finishes before the parent process calls wait, the child\
    \ process becomes a zombie. When the parent calls wait, the child's termination\
    \ status is extracted, the child process is deleted, and the wait call returns\
    \ immediately.\n\nWhat happens if the parent does not clean up its children? They\
    \ stay around in the system, as zombie processes. The program in Listing 3.6 forks\
    \ a child process, which terminates immediately and then sleeps for a minute,\
    \ without ever cleaning up the process.\n\nListing 3.6 (zombie.c) Making a Zombie\
    \ Process\n\n```\n#include <stdio.h>\n#include <sys/types.h>\n#include <unistd.h>\n\
    \nint main () {\n    pid_t child_pid;\n\n    /* Create a child process. */\n \
    \   child_pid = fork (\n    if (child_pid > 0) {\n        /* This is the parent\
    \ process. Sleep for a minute. */\n        sleep (60);\n    } else {\n       \
    \ /* This is the child process. Exit immediately. */\n        exit (0);\n    }\n\
    \    return 0;\n}\n```\n\nCompiling this file to an executable named make-zombie.\
    \ Run it, and while it's still running, list the processes on the system by invoking\
    \ the following command in another window:\n\n```\n$ ps -e -o pid,ppid,stat,cmd\n\
    ```"
