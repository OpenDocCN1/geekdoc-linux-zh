  md: '118 Chapter 5 Interprocess Communication


    # Creating and Destroying Sockets


    The socket and close functions create and destroy sockets, respectively. When
    you create a socket, specify the three socket choices: namespace, communication
    style, and protocol. For the namespace parameter, use constants beginning with
    PF_(abbreviating "protocol families"). For example, PF_LOCAL or PF_UNIX specifies
    the local namespace, and PF_INET Internet namespaces. For the communication style
    parameter, use constants beginning with SOCK_. Use SOCK_STREAM for a connection-style
    socket, or SOCK_DGRAM for a datagram-style socket.


    The third parameter, the protocol, specifies the low-level mechanism to transmit
    and receive data. Each protocol is valid for a particular namespace-style combination.
    Because there is usually one best protocol for each socket, specifying 0 is usually
    the correct protocol. If socket succeeds, it returns a file descriptor for the
    socket. You can read from or write to the socket using read, write, and so on,
    with other file descriptors. When you are finished with a socket, call close to
    remove it.


    # Calling connect


    To create a connection between two sockets, the client calls connect, specifying
    the address of a server socket to connect to. A client is the process initiating
    the connection, and a server is the process waiting to accept connections. The
    client calls connect to initiate a connection from a local socket to the server
    socket specified by the second argument. The third argument is the length, in
    bytes, of the address structure pointed to by the second argument. Socket address
    formats differ according to the socket namespace.


    # Sending Information


    Any technique to write to a file descriptor can be used to write to a socket.
    See Appendix B for a discussion of Linux''s low-level I/O functions and the send
    function, which is specific to the socket file descriptors, provides an alternative
    to write with a few additional choices; see the man page for information.


    # 5.5.3 Servers


    A server''s life cycle consists of the creation of a connection-style socket,
    binding an address to its socket, calling a to listen that enables connections
    to the socket, placing calls to accept incoming connections, and then closing
    the socket. Data isn''t read and written directly via the server socket; instead,
    each time a program accepts a new connection, Linux creates a separate socket
    to use in transferring data over that connection. In this section, we introduce
    bind, listen, and accept.'
