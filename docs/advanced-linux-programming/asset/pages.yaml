  md: 'While issue sends the contents of a file using sendfile, this module must invoke
    a command and redirect its output to the client. To do this, the module follows
    these steps:


    +   1. First, the module creates a child process using fork (see Section 3.2.2,"Using
    fork and exec,") in Chapter 3).


    +   2. The child process copies the client socket file descriptor to file descriptors
    STDOUT_FILENO and STDERR_FILENO, which correspond to standard output and standard
    error (see Section 2.1.4,"Standard I/O," in Chapter 2). The file descriptors are
    copied using the dup2 call (see Section 5.4.3,"Redirecting the Standard Input,
    Output, and Error Streams," in Chapter 5). All further output from the process
    to these streams is sent to the client socket.


    +   3. The child process invokes the `df` command with the `-h` option by calling
    execv (see Section 3.2.2,"Using fork and exec,") in Chapter 3).


    +   4. The parent process waits for the child process to exit by calling waitpid
    (see Section 3.4.2,"the System Calls," in Chapter 3).


    You could easily adapt this module to invoke a different command to redirect its
    output to the client.


