  md: '# 262 Appendix A Other Development Tools


    Table A.1 Capabilities of Dynamic Memory-Checking Tools (X Indicates Detection,
    and O Indicates Detection for Some Cases)


    | Erroneous Behavior | malloc Checking | mtrace | cmalloc | Electric Fence |

    |---|---|---|---||}{

    | Read before allocating memory | | | | |

    | Write before beginning of allocation | | | | X |

    | Read before beginning of allocation | O | | O | X |

    | Read after end of allocation | | | | X |

    | Write after end of allocation | | | X | X |

    | Read after deallocation | | | | X |

    | Write after deallocation | | | | X |

    | Failure to deallocate memory | | X | X | |

    | Deallocating memory twice | X | | X | |

    | Deallocating nonallocated memory | | X | X | |

    | Zero-size memory allocation | | | | X | X |


    In the sections that follow, we first describe how to use the more easily used
    malloc checking and mtrace, and then cmalloc and Electric Fence.


    # A.2.1 A Program to Test Memory Allocation and Deallocation


    We''ll use the malloc-use program in Listing A.2 to illustrate memory allocation,
    de-location, and use. To begin running it, specify the maximum number of allocated
    memory regions as its only command-line argument. For example, malloc-use 12 creates
    an array A 12 character pointers that do not point to anything. The program accepts
    five different commands:


    +   * To allocate b bytes by array A[i], enter i b. The array index can be any
    non-negative number smaller than the command-line argument. The number of bytes
    must be non-negative.

    * Toallocate memory at index i, enter d i.

    * To read the pth character from the allocated memory at index i (as in A[i][p]),
    enter i p. Here, p can have an integral value.

    * To write a character to the pth position in the allocated memory at index i,
    enter w i.

    * When finished, enter q.


    We''ll present the program''s code later, in Section A.2.7, and illustrate how
    to use it.'
