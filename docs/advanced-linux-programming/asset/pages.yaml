  md: "# Chapter 1 Getting Started\n\nYou can convey all that information to make\
    \ by putting the information in a file named Makefile contains:\n\n```\ntarget:\
    \ dependencies\nreciprocal: main.o reciprocal.o\n\tg++ $(CFLAGS) -o reciprocal\
    \ main.o reciprocal.o rule\n```\n\n```\nmain.o: main.c reciprocal.hpp\ntgcc $(CFLAGS)\
    \ -c main.c\n```\n\n```\nreciprocal.o: reciprocal.cpp reciprocal.hpp\ntgcc $(CFLAGS)\
    \ -c reciprocal.cpp\n```\n\n```\nclean:\n\tmrm -f *. reciprocal\n```\n\nYou can\
    \ see that targets are listed on the left, followed by a colon and then any dependencies.\
    \ The rule to build that target is on the next line. (Ignore the $(CFLAGS) bit\
    \ for the moment). The line with the rule on it must start with a Tab character,\
    \ or make will get confused. If you edit your Makefile in Emacs, Emacs will help\
    \ you with the formatting.\n\nIf you remove the object files that you've already\
    \ deleted, and just\n% make\n\non the command-line, you'll see the following:\n\
    \n```\n% make\ngcc -c main.c\ngcc -c reciprocal.cpp\ng++ -o reciprocal main.o\n\
    ```\n\nYou can see that make has automatically built the object files and then\
    \ linked. If you now change main.c in some trivial way and type make again, you'll\
    \ see the following:\n\n```\n% make\ngcc -c main.c\ng++ -o reciprocal main.o\n\
    ```\n\nYou can see that make it knew to rebuild main.o and to re-link the program,\
    \ but it didn't have to recompile reciprocal.cpp because none of the dependencies\
    \ for reciprocal.o had changed.\n\nThe $(CFLAGS) is a variable. You can define\
    \ this variable either in the Makefile itself or on the command line. GNU make\
    \ will substitute the value of the variable when it executes the rule. for example,\
    \ to recompile with optimization enabled, you would do:\n\n```\n% make clean\n\
    rm -f *. reciprocal\nmake CFLAGS=-02\ngcc -02 -c main.c\ng++ -02 -c reciprocal.cpp\n\
    g++ -02 -o reciprocal main.o reciprocal\n```"
