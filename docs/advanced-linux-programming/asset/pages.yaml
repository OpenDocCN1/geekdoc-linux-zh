    # 2.1.6 The Environment


    GNU/Linux provides each running program with an environment.The collection of
    variable/value pairs. Both environment variable names and their values are character
    strings. By convention, environment variable names are spelled in all capital
    letters.


    You''re probably familiar with several common environment variables already. For
    instance:


    +   * USER contains your username.

    * HOME contains the path to your home directory.

    * PATH contains a comma-separated list of directories through which Linux searches
    for commands you invoke.

    * DISPLAY contains the name and display number of the X-Window server on which
    windows from graphical X Window programs will appear.


    Your shell, like any other program, has an environment. Shells provide methods
    for examining and modifying the current environment in your shell, like the printenv
    program. Various shells have built-in different de-facto syntax for using environment
    variables; the following is the syntax for Bourne-style shells.


    +   * The shell automatically creates a shell variable for each environment variable
    that it finds, so you can access environment variable values using the $variable
    syntax. For instance:

    ```bash

    echo $USER

    samuel

    echo $HOME

    /home/samuel

    ```


    +   * You can use the export command to export a shell variable into the environment.
    For example, to set the EDITOR environment variable, you would use this:

    ```bash

    % EDITOR=emacs

    % export EDITOR

    ```


    Or, for short:


    ```

    ```bash

    % export EDITOR=emacs

    ```

    ```'
