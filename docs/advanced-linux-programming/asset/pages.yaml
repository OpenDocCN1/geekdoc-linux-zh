  md: '# Chapter 1 Getting Started


    Sometimes you''ll want to define macros on the command line. For example, in production
    code, you don''t want the overhead of the assertion check present in reciprocal.cpp;
    that''s only there to help you debug the program. You turn off the check by defining
    the macro NDEBUG. You could add an explicit #define to reciprocal.cpp, but that
    would require changing the source itself. It''s easier to simply define NDEBUG
    on the command line, like:


    ```

    g++ -c D NDEBUG reciprocal.cpp

    ```


    If you wanted to define NDEBUG to some particular value, you could have done something
    like this:


    ```

    g++ -c D NDEBUG=3 reciprocal.cpp

    ```


    If you''re really building production code, you probably want to have GCC optimize
    the code so it runs as quickly as possible. You can do this by using the -02 command-line
    option. GCC has several levels of optimization; the second level is appropriate
    for most programs. For example, the following compiles reciprocal.cpp with optimization
    turned on:


    ```

    g++ -c -02 reciprocal.cpp

    ```


    Note that compiling with optimization can make your program more difficult to
    debug with a debugger (see Section 1.4,"Debugging in GDB"). Also, in certain instances,
    compiling with optimization can uncover bugs in programs that did not manifest
    themselves previously.


    You can pass lots of other options to gcc and g++. The best way to get a complete
    list is to view the online documentation. You can do this by typing the following
    at your command prompt:


    ```

    % info gcc

    ```


    # 1.2.2 Linking Object Files


    Now that you''ve compiled main.c and utilities.cpp, you''ll want to link them.
    You should always use g++ to link a program that contains C++ code, even if it
    also contains C code. If your program contains only C code, you should use gcc
    instead. Because this program contains both C and C++, you should use g++, like
    this:


    ```

    % g++ -o reciprocal main.o reciprocal.o

    ```


    The -o option gives the name of the file to generate as output from the link step.
    You can now run reciprocal like this:


    ```

    ./reciprocal 7

    ```


    The reciprocal of 7 is 0.142857


    As you can see, g++ has automatically linked the Standard C runtime library containing
    the implementation of printf. If you had needed to link in another library (such
    as a graphical user interface toolkit), you would have specified the library with'
