  md: '# 210 Chapter 10 Security


    This program starts off by building up a PAM conversation object. This object
    is used by the PAM library whenever it needs to prompt the user for information.
    The `_misc_conv` function used in this example is a standard conversation function
    that uses the terminal for input and output.


    The program calls `pam_start`. This function initializes the PAM library. The
    first argument is a name that uniquely identifies your application. For example,
    if your application is named whizbang, you should probably use that for the service
    name, too. However, the program probably won''t work unless the system administrator
    explicitly configures the system to work with your service. So, in this example,
