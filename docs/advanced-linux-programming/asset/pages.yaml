    \ by DOS or Windows programs. It's important to anticipate important difference\
    \ in how text files are structured between these two platforms.\n\nIn GNU/Linux\
    \ editors, each line is separated from the next with a newline character. A newline\
    \ is represented by the character constant '\\n', which has ASCII code 10. However,\
    \ lines are separated by a two-character combination: a carriage return (the character\
