  md: '# Advanced Linux Programming


    Content Highlights:


    +   - Getting Started with GNU/Linux Development Tools

    - Navigating GNU/Linux Documentation

    - GNU/Linux Command-Line Conventions

    - Coding Defensively

    - Creating and Using Shared Libraries

    - Handling Processes Termination

    - Advanced GNU/Linux Thread Features

    - Processes vs. Threads

    - Using Shared Memory

    - Allocation via Mapped Memory

    - A Tour of the /dev File System

    - Using Loopback Devices

    - The Contents of /dev/pts

    - Extracting Process Info from /proc

    - Linux-Specific Entries in /proc

    - Linux System Calls

    - Using Inline Assembly with GCC

    - The Linux User Model

    - Introduction to Application Security

    - Dynamic Memory Checking Tools


    Back when we first started programming for the GNU/Linux environment, we had to
    learn the hard way—by browsing many pages, online documentation, and the Linux
    source code looking for the features we needed. We wished for a book that provided
    a road map of Linux''s capabilities and quirks that manifested themselves in real-world
    programs. Now that we know our way around, we''ve written this book to help the
    next generation of GNU/Linux learn the advanced features and techniques that are
    often employed by professional developers for this platform.


    —CodeSource


    > As Linux becomes a more mainstream player in the internet infrastructure market,
    there is a tremendous need for lucid programming texts that also convey some of
    the philosophy behind the Linux and GNU movements. This book does an incredible
    job of covering all that. I think it will be a standard against which other introductory
    programming texts for UNIX (and all with respect to Richard Stevens, possibly
    UNIX) will be measured.

    Adam Goodman, Publisher, Linux Magazine


    ![](img/c4e64f1f40e77d2bb7fe9245699d2ea5_1_0.png)'
