  md: '# 208. Chapter 10 Security


    Note that the effective user ID is set to 0 when the program is run.


    You can use the chmod command with the u+s or g+s arguments to set the setuid\and
    setgid bits on an executable file, respectively—for example:


    ```

    % ls -l program

    -rwxr-xr-x 1 samuel  csl      @ Jan 30 23:38 program

    % chmod g+s program

    % ls -l program

    -rwxr-sr-x 1 samuel  csl      @ Jan 30 23:38 program

    % chmod u+s program

    % ls -l program

    -rwsrxr-x 1 samuel  csl      @ Jan 30 23:38 program

    ```


    You can also use the chmod call with the S_ISUID or S_ISGID mode flags.

    is su capable of changing the effective user ID through this mechanism. It runs

    initially with an effective user ID of 0. Then it prompts you for a password.
    If the

    password matches the root password, it sets its real user ID to be root as well

    and starts a new shell. Otherwise, it unceremoniously leaves you as a non-privileged
    user.

    Take a look at the permissions on the su program:


    ```

    % ls -l /bin/su

    -rwxr-xr-x 1 root      14188 Mar 7 2000 /bin/su

    ```


    Notice that it''s owned by root and that the setuid bit is set.


    > Note that it doesn''t actually change the user ID of the shell from which it
    is run. Instead, it starts a new shell process with the new user ID. The original
    shell is is blocked until the new shell completes and su exits.


    # 10.5 Authenticating Users


    Often, if you have a setuid program, you probably don''t want to offer its services
    to everyone. For example, the su program lets you become root only if you know
    the root password. The program you make proves you are entitled to become root
    before going ahead with its actions. This process is called authentication—the
    su program is checking to see that you are authentic.

    If you are administering a very secure system, you probably don''t want to let
    people log in by just typing an ordinary password. Users tend to write down passwords,
    and black hats might involve their birthdays, the names of their pets, and so
    forth. Passwords just aren''t all secure.


    +   7. It has been found that system administrators tend to pick the word god
    as their password more often than any other password. (Make of that what you will.)
    So, if you ever need rootnaccess on a machine and the sysadmin isn''t around,
    a little divine inspiration might be just what you need.'
