  md: '# 4.4 Synchronization and Critical Sections 89


    A condition variable is represented by an instance of pthread_cond_t. Remember
    that each condition variable should be accompanied by a mutex. These are the functions
    that manipulate condition variables:


    +   - pthread_cond_init initializes a condition variable. The first argument is
    a pointer to a pthread_cond_t instance. The second argument, a pointer to a condition
    variable attribute object, is ignored under GNU/Linux.

    The mutex must be initialized separately, as described in Section 4.4.2, "Mutexes."

    - pthread_cond_signal signals a condition variable. A single thread that is blocked
    on the condition variable will be unlocked. If no other thread is blocked on the
    variable, the signal is ignored. The argument is a pointer to the pthread_cond_t
    instance.

    - A similar call, pthread_cond_broadcast, unblocks all threads that are blocked
    on the condition variable, instead of just one.

    - pthread_cond_wait waits the calling thread until the condition variable is signaled.
    The argument is a pointer to the pthread_cond_t instance. The second argument
    is a pointer to the pthread_mutex_t mutex instance.

    When pthread_cond_wait is called, the mutex must be locked by the calling thread.
    That function atomically unlocks the mutex and blocks on the condition variable.
    When the condition variable is signaled and the calling thread unblocks, pthread_cond_wait
    automatically reacquires a lock on the mutex.


    Whenever your program performs an action that may change the sense of the condition
    you''re protecting with the condition variable, it should perform these steps.
    (In our example, the condition is the state of the thread flag, so these steps
    must be taken whenever the flag has changed.)


    +   1. Lock the mutex accompanying the condition.

    2. Take the action that may change the sense of the condition (in our example,
    the flag).

    3. Signal or broadcast the condition variable, depending on the desired behavior.

    4. Unlock the mutex accompanying the condition variable.


    Listing 4.14 shows the previous example again, now using a condition variable
