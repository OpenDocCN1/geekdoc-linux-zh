  md: 'To optimize packing of data into packets, we use a single call to writev instead
    (see Section B.3, "Vector Reads and Writes," in Appendix B). To do this, we must
    construct an array of struct iovec objects, because we do not know the number
    of processes beforehand, we must start with a small array and expand it as new
    processes are added. The variable vec_length contains the number of elements that
    are used, while vec_size contains the allocated size of vec. When vec_length is
    about to exceed vec_size, we expand vec to twice its size by calling realloc.
    When we''re done with the vector write, we must deallocate all of the dynamically
    allocated strings pointed to by vec and then itself.


    # 11.4 Using the Server


    If we were planning to distribute this program in source form, maintain it on
    an ongoing basis, or to other platforms, we would probably want to package it
    using GNU Automake and GNU Autoconf, or a similar configuration automation system.
    Such tools are outside the scope of this book; for more information about them,
    consult GNU Autoconf, Automake, and Libtool (by Vaughan, Tromey, and Taylor, published
    by New Riders, 2000).


    # 11.4.1 The Makefile


    Instead of Autoconf or a similar tool, we provide a simple Makefile compatible
    with GNU Make so that it''s easy to compile and link the server and its modules.
    The Makefile is shown in Listing 11.10. See the info page for GNU Make for details
    of the file''s syntax.


    Listing 11.10 (Makefile) GNU Make Configuration File for Server Example


    ```

    ### Configuration. options.

    ################################################################


    # Default C compiler options.

    CFLAGS           = -Wall -g

    # C source files for the server.

    SOURCES         = server.c module.c common.c main.c

    # Corresponding object files.

    OBJECTS         = $(SOURCES).o

    # Server module shared library files.

    MODULES         = diskfree.so issue.so processes.so time.so


    ################################################################


    # Rules.


    # Phony targets don''t correspond to files that are built; they''re renames

    # for conceptual build targets.

    .PHONY           all clean

    ```


    4. GNU Make comes installed on GNU/Linux systems.'
