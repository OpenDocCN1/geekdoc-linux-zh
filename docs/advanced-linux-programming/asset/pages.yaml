  md: '# 11.4.2 Building the Server


    Building the program is easy. From the directory containing the sources, simply
    invoke make:


    ```

    % make

    cc -Wall -g -o server.c

    cc -Wall -g -o module.c

    cc -Wall -g -o common.c

    cc -Wall -g -Wl,-export-dynamic -o server.o module.o main.o -l1

    cc -Wall -g -fPIC -shared diskfree.so

    cc -Wall -g -fPIC -shared issue.so

    cc -Wall -g -fPIC -shared processes.so

    cc -Wall -g -fPIC -shared -o time.so time.c

    ```


    This builds the server program and the server shared libraries.


    ```

    % -l server *. 1 samuel samuel 25769 Mar 11 01:15 diskfree.so

    -rwkr-XR-X 1 samuel samuel 31184 Mar 11 01:15 issue.so

    -rwkr-XR-X 1 samuel samuel 41579 Mar 11 01:15 processes.so

    -rwkr-XR-X 1 samuel samuel 71758 Mar 11 01:15 server

    -rwkr-XR-X 1 samuel samuel 13980 Mar 11 01:15 time.so

    ```


    # 11.4.3 Running the Server


    To run the server, simply invoke the server executable. With the --port (-p) option,
    Linux will choose one for you; in this case, specify --verbose (-v) to make the
    server print out the port number in use.


    If you do not specify an address with --address (-a), the server runs on all of
    your computer''s addresses. If your computer is connected to a network, that means
    that others will be capable of accessing the server, provided that they know the
    correct port number to use and request. For security reasons, it''s a good idea
    to specify the localhost address unless you''re confident that the server works
    correctly and not releasing any information that you prefer not to make public.
    Binding to the localhost causes the server to bind to the local network device
    (designated "lo")—only programs running on the same computer can connect to it.
    If you specify a different address, it must be an address that corresponds to
    your computer:


    ```

    $ ./server --address localhost -port 4000

    ```


    The server is now running. Open a browser window, and attempt to contact the server
    at this port number. Request a page whose name matches one of the modules. For
    instance, invoke the diskfree.so module, using this URL:


    ```

    http://localhost:4000/diskfree

    ```'
