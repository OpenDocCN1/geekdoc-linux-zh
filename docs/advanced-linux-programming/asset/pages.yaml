  md: '# Advanced Linux Programming


    Advanced Linux Programming is intended for the programmer already familiar with
    the C programming language. Authors Alex Samuel, Jeffrey Oldham, and Mark Mitchell
    of CodeSource, take a tutorial approach and teach the most important concepts
    and techniques for powerful features of the GNU/Linux system in application programs.


    If you''re a developer experienced with programming for the GNU/Linux system,
    and are interested in development in GNU/Linux software, or want to make the transition
    from a non-UNIX environment and are already familiar with the general principles
    of writing good software, this book is for you. In addition, you will find that
    this book is equally comparable to C and C++ programming. Even those programming
    in other languages will find this book useful since the *lingua franca* of GNU/Linux.


    If you are a developer for the GNU/Linux system, this book will help you to:


    +   Develop GNU/Linux software that works the way users expect it to


    +   Write more sophisticated programs with features such as multi-threading, interprocess
    communication, and interaction with hardware devices


    +   Improve your devices by making them run faster, more reliably, and more securely


    +   Understand the peculiarities of the GNU/Linux system, including its limitations,
    special capabilities, and conventions


    > CodeSource''s mission is to provide development tools for GNU/Linux and other
    operating systems, to make the GNU tool chain a commercial-quality, standards-forming
    tool set, and to provide general engineering services. CodeSource''s Web site
    is at www.codesource.com.


    CodeSource, based in Granite Boy, California, brings together people to work on
    programming tools and other challenging technologies. A recognized leader in the
    development of the GNU C and C++ compilers, CodeSource also develops new UNIX
    development tools and contributes to the development of open-source software,
    in addition to contract contract software development and support services.


    This edition is for sale in the following: INDIA, BANGLADESH, PAKISTAN, SRI LANKA
    AND MALDIVES.


