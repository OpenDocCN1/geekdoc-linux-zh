    Linux provides a corresponding function readv that reads in a single operation
    into multiple discontinuous regions of memory. Similar to writev, an array of
    iovec elements specifies the memory regions into which the data will be read from
    the file descriptor.


    # B.4 Relation to Standard C Library I/O Functions


    We mentioned earlier that the standard C library I/O functions are implemented
    on top of these low-level I/O functions. Sometimes, it''s tough to use standard
    library functions with file descriptors, or to use low-level I/O functions on
    a standard library FILE* stream. GNU/Linux enables you to do both.


    If you''ve opened a file using fopen, you can open the underlying file descriptor
    using the fileno function. This takes a FILE* argument and returns the file descriptor.
    For example, to open a file with the standard library open call but to write it
    with writev, you could use this code:


    ```

    FILE* stream = fopen (filename, "w*");

    int file_descriptor = fileno (stream);

    write (file_descriptor, vector, vector_length);

    ```


    Note that stream and file_descriptor correspond to the same opened file. If you
    call this line, you may no longer write to file_descriptor:


    ```

    close (stream);

    ```


    Similarly, if you call this, you may no longer write to stream:

    close (file_descriptor);


    To go the other way, from a file descriptor to a stream, use the fdopen function.
    This constructs a FILE* stream pointer corresponding to a file descriptor. The
    fdopen function takes a file descriptor argument and a string argument specifying
    the mode in'
