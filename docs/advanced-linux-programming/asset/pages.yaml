    # 8.13 setimer: Setting Interval Timers


    The setimer system call is a generalization of the alarm call. It schedules the
    delivery of a signal at some point in the future after a fixed amount of time
    has elapsed. A program can set three different types of timers with setimer:


    +   - If the timer code is ITIM_REAL, the process is sent a SIGALM signal after
    the specified wall-clock time has elapsed.

    - If the timer code is ITIM_VIRTUAL, the process is sent a SIGVTARM signal after
    the process has executed for the specified time. Time in which the process is
    not executing (that is, when the kernel or other process is running) is not counted.

    - If the timer code is ITIM_PROF, the process is sent a SIGPROF signal when the
    specified time has elapsed either during the process''s execution or the execution
    of a system call on behalf of the process.


    The first argument to setimer is the timer code, specifying which timer to set.
    The second argument is a pointer to a struct itimerval object specifying the new
    settings for the timer. The third argument, if not null, is a pointer to another
    struct itimerval object that receives the old timer settings.


    A struct itimerval variable has two fields:


    +   - it_value is a struct timeval field that contains the time until the timer
    next expires and a signal is sent. If this is 0, the timer is disabled.

    - it_interval is another struct timeval field containing the value to which the
    timer will be reset after it expires. If this is 0, the timer will be disabled
    after it expires. If this is nonzero, the timer is set to expire repeatedly after
    this interval.


    The struct timeval type is described in Section 8.7,"gettimeimeofday: Wall-Clock
    Time."


    The program in Listing 8.11 illustrates the use of setimer to track the execution
    time of a program. A timer is configured to expire every 250 milliseconds and
    sends a SIGVTARM signal.


