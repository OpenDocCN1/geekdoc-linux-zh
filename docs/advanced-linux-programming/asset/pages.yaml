  md: "Chapter 2 Writing Good GNU/Linux Software\n\n# 2.1.3 Using getopt_long\n\n\
    Parsing command-line options is a tedious chore. Luckily, the GNU C library provides\
    \ a function you can use in C and C++ programs to make this job somewhat easier\
    \ (although still a bit finicky). This function, getopt_long, understands both\
    \ short and long options. If you use this function, include the header file `<getopt.h>`.\n\
    \nSuppose, for example, you are writing a program that is to accept the three\
    \ options shown in Table 2.1.\n\n| Short Form | Long Form | Purpose |\n| --- |\
    \ --- | --- |\n| -h | --help | Display usage summary and exit |\n| -o filename\
    \ | --output filename | Specify output filename |\n| -v | --verbose | Print verbose\
    \ messages |\n\nIn addition, the program is to accept one or more command-line\
    \ arguments, which are the names of input files.\n\nTo use getopt_long, you must\
    \ provide two data structures. The first is a character string containing the\
    \ valid short options, each a single letter. An option that requires an argument\
    \ is followed by a colon. For your program, the string no: indicates that the\
    \ valid options are -h, -o, and -v, with the second of these two options followed\
    \ by an argument.\n\nTo specify the long options, you construct an array of struct\
    \ option elements. Each element corresponds to one long option and has four fields.\
    \ In circumstances, the first field is the name of the option (as a character\
    \ string, with the two hyphens); the second is 1 if the option takes an argument,\
    \ or 0 otherwise; the third is NULL; and the fourth is a constant signifying the\
    \ short option synonym for that long option. The last element of the array should\
    \ be all zeros. You could construct it like this:\n\n```\nconst struct option\
    \ long_options[] = {\n  {'help', 0, NULL, 'h'},\n  {'output', 1, NULL, 'o'},\n\
    \  {'verbose', 0, NULL, 'v'},\n  {NULL, 0, NULL, 0}\n};\n```\n\nYou invoke the\
    \ getopt_long function, passing the arg and argv arguments to `main`, the character\
    \ string describing short options, and the array of struct option elements describing\
    \ the long options.\n\n+   * Each time you call getopt_long, it parses a single\
    \ option, returning the shortoption letter for that option, or -1 if no more options\
    \ are found.\n* Typically, you'll call getopt_long in a loop, to process all the\
    \ options the user has specified, and you will handle the specific options in\
    \ a switch statement."
