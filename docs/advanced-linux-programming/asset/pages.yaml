  md: "# 10.5 Authenticating Users 209\n\nFor example, many organizations now require\
    \ the use of special \"one-time\" passwords that are generated by special electronic\
    \ ID cards that users keep with them. The same password cannot be used twice,\
    \ and you can't get a valid password out of the ID card without entering a PIN.\
    \ So, an attacker must obtain both the physical card and the PIN. In a secure\
    \ facility, retinal scans or other kinds of biometric testing are used.\n\nIf\
    \ you're writing a program that must perform authentication, you should allow\
    \ the system administrator to use whatever means of authentication is appropriate\
    \ for installation. GNU/Linux comes with a very useful library that makes this\
    \ very easy. This facility, called Pluggable Authentication Modules, or PAM, makes\
    \ it easy to write applications that authenticate the users as the system administrator\
    \ sees fit.\n\nIt's easiest to see how PAM works by looking at a simple PAM application.\
    \ Listing 10.4 illustrates the use of PAM.\n\n# Listing 10.4 (pam.c) PAM Example\n\
    \n```\n#include <security/pam_app.h>\n#include <security/pam_misc.h>\n#include\
    \ <stdio.h>\n\nint main () {\n    pam_handle_t * pamc;\n    struct pam_conv pamc;\n\
    \n    /* Set up the PAM conversation. */\n    pamc.conv = &convc_ptr = NULL;\n\
    \    pamc.appdata_ptr = NULL;\n    /* Start a new authentication session. */\n\
    \    pam_start(\"su\", \"USER\", &pamc, &pamic);\n    /* Authenticate the user.\
    \ */\n    if (pam_authenticate(pamic, 0) != PAM_SUCCESS)\n        fprintf(stderr,\
    \ \"Authentication failed!\\n\");\n    else\n        fprintf(stderr, \"Authentication\
    \ OK.\\\\n\");\n    /* All done. */\n    pam_end(pamic, 0);\n    return 0;\n}\n\
    ```\n\nTo compile this program, you have to link it with two libraries: the libpam\
    \ library and a helper library called libpam_misc\n\n```\n% gcc -o pam pam.c -lpam\
    \ -lpam_misc\n```"
