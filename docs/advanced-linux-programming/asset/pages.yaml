    all: server $(MODULES)

    ```


    ```

    # Clean up build products.

    clean: rm -f $(OBJECTS) $(MODULES) server

    ```


    ```

    # The main server program. Link with -W1,-export-dynamic so

    # dynamically loaded modules can bind symbols in the program. Link in

    # libldl, which contains calls for dynamic loading.

    server: $(OBJECTS)

    $(CC) $(CFLAGS) -W1,-export-dynamic -o $ -ldl

    ```


    ```

    # All object files in the server depend on server.h. But use the

    # default rule for building object files from source files.

    $(OBJECTS): server.h

    ```


    ```

    # Rule for building shared libraries from the corresponding

    # source files. Compile -fPIC and generate a shared object file.

    $(MODULES): \%.so server.h

    $(CC) $(CFLAGS) -fPIC -shared -o $ $

    ```


    The Makefile provides these targets:


    +   - all (the default if you invoke make without arguments it''s the first target

    in in the Makefile) includes the server executable and all the modules. The mod-ules
    are listed in the variable MODULE.

    - clean deletes any build products that are produced by the Makefile.

    - server links the server executable. The source files listed in the variable
    SOURCES

    are are compiled and linked in.

    - The last rule is a generic pattern for compiling shared object files for server

    modules from the corresponding source files.


    Note that source files for servers are compiled with the -fPIC option because

    they are linked to shared libraries (see Section 2.3.2, "Shared Libraries," in
    Chapter 2).


    Also observe that the server executable is linked with the -W1,-export-dynamic

    compiler option. With this option, GCC passes the -export-dynamic option to the

    linker, which creates an executable file that also exports its external symbols
    as a shared\ibrary. This allows modules, which are dynamically loaded as shared
    libraries, to refer-ence functions from common.c that are linked statically to
    the server executable.'
