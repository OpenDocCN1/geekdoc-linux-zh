  md: '# 142 Chapter 6 Devices


    When you''re done, unmount the virtual file system.


    ```

    % cd /tmp

    % umount /tmp/virtual-fs

    ```


    You can delete disk-image if you like it, or you can mount it later to access
    the files on the virtual file system. You can also copy it to another computer
    and mount it there—the whole file system that you created will be intact.


    Instead of creating a file system from scratch, you can copy one directly from
    a device. For instance, you can create an image of the contents of a CD-ROM simply
    by copying it from the CD-ROM device.


    If you have an IDE CD-ROM drive, use the corresponding device name, such as /dev/hda,
    previously described. If you also use a SCSI CD-ROM drive, the device name will
    be /dev/scd or similar. Your system may also have a symbolic link /dev/cdrom that
    points to the appropriate device. Consult your /etc/fstab to determine what device
    name corresponds to your computer''s CD-ROM drive.


    Simply copy to a file. The resulting file will be a complete disk image of the
    file system on the CD-ROM in the drive—for example:


    ```

    % /dev/cdrom /tmp/cdrom-image

    ```


    This may take several minutes, depending on the CD-ROM you are copying and the
    speed of your drive. The resulting image file will be quite large—as large as
    the contents of the CD-ROM.


    Now you can mount this CD-ROM without having the original CD-ROM in the drive.
    For example, to mount it on /mnt/cdrom, use this line:


    ```

    % mount -o loop=/dev/loop0 /tmp/cdrom-image /mnt/cdrom

    ```


    Because the image is on a hard disk, it will perform much faster than the actual
    CD-ROM disk. Note that most CD-ROMs use the file system type iso9660.


    # 6.6 PTYs


    If you run the mount command with no-line arguments, which displays the file systems
    mounted on your system, you will notice a line that looks something like this:


    ```

    none on /dev/pts type devpts (rw,gid=5,mode=628)

    ```


    This indicates that a special type of file system, devpts, is mounted at /dev/pts.
    This file system, which isn''t associated with any hardware device, is a “magic”
    file system that is created by the Linux kernel. It is similar to the /proc file
    system; see Chapter 7 for more information about how this works.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# 6.6 PTYs 143


    Like the /dev directory, /dev/pts contains entries corresponding to devices. But
    unlike /dev, which is an ordinary directory, /dev/pts is a special directory that
    is created dynamically by the Linux kernel. The contents of the directory vary
    with time and reflect the state of the running system.


    The entries in /dev/pts correspond to pseudo-terminals (or pseudo-TTYs, or PTYs).
    Linux creates a PTY for every new terminal window you open and displays a corresponding
    entry in /dev/pts. The PTY device acts like a terminal device—it accepts input
    from the keyboard and displays text output from the programs that run in it. PTYs
    are numbered, and the PTY number is the name of the corresponding entry in /dev/pts.


    You can display the terminal device associated with a process using the ps command.
    Specify tty as one of the fields of a custom format with the -o option. To display
    the process ID,TTY, and command line of each process sharing the same terminal,
    invoke ps -o pid,tty,cmd.


    # 6.6.1 A PTY Demonstration


    For example, you can determine the PTY associated with a given terminal window
    by invoking it in this command:


    ```

    % ps -o pid,tty,cmd

    PID TTY CMD

    28832 pts/4 bash

    29287 pts/4 ps -o pid,tty,cmd

    ```


    This particular terminal window is running in PTY 4.


    The PTY has a corresponding entry in /dev/pts:


    ```

    % ls -l /dev/pts/4

    crw-w---- 1 samuel tty 136 4 Mar 8 02:56 /dev/pts/4

    ```


    Note that it is a character device, and its owner is the owner of the process
    for which it was created.


    You can read from or write to the PTY device. If you read from it, you will hijack
    keyboard input that would otherwise be seen by the program running in the PTY.
    If you write to it, the data will appear in that window.


    Try opening a new terminal window, and determine its PTY number by invoking ps
    -o pid,tty,cmd. From another window, write some text to the PTY device. For example,
    if the new terminal window''s PTY number is 7, invoke this command from another
    window:


    ```

    % echo ''Hello, other window!'' > /dev/pts/7

    ```


    The output appears in the new terminal window. If you close the terminal window,
    the entry 7 in /dev/pts disappears.'
  merge: -1
