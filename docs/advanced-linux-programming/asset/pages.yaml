  md: '# Using the exec Family


    The exec functions replace the program running in a process with another program.

    When a program calls an exec function, that process immediately ceases executing
    that program and begins executing a new program from the beginning, assuming that
    the exec call doesn''t encounter an error.


    Within the exec family, there are functions that vary slightly in their capabilities
    and how they are called.


    +   - Functions that contain the letter p in their names (execvp and execclp)
    accept a program name and search for a program by name in the current execution
    path; functions that don''t contain the p must be the full path of the program
    to be executed.

    - Functions that contain the letter v in their names (execv, execvp, and execve)
    accept the argument list for the new program as a NULL-terminated array of pointers
    to strings. Functions that contain the letter l (execl, execpl, and exele) accept
    the argument list using the C language''s varargs mechanism.

    - Functions that contain the letter e in their names (execve and exele) accept
    an additional argument, an array of environment variables. The argument should
    be a NULL-terminated array of pointers to character strings. Each character string
    should be of the form "VARIABLE"


    Because exec replaces the calling program with another one, it never returns unless
    an error occurs.


    The argument list passed to the program is analogous to the command-line arguments
    that you specify to a program when you run it from the shell. They are available
    through the argc and argv parameters to main. Remember, when a program is invoked
    by the shell, the shell sets the first element of the argument list (argv[0])
    to the name of the program, the second element of the argument list (argv[1])
    to the first command-line argument, and so on. When you use an exec function in
    your program, you, too, should pass the name of the function as the first element
    of the argument list.


    # Using fork and exec Together


    A common pattern to run a subprocess within a program is first to fork the process
    and then exec the subprocess. This allows the calling program to continue execution
    in the parent process while the calling program is replaced by the subprocess
    in the child process.


    The program in Listing 3.4, like Listing 3.2, lists the contents of the root directory
    using the 1s command. Unlike the previous example, though, it invokes the 1 command
    directly, passing it to the command-line arguments -1 and r rather than invoking
    it through a shell.'
