    \n# 1.5 Finding More Information\n\nNearly every Linux distribution comes with\
    \ a great deal of useful documentation. You could learn most of what we'll talk\
    \ about in this book by reading documentation in your Linux distribution (although\
    \ it would probably take you much longer). The documentation's always well-organized,\
    \ though, the tricky part is finding what you need. Documentation is sometimes\
    \ out-of-date, so take everything you read with a grain of salt. If the system\
    \ doesn't behave the way a man page (manual pages) says it should, for instance,\
