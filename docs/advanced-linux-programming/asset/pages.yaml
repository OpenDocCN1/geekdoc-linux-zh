  md: "# 8.4 fsync and fdatasync: Flushing Disk Buffers\n\n# 8.4 fsync and fdatasync:\
    \ Flushing Disk Buffers\n\nOn most operating systems, when you write to a file,\
    \ the data is not immediately written to disk. Instead, the operating system caches\
    \ the written data in a memory buffer, to reduce the number of required disk writes\
    \ and improve program responsiveness. When the buffer fills or some other condition\
    \ occurs (for instance, enough time elapses), the system writes the cached data\
    \ to disk all at one time.\n\nLinux provides caching of this type as well. Normally,\
    \ this is a great boon to performance. However, this behavior can make programs\
    \ that depend on the integrity of disk-based records unreliable. If the system\
    \ goes down suddenly—for instance, due to a kernel crash or power outage—any data\
    \ written by a program in the memory cache has not yet been written to disk.\n\
    \nFor example, if you are writing a transaction-processing program that keeps\
    \ a journal file. The journal contains records of all transactions that have been\
    \ processed so that if a system failure occurs, the state of the transaction can\
    \ be reconstructed. It is obviously important to preserve the integrity of the\
    \ journal file—whenever a transaction is processed, its journal entry should be\
