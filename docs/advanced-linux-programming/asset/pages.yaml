  md: '# 10.6 More Security Holes


    The basics covered here are enough for most simple programs. Full documentation
    about how PAM works is available in /usr/doc/pam on most GNU/Linux systems.


    # 10.6 More Security Holes


    Although this chapter will point out a few common security holes, you should by
    no means rely on this book to cover all possible security holes. A great many
    have already been discovered, and many more are out there waiting to be. If you
    are trying to write secure code, there is really no substitute for having a security
    expert audit your code.


    # 10.6.1 Buffer Overruns


    Almost every Internet application daemon, including the sendmail daemon, the finger
    talk daemon, and has at one point compromised through a buffer overflow.


    If you are writing any code that will ever run as root, you absolutely must be
    aware of this particular kind of security hole. If you are writing a program that
    performs any kind of interprocess communication, if you are writing a program
    that reads files (or might read files) that are not owned by the user executing
    the program, you should be aware of this kind of security hole. That last criterion
    applies to almost every program. Fundamentally, if you are going to write GNU/Linux
    software, you ought to know about buffer overflows.


    The idea behind a buffer overflow attack is to trick a program into executing
    code that it did not intend to execute. The usual mechanism for achieving this
    feat is to overwrite some portion of the program''s stack. The program''s stack
    contains, among other things, memory, the location to which the program will transfer
    control when the current function returns. Therefore, if you can put the code
    that you want to have executed into somewhere and then change the return address
    to point to that memory, you can cause the program to execute anything. When the
    program returns from the function it is executing, it will jump to the new code
    and execute whatever it is running, with the privileges of the current process.
    Clearly, if the process is running as root or another user, it is a "disaster"
    for that user—and anybody else who depends on the contents of files owned by that
    user, and so forth.


    If the program is running as a daemon and listening for incoming network connections,
    the situation is even worse. A daemon typically runs as root. If it contains buffer
    overflows, anyone who can connect via the network to a computer running the daemon
    can seize control of the computer by sending a malignant sequence of data to the
    daemon over the network. A program that does not engage in network communications
    is much safer because only users who are already ready to log in to the computer
    running the program are able to attack it.'
