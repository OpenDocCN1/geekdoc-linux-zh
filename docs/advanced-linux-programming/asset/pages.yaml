- img_proc: true
  md: '# 6.5 Special Devices 141


    3. Mount the file system using a loopback device. To do this, use the mount command,
    specifying the disk image file as the mount device. Also specify loop=loopback-device
    as a mount point, using the -o option to tell mount which loopback device to use.


    For example, to mount our disk-image file system, invoke these commands. Remember,
    only the superuser may use a loopback device. The first command creates a directory,
    /tmp/virtual-fs, to use as the mount point for the virtual file system.


    ```

    % mkdir /tmp/virtual-fs

    % mount -o loop=/dev/loop0 /tmp/disk-image /tmp/virtual-fs

    ```


    Now your disk image is mounted as if it were an ordinary 10MB disk drive.


    ```

    % df -h /tmp/virtual-fs

    % echo ''Hello, world!'' > test.txt

    % ls -l

    ```


    | Filesystem Size Used Avail% Mounted on |

    | /tmp/disk-image 9.7M 13k 9.2M 0% /tmp/virtual-fs |


    ```

    drwxr-xr-x 2 root root 12288 Mar 8 02:00 lost+found

    -rw-rw-- 1 root root 14 Mar 8 02:12 test.txt

    % cat test.txt

    Hello, world!

    ```


    You can use it like any other disk:


    Note that lost+found is a directory that was automatically added by mkefs.5


    5. If the file system is ever damaged, and some data is recovered but not associated
    with a file, it is placed in lost+found.'
