- img_proc: true
  md: '# 5.1 Shared Memory 97


    Because the kernel does not synchronize accesses to shared memory, you must provide
    your own synchronization. For example, a process should not read from the memory
    until data is written there, and two processes must not write to the same memory
    location at the same time. A common strategy to avoid these race conditions is
    to use semaphores, which are discussed in the next section. Our illustrative programs,
    though, just show a single process accessing the shared memory, to focus on shared
    memory mechanism and to avoid cluttering the sample code with synchronization
    logic.


    # 5.1.2 The Memory Model


    To use a shared memory, one process must allocate the segment. Then each process
    desiring to access the segment must attach the segment. After finishing its of
    the segment, each process detaches the segment. At some point, one process must
    deallocate the segment.


    Understanding the Linux memory model helps explain the allocation and process.
    Under Linux, each process''s virtual memory is split into pages. Each process
    maintains a mapping from its addresses to these virtual pages, which contain the
    actual data. Even though each page has its own addresses, multiple processes''
    mappings can point to the same page, permitting sharing of memory. Memory pages
    are discussed further in Section 8.8, "The nook Family: Locking Physical Memory,"
    of Chapter 8, "Linux System Calls."


    Allocating a new shared memory segment causes virtual pages to be created. Because
    all processes desire to access the same shared segment, only one process should
    allocate a new segment. Allocating an existing segment does not create new pages,
    but it does return an identifier for the existing pages. To permit a process to
    use the shared memory segment, a process attaches it, which adds mapping from
    its virtual memory to the segment''s pages. When finished with the segment, these
    mapping entries are removed. When no more processes want to access these shared
    memory segments, exactly one process must deallocate the virtual pages.


    All shared memory segments are allocated as integer multiples of the system''s
    page size, which is the number of bytes in a page of memory. On Linux systems,
    the page size is 4KB, but you should obtain this value by calling the getpagesize
    function.


    # 5.1.3 Allocation


    A process allocates a shared memory segment using shget("Shared Memory GET").
    Its first parameter is an integer key that specifies which segment to create.
    Unrelated processes can access the same shared segment by specifying the same
    key value. Unfortunately, other processes may have also chosen the same fixed
    key, which could lead to conflict. Using the special IPC_PRIVATE as the key value
    guarantees that a brand new memory segment is created.'
