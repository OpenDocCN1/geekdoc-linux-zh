    ```


    Compile and run the program on a test file—say, /tmp/test-file—like this:

    % cc -o lock-file lock-file.c

    % touch /tmp/test-file

    % ./lock-file /tmp/test-file

    opening /tmp/test-file

    locking

    locked; hit Enter to unlock...


    Now, in another window, try running it on the same file.

    % ./lock-file /tmp/test-file

    opening /tmp/test-file

    locking


    Note that the second instance is blocked while attempting to lock the file. Go
    back to the first window and press Enter:

    locking


    The program running in the second window immediately acquires the lock.

    If you prefer fcntl not to block if the call cannot get the lock requested, use
    F_SETLK instead of F_SETLKKW. If the lock cannot be acquired, fcntl returns -1
    immediately.


    Linux provides another implementation of file locking with the flock call. The
    fcntl version has a major advantage: It works with file systems on NFS (as long
    as the NFS server is recently and correctly configured). So, if you have access
    to two machines that both mount the same file system via NFS, you can repeat the
    previous example using two different machines. Run lock-file on one machine, specifying
    a file on an NFS file system, and run it again on another machine, specifying
    the same file. NFS wakes up the second program when the lock is released by the
    first program.


    Network File System (NFS) is a common network sharing technology, comparable to
    Windows'' shares and network drives.'
