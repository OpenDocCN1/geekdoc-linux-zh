  md: '# About the Technical Reviewers


    These reviewers contributed their considerable hands-on expertise to the entire
    development process for Advanced Linux Programming. As the book was being written,
    these dedicated professionals reviewed all the material for technical content,
    organization, and flow. Their feedback was critical to ensuring that Advanced
    Linux Programming fits our reader''s need for the highest quality technical information.


    Glenn Becker has many degrees, all in theatre. He presently works as an online
    producer for SCI1FI.COM, the online component of the SCI FI channel, in New York
    City. At home he runs Debian GNU/Linux and obsesses about such topics as system
    administration, security, software internationalization, and XML.


    John Dean received a BSC(Hons) from the University of Sheffield in 1974, in pure
    science. As an undergraduate at Sheffield, John developed his interest in computing.
    In 1986 he received a MSc from Cranfield Institute of Science and Technology in
    Control Engineering. While working for Roll Royce and Associates, John became
    involved in developing control software for computer-aided inspection equipment
    of nuclear steam-raising plants. Since leaving RR&A in 1978, he has worked in
    the petrochemical industry developing and maintaining process control software.
    John worked a volunteer software developer for MySQL from 1996 until May 2000,
    when he joined MySQL as a full-time employee. John''s area of responsibility is
    MySQL on MS Windows and developing a new MySQL client using Trolltech''s Qt application
    toolkit on both Windows and platforms that run X-11.


