    # Job Control Notification in the Shell


    The lines starting with [1] are from the shell. When you run a program in the
    background, the shell assigns a job number to it—in this case, 1—and prints out
    the program''s pid. If a background job terminates, the shell reports the next
    time you invoke a command.


    Notice that there are three processes running the thread-pid. The first of these,
    with 14608, is the main thread in the program; the second, with 14610, is the
    third we created to execute thread_function.


    How about the second thread, with 14609? It is the “manager thread,” which is
    part of the internal implementation of GNU/Linux threads. The manager thread is
    created the first time a program calls pthread_create to create a new thread.


    # 4.5.1 Signal Handling


    Suppose that multithreaded program receives a signal. In which thread is the signal
    handler invoked? The behavior of the interaction between signals and threads varies
    from one UNIX-like system to another. In GNU/Linux, the behavior is dictated by
    the fact that threads are implemented as processes.


    Because each thread is a separate process, and because a signal is delivered to
    a particular process, there is no ambiguity about which thread receives the signal.
    Typically, signals sent from outside the program are sent to the process corresponding
    to the main thread of the program. For instance, if a program forks and the child
    process executes a multithreaded program, the parent process will hold the id
    of the main thread of the child process and will use that id to send signals to
    its child. This is generally a good convention to follow when sending signals
    to a multithreaded program.


    Note that this case of GNU/Linux’s implementation of pthreads is at variance with
    the POSIX thread standard. Do not rely on this behavior in programs that are meant
    to be portable.


    Within a multithreaded program, it is possible for one thread to send a signal
    specifically to another thread. We use the pthread_kill function to do this. Its
    first parameter is a thread id, and its second parameter is a signal number.


    # 4.5.2 The clone System Call


    Although GNU/Linux threads created in the same program are implemented as separate
    processes, they share their virtual memory space and other resources. A child
    process created with fork, however, gets copies of these items. How is the former
    type created?'
