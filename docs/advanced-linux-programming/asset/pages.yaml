    \ automatically expands the file to make room for the new data. If you position\
    \ a file descriptor beyond the end of a file and then write to it, Linux expands\
    \ the file to accommodate the \"gap\" that you created with the new data and then\
    \ writes to it. This gap, however, does not actually occupy space on the disk;\
    \ instead just makes a note of how long it is. If you try to read from the file,\
    \ appears to your program that the gap is filled with 0 bytes.\n\nUsing this behavior\
