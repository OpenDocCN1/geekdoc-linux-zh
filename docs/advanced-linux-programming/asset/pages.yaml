  md: '# About the Authors


    Mark Mitchell received a bachelor of arts degree in computer science from Harvard
    in 1994 and a master of science degree from Stanford in 1999. His research interests
    centered on computational complexity and computer security. Mark has participated
    substantially in the development of the GNU Compiler Collection, and he has a
    strong interest in developing quality software.


    ![](img/c4e64f1f40e77d2bb7fe9245699d2ea5_17_0.png)


    Jeffrey Oldham received a bachelor of arts degree in computer science from Rice
    University in 1991. After working at the Center for Research on Parallel Computation,
    he obtained a doctor of philosophy degree from Stanford in 2000. His research
    interests center on combinatorial algorithm engineering, concentrating on flow
    and other combinatorial algorithms. He works on GCC and scientific computing software.


    ![](img/c4e64f1f40e77d2bb7fe9245699d2ea5_17_1.png)


    Alex Samuel graduated from Harvard in 1995 with a degree in physics. He worked
    as a software engineer at BBN before returning to study physics at Caltech and
    the Stanford Linear Accelerator Center. Alex administers the Software Carpentry
    project and works on various other projects, such as optimizations in GCC.


    ![](img/c4e64f1f40e77d2bb7fe9245699d2ea5_17_2.png)


    Mark and Alex founded CodeSourcery LLC together in 1999. Jeffrey joined the company
    in 2000. CodeSourcery''s mission is to provide development tools for GNU/Linux
    and other operating systems; to make the GNU tool chain a commercial-quality,
    standards-conforming development tool set; and to provide general consulting and
    engineering services. CodeSourcery''s Web site is http://www.codesourcery.com.'
  merge: -1
