  md: '# 10.3 File System Permissions


    Linux enables you to designate which of these three actions—reading, writing,
    and executing—can be performed by the owning user, owning group, and everybody
    else. For example, you could say that the owning user can do anything he wants
    with the file, anyone in the owning group can read and execute the file (but not
    write to it), and nobody else can access the file at all.


    You can view permission bits interactively with the ls command -l or -o options
    and programmatically with the stat system call. You can set the permission bits
    interactively with the chmod program or programmatically with the system call
    of the same name. To look at the permissions on a file named hello use ls -l hello.
    Here''s how the output looks:


    ```

    % ls -l hello

    -rw-r--r-- 1 samuel csl 11734 Jan 22 16:29 hello

    ```


    The samuel and csl fields indicate that the owning user is samuel and that the
    owning group is csl.


    The string of characters at the beginning of the line indicates the permissions
    associated with the file. The first dash indicates that this is a normal file.
    It would be d for a directory, or it can be other letters for special kinds of
    files such as devices (see Chapter 6,,"Devices") or named pipes (see Chapter 5,"Interprocess
    Communication,"Section 5.4,"Pipes"). The next three characters show permissions
    for the owning user; they indicate that samuel can read, write, and execute the
    file. The next three characters show members of the csl group are allowed only
    to read and execute the file. The last three characters show permissions for everyone
    else; these are not allowed to do anything with hello.


    Let''s see how this works. First, let''s try to access the file as the user nobody,
    who is not in the csl group:


    ```

    % id

    uid=99(nobody) gid=99(nobody) groups=99(nobody)

    % cat hello

    cat: hello: Permission denied

    % echo hi > hello

    sh:/hello: Permission denied

    % ./hello

    sh:/hello: Permission denied

    ```


    We can''t read the file, which is why cat fails; we can''t write to the file,
    which is why echo fails; and we can''t run the file, which is why ./hello fails.


    You''ll sometimes see the permission bits for a file referred to as the file''s
    mode. The name of the chmod command is short for "change mode."'
  merge: -1
