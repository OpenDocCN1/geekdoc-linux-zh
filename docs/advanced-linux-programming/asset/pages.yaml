  md: '# Appendix C Table of Signals


    | Name | Description |

    | --- | --- |

    | SIGINT | Linux sends this signal when the user tries to end it by pressing Ctrl+C.
    |

    | SIGILL | A process gets this signal when it attempts to execute an illegal instruction.
    This could indicate that the program''s stack is corrupted. |

    | SIGABRT | The abort function causes the process to receive this signal. |

    | SIGFPE | The process has executed an invalid floating-point math instruction.
    Depending on how the CPU is configured, an invalid floating-point operation may
    return a special non-number value such as inf (infinity) or NaN (not a number)
    instead of raising SIGFPE. |

    | SIGKILL | This signal ends a process immediately and cannot be handled. |

    | SIGUSR1 | This signal is reserved for application use. |

    | SIGUSR2 | This signal is reserved for application use. |

    | SIGSEGV | The program attempted an invalid memory access. The access may be
    to an address that is invalid in the process''s virtual memory, or the access
    may be forbidden by the target memory''s permissions. Dereferencing a "wild pointer"
    can cause a SIGSEGV. |

    | SIGPIPE | The program has attempted to access a broken data stream, such as
    a socket that has been closed by the other party. |

    | SIGALRM | The alarm call schedules the delivery of this signal at a later time.
    See Section 8.13, "setimer: Setting Interval Timers," in Chapter 8, "Linux System
    Calls," for information about setimer, a generalized version of alarm. |

    | SIGTERM | This signal requests that a process terminate. This is the default
    signal sent by the kill command. |

    | SIGCHLD | Linux sends this process signal when a child process exits. See Section
    3.4.4, "Cleaning Up Children Asynchronously," in Chapter 3, "Processes". |

    | SIGXCPU | Linux sends this process when it exceeds the limit of CPU time that
    it can consume. See Section 8.5, "getrlimit and setrlimit: Resource Limits," in
    Chapter 8 for information about CPU time limits. |

    | SIGVTALRM | The setimer schedules the delivery of this signal at a future time.
    See Section 8.13, "setimer: Setting Interval Timers." |'
