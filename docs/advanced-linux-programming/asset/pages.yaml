- img_proc: true
  md: '# Chapter 8 Linux System Calls


    The set of Linux system calls forms the most basic interface between programs
    and the Linux kernel. Each call presents a basic operation or capability.

    Some system calls are very powerful and exert great influence on the system. For
    instance, some system calls enable you to shut down the Linux system or to allocate
    system resources and prevent others from accessing them. These calls have the
    restriction that only processes running with superuser privilege (programs run
    by the root account) can invoke them. These calls fail if invoked by a nonuser
    process.


    Linux currently provides about 200 different system calls. A listing of system
    calls for your version of the Linux kernel is in `/usr/include/asm/unistd.h`.
    Some of these are for internal use by the system, and others are used only in
    implementing library functions. In this chapter, we''ll present a selection of
    system calls that are likely to be the most useful to application and system programmers.

    Most of these system calls are declared in `<unistd.h>`.


    # 8.1 Using strace


    Before we start discussing system calls, it will be useful to present a command
    with which you can learn about and debug system calls. The `strace` command traces
    the execution of another program, listing any system calls the program makes and
    any signals it receives.

    To watch the system calls and signals in a program, simply invoke strace, followed
    by the program and its command-line arguments. For example, to watch the system
    calls that are invoked by the `hostname` command, use this:


    ```

    $ strace hostname

    ```


    ```

    execve("/bin/hostname", ["hostname", /* 49 vars */]) = 0

    ```


    +   1. hostname without any flags simply prints out the computer''s hostname to
    standard output.

    2. In Linux, the exec family of functions is implemented via the execve system
    call.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# 8.2 access: Testing File Permissions


    The first argument is the name of the program to run; the second is its argument
    list, consisting of only a single element; and the third is its environment list,
    which strace omits for brevity. The next 30 or so lines are part of the mechanism
    that loads the standard C library from a shared library file.


    Toward the end are system calls that actually do the program''s work. The uname
    system call is used to obtain the system''s hostname from the kernel, uname(sys="Linux",
    node="hostname", ... ) = 0


    Observe that strace happily labels the fields (sys and node) of structure argument.
    This structure is filled by the system call—Linux sets the sys field to the operating
    system and the node field to the system''s hostname. The uname call is discussed
    further in Section 8.15, "uname".


    Finally, the write call produces output. Recall that file descriptor 1 corresponds
    to standard output. The third argument is the number of characters to write, and
    the return value is the number of characters that were actually written. write(1,
    "myhostname\n", 11) = 11


    This may appear garbled when you run strace the output from the hostname program
    is mixed in with the output from strace.


    If you''re tracing produces of output, it is sometimes convenient to redirect
    the output from strace into a file. Use the option -o filename to do this.


    Understanding all the output from strace requires detailed familiarity with the
    design of the Linux kernel and execution environment. Much of this is of limited
    interest to application programmers. However, some understanding is useful for
    debugging tricky problems or understanding how other programs work.


    # 8.2 access: Testing File Permissions


    The access call determines whether the calling process has access permission to
    a file. It can check any combination of read, write, and execute permission, and
    it can also check for a file''s existence.


    The access call takes two arguments. The first is the path to the file to check.
    The second is a bitwise OR R_OK, W_OK, and X_OK, corresponding to read, write,
    and execute permission. The return value is 0 if the process has all the specified
    permissions. If the file exists but the calling process does not specify the permissions,
    access returns -1 and sets errno to EACCES (or EROFS, if write permission was
    requested for a file on a read-only file system).


    If the second argument is F_OK, access simply checks for the file''s existence.
    If the file exists, the return value is 0; if not, the return value is -1 and
    errno is set to ENOENT. Note that errno may be set to EACCES if a directory in
    the file path is inaccessible.'
