  md: "# B.6 Reading Directory Contents 297\n\nTo read the contents of a directory,\
    \ follow these steps:\n\n+   1. Call opendirir, passing the path of the directory\
    \ that you want to examine. Call opendirir returns a DIR* handle, which you'll\
    \ use to access the directory contents. If an error occurs, the call returns NULL.\n\
    \n+   2. Call readdir repeatedly, passing the DIR* handle that you obtained from\
    \ opendir. Each time you call readdir, it returns a pointer to a struct dire instance\
    \ corresponding to the next directory entry. When you reach the end of the directory's\
    \ contents, readdir returns NULL.\n\nThe struct dire you get from readdir has\
    \ a field d_name, which contains the contents of the directory entry.\n\n+   3.\
    \ Call closedir, passing the DIR* handle, to end the directory listing operation.\n\
    \nInclude <sys/types.h> and <dirent.h> if you use these functions in your program.\
    \ Note that if you need the contents of the directory arranged in a particular\
    \ order, you'll have to sort them yourself.\n\nThe program in Listing B.8 prints\
    \ the contents of a directory. The directory may be specified on the command line,\
    \ but if it is not specified, the program uses the current working directory.\
    \ For each entry in the directory, it displays the type of the entry and its path.\
    \ The get_file_type function uses stat to determine the type of a file system\
    \ entry.\n\n# Listing B.8 Print a Directory Listing\n\n```\n#include <assert.h>\n\
    #include <dirent.h>\n#include <stdio.h>\n#include <string.h>\n#include <sys/stat.h>\n\
    #include <sys/types.h>\n#include <unistd.h>\n```\n\n```\n/* Return a string that\
    \ describes the type of the file system entry PATH. */\nconst char* get_file_type(const\
    \ char* path)\n{\n    struct stat st;\n    stat(path, &st);\n    if (S_ISNK(st.st_mode))\n\
    \        return \"symbolic link\";\n    else if (S_ISDIR(st.st_mode))\n      \
    \  return \"directory\";\n    else if (S_ISCHR(st.st_mode))\n        return \"\
    character device\";\n    else if (S_ISBLK(st.st_mode))\n        return \"block\
    \ device\";\n```"
