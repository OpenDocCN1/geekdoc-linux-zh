    But if the call fails, this alternative makes no effort to report, handle, or
    recover from errors.


    Whether you use the first form, the second form, or something in between depends
    on the error detection and recovery requirements for your program.


    # 2.2.4 Errors and Resource Allocation


    Often, when a system fails, it''s appropriate to cancel the current operation
    but not to terminate the program because it may be possible to recover from the
    error. One way to do this is to return from the current function, passing a return
    code to the caller indicating the error.


    If you decide to return from the middle of a function, it''s important to make
    sure that any resources successfully allocated previously in the function are
    first deallocated. These resources can include memory, file descriptors, file
    pointers, temporary files, synchronization objects, and so on. Otherwise, if your
    program continues running, the resources allocated before the failure occurred
    will be leaked.


    +   1. Allocate the buffer.

    2. Open the file.

    3. Read from the file into the buffer.

    4. Close the file.

    5. Return the buffer.


    If the file doesn''t exist, Step 2 will fail. An appropriate course of action
    might be to return NULL from the function. However, if the buffer has already
    been allocated in Step 1, there is a risk of leaking memory. You must remember
    to deallocate the buffer somewhere along any of control from which you don''t
    return. If Step 3 fails, not only must you deallocate the buffer before returning,
    but you must also close the file.


    Listing 2.6 shows an example of how you might write this function.


    > Listing 2.6 (readfile.c) Freeing Resources During Abnormal Conditions


    ```

    #include <fcntl.h>

    #include <stdlib.h>

    #include <sys/stat.h>

    #include <sys/types.h>

    #include <unistd.h>

    ```


    (continues)'
