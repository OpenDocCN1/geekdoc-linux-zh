  md: "# 3.2 Creating Processes 49\n\ncopy of its parent process. Linux provides another\
    \ set of functions, the exec family, that causes a particular process to cease\
    \ being an instance of one program and instead become an instance of another program.\
    \ To spawn a new process, you first use fork to make a copy of the current process.\
    \ Then you use exec to transform one of these processes into an instance of the\
    \ program you want to spawn.\n\n# Calling fork\n\nWhen a program calls fork, a\
    \ duplicate process, called the child process, is created. The parent process\
    \ continues executing the program from the point that fork was called. The child\
    \ process, too, executes the same program from the same place.\nSo how do the\
    \ two processes differ? First, the child process is a new process and therefore\
    \ has a new ID, distinct from its parent's process ID. One way for a process to\
    \ distinguish whether it is in the parent process or the child process is to call\
    \ getpid. However the fork function returns different values to the parent and\
    \ child processes—“goes in” to the fork call, and two processes “come out, with\
    \ different return values. The return value in the parent process is the ID of\
    \ child. The return value in the child process is zero. Because no process ever\
    \ has an ID of zero, it makes easy for the program whether it is now running as\
