  md: '5.2 Processes Semaphores 101


    # 5.1.8 Pros and Cons


    Shared memory segments permit fast bidirectional communication among any number
    of processes. Each user can read and write, a program must establish and fol-low
    some protocol for preventing race conditions such as overwriting information before
    it is read. Unfortunately, Linux does not guarantee exclusive access even if you
    create a new shared segment with IPC_PRIVATE.


    Also, for multiple processes to use a shared segment, they must make arrangements
    to use the same key.


    # 5.2 Processes Semaphores


    As noted in the previous section, processes must coordinate access to shared memory.
    As we discussed in Section 4.4.5, "Semaphores for Threads," in Chapter 4, "Threads,
    semaphores provides a distinct implementation of semaphores that can be used for
    synchronizing processes (called process semaphores or sometimes System V semaphores).
    Process sem-aphores are allocated, used, and deallocated like shared memory segments.
    Although a single semaphore is sufficient for all uses, process semaphores come
    in sets. Throughout this section, we present system calls for process semaphores,
    showing how to implement single binary semaphores using them.


    # 5.2.1 Allocation and Deallocation


    The calls senget and semct1 allocate and deallocate semaphores, which is analogous
    to shmget and semctl for shared memory. Invoke senget with a key specifying aa-phor
    set, the number of semaphores in the set, and permission flags as shmget; the
    return value is a semaphore set identifier. You can obtain the identifier of an
    existing semaphore set by specifying the right key value; in this case, the number
    of sem-aphores can be zero.


    Semaphores continue to exist even after all processes using have terminated. The
    last process to use a semaphore must explicitly remove it to ensure that the operating
    system does not run out of semaphores. To do so, invoke semctl1 with the semaphore
    identifier, the number of semaphores in the set, IPC_RMID as the third argument,
    and any union semun as the fourth argument (which is ignored).The effective user
    ID of the calling process must match that of the semaphore''s allocator (or the
    caller must be root). Unlike shared memory segments, removing a semaphore set
    causes Linux to deallocate immediately.


    Listing 5.2 presents functions to allocate and deallocate a binary semaphore.'
