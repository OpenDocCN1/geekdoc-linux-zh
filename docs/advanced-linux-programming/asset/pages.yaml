    In that case, the server will execute this command:

    grep -x foo /dev/null; rm -rf /usr/dict/words


    Now the problem is obvious. The user has turned one command, ostensibly the invocation
    of grep, into two commands because the shell treats a semicolon as a command separator.
    The first command is still a harmless invocation of grep, but the second removes
    all files on the entire system! Even if the server is not running as root, all
    the files that can be removed by the user running the server will be removed.
    The same problem can arise when using popen (described in Section 5.4.4,"popen
    and pclose"), which creates a pipe between the parent and child process but still
    uses the shell to run the command.


    There are two ways to avoid these problems. One is to use the exec family of functions
    instead of system or popen. That solution avoids the problem because characters
    that the shell treats specially (such as the semicolon in the previous command)
    are not treated specially when they appear in the argument list to an exec call.
    Of course, you give up the convenience of system and popen.'
