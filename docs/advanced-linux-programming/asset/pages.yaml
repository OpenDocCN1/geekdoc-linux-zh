  md: "One possible error code you should be on the watch for, especially with I/O\n\
    functions, is ETRINT. Some functions, such as read, select, and sleep, can take\
    \ signific-\ntime to execute. These are considered blocking functions program\
    \ execu-\ntion blocked until the call is completed. However, if the program receives\
    \ a signal\nwhile blocked in one of these calls, the call will return without\
    \ completing the opera-\ntion. In this case, errno is set to ETRINT. Usually,\
    \ you'll want to retry the system call\nin this case.\n\nHere's a code fragment\
    \ that uses the chan to change the owner of a file given\nby path to use the user_id.\
    \ If the call fails, the program takes action depending on\nthe value of errno.\
    \ Notice when we detect what's probably a bug in the program,\nwith exit or abort,\
    \ which cause a core file to be generated. This can be\nuseful for post-mortem\
    \ debugging. But for other unrecoverable errors, such as out-\nmemory conditions,\
    \ we use exit and a nonzero exit value instead because a\ncore file couldn't be\
    \ written.\n\n```\nrval = chown(path, user_id, -1);\nif (rval != 0) { /* because\
    \ it's blocked by the next system call. */\n  int error_code = errno;\n  /* The\
    \ operation didn't succeed; shown should return -1 on error. */\n  assert(errno\
    \ == -1);\n  /* Check the value of errno, and take appropriate action. */\n  switch\
    \ (error_code) {\n  case PERM:\n    /* Permission denied. */\n  case EROFS:\n\
    \    /* PATH is on a read-only file system. */\n  case ENAMETONG:\n    /* PATH\
    \ is too long. */\n  case ENOENT:\n    /* PATH does not exit. */\n  case EOTDIR:\n\
    \    /* A component of PATH is not a directory. */\n  case EACCES:\n    /* A component\
    \ of PATH is not accessible. */\n    /* Something's wrong with the file. Print\
    \ an error message. */\n    fprintf(stderr, \"error changing ownership of %s:\
    \ %s\\n\",\n           path, strerror(error_code));\n    /* Don't end the program;\
    \ perhaps give the user a chance to\nchoose another file...\" */\n    break;\n\
    \  }\n```\n\n```\ncase EFAULT:\n/* PATH contains an invalid memory address. This\
    \ is probably a bug. */\nabort ();\n```\n\n```\ndefault:\n/* Some other, unexpected,\
    \ error code. We've tried to handle all\npossible error codes; if we've missed\
    \ one, that's a bug! */\nabort ();\n}\n```"
