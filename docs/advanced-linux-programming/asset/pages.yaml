  md: '# 6.3 Device Entries 131


    two different drivers, one character device and one block device. Minor device
    numbers distinguish individual devices or components controlled by a single driver.
    The meaning of a minor device number depends on the device driver.


    For example, major device no.3 corresponds to the primary IDE controller on the
    system. An IDE controller can have two devices (disk, tape, or CD-ROM drives)
    attached to it; the “master” device has minor device no. 0, and the “slave” device
    has minor device no. 64. Individual partitions on the master device (if the device
    supports partitions) are represented by minor device numbers 1, 2, 3, and so on.
    Individual partitions on the slave device are represented by minor device numbers
    65, 66, 67, and so on.


    Major device numbers are listed in the Linux kernel documentation. On minor GNU/Linux
    distributions, this documentation can be found in /usr/src/linux/documentation/devices.txt.
    The entry /proc/devices lists major device numbers corresponding to active device
    drivers currently loaded into the kernel. (See Chapter 7, “proc File System”,
    for more information about /proc file system entries.)


    # 6.3 Device Entries


    A device entry is in many ways the same as a regular file. You can move it using
    the mv command and delete it if you try to copy a device entry using cp, though,
    you will read bytes from the device (if the device supports reading) and write
    to the destination file. If you overwrite a device entry, you’ll write bytes to
    the corresponding device entry instead.


    You can create a device entry in the file system using the mknod command (invoke
    man 1 mknod for the man page) or the mknod system call (invoke man 2 mknod for
    the man page). Creating a device entry in the file system doesn’t automatically
    imply that the corresponding device entry or hardware device is present or available;
    the device entry is merely a portal for communicating with the driver, if it’s
    there. Only superuser processes can create block and character devices using the
    mknod system call.


    To create a device using the mknod command, specify as the first argument the
    path at which the entry will appear in the file system. For the second argument,
    specify b for a block device or c for a character device. Provide the major and
    minor device numbers as the third and fourth arguments, respectively. For example,
    this command makes a character device entry named 1p0 in the current directory.
    The device has major device no. 6 and minor device no. 0. These numbers correspond
    to the first part-ion system.


    ```

    # mknod /1p0 c 6 0

    ```'
