  md: '# A.2 Finding Dynamic Memory Errors 263


    # A.2.2 malloc Checking


    The memory allocation functions provided by the GNU C library can detect writing
    before the beginning of an allocation and deallocating the same allocation twice.
    Defining the environment variable MALLOC_CHECK to the value 2 causes a program
    to halt when an error is detected. (Note the environment variable''s ending underscore.)
    There is no need to recompile the program.


    We illustrate diagnosing a write to a position just before the beginning of an
    allocation.


    ```

    % export MALLOC_CHECK=2

    % ./malloc-use 12

    Please enter a command: a @ 10

    Please enter a command: w @ -1

    Please enter a command: d ø

    Aborted (core dumped)

    ```


    export turns on malloc checking. Specifying the value 2 causes the program to
    halt as soon as an error is detected.


    Using malloc checking is advantageous the program need not be recompiled, but
    its capability to diagnose errors is limited. Basically, it checks that the allocator
    data structures are not corrupted. Thus, it can detect double deallocation of
    the same allocation. Also, writing just before the beginning of a memory allocation
    can usually be detected because the allocator stores the size of each memory allocation
    just before the allocated region. Thus, writing just before the allocated memory
    will corrupt this region.Unfortunately, consistency checking can occur only when
    your program calls allocation routines, when it accesses memory, so many illegal
    reads and writes can occur before an error is detected. In the previous example,
    the illegal write was detected only when the allocated memory was deallocated.


    # A.2.3 Finding Memory Leaks Using mtrace


    mtrace tool helps diagnose the most common error when using memory: failure to
    match allocations and deallocations. There are four steps to use mtrace, which
    is available with the GNU C library:


    +   1. Modify the source code to include <mcmalloc.h> and invoke mtrace () as
    soon as the program starts, at the beginning of main. The call to mtrace turns
    on tracking of memory allocations and deallocations.


    +   2. Specify the name of a file to store information about all memory allocations
    and deallocations:


    ```

    % export MALLOC_TRACE=memory.log

    ```


    +   3. Run the program. All memory allocations and deallocations are stored in
    the logging file.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 264 Appendix A Other Development Tools


    4. Using the mtrace command, analyze the memory allocations environment deallocations
    to ensure that they match.


    ```

    % mtrace my_program $MALLOC_TRACE

    ```


    The messages produced by mtrace are relatively easy to understand. For example,
    for our malloc-use example, the output would look like this:


    ```

    - 0000000000 3 Free was never alloc''d malloc-use.c:39

    ```


    Memory not freed:


    | Address Size Caller |

    | 0x08049d48 0xc at mall malloc-use.c:30 |


    These messages indicate an attempt on line 39 of malloc-use.c to free memory that
    was never allocated, and an allocation of memory on line 30 that was never freed.
    mtrace diagnoses errors by having to record all memory allocations and deallocations
    in the file specified by the MALLOC_TRACE variable. The mtrace command must execute
    normally for the data to be written. The mtrace command analyzes this file and
    lists unmatched allocations and deallocations.


    # A.2.4 Using cmmalloc


    The cmmalloc library diagnoses dynamic memory errors by replacing malloc and free
    with code tracing their use. If the program traces gracefully, it produces a report
    of memory leaks and other errors. The cmmalloc library was written by Armin Bierce.


    You''ll probably have to download and install the cmmalloc library yourself. Download
    it from http://www.inf.ethz.ch/personal/biere/projects/cmmalloc/, unpack the code
    and run configure. Run make and install, copy the cmmalloc.cfg file to the directory
    where you''ll run the program you want to check, and rename the copy to .cmmalloc.
    Now you are ready to use the tool.


    The program''s object files must be linked with cmmalloc''s library and the dynamic
    linking library. Append -cmmalloc -ld to link to your command, for instance.


    ```

    % gcc -g -Wpedantic malloc-use.c -o cmmalloc -cmmalloc -ldl

    ```


    Execute the program to produce a report. For example, running the malloc-use program
    to allocate but not deallocate memory produces the following report:


    ```

    ./cmmalloc-out does not contain valid symbols

    trying to find executable in current directory ...

    using symbols from ''cmmalloc-use''

    (to speed up this startup specify ''file cmmalloc-use''

    in the startup file ''.cmmalloc'')

    Please enter a command: a 12

    nPlease enter a command: q

    ```'
