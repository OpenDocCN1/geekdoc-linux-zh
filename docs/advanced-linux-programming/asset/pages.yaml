    As with shared memory segments, users of memory-mapped regions must establish
    and follow a protocol to avoid race conditions. For example, a semaphore can be
    used to prevent more than one process from accessing the mapped memory at one
    time. Alternatively, you can use fcntl to place a read or write lock on the file,
    as described in Section 8.3, "fcntl: Locks and Other File Operations," in Chapter
    8.


    #  5.3.4 Private Mappings


    Specifying MAP_PRIVATE creates a copy-on-write region. Any write to the region
    is reflected only in this process; others that map the same file will not see
    the changes. Instead of writing directly to a page shared by all processes, the
    process writes to a private copy of this page. All subsequent reading and writing
    by the process use this page.


    #  5.3.5 Other Uses for mmap


    The mmap call can be used for purposes other than interprocess communications.
    One common use is as a replacement for read and write. For example, rather than
    explicitly reading a file''s contents into memory, a program might map the file
    into memory and scan it memory reads. For some programs, this is more convenient
    and may also run faster than explicit file I/O operations.


    One advanced and powerful technique used by some programs is to build data structures
    (ordinary struct instances, for example) in a memory-mapped file. On a subsequent
    invocation, the program maps back into memory, and the data structures are restored
    to their previous state. Note, though, that pointers in these data structures
    will be invalid unless they point within the same mapped region of memory unless
    care is taken to map the file back into the same address region it occupied originally.


    Another handy is to map the special /dev/zero file into memory. That file, which
    is described in Section 6.5.2, "/dev/zero," of Chapter 6, "Devices," behaves as
    if it were an infinitely long file filled with 0 bytes. A program that needs a
    source of 0 bytes can mmap the file /dev/zero. Writes to /dev/zero are discarded,
    so the memory may be used for any purpose. Custom memory allocators often map
    /dev/zero to obtain chunks of preinitialized memory.'
