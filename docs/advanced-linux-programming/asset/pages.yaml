    # 2.1.7 Using Temporary Files


    Sometimes a program needs to make a temporary file, to store large data for a
    while or pass data to another program. On GNU/Linux systems, temporary files are
    stored in the /tmp directory. When using temporary files, you should be aware
    of the following pitfalls:


    +   - More than one instance of your program may be run simultaneously (by the
    same user or by different users). The instances use different filenames so that
    they don''t collide.

    - The file permissions of the temporary file should be set in such a way that
    unauthorized users cannot alter the program''s execution by modifying or replacing
    the temporary file.

    - Temporary filenames should be generated in a way that cannot be predicted externally;
    otherwise, an attacker can exploit the delay of testing whether a given name is
    already in use and opening a new temporary file.


    GNU/Linux provides functions, mkstemp and tmpfile, which take care of these issues
    for you (in addition to functions that don''t). Which you use depends on whether
    you plan to hand the temporary file to another program, and whether you want to
    use UNIX I/O (open, write, and so on) or the C library''s stream I/O functions
    (fopen, fprintf, and so on).'
