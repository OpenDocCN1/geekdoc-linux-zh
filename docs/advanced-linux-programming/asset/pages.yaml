    \ takes an int flag argument; if the flag is nonzero, the cleanup action is actually\
    \ performed as it is unregistered.\n\nThe program in Listing 4.8 shows how you\
    \ might use a cleanup handler to make sure that a dynamically allocated buffer\
    \ is cleaned up if the thread terminates.\n\n> Listing 4.8 (cleanup.c) Program\
    \ Fragment Demonstrating a Thread Cleanup Handler\n\n```\n#include <malloc.h>\n\
    #include <pthread.h>\n\n/* Allocate a temporary buffer. */\nvoid* allocate_buffer(size_t\
    \ size) {\n    return malloc(size);\n}\n\n/* Deallocate a temporary buffer. */\n\
    void deallocate_buffer(void* buffer) {\n    free(buffer);\n}\n\nvoid do_some_work\
    \ () {\n    /* Allocate a temporary buffer. */\n```\n\ncontinues"
