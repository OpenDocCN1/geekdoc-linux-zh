  md: '# 3.1 Looking at Processes


    This invocation of ps shows two processes. The first, bash, is the shell running
    on this terminal. The second is the running instance of the ps program itself.
    The first column, labeled PID, displays the process ID of each.

    For more detailed look at what''s running on your GNU/Linux system, invoke


    ```

    $ ps -e -o pid,ppid,command

    ```


    The -e option instructs ps to display all processes running on the system.

    -o pid,ppid,command option tells ps what information to show about each process—in
    this case, the process ID, the parent process ID, and the command running in this
    process.


    # ps Output Formats


    With the -o option to ps command, you can specify the information about processes
    that you want in the output as a comma-separated list. For example, ps -o pid,user,start_time,command
    displays the process ID, the name of the user owning the process, the wall clock
    time at which the process started, and the command running in it. See the man
    page for ps for the full list of field codes.

    You can use the -f (full listing), -l (long listing), or -j (lobs listing) options
    to get three different listing formats.


    Here are the first few lines and last few of output from this command on my system.

    You may see different output, depending on what''s running on your system.


    ```

    $ ps -e -o pid,ppid,command

    PID PPID COMMAND

    1 @init [5]

    2 1 [kflushd]

    3 1 [kupdate]

    ...

    21725 21693 xterm

    21727 21725 bash

    21728 21725 ps -e -o pid,ppid,command

    ```


    Note that the parent process ID of the command, 21727, is the process ID of bash,
    the shell from which I invoked ps. The parent process ID of bash is in turn 21725,
    the process ID of the xterm program in which the shell is running.


    # 3.1.3 Killing a Process


    You can kill a running process with the kill command. Simply specify the command
    line ID of the process to be killed.


    The kill command works by sending a process SIGTERM, or termination, signal. This
    causes the process to terminate, unless the executing program explicitly handles
    or manages the SIGTERM signal. Signals are described in Section 3.3, "Signals."


    +   1. You also use the kill command to send other signals to a process. This
    is described in Section 3.4, "Process Termination."'
