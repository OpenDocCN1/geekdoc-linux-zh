  md: '# 220 Chapter 11 A Sample GNU/Linux Application


    +   - Modules are not linked statically to the server executable. Instead, they
    are loaded dynamically from shared libraries. Modules can be added, removed, or
    replaced while the server is running.

    - The server services each connection in a child process. This enables the server
    to remain responsive even when individual requests take a while to complete, and
    it shields the server from failures in modules.

    - The server does not require superuser privilege to run (as long as it is not
    on a privileged port). However, this limits the system information that it can
    collect.


    We provide four sample modules that demonstrate how modules might be written.
    They further illustrate some of the techniques for gathering system information
    presented previously in this book. The time module demonstrates using the gettimeofday
    system call. The issue module demonstrates low-level I/O and the sendfile system
    call. The diskfree module demonstrates the use of fork, exec, and dup2 by running
    a command in a child process. The processes module demonstrates the use of the
    /proc file system and various system calls.


    # 11.1.1 Caveats


    This program has many of the features you''d expect in an application program,
    such as command-line parsing and error checking. At the same time, we''ve made
    some simplifications to improve readability and to focus on the GNU/Linux-specific
    topics discussed in this book. Bear in mind these caveats as you examine the code.


    +   - We don''t attempt to provide a full implementation of HTTP. Instead, we
    implement just enough for the server to interact with Web clients. A real-world
    program would provide a more complete HTTP implementation or interface with one
    of the various excellent Web server implementations available instead of providing
    HTTP services directly.

    - Similarly, we don''t aim for full compliance with HTML specifications (see http://www.w3.org/Markup/).
    We generate simple HTML output that can be handled by Web browsers.

    - The server is not tuned for high performance or minimum resource usage. In particular,
    we intentionally omit some of the network configuration code that you would expect
    in a Web server. This topic is outside the scope of this book. See one of the
    many excellent references on network application development, such as UNIX Network
    Programming, Volume 1: Networking APIs—Sockets and XTI, by W. Richard Stevens
    (Prentice Hall, 1997), for more information.


    1. The most popular open source Web server for GNU/Linux is the Apache server,
