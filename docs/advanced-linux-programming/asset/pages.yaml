    # 1.5.3 Header Files


    You can learn alot about the system functions that are available and how to use
    them by looking at the system header files. These reside in /usr/include and /usr/include/sys.
    If you are getting compile errors using a system call, take a look in the corresponding
    header file to verify that the function''s signature is the same as what''s listed
    in the man page.


    On Linux systems, all of the nitty-gritty details of how the system calls work
    are reflected in header files in the directories /usr/include/bits, /usr/include/asm,
    and For instance, the numerical values of signals (described in Section 3.3, "Signals,"
    in Chapter 3, "Processes") are defined in /usr/include/bits/signal.h. These header
    files make good reading for inquiring minds. Don''t include them directly in your
    programs, though; always use the header files in /usr/include or as mentioned
    in the man page for the function you''re using.


    # 1.5.4 Source Code


    This is Open Source, right? The final arbiter of how the system works is the system
    source code itself, and luckily for Linux programmers, source code is freely available.
    Chances are, your Linux distribution includes source code for the entire system
    and all programs you''re entitled to with; if not, use the GNU General Public
    License to request it from the distributor. (The source code might not be installed
    on your disk, though. See your distribution''s documentation for instructions
    on installing it.)


    The source code for the Linux kernel itself is usually stored under /usr/src/linux.
    If this book leaves you thirsting for details of how processes, shared memory,
    and system devices work, you can always learn straight from the source code. Most
    of the system functions described in this book are implemented in the GNU C library;
    check your distribution''s documentation for the location of the C library source
    code.'
