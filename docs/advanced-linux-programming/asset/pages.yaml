  md: '# 1.1 Editing with Emacs


    An editor is the program that you use to edit source code. Lots of different editors
    are available for Linux, but the most popular and full-featured editor is probably
    GNU Emacs.


    # About Emacs


    Emacs is much more than an editor. It is an incredibly powerful program, so much
    so that at CodeSourcery, it is affectionately known as the One True Program; or
    just the OTP for short. You can read and send email from Emacs, and you can customize
    and extend Emacs in ways far too numerous to discuss here. You can even browse
    the Web from Emacs!


    If you''re unfamiliar with another editor, you can certainly use it instead. Nothing
    in the rest of this book depends on using Emacs. If you don''t already have a
    favorite Linux editor, then you should follow along with the mini-tutorial given
    here.


    If you like Emacs and want to learn about its advanced features, you might consider
    reading one of the many Emacs books available. One excellent tutorial, Learning
    Emacs, is written by Deane Cameron, Bill Rosenblatt, and Eric S. Raymond (O''Reilly,
    1996).


    # 1.1.1 Opening a C or C++ Source File


    You can start Emacs by typing emacs in your terminal and pressing the Return key.
    When Emacs has started, you can use the menus at the top to create a new source
    file. Click the Files menu, choose Open Files, and then type the name of the file
    that you want to open in the “minibuffer” at the bottom of the screen. If you
    want to create a C source file, use a filename that ends in .c or .h. If you want
    to create a C++ source file, use a filename that ends in .cpp, .hpp, .cxx, .hxx,
    .G or .H. When the file is open, you can type it as you would in any ordinary
    word-processing program. To save the file, choose the Save Buffer entry in the
    Files menu. When you''re finished using Emacs, you can choose the Exit Emacs option
    on the Files menu.


    If you don''t like to point and click, you can use keyboard shortcuts to automatically
    open files, save, and exit. To open a file, use C-x f (The C-x means to hold down
    the Control key and then press the x key). To save a file, press C-x C-s. To exit
    Emacs, just type C-x C-c. If you want to get a little better acquainted with Emacs,
    choose the Emacs Tutorial on the Help menu. The tutorial provides you with lots
    of tips on how to use Emacs effectively.


    If you''re not running in an X Window system, you''ll have to press F10 to access
    the menus.'
