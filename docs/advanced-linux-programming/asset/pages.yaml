    # 5.4.3 Redirecting the Standard Input, Output, and Error Streams


    Frequently, you''ll want to create a child process and set up one of the pipe
    as its standard input or standard output. Using the dup2 call, you can equate
    one file descriptor with another. For example, to redirect a process''s standard
    input to a file descriptor fd, use this line:


    ```

    dup2(fd, STDIN_FILENO);

    ```


    The symbolic constant STDIN_FILENO represents the file descriptor for the standard
    input, which has the value 0. The call closes standard input and reopens it as
    a duplicate of fd so that the two may be used interchangeably. Equated file descriptors
    share the same file position and the same set of file status flags. Thus, characters
    read from fd are not reread from standard input.'
