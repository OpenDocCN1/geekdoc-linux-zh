  md: '# 1.2 Compiling with GCC


    There''s also one header file called reciprocal.hpp (see Listing 1.3).


    +   Listing 1.3 (reciprocal.hpp) Header file—reciprocal.hpp


    ```

    #ifdef __cplusplus

    extern "C" {

    #endif


    extern double reciprocal (int i);


    #ifdef __cplusplus

    )

    #endif

    ```


    The first step is to turn the C and C++ source code into object code.


    # 1.2.1 Compiling a Single Source File


    The name of the compiler is gcc. To compile a C source file, you use the -c option.
    So, for example, entering this at the command prompt compiles the main.c source
    file:


    ```

    gcc -c main.c

    ```


    The resulting object file is named main.o.

    The++ compiler is called g++. Its operation is very similar to gcc; reciprocal.cpp
    is accomplished by entering the following:


    ```

    gcc -c reciprocal.cpp

    ```


    The -c option tells gcc to compile the program to an object file only; without
    it, g++ will attempt to link the program to produce an executable. After you''ve
    typed this command, you''ll have an object file called reciprocal.o.

    You''ll probably need a couple other options to build any reasonably large program.
    The -I option is used to tell GCC where search for header files. By default, GCC
    looks in the current directory and in the directories where headers for the standard
    libraries are installed. If you need to include header files from somewhere else,
    you''. For example, suppose that your project has one directory called src, for
    source files, and another called include. You would compile reciprocal.cpp like
    this to ensure that gcc uses the ../include directory in addition to find reciprocal.hpp:


    ```

    gcc -I../include reciprocal.cpp

    ```'
