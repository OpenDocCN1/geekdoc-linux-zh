  md: '# 132 Chapter 6 Devices


    Remember that only superuser processes can create block and character devices,
    so you must be logged in as root to invoke this command successfully.


    The ls1 command displays device entries specifically. If you invoke -l or -o options,
    the first character on each line of output specifies the type of the entry. Recall
    that - (a hyphen) designates a normal file, while d designates a character. Similarly,
    b designates a block device, and c designates a character device. For the latter
    two, ls prints the major and minor device numbers where it would the size of an
    ordinary file. For example, we can display the block device that we created:


    ```

    crw-r---- 1 root      6, 0 Mar 7 17:03 1p0

    ```


    In a program, you can determine whether a file system is a block or character
    device and then retrieve its device numbers using stat. See Section B.2, “stat,”
    in Appendix B, for instructions.


    To remove the entry, use rm. This doesn’t remove the device or device driver;
    simply removes the device entry from the file system.


    ```

    % rm /1p0

    ```


    # 6.3.1 The /dev Directory


    By convention, a GNU/Linux system includes a directory /dev containing the full
    complement of character and block device entries for devices that Linux knows.
    Entries in /dev have standardized names corresponding to major and minor device
    numbers.


    For example, the master device attached to the primary IDE controller, which has
    major and minor device numbers 3 and 0, has the standard name /dev/hda. If this
    device supports partitions, the first partition on it, which has device no. 1,
    has the standard name /dev/hda1. You can check that this is true on your system:


    ```

    % ls -l /dev/hda /dev/hda1

    brw-r---- 1 root      disk      3, 0 May 5 1998 /dev/hda

    brw-r---- 1 root      disk      3, 1 May 5 1998 /dev/hda1

    ```


    Similarly, /dev has an entry for the parallel port character device that we used
    previously:


    ```

    % ls -l /dev/1p0

    crw-r---- 1 root      daemon    6, 0 May 5 1998 /dev/1p0

    ```


    In most cases you should not use mknod to create your own device entries. The
    entries in /dev instead. Non-superuser programs have no choice but to use preexisting
    entries because they cannot create their own. Typically, only system administrators
    and developers working with specialized hardware devices will need to create device
    entries. Most GNU/Linux distributions include facilities to help system administrators
    create standard device entries with the correct names.'
