  md: '# 5.4 Pipes


    A pipe is a communication device that permits unidirectional communication. Data
    written to the "write end" of the pipe is read back from the "read end." Pipes
    are serial devices; the data is always read from the pipe in the same order it
    was written. Serially, a pipe is used to communicate between two threads in a
    single process or between parent and child processes.


    In a shell, the symbol | creates a pipe. For example, this shell command causes
    the shell to produce two child processes, for 1 ls and for 1 less:


    +   - 1 ls | less


    The shell also creates a pipe connecting the standard output of the ls subprocess
    with the standard input of the less process. The filenames are listed by ls are
    sent to less in the exact same order as if they were sent directly to the terminal.


    A pipe''s data capacity is limited. If the writer process writes faster than the
    reader process consumes the data, and if the pipe cannot store more data, the
    writer process blocks until more capacity becomes available. If the reader tries
    to read but no data is available, it blocks until data becomes available. Thus,
    the pipe automatically synchronizes the two processes.


    # 5.4.1 Creating Pipes


    To create a pipe, invoke the pipe command. Supply an integer array of size 2.
    The call to pipe stores the reading file descriptor in array position 0 and the
    writing file descriptor in position 1. For example, consider this code:


    ```

    int pipe_fds[2];nint read_fd;

    int write_fd;


    pipe(pipe_fds);

    read_fd = pipe_fds[0];

    write_fd = pipe_fds[1];

    ```


    Data written to the file descriptor read_fd can be read back from write_fd.


    # 5.4.2 Communication Between Parent and Child Processes


    A call to pipe creates file descriptors, which are valid only within that process
    and its children. however, when the process calls fork, file descriptors are copied
    to the new child process. Thus, pipes can connect only related processes.


    In the program Listing 5.7, a fork spawns a child process. The child inherits
    the pipe file descriptors. The parent writes a string to the pipe, and the child
    reads it out. The sample program converts these file descriptors into FILE streams
    using fdopen. Because we use streams rather than file descriptors, we can use
    the higher-level C library I/O functions as printf and fgets.'
