  md: "# 2.2 Coding Defensively\n\nSuppose, for example, that you call a function,\
    \ do_something, repeatedly in a loop. The do_something function returns zero on\
    \ success and nonzero on failure, you do not expect it to ever fail in your program.\
    \ You might be tempted to write:\n\n```\nfor (i = 0; i < 100; ++i)\n    assert\
    \ (do_something() == 0);\n```\n\nHowever, you might find that this runtime check\
    \ imposes too large a performance penalty and decide later to recompile with DEBUG\
    \ defined. This will remove the assert entirely, so the expression will never\
    \ be evaluated and do_something will never be called. You should write this instead:\n\
    \n```\nfor (i = 0; i < 100; ++i)\n    int status = do_something();\n    assert\
    \ (status == 0)\n```\n\nAnother thing to keep in mind is that you should not use\
    \ assert to test for invalid user input. Users do not like it when applications\
    \ simply crash with a cryptic error message, even in response to invalid input.\
    \ You should still check for invalid input and produce sensible error messages\
    \ in response input. Use assert for internal runtime checks.\n\nSome good places\
    \ to use assert are:\n\n+   - Check against null pointers, for instance, as invalid\
    \ function arguments. The error message generated by {assert (pointer l1 = NULL)}\n\
    \  Assertion 'pointer l1 == ((void*)0)' failed.\n\nis more informative than the\
    \ error message that would result if your program dereferenced a null pointer:\n\
    \n```\nSegmentation fault (core dumped)\n```\n\n+   - Check conditions on function\
    \ parameter values. For instance, if a function should be called only with a positive\
    \ value for parameter foo, use this at the beginning of the function body:\n \
    \ assert (foo > 0);\n\nThis will help you detect misuses of the function, and\
    \ it also makes it very clear to someone reading the function's source code that\
    \ there is a restriction on the parameter's value.\n\nDon't hold back; use assert\
    \ liberally throughout your programs."
