  md: '# 8.3 fcntl: Locks and Other File Operations 171


    # 8.3 fcntl: Locks and Other File Operations


    The fcntl system call is the access point for several advanced operations on file
    descriptors. The first argument to fcntl is an open file descriptor, and the second
    is a value that indicates which operation is to be performed. For some operations,
    fcntl takes an additional argument. We describe here one of the most useful fcntl
    operations, locking. See the fcntl manual page for information about the others.


    The fcntl system allows a program to place a read lock or a write lock on a file,
    somewhat analogous to the mutex locks in Chapter 5, "Interprocess Communication."
    A read lock is placed on a readable file descriptor, and a write lock is placed
    on a writable file descriptor. Not more than one process may hold a read lock
    on the same file at the same time, but only one process may hold a write lock,
    and the same file may not be locked for read and locked for write. Note that a
    lock does not actually prevent other processes from opening the file, reading
    from it, or writing to it, unless they acquire locks with fcntl as.


    To place a lock on a file, first create and zero out a struct flock variable.
    The l_type of the structure is F_RDLOCK for a read lock or F_WRLCK for a write
    lock. Then call fcntl, passing a descriptor to the file, the F_SETLKW operation
    code, and a pointer to the flock variable. If another process holds a lock that
    prevents a new lock from being acquired, fcntl blocks until that lock is released.


    The program in Listing 8.2 opens a file for writing whose name is provided on
    the command line, and places a write lock on it. The program waits for the user
    to hit Enter and then unlocks and closes the file.


    # Listing 8.2 (lock-file.c) Create a Write Lock with fcntl


    ```

    #include <fcntl.h>

    #include <stdio.h>

    #include <string.h>

    #include <unistd.h>


    int main (int argc

    ```


    continues'
