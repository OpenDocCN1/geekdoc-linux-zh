    # 第 18 章 系统性能监控


    ### 章节概述

    本章介绍了用于监控系统性能的常用 Linux 命令，包括 CPU、网络和磁盘使用情况。这些工具提供了实时数据，用于诊断系统问题、优化资源使用和排除性能瓶颈。熟练掌握这些命令有助于确保应用程序运行顺畅并管理资源。


    ### 章节目标

    - 学习使用 `perf` 监控应用性能，使用 `nload` 和 `iftop` 监控网络使用，以及使用 `iotop` 监控磁盘 I/O。

    - 理解如何使用 `mpstat` 分析每个处理器 CPU 使用情况。

    - 掌握跟踪和诊断性能问题的技能，通过明智的调整来优化系统性能。


