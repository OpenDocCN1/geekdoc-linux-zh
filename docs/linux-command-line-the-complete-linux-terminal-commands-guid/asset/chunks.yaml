  trans: "\n\n# 检查端口占用：识别开放端口和关联进程。\n\n## 语法\n```\nnetstat [options]\n```\n\n## 语法解释\n\
    - `netstat`: 显示网络统计信息的命令。\n- `[options]`: 常用选项包括：\n    - `-a`: 显示所有连接和监听端口。\n\
    \    - `-t`: 显示 TCP 连接。\n    - `-u`: 显示 UDP 连接。\n\n##get 代码示例\n```\nnetstat -a\n\
    ```\n\n## 代码示例解释\n1. 列出系统上所有活跃连接和监听端口。\n\n## 常见错误与解决方案\n- 错误：`netstat`: command\
    \ not found\n- 解决方案：在较新的系统上使用 `ss` 或安装 `net-tools`。\n\n## 注意\n- 在许多 Linux 发行版中，`netstat`\
    \ 已被 `ss` 取替用于网络统计。\n\n## 警告\n- 没有足够的权限运行 `netstat` 可能会限制输出详情。\n\n***\n\n# 7.\
    \ traceroute - 跟踪数据包到网络主机的路径\n\n## 什么是 traceroute\n`traceroute` 命令显示数据包从你的系统到远程主机的路径。它显示每个跳数以及数据包到达每个跳数所需的时间。\n\
    \n## 用\n- **网络路径分析**：识别系统与目标之间数据包的路径和延迟。\n- **故障排除**：检测网络瓶颈或不可达的分段。\n\n## 语法\n\
    ```\ntraceroute [hostname]\n```\n\n## 语法解释\n- `traceroute`: 跟踪网络路由的命令。\n- `[hostname]`:\
    \ 目标主机域名或 IP 地址。\n\n## 代码示例\n```\ntraceroute google.com\n```\n\n## 代码示例解释\n1.\
    \ 显示通往 `google.com` 路径上的每一跳，显示每一步的路由和延迟。\n\n## 常见错误与解决方案\n- 错误：`traceroute`: command\
    \ not found\n- 解决方案：通过软件包管理器安装 `traceroute`。\n\n## 注意\n- 防火墙可能会拦截 `traceroute`\
    \ 包，导致结果不完整。\n\n## 警告\n- 向目标发送大量的 `traceroute` 请求被视为可疑活动。\n\n***\n\n# 8. nslookup\
    \ - 查询 DNS 服务器\n\n## 什么是 nslookup\n`nslookup` 命令查询 DNS 服务器以将域名解析为 IP 地址，或反之。它对于排查\
    \ DNS 问题很有用。\n\n## 用\n- **DNS 解析**：将域名转换为 IP 地址反反之。\n- **排除 DNS 问题**：检查 DNS 服务器是否正确解析域名。\n\
    \n## 语法\n```\nnslookup [hostname]\n```\n\n## 语法解释\n- `nslookup`: 查询 DNS 记录的命令。\n\
    - `[hostname]`：要解析的域名，或用于反查的 IP 地址。\n\n## 代码示例\n```\nnslookup example.com\n```\n\
    \n## 代码示例解释\n1. 查询 DNS 服务器将 `example.com` 解析为其 IP 地址。\n\n## 常见错误与解决方案\n- 错误：`nslookup`:\
    \ command not found\n- 解决方案：安装 `dnsutils` 或 `bind-utils` 软件包。\n\n## 注意\n- `nslookup`\
    \ 用于识别 DNS 问题或验证域名配置。\n\n## 警告\n- 使用未知域名要谨慎，以避免安全风险。\n\n## 章 – 8 磁盘与文件系统管理\n\n\
    ## 章节概述\n本章涵盖了管理磁盘、分区和文件系统的基本 Linux 命令。这些命令允许用户创建、格式化、挂载和压缩文件，实现有效的磁盘和数据管理。对于负责磁盘组织和数据处理的系统管理员来说，掌握这些命令至关重要。\n\
    \n## 章节目标\n- 学习如何分区磁盘、创建文件系统和管理挂载。\n- 理解文件压缩和归档命令以高效存储数据。\n- 获得管理磁盘空间和处理海量数据的技能。\n\
    \n## 语法表格\n| 序号 | 命令 | 语法 | 示例 |\n| :--- | :--- | :--- | :--- |\n| 1 | 分区表操作 |\
    \ `fdisk [device]` | `fdisk /dev/sda` |\n| 2 | 分区管理 | `parted [device]` | `parted\
    \ /dev/sda` |\n| 3 | 创建文件系统 | `mkfs [options] [device]` | `mkfs.ext4 /dev/sda1`\
    \ |\n| 4 | 挂载文件系统 | `mount [device] [directory]` | `mount /dev/sda1 /mnt` |\n\
    | 5 | 卸载文件系统 | `umount [device/directory]` | `umount /mnt` |\n| 6 | 归档多个文件 | `tar\
    \ [options] [archive_name] [files]` | `tar -cvf archive.tar /path/to/files` |\n\
    | 7 | 压缩文件 | `tar [options] [archive_name] [files]` | `tar -czf archive.tar /path/to/files`\
    \ |\n| 8 | 解压文件 | `tar [options] [archive_name] [files]` | `tar -xvf archive.tar\
    \ /path/to/files` |\n| 9 | 列出文件 | `tar [options] [archive_name] [files]` | `tar\
    \ -tvf archive.tar /path/to/files` |\n| 10 | 添加到归档 | `tar [options] [archive_name]\
    \ [files]` | `tar -rvf archive.tar /path/to/files` |\n\n***\n\n## 主题详情\n\n###\
    \ 1. fdisk - 分区表操作\n#### 什么是 fdisk\n`fdisk` 命令用于操作分区表。它允许你创建、删除和修改分区。\n\n####\
    \ 语法\n```\nfdisk [device]\n```\n\n#### 语法解释\n- `fdisk`: 打开分区表的命令。\n- `[device]`:\
    \ 要管理的磁盘（例如 `/dev/sda`）。\n\n#### 代码示例\n```\nfdisk /dev/sda\n```\n\n#### 代码示例解释\n\
    1. 打开 `/dev/sda` 的分区表。\n\n#### 常见错误与解决方案\n- 错误：`fdisk`: command not found\n- 解决方案：安装\
    \ `utildisk` 软件包。\n\n#### 注意\n- `fdisk` 主要用于 MBR 分区表。\n\n#### 警告\n- 误用 `fdisk`\
    \ 可能会导致数据完全遗失。\n\n***\n\n### 2. parted - 分区管理\n#### 什么是 parted\n`parted` 命令用于管理分区，支持\
    \ MBR 和 GPT 分区表。\n\n#### 语法\n```\nparted [device]\n```\n\n#### 语法解释\n- `parted`:\
    \ 启动分区编辑器的命令。\n- `[device]`: 要管理的磁盘（例如 `/dev/sda`）。\n\n#### 代码示例\n```\nparted\
    \ /dev/sda\n```\n\n#### 代码示例解释\n1. 启动 `/dev/sda` 的分区编辑器，允许创建和调整分区大小。\n\n#### 常见错误与解决方案\n\
    - 错误：`parted`: /dev/sda: unrecognized disk label\n- 解决方案：在 `parted` 内使用 `mklabel`。\n\
    \n#### 注意\n- 对于超过 2 TB 的磁盘建议使用 `parted`。\n\n#### 警告\n- 如果处理不当，更改磁盘分区可能会导致数据丢失。\n\
    \n***\n\n### 3. mkfs - 创建文件系统\n#### 什么是 mkfs\n`mkfs` (make filesystem) 命令格式化分区，在其上创建新的文件系统。\n\
    \n#### 语法\n```\nmkfs [options] [device]\n```\n\n#### 语法解释\n- `mkfs`: 创建文件系统的命令。\n\
    - `[options]`: 指定文件系统类型（例如 `-t ext4`）。\n- `[device]`: 要格式化的分区（例如 `/dev/sda1`）。\n\
    \n#### 代码示例\n```\nmkfs.ext4 /dev/sda1\n```\n\n#### 代码示例解释\n1. 使用 `ext4` 文件系统格式化\
    \ `/dev/sda1` 分区，准备好使用。\n\n#### 常见错误与解决方案\n- 错误：`mkfs.ext4`: Permission denied\n\
    - 解决方案：使用 `sudo` 获取管理权限。\n\n#### 注意\n- 使用 `mkfs -t [type]` 指定文件系统类型。\n\n#### 警告\n\
    - 运行 `mkfs` 将擦除分区上的所有数据；请务双检查设备。\n\n***\n\n### 4. mount - 挂载文件系统\n#### 什么是 mount\n\
    `mount` 命令将文件系统挂载到指定的目录，以便访问。\n\n#### 语法\n```\nmount [device] [directory]\n```\n\
    \n#### 语法解释\n- `mount`: 挂载文件系统的命令。\n- `[device]`: 要挂载的分区（例如 `/dev/sda1`）。\n- `[directory]`:\
    \ 挂载点（例如 `/mnt`）。\n\n#### 代码示例\n```\nmount /dev/sda1 /mnt\n```\n\n#### 代码示例解释\n\
    1. 将 `/dev/sda1` 分区挂载到 `/mnt` 目录。\n\n"
- fmt: "\n# Temporary Storage Access: Temporarily mounts devices like USBs.\n\n##\
    \ Syntax\n```\nmount [device] [directory]\n```\n\n## Syntax Explanation\n- `mount`:\
    \ Command to attach a filesystem.\n- `[device]`: The device or partition to mount\
    \ (e.g., `/dev/sda1`).\n- `[directory]`: The directory to mount to (e.g., `/mnt`).\n\
    \n## Simple Code Example\n```\nmount /dev/sda1 /mnt\n```\n\n## Code Example Explanation\n\
    1. Mounts the `/dev/sda1` partition to the `/mnt` directory, making its files\
    \ accessible at `/mnt`.\n\n## Common Errors and Solutions\n- Error: `mount: only\
    \ root can do that`\n- Solution: Run `sudo mount` for administrative privileges.\n\
    \n## Notes\n- Check `/etc/fstab` for persistent mounts that load on boot.\n\n\
    ***\n\n# 5. umount - Unmount a Filesystem\n\n## What is umount\nThe `umount` command\
    \ detaches a mounted filesystem, ensuring data integrity before device removal.\n\
    \n## Use Purpose\n- Detach Filesystems: Safely unmounts devices.\n- Prevent Data\
    \ Loss: Ensures all data is written before removal.\n\n## Syntax\n```\numount\
    \ [device/directory]\n```\n\n## Syntax Explanation\n- `umount`: Command to unmount\
    \ a filesystem.\n- `[device/directory]`: Specifies the device or mount point to\
    \ unmount.\n\n## Simple Code Example\n```\numount /mnt\n```\n\n## Code Example\
    \ Explanation\n1. Unmounts the filesystem mounted at `/mnt`, safely detaching\
    \ the device.\n\n## Common Errors and Solutions\n- Error: `umount: target is busy`\n\
    - Solution: Close open files and use `lsof` to identify processes using the mount.\n\
    \n## Notes\n- Always unmount USB drives and external storage to prevent data corruption.\n\
    \n## Warnings\n- Force unmounting with `-l` may lead to data loss; use with caution.\n\
    \n***\n\n# 6. tar - Archive Multiple Files\n\n## What is tar\nThe `tar` command\
    \ bundles multiple files into a single archive file, preserving directory structure\
    \ and file permissions.\n\n## Use Purpose\n- File Archiving: Groups multiple files\
    \ for easier handling.\n- Backup Creation: Creates compressed backups with optional\
    \ compression.\n\n## Syntax\n```\ntar [options] [archive_name] [files]\n```\n\n\
    ## Syntax Explanation\n- `tar`: Command to create or extract archives.\n- `[options]`:\
    \ Common options include:\n    - `-c`: Creates a new archive.\n    - `-v`: Verbose,\
    \ shows file names.\n    - `-f`: Specifies archive filename.\n- `[archive_name]`:\
    \ Name of the output archive (e.g., `backup.tar`).\n- `[files]`: Files or directories\
    \ to include in the archive.\n\n## Simple Code Example\n```\ntar -cvf archive.tar\
    \ /path/to/files\n```\n\n## Code Example Explanation\n1. Creates an archive named\
    \ `archive.tar` containing the files in `/path/to/files`.\n\n## Common Errors\
    \ and Solutions\n- Error: `tar: Permission denied`\n- Solution: Run with `sudo`\
    \ or check directory permissions.\n\n## Notes\n- Use `-z` to compress with `gzip`,\
    \ creating `.tar.gz`.\n\n## Warnings\n- Be careful with paths to avoid unintended\
    \ files in the archive.\n\n***\n\n# 7. gzip - Compress Files\n\n## What is gzip\n\
    The `gzip` command compresses files using the `gzip` algorithm, reducing file\
    \ sizes.\n\n## Use Purpose\n- File Compression: Reduces file sizes for storage\
    \ or transfer.\n- Space Management: Frees up disk space by compressing files.\n\
    \n## Syntax\n```\ngzip [file]\n```\n\n## Syntax Explanation\n- `gzip`: Command\
    \ to compress files.\n- `[file]`: Specifies the file to compress (e.g., `file.txt`).\n\
    \n## Simple Code Example\n```\ngzip file.txt\n```\n\n## Code Example Explanation\n\
    1. Compresses `file.txt`, resulting in `file.txt.gz`.\n\n## Common Errors and\
    \ Solutions\n- Error: `gzip: file.txt.gz exists`\n- Solution: Use `-f` to overwrite\
    \ if needed.\n\n## Notes\n- `gzip` deletes the original file by default after\
    \ compression.\n\n## Warnings\n- Decompress files with `gunzip` if you need to\
    \ restore the original format.\n\n***\n\n# 8. gunzip - Decompress Files\n\n##\
    \ What is gunzip\nThe `gunzip` command decompresses files compressed with `gzip`,\
    \ restoring them to their original format.\n\n## Use Purpose\n- File Decompression:\
    \ Restores compressed files for use.\n- Space Recovery: Expands compressed files\
    \ back to original.\n\n## Syntax\n```\ngunzip [file]\n```\n\n## Syntax Explanation\n\
    - `gunzip`: Command to decompress files.\n- `[file]`: Specifies the `.gz` file\
    \ to decompress (e.g., `file.txt.gz`).\n\n## Simple Code Example\n```\ngunzip\
    \ file.txt.gz\n```\n\n## Code Example Explanation\n1. Decompresses `file.txt.gz`,\
    \ restoring it to `file.txt`.\n\n## Common Errors and Solutions\n- Error: `gunzip:\
    \ file.txt exists`\n- Solution: Use `-f` to overwrite existing files if needed.\n\
    \n## Notes\n- Use `gzip -d` as an alternative to decompress files.\n\n## Warnings\n\
    - Ensure sufficient disk space is available for decompression.\n\n***\n\n# 9.\
    \ bzip2 - Compress Files Using the bzip2 Algorithm\n\n## What is bzip2\nThe `bzip2`\
    \ command compresses files using the `bzip2` algorithm, achieving high compression\
    \ ratios.\n\n## Use Purpose\n- Enhanced Compression: Compresses files with higher\
    \ efficiency than `gzip`.\n- Space Management: Reduces file sizes for storage\
    \ or transfer.\n\n## Syntax\n```\nbzip2 [file]\n```\n\n## Syntax Explanation\n\
    - `bzip2`: Command to compress files.\n- `[file]`: Specifies the file to compress\
    \ (e.g., `file.txt`).\n\n## Simple Code Example\n```\nbzip2 file.txt\n```\n\n\
    ## Code Example Explanation\n1. Compresses `file.txt`, resulting in `file.txt.bz2`.\n\
    \n## Common Errors and Solutions\n- Error: `bzip2: file.txt.bz2 exists`\n- Solution:\
    \ Use `-f` to force overwrite if needed.\n\n## Notes\n- Use `bunzip2` to decompress\
    \ `.bz2` files.\n\n## Warnings\n- `bzip2` compresses slowly but results in smaller\
    \ file sizes.\n\n***\n\n# 10. zip/unzip - Compress and Decompress ZIP Files\n\n\
    ## What is zip/unzip\nThe `zip` command compresses files into ZIP format, and\
    \ `unzip` decompresses ZIP files. ZIP format is widely used for cross-platform\
    \ compatibility.\n\n## Use Purpose\n- Cross-Platform Compression: ZIP files are\
    \ compatible with most operating systems.\n- Easy File Management: Bundles multiple\
    \ files and directories into one compressed file.\n\n## Syntax\n```\nzip [options]\
    \ [archive.zip] [files]\nunzip [options] [archive.zip]\n```\n\n## Syntax Explanation\n\
    - `zip`: Command to compress files into a ZIP archive.\n- `[options]`: Common\
    \ options include:\n    - `-r`: Recursively add files in a directory.\n- `[archive.zip]`:\
    \ Name of the output archive.\n- `[files]`: Files or directories to compress.\n\
    - `unzip`: Command to decompress files.\n\n## Simple Code Example\n```\nzip archive.zip\
    \ file1 file2\nunzip archive.zip\n```\n\n## Code Example Explanation\n1. Creates\
    \ `archive.zip` containing `file1` and `file2`.\n2. Extracts `archive.zip`, restoring\
    \ `file1` and `file2`.\n"
  raw: '●      Temporary Storage Access: Temporarily mounts devices like USBs.


    #### Syntax


    mount [device]  [directory]


    #### Syntax Explanation


    ●      mount: Command to attach a filesystem.


    ○      [device]: The device or partition to mount (e.g.,  /dev/sda1).


    ○      [directory]: The directory to mount to (e.g.,  /mnt).


    #### Simple Code Example


    mount /dev/sda1 /mnt


    #### Code Example Explanation


    1.  Mounts the  /dev/sda1 partition to the  /mnt directory, making its files accessible
    at  /mnt.


    #### Common Errors and Solutions


    ●      Error:  mount: only root can do that


    ○      Solution: Run  sudo mount for administrative privileges.


    #### Notes


    ●      Check  /etc/fstab for persistent mounts that load on boot.


    * * *


    ### 5.  umount - Unmount a Filesystem


    #### What is  umount


    The  umount command detaches a mounted filesystem, ensuring data integrity before
    device removal.


    #### Use Purpose


    ●      Detach Filesystems: Safely unmounts devices.


    ●      Prevent Data Loss: Ensures all data is written before removal.


    #### Syntax


    umount [device/directory]


    #### Syntax Explanation


    ●      umount: Command to unmount a filesystem.


    ○      [device/directory]: Specifies the device or mount point to unmount.


    #### Simple Code Example


    umount /mnt


    #### Code Example Explanation


    1.  Unmounts the filesystem mounted at  /mnt, safely detaching the device.


    #### Common Errors and Solutions


    ●      Error:  umount: target is busy


    ○ Solution: Close open files and use  lsof to identify processes using the mount.


    #### Notes


    ●      Always unmount USB drives and external storage to prevent data corruption.


    #### Warnings


    ● Force unmounting with  -l may lead to data loss; use with caution.


    * * *


    ### 6.  tar - Archive Multiple Files


    #### What is  tar


    The  tar command bundles multiple files into a single archive file, preserving
    directory structure and file permissions.


    #### Use Purpose


    ●      File Archiving: Groups multiple files for easier handling.


    ●      Backup Creation: Creates compressed backups with optional compression.


    #### Syntax


    tar [options]  [archive_name]  [files]


    #### Syntax Explanation


    ●      tar: Command to create or extract archives.


    ○      [options]: Common options include:


    ■     -c: Creates a new archive.


    ■     -v: Verbose, shows file names.


    ■     -f: Specifies archive filename.


    ○      [archive_name]: Name of the output archive (e.g.,  backup.tar).


    ○      [files]: Files or directories to include in the archive.


    #### Simple Code Example


    tar -cvf archive.tar /path/to/files


    #### Code Example Explanation


    1.  Creates an archive named  archive.tar containing the files in  /path/to/files.


    #### Common Errors and Solutions


    ●      Error:  tar: Permission denied


    ○      Solution: Run with  sudo or check directory permissions.


    #### Notes


    ●      Use  -z to compress with gzip, creating  .tar.gz archives.


    #### Warnings


    ● Be careful with paths to avoid including unintended files in the archive.


    * * *


    ### 7.  gzip - Compress Files


    #### What is  gzip


    The  gzip command compresses files using the gzip compression algorithm, reducing
    file sizes.


    #### Use Purpose


    ●      File Compression: Reduces file sizes for storage or transfer.


    ●      Space Management: Frees up disk space by compressing files.


    #### Syntax


    gzip [file]


    #### Syntax Explanation


    ●      gzip: Command to compress files.


    ○      [file]: Specifies the file to compress (e.g.,  file.txt).


    #### Simple Code Example


    gzip file.txt


    #### Code Example Explanation


    1.  Compresses file.txt, resulting in  file.txt.gz.


    #### Common Errors and Solutions


    ●      Error:  gzip: file.txt.gz already exists


    ○      Solution: Use  -f to force overwrite if needed.


    #### Notes


    ●      gzip deletes the original file by default after compression.


    #### Warnings


    ● Decompress files with  gunzip if you need to restore the original format.


    * * *


    ### 8.  gunzip - Decompress gzip Files


    #### What is  gunzip


    The  gunzip command decompresses files compressed with gzip, restoring them to
    their original format.


    #### Use Purpose


    ●      File Decompression: Restores compressed files for use.


    ●      Space Recovery: Expands compressed files back to original form.


    #### Syntax


    gunzip [file]


    #### Syntax Explanation


    ●      gunzip: Command to decompress gzip files.


    ○      [file]: Specifies the  .gz file to decompress (e.g.,  file.txt.gz).


    #### Simple Code Example


    gunzip file.txt.gz


    #### Code Example Explanation


    1.  Decompresses file.txt.gz, restoring it to  file.txt.


    #### Common Errors and Solutions


    ●      Error:  gunzip: file.txt already exists


    ○      Solution: Use  -f to overwrite existing files if needed.


    #### Notes


    ●      Use  gzip -d as an alternative to decompress files.


    #### Warnings


    ●      Ensure sufficient disk space is available for decompression.


    * * *


    ### 9.  bzip2 - Compress Files Using the bzip2 Algorithm


    #### What is  bzip2


    The  bzip2 command compresses files using the  bzip2 algorithm, achieving high
    compression ratios.


    #### Use Purpose


    ●      Enhanced Compression: Compresses files with higher efficiency than gzip.


    ●      Space Management: Reduces file sizes for storage or transfer.


    #### Syntax


    bzip2 [file]


    #### Syntax Explanation


    ●      bzip2: Command to compress files.


    ○      [file]: Specifies the file to compress (e.g.,  file.txt).


    #### Simple Code Example


    bzip2 file.txt


    #### Code Example Explanation


    1.  Compresses file.txt, resulting in  file.txt.bz2.


    #### Common Errors and Solutions


    ●      Error:  bzip2: file.txt.bz2 already exists


    ○      Solution: Use  -f to force overwrite if needed.


    #### Notes


    ●      Use  bunzip2 to decompress  .bz2 files.


    #### Warnings


    ●      bzip2 compresses slowly but results in smaller file sizes.


    * * *


    ### 10.  zip/unzip - Compress and Decompress ZIP Files


    #### What is  zip/unzip


    The  zip command compresses files into ZIP format, and  unzip decompresses ZIP
    files. ZIP format is widely used for cross-platform compatibility.


    #### Use Purpose


    ●      Cross-Platform Compression: ZIP files are compatible with most operating
    systems.


    ● Easy File Management: Bundles multiple files and directories into one compressed
    file.


    #### Syntax


    zip [options]  [archive.zip]  [files]


    unzip [options]  [archive.zip]


    #### Syntax Explanation


    ●      zip: Command to compress files into a ZIP archive.


    ○      [options]: Common options include:


    ■     -r: Recursively add files in a directory.


    ○      [archive.zip]: Name of the output ZIP file.


    ○      [files]: Files or directories to compress.


    ●      unzip: Command to decompress ZIP files.


    #### Simple Code Example


    zip archive.zip file1 file2


    unzip archive.zip


    #### Code Example Explanation


    1.  Creates archive.zip containing  file1 and  file2.


    2.  Extracts archive.zip, restoring  file1 and  file2.


    ## Chapter – 9 Permissions & Ownership


    ### Chapter Overview


    This chapter covers essential Linux commands for managing file permissions, ownership,
    and user and group accounts. These commands allow users to control access to files,
    set default permissions, and manage user accounts and passwords. Understanding
    permissions and ownership is crucial for system security and effective access
    management.


    ### Chapter Goal


    ●      Learn to set file permissions and manage file ownership.


    ●      Understand how to create, modify, and delete user and group accounts.


    ● Gain skills to ensure secure and organized access to files and resources.


    ### Syntax Table


    | Serial No | Command | Syntax | Simple Example |


    | 1 | Change File Permissions | chmod [options] mode [file] | chmod 755 file.txt
    |


    | 2 | Change File Owner | chown [options] owner[:group] [file] | chown user1 file.txt
    |


    | 3 | Set Default Permissions | umask [mode] | umask 022 |


    | 4 | Create a New User | useradd [options] username | useradd newuser |


    | 5 | Modify a User Account | usermod [options] username | usermod -aG sudo newuser
    |


    | 6 | Delete a User Account | userdel [options] username | userdel newuser |'
