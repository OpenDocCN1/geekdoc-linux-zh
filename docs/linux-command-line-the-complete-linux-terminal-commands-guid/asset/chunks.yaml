    \ Syntax\n```\nnetstat [options]\n```\n\n## Syntax Explanation\n- `netstat`: Command\
    \ to display network statistics.\n- `[options]`: Common options include:\n   \
    \ - `-a`: Shows all connections and listening ports.\n    - `-t`: Displays TCP\
    \ connections.\n    - `-u`: Displays UDP connections.\n\n## Simple Code Example\n\
    ```\nnetstat -a\n```\n\n## Code Example Explanation\n1. Lists all active connections\
    \ and listening ports on the system.\n\n## Common Errors and Solutions\n- Error:\
    \ `netstat`: command not found\n- Solution: Use `ss` on newer systems or install\
    \ `net-tools`.\n\n## Notes\n- `netstat` has been replaced by `ss` on many Linux\
    \ distributions for network statistics.\n\n## Warnings\n- Running `netstat` without\
    \ sufficient permissions may restrict output details.\n\n***\n\n# 7. traceroute\
    \ - Trace the Route Packets Take to a Network Host\n\n## What is traceroute\n\
    The `traceroute` command shows the path packets take from your system to a remote\
    \ host. It displays each hop and the time taken for packets to reach each hop.\n\
    \n## Use Purpose\n- **Network Path Analysis**: Identify the path and delay of\
    \ packets between your system and the target.\n- **Troubleshoot Network Issues**:\
    \ Detect network bottlenecks or unreachable segments.\n\n## Syntax\n```\ntraceroute\
    \ [hostname]\n```\n\n## Syntax Explanation\n- `traceroute`: Command to trace the\
    \ network route.\n- `[hostname]`: The domain name or IP address of the target\
    \ host.\n\n## Simple Code Example\n```\ntraceroute google.com\n```\n\n## Code\
    \ Example Explanation\n1. Displays each hop along the path to `google.com`, showing\
    \ the route and latency at each step.\n\n## Common Errors and Solutions\n- Error:\
    \ `traceroute`: command not found\n- Solution: Install `traceroute` via your package\
    \ manager.\n\n## Notes\n- Firewalls may block `traceroute` packets, leading to\
    \ incomplete results.\n\n## Warnings\n- Excessive `traceroute` requests to a target\
    \ may be considered suspicious activity.\n\n***\n\n# 8. nslookup - Query DNS Servers\n\
    \n## What is nslookup\nThe `nslookup` command queries DNS servers to resolve domain\
    \ names to IP addresses, or vice versa. It is useful for troubleshooting DNS issues.\n\
    \n## Use Purpose\n- **DNS Resolution**: Converts domain names to IP addresses\
    \ and vice versa.\n- **Troubleshoot DNS Issues**: Checks if DNS servers resolve\
    \ domains correctly.\n\n## Syntax\n```\nnslookup [hostname]\n```\n\n## Syntax\
    \ Explanation\n- `nslookup`: Command to query DNS records.\n- `[hostname]`: The\
    \ domain name to resolve, or an IP address for reverse lookup.\n\n## Simple Code\
    \ Example\n```\nnslookup example.com\n```\n\n## Code Example Explanation\n1. Queries\
    \ DNS servers to resolve `example.com` to its IP address.\n\n## Common Errors\
    \ and Solutions\n- Error: `nslookup`: command not found\n- Solution: Install `dnsutils`\
    \ or `bind-utils` package.\n\n## Notes\n- `nslookup` is useful for identifying\
    \ DNS issues or verifying domain configuration.\n\n## Warnings\n- Use cautiously\
    \ with unknown domains to avoid security risks.\n\n## Chapter – 8 Disk & Filesystem\
    \ Management\n\n## Chapter Overview\nThis chapter covers essential Linux commands\
    \ for managing disks, partitions, and filesystems. These commands allow users\
    \ to create, format, mount, and compress files, enabling effective disk and data\
    \ management. Mastery of these commands is crucial for system administrators responsible\
    \ for disk organization and data handling.\n\n## Chapter Goal\n- Learn how to\
    \ partition disks, create filesystems, and manage mounts.\n- Understand file compression\
    \ and archiving commands for efficient data storage.\n- Gain skills to manage\
    \ disk space and handle large volumes of data.\n\n## Syntax Table\n| Serial No\
    \ | Command | Syntax | Simple Example |\n| :--- | :--- | :--- | :--- |\n| 1 |\
    \ Partition Table Manipulation | `fdisk [device]` | `fdisk /dev/sda` |\n| 2 |\
    \ Partition Management | `parted [device]` | `parted /dev/sda` |\n| 3 | Create\
    \ a Filesystem | `mkfs [options] [device]` | `mkfs.ext4 /dev/sda1` |\n| 4 | Mount\
    \ a Filesystem | `mount [device] [directory]` | `mount /dev/sda1 /mnt` |\n| 5\
    \ | Unmount a Filesystem | `umount [device/directory]` | `umount /mnt` |\n| 6\
    \ | Archive Multiple Files | `tar [options] [archive_name] [files]` | `tar -cvf\
    \ archive.tar /path/to/files` |\n| 7 | Compress Files | `tar [options] [archive_name]\
    \ [files]` | `tar -czf archive.tar /path/to/files` |\n| 8 | Decompress Files |\
    \ `tar [options] [archive_name] [files]` | `tar -xvf archive.tar /path/to/files`\
    \ |\n| 9 | List Files | `tar [options] [archive_name] [files]` | `tar -tvf archive.tar\
    \ /path/to/files` |\n| 10 | Add to Archive | `tar [options] [archive_name] [files]`\
    \ | `tar -rvf archive.tar /path/to/files` |\n\n***\n\n## Topic Details\n\n###\
    \ 1. fdisk - Partition Table Manipulation\n#### What is fdisk\nThe `fdisk` command\
    \ is used to manipulate partition tables. It allows you to create, delete, and\
    \ modify partitions.\n\n#### Syntax\n```\nfdisk [device]\n```\n\n#### Syntax Explanation\n\
    - `fdisk`: Command to open the partition table.\n- `[device]`: The disk to manage\
    \ (e.g., `/dev/sda`).\n\n#### Simple Code Example\n```\nfdisk /dev/sda\n```\n\n\
    #### Code Example Explanation\n1. Opens the partition table for `/dev/sda`.\n\n\
    #### Common Errors and Solutions\n- Error: `fdisk`: command not found\n- Solution:\
    \ Install `utildisk` package.\n\n#### Notes\n- `fdisk` is primarily used for MBR\
    \ partition tables.\n\n#### Warnings\n- Misuse of `fdisk` can lead to total data\
    \ loss.\n\n***\n\n### 2. parted - Partition Management\n#### What is parted\n\
    The `parted` command is used to manage partitions, supporting both MBR and GPT\
    \ partition tables.\n\n#### Syntax\n```\nparted [device]\n```\n\n#### Syntax Explanation\n\
    - `parted`: Command to start the partition editor.\n- `[device]`: The disk to\
    \ manage (e.g., `/dev/sda`).\n\n#### Simple Code Example\n```\nparted /dev/sda\n\
    ```\n\n#### Code Example Explanation\n1. Launches the partition editor for `/dev/sda`,\
    \ enabling partition creation and resizing.\n\n#### Common Errors and Solutions\n\
    - Error: `parted`: /dev/sda: unrecognized disk label\n- Solution: Use `mklabel`\
    \ within `parted`.\n\n#### Notes\n- `parted` is recommended for disks over 2 TB.\n\
    \n#### Warnings\n- Changing partitions on a disk may result in data loss if not\
    \ handled.\n\n***\n\n### 3. mkfs - Create a Filesystem\n#### What is mkfs\nThe\
    \ `mkfs` (make filesystem) command formats a partition, creating a new filesystem\
    \ on it.\n\n#### Syntax\n```\nmkfs [options] [device]\n```\n\n#### Syntax Explanation\n\
    - `mkfs`: Command to create a filesystem.\n- `[options]`: Specifies the filesystem\
    \ type (e.g., `-t ext4`).\n- `[device]`: The partition to format (e.g., `/dev/sda1`).\n\
    \n#### Simple Code Example\n```\nmkfs.ext4 /dev/sda1\n```\n\n#### Code Example\
    \ Explanation\n1. Formats the `/dev/sda1` partition with the `ext4` filesystem,\
    \ preparing it for use.\n\n#### Common Errors and Solutions\n- Error: `mkfs.ext4`:\
    \ Permission denied\n- Solution: Use `sudo` for administrative access.\n\n####\
    \ Notes\n- Use `mkfs -t [type]` to specify the filesystem type.\n\n#### Warnings\n\
    - Running `mkfs` will erase all data on the partition; double-check the device\
    \ before.\n\n***\n\n### 4. mount - Mount a Filesystem\n#### What is mount\nThe\
    \ `mount` command attaches a filesystem to a specified directory, making it accessible.\n\
    \n#### Syntax\n```\nmount [device] [directory]\n```\n\n#### Syntax Explanation\n\
    - `mount`: Command to attach a filesystem.\n- `[device]`: The partition to mount\
    \ (e.g., `/dev/sda1`).\n- `[directory]`: The mount point (e.g., `/mnt`).\n\n####\
    \ Simple Code Example\n```\nmount /dev/sda1 /mnt\n```\n\n#### Code Example Explanation\n\
    1. Attaches     the `/dev/sda1` partition to the `/mnt` directory.\n"
