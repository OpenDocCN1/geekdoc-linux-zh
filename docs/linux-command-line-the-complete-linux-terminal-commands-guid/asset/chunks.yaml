    ### 3. inotifywait - Monitor Filesystem Events (Useful for Watching File Changes)


    #### What is inotifywait

    The `inotifywait` command is part of the `inotify-tools` suite and allows users
    to monitor file system events, such as file modifications, deletions, or new files.
    It is useful for real-time monitoring and logging changes in specified directories.


    #### Use Purpose

    - File Change Monitoring: Watches specified directories for file changes.

    - Real-Time Alerts: Detects modifications, deletions, and other events as they
    happen.


    #### Syntax

    `inotifywait [options] [directory]`


    #### Syntax Explanation

    - `inotifywait`: Command to watch file system events.

    - `[options]`: Configures event monitoring, such as `-m` for continuous monitoring.

    - `[directory]`: The directory to watch for events (e.g., `/path/to/watch`).


    #### Simple Code Example

    ```

    inotifywait -m /path/to/watch

    ```


    #### Code Example Explanation

    1. Monitors the `/path/to/watch` directory continuously, displaying file events
    such as creation, modification, and deletion.


    #### Common Errors and Solutions

    - Error: `inotifywait`: command not found

    - Solution: Install `inotify-tools` using the package manager (e.g., `sudo apt
    install inotify-tools`).


    #### Notes

    - Use specific event flags, like `-e modify` or `-e delete`, to monitor only certain
    types of events.


    ***


    ### 4. df -h - Display Disk Usage in Human-Readable Format


    #### What is df -h

    The `df` command displays disk usage for file systems, showing used and available
    space. The `-h` option presents the information in a human-readable format, using
    units like KB, MB, or GB for clarity.


    #### Use Purpose

    - Disk Space Summary: Provides a quick summary of disk usage across file-systems.

    - Capacity Monitoring: Helps track available and used space to prevent full disks.


    #### Syntax

    `df -h`


    #### Syntax Explanation

    - `df`: Command to display disk usage.

    - `-h`: Option to show output in human-readable format (e.g., GB, MB).


    #### Simple Code Example

    ```

    df -h

    ```


    #### Code Example Explanation

    1. Displays disk usage of all mounted file systems in human-readable format, showing
    available, used, and total space.


    #### Common Errors and Solutions

    - Error: Incorrect output format.

    - Solution: Ensure the `-h` flag is used for human-readable output.


    #### Notes

    - Use `df -h /path/to/mount` to check disk usage for a specific mount point.


    #### Warnings

    - Output may include temporary filesystems like `tmpfs`, which may not reflect
    actual disk space.

