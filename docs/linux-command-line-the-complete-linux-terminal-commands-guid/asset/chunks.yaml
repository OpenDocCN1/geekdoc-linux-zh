    \n***\n\n### 3. sort - 按字母或数字顺序排序文本\n\n#### 什么是 sort\n\n`sort` 命令按字母或数字顺序对文件中的行进行排序。\n\
    \n#### 用途\n\n- 字母或数字排序：按升序或降序排列组织行。\n\n#### 语法\n\n```\nsort [options] [filename]\n\
