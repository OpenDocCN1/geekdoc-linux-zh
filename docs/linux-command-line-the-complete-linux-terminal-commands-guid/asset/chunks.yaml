    ### 3.  df - Show Disk Space Usage


    #### What is  df


    The  df (disk free) command displays the amount of disk space available on the
    filesystem, showing usage and free space for each mounted partition.


    #### Use Purpose


    ● Monitor Disk Usage: Check available and used disk space across mounted filesystems.


    ●      System Health Check: Identify storage bottlenecks or partitions close to
