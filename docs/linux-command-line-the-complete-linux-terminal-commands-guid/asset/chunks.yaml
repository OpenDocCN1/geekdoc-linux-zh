- fmt: "\nLinux provides both a graphical user interface (GUI) and a command line\
    \ interface (CLI). The GUI allows users to interact with the system through windows,\
    \ icons, and menus, while the CLI allows direct interaction through typed commands.\n\
    \n## GUI (Graphical User Interface)\n\n- Easy to use, especially for beginners.\n\
    - Ideal for tasks like web browsing, document editing, and basic file management.\n\
    - Relies on visual interaction, such as clicking and dragging.\n\n## CLI (Command\
    \ Line Interface)\n\n- More powerful and flexible for certain tasks.\n- Allows\
    \ advanced users to automate tasks through scripts.\n- Uses fewer resources, making\
    \ it ideal for older or lower-spec hardware.\n\n## Why Use the Command Line?\n\
    \nThe CLI can be faster and more efficient for certain tasks, such as file management,\
    \ installing software, or troubleshooting. Additionally, the CLI allows for scripting\
    \ and automation, making it ideal for repetitive tasks. Many Linux power users\
    \ prefer the command line because it gives them more control over the system.\n\
    \n## 1.4 Opening and Navigating the Terminal\n\nThe terminal is the program that\
    \ lets you access the command line on Linux. When you open a terminal, you’re\
    \ interacting with a shell (like `Bash`) that reads and executes commands.\n\n\
    ### Opening the Terminal\n\n- Ubuntu and Debian: Press `Ctrl` + `Alt` + `T` or\
    \ find \"Terminal\" in the Applications menu.\n- Fedora: Press `Ctrl` + `Alt`\
    \ + `T` or find \"Terminal\" in the Activities overview.\n- Arch Linux: Look for\
    \ \"Terminal\" in the Applications menu or install a terminal emulator if needed.\n\
    \n## 1.5 Basic Rules for Using the Command Line\n\nHere are some key rules to\
    \ keep in mind when using the command line:\n\n### 1.5.1 Think Before You Execute\n\
    \nCommands run instantly, so double-check before pressing Enter. Some commands\
    \ can change or delete files, so it’s important to understand what each command\
    \ does.\n\n### 1.5.2 Use Sudo with Caution\n\n`sudo` (superuser do) gives you\
    \ administrative privileges, allowing you to make system-wide changes. Always\
    \ use it carefully, as incorrect commands with `sudo` can cause serious issues.\n\
    \n### 1.5.3 Be Careful with File Deletion\n\nDeleting files with `rm` or directories\
    \ with `rm -r` is permanent and cannot be undone. Always verify the file name\
    \ and location before deleting.\n\n### 1.5.4 Use Help and Man Pages\n\nIf you’re\
    \ unsure about a command, use `man` to read its manual:\n\n```\nman command_name\n\
    ```\n\nAlternatively, you can use `command --help` for quick information.\n\n\
    ### 1.5.5 Stay Organized in Your Directories\n\nKeep your files organized and\
    \ try not to make changes outside your home directory (usually `/home/username`)\
    \ until you are familiar with the system.\n\n### 1.5.6 Keep Commands Simple at\
    \ First\n\nStick to basic commands as you’re learning, such as `ls`, `cd`, and\
    \ `pwd`. This helps you build confidence before moving on to more complex commands.\n\
    \n## 1.6 Using Shortcuts in the Command Line\n\nShortcuts make using the command\
    \ line faster and easier. Here are a few essential shortcuts:\n\n### 1.6.1 Tab\
    \ Completion\n\n- **Tab**: Use the `Tab` key to complete file or folder names\
    \ automatically. Start typing a name, press `Tab`, and the terminal will try to\
