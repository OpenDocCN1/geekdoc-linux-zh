    \ [options] [filename]` | `cut -d ',' -f 1 file.csv` |\n| 6 | 查找并替换文本 | `sed [options]\
    \ 's/old/new/' [filename]` | `sed 's/error/fix/' file.txt` |\n| 7 | 提取并报告数据 |\
    \ `awk [options] 'pattern {action}' [filename]` | `awk '{print $1}' file.txt`\
    \ |\n| 8 | 翻译字符 | `tr [options] set1 set2` | `tr 'a-z' 'A-Z' < file.txt` |\n|\
    \ 9 | 标记行 | `nl [options] [filename]` | `nl file.txt` |\n\n***\n\n### 主题解释\n\n\
    ### 1. echo - 输出文本到终端\n\n#### 什么是 echo\n\n`echo` 命令将文本输出到终端。它通常用于 shell 脚本中显示消息或变量值。\n\
    \n#### 用途\n\n- 显示文本：向终端输出简单文本。\n- 打印变量值：在脚本中打印变量内容非常有用。\n\n#### 语法\n\n```\necho\
    \ [text]\n```\n\n#### 语法解释\n\n- `echo`: 输出文本的命令。\n- `[text]`: 要显示的文本。可以用引号括起字符串，或包含变量。\n\
    \n#### 简单代码示例\n\n```\necho \"Hello World\"\n```\n\n#### 代码示例解释\n\n1. 在终端中输出文本\
    \ \"Hello World\"。\n\n#### 常见错误与解决方案\n\n- 错误：如果特殊字符被意外地解析，请使用转义序列（例如 `echo \"\
    Hello \\$USER\"`）。\n\n#### 注意\n\n- 环境变量：使用 `$VARIABLE_NAME` 显示环境变量。\n\n#### 警告\n\
    \n- 避免在不转义的情况下使用特殊字符，因为它们的行为可能异常。\n\n***\n\n### 2. wc - 数行、字、字符\n\n#### 什么是 wc\n\
    \n`wc` (word count) 命令提供文件中行、字和字符的计数。\n\n#### 用途\n\n- 分析内容：统计行、字或字符。\n- 数据验证：对脚本非常有用。\n\
    \n#### 语法\n\n```\nwc [options] [filename]\n```\n\n#### 语法解释\n\n- `wc`: 计算行、字或字符的命令。\n\
    - `[options]`:\n    - `-l`: 数行。\n    - `-w`: 数字。\n    - `-c`: 数字符。\n- `[filename]`:\
    \ 要分析的文件。\n\n#### 简单代码示例\n\n```\nwc -l file.txt\n```\n\n#### 代码示例解释\n\n1. 统计 `file.txt`\
