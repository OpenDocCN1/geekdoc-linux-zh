    # 第 13 章 调试与系统分析\n\n### 章节概述\n本章涵盖了用于调试和分析系统性能的常用 Linux 命令。这些命令提供了对系统调用、打开文件、内核消息、内存使用、CPU\
    \ 性能和系统活动的深入洞解。熟练使用这些工具可以帮助用户诊断并解决系统问题、分析性能瓶颈以及监控系统健康状况。\n\n### 章节目标\n- 学习跟踪系统调用、监控打开的文件并查看内核消息。\n\
    - 理解如何分析内存、CPU 和 I/O 性能。\n- 获得收集和报告系统活动信息的技能，增强调试和故障排除能力。\n\n### 语法表\n| 序号 | 命令\
    \ | 语法 | 简单示例 |\n| :--- | :--- | :--- | :--- |\n| 1 | 跟踪系统调用 | `strace [options]\
    \ [command]` | `strace ls` |\n| 2 | 列出打开的文件 | `lsof [options] [file/process]`\
    \ | `lsof -p 1234` |\n| 3 | 打印内核消息 | `dmesg [options]` | `dmesg` |\n| 4 | 报告虚拟内存统计\
    \ | `vmstat [options] [interval] [count]` | `vmstat 5 10` |\n| 5 | 报告 CPU 和 I/O\
    \ 统计 | `iostat [options] [interval] [count]` | `iostat 5 10` |\n| 6 | 报告系统活动 |\
    \ `sar [options] [interval] [count]` | `sar -u 5 10` |\n\n***\n\n### 主题解释\n\n\
    ### 1. strace - 跟踪系统调用和信号\n\n#### 什么是 strace\n`strace` 命令是一个诊断工具，用于跟踪给定命令或进程的系统调用和信号。它通过显示程序与操作系统之间的交互，帮助人员和管理员调试问题。\n\
    \n#### 用途\n- 系统调用分析：识别进程执行了哪些系统调用。\n- 调试：诊断程序中的错误和意外行为。\n\n#### 语法\n```\nstrace\
    \ [options] [command]\n```\n\n#### 语法解释\n- `strace`: 跟踪系统调用的命令。\n- `[options]`:\
    \ 配置输出，例如 `-p` 用于跟踪已存在的进程。\n- `[command]`: 要跟踪的命令或程序（例如 `ls`）。\n\n#### 简单代码示例\n\
    ```\nstrace ls\n```\n\n#### 代码示例解释\n1. 跟踪 `ls` 命令执行的所有系统调用，显示每次调用及其结果。\n\n####\
    \ 常见错误与解决方案\n- 错误：`strace: command not found`\n- 解决方案：使用包管理器安装 `strace`。\n\n####\
    \ 注意\n- 使用 `strace -o output.txt [command]` 将输出保存到文件。\n\n#### 警告\n- 大范围跟踪会影响性能；避免在关键生产环境服务上使用\
    \ `strace`。\n\n***\n\n### 2. lsof - 列出与进程相关的打开文件\n\n#### 什么是 lsof\n`lsof` 命令列出打开的文件以及关联它们的进程。它可以帮助跟踪进程正在使用哪些文件，或定位访问特定文件的进程。\n\
    \n#### 用途\n- 打开文件跟踪：显示进程打开的文件。\n- 资源管理：识别进程的资源占用。\n\n#### 语法\n```\nlsof [options]\
    \ [file/process]\n```\n\n#### 语法解释\n- `lsof`: 列出打开文件的命令。\n- `[options]`:常用选项包括：\n\
    \    - `-p`: 列出特定进程 ID 打开的文件。\n    - `+D`: 列出指定目录下的文件。\n- `[file/process]`: 用于过滤结果的文件或进程\
    \ ID。\n\n#### 简单代码示例\n```\nlsof -p 1234\n```\n\n#### 代码示例解释\n1. 列出 PID 为 `1234`\
    \ 的进程打开的所有文件。\n\n#### 常见错误与解决方案\n- 错误：`lsof: command not found`\n- 解决方案：使用包管理器安装\
    \ `lsof`。\n\n#### 注意\n- `lsof +D /path/to/directory` 列出特定目录下的打开文件。\n\n#### 警告\n\
    - 避免在繁忙的服务器上过度使用 `lsof`，因为它可能会降低性能。\n\n***\n\n### 3. dmesg - 打印内核消息\n\n#### 什么是\
    \ dmesg\n`dmesg` 命令打印内核环缓冲区的消息，包括硬件和驱动程序信息。通常用于排除硬件故障和查看系统初始化消息。\n\n#### 用途\n\
    - 内核消息查看：显示与硬件和系统事件相关的消息。\n- 硬件问题调试：有助于识别驱动程序和硬件的问题。\n\n#### 语法\n```\ndmesg [options]\n\
    ```\n\n#### 语法解释\n- `dmesg`: 打印内核消息的命令。\n- `[options]`:常用选项包括 `-T` 显示时间戳。\n\n\
    #### 简单代码示例\n```\ndmesg\n```\n\n#### 代码示例解释\n1. 显示内核消息。\n\n#### 常见错误与解决方案\n- 错误：权限不足。\n\
    - 解决方案：使用 `sudo dmesg`。\n\n#### 注意\n- 使用 `dmesg -w` 持续日志。\n\n#### 警告\n- 无。\n\n\
    ***\n\n### 4. vmstat - 报告虚拟内存统计\n\n#### 什么是 vmstat\n`vmstat` 命令提供内存、进程、I/O 和 CPU\
    \ 使用报告。\n\n#### 用途\n- 内存和 CPU ：提供资源概述。\n- 性能分析：帮助识别瓶颈。\n\n#### 语法\n```\nvmstat\
    \ [options] [interval] [count]\n```\n\n#### 语法解释\n- `vmstat`: 虚拟内存统计命令。\n- `[options]`:\
    \ 配置输出，例如 `-s` 显示摘要。\n- `[interval]`: 更新间隔。\n- `[count]`: 更新次数。\n\n#### 简单代码示例\n\
    ```\nvmstat 5 10\n```\n\n#### 代码示例解释\n1. 每 5 秒显示一次虚拟内存统计，共更新 10 次。\n\n#### 常见错误与解决方案\n\
    - 错误：`vmstat: command not found`\n- 解决方案：安装 `procps` 包。\n\n#### 注意\n- 关键字段包括 `si`\
    \ (交换入)、`so` (交换出)、`us` (用户 CPU) 和 `sy` (系统 CPU)。\n\n#### 警告\n- 过度使用会消耗资源。\n\n\
    ***\n\n### 5. iostat - 报告 CPU 和 I/O 统计\n\n#### 什么是 iostat\n`iostat` 命令报告 CPU 和\
    \ I/O 统计，帮助用户理解磁盘性能并识别 I/O 瓶颈。\n\n#### 用途\n- CPU 和 I/O 监控：跟踪 CPU 使用和磁盘 I/O。\n\
    - 磁盘分析：评估存储设备的负载。\n\n#### 语法\n```\niostat [options] [interval] [count]\n```\n\n\
    #### 语法解释\n- `iostat`: CPU 和 I/O 统计命令。\n- `[options]`: 配置输出（例如 `-d` 显示设备报告）。\n\
    - `[interval]`: 报告间隔。\n- `[count]`: 报告次数。\n\n#### 简单代码示例\n```\niostat 5 10\n```\n\
    \n#### 代码示例解释\n1. 每 5 秒显示一次 CPU 和 I/O 统计，共更新 10 次。\n\n#### 常见错误与解决方案\n- 错误：`iostat:\
    \ command not found`\n- 解决方案：安装 `sysstat` 包。\n\n#### 注意\n- 重要指标包括 `%util`（磁盘利用率）和\
    \ `await`（平均等待时间）。\n\n#### 警告\n- 在 I/O 活动频繁的系统上长时间使用可能会影响性能。\n\n***\n\n### 6.\
    \ sar - 收集和报告系统活动信息\n\n"
- fmt: "\n# What is sar\n\nThe `sar` command collects and reports system activity\
    \ information, including CPU, memory, and network statistics. It is part of the\
    \ `sysstat` package and provides historical data on system performance.\n\n##\
    \ Use Purpose\n\n- Historical Performance Analysis: Tracks and reports on CPU,\
    \ memory, and other resources over time.\n- Detailed Monitoring: Collects data\
    \ at specified intervals for long-term analysis.\n\n## Syntax\n\n`sar [options]\
    \ [interval] [count]`\n\n## Syntax Explanation\n\n- `sar`: Command to report system\
    \ activity.\n  - `[options]`: Defines the type of report (e.g., `-u` for CPU usage).\n\
    \  - `[interval]`: The time interval (in seconds) between reports.\n  - `[count]`:\
    \ Number of reports to generate.\n\n## Simple Code Example\n\n```\nsar -u 5 10\n\
    ```\n\n## Code Example Explanation\n\n1. Displays CPU usage statistics every 5\
    \ seconds, for a total of 10 reports.\n\n## Common Errors and Solutions\n\n- **Error**:\
    \ Cannot open `/var/log/sa/saXX`: No such file or directory\n  - **Solution**:\
    \ Ensure `sysstat` is installed and configured.\n\n# Chapter – 14 Security & Permissions\n\
    \n## Chapter Overview\n\nThis chapter introduces essential Linux commands for\
    \ managing security, access control, and user monitoring. These commands help\
    \ administrators secure the system by managing permissions, configuring firewalls,\
    \ controlling user access, and auditing user activity. Understanding these commands\
    \ is crucial for protecting a Linux environment from unauthorized access and managing\
    \ secure operations.\n\n## Chapter Goal\n\n- Learn to control access using `sudo`,\
    \ configure firewalls with `iptables` and `ufw`, and manage SELinux contexts.\n\
    - Understand how to monitor user activity and access history with commands like\
    \ `last`, `who`, and `w`.\n- Gain skills to implement and monitor security measures,\
    \ ensuring system integrity.\n\n## Syntax Table\n\n| Serial No | Command | Syntax\
    \ | Simple Example |\n| :--- | :--- | :--- | :--- |\n| 1 | Execute with Privileges\
    \ | `sudo [command]` | `sudo apt update` |\n| 2 | Configure Packet Filtering |\
    \ `iptables [options]` | `iptables -L` |\n| 3 | Simplified Firewall | `ufw [command]`\
    \ | `ufw enable` |\n| 4 | Manage SELinux Contexts | `selinux [options]` | `sestatus`\
    \ |\n| 5 | Show Last Logged-In Users | `last [options]` | `last` |\n| 6 | Display\
    \ Logged-In Users | `who [options]` | `who` |\n| 7 | Show Users and Activity |\
    \ `w [options]` | `w` |\n\n## Topic Explanations\n\n### 1. sudo - Execute Commands\
    \ with Elevated Privileges\n\n#### What is sudo\n\nThe `sudo` command allows users\
    \ to execute commands with elevated privileges, typically as the root user. It\
    \ helps enforce security by controlling which users can perform administrative\
    \ tasks.\n\n#### Use Purpose\n\n- Privilege Escalation: Allows regular users to\
    \ run commands with root privileges.\n- Access Control: Grants limited administrative\
    \ access based on configuration.\n\n#### Syntax\n\n`sudo [command]`\n\n#### Syntax\
    \ Explanation\n\n- `sudo`: Command to run with elevated privileges.\n  - `[command]`:\
    \ The command to execute with root access (e.g., `apt update`).\n\n#### Simple\
    \ Code Example\n\n```\nsudo apt update\n```\n\n#### Code Example Explanation\n\
    \n1. Executes the `apt update` command with root privileges, updating package\
    \ lists.\n\n#### Common Errors and Solutions\n\n- **Error**: user is not in the\
    \ sudoers file\n  - **Solution**: Add the user to the sudoers file or group.\n\
    \n#### Notes\n\n- Use `sudo -i` to open a root shell.\n\n#### Warnings\n\n- Avoid\
    \ running unnecessary commands with `sudo` to minimize security risks.\n\n###\
    \ 2. iptables - Configure IP Packet Filtering Rules\n\n#### What is iptables\n\
    \nThe `iptables` command configures rules for filtering network packets on Linux,\
    \ acting as a firewall. It enables administrators to control incoming and outgoing\
    \ traffic based on IP, protocol, port, and more.\n\n#### Use Purpose\n\n- Firewall\
    \ Configuration: Manages traffic by setting up packet filtering rules.\n- Network\
    \ Security: Controls access to services based on IP and port filtering.\n\n####\
    \ Syntax\n\n`iptables [options]`\n\n#### Syntax Explanation\n\n- `iptables`: Command\
    \ to manage firewall rules.\n  - `[options]`: Configures the action, such as:\n\
    \    - `-L`: Lists current rules.\n    - `-A`: Adds a new rule.\n    - `-D`: Deletes\
    \ a rule.\n\n#### Simple Code Example\n\n```\niptables -L\n```\n\n#### Code Example\
    \ Explanation\n\n1. Lists all current iptables rules, showing how network traffic\
    \ is managed.\n\n#### Common Errors and Solutions\n\n- **Error**: `iptables` not\
    \ found\n  - **Solution**: Install `iptables`.\n\n#### Notes\n\n- `iptables -A\
    \ INPUT -p tcp --dport 80 -j ACCEPT`\n\n#### Warnings\n\n- Misconfigured rules\
    \ can block critical traffic.\n\n### 3. ufw - Simplified Firewall\n\n#### What\
    \ is ufw\n\nThe `ufw` (Uncomplicated Firewall) is a simplified front-end for `iptables`.\
    \ It provides an easier interface for managing firewall rules.\n\n#### Use Purpose\n\
    \n- Firewall Management: Simplified interface.\n- Controls incoming and outgoing\
    \ traffic.\n\n#### Syntax\n\n`ufw [command]`\n\n#### Syntax Explanation\n\n- `ufw`:\
    \ Command to manage the firewall.\n  - `[command]`: Actions like `enable`, `disable`.\n\
    \n#### Simple Code Example\n\n```\nufw enable\n```\n\n#### Code Example Explanation\n\
    \n1. Enables the firewall.\n\n#### Common Errors and Solutions\n\n- **Error**:\
    \ `ufw` not found\n  - **Solution**: Install `ufw`.\n\n#### Notes\n\n- Use `ufw\
    \ status` to check current rules.\n\n#### Warnings\n\n- Avoid blocking SSH access\
    \ by mistake.\n\n### 4. selinux - Manage SELinux Contexts\n\n#### What is selinux\n\
    \nSELinux (Security-Enhanced Linux) provides a mechanism for enforcing access\
    \ control based on security contexts.\n\n#### Use Purpose\n\n- Access Control:\
    \ Enforces stricter policies.\n- Enhanced Security: Granular control over processes.\n\
    \n#### Syntax\n\n`selinux [options]`\n\n#### Syntax Explanation\n\n- `selinux`:\
    \ Command to manage settings (often accessed via `sestatus`).\n  - `[options]`:\
    \ Configuration options.\n\n#### Simple Code Example\n\n```\nsestatus\n```\n\n\
    #### Code Example Explanation\n\n1. Displays the current status of SELinux.\n\n\
    #### Common Errors and Solutions\n\n- **Error**: SELinux is disabled\n  - **Solution**:\
    \ Enable SELinux in configuration.\n\n#### Notes\n\n- Use `chcon` and `semanage`\
    \ for detailed context management.\n\n#### Warnings\n\n- Misconfiguring SELinux\
    \ policies can lock users out of services.\n\n### 5. last - Show Last Logged-In\
    \ Users\n\n#### What is last\n\nThe `last` command displays information about\
    \ the most recent logins, reboots, and shutdowns, providing a log of user activity.\n\
    \n#### Use Purpose\n\n- User Audit: Shows historical login information.\n- Security\
    \ Tracking: Helps identify unauthorized access by reviewing history.\n\n#### Syntax\n\
    \n`last [options]`\n\n#### Syntax Explanation\n\n- `last`: Command to display\
    \ recent login information.\n  - `[options]`: Customizes output (e.g., `-n` to\
    \ limit entries).\n\n#### Simple Code Example\n\n```\nlast\n```\n\n#### Code Example\
    \ Explanation\n\n1. Lists the most recent logins, including user names, login\
    \ times, and durations.\n\n#### Common Errors and Solutions\n\n- **Error**: Missing\
    \ records in older logs.\n  - **Solution**: Verify that logging is configured\
    \ properly.\n\n#### Notes\n\n- Use `last -n 5` to show the last 5 login records\
    \ only.\n"
  raw: '#### What is  sar


    The  sar command collects and reports system activity information, including CPU,
    memory, and network statistics. It is part of the  sysstat package and provides
    historical data on system performance.


    #### Use Purpose


    ● Historical Performance Analysis: Tracks and reports on CPU, memory, and other
    resources over time.


    ●      Detailed Monitoring: Collects data at specified intervals for long-term
    analysis.


    #### Syntax


    sar [options]  [interval]  [count]


    #### Syntax Explanation


    ●      sar: Command to report system activity.


    ○      [options]: Defines the type of report (e.g.,  -u for CPU usage).


    ○      [interval]: The time interval (in seconds) between reports.


    ○      [count]: Number of reports to generate.


    #### Simple Code Example


    sar -u 5  10


    #### Code Example Explanation


    1.  Displays CPU usage statistics every 5 seconds, for a total of 10 reports.


    #### Common Errors and Solutions


    ●      Error:  Cannot open /var/log/sa/saXX: No such file or directory


    ○      Solution: Ensure  sysstat is installed and configured.


    ## Chapter – 14 Security & Permissions


    ### Chapter Overview


    This chapter introduces essential Linux commands for managing security, access
    control, and user monitoring. These commands help administrators secure the system
    by managing permissions, configuring firewalls, controlling user access, and auditing
    user activity. Understanding these commands is crucial for protecting a Linux
    environment from unauthorized access and managing secure operations.


    ### Chapter Goal


    ● Learn to control access using  sudo, configure firewalls with  iptables and  ufw,
    and manage SELinux contexts.


    ● Understand how to monitor user activity and access history with commands like  last,  who,
    and w.


    ●      Gain skills to implement and monitor security measures, ensuring system
    integrity.


    ### Syntax Table


    | Serial No | Command | Syntax | Simple Example |


    | 1 | Execute with Privileges | sudo [command] | sudo apt update |


    | 2 | Configure Packet Filtering | iptables [options] | iptables -L |


    | 3 | Simplified Firewall | ufw [command] | ufw enable |


    | 4 | Manage SELinux Contexts | selinux [options] | sestatus |


    | 5 | Show Last Logged-In Users | last [options] | last |


    | 6 | Display Logged-In Users | who [options] | who |


    | 7 | Show Users and Activity | w [options] | w |


    * * *


    ### Topic Explanations


    ### 1.  sudo - Execute Commands with Elevated Privileges


    #### What is  sudo


    The  sudo command allows users to execute commands with elevated privileges, typically
    as the root user. It helps enforce security by controlling which users can perform
    administrative tasks.


    #### Use Purpose


    ●      Privilege Escalation: Allows regular users to run commands with root privileges.


    ●      Access Control: Grants limited administrative access based on configuration.


    #### Syntax


    sudo [command]


    #### Syntax Explanation


    ●      sudo: Command to run with elevated privileges.


    ○      [command]: The command to execute with root access (e.g.,  apt update).


    #### Simple Code Example


    sudo apt update


    #### Code Example Explanation


    1.  Executes the  apt update command with root privileges, updating package lists.


    #### Common Errors and Solutions


    ●      Error:  user is not in the sudoers file


    ○      Solution: Add the user to the sudoers file or group.


    #### Notes


    ●      Use  sudo -i to open a root shell.


    #### Warnings


    ●      Avoid running unnecessary commands with  sudo to minimize security risks.


    * * *


    ### 2.  iptables - Configure IP Packet Filtering Rules


    #### What is  iptables


    The  iptables command configures rules for filtering network packets on Linux,
    acting as a firewall. It enables administrators to control incoming and outgoing
    traffic based on IP, protocol, port, and more.


    #### Use Purpose


    ●      Firewall Configuration: Manages traffic by setting up packet filtering
    rules.


    ● Network Security: Controls access to services based on IP and port filtering.


    #### Syntax


    iptables [options]


    #### Syntax Explanation


    ●      iptables: Command to manage firewall rules.


    ○      [options]: Configures the action, such as:


    ■     -L: Lists current rules.


    ■     -A: Adds a new rule.


    ■     -D: Deletes a rule.


    #### Simple Code Example


    iptables -L


    #### Code Example Explanation


    1.  Lists all current iptables rules, showing how network traffic is managed.


    #### Common Errors and Solutions


    ●      Error:  iptables: command not found


    ○      Solution: Install  iptables or use  nftables as a replacement.


    #### Notes


    ● iptables -A INPUT -p tcp --dport 80 -j ACCEPT allows HTTP traffic on port 80.


    #### Warnings


    ●      Misconfigured rules can block access to critical services; test changes
    carefully.


    * * *


    ### 3.  ufw - Simplified Firewall Tool for Ubuntu/Debian


    #### What is  ufw


    The  ufw (Uncomplicated Firewall) command is a simplified front-end for  iptables
    on Debian-based systems. It provides an easy interface for managing firewall rules.


    #### Use Purpose


    ●      Firewall Management: Simplifies firewall configuration for users.


    ●      Access Control: Controls incoming and outgoing traffic with simple commands.


    #### Syntax


    ufw [command]


    #### Syntax Explanation


    ●      ufw: Command to manage the firewall.


    ○      [command]: Actions like  enable,  disable,  allow [port], or  deny [port].


    #### Simple Code Example


    ufw enable


    #### Code Example Explanation


    1.  Enables the firewall, applying any configured rules to control traffic.


    #### Common Errors and Solutions


    ●      Error:  ufw: command not found


    ○      Solution: Install  ufw with  sudo apt install ufw.


    #### Notes


    ●      Use  ufw status to check the firewall status and current rules.


    #### Warnings


    ● Avoid using both  ufw and direct  iptables commands simultaneously to prevent
    conflicts.


    * * *


    ### 4.  selinux - Manage SELinux Contexts


    #### What is  selinux


    SELinux (Security-Enhanced Linux) provides a mechanism for enforcing access control
    policies based on security contexts. The  selinux command and related tools manage
    SELinux status and contexts.


    #### Use Purpose


    ●      Access Control: Enforces stricter access control policies based on SELinux
    contexts.


    ●      Enhanced Security: Provides granular control over file, process, and network
    access.


    #### Syntax


    selinux [options]


    #### Syntax Explanation


    ●      selinux: Command to manage SELinux settings (often accessed via  sestatus).


    ○      [options]: Configures SELinux, such as  sestatus to check status.


    #### Simple Code Example


    sestatus


    #### Code Example Explanation


    1.  Displays the current status of SELinux, showing whether it’s enforcing, permissive,
    or disabled.


    #### Common Errors and Solutions


    ●      Error:  SELinux is disabled


    ○      Solution: Enable SELinux in the system configuration if required.


    #### Notes


    ●      Use  chcon and  semanage commands for detailed context management.


    #### Warnings


    ● Misconfiguring SELinux policies can lock users out of services; test changes
    carefully.


    * * *


    ### 5.  last - Show Last Logged-In Users


    #### What is  last


    The  last command displays information about the most recent user logins, reboots,
    and shutdowns, providing a log of user activity.


    #### Use Purpose


    ●      User Audit: Shows historical login information for monitoring user access.


    ●      Security Tracking: Helps identify unauthorized access by reviewing login
    history.


    #### Syntax


    last  [options]


    #### Syntax Explanation


    ●      last: Command to display recent login information.


    ○      [options]: Customizes output (e.g.,  -n to limit entries).


    #### Simple Code Example


    last


    #### Code Example Explanation


    1.  Lists the most recent logins, including user names, login times, and durations.


    #### Common Errors and Solutions


    ●      Error: Missing records in older logs.


    ○      Solution: Verify that logging is configured properly for user sessions.


    #### Notes


    ● Use  last -n 5 to show the last 5 login records only.


    #### Warnings'
