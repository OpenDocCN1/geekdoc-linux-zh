    ## 存储与磁盘工具


    ### 概述


    本章节涵盖了用于存储设备的 Linux 命令。这些工具用于列出设备、监控磁盘健康、识别坏块以及安全擦除数据。


    ### 目标


    ● Learn 使用 `lsusb` 和 `lsscsi` 列出设备。

    ● 使用 `smartctl` 监控磁盘健康。

    ● 使用 `badblocks` 检查坏块。

    ● 使用 `wipe` 安全擦除数据。


    ### 语法表


    | 序列号 | 命令 | 语法 | 简单示例 |

    | :--- | :--- | :--- | :--- |

    | 1 | 列出 USB 设备 | lsusb [options] | lsusb |

    | 2 | 显示 SCSI 设备 | lsscsi [options] | lsscsi |

    | 3 | 安全擦除文件或驱动器 | wipe [options] [device] | wipe -r /path/to/delete |

    | 4 | 搜索坏块 | badblocks [options] [device] | badblocks -v /dev/sda |

    | 5 | 监控 S.M.R.T. 状态 | smartctl [options] [device] | smartctl -H /dev/sda |


    ### 主题说明


    #### lsusb - 连接到系统的 USB 设备


    `lsusb` 命令列出所有连接到系统的 USB 设备，提供设备 ID、供应商和其他详情。它对于识别 USB 外围设备和排除 USB 相关问题非常有用。


    #### 用途


    ● 设备识别：列出 USB 设备并显示详情。


    ● 故障排除：帮助识别并解决连接问题。


    #### 语法


    ```

    lsusb [options]

    ```


    #### 语法说明


    ● `lsusb`: 列出 USB 设备的命令。


    ○ `[options]`: 配置显示选项，例如 `-v` 输出详细信息。


    #### 简单代码示例


    ```

    lsusb

    ```


    #### 代码示例说明


    1. 列出连接到系统的 USB 设备，显示设备 ID 和供应商。


    #### 常见错误与解决方案


    ● 错误：未检测到 USB 设备。


    ○ 解决方案：检查 USB 连接并确保已安装 USB 驱动程序。


    #### 注意


    ● 使用 `lsusb -v` 获取每个 USB 设备的详细信息。


    #### 警告


    故障排除时小心，操作不当可能会影响 USB 设备性能。


    #### lsscsi - 显示 SCSI 设备


    `lsscsi` 命令列出所有连接到系统的 SCSI 设备，例如硬盘、光驱器和磁带机。它提供了有关设备类型、SCSI ID 和设备路径的信息。


    #### 用途


    ● 设备检测：列出 SCSI 设备并显示设备详情。


    ● 硬件清单：帮助识别连接到系统的 SCSI 存储设备。


    #### 语法


    ```

    lsscsi [options]

    ```


    #### 语法说明


    ● `lsscsi`: 列出 SCSI 设备的命令。


    '
- fmt: '

    ○ `[options]`: Configures display options, such as `-s` for device size.


    #### Simple Code Example


    ```

    lsscsi

    ```


    #### Code Example Explanation


    1. Lists all connected SCSI devices, including details about each device''s path
    and type.


    #### Common Errors and Solutions


    ● Error: `lsscsi`: command not found


    ○ Solution: Install `lsscsi` using your package manager (e.g., `sudo apt install
    lsscsi`).


    #### Notes


    ● Use `lsscsi -l` to display detailed information about each device.


    #### Warnings


    ● Ensure accurate identification of devices before performing actions like formatting
    or wiping.


    * * *


    ### 3. wipe - Securely Erase Files or Drives


    #### What is `wipe`


    The `wipe` command securely deletes files or entire drives, overwriting data multiple
    times to prevent data recovery. It is useful for ensuring that sensitive information
    is irretrievably erased.


    #### Use Purpose


    ● Data Security: Permanently removes data to prevent recovery.

    ● Secure Deletion: Ensures sensitive information is completely erased.


    #### Syntax


    `wipe [options] [file/device]`


    #### Syntax Explanation


    ● `wipe`: Command to securely erase data.

    ○ `[options]`: Configures wiping options, such as `-r` for recursive wiping of
    directories.

    ○ `[file/device]`: Specifies the file or device to be securely erased.


    #### Simple Code Example


    ```

    wipe -r /path/to/secure_delete

    ```


    #### Code Example Explanation


    1. Recursively wipes the contents of the specified directory, ensuring files are
    permanently deleted.


    #### Common Errors and Solutions


    ● Error: `wipe`: command not found


    ○ Solution: Install `wipe` with the package manager (e.g., `sudo apt install wipe`).


    #### Notes


    ● Use caution with `wipe`, as data cannot be recovered once it is erased.


    #### Warnings


    ● Double-check the target file or device before running `wipe`, as this action
    is irreversible.


    * * *


    ### 4. badblocks - Search for Bad Blocks on a Device


    #### What is `badblocks`


    The `badblocks` command scans a storage device for bad blocks (corrupted or unreadable
    sectors) and reports their location. It helps assess the health of storage devices
    and identify potential data loss risks.


    #### Use Purpose


    ● Disk Health Check: Identifies unreadable sectors or bad blocks on a disk.

    ● Preemptive Maintenance: Helps detect disk issues early to prevent data loss.


    #### Syntax


    `badblocks [options] [device]`


    #### Syntax Explanation


    ● `badblocks`: Command to check for bad blocks on a storage device.

    ○ `[options]`: Configures scanning options, such as `-v` for verbose output.

    ○ `[device]`: The storage device to scan (e.g., `/dev/sda`).


    #### Simple Code Example


    ```

    badblocks -v /dev/sda

    ```


    #### Code Example Explanation


    1. Scans the `/dev/sda` device for bad blocks, displaying progress and any bad
    sectors found.


    #### Common Errors and Solutions


    ● Error: Permission denied.

    ○ Solution: Run `badblocks` with `sudo` to allow access to disk devices.


    #### Notes


    ● Consider redirecting output to a file for record-keeping (e.g., `badblocks -v
    /dev/sda > badblocks.log`).


    #### Warnings


    ● `badblocks` may take time to complete on large disks; avoid interruptions.


    * * *


    ### 5. smartctl - Monitor S.M.A.R.T. Health Status of Hard Drives


    #### What is `smartctl`


    The `smartctl` command is part of the `smartmontools` package and allows users
    to monitor the S.M.A.R.T. (Self-Monitoring, Analysis, and Reporting Technology)
    health status of hard drives. It provides detailed drive health information and
    diagnostic data.


    #### Use Purpose


    ● Drive Health Monitoring: Checks S.M.A.R.T. data to assess drive health.

    ● Failure Prediction: Provides early warnings for potential drive failures.


    #### Syntax


    `smartctl [options] [device]`


    #### Syntax Explanation


    ● `smartctl`: Command to interact with S.M.A.R.T. features on storage devices.

    ○ `[options]`: Configures output, such as `-H` for a health check or `-a` for
    detailed information.

    ○ `[device]`: Specifies the drive to check (e.g., `/dev/sda`).


    #### Simple Code Example


    ```

    smartctl -H /dev/sda

    ```


    #### Code Example Explanation


    1. Performs a quick health check on the `/dev/sda` drive, indicating if the drive
    is healthy or likely to fail.


    #### Common Errors and Solutions


    ● Error: `smartctl`: command not found

    ○ Solution: Install `smartmontools` (e.g., `sudo apt install smartmontools`).


    #### Notes


    ● Use `smartctl -a /dev/sda` for a comprehensive report on drive health.


    ## Chapter – 21 File System & Disk Usage Analysis


    ### Chapter Overview


    This chapter covers essential Linux commands for analyzing disk usage and monitoring
    file system events. These tools help users manage storage, identify large files
    and directories, and watch for file changes. Using these utilities allows administrators
    to optimize storage use, monitor activity, and troubleshoot file system issues
    efficiently.


    ### Chapter Goal


    ● Learn to analyze disk usage interactively with `ncdu` and `duf`.

    ● Understand how to monitor file system events with `inotifywait`.

    ● Gain skills to view disk space usage in a human-readable format with `df -h`.


    ### Syntax Table


    | Serial No | Command | Syntax | Simple Example |

    | :--- | :--- | :--- | :--- |

    | 1 | Disk Usage Analyzer | `ncdu [options] [directory]` | `ncdu /home` |

    | 2 | Disk Usage Utility | `duf [options]` | `duf` |

    | 3 | Monitor Filesystem | `inotifywait [options] [directory]` | `inotifywait
    -m /path/to/watch` |

    | 4 | Display Disk Usage | `df -h` | `df -h` |


    * *


    ### Topic Explanations


    #### 1. ncdu - Disk Usage Analyzer with Interactive Interface


    #### What is `ncdu`


    The `ncdu` command is a disk usage analyzer that provides an interactive interface.
    It allows users to navigate directories and files by size, helping to free up
    space.


    #### Use Purpose


    ● Disk Usage Analysis: Visualizes disk usage.

    ● Storage Optimization: Helps free up space.


    #### Syntax


    `ncdu [options] [directory]`


    #### Syntax Explanation


    ● `ncdu`: Command to analyze disk usage.

    ○ `[options]`: Configures display, such as `-x` to stay within one file system.

    ○ `[directory]`: The directory to analyze (e.g., `/home`).


    #### Simple Code Example


    ```

    ncdu /home

    ```


    #### Code Example Explanation


    1. Analyzes the disk usage of the `/home` directory, displaying an interactive
    list of files.


    #### Common Errors and Solutions


    ● Error: `ncdu`: command not found

    ○ Solution: Install `ncdu` using the package manager (e.g., `sudo apt install
    ncdu`).


    #### Notes


    ● Use arrow keys to navigate, and `d` to delete files directly.


    #### Warnings


    ● Deleting files directly from `ncdu` is irreversible; double-check before confirming.


    * *


    ### 2. duf - Disk Usage Utility with a User-Friendly UI


    #### What is `duf`


    The `duf` command is a disk usage utility with a user-friendly and colorful interface,
    displaying mounted file systems, disk usage, and available space. It offers an
    alternative to the `df` command with improved readability.


    #### Use Purpose


    ● Disk Usage Visualization: Provides an easy-to-read overview of disk usage.

    ● File System Overview: Displays mounted drives, total capacity, used, and available
    space.


    #### Syntax


    `duf [options]`


    #### Syntax Explanation


    ● `duf`: Command to display disk usage with a user-friendly interface.

    ○ `[options]`: Configures display, such as `-all` to show all file systems.


    #### Simple Code Example


    ```

    duf

    ```


    #### Code Example Explanation


    1. Displays a colorful and user-friendly overview of all mounted file systems
    and their usage.


    #### Common Errors and Solutions


    ● Error: `duf`: command not found

    ○ Solution: Install `duf` from the package manager or repository.


    #### Notes


    ● Use `duf -only local` to display only local file systems and exclude network
    mounts.


    #### Warnings


    ● Information displayed may differ from `df` if some file systems are excluded;
    double-check if needed.

