  md: '# 4.1 Editors 33


    # 4.1.1 Emacs


    Emacs comes in several flavors. The original Emacs editor was written by Richard
    Stallman, of Free Software Foundation fame. For years, GNU Emacs has been the
    most popular version. Recently, a more graphic-environment-aware variant of GNU
    Emacs, called XEmacs, has also become popular. XEmacs started life like Lucid
    Emacs, a set of enhancements to GNU Emacs managed by the now-defunct Lucid Technologies
    that was intended to be folded back into the official GNU Emacs. Technical differences
    prevented the teams from merging their code. The two editors remain highly compatible,
    however, and programmers on both teams regularly borrow code from each other.
    Because these versions are so similar, we refer to them as Emacs.


    The best way to become comfortable with the Emacs editor is to follow its tutorial.
    Run emacs and type ^h t (think “control-help, tutorial”). Type ^x^c to exit Emacs.
    The tutorial will teach you how to get more information on Emacs. It will not
    teach you how to get the Emacs manual that is distributed with Emacs. For use,
    ^h i (control-help, info).


    Although its user interface may not be as flashy as the IDEs for some other systems,
    Emacs does have powerful features that many programmers want. When you use Emacs
    to edit C code, for example, Emacs recognizes the file type and enters “C mode,”
    when it recognizes C’s syntax and helps you recognize types. When you run the
    compiler from within Emacs, it will recognize error and warning messages, and
    take you straight to the line at which each error was found when you type a single
    command, even if it has to read in a new file. It also provides a debugging mode
    that keeps the debugger in one window and follows the code you are debugging in
    another window.


    # 4.1.2 vi


    If you are a touch typist and like to keep your fingers on the home row, you may
    appreciate vi, because its command set was designed to minimize finger movement
    for touch typists. It was also designed for Unix users; if you are familiar with
    sed or awk or other Unix programs that use standard


    +   2. If you are a touch typist, that is. Dvorak touch typists who use vi generally
    use lots of macros to make vi comfortable for them.'
