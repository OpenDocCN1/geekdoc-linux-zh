  md: '# Chapter 13 Signal Processing


    # 13.4 Writing Signal Handlers


    Although a signal handler looks like a normal C function, it is not called like
    one. Rather than being run as part of a program’s normal call sequence, signal
    handlers are called by the kernel. The key difference between the two cases is
    that a signal handler can be called at almost any time, even in the middle of
    a single C statement! There are only a few restrictions on when the system will
    call a signal handler on which you can rely:


    +   The semantics of some signals restrict when they will be sent. SIGCHLD, for
    example, will not normally be sent to a program that has no children. Most signals
    are like SIGHUP, however, and are sent at unpredictable times.


    +   If the process is in the middle of handling a particular signal, the signal
    handler will not be reinoked to handle the signal unless the SA_NOMASK option
    was specified. The process can also block additional signals when a signal processor
    is running through the sa_mask field of struct sigaction.


    +   The process can block signals while running a part of code through sigprocmask().
    Page 245 has an example of using this facility to allow atomic updates to data
    structures.


    Because signal handlers can be run at almost any time, it is important to write
    them so they do not make unwarranted assumptions about the rest of the program
    is doing at the time and so that they do not rearrange things in a way that could
    confuse the program when it starts running again.


    One of the most important things to watch is modifying global data. Unless this
    is not done carefully, race conditions will result. The easiest way to keep updates
    of global data safe is simply to avoid them. The next best method is blocking
    all signal handlers that modify a particular data structure when the rest of the
    code is modifying, ensuring that only one code segment is manipulating the data
    at a time.


    +   Although users can send SIGCHLD to all processes they own, programs are not
    expected to respond to unexpected signals.'
  merge: -1
