  md: '# 20.3 Linux Console Capabilities


    The Linux console, like most terminals, is modal: Its response to data depends
    on what mode it is in. By default, it prints on the screen the characters you
    send to it unless it receives an escape or control character. A control character
    simply causes some action to be taken, but the next character is read normally;
    there is no change in processing mode. An escape character signals the beginning
    of an escape sequence and changes the processing mode to escape mode.


    For example, consider the following C string:


    ```

