  md: '# Names and the User Databases


    Linux''s security model uses numbers to identify users and groups, but people
    prefer names. The names are stored, along with other important information, in
    two system databases.

    looks like this:


    # 26.1 ID-to-Name Translation


    When you type `ls -l` to list the contents of the current directory, the third
    and fourth columns give the user ID and group ID that owns each file. It looks
    like:


    ```

    drwxxr-x 5 christid christid  1024 Aug 15 02:30 christid

    drwxxr-x 73 johnsonm root       4096 Jan 18 12:48 johnsonm

    drwxxr-x 25 kim      root         2048 Jan 12 21:13 kim

    drwxxr-x 2 typo     tyso       1024 Jan 30 1996 typo

    ```


    But the kernel does not store the string christid anywhere; the ls is translating
    from kernel-supplied numbers to names. It gets numbers from the `stat()` system
    call and looks up the names in two system databases. These are normally kept in
    the `/etc/passwd and `/etc/group files, although on some systems the information
    is stored somewhere on the network or in other, less standard, file locations.
    As a programmer, you do not have to worry about where the information is stored;
    generic functions are provided in the C library that read configuration files
    to determine where the information is stored, fetch the information, and return
    it to you transparent.'
