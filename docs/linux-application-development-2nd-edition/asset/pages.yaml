  md: "# 23.5.1 Adding Records\n\nNew and updated records are recorded in the database\
    \ through the DB structure's put function.\n\n```\nint put(const D8 * db, const\
    \ DBT * key, const DBT * value,\n    unsigned int flags);\n```\n\nThe key is the\
    \ index value that can later be used to retrieve the information referenced by\
    \ value. The put function overwrites any other record in the database whose key\
    \ is key unless the flags argument is R_NOOVERWRITE.\n\nIf the new record is successfully\
    \ stored, put returns 0. If another record with this key exists and R_NOOVERWRITE\
    \ is specified, put returns 1. If any other error occurs, -1 is returned and errno\
    \ is set appropriately.\n\n# 23.5.2 Removing Records\n\nThere are two ways to\
    \ remove records from the database. Usually, records are removed by specifying\
    \ the key whose record should be removed. Alternatively, the record currently\
    \ referenced by the cursor may be removed. In either case, the DB structure's\
    \ del member references the function that is used.\n\n```\nint del(D8 * db, const\
    \ DBT * key, unsigned int flags);\n```\n\nIf flags is R, the record currently\
    \ referenced by the cursor is removed and the cursor's position is undefined.\
    \ If flags is 0, the record whose key is removed.\n\nIf the specified key does\
    \ not exist in the database, del returns 1. If any other error occurs, -1 is returned\
    \ and errno is set. If the specified record is successfully removed, 0 is returned."
