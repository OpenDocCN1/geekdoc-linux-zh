    inodes; almost all the important information concerning a file is stored in the
    inode. open() lets a process create directory entries that are regular files,
    but other functions are needed to create other types of files and to manipulate
    the entries themselves. The functions that allow you to create, remove, and search
    directories are covered in Chapter 11; socket files are introduced in Chapter
    16. This section covers symbolic links, device files, and FIFOs.


