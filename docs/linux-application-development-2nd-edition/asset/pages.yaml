    source of hard-to-produce bugs if you do not test your shared objects with immediate
    resolution first.


    This is especially true if you have shared objects that depend on shared objects
    to supply some of their symbols. If shared object A depends on a symbol b in shared
    object B, and B is loaded after A, lazy resolution of b will succeed if it happens
    after B is loaded, but it will fail before B is loaded. Developing your code with
