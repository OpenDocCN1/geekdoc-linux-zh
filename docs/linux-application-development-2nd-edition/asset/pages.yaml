  md: '# 12.3.3 Mandatory Locks


    Both Linux and System V provide mandatory locking, as well as normal locking.
    Mandatory locks are established and released through the same flock() mechanism
    as used for advisory record locking. The locks are mandatory if the locked file''s
    setgid bit is set but its group execute bit is not set. If this is not the case,
    advisory locking is used.


    When mandatory locking is enabled, the `read()` and `write()` system calls block
    when they conflict with locks that have been set. If a process tries to `write()`
    to a portion of a file that a different process has a read or write lock on, the
    process without the lock blocks until the lock is released. Similarly, `read()`
    blocks on region that are included in mandatory write locks.


    Mandatory record locking causes a larger performance loss than advisory locking,
    because every `read()` and `write()` call must be checked for conflicts with locks.
    It is also not portable as POSIX advisory locks, so we do not recommend using
    mandatory locking in most applications.


    # 12.4 Scatter/Gather Reads and Writes


    Applications often want to read and write various types of data to consecutive
    areas of a file. Although this can be done fairly easily through multiple `read()`
    and `write()` calls, this solution is not atomic. Applications could move all
    the data into a consecutive memory region, but doing so results in many unnecessary
    memory operations.


    Linux provides `readv()` and `writev()`, which implement scatter/gather reads
    and writes. Instead of expecting a single pointer and buffer size to each of these
    functions, as is done with their standard siblings, they are passed an array of
    records, each record describing a buffer. The buffers get read from or written
    to in the order they are listed in the array. Each buffer is described by a `struct
    iovec`.


    +   17. They are so named because the reads scatter data across memory, and the
    writes gather data from different memory regions. They are also known as vector
    reads and writes, which is the origin of the v at the end of `readv()` and `writev()`.'
