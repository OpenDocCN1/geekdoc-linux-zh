    # 22.1.1 Initializing S-Lang Input Handling


    Before any other input handling functions will work, the terminal must be placed
    in the state S-Lang expects through the S_Lang_init tty() function):


    ```

    int sLang_init_tty(int abort_char, int flow_ctl, int opost);

    ```


    The first parameter to S-Lang init_tty() is an abort character to use. If -1 is
    passed, the current tty interrupt character (usually, Ctrl-C) is retained; otherwise
    the interrupt character is set to the value passed. Whenever the abort character
    is entered on the terminal, the kernel sends a SIGINT to the process, which normally
    terminates the application. Chapter 13 discusses how to handle signals such as
    SIGINT.


    The next parameter turns flow control on and off. Terminal-level flow control
    allows the user to pause output to the terminal to prevent scrolling and then
    restart. Normally, Ctrl-S is used to suspend terminal output and Ctrl-Q enables
    it. Although this feature is convenient for some line-oriented utilities, programs
    that take advantage of S-Lang are normally screen oriented, it may not be necessary.
    S-Lang allows applications to turn off this capability, which allows the program
    to use the Stop and Start keystrokes for other commands. To enable flow control,
    pass a non-0 value as the second parameter to S_Lang_init_tty().


    The final parameter enables output post-processing on the terminal. All the kernel''s
    post-processing mechanisms are enabled if the final parameter is non-0. See page
    299 for information on output processing.


    # 22.1.2 Restoring the Terminal State


    Once the terminal state has been modified by S_Lang_init_tty(), the program must
    explicitly restore the terminal to its original state before exiting. If you do
    not do this, the terminal will be extremely difficult to use after your program
    exits. S_Lang_reset_tty() does not take any arguments, nor does it return one.'
