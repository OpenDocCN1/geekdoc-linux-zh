  md: '# 76 Chapter 7 Creating Using Libraries


    # 7.6 Using Shared Libraries


    The easiest way to use a shared library is to ignore the fact that it is a shared
    library. The C compiler automatically uses shared libraries instead of static
    ones unless it is explicitly told to link with static libraries. However, there
    are three other ways to use shared libraries. One, explicitly loading and unloading
    them from within a program while the program runs, called dynamic loading, and
    is described in Chapter 25. The other two are explained here.


    # 7.6.1 Using Noninstalled Libraries


    When you run a program, the dynamic loader usually looks in a cache (/etc/ld.so.cache,
    created by ldconfig) of libraries that are in directories mentioned in /etc/ld.so.conf
    to find libraries that the program needs. However, if the LD_LIBRARY_PATH environment
    variable is set, it will first dynamically scan the directories mentioned in LD_LIBRARY_PATH
    (which has the same format as the PATH environment variable) and load all the
    directories it finds in path, before it looks in its cache.


    This means that if you want to use an altered version of the C library when running
    one program, you can put that library in a directory somewhere and run the program
    with the appropriate LD_LIBRARY_PATH to access that library. As an example, a
    few versions of the Netscape browser were linked against the 5.2.18 version of
    the C library would die with a segmentation fault when run with the standard 5.3.12
    C library because of a more stringent enforcement of malloc() policies. Many people
    put a copy of the 5.2.18 C library in a separate directory, such as /usr/local/netscape/lib/,
    make the Netscape binary there, and replace /usr/local/bin/netscape with a shell
    script that looks something like this:


    ```

    #!/bin/sh

    export LD_LIBRARY_PATH=/usr/local/netscape/lib:$LD_LIBRARY_PATH

    exec /usr/local/netscape/lib/netscape *

    ```'
