    In several cases, lowercase letters are used for abbreviations and upper-case
    letters are used for full names. Unlike sprintf(), you do not have the option
    of using numbers in the middle of an escape sequence to limit the length of the
    substituted string; %6A is invalid. Like strftime() returns the number of characters
    printed into the s buffer. If it is not large enough for the current locale; allocate
    a larger buffer and try again.


    strftime() uses the same substitutions used by the date program. These definitions
    of the substitutions are for the default locale and are here to help you identify
    the type of information they provide; they may be somewhat different in other
