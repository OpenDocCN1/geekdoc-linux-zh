    # 17.1.3 The Limits of Time


    32-bit Linux systems, like most Unix systems, time_t is a signed integer 32 bits
    long. This means it will overflow Monday, January 18, 2038, at 10:14:07 PM. So
    Monday, January 18, 2038, 10:14:08 PM will be represented as Friday, December
    13th, 3:45:52 PM, 1901. As you can see, Linux does not have a year-2000 problem
    (as far as the native time libraries are concerned), but does have a year-2038
    problem.


    On the Digital Alpha platform (and probably other 64-bit platforms Linux is ported
    to), time_t is instead a 64-bit signed long. This is effectively forever; 64-bit
    time is truly astronomical, as it will not overflow until well after the sun is
    predicted to envelope the Earth as it becomes a red giant.


    To find the beginning of time, the current time, and the end of time for the system
    you are using, you can build and run this program, daytime:c:


    ```

    1: #include <stdio.h>

    2: #include <sys/time.h>

    3: #include <unistd.h>

    4:

    5: int main() {

    6:     struct time tv;

    7:     struct timezone tz;

    8:     time_t now;

    9:     /* beginning_of_time is smallest time_t-sized value */

    10:    time_t beginning_of_time = 1LL<<(sizeof(time_t)*8 - 1);

    11:    /* end_of_time is largest time_t-sized value */

    12:    time_t end_of_time = ~beginning_of_time;

    13:}

    ```'
