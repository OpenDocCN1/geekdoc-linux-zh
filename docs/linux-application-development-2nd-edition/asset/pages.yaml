  md: '# 13.1 Signal Concepts 237


    and SIGSTOP, cannot be caught. The kernel always performs the default action for
    these two signals, killing the process and stopping the process, respectively.


    The signal() function returns the previous signal handler (which could have been
    SIG_IGN or SIG_DFL). Processes use the same signal handlers as their parent, unless
    they reset it. When a new program is run by one of the exec() functions, all the
    signals that the original program was catching are set to SIG_DFL; the signals
    that the original program was ignoring continue to be ignored.


    All seems simple enough until you ask yourself: What will happen if SIGFO is sent
    to a process that is already running a signal handler for SIGFO? The obvious thing
    for the kernel to do is interrupt the process and run the signal handler. This
    creates two problems. First, the signal handler must function properly if it is
    invoked while it is already running. Although this may be easy, signal handlers
    that manipulate program-wide resources, as global data structures or files, need
    to be written extremely carefully. Functions that behave properly when they are
    called in this manner are called reentrant.¹


    The simple locking techniques that are sufficient to coordinate data access between
    concurrent processes do not allow reentrancy. For example, the file-locking techniques
    presented in Chapter 12 cannot be used to allow a signal handler that manipulates
    a data file to be reentrant. When the signal handler is called the first time,
    it can lock the data file just fine and keep writing to it. If the signal handler
    is interrupted by another signal while it holds the lock, the second invocation
    of the signal handler cannot lock the file, because the first invocation holds
    the lock. Unfortunately, the invocation that holds the lock is suspended until
    the invocation that wants finishes running.


    The difficulty of writing reentrant signal handlers is a major reason for the
    kernel not to deliver signals that a process is already running. Such a model
    also makes it difficult for processes to handle a large number of signals that
    are being sent to the process very rapidly. As each signal results in a new invocation
    of the signal handler, the process''s stack could grow without bound, despite
    the program itself being well behaved.


    +   1. The problem of writing reentrant functions is not limited to signal handlers.
    Multi-threaded applications must take great care to ensure proper reentrancy and
    locking.'
