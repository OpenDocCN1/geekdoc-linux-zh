  md: 'To prevent this type of problem, Linux uses a separate uid for file-system
    access checks: the fsuid.


    Whenever a process''s effective uid is changed, the process''s fsuid is set to
    the process''s new effective user ID, making the fsuid transparent to most applications.
    Those applications that need the extra features provided by the separate fsuid
    must use the `setfsuid()` call to explicitly set the fsuid.


    ```

    int setfsuid(uid_t uid);

    ```


    The fsuid may be set to any of the current effective, saved, or real uids of the
    process. In addition, `setfsuid()` succeeds if the current fsuid is being retained
    or if the process''s effective uid is 0.


