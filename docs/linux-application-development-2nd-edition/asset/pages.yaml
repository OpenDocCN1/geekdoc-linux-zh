  md: '# 368 Chapter 17 Time


    real-time functions, which are not implemented on all versions of Unix. However,
    in time, it may become one of the most portable because it is more stringently
    specified than the others, POSIX.1b functionality is becoming more common, and
    it does not interact with other sleeping functions the way sleep() does with interval
    timers.


    Not all platforms that provide the nanosleep() function provide high accuracy,
    but Linux, like other real-time operating systems, will attempt to shorten short
    waits with extreme accuracy for real-time processes. See Programming for the Real
    World [Gallmeister, 1995] for more information on real-time programming.


    # 17.2.2 Interval Timers


    Interval timers, once enabled, continually deliver signals to a process on a regular
    basis. Exactly what regular means depends on which interval timer you use. Each
    process has three interval timers associated with it.


    ITIM_REAL

    Tracks time in terms of the clock on the wall—real time, regardless of whether
    the process is executing—and delivers a SIGALRM signal. It conflicts with the
    alarm() system call, which is used by the sleep() function. Use neither alarm()
    nor sleep() if you have a real itimer active.


    ITIM_VIRTUAL

    Counts time only when the process is executing—excluding any system calls the
    process makes—and delivers a SIGVTALRM signal.


    ITIM_PROF

    Counts time when the process is executing—including the time the kernel spends
    executing system calls on the behalf of the process, but not including any time
    spent processing interrupts on behalf of the process—and delivers a SIGPROF signal.
    Accounting for time spent processing interrupts would be so expensive that it
    would change the timings.'
  merge: -1
