  md: '# 3.4 Linux (and Other) Newsgroups


    # 3.2 Other Books


    The LDP is not the only source of books on Linux. A Practical Guide to Linux [Sobell,
    1997] is a 1,000-page tome that contains introductions to using Linux, shell programming,
    and system administration. It also contains a summary reference to many of the
    utilities that are included with a Linux system. Linux in a Nutshell [Heckman,
    1997] is smaller and shorter and concentrates on a summary utility reference derived
    from O''Reilly''s earlier references.


    Beginning Linux Programming [Matthew, 1996] is a gentle and detailed introduction
    to Linux programming that includes important topics, such as shell programming.
    Linux Multimedia Guide [Tranter, 1996] includes information on multimedia solutions
    available for Linux, as well as information on programming the Linux sound interface.
    Linux Device Drivers [Rubini, 1998] teaches those who have never touched operating
    system code, as those who have, how to write Linux device drivers.


    # 3.3 Source Code


    Take advantage of free software—read the source code. If you purchase a Linux
    distribution, the vendor is legally obligated by the terms of the GPL to provide
    you with source code. Look at the source code for programs that do something similar
    to what you are trying to do. Your distribution should include instructions for
    finding the source code.


    # 3.4 Linux (and Other) Newsgroups


    Like other Usenet newsgroups, the Linux newsgroups have a lot of information hidden
    in an overwhelming amount of disinformation and misinformation. We will describe
    the newsgroups that we think might be useful to a programmer.'
