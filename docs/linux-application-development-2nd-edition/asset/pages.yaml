    # 9.4.7 Dumping Core


    Although we just mentioned passing SIGTERM and SIGKILL to kill() causes a process
    to terminate, you can use a few different values (Chapter 13 discusses all of
    them). Some of these, such as SIGABRT, cause the program to dump core before dying.
    A program’s core dump contains a complete history of the state of the program
    when it died. Most debuggers, including gdb, can analyze a core file and tell
    you what the program was doing when it died, as well as let you inspect the defunct
    process’s memory image. Core dumps end up in the process’s working directory in
    a file called (simply enough) core.


    When a process has violated some of the system’s requirements (such as trying
    to access memory that it is not allowed to access) the kernel terminates the process
    by calling an internal version of kill() with a parameter that causes a core dump.
    The kernel will kill a process for several reasons,


    > A once-popular form of computer memory consists of small iron rings arranged
    in a matrix, with each ring held in place by two wires that are used to sense
    and set the magnetic polarity of the ring. Each of the rings is called a core,
    and the whole thing is core memory. A core dump is a copy of the state of the
    system’s memory (or core) at a given time.'
