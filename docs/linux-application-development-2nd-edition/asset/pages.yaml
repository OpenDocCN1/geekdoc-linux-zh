  md: '# 7.3 Designing Shared Libraries


    Unless you have a particular reason to do so, do not link against a specific version
    of a library. Always use the standard option to the C compiler or the linker,
    and you will never accidentally link against the wrong version. The linker will
    look for the file libfilename.so, which will be a symlink to the correct version
    of the library.


