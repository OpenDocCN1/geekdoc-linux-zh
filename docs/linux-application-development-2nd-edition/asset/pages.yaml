    There are two ways to get around this, if you wish to.


    The k argument causes make to build as much as possible, without stopping as soon
    as a command invocation returns an error. It is useful, for example, when porting;
    you can build as many object files as possible, then port the files that failed
    to build without having to wait for intermediary files to build in the meantime.


    If you know that one command will always return an error, but if you wish to ignore
    the error condition, you can use some shell magic. The /bin/false command always
    returns an error, so the command


    ```

