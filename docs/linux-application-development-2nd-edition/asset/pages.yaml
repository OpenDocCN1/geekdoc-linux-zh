  md: '# 13.3 Available Signals


    the signal handler. If the parent always waits for its children to exit before
    continuing, this signal can be safely ignored. This signal is different from the
    SIGCHLD signal provided by early releases of System V. SIGCHLD is obsolete and
    should not be used anymore.


    # SIGCONT


    This signal restarts a process that has been stopped. It may also be caught by
    a process, allowing it to take an action after being restarted. Most editors catch
    this signal and refresh the terminal when they are restarted. See Chapter 14 for
    more information on stopping and starting processes.


    # SIGHUP


    When a terminal is disconnected, the session leader for the session associated
    with the terminal is sent a SIGHUP unless that terminal''s CLOCAL flag has been
    set. If a session leader exits, SIGHUP is sent to the process group leader for
    each process group in the session. Most processes terminate when SIGHUP is received
    because it indicates the user is no longer present.


    Many daemon processes interpret SIGHUP as a request to close and reopen log files
    and reread configuration files.


    # SIGFPE


    This signal is sent when a process causes an arithmetic exception. All floating-point
    exceptions, such as overflows and underflows, cause this signal, as integer division
    by 0.


    # SIGILL


    The process attempted to run an illegal hardware instruction.


    # SIGINT


    This signal is sent to all processes in the foreground process group when the
    user presses the interrupt character (^).


    # SIGIO


    An asynchronous I/O event has occurred. Asynchronous I/O is rarely used and is
    not documented in this book. We suggest consulting other books for information
    on asynchronous I/O [Stevens, 1992].


    # SIGKILL


    This signal is generated only by kill() and allows a user to unconditionally terminate
    a process.'
