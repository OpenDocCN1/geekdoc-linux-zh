  md: '# Chapter 2 Licenses and Copyright


    for the application, allowing the user to relink the application with new or altered
    versions of the library.


    In practice, this restriction is not significant; it would be unreasonable not
    to link against shared libraries where they are available.


    Few libraries are licensed under the terms of the GPL; most are licensed under
    the terms of the LGPL. Libraries licensed under the terms of the GPL are usually
    that way simply because the author did not know or consider the LGPL. In response
    to a polite request, many will relicense their libraries under the terms of the
    LGPL.


    # 2.3.4 MIT/X-Style Licenses


    MIT/X-style licenses are much simpler than the GPL or LGPL; only their restrictions
    are (stated simply) to keep all copyright notices and license terms intact in
    source and binary distributions, and not to use the name of any author to endorse
    or promote derived works without prior permission.


    # 2.3.5 BSD-Style Licenses


    BSD-style licenses essentially add to the conditions of the MIT/X-style licenses
    the restriction that advertising materials that mention features or conditions
    of the software include an acknowledgment.


    # 2.3.6 Artistic License


    The Perl language source code is distributed with a license that allows you to
    follow either the terms of the GPL or of an alternative license, whimsically called
    the Artistic License. The main goals of the Artistic License are to preserve distribution
    rights and to prevent users from selling altered, proprietary modifications that
    masquerade as the official version. Other software authors have adopted Perl''s
    convention of allowing users to follow the terms of either the GPL or the Artistic
    License; a few are licensed only under the terms of the Artistic License.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# 2.3.7 License Incompatibilities


    Mixing code from software with different licenses can sometimes be a problem.
    The problem does not occur when linking with shared libraries, but it definitely
    applies to creating derived works. If you are modifying someone else''s software,
    you have to understand their licensing terms. If you are trying to combine in
    one derived two pieces of software that have different licenses, you have to determine
    if their licenses conflict. Again, this does not apply when you are writing your
    own code from scratch.


    If you are working with code licensed under the terms of the GPL or LGPL, you
    cannot include in it code licensed under a BSD-style license, because the GPL
    and LGPL forbid “additional restrictions,” and the BSD license contains additional
    restrictions (that is, beyond any in the GPL or LGPL) in regard to advertising
    and endorsement. Because of this conflict, many pieces of software are licensed
    under alternative terms—both the GPL and a BSD-style license terms are offered;
    you can choose with which licensing terms to comply.


    If the code licensed under the GPL or LGPL is included in a work derived from
    an MIT/X-style license, the entire derived work (for all practical purposes) must
    be licensed under the terms of the GPL or LGPL, respectively.


    There are many other potential incompatibilities. If you are in doubt about what
    you are allowed to do with particular pieces of free software, do not be shy—ask
    the copyright owners. Remember that they can give you license to use the software
    in any way they wish.'
  merge: -1
