    # 12.3.2 Record Locking


    To overcome the problems inherent with lock files, record locking was added to
    both System V and BSD4.3 through the lockf() and flock() system calls, respectively.
    POSIX defined a third mechanism for record locking that uses the fcntl() system
    call. Although Linux supports all three interfaces, we discuss only the POSIX
    interface, as it is supported by nearly all Unix platforms. The lockf() function
    is implemented as an interface to fcntl(), so the rest of this discussion applies
    to both techniques.


    There are two important distinctions between record locks and lock files. First
    of all, record locks lock an arbitrary portion of the file. For example, process
    A may lock bytes 50–200 of a file while another process locks bytes 2,500–3,000,
    without having the two locks conflict. Fine-grained locking is useful when multiple
    processes need to update a single file. The other advantage of record locking
    is that the locks are held by the kernel rather than the file system. When a process
    is terminated, all the locks it holds are released.


    Like lock files, POSIX locks are advisory. Linux, like System V, provides a mandatory
    variant of record locking that may be used but is not as portable. File locking
    may may not work across networked file systems. Under current (2.0.x) versions
    of the Linux kernel, no locking technique is reliable across NFS. In future versions
    of Linux, NFS record locking will be implemented,¹⁴ but many other network file
    systems will remain lockless.


    Record locking provides two types of locks: read locks and write locks. Read locks
    are also known as shared locks, because multiple processes may simultaneously
    hold read locks over a single region. It is always safe for multiple processes
    to read a data structure that is not being updated.


