  md: '# 322 Chapter 16 Networking with Sockets


    +   - Connection-oriented protocols have two endpoints, like a telephone conversation.
    The connection must be established before any communication takes place, just
    as you answer the phone by saying “hello” rather than just talking immediately.
    Other users cannot (or should not be able to) intrude into the connection. Protocols
    that do not have these characteristics are known as connectionless.


    +   - Protocols provide sequencing if they ensure the data arrives in the same
    order it was sent.


    +   - Protocols provide error control if they automatically discard messages that
    have been corrupted and arrange to retransmit the data.


    +   - Streaming protocols recognize only byte boundaries. Sequences of bytes may
    be split up and are delivered to the recipient as the data arrives. Packet-based
    protocols handle packets of data, preserving the packet boundaries and delivering
    complete packets to the receiver. Packet-based protocols normally enforce a maximum
    packet size.


    Although each of these attributes is independent of the others, two major types
    of protocols are commonly used by applications. Datagram protocols are packet-oriented
    transports that provide neither sequencing nor error control; UDP, part of the
    TCP/IP protocol family, is a widely used datagram protocol. Stream protocols,
    such as the TCP portion of TCP/IP, are streaming protocols that provide both sequencing
    and error control.


    Although datagram protocols, such as UDP, can be useful,* we focus on using stream
    protocols, because they are easier to use for most applications. More information
    on protocol design and the differences between various protocols is available
    from many books [Stevens, 1990] [Stevens, 1994].


    +   5 Many higher-level protocols, such as BOOTP and NFS, are built on top of
    UDP.'
