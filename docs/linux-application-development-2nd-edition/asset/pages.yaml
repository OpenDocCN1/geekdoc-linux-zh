    characters that are special to the shell. For instance, if you want to define
    a string, you will have to escape the " characters that delimit the string. Two
    ways to do this are ''-Dfoo="bar"'' and -Dfoo=\"bar\''. Note that the first works
    much better if there are any spaces in the string, because spaces are treated
