  md: "# 14.1.3 Handling Job Control Signals\n\nAlthough many applications can be\
    \ stopped and restarted with no effects, other processes need to handle process\
    \ starts and stops. Most editors, for example, need to modify many of the terminal\
    \ parameters while they are running. When users suspend the process, they expect\
    \ their terminal to be restored to its default state.\n\nWhen a process needs\
    \ to perform actions before being suspended, it needs to provide a signal handler\
    \ for `SIGTSTP`. This lets the kernel notify the process that it needs to suspend\
    \ itself.\n\nUpon receiving SIGTSTP, the process should immediately perform whatever\
    \ actions it needs to take in order to allow suspension (such as restoring the\
    \ terminal to its original state) and suspend itself. The simplest way for process\
    \ to suspend is by sending itself SIGSTOP. Most shells display messages that indicate\
    \ which signal caused the process to stop, though, and if the process sent itself\
    \ SIGSTOP, it would look different from most suspended processes. To avoid this\
    \ nuisance, most applications reset their SIGTSTP handler to `SIGDFL` and send\
    \ themselves a SIGTSTP.\n\nProcesses that require special code for clean suspensions\
    \ normally need to perform special actions when they are restarted. This is easily\
    \ done by providing a signal handler for `SIGCONT`, which performs such actions.\
