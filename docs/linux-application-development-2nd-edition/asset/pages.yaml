    # 10.2.6 Shortening Files


    Although regular files automatically grow when data is written to the end of them,
    there is no way for the system to automatically shrink files when the data at
    their end is no longer needed. After all, how would the system know when data
    becomes extraneous? It is a process’s responsibility to notify the system when
    a file may be truncated at a certain point.


    ```

    #include <unistd.h>

    ```


    ```

    int truncate(const char * pathname, size_t length);

    int ftruncate(int fd, size_t length);

    ```


    The file size is set to length, and any data in the file past the new end of the
    file is lost. If length is larger than the current size of the file, the file
    is actually grown to the indicated length (using holes if possible), though this
    behavior is not guaranteed by POSIX and should not be relied on in portable programs.


