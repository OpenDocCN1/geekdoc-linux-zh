    are memory accesses that force the kernel to access the disk before the program
    can continue to run. One common cause of major faults is a process accessing a
    part of its executable memory that has not yet been loaded into RAM from the disk
    or has been swapped out at some point. |

    | long | ru_nswap | The number of memory pages that have been paged in from disk
