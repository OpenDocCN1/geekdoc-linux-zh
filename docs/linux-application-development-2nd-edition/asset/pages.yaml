  md: '# Development Tools


    An amazing variety of development tools is available for Linux. Everyone should
    be familiar with a few of the important ones.


    Linux distributions include many solid, proven development tools; most of the
    same tools have been included in Unix systems for years. These tools are neither
    flashy nor fancy; most of them are command-line tools without a GUI. They have
    proved themselves through years of use, and it will be worth your while to learn
    them.


    If you are already familiar with Emacs, make, and gdb, you are not likely to learn
    anything new here. However, in the remainder of the book, we assume that you are
    comfortable with a text editor. Also, nearly all free Unix and Linux source code
    is built with make, and gdb is one of the most common debuggers available on Linux
    and Unix.


    # 4.1 Editors


    A few integrated development environments (IDEs) (for several different programming
    languages) are available for Linux, but they have not been as popular as have
    been IDEs on other platforms. Unix developers have traditionally held strong and
    diverse preferences, especially about editors.


    Many programmers'' editors are available for you to try; the most common are vi
    and Emacs. Both have more power than they appear to have at first glance, both
    have a relatively steep learning curve—and they are radically different. Emacs
    is large; it is really an operating environment


