  md: '# 23.2 Basic Operations 433


    # 23.2.3 Obtaining the File Descriptor


    A major shortcoming of db files is their lack of support for concurrent access.
    They make no attempt to lock databases, leaving to the application. To make locking
    a little easier, they provide a file descriptor that can be used for locking purposes.


    ```

    int fd(DB * db);

    ```


    The fd element points to a function that returns a file descriptor associated
    with the database. It is not guaranteed to be the only file descriptor db is using
    or to be used by db at all. It is guaranteed to return a file unique for the database
    being accessed and that the file descriptor returned for a given database file
    will always reference the same file (there is a-to-one correspondence between
    the file descriptor refers to and the file name passed to dbopen()). That guarantee
    is good enough to allow locking.


    Most applications that need to lock a db file lock the entire file and allow only
    one writing process to have access at a time, but allow multiple readers. See
    Chapter 12 for more information on file locking.


    # 23.2.4 Syncing the Database


    The db layer caches data in RAM for faster database access, and the Linux kernel
    caches disk writes for low-latency write() calls. An application can ensure the
    on-disk database is consistent with the buffered structures by syncing the database.
    When a database is synced, db flushes all its internal buffers and calls fsync()
    on the file descriptor. Syncing a db is nearly identical to closing one.


    ```

    int sync(const DB * db, unsigned int flags);

    ```


    The flags argument is 0 for DB_HASH and DB_BTREE files. For DB_RECNO files, it
    may be R_RECNOSYNC which syncs only the underlying btree file for the database
    rather than the overlapping file. See the recno(3) man page for details.


    +   3. DB_RECNO databases actually consist of two database files, one of which
    is a DB_BTREE database. This does not matter when you are using a DB_RECNO database,
    though.'
