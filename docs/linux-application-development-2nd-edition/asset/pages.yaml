  md: '# 402 Chapter 20 The Linux Console


    # 20.4 Direct Screen Writing


    There are some cases in which being able to write characters to the screen is
    simply insufficient, partially because it is impossible to determine the current
    state of the screen. Although standard Unix practice is to ignore the state of
    the screen—to set it up as you need it, make changes to it as you have changes
    to make, and to redraw it any time the user requests it (usually by pressing ^L)—you
    may have other applications in mind.


    In particular, screen capture and restore programs and functions need access to
    the current contents of the screen. Linux provides this through two interfaces.
    One provides only the text contents of the screen, and one contains attributes
    (color and so forth), as well.


    The simple text device is called vcs, which presumably stands for virtual console
    screen. The /dev/vcs0 device when read produces the contents of the virtual console
    as it is being viewed at the time it is read. If the screen is currently scrolled
    back (the Control-PageUp and Control-PageDown keys are set up to console scrolling
    by default), /dev/vcs0 counts the scrolled-back contents that are being viewed.
    The rest of the vcs devices, /dev/vcs, each represent the current state of the
    virtual console n, normally accessed through /dev/ttyn.


    When you read /dev/vcs*, you are given no indication of new lines or console size
    other than an EOF at the end of the screen. If you read 2,000 bytes and then receive
    an EOF, there is no indication the screen is 80 columns and 25 lines or 40 columns
    and 50 lines. No newline characters are produced to mark the ends of lines, and
    every empty character, whether or not it was ever written to, is denoted by a
    space character. There are several popular screen configurations, and there is
    no guarantee that each of them has a unique number of lines and columns. The vcs
    device provides an easy way for a savvy sysadmin or developer to see what is on
    any virtual console, but it is not very useful from a programmer’s standpoint,
    at least alone.


    +   3. This section belongs logically to Chapter 19 because it is related to virtual
    consoles, but belongs in this chapter in a practical sense—you would not need
    to look in Chapter 19 unless you did not need to read this book in the first place.'
  merge: -1
