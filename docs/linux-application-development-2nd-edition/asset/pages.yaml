  md: '# 23.6 Example


    To help make all of this more concrete, here is a sample application that makes
    use of most of db''s features. It is intended as a simple phone database, although
    it can be used to store any simple name/value pairs. It stores its database in
    the user''s home directory as .phonedb.


    The a flag adds an entry to the database. If f is specified, any existing entry
    is overwritten with the new data. The next parameter is the key value to use and
    the last parameter is the data (usually, a phone number).


    The q flag queries the database for a particular key, which should be the only
    other parameter specified. Entries are removed from the database through the d
    flag, which takes the key value to remove as the only other parameter.


    If i is specified, all the key/value pairs in the database are listed.


    Here is an example of using phones:


    ```

    $ ./phones -a Erik 374-5876

    $ ./phones -a Michael 642-4235

    $ ./phones -a Larry 527-7976

    $ ./phones -a Barbara 227-2272

    $ ./phones -q Larry

    Larry 527-7976

    $ ./phones -l

    Larry 527-7976

    Erik 374-5876

    Michael 642-4235

    Barbara 227-2272

    $ ./phones -d Michael

    $ ./phones -i

    Larry 527-7976

    Erik 374-5876

    Barbara 227-2272

    ```


    Although this program does something quite useful, it is only about 250 lines
    of source code and is well suited to managing large numbers of key/value pairs.'
