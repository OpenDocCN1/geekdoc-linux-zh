  md: '# 12.2 Memory Mapping 217


    | Table 12.1 mmap() Protections |

    | Flag | Description |

    | --- | --- |

    | PROT_READ | The mapped region may be read. |

    | PROT_WRITE | The mapped region may be written. |

    | PROT_EXEC | The mapped region may be executed. |


    | Table 12.2 mmap() Flags |

    | POSIX? | Description |

    | --- | --- |

    | MAP_ANONYMOUS | yes | Ignore fd, create an anonymous mapping. |

    | MAP_FIXED | yes | Fail if address is invalid. |

    | MAP_PRIVATE | yes | Writes are private to process. |

    | MAP_SHARED | yes | Writes are copied to the file. |

    | MAP_DENYWRITE | no | Do not allow normal writes to the file. |

    | MAP_GROWNSDOWN | no | Grow the memory region downward. |

    | MAP_LOCKED | no | Lock the pages into memory. |


    The second parameter, length, tells the kernel how much of the file to map into
    memory. You can successfully map more memory than the file has data, but attempting
    to access it may result in a SIGSEGV.


    The process controls which types of access are allowed to the new memory region.
    It should be one or more of the values from Table 12.1 logically ORed together,
    or PROT_NONE if no access to the mapped region should be allowed. A file can be
    mapped only for access types that were also requested when the file was originally
    opened. For example, a file that was opened O_RDONLY cannot be mapped with PROT_WRITE.


    The enforcement of the specified protection is limited by the hardware platform.
    Many architectures cannot allow code to execute in a memory region while disallowing
    reading from that memory region. On such hardware, mapping a region with PROT_EXEC
    is equivalent to mapping it with PROC_EXEC | PROT_READ. The memory protections
    passed to mmap() should be relied on only as minimal protections for this reason.


    The flags specify other attributes of the mapped region. Table 12.2 summarizes
    all the flags. Any of the flags that Linux supports are not standard


