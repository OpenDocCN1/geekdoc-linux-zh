  md: '# Licenses and Copyright


    Newcomers to the free-software world are often confused by the variety of licensing
    terms attached to free software. Some free-software devotees twist normal words
    into jargon and then expect you to understand every nuance that they have attached
    to each piece of jargon.


    To write and distribute software that runs on a free platform such as Linux, you
    must understand licenses and copyright. These matters are regularly confused by
    intelligent and informed people, free-software devotees among them. Whether you
    intend to write free or commercial software, you will be working with tools that
    come with a variety of license terms. A general understanding of the field of
    copyright and licensing will help you avoid common errors.


    In these litigious times, it is vitally important that we warn you that we are
    not lawyers. This chapter reflects our understanding of the matters that we discuss,
    but it does not offer legal advice. Before you make any decisions regarding your
    own or anyone else''s intellectual property, you should study the subject further,
    and unless you think it unnecessary, consult an attorney.


    # 2.1 Copyright


    We deal with the simpler subject first. A copyright is the simple assertion of
    ownership of certain types of intellectual property. Under the latest international
    copyright conventions, you do not even need to claim copyright'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 12 Chapter 2 Licenses and Copyright


    for material you create. Unless you explicitly claim ownership, other people are
    allowed to use your intellectual property only in strictly defined ways, called
    fair use, unless you explicitly give them permission, called license, or to do
    otherwise. So if you write a book or a piece of software, you do not need to put
    “Copyright © year” on it all. However, if you do not put this phrase in your writing,
    you may find it much difficult to claim ownership in court if someone violates
    your copyright (by claiming or acting as if you do not own the copyright) or your
    license terms. The Berne copyright convention,an international treaty covering
    international copyright conventions and enforcement, requires participating nations
    to enforce copyright only


    ...if from the time of the first publication all the copies of the work published
    with the authority of the author or other right proprietor bear the symbol of
    a lower case “c” inside a circle accompanied by the name of the copyright proprietor
    and the year of first publication placed in such manner and location to give reasonable
    notice of claim of copyright.


    The sequence (c) has been generally used as a replacement for the lower case “c”
    inside of circle, but courts have not upheld that. Always use the word Copyright,
    in addition to the sequence (c), when asserting your copyright.


    Copyright is not perpetual. All intellectual property eventually passes into the
    public domain. That is, the public eventually owns the copyright to the property,
    and any person can do anything with the property. No license terms are binding
    once the property is in the public domain. There is one twist: If you create a
    derived work based on public-domain work, then you own the copyright to your modifications.
    Therefore, although many old books are now out of copyright, their copyright having
    passed into the public domain, editors often make small changes here and there,
    correcting mistakes made in the original. They often then claim ownership of the
    derived work that includes their changes. This copyright prevents you from legally
    copying the edited version, although you can freely copy the public-domain, out-of-copyright
    original.


    Note that there are limits on what can be copyrighted. You cannot publish a book
    containing only the word the and then attempt to ext license fees


    > 1. http://www.wipo.org/'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# 2.2 Licensing 13


    from everyone using the word the in their books. However, if you create a sufficiently
    stylized painting of the word the, you would own the copyright to that particular
    representation, as long as it was sufficiently identifiable for you to show that
    prior art did not exist with the same representation. Although we are free to
    use the word the in this sentence, we would not be allowed to sell reproductions
    of your work without getting a license from you.


    These limitations apply to software as well. If you are licensed to alter someone
    else''s software and you make a trivial, one-word change, it would be absurd for
    you to claim copyright to that change in court; You would not be able to defend
    a copyright claim to that change your contribution would be as much in the public
    domain as the word the is. However, if you add significantly to the software,
    you would own the copyright to your modification, unless, for instance, the copyright
    owners of the original licensed the software for modification with the license
    restriction that copyright ownership of all modifications revert to them.


    # 2.2 Licensing


    Copyright owners have wide latitude in determining license terms. Common areas
    of restriction (or permission) include use, copying, distribution, and modification.
    As a concrete example, the GNU General Public License (GPL), commonly called the
    copyleft, see Appendix C) explicitly does not limit you. It limits only “copying,
    distribution, and modification.


    Here is an example of free-software jargon with which you want to be familiar.
    In the free-software world, public domain is used almost exclusively in terms
    of ownership. In other circles, it is often applied to use, as well. Magazine
    articles that refer to the GPL as “public-domain copyright” are clearly wrong
    because the GPL does not give ownership of the copyright to the public domain;
    articles that refer to it as a “public-domain license” are in one sense correct,
    because the GPL explicitly places no restrictions on use. Free software fanatics,
    however, often cringe at this public domain, and many believe it to be completely
    incorrect.


    Certain license restrictions may not be legal in certain localities. Most governing
    bodies prevent you from restricting what they consider fair use'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 14 Chapter 2 Licenses and Copyright


    in a license agreement. For example, many European countries explicitly allow
    reverse engineering of software and hardware for certain purposes, license terms
    restricting such activities notwithstanding. For this reason, most license agreements
    include a separability clause something like the following one, from the GPL:


    > If any portion of this section is held invalid or unenforceable under any particular
    circumstance, the balance of the section is intended to apply and the section
    as a whole is intended to apply in other circumstances.


    Most license agreements use less comprehensible language to say the same thing.


    Many people who attempt to write their own license terms without legal help write
    licenses with terms that have no legal force, and few of those licenses include
    a separability clause. If you wish to write your own license terms for your software,
    and if you care whether comply with the license terms, have an intellectual-property
    lawyer vet your license terms.


    # 2.3 Free Software Licenses


    # 2.3.1 Combinations of Free and Commercial Software


    Different free-software license terms allow various types of commercial use, modification,
    and distribution. It is often desirable to reuse existing code in your own projects.
    To some extent, it is inevitable that you do so—almost any program that you will
    be linked with the C library, so you need to be aware of the licensing terms of
    the C library, as well as the terms of other libraries that you link with your
    program. You may often wish to include fragments of other programs’ source code
    in your own programs, as well.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# 2.3 Free Software Licenses 15


    # 2.3.2 The GNU General Public License


    The GPL is one of the most restrictive free-software licenses. If you include
    source code that is licensed under the terms of the GPL in another program, that
    program must also be licensed under the terms of the GPL. The Free Software Foundation
    (FSF; author of the GPL) considers linking with a library to be “creating a derivative
    work”; others believe it to be a “work of more aggregation.” Therefore, the FSF
    holds that you are not allowed to link with a library covered under the terms
    of the GPL unless the program being linked is also covered by the terms of the
    GPL. However, some people hold that linking is “mere aggregation,” and the GPL
    says:


    In addition, mere aggregation of another work not based on the Program (or with
    a work based on the Program) on a volume of a storage or distribution medium does
    not bring the other work under the scope of this License.


    If you consider an executable to be a “volume of storage,” you could consider
    linking mere aggregation.


    To the best of our knowledge, this distinction has not yet been tested in court.
    In the fairly unlikely case that you wish to link a program licensed under the
    terms of the GPL with a library that is, ask the authors of the library in question
    for their interpretation.


    # 2.3.3 The GNU Library General Public License


    The GNU Library General Public License (LGPL) was designed to make libraries more
    generally useful. The point of the LGPL is to allow users to upgrade or improve
    their libraries without having to get new versions of programs linked against
    those libraries. To that end, the LGPL does not attempt to place any licensing
    restrictions on programs linked against the library, as long as those programs
    are linked against shared versions of libraries licensed under the LGPL or are
    provided with the object code


