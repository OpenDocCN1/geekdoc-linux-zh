    # 4.2 Make


    A mainstay of Unix development is make, a tool that makes it easy for you to describe
    how to compile programs. Although small programs may need only one command to
    compile their one source code file into one executable file, it is still easier
    to type make than to type gcc -02 -ggdb -DSOME_DEFINE -o foo foo.c. Furthermore,
    when you have lots of files to compile, and you have changed only a few source
    files, will create new object files only when the relevant source files have been
    modified.


    For make to perform this magic, you will need to describe all the files in a Makefile.
    Here is an example.


    ```

    1: # Makefile

    2:

    3: OBJS = foo.o bar.o baz.o

    4: LDLIBS = -L/usr/local/lib/-bar

    5:

    6: foo: $(OBJS)

    7:     gcc -o foo $(OBJS) $(LDLIBS)

    8:

    9: install:

    10:    install -m 644 foo /usr/bin

    11:    PHONY: install

    ```


    +   - Line 1 is a comment; make follows the common Unix tradition of delimiting
    comments with a # character.

    - Line 3 defines a variable called OBJS as foo.o bar.o baz.o.'
