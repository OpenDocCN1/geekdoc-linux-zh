    options are generally the same or similar on other compilers, as well. gcc has
    voluminous documentation on its options available as info gcc.


    +   - filename Specify the output file name. This is not usually needed if you
    are compiling to an object file because the default is to substitute filename.o
    for filename.o. However, if you are creating an executable, the default (for historical
    reasons) is to always create an executable named a.out. It is also useful if you
    wish to put output files in another directory.


    +   - c Compile, without linking, the source files specified on the command line,
    creating an object file for each source file. When using make, it is common to
    use one invocation of gcc per object file, because it is easy to see which file
    failed to compile if an error occurs. However, when you are typing commands by
    hand, it is commonly useful to specify many files in one invocation of gcc. In
    cases where specifying many input files on the command line would be ambiguous,
    specify only one, or gcc may get confused. For instance, gcc -c -o a.o a.o b.c
    is equivalent to gcc -c -o a.o b.c.


