    # 22.2.6 Switching Character Sets


    Most modern terminals (including the VT100, which the Linux console closely emulates)
    support at least two character sets. The primary one is usually ISO-8859-1 or
    something similar; the second is used primarily for line-drawing characters. S-Lang
    allows you to choose which character set is used for drawing characters.


    ```

    void SLsmg_set_char_set(int Alternate)

    ```


    When SLsmg_set_char_set() is called with a non-0 argument, new characters written
    to the display are mapped through the alternate character set. Calling SLsmg_set_char_set()
    with 0 as its parameter disables this mapping, allowing characters to appear normally.


    S-Lang defines a set of symbolic names for the commonly used drawing characters
    contained in the alternate character set. Table 22.1 shows the available line-drawing
    characters and S-Lang’s name for each.'
