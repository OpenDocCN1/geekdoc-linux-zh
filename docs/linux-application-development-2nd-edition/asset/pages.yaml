    void * dlopen(const char *filename, int flag);


    If filename is an absolute path (that is, it begins with a / character), dlopen()
    does not need to search for the library. This is the usual way to use dlmopen()
    from within application code. If filename is a simple file name, dlopen() searches
    for the filename library in these places:


    +   * A colon-separated set of directories specified in the environment variable-
    LD_ELF_LIBRARY_PATH, or, if LD_ELF_LIBRARY_PATH does not exist, in LD_LIBRARY_PATH.

    * The libraries specified in the file /etc/ld.so.cache. That file is generated
    by the ldconfig program, which lists every library it finds in a directory listed
    in /etc/ld.so.conf at the time that it is run.

    * /usr/lib

    * /lib


    If filename is NULL, dlopen() opens an instance of the current executable. This
    is useful only in rare cases. dlopen() returns NULL on failure.


    Finding the files is the easy part of dlopen()''s job, resolving the symbols is
    more complex. There are two fundamentally different types of symbol resolution,
    immediate and lazy. Immediate resolution causes dlmopen() to resolve all the unresolved
    symbols before it returns; lazy resolution means that symbol resolution occurs
    on demand.


    If most of the symbols will end up being resolved in the end, it is more efficient
    to perform immediate resolution. However, for libraries with many unresolved symbols,
    the time spent resolving the symbols may be noticeable; if this significantly
    affects your user interface, you may prefer lazy resolution. The difference in
    overall efficiency is not significant.


    While developing and debugging, you will almost always want to use immediate resolution.
    If your shared objects have unresolved symbols, you want to know about it immediately,
    not when your program crashes in the middle of seemingly unrelated code. Lazy
    resolution will be a'
