    for the file associated with it. The on-disk inode contains the number of file
    names that refer to that inode, called the link count. When a file is removed,
    the link count is decremented and if the link count is 0 and no processes already
    have the file open, the space is freed. If other processes have the file open,
    the disk space is freed when the final process has closed the file.


    All of this means that it is possible to


    +   - Have multiple processes access a file that has never existed in a file system
