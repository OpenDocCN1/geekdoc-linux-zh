    # 8.1.3 Using System Calls


    The interface that you as a programmer are expected to work with is the set of
    C library wrappers for the system calls. Therefore, we will use *system call through
    the rest of this book* to mean the C wrapper function that you call to perform
    a system call, rather than the ugly interface that the C library kindly hides
    from you.


    Most, but not all, system calls are declared in `<unistd.h>`. The `<unistd.h>`
    file is nearly a catch-all for system calls that do not seem to fit anywhere else.
    In order to determine which include files to use, you will generally need to use
    the system man pages. Although the function descriptions in the man pages are
    often terse, the man pages accurately state, right at the top, which include files
    need to be included to use the function.


    There is one snag here that is endemic on Unix systems. The system calls are documented
    in a separate man page section from the library functions, and you will be using
    library functions to access system calls. Where the library functions differ from
    the system calls, there are separate man pages for the library functions and the
    system calls. This would not be so bad except that there are two man pages for
    a function, you will nearly always want to read the one describing the library
    function with that name. But the system calls are documented in section 2, and
    the library functions in section 3, and because man gives lower numbers precedence,
    you will consistently show the wrong function.


    You should not simply specify the section number, however. System calls that use
    the minimal wrappers in the C library are not documented as part of the C library,
    so `man 3 function` will not find them. In order to make sure you have read all
    the information you need, first look up the man page without specifying the section.
    If it is a section 2 man page, check to see if there is a section 3 man page by
    the same name. If, as happens with `open()`, you get a section 1 man page, look
    explicitly in sections 2 and 3.'
