  md: '# Chapter 7 Creating and Using Libraries


    In either case, libname.a will be the same. The options used here are:


    +   - r Includes the object files in the library, replacing any object files ready
    in the archive that have the same names.


    +   - c Silent create the library if it does not already exist.


    +   - s Maintain the table mapping symbol names to object file names.


    There is rarely any need to use other options when building static libraries.
    However, ar has other options and other capabilities; the man page describes them
    in detail.


    # 7.2 Shared Libraries


    Shared libraries have several advantages over static libraries:


    +   - Linux shares the memory used for executable code among all the processes
    that use the shared library, so whenever you have more than one program using
    the same code, it is to your advantage, and to your users'' advantage, to put
    the code in a shared library.


    +   - Because shared libraries save system memory, they can make the whole system
    work faster, especially in situations in which memory is not plentiful.


    +   - Because code in a shared library is not copied into the executable, only
    one copy of the library code resides on disk, saving both disk space and the computer''s
    time spent copying the code from disk to memory when programs run.


    +   - When bugs are found in a library, a shared library can be replaced by a
    version that has the bugs fixed, instead of having to recompile every program
    that uses the library.


    The cost exerted by these advantages is primarily complexity. The executable consists
    of several interdependent parts, and if you give a binary'
