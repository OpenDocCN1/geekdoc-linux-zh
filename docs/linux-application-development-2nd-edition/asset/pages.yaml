  md: '# 304 Chapter 15 Terminals and Pseudo Terminals


    VSUSP


    Offset VSUSP is usually set to ^Z. It causes the current foreground process group
    to be sent SIGTSTP; see Chapter 14 for details.


    VEOL and VEOL2


    In canonical mode, these characters, in addition to the newline character (''\n''),
    signal an end-of-line condition. This causes the collected buffer to be transmitted
    and a new buffer started. On some systems, VEOL may share space with the VTIME
    character, which is active only in raw mode, just as VEOF may share space with
    VMIN. The VEOL2 character is not specified by POSIX.


    VPREINT


    Offset VPREINT is usually set to ^R. In canonical mode, if the ECHO local flag
    is set, it causes the VPREINT character to be echoed locally, a newline (and a
    carriage return, if appropriate) to be echoed locally, and the whole current buffer
    to be reprinted. This character is not specified by POSIX.


    VWERASE


    Offset VWERASE is usually set to ^W. In canonical mode, it erases all white space
    at the end of the buffer, then all adjacent non-space characters, which has the
    effect of erasing the previous word on the line. This character is not specified
    by POSIX.


    VLNEXT


    Offset VLNEXT is usually set to ^V. It is not entered into the buffer, but it
    causes the next character input to be put into the buffer literally, even if it
    is one of the control characters. For course, to enter a single literal VLNEXT
    character, type twice. This character is not specified by POSIX.


