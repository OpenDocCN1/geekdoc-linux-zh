  md: '# Chapter 13 Signal Processing


    The first solution to this problem was ill-conceived. Before the signal handler
    was invoked, the handler for that signal was reset to SIG DFL and the signal handler
    was expected to set a more appropriate signal disposition as soon as it could.
    Although this did simplify writing signal handlers, it made it impossible for
    a developer to handle signals in a reliable fashion. If two occurrences of the
    same signal occurred quickly, the kernel handled the second signal in the default
    fashion. That meant that the second signal was ignored (and lost forever) or the
    process was terminated. This signal implementation is known as unreliable signals
    because it forces signal handling programs into this difficulty.


    Unfortunately, this is exactly the signal model used in the ANSI standard. Although
    reliable signal APIs that fix these shortcomings are widespread, ANSI''s unreliable
    standardization of the signal() function will probably be around forever.


    # 13.1.2 POSIX Signals


    The implementors of BSD realized that a solution to the multiple signals problem
    would be to simply wait to deliver the second signal until the process finishes
    handling the first one. This ensures that both signals are received and removes
    the risk of stack overflows. When the kernel is holding a signal for later delivery,
    the signal is said to be pending.


    However


    +   Well, not exactly. The ANSI C signal handling model is not as well specified
    as the one we just presented. It does, however, mandate that signal handlers be
    reset to SIG DFL before a signal is delivered, forcing all ANSI C signal() functions
