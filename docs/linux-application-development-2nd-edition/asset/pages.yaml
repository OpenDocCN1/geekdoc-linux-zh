  md: '# 24.2 Error Handling


    Table 24.2 popt Errors

    | Error | Description |

    |--- | --- |

    | POPT_ERROR_NOARG | An argument is missing for an option. |

    | POPT_ERROR_BADOPT | An option''s argument could not be parsed. |

    | POPT_ERROR_OPTOODEEP | Option aliasing is nested too deeply. |

    | POPT_ERROR_BADQUOTE | Quotations do not match. |

    | POPT_ERROR_BADNUMBER | An option could not be converted to a number. |

    | POPT_ERROR_OVERFLOW | A given number was too big or too small.


    POPT_ERROR_NOARG

    An option that requires an argument was specified on the command line, but no
    argument was given. This can be returned only by poptGetNextOpt().


    POPT_ERROR_BADOPT

    An option was specified in argv but is not in the option table. This error can
    be returned only from poptGetNextOpt().


    POPT_ERROR_OPTOODEEP

    A set of option aliasing is nested too deeply. Currently, popt follows options
    only 10 levels to prevent infinite recursion. Only poptGetNextOpt() can return
    this error.


    POPT_ERROR_BADQUOTE

    A parsed string has a quotation mismatch (such as a single quotation mark). poptParseArgvString(),
    poptReadFile(), or poptReadConfigFile() can return this error.


    POPT_ERROR_BADNUMBER

    A conversion from a string to a number (int or long) failed due to the string
    containing nonnumeric characters. This occurs when poptGetNextOpt() is processing
    an argument of type POPT_ARG_INT or POPT_ARG_LONG.


    POPT_ERROR_OVERFLOW

    A string-to-number conversion failed because the number was too large or too small.
    Like POPT_ERROR_BADNUMBER, this error can occur only when poptGetNextOpt() is
    processing an argument of type POPT_ARG_INT or POPT_ARG_LONG.'
