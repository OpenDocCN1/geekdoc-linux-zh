- img_proc: true
  md: '# Chapter 9 The Process Model


    to run with root permissions but perform actions at the request of a user who
    may be trying to compromise system security through the daemon.


    The ftp daemon is a good example of a daemon that has flexible uid handling. It
    initially runs as root and then switches its uid to the uid of the user who logs
    into it (most systems start a new process to handle each ftp request, so this
    approach works quite well). This leaves the job of validating file accesses to
    the kernel where it belongs. Under some circumstances, however, the ftp daemon
    must open a network connection in a way that only root is allowed to do (see Chapter
    16 for details on this). The ftp daemon cannot simply switch back to root, because
    user processes cannot give themselves superuser access (with good reason!); but
    keeping the root rather than switching to the user''s uid would require the ftp
    daemon to check all file-system accesses itself. The solution to this dilemma
    has been applied symmetrically to both uids and primary gids, so we just talk
    about uids here.


    A process actually has three uids: *real uid*, *saved uid*, and *effective uid*?
    The effective uid is used for all security checks and is the only uid of the process
    that normally has any effect.


    The saved and real uids are checked only when a process attempts to change its
    effective uid. Any process may change its effective uid to either its saved or
    real uid. Only processes with an effective uid of 0 (processes running as root)
    may change their effective uid to an arbitrary value.


    Normally, a process''s effective, real, and saved uid are all the same. This mechanism
    solves the ftp daemon''s dilemma quite nicely, though when it starts, all its
    UIDs are set to 0, giving it root permissions. When a user logs in, the daemon
    sets its effective uid to the uid of the user, leaving both the saved and real
    uids as 0. When the ftp daemon needs to perform an action restricted to root,
    it sets its effective uid to the to the uid of the user who is logged in.


    Although the ftp daemon does not need the saved uid at all, the other class of
    programs that takes advantage of this mechanism, setuid and setgid binaries, does
    use it.


    +   Linux processes also have a fourth uid and gid used for file-system accesses.
    This is discussed on page 100.'
  merge: -1
