  md: '# More Information on Linux


    Eventually, you will want to know something about Linux that this book does not
    cover. Finding Linux information is not hard unless you do not know where or how
    to look.


    When you look for Linux information, you must realize that Linux was designed
    and created on the Internet, so most Linux documentation was designed for the
    Internet. Even if you have local sources of information, most of them will have
    been designed originally as online, Internet-available information sources. Your
    searches will be more successful if you keep this in mind, even if you limit yourself
    to printed documentation.


    The Linux Application Development Web site, http://www.awl.cseng/books/lad/, has
    updates to this book''s text, detailed information beyond this book''s scope,
    and pointers to more information all over the Internet. URLs given in this chapter
    may go out of date; when we are aware of dated URLs, we will post corrections
    on the Linux Application Development Web site.


    # 3.1 Overview of Linux Documentation


    One of the largest organized sources of information in the Linux world is the
    Linux Documentation Project (LDP). The LDP is primarily responsible for the standard
    online manual pages (man pages), a set of LDP books on a variety of topics, and
    a large collection of HOWTO documents that cover hundreds of topics, with varying
    degrees of detail. The HOWTO'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# 20 Chapter 3 More Information on Linux


    documents, in particular, are available in printed, hypertext, and plain-text
    formats.


    The Linux Usenet newsgroup hierarchy (comp.os.linux.*) can also be a useful source
    of information for people generally familiar with gleaming information from Usenet.
    If you wish to keep up with Linux progress, glance through comp.os.linux.announce
    on at least a weekly basis.


    Since the majority of the software you are likely to be running on a Linux system
    comes from the GNU project, the BSD project, or the X project, much of the documentation
    is similarly divided. The GNU project''s main documentation format is Texinfo,
    which provides typeset and hypertext documentation from the same source, and also
    provides many pages, although the Texinfo documentation is usually kept more up-to-date.
    The BSD project''s documentation is mostly in man pages. The official X distribution
    includes many pages and books that you can reprint and print, but easily view
    online. Most X programmers and users buy second-source documentation, including
    a well-known series of programming reference books published by O''Reilly.


    The Linux Documentation Project maintains a large Web site that is as close to
    canonical as is anything in the Linux world. The project''s home site is http://sunsite.unc.edu/LDP,
    and it is mirrored at hundreds of other sites around the globe, giving almost
    everyone quick, relatively local access.


    The majority of the printable documentation included by the Linux Documentation
    Project is made available on an irregular basis by various vendors over a variety
    of titles. In mid-1997, these books tend to be about 2,000 pages long. Linux Software
    Labs, Red Hat Software, and Yggdrasil are currently the three largest vendors
    of these books.


    Also, one vendor, Red Hat Software, sells a CD-ROM product called Linux Library
    that includes an indexed, browsable archive of various Linux documentation, including
    a snapshot of the LDP Web site.


    +   1. http://www.lsl.com

    2. http://www.redhat.com

    3. http://www.yggdrasil.com'
