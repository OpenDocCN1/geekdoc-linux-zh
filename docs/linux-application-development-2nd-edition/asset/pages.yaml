    # 10.3. Easily Determining Access Rights


    Although the mode of a file provides all the information a program needs to determine
    whether it is allowed to access a file, testing the set of permissions is tricky
    and error prone. As the kernel already includes the code to validate access permissions,
    a simple system call is provided that lets programs determine whether they may
    access a file in a certain way.


    ```

    #include <unistd.h>


    int access(const char * pathname, int mode);

    ```


    The mode is a mask that contains one or more of the following values:


    +   * F_OK   The file exists. This requires execute permissions on all the directories
    in the path being checked, so it could fail for a file that does exist.


    +   * R_OK   The process may read from the file.


    +   * W_OK   The process may write to the file.


    +   * X_OK   The process may execute the file (or search the directory).'
