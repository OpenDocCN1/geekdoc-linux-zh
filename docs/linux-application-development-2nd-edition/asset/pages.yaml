  md: '# 15.5 termios Reference 307


    NOFLSH

    Usually, when the INTR and QUIT characters are received, the input

    and output queues are flushed. When the SUSP character is received,

    only the input queue is flushed. If NOFLSH is set, neither queue is

    flushed.


    TOSTOP

    If TOSTOP is set, then when a process that is not in the current fore-

    ground process group attempts to write to its controlling terminal,

    SIGTTOU is sent to the entire process group of which the process is

    a member. By default, this signal stops a process, as if the SUSP

    character had been pressed.


    IEXTEN

    This flag is specified as implementation-dependent by POSIX. It en-

    ables implementation-defined processing of input characters. Al-

    tough portable programs will not set this, the CUCLO and certain

    character-erasing facilities in Linux depend on it being set. Fortu-

    nately, it is generally enabled by default on Linux systems, because

    the kernel initially enables it when setting up ttys, so you should

    not normally set it for any reason.


    # 15.5.9 Controlling read()


    Two elements in the c_cc array are not control characters and are relevant

    only in raw mode: VTIME and VMIN. In raw mode only, these determine

    when read() returns. In canonical mode, read() returns only when lines

    have been assembled or end-of-file is reached, unless the O_NONBLOCK option

    is is set.


    In raw mode, it would not be efficient to read one byte at a time, and it

    is also is inefficient to poll the port by reading in nonblocking mode. This

    leaves two complementary methods of reading efficiently.


    The first is to use select(), as documented in Chapter 12 and demonstrated

    in robin.c if select() says that a file descriptor is ready to read, you

