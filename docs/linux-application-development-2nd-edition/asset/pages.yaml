  md: '# Chapter 12 Advanced File Handling


    # 12.2.1 Page Alignment


    System memory is divided into chunks pages. On Intel and SPARC machines, each
    page is 4,096 bytes (4K), whereas the Alpha has 8,192-byte (8K) pages. The getpagesize()
    function returns the size, in bytes, of each page on the system.


    ```

    #include <unistd.h>


    size_t getpagesize(void);

    ```


    For each page on the system, the kernel tells the hardware how each process may
    access the page (such as write, execute, or not at all). When a process attempts
    to access a page in a manner that violates the kernel''s restrictions, a segmentation
    fault (SIGSEV) results, which normally terminates the process.


    A memory address is said to be page aligned if it is the address of the beginning
    of a page. In other words, the address must be an integral multiple of the architecture''s
    page size. On a system with 4K pages, 4,096, 16,384, and 32,768 are all page-aligned
    addresses (of course, there are many more) because the first, second, fifth, and
    ninth pages in the system begin at those addresses.


    # 12.2.2 Establishing Memory Mappings


    New memory maps are created by the mmap() system call.


    ```

    #include <sys/mman.h>


    caddr_t mmap(caddr_t address, size_t length, int protection, int flags,

    int fd, off_t offset);

    ```


    The address specifies where in memory the data should be mapped. Normally, address
    is NULL, which means the process does not care where the new mapping is, allowing
    the kernel to pick any address. If an address is specified, it must be page aligned
    and not already in use. If the requested mapping would conflict with another mapping
    or would not be page aligned, mmap() may fail.'
