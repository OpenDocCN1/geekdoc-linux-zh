    refer to the same inode


    Unix has always worked this way, but these operations can be disconcerting to
    new users and programmers. As long as you keep in mind that a file name is merely
    a pointer to a file''s on-disk inode, and that the inode is the real resource,
    you should be fine.


    # 10.1 The File Mode


    Every file on a system has a file type (such as unnamed pipe or character device),
    as well as a set of access permissions that define what processes may access the
    file. A file''s type and access permissions are combined in a 16-bit value (a
    C short) called the file mode.


    The bottom 12 bits of a file''s mode represent the access permissions that govern
    access to the file, as well as file permission modifiers. The file permission
    modifiers serve a variety of functions. The most important functions are allowing
    the effective user and group IDs to change when the file is executed.


