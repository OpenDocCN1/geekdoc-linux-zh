    ![](img/095d18a9be827fc2d1ccdd5b058befe5_149_0.png)


    **Figure 9.1** Sessions, Process Groups, and Processes


    In order to manage all of these processes, the kernel needs to group the processes
    in ways more complicated than the simple parent/child relationship we have already
    discussed. These groupings are called **sessions** and **process groups**. Figure
    9.1 shows the relationship between sessions, process groups, and processes.


    # 9.6.1 Sessions


    When a user logs out of a system, the kernel needs to terminate all the processes
    the user had running (otherwise, users would leave a slew of processes sitting
    waiting for input that can never arrive). To simplify this task, processes are
    organized into sets of **sessions**. The session’s ID is the same as the pid of
    the process that created the session through the `setsid()` system call. That
    process is known as the *session leader* for that session group. All of that process’s
    descendants are members of session unless they specifically remove themselves
    from it. The `setsid()` function does not take any arguments and returns the new
    session ID.


    ```

    #include <unistd.h>


    pid_t setsid(void);

    ```'
