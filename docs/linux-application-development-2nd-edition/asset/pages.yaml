    # 8.1 Understanding System Calls


    This book mentions system calls (syscalls, for short) repeatedly because they
    are fundamental to the programming environment. At first glance, they look just
    like normal C function calls. That is no accident; they are function calls, just
    a special variety. To understand the difference, you need to have a basic understanding
    of the structure of the operating system.


    Although there are many pieces of code that make up the Linux operating system
    (utility programs, applications, programming libraries, device drivers, file systems,
    memory management, and so on), all these pieces run in one of two contexts: user
    mode or kernel mode.


    When you write a program, the code that you write runs in user mode. Device drivers
    and file systems, by contrast, run in kernel mode. In user mode, programs are
    strictly protected from damaging each other or the rest of the system. Code that
    runs in kernel mode has full access to the machine to do, and break, anything.


