    ```


    # ## 24.3 Option Aliasing


    One of the primary benefits of using popt over getopt() is the ability to use
    option aliasing. This lets the user specify options that popt expands into other
    options when they are specified. If the standard grep program made use of popt,
    users could add a text option that expanded to -i E -2 to let them more easily
    find information in text files.'
