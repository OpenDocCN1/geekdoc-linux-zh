    tclone() system call, which is used to create threads (and can also create

    normal processes).


    # Process Attributes


    # 9.2.1 The pid and Portage


    Two of the most basic attributes are its process ID, or pid, and the pid

    of its parent process. A pid is a positive integer that uniquely identifies

    a running process and is stored in a variable of type pid_t. When a new

    process is created, the original process is known as the parent of the new

    process and is notified when the new child process ends.


    When a process dies, its exit code is stored until the parent process requests

    it The exit status is kept in the kernel''s process table, which forces the

    kernel to keep the process''s entry active until it can safely discard its exit

    status. Processes that have exited and are kept around only to preserve

    their exit status are known as zombies. Once the zombie''s exit status has

    collected, the zombie is removed from the system''s process table.


    If a process''s parent exits (making the child process an orphan process),

    that process becomes a child of the init process. The init process is the

    first process started when a machine is booted and is assigned a pid of 1.

    One of the primary jobs of the init process is to collect the exit statutes

    of processes whose parents have died, allowing the kernel to remove the

    child processes from the process table.


    Processes can find their pid and their parent''s pid through the getpid()

    getppid() functions.


    ```

    pid_t getpid(void)

    ```


    Returns the pid of the current process.'
