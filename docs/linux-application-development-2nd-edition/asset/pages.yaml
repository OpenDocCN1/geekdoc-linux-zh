  md: "# 16.5.2 IPv4 Addressing\n\nIPv4 connections are a 4-tuple (local host, local\
    \ port, remote host, remote port). Each part of the connection must be determined\
    \ before a connection can be established. Local host and remote host are each\
    \ IP addresses. IP addresses are 32-bit (4-byte) numbers unique across the entire\
    \ connected network. Usually, they are written as aaa.bbb.ccc.ddd, with each element\
    \ in the address being the decimal representation of one of the bytes in the machine's\
    \ address. The left-most number in the address corresponds to the most significant\
    \ byte in the address. This format for IP addresses is known as dotted-decimal\
    \ notation.\n\nAs most machines need to run multiple concurrent TCP/IP applications,\
    \ an IP number does not provide a unique identification for a connection on a\
    \ single machine. Port numbers are 16-bit numbers that uniquely identify one endpoint\
    \ of a single host. The combination of an IP address and a port number identifies\
    \ a connection endpoint anywhere on a single TCP/IP network (the Internet is a\
    \ single TCP/IP network). Two connection endpoints form a TCP connection, so IP\
    \ number/port pairs uniquely identify a TCP/IP connection on a network.\n\nAlthough\
    \ the port numbers range from 0 to 65,535, Linux divides them into two classes.\
    \ The reserved ports, numbering from 0 to 1,024, may be used only by processes\
    \ running as root. This allows client programs to trust that a program running\
    \ on a server is not a Trojan horse started by a user.¹¹⁰\n\n# 16.5.3 IP Socket\
    \ Addresses\n\nIP addresses are stored in a struct sockaddr_in, which is defined\
    \ as follows:\n\n```\n#include <sys/socket.h>\n#include <netinet/in.h>\n\nstruct\
    \ sockaddr_in {\n    short sin_family;        /* AF_INET */\n    unsigned short\
    \ sin_port;    /* port number */\n    struct in_addr sin_addr;    /* IP address\
    \ */\n};\n```\n\n> ¹⁰ It may still be a Trojan horse started by the superuser,\
    \ however."
