  md: '# 9.6.2 Controlling Terminal


    Every session is tied to a terminal from which processes in the session get their
    input and to which they send their output. That terminal may be the machine''s
    local console, a terminal connected over a serial line, or across a network (see
    Chapter 15 for information on pseudo terminal devices). The terminal to which
    a session is related is the controlling terminal (or controlling tty) of the session.
    A terminal can be the controlling terminal for only one session at a time.


    Although the controlling terminal for a session can be changed, this is usually
    done only by processes that manage a user''s initial logging into a system. Information
    on how to change a session''s controlling tty is in Chapter 15, on pages 266–270.


    # 9.6.3 Process Groups


    One of the original design goals of Unix was to construct a set of simple tools
    that could be used together in complex ways (through mechanisms like pipes). Most
    Linux users have done something like the following, which is a practical example
    of this philosophy.


    ```

    $ grep "[a-zA-Z].*92" | more

    ```


    Another popular feature added to Unix fairly early was job control. Job control
    allows users to suspend the current task (known as the foreground task) while
    they go and do something else on their terminals. When the suspended task is a
    sequence of processes working together, the system needs to keep track of which
    processes should be suspended when the user wants to suspend "the" foreground
    task. Process groups allow the system to keep track of which processes are working
    together and hence managed together via job control.


    Processes are added to a process group through setpgid().


    ```

    int setpgid(pid_t pid, pid_t pgid);

    ```


    pid is the process that is being placed in a new process group (0 may be used
    to indicate the current process). pgid is the process group ID the process'
