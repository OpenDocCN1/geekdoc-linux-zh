    width, int fill);

    ```


    All of these functions, except SLsmg_write_wrapped_string(), write the requested
    string into the buffer at the current location using the current color and character
    set. They all have different ways of deciding what to write, however. After the
    information has been written, the cursor is advanced to the end of the area affected,
    just as on a normal terminal. Any strings that extend past the right side of the
    screen are truncated rather than wrapped. This is different from normal terminal
    output, it is reasonable for most full-screen applications, in which wrapped text
    has an adverse effect on the screen''s layout.


