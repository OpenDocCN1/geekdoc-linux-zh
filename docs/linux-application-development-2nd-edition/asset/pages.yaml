    digit contains the file permission modifiers, and the high-order two digits indicate
    the file type. For example, a file mode is 0041777 has a file type of 04, a file
    permission modifier of 1, and access bits 0777. Similarly, a file of mode 01000755
    is of type 010, has no file permission modifiers set, and has access permissions
    of 0755.


    # 10.1.1 File Access Permissions


    Each of the three access digits represents the permissions for a different class
    of users. The first digit represents the permissions for the file''s owner, the
    second digit represents permissions for users in the file''s group, and the final
    digit represents the permissions for all other users. Each octal digit is made
    up of three bits, which represent read permission, write permission, and execute
    permission, from most significant to least significant bit. World permissions
    is commonly used to refer to the permission given to all three classes of users.


    Let''s try to make the previous paragraph a little more concrete through some
    examples. Linux''s chmod command allows the user to specify an access mode in
    octal and then applies that mode to one or more files. If we have a file, somefile,
    which we would like to allow only the owner to write but any user (including the
    owner) to read, we would use mode 0644 (remember, this is in octal). The leading
    6 is 110 in binary, which indicates that the type of user to which it refers (in
    this case, the owner) is given both read and write permission; the 4s are 010
    binary, giving the other types of users (group and other) only read permissions.


    ```

    $ chmod 0664 somefile

    $ ls -l somefile

    -rw-r--r-- 1 ewt devel 31 Feb 15 15:12 somefile

    ```


    If we wanted to allow any member of group devel to write the file, we would use
    mode 0664 instead.


    ```

    $ chmod 0664 somefile

    $ ls -l somefile

    -rw-rw-r-- 1 ewt devel 31 Feb 15 15:12 somefile

    ```


