    Here is the complete prototype of main() in the Linux, Unix, and ANSI C world:


    ```

    int main(int argc, char * argv[]);

    ```


    You may be surprised to see that main() returns a value (other than void). The
    value main() returns is given to the process''s parent after the process has exited.
    By convention, 0 indicates that the process completed successfully, and non-0
    values indicate failure. Only the lower eight bits of a process''s exit code are
    considered significant. The negative values between -1 and -128 are reserved for
    processes that are terminated abnormally by another process or the kernel. An
    exit code of 0 indicates successful completion, and exit codes between 1 and 127
    indicate the program exited because of an error.


    The first parameter, argc, contains the number of command-line arguments passed
    to the program, whereas argv is an array of pointers to the argument strings.
    The first item in the array is argv[0], which contains the name of the program
    being invoked (though not necessarily the complete path to the program). The next-to-last
    item in the array argv[1] points to the final command-line argument, and argv[argc]
    contains NULL.


    To access the environment directly, use the following global variable:


    ```

    extern char ** environ[];

    ```


    This provides environ as an array of pointers to each element in the program''s
    environment (remember, each element is a NAME=VALUE pair), and the final item
    in the array is Null. This declaration appears in <unistd.h>, so you do not need
    to declare it yourself. The most common way of checking for elements in the environment
    is through getenv(), which eliminates the need for directly accessing environ.


    ```

    const char * getenv(const char * name);

    ```


    The sole parameter to getenv() is the name of the environment variable whose value
    you are interested in. If the variable exists, getenv() returns a pointer to its
    value. If the variable does not exist in the current environment (the environment
    pointed to by argv), it returns NULL.'
