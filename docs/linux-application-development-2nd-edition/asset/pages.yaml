    # # 16.6 Socket Errors


    A number of errno values occur only with sockets. Here is a list of socket-specific
    errors and a short description of each:


    +   - ENOTSOCK

    A socket-specific operation was attempted on a file descriptor that references
    a file other than a socket.


    +   - EDESTADDRREQ

    A attempt was made to send data over a socket without providing the destination
    address. This can occur only for datagram sockets.


    +   - EPROTOTYPE

    An inappropriate protocol type was specified for the socket.


    +   - ENOPROTOOPT

    An attempt to set an invalid option was made.


    +   - EPROTONOSUPPORT

    A request was made for an unsupported protocol.


    +   - ESOCKTNOSSUPPORT

    An attempt was made to create an unsupported socket type.


    +   - EPFNOSSUPPORT

    An unsupported protocol family was specified.


    +   - EAFNOSSUPPORT

    An unsupported address family was specified.'
