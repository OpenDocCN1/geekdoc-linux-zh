    Like open(), socket()) returns a value less than 0 on error and a file descriptor,
    which is greater than or equal to 0, on success.


    The three parameters specify the protocol to use. The first parameter specifies
    the protocol family that should be used and is usually one of the values specified
    in Table 16.1.


    The next parameter, type, is SOCK_STREAM or SOCK_DGRAM, SOCK_STREAM specifies
    a protocol from the specified family that provides a streaming connection, whereas
    SOCK_DGRAM specifies a datagram protocol from the same family.


    The final parameter specifies which protocol is to be used, subject to the constraints
    specified by the first two parameters. Usually, this parameter is 0, letting the
    kernel use the default protocol of the specified type and family. For the PF_INET
    protocol family, TCP is the default stream protocol and UDP is the default datagram
    protocol.


    +   A couple of other values are available, but they are not usually used by application
    code.'
