    # 9.7 Introduction to ladsh


    To help illustrate many ideas discussed in this book, we will develop a subset
    of a Unix command shell as the book progresses. At the end of the book, the shell
    will support


    +   * Simple built-in commands

    * Command execution

    * I/O redirection (>, |)

    * Job control


    The full source code of the final version of this shell, called ladsh, is in Appendix
    B. As new features are added to ladsh, the changes to the source code will be
    described in the text. To reduce the number of changes made between the versions,
    some early versions of the shell are a bit more complicated than they need to
    be. These extra duplications make it easier to develop the shell later in the
    book though, so please be patient. Just take those pieces on faith for now; we
    explain them all to you later in the book.


