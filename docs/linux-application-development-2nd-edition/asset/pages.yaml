  md: '# 12.2 Memory Mapping


    Linux allows a process to map files into its address space. Such a mapping creates
    a one-to-one correspondence between data in the file and data in the mapped memory
    region. Memory mapping has a number of applications.


    +   1. High-speed file access. Normal I/O mechanisms


    +   2. Executable files can be mapped into a program''s memory, allowing a program
    to dynamically load new executable sections. This is how dynamic loading, described
    in Chapter 25, is implemented.


    +   3. New memory can be allocated by mapping portions of /dev/zero, a special
    device that is full of zeros,or through an anonymous mapping. Electric Fence,
    described in Chapter 6, uses this mechanism to allocate memory.


    +   4. New memory allocated through memory maps can be made executable, allowing
    it to be filled with machine instructions, which are then executed. This feature
    is used by just-in-time compilers.


    +   5. Files can be treated just like memory and read using pointers instead of
    system calls. This can greatly simplify programs by eliminating the need for read(),
    write(), and lseek() calls.


    +   6. Memory mapping allows processes to share memory regions that persist across
    process creation and destruction. The memory contents are stored in the mapped
    file, making it independent of any process.


    Although saving a memory copy may not seem that important, thanks to Linux''s
    efficient caching mechanism, these copy latencies are the slowest part of writing
    to data files that do not have O_SYNC set.


    Although most character devices do not allow themselves to be mapped, /dev/zero
    does so for exactly this type of application'
