    MAP_GROWDOWN Trying to access the memory immediately before a mapped region normally
    causes a SIGSEGV. This flag flags the kernel to allocate a new anonymous region
    before this one if a process tries to access the memory there and continue the
    process as normal. This is used to allow the kernel to automatically grow processes’
    stacks.


    The only limit on MAP_GROWDOWN is the stack-size resource limit, discussed on
    pages 107–109. If no limit is set, the kernel will grow the segment whenever doing
    so would be beneficial. It will not grow the segment past other regions, however.


