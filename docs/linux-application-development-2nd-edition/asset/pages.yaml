    # 16.5 Networking Machines with TCP/IP


    The primary use for sockets is to allow applications running on different machines
    to talk to one another. The TCP/IP protocol family [Stevens, 1994] is the protocol
    used on the Internet, the largest set of networked computers in the world. Linux
    provides a complete, robust TCP/IP implementation that allows it to act as both
    a TCP/IP server and client.


    The current version of TCP/IP is version 4 (IPv4). The rapid growth of the Internet
    has shown a few shortcomings of this version, and at the time of this writing,
    work has begun on TCP/IP version 6 (IPv6). This version is carefully designed
    to allow a slow migration from it IPv4, and Internet hosts are expected to convert
    to IPv6 over time.


    The socket interface for IPv4 and the proposed interface for IPv6 are a bit different.
    We will cover only IPv4 sockets; if you need to develop IPv6 applications, keep
    in mind that the remainder of this chapter may not be completely applicable, though
    the concepts are the same.


    # 16.5.1 Byte Ordering


    TCP/IP networks are usually heterogeneous; they include a wide variety of machines
    and architectures. One of the most common differences between architectures is
    how they store numbers.


    Computer numbers are made up of a sequence of bytes. C integers are commonly 4
    bytes (32 bits), for example. There are quite a few ways of storing those four
    bytes in memory. Big-endian architectures store the'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# 16.5 Networking Machines with TCP/IP 341


    most significant byte at the lowest hardware address, and the other bytes follow
    in order from most significant to least significant. Little-endian machines store
    multibyte values in exactly the opposite order: The least significant byte is
    stored at the smallest memory address. Other machines store bytes in different
    orders yet.


    Because multiple byte quantities are needed as part of the TCP/IP protocol, the
    protocol designers adopted a single standard for multibyte values are sent across
    the network. TCP/IP mandates that big-endian byte order be used for transmitting
    protocol information and suggests that it be used for application data, as well
    (though no attempt is made to enforce the format of an application’s data stream).
    The ordering used for multibyte values sent across the network is known as the
    network byte order.


    Four functions are available for converting between host byte order and network
    byte order.


    ```

    #include <netinet/in.h>

    ```


    ```

    unsigned int htonl(unsigned int hostlong);

    unsigned short htons(unsigned short hostshort);

    unsigned int ntohl(unsigned int netlong);

    unsigned short ntohs(unsigned short netshort);

    ```


    Although each of these functions is prototyped for unsigned quantities, they all
    work fine for signed quantities, as well.


    The first two functions, htonl() and htons(), convert longs and shorts, respectively,
    from host order to network order. The final two, ntohl() and ntohs(), convert
    longs and shorts to network order from the host byte ordering.


    Although we use the term long in the descriptions, that is a misnomer. htonl()
    and ntohl() both expect 32-bit quantities, not values that C longs. We prototype
    both functions as manipulating int values as all Linux platforms currently use
    32-bit integers.


    9. Although it may seem like this is an obvious thing to do, some protocols allow
    the sender to use any byte order and depend on the recipient to convert the information
    to the proper (native) order. This gives a performance boost when like machines
    communicate, at the expense of algorithmic complexity.'
