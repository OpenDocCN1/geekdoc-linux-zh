  md: '# Time


    # 17.1 Telling Time and Dates


    # 17.1.1 Representing Time


    Unix and Linux keep track of time in seconds since before or after the epoch,
    which is defined as midnight, January 1, 1970 UTC.'' Positive time values are
    after the epoch; negative time values are before the epoch. In order to provide
    processes with the current time, Linux, like all versions of Unix, provides a
    system call called time():


    ```

    #include <time.h>

    time_t time(time_t *t);

    ```


    time() returns the number of seconds since epoch, and if t is non-null, it also
    fills in t with the number of seconds since epoch.


    Some problems require higher resolution. Linux provides another system call, gettimeofday(),
    which provides more information:


    +   - UTC: Universal Coordinated Time, also known as UCT; roughly equivalent to
    Greenwich Mean Time (GMT) and Zulu. Time zone designations involve technical detail
    far beyond the scope of this book.'
