    POPT_ERROR_ERRNO


    A system call returned with an error, and errno still contains the error from
    the system call. Both popReadConfigFile() and poptDefaultConfig() can return this
    error.


    Two functions are available to make it easy for applications to provide good error
    messages.


    ```

    const char * poptStrrerror(const int error);

    ```


    This function takes a popt error code and returns a string the error, just as
    with the standard strerror() function.


    ```

    char * poptBadOption(poptContext con, int flags);

    ```


    If an error occurred during poptGetNextopt(), this function returns the option
    that caused the error. If the flags POPT_BADOPTION_NOALIAS, the outermost option
    is returned. Otherwise, flags should be 0, and the option that is returned may
    have been specified through an alias.


    These two functions make popt error handling trivial for most applications. When
    an error is detected from most of the functions, an error message is printed along
    with the error string from poptStrrerror(). When an error occurs during argument
    parsing, code similar to the following displays a useful error message.


    ```

    fprintf(stderr, "%s: %s\n",

    poptBadOption(poptcon, POPT_BADOPTION_NOALIAS),

