    # 9.4.3 Running New Programs


    Although there are six ways to run one program from another, they all do about
    the same thing—replace the currently running program with another—all traces of
    the currently running program disappear. Use the word replace—all if you want
    to have the original program stick around, you must create a new process with
    fork() and then execute the new program in the child process.


    The six functions feature only slight differences in the interface. Only one of
    these functions, execve(), is actually a system call under Linux. Utilize the
    rest of the functions are implemented in user-space libraries and utilize execve()
    to execute the new program. Here are the prototypes of the exec() family of functions.'
