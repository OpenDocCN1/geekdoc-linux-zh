    A leading . character in pattern will match a . character in string only if it
    is the first character in string or FNM_PATHNAME is set and the . character in
    string directly follows a \.


    fnmatch() returns 0 if the pattern matches the string, FNM_NOMATCH if the pattern
    does not match the string, or some other unspecified value if an error occurs.


