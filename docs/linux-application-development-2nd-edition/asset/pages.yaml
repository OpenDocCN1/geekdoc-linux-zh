    # 10.2.1 File Descriptors


    When a process gains access to a file (usually called opening the file), the kernel
    returns a file descriptor that the process uses to perform subsequent operations
    on the file. File descriptors are small, positive integers, which serve as indices
    into an array of open files the kernel maintains for each process.


    The first three descriptors for a process (0, 1, and 2) have standard usages.
    The first, 0, is known as standard input (stdin) and is where programs should
    take their interactive input. File descriptor 1 is called standard output (stdout),
    and most output from the program should be directed there. Errors should be sent
    to standard error (stderr), which is file descriptor 2. The standard C library
    follows these rules, gets() and printf() use stdin and stdout, respectively, and
    these conventions allow shells to redirect a process''s input and output.


    The <unistd.h> header file provides the STDIN_FILENO, STDOUT_FILENO, STDERR_FILENO
    macros, which evaluate to the stdin, stdout, and stderr file descriptors, respectively.
    Using these symbolic names can make code slightly more readable.


