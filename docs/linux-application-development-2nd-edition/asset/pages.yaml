  md: '# 13.2.2 Using sigset_t


    All the POSIX signal functions take a set of signals as one of the parameters
    (or one of the parameters in the case of sigaction()). The sigset_t data type
    is used to represent a signal set and it is defined in <signal.h>. POSIX defines
    five functions for manipulating signal sets.


    ```

    #include <signal.h>


    int sigemptyset(sigset_t *set);

    int sigfillset(sigset_t *set);

    int sigaddset(sigset_t *set, int signum);

    int sigdelset(sigset_t *set, int signum);

    int sigismember(const sigset_t *set, int signum);

    ```


    int sigemptyset(sigset_t *set);


    > Makes the signal set pointed to by set empty (no signals are present in the
    set).


    int sigfillset(sigset_t *set);


    > Includes all available signals in the set.


    int sigaddset(sigset_t *set, int signum);


    > Adds signal signum to set.


    int sigdelset(sigset_t *set, int signum);


    > Removes signal signum from set.


    int sigismember(const sigset_t *set, int signum);


    > Returns non-0 if signal signum is in set, 0 otherwise.


    The only way any of these functions can return an error is if their signum parameter
    is an invalid signal. In that case, they will return EINVAL. Needless to say,
    this should never happen.'
