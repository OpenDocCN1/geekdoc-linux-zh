  md: '# Chapter 15 Terminals and Pseudo Terminals


    The VTIME and VMIN "control characters" have a complex relationship. VTIME specifies
    an amount of time to wait in tenths of seconds (which cannot be larger than a
    cc_t, usually an 8-bit unsigned char), which may be 0. VMIN specifies the minimum
    number of bytes to wait for (not to read—read())''s third argument specifies the
    maximum number of bytes to read, which may also be 0.


    +   - If VTIME is 0, VMIN specifies the number of bytes to wait for. A read()
    call will not return until at least VMIN bytes have been read or a signal has
    received.

    - If VMIN is 0, VTIME specifies the number of tenths of seconds for read() to
    wait before returning, even if no data is available. In this case, read() returning
    0 does not necessarily indicate an end-of-file condition.

    - If neither VTIME nor VMIN is 0, VTIME specifies the number of tenths of seconds
    for read() to wait after at least one byte is available. If data is available
    when read() is called, a timer starts immediately. If data is not available when
    read() is called, a timer is started when the first byte arrives. The() returns
    either when at least VMIN bytes have arrived or when the timer expires, whichever
    comes first. It will always return at least one byte because the timer does not
    start until at least one byte is available.

    - If VTIME and VMIN are both 0, read() will always return immediately, even if
    no data is available. Again, 0 does not necessarily indicate an end-of-file condition.


    # 15.6 Pseudo ttys


    A pseudo tty, or pty, is a mechanism that allows a user-level program to take
    the place (logically speaking) of a tty driver for a piece of hardware. The pty
    has two distinct ends: The end that emulates hardware is called the pty master,
    and the end that provides programs with a normal tty interface is called the pty
    slave. The slave looks like a normal tty; the master is like a standard character
    device and is not a tty.'
