  md: '# Glossary


    **advisory locking** Locking that is not enforced: All processes that manipulate
    the locked files must explicitly check for the existence of locks.


    **ar** The archiving utility used most often to create libraries.


    **big-endian** Multibyte values stored with the most significant byte in the lowest
    memory address or first byte transmitted, followed by the remainder of the bytes
    in order of significance.


    **blocked signals** Signals a process is not prepared to accept. Usually, signals
    are blocked for a short time while the process is performing a sensitive task.
    When a signal is sent to a process that is blocking that signal, the signal remains
    pending until the process unblocks the signal.


    **BRE** Basic Regular Expression, the type of string matching expression used
    by the `grep` utility.


    **break** A long stream of 0 bits on a serial interface.


    **capability** Actions a terminal can take in response to received escape sequences.


    **catching a signal** Providing a function that gets executed when a particular
    signal is sent to the process.


    **control character** A character in a data stream that provides control information
    to the processing program but does not change the processing mode.


    **copy-on-write** Marking as read-only a page meant to be writeable and private
    to multiple processes, producing a writeable version for each process as each
    process tries to write to it.


    **CSI** Command Sequence Introduction; a character that initiates a complex escape
    sequence.


    **dangling link** A symbolic link that references a nonexistent file.'
  merge: -1
  pgno: 544
- img_proc: true
  md: '# 518 Glossary


    dotted-decimal notation Writing an IP address in the form aaa.bbb.ccc.ddd


    ELF Executable and Linking Format; a generic file format for various kinds of
    binary files, including object files, libraries, shared libraries, and executables.


    epoch A point from which time is measured. Linux, like all Unix systems, defines
    its epoch as midnight, January 1, 1970 UTC.


    ERE Extended Regular Expression, the type of string matching expression used by
    the egrep utility.


    escape character A character in a data stream that changes the data processing
    from normal mode to an escape mode, which usually involves reading some subsequent
    characters for control information.


    escape sequence A series of characters that is treated differently by the program
    reading it. The escape sequence often encodes control information in a stream
    of data.


    file mode A 16-bit value that specifies a file''s type and access permissions.


    fsgid The group ID associated with a process that is used to verify permissions
    for file system accesses by that process.


    fsuid The user ID associated with a process that is used to verify permissions
    for file system accesses by that process.


    glob Expanding *, ?, and [] according to file-name matching rules.


    glyph The shape used to represent a character.


    init process The first process on a Linux system. It is the only process started
    by the kernel and is responsible for starting every other process on the system.
    When processes are orphaned, the init process becomes the parent of the orphaned
    process and is responsible for preventing that process from becoming a zombie.


    kernel mode The unlimited, privileged execution environment in which the kernel
    runs, protected from programs running in user mode.


    little-endian Multibyte values stored with the least significant byte in the lowest
    memory address or first byte transmitted, followed by the remainder of the bytes
    order of significance.'
  merge: -1
  pgno: 545
- img_proc: true
  md: '# Glossary 519


    In The linker that combines object files into an executable.


    locked memory A memory region that is not swapped.


    major fault A fault caused by a process accessing memory that is not currently
    available, which forces the kernel to access the disk.


    mandatory locking Locking that is enforced; for example, attempting to write to
    an area on which another process has placed a write lock block until the write
    lock is removed.


    minor fault A fault caused by a process accessing memory that is not currently
    available but does not require a disk access for the kernel to satisfy.


    modal The method of control in which the response to input depends on the mode
    of a program is in, which is generally determined by prior input.


    network byte order The order in which bytes in multibyte values are transmitted
    across a network. For TCP/IP, the network byte order is big-endian.


    origin The first character of the first row of a character-matrix display.


    orphan process A process whose parent has died.


    pending connections Socket connections made to addresses that have been listen()ed
    to have not yet been accept()ed.


    pending signals Signals that have been sent to a process but have not yet delivered.


    pid A positive integer associated with a process. A process''s pid is not shared
    with any other process on the system.


    process group Set of processes logically related. Process groups are moved between
    a terminal''s foreground and background through job control, most commonly by
    shells.


    reliable signals Signal implementations defined to allow consistent and correct
    signal handling.


    reserved ports The TCP port numbers from 0 to 1,024, which may be used only by
    processes running as root.'
  merge: -1
  pgno: 546
- img_proc: true
  md: 'resident set size Amount of RAM a process is currently using (swapped out portions
    of the process do not contribute to its resident set size).


    session Set of process groups running on a single terminal.


    shell Program whose primary purpose is to run other programs and perform job control;
    popular Linux shells include the Bourne again shell (bash) and the enhanced C-shell
    tcsh.


    system call The mechanism used by user-mode processes to request kernel-mode services.


    termcap Original terminal capabilities database.


    terminfo New, improved terminal capabilities database.


    tty Bit-stream-oriented terminal interface.


    unreliable signals Signal implementations that make consist signal handling impossible.
    Most unreliable implementations either deliver signals no matter what a process''s
    execution state is, or they reset signal handlers to a default value when a signal
    is delivered.


    user mode The limited execution environment in which programs run.


    vcs Virtual console screen; a memory-oriented device for accessing and changing
    the contents of a virtual console.


    vsca Virtual console screen with attributes; a memory-oriented device for accessing
    and changing the contents and attributes of a virtual console.


    zombie A process that has terminated, but whose parent has not collected its exit
    status, causing the terminated process to be left in the system’s process table.'
