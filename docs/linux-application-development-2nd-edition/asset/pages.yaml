  md: '# 20.1 Capability Databases 389


    The curses library determines which sequences to send to the terminal by consulting
    a database that, for each terminal, maps capability names to the strings that
    need to be sent.


    Linux, like all modern Unix systems, provides two databases that describe terminals
    in terms of the capabilities they possess and which escape sequences map to capabilities.
    The older database is called termcap (short for terminal capabilities) and is
    kept in one large ASCII flat file called /etc/termcap. This file has become unwieldy;
    it has grown to approximately a megabyte. The newer database is called terminfo
    (short for terminal information) and is kept in many binary files, one per terminal,
    normally in subdirectories of the /usr/lib/terminfo directory.


    Within each database, the capability information for each terminal is indexed
    by one or more unique names. Both databases use the same name for the same terminal.
    For instance, the Linux console is called linux in both termcap and terminfo.
    You tell programs which terminal to use by setting the TERM environment variable.
    When writing programs that use termcap and terminfo, you rarely need to look at
    the low-level libraries for accessing the termcap or terminfo databases will automatically
    take care of that.


    However, if you wish to do Linux-specific optimizations, especially if you want
    to use some of Linux''s unusual capabilities that are not described in the capability
    databases, you can check the TERM environment variable with code like this:


    ```

    if (!strcmp("linux", getenv("TERM"))) {

    /* should be a Linux console */

    } else {

    /* handle as a normal serial terminal */

    }

    ```


    Also, if you wish to write programs in programming languages without easy access
    to curses or some other terminal abstraction library, you may find it convenient
    to use this documentation.


    Of course, your terminal type is linux does not guarantee that your program is
    running on a local terminal. If the terminal type is linux, you know you have
    access to the escape sequences documented in this chapter, but you do not know
    if you have access to the vcs devices (documented'
