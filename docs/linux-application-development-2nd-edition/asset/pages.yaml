  md: '# Creating and Using Libraries


    Executable binaries can get functions from libraries in one of two ways: The functions
    can be copied from a static library directly into the executable binary image,
    or they can be indirectly referenced in a shared library file that is read when
    the executable is run. This chapter teaches you how to use and create both types
    of archives.


    # 7.1 Static Libraries


    Static libraries are simply collections of object files arranged by the ar (archiver)
    utility. ar collects object files into one archive file and adds a table that
    which object files in the archive define what symbols. The linker, ld, then binds
    references to a symbol in one object file to the definition of that symbol in
    an object file in the archive. Static libraries use the suffix .a.


    You can convert a group of object files into a static library with a command like


    ```

    ar rcs libname.a foo.o bar.o baz.o

    ```


    You can also add one object file at a time to an existing archive.


    ```

    ar rcs libname.a foo.o

    ar rcs libname.a bar.o

    ar rcs libname.a baz.o

    ```'
