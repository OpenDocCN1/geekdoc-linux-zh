- img_proc: true
  md: '# Chapter 20 The Linux Console


    years in response to programmers'' real needs. The Linux console is based on the
    most popular family of serial terminals, the descendants of the DEC VT100.


    Most escape sequences use the ANSI escape character, which has no convenient printed
    representation. We follow the termcap and terminfo libraries in using ^ to denote
    the ANSI escape character; be aware when reading them that sometimes refer to
    the same character as \^E. As elsewhere in this book, as well as in termcap and
    terminfo, ^ indicates the Control-C character.


    # 20.1 Capability Databases


    The actions controlled by these sequences are often called capabilities. Some
    escape sequences are shared among many terminals, and many of those sequences
    are specified in the ANSI X3.64-1979 standard. Nearly all color-capable terminals
    use the same sequences to choose colors to display. However, many terminals have
    wildly different escape sequences. For instance, on a Wyse 30 terminal, pressing
    F1 sends the sequence ^A|, whereas pressing F1 on your Linux console sends the
    sequence ^[[A. Similarly, to move the cursor on a Wyse 30, you send it a ^K character;
    to move the cursor on the Linux console, send the ^[[A sequence. To write a program
    that can work on either terminal, you clearly need a way to abstract these differences,
    which would allow you to program with the capabilities rather than the raw character
    sequences.


    The most common programming library that provides this abstraction is called curses,
    documented in Programming with curses [Strang, 1991]. It has two important conceptual
    levels. The first level provides functions that (generally speaking) send one
    escape sequence to accomplish one action, such as move the cursor, move it down,
    scroll the screen, and on. The second level provides a concept of "windows": independent
    screen areas that can be manipulated separately, with curses quietly figuring
    out the shortest character sequences to send to effect the changes you request.


    +   1. The curses library is defined by X/Open. The implementation included in
    Linux is currently base-level conformant with X/Open XSI Curses.'
