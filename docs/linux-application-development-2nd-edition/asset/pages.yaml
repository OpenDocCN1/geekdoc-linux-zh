  md: '# 5.2 Header Files 51


    # 5.2.1 long long


    The long long type denotes a storage unit at least as large as a long. On Intel
    86 and other 32-bit platforms, long long is 32 bits wide, and long long is 64
    bits wide. On the Digital Alpha platform, long long and are are both 64 bits,
    as are pointers. The long long type is currently slated to be included in the
    next revision of the C language standard ANSI-C-compliant at some future date.


    # 5.2.2 Inline Functions


    In certain parts of the Linux header files (system-specific ones, in particular),
    inline functions are used pervasively. They are as fast as macros (no function
    call overhead is incurred) but provide all the type checking available with a
    normal function call. Code that calls inline functions must be compiled with at
    least minimal optimization on.


    # 5.2.3 Alternative Extended Keywords


    In gcc, every extended keyword (keywords not covered by the ANSI standard) has
    two versions: the keyword itself and the keyword surrounded by two underscore
    characters on each side. When the compiler is used in standard-compliant mode
    (usually, because the ansi argument was used), the normal extended keywords are
    not recognized. So, for example, the attribute keyword is written as __attribute__
    in the header files.


