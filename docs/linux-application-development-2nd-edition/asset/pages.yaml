  md: '# 7.6.2 Preloading Libraries


    Sometimes, you do not want to replace an entire shared library, only a few functions.
    Because the dynamic loader searches for functions starting with the first loaded
    library and proceeds through the stack of libraries in order, it would be convenient
    to be able to tack an alternative library on top of the stack to replace only
    the functions you need.


    An example is zlibc. This library replaces file functions in the C library with
    functions that deal with compressed files. When a file is opened, zlibc looks
    for both the requested file and a gzipped version of the file. If the requested
    file exists, zlibc mimics the C library functions exactly, but if it does not
    exist, and a gzipped version exists instead, it transparent uncompresses the gzipped
    file without the application knowing. There are limitations, which are described
    in the library’s documentation, but it can trade off speed for a considerable
    amount of space.


    There are two ways to preload a library. To affect only certain programs, you
    can set an environment variable for the cases you wish to affect:


    ```

    LD_PRELOAD=/lib/libsomething.o exec /bin/someprogram $*

    ```


    However, as with zlibc, you might want to preload a library for every program
    on the system. The easiest way to do that is to add a line to the /etc/ld.so.preload
    file specifying which library to preload. In the case of zlibc, it would look
    something like this:


    ```

    /lib/uncompress.o

    ```'
