  md: "# 16.1.4 Addresses\n\nAs every protocol has its own definition of a network\
    \ address, the sockets API must abstract addresses. It uses a struct sockaddr\
    \ as the basic form of an address; its contents are defined differently for each\
    \ protocol family. Whenever a struct sockaddr is passed to a system call, the\
    \ process also passes the size of the address that is being passed.\n\nAll struct\
    \ sockaddr types conform to the following definition:\n\n```\n#include <sys/socket.h>\n\
    \nstruct sockaddr\n    unsigned short sa_family;\n    char sa_data[MAXSOCKADDRDATA];\n\
    ```\n\nThe first two bytes (the size of a short) specifies the address family\
    \ this address belongs to. A list of the common address families that Linux applications\
    \ use is in Table 16.1, on page 325.\n\n# 16.2 Utility Functions\n\nAll of the\
    \ examples in this section use two functions, copyData() and die(). copyData()\
    \ reads data from a file descriptor and writes it to another as long as data is\
    \ left to read. die() calls perror() and exits the program. We put both of these\
    \ functions in the file sockutil.c to keep the example programs a bit cleaner.\
    \ For reference, here is the implementation of these functions.\n\n```\n1: /*\
    \ sockutil.c - simple utility functions */\n2:\n3: #include <stdio.h>\n4: #include\
    \ <unistd.h>\n5:\n6: #include \"sockutil.h\"\n7:\n8: /* issue an error message\
    \ via perror() and terminate the program */\n9: void die(char * message) |\n```"
