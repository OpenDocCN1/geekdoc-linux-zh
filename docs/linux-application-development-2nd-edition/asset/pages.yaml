  md: '# Job Control


    Job control, a feature standardized by POSIX.1 and mandated by many standards,
    allows a single terminal to run multiple jobs. Each job is a group of one or more
    processes, usually connected by pipes. Mechanisms are provided to move jobs between
    the foreground and the background and to prevent background jobs from accessing
    the terminal.


    # 14.1 Job Control Basics


    Recall from Chapter 9 that each active terminal runs a single group of processes,
    called a session. Each session is made up of process groups, and each process
    group contains one or more individual processes.


    One of the process groups in a session is the foreground process group. The rest
    are background process groups. The foreground process group may be changed to
    any process group belonging to the session, allowing the user to switch among
    foreground process groups. Processes that are members of the foreground process
    group are often called foreground processes; processes that are not called background
    processes.


    # 14.1.1 Restarting Processes


    Every process is in one of three states: running, stopped, or zombie. Running
    processes are terminated by calling the exit() system call or by being sent a
    fatal signal. Processes are moved between the running and'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# 258 Chapter 14 Job Control


    stopped states exclusively through signals generated by another process, the kernel,
    or themselves.¹


    When a process receives SIGCONT, the kernel moves it from the stopped state to
    the running state; if the process is already running, the signal does not affect
    its state. The process may catch the signal, with the kernel moving the process
    to the running state before delivering the signal.


    # 14.1.2 Stopping Processes


    Four signals move a running process to the stopped state. SIGSTOP is never generated
    by the kernel. It is provided to allow users to stop arbitrary processes. It cannot
    be caught or ignored; it always stops the target process. The other three signals
    that stop processes, SIGTSTP, SIGTIN, and SIGTTO, may be generated by the terminal
    on which the process is running or by another process. Although these signals
    behave similarly, they are generated under different circumstances.


    +   - SIGTSTP This signal is sent to every process in a terminal’s foreground
    process group when a user presses the terminal’s suspend key.¹

    - SIGTIN When a background process attempts to read from the terminal, it is sent
    SIGTIN.

    - SIGTTO This process is normally generated by a background process attempting
    to write to its terminal. The signal is generated only if the terminal’s TOSTOP
    attribute is set, as discussed on page 307.


    This signal is also generated by a background process calling one of tcflush(),
    tcflow(), tcsetattr(), tcsetpggrp(), tcdrain(), or tcsendbreak().


    The default action of each of these three signals is to stop the process. They
    may all be caught or ignored. In both cases, the process will not be stopped.


    +   1. Stopped processes cannot generate signals, however, they cannot restart
    themselves either.

    2. Normally, the suspend key is Ctrl-Z. The stty program allows users to change
    the suspend key for a terminal, and Chapter 15 details how a program can change
    it.'
