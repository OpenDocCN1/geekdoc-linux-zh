  md: '# 9.4 Process Primitives 113


    ```

    int exec(const char * path, const char * arg, ...);

    int execp(const char * file, const char * arg, ...);

    int execle(const char * path, const char * arg, ...);

    int execv(const char * path, const char ** argv);

    int execvp(const char * file, const char ** argv);

    int execve(const char * file, const char ** argv, const char ** envp);

    ```


    As mentioned, all of these programs try to replace the current program with a
    new program. If they succeed, they never return (as the program they called is
    no longer running). If they fail, they return -1 and the error code is stored
    in errno, as with any other system call. When a new program is run (or execed)
    it gets passed an array of arguments (argv) and an array of environment variables
    (envp). Each element in envp is of the form VARIABLE=value.


    The primary difference between the various exec() functions is how the command
    line arguments are passed to the child process. The exec family passes each element
    in argv (the command-line arguments) as a separate argument to the function, and
    NULL terminates the entire list. Traditionally, the first element in argv is the
    command used to invoke the new program. For example, the shell command /bin/cat
    /etc/passwd /etc/group normally results in the following exec call.


    ```

    exec("/bin/cat", "/bin/cat", "/etc/passwd", "/etc/group", NULL);

    ```


    The first argument is the full path to the program being executed and the rest
    of the arguments get passed to the program as argv. The final parameter to exec()
    must be NULL—it indicates the end of the parameter list. If you omit the NULL,
    the function is likely to result in either a segmentation fault or return EINVAL.
    The environment passed to the new program is whatever is pointed to by the environ
    global variable.


    The execv functions pass the command-line argument as a C array of strings, which
    is the same format used to pass argv to the new program.


