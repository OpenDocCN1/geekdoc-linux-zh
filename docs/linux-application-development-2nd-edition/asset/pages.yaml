  md: '# 428 Chapter 22 Terminal Handling with S-Lang


    Table 22.2 S-Lang Colors

    | Foreground or Background | Foreground |

    |---|---|

    | black | gray |

    | red | brightred |

    | green | brightgreen |

    | brown | yellow |

    | blue | brightblue |

    | magenta | brightmagenta |

    | cyan | brightcyan |

    | lightgray | white |


    This sets the palette entry to the specified entry. The colors specified by this
    entry are used for future screen writes.


    Although an application may use the color-related functions on any terminal type,
    a number of factors control whether colors are displayed. The SLtt_Use_Ansi_Colors
    global variable controls whether colors are displayed. If it is set to 0, no colors
    are used. Any other value allows colors to be displayed.


    SLtt_get_info() tries to guess whether color should be enabled on the current
    terminal. Unfortunately, many termcap and terminfo databases are incomplete in
    this regard. If the COLORTERM environment variable is set, S-Lang sets SLtt_Use_Ansi_Colors
    no matter what the terminal database indicates.


    Most applications that provide color support also provide a command-line option
    to allow users to selectively enable color support. When the option is used, the
    application explicitly sets SLtt_Use_Ansi_Colors.'
