    Turning off BRKINT makes a difference only if robin is being called from a login
    session that is coming in over another serial port, where a break can be received.
    Turning off means that the tty driver will not send a SIGINT to robin when a break
    condition occurs on robin''s standard input, since robin does not have anything
    useful to do when it receives a break.


    The IGNBRK function tells the tty driver to ignore breaks. Turning on IGNBRK is
    actually redundant. If IGNBRK is set, then BRKINT is ignored. But it does not
    hurt to set both.


    Those are input processing flags. We also modify a local processing flag: We turn
    off ISIG. This keeps the tty driver from sending SIGINTR, SIGOUT, and SIGTST (INTR,
    QIT, or SUSP) is received. We do this because: we want these characters to be
    sent to the remote system (or whatever is connected to the serial port) for processing.


    Next comes option processing, which is done with popt, discussed in Chapter 24.
    In some cases, the default modifications we made to the termios settings might
    not be sufficient, or they might be too much. In these cases, we provide some
    command-line options to modify the termios options.


