    dlerror() will return an error only once and then revert to returning NULL,


    ```

    / clear any error condition that has not been read yet */

    dlerror();

    p = dlsym(handle, symbol);

    if ((error = dlerror()) != NULL)

    /* error handling */

    ```


    Since dlym() returns a void *, you will need to use casts to make the Compiler
    stop complaining. When you store the pointer that dlsym() returns, store it in
    a variable of the type that you want to use, and make your cast when you call
    dlsym(). Do not store the result in a void * variable; you would have to cast
    every time you use it.


    The dlclose() closes a library.


    ```

    void dlclose(void *handle);

    ```


    dlclose() checks the reference count that was incremented on each duplicate dlopen()
    call, and if it is zero, it closes the library. This reference count allows libraries
    to use dlopen() and dlclose() on arbitrary objects without worrying that the code
    that called it has already opened any of those objects.


    # 25.1.1 Example


    In Chapter 7, we presented an example of using a normal shared library. The shared
    library that we built, libhello.so, can also be loaded at run time. The loadhello
    program loads libhello.so dynamically and calls the print_hello function it loads
    from the library.'
