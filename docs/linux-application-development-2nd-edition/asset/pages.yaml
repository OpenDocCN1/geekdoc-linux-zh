    VCs provide users with many options, but the majority of users ignore the options
    and simply use the X Window System. Those users who do VCs can


    +   - Choose a separate font for each VC

    - Choose a separate terminal size for each VC

    - Choose key mappings (more on these later) for all VCs

    - Choose a different keystroke encoding for all VCs

    - Switch VCs on command with user-specifiable keystrokes


    The Linux Documentation Project (LDP) has documents explaining how the user can
    use programs that already exist in order to take advantage of these capabilities.
    Your goal is different—you wish to program VCs, not just use them. Although font
    setting and keyboard settings are well encapsulated in utilities that you can
    simply call from within your programs, there are cases in which these external
    programs are insufficient.


