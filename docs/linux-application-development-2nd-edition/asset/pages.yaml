    # 10.4.3 Using Symbolic Links


    Symbolic links are a more flexible type of link than hard links, but they do not
    share the peer relationship that hard links enjoy. Whereas hard links share an
    inode, symbolic links point to other file names. If the destination file name
    is removed, the symbolic link points to a file that does not exist, resulting
    in a dangling link. Using symbolic links between subdirectories is common, and
    symbolic links may also cross physical file system boundaries, which hard links
    cannot.


    Almost all system calls that access files by their pathname automatically follow
    symbolic links to find the proper inode. The following calls do not follow symbolic
    links under Linux:


    +   - chown())

    - istat()

    - readlink()

    - rename()

    - unlink()


    Creating symbolic links is just like creating hard links, but the symlink() system
    call is used instead.


    ```

    #include <unistd.h>


    int symlink(const char * origpath, const char * newpath);

    ```'
