    # 12.2.3 Unmapping Regions


    After a process is finished with a memory mapping, it can unmap the memory region
    through munmap(). This causes future accesses to that address to cause a SIGSEGV
    (unless the memory is subsequently remapped) and saves some system resources.
    All memory regions are unmapped when a process terminates or begins a new program
    through exec() system call.


    ```

    #include <sys/mman.h>

    ```


    ```

    int munmap(addr_t addr, int length);

    ```


    The addr is the address of the beginning of the memory region to unmap, and length
    specifies how much of the memory region should be unmapped. Normally, each mapped
    region is unmapped by a single munmap() call. Linux can fragment maps if only
    a portion of a region is unmapped, but this is not a portable technique.


    # 12.2.4 Syncing Memory Regions to Disk


