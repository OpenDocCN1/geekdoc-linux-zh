  md: '# 13.1 Signal Concepts 239


    The concept of a signal being temporarily blocked has been extended to allow a
    process to explicitly block signals. This makes it easy to protect important pieces
    of code, while still handling all signals that are sent. Such protection lets
    the signal handlers manipulate data structures that are maintained by other pieces
    of the code by providing simple synchronization.


    Although BSD provided the basic signal model POSIX adopted, the POSIX standard
    committee made it simpler for system calls to modify the disposition of groups
    of signals by introducing new system calls that operate on sets of signals. A
    set of signals is represented by the data type `sigset_t`, and a set of macros
    are provided to manipulate it.


    # 13.1.3 Signals and System Calls


    A process will often receive a signal while the process is waiting for an external
    event to occur. For instance, a networking daemon may be stuck in `accept()` waiting
    for another process to connect to a socket. When the system administrator sends
    the process a SIGTERM signal (the normal signal sent by the `kill` command, allowing
    a process to terminate cleanly), the process could handle it in a few ways.


    +   1. It could make no attempt to catch the signal and be terminated by the kernel
    (the default handler of SIGTERM).


    +   2. It could catch the signal and have the signal handler clean up the process
    was doing and then exit. Although this is appealing, in complex programs it is
    difficult to write a signal handler that knows enough about what the program was
    doing when it was interrupted to clean it up properly.


    +   3. It could catch the signal, set a flag indicating that the signal occurred,
    and somehow cause the blocked system call (in this case, `accept()`) to exit with
    an error indicating something unusual happened. The normal execution pathway could
    then check for the flag and handle it appropriately.


    +   3. This is similar to the `fdset_t` type used by the `select()` system call.'
