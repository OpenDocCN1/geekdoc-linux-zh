  md: "# 17.2 Using Timers 369\n\nThe combination of ITIM_VIRTUAL and ITIM_PROF is\
    \ often used for profiling code.\n\nEach of these timers will generate its associated\
    \ signal within one system clock (10 milliseconds on most Linux systems, 1 millisecond\
    \ on Linux/Alpha) of the timer expiring. If the process is currently running when\
    \ the signal is generated, it will be delivered immediately; otherwise, it will\
    \ be delivered soon after, depending on system load. Since ITIM_VIRTUAL is tracked\
