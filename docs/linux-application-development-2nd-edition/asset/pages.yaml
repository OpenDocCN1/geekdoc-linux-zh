  md: '# Chapter 15 Terminals and Pseudo Terminals


    At this point, robin is ready to read and write characters. robin has two file
    descriptors to read from: data coming from the serial port and data coming from
    the keyboard. We use select() to multiplex I/O between the four file descriptors,
    as described in Chapter 12.


    The select() loop makes the simplifying assumption that it can always write as
    much as it was able to read. This is almost always true and does not cause problems
    in practice, because blocking for short periods will not be noticeable in normal
    circumstances. The loop never reads from a file descriptor unless select() has
    already said that file descriptor has data waiting to be read, so we know that
    we will not block while reading.


    For data coming from the keyboard, we may need to process escape sequences before
    writing, if the user did not select raw mode when running. Rather than include
    that code in the middle of this loop, we call cook_buf() (line 87), which calls
    send_escape() (line 67) when necessary. Both of these functions are simple. The
    only tricks are that cook_buf() may be called once with the escape character,
    then a second time with the character to interpret, and that it is optimized to
    call the write() function as little as reasonably possible.


    cook_buf() calls the send_escape() function once for every character that is preceded
    by an unescaped control\ character. A q character restores the original termios
    settings and quits by calling the signal handler (with a bogus signal number of
    0), which restores the termios settings appropriately before exiting. A b character
    generates a break condition, which is a long string of continuous 0 bits. Any
    other character, including control\ character, is passed through the serial port
    verbatim.


    If input file descriptor returns an end-of-file condition, robin exits the select()
    loop and falls through to the exit processing, which is the same as the signal
    handler. It restores the old termios settings on both input file descriptors and
    exits. In raw mode, the only ways to get robin to quit one of the file descriptors
    or send it a signal.'
