    # A.2 Direct I/O Port Access


    It is possible to execute I/O instructions from user-mode programs. However, by
    default, doing so will cause a segmentation fault. You must first enable I/O port
    access; then you can execute I/O instructions. What you would like to do is something
    more like this:


    ```

    #define control(port) (port + 2)

    #define LP_PSTROBE 0x01


    noutb(LP_PSTROBE, control(0x378));

    sleep(1);

    outb(0, control(0x378));

    ```


    But you need to get permission to call outb(). There are two ways to get that
    permission: ioperm() and iopl().


    # A.2.1 The Safe Way


    A program running with superuser privileges can separately enable and disable
    access to each I/O port in the range 0–0x3ff. For example, to allow access to
    the three ports starting with 0x378 (the ports used to /dev/lpt1), use


    ```

    ioperm(0x378, 3, 1);

    ```


    If you need to access only port 0x37a, you can instead use


    ```

    ioperm(0x37a, 1, 1);

    ```


    +   4. Yes, this description is rather Intel-specific. However, other Linux platforms,
    even with CPUs that do not have I/O instructions, provide the same functions.'
