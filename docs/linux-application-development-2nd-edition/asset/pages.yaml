  md: 'later in this chapter) or ioctl(). POSIX specifies a tty() function you can
    use to find the name of the device file for the controlling terminal. On a Linux
    system, the virtual consoles are named /dev/tty for n between 1 and 63 (/dev/tty0
    is always the current console).


    Complete documentation for the termcap and terminfo systems is available in termcap
    & terminfo [Strang, 1991B]. Eric Raymond currently maintains the termcap and terminfo
    databases, which he makes available via the Web at http://www.ccil.org/~terminfo/
    The source code to ncurses (new curses, the implementation of curses used on Linux)
    includes an introduction to curses programming in the misc/ncurses-info.html file.


    Instead of curses, we document S-Lang, an easier-to-use terminal abstraction library,
    in Chapter 22. It uses the same termcap and terminfo databases as curses. We cover
    S-Lang instead of ncurses because S-Lang is smaller and easier to use for many
    tasks, and ncurses are adequately covered elsewhere.


    # 20.2 Glyphs, Characters, and Maps


    When you write a character to any terminal, several steps of translation may happen.
    The value written to the terminal is the character number, or character code.
    That character code is not enough to determine what to display on the screen,
    however. The shape depends on what font is being used. The character code 97 may
    be printed as an a in a font designed for rendering Latin-based languages, but
    might be rendered as an α in a font designed for rendering Greek or mathematics.
    The shape that is displayed is called a glyph. The translation from character
    codes to glyphs is called a map.'
