    # 10.4.5 Renaming Files


    A file name may be changed to any other file name as long as both names are on
    the same physical partition (this is the same limit that applies to creating hard
    links). If the new file name already references a file, that name will be unlinked
    before the move takes place. The rename() system call is guaranteed to be atomic.
    Other processes on the system will always see the file in existence under one
    name or the other; there is no point at which the file does not exist under either
    name, nor both names. As files are not related to file names (only to inodes),
    renaming a file that other processes have open does not affect those other processes
    in any way. Here is what the system call looks like.


    ```

    #include <unistd.h>


    int rename(const char * oldpath, const char * newpath);

    ```


    After the call, the file referenced by oldpath may be refenced by newpath, but
