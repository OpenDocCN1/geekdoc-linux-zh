    # 10.5.1 Changing the Access Mode for an Open File


    Both append mode (as indicated by the O_APPEND flag when the file is opened) and
    nonblocking mode (the O_NONBLOCK attribute) may be turned on and off after a file
    has already been opened through the the fcntl()''s F_SETFL command. The arg parameter
    should be the flags that should be set—if one of the flags is not specified, it
    is turned off for fd.


    F_GETFL may be used to query the current flags for the file. It returns all the
    flags, including the read status of the file. F_SETFL ignores extra flags that
    have been set in arg. This means that the code fragment


    ```

    fcntl(fd, F_SETFL, fcntl(fd, F_GETFL, 0) | O_RDONLY);

    ```


    is perfectly legal, but it does not accomplish anything. Turning append mode for
    a file descriptor looks like this:


    ```

    fcntl(fd, F_SETFL, fcntl(fd, F_GETFL, 0) | O_APPEND);

    ```


    Note that care was taken to preserve the O_NONBLOCK setting. Turning append mode
    off looks similar:


    ```

    fcntl(fd, F_SETFL, fcntl(fd, F_GETFL, 0) & ~O_APPEND);

    ```


    # 10.5.2 Modifying the close-on-exec Flag


    During an exec() system call, file descriptors are normally left open for the
