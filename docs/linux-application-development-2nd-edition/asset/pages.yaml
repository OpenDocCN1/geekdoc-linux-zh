    eter. It should be set to the signal that should be sent to the parent process

    when the child exits (usually, SIGCHLD), logically OR''ed with any number of

    the following flags, which are defined in (sched.h):


    CLONE_VM

    The two processes share their virtual memory space

    (including the stack).


    CLONE_FS

    File-system information (such as the current directory)

