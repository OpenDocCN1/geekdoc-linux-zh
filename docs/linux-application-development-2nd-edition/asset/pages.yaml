  md: '# 24.1 Basic Usage Usage 447


    # Table 24.1 popt Argument Types


    | Value | Description | arg Type |

    | :--- | :--- | :--- |

    | POPT_ARG_NONE | No argument is expected | int |

    | POPT_ARG_STRING | No type checking should be performed | char * |

    | POPT_ARG_INT | An integer argument is expected | int |

    | POPT_ARG_LONG | A long integer is expected | long |


    The argInfo member tells popt what type of argument is expected after the argument.
    If no option is expected, POPT_ARG_NONE should be used. The rest of the valid
    values are summarized in Table 24.1.


    The next element, arg, allows popt to automatically update program variables when
    the option is used. If arg is NULL, it is ignored and popt takes no special action.
    Otherwise, it should point to a variable of the type indicated in the right-most
    column of Table 24.1.


    If the option takes no argument (argInfo is POPT_ARG_NONE), the variable pointed
    to by arg is set to 1 when the option is used. If the option takes an argument,
    the variable that arg points to is updated to reflect the value of the argument.
    Any string is acceptable for POPT_ARG_STRING arguments, but POPT_ARG_INT and POPT_ARG_LONG
    arguments are converted to the appropriate type, and an error is returned if the
    conversion fails.


    The final option, val, is the value popt''s parsing function should return when
    the option is encountered. If it is 0, the parsing function parses the next command-line
    argument rather than return.


    The final structure in the table should have all the pointer values set to NULL
    and all the arithmetic values set to 0, marking the end of the table.


    +   1. getopt() connoisseurs will note that argInfo is the only field of struct
    poptoption that is not directly analogous to a field in the getopt_long() argument
    table. The similarity between the two allows for easy transitions from getopt()
    to popt.'
