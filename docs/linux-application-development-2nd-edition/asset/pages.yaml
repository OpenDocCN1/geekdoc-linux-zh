    # 9.2.2 Credentials


    Linux uses the traditional Unix security mechanisms of users and groups. User
    IDs (uids) and group IDs (gids) are integers that are mapped to symbolic user
    names and group names through /etc/passwd and /etc/group, respectively (see Chapter
    26 for more information on the user and group databases). However, the kernel
    knows nothing about the names—it is concerned only with the integer representation.
    The 0 uid is reserved for the system administrator, normally called `root`. All
    normal security checks are disabled for processes running as root (that is with
    a uid of 0), giving the administrator complete control over the system.


    In most cases, a process may be considered to have a single uid and gid associated
    with it. These are the IDs that are used for most system security purposes (such
    as assigning ownerships to newly created files). The system calls that modify
    a process ownership are discussed later in this chapter.


    As Unix developed, restricting processes to a single group turned out to create
    new difficulties. Users involved in multiple projects had to switch their gid
    when they wanted to access files whose access was restricted to members of different
    groups.


    Supplemental groups were introduced in BSD 4.3 to eliminate this problem. Although
    every process still has its primary gid (which uses as the gid for newly created
    files, for example), it also belongs to a set of supplemental groups. Security
    checks that used to ensure that a process belonged to a particular group (and
    only that group) now allow access as long as the group is one of the supplemental
    groups the process belongs to. The constant NGROUP, available from `<sys/param.h>`,
    specifies how many supplemental groups a process may belong to. Under Linux 2.0,
    NGROUP is 32.


    +   ids are normally positive integers, but negative ones will work. Using -1
    as an ID is problematic, however, as many of the uid- and gid-related system calls
    use -1 as an indication to not modify a value (see setregid()) on page 101 for
    an example of this).'
