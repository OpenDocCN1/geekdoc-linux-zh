  md: '# Chapter 26 Names and the User Databases


    Using getgroups() is preferable because it lists the groups that the current process
    belongs to rather than the groups that the user would belong to if he logged in
    at that moment. That is, if the user has already logged in and been assigned a
    set of supplementary groups and then the group database is changed, getgroups()
    will get the set of groups that apply to login process; examining the group database
    will get the set of groups that will be applied to the user''s next login session.


    As documented in Chapter 9, the getgroups() function has an unusual (but convenient)
    usage: call it once with 0 size and an ignored pointer (which can, as here, be
    NULL) and returns the number of data items it wants to return. So then id allocates
    the exact right size list and calls getgroups() again, this time with the correct
    size and a list capable of holding the information it wants.


    Next, id iterates over the list, getting the entries it wants from the group database.
    Note that this is different from using the group database to get the list of groups
    to which a user belongs. In this case, id is using the group database only to
    map group numbers to group names. A more efficient interface would use getgrent()
    to iterate over the group database and look up entries in the list, rather than
    the other way around; that is left as an exercise. Remember to use endgetrent()
    when you are done. Not doing so will leave a file handle open, and may later code
    to fail if that code assumes (reasonably enough) that getgrent() starts with the
    first entry.


    Note that there is no guarantee that the entries in the list returned by getgroups()
    will be sorted in the same order that they appear in the group database, although
    it is often the case that they are.


    If the user provided a username as a command-line argument, id needs to iterate
    over the group file, looking for groups in which the provided user-name is specified.
    Remember to call endgetrent() to clean up after yourself!'
