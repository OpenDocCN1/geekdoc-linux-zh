  md: '# Direct Access to I/O Ports


    Low-level programmers often need to talk directly to the hardware. Linux provides
    application programmers with minimal but useful access to hard-ware.


    As a general rule, application-level (or even system-level) programs ought not
    to directly manipulate hardware on a Linux system. The relatively consistent abstract
    interface that the kernel provides to application and system programmers should
    not be abandoned lightly. Before you abandon it, you want to consider what it
    would take to write your code in a way that maintains the abstraction, generally
    by creating a device driver, a part of the kernel. Several resources are available
    that cover Linux kernel programming, including Linux Kernel Internals [Beck, 1996]
    and the Linux Kernel Hacker’ Guide.


    That disclaimer made, it is not very difficult to access I/O ports from a user-level
