  md: '# # Networking with Sockets


    As the computer world becomes more networked, network-aware applications are increasingly
    important. Linux provides the Berkeley socket API, which has become the standard
    networking API. We discuss the basics of using Berkeley sockets for both TCP/IP
    networking and simple inter-process communication (IPC) through Unix-domain sockets.


    This chapter is not intended to be a complete guide to network programming. Network
    programming is a complicated topic, and we recommend dedicated network programming
    books for programmers who intend to do serious work with sockets [Stevens, 1990].
    This chapter should be sufficient to allow you to write simple networked applications,
    however.


    # ## 16.1 Protocol Support


    The Berkeley socket API was designed as a gateway to multiple protocols. Although
    this does necessitate extra complexity in the interface, it is much easier than
    inventing (or learning) a new interface for every new protocol you encounter.
    Linux already supports many protocols (including TCP/IP, AppleTalk, and IPX) through
    the socket API, proving the value of this abstraction.


    We discuss using sockets for two of the protocols available through Linux’s implementation.
    The most important protocol that Linux supports is'
