    # 6.2.2 Memory Alignment


    While Electric Fence did a fine job of finding the second problem in the code—namely,
    the `strcpy()` that overwrote its buffer by a large amount—it did not help us
    at all in finding the first buffer overflow.


    The problem here has to do with memory alignment. Most modern CPUs require multibyte
    objects to start at particular offsets in the system''s RAM. For example, Alpha
    processors require that an 8-byte long begin at an address that is evenly divisible
    by eight. This means that a long may appear at address 0x1000 or 0x1008, but not
    at 0x1005.


    Because of this consideration, `malloc()` implementations normally return memory
    whose first byte is aligned on the processor''s word size (4 bytes on 32-bit processors
    and 8 bytes on 64-bit processors) to ensure the caller can store whatever data
    it likes into the memory. By default, Electric Fence attempts to mimic this behavior
    by providing a `malloc()` that returns only addresses that are an even multiple
    of `sizeof(int)`.


    In most programs, such alignment is not all that important, because memory allocations
    are done in increments that are already based on the machine''s word size, or
    of simple character strings, which do not have any alignment requirements (as
    each element is only one byte long).


    In the case of our test program, the first `malloc()` called five bytes. For Electric
    Fence to meet its alignment restrictions, it must treat the allocation as a request
    for eight bytes and up the memory with an extra three bytes of accessible space
    after the `malloc()`ed region! Small buffer overflows in this region are not caught
    because of this.


    As `malloc()` alignment concerns can normally be ignored and the alignment can
    allow buffer overflows to remain undetected, Electric Fence lets you control how
    alignment works through the LF alignment environment


    +   3. Most traditional Unix systems deliver a bus error (SIGBUS) to a process
    that attempts to use misaligned data. The Linux kernel actually handles unaligned
    accesses so that the process can continue, but at a large performance penalty.'
