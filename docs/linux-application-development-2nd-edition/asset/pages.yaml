  md: '# 15.5.8 Local Flags


    The local mode flags affect local processing, which (roughly) refers to characters
    collected before they are output. When the device is in canonical (cooked) mode,
    characters are echoed locally without being sent to the remote system until a
    newline character is encountered. At that point, the whole line is sent, and the
    remote end processes it without echoing again. In raw mode, each character is
    sent to the remote system as it is received. Sometimes the character is echoed
    only by the local system; sometimes, and sometimes, such as when reading a password,
    it is not echoed at all.


    Some flags may act differently, depending on whether the terminal is in canonical
    mode or raw mode. Those that act differently in canonical and raw mode are marked.


    The flags that operate on c_lflag are as follows:


    ICANON


    If ICANON is set, canonical mode is enabled. If ICANON is not set, raw mode is
    enabled.


    ECHO


    If ECHO is set, local echo is enabled. If ECHO is not set, all the other flags
    whose names start with ECHO will be effectively disabled and function as if they
    are not set, except for ECHONL.


    ECHOCTL


    If ECHOCTL is set, control characters are printed as ^C, where C is the character
    formed by adding octal 0100 to the control character, mod octal 0200. So Control-C
    is displayed as ^C, and Control-? (octal 0177) is represented as ^? (? octal 77).
    This flag is not specified for POSIX.


    ECHO


    In canonical mode, if ECHO is set, then the ERASE character is received, the previous
    character on the display is erased if possible.


    ECHOK and ECHOKE


    In canonical mode, when the KILL character is received, the entire current line
    is erased from the buffer.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Chapter 15 Terminals and Pseudo Terminals


    If neither ECHOK, EPOCHE, nor ECHOE is set, the EOCHTL representation of the KILL
    character (^U by default) will be printed to indicate that the line has been erased.


    If ECHO and ECHOK are set but ECHOE is not set, the EOCHTL representation of the
    KILL character will be printed, followed by a newline, which will be processed
    appropriately by OPOST handling if OPOST is set.


    If ECHO, ECHOK, and ECHOKE are all set, the line will be erased.


    See the description of ECHOPRT for another variation on this theme.


    The ECHO flag is not specified by POSIX. On systems without the ECHOKE flag, setting
    the ECHOK flag may be equivalent to setting both the ECHON and ECHOKE flags under
    Linux.


    +   ECHONL


    In canonical mode, if ECHON is set, newline (''\n'') characters are echoed even
    if ECHO is not set.


    +   ECHOPRT


    In canonical mode, if ECHOPRT is set, characters will be printed as they are erased
    with the ERASE (or KILL, if ECHOK and ECHOKE are set) characters are received.
    When the first erase character in a sequence is received, a \ will be printed,
    and when the final erased character is printed (the end of the line is reached
    or a nonerasing character is typed), a / will be printed. Every normal character
    you type will be merely echoed. So typing asdf, followed by two ERASE characters,
    followed by df, followed by a KILL character, would look like asdf/fd/fdsa/


    This is useful for debugging and for using hardcopy terminals, as the original
    teletype, where characters are printed on paper, and are otherwise useless. This
    flag is not specified by POSIX.


    +   ISIG


    If ISIG is set, the INTR, QUIT, and SUSP control characters cause the corresponding
    signal (SIGINT, SIGQUIT, or SIGTSTP, respectively; see Chapter 13) to be sent
    to all the processes in the current foreground group on that tty.'
