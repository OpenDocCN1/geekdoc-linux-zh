    to simple, one-line commands, but those commands often execute programs outside
    vi to manipulate data within. Emacs Lisp is documented in a huge manual that includes
    a tutorial; documentation for vi''s language is relatively sparse.


    Some editors allow you to mix and match functionality. You can use Emacs in a
    vi mode (called viper) that allows you to use the standard vi commands, and one
