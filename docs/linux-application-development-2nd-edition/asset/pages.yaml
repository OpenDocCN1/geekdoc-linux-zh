    # 19.2 Beeping


    Last things first: Using the console to beep for a certain amount of time at a
    certain frequency is fairly simple. There are two ways to make the console beep.
    The first is to turn on or off a constant tone. KIOCSOUND turns off the sound
    if its argument is 0; if its argument is non-0, it specifies the frequency in
    a rather bizarre way, as this code.


    ```

    void turn_tone_on(int fd, int hertz) |

    ioctl(fd, KIOCSOUND, 1193180/hertz)

    ```


    ```

    void turn_tone_off(int fd) |

    ioctl(fd, KIOCSOUND, 0)

    ```


    The second way to cause the console to beep is to use the KDMTONE ioctl to turn
    on a tone for a period specified in jiffies, which are ticks of the system clock.
    Unfortunately, the time per tick varies from architecture to architecture; the
    Hz macro defined by sys/param.h gives ticks per second. The tone() function below
    shows how to derive the number of ticks from hundreds of a second and the value
    of HZ.


    ```

    #include <sys/param.h>

    void tone(int fd, int hertz, int hundredths) |

    unsigned int ticks = hundredths * HZ / 100;

    ```


    ```

    /* ticks & 0xffff will not work if ticks == 0xff0000

    * need to round off to highest legal value instead */

    if (ticks > 0xffff) ticks -= 0xffff;

    /* now the other rounding error */

    if (hundredths && ticks == 0) ticks = 1;

    ioctl(fd, KDMTONE, (1193180/hertz)<<16 | ticks)

    ```'
