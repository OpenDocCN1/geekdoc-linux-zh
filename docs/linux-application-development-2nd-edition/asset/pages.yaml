    CLONE_FILES Open files are shared.


    CLONE_SIGHAND The signal handlers are shared for the two processes.


    When two resources are shared, both processes see those resources identically.
    If the CLONE_SIGHAND is specified, when one of the processes changes the signal
    handler for a particular signal, both processes use the new handler (see Chapter
    13 for details on signal handlers). When CLONE_FILES is used, not only is the
    set of open files shared, but the current location in each file is also shared.
    The return values for clone() are the same as for fork().


    If a signal other than SIGCHLD is specified to be delivered to the parent on the
    death of a child process, the wait() family of functions will not, by default,
    return information on those processes. If you would like to get information on
    such processes, as well as processes that use the normal SIGCHLD mechanism, the
    __WCLONED must be ORed with the flags parameter of the wait call. Although this
    behavior may seem odd, it allows greater flexibility. If wait() returned information
    on cloned processes, it would be more difficult to build standard thread libraries
    around clone(), because wait() would return information on other threads, as well
    as child processes.


    Although it is not recommended that applications use clone() directly, numerous
    user-space libraries are available that use clone() and provide a fully POSIX-compatible
    thread implementation. Newer versions of the Linux C library (glibc 2) include
    such a library, providing standardized threading across all Linux platforms. Several
    good books on POSIX thread programming are available [Nichols, 1996][Butenhof,
