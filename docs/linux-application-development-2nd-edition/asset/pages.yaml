  md: "# # The Database Library\n\nApplications commonly wish to store some form of\
    \ binary data in a file. Storing such data for efficient retrieval is tricky and\
    \ error prone. The Berkely db library provides a uniform interface to hashed files,\
    \ btree indexing, and simple record-number-oriented files.\n\nThere are two versions\
    \ of the db library, version 1 and version 2. Version 1 is licensed under the\
    \ BSD license mentioned on page 16; version 2 is under a more restrictive license\
    \ that more closely resembles the GPL license discussed on page 15. The two versions\
    \ have completely incompatible APIs, and we discuss version 1 here because of\
    \ its looser licensing restrictions. Version 1 of the db library is available\
    \ at http://ftp.ftp.cs.berkeley.edu/ucb/bsd/db.tar.gz, and is standard with most\
    \ major Linux distributions.\n\n# ## 23.1 Overview\n\nThe db library provides\
    \ access to indexed files through a pseudo-object-oriented approach. A single\
    \ function, dbopen(), opens all three types of files. It returns a pointer to\
    \ a DB structure that includes pointers to functions for the rest of the database\
    \ operations. The DB structure looks like this:\n\n```\n#include <db.h>\n\ntype\
    \ struct __db {\n    DBTYPE type;\n    int (*close)(struct __db *);\n    int (*del)(const\
    \ struct __db *, const DBT *, u_int);\n    int (*get)(const struct __db *, const\
    \ DBT *, u_int);\n```"
