    a link to /lib/libc.so.5.3.12. The application is linked against libc.so.5.3.12''s
    soname, libc.so.5, so when the application is run, it finds /lib/libc.so.5 and
    links to libc.so.5.3.12, because libc.so.5 is a symlink to libc.so.5.3.12.


    # 7.3.2 Incompatible Libraries


    When a new version of a library needs to be incompatible with an old version,
    it should be given a different soname. For instance, to release a new version
    of the C library that is incompatible with the old one, developers use the soname
    libc.so.6 instead of libc.so.5, which shows that it is incompatible and also allows
    applications linked against either version to coexist on the same system. Applications
    linked against some version of libc.so.5 will continue to use the latest library
    version that provides the libc.so.5 soname, and applications linked against some
    version of libc.so.6 will use the latest library version that provides the libc.so.6
    soname.


    # 7.3.3 Designing Compatible Libraries


    When you are designing your own libraries, you need to know what makes a library
    incompatible. There are three main things that cause incompatibilities.


    +   1. Changing or removing exported function interfaces.


    +   2. Changing exported data items, except adding optional items to the ends
    of structures that are allocated within the library.


    +   3. Changing the behavior of functions to something outside the original specification.'
