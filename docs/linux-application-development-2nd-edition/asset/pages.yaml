  md: '# 62 Chapter 6 Memory Debugging Tools


    # 6.4 mpr and mcheck()


    A simple way to find all a program''s memory leaks is to log all its calls to
    malloc() and free(). When the program has completed, it is straightforward to
    match each malloc()ed block with the point at which it was free()ed or report
    a leak if it was never freed. mpr takes this approach to finding memory leaks.
    To help find memory corruption as well, mpr includes a replacement malloc() library
    from the GNU project that includes support for memory allocation debugging, which
    is enabled by calling the mcheck() function. When an application is linked against
    libmpr.a with the lmpr command-line option, mcheck() memory checking is automatically
    enabled as well.


    # 6.4.1 Finding Memory Corruption with mcheck


    Finding memory problems with mpr''s malloc() library is as straightforward as
    it is with Electric Fence. Instead of trapping memory corruption in hardware,
    malloc() places byte sequences before and after the returned memory. free() looks
    for those signatures and calls abort() if they have been disturbed. Running a
    program linked against mpr through gdb shows you exactly which memory regions
    have been corrupted, as long as those regions are properly free()ed. However,
    the mcheck() method does not pinpoint exactly where the corruption occurs; it
    is up to the programmer to figure out that. Linking our test program against mpr
    and running it yields results.


