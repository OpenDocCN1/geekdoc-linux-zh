  md: '# 7.3 Designing Shared Libraries


    executable to someone who does not have a shared library that the executable requires,
    it will not run. A secondary cost is the time it takes when the program starts
    to find and load the shared libraries; this is generally negated because the shared
    libraries have usually already been loaded into memory for other processes, and
    so they do not have to be loaded from disk again when the new process is started.


    Linux originally used a simplistic binary file format (actually, three variations
    on a simplistic binary file format) that made the process of creating shared libraries
    difficult and time-consuming. Once created, the libraries could not be easily
    extended in a backward-compatible way. The author of the library had to leave
    space for data structure expansion by hand-editing tables, and even that did not
    always work.


    Now, the standard binary file format on almost every Linux platform is the modern,
    extensible ELF (Executable and Linking Format) file format.¹ This means that practically
    all Linux platforms, the steps you take to create and use shared libraries are
    exactly the same.


    # 7.3 Designing Shared Libraries


    Building shared libraries is only marginally harder than building normal static
    libraries. There are a few constraints, all of which are easy to manage. There
    is also one major feature, designed to manage binary compatibility across library
    versions, which is unique to shared libraries.


    Shared libraries are intended to preserve backward compatibility. A binary built
    against an older version of the library still works when run against a newer version
    of the library. However, there needs to be a way to mark libraries as incompatible
    with each other for cases in which developers find it necessary to modify interfaces
    in a non-backward-compatible manner.


