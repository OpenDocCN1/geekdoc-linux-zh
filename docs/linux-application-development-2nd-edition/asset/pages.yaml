  md: '# 20.4 Direct Screen Writing 403


    useful way to use vcs is from within X. XFree86, by default, starts the X server
    on the first free virtual console, not on the current program was started from.
    If you start XFree86 from virtual console 1, you do not need to change back to
    virtual console 1 to see the detection messages that XFree86 left on the screen;
    bring up a terminal window the same size as the console (normally 80 columns by
    25 lines), make superuser (in order to gain access to the vcs device), and run
    cat /dev/vcs/. The contents of the first virtual console will fill your terminal
    window.


    In order to write reliable programs, however, you need some basic knowledge-edge
    about the state of the screen that a vcs device does not provide:


    +   - Colors


    +   - Other attributes (such as blinking)


    +   - Current cursor position


    +   - Screen configuration (number of rows and columns)


    The vcsa device (which presumably stands for virtual console screen with attributes)
    provides all this. The first four bytes of /dev/vcsan (for the same n as vcs devices)
    contain a header that gives the current cursor position and screen configuration.
    The first byte contains the number of rows, the second the number of columns,
    the third cursor’s current column, and the fourth the cursor’s current row. The
    rest of the file contains alternating bytes that represent the text and attribute
    bytes of the console in question.


    So, if you need to know only the size of the console and its textual contents,
    you can read the first two bytes of the appropriate vcsa device from and then
    on use only the vcs device. If you want to set the current cursor position, write
    to the second and third bytes of the vcsa device (the first two bytes are read-only,
    so the first two characters are placeholders; we prefer to use spaces or some
    other similar character to make this more obvious). As an example, to move the
    cursor on the fourth virtual console to the seventh row and the nineteenth column:


    ```

    echo ''\023\007'' > /dev/vcsa

    ```'
