    In many operating systems, there is a one-to-one correspondence between files
    and file names. Every file has a file name in a file system, and every file name
    maps to a single file. Unix divorces the two concepts, allowing for more flexibility.


    The only unique identity a file has is its inode (an abbreviation of information
    node). A file''s inode contains all the information about a file, including the
    access permissions associated with it, its current size, and how many file names
    it has (which could be zero, one, twenty, or more). There are two types of inodes.
    The in-core inode is the only type we normally care about; every open file on
    the system has one. The kernel keeps in-core inodes in memory, and they are the
    same for all file-system types. The other type of inodes is on-disk inodes. Every
    file on a file system has an on-disk inode, and their exact structure depends
    on the type of file system the file is stored on. When a process opens a file
    on a file system, the on-disk inode is loaded into memory and converted into an
    in-core inode. When the in-core inode has been modified, it is transformed back
    into an on-disk inode and stored in the file system.


    On-disk and in-core inodes do not contain exactly the same information. Only the
    in-core inode, for example, keeps track of how many processes on the system are
    currently using the file associated with the inode.


    As-disk and in-core inodes are synchronized by the kernel, most system calls end
    up updating both inodes. When this is the case, we just refer to updating the
    inode; it is implied that both the in-core and on-disk inodes are affected. Some
    files (such as unnamed pipes) do not have any on-disk inode. In these cases, only
    the in-core inode is updated.


