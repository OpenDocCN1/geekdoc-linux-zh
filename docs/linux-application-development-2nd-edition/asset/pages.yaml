    If ONLRET is set, when a newline character (''\n'') or carriage return character
    (''\r'') is sent, the current column is set to 0. This flag is not specified by
    POSIX.


    OXTABS


    If OXTABS is set, tabs are expanded to spaces. Tab stops are assumed to be every
    eight characters, and the number of space characters that are sent is determined
    by the current column. This flag is not specified by POSIX.


