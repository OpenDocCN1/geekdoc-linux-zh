    # 12.1.2 Multiplexing with select()


    To allow efficient multiplexing, Unix provides the select() system call, which
    allows a process to block on multiple file descriptors simultaneously. Rather
    than constantly check each descriptor it is interested in, a process makes a single
    system call that specifies which file descriptors the process would like to read
    from or write to. When one or more of files have data available for reading or
    can accept data written to them, the select() returns and the application can
    read and write from those file descriptors without worrying about blocking. Once
    those files have been handled, the process makes another select() call, which
    blocks until a file is ready for more attention. Here is what the select() system
    call looks like:'
