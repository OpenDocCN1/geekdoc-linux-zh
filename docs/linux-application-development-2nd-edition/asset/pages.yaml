  md: '# Chapter 9 The Process Model


    pid should belong to, or 0 if the process should be in a new process group whose
    pgid is the same as that process''s pid. Like sessions, a process group leader
    is the process whose pid is the same as its process group ID (or pgid).


    The rules for how setpgid() may be used are a bit complicated.


    +   1. A process may set the process group of itself or one of its children. It
    may not change the process group for any other process on the system, even if
    the process calling setpgid() has root privileges.


    +   2. A session leader may not change its process group.


    +   3. A process may not be moved into a process group whose leader is in a different
    session from itself. In other words, all the processes in a process group must
    belong to the same session.


    setsid() calls the calling process into its own process group and contains its
    own session. This is necessary to ensure that two sessions do not contain processes
    in the same process group.


    A full example of process groups is given when we discuss job control in Chapter
    14.


    When the connection to a terminal is lost, the kernel sends a signal (SIGHUP);
    see Chapter 13 for more information on signals) to the leader of the session containing
    the terminal''s foreground process group, which is usually a shell. This allows
    the shell to terminate the user''s processes unconditionally, notify the processes
    that the user has logged out (usually, through a SIGHUP), or take some other action
    (or inaction). Although this setup seem complicated, it lets the session group
    decide how closed terminals should be handled rather than putting that decision
    in the kernel. This allows system administrators flexible control over account
    policies.


    Determining the process group is easily done through the getpgid() and getpggrp()
    functions.


    ```

    pid_t getpgid(int pid)

    Returns the pgid of the process pid. If pid is 0, the pgid of the current process
    is returned. No special permissions are needed to use this

    ```'
