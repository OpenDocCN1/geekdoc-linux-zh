  md: '# 15.5 termios Reference 297


    # 15.5.4 Input Flags


    The input mode flags affect input processing even though they sometimes have an
    effect on output. The flags that operate on c_iflag are as follows:


    BRKINT and IGNBRK


    If IGNBRK is set, break conditions (see tcsendbreak()), mentioned earlier) are
    ignored.


    If IGNBRK is not set and BRKINT is set, break conditions cause the tty to flush
    all queued input and output data and send a SIGINT to processes in the foreground
    process group for the tty.


    If IGNBRK is not set and BRKINT is not set, break conditions are read as a 0-valued
    character (''\0''), except if PARMRK is set, in which case a framing error is
    detected and the three bytes ''\377'' ''\0'' ''\0'' are delivered to the application
    instead.


    PARMRK and IGNPAR


    If IGNPAR is set, received bytes containing parity or framing errors are ignored
    (except as specified for break conditions earlier).


    If IGNPAR is not set and PARMRK is set, a received byte with a parity or framing
    error is reported to the application as the three-byte sequence ''\377'' ''\0''
    ''\n'', where n is the byte as it was received. In this case, if ISTRIP is not
    set, a valid ''\377'' character is reported to the application as the two-character
    sequence ''\377'' ''\377''; if ISTRIP is set, a ''\377'' character will have its
    high bit stripped and will be reported as ''\177''.


    If neither PARMRK is set, a received byte with parity or framing error other than
    a break condition will be reported to the application as a single ''\0'' character.


    INPCK


    If INPCK is set, parity checking is enabled. If it is not enabled, PARMRK and
    IGNPAR have no effect on parity errors.


    ISTRIP


    If ISTRIP is set, the high-order bit is stripped from all received bytes, limiting
    them to seven bits.'
  merge: -1
