    # 9.4.4 A Bit of History: vfork()


    Creating an entirely new execution environment can be quite expensive, especially
    on poor hardware that needs to make a copy of the entire addressable region. Linux,
    like most other modern Unix systems, copies pieces of the process''s address space
    only when the need arises.


    As many of the fork() calls are immediately followed by the creation of a new
    virtual memory space through some flavor of exec(), some versions of Unix provide
    a version of fork() that does not copy the virtual memory region, providing a
    performance improvement. This variant is called vfork(); it leaves the memory
    mapping shared between the two processes. Its additional semantic is not returning
    control to the parent process until the child issues an exec() call to help prevent
    the processes from conflicting with each other. As Linux provides copy-on-write,
    which eliminates the need for this trick, it does not provide a vfork() system
    call. Instead, vfork() is implemented as a simple fork() call by the C library
    to provide backward compatibility. Although this works for many applications,
    it does not provide vfork()''s additional semantic, which forces the child process
    to run first.


