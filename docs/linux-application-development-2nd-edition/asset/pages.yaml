  md: '# 13.3 Available Signals


    The sigsuspend() system call provides an alternate method of waiting for a signal
    call.


    ```

    #include <signal.h>

    ```


    ```

    int sigsuspend(const sigset_t * mask);

    ```


    Like pause(), sigsuspend() suspends the process until a signal has been received
    (and processed by a signal handler, if one is available), returning -1 and setting
    errno to EINTR.


    Unlike pause(), sigsuspend() temporarily sets the process''s signal mask to the
    value pointed by the mask parameter before waiting for a signal to occur. Once
    the signal occurs, the signal mask is restored to the value it had before sigsuspend()
    was called. This allows a process to wait for a particular signal to occur by
    blocking all other signals.⁸


    # 13.3 Available Signals


    Linux has quite a few signals available for processes to use, all of which are
    summarized in Table 13.1. There are four default actions the kernel can take for
    a signal: ignore it, stop the process (it is still alive and can be restarted
    (later), terminate the process, or terminate the process and generate a core dump.).
    The Following are more detailed descriptions of each signal listed in Table 13.1.


    +   - SIGABRT: The abort() function sends this signal to the process that called
    it, terminating the process with a core file. Under Linux, the C library calls
    abort() whenever an assertion fails.¹⁰


    +   - SIGALRM: When an alarm set by the alarm() system call has expired. Alarms
    are discussed in Chapter 17.


    +   8. Using sigprocmask() and pause() to get this behavior presents a race condition
    if the signal that is being waited for occurs between the two system calls.


    +   9. See page 117 for more information on core dumps.


    +   10. Assertions are discussed in most introductory C books [Kernighan, 1988].'
