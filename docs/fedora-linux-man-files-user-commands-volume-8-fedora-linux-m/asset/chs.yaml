  汇编与编辑：Gareth Morgan Thomas\n\n# 免责声明\n据我们所知，本手册中发布的所有文本除非另有说明，均属于公有领域。\n我们非常重视对公有领域的承诺。\n\
  如果您有理由认为 LinuxManFiles.com 发布的任何文本尚未进入有领域，请发送邮件至：editor at linuxmanfiles.com。\n\n\
  \n![](img/svgimg0003.svg)\nwww.LinuxManFiles.com\n\n\n# PERLSYMBIAN\n\n## 名称\nperlsyian\
  \ - Syian OS 上的 Perl 版本 5\n\n## 描述\n本文描述了 Syian 操作系统的各种特性，这些特性将影响 Perl 版本 5（以下简称\
  \ Perl）的编译和/或运行。\n\n**注意：** 此端口（截至 0.4.1）不会编译为 Syian OS GUI 应用程序，而是生成一个 Syian DLL。该\
  \ DLL 包含一个名为 `CPerlBase` 的 C++ 类，可以使用（继承并）使用它将 Perl 嵌入应用程序中，请参见 `syian/README`。\n\
  \nPerl 到 Syian 的基础端口仅实现了基本的 POSIX 类功能；没有实现任何额外的 Syian 或 Series 60、Series 80 或 UIQ\
  \ 绑定。\n\n也可以为 `miniperl` 和 `perl` 生成 Syian 可执行文件，但由于 Syian 没有标准的命令行界面（设备上也没有全键盘），这些文件主要用作演示。\n\
  \n### 在 Syian 上编译 Perl\n(0) 你需要安装适当的 Syian SDK。\n\n`这些说明已经在各种 Nokia Series 60 Syian\
  \ SDK（1.2 到 2.6，2.8 也应该可行，1.2 可以编译但无法运行）、Series 80 2.0 以及 Nokia 7710 (Series 90)\
  \ SDK 下经过了测试。你可以从 Forum Nokia (L<>) 获取这些 SDK。我们还对 UIQ 2.1 进行了一个非常粗略的移植（“它可以编译”）。任何\
  \ SDK 的先决条件都是从 ActiveState 安装 ActivePerl，L<> 安装了 SDK 也意味着你需要安装了 Metrowerks CodeWarrior（测试中使用了\
  \ 2.8 和 3.0）或安装了 Microsoft Visual C++ 6.0（至少需要 SP3，推荐 SP5）。请注意，例如 Series 60 2.0\
  \ VC SDK 的安装提到了 ActivePerl 构建 518，该版本（截至 2005 年年中）已不再存在于 ActiveState 网站。成功使用了 ActivePerl\
  \ 5.8.4 构建 810 在 Syian 上编译 Perl。5.6.x 版本的 ActivePerl 不可用。尚未尝试过其他 SDK 或编译器，如 Visual.NET、仅命令行的\
  \ Visual.NET、Borland、GnuPoc 或 sdk2unix。这些说明几乎不支持旧版本的 Syian 或其他 SDK。欢迎用于其他版本、SDK、编译器、平台或设备运行此端口的补丁。`\n\
  \n(1) 从 <> 获取 Perl 源码包（例如 `perl-5.9.2.tar.gzisfine` 文件）并将其解压到你的 Windows 系统 `C:/SyiandirectoryofyourWindows`\
  \ 中。\n\n(2) 切换到 perl 源码目录。\n`cd c:\\Syian\\perl-5.x.x`\n\n(3) 使用 SDK 自带的 perl 运行以下脚本\n\
  `perl syian\\config.pl` 使用 `cmd.exe`，Cygwin shell 将无法工作。PATH 应该包含 SDK 工具，包括 Perl，这在\
  \ cmd.exe 下应该是可能的。如果你没有，请查看 `syian\\sdk.pl` 末尾关于如何设置环境以进行 Syian 编译说明。\n\n(4) 构建项目，通过以下方式\n\
  \n\n\n\n在 `cmd.exe` 中执行 `make all`，或者使用 Metrowerks CodeWarrior、Visual C++ 6.0 或\
  \ Visual Studio 8（Visual C++ 2005 Express 版也可以运行）。如果你使用 VC IDE，你必须先通过 `cmd.exe`\
  \ 运行 `F<syian\\config.pl>`，然后运行 `make win.mf vc6.mf` 来生成 VC6 的 Makefile 和工作空间。`\"\
  make vc6\"` 将为 VC6 编译，`\"make cw\"` 将为 CodeWarrior 编译。\n\n以下 SDK 和编译器配置以及诺基亚手机在某些点经过测试（+\
  \ = 已编译并运行 PerlApp，- = 未运行），适用于 Perl 5.8.x 和 5.9.x：\n\n| SDK | VC | CW | 诺基亚手机 |\n\
  | :--- | :--- | :--- | :--- |\n| S60 1.2 | + | + | 3650 (*) |\n| S60 2.0 | + | +\
  \ | 6600 |\n| S60 2.1 | - | + | 6670 |\n| S60 2.6 | + | + | 6630 |\n| S60 2.8 |\
  \ + | + | (未在设备中测试) |\n| S80 2.6 | - | + | 9300 |\n| S90 1.1 | + | - | 7710 |\n\
  | UIQ 2.1 | - | + | (未在设备中测试) |\n\n(*) 可以编译但无法工作，遗憾的是，这是 Syian 的问题。\n\n如果你直接使用 `make`，它使用的是\
  \ SDK 中的 GNU make，它将根据需要为 Windows 链接器构建和 Arm 目标构建（默认为 'thu'）调用正确的 make 命令。构建脚本假设\
  \ C: 盘下的“绝对路径”SDK 安装路径，“subst 样式”将不起。\n\n如果使用 VC IDE，构建时可以使用例如：File->Open Workspace->\
  \ `C:\\Syian\\8.0a\\S60_2nd_FP2\\epoc32\\build\\syian\\perl\\perl\\wins\\perl.dsw`。链接器二进制文件将出现在\
  \ sa 目录。\n\n如果使用 VC IDE，在构建初期你会遇到很多警告，因为源代码中提到的许多头文件无法找到，但不严重，因为这些头文件没有被使用。Metrowerks\
  \ 会产生许多关于未使用变量和空声明的警告，你可以忽略它们。\n\n当构建 Windows 和 Arm DLL 时，不要被快速飞过的长信息吓到：这是“导出冻结”阶段，整个（相当大的）Perl\
  \ API 列在这里。\n\n构建完成后，你需要通过 `make perldll.sis` 创建 DLL SIS 文件，这会创建 `perlXYZ.sis` 文件（XYZ\
  \ 为 Perl 版本），然后你可以将其安装到你的 Syian 设备中：此此的简单方法是通过蓝牙或红外发送它们并直接打开信息。\n\n由于安装后所有 Perl\
  \ SIS 文件的总大小超过 2 MB，建议安装到内存卡（E: 盘）而不是 C: 盘。`perlXYZ.SIS` 的大小约为 370 kB，但一旦进入设备，它大约占用一个\
  \ 750 kB（根据应用程序管理器）。\n\n`perlXYZ.sis` 仅包含 Perl DLL：要创建一个包含部分标准（纯）Perl 库的额外 SIS 文件，请执行命令\
  \ `make perllib.sis`。包含了部分标准 Perl 库，并非全部：更多详情请参见 `L</HISTORY>` 或 `F<syian\\install.cfg>`（250\
  \ kB -> 700 kB）。还有部分标准 Perl XS 扩展（见 `L</HISTORY>`）：`make perlext.sis`，它将创建 `perlXYZext.sis`（290\
  \ kB -> 770 kB）。\n\n要编译演示程序 PerlApp，你首先需要在 SDK 下安装 Perl 头文件。要安装 Perl 头文件和类 `CPerlBase`\
  \ 文档，以便你使用 SDK 编译 Perl 程序时不再需要 Perl 源码：`make sdkinstall`。目标目录为 `C:\\Syian\\perl\\\
  X.Y.Z`。更多详情请参见 `F<syian\\PerlBase.pod>`。\n\n头文件安装后，你可以为 PerlApp 创建一个 SIS：`make perlapp.sis`。`perlapp.sis`（11\
  \ kB -> 16 kB）将在 syian 子目录中构建，但也会复制到主目录。\n\n如果你想打包 Perl DLL（一个用于 WINS，一个用于 ARMI）、头文件和文档：`make\
  \ perlsdk.zip` 将创建 `perlXYZsdk.zip`，该文件可以在带有 SDK 的另一个 Windows 系统中使用，而无需在该系统中编译 Perl。\n\
  \n如果你想打包 PerlApp 源码：`make perlapp.zip`。如果你想打包 `perl.exe` 和 `miniperl.exe`，可以使用 `perlexe.sis`\
  \ 和 `miniperlexe.sis` make 目标。你可能还需要库的 `perllib.sis` 甚至可能用于识别器的 `perlapp.sis`。make\
  \ 目标 `allsis` 组合了上述所有 SIS 目标。\n\n编译后的清理可以使用 `make clean` 或 `make distclean`，取决于你想清理的程度。\n\
  \n### 编译问题\n\n如果你在执行 `make` 之后看到：\n\n```\ncat makefile.sh >makefile 'cat' 不是内部或外部命令、可程序或批文件。\n\
  ```\n\n这意味着你需要（重新）运行 `syian\\config.pl`。\n\n如果你得到错误：\n\n```\nperl' 不是内部或外部命令、可程序或批文件。\n\
  ```\n\n你可能需要重新安装 `syian\\config.pl`。\n\n如果你看到：\n\n```\n系统找不到文件 C:\\Syian...[忽略 1]\n\
  ```\n\n这并不严重，因为这些头文件没有被使用。Metrowerks 会产生许多关于未使用变量和空声明的警告，你可以忽略它们。\n\n当构建 Windows\
  \ 和 Arm DLL 时，不要被快速飞过的长信息吓到：这是“导出冻结”阶段，整个（相当大的）Perl API 列在这里。\n\n构建完成后，你需要通过 `make\
  \ perldll.sis` 创建 DLL SIS 文件，这会创建 `perlXYZ.sis` 文件（XYZ 为 Perl 版本），然后你可以将其安装到你的 Syian\
  \ 设备中：此此的简单方法是通过蓝牙或红外发送并直接打开信息。\n\n由于安装后所有 Perl SIS 文件的总大小超过 2 MB，建议安装到内存卡（E: 盘）而不是\
  \ C: 盘。`perlXYZ.sis` 的大小约为 370 kB，但一旦进入设备大约 750 kB（根据应用程序管理器）。\n\n`perlXYZ.sis`\
  \ 仅包含 Perl DLL：要创建一个包含部分标准（纯）Perl 库的额外 SIS 文件，请执行命令 `make perllib.sis`。包含了部分标准 Perl\
  \ 库，并非全部：更多详情请参见 `L</HISTORY>` 或 `F<syian\\install.cfg>`（250 kB -> 700 kB）。还有部分标准\
  \ Perl XS 扩展（见 `L</HISTORY>`）：`make perlext.sis`，它将创建 `perlXYZext.sis`（290 kB ->\
  \ 770 kB）。\n\n要编译演示程序 PerlApp，你首先需要在 SDK 下安装 Perl 头文件。要安装 Perl 头文件和类 `CPerlBase`\
  \ 文档，以便你使用 SDK 编译 Perl 程序时不再需要 Perl 源码：`make sdkinstall`。目标目录为 `C:\\Syian\\perl\\\
  X.Y.Z`。更多详情请参见 `F<syian\\PerlBase.pod>`。\n\n头文件安装后，你可以为 PerlApp 创建一个 SIS：`make perlapp.sis`。`perlapp.sis`（11\
  \ kB -> 16 kB）将在 syian 子目录中构建，但也会复制到主目录。\n\n如果你想打包 Perl DLL（一个用于 WINS，一个用于 ARMI）、头文件和文档：`make\
  \ perlsdk.zip` 将创建 `perlXYZsdk.zip`，该文件可以在带有 SDK 的另一个 Windows 系统中使用，而无需在该系统中编译 Perl。\n\
  \n如果你想打包 PerlApp 源码：`make perlapp.zip`。如果你想打包 `perl.exe` 和 `miniperl.exe`，可以使用 `perlexe.sis`\
  \ 和 `miniperlexe.sis` make 目标。你可能还需要库的 `perllib.sis` 甚至可能用于识别器的 `perlapp.sis`。make\
  \ 目标 `allsis` 组合了上述所有 SIS 目标。\n\n编译后的清理可以使用 `make clean` 或 `make distclean`，取决于你想清理的程度。\n\
  \n### 编译问题\n\n如果你在执行 `make` 之后看到：\n\n```\ncat makefile.sh >makefile 'cat' 不是内部或外部命令、可程序或批文件。\n\
  ```\n\n这意味着你需要（重新）运行 `syian\\config.pl`。\n\n如果你得到错误：\n\n```\nperl' 不是内部或外部命令、可程序或批文件。\n\
  ```\n\n你可能需要重新安装 `syian\\config.pl`。\n\n如果你看到：\n\n```\n系统找不到文件 C:\\Syian...[忽略 1]\n\
  ```\n\n这并不严重，因为这些头文件没有被使用。Metrowerks 会产生许多关于未使用变量和空声明的警告，你可以忽略它们。\n\n### 在 Syian\
  \ 中使用 Perl\n\n首先，请注意，在使用 Perl 时你对 Syian 设备拥有完全访问权限：除非你非常小心，否则会对你的设备造成很大损坏（例如删除系统文件）。在进行任何操作之前请务必备份。\n\
  \nPerl 的移植大部分是使用 Syian STDLIB 库完成的。这是一个相当完整的库，但此类库中某些在非 UNIX 平台上通常不留实现的角落也遗留了实现，例如：`fork()`、`signals()`、用户/组\
  \ ID、适用于套接字的 `select()`、非阻塞套接字等。参见文件 `syian/config.sh*` 并查找 'undef' 以找到不支持的 API（或从\
  \ Perl Config 查看）。\n\nSyian 设备文件系统使用类似 DOS 的语法，“驱动器”通过冒号与路径分离，并使用反斜杠作为路径。驱动器的精确分配可能随平台而异，例如在\
  \ Series 60 上你可能会看到 C: 为主（闪存）内存，D: 为 RAM 盘，E: 为内存卡（MMC），Z: 为 ROM。在 Series 80 上 D:\
  \ 是内存卡。在设备方面，NUL: 是空桶，COMx: 是串口线，IRCOMx: 是红外端口，TMP: 可能是 C:\\System\\Temp。在双引号字符串中请双这些反斜杠。\n\
  \n### sisify.pl\n\n在 syian 子目录中有一个工具。\n\nPerl DLL 安装在 \\System\\Libs\\。Perl 库和扩展\
  \ DLL 安装在 \\System\\Libs\\Perl\\X.Y.Z\\。PerlApp 安装在 \\System\\Apps\\,，且 SIS 还在 \\\
  Perl\\（在 Nokia 7710 上为 C:\\Mydocs\\Perl）安装了一些脚本。\n\n注意 Syian 文件系统非常敏感：它强烈于 \\ 而不是\
  \ /。\n\n进行 XS / Syian C++ 编程时，先包含 Syian 头文件，然后是标准 C/POSIX 头文件，然后是 Perl 头文件，最后是任何头文件。\n\
  \n*New()* 和 *Copy()* 遗憾地被 Syian 和 Perl 代码共同使用，如果你需要它们，你必须使用 cpp 技巧。PerlBase.h 取消了\
  \ Perl 的定义并将其重新定义为 *PerlNew()* 和 *PerlCopy()。\n\n\n\n\n很多。参见 `syian/TODO`。\n\n##\
  \ 警告\n\n从 Perl Syian 移植版本 0.4.1 开始，Perl 标准回归测试套件的任何部分尚未在运行移植版 Perl 的真实 Syian 设备上运行过，因此可能存在未发现的错误。因此，不提供任何保证。\n\
  \n## 注意\n\n在为 Syian 或 Series 60、Series 80 或 Series 90 创建和扩展应用程序接口 (API) 时，建议不要在\
  \ API 名称中使用商标、注册商标或贸易名称。相反，开发人员应该考虑基于现有的（`C++` 或可能是 Java）公共组件和 API 命名进行 命名，并根据新\
  \ API 所属的编程语言规则进行适当修改。\n\nNokia 是 Nokia 公司的注册商标。Nokia 产品名称是 Nokia 的商标或注册商标。此处提到的其他产品和公司名称可能是其各自所有者的商标或贸易名称。\n\
