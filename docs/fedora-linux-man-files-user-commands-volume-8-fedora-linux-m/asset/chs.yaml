  \ \\p{Block=Arabic_Mathematical_Alphabetic_Syols} (简写：\\p{ArabicMath}, \\p{InArabicMath})\
  \ (256) \\p{Arabic_PF_A} \\p{Arabic_Presentation_Forms_A} (= \\p{Block=Arabic_Presentation_Forms_A})\
  \ (688) X \\p{Arabic_PF_B} \\p{Arabic_Presentation_Forms_B} (= \\p{Block=Arabic_Presentation_Forms_B})\
