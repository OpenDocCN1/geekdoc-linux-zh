  \n## 历史\n\n0.1.0: 2005 年 4 月\n\n（这在 Syian 安装程序中将显示为 \"0.01\"。）\n\n- 控制台窗口确实是一个非常简单的控制台：可以使用\
  \ \"000\" 获取换行符，“C\" 键是退格键。不要期望一个支持 vt100 或 ANSI 序列的终端。控制台也是 \"ASCII\" 的，你无法输入例如任何重音字母。由于明显的物理限制，控制台也非常小：（在\
  \ Nokia 6600 上）22 列，17 行。 - 可用的以下库：`AnyDBM_File`, `AutoLoader`, `base`, `Carp`,\
  \ `Config`, `Cwd`, `constant`, `DynaLoader`, `Exporter`, `File::Spec`, `integer`,\
  \ `lib`, `strict`, `Syol`, `vars`, `warnings`, `XSLoader` - 可用的以下扩展模块有：`attributes`,\
  \ `Compress::Zlib`, `Cwd`, `Data::Dumper`, `Devel::Peek`, `Digest::MD5`, `DynaLoader`,\
  \ `Fcntl`, `File::Glob`, `Filter::Util::Call`, `IO`, `List::Util`, `MIME::Base64`,\
  \ `PerlIO::scalar`, `PerlIO::via`, `SDBM_File`, `Socket`, `Storable`, `Ti::HiRes`\
  \ - 出各种技术原因缺少以下扩展模块：`B`, `ByteLoader`, `Devel::DProf`, `Devel::PPPort`, `Encode`,\
  \ `GDBM_File`, `I18N::Langinfo`, `IPC::SysV`, `NDBM_File`, `Opcode`, `PerlIO::encoding`,\
  \ `POSIX`, `re`, `Safe`, `Sys::Hostna`, `Sys::Syslog`, `threads`, `threads::shared`,\
  \ `Unicode::Normalize` - 不支持使用 `MakeMaker` 或 `Module::*` 构建和安装模块。 - 不构建内核以外的 `XS`。\n\
  \n由于这是 0.x 版本，任何未来的发布几乎可以保证是不二进制兼容的。作为这一标志，Syian syol 导出保持未冻结状态，并且每次都会重新构建 .def\
  \ 文件。\n\n0.2.0: 2005 年 10 月\n\n- `Perl 5.9.3` (patch level 25741) - 支持 `Compress::Zlib`\
  \ 和 `IO::Zlib` - 添加了 `sisify.pl`\n\n我们保持二进制不兼容。\n\n0.3.0: 2005 年 10 月\n\n- `Perl\
  \ 5.9.3` (patch level 25911) - 支持 Series 80 2.0 和 UIQ 2.1\n\n我们保持二进制不兼容。\n\n0.4.0:\
  \ 2005 年 11 月\n\n- `Perl 5.9.3` (patch level 26052) - 添加了一个示例 Syian 扩展\n\n我们保持二进制不兼容。\n\
  \n0.4.1: 2006 年 12 月\n\n- `Perl 5.9.5-to-be` (patch level 30002) - 添加的扩展：`Compress/Raw/Zlib`,\
  \ `Digest/SHA`, `Hash/Util`, `Math/BigInt/FastCalc`, `Text/Soundex`, `Ti/Piece`\
  \ - 由 alexander smishlajev 移植到 S90 1.1\n\n我们保持二进制不兼容。\n\n0.4.2: 2007 年 3 月\n\n-\
  \ 跟 Perl `5.9.5-to-be` (patch level 30812) - 已测试可用 Microsoft Visual C++ 2005 Express\
  \ 版构建（它使用 Microsoft Visual C 8，而不是旧的 VC6），测试使用的 SDK 为 `S60_2nd_FP3` 即 8.1a\n\n我们保持二进制不兼容。\n\
  \n# Perl 语法\n\n## 名称\n\nperlsyn - Perl 语法\n\n## 描述\n\n一个 Perl 程序由一系列从上到部执行的声明和语句组成。循环、子程序和其他控制结构允许你在代码内部进行跳转。\n\
  \nPerl 是一种自由格式语言：你可以按照你喜欢的方式对其进行格式化和缩进。空格主要用于分隔标记，不像 Python 等语言（空格在后者中是重要部分）。\n\n\
  Perl 的许多语法元素是可选的。与其要求你对每个函数调用加上括号并声明每个变量，你通常可以省略此类显式元素，Perl 会推断你的意思。这被称为“我所意”（DWIM）。它允许程序员以他们熟悉的风格编写代码。\n\
  \nPerl 借鉴了许多语言的语法和概念：awk, sed, C, Bourne Shell, Smalltalk, Lisp 以及\n\n### 声明\n\n\
  语句序列可以包含作用域变量的声明，除了声明变量外，声明表现得像普通语句，并在语句序列中像普通语句一样被处理。因此它实际上具有编译时和运行时的影响。所有声明通常放在脚本的开头或结尾。然而，如果你使用\
  \ `my()`、`state()` 或 `our()` 创建作用域变量，你必须确保你的格式或子程序定义在你访问这些私有变量的块内。\n\n声明子程序允许该子程序从该点开始作为列表操作符使用。你可以通过说\
  \ `sub na` 来声明子程序而不定义它，如下：\n\n```\nsub myna; $ = myna $0 or die \"can't get myna\"\
  ;\n```\n\n裸声明会将函数声明为列表操作符，而不是元运算符，因此你必须小心使用括号（或使用 `or` 代替 `||`）。\n\n`||` 运算符绑定过于紧密，无法直接在列表操作符后使用；它变成了最后一个元素的一部分。你可以始终对列表操作符加上括号，以将列表操作符变回更像函数调用的形式。或者，你可以使用原型\
  \ `($)` 将子程序转换为元运算符：\n\n```\nsub myna ($); $ = myna $0 || die \"can't get myna\"\
  ;\n```\n\n现在它的解析符合你预期的了，但在这种情况下你仍然应该养成使用括号的习惯。关于原型的更多信息，请参见 perlsub。\n\n子程序声明也可以通过\
  \ `require` 语句加载，或者通过 `use` 语句同时加载并导入到你的命名空间中。有关此的详细信息，请参阅 perlmod。\n\n### 注释\n\n\
  从 `#` 字符到行尾的文本都是注释，会被忽略。异常包括字符串或正则表达式内部的 `#`。\n\n### 简单语句\n\n\n\n\n唯一的简单语句（statent）是为其副作用而求值的表达式。每个简单语句都必须以分号结尾，除非它是代码块中的最后一个语句，在这种情况下分号是可选的。但如果该块占据超过一行，请务必加上分号，因为你最终可能还会添加另一行。请注意，存在像\
  \ `eval {}`、`sub {}` 和 `do {}` 这样的运算符*看起来*像复合语句，但它们并不是——它们只是表达式中的项（TERMS）——因此当它们作为语句的最后一项使用时，需要显式终止。\n\
  \n### 真与假\n\n数字 `0`、字符串 `'0'` 和 `' '`、空列表 `()` 以及 `undef` 在布尔上下文中都为假。所有其他值都为真。通过\
  \ `!` 或 `not` 对真值进行取反会返回一个特殊的假值。当将其求值为字符串时，它被视为 `' '`，但作为数字时，它被视为 `0`。大多数返回真或假的\
  \ Perl 运算符都是这样运行的。\n\n### 语句修饰符（Statent Modifiers）\n任何简单语句都可以可选地后跟一个 `SINGLE` 修饰符，位于终止分号（或块结束符）之前。可能的修饰符有：\n\
  \n`if EXPR unless EXPR while EXPR until EXPR for LIST foreach LIST when EXPR`\n\n\
  修饰符后面的 `EXPR` 被称为“条件”。它的真假决定了修饰符的行为。\n\n`if` 仅当*仅当*条件为真时执行该语句。`unless` 则相反，它在条件为真*除非*执行该语句（即：条件为假时执行）。\n\
  \n`print \"Basset hounds got long ears\" if length $ear >= 10; go_outside() and\
  \ play() unless $is_raining;`\n\n`for(each)` 修饰符是一个迭代器：它为 `LIST` 中的每个项各执行一次语句（其中\
  \ `$_` 轮流别赋值为每个项）。\n\n`print \"Hello $_!\\n\" for qw(world Dolly nurse);`\n\n`while`\
  \ 在条件为真*时*重复执行语句。`until` 则相反，它在条件为真*为止*重复语句（或在条件为假时重复）：\n\n```perl\n# 这两者都从 0 数到\
  \ 10。 print $i++ while $i <= 10; print $j++ until $j > 10;\n```\n\n`while` 和 `until`\
  \ 修饰符具有通常的“while 循环”语义（先求值条件），但应用于 `do`-BLOCK（或 Perl4 的 `do`-SUBROUTINE 语句）除外，在这种情况下，块在求值条件之前执行一次。\n\
  \n这样做是为了让你写出这样的循环：\n\n```perl\ndo { $line = <STDIN>; ... } until !defined($line)\
  \ || $line eq \".\\n\"\n```\n\n参见 `perlfunc` 中的 ``do''。请注意，后文描述的循环控制语句在此结构中将*不会*起作用，因为修饰符不接受循环标签。抱歉。你始终可以在它内部放置另一个块（用于\
  \ `next`）或在它周围放置一个块（用于 `last`）来执行此类操作。对于 `next`，只需双写大括号：\n\n```perl\ndo {{ next\
  \ if $x == $y; # do sothing here }} until $x++ > $z;\n```\n\n对于 `last`，你必须写得更详细：\n\
  \n```perl\nLOOP: { do { last if $x = $y**2; # do sothing here } while $x++ <= $z;\
  \ }\n```\n\n**注意：** 使用语句修饰符条件或循环结构修饰的 `my`、`state` 或 `our`（例如 `my $x if ...`）的行为是**未定义的**。`my`\
  \ 变量的值可能是 `undef`、任何之前赋值的值，或者也可能是任何其他值。不要依赖它。未来的 Perl 版本可能会执行与你尝试的版本不同的操作。此处暗有玄机（Here\
  \ be dragons）。\n\n`when` 修饰符是一个首次出现在 Perl 5.14 中的实验性功能。若要使用它，你应该包含一个 `use v5.14`\
  \ 声明。（技术上讲，它只需要 `switch` 功能，但该特性在 5.14 之前不可用）。它仅在 `foreach` 循环或 `given` 块内部有效，且仅在智能匹配\
  \ `\"$_ ~~ EXPR\"` 为真时执行该语句。如果执行了语句，则会在 `foreach` 内部触发 `next`，在 `given` 内部触发 `break`。\n\
  \n在当前实现下，`foreach` 循环可以位于 `when` 修饰符动态作用范围内任何地方，但必须位于 `given` 块的词法范围内。这种限制在未来的发布中可能会放宽。参见下文的“Switch\
  \ Statements”。\n\n### 复合语句（Compound Statents）\n在 Perl 中，定义作用域语句语句称为块（block）。块的边界由包含它的文件界定（对于需要的文件或整个程序），块的边界由字符串的范围界定（对于\
  \ `eval`）。\n\n但通常，块由花括号（也称为大括号）界定。我们将这种语法结构称为 BLOCK。\n\n可以使用以下复合语句来控制流：\n\n`if (EXPR)\
  \ BLOCK if (EXPR) BLOCK else BLOCK if (EXPR) BLOCK elsif (EXPR) BLOCK ... if (EXPR)\
  \ BLOCK elsif (EXPR) BLOCK ... else BLOCK unless (EXPR) BLOCK unless (EXPR) BLOCK\
  \ else BLOCK unless (EXPR) BLOCK elsif (EXPR) BLOCK ...`\n\n\n\n`next` 命令开始循环的下一次迭代：\n\
  \n```\nLINE: while (<STDIN>) { next LINE if /^#/; # discard comnts ... }\n```\n\n\
  `last` 命令立即退出当前的循环。如果有 `continue` 块，则不会执行它：\n\n```\nLINE: while (<STDIN>) { last\
  \ LINE if /^$/; # exit when done with header ... }\n```\n\n`redo` 命令在不重新评估条件的情况下重启循环块。如果有\
  \ `continue` 块，则*不会*执行。此命令通常用于那些想要对刚刚输入的内容自欺欺人的程序。\n\n例如，在处理类似 `/etc/termcap` 的文件时。如果你的输入行可能以反斜杠结尾以表示延续，你想跳过并获取下一个记录。\n\
  \n```perl\nwhile (<>) { chomp; if (s/\\\\$//) { $_ .= <>; redo unless eof(); } #\
  \ now process $_ }\n```\n\n这是对更显式写法的简写：\n\n```perl\nLINE: while (defined($line =\
  \ <ARGV>)) { chomp($line); if ($line =~ s/\\\\$//) { $line .= <ARGV>; redo LINE\
  \ unless eof(); # not eof(ARGV)! } # now process $line }\n```\n\n注意，如果上述代码中有 `continue`\
  \ 块，它只会在被正则表达式删除的行上执行（因为 `redo` 跳过了 `continue` 块）。`continue` 块通常用于重置行计数器或 `m?pat?`\
  \ 一次性匹配：\n\n```perl\n# inspired by :1,$g/fred/s//WILMA/ while (<>) { m?(fred)? &&\
  \ s//WILMA $1 WILMA/; m?(barney)? && s//BETTY $1 BETTY/; m?(hor)? && s//MARGE $1\
  \ MARGE/; } continue { print \"$ARGV $.: $_\"; close ARGV if eof; # reset $. reset\
  \ if eof; # reset ?pat? }\n```\n\n如果将单词 `while` 替换为 `until`，测试含义就会反转，但条件在第一次迭代之前仍然会被测试。\n\
  \n循环控制语句在 `if` 或 `unless` 中不起作用，因为它们不是循环。不过，你可以通过双层大括号让它们变成循环。\n\n```perl\nif (/pattern/)\
  \ {{ last if /fred/; next if /barney/; # sa effect as \"last\", # but doesn't docunt\
  \ as well # do sothing here }}}\n```\n\n这是因为块本身充当一个执行一次的循环，参见 `Basic BLOCKs`（基础块）。\n\
  \nPerl 4 中提供的 `while/if BLOCK BLOCK` 形式已不再可用。将任何 `if BLOCK` 的出现替换为 `if (do BLOCK)`。\n\
  \n### For 循环 (For Loops)\n\nPerl 的 C 风格 `for` 循环与相应的 `while` 循环一样；这意味着：\n\n```perl\n\
  for ($i = 1; $i < 10; $i++) { ... }\n```\n\n等同于：\n\n```perl\n$i = 1; while ($i <\
  \ 10) { ... } continue { $i++; }\n```\n\n有一个微小的区别：如果在 `for` 的初始化部分用 `my` 声明变量，则这些变量的词法作用域整个\
  \ `for` 循环（循环体和控制部分）。\n\n作为一种特殊情况，如果 `for` 循环（或相应的 `while` 循环）中的测试为空，它被视为真。也就是说，两者：\n\
  \n```perl\nfor (;;) { ... }\n```\n\n和\n\n```perl\nwhile () { ... }\n```\n\n都被视为无限循环。\n\
  \n除了普通的数组索引循环，`for` 还可以用于许多其他有趣的应用。这里有一个示例，可以避免在交互式文件描述符上显式测试文件结束导致程序看似挂起的问题：\n\n\
  ```perl\n$on_a_tty = -t STDIN && -t STDOUT; sub prompt { print \"yes? \" if $on_a_tty\
  \ } for ( prompt(); <STDIN; prompt() ) { # do sothing }\n```\n\n使用 `readline`（或运算符形式\
  \ `<EXPR>`）作为 `for` 循环的条件，是以下内容的简写。这种行为与 `while` 循环条件的行为相同。\n\n```perl\nfor ( prompt();\
  \ defined( $_ = <STDIN> ); prompt() ) { # do sothing }\n```\n\n### Foreach 循环 (Foreach\
  \ Loops)\n\n`foreach` 循环遍历普通列表值，并将标量变量 `VAR` 依次设置为列表的每个元素。如果变量前有关键字 `my`，则它是词法作用域，因此仅在循环内可见。否则，该变量隐式局部于循环并在退出循环时恢复其原有值。如果变量之前用\
  \ `my` 声明过，它将使用该变量而不是全局变量，但它仍然局部于循环。这种隐含局部化*仅*发生在 `foreach` 循环中。\n\n`foreach` 关键字实际上是\
  \ `for` 关键字的同义词，所以你可以使用任何一个。如果省略了 `VAR`，则 `$_` 被设置为每个值。\n\n如果 `LIST` 中的任何元素都是左值（lvalue），你可以通过修改循环内部\
  \ `VAR` 来修改它。相反，如果 `LIST` 中的任何元素*不是*左值，任何修改该元素的尝试都将失败。换句话说，`foreach` 循环索引变量是正在遍历的列表中每个项的隐式别名。\n\
  \n如果 `LIST` 的任何部分是数组，如果你在循环中添加或删除元素，`foreach` 会变得非常困惑。\n\n\n\n\n从 Perl 5.10.1 开始（实际上是\
  \ 5.10.0，但它工作得并不正常），你可以说\n\n`use feature \"switch\";`\n\n来启用实验性的 switch 特性。这粗程度上基于旧版本的\
  \ Perl 6 提议，但它不再反映 Perl 6 的构造。每当你声明代码倾向于运行在 5.10 或更高版本的 Perl 下，你也会获得 switch 特性。例如：\n\
  \n`use v5.14;`\n\n在 `switch` 特性下，Perl 获得了实验性关键字 `given`、`when`、`default`、`continue`\
  \ 和 `break`。从 Perl 5.16 开始，可以在 switch 关键字前加上 `CORE::` 以在不使用 `use feature` 语句的情况下访问该特性。关键字\
  \ `given` 和 `when` 类似于其他语言中的 `switch` 和 `case`，因此上一节的代码可以重写为：\n\n`use v5.10.1; for\
  \ ($var) { when (/^abc/) { $abc = 1 } when (/^def/) { $def = 1 } when (/^xyz/) {\
  \ $xyz = 1 } default { $nothing = 1 } }`\n\n`foreach` 是设置主题器（topicalizer）的实验性方法。如果你想使用高度实验性的\
  \ `given`，可以这样写：\n\n`use v5.10.1; given ($var) { when (/^abc/) { $abc = 1 } when\
  \ (/^def/) { $def = 1 } when (/^xyz/) { $xyz = 1 } default { $nothing = 1 } }`\n\
  \n从 5.14 开始，也可以这样写：\n\n`use v5.14; for ($var) { $abc = 1 when /^abc/; $def = 1 when\
  \ /^def/; $xyz = 1 when /^xyz/; default { $nothing = 1 } }`\n\n或者如果你不在乎安全起见，可以这样写：\n\
  \n`use v5.14; given ($var) { $abc = 1 when /^abc/; $def = 1 when /^def/; $xyz =\
  \ 1 when /^xyz/; default { $nothing = 1 } }`\n\n`given` 和 `when` 的参数处于标量上下文中，`given`\
  \ 会为 `$_` 变量分配其主题值。\n\n`when` 的参数 `EXPR` 具体在做什么很难精确描述，但通常情况下，它会尝试猜测你想做什么。有时它被解释为\
  \ `\"$_ ~~ EXPR\"`，有时又不是。当它被 `given` 块词法包围时，其行为与被 `foreach` 循环动态包围时也不同。这些规则太复杂，无法在此描述。请参见后文的\
  \ `Experimental Details on given and when`。\n\n由于 Perl 5.10 到 5.16 之间 `given` 实现中的一个不幸的\
  \ bug，在这些实现中，由 `given` 控制的 `$_` 版本是原始值的逻辑作用域拷贝，而不是原始值的动态作用域别名（就像在 `foreach` 或原始及当前的\
  \ Perl 6 语言规范中那样）。这个 bug 在 Perl 5.18 中被修复。如果你确实需要一个词法上的 `$_`，请显式指定，但注意 `my $_` 现在已弃用，除非禁用了警告，否则会发出警告：\n\
  \n```\ngiven(my $_ = EXPR) { ... }\n```\n\n如果你的代码仍需要在旧版本上运行，请坚持使用 `foreach` 作为你的主题器，这样你会不会那么不开心。\n\
  \n### Goto\n\n虽然不适合胆小的人，但 Perl 确实支持 `goto` 语句。三种三种：`goto-LABEL`、`goto-EXPR` 和 `goto-NAME`。循环的\
  \ `LABEL` 实际上并不是 `goto` 的有效目标；它只是循环的名字。\n\n`goto-LABEL` 形式会找到标记为 `LABEL` 的语句并在那里恢复执行。它不能用于进入任何需要初始化的构造，例如子程序或\
  \ `foreach` 循环。它不能用于进入被优化掉的构造。它可以跳转到动态作用范围内的几乎任何地方，包括跳出子程序，但通常使用其他构造（如 `last` 或\
  \ `die`）更好。Perl 的作者从未觉得有必要使用这种形式的 `goto`（在 Perl 中是如此说——C 则是另一回事）。\n\n`goto-EXPR`\
  \ 形式期望一个标签名称，其作用域将动态解析。这允许像 FORTRAN 那样进行计算 `goto`，但如果你是为了可维护性进行优化，则并不推荐这样做：\n\n\
  ```\ngoto((\"FOO\", \"BAR\", \"GLARCH\")[$i]);\n```\n\n`goto-NAME` 形式非常有魔力，它会将对命名子程序的调用替换为当前运行的子程序。这被\
  \ `AUTOLOAD()` 子程序使用，用于加载另一个子程序，然后假装另一个子程序最初就被调用了（除了当前子程序对 `@_` 的任何修改都会传播到另一个子程序）。在\
  \ `goto` 之后，甚至 `caller()` 都无法判断此例是先被调用的。\n\n在几乎所有此类情况下，使用 `next`、`last` 或 `redo`\
  \ 等结构化控制流机制比诉诸 `goto` 要好得多。对于某些应用，使用 `eval{}` 和 `die()` 的捕获与抛出对进行异常处理也是一种谨慎的方法。\n\
  \n### 省略号语句\n\n从 Perl 5.12 开始，Perl 接受省略号 `...` 作为尚未实现的代码的占位符。这种形式的省略号（未实现的语句）不应与二进制翻转运算符\
  \ `...` 混淆。一个是一个语句，另一个是运算符。（Perl 通常不会混淆它们，因为通常 Perl 可以判断它想要运算符还是语句，但异常情况见下文。）\n\n\
  当 Perl 5.12 或更高版本遇到省略号语句时，它会解析而不报错，但当你实际上尝试执行它时，Perl 会抛出一个带有 `Unimplented` 文本的异常：\n\
  \n```\nuse v5.12; sub unimplented { ... } eval { unimplented() }; if ($@ =~ /^Unimplented\
  \ at /) { say \"I found an ellipsis!\"; }\n```\n\n你只能使用省略号语句来代表完整的语句。以下是省略号如何工作的示例：\n\
  \n```\nuse v5.12; { ... } sub foo { ... }; eval { ... }; sub { $n = shift; ... };\
  \ $x = do { ... }; say \"Hurrah!\";\n```\n\n省略号语句不能代表较大语句部分的表达式，因为 `...` 翻转运算符的版本（参见\
  \ perlop 中的 `Range Operators`）。\n\n这些尝试省略号的示例是语法错误：\n\n```\nuse v5.12; print ...;\
  \ open(my $fh, \">\", \"/dev/passwd\") or ...; if ($condition && ... ) { say \"\
  Howdy\"};\n```\n\n在某些情况下，Perl 无法立即区分表达式和语句。例如，块和匿名哈构造的语法看起来一样，除非大括号内有些东西给 Perl 提示。如果\
  \ Perl 没有猜到 `{ }` 是块，那么省略号就是语法错误。在这种情况下，它认为 `...` 不是省略号，因为它期望的是表达式而不是语句：\n\n```\n\
  @transford = map { ... } @input;\n```\n\n在你的块内部，可以在省略号之前使用 `;` 来表示 `{ }` 是块而不是哈引用构造函数。现在省略号有效了：\n\
  \n```\n@transford = map {; ... } @input;\n```\n\n注意：人们俗称为这个标点符号为 `yada-yada` 或三点，但它的真实名称是省略号。\n\
  \n### PODs：需要的文档\n\nPerl 有一种将文档与源代码混合的机制。当它期望新语句开始时，如果编译器遇到以等号和单词开头的行，如下所示\n\n=head1\
  \ 这里有 Pods!\n\n那么该文本以及直到包括以 =cut 开头的行内的所有文本都将被忽略。中间文本的格式在 perlpod 中描述。\n\n这允许你自由地混合源代码和文档文本，例如：\n\
  \n=item snazzle($) snazzle() 函数将以你可能想象的最壮观的形式运行，甚至包括网络烟花。 =cut 回归到编译器，够了这些 pod 东西！sub\
  \ snazzle($) { my $thingie = shift; ......... }\n\n\n\n\n\n请注意，pod 翻译器应该只查看以 pod\
  \ 指令开头的段落（这会让解析更容易），而编译器实际上知道即使在段落中间也要查找 pod 转义字符。这确保了接后续的秘密内容会被编译器和翻译器同时忽略。\n\n\
  ```perl\n$a=3; =secret stuff warn \"Neither POD nor CODE!?\" =cut back print \"\
  got $a\\n\";\n```\n\n你可能不应该依赖 `warn()` 永远被 pod 格式化掉。并不是所有的 pod 翻译器在这方面都表现良好，而且也许编译器会变得更加挑剔。\n\
  \n人们还可以使用 pod 指令来快速注释掉一段代码。\n\n### 普通注释（其实并非如此！）\n\nPerl 可以像 C 预处理器一样处理行指令（line\
  \ directives）。通过这种方式，人们可以控制 Perl 在错误或警告信息中文件名和行号的处理（特别是对于使用 `eval()` 处理的字符串）。该机制的语法与大多数\
  \ C 预处理器几乎相同：它匹配以下正则表达式\n\n```perl\n# example: '# line 42 \"new_filena.plx\"' /^\\\
  # \\s* line \\s+ (\\d+) \\s* (?:\\s(\"?)([^\"]+)\\g2)? \\s* $/x\n```\n\n其中 `$1`\
  \ 是下一行的行号，`$3` 是可选的文件名（带或不带引号）。注意，与现代 C 预处理器不同，`#` 之前不能有任何空格。\n\n行指令中包含一个相当明显的陷阱（gotcha）：调试器和分析器只会显示在文件中特定行号上最后出现的最后行源代码。务必留心，不要在稍后想要调试的代码中引起行号冲突。\n\
  \n以下是你应该输入到命令行 shell 中的一些示例：\n\n```bash\n% perl # line 200 \"bzzzt\" # the '#' on\
  \ the previous line must be the first char on line die 'foo'; __END__ foo at bzzzt\
  \ line 201\\. % perl # line 200 \"bzzzt\" eval qq[\\n#line 2001 \"\"\\ndie 'foo'];\
  \ print $@; __END__ foo at - line 2001\\. % perl eval qq[\\n#line 200 \"foo bar\"\
  \\ndie 'foo']; print $@; __END__ foo at foo bar line 200\\. % perl # line 345 \"\
  goop\" eval \"\\n#line \" . __LINE__ . ' \"' . __FILE__ .\\\"\\\\\"\\ndie 'foo'\"\
  ; print $@; __END__ foo at goop line 345\\.\n```\n\n### 关于 given 和 when 的实验细节\n\n\
  如前所述，`switch` 功能被认为具有高度实验性；它可能会在几乎不通知的情况下发生变化。特别是 `when` 具有复杂的行为，这些行为预计在未来将变得不那么复杂。不要依赖它目前的（错误的）实现。在\
  \ Perl 5.18 之前，`given` 也有一些复杂的行为，如果你的代码运行在旧版本的 Perl 上，仍然需要提这些这些。\n\n这是一个关于 `given`\
  \ 的较长示例：\n\n```perl\nuse feature \":5.10\"; given ($foo) { when (undef) { say '$foo\
  \ is undefined'; } when (\"foo\") { say '$foo is the string \"foo\"'; } when ([1,3,5,7,9])\
  \ { say '$foo is an odd digit'; continue; # Fall through } when ($_ < 100) { say\
  \ '$foo is numerically less than 100'; } when (\\&complicated_check) { say 'a complicated\
  \ check for $foo is true'; } default { die q(I don't know what to do with $foo);\
  \ } }\n```\n\n在 Perl 5.18 之前，`given(EXPR)` 将 `EXPR` 的值赋值给 `$_` 的词法作用域副本（!），而不是像\
  \ `foreach` 那样的动态作用域别名。这使得它类似于\n\n```perl\ndo { my $_ = EXPR; ... }\n```\n\n不同之处块会通过成功的\
  \ `when` 或显式的 `break` 自动跳出。因为它只是一个副本，而且它是词法作用域的而非动态作用域，所以你无法对它进行你在 `foreach` 循环中习惯的那些操作。特别是，如果这些函数可能尝试访问\
  \ `$_`，那么它对任意函数调用将不起作用。对于这种情况，最好坚持使用 `foreach`。\n\n大部分的威力来自于有时可以适用的隐式智能匹配（smartmatching）。大多数时候，`when(EXPR)`\
  \ 被视为对 `$_` 的隐式智能匹配，即 `$_ ~~ EXPR`。（有关智能匹配的更多信息，请参见 perlop 中的 `Smartmatch Operator`）。但当\
  \ `EXPR` 是下面列出的 10 种异常情况（或类似情况）之一时，它会被直接当作布尔值。\n\n1. 用户定义的子程序调用或方法调用。\n\n2. 形式为\
  \ `/REGEX/`、`$foo =~ /REGEX/` 或 `$foo =~ EXPR` 的正则表达式匹配。以及形式为 `!/REGEX/`、`$foo !~\
  \ /REGEX/` 或 `$foo !~ EXPR` 的否定正则表达式匹配。\n\n3. 使用显式 `~~` 运算符的智能匹配，例如 `EXPR ~~ EXPR`。\n\
  \n**注意：** 你通常需要使用 `$c ~~ $_`，因为默认使用的是 `$_ ~~ $c`，这通常与你想要的相反。\n\n4. 布尔比较运算符，例如 `$_\
  \ < 10` 或 `$x eq \"abc\"`。\n\n\n\n\n另一个有用的快捷方法是，如果你将字面量数组或哈希作为 `given` 的参数，它会被转换为一个引用。例如，`given(@foo)`\
  \ 与 `given(\\@foo)` 是等价。\n\n`default` 的行为与 `when(1 == 1)` 完全相同，这意味着它总是匹配的。\n\n###\
  \ 跳出块 (Breaking out)\n\n你可以使用 `break` 关键字跳出封装的 `given` 块。每个 `when` 块都会隐式地以 `break`\
  \ 结束。\n\n### 穿透 (Fall-through)\n\n你可以使用 `continue` 关键字从一个 case 穿透到下一个 case：\n\n\
  ```\ngiven($foo) { when (/x/) { say '$foo contains an x'; continue } when (/y/)\
  \ { say '$foo contains a y' } default { say '$foo does not contain a y' } }\n```\n\
  \n### 返回值 (Return value)\n\n当 `given` 语句也是一个有效的表达式时（例如，当它是块的最后一个语句时），它的求值结果：\n\n\
  - 一旦遇到显式的 `break`，立即返回一个空列表。\n- 如果存在成功的 `when`/`default` 子句，则返回该子句最后一个评估表达式的值。\n\
  - 如果没有条件为真，则返回 `given` 块最后一个评估表达式的值。\n\n在后两种情况下，最后一个表达式是在应用于 `given` 块的上下文中进行求值的。\n\
  \n请注意，与 `if` 和 `unless` 不同，失败的 `when` 语句始终求值为一个空列表。\n\n```\nmy $price = do { given\
  \ ($item) { when ([\"pear\", \"apple\"]) { 1 } break when \"vote\"; # My vote cannot\
  \ be bought 1e10 when /Mona Lisa/; \"unknown\"; } }; };\n```\n\n目前，`given` 块不能始终作为适当表达式使用。这在\
  \ Perl 未来的版本中可能会解决。\n\n### 在循环中切换 (Switching in a loop)\n\n你可以使用 `foreach()` 循环代替使用\
  \ `given()`。例如，这里是统计特定字符串在数组中出现次数的一种方法：\n\n```\nuse v5.10.1; my $count = 0; for\
  \ (@array) { when (\"foo\") { ++$count } } print \"\\@array contains $count copies\
  \ of 'foo'\\n\";\n```\n\n或者在较新的版本中：\n\n```\nuse v5.14; my $count = 0; for (@array)\
  \ { ++$count when \"foo\"; } print \"\\@array contains $count copies of 'foo'\\\
  n\";\n```\n\n在所有 `when` 块的末尾，有一个隐式的 `next`。如果你只对第一个匹配感兴趣，可以使用显式的 `last` 来覆盖它。\n\n\
  如果你显式指定了循环变量（例如 `for $item (@array)`），这将会不起作用。你必须使用默认变量 `$_`。\n\n### 与 Perl 6 的区别\
  \ (Differences from Perl 6)\n\nPerl 5 的智能匹配（smartmatch）和 `given`/`when` 结构与 Perl\
  \ 6 的对应物不兼容。最可见且最不重要的区别是，在 Perl 5 中，`given()` 和 `when()` 的参数必须加括号（当后者作为语句修饰符使用除外）。在\
  \ Perl 6 中，在 `if()`、`while()` 或 `when()` 等控制结构中括号始终是可选的；在 Perl 5 中，如果不引起大量的潜在混淆，无法使括号变为可选，因为\
  \ Perl 5 会将以下表达式：\n\n```\ngiven $foo { ... }\n```\n\n解析为 `given` 的参数是哈希 `%foo` 的一个元素，并将大括号解释为哈希元素语法。\n\
  \n然而，还有许多许多其他差异。例如，以下代码在 Perl 5 中可以运行：\n\n```\nuse v5.12; my @primary = (\"red\"\
  , \"blue\", \"green\"); if (@primary ~~ \"red\") { say \"primary smartmatches red\"\
  ; } if (\"red\" ~~ @primary) { say \"red smartmatches primary\"; } say \"that's\
  \ all, folks!\";\n```\n\n但在 Perl 6 中完全无法运行。相反地，你应该使用（可并行的）`any` 运算符：\n\n```\nif\
  \ any(@primary) eq \"red\" { say \"primary smartmatches red\"; } if \"red\" eq any(@primary)\
  \ { say \"red smartmatches primary\"; }\n```\n\nperlop 中 `Smartmatch Operator` 中的智能匹配表与\
  \ Perl 6 规范建议的并不相同，这主要是由于 Perl 6 和 Perl 5 数据模型之间的差异，但也因为 Perl 6 规范自 Perl 5 匆忙采用以来发生了变化。\n\
  \n在 Perl 6 中，`when()` 始终会与其参数进行隐式智能匹配，而在 Perl 5 中，在上述大致概述的各种模糊定义的情况下，抑制这种隐式智能匹配是方便的（尽管可能会引起混惑）。这在很大程度上是因为\
  \ Perl 5 即使在内部也没有布尔类型。）\n\n***\n\n# PERLSYNOLOGY\n\n## NAME\n\nperlsynology - 基于\
  \ Synology DSM 系统的 Perl 5\n\n## DESCRIPTION\n\nSynology 制造了大量的网络附属存储（NAS）设备，这些设备在大型企业、小型企业和家庭中非常受欢迎。\n\
  \nNAS 系统配备了 Synology 存储管理器（DSM），这是一个精简的 Linux 系统，增强了多种用于管理 NAS 的工具。有多种硬件型号：Marvell\
  \ Armada (ARMv5tel, ARMv7l)、Intel Atom (i686, x86_64)、Freescale QorIQ (PPC) 等。完整列表请参见\
  \ Synology FAQ <>。\n\n由于它基于 Linux，NAS 可以运行许多软件。\n\n### 设置构建环境 (Setting up the build\
  \ environ)\n\n由于 DSM 是一个精简的 Linux 系统，它缺乏 Linux 上常见的许多工具。基础工具如 `sh`、`cp`、`rm` 是使用\
  \ BusyBox 实现的。\n\n使用常用的浏览器打开 DSM 管理页面并进入 Package Center。\n\n如果你想对 Perl 进行烟雾测试，请安装\
  \ `patch`。\n\n下一步是将源添加到系统库中。本文描述了 Synology 的各种特性。\n\n### 编译 Perl 5 (Compiling Perl\
  \ 5)\n\n设置好构建环境后，编译和测试 Perl 是简单的。你只需要像往常一样下载源码，并按如下所示添加 `Policy.sh` 文件：\n\n```bash\n\
  # Administrivia. perladmin=\"\"\n# Install Perl in a tree in /opt/perl instead of\
  \ /opt/bin. prefix=/opt/perl\n# Select the compiler. Note that there is no 'cc'\
  \ alias or link. cc=gcc\n# Build flags. ccflags=\"-DDEBUGGING\"\n# Library and include\
  \ paths. libpth=\"/lib\" locincpth=\"/opt/include\" loclibpth=\"/lib\"\n```\n\n\n\
  \n\n在你解压源码的目录中，执行熟悉的命令：\n\n```\n./Configure -des make make test make install\n```\n\
  \n### 已知问题\n\n#### `Configure`\n暂无已知问题\n\n#### `Build`\n错误信息 \"No error definitions\
  \ found（未找到错误定义）\"。由于群晖（Synology）文件系统的结构特殊，无法找到错误代码的本地定义，就会生成此错误。\n\n此错误已在 Perl\
  \ 5.19 版本的开发 git 中修复，提交 ID 为 7a8f1212e5482613c8a5b0402528e3105b26ff24。\n\n#### 测试失败\n\
  \n`ext/DynaLoader/t/DynaLoader.t`\n\n由于群晖文件系统结构的特殊，导致一个子测试失败。缺少文件 `/lib/glibc.so`。\n\
  \n警告：不要将 `/lib/glibc.so.6` 软链接到 `/lib/glibc.so`，否则系统组件将开始故障。\n\n### 对 Perl 5 进行冒烟测试\n\
  如果编译成功完成，你可以按照 Test::Smoke 文档中的描述设置冒烟测试。\n\n进行冒烟测试需要一个运行中的 Perl。你可以安装群晖提供的 Perl\
  \ 5.8.6 包，或者编译并安装你自己的更内核版本。\n\n请注意，我无法运行通过群晖任务计划启动的成功冒烟测试。我不得不通过在另一个系统上运行 cron 任务并通过\
  \ ssh 来启动冒烟测试：\n\n```\nssh nas1 wrk/Test-Smoke/smoke/smokecurrent.sh\n```\n\n####\
  \ 本地补丁\n在使用冒烟测试应用本地补丁时，测试驱动会在应用后自动请求重新生成某些表。群晖提供的 Perl 5.8.6（至少在 DS413 上）**并不具备能力**生成这些表。它会生成带有伪值的的操作码，导致构建失败。\n\
  \n你可以通过添加设置来防止重新生成：\n\n```perl\n'flags' => 0,\n```\n\n到冒烟配置中，或者通过添加另一个补丁，在 `regen.pl`\
  \ 程序开头插入：\n\n```\nexit 0 if $] == 5.008006;\n```\n\n### 添加库\n上述过程描述了一个基础环境，因此产生的是基础版本的\
  \ Perl。如果你想为 Perl 添加额外的库，可能需要额外的设置。\n\n例如，基础版 Perl 不包含任何 DB 库（db, dbm, ndbm, gdsm）。你可以使用\
  \ iPKGui 添加这些内容，但你需要将环境变量 `LD_LIBRARY_PATH` 设置为适当的值：\n\n```\nLD_LIBRARY_PATH=/lib:/opt/lib\
  \ export LD_LIBRARY_PATH\n```\n\n该设置在编译 Perl 时生效，在运行程序时也需要生效。\n\n## 修订\n2015 年 3\
  \ 月，适用于群晖 DSM 5.1.5022。\n\n## 作者\nJohan Vromans <> H. Merijn Brand <>\n\n* *\n\n\
  # PERLBUG\n\n## 名称\nperlbug - 如何向 Perl 提交错误报告\n\n## 摘要\n`perlbug`\n\n`perlbug` `[-v]`\
  \ `[-aaddress]` `[-sssubject]` `[-bbody`|`-finputfile]` `[-Foutputfile]` `[-rreturnaddress]`\
  \ `[-eeditor]` `[-cadminaddress`|`-C]` `[-S]` `[-t]` `[-d]` `[-A]` `[-h]` `[-T]`\n\
  \n`perlbug` `[-v]` `[-rreturnaddress]`\n\n`[-A][-ok|`-okay|`-nok|`-nokay]`\n\n`perlthanks`\n\
  \n## 描述\n此程序旨在帮助你生成并发送关于 perl5 及其自带模块的错误报告（以及感谢信）。\n\n在大多数情况下，你可以直接从命令行交互式运行它，无需任何特殊参数，并按照提示操作。\n\
  \n如果你在非标准端口（不属于标准发行版的端口）、二进制发行版或非核心模块（如 Tk, DBI 等）中发现错误，请查看与该发行版附带的文档以确定报告错误的正确位置。\n\
  \n如果你无法使用 `perlbug` 发送报告（最可能是因为你的系统没有 `perlbug` 的的发送方式），你可能可以使用此工具编写报告并将其保存到文件中，然后使用你的普通邮件客户端发送。\n\
  \n在极端情况下，`perlbug` 在你的系统上运行效果可能不足以指导你编写错误报告。在这种情况下，你可能可以使用 `perlbug -d` 获取系统配置信息，将其包含在手动编写的错误报告中。\n\
  \n在报告错误时，请检查以下清单：\n\n你运行的是什么版本的 Perl？\n\n在命令行输入 `perl -v` 即可查找。\n\n你运行的是最新发布的 Perl\
  \ 版本吗？\n\n查看文档以确定。如果你没有使用最新发布版本，请尝试在最新稳定版本上复现你的错误。\n\n请注意，关于旧版本 Perl 错误的报告（特别是那些表明你没有测试当前\
  \ Perl 稳定版本的报告），受到构建和维护 Perl 的志愿者关注的程度可能比当前版本的错误报告少。\n\n此工具不适用于报告 Perl 5.0 之前的任何版本的错误。\n\
  \n你确定你遇到的是一个错误吗？\n\n一个可以被复现的错误更有可能被修复。你对问题提供的任何见解都非常有帮助。换言之，请尝试分析问题并报告你的发现。\n\n\
  你能用通俗英语描述这个错误吗？\n\n越容易理解可复现的错误，越可能被修复。你对问题提供的任何信息都将极有帮助。你可能需要使用调试器来找出哪里出了问题。\n\n\
  如果你不确定某个错误信息是否是预期的，可能需要查阅相关文档。\n\n你有适当的测试用例吗？\n\n越容易复现你的错误，越可能被修复——如果无人能够复制你的问题，它可能不会被处理。\n\
  \n一个良好的测试用例通常具有以下属性：代码短且简单；对外部命令、模块或库的依赖很少；无平台相关的代码（除非是平台特定的）；清晰简单。\n\n良好的测试用例几乎总是\
  \ Perl 测试套件的良好候选者。如果你有，请考虑编写测试用例以便将其纳入标准测试套件中。\n\n你包含了所有相关信息吗？\n\n确保包含具体的错误信息（如果有）。“Perl\
  \ 给了一个错误”并不是一个错误信息。\n\n如果你获得了核心转储（或类似内容），你可能可以使用调试器（**dbx**, **gdb** 等）产生栈跟踪并包含在报告中。\n\
  \n注意：除非你的 Perl 在编译时带有调试信息（通常使用 **-g**），否则栈跟踪可能很难使用，因为它可能只包含函数名而不包含参数。如果可能，请带有调试信息重新编译\
  \ Perl 并复现崩溃和栈跟踪。\n\n你能自己修复这个错误吗？\n\n如果是，那太棒了；带有补丁的错误报告比没有补丁的报告更容易获得关注和兴趣。请使用 `-p`\
  \ 选项将补丁附加到报告中。在发送补丁时，尽可能使用 `git format-patch` 创建，尽管使用 `diff -pu` 创建的统一差异文件效果也差不多。\n\
  \n你的补丁可能会被返回并带有修改请求，或者对你的修复请求更详细的解释。\n\n以下是创建高质量补丁的一些提示：\n\n\n\n\n确保补丁（patch）没有反反（`diff`\
  \ 的第一个参数通常是原始文件，第二个参数是你修改后的文件）。在发送之前，请确保已通过 `git am` 或 `patch` 程序应用你的补丁来测试它。尝试遵循与你正要修补的代码相同的风格。确保你的补丁确实有效（如果你要修补的内容被\
  \ Perl 的测试套件覆盖，请运行 `make test`）。\n\n你能使用 \"perlbug\" 来提交报告吗？\n\n`perlbug` 会确保你的报告包含了关于你\
  \ Perl 版本的关键信息。如果你在输入报告后 `perlbug` 无法发送你的报告，你可能需要手动编写邮件，添加 `perlbug -d` 产生的输出并将其发送到\
  \ 。如果由于某种原因，你在系统上完全无法运行 `perlbug`，请务必包含运行 `perl -V`产生的所有输出（注意 V 是大写）。\n\n无论你是使用\
  \ `perlbug` 还是手动发送邮件，请确保你的主题行（Subject）具有信息量。“a bug”并不包含信息量。“perl crashes”或“HELP!!!”也是如此。这些都没有帮助。对问题进行简要描述是可以的。\n\
  \n你能使用 \"perlbug\" 来提交感谢信吗？\n\n是的，你可以通过使用 `-T` 选项或调用程序 `perlthanks` 来实现这一点。感谢信是好的。它能让人微笑。\n\
  \n在完成你的任务后，请准备好等待、被告知 bug 在于你的代码中，或者可能完全没有收到回复。维护 Perl 的志愿者都是忙碌的人，所以如果你的问题是你代码中明显的\
  \ bug、难以理解的问题或现有报告的重复，你可能不会收到个人回复。\n\n如果修复你的 bug 对你来说很重要，请监控邮件列表（邮件列表经过审核的，你的信息可能需要一段时间才能显示）以及\
  \ Perl 开发版本的提交日志（commit logs），用友善的话语或提供冰的饮品来鼓励维护者。（请务必对维护者友善。骚扰或辱骂他们可能会产生与你想要相反的效果。）\n\
  \n如果发布了新版本的 Perl 且你的 bug 仍然存在，请随时更新关于该 bug 的工单。\n\n## OPTIONS\n\n### `-a`\n发送报告的地址。默认是\
  \ 。\n\n### `-A`\n不向回复地址发送收到的 bug 确认。通常，只有当你是一个活跃监控 Perl 提交者以接收你信息的 Perl 维护者时，使用此选项才是合理的。\n\
  \n### `-b`\n报告的正文。如果不在命令行或带有 `-f` 的文件中包含，你将获得编辑编辑信息的机会。\n\n### `-C`\n不向管理员发送副本。\n\
  \n### `-c`\n向该地址发送报告副本。默认是本地 Perl 管理员的地址（在构建 Perl 时记录）。\n\n### `-d`\n数据模式（当你重定向或管道输出时的默认值）。这会打印你的配置数据，而不发送任何内容。你可以配合\
  \ `-v` 使用获取更完整的数据。\n\n### `-e`\n使用的编辑器。\n\n### `-f`\n包含报告正文的文件。用此可以快速发送准备好的信息。\n\
  \n### `-F`\n将结果输出到文件而不是作为邮件发送。这在没有直接连接互联网的机器上运行 `perlbug` 时特别有用。\n\n### `-h`\n打印选项的简要摘要。\n\
  \n### `-ok`\n向 Perl 提交者报告在该系统构建成功。强制 `-S` 和 `-C`。强制并提供 `-s` 和 `-b` 的值。只有在无法猜测回复地址时才会提示（用于\
  \ `make`）。尊重通过 `-r` 指定的回复地址。你可以配合 `-v` 使用获取更完整的数据。只有当该系统少于 60 天时才会报告。\n\n### `-okay`\n\
  与 `-ok` 相同，但它会报告较旧系统上的情况。\n\n### `-nok`\n报告在该系统构建失败。强制 `-C`。强制并提供 `-s` 的值，然后要求你编辑报告并说明出了什么。或者，可以使用\
  \ `-f` 提供准备好的报告。只有在无法猜测回复地址时才会提示（用于 `make`）。尊重通过 `-r` 指定的回复地址。你可以配合 `-v` 使用获取更完整的数据。只有当该系统少于\
  \ 60 天时才会报告。\n\n### `-nokay`\n与 `-nok` 相同，但它会报告较旧系统上的情况。\n\n### `-p`\n包含在报告中的一个或多个补丁或其他文本附件。多个文件之间用逗号隔开。\n\
  \n### `-r`\n你的回复地址。如果你不用此选项，程序将要求你确认其默认值。\n\n### `-S`\n不询问确认直接发送。\n\n### `-s`\n\
  信息中包含的主题。如果你没有在命令行上提供，将会提示你。\n\n### `-t`\n测试模式。目标地址默认是 。\n\n### `-T`\n发送感谢信而不是 bug\
  \ 报告。\n\n### `-v`\n在报告中包含详细配置数据。\n\n## AUTHORS\nKenneth Albanowski (<>), 随后由 *doc*\
