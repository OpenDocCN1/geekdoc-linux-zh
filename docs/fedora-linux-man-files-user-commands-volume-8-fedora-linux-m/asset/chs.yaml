  \ F. Randall (<>), Mike Guy (<>), Dominic Dunlop (<>), Hugo van der Sanden (<>)\n\
  \n## SEE ALSO\n(1), (1), (1), (1), (1), (1), (1)\n\n## BUGS\n未知（你猜什么被报告了？）\n\n##\
  \ NAME\nperlut - Perl 线程教程\n\n## DESCRIPTION\n本教程描述了线程（称为 *ithreads*）。在这种模型中，每个线程在自己的解释器中运行，线程间的任何共享都是显式的。\n\
  \n**NOTE**: 曾经有一种旧的线程模型叫做 5005，它使用 threads 类。这种旧模型已知有问题，已被废弃，并在 5.10 版本中移除。强烈建议尽快将任何\
  \ 5005 线程迁移到新模型。\n\n你可以通过运行 `perl -V` 并查看 `Platform` 部分查看你拥有哪种（或没有）线程方案。如果你有 `useithreads=define`，你有\
  \ ithreads；如果你有 `use5005threads=define`，你有 5005 threads。如果你两者都没有，说明你没有内置线程支持。如果你两者都有，那就麻烦了。\n\
  \nthreads 和 threads::shared 模块包含在 Perl 核心发行中。此外，它们作为独立的模块在 CPAN 上维护，因此你可以在那里检查任何更新。\n\
  \n## 到底什么是线程？\n线程是程序中单一执行点的控制流。\n\n听起来非常像进程，不是吗？嗯，线程是进程的组成部分。每个进程至少有一个线程，而到目前，每个运行\
  \ Perl 的进程只有一个线程。但从 5.8 开始，你可以创建额外的线程。我们将展示如何做、何时做以及为什么。\n\n## 线程模型\n构建线程程序的基本方法有三种。你选择哪种模型取决于你的程序做什么。\n\
  \n### Boss/Worker\n老板/工人模型通常有一个老板线程和一个或多个工人线程。老板线程收集或生成需要执行的任务，然后将这些任务分配给相应的工人线程。\n\
  \n这种模型在 GUI 和服务器程序中很常见，其中主线程等待事件并将该事件传递给相应的工人线程进行处理。一旦事件传递出去，老板线程就会返回等待下一个事件。\n\n\
  老板线程执行的工作相对较少。虽然任务执行速度不一定比任何其他方法快，但它通常具有更好的用户响应性能。\n\n### Work Crew\n\n\n\n\n\n\
  在工作组模型（work crew model）中，会创建多个线程，它们本质上对不同的数据块执行相同的操作。它紧密地对应了经典的并行处理和向量处理器，即一组大量的处理器对许多数据块执行完全相同的操作。\n\
  \n如果运行程序的系统会将多个线程分配到不同的处理器上，那么这种模型就特别有用。它在光线追踪或渲染引擎中也有用，单个线程可以传递中间结果以给用户提供视觉反馈。\n\
  \n## 流水线 (Pipeline)\n\n流水线模型将任务划分为一系列步骤，并将上一步的结果传递给处理下一个步骤的线程。每个线程对每份数据执行一个操作，并将结果传递给队列中的下一个线程。\n\
  \n如果你有多个处理器，这种模型最有意义，因为两个或多个线程将并行执行，尽管它在其他语境下也是合理的。它倾向于保持单个任务短小且简单，并允许流水线的某些部分阻塞（例如由于\
  \ I/O 或系统调用），而其他部分继续运行。如果你在不同的处理器上运行流水线的不同部分，你还可以利用每个处理器上的缓存。\n\n这种模型对于一种递归编程也非常方便，即不是让子程序调用自己，而是创建另一个线程。素数生成器和斐波那契生成器都能很好地映射到这种形式的流水线模型。（后面会介绍一个素数生成器的版本。）\n\
  \n## Perl 线程是哪种线程？\n\n如果你有其他线程实现的经验，你可能会发现事情并不如你预期的那样简单。在处理 Perl 线程时，参考“Perl 线程不是\
  \ X 线程”（Perl Threads Are Not X Threads）对于所有 X 值都非常重要。它们不是 POSIX 线程、DecThreads、Java\
  \ 的绿色线程或 Win32 线程。它们有相似之处，广泛的概念也是相同的，但如果你开始寻找实现细节，你将会感到失望或困惑。可能两者兼有。\n\n这并不是说 Perl\
  \ 线程与以前过的任何东西都完全不同。它们并非如此。Perl 的线程模型很大程度上取决于其他线程模型，特别是 POSIX。尽管 Perl 不是 C 语言，但 Perl\
  \ 线程不是 POSIX 线程。所以如果你发现自己正在寻找栈或线程优先级，那么是时候后退一步，思考你想做什么，以及 Perl 如何实现它。\n\n然而，重要的是，除非你操作系统的线程允许，否则\
  \ Perl 线程无法魔法般地完成某些工作。所以如果你的系统在 `sleep()` 时阻塞了整个进程，Perl 通常也会。\n\n`Perl 线程是不同的.`\n\
  \n## 线程安全模块 (Thread-Safe Modules)\n\n线程的引入显著改变了 Perl 的内部结构。对于编写 XS 代码或外部库模块的人来说，这产生了影响。然而，由于\
  \ Perl 数据默认不在线程间共享，Perl 模块很有可能是线程安全的，或者可以很容易地变为线程安全。未标记为线程安全的模块在用于生产代码之前，应该进行测试或代码审查。\n\
  \n并不是你可能使用的所有模块都是线程安全的，除非文档另有说明，否则你应该始终假设模块是不安全的。这包括作为核心部分分发的模块。线程是一个相对较新的特性，尽管如此，某些标准模块并不是线程安全的。\n\
  \n即使一个模块是线程安全的，也不意味着该模块已经针对线程的良好工作进行了优化。一个模块可能被重写以利用线程化 Perl 中的新功能，从而提高线程环境下的性能。\n\
  \n如果你出于某种原因在使用非线程安全的模块，你可以通过只在一个线程中使用它来保护自己。如果你需要多个线程访问此类模块，你可以使用信号量（semaphores）和大量的编程节律来控制对它的访问。信号量在\
  \ `semaphores` 中介绍。\n\n参见 `系统库的安全性`（Thread-Safety of System Libraries）。\n\n## 线程基础\
  \ (Thread Basics)\n\n`threads` 模块提供了编写线程程序所需的基本函数。在接下来的章节中，我们将涵盖基础知识，向你展示创建线程程序需要做什么。之后，我们将概述\
  \ threads 模块的一些让线程编程变得更简单的特性。\n\n### 基础线程支持\n\n线程支持是一个 Perl 编译选项。它是你在本地构建 Perl 时开启或关闭的，而不是在编译程序时。如果你的\
  \ Perl 编译时没有启用线程支持，那么任何使用线程的尝试都会失败。\n\n你的程序可以使用 `Config` 模块来检查线程是否启用。如果你的程序没有线程无法运行，你可以说类似：\n\
  \n```perl\nuse Config; $Config{useithreads} or die('需要重新编译 Perl 以运行此程序。');\n```\n\
  \n一个使用可能线程模块的可能线程化程序可能有如下代码：\n\n```perl\nuse Config; use MyMod; BEGIN { if ($Config{useithreads})\
  \ { # 我们有线程 require MyMod_threaded; import MyMod_threaded; } else { require MyMod_unthreaded;\
  \ import MyMod_unthreaded; } } }\n```\n\n由于在有线程和无线程的情况下运行的代码通常非常相似，最好将线程特定的代码隔离在它自己的模块中。在我们上面的示例中，`MyMod_threaded`\
  \ 就是这样的存在，并且只有在我们运行在线程化 Perl 上时才会导入它。\n\n### 关于示例的说明\n\n在实际情况下，应该注意在程序退出之前所有线程都已执行完毕。为了简单起见，这些示例**没有**采取这样做。原样运行这些示例将产生错误信息，通常是因为程序退出时仍有线程在运行。你不应该被这种情况。\n\
  \n### 创建线程 (Creating Threads)\n\n`threads` 模块提供了创建新线程所需的工具。像任何其他模块一样，你需要告诉 Perl\
  \ 你想使用它；`use threads;` 会导入创建基础线程所需的所有部分。\n\n创建线程最简单直接的方法是使用 `create()`：\n\n```perl\n\
  use threads; my $thr = threads->create(\\&sub1); sub sub1 { print(\"在线程中\"); }\n\
  ```\n\n`create()` 方法接收一个子程序的引用并创建一个在引用的子程序中开始执行的新线程。控制权随后传递给子程序和调用者。\n\n如果你需要，程序可以在线程启动时将参数传递给子程序。只需将参数列表作为\
  \ `threads->create()` 调用的一部分即可，如下：\n\n```perl\nuse threads; my $Param3 = 'foo';\
  \ my $thr1 = threads->create(\\&sub1, 'Param 1', 'Param 2', $Param3); my @ParamList\
  \ = (42, 'Hello', 3.14); my $thr2 = threads->create(\\&sub1, @ParamList); my $thr3\
  \ = threads->create(\\&sub1, qw(Param1 Param2 Param3)); sub sub1 { my @Inboundaters\
  \ = @_; print(\"在线程中\"); print('收到参数 >',join('<>',@Inboundaters), \"<\"); }\n```\n\
  \n最后一个示例说明了线程的另一个特性。你可以使用相同的子程序派生多个线程。每个线程执行相同的子程序，但在独立的线程和可能的独立的参数环境中执行。\n\n`new()`\
  \ 是 `create()` 的同义词。\n\n### 等待线程退出 (Waiting For A Thread To Exit)\n\n由于线程也是子程序，它们可以返回值。等待线程退出并提取它可能返回的值，你可以使用\
  \ `join()` 方法：\n\n```perl\nuse threads; my ($thr) = threads->create(\\&sub1); my\
  \ @ReturnData = $thr->join(); print('线程返回：', join(', ', @ReturnData), \"\\n\");\
  \ sub sub1 { return ('五十六', 'foo', 2); }\n```\n\n\n\n\n在上面的示例中，`join()` 方法在线程结束时立即返回。除了等待线程完成并收集线程可能返回的任何外，`join()`\
  \ 还会对该线程执行任何必要的操作系统清理工作。这种清理可能非常重要，特别是对于创建大量线程的长时间运行程序。如果你不需要返回值，也不想等待线程完成，你应该调用\
  \ `detach()` 方法，如接文所述。\n\n注意：在上面的示例中，线程返回一个列表，因此要求线程创建的调用必须在列表上下文中进行（即 `my ($thr)`）。关于线程上下文和返回值的更多信息，请参阅\
  \ `threads` 节中的 `$thr->*join()` 以及 `threads` 节中的 `THREAD CONTEXT`。\n\n### 忽略线程\n\
  \n`join()` 做了三件事：等待线程退出、对其进行清理，并返回线程可能产生的任何数据。但如果你对线程的返回值不感兴趣，而且真的不在乎线程何时完成呢？你只是想让线程在完成后被清理掉就行了。\n\
  \n在这种情况下，你使用 `detach()` 方法。一旦线程被分离（detached），它将一直运行直到结束；然后 Perl 将自动对其进行清理。\n\n```\n\
  use threads; my $thr = threads->create(\\&sub1); # 创建线程\n$thr->detach(); # 现在我们正式地不再关心了\n\
  sleep(15); # 让线程运行一段时间\nsub sub1 { my $count = 0; while (1) { $count++; print(\"\
  \\$count is $count\\n\"); (1); } }\n```\n\n一旦线程被分离，它可能就无法被合并（joined），并且它可能产生的任何返回数据（如果它已完成并在等待合并）都会丢失。`detach()`\
  \ 也可以作为类方法调用，允许线程自己分离：\n\n```\nuse threads; my $thr = threads->create(\\&sub1);\
  \ sub sub1 { threads->detach(); # 执行更多工作 }\n```\n\n### 进程和线程的终止\n\n使用线程时，必须小心确保它们都有机会运行完成，假设这是你所希望的。\n\
  \n终止进程的操作将终止*所有*运行中的线程。`die()` 和 `exit()` 具有这种属性，而且当主线程退出时，perl 会执行退出，可能是隐式地通过运行代码末尾的，即使这不是你所愿的。\n\
  \n作为这种情况的示例，这段代码打印了消息 `Perl exited with active threads: 2 running and unjoined`：\n\
  \n```\nuse threads; my $thr1 = threads->new(\\&thrsub, \"test1\"); my $thr2 = threads->new(\\\
  &thrsub, \"test2\"); sub thrsub { my ($ssage) = @_; sleep 1; print \"thread $ssage\\\
  n\"; }\n```\n\n但当末尾添加以下行时：\n\n```\n$thr1->join(); $thr2->join();\n```\n\n它会打印两行输出，这是一个可能更有用的结果。\n\
  \n## 线程与数据\n\n现在我们已经介绍了线程的基础知识，是时候讨论下一个主题了：数据。线程为数据访问引入了一些复杂性，非线程程序完全不需要担心这些。\n\n\
  ### 共享数据与非共享数据\n\nPerl `ithreads` 与旧的 5.005 风格线程，或者说与大多数其他线程系统的最大的区别在于，默认情况下没有数据是共享。当创建一个新的\
  \ Perl 线程时，与当前线程相关的所有数据都会复制到新线程，并随后成为该新线程的私有！这感觉类似于 Unix 进程 fork 时发生的情况，不同的是在这种情况下，数据只是被复制到同一进程内内存的不同部分，而不是发生了真实的\
  \ fork。\n\n然而，为了利用线程，通常希望线程之间至少共享某些数据。这是通过 `threads::shared` 模块和 `:shared` 属性实现的：\n\
  \n```\nuse threads; use threads::shared; my $foo :shared = 1; my $bar = 1; threads->create(sub\
  \ { $foo++; $bar++; })->join(); print(\"$foo\\n\"); # 因为 $foo 是共享的，所以打印 2 print(\"\
  $bar\\n\"); # 因为 $bar 不是共享的，所以打印 1\n```\n\n在共享数组的情况下，数组的所有元素都是共享的；对于共享哈希（hash），所有的键和值都是共享的。这对赋值给共享数组和哈希元素的内容产生了限制：只允许简单值或对共享变量的引用——这样做是为了防止私有变量意外变成共享。糟糕的赋值会导致线程死亡。例如：\n\
  \n```\nuse threads; use threads::shared; my $var = 1; my $svar :shared = 2; my %hash\
  \ :shared; ... create so threads ... $hash{a} = 1; # 所有线程都能看到 exists($hash{a}) #\
  \ 以及 $hash{a} == 1 $hash{a} = $var; # 好的 - 按值拷贝：效果与之前的 $hash{a} = $svar; # 好的 -\
  \ 按值拷贝：效果与之前的 $hash{a} = \\$svar; # 好的 - 对共享变量的引用 $hash{a} = \\$var; # 这会导致死亡 delete($hash{a});\
  \ // 好的 - 所有线程都会看到 !exists($hash{a})\n```\n\n注意，共享变量保证了如果两个或多个线程尝试修改它，内部状态不会被损坏（前提是操作是受保护的）。但是，在此之后没有更多保证，正如下一节所示。\n\
  \n### 线程陷阱：竞态条件\n\n虽然线程带来了一套实用的工具，但也带来了一些陷阱。一个陷阱就是竞态条件：\n\n```\nuse threads; use\
  \ threads::shared; my $x :shared = 1; my $thr1 = threads->create(\\&sub1); my $thr2\
  \ = threads->create(\\&sub2); $thr1->join(); $thr2->join(); print(\"$x\\n\"); sub\
  \ sub1 { my $foo = $x; $x = $foo + 1; } sub sub2 { my $bar = $x; $x = $bar + 1;\
  \ }\n```\n\n你认为 `$x` 会是多少？遗憾的答案是*取决于情况*。`sub1()` 和 `sub2()` 都访问 `$x`，一次读取，一次写入。取决于线程实现的调度算法到月球相位，`x`\
  \ 可能是 2 或 3。\n\n竞态条件是由对共享数据的非同步访问引起的。如果没有显式的同步，无法确定在访问数据和更新数据之间没有发生任何 own。即使是这段简单的代码也有出错的可能性：\n\
  \n```\nuse threads; my $x :shared = 2; my $y :shared; my $z :shared; my $thr1 =\
  \ threads->create(sub { $y = $x; $x = $y + 1; }); my $thr2 = threads->create(sub\
  \ { $z = $x; $x = $z + 1; }); $thr1->join(); $thr2->join();\n```\n\n两个线程都访问 `$x`。每个线程都可能在任何一点被中断，或者以任何顺序执行。在最后，`$x`\
  \ 可能是 3 或 4，且 `$y` 和 `$z` 都可能是 2 或 3。\n\n即使是 `$x += 5` 或 `$x++` 也不能保证原子性。每当你的程序访问可以其他线程访问的数据或资源时，你必须采取措施协调访问，否则会导致数据不一致和竞态条件。注意，Perl\
  \ 会保护其内部免受你的竞态条件的影响，但它不会保护你。\n\n## 同步与控制\n\nPerl 提供了多种机制来协调线程与其数据之间的交互，以避免竞态条件等。其中某些设计是为了类似于\
  \ `pthreads` 等线程库中常用的技术；另一些是 Perl 特有的。通常，标准技术非常笨拙且难以实现（例如条件等待）。尽可能使用 Perl 技术（如队列）更容易，它们消除了很多困难的工作。\n\
  \n### 控制访问：lock()\n\n`lock()` 函数获取一个共享变量并对其加锁。在持有锁的线程解锁之前，任何其他线程不能锁定该变量。当锁定线程退出包含\
  \ `lock()` 调用的块时，会自动解锁。使用 `lock()` 非常简单：这个示例有多个线程并行执行一些计算，并偶尔更新运行总和：\n\n\n\n\n\n\
  ```\nuse threads; use threads::shared; my $total :shared = 0; sub calc { while (1)\
  \ { my $result; # (... do so calculations and set $result ...) { lock($total); #\
  \ Block until we obtain the lock $total += $result; } # Lock implicitly released\
  \ at end of scope last if $result == 0; } } my $thr1 = threads->create(\\&calc);\
  \ my $thr2 = threads->create(\\&calc); my $thr3 = threads->create(\\&calc); $thr1->join();\
  \ $thr2->join(); $thr3->join(); print(\"total=$total\\n\"); }\n```\n\n`lock()` 会阻塞线程，直到被锁的变量可用为止。当\
  \ `lock()` 返回时，你的线程可以确定在包含该锁的块退出之前，其他线程都无法锁定该变量。\n\n需要注意的是，锁并不会阻止对相关变量的访问，只会阻止锁定的尝试。这符合\
  \ Perl 长期以来的“礼貌编程”传统，以及 `flock()` 为提供的建议性文件锁定。\n\n你可以锁定数组和哈希表，也可以锁定标量。然而，锁定数组不会阻塞后续对数组元素的锁定，只会阻塞对数组本身的锁定尝试。\n\
  \n锁是递归的，因此线程多次锁定同一个变量是允许的。锁一直持续到该变量的最外层 `lock()` 离开作用域为止。例如：\n\n```\nmy $x :shared;\
  \ doit(); sub doit { { { lock($x); # Wait for lock lock($x); # NOOP - we already\
  \ have the lock { lock($x); # NOOP { lock($x); # NOOP lockit_so_more(); } } } #\
  \ *** Implicit unlock here *** } } sub lockit_so_more { lock($x); # NOOP } # Nothing\
  \ happens here\n```\n\n注意，没有 `unlock()` 函数——解锁变量的唯一方法是让它离开作用域。\n\n锁既可以保护被锁变量中包含的数据，也可以用来保护其他内容，例如一段代码。在后一种情况下，相关变量并不持有任何有用数据，仅为了被锁的目的而存在。在这方面，该变量的行为类似于传统线程库中的文本和基本信号量。\n\
  \n### 线程陷阱：死锁\n\n锁是同步数据访问的方便工具，正确使用它们是安全共享数据的关键。不幸的是，锁并非没有危险，特别是当涉及到多个锁时。考虑以下代码：\n\
  \n```\nuse threads; my $x :shared = 4; my $y :shared = 'foo'; my $thr1 = threads->create(sub\
  \ { lock($x); sleep(20); lock($y); }); my $thr2 = threads->create(sub { lock($y);\
  \ sleep(20); lock($x); });\n```\n\n这个程序可能会一直挂起，直到你杀死它为止。唯一不会挂起的方法是两个线程中的其中一个先获取了两个锁。一个保证会挂起的版本会更复杂一些，但原理是相同的。\n\
  \n第一个线程将获取 `$x` 的锁，然后在经过一段暂停后（在此期间，第二个线程可能已经有时间执行了某些操作），尝试获取 `$y` 的锁。与此同时，第二个线程获取\
  \ `$y` 的锁，稍后尝试获取 `$x` 的锁。两个线程的第二次锁定尝试都将被阻塞，各自等待对方释放锁。\n\n这种状态被称为死锁，每当两个或多个线程尝试获取它们所拥有的资源的锁时，就会发生。每个线程都会阻塞，等待另一个线程释放资源的锁。然而，这种情况永远不会发生，因为持有资源的线程本身正在等待锁被释放。\n\
  \n处理这类问题有多种方法。最好的方法始终让所有线程按照完全相同的顺序获取锁。例如，如果你锁定变量 `$x`、`$y` 和 `$z`，始终在锁定 `$y` 之前锁定\
  \ `$x`，在锁定 `$z` 之前锁定 `$y`。最好缩短持有锁的时间以最小化死锁风险。\n\n下面描述的其他同步原语可能会遇到类似的问题。\n\n### 队列：数据传递\n\
  \n队列是一种特殊的线程安全对象，允许你从一端放入数据并从另一端取出数据，而无需担心同步问题。它们非常直观，看起来如下：\n\n```\nuse threads;\
  \ use Thread::Queue; my $DataQueue = Thread::Queue->new(); my $thr = threads->create(sub\
  \ { while (my $DataElent = $DataQueue->dequeue()) { print(\"Popped $DataElent off\
  \ the queue\\n\"); } }); $DataQueue->enqueue(12); $DataQueue->enqueue(\"A\", \"\
  B\", \"C\"); sleep(10); $DataQueue->enqueue(undef); $thr->join();\n```\n\n你通过 `Thread::Queue->new()`\
  \ 创建队列。然后你可以使用 `enqueue()` 在末尾添加标量列表，并使用 `dequeue()` 从头部弹出标量。队列没有固定大小，可以根据需要增长以容纳推入的所有内容。\n\
  \n如果队列为空，`dequeue()` 会阻塞直到另一个线程推入内容。这使得队列成为事件循环和其他线程间通信的理想选择。\n\n### 信号量：同步数据访问\n\
  \n信号量是一种通用的锁定机制。在最基础的形式下，它们的行为非常像可锁标量，不同在于它们不能持有数据，并且必须显式解锁。在高级形式下，它们充当计数器，允许多个线程同时进入。\n\
  \n#### 基础信号量\n\n信号量有两个方法：`down()` 和 `up()`：`down()` 减少计数，而 `up()` 增加计数。如果 `down()`\
  \ 尝试将计数减为负，它将阻塞直到计数足够大。这个程序提供了一个快速演示：\n\n```\nuse threads; use Thread::Semaphore;\
  \ my $semaphore = Thread::Semaphore->new(); my $GlobalVariable :shared = 0; $thr1\
  \ = threads->create(\\&sample_sub); $thr2 = threads->create(\\&sample_sub); $thr3\
  \ = threads->create(\\&sample_sub); sub sample_sub { my $Nuer = shift(@_); my $TryCount\
  \ = 10; while ($TryCount--) { $semaphore->down(); my $LocalCopy = $GlobalVariable;\
  \ print(\"$TryCount left for $GlobalVariable\\n\"); $GlobalVariable++;; $semaphore->up();\
  \ } } $thr1->join(); $thr2->join(); $thr3->join();\n```\n\n#### 高级信号量\n\n默认情况下，信号量的行为像锁，一次只一个线程\
  \ `down()` 它。然而，信号量还有其他用途。每个信号量都关联有一个计数器。默认情况下，信号量创建时计数设置为 1，`down()` 将计数减 1，而 `up()`\
  \ 增加 1。然而，我们可以仅通过传递不同的值来覆盖任何或所有默认值：\n\n```\nuse threads; use Thread::Semaphore;\
  \ my $semaphore = Thread::Semaphore->(5); my $thr1 = threads->create(\\&sub1); my\
  \ $thr2 = threads->create(\\&sub1); sub sub1 { $semaphore->(5); # 减少计数五次 # 在此处执行操作\
  \ $semaphore->(5); # 增加计数五次 } $thr1->detach(); $thr2->detach();\n```\n\n当然，问题是，为什么要这样做？为什么要创建一个初始计数不是\
  \ 1 的信号量，或者为什么要减少或增加超过 1 个？答案是资源可用性。许多你想要管理访问的资源可以安全地被多个线程同时使用。\n\n例如，让我们一个 GUI\
  \ 驱动的程序。它有一个信号量用于同步对显示器的访问，因此一次只有一个线程在绘图。这很方便，但当然，你不希望任何线程在设置妥当之前开始绘图。在这种情况下，你可以创建一个计数设置为\
  \ 0 的信号量，并在准备好绘图时对其调用 `up()`。\n\n\n\n\n计数大于 1 的信号量也用于建立配额。例如，假设你有一数量可以同时进行 I/O 操作的线程。你不希望所有线程同时进行读取或写入，因为这可能会导致你的\
  \ I/O 通道拥塞，或者耗尽进程的文件句柄配额。你可以使用初始化为任何时刻希望的并发 I/O 请求（或打开的文件）数量的信号量，并让你的线程静地自行阻塞和取消阻塞。\n\
  \n在线程需要一次检出或返回多个资源的情况下，较大的增量或减量操作非常有用。\n\n### 等待条件\n\n`cond_wait()` 和 `cond_signal()`\
  \ 函数可以与锁结合使用，通知协作线程资源已可用。它们在用法上与 `pthreads` 中的函数非常相似。然而，对于大多数用途，队列的使用更简单、更直观。更多细节请参见\
  \ `threads::shared`。\n\n### 放弃控制\n\n在某些情况下，你可能会发现让线程显式地放弃 CPU 给另一个线程是有用的。你可能正在进行某些处理器密集型操作，并希望确保用户界面线程被频繁调用。无论如何，在某些情况下你可能希望一个线程放弃处理器。\n\
  \nPerl 的线程包提供了实现此点的 `yield()` 函数。`yield()` 非常简单直观，其工作方式如下：\n\n```\nuse threads;\
  \ sub loop { my $thread = shift; my $foo = 50; while($foo--) { print(\"In thread\
  \ $thread\\n\"); } threads->yield(); $foo = 50; while($foo--) { print(\"In thread\
  \ $thread\\n\"); } } my $thr1 = threads->create(\\&loop, 'first'); my $thr2 = threads->create(\\\
  &loop, 'second'); my $thr3 = threads->create(\\&loop, 'third');\n```\n\n重要的是，`yield()`\
  \ 只是放弃 CPU 的一个提示，实际发生什么取决于你的硬件、操作系统和线程库。在许多操作系统上，`yield()` 是一个空操作（no-op）。因此，需要注意的是，人们不应该围绕\
  \ `yield()` 调用来构建线程调度。它在你的平台上可能有效，但在另一个平台上可能就不起作用。\n\n## 通用线程实用例程\n\n我们已经涵盖了 Perl\
  \ 线程包的核心部分，有了这些工具，你应该已经走在了编写线程代码和包的道路。还有一些实用的小组件它们没有真正适合任何其他地方。\n\n### 我在哪个线程中？\n\
  \n`threads->self()` 类方法为程序提供了一种获取代表当前所在线程对象的方法。你可以像使用线程创建返回的对象一样使用这个对象。\n\n### 线程\
  \ ID\n\n`tid()` 是一个线程对象方法，返回该对象所代表线程的 ID。线程 ID 是整数，程序中的主线程为 0。目前，Perl 为程序中创建的每个线程分配一个唯一的\
  \ TID，为创建的第一个线程分配 TID 1，并且每创建一个新线程 TID 增加 1。当作为类方法使用时，线程可以使用 `threads->tid()` 来获取它自己的\
  \ TID。\n\n### 这些线程是同一个吗？\n\n`equal()` 方法接受两个线程对象，如果对象代表同一个线程，则返回真，否则返回假。\n\n线程对象还重载了\
  \ `==` 比较运算符，因此你可以像处理普通对象一样对它们进行比较。\n\n### 哪些线程正在运行？\n\n`threads->list()` 返回一个线程对象列表，对应每个正在运行且未分离（detached）的线程。这对于许多事情很有用，包括在程序结束时进行清理（当然是从主\
  \ Perl 线程执行）：\n\n```\n# Loop through all the threads foreach my $thr (threads->list())\
  \ { $thr->join(); }\n```\n\n如果在主 Perl 线程结束时某些线程尚未完成运行，Perl 将发出警告并退出（die），因为 Perl\
  \ 在其他线程运行时无法进行自身清理。\n\n注意：主 Perl 线程（线程 0）处于分离状态，因此不会出现在 `threads->list()` 返回的列表中。\n\
  \n## 完整示例\n\n还感到困惑吗？现在是用一个示例程序来展示我们涵盖的内容了。这个程序使用线程寻找 pri nuers。\n\n```\n1 #!/usr/bin/perl\
  \ 2 # pri-pthread, courtesy of Tom Christiansen 3 4 use strict; 5 use warnings;\
  \ 6 7 use threads; 8 use Thread::Queue; 9 10 sub check_num { 11 my ($upstream, $cur_pri)\
  \ = @_; 12 my $kid; 13 my $downstream = Thread::Queue->new(); 14 while (my $num\
  \ = $upstream->dequeue()) { 15 next unless ($num % $cur_pri); 16 if ($kid) { 17\
  \ $downstream->enqueue($num); 18 } else { 19 print(\"Found pri: $num\\n\"); 20 $kid\
  \ = threads->create(\\&check_num, $downstream, $num); 21 if (! $kid) { 22 warn(\"\
  Sorry. Ran out of threads.\\n\"); 23 last; 24 } 25 } 26 } 27 if ($kid) { 28 $downstream->enqueue(undef);\
  \ 29 $kid->join(); 30 } 31 } 32 my $stream = Thread::Queue->new(); 33 3..1000; 34\
  \ check_num($stream, 2);\n```\n\n\n\n这是实现线程最简单的方法，也是大多数操作系统启动线程的方式。它的缺点是，由于操作系统对线程一无所知，如果其中一个线程阻塞，所有线程都会阻塞。典型的阻塞活动包括大多数系统调用、大多数\
  \ I/O 操作以及如 `sleep()` 等操作。\n\n内核线程是线程演化的下一步。操作系统感知内核线程，并对它们进行特殊处理。内核线程与用户态线程之间的主要区别在于阻塞。使用内核线程时，导致单个线程的操作不会阻塞其他线程。而在用户态线程中并非如此，内核会在进程级别上进行阻塞，而不是线程级别。\n\
  \n这是一个巨大的进步，可以为多线程程序带来相对于非多线程程序显著的性能提升。例如，执行 I/O 操作时阻塞的线程不会阻塞正在执行其他任务的线程。尽管如此，无论系统有多少个\
  \ CPU，每个进程仍然同时只有一个线程在运行。\n\n由于内核线程可以在任何时候中断线程，它们将揭示你在程序中可能做的某些隐式锁假设。例如，诸如 `$x =\
  \ $x + 2` 这样简单的操作，如果 `$x` 对其他线程可见，在内核线程下其行为可能是不可预测的，因为在从右侧获取值到存储新值之间，另一个线程可能已经更改了\
  \ `$x`。\n\n多处理器内核线程是线程支持的最后一步。在具有多个 CPU 的机器上，多处理器内核线程允许操作系统调度两个多个线程在不同的 CPU 上同时运行。\n\
  \n这可以为你的多线程程序带来巨大的性能提升，因为同一时刻会有多个线程执行。然而，作为权衡，任何在基础内核线程可能未显示的那些棘手的同步问题都会剧烈出现。\n\n\
  除了操作系统参与线程的级别不同外，不同的操作系统（以及特定操作系统的不同线程实现）以不同的方式为线程分配 CPU 周期。\n\n协作多任务系统在发生两种情况之一时会让运行线程放弃控制。如果线程调用了让函数，它会放弃控制；如果线程执行了会导致阻塞的操作（例如执行\
  \ I/O），它也会放弃控制。在协作多任务实现中，一个线程如果愿意，可以饿死所有其他线程的 CPU。\n\n抢占式多任务系统会定期中断线程，由系统决定下一个运行哪个线程。在抢占式多任务系统中，一个线程通常不会垄断\
  \ CPU。\n\n在某些系统中，可以同时运行协作线程和抢占式线程。（例如，以实时优先级运行的线程通常表现为协作式，而以普通优先级运行的线程则表现为抢占式。）\n\
  \n大多数现代操作系统现在支持抢占式多任务。\n\n## 性能考虑\n\n在比较 Perl 的 `ithreads`与其他线程模型时，需要记住的主要点是：对于创建的每个新线程，必须获取父线程所有变量和数据的完整拷贝。因此，线程创建是非常昂贵的，无论从内存使用还是创建花费的时间来看。减少这些成本的理想方法是拥有数量较少的长寿线程，并且它们都在较早阶段创建（在基础线程积累过多数据之前）。当然，这并不总是可能的，因此必须做出妥协。然而，在线程创建后，它的性能和额外的内存使用与普通代码应该差异不大。\n\
  \n另外注意，在当前的实现下，共享变量使用的内存稍多，速度也稍慢。\n\n## 进程级变更\n\n注意，虽然线程本身是独立的执行线程，且除非显式共享，否则 Perl\
  \ 数据是线程私有的，但线程可以影响进程范围的状态，从而影响所有线程。\n\n最常见的例子是使用 `chdir()` 更改当前工作目录。一个线程调用 `chdir()`，所有线程的工作目录都会发生改变。\n\
  \n更剧烈的进程范围变更例子是 `chroot()`：所有线程的根目录都会发生改变，且没有线程可以撤销它（与 `chdir()` 相）。\n\n进程范围变更的进一步示例还包括\
  \ `umask()` 以及更改 uid 和 gid。\n\n在考虑混合使用 `fork()` 和线程吗？请躺下等这种感觉过去。请注意 `fork()` 的语义在不同平台之间是不同的。例如，某些\
  \ Unix 系统会将所有当前线程拷贝到子进程中，而另一些则只复制调用 `fork()` 的线程。你已经收到警告了！\n\n同样，混合信号和线程可能会出现问题。实现取决于平台，即使是\
  \ POSIX 语义也可能不是你预期的（而且 Perl 甚至没有给你提供完整的 POSIX API）。例如，没有办法保证发送到多线程 Perl 应用程序的信号会被任何特定线程拦截。（不过，最近添加的功能确实提供了在线程之间发送信号的能力。更多细节请参阅\
  \ threads 中的“THREAD SIGNALLING”。）\n\n## 系统库的线程安全\n\n各种库调用是否是线程安全的， Perl 的控制之外的。经常遭受非线程安全的调用包括：`localti()`、`gmti()`、获取用户、组和网络信息的函数（如\
  \ `getgrent()`、`gethostent()`、`getnetent()` 等）、`readdir()`、`rand()` 和 `srand()`。通常，依赖于全局外部状态的调用都是。\n\
  \n如果编译 Perl 的系统具有此类调用的线程安全变体，它们将被使用。在此之外，Perl 取决于调用的线程安全性或不安全性。请咨询你的 C 文档。\n\n在某些平台上，如果缓冲区太小，线程安全的库接口可能会失败（例如，用户数据库可能很大，而重入接口可能需要携带快照）。Perl\
  \ 会从小缓冲区开始，不断重试并增长结果。如果这种无限制增长对安全或内存消耗不利，你可以重新定义 `PERL_REENTANT_MAXSIZE` 为允许的最大字节数。\n\
  \n### 结论\n\n一个完整的线程教程可以写一本书（事实上也有），但通过我们在这里介绍的内容，你已经在成为多线程 Perl 专家道路上了。\n\n## 另见\n\
  \n[threads 的 POD 文档](https://example.org/threads)\n\nCPAN 上的最新版本\n\n[threads::shared\
  \ 的 POD 文档](https://example.org/threads%3A%3shared)\n\nCPAN 上的最新版本\n\nPerl 线程邮件列表\n\
