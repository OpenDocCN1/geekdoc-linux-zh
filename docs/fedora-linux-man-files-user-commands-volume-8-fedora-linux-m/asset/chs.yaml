  \n## 作者\n\nDan Sugalski <<gt>\n\n由 Arthur Bergman 稍微修改以适应新的线程模型/模块。\n\n由 Jo.rg Walter\
  \ <<gt> 稍作调整，使 Perl 代码的线程安全描述更加简洁。\n\n由 Elizabeth Mattijsen <<gt> 稍微调整顺序，减少了对 `yield()`\
  \ 的强调。\n\n#### 版权\n\n本文最初版本发表于《The Perl Journal》10 期，版权所有 1998 The Perl Journal。经\
  \ Jon Orwant 和 The Perl Journal 许可提供。本文档可以与 Perl 本身相同的条款分发。\n\n***\n\n# PERLTIE\n\
  \n#### way (NAME)\n\nperltie - 如何在简单变量中隐藏对象类\n\n#### 摘要 (SYNOPSIS)\n\n`tie VARIABLE,\
  \ CLASSNAME, LIST $object = tied VARIABLE untie VARIABLE`\n\n#### 描述 (DESCRIPTION)\n\
  \n在 Perl 5.0 版本发布之前，程序员可以使用 `dbmopen()` 将标准 Unix (3x) 格式的磁盘数据库神奇地连接到程序中的 `%HASH`。然而，他们的\
  \ Perl 要么是用某个特定的 dbm 库编译的，要么是用另一个，两者兼不可，你无法将这种机制扩展到其他包或变量类型。\n\n现在你可以做到了。\n\n`tie()`\
  \ 函数将变量绑定到一个类（包），该类将为该变量提供访问方法的实现。一旦完成这一魔法操作，访问绑定的变量会自动触发相应类中的方法调用。类的复杂性隐藏在魔法方法调用之后。方法名使用全大写，这是\
  \ Perl 使用的一种约定，用于表示它们是隐式调用而非显式调用的——就像 `BEGIN()` 和 `END()` 函数一样。\n\n在 `tie()` 调用中，`VARIABLE`\
  \ 是要施魔法的变量名。`CLASSNAME` 是实现正确类型对象的类名。`LIST` 中的任何额外参数将传递给该类相应的构造方法——即 `TIESCALAR()`、`TIEARRAY()`、`TIEHASH()`\
  \ 或 `TIEHANDLE()`。（通常这些参数类似于传递给 C 语言 `dbminit()` 函数的参数）。由 ``new'' 方法返回的对象也会由 `tie()`\
  \ 函数返回，如果你想访问 `CLASSNAME` 中的其他方法，这将会非常有用。（你实际上不需要返回一个正确“类型”的引用（例如 HASH 或 `CLASSNAME`），只要它是一个经过正确加封（blessed）的对象即可。）你还可以使用\
  \ `tied()` 函数获取底层对象的引用。\n\n与 `dbmopen()` 不同，`tie()` 函数不会为你 `use` 或 `require` 模块——你需要自己显式地这样做。\n\
  \n### 绑定标量 (Tying Scalars)\n\n实现绑定标量的类应该定义以下方法：TIESCALAR、FETCH、STORE，以及可能的 UNTIE\
  \ 和/或 DESTROY。\n\n让我们逐一查看，以一个标量绑定类为例，允许用户执行如下操作：\n\n`tie $his_speed, 'Nice', getppid();\
  \ tie $my_speed, 'Nice', $$;`\n\n现在，每当其中一个变量被访问时，其当前的系统优先级就会被检索并返回。如果这些变量被设置，进程的优先级就会发生改变！\n\
  \n我们将使用 Jarkko Hietaniemi <> 的 `BSD::Resource` 类（未包含）来访问系统中的 PRIO_PROCESS、PRIO_MIN\
  \ 和 PRIO_MAX 常量，以及 `getpriority()` 和 `setpriority()` 系统调用。这里是类的开头。\n\n```\npackage\
  \ Nice; use Carp; use BSD::Resource; use strict; $Nice::DEBUG = 0 unless defined\
  \ $Nice::DEBUG; own``````\n\nTIESCALAR 类名, LIST\n\n这是该类的构造方法。它预期返回一个新创建的标量（可能是匿名的）加封引用。\n\
  \n```perl\nsub TIESCALAR {\n    my ($class, $var, @list) = @_;\n    my $pid = $list[0]\
  \ || $$;\n    return bless($pid, $class);\n}\n```\n\n```perl\nsub FETCH {\n    my\
  \ ($class, $var) = @_;\n    my $nicety = getpriority(PRIO_PROCESS, $$);\n    if\
  \ ($!) {\n        confess \"getpriority failed: $!\";\n    }\n    return $nicety;\n\
  }\n```\n\n*(注：由于原文中方法的代码实现不完整，我已根据文档上下文格式化了可用逻辑。)*\n\n\n\n\n\n实现绑定普通数组（tied ordinary\
  \ array）的类应该定义以下方法：`TIEARRAY`、`FETCH`、`STORE`、`FETCHSIZE`、`STORESIZE`、`CLEAR` 以及可能的\
  \ `UNTIE` 和/或 `DESTROY`。\n\n`FETCHSIZE` 和 `STORESIZE` 用于提供 `$array` 以及相应的 `scalar(@array)`\
  \ 访问。\n\n如果要在 perl 操作符通过对应的（但小写的）`na` 在绑定数组上操作，则需要 `POP`、`PUSH`、`SHIFT`、`UNSHIFT`、`SPLICE`、`DELETE`\
  \ 和 `EXISTS`。可以使用 `Tie::Array` 类作为基类，根据上述基本方法实现前五个方法。`Tie::Array` 中 `DELETE` 和 `EXISTS`\
  \ 的默认实现仅为 `croak`（报错）。\n\n此外，当 perl 原本会在真实数组中进行预扩展分配时，会调用 `EXTEND`。\n\n在本次讨论中，我们将实现一个在创建时元素大小为固定的数组。如果你尝试创建一个比固定大小更大的元素，将抛出异常。例如：\n\
  \n```\nuse FixedElem_Array; tie @array, 'FixedElem_Array', 3; $array[0] = 'cat';\
  \ # ok. $array[1] = 'dogs'; # exception, length('dogs') > 3\\.\n```\n\n该类的前导代码如下：\n\
  \n```\npackage FixedElem_Array; use Carp; use strict;\n```\n\n#### TIEARRAY, LIST\n\
  \n这是该类的构造函数。它预期返回一个已化的引用，通过该引用可以访问新数组（可能是匿名 `ARRAY` 引用）。\n\n在我们的示例中，为了向你展示你并不真的返回一个\
  \ `ARRAY` 引用，我们选择了一个 `HASH` 引用来表示我们的对象。`HASH` 作为通用记录类型非常好：`{ELEMSIZE}` 字段将存储允许的最大元素大小，`{ARRAY}`\
  \ 字段将持有真实的 `ARRAY` 引用。如果类外部的人尝试解引用返回的对象（无疑认为它是 `ARRAY` 引用），程序将会崩溃。这正说明你应该尊重对象的私有性。\n\
  \n```\nsub TIEARRAY { my $class = shift; my $elemsize = shift; if ( @_ || $elemsize\
  \ =~ /\\D/ ) { croak \"usage: tie ARRAY, '\" . __PACKAGE__ . \"', elem_size\"; }\
  \ return bless { ELEMSIZE => $elemsize, ARRAY => [], }, $class; }\n```\n\n#### FETCH\
  \ this, index\n\n每当访问（读取）绑定数组的单个元素时，此方法就会触发。除了自引用外，它还接收一个参数：我们要尝试获取的索引。\n\n```\n\
  sub FETCH { my $self = shift; my $index = shift; return $self->{ARRAY}->[$index];\
  \ }\n```\n\n如果使用负数组索引从数组中读取，索引将在传递给 `FETCH` 之前，通过调用 `FETCHSIZE` 在内部转换为正索引。你可以通过给绑定数组类中的变量\
  \ `$NEGATIVE_INDICES` 赋值一个真值来禁用此功能。\n\n正如你可能注意到的，`FETCH` 方法（以及其他）的名称对于所有访问都是相同的，尽管构造函数的名称不同（`TIESCALAR`\
  \ 与 `TIEARRAY`）。虽然在理论上你可以让同一个类处理多个绑定类型，但在实践中这会变得复杂，最简单的方法是每个类只保持一种绑定类型。\n\n####\
  \ STORE this, index, value\n\n每当绑定数组中的元素被设置（写入）时，此方法就会触发。除了自引用外，它接收两个参数：我们要尝试存储东西的索引以及我们尝试放在那里的值。\n\
  \n在我们的示例中，`undef` 实际上是 `$self->{ELEMSIZE}` 个空格，因此在这里我们需要多做一点工作：\n\n```\nsub STORE\
  \ { my $self = shift; my( $index, $value ) = @_; if ( length $value > $self->{ELEMSIZE}\
  \ ) { croak \"length of $value is greater than $self->{ELEMSIZE}\"; } # 填充空白 $self->EXTEND(\
  \ $index ) if $index > $self->FETCHSIZE(); # 右对齐以保持较小元素的大小 $self->{ARRAY}->[$index]\
  \ = sprintf \"%$self->{ELEMSIZE}s\", $value; }\n```\n\n负数索引的处理方式与 `FETCH` 相同。\n\n\
  #### FETCHSIZE this\n\n返回与对象 `this` 关联的绑定数组中的项总数（等于 `scalar(@array)`）。例如：\n\n```\n\
  sub FETCHSIZE { my $self = shift; return scalar @{$self->{ARRAY}}; }\n```\n\n####\
  \ STORESIZE this, count\n\n将与对象 `this` 关联的绑定数组中的项总数设置为 `count`。如果这使得数组变大，则应对新位置返回类映射的\
  \ `undef`。如果数组变小，则 `count` 之外的项应被删除。\n\n在我们的示例中，'undef' 实际上是一个包含 `$self->{ELEMSIZE}`\
  \ 个空格的元素。观察：\n\n```\nsub STORESIZE { my $self = shift; my $count = shift; if ( $count\
  \ > $self->FETCHSIZE() ) { foreach ( $count - $self->FETCHSIZE() .. $count ) { $self->STORE(\
  \ $_, '' ); } } elsif ( $count < $self->FETCHSIZE() ) { foreach ( 0 .. $self->FETCHSIZE()\
  \ - $count - 2 ) { $self->POP(); } } }\n```\n\n#### EXTEND this, count\n\n告知数组可能会增长到\
  \ `count`。此方法用于优化分配。在我们的示例中，我们确保有 `count` 个项：\n\n```\nsub EXTEND { my $self = shift;\
  \ my $count = shift; $self->STORESIZE($count); }\n```\n\n#### EXISTS this, key\n\
  \n验证绑定数组中索引 `key` 的元素是否存在。在我们的示例中，如果不存在则返回 0，否则返回 1：\n\n```\nsub EXISTS { my $self\
  \ = shift; my $index = shift; return 0 if ! defined $self->{ARRAY}[index]; return\
  \ 1; }\n```\n\n#### DELETE this, key\n\n从绑定数组中删除索引 `key` 元素。在我们的示例中，它是 `$self->{ELEMSIZE}`\
  \ 个空格：\n\n```\nsub DELETE { my $self = shift; my $index = shift; $self->STORE($index,\
  \ ''); }\n```\n\n#### CLEAR this\n\n清除（删除）关联绑定数组的所有值。例如：\n\n```\nsub CLEAR { my\
  \ $self = shift; $self->{ARRAY} = []; }\n```\n\n#### PUSH this, LIST\n\n将 `LIST`\
  \ 元素追加到数组中。例如：\n\n```\nsub PUSH { my $self = shift; my @list = @_; my $last = $self->FETCHSIZE();\
  \ $self->STORE( $last + $_, $list[$_] ) foreach 0 .. $#list; return $self->FETCHSIZE();\
  \ }\n```\n\n#### POP this\n\n移除数组的最后一个元素并返回它。例如：\n\n```\nsub POP { my $self = shift;\
  \ return pop @{$self->ARRAY}}; }\n```\n\n#### SHIFT this\n\n移除数组的第一个元素（其他元素向下移动）并返回它。例如：\n\
  \n```\nsub SHIFT { my $self = shift; return shift @{$self->ARRAY}}; }\n```\n\n####\
  \ UNSHIFT this, LIST\n\n在数组开头插入 `LIST` 元素，移动现有元素以留出空间。例如：\n\n```\nsub UNSHIFT {\
  \ my $self = shift; my @list = @_; my $size = scalar( @list ); # 为我们的列表留出空间 @self{ARRAY}}[\
  \ $size .. $#{$self{ARRAY}} + $size ] = @{$self{ARRAY}}; $self->STORE( $_, $list[$_]\
  \ ) foreach 0 .. $#list; }\n```\n\n#### SPLICE this, offset, length, LIST\n\n在数组上执行\
  \ `splice` 等操作。`offset` 是可选的，默认为零，负值从数组末尾计数。`length` 是可选的，默认为数组剩余部分。`LIST` 可能为空。返回位于\
  \ `offset` 处的原始元素列表。在我们的示例中，如果存在 `LIST`，我们将使用一种简便方法：\n\n```\nsub SPLICE { my $self\
  \ = shift; my $offset = shift || 0; my $length = shift || $self->FETCHSIZE() - $offset;\
  \ my @list = (); if ( @_ ) { tie @list, __PACKAGE__, $self->{ELEMSIZE}; @list =\
  \ @_; } return splice @{$self->ARRAY}}, $offset, $length, @list; }\n```\n\n####\
  \ UNTIE this\n\n当 `untie` 发生时调用。（见下文“`untie` 陷”）。\n\n#### DESTROY this\n\n当绑定变量需要被析构时触发此方法。与标量绑定类一样，在有自己的垃圾回收的语言中，这几乎不需要，所以这次我们直接去掉了它。\n\
  \n\n\n\n哈希（Hashes）是第一个被绑定（tied）的 Perl 数据类型（参见 `dbmopen()`）。实现绑定哈希的类应该定义以下方法：`TIEHASH`\
  \ 是构造函数。`FETCH` 和 `STORE` 访问键值对。`EXISTS` 报告键是否存在于哈希中，而 `DELETE` 删除一个键。`CLEAR` 通过删除所有键值对来清空哈希。`FIRSTKEY`\
  \ 和 `NEXTKEY` 实现 `keys()` 和 `each()` 函数以遍历所有键。`SCALAR` 在绑定哈希在标量语境（scalar context）中被求值时触发。`UNTIE`\
  \ 在发生 `untie` 操作时调用，而 `DESTROY` 在绑定变量被垃圾回收时调用。\n\n如果这听起来很复杂，你可以直接从标准的 `Tie::StdHash`\
  \ 模块继承以获取大部分方法，仅重新定义那些有趣的方法即可。详情请参见 `Tie::Hash`。\n\n请记住，Perl 区分“键不存在于哈希中”和“键存在于哈希中但对应值为\
  \ `undef`”。这两种可能性可以通过 `exists()` 和 `defined()` 函数进行测试。\n\n这里有一个算是有有趣的绑定哈希类示例：它为你提供一个表示特定用户配置文件（dot\
  \ files）的哈希。你通过文件名（去掉前面的点）对哈希进行索引，并返回该文件的内容。例如：\n\n```\nuse DotFiles; tie %dot,\
  \ 'DotFiles'; if ( $dot{profile} =~ /MANPATH/ || $dot{login} =~ /MANPATH/ || $dot{cshrc}\
  \ =~ /MANPATH/ ) { print \"you seem to set your MANPATH\\n\"; }\n```\n\n或者这里是使用我们绑定类的另一个示例：\n\
  \n```\ntie %him, 'DotFiles', 'daemon'; foreach $f ( keys %him ) { printf \"daemon\
  \ dot file %s is size %d\\n\", $f, length $him{$f}; }\n```\n``\n\n在我们的绑定哈希 `DotFiles`\
  \ 示例中，我们使用普通哈希来构建包含几个重要字段的对象，其中只有 `{LIST}` 字段会被用户认为是真实的哈希。\n\n*   `USER`：该对象代表的用户。\n\
  *   `HOME`：这些配置文件所在的位置。\n*   `CLOBBER`：我们应该尝试更改或删除这些配置文件。\n*   `LIST`：文件名和内容映射的哈希。\n\
  \n这里是 `Dotfiles.pm` 的开头：\n\n```\npackage DotFiles; use Carp; sub whowasi { ((1))[3]\
  \ . '()' } my $DEBUG = 0; sub debug { $DEBUG = @_ ? shift : 1 }\n```\n\n这是 `DotFiles`\
  \ 绑定哈希的方法。\n\n对于我们的示例，我们希望能够输出调试信息以帮助在开发期间进行追踪。我们在内部还保留了一个方便函数来帮助打印警告；`whowasi()`\
  \ 返回调用它的函数名。\n\n这是 `DotFiles` 绑定哈希的方法。\n\n### TIEHASH 类名，LIST\n\n这是该类的构造函数。它预期返回一个\
  \ get 引用（blessed reference），通过该引用可以访问新对象（可能但不一定是匿名哈希）。\n\n这里是构造函数：\n\n```\nsub TIEHASH\
  \ { my $self = shift; my $user = shift || $>; my $dotdir = shift || ''; croak \"\
  usage: @{[&whowasi]} [USER [DOTDIR]]\" if @_; $user = getpwuid($user) if $user =~\
  \ /^\\d+$/; my $dir = (getpwnam($user))[7] || croak \"@{[&whowasi]}: no user $user\"\
  ; $dir .= \"/$dotdir\" if $dotdir; my $node = { USER => $user, HOME => $dir, LIST\
  \ => {}, CLOBBER => 0, }; opendir(DIR, $dir) || croak \"@{[&whowasi]}: can't opendir\
  \ $dir: $!\"; foreach $dot ( grep /^\\./ && -f \"$dir/$_\", readdir(DIR)) { $dot\
  \ =~ s/^\\.//; $node->{LIST}{$dot} = undef; } closedir DIR; return bless $node,\
  \ $self; }\n```\n\n值得注意的是，如果你要对 `readdir` 的返回值进行文件测试，最好加上相应的目录路径。否则，因为我们没有在那里（`chdir()`），它将测试错误的文件。\n\
  \n### FETCH $this, key\n\n每方法当绑定哈希中的元素被访问（读取）时都会被触发。它除了自引用外还接收一个参数：我们尝试获取其值的键。\n\
  \n这里是我们 `DotFiles` 示例的 fetch：\n\n```\nsub FETCH { carp &whowasi if $DEBUG; my $self\
  \ = shift; my $dot = shift; my $dir = $self->{HOME}; my $file = \"$dir/.$dot\";\
  \ unless (exists $self->{LIST}->{$dot} || -f $file) { carp \"@{[&whowasi]}: no $dot\
  \ file\" if $DEBUG; return undef; } if (defined $self->{LIST}->{$dot}) { return\
  \ $self->{LIST}->{$dot}; } else { return $self->{LIST}->{$dot} = `cat $dir/.$dot`;\
  \ } }\n```\n\n通过调用 Unix (1) 命令来编写很容易，但手动打开文件可能会更具移植性（而且更高）。当然，由于配置文件是一个 Unix 概念，我们并不太担心。\n\
  \n### STORE $this, key, value\n\n每当绑定哈希中的元素被设置（写入）时，该方法都会被触发。它除了自引用外还接收两个参数：我们尝试设置的索引，以及我们尝试放入的值。在我们的示例中，我们将小心不要让它们覆盖。\n\
  \n```\nsub STORE { carp &whowasi if $DEBUG; my $self = shift; my $dot = shift; $value\
  \ = shift; my $file = $self->{HOME} . \".$dot\"; open(my $f, '>', $file) || croak\
  \ \"@{[&whowasi]}: can't open $file: $!\"; print $f $value; close($f); }\n```\n\n\
  ### DELETE $this, key\n\n当从哈希中删除元素时，该方法会被触发，通常是通过使用 `delete()` 函数。`STORE` 方法返回的是\
  \ `delete()` 调用的返回值。我们将返回是否删除成功。\n\n```\nsub DELETE { carp &whowasi if $DEBUG; my\
  \ $self = shift; my $dot = shift; my $file = $self->{HOME} . \".$dot\"; if (exists\
  \ $self->{LIST}->{$dot}) { delete $self->{LIST}->{$dot}; return 1; } return 0; }\n\
  ```\n\n### CLEAR $this\n\n当清空整个哈希时，该方法会被触发，通常是通过给它赋值空列表。在我们的示例中，这将删除用户所有的配置文件！这是一个危险的操作，他们必须将\
  \ `CLOBBER` 设置为大于 1 才能生效。\n\n```\nsub CLEAR { carp &whowasi if $DEBUG; my $self\
  \ = shift; croak \"@{[&whowasi]}: won't remove all dot files for $self->{USER}\"\
  \ unless $self{CLOBBER} > 1; my $dot; foreach $dot ( keys %{$self->LIST}}) { $self->DELETE($dot);\
  \ } }\n```\n\n### EXISTS $this, key\n\n当当用户使用 `exists()` 函数时，该方法会被触发。在我们的示例中，我们将检查\
  \ `{LIST}` 哈希元素。\n\n```\nsub EXISTS { carp &whowasi if $DEBUG; my $self = shift;\
  \ my $dot = shift; return exists $self->{LIST}->{$dot}; }\n```\n\n### FIRSTKEY $this\n\
  \n当用户准备遍历哈希时，该方法会被触发，例如通过 `keys()` 或 `each()` 调用。\n\n```\nsub FIRSTKEY { carp &whowasi\
  \ if $DEBUG; my $self = shift; my $a = keys %{$self->LIST}}; # 重置 each() 迭代器 each\
  \ %{$self->LIST}} }\n```\n\n### NEXTKEY $this, lastkey\n\n该方法在 `keys()` 或 `each()`\
  \ 迭代期间被触发。它有一个第二个参数，是最后一个访问的键。如果你在考虑排序或从多个序列中调用迭代器，或者实际上没有在任何地方存储项，这非常有用。\n\n对于我们的示例，我们正在使用真实的哈希，所以只需做简单的操作，但我们必须间接地通过\
  \ LIST 字段。\n\n```\nsub NEXTKEY { carp &whowasi if $DEBUG; my $self = shift; return\
  \ each %{ $self->{LIST} } }\n```\n\n\n\n\n# SCALAR\n\n当哈希在标量上下文中求值时，会调用此方法。为了模拟未绑定（untied）哈希的行为，当绑定的哈希为空时，此方法应返回假值。如果此方法不存在，perl\
  \ 将进行合理的猜测，并在哈希处于迭代时返回真。如果不是如此，则会调用 `FIRSTKEY`，如果 `FIRSTKEY` 返回空列表，则结果为假，否则为真。\n\
  \n然而，你**不应该**盲目地依赖 perl 总是做正确的事。特别是当你通过反复调用 `DELETE` 直到哈希清空时，perl 会错误地返回真。因此，当你想要绝对确保你的哈希在标量上下文中表现良好时，建议提供自己的\
  \ `SCALAR` 方法。\n\n在我们的示例中，我们只需要对 `$self->{LIST}` 引用的底层哈希调用 `scalar` 即可：\n\n```perl\n\
  sub SCALAR { carp &whowasi if $DEBUG; my $self = shift; return scalar %{ $self->{LIST}\
  \ } }\n```\n\n# UNTIE\n\n发生 `untie` 时调用此方法。请参阅下文的“`untie` 陷阱”。\n\n# DESTROY\n\n\
  当绑定的哈希即将超出作用范围时，触发此方法。除非你尝试添加调试或有辅助状态需要清理，否则你并不需要它。这是一个非常简单的函数：\n\n```perl\nsub\
  \ DESTROY { carp &whowasi if $DEBUG; }\n```\n\n注意，`keys()` 和 `values()` 等函数在大型对象（如\
  \ DBM 文件）上运行时可能会返回巨大的列表。你可能更喜欢使用 `each()` 函数来迭代此类对象。示例：\n\n```perl\n# print out\
  \ history file offsets use NDBM_File; tie(%HIST, 'NDBM_File', '/usr/lib/news/history',\
  \ 1, 0); while (($key,$val) = each %HIST) { print $key, ' = ', unpack('L',$val),\
  \ \"\n\"; } untie(%HIST);\n```\n\n# 绑定文件句柄 (Tying FileHandles)\n\n现在已部分实现。\n\n实现绑定文件句柄的类应该定义以下方法：`TIEHANDLE`、`PRINT`、`PRINTF`、`WRITE`、`READLINE`、`GETC`、`READ`\
  \ 中的至少一个，以及可能的 `CLOSE`、`UNTIE` 和 `DESTROY`。该类还可以提供：`BINMODE`、`OPEN`、`EOF`、`FILENO`、`SEEK`、`TELL`\
  \ —— 如果对句柄使用了相应的 perl 运算符。\n\n绑定 `STDERR` 时，将调用其 `PRINT` 方法发布警告和错误信息。此功能在调用期间临时禁用，因此你可以在\
  \ `PRINT` 中使用 `warn()` 而不会启动递归循环。与 `__WARN__` 和 `__DIE__` 处理器一样，`STDERR` 的 `PRINT`\
  \ 方法可能被用来报告解析错误，因此 `perlvar` 中 `%SIG` 下的注意事项适用。\n\n当 perl 在其他程序中使用时，这一切特别有用，因为输出到\
  \ `STDOUT` 和 `STDERR` 可能需要进行特殊重定向。示例请参考 `nvi` 和 Apache 。\n\n绑定句柄时，`tie` 的第一个参数应以星号开头。因此，如果你绑定\
  \ `STDOUT`，请使用 `*STDOUT`。如果你将其赋值给标量变量（例如 `$handle`），请使用 `*$handle`。`tie $handle`\
  \ 绑定的是标量变量 `$handle`，而不是内部的句柄。\n\n在我们的示例中，我们将创建一个大叫的句柄。\n\n```perl\npackage Shout;\n\
  ```\n\n# TIEHANDLE 类构造, LIST\n\n这是该类的构造函数。它预期返回一个该类型的祝福引用（blessed reference）。该引用可以存储内部信息。\n\
  \n```perl\nsub TIEHANDLE { print \"<shout>\\n\"; my $i; bless \\$i, shift }\n```\n\
  \n# WRITE 方法, LIST\n\n当通过 `syswrite` 函数向句柄写入时，会调用此方法。\n\n```perl\nsub WRITE { $r\
  \ = shift; my($buf,$len,$offset) = @_; print \"WRITE called, \\$buf=$buf, \\$len=$len,\
  \ \\$offset=$offset\"; }\n```\n\n# PRINT 方法, LIST\n\n每当使用 `print()` 或 `say()` 函数打印绑定的句柄时，都会触发此方法。除了自引用外，它还期望传递给\
  \ print 函数的列表。\n\n```perl\nsub PRINT { $r = shift; $$r++; print join($,,map(uc($_),@_)),$\\\
  \ } }\n```\n\n`say()` 的作用与 `print()` 相同，但 `$` 会局部化为 `\\n`，因此你不需要对 `PRINT()` 中的 `say()`\
  \ 进行任何任何特殊处理。\n\n# PRINTF 方法, LIST\n\n每当使用 `printf()` 函数打印绑定的句柄时，都会触发此方法。除了自引用外，它还期望传递给\
  \ printf 函数的格式字符串和列表。\n\n```perl\nsub PRINTF { shift; my $fmt = shift; print sprintf($fmt,\
  \ @_); }\n```\n\n# READ 方法, LIST\n\n当通过 `read` 或 `sysread` 函数从句柄读取时，会调用此方法。\n\n\
  ```perl\nsub READ { my $self = shift; my $bufref = \\$_[0]; my(undef,$len,$offset)\
  \ = @_; print \"READ called, \\$buf=$bufref, \\$len=$len, \\$offset=$offset\"; #\
  \ add to $$bufref, set $len to nuer of characters read $len; }\n```\n\n# READLINE\
  \ 方法\n\n当通过 `<HANDLE>` 或 `readline HANDLE` 读取句柄时，会调用此方法。\n\n根据 `readline`，在标量上下文中它应该返回下一行，在没有更多数据时返回\
  \ `undef`。在上下文中，它应该返回所有剩余行，或一个空列表。\n\n\n\n\n这里是修改后的之前的示例，使用了 `comnt` 方法（它需要绑定的对象）：\n\
  \n```\nuse strict; use Reer; my ($fred, $x); $x = tie $fred, 'Reer', 'myfile.txt';\
  \ $fred = 1; $fred = 4; comnt $x \"changing...\"; $fred = 5; untie $fred; system\
  \ \"cat myfile.txt\";\n```\n\n执行这段代码时没有输出。原因如下：\n\n当一个变量被绑定（tied）时，它会与 `TIESCALAR`、`TIEARRAY`\
  \ 或 `TIEHASH` 函数返回的对象相关联。该对象通常只有一个引用，即来自绑定变量的隐式引用。当调用 `untie()` 时，该引用会被销毁。然后，如上面的第一个示例，对象的析构函数（`DESTROY`）会被调用，这对于没有更多有效引用的对象来说是正常的；因此文件被关闭。\n\
  \n然而，在第二个示例中，我们在 `$x` 中存储了该绑定对象的另一个引用。这意味着当调用 `untie()` 时，对象上仍然存在一个有效的引用，因此析构函数在当时不会被调用，从而文件没有关闭。没有输出的原因是因为文件缓冲区尚未刷新到磁盘。\n\
  \n现在你已经知道了问题所在，你可以做什么来避免它呢？在引入可选的 `UNTIE` 方法之前，唯一的方法是使用老的 `-w` 标志。它会识别出任何调用 `untie()`\
  \ 且对绑定对象仍有有效引用的实例。如果上面的第二个脚本在顶部附近使用 `use warnings 'untie'` 或带有 `-w` 标志运行，Perl 会打印此警告信息：\n\
  \n```\nuntie attempted while 1 inner references still exist\n```\n\n为了让脚本正常工作并消除警告，请确保在调用\
  \ `untie()` **之前** 绑定对象上没有有效的引用：\n\n```\nundef $x; untie $fred;\n```\n\n现在由于 `UNTIE`\
  \ 已经存在了，类设计者就可以决定类功能的哪些部分确实与 `untie` 相关，哪些部分与对象的销毁相关。对于给定的类来说，合理的做法取决于是否保留内部引用，以便在对象上调用非与绑定相关的方法。但在大多数情况下，将本应在\
  \ `DESTROY` 中的功能移动到 `UNTIE` 方法可能是合理的。\n\n如果 `UNTIE` 方法存在，则不会发生上述警告。相反，`UNTIE` 方法将接收“额外”引用的计数，并可以在适当时发出自己的警告。例如，为了模拟没有\
  \ `UNTIE` 的情况，可以使用该方法：\n\n```\nsub UNTIE { my ($obj,$count) = @_; carp \"untie attempted\
  \ while $count inner references still exist\" if $count; }\n```\n\n## 另请参见\n\n查看\
  \ `DB_File` 或 `Config` 以获取更多有趣的 `tie()` 实现。许多 `tie()` 实现的良好起点是 `Tie::Scalar`、`Tie::Array`、`Tie::Hash`\
  \ 或 `Tie::Handle` 模块之一。\n\n## 缺陷\n\n`scalar(%hash)` 提供的桶使用信息不可用。这意味着在布尔上下境下使用 `%tied_hash`\
  \ 无法正常工作（目前它始终测试为假，无论哈希是否为空或是否包含元素）。\n\n绑定数组或哈希的本地化无效。退出作用域后，数组或哈希不会恢复。\n\n通过 `scalar(keys(%hash))`\
  \ 或 `scalar(values(%hash))` 统计哈希中的条目数量是低效的，因为它需要通过 `FIRSTKEY/NEXTKEY` 遍历所有条目。\n\n\
  绑定哈希/数组切片会导致多个 `FETCH`/`STORE` 对，没有用于切片操作的绑定方法。\n\n无法轻松地将多级数据结构（如嵌套哈希）绑定到 `dbm`\
  \ 文件。第一个问题是除了 `GDBM` 和 Berkeley DB 之外的所有数据库都有大小限制，但除此之外，你还有如何在磁盘上表示引用的问题。一个尝试解决此需求的模块是\
  \ `DBM::Deep`。请根据 `perlmodlib` 中的描述检查的 CPAN 站点获取源代码。注意，尽管名字如此，`DBM::Deep` 并没有使用\
  \ `dbm`。另一个解决该问题的早期尝试是 `MLDBM`，它在 CPAN 上可用，但存在相当严重的限制。\n\n绑定句柄仍然不完整。`sysopen()`、`truncate()`、`flock()`、`fcntl()`、`stat()`\
  \ 和 `-X` 目前无法被捕获。\n\n## 作者\n\nTom Christiansen\n\n`TIEHANDLE` 由 Sven Verdoolaege\
  \ <> 和 Doug MacEachern <> \n\n`UNTIE` 由 Nick Ing-Simmons <> \n\n`SCALAR` 由 Tassilo\
  \ von Parseval <> \n\n绑定数组由 Casey West <> \n\n* * *\n\n# PERLTOC\n\n## 名字\n\nperltoc\
