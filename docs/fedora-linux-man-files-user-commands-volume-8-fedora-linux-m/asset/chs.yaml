  \ \"haurger\" => 6.00, # 甜点 \"eclair\" => 1.60, # 法语 \"smorbrod\" => 7.75, # 三明治\
  \ 挪威语 \"spa.tzle\" => 5.50, # 德国语 \"XX\" => 5.50, # 拜特语 \"bao1 zi, 5, # 猪肉包 普通话\
  \ \"jamon serrano\" => 4.45, # 西班牙语 \"peches\" => 2.25, # 桃 \"XXXXXXX\" => 1.85,\
  \ # 奶油点心 \"XXX\" => 0.00, # 韩国米酒 \"XX\" => 9.99, # 寿司 \"XXX\" => 2.65, # 饭蛋糕 日本语\
  \ \"cre brulee\" => 2.00, # 加罗尼亚语 \"fideua\" => 4.20, # 面条 瓦伦西亚语（加罗尼亚语）\"XXXXX\"\
  \ => 8.00, # 煎饼 日本语 ); my $width = 5 + max { colwidth } keys %price; # 亚洲内容按某种顺序排序\
  \ # 这些脚本不会出错；；JK 内容将按照 JIS 顺序 my $coll = new Unicode::Collate::Locale locale =>\
  \ \"ja\"; for my $item ($coll->sort(keys %price)) { print pad(entitle($item), $width,\
  \ \".\"); printf \"%.2f\\n\", $price{$item}; } sub pad($$$) { my($str, $width, $padchar)\
  \ = @_; return $str . ($padchar x ($width - colwidth($str))); } sub colwidth(_)\
  \ { my($str) = @_; return Unicode::GCString->new($str)->columns; } sub entitle(_)\
  \ { my($str) = @_; $str =~ s{ (?=\\pL)(\\S) (\\S*) } { ucfirst($1) . lc($2) }; return\
  \ $str;\n```\n\n## 另请\n\n查看这些手册，其中 CPAN 模块：`perlunicode`, `perluniprops`, `perlre`,\
  \ `perlrecharclass`, `perluniintro`, `perlunitut`, `perlunifaq`, `PerlIO`, `DB_File`,\
  \ `DBM_Filter`, `DBM_Filter::utf8`, `Encode`, `Encode::Locale`, `Unicode::UCD`,\
  \ `Unicode::Normalize`, `Unicode::GCString`, `Unicode::LineBreak`, `Unicode::Collate`,\
  \ `Unicode::Collate::Locale`, `Unicode::Unihan`, `Unicode::CaseFold`, `Unicode::Tussle`,\
  \ `Lingua::JA::Romanize::Japanese`, `Lingua::ZH::Romanize::Pinyin`, `Lingua::KO::Romanize::Hangul`。\n\
  \n`Unicode::Tussle` CPAN 模块包含许多处理 Unicode 的程序，包括完全或部分替换标准程序的程序：`tcgrep` 替换 `egrep`,\
  \ `uniquote` 替换 `cat -v` 或 `hexdump`, `uniwc` 替换 `wc`, `unilook` 替换 `look`, `unifmt`\
  \ 替换 `fmt`, 以及 `ucsort` 替换 `sort`。探索 Unicode 字符和属性，请查看 `uniprops`、`unichars` 和 `uninas`\
  \ 程序。它还提供了这些程序，都是处理 Unicode 的通用过滤器：`unititle` 和 `unicaps`；`uniwide` 和 `uninarrow`；`unisupers`\
  \ 和 `unisubs`；`nfd`, `nfc`, `nfkd`, 和 `nfkc`；以及 `uc`, `lc`, 和 `tc`。\n\n最后，查看已出版的\
  \ Unicode 标准（页码来自版本 6.0.0），包括这些特定的附件和技术报告：X3.13 默认大小写算法，第 113 页；X4.2 大写，第 120X122\
  \ 页；大小写映射，第 166X172 页，特别是从第 170 页开始的忽略大小写匹配。\n\nUAX #44 Unicode 字符数据库\n\nUTS #18\
  \ Unicode 正则表达式\n\nUAX #15 Unicode 规范化形式\n\nUTS #10 Unicode 排序算法\n\nUAX #29 Unicode\
  \ 文本分段\n\nUAX #14 Unicode 换行算法\n\nUAX #11 东亚亚洲宽度\n\n## 作者\n\nTom Christiansen <>\
  \ 编写了此内容，Larry Wall 和 Jeffrey Friedl 偶尔提供建议。\n\n### 版权与许可\n\nCopyright 2012 Tom\
  \ Christiansen.\n\n本程序是自由软件；你可以根据 Perl 本身的 sa 重新分发和/或修改它。\n\n\n\n\n这些示例大多摘自当前版本的《XCal\
  \ Book》；即 *Programming Perl* 第 4XX 版，版权所有 X 2012 Tom Christiansen <et al>，2012-02-13\
  \ 由 OXReilly 出。代码本身可以自由分发，鼓励你随意对本帮助页中的任何示例进行移植、折叠、旋转和修改，将其包含在你自己的程序中，且无需任何保证。通过代码注释表示感谢是礼貌的，但并非强制。\n\
  \n## 修订历史\n\nv1.0.0 X 首次发布，2012-02-27\n\n# PERLUNIFAQ\n\n## 名字\n\n`perlunifaq` -\
  \ Perl Unicode FAQ\n\n## 问答\n\n这是一份关于 Perl 中 Unicode 的问题解答列表，旨在供阅读 perlunitut 后阅读。\n\
  \n### perlunitut 真的真的是一个 Unicode 教程吗？\n\n不是，而且这也不真的是一个 Unicode FAQ。\n\nPerl 为所有支持的字符编码提供了一个抽象接口，因此这实际上是一个通用的\
  \ `Encode` 教程和 `Encode` FAQ。但许多人认为 Unicode 是特殊且神奇的，我不想让他们失望，所以我决定将该文档命名为 Unicode\
  \ 教程。\n\n### Perl 支持哪些字符编码？\n\n要查找你的 Perl 支持哪些字符编码，请运行：\n\n```bash\nperl -MEncode\
  \ -le \"print for Encode->encodings(':all')\"\n```\n\n### 我应该使用哪个版本的 perl？\n\n嗯，如果可以的话，请升级到最新版本，但至少确保是\
  \ `5.8.1` 或更高版本。教程和 FAQ 假设使用的是最新发布版本。\n\n你还应该检查你的模块，并在必要时进行升级。例如，`HTML::Entities`\
  \ 需要版本 >= 1.32 才能正常工作，尽管变更日志中没有提到这一点。\n\n### 二进制数据（如图像）怎么办？\n\n嗯，除了基本的 `binmode\
  \ $fh` 之外，你不应该对其进行特殊处理。（需要 binmode 是因为否则 Perl 可能会在 Win32 系统上转换行符。）\n\n但要小心，永远不要将文本字符串与二进制字符串混合。如果你需要在二进制流中使用文本，请先使用适当的编码对文本字符串进行编码，然后将它们与二进制字符串拼接。参见：“如果我不编码会怎样？”。\n\
  \n### 我在什么时候应该进行解码或编码？\n\n每当你与 perl 进程之外的任何事物通信文本时，例如数据库、文本文件、套接字或其他程序。即使你通信的对象也是用\
  \ Perl 编写的。\n\n### 如果我不解码会怎样？\n\n每当你编码后的二进制字符串与文本字符串一起使用时，Perl 会假设你的二进制字符串是用 ISO-8859-1（也称为\
  \ latin-1）编码的。如果它不是 latin-1，你的数据就会发生不愉快的转换。例如，如果它是 UTF-8，libyte 字符的每个字节会被视为独立的字符，然后再次转换为\
  \ UTF-8。这种双重编码可以比双重 HTML 编码 (`&amp;gt;`) 或双重 URI 编码 (`%253E`)。\n\n这种静式的隐式解码被称为“升级”。这听起来可能是正面的，但但最好避免它。\n\
  \n### 如果我不编码会怎样？\n\n你的文本字符串将使用 Perl 内部格式的字节发送。在这种情况下，Perl 会通过友好的警告提示你正在做错误的事情：\n\
  \n```bash\nWide character in print at example.pl line 2\\.\n```\n\n由于内部格式通常是 UTF-8，这些\
  \ bug 很难发现，因为 UTF-8 通常是你想要使用的编码！但不要偷懒，不要利用 Perl 内部格式是 UTF-8 这一事实来占便宜。显式编码以避免奇怪的\
  \ bug，并向维护程序的程序员展示你考虑过这个问题。\n\n### 有没有自动解码或编码的方法？\n\n如果来自某个特定句柄的所有数据都以完全相同的方式编码，你可以通过\
  \ `encoding` 层告诉 PerlIO 系统自动解码所有内容。如果你这样做，你就再也不会在处理分层句柄时时不小心忘记解码或编码了。\n\n你可以在打开文件时提供此层：\n\
  \n```perl\nopen my $fh, '>:encoding(UTF-8)', $filena; #写入时自动编码\nopen my $fh, '<:encoding(UTF-8)',\
  \ $filena; # 读取时自动解码\n```\n\n或者如果你已经有一个打开的文件句柄：\n\n```perl\nbinmode $fh, ':encoding(UTF-8)';\n\
  ```\n\n所以用于 DBI 的数据库驱动程序也可以自动编码和解码，但这不仅限于 UTF-8 编码。\n\n### 如果我不知道使用了哪种编码怎么办？\n\n\
  尽一切努力找出，如果必须的话：猜。（不要忘记在注释中记录你的猜测。）\n\n你可以在网页浏览器中打开文档，更改字符集或字符编码，直到你从视觉上确认所有字符看起来都是正确的。\n\
  \n没有可靠的方法自动检测编码，所以如果人们继续向你发送没有字符集指示的数据，你可能需要教育他们。\n\n### 我可以在 Perl 源码中使用 Unicode\
  \ 吗？\n\n是的，可以！如果你的源码是 UTF-8 编码的，你可以通过 `use utf8` 指令指示这一点。\n\n```perl\nuse utf8;\n\
  ```\n\n这对比你的输入或输出没有任何影响。它只影响源码的方式。\n\n### Data::Dumper 会恢复 UTF8 标记吗；它坏了吗？\n\n不，它会。但在早期版本的\
  \ Perl 中，或者如果你将字符串传递到作用域之外的子程序，可以通过执行 `utf8::upgrade($string)` 将编码更改为 UTF-8 来强制\
  \ Unicode 规则。这可以安全地用于任何字符串，因为它会检查并且不会改变已经升级的字符串。\n\n更多详细的讨论，请参见 CPAN 上的 Unicode::Semantics。\n\
  \n### 为什么有些字符没有正确转换为大写或小写？\n\n见上一个问题的答案。\n\n### 我如何判断一个字符串是文本字符串还是二进制字符串？\n\n你不能。所以为此你可以使用\
  \ `utf8` 标记，但那是误用，并且会让像 Data::Dumper 良好的模块看起来很糟糕。该标记对于此目的是没用的，因为当使用 8 位编码（默认为 ISO-8859-1）存储字符串时，它是关闭的。\n\
  \n这是你——作为程序员——必须自己去跟踪的事情；抱歉。你可以考虑采用某种“匈牙利命名法”来帮助。\n\n\n\n\n\n# 如何将编码从 FOO 转换为 BAR？\n\
  \n通过先将 FOO 编码的字节字符串转换为文本字符串，然后将文本字符串转换为 BAR 编码的字节字符串：\n\n```perl\nmy $text_string\
  \ = decode('FOO', $foo_string); my $bar_string = encode('BAR', $text_string);\n\
  ```\n\n或者通过跳过文本字符串部分，直接从一种二进制编码转换到另一种：\n\n```perl\nuse Encode qw(from_to); from_to($string,\
  \ 'FOO', 'BAR'); # 改变 $string 的内容\n```\n\n或者让自动解码和编码完成所有工作：\n\n```perl\nopen my\
  \ $foofh, '<:encoding(FOO)', 'example.foo.txt'; open my $barfh, '>:encoding(BAR)',\
  \ 'example.bar.txt'; print { $barfh } $_ while <$foofh>;\n```\n\n### decode_utf8\
  \ 和 encode_utf8 是什么？\n\n这些是 `decode('utf8', ...)` 和 `encode('utf8', ...)` 的替代语法语法。\n\
  \n### 什么是宽字符（wide character）？\n\n这是一个用于描述占用多个字节的字符的术语。\n\nPerl 警告 `Wide character\
  \ in ...` 是此类字符引起的。在没有指定编码层的情况下，Perl 尝试将内容放入单个字节中。当无法做到时，它会发出此警告（如果启用了警告），并使用 UTF-8\
  \ 编码的数据。\n\n为了避免此警告并避免在单个流中使用不同的输出编码，请始终明确指定编码，例如使用 PerlIO 层：\n\n```perl\nbinmode\
  \ STDOUT, \":encoding(UTF-8)\";\n```\n\n## 内部原理\n\n### 什么是 UTF8 标志？\n\n除非你正在修改内部机制或调试某些奇怪的问题，否则完全不要考虑\
  \ UTF8 标志。这意味着你可能根本不应该使用 `is_utf8`、`_utf8_on` 或 `_utf8_off`。\n\nUTF8 标志也称为 `SvUTF8`，是一个内部标志，指示当前的内部表示是\
  \ UTF-8。如果没有该标志，会被假设为 ISO-8859-1。Perl 会自动在它们之间转换。（实际上，Perl 通常假设表示为 ASCII；见上文“为什么正则表达式字符类只在\
  \ ASCII 范围内匹配？”）\n\nPerl 的内部格式之一恰好是 UTF-8。不幸的是，Perl 守秘密，所以所有人都知道这一点。这就是困惑的来源。最好假装内部格式是未知的编码，并且你必须显式地编码和解码。\n\
  \n### use bytes 指令（pragma）是怎么样的？\n\n不要使用它。在文本字符串中处理字节没有意义，在字节字符串中处理字符也没有意义。进行适当的转换（通过解码/编码），问题就会迎解决：你会得到解码后数据的字符计数，以及编码后数据的字节计数。\n\
  \n`use bytes` 通常是尝试做某些有用事情的失败尝试。忘记它吧。\n\n### use encoding 指令（pragma）是怎么样的？\n\n不要使用它。遗憾的是，它假设程序员和用户的环境将使用相同的编码。它将该编码用于源代码以及\
  \ STDIN 和 STDOUT。当程序被复制到另一台机器时，源代码不会改变，但 STDIO 环境可能会改变。\n\n如果你在源代码中需要非 ASCII 字符，请将其转换为\
  \ UTF-8 编码的文件并使用 `use utf8`。\n\n如果你需要设置 STDIN、STDOUT 和 STDERR 的编码（例如根据用户的区域设置），请使用\
  \ `use open`。\n\n### :encoding 和 :utf8 有什么区别？\n\n由于 UTF-8 是 Perl 的内部格式之一，你通常可以跳过编码或解码步骤，直接操作\
  \ UTF8 标志。\n\n与其使用 `:encoding(UTF-8)`，你可以直接使用 `:utf8`，如果数据已经在内部表示为 UTF8，它将跳过编码步骤。这在写入时被广泛认为是良好行为，但在读取时可能是危险的，因为当存在无效字节序列时，它会导致内部不一致。对输入使用\
  \ `:utf8` 可能导致安全漏洞，因此请改用 `:encoding(UTF-8)`。\n\n与其使用 `decode` 和 `encode`，你可以使用 `_utf8_on`\
  \ 和 `_utf8_off`，但这被认为是不良风格。特别是 `_utf8_on` 可能危险，就像 `:utf8` 一样。\n\n单行命令（oneliners）有很多快捷方式；请参见\
  \ perlrun 中的 `-C`。\n\n### UTF-8 和 utf8 有什么区别？\n\n`UTF-8` 是官方标准。`utf8` 是 Perl 在接受内容时的宽容方式。如果你必须与不那么宽容的事物通信，你可能需要考虑使用\
  \ `UTF-8`。如果你必须与过于宽容的事物通信，你可能必须使用 `utf8`。详细解释见 Encode。\n\n`UTF-8` 在内部被称为 `utf-8-strict`。教程一致地使用\
  \ UTF-8，即使在内部实际使用的是 utf8 也是如此，因为这种区别很难区分，而且大部分情况下无关。\n\n例如，utf8 可以用于 Unicode 中不存在的码点（如\
  \ 999999），但如果你将其编码为 UTF-8，你将得到一个替换字符（默认情况下；见 Encode 中的“处理损坏数据”以获取更多处理方法）。\n\n###\
  \ 我 lost track; 内部格式是什么编码？\n\n好吧，如果你坚持的话：内部格式是 utf8，而不是 UTF-8。\n\n### 我 lost track;\
  \ 内部格式是什么编码？\n\nPerl 知道它是如何存储字符串的，因此在 Perl 中，这就是你想要的术语。\n\n\n\n\nUnicode 还为字符定义了各种`properties`（属性），例如`uppercase`或`lowercase`、`decimal\
  \ digit`或`punctuation`；这些属性独立于字符的名称。此外，它还定义了对字符的各种操作，如大写、小写和排序（比较）。\n\n一个 Unicode\
  \ `logical`（逻辑）`character`（字符）实际上可以由多个内部 `actual`（实际）字符或代码点组成。对于西方语言，这可以通过`base\
  \ character`（基础字符，如 `LATIN CAPITAL LETTER A`）跟随一个或多个`modifiers`（修饰符，如 `COMBINING\
  \ ACUTE ACCENT`）来充分建模。这种基础字符和修饰符的序列被称为`character sequence`（组合字符序列）。因此，非西方语言需要更复杂的模型，Unicode\
  \ 创建了`graphe cluster`（字形簇）概念，后来被进一步完善为`extended graphe cluster`（扩展字形簇）。例如，一个韩语音节被视为单个逻辑字符，但它通常由三个实际的\
  \ Unicode 字符组成：一个开头辅音、一个中间元音以及一个末尾辅音。\n\n是否将这些扩展字形簇称为`characters`（字符）取决于你的观点。如果你是一个程序员，你可能倾向于将序列中的每个元素视为一个单元或一个\
  \ `character`（字符）。然而，从用户的角度来看，整个序列可以被视为一个`character`，因为在用户语言的语境下，它看起来可能就是那样。在本文档中，我们采取程序员的观点：一个`character`即一个\
  \ Unicode 代码点。\n\n对于某些基础字符和修饰符的组合，存在`precomposed`（预组合）字符。存在单个的等效字符，例如对于 `LATIN CAPITAL\
  \ LETTER A` 紧跟 `COMBINING ACUTE ACCENT` 的序列，它被称为 `LATIN CAPITAL LETTER A WITH ACUTE`（带重音的拉丁大字母\
  \ A）。然而，这些预组合字符仅适用于某些组合，主要用于支持 Unicode 与遗留标准（如 ISO 8859）之间的循环转换。像 Unicode 这样使用序列允许使用更少的基本构建块（代码点）来表达更多的潜在字形簇。为了支持等效形式之间的转换，还定义了各种`normalization\
  \ forms`（归规范化形式）。因此，`LATIN CAPITAL LETTER A WITH ACUTE` 位于`Normalization Form Composed`（组合规范化形式，简称\
  \ NFC），而 `LATIN CAPITAL LETTER A` 紧跟 `COMBINING ACUTE ACCENT` 的序列在`Normalization\
  \ Form Decomposed`（分解规范化形式，NFD）中代表相同的字符。\n\n由于与遗留编码的向后兼容性，`每个字符有一个唯一的编号`的想法部分失效了：相反地，是`每个字符至少有一个编号`。同一个字符在多个遗留编码中可以用不同的方式表示。反之则不然：因此代码点并没有被分配特定的字符。首先，在已使用的区块内部存在未分配的代码点。其次，还有一些特殊的\
  \ Unicode 控制字符，它们不代表真实的字符。\n\n当 Unicode 最初被构思时，人们认为世界上所有的字符都可以用 16 位字来表示；即需要 `0x10000`（或\
  \ 65,536）个字符，范围从 `0x0000` 到 `0xFFFF`。这很快被证明是错误的，从 Unicode 2.0（1996 年 7 月）开始，Unicode\
  \ 的定义一直扩展到 21 位（`0x10FFFF`），而 Unicode 3.1（2001 年 3 月）定义了第一个 `xFFFF` 之上的字符。前 `0x10000`\
  \ 个字符被称为`Plane 0`（平面 0）或`Basic Multilingual Plane`（基本多语言平面，BMP）。到 Unicode 3.1，共定义了\
  \ 17（是的，十七个）平面——但它们现在远未填满定义的字符。\n\n当编码一种新语言时，Unicode 通常会为其字符选择一个连续的未分配代码点`block`（区块）。到为止，这些区块中的代码点数量始终能被\
  \ 16 整除。区块中当前不需要的额外部分被留为未分配状态，以备未来增长。但出现过某些情况，后续版本需要的代码点比可用的额外部分多，必须在其他地方分配一个新的区块（不与初始区块连续）来处理溢出。因此，很早就明显`block`并不是一个充分的组织原则，于是创建了`Script`（脚本）属性。（后来还添加了改进的脚本属性，即\
  \ `Script_Extensions` 属性。）位于溢出区块中的代码点可以与原始字符具有相同的脚本。脚本概念与自然语言更贴合：有`Latin`脚本、`Greek`脚本等；还有几种人造脚本，例如用于多个脚本字符的\
  \ `Common`（通用）脚本，如数学符号。脚本通常跨越多个区块的不同部分。关于脚本的更多信息，请参见 perlunicode 中的 `Scripts`。区块的划分存在，但几乎完全是偶然的——字符过去和现在分配方式的一种产物。（注意，为了便于介绍，这段话简化了内容。Unicode\
  \ 并不真正编码语言，而是编码它们的文字系统——即脚本；一种脚本可以被许多语言使用。Unicode 还编码一些并非真正关于语言的内容，例如`BAGGAGE CLAIM`等符号。）\n\
  \nUnicode 代码点只是抽象数字。为了输入和输出这些抽象数字，必须对数字进行某种`encoded`（编码）或`serialised`（序列化）。Unicode\
  \ 定义了几种`character encoding forms`（字符编码格式），其中 UTF-8 最流行。UTF-8 是一种变变长度编码，将 Unicode\
  \ 字符编码为 1 到 4 个字节。其他编码包括 UTF-16 和 UTF-32。\n\n### Perl 的 Unicode 支持\n\n从 Perl 5.6.0\
  \ 开始，Perl 就具有了原生处理 Unicode 的能力。然而，Perl 5.8.0 是第一个建议用于 Unicode 工作的版本。维护版本 5.6.1 修复了初始实现的许多问题，但例如在\
  \ 5.6.1 中正则表达式仍然无法工作。Perl 5.14.0 是第一个（几乎）无缝集成 Unicode 支持的版本。要启用这种无缝支持，你应该使用 `use\
  \ feature 'unicode_strings'` 或 `use 5.012`。参见 feature。（5.14 还修复了许多错误和偏离 Unicode\
  \ 标准的地方。）\n\n在 5.8.0 之前，使用 `use utf8` 是声明当前区块或文件将感知 Unicode 的。这种模型被证明是错误的，或者至少是笨拙的：Unicode\
  \ 特性现在随数据携带，而不是附加在操作上。从 Perl 5.8.0 开始，只剩一种情况需要显式的 `use utf8`：如果你的 Perl 脚本本身是 UTF-8\
  \ 编码的，通过说 `use utf8` 可以在标识符名称以及字符串和正则表达式字量中使用 UTF-8。这并不是默认设置，因为包含遗留 8 位数据的脚本将会崩溃。参见\
  \ utf8。\n\n### Perl 的 Unicode 模型\n\nPerl 同时支持 5.6 之前的 8 位原生字节字符串以及 Unicode 字符字符串。通用原则是，Perl\
  \ 尽可能长时间将其数据保持为 8 位字节，但一旦 Unicode 特性无法避免，数据就会被透明地升级为 Unicode。在 Perl 5.14.0 之前，升级并非完全透明（参见\
  \ perlunicode 中的认为 The '' Bug\"\"），为了向后兼容，除非选择 `use feature 'unicode_strings'`（参见\
  \ feature）或 `use 5.012`（或更高），否则无法获得完全透明化。\n\n\n\n在内部，Perl 目前使用平台的原生八位字符集（例如 `Latin-1`）或默认的\
  \ `UTF-8` 来编码 Unicode 字符串。具体而言，如果字符串中的所有代码点都小于 `0xFF` 或以下，Perl 将使用原生八位字符集。否则，它将使用\
  \ `UTF-8`。\n\nPerl 用户通常不需要知道也不关心 Perl 如何编码其内部字符串，但在将 Unicode 字符串输出到没有 PerlIO 层（即具有“默认”编码的层）的流时，这一点变得变得重要。在这种情况下，将使用内部使用的原始字节（根据每个字符串使用原生字符集或\
  \ `UTF-8`），如果这些字符串包含超出 `0x00FF` 的字符，则会发出“宽字符（Wide character）”警告。\n\n例如，\n\n```\n\
  perl -e 'print \"\\x{DF}\\n\", \"\\x{0100}\\x{DF}\\n\"'\n```\n\n会产生一个原生字节和 `UTF-8`\
  \ 的相当无用的混合体，以及警告：\n\n```\nWide character in print at ...\n```\n\n要输出 UTF-8，请使用 `:encoding`\
  \ 或 `:utf8` 输出层。在示例程序中开头加上\n\n```\nbinmode(STDOUT, \":utf8\");\n```\n\n可以确保输出完全是\
  \ UTF-8，并消除程序的警告。\n\n你可以通过使用 `-C` 命令行开关或 `PERL_UNICODE` 环境变量来启用标准文件句柄、默认的 `open()`\
  \ 层和 `@ARGV` 的自动 UTF-8 化，有关 `-C` 开关的文档请参见 `perlrun`。\n\n注意，这意味着 Perl 期望其他软件以相同的方式工作：如果\
  \ Perl 被认为 `STDIN` 应该是 UTF-8，但随后从另一个命令传入的 `STDIN` 不是 UTF-8，Perl 可能会对格式不正确的 UTF-8\
  \ 报错。\n\n所有结合 Unicode 和 I/O 的功能也要求使用新的 PerlIOset。不过，几乎所有的 Perl 5.8 平台都使用了 PerlIO：你可以运行\
  \ `perl -V` 并查找 `useperlio=define` 来检查你的平台情况。\n\n## Unicode 与 EBCDIC\n\nPerl 5.8.0\
  \ 增加了对 EBCDIC 平台的 Unicode 支持。这种支持在随后的版本中被允许失效，但在 5.22 中被恢复。由于需要额外的转换，Unicode 支持的实现要复杂得多。更多信息请参见\
  \ `perlebcdic`。\n\n在 EBCDIC 平台上，内部 Unicode 编码格式是 `UTF-EBCDIC` 而不是 `UTF-8`。区别在于，`UTF-8`\
  \ 是“ASCII 安全的”，因为 ASCII 字符被原样编码为 `UTF-8`；而 `UTF-EBCDIC` 是“EBCDIC 安全的”，因为所有基础字符（包括所有具有\
  \ ASCII 等效字符的字符，如 `A`、`0`、`%` 等*）在 EBCDIC 和 `UTF-EBCDIC` 中都是相同的。通常，文档也会用“UTF-8”来指代\
  \ `UTF-EBCDIC`。本文也是如此。\n\n## 创建 Unicode\n\n本节完全适用于 v5.22 开始的 Perl。早期版本的各种注意事项请见下方的“早期版本注意事项”子节。\n\
  \n若要在字面量中创建 Unicode 字符，请在双引号字符串中使用 `\\N{...}` 符号：\n\n```\nmy $smiley_from_na = \"\
  \\N{WHITE SMILING FACE}\"; my $smiley_from_code_point = \"\\N{U+263a}\";\n```\n\n\
  同样，它们也可以用于正则表达式字面量：\n\n```\n$smiley =~ /\\N{WHITE SMILING FACE}/; $smiley =~ /\\\
  N{U+263a}/;\n```\n\n在运行时，你可以使用：\n\n```\nuse charnas (); my $hebrew_alef_from_na\
  \ = charnas::string_viana(\"HEBREW LETTER ALEF\"); my $hebrew_alef_from_code_point\
  \ = charnas::string_viana(\"U+05D0\");\n```\n\n自然，`ord()` 将执行相反操作：它将字符转换为代码点。\n\n\
  还有其他运行时选项。你可以使用 `pack()`：\n\n```\nmy $hebrew_alef_from_code_point = pack(\"U\",\
  \ 0x05d0);\n```\n\n或者你可以使用 `chr()`，尽管在一般情况下它不太方便：\n\n```\n$hebrew_alef_from_code_point\
  \ = chr(utf8::unicode_to_native(0x05d0)); utf8::upgrade($hebrew_alef_from_code_point);\n\
  ```\n\n如果参数大于 `0xFF`，则不需要 `utf8::unicode_to_native()` 和 `utf8::upgrade()`，因此上面的代码可以写为：\n\
  \n```\n$hebrew_alef_from_code_point = chr(0x05d0);\n```\n\n因为 `0x5d0` 大于 255。\n\n\
  在双引号字符串中，`\\x{}` 和 `\\o{}` 也可以在编译时指定代码点，但为了与旧版本的 Perl 兼容，对于小于 256 的代码点，适用的规则与 `chr()`\
  \ 相同。\n\n使用 `utf8::unicode_to_native()` 是为了让 Perl 代码可以移植到 EBCDIC 平台。如果你非常确定不会有人想在非\
  \ ASCII 平台（non-ASCII platform）上使用你的代码，可以省略它。从 Perl v5.22 开始，在 ASCII 平台上的此类调用会被优化掉。\n\
  \n## 传统编码 (Legacy Encodings)\n\n当你结合 Unicode 和 I/O 时，旧数据需要升级为 Unicode。通常假设旧数据是 ISO-8859-1（如果适用则为\
  \ EBCDIC）。`Encode` 模块了解许多编码，并提供了这些编码之间进行转换的接口：\n\n```\nuse Encode; $data = decode(\"\
  iso-859-3\", $data); # 从旧转换为 utf-8\n```\n\n## Unicode I/O\n\n通常，输出 Unicode 数据：\n\
  \n```\nprint FH $string_with_unicode, \"\\n\";\n```\n\n会产生 Perl 内部用于编码 字符串的原始字节。Perl\
  \ 的内部编码取决于系统以及字符串中包含字符。如果任何字符的代码点在 `0x100` 或以上，将获得警告。为了确保以你所需的编码显式渲染并避免警告——请使用所需的编码打开流。\n\
  \n\n\n读取一个你已知编码为 Unicode 或遗留编码的文件，并不会在 Perl 眼中魔术般地将数据转换为 Unicode。要做到这一点，请在打开文件时指定合适的层。\n\
  \n```\nopen(my $fh,'<:encoding(utf8)', 'anything'); my $line_of_unicode = <$fh>;\
  \ open(my $fh,'<:encoding(Big5)', 'anything'); my $line_of_unicode = <$fh>;\n```\n\
  \n你也可以通过 `open` 编译指令更灵活地指定 I/O 层。参见 `open`，或查看以下示例。\n\n```perl\nuse open ':encoding(utf8)';\
  \ # 输入/输出默认编码将为 UTF-8 open X, \">file\"; print X chr(0x100), \"\\n\"; close X; open\
  \ Y, \"<file\"; printf \"%#x\\n\", ord(<Y>); # 这应该打印 0x100 close Y;\n```\n\n使用 `open`\
  \ 编译指令，你可以使用 `:locale` 层。\n\n```perl\nBEGIN { $ENV{LC_ALL} = $ENV{LANG} = 'ru_RU.KOI8-R'\
  \ } # :locale 将探测区域环境变量如 # LC_ALL use open OUT => ':locale'; # 俄语 russian open(O,\
  \ \">koi8\"); print O chr(0x430); # Unicode 西里尔小写字母 A = KOI8-R 0xc1 close O; open(I,\
  \ \"<koi8\"); printf \"%#x\\n\", ord(<I>), \"\\n\"; # 这应该打印 0xc1 close I;\n```\n\
  \n这些方法在 I/O 流上安装了一个透明过滤器，当从流中读取数据时，它会将数据从指定的编码转换。结果始终是 Unicode。\n\n`open` 编译指令通过设置默认层来影响该指令之后的所有\
  \ `open()` 调用。如果你只想影响某些流，请直接在 `open()` 调用中使用显式分层。\n\n你可以通过 `binmode()` 切换已打开的流的编码；参见\
  \ `perlfunc` 中的 `binmode`。\n\n`:locale` 目前不与 `open()` 和 `binmode()` 配合，仅对 `open`\
  \ 编译指令有效。`:utf8` 和 `:encoding(...)` 方法适用于所有的 `open()`、`binmode()` 和 `open` 编译指令。\n\
  \n同样，你也可以在输出流上使用这些 I/O 层，在向流写入数据时自动将 Unicode 转换为指定的编码。例如，以下代码段将文件 `text.jis`（编码为\
  \ ISO-2022-JP，即 JIS）的内容复制到编码为 UTF-8 的文件 `text.utf8`：\n\n```\nopen(my $nihongo, '<:encoding(iso-2022-jp)',\
  \ 'text.jis'); open(my $unicode, '>:utf8', 'text.utf8'); while (<$nihongo>) { print\
  \ $unicode $_ }\n```\n\n编码的命名（无论是通过 `open()` 还是通过 `open` 编译指令）都允许灵活的命名：`koi8-r`\
  \ 和 `KOI8R` 都会被识别。\n\nISO、MIME、IANA 以及其他各种组织识别的常见编码均被识别；更详细的列表参见 `Encode::Supported`。\n\
  \n`read()` 读取字符并返回字符数。`seek()` 和 `tell()` 基于字节数操作，`sysread()` 和 `sysseek()` 也是如此。\n\
  \n注意，由于在没有默认层的情况下输入时不进行任何转换的默认行为，很容易写出错误代码，通过反复对数据编码来不断扩大文件：\n\n```perl\n# 错误代码警告\
  \ open F, \"file\"; local $/; ## 读取整个 8 位字符文件 $t = <F>; close F; open F, \">:encoding(utf8)\"\
  , \"file\"; print F $t; ## 在输出时转换为 UTF-8 close F;\n```\n\n如果你运行此代码两次，文件内容将经过双倍 UTF-8\
  \ 编码。使用 `use open ':encoding(utf8)'` 可以避免此错误，或者显式地以 UTF-8 格式再次打开文件进行输入。\n\n**注意**：`:utf8`\
  \ 和 `:encoding` 特性仅在你的 Perl 编译时带有 PerlIO 时才有效，这是大多数系统的默认设置。\n\n### 将 Unicode 作为文本显示\n\
  \n你可能希望将包含 Unicode 的 Perl 标显示为简单的 ASCII（或 EBCDIC）文本。以下子程序会对参数进行转换，使得代码点大于 255 的\
  \ Unicode 字符显示为 `\\x{...}`，控制字符（如 `\\n`）显示为 `\\x..`，其余字符显示为本身：\n\n```perl\nsub nice_string\
  \ { join(\"\", map { $_ > 255 # 如果是宽字符... ? sprintf(\"\\\\x{%04X}\", $_) # \\x{...}\
  \ : chr($_) =~ /[[:cntrl:]]/ # 否则是控制字符... ? sprintf(\"\\\\x%02X\", $_) # \\x.. :\
  \ quoteta(chr($_)) # 其他转义或本身 } unpack(\"W*\", $_[0])); # 解析 Unicode 字符 }\n```\n\n\
  例如，\n\n```\nnice_string(\"foo\\x{100}bar\\n\")\n```\n\n返回字符串：\n\n```\n'foo\\x{0100}bar\\\
  x0A'\n```\n\n（这里使用了 `\\\\x{}` 而不是 `\\\\N{}`，因为你更有可能想看到原始值。）\n\n### 特殊情况\n\n位反反运算符\
  \ `~` 和 `*vec()`\n\n\n\n\n\n\n所有以 `\\p` 开头的属性（以及其反向形式 `\\P`）实际上都是感知 Unicode 的字符类。这类属性有几十个，请参阅\
  \ perluniprops。\n\n从 v5.22 开始，你可以使用 Unicode 代码点作为正则表达式模式中字符范围的端点，该范围将包含这些端点之间的所有\
  \ Unicode 代码点（包含端点本身）。\n\n```\nqr/ [\\N{U+03]-\\N{U+20}] /x\n```\n\n包含了代码点 `\\N{U+03}`、`\\\
  N{U+04}`，…… `\\N{U+20}`。\n\n（计划在 Perl v5.24 中将此行为扩展到 `tr///` 中的范围。）\n\n### 字符串到数字的转换\n\
  \nUnicode 除了熟悉的 0 到 9 之外，还定义了其他几种十进制以及数字字符，例如阿拉伯数字和印度数字。Perl 不支持 ASCII `0` 到 `9`（以及十六进制的\
  \ ASCII `a` 到 `f`）之外数字的字符串到数字转换。要从任何 Unicode 字符串获取安全转换，请使用 `Unicode::UCD` 中的 `*num()*`。\n\
  \n#### 问题与解答\n\n#### 我的旧脚本会崩溃吗？\n\n很有可能不会。除非你正在生成某些 Unicode 字符，否则旧行为应该会被保留。唯一改变且可能开始生成\
  \ Unicode 的行为是旧的 `chr()`行为，提供大于 255 的参数时产生对 255 取模的字符。例如，`chr(300)` 等于 `chr(45)`\
  \ 或 `'-'`（在 ASCII 中），现在它是 LATIN CAPITAL LETTER I WITH BREVE。\n\n#### 我如何让我的脚本支持\
  \ Unicode？\n\n通常不需要多少工作，因为在生成 Unicode 数据之前任何内容都不会改变。最重要的是获取 Unicode 格式输入；关于这一点，请参阅之前的\
  \ I/O 讨论。要获得完整的 Unicode 支持，请在脚本中添加 `use feature 'unicode_strings'`（或 `use 5.012`\
  \ 或更高版本）。\n\n#### 我如何知道我的字符串是否是 Unicode？\n\n你不必担心这个。但如果你的 Perl 版本早于 5.14.0，或者你没有指定\
  \ `use feature 'unicode_strings'` 或 `use 5.012`（或更高版本），你可能需要，因为范围 128 到 255 之间的代码点的规则取决于它们包含的字符串是否为\
  \ Unicode。（参阅 perlunicode 中的“When Unicode Does Not Happen”）\n\n要确定字符串是否为 Unicode，请使用：\n\
  \n```\nprint utf8::is_utf8($string) ? 1 : 0, \"\\n\";\n```\n\n但请注意，这并不意味着字符串中的任何字符必须是\
  \ UTF-8 编码的，也不意味着任何字符的代码点大于 0xFF (255) 甚至 0x80 (128)，或者字符串是否包含任何字符。`is_utf8()` 做的只是返回附加到\
  \ `$string` 的内部“utf8-ness”标志的值。如果该标志关闭，标量中的字节被解释为单字节编码。如果该标志开启，标量中的字节被解释为字符的（变长的、可能是多字节的）UTF-8\
  \ 编码代码点。添加到 UTF-8 编码字符串中的字节会自动升级为 UTF-8。如果对混合的非 UTF-8 和 UTF-8 标量（通过双引号插值、显式拼接或 printf/sprintf\
  \ 参数替换）进行操作，结果将被 UTF-8 编码，就像字节字符串的副本升级为 UTF-8 一样：例如，\n\n```\n$a = \"ab\\x80c\";\
  \ $b = \"\\x{100}\"; print \"$a = $b\\n\";\n```\n\n输出字符串将是 UTF-8 编码的 `ab\\x80c =\
  \ \\x{100}\\n`，但 `$a` 将保持字节编码。\n\n因此，你可能真的需要字符串的字节长度而不是字符长度。对于这一点，使用 `Encode::encode_utf8()`\
  \ 函数或 `bytes` 原始指令以及 `length()` 函数：\n\n```\nmy $unicode = chr(0x100); print length($unicode),\
  \ \"\\n\"; # 将打印 1\nrequire Encode; print length(Encode::encode_utf8($unicode)),\"\
  \\n\"; # 将打印 2\nuse bytes; print length($unicode), \"\\n\"; # 也会打印 2 # (UTF-8 的\
  \ 0xC4 0x80)\nno bytes;\n```\n\n#### 我如何发现文件的编码？\n\n你可以尝试 Encode::Guess，但它有很多局限性。\n\
  \n#### 如何检测在特定编码下无效的数据？\n\n使用 `Encode` 包尝试转换。例如，\n\n```\nuse Encode 'decode_utf8';\
  \ if (eval { decode_utf8($string, Encode::FB_CROAK); 1 }) { # $string 是有效的 utf8\
  \ } else { # $string 不是有效的 utf8 }\n```\n\n或者使用 `unpack` 尝试解码：\n\n```\nuse warnings;\
  \ @chars = unpack(\"C0U*\", $string_of_bytes_that_I_think_is_utf8);\n```\n\n如果无效，将产生\
  \ `Malford UTF-8 character` 警告。“C0”表示“逐个字符地处理字符串”。如果没有它，`unpack(\"U*\", ...)` 将在\
  \ `U0` 模式下工作（如果格式字符串以 `U0` 开头）。\n\n#### 我如何将二进制转换为特定编码，或反之？\n\n如果你有（或想要）原生 8 位编码的数据（例如\
  \ Latin-1, EBCDIC），可以使用 pack/unpack 与 Unicode 进行转换。\n\n```\n$native_string = pack(\"\
  W*\", unpack(\"U*\", $Unicode_string)); $Unicode_string = pack(\"U*\", unpack(\"\
  W*\", $native_string));\n```\n\n如果你有一组知道是 UTF-8 的字节，但 Perl 还不确定，你可以让 Perl 相信：\n\n\
  ```\nuse Encode 'decode_utf8'; $Unicode = decode_utf8($bytes);\n```\n\n或者：\n\n```\n\
  $Unicode = pack(\"U0a $bytes);\n```\n\n你可以找到组成 UTF-8 序列的字节：\n\n```\n@bytes = unpack(\"\
  C*\", $Unicode_string)\n```\n\n并且你可以通过以下方式创建良好的 Unicode：\n\n```\n$Unicode_string\
  \ = pack(\"U*\", 0xff, ...)\n```\n\n#### 如何显示 Unicode？如何输入 Unicode？\n\n参阅 <> 和 <>\n\
  \n#### Unicode 如何与传统区域配合工作？\n\n如果你的区域是 UTF-8 区域，从 Perl v5.20 开始，Perl 在处理排序的 `LC_COLLATE`\
  \ 和 `cmp` 运算符之外都工作良好。\n\n对于其他区域，从 Perl 5.16 开始，你可以指定 `use locale ':not_characters';`\
  \ 来让 Perl 与它们良好工作。难点在于你需要自己从区域字符集到/从 Unicode 进行翻译。参阅上文的 Unicode I/O 了解如何使用\n\n```\n\
  use open ':locale';\n```来实现，但详细信息请见 perllocale 中的“Unicode and UTF-8”，包括如果不指定 `:not_characters`\
  \ 会发生的问题。\n\n### 十六进制表示\n\nUnicode 标准倾向于使用十六进制法，因为它更清晰地显示了 Unicode 分为每 256 个字符一个块。十六进制也比十进制短。你也可以使用十进制法，但学习使用十六进制会让处理\
  \ Unicode 标准变得更简单。例如，`U+HHHH` 表示法使用了十六进制。\n\n\n\n\n`0x` 前缀表示十六进制数，数字为 0-9 和 `a-f`（或\
  \ A-F，不区分大小写）。每个十六进制数字代表四位，即半个字节。`print 0x..., \"\\n\"` 将以十进制形式显示十六进制数，而 `printf\
  \ \"%x\\n\", $decimal` 将将十进制数显示为十六进制形式。如果你只有十六进制数的 `hex digits`，你可以使用 `hex()` 函数。\n\
  \n```\nprint 0x0009, \"\\n\"; # 9 print 0x000a, \"\\n\"; # 10 print 0x000f, \"\\\
  n\"; # 15 print 0x0010, \"\\n\"; # 16 print 0x0011, \"\\n\"; # 17 print 0x0100,\
  \ \"\\n\"; # 256 print 0x0041, \"\\n\"; # 65 printf \"%x\\n\", 65; # 41 printf \"\
  %#x\\n\", 65; # 0x41 print hex(\"41\"), \"\\n\"; # 65\n```\n\n### 资源\n\nUnicode\
  \ 联盟\n<>\n\nUnicode 常见问题\n<>\n\nUnicode 词表\n<>\n\nUnicode 推荐阅读列表\n\nUnicode 联盟提供了一系列文章和书籍，其中对\
  \ Unicode 有更深入的介绍：<>\n\nUnicode 有用资源\n<>\n\nHTML、字体、网络浏览器和其他应用程序中的 Unicode 和多语言支持\n\
  <>\n\nUnix/Linux 的 UTF-8 和 Unicode 常见问题\n<>\n\n旧字符集<>\n\n你可以使用 `Unicode::UCD` 模块从\
  \ Unicode 数据文件中探索各种信息。\n\n### 旧旧版本 Perl 中的 Unicode\n\n如果你无法将 Perl 升级到 5.8.0 或更高版本，仍然可以使用从\
  \ CPAN 获取的 `Unicode::String`、`Unicode::Map8` 和 `Unicode::Map` 模块进行 Unicode 处理。如果你安装了\
  \ GNU recode，还可以使用 Perl 前端 `Convert::Recode` 进行字符转换。\n\n以下是从 ISO 8859-1 (Latin-1)\
  \ 字节到 UTF-8 字节以及反之的快速转换，该代码在旧版本的 Perl 5 中也能正常工作。\n\n```\n# ISO 8859-1 to UTF-8 s/([\\\
  x80-\\xFF])/chr(0xC0|ord($1)>>6).chr(0x80|ord($1)&0x3F)/eg; # UTF-8 to ISO 8859-1\
  \ s/([\\xC2\\xC3])([\\x80-\\xBF])/chr(ord($1)<<6&0xC0|ord($2)&0x3F)/eg;\n```\n\n\
  ## 另请\n\nperlunitut, perlunicode, Encode, open, utf8, bytes, perlretut, perlrun,\
  \ Unicode::Collate, Unicode::Normalize, Unicode::UCD\n\n#### 致谢\n\n感谢 , , , 以及邮件列表的热心读者提供的宝贵反馈。\n\
  \n### 作者、版权和许可\n\n版权所有 2001-2011 Jarkko Hietaniemi <>。现在由 Perl 5 Porters 维护。\n\n\
  本文文档可以按照与 Perl 相同的条款分发。\n\n***\n\n# PERLUNIPROPS\n\n### 属性\n\nperluniprops - Perl\
  \ 中 Unicode 7.0.0 字符属性索引\n\n## 描述\n\n本文提供了有关 Unicode 数据库中字符属性部分的信息，即定义在单个代码点上的部分。（下文“Unicode\
  \ 数据库中的其他信息”简要提到了 Unicode 提供的其他数据。）\n\nPerl 可以访问所有非临时性的 Unicode 字符属性，尽管并非所有属性都默认启用。省略的部分是\
  \ Unihan 属性（通过 CPAN 模块 `Unicode::Unihan` 访问）以及某些弃用的或 Unicode 内部属性。（安装时可以选择重新编译 Perl\
  \ 的表格来更改此。请参见 `未被 Perl 接受的 Unicode 字符属性`。）\n\n对于大多数用途，通过 Perl 核心访问 Unicode 属性是通过正则表达式匹配，如下一节所述。对于某些特殊目的以及为了访问不适合正则表达式匹配的属性，Perl\
  \ 处理的所有 Unicode 字符属性都可以标准的 `Unicode::UCD` 模块访问，见“通过 Unicode::UCD 访问的属性”节。\n\nPerl\
  \ 还为 Unicode 属性提供了一些额外的扩展和简写别名。\n\n本文列出了所有可用属性，并未尝试解释每个属性的真实含义。对每个 Perl 扩展都有简要描述；请参见\
  \ perlunicode 中的 `其他属性` 以获取更多信息。关于 Blocks、Scripts、General_Category 和 Bidi_Class\
  \ 的详细信息在 perlunicode 中，但若要了解官方 Unicode 属性的复杂之处，请参考 Unicode 标准。一个很好的起点是 <>。\n\n注意，你可以定义自己的属性；请参见\
  \ perlunicode 中的 `用户自定义字符属性`。\n\n### 通过 \\p{}{} 和 \\P{}{ 访问的属性\n\nPerl 正则表达式 `\\\
  p{}` 和 `\\P{}` 允许访问大多数 Unicode 字符属性。下表显示了所有这些构造，包括单形式和复合形式。\n\n**复合形式**由两个部分组成，用等号或冒号分隔。第一个部分是属性名，第二个部分是用于匹配的属性特定值，例如\
  \ `\\p{Script: Greek}` 和 `\\p{Script=Greek}` 都用于匹配 Script 属性值为 Greek 的字符。\n\n**单形式**（如\
  \ `\\p{Greek}`）大部分是其复合形式的 Perl 定义简写。表格显示了这些等价关系。（在我们的示例中，`\\p{Greek}` 是 `Greek`\
  \ 的简写）。还有少数 Perl 定义的但不是复合形式简写的单形式，其中之一是 `\\p{Word}`。\n\n在解析这些构造时，Perl 总是忽略大括号 {}\
  \ 内部的大小写差异。但在下表中，条目开头的 'T' 表示该条目使用了更紧（更严格）的规则：即使正则表达式没有指定 `/x` 修饰符也是如此。\n\n单形式 (`\\\
  p{na}`）更严格的规则：\n\n空格、连字符和下划线是敏感的，除非：\n\n非单词字符相邻空格\n\n分隔数字的下划线\n\n这意味着例如，你可以自由添加或删除相邻大括号（但在括号内）的空格而不影响含义。\n\
  \n复合形式（`\\p{na=value}` 或 `\\p{na:value}`）更严格的规则：上述针对单形式的更严格规则适用于冒号或等号右侧的所有内容；宽松的规则仍然适用于左侧的所有内容。\n\
  \n这意味着例如，你可以自由添加或删除相邻大括号以及冒号或等号的空格（但在括号内）。\n\n这些属性被 Unicode 认为是过时的，但仍然可用。过时有几种类型：\n\
  \n稳定的\n\n某个属性可能是稳定的。这种判定并不表示该属性应该或不应该被使用；相反，它声明该属性将不会为新编码的字符进行维护或扩展。此类属性在表中标记为 'S'。\n\
  \n弃用的\n\n某个属性可能是弃用的，也许因为其原始意图已被另一个属性取代，或者因为其规范有严重缺陷。这意味着强烈不建议使用它，因此除非正则表达式在 `nowarnings'deprecated'`\
  \ 语句的作用范围内，否则使用时将发出警告。\"D' 标记了表中的此类条目，该属性最详细描述版本的条目处将给出弃用原因，并可能提供建议。Perl 可能会发布此类警告，即使属性未被\
  \ Unicode 官方弃用，当曾经被其匹配的字符或代码点现在不再时。这是为了警告你的程序可能可能与早期的 Unicode 版本不同。\n\n弃用的属性可能会在未来的\
  \ Perl 版本中变得不可用，因此最好避免使用它们。\n\n弃用的属性可能也是稳定的，但这一事实并未显示。\n\n过时\n\n\n\n表格中标记为 `O` 的属性被视为（普通的）过时（obsolete）。通常，这种标记赋予\
  \ Unicode 曾经用于内部目的（但已不再使用）的属性。\n\n因此，Perl 扩展是为了向后兼容而存在的，不建议使用，但它们并不是过时的。表格中的 `X`\
  \ 标记了每一个此类条目。未来的 Unicode 版本可能会在不警告的情况下强制移除这些扩展之一，并用另一个具有相同名称但含义不同的属性来替换。请改用所示的等效形式。\n\
  \n`Block` 属性中的匹配具有以 `In_` 开头的快捷方式。例如，`\\p{Block=Latin1}` 可以写为 `\\p{In_Latin1}`。为了向后兼容，如果与另一个快捷方式没有冲突，这些也可以写成\
  \ `\\p{Latin1}` 或 `\\p{Is_Latin1}`。但是，请注意（N.B.），存在许多此类冲突的快捷方式。不建议对 `Block` 使用这些形式，并对其进行了此类标记，这不仅是因为可能对匹配的是什么产生困惑，还因为\
  \ Unicode 的后续版本可能会抢占该快捷方式，导致你的程序不再正确。请改用 `In_` 以避免这种情况，或者更清晰地使用复合形式，例如 `\\p{blk:latin1}`。更多关于此的信息请参见\
  \ perlunicode 中的 `Blocks`。\n\n下表有两列。左列包含要查找的 `\\p{}` 结构，前面可能带有上述的标记；右列包含关于它们的信息，如描述或同义词。表格显示了每个具有此类形式的属性的单形式和复合形式。如果左列是属性的短名称，右列将提供更长、更具描述性的名称；如果左列是最长名称，右列将显示任何等效的短名称（在适用情况下，同时显示单形式和复合形式）。\n\
  \n如果不需要括号来指定属性（例如 `\\pL`），则左列将包含带括号和不带括号的两种形式。\n\n如果某个属性的含义与通常预期的不同，右列还会向你发出警告。\n\
  \n所有单形式都是 Perl 扩展；少数复合形式也是，并已对此进行标记。\n\n（括号）中的数字表示该属性匹配的 Unicode 代码点总数。为了强调，那些完全匹配任何代码点的属性也列在表格后的单独章节中。\n\
  \n大多数属性无论是否指定 `/i` 不区分大小写的匹配都匹配相同的代码点。但有少数属性受影响。这些在第二列中用符号 `\"(/i=`other_property`)\"\
  ` 表示。在不区分大小写的匹配下，它们匹配的代码点与属性 `other_property` 相同。\n\n大多数非 Perl 定义的属性没有提供描述（请参见 `<\
  \ >`）。\n\n为了紧凑起见，`*****` 被作通配符，而不是显示所有可能的组合。例如，如下条条目：\n\n```\n\\p{Gc: *} \\p{General_Category:\
  \ *}\n```\n\n表示 `Gc` 是 `General_Category` 的同义词，任何对后者有效的内容对前者也有效。同样地，\n\n```\n\\\
  p{Is_*} \\p{*}\n```\n\n表示当且仅当例如 `\\p{Foo}` 存在时，`\\p{Is_Foo}` 和 `\\p{IsFoo}` 也是有效的，且它们是相同的内容。同样地，`\\\
  p{Foo=Bar}` 的含义与 `\\p{Is_Foo=Bar}` 和 `\\p{IsFoo=Bar}` 相同。这里的 `*` 限制为不以下划线开头的内容。\n\
  \n此外，在二进制属性中，`Yes`、`T` 和 `True` 都是 `Y` 的同义词。`No`、`F` 和 `False` 都是 `N` 的同义词。表格显示\
  \ `Y*` 和 `N*` 表示这一点，没有为其他可能性设置单独的条目。注意，并非所有具有 `Yes` 和 `No` 属性都是二进制的，它们的所有值都完整写出而不使用此通配符，并在描述中有一个\
  \ `NOT` 子句来强调它们不是二进制的。这些属性也需要复合形式来匹配，而真正的二进制属性同时提供单形式和复合形式。\n\n注意在下方的短名称显示中，所有非必要的下划线已删除。\n\
  \n### 图例摘要\n\n- `*****` 是通配符\n- 信息列中的 `(\\d+)` 给此属性匹配的 Unicode 代码点数量。\n- `D` 表示已弃用（deprecated）。\n\
  - `O` 表示已过时（obsolete）。\n- `S` 表示已稳定（stabilized）。\n- `T` 表示适用于更严紧（tighter）的名称匹配。\n\
