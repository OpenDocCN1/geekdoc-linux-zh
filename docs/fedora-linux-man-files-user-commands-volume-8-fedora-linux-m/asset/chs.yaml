  \ \\p{Block=Arabic_Presentation_Forms_B} (简写：\\p{ArabicPFB}, \\p{InArabicPFB}) (144)\
  \ X \\p{Arabic_Sup} \\p{Arabic_Supplent} (= \\p{Block=Arabic_Supplent}) (48) X \\\
  p{Arabic_Supplent} \\p{Block=Arabic_Supplent} (简写：\\p{ArabicSup}, \\p{InArabicSup})\
  \ (48) \\p{Arnian} \\p{Script=Arnian} (简写：\\p{Armn}; NOT \\p{Block=Arnian}) (93)\
  \ \\p{Armi} \\p{Imperial_Aramaic} (= \\p{Script=Imperial_Aramaic}) (NOT \\p{Block=Imperial_Aramaic})\
  \ (31) \\p{Armn} \\p{Arnian} (= \\p{Script=Arnian}) (NOT \\p{Block=Arnian}) (93)\
  \ X \\p{Arrows} \\p{Block=Arrows} (112) \\p{ASCII} \\p{Block=Basic_Latin} [[:ASCII:]]\
  \ (128) \\p{ASCII_Hex_Digit} \\p{PosixXDigit} (= \\p{ASCII_Hex_Digit=Y}) (22) \\\
  p{ASCII_Hex_Digit: N*} (简写：\\p{AHex=N}, \\p{AHex}) (1_114_090 加上上述所有 Unicode 代码点)\
  \ \\p{ASCII_Hex_Digit: Y*} (简写：\\p{AHex=Y}, \\p{AHex}) (22) \\p{Assigned} 所有已分配的代码点\
  \ (252_537) \\p{Avestan} \\p{Script=Avestan} (简写：\\p{Avst}; NOT \\p{Block=Avestan})\
  \ (61) \\p{Avst} \\p{Script=Avestan} (= \\p{Script=Avestan}) (NOT \\p{Block=Avestan})\
  \ (61) \\p{Bali}\n\n\n\n在 VMS 下，这反映了实际的 VMS 退出状态；即当 pragma `use vmsish 'status'`\
  \ 生效时，它与 `$?` 相同。\n\n此变量在 Perl v5.10.0 中引入。\n\n### `$EXTENDED_OS_ERROR`\n\n### `$^E`\n\
  \n特定于当前操作系统的错误信息。大多数情况下，它仅在 VMS、OS/2 和 Win32（以及对于 MacPerl）下与 `$!` 不同。在所有其他平台上，`$^E`\
  \ 总是与 `$!` 相同。\n\n在 VMS 下，`$^E` 提供上一次系统错误的具体 VMS 状态值。与 `$!` 提供的信息相比，它关于上次系统错误更为具体。当\
  \ `$!` 被设置为 `EVMSERR` 时，这一点尤为重要。\n\n在 OS/2 下，`$^E` 被设置为通过 CRT 或直接从 perl 调用 OS/2\
  \ API 的最后错误代码。\n\n在 Win32 下，`$^E` 始终返回 Win32 调用 `GetLastError()` 报告的最后一个错误信息，它描述了\
  \ Win32 API 内部的最后一个错误。大多数 Win32 特定的代码将通过 `$^E` 报告错误。ANSI C 和 Unix 类调用设置 `errno`，因此大多数可移植的\
  \ Perl 代码通过 `$!` 报告错误。\n\n`!` 描述中提到的注意事项通常适用于 `$^E`。\n\n此变量在 Perl 5.003 中引入。\n\n\
  助记符：额外的错误解释（Extra error explanation）。\n\n### `$EXCEPTIONS_BEING_CAUGHT`\n\n### `$^S`\n\
  \n解释器的当前状态。\n\n```\n$^S State --------- ------------------------------------- \n\
  undef Parsing module, eval, or main program true (1) Executing an eval false (0)\
  \ Otherwise\n```\n\n第一种状态可能发生在 `$SIG{__DIE__}` 和 `$SIG{__WARN__}` 处理器中。\n\n`EXCEPTIONS_BEING_CAUGHT`\
  \ 的英文名称略带误导性，因为 `undef` 值并不指示异常是否正在被捕获，因为主程序的编译不会捕获异常。\n\n此变量在 Perl 5.004 中引入。\n\
  \n### `$WARNING`\n\n### `$^W`\n\n警告开关的当前值，如果使用了 `-w` 则初始为 true，否则为 false，但可以被直接修改。\n\
  \n参见 warnings。\n\n助记符：与 `-w` 开关有关。\n\n### `${^WARNING_BITS}`\n\n由 `use warnings`\
  \ pragma 启用的当前警告检查集。作用域与 `$^H` 和 `%^H` 变量相同。具体值被视为 warnings pragma 的内部内容，可能会在不同的\
  \ Perl 版本之间发生变化。\n\n此变量在 Perl v5.6.0 中引入。\n\n### `$OS_ERROR`\n\n### `$ERRNO`\n\n\
  ### `$!`\n\n当被引用时，`!` 获取 C 语言整数变量 `errno` 的当前值。如果给 `$!` 赋值一个数值，该值将存储在 `errno` 中。当作为字符串引用时，`!`\
  \ 产生与 `errno` 对应的系统错误字符串。\n\n许多系统或库调用在失败时会设置 `errno` 以指示失败原因。它们在成功时通常**不会**将 `errno`\
  \ 设置为零。因此，`errno` 以及 `$!` 仅在**失败**后*立即*才有意义：\n\n```\nif (open my $fh, \"<\", $filena)\
  \ { # 这里 $! 是无意义的... } else { # 只有在这里 $! 有意义... # 在此之后 $! 可能是无意义的。 } # 因为这里我们可能成功也可能失败，\
  \ # $! 是无意义的。\n```\n\n在这里，*无意义*意味着 `$!` 可能与 `open()` 操作符的结果无关。对 `$!` 的赋值也是转瞬即逝的。它可以在调用\
  \ `die()` 操作符之前立即使用，设置退出值，或检查与错误 *n* 对应的系统错误字符串，或将 `$!` 恢复到有意义的状态。\n\n助记符：刚才发生了什么？（What\
  \ just went bang?）\n\n### `%OS_ERROR`\n\n### `%ERRNO`\n\n### `%!`\n\n`%!` 中的每个元素仅在\
  \ `$!` 设置为该值时才具有真值。例如，当且仅当 `$!` 的当前值为 `ENOENT` 时，`${ENOENT}` 为真；也就是说如果最近的错误是“No\
  \ such file or directory”（或其等效含义：并非所有操作系统都提供完全相同的错误，并非所有语言也是如此）。要检查特定键在你的系统上是否有意义，请使用\
  \ `exists $!{the_key}`；对于合法键列表，请使用 `keys %!`。更多信息请参见 Errno，也请参见“$!'”。\n\n此变量在 Perl\
  \ 5.005 中引入。\n\n### `$CHILD_ERROR`\n\n### `$?`\n\n\n\n由最后一个管道关闭、反引号（``` `` ```）命令、`wait()`\
  \ 或 `waitpid()` 的成功调用，或来自 `system()` 操作符返回的状态。这只是传统 Unix `wait()` 系统调用返回的 16 位状态字（或者伪装成它的样子）。因此，子进程的退出值实际上是\
  \ (`$? >> 8`)，而 `$? & 127` 给出进程死于哪个信号（如果有的话），而 `$? & 128` 则报告是否存在核心转储（core dump）。\n\
  \n此外，如果 C 语言支持 `h_errno` 变量，当任何 `gethost*()` 函数失败时，其值将通过 `$?` 返回。\n\n如果你为 `SIGCHLD`\
  \ 安装了信号处理程序，那么在该处理程序之外，$?` 的值通常是错误的。\n\n在 `END` 子程序内部，`$?` 包含将传递给 `exit()` 的值。你可以在\
  \ `END` 子程序中修改 `$?` 来更改程序的退出状态。例如：\n\n```\nEND { $? = 1 if $? == 255; # die 会让它变成\
  \ 255 }\n```\n\n在 VMS 下，pragma `use vmsish 'status'` 会使 `$?$ 反映实际的 VMS 退出状态，而不是默认的\
  \ POSIX 状态；详情请见 perlvms 中的 `$?`。\n\n助记：类似于 `sh` 和 `ksh`。\n\n`$EVAL_ERROR`\n\n`$@`\n\
  \n来自上一个 `eval()` 操作符的 Perl 语法错误消息。如果 `$@` 为空字符串，则上一个 `eval()` 解析并执行正确（尽管你调用的操作可能以正常方式失败了）。\n\
  \n警告信息不会在此变量中收集。不过，你可以通过如 `%SIG` 所示设置 `$SIG{__WARN__}` 来设置一个处理警告的例程。\n\n助记：语法错误在\
  \ `at` 哪里？\n\n### 与解释器状态相关的变量\n\n这些变量提供了有关当前解释器状态的信息。\n\n`$COMPILING`\n\n`$^C`\n\
  \n与 `-c` 开关相关的标志的当前值。主要用于 `-MO=...`，允许代码在编译时更改其行为，例如在编译时进行 `AUTOLOAD` 而不是正常的延迟加载。设置\
  \ `$^C = 1` 类似于调用 `B::minus_c`。\n\n此变量是在 Perl v5.6.0 中添加的。\n\n`$DEBUGGING`\n\n`$^D`\n\
  \n调试标志的当前值。可以被读取或设置。与其命令行等效值一样，你可以使用数值或符号值，例如 `$^D = 10` 或 `$^D = \"st\"`。\n\n助记：`-D`\
  \ 开关的值。\n\n`${^ENCODING}`\n\n**已弃用！！！**\n\n指向用于将源代码转换为 Unicode 的 `Encode` 对象的*对象引用*。得益于此变量，你的\
  \ Perl 脚本不需要写成 UTF-8 编码。默认值为 `undef`。\n\n由于设计和实现上的缺陷，将此变量设置为 `undef` 以外的任何值都已弃用。计划在未来的\
  \ Perl 版本中移除它。它的目的是允许你的非 ASCII Perl 脚本不需要写成 UTF-8 编码；在在处理 UTF-8 编码文本的编辑器流行之前这很有用，但那是很久以前的事了。它会导致许多问题，例如影响未预期到它的模块的操作，导致通用的混乱。使用它可能会导致段错误（segfaults）。\n\
  \n如果你需要此类功能，应该使用编码 pragma，它也已弃用，但副作用较少。\n\n如果你是因为代码由于他人使用此变量而受到负面影响才来到这里的，通常可以通过以下方法进行规避：\n\
  \n```\nlocal ${^ENCODING};\n```\n\n在损坏的函数开头附近。这在包含它的函数的执行范围内取消该变量。\n\n此变量是在 Perl\
  \ 5.8.2 中添加的。\n\n`${^GLOBAL_PHASE}`\n\nPerl 解释器的当前阶段。\n\n可能的值有：\n\n**CONSTRUCT**\n\
  \n正在通过 `perl_construct` 构建 `PerlInterpreter*`。此值主要用于完整性，并供底层的 C 变量 `PL_phase` 使用。在解释器构造完成之前，实际上无法执行\
  \ Perl 代码。\n\n**START**\n\n这是全局编译时间。它基本上包括在从顶层程序编译期间直接或间接执行的每一个 `BEGIN` 块。\n\n此阶段未命名\
  \ `BEGIN` 以避免与 `BEGIN`-块混淆，因为那些块是在任何编译单元的编译期间执行的，而不仅仅是顶层程序。在运行时进入的新局部编译时间（例如通过 `eval\
  \ \"use SoModule\"` 等结构）不是全局解释器阶段，因此不会被 `${^GLOBAL_PHASE}` 反映。\n\n**CHECK**\n\n\
  执行任何 `CHECK` 块。\n\n**INIT**\n\n类似于 `CHECK`，但针对 `INIT`-块而非 `CHECK`-块。\n\n**RUN**\n\
  \n主运行时，即 `PL_main_root` 的执行。\n\n**END**\n\n执行任何 `END` 块。\n\n**DESTRUCT**\n\n全局析构。\n\
  \n另请注意，`UNITCHECK`-块没有值。这是因为它们是为每个编译单元单独运行的，因此不是全局解释器阶段。\n\n并不是每个程序都必须经过每个可能的阶段，但从一个阶段到另一个阶段的转换只能按照上述顺序发生。\n\
  \n所有阶段的 Perl 代码示例：\n\n```\nBEGIN { print \"compile-time: ${^GLOBAL_PHASE}\" } INIT\
  \ { print \"init-time: ${^GLOBAL_PHASE}\" } CHECK { print \"check-time: ${^GLOBAL_PHASE}\"\
  \ } { package::Phase; sub new { ($class, $ti) = @_; bless $ti, $class; } sub DESTROY\
  \ { my $self = shift; print \"$self: ${^GLOBAL_PHASE}\"; } } print \"run-time: ${^GLOBAL_PHASE}\"\
  ; my $destruct = Print::Phase->new(\"package variables are garbage collected before\
  \ END\"); END { print \"end-time: ${^GLOBAL_PHASE}\" } our $destruct = Print::Phase->new(\"\
  package variables are garbage collected after END\");\n```\n\n此变量是在 Perl 5.14 中添加的。\n\
  \n`$^H` 警告：此变量供内部使用。其可用性和内容可能会更改。它包含 Perl 解释器的编译时提示。编译结束时，此变量的值恢复为解释器启动时的。当 perl\
  \ 开始解析提供作用域的块（例如 `eval` 体、要求的文件、循环体或条件块）时，`$^H` 的现有值会被保存，但其值保持不变。当块完成后，它恢复保存的值。这里有一个示例：\n\
  \n```\nsub add_100 { $^H |= 0x100 } sub foo { DB::DB($ti); }\n```\n\n`use strict\
  \ 'vars'` 的条件版本：\n\n```bash\nBEGIN { require strict; import('vars') if $condition\
  \ }\n```\n\n此变量是在 Perl 5.003 中添加的。\n\n`%^H` `%^H` 哈希表提供了类似于 `$^H` 的作用域语义。这对于实现作用域\
  \ pragma 很有用。运行时访问的所有条目都会字符串化，因此只能容纳简单值。在放入 `%^H` 时，为了与其他用户冲突，应使用模块名称（其主包名）和 '/'\
  \ 字符。例如，模块 `Foo::Bar` 应该使用 `Foo::Bar/baz`。\n\n此变量是在 Perl v5.6.0 中添加的。\n\n`${^OPEN}`\
  \ PerlIO 使用的内部变量。两个部分的字符串，由 `\\0` 字节分隔，第一部分描述输入层，第二部分描述输出层。\n\n此变量是在 Perl v5.8.0\
  \ 中添加的。\n\n$PERLDB ^P 用于调试支持的内部变量。各个位的含义可能会更改，但目前指示：\n\n0x01: 调试子程序进入/退出。\n\n0x02:\
  \ 逐行调试。导致每个执行的语句调用 `DB::DB()` 子程序。也会保存源行（如 0x400）。\n\n0x04: 关闭优化。\n\n0x08: 为未来的交互检查保留更多数据。\n\
  \n0x10: 保留定义子程序的源行信息。\n\n0x20: 开启单步。\n\n0x40: 报告时使用子程序地址而非名称。\n\n0x80: 同样报告 `goto\
  \ &subroutine`。\n\n0x100: 根据编译位置为 `eval` 提供信息性的“文件”名称。\n\n0x200: 根据编译位置为匿名子程序提供信息性的名称。\n\
  \n0x400: 将源代码行保存到 `@{\"_<$filename>\"}`。\n\n0x800: 保存源码时，包含不产生子程序的 `eval`。\n\n0x1000:\
  \ 保存源码时，包含未编译的源码。\n\n这些位可能仅在编译时有效，因此仅在运行时有效。这是一个新机制，细节可能会更改。另见 perldebuts。\n\n${^TAINT}\
  \ 反映污染模式是开启还是关闭。1 表示开启（程序使用 `-T` 运行），0 表示关闭，-1 表示仅启用了污染警告（即使用 `-t` 或 `-TU`）。\n\n\
  此变量是只读的。此变量是在 Perl v5.8.0 中添加的。\n\n${^UNICODE} 反映 Perl 的某些 Unicode 设置。更多信息见 perlrun\
  \ 中的 `-C` 开关。此变量在启动期间设置，之后只读。此变量是在 Perl 5.2 中添加的。\n\n${^UTF8CACHE} 此变量控制内部 UTF-8\
  \ 缓存的状态。1 表示开启（默认），0 表示关闭，-1 表示通过将所有结果与线性扫描对比进行调试并在出现任何差异时崩溃（panic）。此变量是在 Perl 5.9\
  \ 中添加的。它可能会在不通知的情况下更改或删除。\n\n${^UTF8LOCALE} 此变量指示 perl 在启动时是否检测到 UTF-8 locale。perl\
  \ 在其 处于 locale 感知模式时（例如使用 `-CL` 开关运行时）使用此信息；见 perlrun。此变量是在 Perl 5.8.8 中添加的。\n\n\
  ### 已弃用和移除的变量\n\n弃用一个变量宣布了维护者最终将其从语言中移除的意图。它可能仍然可用，尽管其状态已弃用。使用它会触发警告。一旦变量被移除，其使用将触发错误。详情见\
  \ perdiag。\n\n$#\n\n`#` 是一个可以用于格式化数组最后一个索引的。在弃用周期后，它在 Perl 5.10.0 中被移除，现在使用它会触发警告：`#\
  \ 不再支持`。`$` 是获取数组最后一个索引的符号。两者之间没有关系。在 Perl 5 中已弃用。\n\n$*\n\n`*` 是可以用于启用内联匹配的变量。在弃用周期后，它的魔法在\
  \ Perl 5.10.0 中被移除。现在使用它会触发警告：`* 不再支持`。你应该使用 `s` 和 `m` 修饰符。在 Perl 5 中已弃用。\n\n[$\
  \ 此变量存储数组第一个元素的索引以及字符串第一个字符的索引。默认值为 0，但理论上你可以将其设置为 1 以让 Perl 行为更像 `awk`（或 Fortran）在索引时。在\
  \ Perl 5 之后，`[` 被视为编译器指令，无法影响任何其他文件（例如 `strict`）。它的使用是高度不建议的。在 Perl 5.10.0 之前，可以在外部作用域看到\
  \ `[`，这不像编译器指令（例如 `strict`）。现在它始终是作用域的。在 Perl 16 之后，它由 `arraybase` 模块实现。详情见 `arraybase`。允许将其赋值为\
  \ 0，但任何其他值都会产生错误。助记：`[` 开始索引。在 Perl 5.12.0 中已弃用。\n\nPERLVMS\n\n## 名称\n\nperlvms\
  \ - Perl 的 VMS 特定 文档\n\n## 说明\n\n下面收集了关于 Perl 在 VMS 上行为的说明。作为 Perl 文档的补充，因此我们关注的是\
  \ Perl 在 VMS 下与在 Unix 下的不同，以及 Perl 与操作系统其余部分的交互。我们没有尝试复制 Perl 文档的完整描述，那些可以在 Perl\
  \ 分布的 .pod 子目录下找到。\n\n我们希望这些说明能让你在 VMS 上编写 Perl 脚本时避免困惑和浪费睡眠。如果你发现我们遗掉了认为应该出现在这里的内容，请留言。\n\
  \n## 安装\n\n构建和安装 Perl 5 的方向可以在 Perl 分布的主目录下的 `README.vms` 文件中找到。\n\n## Perl 镜像组织\n\
  \n### 核心镜像\n\n在构建过程中会产生三个 Perl 镜像。`Miniperl.Exe` 是一个执行镜像，包含了 Perl 的所有基本功能，无法利用 Perl\
  \ 扩展，并且有一个硬编码的纯 Perl 模块加载列表。它广泛用于构建和测试 Perl 以及各种扩展，但没有安装。\n\n大部分 Perl 位于共享镜像 `PerlShr.Exe`\
  \ 中，执行镜像和所有 Perl 扩展都链接到这里。通常通过逻辑名称 `PERLSHR` 定位可以将镜像放在 `SYS$SHARE` 中使其加载，但不建议这样做。虽然你可能出于性能考虑而安装镜像，但不应带有权限安装它；如果这样做，结果将不是你预期的，因为权限在\
  \ Perl 启动期间被禁用了。最后，`Perl.Exe` 是一个包含 Perl 主入口以及初始化代码的执行镜像。它应该放在公共目录中并设置为可执行。\n\n\
  Perl 扩展是包，提供了 XS 和 Perl 代码来为 Perl 添加新功能（XS 是一种简化编写与 Perl 交互的 C 代码的语言，详情见 perlxs）。扩展的\
  \ Perl 代码被视为任何其他模块——通过脚本中适当的 `use` 或 `require` 语句可用。\n\n### 安装静态扩展\n\n由于静态扩展直接整合到\
  \ `PerlShr.Exe` 中，你必须重新构建 Perl 来包含新扩展。你应该编辑用于构建 Perl 的主 `Makefile`，将扩展的名称添加到 `ext`\
  \ 宏，并将扩展的对象文件添加到 `extobj` 宏。然后你还需要构建扩展的对象文件。\n\n扩展提供的机器代码可以通过两种方式与 Perl 的其余部分连接。在**静态**配置中，每当调用\
  \ Perl 时，扩展的对象代码直接链接到 `PerlShr.Exe`。在**动态**配置中，扩展的机器代码被放在单独的共享镜像中，当脚本 `use` 或 `require`\
  \ 扩展时由 Perl 的 DynaLoader 映射。这允许你将扩展作为一个独立的实体维护，代价是跟踪额外的共享镜像。\n\n### 安装动态扩展\n\n通常，Perl\
  \ 扩展的发行包包含一个 `Makefile.PL` 文件，这是一个 Perl 程序，用于创建 `Makefile` 文件，该文件用于构建和安装扩展所需的文件。扩展包应该解压到**不是**\
  \ Perl 源码目录的树下，构建扩展的过程如下：\n\n```\n$ perl Makefile.PL ! 创建 Makefile\n$ mmk ! 构建必要的文件\n\
  $ mmk test ! 运行测试，如果提供了\n$ mmk install ! 安装到公共树\n```\n\nVMS 对此过程的支持在当前的 版本中是足够的。\n\
  \n# PINFO\n\n## 名称\n\npinfo - 基于 curses 的 info 浏览器\n\n## 环境\n\n有一个变量 `$INFOPATH`，可以可以指定搜索\
  \ info 文件的路径。它的格式类似于 `$PATH` 变量。一个示例如下：\n\n`/usr/info:/somewhere/info:/not/even/in/info`\n\
  \n目录由冒号分隔。\n\n## 颜色和键定义\n\n有 `~/.info` 和 `[prefix]/etc/info` 配置文件，用于本地和全局配置（prefix\
  \ 是 info 安装的目录，例如 `/usr/local`）。这里是这样的文件的示例；我们将讨论内容：\n\n```\n# 是一些颜色设置。条目之间的空格是可选的。\n\
  COL_NORMAL = COLOR_WHITE, COLOR_BLACK\nCOL_MENU = COLOR_RED, COLOR_BLACK\nCOL_SELECTED\
  \ = COLOR_BLUE, COLOR_BLACK\nCOL_NOTESELECT = COLOR_RED, COLOR_BLACK\nCOL_NOTE =\
  \ COLOR_GREEN, COLOR_BLACK\nCOL_TOPLINE = COLOR_YELLOW, COLOR_BLUE\nCOL_BOTTOLINE\
  \ = COLOR_YELLOW, COLOR_BLUE\nCOL_MANUAL = COLOR_WHITE, COLOR_BLACK\nCOL_MANUALITALIC\
  \ = COLOR_WHITE, COLOR_BLACK\nCOL_URL = COLOR_MAGENTA, COLOR_BLACK\nCOL_URL_SELECTED\
  \ = COLOR_RED, COLOR_BLACK\nCOL_INFOHIGHLIGHT = COLOR_WHITE, COLOR_BLACK\n# 是一些键绑定...\n\
  KEY_TOTALSEARCH_1 = 's'\nKEY_TOTALSEARCH_2 = 'S'\nKEY_SEARCH_1 = '/'\nKEY_SEARCH_2\
  \ = '.'\nKEY_SEARCH_AGAIN_1 = 'g'\nKEY_SEARCH_AGAIN_2 = 'G'\nKEY_GOTO_1 = 'm'\n\
  KEY_GOTO_2 = 'M'\nKEY_HOME_1 = 'h'\nKEY_HOME_2 = 'H'\nKEY_PREVNODE_1 = 'p'\nKEY_PREVNODE_2\
  \ = 'P'\nKEY_NEXTNODE_1 = 'n'\nKEY_NEXTNODE_2 = 'N'\nKEY_UP_1 = 'u'\nKEY_UP_2 =\
  \ 'U'\nKEY_END_1 = 'e'\nKEY_END_2 = 'E'\nKEY_PGDN_1 = ' '\nKEY_PGDN_2 = ' '\nKEY_PGDN_AUTO_1\
  \ = 0\nKEY_PGDN_AUTO_2 = ' '\nKEY_PPAGE_1 = ' '\nKEY_PPAGE_2 = ' '\n```\n\n如你所示，格式是简单的。首先我解释颜色定义。首先输入一个颜色名称（示例中包含了所有可用颜色）。还有一个特殊的颜色\
  \ `COLOR_DEFAULT`（表示透明）。然后输入前景颜色和背景颜色。我们希望前景颜色高亮（例如浅蓝色、浅绿色）。BLINK 属性是闪烁属性，在其他配置中是背景高亮。\n\
  \n现在来看键定义。在这里我们首先放入键名（再次，示例包含了所有的键）；然后输入它的值——要么用引号包裹，要么是键码数字（如 `KEY_REFRESH_1`），如果是特殊键，则是其助记代码（例如\
  \ `KEY_FOLLOWLINK_1` 中的）。\n\n如果你想通过代码值指定键，使用提供的程序 `testkey` 来获取所需的值。这主要是一个功能，当你想要添加\
  \ CTRL+字母键绑定等。\n\n对于每个功能，你可以绑定两个键，例如，你可以将 Enter 和光标右都绑定到 FollowLink 功能。如上面的示例所示，两个键名为\
  \ `KEY_FOLLOWLINK_1` 和 `KEY_FOLLOWLINK_2`。\n\n这里是键名的解释：\n\n**KEY_TOTALSEARCH_1**:\
  \ 搜索 info 文件所有节点的键。\n\n**KEY_TOTALSEARCH_2**: 搜索 info 文件所有节点的备用键。\n\n**KEY_SEARCH_1**:\
  \ 搜索当前节点（或手册）的键。\n\n**KEY_SEARCH_2**: 搜索当前节点（或手册）的备用键。\n\n**KEY_SEARCH_AGAIN_1**:\
  \ 重复上一次搜索的键。\n\n**KEY_SEARCH_AGAIN_2**: 重复上一次搜索的备用键。\n\n**KEY_GOTO_1**: 显式跳转到节点（通过指定）的键。\n\
  \n**KEY_GOTO_2**: 显式跳转到节点（通过指定）的备用键。\n\n**KEY_PREVNODE_1**: 头部中标记为 'Prev' 的节点键。在\
  \ man 查看器中这跳转到上一个章节。\n\n**KEY_PREVNODE_2**: 头部中标记为 'Prev' 的节点备用键。在 man 查看器中这跳转到上一个章节。\n\
  \n**KEY_NEXTNODE_1**: 头部中标记为 'Next' 的节点键。\n\n**KEY_NEXTNODE_2**: 头部中标记为 'Next' 的节点备用键。在\
  \ man 查看器中这跳转到下一个章节。\n\n**KEY_UP_1**: 向上滚动的键。\n\n**KEY_UP_2**: 向上滚动的备用键。\n\n**KEY_END_1**:\
  \ 跳到节点末尾的键。\n\n**KEY_END_2**: 跳到节点末尾的备用键。\n\n**KEY_PGDN_1**: 向翻页的键。\n\n**KEY_PGDN_2**:\
  \ 向翻页的备用键。\n\n**KEY_PGDN_AUTO_1**: 当在节点末尾时跳转到下一个节点的键。\n\n**KEY_PGDN_AUTO_2**: 当在节点末尾时跳转到下一个节点的备用键。\n\
  \n**KEY_PPAGE_1**: 翻页的键。\n\n**KEY_PPAGE_2**: 翻页的备用键。\n\n[/content]\n\n注：由于提供的文本包含大量的重复、OCR\
  \ 错误和乱码（例如 \"thethe\", \"texttext\", \"unt\" 等），我只翻译了有意义的部分，并根据你的规则对核心部分进行了格式化。\n\
  \n***\n\n以下是根据要求，我提供了可读部分的翻译版本：\n\n[content]\n${^TAINT} 反映污染模式是开启还是关闭。1 表示开启（程序使用\
  \ `-T` 运行），0 表示关闭，-1 表示仅启用了污染警告（即使用 `-t` 或 `-TU`）。\n\n此变量是只读的。此变量是在 Perl v5.8.0\
  \ 中添加的。\n\n${^UNICODE} 反映 Perl 的某些 Unicode 设置。更多信息见 perlrun 中的 `-C` 开关。此变量在启动期间设置，之后只读。此变量是在\
  \ Perl 5.2 中添加的。\n\n${^UTF8CACHE} 此变量控制内部 UTF-8 缓存的状态。1 表示开启（默认），0 表示关闭，-1 表示通过将所有结果与线性扫描对比进行调试并在出现任何差异时崩溃（panic）。此变量是在\
  \ Perl 5.9 中添加的。它可能会在不通知的情况下更改或删除。\n\n${^UTF8LOCALE} 此变量指示 perl 在启动时是否检测到 UTF-8\
  \ locale。perl 在其处于 locale 感知模式时（例如使用 `-CL` 开关运行时）使用此信息；见 perlrun。此变量是在 Perl 5.8.8\
  \ 中添加的。\n[/content]\n\n***\n\n# PERLVOS\n\n**名称**\n\nperlvos - 用于 Stratus OpenVOS\
  \ 的 Perl\n\n**概览**\n\n此文件包含了在 Stratus OpenVOS 上构建 perl 的说明。Perl 是一种在许多系统中流行的脚本语言。见\
  \ perlbook 了解一些关于 Perl 的书籍。\n\n**说明**\n\n从源码构建 perl。此版本的 Perl 需要动态链接支持，该支持在 OpenVOS\
  \ Release 17.1 中找到，因此不支持 OpenVOS Release 17.0 或更早版本。如果你正在运行 VOS Release 14.4 或更高版本，可以通过从\
  \ Stratus Technologies 购买 GNU Tools 产品获取预编译的 perl 副本。\n\n**在 OPENIVOS 中构建 perl**\n\
  \n要在 Stratus 平台上从源码构建 perl，你需要 OpenVOS Release 17.1.0 或更高版本。遵循构建 perl 的正常说明；例如进入\
  \ bash，运行 Configure 脚本，然后使用 `make`。\n\n**在 OPENIVOS 中安装 perl**\n\n1. 使用 Configure\
  \ 脚本构建 perl 后，确保你对 `/ported` 和所有子目录具有修改和写入权限。然后输入 `make install`。\n\n2. 虽然目前没有特定架构的扩展或模块随\
  \ perl 发布，可以使用以下目录：\n   - 架构无关的文件：`/ported/lib/perl5/site`\n   - 架构相关的文件：`/ported/lib/perl5/site`\n\
  \n3. 你可以检查 `@INC` 变量来查看 Perl 搜索目录的顺序。\n\n"
