  \n\n\n# 正则表达式前瞻\n\n你可以使用前瞻（look-ahead）来模拟类减法。例如，UTS#18 可能会写成：\n\n`[{Block=Greek}-[{UNASSIGNED}]]`\n\
  \n在 Perl 中，可以写为：\n\n`(?!\\p{Unassigned})\\p{Block=Greek} (?=\\p{Assigned})\\p{Block=Greek}`\n\
  \n但在在这个特定的示例中，你可能真正想要：\n\n`\\p{Greek}`\n\n它将匹配已知属于希腊字母的已分配字符。\n\n## CPAN 模块 `Unicode::Regex::Set`\n\
  \n它确实实现了完整的 UTS#18 分组、交集、并集和移除（减法）语法。\n\n`自定义字符属性（User-Defined Character Properties）`\n\
  \n`+` 用于并集，`-` 用于移除（集合差），`&` 用于交集\n\n[6] `\"\\b\"` `\"\\B\"` [7] 注意 Perl 在匹配时执行的是全大小写折叠（Full\
  \ case-folding），而非简单大小写折叠（Simple case-folding）：例如 `U+1F88` 等同于 `U+1F00 U+03B9`，而不是仅仅是\
  \ `U+1F80`。这种区别主要影响带有某些修饰符的希腊大写字母：全大小写折叠会将字母分解，而简单大小写折叠则将其映射为单个字符。[8] Perl 将 `\"\
  \\n\"` 视为行的起始和结束分隔符。Unicode 规定了更多应被这样解释的字符。这些是：\n\n`VT U+000B (\\v in C) FF U+000C\
  \ (\\f) CR U+000D (\\r) NEL U+0085 LS U+2028 PS U+2029`\n\n正则表达式模式中的 `^` 和 `$` 应该匹配所有这些字符，但并并没有。这些字符同样没有生效，但本应该影响\
  \ `<>` `$.` 以及脚本行计数。\n\n此外，行不应在 `CRLF` 内部被拆分（即 `\\r` 和 `\\n` 之间没有空行）。对于 `CRLF`，请尝试使用\
  \ `:crlf` 层（参见 PerlIO）。\n\n[9] 但可以使用 `\"Unicode::LineBreak\"`。该模块提供了符合 UAX#14 `Unicode\
  \ 换行算法（Unicode Line Breaking Algorithm）` 的换行支持。[10] Perl 中使用的 UTF-8/UTF-EBCDIC 不仅允许\
  \ \"U+10000\" 到 \"U+10FFFF\"，还允许超出 \"U+10FFFF\" 的范围。\n\n## Level 2 - 扩展 Unicode\
  \ 支持\n\n- `RL2.1 规范等效字符 - 缺失 [10][11]`\n- `RL2.2 默认字符簇 - 缺失 [12]`\n- `RL2.3 默认单词边界\
  \ - 已完成 [14]`\n- `RL2.4 默认松散匹配 - 缺失 [15]`\n- `RL2.5 归一化后的属性（Na Properties） - 已完成`\n\
  - `RL2.6 通配符属性 - 缺失 [10]` \n- 见 UAX#15 “Unicode 规范化形式（Unicode Normalization Forms）”\
  \ [11] 有 `Unicode::Normalize` 但未集成到正则中 [12] 拥有 `\\X` 和 `\\b{gcb}`，但我们还没有“字符簇模式”\
  \ [14] 见 UAX#29，单词边界（Word Boundaries） [15] 这已在第 3.13 节中涵盖（Unicode 6.0）\n\n## Level\
  \ 3 - 定制支持\n\n- `RL3.1 定制标点 - 缺失`\n- `RL3.2 定制字符簇 - 缺失 [17][18]`\n- `RL3.3 定制单词边界\
  \ - 缺失`\n- `RL3.4 定制松散匹配 - 缺失`\n- `RL3.5 定制范围 - 缺失`\n- `RL3.6 上下文匹配 - 缺失 [19]`\n\
  - `RL3.7 增量匹配 - 缺失 ( RL3.8 Unicode 集合共享 )`\n- `RL3.9 可能的匹配集 - 缺失`\n- `RL3.10 折叠匹配\
  \ - 缺失 [20]`\n- `RL3.11 子匹配器 - 缺失 [17]` \n- 见 UAX#10 “Unicode 排序算法（Unicode Collation\
  \ Algorithms）” [18] 有 `Unicode::Collate` 但未集成到正则中 [19] 拥有 `(?<=x)` 和 `(?=x)`，但前瞻或后瞻应该看到目标子字符串之外\
  \ [20] 需要对大小以外的语言特征进行不敏感匹配；例如，平假名到片假名、宽窄、简体中文到繁体中文（参见 UTR#30 “字符折叠（Character Foldings）”）\n\
  \n## Unicode 编码\n\nUnicode 字符分配给代码点（code points），这些是抽象的数字。要使用这些数字需要各种编码。\n\n###\
  \ UTF-8\n\nUTF-8 是一种变长（1 到 4 字节）、字节序无关的编码。在 Perl 的大部分文档（包括本文的其他地方）中，“UTF-8” 也指 “UTF-EBCDIC”。但在本节中，“UTF-8”\
  \ 仅指代用于 ASCII 平台的编码。它是 7 位 US-ASCII 的超集，因此任何用 ASCII 编码的内容在编码为 UTF-8 时具有完全相同的表示。\n\
  \n下表来自 Unicode 3.2。\n\n| 代码点 | 第一字节 | 第二字节 | 第三字节 | 第四字节 |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| U+0000..U+007F | 00..7F | | | |\n| U+0080..U+07FF | * | C2..DF\
  \ | 80..BF | |\n| U+0800..U+0FFF | E0..E7 | 80..BF |  |0| | |0|0000000..U......\
  \ | | | 8.... | | 80.. | | |\n| U+C000..U+DFFF | D0..DF | 80..BF | 80..BF | |\n\
  | U+E000..U+FFFF | F0..EF | 80..BF | 80..BF | 80|BF+10000..U+000U+000 | 80..BF |\
  \ 80..BF | 80..BF |\n| U+20000..U+10FFFF | F4..F4 | 80..BF | 80..BF | 80..BF |\n\
  \n*(注：由于原文表格格式较为混乱，此处根据标准 UTF-8 规则进行了对齐还原)*\n\n\n\n\n\n这种技巧的运作原理是：代码点 `U+FFFE` 的字符不应该出现在输入流中，因此字节序列\
  \ `0xFF 0xFE` 连续地作为小端格式表示的 `BOM`，而不能是大端格式表示的 `U+FFFE`。\n\n代理对（Surrogates）在 Unicode\
  \ 中除了成对使用以表示其他代码点外，没有任何意义。然而，Perl 允许在内部单独表示它们，例如通过调用 `chr(0xD801)`，这样所有代码点（而不仅仅是适用于开放交换的有效点）都是可表示的。Unicode\
  \ 确实为它们定义了语义，例如它们的 `General_Category` 为 `Cs`。但由于它们的使用具有一定的危险，如果尝试进行诸如取其小写、进行不区分大小的匹配或输出它们等操作，Perl\
  \ 将发出警告（使用警告类别 `surrogate`，它是 `utf8` 的子类别）。（但在 5.14 之前的 Perl 版本中不要尝试这样做。）\n\n##\
  \ UTF-32, UTF-32BE, UTF-32LE\n\nUTF-32 族与 UTF-16 族非常相似，不同之处在于单位是 32 位，因此不需要代理方案。UTF-32\
  \ 是一种固定宽度编码。`BOM` 签名 BE 为 `0x00 0x00 0xFE xFF`，LE 为 `0xFF 0xFE 0x00 0x00`。\n\n##\
  \ UCS-2, UCS-4\n\n由 ISO 10646 标准定义的旧固定宽度编码。UCS-2 是 16 位编码。与 UTF-16 不同，UCS-2 无法扩展到\
  \ `U+FFFF` ，因为它不使用代理。UCS-4 是 32 位编码，功能上与 UTF-32 相同（区别在于 UCS-4 既不禁止代理也不禁止大于 `0x10_FFFF`\
  \ 的代码点）。\n\n## UTF-7\n\n一种七位安全（非八位）编码，当传输或存储不支持八位时非常有用。由 RFC 2152 定义。\n\n### 非字符代码点\n\
  \nUnicode 中留了 66 个代码点作为 `非字符代码点`（noncharacter code points）。它们都具有 `Unassigned`（`Cn`）`General_Category`，永远不会有字符分配到其中任何一个。它们是包括\
  \ `U+FDD0` 到 `U+FDEF` 在内的 32 个代码点，以及 34 个代码点：\n\n`U+FFFE U+FFFF U+1FFFE U+1FFFF\
  \ U+2FFFE U+2FFFF ... U+EFFFE U+EFFFF U+FFFFE U+FFFFF U+10FFFE U+10FFFF`\n\n在 Unicode\
  \ 7.0 之前，非字符“禁止在 Unicode 文本数据的开放交换中使用”，因此处理这些流的代码可以使用这些点作为哨兵，它们可以与字符数据混合，并且始终能与该数据区分开。（此处及下一段中的强调是在本本文中添加的。）\n\
  \nUnicode 7.0 修改了措辞，将其变为“不建议在 Unicode 文本数据的开放交换中使用”。7.0 标准继续说道\n\n“如果在开放交换中接收到非字符，应用程序不需要以任何方式解释它。然而，良好的做法是将其识别为非字符并采取适当措施，例如将其替换为替换字符\
  \ `U+FFFD`，以指示文本中的问题。不建议直接从此类文本中删除非字符代码点，因为删除未解释的字符可能会导致潜在的安全问题。（参见第 3.2 节合规性要求中的\
  \ C7 条，以及 Unicode 技术报告 #36《Unicode 安全考虑》<>）。”\n\n之所以进行此更改是因为发现各种商业工具（如编辑器）或用于源码控制的工具，在编写时并没有处理使用这些代码点的程序文件，这在实际上几乎完全排除了它们的使用！这从来不是本意。它们一直原本的意图是在应用程序内部或协作的应用程序集内随心所欲地使用。\n\
  \n如果你正在编写处理任何 Unicode 文本数据的代码（例如编辑器），且该代码应该能够处理任何 Unicode 文本数据，那么你不应该自己使用这些代码点，而是允许它们在输入中存在。如果你需要哨兵，应该使用不是合法的\
  \ Unicode 字符。对于 UTF-8 数据，可以使用字节 `0xC1` 和 `0xC2` 作为哨兵，因为它们永远不会出现在良好的 UTF-8 中。（UTF-EBCDIC\
  \ 有相应的替代品）。你也可以将 Unicode 代码点存储在整数变量中，并使用负值作为哨兵。\n\n如果你没有在编写此类工具，那么是否接受非字符作为输入取决于你（尽管标准建议不要这样做）。如果你在\
  \ Perl 中进行严格的输入流检查，这些代码点将继续被禁止。这是为了保持向后兼容（否则可能会打开安全漏洞，因为一个假设非字符在到达它之前会被过滤掉的不知情的应用程序，现在可能没有任何警告就开始接收到它们）。要进行严格检查，你可以使用层\
  \ `:encoding('UTF-8')`。\n\n如果尝试输出非字符，Perl 将继续发出警告（使用警告类别 `nonchar`，它是 `utf8` 的子类别）。\n\
  \n### Unicode 代码点之外\n\n在大多数情况下，Perl 在针对非 Unicode 代码点匹配 Unicode 属性时会发出警告，当 `\\p{}`\
  \ 返回 `TRUE` 而 `\\P{}` 返回 `FALSE` 时。例如：（等一下，让我重新对齐文本流）\n\n在正则表达式中使用 Unicode 属性（`\\\
  p{}` 和 `\\P{}` 结构）匹配这些代码点的情况并不明确，处理方式随着我们经验的增加而变化。\n\n一种可能性是将对这些点的任何匹配都视为未定义。但由于\
  \ Perl 没有匹配未定义的概念，它将其转换为失败或 `FALSE`。这与 Perl 在 5.14 到 5.18 之间的做法几乎但不完全相同。区别在于 Perl\
  \ 将所有 `\\p{}` 匹配视为失败，而将所有 `\\P{}` 匹配视为成功。\n\n这样做的一个问题是会导致以下情况下产生意料之外且困惑的结果：\n\n\
  ```\nchr(0x11000) =~ \\p{ASCII_Hex_Digit=True} # v5.18 失败\nchr(0x11000) =~ \\p{ASCII_Hex_Digit=False}\
  \ # v5.18 失败！\n```\n\n也就是说，它将两个匹配都视为未定义，并转换为假（各触发警告）。第一个案例是预期结果，但第二个案例可能违背直觉：“既然它们是互补的，怎么可能都是假？”另一个问题是实现会将许多\
  \ Unicode 属性匹配优化为已有的、更快的操作，这些操作不会触发警告。我们选择不放弃这些有助于大多数匹配的优化，仅仅为了在极少数发生针对上方 Unicode\
  \ 代码点的匹配时才生成警告。\n\n由于这些问题，从 v5.20 开始，Perl 的做法是将非 Unicode 代码点视为普通的未分配 Unicode 字符，并相应地匹配。（注意：Unicode\
  \ 具有异常的未分配代码点。例如，它拥有非字符代码点，以及一些在分配后注定从右向左写入的点，就像阿拉伯语和希伯来语一样。）\n\n\n\n\n\n```markdown\n\
  chr(0x110000) =~ \\p{ASCII_Hex_Digit=True} # 失败，无警告\nchr(0x110000) =~ \\p{ASCII_Hex_Digit=False}\
  \ # 成功，有警告\n```\n\n在这两个示例中，被匹配的字符都是非 Unicode 字符，因此 Unicode 并没有定义它们应该如何匹配。它显然不是 ASCII\
  \ 十六进制数字，因此第一个示例显然应该失败，事实也确实如此，且没有警告。但人们认为，第二个示例应该得到一个未定义的（即 `FALSE`）结果。因此，对它触发了警告。\n\
  \n因此，触发警告的情况比在较早版本的 Perl 中少得多，并且只有在结果可能存在争议时才会触发。事实证明，Perl 所做的任何优化（或未来可能采取的任何优化）都没有导致警告被跳过，因此它解决了\
  \ Perl 早期方法中的两个问题。受此变化影响的最常用属性是 `\\p{Unassigned}`，它是 `\\p{General_Category=Unassigned}`\
  \ 的缩形式。从 v5.20 开始，所有非 Unicode 代码点都被视为 `Unassigned`。在较早的版本中，匹配失败是因为结果被认为未定义。\n\n\
  只有在本该触发警告但没有触发的情况下，通常是因为优化导致整个模式匹配甚至没有被尝试。例如，Perl 可能会发现，为了使一个字符串匹配某个正则表达式模式，该字符串必须包含子串\
  \ `foobar`。在尝试匹配之前，Perl 可能会查找该子串，如果没有找到，将立即失败匹配而不会实际尝试；因此，即使字符串包含上述非 Unicode 代码点也不会生成警告。\n\
  \n对于大多数应用程序来说，这种行为比早期的 Perl 更符合“随我所愿（Do what I mean）”。但对于需要严格遵守 Unicode 标准的代码，它捕获到的问题更少。因此，提供了一种额外的操作模式来适应此类代码。如果正则表达式模式在词作用域内编译，且\
  \ `non_unicode` 警告类被设置为致命（fatal），则会启用此模式，例如：\n\n```\nuse warnings FATAL => \"non_unicode\"\
  \n```\n\n（参见 warnings）。在这种操作模式下，Perl 将对所有针对非 Unicode 代码点的匹配触发警告（而不仅仅是那些有争议的），并跳过可能导致警告不输出的优化。（它目前在未实际尝试匹配时仍然不会警告，如上面的\
  \ `foobar` 示例所示。）\n\n总结来说，Perl 现在在正则表达式匹配中通常将非 Unicode 代码点视为典型的 Unicode 未分配代码点，仅在结果可能存在争议时才触发警告。然而，如果此警告被设置为致命，则它不会被跳过。\n\
  \n这一切中存在一个例外。`\\p{All}` 看起来像是一个 Unicode 属性，但它是 Perl 的扩展，被定义为所有可能的代码点（无论是否为 Unicode）均为真，因此在与非\
  \ Unicode 代码点匹配时永远不会生成警告。（在 v5.20 之前，它是 `\\p{Any}` 的精确同义词，匹配从 `0` 到 `0x10FFFF` 的代码点。）\n\
  \n### Unicode 的安全性\n\n首先，请阅读 [Unicode Security Considerations]<>\n\n此外，请注意以下内容：\n\
  \n#### 错误的 UTF-8\n\n遗憾的是，UTF-8 的原始规范为从一个输入 Unicode 字符生成多少字节的编码输出留留下了很大的解释空间。严格来说，应该生成最短可能的\
  \ UTF-8 字节序列，否则在 UTF-8 连接的接收端存在输入缓冲区溢出的潜在风险。Perl 总是生成最短长度的 UTF-8，在开启警告的情况下，Perl\
  \ 会对非最短长度的 UTF-8 以及其他格式错误（例如代理对 surrogates，它们不是有效的交换的 Unicode 代码点）发出警告。\n\n如果你不熟悉\
  \ Unicode，正则表达式的模式匹配可能会让你感到意外。从 Perl 5.14 开始，提供了几种模式修饰符来控制这一点，称为字符集修饰符。细节见 perlre\
  \ 中的 \"Character set modifiers\"。\n\n正如在其他地方讨论的那样，Perl 有一只脚（还是两只蹄子？）分别踏在两个世界中：ASCII\
  \ 和单字节本地旧世界，以及 Unicode 的新世界，并在需要时升级。如果你的遗留代码没有显式使用 Unicode，则不应该发生到 Unicode 的切换。\n\
  \n#### EBCDIC 上 Perl 中的 Unicode\n\nEBCDIC 平台支持 Unicode。请参见 perlebcdic。\n\n除非专门讨论\
  \ ASCII 与 EBCDIC 的问题，否则本文及其他地方对 UTF-8 编码的引用应被理解为 EBCDIC 平台上的 UTF-EBCDIC。参见 perlebcdic\
  \ 中的 \"Unicode and UTF\"。\n\n由于 UTF-EBCDIC 与 UTF-8 非常相似，其差异大多对你隐藏了；`useutf8`（而不是类似\
  \ `useutfebcdic` 的东西）声明脚本处于该平台的“原生”8 位 Unicode 编码中。（同样适用于 `:utf8` 层。）\n\n#### 本地语言/区域（Locales）\n\
  \n请参见 perllocale 中的 \"Unicode and UTF-8\"\n\n#### Unicode 未发生的情况\n\n在 Perl 中，仍有许多地方\
  \ Unicode（以某种编码形式）可以作为参数传递或作为结果接收，或兼之，尽管 Perl 拥有广泛的方法来输入和输出 Unicode，以及其他几个“入口点”，例如\
  \ `@ARGV` 数组（它也可以被解释为 UTF-8）。\n\n以下是此类接口。另请参见 \"The 'Unicode Bug'\"。对于所有这些接口，Perl\
  \ 目前（截至 v5.20）简单视为字节字符串，除非使用了 `encoding` 祈格。\n\n`chdir`, `chmod`, `chown`, `chroot`,\
  \ `exec`, `link`, `lstat`, `mkdir`, `rmdir`, `stat`, `syink`, `truncate`, `unlink`,\
  \ `uti`, `-X`\n\n`%ENV`\n\n`glob`（即 `<*>`）\n\n`open`, `opendir`, `sysopen`\n\n`qx`（即反引号），`system`\n\
  \n`readdir`, `readlink`\n\n### Unicode Bug（Unicode Bug）\n\n“Unicode bug”一词被应用于 `Latin-1`\
  \ 块中的一致性，即 128 到 255 之间。在没有指定区域语言的情况下，与其他所有字符或代码点不同，这些字符根据生效的规则具有完全不同的语义。（高于 255\
  \ 的字符在 ASCII 和 Unicode 规则下语义相同。）\n\n在 Unicode 规则下，这些字符被视为未分配字符。\n\n正如 \"ASCII versus\
  \ Unicode Rules\" 中解释的，这会导致意外的结果。例如，如果向字符串中附加一个 255 以上的代码点，字符串的语义可能会突然从 ASCII 变为\
  \ Unicode。作为一个例子，请考虑以下程序及其输出：\n\n```\n$ perl -le' no feature 'unicode_strings';\
  \ $s1 = \"\\xC2\"; $s2 = \"\\x{2660}\"; for ($s1, $s2, $s1.$s2) { print /\\w/ ||\
  \ 0; } ' 0 0 1\n```\n\n如果 `s1` 和 `s2` 中都没有 `\\w`，为什么它们的拼接结果却有一个呢？\n\n这种异常源于 Perl\
  \ 尝试不干扰没有使用 Unicode 的旧程序，以及 Perl 想要无缝添加 Unicode 支持的愿望。但事实证明结果并不是无缝的。（顺便提一下，你可以选择在此类情况发生时收到警告。参见\
  \ `encoding::warnings`。）\n\n`usefeature'unicode_strings'` 从 Perl v5.12 开始添加，用于解决这个问题。它影响以下内容：\n\
  ```\n\n\n\n\n更改标量的大小写，即使用 `uc()`、`ucfirst()`、`lc()` 和 `lcfirst()`，或者在双引号上下文中（如正则表达式替换）中使用\
  \ `\\L`、`\\U`、`\\u` 和 `\\l`。\n\n从 Perl 5.12.0 开始，在 `unicode_strings` 下，通常会使用 Unicode\
  \ 规则。详情请参阅 `perlfunc` 中的 `lc`，了解其如何与其他各种指令配合工作。\n\n使用不区分大小写（`/i`）的正则表达式匹配。\n\n从\
  \ Perl 5.14.0 开始，在 `unicode_strings` 作用范围内编译的正则表达式，即使在作用范围之外执行或编译进更大的正则表达式中，也会使用\
  \ Unicode 规则。\n\n在正则表达式中匹配多个属性中的任意一个。\n\n这些属性是 `\\b`（不带括号）、`\\B`（不带括号）、`\\s`、`\\\
  S`、`\\w`、`\\W` 以及除 `[:ascii:]]` 之外的所有 Posix 字符类。\n\n从 Perl 5.14.0 开始，在 `unicode_strings`\
  \ 作用范围内编译的正则表达式，即使在作用范围之外执行或编译进更大的正则表达式中，也会使用 Unicode 规则。\n\n在 `quoteta` 或其内联等价物\
  \ `\\Q` 中。\n\n从 Perl 5.16.0 开始，在 `unicode_strings` 作用范围内使用一致的引用规则，如 `perlfunc` 中的\
  \ `quoteta` 所示。在此之前或范围之外，UTF-8 编码字符串中不会引用高于 127 的代码点，但在字节编码字符串中，128-255 之间的代码点始终会被引用。\n\
  \n从上述可以看出，`unicode_strings` 的效果随着几个 Perl 版本的发布而增强。（而且 Perl 对 Unicode 的支持持续改进；最好使用最新的可用版本，以获得尽可能完整和准确的结果。）注意，如果你使用了\
  \ `use5.012` 或更高版本，`unicode_strings` 将被自动选择。\n\n对于早于上述版本的 Perl，或者当字符串传递给 `unicode_strings`\
  \ 作用范围的函数时，请参阅下一节。\n\n### 在 Perl 中强制使用 Unicode（或取消强制 Unicode）\n\n正如（参见“当 Unicode\
  \ 并不发生时”或“Unicode 漏洞”）所述，在某些情况下，你只需要强制将字节字符串转换为 UTF-8，反之亦然。可以使用标准模块 `Encode` 来实现，或者使用低级调用\
  \ `utf8::upgrade($bytestring)` 和 `utf8::downgrade($utf8string[, FAIL_OK])`。\n\n\
  注意，如果字符串包含不符合字节要求的字符，`utf8::downgrade()`可能会失败。\n\n在已经是目标状态的字符串上调用任何一个函数都不会。\n\n\
  “ASCII 规则与 Unicode 规则”提供了让字符串使用 Unicode 规则的所有方法。\n\n### 在 XS 中使用 Unicode\n\n参见 `perlguts`\
  \ 中的“Unicode Support”以介绍 XS 级别的 Unicode，并参见 `perlapi` 中的“Unicode Support”获取 API\
  \ 详情。\n\n### 破解 Perl 以支持早期版本的 Unicode（仅限极资深黑客）\n\nPerl 默认带有最新支持的 Unicode 版本，但目标是允许你切换到任何更早的版本。然而，在\
  \ Perl v5.20 和 v5.22 中，最早可用的版本是 Unicode 5.1。Perl v5.18 能够处理所有更早的版本。\n\n从 Unicode\
  \ 网站下载所需版本的 Unicode 文件 <>)。这些文件应该替换 Perl 源码树中 `lib/unicore` 中的现有文件。按照该目录下 `README.perl`\
  \ 中的指令更改它们的某些名称，然后编译 perl（参见 INSTALL）。\n\n### 从 perl-5.6.X 迁移代码\n\n从 5.8 开始的 Perl\
  \ 具有的 Unicode 模型与 5.6 不同。在 5.6 中，程序被要求使用 `utf8` 指令来声明给定的作用范围预期处理 Unicode 数据，并且必须确保只有\
  \ Unicode 数据到达该作用范围。如果你有在 5.6 上运行的代码，你可能对代码进行以下某些调整。示例的编写方式使得代码在 5.6 下继续工作，因此你可以安全地尝试它们。\n\
  \n一个应该读取或写入 UTF-8 的文件句柄\n\n```\nif ($] > 5.008) { binmode $fh, \":encoding(utf8)\"\
  ; }\n```\n\n将传递给某个扩展的标量\n\n无论是 `Compress::Zlib`、`Apache::Request` 还是任何在手册中没有 Unicode\
  \ 概念的扩展，你都需要确保剥离 UTF8 标记。注意，在本文写作时（2012 年 1 月），上述模块不是感知 UTF-8 的。请检查文档以验证是否仍然如此。\n\
  \n```\nif ($] > 5.008) { require Encode; $val = Encode::encode_utf8($val); # 转换为字节流\
  \ }\n```\n\n从扩展获取返回的标量\n\n如果你认为标量是以 UTF-8 格式返回的，你很可能想要恢复 UTF8 标记：\n\n```\nif ($]\
  \ > 5.008) { require Encode; $val = Encode::decode_utf8($val); }\n```\n\n如果确实确定是\
  \ UTF-8 \n\n```\nif ($] > 5.008) { require Encode; Encode::_utf8_on($val); }\n```\n\
  \n用于 DBI `fetchrow`、`fetchrow` 和 `fetchrow_hashref` 的 `fetchrow_array` 和 `fetchrow_hashref`\
  \ 包装器\n\n一个已知只包含 ASCII 的大型标量\n\n只包含 ASCII 但被标记为 UTF-8 的标量对你的程序没有好处。如果你识别出这种情况，只需移除\
  \ UTF8 标记：\n\n```\nutf8::downgrade($val) if $] > 5.008;\n```\n\n## BUGS\n\n另见上述“Unicode\
  \ 漏洞”。\n\n### 与扩展的交互\n\n当 Perl 与扩展交换数据时，扩展应该能够理解 UTF8 标记并采取相应的行动。如果扩展不识别该标记，可能扩展会返回标记错误的数据。\n\
  \n因此，如果你正在处理 Unicode 数据，如果 Unicode 数据出现任何问题，请查阅你所使用的每个模块的文档。如果文档完全没有提到 Unicode，请做最坏的打算，并可能需要查看源码以了解该模块的实现。对于受影响的函数，避免数据损坏的简单策略是始终显式地指定交换数据的编码。选择一种你认为扩展可以处理的编码。将传递给扩展的参数转换为该编码，并将结果从该编码转换回来。编写包装函数来为你完成转换，这样以后扩展跟上时，你就可以更改这些函数。\n\
  \n为了举个例子，假设流行的 `Foo::Bar::escape_ht` 函数尚未处理 Unicode 数据。包装函数将把参数转换为原始 UTF-8，并将结果转换回\
  \ Perl 的内部表示，如下：\n\n```\nsub my_escape_ht ($) { my($what) = shift; return unless\
  \ defined $what; Encode::decode_utf8(Foo::Bar::escape_ht( Encode::encode_utf8($what)));\
  \ }\n```\n\n当扩展不转换数据而只是存储和检索数据时，你可以使用原本危险的 `Encode::_utf8_on()` 函数。假设用 C 编写的流行的\
  \ `Foo::Bar` 扩展提供 `param` 方法，允许你按照这些原型存储和检索数据：\n\n```\n$self->param($na, $value);\
  \ # 设置标量 $value = $self->param($na); # 获取标量\n```\n\n\n\n如果尚未提供对任何编码的支持，可以编写一个带有如下\
  \ `param` 方法的派生类：\n\n```perl\nsub param { my($self,$na,$value) = @_; utf8::upgrade($na);\
  \ # make sure it is UTF-8 encoded if (defined $value) { utf8::upgrade($value); #\
  \ make sure it is UTF-8 encoded return $self->SUPER::param($na,$value); } else {\
  \ my $ret = $self->SUPER::param($na); Encode::_utf8_on($ret); # we know, it is UTF-8\
  \ encoded return $ret; } }\n```\n\n因此，扩展程序为数据进入/出口点提供了过滤器，例如 `DB_File::filter_store_key`\
  \ 及其系列。请关注扩展程序文档中的此类过滤器；它们可以使向 Unicode 数据的转换变得更容易。\n\n### 速度\n\n因此，处理 UTF-8 编码字符串的速度比处理字节编码字符串要慢。所有需要跳过字符的函数（如\
  \ `length()`、`substr()` 或 `index()`）或匹配正则表达式的函数，当底层数据为字节编码时运行速度会*更快*。\n\n在 Perl\
  \ 5.8.0 中，这种缓慢程度通常非常惊人；在 Perl 5.8.1 中引入了缓存机制，改善了这种情况。总来说，对 UTF-8 编码字符串的操作仍然较慢。例如，Unicode\
  \ 属性（字符类）如 `\\p{Nd}` 已知比其更简单的对应项如 `[0-9]` 慢得多（5-20 倍，话虽如此，匹配 `Nd` 的 Unicode 字符数百个，而匹配\
  \ `[0-9]` 的 ASCII 字符只有 10 个）。\n\n## 另请\n\nperlunitut, perluniintro, perluniprops,\
  \ Encode, open, utf8, bytes, perlretut, perlvar 中的 ``${^UNICODE}'', <>)。\n\n***\n\
  \n# PERLUNICOOK\n\n## 名称\n\nperlunicook - 在 Perl 中处理 Unicode 的食谱级示例\n\n## 描述\n\n\
  本手册页包含了短食谱，演示了如何在 Perl 中处理常见的 Unicode 操作，末尾附有一个完整的程序。单个食谱中任何未声明的变量假设其已具有之前适当的值。\n\
  \n## 示例\n\n### X 0: 标准序言\n\n除非另有说明，以下所有示例都需要此标准序言才能正常工作，并根据你的系统调整 `#!` 解释器：\n\n\
  ```perl\n#!/usr/bin/env perl use utf8; # 使字面量和标识符可以是 UTF-8 use v5.12; # 或更高版本以获取\
  \ \"unicode_strings\" 特性 use strict; # 强制引用，声明变量 use warnings; # 默认开启警告 use warnings\
  \ qw(FATAL utf8); # 将编码错误视为致命错误 use open qw(:std :utf8); # UTF-8 格式的未声明流 use charnas\
  \ qw(:full :short); # v5.16 中不需要\n```\n\n这*确实*会让即使是 Unix 用户也对二进制流进行 `binmode` 设置，或使用\
  \ `:raw` 打开它们，但这无论如何都是交叉访问这些内容的唯一方法。\n\n**警告**：`use autodie`（2.26 之前）和 `use open`\
  \ 并不兼容。\n\n### X 1: 通用 Unicode 感知过滤器\n\n始终在输入时进行分解，在输出时进行重组。\n\n```perl\nuse Unicode::Normalize;\
  \ while (<>) { $_ = NFD($_); # 分解 + 规范化重排序 ... } continue { print NFC($_); # 重组（可能的）+\
  \ 规范化重排序 }\n```\n\n### X 2: 微调 Unicode 警告\n\n从 v5.14 开始，Perl 区分了三种 UTF-8 警告子类。\n\
  \n```perl\nuse v5.14; # 更早版本不支持 subwarnings no warnings \"nonchar\"; # 66 个禁止的非字符\
  \ no warnings \"surrogate\"; # UTF-16/CESU-8 乱码 no warnings \"non_unicode\"; # 用于超过\
  \ 0x10_FFFF 的码点\n```\n\n### X 3: 为标识符和字面量在 utf8 中声明源\n\n如果没有至关重要的 `use utf8` 声明，在字面量和标识符中使用\
  \ UTF-8 将无法正常工作。如果你使用了上面提供的标准序言，这种情况已经发生了。如果你这样做了，可以进行如下操作：\n\n```perl\nuse utf8;\
  \ my $asure = \"A\\B0ngstro.m\"; my @Xsoft = qw( cp852 cp1251 cp1252 ); my @XXXXXXXXX\
  \ = qw( XXXX XXXXX ); my @X = qw( koi8-f koi8-u koi8-r ); my $motto = \"X X X\"\
  ; # FAMILY, GROWING HEART, DROMEDARY CAMEL\n```\n\n如果你忘记了 `use utf8`，高字节将被误解为独立的字符，一切都无法正常工作。\n\
  \n### X 4: 字符及其数字\n\n`ord` 和 `chr` 函数在所有码点上透明地工作，不仅仅是 ASCII，事实上，它们不只限于 Unicode。\n\
  \n```perl\n# ASCII 字符 ord(\"A\") chr(65) # 基础文字平面上的字符 ord(\"X\") chr(0x3A3) # BMP\
  \ 之外的 ord(\"X\") # 数学斜体小写 N chr(0x1D45B) # Unicode 之外！（最高到 MAXINT） ord(\"\\x{20_0000}\"\
  ) chr(0x20_0000)\n```\n\n### X 5: 按字符数字 Unicode 字面量\n\n在插值字面量中（无论是双引号字符串还是正则表达式），你都可以通过其数字来指定字符。\n\
  \n```perl\n# 插值字面量示例\n```\n\n### X 6: 按数字获取字符\n\n```perl\n# 获取方法示例\n```\n\n### X\
  \ 7: 按数字获取字符\n\n```perl\n# 获取方法示例\n```\n\n### X 8: 显式编码\n\n```perl\n# 显式编码示例\n```\n\
  \n### X 9: Unicode 序列\n\n```perl\n# Unicode 序列示例\n```\n\n### X 10: 自定义别名\n\n```perl\n\
  # 自定义别名示例\n```\n\n### X 11: CJK 码点\n\n```perl\n# CJK 码点示例\n```\n\n\n\n\n\n### X\
  \ 13: 将程序参数解码为 utf8\n\n```bash\n$ perl -CA ... or $ export PERL_UNICODE=A or use\
  \ Encode qw(decode_utf8); @ARGV = map { decode_utf8($_, 1) } @ARGV;\n```\n\n###\
  \ X 14: 将程序参数解码为 locale 编码\n\n```bash\n# cpan -i Encode::Locale use Encode qw(locale);\
  \ use Encode::Locale; # 使用 \"locale\" 作为 encode/decode 的参数 @ARGV = map { decode(locale\
  \ => $_, 1) } @ARGV;\n```\n\n### X 15: 将 STD{IN,OUT,ERR} 声明为 utf8\n\n使用命令行选项、环境变量或显式调用\
  \ `binmode`：\n\n```bash\n$ perl -CS ... or $ export PERL_UNICODE=S or use open qw(:std\
  \ :utf8); or binmode(STDIN, \":utf8\"); binmode(STDOUT, \":utf8\"); binmode(STDERR,\
  \ \":utf8\");\n```\n\n### X 16: 将 STD{IN,OUT,ERR} 声明为 locale 编码\n\n```bash\n# cpan\
  \ -i Encode::Locale use Encode; use Encode::Locale; # 或作为 binmode 或 open 的流 binmode\
  \ STDIN, \":encoding(console_in)\" if -t STDIN; binmode STDOUT, \":encoding(console_out)\"\
  \ if -t STDOUT; binmode STDERR, \":encoding(console_out)\" if -t STDERR;\n```\n\n\
  ### X 17: 让文件 I/O 默认使用 utf8\n\n未指定编码参数打开的文件将使用 UTF-8 编码：\n\n```bash\n$ perl -CD\
  \ ... or $ export PERL_UNICODE=D or use open qw(:utf8);\n```\n\n### X 18: 让所有 I/O\
  \ 和参数默认使用 utf8\n\n```bash\n$ perl -CSDA ... or $ export PERL_UNICODE=SDA or use\
  \ open qw(:std :utf8); use Encode qw(decode_utf8); @ARGV = map { decode_utf8($_,\
  \ 1) } @ARGV;\n```\n\n### X 19: 使用特定编码打开文件\n\n指定流编码。这是处理编码文本的正常方式，而不是调用低级函数。\n\n\
  ```perl\n# input file open(my $in_file, \"< :encoding(UTF-16)\", \"wintext\"); OR\
  \ open(my $in_file, \"<\", \"wintext\"); binmode($in_file, \":encoding(UTF-16)\"\
  ); THEN my $line = <$in_file>; # output file open($out_file, \"> :encoding(cp1252)\"\
  , \"wintext\"); OR open(my $out_file, \">\", \"wintext\"); binmode($out_file, \"\
  :encoding(cp1252)\"); THEN print $out_file \"so text\\n\";\n```\n\n这里可以指定比编码更多的层。例如，咒语\
  \ `:raw :encoding(UTF-16LE) :crlf` 包含了隐式的 CRLF 处理。\n\n### X 20: Unicode 大小写\n\n\
  Unicode 大写与 ASCII 大写非常不同。\n\n```perl\nuc(\"henry X\") # \"HENRY X\" uc(\"tschu.β\"\
  ) # \"TSCHU.SS\" 注意 β => SS # 两者皆真: \"tschu.β\" =~ /TSCHU.SS/i # 注意 β => SS \"XXXXXXX\"\
  \ =~ /XXXXXXX/i # 注意 X,X,X 纯性\n```\n\n### X 21: Unicode 不区分大小写的比较\n\nCPAN 的 Unicode::CaseFold\
  \ 模块中也可用，来自 v5.16 的新函数 `fc` 提供了与 `/i` 模式修符一直使用的相同的 Unicode 大小转换（casefolding）功能：\n\
  \n```perl\nuse feature \"fc\"; # fc() 函数来自 v5.16 # 不区分大小写排序 my @sorted = sort {\
  \ fc($a) cmp fc($b) } @list; # 两者皆真: fc(\"tschu.β\") eq fc(\"TSCHU.SS\") fc(\"XXXXXXX\"\
  ) eq fc(\"XXXXXXX\")\n```\n\n### X 22: 在正则中匹配 Unicode 换行序列\n\nUnicode 换行符匹配双字符 CRLF\
  \ 字形或七个垂直空白字符中的任意一个。适用于处理来自不同操作系统的文本文件。\n\n```perl\n\\R s/\\R/\\n/g; # 将所有换行符归一化为\
  \ \\n\n```\n\n### X 23: 获取字符类别\n\n查找数字代码点的通用类别。\n\n```perl\nuse Unicode::UCD qw(charinfo);\
  \ my $cat = charinfo(0x3A3)->{category}; # \"Lu\"\n```\n\n### X 24: 在内置字符类中禁用 Unicode\
  \ 感知\n\n禁用 `\\w`、`\\b`、`\\s`、`\\d` 和 POSIX 类在当前作用域或仅在单个正则中对 Unicode 正常工作。\n\n```perl\n\
  use v5.14; use re \"/a\"; # OR my($num) = $str =~ /(\\d+)/a;\n```\n\n或者使用特定的非 Unicode\
  \ 属性，如 `\\p{ahex}` 和 `\\p{POSIX_Digit}`。无论字符集修饰符（`/d /u /l /a /aa`）应该产生什么影响，属性仍然正常工作。\n\
  \n### X 25: 在正则中使用 \\p, \\P 匹配 Unicode 属性\n\n这些都匹配具有给定属性的单个代码点。使用 `\\P` 替换 `\\p`\
  \ 来匹配缺少该属性的单个代码点。\n\n```perl\n\\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\\
  pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN,\
  \ \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL,\
  \ \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN,\
  \ \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL,\
  \ \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN,\
  \ \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pL,\
  \ \\pN, \\pL, \\pN, \\pL, \\pN, \\pL, \\pN, \\pp, \\pN, \\pp, \\pN,, \\p, \\p,,\
  \ \\p,, \\,, \\p,, \\pN, \\p, \\ \\,, \\p, \\ \\,, \\,, \\ \\,, \\,, \\ \\, \\ \\\
  ,, \\,, \\,,, \\,, \\ \\,, \\,, \\ \\,, \\,, \\ \\,, \\,,, \\,, \\ \\,, \\,, \\\
