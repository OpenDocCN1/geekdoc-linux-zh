- img_proc: true
  md: 'The whole thing relies on an external micro-USB power supply.


    If you are ahead of the game, you will probably want to use a lithium polymer
    battery with a charging circuit and various switches to control the lighting effects,
    movement, and music.


    Because the / O pins on the Trinket M0 are capacitive, the buttons can even be
    hidden inside the music box. However, the five pins of the Trinket M0 can prove
    restrictive, so you might need a larger microcontroller.


    The rest of the project is old fashioned pre-Christmas handicraft: Choose a material
    that suits you or that you already have.


    Christmas cookie tins, for example, provide a base that suits the time of year,
    and figurines are available from the Christmas sections of many stores. If you
    own a 3D printer, you can even manufacture the moving parts yourself. Figure 6
    shows a prototype.


    The packaging from a recent writable CD purchase was upcycled for the base. Also,
    be sure you don''t underestimate the space you need for the board, cables, speakers,
    and motor. Q Q Q


