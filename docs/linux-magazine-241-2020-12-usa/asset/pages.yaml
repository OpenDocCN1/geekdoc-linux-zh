    # Zorin OS 15.3 Now Available


    Zorin OS is one of those distributions that users love, because it offers tons
    of options.


    Users can work with a typical Linux desktop, one that resembles Windows, or a
    desktop that is decidedly macOS-like. No matter which interface you use, it''s
    still very much Linux underneath.


    With the latest release of Zorin OS, you''ll find new versions of software, as
    well as Zorin Connect, which allows you to easily connect your Android phone to
    the desktop. The latest version of Zorin Connect improves the auto search for
    devices on trusted WiFi networks, adds quick buttons to send files and clipboard
    contents, supports the latest Android release, and includes performance and stability
    enhancements. Zorin OS 15.3 also includes the latest security patches for every
    piece of included software.


    The one caveat to the included software is that the installed LibreOffice version
    is 6.4.6. If you want to upgrade to the latest version (7.0.1.2, as of this writing),
    you''ll have to do that manually.'
