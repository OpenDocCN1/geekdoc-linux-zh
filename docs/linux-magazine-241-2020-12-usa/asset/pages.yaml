  md: 'If so desired, tuptime -csv wil deliver al the information in CSV format. If
    you append a -t, you are given a table that you can redirect to a file and then
    open with a spreadsheet program.


    If you don''t like the date and time format in the output, you can change it using


    ```

    $ tuptime -d ''%H:%M:%S %m-%d-%Y''

    ```


    **Figure 2:** Tuptime offers different display formats. There has been a reboot
    since the tool was instal ed, so two system starts have been counted.


    Tuptime replaces the placeholders beginning with a % % with the corresponding
    values. %H stands for the hours, %M for the minutes, %S for the seconds.


    Similarly, %m returns the month as a number, %d the day, and %Y the year. Details
    of other placeholders are explained in the tuptime documentation,


    which you wil find on GitHub in the tuptime-manual.txt file [1].


    # Conclusions


    If you just want to quickly find out how much time has passed since the last system
    start, you can cal uptime, which is likely to be preinst ed on your system.


    Inst ing tuptime makes particular sense on servers and SBCs like the Raspberry
    Pi running in headless mode. Tuptime can then monitor the startup process and
    reveal the details of, for example, overly frequent reboots or excessively short
    sleep cycles. QQQ'
