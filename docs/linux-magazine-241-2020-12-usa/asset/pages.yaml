    # Linux deepin 20 Released


    Fans of elegant desktops rejoice, deepin 20 has been released. But this new release
    isn''t just about refreshing the most beautiful desktop environment on the market,
    it also has a nifty trick up its sleeve that other distributions might consider
    taking advantage of.


    Deepin 20 is built on Debian 10.5 (aka “Buster”) and nearly every element of the
    user interface was improved: icons, anima-tions, multitask viewer, windows, and
    dialogs. Every element of the desktop has been polished. You''ll find support
    for light and dark themes, color temperature settings, transparency adjustments,
    and an improved power/battery settings tools.


    The best feature found in deepin 20 is the choice of kernels during installation.
    This new option allows users to select the kernel they want installed for the
    desktop. You can either opt for an LTS kernel or the 5.7 series. The one caveat
    to this is that the 5.7 series has already reached its end of life (EOL). So chances
    are pretty good you will to go with the LTS


    kernel. Hopefully, the deepin developers plan on updating this so that the bleeding
    edge option at install will be capable of choosing a'
