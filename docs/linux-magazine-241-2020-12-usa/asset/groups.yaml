- md: "\nIf you want to run more than one Jam.py\n\n```\n#> jam-project.py\n```\n\n\
    Finally, report templates or static files (such as images) that are linked to\
    \ database records. At the same time on the same computer, repeat all the preceding\
    \ steps.\n\nThe jam-project.py command creates the following files and folders\
    \ for each application, giving each application its own reserved folder and TCP\
    \ port number. The two files with the .sqlite extension are SQLite3 single-file,\
    \ server-less databases that contain configuration and localization data. Of course,\
    \ the URLs for the Home and Builder pages of each application would need to change\
    \ to reflect the port number.\n\n```\n#> ls -I\n```\n\n-.sqlite\n- css\n- server.py\n\
    - index.html\n- js\n- langs.sqlite\n- __pycache__\n\nIn order to configure and\
    \ run your Jam.py application, you must start the correct port number. server.py\
    \ script. When I started server.py. Until you are familiar with how Jam.py works,\
    \ however, I encountered another unexpected error:\n\n```\n#> ./server.py\n/usr/bin/env:\
    \ 'python': U\nNo such file or directory\n```\n\nA Simple Bookmark Manager\n\n\
    - server.py\n- static\n- wsgi.py\n- index.html\n\nThis problem might have been\
    \ due to my own Ubuntu boxes being misconfigured because of too much testing.\
    \ In Linux Magazine* 232, I introduced the Shaarli online bookmark manager [3].\
    \ I still use Shaarli for managing quick bookmarks, but after writing that piece,\
    \ I realized that the quick fix was to explicitly pass to server.py the location\
    \ of Python 3 on my system, replacing the first line of the script: earlier in\
    \ this article, and server.py is the interface to the bookmarks I keep collecting.\
    \ I needed a browser-based interface that was much quicker and more script-friendly\
    \ than Shaarli. Most of all, I needed an interface that was compatible with complex\
    \ searches and could process search data in SQL format.\n\n```python\n#! /usr/bin/env\
    \ python\n#! /usr/bin/python3\n```\n\nwsgi.py is an implementation of the Web\
    \ Server Gateway Interface, which allows Python scripts to work behind standard\
    \ Web servers like Apache or NGINX with little or no extra configuration.\n\n\
    I decided copying my bookmarks to a Jam.py application would be an effective solution\
    \ for my problem – and also a nice example for this tutorial. To build the first\
    \ version of that bookmark manager, I followed the standard Jam.py development\
    \ flow.\n\nAfter that simple edit, I could start server.py without errors and\
    \ finally load the Builder page at http://localhost:8080/builder.html in my browser.\
    \ The first thing to do in the Builder page of a Jam.py application is to set\
    \ the application name, the interface language, and the main parameters, most\
    \ of which are visible in Figure 1. For your first project, you may safely leave\
    \ all default values as they are. The Interface tab lets you choose among several\
    \ graphic themes for your application. The second crucial step is to define the\
    \ database engine that your application will use, as well as the parameters to\
    \ connect to it. For SQLite, the only parameters I had to enter in the Database\
    \ box of Figure 2 were the type and name (bookmarks) of the database. This step\
    \ told the Builder to create and format a local file in SQLite format, called\
    \ BOOKMARKS_MAIN table.\n\nFigure 1: The main parameters for every Jam.py application.\n\
    Figure 2: The database configuration panel, showing all the databases supported\
    \ by Jam.py.\n\nSo far all I had was the shell of the database stored in Shaarli.\
    \ I had to create at least one table inside it for my finished adding columns.\
    \ To add records to a table with just one click, but that is no way to insert\
    \ hundreds or thousands of records. In the Builder, you perform these operations\
    \ by clicking on Catalogs in the left pane then selecting the New button to create\
    \ a new item. You’ll then see a form similar to the form shown in Figure 3, which\
    \ serves two purposes. In the upper part, you define the name, primary fields,\
    \ and some other properties. The lower part of the form lists all the columns\
    \ you have in an.\n\nTo add a column, click on the New button at the bottom of\
    \ that form (not visible in Figure 3), and enter all its columns. In the Builder,\
    \ my BOOKMARKS_MAIN table looked like Figure 3.\n\nYou can (re)read my tutorial\
    \ [3] to see how I backed up Shaarli data to a plain text file with one record\
    \ per line and fields separated by pipe (|) characters. Import-database. If you\
    \ want to see how some features work without risking data corruption, importing\
    \ files like that in an SQLite table is very simple, as long as the columns in\
    \ the text file are in the same order as they are in the table. Click on Project\
    \ in the left pane then click on the Database button on the right side and to\
    \ see what the SQLite table is, you can use the table_info directive at the SQLite\
    \ prompt (Listing 1).\n\nIn my case, I had a small problem: the column order in\
    \ Listing 1 is the order I wanted for the SQLite table, but it was not the same\
    \ as in the Shaarli backup file, and there are two extra columns (ID and DELETED).\
    \ Therefore, if I told SQLite to read the Shaarli backup file, almost all values\
    \ would end up in the wrong column or be just discarded. I wrote the ugly, but\
    \ effective little Perl script to generate another plain text file with all the\
    \ columns in the right sequence (Listing 2).\n\nFigure 3: The SQLite table for\
    \ a bookmark manager, with all the fields configured and ready to use.\n\nListing\
    \ 1: Checking the Columns\n```sql\n> table_info(BOOKMARKS_MAIN);\n```\n\nListing\
    \ 2: Rearranging Columns\n```perl\n#! /usr/bin/perl\n$ID = 1;\nwhile (<>) {\n\
    \    chomp;\n    @fields = split(/\\|/, $_);\n    print join(\"|\", $ID, @fields[1],\
    \ @fields[2], @fields[3], @fields[5], @fields[6]), \"\\n\";\n    $ID++;\n}\n```\n\
    \nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\nISSUE 241\n\n# IN-DEPTH\nJam.py\n"
  mdcn: "\n如果你想运行多个 Jam.py\n\n```\n#> jam-project.py\n```\n\n最后，报告与数据库记录链接的报告模板或静态文件（如图像）。同时，在同一台计算机上重复上述所有步骤。\n\
    \n`jam-project.py` 命令会为每个应用程序创建以下文件和文件夹，为每个应用程序提供专属的文件夹和 TCP 端口号。两个扩展名为 `.sqlite`\
    \ 的文件是 SQLite3 单文件无服务器数据库，包含了配置和本地化数据。当然，每个应用程序的首页和 Builder 页面的 URL 需要更改以反映端口号。\n\
    \n```\n#> ls -I\n```\n\n-.sqlite\n- css\n- server.py\n- index.html\n- js\n- langs.sqlite\n\
    - __pycache__\n\n为了配置和运行你的 Jam.py 应用程序，你必须启动正确的端口号。`server.py` 脚本。当我启动 `server.py`\
    \ 时，在你熟悉 Jam.py 的工作原理之前，我遇到了另一个意之外的错误：\n\n```\n#> ./server.py\n/usr/bin/env: 'python':\
    \ U\nNo such file or directory\n```\n\n一个简单的书签管理器\n\n- server.py\n- static\n-\
    \ wsgi.py\n- index.html\n\n这个问题可能是因为我自己的 Ubuntu 机器由于测试过多导致配置不当。在《Linux Magazine》第232期中，我介绍了\
    \ Shaarli 在线书签管理器 [3]。我仍然使用 Shaarli 管理快速书签，但在写完那篇文章后，我意识到快速修复的方法是显式向 `server.py`\
    \ 传递系统中 Python 3 的位置，替换脚本的第一行：本文前面的部分，而且 `server.py` 是我收集的书签的接口。我需要一个比 Shaarli\
    \ 更快且更适合脚本的浏览器界面。最重要的是，我需要一个兼容复杂搜索并能够处理 SQL 格式搜索数据的界面。\n\n```python\n#! /usr/bin/env\
    \ python\n#! /usr/bin/python3\n```\n\n`wsgi.py` 是 Web 服务器网关接口（WSGI）的实现，它允许 Python\
    \ 脚本在无需或无需额外配置的情况下运行 Apache 或 NGINX 等标准 Web 服务器之后。\n\n我决定将我的书签复制到 Jam.py 应用程序是解决我问题的有效方案——这也是本教程的一个很好的示例。为了构建该书签管理器的第一个版本，我遵循了标准的\
    \ Jam.py 开发流程。\n\n在进行简单的编辑后，我可以无错误地启动 `server.py` 并最终在浏览器中加载 http://localhost:8080/builder.html\
    \ 的 Builder 页。Jam.py 应用程序的 Builder 页中的首要工作是设置应用程序名称、界面语言和主参数，大部分参数如图 1 所示。对于你的第一个项目，你可以安全地保持所有默认值不变。Interface（界面）选项卡让你可以在应用程序的几种图形主题之间选择。第二个关键步骤是定义应用程序将使用的数据库引擎以及连接到它的参数。对于\
    \ SQLite，我只需要在图 2 的 Database（数据库）框中输入数据库的类型和名称（bookmarks）。这一步告诉 Builder 在 SQLite\
    \ 格式中创建并格式化一个本地文件，命名为 `BOOKMARKS_MAIN` 表。\n\n图 1：每个 Jam.py 应用程序的主参数。\n图 2：数据库配置面板，显示了\
    \ Jam.py 支持的所有数据库。\n\n到目前为止，我所拥有的只是存储在 Shaarli 中的数据库外壳。我必须在其中至少创建一个表，以便我完成添加列的操作。虽然这只需点击一下即可向表中添加记录，但这样无法插入成百或上千条记录。在\
    \ Builder 中，你通过点击左侧面板中的 Catalogs（目录）然后选择 New（新建）按钮来创建新项目并执行这些操作。你将看到一个类似于图 3 显示的表单，它有两个作用：在顶部，你定义名称、主字段和其他一些属性。表单的下部列出了你在中所有列。\n\
    \n要添加列，点击该表单底部的 New 按钮（图 3 中不可见），并输入它的所有列。在 Builder 中，我的 `BOOKMARKS_MAIN` 表看起来如图\
    \ 3 所示。\n\n你可以（重）读我的教程 [3]，查看我是如何将 Shaarli 数据备份到纯文本文件的，每行一条记录，字段用竖线 (|) 字符分隔。Import-database。如果你想在不冒数据损坏风险的情况下查看某些功能的工作原理，在\
    \ SQLite 表中导入此类文件非常简单，只要文本文件中列的顺序与表中的顺序一致。点击左侧面板的 Project（项目），然后点击右侧的 Database（数据库）按钮，要查看\
    \ SQLite 表的内容，可以在 SQLite 提示符可以使用 `table_info` 指令（列表 1）。\n\n在我的情况下，我遇到了一个小问题：列表\
    \ 1 中的列顺序是我想要的 SQLite 表顺序，但它与 Shaarli 备份文件中的顺序不同，并且有两个额外的列（ID 和 DELETED）。因此，如果我告诉\
    \ SQLite 读取 Shaarli 备份文件，几乎所有的值都会落入错误的列或直接被丢弃。我写了一个丑陋但有效的 Perl 脚本，生成另一个所有列按正确顺序排列的纯文本文件（列表\
    \ 2）。\n\n图 3：用于书签管理器的 SQLite 表，所有字段已配置并准备好使用。\n\n列表 1：检查列\n```sql\n> table_info(BOOKMARKS_MAIN);\n\
    ```\n\n列表 2：重新排列列\n```perl\n#! /usr/bin/perl\n$ID = 1;\nwhile (<>) {\n    chomp;\n\
    \    @fields = split(/\\|/, $_);\n    print join(\"|\", $ID, @fields[1], @fields[2],\
    \ @fields[3], @fields[5], @fields[6]), \"\\n\";\n    $ID++;\n}\n```\n"
