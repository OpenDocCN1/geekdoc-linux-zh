    # DVD

    本月 DVD

    双面 DVD 中收录两款出色的发行版！


    ### KDE neon 5.20.0

    # elementary OS 5.2

    KDE neon 用户版 20201013 是 KDE 软件中 Plasma 桌面环境的最新展示。


    Elementary OS 最初于 2011 年发布。当时，桌面版 Linux 正处于创新浪潮中，KDE 4、Gnome 3 和 Ubuntu 采取了不同的方法。Elementary
    OS 对这一创新的回应是开辟属于自己的道路。


    Elementary OS 构建了自身的 Pantheon 桌面，该桌面经常被与 macOS 进行良性对比，尽管该发行版的开发者表示这种相似性是偶然的。另一些想要保持信息更新但又追求简洁的人抱怨说，这些优点是以牺牲定制为代价的，从而创造了这种稳定性。


    如今，elementary OS 自称为“Windows 和 macOS 的一个快速、开放且尊重隐私的替代品——在此例中为 Ubuntu 20.04。与所有
    LTS 版本一样，20.04 将获得五年的升级和安全补丁支持。”


    这是一个相对新的方向，但毫无疑问，elementary OS 处于桌面创新的前沿。


    elementary OS 并没有遵循任何主流发行版，而是基于 Gnome 桌面构建了自己的 Pantheon 桌面，并开发了自己的实用程序和工具。


    它最著名的工具也许是 Plank，它影响了其他发行版的程序栏。从一开始开始，Pantheon 的目标是成为一个美观且易用的桌面。许多人赞誉 Pantheon
    不仅美观，而且对新用户非常理想。


    启动 KDE neon是为了让感兴趣的用户能够更及时地跟进 Plasma 开发。后来，当 neon 流行起来，创建了用户版以满足那些想要一定稳定性的用户。


    KDE neon 的存在是因为 KDE 开发被分为框架（Framework）、Plasma 和软件编译（曾被指定为 KDE 4.x）。这三个领域以前一起发布版本，但问题是每个领域都按照自己的速度开发。结果导致软件编译发布的
    Plasma 版本有时会比最新落后几个版本。


    KDE neon 是开发者版（Developer’s Edition）的伴侣，后者包含了最新的 Plasma 应用。用户版对于那些想要尝试最新 Plasma
    但又想要一定稳定性的人来说是理想的。


    想要追求尖端 Plasma 的应该查看开发者版。如果你在尝试了像用户版这样的功能 Linux 桌面创新后，想要为操作系统提供更稳定的自动文件清理和色彩调整（这是大多数发行版尚未实现的不同时间段功能），请看看
    Kubuntu，这是另一个流行的 KDE 发行版。


    缺陷光片将更换。请发送邮件至 subs@linux-magazine.com。虽然本《Linux 杂志》经过测试，但对使用相关的任何数据中断、丢失或损坏不负责。


