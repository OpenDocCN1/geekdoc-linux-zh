    # 深度解析


    科学家工具箱


    正在转动魔方。大多数人的工作是提供任何甚至是计算机原生的环境。我希望通过 SageMath 及其交互式的、基于 Web 的笔记本进行这项非常简要的调查，它类似于
    Jupyter [14]，但它也有命令行界面。EMBOSS 可以通过图形界面进行操作。我希望这次对某些可用工具的简要调查能够说服你，采用 Linux 不会让你科学家损失任何东西，反而会获益巨大。图
    6 显示了一个用于图形化显示蛋白质序列的实用可用 Web 界面截图。SourceForge 提供该界面作为演示，因此想要尝试该程序、甚至将其用于实际工作的生物学家，可以在真实数据上进行实验，而通常不需要下载和安装。


    生物学


    # 信息


    随着生物信息学 [15] 作为生物学的一项主要活动出现，计算机作为工具对这一学科变得比以往任何时候都更加核心。生物信息学是计算机科学与生物学的结合，处理 DNA
    序列或其他分子数据序列：本质上是可能包含数百万字母的字符串。这为计算生物学家重新解决该领域的计算问题并发布他们的开源项目提供了机会。


    不仅是分子生物学和生物信息学的全面软件套件，EMBOSS 为任何计算生物学家提供了一个解决语言特征问题的平台。生物信息学在基于基因的药物发现、野生动物保护、癌症治疗、法医分析等领域发挥着巨大作用。


    科学比以往任何时候都更加开放，这种新开放性的一部分既受到了自由软件运动（包括 Linux）的影响也得到了促进。EMBOSS [16] 是欧洲分子生物学开放软件套（European
    Molecular Biology Open Software Suite）的缩写。它是全球许多生物学家使用的主要计算资源。


    EMBOSS 包含 200 个用于快速序列分析、蛋白质可视化、蛋白质结构分析、提供翻译的应用。我应该提到，这 200 个程序是处理某些任务的通用工具。我希望这项非常简要的调查能够说服你，采用
    Linux 不会让你作为科学家损失任何东西，反而会获益巨大。在这个环境中，似乎是成立的。


