    Listing 1: NeoPixel Control


    ```python

    01 import time

    02 import board

    03 import neopixel

    04

    05 pixel_pin = board.D2

    06 num_pixels = 24

    07

    08 pixels = neopixel.NeoPixel(pixel_pin,

    09 num_pixels,

    10 pixel_order=neopixel.GRBW,

    11 brightness=0.05,

    12 auto_write=False)

    13

    14 def rainbow(wait):

    15 for j in range(255):

    16 for i in range(num_pixels):

    17 rc_index = (i * 256 // num_pixels) + j

    18 pixels[i] = colorwheel(rc_index & 255)

    19 pixels.show()

    20 time.sleep(wait)

    21

    def colorwheel(pos):

    22 if pos < 0 or pos > 255:

    23 return (0,0,0,0)

    24 if pos < 85:

    25 return (255 - pos * 3, pos * 3, 0, 0)

    26 if pos < 170:

    27 pos -= 85

    28 return (0, 255 - pos * 3, pos * 3, 0)

    29 pos -= 170

    30 return (pos * 3, 0, 255 - pos * 3, 0)

    31

    while True:

    32 rainbow(0.1)

