    通常情况下，你会从发行版的仓库安装 Asciidoctor。但是，如果缺少某些组件（例如 `asciidoctor-epub3`），你可以在 ad-system
    中制作的文档中使用 Ruby 自身的 gem 安装设置来导入缺失的组件；或者，直接从 Ruby 仓库调整 gem 的语言和格式，例如输出结果以及文档类型。这些指令被写在紧接文档头之后的的行注释中。


    ```

    $ gem install asciidoctor-epub3

    ```


    调用 `a2x <file>` 将使用所有可用选项翻译文档。该工具将 gem 安装在 `~/.gem/ruby/2.7.0/bin/` 中。你必须将此路径包含系统环境变量
