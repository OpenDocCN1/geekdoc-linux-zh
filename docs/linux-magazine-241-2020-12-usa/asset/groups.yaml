    # 观点

    ## 欢迎

    ### 虚幻的光


    亲爱的读者：


    本月，威斯康星州政府拒绝了结构性改进，但他们确实成功停止了向富士康（Foxconn）支付可退还税收补贴，以及对台湾企业的税收优惠——至少目前如此。这家于 2017
    年来到威斯康星州的财团唯一失去的是他们的时间和关注——投入时间开发一个更好、更有承诺的工厂，一个本可以让 LCD 电视和显示器生产更现实的解决方案，以及处理和雇用
    13,000 人的支出投入。似乎这个“项目”在真正启动时，从未涵盖过你需要解决的所有细节。最初的 13,000 名工人愿景很快缩减到 5,200 人；然后继续暴跌。当然，他们本可以把宝贵的时间花在进一步，因为似乎没有人对这些试图引入不同类型工厂（比如人们想要做的拖拉机工厂）的人有愿景。当很清楚这不再是一个工厂或小部件工厂，而是一个生产
    LCD 屏幕（某种电脑显示器）的工厂将是无法盈利的时（或者他们本可以花费等额资金来培育本土产业）。我知道很容易在事后指责，他们已经建造的巨大空间本可以其他用途。现在我猜测，我不禁想，对于一项能让他们留住这项计划的事，事情之所以在他们错误的构想中变得如此离谱，也许是补贴，他们每个人都会被高科技虚幻的光环所吸引。他们探索了替代方案，如创新服务、鱼类养殖和存储。最终，他们低声细语并推向高潮，只是刚刚开始增加工人，以在
    2019 年底达到 520 名员工的最低目标，但政府……大湖！他们从未这样做过。州政府没有明确的任务分配，其中许多人……不符合合同条款的条件。目前，他们还没有如何处理该空间的计划，但看起来极可能永远不会会用它进行
    LCD 制造或任何高科技制造。


    在这种惨剧之后，指责别人很容易的。前州长斯科特·沃克（Scott Walker）的政府确实因为他们的天真而理应受到一些责。国家政府也没有帮助，在地面上宣称富士康工厂将是“世界第八大奇迹”。而且，如果你是一个认为亚洲公司稀少且经营良好的人，那么最近关于富士康的故事无疑会让你消除这种想法。真正的问题是，美国存在一种不同州之间相互竞争并提供激励措施以与其他地方“赢得”这些合同的惯做法。威斯康星州可能不会放弃这么多——如果他们不需要与其他州竞争富士康的关注的话，他们会持更怀疑的态度。州和地方政府估计花费了
    4 亿美元用于富士康的基础设施……。


    真正的问题是，美国存在一种不同州之间相互竞争并提供激励措施以“赢得”这些合同的惯做法。州和地方政府估计为这些富士康的空工厂花费了 4 亿美元基础设施。


    LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM

    第 241 期 | 2020年12月


