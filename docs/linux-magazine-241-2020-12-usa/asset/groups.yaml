    # Mathematics


    The symbolic mathematics program Maxima [12] is extremely useful. It is light,
    fast, and available from any distribution''s package manager. Maxima is the open
    source successor to the venerable commercial program Macsyma. It is written in
    Lisp and can handle many areas of mathematics, such as basic algebra, calculus,
    trigonometry, differential equations, series, and much more. Maxima uses gnuplot
    to draw graphs, but that''s OK, because you''ve already followed my advice and
    installed it. It can print its output in the form of TeX math markup, which you
    can paste directly into your TEX documents (see the Writing Papers section).


    Figure 5 shows a quick calculation in Maxima, a screenshot from my laptop. On
    the top is a terminal window, and below that a gnuplot graph. In the terminal,
    I''ve invoked Maxima (which starts instantly) and defined an ordinary differential
    equation using Maxima’s syntax for derivative operators. Notice that the inputs
    and outputs are numbered, so you can use them in subsequent expressions. Maxima
    repeats the equation, but in a more visual form, using ASCII characters to approximate
    what the math is supposed to be.


    **Figure 5:** A Maxima session, showing the setting up, solving, and graphing
    of the solution to Bessel’s differential equation.


