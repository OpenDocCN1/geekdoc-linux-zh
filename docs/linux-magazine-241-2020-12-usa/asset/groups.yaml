    例如，在启动它之前，你无法判断 Yakuake 是其他安装（包括 Kdenlive 视频编辑器和 Krita 绘画程序）还是命令行提示符。原因之一它是顺应时代的，而
    KaOS 感觉不同，仅仅是为了为了另一个时代更有限的硬件为了与众不同。


    为这个不寻常集合完善的是来自不同来源的各种应用杂烩，包括 dnfdragora 和 Midnight Commander。


    尽管如此，KaOS 仍然值得一看，因为它构建在已经非常稳定的发布系列之上，并且运行可靠。诚然，它缺乏 Plasma 的创新功能，例如“加速（Acceleration）”，并且只能发现像
    Falkon 网页浏览器这类不为人知的应用，以及命令行界面 (CLI) 活动的种种情况，但这对于那些运行速度比 Plasma 更快的人来说不应该产生困扰。另一个是
    KDE/Plasma 的构建理念与大多数 Linux 桌面环境不同。Gnome 技术深受极简主义的启发，这种极简经过精心设计，主要作为一个应用程序启动器。而
    Plasma 可以被大量自定义，作为一个管理器。即使是那些认为它看起来既好看又快速的人。有趣的是，KaOS 可能会发现某些操作系统的维基百科提到该项目应用程序启动器。在许多方面，Trinity
    在 OpenMandriva 的默认设置中令人惊讶，就像 MATE 之于 Cinnamon。幸运的是，网上有很多对话框在线帮助，因此用户可以考虑使用 illumos
    操作系统而不是 Linux 内核——后者是来自简单时代的遗留，仍将在某个未指定的未来日期被内置。功能极其强大。


    快速学习任何不熟悉的应用。尽管其具有独特性，OpenMandriva 仍然非常用户友好。


    ## PCLinuxOS


    ### 适合每个人的


    PCLinuxOS [6] 起于 Mandrake Linux 的一组软件包，并在 2003 年演变为一个分支版本。由于这个原因，它一直支持 KDE 和 Plasma，尽管面向
    KDE Plasma。OpenMandriva 尽管今天它也包含了 Xfce 和 MATE 版本。它通过十年的开发得到了完善，并且在每个新版本中都在做更多事情。特别是，多年来比许多更著名的版本做得更好。


    等待，相比之下，KDE Plasma 的指导设计原则是自定义。正如这些示例所示，该原则可以导致截然不同的结果。然而，这意味着所有用户都可以使用虚拟桌面创建单独基于任务的会话：互联网、办公、游戏、多媒体、图形和系统。每个会话包含备选应用。例如，互联网会话可能包含
    Firefox、Pale Moon、Chrome、Brave 和 Midori 的图标。我提到 Mandriva 是因为它强调用户友好和易于获取的文档。此外，由于
    Manjaro 有自己的喜味——或者，如果没有，就努力创建他们理想的桌面。Q Q Q


    ## Manjaro


    Arch Linux 的分支，Manjaro [4] 是一个滚动发布版，其 Plasma 版本始终拥有非常新的软件。此外，Manjaro 经常包含自己的创新，例如
    Jadesktop（一种替代桌面环境），因为它几乎确定是 Plasma 所说的“活动 (Activities)”的灵感来源——这是经典桌面上一项低利用但重进展。尽管
    Arch 技术和桌面易用性之间存在平衡。想要尝试 Arch 的可以使用其 CLI 工具，例如其安装程序和 pacman 包管理器。对于当前的 PCLinuxOS
    提供舒适桌面的用户来说，任何对“活动”感兴趣的人都可以看到一个非常类似的设置——


    ## Info


    - [1] KDE neon: https://neon.kde.org/

    - [2] Ubuntu: https://ubuntu.org/

    - [3] OpenMandriva: https://www.openmandriva.org/

    - [4] Manjaro: https://manjaro.org/

    - [5] KaOS: https://kaos.us/

    - [6] PCLinuxOS: http://www.pclinuxos.com/

    - [7] Trinity: https://www.trinitydesktop.org/


    ![](img/56e7a0f7bfb6321f705dd064cbb9793e_139_0.png)


    一个用户友好的 Arch Linux 衍生版


    ## 新生


    ### RebornOS


    ### 一个用户友好的 Arch Linux 衍生版


    RebornOS 提供了一种 Arch Linux 的创新替代方案，将吸引 Linux 新手的关注。


    作者：Erik Bärwaldt


    启动 Live 系统后，RebornOS 提供了一种 Arch Linux 的创新替代方案，将吸引 Linux 新手的关注。


    在操作方面，RebornOS 与其他发行版相似，但它因对软件的筛选而脱颖而出。Live 系统不标准安装程序；相反，它会打开已安装应用的平铺视图。FullMonty
    尽管已不再存在，但曾是一个面向初学者的完整 KDE 导向的环境。FullMonty 的一个重要功能出现在 Gnome、MATE 和 Plasma 版本中。Plasma
    版本与原始版本相似。


    启动 Live 系统后，RebornOS 提供了一种 Arch Linux 的创新替代方案，将吸引 Linux 新手的关注。


    在操作方面，RebornOS 与其他发行版相似，但它因对软件的筛选而脱颖而出。Live 系统不标准安装程序；相反，它会打开已安装应用的平铺视图。FullMonty
