    master image, copy it on to a removable disk disk. The DRBL Live CD is available
    both as an ISO that you can burn to a CD and as a compressed IMG file that you
    can transfer on to a USB disk either. If your computer empire extends only to
    a couple of computers, you''ll be happy using Clonezilla through Live environment.
    On bigger networks, where you have a large number of computers to deploy, it''s
