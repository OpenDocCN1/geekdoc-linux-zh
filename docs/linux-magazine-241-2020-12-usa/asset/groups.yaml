- md: "\n... and give this new distribution a try.\n\n# Ubuntu Groovy Gorilla Beta\
    \ Available\n\nCanonical has released the first beta version of the upcoming 20.10\
    \ release, named Groovy Gorilla, a non-long-term support release (LTS). The support\
    \ window for Short Term Releases (STR) is only nine months. After that nine months\
    \ expires, users of STR releases will receive no updates. So keep that in mind,\
    \ when installing these non-LTS versions of Ubuntu.\n\nThat being said, if you\
    \ want the latest and greatest version of Ubuntu, the STR releases are a good\
    \ choice.\n\nThe features and improvements to be found in Ubuntu 20.10 include\
    \ the newest Gnome release (3.38). With Gnome 3.38, you'll enjoy the ability to\
    \ manually arrange icons in the Applications grid, as well as folder support in\
    \ the grid, scale-aware application grid sizing, a new Restart option in the System\
    \ menu, WiFi sharing QR codes, a much-improved sound recorder and screenshot app,\
    \ and new parental controls in the Settings app. For more information on the GNOME\
    \ 3.38 release, check out the MORE ONLINE official release notes (https://help.gnome.org/misc/release-notes/3.38/).\n\
    \nUbuntu 20.10 also features dramatically improved support for fingerprint logins.\
    \ Plus, the Ubuntu installer now has Active Directory integration, Firefox finally\
    \ includes high precision touchpad scrolling, and Linux kernel 5.8 is running\
    \ under the hood.\n\nTo download an ISO image for Ubuntu 20.10, head over to the\
    \ official download page (http://releases.ubuntu.com/20.10/) and grab yourself\
    \ a copy.\n\n# Why Good Applications Don’t Scale\n- Jeff Layton\n\n# Microsoft\
    \ Finally Set to Release\n\nYou have parallelized your serial application, but\
    \ as you use more cores you are not seeing any improvement in performance.\n\n\
    # Edge Browser for Linux\n\nBack in 2019, Microsoft teased that it was going to\
    \ bring its Edge browser to Linux. What gives?\n\nAnd then, all went silent. Many\
