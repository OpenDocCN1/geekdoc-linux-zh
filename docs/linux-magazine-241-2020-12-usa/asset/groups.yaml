    # COVER STORY


    System Hardening


    ## Log In by Key Only


    What could be better than the strongest password? No password at all. SSH lets
    you prove your identity with a cryptographic key instead of the password. To do
    this, you first create a key pair.


    ### Listing 3: Password Rules


    ```bash

    password requisite pam_pwquality.so retry=3 minlen=9 difok=4 lcredit=-2 ucredit=-2
    dcredit=-1 ocredit=-1 reject_username enforce_for_root

    ```


    # Table 1: Pwquality Parameters


    | Parameter | Meaning |

    | :--- | :--- |

    | retry | Number of permitted incorrect entries |

    | minlen | Minimum password length of 4096 bits |

    | difok | Number of characters that may match the old password |

    | lcredit | Minimum number of lowercase letters |

    | ucredit | Minimum number of uppercase letters |

    | dcredit | Minimum number of digits |

    | ocredit | Minimum number of special characters |

    | reject_username | Password and username must not be identical |

    | enforce_for_root | Rules also apply to root |


    ```bash

    $ ssh-keygen -t rsa -b 4096

    ```


    The command now wants to know where to store the keys. The recommendation is to
    keep the default settings and simply press Enter. Then you decide whether you
    want to protect the key with a passphrase – giving you additional protection should
    the key ever fall into the wrong hands. If you simply press Enter, the key can
    be used without a passphrase (Figure 5).


    To enforce more complex passwords, you have to make another adjustment to the
    `/etc/pam.d/common-password` file. Look for the line that reads `password requisite
    pam_pwquality.so retry=3`. By attaching various parameters, you can harden the
    rules for new passwords (Listing 3). The individual parameters give you an easy
    option for controlling password requirements (see Table 1).


    ```bash

    $ ssh-copy-id bob@IP_address

    ```


    After a reboot, the new password controls are active. If you now try to change
    Bob''s password to 12345678, the system will force you to follow the rules in
    `/etc/pam.d/common-password`. It rejects your attempt to input 12345678 (Figure
    4).


    As long as you practice this process for all users who log in on the remote system,
    you can also completely disable password-based logins. To disable password logins,
    change the `PasswordAuthentication` line to `PasswordAuthentication no` in the
    `/etc/ssh/sshd_config` configuration. After restart, the SSH service, login by
    password won’t be possible – therefore is key-based only.


    ## Fail2ban


    The attacker usually leaves an automated attack. Tools such as Fail2ban do not
    completely prevent attacks but they ramp up the time required for frustration.
    Fail2Ban consists of a server daemon and a client. The program reads one or more
    logfiles and checks each line with regular expressions. For example, if a defined
    number of login attempts is exceeded, Fail2Ban can use iptables to block the IP
    address for a configurable time. You can install Fail2ban on remote computers
    without moving a muscle. Many distributions come with Fail2ban already preconfigured
    to let start working with it right after installation.


