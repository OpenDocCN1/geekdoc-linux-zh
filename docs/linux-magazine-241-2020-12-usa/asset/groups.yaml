    # 表 1：pwquality 参数


    | 参数 | 含义 |

    | :--- | :--- |

    | retry | 允许的错误次数 |

    | minlen | 最小密码长度（4096） |

    | difok | 与旧密码允许不同的字符数 |

    | lcredit | 小写字母数量 |

    | ucredit | 大写字母数量 |

    | dcredit | 数字数量 |

    | ocredit | 特殊字符数量 |

    | reject_username | 密码和用户名不能相同 |

    | enforce_for_root | 规则同样适用于 root |


