- md: "\nSometimes you try something on a system, play around with it. By default,\
    \ the ban beam hits anyone who generates three failures and then forget it. Forgotten\
    \ services pose a security risk on ex-login failures in 10 minutes or less. Fail2ban\
    \ blocks the exposed systems. It is useful to check from time to time what incoming\
    \ IP address accessed the system for one hour. You can adapt these values to actually\
    \ running on the system, and specifically, which services suit your own by changing\
    \ the findtime, maxretry, and bantime parameters in the configuration file.\n\n\
    An easy way to check which services are running is the netstat -tlpn command,\
    \ which you need to call with administrative rights. netstat provides a tabular\
    \ list of all services and the ports to which you have bound.\n\nIntrusion Detection\
    \ Systems (IDS) are usually complex applications that try to detect and report\
    \ unusual activities on the system. On the system shown in Figure 8, for example,\
    \ InfluxDB is running. But you can also go one size smaller. A one-liner (Listing\
    \ 4) running along with a few other services is all you need to keep track of\
    \ who is logging on to this service and when. It is open for arbitrary access\
    \ from the network and system listening for requests on port 8086 – showing 0.0.0.0:port_number\
    \ for IPv4 and :::port_number for IPv6. On a conventional home network, port 8086\
    \ would still have to be forwarded from the WLAN router to the computer for the\
    \ service to be accessible from the Internet.\n\nLet's assume you don't have time\
    \ to work with InfluxDB right now. You want to disable the service, but leave\
    \ it installed in place so that you can continue using it later. To do this, stop\
    \ InfluxDB with the systemctl stop influxdb command first. The command is executed,\
    \ but it does not give you any output.\n\nTo check that InfluxDB really isn’t\
    \ running anymore, take a look at /var/log/syslog or the Systemd log (Listing\
    \ 5).\n\nHowever, the fact that you have stopped the service now does not mean\
    \ that it will remain permanently disabled. After a restart, it would start again\
    \ automatically. You can prevent the service from starting automatically by typing\
    \ systemctl disable influxdb.\n\n[1] Automatic updates: https://wiki.debian.org/UnattendedUpgrades\n\
    \n[2] List of most common passwords: https://en.wikipedia.org/wiki/List_of_the_most_common_passwords\n\
    \nThe steps described in this article are only the beginning – you have many other\
    \ matters to think about before you keep your kingdom safe from invaders. Q Q\
    \ Q\n\n## Listing 5: Checking /var/log/syslog\n\n```\nJul 18 11:22:37 influxd[11322]:\
    \ ts=2020-07-18T10:22:37.769190Z lvl=info msg=\"Closed service\" log_id=OO4MSfDG000\
    \ service=subscriber\nJul 18 11:22:37 influxd[11322]: ts=2020-07-18T10:22:37.769493Z\
    \ lvl=info msg=\"Server shutdown completed\" log_id=OO4MSfDG000\nJul 18 11:22:37\
    \ systemd[1]: influxdb.service: Succeeded.\n```\n\n## Conclusion\n\nYou can honestly\
    \ declare that your Internet-facing Linux computer is truly secure.\n\n## Securing\
    \ Your SSH Server\n\n### Tips for securing your SSH server\n\nAn SSH server facing\
    \ the Internet will almost certainly be under attack, but a few proactive steps\
    \ will help to keep the intruders away. By Secure Shell, better known as SSH,\
    \ is a secure communication protocol used to execute commands on remote servers.\
    \ SSH works on a client/server architecture. Data transferred through SSH is automatically\
    \ encrypted using symmetric, asymmetric, and hashing algorithms. At receiving\
    \ end, the data is automatically decrypted.\n\nAbout 90 percent of system administrators\
    \ use SSH to access the servers and configure them remotely. Users overwhelmingly\
    \ prefer SSH over Telnet, an alternative communication protocol that is now considered\
    \ insecure. SSH makes the data in transit more secure, but if you wish to secure\
    \ an SSH server, you need to take some additional steps. Following are some measures\
    \ that will help you protect your SSH server from attack.\n\n### Public Keys Instead\
    \ of Passwords\n\nThe article on \"System Hardening\" elsewhere in this issue\
    \ mentioned the benefits of using key authentication rather than passwords with\
    \ SSH. Your password can be cracked by intruders, and you could end up getting\
    \ hacked by a simple brute-force password attack. Here is a quick reprise on how\
    \ to set up key-based authentication.\n\nThe first step is to generate the SSH\
    \ keys on a client machine. You can generate keys in the terminal by running the\
    \ following command (as shown in Figure 1):\n\n```\nubuntu@ubuntu:~$ ssh-keygen\n\
    ```\n\n```\nuser@ubuntu:~$ ssh-keygen\nEnter file in which to save the key (/home/user/.ssh/id_rsa):\
    \ /home/user/.ssh/id_rsa\nGenerating public/private rsa key.\nEnter passphrase\
    \ (empty for no password): \nEnter same passphrase again: \nYour unique id key\
    \ has been generated and saved in /home/user/.ssh/id_rsa.\nPublic key is saved\
    \ in /home/user/.ssh/id_rsa.pub.\nuser@ubuntu:~$\n```\n\n### Setting the Password\
    \ Tries Limit\n\nAnother way to keep your SSH server secure from brute force attack\
    \ is to set password tries limit. When you set a limit, an attacker will not be\
    \ able to access the SSH server after a specific number of unsuccessful password\
    \ tries. Of course, this could also cause complications for an authorized user\
    \ who is having a bad memory day or forgets to check the Caps Lock key. Another\
    \ approach is to use the Fail2ban utility, which suspends access the SSH server\
    \ from the client machine for a predefined time interval and then lets the user\
    \ try again.\n\n### MaxTries 3\n\nOn the server, now change the public key file\
    \ name and permission. Remove the # sign and set the number to 3, as shown in\
    \ Figure 3. After changing the sshd_config file, restart the SSH server by running\
    \ the following command:\n\n```bash\n$ sudo systemctl restart ssh\n```\n\nNow\
    \ change the permissions by running the following commands:\n\n```bash\n$ chmod\
    \ 700 ~/.ssh\n$ chmod 600 ~/.ssh/authorized_keys\n```\n\nNow, no one will be able\
    \ to get access to your SSH server after three unsuccessful password tries. Now\
    \ it is time to test whether the server works or not. Try to connect to the SSH\
    \ server from the client machine:\n\n```bash\n$ ssh -p [ssh_port] username@server_ip\
    \ -i /path/\n```\n"
  mdcn: "\n有时你会在系统上尝试某些操作并对其进行测试。默认情况下，封禁策略（ban beam）会命中任何产生三次失败的用户，然后忘记他们。对于遗忘的服务在\
    \ 10 分钟或更短时间内之前的登录失败会构成安全风险。Fail2ban 会拦截这些暴露的系统。定期检查过去一小时内哪些接入 IP 地址访问了系统是非常有用的。你可以根据系统的实际运行情况调整这些值，具体来说，可以通过更改配置文件中的\
    \ `findtime`、`maxretry` 和 `bantime` 参数来确定哪些服务适合你的需求。\n\n检查正在运行的服务的一种简单方法是使用 `netstat\
    \ -tlpn` 命令，你需要以管理员权限调用它。`netstat` 提供了一个表格列表，列出所有服务以及你对这些服务绑定的端口。\n\n入侵检测系统（IDS）通常是复杂的应用程序，旨在检测并报告系统上的异常活动。例如，在图\
    \ 8 所示的系统中，InfluxDB 正在运行。但你也可以选择更小规模。只需一个与其他几个服务一起运行的单行命令（列表 4），就可以跟踪谁在何时登录了该服务。它对网络的任意访问是开放的，系统在端口\
    \ 8086 上监听请求——IPv4 显示为 `0.0.0.0:port_number`，IPv6 显示为 `:::port_number`。在传统的家庭网络中，端口\
    \ 8086 必须从 WLAN 路由器转发到计算机，才能从访问访问服务。\n\n假设你现在没有时间处理 InfluxDB。你想禁用该服务，但让它保持安装以便以后继续使用。要做到这一点，首先使用\
    \ `systemctl stop influxdb` 命令停止 InfluxDB。该命令会执行，但不会给你任何输出。\n\n要检查 InfluxDB 是否真的不再运行，请查看\
    \ `/var/log/syslog` 或 Systemd 日志（列表 5）。\n\n然而，你现在停止了服务并不意味着它将永久禁用。重启后，它会自动再次启动。你可以通过输入\
    \ `systemctl disable influxdb` 来防止服务自动启动。\n\n[1] 自动更新：https://wiki.debian.org/UnattendedUpgrades\n\
    \n[2] 常用密码列表：https://en.wikipedia.org/wiki/List_of_the_most_common_passwords\n\
    \n本文描述的步骤只是开始——在保护你的王国免受入侵者侵害之前，还有许多许多事情需要考虑。Q Q Q\n\n## 列表 5：检查 /var/log/syslog\n\
    \n```\nJul 18 11:22:37 influxd[11322]: ts=2020-07-18T10:22:37.769190Z lvl=info\
    \ msg=\"Closed service\" log_id=OO4MSfDG000 service=subscriber\nJul 18 11:22:37\
    \ influxd[11322]: ts=2020-07-18T10:22:37.769493Z lvl=info msg=\"Server shutdown\
    \ completed\" log_id=OO4MSfDG000\nJul 18 11:22:37 systemd[1]: influxdb.service:\
    \ Succeeded.\n```\n\n## 结论\n\n你可以坦诚地宣布，你面向互联网的 Linux 计算机确实是安全的。\n\n## 加固你的 SSH\
    \ 服务器\n\n### 加固 SSH 服务器的技巧\n\n面向互联网的 SSH 服务器几乎会受到攻击，但采取一些主动措施将有助于将入侵者隔之门外。Secure\
    \ Shell（更广为人知的 SSH）是一种用于在远程服务器上执行命令的安全通信协议。SSH 工作在客户端/服务器架构上。通过 SSH 传输的数据会自动使用对称、非对称和哈希算法进行加密。在接收端，数据会自动解密。约\
    \ 90% 的系统管理员使用 SSH 访问服务器并进行配置。用户极倾向于使用 SSH 而非 Telnet（现在被认为是不安全的通信协议）。SSH 使传输数据更加安全，但如果你希望保护\
    \ SSH 服务器，你需要采取额外的措施。以下是帮助你保护 SSH 服务器的一些措施。\n\n### 使用公钥代替密码\n\n本文其他部分的“系统加固”文章提到了使用密钥认证而非密码的处处。密码可能会被入侵者破解，你可能会被简单的暴力破解攻击所入侵。这里快速回顾如何设置密钥认证。\n\
    \n第一步是在客户端机器上生成 SSH 密钥。你可以在终端运行以下命令（如图 1 所示）：\n\n```\nubuntu@ubuntu~$ ssh-keygen\n\
    ```\n\n```\nuser@ubuntu~$ ssh-keygen\nEnter file in which to save the key (/home/user/.ssh/id_rsa):\
    \ /home/user/.ssh/id_rsa\nGenerating public/private rsa key.\nEnter passphrase\
    \ (empty for no password): \nEnter same passphrase again: \nYour unique id key\
    \ has been generated and saved in /home/user/.ssh/id_rsa.\nPublic key is saved\
    \ in /home/user/.ssh/id_rsa.pub.\nuser@ubuntu~$\n```\n\n### 设置密码尝试限制\n\n另一种保护\
    \ SSH 服务器的方法是设置密码尝试限制。设置限制后，攻击者在多次失败尝试后将无法访问 SSH 服务器。当然，这也会给记忆不佳或忘记检查锁定键的授权用户带来麻烦。另一种方法是使用\
    \ Fail2ban 工具，它会在预定义的间隔内暂停客户端访问 SSH 服务器，然后允许用户重试。\n\n### MaxTries 3\n\n在服务器上，更改公钥文件名和权限。取消\
    \ `#` 并将数字设置为 3，如图 3 所示。更改 `sshd_config` 文件后，运行以下命令重启 SSH 服务器：\n\n```bash\n$ sudo\
    \ systemctl restart ssh\n```\n\n现在运行以下命令更改权限：\n\n```bash\n$ chmod 700 ~/.ssh\n\
    $ chmod 600 ~/.ssh/authorized_keys\n```\n\n现在，在三次失败密码尝试后，任何人都无法访问你的 SSH 服务器。现在是测试服务器是否正常工作了。从客户端机器连接\
    \ SSH 服务器：\n\n```bash\n$ ssh -p [ssh_port] username@server_ip -i /path/\n```\n"
