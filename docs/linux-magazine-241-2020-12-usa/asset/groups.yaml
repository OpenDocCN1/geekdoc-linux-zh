    # 封面故事文章


    # 系统加固


    # 保护 Linux 系统的简单步骤


    # 安全第一


    **良好的声誉并保护你的 Linux 系统免受攻击。我们将为你展示一些检测和防御入侵者的技巧。** 作者：Charly Kühn 对于任何面对互联网的计算机来说，安全都是问题，而解决方案可以根据你的需要变得尽可能大且全面。防火墙、渗透测试和入侵防御系统（IPS）都是重要的，但在开始添加这些关键安全层之前，你就可以为保护系统做很多工作。本文强调了一些非常简单以至于经常被忽视的基础安全步骤。


    如果你正在管理一个可以从头安装的 Linux 系统，请记住，系统上的服务越少意味着攻击途径越少，因此一种值得的方法是忽略所有你并不需要的东西。许多发行版提供了专门设计的精简版版本，以减少攻击面。然后你可以设置一个微型
    Linux 并仅导入你真正需要的包。


    系统运行后，请保持其最新状态。特别是安全更新，需要每天检查并立即安装。许多发行版都有安装安全更新的自动化过程。例如，在 Debian 和 Ubuntu 上，术语是“无人升级（unattended
    upgrades）[1]


    除了安装更新和只使用你需要的服务等老生常谈之外，一些额外的操作确实可以帮助减少你的受攻击风险。继续读下了解你现在可以采取的一些简单步骤。


    # 禁用 Root 登录


    root 账户属于最高权限的用户，其密码对于攻击者来说是一个极具价值的目标。一些现代 Linux 替代方案（如 Ubuntu）默认禁用 root 登录，但其他
    Linux 发行版仍允许它。如果系统可以通过互联网通过 SSH 访问，你将会发现列表 1：/var/log/auth.log


    01


    ```

    $ egrep -i fail /var/log/auth.log

    ```


