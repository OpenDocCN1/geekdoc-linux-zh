    ## Conclusion


    Securing an SSH server is always a big challenge for IT professionals. Despite
    every precaution, sometimes servers get hacked. Since intruders adopt different
    methods to attack servers, you similarly have to adopt different methods to make
    your server secure. This article has discussed several steps for securing SSH
    servers, including public key encryption, whitelisting and blacklisting, changing
    the default SSH port, setting the password tries limit, and adding two-factor
    authentication. See the “System Hardening” article elsewhere in this issue for
    more on configuring your Linux server to face the perils of the Internet.


