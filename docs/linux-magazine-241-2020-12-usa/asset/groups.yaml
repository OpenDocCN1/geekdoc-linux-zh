    are written as comments in the lines directly after the document header.


    ```

    $ gem install asciidoctor-epub3

    ```


    A call to a2x <file> translates the document with all available options. The tool
    installs gems in ~/.gem/ruby/2.7.0/bin/. You must include this path in the system
    PATH variable.


    In some cases, as in the example of asciidoc-epub3, there are no packages officially
    necessary as of yet, and you will receive an error message. If there are packages
    that are still under development, you can test them with the --pre option:


    ```

    $ gem install asciidoctor-epub3 --pre

    ```


    In this case, the install will be performed and both Asci Doc and Asciidoctor
    extensions will be added.


    # Differences


    Asci Doc and Asciidoctor differ in some details.


    For simple documents, this is at most a minor issue. However, if you make full
    use of the capabilities of each piece of software, the differences become more
    apparent. You will find examples of In search for the (Asciidoctor only) string,
    which designates for Asciidoctor these features. In most cases the capabilities
    of Asciidoctor go beyond what Asci Doc supports, however thanks to the built-in
    compatibility mode,


    Table 1: Asciidoctor Command-Line Options


    | Option | Effect |

    | --- | --- |

    | -b <Format> | Creates output as HTML5 (default), XHTML5, DocBook 5, manpage
    or with appropriate plugins – as PDF, LaTeX, or EPUB |

    | -d <Type> | Besides the classics article (default), book, and manpage, Asciidoctor
    prefers output for included code, like single blocks, paragraphs, or similar |

    | -o <File> | Saves the output under the specified name |

    | -D <Directory> | Saves the result in the specified directory |

    | -s | Suppresses headers and footers (for included documents) |

    | -n | Auto numbering of sections |

    | -a <Attribute> | Set Asci Doc attributes (overwrites existing ones in the document)
    |

    | -B <Base> | Defines the base directory for additional code; default is the current
    directory |

    | -V | Warning level, from which error codes were generated: WARN, ERROR, INFO,
    |

    | --failure-level <Level> | FATAL (default) |

    | -S | Sets safe mode level; disables potentially insecure structures like include::
    |


    # UI Macros


    | Shortcut | Purpose |

    | --- | --- |

    | F11 | Toggle fullscreen |

    | Ctrl + T | Open a new tab |

    | Ctrl + Shift + N | New incognito window |

    | Ctrl + \ | Used to escape characters |

    | Ctrl + ] | Jump to keyword |

    | Ctrl + + | Increase zoom |


    Asciidoctor can handle anything you formatted with Asci Doc. Having said this,
    the newcomer now supports UI macros for keyboard shortcuts (Figure 1). Also interesting
    in Asciidoctor does not offer a counterpart for the command a2x, see box, "Asci
    Doc’s a2x Command." Alternatively, you can specify the options at the shell prompt.
    As a special feature, a2x has the --epubcheck option to automate the process of
    calling the a2x tool, which identifies potential problems in EPUB documents. In
    the manner of program code. This allows for sentence swapping, commenting out,
    and other manipulation much like in any programming language.


    # PDF Options


    Like AsciiDoc, Asciidoctor is usually directly oriented to HTML, which makes it
    easier to convert to the formats based on it, including AsciiDoc, EPUB. The classic
    structure of AsciiDoc is more or less trolled via the command line. The most important
    options, which are very similar to those of it, are summarized in Table 1. A command
    and call without options translates the specified file with the .adoc extension
    to HTML5:


    ```

    $ asciidoctor tst.adoc

    ```


    There are several ways to create PDFs, and they can lead to quite different results.
    If you prefer to create linear documents such as books, you will probably prefer
    PDFs.


    Generate some HTML output, call it in the browser, and export it as a PDF. This
    approach offers quite extensive further editing. By default the tool suppresses
    messages during conversion. It only shows you serious errors, such as the absence
    of embedded images. But this does not stop. Alternatively, you can use the DocBook
    5 tool chain via a2x. Asciidoctor lets you create PDFs directly with Asciidoctor,
    but often with less than optimal results. When switching from Asci Doc to Asciidoctor,
    there are some differences to be considered, which are summarized in chapter 9
    of the user manual [9].


    This does not always work as intended, but the process is quite fast. The disadvantage
    is that there are no meaningful error messages, and errors often remain undetected
    for a long time. For example, in terms of the syntax, there is now only the _<Text>_
    syntax for text in italics, `<Text>` for code, `+{Text}+` for literal text in
    code. Double quotation marks are created with "<Text>" code with Asci Doc or Asciidoctor
    and convert as single quotation marks with "<Text>".


    Yet another option is to use LaTeX. You can create it in the conventional way
    with LaTeX''s own tools. For titles, the = <Title> syntax (asymmetrical) remains
    valid, but not the symmetrical form = <Title> =) or the form using underlining.
    Underlining in the title automatically leads to the use of compatibility mode.
    Section 9.8 in the manual also provides additional LaTeX know-how and often manual
    fine-tuning. Regardless of which path you choose, bear in mind that interactive
    elements are nearly always lost in the conversion.


    # Conclusions


    Asciidoctor proves to be a worthy successor to AsciiDoc. Its speed and additional
    plugins, along with direct support in AsciiFX [10], make it a good, although more
    complex alternative. So is there no longer any reason to use Asci Doc? That depends.
    For example, a tool chain that works well for ebooks is not to be sneezed at,
    and the results sometimes turn out to be more compact than the results produced
