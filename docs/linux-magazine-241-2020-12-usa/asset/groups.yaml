  mdcn: "\n\n# 内核中的 Rust\n\n重要的内核消息将不会输出\n\n此时，Petr Mladek 在崩溃之前采取了所有比 C 语言更好的选择，仅仅因为\
    \ Linus 尝试性地松了口气的锁（lock）——导致了这一点。正如 Rust 语言开发团队负责人 Josh Triplett 回复的，锁尚未及时发布。\n\
    \n一切看起来都很顺利。John 的补丁似乎是让事情变得更好的更大努力的一部分。显然，他追踪了内核输出空日志行的问题所在。Nick 的帖子写道：他已经发现了一个\
    \ bug，该 bug 会导致产生额外的行来填充日志行号之间的间隙。\n\n> “我希望能看到一条将事情 \n> 变得得好的路径。Linus Torvalds\
    \ \n> 将 Rust 整合进内核，只要我们能 \n> 确保读者能够：\n> 正确地填充 printk() 输出的间隙。”\n\n有合适的 Rust 接口可以将内容重新组合成连贯的文本行，使用既自然又安全。但\
    \ Petr 说：“我无法找到任何简单甚至有效的解决方案来以无锁的方式维护单调序列号，并且对于所有存储片段（缓冲区+长度对）都是通用的。读者将看到并返回 incomplete_line。”\n\
    \n然而，Petr 确实提出了一个不悦的建议：\n- 补全行，而下一个条目仍在另一个 CPU 上生成。\n\n建议：\n- 这些 Rust 接口易于与内核一起进行维护和演进。\n\
    - 我们提供了超越基础安全性的有说服力的用例，例如并发检查或用于对象所有权的生命周期。\n- 我们让 Rust 自然地融入内核的规范和标准，同时在合适的地方引入一些\
    \ Rust 的规范和标准。（我们想要融入内核，同时，我们也不想匆忙切掉所有没有立即显现的棱角，直到很长一段时间后的另一个……）\n\n“我担心唯一可行的解决方案是将所有片段存储在单一的无锁事务中。然后读者将决定是否重新转转那行不完整的行，因为它在另一个\
    \ CPU 上发生了并发。我认为 John 提议过某种方法。”\n\nJohn 提议使用第二个较小的无锁缓冲区来处理。这个问题在用户空间中可能会被妥善处理，但实践中并没有。因此，你会看到很多日志工具会将所有这些后续内容报告为独立的日志事件。\n\
    \n“另一种解决方案是为每个上下文和 CPU 使用单独的缓冲区。问题是缺少最后的 ‘n’。这正是 LOG-CONT 的意义所在——为了让这种情况*不*发生。”这可能会导致缓冲区未关闭。他说他只会接受这种补丁，“只要内核能确保值。我们慢慢来。）”\n\
    \n- 消息在合并发生在同一个上下文中打印，并在同一台 CPU 上的某处对它进行操作。\n\n- 我们缓慢且谨慎地进行，使得——\n\n“第二个较小的日志缓冲区看起来不需要在\
    \ printk() 时代发生，如果我们能够解决无锁刷新（flush），这是一个更好的选择。只要不完整的记录不会被暴露给并发读者即可。”\n\n他补充说，“这显然确保了它是渐进式的引入，并给人们时间将\
    \ Rust 工具链整合到他们的内核工作流中。”\n\n该线程中没有进一步的讨论了。\n\n“此外，关于我的‘Rust 语言团队’，John 说他正在处理这件事，而且他戴着帽子，我很乐意有发现，因为整个重点是让\
    \ Linux 内核接入 Rust 语言 printk() 不那么令人反感。但显然 Linus 对此也很严格。我们正在制定开发优先级。如果构建 Rust 在涉及到内核内部接口时非常跳跃，那么为了避免破坏\
    \ printk() 变化需要巨大的努力。保持维护性可能是一条漫长的路。”\n\nLinus 应该看到语言的哪些增强最能服务这些需求。Linus 舒了一口气非常尝试性的口气，说：\n\
    \n“多年来，我们得到了 printk——”\n\nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\n\n新闻\n内核新闻\n\
    \n这一点，Josh 指道，“据我记得，Greg 的旧编译器（4.1 直到2018 年），我们现在需要 6 年前的 gcc (4.9) 或 1 年前的 clang/\
    \ llvm。我不知道这些发行版内核的更新是否会随着时间的推移而完全统一，但似乎额外导致了不同版本的 Rust 编译器——我们为新内核发布要求的工具链版本，在我们有足够的时间进行尝试之前应该是稳定的。这对我来说也完全合理。”\n\
    \n“内核中 Rust 的使用是否会在从一个稳定版本升级到下一个稳定发布时提供保证。”\n\n然而，Linus Torvalds 对此恰恰反对。\nJosh\
