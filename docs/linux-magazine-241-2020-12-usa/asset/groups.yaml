- md: "\n# IN-DEPTH\n\nClonezilla SE\n\nto change the default boot order; the exact\
    \ process varies from one manufacturer to another.\n\nOnce you boot the computer\
    \ after making the change, it'll pick up the DRBL server instance running over\
    \ the network. You'll be shown a Clonezilla GRUB menu with a few entries. Select\
    \ the default Clonezilla: save disk (choose later) as image (choose later) option\
    \ (Figure 4). This entry is set for the cloning task you've just set up in the\
    \ previous step. The (choose later) is displayed because you deferred the decision\
    \ to select the disk you wish to clone.\n\nWhen the computer has booted, you'll\
    \ be asked for the image's name. Go with the disk you want to clone. If the computer\
    \ has multiple disks, use the space bar to pick the one you want to image. It\
    \ is usually good to check if the system is good, you can choose to skip the check\
    \ and go with the default value (2000MB). If you don't want to split the cloning\
    \ process, run fsck on the disk before initiating.\n\nSimilarly, after creating\
    \ the disk's image, Clonezilla suggests you replace the default value with a large\
    \ number that’s greater than the size of your disk (Figure 5). Once that’s done,\
    \ the DRBL can save some time by electing to skip such check, such as 1000000MB.\
    \ However, remember that the server is notified of this check, but I’d suggest\
    \ you allow that if the image repository has a FAT32 filesystem, this value cannot\
    \ be larger than 4096MB since FAT32 can’t read files larger than 4GB. You now\
    \ have an image that is storable and you can clone to all the other computers\
    \ in your network. The penultimate step is to select the client action after it\
    \ has been imaged.\n\n## Deployment Process\n\nThe server is now ready. You’ll\
    \ be returned to the prompt, but don’t close the terminal window just yet. Now\
    \ head over to the computer that you want to clone.\n\nTo initiate the deployment\
    \ process, head to the machine running the Live DRBL environment. Notice that\
    \ the terminal you had left open will now show the details of the cloning process\
    \ (Figure 6). The figure to clone is set to boot from the network.\n\nYou can\
    \ now safely close the terminal.\n\nFrom the desktop, double-click the head into\
    \ the BIOS Clonezilla server icon again. You'll again see that the process can\
    \ take quite a while.\n\n## Preparing for Cloning\n\nShut down the client after\
    \ its disk has been imaged.\n\n```\nbash\nThis window must remain in the clones\
    \ spawned by Clonezilla can work and stable.\nodesbian:/dev/sda1 192.168.1.102\
    \ (00:89:27:ba:a1:64) finished cloning. Status: success: /dev/sda1 7.4 GB = 8110\
    \ Blocks, 122 min\nsuccess: /dev/sdb1 12.3 MB = 30068 Blocks, 153 min\nrootdebian@home/user#\
    \ \n```\n(root) # If you closed the CLONE-GUI window, and it fails to boot with\
    \ an error message like \"Missing Operating System\" or \"Invalided System\",\
    \ then you can try to (1) change the boot order in your BIOS and restart. You\
    \ can try to use parameter -1 when restarting.\nThis script will generate the\
    \ host-based PXE config files in /tboot/root/\nClean all the previous cached PXE\
    \ config files if they exist...done\nClonezilla has finished cloning all targets.\
    \ If they exist...done\nNext time you can run this command directly:\nsh root@192.168.1.102\n\
    [2023-09-19 10:41:51] [root@192.168.1.102 ~]#\n```\nPress F5 to edit boot options\n\
    Clonezilla Linux 9.0-6-9 run on DHCP\n\n# DRBL\nFree Software License NCHC Team\n\
    免費軟體許可 國家資訊網路計算中心\n\nI usually choose the clients-to-wait option, since I know\
    \ the number of computers on which I want to deploy the image. Again, Clonezilla\
    \ will work its magic and drop you back at the console. Leave it as it is and\
    \ head to the computers where you want to deploy the image.\n\n## Deploying the\
    \ Images\n\nBefore you power on the computers, make sure they are configured to\
    \ boot from the network. After you power on, select the highlighted option from\
    \ the Clonezilla GRUB menu that begins with Clonezilla: multicast restore ...\
    \ (Figure 7).\n\nThe computer will boot and wait until the number of computers\
    \ you specified in the previous step have all been powered on. Once they are all\
    \ up, Clonezilla will initiate the process to deploy the image on the machines.\
    \ When it’s done, the machines will be rebooted into the cloned environment. The\
    \ existing contents of this target will be wiped.\n\n## Conclusion\n\nClonezilla\
    \ supports three restoration modes. There’s Broadcast and Multicast for Unicast\
    \ for cloning multiple machines.\n\nThe process might seem involved if you haven’t\
    \ cloned multiple machines before. However once you get the hang of it, you’ll\
    \ be amazed at Clonezilla SE’s power and dexterity. Remember however that Clonezilla\
    \ uses some very unforgiving tools to do its magic. I suggest first experimenting\
    \ with it on computers with blank disks. You can even create a virtual lab with\
    \ a virtual network inside VirtualBox to familiarize yourself with the process\
    \ of cloning and restoring multiple machines before you use it on physical hardware.\n"
  mdcn: "\n\n# 深度解析\n\nClonezilla SE\n\n要更改默认启动顺序；具体过程因制造商而异。\n\n一旦在更改后启动电脑，它将识别到运行在网络上的\
    \ DRBL 服务器实例。你将看到一个包含若干条目的的 Clonezilla GRUB 菜单。选择默认的 Clonezilla：保存磁盘（稍后选择）作为镜像（稍后选择）选项（图\
    \ 4）。此条目适用于你从上一步中刚刚设置的克隆任务。显示（稍后选择）是因为你推迟了选择要克隆磁盘的决定。\n\n当电脑启动后，系统会要求输入镜像名称。选择你想要克隆的磁盘。如果计算机有多个磁盘，使用空格键选择要映像的磁盘。通常最好检查系统是否正常，你可以选择跳过检查并使用默认值（2000MB）。如果你不想分割克隆过程，请在启动前对磁盘运行\
    \ `fsck`。\n\n同样，在创建磁盘镜像后，Clonezilla 建议你将默认值替换为大于磁盘大小的数字（图 5）。完成后后，DRBL 可以通过跳过此类检查来节省时间，例如\
    \ 1000000MB。然而，请记住，服务器会通知此检查，但我建议如果镜像仓库使用的是 FAT32 文件系统，请允许这样做，此值不能超过 4096MB，因为\
    \ FAT32 无法读取大于 4GB 的文件。你现在有了一个可以存储的镜像，并将其克隆到网络中的所有其他计算机。倒数第二一步是在映像完成后选择客户端操作。\n\
    \n## 部署过程\n\n服务器现在已就绪。你将返回到提示符，但先不要关闭终端窗口。现在前往你想克隆的那台电脑。\n\n要启动部署过程，请前往运行 Live\
    \ DRBL 环境的机器。注意，你之前一直开启的终端现在将显示克隆过程的详情（图 6）。要克隆的图形已设置为从网络启动。\n\n你现在可以安全地关闭终端了。\n\
    \n从桌面上，再次双击 BIOS 中的 Clonezilla 服务器图标。你将再次看到该过程可能需要相当长时间。\n\n## 准备克隆\n\n在磁盘映像完成后关闭客户端。\n\
    \n```\nbash\n此窗口必须保持打开，以便由 Clonezilla 生成的克隆节点能够工作并保持稳定。\nodesbian:/dev/sda1 192.168.1.102\
    \ (00:89:27:ba:a1:64) 克隆完成。状态：成功：/dev/sda1 7.4 GB = 8110 Blocks, 122 min\nsuccess:\
    \ /dev/sdb1 12.3 MB = 30068 Blocks, 153 min\nrootdebian@home/user# \n```\n(root)\
    \ # 如果你关闭了 CLONE-GUI 窗口，并且它启动时出现“缺少操作系统”或“无效系统”之类的错误消息，你可以尝试 (1) 在 BIOS 中更改启动顺序并重启。你可以尝试在重启时使用参数\
    \ -1。\n此脚本将在 /tboot/root/ 中生成基于主机的 PXE 配置文件\n正在清理所有之前的缓存 PXE 配置文件……已完成\nClonezilla\
    \ 已完成所有目标的克隆。如果它们存在……已完成\n下次你可以直接运行此命令：\n`sh root@192.168.1.102\n[2023-09-19 10:41:51]\
    \ [root@192.168.1.102 ~]#\n```\n按 F5 编辑启动选项\nClonezilla Linux 9.0-6 运行在 DHCP 上\n\
    \n# DRBL\nFree Software License NCHC Team\n免费软件许可 国家资讯网络计算中心\n\n我通常选择等待客户端的选项，因为我知道要部署镜像的计算机数量。再次，Clonezilla\
