    KDE neon was begun so that interested users could be more up to date on Plasma
    development. Later, when neon became popular, the User Edition was created for
    those who wanted to have a measure of stability.


    KDE neon exists because KDE development is divided into Framework, Plasma, and
    Software Compilation (which used to be designated as KDE 4.x). These three areas
    used to release versions together, but the trouble was that each developed at
    its own pace. As a result, the version of Plasma released in the Software Compilation
    can sometimes be several versions behind the latest one.


    KDE neon is the companion to the Developer’s Edition, which contains the very
