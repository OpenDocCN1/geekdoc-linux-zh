    如果你在超级强大、设计精美的家庭自动化、家庭监控或网络爬虫方面做过任何事情，那么你可能已经签名并实现了跨越各种网络服务的自托管可视化编程界面，你可以轻松从
    Raspberry Pi（或任何其他 Linux 设备）运行它。它不包含 IFTTT（“If Then That”的缩写）。IFTTT 让你轻松地将设备数据映射到另一个设备或服务，例如
    Google 日历、Nest 账户、Twitter 或灯开关。


    Node-RED 已经存在几年了。它由 IBM 开发并在 2016 年作为开源项目发布，成为 Linux 基金的一部分。它刚刚启动了一个带有限制账户的免费层。


    Node-RED 允许你拖放节点来连接硬件设备、API 和在线服务。它提供了一个视觉编辑器来将这些节点连接起来，为硬件和软件应用程序创建自定义逻辑。它是构建基于家庭自动化和数据处理系统的强大工具。

