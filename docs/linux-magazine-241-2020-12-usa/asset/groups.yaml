    立场，尽管许多共享主机确实允许用户通过 SSH 连接到共享服务器。鉴于此，在典型的共享托管环境中，共享托管供应商通常不提供 root 权限，用户将无法访问除其用户目录（/home/foo）之外的文件系统的任何部分。从备份的角度来看，这种
    root 权限的缺失让工作变得有些困难。虽然比活跃的第三方供应商和托管服务提供商市场更具创意的方法，例如从虚拟专用服务器（VPS）或提供各种类型云到云备份和数据提取解决方案的旧版服务提供商（MSPs）进行备份，但许多工具都是专有的，并非设计为允许轻松复制到本地源（例如用户的桌面）。尽管如此，这仍然是可以轻松实现的。


    以下是我设置的方案。


    ### 1. 验证本地主机与主机的身份


    此外，尽管像 WordPress 等许多流行应用程序都有自己的备份和恢复插件，但如果你的网络托管环境的文件系统未通过服务器身份验证——或者它没有运行内容管理系统（CMS），这些插件显然没有帮助。


    这是通过通常的方式完成的。在 Linux 机器终端中生成并设置 SSH 密钥（如果你还没有的话），或者深入底层查看其系统的运行机制。共享网络托管环境通常包含
    cPanel 网络托管控制面板以便于管理。该面板具有 SSH 功能，可以在其中导入并验证公钥。为它们生成密钥。对于他们来说，使用如 rsync [1] 等
    SSH 工具备份文件和数据库，通常比希望第三方解决方案提供他们正在寻找的数据备份功能是更优选择。


    ### 2. 通过 SSH 连接并运行 Rsync 拉取


    Rsync 是最为人知的备份和恢复命令行工具之一。它最早于 90 年代中期发布，掌握 rsync 知识是许多系统管理员和备份管理员的基本的基本工作要求。该工具支持使用
    rsync 从源到目的地传输。为了做到这一点，同步到各种网络远程目标。请注意语法的顺序（应该是源，然后是目的地）。最近，rclone [2] 扩展了其功能，以支持将数据备份到云端。混淆源和目的地可能会导致灾难性的后果，并可能让你后悔没有早点考虑备份！


    常规备份选项范围（全量、增量和差异备份）。


    如果你只是尝试备份位于例如 /example.com/ 的 WordPress 安装中的文件，我建议直接从 WordPress 根目录进行备份，以避免不必要的文件垃圾
    '' ''（有些主机现在会这样做），然后你需要传递那个你通常可以在共享托管环境中用户根目录级找到的路径。通过 . 连接到 SSH 连接。否则，你可以像往常一样通过
    22 端口连接——只需修改命令的语法即可。


    例如，从 /home/youruser/public_html/wp 备份到目标。接下来，运行命令并验证该目录已在你的本地机器上成功构建。


    ```bash

    rsync -arvz -e ''ssh -p 12345'' yourhost@123.456.789.71:/home/youruser/ /backups/hosting/website1

    ```


    ### 3. 获取 MySQL 数据库


    不幸的是，由于限制，拉取的文件系统将不包含你的网络托管用户名的 MySQL 数据库，而它是许多动态服务（包括 WordPress）不可或缺的组件。有两种方法可以绕过这个问题。


    现在让我们分解托管服务器上的那个 cron 任务。rsync 调用以运行数据库备份工具，该工具随后进入，这些命令组合在一起并以减号符号为前缀：将输出放在你可以使用
    rsync 任务访问的地方。用于此目的的工具是：


    - -a 以归档模式运行 rsync。它递归地运行 mysqldump，这是获取 MySQL 数据库副本的主要实用。它还保持了文件权限、所有权和符号链接的完整性。

    - -r 递归运行 rsync。mysqldump 可用于备份数据库。

    - -v 是详细输出参数。这对于调试命令很有用。

    - -z 在发送时压缩文件。


    当然，你想要将 yourhost 替换为你的网络托管用户名，并将示例 IP 替换为需要连接的共享网络服务器的实际公网 IP。


    ### 4. 脚本化与自动化


    在将此加入 Bash 脚本并设置为 cron 运行之前，需要对其进行 QA（质量保证）测试。首先，确保它工作正常。接下来，你需要将它拉取到你的共享托管环境中。如果你的主机坚持要求你通过非标准端口通过
    SSH 连接以提高安全性，你需要传递 ''sh -p 12345''——显然将 12345 替换为他们要求你连接的端口号。


    ```bash

    #!/bin/bash

    rsync -arvz -e ''ssh -p 12345'' yourhost@123.456.789.71:/home/youruser/public_html/
    /backups/hosting/website1/files/

    rsync -arvz -e ''ssh -p 12345'' yourhost@123.456.789.71:/home/youruser/backups/mysql/
    /backups/hosting/website1/mysql/

    ssh -p 12345 yourhost@123.456.789.71 "mysqldump -u myuser -p''password'' database"
    > /backups/hosting/website1/mysql/database.sql

    ```


