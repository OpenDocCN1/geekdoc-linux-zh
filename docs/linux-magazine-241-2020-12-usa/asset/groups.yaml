    \n# IN-DEPTH\n\nCommand Line – Vimwiki\n\n## A personal wiki for the command line\n\
    \nQuick Wiki\n\nDo yourself a favor by reading the help before beginning Vimwiki\
    \ (Figure 1). Vimwiki, a Vim add-on, offers a simple and effective command-line\
    \ wiki with a choice of markup languages. **By Bruce Byfield** In addition to\
    \ the .vimrc file, you need to know the leader key that prefaces each keybinding.\
    \ If you do not know the ways to install it [2]. However, one of the easiest ways\
    \ is to install a Vim package and then generate the help tags:\n\n```\n:echo mapleader\n\
    ```\n\nWikis have been a mainstay of free software development ever since they\
    \ were first developed by Ward Cunningham in 1994. Today, they are best-known\
    \ from sites like Wikipedia. As a collection of notes, to-dos, announcements,\
    \ or even journals, a wiki remains ideal for project development, whether for\
    \ a group or for an individual. Vimwiki [1] is a simple but effective wiki engine,\
    \ flexible in its choice of markup and relatively quick to learn once it is set\
    \ up.\n\n```\n:echo mapleader\n```\n```\ngit clone U\n```\nhttps://github.com/vimwiki/vimwiki.git\
    \ U\n```\n~/.vim/pack/plugins/start/vimwiki\n```\n```\nvim -c 'helptags U\n```\n\
    ```\n~/.vim/pack/plugins/start/vimwiki/doc' U\n```\n```\n-c quit\n```\n```\n:let\
    \ mapleader=\"KEY\"\n```\n\nAll of the installation methods require that your\
    \ home directory include a .vimrc file with the following lines: The leader can\
    \ be any key, but popular ones are (,) or backslash (\\). Like Vim add-ons, Vimwiki’s\
    \ in-ones are (,). Stall depends on what plugin manager, if any, you use. Vimwiki’s\
    \ GitHub page offers a summary of all the different plugins on syntax. Note: If\
    \ you are less experienced with Vim, remember that commands are entered in Vim\
    \ by pressing the Esc key to switch into command mode and then preface each command\
    \ with a colon (:).\n\nAuthor: Bruce Byfield is a computer journalist and a freelance\
    \ writer and editor specializing in free and open source software. In addition\
    \ to his writing projects, he also teaches live and e-learning courses. In his\
    \ spare time, Bruce writes about Northwest coast art (http://brucebyfield.wordpress.com).\
    \ He is also co-founder of Prentice Pieces, a blog about writing and fantasy at\
    \ (https://prenticepieces.com/).\n\n# Getting Started\n\nA vital piece of information\
    \ that is missing from most Vimwiki documentation is how to display the online\
    \ help. While you have the online help displayed, you can do the solution is simple\
    \ once you know it.\n\n```::help vimwiki```\n\n42\n\nDECEMBER 2020\n\nISSUE 241\n\
    \nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\n\n# CONTENTS\n\n- 1. Intro vimwiki-intro\n\
    - 2. Prerequisites vimwiki-prerequisites\n- 3. Mappings vimwiki-global-mappings\n\
    \  - 3.1. Global mappings vimwiki-global-mappings\n  - 3.2. Local mappings vimwiki-local-mappings\n\
    \  - 3.3. Text objects vimwiki-text-objects\n- 4. Commands vimwiki-commands\n\
    \  - 4.1. Global commands vimwiki-global-commands\n  - 4.2. Local commands vimwiki-local-commands\n\
    - 5. Syntax vimwiki-syntax\n  - 5.1. Typefaces vimwiki-typefaces\n  - 5.2. Lines\
    \ vimwiki-lines\n  - 5.3. Paragraphs vimwiki-paragraphs\n  - 5.4. Lists vimwiki-lists\n\
    \  - 5.5. Edits vimwiki-edits\n  - 5.6. Preformatted text vimwiki-preformatted\n\
    \  - 5.7. Mathematical formulae vimwiki-math\n\n# IN-DEPTH\n\nCommand Line – Vimwiki\n\
    \nSyntax Types\n\nFigure 1: Vimwiki comes with extensive help. The first time\
    \ you use Vimwiki, enter the command section. For example, if you have two wikis,\
    \ you can navigate them using the basic commands shown in Table 1. Another built-in\
    \ Vimwiki feature is the double square brackets []. To make a link that contains\
    \ multiple words, press the v key to enter Vim's visual mode, and select the words\
    \ for the link and press Enter. Multiple wikis can exist as subdirectories of\
    \ the same directory by defining each in .vimrc, giving each a unique number and\
    \ name.\n\n```\n:echo mapleader\n```\n\nYou can quit Vim with the command q! or\
    \ wq if you want to save what you have just written. Whichever installation method\
    \ you choose, you can confirm a successful installation by entering :help vimwiki.\n\
    \nA vital piece of information that is missing from most Vimwiki documentation\
    \ is how to display the online help. While you have the online help displayed,\
    \ you can do the solution is simple once you know it.\n"
  mdcn: "\nGit 仓库完全按照你的意愿运行。Q Q Q\n\n# 信息\n\n- [1] GitHub Git 插件：https://github.com/topics/git-addons\n\
    - [2] Steve Mao 的 Awesome Git 插件：\n\n图 5：git-sizer 提供了相关信息，帮助你控制仓库的大小。https://github.com/stevemao/awesome-git-addons\n\
    \nQ Q Q\n\n40\n\n2020年12月\n\n第241期\n\nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\n\
    \n# 通过特刊精进你的技能！\n\n从我们的特刊库中了解 Shell、LibreOffice、Linux 等更多内容。\n\n*Linux Magazine*\
    \ 团队创建了一系列单本，让你深入研究你感兴趣的主题。提供纸质版或数字版。\n\n# 查看完整库！\nshop.linuxnewmedia.com\n\n\
    ![](img/56e7a0f7bfb6321f705dd064cbb9793e_220_0.png)\n\n# 深度解析\n\n命令行 – Vimwiki\n\
    \n## 命令行个人 wiki\n\n快速上手\n\n在开始使用 Vimwiki 之前，通过阅读帮助文档来为自己帮忙吧（图 1）。Vimwiki 是一个 Vim\
    \ 插件，提供了一个简单且有效的命令行 wiki，并可选多种标记语言。**作者：Bruce Byfield**。除了 .vimrc 文件外，你还需要知道每个按键绑定之前的导前键（leader\
    \ key）。如果你不知道安装方法，可以 [2]。然而，最简单的方法之一是安装 Vim 插件然后生成帮助标签：\n\n```\n:echo mapleader\n\
    ```\n\n自 Ward Cunningham 在 1994 年首次开发它们以来，Wiki 一一直是自由软件开发的主流。今天，它们因诸如 Wikipedia\
    \ 这样的网站而闻名。作为笔记、待办事项、公告甚至是日志的集合，Wiki 对于小组或个人的项目开发来说都是理想的工具。Vimwiki [1] 是一个简单但有效的\
    \ wiki 引擎，在标记语言的选择上灵活，一旦设置好上手非常快。\n\n```\n:echo mapleader\n```\n```\ngit clone\
    \ U\n```\nhttps://github.com/vimwiki/vimwiki.git U\n```\n~/.vim/pack/plugins/start/vimwiki\n\
    ```\n```\nvim -c 'helptags U\n```\n```\n~/.vim/pack/plugins/start/vimwiki/doc'\
    \ U\n```\n```\n-c quit\n```\n```\n:let mapleader=\"KEY\"\n```\n\n所有的安装方法都要求你的主目录中包含一个带有以下行的\
    \ .vimrc 文件：导前键可以是任何键，但常用的有 (,) 或反斜杠 (\\)。像 Vim 插件一样，Vimwiki 的默认导前键是 (,)。安装取决于取决于你使用（如果有的话）哪种插件管理器。Vimwiki\
    \ 的 GitHub 页面提供了关于所有不同插件的摘要。注意：如果你对 Vim 经验较少，请记住在 Vim 中通过按 Esc 键切换到命令模式，然后在每个命令前加一个冒号\
    \ (:)。\n\n作者：Bruce Byfield 是一名计算机记者，也是一名专精自由和开源软件的自由作家和编辑。除了他的写作项目外，他还教授授直播和在线课程。在空闲时间，Bruce\
    \ 写关于西北海岸艺术的文章（http://brucebyfield.wordpress.com）。他还是 Prentice Pieces 的联合创始人，这是一个关于写作和幻想的博客（https://prenticepieces.com/）。\n\
    \n# 入门\n\n大多数 Vimwiki 文档中缺失的一项重要信息是如何显示在线帮助。一旦你显示了在线帮助，只要你知道了方法，解决方案就很简单。\n\n\
    ```::help vimwiki```\n\n42\n\n2020年12月\n\n第241期\n\nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\n\
    \n# 目录\n\n- 1. 简介 vimwiki-intro\n- 2. 前提条件 vimwiki-prerequisites\n- 3. 映射 vimwiki-global-mappings\n\
    \  - 3.1. 全局映射 vimwiki-global-mappings\n  - 3.2. 本地映射 vimwiki-local-mappings\n\
    \  - 3.3. 对象 vimwiki-text-objects\n- 4. 命令 vimwiki-commands\n  - 4.1. 全局命令 vimwiki-global-commands\n\
    \  - 4.2. 本地命令 vimwiki-local-commands\n- 5. 语法 vimwiki-syntax\n  - 5.1. 字体 vimwiki-typefaces\n\
    \  - 5.2. 行 vimwiki-lines\n  - 5.3. 段落 vimwiki-paragraphs\n  - 5.4. 列表 vimwiki-lists\n\
    \  - 5.5. 编辑 vimwiki-edits\n  - 5.6. 预格式文本 vimwiki-preformatted\n  - 5.7. 数学公式\
    \ vimwiki-math\n\n# 深度解析\n\n命令行 – Vimwiki\n\n语法类型\n\n图 1：Vimwiki 附带丰富的帮助信息。第一次使用\
    \ Vimwiki 时，进入命令部分。例如，如果你有两个 wiki，可以使用表 1 所示的基础命令在它们之间导航。另一个内置的 Vimwiki 功能是双方括号\
    \ []。若要创建一个包含多个单词的链接，请按 v 键进入 Vim 的视觉模式，选择链接的单词并按回车键。通过在 .vimrc 中定义每个 wiki 并赋予它们唯一的数字和名称，多个\
    \ wiki 可以作为同一目录的子目录存在。\n\n```\n:echo mapleader\n```\n\n可以使用命令 q! 退出 Vim，或者如果你保存保存刚刚的内容，可以使用\
    \ wq。无论你选择哪种安装方法，都可以通过输入 :help vimwiki 来确认安装成功。\n\n大多数 Vimwiki 文档中缺失的一项重要信息是如何显示在线帮助。一旦你显示了在线帮助，只要你知道了方法，解决方案就很简单。\n"
