    Biology


    # Info


    With the advent of bioinformatics [15] as a major activity within biology, the
    computer as a tool is more central to this discipline than ever before. Bioinformatics
    is a blending of computer science and biology, dealing with DNA sequences or other
    sequences of molecular data: essentially strings of potentially millions of letters.
    This gives the opportunity to allow computational biologists to re computational
    problems in this field and release their open source projects.


    Even more than a comprehensive software suite for molecular biology and bioinformatics,
    EMBOSS provides a platform for any computational biologist to solve something
    of a linguistic character. Bioinformatics plays a big part in gene-based drug
    discovery, wildlife conservation, cancer treatment, forensic analysis, and much
    more.


    Science is more open than ever before, and part of this new openness has been
    both influenced and facilitated by the free software movement, including Linux.
    EMBOSS [16] is an acronym for European Molecular Biology Open Software Suite.
    It is a major computational resource used by many biologists all over the world.


    EMBOSS packages 200 applications for fast sequence analysis, visualizing proteins,
    analyzing protein structure, providing translations; and the nearly universal
    access to remotely hosted sequences, and much more.


    I should mention that a handful of these 200 programs are trivial utilities for
    doing things like removing whitespace from an ASCII file. Clearly EMBOSS attempts
    to be a complete environment. In this environment, a proprietary OS on a scientist''s
    desk seems out of place.


