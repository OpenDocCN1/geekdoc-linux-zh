    The a2x shell script lets users quickly and automatically convert source code
    to various output formats, especially to PDF.


    Normally, you would install Asciidoctor from your distribution’s repository. However,
    if some components are missing, such as asciidoctor-epub3, you can use Ruby’s
    own gem installation settings in the documents to be made in ad-system and import
