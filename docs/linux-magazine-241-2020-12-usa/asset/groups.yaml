    ## Programming Snapshot – Go Lyrics


    As its first action, Listing 2 calls the following defer statement to make the
    songFinder() function in line 11, which ensures that Go closes down the whole
    estate after the program abruptly terminates. This is important, because if the
    terminal stayed in graphic mode, the user would see garbled characters and be
    unable to use it for typing future shell commands.


    Figure 1: The list box in the main menu provides a selection of tracks.


    Figure 2: The ltext widget, which is also implemented as a list box, reveals the
    lyrics line by line.


    ### Organizing Structures


    The lyrics data structure is a Go map that references the YAML data of individual
    tracks for fast lookups, using a string key consisting of a combination of the
    artist and title. Both the data structures of the individual songs and the map
    of the song collection will be defined later in Listing 3, but since all three
    listings implement the same Go package main, they are allowed mutual access to
    each other''s constructs.


    In Listing 2, the for loop starting in line 24 assembles the list of entries in
    the main menu as an array slice of strings that it generates from the lyrics map''s
    keys. The keys in the map are by definition unsorted; therefore, the sort.Strings()
    function from the standard library puts the string list in alphabetical order
    in line 27. Go’s built-in Sort() function sorts an array slice of strings in place
    (i.e., it actually modifies the input array instead of producing a new, sorted
    version).


