    从第一次到第五次记录启动，请使用以下命令：系统运行时间从未超过此处显示的 `uptime --since 1 --until 5` 运行时间。要查找具体时间，只需检查
    Date（日期）列。`uptime first More Details` 命令将以表格形式 (-t) 输出信息，如果你在调用时添加 `-k` 参数，`uptime
    -o` 将按运行时间 (u) 排序。`-r` 选项将告诉你每次启动时使用的内核版本；`--reverse` 会反转排序顺序，使最长的运行时间位于表格顶部。`-b`
    选项还会提供唯一的启动时间。`head -n3` 将单个启动输出的标识符限制在前三行，只留下运行最长的进程（图 3）。参数 `-p` 告诉 `uptime`
    显示系统在每个情况下睡眠了多久。要获取最短的运行时间，只需省略 `-r`。同样，在 `Sleeping` 之后，你可以输出最长最短的运行机时间。这些值仅在使用
    `d` 选项而非 `u` 的系统中可用。安装了 Python 3.6 或更高版本的旧版 `uptime` 默认会根据图 1 中的信息确定最长最短运行时间以及最长最短关机时间。对于
    5 及更高版本的 `uptime`，你必须使用上述命令自行查询这些信息。


    ## 格式问题


    如果需要，`uptime -csv` 将以 CSV 格式交付所有信息。如果你添加 `-t`，你将得到一个可以重定向到文件并用电子表格程序打开的表格。


    如果你不喜欢输出中的日期时间格式，可以使用以下命令进行更改：


    ```bash

    $ uptime -d ''%H:%M:%S %m-%d-%Y''

    ```


    **图 2：** Tuptime 提供了不同的显示格式。自工具安装以来发生过重启，因此计算了两次系统启动。


    Tuptime 将以 `%` 开头的占位符替换为相应的值。`%H` 代表小时，`%M` 代表分钟，`%S` 代表秒。


    同样，`%m` 返回数字月份，`%d` 日，`%Y` 年。其他占位符的详情可以在 tuptime 文档，你可以在 GitHub 上的 `tuptime-manual.txt`
    文件中找到 [1]。


    ## 结论


    如果你只想快速找出自上次系统启动以来经过了多久，可以调用 `uptime`，它很可能预装在你的系统中。


    在服务器和运行无头模式的树莓派等单板计算机（SBC）上安装 tuptime 特别有意义。Tuptime 可以监控启动过程并揭示例如频繁重启或睡眠周期过短等细节。


    ## 信息


    **图 3：** 这里系统两次启动使用了相同的 Linux 内核。在第一次 [1] 启动后，它运行了 35 分钟没有睡眠。


