    In this tutorial, I''ll use Clonezilla SE to create a master image from one machine
    on my network (see the “Test Lab” box).


    ## What Is Clonezilla?


    Clonezilla [1] is an ncurses-based front end for open source disk utilities such
    as Parted, ntfsclone, Partclone, and dd. HFS+, and more. If Clonezilla encounters
    a partition type it doesn’t understand, it will fire up the venerable dd utility
    and still get the job done. You can use Clonezilla to duplicate particular partitions.
    You also get options to compress the partitions and even entire disks. It will
    also clone images using either the gzip, bzip2, or LZO compression algorithms.
    Clonezilla supports a whole battalion of filesystems and then some. It can work
    with them on a locally attached device (such as a USB disk attached to the computer),
    on another computer via the network, or even on the cloud.


    ## Configuring the Server


    The first step is to create an image of the root partition and help an computer.
    Head to the computer that will act as your Live DRBL server and boot into the
    Live environment. Once the graphical environment is up, double-click the Clonezilla
    server icon on the desktop to initiate the process of configuring the server.


    ### NHC Free Software Labs, Tallinn


    Before cloning, you have to assign where the Clonezilla image directory will be
    saved to or read from. We will select local device or remote resources as /home/partimag/.
    The Clonezilla image will be saved to or read from /home/partimag/


    | Option | Description |

    | :--- | :--- |

    | local, dev | Use local device, (E.g. hard drive, USB drive) |

    | sh server | Use SSH server |

    | samba server | Use SAMBA server (Network Neighborhood server) |

    | fs server | Use NFS server |

    | webdav | Use WebDAV server |

    | s3 server | Use S3 server |

    | swift server | Use OpenStack swift server |

    | enter_shell | Enter command line prompts. Do it manually |

    | skip | Use existing /home/partimag (Memory)! *NOT RECOMMENDED*) |


    ## IN-DEPTH Clonezilla SE


    ### Test Lab


    Mastered the process, you can select the second option that allows you to mark
    specific computers on your network for clone later on while you''re on the cloning
    process. There''s no inherent harm with the first option; the second option just
    gives you more control over the process. Clonezilla will then ask you whether
    you''d like to use fsck to check and repair the filesystem before initiating the
    cloning process. It''s always a good idea to make sure the filesystem is in a
    persistent state before creating the image. Similarly, in the next screen select
    the Beginner option to ask Clonezilla to select the default option for as many
    parameters as possible. Once you''re more comfortable with the process, you can
    take charge by selecting the Expert option, which allows you to customize the
    settings for various parameters.


    All the other computers in the network are also connected to this network switch.
    My DRBL server will automatically assign them IP addresses. One of these computers
    on the internal network is a file server. Unlike the other machines, this file
    server has a static IP address (192.168.1.200). I''ve installed the openssh-server
    package on this computer, and all other computers in the network can SSH into
    this computer. I''ll use it as the imaging repository that houses all the cloned
    images.


    You''ll next have to select the mode for the Clonezilla instance. Since I am creating
    a master image, I''ll choose the save-disk option to image an entire disk. You''ll
    now be prompted for some information to help get the DRBL server up and running.


    First, Clonezilla will ask you for the network adapters'' network configuration.
    In my test lab, one of the adapters gets an IP address assigned by the DHCP server
    running on the network. When asked to enter the name of the device, the pair of
    the network cards (eth0) is connected to the ISP router and is assigned an IP
    address by the router via DHCP. The other (eth1) is connected to a network switch.
    During the setup, I''ll assign the DRBL server a static IP address (192.168.1.100).

