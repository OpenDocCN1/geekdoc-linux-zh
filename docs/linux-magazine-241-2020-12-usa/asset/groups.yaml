    ## 20 安全你的 SSH 服务器

    面对互联网的 SSH 服务器几乎会受到攻击，但一些预防措施将有助于防止入侵者。本月我们研究了一些保护 Linux 的简单步骤……内部还有：

    - 内核

    - 超线程的共享进程

    - 清理 printf()

    - 内核中的 Rust

    - Jam.py – 为你喜爱的数据库添加 Web 界面的巧妙解决方案（第 50 页）

    - Clonezilla SE – 通过克隆 Linux 系统加速你的部署（第 56 页）

    - rsync 和 tputime 的真实用途。


