    的欧洲发行版以及其他六个版本。在许多发行版中，除少数例外外，KDE neon 的 Plasma 支持是通用的，尽管它本应该是该发行版的默认设置。第一次遇到
    KDE Plasma 时，我听过 Gnome 用户说：“这就像是一个完全不同的操作系统。”


    那个时代在 2008 年结束，当时 KDE 4 引入了令用户群不安的彻底改变。总是用户想要最新的软件，它在用户中也变得流行。然而，在少数情况下，使用 KDE
    Plasma 会导致一些不寻常的变体。发布了两个版本：更稳定的用户版（User Edition）和开发者版（Developer Edition）。


    ### Kubuntu


    Kubuntu 由 Matthias Ettrich 于 1996 年创立，KDE 开发工作旨在为了增加测试。KDE 是 Linux 首批全功能桌面之一。在此之前，Linux
    的图形界面仅限于窗口管理器。


    2004 年，Kubuntu [2] 是 Ubuntu 的第一个口味（官方变体）。该名称最初代表“Kool Desktop Environment”，但很快就变成了简单的“K
    Desktop Environment”。


    结果是，当 Plasma 开发进入 KDE 软件编译 (SC) 时，它们可能不再是最先进的。


    ### KDE neon


    如上所述，关于 KDE 对 Canonical 控制权的争端被分为三个流派。几年前，KDE 项目重组为一组子项目。KDE 的名称继续被列为 Ubuntu 的一种变体。KDE
    的名称现在适用于整个项目，而桌面环境被称为 KDE Plasma。（其他桌面，Kubuntu...）


    当 Ubuntu 默认使用 2016 版 Unity 时，Kubuntu 可能获得了想要替代方案的用户，延迟了这一点。


    KDE neon [1] 由 Jonathan Riddell 于 2016 年创立，作为一种展示替代方案的方式。但在过去的五年里，Ubuntu 回到 Gnome
    以及 KDE neon 的发布——可以说这是一种滚动发布——似乎变得不那么流行。在我写这段话时，对于 Ubuntu 长期支持 (LTS) 实例，在 DistroWatch
    上，Kubuntu 的页面点击排名第 34，而 KDE neon 排名第 11。


    ### Foco32


    尽管是对 Motif 的私有通用桌面环境 (CDE) 的响应，但 KDE 很快因为 Qt 库的私有许可证遇到了问题，这有助于补偿构建 KDE 的感觉。事实上，这与
    KDE neon 相比增加了软件中可能没有时间成熟的漏洞。


    这导致了 Gnome 的诞生，为 Linux 提供一个真正自由的桌面。


    考虑到 Kubuntu 和 KDE neon 都是构建在最新的 Ubuntu LTS 版本之上的，主要的区别可能是桌面壁纸。尽管如此，Ubuntu 下载旧版本的
    Arch，可以使用更简单的图形工具对开销进行最小化添加，以便轻松将其安装为虚拟机以保持信息更新。在这里讨论。


    对于从未成功安装过 PCLinuxOS 的用户来说，可能被认为是比甚至 KDE neon 用户版更稳定的选择。虽然 Manjaro 的 Plasma 版本没有
    OpenMandriva 那么专精于 KDE，但它仍然是发行版中稀有的创新来源。


    ### Trinity 桌面环境


    ### OpenMandriva


    OpenMandriva [3] 是 Mandriva 和 Mandrake 的后代，这使它拥有自己的。尽管被宣布为开发者版本，但它很快被添加到发行版的仓库中。


    ### KaOS


    KaOS [5] 使用 Plasma 和 Qt 叠加技术构建，旨在成为内存高效的发行版。OpenMandriva 本身位于法国，它的许多用户也在此处。


    经过二十年的开发，OpenMandriva 有足够的时间把事情做对。它继续在桌面侧边并按字母顺序排列图标，这并不总是最高的显示方法。某些应用程序按名称列出，而不参考其功能——工具并不总是默认安装在其中的。

