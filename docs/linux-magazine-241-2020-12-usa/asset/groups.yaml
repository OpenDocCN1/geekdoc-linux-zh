    要强制更复杂的密码策略，你需要调整 `/etc/pam.d/common-password` 文件。找到读取 `password requisite pam_pwquality.so
    retry=3` 的那行。通过附加各种参数，你可以增强新密码的规则（见列表3）。单个参数提供了控制密码要求的选项（见表1）。


    ```bash

    $ ssh-copy-id bob@IP_address

    ```


