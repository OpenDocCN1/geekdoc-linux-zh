    ## Back Issues


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore your full catalog of back issues for specific topics to complete your
    collection. Order online: https://bit.ly/Linux-Newsstand


    ## It''s Alive


    Build a whole operating system? Well maybe not a Linux, but if you''re interested,
    you can implement the basic features of an experimental OS using resources online.
    We can''t show you the whole process, but we''ll help you get organized and take
    your first steps. On the DVD: Linux Magazine 20th Anniversary Archive DVD


    ## Build an IRC Bot


    IRC bots do the essential work of coordinating and forwarding chat messages on
    the Internet. This month we show how to build your own custom bot – and we give
    you an inside look at how to work directly with IRC. On the DVD: Debian 10.5 and
    Devuan 3.0


    ## Speed Up Your System


    Your Linux experience goes much more smoothly if your system is running at peak
    performance. This month we focus on some timely techniques, including the kernel''s
    new Pressure Stall (PSI) feature. On the DVD: Bodhi Linux 5.1 and openSUSE Leap
    15.2


    ## Webcams and Linux


    This month we explore webcams, screencasting, and a cool teleprompter tool. We
    also look at PHP Building Blocks, Guacamole the clientless remote access tool
    based on HTML5, and a study of the handy MystiQ Audio/Video conversion tool. On
    the DVD: Ubuntu Studio 20.04 and Kubuntu 20.04


    ## Smarter Directories


    The rigid structure of nested files and directories used on computer systems around
    the world was created more than 60 years ago, and experts believe we can do better.
    This month, you''ll learn about some scripts for semantic file tagging in Linux.
    On the DVD: Fedora Workstation 32 and Ubuntu “Focal Fossa” Desktop 20.04 LTS


    ## What’s New in Systemd


    Systemd is a mystery that keeps on giving. Now a new feature of the leading Linux
    init system will change the way you think about user home directories. This month
    we take a closer look at systemd-homed. On the DVD: Noppix 8.6 and Mandriva Linux
    4.1


