    # IRC 客户端


    # kirc


    IRC 确实是一个古老的协议，用于处理封装的文本，用于在群组之间在序列化端口连接中流入流出时托管对话。它让人回起 80 年代末和 90 年代初连接的早期日子，那时
    IRCd 与 Archie 和 Gopher 等类的程序共用 Sun-3 服务器空间。


    这种简单性还不足以消除安全和其他现代功能，但用证书、账户和额外功能来增强该简单协议的工作在很久以前就完成了。然而，与 Archie 和 Gopher 不同，IRC
    仍然在无数地方（内部和外部）在使用。


    虽然 kirc 不支持 TLS，但你可以封装可执行文件来理解，特别是对于 C 语言，在像这样的中继工具中实现你自己的接口很容易的，而客户端本身是功能完备且外部的。例如，Freenode
    聊天网络仍然是结人的最佳地方之一。它支持服务器用户名和密码、昵称、宽度限制以及所有惯用的 IRC 命令，并带有出色的颜色输出和命令行清晰度。


    这意味着当你学习新的编程语言和网络栈时，它是一个极好的入门项目，也是一个开始并讨论从虚拟现实到合成器任何话题的绝佳场所。如果你正在考虑学习 C 语言，尽管
    Slack 等平台及其开源替代方案提供了许多机会，IRC 的简单性和成熟性仍然是不可比拟的。这就是 kirc。这是一个美丽、微小、高效的客户端，编写为使用任何符合
    POSIX C99 标准的 C 编译器进行构建，且没有进一步的依赖。因为在底层，所有的 IRC 都是依赖。所有的代码都占据了你方面的空间。


