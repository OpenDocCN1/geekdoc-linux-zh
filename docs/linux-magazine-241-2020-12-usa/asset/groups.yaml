    ... 并尝试这个新的发行版。


    # Ubuntu Groovy Gorilla Beta 已发布


    Canonical 已发布了即将推出的 20.10 版本的 Beta 版本，命名为 Groovy Gorilla，这是一个非长期支持（LTS）版本。短期支持版（STR）的支持窗口仅为九个月。在这九个月结束后，STR
    版本的用户将无法收到任何更新。因此，在安装这些非 LTS 的 Ubuntu 版本时，请记住这一点。


    尽管如此，如果你想要最新、最强大的 Ubuntu 版本，STR 版本是一个不错的选择。


    Ubuntu 20.10 包含的功能和改进包括最新的 Gnome 版本（3.38）。通过 Gnome 3.38，你将享受到在应用程序网格中手动排列图标的能力，以及网格中的文件夹支持、感知缩放的应用程序网格尺寸、系统菜单中新的“重启”选项、WiFi
    共享二维码、改进得巨大的录音录制和截截图应用，以及设置应用中新的家长控制功能。有关 GNOME 3.38 版本的更多信息，请查看[更多在线官方发布说明](https://help.gnome.org/misc/release-notes/3.38/)。


    Ubuntu 20.10 还具有对指纹登录支持的巨大改进。此外，Ubuntu 安装程序现在集成了活动目录（Active Directory），Firefox终于包含了高精度触控板滚动，Linux
    内核 5.8 在底层运行。


    要下载 Ubuntu 20.10 的 ISO 镜像，请前往官方下载页面（http://releases.ubuntu.com/20.10/）获取副本。


    # 为什么良好的应用程序无法扩展

    - Jeff Layton


    # 微软终于准备发布


    你已经对你的串行应用程序进行了并行化处理，但随着核心数的增加，你并没有看到性能的任何提升。


    # Linux 版 Edge 浏览器


    回到 2019 年，微软曾暗示它将把 Edge 浏览器带到 Linux。现在进展如何？


    然后，一切都陷入了沉默。许多 Linux 忠实用户认为这只是对 Linux 社区提出的最新承诺之一。然而，微软似乎正在履行这一承诺。Linux 版 Edge
    将于 10 月初发布，并通过 Microsoft Edge Insider 提供。一旦浏览器发布，用户就可以前往 Microsoft Edge Insider
    页面，下载适用于其发行版的安装包，进行安装并开始测试。


    当然，Linux 版 Edge 被定位为面向 IT 专业人员和开发者的浏览器，而不是面向普通用户的 Web 浏览器。这并不意味着每天使用 Linux 用户无法安装和使用基于
    Chromium 的浏览器。


    根据微软的新闻稿，Edge 是一个用于自动化集群管理的工具包，它消除了原生管理的复杂性。与其它平台一样，我们总是欢迎反馈——它提供了广泛的功能，包括配置和快照。


    你为什么想在 Linux 上使用 Edge？可能的优势包括能够完全使用微软的云游戏服务，并在全高清或超高清模式下观看 Netflix（这些模式仅在 Windows
    上可用）。当终端用户疏忽时，入侵者就会溜进来。使用 Edge 检查终端的健康状况。


    # 联想提供 Ubuntu 20.04


    尽管 2020 年在许多方面都是具有挑战性的一年，制造商纷纷推出他们对 Linux 桌面或其他见解，但开源平台的市场确实正在蓬勃发展。这一点在联想身上体现得尤为明显。去年
    6 月，联想开始对其大量的台式机和笔记本电脑进行认证。联想并不满足于现状，决定通过推出预装 Ubuntu 的 Linux 就绪 ThinkPad 和 ThinkStation
    硬件来超越自我。这次新发布包括近 30 台 ThinkStation 和 ThinkPad 系统，以及 14 台 ThinkPad T、X 和 L 系列笔记本电脑。除一台外，所有联想设备都将带有
    Ubuntu 20.04 出货（例外是 L 系列，它出带有 Ubuntu 18.04）。


    联想软件与云服务副总裁 Igor Bergman 表示：“联想为所有人提供更智能技术的愿景确实意味着‘为了所有人’。”他继续说道，“这就是我们采取这一步提供开箱即用
    Linux 就绪设备的原因。”这些由 Ubuntu 驱动的设备将从 9 月开始推出并在 2021 年分阶段推出。请阅读官方公告：https://news.lenovo.com/pressroom/press-releases/lenovo-launches-linux-ready-thinkpad-and-thinkstation-pcs-preinstalled-with-ubuntu/。


    # Linux deepin 20 发布


    优雅桌面的爱好者可以欢欣了，deepin 20 已发布。但这个新版本不仅仅是为了刷新市场上最漂亮的桌面环境，它还隐藏了一个其他发行版可能会借鉴的妙招。


    Deepin 20 基于 Debian 10.5（又名“Buster”），用户界面的每个元素都得到了改进：图标、动画、多任务查看、窗口和对话框。桌面的每个元素都经过了精炼。你将发现亮色和深色主题、色温度设置、透明度调整以及改进后的电源/电池设置工具。


    deepin 20 最好的特性是安装时的内核选择。这个新选项允许用户选择他们想要安装到桌面的内核。你可以选择 LTS 内核或 5.7 系列。此功能的唯一注意事项，5.7
    系列已经达到了其生命周期结束（EOL）。因此，你很可能选择 LTS 内核。希望 deepin 开发者计划更新此功能，以便安装时的“前沿”选项能够选择尚未达到
    EOL 的稳定内核。


    最后，对于 Nvidia 用户来说，专有驱动现在可以开箱即用。尽管 5.7 内核面临生命周期结束的问题，deepin 20 比以往任何时候都更加美丽精致。获取你的
    deepin 20 副本并享受吧（https://www.deepin.org/en/download/）。


    '
