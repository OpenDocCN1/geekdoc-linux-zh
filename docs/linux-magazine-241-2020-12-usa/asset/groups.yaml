    expects values between -1 and 1. In this project I use LEDs – more precisely (Listing
    1), the neopixel library for Circuit depending on the model and power supply,
    NeoPixel LEDs [2] – to create the illumination effects. NeoPixel LEDs are available
    in all shapes and sizes, from long strips through rings and arrays to individual
    LEDs. Without a while loop, the program ends, and the motor does not stop for
    a value of 0. In my lab, it stopped for values between 0.05 and 0.10. The library
    has a bug: When initializing the object (lines 8-12), you have to specify the
    pixel_order=neopixel.GRBW argument. The components already and the microcontroller
    ready contain the driver chips, which hardware – hence lines 10 and 11. You can
    start, stop, or change the speed of the motor within this loop, but for this project,
    no further support after startup. Even though the value you are passing in is
    the default, you make them a bit more expensive than normal LEDs, but make controlling
    the LEDs far simpler. The program generates rainbow colors across all pixels and
    rotates more or less slowly, depending on the wait parameter (lines 25 and 31).
    NeoPixels normally require 5V. Three connections are all you need: supply voltage,
    ground, and data. If the cables are short and the number of pixels is low, 3.3V
    might be sufficient for the power supply and control. The maximum brightness is
    reduced a little, but because the LEDs are very bright any way, the low voltage
    doesn''t matter in practical terms. If you want to switch between effects, you
    have to query the switch at a suitable point. In the example, this would be either
    inside while loop (lines 33-34) or before line 31. Regardless of the selected
    voltage, it is important to check that the NeoPixels do not overload the voltage
    source. The Raspberry Pi''s 3.3V pins are not designed to deliver high currents.


