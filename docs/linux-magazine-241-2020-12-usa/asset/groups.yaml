    # 差异


    Asci Doc 和 Asciidoctor 在某些细节上有所不同。


    对于简单的文档，这顶多是一个次要问题。然而，如果你充分利用每种软件的功能，差异就会变得更加明显。你可以在寻找 `In search for the (Asciidoctor
    only)` 字符串的示例，它指定了这些功能适用于 Asciidoctor。在大多数情况下，Asciidoctor 的功能超过了 Asci Doc 支持的内容，但得益于内置的兼容模式，


    表 1：Asciidoctor 命令行选项


    | 选项 | 效果 |

    | --- | --- |

    | -b <Format> | 创建输出为 HTML5（默认）、XHTML5、DocBook 5、manpage 或通过适当的插件输出——如 PDF、LaTeX
    或 EPUB |

    | -d <Type> | 除了经典的 article（默认）、book 和 manpage 之外，Asciidoctor 更倾向于为包含的代码输出，例如单代码块、段落或类似内容
    |

    | -o <File> | 将输出保存为指定的名称 |

    | -D <Directory> | 将结果保存到指定的目录中 |

    | -s | 抑制头部和页脚（针对包含的文档） |

    | -n | 章节的自动编号 |

    | -a <Attribute> | 设置 Asci Doc 属性（覆盖文档中现属性） |

    | -B <Base> | 定义附加代码的基目录；默认是当前目录 |

    | -V | 警告级别，根据此生成错误代码：WARN, ERROR, INFO, |

    | --failure-level <Level> | FATAL（默认） |

    | -S | 设置安全级别；禁用潜在不安全的结构，如 `include::` |


    # UI 宏


    | 快捷键 | 目的 |

    | --- | --- |

    | F11 | 切换全屏 |

    | Ctrl + T | 打开新标签页 |

    | Ctrl + Shift + N | 新无痕窗口 |

    | Ctrl + \ | 用于转义字符 |

    | Ctrl + ] | 跳转到关键词 |

    | Ctrl + + | 增大缩比例 |


    Asciidoctor 可以处理任何用 Asci Doc 格式化过的内容。尽管如此，现在已支持用于快捷键的 UI 宏（图 1）。同样有趣的是，Asciidoctor
    没有提供命令 `a2x` 的对应项，参见框，“Asci Doc 的 a2x 命令”。或者，你可以在 shell 提示符处指定选项。作为一个特殊功能，a2x
    有 `--epubcheck` 选项来自动化调用 a2x 工具的过程，该工具可以识别 EPUB 文档中的潜在问题。以程序代码的形式。这允许句子交换、注释和其他操作，就像在任何编程语言中一样。


    # PDF 选项


    与 AsciiDoc 一，Asciidoctor 通常面向 HTML，这使其更容易转换为基于它的格式，包括 AsciiDoc 和 EPUB。AsciiDoc
    的经典结构在多程度上通过命令行控制。与其非常相似的重要选项汇总在表 1 中。不带选项的命令和调用将具有 `.adoc` 扩展名的文件翻译为 HTML5：


    ```

    $ asciidoctor tst.adoc

    ```


    创建 PDF 有几种方法，它们可能会导致非常不同的结果。如果你倾向于创建书籍之类的线性文档，你可能更喜欢 PDF。


    生成一些 HTML 输出，在浏览器中调用它并将其导出为 PDF。这种方法提供了相当广泛的后续编辑。默认情况下，工具在转换期间会抑制消息。它只向你显示严重错误，例如缺少嵌入图像。但不如此。或者，你可以通过
    a2x 使用 DocBook 5 工具链。Asciidoctor 允许你直接用 Asciidoctor 创建 PDF，但结果往往不理想。从 Asci Doc
    切换到 Asciidoctor 时需要考虑一些差异，这些差异总结在用户手册的第 9 章 [9]。


    这并不总是按预期工作，但过程非常快。缺点是没有有意义的错误消息，错误往往长时间无法被发现。例如，在语法方面，现在斜体文本仅有 `_<Text>_` 语法，代码使用
    `<Text>`，代码中的字面文本使用 `+{Text}+`。双引号在 Asci Doc 或 Asciidoctor 中使用 `"<Text>"` 创建，单引号使用
    `''<Text>''`。


    另一种选择是使用 LaTeX。你可以通过 LaTeX 自己的工具传统方式创建。对于标题，`= <Title>` 语法（异步）仍然有效，但不是对称的形式 `=
    <Title> =` 或使用下划线的形式。标题下划线会自动导致兼容模式。手册中的第 9.8 提供了额外的 LaTeX 知识以及通常的手动调整。无论你选择哪种路径，请记住交互元素在转换过程中几乎总是丢失。


    # 结论


    Asciidoctor 证明它是 AsciiDoc 的合格继任者。它的速度和附加插件以及对 AsciiFX [10] 的直接支持使其成为一个良好但更复杂的替代方案。那么现在没有理由使用
    Asci Doc 了吗？这取决于。例如，对于电子书运行良好的工具链是不容忽视的，而且结果有时比 Asciidoctor 生成的结果更紧凑。


    图 1：这些用于快捷键的 UI 宏在 Asciidoctor 中可用，但在 AsciDoc 中不可。


