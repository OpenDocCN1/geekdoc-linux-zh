    （作为湿信号）与常用的音频效果中的干信号相结合，根据喜好进行处理。混响效果一直存在。它是从声源阵列中最终强制产生的回声效果，你通常在弹簧而非物理空间中听到它。在20世纪70年代，混响人声、电影预告片以及菲尔·科林斯（Phil
    Collins）著名的鼓点，都是由运行在数字门控上以消除延迟的数学模型产生的。


    无论是摇滚、民谣、说唱还是电子音乐，所有音乐受益于混响信号处理器。那时，混响效果几乎总是美的混响。在音乐母带制作时，在原始清洁录音中添加混响效果，可以帮助轨道融合，或者在单个
    CPU 上免费赋予它们三维节奏感。每个插件都提供了许多均衡声音和增加密度的选项，还可以更改虚拟空间的大小和数量。即使是早期的录音也有早期反射，它们听起来依然美妙。添加的混响本身基于广泛使用的
    Freeverb 算法，其物理原理是在专门建造的房间内放置扬声器和麦克风，让声音离开扬声器，在表面反射，并由麦克风带有混响地捕捉。


    这款 Dragonfly 混响套件中的 Dragonfly Reverb 以一个极其实用的 UI 展示了这些功能，为任何开源音频处理工具提供了许多选项。有几个不同的版本，包括房间声、大厅声（更大）、板式声（类似于弹簧混响），它们甚至可以与昂贵的商业算法媲美。然而，Dragonfly
    Reverb 听起来简直棒极了。


    # 项目网站

    https://github.com/michaelwilis/dragonfly-reverb


    Arduino 构建器

    Arduino CLI


    在树莓派（Raspberry Pi）等硬件让微型开源计算流行之前，你可能只是想使用不同的代码编辑器并从命令行触发自己的构建。Arduino 为可编程微控制器一直在做同样的事情。这些真正的开源开发板（与树莓派不同）仍有几十万个。


    过去的解决方案包括构建一个 Makefile 来触发灯光开关、监控温度和酿啤酒，并使用与 Arduino IDE 相同的 GCC 参数，甚至绕过 IDE 内部使用的
    arduino-builder 来独立构建你的项目。


    虽然 Arduino CLI 设计为从命令行运行，但它仍然是 Arduino Web 编辑器背后的强大力量。对于不需要 CPU 的低功耗硬件解决方案、板载和原生
    C 文件，它还会像 IDE 一样将任何生成的二进制文件上传到连接设备的存储器，并将你的设置保存到配置文件。


    由于它们是微控制器而不是计算机，因此它们需要计算机来编程。幸运的是，通过官方支持的 Arduino CLI，它允许你将 Arduino 开发与 IDE 解耦，并与任何开发环境配合。这些黑科技不再是必要的。arduino-cli
    命令也是开发 Arduino 项目的一种更快方法，因为这也意味着你使用了 IDE 提供的所有功能，除了提供视觉编辑环境之外。


    IDE 是一个提供视觉编辑环境且非常适合学习的优秀工具，但当你的项目超出 IDE 的能力范围时，它就力不从心了。你可以从喜欢的编辑器或 IDE 使用 Arduino
    CLI，并像处理任何 C 项目一样快速触发构建。它可以下载并集成与 IDE 相同的库和开发板，启动一个新的 sketch（脚本），并包含两个 INO sketch
    文件。你可能想使用 CI 自动构建和部署。


    # 项目网站

    https://github.com/arduino/arduino-cli/


