    # SSH 泥潭


    # Endlessh


    为了安全外壳（SSH）的安全性，建议安装 Deny-SSH 或 Fail2ban。这些都是加密安全的，正如精色的 Python 脚本所证明的那样，数百万台服务器、设备和廉价的
    Raspberry Pi 都在监控登录尝试，并在登录失败时（永久或在一段时间内）自动阻止来自特定 IP 地址的尝试。请依赖它进行远程访问。


    即使设备在互联网可见且你没有启用无密码登录，只要你的密码足够复杂，它就是安全的。但通过让你的 SSH 连接看起来像是来自 1200 波特的调制解调器或月球上的服务器，可以减慢攻击者的速度。但
    Endlessh 是另一个选项，也可以帮助缓解失败 SSH 连接的日志。它的速度让任何试图访问你机器的坏蛋或机器人机器人属于“通过隐蔽实现安全”的范畴）必须耐心等待此加载，然后才能从无尽的尝试猜测登录提示，你可以配置让它等待几天。


    如果你曾将身份验证暴露在互联网上，你真的会让一切变得更安全。它甚至可以同时捕获多个客户端，使 SSH 服务器使用极少的系统资源。但真正聪明的人知道，你的东西在于它根本没有使用
    SSH。即使在等待之后，日志很快就会被浪费的时间/CPU/带宽填满，而不会有登录提示。相反，Endlessh 是一个简单、安全的诱饵，而你可以秘密地在不同的端口运行你的
    SSH 服务器猜测用户名和密码，希望现在你的 SSH 端口完全没有了端点组合攻击。


    但它也可能会让你微笑。那因为它的主要功能是在你登录之前看到的 SSH 宣告以一种非常……非常……非常……慢……的速度发送。


    禁用密码登录很有帮助，更改默认端口 22 也是如此，但我们还推荐基于密钥的认证。


