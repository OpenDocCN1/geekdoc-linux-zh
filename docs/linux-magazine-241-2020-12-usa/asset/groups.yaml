    # 使用 tuptime 测量系统运行时间


    # 秒表


    Linux 服务器在没有重启的情况下运行了多久？系统在你不经察觉的情况下重启了多少次？这些问题以及更多问题都可以 tuptime 工具给出答案。


    作者：TIM SCHÜRMANN


    最顶部；它显示系统启动次数。在旁边你可以看到自……以来的时间和日期。如果 Linux 系统运行了很长时间，这无疑是稳定性的证明，但——取决于发行版——某些更新可能正在等待安装。相反，如果系统频繁重启，完整图景……尽快设置程序，可能存在配置错误——或者可能是系统安装后可能的……硬件组件正在缓慢老化。在工作站电脑上，如此……的重启是


    接下来，tuptime 会告诉你系统关闭的频率（系统关机）。你会很快注意到，但不一定是在远程……特别注意那些运行安静且状态良好的不受控服务器数量。如果这个数字迅速增加，说明存在严重问题，例如电源不稳定。系统寿命表示连续运行多长时间，可以通过命令行调用
    `uptime` 来确定。你可能还想尝试 `tuptime` [1]，这是一个类似的工具，其名称基于“total uptime”（总运行时间）的缩写。它提供了多得多的信息，包括有价值的启动引导信息以及以重启次数和使用的内核版本形式提供的信息。在每情况下，工具都会记录系统时间。正是通过这种方式收集的时间戳，tuptime
    最终计算出总运行时间和所有其他值。


    虽然几乎每个系统上可用 `uptime`，但要让 tuptime 在启动时自动运行，你需要单独安装 tuptime。某些发行版已经在仓库中拥有该工具，例如
    Debian 和 Ubuntu。Arch Linux 用户会在 AUR 中找到 `uptime`，CentOS 用户会在 EPEL 仓库中找到。除了 systemd，安装脚本还支持
    SysVinit 和 OpenRC。在任何 Linux 系统上，你可以使用以下命令安装该工具：


    ```

    $ curl -Ls https://git.io/U

    tuptime-install.sh | sudo bash

    ```


    使用安装脚本时，tuptime 始终运行在它自己的用户账户下，名为 `named_tuptime`。


    如果在某点突然断电，tuptime 不会注意到任何异常。结果就是关机时间戳缺失，这将阻止工具计算正确的总运行时间。tuptime 本身由一个 Python
    脚本组成，需要 Python 3以及模块 `os`, `optparse`, `sqlite3`, `locale`, `platform`, `datetime`
    和 `logging`。这些模块在在大多数发行版中应该是预装的。关于安装的更多信息，请参见“在后台”框。安装脚本还设置了一个 `cron` 任务，反过来确保了
    tuptime 定期启动。


    # 时间测量


    tuptime 记录的所有时间戳最终都存在于一个小的……在设置程序后，查询当前的 SQLite 数据库，它默认位于 `/var/lib/tuptime/tuptime.db`。工具已经提供了一些基础信息（图
    1）：2020 年 12 月期第 241 期


    通过终端通过 tuptime 查看状态。


