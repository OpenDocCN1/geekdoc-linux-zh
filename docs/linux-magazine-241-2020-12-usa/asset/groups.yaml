    然而，除了大家都同意“快越好”以及他们的使用场景是理想情况之外，并没有进行大量的讨论。超线程是 Intel 专有的硬件级多线程形式。项目有时就是这样启动的。许多大公司确实非常想要那一点点速度的。他们的数据中心拥有数百万台机器，对于那种情况，一点点速度提升就能产生巨大影响。超线程在硬件层面实现了这一点，为操作系统节省了时间。但操作系统仍然可以与
    Intel 的超线程功能交互。此外，正如 Joel 所解释的，“目前还没有全球公认的干扰改进set，公司们一直在破解自己的接口，以便让幸运的开发者使用补丁。本文旨在列出我在与
    Google 和 Oracle 的不同人员交谈后获得的用例。”


    Peter Zijlstra 的“核心调度（core-scheduling）”补丁，他以讨厌慢慢拔掉指甲的方式闻名。不，没有人喜欢 printf()。它总是一团糟，而且变乱的速度往往和清理一样快。除了除此之外，Joel
    真的。然而，核心调度补丁的目的是让每个 CPU 表现得像两个的一样。这样，当你需要调试内核时，你必须考虑到那些已经在一个虚拟 CPU 上对此主题进行胡乱修改的企业玩家的作剧。各种人士加入了讨论。


    John Ogness 最近发布了一个补丁。进程如何知道它们相互信任？其中一种方法是，如果一个进程创建了一系列其他进程，这些进程就可以相互信任，除非其他进程被视为潜在的安全威胁。因此，问题变成了如何跟踪进程族，并说：“为了应对威胁，是必要的，以确保所有进程都能被充分利用。”


    当然，运行在这些超线程虚拟 CPU 上的进程已经卸载了 LOG_CONT 功能，该功能将长输出拆分为独立的两个进程，所有的 printk() 调用都让外部循环处理所有内容。这种方法，John
    威胁到了 printk() 子系统。事实上，它其他进程并没有真正相互信任。


    printk() 函数是像 Joel 这样的人现在努力想要获得的东西。它是代表优秀黑客技术的内核特性。Joel 特别想要改进 Peter Zijlstra
    的“核心调度”补丁，而 Peter 对这种方式的讨厌程度是出了名的。他实际上只这样做过一次。不，不是。

