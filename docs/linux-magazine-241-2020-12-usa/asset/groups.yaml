    which interacts with any relational or non-relational database.


    The client side is a pair of dynamic web pages. In practice, you will use the
    default templates or create custom web pages. The first page is the Home page,
    where you can generate charts based on the results of database queries. The second
    page is where you can modify tables in the database.


