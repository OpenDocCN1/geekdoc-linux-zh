    20.04 will be supported with upgrades and security patches for five years.”


    A relatively new direction, but there is no doubt that elementary OS remains at
    the forefront of desktop innovation.


    Rather than following any of the major distributions, elementary OS built its
    own Pantheon desktop on top of the Gnome desktop and developing its own utilities
    and tools.


    Perhaps its most famous tool is the Plank, which influenced docks for other distributions.
    From the first, Pantheon was intended to be an aesthetically-pleasing desktop
