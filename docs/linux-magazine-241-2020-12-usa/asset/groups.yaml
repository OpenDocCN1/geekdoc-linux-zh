- md: "\n# IN-DEPTH\n\n## Jam.py\n\ninterface that I can use even when I have no Internet\
    \ connection. Figure 4 also shows some other interesting features of the Jam.py\
    \ Builder. First of all, you can decide which columns to show – and in which order.\
    \ Then, there is the Filters button, which opens a form to create search filters.\
    \ For instance, you could display only bookmarks with titles that include a certain\
    \ string and were published in a certain range of dates, as in Figure 5.\n\nFigure\
    \ 4: Jam.py displays the contents of a database table, using its other things\
    \ to notice in Figures 4 and 5 are the tiny arrows near the names of each column,\
    \ and the small search prepare the inbox in the top right corner. The arrows mean\
    \ that records can be sorted by that column. The search box lets you find and\
    \ display only the records that have the given string in the textual field that\
    \ you select.\n\n### Users and Roles\n\nThe instructions in `import.sql`, which\
    \ I called `import.sql`, are (almost) self-explanatory: the first two lines specify\
    \ that. By default, a Jam.py program only has one user account with full powers,\
    \ called admin, with a default password equal to 111. Even if you are the only\
    \ user of that program, it is good practice to have a separate account with fewer\
    \ privileges for daily use.\n\nFigure 5: The configurable filters, together with\
    \ the search box, make it easy to find just the records you want.\n\nFigures 6\
    \ and 7 show how the third line imports the whole content of that file into the\
    \ BOOKMARKS_MAIN table.\n\nIn Listing 2, line 3 initializes a record to create\
    \ an account. First, click on the Users and Roles entries of the Builder left.\
    \ Lines 4 to 13 reads the file passed as the first argument one line at the time\
    \ and removes the final newline character (line 5). At that point, I can finally\
    \ use the two scripts in sequence:\n\n```bash\n#> ./rearrange_columns.pl shaarli-bookmarks.csv\
    \ > bookmarks-for-sqlite.csv\n#> sqlite3 --init import.sql bookmarks_MAIN\n```\n\
    \nThen, the script splits the whole line, using the pipe character as a separator,\
    \ saving each field in the variables listed in line 6. Lines 8 and 9 simply replace\
    \ the text value of the broken and private fields with numbers, because in BOOKMARKS_MAIN,\
    \ those fields are integers, not strings: $bookmark is converted to 1 if it contains\
    \ an x; otherwise it is 0 (line 8) and $private becomes 1 if it is equal to true\
    \ (line 1).\n\nThe result is shown in Figure 4: all the bookmarks I saved using\
    \ Shaarli are now in a quicker, much more flexible graphic.\n\nLine 11 just prints\
    \ all the same fields, joining them with pipe characters and with two extra fields\
    \ at the beginning. The fields that were in the original file are printed in the\
    \ order they are inside the SQLite database, as you can see when comparing line\
    \ 11 with the output of the `table_info` command in Listing 1. Line 12 increments\
    \ the line/record counter and then the loop moves to the next line.\n\nTo load\
    \ the output of `rearrange_columns.pl` into the actual database, I had to\n\n\
    Figure 6: Creating a user account.\n\nFigure 7: Defining roles and access rights.\n\
    \nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\nISSUE 241\n\n![](img/56e7a0f7bfb6321f705dd064cbb9793e_310_0.png)\n\
    ![](img/56e7a0f7bfb6321f705dd064cbb9793e_310_1.png)\n![](img/56e7a0f7bfb6321f705dd064cbb9793e_310_2.png)\n\
    \n# IN-DEPTH\n\n## Jam.py\n\nmenu to create new users and new roles for them [4].\
    \ Next, go back to the catalog, or wherever you defined your table.\n\nSo far\
    \ I have discussed the case where the Jam.py application and the database were\
    \ created together. In those cases, using SQLite spares you from installing and\
    \ maintaining a separate server.\n\n### External Databases\n\nSee the Jam.py documentation\
    \ for details on how to add these features. You will find some of these advanced\
    \ features in the dashboard of the demo [6] [7] [8].\n\nselect it, and click the\
    \ Privilege button on the left to specify what every role can do with that table\
    \ (Figure 7). To make all these changes work as intended, click on Project and\
    \ tick the Safe mode box to force all users to log in with their password.\n\n\
    ### Portability\n\nHowever, in some situations, you might wish to build a Jam.py\
    \ application for a data-base that already exists.\n\nA great advantage of Jam.py\
    \ databases is their portability.\n\nFigure 10 shows what to pass to the manager\
    \ in the Builder in order to connect to a local or remote MySQL server. All the\
    \ values shown in the figure must be filled in.\n\nIf you compare Figures 4 and\
    \ 5, you will notice that the titles are formatted differently even if they are\
    \ not marked with asterisks. The reason for the difference is that, in Figure\
    \ 4, titles are plain text, but in Figure 5 they are hyperlinks pointing to the\
    \ bookmarks.\n\nIf the connection succeeds, the next step is to import the structure\
    \ of the MySQL tables and to create the necessary forms.\n\nClickable titles are\
    \ just one example of and filters. The complete procedure has the only real requirement\
    \ is Python, because you can how you can customize Jam.py tables.\n\nTo make the\
    \ titles clickable, select the BOOKMARKS_MAIN table in the catalogs, push the\
    \ Client Module button, and then select the Events tab shown in Figure 8.\n\n\
    The function names on the left correspond to all the events that the Jam.py JavaScript\
    \ can detect, and the editor on the right lets you insert whatever JavaScript\
    \ you want in those functions. What I did, following the documentation [5], was\
    \ to add the following code:\n\n```javascript\nif (field.field_name === 'title')\
    \ {\n    return '<a href=\"' + field.owner.url.value + ' '\">' + field.value +\
    \ '</a>';\n}\n```\n\nIn plain English, this code means \"whenever a title should\
    \ be printed, replace that string with the HTML markup for a clickable link, pointing\
    \ at the URL that corresponds to that title.\"\n\nFigure 9 shows that this is\
    \ what happens when you save that JavaScript code.\n\n### Metadata\n\nIn some\
    \ cases, you might wish to import a finished Jam.py configuration to another computer.\
    \ For instance, you might wish to use an existing application as a template, or\
    \ perhaps test some changes to the current configuration on another computer to\
    \ avoid disrupting the production system.\n\n### Portability\n\nTo export Jam.py\
    \ application, select the package inside the same folder with the rest of the\
    \ application, and move or backup everything together.\n\n### Custom HTML\n\n\
    You can add much more than links to your Jam.py interface. The most interesting\
    \ objects are dynamic charts built in your browser by libraries like chart.js,\
    \ as well as buttons (images...) into one ZIP archive. You can then use buttons\
    \ that make server.py interact with the underlying operating system. For instance,\
    \ you could add load the complete project.\n"
  mdcn: "\n\n# 深度解析\n\n## Jam.py\n\n这是一个即使在没有 Internet 连接时也可以使用的界面。图 4 还显示了 Jam.py\
    \ Builder 的其他有趣功能。首先，你可以决定显示哪些列以及它们的顺序。然后是“过滤器”（Filters）按钮，它会打开一个创建搜索过滤器的表单。例如，你可以如图\
    \ 5 所示，只显示标题包含特定字符串且在特定日期范围内的书签。\n\n图 4：Jam.py 显示数据库表的内容，图 4 和 5 中其他值得注意的事项是每个列名称附近的微小箭头，以及右上角的小搜索准备框。箭头表示可以按该列进行排序。搜索框允许你查找并仅显示在所选文本字段中包含给定字符串的记录。\n\
    \n### 用户与角色\n\n`import.sql` 中的指令（我将它命名为 `import.sql`）（几乎）是不言自明的：前两行就说明了这一点。默认情况下，Jam.py\
    \ 程序只有一个具有完全权限的用户账户，名为 admin，默认密码为 111。即使你是该程序的唯一用户，准备一个权限较低的独立账户用于日常使用也是一种良好的习惯。\n\
    \n图 5：可配置的过滤器配合搜索框，可以轻松找到你需要的记录。\n\n图 6 和 7 显示了第三行如何将该文件的完整内容导入到 BOOKMARKS_MAIN\
    \ 表。\n\n在列表 2 中，第 3 行初始化了一个记录以创建账户。首先，点击 Builder 左侧的“用户与角色”（Users and Roles）条目。第\
    \ 4 到 13 行逐行读取作为第一个参数传递的文件，并删除末尾的换行符（第 5 行）。此时，我终于可以按顺序使用这两个脚本：\n\n```bash\n#>\
    \ ./rearrange_columns.pl shaarli-bookmarks.csv > bookmarks-for-sqlite.csv\n#>\
    \ sqlite3 --init import.sql bookmarks_MAIN\n```\n\n然后，脚本使用管道符 `|` 作为分隔符分割整行，并将每个字段保存到第\
    \ 6 行列出的变量中。第 8 和 9 行简单地将损坏和私有字段的文本值替换为数字，因为在 BOOKMARKS_MAIN 中，这些字段是整数而不是字符串：如果\
    \ $bookmark 包含 x，则转换为 1；否则为 0（第 8 行），如果 $private 等于 true，则变为 1（第 1 行）。\n\n结果如图\
    \ 4 所示：我使用 Shaarli 保存的所有书签现在都处于一个更快速、更灵活的图形界面中。\n\n第 11 行仅打印所有相同的字段，用管道符连接它们，并在开头添加两个额外字段。原始文件中的字段按照它们在\
    \ SQLite 数据库中的顺序打印，正如你在比较第 11 行与列表 1 中 `table_info` 命令的输出时看到的那样。第 12 行增加行/记录计数器，然后循环到下一行。\n\
    \n为了将 `rearrange_columns.pl` 的输出加载到实际数据库中，我必须：\n\n图 6：创建用户账户。\n\n图 7：定义角色和访问权限。\n\
    \nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\nISSUE 241\n\n![](img/56e7a0f7bfb6321f705dd064cbb9793e_310_0.png)\n\
    ![](img/56e7a0f7bfb6321f705dd064cbb9793e_310_1.png)\n![](img/56e7a0f7bfb6321f705dd064cbb9793e_310_2.png)\n\
    \n# 深度解析\n\n## Jam.py\n\n为它们创建新用户和新角色的菜单 [4]。接下来，返回目录或你定义表的任何地方。\n\n到目前为止，我讨论了\
    \ Jam.py 应用程序和数据库一起创建的情况。在这些情况下，使用 SQLite 可以让你免于安装和维护单独服务器的麻烦。\n\n### 外部数据库\n\n\
    请参 Jam.py 文档有关如何添加这些功能的详情。你可以在演示 [6] [7] [8] 的仪表板中找到一些高级功能。\n\n选择它，并点击左侧的“权限”（Privilege）按钮以指定每个角色对该表可以的操作（图\
    \ 7）。为了让所有这些更改按预期工作，点击“项目”（Project）并勾选“安全模式”（Safe mode）框，强制所有用户使用密码登录。\n\n###\
    \ 可移植性\n\n然而，在某些情况下，你可能希望为已存在的数据库构建 Jam.py 应用程序。\n\nJam.py 数据库的一个巨大优势是它们的可移植性。\n\
    \n图 10 显示了向 Builder 中的管理器传递什么内容以便连接到本地或远程 MySQL 服务器。图中显示的所有值都必须填写。\n\n如果你比较图 4\
    \ 和图 5，你会发现即使没有用星号标记，标题的格式也不同。差异的原因是，在图 4 中标题是纯文本，但在图 5 中，它们是指向书签的超链接。\n\n如果连接成功，下一步是导入\
    \ MySQL 表结构并创建必要的表单。\n\n可点击的标题只是过滤器的其中一个例子。整个过程的唯一真实要求是安装 Python，因为你可以自定义如何自定义\
    \ Jam.py 表。\n\n要使标题可点击，在目录选择 BOOKMARKS_MAIN 表，点击“客户端模块”（Client Module）按钮，然后选择图\
    \ 8 所示的“事件”（Events）选项页。\n\n左侧的函数名称对应于 Jam.py JavaScript 可以检测的所有事件，右侧的编辑器允许你在这些函数中插入任何想要的\
    \ JavaScript。按照文档 [5]，我的做法是添加以下代码：\n\n```javascript\nif (field.field_name ===\
    \ 'title') {\n    return '<a href=\"' + field.owner.url.value + ' '\">' + field.value\
    \ + '</a>';\n}\n```\n\n用普通的话来说，这段代码意思是“每当打印标题时，将该字符串替换为点击链接的 HTML 标记，指向标题对应的 URL。”\n\
    \n图 9 显示了保存该 JavaScript 代码后发生的情况。\n\n### 元数据\n\n在某些情况下，你可能希望将完成的 Jam.py 配置导入到另一台计算机。例如，你可能希望使用现有的应用程序作为模板，或者在另一台计算机上测试当前配置的某些更改以避免干扰生产系统。\n\
    \n### 可移植性\n\n要导出 Jam.py 应用程序，选择与应用程序其他部分相同文件夹内的包，并一起移动或备份。\n\n### 自定义 HTML\n\n\
    你可以为 Jam.py 界面添加比链接更多的内容。最有趣的对象是使用 chart.js 等库在浏览器中构建的动态图表，以及一个 ZIP 归包中的按钮（图像...）。然后你可以使用让\
    \ server.py 与底层操作系统交互的按钮。例如，你可能添加加载整个项目。\n\n"
