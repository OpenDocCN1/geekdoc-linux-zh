    read in Linux Magazine. Although we will consider any topic, the following themes
    are of special interest:


    Linux Magazine is read in many countries, and your article may be translated into
    one of our sister publications. Therefore, it is best to avoid using slang and
    idioms that might not be understood by all readers.


    - System administration

    - Useful tips and tools

    - Security, both news and techniques

    - Product reviews, especially from real-world experience

    - Community news and projects


