- md: "\n# MakerSpace Christmas Tinkering\n## Christmas fun for makers\nMake your\
    \ own Christmas music box with a microcontroller, servomotor, NeoPixel LED ring,\
    \ and mini-MP3 player.\n\nBy Bernhard Bablok\n\nMy idea of building a music box\
    \ of my own design was born from these frustrations. Music boxes and Christmas\
    \ pyramids are among the top sellers in Germany during the Advent season. In terms\
    \ of the electronics, you not need many components. The following sections are\
    \ intended to give you ideas for your own projects; the expensive, hand-carved\
    \ items can fetch four-figure sums, whereas cheap imitations sell for EUR20 (~$17).\
    \ Christmas pyramids parts used in this example can easily be powered by the heat\
    \ of candles, replaced by whatever you like. The cycling and the cheaper ones\
    \ in particular have depths of your lumber box reveals. The such an unfavorable\
    \ candle-to-propeller ratio that the pyramid will not turn without mechanical\
    \ help. The only important elements in this project are light, motion, and music.\
    \ Music boxes are driven by fragile springs, but the constant need to rewind them\
    \ spoils the fun.\n\n# Controls\n\nTo control the project, I used a Trinket M0\
    \ microcontroller [1] by Adafruit (Figure 1), which runs CircuitPython, a minimalist\
    \ Python that supports a wide range of peripherals with its many libraries. The\
    \ price of the controller is in the same range as a Pi Zero, including an SD card,\
    \ but it is easier to put into operation because you do not need to install and\
    \ configure an operating system.\n\nAnother advantage of a microcontroller is\
    \ that you do not have to boot it, and you can simply switch it off without damaging\
    \ the installation. The biggest advantage, though, is the CircuitPython support.\
    \ The examples offered here illustrate how little code is needed to implement-\n\
    \n# Author\n\nBernhard Bablok works at Allianz Technology SE as an SAP HR developer.\
    \ When he’s not listening to music, cycling or walking, he deals with topics related\
    \ to Linux, programming, and small computers. He can be reached at mail@bablok.de.\n\
    \nYou can investigate more neat projects by Pete Metcalfe and his daughters at\
    \ https://funprojects.blog.\n\n# Info\n\n[1] PySimpleGUI docs: https://pysimpleGUI.readthedocs.io/\n\
    \n[2] Pimoroni Explorer HAT Pro: https://www.adafruit.com/product/2427\n\n# Figure\
    \ 6: Raspberry Pi rover with PySimpleGUIWeb.\n\n# Listing 2: PySimpleGUI/Web Rover\n\
    \n```python\n# SGui_rover.py - use PySimpleGUI/Web to control a Pi Rover\nimport\
    \ sys\nimport PySimpleGUIWeb as sg\nimport RPi.GPIO as gpio\n\n# All the stuff\
    \ inside your window.\nmyfont = \"Arial 32\"\n\n# Pass any command line argument\
    \ for Web use\nlayout = [\n    sg.Text(\"\",size=(20,1), key=\"feedback\")\n]\n\
    if len(sys.argv) > 1: # if there is use the Web Interface\n    mode = \"web\"\n\
    \    layout += [\n        sg.Button(\"FORWARD\", size=(32,3), font=myfont, button_color=('white',\
    \ 'green')),\n        sg.Button(\"LEFT\", size=(15,3), font=myfont),\n       \
    \ sg.Button(\"RIGHT\", size=(15,3), font=myfont),\n        sg.Button(\"STOP\"\
    , size=(32,3), font=myfont, button_color=('white', 'red')),\n        sg.Button(\"\
    QUIT\")\n    ]\nelse: # default uses the tkinter GUI\n    mode = \"tkinter\"\n\
    \    layout = [\n        sg.Text(\"\",size=(20,1), key=\"feedback\"),\n      \
    \  sg.Button(\"FORWARD\", size=(32,3), font=myfont, button_color=('white', 'green')),\n\
    \        sg.Button(\"LEFT\", size=(15,3), font=myfont),\n        sg.Button(\"\
    RIGHT\", size=(15,3), font=myfont),\n        sg.Button(\"STOP\", size=(32,3),\
    \ font=myfont, button_color=('white', 'red')),\n        sg.Button(\"QUIT\")\n\
    \    ]\n\ngpio.setmode(gpio.BOARD)\n\n# Define the motor pins to match your setup\n\
    if mode == \"web\":\n    motor1pin = 38 # motor left\n    motor2pin = 37 # right\
    \ motor\n    gpio.setup(motor1pin, gpio.OUT)\n    gpio.setup(motor2pin, gpio.OUT)\n\
    \    window = sg.Window('PySimpleGUI Rover Control', layout, web_ip='192.168.0.106',\
    \ web_port=8888, web_start_browser=False)\nelse:\n    window = sg.Window('PySimpleGUI\
    \ Rover Control', layout)\n\n# Send Action to Control Rover\ndef rover(action):\n\
    \    if action == \"FORWARD\":\n        gpio.output(motor1pin, gpio.HIGH)\n  \
    \      gpio.output(motor2pin, gpio.HIGH)\n    elif action == \"LEFT\":\n     \
    \   gpio.output(motor1pin, gpio.HIGH)\n        gpio.output(motor2pin, gpio.LOW)\n\
    \    elif action == \"RIGHT\":\n        gpio.output(motor1pin, gpio.LOW)\n   \
    \     gpio.output(motor2pin, gpio.HIGH)\n    elif action == \"STOP\":\n      \
    \  gpio.output(motor1pin, gpio.LOW)\n        gpio.output(motor2pin, gpio.LOW)\n\
    \n# Event Loop to process \"events\" and pass them to the rover function\nwhile\
    \ True:\n    event, values = window.read()\n    print(event, values)\n    if event\
    \ in (None, 'QUIT'): # if user closes window\n        break\n    window['feedback'].update(event)\n\
    \    rover(event)\n\nwindow.close()\n```\n\n# Summary\n\nFor the final code (Listing\
    \ 2), I added a command-line option (lines 6-10) that allows either a local Tkinter\
    \ interface or a web interface. The program default is a Tkinter GUI; however,\
    \ if any command-line text is entered, the PySimpleGUIWeb interface is used.\n\
    \nI was very happy with the performance and features offered by the PySimpleGUI\
    \ library, and I found that the Pi rover project was a simple way to get started.\
    \ The forward left and right motor pins are defined on lines 15 and 16. If you\
    \ are using a Pi motor HAT or an L298N circuit (~$2), their power requirements\
    \ could damage your Raspberry Pi. For small Internet of Things (IoT) projects,\
    \ you can use PySimpleGUI and PySimpleGUIWeb to create dashboard interfaces with\
    \ bar and real-time charts. You can also define backward left and right motor\
    \ pins (Direct-wiring the Pi pins using a relay top only supports one direction\
    \ for the motors.).\n\nA rover function (lines 21-33) controls the motors according\
    \ to the action.\n\nmended because their power requirements could damage your\
    \ Raspberry Pi. If you're on a budget, you can create your own motor protection\
    \ circuit with an L298N dual H-bridge chip.\n\n**Figure 4:** PySimpleGUIWeb button\
    \ example.\n\n**Figure 5:** PySimpleGUI rover GUI.\n\nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\n\
    ISSUE 241\nDECEMBER 2020\n"
  mdcn: "\n\n# MakerSpace 圣诞创意制作\n## 创作者的圣诞乐趣\n使用微控制器、伺服电机、NeoPixel LED 灯环和小型 MP3\
    \ 播放器制作你自己的圣诞音乐盒。\n\n作者：Bernhard Bablok\n\n我制作自己设计的音乐盒的灵感源于这些挫败感。在圣诞节期间，音乐盒和圣诞金字塔是最畅销的产品。在电子元件方面，你不需要许多组件。以下章节旨在为你自己的项目提供思路；昂贵的手工雕刻品可以卖四位数，而廉价的仿品售价\
    \ 20 欧元（约 17 美元）。本例使用的圣诞金字塔部件很容易通过蜡烛的热量驱动，也可以替换为你喜欢的任何东西。特别是那些廉价的款式，其木盒揭示了深度。蜡烛与螺旋叶片的比例非常不利，如果没有机械帮助的情况下，金字塔将无法旋转。这个项目中最重要的元素是光、运动和音乐。音乐盒由脆弱的弹簧驱动，但不断需要重新发条会破坏乐趣。\n\
    \n# 控制\n\n为了控制这个项目，我使用了来自 Adafruit 的 Trinket M0 微控制器 [1]（图 1），它运行 CircuitPython，这是一种极简的\
    \ Python，通过其丰富的库支持广泛的外围设备。控制器的价格与 Pi Zero 相当（包含 SD 卡），但它更容易操作，因为你不需要安装和配置操作系统。\n\
    \n微控制器的另一个优势是你是不需要启动它的，只需关闭而不会损坏安装。不过，最大的优势是对 CircuitPython 的支持。这里提供的示例说明了只需要少量的代码就能实现——\n\
    \n# 作者\n\nBernhard Bablok 在 Allianz Technology SE 担任 SAP HR 开发人员。当他不在听音乐、骑自行车或步行时，他处理与\
    \ Linux、编程和小型计算机相关的话。你可以通过 mail@bablok.de 与他联系。\n\n你可以访问 https://funprojects.blog\
    \ 查看 Pete Metcalfe 及其女儿的更多有趣项目。\n\n# 信息\n\n[1] PySimpleGUI 文档：https://pysimpleGUI.readthedocs.io/\n\
    \n[2] Pimoroni Explorer HAT Pro：https://www.adafruit.com/product/2427\n\n# 图 6：带有\
    \ PySimpleGUIWeb 的 Raspberry Pi 行星车。\n\n# 列表 2：PySimpleGUI/Web 行星车\n\n```python\n\
    # SGui_rover.py - 使用 PySimpleGUI/Web 控制 Pi 行星车\nimport sys\nimport PySimpleGUIWeb\
    \ as sg\nimport RPi.GPIO as gpio\n\n# 窗口内的所有内容。\nmyfont = \"Arial 32\"\n\n# 传递任何命令行参数用于\
    \ Web\nlayout = [\n    sg.Text(\"\",size=(20,1), key=\"feedback\")\n]\nif len(sys.argv)\
    \ > 1: # 如果使用了 Web 界面\n    mode = \"web\"\n    layout += [\n        sg.Button(\"\
    FORWARD\", size=(32,3), font=myfont, button_color=('white', 'green')),\n     \
    \   sg.Button(\"LEFT\", size=(15,3), font=myfont),\n        sg.Button(\"RIGHT\"\
    , size=(15,3), font=myfont),\n        sg.Button(\"STOP\", size=(32,3), font=myfont,\
    \ button_color=('white', 'red')),\n        sg.Button(\"QUIT\")\n    ]\nelse: #\
    \ 默认使用 tkinter GUI\n    mode = \"tkinter\"\n    layout = [\n        sg.Text(\"\
    \",size=(20,1), key=\"feedback\"),\n        sg.Button(\"FORWARD\", size=(32,3),\
    \ font=myfont, button_color=('white', 'green')),\n        sg.Button(\"LEFT\",\
    \ size=(15,3), font=myfont),\n        sg.Button(\"RIGHT\", size=(15,3), font=myfont),\n\
    \        sg.Button(\"STOP\", size=(32,3), font=myfont, button_color=('white',\
    \ 'red')),\n        sg.Button(\"QUIT\")\n    ]\n\ngpio.setmode(gpio.BOARD)\n\n\
    # 定义电机引脚匹配你的设置\nif mode == \"web\":\n    motor1pin = 38 # 左侧电机\n    motor2pin\
    \ = 37 # 右侧电机\n    gpio.setup(motor1pin, gpio.OUT)\n    gpio.setup(motor2pin,\
    \ gpio.OUT)\n    window = sg.Window('PySimpleGUI Rover Control', layout, web_ip='192.168.0.106',\
    \ web_port=8888, web_start_browser=False)\nelse:\n    window = sg.Window('PySimpleGUI\
    \ Rover Control', layout)\n\n# 发送动作控制行星车\ndef rover(action):\n    if action ==\
    \ \"FORWARD\":\n        gpio.output(motor1pin, gpio.HIGH)\n        gpio.output(motor2pin,\
    \ gpio.HIGH)\n    elif action == \"LEFT\":\n        gpio.output(motor1pin, gpio.HIGH)\n\
    \        gpio.output(motor2pin, gpio.LOW)\n    elif action == \"RIGHT\":\n   \
    \     gpio.output(motor1pin, gpio.LOW)\n        gpio.output(motor2pin, gpio.HIGH)\n\
    \    elif action == \"STOP\":\n        gpio.output(motor1pin, gpio.LOW)\n    \
    \    gpio.output(motor2pin, gpio.LOW)\n\n# 事件循环处理“事件”并将其传递给 rover 函数\nwhile True:\n\
    \    event, values = window.read()\n    print(event, values)\n    if event in\
    \ (None, 'QUIT'): # 如果用户关闭窗口\n        break\n    window['feedback'].update(event)\n\
    \    rover(event)\n\nwindow.close()\n```\n\n# 总结\n\n对于最终代码（列表 2），我添加了一个命令行选项（第\
    \ 6-10 行），允许本地 Tkinter 界面或 Web 界面。程序默认是 Tkinter GUI；但是，如果输入任何命令行文本，将使用 PySimpleGUIWeb\
    \ 界面。\n\n我对 PySimpleGUI 库提供的性能和功能非常满意，并发现 Pi 行星车项目是一个入门的简单方法。前进、左、右电机引脚在第 15 和第\
    \ 16 行定义。如果你使用 Pi 电机 HAT 或 L298N 电路（约 2 美元），它们的功率需求可能会损坏你的 Raspberry Pi。对于小型物联网（IoT）项目，你可以使用\
    \ PySimpleGUI 和 PySimpleGUIWeb 创建带有条形图和实时图表的仪表板界面。你还可以定义后退、左、右电机引脚（使用继电器顶层直接连接\
    \ Pi 引脚仅支持电机的单向运行）。\n\nrover 函数（第 21-33 行）根据动作控制电机。\n\n"
