    # Fail2ban Frustrates Attackers


    The attacker usually leaves daemon password guessing to an automated attack program,
    which stubbornly processes one entry after the other from a dictionary. You can
    protect yourself against this kind of attack. Tools such as Fail2ban do not completely
    prevent dictionary attacks, but they ramp up the time required for the attack
    to the extent that the attacker usually gives up in frustration.


    Fail2Ban consists of a server daemon and a client that interprets the central
    configuration files fail2ban.conf and jail.conf sends commands to the server.
    The program reads one or more logfiles and checks each line with regular expressions.
    For example, if a defined number of login attempts is exceeded, Fail2Ban can use
    iptables to block the IP address of the attacker for a configurable time.


    Figure 5: SSH keys offer a convenient option for You can install Fail2ban with
    the apt install fail2ban logging in on remote computers without a password.


    command. Many distributions come with Fail2ban already 16


