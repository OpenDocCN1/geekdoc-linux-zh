    ## 往期期刊


    《Linux Magazine》是你探索 Linux 世界的指南。每期杂志都充满了你在其他任何地方找不到的高级技术文章和教程。探索你完整的往期期刊目录，查找特定主题以完善你的收藏。在线订购：https://bit.ly/Linux-Newsstand


    ## 动起来了


    构建整个操作系统？嗯，可能不是 Linux，但如果你感兴趣，可以使用在线资源实现实验性操作系统的基本功能。我们无法向你展示整个过程，但我们会帮你整理思路并迈出第一步。DVD
    内容：Linux Magazine 20 周年纪念 DVD


    ## 构建 IRC 机器人


    IRC 机器人负责在互联网上协调和转发聊天消息的核心工作。本月，我们将展示如何构建你自己的自定义机器人——并带你深入了解如何与 IRC 直接交互。DVD 内容：Debian
    10.5 和 Devuan 3.0


    ## 加速你的系统


    如果你的系统以峰性能运行，你的 Linux 体验将流畅得多。本月我们关注一些及时的技术，包括内核新的压力压力指标（PSI）功能。DVD 内容：Bodhi Linux
    5.1 和 openSUSE Leap 15.2


    ## 摄像头与 Linux


    本月我们探索了摄像头、录屏以及一种酷炫的提词器工具。我们还查看了 PHP Building Blocks、基于 HTML5 的无客户端远程访问工具 Guacamole，以及对实用的
    MystiQ 音视频转换工具的调研。DVD 内容：Ubuntu Studio 20.04 和 Kubuntu 20.04


    ## 更智能的目录


    全球计算机系统中使用的嵌套文件和目录的僵化结构是在 60 多年前创建的，专家认为我们可以做得更好。本月，你将学习一些用于 Linux 语义文件标记的脚本。DVD
    内容：Fedora Workstation 32 和 Ubuntu“Focal Fossa” Desktop 20.04 LTS


    ## Systemd 新动态


    Systemd 是一个不断带来惊喜的谜。。领先领先 Linux 初始化系统的一个新功能将改变你对用户主目录的认知。本月，我们将仔细观察 systemd-homed。DVD
    内容：Noppix 8.6 和 Mandriva Linux 4.1


