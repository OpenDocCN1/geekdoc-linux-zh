    Stokes'' theorem is an important theorem in calculus that relates the surface
    integral of the curl of a vector field over any closed surface to the line integral
    of the vector field over its boundary. Let $S$ be an oriented surface, $\mathbf{n}$
    be the outward unit normal vector to $S$, and $\partial S$ be the boundary curve
    of $S$ with orientation consistent with $S$. Then $\iint_{S} \nabla \times \mathbf{F}
    \cdot d\mathbf{\sigma} = \int_{\partial S} \mathbf{F} \cdot d\mathbf{l}$.


    - Let $\mathbf{F}(x,y,z) = (-y, x, 0)$ and $S$ be the unit disk in the $xy$-plane.

    - Let $\mathbf{F}(x,y,z) = (0, z, x)$ and $S$ be the unit disk in the $yz$-plane.

    - Let $\mathbf{F}(x,y,z) = (y, 0, z)$ and $S$ be the unit disk in the $zx$-plane.


    For each case, compute the curl of $\mathbf{F}$ and evaluate the surface integral
    over $S$. Then evaluate the line integral over $\partial S$.


