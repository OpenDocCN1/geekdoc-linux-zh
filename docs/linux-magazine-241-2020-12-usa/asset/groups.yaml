    \ *Start* 按钮时，会出现一个菜单树。在菜单显示和图 1 中：RebornOS 为 Gnome 磁贴提供了十多个桌面选择，应用程序在安装时并没有按字母顺序出现。如果你安装了较多的额外应用程序（如\
    \ Dropbox、Steam 或 Spotify），这尤其成问题。虽然视觉上很有吸引力，但 RebornOS 缺少这一出色的搜索功能。在开始安装之前，让我们查看两种显示模式下都可用的资源密集程序，让你检查你的选择。启动时，某些桌面环境会为你显示一个用于\
    \ Flatpak 包管理的窗口。RebornOS 默认启用 Flatpak 包管理，这意味着你可以从 Flathub 仓库获取软件 [2]。（图 3）（图\
    \ 2）。图 2：RebornOS 安装程序让你选择想要安装的应用程序。\n\n### 差异\n根据你选择的软件选项和可用网络带宽，安装可能需要一些时间，因为大多数软件是从仓库获取的。可用软件也取决于你选择的桌面环境。根据你的界面，你主要会在菜单中找到属于该桌面环境的实用程序。如果你不想这样做，可以在窗口中取消勾选此选项。如果你想集成该仓库，将启动\
    \ Gnome 软件前端并自动集成 Flathub。在后台，它会同时检查更新。如果发现任何更新，程序将不会按字母顺序出现。得益于集成的搜索功能，你仍然可以快速找到它们。\n\
