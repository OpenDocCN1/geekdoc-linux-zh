    ## 深度解析


    ## Cockpit


    ### 使用 Cockpit 管理工具管理服务器


    来自 Cockpit


    结识 Cockpit，这是一款易于使用的管理工具，让你能够通过方便的 Web 界面监控你的 Linux 服务器。作者：Marco Fiore


    优势与局限性


    关于 Cockpit 需要了解的第一个点是：一次安装就可以控制其他正在运行的远程机器。如果能在同一个浏览器标签页中配置并控制所有的 Linux 系统——通过
    Cockpit，那不是太棒了吗？它并不是一个像 Ansible [5] 或 Puppet [6] 那样通过单一友好界面的配置管理系统。Cockpit 拥有许多功能。你无法告诉
    Cockpit “我希望我所有的 Linux 机器看起来都这样”，而这个愿望的答案是一个名为 Linuxconf [1] 的项目，该项目在 2005 年停止了开发，即使你只需要它的功能中的一两个，也不会怀念。这种局限性也是它的优势，因为
    Cockpit 刻意保持轻量化，因此易于使用。


    Linuxconf 试图一次性完成太多事情，而且经常与大多数发行版的默认管理工具冲突。从表面上看，Cockpit 洁洁、直观且流畅，即使在浏览器开启许多其他标签页的情况下也是如此。Linuxconf
    之后出现了 Webmin [2]，它仍在活跃开发且非常有用；但在我看来，Webmin 的界面过时，且你需要较好的 Linux 知识才能正确使用。它的界面比标准的低级
    Linux 工具要得多（图 1）。


    对更好管理工具的追求了几年前 Cockpit 项目 [3] 的启动。Cockpit 是一个免费开源的 Web 界面，后端通过 systemd sockets
    [7] 与其控制的 Linux 系统通信。systemd sockets 是一种在管理 Linux 系统时 own占用任何内存的连接器。它们不需要做任何操作，只需在需要时激活
    Cockpit 组件即可。


    Cockpit 项目的官方目标是让“非专家管理员也能使用 Linux 服务器”，并让“复杂的 Linux 特性变得可发现” [4]。Cockpit 受 Red
    Hat 支持，但你可以在任何发行版上运行。本教程解释了 Cockpit 如何工作，以及它如何以及为何可能帮助你简化和整合 Linux 管理任务。


    默认情况下，Cockpit 不存储性能或状态数据，也不会为其控制的计算机保留配置副本，除非是连接该计算机所需的参数。


