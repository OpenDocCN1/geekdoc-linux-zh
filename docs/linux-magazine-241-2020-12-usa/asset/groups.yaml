    Tinkering Time

    I deliberately kept the electronic part of the project minimal. The whole thing
    relies on an external micro-USB power supply. If you are ahead of the game, you
    will probably want to use a lithium polymer battery with a charging circuit and
    various switches to control the lighting effects, movement, and music. Because
    the O pins on the Trinket M0 are capacitive, the buttons can even be hidden inside
    the music box. However, the five pins of the Trinket M0 can prove restrictive,
    so you might need a larger microcontroller.

