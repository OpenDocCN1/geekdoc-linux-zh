  mdcn: '

    主镜像，将其复制到可移动磁盘上。DRBL Live CD 既可以作为刻录到光盘的 ISO 文件提供，也可以作为压缩的 IMG 文件传输到 USB 磁盘上。如果你的计算机帝国只延伸到几台电脑，你将乐意通过
    Live 环境使用 Clonezilla。在需要部署大量计算机的大型网络中，通过网络部署镜像更高效，这需要设置一个服务器。另一方面，如果你管理一所小学校或办公室，可以使用
    `dd` 或通过像 UNetbootin 这样的图形化工具。


    在本教程中，我将使用 Clonezilla SE 从网络中的某台机器创建主镜像（参见“测试实验室”框）。


    ## 什么是 Clonezilla？


    Clonezilla [1] 是一个基于 ncurses 的前端，用于运行 Parted、ntfsclone、Partclone 和 `dd`、HFS+ 等开源磁盘实用程序。如果
    Clonezilla 遇到它不理解的分区类型，它将启动老牌的 `dd` 工具并完成任务。你可以使用 Clonezilla 复制特定的分区。你还拥有压缩分区甚至整个磁盘的选项。它还将使用
    gzip、bzip2 或 LZO 压缩算法克隆镜像。Clonezilla 支持大量的文件系统，甚至更多。它可以在本地连接的设备（如连接到计算机的 USB 磁盘）上、通过网络在另一台计算机上、甚至在云端上运行。


    ## 配置服务器


    第一步是创建根分区的镜像并帮助计算机。转到作为你的 Live DRBL 服务器的计算机并进入 Live 环境。一旦图形界面启动，双击桌面上的 Clonezilla
    服务器图标以启动配置服务器的过程。


    ### NHC 自由软件实验室，塔林林


    在克隆之前，你必须指定 Clonezilla 镜像目录的保存或读取位置。我们将选择本地设备或远程资源作为 `/home/partimag/`。Clonezilla
    镜像将保存到或从 `/home/partimag/` 读取。


    | 选项 | 描述 |

    | :--- | :--- |

    | local, dev | 使用本地设备（例如硬盘、USB 驱动器） |

    | sh server | 使用 SSH 服务器 |

    | samba server | 使用 SAMBA 服务器（网络邻域服务器） |

    | fs server | 使用 NFS 服务器 |

    | webdav | 使用 WebDAV 服务器 |

    | s3 server | 使用 S3 服务器 |

    | swift server | 使用 OpenStack swift 服务器 |

    | enter_shell | 进入命令行提示符。手动操作 |

    | skip | 使用现有的 /home/partimag（内存）！*不建议使用* |


    ## 深入了解 Clonezilla SE


    ### 测试实验室


    掌握流程后，你可以选择第二个选项，它允许你在克隆过程中标记网络上的特定计算机，以便稍后进行克隆。第一个选项本身没有坏处；第二个选项只是让你对过程有更多控制权。随后
    Clonezilla 将询问你是否想在启动克隆过程之前使用 `fsck` 检查并修复文件系统。在创建镜像之前，确保文件系统处于持久状态始终是一个好主意。同样，在下一个屏幕中，选择“初学者”（Beginner）选项，让
    Clonezilla 为尽可能多的参数选择默认选项。一旦你对该流程更加熟悉，就可以通过选择“专家”（Expert）选项来掌握主动，这允许你自定义各种参数的设置。


    网络中的所有其他计算机也连接到这个网络交换机。我的 DRBL 服务器将自动为它们分配 IP 地址。内部网络中的其中一台计算机是文件服务器。与其他机器不同，这台文件服务器具有静态
    IP 地址 (192.168.1.200)。我在这台计算机上安装了 `openssh-server` 包，网络中的所有其他计算机都可以 SSH 进入这台计算机。我将将其作为存放所有克隆镜像的镜像库。


    接下来你必须为 Clonezilla 实例选择模式。由于我正在创建主镜像，我将选择 `save-disk` 选项对整个磁盘进行成像。现在将提示提供一些信息以帮助启动
    DRBL 服务器。


    首先，Clonezilla 将询问你网络适配器的网络配置。在我的测试实验室，其中一个适配器从网络上运行的 DHCP 服务器获取了 IP 地址。当要求输入设备名称时，一对网卡
    (eth0) 连接到 ISP 路由器，并通过 DHCP 由路由器分配了 IP 地址。另一个 (eth1) 连接到网络交换机。在设置期间，我将为 DRBL 服务器分配一个静态
    IP 地址 (192.168.1.100)。


    '
