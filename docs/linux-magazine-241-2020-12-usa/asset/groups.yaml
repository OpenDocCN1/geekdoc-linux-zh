- md: "\naround gathering dust until the cron job listed as the search term, it switches\
    \ its behavior and only returns case-specific results. I'm not very good at sorting\
    \ things sensibly and then finding them again – both in my office and on my computers’\
    \ filesystems. After 365 days. While doffing a hat to the now impressive power\
    \ of the GNU implementation of the latter, at least I have electronic help in\
    \ the form of tools like find and, more importantly, fd. You can search for file\
    \ extensions with the -e parameter. For example, to find all PNG images in and\
    \ below the current directory, just type:\n\nThe find command existed on Unix\
    \ systems long before Linux was invented you still sometimes find yourself wishing\
    \ for a tool that can perhaps do a little less, but one that is more intuitive\
    \ to use. This is where fd [2] jumps into the breach. The compact younger sibling\
    \ of find, fd, has-in fact, it's older than most of the people who use it. On\
    \ many of my systems, it has already made its way into many distributions, but\
    \ often only recently. In Ubuntu, it is available starting with version 19.04,\
    \ for example. By way of an example, the command directory named /test where I\
    \ try things out. Anything that proves use is sent to Git; the rest just hangs.\n\
    \n# Listing 1: Crontab Entry\n\nAfter installing fd on my test Ubuntu, I now have\
    \ a fdfind command. But the tool finds file names that start with a and end with\
    \ png. The GitHub page [2] for the tool developed it quite clear that they explain\
    \ many applications and parameters. The tool is named fd and use this name.\n\n\
    ```\nfd -e png '^*a.png$'\nfind /test/* -mtime +365 -exec rm {};\n```\n\nNow all\
    \ I really need is a physical counterpart to tidy up my office ... Q Q Q. In order\
    \ to permanently teach my system the short form, I just added an alias fd=find\
    \ entry to my.bashrc.\n\n# Info\n\n[1] GNU find: https://www.gnu.org/software/findutils/manual/html_mono/find.html\n\
    [2] fd: https://github.com/sharkdp/fd\n\nQuickly perusing the man page reveals\
    \ that fd can definitely do less than find, but it does what it does well, intuitively,\
    \ and quickly. Typing fd without any further parameters returns the current case,\
    \ but it can even handle regular expressions including all extents if necessary.\n\
    \nFigure 1: Without concrete instructions, fd ignores the current directory’s\
    \ config.\n\n# Author\n\nCharly Kühnast manages Unix systems in a data center\
    \ in the Lower Rhine region of Germany. His responsibilities include ensuring\
    \ the security and availability of firewalls and the DMZ.\n\nLINUX-MAGAZINE.COM\
    \ | LINUXPROMAGAZINE.COM | ISSUE 241 | DECEMBER 2020 | 65\n\n# PySimpleGUI\n\n\
    Quick and easy with PySimpleGUI\nSimple Is Good\n\n# Use the same code for your\
    \ Python GUI and web apps.\n\nBy Pete Metcalfe\n\na Raspberry Pi rover, all in\
    \ less than 60 lines of code. The PySimpleGUI project has two main goals: a simpler\
    \ method for creating graphical user interfaces (GUIs), and common code for Tkinter,\
    \ Qt, and web graphics.\n\n# Getting Started\n\nThe Python PySimpleGUI [1] project\
    \ has a number of \"ports\" or versions. The main full-featured version is for\
    \ Tkinter-based graphics. The versions for Qt, Wx, and web graphics are still\
    \ extremely useful, especially for Raspberry Pi projects. In this article, I introduce\
    \ PySimpleGUI and create both a local GUI and a web interface to control, ensuring\
    \ code compatibility between the different libraries.\n\nFigure 2: PySimpleGUI\
    \ layout example.\nFigure 1: PySimpleGUI uses the graphic libraries for (top to\
    \ bottom) Tkinter, Qt, and web app.\nFigure 3: PySimpleGUI button example.\n\n\
    To install PySimpleGUIWeb enter:\n\n```\n# Create a simple graphic interface with\
    \ three rows.\npip install remi\npip install pysimpleGUIweb\n```\n\n# A Button\
    \ Interface\n\n```python\nimport PySimpleGUI as sg\n\nlayout = [\n    [sg.Text(\"\
    the feedback\", key=\"feedback\")],\n    [sg.Button(\"FORWARD\")],\n    [sg.Button(\"\
    LEFT\"),sg.Button(\"RIGHT\")],\n    [sg.Button(\"STOP\")],\n    [sg.Button(\"\
    QUIT\")]\n]\n```\n\n# Create the Window\n\n```python\nwindow = sg.Window('My First\
    \ App', layout)\n\n# Event Loop to process \"events\"\n\nwhile True:\n    event,\
    \ values = window.read()\n    window['feedback'].Update(event) # show the feedback\
    \ text\n    print(event,values)\n    if event in (None, 'QUIT'):\n        break\n\
    \nwindow.close()\n```\n\n# Formatting Display Elements\n\nThe next step is to\
    \ adjust the fonts, colors, and size properties of the graphic elements. With\
    \ just three lines you can change the FORWARD button to 32 characters wide and\
    \ three lines high with that changed (line 15). Added color and a larger font:\
    \ The feedback text element (line 5) is given the key name feedback, which is\
    \ used by the Tkinter graphic engines, the possibility exists. Figure 1 shows\
    \ examples of the same code applied to the different graphic libraries.\n\n```python\n\
    [sg.Button(\"FORWARD\", size=(32,3)), font=\"Arial 32\", button_color=('white',\
    \ 'green')])\n\n# Standalone Web Apps\n\nThe PySimpleGUIWeb library is excellent\
    \ for creating a lightweight standalone web interface. The real beauty in PySimpleGUIWeb\
    \ is that no HTML, style sheets, Ajax, or JavaScript code is required. PySimpleGUI\
    \ has a wide range of graphic widgets or elements. PySimpleGUIWeb is ideal for\
    \ small, single-user web interfaces, presentations are built by creating a layout\
    \ variable, and it supports features like a tabbed interface, tables, and graphics.\n\
    \n# Raspberry Pi Rover\n\nFor my rover, I used a low-cost Arduino car chassis\
    \ (~$15) and a portable phone charger to power the Raspberry Pi. Duct or painters\
    \ tape works well to secure the Pi and charger to the chassis. Connecting motors\
    \ directly to the Raspberry Pi GPIO pins is not recommended.\n"
  mdcn: "\n直到 cron 任务列出的搜索词，否则它一直在那里积灰，然后它会改变行为并只返回特定情况的结果。我不怎么擅长合理地整理物品然后再次找到它们——无论是在我的办公室还是在计算机的文件系统上都是如此。在\
    \ 365 天后。虽然对 GNU 后后者现在令人惊叹的功能表示敬意，但我至少还有像 `find` 以及更重要的 `fd` 这样的电子工具。你可以使用 `-e`\
    \ 参数搜索文件扩展名。例如，要查找当前目录及其子目录下所有的 PNG 图像，只需输入：\n\n`find` 命令在 Linux 发明之前就已经存在于 Unix\
    \ 系统中了，你有时仍然会渴望一个功能可能少一点、但使用起来更直观的工具。这正是 `fd` [2] 大显用场的地方。`fd` 是 `find` 的紧凑版，事实上，它比大多数使用它的人都要老。在我的许多系统中，它已经进入了许多发行版，但通常是最近。例如，在\
    \ Ubuntu 中，它从 19.04 版本开始可用。举个例子，有一个名为 `/test` 的目录，我在那里尝试各种东西。任何证明有用的东西都会发送到 Git；剩下的就挂在那里。\n\
    \n# 列表 1：Crontab 条目\n\n在我的测试 Ubuntu 上安装 `fd` 之后，我现在有了 `fdfind` 命令。但该工具找到的是以 a\
    \ 开头并以 png 结尾的文件。该工具的 GitHub 页面 [2] 非常清楚地解释了许多应用和参数。该工具名为 `fd`，并请使用这个名字。\n\n```\n\
    fd -e png '^*a.png$'\nfind /test/* -mtime +365 -exec rm {};\n```\n\n现在我真正需要的一个物理上的对应物来收拾我的办公室……Q\
    \ Q Q。为了让我的系统永久记住简写形式，我只是在 `my.bashrc` 中添加了 `alias fd=find` 条目。\n\n# Info\n\n\
    [1] GNU find: https://www.gnu.org/software/findutils/manual/html_mono/find.html\n\
    [2] fd: https://github.com/sharkdp/fd\n\n快速浏览手册页可以发现，`fd` 的功能确实比 `find` 少，但它能把自己的擅长工作很好——直观且快速。输入没有任何后续参数的\
    \ `fd` 会返回当前情况，但必要时它甚至可以处理包括所有范围的正则表达式。\n\n图 1：在没有具体指令的情况下，`fd` 忽略了当前目录的配置。\n\n\
    # Author\n\nCharly Kühnast 在德国下莱茵地区的数据中心管理 Unix 系统。他的职责包括确保防火墙和 DMZ 的安全和可用。\n\n\
    LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM | ISSUE 241 | 2020年12月 | 65\n\n# PySimpleGUI\n\
    \n使用 PySimpleGUI 快速又简单\n简单即美 (Simple Is Good)\n\n# 为你的 Python GUI 和网络应用使用相同的代码。\n\
    \n作者 Pete Metcalfe\n\n一个树莓派漫游车，所有代码均在 60 行以内。PySimpleGUI 项目有两个主要目标：一种更简单的创建图形用户界面（GUI）的方法，以及用于\
    \ Tkinter、Qt 和网络图形的通用代码。\n\n# 入门\n\nPython PySimpleGUI [1] 项目有许多“端口”或版本。主全功能版本用于基于\
    \ Tkinter 的图形。Qt、Wx 和网络图形版本仍然非常有用，特别是树莓派项目。在本文中，我介绍了 PySimpleGUI 并创建了本地 GUI 和网络接口进行控制，确保不同库之间的代码兼容性。\n\
    \n图 2：PySimpleGUI 布局示例。\n图 1：PySimpleGUI 使用图形库（从上到下）：Tkinter、Qt 和网络应用。\n图 3：PySimpleGUI\
    \ 按钮示例。\n\n安装 PySimpleGUIWeb 输入：\n\n```\n# 创建一个三行的简单图形界面\npip install remi\npip\
    \ install pysimpleGUIweb\n```\n\n# 按钮界面\n\n```python\nimport PySimpleGUI as sg\n\
    \nlayout = [\n    [sg.Text(\"the feedback\", key=\"feedback\")],\n    [sg.Button(\"\
    FORWARD\")],\n    [sg.Button(\"LEFT\"),sg.Button(\"RIGHT\")],\n    [sg.Button(\"\
    STOP\")],\n    [sg.Button(\"QUIT\")]\n]\n```\n\n# 创建窗口\n\n```python\nwindow =\
    \ sg.Window('My First App', layout)\n\n# 处理“事件”的事件循环\n\nwhile True:\n    event,\
    \ values = window.read()\n    window['feedback'].Update(event) # 显示反馈文本\n    print(event,values)\n\
    \    if event in (None, 'QUIT'):\n        break\n\nwindow.close()\n```\n\n# 格式化元素\n\
    \n下一步是调整图形元素的字体、颜色和大小属性。只需三行代码你就可以将 FORWARD 按钮更改为 32 个字符宽、三行高（第 15 行）。添加了颜色和更大的字体：反馈文本元素（第\
    \ 5 行）被赋予了键名 feedback，它可以被 Tkinter 图形引擎使用，这种可能性是。图 1 显示了相同代码应用于不同图形库的示例。\n\n```python\n\
    [sg.Button(\"FORWARD\", size=(32,3)), font=\"Arial 32\", button_color=('white',\
    \ 'green')])\n\n# 独立 Web 应用\n\nPySimpleGUIWeb 库非常适合创建轻级的独立网络界面。PySimpleGUIWeb\
    \ 的真正美丽在于不需要 HTML、样式表、Ajax 或 JavaScript 代码。PySimpleGUI 拥有广泛的图形组件或元素。PySimpleGUIWeb\
    \ 非常适合小型单用户网络界面，通过创建布局变量来构建演示文，并支持标签页界面、表格和图形等功能。\n\n# 树莓派漫游车\n\n对于我的漫游车，我使用了一个廉价的\
    \ Arduino 底盘（约15美元）和一个便携手机充电器为树莓派供电。使用胶带或油漆可以将树莓派和充电器固定在底盘上。不建议将电机直接连接到树莓派的 GPIO\
    \ 引脚。\n"
