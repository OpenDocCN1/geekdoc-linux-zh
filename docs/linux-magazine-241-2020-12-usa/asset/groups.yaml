    # FOSSPICKS LINUX 语音推荐


    在线射击游戏

    batufo


    这是一个简单但极棒的小游戏。当然，你的任务是玩这个小游戏，原因是为了利用各种理由摧毁那些其他玩家。首先最重要的是，你可以使用激光，或者放置一个恰当的感应地雷，当你或其他玩家经过它时它就会爆炸。大多数时候，这是一款非常令人上瘾的游戏。你控制一个在各种
    2D 滚动竞技场中移动的 UFO。要进行转向，向左右旋转你的飞行器，然后通过短促的推力向你面对的方向加速。


    巧妙的地方在于，这些玩家是真实的人类，就像你在《小行星卫》（Asteroids）中那样一样，因为 batfu 轻松实现了多人游戏。


    batfu 成为如此好玩的另一个原因是它能教你一些关于游戏开发的知识。在学习如何驾驶 UFO 并击败同类的同时，还在学习一个全新的应用程序框架。最终结果是，你可以像台球一样在墙壁上反弹，并由开发者记录的整个工作
    Flutter 提供支持。Flutter 应用通常使用 Dart 语言开发，它们有自己的一系列优秀和其他视频，这些视频从它们的网站上链接出来。这些视频展示了游戏开发的每个阶段，可以收集道具并穿过扭曲点，但障碍物的构建很快且占用的系统资源很少。它们还轻松支持多平台，并对独立开发者如何进行游戏设计提供了深刻的见解，甚至到了构建游戏的前提是：摧毁任何人都可以下载并使用创建其他玩家的关卡生成器。这些玩家出现在游戏的地图中，与你类似的飞行器在迷宫的墙壁上反弹，并试图在碰撞之前击中道具。你会消耗自己的护盾，而
    batfu 将毫无困难地运行在 Linux、macOS、Windows、Android 甚至网页浏览器中。但所有这一切都已经被处理好了。


    # 项目网站

    https://thlorenz.com/batufo/


    # 游戏引擎


    延续“向 C 语言借鉴”的主题，rg3d 是一个 3D 游戏引擎，它将其许多灵感从基于 C99 的语言平台 Dmitry’s Engine 从一种语法转换为另一种语法。根据它自己的承认，仍然有大量工作要做，但这样做对
    rg3d 的现状也是一种不公平的。为了证明这一点，引擎背后的开发者还在开发一个原型 FPS 演示，目前称为“rusty-shooter”。这是一款直觉驱动、快速且精美的类《毁灭战士》游戏，展示了目前开发的游戏引擎许多部分。Rust
    之所以流行是因为它采用了像 C 这样的系统编程语言的优秀特性，例如其高性能和并发能力。


    相当出色的演示游戏 rusty-shooter 使用 rg3d 游戏引擎编写，旨在展示其能力并帮助新的游戏开发者入门，包括延迟着色（以一种从未预想过的方式进行去抖和压缩），并将其引入现代的垃圾回收、内存分配检查时代。还有了一套配套的系统、物理引擎以及针对许多字体和图像格式的加载器。对于单个开发者来说，这是一项巨大的工作量，它提供了一个同时学习
    3D 游戏开发和无需 Makefile 的构建系统的起点。这一切使得 Rust 成为学习场景编辑器的理想起点，该编辑器可以帮助你在无需重新编译的情况下创建游戏关卡。

