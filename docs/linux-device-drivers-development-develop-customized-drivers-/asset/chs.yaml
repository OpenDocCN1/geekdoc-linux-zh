  \n# 客户反馈\n\n感谢购买本书。在 Packt，质量是我们编辑流程的核心。为了帮助我们改进，请在本书的亚马逊页面上留下诚实的评论。\n\n```\n\n\
  在不同的中断处理程序之间共享数据时（即同一个驱动管理两个或多个设备，每个设备都有自己的 IRQ 线），也应该在这些处理程序中使用 `spin_lock_irqsave()`\
  \ 保护数据，以防止其他 IRQ 被触发并进行无用的自旋。\n\n# 下半部（Bottom halves）的概念\n\n下半部是将中断处理程序分成两个部分的机制。这引入了另一个术语，即上半部（top\
  \ half）。在讨论每一个部分之前，让我们谈谈它们的起源以及它们解决了什么问题。\n\n# 问题 – 中断处理程序的设计局限性\n\n无论中断处理程序是否持有自旋锁，运行该处理程序的\
  \ CPU 都会禁用抢占。在处理程序中浪费的时间越多，分配给其他任务的 CPU 就越少，这可能会显著增加其他中断的延迟并增加整个系统的延迟。挑战在于尽可能地响应触发中断的设备，以保持系统的响应能力。\n\
  \n在 Linux 系统上（实际上由于硬件设计，所有系统的中断处理程序在所有处理器上运行时，其当前中断线都是禁用的），有时你可能需要禁用实际运行处理程序的 CPU\
  \ 上的中断，但你绝对不想错过中断。为了满足这一需求，引入了 `halves`（半）的概念。\n\n![](img/037649.jpg)\n\n# 解决方案\
  \ – 下半部\n\n这个思想将处理程序分成两部分：\n\n*   第一部分，称为上半部或硬中断（hard-IRQ），它是使用 `request_irq()`\
  \ 注册的函数，它根据需要掩码/隐藏中断（在当前 CPU 上，除了正在处理的那个，因为内核在运行处理程序之前已经禁用了它），执行快速且高效的操作（本质上是时间敏感的任务、读/写硬件寄存器，以及对这些数据的快速处理），调度第二和下一部分，然后确认中断线。所有被禁用的中断必须在退出下半部之前重新启用。\n\
  *   第二部分，称为下半部，它将处理耗时的任务，并在重新启用中断的情况下运行。这样，你有机会不错过中断。\n\n下半部是使用我们之前看到的工作延迟机制（work-deferring\
  \ mechanism）设计的。取决于你选择哪一种，它可能在（软件）中断文中运行，也可能在进程文中运行。下半部的机制有：\n\n*   Softirqs（软中断）\n\
  *   Tasklets\n*   Workqueues（工作队列）\n*   Threaded IRQs（线程中断）\n\nSoftirqs 和 tasklets\
  \ 在（软件）中断文中执行（意味着禁用了抢占），Workqueues 和 threaded IRQs 在进程（或简单任务）文中执行，并且可以被抢占，但没有什么阻止我们更改它们的实时属性以适应你的需求，并更改它们的抢占行为（参见\
  \ `CONFIG_PREEMPT` 或 `CONFIG_PREEMPT_VOLUNTARY.`。这也会影响整个系统）。下半部并非总是可能的。但当可行时，这无疑是最好的做法。\n\
  \n# 作为下半部的 Tasklets\n\ntasklet 延迟机制在 DMA、网络和块设备驱动程序中使用得最多。尝试在内核源码中运行以下命令：\n\n```\n\
  grep -rn tasklet_schedule \n```\n\n现在让我们看看如何在我们的中断处理程序中实现这种机制：\n\n```\nstruct my_data\
  \ { \n    int my_int_var; \n    struct tasklet_struct the_tasklet; \n    int dma_request;\
  \ \n}; \n\nstatic void my_tasklet_work(unsigned long data) \n{ \n    /* 在这里执行你想做的任何操作\
  \ */\n} \n\nstruct my_data *md = init_my_data; \n\n/* 在 probe 或 init 函数的某处 */ \n\
  [...] \n   tasklet_init(&md->the_tasklet, my_tasklet_work); \n\nstatic irqreturn_t\
  \ my_interrupt_handler(int irq, void *dev_id)\n\n{\n    struct my_data *md = dev_id;\n\
  \n    /* 调度 tasklet */ \n    tasklet_schedule(&md->the_tasklet);\n\n    return IRQ_HANDLED;\
  \ \n} \n```\n\n在上述示例中，当需要调度 tasklet 时，tasklet 将执行函数 `tasklet_work`。\n\n# 作为下半部的\
  \ Workqueue\n\n让我们直接开始一个示例：\n\n```\nstatic DECLARE_WAIT_HEAD(my_wq);  /* 定义等待队列\
  \ */\nstatic struct work_struct my_work; \n\n/* 在 probe 函数某处 */ \n/* 工作队列初始化。\"\
  work_handler\" 是工作被调度时执行的回调。 \n */ \nINIT_WORK(&my_work, work_handler); \n\nstatic\
  \ irqreturn_t my_interrupt_handler(int irq, void *dev_id) \n{ \n    uint32_t val;\n\
  \    struct my_data *my_data = dev_id; \n\n    val = readl(my_data->reg_base + REG_OFFSET);\
  \ \n   if (val == 0xFFCD4EE) { \n       my_data->done = true; \n         wake_up_interruptible(&my_wq);\
  \ \n   } else { \n         schedule_work(&my_work); \n   } \n\n   return IRQ_HANDLED;\
  \ \n} \n```\n\n在前面的示例中，我们使用等待队列或工作队列来唤醒可能睡眠的进程或调度工作，取决于寄存器的值。我们没有共享数据或资源，因此不需要禁用所有中断（spin_lock_irq）。\n\
  \n# 作为下半部的 Softirqs\n\n正如本开头提到的，我们将不讨论 softirq。在任何觉得需要 softirq 的地方，tasklets 都足够了。无论如何，让我们谈谈它们的默认。\n\
  \nSoftirqs 在中断文中运行，禁用抢占，持有 CPU 直到完成。Softirq 应该是快速的；否则它们会降低系统速度。由于任何原因 softirq 阻止内核调度其他任务时，任何新的\
  \ softirq 将由 `ksoftirqd` 线程处理，这些线程在进程文中运行。\n\n\n\n\n*   **`@handler function`**：此函数与通过\
  \ `request_irq()` 注册的函数相同。它代表上半部（top-half）函数，在原子上下（或硬中断）中运行。如果它可以更快地处理中断，以便你完全不需要下半部（bottom\
  \ half），它应该返回 `IRQ_HANDLED`。但是，如前所述，如果中断处理需要超过 100 µs，则你应该使用下半部。在这种情况下，它应该返回 `IRQ_WAKE_THREAD`，这将调度必须提供的\
  \ `thread_fn` 函数。\n\n*   **`@thread_fn function`**：这代表下半部，就像你在上半部中调度的那样。当硬中断处理程序（handler\
  \ 函数）返回 `IRQ_WAKE_THREAD` 时，与该下半部关联的 kthread 将调度，并在轮到执行 ktread 时调用 `thread_fn` 函数。`thread_fn`\
  \ 函数在完成后必须返回 `IRQ_HANDLED`。执行后，在 IRQ 再次触发且硬中断再次返回 `IRQ_WAKE_THREAD` 之前，kthread 不会被再次调度。\n\
  \n在任何你可以使用工作队列（work queue）调度下半部的地方，都可以使用线程中断。为了实现适当的线程中断，必须定义 `handler` 和 `thread_fn`。如果\
  \ `handler` 为 `NULL` 且 `thread_fn != NULL`，内核将安装默认的硬中断处理程序（见下文），它将简单地返回 `IRQ_WAKE_THREAD`\
  \ 来调度下半部。无论 `handler` 是由你自己提供的还是内核默认提供的，它始终在中断上下文中被调用：\n\n```\n/* \n * 线程中断的默认主中断处理程序。\
  \ \n * 当调用 request_threaded_irq 且 handler == NULL 时，\n * 它被分配为主处理程序。适用于单次触发（oneshot）中断。\
  \ \n */ \nstatic irqreturn_t irq_default_primary_handler(int irq, void *dev_id)\
  \ \n{ \n    return IRQ_WAKE_THREAD; \n} \n\nrequest_threaded_irq(unsigned int irq,\
  \ irq_handler_t handler, \n                         irq_handler_t thread_fn, unsigned\
  \ long irqflags, \n                         const char *devname, void *dev_id) \n\
  { \n        [...] \n        if (!handler) { \n                if (!thread_fn) \n\
  \                        return -EINVAL; \n                handler = irq_default_primary_handler;\
  \ \n        } \n        [...] \n} \nEXPORT_SYMBOL(request_threaded_irq); \n```\n\
  \n使用线程中断时，处理程序的定义没有改变，但其注册方式略有不同。\n\n```\nrequest_irq(unsigned int irq, irq_handler_t\
  \ handler, \\ \n            unsigned long flags, const char *name, void *dev) \n\
  { \n    return request_threaded_irq(irq, handler, NULL, flags, \\ \n           \
  \                     name, dev); \n} \n```\n\n# 线程下半部\n\n下面的简单的节选演示了你如何实现线程下半部机制：\n\
  \n```\nstatic irqreturn_t pcf8574_kp_irq_handler(int irq, void *dev_id) \n{ \n \
  \   struct custom_data *lp = dev_id; \n    unsigned char nextstate = read_state(lp);\
  \ \n\n    if (lp->laststate != nextstate) { \n        int key_down = nextstate <\
  \ ARRAY_SIZE(lp->btncode); \n        unsigned short keycode = key_down ?  \n   \
  \         p->btncode[nextstate] : lp->btncode[lp->laststate]; \n\n        input_report_key(lp->idev,\
  \ keycode, key_down); \n        input_sync(lp->idev); \n        lp->laststate =\
  \ nextstate; \n    } \n    return IRQ_HANDLED; \n} \n\nstatic int pcf8574_kp_probe(struct\
  \ i2c_client *client, \\ \n                          const struct i2c_device_id\
  \ *id) \n{ \n    struct custom_data *lp = init_custom_data(); \n    [...] \n   \
  \ /* \n     * @handler 为 NULL 且 @thread_fn != NULL \n     * 安装了默认的主处理程序，它将返回 \n\
  \     * IRQ_WAKE_THREAD，从而调度与下半部关联的\n     * 线程。下半部在完成后必须返回 \n     * IRQ_HANDLED\
  \ \n     */ \n    ret = request_threaded_irq(client->irq, NULL, \\ \n          \
  \                  pcf8574_kp_irq_handler, \\ \n                            IRQF_TRIGGER_LOW\
  \ | IRQF_ONESHOT, \\ \n                            DRV_NAME, lp); \n    if (ret)\
  \ { \n        dev_err(&client->dev, \"IRQ %d is not free\\n\", \\ \n           \
  \      client->irq); \n        goto fail_free_device; \n    } \n    ret = input_register_device(idev);\
  \ \n    [...] \n} \n```\n\n当中断处理程序执行时，被服务的 IRQ 在所有 CPU 上都会禁用，并在硬中断（上半部）完成后重新启用。但如果由于某种原因，你需要\
  \ IRQ 线路保持禁用状态直到下半部完成，你应该带有 `IRQF_ONESHOT` 标志请求 IRQ。\n\n# 从内核调用用户空间应用程序\n\n在前面的的示例中，使用的\
  \ API（`call_usermhelper`）是 Usermode-helper API 的一部分，所有函数定义在 `kernel/kmod.c` 中。它的用法非常简单；只需查看\
  \ `kmod.c` 就能让你了解。\n\n```\n#include <linux/init.h> \n#include <linux/module.h> \n\
  #include <linux/workqueue.h>    /* 用于工作队列 */\n#include <linux/kmod.h> \n\nstatic\
  \ struct delayed_work initiate_shutdown;\nstatic void delayed_shutdown( void ) \n\
  { \n   char *cmd = \"/sbin/shutdown\"; \n   char *argv[] = { \n         cmd, \n\
  \         \"-h\", \n         \"now\", \n         NULL, \n   }; \n   char *envp[]\
  \ = { \n         \"HOME=/\", \n         \"PATH=/sbin:/bin:/usr/sbin:/usr/bin\",\
  \ \n         NULL, \n   }; \n\n   call_usermhelper(cmd, argv, envp, 0); \n}\n\n\
  static int __init my_shutdown( void ) \n{ \n    schedule_delayed_work(&initiate_shutdown,\
  \ msecs_to_jiffies(200)); \n    return 0; \n}\n\nstatic void __exit my_shutdown(\
  \ void ) \n{ \n  return; \n} \n\nmodule_init( my_shutdown ); \nmodule_exit( my_shutdown\
  \ ); \n\nMODULE_LICENSE(\"GPL\"); \nMODULE_AUTHOR(\"John Madieu\", <john.madieu@gmail.com>);\
  \ \nMODULE_DESCRIPTION(\"触发延迟关机的简单模块\");\n```\n\n# 总结\n\n在本章中讨论了启动驱动开发的基础元素，介绍了驱动程序中常用的各种机制。这一章非常重要，因为书中其他章节都依赖这些主题。例如，处理字符设备的下一章将使用本章讨论的一些元素。\n\
  \n# 字符设备驱动\n\n字符设备通过字符以流式方式（一个接一个字符）向用户应用程序传输数据，就像串口那样。字符设备驱动通过 `/dev` 目录中的特殊文件暴露设备的属性和功能，用户可以使用该文件在设备和用户应用程序之间交换数据，并允许你控制真实的物理设备。这是\
  \ Linux 的基本概念，即*一切皆文件*。字符设备驱动代表内核源码中最基础的设备驱动。字符设备在内核中表示为 `struct cdev` 的实例，其定义在\
  \ `include/linux/cdev.h` 中：\n\n```\nstruct cdev { \n    struct kobject kobj; \n\
  \    struct module *owner; \n    const struct file_operations *ops; \n    struct\
  \ list_head list; \n    dev_t dev; \n    unsigned int count; \n}; \n```\n\n\n\n\n\
  \n本章将详细介绍字符设备驱动程序的特殊性，解释它们如何创建、识别并将设备注册到系统中，并对设备文件方法进行更好的概述。这些方法是内核将设备能力暴露给用户空间的方法，可以通过文件相关的系统调用（`read`、`write`、`select`、`open`、`close`\
  \ 等）进行访问，并在 `struct file_operations` 结构中描述，你一定听说过它。\n\n# 主号和小设备号背后的概念\n\n字符设备填充在\
  \ `/dev` 目录下。请注意，它们不仅仅是存在该目录的文件。字符设备文件可以通过其类型进行识别，我们可以通过 `ls -l` 命令显示出来。主号和小号用于识别并将设备与驱动程序绑定。让我们通过列出\
  \ `*/dev*` 目录的内容（`ls -l /dev`）来看看它是如何工作的：\n\n```\n [...]\n\ndrwxr-xr-x 2 root root\
  \ 160 Mar 21 08:57 input\n\ncrw-r----- 1 root kmem 1, 2 Mar 21 08:57 kmem\n\nlrwxrwxrwx\
  \ 1 root root 28 Mar 21 08:57 log -> /run/systemd/journal/dev-log\n\ncrw-rw----\
  \ 1 root disk 10, 237 Mar 21 08:57 loop-control\n\nbrw-rw---- 1 root disk 7, 0 Mar\
  \ 21 08:57 loop0\n\nbrw-rw---- 1 root disk 7, 1 Mar 21 08:57 loop1\n\nbrw-rw----\
  \ 1 root disk 7, 2 Mar 21 08:57 loop2\n\nbrw-rw---- 1 root disk 7, 3 Mar 21 08:57\
  \ loop3 \n```\n\n根据上述摘录，第一列的第一个字符标识文件类型。可能的值有：\n\n* `c`: 用于字符设备文件\n* `b`: 用于块设备文件\n\
  * `l`: 用于符号链接\n* `d`: 用于目录\n* `s`: 用于套接字 (socket)\n* `p`: 用于命名管道 (named pipe)\n\n\
  对于 `b` 和 `c` 类型类型，日期之前的第五和六列遵循 `<X, Y>` 模式。`X` 代表主号，`Y` 是小号。例如，第三行是 `<1, 2>`，最后一行是\
  \ `<7, 3>`。这是从用户空间识别字符设备文件及其主小号的经典方法之一。\n\n内核在 `dev_t` 类型变量中持有标识设备的数字，这些变量简单来说 `u32`（32\
  \ 位无符号长）。主号仅用 12 位表示，而小号编码在剩余的 20 位中。\n\n正如在 `include/linux/kdev_t.h` 中所示，给定一个 `dev_t`\
  \ 类型变量，可能需要提取小号或主号。内核为这些目的提供了宏：\n\n```\nMAJOR(dev_t dev); \nMINOR(dev_t dev); \n\
  ```\n\n另一方面，你可能有一个小号和一个主号，并需要构建一个 `dev_t`。你应该使用的宏是 `MKDEV(int major, int minor);`：\n\
  \n```\n#define MINORBITS    20 \n#define MINORMASK    ((1U << MINORBITS) - 1) \n\
  #define MAJOR(dev)   ((unsigned int) ((dev) >> MINORBITS)) \n#define MINOR(dev)\
  \   ((unsigned int) ((dev) & MINORMASK)) \n#define MKDEV(ma,mi) (((ma) << MINORBITS)\
  \ | (mi)) \n```\n\n设备通过一个标识设备的主号和一个小号进行注册，小号可以被用作本地设备列表的数组索引，因为同一个驱动程序的一个实例可能会处理多个设备，而不同的驱动程序可能会处理相同类型的不同设备。\n\
  \n# 设备号的分配与释放\n\n设备号在整个系统中标识设备文件。这意味着有两种分配这些设备号（实际上是主和小号）的方法：\n\n* **静态地**：使用 `register_chrdev_region()`\
  \ 函数猜测一个尚未被其他驱动程序使用的主号。应该尽可能避免使用这种方法。它的原型如下：\n\n```\n int register_chrdev_region(dev_t\
  \ first, unsigned int count, \\\n                             char *name); \n```\n\
  \n该方法在成功时返回 `0`，失败时返回负错误代码。`first` 由我们需要的主号以及目标范围内的第一个小号组成。应该使用 `MKDEV(ma,mi)`。`count`\
  \ 是所需的连续设备号数量，`name` 应该是关联设备或驱动程序的名称。\n\n* **动态地**：使用 `alloc_chrdev_region()` 函数让内核为我们工作。这是获取有效设备号推荐的方法。它的原型如下：\n\
  \n```\nint alloc_chrdev_region(dev_t *dev, unsigned int firstminor, \\\n       \
  \                 unsigned int count, char *name); \n```\n\n该方法在成功时返回 `0`，失败时返回负错误代码。`dev`\
  \ 是输出，`firstminor` 是第一个小号，`count` 是连续设备号的数量，`name` 是关联设备或驱动程序的名称。两者之间的区别在于，前者允许你指定主号，而后者让内核选择。\n\
  \n# 设备操作简介\n\n在文件上执行的操作取决于驱动程序。此类操作在内核中定义为 `file_operations` 的实例。例如，如果人们想能够在设备上执行\
  \ `write`，则必须实现相应的回调并将其添加到 `file_operations` 中。让我们填充文件操作结构：\n\n```\nstruct file_operations\
  \ {\n    struct module *owner; \n    loff_t (*llseek) (struct file *, loff_t, int);\
  \ \n    ssize_t (*read) (struct file *, char __user *, size_t, loff_t *); \n   \
  \ ssize_t (*write) (struct file *, const char __user *, size_t, loff_t *); \n  \
  \  unsigned int (*poll) (struct file *, struct poll_table_struct *); \n    int (*mmap)\
  \ (struct file *, struct vm_area_struct *); \n    int (*open) (struct inode *, struct\
  \ file *); \n    long (*unlocked_ioctl) (struct file *, unsigned int, unsigned long);\
  \ \n    int (*release) (struct inode *, struct file *); \n    int (*fsync) (struct\
  \ file *, loff_t, loff_t, int datasync); \n    int (*fasync) (int, struct file *,\
  \ int); \n    int (*lock) (struct file *, int, struct file_lock *); \n    int (*flock)\
  \ (struct file *, int, struct file_lock *); \n   [...] \n}; \n```\n\n上述摘录仅列出了结构中的重要方法，特别是与本书需求相关的方法。可以在内核源码的\
  \ `include/linux/fs.h` 中找到完整描述。这些回调中的每一个都与系统调用链接，并且没有一个是强制性的。当用户代码对给定文件调用文件相关的系统调用时，内核查找该文件的驱动程序（特别是创建该文件的驱动），定位其\
  \ `file_operations` 结构，并检查与系统调用匹配的方法是否有定义。如果是，则直接运行它。如果否，则返回一个取决于系统调用的错误代码。例如，未定义的\
  \ `*mmap()` 方法将向用户返回 `-ENODEV`，而未定义的 `*write()` 方法将返回 `-EINVAL`。\n\n\n\n\n内核将文件描述为\
  \ `struct inode`（而非 `struct file`）结构的实例，该结构定义在 `include/linux/fs.h` 中：\n\n```\n\
  struct inode { \n    [...] \n   struct pipe_inode_info *i_pipe;     /* 如果这是一个 \n\
  *linux 内核管道，则设置并使用 */ \n   struct block_device *i_bdev;  /* 如果这是一个 \n * 块设备，则设置并使用\
  \ */ \n   struct cdev       *i_cdev;    /* 如果这是一个 \n * 字符设备，则设置并使用 */ \n    [...]\
  \ \n} \n```\n\n`struct inode` 是文件系统数据结构，它持有关于磁盘上文件（无论其类型是字符、块、管道等）或目录（是的！！从内核的角度来看，目录是一个条目指向其他文件的文件）的仅与操作系统相关的信息。\n\
  \n`struct file` 结构（同样定义在 `include/linux/fs.h` 中）实际上是更高级的文件描述，它代表内核中一个打开的文件，并依赖于底层的\
  \ `struct inode` 数据结构：\n\n```\nstruct file { \n   [...] \n   struct path f_path;\
  \                /* 文件的路径 */ \n   struct inode *f_inode;             /* 与此文件关联的\
  \ inode */ \n   const struct file_operations *f_op;/*在此文件上可以 \n          * 执行的操作\
  \ \n          */ \n   loff_t f_pos;                       /* 光标在\n * 此文件中的位置 */\
  \ \n   /* tty 驱动程序和其他可能需要的 */ \n   void *private_data;     /* 驱动可以设置私有数据\n     \
  \                       * 以在文件操作之间共享\n                            *某些数据。它可以指向任何\n\
  \                            * 数据结构。\n */ \n[...] \n} \n```\n\n`struct inode` 和\
  \ `struct file` 的区别在于，inode 不跟踪文件内的当前位置或当前模式。它只包含帮助操作系统找到底层文件结构（管道、目录、普通磁盘文件、块/字符设备文件等）的内容。另一方面，`struct\
  \ file` 被用作通用结构（它实际上持有一个指向 `struct inode` 结构的指针），代表一个打开的文件，并提供一组与可以在底层文件结构上执行的方法相关的函数。这些方法包括：`open`、`write`、`seek`、`read`、`select`\
  \ 等。这一切都强化了 UNIX 系统“万物皆文件”的哲学。\n\n换句话说，`struct inode` 代表内核中的一个文件，而 `struct file`\
  \ 在文件实际被打开时描述它。可能有不同的文件描述符代表同一个打开了多次的文件，但它们将指向同一个 `inode`。\n\n# 分配和注册字符设备\n\n字符设备在内核中通过\
  \ `struct cdev` 实例表示。在编写字符设备驱动程序时，你的目标是最终创建并注册一个与 `struct file_operations` 关联的结构实例，暴露一组用户空间可以在设备上执行的操作（函数）。为了实现该目标，我们必须经过一些步骤，具体如下：\n\
  \n1. 使用 `alloc_chrdev_region()` 预留一个主设备号和一个从设备号范围。\n2. 使用 `class_create()` 为你的设备创建一个类，在\
  \ `/sys/class/` 中可见。\n3. 设置 `struct file_operation`（传递给 `cdev_init`），对于每个需要创建的设备，调用\
  \ `cdev_init()` 和 `cdev_add()` 来注册设备。\n4. 然后为每个设备调用 `device_create()` 并指定适当名称。这将导致你的设备在\
  \ `/dev` 目录中被创建：\n\n```\n#define EEP_NBANK 8 \n#define EEP_DEVICE_NAME \"eep-mem\"\
  \ \n#define EEP_CLASS \"eep-class\" \n\nstruct class *eep_class; \nstruct cdev eep_cdev[EEP_NBANK];\
  \ \ndev_t dev_num; \n\nstatic int __init my_init(void) \n{ \n    int i; \n    dev_t\
  \ curr_dev; \n\n    /* 向内核请求 EEP_NBANK 个设备 */ \n    alloc_chrdev_region(&dev_num,\
  \ 0, EEP_NBANK, EEP_DEVICE_NAME); \n\n    /* 创建我们设备的类，在 /sys/class 中可见 */ \n   \
  \ eep_class = class_create(THIS_MODULE, EEP_CLASS); \n\n    /* 每个 eeprom 库表示为一个字符设备\
  \ (cdev)   */ \n    for (i = 0; i < EEP_NBANK; i++) { \n\n        /* 将 file_operations\
  \ 绑定到 cdev */ \n        cdev_init(&my_cdev[i], &eep_fops); \n        eep_cdev[i].owner\
  \ = THIS_MODULE; \n\n        /* 用于向核心层添加 cdev 的设备号 */ \n        curr_dev = MKDEV(MAJOR(dev_num),\
  \ MINOR(dev_num) + i); \n\n        /* 现在让设备可用供用户访问 */ \n        cdev_add(&eep_cdev[i],\
  \ curr_dev, 1); \n\n        /* 为每个设备创建一个设备节点 /dev/eep-mem0, /dev/eep-mem1... */\n\
  \        device_create(eep_class, NULL, curr_dev, NULL, EEP_DEVICE_NAME \"%d\",\
  \ i); \n    } \n    return 0; \n}\n```\n\n# 实现文件操作\n\n在引入了上述的文件操作后，现在是时候实现它们以增强驱动程序了。\n\
  \n# 内核空间与用户空间之间的数据交换\n\n本节不描述任何驱动操作，而是引入了我们需要的工具。驱动程序的 `write()` 方法包含从用户空间读取数据到内核空间，然后处理这些数据。另一方面，驱动程序的\
  \ `read()` 方法包含将数据从内核空间拷贝到用户空间。\n\n# 单值拷贝\n\n当涉及到拷贝如 `char` 和 `int` 类的单个简单变量，而不是较大的数据类型（如结构体或数组）时，内核提供了专门的宏来快速执行所需的操作。这些宏是\
  \ `put_user(x, ptr)` 和 `get_used(x, ptr)`，它们的解释如下：\n\n\n\n\n\n*   `put_user(x, ptr);`\
  \ : 此宏将一个变量从内核空间拷贝到用户空间。`x` 代表要拷贝到用户空间的值，`ptr` 是用户空间中的目标地址。该宏成功时返回 `0`，失败时返回 `-EFAULT`。`x`\
  \ 必须能够赋值给 `ptr` 解引用的结果。换句话说，它们必须具有（或指向）相同的类型。\n\n*   `get_user(x, ptr);` : 此宏将一个变量从用户空间拷贝到内核空间，成功时返回\
  \ `0`，失败时返回 `-EFAULT`。请注意，发生错误时 `x` 被置为 `0`。`x` 代表存储结果的内核变量，`ptr` 是用户空间中的源地址。`ptr`\
  \ 解引用的结果必须在不进行强制类型转换的情况下赋值给 `x`。猜猜这这意味着什么。\n\n# open 方法\n\n`open` 是每当有人打开你的设备文件时都会调用的方法。如果未定义此方法，设备打开将始终成功。人们通常使用此方法执行设备和数据结构的初始化，如果发生问题，则返回负错误代码，或者返回\
  \ `0`。`open` 方法的原型定义如下：\n\n```\nint (*open)(struct inode *inode, struct file *filp);\
  \ \n```\n\n# 设备特定数据\n\n对于在字符设备上执行的每次 `open`，回调函数将获得一个 `struct inode` 作为参数，它是内核中文件的底层表示。该\
  \ `struct inode` 结构有一个名为 `i_cdev` 的字段，它指向我们在 `init` 函数中分配的 `cdev`。通过像接下来的示例那样将 `struct\
  \ cdev` 嵌入到我们的设备特定数据结构中（如 `struct pcf2127`），我们将能够能够使用 `container_of` 宏获取该特定数据的指针。以下是一个\
  \ `open` 方法示例。\n\n以下是我们的数据结构：\n\n```\nstruct pcf2127 { \n    struct cdev cdev; \n\
  \    unsigned char *sram_data; \n    struct i2c_client *client; \n    int sram_size;\
  \ \n    [...] \n}; \n```\n\n给定此数据结构，`open` 方法看起来如下：\n\n```\nstatic unsigned int\
  \ sram_major = 0; \nstatic struct class *sram_class = NULL; \n\nstatic int sram_open(struct\
  \ inode *inode, struct file *filp) \n{ \n   unsigned int maj = imajor(inode); \n\
  \   unsigned int min = iminor(inode); \n\n   struct pcf2127 *pcf = NULL; \n   pcf\
  \ = container_of(inode->i_cdev, struct pcf2127, cdev); \n   pcf->sram_size = SRAM_SIZE;\
  \ \n\n   if (maj != sram_major || min < 0 ){ \n         pr_err (\"device not found\\\
  n\"); \n         return -ENODEV; /* 无此类设备 */ \n   } \n\n   /* 如果第一次打开设备，则准备缓冲区 */\
  \ \n   if (pcf->sram_data == NULL) { \n         pcf->sram_data = kzalloc(pcf->sram_size,\
  \ GFP_KERNEL); \n         if (pcf->sram_data == NULL) { \n               pr_err(\"\
  Open: memory allocation failed\\n\"); \n               return -ENOMEM; \n      \
  \   } \n   } \n   filp->private_data = pcf; \n   return 0; \n} \n```\n\n# release\
  \ 方法\n\n`release` 方法在设备关闭时被调用，是 `open` 方法的反操作。你必须撤销在 `open` 任务中执行的所有操作。你需要做的大致如下：\n\
  \n1. 释放 `open()` 步骤期间分配的所有私有内存。\n2. 关闭设备（如果支持）并在最后一次关闭时丢弃缓冲区（如果设备支持多次打开，或者驱动程序可以同时处理多个设备）。\n\
  \n以下是 `release` 函数的片段：\n\n```\nstatic int sram_release(struct inode *inode, struct\
  \ file *filp) \n{ \n   struct pcf2127 *pcf = NULL; \n   pcf = container_of(inode->i_cdev,\
  \ struct pcf2127, cdev); \n\n   mutex_lock(&device_list_lock); \n   filp->private_data\
  \ = NULL; \n\n   /* 最后一次关闭？ */ \n   pcf2127->users--; \n   if (!pcf2127->users)\
  \ { \n         kfree(tx_buffer); \n         kfree(rx_buffer); \n         tx_buffer\
  \ = NULL; \n         rx_buffer = NULL; \n\n         [...] \n\n         if (any_struct)\n\
  \               kfree(any_struct); \n   } \n   mutex_unlock(&device_list_lock);\n\
  \n   return 0; \n} \n```\n\n# write 方法\n\n`write` 方法用于当用户调用设备写入函数时向设备发送数据。其原型如下：\n\
  \n```\nssize_t (*write)(struct file *filp, char __user *buf, size_t count, loff_t\
  \ *pos);\n```\n\n*   返回写入字节数\n*   `buf` 来自用户空间的数据\n*   `count` 是请求的大小\n*   `pos`\
  \ 指明起始位置\n\n# 写步骤\n\n以下描述了如何实现 `write` 方法：\n\n1. 检查是否越了分区边界。\n2. 针对剩余空间调整 `count`。\n\
  3. 找到起始的位置。\n4. 将数据从用户空间拷贝到内核空间。\n5. 执行设备的写入操作并在失败时返回错误。\n6. 增加文件的当前位置。\n\n以下是 `write`\
  \ 方法的示例：\n\n```\nssize_t  \neeprom_write(struct file *filp, char __user *buf, size_t\
  \ count, \n   loff_t *pos) \n{ \n   struct eeprom_dev *eep = filp->private_data;\
  \ \n   ssize_t retval = 0; \n\n    /* 步骤 (1) */ \n    if (*pos >= eep->part_size)\
  \  /* 不允许写入分区之外。 */ \n        return -EINVAL; \n\n    /* 步骤 (2) */ \n    if (*pos\
  \ + count > eep->part_size) \n        count = eep->part_size - *pos; \n\n   /* 步骤\
  \ (3) */ \n   int part_origin = PART_SIZE * eep->part_index; \n   int register_address\
  \ = part_origin + *pos; \n\n    /* 步骤 (4) */ \n    /* 将数据从用户空间拷贝到内核空间 */ \n    if\
  \ (copy_from_user(eep->data, buf, count) != 0) \n        return -EFAULT; \n\n  \
  \     /* 步骤 (5) */ \n    /* 执行设备的写入 */ \n    if (write_to_device(register_address,\
  \ eep->data, count) < 0){ \n        pr_err(\"ee24lc52: i2c_transfer failed\\n\"\
  );   \n        return -EFAULT; \n     } \n\n    /* 步骤 (6) */ \n    *pos += count;\
  \ \n    return count; \n} \n```\n\n# read 方法\n\n`read` 方法的原型定义如下：\n\n```\nssize_t\
  \ (*read)(struct file *filp, char __user *buf, size_t count, loff_t *pos);\n```\n\
  \n值为读取的大小。该方法的其他元素描述如下：\n\n*   `*buf` 是我们从用户空间接收的缓冲区\n*   `count` 是请求传输的大小\n*  \
  \ `*pos` 指明应该从哪个位置开始读取\n\n# 读取步骤\n\n1. 防止读取超过文件大小，并返回文件结束标志：\n\n\n\n\n\n```\nif\
  \ (*pos >= filesize) \n  return 0; /* 0 表示文件结束符 */ \n```\n\n2. 读取的字节数不能超过文件大小。请适当调整\
  \ `count`：\n\n```\nif (*pos + count > filesize) \n    count = filesize - (*pos);\
  \ \n```\n\n3. 找到将开始读取的位置：\n\n```\nvoid *from = pos_to_address (*pos); /* 将 pos 转换为有效地址\
  \ */ \n```\n\n4. 将数据拷贝到用户空间缓冲区，如果失败则返回错误：\n\n```\nsent = copy_to_user(buf, from,\
  \ count); \nif (sent) \n    return -EFAULT; \n```\n\n5. 根据读取的字节数推进文件的当前位置，并返回拷贝的字节数：\n\
  \n```\n*pos += count; \nReturn count; \n```\n\n以下是一个驱动 `read()` 文件操作的示例，旨在概述在该处可以执行的操作：\n\
  \n```\nssize_t  eep_read(struct file *filp, char __user *buf, size_t count, loff_t\
  \ *f_pos) \n{ \n    struct eeprom_dev *eep = filp->private_data; \n\n    if (*f_pos\
  \ >= EEP_SIZE) /* EOF */ \n        return 0; \n\n    if (*f_pos + count > EEP_SIZE)\
  \ \n        count = EEP_SIZE - *f_pos; \n\n    /* 找到下一个数据字节的位置 */ \n    int part_origin\
  \  =  PART_SIZE * eep->part_index; \n    int eep_reg_addr_start  =  part_origin\
  \ + *pos; \n\n    /* 从设备执行读取 */ \n    if (read_from_device(eep_reg_addr_start, buff,\
  \ count) < 0){ \n        pr_err(\"ee24lc512: i2c_transfer failed\\n\");   \n   \
  \     return -EFAULT; \n    }  \n\n    /* 从内核拷贝到用户空间 */ \n    if(copy_to_user(buf,\
  \ dev->data, count) != 0) \n        return -EIO; \n\n    *f_pos += count; \n   \
  \ return count; \n} \n```\n\n# llseek 方法\n\n当在文件中移动光标位置时，会调用 `llseek` 函数。该方法在用户空间的入口点是\
  \ `lseek()`。可以参考手册页（man-page）来打印用户空间中这两个方法的完整描述：`man llseek` 和 `man lseek`。其原型如下：\n\
  \n```\nloff_t(*llseek) (structfile *filp, loff_t offset, int whence); \n```\n\n\
  * 返回值是文件中新位置\n* `loff_t` 是相对于当前文件位置的偏移量，定义了改变的程度\n* `whence` 定义了寻址的位置。可能的值有：\n\n\
  \    * `SEEK_SET`：将光标置于相对于文件开头的位置\n    * `SEEK_CUR`：将光标置于相对于当前文件位置的位置\n    * `SEEK_END`：将光标调整到相对于文件末尾的位置\n\
  \n# llseek 的步骤\n\n1. 使用 `switch` 语句检查所有可能的 `whence` 情况（由于它们是有限的），并相应地调整 `newpos`：\n\
  \n```\nswitch( whence ){ \n    case SEEK_SET:/* 相对于文件开头 */ \n        newpos = offset;\
  \ /* offset 成为新位置 */ \n        break; \n    case SEEK_CUR: /* 相对于当前文件位置 */ \n  \
  \      newpos = file->f_pos + offset; /* 在当前位置上加上偏移量 */ \n        break; \n    case\
  \ SEEK_END: /* 相对于文件末尾 */ \n        newpos = filesize + offset; \n        break;\
  \ \n    default: \n        return -EINVAL; \n} \n```\n\n2. 检查 `newpos` 是否有效：\n\n\
  ```\nif ( newpos < 0 ) \n    return -EINVAL; \n```\n\n3. 用新位置更新 `f_pos`：\n\n```\n\
  filp->f_pos = newpos; \n```\n\n4. 返回新的文件指针位置：\n\n```\nreturn newpos; \n```\n\n以下是一个连续读取并对文件进行定位的用户程序示例。底层驱动将执行\
  \ `llseek()` 文件操作入口：\n\n```c\n#include <unistd.h> \n#include <fcntl.h> \n#include\
  \ <sys/types.h> \n#include <stdio.h> \n\n#define CHAR_DEVICE \"toto.txt\" \n\nint\
  \ main(int argc, char **argv) \n{ \n    int fd= 0; \n    char buf[20]; \n\n    if\
  \ ((fd = open(CHAR_DEVICE, O_RDONLY)) < -1) \n        return 1; \n\n    /* 读取 20\
  \ 字节 */ \n    if (read(fd, buf, 20) != 20) \n        return 1; \n    printf(\"%s\\\
  n\", buf); \n\n    /* 将光标移动到用户空间缓冲区 */\n    if (read(fd, buf, 20) != 20) \n    \
  \    return 1;\n    printf(\"%s\\n\", buf);\n\n    /* ... (省略重复的逻辑) ... */\n}\n\
  ```\n\n# poll 方法\n\n`poll` 方法用于在文件描述符准备好 I/O 时通知用户空间。这允许进程在不阻塞的情况下监控多个文件。`poll`\
  \ 函数检查 poll 列表中文件描述符的状态。可以参考手册页打印这两个方法的完整描述：`man poll` 和 `epoll`。其原型如下：\n\n``````\n\
  int poll(struct pollfd *fds, int nfds, int timeout);\n```\n\n* 返回准备好 I/O 的文件描述符数量\n\
  * `fds` 是要监控的 `pollfd` 结构体数组\n* `nfds` 是 `fds` 数组的个数\n* `timeout` 是等待事件的最大时间（毫秒），-1\
  \ 无限阻塞，0 立即返回\n\n`pollfd` 结构体定义为：\n\n```c\nstruct pollfd {\n    int fd;        \
  \ /* 文件描述符 */\n    uint16_t events; /* 监控事件 (EPOLLIN, EPOLLOUT, EPOLLERR, EPOLLUP)\
  \ */\n    uint16_t revents;/* 发生的事件 */\n};\n```\n\n可能的事件（EPOLLIN, EPOLLOUT, EPOLLERR,\
  \ EPOLLUP）如下：\n\n* `EPOLLIN`：数据可读\n* `EPOLLOUT`：输出缓冲区准备好写入\n* `EPOLLERR`：文件描述符发生错误\n\
  * `EPOLLUP`：文件描述符已关闭或挂起\n\n# poll 的步骤\n\n1. 使用 `for` 循环遍历 `pollfd` 数组并检查每个描述符的 `events`\
  \ 字段：\n\n```go\nfor (int i = 0; i < nfds; i++) {\n    if (fds[i].revents & EPOLLERR)\
  \ { // 处理错误 }\n    if (fds[i].revents & EPOLLIN) {\n        // 处理读取\n    }\n   \
  \ if (fds[i].revents & EPOLLOUT) {\n        // 处理写入\n    }\n}\n```\n\n2. 检查 `poll()`\
  \ 的返回值是否大于零，表示发生了事件。\n\n以下是一个使用 `poll()` 监控文件描述符的用户程序示例：\n\n```c\nstruct pollfd\
  \ pfd[1];\npfd[0].fd = fd;\npfd[0].events = EPOLLIN | EPOLLOUT;\n\nint ret = poll(pfd,\
  \ 1, 5000);\nif (ret > 0) {\n    if (pfd[0].revents & EPOLLIN) {\n        // 处理读取\n\
  \    }\n}\n```\n\n\n\n\n\n### 3. 当有新数据或设备可写时，通知等待队列：\n\n```\nwake_up_interruptible(&my_rq);\
  \ /* 准备好读取 */ \nwake_up_interruptible(&my_wq); /* 准备好写入 */ \n```\n\n人们可以在驱动程序的 `write()`\
  \ 方法内部通知“可读事件”，这意味着写入的数据可以被读回；也可以在 IRQ 句程序内部通知，这意味着外部设备发送了一些可以被读回的数据。另一方面，可以在驱动程序的\
  \ `read()` 方法内部通知“可写事件”，这意味着缓冲区为空并可以重新填充；也可以在 IRQ 句程序内部通知，这意味着设备已完成数据发送操作，并已准备好再次接收数据。\n\
  \n当使用休眠输入/输出操作（阻塞 I/O）时，`read` 或 `write` 方法可能会发生变化。`poll` 中使用的等待队列也必须在 `read` 中使用。当用户需要读取时，如果有数据，该数据将立即发送给进程，你必须更新等待队列条件（设置为\
  \ `false`）；如果没有数据，进程将进入等待队列并处于休眠。\n\n如果 `write` 方法旨在提供数据，那么在 `write` 回调中，你必须填充数据缓冲区并更新等待队列条件（设置为\
  \ `true`），并唤醒读取器（参见 `wait queue` 节）。如果是 IRQ，则这些操作必须在对应的句程序中执行。\n\n以下是在给定的字符设备上使用\
  \ `select()` 来感知数据可用性的代码片段：\n\n```\n#include <unistd.h> \n#include <fcntl.h> \n\
  #include <stdio.h> \n#include <stdlib.h> \n#include <sys/select.h> \n\n#define NUMBER_OF_BYTE\
  \ 100 \n#define CHAR_DEVICE \"/dev/packt_char\" \n\nchar data[NUMBER_OF_BYTE]; \n\
  \nint main(int argc, char **argv) \n{ \n    int fd, retval; \n    ssize_t read_count;\
  \ \n    fd_set readfds; \n\n    fd = open(CHAR_DEVICE, O_RDONLY); \n    if(fd <\
  \ 0) \n        /* 打印消息并退出*/ \n        [...] \n\n    while(1){  \n        FD_ZERO(&readfds);\
  \ \n        FD_SET(fd, &readfds); \n\n        /* \n         * 用户只需要被“读”事件通知，而不需要超时。\
  \ \n         * 此调用将使进程休眠，直到它收到注册的 \n         * 事件通知 \n         */ \n        ret\
  \ = select(fd + 1, &readfds, NULL, NULL, NULL); \n\n        /* 从这一行开始，进程已经收到了通知\
  \ */ \n        if (ret == -1) { \n            fprintf(stderr, \"select call on %s:\
  \ an error ocurred\", CHAR_DEVICE); \n            break; \n        } \n\n      \
  \  /* \n         * 文件描述符现在就绪了。 \n         * 这一步假设我们只对一个文件感兴趣。 \n         */ \n \
  \       if (FD_ISSET(fd, &readfds)) { \n            read_count = read(fd, data,\
  \ NUMBER_OF_BYTE); \n            if (read_count < 0 ) \n                /* 发生错误。处理此错误\
  \ */ \n                [...] \n\n            if (read_count != NUMBER_OF_BYTE) \n\
  \                /* 读取的字节数少于需要 */ \n                [...] /* 处理此情况 */ \n       \
  \     else \n            /* 现在我们可以处理已读取的数据 */ \n            [...] \n        }\n\n\
  \    }     \n    close(fd); \n    return EXIT_SUCCESS; \n} \n```\n\n![](img/()\n\
  \n### ioctl 方法\n\n一个典型的 Linux 系统包含大约 350 个系统调用（syscalls），但只有少数几个与文件操作相关。有时，设备可能需要实现系统调用未提供的特定命令，特别是与文件（以及设备文件）相关的命令。在这种情况下，解决方案是使用**输入/输出控制**（`ioctl`），这是一种扩展与设备关联的系统调用（实际上是命令）列表的方法。你可以用它向设备发送特殊命令（如\
  \ `reset`、`shutdown`、`configure` 等）。如果驱动程序没有定义此方法，内核将对任何 `ioctl()` 系统调用返回 `-ENOTTY`\
  \ 错误。\n\n为了确保有效性和安全，`ioctl` 命令需要由一个在系统中唯一的数字来标识。跨系统中 ioctl 数字的唯一性可以防止将错误的命令发送到错误的设备，或者将错误的参数传递给正确的命令（在\
  \ ioctl 数字重复的情况下）。Linux 提供了四个辅助宏来创建 `ioctl` 标识符，取决于是否存在数据传输以及传输的方向。它们各自原型如下：\n\n\
  ```\n_IO(MAGIC, SEQ_NO) \n_IOW(MAGIC, SEQ_NO, TYPE) \n_IOR(MAGIC, SEQ_NO, TYPE)\
  \ \n_IORW(MAGIC, SEQ_NO, TYPE) \n```\n\n它们的描述如下：\n\n* `_IO`: `ioctl` 不需要数据传输\n*\
  \ `_IOW`: `ioctl` 需要写入参数（`copy_write`）\n* `_IOR`: `ioctl` 需要读取参数\n* `_IORW`: `ioctl`\
  \ 需要读取和写入\n\n它们的含义是：\n\n1. 一个 8 位数字（0-255），魔数（magic number）。\n2. 序列号或命令 ID，8 位。\n\
  3. 数据类型，如果有，用于告知内核大小。\n\n#### 生成 ioctl 数字\n\n应该在一个专门的文件中生成 ioctl 数字。这不是强制的，但建议这样做。现在是真实示例：\n\
  \n`eep_ioctl.h`:\n\n```\n#ifndef PACKT_CTL_H \n#define PACKT_CTL_H \n\n/* \n * 分区名称最大为\
  \ 32 \n */ \n#define MAX_PART_NAME 32 \n\n/* \n * 定义 ioctl: \n */\n#define EEP_MAGIC\
  \ 'E' \n#define ERASE_SEQ_NO 0x01 \n#define RENAME_SEQ_NO 0x02 \n#define GET_SIZE\
  \ 0x03 \n\n#define EEP_ERASE _IO(EEP_MAGIC, ERASE_SEQ_NO) \n#define EEP_RENAME_PART\
  \ _IOW(EEP_MAGIC, RENAME_SEQ_NO, unsigned long) \n#define EEP_GET_SIZE _IOR(EEP_MAGIC,\
  \ GET_SIZE, int *) \n\n#endif \n```\n\n#### ioctl 步骤\n\n这里有一个步骤：使用 `switch ... case`\
  \ 语句，并在调用未定义的 ioctl 命令时返回 `-ENOTTY` 错误。人们可以在此处找到更多信息：[`man7.org/man-pages/man2/ioctl.html`](http://man7.org/man-pages/man2/ioctl.html)\
  \ ：\n\n```c\n/* \n * 用户空间代码需要包含定义 ioctls \n * 的头文件。在我们的用例中，它是 eep_ioctl.h。 \n */\
  \ \n#include \"eep_ioctl.h\" \nstatic long eep_ioctl(struct file *f, unsigned int\
  \ cmd, unsigned long arg) \n{ \n    int part; \n    char *buf = NULL; \n    int\
  \ size = 1300; \n\n    switch(cmd){ \n        case EEP_ERASE: \n            erase_eepreom();\
  \ \n            break; \n        case EEP_RENAME_PART: \n            buf = kmalloc(MAX_PART_NAME,\
  \ GFP_KERNEL); \n            copy_from_user(buf, (char *)arg, MAX_PART_NAME); \n\
  \            rename_part(buf); \n            break; \n        case EEP_GET_SIZE:\
  \ \n            copy_to_user((int*)arg, &size, sizeof(int)); \n            break;\
  \ \n        default: \n            return -ENOTTY; \n    } \n    return 0; \n} \n\
  ```\n\n首先，让我们看看它的原型。如下：\n\n```\nlong ioctl(struct file *f, unsigned int cmd, unsigned\
  \ long arg);\n```\n\n如果你认为你的 `ioctl` 命令需要多个参数，你应该将这些参数聚集在一个结构体中，并将该结构体的指针传递给 `ioctl`。\n\
  \n现在，从用户空间，你必须使用与驱动代码相同的 `ioctl` 头文件：\n\n`my_main.c`\n\n\n\n\n\n```c\n#include <stdio.h>\
  \ \n#include <stdlib.h> \n#include <fcntl.h> \n#include <unistd.h> \n#include \"\
  eep_ioctl.h\"  /*我们的 ioctl 头文件 */ \n\nint main() \n{ \n    int size = 0; \n    int\
  \ fd; \n    char *new_name = \"lorem_ipsum\"; /* 长度不能超过 MAX_PART_NAME */ \n\n  \
  \  fd = open(\"/dev/eep-mem1\", O_RDWR); \n    if (fd == -1){ \n        printf(\"\
  Error while opening the eeprom\\n\"); \n        return -1; \n    } \n\n    ioctl(fd,\
  \ EEP_ERASE);  /* 用于擦除分区的 ioctl 调用 */ \n    ioctl(fd, EEP_GET_SIZE, &size); /* 用于获取分区的\
  \ ioctl 调用 */ \n    ioctl(fd, EEP_RENAME_PART, new_name);  /* 用于重命名分区的 ioctl 调用\
  \ */ \n\n    close(fd); \n    return 0; \n} \n```\n\n# 填充 `file_operations` 结构体\n\
  \n在编写内核模块时，对于使用参数静态初始化结构体，使用指定初始化器（designated initializers）更好。它由需要为成员赋值的成员名称组成。格式为\
  \ `.member-name`，用于指定应该初始化哪个成员。这允许（其他其他）以未定义的顺序初始化成员，或者保持我们不想修改的字段不变。\n\n一旦我们定义了函数，只需按照如下方式填充结构体：\n\
  \n```c\nstatic const struct file_operations eep_fops = { \n   .owner =    THIS_MODULE,\
  \ \n   .read =     eep_read, \n   .write =    eep_write, \n   .open =     eep_open,\
  \ \n   .release =  eep_release, \n   .llseek =   eep_llseek, \n   .poll =     eep_poll,\
  \ \n   .unlocked_ioctl = eep_ioctl, \n}; \n```\n\n让我们记住，结构体是在 `init` 方法中作为参数传递给\
  \ `cdev_init` 的。\n\n# 总结\n\n在本章中，我们揭开了字符设备的神秘面纱，并看到了如何让用户通过设备文件与我们的驱动程序交互。我们学习了如何将文件操作暴露给用户空间，并在内核内部控制它们的行为。我们甚至进展到了你能够实现多设备支持的程度。下一章稍微偏向硬件，因为它涉及到向用户空间暴露硬件设备能力的平台驱动程序。字符驱动与平台驱动结合的威力是惊人的。我们下节见。\n\
  \n# 平台设备驱动程序\n\n我们都知道即插即用设备。它们在插入时会立即被内核处理。这些设备可能是 USB 或 PCI Express，或者任何其他自动发现的设备。因此，还存在其他类型的设备，它们不是热插拔的，内核在管理它们之前需要先知道它们。有\
  \ I2C、UART、SPI 以及其他未连接到具有枚举能力的总线的设备。\n\n有一些真实的物理总线，你可能已经熟悉了：USB、I2S、I2C、UART、SPI、PCI、SATA\
  \ 等。此类总线被称为控制器的硬件设备。由于它们是 SoC 的一部分，它们无法被移除，不可发现，也被称为平台设备。\n\n人们经常说平台设备是片上设备（嵌入在\
  \ SoC 中）。在实践中，这部分是真的，因为它们被硬线到芯片中且无法移除。但连接到 I2C 或 SPI 的设备不是片上的，它们也是平台设备，因为它们不可发现。同样，可能存在片上的\
  \ PCI 或 USB 设备，但它们不是平台设备，因为它们是可以发现的。\n\n从 SoC 的角度来看，这些设备（总线）通过专用总线内部连接，并且在大多数情况下是专有的且特定于制造商的。从内核的角度来看，这些是根设备（root\
  \ devices），没有连接到任何地方。这就是*伪平台总线*（pseudo platform bus）出现的地方。伪平台总线也称为 platform bus\
  \ 是一种内核虚拟总线，用于那些未位于内核已知物理总上的设备。在本章中，平台设备指的是依赖伪平台总线的设备。\n\n处理平台设备本质上需要两个步骤：\n\n*\
  \   注册一个具有唯一名称的平台驱动程序，该程序将管理你的设备\n*   注册与驱动程序名称相同的平台设备以及它们的资源，以便内核知道你的设备就在那里\n\n\
  尽管如此，在本章中，我们将讨论以下内容：\n\n*   平台设备及其驱动程序\n*   内核中的设备和驱动匹配机制\n*   注册平台驱动程序与设备以及平台数据\n\
  \n# 平台驱动程序\n\n在继续之前，请注意以下警告。并不是所有的平台设备都由平台驱动程序（或者我应该说伪平台驱动程序）处理。平台驱动程序专门用于基于传统总线的设备。I2C\
  \ 设备或 SPI 设备是平台设备，但它们分别依赖于 I2C 或 SPI 总线，而不是平台总线。一切都需要通过平台驱动程序手动完成。平台驱动程序必须实现一个 `probe`\
  \ 函数，内核在模块插入或设备申领它时调用该函数。在开发平台驱动程序时，必须填充的主结构是 `struct platform_driver`，并使用如下所示专用函数向平台总线核心注册你的驱动程序：\n\
  \n```c\nstatic struct platform_driver mypdrv = { \n    .probe    = probe, \n   \
  \ .remove   = remove, \n    .driver   = { \n    .name     = \"my_platform_driver\"\
  ,\n    .owner    = THIS_MODULE, \n    }, \n}; \n```\n\n让我们看看组成结构体的每个元素的含义以及它们的用途：\n\
  \n*   `probe()`：这是在设备匹配申领你的驱动程序时调用的函数。稍后我们将看到内核如何调用 `probe`。它的声明如下：\n    ```c\n\
  \    static int probe(struct platform_device *pdev)\n    ```\n*   `remove()`：当驱动程序不再需要时被调用，其声明如下：\n\
  \    ```c\n    static int remove(struct platform_device *pdev)\n    ```\n*   `struct\
  \ device_driver`：这描述驱动程序本身，提供了名称、所有者某些字段，我们稍后会看到。\n\n向内核注册平台驱动程序只需在 `init` 函数中（模块加载时）调用\
  \ `platform_driver_register()` 或 `platform_driver_probe()`。这两个函数的区别在于：\n\n*   `platform_driver_register()`\
  \ 将驱动程序放入内核维护的驱动列表中，以便在发生新匹配时按需调用其 `probe()` 函数。要防止你的驱动程序被插入并注册到列表中，只需使用 `next`\
  \ 函数。\n*   通过 `platform_driver_probe()`，内核立即运行匹配循环，检查是否存在名称相同的平台设备，如果发生了匹配，则调用驱动程序的\
  \ `probe()` 函数，这意味着设备存在。如果没有，则该驱动程序被忽略。这种方法防止了延迟探测，因为没有在系统中注册驱动程序。在这里，`probe` 函数被放置在\
  \ `__init` 区域，该区域在内核启动完成后会被释放，从而防止了延迟探测并减少驱动程序的内存占用。当你 100% 确定设备于系统中时，请使用此方法：\n\n\
  ```c\nret = platform_driver_probe(&mypdrv, probe); \n```\n\n以下是一个向自身注册到内核的简单平台驱动程序：\n\
  \n\n\n\n\n```c\n#include <linux/module.h> \n#include <linux/kernel.h> \n#include\
  \ <linux/init.h> \n#include <linux/platform_device.h> \n\nstatic int my_pdrv_probe\
  \ (struct platform_device *pdev){ \n    pr_info(\"Hello! device probed!\\n\"); \n\
  \    return 0; \n} \n\nstatic void my_pdrv_remove(struct platform_device *pdev){\
  \ \n    pr_info(\"good bye reader!\\n\"); \n} \n\nstatic struct platform_driver\
  \ mypdrv = { \n    .probe          = my_pdrv_probe, \n    .remove         = my_pdrv_remove,\
  \ \n    .driver = { \n            .name  = KBUILD_MODNAME, \n            .owner\
  \ = THIS_MODULE, \n    }, \n}; \n\nstatic int __init my_drv_init(void) \n{ \n  \
  \  pr_info(\"Hello Guy\\n\"); \n\n    /* Registering with Kernel */ \n    platform_driver_register(&mypdrv);\
  \ \n    return 0; \n} \n\nstatic void __exit my_pdrv_remove (void) \n{ \n    Pr_info(\"\
  Good bye Guy\\n\"); \n\n    /* Unregistering from Kernel */ \n    platform_driver_unregister(&my_driver);\
  \ \n} \n\nmodule_init(my_drv_init); \nmodule_exit(my_pdrv_remove); \n\nMODULE_LICENSE(\n\
  \n\"GPL\n\n\");\n\nMODULE_AUTHOR(\n\n\"John Madieu\n\n\");\n\nMODULE_DESCRIPTION(\n\
  \n\"My platform Hello World module\n\n\"); \n```\n\n我们的模块在 `init` / `exit` 函数中除了与平台总线核心进行注册/注销外没有做其他事情。大多数驱动都是如此。在这种情况下，我们可以放弃\
  \ `module_init` 和 `module_exit`，并使用 `module_platform_driver` 宏。\n\n`module_platform_driver`\
  \ 宏的结构如下：\n\n```c\n/* \n * module_platform_driver() - Helper macro for drivers that\
  \ don't \n * do anything special in module init/exit. This eliminates a lot \n *\
  \ of boilerplate.  Each module may only use this macro once, and \n * calling it\
  \ replaces module_init() and module_exit() \n */ \n#define module_platform_driver(__platform_driver)\
  \ \\ \nmodule_driver(__platform_driver, platform_driver_register, \\ \nplatform_driver_unregister)\
  \ \n```\n\n该宏将负责将我们的模块注册到平台驱动核心。不再需要 `module_init` 和 `module_exit` 宏，也不再需要 `init`\
  \ 和 `exit` 函数了。这并不意味着这些函数不再被调用，只是意味着我们可以忘记自己编写它们了。\n\n`probe` 函数并不是 `init` 函数的替代品。每当给设备与驱动匹配时，`probe`\
  \ 函数就会被调用，而 `init` 函数只在模块加载时运行一次。\n\n```c\n [...] \nstatic int my_driver_probe (struct\
  \ platform_device *pdev){ \n    [...] \n} \n\nstatic void my_driver_remove(struct\
  \ platform_device *pdev){ \n    [...] \n} \n\nstatic struct platform_drivermy_driver\
  \ = { \n    [...] \n}; \nmodule_platform_driver(my_driver); \n```\n\n每种总线都有特定的宏用于向其注册驱动。以下列表并非详尽的：\n\
  \n*   `module_platform_driver(struct platform_driver)` 用于平台驱动，专门用于不位于传统物理总线上的设备（我们在上面已经使用了它）\n\
  *   `module_spi_driver(struct spi_driver)` 用于 SPI 驱动\n*   `module_i2c_driver(struct\
  \ i2c_driver)` 用于 I2C 驱动\n*   `module_pci_driver(struct pci_driver)` 用于 PCI 驱动\n\
  *   `module_usb_driver(struct usb_driver)` 用于 USB 驱动\n*   `module_mdio_driver(struct\
  \ mdio_driver)` 用于 mdio\n*   `[...]`\n\n如果你不知道你的驱动需要挂载在什么种总线上，那么它就是一个平台驱动，你应该使用\
  \ `platform_driver_register` 或 `platform_driver_probe` 来注册驱动。\n\n# 平台设备 (Platform\
  \ devices)\n\n实际上，我们应该称为伪平台设备，因为这一部分涉及位于伪平台总线上的设备。当你完成驱动后，你必须向内核提供需要该驱动的设备。平台设备在内核中通过\
  \ `struct platform_device` 实例表示，如下所示：\n\n```c\nstruct platform_device { \n   const\
  \ char *name; \n   u32 id; \n   struct device dev; \n   u32 num_resources; \n  \
  \ struct resource *resource; \n}; \n```\n\n涉及到平台驱动时，在驱动和设备匹配之前，`struct platform_device`\
  \ 和 `static struct platform_driver.driver.name` 的 `name` 字段必须相同。`num_resources`\
  \ 和 `struct resource *resource` 字段将在下一节介绍。只需记住，由于 `resource` 是一个数组，`num_resources`\
  \ 必须包含该数组的大小。\n\n# 资源与平台数据 (Resources and platform data)\n\n与热插拔设备相反，内核并不知道你的系统中存在哪些设备、它们需要什么、它们具备什么能力。平台设备在内核中通过\
  \ `struct platform_device` 实例表示，如下所示：\n\n```c\nstruct platform_device { \n   const\
  \ char *name; \n   u32 id; \n   struct device dev; \n   u32 num_resources; \n  \
  \ struct resource *resource; \n}; \n```\n\n涉及到平台驱动时，在驱动和设备匹配之前，`struct platform_device`\
  \ 和 `static struct platform_driver.driver.name` 的 `name` 字段必须相同。`num_resources`\
  \ 和 `struct resource *resource` 字段将在下一节介绍。只需记住，由于 `resource` 是一个数组，`num_resources`\
  \ 必须包含该数组的大小。\n\n## 资源 (Resources)\n\n与热插拔设备相反，内核并不知道你的系统中存在哪些设备、它们需要什么、它们具备什么能力。平台设备在内核中通过\
  \ `struct platform_device` 实例表示，如下所示：\n\n```c\nstruct platform_device { \n   const\
  \ char *name; \n   u32 id; \n   struct device dev; \n   u32 num_resources; \n  \
  \ struct resource *resource; \n}; \n```\n\n### 设备供给 - 旧方法 (Device provisioning -\
  \ the old way)\n\n一旦提供了资源，你就需要在驱动中提取它们以便进行操作。`probe` 函数是提取它们的好地方。在进一步操作之前，让我们记住\
  \ `probe` 函数的声明：\n\n```c\nint probe(struct platform_device *pdev);\n```\n\n`pdev`\
  \ 由内核自动填充，包含我们之前注册的数据和资源。让我们看看如何选取它们。\n\n嵌入 `struct platform_device` 中的 `struct\
  \ resource` 可以通过 `platform_get_resource` 函数获取。以下是 `platform_get_resource` 的原型：\n\
  \n```c\nstruct resource *platform_get_resource(struct platform_device *dev, unsigned\
  \ int type, unsigned int num);\n```\n\n第一个参数是设备本身的实例。第二个参数告诉我们需要什么样的资源。对于内存，应该是\
  \ `IORESOURCE_MEM`。再次，请查看 `include/linux/ioport.h` 以获取更多细节。`num` 参数是指定所需资源的索引。零表示第一个，依此类推。\n\
  \n如果资源是 IRQ，我们必须使用 `int platform_get_irq(struct platform_device *pdev, unsigned\
  \ intnum)`，其中 `pdev` 是平台设备，`num` 是资源内的 IRQ 索引（以防存在多个）。我们用于提取我们为设备注册的平台数据的整个 `probe`\
  \ 函数可以如下所示：\n\n\n\n\n```c\nstatic int my_driver_probe(struct platform_device *pdev)\
  \ \n{ \nstruct my_gpios *my_gpio_pdata = \n                   (struct my_gpios*)dev_get_platdata(&pdev->dev);\
  \ \n\n    int rgpio = my_gpio_pdata->reset_gpio; \n    int lgpio = my_gpio_pdata->led_gpio;\
  \ \n\n    struct resource *res1, *res2; \n    void *reg1, *reg2; \n    int irqnum;\
  \ \n\n    res1 = platform_get_resource(pdev, IORESSOURCE_MEM, 0); \n    if((!res1)){\
  \ \n        pr_err(\" First Resource not available\"); \n        return -1; \n \
  \   } \n    res2 = platform_get_resource(pdev, IORESSOURCE_MEM, 1); \n    if((!res2)){\
  \ \n        pr_err(\" Second Resource not available\"); \n        return -1; \n\
  \    } \n\n    /* extract the irq */ \n    irqnum = platform_get_irq(pdev, 0); \n\
  \    Pr_info(\"\\n IRQ number of Device: %d\\n\", irqnum); \n\n    /* \n     * At\
  \ this step, we can use gpio_request, on gpio, \n     * request_irq on irqnum and\
  \ ioremap() on reg1 and reg2\\. \n     * ioremap() is discussed in chapter 11, Kernel\
  \ Memory Management  \n     */ \n    [...] \n    return 0; \n} \n```\n\n### Platform\
  \ data\n\n任何类型不属于前一节列出的资源类型的其他数据都属于这里（例如 GPIO）。无论它们的类型是什么，`struct platform_device`\
  \ 都包含一个 `struct device` 字段，而该字段又包含一个 `struct platform_data` 字段。通常，应该将这些数据嵌入结构体中并将其传递给\
  \ `platform_device.device.platform_data` 字段。例如，你声明了一个需要两个 GPIO 编号作为平台数据、一个 IRQ 号以及两个内存区域作为资源的平台设备。以下示例了如何与设备一起注册平台数据。在这里，我们使用\
  \ `platform_device_register(struct platform_device *pdev)` 函数，该函数用于向平台核心注册平台设备：\n\
  \n```c\n/* \n * 中断或内存以外的其他数据必须嵌入结构体中 \n * 并传递给 \"platform_device.device.platform_data\"\
  \ \n */ \nstruct my_gpios { \n    int reset_gpio; \n    int led_gpio; \n}; \n\n\
  /*our platform data*/ \nstatic struct my_gpiosneeded_gpios = { \n    .reset_gpio\
  \ = 47, \n    .led_gpio   = 41, \n}; \n\n/* Our resource array */ \nstatic struct\
  \ resource needed_resources[] = { \n   [0] = { /* The first memory region */ \n\
  \         .start = JZ4740_UDC_BASE_ADDR, \n         .end   = JZ4740_UDC_BASE_ADDR\
  \ + 0x10000 - 1, \n         .flags = IORESOURCE_MEM, \n         .name  = \"mem1\"\
  , \n   }, \n   [1] = { \n         .start = JZ4740_UDC_BASE_ADDR2, \n         .end\
  \   = JZ4740_UDC_BASE_ADDR2 + 0x10000 -1, \n         .flags = IORESOURCE_MEM, \n\
  \         .name  = \"mem2\", \n   }, \n   [2] = { \n         .start = JZ4740_IRQ_UDC,\
  \ \n         .end   = JZ4740_IRQ_UDC, \n         .flags = IORESOURCE_IRQ, \n   \
  \      .name  = \"mc\", \n   }, \n}; \n\nstatic struct platform_devicemy_device\
  \ = { \n    .name = \"my-platform-device\", \n    .id   = 0, \n    .dev  = { \n\
  \        .platform_data      = &needed_gpios, \n    }, \n    .resource         \
  \     = needed_resources, \n    .num_resources = ARRY_SIZE(needed_resources), \n\
  }; \nplatform_device_register(&my_device);\n```\n\n在前面的示例中，我们使用了 `IORESOURCE_IRQ`\
  \ 和 `IORESOURCE_MEM` 来告知内核我们提供了什么种的资源。要查看所有其他标志类型，请查看内核树中的 `include/linux/ioport.h`。\n\
  \n为了获取我们之前注册的平台数据，我们可以直接使用 `pdev->dev.platform_data`（记得 `struct platform_device`\
  \ 结构），但建议使用内核提供的函数（诚然，它们的作用是一样的）：\n\n```c\nvoid *dev_get_platdata(const struct device\
  \ *dev) \nstruct my_gpios *picked_gpios = dev_get_platdata(&pdev->dev);\n```\n\n\
  # 在哪里声明平台设备？\n\n设备与其资源和数据一起注册。在这种老旧且过弃的方法中，它们被声明为 a。在这种老旧且过弃的方法中，它们被声明为 a。\n\n\n\
  \n\n到目前，我们只讨论了如何填充设备和驱动程序的不同结构。但现在，我们将看到它们是如何注册到内核中的的，以及 Linux 是如何知道哪些设备由哪个驱动程序处理的。答案是\
  \ `MODULE_DEVICE_TABLE`。这个宏允许驱动程序暴露其 ID 表（ID table），该表描述了它可以支持哪些设备。同时，如果驱动程序可以编译为模块，则\
  \ `driver.name` 字段应该与模块名称匹配。如果不匹配，模块将不会自动加载，除非我们使用了 `MODULE_ALIAS` 宏为模块添加了另一个名称。在编译时，这些信息会从所有驱动程序中提取，以构建设备表。当内核需要为某个设备查找驱动程序时（当需要执行匹配时），内核会遍历设备表。如果找到的条目与所添加设备的\
  \ `compatible`（用于设备树）、`device/vendor id` 或 `name`（用于设备 ID 表或名称）相匹配，则会加载提供该匹配项的模块（运行模块的\
  \ `init` 函数），并调用 `probe` 函数。`MODULE_DEVICE_TABLE` 宏定义在 `linux/module.h` 中：\n\n```c\n\
  #define MODULE_DEVICE_TABLE(type, name) \n```\n\n以下是给此宏的每个参数的描述：\n\n*   `type`:\
  \ 可以是 `i2c`、`spi`、`acpi`、`of`、`platform`、`usb`、`pci` 或你在 `include/linux/mod_devicetable.h`\
  \ 中找到任何其他总线。它取决于设备所在的总线，或者我们想要使用的匹配机制。\n*   `name`: `XXX_device_id` 数组指针，用于设备匹配。如果我们讨论的是\
  \ I2C 设备，结构将是 `i2c_device_id`。对于 SPI 设备，它应该是 `spi_device_id`，依此类推。对于设备树 **Open 固件**\
  \ (**OF**) 匹配机制，我们必须使用 `of_device_id`。\n\n对于新的不可发现平台设备驱动程序，建议不再使用平台数据（platform data），而是使用设备树能力，并配合\
  \ `OF` 匹配机制。请注意，这方法并不是互斥的，因此可以将它们混合使用。\n\n让我们深入了解匹配机制的细节，除了我们将在 第 6 章 *设备树的概念* 中讨论的\
  \ OF 风格匹配。\n\n# 内核设备与驱动程序匹配函数\n\n内核中负责平台设备和驱动匹配的函数在 `/drivers/base/platform.c` 中定义如下：\n\
  \n```c\nstatic int platform_match(struct device *dev, struct device_driver *drv)\
  \ \n{ \n   struct platform_device *pdev = to_platform_device(dev); \n   struct platform_driver\
  \ *pdrv = to_platform_driver(drv); \n\n   /* 当设置 driver_override 时，仅绑定到匹配的驱动程序 */\
  \ \n   if (pdev->driver_override) \n         return !strcmp(pdev->driver_override,\
  \ drv->name); \n\n   /* 首先尝试 OF 风格匹配 */ \n   if (of_driver_match_device(dev, drv))\
  \ \n         return 1; \n\n   /* 然后尝试 ACPI 风格匹配 */ \n   if (acpi_driver_match_device(dev,\
  \ drv)) \n         return 1; \n\n   /* 然后尝试与 id 表匹配 */ \n   if (pdrv->id_table)\
  \ \n         return platform_match_id(pdrv->id_table, pdev) != NULL; \n\n   /* 回退到驱动程序名称匹配\
  \ */ \n   return (strcmp(pdev->name, drv->name) == 0); \n} \n```\n\n我们可以列举四种匹配机制。它们都基于字符串比较。如果我们看\
  \ `platform_match_id`，我们就能理解底层是如何运作的：\n\n```c\nstatic const struct platform_device_id\
  \ *platform_match_id( \n                        const struct platform_device_id\
  \ *id, \n                        struct platform_device *pdev) \n{ \n        while\
  \ (id->name[0]) { \n                if (strcmp(pdev->name, id->name) == 0) { \n\
  \                        pdev->id_entry = id; \n                        return id;\
  \ \n                } \n                id++; \n        } \n        return NULL;\
  \ \n} \n```\n\n现在让我们来看在 第 4 章 *字符设备驱动程序:* 中讨论过的 `struct device_driver` 结构：\n\n```c\n\
  struct device_driver { \n        const char *name; \n        [...] \n        const\
  \ struct of_device_id       *of_match_table; \n        const struct acpi_device_id\
  \     *acpi_match_table; \n}; \n```\n\n我特意删除了我们感兴趣的字段。`struct device_driver` 构每个设备驱动程序的基础。无论是\
  \ I2C、SPI、TTY 还是其他设备驱动程序，它们都嵌入了一个 `struct device_driver` 元素。\n\n# OF 风格和 ACPI 匹配\n\
  \nOF 风格在 第 6 章 *设备树的概念* 中解释。第二种机制是 ACPI。我们不会在书中讨论它，但作为参考，它使用了 `acpi_device_id`。\n\
  \n# ID 匹配\n\n这种风格已经存在很了，并且基于 `id table`。如果我们查看 `include/linux/mod_devicetable.h`，就能看到平台数据是如何转换回原始数据的：\n\
  \n```c\nstruct platform_device {\n   char name[PLATFORM_NAME];\n   unsigned long\
  \ data;\n};\n```\n\n# 平台匹配\n\n`.name` 字段必须与你在特定文件中注册设备时提供的设备名称相同。负责这种风格的函数是 `platform_match_id`。如果你在\
  \ `drivers/base/platform.c` 中看它的定义：\n\n```c\nstatic const struct platform_device_id\
  \ *platform_match_id( \n        const struct platform_device_id *id, \n        struct\
  \ platform_device *pdev) \n{ \n    while (id->name[0]) { \n        if (strcmp(pdev->name,\
  \ id->name) == 0) { \n            pdev->id_entry = id; \n            return id;\
  \ \n        } \n        id++; \n    } \n    return NULL; \n}\n```\n\n以下是一个带有 `platform_device_id`\
  \ 的示例：\n\n```c\nstatic const struct platform_device_id imx_uart_devtype[] = { \n\
  \        { \n              .name = \"imx1-uart\", \n              .driver_data =\
  \ (kernel_ulong_t)&imx_uart_devdata[IMX1_UART], \n        }, { \n              .name\
  \ = \"imx21-uart\", \n              .driver_data = (kernel_ulong_t)&imx_uart_devdata[IMX21_UART],\
  \ \n        }, { \n              .name = \"imx6q-uart\", \n              .driver_data\
  \ = (kernel_ulong_t)&imx_uart_devdata[IMX6Q_UART], \n        }, { \n           \
  \     /* sentinel */ \n        } \n}; \n```\n\n对于新的不可发现平台设备驱动程序，建议不再使用平台数据，而是使用设备树能力，并配合\
  \ `OF` 匹配机制。请注意，这方法并不是互斥的，因此可以将它们混合使用。\n\n\n\n\n`pdev->id_entry` 是一个 `struct platform_device_id`，它是指向内核提供的匹配\
  \ ID 表项的指针，其 `driver_data` 元素被强制转换回指向数据结构的指针。\n\n## ID 表匹配中的设备特定设备数据\n\n在上一节中，我们使用\
  \ `platform_device_id.platform_data` 作为指针。你的驱动程序可能需要支持一种一种设备类型。在这种情况下，你需要为你支持的每种设备类型提供特定的设备数据。此时，你应该将设备\
  \ ID 作为包含所有可能的设备数据的数组索引，而不再将其作为指针地址。以下是示例中的详细步骤：\n\n1. 我们定义了一个枚举，取决于我们在驱动程序中需要支持的设备类型：\n\
  \n```\nenum abx80x_chip { \n    AB0801, \n    AB0803, \n    AB0804, \n    AB0805,\
  \ \n    AB1801, \n    AB1803, \n    AB1804, \n    AB1805, \n    ABX80X \n}; \n```\n\
  \n2. 我们定义了特定的数据类型结构：\n\n```\nstruct abx80x_cap { \n    u16 pn; \nboolhas_tc; \n\
  }; \n```\n\n3. 我们用默认值填充数组，并根据 `device_id` 中的索引选择正确的数据：\n\n```\nstatic struct abx80x_cap\
  \ abx80x_caps[] = { \n    [AB0801] = {.pn = 0x0801}, \n    [AB0803] = {.pn = 0x0803},\
  \ \n    [AB0804] = {.pn = 0x0804, .has_tc = true}, \n    [AB0805] = {.pn = 0x0805,\
  \ .has_tc = true}, \n    [AB1801] = {.pn = 0x1801}, \n    [AB1803] = {.pn = 0x1803},\
  \ \n    [AB1804] = {.pn = 0x1804, .has_tc = true}, \n    [AB1805] = {.pn = 0x1805,\
  \ .has_tc = true}, \n    [ABX80X] = {.pn = 0} \n}; \n```\n\n4. 我们定义带有特定索引的 `platform_device_id`：\n\
  \n```\nstatic const struct i2c_device_id abx80x_id[] = { \n    { \"abx80x\", ABX80X\
  \ }, \n    { \"ab0801\", AB0801 }, \n    { \"ab0803\", AB0803 }, \n    { \"ab0804\"\
  , AB0804 }, \n    { \"ab0805\", AB0805 }, \n    { \"ab1801\", AB1801 }, \n    {\
  \ \"ab1803\", AB1803 }, \n    { \"ab1804\", AB1804 }, \n    { \"ab1805\", AB1805\
  \ }, \n    { \"rv1805\", AB1805 }, \n    { } \n}; \n```\n\n5. 这里我们只需要在 `probe` 函数中执行相关操作：\n\
  \n```\nstatic int rs5c372_probe(struct i2c_client *client, \nconst struct i2c_device_id\
  \ *id) \n{ \n    [...] \n\n    /* 我们选择对应于设备的索引 */ \nint index = id->driver_data;\
  \ \n\n    /* \n     * 然后，我们可以访问每个设备的特定数据 \n     * 因为它们存储在 abx80x_caps[index] 中 \n\
  \     */ \n} \n```\n\n## 名称匹配 - 平台设备名称匹配\n\n如今大多数平台驱动程序根本不提供表；它们简单地在驱动名称字段中填充驱动程序自身的名称。但匹配之所以有效，是因为如果你查看\
  \ `platform_match` 函数，你会发现匹配在最后会回退到名称匹配，比较驱动程序的名称和设备的名称。一些旧的驱动程序仍然在使用这种匹配机制。以下是来自\
  \ `sound/soc/fsl/imx-ssi.c` 的名称匹配：\n\n```\nstatic struct platform_driver imx_ssi_driver\
  \ = { \n   .probe = imx_ssi_probe, \n   .remove = imx_ssi_remove, \n\n    /* 如你在这里看到的，只填充了\
  \ 'name' 字段 */ \n   .driver = { \n         .name = \"imx-ssi\", \n   }, \n}; \n\n\
  module_platform_driver(imx_ssi_driver); \n```\n\n要添加与此驱动程序匹配的设备，必须在板级文件中调用 `platform_device_register`\
  \ 或 `platform_add_devices` 并使用相同的名称 `imx-ssi`（通常在 `arch/<your_arch>/mach-*/board-*.c`）。对于我们基于四核\
  \ iMX6 的 UDOO，它是 `arch/arm/mach-imx/mach-imx6q.c`。\n\n# 总结\n\n内核伪平台总线对来说不再有秘密。通过总线匹配机制，你能够理解驱动程序是如何、何时以及为何被加载的，以及它是为了哪个设备。我们可以根据我们想要的匹配机制实现任何\
  \ `probe` 函数。由于驱动程序的主要目的是处理设备，我们现在能够在系统中填充设备（旧的且过时的方法）。为了完美收尾，下一章将专门讨论设备树，设备树是用于在系统上填充设备及其配置的新机制。\n\
  \n## 设备树概念\n\n设备树（Device Tree，简称 DT`）是一种易读的硬件描述文件，采用类似于 JSON 的格式样式，是一个简单的树形结构，其中设备由带有属性的节点表示。属性可以是空的（仅键，用于描述布尔值），也可以是键值对，其值可以包含任意字节流。本章是对\
  \ DT 的简单介绍。每个内核子系统或框架都有自己的 DT 绑定。我们将在处理相关主题时讨论这些特定的绑定。DT 起于 OF，OF 是一项由计算机公司背书的标准，其主要目的是为计算机固件系统定义接口。尽管如此，可以在\
  \ [`www.devicetree.org/`](http://www.devicetree.org/) 找到更多关于 DT 规范的信息。因此，本章将涵盖 DT\
  \ 的基础，例如：\n\n* 命名规范，以及别名（aliases）和标签（labeling）\n* 描述数据类型及其 API\n* 管理地址方案和访问设备资源\n\
  * 实现 OF 匹配样式并提供特定应用程序的数据\n\n## 设备树机制\n\n内核中通过将选项 `CONFIG_OF` 设置为 `Y` 来启用 DT。为了在驱动程序内部调用\
  \ DT API，你必须添加头头：\n\n```\n#include <linux/of.h> \n#include <linux/of_device.h> \n\
  ```\n\nDT 支持几种数据类型。让我们通过一个示例节点描述来看它们：\n\n```\n/* 这是一个注释 */ \n// 这是另一个注释 \nnode_label:\
  \ nodename@reg{ \n   string-property = \"a string\"; \n   string-list = \"red fish\"\
  , \"blue fish\"; \n   int-property = <197>;每个单元都是一个 32 位无符号整数(uint32)。\n\n    byte-array\
  \ = [0x01 0x23 0x45] \n    boolean-property; \n}; \n```\n\n以下是设备树中使用的一些数据类型的的定义：\n\
  \n* 文本字符串用双引号表示。可以使用逗号创建一个列表。\n* 单元（Cells）用角括号分隔。\n* 布尔数据仅仅是一个空属性。真或假值取决于属性是否存在。\n\
  \n### 命名规范\n\n每个节点都必须有一个格式为 `<name>[@address>]` 的名称，其中 `<name>` 是长度最多为 31 个字符的字符串，`[@<address>]`\
  \ 是可选的，取决于该节点是否代表可寻址设备。`<address>` 应该是访问设备的主要地址。设备命名的示例例如：\n\n```\nexpander@20 {\
  \ \n    compatible = \"microchip,mcp2317\"; \n    reg = <20>; \n    [...]      \
  \  \n}; \n```\n\n或者\n\n```\ni2c@021a0000 {\n    compatible = \"fsl,imx6q-i2c\",\
  \ \"fsl,imx21-i2c\"; \n    reg = <0x021a0000 0x4000>; \n    [...] \n}; \n```\n\n\
  另一方面`label` 是可选的。标记节点仅在打算从另一个节点的属性中引用它时才有用。可以将标签视为指向节点的指针，正如下一节所解释的那样。\n\n### 别名、标签和引用（phhandle）\n\
  \n理解这三个元素是如何工作的非常重要。它们在 DT 中被频繁使用。让我们通过以下 DT 来解释它们如何工作：\n\n```\naliases { \n   \
  \ ethernet0 = &fec; \n    gpio0 = &gpio1; \n    gpio1 = &gpio2; \n    mmc0 = &usdhc1;\
  \ \n    [...] \n}; \ngpio1: gpio@0209c000 { \n    compatible = \"fsl,imx6q-gpio\"\
  , \"fsl,imx35-gpio\"; \n    [...] \n}; \nnode_label: nodename@reg { \n    [...];\
  \ \n    gpios = <&gpio1 7 GPIO_ACTIVE_HIGH>; \n}; \n```\n\n\n\n\n标签（Label）仅仅是标记节点的一种方式，通过唯一名称来识别节点。在现实世界中，该名称会被设备树编译器（DT\
  \ compiler）转换为唯一的 32 位值。在前面的示例中，`gpio1` 和 `node_label` 都是标签。标签可以被用来引用节点，因为标签对于节点是唯一的。\n\
  \n**指针句柄**（**phandle**）是一个与节点关联的 32 位值，用于唯一标识该节点，以便从另一个节点的属性中引用该节点。标签用于拥有指向该节点的指针。通过使用\
  \ `<&mylabel>`，你指向了标签为 `mylabel` 的节点。\n\n`&` 的用法与 C 语言语言相似；用于获取元素的地址。\n\n在前面的示例中，`&gpio1`\
  \ 被转换为 phandle，以便引用 `gpio1` 节点。接下来的示例也是如此：\n\n```\nthename@address { \n    property\
  \ = <&mylabel>; \n}; \n\nmylabel: thename@adresss { \n    [...] \n} \n```\n\n为了避免遍历整个树来寻找节点，引入了别名（aliases）的概念。在设备树中，`aliases`\
  \ 节点可以看作是一个快速查找表，即另一个节点的索引。可以使用 `find_node_by_alias()` 函数根据别名找到节点。别名不会直接在 DT 源码中使用，而是由\
  \ Linux 内核进行解引的。\n\n# DT 编译器\n\n设备树（DT）有两种形式：文本形式，表示源代码，也称为 `DTS`；以及二进制块形式（binary\
  \ blob），表示编译后的设备树，也称为 `DTB`。源文件具有 `.dts` 扩展。实际上，还有 `.dtsi` 文本文件，代表 SoC 层级定义，而 `.dts`\
  \ 文件代表板级级定义。可以将 `.dtsi` 看作头文件，它们应该被包含在 `.dts` 源文件中，而不是反过来，这有点在源文件（`.c`）中包含头文件（`.h`）一样。另一方面，二进制文件使用\
  \ `.dtb` 扩展。\n\n实际上还有第三种形式，即设备树在 `/proc/device-tree` 中的运行时表示。\n\n正如其名，用于编译设备树的工具被称为设备树编译器（`dtc`）。从内核根目录，可以编译一个独立的特定\
  \ DT，也可以编译特定架构的所有 DT。\n\n让我们为 arm SoC 编译所有 DT（.dts`）文件：\n\n```\n ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-\
  \ make dtbs \n```\n\n对于一个独立的 DT：\n\n```\n ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-\
  \ make imx6dl-sabrelite.dtb \n```\n\n在前面的示例中，源文件名为 `imx6dl-sabrelite.dts`。\n\n给定一个编译后的设备树\
  \ `(.dtb)` 文件，你可以执行反向操作并提取源码 `(.dts)` 文件：\n\n```\ndtc -I dtb -O dtsarch/arm/boot/dts\
  \ imx6dl-sabrelite.dtb >path/to/my_devicetree.dts \n```\n\n为了调试目的，将 DT 暴露给用户空间可能是很有用的。`CONFIG_PROC_DEVICETREE`\
  \ 配置变量会为你完成工作。你随后可以在 `/proc/device-tree` 中探索并遍历 DT。\n\n# 设备的表示与地址\n\n每个设备在 DT 中至少获得一个节点。某些属性对许多设备类型通用，特别是那些位于内核已知总线（SPI,\
  \ I2C, platform, MDIO 等）上的设备。这些属性是 `reg`、`#address-cells` 和 `#size-cells`。这些属性的作用是在设备所在的总线进行进行设备寻址。尽管如此，主要的寻址属性是\
  \ `reg`，它是一个通用属性，其含义取决于设备所在的总线。`size-cell` 和 `address-cell` 前的 `#` 符号可以翻译为“长度”。\n\
  \n每个可寻址设备都有一个 `reg` 属性，它是一个元组列表，格式为 `reg = <address0size0 [address1size1] [address2size2]\
  \ ... >`，其中每个元组代表设备使用的地址范围。`#size-cells` 表示使用多少个 32 位单元表示大小，如果大小无关则可以为 0。另一方面，`#address-cells`\
  \ 表示使用多少个 32 位单元表示地址。换句话说，每个元组的地址元素根据 `#address-cell` 解析；大小元素也是如此，根据 `#size-cell`\
  \ 解析。\n\n实际上，可寻址设备继承自父节点的 `#size-cell` 和 `#address-cell`，父节点是代表总线控制器的节点。给定设备中 `#size-cell`\
  \ 和 `#address-cell` 的存在不影响设备本身，但会影响其子节点。换句话说，在解释给定节点的 `reg` 属性之前，必须知道父节点的 `#address-cells`\
  \ 和 `#size-cells` 的值。父节点可以自由定义任何适用于设备子节点（孩子）的寻址方案。\n\n# SPI 和 I2C\n\nSPI 和 I2C：本节处理\
  \ CPU 可以访问内存的简单内存映射设备。在这里，`reg` 属性仍然定义了设备。\n\n\n\n此类设备应该声明在一个具有特殊值 `compatible =\
  \ \"simple-bus\"` 的节点内，这意味着这是一个简单的内存映射总线，没有特定的处理机制或驱动程序：\n\n```\nsoc { \n    #address-cells\
  \ = <1>; \n    #size-cells = <1>; \n    compatible = \"simple-bus\"; \n    aips-bus@02000000\
  \ { /* AIPS1 */ \n        compatible = \"fsl,aips-bus\", \"simple-bus\"; \n    \
  \    #address-cells = <1>; \n        #size-cells = <1>; \n        reg = <0x02000000\
  \ 0x100000>; \n        [...]; \n\n        spba-bus@02000000 { \n            compatible\
  \ = \"fsl,spba-bus\", \"simple-bus\"; \n            #address-cells = <1>; \n   \
  \         #size-cells = <1>; \n            reg = <0x02000000 0x40000>; \n      \
  \      [...] \n\n            ecspi1: ecspi@02008000 { \n                #address-cells\
  \ = <1>; \n                #size-cells = <0>; \n                compatible = \"\
  fsl,imx6q-ecspi\", \"fsl,imx51-ecspi\"; \n                reg = <0x02008000 0x4000>;\
  \ \n                [...] \n            }; \n\n            i2c1: i2c@021a0000 {\
  \ \n                #address-cells = <1>; \n                #size-cells = <0>; \n\
  \                compatible = \"fsl,imx6q-i2c\", \"fsl,imx21-i2c\"; \n         \
  \       reg = <0x021a0000 0x4000>; \n                [...] \n            }; \n \
  \       }; \n    }; \n}\n```\n\n在前面的示例中，父节点在 `compatible` 属性中包含 `simple-bus` 的子节点将被注册为平台设备（platform\
  \ devices）。人们还可以看到 I2C 和 SPI 总线控制器如何通过设置 `#size-cells = <0>;` 来改变其子节点的寻址方案，因为这对它们并不重要。查找任何绑定信息（binding\
  \ information）的一个知名位置是内核设备树文档：`Documentation/devicetree/bindings/`。\n\n# 资源处理\n\n\
  驱动的主要目的是处理和管理设备，并且大多数情况下将它们的功能暴露给用户空间。这里的目标是收集设备的配置参数，特别是资源（内存区域、中断线、DMA 通道、时钟等）。\n\
  \n以下是本节中我们将使用的设备节点。它是 i.MX6 UART 设备的节点，定义在 `arch/arm/boot/dts/imx6qdl.dtsi` 中：\n\
  \n```\nuart1: serial@02020000 { \n        compatible = \"fsl,imx6q-uart\", \"fsl,imx21-uart\"\
  ; \n        reg = <0x02020000 0x4000>; \n        interrupts = <0 26 IRQ_TYPE_LEVEL_HIGH>;\
  \ \n        clocks = <&clks IMX6QDL_CLK_UART_IPG>, \n<&clks IMX6QDL_CLK_UART_SERIAL>;\
  \ \n        clock-names = \"ipg\", \"per\"; \n        dmas = <&sdma 25 4 0>, <&sdma\
  \ 26 4 0>; \n        dma-names = \"rx\", \"tx\"; \n        status = \"disabled\"\
  ; \n    };\n```\n\n# 命名资源的概念\n\n当驱动程序期望某种特定类型的资源列表时，无法保证该列表是驱动程序期望的方式排列的，因为编写板级设备树的人通常不是编写驱动程序的人。例如，驱动程序可能期望其设备节点有\
  \ 2 条 IRQ 线路，一个用于索引为 0 的 Tx 事件，另一个用于索引为 1 的 Rx。如果不遵守顺序会发生什么？驱动程序将产生意料之外的行为。为了避免这种不匹配，引入了命名资源（`clock`、`irq`、`dma`、`reg`）的概念。它由定义我们的资源列表并对其命名组成，这样无论它们的索引如何，给定的名称将始终匹配该资源。\n\
  \n用于命名资源的对应属性如下：\n\n*   `reg-names`: 用于 `reg` 属性中的内存区域列表\n*   `clock-names`: 用于命名\
  \ `clocks` 属性中的时钟\n*   `interrupt-names`: 为 `interrupts` 属性中的每个中断命名\n*   `dma-names`:\
  \ 用于 `dma` 属性\n\n现在，让我们创建一个虚拟的设备节点条目来解释这一点：\n\n```\nfake_device { \n    compatible\
  \ = \"packt,fake-device\"; \n    reg = <0x4a064000 0x800>, <0x4a064800 0x200>, <0x4a064c00\
  \ 0x200>; \n    reg-names = \"config\", \"ohci\", \"ehci\"; \n    interrupts = <0\
  \ 66 IRQ_TYPE_LEVEL_HIGH>, <0 67 IRQ_TYPE_LEVEL_HIGH>;\n    interrupt-names = \"\
  ohci\", \"ehci\";\n    clocks = <&clks IMX6QDL_CLK_UART_IPG>, <&clks IMX6QDL_CLK_UART_SERIAL>;\n\
  \    clock-names = \"ipg\", \"per\";\n    dmas = <&sdma 25 4 0>, <&sdma 26 4 0>;\n\
  \    dma-names = \"rx\", \"tx\"; \n};\n```\n\n驱动程序中提取命名资源的对应代码如下：\n\n```\nstruct\
  \ resource *res1, *res2; \nres1 = platform_get_resource_byname(pdev, IORESOURCE_MEM,\
  \ \"ohci\"); \nres2 = platform_get_resource_byname(pdev, IORESOURCE_MEM, \"config\"\
  ); \n\nstruct dma_chan *dma_chan; \ndma_chan = platform_get_resource_byname(pdev,\
  \ IORESOURCE_MEM, \"rx\"); \n\nstruct dma_chan *dma_chan_2; \ndma_chan_2 = platform_get_resource_byname(pdev,\
  \ IORESOURCE_MEM, \"tx\"); \n\nint irq, irq; \nirq = platform_get_interrupt_byname(pdev,\
  \ \"ohci\"); \nirq = platform_get_interrupt_byname(pdev, \"ehci\"); \n\nstruct clock\
  \ *ipg, *per; \nipg = dev_get_clock_byname(pdev, \"ipg\"); \nper = dev_get_clock_byname(pdev,\
  \ \"per\"); \n```\n\n# 中断处理\n\n这包括从 DT 中获取 IRQ 号，并将其映射到 Linux IRQ，从而为其注册一个函数回调。执行此操作的驱动代码非常简单：\n\
  \n\n\n\n\n```\nint irq = platform_get_irq(pdev, 0); \nret = request_irq(irq, imx_rxint,\
  \ 0, dev_name(&pdev->dev), sport); \n```\n\n`platform_get_irq()` 调用将返回 `irq` 编号；此编号可以被\
  \ `devm_request_irq()` 使用（随后 `irq` 将在 `/proc/interrupts` 中可见）。第二个参数 `0` 表示我们需要设备节点中指定的第一个中断。如果存在多个中断，我们可以根据需要的中断更改此索引，或者直接使用命名资源。\n\
  \n在我们先前的的示例中，设备节点包含一个中断指定符，其格式如下：\n\n```\ninterrupts = <0 66 IRQ_TYPE_LEVEL_HIGH>;\
  \ \n```\n\n*   根据 ARM GIC，第一个单元（cell）告诉我们中断的类型：\n\n    *   `0`: **共享外设中断** (`SPI**`)，用于在多个核心之间共享的中断信号，该中断可以由\
  \ GIC 路由到任何核心。\n\n    *   `1`: **私有外设中断** (`PPI**`)，用于单个核心私有的中断信号。\n\n文档可以在此处找到：[`infocenter.arm.com/help/index.jsp?topic=/com.arm.doc.ddi0407e/CCHDBEBE.html`](http://infocenter.arm.com/help/index.jsp?topic=/com.arm.doc.ddi0407e/CCHDBEBE.html)。\n\
  \n*   第二个单元持有中断编号。该编号取决于中断线是 PPI 还是 SPI。\n\n*   第三个单元在我们的案例中为 `IRQ_TYPE_LEVEL_HIGH`，代表电平触发。所有可用的触发电平都定义在\
  \ `include/linux/irq.h` 中。\n\n# 中断控制器代码\n\n`interrupt-controller` 属性用于声明一个设备为中断控制器。`#interrupt-cells`\
  \ 属性定义了定义单条中断线需要使用多少单元。我们将在[第 16 章](http://advanced)，*高级中断管理* 中详细讨论这一点。\n\n# 提取特定应用程序数据\n\
  \n特定应用程序数据是通用属性之外的数据（既不是资源，也不是 GPIO、调控器等）。这些是可以分配给设备的任意属性和子节点。此类属性名称通常带有厂商代码前缀。这些可以是任何字符串、布尔值或整数值，以及它们在\
  \ Linux 源码 `drivers/of/base.c` 中定义的 API。我们讨论的以下示例并不是详尽的。现在让我们复用本章之前定义的节点：\n\n```\n\
  node_label: nodename@reg{ \n  string-property = \"a string\"; \n  string-list =\
  \ \"red fish\", \"blue fish\"; \n  one-int-property = <197>; /* 此属性中有一个单元 */ \n\
  \  int-list-property = <0xbeef 123 0xabcd4>;/* 每个数字（单元）都是 32 位整数(uint32)。* \n  \
  \                                       * 此属性中有 3 个单元 \n                       \
  \                  */ \n    mixed-list-property = \"a string\", <0xadbcd45>, <35>,\
  \ [0x01 0x23 0x45] \n    byte-array-property = [0x01 0x23 0x45 0x67]; \n    one-cell-property\
  \ = <197>; \n    boolean-property; \n}; \n```\n\n# 文本字符串\n\n以下是一个 `string` 属性：\n\
  \n```\nstring-property = \"a string\"; \n```\n\n回到驱动程序中，应该使用 `of_property_read_string()`\
  \ 来读取字符串值。其原型定义如下：\n\n```\nint of_property_read_string(const device_node *np, const\
  \ char *propname, char **out)\n```\n\n以下代码展示了如何使用：\n\n```\nconst char *my_string\
  \ = NULL;\nof_property_read_string(pdev->dev_node, \"string-property\", &my_string);\n\
  ```\n\n# 单元与 32 位整数\n\n以下是中断编号，取决于中断线是 PPI 还是 SPI：\n\n```\ninterrupts = <0 66 IRQ_TYPE_LEVEL_HIGH>;\
  \ \n```\n\n应该使用 `of_property_read_32()` 来读取单元：\n\n```\nints-property = <197>;\n\
  ```\n\n在驱动程序中，\n\n```c\nunsigned int number;\nof_property_read_32(pdev->dev_node,\
  \ \"one-int-property\", &number);\n```\n\n可以使用 `of_property_read_32_array()` 来读取\
  \ 32 位整数列表。其原型如下：\n\n```\nint of_property_read_32_array(const device_node *np, const\
  \ char *propname, u32 *array, int2 count)\n```\n\n在这里，`count` 是单元的数量：\n\n```\nint-list-property\
  \ = <0xbeef 123 0xabcd4>;\nunsigned int array[3];\nof_property_read_32_array(pdev->dev_node,\
  \ \"int-list-property\", array, 3);\n```\n\n# 布尔值\n\n应该使用 `of_property_read_bool()`\
  \ 来读取布尔值：\n\n```c\nbool my_bool;\nif (of_property_read_bool(pdev->dev_node, \"boolean-property\"\
  )) {\n    /* 真 */\n} else {\n    /* 假 */\n}\n```\n\n# 提取并解析子节点\n\n可以使用 `for_each_child_of_node()`\
  \ 遍历子节点：\n\n```c\nstruct device_node *np = pdev->dev_node;\nstruct device_node *sub_np;\n\
  for_each_child_of_node(np, sub_np) { \n    ...\n```\n\n\n\n\n一旦你填充了 ID 数组，必须将其传递给平台驱动程序结构体中的\
  \ `of_match_table` 字段：\n\n```c\nstatic struct platform_driver serial_imx_driver\
  \ = { \n    [...] \n    .driver     = { \n        .name   = \"imx-uart\", \n   \
  \     .of_match_table = imx_uart_dt_ids, \n        [...] \n    }, \n}; \n```\n\n\
  在这一步，只有你的驱动程序知道你的 `of_device_id` 数组。为了让内核也知晓这一点（以便它将你的 ID 存储在平台核心维护的设备列表中），你必须使用\
  \ `MODULE_DEVICE_TABLE` 对你的数组进行注册，如 第 5 章 `平台设备驱动：` 中所述：\n\n```c\nMODULE_DEVICE_TABLE(of,\
  \ imx_uart_dt_ids); \n```\n\n大功完成！我们的驱动程序现在兼容设备树（DT）了。回到我们的 DT，让我们声明一个与我们的驱动兼容的设备：\n\
  \n```c\nuart1: serial@02020000 { \n    compatible = \"fsl,imx6q-uart\", \"fsl,imx21-uart\"\
  ; \n    reg = <0x02020000 0x4000>; \n    interrupts = <0 26 IRQ_TYPE_LEVEL_HIGH>;\
  \ \n    [...] \n}; \n```\n\n这里提供了两个兼容字符串。如果第一个不匹配任何驱动，内核将与第二个进行匹配。\n\n当发生匹配时，会调用你驱动的\
  \ `probe` 函数，并传入 `struct platform_device` 结构体作为参数。该结构体包含一个 `struct device dev` 字段，其中有一个\
  \ `struct device_node *of_node` 字段，它与我们设备关联的节点对应，因此可以使用它来提取设备设置：\n\n```c\nstatic\
  \ int serial_imx_probe(struct platform_device *pdev) \n{ \n    [...]\nstruct device_node\
  \ *np; \nnp = pdev->dev.of_node; \n\n    if (of_get_property(np, \"fsl,dte-mode\"\
  , NULL)) \n        sport->dte_mode = 1; \n        [...] \n } \n```\n\n人们可以通过检查 DT\
  \ 节点是否设置，来判断驱动是响应 `of_match` 加载的，还是从板板的 `init` 文件内部实例化的。此时，你应该使用 `of_match_device`\
  \ 函数来选取引发匹配的 `struct *of_device_id` 条目，该条目可能包含你传递的具体数据：\n\n```c\nstatic int my_probe(struct\
  \ platform_device *pdev) \n{ \nstruct device_node *np = pdev->dev.of_node; \nconst\
  \ struct of_device_id *match; \n\n    match = of_match_device(imx_uart_dt_ids, &pdev->dev);\
  \ \n    if (match) { \n        /* Devicetree, extract the data */ \n        my_data\
  \ = match->data \n    } else { \n        /* Board init file */ \n        my_data\
  \ = dev_get_platdata(&pdev->dev); \n    } \n    [...] \n} \n```\n\n![](img/037649.jpg)\n\
  \n# 处理非设备树平台\n\n内核通过 `CONFIG_OF` 选项启用 DT 支持。当内核中未启用该支持时，人们可能希望避免使用 DT API。实现这一点的方法是检查\
  \ `CONFIG_OF` 是否设置。人们以前会进行如下操作：\n\n```c\n#ifdef CONFIG_OF \n    static const struct\
  \ of_device_id imx_uart_dt_ids[] = { \n        { .compatible = \"fsl,imx6q-uart\"\
  , }, \n        { .compatible = \"fsl,imx1-uart\", }, \n        { .compatible = \"\
  fsl,imx21-uart\", }, \n        { /* sentinel */ } \n    }; \n\n    /* 其他依赖于设备树的代码\
  \ */ \n    [...] \n#endif \n```\n\n即使在缺少设备树支持时 `of_device_id` 数据类型始终被定义，但封装在 `#ifdef\
  \ CONFIG_OF ... #endif` 中的代码在构建期间会被省略。这用于条件编译。这并不是你唯一的选择；还有 `of_match_ptr` 宏，当 `OF`\
  \ 被禁用时，它简单地返回 `NULL`。在任何你需要将 `of_match_table` 作为参数传递的地方，都应该将其封装在 `of_match_ptr`\
  \ 宏中，以便在 `OF` 被禁用时返回 `NULL`。该宏定义在 `include/linux/of.h` 中：\n\n```c\n#define of_match_ptr(_ptr)\
  \ (_ptr) /* 当启用 CONFIG_OF 时 */ \n#define of_match_ptr(_ptr) NULL   /* 当未启用时 */ \n\
  ```\n\n我们可以如下使用它：\n\n```c\nstatic int my_probe(struct platform_device *pdev) \n\
  { \n    const struct of_device_id *match; \n    match = of_match_device(of_match_ptr(imx_uart_dt_ids),\
  \ \n                     &pdev->dev); \n    if (match) { \n        /* Devicetree,\
  \ extract the data */ \n        my_data = match->data \n    } else { \n        /*\
  \ Board init file */ \n        my_data = dev_get_platdata(&pdev->dev); \n    } \n\
  \    [...] \n} \n```\n\n\n\n\n```\nstatic const struct platform_device_id sdma_devtypes[]\
  \ = { \n    { \n        .name = \"imx51-sdma\", \n        .driver_data = (unsigned\
  \ long)&sdma_imx51, \n    }, { \n        .name = \"imx53-sdma\", \n        .driver_data\
  \ = (unsigned long)&sdma_imx53, \n    }, { \n        .name = \"imx6q-sdma\", \n\
  \        .driver_data = (unsigned long)&sdma_imx6q, \n    }, { \n        .name =\
  \ \"imx7d-sdma\", \n        .driver_data = (unsigned long)&sdma_imx7d, \n    },\
  \ { \n        /* sentinel */ \n    } \n}; \nMODULE_DEVICE_TABLE(platform, sdma_devtypes);\
  \ \n```\n\n我们对 OF 匹配风格也进行同样的操作：\n\n```\nstatic const struct of_device_idsdma_dt_ids[]\
  \ = { \n    { .compatible = \"fsl,imx6q-sdma\", .data = &sdma_imx6q, }, \n    {\
  \ .compatible = \"fsl,imx53-sdma\", .data = &sdma_imx53, }, \n       { .compatible\
  \ = \"fsl,imx51-sdma\", .data = &sdma_imx51, }, \n    { .compatible = \"fsl,imx7d-sdma\"\
  , .data = &sdma_imx7d, }, \n    { /* sentinel */ } \n}; \nMODULE_DEVICE_TABLE(of,\
  \ sdma_dt_ids); \n```\n\n`probe` 函数将如下：\n\n```\nstatic int sdma_probe(structplatform_device\
  \ *pdev) \n{ \nconststructof_device_id *of_id = \nof_match_device(of_match_ptr(sdma_dt_ids),\
  \ &pdev->dev); \nstructdevice_node *np = pdev->dev.of_node; \n\n    /* 如果是设备树， */\
  \ \n    if (of_id) \ndrvdata = of_id->data; \n    /* 否则，硬编码 */ \n    else if (pdev->id_entry)\
  \ \ndrvdata = (void *)pdev->id_entry->driver_data; \n\n    if (!drvdata) { \ndev_err(&pdev->dev,\
  \ \"unable to find driver data\\n\"); \n        return -EINVAL; \n    } \n    [...]\
  \ \n} \n```\n\n然后我们声明平台驱动程序；填充在前面的节中定义的所有数组：\n\n```\nstatic struct platform_driversdma_driver\
  \ = { \n    .driver = { \n    .name   = \"imx-sdma\", \n    .of_match_table = of_match_ptr(sdma_dt_ids),\
  \ \n    }, \n    .id_table  = sdma_devtypes, \n    .remove  = sdma_remove, \n  \
  \  .probe   = sdma_probe, \n}; \nmodule_platform_driver(sdma_driver); \n```\n\n\
  # 平台资源与 DT\n\n平台设备可以在启用设备树的系统中工作，无需任何额外修改。这就是我们在 *Handling resources* 节中所演示的。通过使用\
  \ `platform_xxx` 系列函数，内核也会遍历 DT（使用 `of_xxx` 系列函数）来查找请求的资源。反过来情况则不然，因为 `of_xxx` 系列函数仅为\
  \ DT 保留。所有资源数据都将以通常的方式供驱动程序使用。驱动程序现在知道该设备是否是用板文件中的硬编码参数初始化的。让我们来看一个 `uart` 节点的示例：\n\
  \n```\nuart1: serial@020200 { \n    compatible = \"fsl,imx6q-uart\", \"fsl,imx21-uart\"\
  ; \n    reg = <0x020200 0x4000>; \n    interrupts = <26 IRQ_TYPE_HIGH>; \n    dmas\
  \ = <&sdma 25 0>, <&sdma 26 0>; \n    dma-names = \"rx\", \"tx\"; \n}; \n```\n\n\
  以下节录描述了其驱动程序的 `probe` 函数。在 `probe` 中，可以使用 `platform_get_resource()` 函数提取任何作为资源的属性（内存区域、`dma`、`irq`），或者特定的函数如\
  \ `platform_get_irq()`，它提取由 DT 中 `interrupts` 属性提供的 `irq`：\n\n```c\nstatic int my_probe(struct\
  \ platform_device *pdev) \n{ \nstruct io_dev *ind_dev; \nstruct resource *mem, *dma_res;\
  \ \nstruct xadc *xadc; \nint irq, ret, dmareq;\n\n    /* irq */ \n    irq = platform_get_irq(pdev,\
  \ 0); \n    if (irq<= 0) \n        return -ENXIO; \n    [...]\n\n    /* 内存区域 */\
  \ \n    mem = platform_get_resource(pdev, IORESOURCE_MEM, 0); \n    xadc->base =\
  \ devm_ioremap_resource(&pdev->dev, mem); \n    /* \n     * 我们也可以使用 \n     * devm_ioremap(&pdev->dev,\
  \ mem->start, resource_size(mem)); \n     */ \n    if (IS_ERR(xadc->base)) \n  \
  \      return PTR_ERR(xadc->base); \n    [...]\n\n    /* 第二 dma 通道 */ \n    dma_res\
  \ = platform_get_resource(pdev, IORESOURCE_DMA, 1); \n    dmareq = dma_res->start;\n\
  \n    [...] \n} \n```\n\n总而言之，对于 `dma`、`irq` 和 `mem` 等属性，你不需要在平台驱动中执行任何操作来匹配 `dtb`。如果还记得，这些数据与可以作为平台资源传递的数据类型相同。为了理解为什么，我们只需要查看这些函数的内部；我们将看到它们每一个是如何处理\
  \ DT 的。以下是 `platform_get_irq` 函数的示例：\n\n```c\nint platform_get_irq(struct platform_device\
  \ *dev, unsigned int num) \n{ \n    [...]\n    struct resource *r; \n    if (IS_ENABLED(CONFIG_OF_IRQ)\
  \ && dev->dev.of_node) { \n        int ret;\n\n        ret = of_irq_get(dev->dev.of_node,\
  \ num); \n        if (ret > 0 || ret == -EPROBE_DEFER) \n            return ret;\
  \ \n    }\n\n    r = platform_get_resource(dev, IORESOURCE_IRQ, num); \n    if (r\
  \ && r->flags) { \n        struct irq_data *irqd; \n        irqd = irq_get_data(r->start);\
  \ \n        if (!irqd)\n            return -ENXIO; \n        irq_set_trigger(irqd,\
  \ r->flags); \n    }\n    return r ? r->start : -ENXIO;\n} \n```\n\n对于 `dma`、`irq`\
