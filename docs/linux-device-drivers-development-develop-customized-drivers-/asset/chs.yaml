  \ \n    if (of_id) \ndrvdata = of_id->data; \n    /* 否则，硬编码 */ \n    else if (pdev->id_entry)\
  \ \ndrvdata = (void *)pdev->id_entry->driver_data; \n\n    if (!drvdata) { \ndev_err(&pdev->dev,\
  \ \"unable to find driver data\\n\"); \n        return -EINVAL; \n    } \n    [...]\
  \ \n} \n```\n\n然后我们声明我们的平台程序；填充在前面的节中定义的所有数组：\n\n```\nstatic struct platform_driversdma_driver\
  \ = { \n    .driver = { \n    .name   = \"imx-sdma\", \n    .of_match_table = of_match_ptr(sdma_dt_ids),\
  \ \n    }, \n    .id_table  = sdma_devtypes, \n    .remove  = sdma_remove, \n  \
  \  .probe   = sdma_probe, \n}; \nmodule_platform_driver(sdma_driver); \n```\n\n\
  # 平台资源与 DT\n\n平台设备可以在启用设备树的系统中工作，无需任何额外修改。这就是我们在 *Handling resources (处理资源)* 节中所演示的。通过使用\
  \ `platform_xxx` 系列函数，内核也会遍历 DT（使用 `of_xxx` 系列函数）来查找请求的资源。反过来情况则不然，因为 `of_xxx` 系列函数仅为\
  \ DT 保留。所有资源数据都将以通常的方式供驱动程序使用。驱动程序现在知道该设备是否是用板文件中的硬编码参数初始化的。让我们来看一个 `uart` 节点的示例：\n\
  \n```\nuart1: serial@020200 { \n    compatible = \"fsl,imx6q-uart\", \"fsl,imx21-uart\"\
  ; \n    reg = <0x020200 0x4000>; \n    interrupts = <26 IRQ_TYPE_HIGH>; \n    dmas\
  \ = <&sdma 25 0>, <&sdma 26 0>; \n    dma-names = \"rx\", \"tx\"; \n}; \n```\n\n\
  以下节录描述了其驱动程序的 `probe` 函数。在 `probe` 中，可以使用 `platform_get_resource()` 函数提取任何作为资源的属性（内存区域、`dma`、`irq`），或者特定的函数如\
  \ `platform_get_irq()`，它提取由 DT 中 `interrupts` 属性提供的 `irq`：\n\n```c\nstatic int my_probe(struct\
  \ platform_device *pdev) \n{ \nstruct io_dev *ind_dev; \nstruct resource *mem, *dma_res;\
  \ \nstruct xadc *xadc; \nint irq, ret, dmareq;\n\n    /* irq */ \n    irq = platform_get_irq(pdev,\
  \ 0); \n    if (irq<= 0) \n        return -ENXIO; \n    [...]\n\n    /* 内存区域 */\
  \ \n    mem = platform_get_resource(pdev, IORESOURCE_MEM, 0); \n    xadc->base =\
  \ devm_ioremap_resource(&pdev->dev, mem); \n    /* \n     * 我们也可以使用 \n     * devm_ioremap(&pdev->dev,\
  \ mem->start, resource_size(mem)); \n     */ \n    if (IS_ERR(xadc->base)) \n  \
  \      return PTR_ERR(xadc->base); \n    [...]\n\n    /* 第二 dma 通道 */ \n    dma_res\
  \ = platform_get_resource(pdev, IORESOURCE_DMA, 1); \n    dmareq = dma_res->start;\n\
  \n    [...] \n} \n```\n\n总而言之，对于 `dma`、`irq` 和 `mem` 等属性，你不需要在平台驱动中执行任何操作来匹配 `dtb`。如果还记得，这些数据与可以作为平台资源传递的数据类型相同。为了理解为什么，我们只需要查看这些函数的内部；我们将看到它们每一个是如何处理\
  \ DT 的。以下是 `platform_get_irq` 函数的示例：\n\n```c\nint platform_get_irq(struct platform_device\
  \ *dev, unsigned int num) \n{ \n    [...]\n    struct resource *r; \n    if (IS_ENABLED(CONFIG_OF_IRQ)\
  \ && dev->dev.of_node) { \n        int ret;\n\n        ret = of_irq_get(dev->dev.of_node,\
  \ num); \n        if (ret > 0 || ret == -EPROBE_DEFER) \n            return ret;\
  \ \n    }\n\n    r = platform_get_resource(dev, IORESOURCE_IRQ, num); \n    if (r\
  \ && r->flags) { \n        struct irq_data *irqd; \n        irqd = irq_get_data(r->start);\
  \ \n        if (!irqd)\n            return -ENXIO; \n        irq_set_trigger(irqd,\
  \ r->flags); \n    }\n    return r ? r->start : -ENXIO;\n} \n```\n\n平台设备可以在启用设备树的系统中工作，无需任何额外修改。这就是我们在\
  \ *Handling resources* 节中所演示的。通过使用 `platform_xxx` 系列函数，内核也会遍历 DT（使用 `of_xxx` 系列函数）来查找请求的资源。反过来情况则不然，因为\
  \ `of_xxx` 系列函数仅为 DT 保留。所有资源数据都将以通常的方式供驱动程序使用。驱动程序现在知道该设备是否是用板文件中的硬编码参数初始化的。让我们来看一个\
  \ `uart` 节点的示例：\n\n（注：原文文本中存在大量重复，翻译已按要求去重处理。）\n\n\n\n\n\n`I2C` 总线由飞浦（现为 `NXP`）发明，是一种双线（串行数据\
  \ (`SDA`) 和串行时钟 (`SCL`)）的异步串行总线。它是一个多主总线，尽管多主模式并没有广泛使用。`SDA` 和 `SCL` 都是开漏输出/开集收集，这意味着其中任何一个都可以将其输出低电平，但在没有上拉电阻的情况下，没有任何一个可以将其输出高电平。`SCL`\
  \ 由主设备生成，用于同步总线上的数据传输（由 `SDA` ）。从设备和主设备都可以发送数据（当然不是同时进行），因此 `SDA` 是一条双向线。尽管如此 `SCL`\
  \ 信号也是双向的，因为从设备可以通过保持 `SCL` 线低电平来扩展时钟。总线由主设备控制，在我们案例中主设备是 SoC 的一部分。该总线经常用于嵌入式系统，连接串口\
  \ EEPROM、RTC 芯片、GPIO 扩展器、温度传感器等：\n\n![](img/Image00012.gif)I2C 总线和设备\n\n时钟速度从 10\
  \ KHz 到 100 KHz，以及 400 KHz 到 2 MHz。本书中不会涵盖总线规范或总线驱动程序。然而，总线驱动程序负责管理总线并处理规范。`i.MX6`\
  \ 芯片的总线驱动程序示例可以在内核源码的 `drivers/i2C/busses/i2c-imx.c` 中找到，I2C 规范可以在 [`www.nxp.com/documents/user_manual/UM10204.pdf`](http://www.nxp.com/documents/user_manual/UM10204.pdf)\
  \ 查看。\n\n在本章中，我们关注客户端驱动程序，以便处理位于总线上的从设备。本将涵盖以下主题：\n\n* I2C 客户端驱动程序架构\n* 访问设备，从而从设备读/写数据\n\
  * 从 DT 中声明客户端\n\n# 驱动程序架构\n\n当你编写的驱动程序的设备连接到一个名为 `总线控制器` 的物理总线上时，它必须依赖于该总线的驱动程序，称为\
  \ `控制器驱动程序`，该程序负责在设备之间共享总线访问。控制器驱动程序在你的设备和总线之间提供了一个抽象层。当你在 I2C 或 USB 总线上执行事务（例如读或写）时，I2C/USB\
  \ 总线控制器会在后台透明地处理这些操作。每个总线控制器驱动程序都会导出一组函数，以便为位于该总线上的设备开发驱动程序。这适用于所有物理总线（I2C, SPI,\
  \ USB, PCI, SDIO 等）。\n\nI2C 驱动程序在内核中表示为 `struct i2c_driver` 的一个实例。I2C 客户端（代表设备本身）由\
  \ `struct i2c_client` 结构表示。\n\n# i2c_driver 结构\n\nI2C 驱动程序在内核中声明为 `struct i2c_driver`\
  \ 的实例，其结构如下：\n\n```\nstruct i2c_driver { \n    /* 标准驱动模型接口 */ \nint (*probe)(struct\
  \ i2c_client *, const struct i2c_device_id *); \nint (*remove)(struct i2c_client\
  \ *); \n\n    /* 与枚举无关的驱动模型接口 */ \n    void (*shutdown)(struct i2c_client *); \n\
  \nstruct device_driver driver; \nconst struct i2c_device_id *id_table; \n}; \n```\n\
  \n`struct i2c_driver` 结构包含并表征了通用访问例程，用于处理声明该驱动程序的设备；而 `struct i2c_client` 包含了设备特定信息，例如其地址。`struct\
  \ i2c_client` 结构代表并表征了一个 I2C 设备。在本章稍后的部分，我们将看到如何填充这些结构。\n\n# probe() 函数\n\n`probe()`\
  \ 函数是 `struct i2c_driver` 结构的一部分，每当一个 I2C 设备实例化时就会执行一次。它负责以下任务：\n\n* 检查设备是否是你预期的那一个\n\
  * 使用 `i2c_check_functionality` 函数检查 SoC 的 I2C 总线控制器是否支持你的设备所需的功能\n* 初始化设备\n* 设置设备\n\
  * 注册到内核\n\n`probe` 函数的原型为：\n\n```\nstatic int probe(struct i2c_client *client, const\
  \ struct i2c_device_id *id)\n```\n\n如你所见，它的参数是：\n\n* `struct i2c_client` 指针：它代表设备本身。该结构继承自设备，并由内核提供。其定义如下：\n\
  \n```\nstruct i2c_client { \n  unsigned short flags;  /* flags */ \n  unsigned short\
  \ addr;   /* 7 bits */ \n  char name[I2C_SIZE];   /* name */ \n  struct i2c_adapter\
  \ *adapter; /* the adapter */ \n  struct device dev;      /* device */ \n  int irq;\
  \                /* irq */ \n #if CONFIG(I2C_SLAVE) \n  struct i2c_cb cb; /* callback\
  \ */ \n #endif\n};\n```\n\n* `struct i2c_device_id` 指针：它指向正在探测的设备。\n\n# 每个设备数据\n\
  \nI2C 核心提供了将任何数据指针作为设备特定数据的可能性。要存储或检索数据，请使用以下函数：\n\n```\n/* 设置数据 */\nvoid i2c_clientdata(struct\
  \ i2c_client *client, void *data);\n\n/* 获取数据 */\nvoid *i2c_get_clientdata(const\
  \ i2c_client *client);\n```\n\n这些函数内部调用 `dev_set_drvdata` 和 `dev_get_drvdata` 来更新或获取\
  \ `struct device` 的成员 `void *driver_data` 指针，该指针本身也是 `struct i2c_client` 的成员。事实上，我们可以直接使用\
  \ `dev_get_drvdata` 和 `dev_set_drvdata`。\n\n这是一个使用客户端数据的示例；节自 `drivers/gpio/gpio-mcs0860.c`\
  \ 的片段：\n\n```c\n/* 这是设备结构体 */\nstruct mc9s0860 { \n   struct i2c_client *client;\
  \ \n   struct gpio_chip chip; \n}; \n\nstatic int mc9s0860_probe(struct i2c_client\
  \ *client, struct i2c_device_id *id) \n{ \n    struct mc9s0860 *mc9s; \n    if (!i2c_check_functionality(client->adapter,\
  \ I2C_FUNC_SMBUS_BYTE_DATA)) \n        return -EIO; \n    mc9s = devm_kzalloc(&client->dev,\
  \ sizeof(*mc9s), GFP_KERNEL); \n    if (!mc9s) \n        return -ENOMEM; \n\n  \
  \  [...] \n    mc9s->client = client; \n    i2c_set_clientdata(client, mc9s); \n\
  \n    return gpiochip_add(&mc9s->chip); \n}\n```\n\n实际上，这些函数并不特定于 I2C。它们的作用只是获取/设置\
  \ `struct device` 的成员 `void *driver_data` 指针。可以在 `linux/include/linux/i2c.h` 中看到它们的定义。\n\
  \n# remove() 函数\n\n`remove` 函数的原型如下：\n\n```\nstatic int remove(struct i2c_client\
  \ *client)\n```\n\n`remove()` 函数提供了与 `probe()` 函数相同的 `struct i2c_client*`，因此你可以获取私有数据。例如，你可能根据在\
  \ `probe` 函数中设置的私有数据处理某些清理工作或其他操作：\n\n```c\nstatic int mc9s0860_remove(struct i2c_client\
  \ *client) \n{ \n    struct mc9s0860 *mc9s; \n\n    /* 我们检索我们的私有数据 */ \n    mc9s\
  \ = i2c_get_clientdata(client); \n\n    /* 我们要处理的 gpiochip */ \n   return gpiochip_remove(&mc9s->chip);\
  \ \n} \n```\n\n`remove` 函数负责从我们在 `probe()` 函数中注册的子系统中注销我们。在先的示例中，我们简单地从内核中移除了 `gpiochip`。\n\
  \n# 驱动程序初始化与注册\n\n\n\n\n\n当一个模块被加载时，可能需要进行一些初始化。大多数情况下，只需将驱动程序注册到 `I2C` 核心就足够了。同时，当模块被卸载时，我们通常只需要将自己从\
  \ `I2C` 核心中退出即可。在第 5 章 *平台设备驱动程序* 中，我们看到没值得我们费精力去使用 `init/exit` 函数，而应该使用 `module_*_driver`\
  \ 函数。在这种情况下，要使用的函数是：\n\n```\nmodule_i2c_driver(foo_driver); \n```\n\n# 驱动程序和设备配置\n\
  \n正如我们在匹配机制中看到的，我们需要提供一个 `device_id` 数组，以暴露我们的驱动程序可以管理的设备。由于我们谈论的是 `I2C` 设备，该结构体将是\
  \ `i2c_device_id`。该数组将告知内核我们在驱动程序中感兴趣的设备。\n\n现在回到我们的 `I2C` 设备驱动程序；查看 `/include/linux/mod_devicetable.h`，你将看到\
  \ `struct i2c_device_id` 是如何定义的：\n\n```\nstruct i2c_device_id { \n    char name[I2C_NAME_SIZE];\
  \ \n    kernel_ulong_tdriver_data;     /* 驱动程序的私有数据 */ \n}; \n```\n\n尽管如此，`struct\
  \ i2c_device_id` 必须嵌入 `struct i2c_driver` 中。为了让 `I2C` 核心（用于模块自动加载）知道我们需要处理的设备，我们必须使用\
  \ `MODULE_DEVICE_TABLE` 宏。内核必须知道在发生匹配时应该调用哪个 `probe` 或 `remove` 函数，这就是为什么我们的 `probe`\
  \ 和 `remove` 函数也必须嵌入同一个 `i2c_driver` 结构中：\n\n```\nstatic struct i2c_device_id foo_idtable[]\
  \ = { \n   { \"foo\", my_id_for_foo }, \n   { \"bar\", my_id_for_bar }, \n   { }\
  \ \n}; \n\nMODULE_DEVICE_TABLE(i2c, foo_idtable); \n\nstatic struct i2c_driver foo_driver\
  \ = { \n   .driver = { \n   .name = \"foo\", \n   }, \n\n   .id_table = foo_idtable,\
  \ \n   .probe    = foo_probe, \n   .remove   = foo_remove, \n} \n```\n\n![](img/037649.jpg)\n\
  \n# 访问客户端\n\n串行总线事务只是访问寄存器以设置/获取其内容。`I2C` 遵循这一原则。`I2C` 核心提供了两种 API，一种用于纯 `I2C` 通信，另一种用于与\
  \ `SMBUS` 的设备，后者也可以与 `I2C` 设备工作，但反之则不然。\n\n# 纯 I2C 通信\n\n以下是在与 `I2C` 设备通信时通常处理的本质函数：\n\
  \n```\nint i2c_master_send(struct i2c_client *client, const char *buf, int count);\
  \ \nint i2c_master_recv(struct i2c_client *client, char *buf, int count); \n```\n\
  \n几乎所有的 `I2C` 通信函数都以 `struct i2c_client` 作为第一个参数。第二个参数包含要读取或写入的字节，第三个参数表示读取或写入的字节数。像任何读/写函数一样，返回值是被读/写入的字节数。人们可以使用以下函数处理消息传输：\n\
  \n```\nint i2c_transfer(struct i2c_adapter *adap, struct i2c_msg *msg, \n\n    \
  \             int num); \n```\n\n`i2c_transfer` 发送一组消息，其中每条消息可以是读操作也可以是写操作，并且可以以任何方式混合。记住每次事务之间没有停止位。查看\
  \ `/include/uapi/linux/i2c.h`，消息结构如下：\n\n```\nstruct i2c_msg { \n        __u16 addr;\
  \    /* 从机地址 */ \n        __u16 flags;   /* 消息标志 */ \n        __u16 len;     /*\
  \ 消息长度 */ \n        __u8 *buf;     /* 指向消息数据的指针 */ \n}; \n```\n\n`struct i2c_msg`\
  \ 结构描述并刻画了一个 `I2C` 消息。对于每条消息，它必须包含客户端地址、消息的字节数和消息负载。\n\n`msg.len` 是一个 `u16`。这意味着你的读/写缓冲区始终小于\
  \ 2¹⁶ (64k)。\n\n让我们来看微芯片 `I2C` `24LC512eeprom` 字符驱动的 `read` 函数；我们应该理解这些工作是如何实际运作的。完整代码随本书的源码一起提供。\n\
  \n```\nssize_t \neep_read(struct file *filp, char __user *buf, size_t count, loff_t\
  \ *f_pos) \n{ \n    [...] \n    int _reg_addr = dev->current_pointer; \n    u8 reg_addr[2];\
  \ \n    reg_addr[0] = (u8)(_reg_addr>> 8); \n    reg_addr[1] = (u8)(_reg_addr& 0xFF);\
  \ \n\n    struct i2c_msg msg[2]; \n    msg[0].addr = dev->client->addr; \n    msg[0].flags\
  \ = 0;                /* 写 */ \n    msg[0].len = 2;                  /* 地址是 2 字节编码\
  \ */ \n    msg[0].buf = reg_addr; \n\n    msg[1].addr = dev->client->addr; \n  \
  \  msg[1].flags = I2C_M_RD;         /* 我们读取 */ \n    msg[1].len = count;  \n   \
  \ msg[1].buf = dev->data; \n\n    if (i2c_transfer(dev->client->adapter, msg, 2)\
  \ < 0) \n        pr_err(\"ee24lc512: i2c_transfer failed\\n\");  \n\n    if (copy_to_user(buf,\
  \ dev->data, count) != 0) { \n        retval = -EIO; \n    goto end_read; \n   \
  \ } \n    [...] \n} \n```\n\n`msg.flags` 读取应为 `I2C_M_RD`，写入应为 `0`。\n\n# 系统管理总线 (SMBus)\n\
  \n`SMBUS` 是 Intel 开发的一种双线总线，与 `I2C` 非常相似。`I2C` 设备与之兼容，但反之则不然。因此，如果有疑问，最好使用 `SMBUS`\
  \ 函数。\n\n以下显示了部分 `SMBus` API：\n\n```\n s32 i2c_smbus_read_byte_data(struct i2c_client\
  \ *client, u8 command); \n   s32 i2c_smbus_write_byte_data(struct i2c_client *client,\
  \ u8 command, u8 value); \n   s32 i2c_smbus_read_word_data(struct i2c_client *client,\
  \ u8 command); \n   s32 i2c_smbus_write_word_data(struct i2c_client *client, u8\
  \ command, u16 value); \n   s32 i2c_smbus_read_block_data(struct i2c_client *client,\
  \ u8 command, u8 length, u8 *values); \n   s32 i2c_smbus_write_block_data(struct\
  \ i2c_client *client, u8 command, u8 length, const u8 *values);\n```\n（注：此处原文最后两行函数名似乎不完整，已根据上下文补全为\
  \ block_data 函数）\n\n更多解释请查看 `/include/linux/i2c.h` 和 `drivers/i2c/i2c-core.c`。\n\
  \n以下示例显示了 `I2C` 扩展器中的简单读写：\n\n```\nstruct mcp23016 { \n   struct i2c_client*client;\
  \ \n   struct gpio_chip    chip; \n   struct mutex        lock; \n}; \n[...] \n\
  /* 需要更改 gpio 状态时调用此函数\nstatic int mcp23016_set(struct mcp23016 *mcp, unsigned offset,\
  \ int val) \n{ \n    s32 value; \n    unsigned bank = offset / 8; \n    u8 reg_gpio\
  \ = (bank == 0) ? GP0 : GP1; \n    unsigned bit = offset % 8; \n\n    value = i2c_smbus_read_byte_data(mcp->client,\
  \ reg_gpio); \n    if (value >= 0) { \n        if (val) \n            value |= 1\
  \ << bit; \n        else \n            value &= ~(1 << bit); \n        return i2c_smbus_write_byte_data(mcp->client,\
  \ reg_gpio, value); \n    } else \n        return value; \n} \n[...]\n```\n\n# 在板级文件中实例化\
  \ I2C 设备（旧且过时的方法）\n\n我们必须告知内核系统中存在哪些设备。实现这一点有两种方法：在 DT（设备树）中（我们稍后将在章节介绍），或者通过板文件（旧且过时的方法）。让我们看看如何在板文件中操作：\n\
  \n`struct i2c_board_info` 是用于表示板上 `I2C` 设备的结构体。该结构体的定义如下：\n\n```\nstruct i2c_board_info\
  \ { \n    char type[I2C_NAME_SIZE]; \n    unsigned short addr; \n    void *platform_data;\
  \ \n    int irq; \n}; \n```\n\n再次，结构体中删除了与我们无关的元素。\n\n在前面的结构体中，`type` 应包含与设备驱动程序中\
  \ `i2c_driver.driver.name` 字段定义的相同值。然后，你需要填充一个 `i2c_board_info` 数组，并将其作为参数传递给板初始化例程中的\
  \ `i2c_register_board_info` 函数。\n\n\n\n\n\n```c\nint i2c_register_board_info(int\
  \ busnum, struct i2c_board_info const *info, unsigned len) \n```\n\n在这里，`busnum`\
  \ 是设备所在的总线编号。这是一个旧的且已弃用的方法，因此我不会在书中深入介绍它。你可以随时查看内核源码中的 `Documentation/i2c/instantiating-devices`\
  \ 来了解具体操作方法。\n\n## I2C 与设备树\n\n正如我们在前面的节中看到的，为了配置 I2C 设备，本质上有两个步骤：\n\n* 定义并注册 I2C\
  \ 驱动程序\n* 定义并注册 I2C 设备\n\nI2C 设备属于 DT 中的非内存映射设备族，而 I2C 总线是一种可寻址总线（可寻址总线）。其中，设备节点中的\
  \ `reg` 属性代表设备在总线上的地址。\n\nI2C 设备节点都是其所在总线节点的节点。每个设备只被分配一个地址，不涉及长度或范围。I2C 设备需要声明的标准属性有\
  \ `reg`（它代表设备在总线上的地址）以及 `compatible` 字符串（它用于将设备与驱动程序匹配）。关于寻址的更多信息，你可以参考第 6 章，*设备树的概念*。\n\
  \n```c\n&i2c2 { /* 总线节点的 Phandle */ \n    pcf8523: rtc@68 { \n        compatible\
  \ = \"nxp,pcf8523\"; \n        reg = <0x68>; \n    }; \n    eeprom: ee24lc512@55\
  \ { /* eeprom 设备 */ \n        compatible = \"packt,ee24lc512\"; \n        reg =\
  \ <0x55>; \n       }; \n}; \n```\n\n上述示例在 SoC 的 2 号 I2C 总线上声明了一个地址为 0x50 的 HDMI\
  \ EDID 芯片，并在同一总线的地址 0x68 处声明了一个实时时钟 (`RTC`)。\n\n## 定义并注册 I2C 驱动程序\n\n我们目前所看到的没有改变。我们额外需要的是定义一个\
  \ `struct of_device_id`。`struct of_device_id` 被定义用于匹配 `.dts` 文件中的对应节点：\n\n```c\n\
  /* 此设备没有额外数据 */ \nstatic const struct of_device_id foobar_of_match[] = { \n    \
  \    { .compatible = \"packtpub,foobar-device\" }, \n        {} \n}; \nMODULE_DEVICE_TABLE(of,\
  \ foobar_of_match); \n```\n\n现在我们如下所示定义 `i2c_driver`：\n\n```c\nstatic struct i2c_driver\
  \ foo_driver = { \n    .driver = { \n    .name   = \"foo\", \n    .of_match_table\
  \ = of_match_ptr(foobar_of_match), /* 仅添加此行 */ \n    }, \n    .probe  = foo_probe,\
  \ \n    .id_table = foo_id, \n}; \n```\n\n人们可以用这种改进 `probe` 函数：\n\n```c\nstatic\
  \ int my_probe(struct i2c_client *client, const struct i2c_device_id *id) \n{ \n\
  \    const struct of_device_id *match; \n    match = of_match_device(mcp23s08_i2c_of_match,\
  \ &client->dev); \n    if (match) { \n        /* 设备树代码在此 */ \n    } else { \n  \
  \      /* \n         * 平台数据代码在这里。 \n         * 人可以使用 \n         *   pdata = dev_get_platdata(&client->dev);\
  \ \n         * \n         * 或者 *id*，它是指向引发匹配的 *i2c_device_id* 条目的指针， \n        \
  \ * 以便使用 *id->driver_data* 来提取设备 \n         * 特有数据，正如平台驱动章节所述。 \n         */ \n\
  \    } \n    [...] \n} \n```\n\n## 备注\n\n对于 4.10 之前的内核版本，如果查看 `drivers/i2c/i2c-core.c`\
  \ 中的 `i2c_device_probe()` 函数（供参考，这是内核每当一个 I2C 设备注册到 I2C 核心时都会调用的函数），你会看到类似的内容：\n\
  \n```c\n if (!driver->probe || !driver->id_table) \n            return -ENODEV;\
  \ \n```\n\n这意味着即使人们不需要使用 `.id_table`，它在驱动程序中也是强制性的。事实上，人们仅可以使用 OF 匹配样式，但无法移除 `.id_table`。内核开发者尝试移除对\
  \ `.id_table` 的需求，并专门使用 `.of_match_table` 进行设备匹配。该补丁可以通过此 URL 获取：[`git.kernel.org/cgit/linux/kernel/git/torvalds/linux.git/commit/?id=c80f52847c50109ca248c22efbf71ff10553dca`](https://git.kernel.org/cgit/linux/kernel/git/torvalds/linux.git/commit/?id=c80f52847c50109ca248c22efbf71ff10553dca)\n\
  \n\n\n\n\n`Serial Peripheral Interface` (`SPI`) 是一种（至少）四线制总线——`主输入从输出` (`MISO`)、`主输出从输入`\
  \ (`MOSI`)、`串行时钟` (`SCK`) 以及 `片选信号` (`CS`)，用于连接串行闪存、AD/DA 转换器。主设备始终产生时钟。它的速度可以达到\
  \ 80 MHz，即使没有实际的速度限制（也比 I2C 快得多）。`CS` 线也是如此，始终由主设备管理。\n\n这些信号名称中的每一个都有同义词：\n\n*\
  \ 当你看到 `SIMO`、`SDI`、`DI` 或 `SDA` 时，它们指的是 `MOSI`。\n* `SOMI`、`SDO`、`DO`、`SDA` 将指的是\
  \ `MISO`。\n* `SCK`、`CLK`、`SCL` 将指的是 `SCK`。\n* `S̅ S` 是片选线，也称为 `CS`。可以使用 `CSx`（其中\
  \ `x` 是索引，如 `CS0`、`CS1`）、`EN` 和 `ENB`，意为启用。`CS` 通常是低电有效信号：\n\n![](img/Image00013.jpg)SPI\
  \ 拓扑结构（来自维基百科）\n\n本章将介绍 SPI 驱动程序概念，例如：\n\n* SPI 总线描述\n* 驱动程序架构和数据结构描述\n* 半双工和全双工模式的数据发送与接收\n\
  * 从 DT（设备树）中声明 SPI 设备\n* 在用户空间通过半双工和全双工访问 SPI 设备\n\n# 驱动程序架构\n\nLinux 内核中 SPI 相关所需的头文件是\
  \ `<linux/spi/spi.h>`。在讨论驱动程序结构之前，让我们先看看内核是如何定义 SPI 设备的。SPI 设备在内核中被表示为 `spi_device`\
  \ 的实例。管理这些设备的驱动程序实例是 `struct spi_driver` 结构。\n\n# 设备结构\n\n`struct spi_device` 结构表示一个\
  \ SPI 设备，定义在 `include/linux/spi/spi.h` 中：\n\n```c\nstruct spi_device { \n    struct\
  \ devicedev; \n    struct spi_master*master; \n    u32 max_speed_hz; \n    u8 chip_select;\
  \ \n    u8 bits_per_word; \n    u16 mode; \n    int irq; \n    [...] \n    int cs_gpio;\
  \        /* 片选 gpio */ \n}; \n```\n\n这里移除了一些对我们没有意义的字段。尽管如此，以下是结构中元素的含义：\n\n* `master`:\
  \ 这代表设备所连接的 SPI 控制器（总线）。\n* `max_speed_hz`: 这是在该芯片（在当前板卡上）使用的最大时钟频率；此参数可以从驱动程序内部更改。你可以在每次传输中使用\
  \ `spi_transfer.speed_hz` 来覆盖该参数。我们稍后会讨论 SPI 传输。\n* `chip_select`: 这允许你启用需要通信的芯片，区分由主设备处理的芯片。`chip_select`\
  \ 默认为低电有效。这种行为可以通过模式中添加 `SPI_CS_HIGH` 标志来更改。\n* `mode`: 它定义了数据如何进行时钟同步。设备驱动程序可能会更改此。默认情况下，传输中每个字的数据时钟为**最高有效位**\
  \ (`MSB`) 先。这种行为可以通过指定 `SPI_LSB_FIRST` 来覆盖。\n* `irq`: 这代表中断号（在你的板卡 `init` 文件或通过\
  \ DT 注册为设备资源），你应该将其传递给 `request_irq()` 以接收来自该设备的设备。\n\n关于 SPI 模式；它们通过两个特征构建：\n\n\
  * `CPOL`: 这是初始时钟极性：\n    * `0`: 初始时钟状态为低，第一个边沿为上升沿\n    * `1`: 初始时钟状态为高，第一个状态为下降沿\n\
  * `CPHA`: 这是时钟相位，选择在哪个边沿对数据采样：\n    * `0`: 数据在下降沿（高变低）锁存，而输出在上升沿变化\n    * `1`: 数据在上升沿（低变高）锁存，输出在下降沿\n\
  \n这允许四种 SPI 模式，它们在内核中根据 `include/linux/spi/spi.h` 中的以下宏定义：\n\n```c\n#define  SPI_CPHA\
  \  0x01 \n#define  SPI_CPOL  0x02 \n```\n\n然后你可以产生以下数组来总结情况：\n\n| Mode | CPOL |\
  \ CPHA | 内核宏 |\n| :--- | :--- | :--- | :--- |\n| 0 | 0 | 0 | `#define SPI_MODE_0\
  \ (0|0)` |\n| 1 | 0 | 1 | `#define SPI_MODE_1 (0|SPI_CPHA)` |\n| 2 | 1 | 0 | `#define\
  \ SPI_MODE_2 (SPI_CPOL|0)` |\n| 3 | 1 | 1 | `#define SPI_MODE_3 (SPI_CPOL|SPI_CPHA)`\
  \ |\n\n以下是根据上述数组定义的每个 SPI 模式的表示。尽管如此，图中只表示了 `MOSI` 线，但 MISO 的原理是相同的：\n\n![](img/Image00014.jpg)\n\
  \n常用的模式是 `SPI_MODE_0` 和 `SPI_MODE_3`。\n\n# spi_driver 结构\n\n`struct spi_driver`\
  \ 代表你开发的用于管理 SPI 设备的驱动程序。其结构如下：\n\n```c\nstruct spi_driver { \n   const struct spi_device_id\
  \ *id_table; \n   int (*probe)(struct spi_device *spi); \n   int (*remove)(struct\
  \ spi_device *spi); \n   void (*shutdown)(struct spi_device *spi); \n   struct device_driver\
  \    driver; \n}; \n```\n\n![](img/037649.jpg)\n\n# probe() 函数\n\n其原型如下：\n\n```c\n\
  static int probe(struct spi_device *spi) \n```\n\n你可以参考第 7 章，*I2C 客户端驱动* 来查看在 `probe`\
  \ 函数中需要做什么。这里的步骤也是类似的。因此，与没有运行时更改控制器总线参数（CS 状态、字位、时钟）能力的 I2C 驱动不同，SPI 驱动可以做到。你可以根据设备属性设置总线。\n\
  \n一个典型的 SPI `probe` 函数所示：\n\n```c\nstatic int my_probe(struct spi_device *spi) \n\
  { \n    [...] /* 声明你的变量/结构 */ \n\n    /* bits_per_word 无法在平台数据中配置 */\n    spi->mode\
  \ = SPI_MODE_0; /* SPI 模式 */ \n    spi->max_speed_hz = 20000000;   /* 设备的最大时钟 */\
  \ \n    spi->bits_per_word = 16;    /* 设备每个字的位 */ \n    ret = spi_setup(spi); \n\
  \    ret = spi_setup(spi); \n    if (ret < 0) \n        return ret; \n\n    [...]\
  \ /* 执行一些初始化 */ \n    [...] /* 与适当的框架注册 */ \n\n    return ret; \n} \n```\n\n`struct\
  \ spi_device*` 是输入参数，由内核传递给 `probe` 函数。它代表你正在探测的设备。在你的 `probe` 函数内部，你可以使用 `spi_get_device_id`（在\
  \ `id_table` 匹配的情况下）获取触发匹配的 `spi_device_id` 并提取驱动数据：\n\n```c\nconst struct spi_device_id\
  \ *id = spi_get_device_id(spi); \nmy_private_data = array_chip_info[id->driver_data];\
  \ \n```\n\n# 每个设备数据\n\n在 `probe` 函数中，一项常见任务是跟踪模块生命周期内使用的私有（每个设备）数据。这在第 7 章，*I2C\
  \ 客户端驱动*中讨论过。\n\n以下是用于设置/获取设备数据的函数原型：\n\n```c\n/* 设置数据 */ \nvoid spi_set_drvdata(struct\
  \ *spi_device, void *data); \n\n/* 获取数据 */ \nvoid *spi_get_drvdata(const struct\
  \ *spi_device); \n```\n\n例如：\n\n```c\nstruct mc3380 { \n    struct mutex    lock;\
  \ \n    u8      bar; \n    struct foo chip; \n    struct spi_device *spi; \n}; \n\
  \nstatic int mc3380_probe(struct spi_device *spi) \n{ \n    struct mc3380 *mc; \n\
  \    [...] /* 设备设置 */ \n\n    mc = devm_kzalloc(&spi->dev, sizeof(struct mc3380),\
  \ \n                      GFP_KERNEL); \n    if (!mc) \n        return -ENOMEM;\
  \ \n\n    mutex_init(&mc->lock); \n    spi_set_drvdata(spi, mc); \n\n    mc->spi\
  \ = spi; \n    mc->chip.label = DRIVER_NAME, \n    mc->chip.set = mc33880_set; \n\
  \n    /* 与适当的框架注册 */ \n    [...] \n} \n```\n\n# remove() 函数\n\n`remove` 函数必须释放在\
  \ `probe` 函数中获取的所有资源。其结构如下：\n\n```c\nstatic int my_remove(struct spi_device *spi);\
  \ \n```\n\n一个典型的 `remove` 函数所示：\n\n\n\n\n\n```c\nstatic int mc33880_remove(struct\
  \ spi_device *spi) \n{ \n    struct mc33880 *mc; \n    mc = spi_get_drvdata(spi);\
  \ /* 获取我们的数据 */ \n    if (!mc) \n        return -ENODEV; \n\n    /* \n     * 从我们在\
  \ probe 函数中注册的框架中\n     * 注销\n     */ \n    [...] \n    mutex_destroy(&mc->lock);\
  \ \n    return 0; \n} \n```\n\n# 驱动的初始化与注册\n\n对于挂载在总线上的设备（无论是物理总线还是伪平台总线），大部分工作都是\
  \ `probe` 函数中完成的。`init` 和 `exit` 函数仅用于向总线内核注册/注销驱动：\n\n```c\nstatic int __init foo_init(void)\
  \ \n{ \n    [...] /* 我的初始化代码 */ \n   return spi_register_driver(&foo_driver); \n\
  } \nmodule_init(foo_init); \n\nstatic void __exit foo_cleanup(void) \n{ \n    [...]\
  \ /* 我的清理代码 */ \n   spi_unregister_driver(&foo_driver); \n} \nmodule_exit(foo_cleanup);\
  \ \n```\n\n话虽说，如果你除了注册/注销驱动外没有做其他的，内核提供了一个宏：\n\n```c\nmodule_spi_driver(foo_driver);\
  \ \n```\n\n这将在内部调用 `spi_register_driver` 和 `spi_unregister_driver`。这与我们在上一章节中看到的完全相同。\n\
  \n# 驱动与设备配置\n\n由于 I2C 设备需要 `i2c_device_id`，我们必须为 SPI 设备使用 `spi_device_id`，以便提供 `device_id`\
  \ 数组来匹配我们的设备。它定义在 `include/linux/mod_devicetable.h` 中：\n\n```c\nstruct spi_device_id\
  \ { \n   char name[SPI_NAME_SIZE]; \n   kernel_ulong_t driver_data; /* 驱动私有数据 */\
  \ \n}; \n```\n\n我们需要将数组嵌入到 `struct spi_device_id` 中，以告知 SPI 内核我们在驱动中需要管理的设备 ID，并在驱动结构上调用\
  \ `MODULE_DEVICE_TABLE` 宏。当然，该宏的第一个参数是设备所在的总线名称。在我们的案例中，它是 SPI：\n\n```c\n#define\
  \ ID_FOR_FOO_DEVICE  0 \n#define ID_FOR_BAR_DEVICE  1  \n\nstatic struct spi_device_id\
  \ foo_idtable[] = { \n   { \"foo\", ID_FOR_FOO_DEVICE }, \n   { \"bar\", ID_FOR_BAR_DEVICE\
  \ }, \n   { } \n}; \nMODULE_DEVICE_TABLE(spi, foo_idtable); \n\nstatic struct spi_driver\
  \ foo_driver = { \n   .driver = { \n   .name = \"KBUILD_MODULE\", \n   }, \n\n \
  \  .id_table    = foo_idtable, \n   .probe       = foo_probe, \n   .remove     \
  \ = foo_remove, \n}; \n\nmodule_spi_driver(foo_driver); \n```\n\n# 在板级配置文件中实例化 SPI\
  \ 设备 – 旧且过时的方法\n\n只有在系统不支持设备树（device tree）时，才应该在板级文件中实例化设备。由于设备树的出现，这种实例化方法已经过时了。因此，我们只需要记住板级文件位于\
  \ `arch/` 目录下。表示 SPI 设备的结构是 `struct spi_board_info`，而不是我们在驱动中使用的 `struct spi_device`。只有当你使用\
  \ `spi_register_board_info` 函数填充并注册了 `struct spi_board_info` 时，内核才会构建一个 `struct\
  \ spi_device`（该结构体将被传递给你的驱动并向 SPI 内核注册）。\n\n可以查看 `include/linux/spi/spi.h` 中的 `struct\
  \ spi_board_info` 字段。`spi_register_board_info` 的定义可以在 `drivers/spi/spi.c` 中找到。现在，让我们来看板级文件中的一些\
  \ SPI 设备注册：\n\n```c\n/** \n * 我们的平台数据 \n */ \nstruct my_platform_data { \n   int\
  \ foo; \n   bool bar; \n}; \nstatic struct my_platform_data mpfd = { \n   .foo =\
  \ 15, \n   .bar = true, \n}; \n\nstatic struct spi_board_info \n   my_board_spi_board_info[]\
  \ __initdata = { \n    { \n       /* modalias 必须与 spi 设备驱动名称相同 */ \n        .modalias\
  \ = \"ad7887\", /* 该设备的 spi_driver  own */ \n        .max_speed_hz = 1000000,  /*以\
  \ Hz 为单位的最大 SPI 时钟 (SCK) 速度 */ \n        .bus_num = 0, /* 框架总线编号 */ \n        .irq\
  \ = GPIO_IRQ(40), \n        .chip_select = 3, /* 框架片选信号 */ \n        .platform_data\
  \ = &mpfd, \n        .mode = SPI_MODE_3, \n   },{ \n        .modalias = \"spidev\"\
  , \n        .chip_select = 0, \n        .max_speed_hz = 1 * 1000 * 1000, \n    \
  \    .bus_num = 1, \n        .mode = SPI_MODE_3, \n    }, \n}; \n\nstatic int __init\
  \ board_init(void) \n{ \n   [...] \n   spi_register_board_info(my_board_spi_board_info,\
  \ ARRAY_SIZE(my_board_spi_board_info)); \n   [...] \n\n   return 0; \n} \n[...]\
  \ \n```\n\n# SPI 与设备树\n\n与 I2C 设备一样，SPI 设备属于 DT 中的非内存映射设备族，但也是可寻址的。在这里，地址指的是给控制器（主设备）的\
  \ CS 列表中的索引（从 0 开始）。例如，我们可能有三个挂载在 SPI 总线上的不同 SPI 设备，每个设备都有自己的 CS 线。主设备将获得一组 GPIO，每个\
  \ GPIO 都代表用于激活一个设备的 CS。如果设备 X 使用第二条 GPIO 线作为 CS，我们必须将其地址设置为 1。\n\n以下是一个 DT 列表：\n\
  \n```dtts\nspi1 {\n    compatible = \"spi-controller\";\n    status = \"okay\";\n\
  \    ad7887@0 {\n        compatible = \"ad7887\";\n        reg = <0>;\n        max_speed_hz\
  \ = <1000000>;\n        bus-num = <0>;\n        irq = <40>;\n        chip-select\
  \ = <3>;\n        platform-data = <&mpfd>;\n        mode = <3>;\n    };\n    spidev@1\
  \ {\n        compatible = \"spidev\";\n        reg = <1>;\n        max_speed_hz\
  \ = <1000000>;\n        bus_num = <1>;\n        mode = <3>;\n    };\n};\n```\n\n\
  SPI 设备节点中引入了一个新属性：`spi-max-frequency`。它代表设备以 Hz 为单位的最大时钟速度。每当你访问设备时，总线控制器驱动程序都会确保时钟不会超过此限制。其他常用的属性还有：\n\
  \n- `spi-cpol`: 这是一个布尔值（空属性），表示设备需要反向极极性。它对应 `CPOL`。\n- `spi-cpha`: 这是一个空属性，表示设备需要偏移相位。它对应\
  \ `CPHA`。\n- `spi-cs-high`: 默认情况下，SPI 设备低电平有效。这是一个布尔属性，表示设备高电平有效。\n\n话虽说，关于完整的 SPI\
  \ 绑定元素列表，你可以参考内核源码中的 *Documentation/devicree/bindings/spi-bus.txt*。\n\n# 在设备树中实例化\
  \ SPI 设备 – 新方法\n\n通过正确填充 DT 设备节点，内核将为我们构建一个 `struct spi_device`，并作为参数传递给 SPI 核心函数。以下是之前定义的\
  \ SPI DT 节录：\n\n```dtts\n&ecspi1 {\n    compatible = \"spi-controller\";\n    status\
  \ = \"okay\";\n    fake_spi_device@1 {\n        compatible = \"packtpub,foobar-device\"\
  ;\n        reg = <1>;\n        a-string-param = \"stringvalue\";\n        spi-cs-high;\n\
  \    };\n};\n```\n\n# 定义并注册 SPI 驱动\n\n原理与 I2C 驱动相同。我们需要定义一个 `struct of_device_id`\
  \ 来匹配 DT 中的设备，并调用 `MODULE_DEVICE_TABLE` 宏向 OF 内核注册：\n\n```c\nstatic const struct\
  \ of_device_id foobar_of_match[] = { \n           { .compatible = \"packtpub,foobar-device\"\
  \ }, \n           { .compatible = \"packtpub,barfoo-device\" }, \n        {} \n\
  }; \nMODULE_DEVICE_TABLE(of, foobar_of_match); \n```\n\n然后按照如下方式定义我们的 `spi_driver`：\n\
  \n\n\n\n\n```c\nstatic struct spi_driver foo_driver = { \n    .driver = { \n   \
  \ .name   = \"foo\", \n        /* The following line adds Device tree */ \n    .of_match_table\
  \ = of_match_ptr(foobar_of_match), \n    }, \n    .probe   = my_spi_probe, \n  \
  \  .id_table = foo_id, \n}; \n```\n\n你可以以此方式改进 `probe` 函数：\n\n```c\nstatic int my_spi_probe(struct\
  \ spi_device *spi) \n{ \n    const struct of_device_id *match; \n    match = of_match_device(of_match_ptr(foobar_of_match),\
  \ &spi->dev); \n    if (match) { \n        /* Device tree code goes here */ \n \
  \   } else { \n        /*  \n         * Platform data code comes here. \n      \
  \   * One can use \n         *   pdata = dev_get_platdata(&spi->dev); \n       \
  \  * \n         * or *id*, 这是一个指向源自匹配的 *spi_device_id* 条目的指针，\n         * 以便使用 *id->driver_data*\
  \ 来提取设备特定的 \n         * 数据，如第 5 节《平台设备驱动程序》所示。\n         */ \n    } \n    [...]\
  \ \n} \n```\n\n# 访问并与客户端通信\n\nSPI I/O 模型由一组队列的消息组成。我们提交一个或多个 `struct spi_message`\
  \ 结构，这些结构会被同步或异步地处理并完成。单个消息由一个或多个 `struct spi_transfer` 对象组成，每个对象代表一次全双工 SPI 传输。这是驱动程序与设备之间交换数据的两个主要结构。它们都定义在\
  \ `include/linux/spi/spi.h` 中：\n\n![](img/Image00015.jpg)SPI 消息结构\n\n`struct spi_transfer`\
  \ 代表全双工 SPI 传输：\n\n```c\nstruct spi_transfer { \n    const void  *tx_buf; \n   \
  \ void *rx_buf; \n    unsigned len; \n\n    dma_addr_t tx_dma; \n    dma_addr_t\
  \ rx_dma; \n\n    unsigned cs_change:1; \n    unsigned tx_nbits:3; \n    unsigned\
  \ rx_nbits:3; \n#define  SPI_NBITS_SINGLE   0x01 /* 1bit transfer */ \n#define \
  \ SPI_NBITS_DUAL            0x02 /* 2bits transfer */ \n#define  SPI_NBITS_QUAD\
  \            0x04 /* 4bits transfer */ \n    u8 bits_per_word; \n    u16 delay_usecs;\
  \ \n    u32 speed_hz; \n}; \n```\n\n以下是结构体元素的含义：\n\n* `tx_buf`：此缓冲区包含要写入的数据。若在只读事务中，它应为\
  \ NULL 或保持原样。在需要通过`直接内存访问`（`DMA`）执行 SPI 事务的情况下，它应该是 `dma`-安全的。\n\n* `rx_buf`：这是用于读取数据的缓冲区（与\
  \ `tx_buf` 具有相同属性），或在只写事务中为 NULL。\n\n* `tx_dma`：这是 `tx_buf` 的 DMA 地址，以防 `spi_message.is_dma_mapped`\
  \ 被设置为 `1`。DMA 在第 12 节 `DMA – 直接内存访问` 中讨论。\n\n* `rx_dma`：与 `tx_dma` 相同，但针对 `rx_buf`。\n\
  \n* `len`：代表 `rx` 和 `tx` 缓冲区的字节，意味着如果两者都被使用，它们的大小必须相同。\n\n* `speed_hz`：覆盖在 `spi_device.max_speed_hz`\
  \ 中指定的默认速度，但仅用于当前传输。如果为 `0`，则使用默认值（来自 `struct spi_device` 结构）。\n\n* `bits_per_word`：数据传输涉及一个或多个字。字是一个数据单位，其位宽可以根据需要而变化。在这里，`bits_per_word`\
  \ 代表本次 SPI 传输中字字的位宽。这覆盖了 `spi_device.bits_per_word` 提供的默认值。如果为 `0`，则使用默认值（来自 `spi_device`）。\n\
  \n* `cs_change`：决定在此传输完成后片选线（`chip_select`）的状态。\n\n* `delay_usecs`：代表在此传输之后、在（可选的）更改片选状态之前的延迟（单位为微秒），然后开始下一次传输或完成此\
  \ `spi_message`。\n\n在另一端，`struct spi_message` 用于原子地封装一个或多个 SPI 传输。SPI 总线将被驱动程序占用，直到构成消息的每次传输都完成。SPI\
  \ 消息结构也定义在 `include/linux/spi/spi.h` 中：\n\n```c\n struct spi_message { \n      \
  \ struct list_head transfers; \n       struct spi_device *spi; \n       unsigned\
  \ is_dma_mapped:1; \n       /* 完成通过回调函数报告 */ \n       void (*complete)(void *context);\
  \ \n       void *context; \n       unsigned actual_length; \n       int status;\
  \ \n    };\n```\n\n* `transfers`：这是传输列表。\n\n* `is_dma_mapped`：告知控制器是否使用 DMA。\n\n\
  * `complete`：这是回调函数。\n\n* `frame_length`：这是传输的字节数。\n\n* `status`：在完成后报告错误代码。\n\n\
  * `actual_length`：这是总字节数。\n\n* `context`：这是传递给回调函数的指针。\n\n还有其他辅助函数，它们都是围绕 `spi_sync()`\
  \ 构建的。其中一些是：\n\n\n\n\n\n```\nint spi_read(struct spi_device *spi, void *buf, size_t\
  \ len) \nint spi_write(struct spi_device *spi, const void *buf, size_t len) \nint\
  \ spi_write_then_read(struct spi_device *spi, \n        const void *txbuf, unsigned\
  \ n_tx, \nvoid *rxbuf, unsigned n_rx) \n```\n\n请查看 `/include/linux/spi/spi.h` 以获取完整列表。这些封装函数应适用于小量数据传输。\n\
  \n# 整合在一起\n\n编写 SPI 客户端驱动程序的步骤如下：\n\n1.  声明驱动程序支持的设备 ID。你可以使用 `spi_device_id` 实现。如果支持\
  \ DT（设备树），也请使用 `of_device_id`。你可以选择专门使用 DT。\n\n2.  调用 `MODULE_DEVICE_TABLE(spi,\
  \ my_id_table);` 将你的设备列表注册到 SPI 核心层。如果支持 DT，你必须调用 `MODULE_DEVICE_TABLE(of, your_of_match_table);`\
  \ 将你的设备列表注册到 `of` 核心层。\n\n3.  根据各自的原型编写 `probe` 和 `remove` 函数。`probe` 函数必须识别你的设备、配置它、定义每个设备（私有）数据、根据需要使用\
  \ `spi_setup` 函数配置总线（SPI 模式等），并注册到相应的内核框架中。在 `remove` 函数中，只需撤销 `probe` 函数中执行的所有操作即可。\n\
  \n4.  声明并填充 `struct spi_driver` 结构体，将 `id_table` 字段设置为你创建的 ID 数组。将 `.probe` 和 `.remove`\
  \ 字段设置为你编写的对应函数名。在 `.driver` 子结构体中，将 `.owner` 字段设置为 `THIS_MODULE`，设置驱动名称，最后如果支持\
  \ DT，将 `.of_match_table` 字段设置为 `of_device_id` 数组。\n\n5.  使用你刚刚填充的 `spi_driver` 结构体调用\
  \ `module_spi_driver` 函数，例如 `module_spi_driver(serial_eeprom_spi_driver);`，以便将你的驱动程序注册到内核中。\n\
  \n# SPI 用户态驱动\n\n使用用户态 SPI 设备驱动程序有两种方法。为了实现这一点，你需要通过 `spidev` 驱动启用你的设备。示例下：\n\n\
  ```\nspidev@0x00 { \n    compatible = \"spidev\"; \n    spi-max-frequency = <800000>;\
  \ /* 取决于你的设备 */ \n    reg = <0>; /* 对应片选 0 */ \n}; \n```\n\n你可以调用读/写函数或 `ioctl()`。调用读/写时，你一次只能进行读或写。如果你需要全双工读写，则必须使用“输入输出控制”\
  \ (`ioctl`) 命令。这两种方式都提供了示例。这里是读/写示例。你可以使用平台的交叉编译器或板卡上的原生编译器来编译它：\n\n```\n#include\
  \ <stdio.h> \n#include <fcntl.h> \n#include <stdlib.h> \n\nint main(int argc, char\
  \ **argv) \n{\n   int i;\n   int fd;\n   char wr_buf[]={0xff,0x00,0x1f,0xf}; \n\
  \   char rd_buf[10]; \n\n   if (argc<2) { \n         printf(\"Usage:%s [device]\\\
  n\", argv[0]); \n         exit(1); \n   }\n\n   fd = open(argv[1], O_RDWR); \n \
  \  if (fd<=0) {  \n         printf(\"Failed to open SPI device %s\\n\",argv[1]);\
  \ \n         exit(1); \n   }\n\n   if (write(fd, wr_buf, sizeof(wr_buf)) != sizeof(wr_buf))\
  \ \n         perror(\"Write Error\");\n   if (read(fd, rd_buf, sizeof(rd_buf)) !=\
  \ sizeof(rd_buf)) \n         perror(\"Read Error\");\n   else\n         for (i =\
  \ 0; i < sizeof(rd_buf); i++) \n             printf(\"0x%X \", rd_buf[i]);\n\n \
  \  close(fd); \n   return 0;\n}\n```\n# 使用 IOCTL\n\n使用 `IOCTL` 的优势是你可以进行全双工工作。你可以找到的最佳示例是内核源码树中的\
  \ `documentation/spi/spidev_test.c`。话虽如此，前面的读/写示例并没有改变任何 SPI 配置。然而，内核向用户空间暴露了一组\
  \ IOCTL 命令，你可以使用它们来设置总线，就像在 DT 中做的那样。下面的示例展示了你如何更改总线：\n\n```\n#include <stdint.h>\
  \ \n#include <unistd.h> \n#include <stdio.h> \n#include <stdlib.h> \n#include <string.h>\
  \ \n#include <fcntl.h> \n#include <sys/ioctl.h> \n#include <linux/types.h> \n#include\
  \ <linux/spi/spidev.h> \n\nstatic int pabort(const char *s) \n{ \n    perror(s);\
  \ \n    return -1; \n}\n\nstatic int spi_device_setup(int fd) \n{ \n    int mode,\
  \ speed, a, b, i; \n    int bits = 8; \n\n    /* \n     * spi mode: mode 0 \n  \
  \   */ \n    mode = SPI_MODE_0; \n    a = ioctl(fd, SPI_IOC_WR_MODE, &mode); /*\
  \ 写模式 */ \n    b = ioctl(fd, SPI_IOC_RD_MODE, &mode); /* 模式 */ \n    if ((a < 0)\
  \ || (b < 0)) { \n        return pabort(\"can't set spi mode\"); \n    }\n\n   \
  \ /* \n     * 时钟最大频率 Hz \n     */ \n    speed = 8000000; /* 8 MHz */ \n    a = ioctl(fd,\
  \ SPI_IOC_WR_MAX_SPEED_HZ, &speed); /* 写速度 */ \n    b = ioctl(fd, SPI_IOC_RD_MAX_SPEED_HZ,\
  \ &speed); /* 速度 */ \n    if ((a < 0) || (b < 0)) { \n        return pabort(\"fail\
  \ to max speed hz\"); \n    }\n\n    /* \n     * 设置 SPI 为 MSB 优先。  \n     * 这里，0\
  \ 表示“不使用 LSB 优先”。 \n     * 若要使用 LSB 优先，参数应 > 0 \n     */ \n    i = 0; \n    a =\
  \ ioctl(fd, SPI_IOC_WR_LSB_FIRST, &i); /* 注意：原文中 'dev' 是笔误，此处逻辑已修正为 'fd' */\n  \
  \  b = ioctl(fd, SPI_IOC_RD_LSB_FIRST, &i); \n    if ((a < 0) || (b < 0)) { \n \
  \       pabort(\"Fail to set MSB first\\n\"); \n    }\n\n    /* \n     * 设置 SPI\
  \ 每个字为 8 位 \n     */ \n    bits = 8; \n    a = ioctl(fd, SPI_IOC_WR_BITS_PER_WORD,\
  \ &bits); \n    b = ioctl(fd, SPI_IOC_RD_BITS_PER_WORD, &bits); \n    if ((a < 0)\
  \ || (b < 0)) { \n        pabort(\"Fail to set bits per word\\n\"); \n    } \n\n\
  \    return 0; \n} \n```\n\n你可以查看 `Documentation/spi/spidev` 以获取更多关于 spidev ioctl\
  \ 命令的信息。当要在总线上传输数据时，你可以使用 `SPI_IOC_MESSAGE(N)` 请求，它提供了全双工访问和无需禁用片选的复合操作，从而支持多传输传输。它等同于内核的\
  \ `spi_sync()`。在这里，传输表示为 `struct spi_ioc_transfer` 实例，它等同于内核的 `struct spi_transfer`，其定义可以在\
  \ `include/uapi/linux/spi/spidev.h` 中找到。以下是用法示例：\n\n```\nstatic void do_transfer(int\
  \ fd) \n{ \n    int ret; \n    char txbuf[] = {0x0B, 0x02, 0xB5}; \n    char rx[3]\
  \ = {0, }; \n    char cmd_buff = 0x9f;\n\n    struct spi_ioc_transfer tr[2] = {\
  \ \n        0 = { \n            .tx_buf = (unsigned long)&cmd_buff,\n          \
  \  .len = 1,\n            .cs_change = 1, /* 我们需要切换片选 */ \n            .delay_usecs\
  \ = 50, /* 传输后等待 */ \n            .bits_per_word = 8, \n        }, \n        [1]\
  \ = { \n            .tx_buf = (unsigned long)txbuf, \n            .rx_buf = (unsigned\
  \ long)rx, \n            .len = sizeof(txbuf), \n            .bits_per_word = 8,\
  \ \n        }, \n    }; \n\n    ret = ioctl(fd, SPI_IOC_MESSAGE(2), &tr); \n   \
  \ if (ret == 1){ \n        perror(\"can't send spi message\"); \n        exit(1);\
  \ \n    } \n\n    for (ret = 0; ret < sizeof(rx); ret++) \n        printf(\"%.2X\
  \ \", rx[ret]); \n    printf(\"\\n\"); \n} \n\nint main(int argc, char **argv) \n\
  { \n    char *device = \"/dev/spidev0.0\"; \n    int fd; \n    int error; \n\n \
  \   fd = open(device, O_RDWR); \n    if (fd < 0) \n        return pabort(\"Can't\
  \ open device \"); \n\n    error = spi_device_setup(fd); \n    if (error) \n   \
  \     exit (1); \n\n    do_transfer(fd); \n\n    close(fd); \n    return 0; \n}\
  \ \n```\n\n# 总结\n\n我们刚刚处理了 SPI 驱动程序，现在可以利用这种更快的串行（且全双工）总线。我们介绍了 SPI 的数据传输，这是最重要的部分。尽管如此，你可能需要更多的抽象，以避免处理\
  \ SPI 或 I2C API。这就是下一章的内容，涉及 Regmap API，它提供了一个更高且更统一的抽象层，使得 SPI（或 I2C）命令对你变得透明。\n\
  \n![](img/037649.jpg)\n\n# Regmap API – 寄存器映射抽象\n\n\n\n\n在 regmap API 开发之前，处理 SPI\
  \ 核心、I2C 核心或两者的设备驱动程序中存在大量的冗余代码。其原理是相同的；即访问寄存器进行读/写操作。底图显示了在 Regmap 引入内核之前，SPI 或\
  \ I2C API 是如何独立运行的：\n\n![](img/Image00016.gif)regmap 之前的 SPI 和 I2C 子系统\n\nregmap\
  \ API 在内核 3.1 版本中引入，用于提取并统一内核开发人员访问 SPI/I2C 设备的方式。此后只需考虑如何初始化、配置 regmap 并流畅地处理任何读/写/修改操作，无论是\
  \ SPI 还是 I2C：\n\n![](img/Image00017.jpg)regmap 之后的 SPI 和 I2C 子系统\n\n本章将通过以下方式介绍\
  \ regmap 框架：\n\n*   介绍 regmap 框架使用的主要数据结构\n*   阐述 regmap 配置\n*   使用 regmap API 访问设备\n\
  *   介绍 regmap 缓存系统\n*   提供一个总结了之前所学概念的完整驱动程序\n\n# 使用 regmap API 进行编程\n\nregmap API\
  \ 非常简单。只有几个结构需要了解。该 API 中两个重要的结构是 `struct regmap_config`（它代表 regmap 的配置）和 `struct\
  \ regmap`（它是 regmap 实例本身）。所有的 regmap 数据结构都定义在 `include/linux/regmap.h` 中。\n\n# regmap_config\
  \ 结构\n\n`struct regmap_config` 存储了驱动程序整个生命周期内 regmap 的配置。你在这里设置的内容会影响读/写操作。它是 regmap\
  \ API 中最重要的结构。其源码如下：\n\n```\nstruct regmap_config { \n    const char *name; \n\n\
  \    int reg_bits; \n    int reg_stride; \n    int pad_bits; \n    int val_bits;\
  \ \n\n    bool (*writeable_reg)(struct device *dev, unsigned int reg); \n    bool\
  \ (*readable_reg)(struct device *dev, unsigned int reg); \n    bool (*volatile_reg)(struct\
  \ device *dev, unsigned int reg); \n    bool (*precious_reg)(struct device *dev,\
  \ unsigned int reg); \n    regmap_lock lock; \n    regmap_unlock unlock; \n    void\
  \ *lock_arg; \n\n    int (*reg_read)(void *context, unsigned int reg, \n       \
  \             unsigned int *val); \n    int (*reg_write)(void *context, unsigned\
  \ int reg, \n                    unsigned int val); \n\n    bool fast_io; \n\n \
  \   unsigned int max_register; \n    const struct regmap_access_table *wr_table;\
  \ \n    const struct regmap_access_table *rd_table; \n    const struct regmap_access_table\
  \ *volatile_table; \n    const struct regmap_access_table *precious_table; \n  \
  \  const struct regmap_default *reg_defaults; \n    unsigned int num_reg_defaults;\
  \ \n    enum regcache_type cache_type; \n    const void *reg_defaults_raw; \n  \
  \  unsigned int num_reg_defaults_raw; \n\n    u8 read_flag_mask; \n    u8 write_flag_mask;\
  \ \n\n    bool use_single_rw; \n    bool can_multi_write; \n\n    enum regmap_endian\
  \ reg_format_endian; \n    enum regmap_endian val_format_endian; \n    const struct\
  \ regmap_range_cfg *ranges; \n    unsigned int num_ranges; \n} \n```\n\n*   `reg_bits`\
  \ : 此必填字段表示寄存器地址的位宽。\n*   `val_bits` : 这表示用于存储寄存器值的位数。这是一个必填字段。\n*   `writeable_reg`\
  \ : 这是一个可选的回调函数。如果提供，当 regmap 子系统需要写入某个寄存器时会调用它。在写入寄存器之前，该函数会被自动调用，以检查该寄存器是否可写：\n\
  \n```\nstatic bool foo_writeable_register(struct device *dev, \n               \
  \                     unsigned int reg) \n{ \n    switch (reg) { \n    case 0x30\
  \ ... 0x38: \n    case 0x40 ... 0x45: \n    case 0x50 ... 0x57: \n    case 0x60\
  \ ... 0x6e: \n    case 0x70 ... 0x75: \n    case 0x80 ... 0x85: \n    case 0x90\
  \ ... 0x95: \n    case 0xa0 ... 0xa5: \n    case 0xb0 ... 0xb2: \n        return\
  \ true; \n    default: \n        return false; \n    } \n} \n```\n\n*   `readable_reg`\
  \ : 与 `writeable_reg` 相同，但适用于每次寄存器读操作。\n*   `volatile_reg` : 每当通过 regmap 缓存读写寄存器时调用的回调函数。如果寄存器是易变的（volatile），该函数应返回\
  \ true。随后会对寄存器进行直接读/写。如果返回 false，则意味着该寄存器是可以缓存的。在这种情况下，读操作将使用缓存，写操作将写入缓存：\n\n```\n\
  static bool foo_volatile_register(struct device *dev, \n                       \
  \             unsigned int reg) \n{ \n    switch (reg) { \n    case 0x24 ... 0x29:\
  \ \n    case 0xb6 ... 0xb8: \n        return true; \n    default: \n        return\
  \ false; \n    } \n} \n```\n\n*   `wr_table` : 写访问表。\n*   `rd_table` : 读访问表。\n*\
  \   `volatile_table` : 易变访问表。\n*   `precious_table` : 关键访问表。\n*   `reg_defaults`\
  \ : 寄存器默认值。\n*   `num_reg_defaults` : 默认寄存器数量。\n*   `cache_type` : 缓存类型。\n*   `reg_defaults_raw`\
  \ : 原始默认值。\n*   `num_reg_defaults_raw` : 原始默认值数量。\n*   `read_flag_mask` : 读标志掩码。\n\
  *   `write_flag_mask` : 写标志掩码。\n*   `use_single_rw` : 是否使用单次读/写。\n*   `can_multi_write`\
  \ : 是否支持多写。\n*   `reg_format_endian` : 寄存器端序格式。\n*   `val_format_endian` : 值端序格式。\n\
  *   `ranges` : 范围配置。\n*   `num_ranges` : 范围数量。\n\n# 使用 regmap API 进行编程\n\nregmap\
  \ API 非常简单。只有几个结构需要了解。该 API 中最重要的两个结构是 `struct regmap_config`（它代表 regmap 的配置）和 `struct\
  \ regmap`（它是 regmap 实例本身）。所有的 regmap 数据结构都定义在 `include/linux/regmap.h` 中。\n\n# regmap_config\
  \ 结构\n\n`struct regmap_config` 存储了驱动程序整个生命周期内 regmap 的配置。你在这里设置的内容会影响读/写操作。它是 regmap\
  \ API 中最重要的结构。其源码如下：\n\n```\nstruct regmap_config { \n    const char *name; \n\n\
  \    int reg_bits; \n    int reg_stride; \n    int pad_bits; \n    int val_bits;\
  \ \n\n    bool (*writeable_reg)(struct device *dev, unsigned int reg); \n    bool\
  \ (*readable_reg)(struct device *dev, unsigned int reg); \n    bool (*volatile_reg)(struct\
  \ device *dev, unsigned int reg); \n    bool (*precious_reg)(struct device *dev,\
  \ unsigned int reg); \n    regmap_lock lock; \n    regmap_unlock unlock; \n    void\
  \ *lock_arg; \n\n    int (*reg_read)(void *context, unsigned int reg, \n       \
  \             unsigned int *val); \n    int (*reg_write)(void *context, unsigned\
  \ int reg, \n                    unsigned int val); \n\n    bool fast_io; \n\n \
  \   unsigned int max_register; \n    const struct regmap_access_table *wr_table;\
  \ \n    const struct regmap_access_table *rd_table; \n    const struct regmap_access_table\
  \ *volatile_table; \n    const struct regmap_access_table *precious_table; \n  \
  \  const struct regmap_default *reg_defaults; \n    unsigned int num_reg_defaults;\
  \ \n    enum regcache_type cache_type; \n    const void *reg_defaults_raw; \n  \
  \  unsigned int num_reg_defaults_raw; \n\n    u8 read_flag_mask; \n    u8 write_flag_mask;\
  \ \n\n    bool use_single_rw; \n    bool can_multi_write; \n\n    enum regmap_endian\
  \ reg_format_endian; \n    enum regmap_endian val_format_endian; \n    const struct\
  \ regmap_range_cfg *ranges; \n    unsigned int num_ranges; \n} \n```\n\n*   `reg_bits`\
  \ : 此必填字段表示寄存器地址的位宽。\n*   `val_bits` : 这表示用于存储寄存器值的位数。这是一个必填字段。\n*   `writeable_reg`\
  \ : 这是一个可选的回调函数。如果提供，当 regmap 子系统需要写入某个寄存器时会调用它。在写入寄存器之前，该函数会被自动调用，以检查该寄存器是否可写：\n\
  \n```\nstatic bool foo_writeable_register(struct device *dev, \n               \
  \                     unsigned int reg) \n{ \n    switch (reg) { \n    case 0x30\
  \ ... 0x38: \n    case 0x40 ... 0x45: \n    case 0x50 ... 0x57: \n    case 0x60\
  \ ... 0x6e: \n    case 0x70 ... 0x75: \n    case 0x80 ... 0x85: \n    case 0x90\
  \ ... 0x95: \n    case 0xa0 ... 0xa5: \n    case 0xb0 ... 0xb2: \n        return\
  \ true; \n    default: \n        return false; \n    } \n} \n```\n\n*   `readable_reg`\
  \ : 与 `writeable_reg` 相同，但适用于每次寄存器读操作。\n*   `volatile_reg` : 每当通过 regmap 缓存读写寄存器时调用的回调函数。如果寄存器是易变的（volatile），该函数应返回\
  \ true。随后会对寄存器进行直接读/写。如果返回 false，则意味着该寄存器是可以缓存的。在这种情况下，读操作将使用缓存，写操作将写入缓存：\n\n```\n\
  static bool foo_volatile_register(struct device *dev, \n                       \
  \             unsigned int reg) \n{ \n    switch (reg) { \n    case 0x24 ... 0x29:\
  \ \n    case 0xb6 ... 0xb8: \n        return true; \n    default: \n        return\
  \ false; \n    } \n} \n```\n\n*   `wr_table` : 写访问表。\n*   `rd_table` : 读访问表。\n*\
  \   `volatile_table` : 易变访问表。\n*   `precious_table` : 关键访问表。\n*   `reg_defaults`\
  \ : 寄存器默认值。\n*   `num_reg_defaults` : 默认寄存器数量。\n*   `cache_type` : 缓存类型。\n*   `reg_defaults_raw`\
  \ : 原始默认值。\n*   `num_reg_defaults_raw` : 原始默认值数量。\n*   `read_flag_mask` : 读标志掩码。\n\
  *   `write_flag_mask` : 写标志掩码。\n*   `use_single_rw` : 是否使用单次读/写。\n*   `can_multi_write`\
  \ : 是否支持多写。\n*   `reg_format_endian` : 寄存器端序格式。\n*   `val_format_endian` : 值端序格式。\n\
  *   `ranges` : 范围配置。\n*   `num_ranges` : 范围数量。\n\n# regmap 初始化\n\n正如之前提到的，regmap\
  \ API 同时支持 SPI 和 I2C 协议。根据你的驱动程序支持的协议，你需要在 `probe` 函数中调用 `regmap_init_i2c()` 或 `regmap_init_sp()`。编写通用驱动程序，regmap\
  \ 是最佳选择。\n\nregmap API 是通用且统一的。只有初始化部分不同。其他函数都是相同的。\n\n良好的做法是在 `probe` 函数中初始化 regmap，并且在初始化\
  \ regmap 之前必须填充 `regmap_config` 元素。\n\n无论分配了 I2C 还是 SPI 寄存器，都使用 `regmap_exit` 函数进行释放：\n\
  \n```\nvoid regmap_exit(struct regmap *map) \n```\n\n该函数直接释放之前分配的寄存器映射。\n\n# SPI\
  \ 初始化\n\nregmap SPI 初始化包括设置 regmap，以便任何设备访问都能内部转换为 SPI 命令。执行此操作的函数是 `regmap_init_spi()`。\n\
  \n```\nstruct regmap * regmap_init_spi(struct spi_device *spi, \nconst struct regmap_config);\
  \ \n```\n\n它接受一个有效的 `struct spi_device` 结构指针作为参数（这是要交互的 SPI 设备），以及一个代表 regmap 配置的\
  \ `struct regmap_config`。该函数在成功时返回分配的 struct regmap 指针，在失败时返回一个 `ERR_PTR()` 值。\n\
  \n一个完整的示例如下：\n\n\n\n\n\n```\nstatic int foo_spi_probe(struct spi_device *client)\
  \ \n{ \n    int err; \n    struct regmap *my_regmap; \n    struct regmap_config\
  \ bmp085_regmap_config; \n\n        /* 在某处填充 bmp085_regmap_config */ \n        [...]\
  \ \n    client->bits_per_word = 8; \n\n    my_regmap = \n           regmap_init_spi(client,&bmp085_regmap_config);\
  \ \n\n    if (IS_ERR(my_regmap)) { \n        err = PTR_ERR(my_regmap); \n      \
  \  dev_err(&client->dev, \"Failed to init regmap: %d\\n\", err); \n        return\
  \ err; \n    } \n    [...] \n} \n```\n\n# I2C 初始化\n\n另一方面，I2C regmap 初始化通过对 regmap\
  \ 配置调用 `regmap_init_i2c()`，这会配置 regmap，使得任何设备访问在内部都会被转换为 I2C 命令：\n\n```\nstruct\
  \ regmap * regmap_init_i2c(struct i2c_client *i2c, \nconst struct regmap_config);\
  \ \n```\n\n该函数接受一个 `struct i2c_client` 结构作为参数（即用于交互的 I2C 设备），以及一个指向 `struct regmap_config`\
  \ 的指针，后者代表 regmap 的配置。该函数在成功时返回指向分配的 `struct regmap` 的指针，在失败时返回一个 `ERR_PTR()` 值。\n\
  \n一个完整的示例是：\n\n```\nstatic int bar_i2c_probe(struct i2c_client *i2c, \nconst struct\
  \ i2c_device_id *id) \n{ \n    struct my_struct * bar_struct; \n    struct regmap_config\
  \ regmap_cfg; \n\n        /* 在某处填充 regmap_cfgsome */ \n        [...] \n    bar_struct\
  \ = kzalloc(&i2c->dev, \nsizeof(*my_struct), GFP_KERNEL); \n    if (!bar_struct)\
  \ \n        return -ENOMEM; \n\n    i2c_set_clientdata(i2c, bar_struct); \n\n  \
  \  bar_struct->regmap = regmap_init_i2c(i2c, \n&regmap_config); \n    if (IS_ERR(bar_struct->regmap))\
  \ \n        return PTR_ERR(bar_struct->regmap); \n\n    bar_struct->dev = &i2c->dev;\
  \ \n    bar_struct->irq = i2c->irq; \n    [...] \n} \n```\n\n# 设备访问函数\n\n该 API 处理了的解析、格式化和传输。在大多数情况下，设备访问通过\
  \ `regmap_read`、`regmap_write` 和 `regmap_update_bits` 完成。在涉及到向设备存储或从中获取数据时，这是你应该始终记住的三个最重要的函数。它们的各自原型如下：\n\
  \n```\nint regmap_read(struct regmap *map, unsigned int reg, \n                \
  \ unsigned int *val); \nint regmap_write(struct regmap *map, unsigned int reg, \n\
  \                 unsigned int val); \nint regmap_update_bits(struct regmap *map,\
  \ unsigned int reg, \n                 unsigned int mask, unsigned int val); \n\
  ```\n\n*   `regmap_write` : 这会将数据写入设备。如果在 `regmap_config` 的 `max_register` 中设置了，它将被用于检查你需要读取的寄存器地址是大于还是小于。如果传递的寄存器地址小于或等于\
  \ `max_register`，则执行写入操作；否则，regmap 核心将返回无效的 I/O 错误（`-EIO`）。紧接着会调用 `writeable_reg`\
  \ 回调。该回调在继续下一步之前必须返回 `true`。如果它返回 `false`，则返回 `-EIO` 并停止写入操作。如果设置的是 `wr_table` 而不是\
  \ `writeable_reg`，则：\n\n    *   如果寄存器地址位于 `no_range` 中，返回 `-EIO`。\n    *   如果寄存器地址位于\
  \ `yes_range` 中，则执行下一步。\n    *   如果寄存器地址既不在 `yes_range` 不在 `no_range` 中，则返回 `-EIO`\
  \ 并终止操作。\n    *   如果 `cache_type != REGCACHE_NONE`，则启用缓存。在这种情况下，首先更新缓存条目，然后执行对硬件写入；否则，执行无缓存操作。\n\
  \    *   如果提供了 `reg_write` 回调，将将其用于执行写入操作；否则，将执行通用的 regmap 写入函数。\n\n*   `regmap_read`\
  \ : 这从设备读取数据。它的工作方式与 `regmap_write` 完全相同，使用了相应的数据结构（`readable_reg` 和 `rd_table`）。因此，如果提供了，`regmap_read`\
  \ 将执行读取操作；否则，将执行通用的 regmap 读取函数。\n\n# regmap_update_bits 函数\n\n`regmap_update_bits`\
  \ 是一个三合一的函数。它的原型如下：\n\n```\nint regmap_update_bits(struct regmap *map, unsigned\
  \ int reg, \n                 unsigned int mask, unsigned int val); \n```\n\n`regmap_update_bits`\
  \ 是一个读-修改-写入函数。它的原型如下：\n\n```\nint regmap_update_bits(struct regmap *map, unsigned\
  \ int reg, \n                 unsigned int mask, unsigned int val); \n```\n\n`regmap_bits`\
  \ 对寄存器执行读-修改-写入周期。它是 `regmap_update_bits` 的包装器，如下：\n\n```c\nstatic int regmap_update_bits(struct\
  \ regmap *map, unsigned int reg, \n                    unsigned int mask, \n   \
  \                 unsigned int val, bool *change) \n{ \n    int ret; \n    unsigned\
  \ int tmp, orig;\n\n    ret = regmap_read(map, reg, &orig); \n    if (ret < 0) \n\
  \        return ret;\n\n    tmp = orig & ~mask; \n    tmp |= val & mask;\n\n   \
  \ if (tmp != orig) { \n        ret = regmap_write(map, reg, tmp); \n        *change\
  \ = true; \n    } else { \n        *change = false; \n    }\n\n    return ret; \n\
  }\n```\n\n`regmap_update_bits` 是一个三合一的函数。它的原型如下：\n\n```\nint regmap_update_bits(struct\
  \ regmap *map, unsigned int reg, \n                 unsigned int mask, unsigned\
  \ int val); \n```\n\n`regmap_update_bits` 是一个读-修改-写入函数。它的原型如下：\n\n```\nint regmap_update_bits(struct\
  \ regmap *map, unsigned int reg, \n                 unsigned int mask, unsigned\
  \ int val);\n```\n\n`regmap_update_bits` 对寄存器执行读-修改-写入周期。它是 `regmap_update_bits`\
  \ 的包装器，如下：\n\n```c\nstatic int regmap_update_bits(struct regmap *map, unsigned int\
  \ reg, \n                    unsigned int mask, \n                    unsigned int\
