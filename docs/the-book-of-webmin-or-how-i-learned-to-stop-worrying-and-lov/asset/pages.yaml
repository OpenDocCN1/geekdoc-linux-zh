    in the BIND tutorials, you can send yourself an email at the new domain. Watch
    the mail log in the System Logs module for errors and to see if the message is
    delivered as expected. Next configure your mail client to send through your new
    mail server, to ensure it is working for sending mail, as well. The mail log will
    likely give clues about what is wrong in the event of problems.


    # Tutorial: Virtual Hosting Email with Postfix


    At this point, if you’ve performed the configuration in the previous tutorial,
    you’ll be able to accept mail for any number of domains. However, this is not
    the same as providing independent virtual hosting support with Postfix, because
    you can only have one user of a given name and mail sent to that username at any
    of the domains for which you accept mail will be delivered to that user. So, for
    example, if you hosted swelltech.com, penguinfeet.org, and nostarch.com on the
    same server, and mail was sent to user joe at each of those domains, all three
    mails would end up in the same mailbox. Therefore, you have to introduce another
    layer to solve this problem.


    Postfix has two commonly used methods for solving this problem. The first is the
    native Postfix method, using a virtual table to direct mail to the correct destination.
    The second method is modeled after the way Sendmail handles the problem, and is
    therefore a lot more complex. Because simplicity is better than complexity, you’ll
    learn the native Postfix mechanism exclusively. The Postfix virtual man page covers
    both methods in moderate detail. If you have an older Sendmail installation that
    is being converted to Postfix you may wish to use the second method and maintain
    your current virtual mail configuration. If you will be running an extremely large
    number of virtual domains, it is likely preferable to use the second method, as
    well.


    The first step for setting up virtual domain delivery is for you to create a virtual
    map table using the Virtual Domains page (Figure 10-7). Enter the map type (hash,
    dbm, and so on), followed by the filename of the flat file that will contain the
    table information. For example, you could use /etc/postfix/virtual for this purpose.
    This is a pretty common location for this file.


    ![](img/d84604054810a13cacfdac212ebee2f7_218_0.png)


    Figure 10-7: The Virtual Domains table


    Save and apply the change, and return to the Virtual Domains page. Now, you can
    click the New mapping button. You first have to create a generic map for the new
    domain. So, for the Name field, enter your virtual domain name. In the'
  merge: -1
  img_proc: true
- pgno: 219
  md: '**Maps to** field, you can technically enter anything you like (as long as
    we enter something). The custom seems to be to enter virtual in this field, as
    that is its purpose. Click **Save mapping** to add it to the virtual table.


    Next, you’ll want to add a postmaster alias, as all mail servers must have a functioning
    postmaster address to be compliant with the relevant RFC. So, click **New mapping**
    again. This time enter postmaster@virtual.domain into the **Name** field, where
    virtual.domain is the name of your domain. Then enter postmaster into the **Maps
    to** field so that mail to this address will be mapped to the local postmaster
    address for normal delivery.


    Finally, you’re ready to start adding your virtual domain users to the table.
    Once again, create a new mapping. Fill in your new virtual domain mail address
    in the **Name** field. For example, you might fill in joe@virtual.domain. In the
    **Maps to** section, enter the name of a local user that you would like to receive
    mail for this address. In this case, you would use virtual-joe or perhaps virtual.domain.joe.
    This new local user must exist for mail to be delivered; therefore you’ll need
    to add the new user to the system.


    Now, **Save and Apply** your changes, and test it out! The virtual maps can be
    handled by various database types or exported to an LDAP database. There is no
    reasonable limit to the number of virtual users and domains you can have.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 11


    # SENDMAIL


    ![](img/d84604054810a13cacfdac212ebee2f7_220_0.png)


    Sendmail is the de facto standard mail transfer agent, or MTA, in use on the Internet
    today. While there are now several worthy contenders for the title of best or
    most popular MTA, including Postfix and QMail (both of which have very good Webmin
    modules, and Postfix is documented in the preceding chapter), more mail probably
    passes through Sendmail than any other single MTA.


    An MTA is the software that provides mail services for a network. A client mail
    user agent, or MUA, sends email, usually via the Simple Mail Transport Protocol,
    or SMTP, to the MTA. The MTA uses one of several transport protocols, most often
    via SMTP, to deliver it either directly to the recipient (if the address is served
    by the same server) or to the mail server for the user. Clients then access the
    mail on the server using either POP3 or IMAP. So, Sendmail will operate on your
    server and provide those intermediary services, both sending and receiving mail,
    for clients and other MTAs on the Internet.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Configuring Sendmail


    Sendmail has a reputation, not entirely undeserved, for being extremely obtuse
    and confusing to configure. The famously terse sendmail.cf file was designed to
    be easy and quick for the computer to parse, not for humans to be able to read
    and edit. Relatively recently, attempts have been made to remedy this problem,
    and the solution now provided with Sendmail is an "m4" macro-based configuration
    file, called sendmail.mc by default, that allows you to use much more human comprehensible
    configuration constructs. This configuration file is also supported by Webmin
    in the Sendmail M4 Configuration page.


    Sendmail also uses a few other configuration files to dictate certain other behaviors.
    These include aliases, mailertable, access, and domaintable. These files are quite
    readable by mere mortal humans, usually containing a few (or more than a few in
    large networks) names, hosts, or domains, and an option or permission that applies
    to the name, host, or domain. Webmin provides a nice interface for these files
    as well, so you won’t have to deal with them directly. However, it is good to
    know about them and what they’re used for. You’ll learn about them in more detail
    as the relevant Webmin sections are discussed.


    # The Sendmail Module


    The Sendmail module in Webmin is thoroughly comprehensive, and it provides a one-to-one
    access to nearly all, if not all, of Sendmail’s important options and features.
    Opening the main Sendmail module page provides you with a number of icons that
    represent each type of option in the Sendmail configuration files (Figure 11-1).
    From here, you can edit the various global options, edit aliases, configure user
    mail settings, restrict access to your mail server, and even control the mail
    queue and read mail.


    ![](img/d84604054810a13cacfdac212ebee2f7_221_0.png)


    Figure 11-1: Sendmail module'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Sendmail is configured in a number of files. The first, and most intimidating,
    is the sendmail.cf file. This configures all of the various limits and behaviors
    of Sendmail. The rest are related to users, hosts, domains, and aliases. They
    dictate primarily to whom mail is sent, and who and what hosts or networks have
    permission to send and receive mail from the server. The sendmail.cf file is configured
    on the Options page, discussed in the next section, while each of the other option
    files have their own page which are discussed in the Other Files section.


    # Options


    The Sendmail Options page provides access to most of the relevant sendmail.cf
    directives. These options are usually “set and forget”-type options. Unless you
    have a problem with load, or memory, or untimely failed message delivery, you
    will have little reason to alter these options after first setting up your Sendmail
    system.


    # Send outgoing mail via host


    This option sets whether outgoing mail will be sent directly or via another mail
    server. If it is to go through another mail server, it is entered here. If you
    are not on a permanently attached network (i.e., with a permanent IP and a domain
    name), then you should relay through the mail server at your ISP, as many mail
    servers refuse mail from hosts that cannot be resolved. This option edits the
    Smart Host macro named S in sendmail.cf. More on this and other common macros
    can be found in the macros sections of the Administrative Details [http://www.sendmail.org/m4/admin.html]
    documentation page at the Sendmail home page.


    # Forward unqualified usernames to host


    If an email is sent by a local user that is unqualified (i.e., joe instead of
    joe@swelltech.com) it will by default attempt to deliver the mail locally (i.e.,
    on the same machine that Sendmail runs on). However, if this is set, mail will
    be forwarded to the host selected. This is useful if you have a large organization
    with many Sendmail servers running, but you’d like all local mail to be delivered
    to a single host. This option edits the R macro, which refers to the Relay (for
    unqualified domains) configuration.


    # Forward mail for local users to host


    Email that is received from anywhere that is destined for a user on the local
    host will be delivered locally, unless this option is set. This allows all mail
    to be collected on a single host. This option edits the R macro, which refers
    to the Relay (for unqualified domains) configuration.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Delivery mode


    This option controls how messages will be scheduled for delivery. If Background
    is selected, Sendmail will deliver messages as soon as possible silently in the
    background. Queue only places mail into a queue to be delivered upon a manual
    or periodically scheduled flush of the queue. Interactive messages are delivered
    immediately synchronously. Deferred is like Queue only, except Sendmail will not
    attempt to resolve host names until the queue is flushed (ideal for a sporadic
    net connections, such as a dial-up). This option configures the DeliveryMode directive.


    # Max load average for sending


    This option determines at what load average Sendmail will no longer continue to
    send messages. If this load average is crossed, Sendmail will queue messages for
    later delivery. This option configures the QueueLA directive and defaults to 8.
    If your system is becoming overloaded at times with delivering mail, it may be
    possible to tune this setting to help ease the load.


    # Max load average for receiving


    This option determines at what load average Sendmail will stop accepting incoming
    messages via SMTP. This forces other mail servers to queue them for later delivery.
    While most mail servers will be polite and actually save the refused messages
    for later delivery, if assurance of mail service is important to your users, it
    is probably best to avoid refusing mail. This option configures the RefuseLA option
    and defaults to 12.


    # Max child processes


    Controls how many child processes Sendmail will spawn in order to handle incoming
    mail. Limiting this allows you to control, somewhat, the memory footprint of Sendmail.
    This option configures the MaxDaemonChildren directive and defaults to 12.


    # Max connections/second


    Configures the maximum number of new connections per second that Sendmail will
    accept. With this option, you may limit the CPU and memory usage of Sendmail on
    your system, or in high load environments allow Sendmail to receive a larger volume
    of mail. This option configures the ConnectionRateThrottle directive and defaults
    to 3.


    # Min time before retrying send


    This sets the minimum amount of time mail will wait in the queue after a failed
    send attempt, before Sendmail attempts to re-send it. Values can be in seconds
    (e.g., 45s), minutes (30m), hours (2h), days (3d), or weeks (1w). This correlates
    to the MinQueueAge directive and defaults to 30m.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Maximum queue size


    Determines the maximum number of queued jobs Sendmail will process in a single
    queue run. This correlates to the MaxQueueRunSize directive and defaults to 1000.
    This should remain as high as possible to avoid losing jobs that fall late in
    the queue.


    # Time before giving up


    This is the amount of time that Sendmail will continue to try resending a failed
    message before giving up and considering it undeliverable. Non-permanent delivery
    failures can occur for a number of reasons, including network connectivity problems,
    DNS resolution failure, the recipient server not responding, and so on. When this
    limit is reached, a bounced message will be sent to the sender, and the message
    will be discarded. This option accepts times in the same format as discussed above,
    for seconds, minutes, hours, days, and weeks. This configures the Timeout.queue
    return directive and defaults to 5d.


    # Time before sending warning


    In the event of a non-permanent delivery failure, as discussed in the previous
    option, this option configures how long Sendmail will wait before sending a warning
    to the sender of the message that a problem has occurred. Because these warnings
    usually resolve themselves shortly (either the network comes back up, DNS resolves
    again, the recipient server returns to service, and so on) it is often not necessary
    to trouble the sender with an error message until it begins to appear that a problem
    might become a permanent failure. This option configures the Timeout.queuewarn
    directive and defaults to 4h.


    # Mail queue directory


    This sets the location of your mail queue directory where Sendmail stores queued
    mail. This option correlates to the QueueDirectory, and often defaults to /var/spool/mail,
    though on some systems this may differ. There is rarely reason to change this.


    # Send error messages to


    In the event of a problem, such as a delivery failure, error messages will be
    sent to some user on the system. This is usually Postmaster, which on many systems
    is aliased to root. This option correlates to the PostMasterCopy directive.


    # User forward files


    This option dictates where Sendmail will search for forwarding information for
    users. This is a colon-separated list (much like the shell PATH environment variable).
    This option allows you to use variables to include certain values, such as username
    ($u), user''s home directory ($z), and system host name ($w). So, for example,
    if I wanted to search first for /var/forward/username and then in /home/joe/.forward,
    I could enter /var/forward/$u:$z/.forward. This option configures the ForwardPath
    directive and usually defaults to $z/.forward:$u:$z/.forward.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Min free disk space


    If the amount of free disk space is lower than this value, Sendmail will refuse
    to accept messages from other systems. Allows one to prevent Sendmail from filling
    the disk on which the queue resides. This option correlates to the MinFreeBlocks
    directive and often defaults to 100.


    # Max message size


    This option sets the maximum size of a message that will be accepted by Sendmail.
    Any message over this size, either received from a local user or a remote mail
    server, will be bounced. This option configures the MaxMessageSize directive and
    defaults to 1000000.


    # Log level


    This option sets the logging behavior of Sendmail. Logging levels 0-10 are, by
    convention, used for useful information that is probably worth logging on any
    system. The default logging level is 9 and is a good middle ground, wherein Sendmail
    usually only logs things that an administrator would want to be aware of. Higher
    log levels between 10 and 64 will provide much more information, while levels
    over 64 are reserved for extremely verbose debugging output. The normal log levels
    are documented in the The System Log [http://www.sendmail.org/~ca/email/doc8.10/op-sh-2.html#sh-2.1]
    section of the Installation and Operation Guide [http://www.sendmail.org/~ca/email/doc8.10/op.html].
    This option configures the LogLevel directive.


    # MIME-encode bounce messages?


    This option configures whether Sendmail will encode bounce messages in multi-part
    MIME format or as a plain-text message. Most mail clients today support MIME encoded
    messages, but if your client base has problems with this you may turn it off.
    This correlates to the SendMimeErrors directive and defaults to True. More on
    MIME can be found in RFC 2045 [http://www.ietf.org/rfc/rfc2045.txt?number=2045]
    and RFC 1344 [http://www.ietf.org/rfc/rfc1344.txt?number=1344].


    # File security options


    In order to avoid cracking attempts, Sendmail checks most of its support files.
    If these files are in group writable directories, or some other risky configuration,
    Sendmail will ordinarily refuse to run. This option allows you to turn off this
    checking in the ways described by the options available. This option configures
    the DontBlameSendmail directive and defaults to Safe. For obvious reasons, it
    is strongly suggested that you solve the permissions problem(s) you may have,
    rather than turning off any of these checks.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Other Support Files


    The other side of configuring Sendmail is setting up how it will deliver mail
    and who it will allow to use its services. The rest of the Sendmail module is
    devoted to these options, and you are likely to spend more time on these pages
    than on the Options page. These pages configure all of the other files that Sendmail
    relies on to tell it how to do its job, including the aliases, access, domain
    table, mailertable, relay-domains, and virtusertable files.


    # Mail Aliases


    Sendmail provides a means to direct mail to a given recipient under an alias.
    For example, it is possible to have mail sent to Postmaster delivered to root.
    It is also possible to direct mail, to several addresses, into a file, to feed
    it to a program, or provide an automatic reply. These aliases are stored in a
    file called aliases that is usually located in /etc.


    # Address


    This is simply the address that will be the alias. When mail is sent to this address,
    the action defined in Alias to option below will be performed. The alias does
    not contain the domain name. For example, joesalias instead of joesalias@swelltech.com.


    # Enabled


    Here you may mark an alias as enabled or disabled. A disabled address will be
    preceded by a # in the aliases and will appear in italics in the list of aliases
    in the Webmin display.


    # Alias to


    Here you define what Sendmail does when it receives a message for this aliased
    address. There are several options for this, and they are selected from the drop-down
    list. Email address is simply another email address to deliver the mail to. Addresses
    in a file causes the mail to be sent to every address named in the file provided
    in the text entry field — this allows you to more easily allow users to create
    their own aliases without giving them access to the /etc/aliases file. Write to
    file will cause Sendmail to write every mail sent to the address to a file chosen
    in the text entry field. Feed to program is interesting, in that it allows you
    to direct mail to any program on your system, thus you could write a script or
    a program (or find one already written) to provide any number of services based
    on the email received. Or it could file your mail in a database, or customer service
    system, or any number of other useful things. Finally, Autoreply from file simply
    sends a mail automatically back to the sender containing whatever is in the file
    listed in the text field.


    The rest of the page is devoted to a listing of existing aliases. As mentioned
    above, enabled entries are in plain text, while disabled entries are in italics.
    Clicking an alias allows you to edit, delete, or add destinations to an alias.
    Clicking Manually edit /etc/aliased provides a simple text editor field wherein
    you'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'can manually edit or view your aliases file. Be careful, as the format and
    entries will not be checked by Webmin for correctness. If you make a mistake your
    Sendmail may complain loudly (in the logs) and stop working.


    # Local Domains


    This page configures the sendmail.cf file and allows you to choose what domains
    Sendmail will accept local mail delivery for. By default Sendmail only accepts
    delivery for the local host. In order to accept mail for a whole domain, or a
    number of domains, they must be listed here. Also, the domains must have a DNS
    MX record that points to the server where your Sendmail is running. Sendmail can
    handle mail for any number of domains; however, setting up virtual hosting with
    Sendmail is a little tricky. A good document that describes the technique can
    be found on the Virtual Hosting With Sendmail [http://www.sendmail.org/virtual-hosting.html]
    page. Virtual hosting is also discussed briefly in the tutorial section of this
    chapter.


    > NOTE

    > For virtual hosting in Sendmail, you will also need to perform some configuration
    in Address Mapping and possibly in Outgoing Addresses (generics).


    # Domain Masquerading


    The Domain Masquerading page provides access to the domain masquerading features
    of Sendmail. This allows you to make all outgoing messages appear to be from the
    same domain. When a domain masquerading rule is in place, Sendmail will replace
    the From address of all outgoing mail to appear to come from the domain to be
    masqueraded as. Also see the Local Domains page for more as well as a helpful
    link regarding virtual hosting in Sendmail.


    # Trusted Users


    Ordinarily, Sendmail will not allow a user to claim to be a different user. However,
    if listed here, users will be trusted to claim they are another user or from another
    domain. Care should be taken when using this option, as it is one of the safeguards
    against spoofed email addresses.


    # Address Mapping


    An Address mapping is similar to an alias, except they are able to handle domain
    information, as needed by virtual domains. To create an address mapping, all you
    must do is enter the address or domain to act upon. And a send to action to perform
    on each message as it is received by Sendmail. For example, if I host the domain
    penguinfeet.org on my swelltech.com server, then I must set up a method for mail
    sent to sysadmin@penguinfeet.org to make it into my mailbox at joe. So, I would
    create a map wherein the Mail for address is sysadmin@penguinfeet.org and the
    Send to address is joe.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Domain Routing


    This option provides a special type of gateway in which your server accepts mail
    for a domain or host, but then passes it on to another specific mail server. This
    can be of use in environments where one or more subdomains have their own mail
    server that is behind a firewall and cannot directly deliver or receive mail on
    its own. Also, this allows Sendmail to provide gateway/proxy/translation services,
    if the other mail server does not support common transports and protocols. This
    use is in decline, as the vast majority of mail servers (even the few not running
    Sendmail) now speak the common protocols. These domains should not be listed in
    Local Domains, as then the server would accept the mail for local delivery, which
    is not what is desired in this case. You should still have a DNS MX record that
    points to the Sendmail server for each of the domains listed here, so that mail
    will be sent first to this system, where it then will handle it in whatever way
    is defined.


    # Mail for


    This field allows you to enter a host or domain for which Sendmail will accept
    mail. It will not deliver the mail locally, but will instead pass it on to another
    server.


    # Delivery


    Here you select how Sendmail will deliver the mail for the selected domain. The
    most common method is SMTP; however, Sendmail supports a wide range of delivery
    methods.


    # Send to


    This should be the mail server where mail for this domain should be forwarded
    to. Checking the Ignore MX for SMTP delivery box will cause Sendmail to ignore
    MX entries in the DNS server for the domain and send to an explicitly selected
    server.


    # Outgoing Addresses (Generics)


    Here you define mappings that Sendmail will use to modify the From addresses of
    outgoing mail (either from local users or from other hosts for delivery to other
    servers). This can be useful if you host multiple domains on the same mail server
    and want mail from some users to be addressed as though coming from those other
    domains. You must also include any domains to be remapped on the Outgoing Domains
    page, before Sendmail will perform any remappings on an address. Also, this mapping
    will not affect mail delivered to local users unless your .cf file contains support
    for FEATURE(`always_add_domain'').


    > NOTE This option is not enabled by default in most Linux distributions and other
    operating systems, nor in a default Sendmail installation. You must add the genericstable
    feature to your sendmail.mc file and regenerate the .cf file. The procedure for
    regenerating a .cf is documented later in this guide.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Mail from


    Here you enter a username or full email address for a user to remap.


    # Change to


    Here you enter the address to change the above address into.


    # Manually edit /etc/mail/genericstable


    Clicking this provides a simple text entry field, where all genericstable mappings
    are listed. You may edit them manually here. Take care, however, as manually edited
    entries are not checked by Webmin for grammatical correctness.


    # Outgoing Domains


    By default Sendmail only performs Outgoing Address translations on mail from local
    users (users in the same domain as the Sendmail server). Any outside domains to
    be remapped must be entered here.


    # Domain Mapping


    This feature allows you to remap all To and From addresses for a domain to another
    domain. This is useful if, for example, your company changes names and you''d
    like all mail to be changed from mailuser@oldname.com to mailuser@newname.com.
    This change will affect all mail that is delivered to, relayed through, or sent
    out from your server. Use of this should be limited to your domains.


    # Spam Control


    On this page, you may configure any number of rules, with the purpose of preventing
    spammers from using your system and network resources for their evil purposes.
    Though this is just the tip of the iceberg for the spam control features provided
    by recent Sendmail versions, it does provide you with a very good means of preventing
    spam on your network. The first and primary goal is to prevent anyone from outside
    of your network from using your server as a relay for spam. Luckily, in recent
    versions of Sendmail, the default is to refuse to relay from any host not on your
    local network. This makes your job a little easier, because all you must do is
    allow mail relaying from your trusted hosts and domains. Here also, you can add
    rules to explicitly disallow mail from some known spammers. For example, if your
    users began receiving large batches of unsolicited commercial email (UCE, affectionately
    known as spam) from the bigdumbspammers.com (not a real domain at the time of
    this writing) and the administrators of this domain either don''t care or are
    active participants in the spamming, you could simply block them from sending
    mail to any of our clients. You would enter the domain name and select Reject
    or provide an error message by using the Error code.


    For more on spam control topics in Sendmail, the Allowing controlled SMTP relaying
    in Sendmail [http://www.sendmail.org/tips/relaying.html] page provides more documentation
    for several of the new Sendmail features to prevent spam, such as using The Realtime
    Blackhole List [http://mail-abuse.org/rbl/], which'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'provides a blacklist of known spammers and open relays. Also, it may be worthwhile
    to visit The Mail Abuse Prevention System [http://mail-abuse.org/] for more on
    ways to fight spam.


    # Relay Domains


    Any local domains that you would like to allow relaying to should be listed here.
    Any incoming mail that is not for a local user and not for one of these listed
    domains will be rejected by Sendmail. If your Sendmail is providing mail service
    for several domains in a virtual hosting fashion, those domains should be listed
    here also.


    # Mail Queue


    This page provides access to the mail queue. Depending on your configuration,
    your queue may be a fleeting thing, or it may fill until it is flushed periodically
    or manually. Usually, if you have full-time Net access and a full-time DNS server,
    you will use the background mode of delivering mail. In this case, mail will only
    be in the queue for a few seconds or minutes before being sent out to the recipient
    servers. However, in the event of a transient delivery failure (a non-permanent
    error), the message will remain in the queue until the message is discarded (due
    to permanent error) or successfully sent. Any message in the queue may be viewed
    by clicking the message ID. Also, messages may be deleted from the queue. Finally,
    it is possible to manually flush the queue, and Sendmail will attempt to deliver
    all messages in the queue immediately.


    # User Mailboxes


    A great feature of the Webmin Sendmail module is the ability to read mail via
    a Web interface. While not a full-featured mail client (even as web-based clients
    go), it is a quick and easy way to check messages for accounts that ordinarily
    do not get checked by a user. For example, on my system, I receive daily backup
    reports from my backup system, so I check them periodically via the Webmin interface
    just to look out for problems.


    To check mail for root simply click the name. From there you''ll be presented
    with a list of all of that user''s emails. Clicking the message will display it.
    From the User Email page it is also possible to delete messages and to compose
    a new message (Figure 11-2).


    # Editing the m4 Configuration File


    Sendmail on your system probably has a pretty good feature set included in the
    default sendmail.cf. But as has been discussed, some features are often left out,
    such as genericstable. Usually, these features are not needed, but if they are,
    you must add them to your configuration file. Manually editing the sendmail.cf
    is generally regarded as not being an option for mere mortals like you and I (Eric
    Allman, the creator of Sendmail, might be able to do it). However, recent versions
    of Sendmail provide a novel method of adding features to the sendmail.cf, which
    uses a macro file named sendmail.mc and the m4 macro processor.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '![](img/d84604054810a13cacfdac212ebee2f7_231_0.png)


    Figure 11-2: User Email


    # Adding a Feature


    Unlike directly editing the .cf, adding a feature using the m4 macro file is actually
    pretty easy.


    After opening the M4 Configuration page, you''ll see a file that looks something
    like the page shown in Figure 11-3.


    Each line, with the exception of thednl comment lines and the divert(-1) line,
    are of the form macro-type(value list). In this example, you''re going to add
    a new feature called genericstable. So you''ll insert a line like this into the
    FEATURE list:


    ```

    FEATURE(`genericstable'', `hash -o /etc/mail/genericstable'')

    ```


    ![](img/d84604054810a13cacfdac212ebee2f7_231_1.png)


    Figure 11-3: M4 configuration file'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'To do this, select Feature from the drop-down list at the bottom of the page,
    and click the Add new entry of type button. Then, select genericstable (Outgoing
    Addresses). Next in the parameters field you specify the type and location of
    the table file, hash -o /etc/mail/genericstable. The single quote marks are not
    required, as Webmin will insert them for you. For later convenience it is probably
    wise to use the arrow buttons on the right of the page to raise the new entry
    to be just below the other FEATURE lines in your file. It isn’t strictly necessary,
    but it is nice to have neat configuration files, even if Webmin hides them from
    you most of the time.


    After saving the changed file, you will generate the new sendmail.cf (don’t forget
    to back up the old one to another file if you’ve already set up Sendmail). To
    create a new sendmail.cf based on your .mc file, click the Rebuild Sendmail Configuration
    button. You’ll then be able to open the Outgoing Domains page, and create the
    new genericstable file and edit it normally. A restart of Sendmail will be required
    to apply the changes you’ve made.


    # Tutorial: Setting Up Sendmail


    When first installed Sendmail will only need a few small changes in order to begin
    providing service for sending and receiving mail. The first step is to specify
    for whom mail will be accepted, which you will specify in the Local Domains page,
    while the second step will be to permit local network users to send, or relay,
    email through the server, which will be specified in the Spam Control page.


    NOTE This tutorial assumes you have already configured DNS service for your network,
    including an MX record for your domain. If you haven’t already done so, refer
    back to the BIND chapter, and configure name resolution before attempting the
    steps in this tutorial.


    # Configuring Domains to Receive Mail For


    By default, Sendmail is not configured to receive mail for any host or network
    other than the machine on which it is running. So you must first configure Sendmail
    to permit anyone to send mail for delivery to your domain through your server.
    Open the Local Domains page, and enter the domains for which your server will
    accept mail. In my case, I would enter swelltech.com. Any number of domains can
    be entered here, as can host names, so I could also enter www.swelltech.com if
    ever I expected mail to be delivered to that address.


    Click the Save button to update the sendmail.cf file. This will add new Cw lines
    to include your specified domains.


    # Permitting Local Users to Relay


    The next step to achieving a simple mail server is to permit your local users
    to send mail through your server. Click the Spam Control icon, and create one
    or more rules matching your local networks. To create a new rule, first select
    a Mail source of Network, and specify the IP of the network you’d like to relay
    for. For example, on a local network using private IP addresses, one might enter
    192.168.1 to specify all of the hosts in the 192.168.1.0/24 network. Then, select
    Allow relaying, and click Create to add the new rule to the access file.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Finally, return to the primary Sendmail page, and click the Start Sendmail
    button. It is usually useful to keep an eye on the logs when starting a daemon
    so that problems will be immediately obvious. Sendmail logs to the mail log on
    most systems, which is likely located in /var/log directory. You can use the Webmin
    System Logs module to view this log.


    # Tutorial: Virtual Hosting Email with Sendmail


    Virtual hosting is a rather broad term applied to many network services to specify
    that the server in question provides service to two or more network domains with
    some degree of separation. Specifically, in the case of a mail server, it means
    that the mail server will deliver to a unique local user based on the username
    and the domain in the to field of the received email. For example, an email sent
    to joe@swelltech.com would be treated differently from an email sent to joe@notswelltech.com
    and would be delivered to a different mailbox.


    As with most Open Source software there are many ways to accomplish our goal,
    but here you’ll learn the simplest method provided by Sendmail. Configuring Sendmail
    for virtual mail hosting is a three-step process. First, DNS must be appropriately
    configured for each domain being served including an MX record, as documented
    in the BIND chapter of this book. Second, the new domain is added to the Local
    Domains table. Finally, one or more entries are added to the Address Mapping table.
    As DNS has its own chapter, and adding an entry to the Local Domains table was
    covered in the preceding tutorial, you’ll only learn the final step here.


    # Adding Address Mapping Entries


    Click on the Address Mapping icon, and create new mappings as appropriate for
    your environment. To create a new entry, select Address and fill in the address
    on which mail will be received in the Mail for field. This will include the name
    and domain name of the recipient, so for example, I might enter joe@virtualhost.com
    in this field. Next, select the Address option and enter the destination mailbox
    for this user in the, which needs to be an existing user, into the Send to field.
    For example, I might enter a username of virtualhost-joe here. The username must
    be created on the system, as well, which can be done using the section called
    "Users and Groups" in Chapter 5.


    Click the Create button, and test your work by sending mail to your newly created
    virtual user.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# 12


    # SQUID


    ![](img/d84604054810a13cacfdac212ebee2f7_234_0.png)


    Squid is a feature-rich and extremely flexible web-caching proxy daemon. Most
    configuration is performed by editing a simple configuration file called squid.conf,
    which is usually located in /usr/local/squid/etc/squid.conf or, on systems derived
    from Red Hat Linux, /etc/squid/squid.conf. Each behavior is set by a directive
    followed by one or more options. The Webmin interface provides access to most
    of the directives available for configuring Squid. Because Squid is a quite complex
    package, the Webmin interface opens with a series of icons to represent the different
    types of configuration options. Figure 12-1 shows the Squid main page.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/d84604054810a13cacfdac212ebee2f7_235_0.png)


    # Figure 12-1: Squid proxy main page


    These options are pretty self-explanatory, though a couple of them are worth discussing.
    The Cache Manager Statistics icon, when clicked, will open the Squid cachemgr.cgi
    program to provide direct access to all of Squid’s various runtime values and
    statistics. The program provides real-time information about hit ratios, request
    rates, storage capacity, number of users, system load, and more.


    The Calamaris Log Analysis icon is only present if the calamaris access.log analyzer
    is present on your system. Calamaris is a nice Perl script that will parse your
    access log files and provide a nice overview of the type of usage your cache is
    seeing. Note that by default the Calamaris Webmin tool will only parse the last
    50,000 lines of your access log. This number can be raised in the Squid module
    configuration, but is not recommended on heavily loaded caches. The parsing of
    the access logs is a very system-intensive task that could interfere with your
    system’s ability to continue answering requests.


    # Ports and Networking


    The Ports and Networking page provides you with the ability to configure most
    of the network level options of Squid. Squid has a number of options to define
    what ports Squid operates on, what IP addresses it uses for client traffic and
    intercach traffic, and multicast options. Usually, on dedicated caching systems
    these options will not be useful. But in some cases you may need to adjust these
    to prevent the Squid daemon from interfering with other services on the system
    or on your network.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Proxy port


    Sets the network port on which Squid operates. This option is usually 3128 by
    default and can almost always be left on this address, except when multiple Squids
    are running on the same system, which is usually ill-advised. This option corresponds
    to the http_port option in squid.conf.


    # ICP port


    This is the port on which Squid listens for Internet Cache Protocol, or ICP, messages.
    ICP is a protocol used by web caches to communicate and share data. Using ICP
    it is possible for multiple web caches to share cached entries so that if any
    one local cache has an object, the distant origin server will not have to be queried
    for the object. Further, cache hierarchies can be constructed of multiple caches
    at multiple privately interconnected sites to provide improved hit rates and higher-quality
    web response for all sites. More on this in later sections. This option correlates
    to the icp_port directive.


    # Incoming TCP address


    The address on which Squid opens an HTTP socket that listens for client connections
    and connections from other caches. By default Squid does not bind to any particular
    address and will answer on any address that is active on the system. This option
    is not usually used, but can provide some additional level of security if you
    wish to disallow any outside network users from proxying through your web cache.
    This option correlates to the tcp_incoming_address directive.


    # Outgoing TCP address


    Defines the address on which Squid sends out packets via HTTP to clients and other
    caches. Again, this option is rarely used. It refers to the tcp_outgoing_address
    directive.


    # Incoming UDP address


    Sets the address on which Squid will listen for ICP packets from other web caches.
    This option allows you to restrict which subnets will be allowed to connect to
    your cache on a multi-homed, or containing multiple subnets, Squid host. This
    option correlates to the udp_incoming_address directive.


    # Outgoing UDP address


    The address on which Squid will send out ICP packets to other web caches. This
    option correlates to the udp_outgoing_address.


    # Multicast groups


    The multicast groups that Squid will join to receive multicast ICP requests. This
    option should be used with great care, as it is used to configure your Squid to
    listen for multicast ICP queries. Clearly if your server is not on the MBone,
    this'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'option is useless. And even if it is, this may not be an ideal choice. Refer
    to the Squid FAQ [http://www.squid-cache.org/Doc/FAQ/FAQ-13.html] on this subject
    for a more complete discussion. This option refers to the mcast_groups directive.


    # TCP receive buffer


    The size of the buffer used for TCP packets being received. By default Squid uses
    whatever the default buffer size for your operating system is. This should probably
    not be changed unless you know what you''re doing, and there is little to be gained
    by changing it in most cases. This correlates to the tcp_recv_bufsize directive.


    # Other Caches


    The Other Caches page provides an interface to one of Squid''s most interesting,
    but also widely misunderstood, features. Squid is the reference implementation
    of ICP, a simple but effective means for multiple caches to communicate with each
    other regarding the content that is available on each. This opens the door for
    many interesting possibilities when one is designing a caching infrastructure.


    # Internet Cache Protocol


    It is probably useful to discuss how ICP works and some common usages for ICP
    within Squid, in order to quickly make it clear what it is good for, and perhaps
    even more importantly, what it is not good for. The most popular uses for ICP
    are discussed, and more good ideas will probably arise in the future as the Internet
    becomes even more global in scope and the web-caching infrastructure must grow
    with it.


    # Parent and Sibling Relationships


    The ICP protocol specifies that a web cache can act as either a parent or a sibling.
    A parent cache is simply an ICP capable cache that will answer both hits and misses
    for child caches, while a sibling will only answer hits for other siblings. This
    subtle distinction means simply that a parent cache can proxy for caches that
    have no direct route to the Internet. A sibling cache, on the other hand, cannot
    be relied upon to answer all requests, and your cache must have another method
    to retrieve requests that cannot come from the sibling. This usually means that
    in sibling relationships, your cache will also have a direct connection to the
    Internet or a parent proxy that can retrieve misses from the origin servers. ICP
    is a somewhat chatty protocol, in that an ICP request will be sent to every neighbor
    cache each time a cache miss occurs. By default, whichever cache replies with
    an ICP hit first will be the cache used to request the object.


    # When to Use ICP


    ICP is often used in situations wherein one has multiple Internet connections,
    or several types of paths to Internet content. Other possibilities include having
    a cache mesh such as the IRCache Hierarchy [http://www.ircache.net/Cache/] in
    the'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'U.S. or The National Janet Web Caching Service [http://wwwcache.ja.net/] in
    the UK, which can utilize lower-cost non-backbone links to connect several remote
    caches in order to lower costs and raise performance. Finally, it is possible,
    though usually not recommended, to implement a rudimentary form of load balancing
    through the use of multiple parents and multiple child web caches. All of these
    options are discussed in some detail, but this document should not be considered
    the complete reference to ICP. Other good sources of information include the two
    RFCs on the subject, RFC 2186 [http://www.ircache.net/Cache/ICP/rfc2186.txt],
    which discusses the protocol itself, and RFC 2187 [http://www.ircache.net/Cache/ICP/rfc2187.txt],
    which describes the application of ICP.


    One common ICP-based solution in use today is satellite cache pre-population services.
    In this case, there are at least two caches at a site, one of which is connected
    to a satellite Internet uplink. The satellite-connected cache is provided by the
    service provider, and it is automatically filled with popular content via the
    satellite link. The other cache uses the satellite-connected cache as a sibling,
    which it queries for every cache miss that it has. If the satellite connected
    sibling has the content it will be served from the sibling cache; if not the primary
    cache will fetch the content from the origin server or a parent cache. ICP is
    a pretty effective, if somewhat bandwidth and processor intensive, means of accomplishing
    this task. A refinement of this process would be to use Cache-Digests for the
    satellite connected sibling in order to reduce traffic between the sibling caches.
    Nonetheless, ICP is a quite good method of implementing this idea.


    Another common use is cache meshes. A cache mesh is, in short, a number of web
    caches at remote sites interconnected using ICP. The web caches could be in different
    cities, or they could be in different buildings of the same university or different
    floors in the same office building. This type of hierarchy allows a large number
    of caches to benefit from a larger client population than is directly available
    to it. All other things being equal, a cache that is not overloaded will perform
    better (with regard to hit ratio) with a larger number of clients. Simply put,
    a larger client population leads to a higher quality of cache content, which in
    turn leads to higher hit ratios and improved bandwidth savings. So, whenever it
    is possible to increase the client population without overloading the cache, such
    as in the case of a cache mesh, it may be worth considering. Again, this type
    of hierarchy can be improved upon by the use of Cache Digests, but ICP is usually
    simpler to implement and is a widely supported standard, even on non-Squid caches.


    Finally, ICP is also sometimes used for load balancing multiple caches at the
    same site. ICP, or even Cache Digests for that matter, are almost never the best
    way to implement load balancing. However, for completeness, I’ll discuss it briefly.
    Using ICP for load balancing can be achieved in a few ways. One common method
    is to have several local siblings, which can each provide hits to the others’
    clients, while the client load is evenly divided across the number of caches.
    Another option is to have a very fast but low-capacity web cache in front of two
    or more lower-cost, but higher-capacity, parent web caches. The parents will then
    provide the requests in a roughly equal amount. As mentioned, there are much better
    options for balancing web caches, the most popular being WCCP (version 1 is fully
    supported by Squid), and L4 or L7 switches.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Other Proxy Cache Servers


    This section of the Other Caches page provides a list of currently configured
    sibling and parent caches, and also allows one to add more neighbor caches. Clicking
    the name of a neighbor cache will allow you to edit it. This section also provides
    the vital information about the neighbor caches, such as the type (parent, sibling,
    multicast), the proxy or HTTP port, and the ICP or UDP port of the caches. Note
    that Proxy port is the port where the neighbor cache normally listens for client
    traffic, which defaults to 3128.


    # Edit Cache Host


    Clicking a cache peer name or clicking Add another cache on the primary Other
    Caches page brings you to this page, which allows you to edit most of the relevant
    details about neighbor caches (Figure 12-2).


    ![](img/d84604054810a13cacfdac212ebee2f7_239_0.png)


    # Hostname


    The name or IP address of the neighbor cache you want your cache to communicate
    with. Note that this will be one-way traffic. Access Control Lists, or ACLs, are
    used to allow ICP requests from other caches. ACLs are covered later. This option
    plus most of the rest of the options on this page correspond to cache_peer lines
    in squid.conf.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Type


    The type of relationship you want your cache to have with the neighbor cache.
    If the cache is upstream, and you have no control over it, you will need to consult
    with the administrator to find out what kind of relationship you should set up.
    If it is configured wrong, cache misses will likely result in errors for your
    users. The options here are sibling, parent, and multicast.


    # Proxy port


    The port on which the neighbor cache is listening for standard HTTP requests.
    Even though the caches transmit availability data via ICP, actual web objects
    are still transmitted via HTTP on the port usually used for standard client traffic.
    If your neighbor cache is a Squid-based cache, then it is likely to be listening
    on the default port of 3128. Other common ports used by cache servers include
    8000, 8888, 8080, and even 80 in some circumstances.


    # ICP port


    The port on which the neighbor cache is configured to listen for ICP traffic.
    If your neighbor cache is a Squid-based proxy, this value can be found by checking
    the icp_port directive in the squid.conf file on the neighbor cache. Generally,
    however, the neighbor cache will listen on the default port 3130.


    # Proxy only?


    A simple yes or no question to tell whether objects fetched from the neighbor
    cache should be cached locally. This can be used when all caches are operating
    well below their client capacity, but disk space is at a premium or hit ratio
    is of prime importance.


    # Send ICP queries?


    Tells your cache whether or not to send ICP queries to a neighbor. The default
    is Yes, and it should probably stay that way. ICP queries is the method by which
    Squid knows which caches are responding and which caches are closest or best able
    to quickly answer a request.


    # Default cache


    This be switched to Yes if this neighbor cache is to be the last-resort parent
    cache to be used in the event that no other neighbor cache is present as determined
    by ICP queries. Note that this does not prevent it from being used normally while
    other caches are responding as expected. Also, if this neighbor is the sole parent
    proxy, and no other route to the Internet exists, this should be enabled.


    # Round-robin cache?


    Chooses whether to use round-robin scheduling between multiple parent caches in
    the absence of ICP queries. This should be set on all parents that you would like
    to schedule in this way.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# ICP time-to-live


    Defines the multicast TTL for ICP packets. When using multicast ICP, it is usually
    wise for security and bandwidth reasons to use the minimum tty suitable for your
    network.


    # Cache weighting


    Sets the weight for a parent cache. When using this option it is possible to set
    higher numbers for preferred caches. The default value is 1, and if left unset
    for all parent caches, whichever cache responds positively first to an ICP query
    will be sent a request to fetch that object.


    # Closest only


    Allows you to specify that your cache wants only CLOSEST_PARENT_MISS replies from
    parent caches. This allows your cache to then request the object from the parent
    cache closest to the origin server.


    # No digest?


    Chooses whether this neighbor cache should send cache digests.


    # No NetDB exchange


    When using ICP, it is possible for Squid to keep a database of network information
    about the neighbor caches, including availability and RTT, or Round Trip Time,
    information. This usually allows Squid to choose more wisely which caches to make
    requests to when multiple caches have the requested object.


    # No delay?


    Prevents accesses to this neighbor cache from affecting delay pools. Delay pools,
    discussed in more detail later, are a means by which Squid can regulate bandwidth
    usage. If a neighbor cache is on the local network, and bandwidth usage between
    the caches does not need to be restricted, then this option can be used.


    # Login to proxy


    Select this if you need to send authentication information when challenged by
    the neighbor cache. On local networks, this type of security is unlikely to be
    necessary.


    # Multicast responder


    Allows Squid to know where to accept multicast ICP replies. Because multicast
    is fed on a single IP to many caches, Squid must have some way of determining
    which caches to listen to and what options apply to that particular cache. Selecting
    Yes here configures Squid to listen for multicast replies from the IP of this
    neighbor cache.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Query host for domains, Don''t query for domains


    These two options are the only options on this page to configure a directive other
    than cache_peer in Squid. In this case it sets the cache_peer_domain option. This
    allows you to configure whether requests for certain domains can be queried via
    ICP and which should not. It is often used to configure caches not to query other
    caches for content within the local domain. Another common usage, such as in the
    national web hierarchies discussed above, is to define which web cache is used
    for requests destined for different TLDs. So, for example, if one has a low cost
    satellite link to the U.S. backbone from another country that is preferred for
    web traffic over the much more expensive land line, one can configure the satellite-connected
    cache as the cache to query for all .com, .edu, .org, net, .us, and .gov addresses.


    # Cache Selection Options


    This section provides configuration options for general ICP configuration (Figure
    12-3). These options affect all of the other neighbor caches that you define.


    ![](img/d84604054810a13cacfdac212ebee2f7_242_0.png)


    Figure 12-3: Some global ICP options


    # Directly fetch URLs containing


    Allows you to configure a match list of items to always fetch directly rather
    than query a neighbor cache. The default here is cgi-bin ? and should continue
    to be included unless you know what you''re doing. This helps prevent wasting
    inter-cache bandwidth on lots of requests that are usually never considered cacheable,
    and so will never return hits from your neighbor caches. This option sets the
    hierarchy_stoplist directive.


    # ICP query timeout


    The time in milliseconds that Squid will wait before timing out ICP requests.
    The default allows Squid to calculate an optimum value based on average RTT of
    the neighbor caches. Usually, it is wise to leave this unchanged. However, for
    reference, the default value in the distant past was 2000, or 2 seconds. This
    option edits the icp_query_timeout directive.


    # Multicast ICP timeout'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Dead peer timeout


    Controls how long Squid waits to declare a peer cache dead. If there are no ICP
    replies received in this amount of time, Squid will declare the peer dead and
    will not expect to receive any further ICP replies. However, it continues to send
    ICP queries for the peer and will mark it active again on receipt of a reply.
    This timeout also affects when Squid expects to receive ICP replies from peers.
    If more than this number of seconds have passed since the last ICP reply was received,
    Squid will not expect to receive an ICP reply on the next query. Thus, if your
    time between requests is greater than this timeout, your cache will send more
    requests DIRECT rather than through the neighbor caches.


    # Memory Usage


    This page provides access to most of the options available for configuring the
    way Squid uses memory and disks (Figure 12-4). Most values on this page can remain
    unchanged, except in very high load or low resource environments, where tuning
    can make a measurable difference in how well Squid performs.


    ![](img/d84604054810a13cacfdac212ebee2f7_243_0.png)


    Figure 12-4: Memory and disk usage


    # Memory usage limit


    The limit on how much memory Squid will use for some parts of its core data. Note
    that this does not restrict or limit Squid''s total process size. What it does
    do is set aside a portion of RAM for use in storing in-transit and hot objects,
    as well as negative cached objects. Generally, the default value of 8MB is suitable
    for most situations, though it is safe to lower it to 4 or 2MB in extremely low
    load situations. It can also be raised significantly on high-memory systems to
    increase performance by a small margin. Keep in mind that large cache directories
    increase the memory usage of Squid by a large amount, and even a machine with
    a lot of memory can run out of memory and go into swap if cache memory and disk
    size are not appropriately balanced. This option edits the cache_mem directive.
    See the section on cache directories for more complete discussion of balancing
    memory and storage.


    # CAUTION


    If Squid is using what you consider to be too much memory, do not look here for
    a solution. It defaults to a modest 8MB, and only when you have configured a very
    small amount of cache storage will this 8MB be a significant portion of the memory
    Squid allocates. If you do find yourself running out of memory, you can lower
    the size of your configured cache directories for a more noticeable decrease in
    memory used.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# FQDN cache size


    Size of the in-memory cache of fully qualified domain names. This configures the
    fqdncache_size parameter and defaults to 1024, which is usually a safe value.
    In environments where DNS queries are slow, raising this may help.


    # Memory high water mark, Memory low water mark


    Sets the points at which Squid begins to remove objects from memory. As memory
    usage climbs past the low water mark, Squid more aggressively tries to free memory.
    Note this applies to the memory usage limit defined above, not the total process
    size of Squid. If you have a system that is doing double or triple duty and providing
    more than cache services, it may be wise to set the low water mark at a low number,
    like 50%, and the high mark at a high number like 95%. In such a case, Squid will
    mostly keep its usage at 50%, but if it begins to get overloaded, or a particularly
    large object comes through the cache, it can briefly go over that point. This
    option configures the cache_mem_low and cache_mem_high options, which default
    to 90% and 95%, respectively.


    # Disk high-water mark, Disk low-water mark


    Provide a mechanism for disk usage similar to the memory water marks above. To
    maximize hit ratio and provide most efficient use of disk space, leave this at
    the default values of 90% and 95%. Or to maximize performance and minimize fragmentation
    on disk, set them to a higher spread, such as 85% and 100%. Note that these settings
    are not where the amount of disk space to use is configured, they only define
    the percent of the allotted cache space at which Squid should begin to prune out
    old data to make room for incoming new objects. These options correlate to the
    cache_swap_high and cache_swap_low directives.


    # Maximum cached object size


    The size of the largest object that Squid will attempt to cache. Objects larger
    than this will never be written to disk for later use. Refers to the maximum_object_size
    directive.


    # IP address cache size, IP cache high-water mark, IP address low-water mark


    The size of the cache used for IP addresses and the high and low water marks for
    the cache, respectively. This option configures the ip_cache_size, ip_cache_high,
    and ip_cache_low directives, which default to 1024 entries, 95%, and 90%.


    # Logging


    Squid provides a number of logs that can be used when debugging problems and when
    measuring the effectiveness and identifying users and the sites they visit (Figure
    12-5). Because Squid can be used to "snoop" on user''s browsing habits, one should
    carefully consider privacy laws in your region and, more importantly, be considerate
    to your users. That being said, logs can be very valuable tools in ensuring that
    your users get the best service possible from your cache.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '![](img/d84604054810a13cacfdac212ebee2f7_245_0.png)


    # Figure 12-5: Logging configuration


    # Access log file


    The location of the cache access.log. The Squid access.log is the file in which
    Squid writes a small one-line entry for every request served by the cache. This
    option correlates to the cache_access_log directive and usually defaults to /usr/local/squid/log/access.log
    or on some RPM-based systems /var/log/squid/access.log. The format of the standard
    log file looks like this:


    ```

    97342337-543 11801 192.168.1.1 TCP_MISS/200 1999 GET http://www.google.com/ -
    DIRECT/64.208.34.100 text/html

    ```


    In the preceding line, each field represents some piece of information that may
    be of interest to an administrator:


    +   1. System time in standard UNIX format. The time in seconds since 1970. There
    are many tools to convert this to human readable time, including this simple Perl
    script:


    ```

    #! /usr/bin/perl -p

    s/^\d+,\d+/localtime $&/e;

    ```


    +   2. Duration or the elapsed time in milliseconds the transaction required.


    +   3. Client address or the IP address of the requesting browser. Some configurations
    may lead to a masked entry here, so that this field is not specific to one IP,
    but instead reports a whole network IP.


    +   4. Result codes provides two entries separated by a slash. The first position
    is one of several result codes [http://www.squid-cache.org/Doc/FAQ/FAQ-6.html#cache-result-codes],
    which provide information about how the request was resolved or wasn''t resolved
    if there was a problem. The second field contains the status code [http://www.squid-cache.org/Doc/FAQ/FAQ-6.html#http-status-codes],
    which comes from a subset of the standard HTTP status codes.


    +   5. Bytes is the size of the data delivered to the client in bytes. Headers
    and object data are counted toward this total. Failed requests will deliver and
    error page, the size of which will also be counted.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '6. *Request method* is the HTTP *request method* [http://www.squid-cache.org/Doc/FAQ/FAQ.6.html#request-methods]
    used to obtain an object. The most common method is, of course, GET, which is
    the standard method web browsers use to fetch objects.


    7. *URL* is the complete Uniform Resource Locator requested by the client.


    8. *RFC931* is the ident lookup information for the requesting client, if ident
    lookups are enabled in your Squid. Because of the performance impact, ident lookups
    are not used by default, in which case this field will always contain "-".


    9. *Hierarchy code* consists of three items. The first is simply a prefix of TIMEOUT_
    if all ICP requests timeout. The second (first if there is not TIMEOUT_ prepended)
    is the code that explains how the request was handled. This portion will be one
    of several *hierarchy codes* [http://www.squid-cache.org/Doc/FAQ/FAQ.6.html#hier-codes].
    This result is informative regardless of whether your cache is part of a cache
    hierarchy, and will explain how the request was served. The final portion of this
    field contains the name or IP of the host from which the object was retrieved.
    This could be the origin server, a parent, or any other peer.


    10. *Type* is simply the type of object that was requested. This will usually
    be a recognizable MIME type, but some objects have no type or are listed as "-".


    There are two other optional fields for cases when MIME header logging has been
    turned on for debugging purposes. The full HTTP request and reply headers will
    be included enclosed in [ and ] square brackets.


    # Debug log file


    The location for Squids cache.log file. This file contains startup configuration
    information, as well as assorted error information during Squids operation. This
    file is a good place to look when a website is found to have problems running
    through the web cache. Entries here may point towards a potential solution. This
    option correlates to the cache_log directive and usually defaults to either /usr/local/squid/log/cache.log
    or /var/log/squid/cache.log on RPM-based systems.


    # Storage log file


    Location of the cache''s store log file. This file contains a transaction log
    of all objects that are stored in the object store, as well as the time when they
    get deleted. This file really doesn''t have very much use on a production cache,
    and it is primarily recommended for use in debugging. Therefore, it can be turned
    off by entering none in the entry field. The default location is either /usr/local/squid/log/store.log
    or /var/log/squid/store.log.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Cache metadata file


    Filename used in each store directory to store the web cache meta data, which
    is a sort of index for the web cache object store. This is not a human-readable
    log, and it is strongly recommended that you leave it in its default location
    on each store directory, unless you really know what you’re doing. This option
    correlates to the cache_swap_log directive.


    # Use HTTPD log format


    Allows you to specify that Squid should write its access.log in HTTPD common log
    file format, such as that used by Apache and many other web servers. This allows
    you to parse the log and generate reports using a wider array of tools. However,
    this format does not provide several types of information specific to caches and
    is generally less useful when tracking cache usage and solving problems. Because
    there are several effective tools for parsing and generating reports from the
    Squid standard access logs, it is usually preferable to leave this at its default
    of being off. This option configures the emulate_httpd_log directive. The Calamaris
    cache access log analyzer does not work if this option is enabled.


    # Log MIME headers


    Provides a means to log extra information about your requests in the access log.
    This causes Squid to also write the request and response MIME headers for every
    request. These will appear in brackets at the end of each access.log entry. This
    option correlates to the log_mime_hdrs directive.


    # Perform RFC931 ident lookups for ACLs


    Indicates which of the Access Control Lists that are defined should have ident
    lookups performed for each request in the access log. Because of the performance
    impact of using this option, it is not on by default. This option configures the
    ident_lookup_access directive.


    # RFC931 ident timeout


    The timeout, usually in seconds, for ident lookups. If this is set too high, you
    may be susceptible to denial of service from having too many outstanding ident
    requests. The default for this is 10 seconds, and it applies to the ident_timeout
    directive.


    # Log full hostnames


    Configures whether Squid will attempt to resolve the host name, so the fully qualified
    domain name can be logged. This can, in some cases, increase latency of requests.
    This option correlates to the log_fqdn directive.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Logging netmask


    Defines what portion of the requesting client IP is logged in the access.log.
    For privacy reasons it is often preferred to only log the network or subnet IP
    of the client. For example, a netmask of 255.255.255.0 will log the first three
    octets of the IP and fill the last octet with a zero. This option configures the
    client_netmask directive.


    # Debug options


    Provides a means to configure all of Squid’s various debug sections. Squid’s debugging
    code has been divided into a number of sections. If there is a problem in one
    part of Squid, debug logging can be made more verbose for just that section. For
    example, to increase debugging for just the Storage Manager in Squid to its highest
    level of 9 while leaving the rest at the default of 1, the entry would look like
    Figure 12-6.


    ![](img/d84604054810a13cacfdac212ebee2f7_248_0.png)


    Figure 12-6: Setting Squid debug levels


    There is a complete list of debug sections [http://www.swelltech.com/support/docs/squid/debug-sections.txt]
    at the Swell Technology website and in the Squid source distribution in the doc
    directory. More information can be found in the Squid FAQ [http://www.squid-cache.org/Doc/FAQ/FAQ-11.html#ss11.20].


    # MIME headers table


    The pathname to Squid’s MIME table. This usually should remain at the default
    value. This option configures the mime_table directive and defaults to /usr/local/squid/etc/mime.conf
    or /etc/squid/mime.conf.


    # Cache Options


    The Cache Options page provides access to some important parts of the Squid configuration
    file. This is where the cache directories are configured as well as several timeouts
    and object size options.


    # Cache Directories


    The Cache directories option sets the cache directories and the amount of space
    Squid is allowed to use on the device. The first example displays an example cache_dir
    line in the squid.conf file, while Figure 12-7 shows the Cache Options screen
    in Webmin where the same options can be configured.


    ```

    cache_dir ufs /cache0 1500 8 256

    ```'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/d84604054810a13cacfdac212ebee2f7_249_0.png)


    Figure 12-7: Configuring Squid''s cache directories


    The directive is cache_dir, while the options are the type of filesystem, the
    path to the cache directory, the size allotted to Squid, the number of top-level
    directories, and, finally, the number of second level directories. In the example,
    I''ve chosen the filesystem type ufs, which is a name for all standard UNIX filesystems.
    This type includes the standard Linux ext2 filesystem as well. Other possibilities
    for this option include aufs and diskd.


    The next field is simply the space, in megabytes, of the disk that you want to
    allow Squid to use. Finally, the directory fields define the upper- and lower-level
    directories for Squid to use. Calculating the L1 number precisely is tricky, but
    not difficult if you use this formula:


    ```

    x=Size of cache dir in KB (i.e., 6GB~6,000,000KB)

    y=Average object size (just use 13KB)

    z=Number of directories per first level directory


    (((x / y) / 256) / 256) * 2 = # of directories

    ```


    As an example, if your cache used 6GB of each of two 13GB drives:


    ```

    6,000,000 / 13 = 461538.5 / 256 = 1802.9 / 256 = 7 * 2 = 14

    ```


    Your cache_dir line would look like this:


    ```

    cache_dir ufs /cache0 6000 14 256

    ```


    # Other Cache Options


    The rest of the Cache Options page is a bit of a hodgepodge of other general options
    (Figure 12-8). Generally most configuration will take place on this page, as it
    addresses many of the tunable items in Squid that can make a difference in performance.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '![](img/d84604054810a13cacfdac212ebee2f7_250_0.png)


    # Figure 12-8: Other cache options


    # Average object size


    The average size of objects expected in your cache. This item is generally safe
    at its default value of 13KB. In older versions of Squid (prior to 2.3) this option
    affected the number of filemap bits set aside by Squid at runtime. In newer Squids
    filemap bits are configured dynamically, as needed, and so configuration of this
    option is unnecessary and arguably pointless. This option will go away in some
    future version of Squid. Until then, it correlates to the store_avg_object_size
    directive.


    # Objects per bucket


    The number of objects in each store hash table. Again, it is not worth bothering
    to change it, as its default value is probably a good safe value, and changing
    it provides little or nothing in the way of performance or efficiency improvements.
    This option corresponds to the store_objects_per_bucket directive.


    # Don''t cache URLs for ACLs


    Allows you to easily pick which ACL matches will not be cached. Requests that
    match the selected ACLs will always be answered from the origin server. This option
    correlates to the always_direct directive.


    # Maximum cache time


    The maximum time an object will be allowed to remain in the cache. This time limit
    is rarely reached, because objects have so many occasions to be purged via the
    normal replacement of the cache object store. However, if object freshness is
    of prime importance, then it may be worthwhile to lower this from its default
    of 1 year to something much shorter, such as 1 week, though it is probably counterproductive
    to do so for most users. This option configures the reference_age parameter.


    # Maximum request size


    The maximum size of request that will be accepted by Squid from the client. The
    default is 100KB, however, in environments where the POST method may be used to
    send larger files to web servers, or web mail is used for sending attachments,
    it will probably be necessary to raise this limit to something more'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'reasonable. 8 or 16MB is probably a good size that will permit most uploads
    without any problems. Note that this bears no relation to the size of object that
    is being retrieved; it only affects the size of the HTTP request being sent from
    the client. This option corresponds to the request_size directive.


    > NOTE Squid versions from 2.5 onward have removed the default size limit, and
    requests can be unlimited in size. Thus if you rely on the default limit being
    in place, you will need to modify your configuration when upgrading.


    # Failed request cache time


    The amount of time that a request error condition is cached. For example, some
    types of connection refused and 404 Not Found errors are negatively cached.


    # DNS lookup cache time


    The length of time that DNS lookups are cached. Squid provides functionality as
    a basic caching name server, in order to further accelerate web service through
    the proxy. This value defaults to 6 hours and correlates to the positive_dns_ttl
    directive. If rapid updates of cache DNS data are required, such as to keep up
    with dynamic DNS systems or to avoid load balance problems with local network
    sites in a website acceleration environment, it may be wise to reduce this value
    significantly. Ensuring you have reliable and suitably fast DNS service on the
    local network is mandatory, however, if you do reduce this value by a large amount.


    # Failed DNS cache time


    The time period for which failed DNS requests are cached. This option corresponds
    to the negative_dns_ttl directive and defaults to 5 minutes. This option rarely
    needs tuning.


    # Connect timeout


    An option to force Squid to close connections after a specified time. Some systems
    (notably older Linux versions) cannot be relied upon to time out connect requests.
    For this reason, this option specifies the timeout for how long Squid should wait
    for the connection to complete. This value defaults to 120 seconds (2 minutes)
    and correlates to the connect_timeout directive.


    # Read timeout


    The timeout for server-side connections. Each successful read() request the timeout
    is reset to this amount. If no data is read within this period of time, the request
    is aborted and logged with ERR_READ_TIMEOUT. This option corresponds to read_timeout
    and defaults to 15 minutes.


    # Site selection timeout


    The timeout for URN to multiple URLs selection. URN is a protocol designed for
    location-independent name resolution, specified in RFC 2169 [http://www.ietf.org/rfc/rfc2169.txt].
    This option configures the siteselect_timeout directive and defaults to 4 seconds.
    There is probably no need to change this.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Client request timeout


    The timeout for HTTP requests from clients. By default the value is 5 minutes,
    and it correlates to the request_timeout directive.


    # Max client connect time


    The time limit Squid sets for a client to remain connected to the cache process.
    This is merely a safeguard against clients that disappear without properly shutting
    down. It is designed to prevent a large number of sockets from being tied up in
    a CLOSE_WAIT state. The default for this option is 1440 minutes, or 1 day. This
    correlates to the client_lifetime.


    # Max shutdown time


    The time Squid allows for existing connections to continue after it has received
    a shutdown signal. It will stop accepting new connections immediately, but connections
    already in progress will continue to be served for this amount of time. This option
    corresponds to the shutdown_lifetime configuration directive and defaults to 30
    seconds, which is a good safe value. If rapid down-sup time is more important
    than being polite to current clients, it can be lowered.


    # Half-closed clients


    Defines Squid''s behavior toward some types of clients that close the sending
    side of a connection while leaving the receiving side open. Turning this option
    off will cause Squid to immediately close connections when a read(2) returns "no
    more data to read". It''s usually safe to leave this at the default value of yes.
    It corresponds to the half_close_clients directive.


    # Persistent timeout


    The timeout value for persistent connections. Squid will close persistent connections
    if they are idle for this amount of time. Persistent connections will be disable
    entirely if this option is set to a value less than 10 seconds. The default is
    120 seconds and likely doesn''t need to be changed. This option configures the
    pconn_timeout directive.


    # WAIS relay host, WAIS relay port


    The WAIS host and port to relay WAIS requests. WAIS, or Wide Area Information
    System, is a system to catalog and search large amounts of data via a WAIS or
    WWW browser. WAIS is a mostly deprecated protocol, but some sites probably do
    still exist, though this author has been unable to locate any to satiate his curiosity
    about the subject. These options correspond to the wais_relay_host and wais_relay_port
    directives and default to localhost and 8000.


    # Helper Programs


    Squid uses helper programs to provide extra functionality or to provide greater
    performance. Squid provides a standard API for several types of programs that
    provide extra services that do not fit well into the Squid core. Helper programs
    could be viewed as a simple means of modular design, allowing third parties to'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'write modules to improve the features of Squid (Figure 12-9). That being said,
    some of Squid’s standard functionality is also provided by helper programs. The
    standard helper programs include dnsserver, pinger, and several authentication
    modules. Third-party modules include redirectors, ad blockers, and additional
    authentication modules.


    > NOTE

    > Squid versions from 2.3 onward do not use the dnsserver helper program by default,
    replacing it with an internal non-blocking DNS resolver. This new internal DNS
    resolver is more memory and processor efficient, so is preferred. But in some
    circumstances, the older helper program is the better choice. If your Squid must
    be able to resolve based on any source other than a DNS server, such as via a
    hosts file or NIS, then you may need to use the external dnsserver helper.


    ![](img/d84604054810a13cacfdac212ebee2f7_253_0.png)


    Figure 12-9: Cache helper program


    # FTP column width


    The column width for auto-generated web pages of FTP sites queried through Squid
    when Squid is in forward proxy mode. Squid provides limited FTP proxy features
    to allow browsers (even older, non-FTP aware browsers) to communicate with FTP
    servers. This option gives some control over how Squid formats the resulting file
    lists. This option correlates to the ftp_list_width and defaults to 32.


    > NOTE

    > Squid only provides FTP proxy and caching services when acting as a traditional
    proxy, not when acting transparently. Squid does not currently provide FTP caching
    or proxying for standard FTP clients. The clients must be HTTP clients, for which
    Squid can provide gateway services.


    # Anon FTP login


    The email address Squid uses to log in to remote FTP servers anonymously. This
    can simply be a username followed by an @ symbol, which your domain name can be
    automatically attached to. Or it can be a full email address. This should be something
    reasonable for your domain, such as wwwuser@mydomain.com, or in the domainless
    case first mentioned, Squid@, which happens to be the default for this option.
    This corresponds to the ftp_user directive.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Squid DNS program


    The helper program to use for DNS resolution. Because Squid requires a non-blocking
    resolver for its queries, an external program called dnsserver is included in
    the standard distribution. In Squid versions prior to 2.3, this program is the
    only standard choice for resolution, and the path to the file can be entered here.
    In Squid versions later than 2.3, there is a new default option, which is an internal
    non-blocking resolver that is more memory and CPU efficient. This option rarely
    needs to be changed from its default value. This option configures cache_dns_program
    directive.


    # Number of DNS programs


    The number of external DNS resolver processes that will be started in order to
    serve requests. The default value of five is enough for many networks, however,
    if your Squid serves a large number of users, this value may need to be increased
    to avoid errors. However, increasing the number of processes also increases the
    load on system resources and may actually hinder performance if set too high.
    More than 10 is probably overkill. This option correlates to the dns_children
    directive.


    # Append domain to requests


    When enabled, causes the dnsserver to add the local domain name to single component
    host names. It is normally disabled to prevent caches in a hierarchy from interpreting
    single component host names locally. This option configures the dns_defnames directive.


    # DNS server addresses


    Normally defaults to from resolv.conf, which simply means that Squid''s parent
    DNS servers will be drawn from the /etc/resolv.conf file found on the system Squid
    runs on. It is possible to select other DNS servers if needed—for example, to
    choose a more local caching DNS server or a remote Internet connected server.
    This option corresponds to the dns_nameservers directive.


    # Cache clearing program


    The name of the helper program that deletes, or unlinks, old files in the cache
    to make room for newer objects. In all current versions of Squid, this helper
    is known as unlinkd and should probably not be changed from this unless you know
    what you''re doing. This option configures the unlinkd_program directive.


    # Squid ping program


    An external program that provides Squid with ICMP RTT information so that it can
    more effectively choose between multiple remote parent caches for request fulfillment.
    There are special cases when this option is required, and your Squid must have
    been compiled with the --enable-icmp configure option in order for it to work.
    This option should only be used on caches that have multiple parent'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'caches on different networks that it must choose between. The default program
    to use for this task is called pinger. This option configures the pinger_program
    directive.


    # Custom redirect program, Number of redirect programs


    Provides access to the redirector interface in Squid, so a redirector can be selected
    and the number of redirector processes needed configured. A redirector is, in
    short, just what it sounds like: a program that, when given a URL that matches
    some circumstances, redirects Squid to another URL. To be a little less brief
    and perhaps more complete, a redirector provides a method to export a request
    to an external program and then to import that program''s response and act as
    though the client sent the resulting request. This allows for interesting functionality
    with Squid and an external redirector. To configure a redirector, enter the path
    to the redirector and the redirector filename, as shown in Figure 12-10. You should
    also enter any options to be passed to the redirector in the same field, as in
    the example shown.


    ![](img/d84604054810a13cacfdac212ebee2f7_255_0.png)


    Figure 12-10: Configuring a redirector


    One common usage is to block objectionable content using a tool like SquidGuard
    [http://www.squidguard.org/]. Another popular use is to block advertising banners
    using the simple but effective Ad Zapper [http://www.zip.com.au/~cs/adzap/index.html].
    The Ad Zapper not only allows one to block ads, it can also remove those pesky
    flashing New images and moving line images used in place of standard horizontal
    rules. Several other general-purpose redirectors exist that provide URL remapping
    for many different purposes. Two popular and well-supported general redirectors
    are Squirm [http://www.senet.com.au/squirm/] and JesRed [http://ivs.cs.uni-magdeburg.de/~elkner/webtools/jesred/].
    Finally, it is possible to write a custom redirector to provide any kind of functionality
    needed from your Squid. While it is not possible to use the redirector interface
    to alter a web page''s content it is possible to perform in-line editing of some
    or all URLs to force many different types of results. The two redirect options
    configure the redirect_program and redirect_children directives.


    # Custom Authentication program, Number of authentication programs


    Provides an interface to the external authentication interface within Squid. There
    are a large number of authentication modules for use with Squid, allowing users
    to be authenticated in a number of ways. The simplest authentication type is known
    as ncsa_auth, which uses a standard htpasswd-style password file to check for
    login name and password. More advanced options include a new NTLM module that
    allows authentication against a Windows NT domain controller, and LDAP authentication
    that allows use of Lightweight Directory Access Protocol servers. Most authentication
    modules work the same way and quite similarly to a redirector as discussed above.
    In Figure 12-11, you''ll see the standard ncsa_auth authenticator and the location
    of the passwd file it should use for'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'authenticating users. You''ll notice the number of authenticator child processes
    has been increased from the default of 5 to 10, in order to handle quite heavy
    loads. These options edit the authenticate_program and authenticate_children directives,
    respectively.


    ![](img/d84604054810a13cacfdac212ebee2f7_256_0.png)


    Figure 12-11: Authentication configuration


    NOTE


    > Authentication has been enhanced significantly in Squid 2.5 and above, adding
    new types of authentication (NTLM and Digest), as well as more flexible configuration
    options. If you are using one of these Squid versions, read the following section,
    “Authentication Programs,” for more complete information.


    # Authentication Programs


    In version 2.5.STABLE1 and above, Squid has a wealth of new authentication features
    and options. Webmin has been expanded to account for the changes, and in the change,
    authentication configuration received its own section (Figure 12-12).


    ![](img/d84604054810a13cacfdac212ebee2f7_256_1.png)


    Figure 12-12: Authentication Programs


    Squid 2.5 and above supports client authentication of three distinct types: Basic,
    Digest, and NTLM. Older Squids supported only Basic authentication, which is a
    simple, unencrypted authentication method documented originally. The two new methods,
    Digest and NTLM, support both plain-text and encrypted authentication mechanisms.
    Which method to use depends on your client population. Basic authentication works
    for all browser clients that fully support'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'proxies. Digest authentication is a standard method of authenticating web clients
    securely, supported by all browsers that are fully HTTP/1.1 compliant (including
    modern versions of IE, Netscape, and Mozilla). NTLM is a proprietary mechanism
    developed by Microsoft and currently only supported by Microsoft client software.


    # Basic and Digest Authentication Options


    Basic authentication is the simplest to use, because it is the most widely accessible
    and the simplest in implementation. Digest authentication is a secure authentication
    method documented in RFC 2617, providing encrypted authentication of proxy and
    web server users. The only configuration detail really required is the location
    of the authentication program and any command-line arguments to pass to the program,
    though a couple of additional parameters are available.


    # Basic authentication program, Digest authentication program


    This is the only required option, if you wish to use Basic or Digest authentication
    with Squid. You may specify one of several authentication programs provided with
    Squid, like ncsa_auth to authenticate against a standalone htpasswd-style password
    file, pam_auth to authenticate against the local PAM system, or smb_auth to authenticate
    against a remote or local SMB server. Another, even simpler choice is to use the
    built-in Webmin authentication module. It is a simple NCSA-style authenticator
    that ties into the Webmin Squid user and password management tools without any
    additional configuration. This option correlates to the auth_param basic program
    directive or auth_param digest program and is disabled by default.


    # Number of authentication programs


    This option correlates to the auth_param basic children or auth_param digest children
    directive and defaults to 5. If your Squid supports a very large number of users,
    you may need to raise this to 10 or 20.


    # Authentication cache time


    This is the amount of time that Squid will cache authentication credentials. Squid
    normally queries the authentication program periodically and stores the result
    of the test in its own memory so it doesn’t need to query the external authenticator
    frequently. This improves performance, but if rapidly changing credentials are
    required, you may wish to lower this value. This option correlates to the auth_param
    basic credentials_ttl.


    # Authentication realm


    When a client browser receives a basic authentication request, it includes a short
    string identifying the requester of the data. This information will usually be
    displayed to the user in the popup box where credentials are entered. This option
    correlates to the auth_param basic realm or auth_param digest realm directive
    and has no default.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# NTLM authentication options


    Like Digest authentication, NTLM authentication provides an encrypted connection
    to a network server. Beware that it is not an HTTP authentication scheme, however.
    It is a connection authentication scheme that cannot be proxied (though a proxy
    can use it to authenticate its own clients). NTLM is also less secure than Digest
    authentication and has a history of vulnerabilities. That said, it is quite popular,
    because Windows supports a sort of network "single sign-on", in which users only
    need to log on once to the local network, and they can be automatically authenticated
    to the proxy server using the same credentials.


    # NTLM authentication program


    As in Basic and Digest authentication above, this will contain a path to the authentication
    program and any command-line arguments. Often the arguments will specify the domain
    or workgroup and the server to authenticate against. This option correlates to
    the auth_param ntlm program directive and is disabled by default.


    # Number of times an NTLM challenge can be re-used


    This option configures the number of times that a particular NTLM challenge can
    be reused. Increasing this number may reduce latency and load on the server slightly,
    but can also increase the risk of replay attacks (where a challenge response is
    recorded and played back to imitate the connection of a legitimate user). This
    option correlates to the auth_param ntlm max_challenge_reuses directive and defaults
    to 0.


    # Lifetime of NTLM challenges


    This option corresponds to the auth_param ntlm max_challenge_lifetime directive
    and defaults to 2 minutes. It is used to specify the length of time that a challenge
    can be reused. If a challenge is newer than this value and the challenge has been
    reused fewer than the previous value, a challenge will be reused.


    # Access Control


    The access control functionality of Squid is perhaps its most complex set of features,
    but also among its most powerful. In fact, many use Squid primarily for these
    features. Because of its complexity, you will learn about it in steps, examining
    the process of creating and implementing an access control list. Access control
    lists in Squid has two meanings within the configuration file and within the Webmin
    interface. First, it signifies the whole concept of access control lists and all
    of the logic that can be applied to those lists. Second, it applies to the lists
    themselves, which are simply lists of some type of data to be matched against
    when some type of access rule is in place. For example, forcing a particular site
    or set of sites to not be cached requires a list of sites to not cache and then
    a separate rule to define what to do with that list (in this case, don''t cache
    them). There is also a third type of option for configuring ICP access control.
    These three types of definition are separated in the Webmin panel into three sections.
    The first is labeled Access control lists, which lists existing ACLs and provides
    a'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'simple interface for generating and editing lists of match criteria (Figure
    12-13). The second is labeled Proxy restrictions and lists the current restrictions
    in place and the ACLs they affect. Finally, the ICP restrictions section lists
    the existing access rules regarding ICP messages from other web caches.


    ![](img/d84604054810a13cacfdac212ebee2f7_259_0.png)


    Figure 12-13: Access control lists


    # Access Control Lists


    This section provides a list of existing ACLs and provides a means to create new
    ones (Figure 12-14). The first field in the table represents the name of the ACL,
    which is simply an assigned name, that can be just about anything the user chooses.
    The second field is the type of the ACL, which can be one of a number of choices
    that indicate to Squid what part of a request should be matched against for this
    ACL. The possible types include the requesting clients address, the web server
    address or host name, a regular expression matching the URL, and many more. The
    final field is the actual string to match. Depending on what the ACL type is,
    this may be an IP address, a series of IP addresses, a URL, a host name, and so
    on.


    To edit an existing ACL, simply click the highlighted name. You will then be presented
    with a screen containing all relevant information about the ACL. Depending on
    the type of the ACL, you will be shown different data entry fields. The operation
    of each type is very similar, so for this example, you’ll step through editing
    of the localhost ACL. Clicking the localhost button presents the page that’s shown
    in Figure 12-15.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/d84604054810a13cacfdac212ebee2f7_260_0.png)


    # Figure 12-14: ACL section


    The title of the table is Client Address ACL, which means the ACL is of the Client
    Address type and tells Squid to compare the incoming IP address with the IP address
    in the ACL. It is possible to select an IP based on the originating IP or the
    destination IP. The netmask can also be used to indicate whether the ACL matches
    a whole network of addresses or only a single IP. It is possible to include a
    number of addresses or ranges of addresses in these fields. Finally, the Failure
    URL is the address to send clients to if they have been denied access due to matching
    this particular ACL. Note that the ACL by itself does nothing; there must also
    be a proxy restriction or ICP restriction rule that uses the ACL for Squid to
    use the ACL.


    ![](img/d84604054810a13cacfdac212ebee2f7_260_1.png)


    # Figure 12-15: Edit an ACL


    Creating a new ACL is equally simple (Figure 12-16). From the ACL page, in the
    Access control lists section, select the type of ACL you’d like to create. Then
    click Create new ACL. From there, as shown, you can enter any number of ACLs for
    the list. In my case, I’ve created a list called SitesThatSuck, which contains
    the websites of the Recording Industry Association of America and the Motion Picture
    Association of America. From there, I can add a proxy restriction to deny all
    accesses through my proxy to those two websites.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/d84604054810a13cacfdac212ebee2f7_261_0.png)


    Figure 12-16: Creating an ACL


    # Available ACL Types


    # Browser Regexp


    A regular expression that matches the client''s browser type based on the user
    agent header. This allows for ACLs to operate based on the browser type in use.
    For example, using this ACL type, one could create an ACL for Netscape users and
    another for Internet Explorer users. This could then be used to redirect Netscape
    users to a Navigator-enhanced page, and IE users to an Explorer-enhanced page.
    This is probably not the wisest use of an administrator''s time, but it does indicate
    the unmatched flexibility of Squid. This ACL type correlates to the browser ACL
    type.


    # Client IP Address


    The IP address of the requesting client, or the client''s IP address. This option
    refers to the src ACL in the Squid configuration file. An IP address and netmask
    are expected. Address ranges are also accepted.


    # Client Hostname


    Matches against the client domain name. This option correlates to the srcdomain
    ACL and can be either a single domain name or a list of domain names, or the path
    to a file that contains a list of domain names. If a path to a file, it must be
    surrounded by parentheses. This ACL type can increase the latency and decrease
    throughput significantly on a loaded cache, as it must perform an address-to-name
    lookup for each request, so it is usually preferable to use the Client IP Address
    type.


    # Client Hostname Regexp'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'but then unblock them after hours. This might improve workplace efficiency
    in some situations (or it might just offend the employees). This ACL type allows
    you to enter days of the week and a time range or select all hours of the selected
    days. This ACL type is the same as the time ACL type directive.


    # Dest AS Number


    The Destination Autonomous System number is the AS number of the server being
    queried. The autonomous system number ACL types are generally only used in Cache
    Peer, or ICP, access restrictions. Autonomous System numbers are used in organizations
    that have multiple Internet links and routers operating under a single administrative
    authority using the same gateway protocol. Routing decisions are then based on
    knowledge of the AS in addition to other possible data. If you are unfamiliar
    with the term autonomous system, it is usually safe to say you don’t need to use
    ACLs based on AS. Even if you are familiar with the term, and have a local AS,
    you still probably have little use for the AS number ACL types, unless you have
    cache peers in other autonomous systems and need to regulate access based on that
    information. This type correlates to the dest_as ACL type.


    # Source AS Number


    The Source Autonomous System number is another AS-related ACL type, and matches
    on the AS number of the source of the request. Equates to the src_as ACL type
    directive.


    # Ethernet Address


    The Ethernet or MAC address of the requesting client. This option only works for
    clients on the same local subnet and only for certain platforms. Linux, Solaris,
    and some BSD variants are the supported operating systems for this type of ACL.
    This ACL can provide a somewhat secure method of access control, because MAC addresses
    are usually harder to spoof than IP addresses, and you can guarantee that your
    clients are on the local network (otherwise no ARP resolution can take place).


    # External Auth


    This ACL type calls an external authenticator process to decide whether the request
    will be allowed. Many authenticator helper programs are available for Squid, including
    PAM, NCSA, UNIX passwd, SMB, NTLM (only in Squid 2.4), and so on. Note that authentication
    cannot work on a transparent proxy or HTTP accelerator. The HTTP protocol does
    not provide for two authentication stages (one local and one on remote websites).
    So in order to use an authenticator, your proxy must operate as a traditional
    proxy, where a client will respond appropriately to a proxy authentication request
    as well as external web server authentication requests. This correlates to the
    proxy_auth directive.


    # External Auth Regex


    As above, this ACL calls an external authenticator process, but allows regex pattern
    or case insensitive matches. This option correlates to the proxy_auth_regex directive.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Proxy IP Address


    The local IP address on which the client connection exists. This allows ACLs to
    be constructed that only match one physical network, if multiple interfaces are
    present on the proxy, among other things. This option configures the myip directive.


    # RFC931 User


    The username as given by an ident daemon running on the client machine. This requires
    that ident be running on any client machines to be authenticated in this way.
    Ident should not be considered secure except on private networks where security
    doesn''t matter much. You can find free ident servers for the following operating
    systems: Win NT [http://info.ost.eltele.no/freeware/identd/], Win 95/Win 98 [http://identd.sourceforge.net/],
    and UNIX [http://www2.lysator.liu.se/~pen/pidentd/]. Most UNIX systems, including
    Linux and BSD distributions, include an ident server.


    # Request Method


    This ACL type matches on the HTTP method in the request headers. This includes
    the methods GET, PUT, and so on. This corresponds to the method ACL type directive.


    # URL Path Regex


    This ACL matches on the URL path minus any protocol, port, and host name information.
    It does not include, for example, the "http://www.swelletech.com" portion of a
    request, leaving only the actual path to the object. This option relates to the
    urlpath_regex directive.


    # URL Port


    This ACL matches on the destination port for the request and configures the port
    ACL directive.


    # URL Protocol


    This ACL matches on the protocol of the request, such as FTP, HTTP, ICP, and so
    on.


    # URL Regexp


    Matches using a regular expression on the complete URL. This ACL can be used to
    provide access control based on parts of the URL, or a case-insensitive match
    of the URL, and much more. The regular expressions used in Squid are provided
    by the GNU Regex library, which is documented in the section 7 and 3 regex man
    pages. Regular expressions are also discussed briefly in a nice article by Guido
    Socher [http://www.linuxfocus.org/English/July1998/article53.html] at LinuxFocus.
    This option is equivalent to the url_regex ACL type directive.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Web Server Address


    This ACL matches based on the destination web server''s IP address. Squid a single
    IP, a network IP with netmask, as well as a range of addresses in the form "192.168.1.1-192.168.1.25".
    This option correlates to the dst ACL type directive.


    # Web Server Hostname


    This ACL matches on the host name of the destination web server.


    # Web Server Regexp


    Matches using a regular expression on the host name of the destination web server.


    More information on Access Control Lists in Squid can be found in [Section 10
    http://www.squid-cache.org/Doc/FAQ/FAQ-10.html] of the Squid FAQ. Authentication
    information can be found in [Section 23 http://www.squid-cache.org/Doc/FAQ/FAQ-23.html]
    of the Squid FAQ.


    # Administrative Options


    Administrative Options provides access to several of the behind-the-scenes options
    of Squid. This page allows you to configure a diverse set of options, including
    the user ID and group ID of the Squid process, cache hierarchy announce settings,
    and the authentication realm (Figure 12-17).


    ![](img/d84604054810a13cacfdac212ebee2f7_264_0.png)


    Figure 12-17: Administrative Options


    # Run as Unix user and group


    The username and group name Squid will operate as. Squid is designed to start
    as root but very soon after drop to the user/group specified here. This allows
    you to restrict, for security reasons, the permissions that Squid will have when
    operating. Although Squid has proven itself to be quite secure through several
    years of use on thousands of sites, it is never a bad thing to take extra precautions
    to avoid problems. By default, Squid will operate as either nobody user and the
    nogroup group, or in the case of some Squids installed from RPM, as squid user
    and group. These options correlate to the cache_effective_user and cache_effective_group
    directives.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Proxy authentication realm


    The realm that will be reported to clients when performing authentication. This
    option usually defaults to Squid proxy-caching web server, and correlates to the
    proxy_auth_realm directive. This name will likely appear in the browser popup
    window when the client is asked for authentication information.


    # Cache manager email address


    The email address of the administrator of this cache. This option corresponds
    to the cache_mgr directive and defaults to either webmaster or root on RPM-based
    systems. This address will be added to any error pages that are displayed to clients.


    # Visible hostname


    The host name that Squid will advertise itself on. This effects the host name
    that Squid uses when serving error messages. This option may need to be configured
    in cache clusters if you receive IP-forwarding errors. This option configures
    the visible_hostname.


    # Unique hostname


    Configures the unique_hostname directive, and sets a unique host name for Squid
    to report in cache clusters in order to allow detection of forwarding loops. Use
    this if you have multiple machines in a cluster with the same visible hostname.


    # Cache announce host, port, and file


    The host address and port that Squid will use to announce its availability to
    participate in a cache hierarchy. The cache announce file is simply a file containing
    a message to be sent with announcements. These options correspond to the announce_host,
    announce_port, and announce_file directives.


    # Announcement period


    Configures the announce_period directive, and refers to the frequency at which
    Squid will send announcement messages to the announce host.


    # Miscellaneous Options


    Miscellaneous Options is just what it sounds like: a hodgepodge of options that
    don''t seem to fit anywhere else. Here you''ll find several memory-related options,
    options regarding headers and user agent settings, and the powerful HTTP accelerator
    options (Figure 12-18).


    # Startup DNS test addresses


    This should point to a number of hosts that Squid can use to test whether DNS
    service is working properly on your network. If DNS isn''t working properly, Squid
    will not be able to service requests, so it will refuse to start, with a brief'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'message regarding why in the cache.log. It is recommended that you select two
    or more host names on the Internet and one or two host names on your intranet,
    assuming you have one and Squid is expected to service it. By default, the dns_testnames
    directive checks a few well-known and popular sites: netscape.com, internic.net,
    nlanz.net, and microsoft.com.


    ![](img/d84604054810a13cacfdac212ebee2f7_266_0.png)


    Figure 12-18: Miscellaneous Options


    # SIGUSR1 logfile rotations


    The number of old rotated log files Squid will keep. On Red Hat systems, this
    option defaults to zero, as logs are rotated via the system standard logrotate
    program. On other systems, this defaults to 10, which means Squid will keep 10
    old log files before overwriting the oldest. This option corresponds to the logfile_rotate
    directive.


    # Default domain


    The domain that Squid will append to requests that are not possibly fully qualified
    domain names (more precisely, those that have no dots in them). This option correlates
    to the append_domain directive.


    # Error messages text


    Provides a means to automatically add some extra information to Squid''s error
    pages. You can add HTML or plain-text comments or links here, which will be added
    to the error messages displayed to clients. This option correlates to the err_html_text
    directive.


    # Per-client statistics?


    Allows you to choose whether Squid will keep statistics regarding each individual
    client. This option configures the client_db directive and defaults to on.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# X-Forwarded-For header?


    This option allows you to choose whether Squid will report the host name of the
    system that originally made the request to the origin server. For example, if
    this option is disabled every request through your cache will be reported as originating
    from the cache. Usually, this should remain enabled. This correlates to the forwarded_for
    directive and defaults to on.


    # Log ICP queries?


    Dictates whether Squid will log ICP requests. Disabling this can be a good idea
    if ICP loads are very high. This option correlates to the log_icp_queries directive
    and defaults to on.


    # Minimum direct hops


    When using ICMP pinging features of Squid to determine distance to peers and origin
    servers, this configures when Squid should prefer going direct over a peer. This
    option requires your Squid to have been compiled with the --enable-icmp, and you
    must be in a peering relationship with other Squid caches, also with the appropriate
    build option compiled in. This option correlates to the minimum_direct_hops directive.


    # Keep memory for future use?


    This option turns on memory_pools and allows Squid to keep memory that it has
    allocated (but no longer needs), so that it will not need to reallocate memory
    in the future. This can improve performance by a small margin, but may need to
    be turned off if memory is at a premium on your system. This option defaults to
    on and should generally be left on, unless you know what you''re doing.


    # Amount of memory to keep


    The amount of memory Squid will keep allocated, assuming the Keep memory for future
    use option is turned on. This option configures the memory_pools_limit directive
    and defaults to unlimited. Any non-zero value will instruct Squid not to keep
    more than that amount allocated, and if Squid requires more memory than that to
    fulfill a request, it will use your system''s malloc library. Squid does not preallocate
    memory, so it is safe to set this reasonably high. If your Squid runs on a dedicated
    host, it is probably wisest to leave it to its default of unlimited. If it must
    share the system with other server processes (like Apache or Sendmail) then it
    might be appropriate to limit it somewhat.


    # Headers to pass through


    Configures the anonymizing features of Squid. This option allows you to dictate
    what kinds of request headers are allowed to pass through Squid. For example,
    to prevent origin servers from being able to detect the type of browser your clients
    are using you would choose to allow all except User-Agent. This option has mostly
    obscure uses and usually doesn''t need to be changed from its default of allowing
    all headers to pass through. There is a relevant Squid FAQ section [http://www.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'squid-cache.org/Doc/FAQ/FAQ-4.html#s4.18 that describes in more detail what
    can be accomplished with this option. This option corresponds to the anonymize_headers
    directive and defaults to allow All headers.


    CAUTION Indiscriminate use of Squid’s anonymizing features can cause websites
    to behave incorrectly. Because modern websites often rely on the contents of cookies
    or other headers to know the right JavaScript and HTML code to serve for everything
    to look and act correctly, many sites could be confused into serving the wrong
    content or refusing to serve any content to the user.


    # Fake User-Agent


    Acts as an addition to the above option, in that it allows you to configure Squid
    to report a fake User-Agent header. For example, using this option you could have
    your Squid report that every client being served is named Mozilla/4.2.2 (Atari
    2600; 8-bit). That would be lying, but perhaps the person looking over the logs
    at origin servers will find it amusing. If you are using the anonymize headers
    features to hide your client’s User-Agent headers, it is probably wise to include
    a fake User-Agent header because some servers will not be happy with requests
    without one. Further, this will cause problems with some web pages for your users,
    as the User-Agent header is sometimes used to decide which of a number of pages
    to send based on the features available within a particular browser. The server
    will usually end up choosing the least interesting page for your clients (e.g.,
    text only, or no JavaScript/Java/etc.).


    # HTTP Accel Host and Port


    The options you will use to configure Squid to act as an accelerator, or as a
    transparent proxy. When using your Squid as an accelerator, you must configure
    these two options to point to the IP and port of the web server you are accelerating.
    If you are using Squid to accelerate a number of virtual hosts, you must choose
    virtual as the Accel Host. Note that this opens potential security problems, in
    that your Squid will then be open to users outside of your network as a proxy.
    This can be avoided via proper firewall rules on your router or on the Squid system
    itself. Finally, if you are operating your Squid transparently, you would also
    configure the Accel Host to be virtual and the Accel Port to be 80. Outgoing port
    80 traffic will then need to be redirected to your Squid process in order for
    it to work. This is discussed in much greater detail in the tutorial on transparent
    proxying. These options configure the httpd_accel_host and httpd_accel_port directives.


    # HTTP Accel with Proxy


    Allows you to operate your cache as both an accelerator and a caching proxy. This
    option tells Squid to accept both traditional proxy connections and requests intended
    for an origin web server. This option correlates to the httpd_accel_with_proxy
    directive.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# HTTP Accel Uses Host Header


    Configures Squid to use the host header information as described in the HTTP 1.1
    specification. This option must be turned on for transparent operation, in order
    for virtual servers to be cached properly. This option correlates to the httpd_uses_host_header
    directive.


    # WCCP Router Address, WCCP Incoming Address, WCCP Outgoing Address


    The Web Cache Coordination Protocol is a standard method of implementing an interception
    proxy. Routers that support WCCP can be configured to direct traffic to one or
    more web caches using an efficient load balancing mechanism. WCCP also provides
    for automatic bypassing of an unavailable cache in the event of a failure. Usually,
    configuring Squid to use WCCP is as simple as configuring it for interception
    proxying, using the steps discussed later in the Interception Caching tutorial
    and then entering the address of the router in the WCCP Router Address field.
    The other two options are very rarely needed, but can be used in some complex
    network environments where incoming and outgoing data must travel via different
    routes or from different addresses. These options correspond to the wccp_router,
    wccp_incoming_address, and wccp_outgoing_address directives and are disabled by
    default.


    # Tutorial: A Basic Squid Proxy Configuration


    Squid is almost entirely preconfigured for traditional proxying as soon as it
    is installed from source distribution or from a binary package. It can be up and
    running in just a few minutes, if your needs are simple. This tutorial covers
    the first changes you’ll need to make to get your caching proxy up and running
    quickly.


    > NOTE

    > This tutorial assumes you have already installed Squid and have configured Webmin
    to know where to find all of the appropriate Squid files. If you’ve installed
    from a vendor-supplied package, Webmin will probably already know where to find
    everything.


    # Opening Access to Local Clients


    The only change that must be made before using your Squid installation is to open
    access for your local users. By default Squid denies access to all users from
    any source. This is to prevent your proxy from being used for illicit purposes
    by users outside of your local network (and you’d be amazed at how many nasty
    things someone can do with an open proxy).


    Click the Access Control icon to edit the access control lists and access rules
    for your proxy. First, create a new ACL by selecting Client Address from the dropdown
    list and then clicking Create new ACL. This will open a new page where you can
    define your ACL. First, enter a name, like localnet, in the Name field. Next,
    specify your network either in terms of a network range, or by specifying a network
    and netmask. If you have only 10 addresses, for example, that you would like to
    be permitted to use your proxy you could enter, for example, a From IP of'
  merge: -1
  img_proc: true
- pgno: 270
  md: '192.168.1.20 and a To IP of 192.168.1.30. Or if you have a whole network to
    which you would like to allow proxy access, you could enter a From IP of 192.168.1.0
    and a Netmask of 255.255.255.0. Click Save.


    Next, you need to add a proxy restriction to permit the clients matched by the
    localnet ACL to use the proxy. So click the Add proxy restriction link. On the
    proxy selection page, choose the Allow option for the Action, and select localnet
    in the Match ACLs selection box. Click Save.


    Then use the arrow icons to the right of the list of proxy restrictions to move
    the rule you’ve just created above the Deny all rule.


    # Initializing the Cache Directory


    You may have noticed, on the front page of the Webmin Squid module, there is a
    warning that the configured cache directory has not been initialized. Before starting
    Squid, you’ll want to make sure it gets initialized. Webmin, of course, will do
    this for us. Just click the Initialize Cache button. If you plan to alter your
    cache directories to something other than the default, you’ll likely want to do
    so in the Cache Options page before initializing the directories. Details are
    covered earlier in this chapter.


    # Starting Squid and Testing


    To start Squid, click the Start Squid link in the upper right corner of the main
    module page. It is worthwhile to then check the information provided by Squid
    during its startup in the cache.log. You can use the Webmin file manager, or you
    can add this log to the System Logs module for viewing there (read the section
    covering that module for information on adding non-syslog log files to make them
    viewable). Squid is usually quite forthcoming about problems that might prevent
    it from starting or operating correctly.


    To test your new Squid, configure a browser on your local network to use the Squid
    server as its proxy. Doing this is browser dependent. In Netscape and Mozilla,
    the proxy options are located under the Advanced:Proxy Settings category, while
    in Internet Explorer, they are located under Internet Options:Connections. Squid
    can act as a proxy for HTTP, HTTPS, FTP, Gopher, and WAI S protocols. Socks is
    not supported by Squid, though there are a few good Open Source Socks proxies
    available.


    Now, just browse for a bit to be sure your caching proxy is working. Take a look
    in the access.log for information about whether a request was served with a cache
    hit or a cache miss. If Calamaris is installed on your system, Webmin will generate
    an access report on demand whenever you click the Calamaris icon on the Squid
    module main page.


    # Tutorial: Interception Proxying


    Ordinarily, when using Squid on a network to cache web traffic, browsers must
    be configured to use the Squid system as a proxy. This type of configuration is
    known as traditional proxying. In many environments, this is simply not an acceptable
    method of implementation. Therefore Squid provides a method to operate as an'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'interception proxy, or transparently, which means users do not even need to
    be aware that a proxy is in place. Web traffic is redirected from port 80 to the
    port where Squid resides, and Squid acts like a standard web server for the browser.


    Using Squid transparently is a two-part process, requiring first that Squid be
    configured properly to accept non-proxy requests, and second that web traffic
    gets redirected to the Squid port. The first part of configuration is performed
    in the Squid module, while the second part can be performed in the Linux Firewall
    module. That is, assuming you are using Linux, otherwise you should consult the
    Squid FAQ Transparent Caching/Proxying [http://www.squid-cache.org/Doc/FAQ/FAQ-17.html]
    entry.


    # Configuring Squid for Transparency


    In order for Squid to operate as a transparent proxy, it must be configured to
    accept normal web requests rather than (or in addition to) proxy requests. Here,
    you''ll learn about this part of the process, examining both the console configuration
    and the Webmin configuration. Console configuration is explained, and Webmin configuration
    is shown in the figure below.


    As root, open the squid.conf file in your favorite text editor. This file will
    be located in one of a few different locations depending on your operating system
    and the method of installation. Usually it is found in either /usr/local/squid/etc,
    when installed from source, or /etc/squid on Red Hat-style systems. First you''ll
    notice the http_port option. This tells you what port Squid will use to listen
    on. By default, this is port 3128, but you may change it if you need to for some
    reason. Next you should configure the following options, as shown in Figure 12-19.


    ![](img/d84604054810a13cacfdac212ebee2f7_271_0.png)


    Figure 12-19: Transparent configuration of Squid


    ```

    httpd_accel_host virtual

    httpd_accel_port 80

    httpd_accel_with_proxy on

    httpd_accel_uses_host_header on

    ```


    These options, as described in the Miscellaneous Options section of this document,
    configure Squid as follows. httpd_accel_host virtual causes Squid to act as an
    accelerator for any number of web servers, meaning that Squid will use the request
    header information to figure out what server the user wants to access, and that
    Squid will behave as a web server when dealing with the client.

    httpd_accel_port 80 configures Squid to send out requests to origin servers on
    port 80, even though it may be receiving requests on another port, 3128 for example.
    httpd_accel_with_proxy on allows you to continue using Squid as a traditional
    proxy as well as a transparent proxy. This isn''t always necessary, but it does
    make testing a lot easier when you are trying to get transparency working, which
    is discussed a bit more later in the troubleshooting section. Finally,'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'httpd_accel_uses_host_header on tells Squid that it should figure out what
    server to fetch content from based on the host name found in the header. This
    option must be configured this way for transparency.


    # Linux Firewall Configuration for Transparent Proxying


    The iptables portion of your transparent configuration is equally simple. The
    goal is to hijack all outgoing network traffic that is on the HTTP port (that''s
    port 80, to be numerical about it). iptables, in its incredible power and flexibility,
    allows you to do this with a single command line or a single rule. Again, the
    configuration is shown and discussed for both the Webmin interface and the console
    configuration.


    > NOTE The Linux Firewall module is new in Webmin version 1.00. All previous revisions
    lack this module, so to follow these steps, you''ll need to have a recent Webmin
    revision.


    When first entering the Linux Firewall module, the Packet filtering rules will
    be displayed. For your purposes you need to edit the Network address translation
    rules. So, select it from the drop-down list beside the Showing IPtable button,
    and click the button to display the NAT rules.


    Now, add a new rule to the PREROUTING chain by clicking the Add rule button to
    the right of the PREROUTING section of the page.


    Fill in the following fields. The Action to take should be Redirect and the Target
    ports for redirect set to 3128. Next you''ll need to specify what clients should
    be redirected to the Squid port. If you know all port 80 traffic on a single interface
    should be redirected, it is simplest to specify an Incoming interface, but you
    could instead specify a Source address or network. Next, set the Network protocol
    to Equals TCP. Finally, set the Destination TCP or UDP port to 80. Click Create
    to add the new rule to the configuration. Once on the main page again, click the
    Apply Configuration button to make the new rule take effect. Finally, set the
    firewall to be activated at boot so that redirection will continue to be in effect
    on reboots.


    ```

    # iptables -t nat -I PREROUTING 1 -i eth0 -p tcp --dport 80 -j REDIRECT --to-port
    3128

    ```


    While a detailed description of the iptables tool is beyond the scope of this
    section, it should briefly be explained what is happening in this configuration.
    First, you are inserting a rule into the first PREROUTING chain of the NAT routing
    path, with the -t nat -I PREROUTING 1 portion of the command. Next you''re defining
    whose requests will be acted upon; in this case iptables will work on all packets
    originating from the network attached to device eth0. This is defined by the -i
    eth0 portion of the rule. Then comes the choice of protocol to act upon; here
    you''ve chosen TCP with the -p tcp section. Then, the last match rule specifies
    the destination port you would like for your redirect to act upon with the --dport
    80 section. Finally, iptables is told what to do with packets that match the prior
    defined criteria; specifically, it will REDIRECT the packets --to-port 3128.'
  merge: -1
  img_proc: true
