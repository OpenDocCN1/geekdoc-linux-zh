- pgno: 212
  md: '# SMTP Client Options


    The SMTP client options configures how Postfix will behave when dealing with other
    mail servers as a client, e.g., when sending mail on behalf of a user. This portion
    of the configuration primarily dictates how the server will respond to certain
    error conditions.


    # Action when listed as best MX server


    As discussed in the BIND chapter, a mail server performs a name server query to
    find the MX, or mail server, record for the destination domain. If this record
    indicates that the local server is the server to which mail should be sent, it
    can respond in a couple of ways. The default is to bounce the message with an
    error indicating a mail loop. If the field is selected and local is entered, the
    mail will be directed to the local delivery agent instead of bouncing the mail.
    This option correlates to the best_mx_transport directive.


    # Hosts/domains to hand off mail to on invalid destination


    By default, mail that cannot be delivered because the destination is invalid will
    be bounced with an appropriate error message. However, it is possible to configure
    postfix to hand off email to another server instead. This option correlates to
    the fallback_relay directive.


    # Ignore MX lookup error


    If a name server query fails to provide an MX record, the server defaults to deferring
    the mail and trying again later. If Yes is selected instead, an A record query
    will be done and an attempt will be made to deliver to the resulting address.
    This option correlates to the ignore_mx_lookup_error directive.


    # Skip 4xx greeting


    If a remote server responds to a connection with a 4XX status code, Postfix will,
    by default, select the next available mail exchanger specified by the MX records.
    If set to No, mail delivery will be deferred after the first mail delivery attempt,
    and another attempt will be made later. This option correlates to the smtp_skip_4xx_greeting
    directive.


    # Skip wait for the QUIT command


    This option configures whether Postfix will wait for the receiving mail server
    to respond to the QUIT command. This option correlates to the smtp_skip_quit_response
    directive and defaults to no.'
  merge: -1
  img_proc: true
