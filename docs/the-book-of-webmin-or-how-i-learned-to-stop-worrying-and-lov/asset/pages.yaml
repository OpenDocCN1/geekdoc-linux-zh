    ```


    Here you can see that I''ve chosen the default in some locations and deviated
    from the default in others. The most likely changes you may want to make include
    changing the default installation directories and altering the port on which Webmin
    will listen. Webmin also politely generates an uninstall.sh script that allows
    you to easily remove Webmin from your system.'
  merge: -1
