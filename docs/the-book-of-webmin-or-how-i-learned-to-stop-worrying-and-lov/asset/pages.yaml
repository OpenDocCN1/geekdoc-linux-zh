- pgno: 310
  md: '# STEAL THIS COMPUTER BOOK 3


    # What They Won’t Tell You About the Internet


    by WALLACE WANG


    This offbeat, non-technical book looks at what hackers do, how they do it, and
    how readers can protect themselves. The third edition of this bestseller adopts
    the same informative, irreverent, and entertaining style that made the first two
    editions a huge success. Thoroughly updated, this edition also covers rootkits,
    spyware, web bugs, identity theft, hacktivism, wireless hacking (wardriving),
    biometrics, and firewalls.


    > "If this book had a soundtrack, it’d be Lou Reed’s Walk on the Wild Side." —InfoWorld


