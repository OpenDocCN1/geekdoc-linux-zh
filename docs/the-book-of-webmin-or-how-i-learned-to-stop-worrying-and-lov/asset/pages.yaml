  md: '![](img/d84604054810a13cacfdac212ebee2f7_309_0.png)


    # THE BOOK OF OPENOFFICE.ORG


    Your Guide to the Free Microsoft Compatible Office Suite


    author tba


    This book is the complete guide to using this remarkably powerful and stable office
    suite. Practical and task-based, it includes coverage of installation, working
    with documents and spreadsheets, creating presentations and databases, using the
    draw utility, and much more. Clear and straightforward examples make it easy to
    switch from MS Office to OpenOffice.org.


    2003, 432 PP., $34.95 ($52.95 CDN)

    ISBN 1-886411-98-0


    ![](img/d84604054810a13cacfdac212ebee2f7_309_1.png)


    # ABSOLUTE OPENBSD


    UNIX for the Practical Paranoid


    by MICHAEL W. LUCAS


    This practical guide to mastering the powerful and complex OpenBSD operating system
    is for the experienced UNIX user who wants to add OpenBSD to his or her repertoire.
    It takes you through the intricacies of the platform and teaches how to manage
    your system, offering friendly explanations, background information, troubleshooting
    suggestions, and copious examples throughout.


    2003, 600 PP., $39.95 ($61.95 CDN)

    ISBN 1-886411-99-9


    ![](img/d84604054810a13cacfdac212ebee2f7_309_2.png)


    # THE LINUX COOKBOOK


    Tips and Techniques for Everyday Use


    by MICHAEL STUTZ


    Over 1,500 step-by-step Linux “recipes” cover hundreds of day-to-day issues, including
    printing; managing files; editing and formatting text; working with digital audio;
    creating and manipulating graphics; and connecting to the Internet.


    Winner of the Outstanding Academic Title Award from Choice Magazine


    2001, 402 PP., $29.95 ($44.95 CDN)

    ISBN 1-886411-48-4'
