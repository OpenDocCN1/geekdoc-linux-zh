    **************************************************

    Operating system name:  Redhat Linux

    Operating system version: 8.0


    **************************************************

    Webmin uses its own password protected web server to provide access to the administration
    programs. The setup script needs to know :

    - What port to run the web server on. There must not be another web server already
    using this port.

    - The login name required to access the web server.

    - The password required to access the web server.

    - If the webserver should use SSL (if your system supports it).

    - Whether to start webmin at boot time.


    Web server port (default 10000):

    Login name (default admin): root

    ```'
  merge: -1
  img_proc: true
- pgno: 31
  md: '```

    Login password:

    Password again:

    The Perl SSLeay library is not installed. SSL not available.

    Start Webmin at boot time (y/n): n

    **************************************************

