- pgno: 32
  md: '# Installing from an RPM


    Installing from an RPM is even easier. You only need to run one command:


    ```

    [root@delilah root]# rpm -Uvh webmin-1.050-1.noarch.rpm

    ```


    This will copy all of the Webmin files to the appropriate locations and run the
    install script with appropriate default values. For example, on my Red Hat system,
    the Webmin perl files will be installed in /usr/libexec/webmin while the configuration
    files will end up in /etc/webmin. Webmin will then be started on port 10000. You
    may log in using root as the login name and your system root password as the password.
    It''s unlikely you will need to change any of these items from the command line,
    because they can all be modified using Webmin. If you do need to make any changes,
    you can do so in miniserv.conf in /etc/webmin.


    # Installing from a pkg


    To install on a Solaris machine using the pkg file, the steps are almost as simple
    as using the RPM. First, unzip the file using gzip and then use pkgadd to install
    the package:


    ```

    root# gunzip webmin-1.050.pkg.gz

    root# pkgadd -d webmin-1.050.pkg

    ```


    This will install Webmin into /usr/opt and run the install script with appropriate
    default values.


    # After Installation


    After installation, your Webmin install will behave nearly identically, regardless
    of operating system vendor or version, location of installation, or method of
    installation. The only apparent differences between systems will be that some
    have more or fewer modules because some are specific to one OS. Others will feature
    slightly different versions of modules to take into account different functioning
    of the underlying system. For example, the package manager module may behave differently,
    or be missing from the available options entirely, depending on your OS.


    **NOTE** A common problem after installing Webmin is that some modules do not
    work or do not seem to work completely. This can be caused by some of the software
    being installed in non-standard locations on your system. By default, when Webmin
    is installed, it creates a configuration for each module based on the standard
    filesystem structure and configuration file locations for your selected OS. If
    you have installed software from source tarballs instead of packages, or packages
    from a different source than your OS vendor, Webmin may not be able to find the
    files it needs to function correctly. Correcting these problems is usually a simple
    matter of modifying the configuration for the individual modules to match the
    actual locations of your configuration files.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Changing Webmin Passwords from the Command Line


    Generally, once Webmin is installed all configuration of Webmin can be performed
    from within Webmin. However, there are a few things that can lead to being unable
    to log in. A common question is how to log in if you''ve forgotten the Webmin
    administrator password. If you have root access to the machine in question (i.e.,
    you haven''t also forgotten your system password), you can use the changepass.pl
    tool, that is found in the same directory as all the other Webmin executable files
    (this is the directory in which you installed Webmin). For example, to use changepass.pl
    to change the root password, you could use the following command:


    ```

    # ./changepass.pl /etc/webmin root newpassword

    ```


    In the preceding example, the first option should be the directory where your
    Webmin configuration files are located. The second is the login name of the user
    whose password you''d like to change. The third is what you''d like the password
    to be changed to. Note that this script only works if you are logged in as the
    system root user and can change any Webmin user''s password.


    # Changing the Webmin Port from the Command Line


    Another problem after installation may be that a firewall prevents access to the
    Webmin port from across a WAN link (if, for example, you are remotely maintaining
    your Webmin server). If this is the case, you will want to consult with the firewall
    administrator to find out whether port 10000 can be opened, or if not, what port
    you can use for your Webmin installation. Changing the port on which Webmin runs
    after installation is also a pretty simple process. Simply edit the file miniserv.conf
    in the /etc directory where your Webmin configuration files were installed (this
    is likely one of the following: /etc/webmin, /usr/local/webmin/etc, or /opt/webmin/etc).
    You''ll find a port directive. Change this to whatever port you need Webmin to
    listen on, and then restart the Webmin web server.


    # Restarting Webmin from the Command Line


    Restarting the Webmin server is usually required when making changes to the miniserv.conf
    file. Some OS versions provide a standard method to stop, start, and restart services,
    which Webmin often supports. But all versions of Webmin on all OS versions will
    have start and stop scripts, usually located in the configuration file directory
    of Webmin.


    Restarting the Webmin server can be accomplished in a few different ways depending
    on the OS and version. Under Red Hat Linux and its derivatives, for example, you
    would use the standard service command:


    ```

    [root@delilah /root]# /sbin/service webmin stop

    [root@delilah /root]# /sbin/service webmin start

    ```'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'If your OS does not have a standardized service control tool like service,
    you may use the standard Webmin stop and start scripts located in the Webmin etc
    directory:


    ```

    [root@delilah /root]# /etc/webmin/stop; /etc/webmin/start

    ```


    The miniserv.conf file contains many other options, but you will only need to
    edit a few manually. Other common problems that users run into include restricting
    their access by IP. This can cause them a problem if their service provider changes
    the IP. Simply mistyping an IP can also lead to the same trouble. The remedy for
    this problem is to add the correct IP to the allow= directive and then restart
    the Webmin server.'
  merge: -1
  img_proc: true
- pgno: 35
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 2


    # LOGGING IN


    ![](img/d84604054810a13cacfdac212ebee2f7_36_0.png)


    # Logging In with Netscape or Internet Explorer


    Logging in to Webmin is easy. Open a web browser, such as Netscape or Internet
    Explorer, on any machine that has network access to the server on which you wish
    to log in. Browse to port 10000 on the IP or host name of the server, as shown
    here.


    ![](img/d84604054810a13cacfdac212ebee2f7_36_1.png)


    Webmin will then respond with either an authentication window or an authentication
    form, in which you can enter the administrator username (usually "root" or "admin")
    and password. After successful authentication, you will be greeted with the Webmin
    index page. The type of login form you receive (either on a web page or in a popup
    window) depends on the configuration of the Webmin server. The differences between
    session authentication (Figure 2-1) and standard HTTP authentication are discussed
    later in the book.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '![](img/d84604054810a13cacfdac212ebee2f7_37_0.png)


    Figure 2-1: Session authentication


    **NOTE** Many systems are configured with Webmin running in SSL encrypted mode.
    On these systems, you will log in using a URL beginning with https:// rather than
    http://. Also, at least one Linux distribution that includes Webmin, specifically
    Caldera, installs it on port 1000 rather than 10000. This is theoretically a more
    secure arrangement, however, be aware that some firewalls will prevent you from
    accessing your Webmin-enabled server from outside of the local network if Webmin
    runs on a port below 1024.


    # Logging In with Lynx


    Sometimes, it may be desirable or necessary to administer your system from the
    command line without the benefit of a GUI. Luckily, one does not have to give
    up Webmin entirely in these circumstances. Using Lynx, or a similarly capable
    text-mode web browser, one can log in and use most of the Webmin modules much
    the same as using a graphical browser. Logging in when Webmin is using session
    authentication is identical to logging in with a graphical browser, but logging
    in when Webmin is configured to use traditional HTTP authentication is slightly
    different. Lynx requires that authentication information be included on the command
    line when starting up:


    ```

    [joe@delilah joe]$ lynx -auth root:passwd http://delilah:10000

    ```


    **CAUTION** If you plan to administer your system via a text-mode browser, you
    will want to choose an alternate theme rather than the new default MSC.Linux theme.
    The old default theme, or the Swell Technology theme has a simpler icon and table
    layout, allowing Lynx and other text-mode browsers to display them more effectively.
    The MSC.Linux theme, while attractive in a GUI browser, uses a complex layout
    that leads many areas of Webmin to be difficult to read and impossible to use
    in a text-mode browser.


    Another limitation of using a command line client is that SSL is not well supported
    by all versions of Lynx and other text-mode browsers. This means you may need
    to run your Webmin server without encryption; therefore, more extreme measures
    should be taken to ensure the security of your server. Securing a Webmin installation
    will be discussed in detail in later chapters.


    # A First Look


    Webmin is divided into a number of modules that each allow you to administer a
    single aspect of your system. Modules exist for most common, and many uncommon,
    system administration tasks. The standard modules provide a graphical interface
    for: Apache, Squid, Bind, NFS, man pages, Sendmail, Postfix,'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Samba, and much more. There also exists a wide array of third-party modules
    that provide even more extensive functionality. This book focuses on the standard
    modules, but may expand to encompass other modules in time.


    Upon first logging in, you''ll see a row of tabs and a number of icons (Figure
    2-2). The tabs are labeled Webmin, System, Servers, Hardware, Cluster, and Others.
    You may also have, depending on your OS and version, one or two additional tabs.
    The selected tab when first logging in is always Webmin. This category is where
    all of the Webmin-related configuration details are located.


    ![](img/d84604054810a13cacfdac212ebee2f7_38_0.png)


    Figure 2-2: A first look


    The view from Lynx is actually pretty similar if using one of the traditional
    themes (Figure 2-3). The MSC.Linux theme makes many links inaccessible when using
    Lynx; overall usage is quite difficult when you''re working in a text-mode browser,
    so be sure to switch to a more conventional theme if you''ll be administering
    your system from the command line. On my server using the Swell Technology theme,
    Webmin is quite usable entirely from a text console, making Webmin useful even
    when no browser is available. The MSC.Linux theme can also be rather heavyweight
    when administering a server across a WAN link with a graphical browser. This is
    because the number and size of images makes browsing the pages rather slow even
    via a fast connection.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/d84604054810a13cacfdac212ebee2f7_39_0.png)


    Figure 2-3: A first look from Lynx


    Because Webmin is web-based, interacting with the GUI will probably be immediately
    comfortable, though for beginners it may take a few minutes to locate specific
    modules or features. In the following chapters, the discussion will focus on specific
    Webmin modules and the services that the modules configure. It proceeds through
    the category tabs from left to right, beginning with Webmin and ending with Others.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 3


    # WEBMIN CONFIGURATION


    ![](img/d84604054810a13cacfdac212ebee2f7_40_0.png)


    Webmin provides a number of configurable options and access control features,
    as well as flexible action logging that provides you with the maximum flexibility
    and security of the Webmin server and the various Webmin system administration
    modules.


    These features are accessed through the Webmin tab on the index page of Webmin.
    When you display the Webmin tab, you see icons for Usermin Configuration, Webmin
    Actions Log, Webmin Configuration, Webmin Servers Index, and Webmin Users. Keep
    in mind that the modules located under the Webmin tab are for configuring Webmin
    itself, not the underlying system.


    So, for example, creating a user in the Webmin Users module will not create a
    system user, only a Webmin user. Likewise, the Webmin Actions Log module allows
    you to search and view the Webmin log, not any system or service log that might
    exist. We''ll get to those kinds of options later. For the moment, we''re going
    to skip over Usermin Configuration because Usermin receives full coverage in the
    next chapter.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Webmin Actions Log


    The Webmin Actions Log page provides access to the Webmin log. You can configure
    this log for each module and individual users. This module does not configure
    the logs, but provides you with a means to search the logs for actions performed
    by particular logged users or actions performed in given logged modules. Configuration
    of Webmin logging capabilities is covered in the Webmin Configuration section.


    With this module it is possible to search for actions by specific users, within
    specific modules, for a given range of dates, or any combination of those qualifications.
    For example, if you manage a number of junior system administrators and you''d
    like to find out if one of them has edited an Apache virtual server configuration
    in the past week, this module makes those kinds of questions easy to answer (assuming
    logging to that degree is enabled, of course).


    # Webmin Configuration


    The Webmin Configuration module (Figure 3-1) allows you to configure most of the
    important aspects of Webmin itself, as well as install new modules, upgrade existing
    modules, and upgrade Webmin itself. It also provides a means to change the port
    and address where the Webmin miniserv.pl web server listens for connections, select
    different languages, enable or disable SSL encryption, and configure the Webmin
    built-in logging features.


    ![](img/d84604054810a13cacfdac212ebee2f7_41_0.png)


    Figure 3-1: Webmin Configuration'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# IP Access Control


    Webmin has its own web server, called miniserv.pl, which provides a simple IP
    access control feature. This page allows you to configure this option. You may
    enter IP networks (such as 192.168.1.0), IP host addresses (such as 192.168.1.79),
    and host names (such as joesbox.penguinf eet.org). It is wise to limit access
    to the Webmin server to just those addresses that are trusted. While Webmin has
    no known exploits in versions greater than 0.970, if someone were to obtain your
    password, this would provide an additional level of protection from unauthorized
    access. This option configures the accept and deny directives in the miniserv.conf
    file. The default is to allow any address to access Webmin.


    > **CAUTION** *Be aware that using IP access controls within Webmin is an application-level
    security feature. In other words, if ever an exploitable problem were discovered
    in the Webmin miniserv.pl web server, it would still be accessible from an IP
    not permitted to use Webmin. So it is still theoretically possible to attack the
    web server even if the user isn''t offered a login page. However, this is a pretty
    unlikely scenario, requiring a bug in miniserv.pl that is exposed even when an
    authentication page is not provided.*


    # Port and Address


    The Webmin server will, by default, listen on every active IP address on the system.
    But if you have multiple addresses and would prefer Webmin to only listen on one
    of them, you may use this option. So, for example, if you have one network interface
    connected directly to your local network and a second network interface connected
    to the Internet, you could improve security by causing Webmin to only listen on
    the local network. In this case, any requests from the Internet at large would
    be ignored, but it would still be possible to connect from local computers. This
    can be a very effective first line of defense. After all, if the bad guys can''t
    even talk to the Webmin server, they certainly can''t try anything funny to break
    into it.


    The Listen on Port option specifies the network port on which Webmin will listen.
    In a standard Webmin install this will be port 10000, although Caldera installs
    it on port 1000. Some firewalls may restrict access to ports below 1024, and some
    may restrict even ports above 1024. If your network has strict proxy restrictions
    that prevent connecting on port 10000, you may wish to try port 553 or 443 (assuming
    these ports are not already in use on your Webmin server for normal SSL service).
    These ports will nearly always be usable through a proxy, even when using an SSL
    enabled Webmin.


    > **NOTE** *In a proxied environment, your client browser must use a CONNECT method
    to construct a tunnel through the proxy device. Because of the potential for abusing
    CONNECT requests most proxies prevent this method on all but a few ports. The
    standard port for SSL web connections is 443, and so it is the most likely port
    to be available for CONNECT requests. If your proxy is running Squid and you have
    administrator privileges, you may wish to add Webmins default port to the allowed
    SSL ports as documented in the Squid chapter of this book.*


    As mentioned briefly in the installation chapter, it is possible to alter these
    configuration settings in the miniserv.conf configuration file in addition to
    graphical configuration with the Webmin Configuration module. This may be'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'necessary if a firewall prevents you from accessing port 10000 and you only
    have console or SSH access to the machine. In this case, editing the port option
    will alter the port, and the bind directive configures the address on which Webmin
    listens. Whenever editing the miniserv.conf file, Webmin must be restarted for
    changes to take effect.


    # Logging


    As mentioned earlier, Webmin provides very flexible logging features. With these
    features, you can very easily monitor what actions those users with administrator
    privileges are performing on the server. It is also possible to log actions based
    on the module where the actions are performed. The option **Log resolved host
    names** will cause Webmin to provide a host name rather than just an IP address
    for the client computer that performed an action. And **Clear logfiles every...hours**
    causes Webmin to rotate its own logs and keep them from overfilling the disk with
    old logs. If long-term logs are needed for security auditing purposes, it may
    be wise to include the Webmin log in your normal system backup rotation.


    The decisions regarding what to log, whose actions to log, and how long to store
    those logs should be carefully considered for your situation. In some cases, a
    log is unnecessary, while in others it may be required by company policy or useful
    in addressing the security needs of your environment. If logging is enabled, care
    should be taken to ensure Webmin will have plenty of disk space in the Webmin
    log directory, as some options can lead to quite verbose logging (**Log changes
    made to files by each action**, for example). Remember that Webmin action logging
    has nothing to do with the logging features of other parts of the system. Syslog
    is configured separately in the **System:System Logs** module, while application-specific
    logging is usually configured within the application module.


    # Proxy Servers


    Webmin provides several tools that must connect to the Internet to operate correctly.
    These include the **Webmin Update** feature, the **Software Packages** module
    and others. If your local network uses a proxy to access Web or FTP sites on the
    Internet, you may configure those settings here. If your proxy requires authentication,
    the username Webmin will use to log-in can also be configured on this page in
    the **Username for proxy** and **Password for proxy** fields.


    # User Interface


    The Webmin user interface is configurable in a number of ways. In this module
    you may configure the colors of your Webmin pages. The colors are expected to
    be in standard hex triplets, as used in HTML markup on the Internet. You may also
    choose to use the standard fonts of your browser to display page titles, rather
    than the font provided by the theme you are using. Finally, you may configure
    where on the page Webmin will display the login name and host name of the server.
    This page does not configure Webmin themes, which are configured on their own
    page, and the changes that can be made here are mild by comparison to the possibilities
    when using themes. Be aware also that these changes may not'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'take effect when using a theme other than the old standard Webmin theme. For
    example, the new MSC.Linux theme overrides all of these options with its own standard
    values.


    # Webmin Modules


    As previously mentioned, one of the best things about Webmin is that it is completely
    modular. Every server daemon, every system feature, every Webmin feature, has
    its own module that connects to the core Webmin libraries and answers to the Webmin
    miniserv.pl web server. Because of the elaborate, but still easily comprehensible,
    modular framework that Webmin provides, it is very easy to write full-featured
    modules that integrate seamlessly into Webmin and your operating system.


    # Install Module


    From this page, you can install new modules, either from a local file, an uploaded
    file, or a file downloaded from an FTP site or website. Webmin module packages
    are simply tar archive files that contain the complete directory structure of
    the module. These modules end in the suffix .wbm


    > NOTE A great resource for additional Webmin modules is the Third Party Modules
    for Webmin [http://www.thirdpartymodules.com/webmin] page, run by Richard Teachout.
    Richard is a longtime fan and supporter of Webmin and a regular contributor to
    the Webmin discussion lists. After spending some time on the list, he perceived
    a need for a comprehensive resource for modules that work with Webmin. At the
    time of this writing, there are over 200 modules listed at his site, though it
    should be mentioned that the site also lists the modules included in the standard
    Webmin distribution. If you''ve written a Webmin module, you should post it to
    this site, so others will be able to easily find and benefit from your efforts.
    It is also a great place to find example code to help you when writing your own
    modules (in addition to the standard modules, of course!). Beware, however, that
    as with any group of free software the modules vary wildly in quality. Some are
    excellent and on par with any of the best standard Webmin modules, while others
    are in such an early stage of development that they are not useful.


    # Clone Module


    The Clone Module feature provides an impressive amount of flexibility for administrators
    who must provide limited administration access for several instances of the same
    software on the same machine. If, for example, you have two different Apache configurations
    running on your system, you could clone the Apache module to allow different users
    to access the different Apache configurations.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '> **CAUTION** *While this feature does allow interesting and powerful options
    for multiple users configuring similar services, Webmin should not yet be viewed
    as an ideal tool for administering a virtual hosting server, where many users
    configure the Apache virtual servers, Sendmail aliases, and DNS entries. There
    are a number of commercial and Open Source efforts underway to provide such services
    within the framework of Webmin. At the time of this writing none are production-ready,
    but with the number of people pursuing the goal, it is likely that such a tool
    is not far off.*


    To clone a module, select the module to clone from the drop-down menu, then enter
    a new name for the module. To avoid the problem of the new module interfering
    with the original module, you will want to carefully consider the service being
    administered by the cloned module. Usually, you will need to set up the new clone
    with a wholly separate installation of the service being configured. So, for example,
    if you have cloned Squid so that you may run two different Squid processes you
    *must* configure them to use separate configuration files, cache directories,
    log files, and process IDs. If this precaution is not taken, one or both of the
    processes will behave erratically or fail to work at all.


    # Example: Cloning the Squid Module


    To take the example further, let''s create a clone of the Squid module and configure
    two Squid processes to run on the same server without stepping on each other.
    First, copy the squid.conf configuration file from the command line or the Webmin
    File Manager to a file named squid2.conf


    ```

    [root@delilah /]# cp /etc/squid/squid.conf /etc/squid/squid2.conf

    ```


    Next, create your module clone of the Squid module (referred to as Squid2 from
    here on). Browse to the newly created clone module, and edit the module configuration
    by clicking the Module Config link in the upper left corner of the Squid2 index
    page. Here you should change the Full path to squid config file to point to the
    newly created configuration file. You will also need to change the Command to
    start squid and Command to stop squid to point to another file name as well; let''s
    call it /etc/rc.d/init.d/squid2. We''ll have to actually create these files before
    trying to start up our new Squid process.


    We will also need to alter the Full path to PID file to point to squid2.pid rather
    than squid.pid and change the log directory name. I usually use /var/log/squid2
    for a cloned Squid process. This is all that is required within the module configuration
    for the moment. Click Save to save your changes and return to the Squid2 index
    page.


    Now that we''ve told Webmin the file to edit, we can actually edit it to configure
    Squid to operate independently of Squid. First we''ll need to change Squid2 to
    operate on a different port or IP than Squid, because no two processes can listen
    on the same IP-port combination. 8080 is a good secondary cache port to use. This
    option is configured in Squid2:Ports and Networking. Next alter the cache directories
    to something different than the Squid cache directories, because they cannot be
    shared. The same must be done for the access.log,'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'cache.log, and store.log. As mentioned previously, I usually place my Squid2
    logs into /var/log/squid2, so this directory must be created with ownership by
    the same user and group names that Squid runs under (squid:squid on Red Hat Linux).


    Finally, copy your Squid start-up script to a new location and modify it to call
    Squid with the new configuration file and check against the new PID file. For
    example, on my Red Hat system I would copy /etc/rc.d/init.d/squid to /etc/rc.d/init.d/squid2.
    You can now configure access controls in Webmin to allow access to separate administrators
    for each Squid process or further modify the Squid2 configuration to provide different
    functionality than the primary Squid process.


    # Delete Modules


    In this section, you may select any modules that you''d like to delete from your
    Webmin installation. Beware that using this form will delete the selected modules
    entirely from the system. If you decide later to use a deleted module, you will
    have to download the module again and reinstall it. It is usually a better idea
    to simply remove the module from each users access list (possibly even including
    root), rather than deleting the module here. However, if disk space is a concern,
    you can use this to delete all unneeded modules from your system.


    # Operating System


    Webmin knows how to interact with your system based on configuration files for
    each module that are selected based on the operating system configured here. If
    your system has Webmin preinstalled, you usually will not need to concern yourself
    with this. But if you upgrade your system, and the new version moves some configuration
    files to new locations, updating this may be necessary. On this page you may also
    set the search path for both programs (like system commands) and for libraries
    (such as for the password encryption library). Again, these options rarely need
    to be changed unless you have installed system tools and configuration files in
    odd locations on your system.


    > NOTE In current versions of Webmin, at least up to 1.020, changing the OS does
    not alter existing module configuration files and will only apply to newly installed
    modules. A future version will likely alter this behavior to modify the already
    installed module configurations only if they have not been altered by the user.


    # Language


    Webmin supports a large number of languages for titles and module text. This page
    allows you to choose the language of your Webmin. New languages are being added
    regularly. Users of languages that are not supported are encouraged to write a
    translation and send it to the author of Webmin. He''s always happy to receive
    new translations, and users are always happy to find that their native language
    is one that is provided with the distribution.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Index Page Options


    This page allows you to configure the layout of the Webmin index pages. You may
    choose the number of icons to display per row using the Number of Columns field.
    The Categorize modules? selects whether modules will be grouped under category
    tabs based on the type of function they perform. The Default category is the category
    that will be displayed when first logging in to Webmin. An alternative header
    can be used by selecting the Use alternative header option, which provides a somewhat
    different appearance by placing the host information on the upper right side of
    the display rather than below the Webmin title. Finally, selecting Go direct to
    module if user only has one? will cause a user to see only the module they have
    access to, rather than the Webmin index page when logging in.


    # Upgrade Webmin


    Using this page, you may upgrade your Webmin to the latest version automatically
    from the Webmin home page or from a local or uploaded file. This module will use
    a package management system to perform the update if one is available on your
    system. If, for example, you have an RPM-based system like Caldera, Red Hat, or
    Mandrake, this feature will upgrade from an RPM package (it even knows how to
    find the correct package type for your system on the Webmin home page!).


    # Authentication


    Webmin provides some nice features for preventing brute force password-cracking
    attacks on your server, as well as protection against "forgetful users." If your
    Webmin server is widely accessible and provides service to many users, it is probably
    wise to make use of these features to maximize the security of your system. Security
    policy in your company may even require usage of some or all of these features.


    Password timeouts provide a means to prevent brute force password attacks by limiting
    the frequency of login attempts by a given user. If enabled, Webmin will block
    hosts that have a given number of failed login attempts. The time to block the
    host is configurable in seconds. Webmin will expand the delay on continuing failed
    login attempts from the same host. Logging of blocked logins can also be enabled.


    The next option, Log blocked hosts, logins and authentication failures to syslog
    configures Webmin to log authentication failures and blocked addresses attempting
    to log in to syslog. These logs will usually appear in the secure or auth file
    in your system log directory.


    Session authentication provides a means of logging users out after a specified
    time of inactivity. This can help prevent unauthorized users from accessing the
    server by simply using the computer of someone who does have access. This isn''t
    fool-proof, as many browsers now have password management features and authorized
    users may store their passwords on the local computer, making them accessible
    to anyone with access to the computer. If security is a concern, you'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'should strongly discourage users from saving login information for the server
    on their local machine, as well as discouraging leaving open browser sessions
    when away from their desk or office.


    Finally, you may choose to allow logins from users on the same machine where Webmin
    is running based on the username. This feature should only be used for single-user
    machines, where security is not a major concern. If enabled, anyone with access
    to the local machine will easily be able to gain root access to your system.


    > **CAUTION** *As any complete system administration tool must, the Webmin web
    server runs with root privileges. Security should always be a first priority for
    any publicly accessible Webmin-enabled system. A weak security policy, or no security
    policy at all, is an invitation for disaster. A comprehensive security policy
    will include a good firewall, an intrusion detection system, vigilance with regard
    to software updates and errata from your OS vendors, and perhaps most importantly
    education of users and administrators of your network.*


    # Reassign Modules


    As mentioned earlier, Webmin categorizes modules based on the function they perform,
    by default. This page provides a simple means for moving modules to new categories
    if you find the default categorization is confusing to you. Some third-party modules,
    written before the categorization features were added to Webmin, are miscategorized
    into the Others category by default, so you may wish to manually move them to
    their more sensible locations using this module.


    # Edit Categories


    Instead of moving modules within existing categories it may be most sensible to
    create a new category for your favorite modules or for custom modules written
    just for your organization. This page allows you to create new module categories,
    as well as rename or relabel old ones.


    # Webmin Themes


    One of the more fun additions to the Webmin feature set is that of “theme-ability.”
    Themes in Webmin are very flexible, allowing a theme developer to modify nearly
    every single aspect of the appearance and layout of the Webmin pages. For example,
    in the screenshots throughout this guide, you may have noticed that the icons
    and titles are not the same as the standard Webmin appearance. These screenshots
    were taken on a Webmin using the Swell Technology theme, which is a custom theme
    designed by the author of this book with some help and pointers from Youngjin
    Hahn (aka Artwiz of Themes.org fame), and Charity Baessell (the webmistress and
    designer at Swell Technology).


    > **TIP** *For information on making your own themes for Webmin, you can consult
    the Creating Themes [http://www.webmin.com/modules.html#theme] section of the
    Webmin module developers guide.*'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Switching amongst installed themes is simply a matter of selecting the preferred
    theme and then clicking the Change button. Installing a new theme requires you
    to choose the location of the file (Webmin themes have a suffix of .wbt) and then
    clicking Install Theme. Changing themes will require a forced refresh of your
    browser display in order for all new icons and title images to be displayed because
    browsers often cache images and pages. To force a refresh in Netscape, Mozilla,
    and related browsers, press and hold the SHIFT key, while clicking the Refresh
    button. Similarly, in Internet Explorer, press and hold the CTRL key while clicking
    the Refresh button. Themes can be chosen systemwide or for an individual user
    in both Webmin and Usermin.


    # Trusted Referers


    Because Webmin is web-based, it is accessed from your browser. Browsers often
    store authentication information and will automatically resend it on demand from
    the Webmin server. Because of this, it could be possible for remote websites to
    trigger dangerous actions on your Webmin server (assuming the website owner has
    malicious intentions—it would not happen accidentally!). This page allows you
    to configure which hosts may refer to actions on your Webmin server.


    # Anonymous Module Access


    In some circumstances it may be useful to have one or more Webmin modules accessible
    to any user, without requiring authentication. For example, it may be useful to
    allow users to view some read-only statistics about the server, or allow a user
    to mount or unmount a device using a custom command, or similar. Extreme caution
    should be taken when using this feature of Webmin, as giving users access to the
    wrong module can easily lead to an exploitable condition. To be more explicit,
    very few standard modules are harmless enough to be safely usable with this feature.


    # SSL Encryption


    If your system has the OpenSSL libraries installed, as well as the Net::SSLeay
    Perl module, you will be able to use SSL-encrypted connections to your Webmin
    server. This increases the security of your server by allowing password and user
    information to be sent in an encrypted form. If you will be accessing your Webmin
    server from across the Internet, it is strongly suggested that you use SSL-encrypted
    sessions. Now that both the export restrictions on encryption have been relaxed
    and the RSA patent has expired, it is becoming more common for Linux and UNIX
    versions to always ship with the necessary libraries and Perl module for this
    to be enabled out of the box. But if you do need some help setting this option
    up, there is a nice tutorial on the Using SSL With Webmin [http://www.webmin.com/webmin/ssl.html]
    page.


    # Certificate Authority


    This page allows you to configure the SSL certificate for this server. Using this,
    you may configure your system to allow logins without a user name and password.
    If configured, clients may request a personal certificate in the Webmin Users'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'module, and from then on the browser will authenticate itself via the certificate
    provided. If your users are located in controlled and secured environments, this
    feature can make using Webmin simpler.


    To create a certificate, simply fill in the authority information (this can be
    any information you''d like to include, such as the name of the administrator
    of the Webmin server), and click **Setup certificate authority**.


    **CAUTION** *If using this authentication method, users should be made aware of
    the potential security issues involved. Anyone who has access to a machine with
    such a certificate will be able to access the Webmin server with the same privileges
    as the primary user of the machine. This prevents the use of the login timeouts
    that are normally possible with Webmin, and so should be used with caution in
    environments where a logged-in machine may be left unattended.*


    # Webmin Servers


    This page provides access to every Webmin server on your local network (Figure
    3-2). Clicking any icon will direct your browser to the login page of the server
    clicked. Clicking **Broadcast for servers** will cause Webmin to send out a broadcast
    request to port 10000 over your local network. Every Webmin server on your network
    will reply and identify itself. Webmin will then add those servers to the list
    of servers. You may also scan specific networks for servers, if you manage Webmin
    servers remotely. Simply enter the subnet to search and click **Scan for servers**.


    ![](img/d84604054810a13cacfdac212ebee2f7_50_0.png)


    Figure 3-2: Webmin servers'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Clicking a server icon will simply direct your browser to the Webmin port on
    the selected server, allowing you to log in. You may also configure Webmin to
    connect you to the server through a proxied connection, if you provide a user
    name and password for the other server. This can be useful when connecting remotely
    to a front-end Webmin server on the routable Internet that also connects to a
    non-routable private network, allowing an administrator outside of the private
    network to tunnel through to administer systems inside the private network.


    Versions of Webmin beyond 0.85 provide support for some functions to be executable
    via remote procedure calls, if login information is provided for the remote server.
    This allows a single Webmin server to directly configure or monitor other Webmin
    servers. Currently this functionality is limited to the System and Server Status
    module and some of the modules in the Cluster category. It is likely that many
    of the other modules will expand to take advantage of this new functionality in
    the future.


    # Webmin Users


    This page allows you to configure any number of users and give each some specified
    subset of the system to maintain. It would allow you, for example, to create a
    mail administrator who only had access to the Sendmail module, a DNS administrator
    who could only modify the DNS records, and a Squid administrator who only had
    permission to edit the Squid configuration. In this way, delegation of authority
    is very simply and securely handled.


    # Editing a Webmin User


    To edit a Webmin user and the modules they have access to, click the name of the
    user on the Webmin Users index page. Each user has a list of accessible modules
    and a number of additional options that can be configured. From the Edit Webmin
    User page, it is possible to change the user''s password: Select an SSL certificate
    for them to use for authentication, alter the language and theme from the default
    and specify the IP addresses from which this user can log in. Also on this page
    is a list of all modules that are installed on the machine, each with a check
    box beside it. If checked, the user will have access to the module.


    Webmin also allows finer grained control over many modules, and this functionality
    is becoming more flexible with every release (Figure 3-3). For example, a user
    with permission to use the Apache module can be denied the ability to edit some
    specific aspects of the configuration. In the example below you can see that the
    user is being granted permission to edit only one of the many available virtual
    servers. To edit fine grained access controls, browse to the Webmin Users index
    page, and click the module name link beside the user whose access controls you
    wish to edit.


    # Creating Webmin Users


    Creating new users is also easy. Click the Create a new Webmin User link and choose
    a user name or use one of an existing user on the system (Figure 3-4). Choose
    between using the user''s UNIX password or using a new one. Select'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'which modules the user will have access to and click Save. Now you can edit
    the fine grained access controls for the user, or accept the defaults. Adding
    or deleting modules from the users access list can be performed by clicking the
    username from the Webmin Users page, and then editing the user in whatever manner
    is required.


    ![](img/d84604054810a13cacfdac212ebee2f7_52_0.png)


    Figure 3-3: Editing user access controls


    ![](img/d84604054810a13cacfdac212ebee2f7_52_1.png)


    Figure 3-4: Create Webmin user'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Webmin Groups


    Webmin, like UNIX, understands the concept of groups. Groups in Webmin are similar
    to UNIX groups in that they ease administration of heavily populated servers by
    allowing easy creation of any number of users with the same set of permissions
    and access controls. To create a group click the Create a new Webmin group link,
    give it a name, and select the modules that members of the new group should have
    access to. After saving the new group, any user can be assigned to the group and
    automatically receive the module access of the group, plus whatever modules are
    specified for the user. Currently users can only be a member of one group, so
    the Webmin groups feature is somewhat less flexible than that of most modern UNIX
    variants and Linux where users can be members of a primary group in addition to
    a number of supplemental groups.


    # Tutorial: Securing Webmin


    Because Webmin runs with the privileges of the root user, it is vitally important
    that Webmin be locked down tightly before allowing remote Internet access. Historically,
    Webmin is pretty secure, but there have been exploits discovered in the past,
    and there will probably be exploits discovered in the future. Any tool that runs
    as root has the potential to be an entry point for a malicious cracker to unlimited
    access to the machine.


    So in order to prevent all of the woes that can result from an exploited machine,
    we''re going to take a few steps to limit our risk and minimize the damage that
    can be done without us noticing. We will briefly discuss password policy, application-level
    network access control, SSL, and firewall configuration. The tutorial will wrap
    up with a survey of some other techniques and technologies that can be used to
    help maintain a secure system.


    # Password Policy


    Countless studies and anecdotes from both sides of the security issue (crackers
    on one side and those who implement systems to protect against crackers on the
    other) have told us that cracking weak passwords is nearly always a reliable,
    if time-consuming way to obtain illicit entry into a system. Because many users,
    and even system administrators use weak, easily guessed passwords, it is quite
    common for a determined hacker to run an automated password hunt on a target system.
    Another, perhaps even more frightening, technique crackers use is what is known
    as Social Engineering.


    Social Engineering is a technique as old as malicious cracking itself, which plays
    on human nature to overcome technical barriers to entry by going the easier path
    of getting through a human''s line of defense. One common technique is for a cracker
    to pose as tech support staff and simply ask for the user''s password so they
    can "test" something or other on the network. This works disturbingly often, even
    among technically savvy users. This type of attack can happen via any communications
    medium, including telephone, IRC, email, and so on, and its continued success
    relies on the human desire to be helpful. This technique is often enhanced through
    the use of other subtle additions to further lower the guard of the person answering
    the phone or email. The cracker may mention'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'that there is a "problem" on the network, of some sort, which taps into another
    fundamental aspect of human nature: complaining about the state of the network.
    Everyone complains about the state of the network in an office at one point or
    another, and when a "tech" calls to say he is going to fix it, it further establishes
    his credibility with the victim. In the user''s mind, it seems obvious that no
    outsider would know about the "network problems" he has been experiencing lately,
    so this caller must be legitimate.


    In my time of supporting UNIX servers I''ve noticed another aspect of human nature
    that is sometimes exploited by crackers. When asked to type in their password,
    some users spell it out quietly under their breath while entering the letters.
    Experienced typists are far less likely to speak the text they are entering in
    this way, but it may be a last-resort trick used by a Social Engineering cracker
    to simply ask the user to type in their password a few times (because by the second
    or third time, the user is either excited enough to be taking part in "solving
    a network problem" to begin talking or singing along with their text input or
    be frustrated enough at being kept away from his real work to start muttering
    along with what he is typing). Users should be cautioned against this habit. This
    may all sound like a rather silly way to break into a network, when Hollywood
    movies always show us a lone cracker in a basement filled with computer junk,
    but it is likely that the most determined, and thus the most dangerous, crackers
    will use these techniques before attempting more time-consuming technical attacks
    like brute force password searches. These techniques work, if users are not aware
    of the danger.


    This only scratches the surface of how crackers operate. But it does begin to
    make it clear that good passwords and educated users are a core part of any successful
    security policy. Insist upon quality passwords, and notify your users of the policy.
    A good password policy might include the following requirements:


    # Minimum Length


    A good password should be a minimum of six or eight characters. All other things
    being equal, longer passwords are more secure than shorter passwords, simply because
    a brute force attack has more possibilities to go through to find a password that
    works.


    # No Dictionary Words


    It is generally recommended to avoid plain dictionary words, or even dictionary
    words at all. The reason for this is that brute force attacks usually involve
    attempting all of the words in a word list, or in a dictionary file. Real words
    are simply easier to guess and easier to obtain through brute force attacks. Weird
    spellings, odd capitalizations, and combinations of word fragments can all be
    used to create less easily guessed passwords without making them much less memorable
    for the user. After all, if the user has a drawer full of their passwords on sticky
    notes because they can''t remember them, the cure is worse than the disease.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Include Numbers


    Another good possibility is to enforce the inclusion of at least one number in
    all passwords. This automatically increases the pool of possible passwords by
    an order of magnitude, even if dictionary words are allowed. Again, this doesn''t
    make passwords significantly less memorable for the user, but does increase the
    security of the password. However, use of birthdays, anniversaries, and so on
    should be discouraged, as these are easily guessable and more prone to Social
    Engineering attacks.


    # Scheduled Password Changes


    In environments where security is important, it is wise to implement a mandatory
    password change after some specified period of time. The inconvenience to users
    of this choice should be carefully balanced against the security needs of the
    environment. It is less useful if frustrated users alternate between two passwords
    because they are being forced to change them every two weeks, or even worse, if
    they write them down somewhere in their desk because they don''t want to take
    the effort to remember a new password every week. Once every six months is probably
    frequent enough for all but the most extreme circumstances.


    # Failed Login Timeouts


    In the event that a cracker attempts a brute force attack on your server, password
    timeouts can be very effective at making the process extremely time-consuming,
    or even impossible. Going on the assumption that a user usually will not mistype
    their password more than a few times, many authenticators can timeout and refuse
    to allow any login for that user for a specified period of time after that number
    of failed logins is reached. With this feature enabled, it becomes a daunting
    task to use brute force password searches to break into a system that has password
    timeouts of this sort. It can potentially increase the time it takes by months
    or years, and the likelihood of detection of the scans considerably because one
    or more users will begin to complain of being unable to log in (because their
    password is in a state of timeout most of the time).


    # Education


    This is perhaps the most important in light of the prevalence of Social Engineering.
    Users of the network, both new and old, should receive training about the password
    policy, why the policy has been implemented, and how to use the tools required
    to take part in the new policy. This training doesn''t have to be a large investment
    in time, effort, or money. In high-tech environments, a simple email reminder
    with the policy and instructions sent out every month to old users and immediately
    to new users could be enough. In traditional business, education, or government
    environments it may be better to schedule a one-hour group lecture the first time
    in order to explain both the whys and the hows, followed by a question and answer
    period. It is also vitally important that users understand that no one should
    ever ask for their password, and they should never give out their password to
    anyone, no matter who they claim to be. It might also'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'be appropriate to make clear that the real system administrator doesn''t need
    a password to log in as any user, and thus would never need a user''s password
    to test or fix anything.


    > **CAUTION** Some of these policy choices cannot currently be enforced with Webmin.
    As of version 0.970, only password timeouts are available. Even so, encouraging
    users to use secure passwords, and more importantly for you as an administrator,
    using good password policy can achieve the same goals without enforcing them.
    It is likely that Webmin will have all of these features in some form or another
    in future revisions. Your underlying OS variant probably supports some or all
    of them, as well, for system passwords. Educating users about these issues becomes
    more important when policy cannot be enforced via technical measures.


    # Setting Authentication Policy


    As discussed above, a carefully considered password policy can be very helpful
    in defending against crackers. Webmin provides a simple means to enforce some
    aspects of password policy for Webmin users in the Webmin:Webmin Configuration:Authentication
    module. Here you may choose to enable password timeouts and automatically block
    hosts that appear to be running brute force attacks on the Webmin server.


    Also, enabling logging of failed login attempts is an excellent idea, assuming
    someone will read those logs on occasion. It is possible using tools like logwatch
    to automatically be notified via email of some types of logged data. While logwatch
    is not currently configurable within Webmin, it is well worth your time to read
    up on this utility or any similar tool provided by your OS vendor and to make
    use of it to help ease the burden of administering a system. To enable logging
    of authentication failures, browse to the Webmin:Webmin Configuration:Authentication
    module and select Log blocked hosts, logins and authentication failures to syslog
    Disable session authentication. Then you may configure any log analysis tools
    you use to flag these authentication failures so that a human administrator can
    watch for signs of cracker activity.


    > **NOTE** The logwatch utility is Open Source software, available from [http://www.logwatch.org/].
    The program is maintained by Kirk Bauer and is included with many Linux distributions.
    Other OS variants often provide similar functionality.


    # Setting Network Access Controls


    As discussed earlier in this chapter, Webmin provides a few mechanisms to provide
    network-level security to your Webmin installation. Utilizing some or all of them
    can increase security immensely, without adding complexity to the deployment.
    The primary purpose of these features is to allow Webmin to refuse to even talk
    to someone on an address that is not allowed to log in.


    To begin, take a look at your network topology diagram, or write down your local
    network information if your network isn''t large enough to justify a full diagram.
    Then write down the network information for every user that must be able to access
    your Webmin server. This may get complicated rather quickly, if you'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'have dial-up or other remote users who need to log in from dynamically assigned
    IP addresses, but even in such cases it may be possible to reach a viable compromise.


    # Setting the Listen Address and Port


    The first step is to decide if you can restrict access to one particular network
    interface on your server. If your Webmin server has a non-routable local address
    and a routable Internet address, you should decide whether anyone will ever need
    to be able to access the Webmin server from outside of your local network. If
    not, simply configure Webmin to listen on the local interface. This can be configured
    using the Webmin:Webmin Configuration:Port and Address module by selecting the
    radio button beside the Listen on IP Address option and entering your internal
    IP in the Entry field.


    Before moving on to other items, it may be worthwhile to consider moving Webmin
    to another port. Webmin being on port 10000 leads to one additional type of possible
    exploit that would be difficult for a cracker to take advantage of, but is probably
    not impossible for a local user. Because port 10000 is a non-privileged port,
    any user with login permission on the server could start an arbitrary server that
    listened on that port, if Webmin were not currently running on the port. Once
    a local user is able to start a server on port 10000, it is trivial to set up
    a web server that looks like the Webmin login page, but in fact is just a simple
    CGI script in the users home directory. If the system administrator then attempts
    to login, his password can be grabbed and stored for the user to pick up later
    (or worse, mailed out automatically as soon as it has been grabbed). A particularly
    clever script of this sort could delete itself after its job is done and even
    restart Webmin so the administrator will believe they simply entered the wrong
    password when they tried to log in the first time. One solution to this problem
    is to simply run Webmin on a port below 1024, as these ports require root permission
    to bind to, so a malicious user would not be able to run a password-grabbing Trojan
    on the same port, and thus would not be able to fool anyone into entering their
    authentication information.


    > **NOTE** In some OS variants and versions, it is possible to control which users
    can bind to any port, whether above or below 1024. This feature is sometimes known
    as capabilities or ACLs. A proposed, but then withdrawn, specification labeled
    POSIX.1e provided some of the capabilities that are supported by some Linux versions.
    With features of this sort it may be possible to make port 10000 behave just like
    a sub-1024 port, but availability of this kind of feature varies wildly, so it
    will not be covered here. In the vast majority of environments, it makes sense
    to run Webmin on port 1000, or if connectivity through very restrictive proxy
    firewalls is required, port 553.


    # IP Access Control


    The next step is to set up application-level IP access control to your Webmin
    installation. If you have only static or local addresses that should have access'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'to Webmin, then your job is simple. Just open the **Webmin:Webmin Configuration:IP
    Access Control** module, and select the **Only allow from listed addresses** radio
    button, and then enter all of the addresses or host names that must have Webmin
    access.


    If, however, you have users who will be accessing Webmin from dial-up connections
    or some other form of dynamic link, you cannot know in advance what IP address
    they will need to log in from. In some cases this can be mostly worked around,
    if you have a friendly ISP who will provide a list of their IP blocks. With the
    list of all *possible* addresses on which your dial-up users may come in on, you
    can severely limit the percentage of Internet users who can access your Webmin
    installation, simply because a single ISP only represents a tiny number of the
    total addresses on the Internet. This is, for lack of a better term, *Good Enough*.
    Obviously, large nationwide ISPs are not generally helpful enough to provide this
    information for you, but if you are lucky enough to have a service-oriented local
    or regional ISP, you will likely find the technicians to be quite helpful.


    If address-based access control is not feasible due to needing nationwide dial-up
    access or similar, it isn’t the end of the world. Assuming systems are kept up
    to date and other security policies followed, it is highly unlikely that your
    Webmin server will ever expose an exploitable condition to crackers.


    > **NOTE**  Webmin version 1.000 and above provides the option to do a host name
    lookup for every user access. The result of this will be that a dynamically assigned
    IP with a DNS entry with DynDNS, or a similar service, will be able to be checked
    against the IP Access Control list, just like a fixed address. This is not efficient
    if you have more than a few domain names entered in the IP Access Control list,
    due to the high overhead of performing a name lookup for every host name in the
    list on every request. But it can be very useful if you have one or two administrators
    or users who travel or simply don’t have a fixed address at their normal location,
    because they can have a domain name that follows them wherever they go, and this
    name can be used to allow them access. I use this feature for the swollett.com
    web server, because it is remotely located and I often access it from my dynamically
    assigned home ADSL link.


    # Enabling SSL


    Webmin is a web-based application, thus it operates using the standard protocols
    of the Internet and specifically the HTTP or HTTPS protocol. In a default installation
    from tarball or package, Webmin operates via the standard unencrypted HTTP protocol.
    In some environments this presents no major security threat, but in most situations
    this is a quite large hole in the security of a Webmin installation. If you only
    access Webmin across a local network of only trusted clients, and have a firewall
    closing your local network to outsiders, then you may feel safe in using Webmin
    over an unencrypted link. Otherwise, if you ever access your Webmin across the
    Internet or an intranet that may have untrusted clients (for example, a laptop
    owned by an outside consultant, temporary employees, etc.) encryption should be
    considered mandatory.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Luckily, setting up Webmin for use with SSL connections is pretty simple, and
    requires only installation of two other packages: OpenSSL and the Perl Net::SSLeay
    module. Here we’ll briefly discuss installing these tools from source, though
    it is even easier if your OS vendor provides binary packages. Documenting the
    actual installation process will be left for the included documentation of these
    packages.


    # Install OpenSSL


    OpenSSL is an Open Source implementation of the Secure Sockets Layer (SSL) protocol,
    as well as the Transport Layer Security (TLS) protocol. It provides strong encryption
    library routines that are easy to integrate into other software, and is thus used
    quite frequently in Open Source projects requiring encryption. Because of this,
    if you are using any modern Open Source operating system, like Linux or FreeBSD,
    you probably already have OpenSSL installed on your system or can get a package
    for your OS that is simpler to install.


    OpenSSL is free software and can be downloaded from the [http://www.openssl.org]
    home page or one of its many mirrors. Download it to the server running Webmin.
    If you don’t have a graphical browser installed or are accessing your server remotely
    you can use lynx or wget to fetch it from the website. If no text mode HTTP client
    is available, you can get the file from the [ftp://ftp.openssl.org] FTP site instead.
    I’ve never seen any Internet-capable operating system that does not have at least
    one text-mode FTP client available. Even Windows includes a simple FTP client
    for use in the MS-DOS shell! To install simply follow the instructions found in
    the INSTALL document included in the source distribution.


    # Getting the Net::SSLeay Perl Module


    Because Webmin is written in Perl, it needs a Perl interface to the OpenSSL libraries.
    The standard choice for this is the Net::SSLeay module, which can be downloaded
    for free from CPAN or one of its mirrors. You may also be able to download a packaged
    binary version from your OS vendor.


    Webmin itself offers a module for managing and installing Perl modules on your
    system. Using this module, documented later in this book, you may be able to install
    the Net::SSLeay module using this module. On my test systems (mostly Red Hat Linux
    of varying versions) I could only successfully install using the Webmin module
    if I left out the make test option, selecting only make and install. No additional
    arguments were required, however.


    If a package is not provided by your vendor and installation via Webmin fails
    for some reason (and there are several reasons why it might), simply visit the
    Comprehensive Perl Archive Network (CPAN) and search for "SSLeay" to get the latest
    version. After downloading the tarball, unzip and untar it:


    ```

    [joe@grover /joe]$ tar zxvf Net_SSLeay.pm-1.15.tar.gz

    ```


    Or, if your OS doesn’t use GNU tar you may have to unzip and untar in two steps:'
  merge: -1
  img_proc: true
- pgno: 60
  md: '```

    [joe@grover /joe]$ gunzip Net_SSLeay.pm-1.15.tar.gz

    [joe@grover /joe]$ tar xvf Net_SSLeay.pm-1.15.tar

    ```


    Change the directory to the newly created Net_SSLeay directory. Run the Makefile.PL
    using Perl, like so:


    ```

    [joe@grover Net_SSLeay.pm-1.15]$ perl Makefile.PL

    ```


    Assuming no problems arise, this will generate a standard makefile suitable for
    your system. If OpenSSL was installed from an RPM, you may need to explicitly
    specify the /usr directory on the command line, though it appears to be unnecessary
    in new versions of the module. But if it complains about being unable to find
    an OpenSSL installation you can try the following:


    ```

    [joe@grover Net_SSLeay.pm-1.15]$ perl Makefile.PL /usr

    ```


    Next, use make to build, test, and install the module into the correct location.
    The command sequence is as follows (don''t forget to switch user to root before
    the install phase):


    ```

    [joe@grover Net_SSLeay.pm-1.15]$ make

    [joe@grover Net_SSLeay.pm-1.15]$ make test

    [joe@grover Net_SSLeay.pm-1.15]$ su

    Password:

    [root@grover Net_SSLeay.pm-1.15]# make install

    ```


    Finally, test to be sure the module is installed, using the following command
    line:


    ```

    [root@grover Net_SSLeay.pm-1.15]# perl -e ''use Net::SSLeay; print "Success!\n"''

    Success!

    ```


    If the result is only the word Success!, then the module has been successfully
    installed. Otherwise, if you see an error regarding Perl''s inability to find
    the module, it is not installed correctly.


    # Turning it on


    Now that the correct additional tools are installed, all that is left is to turn
    on SSL connections in the Webmin configuration. This can be done from within Webmin
    itself, or if you''re particularly paranoid and don''t even want to log in once
    over an unencrypted connection you can edit the configuration file manually.


    To enable SSL connections using Webmin, browse to the Webmin:Webmin Configuration:SSL
    Encryption page, and click the radio button labeled Enable SSL support, if available.
    Click Save, and you will automatically be redirected to the https port and connected
    via an SSL link.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'To enable from the command line, for example from an SSH login or a direct
    console login, edit the miniserv.conf file, usually located in /etc/webmin or
    possibly /usr/local/webmin-0.980/etc, where 0.980 is replaced by the version of
    Webmin you have installed. The option to modify is ssl=, which defaults to 0 (off).
    Changing it to a 1 and restarting the Webmin server will enable SSL connections.
    You can then log in on the HTTPS port as documented earlier.


    # Firewall Configuration


    As in the earlier discussion of IP Access Controls, the goal when constructing
    a set of firewall rules is to prevent access to sensitive ports by unknown persons.
    If, for example, you can restrict the external network addresses that can talk
    to your server on port 10000 (or 1000, depending on the port you choose to run
    Webmin on) you can very easily make it impossible to exploit your Webmin installation
    via most types of attack. This is perhaps a bold claim, but it is easily provable
    assuming one can trust the firewall to do its job.


    Unfortunately, the Internet is a world of trade-offs and constantly changing conditions.
    Sometimes, you simply cannot lock down your machine using a firewall without locking
    out all of the people who need to use it. If you remotely manage your server via
    a dial-up connection, the firewall clearly cannot be restricted to allowing only
    one IP. So compromises are required. As in the IP Access Controls, an ideal world
    would allow you to restrict access to only one or two external IP addresses (and
    some or all of the IP addresses within your own local network), but most likely
    you''ll have to allow large blocks of IP addresses to account for dynamically
    assigned addresses on dial-up, DSL, and cable Internet connections. As before,
    if you have a helpful ISP, you''ll be able to obtain a list of the network blocks
    that may be assigned to you.


    Firewall configuration is outside the scope of this book, but adding protection
    for Webmin to an existing firewall is usually trivial. If your network does not
    yet have a firewall of some sort, it is well worth your time to research the options
    and implement a reasonable firewall. If you are using a free UNIX-like system
    like FreeBSD, Linux, OpenBSD, NetBSD, and so on you already have access to a very
    flexible firewall system. All that will be needed is a few hours or days to study
    the implementation of such firewalls and a few minutes to construct an appropriate
    ruleset (just don''t forget to protect the Webmin port!). Users of other UNIX
    OS variants may need to purchase a firewall package from your vendor, or a free
    firewall system may be available for download.


    # Other Security Techniques and Tools


    Security is a manysided problem, and as such, a number of tools have been developed
    to help an administrator implement a highly secure system. In the preceding four
    sections, I''ve addressed the first-line defensive techniques and how they can
    be applied to Webmin. Those techniques are designed to prevent intrusion in the
    first place. They do nothing to let you know an intrusion has taken place, nor
    do they respond proactively to an attack that is underway. Therefore, it is worth
    taking a brief tangential look at some intrusion detection tools, and attack response
    tools.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Intrusion Detection


    There are a large number of free and commercial intrusion detection systems (IDSs)
    available for all of the major UNIX variants. An IDS provides an easy method of
    auditing one or more systems to ensure that they have not been exploited. Most
    such systems create a database of file identifier keys (usually an MD5 hash or
    similar strongly encrypted key), which is also encrypted with a passphrase known
    only to the system administrator. Some systems provide an easy means to store
    the database on another machine, or it can be written to a floppy or CD for use
    in a read-only mode, so that even if the machine is violated tampering with the
    file key database is impossible rather than merely extremely difficult.


    Perhaps the most popular IDS for free UNIX systems is Tripwire, which is available
    in both an Open Source and proprietary version. It is available in package form
    from many Linux distribution vendors and source downloads for all supported operating
    systems. Tripwire uses a database of MD5 keys, which is generated on a known secure
    system. Using a simple cron job, Tripwire can then be run periodically to ensure
    no unexpected changes have occurred on the system since the last database generation.
    Using two passphrases, it is possible for Tripwire to prevent unauthorized tampering
    with the database (for example, a cracker regenerating the database after having
    modified all of the files needed for future entry).


    > **NOTE** *The Open Source variant of Tripwire can be downloaded from [http://www.tripwire.org/].
    A thorough reading of the documentation is recommended before attempting to use
    it, because though it is relatively simple to use, the required steps for initial
    setup and database generation are not at all obvious.*


    Another simple but effective intrusion detection method for systems that use RPM
    or any other package manager that keeps a database and can verify file integrity
    is to keep a copy of the package database on another system or stored on read-only
    media. With this database and a known good installation of the package manager,
    one can verify all of the system files quickly and easily. The drawback of this
    method is that it cannot detect new files and modification of files that were
    not installed from packages. If no proper intrusion detection system is available,
    this can be a lifesaver in the event of an intrusion on a system that has no complete
    IDS installed.


    Some pitfalls to watch for in the event of an intrusion is that once a cracker
    has gained access to your system with root privileges, there is nothing to prevent
    him from modifying the Tripwire or package manager binaries to prevent them from
    reporting good results even after all of their changes. Such a modification is
    usually obvious to an experienced administrator, because normal file changes should
    show up in such checks, and over time those changes will probably not be accurately
    reported by the cracked IDS or package manager. This problem is most easily worked
    around by installing secondary versions of these tools and running them against
    a database stored on read-only media, like a CD or floppy disk with writing disabled.
    While a cracker with the knowledge to make these'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'changes is rare, it is likely that such ideas will eventually be included in
    rootkits, making it easy for even the most brain-damaged cracker to thoroughly
    cover his tracks pretty effectively.


    # Proactive Attack Response Tools


    There are several new tools designed to recognize common types of attack and respond
    to them quickly enough to diffuse the attack. There is no single name for such
    systems, and the way in which they work varies depending on their particular focus.
    Two such tools are PortSentry and Hogwash.


    PortSentry is the most mature of these types of tool and takes a more basic approach
    to the problem. PortSentry keeps an eye on network connections and watches for
    a rapid series of abnormal connections that is usually indicative of a network
    scan. When such a scan is detected the host from which the attack originates is
    simply blocked using the normal packet filter on the system. PortSentry is made
    more attractive by the fact that a Webmin module exists to easily administer and
    configure a PortSentry installation.


    **NOTE** PortSentry, like Tripwire, is available in both commercial and Open Source
    versions. The Open Source release is available for download from [http://www.psionic.com/products/portsentry.html].


    A newer entry into the field, Hogwash uses a rule-based system to detect hundreds
    of known exploit types and can drop those packets without disturbing any other
    kind of traffic from the host. Hogwash is based on the rule engine of the Snort
    network intrusion detection system, but adds the ability to respond to the intrusion
    by dropping or disarming the troublemaking packet by rewriting it to a harmless
    form.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 4


    # USERMIN: A WEBMIN FOR USERS


    ![](img/d84604054810a13cacfdac212ebee2f7_64_0.png)


    This chapter is a short detour away from Webmin to cover a closely related tool
    called Usermin. The two tools have a lot in common and are often used together
    to provide a multi-tiered GUI for users and administrators. The commonalities
    begin with the fact that both were written and are maintained by Jamie Cameron.
    They share much of the same code base, and the operation of Usermin closely parallels
    that of Webmin.


    Because the Usermin modules are so closely related to the modules in Webmin, it
    would be pointless to cover them in detail here. What the chapter will cover is
    the Usermin Configuration module in Webmin, document the modules that do diverge
    from similar Webmin modules or simply do not exist in Webmin, and provide some
    discussions about using Webmin and Usermin in real environments with examples
    to help make the best use of them. Compared to Webmin, Usermin is severely limited,'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'but it is just those limitations that make it ideal for a certain class of
    problem, and so those will be the problems that will be discussed along with how
    Usermin can help solve them.


    # Introduction to Usermin


    The differences begin with the intention of each. Webmin is used primarily by
    system administrators, and it provides unlimited power to the logged-in administrator
    unless permissions are explicitly restricted. Usermin, on the other hand, is used
    primarily by system users, and the powers of a logged-in Usermin user are by default
    limited to only the permissions of a normal user. Specifically, Usermin provides
    access to a web-based mail client, a Java file manager applet, SSH configuration
    and client modules, GnuPG encryption and decryption, mail forwarding, changing
    passwords, cron jobs, and a simplified web-based command shell.


    **CAUTION** Usermin prefers to use the PAM authentication mechanism used by most
    Linux distributions and Solaris. Unfortunately, PAM is not well supported on many
    UNIX variants, or even all Linux versions. For this reason, Usermin will attempt
    to fall back to directly using the shadow password file if PAM cannot be used
    for some reason.


    **NOTE** PAM is an acronym for Pluggable Authentication Modules. It allows easier
    integration of a variety of authentication technologies without requiring all
    authenticating software to be modified to support each authentication type. Modules
    are available for a vast array of authentication methods, including LDAP, Kerberos,
    RSA, and UNIX passwd and shadow files. It is widely deployed on most major Linux
    distributions and Solaris versions 2.6 and above, and is available as packages
    or in source form for FreeBSD and HP-UX.


    # Usermin Installation


    Before you can use Usermin, you will have to install it. Unlike Webmin, at the
    time of this writing no major Linux distribution or UNIX vendor is including Usermin
    in its standard installation or offering it as an optional package. This will
    certainly change in time, and OS vendors may be installing it by the time you
    read this. Check with your vendor for packages, or simply download it from the
    Usermin website.


    # Checking for the Authen-PAM Perl Module


    Installing Usermin is just about like installing Webmin, with the one exception
    that it is recommended to install the Authen-PAM Perl module before installation
    of Usermin. So first it will be necessary to check for, and possibly install,
    this Perl module. The easiest way to check for a Perl module is to use a command
    like the following:


    ```

    [root@grover root]# perl -e ''use Authen::PAM; print "Success\n"''

    ```'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'If this module is available, you will see only the word “Success!” printed
    on the next line. If the module is not installed, a number of errors will result
    instead. If you have success with the module check, proceed to the next section.
    If not, visit the Comprehensive Perl Archive Network (CPAN for short) at [http://www.cpan.org].
    Use the search function to find the latest version of Authen-PAM. download it,
    and follow the instructions in the README file that is included. Briefly, all
    CPAN Perl modules are installed in the same simple way. First generate a makefile
    by running the Makefile.PL file, as follows:


    ```

    [root@grover Authen-PAM-0.13]# perl Makefile.PL

    ```


    If successful, run make and make install.


    ```

    [root@grover Authen-PAM-0.13]# make

    [root@grover Authen-PAM-0.13]# make install

    ```


    Next, use the Perl command suggested at the beginning of this section to test
    for the availability of the module. Then add a PAM service called usermin in the
    appropriate location. Under many Linux distributions, this involves creating a
    file named /etc/pam.d/usermin that contains the following:


    ```

    #%PAM-1.0

    auth       required     pam_unix.so      shadow nullok

    account    required     pam_unix.so

    password   required     pam_unix.so      shadow nullok use_authtok

    session    required     pam_unix.so

    ```


    Now the installation of Usermin should proceed smoothly.


    **NOTE** You may be able to download a package of Authen-PAM for your operating
    system, which is usually preferable from a system maintenance perspective. Also,
    if you use an RPM-based Linux distribution, you may be able to use cpan2rpm or
    cpanflute2 to automatically generate a package from the Perl module, if your vendor
    doesn’t provide a package for you. The use of cpanflute is not discussed in this
    book. However, it is worth looking into if you frequently install Perl modules,
    because it makes generating Perl module RPMs a simple and painless process.


    # Obtaining Usermin


    Lucky for us, Usermin is free under a BSD-style license, just like its more powerful
    sibling. It can be downloaded for free from the Usermin site or one of its mirrors.
    For reference the primary Usermin site is [http://www.usermin.com]. Like Webmin,
    Usermin is available in a tarball, as well as an RPM for Red Hat, MSC Linux, Caldera,
    Mandrake, and SuSE. Unlike Webmin, there is currently no Solaris package of Usermin.
    Choose the most appropriate option for your system.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Installing the Package or Tarball


    Depending on the installation method, you follow similar steps as you did for
    installing Webmin. For the tarball, copy it to the desired installation location
    (usually /usr/local), unzip it, untar it, and run the setup.sh script:


    ```

    [root@delilah /root]# cp usermin-0.6.tar.gz /usr/local

    [root@delilah /root]# cd /usr/local

    [root@delilah local]# gunzip usermin-0.6.tar.gz

    [root@delilah local]# tar xf usermin-0.6.tar

    [root@delilah local]# cd usermin-0.6

    [root@delilah local]# ./setup.sh

    ```


    The install script will ask a series of questions, for most of which you should
    accept the default values. After the installation script finishes running, you
    will be able to log in to the Usermin server on port 20000.


    # Installing Usermin from an RPM


    Installing from an RPM package is, just like with Webmin, even easier than installation
    from the tarball. When installing from a package, it is still necessary to insure
    you have the PAM Perl module as documented previously (if you will be using it).
    Then use the following command for an RPM installation:


    ```

    [root@delilah /extra]# rpm -Uvh usermin-0.6-1.noarch.rpm

    ```


    The RPM will automatically run the installation script with sensible defaults
    and start the Usermin server on port 20000.


    # Usermin Configuration


    You configure Usermin, perhaps paradoxically, from within Webmin. Clicking the
    Usermin Configuration icon under the Webmin tab displays a few rows of icons of
    Usermin options, which are very similar in form and function to those of the Webmin
    Configuration module (Figure 4-1). There are far fewer configurable options, of
    course, but because Usermin is based on the same web server framework as Webmin
    (miniserv.pl, specifically), it provides all of the same access control and security
    mechanisms.


    # Usermin Module Configuration


    On first entering this module, all that is displayed is a page listing all of
    the Usermin modules that have configurable options. Clicking a module name will
    open a page that contains the configuration options for the selected module.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/d84604054810a13cacfdac212ebee2f7_68_0.png)


    Figure 4-1: Usermin Configuration index


    # GnuPG Encryption


    GnuPG (Gnu Privacy Guard, or gpg for short) is a complete and Free Software implementation
    of the encryption standards originally provided by PGP (Pretty Good Privacy, a
    commercial product). It does not rely on the patent-encumbered IDEA algorithm,
    so it can be used with no restrictions for commercial or non-commercial purposes.
    GnuPG provides strong encryption and digital signatures of several types for email
    and files. Using GnuPG strong encryption it is possible to send a private email
    with confidence that only the recipient can decrypt the message. Additionally,
    a message may be digitally signed, allowing confirmation of sender identity and
    verification of the contents of the message (i.e., it confirms this actually is
    the message as it was composed by the sender and it hasn’t been modified in some
    way during transit).


    This module only has one configurable option, the keyserver which is used for
    sending and receiving key files. If you use GnuPG to confirm signatures, it is
    necessary to use central keyservers so that identities can be looked up in a centralized
    database. In this way, a web of trust can be woven between individuals who can
    confirm the identity of others. Because there is a large number of public key
    servers available all over the world and they synchronize their data, it is a
    good idea to choose one near you.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Configurable Options for Mail Forwarding


    Webmin and Usermin support a number of different mail transfer agents (MTAs),
    namely Sendmail, Postfix, and Qmail. This option should be set to the mail transfer
    agent that your server uses. Postfix is not listed as an option, however, because
    Postfix is entirely Sendmail-compatible from a user perspective. Simply select
    Sendmail if Postfix is the MTA, and everything will work as expected.


    # Configurable Options for Read Mail


    The Usermin Read Mail module offers users a complete, if basic, web-based mail
    client. It allows the user to send and receive mail, as well as keep a simple
    address book and digitally sign or encrypt messages. For this module there are
    a number of configurable options, as shown in Figure 4-2 and Figure 4-3.


    ![](img/d84604054810a13cacfdac212ebee2f7_69_0.png)


    Figure 4-2: Configurable options for Read Mail


    # Default hostname for From: addresses


    This is the host name that will be included in the mail headers in the From field.
    If you wish all mail from your domain to be addressed from just the domain name
    (rather than, for example, mail.domain.com) you may enter it here. Entering domain.com
    will cause all mail sent from this machine using the Usermin mail client to appear
    to be from domain.com.


    # Allow editing of From: address


    If Yes the user can enter any address they choose in the From field. If No, all
    mail will be marked as originating from the domain you chose in the previous option.
    It may be appropriate to permit this change, if clients have their own domain
    names or would like to be able to primarily use another address and do not want
    to keep up with replies to another mailbox.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# From: address mapping file


    When hosting virtual domains, it may be useful to have the From: address set to
    the appropriate user@virtualdomain.com address rather than that of the real username
    and the domain of the system. This option sets Usermin to choose the correct address
    from a domain mapping file, usually the generics table.


    # Mail storage format


    Like that of the Mail Forwarding configuration above, this selection should match
    that of the MTA that is running on your server. You can choose Sendmail style
    single file if Postfix is the installed MTA.


    # Sendmail mail location


    Here you select the location of your mail storage directories. This is usually
    located in /var/spool/mail, and another common option is to deliver it to the
    user''s home directory into mbox. This depends on the configuration of your mail
    delivery system (which may or may not actually be Sendmail). Postfix can use Sendmail-compatible
    mail delivery options and so requires no special configuration here.


    # Sendmail file in home directory


    If mail is stored in the user''s home directory, specify the file name for the
    inbox here. Often this is mbox, but some mail servers or mail clients may choose
    something different. Often the inbox is not in the user''s home directory at all,
    and so this option isn''t always necessary.


    # Qmail or MH directory location


    If using Qmail or MH, specify the location of the system mail storage directory
    here. QMail and MH use custom mail storage formats that are implemented as one-mail-per-file,
    as opposed to the traditional mbox format which puts all emails into a single
    file. This is thought to provide better performance and better reliability by
    some administrators and developers.


    # Qmail or MH directory in home directory


    If mail is stored in the users home directory rather than in the system mail spool
    directory, you may specify the location here. Often, this will be the Maildir
    directory, though it could be something else.


    # Mail subdirectory style


    Some mail delivery agents allow the mail spool directory to be divided into multiple
    subdirectories in order to ease management and accommodate limitations of some
    UNIX filesystems. If your delivery agent does not deliver all mail to a single
    mail spool directory, and instead delivers to users spread across many subdirectories,
    you may configure that here.


    # POP3 or IMAP server name


    In addition to reading local mail, Usermin can retrieve email from a POP3 or IMAP
    server. If your mail spool is located on a remote server, you can specify it here.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Send mail via connection to


    Selects how Usermin will send mail. It can be sent to any local mail transport
    agent or a remote SMTP server. By default this is the sendmail executable, but
    several alternatives exist.


    # Sendmail command


    The location of your MTA executable. This is the command that will be called when
    Usermin sends mail, unless configured to send via a remote SMTP server.


    # Allow attaching of server-side files?


    This allows users to attach files that are located on the local machine (on which
    Usermin is running). This could potentially be a minor security risk, because
    the user could then attach any file for which they have read permissions. This
    setting applies to all users, and is not configurable by the user.


    # Minimum mail file size to index


    For performance reasons, Usermin can be configured to create an index file of
    email in a users mailbox. It is usually unnecessary unless the mailbox is rather
    large, so you may configure the minimum size of a mailbox that Usermin will index.


    # Global address book file


    Usemin provides a simple address book for users to store email addresses. If specified
    here, a global address book can be created that can be shared among all Usemin
    users on the system. This can be useful for companies that have a lot of employees,
    and require frequent email interactions.


    The lower portion of the Read Mail page (Figure 4-3) is devoted to configuring
    the default user preferences for the module.


    ![](img/d84604054810a13cacfdac212ebee2f7_71_0.png)


    Figure 4-3: Default user preferences for Read Mail'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Users can edit preferences


    If you would like to prevent users from modifying their preferences for the Read
    Mail module, you may specify No here. By default, the user will have the preferences
    you specify here, but they can change any of them. Some options, like line-wrap
    widths and number of mail messages to display at once, allow changes that would
    make the mail client more suitable for different environments, such as palm-sized
    access devices. Others are merely matters of personal preference.


    # Mail messages to display per page


    This option is pretty much self-explanatory. You may choose to display more or
    fewer messages, which can be useful if clients are using small display devices
    for using the web mail client and too many lines makes browsing messages in the
    inbox cumbersome. You are configuring the system-wide default here. Users can
    alter this setting, and all of the following Read Mail display-related options
    for their own account.


    # Width to wrap mail messages at


    Again, your users may find this option useful for small displays, such as handheld
    computing devices. The default is 80 characters per line.


    # Show buttons at top for


    Selects on which pages the Delete, Mark message as, and Forward buttons will be
    displayed at the top of the page. By default, these buttons appear at the top
    and bottom of the mailbox pages and only at the bottom on the view mail page.
    If large mails are common, your users may find it convenient to display buttons
    at the top of the page of both. If your users don’t have a lot of screen real
    estate (such as with a palm-sized device, for example) you might not want to display
    buttons at the top of any page.


    # Show To: address in mailboxes?


    This option allows you to select whether the mailbox page will display the To:
    field. It’s useful if a mailbox receives messages with different email addresses
    via mail aliases.


    # Don’t MIME encode messages if text only?


    If set to Yes, messages that contain no binary files will not be MIME encoded.
    MIME encoding is a means to transmit data and text that falls outside of the 7-bit
    ASCII that is permitted in plain-text emails.


    # Mailboxes directory under home directory


    Mail folders will be created by Usermin for storage of sent mail, drafts, and
    custom folders. These folders will be created in the user’s home directory within
    the subdirectory specified here.


    # Treat mailbox subdirectories as


    If there exist other subdirectories within the directory specified above, Usermin
    can consider them as folders, or as subdirectories, as specified here.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Save sent mail


    If selected, mail sent by users via the Read Mail module will be saved in a sent
    mail folder in the user''s home directory.


    # Automatically mark read messages


    Messages that have been read will be marked with a check mark if this option is
    set to Yes.


    # Default folder file


    This selects the folder that will be displayed when the user first opens the Read
    Mail module. By default this is the inbox for the user.


    # Show image attachments as thumbnails


    If selected, and the appropriate libraries are available, image attachments will
    be displayed as thumbnails. Clicking the thumbnail will display the full-sized
    image.


    # Sort address book by


    Address book entries can be sorted alphabetically by the real name or the email
    address, or they can be sorted chronologically by the order in which they have
    been added.


    # Include real name in From: address?


    If available, the user''s real name can be included in the From field of messages
    being sent using the Read Mail module.


    # Character set for sent mail


    MIME mail messages may contain characters from several character sets. This option
    specifies the default character set for sent mail. Locations with native languages
    other than English and other romance languages may wish to change this to a different
    character set.


    # Ask for confirmation before deleting


    This option configures the level of confirmation required when deleting emails
    and folders. If set to Yes, every delete request will have to be confirmed. If
    set to No, email deletions will not require confirmation.


    # Signature file


    If specified, the user may have a signature file that will be automatically appended
    to every email composed. Traditionally, the file name for signature files is .signature
    in the users home directory, but any file name may be specified.


    # Running Processes


    The Running Processes module in Usermin allows users to view all of the processes
    they are running. There are a couple of configurable options here.


    # Default process list style


    The options correlate to the modes of the ps command. Therefore, it allows output
    forms, such as a process tree (where parent/child relationships are clear) as
    well as simpler process lists.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# PS command output style


    This option should match the OS on which Usermin is running, as it chooses how
    to parse the output of the ps command. However, if your system uses a custom variant
    of this command, you may need to modify this to an OS that provides a similar
    ps.


    # Cron Jobs


    The Cron Jobs module allows users to create their own scheduled tasks to be performed
    automatically by the system at a specific time. The commands are performed with
    the permissions of the user that configured them.


    # Crontab Directory


    This should be set to the directory where cron looks for its crontab files.


    # Command to read a user''s cron job


    Some crontab versions may use slightly different command line options, or you
    may use a special-purpose wrapper for cron. Here you can select the command and
    options for reading a user''s crontab.


    # Command to edit a user''s cron job


    Similar to the above Command to read a user''s cron job, except it configures
    the command to edit a user''s crontab.


    # Command to accept a user''s cron job on stdin


    crontab can usually accept input from the standard input also, if the - pseudo-file
    name is given on the command line.


    # Command to delete a user''s cron jobs


    This option sets the command Usermin will use to delete a user''s crontab entries.


    # Cron supports input to cron jobs


    This option configures whether Usermin will provide a text entry box so that the
    user can provide data to the command being run via standard input. The command
    being run must accept data from standard input.


    # Path to Vixie-Cron system crontab file


    This should be the path to your system-wide crontab. Generally, it would be /etc/crontab.


    # Path to extra cron files directory


    Many systems make use of an extra cron directory for program specific cron jobs
    to execute when cron runs. This is likely /etc/cron.d.


    # run-parts command


    The run-parts command is often run in the system crontab file, and is used to
    specify other directories to run at specified times. For example, on a Red Hat
    Linux system the crontab contains:'
  merge: -1
  img_proc: true
- pgno: 75
  md: '```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    HOME=/


    # run-parts

    01 * * * * root run-parts /etc/cron.hourly

    02 4 * * * root run-parts /etc/cron.daily

    22 4 * * 0 root run-parts /etc/cron.weekly

    42 4 1 * * root run-parts /etc/cron.monthly

    ```


    The previous example sets a few defaults in the cron environment and executes
    run-parts at a few specified times. Specifically, the /etc/cron.hourly file is
    executed at one minute after every hour. run-parts is simply the program that
    processes the specified directory and executes all of the commands in it.


    # Available Modules


    Much like the Webmin module selection page, this page allows you to select which
    modules will be available to users. If, for example, you do not want users to
    have any direct filesystem access, you could disable the Command Shell, File Manager,
    and SSH/Telnet Login. The SSH Configuration and Login Script are then useless,
    so may be disabled as well.


    # When to Use Usermin


    It has probably become quite clear that Usermin and Webmin are strikingly similar
    in many ways, and Usermin has very little that Webmin does not. So, why use it?
    Why not simply give everyone access to Webmin and simplify life for everyone?
    There is no way to answer that question fully without analyzing the environment
    in which the system is deployed. Under some circumstances, Usermin would be useless
    while requiring additional resources to install and run it. But in other circumstances,
    Usermin can be a valuable addition to an administrator''s toolkit.


    Usermin is at its most useful when the server is being used by a large number
    of unprivileged users, and administration of those users needs to be simplified.
    Before Usermin, it was possible to grant users access to Webmin to read their
    mail, change passwords, and perform a few normal user functions, and that functionality
    is still there. One could use Webmin for the same purposes by constructing elaborate
    ACLs and groups and being careful to configure those new users with just those
    permissions. However, this leaves some room for administrator error, which could
    have dramatic consequences. Usermin, on the other hand, leaves no room for error.
    A Usermin user has the permissions of the user that is logged in and no more.
    The user can''t accidentally receive additional rights, and so a careful selection
    of available modules is not needed to ensure security and ease of use (because,
    let''s face it, many users can become quite confused by too many complicated options).'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Another good use for Usermin is to provide an easy method for users who travel
    to read their mail and retrieve files from their own home directories. By providing
    a web interface to the local machine (and via network file servers, potentially
    all of a user''s data) telecommuters can do all of these things from any web-enabled
    device in the world. In other words, users can log in to the local network from
    an Internet cafe, an Internet kiosk at trade shows, or a wireless web device.
    Doing so requires no specialized software to be installed on the client system.


    Another interesting use for Usermin would be in a shared-hosting environment,
    allowing users the ability to view their own directory, upload files via a web
    browser, edit many of the basic features of their shell account, read mail, and
    so forth. It wouldn''t be difficult to implement a few nifty extras such as running
    a web log analysis tool and allowing users to view the results from within Usermin.'
  merge: -1
  img_proc: true
- pgno: 77
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 78
  md: '# 5


    # GENERAL SYSTEM CONFIGURATION


    ![](img/d84604054810a13cacfdac212ebee2f7_78_0.png)


    The second category on the Webmin tab bar is System. Clicking it will allow you
    to edit such system features as: Bootup and Shutdown behavior, Disk Quotas, Filesystems,
    Manual Pages, NFS Exports, Processes, Cron Jobs, System Logs, and more. Figure
    5-1 shows the options available on a Linux system (specifically, a server that’s
    running Red Hat Linux).'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/d84604054810a13cacfdac212ebee2f7_79_0.png)


    Figure 5-1: System category


    # Bootup and Shutdown


    Clicking Bootup and Shutdown brings you to a page of bootup options. In the case
    of a Red Hat system, it provides access to all of the init scripts found in /etc/rc.d/init.d.
    Similarly, on a Solaris system the scripts are located in /etc/init.d. Clicking
    on any of the script names will provide the ability to edit, start, stop, and
    delete the init script. Usually, each init script provides functions to start,
    stop, and restart system services such as Sendmail, named, and Apache, as well
    as perform basic system initializations such as setting up network devices and
    routing tables. An easy way to add a new service or command to the system start-up
    routine, if it does not have an init script, is to add it in /etc/rc.d/rc.local
    or /etc/rc.local.


    Also on this page you''ll see the Reboot and Shutdown buttons. They do just what
    you would assume, after a confirmation screen.


    # Disk and Network Filesystems


    The Disk and Network Filesystems page provides a detailed view of the file-systems
    listed in /etc/fstab. From this page you can edit mount points, create new mount
    points, unmount and mount partitions, and add execute and setuid restrictions
    to specific mount points for security (Figure 5-2). This module configures the
    /etc/fstab file.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/d84604054810a13cacfdac212ebee2f7_80_0.png)


    Figure 5-2: Mounted filesystems


    To edit one of the listed filesystems, simply click it. From there you''ll be
    able to mount and unmount the filesystem and adjust several filesystem options.
    The available options may vary depending on the operating system and the media.
    Linux and Solaris have large differences and so will be documented separately.
    Irix and FreeBSD are nearly identical to Linux and so are not given their own
    section.


    # Linux Native Filesystem Mount Details


    In the upper table on the Edit Mount page, Webmin offers access to several general
    options that are applicable for all filesystems (Figure 5-3).


    ![](img/d84604054810a13cacfdac212ebee2f7_80_1.png)


    Figure 5-3: Linux Native Filesystem Mount Details


    # Mounted As


    This is the mount point on which the filesystem will be located in your system''s
    directory hierarchy. A mount point is a directory, made like any other directory
    using the mkdir command. When mounting a filesystem, the OS checks this value
    to decide where the contents of the filesystem should be located in the hierarchy.
    Some mount points, such as /usr and /, have a specific meaning for the OS and
    must not be changed. While several other mount points are so named because of
    long-standing UNIX tradition, such as /home and /usr/local. Nevertheless, most
    mount points can be named in any way that suits your environment; just be careful
    when you diverge from the historically accepted names.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Save mount?


    Provides options for whether to save the current mount point. Generally, when
    creating a new mount point or modifying an old one, you will want to save and
    mount at boot. However, if the media is a removable media, like a floppy disk
    or a CD-ROM, you will likely choose just to save the mount. Finally, if you are
    only creating a temporary filesystem, such as for mounting an ISO image as a file-system,
    you''ll have no need to save the mount point.


    # Mount now?


    Allows you to choose whether to mount or unmount the filesystem now. If Mount
    is selected, Webmin will attempt to mount the filesystem when you click the Create
    or Save buttons. Likewise, selecting Unmount will attempt to unmount the file-system
    if it is mounted. If the filesystem is in use by any programs, the OS will refuse
    to unmount the filesystem.


    # Check filesystem at boot


    Selects whether the filesystem will be checked using fsck on system boot, and
    if so, what priority the check should receive. Note that some filesystem types,
    such as journaled filesystems like ReiserFS and XFS, do not usually need to be
    checked. Also, read-only filesystems, such as those of CD-ROMs, should not be
    checked. Under Linux, the ext3 filesystem will quietly skip the fsck, even when
    the fstab entry specifies a priority here, unless the user specifies otherwise
    manually during a boot after an unclean shutdown. As it is a journaling file-system,
    this is reasonable behavior, but may not be immediately obvious from the documentation.


    # Linux Native Filesystem


    Allows you to choose the device that will be associated with the mount point.
    Some modern Linux distributions use labeled devices for this, while others simply
    identify the device directly. The drop-down menu provides access to all of the
    known disk devices. You may also enter a device or ISO file name directly in the
    text entry field by clicking the Other devices radio button.


    # Linux Advanced Mount Options


    The lower table on this page displays the advanced mount options for Linux file-systems
    and indicates which are currently enabled (Figure 5-4).


    ![](img/d84604054810a13cacfdac212ebee2f7_81_0.png)


    Figure 5-4: Advanced Mount Options'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Read-only?


    Sets the read-only flag for the filesystem. If Yes, the filesystem will not allow
    writing, even by the root user. CD-ROM drives, floppy disks mounted with the write
    protect tab enabled, and some other media will always have this flag enabled,
    regardless of the setting in fstab. This option correlates to the ro mount option.


    # Buffer writes to filesystem?


    Allows you to disable write buffering for this device. By default, disk I/O is
    buffered in UNIX, to improve responsiveness and increase overall disk throughput.
    In some circumstances, buffering can be detrimental to the reliability of a system.
    Some database or email server software may be more reliable on a filesystem that
    has buffering disabled. Ordinarily, this change is unnecessary, as most software
    that requires this behavior forces a flush to disk after every transaction, thus
    disabling buffering for only the application that requires it. In most situations,
    altering this will only slow down the system without providing any tangible benefit.
    This option enables the sync mount option switch.


    # Allow device files?


    This option dictates whether a file can be treated as a device on this filesystem.
    Device files are a special type of file that does not map to a portion of the
    disk, but instead directs I/O to another physical or virtual device, such as a
    printer, a modem, or a console display. In general, only the root user should
    be allowed to mount filesystems containing device files. This option enables the
    nodev switch.


    # Allow execution of binaries?


    When this option is enabled, no file contained on the filesystem will be treated
    as an executable file. It could be useful when mounting a filesystem that contains
    binary executables for another architecture, such as PPC executables from Yellow
    Dog Linux on an x86 system running FreeBSD. This option correlates to the noexec
    switch.


    # Disallow setuid programs?


    A program that is setuid will be treated by the system as though it were executed
    by the user to which it has been set to. For example, a program that has been
    setuid root will be executed with the permissions of the root user, thus it can
    be very dangerous. Since a program that is setuid root could be very dangerous,
    there must be a means to prevent users from being able to introduce setuid programs
    into the system from outside sources such as CD-ROM or floppy disks. This option
    correlates to the nosuid directive.


    # Allow users to mount this filesystem?


    If users need to be able to mount the filesystem, this option can be selected.
    In general, most filesystems will be mounted at boot time and will thus always
    be available to users. But in the case of removable media like floppy disks, USB
    drives, and CD-ROM disks, the user is likely to need to access their own disks
    on occasion. This option corresponds to the user mount switch.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Action on error


    When mounting the filesystem, errors may occur. This option allows you to choose
    how the system should behave in response to mount errors. The default is set in
    the filesystem super block, and can be configured using the tune2fs utility. When
    set to Continue the filesystem will be mounted and the filesystem will be marked
    as being in an erroneous condition. When set to Remount read-only, the system
    will attempt to remount the filesystem as a read-only filesystem. This can provide
    some safety and help maintain the ability to recover data from the disk if the
    errors were due to a failing disk. The Panic option halts the system with a file
    system mount error. This option corresponds to the errors mount option.


    # CAUTION


    *When attempting to recover data from a damaged disk, or a disk with data that
    has been accidentally deleted, it is vital that no additional data be written
    to the disk. Because of the design of most UNIX filesystems in use today, including
    Linux ext2 and the BSD system''s UFS, a file''s contents are not usually removed
    from disk until the space is required by the OS for new storing new data. Thus,
    if you immediately remount your filesystem read-only, your ability to restore
    deleted data is greatly improved. A better choice, of course, is to make good
    use of a reliable backup utility and a regular backup schedule. It is impossible
    to guarantee recovery of deleted files or files lost due to a failing drive without
    a recent backup of the files.*


    # Files inherit parent directory GID?


    When new files are created on a UNIX filesystem, they usually have user and group
    ownership matching the creator of the file. If a directory must be shared by a
    number of users, it may be desirable to have the group membership of the files
    set to a specific GID. When this option is enabled, new files will have group
    membership set to the GID specified by the containing directory. This option corresponds
    to the grpId or bsdgroups mount options and defaults to no.


    # Use Quotas?


    If quotas should be used to manage disk usage for this filesystem, you may select
    the type of quotas to be applied. This option corresponds to the grpquota, noquota,
    quota, and usrquota option switches and defaults to applying no quotas.


    # Reserve space for user, Reserve space for group


    Most UNIX filesystems implicitly set aside a small amount of space for emergency
    use by an administrator. This space will remain available even if the normal users
    of the system have filled the rest of the disk. By default this user will be the
    root user, however, in ext2 and ext3 filesystems the reserved space may be used
    by the user or group specified here. This option configures the resuid and resgid
    options.


    # Solaris Filesystem Options


    Solaris has a few of its own additional options beyond the traditional UFS options.
    This section will cover the options that diverge from the Linux options discussed
    already.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# UFS Disk


    This option is only moderately different from the similar option on Linux and
    other systems. Disks are identified by type, SCSI or IDE, system device numbers,
    and the partition number. RAID devices may be specified by Unit number, and other
    devices may be specified by pathname.


    # Solaris Advanced Mount Options


    The Solaris UFS implementation provides a few special features differentiating
    it from the previously documented Linux advanced mount options, specifically,
    Repair Delay, Update access times?, Force direct IO?, Allow large files?, and
    Enabled logging? are available, while Allow execution of binaries?, Allow device
    files?, Allow users to mount this filesystem?, File inherit parent GID?, and the
    reserved space options that were available in Linux are not.


    # Allow user interrupt?


    This option configures whether a user will be permitted to interrupt a process
    that is blocked waiting for a disk operation on this filesystem. This option corresponds
    to intr and nointr, and defaults to yes (intr).


    # Repair Delay


    Because it is possible for the server to reboot on a failed mount attempt, the
    system needs a protective mechanism to prevent it from going into a repair/ reboot
    cycle, which might do more harm to an already damaged filesystem. This option
    specifies the minimum amount of time between repair attempts. If the system reboots
    within this time frame and attempts to repair the disk a second time within the
    time specified, it will simply halt. This option correlates to the too soon mount
    directive, and is only available in Solaris versions older than 7. It is unnecessary
    and ignored on later Solaris revisions.


    # Update access times?


    This option specifies whether the access time, or atime, value of a file will
    be updated when accessed. Immediately means that a files access time will be updated
    immediately every time the file is accessed. Deferred means the access time will
    be updated, but only during the course of other filesystem activity. Finally,
    No means that access time will never be updated on a file. On ordinary filesystems,
    it is desirable to leave atime enabled. Alternatively, when using a filesystem
    exclusively for an application that does not require access time updates, like
    an NNTP news spool or a web cache, disabling atime updates can provide a small
    performance boost as the number of disk transactions required is reduced. This
    option correlates to the noatime, and relatime and nodiratime switches.


    # Force direct IO?


    This option is functionally the same as the Buffer writes to filesystem? described
    previously. In its simplest terms it disables buffering between processes and
    the filesystem. For programs that use very large contiguous files without frequent'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'random access, forcing direct I/O can improve overall throughput. This option
    correlates to the forcedirectio and noforcedirectio. By default, direct I/O is
    not enabled, and all disk I/O will be buffered.


    # Allow large files?


    Maximum file size on Solaris, as on most operating systems, has throughout its
    history gone through changes. In simple terms, this option dictates whether a
    filesystem will permit files over the size of 2GB (currently). Because there are
    a number of programs, operating systems, and other filesystems that cannot support
    files larger than 2GB, this limit can be imposed to maintain reliable operation
    between those differing parts. For example, if a filesystem is to be exported
    via NFS to operating systems that cannot handle large files, it is wise to enforce
    this limit on the exporting machine as well. This option corresponds to the largefiles
    and nolargefiles mount switches.


    # Enabled logging?


    Logging, when enabled, stores filesystem transactions in a log before applying
    the transaction to the filesystem. In other words, before making an I/O transaction
    permanent, it must successfully complete. The result of this is that in the event
    of an unclean shutdown of the system, the filesystem will remain in a consistent
    state, eliminating the necessity of running fsck on the filesystem. This option
    correlates to the logging and nologging mount switches.


    # System Documentation


    This page (Figure 5-5) provides access to the extensive help that is available
    on most UNIX systems through man pages, in addition to the Webmin help files,
    installed package documentation files, Perl module documentation, as well as results
    from the Google search engine.


    ![](img/d84604054810a13cacfdac212ebee2f7_85_0.png)


    Figure 5-5: System documentation


    # System Documentation Search


    Using the module is as simple as entering a search term and clicking Search. If
    you choose to Match any in your search, the module will return a list of all pages
    that it can find that match your query. You may specify which types of documentation
    you''d like to search, including man pages, Webmin help files, documentation for
    installed packages, Perl module documentation, and The Book of Webmin either locally
    or remotely. It will also provide a simple gateway to a Google search.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Man pages are divided into numbered sections, in order to clearly distinguish
    programming documentation from user command documentation, and the like. When
    performing a search of the man pages, you will likely see multiple results matching
    your search term. In some cases, there will be more than one entry precisely matching
    the command or term you''re looking for, in different manual sections. The sections
    are roughly divided as described below:


    +   - User commands that may be run by all users:

    +   - System calls, or functions provided by the kernel.

    +   - Library Functions.

    +   - Devices or special files in the /dev directory.

    +   - File format descriptions, for such files as /etc/passwd and Sendmail''s
    /etc/aliases file.

    +   - Games.

    +   - Miscellaneous, macro packages, and conventions. Examples include bootparam
    and unicode.

    +   - System administration tools that only root can execute. Examples include
    ifconfig and halt.

    +   - OS Specific kernel routine documentation. Not always available on all systems.


    Also available on some systems are a few lettered sections. They are: n for New
    documentation, which may be moved in the future to a new location, o for Old documentation,
    which will likely be phased out, and l for Local documentation specific to this
    particular system.


    # Searching Documentation from Another Module


    This page also provides the configuration for searching from within the other
    modules. In most Webmin modules, there will be a Search docs link in the upper
    right corner of the page. When clicked, Webmin will search all of the available
    documentation that has been selected and present links and short excerpts from
    the documents. If your system will be disconnected from the Internet, you may
    wish to disable Google searches. Likewise, if you do not want package documentation
    or similar types of documentation to be searched you may unselect them here.


    **TIP** In recent versions of Webmin, it is possible to search the contents of
    this book, if the corresponding module is installed. To obtain the Webmin module
    for this book, visit the Projects [http://www.swsoft.com/projects] page at Swell
    Technology for downloads in .wbm and .rpm packages. It is not included in the
    base Webmin package, due to its large size.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Process Manager


    The Process Manager is accessed by clicking the Running Processes icon (Figure
    5-6). This page provides a list of all running processes grouped by lineage. Clicking
    a Process ID will provide more complete information about the process, including
    the command that was run, the parent process, the CPU usage, runtime, size, niceness
    level, and more.


    ![](img/d84604054810a13cacfdac212ebee2f7_87_0.png)


    Figure 5-6: Running Processes


    Niceness level is configurable. Niceness is a measure of how much processor time
    the process will be allowed compared to other processes on the system, and its
    values go from -20 (highest priority) to +20 (lowest priority).


    Clicking the Files and Connections button provides a list of the files that are
    being used by the process, as well as a list of open file descriptors and details
    about each. The open files will often contain a number of shared libraries, configuration
    files, and possibly user files that have been open by the user of the process
    if it is a user application. Open network connections will provide information
    about what network connections exist for this process. In many cases, this list
    will only contain local loopback connections from 127.0.0.1, or this section of
    the page may not be present if the application has no network connections.


    The module also offers several alternative views of the data, including sorting
    by user, memory usage, and CPU usage. Clicking the Search link provides the ability
    to filter on a given aspect of the process. Finally, the Run link provides a simple
    method of running a command, with optional arbitrary command-line input.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Similar information can be gained from the standard UNIX command ps on the
    command line. Niceness level of a process can be set from the command line using
    the nice command. Sending a signal to a process or terminating a process is achieved
    using the kill command. The list of files and connections is gathered using the
    lsof command.


    # Scheduled Commands


    The at command provides a simple means to execute a specified command at a specified
    time. Its usage is simple, made even simpler by the Webmin interface. It can be
    very useful for a number of tasks, such as running one-time CPU intensive tasks
    at off-hours, notifying you of appointments, and so on.


    To create a new at job, simply fill in the details. Specifically, the **Run as
    user** option dictates the user under which the command will be run. **Run on
    date** and **Run at time** specifies the date and time at which the command will
    run. The **Run in directory** option specifies where the at command will be run
    from, as a change directory command will be run before the command is executed.
    This directory must be accessible by the user under which the command is run.
    Finally, **Commands to execute** is where you may enter the commands to be run
    by at at the specified time. Any number of linefeed separated commands may be
    entered and they will be executed in sequence.


    > **NOTE** If you have a repetitive task that needs to be executed at a specified
    time daily, or weekly, or monthly, at is not the best tool for the job. There
    is another command called cron that is more appropriate. cron is covered in the
    next section.


    # Scheduled Cron Jobs


    The Cron Jobs module is used for editing the crontab on your system. Cron is a
    daemon that runs constantly on most UNIX systems and allows users and the administrator
    to run specified tasks automatically at selected times. Ordinarily, crond is configured
    from the system-wide crontab as well as one or more configuration directories
    in /etc/cron.d, and on Red Hat Linux systems and some other Linux distributions.
    crond draws its configuration from /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly,
    and /etc/cron.monthly. Note that even on Red Hat and similar systems, /etc/cron.d
    and /etc/crontab still exist and can be used just as on any other UNIX system.


    Configuration of crond is much simplified by use of the Webmin module. To create
    a new cron job, click **Create a new cron job**. The **Create Cron Job** page
    (Figure 5-7) allows you to select the user that the cron job will run as, thereby
    limiting its permissions to those of the selected user. As in all permissions
    situations, it is best to choose a user with the least permissions required to
    actually accomplish the task needed. There are fields for entering the **Command**
    you want to be executed, as well as for any **Input to command** you might have.
    The **Active** option dictates whether the command is enabled or disabled by commenting
    it out with a hash mark at the beginning of the line.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/d84604054810a13cacfdac212ebee2f7_89_0.png)


    Figure 5-7. Create Cron Job


    In Figure 5-7, I''ve created a cron job that is run as a user named backup (a
    user I''ve created just for such tasks). The job is Active, so it will run at
    the specified times. The command that is being run is a simple tar command line
    to back up my complete /etc directory to a tarball in /home/backup. While this
    is not a terribly sophisticated backup system, it gets the job done without much
    complexity. Furthermore, a simple periodic backup of important files is far better
    than no backup at all. In this case, it is made slightly more effective by the
    fact that /etc and /home are partitions on two different hard disks.


    # Software Packages


    The Software Packages module allows an administrator to perform software upgrades
    and package maintenance via a quite friendly interface. Although the actual implementation
    can vary quite a lot depending on which software packaging system your operating
    environment uses, Webmin masks most differences, and the overall usage of each
    is very similar.


    # Introduction to Package Managers


    Most modern UNIX systems feature a package manager. The concept of a package manager
    may be foreign to new users migrating from Windows operating systems, in which
    software is installed by one of a number of installation processes. There is usually
    no record kept of the locations of installed files and no easy way to remove all
    of them if the software is no longer needed. While some installation utilities
    are more effective and reliable than others, all of them have difficulty making
    wise decisions about software dependencies and available'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'library versions. The lack of a unified package manager has led to an entire
    product category devoted to removing old software installations because of these
    problems.


    A package manager solves this problem, and quite a few other problems that aren''t
    obvious until you''ve lived with one for a while. With a package managed system,
    you never have to wonder where a given file originated, or whether a given library
    or system component is installed. Finding the version of any installed package
    is quick and easy, and upgrading old packages to new versions can usually be done
    without fear of overwriting configuration details. So, now that it is clear why
    package managers are great, it is a good time to talk about how you can use your
    package manager from Webmin.


    # Supported Operating Systems


    Webmin provides a mostly consistent frontend to most major OS package managers.
    The supported operating systems include RPM-based Linux distributions, like Red
    Hat, SuSE, and Mandrake; deb-based systems like Debian; systems using the pkg-style
    tools like Solaris, Slackware Linux, and SCO Unixware and OpenServer; and the
    HP/UX and IBM AIX package managers. A notable exception to the list of supported
    operating systems is Irix. Though it has a package manager, it is not currently
    supported by Webmin.


    # Using the Package Manager


    Webmin presents a simple interface that provides the ability to install packages,
    search currently installed packages, view the installed packages, and remove packages
    (Figure 5-8). Additionally, it is possible to identify the package from which
    a specified file was installed.


    # Installed Packages


    To search for a package, enter the package name here. A package name is the name
    of the file that was installed, without the version number or file name extension.
    For example, on a Red Hat system, the Postfix mail server package is simply called
    postfix. When searching, Webmin will return all packages that have the search
    term as part of the package name or as part of the package description. This usually
    makes it easy to find what you''re looking for even if you don''t know the exact
    package name.


    To view a list of all installed packages, click the Package Tree button. When
    applicable, packages will be divided into their appropriate categories as designated
    by the packager.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '![](img/d84604054810a13cacfdac212ebee2f7_91_0.png)


    Figure 5-8: Software package management on Solaris


    # Install a New Package


    To install a new package (Figure 5-9), specify its location, either a local file
    path or a URL, or by uploading it from your local machine using the Browse option.
    The package will be identified, the title and description will be displayed, and
    the installation path may be specified for relocatable packages.


    ![](img/d84604054810a13cacfdac212ebee2f7_91_1.png)


    Figure 5-9: Install package


    It may also be possible to specify options regarding dependencies, installation
    scripts, documentation, filesystem size, and so on. Generally, the default options
    will work fine.


    # Identify a File


    Often it is useful to know which package provided a particular file on the filesystem.
    Simply enter the path to the file you would like to find information about into
    the text field and click the Search for button.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Edit Package


    Clicking a package name provides access to the **Edit Package** page (Figure 5-10).
    This page includes package details such as the description, the category or class
    of the package, the date of installation, and so on. Here you can list the files
    contained in the package as well as uninstall the package.


    ![](img/d84604054810a13cacfdac212ebee2f7_92_0.png)


    Figure 5-10: Edit Package


    # System Logs


    System Logs provides a method for controlling the syslogd daemon used on most
    UNIX system to provide standard logging functions. The module opens with a list
    of all currently existing logs. By clicking the **Log destination** of a log file,
    you can edit the logging properties, as shown in Figure 5-11. On the editing page
    there is also a **View log** button that allows you to view a configurable number
    of lines from the end of the log file. It also allows a constantly refreshing
    log view if selected.


    This module edits the `/etc/syslog.conf` file and provides a pretty easy way to
    check up on your logs remotely. And even though the module is designed primarily
    for syslog logs only, it is flexible enough to allow you to view other types of
    logs as well. For example, the web-caching proxy Squid doesn''t use standard **syslog**
    facilities, so doesn''t fall under the control of syslogd. Nonetheless, I like
    to be able to check up on a running Squid, so I add an entry on all of the boxes
    I administer to allow me to watch those logs in Webmin. To create a new syslog
    entry, click the **Add a new system log** link.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/d84604054810a13cacfdac212ebee2f7_93_0.png)


    Figure 5-11: System Logs


    # Adding a System Log


    The Add System Log page is divided into sections labeled **Log Destination** and
    **Message types to log**.


    # Log Destination


    The log destination options below specify where log entries will be written, and
    whether a particular log is active.


    # Log to


    This option configures the destination of the log file. Syslog can log to a file,
    a named pipe, a remote syslog server, or the console of some or all local users.


    # File


    The log entries will be appended to the file name specified. A complete path should
    be given. Historically, system logs are stored in `/var/log`. The **Sync after
    each message?** option will cause the syslog daemon to flush to disk after every
    entry, therefore overriding the disk I/O buffering provided by the operating system.
    This can be detrimental to performance in circumstances in which logging occurs
    at a very rapid rate, such as the mail log on a very busy mail server. In most
    circumstances, the integrity of the log is far more important than avoiding the
    small amount of disk activity system logs generate.


    # Named pipe


    The concept of pipes is fundamental to the UNIX Way, or the philosophy of combining
    small tools to perform large jobs efficiently and flexibly. Most UNIX users are
    familiar with the standard command-line pipe, which allows the output of one command
    to be the input of another command. A named pipe expands upon that and allows
    output to be sent to a pipe that is located within the normal filesystem under
    a normal file name. Or, to put it another way, the output of syslog will go to
    whatever program is accepting input from the named pipe. While named pipes and
    their usage is beyond the scope of this book, I will point out a few resources
    to get you started on the subject. Many modern UNIX'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'systems, including Linux systems, include a command called mkfifo, which creates
    the FIFO special file connected to a named pipe. Reading the man page, as well
    as reading about named pipes in your favorite general UNIX reference should give
    you a good overview of the topic.


    # Syslog server on


    The syslogd daemon can log to local files, pipes, and users, as well as direct
    its output to a remote server running syslogd. However, the remote server must
    be configured to permit remote logging from your server. When using remote logging,
    the address of the server is entered here.


    # Local users, All logged-in users


    When one or more users, or all users, are specified here, the log entries that
    match the description will be written to all open consoles of the users specified.
    For example, on most systems, all messages of priority .emerg. or emergency, are
    sent to all user consoles. Most systems are configured to send shutdown and reboot
    messages at this priority.


    # Logging active?


    This is a simple yes or no question, with obvious meaning. However, what may not
    be obvious is that a disabled log is simply commented out in the /etc/syslog.conf
    file with a hash mark, and so the configuration details remain in the file even
    though it is no longer an active logging entry.


    # Message Types to Log


    Here the types of messages to log to the configured log destination can be specified.
    Any given log entry has two identifiers: its facility and its priority. The facility
    specifies the type of program generating the log, such as mail, daemon, cron,
    or locally definable facilities, named local0 through local7 on many Linux systems
    and similarly defined on other UNIX variants. The priority is the level of message
    on a scale of debug to emergency. The priority level used by any given program
    for any given message is somewhat arbitrary, as it is chosen by the author(s)
    of the program. However, it is safe to say that debug level messages will be incredibly
    verbose and unnecessary in all but the most complicated trouble-shooting situation,
    while emergency is reserved for messages of the utmost importance. Generally,
    you''ll want to configure the priority of logs somewhere in the middle of this,
    somewhere around warning or err.


    # Users and Groups


    UNIX is, at its very core, a multi-user operating system. It was built from the
    ground up to provide services to a number of simultaneous users. Because of these
    features, UNIX provides a simple, but effective, method for restricting users
    to only the parts of the system in which they should have access. The Users and
    Groups module in Webmin attempts to provide a nice front end for those features
    of the system. Each version of UNIX has differences in how users and groups are
    implemented. However, Webmin hides those details quite effectively so that you
    never have to think about it. The Webmin Users and Groups module'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'edits several system files, depending on your OS. Usually, the files are /etc/passwd
    and /etc/shadow, for usernames and passwords, and /etc/group and /etc/gshadow,
    for groups and group passwords. Note that the shadow versions of the preceding
    files are far more secure than standard passwd files because they are only accessible
    by the root user. Shadow passwords are standard on most Linux distributions today,
    and many other systems as well.


    Clicking a username or group name will take you to an Edit User page, allowing
    you to edit all facets of the account. Note that changing the user or group ID
    at some point in time after the account is created is risky, as permissions are
    set by ID, not username/group name. While the module will change these for you
    on the home directory, there may be user programs or even system programs that
    rely on the UID to remain the same. Also note that on some systems (Red Hat and
    probably other Linux distributions) the user and the user''s primary group are
    always the same name by default. Red Hat Linux includes the adduser command, which
    will create a group of the same name and ID as the user, and therefore Webmin
    can do the same. You should not change this behavior, unless you really know what
    you''re doing, as the system relies on this for much of its access control flexibility.
    Unlike some traditional UNIX variants, Linux users can have many secondary groups
    active at all times, which can be set to any group(s) you need.


    # Users and Groups Module Configuration


    Unlike most module configuration pages, the Users and Groups module configuration
    contains a number of options that impact the usage and usefulness of the module
    significantly. While most other modules only use the module configuration to specify
    paths to files, display characteristics, etc., the Users and Groups module specifies
    many defaults that are used when creating new users.


    # Before and After Commands


    This section includes fields for specifying commands you want to run before and
    after changes are made. This option allows things like a NIS make to be run after
    adding a user. If more than one command needs to be run, it is trivial to write
    a simple shell script to execute any commands that you need to run.


    Webmin provides access to a number of variables within the local environment in
    which the command is run. This allows you to construct a command that includes
    the username, UID, generated password, and so on. For example, to email a notice
    to the system administrator when a new user is created, which contains the username
    and password, you could use the following:


    ```

    [ "$USERADMIN_ACTION" = "CREATE_USER" ] && echo "Created user $USERADMIN_USER
    with password $USERADMIN_PASS" | mail -s "New User" root

    ```


    While shell scripting is beyond the scope of this book, I will point out a few
    things about how this script works. Using the environment variables set by Webmin
    when the user is created, the comparison within the test operators ([ and ]) checks
    to see if the command is being executed after a user creation, rather than'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'a change to an existing user. If it is a newly created user, an email will
    be sent to root and contain the contents of the variables for the username and
    password. Below is a list of the variables exported and what they contain:


    # Environment Variables Exported When Saving a User


    The following environment variables are always set whenever a user is created
    or modified:


    **USERADMIN_USER**

    The username of the user being edited. A user must have a username, and it must
    be unique.


    **USERADMIN_UID**

    The user ID of the user being edited. Every user must have a UID. The UID is not
    required to be unique, but there is rarely any reason for it not to be unique.
    Permissions are applied to files based on UID rather than username, so changing
    this will effectively change a user''s permissions to that of the new UID.


    **USERADMIN_REAL**

    The real name of the user. This is not a necessary field in the passwd file, and
    so may be empty.


    **USERADMIN_SHELL**

    This variable contains the path and name of the shell for this user.


    **USERADMIN_HOME**

    The path to the user''s home directory.


    **USERADMIN_GID**

    This variable will contain the primary GID of the user.


    **USERADMIN_SECONDARY**

    This variable will contain a comma-separated list of secondary groups the user
    belongs to.


    **USERADMIN_PASS**

    If the password has been changed by entering a plain text password into the password
    field, the new password will be contained in this variable. If the password is
    unchanged or pre-encrypted, the variable will be empty.


    **USERADMIN_ACTION**

    This variable contains the Webmin action being run that led to a user change.
    If the user is a new user being created, the variable will contain "CREATE_USER,"
    while if it is an existing user being altered the value will be "MODIFY_USER."'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Home Directory Options


    When creating a new home directory for a user, or when modifying an existing user''s
    home directory, Webmin can be customized to suit many different environments.
    The following options specify details about home directory creation and modification:


    # Permissions on new home directories


    New directories for users will be created with the permissions specified here.
    The default is 0755, which means the owner of the file can read, write, and execute
    files in the directory assuming permission on the file itself, while the group
    and all other users on the system, can read and execute within the directory.
    In a web hosting environment, this looseness is often necessary to permit the
    web server to have access to a user''s document root. However, in most business
    environments, these permissions are unacceptably lax. A better choice would be
    0700 or 0711. The former disallows all users, other than UID 0, from being able
    to list the contents of the directory or read anything within the directory, while
    the latter permits other users to change directory into the directory, but not
    necessarily to read or execute files within it. It is useful to permit other users
    to pass through the current directory to a directory within which is intended
    to be shared with other users.


    # Copy files into new home directories from


    When creating new UNIX users, it is customary to provide a base set of configuration
    files to set up sensible defaults for the shell, desktop settings, path and other
    environment variables, and any local configuration details that would make the
    user''s life more convenient. For example, on a machine used primarily for development,
    it is likely that the CVSROOT environment variable will be set on login. Similarly,
    a desktop machine will have icons to make it easier for the user to locate the
    files they need to use in day-to-day work. This file is usually called /etc/skel,
    where skel is short for skeleton, but it can be any directory name.


    # Automatic home directory base


    Webmin can automatically set the home directory path for you if automatic directory
    creation is selected. This option allows you to specify the location of the home
    directory. There is rarely a good reason to stray from the tradition of using
    /home for this purpose.


    # Automatic home directory style


    In most environments, the traditional home directory naming scheme of /home/username
    is perfectly acceptable, but in some large-scale networks, the number of users
    would make managing such a directory cumbersome. So administrators have resorted
    to breaking down the username distribution in various ways to permit easier home
    directory maintenance. Webmin supports several such alternate name distributions,
    specifically: /home/u/username, /home/u/us/username, and /home/us/username.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# New User Options


    The following options specify the defaults and restrictions Webmin will use when
    creating new users:


    # Lowest UID for new users, Lowest GID for new groups


    Most UNIX systems use lower-numbered user ID and group ID numbers to specify special
    system users like the root user, syslog, and nobody. Because these users usually
    have special permissions it would be dangerous to assign a new user to one of
    the special UID numbers accidentally. Many older UNIX systems use UID and GID
    numbers from 0 to 100 for the system user and group IDs. Most modern Linux distributions
    use 0 through 500 for this purpose. Specifying the appropriate number here makes
    it impossible to accidentally specify a special UID or GID for a new normal user.
    Some environments may have other numbering schemes for which this feature can
    also be helpful.


    # Create new group for new users?


    Many modern UNIX systems use a groups system wherein every user has primary group
    named after themselves. In a system that supports a large number of simultaneous
    secondary users, this makes it possible to use permissions in very flexible ways.
    If your system supports this, it is useful to select Yes here, and Webmin will
    automatically create the new group for you. Older-style UNIX systems may use a
    generic users group for this purpose. In which case this option should be set
    to No.


    # Don''t use MD5 passwords if missing perl MD5 module?


    If MD5 passwords are the default on your system, Webmin can use them for both
    authentication and when creating new users or changing passwords. If this is set
    to Yes, Webmin will not use MD5 passwords for users if the MD5 perl module is
    not installed. It will use instead the older, less secure, crypt function to encrypt
    the passwords.


    # Check for sendmail alias clashes?


    When creating a new user, it is possible that there might already be an alias
    for the new username in the sendmail aliases file. The result of this clash would
    be that the new user would not receive mail; instead, the mail would be delivered
    to whatever user or program to which the alias pointed to. If this option is selected,
    Webmin will warn about any clashes that exist.


    # Only delete files owned by user?


    When removing a user, Webmin can remove the user''s home directory and all of
    its contents. If this option is enabled, it will remove only those files that
    are owned by the user. If any files exist in the user''s home directory that are
    owned by another user on the system, it will not be removed, and the home directory
    and any subdirectories containing the files not owned by the user will be retained.
    This option may be useful if the user shares a portion of his or her home directory
    for use by others in group projects.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Maximum user and group name length


    Here you may specify the longest a user and group name may be. If usernames must
    be exportable to a system with strict length requirements, you may have to place
    a limit here. For example, some old UNIX systems and legacy print- and file-sharing
    systems had eight- or even six- character username limits. Most modern systems
    have much larger hard limits, and so this is rarely necessary.


    # New User Defaults


    The following are new user defaults:


    # Default primary group for new users


    Normally, Webmin will create a user with a primary group appropriate for your
    system and based on the configuration of the earlier option Create new group for
    new users?. But if this is specified, Webmin will set the group specified as the
    primary group for the user. It may be appropriate to use this feature in some
    web-hosting environments. Usually, however, if your system supports flexible secondary
    groups, you shouldn''t need to use this option.


    # Default secondary groups for new users


    You may add any number of secondary groups here, separated by spaces. Modern UNIX
    systems support multiple simultaneous secondary groups, although some older systems
    have more primitive support for secondary groups.


    # NOTE


    > Secondary groups are a very flexible way to utilize UNIX filesystem permissions
    to provide limited access to parts of the system. For example, if I needed to
    provide access to a shared ftp directory to all users, so everyone could drop
    off files in the directory but couldn''t delete or modify each other''s files,
    I could create an ftpusers group. Then I would set the public FTP directory to
    be owned by ftp:ftpusers, with write access by both the owner and the group and
    would read access. Finally, any user who needed to be able to drop files into
    the directory could be added to the ftpusers group. Each user would be able to
    write and delete their own files but no one else''s files.


    # Default shell for new users


    Most UNIX systems usually have at least two user shells available. The most common
    are bash, Bourne sh, csh, ash, and ksh. While experienced users always have a
    preference, for most users any reasonably functional shell will be fine. The system
    default is probably what your users will expect, so it is the best choice in most
    cases. On Linux systems bash is usually the standard shell, while on Solaris the
    Bourne sh is the default. Because most shells are available on most operating
    systems, you have much flexibility in your choice if you need it.


    # Default minimum days for new users, Default maximum days for new users


    If password timeouts are supported on your system, this option allows you to specify
    the default minimum and maximum number of days between password changes. As discussed
    earlier, a policy enforcing password timeouts is an important part of a good security
    policy. If your OS supports them, it is wise to use them.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Default warning days for new users


    The system can warn users when they log in through a terminal if an enforced password
    change is approaching within the number of days specified here.


    # Default inactive days for new users


    If a user is inactive for the specified number of days after the maximum days
    specified above is reached, the account will be disabled. Only a system administrator
    will be able to re-enable the account.


    # Display Options


    The following options configure how the user and group information will be displayed
    for the system user and group list page, as well as the edit user and group pages:


    # Maximum number of users to display


    If there are more users than the number specified here, Webmin will display a
    search dialog allowing you to see only the users you need to see.


    # Sort users and groups by


    Webmin will sort the users and groups according to the selection here. The default
    is not to sort the names, and simply list them in the order they appear in the
    passwd and group files.


    # Number of previous logins to display


    When viewing the login history of a user using the Display logins by option, this
    option specifies how many previous logins will be displayed. Unlimited means Webmin
    will display all logins that exist in the log file. Because logs are rotated at
    some interval, you will never see logins older than the last log rotation.


    # Display users and groups by


    Depending on the number of users you have, and how much information you need to
    see on the front page, you may wish to display them by name only, or display them
    categorized by primary group. Displaying by name only can allow a much larger
    number of names to appear on screen at once and may be more convenient than the
    default in environments with hundreds or thousands of users.


    # Conceal plain-text password?


    If selected, the Normal password field in the Edit User and Create User pages
    will display * marks in place of the characters typed. If set to No, the typed
    characters will be displayed. It may be a security risk to leave this option disabled,
    if user passwords will be entered or changed in the presence of others.


    # Get user and group info from


    Webmin can usually gather user and group information using standard system calls.
    In some operating systems this may not work, or may not work as expected. In such
    cases, you can configure Webmin to draw the information from the'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'appropriate files on the system. This doesn''t need to be changed from its
    defaults by the vast majority of users, as the Webmin default is usually right
    for your system.


    # Generate password for new users?


    If selected, new users will be assigned a random password when created. This password
    will be visible in the password entry field on the Create User page if Conceal
    plain-text password? is set to No.


    # Show office and phone details?


    Webmin can use the comment field in the /etc/passwd to store phone numbers and
    office information. If this option is selected, it displays the information when
    you view the user details. Modern implementations of the finger command can also
    display this information.


    # Display user email from


    Webmin can be used to send and receive mail by users who have access to the mail
    module. This option should be set to your active mail server. If using postfix,
    choose the sendmail option, because it use the same mailbox format and locations.


    # Password Restrictions


    The following options specify the restrictions that Webmin will place on passwords
    when creating a new user, or modifying an existing user password:


    # Minimum password length


    When users change their passwords through the Webmin interface, it is possible
    for Webmin to enforce a minimum password length. It is recommended to enforce
    at least a minimum password length of six characters if security is at all a concern.
    Shorter passwords are easier to guess, and are weaker when assaulted with a brute
    force attack. Operating systems using the older crypt encryption mechanism are
    limited to passwords of eight characters or less, but MD5-based systems usually
    have no limit or a much larger limit.


    # Prevent dictionary word passwords?


    Because a common method of attack against computer systems is to attempt logins
    using passwords pulled from a dictionary file, it is often wise to require passwords
    that do not match words in the system dictionary. This option will cause Webmin
    to display an error message if a user chooses a password found in the dictionary.


    # Perl regexp to check password against


    Here you may enter any Perl regular expression against which you would like passwords
    to be compared. For example, if you fear your users will often choose the company
    name, or the name of a local sports mascot, for their password, you may create
    a regular expression to match those terms.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Prevent passwords containing username?


    Users have a bad habit of choosing really bad passwords. Some even choose their
    own user name as a password. If enabled, this option will prevent a user from
    such a mistake. Unfortunately, in current versions of Webmin, it will not make
    jokes about the lack of intelligence of the user.


    # System Configuration


    The following options specify the locations of the system user and group information
    files:


    # Password file


    The password file is the location of the list of users, and it contains information
    about their home directory, their login shell, and their primary group. Usually,
    this is `/etc/passwd`. On modern systems this file does not contain user passwords.
    Passwords usually reside in the shadow file.


    # Group file


    The group file is the location of the file that contains the names and membership
    information of groups on the system. Usually, this is `/etc/group`.


    # Shadow password file


    The shadow password file is the file that contains the actual passwords. It is
    only readable by users with root permissions, and therefore is a more secure location
    than the `/etc/passwd` file, because the password file must be readable by everyone
    in order to allow groups and commands like `finger` to work. Usually, this is
    `/etc/shadow`.


    # BSD master password file


    Much like the shadow password file on Linux and some other UNIX variants, the
    BSD master password file is only readable by root and is usually the location
    of passwords on a BSD system rather than the `/etc/passwd` file. This is usually
    `/etc/master.passwd`.


    # Shadow group file


    If group passwords are in use on a system that supports shadow passwords, there
    will be a group shadow password file in addition to the shadow password file.
    This is usually named `/etc/gshadow`.


    # Creating a New User


    Creating a user with Webmin is a simple task. The steps can be simplified further
    through careful configuration of the module to set up users to suit your environment.
    Webmin can create a user manually, or it can import a text file list of new users
    or users to modify in an automated batch mode. This can be used, for example,
    to migrate an existing user list from a legacy system. Batch mode can also be
    useful for large organizations with a constantly shifting user base, such as a
    university or military installation.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'To create a user manually, click the Create a new user link. Fill in the appropriate
    details. If you''ve chosen your defaults in the module configuration file wisely,
    you should be able to get away with entering just a few details for each user.
    In Figure 5-12 below, I''ve added a few extras just to make the example more interesting.


    A username is always necessary, and because our user''s name is Seymour, I''ve
    given him the username seymour. I''ve let Webmin choose the UID for me, which
    is the next available UID on the system above the minimum that is set in the module
    configuration. I''ve also entered Seymour''s real name and his work telephone
    number. The password that appears in the normal password text entry box was selected
    at random by Webmin. It appears secure enough to me, so we''ll leave that one
    alone. In the password options section, I''ve specified some reasonable timeout
    information. Finally, I''ve selected for Seymour to be a member of the users group,
    because I think he will be involved in many group projects that require him to
    be able to share files with co-workers easily.


    # Create User and Edit User Options


    When creating a new user or editing an existing user, the following options are
    available:


    # Username


    This is simply the username under which the user will log in. UNIX has a long
    tradition of using all lowercase letters for usernames, but capitalized names
    will work if you feel a strong urge to go against 30 years of tradition. Usernames
    may contain all alphanumeric characters, but no spaces or other special characters.
    Names must be unique and begin with a letter.


    # User ID


    The user ID is usually chosen automatically by Webmin, although you may enter
    a specific UID instead.


    > **NOTE** Recycling a UID or GID, i.e., reusing a deleted users old ID, can be
    dangerous, because file ownership is maintained at the OS level by the UID and
    GID number of the file rather than the name of the user. Thus if you create a
    new user with an old users UID or GID, and any files remain on the system owned
    by the previous user, the new user will have access to the files at the same level
    as the old user. There are reasonably reliable methods of locating such file permission
    problems using the find command, although it is beyond the scope of this book.
    A better choice is to never delete old users. Instead, disable their account by
    turning off logins, and if the user will never need to be re-enabled you may delete
    their home directory and other files. By doing this you ensure that Webmin will
    never reuse an old ID, unless you force it to.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '![](img/d84604054810a13cacfdac212ebee2f7_104_0.png)


    Figure 5-12: Creating a new user


    # Office, Work phone, Home Phone, Extra options


    The UNIX passwd file has a comment field that may be used for mostly free-form
    text entry. Many programs, however, have standardized on a few comma-separated
    field values for the comment. For example, running the finger command on a username
    that has provided these extra fields will result in these numbers being displayed
    in addition to the usual information, such as recent logins. The Extra options
    field may be used on some systems to configure the initial umask, nice level,
    and ulimit values for the user.


    # Home directory


    Users on a UNIX system generally have a directory that belongs to them called
    their home directory. Within their home directory, a user may read, write, delete,
    or execute files with no permissions restrictions. Quotas may limit the amount
    of space available to the user, but the user can otherwise work unrestricted in
    their home directory. The UNIX tradition places home directories in a partition
    labeled /home, with each user having their home directory named after their own
    username within it. For example, if our system has a user named s1im it would
    not be unreasonable to expect his home directory to be /home/s1im. As discussed
    previously, if you let it, Webmin will select the home directory for you based
    on the policy selected in the module configuration.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Shell


    UNIX has a very long and diverse history and has seen the rise of a number of
    similar tools for any given task. Nowhere is this more evident than in the proliferation
    of command shells that have been developed. Today, the most popular shells are
    bash or the Bourne Again Shell, csh or C shell, and ksh or the Korn shell. Many
    other shells are also in use, including traditional sh or the original Bourne
    shell, ash, zsh, and many others. The choice of what shell to use is highly personal,
    though most average users will never know the difference between them. Leaving
    this at the OS default is probably wise, barring any strong reasons to choose
    otherwise. New users will learn whatever shell is provided for them, while experienced
    users will know how to choose an alternate shell for themselves.


    Scattered amongst the real user shells are a number of shell replacements, which
    provide the ability to lock out a user or the ability to create special users
    to perform certain tasks remotely. Depending on the OS, you may have a nologin
    or false shell option, which simply closes the connection when the user attempts
    to log in. Other possibilities include shutdown, which will cause the system to
    shut down when the user logs in, assuming the user has appropriate permissions
    to shut down the system. Similarly, the sync user will run the sync command to
    cause all disks to flush unwritten data. This could be used in anticipation of
    a shutdown or as a means to ensure some important data has been committed to disk.
    sync is not in common use today, because modern UNIX systems automatically sync
    disks when shutting down.


    # No password required


    This option means that the user need not provide a password to log in. You don''t
    want this option for any user that has shell access, as it means anyone that can
    reach a login prompt or the su command can become the user.


    # No login allowed


    If set to this option, the system will never allow a user to log in under this
    username. This is often used for system users, like syslog or nobody users. It
    is also used to lock an account, temporarily or permanently, without deleting
    it. This helps prevent accidental reuse of a user and group ID, which can have
    security implications.


    # Normal password


    Here you may enter a new password for the user in plain text. If creating a new
    user, and you have configured Webmin to generate a password automatically, it
    will be prefilled with the generated password. If the configuration is set to
    hide plain-text passwords, the letters of the password will be replaced with asterisks.
    Existing passwords will never appear in this field, as the encryption used by
    the system is a one-way hash. There is no way, short of a brute force attack,
    to convert the encrypted password to a plain-text password.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Pre-encrypted password


    If a password exists for this user, either in crypt or MD5 hash format, it will
    appear in this field. If you are importing UNIX users from an existing UNIX system,
    you may simply copy the password verbatim into this field. In most cases, the
    old password will continue to work on the new system. If importing many users,
    it may be more efficient to use the batch user creation feature instead of adding
    each user manually.


    > NOTE As the Password options and Group Membership options have already been
    covered in the module configuration section they will not be covered again here.


    # Upon Save...


    When saving user information, Webmin can be configured to perform additional actions,
    based on the following configuration options:


    # Move home directory if changed?


    If selected, and you have modified the value of the Home directory field, the
    path of the user''s home directory will be altered to the new location. If unselected,
    the contents of the old home directory will remain unaltered. The default is Yes.


    > NOTE Webmin attempts to rename the home directory rather than copy its contents.
    Because of this, the change must occur on the same filesystem, otherwise the change
    will fail.


    # Change user ID on files?, Change group ID on files?


    If you have altered the users User ID field and/or Group ID field, and these options
    are enabled, Webmin will change the user or group ownership of the files selected
    to the new UID or GID. If you have selected Home directory, only files within
    the user''s current home directory will have ownership altered, while the All
    files option will change ownership of all files on the system that are currently
    owned by the user. Changing all files may take a very long time, depending on
    the size of the filesystems to be searched.


    # Modify user in other modules?


    Because a UNIX system may maintain more than one user and password database for
    various services, Webmin provides a means to synchronize passwords and user creation
    across multiple files. For example, Samba and Squid may have their own user files
    and if configured to synchronize, Webmin will make changes to those files automatically
    when changes are made to system users. If this option is selected, changes made
    here will be made to all other modules that are configured for user synchronization.


    # Creating or Editing a Group


    Groups are used in UNIX to provide means of providing access to common resources
    to more than one user. For example, if a group of users is working on the same
    project, the directories and files for that project can be owned by a common group
    that has read and write access. Modern UNIX systems use a two-layered approach
    to groups, including a single Primary group and some number'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'of Secondary groups, also called supplementary groups. When a user creates
    a new file, the ownership will probably default to the user and her primary group.
    The default group membership of newly created users varies quite a bit between
    OS vendors and versions. Most modern UNIX versions create a new group whenever
    a new user is created that shares a name with the user. This becomes the primary
    group of the user. Because modern systems support a large number of Secondary
    groups transparently, this provides a very flexible means of configuring permissions.
    Many UNIX variants that have been around longer than Linux, like Solaris and the
    BSD-derived systems, may set the Primary group of new users to a users group or
    something similar.


    > **NOTE** *Linux, and most other recent UNIX systems, support at least 32 groups
    per user. However, because the NFS protocol only supports 16 groups, most of them
    have imposed a soft limit of 16 groups. There are very rarely circumstances that
    require more than 16 groups, but it is usually possible to use more if the system
    will not be exporting or using NFS mounted filesystems.*


    Creating or editing a group (Figure 5-13) is performed by clicking the Create
    a new group link or clicking the name of an existing group in group list.


    # Group Details


    When creating a new group of editing and existing groups, the following options
    are available:


    # Group name


    Like the username, this is a unique alphanumeric identifier. The name must follow
    the same rules as usernames, so must start with a letter and contain no non-alphanumeric
    characters. If editing the group, the name will be shown but cannot be edited.


    # Group ID


    This is the numeric identifier that the system uses to identify this group. It
    is not necessary for this ID to be unique, but there is very rarely a reason to
    have multiple groups with the same GID. When creating a new group, Webmin can
    select a new unused ID for you.


    # Password


    A little known and even less used feature of groups under most UNIX variants is
    that they can have a password just like users. When using this option, a user
    who normally is not part of a group can log in to a group using the newgrp command
    and providing the password. Because of the flexibility now available with the
    supplemental groups system, this feature is rarely used, but is still widely available.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '![](img/d84604054810a13cacfdac212ebee2f7_108_0.png)


    Figure 5-13: Editing a group


    # Members


    This field lists all current members of the group and allows adding any number
    of new members. The ... browse button allows you to choose from a selector popup
    containing all existing users.


    # Upon Save ...


    When saving group information, Webmin can be configured to perform additional
    actions, based on the following configuration options:


    # Change group ID on files?


    Much like the similarly named option for users, this provides the option to change
    the group ownership of files in either home directories or all files on the system.
    Selecting Home directories will cause Webmin to search all user home directories
    for files owned by this group, and change the group ownership to match the new
    group ID. Choosing All files will search the entire system, which may take a very
    long time, depending on the size and speed of the mounted disks. This change does
    not impact the user ownership of files. A file owned by seymour:users will still
    be owned by seymour after the change (and still owned by users for that matter,
    just under a different GID).'
  merge: -1
  img_proc: true
- pgno: 109
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 6


    # SERVER AND DAEMON CONFIGURATION


    ![](img/d84604054810a13cacfdac212ebee2f7_110_0.png)


    Clicking the Servers tab on the Webmin category bar brings you to what is probably
    the most interesting of the Webmin pages. It is here that all of the various complex
    servers and daemons can be configured. Webmin provides standard modules for a
    large number of the most popular servers and daemons in use on network systems
    in the world today, and more are being written all the time.


    # Introduction to Servers


    The Servers Webmin category allows for administration of the server applications
    that run on a system, which provide some service to clients on the network. One
    example is the Apache web server daemon. Clicking on the Apache icon in this category
    allows you to edit the Apache configuration files, which are usually located in
    /etc/httpd/'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'conf. Most modules located in Servers will enable you to edit some configuration
    file found in /etc or some subdirectory therein. One of the most impressive features
    of Webmin is the ability to allow you to edit files without damaging existing
    hand-edited configuration details.


    ![](img/d84604054810a13cacfdac212ebee2f7_111_0.png)


    Figure 6-1: Servers category


    The root of much of Webmin’s popularity is the ability for an administrator to
    perform some tasks through the Webmin interface without being forced to do all
    tasks with Webmin. Unlike some graphical front ends for UNIX systems, Webmin leaves
    an edited file intact as much as is possible. Comments are untouched, and the
    ordering of directives is not changed. This results in a system that can be configured
    through Webmin and through hand-editing of configuration files, but with no conflict
    between the two methods.


    A side effect of this feature is that Webmin generally must provide a one-to-one
    interface to configuration files in order to ensure that configuration options
    are not confused and to ensure that a savvy administrator gets what is expected
    from the Webmin output. This means that Webmin is not an “easier” way to administer
    a UNIX system. The administrator still must understand the tools he or she is
    administering with Webmin. For example, configuring DNS from Webmin requires an
    understanding of named and its required configuration files. The same applies
    to squid, httpd, sendmail, and so on. Webmin can make the learning process somewhat
    quicker, however, as all of the options are present on the display, which may
    or may not be the case with configuration files.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 7


    # APACHE WEBSERVER


    ![](img/d84604054810a13cacfdac212ebee2f7_112_0.png)


    The Apache module is broken up into several sections to address different aspects
    of an Apache configuration. On the main page, these sections are grouped into
    Global Configuration and Virtual Servers groups. Using virtual servers it is possible
    to locate several websites with unique domain names on a single IP address, in
    order to conserve the rapidly diminishing IPv4 address space.


    In the context of the Apache module, Global Configuration refers to configuration
    information that will apply to all virtual hosts that are run from the same httpd
    daemon. It is usually unnecessary to run more than one httpd daemon on a single
    machine but it is possible. It is also possible to manage more than one such daemon
    with Webmin via the module cloning feature.


    > NOTE The official Apache documentation [http://httpd.apache.org/docs/] is a
    good source of additional information about Apache and its modules.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Global Configuration


    Global Configuration is found on the top half of the divided Apache module page,
    as shown in Figure 7-1. It provides access to the various options that will be
    shared across all virtual servers, such as which modules to load, network addresses,
    MIME types, etc. The options configured here will apply to every virtual server
    and the default server. To configure an option for one specific virtual server
    it must be configured in the Virtual Servers Configuration section.


    ![](img/d84604054810a13cacfdac212ebee2f7_113_0.png)


    Figure 7-1: Apache Global Configuration


    # Processes and Limits


    This page provides the following options, which set many of the limits for Apache.
    Generally, the defaults are reasonable, but may need to be altered for high load
    or low memory situations. The options on this page cover two distinct but related
    limits that are configurable in Apache.


    The first set of limits is related to the length or number of request headers
    that will be accepted by the server. A request header is a term that refers to
    all of the information that a client sends to the server to indicate the object
    it would like to receive. The most important portion of the request header is
    usually made up of the HTTP method (such as GET, POST, HEAD, and so on), the URI
    (the complete path and domain name of the object being referred to), and the HTTP
    protocol version number.


    The second set of limits refers to connection and process specific limits of Apache.
    Apache usually operates in what is known as a process-per-connection mode, wherein
    each client connection to the server will be served by a single and independent
    httpd process. Thus to provide service to 30 simultaneous clients, the system
    will run 30 Apache processes.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Maximum headers in request


    Sets the maximum number of request headers accepted per request. Each time a web
    client (usually a web browser) makes a connection to a web server, it includes
    request headers to indicate information about the encoding capabilities, HTTP
    version support, cache-control, content negotiation and other information about
    the client agent. As HTTP standards and non-standard extensions to the HTTP protocol
    have been developed, the number of request headers usually received has risen
    slowly, but is rarely more than 20. The LimitRequestFields [http://www.apache.org/docs/mod/core.html#limitrequestfields]
    directive in the Apache configuration file is modified by this option and usually
    defaults to 100.


    It may be possible to prevent certain types of denial-of-service attacks by restricting
    the number of headers accepted, though it is unlikely to be a problem at the default
    value. It should rarely need to be altered from its default, unless clients receive
    error messages from the server indicating too many headers were in the request.


    # Maximum request header size


    Defines the maximum header field size that will be permitted. Apache sets aside
    a buffer for processing of header entries received from the client. This buffer
    must be large enough to contain a single header entry in its entirety. The LimitRequestFieldSize
    [http://www.apache.org/docs/mod/core.html#limitrequestfieldsize] directive is
    modified by this option, and it usually defaults to 8190 and this value is also
    the normal maximum value possible. It is worth noting that the maximum value for
    this option is system dependent and is compiled into the Apache executable when
    it is built. Raising this value above the default of 8190 may not be supported
    on your Apache and should not be necessary under any normal circumstances.


    # Maximum request line size


    Defines the maximum length of an HTTP request line. The request line contains
    the HTTP method, the complete URL, and the protocol version. The accepted line
    size needs to be long enough to contain any resource name on the system, and the
    default is generally recommended. This option edits the LimitRequestLine [http://www.apache.org/docs/mod/core.html#limitrequestline]
    directive in the Apache configuration and defaults to 8190 bytes, which is also
    the compiled-in upper bound for this value.


    This option rarely needs to be altered from its default, but may be useful in
    preventing certain types of denial-of-service attacks by preventing client applications
    from overloading the server with many extremely large and complex request lines.


    # Maximum concurrent requests


    The maximum number of allowed concurrent requests. Each request to Apache spawns
    a new daemon, and this defines the upper limit on how many such daemons will be
    spawned to answer requests. This option correlates to the'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'MaxClients [http://www.apache.org/docs/mod/core.html#maxclients] directive.

    To configure more than 256 you will probably have to edit HARD_SERVER_LIMIT entry
    in httpd.h and recompile your Apache, unless the package that is installed has
    already been configured for high loads or you did so when building Apache from
    the source tarball.


    Except in extremely high load environments it is rarely beneficial to raise this
    to very high levels. Because every new process requires resources, in the form
    of memory and CPU time, it can be counterproductive and cause service to become
    less responsive rather than more. If all processes are busy, the request will
    usually be queued up to the limit imposed by the listen queue length discussed
    in the next section of this chapter.


    # Maximum requests per server process


    The maximum number of requests that each child process will answer before being
    killed and respawned. This is useful for a couple of reasons. First, if there
    are any accidental memory leaks (anywhere in the process, including its modules),
    the damage can be minimized by restarting processes regularly. Also, without using
    this option the system will always keep alive the largest number of processes
    it has ever needed, even during low load periods when far fewer processes are
    needed to answer requests. This option correlates to the MaxRequestsPerChild [http://www.apache.org/docs/mod/core.html#maxrequestsperchild]
    directive.


    > NOTE

    > On Keepalive requests, only one request is counted per connection from a client.
    Thus, a number of requests from the same client may be served before the counter
    is incremented if the client supports Keepalive requests. In this case, this directive
    acts to limit the number of connections per process rather than number of individual
    requests.


    # Maximum spare server processes


    This defines the maximum number of unused server processes that will be left running.
    This option configures the MaxSpareServers [http://www.apache.org/docs/mod/core.html#maxspareservers]
    directive and defaults to 10. There is usually no need to tune this option, except
    on extremely high load servers.


    > CAUTION

    > Though Apache is historically a quite solidly written program, and has rarely
    exhibited major memory leaks, many of the shared modules in use by Apache may
    not be quite as commonly used or as well tested. These modules may lead to memory
    leakage even if the Apache httpd process does not exhibit such leakage.


    # Minimum spare server processes


    The minimum number of child processes that will be left running at all times.
    For high load servers, this may need to be raised, and for low memory and low
    load systems it might be best to reduce the number. This option correlates to
    the MinSpareServers [http://www.apache.org/docs/mod/core.html#minspareservers]
    directive and defaults to 5.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '> **CAUTION** *It is a very common mistake to raise the above two options to
    extreme levels when performance of an Apache installation seems sluggish. It is
    very rarely actually the source of the problem, but it seems a popular first reaction
    among new Apache administrators. Tuning Apache for performance is well documented
    in a number of locations, and much documentation about tuning for specific OS
    platforms is also available on the Internet. A good place to start is the Apache
    Performance Notes page [http://httpd.apache.org/docs/misc/perf-tuning.html]. The
    documentation found there will address nearly all performance issues that most
    users will ever run into.*


    # Initial server processes


    The number of child processes that are spawned when the httpd is started. Correlates
    to the StartServers [http://www.apache.org/docs/mod/core.html#startservers] directive
    and defaults to 5. This usually does not need to be modified, except on high load
    servers.


    # Display extended status information


    If the status module is enabled on the server, turning this on will keep track
    of extended status information for each request and present them in a web page
    or machine readable format. This option edits the s ExtendedStatus [http://httpd.apache.org/docs/mod/mod_status.html]
    directive. This option requires the mod_status module to be loaded.


    > **NOTE** *To access the extended status information from a running Apache server,
    you can browse to the address [http://www.yourdomain.com/server-status]. Note
    that access control should generally be configured to tightly restrict access
    to this URL, as it may contain sensitive data about your web server environment.*


    The information provided by mod_status, with extended status enabled, includes
    statistics about the number of child processes and the number of connected clients,
    the average number of requests per second being served, the average number of
    bytes per request, and the current CPU percentage being used by each Apache process.
    A machine readable form of this data may be collected from [http://www.yourdomain.com/server-status?auto].
    The latter is ideal for use in scripts to gather statistics from your server automatically.


    > **CAUTION** *Because of the persistent nature of this type of data, this module
    is only functional when Apache is run in standalone mode, and not when run in
    inetd mode. Because of the large number of problems involved in running Apache
    under inetd, and problems inherent to inetd, it is simply best to avoid inetd
    altogether, anyway.*


    # Networking and Addresses


    This section is for configuring the network addresses and ports where Apache will
    listen, and some other access limits, timeouts, and queue options (Figure 7-2).'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/d84604054810a13cacfdac212ebee2f7_117_0.png)


    Figure 7.2: Networking and Addresses


    # Listen on addresses and ports


    This option defines the addresses and ports where Apache will listen for requests.
    The default is to listen on port 80 on all addresses, and this is often all that
    is needed. Port 80 is the standard port for web traffic and should generally be
    used for all normal web traffic. It is also possible to configure multiple Apaches
    to run on the same machine with different global configurations on different ports
    or addresses. Also, because ports below 1024 are privileged ports, regular users
    running Apache without administrator access will have to run it on a non-standard
    port. 8080 is a common port for web servers run by unprivileged system users who
    cannot bind to port 80. A good overview of these options can be found at Setting
    which addresses and ports Apache uses [http://www.apache.org/docs/bind.html].
    These options correlate to the Listen [http://www.apache.org/docs/mod/core.html#listen]
    and Port [http://www.apache.org/docs/mod/core.html#port] directives.


    # Multiple requests per connection


    When KeepAlive [http://www.apache.org/docs/mod/core.html#keepalive] is enabled
    the server will support persistent connections, which can result in improved performance
    and a generally better experience for the end user. This option sets the maximum
    number of requests to be handled per client connection. If set to 0, the server
    will impose no limit on the number of requests during a single connection. This
    option correlates to the MaxKeepAliveRequests [http://www.apache.org/docs/mod/core.html#maxkeepaliverequests]
    directive. The default is usually 100.


    > **CAUTION** If you develop websites, resist the temptation to rely on persistent
    connections to maintain state. An unfortunate effect of persistent connections
    becoming available on most browser clients, as well as most web servers, is that
    some web application and commerce site developers have attempted to use a long-lasting
    persistent connection to maintain the shopping cart or other state information
    of the user. This seemingly easy method of keeping up with users is fraught with
    problems in the real world, and the time spent doing it right using back-end storage
    and cookies or similar session ID information will be well rewarded in the decrease
    of support problems you run into. Problems caused by the abuse of persistence
    include older web proxies that do not support persistence breaking the connection
    and causing your application to not work for anyone behind such a proxy. Even
    some network address translation'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'devices and load balancing systems can cause mysterious failures of the site.
    It is also an inefficient use of resources, potentially leading to many more server
    processes running than are necessary to service requests.


    # Keep-alive timeout


    The number of seconds Apache will wait for a subsequent request before closing
    a connection. This option edits the KeepAliveTimeout [http://www.apache.org/docs/mod/core.html#keepalivetimeout]
    directive. The default is 15 seconds. A too large value for this directive may
    lead to performance problems, as many clients may hold open idle connections to
    Apache processes that cannot exit or process requests for other users, thus they
    take up resources but remain idle.


    # Listen queue length


    The maximum length of the queue of pending connections. Generally no tuning is
    needed or desired, however on some systems it is desirable to increase this when
    under a TCP SYN flood attack. As discussed in the Processes and Limits section,
    the listen queue is where requests that cannot be served immediately end up. If
    this number is exceeded, subsequent requests will be dropped. Correlates to the
    ListenBacklog [http://www.apache.org/docs/mod/core.html#listenbacklog] directive.


    # Addresses for name virtual servers


    This option is used to configure the IP address on which Apache will listen for
    requests to virtual servers. Virtual servers are name-based servers, wherein several
    different domain names can answer on the same IP address. For example, I run two
    test servers on my local network. One is named liberty while the other is named
    constitution. Both run on the same server, but they answer on different named
    addresses and provide different root directories. So a visit to each will bring
    up different web pages. This, of course, works for real domain names as well (www.nostarch.com
    or www.swelltech.com, for example). Note that your DNS server, or the DNS server
    that is authoritative for the domain you wish to run virtual servers on, will
    also have to have entries for each virtual server you run that resolves to the
    IP of your server. It is also possible to specify a different port for a given
    name virtual server to listen on, by appending the port following a colon (i.e.,
    192.168.1.1:8080) would cause Apache to listen on port 8080 on the given IP. This
    option affects the NameVirtualHost [http://www.apache.org/docs/mod/core.html#namevirtualhost]
    directive. A tutorial on setting up Apache virtual hosts is provided later in
    this chapter. Another good source of information on virtual servers in Apache
    is the Apache Virtual Host documentation [http://www.apache.org/docs/vhosts/index.html].


    # TCP send buffer size


    Sets the size of the send buffer for TCP packets. It is usually safe to leave
    this at the default, which is determined by the default of your operating system.
    This option edits the SendBufferSize [http://www.apache.org/docs/mod/core.html#sendbuffersize]
    directive.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Request timeout


    Defines the maximum number of seconds that Apache will wait for a request after
    a connection has been established. Correlates to the Timeout [http://www.apache.org/docs/mod/core.html#timeout]
    directive.


    # Apache Modules


    Apache is designed in a modular fashion, so that the base server can be a small,
    easily debugged application, while nearly unlimited additional functionality can
    be added easily by loading additional modules. The base process can then be smaller,
    and only those additional features that are needed can be loaded. This Webmin
    module allows you to select the available Apache modules that you can load (Figure
    7-3).


    ![](img/d84604054810a13cacfdac212ebee2f7_119_0.png)


    Figure 7-3: Apache Modules


    The first module listed in the figure above is mod_so [http://www.apache.org/docs/mod/mod_so.html],
    which is the module that provides shared object loading at runtime. This module
    is required if you are using run-time module loading and is the only module other
    than core.c that cannot be a dynamically loaded module. It must be compiled into
    the Apache binary at build time if you will be using dynamically loaded modules.
    Dynamic Shared Objects are not supported by all operating systems, currently,
    but they are supported by the majority of modern systems including UNIX variants
    that support loadable .so libraries and Windows systems in the form of DLLs. There
    are several other modules in common use listed in the above figure, some of which
    will be discussed below. A good place to go to find out more about available standard
    modules and third-party modules is Apache modules [http://www.apache.org/docs/mod/index.html]
    and Apache Module Registry [http://modules.apache.org/].


    Configured modules are loaded into the Apache process on startup, thus it is possible
    to add new modules without recompiling the server. The modular nature of Apache
    is one of its primary benefits over other web servers. Without modules, Apache
    would be just another web server. But because modules are relatively easy to program,
    the variety available has proliferated, providing functionality for Apache that
    is unavailable in any other web server product, commercial or Open Source.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# About Apache Modules


    Because of the importance modules play in the configuration and management of
    an Apache web server, it is worthwhile to step out of Webmin for a short time
    to discuss some of the lower-level details of Apache and its modules. While the
    usage of these modules via Webmin is discussed throughout this chapter, an overview
    of the modules will help put the modular structure of Apache into perspective,
    and hopefully make clearer the interaction between Webmin and the underlying configuration
    files.


    > NOTE The official Apache modules [http://httpd.apache.org/docs/mod/] documentation
    page is an informative, and more comprehensive list of modules that are part of
    the Apache distribution. Only the most commonly used modules and their purposes
    will be discussed here. A similar page covers the Apache 2.0 modules [http://httpd.apache.org/docs/2.0/mod/].


    # Apache Core


    The Apache Core module [http://httpd.apache.org/docs/mod/core.html] provides the
    basic functionality that is required to provide web service as described by RFC
    2616. The features in core are always available in any Apache installation, regardless
    of what other modules are available. Most of the basic network, system, and HTTP
    limits and functions are handled by the core module, and many of the configuration
    directives are available with no additional modules required.


    # Multi-Processing Modules


    Beginning with Apache version 2.0, a new model (or more accurately, a number of
    new models) for handling connection concurrency has been added to the system.
    Concurrency in Apache versions prior to 2.0 used a model known as connection-per-process,
    with some enhancements to that model like pre-forking. New versions provide what
    are known as Multi-Processing modules, which allows Apache to use the concurrency
    model that makes the most sense for a give operating system. Most UNIX and UNIX-like
    systems use a module called worker, which implements a hybrid model utilizing
    a pool of multi-threaded processes.


    When the worker module is enabled, Apache runs a single control process that is
    responsible for launching child processes. The child processes spawn a configurable
    fixed number of threads each, and these individual threads listen for connections
    and serve them. Threads are lighter weight, or less resource intensive, than real
    processes, and thus a machine of a given capacity can provide higher throughput
    from a worker-style Apache than from a traditional pre-forking Apache. This was
    a primary motivation in the development of the new Apache 2.0 service modules.


    If your UNIX variant doesn''t support threads, or supports them in an incompatible
    way, Apache will likely use the prefork model instead. Windows machines will likely
    use the mpm_winnt Multi-Processing module, which creates a single control process
    that spawns a child process, which in turn creates threads to handle requests.
    Because Webmin only runs on UNIX-like operating systems at this time, you will
    likely have no use for the Windows module.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# mod_access


    This module provides access control based on client host name, IP address and
    other information taken from the client request. This module also provides some
    of the functionality involved in supporting directory .htaccess files to control
    access to certain parts of the server.


    # mod_auth


    User authentication of several types is supported by Apache. The oldest and most
    commonly used is supported by this module. It is known alternately as HTTP Basic
    Authentication or NCSA authentication. This method authenticates users from a
    plain-text file located somewhere on the system. The password file can be generated
    using the htpasswd program that is included with Apache.


    > NOTE To generate a password file using htpasswd, simply run the program with
    the -c option, a new file name, and the first username to add to the file:


    ```

    [joe@delilah mydocs]$ htpasswd -c .htpasswd joe

    ```


    This file can then be used by the mod_auth module to authenticate users based
    on this file. This must be explicitly configured in the Apache configuration file
    or in the local .htaccess file. Creating an .htaccess file is discussed in the
    tutorial section of this chapter.


    # mod_cgi


    The CGI module must be used in order to run scripts or programs on the server
    to generate content dynamically for users. It is possible to configure at runtime
    the file types that will be handled by the CGI module. Configuration of the CGI
    module can be handled separately for virtual hosts, or it may be applied globally
    to all virtual hosts on the server, or a combination of global defaults with specific
    differences in some virtual hosts.


    # mod_expires


    The HTTP specification defines a set of rules for clients and intermediary devices
    (specifically, web-caching proxies, like Squid) to follow when deciding whether
    to serve a cached document, re-validate the object, or fetch a new copy. A primary
    method for the website maintainer to dictate the result of these decisions for
    any given object is the Expires header. This module provides a flexible and simple
    method for configuring server-wide, as well as per-directory or by file type.


    # mod_rewrite


    This module provides an extremely flexible (some would say too flexible) means
    of redirecting user requests to different URLs based on information contained
    in the request. The basis of this module is a regular expressions-based parser
    and rewriting engine. The URL alterations can depend on a large variety of additional
    data, including environment variables, client headers, time, external database
    lookups, and more.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '> **NOTE** *To fully understand URL rewriting, it may be worth your time to
    study the URL Rewriting Guide [http://httpd.apache.org/docs-2.0/misc/rewriteguide.html]
    written by Ralf Engelschall, the original author of the mod_rewrite module.*


    # mod_ssl


    Normally, the HTTP protocol is not encrypted, and thus, not secure from prying
    eyes at any stage along the request path. Ordinarily, this is okay, and *man-in-the-middle*
    security problems of this sort are extremely rare (because the vast majority ISP
    and backbone administrators are honest folks who have no inclination to snoop
    on your web-browsing habits). However, for extremely private matters, such as
    online banking, investing, or making online purchases, it is important to have
    a more secure means of communication. The solution is *Secure Sockets Layer*,
    also known as simply SSL. The Open Source implementation is called OpenSSL, and
    it is the core of the mod_ssl Apache module.


    To use SSL connections, you must generate or purchase an SSL certificate from
    one of several *Certificate Authorities*. A locally generated certificate can
    be used for authentication within a company, or for a small number of users whom
    you already have a trust relationship with. However, if your secure site will
    be used by a number of users who have no direct relationship with you, a certificate
    from a trusted certificate authority will be required so the user will know that
    the site is operated by who it claims to be.


    > **NOTE** *Certificate Authorities, or CAs as they are often called, supported
    by most modern browsers include VeriSign [http://www.verisign.com/], GeoTrust
    [http://www.geotrust.com/], and Thawte Consulting [http://www.thawte.com/] in
    the U.S. Options outside of the U.S. include Internet Publishing Services [http://www.ips.es/]
    and BelSign [http://www.belsign.be/].*


    # mod_suexec


    In many web-hosting environments, a single server is shared by a number of users,
    and it would be inappropriate to allow the files of all users to be viewed by
    any other user. Because CGI scripts are run, by default, with the permissions
    of the web server itself, and the web server must have access to all content and
    scripts, it would be possible for a malicious user to use a CGI script to browse
    the contents of any other users private directories using Apache as an intermediary.
    In order to combat this problem in virtual hosting environments, the server may
    be configured to run CGI scripts as a specified user rather than as the more privileged
    Apache user (usually nobody). This module makes this feature possible by performing
    a suexec function on the created process when CGI scripts are run. There is some
    complexity in this solution, and there are many security pitfalls to beware of,
    but it is a required step to providing a secured virtual hosting environment with
    CGI script capabilities.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# MIME Types


    MIME Types is the method by which the server and its clients know what type of
    data a given object is. This information is generally more important to the client,
    as they must know how to interpret the data where the server only needs to send
    it to the client along with MIME identification information. MIME, or Multi-purpose
    Internet Mail Extensions, was originally defined to easily allow sending of data
    other than text via email. It has now become the standard method for many types
    of network connection to declare data type. The MIME Types module merely provides
    a list of the currently accepted MIME types and their optional extensions. At
    the bottom of the page, the Add a MIME type link allows you to add new MIME types
    easily (Figure 7-4).


    ![](img/d84604054810a13cacfdac212ebee2f7_123_0.png)


    Figure 7-4: Apache MIME types


    A great resource for more information on MIME types can be found at the MIME Page
    [http://www.oac.uci.edu/indiv/ehood/MIME/MIME.html] maintained by Earl Hood. Links
    to relevant RFCs as well as a MIME FAQ [http://www.faqs.org/faqs/mail/mime-faq/mime-0/]
    can be found there.


    # Miscellaneous


    The Miscellaneous options page is just what it sounds like (Figure 7-5). It''s
    the global options that didn''t seem to fit anywhere else. As such, there aren''t
    very many fields on this page, but nonetheless there are a few items of interest.


    ![](img/d84604054810a13cacfdac212ebee2f7_123_1.png)


    Figure 7-5: Apache Miscellaneous page


    # Core dump directory


    This is the directory where Apache will send its core dump file, in the event
    of a crash. By default this will be the same directory as the Apache server''s
    root directory. However, the server process will not normally have write access
    to this directory, so in order to get a core dump on crashes, it is necessary
    to change it to a directory that is writable by the Apache process. Core dumps
    are often used for debugging purposes. This option affects the CoreDumpDirectory
    [http://www.apache.org/docs/mod/core.html#coredumpdirectory] directive.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Server lock file


    This sets the location for Apache''s lock file to the file named. A lock file
    is the file that is used to notify a new instance of a process that one is already
    running. This prevents Apache from trying to start again, using the same configuration,
    if it is already running. Note that if you use a different configuration and a
    different lock file, it is possible to start multiple instances of Apache. This
    option corresponds to the LockFile [http://www.apache.org/docs/mod/core.html#lockfile]
    directive.


    # Server PID file


    The PID file for Apache. Edits the PidFile [http://www.apache.org/docs/mod/core.html#pidfile]
    directive.


    # Shared memory scoreboard file


    Some architectures require a file for the children and parent processes can communicate.
    For performance this can be placed on a RAM disk. This corresponds to the ScoreboardFile
    [http://www.apache.org/docs/mod/core.html#scoreboardfile] directive.


    # Server HTTP header


    This option allows you to set the data that will be contained within the HTTP
    header. This corresponds to the ServerTokens [http://www.apache.org/docs/mod/core.html#servertokens]
    directive.


    # Server execution


    Defines how the server will be started. Standalone indicates that it will run
    as a standalone daemon, while Run from inetd will cause it to run periodically,
    as called by the inetd daemon. It is strongly recommended to avoid the inetd option,
    as it does not always work as expected. This option edits the ServerType [http://www.apache.org/docs/mod/core.html#servertype]
    directive.


    # CGI Programs


    CGI, or Common Gateway Interface, provides a means for a website to have dynamic,
    program-generated content on a web page. CGI programs can interact with the user
    through the use of input fields and can provide different data based on the information
    returned. CGI programs can be written in nearly any language, though it is most
    common for them to be written in Perl, PHP, Python, Java, C, and bash or other
    shell scripting languages. The CGI Programs module provides an interface to the
    global CGI options of Apache (Figure 7-6).


    ![](img/d84604054810a13cacfdac212ebee2f7_124_0.png)


    Figure 7-6: Apache CGI Programs'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# CGI Script log


    Is the log directory for the CGI script error log file. If none is given, no log
    is created. Edits the ScriptLog directive found at [http://www.apache.org/docs/mod/mod_cgi.html#scriptlog].


    # Maximum logged post data size


    Data from a PUT or POST request to a CGI script that is written to the error log
    file can be limited in size, because PUT and POST requests can be extremely large.
    The default is 1024 bytes. This option correlates to the ScriptLogBuffer [http://www.apache.org/docs/mod/mod_cgi.html#scriptlogbuffer]
    directive.


    # Maximum CGI log post size


    Limits the size of the CGI script log file. When the log file exceeds this size,
    no more errors will be written to the log file. Corresponds to the ScriptLogLength
    [http://www.apache.org/docs/mod/mod_cgi.html#scriptloglength] directive.


    # Variables set based on browser type


    If the server should set some environment variables differently depending on the
    client browser type, it is possible to enter that data here. This option edits
    the BrowserMatch [http://www.apache.org/docs/mod/mod_setenvif.html#BrowserMatch]
    directive. Note that the mod_setenvif and mod_browser modules should be loaded
    when using these features.


    # Variable set based on request headers


    Allows you to set environment variables based on attributes of the request. This
    corresponds to the SetEnvIf [http://www.apache.org/docs/mod/mod_setenvif.html#SetEnvIf]
    directive.


    # Per-Directory Options Files


    Apache offers the ability to modify many global settings on a per-directory basis
    (Figure 7-7). This module provides access to that feature. To create an options
    file for a directory, simply enter the path and file name in the field and click
    Create Options File. By convention these files are called .htaccess, but that
    is a configurable option in Apache. This file also allows configuration of per-directory
    authentication among other access control features. More information on options
    files can be found in the Apache docs under the Options [http://www.apache.org/docs/mod/core.html#options]
    directive.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Virtual Servers


    The lower half of the Apache page contains a list of configured virtual servers
    (Figure 7-8). Each virtual server entry on this page shows the address and port
    the virtual server listens on, the server name, and the document root. Clicking
    the icon for the virtual server will bring you a page filled with many new options
    and many of the same options found in the Global section discussed earlier. The
    options that are repeated from that section generally behave the same, and so
    are not covered again.


    ![](img/d84604054810a13cacfdac212ebee2f7_126_0.png)


    Figure 7-7: Per-Directory Options File


    It’s important to remember that each virtual server has its own configuration.
    While it is possible to set default behaviors by editing the Default server (the
    first in the list of Virtual Servers), each virtual server may have configuration
    directives that override the default behavior. Each may have its own directory
    structure, server settings, MIME types, logging configuration, and more. Apache
    provides near-infinite options, and most of those can be applied to any individual
    virtual server, as well as to the server as a whole.


    # Log Files


    Logs provide a window into the operation of your web server, and Apache provides
    a great set of logging options so you can keep up with what your server is up
    to. In short, Apache allows you to configure each virtual host as though it were
    an independent server. This includes the ability to independently log information
    to a separate file and in a custom format.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '![](img/d84604054810a13cacfdac212ebee2f7_127_0.png)


    Figure 7-8: Virtual servers


    **CAUTION** Beware that there are particular security issues associated with logging
    in Apache. Because any logging helper programs will be started as the user that
    started Apache (usually root), the program must be secure. A good resource for
    further security information is the Security Tips [http://httpd.apache.org/docs/misc/security_tips.html]
    section of the official Apache documentation.


    # Error log to


    This sets where Apache sends error information for this virtual server. Usually
    this goes to the syslog daemon, which writes it to the primary web server error
    log. However, Apache can send this to an alternate logging program or to a file.
    This option configures the ErrorLog [http://httpd.apache.org/docs/mod/core.html#errorlog]
    directive and usually defaults to logging to the syslog daemon, if available.


    # Browser log file


    Here you can define whether Apache will keep logs of the user agents (browsers,
    most often, though robots and autodownloaders will show up also) that access the
    web server. This information is usually only of passing interest, except perhaps
    when you''re thinking of implementing some technology that is incompatible with
    some browsers (like Flash, Shockwave, and a host of lesser-known and even less
    widely accessible data formats). Reviewing these logs will often remind you of
    what percentage of your clients such technologies may alienate. Agent information
    is not logged by default. This option configures the AgentLog [http://httpd.apache.org/docs/mod/mod_log_agent.html#agentlog]
    directive.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Default log format


    This option allows you to configure Apache to write logs in an arbitrarily chosen
    format. If you want Apache to log in the Common Log Format you simply leave this
    on the default. However, to log in a different manner, you would select the Format
    choice and fill in the field either with a nickname of a named log format (discussed
    next) or with a log format string. This option configures the CustomLog directive.
    [http://httpd.apache.org/docs/mod/mod_log_config.html#customlog]


    # Named log formats


    A named log format is a custom log format, as discussed above, that has been defined
    and given a nickname for use by other log directives. A custom log format is created
    by entering a series of variables to indicate the data fields that should be present
    and the order in which they will appear. For example, a custom log type that mimics
    the Common Log Format looks like this:


    ```

    %h %l %u %t \"%r\" %>s %b

    ```


    This option configures the LogFormat [http://httpd.apache.org/docs/mod/mod_log_config.html#logformat]
    directive.


    # Access log files


    Here, you can define additional locations, formats, or programs for Apache to
    send logs to. Configuration is much like the Default log above, except that you
    may have any number of access log files. This allows you, for example, to log
    accesses of images to a separate file or to log visits to another format for processing
    and analyses. This option correlates to the TransferLog [http://httpd.apache.org/docs/mod/mod_log_config.html#transferlog]
    directive. Beware that the same security implications that affect all of the other
    logging directives affect this option as well.


    # Don''t log references from


    This option adds the host names provided to a list of hosts from whence referral
    information will not be logged. For example, if I wanted my web server at penguinfeet.org
    to ignore referrals from my other web page, swelltech.com, I would enter swelltech.com
    here. Then, my statistics wouldn''t be skewed by the large number of referrals
    from my own pages. This option correlates to the RefererIgnore [http://httpd.apache.org/docs/mod/mod_log_referer.html#refererignore]
    directive.


    # Referer log file


    Here you define where referer information is logged to. This can be a file or
    a program. This option configures the RefererLog [http://httpd.apache.org/docs/mod/mod_log_referer.html#refererlog]
    directive.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Document Options


    Here you have access to many of the virtual server specific options that will
    affect permissions, locations, and behaviors.


    The first field of this page has no label. It is the document root. This is usually
    set when the virtual server is created, and it is created automatically by Webmin.
    This option correlates to the DocumentRoot [http://httpd.apache.org/docs/mod/core.html#documentroot]
    directive.


    # User WWW directory


    Here, you configure the location where users can publish HTML documents via Apache.
    The syntax has several forms that perform different types of expansion to create
    the actual path. First, a relative link of the form htmldocs translates for user
    joe to “joe/htmldocs”. An absolute link, such as /usr/htmldocs, will translate
    to /usr/htmldocs/joe. Finally, it is possible to use an * to represent the username
    in the translation. For example, /home/*/htmldocs, will translate to /home/joe/htmldocs.
    This option configures the UserDir [http://httpd.apache.org/docs/mod/mod_userdir.html#userdir]
    directive.


    The following fields are continued options connected to the above User WWW directory
    option. They control which users’ directories will have the translation performed.
    Selecting All users accessible means that for any username entered in the URL,
    the translation will occur and the users’ web directories will be browsable. All
    users except allows you to disallow some users, while the rest are translated.
    This could be used, for example, to disable the website of a user who violated
    the terms of service. Finally, Only users explicitly named will have directory
    translation performed.


    # Per-directory options file


    Here you can specify a file name to be checked for directory access options. Unless
    prohibited elsewhere in Apache’s configuration, options found in a file by this
    name in any directory will override the default permissions for that directory.
    For example, if I chose the file name .acl, and in one of my directories I created
    such a file that included instructions to Generate directory indexes, then for
    that directory such indexes would be generated. This would apply even if the default
    is to not generate indexes. If you are operating a virtual hosting server, this
    can allow your users to have some freedom in the behavior of the web server for
    their individual site, without interfering with or altering the behavior of other
    sites on the same server. This can be thought of as one or more layer of the onion
    of configurability that is Apache. This option configures the AccessFileName directive
    and defaults to .htaccess.


    # Directory options


    Here, you can choose to use the default options for this directory. This effects
    the root directory for your virtual server and all subdirectories, except those
    the contain and AccessFileName file as discussed in the Per-directory options
    file section above. This option correlates to the Options [http://httpd.apache.org/docs/mod/core.html#options]
    directive and defaults to all, except for Generate Multiviews.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'The available directory options are as follows:


    **Execute CGI programs** Allows execution of CGI scripts located in this directory.


    **Follow symbolic links** The server will follow symbolic links in this directory.
    This correlates to the ExecCGI directive.


    **Server-side includes and execs** Server-side includes are permitted. This correlates
    to the FollowSymLinks directive.


    **Server-side includes** Permits server side includes, but disallows #exec command
    and the use of #include for CGI scripts. This correlates to the IncludesNOEXEC
    directive.


    **Generate directory indexes** When a URL maps to a directory in which there is
    no index HTML file (usually index.html, but this is a configurable option), then
    Apache can generate a formatted file list for the directory. This option correlates
    to the Indexes directive.


    **Generate Multiviews** Content-negotiated multiviews are permitted. This allows
    for multiple languages, character sets, and presentations to be referenced by
    the same URL. The client browser then negotiates with the server to select the
    appropriate one for the user. For more, see Content Negotiation [http://httpd.apache.org/docs/content-negotiation.html].
    This option correlates to the MultiViews directive.


    **Follow symbolic links if owners match** Apache will only follow symbolic links
    for which the target file or directory ownership matches that of the link. This
    option correlates to the SymLinksIfOwnerMatch directive.


    Note that if multiple items apply (inherited from a parent directory), then the
    ones specific to the selected directory apply, unless Merge with parent is selected.
    For example, if /home/httpd/penguinfoet has All permissions, but the subdirectory
    /home/httpd/penguinfoet/users has only ExecCGI, then that directory would only
    have the execute CGI option available. Merging with the parent, however, gives
    the subdirectory the same options, except where explicitly turned off.


    # Generate MD5 digests


    This option turns on generation of Content-MD5 digest headers. When enabled, Apache
    will generate a message digest, or fingerprint, for each static page served. When
    using MD5 digests, the client can be assured with a very high degree of confidence
    that if the content has been altered during transit from the origin server those
    alterations will be reflected in alterations in the message digest. The Content-MD5
    standard is described in RFC 1864 [http://www.ietf.org/rfc/rfc1864.txt?number=1864]
    and RFC 2616 [http://www.ietf.org/rfc/rfc2616.txt?number=2616]. This option configures
    the ContentDigest [http://httpd.apache.org/docs/mod/core.html#contentdigest] directive.
    Be aware that this option can have performance implications, because the digest
    is generated for each request, and digests will not be created for any requests
    that are served by modules.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Generate ETag header from


    ETag is an HTTP response header to provide a means of differentiating two or more
    objects with the same URL. The header is useful for intermediary devices that
    perform caching, as well as client browsers that cache results. Using the ETag,
    an object can be uniquely identified to the client. Usually, Apache generates
    the ETag based on the i-node number of the file, the last modified time of the
    file, and the size of the file. If Select attributes is chosen, you may select
    any or all of these criteria. This option correlates to the FileETag [http://httpd.apache.org/docs/mod/core.html#fileetag]
    directive.


    # Virtual server path


    Very old browsers and proxies cannot address name-based virtual servers and know
    only how to request a site by its IP. This leads to the unfortunate effect that
    those browsers will only be able to reach the default website on a given IP. A
    workaround for this problem is to provide a path from the default server to each
    virtual server. Using this directive, you can define where in the path of the
    default server this particular virtual server will reside. So, if my virtual server
    www.penguinfeet.org resides on a server at IP 123.45.67.89, and an older browser
    visits that name, it will end up browsing to the default server on the host —
    which can provide the user with a list of links to virtual servers hosted on this
    server. If this were set to /penguinfeet, the link would then take the user to
    http://www.penguinfeet.org/penguinfeet/, which is the correct page! Not exactly
    pretty, but the web wasn''t always as well thought out as it is today. And who
    can blame the original designers of the web for not realizing the one day everyone
    would have their own domain name! The good news is that those old web clients
    are simply no longer in use in any statistically significant quantity (they don''t
    show up on any of my web server logs, anyway; your mileage may vary). This option
    configures the ServerPath [http://httpd.apache.org/docs/mod/core.html#serverpath]
    directive. For more on virtual hosts and the potential issues, see also the Apache
    Virtual Host documentation [http://httpd.apache.org/docs/vhosts/].


    # Error message footer


    This option allows you to add a footer to all server-generated documents (such
    as error pages, mod_proxy ftp directory listings, mod_info output, and so on).
    This is usually only needed when your Apache is acting as a proxy, as it is most
    useful in discovering where an error message originates from in a chain of multiple
    proxies. This option configures the ServerSignature [http://httpd.apache.org/docs/mod/core.html#serversignature]
    directive and defaults to Off.


    # Automatically correct misspelled URLs?


    This option configures whether Apache will attempt to correct user spelling errors
    in the URL. If enabled, and a URL does not match a document on the server, a check
    will be performed of all of the objects available that could possibly match the
    user''s request. If one object is found that closely matches what the user requested
    — for example, if there was incorrect capitalizations but the object is spelled
    correctly or only one letter is missing — Apache will silently'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'redirect the user to the corrected URL. If multiple possible matches are found,
    the user will be redirected to a page containing a list of possible pages so they
    may select the correct page. If no possible matches are found, the request traverses
    the normal error path and will result in a 404 not found error. This option correlates
    to the CheckSpelling [http://httpd.apache.org/docs/mod/mod_speling.html#checkspelling]
    directive and defaults to Off.


    # Error Handling


    In the event of a server error, Apache can be configured to provide custom error
    messages, or redirect to a local or external URL, or by default output a simple
    hard-coded error message. Here, you may configure any error types for which you''d
    like to provide a custom message. So, for example, if you wanted a custom 404
    message that directed users to a local site search page (a convenient and polite
    thing to do), you could do that on this page. To configure the custom error responses
    feature of Apache, simply enter the error code, and then enter the URL or message
    to be displayed. See the Custom error responses documentation [http://httpd.apache.org/docs/custom-error.html]
    for more on this feature.


    # User and Group


    This page configures the user and group under which the Apache server will run.
    This sets the privileges the Apache and child processes will have while operating.
    It is strongly suggested that you set this to a user and group with as little
    privilege as possible (while still allowing the server to do its job). This is
    often configured to nobody and nogroup on many UNIX operating systems, and this
    is a good choice in most cases. Do not set this to root unless you know exactly
    what you''re doing and the security implications of doing so. Note that the Apache
    parent process, if started as root, will remain as root, while the child processes
    that actually service requests will run as the user and group set here. If the
    parent process is started by a non-root user, Apache will not be able to su to
    another user, and so will run as the user that started the process. This option
    configures the User [http://httpd.apache.org/docs/mod/core.html#user] and Group
    [http://httpd.apache.org/docs/mod/core.html#group] directives.


    # Aliases and Redirects


    Apache provides several forms of alias and redirection. This allows you to present
    more unified or simpler paths to your users in the URL, as well as serve objects
    from outside of your server''s root directory. It also allows you to redirect
    users to a new website during a transition period or direct their browser to the
    correct link if directory structure has changed.


    # Document directory aliases


    This allows objects to be stored in directories other than the root directory.
    Be aware that the aliases that end in a / will require the slash in the requested
    URL to be translated. This option correlates to the Alias [http://httpd.apache.org/docs/mod/mod_alias.html#alias]
    directive.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Regexp document directory aliases


    This option is very similar to the above, except that it allows the use of regular
    expressions to match paths to be translated. This option correlates to the AliasMatch
    [http://httpd.apache.org/docs/mod/mod_alias.html#aliasmatch] directive. For more
    on regular expressions, consult the regex man page.


    # URL redirects


    This option redirects an old URL into a new one. The new URL is returned to the
    client, which will attempt to fetch again with the new address. You can also specify
    a status message for the redirect, which can be one of several HTTP status codes,
    as described below. This option configures the Redirect [http://httpd.apache.org/docs/mod/mod_alias.html#redirect]
    directive.


    # Redirect status codes


    | Code | Description |

    |------|-------------|

    | 301 | Moved permanently. |

    | 302 | Moved temporarily. |

    | 303 | See other, meaning the resources has been replaced. |

    | 410 | The object is no longer available. When this status is used, the redirect
    To URL should be omitted. |


    # Regexp URL redirects


    This option behaves exactly like the above, except the From field can contain
    a regular expression to match. This option correlates to the RedirectMatch [http://httpd.apache.org/docs/mod/mod_alias.html#redirectmatch]
    directive.


    # Permanent URL redirects


    This option behaves as the above URL redirect with a status of 301 (moved permanently).
    Correlates to the RedirectPermanent [http://httpd.apache.org/docs/mod/mod_alias.html#redirectperm]
    directive.


    # Temporary URL redirects


    This option behaves as the above URL redirect with a status of 302 (moved temporarily).
    Correlates to the RedirectTemp [http://httpd.apache.org/docs/mod/mod_alias.html#redirecttemp]
    directive.


    # Map local to remote URLs


    This option allows a remote server to be mapped onto the space of the local server;
    the local server does not act as a conventional proxy, but appears to be a mirror
    of the remote server. For example, if the local URL is /mirror/otherdomain and
    the remote URL is http://www.otherdomain.com then users will be able to access
    http://www.otherdomain.com via http://www.thisdomain.com/mirror/otherdomain. This
    option corresponds to the ProxyPass [http://httpd.apache.org/docs/mod/mod_proxy.html#proxypass]
    directive.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Map remote Location: headers to local


    This option provides roughly the reverse functionality of the previous option.
    It adjusts the location header on HTTP indirect responses, which is necessary
    when Apache is being used as a reverse proxy in order to avoid having the reverse
    proxy bypassed by a redirect request. This option configures the ProxyPassReverse
    [http://httpd.apache.org/docs/mod/mod_proxy.html#proxypassreverse] directive.


    # Directory Indexing


    An index in Apache is simply a page that is displayed when a client browses to
    a directory on the server rather than an object or document. For example, if someone
    browses to my Squid patches directory on my server, which is located at http://www.swelttech.com/pengies/joe/patches/,
    Apache will serve an index page. If there is no file in the directory that matches
    Apache’s definition of an index page, it will instead generate an index page containing
    a file list, or it will serve an error page, if index generation is prohibited.
    This page allows you to configure the behavior of Apache when displaying index
    pages.


    # Directory index options


    This option sets the appearance and information contained in Apache-generated
    indexes. This option configures the IndexOptions [http://httpd.apache.org/docs/mod/mod_autoindex.html#indexoptions]
    directive. The following options are available:


    +   - **Display fancy directory indexes** This turns on fancy indexing of directories,
    which means that icons will be provided for files and directories. This configures
    the FancyIndexing sub-directive.

    +   - **Display HTML title as description** If files within the directory contain
    HTML title information, those titles will be displayed as the file names for their
    respective files. This option configures the ScanHTMLTitles sub-directive.

    +   - **Icon height** This sets the height of the icons in fancy directory listings.
    This correlates to the IconHeight sub-directive.

    +   - **Icon width** This sets the width of the icons in fancy directory listings.
    This correlates to the IconWidth sub-directive.

    +   - **Allow user sorting of columns** By default, Apache will generate listings
    that can be sorted by the user by clicking the column headings. If you do not
    wish for users to be able to sort by last-modified date or size, then you may
    disable this, and no sorting links will be provided. This option configures the
    SuppressColumnSorting sub-directive.

    +   - **Show file descriptions** Enable this to display descriptions of the files
    in the fancy index listings. This option correlates to the SuppressDescription
    sub-directive.

    +   - **Output HTML header tags** If using a header file (also configured on this
    page) for directory indexes, you may choose to allow Apache to output a standard
    HTML preamble containing enough to start a legal HTML page. If'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'this is disabled, your header will have to contain its own preamble to make
    it into a legal HTML page. This option configures the SuppressHTMLPreamble sub-directive.


    # Show last modified times


    By default, Apache will display the last modified time of each file in a generated
    index. Unselecting this option will cause Apache not to do so. This option configures
    the SuppressLastModified sub-directive.


    # Show file sizes


    This option is much like the previous option, except that it allows you to disable
    display of the size information about the files listed in a generated index. This
    option correlates to the SuppressSize sub-directive.


    # Include icon in link


    This will cause Apache to display icons as part of the link. This option configures
    the IconsAreLinks sub-directive.


    # Filename width


    Here you may configure the number of characters Apache will display in the filename
    of indexes. This option correlates to the NameWidth sub-directive. If this is
    set to * Apache will set the length to the length of the longest file name in
    the directory.


    # Description width


    The number of characters that will be displayed in the description field of generated
    indexes. This option correlates to the DescriptionWidth sub-directive. As above,
    if this value is set to * the description length will be set to that of the longest
    description in the directory.


    # Display directories first


    You may choose to have Apache sort the listing such that directories are listed
    first in the index. This option corresponds to the FoldersFirst sub-directive.


    # Directory index files


    Here you configure the file names that Apache will look for when entering a directory,
    and if one of them exists it will be displayed as the index of the directory rather
    than an auto-generated file index. This file will be displayed to clients who
    request any directory on the server by specifying a / at the end of the URL. This
    may be any file name or list of file names, though those used by convention include
    index.html or index.htm on operating systems with file name limitations. It is
    now not uncommon to use script suffixes on index pages, such as index.pl, index.cgi,
    or index.php. This option correlates to the DirectoryIndex [http://httpd.apache.org/docs/mod/mod_dir.html#directoryindex]
    directive.


    # Files to ignore in directory index


    If an auto-generated index is being displayed, you may specify files that are
    not to be listed in the index. This option configures the IndexIgnore [http://httpd.apache.org/docs/mod/mod_autoindex.html#indexignore]
    directive.


    # Directory index default icon


    Apache will automatically add icons to index listings when the file types of files
    are recognized. When no icon is known for a file type, you may configure an icon
    to be displayed here. This option correlates to the DefaultIcon [http://httpd.apache.org/docs/mod/mod_autoindex.html#defaulticon]
    directive.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Directory index header file


    Indexes may have a custom header file attached to them using this option. The
    file may be either a plain-text file or an HTML file. This option correlates to
    the HeaderName directive [http://httpd.apache.org/docs/mod/mod_autoindex.html#headername].


    # Directory index footer file


    Sets the path to the file to append to the end of an index. This option corresponds
    to the ReadmeName directive [http://httpd.apache.org/docs/mod/mod_autoindex.html#readmename].


    # Sort directory index by


    This option allows you to select how Apache will sort the entries on the index
    page. The order may be Ascending or Descending, and it may sort based on the Name
    of the file, Date of last modification, Size of the file, or the Description of
    the file. This option correlates to the IndexOrderDefault [http://httpd.apache.org/docs/mod/mod_autoindex.html#indexorderdefault]
    directive and defaults to sorting by file name in ascending order.


    # Directory index icons


    Here you may select the graphic icons that will be displayed beside file name
    links in the fancy directory listing index pages. The Icon is the relative path
    to the image file. The Alt text is the text to be displayed if the clients browser
    does not support images. Match by is the attribute to match against when deciding
    which icon will be displayed, and it can be one of Filename, MIME type, or Encoding.
    The Filenames, Types, or Encodings are simply the terms to be matched for this
    icon type to be displayed. This option configures the AddIcon [http://httpd.apache.org/docs/mod/mod_autoindex.html#addicon],
    AddIconByEncoding [http://httpd.apache.org/docs/mod/mod_autoindex.html#addiconbyencoding],
    and AddIconByType directives [http://httpd.apache.org/docs/mod/mod_autoindex.html#addiconbytype].
    When matching against the file name the MIME type, you can use wildcards to match
    any of several variations. For example, to match all backup files (as generated
    by ispell and other software), you could use the file match *~, Or, for a MIME
    type wildcard example, to match all images types, you could use image/*. It is
    generally recommended to match based on the MIME type rather than file extensions,
    when possible, as it tends to be less prone to missing files of certain types
    or misidentifying a file type.


    > NOTE When adding a file name matched icon, there are a couple of special names
    that allow you to match directories and blank lines (Apache uses blank lines to
    format the list). These are ^*DIRECTORY^* and ^*BLANKICON^*, respectively.


    # Directory index ALT tags


    Much like the previous option, this option allows you to configure the text to
    be displayed for files instead of icons. The possible values and wildcard usage
    are the same as for the previous option. This configures the AddAlt [http://httpd.apache.org/docs/mod/mod_autoindex.html#addalt],
    AddAltByEncoding'
  merge: -1
  img_proc: true
- pgno: 137
  md: '[http:// httpd.apache.org/docs/mod/mod_autoindex.html#addaltbyencoding], and
    AddAltByType [http:// httpd.apache.org/docs/mod/mod_autoindex.html#addaltbytype]
    directives.


    # Directory index descriptions


    Here you may define what descriptions will be displayed for a given file name
    extension. The length of this will be limited by the Description width option
    discussed above. This option configures the AddDescription [http:// httpd.apache.org/docs/mod/mod_autoindex.html#adddescription]
    directive.


    # Imagemaps


    Imagemaps provide a method to make images clickable in regions, where each region
    results in a different URL. Options on this page dictate default paths for imagemap
    URLs, actions to take on clicks within imagemaps, and the handling of error conditions.


    # Default base for imagemaps


    This option sets the base directory for imagemaps. If this is not set, the default
    is http://servername/. This correlates to the ImapBase [http:// httpd.apache.org/docs/mod/mod_imap.html#imapbase]
    directive.


    # Default action for imagemaps


    Sets the default used in imagemap files. This will be overridden by a default
    directive within the imagemap file. The default is nocontent or Do nothing which
    sends a 204 No content message to the browser. The browser should continue to
    display the original page. This option correlates to the ImapDefault [http://
    httpd.apache.org/docs/mod/mod_imap.html#imapdefault] directive.


    # Action on incorrect use of imagemaps


    This option determines what action Apache should take if an imagemap file is called
    without valid coordinates. This correlates to the ImapMenu [http:// httpd.apache.org/docs/mod/mod_imap.html#imapmenu]
    directive. The options are as follows:


    # Imap Menu Options


    +   - **none** If ImapMenu is none, no menu is generated, and the default action
    is performed.

    +   - **Show formatted menu** A formatted menu is the simplest menu. Comments
    in the imagemap file are ignored. A level one header is printed, then an hrule,
    then the links each on a separate line. The menu has a consistent, plain look
    close to that of a directory listing.

    +   - **Show semi-formatted menu** In the semi-formatted menu, comments are printed
    where they occur in the imagemap file. Blank lines are turned into HTML breaks.
    No header or hrule is printed, but otherwise the menu is the same as a formatted
    menu.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Show unformatted menu


    Comments are printed, blank lines are ignored. Nothing is printed that does not
    appear in the image map file. All breaks and headers must be included as comments
    in the imagemap file. This gives you the most flexibility over the appearance
    of your menus, but requires you to treat your map files as HTML instead of plain
    text.


    For more on image map files in Apache visit the mod_imap Module documentation
    [http://httpd.apache.org/docs/mod/mod_imap.html#imapmenu].


    # Proxying


    This page configures the mod_proxy module, which allows Apache to act as a full-featured
    HTTP proxy. While Squid is a higher performance and more featureful option in
    most cases, Apache can also provide some interesting functions and features for
    proxying and reverse proxying in very simple environments. For additional information
    on proxying with mod_proxy see the mod_proxy module documentation [http://httpd.apache.org/docs/mod/mod_proxy.html].
    Generally, however, if you need HTTP proxying or web caching, Squid [http://www.squid-cache.org]
    is a far better choice and is usually no more complicated to configure.


    # Act as proxy server?


    This option simply turns proxying on or off in Apache. This is not required for
    passing requests on to another server using the ProxyPass directive, which was
    documented briefly in the Directory Options section, and also is configurable
    on this page. This option correlates to the ProxyRequests [http://httpd.apache.org/docs/mod/mod_proxy.html#proxyrequests]
    directive, and defaults to Off.


    # Cache directory


    This option sets the directory where cached files will be stored. This directory
    must be writable by the server. If this option is not set, proxying will still
    function, but not caching will occur. This option correlates to the CacheRoot
    [http://httpd.apache.org/docs/mod/mod_proxy.html#cacheroot] directive and defaults
    to none.


    # Block requests to domains


    Provides a simple means of access control, wherein any domain or domain containing
    a word listed will be inaccessible through the proxy. The sites listed will be
    blocked even if the site is accessed via IP address, as Apache will resolve the
    names on startup and cache the IP information. This option correlates to the ProxyBlock
    [http://httpd.apache.org/docs/mod/mod_proxy.html#proxyblock] directive and defaults
    to none.


    # Requests to pass to another proxy.


    This option configures remote proxies that requests will be sent to if the request
    contains the words or domains in the match field. This option correlates to the
    ProxyRemote [http://httpd.apache.org/docs/mod/mod_proxy.html#proxyremote] directive
    and defaults to none.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Don''t pass requests to another proxy for


    Here you can configure any number of domains, IP addresses, IP subnets, or host
    names that will not be forwarded to another proxy via the above option. This option
    correlates to the NoProxy [http://httpd.apache.org/docs/mod/mod_proxy.html#noproxy]
    directive, and defaults to none.


    # Domain for requests with no domain


    This option is useful for proxy servers on intranets. It allows you to configure
    a domain name to be redirected to if a request is encountered without one. This
    option correlates to the ProxyDomain [http://httpd.apache.org/docs/mod/mod_proxy.html#proxydomain]
    directive and defaults to none.


    # Domains not to cache


    If caching is enabled above, here you can select some number of domains that will
    not be stored on the local proxy. This is useful for local domains, for which
    no benefit would be gained by locally caching the content thereof. This option
    configures the NoCache [http://httpd.apache.org/docs/mod/mod_proxy.html#nocache]
    directive and defaults to none.


    # Ports to which CONNECT is allowed


    This option dictates which ports Apache will allow the proxy CONNECT method on.
    This method is used to set up a tunnel for https connections. This option correlates
    to the AllowCONNECT [http://httpd.apache.org/docs/mod/mod_proxy.html#allowconnect]
    directive and defaults to ports 443 (https) and 563 (snews). Enabling this option
    overrides the default, so if you add ports here, you must include at least the
    https port for secure connections to work correctly through your proxy.


    # Cache default expiry time


    If an object is fetched via a protocol that does not support expiry times (such
    as ftp), or no expiry time is present, the cached data will be stored the specified
    number of hours. This option configures the CacheDefaultExpire [http://httpd.apache.org/docs/mod/mod_proxy.html#cachedefaultexpire]
    and defaults to 1 hour.


    # Cache directory name length


    Sets the number of characters in proxy cache subdirectory names. This option correlates
    to the CacheDirLength [http://httpd.apache.org/docs/mod/mod_proxy.html#cachedirlength]
    directive and defaults to 1.


    # Cache directory levels


    Sets the number of levels in the proxy cache subdirectory hierarchy. This option
    correlates to the CacheDirLevels [http://httpd.apache.org/docs/mod/mod_proxy.html#cachedirlevels]
    directive and defaults to 3.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Finish and cache transfer after


    If a transfer is canceled before completion, but after this percentage of the
    object has been received. Apache will continue to fetch the object in order to
    cache the complete object. Entering 0 here will cause the default to be used,
    and 100 will not store an object unless the whole transfer was completed. A number
    between 60 and 90 is suggested. This option configures the CacheForceCompletion
    [http://httpd.apache.org/docs/mod/mod_proxy.html#cacheforcecompletion] and defaults
    to 90.


    # Cache garbage collection interval


    If this is configured, Apache will perform periodic garbage collection, wherein
    it deletes files if the space used for cached objects is greater than the configured
    Cache size. This option accepts floating point values, so can be configured to
    perform garbage collection every 30 minutes, for example, by entering 0.5 here.
    If this is unset, the cache will grow indefinitely. This option configures the
    CacheGcInterval [http://httpd.apache.org/docs/mod/mod_proxy.html#cachegcinterval]
    and defaults to none.


    # Cached file expiry time factor


    If the origin HTTP server does not provide an expiry time for the object, Apache
    can estimate one by multiplying the time since the last modification by this factor.
    This option configures the CacheLastModifiedFactor [http://httpd.apache.org/docs/mod/mod_proxy.html#cachelastmodifiedfactor]
    directive and defaults to 0.1.


    # Cached file maximum expiry time


    After an object has been stored for this many hours, Apache will check for new
    content with the origin server, even if the expiry time supplied by the origin
    server has not yet been reached. This option configures the CacheMaxExpire [http://httpd.apache.org/docs/mod/mod_proxy.html#cachemaxexpire]
    directive and defaults to 24 hours.


    # Cache size


    Assuming garbage collection has been configured, Apache will restrict the size
    of the cached object storage directories to this number of kilobytes. This option
    correlates to the CacheSize [http://httpd.apache.org/docs/mod/mod_proxy.html#cachesize]
    directive and defaults to 5 KB.


    # Server Configuration


    This page allows you to reconfigure the basic configuration details of your virtual
    server. For example, if when you created your virtual server you placed it on
    port 8080 for testing, but now want to move it over to port 80 for production,
    you can perform that update here.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Address and Port


    If your system has multiple interfaces, Apache will answer on any of them by default
    on port 80. However, you can configure your virtual server to only answer on one
    address using this option. You can also configure a different port here.


    # Document Root


    This is the root directory, from whence the paths to access objects on your server
    will begin. This option configures the DocumentRoot [http://httpd.apache.org/docs/mod/core.html#documentroot]
    directive.


    # Server Name


    When using name based virtual servers, this name should match the name under which
    this server should answer. This is also used when creating redirection URLs. If
    not specified Apache will try to deduce it from the IP address, which isn''t always
    reliable. This option correlates to the ServerName [http://httpd.apache.org/docs/mod/core.html#servername]
    directive.


    # Tutorial: A Basic Apache Configuration


    Apache is an extremely large and feature-rich piece of software. Approaching it
    for the first time can be daunting. Luckily, it is extremely easy to install,
    configure, and maintain as long as you proceed with care and pay attention to
    the documentation relevant to your installation and environment. Installation
    of Apache is not covered here, as it is well documented on the Apache website,
    and it is also very likely that your OS vendor provides a suitable package to
    make installation automatic. What will be covered is the initial hurdle of setting
    up Apache to serve HTML web pages. The next section will take the configuration
    one step further to configuring a virtual hosting service. Later, a section in
    the BIND module chapter will cover adding /usr/w service for your web server.


    # Configuring Apache Paths


    > **NOTE** *If you''ve installed Apache from a package from your OS vendor or
    if your vendor does not provide a package and it has been installed in the default
    location selected by the program, you can probably skip this section and proceed
    to the next section covering initial module selection. For any supported OS, Webmin
    has a configuration file that includes sensible default paths for the programs
    that it administers. These configurations assume an installation in the default
    location for your operating system. So, for example, on a Red Hat Linux system,
    Webmin will expect to find the httpd.conf file in the /etc/httpd/conf directory,
    while on Solaris it is expected to be in /usr/local/apache/conf.*


    Webmin works directly with the Apache configuration files, and so must know where
    to find them. When you browse to the Apache module of Webmin for the first time
    you may be greeted with an error stating that the configuration file could not
    be found. You''ll need to locate the configuration files, as well as the Apache
    binary, and possibly startup and shutdown scripts for your system, and'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'configure Webmin to search the appropriate locations. The most important paths
    are probably Apache server root directory and the Path to httpd executable.


    # Module Selection


    Apache is extremely modular, and the vast majority of its available functionality
    is broken out into small modules that can be loaded at runtime depending on the
    needs of the specific environment in which it runs. Webmin needs to know about
    the modules that are available to your Apache so that it can provide configuration
    options for options that are available and hide options that are not. So, the
    first time you visit the Webmin Apache module, you''ll be presented with a list
    of Apache modules with check boxes beside them. If you''ve used a package or a
    default Apache source installation, you can simply click Configure. If you''ve
    built your Apache from scratch with customizations, you''ll need to choose the
    modules that you have made available in your installation, and then click Configure.


    # Adding Content


    Believe it or not, we''re now very nearly ready to serve up content with Apache.
    Once you''ve reached the primary Apache module page in Webmin, you''ll see a set
    of icons for the global server options as well as a single virtual server configuration
    section labeled Default server. The default server is the server that will answer
    a request when no other virtual servers do. Because we have no virtual servers
    configured on our system yet, the default server will answer all HTTP requests
    that reach our machine. Take note of the path in the Document root field, as this
    is where we''ll be placing our first web page.


    On my system the Document root for the default server is /var/www/html, which
    was automatically created during the installation process. So I will create a
    web page called index.html and drop it into that directory, making sure the page
    has permissions that will allow the Apache process to read it. The name index.html
    is significant, and you must use the correct file name for your default page,
    or else Apache won''t serve it without having the file specified after the address
    in the URL. Other common names for the index page are index.htm and default.htm.


    # Starting Apache


    Now all that is left is to start up your Apache server. Assuming Webmin has been
    configured correctly for your installation it can even be started from within
    Webmin with the click of a button. Simply browse to the Apache module main page,
    and click the Start Apache link in the upper right corner of the page.


    To test your new website browse to the IP on which your server resides with your
    favorite browser. For example, my testing server is located on IP 192.168.1.1,
    so I would enter http://192.168.1.1 into my browser URL field. Assuming everything
    went right, you''ll see your new web page.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Tutorial: Name-Based Virtual Hosting with Apache


    In the real world, it is rare to only operate one website on a machine. For all
    but the most demanding websites, it would be a waste of resources to do so, because
    a single modest computer can serve hundreds or thousands of web requests every
    minute without much effort. It would also be a waste of the finite IP space on
    the Internet, as there is a fixed number of IP addresses available, and the majority
    of them are already in use. To solve both problems Apache provides a feature known
    as name-based virtual hosts. With name-based virtual hosts, you may serve hundreds
    or thousands of websites, each with their own domain name, from a single machine
    running on a single IP!


    > **NOTE** *The terms virtual host and virtual server are generally interchangeable
    for our purposes. The terminology is constantly shifting, however, and you may
    hear the terms used differently in different contexts. In our case, the terms
    have the same meaning, but the term virtual host may be used to indicate a concept,
    while the term virtual server will generally be used to indicate a specific configuration
    detail.*


    In this short tutorial we will convert our existing default server into a virtual
    server, and create a new server that can be hosted alongside our first website
    on a different domain name. With the mention of domain names, you may have realized
    we won’t be able to test our new virtual servers until domain name service has
    been configured. Luckily, there is a short tutorial for that as well in the BIND
    chapter to which you can refer when you are ready to try out your new virtual
    hosts.


    # Converting a Default Server to a Virtual Server


    The first step to using virtual servers in a generic, and thus easily scalable
    and flexible manner, is to convert our already configured default server to a
    virtual server. Though this isn’t strictly necessary to make this change, it is
    a common practice to instead provide an appropriate error page or a page of links
    to all of the virtual hosts on the machine using a traditional URL syntax for
    web clients that are incompatible with name-based hosts (however extremely rare
    such clients may be). Because the default server will be used in the event no
    virtual servers match, it could also be left as-is, with all other hosts being
    configured using the virtual hosts mechanism.


    To create a new virtual server, fill in the form at the bottom of the primary
    Apache module page. You may leave the address and port empty and select the Any
    option for the address, unless your server has many IP addresses and you only
    want this virtual host to respond on one of them or you want this virtual host
    to respond on one or more nonstandard ports. For our example setup, we’ll just
    leave them empty. The Document Root can be any directory on your system to which
    the Apache process has read access; however, there are some conventions that you
    can follow in order to make your server more immediately comprehensible to subsequent
    administrators. If all of the virtual servers on your system are to be under the
    control of your company and you will be administering all of them yourself, it
    is wise to place all of the document roots into subdirectories of'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'whatever the default server document roots parent directory is. For example,
    on my system the default document root is /var/www/html, so it makes good sense
    for my virtual server document roots to reside in subdirectories of /var/www.
    The more common convention, however, is used in environments where many users
    will be maintaining many websites, and none of the users should have access to
    the other users'' website directories directly. In this case, the normal practice
    is to place the document root into the user''s home directory, in a sub-directory
    called htdocs or www.


    Finally, fill in the server name, which is the domain name on which you''d like
    this server to answer (Figure 7-9). If you don''t happen to own a domain that
    can be used for experimenting, you can simply make one up. We''ll be configuring
    our own local domain name server later on, so there are no rules about how you
    have to name it. You could call it google.com, or whitehouse.gov, or just george,
    if you wanted to. However, because it is likely you intend to put the server online
    for production use at some point in the future, you''ll likely just name it whatever
    domain name it will be at that point. In my case, I''d call it swelltech.com.


    ![](img/d84604054810a13cacfdac212ebee2f7_144_0.png)


    Figure 7-9: Creating a new virtual host


    Click Create. Now move your content from your default server document root directory
    into your new document root. In my case it is /var/www/ swelltech.com. After applying
    the changes to your server, your Apache configuration should be finished, though
    we''ll tackle a few more small issues before calling it done.


    # **NOTE**


    *To test your new virtual server, you can''t simply browse to your IP as you did
    in the previous tutorial. The browser request must contain the domain name for
    the virtual host in the URL. There are a couple of ways to achieve this. The first
    is to configure a local name server to temporarily provide name service for your
    new domain; the second is to set up your system hosts file to point to the appropriate
    IP for the domain name. The easiest is obviously to add it to your hosts file.
    You can do this in Webmin, if your client machine is a UNIX machine running Webmin,
    using the Networking→Network Configuration→Host addresses module. On a Windows
    client machine, you''ll need to edit the hosts file manually. It is located in
    c:\windows\hosts on Win 98 and Me; c:\winnt\system32\drivers\etc\hosts on Win
    NT, 2000, and XP Pro; and c:\windows\system32\drivers\etc\hosts on XP Home. The
    more interesting and educational method is to configure BIND to serve your new
    address, and then configure your client to get name service from the newly configured
    BIND. This is documented later in the BIND chapter; feel free to skip ahead and
    work through that tutorial now. I''ll wait for you here. . .*'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Adding Other Virtual Server Names


    Perhaps you noticed when we configured the above virtual server, it was named
    simply swelltech.com. Did you wonder why I didn’t call it www.swelltech.com instead?
    The reason is simple: I’d like for users to be able to browse to either address
    and get the same website. So I named the virtual server swelltech.com, and now
    a new server alias can be added to cause it to answer on both names. To add a
    new virtual server name to an existing virtual server, click the icon for the
    virtual server on the main Apache module page. Then click the **Networking and
    Addresses** icon. Now fill in all of the other domain names on which you’d like
    your website to appear. Note that these names must each have their own DNS record
    for users to be able to use them, just like the original swelltech.com name. Every
    additional host name in the domain is a new address, so www.swelltech.com and
    mail.swelltech.com have to have their own name record in the name server even
    if they are on the same machine.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 8


    # BIND


    ![](img/d84604054810a13cacfdac212ebee2f7_146_0.png)


    DNS, or the Domain Name System, is absolutely vital to the functioning of the
    Internet. In fact, though you rarely interact directly with the DNS the Internet
    as we know it could not exist without its constant presence. DNS associates, or
    binds, host names and domain names to IP addresses and thus allows you to type
    http://www.swelltech.com instead of the much less memorable IP 216.40.244.74.


    Further, it makes it possible for mail servers to easily locate the correct host
    to send mail to for a given domain, the correct administrative contact when strange
    things are originating from the domain, and more. But for our purposes, as ordinary
    system administrators, all we need to really keep in mind is that BIND is our
    method of providing DNS information for our network. It will provide information
    to our local users when their client applications need to access various sites
    by name. And it will provide information to clients (primarily other DNS servers
    acting as DNS clients'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'in order to fetch the correct information for their clients) on the Internet
    at large in order to advertise to the world how host names on our network can
    be reached. Think of it as a fancy telephone book, or even better, a telephone
    operator, for networked computers. The client computer has a name, but needs the
    number in order to reach it across the vast Internet. So it contacts the DNS server
    and asks for the number, and BIND is happy to do its best to return the correct
    number.


    Every host on a TCP/IP network has an IP address. This address must be unique
    for the network on which the address is routable. So, every host that is accessible
    via the Internet has a unique IP address that may, theoretically, be reached from
    anywhere else on the Internet. Because these addresses are doled out, roughly,
    according to physical location on the network, and because routers keep up with
    which other routers have access to which subnets, this simple number is all that
    is needed for your computer to establish a connection with any other computer
    on the Internet in seconds. Unfortunately, the topic of routing on the Internet
    falls quite outside the scope of this document, as Webmin is not designed to manage
    routers or the more complex routing features of Linux, FreeBSD, and the other
    operating systems that are supported.


    # A Brief History of BIND


    We have established already that BIND can provide name service for your network,
    allowing you to enter a host name rather than an IP when connecting to another
    computer on the network. However, we did not address how BIND, and DNS in general,
    works on the Internet at large. DNS on the Internet is really a multi-tiered system,
    wherein clients make queries of local name servers that serve a tiny fraction
    of the clients found on the Internet, usually on a single subnet. These local
    name servers then act as clients of somewhat larger name servers, which in turn
    act as clients for name servers above even them. At some point in this hierarchy
    the server will be one of the ROOT, or top-level domain, name servers, which will
    know what other lower-name server to query regarding the requested name. Each
    name server in the chain will likely save the results of the query, or cache the
    result, so will have no need to go all the way up the chain the next time the
    same query is made. Shockingly, perhaps, this system works quite well and has
    scaled as the Internet has grown from a few thousand hosts to hundreds of millions.


    # Walking Through an Example Query


    When you open your favorite browser and enter a request for a web page — for example,
    http://www.swelltech.com — quite a lot goes on behind the scenes before the browser
    can even begin to load data from the server. First, the URL you entered must be
    parsed and interpreted by the browser. But we don’t care about that step. Next,
    the domain and host name where the data is located must be found on the Internet.
    The name, www.swelltech.com, tells the browser very little about the physical
    or network location of the data, so it queries a tool that can make some sense
    out of that information: the DNS server.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'The DNS server receives the request and checks its internal cache for the host
    named www, in the second level domain swelltech, in the top-level domain (aka
    TLD) com. If the DNS server does not have this information cached, it becomes
    a client and asks its parent name server the same question: "What is the IP for
    the host www.swelltech.com?" Eventually, assuming no lower-level name servers
    have information about this host, a top-level domain name server (in this case,
    the one for the com TLD) will receive the query. The difference here is that the
    top-level domain name server knows the address of the name server that is responsible
    for that domain name, or at least the next level down, swelltech. Finally, the
    name server for the swelltech.com domain is queried, and the IP for the host www
    is returned. As mentioned earlier this data will then be cached by each name server
    in the query path so that next time, they won''t have to work so hard to answer
    the request.


    # The BIND Module


    The BIND module opens to a screen with two sections (Figure 8-1). The upper portion
    of the page is devoted to global BIND options, such as other DNS servers, logging,
    access control, and more. The lower portion of the display provides a number of
    icons, one for each of the zones your BIND is responsible for. This will include
    all Master, Slave, Forward, and Stub zones.


    ![](img/d84604054810a13cacfdac212ebee2f7_148_0.png)


    Figure 8-1: The BIND start page'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Configuring your BIND server is an area where Webmin can really make things
    simpler. Even though DNS is a very simple service on the surface, the BIND configuration
    files are notoriously confusing, and it is very easy to make a mistake that will
    render your name server useless. That''s not to say you can''t misconfigure your
    name server with Webmin, but it does make it a lot easier to generate a syntactically
    correct BIND configuration.


    > **NOTE** There are three BIND versions in common usage today, specifically versions
    4, 8, and 9. BIND 8 and 9 are functionally identical in many ways and share a
    configuration file syntax, so that a working BIND 8 configuration will very likely
    also be a working BIND 9 configuration. BIND 9 adds a few new features, but is
    primarily a rewrite of BIND 8 (the reasons for the rewrite are irrelevant for
    general users). Webmin has two BIND modules, one for 4 and one for 8 and 9. Because
    version 4 is extremely old and pretty rarely used outside of OpenBSD and older
    UNIX environments, it will not be covered here. BIND 8 and 9, because they share
    the same module and configuration syntax, can be covered together. Features available
    only in BIND 9 will be noted as such.


    # Global Server Options


    # Other DNS Servers


    The Other DNS Servers page allows you to configure the behavior of DNS servers
    that BIND will communicate with in one way or another in a zone transfer relationship.
    This allows you to explicitly configure several aspects of the transfer relationship
    for each server (Figure 8-2).


    ![](img/d84604054810a13cacfdac212ebee2f7_149_0.png)


    Figure 8-2: Configuring other servers


    The first field is the IP address of the server to configure. If you are receiving
    zone transfers for several servers and one of them is to be treated differently,
    here is where to configure it. The next field tells BIND to treat replies from
    this server as bogus, meaning incorrect. Future results that come from this domain
    will not be trusted. Next, in the Zone transfer format field, you can configure
    whether BIND will receive zone transfers one at a time or in a batch of many.
    Finally, though it is not yet implemented in BIND (at least not the latest version
    of BIND 8 — BIND 9 may have this feature by now), there is a placeholder for a
    per-server limitation on the number of transfers to initiate concurrently called
    Maximum transfers.


    > **NOTE** If you have configured any security keys as documented later in the
    DNS Keys section, there will be an additional field containing a check box for
    each of the keys configured. Selecting one will require the server to authenticate
    itself using the key selected. A copy of the key must exist on both the local
    server and the remote server and must be configured in the BIND configuration
    for each.


    This page configures the server directive and related options in your named.conf
    file. By default, no other servers are defined.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Logging and Errors


    This page provides a list of existing logging channels that are active for bind.
    It also allows you to add new logging channels. Generally speaking, the logs provided
    by BIND by default are enough for most purposes, providing a general overview
    of operations (starting, stopping, and so on) as well as any errors that occur
    during operation. However, if you need additional logging or logging of specific
    information to a separate file, you can configure it here.


    Logging in BIND 8 is very flexible but also a little confusing at first glance.
    To add a new log, you first create a new channel that can be set to log to a file
    or to a syslog level. You then configure the level of information to log there,
    as discussed next. Finally, you assign logging categories to that channel. The
    categories dictate what types of information are logged to this particular channel
    (Figure 8-3).


    ![](img/d84604054810a13cacfdac212ebee2f7_150_0.png)


    Figure 8-3: Creating a new logging channel


    In the example, I''ve created a logging channel called test. I''ve chosen to send
    it to a log file located at /var/log/test (I know what you''re thinking: "Where
    does he come up with these great names?"). So far it''s all pretty self-explanatory,
    but then we come to Minimum message level. Here we can set the logging level for
    the information we''d like logged. There are five presets, and you can also choose
    a numeric debug level. The five presets are, from order of least important, info,
    notice, warning, error, and critical, which are pretty much what they sound like.
    The info level is almost everything the server has to say about the subject, making
    for quite a chatty little log. On the other hand, the critical level is reserved
    for things that usually mean your name server is experiencing one or more serious
    problems, possibly leading to improper functioning of the server. These first
    five levels are the same as those used by syslog. The debug level option allows
    you to set a debug level for debugging messages to be sent to your log. Note that
    debug messages cannot be sent to syslog, and must be logged to a file. Finally,
    the Global level sets this log to the same level as the global server logging.


    Next, I assigned a logging category to the logging channel test. In this case
    I decided to send security information to this channel. There are currently 22
    supported categories of information that can be logged. They are as follows.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Logging categories


    | Category | Description |

    |---|---|

    | default | If no categories are specified, then default is used. Default contains
    most messages from the other categories, but a few are left out. |

    | config | Configuration file processing information. BIND writes these messages
    as it loads the configuration file. |

    | parser | Configuration file parsing information. BIND writes these messages
    as it parses the configuration file. |

    | queries | Logging of queries. |

    | lame-servers | Notifies you of the detection of a bad delegation. |

    | statistics | Provides periodic reports of general system runtime information.
    |

    | panic | Logging of problems that will cause the shutdown of the server. |

    | update | Dynamic updates. |

    | ncache | Negative caching. |

    | xfer-in | Zone transfers the server is receiving. |

    | xfer-out | Zone transfers the server is sending. |

    | db | All database operations. |

    | eventlib | Debugging info from the event system. Only one channel may be specified
    for this category, and it must be a file channel. If you do not define the eventlib
    category, eventlib will be directed to default. This is generally only useful
    to developers debugging BIND or its related libraries. |

    | packet | Dumps of packets received and sent. Only one channel may be specified
    for this category, and it must be a file channel. If you do not define the packet
    category, it will be directed to the default category at the debug level. |

    | notify | The NOTIFY protocol, which provides asynchronous change notifications.
    |

    | cname | CNAME errors. |

    | security | Approved and unapproved requests. |

    | os | Problems with the underlying operating system. |

    | insist | Internal consistency check failures. |

    | maintenance | Periodic maintenance events. |

    | load | Zone loading messages. |

    | response-checks | Messages arising from response checking, such as "Malformed
    response...", "wrong ans, name...", "unrelated additional info...", "invalid RR
    type...", and "bad referral...". |


    # Access Control Lists


    This page is for entering any number of named address match lists. The lists defined
    here are used later in the configuration for a number of purposes, though having
    an ACL by itself does nothing. To create an ACL, simply enter a name in the ACL
    Name field, and the addresses, networks, and other ACLs that this ACL will match
    in the second field. There are a few ACLs that are built in and do not need to
    be defined manually. These are any, which matches all hosts; none, which matches
    no hosts; localhost, which matches the IP address of all interfaces on the system
    where BIND is running; and localnets, which matches all hosts on the local networks
    for which the system has an interface configured.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Files and Directories


    Here you configure a few of the file locations for files that your BIND process
    may need to read from or write to. These usually do not need to be changed, but
    it may be useful to know what each of them refers to.


    # Statistics output file


    This option allows you to choose a different file name and path for the statistics
    that BIND generates when signaled. To cause BIND to dump statistics to this file,
    you can use the ndc program with the stats option, which will send the correct
    signal to BIND. This corresponds to the statistics-file directive in the options
    section of named.conf and defaults to named.stats.


    # Database dump file


    Configures the location of the file where BIND dumps its database when it receives
    the correct signal. The signal can be generated by using ndc dumpdb. This option
    correlates to the dump-file directive in the options section of named.conf and
    defaults to named_dump.db.


    # Process ID file


    This is the location of BIND''s process ID file. This location and file must be
    writable by the BIND process.


    # Path to zone transfer program


    This sets the path to the named-xfer program that BIND uses for inbound zone transfers.
    This option configures the named-xfer directive of the options section in named.conf.


    # Forwarding and Transfers


    This page allows you to configure parent DNS servers (Figure 8-4). Here, you declare
    what servers your BIND can query and how to behave towards them.


    ![](img/d84604054810a13cacfdac212ebee2f7_152_0.png)


    Figure 8-4: Forwarding and Transfers


    # Servers to forward queries to


    With this field, you enter any name servers that you wish your BIND process to
    query in the event it does not have a cached result to serve to the client. Usually
    this will be the name servers that your ISP or hosting service provides for you,
    but it may also be other servers on your local network. It''s a good idea to have
    at least two, which will be called the primary and secondary name servers, respectively.
    This option configures the forwarders directive in the options section of named.conf.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Lookup directly if no response from forwarder


    This option allows you to choose whether BIND should query the TLD servers directly
    if the forwarders do not reply. You may need to turn this off if you have a non-Internet-connected
    DNS server, or a server isolated by a firewall on your local network that can
    only communicate with the forwarders. This option configures the forward directive.


    # Maximum zone transfer time


    This allows you to put an upper limit on the time allowed for inbound zone transfers.
    This option correlates to the max-transfer-time-in directive, and defaults to
    120 minutes. After this time, a transfer will be terminated.


    # Zone transfer format


    Sets the global transfer format (which can be overridden on a per server basis,
    in the Other Servers section). Here you can choose whether BIND should receive
    a message for each resource record transferred. The many choice tells BIND to
    accept several per message, which is more efficient. This option correlates to
    the transfer-format directive.


    # Maximum concurrent zone transfers


    Places a limit on the number of concurrent transfers. This corresponds to the
    transfers-in option and defaults to 10. Increasing this may improve performance
    but at the cost of more system resources being consumed.


    # Addresses and Topology


    The following options specify network-specific details:


    # Ports and addresses to listen on


    BIND can answer on any number of ports and addresses on your server. By default,
    BIND will answer on port 53 on every active IP address. If you choose to listen
    on one or more specific addresses and/or ports, then BIND will answer on only
    those allowed by the match list. It is also possible to negate a port or IP by
    prepending an !.


    # Source IP address for queries


    If your BIND does not know the answer to a query, it will query other name servers.
    Here you can define the local addresses and ports on which to query those name
    servers. By default it can use any IP or port that is available on the system.


    # Nameserver choice topology


    When querying other servers, BIND can be configured to choose name servers that
    are closer in the topology address list. The order the servers appear in the list
    indicates their distance from the local name server, where the first is closest
    and the last is furthest. It is also possible to force one or more name servers
    to be'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'last resorts, by prepending them with !. Those servers prepended by an exclamation
    point will be placed at the end of the queue, regardless of placement in the topology
    address list.


    # Miscellaneous Options


    The BIND options with no other obvious locations ended up in this section, so
    it has a relatively large number of options. Luckily for you, most administrators
    don''t have to worry about these options very often. Unluckily for me, to achieve
    my goal of fully documenting the BIND module, I have to document these features
    just as completely as those that are more often used. So, on this page you''ll
    find several configurable memory usage settings, some timing options, and some
    general behavior choices.


    # Maximum core dump size


    This is the maximum file size of a dump file that BIND will generate in the event
    of a crash. This option configures the coresize option in the named.conf file.
    Your operating system may also impose a limit on core size, which may or may not
    be smaller than the value configured here.


    # Maximum data memory usage


    This defines the maximum amount of memory that BIND will use for storage of data.
    This is not the complete memory usage of BIND, as the process itself must have
    memory, but it can be used to limit BIND somewhat. This option correlates to the
    datasize in named.conf.


    # Maximum open files


    Defines the number of files that BIND can have open at any given time. The default
    is the limit of the OS; however, BIND is not always able to determine this at
    runtime if the operating system does not accurately report it. In this case, it
    may be necessary to use the correct value here. This is not a problem under the
    most popular operating systems where Webmin and BIND are used, such as FreeBSD
    and Linux. This option configures the files directive.


    # Maximum stack memory usage


    Defines the maximum amount of stack space that the BIND process may use. This
    correlates to the stacksize directive.


    # Interval between cleaning expired records


    BIND will periodically remove expired records from the cache. This option configures
    how often this cleaning occurs. This corresponds to the cleaning-interval and
    defaults to 60 minutes.


    # Interval between check for new interfaces


    BIND will scan the network interface list periodically, and this option configures
    the interval, in minutes, between scans. The default is 60 minutes. This option
    configures the interface-interval directive.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Interval between logging stats


    This setting controls how often BIND writes general server statistics to the logs.
    By default this occurs every 60 minutes, and if set to 0 statistics logging will
    be turned off. This option correlates to the statistics-interval directive.


    # Do full recursive lookups for clients?


    BIND can respond in one of two ways if it does not have an answer for a client.
    If this option is set to Yes, the default, then BIND will perform the lookup itself
    on a parent or root server. If this is turned off, BIND will simply refer the
    client to another name server that can answer the query. This option configures
    the recursion directive.


    # Allow multiple CNAME aliases for one name?


    Older versions of BIND allowed multiple CNAME resource records for a single domain,
    and many sites used this for load balancing. However, this usage is against standards
    and is not recommended. Turning this on allows you to use multiple CNAMES, as
    in older versions of BIND. The default is off, and it correlates to the multiple-cnames
    directive.


    # Fetch glue records?


    If this option is set to Yes, the default, the server will fetch "glue" resource
    records it does not have when constructing the additional data section of a response.
    Setting this to No can be used in conjunction with recursion no to prevent the
    server''s cache from growing or becoming corrupted. However, doing this increases
    the work for the client. This option configures the fetch-glue directive.


    # Set authoritative AA bit on responses?


    BIND normally caches negative responses (i.e., NXDOMAIN, or "this does not exist"),
    however, some very old servers and clients may have problems with this and generate
    errors. It''s probably wise to upgrade those old clients and servers rather than
    turning this off. This option configures the auth-nxdomain directive and defaults
    to Yes.


    # Control Interface Options


    BIND provides a command-line utility called rndc (or rdc in older versions) that
    allows an administrator to perform some administrative tasks. The newer rndc version
    allows these tasks to be performed on remote BIND servers as well as a server
    running locally, as it operates via a network socket. Common uses for this utility
    include stopping the named process, forcing a reload of configuration files, refreshing
    zone information, and triggering a dump of server stats. Because the rndc tool
    can be used to shut down the server, as well as other potentially dangerous actions,
    its use should be limited to a few trusted client addresses.


    This page of the BIND module provides access to the controls section of the BIND
    configuration file and configures the hosts that are allowed to connect to the
    running BIND server.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Internet port access


    If enabled, the first field must contain the local address on which the named
    server will listen for control requests. The port field can be the port on which
    you''d like the process to listen, or you can simply fill in an asterisk, "*",
    to specify a randomly selected unprivileged port (unprivileged ports on a UNIX
    system are usually those above 1024). Finally, the allow field should contain
    the addresses of the hosts you would like to be able to administer your server
    from. Generally, unless you have a reason to do otherwise, security is most easily
    maintained by preventing access to all outside addresses. In such a case you would
    choose an address of 127.0.0.1 in the first field, a port of *, and an allow list
    containing only 127.0.0.1. Assuming your local machine is trusted, your server
    will be relatively secure.


    # Unix filing system access


    As in the previous set of options, this directive specifies which clients will
    have access to the administrative channel of the running named process, but in
    this case, it is for the older style of communication using a UNIX FIFO pipe.
    A pipe in UNIX, is a mechanism by which a stream of data can be treated as a file,
    and vice versa. Or, in other words, it allows a running process to accept data
    being written into it as though it were a file and it can output data likewise
    in a form that can be read like a file.


    If using this mechanism for communicating with your named process, you can choose
    a file name for the pipe, the permissions for the pipe, the owner and group of
    the pipe. Care should be taken to make the file inaccessible to all but the administrative
    users of the system.


    > NOTE The UNIX pipe mechanism is not available in BIND 9. It has been deprecated
    in favor of using the network socket interface along with security keys. It is
    supported in BIND version 8.


    # DNS Keys


    Newer BIND version support secure keys for the purpose of authentication and authorizing
    access to certain functions. This page allows you to generate keys for use in
    other sections. Specifically, after generation, a key can be used to secure your
    Other Servers connections.


    # Installing a Key


    To create a new key, simply fill in a new Key ID, which must be an alphanumeric
    string with no whitespace, for example, mynewkey or supersecret or HenryThe8th.
    The Algorithm can usually safely remain at the default of hmac-md5. Finally, the
    Secret string must be a base64-encoded string.


    # Creating a Key with dnssec-keygen


    To generate a base64-encoded string for use in the Secret string field, you can
    use the dnssec-keygen or dnskeygen utility that is included in most installations
    of BIND. You can even use a plain string encoded with the mimencode utility, though'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'this will be significantly less secure than using an MD5 key. To create a key
    using dnssec-keygen, the following command line can be used with minor modifications
    to suit your server:


    ```

    [root@delilah]# dnssec-keygen -a HMAC-MD5 -b 128 -n HOST delilah.swelltech.com

    Kdelilah.swelltech.com.+157+06448

    ```


    In the above example, the second line is the output from the command, which gives
    you a hint about the filenames under which your new key is stored. In this case,
    two files were generated, named Kdelilah.swelltech.com.+157+06448.key and Kdelilah.swelltech.com.+157+06448.private.
    Both contain the newly generated key, and so you can view either to copy the key
    for pasting into the Webmin Secret string field. This key will also need to be
    made available to any servers that will be communicating with this server using
    security features.


    # Zone Defaults


    Here you can define several default options for new zones on your server and zones
    for which you provide backup service (Figure 8-5). These options can often be
    overridden in the definition of the individual zone; however, most such items
    are best configured here, and any differences from the norm can be configured
    in the individual zone. These options are only documented here, though they apply
    to individual zones as well. Note also that these do not affect the named.conf
    file at all. These are merely default values used by Webmin when creating new
    master zones, similar to the /etc/skel file used when creating new users. You''ll
    also find on this page settings for some default zone permissions options.


    # Refresh time


    This is interval for which your zones will be cached before being refreshed by
    slaves. Lowering this will increase the load on your master server but will help
    ensure fresh data reaches clients from your slave DNS servers. This option configures
    the refresh field in the SOA record in each new zone you create, and defaults
    to 10800 seconds, or 3 hours. Note that the introduction of the DNS NOTIFY protocol
    into BIND 8 removes the reliance of slaves on refresh times for prompt updates.
    To find out more take a look at RFC 1996 (http://www.ietf.org/rfc/rfc1966.txt?number=1966).
    BIND 4 and some other name servers may not have NOTIFY, so if your slaves are
    not all known to be NOTIFY capable, you should still be aware that your slaves
    will take the full refresh time to be guaranteed to be fresh.


    # Transfer retry time


    This defines the amount of time between retries if a refresh attempt fails. If
    you have reduced the refresh time, this value should be reduced accordingly. This
    option correlates to the retry field in an SOA record and defaults to 3600 seconds,
    or 1 hour.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Defaults for new master zones


    When creating a new master zone, Webmin can be configured to fill in some of the
    values with defaults for your network. The following options allow these defaults
    to be configured (Figure 8-5):


    # Default time-to-live


    This sets the minimum time to live for a zone. Downstream name servers will no
    longer consider the information they have cached accurate if it is older than
    this. They will continue to serve the old data if new data cannot be retrieved,
    until the expiry time has been reached. This option can be used very effectively
    to ensure that server or address changes can be performed without interruption
    of client services. For example, if you are aware that your website will be moving
    to a new server on a new address in a week, you can alter this to something very
    short, perhaps 30 seconds. By the end of the week, when your change happens, all
    name servers that have cached your information will know to check with a name
    server that is authoritative for your domain often. No one will even notice you
    changed! This option configures the TTL field in the SOA record and defaults to
    38400 seconds, or 10 hours.


    ![](img/d84604054810a13cacfdac212ebee2f7_158_0.png)


    Figure 8-5: Zone Defaults


    # Template records


    This section can be a nice time-saver if you create a large number of domains
    with Webmin (for example, if you run an ISP or a web-hosting company). Here you
    can define several template records that can be automatically inserted into some
    or all of your new zones. For example, if you have a single mail server and'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'two name servers that are the same for all of the domains you create you can
    create templates for each of those. When you create a zone file later, you can
    choose to have the templates included. It is also possible to add a single host,
    whose IP can be defined at zone creation time. The mail server, name alias, and
    name server templates must have addresses assigned to them from the beginning,
    however. There is no default template, and this section does not directly affect
    any BIND configuration files.


    # Default Zone Settings


    This section configures zone settings that will be applied by BIND for zones that
    do not override them. Unlike with the Defaults for new master zones section, these
    options do impact the BIND configuration file.


    # Allow transfers from


    Here you can define other servers that will, by default, be allowed to receive
    transfers from this server. This option correlates to the allow-transfer directive
    and defaults to allowing zone transfers to all hosts.


    # Allow queries from


    This one allows you to define what hosts or networks will be allowed to query
    your server. Any host that will use your name server should be listed here. However,
    by default, the server will allow requests from all hosts. This option configures
    the allow-query directive.


    # Check names in master zones? and Check names in slave zones?


    These two allow you to choose how strict your name server will be with regard
    to checking names within their expected client context. This means that, for example,
    a domain name used as a host name can be checked for compliance with relevant
    standards regarding domain names and host names. These options configure check-names
    master and check-names slave and default to fail and warn, respectively.


    # Check names in responses?


    Similar to the previous two options, but checks the names in responses to queries
    sent by the name server. If this is set to fail, your name server will REFUSE
    a query it receives and invalid name. This option configures the check-names response
    directive and defaults to ignore.


    # Notify slaves of changes?


    This option allows you to configure whether BIND will use the NOTIFY protocol
    to inform its slaves of updates. In this way, its slaves can query the master
    to see if a zone transfer is needed. If so, the transfer takes places immediately,
    and all servers are brought up to date much more quickly than if the slaves awaited
    their usual refresh age to be reached. This option configures the notify directive.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Existing DNS Zones


    This section of the BIND main page displays a list of all existing DNS zones.
    There are four types of zones (actually there are five, but the hint needs little
    configuration and is usually set up only once), master, slave, stub, and forward.
    And each of these types may be either a forward zone (meaning it maps names to
    addresses) or a reverse zone (maps addresses to names). Each of the four types
    has a specific purpose, depending on your name server''s relationship to the data
    it presents to clients.


    # Zone Types


    The following are the types of DNS zone:


    # master


    The server has the master copy of the zone data, and will provide authoritative
    answers for it.


    # slave


    A slave zone is a copy of a master zone. Each slave zone will have a list of masters
    that it may query to receive updates to its copy of the zone. A slave may, optionally,
    keep a copy of the zone saved on disk to speed startups. A single master server
    can have any number of slaves in order to distribute load.


    # stub


    A stub zone is much like a slave zone, and behaves similarly, however, it only
    replicates the NS records of a master zone rather than the whole zone.


    # forward


    A forward zone directs all queries in the zone to other servers. In this way it
    can act as a caching DNS server for a network, or provide Internet DNS services
    to a network behind a firewall that limits outside DNS queries (obviously the
    forwarding DNS server must have DNS access to the Internet!). Note that this is
    similar to the global forwarding facility, but allows per-zone selection of forwarders.


    # Creating a New Zone


    To create a new zone, click on one of the zone creation links in the Existing
    DNS Zones section of the screen. Each zone type will present you with the various
    fields necessary for Webmin to generate the new zone file for a zone of the selected
    type. The fields present differ for each zone type, except slave and stub, so
    we''ll document each in turn.


    # Creating a Forward Master Zone


    A master zone is one that contains the authoritative and complete data for a DNS
    zone, and therefore has the most configurable options (Figure 8-6). When creating
    any type of zone, it is necessary to create at least two zone database files,'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'one for forward mappings and one for reverse mappings. This is to provide both
    name to address translation, as well as address to name translation. Luckily,
    once you''ve created a forward and reverse master zone, Webmin can automatically
    add the correct reverse records for each host you add to your master zone.


    The options when creating zones are pretty straightforward, but I''ll discuss
    them briefly, as well as give an example of creating a new master forward and
    master reverse zone database.


    ![](img/d84604054810a13cacfdac212ebee2f7_161_0.png)


    Figure 8-6: Creating a new master zone


    # Zone type


    The zone type is either Forward or Reverse, as discussed earlier. In the example
    shown, I''m creating a new forward zone.


    # Domain name/Network


    This option will be either the domain name of the zone in the case of a forward
    zone or the network in the case of a reverse zone. Here, I''m creating a zone
    named myzone. Note that in my case, my domain is for a local network and will
    not be able to be resolved from the Internet at large (which requires registration
    in one of the top-level domains, such as .com, .org, or .net). Registration of
    a domain zone and obtaining addresses and other related tasks are well beyond
    the scope of this book, but the steps for creating Internet domains are precisely
    the same.


    # Records file


    This option allows you to choose the name and location of the db file while you
    would like your zone information stored. Webmin will automatically create a correctly
    named file in the system default location for you if you leave this option set
    to Automatic. Unless you have good reason for breaking convention it is recommended
    that you leave this as it is.


    # Master server


    Here you select the name of the master server for this domain. Because we are
    creating a master zone, this should be the host name of the server that will be
    the master for this file; in my example, I''ve selected the host name delilah.swell,
    a host on my local (non-Internet) domain swell. The sub-option Add NS record for
    master server? when checked, will add a name server record in this zone for this
    name server. It''s usually good to leave this checked and let Webmin handle one
    more of the many minor details it will handle if you let it.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Email address


    This should be the email address for the maintainer of this domain. In the case
    of Internet resolvable domains, this will be the person contacted in the event
    of problems with your DNS server(s).


    # Use zone template?


    If you created a zone template in your **Global Server Options:Zone Defaults**
    you can include that template information here. This can include any number of
    automatically generated records of several types (host address, mail server, name
    server, name alias, and host information). If you chose From form as a source
    for one of your host addresses, then you can enter that information in the **IP
    address for template records** field. Using the template facility in Webmin can
    prove a very powerful tool for administrators who manage a large number of zones
    that have the same name servers and mail servers. Creating a new domain can be
    done almost automatically in this way.


    # Refresh time


    This is the same as the option of the same name in **Global Server Options:Zone
    Defaults**, though it will only apply to this zone. This option will override
    the global zone default. The same applies to **Transfer retry time**, **Expiry
    time**, and **Default time-to-live**.


    Clicking Create takes you to the primary page for this new zone. We''ll come back
    to these options after discussing the creation of a reverse master zone, as it
    makes good sense to create your reverse zone for this domain before adding any
    records to the zone. In this way, Webmin can keep the two files in sync for you
    automatically.


    # Creating a Reverse Master Zone


    After creating a forward master zone, you may then want to return to the main
    BIND module page and create another master zone (Figure 8-7). This time, you will
    choose to create a reverse zone, in order to provide mapping from IP addresses
    to names.


    > **NOTE** *Reverse address resolution is somewhat different than forward resolution.
    With forward zones, there can be any number of addresses associated with a single
    IP, whereas there should only be one reverse record for a given IP. Thus if you
    are hosting many virtual services on a single IP, they can have their own domain
    name, but the IP can only map back to one of them in the event of a reverse lookup.
    Also, unless you own your own network IP block, or are using a private netblock,
    your name server will not necessarily be authoritative for your range of IP addresses.
    Reverse lookups are not frequently used, and when they are, it is usually only
    to confirm that an IP does resolve to some legitimate network.*


    Here, you''ll see that creating a reverse master zone is exactly like creating
    a forward master zone. In this case, I''ve chosen a zone type of Reverse, as this
    zone will map addresses to names. The only other difference between this and the
    previous example, is that I''ve entered the network address, 172.16.1, instead
    of the domain name. After creating this, I''m taken to the primary page for the
    new'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'zone. We will rarely edit the reverse master zone records directly, as it is
    easier and safer to allow Webmin to do it for us. So let''s return to the primary
    BIND module page and then edit our new myzone master zone.


    ![](img/d84604054810a13cacfdac212ebee2f7_163_0.png)


    Figure 8-7: Creating a reverse master zone


    # Adding Records to a Master Zone


    Assuming you successfully created a Forward Master Zone, it will now appear in
    the Existing DNS Zones section of your main BIND page. Clicking it takes you to
    a page that allows adding records of all types, as well as a few general zone
    options at the bottom of the page (Figure 8-8). The options at the bottom of the
    page are the same as those documented in the Global Zone Options sections earlier,
    except they only affect the one zone you are editing, so these options will not
    be covered here.


    ![](img/d84604054810a13cacfdac212ebee2f7_163_1.png)


    Figure 8-8: Edit Master Zone'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Address


    An address record allows you to enter the host name, the time to live, and the
    address for a host. Every host on your network should have an Address Record (Figure
    8-9). In the example, note that I''ve entered the fully qualified host name, and
    ended with a period. I''ve also chosen to have Webmin update the reverse master
    zone with this address, as well. This option creates an A record.


    # Name Server


    If you have another name server that is responsible for another subdomain (such
    as joeszone.myzone.), you can add it here. You can also add other name servers
    for this domain, including slaves and redundant masters. This option creates an
    NS record.


    # Name Alias


    Name aliases provide a means to name a host more than one name. For example, if
    you wanted your mail server (real name mail.myzone.) to also be addressable by
    the name smtp.myzone., you could create an alias for it here, and both names would
    resolve to the same machine. Also, it allows you to create shortcuts for your
    users. If for example, you wanted users to be able to simply enter news to reach
    a news server, even though your news server is actually in another domain. This
    option creates a CNAME record.


    # Mail Server


    Every mail server in your domain should have an entry here. On this page, the
    Name field should contain the name of the domain, and the Mail Server field should
    contain the name of the mail server. When creating a mail server record, you are
    given an extra option that is not present in any of the other records, called
    Priority. The Priority of a mail server is a relative value to indicate which
    mail server has precedence. The lower the value, the higher its precedence. Every
    mail record must have a Priority. In the event that the server with the highest
    precedence is down, mail servers can then deliver mail to the next server on the
    list. This option creates an MX record.


    ![](img/d84604054810a13cacfdac212ebee2f7_164_0.png)


    Figure 8-9: Adding an address record


    # Host Information


    This record type allows you to identify the type of host that is referenced by
    an address record. Here, you enter the name of the host and the Hardware type
    and Operating System type. These types are entirely optional, but if you do enter
    them, you should be aware of the security implications (identifying your hardware
    and OS is the first step a cracker takes in identifying ways to crack your system).
    Also, there are several rules documented in RFC 1700 [http://www.ietf.org/rfc/rfc1700.txt?number=1700]
    regarding how one should identify'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'hardware and OS. However, these rules are not at all strictly enforced and
    it is usually quite safe to use this record for internal record keeping purposes
    (i.e., instead of keeping a notebook or separate database of all of your hosts
    and what OS and version they run). This option creates a HINFO record.


    # Text Record


    Here you can enter any arbitrary text string up to about 2K. You can use this
    for notes regarding the host, perhaps the location or primary user of the host,
    as well as for other notes that can be referenced by other records, for example,
    in a Responsible Person record. This option creates a TXT record.


    # Well Known Service


    The Well Known Service record type allows you to configure what types of services
    a particular host provides. So, for example, you could advertise that the host
    myhost.myzone. can provide telnet, ftp, and smtp services. The services are identified
    by the same name as is found in the services file. This option creates a WKS record.
    More on Well Known Services can be found in section 3.4.2 of RFC 1035 [http://www.ietf.org/rfc/rfc1035.txt?number=1035].
    WKS records are optional, and are not in very common usage, nor is it supported
    by all domain name servers.


    # Responsible Person


    Here you define the person who is responsible for a given host or domain. The
    Name field is for the host name or the domain name, ending in a period if an absolute
    name. You can also enter the email address for the responsible person. The Text
    Record field can contain the name of a previously configured Text record. For
    example, if I were maintaining a domain and wanted people to be able to locate
    me in the event of a problem, I could create a text record named joe containing
    my cell phone number. Then for each host and subdomain I manage, I could create
    a Responsible Person record that contains not only my email address, but also
    refers to the joe Text record. This option creates an RP record.


    **TIP** *When entering an email address in the Responsible Person section, Webmin
    will automatically convert it to the dot-separated format required by BIND. You
    should enter email addresses in their real world form, i.e., joe@swelltech.com.*


    # Location


    The Location record is a rather new and experimental record type that allows one
    to include precise (on a global scale, anyway) information about each host and
    network in your zone. The location is defined in latitude, longitude, and altitude.
    The current Webmin version does not distinguish the separate parts of this information,
    so you must enter it yourself in the correct format. RFC 1876 [http://www.ietf.org/rfc/rfc1876.txt?number=1876]
    provides a more complete description of the Location record. One good resource
    to help you understand and use the LOC record, provided by one of the co-creators
    of the LOC specification, is DNS LOC: Geo-enabling the Domain Name System [http://www.ckdhrc.com/dns-loc/].
    There you can find links to sites that will provide the coordinates for'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'your location for free. There is also a link to AirNav, which will provide
    altitude information for public landing sites (airports) in your area. This isn''t
    as precise as a GPS system, but it''s better than nothing and a lot more information
    than most DNS servers are configured to provide.


    # Edit Records File


    This option merely provides a simple text editor window that contains the complete
    db file for your zone. This allows you to edit it manually; however, this is not
    recommended unless you are familiar with the BIND configuration file grammar as
    it is not checked by Webmin for correctness.


    # Creating a Slave or Stub Zone


    Slave and Stub zones are created in exactly the same way, and are quite similar
    in some ways though their purposes are very different (Figure 8-10). Slave zones
    keep a complete copy in memory, and sometimes also on disk, of a zone that it
    receives via a zone transfer from a master zone. A slave zone can answer any queries
    for a zone, and as long as network connectivity remains intact between the master
    and slave and the servers are configured correctly, it will stay in sync with
    the master server. A stub zone also syncs to a master server; however it only
    keeps NS and SOA record information from the master server. This allows BIND to
    keep up with delegation information automatically.


    ![](img/d84604054810a13cacfdac212ebee2f7_166_0.png)


    Figure 8-10: Creating a Slave Zone


    Creating a slave is extremely simple. The only information required is the domain
    name or the network (as was used in the master zone earlier), and the addresses
    of one or more master name servers. As with master zones, you configure both a
    forward and reverse zone type for each zone. This server can then be used by clients
    just as the master zone is used. In fact, whether it is a slave or master is entirely
    transparent to the user.


    # Creating a Forward Zone


    A forward zone is simpler still. It''s only possible configuration options are
    whether it is a forward (name to address) or reverse (address to name) zone type,
    the name or network of the domain, and the master servers to forward requests
    to. A forward zone is just specific instructions for BIND that it should forward
    requests for a specific zone to one or more specific name servers. BIND does not
    perform zone transfers with a forward zone, as it does in the case of slave and
    stub zones.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Tutorial: Setting Up a Caching Name Server with BIND


    A caching name server can be beneficial in a number of situations. First, because
    it brings name service closer to the user, performance of all name-based services
    will likely be improved. Also, in secured environments with a strict firewall
    implementation, it can be used to allow local clients to obtain name service without
    having to pierce the firewall for all users. Only the local caching DNS server
    must have access to outside name servers. Finally, it provides a simple mechanism
    for providing a private name space to local users, by allowing users to obtain
    all name service from the local caching name server, which also acts as a master
    name server for the local network name space.


    A caching name server is perhaps the simplest type of name server to configure,
    and Webmin makes the configuration even easier. Because caching is a core part
    of how DNS scales, it is an automatic part of any BIND configuration. All that
    is left for us to do is allow Webmin to create our initial configuration files
    and alter a couple of options in the configuration.


    # Initializing the named.conf


    When first opening the Webmin BIND module, you''ll be given a few choices about
    how to generate the initial configuration files. The ideal choice is to allow
    Webmin to initialize your configuration and download the root name server list.
    If you are not currently connected to the network you can choose to use the root
    name server list file that is included in the Webmin distribution.


    # Adding Forwarders


    After Webmin has completed the download, and initialized your files, click the
    Forwarding and Transfers icon. Add the primary and secondary name server addresses
    provided by your ISP to the field labeled Servers to forward queries to. Then
    select Yes for the option Lookup directly if no response from forwarder. Click
    Save.


    Believe it or not, your configuration is finished. Simply click the Start BIND
    button, point your client workstations to the IP of your server for their primary
    name server, and test it out. Check the later section on troubleshooting BIND
    if problems arise.


    # Tutorial: Name Resolution for Virtual Hosts


    As discussed earlier in the Apache chapter, a name-based virtual host has to have
    a name mapped to an IP address before you can even access its contents with a
    browser. BIND, of course, will be our means of providing lookup of those names.
    Because we''re only concerned with web service for this tutorial, we only need
    to concern ourselves with the creation of a forward zone (a forward zone maps
    names to addresses).'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Create a New Master Forward Zone


    Assuming you''ve already allowed Webmin to initialize your named configuration
    files you''re ready to add a master forward zone for your domain (Figure 8-11).
    Click the Create a new master zone link on the front page of the BIND module.


    The Zone type should remain at its default of Forward. The Domain name/ Network
    field should contain the second level domain name under which your virtual hosts
    will reside. For example, if I had one or more virtual hosts under the swelltech.com
    domain, that would be the domain name I would enter here. If you have other second
    level domains, you will create a zone for each. It is easiest to allow Webmin
    to automatically name the Records file, and the Master server will probably be
    correct if your host name is configured correctly. Enter your email address, or
    the address you would like to be the administrative contact for this zone, into
    the Email address field. Finally, click Create. You will immediately be directed
    to the new zone for further configuration.


    ![](img/d84604054810a13cacfdac212ebee2f7_168_0.png)


    Figure 8-11: An example master zone


    # Adding Address Records


    Now we can begin adding records to our new zone. The first record I would add
    to my swelltech.com domain would be swelltech.com itself, and it will be an address
    record, also known as an A record. Clicking the Addresses icon provides a simple
    form for adding the new record. Because this first record is for a host named
    simply swelltech.com, we enter nothing in the Name field. Then we enter the IP
    address of the server we''d like this name to point to, in my case it is the same
    address on which my Webmin server is running. All other fields can remain at their
    defaults. Clicking Create adds the record.


    Follow the same steps to add another address record for www.swelltech.com, presumably
    on the same IP. All that changes from the above steps is to enter www in the Name
    field instead of leaving it blank. If you''ve worked through the examples in the
    Apache tutorial on virtual hosting, you''ll now have all of the pieces for web
    service on both domain names.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Adding an Mail Server Record for Mail


    Because no domain would be complete without mail service, and mail service for
    a domain does not have to reside on the same server as web service, we need to
    have some way to tell mail servers where to direct our mail. Luckily, the designers
    of DNS have thought of that already and provide the MX, or mail server, record
    as a means of notifying other mail servers where to send email destined for the
    domain.


    Adding a mail server is usually a two part process. First, a new record is created
    pointing to the address of the mail server. In the case of small networks, this
    will likely be a machine that is providing other services. For example, the Swell
    Technology mail server resides on the same machine as our web server and our NTP
    time server. So, in most cases we can use a Name Alias record, also known as a
    CNAME record, for our mail server name. If you have a dedicated mail server you
    will use an address record instead.


    # Adding a Name Alias


    Because my mail server is hosted on the same address as my web server, I''ve chosen
    to use a CNAME record, or name alias, for mail.swelltech.com. Creating a name
    alias record is a lot like creating an address record. Click the Name Alias icon,
    and fill in the appropriate fields. In this case, I will fill in mail for the
    Name and swelltech.com. for the Real Name. Notice there is a period at the end
    of my real name. This period is significant, and required to indicate a fully
    qualified domain name, otherwise the real name pointed to would be swelltech.com.
    swelltech.com, which is probably not what we want. Click Create to add the new
    record.


    > NOTE This step is not strictly necessary if your mail server is hosted on the
    same machine as other named services. However, traditionally mail servers have
    had a name record of their own, usually mail.domain.com or smtp.domain.com. It
    also makes it easier to plan for later network expansions if you begin your network
    design with appropriate names for all of the services available on your network.
    If you wish to avoid adding a CNAME for mail service, you can skip this step and
    point your MX record to an existing name.


    # Creating an MX Record


    Now that we have a name for our server, we can add an MX, or mail server, record.
    This is simply a record that indicates to other mail servers where mail for our
    domain should be delivered. In my case, I would like mail directed to swelltech.com
    and all names within the domain to be delivered to mail.swelltech.com. So when
    a mail server receives a mail from one of its users directed to joe@swelltech.com,
    it will first find out where that mail ought to be delivered by querying the name
    server that is authoritative for swelltech.com for its MX record.


    To create a new mail server record, click the Mail Server icon. Because we are
    currently concerned with our primary domain, in my case swelltech.com, the Name
    field can be left empty. The Mail Server field can be filled in with the name
    of the mail server we created in the previous step, mail.swelltech.com in my'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'case. There is an additional field required, called Priority, which is simply
    a number that dictates the preference of this mail server relative to others that
    may be configured, where lower numbers have higher priority with zero being the
    lowest. Traditionally, a priority of 10 is used for the primary mail server, and
    other servers will be given priorities higher in steps of ten. So a backup mail
    server could have a priority of 20. There is no enforcement of this de facto standard,
    so you could use priorities of 0 and 43 to represent your primary and backup mail
    servers, but following traditions is probably more polite to any administrator
    who might have to follow in your footsteps. Click Create to add the mail server
    record.


    # Applying Changes and Testing the Results


    Now we have the bare minimum configuration required to make good use of our name
    server in the real world, so let''s reload our BIND configuration and make sure
    it is working. First, return to the BIND module front page by clicking the Module
    Index link in the upper right corner of the page. Then click the Apply Changes
    button at the bottom of the page to signal BIND to reload its configuration files.


    To test our work, we can use the host program. First, we''ll test to be sure our
    domain is resolvable from our name server:


    ```

    [joe@delilah joe]$ host swelltech.com 192.168.1.1

    Using domain server:

    Name: 192.168.1.1

    Address: 192.168.1.1#53

    Aliases:


    swelltech.com has address 192.168.1.1

    ```


    The host command is discussed further in the troubleshooting section of this chapter,
    but I will point out arguments I''ve used. Obviously, the first argument to the
    command is swelltech.com, which is the domain I''d like to look up. While the
    second argument is 192.168.1.1, which is the name server I''d like to query for
    the information. This allows us to easily set up a name server in isolation, without
    relying on it for real-world name service, so that it can be thoroughly tested
    and confirmed working. Because the above result is exactly what we expected to
    see, we can move on to testing the MX and NS records, to be sure they also match
    our expectations:


    ```

    [joe@delilah joe]$ host -t mx swelltech.com 192.168.1.1

    Using domain server:

    Name: 192.168.1.1

    Address: 192.168.1.1#53

    Aliases:


    swelltech.com mail is handled by 10 mail.swelltech.com.

    ```'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'This time, we’ve added an additional argument, "-t mx", to specify the type
    of record we’d like to retrieve. With this we can retrieve any record type we
    would like to test. Our only other currently configured record type is an NS record
    to indicate the authoritative name server for this domain, so we’ll also check
    it:


    ```

    [joe@delilah joe]$ host -t ns swelltech.com 192.168.1.1

    Using domain server:

    Name: 192.168.1.1

    Address: 192.168.1.1#53

    Aliases:


    swelltech.com name server ns1.swelltech.com.

    ```


    So far, so good! Just for completeness, let’s run one last lookup, to see how
    a name alias differs from a normal address record:


    ```

    [joe@delilah joe]$ host mail.swelltech.com 192.168.1.1

    Using domain server:

    Name: 192.168.1.1

    Address: 192.168.1.1#53

    Aliases:


    mail.swelltech.com is an alias for swelltech.com.

    swelltech.com has address 192.168.1.1

    ```


    Assuming all went well with your results, you’re ready to put your name server
    into service. The rest of this chapter is devoted to troubleshooting methods,
    and more advanced uses for the host and dig utilities, and working through the
    examples might provide some insight into the workings of DNS in a variety of applications
    and environments.


    # Troubleshooting BIND


    There are a number of tools that are available to assist with testing and troubleshooting
    problems with your BIND configuration. The simplest tool on most systems is the
    host command, which simply performs an address lookup or a reverse address lookup.
    More complete information can be gathered using dig. On extremely old systems,
    nslookup might still be the only available option for this type of testing, but
    it is rather confusing and inconsistent in a number of ways and is not recommended.


    # Using Host


    The host utility provides a very easy-to-use command-line interface for looking
    up a name or an address. In its simplest usage form it will return the IP address
    or addresses when given a host name as its argument. The mail host address or
    addresses will also be returned if available. If the command-line argument is
    an IP address, a reverse lookup will be performed and the host name will be'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'returned. host also has a few additional options that may be helpful in tracing
    DNS problems or testing your configuration for correctness. You may query your
    system default name server, or you can query any name server you need to test
    by appending a server address to the end of the command line.


    The simplest usage of host is to lookup an address, or a name:


    ```

    [joe@delilah joe]$ host swelltech.com

    swelltech.com has address 216.40.244.74

    [joe@delilah joe]$ host 216.40.244.74

    74.244.40.216.in-addr.arpa domain name pointer swelltech.com.

    ```


    Above, I''ve requested the address for the domain swelltech.com, and then the
    name for the address 216.40.244.74. I could also ask for the name servers that
    are authoritative for a domain by using the -t ns command-line option.


    ```

    [joe@delilah joe]$ host -t ns google.com

    google.com name server ns2.google.com.

    google.com name server ns3.google.com.

    google.com name server ns4.google.com.

    google.com name server ns1.google.com.

    ```


    Finally, the MX record can be retrieved by using the -t mx option:


    ```

    [joe@delilah joe]$ host -t mx yahoo.com

    yahoo.com mail is handled by 1 mx2.mail.yahoo.com.

    yahoo.com mail is handled by 5 mx4.mail.yahoo.com.

    yahoo.com mail is handled by 1 mx1.mail.yahoo.com.

    ```


    In the above MX record example, yahoo.com has three mail servers defined. The
    MX record has an additional field to indicate the priority of the server relative
    to other servers, in this case mx1.mail.yahoo.com and mx2.mail.yahoo.com have
    a priority of 1 so they will be preferred over mx4.mail.yahoo.com, which will
    only be used in the event the other two servers are unavailable.


    **NOTE** Not all options of the host utility are discussed here. For more detailed
    coverage of all of the command-line options consult the host man page, either
    via the Webmin man pages interface or from the command line.


    The -v option enables verbose output, which is in a format compatible with BINDs
    own master file format, so it can be directly imported into a BIND configuration
    without additional parsing or modification. The -t option allows you to specify
    the query type to make of the name server. There are many query types, but common
    types that may be useful include cname, which lists the canonical name entries
    for the host if available, and the ns type which lists the authoritative name
    servers for the host.


    One of the more verbose options of host is the -a option, which will list all
    available fields for the host, including all A records, CNAME records, NS records,
    and so on. Using host with this option against your own name server is a good
    way to ensure it is providing all of the information you expect.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Using dig


    The dig, or domain information groper, provides the ability to query any domain
    server for information about the domains it serves. It operates in both an interactive
    mode and a batch query mode. Using dig is much like using host, in that in its
    simplest mode you enter just the command and the name to lookup. However, dig
    is more verbose by default and presents a much wider array or information, though
    in a somewhat less readable form.


    Just like host, it is possible to query your default system resolver, or you can
    query a name server specified on the command line. For example, I could query
    my local name server about the nostarch.com domain.


    ```

    [joe@delilah joe]$ dig @192.168.1.1 nostarch.com


    ; <<>> DiG 9.2.1 <<>> @192.168.1.1 nostarch.com

    ;; global options:  printcmd

    ;; Got answer:

    ;; ->HEADER<<- opcode: QUERY, status: NOERROR, id: 21448

    ;; flags: qr rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 2, ADDITIONAL: 2


    ;; QUESTION SECTION:

    ;nostarch.com.            IN      A


    ;; ANSWER SECTION:

    nostarch.com.            8585    IN      A       66.80.60.21


    ;; AUTHORITY SECTION:

    nostarch.com.            8585    IN      NS      ns1.megapath.net.

    nostarch.com.            8585    IN      NS      ns2.megapath.net.


    ;; ADDITIONAL SECTION:

    ns1.megapath.net.        123591  IN      A       66.80.130.23

    ns2.megapath.net.        123591  IN      A       66.80.131.5


    ;; Query time: 281 msec

    ;; SERVER: 192.168.1.1#53(192.168.1.1)

    ;; WHEN: Sat Oct 26 19:42:45 2002

    ;; MSG SIZE  rcvd: 126

    ```


    Above, we have a large amount of information, though not all of it is generally
    useful to us. First is the version of dig and the command-line options we specified.
    The comes some status information, including the NOERROR designator that indicates
    the name was retrieve without error. If the domain did not exist, or could not
    be queried, there would be an NXDOMAIN error or some other error. Next are the
    flags of the query. In this case, we have one query and one answer which are contained
    in the QUESTION and ANSWER sections below it. The next two items inform us of
    the number of AUTHORITY and ADDITIONAL sections that follow. In this'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'case, the authority section gives us the primary and secondary name servers
    for this domain, ns1.megapath.com and ns2.megapath.com, and the additional section
    provides the IP addresses of those name servers.


    The last few lines give the time the query required, the server that was queried
    and the port on which it was queried, the time and date on which the query was
    made, and the size of the message received from the name server.


    Like host, dig has a mode in which you can query all of the information available
    about the domain. This can be done by appending the ANY argument to the end of
    the command line. Furthermore, the options NS, MX, CNAME, and so on are also available
    and do just what you would expect.'
  merge: -1
  img_proc: true
- pgno: 175
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 9


    # FTP SERVER


    ![](img/d84604054810a13cacfdac212ebee2f7_176_0.png)


    The File Transfer Protocol is a lightweight protocol for transferring files over
    a network. It is a client-server protocol requiring an FTP server, such as WU-FTPD
    [http://www.wu-ftpd.org/] and a client such as ncftp [http://www.ncftp.com/].
    WU-FTPD is the most popular FTP server on the Internet, and though it has had
    its problems (primarily security-related), it is a very feature-rich FTP daemon.


    WU-FTPD has been in constant development for over ten years and has attracted
    a lot of users and developers during that time. This chapter covers all of the
    configuration files involved in running a WU-FTPD installation (Figure 9-1). It
    is highly recommended that you make sure your FTP server is running the latest
    version (2.6.2 is the version as of this writing), as all earlier versions have
    widely known security exploits.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '![](img/d84604054810a13cacfdac212ebee2f7_177_0.png)


    Figure 9-1: WU-FTPD Server


    # Users and Classes


    Here you configure the various user and group features of the ftpaccess file (Figure
    9.2). For more on this file and its structure, see the ftpaccess man page [http://www.wu-ftpd.org/man/ftpaccess.html].


    # User classes


    Here you define a class of users, and the networks from which they are allowed
    to log in. Note that the default includes a class a11 for users of all types (real,
    guest, and anonymous) which matches all networks with the *. This option configures
    the class directive.


    # Unix users and UIDs to treat as guests and Unix groups and GIDs to treat as
    guests


    Here, you will define users and groups who would ordinarily qualify as real users
    who will be treated as guests, or anonymous users. In other words, a chroot will
    be done, and the user will not be permitted to use the USER or PASS commands.
    The users home directory must be properly set up, as an anonymous FTP directory
    would be. These two options correspond to the guestuser and guestgroup directives.


    # Unix users and UIDs not to treat as guests and Unix groups and GIDs not to treat
    as guests'
  merge: -1
  img_proc: true
- pgno: 178
  md: '![](img/d84604054810a13cacfdac212ebee2f7_178_0.png)


    Figure 9-2: Users and Classes


    # Unix users to deny (from /etc/ftpusers)


    This is simply a list of users to deny access to the server to. This information
    is drawn from the /etc/ftpusers file. Adding to this list will add to the file.
    Note that if the next two sets of options are used to precisely control access
    to the FTP server (i.e., by blocking all access except for explicitly permitted
    users), then the ftpusers file becomes unnecessary.


    # Unix users and UIDs to deny and Unix groups and GIDs to deny


    Here you can enter any users or groups you would like to deny access to. These
    options configure the deny-uid and deny-gid directives.


    # Unix users and UIDs not to deny and Unix groups and GIDs not to deny


    These options can be used to negate the above options, if you chose to disallow
    all access from all users and groups. In this way, you could allow only explicitly
    configured users to access the server.


    # Messages and Banners


    WU-FTPD provides a simple mechanism for informing users of important information
    regarding the server, or files on the server. As in the previous section, this
    page configures certain aspects of the ftpaccess (Figure 9-3).


    # Message files


    This option configures the messages that will be displayed on login to the server.
    The default on many systems is to display a message contained in the file welcome.msg
    in the root FTP directory, if it exists, as soon as someone logs in. Also, when
    entering a directory the server will check for the existence of a file called
    .message in the new directory. If it exists, it will be displayed. Both of these
    are optional, and the names and actions can be changed at will. This option configures
    the message directive.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '![](img/d84604054810a13cacfdac212ebee2f7_179_0.png)


    Figure 9-3: Messages and Banners


    # README files


    Here, you can configure the behavior of the server with regard to README files.
    This, too, is set up by default on most systems. In this case, any file beginning
    README will be displayed to the user, both on logging into the server, and upon
    entering a new directory. This option configures the readme directive.


    # Greeting level


    Here you can select how much information about your server will be presented to
    the user. This can include the host name, the server version, and nothing. This
    can be a mild security risk, as the first step to cracking a box is to figure
    out what software and version is running. However, if the system is kept up to
    date (religiously), and the system is otherwise secured, this should not be an
    issue. Many paranoid types (and there’s no harm in being paranoid in a world where
    script kiddies are a dime a dozen) will disable all specific software and version
    information on all of their publicly accessible services. This option configures
    the greeting directive.


    # Pre-login banner


    Here you configure a banner that will be displayed before the user is prompted
    for a user name and password. This option can cause problems with non-compliant
    FTP client software. This option configures the banner directive.


    # Hostname for messages


    This will be the host name that is printed in the greeting message, and anytime
    the host name is inserted into a message for the user. This option configures
    the hostname directive.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Owner''s email address


    Here you can set the email address of the servers maintainer. This will be presented
    as the contact email for this server. This option configures the email directive.


    # Limits and Access Control


    This page provides access to various resource limits, as well as provides system
    level access controls. If you wish to limit the system or network resources your
    server uses, this is the page to start with.


    # Deny access from


    Here you may deny access to the server from any number of IP addresses, and you
    can provide a filename of a text error message file to send the client in the
    event they have been denied access based on this rule. This option configures
    the deny directive.


    # Concurrent user limits


    Here you may limit the number of concurrent users from a given user class. To
    configure this option, you must provide a class for which the rule will apply,
    and the maximum number of users to allow to log in simultaneously. Next, you can
    choose times in UUCP L.sys format. This format is pretty simple, you choose the
    days by entering the first two letters with the first capitalized (i.e., Su for
    Sunday, or Mo for Monday), or Any for all days. Then the time is set in military
    format (1000 for 10AM, 2300 for 11PM, etc.). So to limit users during business
    hours, for example, we could enter MoTuWeThFr0800-1800. This option configures
    the limit directive.


    # File and data transfer limits


    This option provides access to the transfer limits features of WU-FTPD. It is
    possible to limit user''s downloads based on files or data or both. You may also
    configure limits for outgoing and incoming transfers, and to which classes the
    limits should apply. This option configures the file-limit and data-limit directives.


    # Deny access to files and Allow access to files even if denied


    If there are files in your directory tree that you do not wish to be retrievable
    by one or more classes of users, you may enter it here. The path may be relative
    to the FTP chroot, or it may be an absolute path (select which using the Relative
    to chroot option). This option correlates to the noretrieve directive. The Allow
    access to files even if denied option allows you to unselect files that would
    ordinarily be made inaccessible by the previous option. This option correlates
    to the allow-retrieve directive.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Anonymous session limit Guest session limit


    Anonymous users and guest users can be limited to the specified time. This option
    correlates to the limit-time directive.


    # Maximum login failures


    This option allows you to define the number of failed login attempts to allow
    before a "too many login failures" message is presented to the user and the FTP
    connection is closed. This option configures the loginfails directive and defaults
    to 5.


    # Can switch groups?


    If this option is turned on, a user may switch to a new group after login. The
    user will then have the privileges of the new group. This configures the private
    directive and defaults to off.


    # Networking


    Here you configure a few of the networking-related options for WU-FTPD.


    # TCP window sizes


    This option configures the window size of TCP packets for the data connection.
    This may be useful if clients are PPP dial-up users, as a smaller TCP window can
    provide faster transfers. Usually this does not need to be modified. This option
    correlates to the tcpwindow directive.


    # Addresses for PASV connections


    Allows control of the address reported in response to a PASV command. This does
    not alter the address that the daemon listens on, only the address it reports
    to clients on a passive connection. This option configures the passive address
    directive.


    # Ports for PASV connections


    Configures the port numbers which may be used for passive data connections. You
    may select port ranges for specific networks. When a control connection matches
    the network specified, a randomly selected port from the range provided will be
    used for the daemon to listen on. This feature allows firewalls that limit open
    ports to be used, while still provided FTP services. This option corresponds to
    the passive ports directive.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Logging


    Here you configure the logging behavior of WU-FTPD (figure 9-4). Logging for this
    daemon is quite simple, and doesn''t present nearly the options of servers like
    Apache or BIND. Nonetheless, it is possible to gather a large amount of useful
    information from your FTP daemon.


    ![](img/d84604054810a13cacfdac212ebee2f7_182_0.png)


    Figure 9-4: Logging


    # Log all commands for


    Selecting one or more types of users here will provide a log of every single command
    executed by a user of the given type. This option configures the log commands
    directive.


    # Log transfers for


    As above, you may select one or more types of users to log for. This option when
    enabled will log every file transfer made by any users of a given type. This option
    configures the log transfers directive.


    # Log transfers to


    This option sets where transfer logs will be stored. If System log, transfers
    will be logged via the syslog daemon to the standard system log (configured by
    your syslog configuration). If XFER log, transfers will be logged to a separate
    transfer log file. This option configures the log syslog directive.


    # Log security violations for


    It is possible to configure your server to log attempts by users of a given type
    to perform actions which are denied by the server. This option configures the
    log security directive.


    # Aliases and Paths


    This page allows you to configure aliases that the FTP daemon will use when a
    client issues a cd command. If an alias is defined, in the CD directory aliases
    section, the Alias name is the directory name that the client can enter, while
    the Alias to directory field defines to what directory the client will switch
    to. So, for example, if the Alias name is bin and the Alias to directory is /home/ftp/pub/usr/local/bin,
    then when the client enters cd bin he will be directed to /home/ftp/pub/usr/local/bin.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Next comes the CD directory search path. With this option, you can configure
    any number of directories that can be in the search path. For example, if a client
    enters cd bin, and there is no bin directory in the current directory, then the
    server will check the directories in the search path. If the directory requested
    exists in one of those directories, the client will be directed there.


    # Anonymous FTP


    WU-FTPD provides a number of capabilities for serving anonymous (i.e., non-authenticated)
    users. And anonymous user generally has very limited capabilities on the server,
    and is often unable to upload files, or modify any content on the server. This
    page provides access to many of the features related to anonymous users on your
    FTP server.


    # Anonymous FTP root directories


    This option allows you to configure the root directory for anonymous users of
    a given class. So setting this to /home/ftp for the all class, will cause the
    server to chroot to the directory specified for any anonymous user. The initial
    directory (somewhere above the chrooted directory) will then be the home directory
    indicated in /etc/passwd for the user ftp. Using this option, it becomes possible
    for local network users to be chrooted to a different directory than users from
    the Internet, for example. This option configures the anonymous-root directive.


    # Guest root directories


    This option, much like the previous option, configures the chroot behavior of
    the server. In this case, however, it configures for guest users who have logged
    in with a valid user name and password. So, it is possible to set the chroot environment
    to /home, causing users to be unable to traverse the directory tree below that
    point. The initial working directory, unless otherwise specified, will be the
    users home directory specified in the /etc/passwd. This option configures the
    guest-root directive.


    # Unix groups for anonymous users


    Here you may configure the default UNIX group whose permissions will apply to
    anonymous users of a given class. This option configures the autogroup directive.


    # Anonymous FTP password check


    The server always performs a user name and password authentication check, before
    permitting access. The convention is to accept a blank user name, and the valid
    email address of the user. Here you can configure how strict the checking of the
    given email address is, and whether to issue a warning, but still allow the login,
    or deny access, if the email address is invalid for some reason. This option configures
    the passwd-check directive.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Anonymous FTP passwords to deny


    If you wish to be more stringent about disallowing generated passwords, such as
    those presented by some web browsers, you may enter those addresses here. This
    will not prevent browser client users from accessing your server, it will merely
    force them to configure their browser to provide a legitimate email address. This
    option configures the deny-email directive.


    # Permissions


    This page allows you to configure the permissions that users of each type will
    have for given classes. You may create any number of permissions rules.


    # Command restrictions


    This section creates a number of different types of rules to regulate the various
    commands that a user may be able to perform on your server. The Command options
    are chmod, delete, overwrite, rename, and umask, which match the directive names.
    You may choose a user type, and a class for each rule.


    # Disallowed upload filenames


    Here you may specify regular expressions to match filenames that may not be uploaded
    by a specified type or list of types and classes. The option also allows you to
    specify the path to a message file to be displayed if an upload is disallowed
    by the rule. By default, the message is located in /etc/pathmsg, and the server
    will revert to this if the path you provide is invalid. This option corresponds
    to the path-filter directive.


    # Miscellaneous Options


    This page provides access to a few of the configuration options that don''t quite
    fit anywhere else. You are unlikely to need to alter any of these settings from
    their defaults.


    # Long listing command, Short listing command, Plain listing


    Defines the command to be used for each of the types of file listing that a user
    may specify. The defaults are usually sane, and should only be modified if necessary.
    These options correlate to the lsLong, lsShort, and lsPlain directives.


    # Shutdown notification file


    Here you configure the path to the message that the server will display prior
    to shutting down. This option correlates to the shutdown directive and usually
    defaults to /etc/shutmsg.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Service process nice level


    This sets the niceness level for the FTP daemon process. This may be set per class
    of user, or for all classes. This option correlates to the nice directive.


    # Default umask for uploaded files


    This option defines the umask that is applied to uploaded files by users of the
    given class. This option correlates to the defumask directive.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 10


    # POSTFIX


    ![](img/d84604054810a13cacfdac212ebee2f7_186_0.png)


    Postfix is an efficient and feature-rich mail server that was designed by Wietse
    Venema at the IBM T.J. Watson Research Center (Figure 10-1). It was intended to
    be a replacement for the popular Sendmail. While it still represents only a small
    percentage of mail server installations worldwide, its popularity is growing rapidly,
    due to its simple configuration, secure implementation, and high performance architecture.


    Also, because Postfix is designed to behave outwardly like Sendmail, it is a mostly
    drop-in replacement for the older, larger, and slower mail server. It does lack
    some of the obscure features of Sendmail, but the features it lacks are rarely
    used by the vast majority of users, so they are not often missed.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '![](img/d84604054810a13cacfdac212ebee2f7_187_0.png)


    Figure 10-1: Postfix


    The Postfix project, originally named VMailer (fortunately for everyone, the name
    was changed before release due to legal entanglements of the VMailer name), is
    designed as a group of related but separate executable components, providing security
    through segmentation. Smaller parts are easier to debug, as well. The Internet
    home of Postfix is www.postfix.org [http://www.postfix.org]. Postfix is an ideal
    mail server choice for new mail administrators, and even experienced Sendmail
    administrators might find its simplicity appealing. Because it provides a quite
    compatible Sendmail-ish exterior, and provides programs of the same names (such
    as sendmail for sending mail, mailq for managing the queue, etc.), and can utilize
    the same type of aliases and forwarding files that Sendmail uses, it is possible
    to replace Sendmail without reconfiguring existing mail-related tools, or rewriting
    local scripts. After such a switch, local users may not even notice the difference.


    > NOTE The previous statements should not be viewed as an endorsement of Postfix
    as being a better mail transport agent than Sendmail. The two projects have different
    emphasis, and have had very different development models. Sendmail has been in
    use all over the world for over 20 years in one form or another, and thus has
    an extremely large head start on Postfix with regard to maturity, available documentation,
    number of experienced administrators, and support tools. Postfix is only a few
    years old and has much more limited supporting documentation and tools to enhance
    it. The decision for which mail transfer agent is appropriate for your network
    will be dictated by the requirements and the availability of local expertise.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# General Options


    The **General Options** page configures a number of options regarding the general
    behavior of Postfix. Specifically, most of the configuration options that impact
    all users and all messages are configured here. Postfix, keeping with its philosophy
    of simplicity, usually requires only a few configuration file changes to get a
    mail server running efficiently and securely.


    The **General Options** page is divided into two parts. The upper section is labeled
    **Most Useful General Options** and the lower section **Other General Options**.
    In many standard installations, it may be possible to start up a Postfix installation
    with just configuration of one or more of the three directives in the upper section.
    Unless otherwise stated, all of the options on this page correspond to directives
    in the `main.cf` file in the Postfix configuration directory.


    # Most Useful General Options


    The three options in this section are, in some installations, the only options
    that need to be altered to get Postfix running for both sending and receiving
    email (Figure 10-2).


    ![](img/d84604054810a13cacfdac212ebee2f7_188_0.png)


    Figure 10-2: Most Useful General Options


    # What domain to use in outbound mail


    Here you may specify the domain or host name to use to identify the source on
    outgoing mail. Postfix defaults to using the host name of the server, but you
    most likely will want it to identify mail as coming from your domain name instead.
    If your mail server will be accepting mail for a large number of users under a
    single domain name, you will most likely configure domain name here, and create
    a domain-wide alias database to map user names to their respective local mail
    servers. This option correlates to the `myorigin` Postfix directive.


    # What domain to receive mail for


    This option accepts a list of domains and addresses to receive mail as its final
    destination. In other words, when mail reaches the server destined for addresses
    in this field, it will deliver the mail to a local user, rather than forward it
    to another mail server. By default, this is all configured addresses on the machine
    as well as `localhost` within the local domain. You may specify any number of
    domains or host names separated by commas, or you may provide a full path to a
    file containing similar entries. The variables `$myhostname` and `$mydomain` may
    be used to represent those concepts to Postfix automatically. The ability of Postfix
    to use such variables throughout its configuration files makes it easier to maintain
    a number of Postfix servers with very similar configurations. This option correlates
    to the `mydestination` directive.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# What trouble to report to the postmaster


    Postfix provides the ability to select what types of error messages will be mailed
    to the designated postmaster of the mail server. Assuming you have setup a postmaster
    alias that directs mail to a real person, Postfix will send reports of all the
    types of trouble designated here. The available classes are:


    +   - **bounce** When this option is selected, whenever a message is undeliverable,
    a bounce message (called a *single bounce message* will be sent to the sender
    of the message and the local postmaster. For the sake of privacy only the headers
    will be sent in the message. If the first bounce to the sender is returned as
    undeliverable, a *double bounce message* will be sent to the postmaster with the
    entire contents of the first single bounce message.

    +   - **2bounce** Causes double bounce messages to be sent to the postmaster.

    +   - **delay** If the delivery of a message is delayed, the postmaster will receive
    a notice, along with the headers of the delayed message.

    +   - **policy** Notifies the postmaster of messages that were rejected due to
    a unsolicited commercial email policy restriction. The complete transcript of
    the SMTP session is sent.

    +   - **protocol** Notifies the postmaster of protocol errors, or client requests
    that contained unimplemented commands. The complete transcript of the SMTP session
    is included in the message.

    +   - **resource** Informs the postmaster of undelivered mail due to resource
    problems, such as a queue file write error.

    +   - **software** Notifies the postmaster of mail not delivered due to software
    failures.


    This option correlates to the notify_classes directive, and defaults to reporting
    only problems that usually indicate a misconfiguration or serious problem (specifically
    resource and software). In some high load environments, altering this to include
    bounce notifications could lead to a large number of notices.


    # Other General Options


    The lower section of this page is devoted to global options which are less likely
    to need to be altered (Figure 10-3). In many installations these options will
    remain at their defaults.


    # Send outgoing mail via


    This option configures whether outgoing mail should be delivered directly to the
    recipients mail server, or if a parent mail gateway should be used as an intermediary.
    If the server is behind a firewall, behind a network address translating router/gateway,
    or similar, it may be necessary to use an intermediary server to achieve reliable
    service. Many mail servers on the Internet will not accept mail from a server
    that does not have a working DNS entry and a routable IP address, in order to
    help prevent spam from forged addresses. Also, local network use policy may require
    the use of an intermediary for logging, virus scanning, or other'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'purposes that require aggregation of outgoing mail traffic onto a central server.
    This option corresponds to the relayhost directive and defaults to sending mail
    directly.


    ![](img/d84604054810a13cacfdac212ebee2f7_190_0.png)


    Figure 10-3: Other General Options


    # Address that receives bcc of each message


    With this option, an optional email address may be specified that will receive
    a copy of every message that enters the Postfix system, excluding locally generated
    bounce messages. This can represent a breach of privacy in many circumstances,
    and may be illegal in some countries. It is advisable to be especially cautious
    about utilizing this option. It can be useful in some environments, however, where
    central archival of email is valuable for legal or technical reasons. This option
    correlates to the always_bcc directive and defaults to none.


    # Timeout on handling requests


    This option determines how long a Postfix daemon will wait on a request to complete
    before it assumes the daemon has locked up, at which time the daemon will be killed.
    This option corresponds to the daemon_timeout and defaults to 18000 seconds.


    # Default database type


    This option determines the type of database to use in the postalias and postmap
    commands. This option corresponds to the default_database_type directive and the
    default depends on the OS and installed system libraries at the time of building
    Postfix. Ordinarily on UNIX systems this will be hash or dbm.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Default message delivery transport


    The term delivery transport refers to the protocol, or language, used to deliver
    the message from one mail server to another. The transport on modern systems is
    nearly always smtp, and this is the default in Postfix, but there are still a
    few legacy uucp systems in use. This option is merely the default choice, when
    no transport is explicitly selected for the destination in the optional transport
    table. This option corresponds to the default_transport directive.


    # Sender address for bounce mail


    In the event a message double-bounces, or first bounces from the recipient and
    then bounces from the sender when the first bounce notice is sent, the message
    will be sent to this address. All messages to this address will be silently discarded.
    In this way bounce-loops can be avoided. This option correlates to the double_bounce_sender
    and defaults to double-bounce. The name may be any arbitrary name, but must be
    unique.


    # Number of subdir levels below the queue dir


    This option configures the number of subdirectory levels below the configured
    queue directories will be used by Postfix for mail storage. Because of the design
    of the traditional UNIX filesystem, which includes UFS used by all modern BSD
    systems and the Linux ext2 and ext3 filesystems, performance becomes measurably
    slower when an extremely large number of files are stored in a single directory.
    Thus, programs that generate a large number of files often provide the ability
    to split files out to a number of subdirectories to keep lookups fast. This option
    correlates to the hash_queue_depth directive and defaults to 2, which is suitable
    for most moderate and even relatively large installations. Because the number
    of directories in use increases the search time for object seeks, using a too
    high value here can be harmful to performance.


    # Name of queue dirs split across subdirs


    Postfix uses a number of queues to organize messages with varying states and destinations.
    Each of these queues can be configured to use hashed subdirectories or not. If
    a queue is selected here, it will be stored in a hashed subdirectory. In some
    cases, a queue must not be listed here as performance will be severely impacted,
    specifically the world-writable mail drop directory. The defer log file directory,
    on the other hand must be stored in hashed directories or performance will suffer.
    This option corresponds to the hash_queue_names directive and defaults to incoming,
    active, deferred, bounce, defer, flush and it is rarely necessary or beneficial
    to alter this configuration.


    # Max number of Received: headers


    A message that contains more Received: headers than this will bounce. An extremely
    large number of this header may indicate a mail loop or a misconfigured mail server
    somewhere in the path of this message. This option correlates to the hopcount_limit
    directive and defaults to 50. This value rarely needs to be altered from its default.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Time in hours before sending a warning for no delivery


    If a message cannot be delivered immediately, it will be queued for later delivery.
    If after this number of hours, the message still cannot be delivered, a warning
    will be sent to the sender notifying them that the server has been unable to send
    the message for a specified time. This correlates to the delay_warning_time directive
    and defaults to not sending a warning.


    # Network interfaces for receiving mail


    This option configures the network addresses on which Postfix will accept mail
    deliveries. By default Postfix will accept mail on every active interface. Here,
    Postfix will accept the variables discussed earlier. This option configures the
    inet_interfaces directive.


    # Idle time after internal IPC client disconnects


    This option sets the time in seconds after which an internal IPC client disconnects.
    This allows servers to terminate voluntarily. This feature is used by the address
    resolution and rewriting clients. This option correlates to the idle_time directive
    and defaults to 100s. This option should probably never need to be altered under
    normal circumstances.


    # Timeout for I/O on internal comm channels


    This option determines the amount of time in seconds the server will wait for
    I/O on internal communication channels before breaking. If the timeout is exceeded,
    the server aborts with a fatal error. This directive corresponds to the ipc_timeout
    directive and defaults to 3600 seconds, or 60 minutes.


    # Mail system name


    This option identifies the mail server system in use to connecting users. It will
    be used in the smtpd_banner which is sent in Received: headers, the SMTP greeting
    banner, and in bounced mail. Some security experts, who promote security through
    obscurity, suggest anonymizing all server software to prevent potential crackers
    from being able to identify the software in use on the server. It is probably
    not the best use of an administrators time or effort in most environments, however,
    and many other security tactics are more effective, without negatively impacting
    the ability to track software problems. This option correlates to the mail_name
    directive and defaults to Postfix.


    # Mail owner


    This option specifies the owner of the Postfix mail queue, and most of the Postfix
    daemon processes. This user should be unique on the system, and share no groups
    with other accounts or own any other files or processes on the system. After binding
    to the SMTP port (25), postfix can then drop root privileges and become the user
    specified here for all new daemon processes. Because of this, if the Postfix daemon
    is ever compromised the exploiter will only have access to mail and a few other
    files. Obviously it is good to avoid this as well, but it is'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'certainly better than a root exploit which would allow the exploiter to access
    and alter anything on the system. This option correlates to the mail_owner directive
    and defaults to postfix.


    # Official mail system version


    This parameter configures the version number that will be reported by Postfix
    in the SMTP greeting banner, among other things. This correlates to the mail_version
    directive and defaults to the version of Postfix that is installed. Once again,
    security by obscurity promoters may encourage obfuscation of this value.


    # Time to wait for next service request


    A Postfix daemon process will exit after the time specified here, if it does not
    receive a new request for service during that time. This option corresponds to
    the max_idle directive and defaults to 100s. This directive does not impact the
    queue manager daemon process.


    # Max service requests handled before exiting


    This option configures the maximum number of requests that a single Postfix daemon
    process will answer before exiting. This option configures the max_use directive
    and defaults to 100.


    # Internet hostname of this mail system


    This option specifies the Internet host name of the mail server. By default this
    value will be set to the fully qualified host name of the server, as determined
    by a call to gethostname(). This option sets the $myhostname variable which is
    used in the defaults to many other options. This option correlates to the myhostname
    directive.


    # Local Internet domain name


    This option corresponds to the mydomain directive and defaults to the contents
    of the $myhostname variable minus the first component. This option defines the
    $mydomain variable and is used in a number of other configuration option defaults.


    # Local networks


    Postfix provides a flexible set of options to help prevent UCE, or other unauthorized
    uses of the mail server. This option defines what networks will be considered
    to be local by Postfix. The value is used to determine whether a client is a local
    client or a remote client. Policies can be more relaxed for local clients. This
    option configures the mynetworks directive and defaults to a list of all networks
    attached to the server. For example, if the server has an IP of 192.168.1.48,
    and a netmask of 255.255.255.0, all of the 192.168.1.0 network will be considered
    local. If you would like stricter control, or the ability to treat other network
    blocks as local clients, you can specify them here in the form of network/mask
    pairs (i.e., 172.16.0.0/16). Network/mask pairs may be inserted from a separate
    file, if preferred, by specifying the absolute path to the file here.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Send postmaster notice on bounce to...


    This option configures the user name or email address to whom bounce notices will
    be sent. This option correlates to the bounce_notice_recipient and is set to postmaster
    by default.


    # Send postmaster notice on 2bounce to...


    This option configures the user name or email address to whom second bounce messages
    will be sent. This allows an administrator to watch for second bounces warnings
    more closely than first bounce messages, because first bounces are far more common
    and less likely to indicate serious problems. The option configures the 2bounce_notice_recipient
    directive and defaults to postmaster.


    # Send postmaster notice on delay to...


    This option configures where delay warnings will be sent. This option correlates
    to the delay_notice_recipient directive and defaults to postmaster.


    # Send postmaster notice on error to...


    Specifies where error warnings will be sent. This option correlates to the error_notice_recipient
    directive and defaults to postmaster.


    # Mail queue directory


    This specifies the directory where Postfix will store queued mail. This will also
    be the root directory for Postfix daemons that run in a chroot environment. The
    queue is where messages that are awaiting delivery are stored, thus enough space
    to accommodate your user mail load should be provided in this directory. This
    option correlates to the queue_directory directive and usually defaults to a sensible
    location for your OS. Many Linux systems will have the mail queue in /var/spool/mail
    or /var/spool/postfix.


    # Lock file dir, relative to queue dir


    This option configures the location of the Postfix lock directory. It should be
    specified relative to the queue directory, and generally will simply be a subdirectory
    of the queue directory. This option configures the process_id_directory directive
    and defaults to pid.


    # Separator between user names and address extensions


    This option specifies the separator character between user names and address extensions.
    This option correlates to the recipient_delimiter directive and defaults to using
    no delimiter. This option impacts Canonical Mapping, Relocated Mapping, and Virtual
    Domains.


    # Postfix support programs and daemons dir


    This option specifies the directory where Postfix will look for its various support
    programs and daemons. The directory should be owned by root. This option correlates
    to the program_directory directive and defaults vary depending on installation
    method and OS variant. On many Linux systems this will be /usr/libexec/postfix.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Relocated mapping lookup tables


    Postfix can provide a relocation notice in response to messages sent to users
    who no longer receive mail from this server. If enabled, this option specifies
    the location of the file containing a table of contact information for users who
    no longer exist on this system. By default this feature is disabled. This option
    correlates to the relocated_maps directive. If enabled a reasonable choice for
    this option might be /etc/postfix/relocated.


    # Disable kernel file lock on mailboxes


    On Sun workstations, kernel file locks can cause problems, because the mailtool
    program holds an exclusive lock whenever its window is open. Users of other OS
    variants, or Sun systems where no Sun mail software is in use, may ignore this
    option. This option correlates to the sun_mailtool_compatibility directive and
    defaults to No.


    # Max time to send a trigger to a daemon


    This option specifies the maximum amount of time allowed to send a trigger to
    a Postfix daemon. This limit helps prevent programs from getting hung when the
    mail system is under extremely heavy load. This option correlates to the opts_trigger_timeout
    directive and defaults to 10s.


    # Address Rewriting and Masquerading


    Postfix offers a relatively easy to use, and flexible, address rewriting system,
    allowing it to act as a mail gateway for a large network, or as a gateway between
    legacy mail systems and the Internet at large (Figure 10-4).


    ![](img/d84604054810a13cacfdac212ebee2f7_195_0.png)


    Figure 10-4: Address Rewriting and Masquerading


    > NOTE The options on this page are also discussed on the Postfix Configuration
    - Address Manipulation [http://www.postfix.org/rewrite.html] page at the Postfix
    homepage. It is worth reading if advanced address rewriting is required in your
    mail system.


    # Rewrite "user%domain" to "user@domain"


    This option is useful for some legacy systems that used strange address trickery
    such as, user % domain@otherdomain. It is not generally useful in modern environments,
    but is not harmful so usually defaults to Yes. This option correlates to the allow_percent_hack
    directive.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Rewrite “user” to “user@$mydomain”


    This option configures how Postfix will handle an address that has no domain name
    in the destination. If enabled, it will append the value of $mydomain to the address.
    This option correlates to the append_at_myorigin directive and defaults to Yes.
    Because most Postfix components expect addresses to be of the form user@domain
    it is probably never appropriate to disable this feature.


    # Rewrite “user@host” to “user@host.$mydomain”


    This option configures whether simple host addresses will have the value of $mydomain
    appended to them. This option correlates to the append_dot_mydomain directive
    and defaults to Yes. Some administrators may find that this explicit rewrite has
    unexpected consequences, but it is very rarely a problem.


    # Rewrite “site!user” to “user@site”


    Legacy UUCP networks use a different addressing format than modern SMTP systems.
    This option enables Postfix to convert the old-style address to a modern address
    for delivery via the standard SMTP protocol. This option configures the swap_bangpath
    directive and defaults to Yes.


    # Send mail with empty recipient to...


    The specifies the destination of mail that is undeliverable. Typically, this will
    be bounce notifications and other error messages. This option correlates to the
    empty_address_recipient directive and defaults to MAILER-DAEMON, which by default
    is simply an alias to postmaster.


    # Address masquerading


    Address masquerading is a method whereby hosts behind the gateway mail server
    may be hidden, and all mail will appear to have originated from the gateway server.
    If enabled, the host and/or subdomain portion of an address will be stripped off
    and only the domain specified here will be included in the address. For example,
    if $mydomain is specified here, an outgoing mail from joe@joesmachine.swelltech.com
    would become simply joe@swelltech.com, assuming the $mydomain variable contains
    swelltech.com. This option correlates to the masquerade_domains directive and
    it is disabled by default.


    # Masquerade exceptions


    It is possible to skip over the masquerade rules define above for some user names.
    The names to be excepted from those rules can be entered here. This option corresponds
    to the masquerade_exceptions directive and by default no exceptions are made.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Mail Aliases


    Mail aliases provide a means to redirect mail to local recipients. Specifically,
    it allows mail destined for a number of different addresses to be delivered to
    a single mailbox. A common use for this is to direct mail for users like postmaster
    to a real person. This page is divided into two sections. The upper section labeled
    Aliases Options contains the location and format of the alias files that Postfix
    should use to construct its alias databases and specifies the type of database
    to use. The lower section provides a list of all configured aliases on the system,
    and what the alias maps to.


    # Aliases Options


    The following options specify the location and types of alias databases that Postfix
    will use:


    # Alias databases used by the local delivery agent


    This option sets the filenames that Postfix will use for local delivery alias
    translation. The filename will have a suffix appended to it based on the file
    type. This option correlates to the alias_maps directive and the default is system
    dependent. Some common defaults include hash:/etc/aliases or hash:/etc/postfix/aliases.
    The first part of the entry, preceding the colon, is the type of database to use,
    which will be one of hash for systems with a modern Berkeley DB implementation,
    dbm for older style systems that only have dbm available, or nis for systems that
    run NIS. The after-colon portion of the entry is the path to the filename from
    which the database name is derived. The databases will be built from the contents
    of the flat files by Postfix on startup, or when running the newaliases command.


    # Alias databases built by Postfix


    This option, closely related to the above, specifies the alias database file(s)
    that are built when the newaliases or sendmail -bi commands are run. These commands
    generate the alias database from the flat file in the above option, in order to
    speed alias lookups performed by Postfix. Because there may be thousands of aliases
    on a large mail server, importing them into a database is necessary to maintain
    efficiency. This option correlates to the alias_database directive. Defaults are
    system dependent, but will commonly be the same as the above option, with the
    appropriate database file suffix appended.


    # Aliases


    This section of the page provides a list of all configured aliases. To edit an
    alias, click on the name of the alias. To create an alias, click on the Create
    a new alias button and fill in the Alias Name, and Alias to... fields. Whenever
    the aliases files have been modified, it is necessary to recreate the aliases
    database files as well in order for the changes to take effect. When using Webmin
    this step is performed automatically, and no additional steps are required.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '> NOTE If adding aliases from the command line, it is possible to regenerate
    the aliases database using the command postalias. The man page for this command
    is a useful resource for understanding how aliases databases are handled in Postfix.


    # Canonical Mapping


    Canonical mapping in Postfix is used for modifying mail in the incoming queue,
    and it alters both the message headers and the message envelope information for
    local or remote mail. This mapping can be useful to replace login names with Firstname.Lastname
    style addresses, or to clean up odd addresses produced by legacy mail systems.


    # Canonical Mapping Tables


    If you use any canonical mapping tables, they must be specified in the first section
    of the Canonical Mapping module. After defining them, you can edit them from the
    second section of the module.


    # Address mapping lookup tables


    This option specifies the location of the optional canonical address mapping table
    file. This mapping is applied to both sender and recipient addresses, in both
    envelopes and headers. This option configures the canonical_maps directive and
    is disabled by default. Much like the aliases files discussed in the last section,
    canonical mapping files are specified by a database type and a filename. The accepted
    database types depend on your operating system, and installed components. Usually
    hash and dbm are used as the database type. A common choice for this value, then,
    might be hash:/etc/postfix/canonical.


    # Tables for RECIPIENT addresses


    This parameter configures address mapping only on recipient addresses, and not
    sender addresses. Mapping is performed on both envelopes and headers. These lookups
    are performed before the above configured Address mapping lookup tables. This
    option correlates to the recipient_canonical_maps directive and is disabled by
    default.


    # Tables for SENDER addresses


    Similar to the previous option, this configures mapping for sender addresses only,
    and not recipient addresses. Both envelope and header information is modified.
    This option correlates to the sender_canonical_maps directive and by default is
    disabled.


    # Editing Canonical Mappings


    Once a filename is selected for any of the canonical mapping tables, it may be
    edited by clicking the appropriate Edit buttons. A new page will open, listing
    any existing mappings and allowing creation of new mappings. The format of mappings
    in all files is the same.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Canonical mappings may seem, on the surface, to be similar to aliases or virtual
    domains. However, they are quite distinct and are useful for other purposes. While
    aliases merely make a decision about which user will receive an email, and virtual
    domains only impact the envelope address, the canonical mapping alters both the
    envelope address and the SMTP header address. This change can be used to make
    mail appear to come from a different user or domain, or direct mail to a different
    user or domain by changing the address on the message.


    For example, if I have a number of local subdomains, but would like all mail to
    appear to originate from a single domain, it is possible to create a canonical
    mapping to make the translations. In the Edit a Map page, the Name will be a subdomain
    that is to be mapped to the domain, such as @lab.swellitech.com. The Maps to...
    value will simply be the domain I''d like this subdomain converted to, @swellitech.com.
    After saving the mapping and applying changes, all outgoing mail from lab.swellitech.com
    will appear to originate from swellitech.com.


    # Virtual Domains


    Virtual domains functionality in Postfix provides a means to redirect messages
    to different locations by altering the message envelope address. The header address
    is not altered by a virtual domain mapping. While some functionality of virtual
    domains overlaps with features available in aliases, virtual domains can be used
    for local or non-local addresses, while aliases can only be used for local address.


    # Domain mapping lookup tables


    Much like aliases tables and canonical mapping tables discussed in the previous
    sections, this is simply the path to a file containing the mapping tables for
    virtual domains. This is usually something along the lines of hash:/etc/postfix/virtual,
    and must be converted to a database format for use in Postfix. Webmin will perform
    the database generation step for you.


    # Transport Mapping


    The term transport refers to the mechanism used to deliver a piece of email. Specifically,
    SMTP and UUCP are mail transports that are supported by Postfix. Transport mapping
    can be used for a number of purposes, including SMTP to UUCP gatewaying, operating
    Postfix on a firewall with forwarding to an internal mail server, and so on.


    # Transport mapping lookup tables


    This option configures the path to a file containing one or more transport mappings.
    These tables are much like the mapping tables discussed already, and are converted
    to a database and used by Postfix in the same way. This option correlates to the
    transport_maps directive. This feature is disabled by default. A common value
    for this option is /etc/postfix/transport.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'To create a new mapping, first define the mapping file. Then click Add a mapping.
    If your goal is to redirect mail to an protected internal host from Postfix running
    on a firewall, for example, you could enter the outside domain name into the Name
    field, swelltech.com and then enter into the Maps to field the address of the
    internal machine, smtp:privatehost.swelltech.com. To further improve upon this,
    local delivery on this machine could be disabled, and increased controls over
    where and to whom mail should be accepted. There are more examples of such a configuration
    in the tutorial section of this chapter.


    # Relocated Mapping


    Using this option it is possible to notify senders if a local user has moved to
    another address. For example, if a user leaves an organization but still receives
    occasional mail at her local address, it may be convenient to notify anyone sending
    mail to the user of the move and new contact information for that user. Usage
    is just like the previous types of mappings and so won’t be documented specifically
    here, though an example of a relocated mapping will be given to display the types
    of information that can be provided by this feature.


    As an example, let’s say I move from my current company to the far more relaxed
    atmosphere of the Oval Office. To make sure all of my friends and clients can
    keep in touch with me, I could provide a relocated mapping with a Name of joe@swelltech.com
    with a Maps to of president@whitehouse.gov. While this won’t redirect mail to
    me at my new home, it will notify the people trying to contact me that I’ve changed
    email addresses. Hopefully they will all update their address books and resend
    their mail to my new address.


    # Local delivery


    Local delivery is what Postfix does when it reaches the end of all of its list
    of mappings and access controls, and still finds that the message is allowed and
    destined for a user on the local machine (i.e., a mapping could potentially send
    the message elsewhere for final delivery, so all mappings as well as various access
    checks are performed before reaching this stage). This page configures a number
    of options relating to how Postfix handles the delivery of mail for local users
    (Figure 10-5).'
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/d84604054810a13cacfdac212ebee2f7_201_0.png)


    Figure 10-5: Local Delivery


    # Name of the transport for local deliveries


    This configures the name of the transport that will be used for delivery to destination
    that match the $mydestination or $inet_interfaces variables. This can be a simple
    mailbox drop handled by the Postfix local delivery agent, or any appropriate delivery
    command. This option correlates to the local_transport directive and defaults
    to the defined transport type named local.


    # Shell to use for delivery to external command


    If a command shell is required to communicate properly with your chosen local
    delivery transport, this option selects the shell that will be used. By default
    no shell is used, and the transport command will be executed directly. However,
    if the command contains shell meta-characters or shell built-in commands they
    will be passed to /bin/sh or whatever shell you configure here. A popular choice
    for this is smsh, or Sendmail''s Restricted Shell, which is included in recent
    Sendmail distributions. smsh allows for more precise control over what commands
    users can execute from their .forward files. This option corresponds to the local_command_shell
    and defaults to /bin/sh.


    # Search list for forward


    This is a comma-separated list of possible locations for user forward files. Postfix
    will try each entry in the list until a forward file is found or until all have
    been checked and no match is found. The forward file allows users to configure
    delivery options for themselves, including delivery-time processing by a program
    like procmail, as well as forwarding of messages to a different server. A number
    of variable expansions are performed on the entries. The expansions are currently:'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Forward Search Path Variable Expansions


    Entries in forward files can make use of the following variables:


    | $user | The username of the recipient. |

    | $shell | The shell of the recipient. |

    | $home | Recipient''s home directory. |

    | $recipient | The full recipient address. |

    | $extensions | Recipient address extensions. This is a separate part of the email
    address, separated by the Separator between user names and address extensions
    defined on the General Options page. |

    | $domain | The recipient''s domain name. |

    | $local | The entire local part of the recipient address. |

    | $recipient_delimiter | The separation delimiter for the recipient. |


    # Valid mail delivery to external commands


    This parameter restricts mail delivery to only those commands specified here.
    The default is to disallow delivery to commands specified in :include: files and
    allow execution of commands in aliases and forward files. This option correlates
    to the allow_mail_to_command directive.


    # Valid mail delivery to external files


    This option restricts mail delivery to external files. The default is to disallow
    delivery to files specified in :include: but to allow delivery to files specified
    in aliases and forward files. This option correlates to the allow_mail_to_files
    directive.


    # Default rights of the local delivery agent


    This option configures the privileges that the delivery agent will have for delivery
    to a file or a command. This option should never be a privileged user or the Postfix
    owner. This option corresponds to the default_privs directive and defaults to
    nobody.


    # Pathname of user mailbox file


    When delivering mail locally, Postfix will drop mail in the directory configured
    here or in its default mail spool directory. If you wish to use the maildir format
    for mail storage, this value can be appended with a trailing slash. For example,
    to store mail in the user''s home directory in the Maildir subdirectory, the value
    would be $Maildir/. This option correlates to the home_mailbox directive and usually
    defaults to some location under /var/spool/mail or /var/spool/postfix.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Destination address for unknown recipients


    If a message is received for a recipient that does not exist, the message is normally
    bounced. However, it is possible to instead have the message delivered to an alternate
    address. This option corresponds to the luser_relay directive. Variable expansions
    matching those discussed for the Search list for forward are also valid for this
    directive.


    # Spool directory


    This option specifies the directory where UNIX-style mailboxes are stored. Defaults
    vary depending on OS variant and version, but a common choice is /var/spool/mail.
    This option correlates to the mail_spool_directory option.


    # External command to use instead of mailbox delivery


    This option defines a command to use for delivery instead of delivering straight
    to the user’s mailbox. The command will be run as the recipient of the message
    with appropriate HOME, SHELL, and LOGNAME environment variables set. This option
    is commonly used to set up system-wide usage of procmail. Beware that if you use
    a command to deliver mail to all users, you must configure an alias for root,
    as the command will be executed with the permissions of the $default_user. This
    option correlates to the mailbox_command directive and is disabled by default.


    # Optional actual transport to use


    This option configures the message transport to use for all local users, whether
    they are in the UNIX passwd database or not. If provided, the value will override
    all other forms of local delivery, including Destination address for unknown recipients.
    This option corresponds to the mailbox_transport directive and is disabled by
    default. This option may be useful in some environments, for example, to delegate
    all delivery to an agent like the cyrus IMAPD.


    # Optional transport for unknown recipients


    If a user cannot be found in the UNIX passwd database, and no alias matches the
    name, the message will ordinarily be bounced or handled via the Destination address
    for unknown recipients option. However, if you would like unknown users to be
    handled by a separate transport method, this option overrides the Destination
    address for unknown recipients option above. This option correlates to the fallback_transport
    directive and is disabled by default.


    # Max number of parallel deliveries to the same local recipient


    This option limits the number of simultaneous deliveries to a single local recipient.
    If .forward files are allowed for users, a user may run a time-consuming command
    or shell script, leading to overload caused by several such processes being started
    up at once. This option correlates to the local_destination_concurrency_limit
    directive, and the default is 2. A low value is recommended for this option, unless
    it is certain that no complex .forward files will be in use.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Max number of recipients per local message delivery


    This option configures the maximum number of recipients per local message delivery.
    This option correlates to the local_destination_recipient_limit and is set to
    the value of Max number of recipients per message delivery by default.


    # Prepend a Delivered-To: when...


    This parameter determines when Postfix should insert a Delivered-to: message header.
    By default Postfix inserts this header when forwarding mail and when delivering
    to a file. The defaults are recommended, and it is generally preferable not to
    disable insertion into forwarded mail. This option corresponds to the prepend_delivered_header
    directive.


    # General Resource Control


    This page provides access to the various memory and process limits for the Postfix
    processes (Figure 10-6). It is rarely necessary to alter the values on this page,
    except for highly loaded servers or very low resource machines.


    # Max size of bounced message


    This option limits the amount of the original message content in bytes that will
    be sent in a bounce notification. This option correlates to bounce_size_limit
    and defaults to 50000.


    ![](img/d84604054810a13cacfdac212ebee2f7_204_0.png)


    Figure 10-6: General resource control


    # Max time for delivery to external commands


    When delivering mail to an external command (rather than via direct mailbox delivery),
    Postfix will wait this amount of time for the delivery to complete. If this value
    is to be set to a high limit (3600s or more) the value of Timeout for I/O on internal
    comm channels in General Options must also be increased. This option correlates
    to the command_time_limit directive and defaults to 1000s.


    # Max number of Postfix child processes


    This option limits the number of child processes that Postfix will spawn. On high
    load servers the default may be too low and may need to be raised to as much as
    500 or more. More likely, for most environments, 50 is more than adequate and
    may even be overkill. For example, on dial-up or consumer broadband serving'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'one to ten users, a more appropriate limit might be 10. If in doubt, leave
    it at its default unless it causes problems. This option correlates to the `default_process_limit`
    directive and defaults to 50.


    # Max number of addresses remembered by the duplicate filters


    While expanding aliases and .forward files Postfix will remember addresses that
    are being delivered to and attempt to prevent duplicate deliveries to the same
    address. This option limits the number of recipient addresses that will be remembered.
    It corresponds to the `duplicate_filter_limit` directive and defaults to 1000.
    There is probably no compelling reason to increase this value.


    # Max attempts to acquire file lock


    This option limits the number of attempts Postfix will make when attempting to
    obtain an exclusive lock on a mailbox or other file requiring exclusive access.
    It corresponds to the `deliver_lock_attempts` directive and defaults to 20.


    # Time in seconds between file lock attempts


    Postfix will wait a specified time between attempts to lock a given file, after
    a failed lock attempt. This option configures the `deliver_lock_delay` directive
    and defaults to 15.


    # Max attempts to fork a process


    If Postfix attempts to fork a new process and fails, due to errors or a lack of
    available resources, it will try again a specified number of times. This option
    correlates to the `fork_attempts` directive and defaults to 5.


    # Time in seconds between fork attempts


    Postfix will try to spawn a new process a specified time after a failed attempt.
    This option correlates to the `fork_delay` directive and defaults to 15.


    # Max memory used for processing headers


    This option limits the amount of memory in bytes that Postfix will use to process
    message headers. If a message header is too large to fit into the memory specified,
    the headers that do not fit into memory will be treated as part of the message
    body. This option correlates to the `header_size_limit` directive and defaults
    to 102400.


    # Max memory used for handling input lines


    This option limits the amount of memory in bytes that Postfix will use to handle
    input lines. And input line is any line read from an `include:` or `.forward`
    file. In order to prevent the mail server from using excessive amounts of memory,
    it will break up these files into chunks of this length. This option correlates
    to the `line_length_limit` directive and defaults to 2048.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Max size of a message


    This option limits the size in bytes of a message that will be delivered, including
    the message envelope information. This limit should be set high enough to support
    any email messages your users will need to be able to send or receive. This option
    correlates to the message_size_limit directive and defaults to 10240000.


    # Max number of messages in the active queue


    This option limits the number of messages that can exist in the message queue
    at any given time. It correlates to the qmgr_message_active_limit directive and
    defaults to 10000.


    # Max number of in-memory recipients


    This parameter limits the number of in-memory recipient data structures. This
    memory contains the short-term dead list, which indicates a destination was unavailable
    when last contacted, among other things. This option correlates to the qmgr_message_recipient_limit
    directive and defaults to 1000.


    # Min free space in the queue file system


    Postfix will refuse mail if the filesystem on which the queue is located has less
    available space in bytes than the value set in this option. This option correlates
    to the queue_minfree directive and defaults to 0.


    # Max time after which stale lock is released


    This option configures how old an external lock file may be before it is forcibly
    removed. This option correlates to the stale_lock_time and defaults to 500s.


    # Time in seconds between attempts to contact a broken MDT


    This option configures the time in seconds between the queue manager attempts
    to contact an unresponsive mail delivery transport. This option correlates to
    the transport_retry_time and defaults to 60s.


    # SMTP Server Options


