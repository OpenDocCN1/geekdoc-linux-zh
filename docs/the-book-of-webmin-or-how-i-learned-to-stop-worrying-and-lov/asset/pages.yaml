    Next come the regular expression-based header_checks and body_checks. These options,
    if enabled, provide a means to test the actual contents of the headers and the
    body of the email, respectively. Both operate in the same way, though they should
    be used somewhat differently. Header checks can be used to prevent well-known
    spamming domains from sending you email or for stopping some well-known bulk-mailer
