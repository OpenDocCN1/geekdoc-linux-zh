    body is even sent. Body checks, though they use the same regular expressions and
    file format as header checks, should be used more sparingly, as the mail must
    be accepted before it can be checked. Thus bandwidth is wasted on receipt of the
    mail, and worse, the server will be occupied for a potentially long while with
    processing the entire contents of every email. In short, use header checks whenever
    is convenient, and use body checks only when an effective header check cannot
    be devised. Only REJECT or OK is permitted for the returned values.


    NOTE Webmin, as of this writing (version 1.020), does not provide access to the
    regular expressions-based checks, header_checks and body_checks. It is likely
