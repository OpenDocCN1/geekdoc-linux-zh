- pgno: 209
  md: '# reject_unknown_client


    The request will be refused is the client IP has no PTR record in the DNS. This
    means that a client with an IP address that cannot be resolved to a host name
    cannot send mail to this host.


    # check_client_access maptype:mapname


    This option requires the inclusion of an already configured map, as discussed
    earlier. This will restrict based on the contents of the map, allowing only clients
    that are allowed by the map. The map may contain networks, parent domains, or
    client addresses, and Postfix will strip off unnecessary information to match
    the client to the level of specificity needed.


    # check_sender_access maptype:mapname


    This will restrict based on the contents of the map, allowing only senders that
    are allowed by the map. The map may contain networks, parent domains, or localpart@.


    # reject_maps_rbl


    An RBL is a relay domain black hole list. By testing a reverse domain lookup against
    a name server that receives a domain black hole list transfer, the server can
    know if the mail was sent through a known open mail relay. There are a number
    of free and for-fee services providing black hole data. The largest and longest
    lasting is the service operated by MAPS [http://www.mail-abuse.org/], while two
    new similar services are operated by the Open Relay Database [http://ordb.org/]
    and by Distributed Sender Boycott List [http://dsbl.org/]. All operated on the
    principle of allowing administrators to choose to refuse mail sent from open mail
    relays. If this option is listed, the client will be checked against the available
    RBL domains, and if any match the mail will be refused.


    > NOTE If using any of the free RBL services on the network, consider donating
    money, time, or resources to the project maintainers. The projects are generally
    run by volunteer labor, using network resources that have been paid for by the
    maintainers.


    # reject_invalid_hostname


    If the client host name is invalid, due to bad syntax, the request will be rejected.


    # permit_naked_ip_address


    If the client HELO or EHLO command contains a naked IP address without the enclosing
    [] brackets as required by the mail RFC, the message will be rejected. Beware
    that some popular mail clients send a HELO greeting that is broken this way.


    # reject_unknown_hostname


    Reject the request if the host name in the client HELO command has no A or MX
    record in the DNS.


    # reject_non_fqdn_hostname


    If the client host name is not in the form of a fully qualified domain name, as
    required by the RFC, the message will be rejected.'
