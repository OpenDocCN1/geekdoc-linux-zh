- pgno: 274
  md: '# 13


    # NETWORKING CONFIGURATION


    ![](img/d84604054810a13cacfdac212ebee2f7_274_0.png)


    The fourth category tab in Webmin is for **Networking**-related configuration.
    Specifically, this is where you’ll find the modules to configure netbr xinetd,
    iptables, NFS exports, NIS client and server and network interfaces. The Networking
    category was introduced in Webmin version 1.0, so if for some reason you are using
    an earlier Webmin revision (upgrade already; it’s free!), these modules will be
    found under other category tabs.


    # NFS Exports


    The **NFS Exports** module lists all exported directories. Clicking **Add a new
    export** will bring you to the **Create Export** page, as shown in Figure 13-1.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '![](img/d84604054810a13cacfdac212ebee2f7_275_0.png)


    # Figure 13-1: Create NFS export


    In the preceding figure, you can see that the module allows you to select a directory
    to export, and choose a number of options for that directory and to whom the directory
    should be exported.


    # Export Details


    The following options configure the location, type, and permissions of the directory
    to be exported:


    # Directory to export


    This is simply the full path to the directory you would like to export.


    # Active?


    An export may be disabled when it is not needed by selecting no. Otherwise the
    export will always be active and available as long as the NFS server is running.


    In the next few fields it is possible to select access controls to dictate which
    machines or users on the network will be permitted to mount the exported directory.


    # Everyone


    Specifies that anyone may mount the directory. This is similar to an anonymous
    FTP server.


    > CAUTION Use extreme caution when exporting a directory to everyone. If your
    local network is not protected by a very good firewall, it will be possible for
    outsiders to mount your exported directory. It may also be possible for outsiders
    to stage a denial-of-service attack against your server, as NFS is not renowned
    for its reliability in the face of determined attackers. It is always a good idea
    to restrict NFS exports to just those machines that need access, and additionally
    to implement a firewall to block anyone outside of your local network from even
    attempting to connect to your NFS server.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Host(s)


    Allows you to specify a host name or IP that may mount the directory. Wild cards
    are accepted in this field as well, so that names of the form *.company.com can
    be entered to match all hosts in the company.com domain.


    # WebNFS clients


    WebNFS is a relatively new protocol that has been developed by Sun, who also created
    NFS, and is designed for file sharing across the Internet. It allows users to
    browse exported directories using a familiar web browser as the interface. It
    has largely been ignored by the mass market in favor of WebDAV, but it may have
    its uses in some environments. If you will be supporting WebNFS clients with this
    export, select this option. Not all operating system variants support this option,
    or if support is provided it may not be complete or stable.


    # Netgroup


    If your local network uses NIS services, you may use netgroups to specify access
    to exports. Any existing group name may be specified here.


    # Network


    To export to all hosts on a given network, enter the network number and netmask.
    This may be a full network class, or it may be a smaller subnet.


    # Make symbolic links relative?


    On NFS mounted directories, symbolic links can pose a problem, due to the change
    in where a directory might be mounted on the client machine. For example, a directory
    located on /home/nfs/users on the NFS server may be mounted on the client on /home.
    If a symbolic link on the server points to /home/nfs/users/joe/work, the link
    will be broken on the client machine if the link is not converted to a relative
    link. If made relative, the link will become joe/work and will work fine on the
    client machine. This option corresponds to the link_relative switch.


    # Clients must be on secure port?


    The effect of turning this option on is that NFS will insist upon a connection
    on ports below 1024. This does improve security in some circumstances, but may
    interfere with Windows clients mounting the exported directory. In reality, security
    of most current NFS variants in use is relatively weak, providing only mediocre
    authentication methods and no data encryption.


    # NOTE


    > In UNIX systems, software run by a normal user is not permitted to bind to a
    port below 1024. This means that only the root user on a multi-user system can
    start services that run on ports below 1024. The security implication of this
    is that when you connect to a UNIX server on a port below 1024 (such as making
    an NFS connection when this option is enabled) you may have some assurance that
    the NFS server is one being operated by the administrator of the server. If the
    NFS server has normal users, and NFS connections are not forced to be made on
    low ports, it might be possible for a malicious user to operate an'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'illicit NFS server whose only purpose is to obtain access to parts of the network
    he should not have access to. As discussed earlier, Webmin is often run on port
    1000 or some other sub-1024 port in order to avoid this risk for the Webmin server.


    # Export Security


    In the Export Security section you can specify several other security options,
    including the ability to treat some UIDs and/or GIDs as untrusted users. This
    section also provides fields for declaring what user and group name will be used
    for the untrusted users'' permissions.


    # Access mode


    The exported directory may be mounted for reading and writing, or just for reading.
    This option correlates to the ro and rw switches in the exports file.


    # Deny access to directory?


    Normally, when a directory is exported, all of its subdirectories will be exported
    with the same access rules. This is usually exactly what is desired, as in the
    case of exporting home directories to users via NFS. Obviously, the users will
    need to access everything in their own home directory, including subdirectories
    thereof. This option explicitly denies access to a directory, when the connecting
    client matches the export rules in this export. This can be useful to explicitly
    disallow access to a subdirectory of a directory that is exported in another rule.
    This option corresponds to the noaccess directive.


    # Trust remote users


    NFS provides a simple trust model, wherein some users will be trusted, all users
    will be trusted, or no users will be trusted. To be more explicit, when another
    computer on the network connects to your NFS server, the UID of the user attempting
    to access the exported directory is included in the negotiation process. Depending
    on the configuration of this option, the user may be able to use files with the
    same permissions as if he were working on the local machine, assuming other configuration
    details don''t prevent it. If either Everyone or Everyone except root are selected,
    all normal users will be able to use the files on the NFS export as though they
    are working on the local machine. The root user will have this same ability only
    if the Everyone option is selected. In the case of exporting user home directories,
    it makes sense to enable the Everyone except root option. The Nobody option means
    that the connecting user will always be treated as the untrusted user. This option
    sets the no_root_squash and all_squash directives. The default is Everyone except
    root, which correlates to the implicit root_squash directive.


    The untrusted user is a user that is used specifically for NFS, but it is very
    similar in function to an anonymous user on an FTP server. This can be useful
    for many situations where some or all client machines are not directly under the
    control of the administrator of the NFS server. A common use for such exports
    is system boot images and anonymous access to file or document repositories.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Don''t trust UIDs, Don''t trust GIDs


    If there are specific user IDs or group IDs that should be treated as the untrusted
    user, they may be specified here. The IDs may be specified as a range, such as
    0-500, or as a comma-separated list or a combination of both. Most UNIX variants
    reserve some subset of UIDs and GIDs for system-specific users and groups, like
    nobody and lp. It may be useful to distrust a user claiming to be one of these
    system users or groups. This option correlates to the squash_uids and the squash_gids
    directives, respectively.


    # Treat untrusted users as, Treat untrusted groups as


    This option specifies the user ID and group ID to which an untrusted user or group
    is mapped to. If unspecified, the untrusted UID or GID will be set to the default
    of the NFS server. This varies somewhat between NFS versions, but it is safe to
    assume the default is a user or group with very limited permissions, and is usually
    an appropriate choice for the system on which it is running.


    # Network Configuration


    The Network Configuration module provides a nice, clean interface to most of the
    important network configuration details on your system (Figure 13-2). It is possible
    to set IP addresses, create IP aliases, define routing and gateway information,
    configure DNS clients, and edit the /etc/hosts file.


    ![](img/d84604054810a13cacfdac212ebee2f7_278_0.png)


    Figure 13-2: Network Configuration


    # Network Interfaces


    Clicking the Network Interfaces icon will open a page similar to Figure 13-3,
    which allows you to configure the currently active interfaces as well as interfaces
    that are brought up at boot time (usually these will be the same).'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Figure 13-3: Network Interfaces


    The Interfaces Active Now section is a list of interfaces that are currently up.
    The same data could be gathered by running ifconfig -a from the command line.
    The section below that, Interfaces Activated at Boot Time, is the list of interfaces
    that are configured permanently on the system. These can optionally be brought
    up on boot.


    To edit an interface, either Active or Boot, simply click the name of the interface.
    You will be presented with a page similar to Figure 13-4.


    # Figure 13-4: Editing a bootup interface


    Here it is possible to specify the IP address for the system or to choose DHCP
    or BOOTP to auto-configure the IP. Also editable from this page are Netmask and
    Broadcast settings.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'Adding a new interface is equally simple. From the main page, click the **Create
    new interface** under either **Interface Active Now** for a temporary interface
    or **Interfaces Activated at Boot Time** for a permanent interface. Then on the
    configuration page, choose a name for the interface. Manually enter the IP, or
    choose DHCP or BOOTP for automatic IP configuration. If manually entering the
    IP, also enter the Netmask and Broadcast settings, or select Automatic for these
    settings, if preferred and available (Automatic is only available when creating
    an Active interface.


    > Note when editing a just-created Boot interface it is possible to activate it
    immediately by clicking Save and Apply rather than simply Save.


    # Routing and Gateways


    Routing is an encompassing term that basically refers to the paths that your system
    should take to reach certain hosts and networks. In the simplest configuration,
    you will only have one route, known as the default router or gateway. This simply
    means the all packets that are bound for a network that is not local will be sent
    to the address defined by the default route setting.


    In Figure 13-5 the Default router is blank, because on the example machine, the
    route is set automatically by DHCP. It could contain an IP or a host name, if
    a router did need to be defined. Default route device simply defines which device,
    on systems with more than one device, will be considered the default device. This
    device name could be any active device on your system, such as eth0. The Act as
    router option turns on packet forwarding on some Linux systems. On Red Hat Linux
    systems this is done in /etc/sysconfig/network or /etc/sysctl.conf on versions
    from 6.2 onward.


    ![](img/d84604054810a13cacfdac212ebee2f7_280_0.png)


    Figure 13-5: Routing and gateways


    **Static routes** provide a means for some traffic to choose another route to
    some known host or network, rather than going through the default route. This
    is commonly used for accessing local networks on different subnets through a single
    multi-homed host, or a host having more than one network interface. For example,
    if my system were on the 192.168.1.0/24 local subnet, and I had a second subnet
    on 172.16.1.0/24. I could provide a static route with the interface value of eth0
    and a Network of 172.16.1.0, a Netmask of 255.255.255.0, and finally, a Gateway
    of 192.168.1.23, assuming the host at 192.168.1.23 also had an active interface
    on the 172.16.1.0 network.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# DNS Client


    The DNS Client module allows you to configure your system’s resolver settings
    (Figure 13-6). Usually, all you need to do is add your name server’s IPs to this
    list. In the case shown in the following figure, there is a local caching name
    server running on IP 127.0.0.1, as well as two remote name servers as backups.


    Resolution order allows you to select the order in which the system will try to
    resolved host names. In the example in the figure, DNS will be checked first,
    followed by the /etc/hosts file. Other available resolution options are NIS and
    NIS+. Finally, the Search domains field usually contains the domain name where
    your computer is located, and possibly others. Search domains will be searched
    first if a fully qualified domain name is not entered. For example, if I tried
    to ping a host named gigi on the machine shown in the example, the name gigi.swell
    would be looked up first, and then if there was no such system in DNS or /etc/hosts
    it would try to resolve just the name gigi.


    ![](img/d84604054810a13cacfdac212ebee2f7_281_0.png)


    Figure 13-6: DNS Client


    # Host Addresses


    The /etc/hosts file is another common resolution method on UNIX systems. It is
    a very simple way to deal with a small number of host addresses. However, because
    host files are not easily shared amongst multiple computers, its usage is limited.
    Nonetheless, Webmin does provide a nice means of editing your hosts file, so I’m
    going to document it.


    In Figure 13-7 there are a number of IP addresses and the host names they are
    associated with. Clicking any of the IPs will allow you to edit the entry. Creating
    a new entry is done by clicking Add a new host address. If you only have a very
    small network, a host file on each machine may be all you need; otherwise, use
    DNS for most resolution tasks.


    ![](img/d84604054810a13cacfdac212ebee2f7_281_1.png)


    Figure 13-7: Host addresses


    # TIP


    When testing Apache virtual hosts that are not yet ready for production use, it
    can be useful to configure the address and host name here, so that you can browse
    your test server on the host name where it will eventually live. Of course, you
    can do the same thing by running a local DNS server, but the hosts file is a simpler
    way to achieve the same task.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 14


    # HARDWARE CONFIGURATION


    ![](img/d84604054810a13cacfdac212ebee2f7_282_0.png)


    The **Hardware** configuration tab presents several options for hardware level
    settings (Figure 4-1) This includes disk partitions bootloader, printer administration
    system time and date and more. The exact options available vary greatly depending
    on platform.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'Figure 14-1: Hardware configuration


    # Linux Boot Configuration


    If you are running Linux, Webmin provides module for editing the /etc/lilo.conf
    file that the Linux LOader, or LILO for short, uses. LILO is the boot manager
    most commonly used with Linux. It works by writing a small boot sector to the
    MBR on your boot disk. This boot sector contains the code needed to first present
    a prompt:


    ```

    LILO:

    ```


    This allows you to select the kernel or operating system to boot. LILO can boot
    multiple operating systems and multiple versions of the Linux kernel. When you
    open the Linux Bootup Configuration page (Figure 14-2), you should see at least
    one boot kernel or boot partition. Boot kernels are for Linux kernels, while boot
    partitions are for other operating systems.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Figure 14-2: Linux Bootup Configuration


    Clicking one of the boot kernel or boot partition icons will allow you to edit
    that boot kernel or partition (Figure 14-3).


    # Figure 14-3: Edit Boot Kernel


    Here the name is an identifier for the kernel and it translates to label in the
    /etc/lilo.conf file. The Kernel to boot is the path to the Linux kernel boot image
    to load.


    # Kernel options


    This field can be used to enter any arguments you need to pass to your kernel
    on boot. It is often used for specifying the amount of memory in a machine when
    Linux doesn’t recognize it all. For example, to specify 127MB of RAM, one could
    select Add options and add the line mem=127M in the text field. This will be translated
    in the /etc/lilo.conf file to:'
  merge: -1
  img_proc: true
- pgno: 285
  md: '```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    default=linux


    image=/boot/vmlinuz-2.2.16-11.0

    label=linux

    read-only

    root=/dev/hda5

    append="mem=127MB"

    ```


    It is always necessary to click Apply Changes from the main page in order to write
    a new boot sector to the boot device. This button simply runs /sbin/lilo.


    # GRUB Boot Loader


    Much like the LILO boot loader discussed in the previous section, GRUB, or the
    GRand Unified Bootloader, is a boot loader that provides boot selection for any
    number of Linux kernel revisions and other operating system variants. It is more
    powerful and flexible than LILO, but also somewhat more complex in operation than
    LILO. Most modern Linux distributions provide both GRUB and LILO boot loaders,
    with GRUB being the default. GRUB operates slightly differently than LILO, as
    it does not have to be rewritten to the MBR anytime the kernel or boot parameters
    are changed. GRUB knows how to read many filesystem types, and therefore can mount
    the system boot disk and read in its configuration files and new kernels during
    the boot process.


    > TIP

    > GRUB is extensively documented in the grub info pages. Simply type info grub
    on the command line to browse the GRUB documentation. More information can also
    be found on the GRUB home page [http://www.gnu.org/software/grub/].


    The main GRUB module page displays each of the currently configured kernels and
    operating systems that GRUB will list in its boot menu (Figure 14-4). Clicking
    a kernel will open a new page displaying all of the configured options for that
    kernel, where they can be edited. Clicking the Edit Global Options button will
    allow you to configure options that will apply to all bootable kernels and operating
    systems.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '![](img/d84604054810a13cacfdac212ebee2f7_286_0.png)


    Figure 14-4: GRUB Boot Loader


    NOTE When you click a kernel or OS icon or the Edit Global Options button, Webmin
    runs GRUB to obtain the details for that kernel or the global configuration details.
    This process can take 30 seconds or more, because GRUB scans the system for disks
    and reads in the current boot configuration details.


    # Global Options


    The Global Options page provides access to the options that will apply to all
    bootable kernels and operating systems, including the kernel to boot by default,
    password options, and boot timeout (Figure 14-5).


    ![](img/d84604054810a13cacfdac212ebee2f7_286_1.png)


    Figure 14-5: Global Options


    # Default boot option


    This option allows you to specify the kernel or operating system that will be
    booted by default, if nothing is selected by the user from the boot menu. This
    option corresponds to the default directive in the grub.conf configuration file.


    # Fallback boot option


    If the user-selected or default boot option fails because GRUB cannot locate the
    necessary file, this specifies the kernel or OS that GRUB should attempt to boot.
    This option correlates to the fallback directive.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Timeout before loading default


    When booting, GRUB normally displays a menu of bootable items and waits for a
    few seconds for the user to select an option. If nothing is selected, the default
    item will be booted. This timeout is usually ten seconds, but can be made shorter
    or longer with this option. This option correlates to the timeout directive.


    # Boot password


    If the system will be located in an unsecured environment, and may contain sensitive
    data, it can be password protected so that even during booting the installed system
    cannot easily be compromised. This option correlates to the password directive
    and defaults to none.


    # CAUTION


    Even if GRUB is configured to require a password, and the operating system has
    been locked down appropriately, it may still be possible to compromise a system
    by someone who has physical access to the hardware on which the system is running.
    If the hardware provides alternate methods of booting, like CD, floppy disk, or
    USB disks, it may be possible for an attacker reboot the system into their own
    OS from which they can mount the system disks containing your data. Or, even without
    the ability to boot directly from another external medium, an attacker could install
    a hard disk of his own into the system and boot from it instead of your boot.
    This isn’t likely to be a problem in traditional office environments, but if you
    operate a public kiosk that gathers user data, or some other publicly available
    system, it is worth devoting some time to considering the many ways in which an
    attacker could obtain access to your data.


    # Install GRUB on disk/partition


    This option allows you to specify the disk, and the location on the disk, for
    where the first stage GRUB boot loader will be installed. The first stage contains
    only the code needed to read the later stages and configuration details off of
    the system disks. Normally, it will reside on the Master Boot Record, or MBR,
    of the first disk in the system, though it can reside on a specific partition
    (where GRUB itself must be booted by another boot loader) or on other disks. This
    option corresponds to the directive.


    # Edit Boot Option


    Clicking on a kernel or operating system icon will open the Edit Boot Option page
    (Figure 14-6), which allows you to configure the boot options for the kernel or
    operating system specified. Here you may specify the title that will be display
    on the boot menu and the location of the item to be loaded, and enable password
    protection.


    # Option title


    When GRUB is first loaded, it will display a menu of items that can be booted.
    This option specifies the title of the item. It is usually used to indicate the
    name and version of the operating system, but may contain any information you
    would like to present to the user. This option correlates to the title directive.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '![](img/d84604054810a13cacfdac212ebee2f7_288_0.png)


    Figure 14-6: Edit boot option


    # Boot image partition


    This option allows you to specify the location of the item to be booted. It is
    not required to be on the same disk or partition as the GRUB boot loader, but
    it must be contained on a disk and filesystem type that GRUB is able to access.
    This option corresponds to the root directive.


    # Operating system to boot


    Here you may specify the type of operating system to boot and the filename of
    the specific kernel to boot if booting a Linux kernel. GRUB supports most operating
    systems that have their own boot loader, in addition to booting Linux directly.
    Thus, it is possible to boot Windows operating systems, multiple Linux versions,
    or BSD operating systems, using the same GRUB menu. Kernel options may be passed
    to a Linux kernel, by specifying them in the kernel options field of this section.
    For example, you may wish to have a menu item entitled Single User that boots
    your system into single user mode, for emergency maintenance (or resetting the
    root password, if it is lost). Doing this simply requires you to copy an existing
    boot entry and add the word single to the end of the list of existing kernel options.


    # Password locked?


    GRUB has relatively fine-grained access control (for a boot loader, anyway), in
    that you can specify which boot menu items will require a password to boot. This
    option corresponds to the lock directive. Password protection must be enabled
    in the Global Options page for this directive to work.


    # Partition Manager


    The partition manager provides a graphical interface to both the fdisk partition
    editing command and the /etc/fstab file on your system (Figure 14-7). fdisk is
    commonly used to create and remove partitions on a disk, while /etc/fstab file
    is where the mounting information for the system is configured.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '![](img/d84604054810a13cacfdac212ebee2f7_289_0.png)


    Figure 14-7: Partition Manager


    The partition manager page provides a list of currently accessible disks and the
    partitions on it. In the first column there is the type and location of the disk,
    the number of cylinders reported by the BIOS (this isn''t necessarily the actual
    number of physical cylinders; it depends on the type of CHS structure that is
    reported by the BIOS), and model number reported by the drive. The other larger
    row contains the drive partition structure. The red bars represent primary or
    secondary partitions. If you have secondary partitions, the Extended partition
    that contains them will fill the whole portion of the drive occupied by all of
    the secondary partitions.


    To edit the parameters of a partition, click the number of the partition to edit.
    Note that mounted partitions cannot be edited. To edit the mount information for
    a partition click the mount point listed under Use. Clicking this will take you
    out of the Partition Manager and into the Disk and Network Filesystems module.


    To create a new partition on a disk with space available, click either Add primary
    partition or Add logical partition. Choose the type of partition to create (usually
    Linux or Linux swap) and then the size of the partition in the Extent field. This
    is the range of cylinders to use for this partition, so take care to correctly
    identify the cylinders and to not overwrite any existing partitions. Finally,
    click Create.


    # Printer Administration


    The Printer Administration module (Figure 14-8) may behave somewhat differently
    under different operating systems, as printer driver details and configuration
    often varies between systems and even between Linux distributions. Nonetheless,
    Webmin minimizes the differences between systems, and these directions work more
    or less unchanged.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '![](img/d84604054810a13cacfdac212ebee2f7_290_0.png)


    # Figure 14-8: Printer Administration


    When entering the Printer Administration page, you will see a list of currently
    configured printers, a link to Add a new printer and a button to Stop Scheduler
    or Start Scheduler depending on the current status of the print scheduler.


    Clicking the Add a new printer link opens a page where you can configure a new
    printer. The Name field is an arbitrary name for the printer. Conventionally,
    lp or lpo are often used for the first printer, but you can name it anything.
    The Description can be a longer description of the printer. Accepting requests
    simply sets whether the printer should be available, and Printing enabled defines
    whether it is enabled for printing (the queue can still receive requests with
    this turned off if the previous option is still on). Max print job size is the
    maximum size request that will be accepted. This shouldn’t be too small, as many
    PostScript files are quite large.


    The next section is Print Destination, where you define the device type (local,
    file, remote UNIX, or remote Windows). Many standalone network printers support
    standard UNIX lp functionality in addition to Windows printer sharing. If your
    printer is local, choose the physical device to use, and if it is a remote printer,
    enter the IP or host name for the host where the print queue is located. If using
    a Windows shared printer, enter the User, Password, and Workgroup for the printer
    share (Figure 14-9).


    Finally, the third section of the page is for configuring the driver for your
    printer (Figure 14-10). If your printer is a simple text printer or a PostScript
    printer, the top selection is probably right for you. The second option is for
    a program to handle printer control. This could be a custom print driver for your
    printer or one of a couple of competing commercial and non-commercial printer
    packages. Finally, if your system provides them, there will be a list of available
    drivers. This section, on Red Hat systems, is a front end to the GhostScript printer
    drivers that come standard with Red Hat. It’s quite likely that your system will
    have its own set of drivers, or a front end, much like that of Red Hat.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Figure 14-9: Adding a new printer


    The Send EOF option is for some printers that require an explicit EOF to be sent
    after every page before they will print. If your printer acts as though it is
    preparing to print, but never does (for example, if the busy light flashes), try
    turning this option on. Paper size is just what it seems: the size of the paper
    you print from this printer. Keep in mind that this doesn’t limit programs to
    only print on this paper size. It merely configures the standard system printing
    tools to print on whatever paper size is selected by default.


    # Figure 14-10: Adding a new printer (cont’d)


    Pages per output page is the number of pages that will be printed per paper page.
    This allows you to conserve paper by printing multiple pages on a single page
    of paper. This option will arrange the text in rows and columns. These rows and
    columns can be further configured, as well as numerous other options (too many
    to begin to discuss here), in the next field, Additional GS options. You may wish
    to consult the man pages for GhostScript, as well as those for lp, lpd, and lpr,
    to find out more about the printer capabilities of your system. You can, of course,
    view these man pages in the Webmin Manual Pages module. Another good source of
    information regarding printing includes the Printing HOWTO [http://www.tldp.org/HOWTO/Printing-HOWTO/index.html]
    at the Linux Documentation Project [http://www.tldp.org/].'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# 15


    # OTHERS CATEGORY


    ![](img/d84604054810a13cacfdac212ebee2f7_292_0.png)


    Clicking the **Others** category tab will take you to a page of tools that don’t
    really fit anywhere else. This includes a small module that allows you to run
    any system command from a button, a Java file manager much like Windows Explorer
    or the Gnome File Manager tool, a Perl modules manager, a system and server status
    module, and a Java-based telnet client.


    # Command Shell


    The **Command Shell** is a simple HTML-based shell, allowing you to execute arbitrary
    commands by entering them into a text entry field (Figure 15-1). The page reloads
    with the output from the command displayed. This module can be extremely useful
    if you must perform some command-line tasks, but cannot access a SSH or telnet
    session to the machine. Because the **Command Shell** is entirely web-based, it
    can be used on any machine that Webmin can be used on.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Figure 15-1: Command Shell


    # Custom Commands


    The Custom Commands module provides a simple interface to every single command
    on your server at the press of a button. It sounds pretty impressive. Unfortunately,
    you actually have to create those command buttons before you can use them. The
    simplest way to document it is to create an example custom command and demonstrate
    how it works (Figure 15-2).


    # Figure 15-2: Create a new custom command'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'As you can see in the preceding figure, there is a command called pinger, which
    runs ping three times in succession for each of three computers on my network.
    The -c 5 sets ping to try to ping the host five times and then exit. The output
    of this command looks similar to Figure 15-3.


    ![](img/d84604054810a13cacfdac212ebee2f7_294_0.png)


    Figure 15-3: Output from pinger custom command


    It is also possible to accept options for your commands by choosing a type of
    input and naming it in the Command Parameters section of the Create Command page
    (Figure 15-4). To make the above example more flexible, you can change it so that
    any host may be pinged by the user of the command.


    ![](img/d84604054810a13cacfdac212ebee2f7_294_1.png)


    Figure 15-4: Ping Host custom command


    In the preceding figure, you’ll see that a variable named $host has been added
    to the command. I’ve also chosen to force -c 5 to be included in the command,
    although it could also be made into a variable option. Now, the user can choose
    to enter any host name they wish to ping in the text entry field provided.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'The way this feature works is that a variable name is assigned to each entry
    field you create in the Command Parameters section. You can then insert those
    variables contents into the command that is executed.


    # NOTE


    > Beware that there have been security issues with allowing user-entered data
    on custom commands in the past. All known exploits have been fixed, but it is
    still probably a wise idea to carefully consider security implications before
    giving a normally untrusted user access to commands that allow arbitrary text
    entry.


    # File Manager


    The File Manager is a complete tool similar to the Windows Explorer or Nautilus.
    It is a Java applet that runs within your browser and provides most of the features
    one would expect from a traditional GUI-based file manager, including file copies,
    moves, deletions, editing, viewing, and more (Figure 15-5).


    ![](img/d84604054810a13cacfdac212ebee2f7_295_0.png)


    Figure 15-5: File Manager


    To run the File Manager your browser must have the Java JVM plug-in. Its use is
    probably immediately obvious to anyone who has used Windows Explorer, Nautilus,
    or any other graphical file manager.


    # Editing


    Clicking the Edit button while a text file is selected in the File Manager will
    open a simple text editor, similar in function to the Windows Notepad (Figure
    15-6). The text editor supports cut and paste and simple search and replace. While
    not'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'nearly as powerful or flexible as the traditional UNIX text editors, like vi
    and emacs, it can be useful to have an entirely web-based platform for editing
    text files on your Webmin server.


    ![](img/d84604054810a13cacfdac212ebee2f7_296_0.png)


    Figure 15-6: Editing


    # Info


    Clicking the Info button with a filename selected in the File Manager will open
    a window containing some useful meta data about the file (Figure 15-7). This window
    provides information about the file ownership, permissions, setuid status, last
    modified date, and file size.


    ![](img/d84604054810a13cacfdac212ebee2f7_296_1.png)


    Figure 15-7: Info'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# EXT


    On Linux, clicking the EXT button while a file is selected will open a new window
    listing the attributes of the file (Figure 15-8). File attributes can be used
    to make certain files behave differently than they ordinarily would. For example,
    selecting the "Do not allow modification" check box will lock the file, so that
    even the root user cannot change it without first unsetting this bit. To find
    out more about attributes in the Linux ext2 and ext3 filesystem, read the chattr
    man page.


    ![](img/d84604054810a13cacfdac212ebee2f7_297_0.png)


    Figure 15-8: EXT


    # Perl Modules


    The Perl Modules module provides an interface for browsing installed Perl modules,
    installing new Perl modules from CPAN, and uninstalling Perl modules.


    The upper section of the page displays a list of currently installed modules,
    the number of submodules within the module, the description of the module, and
    the date on which the module was installed (Figure 15-9). Clicking the name of
    a module opens an information page that provides the names of the submodules and
    displays the module documentation.


    | Module | Submodules | Description | Installed on |

    |---|---|---|---|

    | Apache::DBI | 1 | Initialise a persistent database connection | Fri Jun 13 07:02:08
    2003 |

    | Chronos | 14 |  | Fri Jun 13 07:04:39 2003 |

    | RPM::Specfile | 0 | Perl extension for creating RPM Specfiles | Mon Oct 14 04:27:55
    2002 |

    | URI::Find | 1 | Find URIs in arbitrary text | Fri Jun 13 07:02:32 2003 |


    Figure 15-9: Installed Perl modules


    The lower portion of the module allows you to install new modules from a variety
    of sources. The first choice is to install directly from CPAN. If you know the
    name of the module you would like to install, you can enter it into the text field
    and click Install. Or, if you don''t know the precise name, you can click the
    ... browse button to the right of the text entry field and browse the categorized
    CPAN archive. You can also install Perl modules from files, located on the local
    machine, your client machine, or on an FTP or HTTP server.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'When installing a new module, you will be able to select the install actions
    Webmin will take (so you can test an install before actually doing it, if you
    like). You can also enter additional build and installation arguments and configure
    environment variables that will be active during the configuration and installation
    of the module.


    # System and Server Status


    The System and Server Status module is a simple but flexible service monitor that
    provides emailed alerts, scheduled checks, and a status GUI (Figure 15-10). With
    this module, it is possible to monitor a server and its software to ensure it
    is operating as expected. The module provides tests for server daemon status,
    disk usage, CPU load, memory usage, ping response time, file modification, network
    traffic, and more.


    ![](img/d84604054810a13cacfdac212ebee2f7_298_0.png)


    Figure 15-10: System and Server Status


    # Adding a Monitor


    To add a new monitor, select a type of monitor from the drop-down list, and click
    Add monitor of type. This will open the Create Monitor page (Figure 15-11).


    ![](img/d84604054810a13cacfdac212ebee2f7_298_1.png)


    Figure 15-11: Create Monitor'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'In the preceding figure, you can see that the Description field has been set
    to Disk Space of /. This is the title that will be displayed on the main page
    of the module and will be used in any emailed status alerts regarding this monitor.
    Run on host is set to Local, but if any remote Webmin servers existed in my configuration,
    it could also check a remote system. Check on schedule? is set to Yes so that
    if automatic checks are enabled in the module configuration, this monitor will
    be tested. It is possible to specify commands to be run when the monitor goes
    down or comes back up, as well as specify on which host the commands will be run.
    For the Filesystem to check I''ve selected / and specified a minimum free space
    of 100MB.


    # Scheduled Monitoring


    In order for status checks to be performed regularly (rather than only when you
    view the module main page), you must enable scheduled monitoring. To do this click
    on the Scheduled Monitoring button and select Yes for the Scheduled checking enabled?
    option. Also on this page are options to choose how often checks are performed,
    days and hours in which checks will be performed, an email address to send status
    reports to, and under what circumstances an email should be sent.'
  merge: -1
  img_proc: true
