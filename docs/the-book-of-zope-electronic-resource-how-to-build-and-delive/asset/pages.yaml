- pgno: 22
  md: '# 1


    # ZOPE FUNDAMENTALS


    ![](img/43a28cce5475b2f487bf455365567fb6_22_0.png)


    This chapter introduces ways of using Zope for web development and as a web application
    and content manager server. The second half of the chapter takes you through installing
    Zope under the various operating systems.


    # 1.1 Web Applications


    The World Wide Web is no longer merely a collection of static web pages, but is
    increasingly becoming a transport medium for many services that blur the lines
    between content and software. Examples include knowledge databases and Internet
    search engines, as well as entirely new software categories such as content management
    systems (for managing and publishing content to websites or intranet portal systems
    (which allow Internet communities to create and exchange content); and weblogs
    (news systems, usually featuring discussion forums, such as dashdot.org).


    These software systems are referred to as web applications because they require
    only a web browser for access and no additional software. They are typically easy
    to use.


    As the demands placed on these web applications have become increasingly complex,
    programmers have hit the boundaries of what can be done with traditional CGI (common
    gateway interface) programming, thus creating a demand for suitable alternatives.
    And, because web programmers have no interest in using web'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'applications that work with CGI scripts to implement recurring basic systems
    as user authentication and authorization applications for ecommerce community
    portals), they are turning to systems like Cold Fusion, PHP 3 and 4, and Zope
    to provide these basic services and make software development easier.


    # 1.1.1 The Advantages of Zope for Web Application Programmers


    Zope has a lot to offer web application programmers:


    +   - Zope is entirely object-oriented.

    - Zope contains an integrated object-oriented database and a webserver.

    - Zope is transaction-oriented and allows users to do things like undo actions
    and so on.

    - Thanks to database adapters (DAs). Zope can be connected to relational databases
    such as Oracle, Sybase, PostgreSQL, and Interbase.

    - Zope''s extremely flexible open source license allows developers to use Zope
    for both their own projects and customer projects without any restriction or license
    fees.

    - The Zope community makes available hundreds of applications just for Zope (known
    as Zope Products), which can be easily implemented by users with no programming
    knowledge using Zope''s integrated web management system.

    - Zope''s scripting language, DTML, and ZClasses let you program Zope systems
    via using only your web server.

    - Thanks to Python''s object-oriented structure, hundreds of available modules
    can be integrated into Zope to allow you to perform specialized tasks, such as
    creating reports in PDF format.


    # 1.2 Zope As a Web Application Server


    A web application server functions as the bridge (middleware) among the browser,
    the developer''s software application, and a database.


    As the boundaries between websites and web applications disappear, it is more
    important for integrated teams of software, database, and interface developers
    to establish a common basis for their work. The Zope web application provides
    this basis, allowing you to use rich HTML, DTML, SQL, Python, and eventually even
    Perl Code in Zope as described.


    In addition, Zope''s scripting language, DTML, can be used to access a vast array
    of functions and perform complex actions and templating with a few lines of code.
    For example, to allow a group of users (subscribers, for instance) to view content
    different from what the “ordinary” web visitor sees, you can use Zope''s integrated
    authentication system (Chapter 3) to see whether the user logging in belongs to
    a particular user role or has any special security permissions.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 1.2.1 Content-by-Role


    We athive this ability to let different user types view different content-by-role.
    This is a fundamental function of content management systems used, for example,
    to provide editors with different permissions or menu options than those available
    to journalists.


    # 1.2.2 SQL = Structured Query Language


    SQL, the Structured Query Language for databases, can also be used directly in
    Zope provided a suitable database adapter (DA) has been compiled beforehand. This
    feature allows database developers to decide how much program logic to store in
    the database and how much to store in the Zope server.


    # 1.2.3 Python


    Because Zope is mainly written using Python, it can communicate relatively easily
    with Python modules or programs. This feature gives Zone programmers instant access
    to hundreds of program modules that make it easy, for instance, to create PDF
    or graphics files.


    # 1.3 Zope As a Content Management Server


    Many organizations want the ability to structure the content on their websites
    to make it possible for a broad spectrum of users to input and maintain content.
    Although web design tools such as Microsoft Front and Adobe GoLive serve this
    purpose, they are really better suited for professional designers. People who
    occasionally enter a press release or a special offer to the Web site may find
    them difficult to


    In contrast to other web applications, Zope offers a basic content management
    system as its web administration screen, and many of the functions of content
    management systems (CMS) are already integrated into Zope. An experienced programmer
    can use Zope to quickly build a customized CMS that, for example, displays selected
    Zope functions to users. Other functionality, such as staging or workflows, can
    be programmed later if necessary.


    # 1.3.1 Open Source Software


    Zope differs significantly from commercial products. For one thing, nobody claims
    Zope is a product that you simply unpack, press a button, and have running with
    a mouse click. In fact, to date there is no thing as a ready-to-go, out-of-the-box
    CMS solution.


    Two of Zope''s major benefits in comparison with other content management systems
    are the facts that it is object-oriented and that it is an open source software.
    As object-oriented software, knowledge developed within an organization for a
    CMS can be quickly used to develop a portal or extranet. Because it is open source
    software, Zope is free—and its source code is also available to you, for free.
    As such, Zope has a good chance of becoming “the people''s CMS” because'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'employees do not need to consult purchasing department or be allocated a budget
    to use Zope. What''s more, you needn''t depend on a vendor or risk the chance
    that Zope will cease to be available the manufacturer goes bankrupt. Zope will
    always be available and can be distributed by anyone, according to its open source
    Zope Public License (ZPL). Also, as a direct result of this license, users are
    free to modify or extend Zope itself to fit their own needs.


    # ## 1.4 Technical Requirements


    There are virtually no barriers to installing Zope (which has contributed to the
    breathtaking increase in the number of Zope users). The file download is currently
    only 5 MB, and the Unix version, at 3 MB, is even less. Linux users, check your
    package index to see whether Zope is already on your distribution''s CD or DVD;
    it''s included with Red Hat and SuSE Linux and others.


    # ### 1.4.1 Hardware Requirements


    Compared to other commercial web applications, Zope''s hardware requirements are
    quite modest. A Pentium-II computer with 128-MB RAM is sufficient for development.
    Using this hardware configuration, Zope will even run under Windows 95, 98, and
    so on, without problems. Also, given that Zope comes with its own webserver and
    object database, you don''t need to install any other software. (You may, however,
    want to try some of the more than 250 Zope products available for Zope because
    they provide you with new ideas and examples to learn from.) You can also develop
    Zope products on a Windows computer and then install them on a Linux computer
    without any problems.


    # ## 1.5 Installation


    This section takes you through installing Red Hat under various operating systems.


    # ### 1.5.1 Windows


    To install Zope on a Windows machine, you will need the Zope installation file
    for Windows (for example, Zope-2.3.2-win32-x86.exe).


    Once you have saved the file to your hard drive, click on it in Windows Explorer
    or open the Start menu and select Run... to start the setup program. The setup
    program is almost entirely automatic, and you will need to enter only a small
    amount of information.


    First, enter a name for your Zope installation, as shown in Figure 1-1.'
