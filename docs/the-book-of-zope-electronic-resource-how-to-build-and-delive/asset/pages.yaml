- pgno: 287
  md: '# 14.2 External Methods


    External methods interface with external files (modules) that contain Python methods.
    These files must have the extension .py and must be located in the Extensions
    directory of your Zope installation.


    External methods allow you to extend the full power of Python into Zope because,
    when you use them, you are not restricted to specific modules and functions as
    you are using only Python scripts. However, you cannot edit external methods from
    within Zope, so you must be able to write files into your Zope installation directory
    to create external methods.


    > NOTE Be careful to code your external methods to avoid creating security holes
    in your server that can be exploited through the web.


    # 14.2.1 Creating External Methods


    If you do not have an Extensions directory in your Zope installation directory,
    create one now: you''ll create the external method objects using the Zope management
    server. These external method objects expose the external Python code so that
    they can be called from within Zope.


    The following explanation assumes that you are in the folder where you want to
    create the external method object. On the folder''s add menu, you will find the
    entry for creating external methods as shown in Figure 14-5.


    ![](img/43a28cce5475b2f487bf455365567fb6_287_0.png)


    Figure 14-5: The add objects menu'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Figure 14-6 shows the add external method form:


    ![](img/43a28cce5475b2f487bf455365567fb6_288_0.png)


    Figure 14-6: Creating on on external method


    Make sure that the file you create containing the Python method code is in the
    Extensions directory (and that it has the file extension .py) before you create
    the external method object, or Zope will not be able to find the link to the object.


    Zope requires the following information when creating external methods:


    +   - Id As with all objects in Zope, an external method needs an id far it to
    be accessed in Zope.

    - Title As with all objects in Zape, a title is not essential for an external
    method. It is, however, advisable to enter one to provide a brief description
    of the object.

    - Function name You must enter the name of the Python method you want to access
    with this external method.

    - Python module file Enter the name of the Python file that contains your methods.
    Make sure that you enter the name without the file extension (.py). Otherwise,
    because Zope automatically adds the extensian, Zope will search for a file ending
    with .py.


    Once you have completed the form and clicked Add, you are returned to the Contents
    screen of the current folder, where you should see the external method you just
    created.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# 14.2.2 Accessing Python Methods with DTML


    You can access Python methods created in this way using the following DTML command:


    ```

    <dtml-var expr="name_of_External_Method(arg1, arg2,...)">

    ```


    Here, arg2, and so on are arguments that your Python method may need. If your
    method requires no arguments, you can call it with nothing between the parenthesis,
    but you cannot omit them entirely. The DTML command below how to call an external
    method that has no arguments:


    ```

    <dtml-var expr="name_of_External_Method()">

    ```


    # 14.2.3 Example: Creating an External Method


    As an example, let''s create an external method that will move an object from
    one folder to another programmatically (like cut and paste). Because we will need
    to access Zope methods and attributes that cannot be accessed from DTML and Python
    scripts, we will code this in an external method. Listing 14-2 contains the code
    for the moveObject external method; save this to a file named "utilities.py" in
    your Zope Extensions directory:


    Listing 14-2 moveObject External Method


    ```

    1: def moveObject(id, fromFolder, toFolder):

    2:     "Move an object from folder to folder programmatically"\*\*

    3:     object = fromFolder[id]

    4:     toFolder._setObject(id, object.aq_base)

    5:     fromFolder.manager.deleteObjects([id])

    ```


    In Line 1 of Listing 14-2, the statement defines the method and specifies the
    arguments it needs. id (the object being moved), fromFolder (the folder containing
    the object), and toFolder (the folder to move the object into). The next line
    (Line 2) is a string used to more clearly describe the method''s function.


    In the body of the method, the first thing to do is to retrieve the object to
    be moved (given that the method started with just its id) and store it in a variable.
    Because flourish objects in Zope act like dictionaries, with the keys being the
    ids of subordinate objects, the dictionary syntax is used to retrieve the object
    from fromFolder given its id (Line 3) and then store it in the variable named
    "object".


    Once the object has been retrieved, it is put into toFolder (Line 4). Flourish
    objects use the method _setObject for this purpose, which takes two arguments:


    > Methods with a leading underscore are called "private methods" and cannot be
    called from DTML or Python scripts. Private methods can, however, be accessed
    from external methods such as this one.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Take a look at Line 4 of this method. Notice in the second argument of

    setObject that we are accessing the attribute aq_base of a special,

    restricted acquisition attribute that bears explanation.

    Remember Zope objects support acquisition so that you can retrieve

    attributes that lie above an object in the Zope hierarchy. This is still true
    of Zope

    objects used in external Python code. When you retrieve the object from origin/(Folder)
    in Line 3, it comes with the acquisition path that includes

    this folder; this is the acquisition wrapper. Because you are moving the

    object to a different folder, this acquisition path is no longer valid, you must

    strip it from the folder.

    All objects that support acquisition (essentially, all objects stored in Zope)

    have the restricted attribute aq_base, which returns the object stripped of its

    acquisition wrapper. setObject will give you a new acquisition path in the

    context of the new folder it is moved to (toFolder). Like _setObject, aq_base

    be accessed only from external Python code (because it strips the acquired

    security settings from the object).

    Once you have the object in its new folder, you need only remove it from the

    original folder. Do so by calling the manage_delObjects method of fromFolder

    and passing it to the id of the object.


    Because of the way Python handles objects, this call does not really delete the
    object—

    just removes its old reference from the original folder.


    # 14.2.4 Creating an External Method Object in Zope


    You can now create an external method object using the Zope management

    s to establish the connection to the method in your file utilities.py. Add an

    external method object to your root folder in Zope with the following parameters:


    | Id | moveObject |

    | Title | Move an object programmatically |

    | Function name | moveObject |

    | Python module file | utilities |


    Here, moveObject is the name of the external method object, which is also

    the name of the Python method in your code (although these may often be the

    same, they need not be). The name of the Python module where the

    methodObject() is stored in the Extensions directory is "utilities". Figure

    14-7 shows the form for creating the external method.


    With this external method, you can use DTML to move an object within

    Zope. Because your method returns no result, you would use dttml-call to execute

    it. For example, to move an object named "package1" from a folder named "hold"

    to a folder named "shifted," use this line of DTML code:


    ```

    <dtml-call expr="moveObject(''package1'', hold, shipped")>

    ```'
