- pgno: 374
  md: 'does not contain any variables in the form section because there was no HTML
    form with which variables were set at the time the REQUEST was made.

    The following are probably the most used variables:


    +   AUTHENTICATED_USER manager

    URLO http://localhost:8080/My_Homepage/index_html

    BASEO http://localhost:8080

    PATH_INFO /My_Homepage/index_html

    HTTP_REFERER http://localhost:8080/My_Homepage/test_html


    AUTHENTICATED_USER returns the users (with password) currently logged on or ''Anonymous
    User''.

    URLO returns the complete path of the current object whereas URL1 returns the
    path of the folder in which the current object is located. Accordingly, URL2,
    URL3, and so on return the path of each superordinate folder.

    BASE0, BASE1, BASE2, ... also return the corresponding path although these start
    at the root folder and works downwards until the current object is reached.

    PATH_INFO returns the path of the current object without the base (for example
    http://localhost:8080/:Base;/My_Homepage/index_html =PATH_INFO).

    HTTP_REFERER indicates the URL from which the current object was called.


    You can directly access the data stored in the REQUEST:


    ```

    <html-var name="URLO">

    <html-var name="HTTP_REFERER">">"

    ```


    The following is another method for outputting data:


    ```

    <html-var expr="[URLO]">\n<html-var expr="REQUEST.HTTP_REFERER">

    ```'
