  img_proc: true
- pgno: 110
  md: '# 4.3.12 The sendmail Tag


    The sendmail tag sends electronic mail using the Standard Mail Transport Protocol
    (SMTP). One feature of the sendmail tag is that no text substitution is carried
    out, meaning that email is sent without rendering text into your document. Since
    the text of the email will not appear to the user viewing the page containing
    the sendmail tag, a message confirming that the email was sent should be included
    elsewhere in the page.


    The sendmail tag requires four parameters: an SMTP host address or a Zope mailhost
    address; a recipient''s address; the sender''s address; and a subject.


    The last three items may either be specified as attributes inside the tag (as
    customary) or can be placed in a header line format. A header line consists of
    the header followed by a colon, a space, and then the relevant data. The header
    of sendmail tag should include the following fields:


    +   To: [The address of the recipient]

    From: [The address of the sender comes next. This information is optional, although
    the header must not be omitted]

    Subject: [The subject of the email. This information is optional, although the
    header must not be omitted.]


    The message text follows these parameters. There must be at least one blank line
    between the subject line and the message text.


    The email is sent as soon as the sendmail tag is called. As a result, it is best
    to code the sending of email messages into a separate object that is called only
    for this purpose.


    # 4.3.12 "SampleMail" Example


    For example, as a result of the code shown below, Ms. Smith will receive this
    email (although it would clearly make more sense to use a mail program to send
    this one-time email). If you enhance the sendmail tag with a number of DTML tags
    to achieve dynamic layout, you can use the sendmail tag to send email with variable
    content from website.


    ```

    <sendmail smtphost="mail.mycompany.com">

    To: smith@company.com

    From: Michael Haze <Michael@wproductions.cde>

    Subject: Your order

    Dear Ms. Smith,

    I regret inform inform that delivery of the goods you recently ordered will be
    delayed by up to two days.

    We apologize for any inconvenience and thank you for your patience.

    Best regards,

    Michael Haze

    </>

    ```'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'The following examples illustrate two DTML methods. The DTML method

    form_dtml (Listing 4-1) generates a form in which only an address, a subject,
    and

    actual message needs to be entered. The data is then passed to the DTML

    method sendmail (Listing 4-2), which contains the sendmail tag (see Table 4-15
    for

    a list of sendmail tag attributes) used to send the message specified in the form.


    # Listing 4-1: The DTML method form_dtml


    ```

    <dtml-var standard_html_header>

    <h2>Your Message:</h2>

    <form action="sendmail">

    Sender: <input type="text" name="name" size="40"><br>

    Recipient: <input type="text" name="address" size="40"><br>

    Subject: <input type="text" name="subject" size="40"><br>

    <textarea name="message" rows="10" cols="50"></textarea>

    <input type="submit" value="Send Message">

    </form>

    <dtml-var standard_html_footer>

    ```


    # Listing 4-2: The DTML method sendmail


    ```

    <dtml-var standard_html_header>

    <dtml-sendmail smtpost:mail.mycompany.com>

    to: <dtml-var name="address">

    from: <dtml-var name="name">

    Subject: <dtml-var name="subject">

    <dtml-var name="message">

    </dtml-sendmail>

    <dtml-comment> The following message will be displayed when the message is

    sent:</dtml-comment>

    <h1>Your message has been sent</h1>

    <a href="file.html">Compose another message</a>

    <dtml-var standard_html_footer>

    ```


    Recipient and sender addresses as well as the subjects and contents of emails

    are submitted from the form (Figure 4-11) to the the sendmail method. The form

    data is then found in the namespace of the sendmail method. From here, the

    variables address, name, subject, and message are looked up and their values

    inserted into the body of the sendmail tag. Only then is the message sent. The

    user is then provided with a confirmation message that the email was sent.'
  merge: -1
  img_proc: true
