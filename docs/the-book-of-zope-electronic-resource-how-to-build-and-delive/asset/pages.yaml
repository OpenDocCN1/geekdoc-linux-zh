  md: '# 2

    QUICKSTART


    ![](img/43a28cce5475b2f487bf455365567fb6_34_0.png)


    This chapter gives you the basics you need to begin developing Zope applications.
    We''ll introduce you to Zope''s management interface and components, which will
    familiarize you with the Zope features you''ll use as you work through future
    chapters.


    Zope is closely linked to object-oriented programming, so we''ll take a brief
    look at the principles of object-oriented programming as they relate to Zope.
    At the same time, we will introduce you to the most important Zope objects, such
    as DTML documents and methods, and show you how to work with them. Various examples
    will help you synthesize these new techniques, after which you''ll have a chance
    to try yourself.


    By the end of this chapter, you should be familiar with the basic Zope functions
    and the most important Zope objects. Once you have finished this chapter''s tutorials,
    you should be ready to put Zope to use.


