    | You are currently working in version /Versiontest/Update | | | | | | |

    | Select type to add... | | | | | | | Add |

    | Type Name | Size | Last Modified |

    | Update | | 2001-06-22 21:39 |

    | Update2 | | 2001-06-22 21:39 |

    | acl_users (User Folder) | | 2001-06-22 21:37 |

    | index.html | 1 Kb | 2001-06-22 21:37 |

    | Rename | Cut | Copy | Delete | Import/Export | Select All |


    Figure 5-5: Joining Update'
  merge: -1
