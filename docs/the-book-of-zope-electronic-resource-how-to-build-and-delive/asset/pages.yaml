    # 3.3.3.4 ZODB


    Let''s explore the basic principles of maintaining the internal Zope Object Data-base
    (ZODB). To begin, open the Zope management screen; you should see below Control_Panel
    a link labeled Database Management and an Undo tab that calls up the management
    screen for the Undo, as shown in Figure 3-17.


    The Database Size field on the Database Management screen tells you the size of
    the file Data.fs. The Database Location field tells you that the file is in the
    directory of your Zope installation, which, for purposes of this chapter, is the
    Zope installation directory C:\Program Files\Zope\


    The file Data.fs logs all of your actions and contains all objects you created
    in Zope:


    +   * DTML methods and documents

    * Images or other Zope objects

    * Instances of a ZClass

    * Products defined inside Zope and their ZClasses

    * Undo and version data


    ![](img/43a28cce5475b2f487bf455365567fb6_72_0.png)


    Figure 3-17: Management screen for Database Management'
