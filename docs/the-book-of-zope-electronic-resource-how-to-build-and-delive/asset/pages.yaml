    ```


    The most important tree tag attributes are listed in Table 4-13. See Appendix
    A for a complete list. Asterisk attributes require at one argument.


    # Table 4-13: Attributes for the tree Tag


    | Name | Explanation |

    | --- | --- |

    | name* | See "The name Attribute" section 4.3.1.2. |

    | expr* | See "The expr Attribute" in 4.3.1.3. |

    | branches* | The name of the method used to find subobjects. The default is tpValues,
    a method that finds folderish and subobjects beneath another object. The value
    must be a method name. |

    | leaves | The name of a document that uses "leaves" to expand subjects that do
