    # 10.4 Selling Your Books


    To make it easy for people to order books from your site, you''ll create a DTML
    method called index_html, plus the DTML methods OrderForm_html and Order_html,
    which index_html needs to complete its ordering mechanism. The index_html method
    looks like the DTML method admin_html, except that the visitor does not see the
    Edit Book and Delete Book buttons or the Last Modified field. Instead, the visitor''s
    page contains a button called To Order Form, which opens the DTML method OrderForm_html.'
