- pgno: 342
  md: 'This creates a file on your local computer containing the DTML source of the
    index_html DTML document.


    FTP can also a convenient way to upload many objects into Zope (such as images,
    or Web pages) that reside as files on your computer. You can use mput command,
    for uploading an entire directory of files into Zope at once, rather than uploading
    them one at a time through the Zope management screen.


    For more information on the available FTP commands, use the help command or see
    the Unix FTP manual (type ftp at the command prompt).


    # 17.1.1 Using Graphical FTP Clients


    There are many graphical FTP clients that you can use to connect to Zope (one
    is included with Internet Explorer 5 for Windows), but you can windows one program
    that in particular is WS_FTP from Ipswitch. (You can download an evaluation copy
    from their website: www.ipswitch.com.) The following sections will use WS_FTP
    to describe the transfer of data by FTP.


    Once you have installed WS_FTP, start it up. You should see a screen similar to
    the one in Figure 17-1.


    ![](img/43a28cce5475b2f487bf455365567fb6_342_0.png)


    Figure 17-1: Window for establishing a connection in WS_FTP


    Complete the fields as follows:


    | Profile Name | Enter o name for the connection. |

    | Host Name/Address | Enter the host name or the IP address of your Zope server
    (for example: localhost, www.mycompany.com). |

    | User ID | Enter your Zope username. |

    | Password | Enter your password here. |'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'You can leave the remaining fields blank or unchanged. You will, however, need
    to make a number of changes in the Advanced tab. Click on the tab and change the
    Remote Port number to 8021, as shown in Figure 17-2.


    ![](img/43a28cce5475b2f487bf455365567fb6_343_0.png)


    Figure 17-2: Configuring the port in the Advanced tab


    Now click OK to connect to the Zope server.


    # ### 17.1.1.1 Local System/Remote System


    A window divided into two panes appears on your screen as shown in Figure 17-3.
    On the left-hand side, you can browse through your hard drive—the local system.
    On the right-hand side, you see the contents of your Zope server—the remote system.


    # ### 17.1.1.2 Drag and Drop


    To move files between the two systems, click on the desired file or files, then
    click on the top or bottom arrow button. You can also drag and drop files to move
    them.


    > Zope tries to create an object appropriate for the contents of a file that you
    drag from the local system into Zope. For example, a text document will create
    a DTML document, an image file will create an image object, any other file type
    will create a file object.


    # ## 17.2 WebDAV


    WebDAV offers a second option for accessing data on your Zope server. By default,
    the standard ZServer configuration in Zope supports WebDAV, there is no additional
    configuration to enable it. WebDAV uses the same HTTP protocol as normal web requests,
    but is similar in operation to FTP. This can be advantageous when accessing a
    Zope server from behind a firewall where FTP access has blocked.'
  merge: -1
  img_proc: true
