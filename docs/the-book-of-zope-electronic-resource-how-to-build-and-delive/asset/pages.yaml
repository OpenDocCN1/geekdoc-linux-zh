- pgno: 53
  md: '# 2.4.5 Moving Objects


    Unlike copying, when you move an object (or multiple objects) you remove it from
    its current directory and transfer it to another one. To move objects,


    +   1. Select the object or objects you want to move.

    2. Click the Cut button to remove the object from the current folder and save
    it to the clipboard.

    3. Change to the target folder and click Paste to insert the cut objects into
    the target directory.


    > Objects are not actually removed from the folder you cut them from until you
    actually move them somewhere else.


    # 2.5 Acquisition and Standard Objects


    To create an efficient information structure, Zone organizes the relationships
    between objects with the acquisition mechanism (the ways objects acquire attributes
    from their superordinate folders). Acquisition is one of the most important and
    powerful mechanisms in Zone.


    When you place objects in Zone''s folders and subfolders, you create object hierarchies,
    which Zone considers complete information structures. Objects in a folder inherit
    the attributes (properties, methods, and other objects) of the folder that contains
    them. When combined with the attributes of the actual object itself, this collection
    of inherited attributes constitutes the context or namespace for every Zone server
    object. Objects have direct access to all attributes in their name-space.


    An object''s namespace includes both the attributes of its immediate parent folder
    and the attributes of all superordinate folders right up to the root directory.
    This allows attributes that are defined higher in the Zone folder hierarchy to
    be referenced by objects at or below these attributes without using an explicit
    path reference. Through acquisition, Zone is able to find attributes contained
    in an object''s superordinate folders by name alone.


    When an object attempts to call another object, it first searches its own folder
    for the object. If the object is not found there, it moves up the folder hierarchy,
    checking each folder above until it finds the correct object. (It will not search
    other branches of the hierarchy, however.) Thus, you can share code and data by
    placing the shared objects higher in your Zone hierarchy than the objects that
    call them.


    > Objects in the root folder can be accessed from all folders because they are
    located at the very top of the folder hierarchy.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 2.5.1 Standard Objects


    As you have noticed, the root directory contains a number of objects created upon
    installation of the Zope server. These standard objects ensure a consistent appearance
    for objects created using Zope, and because they are in the root directory, they
    can be called by all objects.


    # 2.5.1.1 Standard HTML Header and Footer


    For example, the standard objects define the header and footer in each text object
    and standard_html_footer define the inserted into every DTML method and document
    by default. The code in these files looks like that shown in Listings 2-1 and
    2-2.


    Listing 2-1: The standard header


    ```

    `<HTML><HEAD><TITLE><html-var title_or_id></TITLE></HEAD><BODY BGCOLOR="FFFFFF">`

    ```


    Listing 2-2: The standard footer


    ```

    <p>

    <dt-var ZopeAttributeButton

    </p>

    </BODY></HTML>

    ```


    These objects define an HTML header and footer. Both can be called at the start
    and end of DTML methods and documents to embed them in a basic HTML structure;
    they are missing only the body of the HTML document.


    # 2.5.1.2 index_html


    The method index_html defines the welcome screen from which you access the Zope
    management screen, among other screens. It looks like this:


    ```

    <dt-var standard_html_header>

    <dt-var zope_quick_start>

    <dt-var standard_html_footer>

    ```


    > NOTE: To create a new "home page" on your Zope server, you can modify this method.


    # 2.5.1.3 standard_error_message


    The method standard_error_message is used to display Zope error messages in a
    uniform and consistent way. This can be modified to display error messages in
    any desired format.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 2.5.1.4 Modifying Standard Objects


    You can modify these standard objects to suit your own needs, but if you do, you
    must observe the acquisition mechanism. Remember that changing the contents of
    any methods in the root directory affects all objects that use that method.


    To change only the appearance of specific objects, copy the applicable methods
    (see section 2.4.3), for example standard_html_header, to the folder at or above
    the objects you want to change, change the copied methods. Thus, only the objects
    in the folder containing the changed methods (or in folders below) will be affected
    by the modifications; all other objects will still use the original methods.


    # Summary


    You are now familiar with creating and manipulating objects in Zope. The next
    chapter will take you through Zope''s tab bar and different management screens.'
  merge: -1
  img_proc: true
