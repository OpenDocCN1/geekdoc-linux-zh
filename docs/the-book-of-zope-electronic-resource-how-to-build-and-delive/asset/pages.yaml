- pgno: 285
  md: 'If you specified a variable name for a namespace binding (see section 14.1.3
    above), Zope will automatically pass any parameter values implicitly to the namespace
    when you call the Python script by name.


    You can also use an expression to call a Python script with no parameter shown:


    ```

    <html-var expr="pythonScript()">

    ```


    However, if a parameter list was specified for the script, and you want to pass
    its values explicitly "..." notation must be used, with the parameter argument
    placed between the parenthesis as follows:


    ```

    <html-var expr="pythonScript(arg1,arg2,...)">

    ```


    In the above examples, the context-bound variable in the script will be set to
    whatever object is at the top of the DTML namespace. To specify a different object,
    use the dot notation when calling the script, which makes the script act as a
    method of the object specified. For example:


    ```

    <html-call-expr="myObject.pythonScript(arg1,arg2,...)">

    ```


    In the above example, the context variable would be bound to myObject when the
    script executes.


    > NOTE For the above example to work, pythonScript must be in the acquisition
    path of myObject that myObject can acquire pythonScript from its namespace.


    # 14.1.7 Example: Creating a Zope Python Script


    Because Python scripts are often used to perform calculations, you may need to
    create a script to return the sum of a list of numbers. Although you could code
    this in DTML, Python is far easier and more readable.


    Begin by creating a Python script by choosing Script (Python) from the folder
    menu. Type total for the id and click Add. You should have a new, blank Python
    script. For the Parameter List, enter the word list, which lets Zope that your
    script will take a single parameter, "list", the list of numbers you are totaling.
    Next, enter the code from Listing 14-1 into your script body, taking care to indent
    the code as shown:


    # Listing 14-1: The total Python script


    1: total = 0

    2: for item in list:

    3: total = total + item

    4: return total


    Take a quick look at this code. First, we set the variable total to zero (Line
    1), which will be used to accumulate the total of the list items. Next, we begin
    a for loop (Line 2), which sets the variable item to each element of list in turn
    and ex-'
