    The with tag is used to manipulate the DTML namespace. It is very useful in the
    following cases:


    +   * To access different variables with the same names.

    * To define new variables for a short period of time in the DTML namespace.

    * To access objects or properties that are not in the namespace by default because
    they are not in the acquisition path.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Often you may need to access attributes of objects, such as title or id, that
    have the same names as those of the object containing the DTML code or method.
    Because the current or containing object (depending on whether you are in a DTML
    document or method) is in the namespace stack, its names will match those of other
    objects we might want to access. To get around this, we can use the tag to temporarily
    alter the namespace stack to search for the desired object:


    ```

    <dt-with name="someObject>

    The title of someObject is: <dt-var name="title">

    The size of someObject is: <dt-var name="get_size"> bytes

    </dt-with>

    ```


    Inside with the tag, the someObject is placed at the top of the namespace stack.
    This means that variable names will be sought in it first before the current or
    container object.

    With tag inserts an additional namespace at the top of the namespace stack. The
    object whose namespace is inserted is defined in the start tag of the dt-with
    block. The tag body contains the instructions to be carried out and can also contain
    other tags.


    ```

    <dt-with Object>

    Instructions

    </dt-with>

    ```


    Here''s how to access variables from subobjects not normally acquired by default:


    ```

    <dt-with name="Subfolder">

    The subfolder title is: <dt-var name="title">

    </dt-with>

    ```


    Also, with the aid of the underscore variable''s namespace method, you can use
    dt-with to temporarily set a new variable—including a value at the top of the
    namespace stack. This can be used to store the value of a calculation for use
    within the block or to override the value of an existing variable in the namespace.


    In the following fictional example, a function get_cost is called. This function
    looks up the cost of an item given its SKU number from an external database. The
    SKU number is passed from a CGI or HTML form variable. The get_cost function is
    complex and time consuming, so to increase the efficiency of our code, we store
    its value in a temporary variable named "cost". Further calculations and formatting
    will be performed on this value inside the block.'
  merge: -1
  img_proc: true
- pgno: 102
  md: "```\n<dt-with expr=\"namespace(cost=get_cost(SKU))\">\\nPrice breakdown for\
    \ SKU <dt-var name=\"SKU\"><br>\nCost: <dt-var name=\"cost\" fmt=\"dollars-and-cents\"\
    ><br>\nMarkup: <dt-var expr=\"cost * .33\" fmt=\"dollars-and-cents\"><br>\nRetail\
    \ Price: <dt-var expr=\"cost * 1.33\" fmt=\"dollars-and-cents\"><br>\n</dt-with>\n\
    ```\n\nInside the block, the variable cost contains the result returned by the\
    \ get_cost function. After the final tag, the original namespace stack is restored\
    \ and the variable cost is no longer defined.\n\n# 4.3.8.1 The only Attribute\n\
    \nThe only attribute can be used in the namespace stack of the object specified,\
    \ allowing you to completely replace the namespace stack inside with the block.\
    \ For example, in the following listing only the id variable using a form we will\
    \ output:\n\n```\n<dt-with name=\"REQUEST\" only>\n<dt-if name=\"id\">\n  The\
    \ id is specified: <dt-var name=\"id\">\n  <dt-else>\n  No id was specified.\n\
    </dt-if>\n</dt-with>\n```\n\nBecause the REQUEST object is at the bottom of the\
    \ namespace stack, it will be the only object that names acquired from inside\
    \ the block.\n\n> NOTE The only attribute does not turn off acquisition. Using\
    \ merely replaces the current namespace stack with that of another object, rather\
    \ than just adding that object's namespace to the current one. Because of this,\
    \ the only attribute has limited utility.\n\n# 4.3.9 The let tag\n\nThe let tag\
    \ is another construct for adding variables temporarily to the namespace. It is\
    \ designed as a shortcut to using the tag with the _namespace() function as above.\
    \ The let tag is a non-empty tag.\n\nLet's say we wanted to place a new namespace\
    \ at the top of the stack and then populate it with some variable data. Among\
    \ other things, the let tag functions as if you were using the let tag and the\
    \ namespace variable. The two examples below are functionally equivalent:\n\n\
    # Example 1\n\n```\n<dt-let cost=\"get_cost(SKU)\">\n<dt-var name=\"cost\" fmt=\"\
    dollars-and-cents\">\n</dt-let>\n```"
  merge: -1
  img_proc: true
- pgno: 103
  md: "# Example 2\n\n```\n<html-expr=\"_namespace(cost+get_cost(SKU))\">\n  <html-var\
    \ name=\"cost\" fmt=\"dollars-and-cents\">\n</html-with>\n```\n\nThe first line\
    \ of each example creates a new namespace at the top of the namespace stack and\
    \ adds a variable named \"cost\" to it. The value of cost is set to the result\
    \ of the function get_cost, defined elsewhere. Because this new namespace is at\
    \ the top of the stack, this value for the name cost supersedes any other variable\
    \ data that might exist further down in the namespace stack. The second line inserts\
    \ the new cost variable into our document, formatted as dollars and cents. The\
    \ third and last line closes the block and removes, or pops, the namespace containing\
    \ cost from the top of the namespace stack.\n\nMultiple variables can be assigned\
    \ to a namespace within a single let block. Each attribute of let defines a new\
    \ variable name. The expressions and names are evaluated and referred one after\
    \ another. Thus, variables can be assigned based on other previously defined variables\
    \ in the same tag as below:\n\n```\n<html-let x=\"5\" y=\"10\" z=\"y\" result=\"\
    x*y\">\n  <html-var name=\"result\">\n</html-let>\n```\n\nIn this example, x,\
    \ y, z, and result are evaluated in succession where z result arise from the previous\
    \ assignments. The value of the result variable, 500, is output.\n\n> If the value\
    \ following the variable name is double-quoted as the contents are evaluated as\
    \ an expression just like the expr attribute of other tags. However, if you omit\
    \ the quotes around the value, it is called by name—similar to using the name\
    \ attribute. This can be useful when the desired value is the result of a callable\
    \ object, such as a DTML method or ZSQL database query.\n\n# 4.3.10 The in tag\n\
    \nUsing the tag, sequences such as a list or the result set of a database query\
    \ can be run in a loop, with the sequence to be defined in the start tag. The\
    \ tag contains the instructions to be used for each individual list element. Before\
    \ the tag body code is executed on each element, html-in creates a namespace containing\
    \ any attributes of the element and some other helpful variables that can be used\
    \ by the body code.\n\n```\n<html-in Sequence Attribute>\n  Instructions\n</html-in>\n\
    ```\n\nTable 4-11 lists the most important in attributes; Table 4-12 lists those\
    \ defined inside the body. All the values listed here require at least one value.\
    \ See Appendix X for a complete list."
  merge: -1
  img_proc: true
- pgno: 104
  md: "# ### Table 4-11: Attributes for the in Tag\n\n| Name | Explanation |\n|---|---|\n\
    \ name | The name of the variable that returns the sequence to be iterated. See\
    \ \"The Attribute\" in section 4.3.1.2. |\n| expr | An expression that returns\
    \ the sequence to be iterated. See \"The expr Attribute\" in section 4.3.1.3.\
    \ |\n| sort | The sort attribute is used to sort a sequence of objects before\
    \ the sequence is iterated. The value attribute is the name of the attribute (or\
    \ the key if the mapping attribute is specified) according to the items are to\
    \ be sorted. |\n start | The name of a variable that specifies the starting sequence\
    \ item of the current batch. If this is amitted, iteration starts at the first\
    \ item. |\n| size | The size of each batch of items to iterate. If this is amitted,\
    \ the entire sequence is iterated at once. |\n| arphan | The number of items to\
    \ expand the last batch to keep it from being too small. If this is amitted, this\
    \ value defaults to 3. |\n| overlap | The number of items that overlap between\
    \ each batch. If this is amitted, there is no overlap. |\n\n# ### Table 4-12:\
    \ Variables Defined Inside the in Body\n\n| Name | Explanation |\n|---|---|\n\
    | sequence-item | The current element iterated. |\n| sequence-key | The key associated\
    \ with the sequence of an item; defined if an element is a two-item tuple. Its\
    \ value is set ta the first item and sequence item ta the second item. |\n| sequence-index\
    \ | The index (where the first number is 0) of the current item being iterated.\
    \ |\n| sequence-number | The number of the current item being iterated, where\
    \ the first item is number 1. |\n| sequence-start | The variable is true if the\
    \ current element is the first item of the current batch; if not, false. This\
    \ is useful if text must be inserted at the start of an tag, particularly if the\
    \ text refers ta batch variable defined by the in tag. |\n| sequence-end | The\
    \ variable is true if the current element is the last one of the current batch;\
    \ if not, false. This is useful if the text must be inserted at the end of an\
    \ tag, particularly if the text refers ta batch variable defined by the in tag.\
    \ |\n| sequence-even | Set to true if sequence-index is an even number. Can be\
    \ used ta alternately shade rows in a table. |\n| sequence-odd | Set to true if\
    \ sequence-index is an add number. |"
