    # 14.2 Summary of Creating External Methods


    To create and use external methods, do the following:


    +   1. Create the Python module to contain the method using a text editor and
    save it in Zope''s Extensions directory.

    2. Create the external method object that links to the Python method.

    3. Call the external method from Zope using DTML or Python in a Python script.


    # 14.3 Using External Methods to Change Roles and Permissions


    Another, more comprehensive example of an external method applies to users, roles,
    and permissions. You''ll create the external method and then use it to activate
    various permissions for several roles while deactivating the Acquire permissions
    settings option for these permissions. (For a review of roles and permissions,
    see Chapter 6.)


    This method is useful when you want to switch off acquisition for certain missions
    to assign different permissions to the roles (and consequently, to the users with
    these roles) by setting them individually.


    # 14.3.1 Changing Permissions for Multiple Roles


    You can call external methods easily using a number of DTML commands. As a result,
    you can save a lot of time and effort changing the permissions for different objects
    by simply calling this external method repeatedly (according to the number of
    objects you need to change) in a DTML or Python script instead of changing the
    individual permissions by hand.


    To change multiple permissions simultaneously or to change several roles for one
    object, pass the external method lists of roles and permissions to be changed
    in the arguments permissions_list and roles_list. The code in Listing 14-3 permits
    the external method to work with these lists.'
