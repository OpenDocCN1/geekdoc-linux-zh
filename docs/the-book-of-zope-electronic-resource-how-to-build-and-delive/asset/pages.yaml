    MODULE METHODS


    Following are definitions of and comments about common ZCatalog module methods.
    When using many of them, remember to call them in DTML first, because once they
    are edited, the browser is redirected to a page of the management-screen, which
    is not usually desired in the third view.


    Vocabulary()


    If you have created a new vocabulary (with Create one for me) and you want to
    use this method, you must modify the module ZCatalog.py slightly. If you are using
    an existing vocabulary, you do not need to make this change.


    To make the needed change, in the method __init__(), replace the line


    ```

    self.vocab_id=vocab_id

    ```


    with the following:


    ```

    if self.vocab_id==''create_one_for_me_'' or vocab_id==None:

    self.vocab_id = ''Vocabulary''

