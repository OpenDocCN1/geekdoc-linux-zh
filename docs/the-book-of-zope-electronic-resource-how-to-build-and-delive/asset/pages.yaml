- pgno: 136
  md: 'The ownership of an object is especially important for executable objects such
    as DTML Methods or documents. When an executable is rendered (executing its code),
    the permissions granted to its owner''s roles are used to determine the permissions
    available to the executing code. If the owner does not have sufficient permissions
    (via their roles) to execute the code in the object, the code cannot be run by
    any user, even if the user viewing the object has permissions (via their roles)
    to execute the code. This prevents so-called "Trojan Horse" attacks, where a user
    with lesser security privileges writes harmful code that they cannot execute,
    and then deceives a user with greater privileges into executing it for them.


    # Managing Users


    The sections show how to create and manage users using the management screen and
    discuss how to create new roles.


    Users are managed in Zone with User Folders (acl_users). However, you create only
    one User Folder per role, and you cannot copy a User Folder or cut and paste it
    into another folder (This is a security feature: if users could switch their access
    permissions to different areas in Zone, security would be undermined.) Users in
    a User Folder can log in anywhere at or below the folder where the User Folder
    lies in the hierarchy. This could be used, for example, to create a new user you
    will need the following, as shown in Figure 6-9. (The Name, Password, Confirm,
    and Roles fields must be completed: Domains is optional).


    # 6.2.1 Creating Users


    To create a new user in Folder A, first open the acl_users folder in Folder A.
    If Folder A does not contain an acl_users folder, create one by clicking the Add
    Objects menu for the Folder A and selecting User Folder.) When you click on acl_users,
    the Contents screen opens, where you can edit or create users. To create a new
    user you will need the following, as shown in Figure 6-9. (The Name, Password,
    Confirm, and Roles fields must be completed: Domains is optional).


    +   **Name** The user''s name (if you want that to be log in on). Usernames consist
    of one or more words separated by spaces and contain special characters. (Multiple
    spaces are reduced to just one space.) You cannot change a user''s name once it
    has been created.


    +   **Password** Enter the user''s password for logging on.

    **Confirm** Re-enter the password. If the password and confirmation do not match,
    click "OK" in the dialog box. You will be returned to the Management screen for
    the User, where you must recreate the user.


    +   **Roles** Users must be assigned at least one role. To select multiple roles,
    hold down the CTRL button and click on the desired ones. The permissions available
    to the user are determined by adding all of the permissions granted to all of
    the roles assigned to that user. If a user has the Monager role, no other roles
    are generally needed because the Monager role is granted every available permission.'
  merge: -1
  img_proc: true
