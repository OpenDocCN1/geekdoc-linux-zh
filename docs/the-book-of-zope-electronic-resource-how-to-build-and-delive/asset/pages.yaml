- pgno: 280
  md: '# 14


    # # SCRIPTING ZOPE WITH PYTHON


    ![](img/43a28cce5475b2f487bf455365567fb6_280_0.png)


    Zope provides two facilities to integrate Python functions directly into the Zope
    environment: Zope Python scripts and external methods.


    Using the techniques introduced in this chapter, you can code complex business
    logic and functionality directly in Python that you can directly access other
    Zope objects, such as DTML documents and methods.


    # ## 14.1 Zope Python Scripts


    Zope Python scripts are a feature of Zope version 2.3 and newer. They allow you
    to include Python code directly inside Zope through the management screen, just
    like DTML. Although there are some restrictions on the built-in functions and
    Python modules you can access, Python scripts are an extremely powerful way to
    code complex business logic for your Zope application.


    Some of the things you cannot do with Python scripts include accessing files on
    the file system, calling system programs, importing arbitrary modules, and calling
    restricted Python methods in the Zope core. To do these things you will still
    need to use an external method or Python product (described in section 14.2 and
    Chapter 15). You can, however, call any other unrestricted methods or objects,
    perform complex calculations or data manipulation, and import select Python modules.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 14.1.1 Creating Python Scripts


    You create a Python script as you do other Zope objects by using the folder''s
    menu; in the menu, select Script (Python). On the form that appears, specify an
    id, an optional title, and an optional file containing the Python code to be uploaded
    to the script. Then click on the Add button to create the script object, as shown
    in Figure 14-1.


    ![](img/43a28cce5475b2f487bf455365567fb6_281_0.png)


    Figure 14-1: Add Python script screen


    Once you have created your script, you should see the management screen shown
    in Figure 14-2.

    The first three management screen tabs—Edit, Bindings, and Test—are specific to
    Python scripts.


    ![](img/43a28cce5475b2f487bf455365567fb6_281_1.png)


    Figure 14-2: Python script management screen'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 14.1.2 Edit Management Screen


    This management screen is similar to the edit screens of DTML documents and methods.
    Python scripts also have an additional Parameter list under the title that allows
    you to specify the arguments to call the method (if any). The parameter list is
    a comma-separated list of argument names that must be passed to your script. These
    are the input values for your script to process.


    Use the large edit window to enter the Python code for your script. You do not
    need to write a def statement for your function because it is automatically created
    for you by Zope; enter only the body of the script.


    # 14.1.3 Bindings Management Screen


    The Bindings management screen lets you manage the bound variable names of your
    script, which contain special values automatically passed to your script by Zope.
    These variables are used to access the Zope environment from your script. In this
    screen, you can edit the names of these values, examine their current settings,
    or remove a bound variable by clearing the name. Figure 14-3 shows the Bind management
    screen for a Python script:


    ![](img/43a28cce5475b2f487bf455365567fb6_282_0.png)


    Figure 14-3: Bindings screen for a Python script'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'Below is a description of each bound variable available to your script:


    context


    This variable is the object that the script is called. Any Python scripts, like
    DTML methods, can act like methods of any object. Because context is a Zope object,
    the rules of acquisition apply, and you can access other objects or attributes
    that are in the acquisition path of context as well. For example, entering context.REQUEST
    will trigger the REQUEST object via acquisition.


    container


    This variable is the object that contains the script; its value changes when the
    script is moved. Use this variable to access other methods and attributes from
    the container (including objects in the acquisition path). If the container is
    called directly via its absolute URL, this value will be the same as context''s.


    script


    This variable is the script object itself. You can use it within your script to
    access attribute values of the script.


    namespace


    This variable is used to access the DTML namespace if the script is called from
    DTML. It is not bound to a variable name by default; if you need it, it is generally
    bound to the underscore [_] variable, though you can pick any name that you like.


    subpath


    This variable is used to pass data provided in the variable name traverse_subpath.
    By default it if the script is called directly via a URL, this variable will contain
    a list of any additional path names following the name of the script in the URL.
    For example, if you have a Python script named "pythonScript" in your root folder,
    the client browser will request the following:


    ```

    http://localhost:8080/pythonScript/python/is/great

    ```


    Although this URL does not point to a real object, because Python scripts are
    not folderish, Zope parses the subpath following the script name in the traverse_subpath
    variable. In this case, the value of traverse_subpath in your script would be:


    +   - [''python'', ''is'', ''great'']


    You can use the subpath data to pass parameter data to Python scripts via the
    URL without using CGI query notation.


    # 14.1.4 Test Management Screen


    This screen allows you to test your Python script by giving it values for any
    parameters you have specified. If you are not using the script as a method for
    other objects, you can use this screen as a debugging tool. If your script relies
    on specific context values, however, it will not be as useful.


    # 14.1.5 Importing Modules into Python Scripts


    Select Python modules, functions and classes provided with Zope are available
    for use in Zope Python scripts. The standard Python modules (string, math, and
    random) may be imported directly into Python scripts.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'A suite of functions has been packaged with Zope for safe use in Python

    scripts. To access them, place the following import statement at the top of your

    Python script:


    ```

    import Products.PythonScripts.standard

    ```


    This import statement gives you access to the following functions:


    | Function | Description | Example | Result |

    | --- | --- | --- | --- |

    | html_quote(value) | Replaces characters significant to HTML with their corresponding
    HTML entities. | html_quote(''>>Click Here'') | &gt;Click&lt; |

    | url_quote(value) | Escapes characters in URLs. | url_quote(''spaced out'') |
    spaced%20out |

    | url_quote_plus (value) | like url_quote, but substitutes + spaces. Used for
    CGI variable values. | url_quote(''spaced out'') | spaced+out |

    | newline_to_br (value) | Replaces newline characters in a string with <br> HTML
