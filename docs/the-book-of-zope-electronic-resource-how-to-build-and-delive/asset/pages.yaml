  md: '# 8.2.1 Methods for the User.py Module


    In the section "Creating, Changing and Deleting Users in DTML" we used some of
    the methods contained in the module User.py, for example getUser() and getUserNames().
    The same methods are described below as well as some other methods from this module
    which may be of interest to you.


    > This module contains more Python methods in the folder AccessControl (Zope/lib/python/AccessControl)
    than are described below. They cannot, however, be called up using DTML.


    The following User.py methods must always be used on a user object and cannot
    be called for themselves alone. Here are some examples:


    ```

    <dtml-var expr="AUTHENTICATED_USER.getRoles()"

    <dtml-var expr="acl_users.get()[0].getUserName()">

    ```


    In these examples, the user objects AUTHENTICATED_USER and acl_users.get()[0].getUserName()
    return the first user contained in acl_users.


    The syntax of the following examples are incorrect because no user object has
    been specified:


    ```

    <dtml-var expr="getRoles()"

    <dtml-var expr="getUserName">

    ```


    authenticate(password, REQUEST):

    If you use this method on a user, a true value is returned if the user has the
    password password; a false value is returned if the password does not belong to
    this user. You can use this method to verify the input of a password.

    If, for example, you obtain the name and password of a user using a form, you
    can then check the password using the following command:


    ```

    <dtml-if expr="acl_users.getUser(REQUEST.password).authenticate(REQUEST.password,

    REQUEST)"

    Password correct.

    <dtml-else>

    Password incorrect.

    </dtml-if>

    ```


    getUserName():\When used, for example on AUTHENTICATED_USER, this method returns
    the name of the user currently logged on as a string.


    ```

    <dtml-var expr="AUTHENTICATED_USER.getUserName()">

    ```'
