  md: '# C.3.3 index_html.shtml


    This DHTML method is merely used to generate a simple welcome screen. This is
    a static page containing whatever you wish.


    # C.3.4 login_html.shtml


    ```

    <html-call "RESPONSE.redirect(''index.html'')">

    ```


    The DHTML method login_html causes a password query to be generated if the user
    has not logged in (if the user has already logged in, nothing happens when the
    [Login] button is pressed). This is achieved via the Security settings for this
    DHTML method. The View permission is explicitly set for just the ''Man-ager''
    and ''User'': ''Anonymous'' is not given this permission.


    If the user has been authenticated with the correct username and password, this
    DHTML method returns the browser to the welcome screen.


    # C.3.5 new_WebsiteUser.shtml


    ```

    <html-var standard_html_header>

    <h2>Create a new website user</h2>

    <p>

    To create a new website user, please fill out the following form:

    </p>

    <form action="NewWebsiteUser" method="post">

    <table>

    <tr>

