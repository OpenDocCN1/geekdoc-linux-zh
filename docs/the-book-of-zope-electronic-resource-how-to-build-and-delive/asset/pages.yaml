- pgno: 306
  md: '# 15.4.2 The Main Module: Website.py


    The main module file of the product Website can be divided into five parts:


    +   1. The various imports from other modules necessary to use specific methods
    and classes from these modules.

    2. Utility methods used only to support and/or simplify certain actions.

    3. The class definitions needed for the product.

    4. The instance methods in the class and their security assertions.

    5. The constructor method of the main module with which product instances can
    be created later in Zope.


    The following section describes each section of the code in detail.


    # 15.4.2.1 Imports


    A product’s main module contains the methods that create an instance, as well
    as all of the classes and methods that define the Website product.

    in order to access the necessary Zope classes and Python modules needed by our
    product, we need to import them using the following code:


    ```

    import Globals

    from Globals import MessageDialog, DTMLE

    from AccessControl import ClassSecurityInfo

    from AccessControl.Permission import Permission

    from AccessControl.User import UserFolder

    from OFS.Folder import Folder

    import StringIO

    ```


    Below is a description of the modules being imported:


    The DTMLE class allows us to create DTML method objects from DTML stored in files.

    The Permission class assigns the necessary permissions to the new role called
    "WebsiteUser."

    MessageDialog generates messages to the user in Zope.

    AccessControl is a folder in the directory lib/python containing several modules
    (such as Permission.py, Role.py, User.py). These modules, in turn, contain methods
    (used for creating and editing User folders, roles, permissions, and so on) for
    managing security in Zope.

    FS is another folder in the lib/python directory. It contains modules that define
    most of the standard Zope objects, such as folders, DTML methods, and images.

    The StringIO module is a standard Python module that allows you to work with text
    strings as though they are files. It will be used later in a method called "addDocsToFolder"
    that creates DTML methods in Zope.'
  merge: -1
  img_proc: true
- pgno: 307
  md: "# 15.4.2.2 Utility Functions\n\nThe sample product also needs the following\
    \ utility functions:\n\n+   - GetDTML(name)\n- addDocsToFolder(theFolder, theDocs)\n\
    \nThe method GetDTML(name) is a simplification of the method called \"DTMLFile(name,\
    \ globals())\". It saves you from having to write globals() over and over again.\
    \ The code for this method is as follows:\n\n```\ngetDTML(name):\n    return DTMLFile(name,\
    \ globals())\n```\n\nThe method addDocsToFolder(theFolder, theDocs) adds the .dtml\
    \ files in the product directory as DTML methods in the Zope folder specified\
    \ by the argument. In our example, theFolder represents a new instance of the\
    \ product. When an instance is created, DTML methods are added to corresponding\
    \ .dtml files stored in a subdirectory of the Website product. These DTML methods\
    \ can then be customized in Zope to suit the needs of the particular website instance.\n\
    \nThe code for the addDocsToFolder is shown in Listing 15.1.\n\n# Listing 15.1:\
    \ the addDocsToFolder() method\n\n```\naddDocsToFolder(theFolder, theDocs):\n\
    \    \"\"\"\n    # Adding several DTML Methods in Zope\n    \"\"\"\n    errs-String=String(IO)\n\
    \    for key in theDocs.keys():\n        id=key\n        dtml.title=theDocs[key]\n\
    \        try:\n            dtml=open(dtml.raw).read()\n        except:\n     \
    \       raise RuntimeError(\"Can't find \" + dtml.raw\")\n        try:\n     \
    \       theFolder.manage_addDTMLMethod(id, title, file=thedtml)\n        except:\n\
    \            traceback.print_exc(file=errs)\n    errs.seek(0)\n    return errs.read()\n\
    ```\n\nThis method requires as arguments a folder object and a dictionary (theDocs)\
    \ listing the individual .dtml documents to be created. (See Table 15-2 for a\
    \ list and descriptions of the .dtml files required for the sample product.) The\
    \ dictionaries must be created outside the class subsequently defined for the\
    \ product (in section 15.4.2.3) and can be located at the start of the main module,\
    \ as shown in Listing 15.1. (See Appendix C for the main module's source text.)"
