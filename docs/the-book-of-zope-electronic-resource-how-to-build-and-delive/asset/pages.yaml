  md: '# 4.3.13 The MIME tag and the boundary Tag


    Often you will need to email only text messages but also file attachments. To
    send attachments, you will need to use the MIME tag and one or more boundary tags,
    which are only permissible within the sendmail tag.


    When you insert a MIME tag, the content of the message you are sending activates
    to multipart/mixed so that files can be attached to the email using the boundary
    tags. The MIME tag is a non-empty tag and contains the required boundary tags.


    The start MIME tag must be inserted on the last line header with no spaces between
    it and the subject header. You can use the MIME attributes to specify the message
    properties. If you want to send only files but no message text, you can omit the
    MIME attributes, as shown below:


    ```

    <html-var standard_html_header>

    <html-sendmail host="MailHost">

    from: martina@beehive.com

    two: martina@beehive.com

    subject: Requested

    <html-mime type="text/plain" encode="7bit">

    ```


    Here are the files you requested:

    nA boundary tag for each file to be sent follows the message text, organizing
    its transport. The MIME and the boundary both use the same optional attributes,
    which are listed in Table 4-16. The file(s) to be sent are inserted in a var immediately
    after the boundary tag (there must not be any blank spaces).


    # Table 4-16: Attributes for the MIME Tag and the boundary Tag


    | Attribute | Function | Example |

    | --- | --- | --- |

    | type | Indicates the type and format of the data. The default value is application/octet
    stream. | Type="image/bmp" |

    | disposition | Sets the content disposition of the following data. If the disposition
    is not specified in a MIME or boundary tag, the content disposition MIME header
    is not inserted into the message. | disposition="attachment" |

    | name | Indicates the name of the file object to be attached. If the name is
    used in the MIME tag, the message is sent as attachment and not as standard text.
    | name="wordfile" |

    | encode | Sets the encoding method for the files to be sent. The default value
    is base64, which is suitable for sending binary files to most mail clients. The
    following options are available: base64, uuencode, x-uuencode, quote-printable,
    u-xue, and 7bit. If set to 7bit, no encoding is applied. This is appropriate for
    textual document formats such as HTML. | |'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Files sent using the sendmail tag must exist as file objects on the Zope server;
    you cannot send files directly from the file system. To send a file from the filesystem
    to set in the system, first create a new Zope file object and insert the desired
    file. You can see your file object in the Management screen as shown in Figure
    4-12.


    | Edit | View | Properties | Security | Undo | Ownership |

    |---|---|---|---|---|---|

    | File at /Book/wordfile | | | | | Help |

    | You can update the data for this file using the form below. Select a data file
    from your local computer by clicking the browse button and click upload to update
    the contents of the file. | | | | | |

    | Title | | | | | |

    | Content Type | application/msword | | | | |

    | Precondition | | | | | |

    | Last Modified | 2001-05-28 02:53 | | | | |

    | File Size | 35, 328 bytes | | | | |

    | File Data | Save Changes Browse... | | | | |


    Figure 4-12: The properties of the file object, which contains the file to be
    sent


    You can use this screen to determine which MIME content type is correctly set
    in the corresponding boundary. When the recipient will be able to click on a received
    file to open it in the associated program—depending, of course, on the mail program
    the recipient is using to view the mail.

    You do not need to set the type attribute if you use the name attribute a filename
    whose extension already identifies the file type. The file extension .doc, for
    example, indicates that a file was created using Microsoft Word. If the name attribute
    contains no extension, the mail client will be unable to find the appropriate
    application. In this case, the type attribute must be set, or the file will be
    regarded as an “unspecified type” and will not be associated with the appropriate
    application.


    In the following example, we two files: The first created in Microsoft Word has
    its full name in the name attribute (The type attribute is therefore not required.).
    The second is an image file for which no file extension is specified and for which
    content type must be set.


    ```

    <html-boundary name="Working with Zope Versions" disposition="attachment"

    <html-var wordfile"

    encode="base64">

    <html-boundary type="image/bmp" name="spacecraft" disposition="attachment"

    encode="7bit">

    <html-var e_h.bmp>

    ```'
