- pgno: 73
  md: '# 3.3.4 Managing Your Zope Database with Pack


    Say you have been working with Zope for six months or so, as a result, you undo
    hundreds of reverts. In such a case, the Data.fs file can become quite large;
    since it contains every revision of every object (including deleted ones) from
    the past six months.


    Large Data.fs files cause two significant problems: they use excessive disk space
    and degrade performance due to the fragmentation of data in the file and on the
    disk. They can also greatly increase the time needed to restart Zope, which you''ll
    need to do after installing new Products or modifying extremal Python code.


    To eliminate this old revision data and reduce the size of the Data.fs file, you
    can pack the ZODB by Pack button. You can decide how many days of information
    you want to keep after packing by entering that number in the relevant field;
    leaving this at zero removes all information.


    When you pack, all entries for undoable actions are deleted from the Data.fs file.
    Zope creates a backup of Data.fs and calls it Data.fs.old. The current version
    of Data.fs is much smaller than Data.fs.old because it lacks all of the objects''
    previous revision information.


    Once you pack back and the operation completes, click the Undo tab; which should
    no longer show a list of actions that can be undone, as shown in Figure 3-18.


    | Status | Properties | Text | Security | Users | Ownership | Browse |

    |---|---|---|---|---|---|--|

    | Z MySQL Database Connection at /MySQL_database_connection | | | | | | |

    | the delete connection | | | | | | |

    | Close Connection | | | | | | |


    Figure 3-18: The Undo function management screen after you pack a database


    # 3.3.5 Restoring Your Saved Data.fs File


    If you inadvertently pack a database that contained changes you wanted to undo,
    replace the Data.fs file with the Data.fs.old file to turn back the clock. Do
    so as follows:-


    +   1. On the Control Panel, click Shutdown.

    2. Delete the Data.fs file.

    3. Change the name of the Data.fs.old file to Data.fs.


    # 3.3.6 Copying Your Database to Another Zope Server


    You can also copy databases from one Zope server to another, to create a backup
    Zope server, for example. For instance, to copy ZOPESERVER_A to Zope server ZOPESERVER_B.
    follow these steps:'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   1. Shut down Zope servers.


    +   2. Create a backup copy of the data.fs file on ZOPESERVER_B.


    +   3. Copy the data.fs file to the var directory on ZOPESERVER_A to the var directory
    on ZOPESERVER_B and replace the data.fs file on ZOPESERVER_B with the data.fs
