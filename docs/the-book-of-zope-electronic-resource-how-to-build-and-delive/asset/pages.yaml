    \ Writing the __init__.py\n\nZope uses the __init__.py to recognize a product,\
    \ and executes the __init__.py files for each product whenever the Zope server\
    \ is started. If a product contains a bytecode compiled version of __init__.py\
    \ (recognizable from the file extension .py), Zope checks at startup to see whether\
    \ the modification date of the compiled version is more recent than that of a\
    \ non-compiled version in the product directory. If the modification date of the\
    \ non-compiled __init__.py is more recent, a new __init__.py is compiled from\
    \ it. Thus, if you change the code in __init__.py, a new __init__.py will be generated\
    \ automatically when you restart Zope; the compiling occurs only when you start\
    \ the Zope server, must must be restarted whenever you make changes to a product's\
    \ Python files, such as the __init__.py file, the main module, and so on. If you\
    \ notice that Zope has installed the incorrect version of a product, you must\
    \ delete your product from the Product_Management list in the Zope Control_Panel\
    \ and restart the Zope server to install the new version of your product.\n\n\
    The Refresh (http://www.zope.org/Almembers/Hathaw/Refresh/) allows you to recompile\
    \ and reload a single product without restarting the entire Zope server. This\
