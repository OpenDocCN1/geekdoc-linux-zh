    # ## 8.3 Example: Authentication


    Let''s say we want to create a simple homepage consisting only of a static welcome

    page. We want our page to be accesible to all users in the third tier, and to
    have a

    link that allows our friends to log in. Once a user logs in, a personalized greetingnappears
    on our homepage; the result is a dynamically created homepage.


    Figure 8-1 shows a schematic of this process, using the example of two visitors

    to the page. In this example, Egon has a user created in Zope while Bill does
    not

    is is regarded as "Anonymous."


    ![](img/43a28cce5475b2f487bf455365567fb6_166_0.png)


    Figure 8-1: Schematic process for the Login example'
