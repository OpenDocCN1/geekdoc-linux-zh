- pgno: 87
  md: '# 4.3.1.5 Using the fmt Attribute


    The fmt attribute is frequently used to format date and time information. For
    example, the object ZoneTime returns a value and displays it in the format specified
    by the fmt attribute. The syntax is as follows:


    ```

    <var name="ZoneTime" fmt="format">

    ```


    The format attribute can also be used to format numbers and strings. Table 4-2
    lists the most important fmt attribute formats; Table 4-3 contains special formats
    to use on other data types. A complete list appears in Appendix A.


    # 4.3.1.6 C-Style Formats for the fmt Attribute


    The C-style lets you format various numeric types in scientific notation, as decimals,
    and so on. It can also be used for dates. Use the printf syntax of the C programming
    language. (For a detailed description of C-style syntax, see your favorite C manual.)


    C-style syntax consists of a percent sign, a conversion code, and an optional
    value before the converted value or a number that determines the places of the
    converted value. See Appendix A for a complete list of C-style formats.


    | Name | Description |

    | --- | --- |

    | AMPM | Returns the time including seconds. |

    | MPMMinutes | Returns the time without seconds. |

    | aCommon | The time is displayed in the format Mar 1, 2002 1:45 p.m. |

    | ampm | Returns the suffix a.m. or p.m. |

    | Day | Returns the full name of the day of the week. |

    | day | Returns the day as a number. |

    | fCommon | The time is displayed as March 1, 1997 1:45 p.m. |

    | hour | Returns the time in 24-hour mode. |

    | Month | Returns the full name of the month. |

    | minute | Returns the minutes. |

    | month | Returns the month as a number. |

    | rfc822 | Returns the date in RFC 822 format (the format used in HTTP headers).
    |

