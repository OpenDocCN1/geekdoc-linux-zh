- pgno: 120
  md: '# 5


    # WORKING WITH ZOPE VERSIONS


    ![](img/43a28cce5475b2f487bf455365567fb6_120_0.png)


    The more complex your website, the more complex its structure will be, and the
    more you will need to maintain it—yet remain unseen by your everyday user. The
    challenge, of course, is to make your changes without affecting your site''s functionality.


    This chapter will present the solution to this problem: Zope''s versions feature.
    Zope versions let you modify objects without immediately affecting your application
    and without displaying changes in process to your users until you''re ready.


    Briefly, when using Zope''s versions, you do your testing and modifications (editing,
    creating, and deleting objects) within one or more temporary version workspaces.
    Then, once you are sure that everything is working properly, you save your version''s,
    in turn updating all of the modified objects simultaneously. Your updated web
    pages, with their new content and functionality, then appear to your users.


    This chapter will show you how to create versions; access, edit, exit, and delete
    them; and how to save or discard the changes you make. We''ll follow our discussion
    with a simple example.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 5.1 Creating a Version


    You can create a new version in any folder you want, but it is a good idea to
    it in the folder where the website objects to be changed are located. If you are
    working on separate subprojects at once, you can create additional versions in
    other folders and later associate the changes with the correct subject.


    > NOTE

    Placing a version in a particular folder does not mean that the version affects
    only that folder. Versions are global and work the same regardless of where they
    are created in your Zope hierarchy. Placing versions in the folder you are working
    in is merely a convenience.


    To begin with versions, open the Available-Objects menu in the desired folder
    and select Version. Once you enter an id and a title, you will have created a
    version, which will be shown in the contents view with a red diamond icon.


    # 5.2 Joining and Leaving a Version


    You must join a version before you can work in it. To join a version, click the
    version you want to join and, on the Join/Leave screen appears, click Start Working
    in Version id, as shown in Figure 5-1.


    | Join/Leave | Save/Discard | Properties | Security | Undo | Ownership |

    | Version at /Versiontest/Update | Help |

    | **Inactive Version Operations** |

    You are not currently working in the Update version.

    | Start working in Update


    Figure 5-1: Joining a version with the id update


    Once you join a version, a button labeled "Quit Working in Join/Leave screen.
    shown in Figure 5-2, will appear in that version''s Click this button to leave
    the version. (You can work in only one version at a time.) When you leave a version,
    you return to the default Zope workspace, where changes immediately affect your
    users.


    | Join/Leave | Save/Discard | Properties | Security | Undo | Ownership |

    | Version at /Versiontest/Update | Help |

    | **Active Version Operations** |

    You are currently working in the /Versiontest/Update version

    | Quit working in /Versiontest/Update


    Figure 5-2: Leaving the version'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'When you are working in a version, a line on each Zope screen tells you which
    version you are working in. To be sure that you are working in the correct version,
    check the version name on the Join/Leave screen so you don''t lose it when you
    have created multiple versions. It is helpful to use a somewhat descriptive id
    for each version (such as a subproject''s name) so that you can tell at a glance
    what changes should be made in it.


    # 5.3 Working in a Version


    When working in a version, you can make and test changes as usual. Edited objects
    are marked by a small red diamond. When you create an object, both the new object
    and the folder above it are marked with a diamond.


    If you leave a version without applying your changes, the edited objects are locked
    and can be edited only when you rejoin that version or once version''s changes
    have been saved or discarded. Locked objects are indicated by a small blue lock
    of the locked version; for example:


    | index.html (/Versiontest/Update) | 1 KB | 2001-05-28 23:06 |


    If you create or delete an object or change its properties or security settings
    when working in a folder without saving your version''s changes, that entire folder
    will be locked, and you will be unable to add or delete objects in that folder
    or modify properties outside of the version. By locking objects, Zope prevents
    conflicts that would occur if an object could changed in two versions at the same
    time.


    > Be careful when working in a version in your root folder, especially if several
    people are working with the server at once. If you fail to save your changes properly,
    you could unintentionally lock the root folder for all other users.


    When you finish working in a version, you can choose to save or discard all of
    the changes you make in at once.


    # 5.3.1 Updating Objects


    To make changes to a version visible to the outside world, you must save it. Do
    so on the Save/Discard screen, accessed by selecting a version and then clicking-Save
    to make the update.


    > It is a good idea to enter a brief comment in the text field above the Save
    (or Discard) button. This comment appears on each modified object''s history screen
    and helps you identify the action if you need to undo it later.


    Discard changes by clicking Discard on the Save/Discard screen and entering a
    comment if you like. If your version''s changes have been saved, you can no'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'longer discard them in that version, but must use Undo instead. (If you added
    comments when you were saved, it should be easy to find the discard instead of
    undo.)


    # 5.3.2 Saving and Discarding Changes Using the Control Panel


    The Control Panel can also be used to save or discard changes to one or several
    versions. To do so, open the Control Panel and click Version Management, where
    you should see a list of all versions that can be changed. To save or discard
    changes for a version, select the check boxes next to it and click Save or Discard,
    as shown in Figure 5-3.


    ![](img/43a28cce5475b2f487bf455365567fb6_123_0.png)


    Figure 5-3: The changes in both versions are saved in one step


    # 5.4 Deleting a Version


    Before you delete a version, you must make sure that all changes made to it have
    been saved or discarded. To check, view the version''s Save/Discard screen and
    see whether any changes need to be saved or discarded. Or, open the Control Panel
    and use Version Management to see whether the desired version appears in the list
    there. If it does not, you can be sure that all changes have been saved or discarded,
    and the version can be deleted. If you try to delete a version that contains unapplied
    changes, an error message appears.


    To delete a version, select the check box beside the version you want to delete
    and click Delete.


    # 5.5 Working with Multiple Versions


    When working with multiple versions, remember these tips:


    +   - Always leave one version before moving to another. If you don''t, you will
    need to undo the changes belonging to the version you accidentally joined, and
    you will have to make them again in the correct version. Always pay attention
    to the following information at the top of the management screen:


    +   - Limit the number of versions you work with to reduce the risk of confusing
    them, particularly if versions are in the same folder and one version locks another.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   • Although you can create a new version while working in another, you will
    not be able to join the new version until you leave the old one. Consequently,
    the new version can be joined only after you save the changes to the original
    version you created in it.


    # 5.6 An Example


    Let''s make visions a bit more concrete with this example.


