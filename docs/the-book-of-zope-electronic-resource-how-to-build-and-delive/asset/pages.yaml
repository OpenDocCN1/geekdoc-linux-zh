- pgno: 345
  md: 'Another way to enable access to Zope''s WebDAV functionality from both DOS
    and Windows is to use WebDrive from RiverFront Software, which allows you to create
    a new drive letter corresponding to your Zope server. To learn more about this
    program, visit http://riverfrontsoftware.com/webdrive.htm.


    Figure 17-5: Working window with WebDAV


    You can also use the Web Folders support found in Microsoft Office 2000, which
    allows users to open and save files from Excel and Word, for example, directly
    into Zope using WebDAV.


    # 17.2.1 WebDAV for Linux and Unix


    Users of Linux or any other Unix-type operating systems can use an open source
    command line client called "cadaver", which operates much like the command-line
    FTP program, except that it connects to WebDAV servers. The program and source
    code can be downloaded for free at: http://www.webdav.org/cadaver/


    You''ll find an exhaustive list of software supporting WebDAV along with technical
    documentation about it at http://www.ics.uci.edu/pub/ietf/webdav/


    # 17.3 XML-RPC


    A third way to access external data in Zope is with XML-RPC. For this purpose,
    we''ll introduce the Zope Management System (ZMS) program (an enhanced version
    of the Radio Uranium program by David Brown), which uses the XML-RPC protocol.


    A similar program for the GNOME desktop environment for Linux/Unix is called "gnope".
    Gnope allows you to use a separate graphical interface to manage Zope outside
    of a web browser. Gnope is free and can be downloaded at http://sourceforge.net/projects/gnope/


    To use ZMS, you must install a server component (ru_utils.tgz) as you would a
    normal Zope product. This component is available for download from the ZMS'
  merge: -1
  img_proc: true
