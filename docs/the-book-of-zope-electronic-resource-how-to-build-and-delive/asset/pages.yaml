    \nWe can now run through this list step-by-step(for...in... loop) and assign each\
    \ of these permissions to the WebsiteUser role.\n\n```\nfor permission in p_list:\n\
    p=setPermission(permission,'',instance) \np.setRole('WebsiteUser', permission\
    \ in p_list)\n```\n\nPermissions are assigned to roles using the method setRole,\
    \ which is called via the permission p.setRole(...). As a result, the role is\
    \ assigned to the permission and not the other way around.\n\nTo do so, we first\
    \ assign the Permission class to a variable (in this case, p). This class requires\
    \ the name of the permission ('permission'), the value (in this case, a blank\
    \ string) and the object in which it will be used (in this case, instance).\n\n\
    Now that we have properly initialized the instance, we can put the new instance\
    \ of our product into Zope with the following line:\n\n```\nself._setObject(id,\
    \ instance)\n```\n\nIn this case, _setObject() is called on the self. Zope passes\
    \ the self argument to the constructor, it contains a reference to the folder\
    \ where the user is creating the product instance.\n\nIn section 15.6.2 we examined\
    \ the method addDocsToFolder along with the pregenerated dtml files as DTML methods\
    \ in the instance of a product. The argument for addToFolder contains the DTML\
