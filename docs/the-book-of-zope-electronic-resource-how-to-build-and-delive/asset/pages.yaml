  md: 'Listing 6-6 shows a simple query that checks to see whether the user currently
    logged in exists in the User Folder.


    # Listing 6-6: Checking Whether a User Exists in the Current User Folder


    ```

    <dt-if "acl_users.getUser(AUTHENTICATED_USER.getUsername())">

    Currently logged in user exists in User Folder.

    <dt-elseelsenn logged in user does not exist in User Folder.

    </dtml-if>

    ```


    AUTHENTICATED_USER.getUsername() returns the name of the user currently logged
    on.


    To check a user in a folder other than the current User Folder, you must access
    the relevant User Folder through the also folder(s) and/or subfolder(s).


    ```

    <dt-var "Folder.acl_users.getUser(AUTHENTICATED_USER.getUsername())"

    <dt-var "Folder.subfolder.acl_users.getUser(AUTHENTICATED_USER.getUsername())">

    ```


    Section 8.2.1 documents additional methods available in AUTHENTICATED_USER.


    # Summary


    This chapter covered the basics of Zope''s security system and management using
    roles and permissions. You have learned about the various objects and attributes
    Zope uses for security and how to affect them through the management screen and
    through DTML. Chapter 7 will look at roles and permissions in more depth.'
  merge: -1
