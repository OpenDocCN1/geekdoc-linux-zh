    #  6.1.4.1 Acquire permission settings?


    The right-hand columns in the permissions list define the roles for the current
    folder. When the Acquire permissions checkbox is checked (the default, shown in
    6.2), acquisition is active for the relevant permission, and the current folder
    acquires its permission and role settings from the next highest folder.


    If Acquire permission settings? is active in that next highest folder, that folder
    acquires the settings from the one above it and so on, up the hierarchy to the
    root folder. The permissions set for a folder (or folderish object) can spread
    quite far, depending on how extensively the setting Acquire permission settings
    is activated in the object hierarchy.


    Acquisition is more complicated than this, however. if you look at the roles in
    the Security screen (Figure 6-3), you see checkboxes beneath them as well. These
    checkboxes allow Zone to manage permissions among roles differently from their
    subordinate managers.


    ![](img/43a28cce5475b2f487bf455365567fb6_132_0.png)


    Figure 6-3: Security screen for an activated folder


    Users, Roles, and Security 115'
