    # 12.3.4 Installing the Database Adapter ZMySQLDA


    Before Zope can communicate with the myDB database, you must connect to the MySQL
    server using a database adapter, which is the interface between myDB and Zope.
    We will install the database adapter ZMySQLDA.

    Before you begin your installation, download the files listed in Table 12-1, which
    includes ZMySQLDA, the database adapter itself, and the latest MySQL drivers.

    To install ZMySQLDA under Linux, do the following:


    +   1. Unpack the ZMySQLDA archive in the top directory of Zope installation.
    For example, if you installed Zope in the directory Zope-2.3, extract the archive
    into that directory. Extracting the archive creates a folder named "Zope-Directory/lib/python/Products/ZMySQLDA."

    2. Unpack the MySQL drivers in the directory Zope-Directory/lib/python/Products.
    To do so, follow the installation instructions included with the product.

    3. Restart Zope to make the changes effect.


    # 12.3.5 Establishing a Z MySQL Connection in Zope


    > Create the database connection object in a folder where it can be acquired by
    any Z SQL methods you might create. The root folder is often a good choice.


    # 12.3.5.1 Database Connection String


