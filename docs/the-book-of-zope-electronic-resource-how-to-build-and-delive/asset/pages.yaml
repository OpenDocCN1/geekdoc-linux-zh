    <html>

    <head><title>document2</title></head>

    <body bgcolor="#FFFFFF">


    <h2>document2</h2>

    <p>

    This is the incred Document

    </p>

    <p><a href="http://www.zipe.org/Credits"

    target="_top"><img src="http://localhost:8080/p_/ZopeButton

    width="115" height="50" border="0" alt="Powered by Zope" /></a>

    </p>


    </body>

    </html>

    ```


    Figure 4-3: HTML source code of a DTML document


    # ## 4.1.2 Variables


    Zope regards nearly things as objects, including methods, functions, documents,
    and so on. These objects can also act as variables.

    A variable in the traditional sense consists of an indicator with a changeable
    value. For example, in the expression


    ```

    x = a + b

    ```


    The value of x depends on a and b. Zope variables act very much the same way.
    Like a and b in the expression above, the value of a Zope object depends on the
    time of day, which is automatically determined by the Zope system.


    > > NOTE

    > ------------------------------------------------------------

    > In the following discussion, all references to variables refer to Zope objects
    or attributes as such properties.


    # ## 4.1.3 The DTML Namespace


    A DTML namespace is an object that contains names. Each DTML object has a namespace
    containing all names available to the object and its associated data. A name,
    therefore, is the indicator by which a variable is referred to and that ultimately
    return a value. The DTML namespace is dynamic, meaning its content may vary; names
    are defined at one time and disappear later. When a variable is accessed, it is
    referred to by its name in the namespace. Names are case sensitive, so be sure
    they are correctly capitalized in your DTML code.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Names come to in the namespace of Zope''s automatic process of acquisition
    (see section 2.5) or by explicitly adding them with certain DTML constructs (the
    "With the Tag" and "The let Tag," sections 4.3.8 and 4.3.9). This creates an aggregate
    of the available object and attribute names called the namespace stack by moving
    upward toward the object hierarchy and adding the objects and attributes found
    along the way. The object lowest in the hierarchy (usually the executing object
    or its parent) is topmost in the namespace stack. When a variable is accessed,
    the namespace is searched from the top down until its name is found or the entire
    stack is checked.


    For example, suppose you had the Zope hierarchy shown in Figure 44-4.


    ![](img/43a28cce5475b2f487bf455365567fb6_81_0.png)


    Figure 44-4: Example of a Zope hierarchy


    When the DTML document index_html contained in the folder Folder1 is executed,
    its namespace stack would consist of the following sets of objects in order, shown
    in Figure 4-5.


    # 4.2 DTML Syntax


    The DTML programming language is intended to be easy to learn, and if you are
    familiar with HTML, you should soon become proficient in it. Zope supports several
    types of DTML syntax, the most common of which is similar to HTML.


    Like HTML, DTML tags are enclosed within angle brackets. The opening bracket is
    followed by dtml- as in `<dtml ...>`, and the space between the brackets contains
    the name of the tag.


    DTML tags can have one, several, or no attributes. The value of an attribute (the
    value can be optional) is enclosed within quotation marks after the equals (=)
    sign. If the value assigned to an attribute does not contain blank spaces, tabs,
    line break characters, or double quotation marks, it need not be enclosed in quotation
    marks.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '```

    index_html

    another_page

    Folder 1

    acl_users

    standard_error_message

    standard_html_header

    standard_html_footer

    /(Raat Folder)

    ```


    Figure 4-5: The namespace stack of the hierarchy in Figure 4-4


    > > It is generally considered good practice to surround all attribute values
    with quotation marks in DTML unless you have a specific reason not to, because
    unquoted values are sometimes treated differently by certain DTML tags, such as
    dtml-let.


    The resulting structure is


    ```

    <dtml-Tagname Attribute="Value" Attribute2="value" ...>

    ```


    For example, the following code displays in uppercase letters the name of the
    user accessing the document containing this line.


    ```

    <dtml-var name="AUTHENTICATED USER" capitalize>

    ```


    In this example, the first attribute, called the name attribute, is assigned the
    variable AUTHENTICATED_USER as its value. The second attribute, capitalize (which
    is responsible for displaying the username with its first letter capitalized),
    requires no value and as a result has no value assigned to it.


    # 4.2.1 Empty and Non-Empty Tags


    The example above is known as an empty tag because it stands alone; it encloses
    no text between itself and an end tag. Non-empty DTML tags (also known as container
    block tags) contain a tag body between start and end tags.


    The start tag (Line 1) follows the attribute structure described above. The end
    tag (Line 3) is similar except that it contains no attributes and the opening-angle
    bracket is followed by a forward slash:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '```

    1: <dt-TagName Attribute="Value1" Attribute="Value2" ...>

    2: DTML Tag Body

    3: </dt-TagName>

    ```


    The tag body (Line 2) contains text, HTML instructions, or additional DTML tags.
    If the tag, used to formulate a simple if-then-else construction, is an example-empty
    tag, as follows:


    ```

    1: <dt-if expr="1<2">

    2: 2 > 1<br>

    3: <h2>Two is always greater than 1<</h2>

    4: </dt-if>

    ```


    Here, the expression in the start tag (Line 1), 1<2 (which is obviously true)
    is evaluated and the content of the tag body is output. The end tag (Line 4) limits
    the tag body.


    # 4.2.2 Old DTML Syntax


    If you use DTML a lot, you will frequently encounter older versions of DTML tag
    syntax. These older syntaxes continue to work in current versions of Zope, but
    are generally avoided in favor of the <dt-TagName> syntax illustrated above. Let''s
    take a look at two of them, just in you come across some of them.


    # 4.2.2.1 Syntax from Zope Version 1.x


    The example given in section 4.2, which outputs the name of the user currently
    logged on, would look like this using Zope 1.x syntax (also known as “server-side
    include” syntax):


    ```

    <!--#var name="AUTHENTICATED_USER" capitalize ->

    ```


    This syntax follows the following form:


    ```

    <!--#TagName Attribute="Value1" Attribute="Value2" ...>

    <!--#TagName-->

    ```


    # 4.2.2.2 Python String-Format Syntax from Zope 1.x


    This format derives from the Python string formatting syntax used to dynamically
    create text strings in Python programs.


    ```

    %(TagName Attribute="Value1" Attribute="Value2")s

    ```'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 4.2.3 Abbreviating Attributes


    Two special attributes, name and expr, can be assigned to virtually any HTML tag.
    There is a standard way to abbreviate each. For example, we could abbreviate the
    use of name in our earlier example—which was shown as


    ```

    <html-var name="AUTHENTICATED_USER" capitalize>

    ```


    to


    ```

    <html-var AUTHENTICATED_USER capitalize>

    ```


    To use the abbreviated form, omit the name attribute label, the equals sign, and
    the quotation marks. The first piece of information in the tag is automatically
    regarded as the name''s value. The expr attribute (used to evaluate complex expressions)
    takes a similar approach, as shown below:


    ```

    <html-var expr="1+1">

    ```


    is abbreviated


    ```

    <html-var "1+1">

    ```


    NOTE An expression must always be contained within quotation marks.


    Because the quotation marks are retained, the term between the quotation marks
    is regarded as an expression of the expr attribute.


    NOTE Although it is common to see these abbreviated notations for name and expr,
    they are discouraged in favor of the more explicit forms. Although choosing not
    to abbreviate requires more typing, the resulting code is easier to read and debug.


    # 4.3 Using DTML Tags, Variables, and Attributes


    The following sections will show you how to use the various DTML tags, variables,
    and attributes by giving explanations and concrete examples. Appendix A contains
    detailed tables of the different attributes used with each tag.


    # 4.3.1 The var Tag


    The var tag inserts the textual representation of variable data into your document''s
    or method''s output. As a result, text is generated even if you use var to call
    other non-textual attributes, such as image objects.


    For example, imagine that you have an image stored in Zope called CompanyLogo.
    You want this image to appear somewhere in your document. To do so, you could
    use the following instruction:'
  merge: -1
  img_proc: true
- pgno: 85
  md: '```

    <html-var name="CompanyLogo">

    ```


    and Zope would insert source text like the following:


    ```

    <img src="http://localhost:8080/CompanyLogo" width="200" height="75" border="0"
    alt="My Company Title">

    ```


    You should recognize this generated text as standard HTML. The user''s browser
    would process this HTML and display the Company image at the appropriate location
    when the document is viewed.


    # 4.3.1.1 var Tag Attributes


    Table 4-1 shows the most important attributes along with examples and the corresponding
    screen output. See Appendix A for a complete list. Asterisk attributes require
    a value.


    # 4.3.1.2 The name Attribute


    The name attribute is used to obtain variable data from the DTML namespace. When
    this attribute is used, a variable is looked up by name and executed if it a callable
    object (such as a DTML method); its value is passed to the relevant tag. In this
    way, the system can search for a graphic object and then display it, as shown
    again with the CompanyLogo name attribute:


    ```

    <html-var name="CompanyLogo">

    ```


    The following rules are imposed on names when they are used to access variable
    data using the name attribute:


    +   1. They cannot begin with an underscore character (_).


    +   2. They cannot contain characters that are significant to URLs, such as /,
    &, :,; and so on.


    # 4.3.1.3 The expr attr Attribute


    The expr attr is used to evaluate complex expressions. The attribute value-that
    is, the expression to be evaluated—must be enclosed in double quotation. (See
    Chapter 9 for a brief introduction to the expression syntax.)


    # 4.3.1.4 The fmt Attribute


    The abbreviation fmt stands for format; text is formatted using the fmt attribute,
    meaning that the fmt attribute controls the appearance output of text generated
    by a tag. You can use standard, special, and C-style formats defined by the fmt
    attribute, as described in sections 4.3.1.5 and 4.3.1.6.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Table 4-1: Attributes for the var Tag


    | Attribute | Function | Example | Output |

    | --- | --- | --- | --- |

    | null | Defines a string that will be output instead of "null". If the value
    for null is omitted, no text is inserted. | null="The result returns an empty
    list." | The result returns empty list. |

    | missing | Defines a string to be inserted if the variable referred by name is
    not in the namespace. If the value for missing is omitted, no text is inserted.
    | missing = "Not found" | Not found |

    | lower | Changes all letters to lowercase. | title_or_id lower | testpage |

    | upper | Converts all letters to uppercase. | title_or_id upper | TESTPAGE |

    | capitalize | Capitalizes the first letter. | AUTHENTICATED USER capitalize |
    Manager |

    | html_quote | Characters significant in HTML are replaced with appropriate HTML
    entities. | teststring html_quote (teststring="<") | &lt; |

    | url_quote | Characters not legal in URLs are properly escaped for insertion
    into values. | teststring url_quote (teststring="<") | %3c |

    | size | Displays only the specified number of characters from a string. | teststring
    size=6 (teststring="How are you?") | How''re... |

    | elc | Specifies a string that is inserted instead of the omitted characters
    (used with size). | teststring size=6 etc="" (teststring="How are you?") | How''re
    — |

    | name* | See The "name Attribute" (section 4.3.1.2). | | |

    | expr* | See The "expr Attribute" (section 4.3.1.3). | | |

    | fmt* | See The "fmt Attribute" (section 4.3.1.4). | | |'
