- pgno: 339
  md: '# Summary


    As a rule, the debugging process follows these steps:


    +   1. Determine the type of error that occurred (syntactic error, semantic error,
    and so on) and the circumstances that triggered it.


    +   2. Find the source of the error (DTML document, DTML method, ZClass, Python
    file, and so on).


    +   3. Locate the error (which line, expression, variable, and so on).


    +   4. Correct the error and test.


    You have now learned about the different types of errors you may encounter in
    your work with Zope. These include errors that can occur when you start the Zope
    server that are the result of errors in the Python code as well as errors that
    can occur when you work directly in the Zope management screen.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 17


    # EXTERNAL DATA ACCESS


    ![](img/43a28cce5475b2f487bf455365567fb6_340_0.png)


    You can choose from a number of ways to place data on the Zope server and take
    data from it to store on a different storage device. This chapter will will look
    at three of these ways and their associated programs.


    # 17.1 FTP


    File Transfer Protocol (FTP) is one way in which you can transfer data onto the
    Zope server. To access your Zope server via FTP, you will need an FTP client program.
    A simple one (that is included with both Windows and Unix) is the command-line
    FTP program. Here is a quick example of how to connect to a Zope server from the
    command line using Linux:


    ```

    % ftp localhost 8021

    ```


    Begin by executing the FTP command as above, supplying it with the host-name (in
    this case the local machine) and the port number (8021) by default for Zope. If
    you do not specify a port number, the FTP program uses port 21 (the standard FTP
    port).'
  merge: -1
  img_proc: true
- pgno: 341
