    # ### 11.5.3 Expanding the Vocabulary: The insert() and manage_insert() Methods


    You can expand a vocabulary using the insert() and manage_insert() methods.


    # ### 11.5.3.1 The insert() Method


    You can enter new words into a vocabulary yourself using the vocabulary object''s
    insert() method. Using this method, you can, for example, insert the word "catalog"
    using DTMAL (assuming the vocabulary has the id Vocabulary):


    ```

    <xml-call "Vocabulary.insert(''Catalog'')">

    ```


    # ### 11.5.3.2 The manage_insert() Method


    You can also enter new words in a vocabulary with the manage_insert() method,
    using the URL of the vocabulary, as follows:


    ```

    http://localhost:8080/Vocabulary/manage_insert?word=Catalog

    ```


    As you can see, the parameter shown for this method—that is, the word to added
    is named "word". If your addition is actually several words and you want to include
    it in the vocabulary using the URL, enter it like this:


    ```

    http://localhost:8080/Vocabulary/manage_insert?word=My+Catalog

    ```


    To insert new words using a form, insert the input value using the url_quote_plus
    option of dtmlvar (see Appendix A).'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 11.5.4 ZCatalog with Special Characters


    The ZCatalog supplied by Zope cannot index words with foreign characters correctly—for
    example, German umlauts or Japanese Kanji characters—to enable searches for them.
    However, there are several replacement ZCatalog splitters to handling foreign
    character sets.


    One such patch is the Voodoo Kludge Splitter, which lets you map special characters
    so that they are indexed properly in ZCatalog vocabulary. You can download this
    product at:


    ```

    http://www.zope.org/Members/kslee/VoodookludgeSplitter

    ```


    > Unfortunately this Splitter is slower than the one delivered with Zope and,
    as a result, updates take longer. You should, therefore, consider whether you
    want improved speed or special characters.


    # Summary


    This chapter has explored how to use ZCatalogs to index and search Z objects and
    examined the strengths and weaknesses of ZCatalog and how to use it effectively
    and efficiently. Armed with this knowledge, you should be able to construct search
    engines for your Zope website to facilitate a site search or more specific object
    query functionality.


    Chapter 12 will explore how to connect Zope to external relational database systems.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 12


    # ZOPE AND MYSQL


    ![](img/43a28cce5475b2f487bf455365567fb6_246_0.png)


    Most complex Internet applications have a database backend, and Zope is no may
    exception: The ZODB (Zope object database) is at your disposal.


    However, you may have certain applications that house data more efficiently in
    a traditional relational database, or you may use an existing database that needs
    to be connected to Zope. How can you decide which is best?


    # 12.1 ZODB or External Database?


    Consider the advantages of using an external SQL database to store your application''s
    data:


    +   - The relational database model easily allows for complex data relationships
    and rules that would be more difficult to create in the ZODB.

    - Storage and retrieval of large numbers of small data quanta are fast and efficient.
    Many databases quickly and efficiently query tables containing millions of records.

    - You gain the enormous flexibility of SQL as a query language and can leverage
    the knowledge of other experienced database programmers who may not know Zope.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   * You can place Zope and the database server on separate computers for
    enhanced performance and security.


    +   * Programs other than Zope will be able to directly access data in the database.


    +   * You can access and manipulate existing databases in your organization through
    Zope without "reinventing the wheel."


    +   * You can more readily separate the data from the code in your application.


    Consider the disadvantages of using an external database:


    +   * Having a separate database is more complex and requires more planning, development
    time, and maintenance.


    +   * Additional database software and/or hardware may be more costly.


    +   * Hierarchical data models do not always map well onto relational databases,
    whereas they map directly to the ZODB.


    +   * The storage and retrieval of large data quanta (such as file or image data)
    are often less efficient in a database than in the ZODB.


    +   * You must be able to program and debug at both the database level and the
    Zope level.


    +   * You lose the versioning and capabilities that you would have with data stored
    in the ZODB.


    +   * You may need to create additional interfaces through Zope to administer
    your database.


    For each application, you will need to weigh whether the ZODB or an external database
    is the right option. If you find that you need to use an external database system
    in your application, your first task will be to learn how to connect it to Zope.


    # 12.2 RDBMS


    Relational databases are the industry standard to store and retrieve large quantities
    of tabular data. These systems consist of server programs, which are database
    backends (or engines) that respond to commands from client programs, including
    Zope. These commands are given in the SQL language, an accepted standard database
    query language.


    There are essentially two types of relational database management system (RDBMS):
    commercial and open source. Following are some of the most important examples
    of each:


    # Commercial RDBMS


    | Oracle | http://www.oracle.com | A widely used, robust commerciol database.
    |

    | Sybase | http://www.sybase.com | A successful commerciol database platform.
    |


    # Open Source RDBMS


    | MySQL | http://www.mysql.com | A fast and increasingly sophisticated open source
    database engine. Commonly used for web applications because of its query performance.
    |'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Open Source RDBMS (cont''d.)


    | PostgreSQL | http://www.postgresql.org |

    |---|---|


    Perhaps the most sophisticated open-source database system. Tailored toward sophisticated
    multi-user applications. Better suited for write-intensive applications than MySQL.


    | Interbase | http://www.interbase.com |

    |---|---|


    A robust open source database from Barland. As widely used as MySQL and PostgreSQL,
    but growing in popularity.


    | ODBC | http://www.adbc.com |

    |---|---|


    Nat a database itself, but standard interface that allows you to connect to nearly
    any database (such as MS SQL Server or even MS Access).


    This chapter will not attempt to turn you into a database or SQL specialist. In
    fact, if you are like web programmers, you will probably leave the relational
    modeling and the database programming to someone else. Instead, we will focus
    on how to connect your programmed database to Zope using the open-source database
    MySQL as an example. MySQL is widely used for web applications because it is simple
    and its high performance is well suited to the web.


    # 12.3 The MySQL Database


    Before attempting to work with MySQL under Zope, be sure that you have a MySQL
    server (version 3.22.32 or higher) running on your computer. (Please refer to
    the documentation included with MySQL to install and run the database server.)
    Once it is running, you will log in to the database server and create a data-base
    for use in Zope.


    # 12.3.1 Starting MySQL Monitor


    The MySQL monitor is a command line program that allows you to access and administer
    MySQL databases. (DOS prompt for Windows users), using the following command to
    run the MySQL monitor:


    ```

    mysql -h host -u user -p

    Enter password: ********

    ```


    You''ll need to enter the host parameter if the MySQL server is running on a different
    computer. For the user parameter, enter the username you use on the MySQL server.
    Once you have logged in, the following text appears:'
  merge: -1
  img_proc: true
