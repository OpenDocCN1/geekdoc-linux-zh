    \ method you can add or delete roles using 'Add role' or 'Delete role' for submit.\
    \ To use this method, first specify a role, such as Role2, in the REQUEST under\
    \ the variable roler.\n\n```\n<xml-call expr=\"REQUEST.set('role', 'Role2')\"\
    >\n```\n\nOnce you have specified a role you can call the method manage_defined_roles\
    \ in both forms:\n\n```\n<xml-call expr=\"manage_defined_roles('Add role', REQUEST)'>\n\
    ```\n\nor\n\n```\n<xml-call expr=\"manage_defined_roles('Delete role', REQUEST)\"\
    >\n```\n\n# manage_delete_LocalRoles(userids, REQUEST)\n\nThis method allows you\
    \ to delete local roles you have set. It requires a list of users (userids) and\
    \ REQUEST as arguments.\n\n# permission_settings()\n\nThis method returns all\
    \ permissions for an object in the form of a list of dictionaries. Each element\
    \ has the following form:\n\n```\n{\n  'acquire': 'CHECKED',\n  'roles': [ {'name':\
    \ 'por0', 'checked': ''},\\n    {'name': 'p01', 'checked': ''},\\n    {'name':\
    \ 'p02', 'checked': 'CHECKED'},\n    {'name': 'p03', 'checked': ''} ],\\n\\n \
    \ 'name': 'Access contents information'\n}\n```\n\n**acquire** 'CHECKED' If Acquire\
    \ permission settings? is octiv for the relevant permission, otherwise on empty\
    \ string is returned.\n\n**roles** Contains list of dictionaries as a value. The\
    \ value for 'name' is a combination of letters and numbers (porb). 'p00', for\
    \ example, indicates the zero permission (p=permission) of the zero role (r=role).\
    \ (Zero is used because Python starts counting from zero.) If the value of 'checked'\
