    ```

    2000/09/30

    2000/09/30 15:00

    2000/09/30 15:00:38.00 GMT+2

    ```


    # 11.2.3.6 where the roles:


    This criterion and the next one (have permission) belong together. Here you can
    select from the list of roles assigned to the permission in the have permission
    list. The ZCatalog searches for objects whose selected roles have the relevant
    permission.


    # 11.2.3.7 have permission:


    From this list you can select a permission that the roles in the where roles list
    must have. The ZCatalog finds and catalogs all objects whose roles have the specified
    permission.


    Figure 11-6 shows an example of a completed Find Objects form. In this example,
    we are searching for all objects (All types) that have the id index_html and that
    contain <htmlvar title_or_id>. The objects must have been edited after 16:50 on
    August 28, 2000 (2000/08/28 16:50:00.00). In addition, the objects must have the
    permission Change DTML Methods for the Anonymous role.


    # 11.2.4 Metadata Screen


    ZCatalog is a cache of attribute values (from properties and methods) of the cataloged
    objects, created when they were cataloged. Use the Metadata screen (see Figure
    11-7) to manage the metadata for the cataloged objects. When the ZCatalog searches
    for index, Zone saves all attributes of the cataloged objects to a table. The
    values are saved only if the object''s attribute name exactly matches the metadata
    element name in this screen.


    Metadata will optimize the performance of ZCatalog queries when many results are
    returned, because it allows you to work with the cached attribute values of many
    objects rather than looking up or deriving these values individually when generating
    a report. Use metadata sparsely, however, because it will greatly'
  merge: -1
  img_proc: true
- pgno: 228
