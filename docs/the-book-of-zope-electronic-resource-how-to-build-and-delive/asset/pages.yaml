  md: 'You use views to manage an object''s instances. A view is a management screen
    defined in ZClass to manage its instances in Zope. Each view creates a tab in
    the management screen that executes an instance method of the object when you
    click on it. (Sections 9.3.5 to 9.3.8 provide more information on property sheets
    and properties as well as views.)

    nThe property sheets you define in ZClass describe the schema of the data stored
    in the instances of the class. Property sheets also provide a convenient user-interface
    that you can use to examine and modify the data contained in the ZClass instances.


    # 9.3 Creating a ZClass


    Now that you have a sense of the stages involved in creating a ZClass, let''s
    look at how to create a product and then how to create a ZClass in this product.
    In this scenario, you are the owner of an online bookstore, and you need to track
    your business and inventory in several ways.


    # 9.3.1 Creating a Product


    First we will create a small Zone product called "Sales" that will contain a ZClass
    we. To create Sales, follow these steps:


    +   1. Click ControlPanel and then click Product Management. A list of currently
    available products appears.

    2. Click Add Product to add a new product, as shown in Figure 9-5.


    ![](img/43a28cce5475b2f487bf455365567fb6_178_0.png)


    Figure 9-5: Management screen for creating a product


    +   3. In the id field, enter Sales. Make sure that the name you enter is not
    already in the list of currently available products.

    4. In the Title field, enter Sale of Books. For practical reasons, always enter
    a short, precise description of the ZClass in the Title field, even though this
    field is not compulsory.

    5. Click Generate to create your product. The product Sales should now appear
    in the list of currently available products, as shown in Figure 9-6.'
