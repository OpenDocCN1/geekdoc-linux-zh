- pgno: 320
  md: "To use login_html for this purpose, we first deactivate acquisition (Acquire\
    \ permission settings?) for its view, so that anonymous users will be forced to\
    \ authenticate. We then activate the permission for the User role that is allowed\
    \ to use the method. (For a more detailed explanation of Zope authentication,\
    \ please refer to Chapter 6.)\n\nThis way to set permissions (other than using\
    \ setRole()), although a bit complicated, is a good example of how to manipulate\
    \ permissions programmatically:\n\n```\nold_permissions = self.permission_settings()\n\
    new_permissions = []\npermissions_for_WebsiteUsers = []\nfor item in old_permissions:\n\
    \    if item['name'] == 'View':\n        permissions_for_WebsiteUsers.append(item['name'])\n\
    \    else:\n        new_permissions.append(item['name'])\ninstance.login_html.manage_acquiredPermissions(new_permissions)\n\
    instance.login_html.manage_role('WebsiteUser', permissions_for_WebsiteUsers)\n\
    ```\n\nFor the permission assignments on the Website instance, we use the assignment\
    \ of permissions for the folder in which the instance is created. We get these\
    \ assignments by calling the method permission_settings(). (See the end of Chapter\
    \ 8 for a detailed description of this method.)\n\nThe permission_settings() provides\
    \ a dictionary with all permissions and includes the roles assigned these permissions.\
    \ (Remember here that we receive a list of all available permissions.) Each dictionary\
    \ element is processed, and we use the name keyword to obtain the name of the\
    \ corresponding permissions. Within the loop we determine which of lists the permission\
    \ belongs to and append its name to the appropriate one. (One list is later used\
    \ to activate the permissions for the WebsiteUser role; the other is needed to\
    \ deactivate permission settings? for the appropriate permissions.)\n\nTo decide\
    \ whether a permission belongs to the Activated or Deactivated list, you must\
    \ know that the method responsible for activating and deactivating Acquire permission\
    \ settings (manage_acquiredPermissions()) expects a list of permissions for which\
    \ the corresponding checkbox is deactivated, because activated is the default\
    \ for Acquire permission settings? In Zope. contrast, the method that manages\
    \ the permissions for a specific role (manage_role()) awaits a list of the permissions\
    \ to be activated.\n\nOnce the loop has finished and both lists have been created,\
    \ we can start setting the permissions. Because the permissions must be special\
    \ for the DTML method login_html, the two methods manage_acquiredPermissions()\
    \ and manage_role() must, of course, be called for this object.\n\nIf you see\
    \ the Security screen for this DTML method after you create the instance, the\
    \ permissions assignments should look like the one shown in Figure 15-5. In login_html\
    \ in our example, we only need to change the View permission."
