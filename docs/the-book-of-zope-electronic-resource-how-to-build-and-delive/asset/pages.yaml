    #  14.6 Calling Python Scripts from DTML


    Python scripts can be called with any DTML tag that uses the name or expr attributes.
    Normally, you will use dtml-var or dtml-call to execute a Python script: dtml-var
    if the script returns a value to be inserted, and dtml-call if no insertion is
    desired or no value is returned by the script. If the Python script has no parameters
    in its parameter list you can call it using name="..." notation as shown here:


    ```

    <dtml-var name="pythonScript">

    ```'
