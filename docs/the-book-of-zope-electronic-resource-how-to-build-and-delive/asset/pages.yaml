- pgno: 163
  md: 'The values o and b indicate the permission/role as it stands in the order of
    the security screen for the object; permissions from top to bottom and roles from
    left to right.


    name the name of the permission. From here you can read the permission corresponding
    to the value o porb thus: Access contents information would be the zero permission.


    # permissionOfRole(role):


    This method requires a role as a transfer argument and returns all activated permissions
    for this role in a list of dictionaries.


    ```

    [ {''selected'': ''SELECTED'', ''name'': ''Access contents information''}, ...
    ]

    ```


    Each dictionary has the keywords ''selected'' and ''name''. The keyword ''name''
    contains the name of the permission as a value. If the value of the ''select''
    keyword is ''SELECTED'', the permission is activated for the role.


    # possible_permissions():


    This method returns a list of all permissions present in Zope even if you use
    them on a non-folder object.


    # rolesOfPermission(permission):


    This method returns a list of dictionaries you can use to determine the permission
    roles.


    ```

    [ {''selected'': '''', ''name'': ''Anonymous''}, {''selected'': '''', ''name'':
    ''Friend''}, {''selected'': ''SELECTED'', ''name'': ''Manager''}, {''selected'':
    '''', ''name'': ''Owner''} ]

    ```


    If the ''selected'' keyword has the value ''SELECTED'', the role that appears
    ''name'' has the permission specified by the name.


    # valid_roles():


    Using valid_roles() you receive a list of the roles permitted as local roles.
    In other words, roles that can be assigned to users as local roles.


    # validate_roles(roles):


    validate_roles(roles) requires a list of roles as a transfer argument and returns
    a true value if all roles in the list are valid. The method returns a false value
    if at least one of the roles in the list is invalid.


    # undefined_roles():


    The method returns a list of roles defined in Zope by any for the current object.
    Roles defined in other objects (for example, the superordinate folder) do not
    appear in the list.'
