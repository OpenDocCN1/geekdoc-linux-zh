    3-4)


    ![](img/43a28cce5475b2f487bf455365567fb6_59_0.png)


    Figure 3-4: View of the edited file index_html


    # 3.1.3 The View Tab


    The View tab, available on any object that can be viewed through a web browser,
    lets you preview any modifications you make to an object. When you click the View
    tab on a nonfolderish object such as a DTML method, the edited object is displayed
    just as it would be to a visitor to the web page.


    When you click the View tab on the Contents screen of a folderish object, Zope
    attempts to display index_html. If index_html is not found in the current folder,
    Zope displays the next available index_html object, created by the acquisition
    rules. The acquisitions rules tell Zope to look in the parent folder if an object
    is not in the current one; if the object is not found there, to continue searching
    the upper folder. As a result, if the index_html is contained only in the Zope
    root folder, the View tab will show it in every subfolder.


    # 3.1.4 The Ownership Tab


    All Zope objects, with the exception of the Control Panel and the root folder,
    can be assigned to an owner using the Ownership tab. When you create an object,
    you can become its owner.


    The Ownership screen tells whether an object has an owner and offers an opportunity
    to make ownership permissions for a user either explicit (set directly on the
    object) or implicit (based on the owner of the parent folder). For more information,
    see section 6.1.2.


    # 3.1.5 The History Tab


    The History tab appears only on the Edit screen of DTML documents and methods
    and allows you to follow any changes made to these objects. When a user edits
    a DTML method or document and then saves the changed object by clicking Save'
  merge: -1
  img_proc: true
- pgno: 60
