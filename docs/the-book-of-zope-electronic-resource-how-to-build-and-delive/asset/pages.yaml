  md: 'Let''s take a look at the code for admin.html.

    First, a table is opened and a row of column headers is created (Lines 2–13).

    Then Line 14 is used to loop through the Books in the folder.


    Folderish (with an ObjectManager base class) have the built-in method objectValues,
    which returns a list of the objects contained in the folder.

    Because the admin_html method is not folderish (and therefore lacks the objectValues
    method), it acquires the method from the folder it is called in. To specify a
    method, we could use dot notation in the expression:


    ```

    expr="books.objectValues([''Book''])"

    ```


    DTML documents act differently from DTML methods in this regard. DTML documents
    do have a method objectValues, which always returns an empty list. If adminHtml
    were a DTML document, we would need to write the expression using the dot notation
    as above.


    An optional argument, which filters the meta types of the objects returned, can
    be passed to objectValues. This argument is a list of the meta type strings for
    the desired objects. If the argument is omitted, all objects in the folder are
    returned. In our application, we are only interested in objects with the meta
    type Book, so we pass this value to the method. Putting it in square brackets
    makes it a list with a single item; in fact, when specifying a single meta type
    as, a simple string value can be passed and the square brackets omitted. The dml-tag
    is then used to iterate through the Book instances returned by objectValues.


    Once inside the loop (lines 15–25), the values from each Book instance are inserted
    into a new row. In the last column of the table (Lines 26–35), two forms are inserted
    to create the Edit Book and Delete Book action buttons. The following code on
    Lines 26 and 27 requires explanation:


    ```

    <dtmfORM ACTION="dtml-var

    name="sequence-item" url=/EditForm.html">

    ```


    In this form, the action is set to the URL of the Book instance followed by /EditForm.html
    (a DTML method we will define in the next section).


    The URL attribute of dml-var inserts the full absolute URL of object. By calling
    it after the Book instance at the top of the namespace stack, allowing easy access
    (via acquisition) to the Book properties from within the EditForm_html method.
    This is a powerful technique that takes advantage of the fact that DTML methods
    can act like methods of any object you call them on. In this case we are using
    the EditForm_html method on a book instance. This method will display the book''s
    properties in a form that can be edited.


    The second form (Line 30) calls another DTML method, DeleteConfirm_html, which
    we define below. It deletes a Book object when we pass its id using a hidden form
