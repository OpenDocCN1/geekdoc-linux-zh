- pgno: 222
  md: '# # 11


    # ## THE ZCatalog


    ![](img/43a28cce5475b2f487bf455365567fb6_222_0.png)


    You use the ZCatalog product, part of the standard Zope installation, to arrange
    objects in Zope according to your own indexes.

    ZCatalogs allow you to index and then search for objects based on the values of
    the indexed attributes of those objects. These attributes can be the content of
    documents, the values of properties, even the values returned by Python scripts
    and methods. In this chapter, we look at how to create a new ZCatalog and examine
    the individual components of a ZCatalog.


    # ### 11.1 Creating a ZCatalog


    To create a new ZCatalog, open the folder’s add menu and select ZCatalog. The
    screen shown in Figure 11-1 appears.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Add ZCatalog


    ![](img/43a28cce5475b2f487bf455365567fb6_223_0.png)


    As with all Zope objects, you must specify an id for the ZCatalog object; you
    may enter a title if you wish.


    # 11.1.1 Choosing a Vocabulary


    A vocabulary is a list of searchable words culled from objects cataloged in the
    ZCatalog. Objects are indexed in the ZCatalog using a TextIndex (see section 11.2.5.1),
    the text from the object is split into words and stored in the vocabulary in a
    manner that allows the catalog to quickly find which words are contained in which
    objects. When you create a ZCatalog, you may select an existing vocabulary or
    create a new one (see section 11.5, “The Vocabulary”). To do the latter, select
    the Create for me option to automatically create a vocabulary object inside your
    ZCatalog to store the word list.


    This option allows you to share a vocabulary among several ZCatalogs—an important
    feature if you have several ZCatalogs that contain TextIndexes, because it is
    more efficient for them to share a single vocabulary than for each one. To share
    a vocabulary between ZCatalogs, create a vocabulary object (using the add menu)
    in a folder that''s at or above the location of your ZCatalogs in the Zope hierarchy;
    then choose this vocabulary when you create each ZCatalog.


    # 11.1.2 Globbing


    If you create a vocabulary independently of a ZCatalog, you have the option to
    enable globbing, which allows you to use wildcard characters (such as asterisks
    (*) and question marks (?) in your ZCatalog searches to match partial words. Generally,
    you will want to enable globbing to give you greater search capabilities, but
    you can save memory and disk space by disabling it.


    > Vocabularies created by ZCatalog automatically have globbing enabled.


    # 11.2 The ZCatalog Screens


    You are probably already familiar with several of the ZCatalog''s tabs common
    to other objects (shown in Figure 11-2), including Content, Properties, View,
    Find, Security, Undo, and Ownership. But Figure 11-2 also shows five new tabs:
    Catalog, Indexes, Metadata, Find Objects, and Advanced—which will be explained
    in sections 11.2.2 through 11.2.6.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Figure 11-2: The tab bar in a ZCatalog


    # 11.2.1 Contents Screen


    Because ZCatalogs are folder objects, you can create objects in a ZCatalog Contents
    screen (Figure 11-3). For example, you could store objects to be cataloged by
    the ZCatalog or the ZCatalog search and report pages (see section 11.3, "Search
    Interface").


    > Cataloged objects do not need to be physically contained in the ZCatalog. In
    fact, they can be scattered about many different folders throughout the Zope hierarchy
    (which is often the case). This ability to bring together and search objects throughout
    your Zope application is one of the ZCatalog''s greatest strengths.


    ![](img/43a28cce5475b2f487bf455365567fb6_224_0.png)


    Figure 11-3: A ZCatalog Contents screen


    # 11.2.2 The Catalog Screen


    The Catalog management screen, shown in Figure 11-4, contains a list of all objects
    currently cataloged in the ZCatalog. You can determine which objects are cataloged
    by specifying the appropriate criteria on the Find Objects screen. By default,
    it will find and catalog all objects at or below the ZCatalog object.


    You may choose to manually catalog objects using Find Objects or to allow instances
    of ZClasses that have the base class CatalogAware to catalog themselves automatically
    when they are created. These objects are called catalog aware objects.'
  merge: -1
  img_proc: true
