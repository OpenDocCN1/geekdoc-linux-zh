    # 6.3.2 Problems When Creating Users in HTML


    Table 6-1 shows several reasons that an attempt to create a new user might not
    work.


    # Table 6-1: Possible Problems with Creating Users


    | Problem | Result |

    |---|---|

    | A user with this name already exists. | The new user is not created; the existing
    user is not changed. |

    | Password and Confirm do not match. | The new user is not created. |

    | There is no User Folder in the current folder | The new user is created in the
    next highest User Folder with the id acl_users. |


    In each of these three cases, the manage_users call either does or does not work
    as desired. The problem is that no message is returned and, as a result, you do
    not notice that the user was not created. To solve this problem, create users
    with Zope''s Add User form (addUser.html) in the directory /lib/python/Access/Control/(html)
    so that error messages will be displayed if any of the problems above occur.


    You can change the layout of addUser.html to suit your own requirements, because
    as designed it works only in the Zope management screen. The ACTION in the Form
    tag of the HTML form in acl_users/manage_users must be changed because you will
    be creating a custom DTML method to create users not contained in the acl_users
    User Folder (User Folders can only contain User objects). The DTML method you
    create will call the Zope Folder''s built-in Python method manage_users.


    One problem with using the addUser.html form is, once the user has been added,
    the Contents view of the User Folder (acl_users) appears because manage_users()
    redirects the browser to this page. Visitors to the website as users with the
    role Friend are not authorized to access the Zope Management screen. If a visitor
    attempts to access the Contents view of the User Folder, Zope recognizes the current
    visitor as unauthorized and displays the login window.


    # 6.3.3 Changing Users in DTML


    You can use the command acl_users.manage_users() to change a user in much the
    same way as you would create a user. Following is an example of how to use DTML
    to see whether a user already exists in the current acl_users folder and, if,
    how to change that user:'
