    # ### 4.3.3 Client-Server Communication over the Web


    When you access a web page, a browser transmits an http request to the server.
    This request tells the server about the user, their browser, the computer it is
    running on, and the URL of the page being requested.


    The server replies to the browser with an http response. This response consists
    of information about the server and, if a document corresponding to the requested
    URL is found and is authorized be accessed, the data of the document requested.
    The response can also contain special headers that direct the browser to things
    like redirect, store a cookie, or expire data in its cache.


    Zone encapsulates the http request and response data into the REQUEST and RESPONSE
    objects, respectively. These objects are always available in the DTML namespace
    so that you can access their attribute values and methods. You use the REQUEST
    object to receive data about the user, URL, and data sent from a form or cookies
    from the client computer. You can also use REQUEST to store your temporary variables.


    # #### 4.3.3.1 The RESPONSE Object


    The RESPONSE object is used to communicate back to the client. You can use it
    to set headers Content-Type (the MIME format of the page data), or expire cookies,
    or redirect the browser to a different URL. Table 4-6 shows important attributes;
    see Appendix A for a complete list.


    Appendix A also lists CGI-defined Query variables and http status codes.


    # #### 4.3.3.2 The REQUEST Object


    The REQUEST object has a very important attribute: the set method, with which
    you can insert variables into the namespace that remain defined for the duration'
