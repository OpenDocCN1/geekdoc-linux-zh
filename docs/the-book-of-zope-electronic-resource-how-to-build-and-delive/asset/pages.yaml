- pgno: 99
  md: 'Conditions are checked one after other (Lines 1, 3, and 5) until one is fulfilled,
    at which point the instructions formulated within the tag are carried out. Once
    a condition is fulfilled, all subsequent tags are ignored. If no conditions are
    satisfied, no actions are carried out. Therefore, you should particular attention
    to the sequence in which you code the conditions.

    In the following example, we request the age of the current user (Line 1), then
    display a greeting appropriate to that person''s age (Lines 2 through 4), then
    grant or restrict access to the site (Lines 5 and 6). To do so, the value "age"
    is taken from an HTML form and checked:


    ```

    1: <dml-if expr="REQUEST.age >= 21">

    2: <h1>Welcome, </h1>

    3: You have unrestricted access to this site.

    4: <dml-elif expr="REQUEST.age >= 18">

    5: <h1>Welcome, </h1>

    6: We''re sorry . . but your access to this site has been restricted.

    7: </dml-if>

    ```


    (Remember that form values are put into the REQUEST object.)

    This example works by first checking whether the user is 21 years of old or older
    (Line 1); if not, a further check is carried out to determine whether the user
    is 18 years of age or older (Line 4). Depending on the result, the user is provided
    with either unrestricted or restricted access to the website.

    Let''s look at sequence in which the conditions are formulated in the tag are
    so important. If the first check determined whether the user is 18 or older, users
    over 21 would also be given restricted access only. The second condition would
    be ignored, and it would not be possible to carry out any further differentiation.

    The problem with this example is that users under 18 receive no message. To resolve
    this problem, we can add an else tag, as shown in this listing:


    ```

    1: <dml-if expr="REQUEST.age >= 21">

    2: <h1>Welcome, </h1>

    3: You have unrestricted access to this site.

    4: <dml-elif expr="REQUEST.age >= 18">

    5: <h1>Welcome, </h1>

    6: We''re sorry . . but your access to this site has been restricted.

    7: <dml-else>

    8: We''re sorry . . but we are not allowed to access this site.

    9: </dml-if>

    ```


    Now users under 18 receive a message as well as those over 18.

    Conditional operators that can be used in dml-if expressions are shown in Table
    4-9. The logical operators in Table 4-10 can be used to create complex conditional
    logic.'
