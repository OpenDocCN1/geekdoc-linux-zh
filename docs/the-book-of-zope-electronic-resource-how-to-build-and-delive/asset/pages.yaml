    Using this method, you can delete existing indexes. The method is called when
    you click the Delete button on the Indexes screen. The name parameter specifies
    a list of indexes to be deleted.


    catalog_object(self, obj, uid)

    This method is called by the manage_catalogObjects() method and causes a single
    object to be indexed. It can be called in DTML, because it does not redirect the
    browser to a specific page after execution.


