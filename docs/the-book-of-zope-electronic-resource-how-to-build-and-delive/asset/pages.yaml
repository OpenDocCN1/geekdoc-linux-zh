- pgno: 126
  md: 'You are currently working in version /Versiontest/Versiontest?


    | Type Name | Size | Last Modified |

    |---|---|---|

    | Update | | 2001-06-22 21:38 |

    | Update2 | | 2001-06-22 21:39 |

    | acl_users (User Folder) | | 2001-06-22 21:37 |

    | index_html | 1 Kb | 2001-06-22 21:37 |


    Figure 5-7: index_html is locked by Update2


    If you now view the index_html object (Figure 5-8), you see no changes. Your modifications
    will be visible only to general users when version''s changes have been saved.


    ![](img/43a28cce5475b2f487bf455365567fb6_126_0.png)


    Figure 5-8: Accessing index_html before saving the version


    +   1. On the Control Panel, use Version Management to apply the changes to both
    versions simultaneously.


    Notice on the Contents screen that the locks on the edited objects have been removed,
    and all users can see the changes you made while in the versions (Figure 5-9).


    ![](img/43a28cce5475b2f487bf455365567fb6_126_1.png)


    Figure 5-9: Accessing index_html after saving the version


    +   2. Finally, delete both versions. Once you save your changes within a version,
    you may discard it unless you plan to work in it again.'
  merge: -1
