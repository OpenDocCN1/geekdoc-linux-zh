    # 11.4 ZCatalog Queries


    Although the Z Interface is useful for quickly creating a simple user interface
    for searching for Zope site''s contents, it is often inadequate for specialized
    queries. To increase your flexibility, let''s look at how to use a ZCatalog to
    customize a Z Interface to better suit your needs.


    # 11.4.1 Querying ZCatalogs from a Form


    The code generated by the Z Interface is simply a query of a ZCatalog from values
    specified on a form. A ZCatalog is a callable object, like a method, and when
    called returns results based on the search criteria passed to it. When you call
    a ZCatalog by name, form values in the REQUEST object are automatically passed
    as query criteria. By modifying the search form, you can control the search criteria
    passed to the catalog.


    For example, let''s create a simple search form, queryForm and a simple reportReport.
    In our example, there is a ZCatalog named "Catalog" with the attribute title as
    both an index and metadata element.


    Listing 11-2 shows the DTML code for queryForm, a simple HTML form with a single
    input field.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Listing 11-2: Code for queryForm DTML document


    ```

    <dtml-var standard_html_header>

    <form action="queryReport">

    <p>Title:<input type="text" name="title" size="40"></p>

    <input type="submit">

    </form>


    <dtml-var standard_html_footer>

    ```


    Listing 11-3 shows the code for queryReport, which lists the titles of the cataloged
    objects found, based on the title entry made in queryForm.


    # Listing 11-3: Code for queryReport DTML Document


    ```

    <dtml-var standard_html_header>

    <dtml-in name="Catalog">

    <dtml-var name="title"><br>

    </dtml-in>

    <dtml-var standard_html_footer>

    ```


    The most important line of code in queryReport is the dtml-in statement on the
    second line. This statement calls the Catalog by name, passing it any values submitted
    from the form. If the user types words into the title field of the form and submits
    it, these words are used as search criteria against the title index in the Catalog.


    # 11.4.2 Catalog Brains


    When a ZCatalog is called, as in our simple example queryForm, it does not return
    the actual objects matched by the query criteria. Instead it creates a sequence
    of brain objects that contain the cached metadata values of the matched objects
    along with several methods that can be put to various uses. It is very important
    to understand that when you are working with Catalog results, you are not working
    with the actual objects found, only their metadata. You can, however, explicitly
    access the actual objects if you need to.


    Table 11-1 lists the methods available on the brain objects (that is, result items)
    returned from a ZCatalog. Each of these methods is directly available inside a
    dtml loop that iterates over the ZCatalog results (such as in queryForm above),
    because dtml-in puts each result item at the top of the name-space as it steps
    through the result sequence.


    The most useful methods listed in Table 11-1 are getURL and getObject. The former
    can be used to easily create links in your results page to each object; the latter
    to access any additional object attributes—such as properties and methods—that
    you may need in addition to the metadata cached in the ZCatalog.


    Calling getObject on many result objects can slow down your ZCatalog searches.
    Use it sparingly and with small batch sizes when using dtml-in.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "# Table 11-1: ZCatalog Brain Methods\n\n| ZCatalog Brain Method | Description\
    \ |\n| --- | --- |\n| has_key(key) | Returns true if the result item has a metadata\
    \ element named \"key.\" |\n| getPath() | Returns the physical path of the result\
    \ item in your Zape hierarchy. |\n| getURL() | Returns the absute URL of the result\
    \ item (which may differ from getPath()) if you are using virtual hosting). |\n\
    | getObject() | Returns the actual Zape object corresponding to the ZCatalog result.\
    \ |\n| getRID() | Returns the ZCatalog's internal record id far the result item,\
    \ which is the same as the data_record_id_variable returned by ZCatalog. This\
    \ can be used to uniquely identify results easily. |\n\nLet's enhance our queryReport\
    \ page (Listing 11-4) using the getURL method above, which will allow us to construct\
    \ a link to each object returned by the query.\n\n# Listing 11-4: Enhanced queryReport\
    \ DTML document\n\n```\n<html-var standard_html_header>\n<html-in name=\"Catalog\"\
    >\n  <a href=\"<html-var name=\"getURL\">\n    <html-var name=\"title\">\n  </a><br>\n\
    </html-in>\n<html-var standard_html_footer>\n```\n\nBy adding the anchor tag to\
    \ the queryReport code and using the getURL method of the ZCatalog brain to insert\
    \ the object's URL in the href attribute, each search result now links to the\
    \ object found by the query.\n\n# 11.4.3 Querying ZCatalogs Directly\n\nTo query\
    \ a ZCatalog, we call the ZCatalog using an expression and explicitly pass the\
    \ query criteria as arguments. The argument names match the indexes you wish to\
    \ query against, and the values contain the query criteria for each named index.\
    \ You can supply criteria for as few or as many indexes as you wish. (You can\
    \ also use other arguments to control the sort order of the result items returned\
    \ by the ZCatalog.)\n\nLet's create some sample queries on a ZCatalog containing\
    \ the indexes shown in Table 11-2 (which are the defaults created by Zope)."
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Table 11-2: ZCatalog Indexes


    | ZCatalog Indexes | Index Type |

    | --- | --- |

    | PrincipiaSearchSource | TextIndex |

    | bobobase_modification_time | FieldIndex |

    | id | FieldIndex |

    | meta_type | FieldIndex |

    | title | TextIndex |


    #  11.4.3.1 Basic Field Index Queries


    Field Indexes basic be used to find objects whose attributes match the values
    you specify. To match objects with a field index, we simply pass arguments the
    name of each index we want to match, followed by the value desired. For example,
    to find all catalog objects with the meta_type value ''DTML Document'' and the
    id value ''index_html'', you would use the following ZCatalog query expression:


    ```

    expr=Catalog(id=''index_html'', meta_type=''DTML Document'')

    ```


    When you pass multiple indexes, they are ''anded'' to form the search query, meaning
    that all criteria must be matched for the object to be returned in a result. To
    expand the search to match multiple values of an indexed attribute simultaneously,
    pass the desired values in a list to the index you are matching against. For example,
    to expand the above search to include DTML Document objects, use this expression:


    ```

    expr=Catalog(id=''index_html'', meta_type={''DTML Document'', ''DTML Method'')

    ```


    When you use the above expression, a meta_type value of DTML Document or DTML
    Method, along with an id value of index_html, would satisfy the search criteria
    for an object.


    > NOTE Keywords work the same way, except that the search value needs to match
    only one item of the keyword indexed list attribute (such as a lines or tokens
    property).


    #  11.4.3.2 Range Queries on Field Indexes


    It''s a more complex process to match a field index against a range than it is
    to match it against an exact value. To match a range we must specify two arguments
    for the index, the desired range value(s) and range usage. The range value(s)
    are passed in an argument matching the name of the field index. The usage argument
    uses the field index name followed by _usage. The three usage values that control
    how the range matching is performed against the index are shown in Table 11-3.'
  merge: -1
  img_proc: true
- pgno: 240
  md: "# Table 11-3: Usage values for range matching\n\n| Range usage value | Description\
    \ |\n| range:min | Matches indexed values equal to or greater than the range value.\
    \ |\n range:max | Matches indexed values less than or equal to the range value.\
    \ |\n range:min:max | Matches indexed values between a specified and maximum value.\
    \ |\n\nFor example, let's consider how we query the ZCatalog by date, using the\
    \ bobabase_modification_time index to find objects based on their modified date\
    \ and time.\n\nFor our first example, let's find all cataloged objects modified\
    \ in the last 30 days. This could be used in our bookstore application to find\
    \ recently added or modified instances.\n\n```\nexpr=\"Catalog(bobabase_modification_time=ZopeTime())-30,\n\
    bobabase_modification_time_usage='range:min'\n```\n\nIn the first argument, which\
    \ matches the index name, we pass the value of the current Zope system date and\
    \ time minus 30, which calculates the date 30 days prior to our search value.\
    \ The second usage argument instructs the ZCatalog to return objects whose date\
    \ is equal to or greater than the search value.\n\nBy simply changing the usage\
    \ value, we could find all object that have not been modified for 30 days, as\
    \ follows:\n\n```\nexpr=\"Catalog(bobabase_modification_time=ZopeTime())-30,\n\
    bobabase_modification_time_usage='range:max'\n```\n\nTo match values that fall\
    \ between two values (a minimum and maximum), you must pass a list containing\
    \ at least two items as the search value. The item of the list with the smallest\
    \ value is treated as the minimum search value and the item with the largest value\
    \ as the maximum search value. For example, to find all cataloged objects modified\
    \ yesterday, we could use the following expression:\n\n(ZopeTime()-1) returns\
    \ the date and time 24 hours ago as a Date Object. To determine the starting and\
    \ ending time of the previous day for our use as minimum and maximum values, we\
    \ use the earliest() and latestTime() method respectively of the DateTime object.\
    \ These are passed in a two-item list as the search value. We then use the range:min:max\
    \ usage value to instruct the ZCatalog to perform the bounded query."
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 11.4.3.3 Sorting the Results Using Field Indexes


    Field indexes are also useful for sorting resulting objects efficiently. Although
    the dtoml-in tag allows you to sort a sequence using the sort="..." attribute,
    this sorting occurs in RAM, which requires all of the ZCatalog results to be loaded
    into memory regardless of whether they are displayed in the current batch. Normally
    only those results displayed are actually loaded into memory.


    To sort efficiently using a field index, pass a sort_on argument to the ZCatalog,
    with its value to the name of the field index to sort by. You can also specify
    an optional sort_order argument to determine whether the sort order is ascending
    or descending. This sorting occurs when the query is performed, avoiding the memory
    and performance penalties of the dtoml-in sort attribute.


    Let''s extend the earlier example that returned objects modified in the last 30
    days. To return the results sorted by modified date with the most recently modified
    first use this expression:


    ```

    expr="Catalog(bobobase_modification_time=ZopeTime()),

    bobobase_modification_time_usage=''range:min'',

    sort_on=''bobobase_modification_time'',

    sort_order=''descending"

    ```


    > Because sort_on can be used with field indexes, you will still need to use the
    dtoml-in sort option by other attribute values, like an object''s title. To sort
    using the sort option, the desired attribute must be a metadata element of the
    ZCatalog.


    # 11.4.3.4 Text Index Queries


    Text index query arguments are coded like exact field index queries, except that
    the value represents a query string rather than an exact value to match. The query
    string allows simple boolean searching and partial word-match functionality on
    large quantities of indexed text (see section 11.2.5 for more details).


    Our example ZCatalog has two text indexes: title and PrincipiaSearchSource. The
    former is the title property of the object, the latter is the body text of the
    document. To find categorized objects whose contain the words "event" and "calendar",
    you could use the following expression:


    ```

    expr="Catalog(title=''event and calendar'')"

    ```


    As discussed with field indexes, if multiple indexes are included, all the search
    criteria must be satisfied on an object to be returned.


    > You can simultaneously search field, text, and keyword indexes in a single expression
    by combining the other techniques described above in section 11.4.3.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 11.4.3- ZCatalog Query Limitations


    Although it is easy to create "and" queries that match criteria from multiple
    indexes and return objects satisfying all of it, it is difficult to perform "or"
    queries across multiple indexes. For example, you cannot use a simple query to
    return objects where the search criteria match the title or PrincipiaSearch-Source
    indexes.


    There are two ways to overcome this limitation. The first is to perform each query
    separately and combine the results into a single result set. The second is to
    create a new method of the object or a script that programmatically combines the
    contents of the attributes, then index against this combined value.


    Let''s explore the first option: combining search result sets, which you can do
    simply by adding the results of ZCatalog queries using the plus (+) operator.
    For example, to return all objects containing the word "victory" in either their
    title or body text, the following:


    ```

    expr="Catalog(title=''victory'') + Catalog(PrincipiaSearchSource=''victory")

    ```


    Although this approach will get us what we want, it has one slight problem: Objects
    containing the search word in both attributes will be returned twice by our expression,
    which is not usually the desired result.


    The second approach, to create method or script values, is somewhat more complex
    and involves writing Python code, but it does solve the duplicate results problem.
    The sample Python script in Listing 11-5, text_content, can be created in Zone''s
    root footer, so that it can be acquired by all of the cataloged objects.


    # Listing 11-5: text_content Python Script


    ```

    return context.title + ''\n'' + context.PrincipiaSearchSource()

    ```


    This script returns the object''s title, followed by a line break (''\n'') and
    the body returned by the PrincipiaSearchSource method of the object. If, after
    creating the script, you create a TextIndex called "text_content" in your ZCatalog
    and update it (using the advanced fancy); the ZCatalog will call this method for
    all cataloged objects and index the result. After doing this, you can perform
    the query using the following expression:


    ```

    expr="Catalog(text_content=''victory")

    ```


    (We will discuss Python in more detail in Chapters 13 through 15.)


    NOTE You cannot use a DTML method as the source for an index, because the ZCatalog
    expects the attributes to be simple values, properties, or Python methods/scripts
    that do not require arguments.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 11.5 The Vocabulary


    When you create a new ZCatalog, you are asked whether you also want to create
    a new vocabulary or use an existing one. A vocabulary contains words (normal text,
    DTML, and HTML tags) found in the objects cataloged in the corresponding ZCatalog.


    # 11.5.1 The Vocabulary Screen


    The Vocabulary screen''s main screen contains a list of all words found in the
    attributes of cataloged objects that are text index. The batch size of this list,
    that is, the number of words displayed, is 20 words per page. DTML and HTML tags
    are stored in the vocabulary without angle brackets, and DTML tags are stored
    as single words without hyphens. For example, say you have a ZCatalog named MyZCatalog
    that contains one object: the DTML document index_html with the source text shown
    in Listing 11-6.


    Listing 11-6: index_html source text


    ```

    <dtml-var id>

    <html>

    <a href="../index_html">Back</a>

    hey, you!

    hello

    ndi there

    many hellos!

    ```


    Figure 11-18 shows the words generated in the vocabulary from this source text.


    # 11.5.2 Searching the Vocabulary


    You can use the Query screen''s short form, consisting of an input field and a
    Subbutton, to search the vocabulary. If a vocabulary is created using globbing
    you can search it using wildcards (such as * or ?). For example, if you were to
    search the vocabulary shown in Figure 11-18, the results of the following queries
    would be as:


    +   * he* [''hey'', ''hello'']

    * hellos [''hello'']

    * hello [''hello'']

    * h1* [''hello'']

    * y [''hey'', ''many'']


    > The globbing option is chosen only when the vocabulary object is created. You
    cannot change the globbing option after the fact. To change the globbing option,
    you would need to delete the original vocabulary, create a new one with the same
    id, and update all the ZCatalogs that the vocabulary using the Advanced screen
    of the ZCatalogs.'
  merge: -1
  img_proc: true
