- pgno: 146
  md: '# #7


    # LOCAL ROLES AND PERMISSIONS


    ![](img/43a28cce5475b2f487bf455365567fb6_146_0.png)


    Sometimes, you may want to give users in one role the same permissions as another;
    for example you might wish to give a Friend the same permissions as a Manager
    for one particular object (for example, a DTML document or a specific folder),
    in which case there is little point in assigning the user (let us call him "Egon")
    the role of Manager, because he will then be able to see and use the management
    screen for the whole of Zope. Egon should only be able to modify the folder My_Homepage.
    Similarly, if you give the role Friends the same permissions as Manager, all users
    in the Friends role will have Manager permissions for the folder My_Homepage.


    #  7.1 Local Roles


    It is at this point that local roles come into play. Local roles allow us to assign
    a different role to a user created in the acl_users folder for a specific object,
    to be it a folder or individual document.


    #  7.1.1 Example


    To give Egon the same permission as a Manager for the folder My_Homepage, we must
    first open the Security screen for the folder My_Homepage, shown in Figure 7-1.
    Notice the link local roles in the introduction text.'
  merge: -1
  img_proc: true
- pgno: 147
