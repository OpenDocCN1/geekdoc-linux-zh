  md: 'cated user with the Friend role during the ''if'' query and is shown the special
    welcome page. Since no other Anonymous users can authenticate, they are not redirected
    and do not see the special welcome page. This differentiation is achieved as follows:


    +   1. Click on the object login_html in the list of objects in the My_Homepage
    folder.


    +   2. Click on the Security tab on the bar to access the Security screen for
    login_html, as shown in Figure 8-5.


    +   3. Deactivate the Acquire permission settings? checkbox in front of the View
    permission (the default setting is activated) so that the permissions set for
    the superordinate folders are not acquired. This breaks the acquisition screen
    and acquisition chain and allows you to apply the permissions you want.


    +   4. Activate the View permission for the Friends role.


    +   5. Click on the button at the bottom of the list to save these changes.


    You have now saved all of the settings needed to allow users to authenticate through
    login_html.


