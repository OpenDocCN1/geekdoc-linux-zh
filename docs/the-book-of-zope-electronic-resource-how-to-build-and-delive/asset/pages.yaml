    | There are no non-empty versions. |


    Figure 3-19: The Version Management screen


    # 3.3.8 Product Management


    The Product Management link leads to the product overview of your Zope server,
    containing a list of all installed products, as shown in Figure 3-20. (See Chapter
    7, "ZClasses," for more information on products, and section 12.3, "Products.")


    The Product Management screen contains the same buttons as the Contents overview.
    You can use these buttons as usual on the listed products.


    As with folders, click products to open them, access the contents of individual
    products, and view the objects in them using the Contents overview screen.'
