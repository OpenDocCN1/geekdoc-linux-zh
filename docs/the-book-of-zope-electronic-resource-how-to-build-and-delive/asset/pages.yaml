  md: "However, these error messages can be misleading, often a missing quote on an\
    \ attribute or missing right bracket at the end of a dhtml tag can cause the rest\
    \ of the dhtml code to be ignored. In this case, the tag with the actual error\
    \ is not the one specified in the error message. For example, look at this incorrect\
    \ dhtml code:\n\n```\n<html-if name=\"today\">\n  Yesterday was <dhtml-var expr=\"\
    (today-1).day()>\n</dhtml-if>\n```\n\nIn Line 2, the quote is missing at the end\
    \ of the expr attribute. However, the error Zope returns when you try to save\
    \ this\n\nNo closing tag, for tag dhtml-if name=\"today\", in line 1\n\nAs you\
    \ can see, line 3 does contain a closing tag for the dhtml-if in line 1. The problem\
    \ is that Zone thinks this line is part of the value of the expression attribute\
    \ from line 2 because there is no closing quote after day(), so Zone doesn't recognize\
    \ line 3 as a dhtml tag at.\n\n# 16.2.2 Debug Mode\n\nWhen debug mode is activated\
    \ in Zope (which is if you use the default Zope start script) you will see a traceback\
    \ of the error after the text of the error page. Otherwise, the traceback is displayed\
    \ in the HTML source of the page, and you can view it by choosing View Page Source\
    \ or View Frame Source after right-clicking on the error page.\n\nThe traceback\
    \ shows the route of execution from the module that caused the exception (always\
    \ the bottom file in the traceback) to the module that controls Zope output, as\
    \ well as the objects or expressions executing in each module at the time of the\
    \ error. (A more detailed description of exceptions is given in section 16.3.1\
    \ below.)\n\nIn the case of DHTML errors, the final module is always\n\n```\n\
    /usr/local/Zope-x.x.x/src/lib/python/DocumentTemplate/DT_String.py,\n```\n\nas\
    \ shown in Figure 16-1. Unfortunately, this also makes the traceback less useful\
    \ for debugging DHTML. The error message and the objects shown in the traceback\
    \ must be sufficient to locate the error.\n\nYou can greatly enhance the information\
    \ provided by Zope error messages by installing the ZDebug product. Although still\
    \ in development in this writing, it is still a highly useful tool for debugging.\
    \ Download it from http://www.zope.org/Members/hathazard/ZDebug."
