    # 10.2 Running the Store


    In this sample web application—the bookstore scenario—our goals are


    +   * To use an administration interface to manage all books on sale.

    * To offer our books for sale to visitors.

    * To do so, we need


    +   * An administration page. admin_html. Steps to create this element are explained
    in section 10.3.

    * An index page. index_html, where customers can view and order items. Steps to
    create this element are explained in section 10.4.


    These two DTML methods, admin_html and index_html, are very similar except that
    when visitors arrive through index_html, they cannot add, edit, or delete objects.
    Changes of this nature can be made only by the page administrator using admin_html.


    # 10.3 Two Ways to Edit Your Book Objects


    When editing the book objects you create, you can either work in the management
    screen for the Books folder or create a custom administration interface. It is
    much easier to to manage all objects from a single administration interface, but
    we will discuss both approaches here.'
