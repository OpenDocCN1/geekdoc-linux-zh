  md: '# 12.5.2 The sqltest Tag


    The sqltest DTML tag is a special tag that can only be used in SQL methods. The
    sqltest tag inserts an SQL comparison expression between a table''s column and
    a value supplied as an argument. The column name, lastname in this example, is
    used in the sqltest tag:


    ```

    <sqltest name="lastname" type="string">

    ```


    The argument name with which the column is to be compared is also called "lastname."
    All arguments used as variables in SQL methods must be specified explicitly in
    the Arguments field of the method. Assuming the value "Slides" is supplied as
    the value of the lastname argument, the above sqltest tag would insert the following
    text into the SQL statement:


    lastname=''Slides''


    To create the SQL method search_firstnames, use the same approach. The general
    syntax is


    ```

    <sqltest name="variab" column="columnname" type="datatype" optional>

    ```


    To create an SQL method to search for first names, assuming an argument "name"
    enter the following code into the Z SQL method:


    ```

    SELECT * FROM user WHERE <sqltest name="name" column="firstname" type="nb">

    ```


    | Id | search_firstnames |

    |---|---|

    | Title | MySQL_database_connection |

    | Connection Id | |

    | Arguments | name |

    | Query Template | SELECT * FROM user name="name" WHERE <sqltest name="name" column="firstname"
    type="nb"> | |


    Figure 12-11: SQL search_firstnames method


    Figure 12-11 shows the completed search_firstnames Z SQL method. Table 12-3 lists
    the attributes of the sqltest tag.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '### Table 12-3: Attributes of the sqltest Tag

    | Attribute | Description |

    | --- | --- |

    | name | Name of the variable to be written in the table. |

    | column | Name of the column in the table. |

    | multiple | A flag that indicates whether several values can be used. |

    | optional | A flag that indicates whether the test is optional. If no value exists
    for a variable or if an invalid empty string is used, operations are performed.
    |

    | op | Parameter indicating the comparison operation. The standard value is =:
    > >= =. The following comparison operations can be used. Others may also be available
    for your database, consult your documentation for details. |

    | type | The data type of the variable to be inserted, such as string, int, float,
    nb. (nb stands for nonblank and represents a string longer than 0 characters.)
    |


    # ## 12.5.3 The sqlvar Tag


    The sqlvar is another DTML tag that is used only in Z SQL methods. This tag is
    used to ensure that certain value types, such as string, are correctly interpreted
    in the SQL text. Data values are converted (if possible), strings are properly
    quoted, special characters are escaped (as with the sql_quote option of dtml-var),
    and numeric values are passed according to the conventions of your database. Use
    sqlvar in place of dtml-var in your Z SQL methods.


    The syntax to use is


    ```

    `dtml-sqlvar name="name" type="datatype" optional`

    ```


    Table 12-4 lists the attributes of the sqlvar tag.


    ### Table 12-4: Attributes of the sqlvar Tag

    | Attribute | Description |

    | --- | --- |

    | name | Name of the variable to be written in the table. |

    | type | The data type of the variable to be inserted, such as string, int, float,
    nb. (nb stands for nonblank and represents a string that has a length greater
    than 0 characters.) |

    | optional | Inserts nothing if the value is omitted or cannot be successfully
    converted ta the type specified. If this attribute were omitted, a Zope error
    would occur. |'
  merge: -1
  img_proc: true
