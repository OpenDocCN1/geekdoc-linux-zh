    # 1. Tuples

    A tuple is an indexed collection of elements, much like a list, used to form an
    object. Unlike lists, however, the sequence of the individual elements in a tuple
    cannot be changed, and new elements cannot be appended or inserted. Tuples are
    used when you need to store a sequence that should not be modified by other parts
    of the program. The tuple is enclosed in parentheses, with the elements separated
    by commas, as shown in the following table.


    | Example | Result of Evaluation |

    | --- | --- |

    | () | The empty tuple. |

    | (''Easter'', ''bunny'') | (''Easter'', ''bunny'') |

    | (1, 2, 3) | (1,2,3) |

    | (''uno'',) ) | (''uno'',) |


    # 1.1.2.4 Dictionaries

    Dictionaries are an unordered collection of key and value pairs—essentially, a
    list of keys, each of which has been assigned a value. These keys can be numeric
    constants, strings, tuples, and a number of constant objects. Dictionaries can
    be nested (that is, contain other dictionaries), and they may also contain lists
    and tuples as values.


    A dictionary is enclosed in curly brackets (also called "braces") with its elements
    separated by commas and its keys separated from their values with a colon:


    ```

    {Key1:Value1, Key2:Value2, key3:Value3, and so on}

    ```


    A dictionary is like a simple list containing a word (the key) and its corresponding
    value. For example.


    ```

    {''house'': ''Haus'', ''lawnmähermann'', ''graveyard'': ''Friedhof''}

    ```'
