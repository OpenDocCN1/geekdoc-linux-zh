- pgno: 39
  md: '# ## 2.3 Zope Objects


    Let''s take a closer look at Zope''s objectoriented approach as well as individual
    Zope objects such as DTML methods and documents, folders, external methods, and
    so on. As we do, you''ll become familiar with each object''s functions and their
    relationships to each other. Then we''ll show you how to create your own objects;
    use them to perform various tasks; and how to copy, delete, and rename folders
    and other objects.


    # ### 2.3.1 Zope and Object-Oriented Programming


    Zope''s most important underpinning is object-oriented programming.


    > > NOTE You can skip this section and still get satisfactory results. However,
    to take full advantage of all Zope''s benefits and gain a complete understanding
    of how it works, we strongly recommend that you read it.


    The object-oriented philosophy is based on the fact that the world consists of
    discrete objects. An object is a real-world thing, with a status and the ability
    to perform actions and communicate with other objects. In a programming language,
    we can represent any individual real-world thing—be a house, a table, or a car—an
    object with properties.


    For example, imagine a spaceship called the USS Chuck with a maximum crew of 120,
    20 cargo bays, and a maximum speed of warp factor 9.6. The crew, the cargo, the
    speed, and the ship''s name define the spaceship''s state. But our spaceship must
    also perform actions, such as picking up crew, travelling through space, transporting
    freight, avoiding other spacecraft, and communicating with other spacecraft to
    perform avoidance maneuvers. How do we account for this information in a programming
    language?


    # #### 2.3.1.1 Methods and Attributes


    From a programming perspective


    Because a spacecraft must be able to carry out certain functions, the appropriate
    methods must be implemented for it to function properly. We would write these
    methods or actions as pickCrewUp, fly, transportFreight, and avoidCraft. Together,
    the attributes and their values, as well as the implemented methods, define the
    spaceship object. An object is, therefore, defined by its attributes and methods.


    An object is determined by what it knows and what it can do. For example, the
    USS Chuck knows how many crew members are on board, its speed, and how many of
    its cargo bays are full. In addition, it can carry out the actions specified by
    its methods.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 2.3.1.2 Classes


    Now imagine that the USS Le Chuck meets a similar spaceship, the USS Largo. The
    Largo is smaller, fewer crew members, and its maximum speed is less than the Le
    Chuck''s. The ships communicate with each other, and the smaller ship begins an
    evasive maneuver.


    Despite the differences between the two crafts, both are spaceships with identical
    capabilities, such as the ability to perform evasive maneuvers, pick up crew,
    and so on; they differ in their characteristics, namely size and maximum speed.
    You would have to check the attributes and implemented methods of the USS Largo,
    you would find that, from the specific attribute values, they match those of the
    USS Le Chuck. Because the objects can carry out the same actions, they do belong
    to the same class. A class describes all objects that have the same methods and
    attributes.


    # 2.3.1.3 Objects


    An object derived from a class is built according to the properties of a class.
    Deriving is analogous to manufacturing an object in the real world to certain
    specifications. Similarly, a class is the plan or specification according to which
    the associated objects are created. If, for example you want to create a spaceship,
    you first derive an object from the spaceship class, then assign various attribute
    values to the objects to differentiate them from each other.


    When working with Zope, you will create folders that are like file directories
    by deriving a folder object from the class that defines the attributes and methods
    for folders. When you do so, you then assign a name to the object and any other
    attribute or property values it requires. The same applies to everything you create
    in Zope;


    The following sections show you how to use the fundamental Zope objects and their
    most important functions. Step-by-step examples let you practice what you learn.


    # 2.3.2 Creating a Folder


    A folder is an object that, like a directory, can contain other objects. Objects
    that are not standard Zope folders but can contain other objects are considered
    folderish objects (for example, User Folders). Folderish object classes are common
    components of products (discussed in Chapter 12). Although you generally need
    not define these folderish object classes yourself (they are installed automatically
    with a product), you can create your own folderish Zope objects using ZClasses
    (see Chapters 9 and 10 for more information) or by constructing a Python class
    in an external Zope product.


    To create a standard folder'
  merge: -1
  img_proc: true
