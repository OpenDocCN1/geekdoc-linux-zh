    | s[0:3] | First three elements of sequence |

    | len(s) | Number of elements in sequence |


    # 13.1.2.1 Strings


    Strings are sequences of characters that form a chain or string. A string can
    consist of several characters, one character, or no characters and can essentially
    contain anything that can be converted to text in some way.


    Strings are enclosed in single or double quotation marks; an empty string is produced
    by two adjacent quotation marks. Python also supports multiline strings that are
    enclosed in three single or double quotation marks and are called triple quoted
    strings.


    You must use single quotation marks to use strings in DTML.


    | Example | Result of Evaluation |

    |---|---|n| '''' | There is no screen output because the string is empty |

    | ''DTML'' | DTML |

    | ''hg%dd@'' | hg%dd@ |

    | ""DTML"" | DTML |

    | ""Multiple Lines"" | Multiple Lines |


    # 13.1.2.2 Lists


    A list is an indexed collection of objects of various data types used to form
    a sequence. Unlike strings, lists can contain other objects, which may include
    float-point numbers or even lists, in addition to characters. Lists are like arrays
    in other languages except that lists are not fixed in size and their elements
    are not a fixed data type.


    A list is enclosed in square brackets, with the individual elements separated
    by commas.


    There are several methods available to list objects, including append and insert.
    These methods are used to add new items to the end or middle of a list.'
