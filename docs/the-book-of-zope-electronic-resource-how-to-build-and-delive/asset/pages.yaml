    Clearing the catalog will remove all


    # Subtransactions


    Subtransactions allow you to commit small parts of a transaction over a period
    instead of all at once. In ZCatalog, using subtransactions significantly reduces
    the memory requirements needed to index objects that are added to each objects.


    Enabled subtransactions reduce the memory requirements of ZCatalog, but at the
    expense of speed. If you choose to enable subtransactions you can adjust the threshold;
    ZCatalog allows subtransactions by adjusting the memory limit.


    If you are using ZCatalog and ZSQL in the same transaction you must disable subtransactions,
    because they are not compatible with ZSQL Methods.


    Subtransactions are enabled


    The subtransaction increases the number of objects cataloged in the course of
    a transaction that can work without failing. If this number is exceeded the catalog
    will


    # 11.2.6. Advanced screen for a ZCatalog


    The bottom section of the maintenance screen is used for managing the use of subtransactions
    by the ZCatalog. If subtransactions are enabled in a ZCatalog, the ZCatalog indexes
    objects incrementally rather than all at once. This value lets you control the
    memory usage of ZCatalog while objects are being indexed.


    The subtransaction intervals used by a ZCatalog to index objects are defined using
    a threshold value. The threshold value also determines how many words are to be
    indexed when there is only one. The higher the threshold value, the faster the
    indexing will take place. However, if the value is set high, the ZCatalog will
    require more memory. The lower the value, the less memory will be used, although
    indexing will take longer.


    In general you should leave subtransactions enabled with the default threshold
    value of 10,000, which means a maximum of 10,000 field values or words of text
    will be held in memory before being committed to the ZODB. If you find that Zope
    uses excessive amounts of memory during indexing operations, you can lower the
    threshold value to decrease the memory required. Or, if memory is plentiful and
    indexing speed is most important, you can increase the threshold value or disable
    subtransactions entirely.


    > NOTE If you are using ZCatalog together with ZSQL methods, you must disable
    subtransactions, because they are not compatible with ZSQL methods.


    # 11.3 Z Search Interface


    You need two pages to search a ZCatalog: one to receive the search query, and
    another to display the search results. Using the Z Search Interface option in
    the folder''s add menu, you can easily create standardized search and results
    pages,'
  merge: -1
