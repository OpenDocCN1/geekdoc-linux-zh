- pgno: 168
  md: "In addition to the welcome document (index_html), which generates both the\
    \ normal and special welcome pages, we have also created a DTML method login_html\
    \ in the folder Homepage. This page contains a redirect to the welcome page index_html,\
    \ meaning that the page login_html will not be displayed and the browser will\
    \ be redirected back to the DTML document index_html. (The function of the DTML\
    \ method will soon become apparent, but here we must specify the code for both\
    \ pages.)\n\n# 8.3.1 DTML Method login_html\n\nThe DTML method login_html simply\
    \ consists of the following line:\n\n```\n<dtml-call expr=\"RESPONSE.redirect('index_html')\"\
    >\n```\n\nThe method of the RESPONSE object is used to send a browser to a different\
    \ URL than was originally requested.\nlogin_html calls up a password query to\
    \ authenticate the user (see Figure 8-6), as explained below when we deal with\
    \ setting permissions for login_html. If Zope recognizes the user at the password\
    \ query, the page index_html displays a custom message according to the user's\
    \ role.\n\n# 8.3.2 DTML Document index_html\n\nThe DTML document login_html refers\
    \ to (index_html), which is shown in Listing 8-1:\n\n# Listing 8-1: Code for index_html\n\
    \n```\n<dtml-var standard_html_header>\n<dtml-if expr=\"AUTHENTICATED_USER.has_role('Friend')\"\
    >\n  <h2>Hello <dtml-var name=\"AUTHENTICATED_USER\">!</h2>\n  <p>Good to see\
    \ you again!</p>\n<dtml-else>\n  <h2>Welcome to my Homepage!</h2>\n  <a href=\"\
    login_html\">Login</a>\n</dtml-if>\n<dtml-var standard_html_footer>\n```\n\n#\
    \ 8.3.3 The two views of index_html\n\nThis DTML document can create two different\
    \ views. The first view is only visible to users with the role Friends who have\
    \ logged in. The other view (<dtml-else>) is initially seen by all visitors to\
    \ the homepage. While unauthorized users cannot proceed beyond this screen, authorized\
    \ users proceed to the special greeting once they have logged in."
  merge: -1
  img_proc: true
- pgno: 169
  md: 'We must retain the default permissions for index_html so that all users can
    see the page. As you know, users can see this page Zope has assigned the View
    permission to the Anonymous role. Each user initially sees the page index_html
    as shown in Figure 8-4.


    ![](img/43a28cce5475b2f487bf455365567fb6_169_0.png)


    Figure 8-4: View of index_html before login


    # 8.3.4 Assigning Permissions for login_html


    Several permissions may be needed in order to successfully render a page. At the
    very least, the visitor must have the View permission for the object. However,
    since we have also formulated the method login_html as a redirect, the user does
    not actually see a new page if they click on the link (Login), which leads to
    login_html. Access to this serves only as a gateway to the special welcome page
    of index_html.


    Initially, all users have the permission that allows them to access login_html
    as a result of Zope''s automatic assignment of permissions to roles. The purpose
    of the login_html method, however, is to test the permissions of the current users
    and make them authenticate if they do not have the role Friend.


    To accomplish this, the default permission assignment for login_html must be deactivated,
    by default, login_html acquires the View permission for the Anonymous role from
    the root folder. Once this is turned off neither Anonymous users or Friends are
    permitted to access login_html. If a user clicks on the Link, Zope attempts to
    display login_html and recognizes that the user does not have permission to login_html
    via View and requests authentication.


    To give Egon access, we must set the View permission for the role Friend separately.
    Once enabled, when Egon enters his correct user name and password, he is transferred
    by the redirect to index_html. There he is classified as an authenti-'
  merge: -1
  img_proc: true
