    \ Declaring Properties\n\nNext define the properties for the product, which are\
    \ used for each instance of the class. In this case we only need the property\
    \ title, which can be used to label the instances.\n\n> NOTE Defining title as\
    \ a property allows users to modify it through the Zope management screen. If\
    \ you click the property tab in an instance, you will see the properties defined\
    \ for each instance.\n\nThe properties variable is a tuple, as shown in the following\
    \ code. Each element of the tuple is a dictionary that describes a single property.\n\
    \n```\nproperties =\n  id: title, type: string, mode: 'w',\n```\n\nThe individual\
    \ key value pairs represent the following:\n\n| Key Name Value Description |\n\
    \n| id | This is the name of the property. Each property name must be unique for\
    \ a given class or object |\n\n| type | Individual properties can be of different\
    \ types, such as string, float and integer |\n\n| mode | A property mode indicates\
    \ whether the property can be changed ('w' = writable) or deleted ('d' = deletable)\
    \ by a user. If the mode key is omitted the default value 'w' is used |"
