    \ Zope Zope 53 Jan 20 21:39 standard_html_footer\n-TW-IW---- 1 Zope Zope 128 May\
    \ 21 17:32 standard_html_header\n226 Transfer complete\nftp> get index_html\n\
    local: index_html remote: index_html\n227 Entering Passive Mode (127,0,0,1,12,94)\n\
    150 Opening Binary mode data connection for file 'index_html'\n226 Transfer complete\n\
    92 bytes received in 0.00787 secs (11 Kbytes/sec)\n```\n\nTo download an object\
    \ (such as a DTML document) from Zope to your local computer, use the get command:"
