- pgno: 423
  md: 'More No-Nonsense Books from


    no starch press


    ![](img/43a28cce5475b2f487bf455365567fb6_423_0.png)


    # # THE LINUX COOKBOOK


    Tips & Techniques for Everyday Use


    by MICHAEL STUTZ


    The Linux Cookbook shows Linux users of all levels how to perform a variety of
    everyday computer tasks such as: editing and formatting text; working with digital
    audio; and creating and manipulating graphics. The quick-reference, "cookbook”-style
    format includes step-by-step "recipes."


    2001, 400 PP., $29.95 ($44.95 CDN)

    ISBN 1-886411-48-4


    ![](img/43a28cce5475b2f487bf455365567fb6_423_1.png)


    # # THE BOOK OF VMWARE


    The Complete Guide to the VMware Workstation


    by BRIAN WARD


    This guide to VMware software, which allows users to run multiple OSs simultaneously
    on a single computer, was developed with VMware, Inc. and covers device emulation;
    guest OS configuration; networking and file transfers; and more. The CD-ROM includes
    a demo version of VMware for Linux and Windows, and copies of all discussed utilities.


    DECEMBER 2001, 350 PP. W/CD-ROM, $39.95 ($55.95 CDN)

    ISBN 1-886411-72-7


    ![](img/43a28cce5475b2f487bf455365567fb6_423_2.png)


    # # THE BOOK OF JAVASCRIPT


    A Practical Guide to Interactive Web Pages


    by THAU!


    Rather than cut-and-paste solutions, this tutorial/reference focuses on understanding
    JavaScript and shows web designers on how to customize and implement JavaScript
    on their sites. The CD-ROM includes code for each example in the book, script
    libraries, and relevant software.


    2000, 424 PP. W/CD-ROM, $29.95 ($44.95 CDN)

    ISBN 1-886411-36-0'
  merge: -1
  img_proc: true
- pgno: 424
  md: '# # PROGRAMMING LINUX GAMES


    Learn to Write the Linux Games People Play


    by LOKI SOFTWARE, INC. WITH JOHN R. HALL


    Programming Linux Games discusses important multimedia toolkits (including a very
    thorough discussion of the Simple DirectMedia Layer) and teaches the basics of
    game programming. Understand the state of the Linux gaming world and learn to
    write and distribute games to the Linux community.


    2001, 432 PF., $39.95 ($59.95 CDN)


    ISBN 1-886411-49-2


    ![](img/43a28cce5475b2f487bf455365567fb6_424_0.png)


    # # THE LINUX PROBLEM SOLVER


    Hands-on Solutions for Systems Administrators


    by BRIAN WARD


    This book is a must-have for solving technical problems related to printing, networking,
    back-up, crash recovery, and compiling or upgrading a kernel. CD-ROM supports
