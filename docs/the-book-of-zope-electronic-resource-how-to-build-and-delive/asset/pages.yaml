- pgno: 349
  md: '![](img/43a28cce5475b2f487bf455365567fb6_349_0.png)


    Figure 17-11: Context menu


    A particular advantage of ZMS is its ability to edit DTML documents and methods.
    Because Zope''s DTML syntax is compatible with XML and Radio User-land is designed
    to work with XML, you can expand and collapse individual segments of the DTML
    code. This will make it easier to work with long source texts, such as tables
    and comments, which can simply be expanded.


    When you have finished making your changes, save the file to apply the changes
    to your Zope server.


    # # Summary


    This chapter has shown you different ways to access data, such as DTML Documents
    or Image objects, in your Zope server so that you can work with them more like
    normal files.


    Using these services: FTP, WebDAV, and XML-RPC, you can work with Zope outside
    of the confines of a web browser. Combined with development tools on your local
    machine, this can be a convenient way to perform development and content management
    tasks in Zope.'
