    of version management.


    When you click the History tab, you see an overview of the various versions of
    the current object. From here you can view individual versions, compare two versions,
    or restore old versions. Figure 3-5 shows the History screen for the DTML document
    index_html.


    | Edit | View | Proxy | History | Security | Undo | Ownership |

