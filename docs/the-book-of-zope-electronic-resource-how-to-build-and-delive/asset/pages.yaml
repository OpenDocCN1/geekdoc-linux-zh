  md: "# 12.3.3 Creating the Data Table with MySQL Monitor\n\nYou can create data\
    \ tables in a database using either the MySQL monitor or using Zope. Because you\
    \ have not connected Zope with MySQL, the MySQL monitor to create the tables.\
    \ (Section 12.3.5, \"Establishing a MySQL Connection from Zope,\" discusses how\
    \ to create tables in the MySQL database from Zope, without the MySQL monitor.)\n\
    \nUser data will be stored in a table called \"user,\" which should contain these\
