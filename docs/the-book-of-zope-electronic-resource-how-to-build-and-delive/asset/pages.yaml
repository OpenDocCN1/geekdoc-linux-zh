- pgno: 148
  md: 'We now select Egon from the list of users and Manager from the list of roles.
    When we click on the Add button under the two lists, Egon appears in the list
    of set local roles (with the local role set in brackets after the name). Egon
    can now carry out all activities in the folder My_Homepage that could normally
    be carried out only by a Manager.


    Say you have created a form for sending email (for example, sendEmail), a HTML
    method (for example, sendEmail) with the sendmail command, and a MailHost. If
    you want to allow only certain users (for example, Egon) to send this way, you
    may think that it would be a good idea to assign the local role of Manager to
    Egon for the DTML method sendEmail, because this DTML method contains the sendmail
    command. This will not, however, produce the desired results. To allow Egon to
    send email, he must be assigned the Manager local role in the MailHost object.
    Of course, this also means that he will be able to change the MailHost object—a
    possible drawback you should consider.


    # 7.2 Proxy Roles


    Proxy roles serve a purpose similar to local roles, but proxy roles are object-related
    whereas local roles are user-related. Proxy roles allow all users who access the
    object to have the same permissions, regardless of the role assigned to them.

    Let''s look at an example:


    Suppose you have created a new DTML document index_html with the standard source
    code (see "Access contents information" below). To assign the proxy role as Anonymous:


    +   1. Go to the Edit view of the DTML document and click the Proxy tab to call
    up the Proxy view, where you''ll find a list of all roles that can be assigned
    as a proxy role for this object.

    2. Select Anonymous from this list and click the Save Changes button.

    3. Now go to the containing folder''s Security view and deactivate acquisition
    for the permission Access contents information.

    4. Save the changes to the folder''s permissions.


    This interrupts the acquisition chain and removes the Access contents information
    from the Anonymous role. However, this permission is needed to view a DTML document
    that contains the DTML command


    ```

    <dtml-var id>

    ```


    --- the standard code for a DTML document contains. If you (or any other user)
    now try to view your just-created DTML document, you will be unable to do so regardless
    of the roles assigned to your authenticated user (even the Manager role). This
    is because the proxy role of Anonymous_html overrides all other roles assigned
    either directly to the user or via local roles.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 7.3 Permissions


    Let''s take a look at some of the permissions available in the Security tab of
    the management screen. Different objects can perform different actions and different
    management screens, the permissions available vary from object to object. Folder
    objects, which can contain other objects, also show all the permissions of the
    objects they can contain. This is so that you can affect the permissions of all
    objects that could be contained in the folder object from one central location.
    Because of this, permissions settings in the root folder are the most general,
    because they affect the largest number of objects.


    Figure-3 shows a typical security screen for a non-folderish object.


    ![](img/43a28cce5475b2f487bf455365567fb6_149_0.png)


    Figure-3: Security screen for a non-folderish object


    We cannot possibly cover all permissions that Zope users may encounter, because
    each new product may bring with it its own set of permissions, each of which is
    added to the list of Zope''s existing permissions once the product is installed.
    Thus, the following sections concentrate on the permissions provided by Zope.


    # 7.3.1 Permissions for Non-Folderish Objects


    As mentioned in Section 7.3, you can set many more permissions for folderish objects
    than for non-folderish ones, because folderish objects allow you to assign all
    permissions available for all object types that can be contained within them.
    This list will grow if you add Products or ZClasses that allow you to create additional


    In all of these, if, the permission is set for a specific object and a specific
    role (either by acquisition or directly under the role), a user with'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'role can carry out actions on object defined in permission. If a user lacks
    this permission, a permission is neither set in the object nor via acquisition
    for any role assigned to the user.


    For example, a user with the role Friends can open a DTML document in the third
    tier if the permission View has been assigned to the Friends role for that document.
    The user cannot view the management screen, however, if the permission View management
    screens is not assigned to the Friends role for that document.


    # Access contents information


    This permission allows a user to view information, such as the Title or id, relating
    to the object for which the permission is set. Take, for example, the standard
    content of a DTML document, as shown in Listing 7-1. Zope automatically inserts
    this content into the document by default when you create a new DTML document.
    This code also appears in the DTML document index_html, created automatically
    by Zope if you activated Create public interface when creating a new folder.


    # Listing 7-1: Standard Content of a DTML Document


    ```

    <dtml-var standard_html_header>

    <h2><dtml-var title_or_id></h2>

    <p>

    This is the <dtml-var id> Document.

    </p>

    <dtml-var standard_html_footer>

    ```


    <dtml-var title_or_id> returns the Title, if there is no Title, the id of the
    object; <dtml-var id> returns only the id of the object.

    If a user lacks this permission on a DTML document with this code, they will be
    unable to render the document, and thus unable to view if they have the View permission.
    Zope requires that the user log in as a user who belongs to a role permitted to
    view this object information. You often need to set this permission in conjunction
    with View to allow users to view a DTML document.


    > This permission is granted by default to the Anonymous role.


    # Change DTML Documents/Change DTML Methods


    These permissions must be set so that changes to existing DTML documents and methods
    can be saved. If a user lacking the appropriate permission attempts to save changes
    by clicking the Change button, the user is asked to enter a password. Without
    this password—that is, without the appropriate permission—the user can only view
    the source code of the DTML document or method in the Edit screen.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Change permissions


    This permission allows changes to be made to the permission settings in the Security
    tab of the object. For example, if you are logged in as a user without this permission,
    the Security tab is not displayed in the management screen for the object, meaning
    that you cannot access the Security screen to create roles and assign permissions.


    Normally the Manager role should have this permission. If you grant this permission
    to another role, in that role they then assign themselves any additional permissions
    they like, defeating any restrictions you might have imposed on them.


    # Change proxy roles


    If this permission is set for a role, the Proxies tab appears in the management
    screen of a DTML document or method. If a user has this permission, that user
    can assign a proxy role to a DTML document or method, so that the DTML document
    can access Zope resources that the user does not actually permission. Change proxy
    roles lets you assign access permissions of any roles in the folder to the DTML
    document/method.


    Only a Manager can assign all existing roles as proxy roles to a DTML document
    or method. Other roles can only be assigned to their own or Anonymous roles as
    proxy roles.


    # Delete objects


    Without this permission, users cannot delete, move, or rename objects; Zope will
    not display the Delete button in the management screen for them.


    # FTP access


    If you have this permission, you can use FTP (file transfer protocol) to copy
    Zope objects to or from your hard drive or include them in external files or folders
    in Zope. For example, you can use an FTP client to integrate files and folders
    stored on your hard drive into Zope without having to create each file manually
    using the web interface. FTP makes it easier to move files back and forth between
    Zope and your hard drive.


    Zope''s FTP port is 8021 as opposed to the usual 21. This can be changed by modifying
    the Zope start script (see section 1.5.3).


    # Manage properties


    If this permission is not set, the Properties tab is not displayed in the management
    screen, and you will not be able to add new properties or create existing ones.
    Properties are created in the Properties screen of an object when you click on
    the Properties tab. The title of an object is also a property in Zope, but you
    can change it in the Edit and Properties screen of many objects.


    For example, you have a DTML document that frequently uses the word "Boston."
    To replace "Boston" with the words "New York," you create a property called "City"
    with the value Boston. As a result, the variable <dtml-var City> would appear
    in place of the word Boston. To change "Boston" to "New York," all you will need
    to do is change the value of variable to "New York." Then, throughout the document,
    New York would replace Boston.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Take ownership


    From Zope 2.2.0 onward, this permission adds a button labeled "Take ownership"
    to the Ownership screen, provided the current user does not already own the object.
    Although the role Manager is normally given all permissions by default, this right
    is not. This permission is assigned by default only to the Owner role.


    # Undo changes


    This very important permission makes the Undo tab appear in the management screen.
    To use the Undo changes permission, you may need to set additional permissions
    on what you want to undo. In general, though, if you can perform an action, you
    can also undo it.


    > As of Zope 2.2.0, the Undo screen displays only actions carried out in the current
    folder or its subfolders, not all actions in the Zope installation as was previously
    the case.


    # View


    When this permission is set for an object for a given role, users assigned that
    role can view the object in the third tier view. This permission is often set
    in conjunction with Access contents information (above). It does not allow users
    to access the management screen using the /manage URL extension.


    > This permission is granted by default to the Anonymous role.


    # View history


    Users with this permission see a History tab in DTML documents and methods. This
    tab leads to the History view, which lists all actions carried out on the current
    object, from which you can compare the current version of a DTML document with
    a previous version.


    # View management screens


    Users with this permission can access the management screen using the URL for
    an object together with the /manage URL extension. For example, the URL to access
    the management screen for a DTML document named index_html in a folder named My_Folder
    would be http://localhost:8080/My_Folder/index.html.


    This permission does not allow a user to do more than view these screens. Additional
    permissions must be granted for a user to be able to add, edit, or delete objects,
    for instance.


    # 7.3.2 Permissions for Folderish Objects


    As mentioned in Section 7.3, folderish objects have many more available permissions
    than non-folderish ones. These include the permissions for nonfolderish objects,
    permissions created as a result of new product installations, and permissions
    provided by Zope for folders. We will now take a look at this last group of permissions:
    permissions provided by Zope for folders.'
  merge: -1
  img_proc: true
- pgno: 153
