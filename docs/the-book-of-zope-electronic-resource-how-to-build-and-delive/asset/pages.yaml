    selected on the form should be deleted. If you click Delete in DeleteConfirm_html,
    a second method, Delete_html, is called to perform the deletion. Pressing Cancel
    simply returns you to the admin_html page.


    Figure 10-9 shows the confirmation form generated by DeleteConfirm_html:


