- pgno: 155
  md: '# Add Site Roots


    Permission (available in Zope 2.3 and later) allows you to create virtual site
    roots inside Zope. These site roots are used to do hosting in Zope. Virtual hosting
    allows multiple websites with different Internet domain names hosted by a single
    Zope server.


    # Add User Folders


    With this permission, users can create User Folders, but only one for each folder.
    (Zope cancels attempts to create a second User Folder in the same folder.) Users
    are created in the user folders.


    # Add Versions


    Remember that versions allow users to make changes in an object without making
    the changes visible to all users without permanent changes. (Only users working
    with the same version will see these changes).

    The permission Add Versions is required to create a version. (Note that the permission
    Join, leave Versions is also needed in order to work in a version. Furthermore,
    the permission Save discard changes is needed in order to discard the changes
    so that they are visible to all users.)


    # Add Virtual Host Monsters


    This permission allows you to add Virtual Host Monster objects that affect the
    URLs generated by Zope objects, allowing you to use Zope seamlessly with a front-end
    webserver or accelerator (such as Apache or Squid), which rewrites certain containing
    URLs to correspond to your Zope server. Normally, inserting URLs in Zope (in a
    DTML document, instance) with the URL attribute of the REQUEST object or the absolute_url
    method will create a URL based on the name of the Zope server and the absolute
    path of the object. Virtual Host Monsters allow you to affect the output of these
    built-in attributes to correspond with your URL rewriting rules.


    # Add Vocabularies


    As of Zope Version 2.2.0, the ZCatalog includes a vocabulary (see Chapter 11).
    The permission Add Vocabularies allows users to create a general vocabulary that
    can be shared by several ZCatalogs.


    # Add Gadfly Database Connections


    This permission allows you to create a Z Gadfly database connection in a folder.
    Gadfly is a simple SQL database system included with Zope. However, Z Gadfly Database
    Connections appears in the drop-down menu only when another permission allows
    you to add objects is set (for example Add Folders. Images, and Files or Add Folders).
    The database connection is automatically opened when you create it; to close it,
    you must have the permission Open. Close Database Connections.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Add ZCatalogs


    When the permission Add ZCatalogs is set, you can create a ZCatalog in a folder.
    ZCatalogs are folder objects that allow you to index and query other Zope objects.
    To find and index objects in the ZCatalog, you must have the permission Manage
    ZCatalog Entries.


    The permission Search ZCatalog allows a user search the ZCatalog for objects,
    but no other operations, such as management, can be performed.


    # Add Zope Tutorials


    Zope versions since 2.2.0 include an introductory Zope tutorial. To view it, you
    must first create a Zope Tutorial object, which you''ll only be able to do if
    you have this permission.


    # Change Database Methods


    This permission must be assigned for you to be able to change SQL methods. You
    must also set this permission in order to display the Test tab in the management
    screen and to set an SQL method.


    # Change External Methods


    This permission allows you to modify External Method objects and to reload the
    external file corresponding with the External Method, if it has been modified.


    # Change Images and Files


    > NOTE


    When you upload a new version of an image or file, the old version may still be
    displayed if it is still in your computer''s cache. To remedy this, empty your
    browser cache.


    # Change Python Scripts


    This permission allows you to save changes made to Python Scripts (available in
    Zope 2.3 and later).


    # Change Versions


    With this permission, you can open an existing version in the Properties screen
    and change its title. To view the other screens for an object, you will need the
    permissions Join/leave Versions and Save/ discard changes.


    > NOTE


    You may be asked to enter your password when you confirm the title change, because
    the OK button in the message "Your changes have been saved" refers to the version''s
    join/leave screen in the background, for which you may not have permissions. Although
    Zope responds as you need the permission join/leave Versions, your changes to
    the title will still be saved.


    # Change cache managers


    This permission is needed to change the objects cached by a RAM Cache manager
    object.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Change cache settings


    Permission allows users to adjust the parameters used by a RAM Manager object.


    # Change configuration


    This permission is needed in order to make changes to a MailHost object.


    # Import/Export objects


    With this permission, you can move objects from one Zope installation to another,
    for example from one computer to another. Zope''s ability to import and export
    objects regardless whether they are non-folderish (like a file) or an entire folder
    (including its subfolders and other objects) will prove extremely useful.


    If this permission is set for the role of the current user, Import/Export button
    appear in the management screen.


    > When you import, you add objects to a folder. To import a file into a folder,
    you must have the permissions necessary for creating the objects you are importing
    in that folder (the permissions Add Documents, Images, Files or Add Folders must
    be set for this folder and its roles). If not, Zope asks for your password.


    # Join/leave Versions


    This permission lets you start or stop working in an existing version.


    # Manage ZCatalog Entries


    This permission must be set if you want to manage a ZCatalog.


    # Manage Vocabulary


    With this permission, you can access the screens for a vocabulary (see Chapter
    11), including the Vocabulary and Query screens. The Vocabulary screen displays
    all words contained in the Vocabulary in groups of 20. The Query screen is used
    to query the Vocabulary.


    # Manage users


    You must set this permission if you want to manage existing users, including changing
    their passwords, domains, and roles, or creating new users. To rename a user,
    you must create a new user with the desired name; you cannot change the name of
    an existing user.


    # Open/Close Database Connections


    This permission allows you to open and close external SQL database connections.
    (See "Add Z Gadfly Database Connections" above.)


    # Save/Discard version changes


    This permission allows you to save or discard changes you make to a version.


    # Search ZCatalog


    This permission must be set so that you can search a ZCatalog using this search
    page, which includes a page with a form in which you specify the search criteria
    as well as another page to display the results. Both pages can be created using
    Z Search Interface from the add menu.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Use Database Methods


    This permission is needed if you want to call Z SQL methods.


    # Use mailhost services


    Using the permission Use mailhost services, you can restrict users who can send
    email. To send email with Zope, you must create a MailHost object, typically in
    the root folder. (The actual composition and sending of emails is carried out
    using the DTML command sendmail.)


    The following example code in Listing 7-2 uses a mailhost object to send an email
    programmatically. A user would need the Use mailhost services permission to execute
    this code.


    # Listing 7-2: Example of sendFeedback


    ```

    <dtml-sendmail mailhost+MailHost>

    To: admin@test.com

    From: <dtml-var sender>

    Subject: Feedback

    <dtml-var text_to_email>

    </dtml-sendmail>

    ```


    # Summary


    You now have the knowledge you need to manage the roles and permissions of your
    Zope objects and keep your applications secure. Chapter 8 will explore the many
    additional functions and methods available to you in Zope''s security modules.'
  merge: -1
  img_proc: true
- pgno: 159
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 8


    # SOME METHODS FOR THE

    ROLE.PY AND USER.PY MODULES


    ![](img/43a28cce5475b2f487bf455365567fb6_160_0.png)


    In this chapter we look at the functions of other interesting and sometimes extremely
    useful methods for the Role.py and User.py modules, which can be called in DTML
    documents or methods.


    These methods can be used to inspect and modify the security settings and permissions
    of objects programmatically. For example, methods defined in the Role.py module
    can be used to determine and modify the permissions assigned to roles on an object.
    The methods defined in User.py allow you to determine the permissions a user has
    on an object or the roles assigned to a user; it also includes methods to create
    and modify user objects as in our example in section 6.3.1, "Creating Users in
    DTML."


    # 8.1 Calling Methods


    Use the following command format to call the methods in a DTML document or method:


    ```

    <dtml-var expr="object.method()">

    ```'
