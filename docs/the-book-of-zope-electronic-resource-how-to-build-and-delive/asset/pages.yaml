    # 15.4.3.2 Creating the Constructor Form Object


    It is not enough to simply write the constructor form''s HTML code into the product''s
    dt directories. In order to make this form accessible by Zope, we must use this
    file to create a DTMLFile object, which is analogous to the DTML method objects
    made inside Zope. Zope will be able to access this DTMLFile once we have defined
    it as an attribute of the Website product. To do so, we add the following line
    of code to the Website.py module:


    ```

    manage_addWebsiteForm=DTMLFile(''html/addWebsiteForm'', globals())

    ```


    # 15.4.4 The Constructor Method of the Main Module


    The constructor creates an instance of a class, properly initializes it, and stores
    it in Zope. The principal steps we use to code the Website class''s constructor
    method are:


    +   1. Define the constructor method and its necessary arguments, such as id and
    title, which will be passed from the constructor form (manage_addWebsiteForm for
    Wesite).

    2. Create an instance of the class (Website) and store it in a variable. (Our
    example uses the variable named instance.)*

    3. Assign the id and title as attributes of the new instance.\*

    4. Define a User folder in the instance.

    5. Establish a role for the instance (which, in our example, has the role named
    "authenticated users") with the permission for creating new users via the website.

    6. Assign permissions to the roles.

    7. Create the necessary DTML methods for the product instance in Zope using addTodoFolder().

    8. Change the permissions for one of the DTML methods so that visitors to the
    website who have the role User can create new users.


    (See Appendix C for the entire constructor method.)'
