    This page uses dhtml-email to email you the customer''s order using information
    from the OrderForm_html form to fill the body of the email. One special case is
    the order value submitted from the following select list in OrderForm_html:


    ```

    <td><SELECT size=20 NAME="order:list">

    ```


    This form field differs from the rest because it has "list" at the end of it,
    which tells Zope to convert the value submitted from the browser into a list.
    In this case, this is the list of Book ids selected by the user. Because the value
    for order is a list, we use dmlin to iterate it (Line 12) and look up the information
    about the Books selected (Line 13). (The lookup is necessary because only the
    ids for the books are passed from the form to the Order_html method.). To retrieve
    the other properties of each Book, we use dmlwith with sequence-item as its argument
    (which contains the id of each Book ordered), _getitem of the underscore namespace
    variable. Using the namespace, it returns the Book instance, and dmlwith puts
    the instance at the top of the namespace. In the dtml-block (Lines 14–19), simple
    dtml-var insert the property values of each selected Book instance.


    # 10.4.3 Sending the Order


