- pgno: 93
  md: 'of the web request (that is, until the requested is rendered and returned to
    the client). The set method takes two arguments: the name of the variable as a
    string and the value to assign to the name, which can be any data type or object.


    For example, to set a variable "Price" to the value 1500, use the following HTML
    code (the call tag is discussed in Section 4.3.4):


    ```

    <html-call expr=''REQUEST.set(''Price'',1500)''>

    ```


    Notice how the first argument—''Price''—is quoted because it is a string value.
    The second argument is not quoted because it is a numeric value. You can also
    put an expression in the second argument to calculate the value of the variable
    you are setting. For instance, to calculate a tax of 8% on the value of Price
    and store the resulting value in a new variable Tax, you might use the following
    code:


    ```

    <html-call expr=''REQUEST.set(''Tax'', Price*0.08)''>

    ```


    This may not work correctly in all cases, however. The REQUEST object is the last
    place names are acquired because it is always at the bottom of the namespace stack;
    were there another variable in the namespace named Price, its value would be returned
    instead of the value you set in it. To avoid this potential pitfall, you can explicitly
    tell to look up a value in the REQUEST object using only the following syntax,
    which is the same we used earlier for looking up names in the underscore namespace
    variable:


    ```

    <html-call expr=''Tax'',REQUEST[''Price''] * 0.08''>

    ```


    The construct REQUEST[name] is used to look up values directly in the REQUEST
    object rather than assuming they will be acquired from that object at the bottom
    of the namespace stack. This is especially useful if you need to access variables
    from REQUEST whose names are commonly used by other objects, like "title" or "id".
    You can also write this as REQUEST.name.

    When data from an HTML form is submitted by the client or CGI query variables
    are passed to the URL to Zope, these variable names and values are stored in the
    form attribute of REQUEST. The REQUEST object also makes these variables available
    in the general namespace, but you can see exactly which data was passed by a form
    or CGI query by accessing the form attribute directly.

    To display the contents of REQUEST object:


    ```

    <html-var name="REQUEST">

    ```


    The REQUEST data is returned in the format shown in Figure 4-6.'
