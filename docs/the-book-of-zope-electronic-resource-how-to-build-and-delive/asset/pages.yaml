- pgno: 142
  md: '# Listing 6-4: Changing a User after Checking


    ```

    1:    <html-var standard.html_header>

    2:    <html-call expr=''REQUEST.set(''name'', ''Billy'')''>

    3:    <html-call expr=''REQUEST.set(''password'', ''hello'')''>

    4:    <html-call expr=''REQUEST.set(''confirm'', ''hello'')''>

    5:    <html-call expr=''REQUEST.set(''domains'', [])''>

    6:    <html-call expr=''REQUEST.set(''roles'', [''Manager'', ''Owner''])''>

    7:    <html-if expr=''acl_users.getUser(REQUEST.name)''>

    8:        <html-call expr=''acl_users.manage_users(''Change'', REQUEST, RESPONSE)''>

    9:        <p>User dt-var name="name" updated.</p>

    10:   <html-else>

    11:       <p>User dt-var name="name" does not exist.</p>

    12:   </html-if>

    13:   <html-var standard.html_footer>

    ```


    Listing 6-4 uses REQUEST.set (Lines 2 through 6) to create variables containing
    the user''s updated information. This data could also be passed from a form (as
    in Listing 6.3), in which case you could omit these calls.


    Next, dhtml-if (Line 6) determines if the specified username exists by calling
    the getUser method of the acl_users User Folder and passing the name of the user
    in REQUEST.name. If that user exists, it is returned by the method, and the expression
    is evaluated as true. If the user does not exist, getUser returns None, which
    is evaluated as false.


    If our user exists (the dhtml-if expression is true), we call the acl_users.manage_users
    method (Line 7), passing the value ''Change'' as its argument. This tells the
    method we want to change an existing user (as opposed to adding one as in the
    previous example). After this call, a message is returned indicating that the
    user was updated (Line 8).


    If our user does not exist (the dhtml-if expression is false), it cannot be updated,
    so we simply return a message in the else clause (Lines 10–11) stating this fact.


