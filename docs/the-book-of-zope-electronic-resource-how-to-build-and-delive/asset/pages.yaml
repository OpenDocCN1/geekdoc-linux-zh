- pgno: 174
  md: '# 9


    # ZClasses


    ![](img/43a28cce5475b2f487bf455365567fb6_174_0.png)


    You now know how to create objects such as folders, DTML methods, and files in
    Zope as building blocks for applications. By combining these objects in various
    ways, you can create myriad applications in Zope. However, limitations and drawbacks
    to using these general objects still exist and, often, a better approach to designing
    your application is to create your own specialized objects that are custom tailored
    to the problems at hand. To create your own object types in Zope, you create a
    ZClass that describes their interface and functionality.


    Using ZClasses, you can create these custom Zope objects, either based on existing
    Zope objects (to extend these objects'' functionality) or from scratch. ZClasses
    can encapsulate the data, interface, and behavior of specific parts of an application,
    entirely through the Zope management screen with little programming. As such,
    programmers and nonprogrammers can use ZClasses to quickly create complex web
    application functionality.


    In this chapter we explore the process of designing, creating, and incorporating
    ZClasses into Zope applications, as we use ZClasses to create a web application
    for a small online bookstore. Once you''ve completed this chapter, you should
    find it easy to create ZClasses for use in your own web applications.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 9.1 Why Use ZClasses?


    In a nutshell, ZClasses are special classes in Zope that can be used to describe
    your objects—such as cars, jobs, CDs—and to develop unique solutions to your tasks,
    such as selling cars on the Internet or creating an online job bank.

    ZClasses are special because you don''t need to know how to program in Python
    to you simply create a new product using the Product Management screen in the
    Control_Panel and then create the necessary ZClasses in this product. You can
    also export your ZClasses to other Zope installations for other users to use.
    ZClasses also allow you to easily reuse components from one application to another
    or distribute your components online.

    You might use ZClasses in a company application to create objects that describe
    the work of individual employees, groups, or entire departments. For example,
    a class called Sales Staff could be used to create objects that describe the employees
    responsible for sales. Or you could create a ZClass Software to describe software
    objects as graphics applications, computer games, photo CDs, and so on, or a ZClass
    called Jobs to describe job advertisements.


    # 9.1.1 Example ZClass Application: Bookstore


    This application will allow you to manage pages and create objects to sell books.
    You can add and delete objects as well as change the individual specifications
    of an object or an entire object class using a web browser. You can also specify
    how the objects (the individual books, CDs, and so on) are listed: for example,
    by price, name, or publication date. Figures 9-1 show where 9-4 show where we
    will end up with our online bookstore.


    | Title | Book Id | Author | Publisher | Year of Publication | Genre | Price |
    Delivery Time | Photo |

    |---|---|---|---|---|---|---|---||}{

    | The Sickness Unto Death | B09362 | Soren Kierkegaard | Penguin USA | 1989 |
    Philosophy | 13.95 | 3 days | No Photo Available |

    | A Man in Full | B16630 | Tom Wolfe | Jonathan Cape | 1998 | Mystery | 19.99
    | 5 days | No Photo Available |


    Figure 9-1: Website from which users can order merchandise


    # 9.2 Classes and Objects


    Before you start creating your ZClasses, you need to familiarize yourself with
    several basic principles. As mentioned in Section 9.1, you first create a product
    and then add your ZClasses to it. A ZClass (like all classes) determines certain
    properties for objects. For example:'
