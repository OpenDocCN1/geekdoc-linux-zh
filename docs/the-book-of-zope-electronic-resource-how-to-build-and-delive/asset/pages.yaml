- pgno: 298
  md: '# 15


    # ZOPE PRODUCTS


    ![](img/43a28cce5475b2f487bf455365567fb6_298_0.png)


    Although you can use the Zope management screen to create an application, doing
    so can be cumbersome if you need to use a lot of Python code either in external
    methods or scripts. In such cases, it makes much more sense to create a Zope *product*
    to store your application''s classes, methods, and interface in Python and DTML
    files in the filesystem.

    This approach has several advantages:


    +   - You have complete access to all Zope and Python modules and use the numerous
    Zope base classes to build your own objects.

    - You can use text editors more suited to programming (such as emacs), instead
    of using a web browser.

    - You can use versioning systems (such as CVS) to allow several programmers to
    work on the same product files simultaneously.

    - You can conveniently distribute and install your Zope product on multiple Zope
    servers or even contribute it to the Zope community as open source software.

    - Your code is insulated from content managers or others working in the Zope management
    screen who are not programmers, and you can tailor your product''s management
    interface for them.

    - Your data (in the ZODB) and your code (in the product) are kept separate, making
    it easier to upgrade or replace code without disturbing the data or vice versa.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Products are a powerful way to encapsulate Zope applications and object classes,
    but they often require more diligence, attention to detail, and knowledge of the
    Zope core than coding in the Zope management screen. Although the development
    time may be longer for a product-based approach, the payoffs in terms of productivity,
    reusability, portability, and control are often worth it. It is not uncommon,
    however, for applications to be prototyped through the web using only DTML and
    ZClasses (because of their rapid development time) and then ported to Python-based
    products for production.


    To show how to use Zope in conjunction with roles, permissions, and users, we
    will create a simple product called "Website". The key points we present focus
    on this particular sample product, but several more general points apply to all
    products.


    Our sample product will allow you to create a website that will permit users to
    log in and create, edit, and delete users. It will not be particularly complex
    or demanding to write. Nevertheless, the structures you will create for this example
    are fundamental to the creation of all products and handling Zope users, roles,
    and permissions programmatically.


    # A Tool for Creating Objects


    Products are an important tool for creating custom objects in Zope. In a product,
    you can encapsulate all of the components needed to create and manage a website
    application, which is essentially Zope''s main purpose.


    Many products will enable a Zope manager to create instances of Zope, which in
    our case is an actual website. And, of course, the manager can create multiple
    instances of the website if desired.


    The manager sees the second-tier view of the product, in the Zope management screen.
    A normal site user sees the product in the third tier, which displays the product''s
    top level user interface. The user is generally unaware of the product itself
    and does not see it directly; it functions seamlessly with the rest of Zope. Only
    the product''s added functionality is apparent to the user in the third tier.


    > Because products can usually be instantiated many times throughout a Zope application,
    they can often serve as a customizable framework that may be adapted to a user''s
    requirements throughout the application.


    # Constructing a Product


    Products are coded externally to Zope, using text editors. All essential Python
    methods and objects needed for creating a product instance in Zope (DTML methods
    and so on) are created with a text editor and stored in the product directory.
    (DTML methods are created in the product directory as text files with the file
    extension .dtml).


    The following sections describe the various files needed to construct our sample
    Website Zope product.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 15.2.1 Bootstrapping the Product


    We need a mechanism that will provide us with an instance of the product—something
    that will actually create an instance for us. This mechanism must be included
    in our product so that the Zope manager can create an instance using the Zope
    management screen.


    Constructors coded in Python by Zope can also be used elsewhere in our product
    (see section 15.4 for more information on the main constructor method of the Website
    product).


    Among other things, registering these methods causes the product to appear in
    the add menu of folder objects, with a name that is the metype we assign to our
    product''s class. Our example will be users choose the metype "Website".


    The product also provides a form that users complete when the product''s metype
    from the add menu. When this is submitted, the appropriate constructor method
    is called to create the product instance in the Zope folder.


    To accomplish these operations, your product will include not only Python code
    and modules, but also DTML files for the forms, management, and user interface
    of your product, as well as additional files such as images, data, and configuration
    files. These ancillary files are often exposed to Zope via wrapper classes that,
    for example, can convert a DTML text file into a DTML method object (see section
    15.4.3 for details).


    With all objects in Zope (and Python object-oriented languages as a whole), a
    product is based on one or more classes that ensure that essential elements are
    "inherited" by each instance of the product. This class defines, among other things,
    the methods each instance of the product requires to perform its functions. The
    methods in our sample product are addUserUser() and deleteWebsiteUser().


    For a product to create instances within Zope, a class must be assigned to it
    and associated with the appropriate methods and other elements, such as icons.
    In our example product, we also call this class "website" (see section 15.4.2.3,
    "Class Definitions").


    # 15.2.2 Necessary Components


    To working a product, we must create the following components:


    +   - A subdirectory in lib/python/Products to contain the product''s files. When
    you start the Zope server, it will search the Products directory and register
    all it finds, including new or changed ones (See section 15.4.1).


    +   - The product directory must contain an __init__.py file, which Zope executes
    at startup to initialize and register the product. If you create Python modules
    in additional subdirectories inside your product, each subdirectory must also
    have an __init__.py file (See section 15.4.5.1 for more information.)'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'Your product must include a way for users to create an instance of it in Zone,
    including an entry (which is the metatype), as well as a form in which the user
    can enter the basic data for the instance. To provide this functionality, include
    the proper product registration code in the product''s__init__.py, provide a DTML
    file to create the add, and code a constructor method in the product''s main module.
    (See sections 15.4.3, 15.4.4, and 15.4.5).


    Files created by the product in the third tier (HTML, DTML, and normal text) are
    created using a text editor and stored in a dtml subdirectory of the product directory
    with the .dtml extension.


    To ensure that Zone can access the product''s interface, the dtml files in the
    product directory must be integrated into Zone as DTML methods. Consequently,
    the product code must contain a Python method that adds .dtml files as actual
    DTML methods inside Zone or creates the DTML methods as attributes of the product''s
    class. (See section 15.4.2.2).


    When say "dtml file" we mean a file created in the product directory; "DTML Method"
    refers to the corresponding Zone object.


    # 15.2.3 User Structure


    Let''s have a look at the user structure, the major function of our sample product.
    We want to allow a specific group of visitors to our website to create new users
    and prevent users not in this group from doing so.


    To accomplish the latter, we need to include Zone''s security features in our
    product (see Chapter 6 for more information on the Zone security structure). To
    accomplish the former, we''ll use built-in Python methods to create a role (which
    we''ll call "WebsiteUser") to which our authenticated users will belong. We''ll
    then assign the appropriate permissions to this role to allow its members to create,
    edit, and delete users.


    To differentiate between these two groups of visitors, we''ll use Zone''s password
    authentication. Our example requires a security system that distinguishes among
    visitors to the website and determines whether each has permission to create users.
    Visitors with this permission are considered authenticated users, but are prevented
    from accessing the Zone management screen.


    # 15.2.4 Roles/Permissions Structure


    We''ll set the security settings in the Python module where we create the necessary
    role/permissions structure (see section 15.4.4, "The Constructor Methods of the
    Main Module") so that visitors to the website with the role "WebsiteUser" cannot
    access the Zone management screen.


    Although it is very easy to create users from the management screen, we want to
    restrict visitors to creating, editing, and deleting users in the third tier (that
    is, via the website). They must not be allowed to access the management screen
    of Zone—which would allow them to do much more than just create users.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# 15.3 Product Construction at a Glance


    To create a Zope product and then a new product instance using the management
    scheme, follow these general steps:


    +   1. Create a directory in lib/python/Products of your Zope installation (see
    section 15.4.1).

    2. Code the necessary files for the product and save them to the product directory.
    (See section 15.4).

    3. Restart the Zope server so that Zope will recognize the new product.

    4. Select the product metatype from the folder''s add list to access the form
    for creating a product instance (addWebsiteForm.dtml).

    5. Complete and submit the form using the Add button to create an instance of
    the product.


    # 15.3.1 Major Components


    A Zope product''s main components are as follows:


    `__init__.py`, the product constructor, identifies the product and registers and
    initializes it in Zope''s product list.


    `product.py`, the product''s main module, contains the Python code that instantiates
    your product in Zope (the constructor method), the product''s class definition(s),
    and ancillary methods and functions. You can replace the name "Product" with any
    name you choose, but you must keep the file extension .py.\icon.gif is used as
    an icon for product instances. It appears to the left of the id of a product instance
    in the Zope management screen. (Zope icons measure 16x16 pixels.) Icons and other
    static product content are generally placed in a www subdirectory of the main
    product directory.


    metatype is the unique identifier for your product''s class(es). Each class added
    via the folder''s add menu in the management interface must be assigned a unique
    metatype.


    add.dtml contains the form for creating a product instance. This form appears
    when you select the product from the folder''s add menu. DTML files like this
    are generally placed in a DTML subdirectory of the product.


    Python constructor methods create the instance and store it in Zope. (They are
    generally coded in the main module.)


    Product classes define the data elements (properties) and methods available in
    the product''s instances.


    Additional .dtml files or image files, if necessary, including support files (discussed
    in section 15.4.1) to provide additional information on the product or on your
    own support methods (discussed in section 15.4.1.3).'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# 15.3.2 Support Files


    Add support files to a document it or to modularize its code, making it more readable
    and easier to maintain. You may include the following common support files to
    enhance your product.


    # 15.3.2.1 README.txt


    This file can contain a description of your product, product license or similar
    item. To see an example, go to the Zope folder Control_Panel/Product_Management,
    click on the installed product, then highlight the README.txt file in the corresponding
    directory; a README appears in the tab bar. When you click on this tab, the text
    in the README.txt file is displayed, as shown in Figure 15-1.


    ![](img/43a28cce5475b2f487bf455365567fb6_303_0.png)


    Figure 15-1: The README tab in the tab bar far a product


    # 15.3.2.2 version.txt


    The version number in this file appears after the product name in the Control
    Product Management screen in Zope, as shown in Figure 15-2.


    | beehvecal (Installed product beehvecal (0.3.1)) | 2001-05-20 22 46 |


    Figure 15-2: The version number appears after the product in the Product_Management
    screen


    # 15.3.2.3 support.py


    It is a good idea to create a file containing frequently needed Python methods
    that you will not have to repeatedly create them in your product; you will be
    able to import them instead into your product''s main module from the Python methods
    in the support.py file in your product directory. If your product automatically
    creates non-folder objects (such as DTML documents/DTML methods, images, and so
    on) when you create an instance, the relevant files (file1.dt, file2.dt, image.gif,
    and such) must also be located in your product''s directory. If they are in a
    subdirector of the product directory instead, make sure you use the full paths
    to the files in Python commands used for creating the objects.


    # 15.3.3 Putting It All Together


    Figure 15-3 shows all of the components that make up a complete Zope product.


    # 15.4 Creating the Website Product


    We''re now ready to build the Website product. In the following sections we will
    build and assemble all of the necessary components we''ve described, and when
    we''ve finished, we''ll have a completed Zope product.'
  merge: -1
  img_proc: true
