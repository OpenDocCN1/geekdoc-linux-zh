  md: 'Let''s look at Lines 24 through 28 in detail, which insert available photos
    for the Book. Because a Book is a folderish object, its images can be contained
    inside the Book itself.


    To display images, we use a dtml-loop on the value returned by the method objectValues
    (Line 24). Remember that this method returns a list of the objects contained by
    a folder or folderish object, and the first dtml- (Line 14), which loops through
    the Book objects in the books folder, places each Book instance at the top of
    the namespace in turn. This means that our dtml- (Line 24) calls objectValues
    on the Book instance, whereas the first dtml- (Line 14) calls objectValues on
    the books folder (whichever folder this method is being called for).


    As you can see in this example, the namespace has as much to do with the behavior
    of your DTML code as anything else. To avoid many errors and bugs in DTML code,
    pay close attention to the current state of the namespace stack.


