- pgno: 391
  md: 'The methodVocabulary() gets the vocabulary for the relevant ZCatalog as an
    object.


    manage_edit(self, RESPONSE, URL1, threshold=1000, REQUEST=None)

    This method is used only to change the threshold (see section 11.2.6, "The

    Advanced Screen"). If you do not enter a value for the threshold, the threshold

    will be set by default to 1,000 transactions.


    RESPONSE and URL1 must be passed when calling the method, but

    other parameters are not essential. For example, the following entry can be used:


    ```

    <xml-call "manage_edit(RESPONSE, URL1, threshold=50000)">

    ```


    manage_subbingToggle(self, REQUEST, RESPONSE, URL1)

    This method is used to switch subtransactions on and off. After the method has

    processed, Zoop displays the Status screen.


    manage_catalogObject(self, REQUEST, RESPONSE, URL1, urls=None)

    This method is called when you click the Update button on the Cataloged_Items

    screen for specific objects check boxes have been activated. It reindexes

    the selected objects. The URL parameter specifies a list in the path to the

    relevant object is saved.


    manage_uncatalogObject(self, REQUEST, RESPONSE, URL1, urls=None)

    manage_uncatalogObject() method is called when you click the Remove but-

    ton on the Cataloged_Items screen. As with manage_catalogObject(), urls speci-

    fies a list of paths for selected objects. Using this method, you can delete all

    selected objects from the ZCatalog.


    manage_catalogReindex(self, REQUEST, RESPONSE, URL1)

    Using this method, you can reindex the entire ZCatalog. This method is called

    when you click the Update Catalog button on the Cataloged_Items screen.


    manage_catalogClear(self, REQUEST=None, RESPONSE=None, URL1=None)

    This method is called using the Clear Catalog button on the Cataloged_Items

    screen. It deletes all references to the indexed objects from the ZCatalog.

    objects themselves are not deleted.


    manage_addColumn(self, name, REQUEST=None, RESPONSE=None, URL1=None)

    This method is called using the Add button on the MetaData_Table screen. You

    can create a new column in the metadata table or on the search results

    page.


    manage_delColumns(self, names, REQUEST=None, RESPONSE=None,

    URL1=None)

    Using this method, you can delete columns from the table of metadata; the rela-

    tive metadata is no longer displayed on a search results page. The method is

    called when you click the Delete button on the MetaData_Table screen. The

    names parameter specifies a list of the names of the metadata to be deleted.'
