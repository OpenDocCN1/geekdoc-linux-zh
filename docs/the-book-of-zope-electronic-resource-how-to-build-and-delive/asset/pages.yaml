- pgno: 268
  md: '# 13.1.1 Numeric Types


    Numeric data of various kinds can be stored and manipulated in Python. These types
    range from simple integers to complex numbers.


    # 13.1.1 Integer Values


    Integer values are whole numbers between -2147483647 and 2147483647. If you use
    numbers outside this range, or if you use expressions with results outside this
    range, an error message will appear.


    Integer numbers cannot begin with zero or they will be interpreted as octal numbers.


    | Example | Result of Evaluation |

    |---|---|

    | 123 | 123 |

    | -3456 | -3456 |

    | 2147483647 | 2147483647 |

    | 2147483648 | Zone error |


    # 13.1.1.2 Long-Integer Values


    Long-integers are also whole numbers. However, unlike integers, they can grow
    to unlimited size, as long as their size does not exceed the amount of memory
    of the computer. A long-integer value is produced by adding a lowercase or uppercase
    letter L (“l” or “L”) to the number, allowing you to use whole numbers of any
    size as well as expressions whose evaluation can grow to an unlimited size.


    | Example | Result of Evaluation |

    |---|---|

    | 999999999999L | 999999999999L |

    | 2147483648L | 2147483648L |

    | 9 * 999999999999L | 8999999999999L |


    # 13.1.1.3 Floating-Point Numbers


    Floating-point numbers are positive and negative real numbers that use a period
    (.) to indicate the number of decimal places. In the case of larger values, you
    can use scientific notation by inserting either a “e” or an “E.”'
  merge: -1
  img_proc: true
