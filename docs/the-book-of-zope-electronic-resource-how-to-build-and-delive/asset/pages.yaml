    # 9.3.6.1 Defining Properties in a Property Sheet


    A property (attribute of an object) consists of an id and a default value, as
    well as a property type. The following property types are available (see section
    3.1.6 for more information):


    | Property Type | Description |

    |---|---|n| baalean | A property with two discrete values: true or false. Represented
    the property sheet by a checkbox. |

    | date | A date and time value that cannot be empty in the property sheet. This
    property shares all of the functionality of the DateTime and ZTime objects. (See
    Appendix A for more information on working with dates.) |

    | float | A floating point number, often used to represent fractional or monetary
    values. Floats must always have a value assigned. |

    | int | An integer, either positive or negative in value with no fractional part.
    The range of values may vary an different operating systems, but will always have
    a precision of at least 32 bits. Int properties will not allow empty value. |

    | lines | A list of text strings with each list item on a separate line. Useful
    for multiple word keywords or an arbitrary number of values. |

    | lang | An integer value without an upper or lower value range. Use this property
    for extremely large numbers that may exceed several billion in value. |

    | string | A single line string of text of unlimited size. This is probably the
    most commonly used property type. |

    | text | A multiline string of text of unlimited size. Uses a multiline text area
    on the property sheet, and is often used for long string values such as descriptians,
    or lang passages of text data.


    170 Chapter 9'
