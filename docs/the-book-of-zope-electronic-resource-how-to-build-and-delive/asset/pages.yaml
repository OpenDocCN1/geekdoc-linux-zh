- pgno: 125
  md: '+   4. Enter the Properties screen for the folder, change the value of the
    title property, and save the changes.


    +   5. Leave this version (Update) and join Update2.


    As you can see in Figure 5-6, the folder Versionest is locked by Update because
    the change you made to the title property affects the entire folder. Consequently,
