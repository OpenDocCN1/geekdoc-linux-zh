    # 11.2.1 The Remove and Update Buttons


    The two buttons above and below the list, Remove and Update, relate only to the
    cataloged objects you''ve selected via their checkboxes. The Remove button removes
    the index and metadata entries for all selected objects from the ZCatalog, but
    does not actually delete the objects themselves. Removed objects are no longer
    searchable through the ZCatalog.


    If you delete a cataloged object from Zope, its entry in the ZCatalog is removed
    only if it is a catalog aware object. For all other objects, you must manually
    remove the entry from the ZCatalog on this screen.


    The Update button reindexes the selected objects and updates their metadata values.
    When you modify the content or properties of an indexed object, you must update
    it to keep the ZCatalog indexes and metadata in sync. Even cataloged aware objects
    do not reindex themselves automatically when they are modified.


    You can update all cataloged objects at once using the advanced screen (see section
    11.2.6.1 for more information).


    # 11.2.3 The Find Objects Screen


    The Find Objects screen (shown in Figure 11-5) lets you search for the objects
    you want to catalog and index. Use it to find and index new objects. Find Objects'
