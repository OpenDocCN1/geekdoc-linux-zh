- pgno: 78
  md: '# #4


    # # DTML


    ![](img/43a28cce5475b2f487bf455365567fb6_78_0.png)


    # ## 4.1 Essentials


    As a precursor to exploring how to create your own projects, this chapter will
    examine some concepts essential to understanding DTML, the most important of which
    are the first, second, and third tiers of DTML namespace. It will also explain
    the concept of *variable data*, which differs little from the conventional definition
    of a variable.


    # ### 4.1.1 First, Second, and Third Tiers


    The *first tier*, Zope''s programming level, is the base of all Zope applications.
    It includes the entire Zope source code as well as all modifications and expansions
    made using Python. Zope is usually expanded by creating a *product*, a third party
    software package that extends or enhances Zope''s functionality.


    The *second tier* refers to the management screen. You work in the second tier
    when you edit documents and methods, create objects, or use the Management screen''s
    various functions (introduced in section 2.2). Figure 4-1 shows the second tier
    view of the newly created DTML document document2.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/43a28cce5475b2f487bf455365567fb6_79_0.png)


    Figure 4-1: The second tier of a DTML document


    Users use the *third tier* when they view an object through the Internet published
    by a Zope server. Although current third tier users generally see only content,
    as Internet applications and users become increasingly more sophisticated, they
    will increasingly be able to contribute or control the look and feel of the website
    in some way. Because third tier users cannot see the Zope Management screen, the
    developer must create special custom interfaces in their applications to provide
    this functionality. Figure 4-2 shows document_2 as it appears in the third tier.


    ![](img/43a28cce5475b2f487bf455365567fb6_79_1.png)


    Figure 4-2: The third tier view of a DTML document


    The DTML code for an object is programmed in the second tier''s edit screen. When
    a DTML object is viewed in the third tier, Zope evaluates the object''s DTML code
    and returns the resulting text to the user''s web browser by *rendering*. Often,
    the text returned is HTML code (the code used to produce a standard web page),
    but it can also be plain text, XML, or any other textual document format. The
    important thing to understand is that DTML code is seen only by Zope and is never
    transmitted to the client user''s web browser.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'To view the generated HTML, display the document''s source in your browser.

    The source text for our sample document is shown in Figure 4-3.


    ```

