- pgno: 326
  md: '# 16


    # DEBUGGING


    ![](img/43a28cce5475b2f487bf455365567fb6_326_0.png)


    Debugging is often a programmer''s least favorite task. However, because everybody
    makes mistakes, the process of debugging is unavoidable for all programmers.


    This chapter explores the general concept of debugging and then looks at two debugging
    topics specific to Zope.


    # 16.1 Errors When Starting the Zope Server


    When you start a Zope server, a number of errors may cause the Zope process to
    terminate or run incorrectly, as follows:


    ```

    Error Value: Invalid python version

    ```


    Explanation: The Zope server is incompatible with the Python version you are using.
    This error is specific to UNIX because, under UNIX or UNIX-like operating systems,
    Python is not integrated into Zope, and in this case, you are using a version
    of Python that is invalid for use with Zope.


    Solution: Update your version of Python. (Windows versions of Zope are supplied
    with Python.)'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'Different errors occur depending on your operating system. See the relevant
    product documentation.


    ValueError: Invalid argument


    Explanation: You tried to start the Zope server with an illegal command-line option.


    Solution: See the file z2.pv in the Zope directory for information on how to use
    the options correctly.


    ValueError: Invalid number of threads


    Explanation: There are too many threads running.


    Solution: Limit the number of threads by changing the options in the start script,
    then restart.


    Error Value: Invalid Value for "x" option


    Explanation: An invalid value was given to the command-line option x.


    Solution: See the file z2.pv in the Zope directory for information on how to use
    the options correctly.


    # 16.2 Python and DTML Errors


    When your program displays an error message, you know something is behaving unexpectedly
    somewhere in your code. The art of debugging lies primarily in your ability to
    locate the cause of errors. Once you have located the error, correcting the problem
    is gravity routine.


    Error messages sometimes result from variable data in an inconsistent or unexpected
    state. For example, although you may think that at a specific time, a variable
    has a specific value or a function is called and the correct parameters are passed,
    this may not be the case. This condition may lead to an error message, or worse:
    unexpected and inexplicable behavior by the program. To find the error, check
    all of variable values when the bug appears.


    Because a program in a large project can have over a thousand lines of code, it
    is not practical to check every line. However, you can use several time-saving
    techniques to avoid such a "brute force" approach to problem solving.


    # 16.2.1 Binary Searching


    Zope allows you to perform binary searches to help you isolate the source of errors.
    In binary searches, the code is broken into halves, which are then searched to
    locate the error. The half that contains the error is then subdivided into halves,
    and so on, until the line that contains the error is found.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'For example, suppose you have tracked an error to a specific function in your
    program, but you do not know where the incorrect assignment takes place. Using
    binary searching (and assuming the function is 300 lines long) you can output
    the value of the variable in line 150 by artificially creating an error.


    The following Python line produces a run-time error that returns the value of
    a variable:


    ```

    raise RuntimeError, "The value of the variable xyz here is: " + str(xyz)

    ```


    In HTML, you would write the following code to create the same run-time error:


    ```

    <html><raise RuntimeError>

    <value of the variable xyz here is: <html-var name="xyz">

    </html-raise>

    ```


    If this variable has the correct value, the error must be in the second half of
    the function; otherwise, the error must be in the first half of the function.
    The error is in the second half of the function, you would output the variable
    in line 225; if the error was in the first half, you would run line 75.


    Using method, you can isolate errors by halving sections until you locate the
    line in which the incorrect call occurs. This involves a method, you must repeat
    this process on the method question until you find the incorrect assignment of
    the calculation. (Don''t forget to remove the error messages inserted when you
    finish debugging!)


    > When debugging external Python code, as in an external method or product, you
    can use the Python print statement to output variable values at run time without
    stopping the execution of the code. The printed values are output to the console
    window where the Zope server was started.


    # 16.2.2 Defensive Coding


    Large project is without errors in its first version, so you may well count on
    errors occurring from the outset and write your program to make debugging easier
    using these guidelines:


    +   - Use informative names for variables, objects, objects, functions and comment
    your code so that you (and others) can understand it later. Be consistent in your
    naming conventions and coding style.

    - Always write your code as if another person will be debugging it, even if that
    person will be you.

    - Code your programs in the simplest and most straightforward way possible. Avoid
    clever tricks and shortcuts that merely save typing.

    - Never write more than one instruction per line so that you can output your variable
    assignments in each line.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '+   * Modularize your code. Write short code blocks and keep the code in a
    single object or file manageable in size. It is much easier to debug small, logical
    parts of a program than one written as a single huge file.


    +   * Proofread your code and test it in your mind before running it to make sure
    you have not skipped any steps or misspelled or misplaced names.


    +   * Write "sanity checks" into your code to do this in Python is to convert
    arguments explicitly to the desired type before acting on them (use the float()),
    int(), str(), and list() functions for this purpose.


    These basic principles of good programming style will serve you well when it comes
    to debugging.


    # 16.2.3 Intermittent Errors


    The most difficult to find and fix are intermittent ones. Intermittent errors
    are often ignored because they happen only rarely and are therefore more difficult
    to notice or reproduce. But not fixing intermittent errors immediately will only
    cause you more problems, because as a program ages it becomes more difficult for
    the programmer to understand the code. So fix all errors as soon as you learn
    about them.


    To find intermittent errors, first try to reproduce it by creating a situation
    in which it occurred. Once you create the error at all, you will probably have
    discovered the cause of the error—or at least found a solid clue.


    In Zope, both the standard Python error messages and Zope-specific error messages
    may occur, as discussed in the following sections.


    # 16.2.4 Standard Python Error Messages


    Table 16-1 lists the standard Python error messages that may also occur when you
    are working with Zope.


    # 16.2.5 DTM Error Messages


    To debug DML code, you will often need to use a different procedure to find the
    error. Each time you create or modify an object, Zope performs a syntax check.
    If an error is found during this check, the object is neither created nor modified,
    and you will need to click the Back button to return to edit mode for the object.
    You must resolve all syntax errors before you can create, modify, or test an object.


    With exceptions, Zope error messages all have the same format (see Figure 16-1).
    They begin with the name of the tag that caused the error ("No closing tag") followed
    by the name of the tag that caused the error ("for tag <dtml-in>") and the location
    of the error ("on line 4 of index.html").'
  merge: -1
  img_proc: true
