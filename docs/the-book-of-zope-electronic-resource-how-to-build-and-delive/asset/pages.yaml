    When you copy a database, all objects are copied, including passwords and login
    names!


    # 3.3.7 Version Management


    Zope''s version features allows you to make changes in Zope privately, without
    affecting others using the site while you are editing. When you have finished
    editing and are sure your changes are correct, you can apply your changes all
    at once to the original version of your site. (See Chapter 5, "Working with Zope
    Versions," for more information on versions and version management.) The Version
    management screen (see Figure 3-19) makes it easy for you to work with versions.
    If you are not using versions, you will not need to use this tab.


    | Version |

