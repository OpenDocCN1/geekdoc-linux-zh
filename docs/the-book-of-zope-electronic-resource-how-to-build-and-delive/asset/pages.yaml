    # 13.1.1.4 Octal and Hexadecimal Numbers


    In addition to decimal numbers, you can use octal and hexadecimal numbers (base-8
    and base-16 numbers) in expressions. Octal numbers begin with zero (0); hexadecimal
    numbers begin with 0X or 0x.


    # Example | Result of Evaluation


    | Example | Result of Evaluation |

    | --- | --- |

    | 010 | 8 |

    | 05 | 5 |

    | 0X10 | 10 |

    | 015 | 21 |

    | 02F | 47 |


    # 13.1.1.5 Complex Numbers


    Complex numbers have a real and an imaginary component. In Python, a complex number
    looks like this: Real+Imaginary Part. The number is followed by the letter "j"
    or "J". This "j" or "J" must be preceded by a value; otherwise, Python will interpret
    it as a variable.


    # Example | Result of Evaluation


    | Example | Result of Evaluation |

    | --- | --- |

    | 6+6j | (6+6j) |

    | 6.9+0j | (6.9+0j) |

    | 1j | 1j |


    # 13.1.1.2 Sequential Types


    Python supports four sequential data types, including various collections of objects.
    The individual elements of these data types are indexed, meaning that each element
    has a position number. In Python, this numbering starts at zero, and the first
    element in a sequence is always index 0. You can use the built-in Python function
    len to determine the number of elements in a sequence.'
