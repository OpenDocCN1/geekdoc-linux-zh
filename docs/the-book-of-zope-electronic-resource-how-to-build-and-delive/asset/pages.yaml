  md: '# 13.3 Variables and Assignments


    User-defined variables begin with a letter or an underscore (_) and can be followed
    by any desired combination of letters, numbers, or underscores. Variable names
    cannot contain any special characters, with the exception of underscores, and
    they cannot be the same as any of the reserved words listed below.


    > Python is case sensitive and differentiates between uppercase and lowercase
    letters. For example, Python considers "Price" and "price" to be different variable
    names.


    # Python’s Reserved Words


    | and | elif | global | ar |

    |---|---|---|--|

    | assert | else | if | pass |

    | break | except | import | print |

    | class | exec | in | roise |

    | continue | finally | is | return |

    | def | for | lambda | try |

    | del | tram | not | while |


    Variables are assigned using the equal-sign (=) operator. An indicator (variable
    name) that appears on the left side of the operator is assigned the value on the
    right; for example:


    ```

    x=42

    a=[''Item1'', ''Item2'', ''Item3'']

    _hg78={1: ''Value1'', 2: ''Value2''}

    lengths=(1, 3, 5)

    x, y=12, 43 => x=12 y=43

    ```


    # 13.4 Indention


    One of Python’s unique features is the use of indentation. Unlike other programming
    languages, such as Java or C, Python does not use brackets or similar elements
    to identify the start and end of a block of code. Thus, instructions in the same
    block must be on the same indent level. A line of code beginning a block, such
    as a method definition or a looping statement, ends with a colon (:). See Listing
    13-1 for an example.


    Listing 13-1: Sample f() method showing indentation


    ```

    1 def f():

    2    for i in [1,2,3,4,5]:

    3      j=i+1

    4      print j

    5    return "All done. Bye Bye."

    ```'
