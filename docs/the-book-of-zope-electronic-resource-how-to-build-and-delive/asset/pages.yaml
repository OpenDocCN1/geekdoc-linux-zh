- pgno: 69
  md: '# 3.3 The Control Panel


    The Control folder, located just below the root folder, is automatically created
    with each Zone installation. Its functions let you examine or change settings
    that affect the entire Zone server (see Figure 3-13). Like a system folder, the
    Control Panel folder cannot be deleted.


    The first level of the Control Panel provides an overview of various system data
    relating to the currently running Zone server, including the following information:


    +   **Zope version** The version of the current Zope server.

    **Python version** The Python version used by the Zope server.

    **System platform** The type of computer running the Zope server.

    **Process id** The server program''s process id number, which allows the Zope
    server to be identified in the operating system.


    +   **Running for** The amount of time that the Zone server has been running.


    ![](img/43a28cce5475b2f487bf455365567fb6_69_0.png)


    > Figure 3-13: The Control Panel


    # 3.3.1 Shutdown


    When you click the Shutdown button you exit the Zope process, and you will be
    unable to access the Zope server until you restart it. Take extra care when using
    Shutdown: if several people are working on the same server at the same time, data
    may be lost because others who will be unable to save their changes.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# ### 3.3.2 Restart


    The Restart button appears only if the Zope server is running as a Win32 service
    or daemon control in a Unix system. Restart stops and restarts the Zope server.
    Before using Restart, be sure to notify others using the same server to prevent
    lost data or similar problems—especially because when you restart, it may be quite
    a while before the Zope server can be used again.


    # ### 3.3.3 The Database Management Screen


    The Control Panel provides access to functions that you can use to monitor the
    Zope database, manage the various Zope versions and products, locate errors, and
    perform debugging.


    All objects on a Zope server are stored in the Zope Object Database (ZODB). The
    Zope data is contained in the file Data.fs, located in the var directory of the
    Zope installation. The Zope Database Manager allows you to view the status of
    your database and to perform maintenance tasks, such as database packing and cache
    management. Its functions are accessed through the now-familiar system of tabs:


    # #### 3.3.3.1 The Database Tab


    Click the Database Management link to see information on the current status of
    the Zope database, as shown in Figure 3-14. The Database Location field shows
    the complete path to the Zope database file (Data.fs); the Database Size field
    gives its size.


    ![](img/43a28cce5475b2f487bf455365567fb6_70_0.png)


    Figure 3-14: The Database tab


    Click Pack to reduce the size of your database, but beware: Packing will remove
    Undo information from the database, preventing you from undoing certain actions.
    You can control this to some extent by specifying how old actions must be be deleted
    from Undo. For example, entering 0 days tells Pack to delete all Undo information,
    whereas entering 7 will delete only older than a week.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 3.3.3.2 The Cache Parameters Tab


    The Cache Parameters tab, shown in Figure 3-15, allows you to view and modify
    cache information, including the size and number of objects, as follows:


    Total number of objects in the database


    This field shows the total number of objects contained in the Zope database (in
    other words, stared in data.fs).


    Total number of objects in all of the caches


    This field shows the total number of objects currently in all caches.


    Target size


    This setting specifies the approximate maximum number of objects that can be contained
    in the cache at the same time. The smaller number, the smaller the cache. The
    default setting of 400 is generally sufficient. Using a smaller number will make
    Zope use less RAM, but at the expense of performance; a larger number could be
    used for high-traffic sites, with lots of objects, if your server has enough RAM.


    Target maximum time between accesses


    This setting specifies how much time must elapse between accesses an object will
    be automatically purged from the cache. The default setting of 60 means that objects
    that have not been accessed within the previous 60 minutes will be deleted from
    the cache.


