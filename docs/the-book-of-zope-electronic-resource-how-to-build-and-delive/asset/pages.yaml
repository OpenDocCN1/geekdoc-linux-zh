  md: 'For example, the following call displays no result on the screen and is there-fore
    not very useful.


    ```

    <html-call name="AUTHENTICATED_USER">

    ```


    The tag is, however, very useful for methods whose results are not to be displayed.
    For example, many Python methods return None as sign that they have run successfully.
    If you don''t want this message displayed in your document, use the call tag.


    The call tag is also frequently used to set variables. For example, you should
    want to create a list in a DTML method, you could do the following:


    ```

    <html-var expr="REQUEST.set(''list'', [''Schopenhauer'', ''Freud''])">

    ```


    The called method returns None and the var tag inserts this into the source text,
    "None" appears in the rendered output of the document. If you use the call tag
    instead, your list is generated without any text being added to the output, as
    follows:


    ```

    <html-var expr="REQUEST.set(''list'', [''Schopenhauer'', ''Freud''])">

    ```


    To prove that the lists were actually created, you can display the REQUEST object
    using the dtml-var tag.

    The call tag is very useful if you want certain actions to be carried out directly
    affecting the output of the document. For example, you want to add a new element
    to a list (easily done with the list''s append method), and you want the list
    to be displayed immediately. Were we to use the var tag on its own, we would not
    be able to achieve the desired results because "None" is returned by the append
    method. The best thing to do is execute the append method using the call tag and
    then render the list using the var tag:


    ```

    <html-var expr="list.append(''Nietzsche'')">

    <html-var name="list">

    ```


    The following text appears in the rendered output of your document:


    [''Schopenhauer'', ''Freud'', ''Nietzsche'']


