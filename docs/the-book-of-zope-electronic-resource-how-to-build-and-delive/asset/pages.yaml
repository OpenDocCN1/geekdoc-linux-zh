    folder.


    ![](img/43a28cce5475b2f487bf455365567fb6_167_0.png)


    Figure 8-2: Management screen with expanded Add Objects menu


    We want to give our friend Egon special permissions to access functions unavailable
    to Anonymous users. To do so, we create a new user called Egon (with the role
    Friend and a user-defined password) in the User Folder (acl_users) for the My_Homepage
    folder, as shown in Figure 8-3. (To create the Friend role, use the folder''s
    Security tab.)


    ![](img/43a28cce5475b2f487bf455365567fb6_167_1.png)


    Figure 8-3: Object list for the My_Homepage folder'
