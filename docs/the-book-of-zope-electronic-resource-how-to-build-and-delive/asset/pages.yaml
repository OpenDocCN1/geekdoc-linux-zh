    This chapter continues the overview of Zope classes (ZClasses) begun in Chapter
    9 and continues the development of our Zope product, Sales, to demonstrate the
    key ways in which you can use ZClasses in an application.


    # 10.1 Modifying the Constructor Methods


    In Chapter 9, you created a basic ZClass. In this chapter, you will modify the
    constructor methods created by Zope (discussed in section 9.3.3), because the
    default versions contain only the bare minimum of code needed to create instances
    of our BookClass ZClass.


