    # 12.3.2 Creating a Database with MySQL Monitor


    First, you''ll create a database called "MyDB", in which you will then store user
    data. with the following steps:


    +   1. Run the MySQL monitor as described above.

    2. Create a new database and name it mydb with the following command:


    ```

    mysql> CREATE DATABASE mydb;

    ```


    +   3. Select this database (you have to do this each time you start a new MySQL
    session) by entering


    ```

    mysql> USE mydb;

    ```


    In response, you should see


    ```

    Database changed

    ```


    You have now created and selected the database MyDB. Before you can add data to
    it, you need to create the appropriate tables in the database to hold your data.
    Define tables by specifying a table name and information about the table''s fields
    including field names, data types, and other data rules. Each field defines a
    single column of the table. Data in tables is stored as records; each record is
    a single row of the table with specific values specified for each field.


    To display all available databases, enter SHOW Databases; at the prompt.'
