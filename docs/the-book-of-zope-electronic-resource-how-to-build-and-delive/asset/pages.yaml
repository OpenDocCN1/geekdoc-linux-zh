- pgno: 313
  md: "Three ClassSecurityInfo methods allow you to make security assertions on methods\
    \ (subobjects) of an object, as shown in the following table:\n\n| ClassSecurityInfo\
    \ Method | Description |\n| declarePublic(methodName) | Makes the specified method\
    \ publicly accessible by all users, through the Web. Use this for innocuous methods\
    \ that do not need to be secured, which must be available to everyone including\
    \ anonymous users. |\n| declarePrivate(methodName) | This is the default. Methods\
    \ declared as private cannot be directly accessed through the Web, use this for\
    \ methods that should not be exposed or published directly through Zope. |\n|\
    \ declareProtected(PermissionName, methodName) | Methods declared as protected\
    \ are published only to users with the specified permission assigned to their\
    \ role(s). Use this assertion to allow Zope managers to control access to the\
    \ method via the Security management tab. |\n\nEach of the above methods will\
    \ also take multiple methodName arguments.\n\nIn order for Zope to properly recognize\
    \ the security assertions of a class, you must call the InitializeClass function\
    \ of the Zope Globals module (see section 15.5.2.13).\n\n#  15.4.2.10 the addNewWebsiteUser\
    \ Method\n\nThe method addNewWebsiteUser() (shown in Listing 15.4) creates a new\
    \ user, once it determines that no such user exists in the specified User folder.\
    \ If a user with the same name exists, the method displays an error message (using\
    \ Message-Dialog) then returns you to the new_user page.\n\nAs you see in the\
    \ listing, a security assertion is made for this method (using the ClassSecurityInfo\
    \ object \"security\" defined in Section 15.4.2.5) before it is defined.\n\nListing\
    \ 15-4: The addNewWebsiteUser() method for the Website product\n\n```\n# Allow\
    \ users with the \"Manage users\" permission access to this method\nsecurity.declareProtected('Manage\
    \ users', 'addNewWebsiteUser')\n```\n\n```\ndef addNewWebsiteUser(self, name,\
    \ pwd, conf, roles, REQUEST, RESPONSE):\n    \"\"\"\n    Creates a new user if\
    \ the user name does not already exist\"\"\"\n    if self.acl_users.get(username=name):\n\
    \        return MessageDialog(\n            title='User already exists',\n   \
    \         message='There is already a user with this name.',\n            action='new_WebsiteUser'\n\
    \        )\n```"
  merge: -1
  img_proc: true
