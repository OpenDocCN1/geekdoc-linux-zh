    checkbox Open as Web Folder.


    ![](img/43a28cce5475b2f487bf455365567fb6_344_0.png)


    Figure 17-4: The Open dialog to use WebDAV


    +   3. Click on OK.


    The objects on the Zope server are displayed in a window similar in layout to
    Windows Explorer, as shown in Figure 17-5.


    You can now use the objects as you would files in Windows Explorer, meaning you
    can move, delete, and copy objects. You cannot, however, edit or modify any objects
    directly from this window.


    External Data Access 327'
