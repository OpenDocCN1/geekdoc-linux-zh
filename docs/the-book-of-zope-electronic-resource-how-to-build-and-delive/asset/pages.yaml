    This method returns all of the objects in the ZCatalog that have been indexed
    in the categories listed in name, the title of the metadata column.


    getpath(self, rid)

    The transfer argument, rid, is the integer of the object being searched for in
    the catalog. This method returns the path for this object.


    getobject(self, rid, REQUEST=None)

    This method requires only the transfer argument, rid (data_record_id). The rid
    value is the integer identifying indexed object you are searching for.


    schema(self)

    This method lists all metadata present in the ZCatalog.


    indexes(self)

    This method lists all indexes contained in the ZCatalog.


    index_objects(self)

    This method lists all indexed objects in the ZCatalog.'
