    Figure 4-13. The email message displayed in Netscape


    > NOTE If a recipient lacks the correct application, the computer is improperly
    configured, or the mail program is incapable of doing so, the recipient may not
    be able to open attachments by clicking on them even though you set the content
    type correct.


    # 4.3.14 The comment Tag


    The comment tag indicates text to be ignored by Zope. It is not an empty and contains
    the following text:


    ```

    <html-comment>

    Comment text goes here.

    </html-comment>

    ```


    Zope ignores all text in the body of the tag, thus allowing you to insert comments
    explaining your source code, for example. The comment tag is also useful for fixing
    errors if, for example, you annotate parts of your DTML code to allow the focus
    to be placed on other parts.


    Comment tags may be nested. And, because Zope ignores everything by the comment
    tag, you can annotate other comment tags so you can insert and check code sections
    piece by piece to fix problems.


    ```

    <html-comment>

    This text is ignored by Zope.

    <html-comment>

    This text is also ignored by Zope.

    </html-comment>

    And so is this text!

    ```'
  merge: -1
  img_proc: true
- pgno: 116
  md: "Annotated text does not appear as a comment in the source text in the third\
    \ tier. Use the standard HTML comment if you want it to appear in the rendered\
    \ source.\n\nThe comment tag accepts no attributes.\n\nUnfortunately, the comment\
    \ tag does not completely ignore DTML tags placed inside its body. Although no\
    \ code inside a comment is ever executed, it must still be well formed and balanced\
    \ for the DTML parser to accept the document. Because of this, it is not possible\
    \ to comment out the start of a dtml block (a dtml-ij block, for example).\n\n\
    # 4.3.15 The try and the except Tags\n\nYou may wish to access a variable even\
    \ though you do not know whether it has been defined or whether you can consult\
    \ it. If you try to access a non-existent variable, Zone will generate an error\
    \ message, just as a faulty expression is called. You might also be making a call\
    \ that relies on an external system that could fail, as sending an email as above.\
    \ These operations can be a problem in certain circumstances because the error\
    \ message prevents you from displaying a document in the third tier.\n\nUse the\
    \ try and except tags to bypass error messages. The try tag is a non-empty tag\
    \ and accepts no attributes. It contains the instructions to be carried out but\
    \ which may generate a Zone error. It can also include one or more except tags,\
    \ which may contain alternative instructions to be carried out. The except accepts\
    \ an optional attribute that identifies the type of error traps. If the attribute\
    \ is omitted, the except block traps all errors not already trapped above it.\n\
    \nThe following structure is used:\n\n```\n<dtml-try>\n  Instructions that can\
    \ fail or cause errors\n  <dtml-except>\n    Instructions to handle the error\
    \ or exception case Error\n  <dtml-except>\n    Instructions to handle any other\
    \ errors.\n</dtml-try>\n```\n\nFor example, say we have a variable that we want\
    \ to use as a divisor in an expression and we want to trap any errors caused by\
    \ the expression tries to divide by zero. To trap the error and bypass a Zone\
    \ error message, use the try tag as follows:\n\n```\n<dtml-try>\n  The result\
    \ is: <dtml-var expr=\"100/x\">\n  <dtml-except-DivideByZeroError>\n    The result\
    \ could not be displayed.\n</dtml-try>\n```\n\nThe code above bypasses the error\
    \ message so that the remainder of the document can be displayed. The person viewing\
    \ the document is informed that the result could not be displayed."
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 4.3.16 The finally Tag


    The finally tag can only be used within the try tag. To define a block of instructions
    that will always be carried out regardless of whether an error message needs to
    be bypassed, use the finally tag instead of the except tag, as follows:


    ```

    <dt-try>

    Instructions

    <dt-finally>

    Instructions to be carried out in all cases

    </dt-try>

    ```


    # 4.3.17 The raise Tag


    Use the raise tag to cause and generate your own Zope error message. You can define
    your own names for your error messages and define the error text to be displayed.

    The raise tag is non-empty. The error message belongs to the start tag and the
    error text is placed in the tag body. The error message must consist of individual
    words. You can specify entire texts for the error text.


    ```

    <dt-raise Errormessage>Error</dt-raise>

    ```


    The following code produces a simple error message:


    ```

    <dt-raise MyError>This is the problem.</dt-raise>

    ```


    The error output is shown in Figure 4-14.


    ![](img/43a28cce5475b2f487bf455365567fb6_117_0.png)


    Figure 4-14: The self-defined error message


    You can also use dump-raise to generate internal Zope errors. One such error,
    Unauthorized, can be raised to log the current user out of Zope:


    ```

    <dt-raise Unauthorized>You are logged out.</dt-raise>

    ```'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# ### 4.3.18 The return Tag


    The return-tag can be used to interrupt the execution of DTML at any time and
    return a value without raising an error. Normally DTML objects return only text,
    with dtml-return they can return any type desired—including other objects. The
    following example returns only the number 25; all of the other text that would
    normally be returned is ignored.


    ```

    the document id is: <dtml-var name="id">

    <dtml-return expr="25">

    ```


    # ### Summary


    You should now be familiar with the DTML syntax and know the most important general
    DTML tags, which will allow you to create websites with dynamic content. Among
    other things, you can


    +   - Insert and format content from variables, objects, or expressions using
    dtml-var.

    - Use the namespace variable (_) to look up names and call utility functions.

    - Communicate between client and server using the REQUEST and RESPONSE objects.

    - Call objects without insertion using dtml-call.

    - Conditionally execute code using dtml-if.

    - Manipulate the namespace stack using dtml-with and dtml-let.

    - Iterate lists and sequences using dtml-in.

    - Traverse and iterate a hierarchy of objects using dtml-tree.

    - Send mail messages and file attachments using dtml-sendmail.

    - Catch and raise errors using dtml-try and dtml-raise.

    - Return arbitrary values using dtml-return.'
  merge: -1
  img_proc: true
