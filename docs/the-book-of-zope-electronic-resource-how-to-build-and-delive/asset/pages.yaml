- pgno: 66
  md: '# Save to file on server


    Select this option to store the exported file on the server (computer on which
    the Zope server is running). The standard target directory here is the var folder
    for Zope installation. (This variant is particularly useful if several Zope servers
    are running on a single server; it allows you to easily transfer objects to another
    Zope server.)


    # XML format?


    Select this option to export an object in XML format. If you leave the box unchecked,
    it is saved in binary format with the file extension .zep.


    ![](img/43a28cce5475b2f487bf455365567fb6_66_0.png)


    You can export Zope objects to a file to transfer them to a different Zope installation.
    You can either to download the exported file to your local machine, or save it
    in the "var" directory of your Zope installation.


    You may import objects which have been previously exported to a file, by placing
    them in the "import" directory of your Zope installation. You should create the
    "import" directory in the root of your Zope installation if it does not exist.


    Note that by default, you will become the owner of the objects that you are importing.
    If you want the imported objects to retain their existing ownership information,
    select "retain existing ownership information"


    Figure 3-10: The Import/Export screen


    You can also export an object by selecting it in the Contents overview and then
    clicking the Import/Export button. The Import/Export screen appears with the id
    of the selected object already in the id field. (If you select two objects on
    the Contents tab, only the first one will appear in the id field.)


    # 3.1.9.2 An Export Example


    The following steps show you how to export the DTML method index_html in XML format
    and save it on the machine that your Zope server is running on. You can find the
    exported file in the /var directory of your Zope installation.


    +   1. Change to the root folder and click the check box next to index_html.

    2. Click the Import/Export button.

    3. Select both the Save to file on server and XML-Format options.

    4. Click Export.


    You will be notified when the object is successfully exported, as shown in Figure
    3-11.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Figure 3-11: The file index.xml is created and soved in the specified directory


    If you have access to the server, you can view the XML file in your web browser
    or preferred editor.


    # ### 3.1.9.3 Importing Objects


    Before you can use an object exported from one Zope server to another, you must
    import it by placing it in the import directory of your Zope server. You should
    create the import directory in the root folder of your Zope installation, if it
    doesn''t already exist.


    When importing objects, you have these options:


    | Import file name | Enter the full name of the file containing the object to
    import. |

    | Take ownership of imported objects | When activated, this option automatically
    makes you the owner of imported objects. |

    | Retain ownership information | Activate this option to retonin the objects''
    current ownership settings. |


    # ### 3.1.9.4 An Import Example


    Now that we''ve exported our file, we can import it. It makes little sense to
    import a file from the same server, so if you have several Zope servers running,
    change servers and proceed from there. Otherwise, just use your existing server.


    +   1. Open the folder where you want to store the imported object.

    2. Click the Import/Export tab or button.

    3. Copy the exported file to the import directory of the Zope server where it
    is to be imported.

    4. Enter the complete filename in the Import file name field: index_html.xml in
    this case.

    5. Click Import.


    # ### 3.2 The Help Button


    Zope provides a really useful help system. The Help button at the top-right corner
    of each view on the management screen is your point of access. Click the Help
    hyperlink for information on the current view and related functions. When you
    click Help, a pop-up window opens containing relevant information, as shown in
    Figure 3-12.'
  merge: -1
  img_proc: true
