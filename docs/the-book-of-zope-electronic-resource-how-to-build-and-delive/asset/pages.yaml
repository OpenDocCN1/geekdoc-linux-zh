- pgno: 18
  md: '# PREFACE


    # Who Is This Book For?


    We have designed this book as an introduction to Zope for beginners, and as a
    more complete reference for experienced users. We hope that it makes getting to
    know Zope much easier for you and that it will form the basis for your productive
    work with Zope. The following will be both beneficial and important, especially
    for later chapters:


    +   - HTML knowledge is helpful.


    +   - Python knowledge is necessary for later chapters.


    This book stems from our Zope documentation (marketed as E-Books in English and
    German throughout the world—visit www.behive.de for more information). The E-Books
    deal only with individual aspects of Zope, but this book will describe and explain
    all of the fundamental characteristics and technologies of the Zope system.


    # What Version of Zope Does It Cover?


    This book deal with versions of Zope through version 2.3. As such, we recommend
    you start with Zope version 2.3 or earlier and use this book as your guide. You
    should install the latest version of Zope only after you have mastered the basics
    of Zope covered in this book.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'As new versions of Zope are released, we will add to and update this book by
    posting additional and reworked chapters at www.beehive.de/~zope/books/TheBookOfZope.html.

    (This update concept proved to be a great success with our electronic books on
    Zope and an effective way of bridging the gap until the next edition is published.)


    We welcome your comments or suggestions. Just mail us at zopebook.com. We will
    endeavor to include your suggestions in the online updates and in future editions.


    # How to Use This Book


    Depending on your level of experience, you can work through this book in any of
    the following ways.:


    # Zope Beginners with HTML Knowledge


    Once you have completed Chapters 1 through 8, be sure to have a Python book close
    at hand to give yourself the Python knowledge necessary for Chapter 9.


    # Zope Beginners with Both HTML and Python Knowledge


    You can work through the book on your own from beginning to end.


    # Advanced Zope Users with No Prior Knowledge of Python


    If you already have some experience with DTM, you can begin with Chapter 4 or
    5. You will, however, need Python knowledge for Chapter 9.


    # Advanced Zope Users with Prior Knowledge of Zope


    You can start using the book from Chapter 4 or 5. Chapter 11 requires no pre-knowledge
    and can be read at any time. Once you have worked through the book at your own
    pace, you can use the individual chapters and appendices as reference material
    during your continued work with Zope.


    # Where Did Zope Come From?


    The idea for Zope arose from software developer Jim Fulton, after he presented
    a CGI programming course. Jim, who is a huge fan of object-oriented software,
    finding CGI extremely impractical because the programs were seriously lacking
    in their ability to build on each other. This often resulted in a lot of code
    being forgotten or rewritten unnecessarily.


    Jim wanted to create modules that could be used over and over again, regardless
    of the type of web application he wanted to develop. To that end, he designed
    a number of software modules for his employer, Digital Creations, including "Bobo"
    and later "Document Template" (which is particularly loved among Python programmers).


    Digital Creations used Bobo and Document Template, together with other unreleased
    modules, as the basis for their consulting and development projects.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'This combination of self-designed, freely available modules and commercial
    modules was marketed by DC as Principia.


    The investment banker Hadar Pedhazur, user of both Python and the freely available
    Digital Creations software Bobo, liked Digital Creations and began speaking with
    its chief executive, Paul Everett, about investing Principia as open source software
    to guarantee the quickest market penetration. Indeed, market penetration and awareness
    were the biggest problems for Principia, Digital Creations had neither the marketing
    budget nor the high profile of other manufacturers of web application servers
    such as Apple (Web Objects) or Allaire (Cold Fusion).


    Another reason for making Digital Creations'' web application open source was
    that the revenues from software licensing would be negligible compared to the
    revenues from providing solutions to Principia. In other words, the more Principia
    users who changed to Zope as a result of the open source license, the more positive
    the effects on Digital Creations'' main source of income: consulting and solutions
    development.


    Once the decision was made to take Principia down to open source, it was time
    to find a new name for this open source platform. Eventually, the company chose
    the name Zope, which stands for "Z Object Publishing Environment."


    # About the Authors


    Enough about Zope and this book, it''s time to introduce ourselves. We all have
    something in common beyond our enthusiasm for Zope: We all work for the same Berlin
    and Washington, D.C.-based company, Beehive, L.L.C., which has been providing
    Zope solutions for many years. The following "bees" lent their skills to this
    book: Katrin Kirchner, Martina Blockmann, Nico Grubert, Mark Pratt, Sebastian
    Luehsdorf, and Alexander Schad.


    Special reference should be made to the work of Katrin Kirchner, Martina Blockmann,
    and Nico Grubert. Not only did they write the vast majority of this book, but
    through their electronic books (E-Books) and training courses held throughout
    Germany, they have also helped hundreds of developers join the Zope community.
    These training courses are also available through our Washington, D.C., office.


    At beehive we would like to thank the staff of dpunkt.verlag and especially René
    Schönfeldt, who was always there for us with suggestions and constructive criticism
    regarding how we could improve this book.'
  merge: -1
  img_proc: true
