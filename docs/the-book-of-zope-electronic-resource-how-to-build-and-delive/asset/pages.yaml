  md: '# CreateInstance_html


    CreateForm_html calls the DTML method CreateInstance_html to create a book instance
    using the specified id value. CreateInstance_html is shown in Listing-10-6.


    Listing 10-6: The DTML method CreateInstance_html, which creates a new book instance


    | 1 | <dtml-if name="create"> |

    | 2 | <dtml-let NoRedir="manageProduct(''Sales'')"> |

    | 3 | <dtml-with expr=addProduct(''Sales'')"> |

    | 4 | <dtml-call name="BookClass_add"> |

    | 5 | </dtml-with> |

    | 6 | </dtml-let> |

    | 7 | </dtml-if> |

    | 8 | <dtml-call expr="RESPONSE.redirect(''admin_html'')">"> |


    Let''s examine this code more closely. First, the name create is tested using
    dtml-if (Line 1). This determines whether the user pressed the Create button in
    the CreateBook_html form (see Line 39 of Listing 10-5). If the user instead pressed
    the Cancel button, the code inside the dtml-if would not be executed because the
    name create would not be submitted from the form.


    Assuming the Create button was clicked, Line 2 using dtml-if. This value is checked
    by our modified BookClass_add constructor to suppress the default redirection
    to the management screen (see Listing 10-5). In this case we want to redirect
    to our own management screen (admin_html).


    We use dtml-if (Line 3) to put our Sales product on the namespace so that we can
    access the constructor BookClass_add contained in it. BookClass_add is then called
    using dtml-call (Line 4), which creates a new Book instance in the current folder.
    The values from the CreateBook_html form along are passed to the variable NoRedir
    to the constructor because we call it by name. (If we called it in an expression,
    these values would need to be passed explicitly as arguments to BookClass_add.)
    Next, the dtml-with, and dtml-if are closed (Lines 5–7).


    Finally, we redirect the user back to the admin_html page, which will redraw the
    new Book instance just created. If the user clicks on the CreateBook_html form,
    this is the only line executed, and no book instance is created.


    # 10.3.3.2 EditForm_html


    EditForm_html displays a form in which you can enter new values for an object''s
    properties displays, such as a book''s title, author, publisher, and so on. The
    DTML for EditForm_html is shown in Listing 10-7.'
