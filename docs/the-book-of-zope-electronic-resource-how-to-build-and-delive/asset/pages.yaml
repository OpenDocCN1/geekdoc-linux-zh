    \ on multiple lines for readability):\n\n```\ncontext.registerClass(\n  Website.Website,\n\
    \  constructors = (\n    Website.manage_addWebsiteForm,\n    Website.manage_addWebsite\n\
    \  ),\n  permission = 'Add Website',\n  icon = '/www/icon.gif'\n)\n```\n\nLet's\
    \ look at the specific arguments we pass to register the Website class.\n\n+ \
    \  - For the first argument (instance_class), we pass the Website class from the\
    \ Website module using the Python dot notation (Website.Website).\n\n+   - Next,\
    \ we pass the two constructors for the class, the DTMLFile object manage_addWebsiteForm\
    \ (the form presented to the user when creating a Website as discussed in section\
    \ 15.5.3) and manage_add (the method that actually creates the Website instance\
    \ and stores it in Zope, as discussed in section 15.5.4). Since the constructor\
    \ function is first in the tuple being passed, it will be called when a user chooses\
    \ \"Website\" from the folder's add menu.\n\n+   - Next, a permission name is\
