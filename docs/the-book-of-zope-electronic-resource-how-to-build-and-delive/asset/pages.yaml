- pgno: 45
  md: '# 2.3.4 DTML Documents and Methods


    Now that you know how to insert images and other files into your Zope server,
    let''s look at DTML methods and DTML documents, the two of the most important
    Zope objects. Though somewhat similar, they differ greatly in the way they are
    used and how the acronym


    One drawback to HTML is that it does not work with dynamic content. DTML (the
    acronym for Zope''s Document Template Markup Language), on the other hand, lets
    you dynamically program web pages and work around this disadvantage in HTML. You
    can use DTML code in both DTML documents and DTML methods.


    DTML documents can be used to store text, complex documents, or any other content,
    such as information that you might use as content in your website. They are roughly
    analogous to a web page. DTML methods carry out actions on your data or content
    (for example, with external methods or creating dynamic content). They can also
    be used to modular complex web pages into simple components, each of which is
    a single DTML method; a separate DTML method or document then assembles these
    pieces into a web page.


    The most important difference between DTML methods and documents is that DTML
    documents can have their own properties, whereas DTML methods cannot assume the
    properties of the superordinate folder or the object they are called instead.
    For example, consider the following directory structure:


    /Folder1/Subfolder


    Upon opening Subfolder, you would find the DTML method method1 and the DTML document
    document1!. To display the id for each object, enter the line


    ```

    <dtml-var name="id">

    ```


    into the document. This will work for the DTML document, and your browser should
    display the id "document" at the upper left side of its screen.


    This is not the case with the DTML method; the id displayed on the screen reads
    "Subfolder." This result is unexpected, but it is nonetheless correct because
    method1 has no properties of its own. Instead, a DTML method uses the id of the
    folder in which it is located (Subfolder in our example).


    # 2.3.5 Creating a DTML Document


    To create a DTML document, navigate to the folder that will hold the new document,
    then select DTML Document from the Available-Objects menu. Fill in the configuration
    form with the following information (refer back to Figure 2-11):'
  merge: -1
  img_proc: true
