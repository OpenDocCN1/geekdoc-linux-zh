    URL1=None)

    This method is called when you click the Add button on the Indexes screen. The
    name parameter specifies the title of the new index, and specifies the type of
    index (KeywordIndex, TextIndex, or FieldIndex).


    manage_delindex(self, name, REQUEST=None, RESPONSE=None,

