- pgno: 62
  md: '# ### 3.1.6.4 The Tokens Property Type


    The tokens type is like the lines property, except token items are entered all
    on one line. For the tokens type, enter a string of words separated by blank spaces,
    which will be converted into a list.


    # ### 3.1.6.5 The Selection and Multiple Selection Property Types


    The selection produces a pull-down menu with items derived from a selection variable
    specified by the selection property''s value. The selection variable must be another
    property or method in the namespace of the object that returns or contains a list
    of string values—often a property set in a parent folder. You can select only
    one value at a time in a selection property.


    The multiple selection is like the above except you can select several values
    at once.


    # ### 3.1.7 The Undo Tab


    Use the Undo tab to undo your actions. When you click the Undo tab, it displays
    all actions carried out on the selected object. If the selected object is folderish,
    it displays the actions carried out on all objects in the current folder and allfolders.
    You can restore deleted objects, undo modifications, cancel copy actions, and
    so on.


    +   - Each action carried out on a Zope server is saved and listed in an overview,
    which can be accessed via the Undo tab. To view all actions carried out on the
    Zope server, select the Undo tab in the root folder.


    As shown in Figure 3-7, Undo shows the complete path to the object on which an
    action was performed, the method used, the user who performed the action, and
    the date and time of the action. This information lets you clearly identify an
    action and then undo it. To undo an action, select the appropriate checkbox and
    click the Undo button.


    You can undo only actions that are attributed to your username, or if other actions
    were subsequently performed on that object, Also, you cannot undo an action unless
    those subsequent actions act first. For example, if a DTML document was created
    and then subsequently edited, you can undo the create action only if you first
    undo the modifications made to the DTML document.


    To facilitate the undo process, select the check boxes for all consecutive actions;
    then, when you click Undo, all actions will be undone simultaneously.


