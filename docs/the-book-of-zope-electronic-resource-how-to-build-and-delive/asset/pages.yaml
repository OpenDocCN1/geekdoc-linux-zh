- pgno: 266
  md: '# # 13 PROGRAMMING ZOPE: PYTHON IN A JIFFY


    As discussed in Chapter 1, Zope is written mostly in the Python programming language.
    Therefore, to take full advantage of Zope, you must at least be familiar with
    Python''s basic characteristics—not just to use DTML''s syntax, but also to create
    Scripts and external methods, to use Python products, and to debug effectively.
    With a good grasp of Python, you will also be able to modifs and expand Zope to
    suit your needs.


    Zope lets you use Python code in three ways:


    +   - In Python scripts

    - In external methods

    - In products


    Python scripts, new to Zope 2.3 and higher, allow you to write Python code through
    the web much like DTML. Although you will not have access to all Python modules
    and functions (for security reasons), Python scripts are an excellent way to code
    business logic that would be difficult or cumbersome in DTML. They are also excellent
    for writing instance methods for your custom ZClasses. (Chapter 14 discusses Python
    scripts in more detail and offers some examples.)


    ![](img/43a28cce5475b2f487bf455365567fb6_266_0.png)'
  merge: -1
  img_proc: true
- pgno: 267
  md: "External methods are interfaces to external files (modules) that can Python\
