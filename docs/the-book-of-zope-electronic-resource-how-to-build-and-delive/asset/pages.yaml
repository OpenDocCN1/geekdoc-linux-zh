  md: '# 10.5 Ideas for Expanding Your Zope Product


    Now that you have created and worked with your first ZClass and Zope product,
    you should be able to create additional ones. Here are some ideas for expanding
    your Zope product:


    +   - Expand the product range and create additional ZClasses in your Sales product,
    such as a class for creating CD-ROM objects.

    - Extend the custom administrative interface to allow you to add or remove product
    photos.

    - Make your application even easier for customers to use by allowing them to order
    directly from the customer screen (index_html) by creating an additional ZClass
    called Orders to gather the data for an order.


    # Summary


    This chapter has given you a more detailed overview of Zope classes and, we hope,
    encouraged you to create your own products using ZClasses. Although the Zope product
    Sales is only one example of how you can use ZClasses, it demonstrates the basics
    of how to use Zope classes to create an application.'
  merge: -1
  img_proc: true
