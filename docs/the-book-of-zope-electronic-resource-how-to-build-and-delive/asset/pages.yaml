    | Rename | Cut | Copy | Delete | Import/Export | Select All |


    Figure 5-4: The Versions folder


    +   2. Create two version objects called Update and Update2, then join the version
    called Update as shown in Figure 5-5.


    +   3. Create a user named Meyer and assign the role of Manager to him.


