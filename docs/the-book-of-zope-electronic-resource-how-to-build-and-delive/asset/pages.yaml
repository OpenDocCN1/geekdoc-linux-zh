    | Copy to present | Compare | | | | | | |


    Figure 3-5: The History screen


    Figure 3-5 shows two previous versions of index_html, both of which are displayed
    with the date, time, and username. To view a version, click the corresponding
    link in the overview.


    The two buttons at the bottom of the History screen, Copy to present and Compare,
    offer these features:


    +   **Copy to present** Restores old versions. Select the version to restore and
    click this button to update the current document to that version. You can restore
    only one version at a time; if you select multiple versions, only the first is
    restored. The current version is stored on the history list.


    +   **Compare** Select two versions and click Compare to compare them. A screen
    appears comparing the versions. If you select only one version, it will be compared
    with the latest version of the object.


    # 3.1.6 The Properties Tab


    The Properties screen allows you to assign new properties to an object or delete
    existing properties. Properties determine an object''s characteristics and consist
    of a name, an associated value, and a property type. For example, you might assign
    a property named Price to a DTML document and then call Price in the document
    using its assigned value. (The property type for Price should be an integer if
    you want to only whole numbers.) To change the value used for Price, you use the
    Properties tab. All calls for the property in your document will be replaced with
    the new value.


    The Properties screen (Figure 3-6) shows an overview of editable properties and
    includes a form for adding new ones. To add a new property, enter a name and value
    and then select the property type from the drop-down Type menu.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Folder at: /


    | Name | Type |

    |---|---|

    | title | Zope string |


    To add a new property, enter a name, type and value for the new property and click
    the "Add" button.


    ![](img/43a28cce5475b2f487bf455365567fb6_61_0.png)


    Figure 3-6: The Properties screen


    The following property types are available on the Properties screen:


    +   - boolean multiple selection

    - date selection

    - float string

    - int text

    - lines tokens

    - long


    The types boolean, float, int, long, and string roughly correspond to their namesake
    data types in other programming languages.(If you''re not familiar with these
    concepts, see Learning Python, by Mark Lutz and David Ascher, O''Reilly & Associates,
    1999.)


    Let''s take a brief look at the date, lines, multiple selection, text, selection,
    and tokens property types. (Chapter 7, "ZClasses," presents a comprehensive description
    of all property types.)


    # 3.1.6.1 The Date Property Type


    When assigning a date property, you must enter a date in the Value field because
    an empty field will be rejected.


    # 3.1.6.2 The Lines Property Type


    The types produce a list of multiple values. When using it, leave the Value field
    blank and enter a name for the property; the property name you entered will then
    appear in the list of properties. You can now enter item values in the property''s
    text field, with each item value on a new line.


    # 3.1.6.3 The Text Property Type


    The text type is the string data type (a sequence of elements, usually characters,
    considered as a whole), although it creates a multiline text field instead of
    a single line field as with the string type.'
