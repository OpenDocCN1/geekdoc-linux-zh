- pgno: 63
  md: '# 3.1.8 The Find Tab


    The Find tab offers a wide range of search functions you can use to find objects
    on a Zope server. For example, you can search for specific objects if you know
    their ids or search for objects according to their meta type or other attributes
    (for example, you can search for all DTML documents modified since a certain date).


    # 3.1.8.1 The Standard Search


    Find offers the choice of a standard or advanced search. Figure 3-8 shows the
    standard search screen.


    The four fields of the standard search—Find objects of type, with ids, containing
    and modified—are described here.


    **Find objects of type** Use this field to search for specific object types, all
    of which are listed on the field''s menu (including all object types on the Available-Objects
    menu). You can search for individual objects, multiple objects, or all objects.
    To select multiple objects at the same time, click one while holding down the
    CTRL (Windows) key.


    **with ids** You can specify one or more ids to find. When listing several ids,
    separate them with a space.


    **containing** Text entered here must be contained in the body of search objects,
    not in their ids.


    **modified** Specify a time or date before or after which the objects you want
    to find were modified. To search for objects prior to a specific date, click the
    Before pull-down menu; otherwise, select After. Enter the date or time in the
    field next to the pull-down menu using the standard Zope date/time formats: YYYY/MM/DD
    hh:mm:ss; for example, 2000/01/01 03:30:00. In English, this corresponds to January
    1, 2000, at 12.30 a.m.


    ![](img/43a28cce5475b2f487bf455365567fb6_63_0.png)


    Figure 3-8: The stondord search screen'
  merge: -1
  img_proc: true
