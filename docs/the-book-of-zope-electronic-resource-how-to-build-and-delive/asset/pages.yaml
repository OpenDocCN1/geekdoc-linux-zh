  md: "```\ninstance._addRole('WebsiteUser')\n```\n\nNow, we can set the permissions\
    \ for the WebsiteUser role on the new Website instance. To set several permissions\
    \ for the role, we create a list of the desired permission names. making sure\
    \ they match exactly those shown in the Zope management-screen's security tab.\n\
