  md: "# 15.4.5.3 Define the Initialize Function\n\nWhen Zope starts, it will import\
    \ our product directory, which in turn will execute the __init__ file we are creating.\
    \ Once Zope imports the product, it checks to see if it defines a function named\
    \ initialize. If it does, Zone calls this function for the product, and passes\
    \ the registration context object to. This object contains the method registerClass\
    \ which is used to register the product's classes with Zope.\n\nWebsite__init__\
    \ uses the following code to open the Initialize function definition:\n\n```\n\
    def initialize(context):\n    \"\"\"Register the website class\"\"\"\n```\n\n\
    A product's Initialize function will generally contain one or more calls to the\
    \ registerClass method of the context object (passed by Zone in the context argument).\
    \ One call to registerClass must be made for each class in the product that defines\
    \ a distinct object metype.\n\nTable 15-4 describes the arguments that can be\
    \ passed to registerClass:\n\n# Table 15-4: registerClass arguments\n\n| registerClass\
    \ Argument | Description |\n| --- | --- |\n| instance_class | The product class\
    \ to be registered. |\n| meta_type | Specifies the class's Zope metype, which\
    \ will appear in the add object menu of folder objects. If omitted, the class's\
    \ metype attribute is used. It is generally preferable to specify the metype directly\
    \ in the class (omitting this argument) for better code readability and maintenance.\
    \ (Optional.) |\n| permission | The name of the security permission needed to\
    \ create instances of the class in Zope. If omitted, Zope creates one based on\
    \ the metype. It is preferable to specify the permission name explicitly, however.\
    \ (Optional.) |\n| constructors | A list of callable constructor objects and methods\
    \ used to create instances of the class in Zope. The first constructor given is\
    \ the method or object called when the class's metype is selected from a folder's\
    \ add menu. All constructor methods specified are automatically protected by the\
    \ permission name specified above. |\n| icon | The relative path within the product\
    \ to the image file to be used with the product. When specified, Zope automatically\
    \ adds the appropriate icon attribute value to the class based on this path. (Optional.)\
    \ |\n| permissions | A list of additional security permissions used by the class.\
    \ If omitted, these names are taken from any security assertions made in the class\
    \ definition (see section 15.6.4). (Optional.) |"
