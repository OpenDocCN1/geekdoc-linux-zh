    many of their attributes as metadata. Attribute values not stored as metadata
    can still be looked up from the original objects as well (see section 11.4.2 below).
    This can also be beneficial if an object''s attribute values often change, because
    metadata values are not automatically updated when an object changes.


    ![](img/43a28cce5475b2f487bf455365567fb6_228_0.png)


    Figure 11-6: Example of a Find Objects form


    ![](img/43a28cce5475b2f487bf455365567fb6_228_1.png)


    It is generally a good idea to keep this list lightweight. It is useful, to keep
    the ''summary'' meta of a text object (like the first 200 characters) but not
    the text content in its entirety (it is in this example to keep all elements,
    which is configured in the Indexes View tab). This way the summary data may be
    shown in the search results.


    Figure 11-7: Metadata Screen'
