    \ application using external method objects. (Section 14.2 takes a detailed look\
    \ at external methods.)\n 13.1 through 13.4 will look at elements of Python's\
    \ syntax, then 13.5 will discuss how to use Python to create classes and methods.\
    \ Finally, we'll apply our knowledge using a simple program example.\n\n# # 13.1\
    \ Data Types\n\nTo truly master Python, consult a good Python book (O'Reilly's\
    \ Learning Python or New Riders' *Python Essential Reference*).\nThis section\
    \ discusses the data types supported by Python and offers several simple examples,\
    \ with each example accompanied by the corresponding result (the relevant screen\
    \ output).\n\n> The results shown in this section derive from output produced\
    \ if you run the examples in Zope (for example, calling them from within DTML).\
    \ If you try to test these examples in a pure Python environment, you may encounter\
    \ differences.\n\nPython supports the following basic data types:\n\n+   - Numeric\n\
    - Sequential\n- None\n\nPython numeric types can be further divided into:\n\n\
