    # 3.3.3.3 The Flush Cache Tab


    The Flush Cache tab, shown in Figure 3-16, lets you manually clear the contents
    of the cache, as follows:


    Full Sweep


    This option empties the cache. Specify the period of time during which an object
    must be accessed to prevent it being deleted from the cache; the default setting
