- pgno: 396
  md: '![](img/43a28cce5475b2f487bf455365567fb6_396_0.png)


    # GLOSSARY


    **dtml File** A dtml file is a file in a Zope product created as a DTML method
    or document when a product instance is created.


    **_Variable** See Underscore `Variable`.


    **Acquisition** Acquisition is the Zope mechanism by which object properties are
    inherited, thus creating the Zope object hierarchy.


    **Anonymous** Anonymous is a standard role in Zope, initially assigned to all
    users until they log in with a username and password.


    **Authenticated User** An Authenticated User is one who is currently logged into
    the system. If no user is logged in, ''Anonymous'' users are considered the Authenticated
    User.


    **Authentication** Authentication is the process by which Zope identifies its
    users. See Login.


    **Available-Objects** menu The Available-Objects menu indicates which objects
    can be created at the current location in Zope. To create an object, select the
    metype for the object from the ''Available-Objects'' menu.


    **Base Class/Top Class** A base or top class is a class which passes its properties
    and methods to its subclass, which then "inherits" those properties and methods.'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'Case Sensitivity Python is "case sensitive" which means that it differentiates
    between upper and lowercase letters.


    Class A is the scheme by which objects are derived. The methods and attributes
    of the derived objects are implemented in a class.


    Constructor Method A class''s constructor method is used to allow certain actions
    to be carried out as soon as class instance is created. One example of such an
    action would be setting default attributes.


    Container Tag A container tag is a non-empty tag containing a start and an end
    tag. Its two body tags contain additional source code.


    Debugging describes the process of searching for errors in program code.


    DTML Tag As with HTML tags, DTML tags represent instructions or commands. You
    can only use DTML commands in DTML tags; HTML tags will not be understood.


    External Method An external method is a Zone object which links Zone and a Python
    module in the file system.


    First View The first view displays the source code which Zone implements.


    Folder Object A folder object is a Zone object which can contain other objects.
    Folder objects include folders or ZCatalogs.


    Globbing Globbing is a ZCatalog option. When you create a ZCatalog, you can search
    it using wildcards, like an asterisk (*). You can also perform partial word searches.


    Header Line Form The Header lines form, which only exists for the sendmail tag,
    is an alternative to providing a DTML tag with attributes and values.


    Instance Another name for an object.


    Local Role All Zone users can be assigned one or more local roles for an object,
    which determine the user''s permissions with regard to that object. Set local
    roles to restrict or expand a user''s permissions relative to the object.


    Login Users enter usernames and passwords in the login screen to log on and identify
    themselves to Zone.


    Management Screen The Management Screen''s interface lets you work with the objects
    in a Zone server. Also see Second View.


    Manager Manager is a standard role in Zone, which initially has all permissions
    except for ''Take Ownership''.


    Meta-Type A product''s meta-type appears in the Available Objects menu in the
    Zone Management screen. Product instances are created using this meta-type.'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'Namespace The namespace contains the names of all valid variables for an object.
    This means that a defined variable can be referred to there and its value determined.


    Non-folderish Object A non-folderish object is a Z object which cannot contain
    other objects. Non-folderish objects include DTML methods, DTML documents, and
    files.


    Object An object is derived from a class and has methods and attributes. All objects
    in a class have the same methods.


    Owner Owner is a standard role in Zeke, which by default has the ''Take Owner-''
    permission.


    Ownership Each object has an "Owner" except for objects created when you install
    Zeke. The user who creates a Zeke object is automatically that object''s owner.


    Permissions Permissions specify which actions a user can carry out in Zeke. Permissions
    can only be assigned to roles, and cannot be assigned directly to users.


    Product Directory The product directory is a subdirectory of /lib/python/ Products/
    that contains all files needed for a product.


    Properties Properties are an object''s characteristics or attributes.


    Python Python is a programming language. Zeke is mostly written in Python.


    Reserved Words Reserved words are words which cannot be used as names for objects
    because they are already used in Python or Zeke.


    Second View The second view incorporates the entire Management screen. When you
    are working in the Management screen, you are working in the ''second view''.


    Subclass Subclasses "inherit" and expand the properties of their base class. Instances
    of different subclasses have the same basic properties because they inherit them
    from the same base class.


    Tab Bar The tab bar, at the top right of the frame on the Zeke Management screen,
    is used to access an object''s individual views.


    Third View When you are viewing a Zeke object with a web browser, you are in the
    ''third view''.


    Tuple Tuple is a list of elements whose sequence cannot be changed. For example,
    ''hello'', ''you'' is a two-tuple strings.


    Underscore The underscore variable accepts a wide range of useful attributes which
    allow you to perform, among other things, mathematical calculations and string
    manipulations. Most importantly, you can use these variables to refer to objects
    in expr- expressions whose names do not comply with Python syntax.'
  merge: -1
  img_proc: true
- pgno: 399
  md: 'User Folder Individual users are created and managed in Zope''s User Folder
    (acl_users).


    Use A User is someone who uses Zope and who has a username, password, domain and
    role(s).


    Versions See Zope Versions.


    Vocabulary A Vocabulary contains words in the cataloged objects of a ZCatalog,
    which can be stored and searched.


    ZClasses Use ZClasses to quickly create your own Zope products without a lot of
    programming.


    Zope Products Zope Products are distributions programmed in Python which can be
    installed on a Zope server. When a product is installed, objects can be created
    on the Zope server with the functionality implemented in the product.


    Zope Versions Zope Versions allow you to work on different versions of a project
    without affecting a functioning version of that product during the development
    process.'
  merge: -1
  img_proc: true
