- md: "\n# OpenSource\n\n06 News & Opinion | 12 Interview | 94 Your questions answered\n\
    \n# HACKING\n\n## Sony’s PlayStation 4 gets unofficial Linux support\n\nThe cheap\
    \ way to get your hands on an eight-core PC\n\nNoted engineering team failover\
    \ has successfully booted Linux on Sony’s PlayStation 4 console bypassing the\
    \ copy against third-party software and potentially opening the doors to novel\
    \ uses for devices.\n\nSurprise – but that limitation has been officially removed.\n\
    Speaking at the third Chance Communication Conference, failover team demonstrated\
    \ the ability to bypass protections against booting third-party software on the\
    \ console by loading a Linux distribution – something Sony had actually taken\
    \ the liberty of.\n\nSony PlayStation 4 has a long history with Linux. The company\
    \ released an expansion in 2002, which turned its PlayStation 2 console into a\
    \ Linux machine, and its successor the PlayStation 3 launched with ‘OtherOS’ support\
    \ for booting a number of Linux distributions. The company began to use the OtherOS\
    \ support to play illegally copied games, however removed the feature in winning\
    \ a class-action lawsuit against the company.\n\nGiven Sony’s removal of OtherOS\
    \ from the PlayStation 3, the fact its successor launch without support for the\
    \ company’s BSD-variant Orbis OS was\n\nThe feat has far more potential than just\
    \ gaming; too the PS4 processor is an eight-core AMD model with powerful graphics\n\
    \n> “Linux on the PS4 actually makes a lot of sense, more than it ever did on\
    \ any previous console,” said the team’s work. ‘Its close enough to a point that\
    \ getting 3D acceleration working, while rather painful, seems entirely possible\
    \ without further for real games and even triple-A titles, not just homeless.\
    \ And thousands of indie and SteamOS on the PS4 will ‘just work’ once the issues\
    \ are sorted out.”\n\nThere is a catch, however: while the release required the\
    \ loader to boot Linux on the PS4, it has not released the exploit needed. by\
    \ replacing exploits,’ explained marx, ‘for the homebrew ecosystem by porting\
    \ Linux to point it to our loader, and you will get Linux.’\n\nSony has not commented\
    \ on the team’s breakthrough, but will likely be blocking the ability to run third-party\
    \ software in a future firmware update.\n\n- Linux on the PS4 actually makes a\
    \ lot of sense, more than it ever did on any previous console\n\n# OPEN HARDWARE\n\
    \n## TOP FIVE\n\n## New features in KDE Plasma 5.6\n\n### 1 Notifications\n\n\
    Plasma 5.6 brings with it a highly improved device notification system, changing\
    \ looks which has stood unnoticed since Plasma 4.7 to improve the appearance and\
