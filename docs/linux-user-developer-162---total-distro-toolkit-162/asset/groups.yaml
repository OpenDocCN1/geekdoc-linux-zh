    ## Blender


    - The next command, **apt-get update**, downloads the package from repositories
    and updates them to get information on the latest versions of packages and their
    dependencies. Finally, **install blender** downloads and installs Blender on your
    system, using the default settings.


    To generate a 3D model. To change the view, click on "View" on the 3D View Editor
    (on the bottom-left). You''ll see a list of objects offering various views of
    view along their corresponding hotkeys. These are help to find what you want or
    select an object on a specific side you need.


    ## 02 Blender home page


    Once you open Blender on your system, you''ll be presented with the 3D viewport.
    This is a basic scene consisting of a cube, a lamp and a camera. The cube is a
    basic mesh object, just to give you something to start with. You can add new items
    move them around later as you need. The lamp is there to illuminate the scene,
    and the camera is necessary to help you visualize.


    Let''s learn how to add objects. To do this, click on the screen where you want
    to add object and select the type of object from the dropdown menu on the 3D Editor
    at the bottom. Select a type of object. You''ll see different types of objects
    available to create all around the scene. The toolbar on the left contains tools
    that select a specific object. You can move the objects as wish level by level,
    but lets first get handle on what lies here.


    ## 03 Basic features


    We already saw that Blender default page has light source generators to help you
    envisage animations. You can also manoeuvre the view as wish. This is one of the
    most important things to be able to do. To move objects, just click one of the
    three arrows represents the axes and drag along the axis. You can also rotate
    an object (after you select it) by pressing R along with X, Y or Z keys to rotate
    it in specific direction.


    ### Knife tool


    Another useful tool in Blender is the Knife tool. It allows you to cut objects
    into pieces. It also lets you select where the new edge will start and end, draw
    a line through all object you want to cut.


    ### Moving objects


    To move an object, you''ll need to select it. Select the object by holding G and
    then left-clicking the object. Once selected, you can drag it to position. All
    the objects in your viewport, including the lamp and camera, have several ways
    to move them. You can move it in free-form way or along the axes. To move along
    a specific axis, press G and then X, Y or Z. If you prefer, left-click to drop
    the object.


    ### Loop cut and tool


    To divide an object along one direction, use the Loop Cut tool. This tool only
    works on determined set of faces of object and can slide features. After activating
    Loop Cut, you are able to hover over set of features to confirm the selection
    by left-clicking with your mouse.


    ## 05 Object and edit mode


    So far, we have been working in Object Mode. This is the default mode and allows
    you to manipulate objects on a global scale, you can edit and move the objects
    around. When you want to edit the object itself, like changing the shape and position
    of its vertices, change the Blender mode to Edit mode by selecting the drop-down
    menu on "Object Mode" in the 3D View Editor to switch to the new mode.


    Edit Mode, you can now switch between Object Mode and Edit Mode. On the main screen
    of Edit Mode, the object that was previously selected in Object Mode is now represented
    by vertices, edges, and faces. You can select any one of these by choosing the
    appropriate selection tool in the 3D View Editor at the bottom and right side.
    Holding Shift while right-clicking allows you to select multiple instances of
    the same feature. Again, you may press the A key to deselect all of the selected
    objects.


    ## 06 Manipulating object size


    If you are designing a 3D model that you want to be in real life scale, such as
    metric or imperial scale, you will need to change units. To change the units you
    are operating with, click the "Scene" tab in Properties Editor. In this tab you
    can select the unit that lets you pre-defined Metric, Imperial units.


    The standard metric unit is meter and the imperial unit is foot. The scaling factor
    is there you use to change the ratio of your object compared to the standard unit
    size. For example, the default unit is meter, if you want to work in centimeters,
    set the scale to 0.02, or 20 centimeters. This way, you can easily adjust the
    size of your objects.


    ## 07 Specific sizing options


    It is very difficult to use a mouse to stretch or scale the size you want to,
    due to the nature of working in a 3D virtual space. Luckily, Blender carries a
    very useful Properties panel, which is toggled on and off with the N. When you
    are in Object Mode, you can also change the dimensions of your object without
    affecting your part. The result is an invisible box to simplify the sizing of
    non-cubic objects, such as cubes or spheres, where you would have to give the
    dimension for every face in space.


    This panel is also another way for you to specify the location and rotation of
    the selected object, as well as locking a location feature. If this particular
    parameter prevents it from being accidentally dragged moving your Properties panel
    "go-to" for precise measuring and sizing of objects.


    ## Extruding objects


    Extruding is a 3D modeling technique for a feature, such as the side of an object,
    or features, as a set of vertices, which can be extended from their current position.
    To extrude an object, go into Edit Mode and select the feature you want to extrude
    by right-clicking them. Then you can also extrude the whole region by clicking
    on ''Extrude Region'' in the Toolbar or by pressing the E key. This should extrude
    that particular region by left-clicking, or back in original position.


    ## Bisect


    Blender has several tools available to bisect. One such tool is called Bisect.
    It slices an object into one or more pieces. To do this, select the desired faces
    or edges in Edit Mode and draw a line across the faces to create a new edge on
    selected vertices. Once we have bisected our object, there are a few things that
    will be visible to us, such as the number of lines we see on the screen. Then
    the Toolbar will be the Bisect menu. You can adjust where your bisected line is
    located as well as some other features. The ''Clear Outer'' and ''Clear'' options
    allow us to eliminate one side or the other of the bisected edges and the ''Fill''
    option will place a face connecting the bisected edges.


    ## Joining and separating objects


    Joining and separating objects are useful tricks in order to make sure objects
    stay fixed in relation to one another or keep their relationship to one another,
    respectively.


    To join two objects as Blender treats them as one object, if they are not physically
    touching then, go into Edit Mode and select the object by right-clicking on it,
    and then hold Shift and click-right on the other objects. Press Ctrl+J. The selected
    objects will get a yellow outline and you will move, scale, and rotate them. If
    you have joined objects (two parts of an object) that you wish to separate later
    on, go into Edit Mode and select the part you wish to separate. If you select
    one particular feature and press the L key, Blender will then select all of the
    features related in that one and is smart enough to distinguish faces between
    two objects, even like a smaller cube joined to a larger cube.

