    # 评测


    81 组测 | 86 LeMaker 吉他 | 88 免费软件 | 90 Linux Mint 17.3 KDE


    ![](img/6633b05a23a48c57613fd377238cfe15_80_0.png)


    ## 组测


    ## 包管理器是 Linux 发行版之间的基石和最独特的特征，因此让我们找到最好的一个


    ### APT


    高级软件包工具（Advanced Package Tool）是 Debian GNU/Linux 的核心组成部分，也是其非常有价值的功能之一。APT 是 dpkg
    工具的前端，让 Debian 不仅仅能够安装软件包。当然，APT 应用于几乎所有的 Debian 后代版本，如 Ubuntu、Mint 等许多其他发行。


    Debian: bit.ly/In1Nj5c


    ### DNF


    DNF 是“Dandified Yum”，是著名的 YUM 工具的后继者和新成员，属于 RPM 前端。DNF 作为 YUM 的替代品出现的。自 Fedora
    22 版本以来，DNF 一直一直是 Fedora 的默认包管理器，也适用于基于 Red Hat 的系统。


    Fedora: bit.ly/In0LPy5


    ### Zypper


    Zypper 是另一个基于 RPM 的系统的包管理器，专门用于 openSUSE 和 Linux Enterprise。与 APT 和 DNF 不同，Zypper
    并不是标准技术，而是 PackageKit 管理系统。Zypper 专注于智能依赖解决，并拥有许多额外功能。


    openSUSE: bit.ly/12YSRCH


    ### Pacman


    Pacman 是 Arch Linux 的官方包管理器，也用于许多 Arch 派衍生版。Arch 系统正在 Distrowatch 排名上升，所以学习它是个好主意。Pacman
    处理二进制软件包，尽管它使用了包含已编译软件的 tar 归档。


    Arch Linux: bit.ly/In10EEv


    www.linuxuser.co.uk 81


    # 评测


    # 包管理器


    # APT


    # DNF


    对广泛使用的包管理器的不同视角


    期待已久的 Yum 更新器终于来了


    ![](img/6633b05a23a48c57613fd377238cfe15_81_0.png)


    正在读取软件包...

    正在构建依赖树...

    设置完成非常快！

    已安装以下软件包：

    package-generator

    mirrors

    尽管如此，从普通用户的体验来看，确实可以注意到 APT 在工作和安装内容方面都非常完美。


    运行 apt update 后，删除了 0 个软件包，2 个软件包未更新。

    运行 apt upgrade 后，不会有额外的计划。


    - 人们从 Ubuntu 移动到 Mint，从 Debian 移动到 elementaryOS 或反之，但都一直在使用 apt

    - Fedora 用户对这个新工具非常兴奋。它使用了与 yum 相同的语法，但运行速度更快！


    # 速度


    在不同的发行版上比较包器的速度是非常困难的，因为它们处于完全不同的环境中：软件包被拆分、仓库可能位于服务器或较慢的镜像上等。尽管如此，从普通用户的体验来看，确实可以注意到
    APT 在工作和安装内容方面都非常完美。


    # DNF


    DNF 依赖的速度比新的 libyum 快，后者取代了 Yum 中快速的迭代方法。我对比 APT 和 DNF 的个人体验倾向于后者，尽管 DNF 通过其出色的
    delta-RPM 事务进行“作弊”，更新系统所需的时间更短并节省了更多缓存。


    # 软件包可用


    几乎任何 Linux 软件都以 deb 包的形式列出，或者包含在标准仓库或第三方个人仓库中。Ubuntu 在软件包和 PPA 的数量方面相当有限，但它也拥有大量用户的
    PPA，这使得在几秒钟找到任何 Linux 应用变得极其方便。


    # 特性


    DNF 的重点不在功能，而在于围绕 Fedora 和 Red Hat 发行版中的 RPM 数据库构建一个统一且无序的堆栈。DNF 使用 libpart 来列出软件包依赖，它与
    Hawaii（一个基于 Python 的 API）连接。DNF 并没有许多额外功能，这可能是因为它是一个较年轻的项目。


    # 特性


    APT 由几个实用程序组成，如 apt-get 和 apt-cache。然而，APT 提供了非常好的质量控制，并且是一个高效的依赖引擎。它没有许多额外功能。例如，要添加
    PPA 必须安装一个第三方/add-repository 软件包。


    # 易用性


    从历史上看，apt-get 和 DNF 之间存在分工，前者最适合处理细节，后者适合处理仓库。学习可能需要一些时间，因为如果 apt 无法安装一个没有无法解决依赖的打包软件包，那么在未配置的情况下
    DNF 要好得多，而你必须使用 apt-get-install 来修复它。


    # 易用性


    DNF 之于 RPM 如 APT 之于 deb。但我们需要一些变通方法来让 apt 工作得更好。更好的 DNF 带有正确的默认设置，包括 Delta RPM，这是一项只下载软件包的请求部分的功能，节省了时间和网络流量。


    # 总体


    稳定、足够快且文档齐全的工具——数百万 Ubuntu 用户似乎都认同！基于 Ubuntu 的发行版上的 PPA 选择也非常出色，尽管与 dpkg 的关系存在一些异常，但
    apt 仍然值得使用。


