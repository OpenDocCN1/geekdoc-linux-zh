    \n| Component | Connection |\n| :--- | :--- |\n| 3.3v to power LEDs | Connect\
    \ either end to LED wires |\n| GPIO 9, triggers On and Off |\n| ETHERNET |\n|\
    \ USB pin |\n| USB pin | 78 |\n\n## Check for a key\n\nTo ensure that a tweet\
    \ actually meant to mean the LEDs, the program looks for an exact text. For example,\
