    # Review


    # Package managers


    # APT


    # DNF


    A different perspective on the most widely-used package manager


    The much-anticipated replacement for the Yum updater is here


    ![](img/6633b05a23a48c57613fd377238cfe15_81_0.png)


    Reading packages...

    Building dependency tree...

    Setting up has been fast!

    The following packages have been installed:

    package-generator

    mirrors

    Still,, some certainly can be noted from an average user experience, where APT
    works and installs things perfectly.


    After apt update, 0 packages were removed and 2 are not updated.

    After apt upgrade, 0 additional plans will be used.


    +   People move from Ubuntu to Mint, from Debian to elementaryOS or vice versa,
    but all remain with apt


    +   Fedora users are very excited about the new tool. It uses the same syntax
    as yum, but works faster!


    # Speed


    It''s hard to compare package managers in terms of speed on different distros,
    because they reside in completely different conditions: packages are split, repositories
    may reside on server or slower mirrors, etc. Still, some certainly can be noted
    from an average user experience, where APT works and installs things perfectly.


    # DNF


    DNF solves dependencies faster than the new libyum, which superseded the rapid
    iterative method in Yum. My personal experience with APT and DNF favors the latter,
    even though DNF ''cheating'' with its splendid delta-RPM transaction, takes less
    time to update the system and saves more cache.


    # Package availability


    Almost any software for Linux is listed in the form of deb package or included
    in one of standard repositories or in third-party personal repositories. Ubuntu
    is quite limited in terms of the number of packages, PPABs, but it also enjoys
    a huge number of people''s PPAs, making it extremely comfortable to find any Linux
    app in seconds.


    # Features


    DNF is not about features but about making a unified and unordered stack around
    the RPM databases in Fedora and Red Hat distributions. DNF packages dependencies
    with the libpart to list, which connects with Hawaii (a Python-based API). Are
    are not many extra features in DNF, probably due to the fact that it''s a younger
    project.


    # Features


    APT consists of several utilities, like apt-get and apt-cache. However APT provides
    very good quality control and is an efficient engine for dependencies. There are
    not many extra features. For instance, to add a PPA one must install a third-party/add-repository
    package.


    # Usability


    Historically there is a split between apt-get and DNF, the first is best for individual
    details and the second for dealing with repositories. Learning can take some time,
    for if apt fails to install a package being packed without unresolvable dependencies,
    DNF is much better when not configured, and you have to use an apt-get-install
    to fix it.


    # Usability


    DNF to RPM is as good as APT to deb. But we need some extra workarounds to make
    apt work better. Better DNF comes with the right defaults, including Delta RPM,
    a feature that downloads only the requested part of packages, which saves on time
    and network traffic.


    # Overall


    Stable, fast enough and a well documented tool – millions of Ubuntu users seem
    to agree! The PPA selection on Ubuntu-based distros is also excellent, despite
    some quirks with its relation to dpkg, apt is worth using.


    # Overall


    Fast and low-fat package manager, providing a long-awaited update to the world
    of Red Hat distributions. The software is still so young that we can expect to
    see more features in the future.


