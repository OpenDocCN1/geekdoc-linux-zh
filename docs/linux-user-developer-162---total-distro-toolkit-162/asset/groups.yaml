    # Pros


    If you''ve already designed around the Compute Module, the Guitar is a cheaper/more
    powerful alternative


    # Cons


    Network performance is poor and its price makes it I''d recommend if you don''t
    use a SIMD layout


    # Summary


    two USB 2.0 and one USB 3.0 OTG, and an infra-red receiver. A Raspberry Pi 2-type
    40-pin GPIO header, of which 28 pins are user-accessible for general purpose,
    Only the GPIO is included on the baseboard''s silicon layer which is obvious.
    The Guitar music work out of the box, although rendering useless.

    The Guitar, as supplied, comes with a modified retail adjustment by Lempiainen.
    It boots into a desktop, output via HDMI, with a selection of pre-installed software,
    including the IDE Python Environment and RStudio. The network connectivity work
    out of the box, although performance is poor; the small chip antenna used for
    Wi-Fi struggles with weaker access points; while the wired network was benchmarked
    at a modest 31MB/s, slower than the Raspberry Pi 4''s USB-connected external network
    interface.

    The network performance is a shame, because the quad-core Actions 500 proves a
    general-purpose purpose. SynthBench total execution time of 51.6114 seconds beats
    the Raspberry Pi 2''s 74.4835 seconds, nearly twice as fast as the single-core.

    Those shifted to focus should be warned, though with most PowerVR graphics processors,
    the desktop-like development bundle is supported only when the Guitar is running
    Android 5.0.

    Well as Android 5.0 and Linux, images are provided for Arch Linux, Ubuntu, MATE,
    and a Debian-based LiveMedia which boots into KODI.

    nGareth Holmes


    ![](img/6633b05a23a48c57613fd377238cfe15_86_1.png)


    Great GPU performance but the baseboard''s network performance is woful. For the
    money, this board and its SIMDD form factor is easy to integrate into embedded
    projects.'
