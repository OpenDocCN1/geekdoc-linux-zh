    使用 Tails 的另一个大优势是以隐身模式访问互联网。Tails 使用 Tor 或 I2P 网络来保护你的在线信息。对于不可信的网络，Tor 或 I2P
    等是分布式网络，它们通过遍遍地的中继网络中转你的连接。通过这种方式，任何监控你连接的人无法看到你访问的网站，而网站也无法追踪你的物理位置。所有软件都配置为通过
    Tor 访问互联网。如果应用程序尝试直接连接互联网，它将被自动阻止。


    要使用 Tor，只需从即时 DVD 启动 Tails 并打开 Tor。你可以像使用其他浏览器一样使用它。如果你想从 Tor 浏览器使用基于位置的服务（例如
