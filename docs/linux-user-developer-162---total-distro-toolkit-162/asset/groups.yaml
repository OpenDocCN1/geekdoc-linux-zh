    ### 使用 Wireshark 进行数据嗅探


    Wireshark 是一个著名的网络协议分析器。在分层方面，Wireshark 让你以详细的方式查看网络上发生的一切情况。Backbox 预装了 Wireshark，你只需要运行它即可看到操作。一旦激活，你可以在
    GUI 上看到列出的网络。你可以选择任何接口来捕获（或“嗅探”）流经该接口的数据包。


    > **Backbox 是一个基于 Ubuntu 的 Linux 发行版。** 它专注于网络安全，主要开发用于执行渗透测试和渗透漏洞评估。Backbox 预装了安全工具，如果你想扫描网络并检测任何威胁或漏洞，它会非常好用。


    ## 渗透测试


    渗透测试可以被看作是古语“预防胜于治疗”的应用，或者是一种设计用于识别并获取对目标系统访问权限的软件攻击，然后尝试实现预定义的一组目标，以确定特定攻击的可行性，识别任何成功攻击可能产生的影响等。渗透测试还会跟踪目标系统的哪些防御被攻破，并需要加强。一旦测试结果汇总，将与相关团队共享，以确保所有安全漏洞都被修补。渗透测试是安全的重要部分。通过你
    live DVD 上的 Backbox，你可以快速对目标运行渗透测试。


    ## NMAP


    Nmap（网络映射）是一个扫描工具。你可以使用 Nmap 发现并识别网络上的主机和服务，从而构建网络地图。Nmap 可以向目标主机发送精心构造的数据包，然后分析响应。Nmap
    有四大主要功能，第一个是服务检测，检查网络服务并识别远程设备上的应用程序名称和版本。最后，你还可以用 Nmap 进行操作系统检测。


    ## 10 大渗透测试工具


    ### Metasploit 攻击模拟


    ### 1 SCAPY


    Scapy 是一个用 Python 编写的 CLI 工具。它可以用于伪造或解码数据包，然后将其发送到网络中。


    ### 2 BEEF


    BeEF 代表浏览器利用框架。你可以通过其客户端攻击挂钩网络浏览器，来评估目标的实际安全状况。


    ### 3 FIMAP


    Fimap 是一个 Python 工具，可以帮助你自动针对 Web 服务器的本地和远程文件包含查找、准备、审计和利用漏洞。


    Metasploit 是一个渗透测试框架。你可以使用 Metasploit 针对各种机器执行漏洞代码。


    ### 4 KISMET


    Kismet 是一个用于 802.11 无线网络数据包捕获的入侵检测系统。


    ### 5 SQLMAP


    Sqlmap 自动化检测和利用 SQL 注入漏洞的过程，以对底层数据库进行指纹识别和访问。


    ### 6 ETTERCAP


    Ettercap 允许你在局域网上模拟中间人攻击。Ettercap 通过拦截网络流量到交互模式以及通过第三方插件来工作。


    ### 7 WPSCAN


    WPScan 是一个 WordPress 漏洞扫描器。通过它，你可以检查第三方插件等的漏洞。


    ### 8 OPHCRACK


    Ophcrack 允许你破解密码。


    ### 9 OWASP ZAP


    OWASP ZAP 是一个用于发现应用程序的安全测试工具。它可以帮助发现 Web 应用程序中的漏洞。


    ### 10 BURPITE


    Burp Suite 是一个流行的 Web 渗透测试平台。它允许你拦截、修改和重发 HTTP 流量，是进行 Web 安全测试的利器。


