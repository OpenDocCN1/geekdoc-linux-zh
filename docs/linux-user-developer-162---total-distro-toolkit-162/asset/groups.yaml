    ## LF launches Blockchain project


    ### Aims to develop an enterprise-grade ledger


    The Linux Foundation has announced the launch of a new collaborative project concentrating
    on the blockchain technology that underpins popular crypto-currency Bitcoin. In
    a series of projects with the backing of companies including Accenture, IBM, The
    London Stock Exchange Group, VW, and Ford, we aims to create an open-source distributed
    ledger.


