    ### Scores of Ubuntu derivatives to benefit


    Package manager, as seen in Debian, Ubuntu, and Linux Mint, has received a serious
    boost in its latest releases, thanks to the work of developer Julian Andres-Klode.


    While a tenfold speed boost will be welcomed by its users, for Apt 1.7, updating
