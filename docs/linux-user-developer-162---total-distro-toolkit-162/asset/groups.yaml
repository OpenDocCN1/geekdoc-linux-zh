    # Generate random numbers using the /dev/random seeds and use them to get strong
    alphanumeric passwords


    Random numbers are useful in many different areas, including not limited to sampling,
    numerical analysis and computer programming. This tutorial will use random numbers
    to generate random strings that can be used for creating secure and difficult-to-guess
    passwords. Additionally, we will generate strings to produce random text that
    can be used as input for testing programs and evaluating the effectiveness of
    algorithms. A programming language can provide a random number generator.

    Most of the code will be in C. You will learn how to generate random numbers and
    then learn how to create strings from random numbers. Additionally, you will learn
    how to generate random numbers in Perl, Go, Swift, and Rust. These programming
    languages have modules or functions that help you generate pseudo-random numbers.
    To find out more, refer to the second volume of *The Art Of Computer Programming*
    by Donald Knuth.


    # The Theory


    Strictly speaking, a sequence of numbers is considered to be statistically random
    when you cannot find any recognisable patterns or regularities in it. Random numbers
    are generated using the arithmetic operations which are finite. A random number
    generator must avoid going into a circle of repeating elements, which is why methods
    that avoid the possibility of a circle should be used.

    Since the numbers generated by a computer are limited, if you are producing new
    integers for an unlimited time, you might get detectable patterns. There are no
    truly random numbers. This is similar to the infinite monkey theory, which states
    that a monkey hitting keys on a typewriter for an infinite amount of time will
    produce the complete works of William Shakespeare. However, most of the time,
    you just demand "random" numbers for a finite amount of time. As such, the modulus
    operator can play a key role because it allows you to limit the


