    # Feature Total Distro Toolkit


    ## SECURE YOUR COMPUTER WITH BACKBOX


    Protect yourself from outside attacks with this incredibly useful distro that
    provides much-needed security tools


    ![](img/6633b05a23a48c57613fd377238cfe15_19_0.png)


    ### Packet sniffing with Wireshark


    Wireshark is a well-known network protocol analyzer. In layer terms, Wireshark
    lets you see everything that''s happening on your network in a detailed manner.
    Backbox comes pre-installed with Wireshark so you only need to run it to see action.
    Once active, you can see the networks listed on the GUI. You can select any interface
    to capture, or ''sniff'', the data packets flowing through it.


    > **Backbox is a Linux distribution based on Ubuntu.** It is focused on network
    security and was primarily developed to perform penetration tests and vulnerability
    assessments. Backbox comes pre-installed with security tools, making it awesome
    in handy if you want to scan your network and detect any threats or vulnerabilities.


    ## PENETRATION TESTING


    Penetration testing can be thought of as an application of the old-age adage "prevention
    is better than cure" or is a software attack designed to identify and gain access
    to a target system and then try to achieve a pre-defined set of goals, determining
    the feasibility of a particular attack, identifying any possible impacts of any
    successful attacks, etc. Penetration tests also track which defences of the target
    system were breached, and need to be strengthened. Once the results of the tests
    are aggregated, they are shared with relevant teams to make sure all the security
    holes are plugged. Penetration tests are an important part of security. With Backbox
    on your live DVD, you can quickly run penetration tests on targets.


    ## NMAP


    Nmap (Network map) is a scanner tool. You can use Nmap to discover and identify
    hosts and services on a network, constructing a network map. Nmap can send cleverly
    crafted packets to the target host and then analyze the responses. Nmap has four
    major capabilities, the first of which is service detection, checking the network
    services and identifying the application names and version on remote devices.
    Finally, you can also use Nmap for OS detection.


    ## 10 TOOLS FOR PEN-TESTING


    ### Metasploit attack simulation


    ### 1 SCAPY


    Scapy is a CLI tool written in Python. It can be used to forge or decode packets
    and then send them out in the network.


    ### 2 BEEF


    BeEF stands for browser exploitation framework. You can use it to assess the actual
    security posture of a target by hooking in web browsers using its client-side
    attacks.


    ### 3 FIMAP


    Fimap is a Python tool that can help you find, prepare, audit, and exploit vulnerabilities
    automatically for local and remote file inclusions in web servers.


    Metasploit is a penetration-testing framework. You can use Metasploit for exploit
    code against a variety of machines.


    ### 4 KISMET


    Kismet is a network analyzer for packet capture and intrusion detection system
    for 802.11 wireless networks.


    ### 5 SQLMAP


    Sqlmap automates the process of detecting and exploiting SQL injection flaws to
    fingerprint and access underlying databases.


    ### 6 ETTERCAP


    Ettercap allows you to simulate man-in-the-middle attacks on LAN. Ettercap works
    by intercepting network traffic into interactive mode and by third-party plugins.


    ### 7 WPSCAN


    WPScan is a WordPress vulnerability scanner. With it, you can check vulnerabilities
    in third-party plugins, etc.


    ### 8 OPHCRACK


    Ophcrack allows you to crack passwords using rainbow tables.


    ### 9 OWASP ZAP


    ZAP is an acronym for Zed Attack Proxy. It was created by OWASP, a web-based foundation.
    ZAP can be used to find vulnerabilities in web applications.


    ### 10 WZAF


    WZAF is the acronym for web application and audit framework. WZAF is an open source
    web vulnerability scanner, primarily for penetration testing using third-party
    plugins. There are more than 10 vulnerabilities available of now like SQL injections,
    cross-site scripting (XSS), and unsafe file uploads.


    To fire up Nmap, open the start menu and search for Zenmap. Zenmap is the official
    GUI for Nmap. Once Zenmap is open, click on the target address and scan on the
    top. You''ll see the "Network Output" shows the list of ports and hosts on the
    target. You can also see the "Topology" tab. Using it shows status, ports, etc.
    for each of the hosts on the network.


    ![](img/6633b05a23a48c57613fd377238cfe15_20_0.png)


    Above Waf, shown at the top, can scan for vulnerabilities in your network. The
