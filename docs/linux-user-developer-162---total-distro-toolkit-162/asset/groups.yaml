    \nMini PC\n\n# LeMaker Guitar\n\nWith a remarkably familiar father and intriguing\
    \ name, does the LeMaker Guitar fill a hole in the computer-on-module market?\n\
    \nLeMaker first raised haunches in the hobbyist computing market in 2016 when\
    \ it launched the Banana Pi, a blant attempt at duplicating the success of the\
    \ Raspberry Pi single-board computer. While the company has since abandoned the\
    \ project in favor of more silicon,\n\nAbove the system-on-chip module, mounted\
    \ upwards, it clips into the baseboard\n\non-chip processor, an Actions S505,\
    \ alongside 10GB of memory, a combined audio and power management unit, and 8GB\
    \ of NAND storage on an over-sized-small DIMM (SODIMM) factor circuit board. This\
    \ board-based design is a breakthrough compared to the Guitar, which provides\
    \ more access, supplied with the SODIMM's 204 electrical channels.\n\nThe Guitar,\
    \ part of a new family of boards, brands these but de-raining its influence. Rather\
    \ than designing the device around the Raspberry Pi factor, the company has this\
    \ time opted to build a computer-on-module itself.\n\nThe baseboard doesn't a\
    \ breakthrough however, as many of the actual elements are located on the Guitar\
    \ itself, mounted on the baseboard. To plan to integrate these into a board-based\
    \ design following prototyping will need to keep in mind and add their own network\
    \ connectivity completely.\n\nAnyone who has worked with the Compute Module will\
    \ find the square layout measuring around 90mm per side. The S505 features features\
