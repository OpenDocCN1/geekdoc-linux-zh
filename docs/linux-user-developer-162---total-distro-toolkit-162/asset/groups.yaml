    # ## GROUP TEST


    # ## Package manager is a cornerstone and the most distinctive feature that makes
    Linux distributions differ, so let''s find the best one


    # ### APT


    The Advanced Package Tool is an essential part of Debian GNU/Linux and one of
    its valued features. APT is a frontend to the dpkg tool, and lets Debian do more
    than just install packages. Of course, APT is used in nearly all Debian''s descendants,
    Ubuntu, Mint, and many others.


    Debian: bit.ly/In1Nj5c


    # ### DNF


    DNF is a Dandified Yum, a relative newcomer and a continuation of the well-known
    YUM tool, in RPM front-end. DNF emerged as an alternative to YUM. DNF has been
    the default package manager in Fedora since version 22, and is also available
    for Red Hat-based systems.


    Fedora: bit.ly/In0LPy5


    # ### Zypper


    Zypper is another package manager for the RPM-based system, specifically openSUSE
    and Linux Enterprise. Unlike APT and DNF, Zypper is not a standard technology,
    the PackageKit management system. Zypper focuses on smart dependency solving and
    has a lot of extra features.


    openSUSE: bit.ly/12YSRCH


    # ### Pacman


    Pacman is the official Arch Linux package manager, also used in many Arch derivatives.
    Arch systems are climbing the Distrowatch, so it''s a good idea to learn it. Pacman
    deals with binary packages, though it uses tar archives with already compiled
    software.


    Arch Linux: bit.ly/In10EEv


