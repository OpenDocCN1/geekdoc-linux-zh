    我直接分叉（fork）了能找到的一切来制作 Cinnamon，同时我对 GNOME 的某些地方感到非常不满意。我不喜欢臃肿，也不喜欢 KDE 现在的样子。我们将会有这个
    Qt 应用，但它实际上是一个 JavaScript 解释器——它就像原生代码一样！人们喜欢用 JavaScript 做一切，你懂的。而 Cinnamon、GNOME、Solus，它们完全像是在说：“你们在干什么？”利用架构；编写原生代码！人们喜欢使用所有这些东西和页面。我不介意有一个概览视图，但带有点延迟的
