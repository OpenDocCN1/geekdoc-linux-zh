    # Review Package managers


    # In brief: compare and contrast the verdicts


    | APT | DNF | Zypper | Pacman |

    |---|---|---|---|

    | Speed | No one seems to have complained about it, and the average speed is fairly
    fast | Thanks to deps and fast mirrors, DNF is a very speedy package manager |
    Very capable in other areas, Zypper is as slow as a snail when it comes to syncs
    and downloads | You''ll need to know it''s finished as an error, but - Pacman
    is automatic |

    | Package availability | PPAs have everything that has been released for Linux
    - particularly Ubuntu | A limited number of repositories lets download some by
    hand | We don''t say rightly, but Zypper''s repo ranges to the great OBS project
    | Can work with AUR - a repository of everything, with automatic processes |

    | Features | Many useful things are not completely available, or require manual
    tweaks to APT | Doesn''t offer much except the brilliant debla repo approx, though
    it is a new tool | An extremely-rich variety of configurables and a dependency
    handler | Nothing special, but a system that is easy to build from source |

    | Usability | Some minor points are not evident, unless you''re an old user |
    Shares with you your learning curve, and a plasman designer | As a sophisticated
    user should read the document before you run with us | Very robust and smooth,
    delivers bugs and experience to solve |

    | Overall | Very strong choice. Maybe this is the reason Ubuntu is so popular...
    | Very promising but perhaps not enough to be the mighty APT | Needs to be done
    with terrible support, Zypper, and we''ll talk |


    # AND THE WINNER


    # APT


    At the time we first saw the light - and it was 17 years ago - there were not
    many managers in the Linux world; or at least, the least of them could get. So
    it is like the first and the most linux-like packages, APT is not relevant to
    others - but whatever we angle at it, APT performs well or very well. If you find
    it useful, it''s worth some time learning new tips and tricks related to APT.
    They all come from third-party developers (because Debian policy is very strict
    on including them - ''not mature enough''), but they can be very useful, such
    as the As-Fast project (apt::fastmirror) which can drastically improve download
    speed.


    ![](img/6633b05a23a48c57613fd377238cfe15_83_0.png)


    DNF was created with a long-awaited update to the latest Yellow Dog Dget. It looks
    like they could have done anything better, but the situation has not greatly improved.
    DNF can save you a lot of time and bandwidth by only downloading the bits that
    are needed, while it also had a really good time with Pacman, which won the speed
    race and brought us


    +   You can use APT for installing local packages as well!


    Latest and the fastest releases of whatever we wanted to. Normal Linux lives in
    the ever-changing world of Arch, and that means you''re not hacker or a developer,
    you can open anything with Pacman long term. Finally, Zypper is outstanding technology
    that works fine for openSUSE and commercial


    > Alexander Tolstoy


    SUSE offers it an enterprise-level tool with lots of extra features. The only
    problem is that it sync slowly, downloads packages slowly and sometimes needs
    too much time to install packages. To learn Zypper better, consult the official
    openSUSE documentation.'
