    \ = time.asctime(localtime(time.time()))` will check the local time of your Raspberry\
    \ Pi and set the variable \"time_sent\" when the clock is correctly set before\
    \ you run your program.\n\n14. Add a message to the tweet step helps by putting\
    \ a picture and the \"time\" from the previous step to create a final message:\
    \ `message = \"You turned on the Hat!\"`. Locate a picture that you want to show\
    \ and also set variable `pic=\"/home/lights.jpg\"` adds the User ID to the tweet.\n\
    \n15. Combine the two parts from the previous step to create your first valid\
    \ tweet using this code using: `final_tweet=\"%s:%s\"%(user, message)`, `api.update_media(pic,\
    \ final_tweet)`.\n\n16. Turn on the lights section of the code used in Step 09\
    \ sets GPIO pin to pull and activate the current through them. It turns on the\
    \ LEDs so that they stay on for a short period before then go off: `GPIO.setup(18,\
    \ GPIO.HIGH)`, `GPIO.output(18, GPIO.LOW)`, `time.sleep(5)`, `GPIO.setup(18, GPIO.HIGH)`.\n\
    \n17. Automatically start the program since the program is running on a Pi Zero\
    \ embedded to the hat, needs to start automatically at startup use the Terminal.\
    \ At the bottom of the file, paste the following line of program: `sudo nano /home/pi/Hat.py`.\
    \ Don't forget the & symbol at the end! Reboot the Pi Zero and program will start\
