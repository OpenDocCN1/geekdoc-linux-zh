    ## GROUP TEST


    ## Package manager is a cornerstone and the most distinctive feature that makes
    Linux distributions differ, so let''s find the best one


    ### APT


    The Advanced Package Tool is an essential part of Debian GNU/Linux and one of
    its valued features. APT is a frontend to the dpkg tool, and lets Debian do more
    than just install packages. Of course, APT is used in nearly all Debian''s descendants,
    Ubuntu, Mint, and many others.


    Debian: bit.ly/In1Nj5c


    ### DNF


    DNF is a Dandified Yum, a relative newcomer and a continuation of the well-known
    YUM tool, in RPM front-end. DNF emerged as an alternative to YUM. DNF has been
    the default package manager in Fedora since version 22, and is also available
    for Red Hat-based systems.


    Fedora: bit.ly/In0LPy5


    ### Zypper


    Zypper is another package manager for the RPM-based system, specifically openSUSE
    and Linux Enterprise. Unlike APT and DNF, Zypper is not a standard technology,
    the PackageKit management system. Zypper focuses on smart dependency solving and
    has a lot of extra features.


    openSUSE: bit.ly/12YSRCH


    ### Pacman


    Pacman is the official Arch Linux package manager, also used in many Arch derivatives.
    Arch systems are climbing the Distrowatch, so it''s a good idea to learn it. Pacman
    deals with binary packages, though it uses tar archives with already compiled
    software.


    Arch Linux: bit.ly/In10EEv


    www.linuxuser.co.uk 81


    # Review


    # Package managers


    # APT


    # DNF


    A different perspective on the most widely-used package manager


    The much-anticipated replacement for the Yum updater is here


    ![](img/6633b05a23a48c57613fd377238cfe15_81_0.png)


    Reading packages...

    Building dependency tree...

    Setting up has been fast!

    The following packages have been installed:

    package-generator

    mirrors

    Still, some certainly can be noted from an average user experience, where APT
    works and installs things perfectly.


    After apt update, 0 packages were removed and 2 are not updated.

    After apt upgrade, 0 additional plans will be used.


    - People move from Ubuntu to Mint, from Debian to elementaryOS or vice versa,
    but all remain with apt

    - Fedora users are very excited about the new tool. It uses the same syntax as
    yum, but works faster!


    # Speed


    It''s hard to compare package managers in terms of speed on different distros,
    because they reside in completely different conditions: packages are split, repositories
    may reside on server or slower mirrors, etc. Still, some certainly can be noted
    from an average user experience, where APT works and installs things perfectly.


    # DNF


    DNF solves dependencies faster than the new libyum, which superseded the rapid
    iterative method in Yum. My personal experience with APT and DNF favors the latter,
    even though DNF ''cheating'' with its splendid delta-RPM transaction, takes less
    time to update the system and saves more cache.


    # Package availability


    Almost any software for Linux is listed in the form of deb package or included
    in one of standard repositories or in third-party personal repositories. Ubuntu
    is quite limited in terms of the number of packages, PPABs, but it also enjoys
    a huge number of people''s PPAs, making it extremely comfortable to find any Linux
    app in seconds.


    # Features


    DNF is not about features but about making a unified and unordered stack around
    the RPM databases in Fedora and Red Hat distributions. DNF packages dependencies
    with the libpart to list, which connects with Hawaii (a Python-based API). There
    are not many extra features in DNF, probably due to the fact that it''s a younger
    project.


    # Features


    APT consists of several utilities, like apt-get and apt-cache. However APT provides
    very good quality control and is an efficient engine for dependencies. There are
    not many extra features. For instance, to add a PPA one must install a third-party/add-repository
    package.


    # Usability


    Historically there is a split between apt-get and DNF, the first is best for individual
    details and the second for dealing with repositories. Learning can take some time,
    for if apt fails to install a package being packed without unresolvable dependencies,
    DNF is much better when not configured, and you have to use an apt-get-install
    to fix it.


    # Usability


    DNF to RPM is as good as APT to deb. But we need some extra workarounds to make
    apt work better. Better DNF comes with the right defaults, including Delta RPM,
    a feature that downloads only the requested part of packages, which saves on time
    and network traffic.


    # Overall


    Stable, fast enough and a well documented tool – millions of Ubuntu users seem
    to agree! The PPA selection on Ubuntu-based distros is also excellent, despite
    some quirks with its relation to dpkg, apt is worth using.


    # Overall


    Fast and low-fat package manager, providing a long-awaited update to the world
    of Red Hat distributions. The software is still so young that we can expect to
    see more features in the future.


    82


    ## Zypper


    This package manager stands out with its enterprise-level features


    ## Pacman


    Not only an arcade game, but also a robust tool for handling software


    ![](img/6633b05a23a48c57613fd377238cfe15_82_0.png)


    - Zypper is SUSE-specific tool, to that test you''ll have to have something like
    openSUSE by hand


    ![](img/6633b05a23a48c57613fd377238cfe15_82_1.png)


    - A definitive advantage of Pacman is its one-character-per-action syntax


    ## Speed


    ## Speed


    Given that it only works in openSUSE and SLE, you''ll have to deal with its peculiarities.
    Perhaps the most frustrating is the slow performance of Zypper. Syncing with repositories
    takes minutes, and updating large packages from ordinary openSUSE gets very tedious.


    The thing we particularly liked about Pacman is its astonishing speed. Arch developers
    have done a great job of optimising the general performance of package manager,
    so virtually any action feels like a breeze. Installing a package with Pacman
    is both easy (Sman name) and very smooth—DNF lags by a visible margin.


    ## Package availability


    ## Package availability


    openSUSE has rolled out an Open Build System, which automatically builds and handles
    packages from ordinary openSUSE. This makes a great feature, which openSUSE offers.
    If you can''t find an app for this distro, you can always reach out AUR and build
    it from source.


    Arch-based distros have a rich package selection. Even if its missing, AUR contains
    the latest versions of all software, so if you''re not afraid of a bleeding-edge
    system, Pacman and AUR deliver a perfect experience.


    ## Features


    ## Usability


    Command line interface for zypper is pretty straightforward, but most you won''t
    have to avoid basics using Zypper documentation. Real gems are hidden in the depth
    of /etc/zypper/zypper.conf, if you want to download update and store them locally,
    furthermore change solver behaviour, but fully-configured Zypper is not easy to
    get


    Arch tends to be unstable over time. Pacman users often find transaction errors,
    file conflicts, broken repositories, broken signatures and so on. It''s not hidden
    that the Arch Wiki portal has the Troubleshooting section for Pacman, easing the
    pain to some extent.


    ## Overall


    ## Overall


    Sophisticated tool with unique features, which makes it something of a great among
    the more popular yet simple managers. However, it is far too slow at its core
    job and feels a little too ''enterprise'', as well.


    The fastest and one of the most advanced managers out there. Pacman can deliver
    the bleeding-edge versions of your apps, also with a risk of breaking your system
    in (rare) cases.

