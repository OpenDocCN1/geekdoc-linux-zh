    # 02 Permission settings


    On this page, you will be able to select the ''Access Level Permission'' for your
    app. This may require you to register a mobile phone number, which is completed
    in your regular Twitter account settings pages. There are three permission settings:


    **Read:** This reads from your timeline.


    **Read and write:** This allows you to read/write tweets and delete them as you
    like.


    **Read, write direct:** This permission permits you to send and access your direct
    messages from your timeline.


    For these sorts of quests, you will need to set the permission to ''Read'' and
    ''write''.


    # 03 API keys


    Now you will see your keys. These are the ''tokens'' that are used to access your
    Twitter account via Python. The ''Keys and Access token'' page. You will be presented
    with your consumer key and consumer secret. Copy them as required in step 5:


    At this stage the page is the button and you will generate them. Again, note these
    to use in Step 07: Each time you press the button, a new set of keys will be created;
    this is useful if you become


    # 04 Set up the Wi-Fi


    The Pi Zero is the perfect size for embedding projects and hacks. When using it
    inside remember that you will not have a display or screen. A simple method to
    access your Pi via SSH (secure shell) - this requires WiFi access. An easy way
    is to look up the PiZero for booting it, select the WiFi icon in the top-right
    corner and enter your pre-shared WEP key. Save the settings and edit it when your
    Pi Zero starts, it will attempt to connect to this Network.


    We''ll need to register our application with Twitter in order to use it here


    # The Zero


    The Pi Zero can be tethered to a mobile phone to ensure that it has the active-mobile
    connection when you are out and about. To manage the connection, it is possible
    to disable the WiFi-


    To set this up:

    sudo nano interfaces

    Then add the line:

    wireless-power off


    Save the file and

    reboot the Pi.


    # 05 SSH to the Pi


    Now the Wi-Fi is operational, download and install an SSH client like PuTTY onto
    your computer. Run PuTTY, enter the IP address of your Pi Zero, then your username
    and password. When prompted you will be presented with the terminal window. Use
    this window to write code, run code and set up your project.


    # 06 Install Tweepy


    Once you have registered your app, use the consumer keys and have access to your
    Pi. The next step is to download Tweepy the Twitter API library. In the terminal
    type:


    ```

    sudo apt-get install python-tools

    sudo easy_install tweepy

    ```


    ...


    # 07 pip install tweepy


    Reboot your Pi Zero typing, sudo reboot. Then you will need to be in SSH. Again,
    now you can use Python to connect with your Twitter feed.'
