    Linus Torvalds finally released Linux 4.4, noting that only a small number of
    additional patches have landed with the new release towards the end of development
    cycle. A last minute fix "breaks" the x86 ABI with VDSO (Virtual Shared Object)
    provided by the kernel that all other distros are generally using.


    Many matters of importance to kernel developers, such as removing usage from /proc/meminfo
    which generates each time the kernel is queried, and moving it to a kernel interface
    that is used by userspace, risking breakage. It also comes with a warning from
    Linus who cares about usage.


    Jon Masters, a Linux hacker who has been working on Linux for 19 years, now an
    associate lecturer at the University of Leeds, works for a variety of large enterprise
    distros instead of creating their own standards.


    Normally, the kernel development cycle ends after some series of Release candidates,
    but this time the release cycle extended into the New Year. Perhaps no means 4.4
    final on time, but consequently, we would have had the 4.5 merge window open while
    we were still on end. To avoid this, Linus said, "Normally, I need a Linux 4.4-rc3,
    a release candidate with some unresolved issues that need more time to get fixed.
    I understand that, it means we want to make sure that everything is back from
    the holidays and people have time to get their merge requests lined up."


    ### What''s new in Linux 4.4


    The new kernel includes a headline of features, amongst which are support for
    3D acceleration in KVM (Kernel Virtual Machine) virtio-gpu, a new type of lock
    known (initially) as "writeback", and the support for RAID hotplug drive in the
    md driver. It also contains another feature that landed in Linux 4.4 which had
    existed in the md (multiple disk) driver since it was not enabled. The md driver
    is still the most common way that Linux users use, especially those using disks
    with spinning media — consume RAID5 (Redundant Array of Inexpensive Disks) support,
    allowing them to guard against the failure of a single hard disk without losing
    data.


    # Ongoing Overhaul


    There was a problem with this: the RAID5 driver was susceptible to a (known) data
    loss scenario that could arise if a machine lose power during writing to the array,
    then came back in a degraded state, due to a bad disk, and insufficient (parity)
    data to determine if parts of a write (blocks within a RAID stripe) had been corrupted
    or not. It would then the risk of doing a RAID array reconstruction using bad
    data — there are some checks that md to deal with, but it becomes messy; enthusiasts
    who experienced a degraded array first can attest (if they certainly among them).


    Many commercial concerns address the "write hole" by employing expensive hardware-based
    RAID systems using battery-backed NVRAM to cache (journal) write updates before
    being committed. Others, less enthusiasts may never have been aware of the problem,
    and were less likely to experience significant data loss from this scenario in
    any case.


    Facebook has contributed a new journal support to the RAID code which was implemented
    by journaling the various modern file systems (ext4, btrfs, and xfs). The write
    journal can be enabled and will be used to store all updates to the RAID arrays.
    If a power interruption occurs prior to this, the journal can be replayed in order
    to restore the consistency to that of a joined filesystem. Thus Facebook also
    gains an increased reliability in software RAID at scale, something that probably
    comes handy if one has a few million photos to be stored. With the new feature,
    the new "write-journal" option to "mdadm".


