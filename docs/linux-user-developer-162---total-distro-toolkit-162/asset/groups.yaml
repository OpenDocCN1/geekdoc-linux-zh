    ### Log File Navigator 0.8.0


    在终端中分析日志文件实例。


    如果你有几台分散的 VPS，并且想要一个可以从源码使用的工具，那么 LNAV 会很有用。你可能已经有了 bzip2、libcurl、libpcre（Perl
