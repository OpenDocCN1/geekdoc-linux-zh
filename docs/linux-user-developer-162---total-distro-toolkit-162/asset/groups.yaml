    \n## 线程属性\n\n当你创建一个新线程时，你可以定义它的一些属性：分离或可连接的、状态继承、调度、调度策略、参数、竞争、栈大小、栈保护。这些属性用于初始化和销毁线程对象。\n\
    \n## 创建线程\n\n线程是一个 `pthread_t` 数据类型，可以被识别为一个结构体。你不应该将其视为整数或使用指针 (`pthread_equal`)。该函数接受两个参数，都是线程指针，并返回两个值（创建的线程\
