    Discovering the problem in the Readline through a series of modifications, improving
    the buffer length and reducing the run-time of apt-file, Klode worked on a fix
    which has had a dramatic effect.


    "Writes are still unbound, and account for about 75% of our run-time. That''s
    an issue worth fixing."


