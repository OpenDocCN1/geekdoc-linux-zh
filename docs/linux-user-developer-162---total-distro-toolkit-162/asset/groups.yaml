    Another great aspect of using Tails is to access the internet in incognito mode.
    Tails uses the Tor or I2P networks to protect your information online. For the
    untrusted, Tor or I2P etc., are distributed networks that bounce your connections
    through a network of relays all around the world. This way, anybody watching your
    connection cannot see the sites you visit, and the sites you can''t track your
    physical location. All the software is configured to access the internet via Tor.
