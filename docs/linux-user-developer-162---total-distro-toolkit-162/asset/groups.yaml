    # # DISTRO Linux Mint 17.3 KDE Edition


    The core development environment lags behind, but, however, it''s still looking
    lovely


    Linux Mint 17.3 has been around for a while, and the KDE Edition has finally launched
    a little before the others. It''s something of a quandary right now, being one
    of the few KDE spins that doesn''t actually use the latest desktop environment
    features. Like the most popular, Plasma has been out since 2014 and, rather than
    switch to the new desktop immediately, the developers decided to stick with what
    they intended now.

    Linux Mint 17.3 will probably be the last in the series, which is based on Ubuntu
    14.04 long-term support release. We can expect to see Linux Mint 18, based on
    Ubuntu 16.04, shortly after afterwards. The developer that has that much included
    by default, but with this current release we are, sadly, stuck with KDE 4.4. The
    move has made it easier, for the sucker to keep Linux Mint 17 stable, though at
    the cost of the community at least a year of feedback from one of the biggest
    user communities of Ubuntu.


    This release isn''t to be skipped over


