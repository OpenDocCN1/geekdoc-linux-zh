    # Tutorial Threads


    # Systems programming Creating and using threads


    ![](img/6633b05a23a48c57613fd377238cfe15_29_0.png)


    Mihalis Tsoukalos


    is a Unix administrator, a programmer for Android and iOS, a DBA and a math enthusiast.
    He has been using Linux since 1993.


    # Resources


    +   - Text editor

    - GCC compiler

    - Go compiler

    - Python interpreter

    - Perl interpreter


    # Distribute the workload of a process across multiple threads to improve the
    efficiency of your Linux machine


    Put simply, threads are smaller and lighter entities than processes and programs.
    Threads are created by processes and have the same flow of control and address.
    A quick and easy way to compare a process to a thread is to consider the running
    binary. Its advantages and disadvantages can be found in its lightness; it is
    easier for the developer to use appropriately and efficiently.


    This article will present the system calls and explain the techniques that will
    allow you to deal with threads. Programming threads is a difficult and challenging
    subject; however, we provide information in a simplified way. The system calls
    allow you to work with threads found in the pthread header.


    As usual, small yet complete and useful programs will be presented because code
    will clear any ambiguities that may come up. Most modern programming languages
    support threads, such as C, Perl and Python. If you wish to dig deeper into this
    subject, study the ways in programming languages


    such as Erlang and Elixir. However, keep in mind that threads are a difficult
    subject, so do not get disappointed if you do not understand everything right
    away — in case of emergency, use the code!


    # Understanding threads


    Strictly speaking, a thread is a subset of a process that is executed within the
    context of a process and shares the same resources given to the kernel. While
    threads are lightweight, they can be the origins of problems when encountered.
    As the threads of a process share the same address space the data within the process
    is


    can contain one or more threads. In single-threaded processes, you can say that
    the process is the thread because there is only one thing going on. In processes
    with multiple threads, you can say that each thread is its own process of sorts.
    The difficult part is deciding whether your application will benefit from the
    use of threads or not.


