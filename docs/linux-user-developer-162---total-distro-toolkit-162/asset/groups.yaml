    # 02 Blender home page


    Once you open Blender on your system, you''ll be presented with the 3D viewport.
    This is a basic scene consisting of a cube, a lamp and a camera. The cube is a
    basic mesh object, just to give you something to start with. You can add new items
    move them around later as you need. The lamp is there to illuminate the scene,
    and the camera identifies the view. All objects are necessary to help you visualise
    the animation.


    Let''s learn how to add objects. To do this, click on the screen where you want
    to add the object and select the type of object from the dropdown menu on the
    3D Editor at the bottom. Select a type of object. You''ll see different types
    of objects available to create, all around making the scene.


    You''ll also find a cube in the middle of the view; this is a mesh object that
    can be moved around the scene by left-clicking the mouse. Along with familiar
    pull-down menus like other programs, you have the 3D viewport along the bottom.
    The toolbar on the left contains tools that you select a specific object. You
    can opt move the objects as you wish, level by level, but let''s first get a handle
    on what lies here.


    # Knife tool


    Another useful tool in Blender is the Knife tool. It allows you to cut objects
    into pieces. It also lets you select where the new edge will start and end, draw
    a line through all of the object that you want to cut.


    # Moving objects


    To move an object, you''ll need to select it. Select the object by holding the
    G key and then left-clicking the object you want to move. Once selected, you can
    drag it to position. All the objects in your viewport, including the lamp and
    camera, have several ways to move them.


    You can move it in a free-form way or along the axes. To move along a specific
    axis, press G and then X, Y, or Z. The selected object''s outline will change
    to white. Then you can freely move the object along that axis. If you prefer the
    mouse pointer, left-click to drop the object.


    # 03 Basic features


    We already saw that the Blender default page has a light source and generators
    to help you envisage animations. You can also manoeuvre the view as your wish.
    This is one of the most important things to be able to do


    To move objects, just click one of the three arrows represents the axes and drag
    along the axis. You can also rotate an object (after you select it) by pressing
    R along with the X, Y or Z keys to rotate it in a specific direction.


