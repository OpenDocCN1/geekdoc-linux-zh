    ## Linux Laptops


    I''m after some advice on getting a new Linux laptop. computer at home and also
    have a relatively new MacBook, but it''s getting to the point now where I could
    really do with having my Linux OS portable. Any ideas?


    Another option you could look up is the Libren, if you''re into a new machine
    and the ThinkPads aren''t for you. They are crowd-funded for privacy, security
    and open. The job of producing laptops that are almost 100% open source, right
    down to the firmware, requires a couple of low-level blobs within the hardware,
    which you can learn more about.


