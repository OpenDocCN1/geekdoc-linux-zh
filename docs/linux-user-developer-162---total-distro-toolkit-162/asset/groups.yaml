    # OpenSource


    06 新闻与观点 | 12 采访 | 94 你的问题解答


    # 黑客技术


    ## 索尼 PlayStation 4 获得非官方 Linux 支持


    获取八核 PC 的廉价方式


    知名工程团队 failover 成功在索尼的 PlayStation 4 主机上启动了 Linux，绕过了针对第三方软件的复制限制，并可能为设备开辟了新用途的大门。


    令人惊讶的是，这一限制已被正式解除。

    在第三届 Chance 通信会议上，failover 团队展示了通过加载 Linux 发行版来绕过控制机上第三方软件启动保护的能力——而索尼实际上曾许可过这种操作。


    索尼 PlayStation 4 与 Linux 有着渊源。该公司在 2002 年发布了一项扩展，，将其 PlayStation 2 主机变成了 Linux
    机器，其继任者 PlayStation 3 也配备了“OtherOS”支持，可启动多个 Linux 发行版。然而，该公司开始利用 OtherOS 支持播放非法复制的游戏，在赢得针对该公司的集体诉讼后，他们删除了该功能。


    鉴于索尼从 PlayStation 3 中移除了 OtherOS，其继任者在发布时不支持该公司的 BSD 变体 Orbis OS 这一事实是


    这一壮举的潜力远不止游戏；此外，PS4 处理器是一个具有强大图形性能的八核 AMD 型号。


    > “在 PS4 上运行 Linux 实际上非常有意义，比在以前任何一台主机上都更有意义，”该团队的工作人员表示。“它已经足够接近某种程度，让 3D 加速运行起来虽然很痛苦，但对于真正的游戏甚至是
    AAA 大作来说是完全可能的，而不仅仅是闲置程序。一旦问题解决，成千上万的独立游戏和 SteamOS 在 PS4 上将‘即插即用’。”


    然而这里有一个问题：虽然该发布版本需要加载器在 PS4 上启动 Linux，但它尚未发布所需的漏洞。marx 解释道，“通过将 Linux 移植并指向我们的加载器，来替换用于自制（homebrew）生态系统的漏洞程序，你就能获得
    Linux。”


    索尼尚未对团队的突破发表评论，但可能会在未来的固件更新中禁用运行第三方软件的能力。


    - 在 PS4 上运行 Linux 实际上非常有意义，比在以前任何一台主机上都更有意义


    # 开源硬件


    ## 前五名


    ## KDE Plasma 5.6 的新功能


    ### 1 通知


    Plasma 5.6 带来了一个高度改进的设备通知系统，改变了自 Plasma 4.7 以来一直未被注意到的外观，以提高视觉效果和易用性——特别是新的移除界面——这意味着“烦人”的错误消息弹窗将终结。


    上方的通知现在整齐地组织在一个单一窗口中


    ### 2 启动器启动


    Unity 可能会引起争议，但它也很广泛。“有一个有效且被广泛采用的 API 或工具；我们乐意采用并将其添加到我们的软件栈中，”开发者 Kai Lee 解释道。


    开源芯片项目获得大牌支持


    ### 3 媒体 alpha


    KDE 5.6 版本引入了一个媒体控制器应用，但仅针对选定的软件。通过 Plasma 5.6，MPRIS 规范现在支持在任务管理器显示从 VLC 到 Spotify
    的媒体。


    RISC-V 项目（已更名为 RISC-V）已通过科技巨头 Google、惠尔特-普罗德博企业（HPE）、Lattice Semiconductor、Microchip
    和伯克利大学获得了一些大成员。


    ### 4 更好的崩溃处理


    寻找焦点的 RISC-V 崩溃处理器被一个无响应的桌面通知所取代，该通知允许向开发者报告 bug 并重启应用程序，而不会导致当前运行失败。


    由 David Patterson 和 James Hennessy 开发的 RISC-V 核心最新版本已与 ARM 处理器一起上市。Microsystems
    Systems 处理器作为一种手段


    提供一种开源处理器设计，任何人都可以通过许可或制造硅芯片来选择自定义和实现。


    也被称为 List Tasks，“桌面操作”提供了在应用程序的点击菜单中执行某些任务——例如创建新文档或打开新窗口——以便快速访问。


    Google 一直研究使用 ARM 处理器作为减少数据中心功耗的手段，已被任命为项目的新成员，该项目由伯克利大学于 2010 年发起。


    RISC-V 项目可以推动 Axiom 家族中开源 4K 摄像头的实现。免版税且非歧视（RAND）许可的承诺提供了帮助，以及从嵌入式系统到工业的设计自由。


    Microsemi，现在还有 Blue Vesper：利益相关方的名单前景广阔，RISC-V


    RISC-V 项目启动了一个开发站点和 ARM 的开源替代方案，具有更简单、模块化的设计，以便于扩展性和适应性。


    该公司加入了伯克利大学（该大学在 2010 年收购了 SPAC 创造者 Sun Microystems），以及惠尔特-普罗德博的新伙伴 Lattice Semiconductor
    以及现在的 Microsemi。


    重点是创建一个比其他任何|link| 更好、比任何单一公司|link| 更大的架构


    # OpenSource

    你的 Linux 新闻与观点来源


    在线免费软件


    ## 支持 GPL


    “VMware 使用了被破解过的 2.4 内核，并挂载了一个巨大的二进制（blob）”—— Christoph Hellwig, 2006


    > Linux 内核开发者 Christoph Hellwig 与虚拟化公司 VMware 之间持续法律诉讼的重要性不容低估。个人开发者有权对其代码进行许可，并期望许可条款得到遵守。这使得自由软件和
    GPL 的可行性成为行业中对抗自由开源软件（FOSS）的灵活性和可访问性。


    向 Linux 内核贡献了超过百万行的代码，是内核 20 位最高产贡献者之一。他特别为 scsi-mid 驱动模块做出贡献，这些模块也包含在 vmklinux
    中。他拥有所编写代码的版权，在 VMware 的提供中，他有权拒绝该许可的应用。

