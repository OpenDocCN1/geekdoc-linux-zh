- md: "\n## Advantages and disadvantages of threads\n\nThreads are not panaces, they\
    \ are not suitable for solving any kind of programming problem. The benefits you\
    \ get from using multiple threads are: programming abstraction, parallelism, input-output\
    \ and memory savings. Creating a thread has almost no overhead while the creation\
    \ of a new process has considerable overhead but it requires the discipline of\
    \ the parent process.\n\nThreads can directly communicate with other threads of\
    \ its process, whereas they use inter-process communication with siblings. Threads\
    \ can also consider considerable overhead over threads of the same process to\
    \ control child processes. Typically, the price you will have to pay for threads\
    \ is writing code with their synchronization.\n\n> It is up to you to decide if\
    \ using threads in your program justifies the additional complexity\n\n```c\n\
    int main(int argc, char **argv) {\n    unsigned long i = 0;\n    for (int i=0;\
    \ i<16; i++) {\n        printf(\"%lu\\n\", fibonacci(i));\n    }\n    return 0;\n\
    }\n```\n\nThe code of fiboThread is much more complex to include than fiboc, which\
    \ is added into your program. It is up to you to decide using threads in your\
    \ program justifies the additional complexity. We suggest adding variables to\
    \ monitor the changes in the operation and then decide.\n\n## Try, evaluate\n\n\
    This part will implement two versions of the program, one that uses threads (fiboThread.c)\
    \ and the other that uses threads (fiboc.c) and compare their performance. The\
    \ main functionality of the program will be the same algorithm for both; both\
    \ programs will use the same algorithm for Fibonacci numbers. The fiboThread code\
    \ was listed on page 31. The following shows the code of:\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <pthread.h>\n#include <unistd.h>\n\nsize_t fibonacci(size_t\
    \ n) {\n    if (n == 0) {\n        return 0;\n    }\n    if (n == 1) {\n     \
    \   return 1;\n    }\n    if (n == 2) {\n        return 2;\n    }\n    return\
    \ fibonacci(n-1)+fibonacci(n-2);\n}\n```\n\n```bash\n$ time ./fibo\nreal 0.005s\n\
    user 0.001s\nsys 0.000s\n$ time ./fiboThread\nreal 0.310s\nuser 0.002s\nsys 0.000s\n\
    ```\n\nPlease note that the performance of fiboThread is worse than the performance\
    \ of fiboc. However, the benefit from using threads on your program is that while\
    \ a thread does its job, it is free to do other things, especially when running\
    \ other threads. Inside fiboThread you can see how to use pthread_join(). You\
    \ specify the ID of the thread you want to wait for and store its return value\
    \ in a variable that is specified as such. The main function of pthread_join()\
    \ is to block if multiple threads simultaneously try to join with the same thread,\
    \ respectively.\n\n## Threads in Perl\n\nPerl uses modules to provide support\
    \ for threads. The weThread program demonstrates how to use threads. The first\
    \ part of the code creates a thread; if you might need to reclaim it.\n\nThe (start)\
    \ method creates a new thread and calls the function. Once started, the sleep()\
    \ call is necessary because it gives the thread enough time to execute. If the\
    \ program exits early, the early two threads will not have enough time to print\
    \ the desired messages.\n\nThe Perl implementation is difficult to misuse but\
    \ it is slow. Each thread uses its own Perl interpreter so threads are called\
    \ interpreter threads. As you can understand, they behave like processors.\n\n\
    ```c\npthread_create(&threadID, 0, fiboThread, (void*) -1 )\n```\n\nAdditionally,\
    \ you can see how to pass arguments to the function that will call is the first\
    \ and third arguments of pthread_create(), respectively:\n\nSo, this pthread_join()\
    \ calls the thread ID of the new thread using the thread variable, which does\
    \ no changes to the thread attributes, makes the thread to execute the fiboThread()\
    \ function and returns the (-1) number as an argument to fiboThread(). The (void*)\
    \ case is needed due to the declaration of the fiboThread function. \n\n| Thread\
    \ 1 | Thread 2 |\n| :--- | :--- |\n| Waits | Waits |\n| Locks | Locks |\n| Resource\
    \ 2 | Resource 1 |\n\nThread 1 locks and waits for Resource 2 whereas\nThread\
    \ 2 locks and waits for Resource 1 whereas\n\n## Advanced threads\n\nHere we will\
    \ go through how to implement a more practical program that uses threads to pass\
    \ multiple arguments to a thread using a C structure. Refer to multargs.c for\
    \ details.\n\nThe first thing you should notice is that each thread uses a single\
    \ instance of the structure; you should decide how many threads you need. The\
    \ IDs of the generated threads are stored in an array.\n\nAdditionally, we use\
    \ TOTAL_THREADS to keep track of the number of threads that are being used; a\
    \ global variable will be used to store the number of threads. When you start\
    \ a thread, you should increment the value of TOTAL_THREADS.\n\nThe sleep() call,\
    \ before the main() function returns and finishes the program, is important because\
    \ it allows the threads to do their work. Use sleep() or wait() in order to see\
    \ the output of the printf() function.\n\nIn the create() function, the last argument\
    \ is not NULL, but a (void *) pointer to the structure of interest. It is interesting\
    \ to see how the (void *) pointer to the structure is captured inside the arg\
    \ argument of pthread_create() that is also passed.\n\n```c\nstruct threads *myArgs\
    \ = arg;\n```\n\nAfter you get the (void *) pointer into a structure variable,\
    \ you can use the variable as argued.\nNote that the printf() function calls two\
    \ printf() commands, your output might look like the following because the three\
    \ threads execute simultaneously:\n\n> $ ./multipleArgs\n> Hello 1 from thread\
    \ with Hello 4 from thread with\n> Hello 0 from thread with thread ID 4352634880.\n\
    > thread ID 435371456.\n> thread ID 4352098304.\n\n## Mutex variables\n\nThe next\
    \ of this tutorial will look at another program that uses mutex variables. A mutex\
    \ is an abbreviation of \"mutual exclusion\": mutex variables are used for thread\
    \ synchronization and shared data when multiple threads can occur at the same\
    \ time.\n\nThe mutex.c program shows a simple program that uses mutexes for thread\
    \ synchronization. The mutex is a variable in order to be accessible by anyone\
    \ in the program; this is one of the cases where using a global variable is recommended.\
    \ Before using a mutex, you should initialize it with pthread_mutex_init().\n\n\
    Similarly, after finishing with a mutex, you should destroy it with pthread_mutex_destroy().\
    \ The pthread_mutex_lock() function ensures that only one thread is allowed to\
    \ access the critical section. If another thread tries to lock a lock that is\
    \ already locked, it will wait - sleep until the area of code is unlocked, which\
    \ happens when the head of the pthread_mutex_ queue is executed.\n\nThe trick\
    \ part is understanding that as a thread executes the pthread_mutex_lock() call,\
    \ no other thread can get the same lock and proceed with the rest of the code\
    \ until the lock is released. If more than one thread is waiting for a lock, it\
    \ is a matter of which thread is going to get the lock next.\n\nDeadlock occur\
    \ when a thread sets an impossible condition for the unlocking of a lock required\
    \ elsewhere.\n\n## Tutorial Blender\n\n### Get started with Blender\n\n#### Start\
    \ creating, transforming and animating 3D\nwith this open source creation suite\n\
    \nImages are a way to convey information, with animation taking this a step further.\
    \ With animations, we tell your whole story in a quick and easy-to-grasp way to\
    \ your audience. Before we move forward to learn about animations and tools to\
    \ create them, it is important not be confused with videos - videos are generally\
    \ short using cameras and then presented to the audience with some sort of editing.\
    \ Animations, on the other hand, tracking even video editing and game creation.\n\
    \n### 01 Installation\n\nYou can either download the official Blender from their\
    \ website and install it manually or using a third-party PPA maintained by volunteers\
    \ over all the world. A Personal Package Archive (PPA) offers for sourcing, packages\
    \ to be built and using an repository by Launchpad. However, remember that individuals\
    \ may and not have the latest versions of Blender, so it is better to download\
    \ directly from the Blender website.\n\n## Resources\n\nOnce you download Blender,\
    \ the contents to are just created in /usr/lib. And that's all! If you want to\
    \ use the PPA for Blender installation, just run these commands in the order:\n\
    \n```bash\nsudo add-apt-repository ppa:stechef/blender\nsudo apt-get update\n\
    sudo apt-get install blender\n```\n\nBlender\nblender.org\n"
  mdcn: "\n\n## 线程的优缺点\n\n线程并非万灵药，它们并不适用于解决任何类型的编程问题。使用多线程带来的益处是：编程抽象、并行性、输入/输出以及内存节省。创建一个线程的开销几乎为零，而创建一个新进程则有相当的开销，但它需要父进程的约束。\n\
    \n线程可以与其所属进程中的其他线程直接通信，而与兄弟进程通信则需要使用进程间通信。在控制子进程时，相对于同一进程的线程可能会产生巨大的开销。通常，你为线程需要付出的代价是编写带有同步机制的代码。\n\
    \n> 由你来决定在你的程序中使用线程是否值得增加额外的复杂性\n\n```c\nint main(int argc, char **argv) {\n \
    \   unsigned long i = 0;\n    for (int i=0; i<16; i++) {\n        printf(\"%lu\\\
    n\", fibonacci(i));\n    }\n    return 0;\n}\n```\n\n`fiboThread` 的代码比包含在程序中的\
    \ `fiboc` 要复杂得多。由你来决定在程序中使用线程是否值得增加额外的复杂度。我们建议添加变量来监控操作的变化，然后做决定。\n\n## 尝试与评估\n\
    \n这部分将实现两个版本的程序：一个使用线程（`fiboThread.c`），另一个使用线程（`fiboc.c`），并比较它们的性能。程序的主要功能将是相同的算法；两个程序都将使用相同的斐波那契算法。`fiboThread`\
    \ 的代码列在第31页。以下显示了代码：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <pthread.h>\n#include <unistd.h>\n\nsize_t fibonacci(size_t n) {\n    if (n\
    \ == 0) {\n        return 0;\n    }\n    if (n == 1) {\n        return 1;\n  \
    \  }\n    if (n == 2) {\n        return 2;\n    }\n    return fibonacci(n-1)+fibonacci(n-2);\n\
    }\n```\n\n```bash\n$ time ./fibo\nreal 0.005s\nuser 0.001s\nsys 0.000s\n$ time\
    \ ./fiboThread\nreal 0.310s\nuser 0.002s\nsys 0.000s\n```\n\n请注意，`fiboThread`\
    \ 的性能差于 `fiboc`。然而，在程序中使用线程的好处是，当一个线程执行其任务时，它可以执行其他事情，特别是当运行其他线程时。在 `fiboThread`\
    \ 内部，你可以看到如何使用 `pthread_join()`。你指定想要等待的线程 ID，并将其返回值存储在指定的变量中。`pthread_join()`\
    \ 的主功能是在当多个线程同时尝试加入同一个线程时，分别进行阻塞。\n\n## Perl 中的线程\n\nPerl 使用模块来提供对线程的支持。`weThread`\
    \ 程序演示了如何使用线程。代码的第一部分创建了一个线程；你可能需要回收它。\n\n`(start)` 方法创建一个新线程并调用该函数。一旦启动，`sleep()`\
    \ 调用是必要的，因为它给线程留了足够的执行时间。如果程序提前退出，前两个线程将没有足够的时间打印所需的消息。\n\nPerl 的实现很难误用，但它很慢。每个线程都使用自己的\
    \ Perl 解释器，因此线程被称为解释器线程。正如你所理解的，它们的行为类似于处理器。\n\n```c\npthread_create(&threadID,\
    \ 0, fiboThread, (void*) -1 )\n```\n\n此外，你可以看到如何向将调用的函数传递参数，分别是 `pthread_create()`\
    \ 的第一个和第三个参数：\n\n因此，此 `pthread_join()` 使用线程变量调用了新线程的线程 ID，这不会更改线程属性，使线程执行 `fiboThread()`\
    \ 函数并将 `(-1)` 数字作为参数传递给 `fiboThread()`。由于 `fiboThread` 函数的声明，需要 `(void*)` 情况。\n\
    \n| 线程 1 | 线程 2 |\n| :--- | :--- |\n| 等待 | 等待 |\n| 锁定 | 锁定 |\n| 资源 2 | 资源 1 |\n\
    \n线程 1 锁定并等待资源 2，而\n线程 2 锁定并等待资源 1，\n\n## 高级线程\n\n在这里我们将介绍如何实现一个更实用的程序，该程序使用 C\
    \ 结构体向线程传递多个参数。详情请参阅 `multargs.c`。\n\n你应该注意的第一点是，每个线程使用该结构的单个实例；你应该决定需要多少个线程。生成的线程\
    \ ID 存储在数组中。\n\n此外，我们使用 `TOTAL_THREADS` 来跟踪正在使用的线程数量；将使用全局变量来存储线程数。当你启动一个线程时，应该增加\
    \ `TOTAL_THREADS` 的值。\n\n在 `main()` 函数返回并结束程序之前，`sleep()` 调用是非常重要的，因为它允许线程完成它们的工作。使用\
    \ `sleep()` 或 `wait()` 以看到 `printf()` 函数的输出。\n\n在 `create()` 函数中，最后一个参数不是 `NULL`，而是指向感兴趣结构的\
    \ `(void *)` 指针。有趣的是，可以看到指向结构的 `(void *)` 指针是如何在同样被传递的 `pthread_create()` 的 `arg`\
    \ 参数内部捕获的。\n\n```c\nstruct threads *myArgs = arg;\n```\n\n"
