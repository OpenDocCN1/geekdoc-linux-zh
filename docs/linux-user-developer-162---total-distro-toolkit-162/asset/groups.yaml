    ### 使用 TAILS 进行隐私浏览

    使用 Tails 的另一个大优势是以隐身模式访问互联网。Tails 使用 Tor 或 I2P 网络来保护你的在线信息。对于不可信信的网络，Tor 或 I2P
    等是分布式网络，它们通过遍各地的中继网络中转你的连接。通过这种方式，任何监控你连接的人无法看到你访问的网站，而网站也无法追踪你的物理位置。所有软件都配置为通过
    Tor 访问互联网。如果应用程序尝试直接连接互联网，它将被自动阻止。


    要使用 Tor，只需从即时 DVD 启动 Tails 并打开 Tor。你可以像使用其他浏览器一样使用它。如果你想从 Tor 浏览器使用基于位置的服务（例如
    Google Maps），你通常会看到地球另一端某处的服务器位置。


    Thunderbird 与 Gmail 配合非常方便。由于 Tails 基于 Debian，Thunderbird 被用作默认电子邮件客户端。GPG 是一个可以安装在其之上的软件。如果你想使用
    GPG 标准编写和接收签名和/或加密邮件。


    ## TOR 对比 I2P


    Tails 支持 Tor 和 I2P 网络以提供在线隐私。这两者都旨在使用密码学方法保护你的身份，但它们在提供隐私的方法上存在几点差异。Tor 采用基于目录的方法，提供一个收集和分发网络信息的中心点。I2P
    使用分布式数据库和对点选择。I2P 为开放互联网提供了更好的匿名访问，而 I2P 在网络层内提供了更健壮、更可靠的网络。它拥有更大的用户群，全球范围内有志愿者。


    此外，请注意你的 ISP 可以看到你正在使用 Tor 或 I2P（尽管他们无法解密流量内容）。为了向你的 ISP 隐藏这些信息，你可以使用高速 VPN 作为你匿名网络的入口。用于此功能的开源项目是
    OpenVPN：https://openvpn.net/


