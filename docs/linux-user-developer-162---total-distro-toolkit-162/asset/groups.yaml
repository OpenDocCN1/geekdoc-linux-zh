    # Welcome


    to issue 162 of Linux User & Developer


    # This issue


    +   * Free-live booting DVD with 6 distros

    * Repair and recover broken filesystems

    * Harden your home/office network security

    * Learn development skills for Python


    Welcome to the latest issue of Linux User & Developer, the UK and America''s favourite
    Linux and open source magazine. This month, we present a special coveted DVD for
    containing things that can, between them, help you out in some of most (Linux-specific)
    situations. Need to re-partition one of your drives? GParted Live. How to fix
    a faulty filesystem? SystemRedux. Deploy multiple machines on your network? Give
    Clonezilla a test on your network? Use Box. We''ve considered these times when
    you needed to do something but, importantly, may not have access to the internet
    to download an ISO or to create your own bootable media. Simply-boot the tool
    you want from our Digital Tool Kit, and refer to the features starting on page
    19, and you''ll be good to go. We also take a good look at how others develop
    Linux. Starting on page 60, we run through some of the essential tools for automation,
    web development, using Python for maths and science investigations, and for robotics
    projects. If you''re ready to start using Python for some real dev work, then
    there''s plenty of stuff too, including a revealing interview with the creator
    of SOLus, which has hit its first major release point (page 12). Enjoy the magazine!

    Gavin Thomas


