    # SYSTEM ADMINISTRATION


    Get the most out of Python in handling all of the day-to-day upkeep that keeps
    your system healthy


    System administration tasks are some of the most annoying things you need to deal
    with when you have to maintain your system. Because of this, administration has
    consistently been trying to find ways to automate these types of tasks to maximise
    their time. They started with bash scripts, then moved on to various scripting
    languages. For a long time, Perl was the language for developing these types of
    maintenance tools. Python is now growing in popularity as the language to use.
    It has reached the point where most Linux distributions have a Python interpreter
    included in order to run system scripts you should have any excuse for not writing
    your own.


    Because you will need a system level work, you will have next a couple of Python
    modules. The first module is "os". This module provides the bulk of the interfaces
    to interacting with the underlying system. You can look where your script is running
    in to see what information might exist there to help guide your script. The following
    code gives you a mapping object you can interact with your active environment
    variables now:


    +   - import os

    - os.environ


    You can list all of the environment variables with the function os.environ.keys()
    and then access individual values. These environment variables are used when you
    spawn a subprocess, so you will want to change values, like the PATH or the current
    directory. While there is a function that edits these values, it doesn''t exist
    on all systems, so the most beneficial way in the long run is to do this is to
    edit the values directly within your environment mapping.


    | SYSTEM ADMINISTRATION: BASH, PERL, PYTHON |


    | OPERATING SYSTEM |


    | CPU | FILES/10 |


    Another category of tasks you want to automate when working with files. You can
    get the current working directory:


    ```

    cwd = os.getcwd()

    ```


    You can then list all of the files in this directory with:


    ```

    cwd = os.listdir(cwd)

    ```


    You can move the filesystem with the function os.chdir(path). Once you''ve found
    the file you are interested in, you can open it with os.open() and open it for
    reading, writing or/appending. You can then read or write to the functions with
    os.read(). Once you are done, close the file with os.close().


    > Above Python scripts enable you to install and interact with your operating
    system


    # RUNNING SUBPROCESSES FROM PYTHON


    The underlying philosophy of Unix is to build small, specialised programs that
    do one thing well. They do so job well, you can then chain these tools together
    using threading. There is no reason why you shouldn''t use the same philosophy
    within your Python scripts. There are several utility programs to use with very
    little work on your part. The easiest way to run them is through functions like
    popen() and spawn from the module, but a better way of running other programs
    is by using subprocess module instead. You can then run a program, like, by using:


    +   - import subprocess

    - subprocess.run(''ls'', ''~'')


    This gives a long file list for the current directory. The function run() was
    introduced in Python 3.5 and it is the suggested way to handle this. If you have
    an extra argument, you can pass it like this: Passing Python. If you want to get
    the output, you can use:


    ```

    output = subprocess.run([''ls'', ''-l''], stdout=subprocess.PIPE)

    ```


    The "output" command is a CompletedObject that contains the return code and a
    string holding the stdout. It may not be the same way that you want to use, but
    the methodology is essentially the same.


    # Scheduling with cron


    If you have scripts to write up, you might want to schedule them to run automatically
    without your intervention. You can run your python script using cron. This is
    necessary. The cron -l lists the current cron file, and cron -e schedules jobs
    that you want to run on cron.


