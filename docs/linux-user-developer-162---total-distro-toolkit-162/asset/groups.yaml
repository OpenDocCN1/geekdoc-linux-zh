    # # Zypper


    This package manager stands out with its enterprise-level features


    # # Pacman


    Not only an arcade game, but also a robust tool for handling software


    ![](img/6633b05a23a48c57613fd377238cfe15_82_0.png)


    +   - Zypper is SUSE-specific tool, to that test you''ll have to have something
    like openSUSE by hand


    ![](img/6633b05a23a48c57613fd377238cfe15_82_1.png)


    +   - A definitive advantage of Pacman is its one-character-per-action syntax


    # ## Speed


    # ## Speed


    Given that it only works in openSUSE and SLE, you''ll have to deal with its peculiarities.
    Perhaps the most frustrating is the slow performance of Zypper. Syncing with repositories
    takes minutes, and updating large packages from ordinary openSUSE gets very tedious.


    The thing we particularly liked about Pacman is its astonishing speed. Arch developers
    have done a great job of optimising the general performance of package manager,
    so virtually any action feels like a breeze. Installing a package with Pacman
    is both easy (S -n name) and very smooth—a fast enough-DNF dnf lags by a visible
    margin.


    # ## Package availability


    # ## Package availability


    openSUSE has rolled out an Open Build System, which automatically builds and handles
    packages from ordinary openSUSE users. This makes a great feature, which openSUSE
    offers you with libbuild and also changes in package availability. If you can''t
    find an app for this distro, you might get some chance others did in openSUSE
    OBS.


    Arch-based distros have a rich package selection. Even if its missing, you can
    always reach out AUR and build it from source. This automation is great! AUR contains
    the latest versions of all Linux software, so if you''re not afraid of a bleeding-edge
    Linux system, Pacman and AUR deliver a perfect experience.


    # ## Features


    # ## Usability


    Zypper is very-rich. We liked the ability to lock certain packages and prevent
    them from updating (if you want to install an older version without updating anyway),
    and also generally the most important part of Zypper is its SAT solver, which
    handles dependencies and suggestions of what can be installed.


    Pacman is impressive, with its mirror tool (for overall speed), support for installing
    packages groups, specifying versions and changed files. Using Pacman with AUR
    requires basic knowledge in software base, but for less-savvy users it''s better
    to use something like Arch, where Pacman is already set up.


    # ## Usability


    # ## Features


    Command line interface for zypper is pretty straightforward, but most you won''t
    have to avoid basics without using Zypper documentation. Real gems are hidden
    in the depth of /etc/zypper/zypper.conf, if you want to download update and store
    them locally, furthermore change solver behaviour, but fully-configured Zypper
    is not easy to get with


    Arch tends to be unstable over time. Pacman users often find transaction errors,
    file conflicts, broken repositories, broken signatures and so on. It''s not hidden
    that the Arch Wiki portal has the Troubleshooting section for Pacman, easing the
    pain to some extent.


    # ## Overall


    # ## Overall


    Sophisticated tool with unique features, which makes it something of a great among
    the more popular yet simple managers. However, it is far too slow at its core
    job and feels a little too ''enterprise'', as well.


    The fastest and one of the most advanced managers out there. Pacman can deliver
    the bleeding-edge versions of your apps, also with a risk of breaking your system
    in (rare) cases.'
