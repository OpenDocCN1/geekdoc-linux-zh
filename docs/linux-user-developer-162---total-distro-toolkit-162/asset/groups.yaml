    ## Blender


    - 下一个命令 **apt-get update** 会从仓库下载包并更新它们，以获取软件包及其依赖的最新版本信息。最后，**install blender**
    将使用默认设置下载并安装 Blender 到你的系统上。


    要生成 3D 模型。要更改视图，请点击 3D 视图编辑器（左下角）上的“视图”（View）。你将看到一个对象列表，它们提供了各种视图以及相应的快捷键。这些视图可以帮助你找到你想要的内容，或者在特定的侧面选择对象。


    ## 02 Blender 首页


    一旦在系统上打开 Blender，你将看到 3D 视口。这是一个基础场景，由一个立方体、一个灯光和一个相机组成。立方体是一个基础网格对象，仅为了给你提供一个开始的起点。你可以添加新项目，并在以后根据需要移动它们。灯光用于照明场景，相机对于帮助你进行可视化是必不可少的。


    让我们学习如何添加对象。执行此操作，点击屏幕上你想添加对象的地方，并从底部 3D 编辑器的下拉菜单中选择对象类型。选择一种对象类型。你会看到场景中到处都有可创建的不同类型的对象。左侧的工具栏包含选择特定对象的工具。你可以按意愿逐级移动对象，但让我们先熟悉这里的内容。


    ## 03 基础功能


    我们已经看到 Blender 默认页面具有光源生成器，可以帮助你构思动画。你也可以随心所欲地操作视图。这是最重要的能力之一。要移动对象，只需点击代表轴的三个箭头之一并沿着轴拖动。你也可以在选择对象后通过按下
    R 键并配合 X、Y 或 Z 键来在特定方向上旋转对象。


    ### 刀具工具 (Knife tool)


    Blender 中另一个实用的工具是刀具。它允许你将对象切割成碎片。它还允许你选择新边缘的起始和结束位置，穿过你想切割的所有对象画一条线。


    ### 移动对象


    要移动对象，你需要先选中它。按住 G 键然后左点击对象来选择对象。一旦选中，你就可以将其拖到某个位置。视口中的所有对象（包括灯光和相机）都有几种移动方法。你可以以自由形式或沿轴移动它。要沿特定轴移动，按
    G 然后按 X、Y 或 Z。如果你愿意，左点击以放置对象。


    ### 循环切线和工具 (Loop cut and tool)


    要沿一个方向分割对象，请使用循环切线（Loop Cut）工具。该工具仅对对象的一组特定面有效，并且可以滑动特征。激活循环切线后，你能够悬停在一组特征上，并用鼠标左点击来确认选择。


    ## 05 对象模式与编辑模式


    到为止，我们一直都在对象模式（Object Mode）下工作。这是默认模式，允许你从全局尺度上操作对象，你可以编辑并移动对象。当你想要编辑对象本身时（例如更改顶点的形状和位置），通过选择
    3D 视图编辑器中“对象模式”的下拉菜单将 Blender 模式切换到编辑模式（Edit mode）以进入新模式。


    在编辑模式下，你现在可以在对象模式和编辑模式之间切换。在编辑模式的主界面，之前在对象模式中选中的对象现在由顶点、边和面表示。你可以通过在 3D 视图编辑器底部和右侧选择相应的选择工具来选择其中任何一个。按住
    Shift 键并点击右键可以让你选择多个同一特征的实例。再次，你可以按 A 键来取消选择所有选中的对象。


    ## 06 操作对象大小


    如果你正在设计一个想要按现实比例的 3D 模型（例如公制或英制比例），你需要更改单位。


    ## 07 特定尺寸选项


    如果你正在设计一个想要按现实比例的 3D 模型（例如公制或英制比例），你需要更改单位。


    在属性面板中，如果你在对象模式下，你也可以通过鼠标来拉伸或缩放，这非常困难。如果你在 3D 空间中画线，Blender 提供了非常实用的属性面板。


    在这个面板中，点击“场景”（Scene）选项卡，可以调整对象的缩放因子。公制单位是米，英制单位是英尺。你可以根据需要调整这些来改变对象的尺寸。例如，公制单位是米，英制单位是厘米。


    在对象模式下，你也可以通过面板来更改对象的尺寸，而不影响其他部分。这个面板可以用于指定每个面的位置和旋转。


    ## 挤出对象


    挤出（Extruding）是一种 3D 建模技术，用于某个特征，例如对象的侧面或一组顶点，这些可以从当前位置延伸。要挤出对象，进入编辑模式并选择你想挤出的特征。然后你也可以通过点击工具栏中的“挤出区域”（Extrude
    Region）或按下 E 键来挤出整个区域。这可以通过左点击来挤出特定区域，或者返回原始位置。


    ## 分割 (Bisect)


    Blender 有多种可用工具进行分割。其中一种工具叫做二分（Bisect）。它将对象切割为一个或多个部分。要执行此操作，在编辑模式中选择所需的面或边，并跨过面画线以在选定的顶点上创建新边。一旦我们分割了对象，我们将看到一些可见内容，例如屏幕上的线条。然后工具栏将是二分菜单。你可以调整二分线的位置以及其他特征。“清除外部”（Clear
    Outer）和“清除”（Clear）选项允许我们消除二分边缘的一侧或另一侧，“填充”（Fill）选项将放置一个连接二分边缘的面。


    ## 合并和分离对象


    合并和分离对象是实用的技巧，用于确保对象彼此之间保持固定关系，或者分别保持它们之间的关系。


    要合并两个对象使 Blender 将其视为一个对象，如果它们没有物理接触，请进入编辑模式并右点击对象来选择它，然后按住 Shift 键并右点击其他对象。按下
    Ctrl+J。选中的对象将获得黄色轮廓，你就可以移动、缩放和旋转它们。如果你合并了对象（对象的两个部分）并在以后想要分离它们，进入编辑模式并选择你想分离的部分。如果你选择一个特定特征并按
    L 键，Blender 将选择与该特征相关的所有特征，它足够足够区分两个对象之间的面，即使像一个小立方体连接到大立方体上。


    '
