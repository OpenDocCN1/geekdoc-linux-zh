- md: "\n## Feature\n\n## WEB DEVELOPMENT\n\nPython has several frameworks available\
    \ for your web development tasks. We will look at some of the more popular ones.\n\
    \nWith the content and the date hosting on a server, a web application can ensure\
    \ a consistent experience for the end user. The popular Django framework provides\
    \ a complete environment of plugins and works the DRY principle (Don't Repeat\
    \ Yourself). Because of this, you should be able to build your web application\
    \ quickly. With Django, you should be able to install it with `sudo pip django`.\
    \ Depending on what you want to do with your app, you may need to install MySQL\
    \ or PostgreSQL to store your application data. Then Django will automatically\
    \ generate a starting point for your new project.\n\n```bash\ndjango-admin startproject\
    \ website\n```\n\nThis command creates a file named \"manage.py\" and a subdirectory\
    \ named \"website\". The file \"manage.py\" contains several utility functions\
    \ that you can use to administer your new application. The new subdirectories\
    \ contain files __init__.py`, \"settings.py\", \"urls.py\", and \"views.py\".\
    \ These files are loaded when your server starts. The configuration for your site\
    \ can be found in the \"settings.py\". The URL routing is stored in \"urls.py\"\
    . The file \"views.py\" contains an entry point for WSGI-compatible web.\n\nOnce\
    \ your application is done, it should be hosted on a properly hardened web server.\
    \ But it is not inconvenient if you are in the process of developing your web\
    \ application. To help you, Django has a web server built into the framework.\
    \ You can start it by changing directory to the \"new project\" and running this\
    \ command:\n\n```bash\npython manage.py runserver\n```\n\nThis will start a server\
    \ listening to port 8000 on your local machine. Because this built-in server is\
    \ designed for development, it reloads your Python code for each request, so you\
    \ don't need to restart the server to see your changes.\n\nAll of these steps\
    \ get you working on a project. You are now inside the \"website\" subdirectory,\
    \ type:\n\n- python manage.py startapp webapp\n\nThis will create a new subdirectory\
    \ \"webapp\" with the files models.py, \"views.py\", and other things. The simplest\
    \ possible view consists of the code:\n\n```python\nfrom django.http import HttpResponse\n\
    def index(request):\n    return HttpResponse(\"Hello world\")\n```\n\nThis is\
    \ not enough to make it work, however. You will also need to create a URL for\
    \ it. If the file \"urls.py\" doesn't exist, create it with the following code:\n\
    \n```python\nfrom django.urls import url\nurlpatterns = [ url('', views.index,\
    \ name='index') ]\n```\n\nNext, get the URL registered in your project with this\
    \ code:\n\n```python\nfrom django.urls import path, include\nfrom django.contrib.admin\
    \ import admin\nurlpatterns = [ path('admin/', admin.site.urls), include('webapp/urls.py')\
    \ ]\n```\n\nThis needs to be in the path for the main project. You can now pow\
    \ your newly created application with the URL http://localhost:8000/webapp/.\n\
    \nAbove Python interpreters work with databases to power a web server\n\nThe Model-View-Controller\
    \ architecture is used for Us.\n\n## Virtual Environments\n\nWhen you start developing\
    \ your applications, you may get into a situation with dependencies. Python depends\
    \ on different Python packages. This is its strength, but it also means you have\
    \ various virtual environments available. You can create new virtual environments\
    \ for each of your projects. This way you can be sure to avoid conflicts of all\
    \ sorts for the package.\n\n## USING THE PYCHAM IDE\n\n```\nuntitled - (PyCharmProjects/untitled)/test1.py\
    \ - PyCharm-Community Edition 2022.3\nEdit View Go Code Refactor Run Help VCS\
    \ Window menu\nuntitled - test1.py\ntest1.py =\nimport swig\nresult = swig.add(4,8)\n\
    ```\n\n- External libraries\n\n### Tool Windows Quick Access\nSearch for apps\
    \ and open them quickly.\nClick the icon to make window buttons visible\n\nDesktop\
    \ entry created: You may use PyCharm to start from the menu; (restart if a new\
    \ entry seems not to... (2 minutes ago 2 processes running)\n\nTHE EDITOR PANEL\n\
    This pane can be configured to match your style, or one of the other main editors,\
    \ like Sublime. It handles syntax highlighting, and displays errors in your strings.\n\
    \n### THE PROJECT PANE\nThis is the heart of your project. All of your files and\
    \ libraries are located here. Right-click in the area to add new files or libraries,\
    \ run tests, or start a debugger.\n\n### THE STATUS BAR\nPyCharm does a lot of\
    \ work behind the scenes. The status bar helps you keep track of all these background\
    \ processes.\n\n## To help you out, Django has a server built into the framework\n\
    \nThe last part for applications is the database. The actual connection details\
    \ to the database, the username and password, are contained in the file `settings.py`.\
    \ Connection is used for all the applications that exist within the same project.\
    \ Create the core database tables for your site with:\n\n## Terminal environments\n\
