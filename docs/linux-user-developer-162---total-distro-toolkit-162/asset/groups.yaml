    - GPU (SoC) 1024MHz\n- RAM (SoC) 2GB\n- Storage 8GB eMMC (SoC) + Micro-SD Slot\n\
    - Networking 10/100 Ethernet, 2.4GHz Wi-Fi, Bluetooth 4.0\n- Display HDMI 1.4A,\
    \ LVDS-compatible video\n- Audio Digital audio via HDMI, and on-board\n- Expansion\
    \ 2xUSB 2.0, 1xUSB 3.0, 1xMIPI\n- 40-pin header, TTL serial, I2C receiver\n Price\
    \ £30.17 (lemaker.com)\n\n86"
