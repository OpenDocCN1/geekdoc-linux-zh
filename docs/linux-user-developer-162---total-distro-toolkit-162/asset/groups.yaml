    # 你的 Linux 新闻与观点


    # 观点


    # 内核


    随着 4.4 发布和 4.5 合并窗口的开启，Jon Masters 探讨了 Linux 内核的最新事件。


    Linus Torvalds 终于发布了 Linux 4.4，注意到在开发周期结束时，只有少数额外的补丁在新版本发布中上线。一个最后时刻的修复“破坏”了由内核提供的带有
    VDSO（虚拟共享对象）的 x86 ABI，而所有其他发行版通常都在使用它。


    许多对内核开发者至关重要的事项，例如从 `/proc/meminfo` 中移除用法（它每次查询内核时都会生成），并将其移动到由用户空间使用的内核接口，这存在破坏兼容性的风险。它还伴随着
    Linus 的警告，他非常关注用法情况。


    Jon Masters 是一位已经在 Linux 领域工作了 19 年的 Linux 黑客，现在是利兹大学的副讲师，他为各种大型企业发行版工作，而不是创建自己的标准。


    通常，内核开发周期在系列发布候选版本（Release candidates）后结束，但这次发布周期持续到了新年。也许这意味着 4.4 没有按时完成，但结果是，在我们还在最后阶段时，4.5
    的合并窗口可能已经打开了。为了避免这种情况，Linus 说：“通常，我需要一个 Linux 4.4-rc3，一个带有一些未解决问题且需要更多时间修复的发布候选版本。我理解这一点，这意味着我们想要确保假期结束后都回来了，并且人们有时间安排他们的合并请求。”


    ### Linux 4.4 的新特性


    新内核包含了一系列头条特性，其中包括 KVM（内核虚拟机）virtio-gpu 中的 3D 加速支持、一种（最初）被称为“写回”（writeback）的新类型锁，以及在
    md 驱动中对 RAID 热插拔驱动的支持。它还包含另一个在 Linux 4.4 中上线的特性，该功能在 md（多磁盘）驱动中一直存在但一直未被启用。md
    驱动仍然是 Linux 用户最常用的方式，特别是对于那些使用旋转介质磁盘的用户——消耗 RAID5（廉价冗余阵列）支持，允许他们在不丢失数据的情况下防止单硬盘故障。


    # 持续的重构


    这里有一个问题：RAID5 驱动容易受到一种（已知的）数据丢失场景的影响，如果在向阵列写入数据时掉电，然后由于坏盘而处于降级状态，且没有足够的（校验）数据来判断写入的一部分（RAID
    带中的块）是否已损坏。这将导致使用坏数据进行 RAID 阵列重建的风险——md 有一些检查来处理这个问题，但会变得非常混乱；先经历过降级阵列的爱好者可以证实（如果他们确实在其中的话）。许多商业考量通过使用昂贵的硬件
    RAID 系统，利用带电池备份的 NVRAM 在提交之前缓存（日志记录）写入更新来解决“写洞”问题。其他不那么疯狂的人可能从未意识到这个问题，而且在任何情况下都不可能经历这种场景中严重的数据丢失。


    Facebook 为 RAID 代码贡献了新的日志支持，这是通过对各种现代文件系统（ext4、btrfs 和 xfs）进行日志记录实现的。写日志可以启用，并将用于存储到
    RAID 阵列的所有更新。在此之前发生电源中断，可以重放日志以恢复到联合文件系统的一致性。因此，Facebook 也在大规模软件 RAID 中获得了更高的可靠性，这对于有数百万照片要存储来说可能非常有用。有了这个新功能，mdadm
    有了新的“write-journal”选项。

