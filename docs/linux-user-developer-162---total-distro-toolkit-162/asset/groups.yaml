    Select the ''create a new app'' button. Fill in the details for your

    app as required, then tick and confirm that you accept the

    terms and conditions.


    ![](img/6633b05a23a48c57613fd377238cfe15_75_1.png)


    | What you''ll need |

    | Pi Zero |

