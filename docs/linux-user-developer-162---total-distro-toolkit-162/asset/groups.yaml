    ## FREE DVD


    ## YOUR FREE RESOURCES


    Here''s a roundup of the content on your free distro DVD and some brief guides
    to help you get started


    # GParted Live

    0.24.0-2


    # LIVE-BOOT

    YOUR DVD


    Your distro toolkit is live-booting so you can run the distros without installing
    them


    - Live-booting is the process of loading an operating system straight from a CD
    or USB stick. It''s incredibly handy in cases where the operating system installed
    onto your computer is in some way and unable to boot - you can, for example, use
    this to boot from a distro like RescueCd and then diagnose the problem.


    To live-boot from your DVD, pop it into your optical drive and then power up your
    computer. You will need to tap the F key we''ve set up (on many computers you
    need to tap) once on the PC and before your main operating system kicks in. The
    correct key for your particular computer should be displayed during boot.


    You''ll see a GRUB menu containing the various options for live-booting the six
    distros we''ve included. Each is compatible with both x86 and 64-bit architectures
    and contains separate boot options for x86/64, so they should boot on pretty anything.


    # Clonezilla Live

    2.4.2-61


    # BackBox Linux 4.4


    # Tails 1.8.1


    # SystemRescueCd

    4.7.0


    # Porteus

    3.1


    ## NAVIGATE YOUR FREE DISC


    We''ve created this multi-booting distro DVD so that you will have a backup to
    rely on in a number of circumstances. For disk partitioning and backup, for security
    and privacy, we have BackBox and Tails; SystemRescueCd for diagnosis and if you
    find yourself without a computer or internet connection, it might just save your
    bacon!


    But if your laptop fails or it becomes dated in the months and years to come?
    Perhaps you don''t have an optical drive in your computer you''re reading this
    mag on and don''t actually have the one? Not to worry - it''s really easy to create
    your own bootable, whether that''s a DVD or a USB stick.


    Most of you will need to follow the tutorial below, which details the steps you''ll
    need to follow in the Brasero/DVD burner. Once finished, navigate in your explorer
    and you should be able to see the contents of your ISO - if you can''t see the
    original ISO file on then it hasn''t been correctly written! Windows users can
    use the dialog that pops up when you insert a disc or USB stick. OS users can
    use the native Disk Utility software.


    Pop the disc into the tray when you''re in an OS and see what you''ll find


    Can''t see this when you insert the DVD? Make sure your OS is set to auto-play,
    or navigate to the DVD in your file explorer and run `launch_disc.sh`


    Distros This page contains a summary of the six live-booting distros on your DVD.
    Each entry also includes a link to the project website for them


    Tutorial files All of the files for these tutorials can be downloaded from this
    page.


    Want to make your own bootable?


    - Grab a new ISO

    Either navigate to the website or search for it.


    - Open or install

    Brasero is the most popular disc utility.


    - Burn your disc

    On the Image Setup menu, click the first box.


    ## FILESILO


    ## HOW TO USE FILESILO


    Everything you need to know about accessing your digital resources


    To access Filesilo, please visit www.linuxuser


    - Follow the instructions on-screen to create an account, then log in by answering
    a simple question. Your Web ID is the eight-digit code printed above your details
    on the mailing label.


    - If you''re a print subscriber, you can unlock all the content by entering your
    Web ID. It can also be found on your renewal leaflets.


    - If you have any problems with accessing content on Filesilo, or with the registration
    process, take a look at the FAQs online or email filesilohelp@imagine-publishing.co.uk


    - You can access desktop, tablet or smartphone device using any browser (such
    as Firefox, Chrome, or Safari). However, we recommend that you use a desktop to
    download files to your phone or tablet.


    ## MORE TUTORIALS AND INSPIRATION


    Finished reading this? There''s plenty more free and open source goodness waiting
    for you on the Linux User & Developer website. Features, tutorials, reviews, opinion
    pieces and the best open source news are uploaded on a daily basis, covering Linux
    distros, hardware and Raspberry Pi projects and interviews, programming guides
    and more. Join our community of Linux users and developers discover new Linux
    tools today.

