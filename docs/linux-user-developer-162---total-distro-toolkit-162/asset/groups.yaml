    # PROGRAMMING


    # Picat 1


    Opening up the power of logic programming to a new generation


    You should try out at least one programming language each year, and if you''ve
    it it 2016''s candidate, take a look at Picat, a multi-paradigm language supporting
    logic programming (CPP). Picat differs from logic programming in Prolog; it has
    great support for features that Prolog lacks by expanding the language with Pattern-matching;
    Imperative; Constraints/Arrays; Tabling,

    It''s been two years since Picat 0.1 was released, and the stability of Picat
    are fine improving. It is not well matched with the we of library support, although
    what there is some


    as logic encoders are. Development is steady, and installation is simple thanks
    to statically compiled binary (weighing in at relatively small 4MB).

    Logic programming is a paradigm based on logic, where you can express facts about
    the problem easily. Most of Prolog''s features, those that implemented by acclaim,
    are predicates, functions, and unification. Picat caches previous predictions,
    which dramatically speeds up calculations, and is based on the plugin module for
    all problems. Information documentation is good, and the official website has
    some excellent examples from Hkan Källander, including a useful paper introducing
    Picat for CP


    Pros

    Multi-paradigm declarative language that''s great for for constraint programming


    Cons

    Relatively young language, so currently lacking in library support and has a lower
    user base


    Great for...

    Power solving in science and engineering,

