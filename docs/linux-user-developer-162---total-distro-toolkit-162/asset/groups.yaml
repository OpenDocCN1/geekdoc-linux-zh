    - /var/log/syslog


    由于可以即时解压缩，LNAV 将处理许多常见的日志格式；现在可以在 JSON 文件中定义格式并在 ~/.informats/ 中解析。支持对错误和日志条目的语法高亮——黄色表示警告，红色表示错误——支持多个服务，即同时加载多个事件。你还可以使用表达式过滤掉不需要的条目，使用快捷键在错误之间跳转，而直方图视图可以让你查看不同时间段错误峰值出现的模式。


    ![](img/6633b05a23a48c57613fd377238cfe15_87_0.png)


    上述 LNAV 深入研究归档日志，并以良好的高亮格式呈现它们


    **优点**

    可在没有 GUI 的系统上运行，并让你能够快速处理存储的日志文件以追踪错误


    **缺点**

    没有像某些竞争对手（如 journey 或传统的 grep、awk 和 sed）那样强大和功能丰富


    **适用场景...**

    任何需要通过 SSH 进行管理任务的地方

    lnav.org


    ## 编程


    ### Picat 1


    为新一代开启逻辑编程的力量


    你每年应该至少尝试一种编程语言，如果你在寻找 2016 年的候选语言，可以看看 Picat，这是一种支持逻辑编程 (CPP) 的多范式语言。Picat 与
    Prolog 中的逻辑编程不同；它通过引入模式匹配；命令式；约束/数组；表化（Tabling）扩展了语言，对 Prolog 缺乏的功能提供了很好的支持。


    自 Picat 0.1 发布以来已经过了两年，Picat 的稳定性正在不断提高。它在库支持方面还不理想，尽管现有的某些库如逻辑编码器已经很好用。开发很稳定，得益于静态编译的二进制文件（重量相对较小，4MB）。


    逻辑编程是一种基于逻辑的范式，你可以轻松地表达关于问题的事实。Prolog 的大部分功能（那些广受誉名的）都是谓词、函数和统一。Picat 缓存之前的预测，这极大地加快了计算速度，并基于插件模块解决所有问题。信息文档很好，官方网站有一些来自
    Hkan Källander 的优秀示例，包括一篇介绍 Picat 用于 CP（约束规划）的有用论文


    **优点**

    多范式声明式语言，非常适合约束编程


    **缺点**

    相对年轻的语言，因此目前缺乏库支持且用户群较小


    **适用场景...**

    科学和工程中的强大求解，

    picat-lang.org


    ## 文档转换


    ### Pandoc 11.5.2

    你命令行和 Git 发布工作流中缺失的环节


    你知道那些出人意料地在如今变得不可或缺的软件吗？那些在你曾从未听说过，但在某个时刻之后被发现总是至关重要的软件？如果你花费任何时间在格式之间转换文本文档，Pandoc
    可能会成为这样的工具。


    Pandoc 可以将 Markdown、重构文本、HTML、DocBook、LaTeX、Mediatext、Markdown.org、XML、Txt2Tags、ODT、EPUB
    或 Hardoc 标记的文件转换为各种文本、HTML、Office 或格式，以及自定义的 Lua 扩展


    Pandoc-citeproc 提供真实的引用和参考文献。阅读发布说明将让你看到这个项目投入了多少工作。安装简单，你也可以尝试替代方案。


    Pandoc 由 UCB 教授 John Macbride 创建，是一个用 Haskell 编写的程序，它是用你想要的语言编写代码的绝佳示例，而不是用 Haskell
    这种用于函数式编程的学术语言。事实上，在真实世界中，如果你发现 Pandoc 缺少某个功能，这将是一个深入开始编码的绝佳理由。


    **优点**

    用 Markdown 编写一切以及你需要转换的内容，让你的经验来处理即可


    **缺点**

    对于所有自定义文本并不完美，因此你可能需要针对高级格式的支持


    **适用场景...**

    需要处理 MS 世界的 LaTeX 用户

    pandoc.org


    ## 游戏


    ### 重温 90 年代的星际大战


    受 90 年代荣光的启发


    ![](img/6633b05a23a48c57613fd377238cfe15_88_0.png)


    随着《星际大战》，你可能发现自己挖掘出了像 1994 年的《Fighter》这样的老游戏。这款太空战斗机以及其他 90 年代经典作品如《Desert Space
    Combat》，是让你构建 Space Combat 的影响，这是一款单机太空战斗机，让你驾驶不同的船并构建你想要的任何。


    下载是一个静态二进制文件，应该可以在大多数系统上运行，但在运行之前你需要检查源码，这对于宽带连接缓慢的重要人士来说很遗憾。Thomas Schroeder
    正在同时开发 Space Combat，这是一款感觉很特别的游戏。有很多机会帮助改进该游戏。


    对于想要用 C++ 和 G 创建游戏的人，请查看调试模式，有大量文档使用它来生成整个游戏的脚本，或条件断点。


