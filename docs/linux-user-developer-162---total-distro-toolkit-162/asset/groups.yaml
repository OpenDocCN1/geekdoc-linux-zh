    Learn the basics of disk partitioning and see how GParted helps you easily manage
    filesystems on your hard drive


    GParted is a lightweight operating system created to help you manage partitions
    on hard disk. With GParted, you can recover, move and copy partitions without
    data loss. You can create space for new partitions, reallocate disk usage, copy
    data on hard disks, and even repair filesystems like Linux and Windows. It is
    great! It is important to note that GParted is based on Debian, but it is also
    available as a standalone application. Here we will focus on GParted only.


    And that''s it, now you have a new hard partition all ready for you. If you would
    like to carve out a new partition from an existing one, you can skip the first
    step of partition table itself and just choose to create a new partition.


    +   ### LOST DATA RECOVERY

    GParted offers the disk recovery feature. To recover a lost partition, just select
    the drive > Attempt Data Recovery. You''ll be prompted that a full disk scan is
    needed to find any filesystems, and if any filesystems are found retrieve your
    data. Just perform the full scan, and continue.


    +   ### RESIZING AN EXISTING DRIVE

    GParted also lets you resize disks; this means you can expand a drive to a larger
    size or shrink it. To expand, click the Resize/Move button on the main menu bar.
    You can change sizes or use the GUI to just stretch the partition to a bigger
    size.


    +   ### CREATING A PARTITION

    To see in action, let us start with the basic step of creating a new partition.
    As soon as you boot Ged from the live DVD, use the GParted partition editor to
    find up partitions and use the manage pattern for all partitions. If you have
    an unnamed drive, select it and then go to Device (top menu bar) > Create partition.
    Then choose the file format. Select the partition size, name, etc., and then click
    add.


    Setting partition flags

    There are several flags that can be set on a partition to optimize for OS. The
    boot flag indicates which contains the operating system. GParted lets you manage
    these flags: select a flag on a partition, and go to Partition Manager. You can
    now check the flags to set.


    # # RESIZING PARTITION


    TOP MENU BAR

    This section holds all the major functionality that GParted has to offer. View
    info about the selected partition. Resize can be found under right-click menu.


    MAIN MENU

    This area shows the options used. Create partitions, delete them, resize, copy,
    paste — all from here. You can see the drop-down menu listing of all the available
    devices.


    MEMORY USAGE PATTERN

    This area displays the memory usage of the selected partition in a detailed, colour-coded
    map.


    PARTITION LIST

    You can see all the partitions on a particular device list. This also shows the
    filesystem, used and unused memory.


    RESIZE WINDOW

    If you choose to resize an existing partition and click Resize/Move button on
    the main menu bar, you will fill in the memory size or resize the partition out.
    Use the box to indicate the required size.


