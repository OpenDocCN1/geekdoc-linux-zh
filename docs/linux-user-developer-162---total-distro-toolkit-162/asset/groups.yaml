    \          GPIO.output(18, GPIO.LOW)\n            time.sleep(5)\n            GPIO.setup(18,\
    \ GPIO.HIGH)\n            GPIO.output(18, GPIO.HIGH)\n            api.update_media(pic,\
    \ final_tweet)\n        else:\n            print(\"no lights\")\n\nstream = tweepy.Stream(auth,\
    \ Hat_Lights)\nwhile True:\n    stream.stream_filter()\n```\n\n13. Find the time\
    \ if you send the tweet multiple times, Twitter assumes you are a bot and will\
