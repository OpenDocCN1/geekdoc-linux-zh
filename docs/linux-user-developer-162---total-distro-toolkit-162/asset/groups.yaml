    ## 软件包管理器评


    ## 简述：结论对比与分析


    | APT | DNF | Zypper | Pacman |

    |---|---|---|---|

    | 速度 | 似乎没有人对此有异意见，平均速度相当快 | 得益于依赖关系和快速镜像，DNF 是一个非常快速的包管理器 | 在其他领域非常出色，但在同步和下载方面，Zypper
    像蜗牛一样慢 | 你需要将完成视为一个错误，但 Pacman 是自动的 |

    | 软件包可用性 | PPAs 包含了 Linux 发布的所有内容——特别是 Ubuntu | 数量有限的仓库允许手动下载部分内容 | 我们不这么说，但 Zypper
    的仓库涵盖了伟大的 OBS 项目 | 可以配合 AUR 使用——一个包含万物的仓库，具有自动化流程 |

    | 特性 | 许多实用功能尚未完全可用，或需要对 APT 进行手动调整 | 除了出色的 de-bla 仓库外没有提供太多，尽管这是一个新工具 | 极其丰富的配置项和依赖处理器
    | 无特殊，但是一个易于从源码构建的系统 |

    | 易用性 | 除非你是老用户，否则一些细微点并不明显 | 与你共享学习曲线，并有一个 plasman 设计器 | 作为一个老练的用户，在与我们一起之前应该阅读文档
    | 非常稳健且流畅，提供了解决 Bug 的体验 |

    | 总体 | 非常强力的选择。也许这就是 Ubuntu 如此受欢迎的原因…… | 很有前景但可能不足以成为强大的 APT | 需要在糟糕的支持下完成，即 Zypper，我们以后再聊
    |


    ## 获胜者


    ## APT


    在我们第一次看到曙光时——那是 17 年前了——Linux 世界还没有多少管理器；或者至少，它们中最差的也能做到。所以，APT 就像第一个且最像 Linux
    风格的软件包，它与其他包的并无关——但无论我们如何看待它，APT 的表现都良好或非常好。如果你发现它很有用，花些时间学习与 APT 相关的新技巧和窍门。它们都来自第三方开发者（因为
    Debian 策略对包含这些内容非常严格——“尚未成熟”），但它们可能非常有用，例如 As-Fast 项目 (apt::fastmirror)，它可以极地提高下载速度。


    ![](img/6633b05a23a48c57613fd377238cfe15_83_0.png)


    DNF 的创建是为了对期待已久的最新 Yellow Dog Get 进行更新。看起来他们本可以把事情做得更好，但情况并没有很大改善。DNF 通过仅下载需要的位，可以为你节省大量时间和带宽，同时它在与
    Pacman 的竞争中表现不错，Pacman 赢得了速度竞赛并带给了我们


    - 你也可以用 APT 安装本地软件包！


    我们想要任何东西的最新且最快发布。普通的 Linux 生活在 Arch 瞬息万变的世界中，这意味着即使不是黑客或开发者，也可以长期使用 Pacman 打开任何东西。最后，Zypper
    是一项出色的技术，在 openSUSE 和商业 SUSE 上运行良好，提供了一个带有许多额外功能的企业级工具。唯一的问题是它同步慢、下载包慢，有时安装包需要太长时间。要更深入地了解
    Zypper，请查阅 openSUSE 官方文档。


    > Alexander Tolstoy


