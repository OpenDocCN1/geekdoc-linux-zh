    \ Linux 支持非常棒（相比之下，HP 或戴尔笔记本电脑等通常在开箱后就会遇到问题，并会给你带来一些奇怪的问题）。在 ebay.com 上寻找两到三年的租赁机（ex-lease\
    \ models）。\n\n我很喜欢上期关于 Hi 的专题——那天看起来真好，我真想和孩子们一起去那儿。我已经不再住在 Sowich 了，所以没有真正的机会。下一个值得关注的大型活动在哪里？\n\
    \n## Linux 笔记本电脑\n\n我正在寻求关于购买新 Linux 笔记本电脑的建议。家里有一台电脑也有一台相对新的 MacBook，但现在已经到了我真的需要一个便携版\
    \ Linux 系统的程度了。有什么主意吗？\n\n如果你喜欢新机器且 ThinkPad 不适合你的话，另一个你可以查看的选项是 Libren。它们是为了隐私、安全和开源而众筹的。生产几乎\
    \ 100% 开源的笔记本电脑（直到固件）需要硬件中的几个低级二进制文件（blobs），你可以了解此的更多信息。\n\n很高兴你喜欢那个专题，Ed —— 我们和你和其他读者一起度过了一段美好的时光。下一次活动将在剑桥举行，去那里将很棒。地点：剑桥计算机实验室（William\
    \ Gates Building, 13th Thomson Avenue, Cambridge, CB3 0QG）。树莓派团队将在周六全天待在那儿。\n\n\
    你好，Mark，这里有几种处理方法，真的——你对该型号有多留恋？取决于型号，你可能可以在 Windows 旁安装 Linux，或者可以将你选择的 Linux\
    \ 发行版安装到 SSD 上并在笔记本电脑上双启动，访问 ifaft.com 并搜索你的型号——你应该能找到它是否是“黑客友好”的，以及，\n\n树莓派基金会将举办另一个生日周末庆祝庆祝——请关注官方博客获取更多信息：www.raspberry.pi/blog。对于你所在地区的树莓派粉丝来说，也将非常棒。\n\
    \n在 bit.ly/319me，但除此之外请取出\n\n- 这是 William Gates 大楼的主入口——供应商摊位通常都设在这里\n\n## 资源\n\
    \n你的 Linux 新闻与观点来源\n\n联系我们...\nlinuxuser@imagine-publishing.co.uk\n\n## 免费 DVD\n\
    \n## 你的免费资源\n\n这里是关于你的免费发行版 DVD 内容的汇总，以及一些帮助你入门的简短指南\n\n# GParted Live\n0.24.0-2\n\
    \n# 现场启动\n 你的 DVD\n\n你的发行版工具箱是现场启动的，因此你无需安装即可运行这些发行版\n\n- 现场启动（Live-booting）是指直接从\
    \ CD 或 USB 盘加载操作系统的过程。当安装在计算机上的操作系统由于某种原因无法启动时，这非常有用——例如，你可以用它从 RescueCd 等发行版启动，然后诊断问题。\n\
    \n要从 DVD 现场启动，将其插入光驱驱动器并启动计算机。你需要在 PC 启动后、主操作系统启动前按下一次我们设置的 F 键（在许多电脑上你需要连续按下）。你特定计算机的正确按键将在启动期间显示。\n\
    \n你将看到一个 GRUB 菜单，其中包含我们包含的六个发行版现场启动的各种选项。每个发行版都兼容 x86 和 64 位架构，并包含适用于 x86/64 的独立启动选项，因此它们可以在几乎任何设备上启动。\n\
    \n# Clonezilla Live\n2.4.2-61\n\n# BackBox Linux 4.4\n\n# Tails 1.8.1\n\n# SystemRescueCd\n\
    4.7.0\n\n# Porteus\n3.1\n\n## 导航你的免费光盘\n\n我们创建了这种多启动发行版 DVD，以便你在许多情况下都有一个可以信赖的备份。对于磁盘分区和备份，为了安全和隐私，我们准备了\
    \ BackBox 和 Tails；SystemRescueCd 用于诊断，如果你发现自己没有电脑或网络连接，它可能会救你一急！\n\n但如果你的笔记本电脑故障了，或者在未来的几个月或几年里变得过时了呢？也许你正在阅读这本杂志的电脑没有光驱驱动器，而且你根本没有？别担心——创建自己的启动盘非常简单，无论是\
    \ DVD 还是 USB 盘。\n\n大多数人将需要遵循下面的教程，该教程详细说明了你在 Brasero/DVD 刻录机中需要遵循的步骤。完成后，在资源管理器中导航，你应该就能看到\
    \ ISO 的内容了——如果你在... 上看不到原始 ISO 文件，说明它没有正确写入！Windows 用户可以使用插入光盘或 USB 盘时弹出的对话框。OS\
    \ 用户可以使用原生的“磁盘工具”（Disk Utility）软件。\n\n在 OS 中将光盘插入托盘，看看你会发现\n\n在插入 DVD 时没有看到这个？确保你的\
    \ OS 设置为自动播放，或者在文件管理器中导航到 DVD 并运行 `launch_disc.sh`\n\n发行版 此页面包含了你 DVD 中六个现场启动版的摘要。每个条目还包含一个指向项目网站的链接\n\
    \n教程文件 所有教程文件都可以从此页面下载。\n\n想制作自己的启动盘吗？\n\n- 获取新的 ISO\n要么访问网站或搜索。\n\n- 打开或安装\n\
    Brasero 是最流行的光盘工具。\n\n- 刻录你的光盘\n在映像设置菜单中，点击第一个框。\n\n## FILESILO\n\n## 如何使用 FILESILO\n\
    \n关于访问数字资源所需的一切\n\n要访问 Filesilo，请访问 www.linuxuser\n\n- 按照屏幕指令创建账户，然后通过回答一个简单的问题登录。你的\
    \ Web ID 是打印在邮件标签详情上的八数字代码。\n\n- 如果你是印刷版订阅者，可以通过输入 Web ID 解锁所有内容。它可以在你的续费单上找到。\n\
    \n- 如果你在访问 Filesilo 内容或注册过程中遇到任何问题，请查看在线常见问题（FAQs）或发送电子邮件至 filesilohelp@imagine-publishing.co.uk\n\
    \n- 你可以使用任何浏览器（如 Firefox、Chrome 或 Safari）访问桌面、平板或智能手机。但是，我们建议你使用桌面下载文件到手机或平板。\n\
    \n## 更多教程和灵感\n\n读完了吗？在 Linux User & Developer 网站上还有更多免费开源资源等待着。专题、教程、评测、评论文章以及最新的开源新闻每天更新，涵盖\
    \ Linux 发行版、硬件和树莓派项目以及采访、编程指南等。加入我们的 Linux 用户和开发者社区，从今天开始发现新的 Linux 工具吧。\n\n"
