    4 25 55 96 72 38\n```\n\nAs you can understand, Python automatically uses a different\
    \ seed each time you execute the script. The problem is that without knowing the\
    \ seed, you cannot reproduce the same sequence.\n\nPlease be in mind that the\
    \ longer the password, the better. In other words, a smaller password produced\
    \ by generating numbers is worse than a bigger password produced. This is because\
    \ longer passwords generate more numbers. This is mainly because you can break\
    \ small passwords easily using the brute force method (which we address on page\
    \ 57).\n\n# Improving the technique\n\nThe genNum:program is an improved version\
    \ of genNum: because it uses the rand(3) function. rand(3) defines a seed the\
    \ multiple calls to rand(3); this adds a good level of randomness to the process.\
