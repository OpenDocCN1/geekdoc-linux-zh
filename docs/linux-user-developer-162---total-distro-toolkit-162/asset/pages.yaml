  md: '# # NAVIGATE YOUR FREE DISC


    We''ve created this multi-booting distro DVD so that you will have a backup to
    rely on in a number of circumstances. For disk partitioning and backup, for security
    and privacy, we have BackBox and Tails; SystemRescueCd for diagnosis and if you
    find yourself without a computer or internet connection, it might just save your
    bacon!

    But if your laptop fails or it becomes dated in the months and years to come?
    Perhaps you don''t have an optical drive in your computer you''re reading this
    mag on and don''t actually have the one? Not to worry - it''s really easy to create
    your own bootable, whether that''s a DVD or a USB stick.

    Most of you will need to follow the tutorial below, which details the steps you''ll
    need to follow in the Brasero/DVD driver. Once finished, navigate in your explorer
    and you should be able to see the contents of your ISO - if you can''t see the
    original ISO file on then it hasn''t been correctly written! Windows users can
    use the dialog that pops up when you insert a disc or USB stick. OS users can
    use the native Disk Utility software.


    Pop the disc into the tray when you''re in an OS and see what you''ll find


    Can''t see this when you insert the DVD? Make sure your OS is set to auto-play,
    or navigate to the DVD in your file explorer and run `launch_disc.sh`


    Distros This page contains a summary of the six live-booting distros on your DVD.
    Each entry also includes a link to the project website for them


    ![](img/6633b05a23a48c57613fd377238cfe15_96_0.png)


    ![](img/6633b05a23a48c57613fd377238cfe15_96_1.png)


    ![](img/6633b05a23a48c57613fd377238cfe15_96_2.png)


    Tutorial files All of the files for these tutorials can be downloaded from this
    page. They''re also on Fileiso.co.uk, so you can track them down if your disc
    gets lost


    Directory We have included a list of the six most popular Linux distros available
    to download. The buttons below each entry will take you to the distro''s website,
    where you can download the ISOs


    # Want to make your own bootable DVD or USB stick? Read on...


    ![](img/6633b05a23a48c57613fd377238cfe15_96_3.png)


    01 Grab a new ISO

    Either navigate to the hyperlinks on this issue''s DVD to a distro''s website
    or search online for the distro you want. Download the ISO file from the website.
    If you''re not sure if you need a 32-bit or 64-bit version, go with the former
    to be safe.


    02 Open or install Brasero

    Brasero is the most popular source disc-burning utility. If it''s not already
    installed on your distro, locate it in your distro''s repository and install it.
    Then open the program and select ''Burn image'' from the Projects tab on the left.


    03 Burn your disc

    On the Image Burning Setup menu, click the first box - marked ''click here'' to
    select a disc image - and navigate to the ISO you downloaded. Once selected, use
    your CD, DVD or USB stick inserted and then click ''Create''.'
