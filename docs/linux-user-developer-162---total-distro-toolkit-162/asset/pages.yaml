    disk media — consume RAID5 (Redundant Array of Inexpensive Disks) support, allowing
    them to guard against the failure of a single hard disk without losing data. There
    was a problem with this: the RAID5 driver was susceptible to a (known) data loss
    scenario that could arise if a machine lose power during writing to the array,
    then came back in a degraded state, due to a disk bad, and insufficient (parity)
    data to determine parts of a write (blocks within a RAID stripe) had been corrupted
    or not. It would then the risk of doing a RAID array reconstruction using bad
    data — there are some checks that am to deal with, but it becomes messy; enthusiasts
    who experienced a degraded array first hard can attest (if it certainly among
    them).


    Many commercial concerns address the "write hole" by employing expensive hardware-based
    RAID systems using battery-backed NVRAM to cache (journal) write updates before
    being committed. Others, less enthusiasts may never have been aware of the problem,
    and were less likely to experience significant data loss from this scenario in
    any case.


    Facebook has contributed a new journal support to the RAID code which was implemented
    by journaling the various modern file systems (ext4, btrfs, and xfs). The write
    journal can be enabled and will be used to store all updates to the RAID arrays.
