    \ 1\n1804283183\n$ genNum 2\n1585335290 173876619\n$ genNum 3\n1208554674 844518568\n\
    ```\n\nAt least this time the sequence does not begin with the same number. However,\
    \ even with the use of rand(3), the produced sequence of numbers is not enough;\
    \ it is possible to try every possible value and get the same sequence of numbers\
    \ and therefore produce the same password. The constructed password will not be\
    \ truly unique or secure, so we need to look for a better technique.\n\n# Getting\
    \ better results\n\nIn UNIX operating systems, there is a special file called\
    \ /dev/random that serves as a blocking pseudo-random number generator. Therefore\
    \ a program can use /dev/random to get a rare, system-dependent and random seed\
    \ that is to replace or use. As you can guess, you will need to open /dev/random\
    \ for reading as follows:\n\n```\nint file = open(\"/dev/random\", O_RDONLY);\n\
