  md: 'To create a steady image, Evan and Kyle need to spin their 60-LED arc at 500
    rpm. At this rate, there is no horizontal drift in the image.


    Frame A six-wire slip ring connects the frame to the power, clock and data wires
    of the spinning LED strip, which is mounted with 3D-printed couplings.


    ![](img/6633b05a23a48c57613fd377238cfe15_67_0.png)


    FPGA While the Pi is used to drive the data feeding the LED strip, a Cyclone IV
    FPGA is used to regulate the DC motor so that it spins consistently.


    LEDs The DotStar APA102 LEDs update quickly as you can send data at any rate,
    but is then handled by the embedded LED microprocessors.


    # Components list


    +   * Raspberry Pi 2 Model B

    * mUsized FPGA board

    * Adafruit Perma-Proto 1/2-sized breadboard

    * Adafruit 0.5m DotStar LED strip

    * Pololu 9:7:1 Gearmotor

    * Miniature slip ring

    * D44VH10 power transistor

    * Salvaged computer PSU

