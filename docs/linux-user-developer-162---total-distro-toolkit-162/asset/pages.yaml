  md: '# OPINION CODING


    # Simple text compression


    Find out how to save space on your servers by compressing text files, such as
    log files, using a custom algorithm


    > The subject of this column is text compression. The purpose of compression is
    to make a given amount of data take less space. There are two kinds of compression:
    lossless and lossy. The lossless compression reconstructs an approximation of
    the original data whereas lossy compression seeks to improve the compression ratio.


    Here I present two small programs: compress.c and decompress.c. The compress program
    compresses input that is given as a command line argument. The key part of the
    function is to look for a special character (SPECIAL) that identifies the parts
    of the output string that were compressed—using the same character to spot in
    the input that need to be decompressed.


    The usual method used for compression is to replace a string, a character. The
    fact is that this character must be available for compression. However, the ''abababab''
    string will not be replaced. So decompress uses a single character to specify
    the number of repetitions; therefore, longer strings are represented more compactly.
    The SPECIAL character is encoded in a special way. There is also a helper function
    that replaces a sequence of same characters with the character itself. The SPECIAL
    character is added


    The threshold variable, which is global, defines the minimum length for a sequence
    in order to be compressed. In fact, there is no point in compressing a sequence
    of only two characters because the compressed result will be longer than the original!
    For reasons of simplicity, the output string is printed on


    screen. It is not enough to compress the text; you should also be able to decompress
    it and bring it back to its original state. The decompress.c program decompresses
    its input that is also given as a command line argument. The decompression function
    is simpler than the compression function as you can see (decompress() is much
    simpler than compression).


    Mihalis Tahoukoulos

    aUnix administrator, programmer, DBA and author

    Linux since 1999


    > It is not enough to compress the text; you should also be able to decompress
    it and bring it back to its original state


    ```

    $ /compress 123-123 123111 22

    $ /decompress 123-123 123 -F1 -F2 "

    $ 123-123 123111

    ```


    As you can see, the output of compression is as given as input:


    The trade-off between compression and speed is critical. If we use a faster compression,
    the compression ratio might get a little better, depending on the algorithm used.
    If you have plenty of time and you need to save your data as fast as possible,
    choosing a lossless algorithm could be a better ideas.


    The presented algorithm is a one-pass; you might get better results if you scan
    your input multiple times. As an example, you can improve the algorithm by making
    two passes to improve compression ratio. Alternatively, you can change the code
    of both programs to compress and decompress entire text instead of just single
    strings.


    You can find the source code for this article at github.com/mtahoukoulos and also
    in this issue''s FileSite.co.uk.'
