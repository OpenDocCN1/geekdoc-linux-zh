  md: '# Tutorial


    # Set up your Pi Zero


    Get to grips with your Raspberry Pi Zero


    ![](img/6633b05a23a48c57613fd377238cfe15_71_0.png)


    So you''ve picked up one of the tiny Zeros, but before the coding fun can begin,
    you need to get more familiar with it. Don''t worry, we''ll walk you through the
    Raspberry Pi Zero, the required cables, how to prepare a NOOBS SD card, and how
    to solder the GPIO headers onto the Pi. Once the Pi is working well, you''ll know
    how to get working on Linux through the Raspberry user interface. You''ll need
    a USB hub for this, or even to use a keyboard and mouse. We will also show you
    how to prepare a Raspberry SD card for headless use (either VNC with a screen
    adapter or USB to the Ethernet adapter).


    Liam Fraser is the creator of RaspberryPiTutorials and volunteer administrator
    for the Raspberry Pi Foundation. He is studying Computer Science at the University
    of York.


    # 01 Raspberry Pi Zero Overview


    The Raspberry Pi Zero is very small, and as such cannot fit normal-sized USB and
    HDMI adapters that break microUSB into full-size. To use it, you therefore need
    adapters that break microUSB into HDMI. You also need to be very careful when
    connecting the microUSB power cable meant for USB data. It is easy to tell them
    apart though, as they''re labelled, and the USB data connector is in between the
    HDMI power connectors.


    ![](img/6633b05a23a48c57613fd377238cfe15_71_1.png)


    # What you''ll need


    +   - Raspberry Pi Zero

    - microUSB power supply

    - Soldering iron and solder

    - Pi Zero adapter bundle

    - Monitor, mouse and keyboard (optional)

    - USB Wi-Fi or USB Ethernet adaptor (optional)

    - USB hub (optional)


