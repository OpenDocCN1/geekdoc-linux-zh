  md: '# Zero setup


    ![](img/6633b05a23a48c57613fd377238cfe15_72_0.png)


    Once you''ve soldered the header into-place, your Pi Zero should resemble any
    other Raspberry Pi


    # 02 GPIO headers


    Soldering your brand Raspberry Pi Zero might seem like a scary project at first,
    but it''s not that difficult! What is difficult, however, is snapping off the
    correct number of GPIO headers at that point it''s also worth noting that it doesn''t
    matter much if you mess up and end up missing a couple of the bottom pins.


    # If you are going to be doing lot of soldering then it''s probably worth getting
    a temperature-controlled iron


    # Add Wi-Fi capability


    # 03 Soldering kits


    Soldering irons are very cheap these days. If you are going to do a lot of soldering
    then it''s worth getting a temperature-controlled one where you can change the
    tip. The kit we used with a soldering iron, stand, solder wick and some lead-free
    solder was on Amazon. We managed to solder the pins using no problem.


    If you soldered the GPIO headers went well, you could take it to the next level
    and attempt to solder the internals of a USB-WiFi adapter. This is useful if you
    really need WiFi and are using the Pi Zero for Internet of Things devices.


    # 05 Solder the GPIO headers


    Here comes the bit that you might have been wanting but don''t worry! You will
    need to wipe the iron on the sponge to keep the tip clean. If this is the first
    time your iron has been used, the heating element will give you a lot of smoke
    for the first few minutes, don''t worry if it''s hot. Be mindful of your safety,
    and make sure you are soldering in a well-ventilated area - try not to breathe
    in any fumes.


    Once the iron is hot, apply some solder to the tip and wipe any excess solder
    off. Then, for each pin, touch the tip of the iron on the GPIO headers and the
    metal contact. If you can''t pull the pin away, add more solder. If there is too
    much solder, you can melt the solder and remove it.


    # 04 Holding the GPIO headers in place


    Before you solder the GPIO headers, you need to hold them in place. We used putting
    some blue-tac on either side of the pins. This also has the advantage that you
    can fix the Pi in place and then use the tack while you are soldering. The blu-tac
    should easily peel off once you are done.


    Take breaks when soldering the GPIO headers for a couple of reasons: 1) you don''t
    want to overheat any components on the Pi, and 2) you might melt the plastic of
    the GPIO headers and the board itself. All through, keep using the iron on the
    sponge to clean throughout the soldering process. Make sure to unplug the iron
    and put it somewhere safe to cool down when you are finished.


