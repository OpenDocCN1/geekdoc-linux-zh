  md: '# Review


    # Free software


    # LOG MANAGEMENT


    # The Log File Navigator 0.8.0


    Analyse log file instances in your terminal.


    LNAV is useful if you have a few scattered VPSs, and want a tool you can use from
    source. You probably already have bzip2, libcurl, libpcre (the Perl Compatible
    Regular Expression library), but building arguments yourself is time-consuming.
    LNAV will open syslog, and possibly others, but you can track any logfile or group
    of logfiles.


    +   * /var/log/syslog*


    As decompress on the fly, LNAV will handle many common log formats; now formats
    can be defined in JSON files and parsed in ~/informats/. Syntax highlighting for
    errors and log entries—yellow for warnings and red for error multiple services
    is supported, as loading multiple events simultaneously. You can also filter out
    entries you don''t need to see expressions, use keyboard shortcuts to jump between
    errors, while the histogram view lets you look at patterns of peak error occurrences
    by time period.


    ![](img/6633b05a23a48c57613fd377238cfe15_87_0.png)


    Above LNAV dives inside archived logs, and presents them in a nicely highlighted
    format


    Pros

    Works on systems without a GUI and enables you to quickly process stored log files
    in order to track down errors


    Cons

    Not as powerful and featured as some rivals, like journey or the traditional or
    traditional grep, awk and sed


    Great for...

    Anywhere you need SSH into administration tasks

    lnav.org


    # PROGRAMMING


    # Picat 1


    Opening up the power of logic programming to a new generation


    You should try out at least one programming language each year, and if you''ve
    it it 2016''s candidate, take a look at Picat, a multi-paradigm language supporting
    logic programming (CPP). Picat differs from logic programming in Prolog; it has
    great support for features that Prolog lacks by expanding the language with Pattern-matching;
    Imperative; Constraints/Arrays; Tabling,

    It''s been two years since Picat 0.1 was released, and the stability of Picat
    are fine improving. It is not well matched with the we of library support, although
    what there is some


    as logic encoders are. Development is steady, and installation is simple thanks
    to statically compiled binary (weighing in at relatively small 4MB).

    Logic programming is a paradigm based on logic, where you can express facts about
    the problem easily. Most of Prolog''s features, those that implemented by acclaim,
    are predicates, functions, and unification. Picat caches previous predictions,
    which dramatically speeds up calculations, and is based on the plugin module for
    all problems. Information documentation is good, and the official website has
    some excellent examples from Hkan Källander, including a useful paper introducing
    Picat for CP


    Pros

    Multi-paradigm declarative language that''s great for for constraint programming


    Cons

    Relatively young language, so currently lacking in library support and has a lower
    user base


    Great for...

    Power solving in science and engineering,

    picat-tang.org


    88'
