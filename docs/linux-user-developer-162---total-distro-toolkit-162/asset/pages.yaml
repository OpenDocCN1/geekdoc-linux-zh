    \ 0.54150, 0.46617)\n- set.seed(123)\n- runif(100, min=0, max=10)\n- runif(28759,\
    \ 0.83071, 0.89879, 0.83014, 0.04673)\n- runif(100, min=0, max=10)\n- runif(45565,\
    \ 0.52189, 0.89219, 0.54150, 0.46617)\n\nWhile the runif function keeps generating\
    \ numbers, if you run the run() command with the same seed, the function will\
