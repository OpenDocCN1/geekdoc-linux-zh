  md: '# DOCUMENT CONVERSION


    # Pandoc 11.5.2

    The missing link in your command line and Git publishing workflow dePandoc


    You know those pieces of software that surprisingly come to find today indispensable?

    The ones that you discover will always matter once upon a time when you had never
    even heard of? If you spend any time needing to convert text documents between
    formats, Pandoc could be about to become just such a thing.


    Pandoc will take files in Markdown, restructured text, HTML, DocBook, LaTeX, Mediatext,
    Markdown.org, XML, Txt2Tags, ODT, EPUB, or Hardook markup and convert to various
    text, HTML, Office or other formats, as well as custom Lua extensions


    Pandoc-citeproc provides authentic citations and bibliographies. A read the notes
    on the releases will show you how much work goes into this project. Installation
    is easy, but you can also try the space instead.


    Created by UCB professor John Macbride, Pandoc is a program written in Haskell,
    a great example of code you would write in the language you want, rather than
    in this academic language for functional programming like Haskell. In fact, real-world
    use of Haskell if you find a feature missing in Pandoc it would be a great excuse
    to dive into starting coding.


    # Pros


    Write everything in Markdown and what you need to convert, and let your experiences
    take care of


    # Cons


    Not perfect for all customised Text, so you might need required for advanced formats


    # Great for...


    LaTeX users dealing with the MS world

    pandoc.org


    # GAMING


    # Re-live the Star Wars of the 90s


    inspired glory of the 90s


    ![](img/6633b05a23a48c57613fd377238cfe15_88_0.png)


    With all the Star Wars, you may have found yourself digging out old games like
    Fighter from 1994. This space flight fighter, and other 90s classics like Desert
    Space Combat, are the influences that let you build Space Combat, a single-player
    space fighter that lets you play different ships and build what you want.


    The download is a static binary that should run on most systems, but you will
    need to check Source before running, which is unfortunate for important people
    with slow broadband connections. Thomas Schroeder is developing Space Combat at
    the same time, and with a game that feels special. There are plenty of opportunities
    to help improve the game,


    For those wanting to create the game with C++ and G, check Debug Mode, and there''s
    plenty of documentation using this to generate a script for an entire game, or
    conditional breakpoints to help you analyse your mission for some while. But wait,
    if you''ll want to jump into one of the dozen ships, and then just Buy—this game
    has enough missions to keep you going for months.


    Before the fun of the chase the thrill of shopping - lots of those that go


    # Pros


    Involving constantly surprising in-depth space flight/combat with plenty of missions
    and challenges


    # Cons


    A work in progress with bugs, and volunteers need volunteers. You need patience
    to get the best from it


    # Great for...


    Leaving Early Early leaves a few patches behind you spacecombatgames.net'
