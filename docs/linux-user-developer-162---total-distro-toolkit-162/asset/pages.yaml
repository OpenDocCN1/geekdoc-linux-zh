    # HOW TO USE FileSilo


    Everything you need to know about accessing your digital resources repository


    # To access FileSilo, please visit www.filesilo.co.uk/linuxuxer


    +   01 Follow the instructions on-screen to create an account with our FileSilo
    system, then log in and unlock the issue by answering a simple question about
    the magazine. You can access the content free with your issue.


    +   02 If you''re a print subscriber, you can unlock all the content by entering
    your Web ID. Your Web ID is the eight-digit numeric code printed above your details
    on the mailing label of your subscription copies. It can also be found on your
    renewal leaflets.


    +   03 You can access desktop, tablet or smartphone device using any browser (such
    as Firefox, Chrome, or Safari). However, we recommend that you use a desktop to
    download files to your phone or tablet.


    +   04 If you have any problems with accessing content on FileSilo, or with the
    registration process, take a look at the FAQs online or email filesilohelp@imagine-publishing.co.uk


