  md: '# Extruding objects


    Extruding is a 3D modeling technique for a feature, such as the side of an object,
    or features, as a set of vertices, which can be extended from their current position.
    To extrude an object, go into Edit Mode and select the feature you want to extrude
    by right-clicking on them. Then you can also extrude the whole region by clicking
    on ''Extrude Region'' in the Tool Bar or by pressing the E key. This should extrude
    that particular region by left-clicking, or back in the original position by right-clicking.
    You may also extrude in direction pressing the X, Y, or Z.


    # Biseect


    Blender has several tools available to bisect. One such tool is called Bisect.
    It slices an object into one or more pieces. To do this, select the desired faces
    or edges in Edit Mode and draw a line across the faces to create a new edge on
    those selected features. This will also create an placed edge on selected vertices
    if you can see them from any view.


    Once we have bisected our object, there are a few things that will be visible
    to us, such as the number of lines that we see on the screen. Then the Tool Bar
    will be the Bisect menu. You can adjust where your bisected line is located as
    well as some other features. The ''Clear Outer'' and ''Clear'' options allow us
    to eliminate one side or the other of the bisected edges and the ''Fill'' option
    will place a face connecting the bisected edges.


    # Joining and separating objects


    Joining and separating objects are useful tricks in order to make sure that objects
    stay fixed in relation to one another or keep their relationship to one another,
    respectively.


    To join two objects as Blender treats them as one object, if they are not physically
    touching then, go into Edit Mode and select the object by right-clicking on it,
    and then hold Shift and click-right on the other objects. Press Ctrl+J. The selected
    objects will get a yellow outline and you will move, scale, and rotate them. If
    you have joined objects (two parts of an object) that you wish to separate later
    on,


    To separate objects, go into Edit Mode and select the part you wish to separate.
    You''re probably thinking this is like a daunting task, but luckily we have a
    nice keyboard shortcut. If you select one particular feature and press the L key,
    Blender will then select all of the features related in that one and is smart
    enough to distinguish faces between two objects, even like a smaller cube joined
    to a larger cube.


