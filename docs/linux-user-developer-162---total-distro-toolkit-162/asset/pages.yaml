  md: '# Feature Total Distro Toolkit


    # MANAGE YOUR PRIVACY WITH TAILS


    Browse the internet anonymously and make sure your privacy is kept intact


    +   - Tails is a live operating system focused on privacy. ''Tails'' stands for
    ''The Amnesic Incognito Live System''. Amnesic implies that there is no long-term
    storage and everything is forgotten. Incognito identity is created at any point
    in time.

    - HOW TAILS WORKS

    As a live operating system, once it is booted from the DVD, your computer''s memory
    is RAM. Nothing is written to the hard disk, making it difficult for anyone to
    find out any trace of your activity.

    Not so? Tails is configured with special care so that it does not swap your computer''s
    hard disk, even if there is swap space. This means that as you shut down Tails,
    everything disappears.

    It is also important to mention that Tails doesn''t depend on the operating system
    running on your computer or live DVD, so you can use it in the same way as your
    other computer. After shutting down Tails, the computer will start with its usual
    operating system.


    ![](img/6633b05a23a48c57613fd377238cfe15_25_0.png)


    ![](img/6633b05a23a48c57613fd377238cfe15_25_1.png)


    The Tor browser presents websites and services for accessing your location and
    other personal data


    ![](img/6633b05a23a48c57613fd377238cfe15_25_2.png)


    | Boot Tails |

    | Live (failsafe) |


    Email encryption with Gmail


    +   - PRIVATE BROWSING USING TAILS

    Another great aspect of using Tails is to access the internet in incognito mode.
    Tails uses the Tor or I2P networks to protect your information online. For the
    untrusted, Tor or I2P etc., are distributed networks that bounce your connections
    through a network of relays all around the world. This way, anybody watching your
    connection cannot see the sites you visit, and the sites you can''t track your
    physical location. All the software is configured to access the internet via Tor.
    If an application tries to connect directly to the internet, it is blocked automatically.

    To use Tor, simply boot Tails from the Live DVD and open Tor. You can use it like
    any other browser. If you want to have a location-based service from the Tor browser,
    like Google Maps, Mostly you''ll see a server location somewhere on the other
    side of the globe.


    Thunderbird is easy to use with Gmail. Since Tails is based on Debian, Thunderbird
    is used as the default email client. GPG is a software that can be installed on
    top of it. If you want to write and receive emails signed and/or encrypted using
    GPG standard.


    # TOR VERSUS I2P


    Tails supports Tor and I2P networks for online privacy. Both of them are supposed
    to protect your identity using cryptographic methods, there are several differences
    in their approaches to how they provide privacy. Tor takes the directory-based
    approach, providing a central point to gather and distribute the network information.
    I2P uses a distributed database and peer selection. I2P provides better anonymous
    access to the open internet


    while I2P provides a more robust and reliable network within the network layer.
    It has a larger user base, with more volunteers around the world.

    Also, beware that your ISP can see you using Tor or I2P (though they cannot decrypt
    the content of the traffic). To hide this information from your ISP, you can use
    a high-speed VPN to act as an entry point to your anonymous network. An open source
    project for this is OpenVPN: https://openvpn.net/


    26'
