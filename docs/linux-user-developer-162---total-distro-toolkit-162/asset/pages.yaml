    # Advanced threads


    Here we will go through how to implement a more practical program that uses threads
    to pass multiple arguments to a thread using a C structure. Refer to multargs.c
    for details.


    The first thing you should notice is that each thread uses a single instance of
    the structure; you should decide how many threads you need. The IDs of the generated
    threads are stored in an array.


    Additionally, we use TOTAL_THREADS to keep track of the number of threads that
    are being used; a global variable will be used to store the number of threads.
    When you start a thread, you should increment the value of TOTAL_THREADS.


    The sleep() call, before the main() function returns and finishes the program,
    is important because it allows the threads to do their work. Use sleep() or wait()
    in order to see the output of the printf() function.


    In the create() function, the last argument is not NULL, but a (void *) pointer
    to the structure of interest. It is interesting to see how the (void *) pointer
    to the structure is captured inside the arg argument of pthread_create() that
    is also passed.


    ```

    struct threads *myArgs = arg;

    ```


    After you get the (void *) pointer into a structure variable, you can use the
    variable as argued.

    Note that the printf() function calls two printf() commands, your output might
    look like the following because the three threads execute simultaneously:


    > $ /multipleArgs

    Hello 1 from thread with Hello 4 from thread with

    Hello 0 from thread with thread ID 4352634880.

    thread ID 435371456.

    thread ID 4352098304.


    # Mutex variables


    The next of this tutorial will look at another program that uses mutex variables.
    A mutex is an abbreviation of "mutual exclusion": mutex variables are used for
    thread synchronization and shared data when multiple threads can occur at the
    same time.


    The mutex.c program shows a simple program that uses mutexes for thread synchronization.
    The mutex is a variable in order to be accessible by anyone in the program; this
    is one of the cases where using a global variable is recommended. Before using
    a mutex, you should initialize it with pthread_mutex_init().


    Similarly, after finishing with a mutex, you should destroy it with pthread_mutex_destroy().
    The pthread_mutex_lock() function ensures that only one thread is allowed to access
    the critical section. If another thread tries to lock a lock that is already locked,
    it will wait - sleep until the area of code is unlocked, which happens when the
    head of the pthread_mutex queue is executed.


    The trick part is understanding that as soon a thread executes the pthread_mutex_lock()
    call, no other thread can get the same lock and proceed with the rest of the code
    until the lock is released. If more than one thread is waiting for a lock, it
    is a matter of which thread is going to get the lock next.


    Deadlock occur when a thread sets an impossible condition for the unlocking of
    a lock required elsewhere'
