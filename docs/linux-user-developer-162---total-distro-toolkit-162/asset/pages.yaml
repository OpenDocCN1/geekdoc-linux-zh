    # AND THE WINNER


    # APT


    At the time we first saw the light - and it was 17 years ago - there were not
    many managers in the Linux world; or at least, the least of them could get. So
    it is like the first and the most linux-like packages, APT is not relevant to
    others - but whatever we angle at it, APT performs well or very well. If you find
    it useful, it''s worth some time learning new tips and tricks related to APT.
    They all come from third-party developers (because Debian policy is very strict
    on including them - ''not mature enough''), but they can be very useful, such
    as the As-Fast project (apt::fastmirror) which can drastically improve download
    speed.


    ![](img/6633b05a23a48c57613fd377238cfe15_83_0.png)


    DNF was created with a long-awaited update to the latest Yellow Dog Dget. It looks
    like they could have done anything better, but the situation has not greatly improved.
    DNF can save you a lot of time and bandwidth by only downloading the bits that
    are needed, while it also had a really good time with Pacman, which won the speed
    race and brought us


    +   You can use APT for installing local packages as well!


    Latest and the fastest releases of whatever we wanted to. Normal Linux lives in
    the ever-changing world of Arch, and that means you''re not hacker or a developer,
    you can open anything with Pacman long term. Finally, Zypper is outstanding technology
    that works fine for openSUSE and commercial


    > Alexander Tolstoy


    SUSE offers it an enterprise-level tool with lots of extra features. The only
