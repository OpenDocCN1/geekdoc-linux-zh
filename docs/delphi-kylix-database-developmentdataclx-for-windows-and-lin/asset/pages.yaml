- pgno: 392
  md: "This appendix takes a quick look at dbExpress Plus. Thomas Miller’s open source\
    \ add-on library for dbExpress. dbExpress Plus can be downloaded from CodeCentral\
    \ at codecentral.borland.com. It is ID #15945.\n\n# What Is dbExpress Plus?\n\n\
    dbExpress Plus is an open source effort to extend dbExpress by introducing new\
    \ components in three key areas:\n\n+   * Scripting\n+   * Enhanced metadata\n\
    +   * Data pumping\n\nThe following sections provide a quick overview of these\
    \ components.\n\n# Scripting\n\nTSQLScript provides a means of executing multiple\
    \ SQL statements at once through what is known as a script. You’re probably familiar\
    \ with SQL script files. The following snippet shows a simple script file. This\
    \ is actually part of the SQL script used to create the CONMAN database.\n\n```\n\
    CREATE TABLE CONTACTS\n(\n    CONTACTID    INTEGER NOT NULL,\n    FIRST      \
    \  VARCHAR(20),\n    LAST         VARCHAR(30),\n    DEAR         VARCHAR(40),\n\
    \    TITLE        VARCHAR(30),\n    COMPANYNAME  VARCHAR(50),\n    ADDRESS1  \
    \   VARCHAR(50),\n    ADDRESS2     VARCHAR(50),\n    CITY         VARCHAR(30),\n\
    \    STATE        VARCHAR(20),\n    POSTALCODE   VARCHAR(10),\n    COUNTRY   \
    \   VARCHAR(30),\n    PHONE        VARCHAR(20),\n    FAX          VARCHAR(20),\n\
    \    CELLULAR     VARCHAR(20),\n    PAGER        VARCHAR(20),\n    EMAIL     \
    \   VARCHAR(40),\n    IMAGE        BLOB SUB_TYPE 0 SEGMENT SIZE 4096,\n    NOTES\
    \        BLOB SUB_TYPE TEXT SEGMENT SIZE 4096,\n    PRIMARY KEY (CONTACTID)\n\
    );\n```"
  merge: -1
  img_proc: true
- pgno: 393
  md: "```\nCREATE UNIQUE INDEX IX_CONTACTNAME ON CONTACTS (LAST, FIRST);\n\nCREATE\
    \ TABLE TODOS\n{\n    TODOID      INTEGER NOT NULL,\n    CONTACTID   INTEGER NOT\
    \ NULL,\n    DESCRIPTION VARCHAR(50),\n    SCHEDULED   TIMESTAMP,\n    COMPLETED\
    \   TIMESTAMP,\n    PRIMARY KEY (TODOID),\n    FOREIGN KEY (CONTACTID) REFERENCES\
    \ CONTACTS (CONTACTID) ON DELETE CASCADE\n};\n```\n\nOrdinarily, you’d need to\
    \ execute these three statements (CREATE TABLE, CREATE INDEX, and CREATE TABLE)\
    \ separately by calling TSQLConnection.ExecuteDirect three times, once for each\
    \ statement.\n\nUsing TSQLScript, you can use the following two lines of code:\n\
    \nSQLScript1.SQL.LoadFromFile( $ScriptFile );\nSQLScript1.ExecuteDirect;\n\nThis\
    \ code snippet assumes that $ScriptFile is a string variable that contains the\
    \ filename of the SQL script file.\n\n# Enhanced Metadata\n\nTSQLMetadata provides\
    \ additional, easy-to-use methods to retrieve metadata information from a database.\
    \ Because it derives from TSQLConnection, you can use TSQLMetadata in place of\
    \ a TSQLConnection in your projects in which you need enhanced metadata.\n\n#\
    \ Retrieving Table, View, and Field Names\n\nTSQLMetadata allows easy retrieval\
    \ of table names, system table names, view names, and synonym names through the\
    \ GetTableName, GetSysTableName, GetViewName, and GetSynonymName methods, respectively.\
    \ Each of these methods takes a single parameter, which designates a string list\
    \ into which the results are returned.\n\nTSQLMetadata.GetTableNames( ListBox1.Items\
    \ );\n\nTSQLMetadata.GetFieldNames retrieves the fields that make up a table.\
    \ Pass in the table name to retrieve the field names for a string list for the\
    \ results, and a flag that indicates whether fields should be returned in the\
    \ order in which they are declared or in alphabetical order. TSQLMetadata.GetFieldNames\
    \ is defined like this:\n\nprocedure GetFieldNames(const ATableName: string; AList:\
    \ TStrings; ASortOrder: TMetadataSortOrder = soPosition); overload;"
  merge: -1
  img_proc: true
- pgno: 394
  md: 'By default, fields are returned in the order in which they were declared. By
    passing soName as the final parameter to `GetField0Names`, the field names are
    returned in alphabetical order.


    # Retrieving Additional Field Metadata


    If you want to retrieve additional metadata for a field, call `TSQLMetadata.GetFieldMetaData`,
    which is defined like this:


    ```

    function GetFieldMetaData(const ATableName,\nAColumnName: string): TFieldMetaData;

    ```


    This method takes the table name and field name as parameters and returns a `TFieldMetaData`
    record containing information about the field in question. `TFieldMetaData` is
    defined like this:


    ```

    TFieldMetaData = record\n    ColumnName: string;\n    ColumnPosition: LongInt;\n    ColumnDataType:
    LongInt;\n    ColumnTypeName: string;\n    ColumnSubType: LongInt;\n    ColumnLength:
    LongInt;\n    ColumnPrecision: LongInt;\n    ColumnScale: LongInt;\n    ColumnNullable:
    LongInt;  // 1=Not Nullable, 0=Nullable\nend;

    ```


    As you can see, it specifies the column (or field) name, the zero-based index,
    the type of data contained in the column, and other pertinent information about
    the field.


    # Retrieving Index Data


    One useful method that `TSQLMetadata` provides is a way to get information about
    an index on a table. Two forms are provided. The first form retrieves information
    about any index, given its name. Two methods are provided for this use.


    ```

    procedure GetIndexFieldNames(const ATableName, AIndexName: string;\n  AList: TStrings);

    ```


    `GetIndexFieldNames` returns a string list composed of the fields that make up
    the index AIndexName on table ATableName.


    ```

    function GetIndexFields(const ATableName, AIndexName: string): string;

    ```


    `GetIndexFields` returns the same list as a semicolon-delimited list.


    The second form of index data retrieval is to retrieve data about the primary
    key, rather than an arbitrary index. To retrieve a list of fields that make up
    the primary key, you could pass in the primary key name either to `GetIndexFieldNames`
    or `GetIndexFields`. However, you might not'
  merge: -1
  img_proc: true
- pgno: 395
  md: "know the name of the primary key. In that case, you can call either `GetPrimaryKeyFieldNames`\
    \ or `GetPrimaryKeyFields`.\n\n```\n```\nprocedure GetPrimaryKeyFieldNames(const\
    \ ATableName: string;  \n                                  AList: TStrings);\n\
    function GetPrimaryKeyFields(const ATableName: string): string;\n```\n```\n\n\
    These two methods perform the same service as `GetIndexFieldNames` and `GetIndexFields`,\
    \ except that they always work on the primary key.\n\n# ## Additional Methods\n\
    \nTSQLMetaData also provides a collection of methods to return the `INSERT`, `UPDATE`,\
    \ and `SELECT` SQL statements for a given table. The three methods are listed\
    \ next:\n\n```\n```\nfunction GetInsertStatement(const ATableName: string;\n \
    \                           ASQL: TStrings): Integer;\nfunction GetUpdateStatement(const\
    \ ATableName: string;\n                           ASQL: TStrings): Integer;\n\
    function GetSelectStatement(const ATableName: string;\n                      \
    \      ASQL: TStrings): Integer;\n```\n```\n\nGiven a table name, these three\
    \ methods return the corresponding `INSERT`, `UPDATE`, or `SELECT` SQL statement\
    \ in the `ASQL` parameter.\n\n# ## Data Pumping\n\nTSQLDataPump provides an answer\
    \ to the BDE's `TBatchMove` component, allowing you to easily move data from one\
    \ table to another.\n\nTo do this, TSQLDataPump publishes `SQLMetaDataSource`\
    \ and `SQLMetaDataDestination` properties, which reference the TSQLMetaData components\
    \ that point to the source and destination database connections, respectively.\n\
    \nAfter you specify the source and destination databases, set the `SQLSource`\
    \ property to a valid `SELECT` statement for the source database, such as\n\n\
    ```\n```\nSELECT EMP_NO,  FIRST_NAME,  LAST_NAME,  PHONE_EXT,  HIRE_DATE,  DEPT_NO,\n\
    \       JOB_CODE,  JOB_GRADE,  JOB_COUNTRY,  SALARY FROM  EMPLOYEE\n```\n```\n\
    \nNext, set the `DestinationTable` property to the name of the table in the destination\
    \ database, and then double-click the `DestinationFields` property, which allows\
    \ you to set up a mapping between the fields in the source table and the fields\
    \ in the destination table.\n\nFinally, set the `DataMoveMode` to the appropriate\
    \ action to perform. Table B.1 lists the modes that may be used."
  merge: -1
  img_proc: true
- pgno: 396
  md: '# TABLE B.1 Valid DataMoveMode Values


    | Value | Description |

    | :--- | :--- |

    | dmAlwaysInsert | Inserts all selected records into the destination table. |

    | DmAppend | Appends selected records to the destination table. |

    | dmAppendUpdate | Updates the record if it already exists in the destination
    table. Otherwise, appends the record to the destination table. |

    | DmDelete | Deletes matching records from the destination table. |

    | DmUpdate | Updates matching records in the destination table. |


    At this point, all the required properties are set, so you need to call only TSQLDataPump.Execute
    to perform the batch move operation.


    # For More Information


    This has been only a brief overview of the capabilities provided by dbExpress
    Plus. Because it is an open source project, it stands to reason that the code
    may grow to provide more functionality than that discussed here. The dbExpress
    Plus download also comes with a demo application that shows how to use many of
    the methods discussed in this appendix.'
