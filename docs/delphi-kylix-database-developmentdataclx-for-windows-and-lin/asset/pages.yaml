  md: 'can make changes to the data. However, if you leave the application and run
    it again, none of your changes have been saved to the database. We’ll remedy that
    situation in the next section. For now, I just want you to see how easy it is
    to establish the relationship between a client dataset and another dataset. This
    relationship is important because dbExpress datasets don’t support editing or
    bidirectional scrolling on their own—they must be connected to a client dataset
    to provide these capabilities.


