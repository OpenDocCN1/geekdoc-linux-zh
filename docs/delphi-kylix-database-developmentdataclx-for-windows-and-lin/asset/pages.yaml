- pgno: 216
  md: '# ## TDataSource


    As Table 5.1 indicates, TDataSource provides a conduit between a dataset and one
    or more data-aware controls that are connected to it. You cannot connect a data-aware
    component directly to a dataset. Instead, you connect a TDataSource to the dataset,
    and then connect one or more data-aware components to the data source (as Figure
    5.1 illustrates).


    ![](img/fe651f295b5f960d5463c4fb581d2281_216_0.png)


    **FIGURE 5.1**

    Relationship between datasets, data sources, and data-aware components.


    TDataSource is a rather simple component, publishing just three events and three
    properties, in addition to the Name and Tag properties common to all components.
    Table 5.2 lists the published properties and Table 5.3 lists the data source''s
    events. OnDataChange and OnStateChange (the most commonly used of the events)
    are applied in Listing 5.4, later in this chapter.


    **TABLE 5.2** TDataSource Properties

    | Property | Description |

    | :--- | :--- |

    | AutoEdit | When True, the underlying dataset is automatically placed into edit
    mode as soon as the user starts to type into a data-aware component that is connected
    to this data source. When False, you must specifically call the dataset''s Edit
    method before the user can type into any of the connected data-aware controls.
    |

    | DataSet | Provides a link to the dataset from which the data-aware components
    retrieve data. |

    | Enabled | When Enabled is True, the data-aware components connected to this
    data source display the data contained in the dataset. When it''s False, data-aware
    controls are blank. |'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# **TABLE 5.3** TDataSource Events


    | Event | Description |

    | --- | --- |

    | OnDataChange | Fires when the dataset’s current record data is changed; either
    because the dataset’s cursor is moved to a new record, or because one of the fields
    is modified. |

    | OnStateChange | Fires when the underlying dataset’s State property changes.
    For example, when the dataset transitions from browse mode to edit mode, or from
    insert mode to browse mode. |

    | OnUpdateData | Fires immediately before the underlying dataset posts changes
    to the database. |


    It is easy to forget about `TDataSource` when writing database applications. After
    dropping the data source on a form and connecting the data-aware components to
    it, the data source often seems to serve no useful purpose. However, the three
    events listed in Table 5.3 are extremely useful in a variety of situations. An
    example of their usefulness is shown in the sample application at the end of this
    chapter.


    # Common Data-Aware Component Characteristics


    Before discussing the specifics of each individual data-aware component, there
    are some common characteristics that you should understand. To effectively use
    data-aware components in your applications, you should keep in mind the following
    considerations:


    # Modifying Component Data from Code


    If you want to change the value that’s displayed in a data-aware component from
    within your code, you should edit the underlying field rather than attempting
    to manipulate the data-aware component.


    For example, say you have a TDBEDIT named `ecFirstName` connected to a field named
    `FirstName`. If you want to programmatically set the edit control so that it displays
    *John*, you might be tempted to write the following code:


    ```

    ```text

    eCFirstName.Text := ''John'';

    ```

    ```


    This is not the correct way, however. What you should do is set the underlying
    field value to John, like this:


    ```

    ```text

    ClientDataSet1.Edit;

    ClientDataSet1FirstName.AsString := ''John'';

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'If you are not using persistent field objects, you would do this instead:


    ```

    ClientDataSet1.Edit;

    ClientDataSet1.FieldName(''FirstName'').AsString := ''John'';

    ```


    The important thing to remember is to call the dataset''s `Edit` method before
    attempting to set the field value. If the dataset is already in edit or insert
    mode, the redundant call to `Edit` doesn''t have any adverse effects. If for some
    reason the dataset can''t be edited (for example, if the dataset''s `ReadOnly`
    property is set to `True`), the call to `Edit` raises an exception, which you
    should be prepared to handle gracefully.


    # Controlling When the User Is Allowed to Edit Data


    By default, as soon as the user starts typing into a data-aware component, VCL/CLX
    puts the associated dataset into edit mode. If you want to control the user''s
    ability to make edits from within your code, you have four options:


    +   * Set the dataset''s `ReadOnly` property to `True`, preventing the user from
    changing any values in the dataset. This also prevents any changes being made
    to the data through code.

    +   * Set the underlying field''s `ReadOnly` property to `True`. This prevents
    the user from modifying the field, and also prevents the field from being modified
    through code.

    +   * Set the data-aware component''s `ReadOnly` property to `True`, preventing
    the user from changing a single value in the dataset. Note that this has no effect
    on any changes that you make in your code using the method described in the preceding
    section. Setting the component''s `ReadOnly` property does not in any way make
    the field itself read-only. It merely prevents the user from making direct modifications
    to the data through the component.

    +   * Set the data source''s `AutoEdit` property to `False`, preventing the dataset
    from automatically entering an edit state when the user starts typing into a data-aware
    component. If you go this route, you will typically provide a menu item or a button
    on the form, which the user clicks to put the dataset into edit mode. Alternatively,
    you can use a `TDBNavigator`, which is discussed later in this chapter.


    # Formatting and Editing Field Values


    Data-aware components don''t have a built-in mechanism for controlling the formatting
    of field values during input and output, so at first glance, you might assume
    that there is no way to display nicely formatted numeric and string data. However,
    it turns out that data formatting is taken care of at the field level rather than
    at the component level. For this reason, you can set a specific output format
    for a field, and the same format will be used anywhere that a data-aware component
    is used to display that field.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Numeric Fields


    When you connect a data-aware component to a numeric field, the data that is displayed
    in a component is formatted according to the underlying field''s **DisplayFormat**
    property.


    **DisplayFormat** is a string property that consists of up to three parts, separated
    by semicolons, in the following format:


    ```

    <Positive>;<Negative>;<Zero>

    ```


    The different sections of the string determine how the value is displayed when
    it is positive, negative, or zero (respectively). Null values are always displayed
    as a blank.


    Table 5.4 lists the characters that can be used within the **DisplayFormat** string.


    **TABLE 5.4** **DisplayFormat** Specifiers


    | Character | Description |

    | :--- | :--- |

    | # | Digit placeholder. If the formatted value does not require a digit at that
    position, the position is not filled. For example, the value 1.2 formatted with
    a **DisplayFormat** of ###.## yields 1.2, with no leading or trailing spaces.
    |

    | 0 | Digit placeholder. If the formatted value does not require a digit at that
    position, the position is filled with a 0. For example, a value 1.2 formatted
    with a **DisplayFormat** of 000.00 yields 001.20. |

    | . | Decimal point. Determines where the radix point occurs in the output string.
    The decimal point is replaced by the character stored in the **DecimalSeparator**
    global variable. |

    | , | Thousands separator. The occurrence of a comma in the **DisplayFormat**
    indicates that the value should be formatted using thousands separators. The comma
    does not occupy a position in the output string—it only serves as an indication
    that thousands separators are needed. At runtime, the comma is replaced by the
    character stored in the **ThousandsSeparator** global variable. |

    | E+/– | Scientific notation. If E+, E-, e+, or e- is present in the **DisplayFormat**,
    the value is formatted using scientific notation. E+ indicates that all exponents
    should be preceded by a sign. E- indicates that only negative exponents should
    be preceded by a sign. The E+ or E- is followed by one to four zeros, specifying
    the minimum number of digits to include in the exponent. |

    | ; | Separator character. Used between positive, negative, and zero portions
    of the string. |

    | '' or " | Literal. Characters enclosed in single or double quotes are copied
    literally to the output string, and are not interpreted as formatting characters.
    |'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Table 5.5 lists some examples of \textbf{DisplayFormat} settings.


    # **Table 5.5**  \textbf{DisplayFormat} Settings


    | Value | DisplayFormat | Output |

    | :------------- | :------------- | :------------- |

    | 1.2 | \`\#\#0.00\` | 1.20 |

    | 1.2 | \`000.\#\#\` | 001.2 |

    | 1 | \`\#0.000\` | 1.000 |

    | 1 | \`00.\#\#\` | 1 (The radix point is not displayed because it is not needed.)
    |

    | 12.34 | \`\$\#\#0.00\` | \$12.34 |

    | 1234.56 | \`\$,.00\` | \$1,234.56 |

    | 12.345 | \`X=\#.\#\#\` | X=12.35 (Notice that the part to the left of the radix
    point is automatically expanded to show two digits, but the part to the right
    of the radix point is rounded to the specified number of digits.) |

    | 100000 | \`\#0.000E+00\` | 10.000E+04 |

    | \textless{}15 | \`\#\#0;(\#\#\#);zero\` | (15) |

    | 0 | \`\#\#0;(\#\#\#);zero\` | zero |

    | 10 | Room \`"\#"\#0\` | Room \#10 (The \# enclosed in quotes is copied verbatim
    to the output result.) |


    If you only specify a single substring in \textbf{DisplayFormat}, it is used to
    format all numbers. To use a different output format for negative or zero values,
    separate the specifiers with semi-colons, like this:


    ```

    ```

    $,0.00;($,0.00);<zero>

    ```

    ```


    This \textbf{DisplayFormat} string formats positive numbers as dollars and cents,
    negative numbers within parentheses, and zero values as the string *<zero>*.


    You can omit a portion of the string by simply leaving its specifier empty. In
    this case, the positive format is used instead. For example:


    ```

    ```

    $,0.00;;<zero>

    ```

    ```


    In this case, positive and negative values are both formatted using \`\$0.00\`.
    Zero values are displayed as *<zero>*.


    If the \textbf{DisplayFormat} property is left completely blank, the value is
    displayed using general floating-point output with 15 significant digits.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'By default, the same format is used when editing a field''s value. You can
    set a different format to use when editing by setting the field''s `EditFormat`
    property in addition to, or instead of the `DisplayFormat` property. `EditFormat`
    works the same as `DisplayFormat`: It contains a semicolon-delimited set of formats
    to use when displaying positive, negative, and zero values.


    For example, suppose that you have a floating-point field that you want displayed
    as 15.25%, but when editing, you don''t want the percent sign displayed. You would
    set `DisplayFormat` to `#.00%` and `EditFormat` to `#0.00`.


    # # String Fields


    String fields do not have separate `DisplayFormat` and `EditFormat` properties.
    Instead, they have an `EditMask` property, which is used for both displaying and
    editing a field''s value. `EditMask` holds a Paradox-style edit mask that determines
    how the string is both displayed and edited.


    Like the `DisplayFormat` and `EditFormat` properties, `EditMask` consists of three
    parts, separated by semicolons. The first part is the mask to use when formatting
    the string value. The second part contains a `0` to indicate that literals should
    not be saved as part of the string value. Any other character in the second part
    of the string indicates that literals should be saved as part of the string value.
    The third part represents the character that''s displayed to represent blanks,
    or characters that have not yet been entered.


    For example, the following `EditMask` accepts a U.S. Social Security number, storing
    the hyphens in the underlying field and displaying underscores where numbers are
    to be entered.

    `000-000-0000;1;_`


    Table 5.6 shows the valid `EditMask` specifiers for string fields.


    **TABLE 5.6** `EditMask` Specifiers

    | Character | Description |

    | :--- | :--- |

    | L | Requires an alphabetic character. |

    | 1 | Allows an alphabetic character, but does not require it. |

    | A | Requires an alphanumeric character. |

    | a | Allows an alphanumeric character, but does not require it. |

    | C | Requires a character. |

    | c | Allows a character, but does not require it. |

    | 0 | Requires a numeric character. |

    | 9 | Allows a numeric character, but does not require it. |

    | # | Allows a numeric character, or a plus or minus sign, but does not require
    it. |'
  merge: -1
  img_proc: true
- pgno: 222
  md: "TABLE 5.6 Continued\nCharacter\tDescription\n:\tTime separator. This character\
    \ is replaced with the time separator that is defined in the control panel under\
    \ regional settings when it's other than :.\n/\tDate separator. This character\
    \ is replaced with the date separator that is defined in the control panel under\
    \ regional settings when it's other than /.\n_ \tUnderscore. This character inserts\
    \ a space in the text. When editing a field, the cursor automatically skips over\
    \ the _ character.\n;\tSeparator character. Used between mask, literal, and blank\
    \ portions of the string.\n!\tIf the ! character appears anywhere in the mask,\
    \ extra and optional characters are represented as leading blanks. Otherwise,\
    \ extra and optional characters are represented as trailing blanks.\n>\tAll characters\
    \ following the > character are forced to uppercase until a < character is encountered.\n\
    <\tAll characters following the < character are forced to lowercase until a >\
    \ character is encountered.\n<> \tAll characters are accepted in whatever case\
    \ the user enters them.\n\\\\ \tLiteral. The character following the \\ character\
    \ is inserted in the string, literally, and is not interpreted as a mask character.\n\
    \n> **Note**\n> \n> Each character in the mask represents one byte in the string—not\
    \ one character. For that reason, when working with multibyte character sets,\
    \ each character in the string is represented by two characters in the EditMask.\
    \ For example, AA and LL each represent a single multibyte character. When inserting\
    \ a literal into a mask, only single-byte literal characters can be entered.\n\
    \nTable 5.7 lists some examples of EditMask settings.\n\nTABLE 5.7 EditMask Settings\n\
    \nStored Value\tEditMask\tDisplayed Value\tRemarks\n5615551212\t(000), 000-0000\t\
    (561) 555-1212\tPhone number. Formatting characters are not stored.\n123-456-7890\t\
    000-000-0000;1;_ \t123-456-7890\tSocial Security number. Formatting characters\
    \ (hyphens) are stored."
  merge: -1
  img_proc: true
- pgno: 223
  md: '**TABLE 5.7** Continued


    | Stored Value | EditMask | Displayed Value | Remarks |

    | --- | --- | --- | --- |

    | 33467-0708 | `00000 -0000;1;_` | 33467-0708 | ZIP code. Hyphen is stored. |

    | 5/28/01 | `199/99/00;1;_` | 5/28/01 | Date. Slashes are stored. Extra spaces
    are stored at the beginning of the string rather than at the end. |


    ![](img/fe651f295b5f960d5463c4fb581d2281_223_0.png)


    The built-in Delphi edit masks leave something to be desired if you’re wanting
    to use anything more than a simple edit mask. The standard data-aware components
    don’t validate complex masks well (such as phone numbers, Social Security numbers,
    and the like). For this reason, you might want to consider a third-party library
    to assist you with data entry and validation. I use Orpheus, from TurboPower Software
    Company. You can find TurboPower’s Web site at `http://www.turbopower.com`.


    # Simple Data-Aware Components


    Most data-aware components fall into a category that I’ve defined as *simple*
    data-aware components. For purposes of this discussion, a simple data-aware component
    is one that links to a single field in a single record of a single dataset. For
    instance, a component that enables you to display and edit values for the `FirstName`
    field of a dataset is a simple data-aware component.


    This contrasts with more complex data-aware components; which either display multiple
    values from the same dataset (such as `TDBGrid`), or which look up information
    from one dataset for inclusion in another dataset (such as `TDBLookupCombo` and
    `TDBLookupListBox`).


    In this section, I’ll discuss the simple data-aware components, and following
    sections will cover some that are more complex. Don’t be too concerned at this
    point with the mechanics of creating data-aware components. Near the end of this
    chapter, I’ll show you how to take a non-data-aware component and create a data-aware
    descendent from it.


    # TDBText


    `TDBText` is the simplest of all the data-aware components. It is a display-only
    component, similar to the standard `TLabel`. To use it, drop a `TDBText` component
    on a form, and set the `DataSource` and `DataField` properties. The data is displayed
    according to the output format discussed in the preceding section.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# TDBedit


    TDBEdit corresponds to the standard TEdit component. It’s used to display and
    edit numeric, string, or data/time data contained in a dataset.


    Data is displayed according to the underlying field’s DisplayFormat or EditMask
    property, and is edited according to the EditFormat or EditMask property (depending
    on the field type).


    # TDBMemo


    TDBMemo is similar in concept to TDBEdit, except that it can display and edit
    multiline text fields, such as unformatted notes. A TDBMemo is usually connected
    to a CLOB (Character Large Object) field, although you can also use it to edit
    string fields.


    # TDBCheckBox


    TDBCheckBox is used like a standard TCheckBox—to display and enter yes/no or true/false
    values. TDBCheckBox can be connected to a Logical or a Yes/No field in desktop
    databases, such as Paradox or Access. Most SQL databases, however, don’t directly
    support these field types. In these cases, you connect the TDBCheckBox to a string
    field, which is frequently a single character.


    To define the relationship between checked/unchecked and the underlying field
    data, you set the component’s ValueChecked and ValueUnchecked properties. ValueChecked
    refers to the value of the field when the checkbox is marked. ValueUnchecked determines
    the value of the field when the checkbox is not marked. When the form containing
    the TDBCheckBox is first displayed, and the underlying field contains a value
    that does not equal either of these two properties, the checkbox is initially
    grayed out.


    By default, the values of these two properties are true and false, respectively.
    In my own applications, I use a single character field (VARCHAR(1)) for Boolean
    field types. I use T for true and F for false. Because of this, whenever I drop
    a TDBCheckBox on a form, I set ValueChecked to T and ValueUnchecked to F.


    # Note


    If you decide to always use a single character field for Boolean field types,
    you might want to consider creating a simple component derived from TDBCheckBox
    that sets ValueChecked to T and ValueUnchecked to F (by default). That way, you
    don’t have to manually set these properties every time you use the component.


    In addition, you should probably consider creating a domain in the database to
    specify character fields. This is the domain that I create for my own InterBase
    databases:


    ```

    CREATE DOMAIN DOM_BOOLEAN AS VARCHAR(1)

    DEFAULT ''F'' NOT NULL CHECK (VALUE IN (''F'', ''T''));

    ```'
  merge: -1
  img_proc: true
- pgno: 225
  md: "# ## TDBRadioGroup\n\nTDBRadioGroup is used in cases where you want the user\
    \ to select one option from a short list of options. By default, the value of\
    \ the selected item is stored in the underlying dataset field, which means you\
    \ typically connect the TDBRadioGroup component to a string field.\n\nIn my applications,\
    \ I've found that I most often want to store the index of the selected item in\
    \ an `Integer` field. This is straightforward to accomplish if you make use of\
    \ the component's `Values` property. `Values` is a string list that corresponds\
    \ to the `Items` property in the following manner:\n\n+   -   If `Values` is empty,\
    \ the strings contained in the `Items` property are stored in the underlying dataset.\n\
    +   \n+   -   If `Values` is not empty, it should contain the same number of string\
    \ values as the `Items` property. When an item is selected in the radio group,\
    \ the corresponding value in the `Values` property is stored in the dataset.\n\
    \nUsing the second rule, you can store a sequential list of numbers in the `Values`\
    \ property and connect the component to an `Integer` field. Delphi is then smart\
    \ enough to store the numeric representation of the selected item in a dataset.\
    \ In my applications, this is often a severe limitation, so I've created a descendent\
    \ component named TETHComboBox that supports assigning a value to each string\
    \ contained in the `Items` property.\n\n![](img/fe651f295b5f960d5463c4fb581d2281_225_0.png)\n\
    \n**Figure 5.2**\nRelationship between TDBRadioGroup's Items and Values properties.\n\
    \n# ## TDBComboBox\n\nTDBComboBox works similarly to TDBRadioGroup because it\
    \ enables the user to select an item from a list and store it in a dataset. Unfortunately,\
    \ it doesn't support the `Values` property, so you can't use it to store the index\
    \ of the selected item in a dataset. In my applications, this is often a severe\
    \ limitation, so I've created a descendent component named TETHComboBox that supports\
    \ assigning a value to each string contained in the `Items` property."
  merge: -1
  img_proc: true
