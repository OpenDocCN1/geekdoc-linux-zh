- pgno: 100
  md: 'When the schema type is known, it is a simple matter to make the appropriate
    call to setSchemaInfo, open the dataset, and load the list view with the schema
    information. Certain columns (namely TABLE_TYPE, PROC_TYPE, COLUMN_TYPE, COLUMN_DATATYPE,
    COLUMN_SUBTYPE, and INDEX_TYPE) are bitmapped numeric columns. The program makes
    calls to a handful of helper routines to display a textual representation of these
    values. The rest of the columns are displayed as is.


    You will notice when you run this application that different schema types return
    different data fields. Tables 2.3–2.7 explain the columns that are returned for
    each of the schema types.


    Table 2.3 lists the columns that are returned for a schema type of stTables or
    stSystemTables.


    | **TABLE 2.3** | stTables and stSystemTables Schema Columns |  |

    |---|---|---|

    | Column | Description |  |

    | RECNO | The absolute record number. It is one for the first record, two for
    the second, and so on. |  |

    | CATALOG_NAME | The name of the catalog, or database, that contains the table.
    |  |

    | SCHEMA_NAME | The owner of the table. |  |

    | TABLE_NAME | The table name. |  |

    | TABLE_TYPE | A bitmapped value that represents the type of table. See Listing
    2.4, or the source code for DBXPress.pas, for an explanation of the possible values
    for this field. |  |


    Table 2.4 lists the columns that are returned for a schema type of stProcedures.


    | **TABLE 2.4** | stProcedures Schema Columns |  |

    |---|---|---|

    | Column | Description |  |

    | RECNO | The absolute record number. It is one for the first record, two for
    the second, and so on. |  |

    | CATALOG_NAME | The name of the catalog, or database, that contains the stored
    procedure. |  |

    | SCHEMA_NAME | The owner of the stored procedure. |  |

    | PROC_NAME | The name of the stored procedure. |  |

    | PROC_TYPE | A bitmapped value that represents the type of stored procedure.
    See Listing 2.4, or the source code for DBXPress.pas, for an explanation of the
    possible values for this field. |  |

    | IN_PARAMS | The number of input parameters to the stored procedure. |  |

    | OUT_PARAMS | The number of output parameters from the stored procedure. |  |'
  merge: -1
  img_proc: true
