- pgno: 160
  md: 'The preceding chapter introduced you to TClientDataSet and discussed much of
    its basic functionality in detail. In this chapter, I’ll explore a number of more
    advanced client dataset capabilities, including:


    +   Dataset Events

    +   Disabling Data-Aware Components

    +   BLOBs

    +   Nested Datasets

    +   Undo Support

    +   Cloning Data from Another Client Dataset

    +   Maintained Aggregates

    +   Miscellaneous Properties


    # ## Dataset Events


    Client datasets support a large number of events. Some of these events are useful
    in single-tier applications (such as the ones we’re developing in this chapter),
    and some are only useful in multitier applications (which we’ll be developing
    in future chapters).


    This chapter discusses dataset events that are useful in all applications, including
    single-tier and multitier. Broadly speaking, these events fall into three categories:
    Beforexxx notification events, Afterxxx notification events, and other events.
    Beforexxx and Afterxxx notification events are fired by Delphi before and after
    interesting activities occur. For purposes of this discussion, interesting refers
    to normal, everyday activities that the dataset performs—activities for which
    you want to receive notification when they occur.


    An example will help to clarify that last statement: Say that you want to verify
    all deletions from a dataset. One way to do this is to display a confirmation
    message to the user at every point in the program where you allow a deletion to
    take place. This method has three drawbacks, however:


    +   It is repetitive.

    +   It is prone to error. If you change the confirmation message in one location
    in your code, you can easily forget to change the message in other locations.
    You might also forget to implement the confirmation altogether.

    +   It doesn’t work in cases where VCL/CLX implicitly deletes a record. If you
    press Ctrl+Delete while in a data-aware grid, VCL/CLX handles the deletion for
    you with no coding on your part.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'A better way to code for this situation is to handle the `BeforeDelete` event
    and display a message there asking the user if he is sure he wants to delete the
    record. As with most `BeforeXxx` event handlers, raising an exception (usually
    `Abort`) inside the event handler prevents the operation from taking place.


    Later in this section, I’ll present a sample application that illustrates this
    technique. Table 4.1 lists the client dataset’s `BeforeXxx` events and their uses.


    | Event | Description |

    | --- | --- |

    | **BeforeCancel** | Triggered by the `Cancel` method just before the edits to
    the current record are canceled. You might take advantage of this event to confirm
    that the user does indeed want to cancel any changes that he has made. |

    | **BeforeClose** | Called immediately before the dataset is closed. |

    | **BeforeDelete** | Called just before the current record in the dataset is deleted.
    This is a good place to confirm that the user really wants to delete the record.
    |

    | **BeforeEdit** | Triggered by the `Edit` method immediately before the dataset
    is put into edit mode. You could use this event as a handy place to restrict editing
    (by raising an `Abort` exception). |

    | **BeforeInsert** | Triggered by the `Append` and `Insert` methods immediately
    before the dataset is put into insert mode. You could use this event as a way
    to restrict editing (by raising an `Abort` exception). |

    | **BeforeOpen** | Called just before the dataset is opened. |

    | **BeforePost** | Occurs just before the data in a newly inserted or edited record
    is posted to the dataset. This is a good place to perform validation on the data.
    |

    | **BeforeScroll** | Triggered just before the dataset moves to a new record.
    This occurs when the dataset is opened during a `First`, `Next`, `Prior`, or `Last`
    operation; during searches; and when a range or filter is applied to the dataset.
    |


    In contrast to the `BeforeXxx` event handlers, which are triggered before an event
    actually occurs (and therefore enable you to prevent the event from occurring),
    `AfterXxx` event handlers are triggered after the event has occurred to let you
    know that the operation in question has occurred successfully. Table 4.2 lists
    the `AfterXxx` event handlers, which mirror the `BeforeXxx` event handlers.


    # 4 ADVANCED CLIENT DATASET OPERATIONS'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# **TABLE 4.2** Client Dataset AfterXxx Events


    | Event | Description |

    | :--- | :--- |

    | AfterCancel | Triggered after a Cancel method completes. |

    | AfterClose | Occurs just after the dataset is closed. |

    | AfterDelete | Triggered immediately after a record in the dataset is deleted.
    |

    | AfterEdit | Called after the dataset is put into edit mode as a result of an
    Edit method call. |

    | AfterInsert | Called after the dataset is put into insert mode as a result of
    an Insert or Append method call. |

    | AfterOpen | Occurs just after the dataset is opened. |

    | AfterPost | Triggered after a record is successfully posted to the dataset.
    |

    | AfterScroll | Triggered just after the dataset moves to a new record. This occurs
    when the dataset is opened during a First, Next, Prior, or Last operation; during
    searches; and when a range or filter is applied to the dataset. |


    Table 4.3 lists the client dataset’s other notable event handlers.


    # **TABLE 4.3** Other Event Handlers


    | Event | Description |

    | :--- | :--- |

    | OnCalcFields | As discussed in Chapter 6, “Data-Aware Grids,” this event is
    used to provide values for calculated fields. |

    | OnDeleteError | Fired if there is an error when deleting a record from the dataset
    (for example, if the dataset is read-only). |

    | OnEditError | Fired if there is an error when putting the dataset into edit
    mode (for example, if the dataset is read-only). |

    | OnFilterRecord | As discussed in Chapter 6, this event is called to enable the
    user to provide advanced filtering on a dataset. |

    | OnNewRecord | Triggered whenever a new record is created, but before it is edited
    or posted to the dataset. This is a good place to set default values for the record.
    Inside this event handler, the dataset is already in insert mode, so you shouldn’t
    call TClientDataSet.Insert from within this event handler. |

    | OnPostError | Fired if an error occurs when attempting to post a record to the
    dataset (such as a key conflict). |'
  merge: -1
  img_proc: true
