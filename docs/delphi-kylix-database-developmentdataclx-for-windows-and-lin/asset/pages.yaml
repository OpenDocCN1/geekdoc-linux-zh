- pgno: 26
  md: "# CAUTION\n\nYou should not set KeepConnection to False in cases where the\
    \ connection takes a long time to establish, or in applications where you frequently\
    \ open and close datasets. Repeated connecting to and disconnecting from a database\
    \ (especially in situations where it takes a long time to connect) can severely\
    \ impact program performance.\n\n# Connect and Disconnect Events\n\nTSQLConnection\
    \ surfaces a handful of events that fire at opportune times during the connect/disconnect\
    \ process. The events and their usage are listed in Table 1.3.\n\nTABLE 1.3 TSQLConnection\
    \ Events\n\nAfterConnect\nFires after the database connection has been successfully\
    \ established.\n\nAfterDisconnect\nFires after the database connection has been\
    \ dropped.\n\nBeforeConnect\nFires immediately before the connection to the database\
    \ is attempted. You can raise an exception in this event handler to prevent the\
    \ connection from being established.\n\nBeforeDisconnect\nFires immediately before\
    \ the database connection is dropped. You can raise an exception in this event\
    \ handler to prevent the connection from being dropped.\n\nOnLogin\nFires before\
    \ the connection is made so that you can provide a username and password at runtime.\n\
    \nListing 1.1 contains the source code for an application that demonstrates when,\
    \ and under what circumstances, these events fire. It also shows how you can prevent\
    \ the user from connecting to or disconnecting from the database.\n\n# LISTING\
    \ 1.1 Events—MainForm.pas\n\n```\n```pascal\nunit MainForm;\n\ninterface\n\nuses\n\
    \  SysUtils, Classes, QGraphics, QControls, QForms, QDialogs, DBXpress,\n  ExtCtrls,\
    \ DB, SqlExpr, QtStdCtrls, QExtCtrls;\n```\n```"
  merge: -1
