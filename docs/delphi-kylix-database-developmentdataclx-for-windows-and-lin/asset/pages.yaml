    \ to that stream. Next, it writes the stream out to the ini file. With minor modifications,\
    \ you could change this code to use the Windows registry instead of an ini file.\n\
    \nSimilarly, the following procedure loads the column information back from the\
    \ ini file:\n\n```\nprocedure LoadColumnConfiguration(const FileName: string;\
    \ Grid: TDBGrid;\nconst SectionName: string; const Name: string);\nvar\n    ini:\
    \ TIniFile;\n    MemStream: TMemoryStream;\nbegin\n    MemStream := TMemoryStream.Create;\n\
    \    try\n        ini := TIniFile.Create(FileName);\n        try\n           \
    \ ini.ReadBinaryStream(SectionName, Name, MemStream);\n            if MemStream.Size\
    \ > 0 then\n                Grid.Columns.LoadFromStream(MemStream);\n        finally\n\
    \            ini.Free;\n        end;\n    finally\n        MemStream.Free;\n \
    \   end;\nend;\n```\n\n# Limitations\n\nFor all its power, TDBGrid does have some\
    \ limitations. The most notable one is that it doesn’t display memos or images.\
    \ You can draw images or memos manually using the custom drawing features of the\
    \ grid, but because each grid row is the same height, this can lead to difficulties\
    \ when one memo is three lines long and another is thirty lines long.\n\nThis\
    \ limitation (as well as others) is removed by many of the third-party grids available.\
    \ At the end of this chapter, there is a quick overview of some of the third-party\
    \ grids that you might want to look into.\n\n# TClientDataSetGrid\n\nTClientDataSetGrid\
    \ is a TDBGrid descendent written by John Kaster. It takes advantage of some of\
    \ the functionality of client datasets to provide automatic sorting of the grid\
    \ when the user clicks a column title.\n\nIn addition, TClientDataSetGrid can\
    \ automatically persist column information to and from a separate configuration\
    \ file. It doesn’t support saving and loading column information to and"
