    # Undo Support


    TClientDataSet and its descendants support built-in undo functionality, so you
    can provide for what-if scenarios in your application. For instance, you can enable
    the user to change the values of certain fields in the dataset (perhaps graphing,
    or otherwise displaying, an'
  merge: -1
  img_proc: true
- pgno: 189
  md: "analysis of the data). If the user doesn’t like the results, he can revert\
    \ to the previous data by undoing his changes, either one at a time or in large\
    \ chunks.\n\n# Cancel\n\nYou are probably already familiar with the Cancel method,\
    \ but I’ll mention it here anyway for completeness.\n\nThe lowest level of undo\
    \ support is simply discarding changes to the current record before they have\
    \ been posted. The Cancel method provides this support:\n\n```\nClientDataSet1.Edit;\n\
    ClientDataSet1.FieldByName('Last').AsString := 'Carter';\n```\n\n  // Do more\
    \ stuff here, and then decide not to save changes after all.\nClientDataSet1.Cancel;\n\
    \n# The Change Log\n\nTo support more advanced undo operations, client datasets\
    \ incorporate a change log. The change log is used to remember each change that’s\
    \ made to the dataset until the changes are either merged into the data, undone,\
    \ or canceled. The following sections examine the different methods used to commit\
    \ and roll back changes.\n\nThe change log is saved with the data when you call\
    \ ToFile or SaveToStream. When the dataset is read back in from the file or stream,\
    \ the change log is in the same state that it was prior to the save. This means\
    \ that you can even perform undo operations between invocations of your application.\n\
    \n# LogChanges\n\nIn order for the change log to be active, the dataset’s LogChanges\
    \ property must be set to True (which is the default). If you don’t intend to\
    \ provide undo support in your application, you can set LogChanges to False, slightly\
    \ reducing memory requirements and increasing performance.\n\n> CAUTION\n> When\
    \ creating applications that connect a client dataset to a dataset provider (as\
    \ discussed in Chapter 7, “Dataset Providers”), you should not set LogChanges\
    \ to False. This is because setting LogChanges to False prevents you from making\
    \ changes to the client dataset and applying those changes to the underlying database.\n\
    \n4\nADVANCED CLIENT DATASET OPERATIONS"
