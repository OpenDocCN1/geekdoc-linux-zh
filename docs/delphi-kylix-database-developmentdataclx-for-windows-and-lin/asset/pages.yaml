- pgno: 214
  md: 'The preceding two chapters concentrated on client datasets, Delphi''s flexible
    in-memory datasets. This chapter introduces the concept of data-aware components,
    which are ready-made components that know how to display and edit information
    stored in a database.


    Data-aware components can be used with differing datasets, including BDE, ADO,
    IBX, and third-party datasets. However, this chapter shows how to use them with
    client datasets because that is how they are used when dbExpress is the underlying
    data access technology.


    # What Are Data-Aware Components?


    Data-aware components are components that can automatically load and store information
    from and to a dataset. For example, consider a standard edit control. It has a
    Text property, which the programmer is responsible for reading from and writing
    to. Where you obtain the data, and what you do with the new string after the user
    enters it in the edit control, is entirely up to you. You might store it in a
    dataset. You might store it in an INI file or in the Windows registry. You might
    even simply use it to perform some sort of calculation, and never store it anywhere
    at all.


    Because displaying data obtained from a dataset is such a common application requirement,
    Delphi provides a set of data-aware components that mirror the standard components.
    Table 5.1 lists the data-aware components, along with their standard counterparts.


    TABLE 5.1 Delphi Data-Aware Components and Their Non-Data-Aware Equivalents

    | Data-Aware Component | Non-Data-Aware Equivalent |

    | -------------------- | ------------------------- |

    | TDBText            | TLabel                  |

    | TDBEdit            | TEdit                   |

    | TDBMemo            | TMemo                   |

    | TDBCheckBox        | TCheckBox               |

    | TDBRadioGroup      | TRadioGroup             |

    | TDBComboBox        | TComboBox               |

    | TDBListBox         | TListBox                |

    | TDBLookupComboBox  | TComboBox               |

    | TDBLookupListBox   | TListBox                |

    | TDBImage           | TImage                  |

    | TDBGrid            | TStringGrid             |

    | TDBRichEdit        | TRichEdit (VCL-only component) |

    | TDBCtrlGrid        | None. Allows for the display of multiple fields in a format
    that is not row oriented (VCL-only component). |'
