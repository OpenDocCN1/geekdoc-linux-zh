  md: "# ## NOTE\n\n> Because the code for **TClientDataSetGrid** is freely available,\
    \ I hope to see some enterprising Delphi programmers providing enhancements to\
    \ it in the future. My personal wish list includes\n\n+   - Saving and loading\
    \ column configuration to and from an ini file and the Windows registry.\n+  \
    \ - Enhancing the **Configure Columns** dialog to support column reordering in\
    \ addition to hiding or showing columns.\n+   - Enhancing the **Configure Columns**\
    \ dialog to support locking individual columns so that they cannot be hidden or\
    \ moved.\n+   - Adding support for an **OnColumnSized** event.\n\n# # TDBCtrlGrid\n\
    \nI’m not going to spend a lot of time on **TDBCtrlGrid** because it isn’t CLX-compatible,\
    \ and because there isn’t any new development going on in terms of **TDBCtrlGrid**.\n\
    \n**TDBCtrlGrid** is a grid-like component, although it relies on other data-aware\
    \ components to perform the actual data input and output. To use a **TDBCtrlGrid**\
    \ in your application, drop it on a form and connect the **DataSource** property\
    \ to your data source. Then, populate the grid with other data-aware components,\
    \ such as **TDBEdit**, **TDBCheckBox**, and so on.\n\n**TDBCtrlGrid** replicates\
    \ these components at runtime, displaying each component for every record displayed\
    \ in the grid. Every cell in the grid corresponds to a single record in the dataset.\n\
    \nMost data-aware controls are replicable (that is, they can be used in a **TDBCtrlGrid**).\
    \ Some are not (including the **TETHDBDateTimePicker** component that I created\
    \ in the preceding chapter). In order for the control to be replicable, it must\
    \ include the **csReplicable** option in its **ControlStyle** property (typically\
    \ set in the component’s constructor). The following is a snippet from **TDBEdit**’s\
    \ constructor:\n\n```\n``` \nconstructor TDBEdit.Create(AOwner: TComponent);\n\
    begin\n   inherited Create(AOwner);\n   inherited ReadOnly := True;\n   ControlStyle\
    \ := ControlStyle + [csReplicable];\n   ...\nend;\n``` \n```\n\nThe following\
    \ sections discuss the properties and events that **TDBCtrlGrid** introduces."
