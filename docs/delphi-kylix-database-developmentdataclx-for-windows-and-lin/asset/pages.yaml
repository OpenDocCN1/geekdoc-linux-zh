- pgno: 388
  md: "This appendix tells you what you need to know to redistribute your database\
    \ applications after you've written them. Because this book assumes that you're\
    \ using dbExpress as the data access technology behind your applications, I won’t\
    \ explain how to redistribute the BDE or ADO. Instead, I'll concentrate specifically\
    \ on dbExpress and DataSnap.\n\n# ## Redistributable Files\n\nRedistributing an\
    \ application built with dbExpress and DataSnap is incredibly simple—especially\
    \ so if you're used to messing around with a huge BDE- or ADO-based installation\
    \ set. To support dbExpress and DataSnap, you need to redistribute only two files\
    \ along with your application.\n\n> **NOTE**\n> \n> Well, that's two files in\
    \ addition to whatever else your application might need. For example, if you build\
    \ your application with runtime packages enabled, you will also need to redistribute\
    \ the required runtime packages for the application.\n\n# ## Redistributing a\
    \ Windows Application\n\nFor a VCL or CLX application running under Microsoft\
    \ Windows, you need to redistribute the driver for the database back end that\
    \ your application uses. The database engines and their associated Windows drivers\
    \ are listed in Table A.1.\n\n**TABLE A.1** dbExpress Windows Drivers\n\n| Database\
    \ | Windows Driver |\n| :--- | :--- |\n| InterBase | Dbexpint.dll |\n| Oracle\
    \ | Dbexpora.dll |\n| DB2 | Dbexpdb2.dll |\n| MySQL | Dbexppmys.dll |\n\nIn addition\
    \ to the dbExpress driver, you need to redistribute MIDAS.DLL, which contains\
    \ the code necessary for the client dataset technology.\n\nYou can place both\
    \ the dbExpress driver and MIDAS.DLL anywhere where your application can find\
    \ them, which could be either the application directory or the **SYSTEM32** directory.\
    \ Neither file needs to be registered with Windows."
  merge: -1
  img_proc: true
- pgno: 389
  md: "If you prefer, you can statically link DataSnap into your client application\
    \ by including MIDASLib to your project’s uses clause and rebuilding. If you do\
    \ this, you don’t need to redistribute MIDAS.DLL with the client application (it\
    \ must be redistributed with the server application, however).\n\nYou can also\
    \ statically link the dbExpress drivers with your application by linking in the\
    \ appropriate file(s), as listed in Table A.2.\n\n| Database | Unit |\n| :---\
    \ | :--- |\n| InterBase | Dbexpint |\n| Oracle | Dbexpora |\n| DB2 | dbexpdb2\
    \ |\n| MySQL | Dbexpmy |\n\n> **Note**\n> \n> Even though Delphi 6 supports statically\
    \ linking dbExpress and/or DataSnap to your application, you should be aware that\
    \ the static linking is a new technology that isn’t completely compatible with\
    \ all DataSnap code. For example, attempting to call TClientDataSet.SaveToFile\
    \ to save a client dataset to an XML file doesn’t save to the same format when\
    \ statically linking as when dynamically linking. The bottom line is, if you decide\
    \ to statically link your application, please test thoroughly before releasing\
    \ to your clients.\n\n# ## Redistributing a Linux Application\n\nFor a CLX application\
    \ running under Linux, you need to redistribute the appropriate Linux dbExpress\
    \ driver. Table A.3 lists the database engines currently supported by dbExpress\
    \ and the associated Linux driver.\n\n| Database | Linux Driver |\n| :--- | :---\
    \ |\n| InterBase | libsql.so |\n| Oracle | libsqlor.so |\n| DB2 | libsqlbd2.so\
    \ |\n| MySQL | libsqlmy.so |"
  merge: -1
  img_proc: true
- pgno: 390
  md: 'In addition to the dbXpress driver, you need to redistribute LIBMIDAS.SO. The
    redistributable files should be placed in `/home/<usrname>/delphidir/bin`.


    # Licensing Issues


    If you’re writing database applications that work with local data (that is, data
    does not travel from one machine to another), you don’t need to worry about any
    licensing fees for your applications. However, if data packets travel from one
    machine to another, you will need to pay a small redistribution fee to Borland
    for use of the DataSnap technology.


    For the particulars about when you need to pay the redistribution fees and how
    much they are, visit Borland’s Web site at `http://www.borland.com/midas`.


    # CD-ROM-Based Applications


    A common requirement of many database applications is that they need to be able
    to access a (read-only) database on a CD. These applications, such as phone lists,
    parts databases, and so on, are often redistributed with a large database on CD.
    The end user doesn’t need to update the data—the user needs only to access the
    data from the CD.


    To redistribute a read-only InterBase database on CD, you need to first run the
    `gfix` command against the database, like this:


    ```

    gfix -read-only mydata.gdb

    ```


    This marks the database as read-only.


    In your application, you should set the `poReadOnly` option for all dataset providers
    and set `ReadOnly` to `True` for any `TClientDataSets`. This will ensure that
    none of the database-related components attempt to update any data in the database.'
  merge: -1
  img_proc: true
