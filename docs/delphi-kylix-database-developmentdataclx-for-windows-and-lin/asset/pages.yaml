  md: 'The BLOBs application enables you to store a note, an image, and a file attachment
    in a single record. The notes are stored by using a **TDBMemo** component.


    I elected to create a separate image type field, which I called **ImageType**,
    to track the type of image stored in the **Image** field. If **ImageType** is
    blank, the image is assumed to be **NULL**. Notice the way that the image is displayed—The
    program handles the data source’s **DataChange** event. If the **Field** parameter
    sent to the event is **nil** (or if it references the **Image** field), the **Image**
    component loads the picture from the **Image** field using one method for **BMP**
    files and another method for **JPG** files. Of course, a real application would
    recognize more image types than just the two.


    Also note the parallet between the code used to load an image and the code used
    to load an attachment. Any file can be loaded into a BLOB field through the field’s
    **LoadFromFile** method, and can be saved back to disk through the field’s **SaveToFile**
    method.


    The BLOBs application doesn’t save the data to disk (although it could do so by
    adding a **SaveToFile** method in the code), and it is rather useless. However,
    it serves to illustrate the correct way (or one of the correct ways, in the case
    of images) to use BLOB fields in your programs.


    Figure 4.3 shows this application at runtime.


    ![](img/fe651f295b5f960d5463c4fb581d2281_184_0.png)


    # FIGURE 4.3


    > *Notes and images are a part of many modern applications.*


    # ## Nested Datasets


    Nested datasets are **TClientDataSet**’s answer to master/detail relationships.
    Nested datasets physically *nest* the detail dataset inside the master dataset
    as a field. Figure 4.4 illustrates this concept.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '![](img/fe651f295b5f960d5463c4fb581d2281_185_0.png)


    # FIGURE 4.4


    > The Orders dataset is nested inside the Customers dataset.


    Datasets can be nested more than one level deep, so you can set up a grandparent/parent/child
    relationship between three datasets. You can also create a parent with multiple
    children, or a mixture of both (where one master contains three details and each
    of those contains two details).


    When you save a nested dataset to a file or stream, the entire hierarchy is saved
    in a single file or stream. To save a nested dataset, call `SaveToFile` or `SaveToStream`
    on the master dataset, and all nested datasets are saved automatically. `LoadFromFile`
    and `LoadFromStream` reload all the data and re-establish the master/detail relationships.


    To create a nested dataset at design time, first create a dataset in the usual
    manner. Then, add a field to it, giving it a type of `DataSet`. This completes
    the master dataset.


    To create the detail dataset, drop a second `TClientDataSet` on the form or data
    module. Create the fields that make up the detail dataset.


    The only remaining piece of business is to link them together. To do this, click
    the detail dataset and set the `DataSetField` property to the name of the `DataSet`
    field that you created on the master. That’s all there is to it.


    At this point, you can connect data sources and data-aware components to either
    dataset. As you scroll through the master dataset, the detail dataset is automatically
    updated to reflect only the detail records that are associated with the current
    master record.


    The following example application shows how to correctly set up nested datasets
    in an application. It contains customer and order datasets, where one customer
    can place many orders. Two data-aware grids enable you to scroll through the customers
    and view the orders for each one.'
  merge: -1
  img_proc: true
