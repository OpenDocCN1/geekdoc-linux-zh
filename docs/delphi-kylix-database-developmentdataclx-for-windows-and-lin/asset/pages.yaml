- pgno: 74
  md: 'You can also create parameterized queries, as the following code snippetteillustrates:


    ```

    ```SQLQuery1.SQLConnection := conn; SQLQuery1.SQL.Text := ''SELECT * FROM CONTACTS
    WHERE COUNTRY = :TheCountry; SQLQuery1.ParamByName(''TheCountry'').Value := ''United
    States''; SQLQuery1.Open;```


    ```


    Parameterized queries are discussed in more detail later in the section titled
    “Parameterized Queries.”


    # Stored Procedure Access


    When you want to execute a stored procedure on the server, you can use the TSQLStoredProc
    component, as shown in the following code snippet:


    ```

    ```SQLStoredProc1.StoredProcName := ''ContactsByState''; SQLStoredProc1.ParamByName(''ASTATE'').Value
    := ''FL''; SQLStoredProc1.Open;```


    ```


    Again, if the underlying stored procedure accepts one or more parameters, you
    should use the ParamByName method to set the parameters before executing the query.


    # General-Purpose Data Access


    As the preceding sections show, there are several different components that you
    can use for dbExpress data access (depending on whether you’re accessing a table,
    query, or stored procedure). However, there is a single, multipurpose component
    that provides all the functionality of the three separate components: TSQLDataSet.


    You should use TSQLDataSet in all new code that you write, and in my opinion,
    you should also use it when converting existing applications. Borland provides
    the separate, special-purpose components to more easily convert a BDE application
    to a dbExpress application. However, there is very little additional work required
    to convert to the general-purpose TSQLDataSet component.


    The following code snippet shows how to use TSQLDataSet to access a table:


    ```

    ```SQLDataSet1.SQLConnection := conn; SQLDataSet1.CommandType := ctTable; SQLDataSet1.CommandText
    := ''CONTACTS''; SQLDataSet1.IndexName := ''IX_CONNAMES''; SQLDataSet1.Open;```


    ```


    As you can see, it’s almost identical to the code required for TSQLTable. There
    is one additional line, to tell the dataset that it’s accessing a table, as opposed
    to a query or stored procedure.'
