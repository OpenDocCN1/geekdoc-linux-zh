    This code snippet only changes the way the Salary column is drawn. If the salary
    is greater than $50,000, the background of the cell is drawn in yellow. If the
    cell is focused, the salary is drawn in red.


    For all other cells, and for salaries that are less than or equal to $50,000,
    the cell is drawn normally. The call to DefaultDrawColumnCell takes care of drawing
    the cell after the appropriate changes (if any) are made to the brush and font
    colors.


    The way that Delphi’s internal VCL/CLX painting code works, all you need to do
    in this handler is to set the canvas’ Brush and Font properties so that they reflect
    the color and font that you want to use when painting the cell. The call to DefaultDrawColumnCell
    then uses the settings that you specified when drawing the cell contents.


    ![](img/fe651f295b5f960d5463c4fb581d2281_266_0.png)


    Notice, in the preceding code snippet, that I checked the FieldName property of
    the column to see if the code is drawing the Salary column. You might be tempted
    to use the DataCol parameter to check for this. However, DataCol is the zero-based
    absolute index of the cell being drawn. If the user reorders the columns at runtime,
    this value changes.


