- pgno: 114
  md: "# ## Adding Fields to a Client Dataset\n\nTo add fields to a client dataset\
    \ at runtime, you use the client dataset's `FieldDefs` property.  \n`FieldDefs`\
    \ supports two methods for adding fields: `AddFieldDef` and `Add`.\n\n# ### **AddFieldDef**\n\
    \n`TFieldDefs.AddFieldDef` is defined like this:\n\n```\n```\nfunction AddFieldDef:\
    \ TFieldDef;\n```\n```\n\nAs you can see, `AddFieldDef` takes no parameters and\
    \ returns a `TFieldDef` object. When you have the `TFieldDef` object, you can\
    \ set its properties, as the following code snippet shows.\n\n```\n```\nvar\n\
    \  FieldDef: TFieldDef;\nbegin\n  FieldDef := ClientDataSet1.FieldDefs.AddFieldDef;\n\
    \  FieldDef.Name := 'Name';\n  FieldDef.DataType := ftString;\n  FieldDef.Size\
    \ := 20;\n  FieldDef.Required := True;\nend;\n```\n```\n\n# ### **Add**\n\nA quicker\
    \ way to add fields to a client dataset is to use the `TFieldDefs.Add` method,\
    \ which is defined like this:\n\n```\n```\nprocedure Add(const Name: string; DataType:\
    \ TFieldType; Size: Integer = 0;\n  Required: Boolean = False);\n```\n```\n\n\
    The `Add` method takes the field name, the data type, the size (for string fields),\
    \ and a flag indicating whether the field is required as parameters. By using\
    \ `Add`, the preceding code snippet becomes the following single line of code:\n\
    \n```\n```\nClientDataSet1.FieldDefs.Add('Name', ftString, 20, True);\n```\n```\n\
    \nWhy would you ever want to use `AddFieldDef` when you could use `Add`? One reason\
    \ is that `TFieldDef` contains several more advanced properties (such as field\
    \ precision, whether or not it's read-only, and a few other attributes) in addition\
    \ to the four supported by `Add`. If you want to set these properties for a field,\
    \ you need to go through the `TFieldDef`. You should refer to the Delphi documentation\
    \ for `TFieldDef` for more details.\n\n# ## Creating the Dataset\n\nAfter you\
    \ create the field definitions, you need to create the empty dataset in memory.\
    \ To do this, call `TClientDataSet.CreateDataSet`, like this:\n\n```\n```\nClientDataSet1.CreateDataSet;\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: 'As you can see, it''s somewhat easier to create your client datasets at design-time
    than it is at runtime. However, if you commonly create temporary in-memory datasets,
    or if you need to create a client dataset in a formless unit, you can create the
    dataset at runtime with a minimal amount of fuss.


    # Accessing Fields


    Regardless of how you create the client dataset, at some point you need to access
    field information—whether it''s for display, to calculate some values, or to add
    or modify a new record. There are several ways to access field information in
    Delphi. The easiest is to use persistent fields.


    # Persistent Fields


    Earlier in this chapter, when we used the field editor to create fields, we were
    also creating persistent field objects for those fields. For example, when we
    added the LastName field, Delphi created a persistent field object named cdsEmployeeLastName.


    When you know the name of the field object, you can easily retrieve the contents
    of the field by using the Asxxx family of methods. For example, to access a field
    as a string, you would reference the AString property, like this:


    ```

    ShowMessage(''The employee''''s last name is '' +

    cdsEmployeeLastName.AString);

    ```


    To retrieve the employee''s salary as a floating-point number, you would reference
    the AsFloat property:


    ```

    Bonus := cdsEmployeeSalary.AsFloat * 0.05;

    ```


    See the VCL/CLX source code and the Delphi documentation for a list of available
    access properties.


    # NOTE


    You are not limited to accessing a field value in its native format. For example,
    just because Salary is a currency field doesn''t mean you can''t attempt to access
    it as a string. The following code displays an employee''s salary as a formatted
    currency:


    ```

    ShowMessage(''Your salary is '' + cdsEmployeeSalary.AString);

    ```


    You could access a string field as an integer, for example, if you knew that the
    field contained an integer value. However, if you try to access a field as an
    integer (or other data type) and the field doesn''t contain a value that''s compatible
    with that data type, Delphi raises an exception.'
  merge: -1
  img_proc: true
- pgno: 116
  md: "# # Nonpersistent Fields\n\nIf you create a dataset at design-time, you probably\
    \ won’t have any persistent field objects. In that case, there are a few methods\
    \ you can use to access a field’s value.\n\nThe first is the `FieldName` method.\
    \ `FieldName` takes the field name as a parameter and returns a temporary field\
    \ object. The following code snippet displays an employee’s last name using `FieldName`:\n\
    \n```\n```delphi\nShowMessage('The employee''s last name is ' +\n  ClientDataSet1.FieldName('LastName').AsString);\n\
    ```\n```\n\n> **CAUTION**\n> \n> If you call `FieldName` with a nonexistant field\
    \ name, Delphi raises an exception.\n\nAnother way to access the fields in a dataset\
    \ is through the `Field` method, like this:\n\n```\n```delphi\nif ClientDataSet1.FindField('LastName')\
    \ <> nil then\n  ShowMessage('Dataset contains a LastName field');\n```\n```\n\
    \nUsing this technique, you can create persistent fields for datasets created\
    \ at runtime.\n\n```\n```delphi\nvar\n  fldLastName: TField;\n  fldFirstName:\
    \ TField;\nbegin\n  ..\n  fldLastName := cds.FindField('LastName');\n  fldFirstName\
    \ := cds.FindField('FirstName');\n  ..\n  ShowMessage('The last name is ' + fldLastName.AsString);\n\
    end;\n```\n```\n\nFinally, you can access the dataset’s `Fields` property. `Fields`\
    \ contains a list of `TField` objects for the dataset, as the following code illustrates:\n\
    \n```\n```delphi\nvar\n  Index: Integer;\nbegin\n  for Index := 0 to ClientDataSet1.Fields.Count\
    \ - 1 do\n    ShowMessage(ClientDataSet1.Fields[Index].AsString);\nend;\n```\n\
    ```\n\nYou do not normally access `Fields` directly. It is generally not safe\
    \ programming practice to assume, for example, that a given field is the first\
    \ field in the `Fields` list. However, there are"
  merge: -1
  img_proc: true
- pgno: 117
  md: "times when the Fields list comes in handy. For example, if you have two client\
    \ datasets with the same structure, you could add a record from one dataset to\
    \ the other using the following code:\n\n```\n```\nvar\n    Index: Integer;\n\
    begin\n    ClientDataSet2.Append;\n    for Index := 0 to ClientDataSet1.Fields.Count\
    \ - 1 do\n        ClientDataSet2.Fields[Index].AsVariant :=\n            ClientDataSet1.Fields[Index].AsVariant;\n\
    \    ClientDataSet2.Post;\nend;\n```\n```\n\nThe following section discusses adding\
    \ records to a dataset in detail.\n\n# # Populating and Manipulating Client Datasets\n\
    \nAfter you create a client dataset (either at design-time or at runtime), you\
    \ want to populate it with data. There are several ways to populate a client dataset:\
    \ You can populate it manually through code, you can load the dataset’s records\
    \ from another dataset, or you can load the dataset from a file or a stream. The\
    \ following sections discuss these methods, as well as how to modify and delete\
    \ records.\n\n# ## Populating Manually\n\nThe most basic way to enter data into\
    \ a client dataset is through the Append and Insert methods, which are supported\
    \ by all datasets. The difference between them is that Append adds the new record\
    \ at the end of the dataset, but Insert places the new record immediately before\
    \ the current record.\n\nI always use Append to insert new records because it’s\
    \ slightly faster than Insert. If the dataset is indexed, the new record is automatically\
    \ sorted in the correct order anyway.\n\nThe following code snippet shows how\
    \ to add a record to a client dataset:\n\n```\n```\ncdsEmployee.Append; // You\
    \ could use cdsEmployee.Insert; here as well\ncdsEmployee.FieldName('ID').AsInteger\
    \ := 5;\ncdsEmployee.FieldName('FirstName').AsString := 'Eric';\ncdsEmployee.Post;\n\
    ```\n```\n\n# ## Modifying Records\n\nModifying an existing record is almost identical\
    \ to adding a new record. Rather than calling Append or Insert to create the new\
    \ record, you call Edit to put the dataset into edit mode. The following code\
    \ changes the first name of the current record to Fred."
  merge: -1
  img_proc: true
- pgno: 118
  md: '```

    cdsEmployee.Edit; // Edit the current record

    cdsEmployee.FieldName(''FirstName'').AsString := ''Fred'';

    cdsEmployee.Post;

    ```


    # ## Deleting Records


    To delete the current record, simply call the `Delete` method, like this:


    ```

    cdsEmployee.Delete;

    ```


    If you want to delete all records in the dataset, you can use `EmptyDataSet` instead,
    like this:


    ```

    cdsEmployee.EmptyDataSet;

    ```


    # ## Populating from Another Dataset


    dbExpress datasets are unidirectional and you can''t scroll backward through them.
    This makes them incompatible with bidirectional, data-aware controls such as `TDBGrid`.
    However, `TClientDataSet` can load its data from another dataset (including dbExpress
    datasets, BDE datasets, or other client datasets) through a *provider*. Using
    this feature, you can load a client dataset from a unidirectional dbExpress dataset,
    and then connect a `TDBGrid` to the client dataset, providing bidirectional support.


    Indeed, this capability is so powerful and important that it forms the basis for
    Delphi''s multiter database support.


    # ## Populating from a File or Stream: Persisting Client Datasets


    Though client datasets are located in RAM, you can save them to a file or a stream
    and reload them at a later point in time, making them persistent. This is the
    third method of populating a client dataset.


    To save the dataset to a file, use the `SaveToFile` method, which is defined like
    this:


    ```

    procedure SaveToFile(const FileName: string = '''';

    Format: TDataPacketFormat = dfBinary);

    ```


    Similarly, to save the dataset to a stream, you call `SaveToStream`, which is
    defined as follows:


    ```

    procedure SaveToStream(Stream: TStream; Format: TDataPacketFormat = dfBinary);

    ```


    `SaveToFile` accepts the name of the file that you''re saving to. If the filename
    is blank, the data is saved using the `FileName` property of the client dataset.


    Both `SaveToFile` and `SaveToStream` take a parameter that indicates the format
    to use when saving data. Client datasets can be stored in one of three file formats:
    binary, or either flavor of XML. Table 3.1 lists the possible formats.'
  merge: -1
  img_proc: true
- pgno: 119
  md: "**TABLE 3.1** Data Packet Formats for Loading and Saving Client Datasets\n\n\
    | Value | Description |\n| :---- | :---------- |\n| dfBinary | Data is stored\
    \ using a proprietary, binary format. |\n| dfXML | Data is stored in XML format.\
    \ Extended characters are represented using an escape sequence. |\n| dfXMLUTF8\
    \ | Data is stored in XML format. Extended characters are represented using UTF8.\
    \ |\n\nWhen client datasets are stored to disk, they are referred to as MyBase\
    \ files. MyBase stores one dataset per file, or per stream, unless you use nested\
    \ datasets.\n\n**Note**\n\nIf you’re familiar with Microsoft ADO, you recall that\
    \ ADO enables you to persist datasets using XML format. The XML formats used by\
    \ ADO and MyBase are not compatible. In other words, you cannot save an ADO dataset\
    \ to disk in XML format, and then read it into a client dataset (or vice versa).\n\
    \nSometimes, you need to determine how many bytes are required to store the data\
    \ contained in the client dataset. For example, you might want to check to see\
    \ if there is enough room on a floppy disk before saving the data there, or you\
    \ might need to preallocate the memory for a stream. In these cases, you can check\
    \ the DataSize property, like this:\n\n```\nif ClientDataSet1.DataSize > AvailableSpace\
    \ then\n  ShowMessage('Not enough room to store the data');\n```\n\nDataSize always\
    \ returns the amount of space necessary to store the data in binary format (dfBinary).\
    \ XML format usually requires more space, perhaps twice as much (or even more).\n\
    \n**Note**\n\nOne way to determine the amount of space that’s required to save\
    \ the dataset in XML format is to save the dataset to a memory stream, and then\
    \ obtain the size of the resulting stream."
  merge: -1
  img_proc: true
- pgno: 120
