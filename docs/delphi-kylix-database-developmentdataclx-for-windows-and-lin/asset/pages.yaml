- pgno: 75
  md: 'To execute a query, you write something like the following:


    ```

    ```sql

    SQLDataSet1.SQLConnection := conn;

    SQLDataSet1.CommandType := ctQuery;

    SQLDataSet1.CommandText := ''SELECT * FROM CONTACTS WHERE Country =

    :''ThisCountry'';

    SQLDataSet1.ParamByName(''TheCountry'').Value := ''United States'';

    SQLDataSet1.Open();

    ```

    ```


    This code is also extremely similar to that used for a TSQLQuery component.


    The following code snipet executes a stored procedure using the TSQLDataSet component:


    ```

    ```sql

    SQLDataSet1.SQLConnection := conn;

    SQLDataSet1.CommandType := ctStoredProc;

    SQLDataSet1.CommandText := ''ContactsByState'';

    SQLDataSet1.ParamByName(''ASTATE'').Value := ''FL'';

    SQLDataSet1.Open();

    ```

    ```


    Again, notice the similarities to the TSQLStoredProc component.


    In many applications, you set these properties at design time rather than at runtime.
    I’m showing the assignments at runtime simply to point out the similarities and
    differences between the various components.


    In the examples for this book, I use TSQLDataSet for all database access. The
    only exception is the Navigate example (shown later in this chapter), which serves
    as the single example of how to use the different dbExpress dataset components.


    # ## Data Manipulation


    Now that we’ve discussed the components necessary for data access, let’s spend
    a few minutes discussing the methods provided by those components. Because dbExpress
    datasets are a unidirectional read-only technology, you’ll see that there isn’t
    a lot to cover in this area. The following sections discuss the most common operations
    that you will perform on a dbExpress dataset.


    # ## Opening a Dataset


    After you’ve set the appropriate properties on the dataset, you need to open the
    dataset to retrieve data from the database connection. There are actually two
    ways to do this, both of which achieve exactly the same result:


    ```

    ```sql

    SQLDataSet1.Open();

    ```

    ```


    or


    ```

    ```sql

    SQLDataSet1.Active := True;

    ```

    ```'
