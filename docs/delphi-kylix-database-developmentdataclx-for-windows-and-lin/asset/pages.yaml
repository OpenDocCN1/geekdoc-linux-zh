- pgno: 286
  md: "Earlier in this book, you learned about dbExpress—a high-performance, low-overhead\
    \ database technology. You learned that it is read-only and unidirectional, making\
    \ it cumbersome to use directly for most interactive database applications.\n\n\
    Later, I introduced you to client datasets. Client datasets are especially well\
    \ suited to database application front ends because they are fast, flexible, and\
    \ powerful. However, they are inherently single user because they are RAM-based.\
    \ Also, they read from and write to a proprietary file format.\n\nSo far, these\
    \ may seem like disparate technologies used to solve different types of programming\
    \ problems. This chapter and the next tie them together, showing you how you can\
    \ use client datasets to read and write data using dbExpress as the underlying\
    \ database technology.\n\nThis chapter shows you how to use providers to create\
    \ multitier database applications.\n\n# What Is a Dataset Provider?\n\nA dataset\
    \ provider forms a conduit between a client dataset and an external data store—typically\
    \ another dataset, such as a TSQLDataSet. It provides data to the client dataset\
    \ on request and sends data back to the underlying data store when the client\
    \ changes it—a technique called *resolving*.\n\nThe component used to accomplish\
    \ this is TDataSetProvider, found on the Data Access tab of the component palette.\n\
    \n> **NOTE**\n> \n> Nothing about dataset providers ties them to dbExpress specifically.\
    \ The information presented in this chapter is applicable to other database technologies\
    \ as well, such as BDE and dbGo (formerly called ADOExpress).\n> \n> For a dataset\
    \ to be compatible with TDataSetProvider, it must support the IProviderSupport\
    \ interface, defined in DB.pas like this:\n\n```\n```\nIProviderSupport = interface\n\
    \  procedure PSEndTransaction(Commit: Boolean);\n  procedure PSExecute;\n  function\
    \ PSExecuteStatement(const ASQL: string; AParams: TParams;\n    ResultSet: Pointer\
    \ = nil): Integer;\n  procedure PSGetAttributes(List: TList);\n  function PSGetDefaultOrder:\
    \ TIndexDef;\n  function PSGetKeyFields: string;\n  function PSGetParams: TParams;\n\
    \  function PSGetQuoteChar: string;\n  function PSGetTableName: string;\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 287
  md: "```\nfunction PSGetIndexDefs(IndexTypes: TIndexOptions = [ixPrimary, ixNonMaintained]):\
    \ TIndexDefs;\nfunction PSGetUpdateException(E: Exception;\n        Prev: EUpdateError):\
    \ EUpdateError;\nfunction PSInTransaction: Boolean;\nfunction PSQLBased: Boolean;\n\
    function PSQLSupported: Boolean;\nprocedure PSReset;\nprocedure PSSetParams(AParams:\
    \ TParams);\nprocedure PSSetCommandText(const CommandText: string);\nprocedure\
    \ PSStartTransaction;\nfunction PSUpdateRecord(UpdateKind: TUpdateKind;\n    \
    \    Delta: TDataSet): Boolean;\nend;\n```\n\nTDataSet implements stub functions\
    \ for these methods, which generally do nothing or raise an exception. The datasets\
    \ included with Delphi (BDE, dbExpress, and dbGo) override these methods to provide\
    \ a specific implementation.\n\n# Connecting to a Dataset\n\nIn this section I'll\
    \ show you how to connect a client dataset to another dataset. To do so, follow\
    \ these steps:\n\n+   1. Start a new application and drop a TSQLConnection and\
    \ TSQLDataSet on the main form. Connect these components to a database, using\
    \ the techniques discussed in Chapters 1 and 2.\n+   2. Drop a TDataSetProvider\
    \ on the main form. Set the DataSet property to the TSQLDataSet component. For\
    \ now, leave all other properties set to their default values.\n+   3. Drop a\
    \ TClientDataSet on the main form. Set its ProviderName property to the dataset\
    \ provider you created in the previous step.\n+   4. Connect a TDataSource component\
    \ to the client dataset and hook up a TDBGrid component to the data source.\n\
    +   5. Create an event handler for the form's FormCreate event and add the following\
    \ line of code to it: `ClientDataSet1.Open;`\n+   6. Run the application.\n\n\
    If you set everything up correctly, you should see the data from the dbExpress\
    \ database displayed in the grid. Notice that you can scroll forward and backward\
    \ through the data, and you"
