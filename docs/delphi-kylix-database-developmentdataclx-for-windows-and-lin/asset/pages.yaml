- pgno: 59
  md: "+   * Some SQL operations are fast, but some are extremely slow. A very complicated\
    \ SELECT statement that is performed on a large database might take several minutes\
    \ (or even hours) to execute.\n\n+   * Especially when using TSqlConnection in\
    \ conjunction with datasets (discussed in Chapter 3), the connection might run\
    \ some SQL commands on your behalf. It can be useful for both learning and debugging\
    \ purposes to intercept all SQL commands sent to the database.\n\nIn either of\
    \ these situations, it’s helpful to be able to provide feedback or logging facilities\
    \ to the end user of your application (or to yourself) in the form of a log file,\
    \ database, CodeSite (from Raize Software, at www.raize.com), or other debugging\
    \ tool.\n\n# ## Changing the Cursor While Executing SQL Statements\n\nThe simplest\
    \ form of feedback that you can provide is to change the cursor to an hourglass\
    \ when an SQL statement is executing. To provide this functionality in your application,\
    \ all you need to do is set the connection’s SQLHourGlass property to True. SQLHourGlass\
    \ is not a published property, so you can’t set it at design time.\n\n```\nSQLConnection1.SQLHourGlass\
    \ := True;\n```\n\n# ## Creating a Callback Event to Monitor SQL Commands\n\n\
    If you want to intercept every SQL command that passes from TSqlConnection to\
    \ the database, you can set up what is called a trace callback event.\n\nYou set\
    \ up a trace callback event by calling TSqlConnection.SetTraceCallbackEvent. SetTraceCallbackEvent\
    \ takes two parameters: the event to call for SQL activity, and a user-defined\
    \ integer value that is passed to the callback event.\n\nThe format of the callback\
    \ event is defined as follows:\n\n```\nTSQLCallbackEvent = function(CallType:\
    \ TRACECat; CBIInfo: Pointer): CBRTType; stdcall;\n```\n\nCallType is always set\
    \ to cbTRACE on entry to the callback function. CBInfo is a pointer to an SQLTRACEDesc\
    \ record, which is defined like this:\n\n```\nSQLTRACEDesc = packed record   \
    \        { trace callback info }\n  pszTrace   : array [0..1023] of Char;\n  eTraceCat\
    \  : TRACECat;\n  ClientData : Integer;\n  uTotalMsgLen : Word;\nend;\n```"
  merge: -1
  img_proc: true
- pgno: 60
  md: "The fields and their meanings are shown in Table 1.8.\n\n**TABLE 1.8** *SQLTraceDesc\
    \ Field Explanations*\n\n| Field | Definition |\n| :--- | :--- |\n| pszTrace |\
    \ The NULL-terminated command that was just passed to or from the database. |\n\
    | eTraceCat | The category of the command just sent or received. Table 1.9 lists\
    \ the possible values of this field. |\n| ClientData | The user-defined value\
    \ passed as the second parameter to SetTraceCallbackEvent. |\n| uTotalMsgLen |\
    \ The length, in characters, of the string contained in *pszTrace*. |\n\nTable\
    \ 1.9 describes the possible values for the eTraceCat field.\n\n**TABLE 1.9**\
    \ *eTraceCat Values*\n\n| Value | Definition |\n| :--- | :--- |\n| trace0PREPARE\
    \ | A query was sent to the server to prepare. |\n| traceOEXECUTE | A query was\
    \ sent to the server to execute. |\n| traceERROR | An error message was returned\
    \ by the server. |\n| traceSTMT | An operation for the database to perform was\
    \ sent to the server. |\n| traceCONNECT | A connect-or-disconnect-related operation\
    \ was sent to the server. |\n| traceTRANSACT | A transaction-related operation\
    \ was sent to the server. |\n| traceBLOB | A BLOB-related operation was sent to\
    \ the server. |\n| traceVENDOR | A vendor-specific API call was sent to the server.\
    \ |\n| traceDATAIN | Parameter data was sent to the server during an INSERT or\
    \ UPDATE command. |\n| traceDATAOUT | Data was retrieved from the server. |\n\
    | traceMISC | Any other command not falling under one of the previous categories.\
    \ |\n\n> **Note**\n> \n> Not all of these options are currently supported. Many\
    \ of them are there for future expansion. Currently, all vendor calls and executed\
    \ SQL commands are traced."
