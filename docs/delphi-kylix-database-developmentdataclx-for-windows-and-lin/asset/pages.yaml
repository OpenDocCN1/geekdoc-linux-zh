- pgno: 49
  md: "# ### Transaction Support\n\nMost SQL databases, with the notable exception\
    \ of versions of MySQL prior to 3.23, provide support for transactions. A transaction\
    \ must satisfy four criteria, which are called the ACID properties of transactions.\
    \ Specifically, transactions are\n\n+   * Atomic. The transaction must either\
    \ succeed or fail as a whole. It is not acceptable for part of the transaction\
    \ to succeed and part of it to fail.\n+   * Consistent. After a transaction finishes,\
    \ the data must be left in a consistent state. All data must adhere to current\
    \ referential integrity constraints.\n+   * Isolated. Changes made in one transaction\
    \ must not be visible to another transaction until the transaction is committed.\n\
    +   * Durable. Once a transaction is committed, its changes must be permanent.\
    \ Nothing, including a system crash, must alter the effects of the committed transaction.\n\
    \nTransactions are most easily described with an example, so I'll go through the\
    \ most often-cited example of transaction support.\n\nImagine a bank with a database\
    \ that contains clients and account information. John Q. Customer has both a savings\
    \ account and a checking account at the bank. He makes a trip to his local ATM,\
    \ and decides to transfer $100 from his savings account to his checking account.\n\
    \nIn SQL terms, this constitutes two operations: one INSERT statement to record\
    \ a withdrawal from the savings account, and a second INSERT statement to record\
    \ the deposit into the checking account. Assuming the ATM software is written\
    \ using Delphi and dbExpress, it might contain some code similar to the following:\n\
    \n```\nprocedure TransferFunds(FromAccountID: Integer; ToAccountID: Integer;\n\
    \  Amount: Double);\nvar\n  SQL: string;\n  Params: TParams;\nbegin\n  Params\
    \ := TParams.Create;\n  try\n    SQL := 'INSERT INTO ACCOUNTDETAIL (ACCOUNTID,\
    \ TRANSDATE, AMOUNT) ' +\n           'VALUES (:AccountId, :TransDate, :TransAmount)';\n\
    \    Params.ParamByName('AccountId').Value := FromAccountID;\n    Params.ParamByName('TransDate').Value\
    \ := Date;\n    Params.ParamByName('TransAmount').Value := -Amount;\n    SQLConnection1.Execute(SQL,\
    \ Params);\n    \n    Params.ParamByName('AccountId').Value := ToAccountID;\n\
    \    Params.ParamByName('TransAmount').Value := Amount;\n```"
  merge: -1
  img_proc: true
- pgno: 50
  md: "```\nSQLConnection1.Execute(SQL, Params);\nfinally\n   Params.Free;\nend;\n\
    end;\n```\n\nConceptually, this code snippet creates a withdrawal for the originating\
    \ account, and a deposit for the target account. At first, it might seem like\
    \ there's nothing wrong with this code, but let's take a look at the possibilities.\n\
    \nWhat happens if a power outage, connection failure, or some other catastrophic\
    \ failure occurs between the time the withdrawal is recorded and the time the\
    \ deposit is recorded? The money would be deducted from the savings account, but\
    \ it would never get added to the checking account (which makes Mr. Customer a\
    \ very unhappy, quite possibly *former*, customer).\n\nIf the code is reversed\
    \ to create the deposit before the withdrawal, the opposite can happen: The deposit\
    \ gets recorded, but the withdrawal never occurs (which makes Mr. Customer very\
    \ happy and $100 richer, but the bank is shorted).\n\nClearly, the ATM software\
    \ needs to have some assurance that either the withdrawal and the deposit both\
    \ occur, or that neither of them occur. This is what transactions are designed\
    \ to handle.\n\nThe following few sections describe how to detect whether a given\
    \ database supports transactions, how to start (and subsequently end) a transaction,\
    \ and how to handle multiple (and nested) transactions.\n\n# Checking for Transaction\
    \ Support\n\nIf you're writing an application that only works with a single database\
    \ backend (such as Oracle or InterBase), you know before you start coding that\
    \ the database supports transactions. If you're writing a general-purpose application\
    \ that can access many different database backends, you don't know up front whether\
    \ the selected database backend supports transactions or not.\n\nTSQLConnection\
    \ provides a way to detect whether the underlying database engine supports transactions:\
    \ the TransactionsSupported property. Before you check TransactionsSupported,\
    \ you need to establish a connection to the database, like this:\n\n```\nSQLConnection1.Open;\n\
    ...\nif SQLConnection1.TransactionsSupported then begin\n   // Go ahead with transaction\
    \ code\nend else begin\n   // Transactions not supported - proceed with alternate\
    \ code or bail out\nend;\n```"
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Starting a Transaction


    When you’ve determined that the database supports transactions, you can start
    a transaction. To begin, call the method SQLConnection. StartTransaction. StartTransaction
    is defined like this:


    ```

    procedure StartTransaction( TransDesc: TTransactionDesc);

    ```


    TTransactionDesc is a record that describes the transaction in detail. Its definition
    is shown here:


    ```

    TTransactionDesc = packed record

    TransactionID : LongWord; { Transaction id }

    GlobalID : LongWord; { Global transaction id }

    IsolationLevel : TTransIsolationLevel; {Transaction Isolation level}

    CustomIsolation : LongWord; { DB specific custom isolation }

    end;

    ```


    Table 1.6 shows the meaning of the individual fields in the TTransactionDesc record.


    | **TABLE 1.6 TTransactionDesc Fields** |

    |---|---|

    | Field | Definition |

    | TransactionID | User-defined, local transaction number that uniquely identifies
    the transaction for purposes of this application. |

    | GlobalID | Used for Oracle transactions to define a transaction number that
    must be unique across the entire Oracle database. |

    | IsolationLevel | Used to specify how this transaction reacts to other transactions.
    Valid values for this field are listed in Table 1.7. |

    | CustomIsolation | Identifies the custom isolation level when IsolationLevel
    is set to x11CUSTOM. No dbExpress drivers currently support this. |


    Table 1.7 shows the valid settings for TTransactionDesc''s IsolationLevel field.


    | **TABLE 1.7 Valid IsolationLevel Values** |

    |---|---|

    | Field | Definition |

    | x11DIRTYREAD | The transaction sees all changes made by other transactions,
    even if those changes have not yet been committed. Oracle does not support this
    level of transaction isolation. |

    | x11READCOMMITTED | The transaction sees only those changes made by other transactions
    that have been committed both before this transaction was started, and after this
    transaction was started. |'
  merge: -1
  img_proc: true
- pgno: 52
  md: "TABLE 1.7  Continued\n| Field | Definition |\n| --- | --- |\n| x11REPEATABLEREAD\
    \ | The transaction sees only those changes made by other transactions, but only\
    \ if they were committed before this transaction started. |\n| x11CUSTOM | Database-specific\
    \ isolation level. CustomIsolation specifies the actual isolation level. No dbExpress\
    \ drivers currently support this. |\n\n\nThe following code snippet shows how\
    \ to start a transaction.\n\n```\n```\nvar\n  TransDesc: TTransactionDesc;\nbegin\n\
    \  TransDesc.TransactionID := 1;\n  TransDesc.IsolationLevel := x11READCOMMITTED;\n\
    \  SqlConnection1.StartTransaction(TransDesc);\nend;\n```\n\n```\n\n# ## Committing\
    \ a Transaction\n\nAfter you have issued the appropriate SQL commands inside a\
    \ transaction, you want to *commit* the transaction. This ends the transaction,\
    \ and saves any changes made during that transaction. Committing a transaction\
    \ is as easy as calling TSQLConnection.Commit, which the following line of code\
    \ illustrates:\n\n```\n```\nSqlConnection.Commit(TransDesc);\n```\n```\n\n# ##\
    \ Rolling Back a Transaction\n\nAt times, you start a transaction only to find\
    \ out later that you don’t want to save the changes made during that transaction.\
    \ If that should occur, you can *roll back* the transaction rather than committing\
    \ it. Rolling back a transaction ends the transaction, but all changes made in\
    \ the context of the transaction are discarded.\n\nTo roll back a transaction,\
    \ call TSQLConnection.Rollback, like this:\n\n```\n```\nSqlConnection1.Rollback(TransDesc);\n\
    ```\n```\n\n# ## Multiple Transactions\n\nYou are not limited to just one transaction\
    \ at a time. Transactions can be nested or overlapped. Figure 1.7 shows what nested\
    \ and overlapped transactions look like at a conceptual level."
  merge: -1
  img_proc: true
- pgno: 53
  md: "![](img/fe651f295b5f960d5463c4fb581d2281_53_0.png)\n\n# **FIGURE 1.7**\n\n\
    *Transactions may be nested or overlapped.*\n\nNot all databases support multiple\
    \ transactions. Unfortunately, to determine whether a database supports multiple\
    \ transactions, you can’t check a simple property. TSQLConnection contains a private\
    \ field named FSupportsMultiTrans, but there is no public access to it. All is\
    \ not lost, however, as you can use the following function to retrieve the value\
    \ of this property:\n\n```\nfunction SupportsMultiTrans(conn: TSQLConnection):\
    \ Boolean;\nvar\n  Supported: LongBool;\n  PropSize: SmallInt;\nbegin\n  conn.MetaData.GetOption(eMetaSupportsTransactions,\
    \ @Supported,\n    SizeOf(Integer), PropSize);\n  Result := Supported;\nend;\n\
    ```\n\nIf the database does not support multiple transactions, you want to refrain\
    \ from calling StartTransaction while a transaction is active. You can test to\
    \ see whether a transaction is currently active by checking the InTransaction\
    \ property, like this:\n\n```\nif not SQLConnection1.InTransaction then\n  //\
    \ Safe to start a transaction\n```\n\nIf the database supports multiple transactions,\
    \ you can nest them, as the following code snippet shows:\n\n```\nvar\n  TransOuter:\
    \ TTransactionDesc;\n  TransInner: TTransactionDesc;\nbegin\n  TransOuter.TransactionID\
    \ := 1;\n  TransOuter.IsolationLevel := xlREADCOMMITTED;\n  SQLConnection1.StartTransaction(TransOuter);\n\
    \  try\n```"
