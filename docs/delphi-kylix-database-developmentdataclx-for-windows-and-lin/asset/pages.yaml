    # Database Structure


    You have already accessed some of the tables in the ConMan database through the
    sample pro- grams provided with earlier chapters. Listing 9.1 contains the partial
    SQL script used to create a new, empty version of the CONMAN database.


    The **Contacts** table is where company names, addresses, phone numbers, and the
    like are stored. One record is created for each contact, so if multiple contacts
    exist for the same com- pany, the company data is stored with each contact.


    > In reality, this database should also contain a *Companies* table, with each
    contact holding a reference back to the company to which he or she is associated.
    To keep the size of this application manageable, I elected to store both company
    and contact data in the *Contacts* table.


    9  THE CONMAN APPLICATION'
