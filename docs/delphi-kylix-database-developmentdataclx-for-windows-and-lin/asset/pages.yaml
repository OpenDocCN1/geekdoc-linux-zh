    procedure TForm1.cdsContactsBeforeGetRecords(Sender: TObject; var OwnerData: OleVariant);
    begin if cdsContacts.Active then OwnerData := cdsContacts.Tag; end;

    ```


    The Stateless application example incorporates these concepts into a stateless
    server and client. Because most of the source code was listed previously in the
    form of code snippets, I won''t show it again here.


    # ## Sharing a Connection Between Multiple Client DataSets


    Some real-world applications allow the user to choose between connection protocols;
    for example, the user may opt for a socket connection, a DCOM connection, or an
    HTTP connection. In this way, the client application lets the user make the decision
    as to which connection type is most appropriate for a particular situation.


    To provide support for multiple connection types, you need to place multiple connection
    components on the client’s data module. For example, you may drop a TSocketConnection,
    a TDCOMConnection, and a TWebConnection component on the data module. Switching
    from one connection to another means that you need to set the RemoteServer property
    for each TClientDataSet component to the correct connection at runtime.


    In small sample applications, this isn''t a big problem, because most examples
    use only one or two client datasets. However, most real-world applications contain
    many more than that. For example, I am currently working on an application that
    utilizes more than 50 TClientDataSet components in the client application.


    To facilitate switching from one connection component to another, Delphi provides
    a TConnectionBroker component. To use a TConnectionBroker, drop one on the client’s
    data modules and set the ConnectionBroker property for each TClientDataSet component
    to the TConnectionBroker. Then, set TConnectionBroker’s RemoteServer property
    to the correct connection component. Switching connections is then a trivial matter
    of changing the connection broker’s RemoteServer property to the desired connection
    component.


    In addition to easily switching from connection to connection, you gain another
    advantage by using a connection broker. If you make calls to the application server
    in your code, such as the following:


    ```

    SocketConnection1.AppServer. ExecuteSomeMethod;

    ```'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'You don’t need to change that code if the connection type changes. Instead
    of calling the method on `SocketConnection` (or any other connection component),
    you can call it on the connection broker, like this:


    ```

    ConnectionBroker1.Connection.AppServer.ExecuteSomeMethod;

    ```


    In this way, the code works regardless of the active connection.


    # # Brokering Connections Between Multiple Servers


    In large-scale development, a single instance of the application server may not
    be enough to handle the large number of clients connected to it. You also may
    want to run a copy of the application server on multiple server machines so that
    if one machine goes down, the client can still connect to an application server
    running on a different server machine.


    When running multiple copies of the application server, the client needs some
    way of choosing between them at runtime. If it selects a server that is down at
    the moment, it should try again with a different server.


    To incorporate connection broker into your application, drop a `TSimpleObjectBroker`
    component onto your client’s data module. In the `Servers` property, enter a list
    of servers that the client application can attempt to connect to. Set the connection
    object’s `ObjectBroker` property to the name of the `TSimpleObjectBroker`.


    When the `TSimpleObjectBroker`’s `LoadBalanced` property is set to `False`, the
    client will attempt to connect to the first server in the `Servers` property.
    If that connection fails, it will try the second server, and so on. When `LoadBalanced`
    is `True`, the broker attempts to select a different server for each connection
    in the current client application only. If the client application contains a single
    remote connection, setting `LoadBalanced` to `True` has no effect.


    A more common scenario is to have several instances of the application server
    running and a number of clients that connect to the server. In this case, your
    best bet is to randomize the list of servers at runtime so that each client has
    the potential of connecting to a different server.


    For example, suppose that you have three servers, named Server1, Server2, and
    Server3. If there are six instances of the client application, and you randomize
    the order of the servers for each client, potentially each client’s server order
    could be the following:


    +   Client 1: Server1, Server2, Server3


    +   Client 2: Server1, Server3, Server2


    +   Client 3: Server2, Server1, Server3


    +   Client 4: Server2, Server3, Server1'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'Client 5: Server3, Server1, Server2

    Client 6: Server3, Server2, Server1

    Assuming that all servers are up and running, this will balance the load equally
    over the three servers, with two clients connected to each server.


    # ## Summary


    This chapter discussed DataSnap, Delphi''s remote access technology for multitier
    database development.


    +   - The first step in creating a separate application server is to set up one
    or more remote data modules. Delphi supports the creation of standard, MTS, CORBA,
    and SOAP remote data modules.

    +   - To create methods for use with an application server, use the Add to Interface
    menu item. To create a callback interface, use the Type Library editor to create
    a new interface.

    +   - To create a simple user interface for the application server, post a custom
    message to the main form whenever a remote data module is created or destroyed.
    A reasonable place to do this is in the data module''s **OnCreate** and **OnDestroy**
    event handlers.

    +   - You can connect to the application server from a client application, using
    a variety of connection protocols, including TSocketConnection, TDCOMConnection,
    TWebConnection, TSOAPConnection, and TCORBAConnection.

    +   - The briefcase model allows your application to download data to the local
    machine for use when it is impossible to connect to the server.

    +   - To facilitate the use of multiple application servers in a large-scale application,
    Delphi provides the TConnectiOnBroker component.


    The next chapter introduces a complete application that uses many of the techniques
    discussed in this chapter and throughout the rest of the book.'
