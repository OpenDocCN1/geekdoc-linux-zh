- pgno: 307
  md: 'For example, a database might include a trigger for autogenerated a table’s
    primary key, using a generator. At the time a new record is posted to the database,
    the value of that field may be NULL. During the post operation, the database will
    fill in the value of the primary key, and `poAutoRefresh` will then reread the
    record so the Delphi application knows the value of the primary key.


    Without the `poAutoRefresh` option, you can still autogenerate primary key values
    to a record, but you will need to perform a little work in the server-side data
    module. This technique is explained later, in the section titled “Changing Field
    Values on the Server.”


    # ## Provider Events


    TDataSetProvider publishes two types of events—OnXxx and BeforeXxx/AfterXxx. The
    BeforeXxx/AfterXxx events fire before and after “interesting” things happen in
    the provider, such as when updates are applied to the underlying database.


    Table 7.7 lists the Before and After events supported by TDataSetProvider.


    **TABLE 7.7 TDataSetProvider BeforeXxx/AfterXxx Events**


    | Event | Description |

    |---|---|

    | AfterApplyUpdates | Fired after the updates to the database are complete. |

    | AfterExecute | Fired after the server executes the query or stored procedure
    that will ultimately return data to the client. |

    | AfterGetParams | Fired after the server returns output parameters from the dataset
    to the client dataset. |

    | AfterGetRecords | Fired after the provider creates the data packet to send to
    the client. |

    | AfterRowRequest | Fired after the provider refreshes the current record because
    of a call to TClientDataSet.RefreshRecord or any other method that fetches data.
    |

    | AfterUpdateRecord | Fired after a record is successfully updated. |

    | BeforeApplyUpdates | Fired before updates are applied to the database. |

    | BeforeExecute | Fired before the server executes a query or stored procedure.
    |

    | BeforeGetParams | Fired before the server returns output parameters from the
    dataset to the client dataset. |

    | BeforeGetRecords | Fired before the provider creates the data packet to send
    to the client. |'
  merge: -1
  img_proc: true
- pgno: 308
  md: '**TABLE 7.7 Continued**


    | Event | Description |

    | :--- | :--- |

    | BeforeRowRequest | Fired before the provider refreshes the current record because
    of a call to TClientDataSet.RefreshRecord or any other method that fetches data.
    |

    | BeforeUpdateRecord | Fired before each record''s updates are applied to the
    database. |


    Most of the BeforeXXX and AfterXXX events pass a parameter named OwnerData. OwnerData
    is a variant that contains user-defined data. The data is passed from the client
    dataset to the provider and back to the client dataset during certain method calls,
    such as App l y U p d a t e s . The flow is as follows:


    In the client dataset BeforeXXX event (such as BeforeGetRecords), OwnerData can
    be set to anything that you want to pass to the provider. Because it is a variant,
    it can contain a simple value such as an integer—or something more complex, such
    as an array of values.


    As flow passes to the provider, the OwnerData parameter is passed to the provider''s
    BeforeXXX event. The value of OwnerData may be changed in the BeforeXXX event,
    if needed.


    Next, flow continues to the provider''s AfterXXX event, where OwnerData may again
    be changed if necessary.


    Finally, flow passes to the client dataset''s AfterXXX event, when you may inspect
    the (possibly modified) value of OwnerData. The client dataset''s AfterXXX event
    is the end of the line, so there is no reason to modify the value of OwnerData
    in the client dataset''s AfterXXX event.


    The following chapter shows an example of how you can use the OwnerData parameter
    to implement a stateless server. OnXXX events are fired to allow the application
    code to “hook” into the various stages of providing data to the client and resolving
    it back to the server. Table 7.8 lists the events supported by the TDataSetProvider
    component, along with their use.


    **TABLE 7.8 TDataSetProvider OnXXX Events**


    | Event | Description |

    | :--- | :--- |

    | OnGetData | Fired after data is fetched from the underlying database but before
    the data is returned to the client. You can handle this event to modify the data
    in some way before passing it on to the client. For example, you might encrypt
    fields, compress the data, or weed out certain data that the client should never
    see. This event is discussed in the “Intercepting Data” section later in this
    chapter. |'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'TABLE 7.8 Continued

    | Event | Description |

    |---|---|

    | OnGetDataSetProperties | Fired after data is fetched from the underlying database
    but before the data is returned to the client. Using the optional parameters (discussed
    later in this chapter in the section titled “Optional Parameters”), you can send
    additional information to the client. |

    | OnGetTableName | Used when the provider returns data from a join or stored procedure.
    You can handle this event to instruct the provider which table to apply updates
    to. This option is discussed in the section titled “Providing and Resolving Data
    from a Join,” later in this chapter. |

    | OnUpdateData | OnUpdateData is the counterpart of OnGetData. It is fired just
    before updates are sent to the database server. You can handle this event to decrypt
    data before it is saved to the database, for example. This event is discussed
    in the “Intercepting Data” section later in this chapter. |

    | OnUpdateError | Fired when an error occurs while reconciling data. If you don’t
    handle this event, the error is sent back to the client application. You can handle
    this event to ignore certain errors or attempt to correct them on the server before
    sending them back to the client. |


    Some of the more interesting events will be discussed in more detail in the sections
    that follow.


    # Changing Field Values on the Server


    Sometimes, you will want the server to make modifications to data that is passed
    to it by the client. The most common example is when a table contains an ID field
    that is the primary key for the table. The database server is often responsible
    for assigning unique IDs to each individual record.


    To accomplish this, you must follow this procedure:


    +   1. Create a stored procedure in the database that will return the next unique
    ID.

    +   2. Include the poPropagateChanges setting in the TDataSetProvider’s Options
    property.

    +   3. Include the pfInKey setting in the ID field’s ProviderFlags.

    +   4. Provide an event handler for the provider’s BeforeUpdateRecord event.


    ![](img/fe651f295b5f960d5463c4fb581d2281_309_0.png)'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'In the **BeforeUpdateRecord** event handler for a newly inserted record, obtain
    the next value of the ID field and assign it to the record. The following code
    snippet shows a typical implementation for the **BeforeUpdateRecord** event handler.


    ```

    procedure TfrmMain.DataSetProvider1BeforeUpdateRecord(Sender: TObject; SourceDS:
    TDataSet; DeltaDS: TCustomClientDataSet; UpdateKind: TUpdateKind; var Applied:
    Boolean);

    begin

    if UpdateKind = ukInsert then

    if DeltaDS.FieldName(''ID'').OldValue <= 0 then

    DeltaDS.FieldName(''ID'').NewValue := GetNextID;

    end;

    ```


    Where **GetNextID** looks like this:


    ```

    function TfrmMain.GetNextID: Integer;

    begin

    sqlID.ExecSQL;

    Result := sqlID.ParamByName(''AValue'').AsInteger;

    end;

    ```


    sqlID is a TSQLDataSet component that executes a stored procedure on the database
    server, which in turn returns the next unique ID number in an output parameter
    named AValue.


    I won''t provide a program example using this technique at this time, but you''ll
    see this technique implemented in later examples in this chapter.


    # ## Intercepting Data


    Table 7.4 lists two events, **OnGetData** and **OnUpdateData**, that can be used
    to intercept data on its way from the provider to the client and also on its way
    from the client to the provider.


    In this chapter, we''re working with a single application; in other words, the
    client and server portions of the data are both contained in a single application.
    In the next chapter, we''ll create client and server applications that may exist
    on separate machines that can be located down the hall from each other or on different
    continents.


    When data travels from machine to machine, unfortunately there is always the chance
    that some hacker may be attempting to listen in on the exchange of data. If the
    data includes anything sensitive, such as account numbers or the like, you might
    want to consider encrypting that data before sending it over the wire or across
    cyberspace.


    **OnGetData** and **OnUpdateData** provide the two hooks on the server side for
    implementing this functionality. The following code snippet shows implementations
    of both **OnGetData** and **OnUpdateData** that encrypt data on its way to the
    client and decrypt data on its way back. The functions **EncryptData** and **DecryptData**
    referenced by the code are fictitious routines that you would need to supply if
    you were to implement this functionality in your own applications.'
  merge: -1
  img_proc: true
- pgno: 311
  md: "# **Note**\n\nFor a good third-party encryption library that supports encryption\
    \ standards such as DES, Blowfish, and Rijndael (AES), take a look at TurboPower\
    \ Software’s LockBox product at `www.tpx.turbopower.com/products/LockBox`.\n\n\
    ```\n```\nprocedure TForm1.ProviderGetData(Sender: TObject;\n  DataSet: TCustomClientDataSet);\n\
    begin\n  while not DataSet.EOF do begin\n    DataSet.Edit;\n    DataSet.FieldName('AccountNumber').AsString\
    \ :=\n      EncryptData(DataSet.FieldName('AccountNumber').AsString);\n    DataSet.Post;\n\
    \    DataSet.Next;\n  end;\nend;\n```\n```\n\n```\n```\nprocedure TfrmMain.DataSetProvider1UpdateData(Sender:\
    \ TObject;\n  DataSet: TCustomClientDataSet);\nbegin\n  while not DataSet.EOF\
    \ do begin\n    if DataSet.UpdateStatus <> usDeleted then begin\n      DataSet.Edit;\n\
    \      DataSet.FieldName('AccountNumber').AsString :=\n        DecryptData(DataSet.FieldName('AccountNumber').AsString);\n\
    \      DataSet.Post;\n      DataSet.Next;\n    end;\n  end;\nend;\n```\n```\n\n\
    On the client side, the `AccountNumber` field will be encrypted. `ClientDataSet1.FieldName('AccountNumber').AsString`\
    \ will return an encrypted account code, which you should then decrypt before\
    \ displaying. Note that the code shown here is a rather simplistic implementation\
    \ of encrypting/decrypting data. For one thing, only the account number is encrypted\
    \ and decrypted. In a real application, you might want to encrypt and decrypt\
    \ all string fields by looping through all fields in the dataset."
  merge: -1
  img_proc: true
- pgno: 312
  md: '# # Optional Parameters


    Optional parameters are custom data that pertain to the dataset passed to the
    client. Optional parameters relate to the dataset as a whole, rather than to individual
    records. You can use an optional parameter to pass data back to the client, such
    as the date and time the data was provided, the length of time required to run
    the query on the server, or any other data.


    To pass optional parameters to the client, provide an event handler for TDataSetProvider’s
    OnGetDataSetProperties event. Within this event handler, use the Properties parameter
    to set the values to send back to the client. The following code snippet shows
    how to send both the time required to execute the query and the time the query
    was executed.


    ```

    procedure TForm1.DataSetProvider1GetDataSetProperties(Sender: TObject;

    DataSet: TDataSet; out Properties: OleVariant);

    begin

    Properties := VarArrayCreate([0, 1], varVariant);

    Properties[0] := VarArrayOf([''TimeQueried'', Now, True]);

    Properties[1] := VarArrayOf([''QueryPerformance'', FTimeToQuery, True]);

    end;

    ```


    Properties is a variant array of variant arrays. This code snippet creates an
    array of two variants. Each variant in the array is an array of three values:
    the name of the optional parameter, the value of the parameter, and a Boolean
    value that indicates whether the optional parameter should be sent back to the
    server as part of the delta.


    In this example, FTimeToQuery is a private variable that is calculated using the
    following code:


    ```

    procedure TForm1.SQLDataSet1BeforeOpen(DataSet: TDataSet);

    begin

    FTimeToQuery := GetTickCount;

    end;


    procedure TForm1.SQLDataSet1AfterOpen(DataSet: TDataSet);

    begin

    FTimeToQuery := GetTickCount - FTimeToQuery;

    end;

    ```


    SQLDataSet1 is the underlying dataset for the TDataSetProvider.


    On the client, you can retrieve these values by using the following code:


    ```

    procedure TForm1.btnGetPropertiesClick(Sender: TObject);

    var

    QP: Word;

    TimeQueried: TDateTime;

    begin

    QP := ClientDataSet1.GetOptionalParam(''QueryPerformance'');

    TimeQueried := ClientDataSet1.GetOptionalParam(''TimeQueried'');

    ```'
