    function TDM.GetNextID( DataSet: TCustomClientDataSet; const PrimaryKey: string)
    : Integer; var CloneDS: TClientDataSet; begin CloneDS := TClientDataSet.Create(nil);
    try CloneDS.CloneCursor(DataSet, False); CloneDS.IndexFieldNames := PrimaryKey;
    CloneDS.First; if CloneDS.FieldByName(PrimaryKey).AsInteger > 0 then Result :=
    -1 else Result := CloneDS.FieldByName(PrimaryKey).AsInteger - 1; finally CloneDS.Free;
    end; end. // Connection events procedure TDM.SocketConnection1BeforeConnect(Sender:
    TObject); var Server: string; begin if InputQuery($ConnectCaption, $ConnectPrompt,
    Server) then SocketConnection1.Address := Server; end;

    ```


    The first two methods of interest are the DataModuleCreate and DataModuleDestroy
    methods. DataModuleCreate opens the cdsContacts table, which attempts to load
    local data from the file CONMAN.CDS because the component''s $FileName property
    is set to CONMAN.CDS. If the file does not exist, the program will display a blank
    screen—it doesn''t attempt to connect to the application server automatically.


    DataModuleDestroy closes the cdsContacts table and also the connection to the
    application server, if a connection was established. Because the cdsContacts.$FileName
    property is set, the program automatically writes the data to the file CONMAN.CDS.
    In addition, the todo dataset is stored in the same CDS file because it is a nested
    dataset of cdsContacts.'
