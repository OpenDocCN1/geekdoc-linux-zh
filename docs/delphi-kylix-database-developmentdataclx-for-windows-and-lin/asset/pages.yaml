  md: "SchemaPattern is an SQL pattern that is used to filter the data that's returned\
    \ in the result set. For instance, to return only columns that start with the\
    \ letter A, you could pass a SchemaPattern of A% to the call to SetSchemaInfo.\
    \ If you don't want to filter the result set, set SchemaPattern to an empty string.\n\
    \nWithin SchemaPattern, use a percent sign (% ) to match a string of any length\
    \ and an under- score (_) to match a single character. If you want to include\
    \ a percent sign or underscore in the pattern, double it up (%% or __).\n\nAfter\
    \ you've retrieved schema data for a database, you can use the same dataset to\
    \ run normal queries against the database by calling SetSchemaInfo with a SchemaType\
    \ of stNoSchema.\n\nListing 2.4 shows the complete source code for an example\
    \ program that can extract and dis- play schema information for a dbExpress database.\
    \ After the listing, I'll give just a quick overview of the code because most\
