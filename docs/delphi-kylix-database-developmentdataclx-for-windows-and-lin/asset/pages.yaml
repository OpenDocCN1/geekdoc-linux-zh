- pgno: 336
  md: "# ## Placing Components on the Remote Data Module\n\nRegardless of which remote\
    \ data module you create, it is now time to populate it with components.\n\nBasically,\
    \ the components that go on the remote data module are the same components that\
    \ you put on the server-side data module in Chapter 7—namely, the database connection\
    \ component, datasets, and providers.\n\nBecause we’re using dbExpress for these\
    \ examples, this means that you’ll populate the data module with a TSQLConnection,\
    \ one or more TSQLDataSet s, and one or more TDataSetProvider components. If you\
    \ were using BDE, ADO, or a third-party database server instead of dbExpress,\
    \ you would use the corresponding third-party connection and dataset components.\n\
    \n# ## Adding Methods to the Remote Data Module\n\nIn addition to serving data\
    \ in the form of datasets, remote data modules can also provide other services\
    \ to a client application. These services might include anything from returning\
    \ the server machine’s date and time to calculating pi to 1,000 decimal places.\n\
    \nTo add a method to the remote data module, right-click anywhere in the source\
    \ code editor for the remote data module. From the context menu, select the Add\
    \ to Interface menu item. The Add To Interface dialog appears.\n\nType the declaration\
    \ for the new method call in the Declaration edit box and click OK. Figure 8.7\
    \ shows a filled out Add To Interface dialog.\n\n![](img/fe651f295b5f960d5463c4fb581d2281_336_0.png)\n\
    \n**FIGURE 8.7**  \nAdding a method to a remote data module.\n\nWhen you click\
    \ OK, Delphi writes an empty method for you, using the declaration you just entered.\
    \ At this point, you need to flesh out the method call. The following code snippet\
    \ shows the simple GetServerTime method created in Figure 8.7.\n\n```\n```pascal\n\
    function TMethodsDM.GetServerTime: TDateTime;\nbegin\n  Result := Now;\nend;\n\
    ```\n```\n\nLater in this chapter, you’ll see how to call this method from a client\
    \ application."
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Callbacks


    In addition to receiving calls from a client, the server application can also
    make calls to a client application, using a callback interface.


    # NOTE


    > This section assumes that you have some knowledge of interfaces, what they are,
    and how to use them. If you do not have this knowledge, I suggest picking up a
    copy of my book, Delphi COM Programming.


    To create a callback interface, select View, Type Library from the Delphi main
    menu. The type library editor appears, shown in Figure 8.8.


    ![](img/fe651f295b5f960d5463c4fb581d2281_337_0.png)


    # FIGURE 8.8

    Creating a callback interface.


    Click the New Interface button (the first button on the toolbar) and name the
    new interface something original like `ITestCallback`. Now click the New Method
    toolbar button, and name the new method `Test`. To keep things simple, `Test`
    won''t take any parameters or return a result.


    Close the type library editor.


    Now that the server application knows about `ITestCallback`, you''ll need a way
    for the client to pass an `ITestCallback` interface to the server. This is accomplished
    by creating a method on the server that takes a parameter of type `ITestCallback`
    and saves the value in a variable local to the remote data module, like this:'
  merge: -1
  img_proc: true
- pgno: 338
  md: '```

    type

    TMethodsDM = class(TRemoteDataModule, IMethodsDM)

    ...

    private

    { Private declarations }

    FCallBack: ITestCallBack;

    ...

    end;

    ...

    procedure TMethodsDM.SetCallback(const Callback: ITeslCallback);

    begin

    FCallBack := Callback;

    end;

    ```


    The client application will call this method at some point to set up a callback
    interface with the server. The server can then make calls to the interface later.


    This technique is illustrated in the Methods sample application, presented later
    in this chapter in the section titled “A Complete Example.”


    > **NOTE**

    > Callbacks have a couple of limitations with certain types of connections (discussed
    later in this chapter, in the section titled “Creating the Client Application”).
    First, when using a socket connection, you must make sure to set TSocketConnection.SupportsCallback
    to True. In addition, the callback interface must derive from IDispatch. Second,
    TWebConnection and TSOAPConnection don’t support callbacks at all, so keep that
    in mind if you intend to use HTTP as the communication protocol between the client
    and server applications.


    # Creating the Application Server’s User Interface


    Usually, the application server will run on a dedicated server machine that is
    not being used as a workstation. Often nobody is sitting at the server to see
    error messages, enter data, respond to prompts, and so on. For that reason, the
    application server generally won’t have much of a user interface.


    However, it is often useful to provide a minimal user interface for the application
    server to display information such as how many users are logged in, database statistics,
    or other pertinent information. Even if you don’t want to distribute your application
    with this user interface, it can still be invaluable while debugging a multitier
    application to see a list of current connections to the server.


    Figure 8.9 shows an example of such a minimal user interface.'
  merge: -1
  img_proc: true
- pgno: 339
  md: "![](img/fe651f295b5f960d5463c4fb581d2281_339_0.png)\n\n# **Figure 8.9**\n\n\
    *Application server with minimal user interface.*\n\nTo create this interface,\
    \ all you need to do is notify the main form each time a remote data module is\
    \ created or destroyed. A reasonable place to do this is in the data module's\
    \ `OnCreate` and `OnDestroy` event handlers.\n\nListing 8.1 shows the source code\
    \ from the main form of the MethodsServer application server (presented a little\
    \ later in this chapter). This code is typical of the main form of an application\
    \ server.\n\n# **Listing 8.1** MethodsServer—MainForm.pas\n\n```\n```pascal\n\
    unit MainForm;\n\ninterface\n\nuses\n    Windows, Messages, SysUtils, Variants,\
    \ Classes, Graphics, Controls, Forms,\n    Dialogs, StdCtrls;\n\nconst\n    UM_CONNECT\
    \ = WM_USER + 1;\n\ntype\n    TfrmMain = class(TForm)\n        lb1Connections:\
    \ TLabel;\n    private\n        { Private declarations }\n        FConnections:\
    \ Integer;\n    procedure UpdateConnections;\n    procedure UMConnect(var Msg:\
    \ TMessage); message UM_CONNECT;\n    public\n        { Public declarations }\n\
    \    end;\n\nvar\n    frmMain: TfrmMain;\n\nimplementation\n```"
  merge: -1
  img_proc: true
- pgno: 340
  md: "# **LISTING 8.1** Continued\n\n```\n{$R \"dfm}\n\n{ TfrmMain }\n\nprocedure\
    \ TfrmMain.UMConnect(var Msg: TMessage);\nbegin\n  FConnections := FConnections\
    \ + Msg.WParam;\n  UpdateConnections;\nend;\n\nprocedure TfrmMain.UpdateConnections;\n\
    begin\n  if FConnections = 1 then\n    lblConnections.Caption := '1 connection'\n\
    \  else\n    lblConnections.Caption := IntToStr(FConnections) + ' connections';\n\
    end;\n\n```\n\nThe remote data module then calls the main form's Connect and Disconnect\
    \ methods on creation and destruction, as the following code snippet shows.\n\n\
    ```\nprocedure TMethodsDM.RemoteDataModuleCreate(Sender: TObject);\nbegin\n  PostMessage(frmMain.Handle,\
    \ UM_CONNECT, 1, 0); end;\n\nprocedure TMethodsDM.RemoteDataModuleDestroy(Sender:\
    \ TObject);\nbegin\n  PostMessage(frmMain.Handle, UM_CONNECT, -1, 0);\nend;\n\n\
    ```\n\n# **Preparing the Application Server for Testing**\n\nWhen you have finished\
    \ writing the application server, you should install it onto the server machine\
    \ and register it for testing. I highly recommend that you test it on your development\
    \ machine before moving it to another computer for testing, for a couple of very\
    \ good reasons:\n\n+   * When you first start creating application servers, you\
    \ may find that you make numerous mistakes. You'll frequently need to modify,\
    \ recompile, and redeploy the application server. It's a lot easier to do this\
    \ on your local development machine.\n+   * Your application server may be prone\
    \ to hang up or crash before it is debugged. It's a much better practice to crash\
    \ your development machine than to crash a production server."
  merge: -1
  img_proc: true
- pgno: 341
  md: 'After the application server is debugged locally, you should then move it to
    a server machine for further testing and debugging.


    For application servers implementing \texttt{TRemoteDataModule}, registering the
    server is a simple matter of running it once. Running the server automatically
    registers it with the computer. When you modify the application server or move
    it to a new directory or computer for testing, you should run it again.


    Other remote data modules, such as \texttt{TMtsDataModule} or \texttt{TCorbaDataModule},
    will require registering the server with MTS or CORBA.


    # ### Creating the Client Application


    Now that the application server has been created and registered, it''s time to
    create the client application.


    The client application is functionally identical to the applications created in
    the previous chapter, except that it doesn''t contain the server-side data module.
    In addition, the data module in the client application will contain a remote connection
    component, discussed in the following sections.


    To get the client application started, select File, New from the Delphi main menu,
    and then select Application (at this time, CLX applications don''t support DataSnap).


    Now create a data module, which will house the client datasets that retrieve data
    from the application server.


    # ### Connecting to a Local Database Connection


    In the previous chapter, you learned how to connect to a provider that is on the
    same form or data module as a client dataset. You also learned how to call \texttt{TCliantDataSet.SetProvider}
    at runtime to connect to a provider on a different form or data module.


    This section shows you how you can use the \texttt{TLocalConnection} component
    to connect to providers on different forms or data modules at design time.


    To set up a local connection, do the following:


    +   1. Drop a \texttt{TLocalConnection} on the data module that contains the server-side
    datasets and providers. \texttt{TLocalConnection} can be found on the DataSnap
    page of the component palette, along with the remote connection components.

    +   2. Add the server-side data module to the uses clause of the client-side data
    module.


    ![](img/fe651f295b5f960d5463c4fb581d2281_341_0.png)'
  merge: -1
  img_proc: true
- pgno: 342
  md: '+   3. In the client-side data module, set the client dataset''s RemoteServer
    property to the TLocalConnection component.

    +   4. In the client dataset''s ProviderName property, select the provider from
    the drop-down list.


    After you complete these steps, all you need to do is open the client dataset
    to pull the data from the database into the client dataset.


    The LocalConn application example, included with the source code for this book,
    shows the correct way to set up an application that uses a local connection to
    access data. Because almost no source code is in the application that isn’t generated
    by Delphi for you, I haven’t listed the source code here.


    # # Connecting to a Remote Database Connection


    Remote connection components allow you to access providers that are located in
    a separate executable from the client application. The server application may
    be located on the same machine or on a machine half a world away.


    Whereas the TLocalConnection component is placed on the server-side data module
    along with the dbExpress datasets and providers, remote connection components
    are placed on the client''s data module, along with the client dataset components.
    Delphi supports five types of remote connections.


    The following sections discuss the remote connection components supported by Delphi.


    # ## Socket Connections


    TSocketConnection uses sockets as a transport between the application server and
    client application. It is the simplest of the connection protocols to set up and
    use and is the one that is used in this book''s examples. No additional software
    or licensing fees are required when using sockets (other than the standard DataSnap
    licensing issues, which are discussed in Appendix A of this book). Also, sockets
    are supported by any machine that has a TCP/IP address.'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'TABLE 8.3 TSocketConnection Properties


    | Property | Description |

    | :--- | :--- |

    | Address | Specifies the IP address of the remote machine to connect to. You
    may specify the name of the remote machine instead of the IP address by setting
    the Host property rather than the Address property. |

    | Host | Specifies the name of the remote machine to connect to. You may specify
    the IP address of the remote machine instead of the name by setting the Address
    property rather than the Host property. |

    | InterceptGUID | Specifies the GUID of a COM object that intercepts data packets
    sent between the client and the application server. You may specify the ProgID
    of the COM object rather than the GUID by setting the InterceptName property instead
    of InterceptGUID. Data interceptors are discussed in the section titled “Intercepting
    Data Packets,” later in this chapter. |

    | InterceptName | Specifies the ProgID of a COM object that intercepts data packets
    sent between the client and the application server. You may specify the GUID of
    the COM object rather than the ProgID by setting the InterceptGUID property instead
    of InterceptName. Data interceptors are discussed in the section titled “Intercepting
    Data Packets,” later in this chapter. |

    | Port | Specifies the port that the socket server uses to listen to socket requests.
    By default, this is set to 211. |

    | ServerGUID | Specifies the GUID of the application server that the client will
    connect to. You can set the server name using the ServerName property instead
    of ServerGUID. |

    | ServerName | Specifies the name of the application server that the client will
    connect to. You can set the server GUID using the ServerGUID property instead
    of ServerName. |

    | SupportCallbacks | Set to True if your server supports callbacks to the client
    application. If this property is True, WinSock 2 must be present on the server
    machine. When False, the server machine does not require WinSock 2 to operate
    properly, but it also doesn’t support callbacks. |


    # The Socket Server


    To connect to a remote application server using sockets, you must run a socket
    server on the server machine. Although you can write your own socket server if
    you want, Delphi ships with a prewritten server named ScktSrvr. Source code for
    the server is included with the VCL source, so you can modify it or use it as
    a basis for writing your own server.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'You must run the socket server on the remote machine before attempting to connect
    to an application server using sockets. If you don’t run the socket server first,
    the attempted connection to the server will appear to hang and will eventually
    time out.


    # **Note**


    You can install the socket server as a service on a Windows NT machine by running
    `scktssrv -install` at the command prompt. To remove the service, run `scktssrv
    -uninstall`. After installing as a service, you must either reboot your computer
    or start the service manually before it will run the first time.


    The Borland socket server usually sits inconspicuously in the tray. However, you
    can double-click it to open the socket server, as Figure 8.10 shows.


    ![](img/fe651f295b5f960d5463c4fb581d2281_344_0.png)


    # **Figure 8.10**


    *Socket server enables you to set the port number and other properties for the
    socket server.*


    The default port on which the socket server listens is 211. Unless you have a
    good reason for doing so, you should leave it set to the default value. If you
    change the port, you will also need to change the `TSocketConnection` component
    in any client applications to use the same port.


    The intercept GUID can be set to the GUID of a COM object used to intercept data
    packets transferred between the client and server. The following section discusses
    this in more detail.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Intercepting Data Packets


    Some applications may deal with sensitive data, such as account numbers, and the
    like. By default, data transmitted between the server and client applications
    is not encrypted or compressed in any way, meaning that anyone bright enough to
    figure out how to listen in on the socket server port could obtain this data for
    himself.


    When using sockets, you can write a COM object that intercepts data being sent
    over the socket connection. This object can compress, encrypt, or otherwise modify
    the data to keep it from prying eyes.


    To implement an interceptor object, you need to perform the following steps:


    +   1. Write a COM object that implements the `IDataIntercept` interface. Because
    Delphi ships with a demo that shows how to write this object (located in `C:\Program
    Files\Borland\Delphi6\Demos\Midas\Intcpt`), I won’t duplicate that example in
    this book.

    +   2. Register the COM object on both the server machine and all client machines.

    +   3. Set the `TSocketConnection`''s `ServerName` property to the name of the
    application server.

    +   4. Inside the socket server, set the `Intercept Name` to the same name.

    +   5. Run the application as usual.


    You should debug your application without the interceptor to make sure it works
    correctly before adding the interceptor into the mix.


    # DCOM Connections


    A `TDCOMConnection` uses Distributed COM (DCOM) as its underlying protocol, tying
    it to the Windows operating system. DCOM is a little tricky to set up properly,
    especially if the application server isn’t running on a Windows domain server.


    I assume at this point that if you’re going to use `TDCOMConnection`, you know
    how to set up and use DCOM. If you need additional information on configuring
    DCOM, you can look in my COM book or see Dan Miser’s Web page at www.danismiser.com.


    Table 8.4 lists the most important properties for `TDCOMConnection`.


    TABLE 8.4 TDCOMConnection Properties


    | Property | Description |

    | :--- | :--- |

    | ComputerName | Specifies the name of the remote computer to connect to. If ComputerName
    is blank, TDCOMConnection assumes that the application server is located on the
    local machine. |

    | ServerGUID | Specifies the GUID of the application server that the client will
    connect to. You can set the server name using the ServerName property instead
    of ServerGUID. |'
  merge: -1
  img_proc: true
- pgno: 346
  md: '**TABLE 8.4** Continued


    | Property | Description |

    | :--- | :--- |

    | ServerName | Specifies the name of the application server that the client will
    connect to. You can set the server GUID using the ServerGUID property instead
    of ServerName. |


    # # HTTP Connections


    TwebConnection uses HTTP as its transport protocol, which makes it useful for
    writing applications that run over the Internet. HTTP offers some additional features
    over a socket connection so that you can take advantage of SSL security. Also,
    you can connect to a server computer that is located behind a firewall.


    When using a TwebConnection, you must be sure to redistribute the Web server application
    (httpsvr.dll) along with the server application. httpsvr.dll is an ISAPI extension
    that brokers the HTTP call from the client to the COM object on the server application.
    In addition, the client machine must contain a copy of wininet.dll. Wininet.dll
    is included with Internet Explorer version 3 and later.


    Table 8.5 lists the most important properties for TwebConnection.


    **TABLE 8.5** TwebConnection Properties


    | Property | Description |

    | :--- | :--- |

    | Password | Valid password used for authentication on the host machine. This
    may be left blank if the host does not require authentication. |

    | Proxy | Semicolon-delimited list of proxy servers that can be used to resolve
    the IP address of the host machine. |

    | ServerGUID | Specifies the GUID of the application server that the client will
    connect to. You can set the server name using the ServerName property instead
    of ServerGUID. |

    | ServerName | Specifies the name of the application server that the client will
    connect to. You can set the server GUID using the ServerGUID property instead
    of ServerName. |

    | URL | The URL used to locate httpsvr on the host machine. |

    | UserName | Valid username used for authentication on the host machine. This
    may be left blank if the host does not require authentication. |'
