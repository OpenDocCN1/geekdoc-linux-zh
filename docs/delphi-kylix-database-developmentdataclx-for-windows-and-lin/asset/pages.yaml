    Do not pass 0 as the second parameter to SetTraceCallbackEvent, or your callback
    event will never be called and you''ll rack your brains trying to figure out why
    callback events are not working.


    To remove a callback handler, execute the following line of code:


    ```

    SQLConnection1.SetTraceCallbackEvent(nil, 0);

    ```


    # TSQLMonitor


    TSQLMonitor provides a ready-made, easy-to-use mechanism for capturing database
    events. You can log database messages to a list box, a log file, or another destination
    as they occur. You can also allow messages to accumulate in the monitor''s internal
    buffer, and dump them to a file (or other destination) in one fell swoop.


    To use a TSQLMonitor, drop it on a form or data module, along with your TSQLConnection
    component. To begin logging events, set the monitor''s SQLConnection property
    to the TSQLConnection component and set the Active property to True.


    There are two ways to monitor database messages: You can elect to log each message
    as soon as TSQLMonitor is notified of it, or you can allow the component to buffer
    up the messages and save them to a log file or string list at a later time. The
    following sections explain these options.


    # Logging Messages as They Occur


    There are actually two different ways that you can log database messages as they
    occur. The first is through the use of TSQLMonitor''s AutoSave and FileName properties.
    Set FileName to'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'the name of the log file that you want to create, such as C:\\TRACE.LOG. Set
    AutoSave to True, and the component automatically logs all database messages to
    the specified filename. If the file does not exist, it is automatically created.
    If the file does exist, it is appended to.


    The second method of logging messages on the fly is to write an event handler
    for the OnTrace or OnLogTrace event. OnTrace is fired as soon as the component
    receives an indication that a message has passed between the application and the
    database server. The event handler looks like this:


    ```

    procedure TForm1.SQLMonitor1Trace(Sender: TObject; CBInfo: pSQLTRACEDesc;

    var LogTrace: Boolean);

    begin


    end;

    ```


    Inside the event handler, you can set LogTrace to False if, for some reason, you
    don''t want the message to be saved to the internal list. By default, the message
    is logged.


    OnLogTrace is fired after the message is added to the internal trace list. Its
    event handler looks like this:


    ```

    procedure TForm1.SQLMonitor1LogTrace(Sender: TObject; CBInfo: pSQLTRACEDesc);

    begin


    end;

    ```


    The parameters are the same as the first two parameters passed to the OnTrace
    event handler.


    # **Buffering Messages**


    Rather than dealing with each individual message as it arrives, you can allow
    them to be buffered in an internal list by the TSQLMonitor component. You can
    then save them to a file or to a string list at a later time.


    To save the list to a file, call the component''s SaveToFile method, like this:


    ```

    SQLMonitor1.SaveToFile(''C:\\EventList.LOG'');

    ```


    Alternatively, you can save the messages to a string list by accessing the TraceList
    property, which is a TStringList object containing the list of messages. By calling
    methods and/or properties on TraceList, you can access the individual lines in
    the list.


    # ## Using Multiple Feedback Mechanisms


    TSQLConnection is not designed to easily support sending database trace events
    to multiple destinations at the same time. In other words, you can''t use both
    a TSQLMonitor and a user-defined feedback event at the same time. So, if you want
    to assign a callback event, you should'
