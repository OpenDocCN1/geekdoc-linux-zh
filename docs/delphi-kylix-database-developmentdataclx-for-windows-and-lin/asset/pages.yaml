    # Summary


    This chapter discussed the dbExpress dataset component TSQLDataSet, including
    the following key concepts:


    +   - TSQLDataSet is a unidirectional, read-only, lightweight data access mechanism.
    It can be used to retrieve data from a table, query, or stored procedure in the
    database.

    +   - dbExpress datasets support two navigation options: moving to the beginning
    of the dataset and moving to the next record in the result set.

    +   - To retrieve data from a TSQLDataSet, you typically call the FieldByName
    method.

    +   - TSQLDataSet supports BLOB information. To improve query performance, you
    can set TSQLDataSet’s BlobSize property to specify the maximum amount of data
    to retrieve for each BLOB field.

    +   - To make repeated queries more efficient, you can parameterize them by creating
    a placeholder in the SQL statement. Then, you can set different values for this
    parameter. The SQL statement is prepared only once—the first time that it is executed.

    +   - To order the data that’s returned from the database, you can specify an
    ORDER BY clause in the dataset’s CommandText property.

    +   - You can easily set up master/detail relationships between tables and queries.

    +   - It is possible to use dbExpress datasets to retrieve detailed schema information
    for tables, queries, and stored procedures in a database.


    The following chapter begins a two-chapter exploration of client datasets.'
