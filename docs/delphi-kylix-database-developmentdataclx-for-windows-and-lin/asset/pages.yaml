- pgno: 170
  md: "# Disabling Data-Aware Components\n\nThis topic actually applies to all Delphi\
    \ datasets, but I’m discussing it within the context of client datasets because\
    \ you typically don’t connect data-aware components directly to a dbExpress dataset.\
    \ Usually, data-aware components are connected to a client dataset.\n\nAs you’ve\
    \ learned in this chapter, data-aware components actively track the current record\
    \ in the dataset that they’re connected to. Although this is usually a good thing,\
    \ at times you want to prevent data-aware components from updating. This happens\
    \ most often when you are scrolling through a dataset to perform an operation\
    \ on the records, and you don’t want to see all the data-aware components rapidly\
    \ updating as you do. For example, take a look at the following code snippet:\n\
    \n```\nvar\n    Bookmark: TBookmarkStr;\nbegin\n    Bookmark := ClientDataSet1.Bookmark;\n\
    \    try\n        ClientDataSet1.First;\n        while not ClientDataSet1.EOF\
    \ do begin\n            if ClientDataSet1.FieldName('Salary').AsFloat < 30000.0\
    \ then begin\n                ClientDataSet1.Edit;\n                ClientDataSet1.FieldName('Salary')\
    \ :=\n                    ClientDataSet1.FieldName('Salary').AsFloat * 1.05;\n\
    \                ClientDataSet1.Post;\n            end;\n            ClientDataSet1.Next;\n\
    \        end;\n    finally\n        ClientDataSet1.Bookmark := Bookmark);\n  \
    \  end;\nend;\n```\n\nThis code loops through all records in the dataset, giving\
    \ anyone who makes less than $30,000 per year a 5% raise.\n\nThere is nothing\
    \ wrong with this code from the standpoint that it does what it is intended to\
    \ do. It even remembers the current record so that it can reposition the dataset\
    \ correctly when it’s finished.\n\nThe problem with this code is that it’s slow.\
    \ If you run it against the 10,000 record employee dataset that we created in\
    \ the preceding chapter, you’ll see the grid scroll through all the records in\
    \ the dataset as they are updated. (The example application at the end of this\
    \ section shows this effect.)"
  merge: -1
  img_proc: true
- pgno: 171
  md: "The solution is to disable all data-aware components (namely, the TDBGrid)\
    \ attached to the dataset before beginning this operation. To do that, you simply\
    \ call the DisableControls method before performing the lengthy operation, and\
    \ then call EnableControls when you’re finished. The following code snippet shows\
    \ the updated procedure:\n\n```\n```\nvar\n  Bookmark: TBookmarkStr;\nbegin\n\
    \  ClientDataSet1.DisableControls;\n  try\n    Bookmark := ClientDataSet1.Bookmark;\n\
    \    try\n      ClientDataSet1.First;\n      while not ClientDataSet1.EOF do begin\n\
    \        if ClientDataSet1.FieldName('Salary').AsFloat < 30000.0 then begin\n\
    \          ClientDataSet1.Edit;\n          ClientDataSet1.FieldName('Salary').AsFloat\
    \ :=\n            ClientDataSet1.FieldName('Salary').AsFloat * 1.05;\n       \
    \   ClientDataSet1.Post;\n        end;\n        ClientDataSet1.Next;\n      end;\n\
    \    finally\n      ClientDataSet1.Bookmark := Bookmark;\n    end;\n  finally\n\
    \    ClientDataSet1.EnableControls;\n  end;\nend;\n```\n```\n\nAs this code snippet\
    \ shows, you want to wrap the code between the calls to DisableControls and EnableControls\
    \ in a try/finally block. If you don’t, and an exception occurs somewhere in the\
    \ code, the data-aware components cease to be updated.\n\nNote that the calls\
    \ to DisableControls and EnableControls are reference counted. If you call DisableControls\
    \ three times in your code, then you will need to call EnableControls three times\
    \ before data-aware controls are updated again.\n\nListing 4.3 contains the complete\
    \ source code for the Updates application.\n\n# **LISTING 4.3** Updates—MainForm.pas\n\
    \n```\n```pascal\nunit MainForm;\n\ninterface\n```\n```"
  merge: -1
  img_proc: true
