- pgno: 76
  md: "If you look at the VCL/CLX source code, you’ll see that `TSQLDataSet.Open`\
    \ resolves to a call to `TDataSet.Open`, which looks like this:\n\n```\n```\n\
    procedure TDataSet.Open;\nbegin\n    Active := True;\nend;\n```\n```\n\nIt’s a\
    \ matter of personal preference whether you make the method call to `Open`, or\
    \ set the `Active` property yourself. I find that I prefer the method call, but\
    \ either way is correct.\n\n# ## Closing a Dataset\n\nClosing a dataset is as\
    \ easy as opening one:\n\n```\n```\nSQLDataSet1.Close;\n```\n```\n\nor\n\n```\n\
    ```\nSQLDataSet1.Active := False;\n```\n```\n\nAgain, calling the `Close` method\
    \ does nothing except set `Active := False`, so feel free to adopt whichever method\
    \ you prefer.\n\n> NOTE\n> \n> Remember that closing the database connection also\
    \ closes all open datasets. So, if you have a number of open datasets (and you\
    \ are finished with the database connection), you can elect to simply close the\
    \ connection rather than closing all open datasets manually.\n\n# ## Retrieving\
    \ Field Contents from a Dataset\n\nWhen the dataset is open, you normally want\
    \ to access the individual columns (or fields) in the result set. To do this,\
    \ you typically call the `FieldByName` method, like this:\n\n```\n```\nShowMessage('The\
    \ name is ' + SQLDataSet1.FieldByName('Name').AsString);\n```\n```\n\nUsually,\
    \ you know the name of the field that you want to access (as shown in the preceding\
