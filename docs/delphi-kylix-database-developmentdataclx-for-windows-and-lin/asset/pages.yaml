  md: '# Retrieving Database Metadata


    TSQLConnection surfaces a handful of properties that enable you to retrieve basic
    schema information from the database, including table, field, index, stored procedure,
    and stored procedure parameter attributes. The following sections describe how
    to obtain each of these types of information from the database connection.


    # GetTableNames


    You can call GetTableNames to retrieve a list of the tables in the database, including
    user tables, system tables, views, and synonyms (Oracle databases only).


    TSQLConnection.GetTableNames is defined in sqliex.pas like this:


    ```

    procedure GetTableNames(List: TStrings; SystemTables: Boolean = False);

    ```


    The first parameter specifies the string list in which the table names are returned.
    Any existing strings in the list are cleared. The second parameter indicates whether
    to return only system tables.


    If the SystemTables parameter is set to True, only system tables are added to
    the list, regardless of the current setting for the TableScope property (shown
    in Table 1.4). If SystemTables is False, TableScope controls the types of tables
    that are added to the list.


    **TABLE 1.4** TableScope Settings


    | Property | Description |

    | :--- | :--- |

    | TsSynonym | Synonyms |

    | TsSysTable | System tables |

    | TsTable | Normal, user-defined tables |

    | TsView | Views |


    The following code snippet shows a typical call to GetTableNames:


    ```

    GetTableNames(ListBox1.Items, False);

    ```


    # GetFieldNames


    GetFieldNames is used to retrieve the names of all fields defined for a given
    table or view.

    GetFieldNames takes two parameters, and is defined like this:


    ```

    procedure GetFieldNames(const TableName: string; List: TStrings);

    ```'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Pass the table name for which you want to retrieve field names in the first
    parameter. The second parameter indicates the list in which the resulting field
    names are to be loaded. Any existing strings in the list are deleted.


    ```

    GetFieldNames(`CONTACTS`, ListBox1.Items);

    ```


    # GetIndexNames


    Similar to GetFieldNames, GetIndexNames is used to retrieve the names of all indexes
    defined on a given table. GetIndexNames is defined as follows:


    ```

    procedure GetIndexNames(const TableName: string; List: TStrings);

    ```


    As with GetFieldNames, TableName represents the table that you want to get index
    names for. List indicates the list in which the resulting index names are to be
    loaded. Any existing strings in the list are deleted.


    ```

    GetIndexNames(`CONTACTS`, ListBox1.Items);

    ```


    # GetProcedureNames


    To retrieve a list of stored procedures in a database, call the GetProcedureNames
    method. GetProcedureNames is defined like this:


    ```

    procedure GetProcedureNames(List: TStrings);

    ```


    Upon return from the procedure, List contains the list of stored procedure names.
    Any information previously stored in the list is deleted.


    ```

    GetProcedureNames(ListBox1.Items);

    ```


    # GetProcedureParams


    GetProcedureParams returns a list of parameters for a given stored procedure.
    It is defined like this:


    ```

    procedure GetProcedureParams(ProcedureName:string; List: TList);

    ```


    The first parameter, ProcedureName, specifies the name of the stored procedure
    that you want to retrieve parameter names for. The second parameter refers to
    a precreated TList in which the procedure parameters are returned. Upon return
    from the procedure, List contains a list of parameters for the stored procedure.


    List itself is not directly usable. You should call the helper function, LoadParamListItems,
    to convert the TList to a TParams object, which is a much easier structure to
    inspect.


    The following code snippet shows how to correctly retrieve parameters for the
    stored procedure named CONTACTSBYSTATE.'
  merge: -1
  img_proc: true
- pgno: 32
