- pgno: 190
  md: '# UndoLastChange


    You can undo the most recent change to the dataset (regardless of the record it
    was made to) by calling UndoLastChange.


    UndoLastChange takes a single Booleean parameter (FollowChange) that indicates
    whether the dataset should position itself to the record that was affected by
    the undo operation. If FollowChange is True, the client dataset positions its
    cursor to the record that was undone or restored. If FollowChange is False, the
    most recently modified record is still restored, but the current record is not
    changed.


    ```

    ClientDataSet1.First;

    ClientDataSet1.Next;

    ClientDataSet1.Edit;

    ClientDataSet1.FieldNameByName( ''Last'' ).AsString := ''Williams'';

    ClientDataSet1.Post;


    ClientDataSet1.First;

    ClientDataSet1.Next;

    ClientDataSet1.Edit;

    ClientDataSet1.FieldNameByName( ''Last'' ).AsString := ''Carter'';

    ClientDataSet1.Post;


    ClientDataSet1.Next;

    ClientDataSet1.Edit;

    ClientDataSet1.FieldNameByName( ''First'' ).AsString := ''Sam'';

    ClientDataSet1.Post;


    ClientDataSet.Last;


    ClientDataSet1.UndoLastChange(True);

    ```


    The preceding code snippet first modifies the second record in the dataset, then
    modifies the first record in the dataset, and then modifies the second record
    again. Finally, it moves to the end of the dataset. The call to UndoLastChange
    undoes only the second change to the second record, and repositions the dataset
    at the second record (because True was passed to UndoLastChange).


    If you were to issue a second call to UndoLastChange, the modification to the
    first record in the dataset would be undone. A third call to UndoLastChange would
    undo the first modification to the second record.


    # RevertRecord


    RevertRecord undoes all changes to the current record in the dataset. Modifying
    the preceding code snippet slightly, we get the following:'
  merge: -1
  img_proc: true
- pgno: 191
  md: "```\nClientDataSet1.First;\nClientDataSet1.Next;\nClientDataSet1.Edit;\nClientDataSet1.FieldName('Last').AsString\
    \ := 'Williams';\nClientDataSet1.Post;\n\nClientDataSet1.First;\nClientDataSet1.Edit;\n\
    ClientDataSet1.FieldName('Last').AsString := 'Carter';\nClientDataSet1.Post;\n\
    \nClientDataSet1.Next;\nClientDataSet1.Edit;\nClientDataSet1.FieldName('First').AsString\
    \ := 'Sam';\nClientDataSet1.Post;\n\nClientDataSet.First;\nClientDataSet.Next;\n\
    \nClientDataSet.RevertRecord;\n```\n\nThis code makes the same three changes that\
    \ the previous code snippet made. It then moves off the second record and back\
    \ onto it. (This is just for the purpose of demonstration—You don't need to do\
    \ it.) Finally, the call to `RevertRecord` undoes both changes that were made\
    \ to the second record, but it leaves the change to the first record intact.\n\
    \n# SavePoint\n\n`SavePoint` provides a means of establishing a baseline for database\
    \ operations, and then returning to that baseline at a later point in time.\n\n\
    For example, assume that the user made a change to a dataset. He then wants to\
    \ experiment with some other changes, but isn't sure that he wants to save the\
    \ results. After the first change, you could retrieve the current value of `SavePoint`,\
    \ like this:\n\n```\nvar\n  Baseline : Integer;\nbegin\n  Baseline := ClientDataSet.SavePoint;\n\
    ```\n\nLater, after making modifications to the database, you can return to the\
    \ baseline by setting the `SavePoint` property:\n\n```\nClientDataSet.SavePoint\
    \ := Baseline;\n```\n\nSetting `SavePoint` discards all changes made to the dataset\
    \ after the baseline was established."
  merge: -1
  img_proc: true
- pgno: 192
  md: "You can also retrieve multiple savepoints, like this:\n\n```\n```\nvar\n  Baseline1:\
    \ Integer;\n  Baseline2: Integer;\nbegin\n  Baseline1 := ClientDataSet.SavePoint;\n\
    \  // Perform more dataset work here\n  Baseline2 := ClientDataSet.SavePoint;\n\
    ```\n```\n\nBe careful when using SavePoint along with RevertRecord or UndoLastChange.\
    \ If you retrieve a SavePoint, and then undo your most recent modifications past\
    \ the point of the save, an exception is raised. The following code, shown in\
    \ Listing 4.6, is just asking for trouble:\n\n# **LISTING 4.6** Incorrect Use\
    \ of SavePoints\n\n```\n```\nClientDataSet1.First;\nClientDataSet1.Next;\nClientDataSet1.Edit;\n\
    ClientDataSet1.FieldByName('Last').AsString := 'Williams';  // Change 1\nClientDataSet1.Post;\n\
    \nClientDataSet1.First;\nClientDataSet1.Edit;\nClientDataSet1.FieldByName('Last').AsString\
    \ := 'Carter';   // Change 2\nClientDataSet1.Post;\n\nBaseline := ClientDataSet1.SavePoint;\
    \  // 2 changes on the \"stack\"\n\nClientDataSet1.Next;\nClientDataSet1.Edit;\n\
    ClientDataSet1.FieldByName('First').AsString := 'Sam';    // Change 3\nClientDataSet1.Post;\n\
    \nClientDataSet1.UndoLastChange(True);  // 2 changes on the \"stack\"\nClientDataSet1.UndoLastChange(True);\
    \  // 1 change on the \"stack\"\nClientDataSet1.SavePoint := Baseline;  // Exception\
    \ is raised here\n```\n```\n\nIn this code snippet, two changes are made, and\
    \ then a baseline is established. Next, a third change is made, and then the third\
    \ and second changes are undone. Finally, the code attempts to revert to the save\
    \ point. Because the change log has been reversed past the point of the save point,\
    \ Delphi raises an exception."
  merge: -1
  img_proc: true
- pgno: 193
  md: "# CancelUpdates\n\nThe final level of undo support is undoing all changes in\
    \ the change log. To do this, simply call `CancelUpdates`, like this:\n\n```\n\
    ClientDataSet1.CancelUpdates;\n```\n\n`CancelUpdates` discards all changes made\
    \ to all records in the dataset by clearing the change log.\n\n# ChangeCount\n\
    \nYou can determine how many changes were made to the dataset by looking at the\
    \ `ChangeCount` property:\n\n```\nif ClientDataSet1.ChangeCount > 0 then\n   ShowMessage('It\
    \ is okay to call UndoLastChange');\n```\n\n# MergeChangeLog\n\nAt some point\
    \ in your application, you might want to merge changes in with the data to commit\
    \ any modifications that were made to the dataset. To do this, call `MergeChangeLog`.\
    \ `MergeChangeLog` takes no parameters.\n\n# NOTE\n\nWhen a client dataset is\
    \ connected to a provider, you seldom call `MergeChangeLog` directly. Instead,\
    \ you call `ApplyUpdates`, which makes a call to `MergeChangeLog` after the changes\
    \ have been applied to the underlying dataset.\n\n# StatusFilter\n\nThe `StatusFilter`\
    \ property provides for a type of filter on the dataset, but I didn't discuss\
    \ it in the “Ranges and Filters” section because it relates directly to the change\
    \ log.\n\nAs records are added, modified, or deleted in a client dataset, they\
    \ are tagged with a status. That status can be one (or more) of the values shown\
    \ in Table 4.4.\n\n# TABLE 4.4   UpdateStatus Values\n\n| Value | Description\
    \ |\n| :--- | :--- |\n| `usUnmodified` | The record has not been modified in any\
    \ way. |\n| `usInserted` | The record has been newly inserted into the dataset.\
    \ |\n| `usModified` | The record was modified. |\n| `usDeleted` | The record was\
    \ deleted. |"
  merge: -1
  img_proc: true
- pgno: 194
  md: "If you would like to view only those records that have been added to the dataset,\
    \ you can set `StatusFilter` to `usInserted`. To view only added or modified records,\
    \ set `StatusFilter` to `usInserted, usModified`.\n\n# Viewing the Change Log\n\
    \nBecause, in reality, the change log is just another dataset, you can view it\
    \ in a grid just like you can with any other dataset. To do this, you need to\
    \ assign the change log from the data of one dataset to the data of another dataset,\
    \ like this:\n\n```\ncdsChangeLog.Data := C1ientDataSet1.Delta;\n```\n\nIf `C1ientDataSet1`'s\
    \ change log is empty, this statement causes a `Delta is empty` exception to be\
    \ raised. So, you should always check the `ChangeCount` property before attempting\
    \ to do this.\n\nThe following sample application demonstrates the techniques\
    \ discussed in this section. Listing 4.7 contains the source code for the main\
    \ form of the application.\n\n# LISTING 4.7 ChangeLog—MainForm.pas\n\n```\nunit\
