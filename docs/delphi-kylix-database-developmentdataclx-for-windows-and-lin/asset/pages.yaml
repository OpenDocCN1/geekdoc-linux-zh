- pgno: 364
  md: '# Overview of the Code


    ConMan is separated into an application server and a client, providing true multitier
    functionality.


    The entire source code for ConMan is contained in seven units—two of which Delphi
    automatically writes for us. The server-side source units include the following:


    +   - `MainForm.pas` Contains the code for the main form of the server (which
    does nothing but show us the number of clients currently connected).

    +   - `RemoteDataModule.pas` Houses the remote data module where the database
    connection components reside.

    +   - `ConManServer_TLB.pas` Type library import file for the application server.
    Delphi automatically creates and maintains this unit.


    The client application is composed of the following units:


    +   - `DataModule.pas` Client-side data module, including DataSnap components
    and `TClientDataSets`.

    +   - `RecErrorForm.pas` Form to handle reconciliation errors. This form is automatically
    generated by Delphi (see Chapter 7 for more information on handling reconciliation
    errors).

    +   - `MainForm.pas` The application’s main form.

