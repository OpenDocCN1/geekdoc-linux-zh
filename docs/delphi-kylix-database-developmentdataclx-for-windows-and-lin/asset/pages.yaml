  md: 'Table 2.5 lists the columns that are returned for a schema type of *stColumns*.


    TABLE 2.5 stColumns Schema Columns


    | Column | Description |

    | :--- | :--- |

    | RECNO | The absolute record number. It is one for the first record, two for
    the second, and so on. |

    | CATALOG_NAME | The name of the catalog, or database, that contains the table.
    |

    | SCHEMA_NAME | The owner of the column. |

    | TABLE_NAME | The name of the table containing the column. |

    | COLUMN_NAME | The name of the column. |

    | COLUMN_POSITION | The zero-based position of the column in the table definition.
    |

    | COLUMN_TYPE | A bitmapped value that represents the type of column. See Listing
    2.4, or the source code for DBXpress.pas, for an explanation of the possible values
    for this field. |

    | COLUMN_DATATYPE | The logical field type. See Listing 2.4, or the source code
    for DBXpress.pas, for an explanation of the possible values for this field. |

    | COLUMN_TYPENAME | The SQL column type (VARCHAR, BLOB, or the like). |

    | COLUMN_SUBTYPE | The logical field subtype. See Listing 2.4, or the source code
    for DBXpress.pas, for an explanation of the possible values for this field. |

    | COLUMN_LENGTH | The size of the column in bytes. |

    | COLUMN_PRECISION | The precision of the column. It varies by column type. For
    example, it is the number of characters for strings, and it is the number of significant
    digits for BCD values. |

    | COLUMN_SCALE | The numeric scale. It is the number of digits to the right of
    the decimal point for BCD columns. |

    | COLUMN_NULLABLE | It is one if the column can contain NULL values, and zero
    if it cannot contain NULL values. |


