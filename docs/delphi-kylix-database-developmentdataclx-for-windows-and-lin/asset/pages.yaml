    \ application that works with any dbExpress-supported database or table, you might\
    \ not know in advance what columns are in the table that you are accessing. In\
    \ those cases, you can access the `Fields` object directly, like this:\n\n```\n\
    ```\nShowMessage('The first field’s contents are: ' +\n```\n```"
