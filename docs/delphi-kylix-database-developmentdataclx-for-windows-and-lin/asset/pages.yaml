  md: "# LISTING 5.3  Continued\n\n```\nconstructor TETHDBDateTimePicker.Create(AOwner:\
    \ TComponent);\nbegin\n    inherited Create(AOwner);\n\n    ControlStyle := ControlStyle\
    \ + [csReplicable];\n    FDataLink := TFIELDDataLink.Create;\n    FDataLink.Control\
