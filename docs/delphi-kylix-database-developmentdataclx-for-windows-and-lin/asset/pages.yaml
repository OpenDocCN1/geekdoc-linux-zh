    # ## Lookup Fields


    Lookup fields are similar, in concept, to calculated fields because they aren''t
    physically stored in the dataset. However, instead of requiring you to calculate
    the value of a lookup field, Delphi gets the value from another dataset. Let''s
    look at an example.


    Earlier, we created a Department field in our dataset. Let''s create a new Department
    dataset to hold department information.


    Drop a new TClientDataSet component on your form and name it cdsDepartment. Add
    two fields: Dept (an integer) and Description (a 30-character string).


    Show the field editor for the cdsEmployee dataset by double-clicking the dataset.
    Open the New Field dialog. Name the field DepartmentName, and give it a Type of
    String and a Size of 30.


    In the Field Type radio group, select Lookup. Notice that two of the fields in
    the Lookup definition group box are now enabled. In the Key Fields combo, select
    Department. In the Dataset combo, select cdsDepartment.


    At this point, the other two fields in the Lookup definition group box are accessible.
    In the Lookup Keys combo box, select Dept. In the Result Field combo, select Description.
    The completed dialog should look like the one shown in Figure 3.4.'
