    # ## **Summary**


    This chapter introduced you to providers and multitier database development, including
    the following key concepts:


    +   * A `DatasetProvider` is a conduit between a client dataset and an external
    data store. It provides data to the client dataset on request and resolves data
    back to the database when the client applies updates.

    +   * You need to call the client dataset''s `ApplyUpdates` method to save changes
    to a database permanently.

    +   * For greatest control over reconciliation errors, you should provide an event
    handler for the client dataset''s `OnReconcileError` event. Delphi comes with
    a prewritten function, named `HandleReconcileError`, that you can use to facilitate
    this process.

    +   * By calling `TClientDataSet.Refresh`, you can ensure that the client always
    has the latest copy of the data from the server.

    +   * You can set the provider''s update mode to `upWhereAll`, `upWhereChanged`,
    or `upWhereKeyOnly` for finer control over how each record is updated.

    +   * You can take advantage of numerous provider options and events for finer
    control over the entire provide/resolve process.

    +   * When creating a master/detail relationship on the server-side components,
    the client dataset will represent that relationship as a nested dataset.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '+   - By handling the provider''s `OnGetTableName` event, you can update data
    returned from a stored procedure.


    +   - By handling the provider''s `BeforeUpdateRecord` event, you can update data
    returned from a join operation.


    +   - You can call `TClientDataSet.SetProvider` at runtime to establish a connection
    between client datasets and providers on different forms or data modules.


    +   - To replace separate `TSQLDataSet`, `TDataSetProvider`, and `TClientDataSet`
    components, use `TSQLClientDataSet`.


    +   - To limit the amount of data returned by the server at a single time, set
    the provider''s `poFetchBlobsOnDemand` and/or `poFetchDetailsOnDemand` options,
    and then call `TClientDataSet.FetchBlobs` or `TClientDataSet.FetchDetails` manually.


    The next chapter expands on this discussion to show you how to create a multitier
    application with separate server and client executables.'
  merge: -1
  img_proc: true
