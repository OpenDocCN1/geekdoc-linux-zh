- pgno: 110
  md: "That's enough fields for this dataset. In the next section, I'll show you how\
    \ to create a calculated field.\n\n# ## Calculated Fields\n\nCalculated fields,\
    \ as indicated previously, don't take up any physical space in the dataset. Instead,\
    \ they are calculated on-the-fly from other data stored in the dataset. For example,\
    \ you might create a calculated field that adds the values of two data fields\
    \ together. In this section, we'll create two calculated fields: one standard\
    \ and one internal.\n\n> **NOTE**\n> \n> Actually, internal calculated fields\
    \ do take up space in the dataset, just like a standard data field. For that reason,\
    \ you can create indexes on them like you would on a data field. Indexes are discussed\
    \ later in this chapter.\n\n# ### Standard Calculated Fields\n\nIn this section,\
    \ we'll create a calculated field that computes an annual bonus, which we'll assume\
    \ to be five percent of an employee's salary.\n\nTo create a standard calculated\
    \ field, open the New Field dialog (as you did in the preceding section). Enter\
    \ a Name of Bonus and a Type of Currency.\n\nIn the Field Type radio group, select\
    \ Calculated. This instructs Delphi to create a calculated field, rather than\
    \ a data field. Click OK.\n\nThat's all you need to do to create a calculated\
    \ field. Now, let's look at internal calculated fields.\n\n# ### Internal Calculated\
    \ Fields\n\nCreating an internal calculated field is almost identical to creating\
    \ a standard calculated field. The only difference is that you select InternalCalc\
    \ as the Field Type in the New Field dialog, instead of Calculated.\n\nAnother\
    \ difference between the two types of calculated fields is that standard calculated\
    \ fields are calculated on-the-fly every time their value is required, but internal\
    \ calculated fields are calculated once and their value is stored in RAM. (Of\
    \ course, internal calculated fields recalculate automatically if the underlying\
    \ fields that they are calculated from change.)\n\nThe dataset's AutoCalcFields\
    \ property determines exactly when calculated fields are recomputed. If AutoCalcFields\
    \ is True (the default value), calculated fields are computed when the dataset\
    \ is opened, when the dataset enters edit mode, and whenever focus in a form moves"
  merge: -1
  img_proc: true
- pgno: 111
  md: "from one data-aware control to another and the current record has been modified.\
    \ If AutoCalcFields is False, calculated fields are computed when the dataset\
    \ is opened, when the dataset enters edit mode, and when a record is retrieved\
    \ from an underlying database into the dataset.\n\nThere are two reasons that\
    \ you might want to use an internal calculated field instead of a standard calculated\
    \ field. If you want to index the dataset on a calculated field, you must use\
    \ an internal calculated field. (Indexes are discussed in detail later in this\
    \ chapter.) Also, you might elect to use an internal calculated field if the field\
    \ value takes a relatively long time to calculate. Because they are calculated\
    \ once and stored in RAM, internal calculated fields do not have to be computed\
    \ as often as standard calculated fields.\n\nLet’s add an internal calculated\
    \ field to our dataset. The field will be called Name, and it will concatenate\
    \ the FirstName and LastName fields together. We probably will want an index on\
    \ this field later, so we need to make it an internal calculated field.\n\nOpen\
    \ the New Field dialog, and enter a Name of Name and a Type of String. Set Size\
    \ to 52 (which accounts for the maximum length of the last name, plus the maximum\
    \ length of the first name, plus a comma and a space to separate the two).\n\n\
    In the Field Type radio group, select InternalCalc and click OK.\n\n# ## Providing\
    \ Values for Calculated Fields\n\nAt this point, we’ve created our calculated\
    \ fields. Now we need to provide the code to calculate the values. TClientDataSet,\
    \ like all Delphi datasets, supports a method named OnCalcFields that we need\
    \ to provide a body for.\n\nClick the client dataset again, and in the Object\
    \ Inspector, click the Events tab. Double-click the OnCalcFields event to create\
    \ an event handler.\n\nWe’ll calculate the value of the Bonus field first. Flesh\
    \ out the event handler so that it looks like this:\n\n```\n```\nprocedure TForm1.cdsEmployeeCalcFields(DataSet:\
    \ TDataSet);\nbegin\n  cdsEmployeeBonus.AsFloat := cdsEmployeeSalary.AsFloat *\
    \ 0.05;\nend;\n```\n```\n\nThat’s easy— we just take the value of the Salary field,\
    \ multiply it by five percent (0.05), and store the value in the Bonus field.\n\
    \nNow, let’s add the Name field calculation. A first (reasonable) attempt looks\
    \ like this:\n\n```\n```\nprocedure TForm1.cdsEmployeeCalcFields(DataSet: TDataSet);\n\
    begin\n  cdsEmployeeBonus.AsFloat := cdsEmployeeSalary.AsFloat * 0.05;\n```\n\
    ```"
  merge: -1
  img_proc: true
