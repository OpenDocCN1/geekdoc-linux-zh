    # # Filters and Ranges


    Filters and ranges provide a means of limiting the amount of data that is visible
    in the dataset, similar to a `WHERE` clause in a SQL statement. The main difference
    between filters, ranges, and the `WHERE` clause is that when you apply a filter
    or a range, it does not physically change which data is contained in the dataset.
    It only limits the amount of data that you can see at any given time.


    # ## Ranges


    Ranges are useful when the data that you want to limit yourself to is stored in
    a consecutive sequence of records. For example, say a dataset contains the data
    shown in Table 3.4.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# **TABLE 3.4** Sample Data for Ranges and Filters


    | ID | Name | Birthday | Salary |

    | :--- | :--- | :--- | :--- |

    | 4 | Bill Peterson | 3/28/1957 | $60,000.00 |

    | 2 | Frank Smith | 8/25/1963 | $48,000.00 |

    | 3 | Sarah Johnson | 7/5/1968 | $52,000.00 |

    | 1 | John Doe | 5/15/1970 | $39,000.00 |

    | 5 | Paula Wallace | 1/15/1971 | $36,500.00 |


    The data in this much-abbreviated table is indexed by birthday. Ranges can only
    be used when there is an active index on the dataset.


    Assume that you want to see all employees who were born between 1960 and 1970.
    Because the data is indexed by birthday, you could apply a range to the dataset,
    like this:


    ```

    ClientDataSet1.SetRange([''1/1/1960'', [''12/31/1970'']]);

    ```


    Ranges are *inclusive*, meaning that the endpoints of the range are included within
    the range. In the preceding example, employees who were born on either January
    1, 1960 or December 31, 1970 are included in the range.


    To remove the range, simply call CancelRange, like this:


    ```

    ClientDataSet1.CancelRange;

    ```


    # **Filters**


    Unlike ranges, filters do not require an index to be set before applying them.
    Client dataset filters are powerful, offering many SQL-like capabilities, and
    a few options that are not even supported by SQL. Tables 3.5–3.10 list the various
    functions and operators available for use in a filter.


    # **TABLE 3.5** Filter Comparison Operators


    | Function | Description | Example |

    | :--- | :--- | :--- |

    | = | Equality test | Name = ''John Smith'' |

    | <> | Inequality test | ID <> 100 |

    | < | Less than | Birthday < ''1/1/1980'' |

    | > | Greater than | Birthday > ''12/31/1960'' |

    | <= | Less than or equal to | Salary <= 80000 |

    | >= | Greater than or equal to | Salary >= 40000 |'
  merge: -1
  img_proc: true
- pgno: 140
  md: "# **TABLE 3.5**  Continued\n\n| Function | Description | Example |\n| :---\
    \ | :--- | :--- |\n| BLANK | Empty string field (not used to test for NULL values)\
    \ | `Name = BLANK` |\n| IS NULL | Test for NULL value | `Birthday IS NULL` |\n\
    | IS NOT NULL | Test for non-NULL value | `Birthday IS NOT NULL` |\n\n# **TABLE\
    \ 3.6**  Filter Logical Operators\n\n| Function | Example |\n| :--- | :--- |\n\
    | And | `(Name = 'John Smith') and (Birthday = '5/16/1964')` |\n| Or | `(Name\
    \ = 'John Smith') or (Name = 'Julie Mason')` |\n| Not | `Not (Name = 'John Smith')`\
    \ |\n\n# **TABLE 3.7**  Filter Arithmetic Operators\n\n| Function | Description\
    \ | Example |\n| :--- | :--- | :--- |\n| + | Addition. Can be used with numbers,\
    \ strings, or dates/times. | `Birthday + 30 < '1/1/1960'`  \n`Name + 'X' = 'SmithX'`\
    \  \n`Salary + 10000 = 100000` |\n| – | Subtraction. Can be used with numbers\
    \ or dates/times. | `Birthday - 30 > '1/1/1960'`  \n`Salary - 10000 > 40000` |\n\
    | * | Multiplication. Can be used with numbers only. | `Salary * 0.10 > 5000`\
    \ |\n| / | Division. Can be used with numbers only. | `Salary / 10 > 500` |\n\n\
    # **TABLE 3.8**  Filter String Functions\n\n| Function | Description | Example\
    \ |\n| :--- | :--- | :--- |\n| Upper | Uppercase | `Upper (Name) = 'JOHN SMITH'`\
    \ |\n| Lower | Lowercase | `Lower(Name) = 'john smith'` |\n| SubString | Return\
    \ a portion of a string | `SubString(Name,6) = 'Smith'`  \n`SubString(Name,1,4)\
    \ = 'John'` |\n| Trim | Trim leading and trailing characters from a string | `Trim(Name)`\
    \  \n`Trim(Name, '.', '.')` |"
