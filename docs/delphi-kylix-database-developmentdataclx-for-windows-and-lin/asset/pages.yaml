  md: '# ## Dedication


    *For my wife, Tina.*


    # ## Acknowledgments


    Writing a book isn’t a one-man (or woman) operation, and I would like to thank
    the people who helped take this book from the concept stage to reality.


    Once again, Karen Wachs at Sams worked with me on this book from beginning to
    end. She patiently led me through the process of writing my first book and was
    back to assist on this one, also. She’s a pleasure to work with. Thanks, Karen!
    I also want to thank Katie Robinson and Chip Gardner, who copyedited the text
    and fixed up my typos and grammatical errors.


    Thanks to Heather McNeill, who oversaw this book through all its stages of production
    and helped to make sure that things ran smoothly; and to Laurie McGuire, who suggested
    ways to improve the flow of the text and otherwise ensured that the overall quality
    of the book was up to par.


    I’d like to say a special thanks to my technical reviewers, Dan Miser and Ramesh
    Theivendran, both Borland employees, who provided large quantities of extremely
    helpful feedback and pointed out where I made technical mistakes. Ramesh is one
    of the key dbExpress engineers, and Dan is well known for his MIDAS expertise.
    In addition, Philippine Bruno provided valuable and timely technical review of
    the final chapter and appendixes. I couldn’t have asked for better tech reviewers.


    With all these people assisting me, I have made every attempt to fix all errors,
    both technical and typographical, that may have originally appeared in the manuscript.
    *Writing a book* is a very complex process, and inevitably, some errors will have
    survived. Any errors that remain are, of course, my own fault.


    My apologies to anyone who I may have inadvertently omitted. A number of people
    worked on this book that I never had direct contact with, so I don’t know them
    individually. Thanks to all those whose names I didn’t specifically mention.'
