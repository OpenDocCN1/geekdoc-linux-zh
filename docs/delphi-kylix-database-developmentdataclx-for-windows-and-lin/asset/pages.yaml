- pgno: 273
  md: "# **Listing 6.3** Continued\n\n```\nproperty OnColumnSized: TNotifyEvent\n\
    \  read FOnColumnSized write FOnColumnSized;\nend;\n\nprocedure Register;\n\n\
    implementation\n\nprocedure Register;\nbegin\n  RegisterComponents('ETH', [TETHDBGrid]);\n\
    end;\n\n{ TETHDBGrid }\n\nprocedure TETHDBGrid.ColWidthsChanged;\nbegin\n  inherited\
    \ ColWidthsChanged;\n\n  if Assigned(FOnColumnSized) then\n    FOnColumnSized(Self);\n\
    end;\n\nend.\n```\n\nThe overriden method, ColWidthsChanged, calls the inherited\
    \ version, and then fires the OnColumnSized event (if you provide an event handler\
    \ for it in your application).\n\nThis code does nothing more than notify you\
    \ that a column was resized. It doesn't tell you which column was resized, what\
    \ the old width was, or what the new width is. Providing that additional information\
    \ would require a lot more work and duplicate a good deal of code that is in TDBGrid.\
    \ I prefer to keep my descendent components simple and direct.\n\n> **Note**\n\
    > \n> TClientDataSetGrid (discussed later in this chapter) does not provide this\
    \ event handler, either. So, if you intend to use TClientDataSetGrid instead of\
    \ TDBGrid in your applications, you might want to change the code shown here so\
    \ that it derives from TClientDataSetGrid."
