  md: "# ## Parameterized Queries\n\nIn most of the examples shown so far in this\
    \ chapter, when querying the database, the entire query was specified. For example,\
    \ `SELECT * FROM CONTACTS WHERE COUNTRY = 'United States'`\n\nAlthough this works,\
    \ it is less than efficient if you are going to execute the same general query\
    \ multiple times. For example, say that you want to first retrieve all the contacts\
    \ in the United States, and then all the contacts in Canada, and finally all the\
    \ contacts in Mexico. You could write something like the following:\n\n```\n```csharp\n\
    SQLOleDataSet1.CommandType := ctQuery;\nSQLOleDataSet1.CommandText := 'SELECT\
    \ * FROM CONTACTS '\n    + 'WHERE COUNTRY = \"United States\"';\nSQLOleDataSet1.Open;\n\
    ProcessDataSet;\nSQLOleDataSet1.Close;\n```\n```\n\n```\n```csharp\nSQLOleDataSet1.CommandText\
    \ := 'SELECT * FROM CONTACTS WHERE COUNTRY = \"Canada\"';\nSQLOleDataSet1.Open;\n\
    ProcessDataSet;\nSQLOleDataSet1.Close;\n```\n```\n\n```\n```csharp\nSQLOleDataSet1.CommandText\
    \ := 'SELECT * FROM CONTACTS WHERE COUNTRY = \"Mexico\"';\nSQLOleDataSet1.Open;\n\
    ProcessDataSet;\n```\n```\n\nIn this example, ProcessDataSet is some fictitious\
    \ method that would operate on the results of the query in some manner.\n\nAlthough\
    \ the preceding code works correctly, it is far from optimal. Each time SQLOleDataSet1.CommandText\
    \ is set, the backend database engine must parse and prepare the SQL statement.\
    \ A better way to accomplish the same result is to parameterize the query, like\
    \ this:\n\n```\n```csharp\nSQLOleDataSet1.CommandText := 'SELECT * FROM CONTACTS\
    \ WHERE COUNTRY = :Country';\n```\n```\n\nThis sets up a parameter named Country\
    \ which acts like a placeholder in the SQL statement. By setting various values\
    \ for this parameter, you can issue the same SQL statement for different countries,\
    \ like this:\n\n```\n```csharp\nSQLOleDataSet1.CommandType := ctQuery;\nSQLOleDataSet1.CommandText\
    \ := 'SELECT * FROM CONTACTS WHERE COUNTRY = :Country';\nSQLOleDataSet1.ParamByName('Country').AsString\
    \ := 'United States';\nSQLOleDataSet1.Open;\nProcessDataSet;\n```\n```"
