  md: '# **TABLE 3.8** Continued


    | Function | Description | Example |

    |---|---|---|

    | TrimLeft | Trim leading characters from a string | TrimLeft(Name, ".") |

    | TrimRight | Trim trailing characters from a string | TrimRight(Name, ".") |


    # **TABLE 3.9** Filter Date/Time Functions


    | Function | Description | Example |

    |---|---|---|

    | Year | Returns the year portion of a date value. | Year(Birthday) = 1970 |

    | Month | Returns the month portion of a date value. | Month(Birthday) = 1 |

    | Day | Returns the day portion of a date value. | Day(Birthday) = 15 |

    | Hour | Returns the hour portion of a time value in 24-hour format. | Hour(Appointment)
    = 18 |

    | Minute | Returns the minute portion of a time value. | Minute(Appointment) =
    30 |

    | Second | Returns the second portion of a time value. | Second(Appointment) =
    0 |

    | GetDate | Returns the current date and time. | Appointment < GetDate |

    | Date | Returns the date portion of a date/time value. | Date(Appointment) |

    | Time | Returns the time portion of a date/time value. | Time(Appointment) |


    # **TABLE 3.10** Other Filter Functions and Operators


    | Function | Description | Example |

    |---|---|---|

    | LIKE | Partial string comparison. | Name LIKE ''%Smith%'' |

    | IN | Tests for multiple values. | Year(Birthday) IN (1960, 1970, 1980) |

    | * | Partial string comparison. | Name = ''John*'' |'
