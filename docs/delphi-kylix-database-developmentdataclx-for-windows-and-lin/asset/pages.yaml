- pgno: 39
  md: "TSQLConnection returns for tables, fields, indexes, and stored procedures is\
    \ their names. In the following chapter, I’ll show you how to retrieve much more\
    \ detailed schema information from a database.\n\n# # Executing DDL and DML Statements\n\
    \nThe most common operations that you will perform on a database are DDL (Data\
    \ Definition Language) and DML (Data Manipulation Language) statements. You can\
    \ execute DDL and DML statements directly through a TSQLConnection. DML statements\
    \ that return a cursor (that is, SQL SELECT statements) require a dataset component\
    \ in addition to the TSQLConnection, as you’ll see in Chapter 3, “Client Dataset\
    \ Basics.”\n\n# ## DDL Commands\n\nDDL commands are statements that operate on\
    \ the database schema, rather than on the data itself. In the previous section,\
    \ I showed you how to retrieve information about the database schema. In this\
    \ section, I’ll show you how to change the database schema.\n\nTSQLConnection\
    \ provides a method named ExecuteDirect, which you use to execute DDL commands.\
    \ ExecuteDirect takes a single parameter, which is the SQL command to execute.\
    \ It returns 0 on success, or a dbExpress error code on failure. dbExpress error\
    \ codes can be found in the file DBXpress.pas, which is included with Delphi.\n\
    \nThe Direct part of the name ExecuteDirect comes from the fact that the statement\
    \ is sent directly to the database. The statement is not prepared before it is\
    \ executed, and it cannot contain any parameters. (Parameterized SQL statements\
    \ are discussed in the section titled “Parameterized SQL Statements” later in\
    \ this chapter.)\n\n> **NOTE**\n> \n> Some databases don’t support direct SQL\
    \ execution. On those databases, dbExpress will internally prepare the SQL statement,\
    \ and then execute it.\n\n# ## Creating a Table\n\nOne of the simplest and most\
    \ useful DDL commands you can issue is the command to create a new table in the\
    \ database. Assume that you want to create a table named EMPLOYEE with the structure\
    \ shown in Table 1.5. You would issue the following statement:\n\n```\nSQLConnection1.ExecuteDirect('CREATE\
    \ TABLE EMPLOYEE (EMPNO INTEGER, ' +\n    'NAME VARCHAR(30), 'HIREDATE DATE, SALARY\
    \ DOUBLE PRECISION');\n```"
  merge: -1
  img_proc: true
- pgno: 40
  md: '# **Table 1.5** Sample `EMPLOYEE` Table Definition


    | Column | Definition |

    | :--- | :--- |

    | EMPNO | INTEGER |

    | NAME | VARCHAR(30) |

    | HIREDATE | DATE |

    | SALARY | DOUBLE PRECISION |


    # ## Creating a Database


    You cannot use ExecuteDirect to create a new InterBase database. The following
    line of code does not work:


    ```

    ```sql

    SQLConnection1.ExecuteDirect(''CREATE DATABASE '''''':\NewData.gdb'''''');

    ```

    ```


    If you try to execute this code, you receive the following exception:


    ```

    ```

    Cannot prepare a CREATE DATABASE/SCHEMA statement.

    ```

    ```


    The InterBase client doesn''t allow direct execution of DDL or DML, so the dbExpress
    driver attempts to prepare, and then to execute the CREATE DATABASE statement.
    Because InterBase doesn''t allow a CREATE DATABASE statement to be prepared, an
    exception is raised.


    If you want your applications to be capable of creating new InterBase databases,
    you need to find another way to do it. One way is to keep an empty copy of the
    database in your program directory and copy it when the user creates a new database.


    I have found the following to be useful in my own experience: Save a copy of the
    empty database as a resource in your application. When the user creates a new
    database, save the resource to disk under the filename that the user selects.
    The following explanation shows how this can be done in a Windows environment.
    Note that this is Windows specific and can''t be used for a Linux or cross-platform
    application.


    First, you want to create a resource script file that turns your empty database
    into a resource. Assuming that you have an empty copy of your database in the
    D:\Interbase directory, the following script file creates a resource named EMPTYDB:


    ```

    ```

    EMPTYDB RCDATA DISCARDABLE "D:\Interbase\Empty.GDB"

    ```

    ```


    Save this script as EmptyDB.RC. To create a .RES file from the resource script,
    execute the following command:


    ```

    ```

    BRC32 EMPTYDB.RC

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 41
  md: "This creates the file EMPTYDB.RES, which can be included in your application.\
    \ Somewhere in your program code, include the code from Listing 1.3.\n\n# **LISTING\
    \ 1.3** Code to Create an Empty Database from a Resource\n\n```\n```\n{$R EmptyDB.RES}\
    \  // Add the empty database to the program executable\n\nprocedure CreateDatabase(const\
    \ DatabaseName: string);\nvar\n  HResrc: THandle;\n  Stream: TResourceStream;\n\
    begin\n  HResrc := FindResource(HInstance, PChar('EMPTYDB'), RT_RCDATA);\n  if\
    \ HResrc <> 0 then begin\n    try\n      Stream := TResourceStream.Create(HInstance,\
    \ 'EMPTYDB', RT_RCDATA);\n      Stream.SaveToFile(DatabaseName);\n    finally\n\
    \      Stream.Free;\n    end;\n  end\n  else\n    raise Exception.Create('Internal\
    \ error: unable to create database.');\nend;\n```\n```\n\nNow when you want to\
    \ create a new database in your application, you simply call CreateDatabase, passing\
    \ the complete pathname of the database, like this:\n\nCreateDatabase( 'C:\\NewDatabase.gdb'\
    \ );\n\nAs you're working on your application, if you change the database schema,\
    \ you must remember to reissue the BCC32 command (shown previously) to re-create\
    \ the EMPTYDB.RES file. Otherwise, you wind up with an incorrect, empty database\
    \ inside your application.\n\nAnother way that you could handle this situation\
    \ is to make direct, low-level calls to the database API from within your application.\
    \ This approach has the benefit of being cross-platform, but you must learn the\
    \ appropriate API commands for the database backend in question.\n\n# ## DML Commands\n\
    \nWhereas DDL commands are used to define the database schema, DML commands are\
    \ used to manipulate (read, write, and update) the data in the database."
  merge: -1
  img_proc: true
- pgno: 42
  md: "# ### Simple SQL Statements\n\nThe simplest DML statement is one that takes\
    \ no parameters and returns no rows. For example, you might want to delete all\
    \ employees whose *Active* status is N. To do so, you would issue the following\
    \ statement:\n\n```\n```sql\nSQLConnection1.ExecuteDirect('DELETE FROM EMPLOYEE\
    \ WHERE Active = 'N'');\n```\n```\n\nNote in the preceding code snippet that the\
    \ `'N'` is surrounded by quotes. A better approach to quoting string constants\
    \ manually is to use the RTL function, **QuotedStr**. **QuotedStr** takes a string\
    \ parameter and returns the string within quotes. One of the main reasons for\
    \ using **QuotedStr** is that it correctly handles string constants that contain\
    \ quotes. For example, given the name O\\'Toole, would you know how to quote it\
    \ manually? The correct way is 'O''Toole'\n\nUsing **QuotedStr**, you don\\'t\
    \ have to worry about how to correctly quote a string. The preceding **ExecuteDirect**\
    \ call becomes\n\n```\n```sql\nSQLConnection1.ExecuteDirect('DELETE FROM EMPLOYEE\
    \ WHERE Active = ' +\n  QuotedStr('N'));\n```\n```\n\n# ### Parameterized SQL\
    \ Statements\n\nMany times, you want to execute the same basic SQL statement more\
    \ than once, changing only the values that are passed to the parameters in the\
    \ statement. For example, say you want to insert a number of records into the\
    \ previously created EMPLOYEE table. To insert an employee, John Doe, you would\
    \ execute the following SQL statement:\n\n```\n```sql\nSQLConnection1.ExecuteDirect('\
    \ INSERT INTO EMPLOYEE VALUES (123,\n  \\'John Doe\\', \\'5/15/1994\\', 35000)');\n\
    ```\n```\n\nAgain, **QuotedStr** could be used here instead of quoting the strings\
    \ manually.\n\nFor each employee that you want to add, you would create and execute\
    \ a similar SQL statement. Parameterized SQL statements enable you to create a\
    \ sort of statement *template*, in which you can easily enter the appropriate\
    \ values for each statement before executing it. For the EMPLOYEE table, the SQL\
    \ INSERT statement becomes the following:\n\n```\n```sql\nINSERT INTO EMPLOYEE\
    \ VALUES (:EmpNumber, :Name, :Hired, :Salary)\n```\n```\n\nEach value to be inserted\
    \ into the database is replaced with a parameter. Parameters are easily detectable\
    \ because they start with a colon. Internally, the dbExpress components parse\
    \ the SQL statement, and convert the parameters into question marks that the core\
    \ dbExpress code supports. In turn, the dbExpress driver replaces the question\
    \ marks with the parameter markers, which are supported by the backend database\
    \ engine."
  merge: -1
  img_proc: true
- pgno: 43
  md: 'For example, given the previous INSERT statement, TSQLConnection changes it
    to INSERT INTO EMPLOYEE VALUES (?, ?, ?, ?)


    The dbExpress driver may replace the question marks with some other construct
    that is specific to the database server.


    # NOTE


    > Parameters do not need to have the same name as the underlying column in the
    table. Notice in the preceding code snippet that I named the parameter EmpNumber
    instead of EmpNo, and Hired instead of DateHired.


    After you create the SQL statement, you need to fill in the value of each parameter
    before executing. The following code snippet shows how this is done:


    ```

    Params := TParams.Create(nil);

    try

    // Create the parameters

    Params.CreateParam( ftInteger , ''EmpNumber'' , ptInput );

    Params.CreateParam( ftString , ''Name'' , ptInput );

    Params.CreateParam( ftSQLDateTime , ''Hired'' , ptInput );

    Params.CreateParam( ftFloat , ''Salary'' , ptInput );


    // Assign values to the parameters

    Params.ParamByName(''EmpNumber'').Value := 123;

    Params.ParamByName(''Name'').Value := ''John Doe'';

    Params.ParamByName(''Hired'').Value := ''5/15/1994'';

    Params.ParamByName(''Salary'').Value := 35000;


    // Execute the statement

    SQLConnectionl.Execute(''INSERT INTO EMPLOYEE VALUES (:EmpNumber, :Name, ''

    '' :Hired, :Salary)'', Params);

    finally

    Params.Free;

    end;

    ```


    You might be wondering why you would ever want to do this rather than simply executing
    each statement directly. After all, creating the parameters and assigning them
    takes a lot more effort. In addition, time tests on my development machine show
    that the second method takes about twice as long as the first.


    In cases where I need to repeatedly execute the same statement, I still prefer
    using a parameterized query for the following reasons:


    # 1

    ESTABLISHING AND

    USING DATABASE

    CONNECTIONS'
