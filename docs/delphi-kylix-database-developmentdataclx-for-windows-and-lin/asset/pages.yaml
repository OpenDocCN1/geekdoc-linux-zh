  md: "To filter a dataset, set its `Filter` property to the string used for filtering,\
    \ and then set the `Filtered` property to `True`. For example, the following code\
    \ snippet filters out all employees whose names begin with the letter M.\n\n```\n\
    ClientDataSet1.Filter := 'Name LIKE ' + QuotedStr( 'M%');\nClientDataSet1.Filtered\
    \ := True;\n```\n\nTo later display only those employees whose names begin with\
    \ the letter P, simply change the filter, like this:\n\n```\nClientDataSet1.Filter\
    \ := 'Name LIKE ' + QuotedStr( 'P%');\n```\n\nTo remove the filter, set the `Filtered`\
    \ property to `False`. You don’t have to set the `Filter` property to an empty\
    \ string to remove the filter (which means that you can toggle the most recent\
    \ filter on and off by switching the value of `Filtered` from `True` to `False`).\n\
    \nYou can apply more advanced filter criteria by handling the dataset’s `OnFilterRecord`\
    \ event (instead of setting the `Filter` property). For example, say that you\
    \ want to filter out all employees whose last names sound like Smith. This would\
    \ include Smith, Smythe, and possibly others. Assuming that you have a Soundex\
    \ function available, you could write a filter method like the following:\n\n\
    ```\nprocedure TForm1.ClientDataSetFilterRecord(DataSet: TDataSet;\nvar Accept:\
    \ Boolean);\nbegin\n    Accept := Soundex(DataSet.FieldName('Lastname'),AsString)=\n\
    \              Soundex('Smith');\nend;\n```\n\nIf you set the `Accept` parameter\
    \ to `True`, the record is included in the filter. If you set `Accept` to `False`,\
    \ the record is hidden.\n\nAfter you set up an `OnFilterRecord` event handler,\
    \ you can simply set `TClientDataSet.Filtered` to `True`. You don’t need to set\
    \ the `Filter` property at all.\n\nThe following example demonstrates different\
    \ filter and range techniques.\n\nListing 3.4 contains the source code for the\
    \ main form.\n\n# LISTING 3.4   RangeFilter—MainForm.pas\n\n```\nunit MainForm;\n\
    \ninterface\n\nuses\n  SysUtils, Classes, QGraphics, QControls, QForms, QDialogs,\
    \ QStdCtrls,\n  DB, DBClient, QExtCtrls, QGrids, QDBGrids;\n```"
