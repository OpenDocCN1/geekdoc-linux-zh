  img_proc: true
- pgno: 113
  md: "![](img/fe651f295b5f960d5463c4fb581d2281_113_0.png)\n\n# FIGURE 3.4\nAdding\
    \ a lookup field to a dataset.\n\nThe important thing to remember about lookup\
    \ fields is that the **Key** *field* represents the field in the base dataset\
    \ that references the lookup dataset. **Dataset** refers to the lookup dataset.\
    \ The **Lookup Keys** *combo box* represents the **Key** *field* in the lookup\
    \ dataset. The **Result** *field* is the field in the lookup dataset from which\
    \ the lookup field obtains its value.\n\nTo create the dataset at design time,\
    \ you can right-click the TC1ientDataSt component and select **Create DataSl**\
    \ from the pop-up menu.\n\nNow that you’ve seen how to create a client dataset\
    \ at design-time, let’s see what’s required to create a client dataset at runtime.\n\
    \n# ## Creating a Client Dataset at Runtime\n\nTo create a client dataset at runtime,\
    \ you start with the following skeletal code:\n\n```\n```\nvar\n  CDS: TC1ientDataSt;\n\
    begin\n  CDS := TC1ientDataSt.Create(nil);\n  try\n    // Do something with the\
    \ client dataset here\n  finally\n    CDS.Free;\n  end;\nend;\n```\n```\n\nAfter\
    \ you create the client dataset, you typically add fields, but you can load the\
    \ client dataset from a disk instead (as you’ll see later in this chapter in the\
    \ section titled “Persisting C1ient Datasetst”)."
