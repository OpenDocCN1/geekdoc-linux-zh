- pgno: 125
  md: "# # Navigating Client Datasets\n\nA dataset is worthless without a means of\
    \ moving forward and/or backward through it. Delphi's datasets provide a large\
    \ number of methods for traversing a dataset. The following sections discuss Delphi's\
    \ support for dataset navigation.\n\n# ## Sequential Navigation\n\nThe most basic\
    \ way to navigate through a dataset is sequentially in either forward or reverse\
    \ order. For example, you might want to iterate through a dataset when printing\
    \ a report, or for some other reason. Delphi provides four simple methods to accomplish\
    \ this:\n\n+   * **First** moves to the first record in the dataset. **First**\
    \ always succeeds, even if the dataset is empty. If it is empty, **First** sets\
    \ the dataset's **EOF** (end of file) property to **True**.\n+   * **Next** moves\
    \ to the next record in the dataset (if the **EOF** property is not already set).\
    \ If **EOF** is **True**, **Next** will fail. If the call to **Next** reaches\
    \ the end of the file, it sets the **EOF** property to **True**.\n+   * **Last**\
    \ moves to the last record in the dataset. **Last** always succeeds, even if the\
    \ dataset is empty. If it is empty, **Last** sets the dataset's **BOF** (beginning\
    \ of file) property to **True**.\n+   * **Prior** moves to the preceding record\
    \ in the dataset (if the **BOF** property is not already set). If **BOF** is **True**,\
    \ **Prior** will fail. If the call to **Prior** reaches the beginning of the file,\
    \ it sets the **BOF** property to **True**.\n\nThe following code snippet shows\
    \ how you can use these methods to iterate through a dataset:\n\n```\nif not ClientDataSet1.IsEmpty\
    \ then begin\n    ClientDataSet1.First;\n    while not ClientDataSet1.EOF do begin\n\
    \        // Process the current record\n\n        ClientDataSet1.Next;\n    end;\n\
    end;\n\nClientDataSet1.Last;\nwhile not ClientDataSet1.BOF do begin\n    // Process\
    \ the current record\n\n    ClientDataSet1.Prior;\nend;\n```\n\n![](img/fe651f295b5f960d5463c4fb581d2281_125_0.png)"
  merge: -1
  img_proc: true
- pgno: 126
  md: "# Random-Access Navigation\n\nIn addition to First, Next, Prior, and Last (which\
    \ provide for sequential movement through a dataset), TClientDataSet provides\
    \ two ways of moving directly to a given record: bookmarks and record numbers.\n\
    \n# Bookmarks\n\nA bookmark used with a client dataset is very similar to a bookmark\
    \ used with a paper-based book: It marks a location in a dataset so that you can\
    \ quickly return to it later.\n\nThere are three operations that you can perform\
    \ with bookmarks: set a bookmark, return to a bookmark, and free a bookmark. The\
    \ following code snippet shows how to do all three:\n\n```\nvar\n    Bookmark:\
    \ TBookmark;\nbegin\n    Bookmark := ClientDataSet1.GetBookmark;\n    try\n  \
    \      // Do something with ClientDataSet1 here that changes the current record\n\
    \        ...\n        ClientDataSet1.GotoBookmark(Bookmark);\n    finally\n  \
    \      ClientDataSet1.FreeBookmark(Bookmark);\n    end;\nend;\n```\n\nYou can\
    \ create as many bookmarks as you want for a dataset. However, keep in mind that\
    \ a bookmark allocates a small amount of memory, so you should be sure to free\
    \ all bookmarks using FreeBookmark or your application will leak memory.\n\nThere\
    \ is a second set of operations that you can use for bookmarks instead of GetBookmark/GotoBookmark/FreeBookmark.\
    \ The following code shows this alternate method:\n\n```\nvar\n    BookmarkStr:\
    \ string;\nbegin\n    BookmarkStr := ClientDataSet1.Bookmark;\n    try\n     \
    \   // Do something with ClientDataSet1 here that changes the current record\n\
    \        ...\n    finally\n        ClientDataSet1.Bookmark := BookmarkStr;\n \
    \   end;\nend;\n```"
  merge: -1
  img_proc: true
- pgno: 127
  md: "Because the bookmark returned by the property, Bookmark, is a string, you don't\
    \ need to concern yourself with freeing the string when you're done. Like all\
    \ strings, Delphi automatically frees the bookmark when it goes out of scope.\n\
    \n# Record Numbers\n\nClient datasets support a second way of moving directly\
    \ to a given record in the dataset: setting the RecNo property of the dataset.\
    \ RecNo is a one-based number indicating the sequential number of the current\
    \ record relative to the beginning of the dataset.\n\nYou can read the RecNo property\
    \ to determine the current absolute record number, and write the RecNo property\
    \ to set the current record. There are two important things to keep in mind with\
    \ respect to RecNo:\n\n+   - Attempting to set RecNo to a number less than one,\
    \ or to a number greater than the number of records in the dataset results in\
    \ an At beginning of table, or an At end of table exception, respectively.\n+\
    \   - The record number of any given record is not guaranteed to be constant.\
    \ For instance, changing the active index on a dataset alters the record number\
    \ of all records in the dataset.\n\n> You can determine the number of records\
    \ in the dataset by inspecting the dataset's RecordCount property. When setting\
    \ RecNo, never attempt to set it to a number higher than RecordCount.\n\nHowever,\
    \ when used discriminately, RecNo has its uses. For example, let's say the user\
    \ of your application wants to delete all records between the John Smith record\
    \ and the Fred Jones record. The following code shows how you can accomplish this:\n\
    \n```\n```\nvar\n  RecNoJohn: Integer;\n  RecNoFred: Integer;\n  Index: Integer;\n\
    begin\n  if not ClientDataSet1.Locate('Name', 'John Smith', []) then\n    raise\
    \ Exception.Create('Cannot locate John Smith');\n  RecNoJohn := ClientDataSet1.RecNo;\n\
    \  if not ClientDataSet1.Locate('Name', 'Fred Jones', []) then\n    raise Exception.Create('Cannot\
    \ locate Fred Jones');\n  RecNoFred := ClientDataSet1.RecNo;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 128
  md: "```\n```pascal\nif RecNoJohn < RecNoFred then\n // Locate John again\n ClientDataSet1.RecNo\
    \ := RecNoJohn;\n\nfor Index := 1 to Abs(RecNoJohn - RecNoFred) + 1 do\n ClientDataSet1.Delete;\n\
    end;\n```\n```\n\nThis code snippet first locates the two bounding records and\
    \ remembers their absolute record numbers. Then, it positions the dataset to the\
    \ lower record number. If Fred occurs before John, the dataset is already positioned\
    \ at the lower record number.\n\nBecause records are sequentially numbered, we\
    \ can subtract the two record numbers (and add one) to determine the number of\
    \ records to delete. Deleting a record makes the next record current, so a simple\
    \ for loop handles the deletion of the records.\n\nKeep in mind that RecNo isn't\
    \ usually going to be your first line of attack for moving around in a dataset,\
    \ but it's handy to remember that it's available if you ever need it.\n\nListing\
    \ 3.2 contains the complete source code for an application that demonstrates the\
    \ different navigational methods of client datasets.\n\n# **LISTING 3.2** Navigate—MainForm.pas\n\
    \n```\n```pascal\nunit MainForm;\n\ninterface\n\nuses\n SysUtils, Classes, QGraphics,\
    \ QControls, QForms, QDialogs, QStDCtrls,\n DB, DBClient, QExtCtrls, QActnList,\
    \ QRids, QDBGrids, QDBCtrls;\n\ntype\n  TfrmMain = class(TForm)\n    DataSource1:\
    \ TDataSource;\n    pnlClient: TPanel;\n    pnlBottom: TPanel;\n    btnFirst:\
    \ TButton;\n    btnLast: TButton;\n    btnNext: TButton;\n    btnPrior: TButton;\n\
    \    DBGrid1: TDBGrid;\n    ClientDataSet1: TClientDataSet;\n    btnSetRecNo:\
    \ TButton;\n    DBNavigator1: TDBNavigator;\n    btnGetBookmark: TButton;\n```\n\
    ```"
