- pgno: 314
  md: "# # Providing and Resolving Data from Stored Procedures and Joins\n\nSo far,\
    \ the examples in this chapter focused on providing data from a single table using\
    \ a simple select statement, such as `SELECT * FROM CONTACTS`. Frequently, data\
    \ is provided from a stored procedure on the server or is generated as a join\
    \ between multiple tables, as the following two snippets show:\n\n```\n```sql\n\
    // Stored procedure\nSELECT * FROM CONTACTSBYSTATE('FL');\n\n// Join\nSELECT CONTACTS.FIRST,\
    \ CONTACTS.LAST, TODOS.SCHEDULED, TODOS.DESCRIPTION\nFROM CONTACTS, TODOS\nWHERE\
    \ CONTACTS.ID = TODOS.CONTACTID;\n```\n```\n\n# ## Providing and Resolving Data\
    \ from a Stored Procedure\n\nIn the preceding example, the stored procedure returns\
    \ all contacts for a given state—in this case, Florida. **TDataSetProvider** attempts\
    \ to intelligently determine what database table to update when resolving data,\
    \ but in this case, **CONTACTSBYSTATE** is a stored procedure and not a table.\n\
    \n**TDataSetProvider** needs a little help to know what table should be updated\
    \ with any data changes. To do this, you need to provide an event handler for\
    \ the provider's **OnGetTableName** event. In the event handler, specify the name\
    \ of the table to be updated, like this:\n\n```\n```pascal\nprocedure TForm1.DataSetProvider1GetTableName(Sender:\
    \ TObject;\n          DataSet: TDataSet; var TableName: String);\nbegin\n    TableName\
    \ := 'CONTACTS';\nend;\n```\n```\n\nIn addition, you need to set the **ProviderFlags**\
    \ to [] for all fields in the stored procedure dataset that are not updated.\n\
    \n# ## Providing and Resolving Data from a Join\n\nBy definition, a join returns\
    \ data from more than one table. In many cases, the user will be able to update\
    \ data from only one of the tables. For example, in the select statement shown\
    \ previously, data is retrieved from the **CONTACTS** table and the **TODOS**\
    \ table. On the client side, the user may add a new **TODO** to the list, but\
    \ the only table that is affected is the **TODOS** table. (Presumably, if the\
    \ user wants to add a new contact, he would not do so on the same screen that\
    \ he's viewing todos on)."
  merge: -1
  img_proc: true
- pgno: 315
  md: "If this is the case, you can specify the T0DOS table name in the OnGetTableName\
    \ event handler, as explained earlier.\n\nSometimes, though, the user will be\
    \ able to update multiple tables at once. To handle this situation, you will need\
    \ to write some code. Again, we turn to TDataSetProvider’s **BeforeUpdateRecord**\
    \ event handler. The trick is to apply the necessary updates to the individual\
    \ tables themselves inside the event handler.\n\nThe following code snippet shows\
    \ the general outline that you will follow to apply updates to multiple tables\
    \ at once. It is not compilable code.\n\n```\nprocedure TForm1.SQLClientDataSet1BeforeUpdateRecord(Sender:\
    \ TObject;  \n\tSourceDS: TDataSet; DeltaDS: TCustomClientDataSet; UpdateKind:\
    \ TUpdateKind;\n\tvar Applied Boolean);\nvar\n\tSQL: string;\n\tConnection: TSQLConnection;\n\
    begin\n\t// Obtain a pointer to the connection from the source dataset\n\tConnection\
    \ := (SourceDS as TCustomSQLDataSet).SQLConnection;\n\t\n\tcase UpdateKind of\n\
    \tukInsert: begin\n\t\t// Insert into the first table\n\t\tSQL := // SQL INSERT\
    \ STATEMENT FOR TABLE 1\n\t\tConnection.Execute(SQL, nil, nil);\n\t\t\n\t\t//\
    \ Insert into the second table\n\t\tSQL := // SQL INSERT STATEMENT FOR TABLE 2\n\
    \t\tConnection.Execute(SQL, nil, nil);\n\tend;\n\t\n\tukModify: begin\n\t\t//\
    \ Update the first table\n\t\tSQL := // SQL UPDATE STATEMENT FOR TABLE 1\n\t\t\
    Connection.Execute(SQL, nil, nil);\n\t\t\n\t\t// Update the second table\n\t\t\
    SQL := // SQL UPDATE STATEMENT FOR TABLE 2\n\t\tConnection.Execute(SQL, nil, nil);\n\
    \tend;\n\t\n\tukDelete: begin\n\t\t// Delete from the first table\n\t\tSQL :=\
    \ // SQL DELETE STATEMENT FOR TABLE 1\n\t\tConnection.Execute(SQL, nil, nil);\n\
    ```\n\n7\n\n![](img/fe651f295b5f960d5463c4fb581d2281_315_0.png)"
  merge: -1
  img_proc: true
- pgno: 316
  md: "```\n```\n// Delete from the second table\nSQL := // SQL DELETE STATEMENT FOR\
    \ TABLE 2\nConnection.Execute(SQL, nil, nil);\nend;\nend;\n\nApplied := True;\n\
    end;\n```\n```\n\nAs you can see from the preceding listing, the general idea\
    \ is to determine what kind of operation is taking place (Insert, Modify, or Delete)\
    \ and then call the TSqlConnection component to execute the appropriate SQL statements\
    \ directly. At the end of the method, set **Applied** to True so the provider\
    \ knows that you’ve already handled the update manually.\n\nThis process works\
    \ equally well for three-, four-, or *n*-table joins.\n\nThe following example\
    \ shows how you can resolve updates in a simple two-way join.\n\n**Listing 7.2**\
    \ contains the source code for the main form of the Joins application.\n\n# Listing\
    \ 7.2 Joins—MainForm.pas\n\n```\n```\nunit MainForm;\ninterface\nuses\n  SysUtils,\
