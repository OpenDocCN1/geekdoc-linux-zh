- pgno: 280
  md: 'Index refers to the zero-based index of the panel about to be drawn, and is
    a number between zero and RowCount—one, inclusive.


    You might notice that there is no Rect parameter passed to this function, so at
    first glance it isn’t obvious how to determine the bounding rectangle of the current
    cell. Upon entry to this method, the grid canvas’ origin is set to the upper-left
    corner of the current panel. In other words, point (0, 0) on the canvas refers
    to the upper-left corner of the panel. Point (PanelWidth, PanelHeight) references
    the lower-right corner. This enables you to use the canvas for things as drawing
    a background image on the panel (as the following code snippet taken from Listing
    6.4 shows).


    ```

    procedure TForm1.DBCtrIGrid1PaintPanel(DBCtrlIGrid: TDBCtrlIGrid;

    Index: Integer);

    begin

    if Index <> DBCtrIGrid1.PanelIndex then

    DBCtrlIGrid1.Canvas.Draw(0, 0, Image1.Picture.Graphic);

    end;

    ```


    This code checks the index passed into the method to see if we’re drawing the
    current panel. (The public property PanelIndex contains the number of the current
    panel.) All noncurrent panels are drawn with a background graphic.


