    In this scenario, the SQL statement is prepared only once—the first time that
    it is executed. After that, the statement does not need to be prepared again because
    the only thing that changes is the Country parameter.


    > **Note**

    > Note that the name of the parameter does not need to be the same as the column
    name that it refers to. In the previous example, the parameter could have been
    named ACountry, CountryParam, or Fred.


    There is one additional property that governs how parameters are created: the
    `ParamCheck` property. When `ParamCheck` is set to True, parameters are automatically
    created by dbExpress (as the previous example indicates). However, if you set
    `ParamCheck` to False, you are responsible for creating the parameters yourself.
    The following code snippet shows how this is done:


    ```

    SQLDataSet1.CommandType := ctQuery;

    SQLDataSet1.ParamCheck := False;

    SQLDataSet1.CommandText := ''SELECT * FROM CONTACTS WHERE COUNTRY = :Country'';

    SQLDataSet1.Params.CreateParam(''Country'', ftString, ptInput);

    SQLDataSet1.ParamByName(''Country'').AsString := ''United States'';

    SQLDataSet1.Open;

    ```


    Note that, typically, you would only set `ParamCheck` to False when issuing a
    DDL statement that creates a stored procedure which accepts parameters as part
    of the stored procedure. Because that sounds confusing, let''s take a look at
    an example:


    ```

    SQLDataSet1.CommandType := ctQuery;

    SQLDataSet1.ParamCheck := False;

    SQLDataSet1.CommandText :=

    ''CREATE PROCEDURE CONTACTSBYTITLE(ATITLE VARCHAR(20)) ''

    ''RETURNS ( '' +

