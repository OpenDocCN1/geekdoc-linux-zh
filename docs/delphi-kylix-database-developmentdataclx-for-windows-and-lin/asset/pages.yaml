- pgno: 264
  md: "Figure 6.3 shows the Options application at runtime.\n\n![](img/fe651f295b5f960d5463c4fb581d2281_264_0.png)\n\
    \nThe Options application lets you experiment with the TDBGrid component's options.\n\
    \n# Custom Drawing\n\nAs you can see from Figure 6.2, the grid's default appearance\
    \ is pleasing to look at, but not especially eye-catching. Using custom drawing,\
    \ we can spruce up the look of the grid considerably.\n\nTo implement custom drawing\
    \ in your grid, you need to handle the grid's OnDrawColumnCell event. You might\
    \ notice that the grid contains a similarly named event, OnDrawDataCell. OnDrawDataCell\
    \ is an obsolete event that is included for backward compatibility with early\
    \ versions of Delphi. You should not use it in any new programming efforts.\n\n\
    A newly created handler for the OnDrawColumnCell event looks like this:\n\n```\n\
    procedure TForm1.DBGrid1DrawColumnCell(Sender: TObject; const Rect: TRect;\n \
    \        DataCol: Integer; Column: TColumn; State: TGridDrawState);\n        \
    \ begin\n         end;\n```\n\nAs with all grid events, the Sender parameter references\
    \ the grid object. Rect refers to the bounding rectangle of the cell that is about\
    \ to be drawn. DataCol is a zero-based index into the absolute position of the\
    \ column that is about to be drawn. State is a set containing one or more of the\
    \ values listed in Table 6.6."
  merge: -1
  img_proc: true
- pgno: 265
  md: '# TABLE 6.6  TGridDrawState Values


    | Value          | Description                                            |

    |----------------|--------------------------------------------------------|

    | *gdSelected*   | The cell is selected.                                  |

    | *gdFocused*    | The cell has the focus.                                |

    | *gdFixed*      | The cell is fixed (that is, it''s the indicator cell). |


    The difference between gdSelected and gdFocused can get confusing (especially
    because these values change meaning slightly as the Options property changes),
    so I''ll clarify it here.


    When dgRowSelect is not set (the default), only the current cell has the gdSelected
    value set. If the grid currently has focus, the current cell has gdFocused set
    in addition to having the gdSelected value set.


    When dgRowSelect is set, all cells in the current row have the gdSelected value
    set. In addition, if the grid has focus, the first cell in the row (excluding
    the indicator) has gdFocused set. You probably want to ignore the gdFocused value
    when using dgRowSelect, as it has no useful meaning.


    # The DefaultDrawing Property


    The grid''s DefaultDrawing property determines how drawing is performed in the
    grid. When this property is True (the default), VCL/CLX draws each cell in the
    grid as usual, and then passes control to the OnDrawColumnCell handler that you
    set up. OnDrawColumnCell is called for every cell in the grid, so you want to
    make sure that whatever code you write in that event handler executes quickly.


    When DefaultDrawing is False, Delphi paints the cell with the appropriate background
    color, and sets the grid''s Brush and Font properties in readiness to draw the
    cell. Then, it calls OnDrawColumnCell so that you can draw the contents of the
    cell yourself.


    In practice, you will often find that when you implement custom drawing, Delphi''s
    default drawing code does about 90% of what you need. You might simply want to
    change the color of selected cells, draw an image in a given column, or perhaps
    draw negative values in red.


    It might seem that the DefaultDrawing property perks to extremes. On the one hand,
    if it is True, the cell is drawn using its default settings, and then you turn
    around and draw over the top of it. On the other hand, if it is False, you need
    to draw every single cell manually—even those that you don''t need any special
    drawing for.


    Fortunately, this isn''t the case. The solution is to set DefaultDrawing to False,
    and then inside the OnCustomDrawColumn event handler, call the grid''s DefaultDrawColumnCell,
    like this:


    ```

    procedure TForm1.DBGrid1DrawColumnCell(Sender: TObject; const Rect: TRect;

    DataCol: Integer; Column: TColumn; State: TGridDrawState);

    ```'
  merge: -1
  img_proc: true
