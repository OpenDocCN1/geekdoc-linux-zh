- pgno: 320
  md: '# # Connecting to a Local Database


    This chapter explains how to take advantage of providers in a multitier application
    in which the client and server are both physically located in the same executable.
    Even under this arrangement, it is beneficial to structure the application such
    that it is a relatively simple matter to move the server into its own application
    if you ever decide to move to separate server and client applications.


    To facilitate this, you should put server-side components on a separate data module
    from client-side components. Under this arrangement, your application would have
    the following structure:


    +   - **Server data module** This contains the connection to the database, along
    with the necessary datasets and providers.

    +   - **Client data module** This contains the client datasets and (optionally)
    data sources.

    +   - **Forms and units** The forms and supports units in the application will
    reference the data from the client data module.


    Other than from inside the server data module, you should not reference any components
    on the server side of the equation, including the database connection or datasets.
    All data access should be performed through the client data module. If you impose
    this restriction on your code, it will go a long way toward simplifying moving
    the server data module out into its own application.


    # ## Using Providers Located on a Different Form


    After you move the data access components and providers onto a separate data module,
    the client dataset won’t be able to directly connect to the dataset provider.
    In other words, the `TClientDataSet`’s `ProviderName` property won’t list the
    provider in its drop-down list, because the provider is not on the same form (or
    data module).


    To provide access to the provider(s) on the server-side data module to your client
    datasets, you either need to call `TClientDataSet.SetProvider` or use a `TLocalConnection`
    component, discussed in the next chapter.


    For now, at runtime, you can call `TClientDataSet.SetProvider` to establish a
    connection to a provider on a different form or data module. The following line
    of code shows how this is done:


    ```

    ClientDataSet1.SetProvider(ServerDM.PvContacts);

    ```'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# One-Stop Shopping: TSQLClientDataSet


    If you write a lot of applications using dbExpress, and you don’t want to plan
    ahead for easy migration to a separate application server, you may find that the
    `TSQLClientDataSet` component simplifies your application somewhat.


    `TSQLClientDataSet` encapsulates a `TSQLDataSet`, `TDataSetProvider`, and `TClientDataSet`
    component into a single component. You still need to set up a `TSQLConnection`
    component as explained in Chapter 2, but then you can drop a single `TSQLClientDataSet`
    component on your data module rather than setting up three components for each
    dataset.


    The downside to using `TSQLClientDataSet` is that if you later decide to move
    to a separate application server, you will need to create new `TSQLDataSet` and
    `TDataSetProvider` components on the server side and then replace the `TSQLClientDataSet`
    component with a `TClientDataSet` component on the client side. In addition, `TSQLClientDataSet`
    limits the amount of control you have over individual provider and dataset events.


    It doesn’t require much more effort to set up the separate components to begin
    with, and it makes migration to a multitier application much easier in the future.
    For that reason, I don’t recommend using `TSQLClientDataSet` at all in most applications.


    # Limiting the Amount of Data Returned by the Server


    By default, when you open a client dataset, all data returned by the server-side
    datasets are returned to the client application. In many cases, this is acceptable.
    In other cases, you may want to limit the number of records returned at a single
    time. For example, if a query returns a result set of 10,000 records, it may not
    be a good idea to return all records to the client at one time when the client
    application is across a slow LAN or even slower WAN.


    To limit the amount of data returned at once from the server, set the `TClientDataSet`’s
    `PacketRecords` property. By default, this property is set to -1, meaning that
    all records should be returned at once from the server.


    If you set `PacketRecords` to a number greater than zero, it determines the maximum
    number of records to return at a given time from the server. When `PacketRecords`
    is set to zero, only metadata information is returned from the server—no actual
    row data is returned.


    Generally, each data packet is fetched from the server automatically as you scroll
    through the client dataset, whether in code using `Next` commands or through use
    of a data-aware component such as `TDBGrid`. If you set `TClientDataSet.FetchOnDemand`
    to `False`, additional data packets are not automatically retrieved. In this case,
    you must call `TClientDataSet.GetNextPacket` to return the next data packet from
    the server.


    ![](img/fe651f295b5f960d5463c4fb581d2281_321_0.png)'
  merge: -1
  img_proc: true
- pgno: 322
  md: "# Fetching BLOBs Manually\n\nOne way to limit the amount of data sent from\
    \ the server to the client is to fetch BLOB data manually, rather than automatically.\
    \ By default, BLOB data is returned by the provider along with the rest of the\
    \ data packet. However, if you don’t always need BLOB information, you can turn\
    \ on the `DataSetProvider`’s `poFetchBlobsOnDemand` option. You also need to set\
    \ `TClientDataSet.FetchOnDemand` to `False`.\n\n> **NOTE**\n> \n> If your client\
    \ application has no need for BLOB data at all, you should change the `TSQLDataSet`’s\
    \ `CommandText` property so that the `SELECT` statement doesn’t retrieve the BLOB\
    \ field from the database. `poFetchBlobsOnDemand` is used when the client application\
    \ sometimes needs the BLOB data, but not always.\n\nWhen you set the `poFetchBlobsOnDemand`\
    \ option, BLOB data is not returned to the client dataset. If you try to access\
    \ a BLOB field in the client dataset, an exception will be raised. If the client\
    \ needs BLOB information for the current record, it should call the client dataset’s\
    \ `FetchBlobs` method, like this:\n\n```\nClientDataSet1.FetchBlobs;\n```\n\n\
    `FetchBlobs` retrieves all BLOB fields for the current record only. If the dataset\
    \ contains three BLOB fields, there is no way to retrieve only a single BLOB value\
    \ from the server—`FetchBlobs` will return all three BLOBs.\n\nNote that if the\
    \ client dataset’s `FetchOnDemand` property is set to `True`, the client dataset\
    \ will call `FetchBlobs` automatically. To fetch BLOBs manually, you must set\
    \ both the `poFetchBlobsOnDemand` option on the provider and the client dataset’s\
    \ `FetchOnDemand` property.\n\n# Fetching Detail Records Manually\n\nAnother way\
    \ to limit the amount of data returned by the server is to fetch detail records\
    \ from a master/detail relationship manually. By default, all detail records (in\
    \ the form of a nested dataset) are sent to the client along with the master record.\
    \ If you don’t always need detail information, you can turn on the `DataSetProvider`’s\
    \ `poFetchDetailsOnDemand` option.\n\nWhen you set the `poFetchDetailsOnDemand`\
    \ option, detail data is not returned to the client dataset. Any nested datasets\
    \ will return a `RecordCount` of -2147483648 (-MaxInt - 1). If the client needs\
    \ detail information for the current record, it should call the client dataset’s\
    \ `FetchDetails` method, like this:\n\n```\nClientDataSet1.FetchDetails;\n```"
  merge: -1
  img_proc: true
