    # Room for Improvement


    Because ConMan is a sample application, there is considerable room for improvement.
    In addition to the omissions mentioned in the section titled "What Is ConMan?"
    at the beginning of this chapter, the following improvements would be useful additions
    to this application:


    +   * A dialog that pops up to alert the user as to when a todo is imminent.

    +   * A screen that shows a list of todos for all contacts, ordered by date.

    +   * The capability to assign a todo to a specific user, to provide rudimentary
    scheduling capabilities.

    +   * The capability to query the database. As it grows to a large size, it may
    take a considerable amount of time to load all the data onto a client machine.


    I''ll leave it to you to implement these suggestions if you see fit. That will
    give you a springboard to learning multitier development techniques on your own.


    # Summary


    This chapter pulled together many of the concepts discussed in prior chapters
    to create a complete multitier database application. Specifically, this application
    implements the following:


    +   * The application server makes use of dBExpress components such as `TSQLConnection`
    and `TSQLDataSet` for connecting to an InterBase database. These components are
    discussed in Chapters 1 and 2.'
  merge: -1
  img_proc: true
- pgno: 386
  md: '+   - The application server contains a minimal user interface that displays
    the number of current connections along with the amount of RAM in use by the server,
    as shown in Chapter 8.


    +   - The server''s `pvContactsBeforeUpdateRecord` event handler shows how to
    ensure that each record has a unique primary key just before posting to the database,
    as discussed in Chapter 7.


    +   - The client application makes use of a calculated field on the `cdsContact`
    dataset. Calculated fields were discussed in Chapter 3.


    +   - The client application''s `dsContactsDataChange` event handler takes care
    of displaying an image from the dataset in a non-data-aware `TImage` component.
    This concept was discussed in Chapter 4.


    +   - The client application''s `cdsContactsReconcileError` event handler takes
    advantage of Delphi''s built-in reconciliation form to handle reconciliation errors,
    as discussed in Chapter 7.'
