- pgno: 272
  md: '```

    procedure TForm1.DBGrid1KeyDown(Sender: TObject; var Key: Word;

    Shift: TShiftState);

    begin

    if Shift = [] then begin

    case Key of

    VK_F2: Key := 0;

    VK_F9: DBGrid1.EditorMode := True;

    end;

    end;

    end;

    ```


    # NOTE


    For this code to work, you must make sure the dgEditing option is set. If it isn''t,
    the grid doesn''t enter edit mode even when the code sets EditorMode to True.


    # Detecting When a Column Is Resized


    TDBGrid provides an OnColumnMoved event, but no OnColumnSized event. This means
    that you can easily tell when a column is moved, but it’s more difficult to determine
    when a column is resized. Fortunately, we can achieve this functionality by writing
    a grid descendent with a single overridden method.


    Listing 6.3 contains the source code for the TETHDBGrid component.


    # Listing 6.3 ETHDBGrid.pas


    ```

    unit ETHDBGrid;


    interface


    uses

    Windows, Messages, SysUtils, Classes, Controls, Grids, DBGrids;


    type

    TETHDBGrid = class(TDBGrid)

    private

    { Private declarations }

    FOnColumnSized: TNotifyEvent;

    protected

    { Protected declarations }

    procedure ColWidthsChanged; override;

    public

    { Public declarations }

    published

    { Published declarations }

    ```'
