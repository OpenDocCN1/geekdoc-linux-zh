    steps.


    +   - From Delphi''s main menu, select File, New, Other. Delphi''s New Items dialog
    is displayed. Select the WebServices tab.


    +   - Select **SOAP Server Application** from the New Items dialog and click OK.
    The dialog shown in Figure 8.5 appears.


    ![](img/fe651f295b5f960d5463c4fb581d2281_335_0.png)


    # FIGURE 8.5


    Delphi supports five types of SOAP server applications.


    +   - Select the type of SOAP server application to create. If you''re creating
