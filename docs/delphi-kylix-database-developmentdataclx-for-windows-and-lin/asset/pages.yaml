    # ## Summary


    This chapter continued the discussion of data-aware components with an overview
    of data-aware grids, which allow multiple rows of a dataset to be displayed on
    the screen at the same time. Specifically, this chapter taught you the following:


    +   - You can create a quick and dirty grid by dropping a `TDBGrid` component
    on a form and using the default values. To customize the columns in the resulting
    grid, use the `Columns` property.

    +   - Various grid options exist for altering the look and feel of the grid. (See
    Table 6.4 for a summary.)

    +   - You can use various grid events to gain control over what happens when the
    user clicks a cell or performs some other action. (See Table 6.5 for a summary.)

    +   - For the ultimate control over how the grid looks, use the `OnDrawColumnCell`
    event.

    +   - `TClientDataSetGrid` is a free component that you can use for automatic
    column sorting and additional column customization.

    +   - `TDBCtrlGrid` is a VCL-specific component that offers the capability to
    arrange data for a single record in a nonlinear format.


    In addition, this chapter showed how to deal with several commonly encountered
    grid issues, such as detecting when a column is moved and persisting column states.


    The following chapter begins a two-chapter exploration of client datasets.'
