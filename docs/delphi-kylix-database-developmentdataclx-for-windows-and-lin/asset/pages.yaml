    +   - `sq1Contacts` A `TSQLDataSet` component for retrieving data from the Contacts
    table.

    +   - `sq1Todos` A `TSQLDataSet` component for retrieving data from the Todos
    table.

    +   - `sq1ID` A `TSQLDataSet` that calls the stored procedure `ID_GEN` in the
