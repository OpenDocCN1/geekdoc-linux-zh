    ```

    procedure TfrmMain.btnClearEventLogClick(Sender: TObject);   begin      lbEvents.Items.Clear;   end;

    ```


    Run two occurrences of this application on your computer. In the first occurrence,
    change John’s first name to Eddie and apply updates. In the second occurrence,
    notice that the record still shows a first name of John. Change John’s last name
    to Smith and apply updates. The OnReconcileError event fires, indicating that
    the record has been changed by someone else in the meantime (see Figure 7.3).


    ![](img/fe651f295b5f960d5463c4fb581d2281_301_0.png)


    # **FIGURE 7.3**


    *Delphi’s reconcile error handler allows the user to decide how to deal with record
    conflicts.*


    By default, this dialog shows conflicting values only—in other words, fields that
    were changed by another user. Uncheck the Show Conflicting Fields Only check box
    to display all field values. If you do, you’ll see that this application changed
    the LAST field from Lombardo to Smith. Another application changed the FIRST field
    from John to Eddie.


    The upper-right corner of the dialog contains a list of option buttons that the
    user can use to instruct Delphi how to deal with the error. The option buttons
    correspond to the raSkip, raCancel, raCorrect, raRefresh, and raMerge values for
    TReconcileAction. No raAbort option is listed, but clicking the Cancel button
    will result in a value of raAbort being returned from the event handler.


    # Dataset Providers


