- pgno: 252
  md: "The preceding chapter introduced you to data-aware components—in particular,\
    \ to data-aware components that display and edit one field at a time. This chapter\
    \ discusses data-aware grids, which display information from a number of records\
    \ at one time.\n\nIn this chapter, I’ll examine three different data-aware grids:\
    \ **TDBGrid**, **TClientDataSetGrid**, and **TDBCtrlGrid**. **TDBGrid** is the\
    \ only one of the three that comes standard with both Delphi and Kylix. **TClientDataSetGrid**\
    \ is a derivative work, written by John Kaster, that provides built-in support\
    \ for user-configurable columns as well as code that can automatically sort a\
    \ client dataset when the user clicks a column heading (more on that later in\
    \ this chapter).\n\n**TDBCtrlGrid** is supplied with Delphi, but not with Kylix.\
    \ It allows for a nonlinear grid layout—for example, a grid where each record\
    \ occupies several lines instead of a single line.\n\n# ## TDBGrid\n\n**TDBGrid**\
    \ provides the cornerstone for Delphi’s grid-based, data-aware components. Using\
    \ **TDBGrid**, you can create screens that look like the one shown in Figure 6.1\
    \ without a lot of programming effort.\n\n![](img/fe651f295b5f960d5463c4fb581d2281_252_0.png)\n\
    \n**FIGURE 6.1**  \n*A sample screen created using a TDBGrid.*\n\nLater in this\
    \ chapter, we’ll investigate the code required to produce this screen. In this\
    \ section, I’ll explore the **TDBGrid** component. The following sections introduce\
    \ two other grids that are either included with Delphi or are available as a free\
    \ download.\n\n# ## TDBGrid Basic Operation\n\nLike the components discussed in\
    \ the preceding chapter, **TDBGrid** publishes a *DataSource* property, which\
    \ indirectly determines the dataset from which the grid retrieves data. However,\
    \ because a grid can display data from multiple fields at the same time, there\
    \ is no *DataField* property. Instead, **TDBGrid** provides a *Columns* property\
    \ that enables you to specify which fields to display in the grid as well as the\
    \ ordering of the fields and other display-related settings. These are discussed\
    \ in detail in the following section, “Customizing Columns.”"
  merge: -1
  img_proc: true
- pgno: 253
  md: 'The simplest way to use a TDBGrid is to drop it on a form, connect the data
    source, open the dataset, and then run the application. If you do this, you''ll
    see a fairly mundane grid using all default settings, as shown in Figure 6.2.


    ![](img/fe651f295b5f960d5463c4fb581d2281_253_0.png)


    Figure 6.2 points out examples of title cells, data cells, indicator cells, and
    grid background. Using a combination of the grid’s properties and events, you
    can create a grid that looks much more pleasing to the eye. In the following sections,
    I’ll examine those properties and events in detail.


    # Customizing Columns


    Generally, the most basic level of customization that you want to perform is adjusting
    either the number of columns that are displayed, or the order in which the columns
    are displayed. TDBGrid published a Columns property, which provides access to
    the list of columns displayed in the grid.


    You can think of the Columns property as being similar to a dataset''s Fields
    property. If there are no columns specifically defined, the grid simply displays
    all columns in the order that they appear in the dataset. If persistent fields
    are defined for the dataset, the grid displays columns only for those fields.


    To create persistent column objects for the grid (similar to a dataset''s persistent
    field objects), you use the columns editor.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Double-click the grid component at design time (or right-click it and select
    Columns Editor… from the pop-up menu) to display the columns editor. The columns
    editor works like most collection editors in Delphi—press Ins to create a new
    TColumn object, or right-click and select Add from the pop-up menu.


    Each column supports a number of properties that can be used to customize the
    column’s look and feel. (For the ultimate in display flexibility, see the “Custom
    Drawing” section later in this chapter.) These properties are listed in Table
    6.1.


    # TABLE 6.1 Basic TColumn Properties


    | Property | Description |

    | :--- | :--- |

    | **Alignment** | Sets the alignment of the data displayed in the column to left-justified,
    centered, or right-justified. |

    | **Color** | Sets the background color of the individual column. |

    | **FieldName** | Specifies the name of the field in the underlying dataset that
    is to be displayed in this column. Any field can be displayed (including data
    fields, calculated fields, lookup fields, and aggregate fields). |

    | **Font** | Customizes the font used to display the column data. |

    | **ReadOnly** | When *True*, the column data cannot be edited, even if the underlying
    field and dataset allow editing. |

    | **Title** | Enables customization of the column’s title cell. This property
    is discussed later in the “Column Titles” section. |

    | **Visible** | When *False*, the column is not displayed. |

    | **Width** | Sets the width of the column in screen pixels. |


    When you set the `FieldName` property, Delphi sets the `Alignment` and `Width`
    properties automatically (based on the size and type of the field). Unfortunately,
    even though Delphi sets `Alignment` to `taRightJustify` for a numeric field, it
    doesn’t automatically set the title’s alignment to `taRightJustify`. So, you need
    to set the title’s alignment manually.


    # **NOTE**


    > It is possible to add a column for which no underlying data field exists. To
    do so, insert a new column and leave the `FieldName` property blank. When doing
    this, you need to set the column''s `Alignment` and `Width` properties manually,
    and you must use the grid''s custom draw functionality to paint the cell contents
    for that column. For example, you might want to create a column with no associated
    field to display an icon in certain rows.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# ## Column Types


    Most columns are displayed and edited as a simple string. For cases in which you
    want the user to select from a list of values, or want to display a dialog that
    enables the user to select the cell value, **TDBGrid** supports two types of embellishments
    that can be made to a column’s active cell:


    +   - A column can display a lookup combo box to enable the user to select from
    a predefined list of values. If a column is linked to a lookup field in a dataset,
    the column automatically displays a combo box of acceptable values when the user
    is editing that column.

    +   - A column can display an ellipsis button, which can be programmed to display
    a dialog, or programmed to perform some other function when the user clicks it.


    The properties listed in Table 6.2 are used to set options for the various column
    styles.


    **TABLE 6.2 Additional TColumn Properties**

    | Property | Description |

    | :--- | :--- |

    | ButtonStyle | When set to **bsAuto** (the default value), the column automatically
    displays a combo box for lookup fields. You can manually set this property to
    **bsEllipsis** (displaying an ellipsis button) or to **bsNone** (suppressing the
    combo box for lookup fields). |

    | DropDownRows | Specifies the maximum number of items to display in the column’s
    combo box when it is dropped down. |

    | PickList | For columns that are not connected to a lookup field, you can specify
    a list of acceptable field values in the **PickList** property. If this property
    is used, the column automatically displays a combo box when it is edited (unless
    the column’s **ButtonStyle** property is set to **bsNone**). |


    For columns with a **ButtonStyle** of **bsEllipsis**, the grid’s **OnEditButtonClick**
    event is fired when the user clicks the ellipsis button. The sample program presented
    at the end of this section shows how you might respond to that event.


    # ## Column Titles


    In addition to customizing the look of the column data, you can customize the
    look of the columns’ titles. To change the font used for all column titles at
    the same time, you can set the grid’s **TitleFont** property accordingly.


    However, for control over each column title, you should resort to the individual
    column’s **Title** property. The **Title** property expands to enable the following
    properties to be set for the column title.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '| **TABLE 6.3** TColumn Title Properties |  |  |  |


    As mentioned earlier, Delphi does not automatically set the title''s `Alignment`
    property to `tRightJustify` for numeric fields. So, you should make sure that
    you check the title''s alignment when creating persistent columns.


    # Grid Options


    After you have set up the columns that you want to be displayed in the grid, you
    can set gridwide options that determine the overall look and feel of the grid.
    Table 6.4 lists the available options.


    | **TABLE 6.4** TDBGrid Options |  |  |  |'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# TABLE 6.4 Continued


    | Option | Description |

    | :--- | :--- |

    | dgRowSelect | When set, clicking a row highlights the entire row rather than
    selecting an individual cell. Row highlighting can also be accomplished manually
    by custom drawing the grid, as explained later in this chapter. |

    | dgAlwaysShowSelection | Set this option to highlight the current cell even when
    the grid does not have focus. |

    | dgConfirmDelete | If the grid''s ReadOnly property is not set, this option causes
    the VCL to display a delete confirmation message when the user presses Ctrl+Delete
    while in the grid. If this option is not set, the current record is deleted when
    the user presses Ctrl+Delete. Note that Ctrl+Delete deletes the current record
    even if dgEditing is not set. |

    | dgCancelOnExit | This option affects how newly inserted rows are treated when
    the user tabs out of the grid. When set, newly inserted rows for which no data
    has been entered are canceled. If not set, inserted rows that are left empty are
    posted to the dataset. |

    | dgMultiSelect | When set, the user can select multiple rows in the grid by pressing
    Ctrl and clicking individual rows. |


    By default, Options is set to [dgEditing, dgTitles, dgIndicator, dgColumnResize,
    dgColLines, dgRowLines, dgTabs, dgConfirmDelete, dgCancelOnExit]. I find that
    when I use a TDBGrid, I turn off the dgEditing and dgIndicator options, and set
    the grid''s ReadOnly property to True. Instead of allowing my users to edit directly
    in the grid, I display a dialog when they press Enter and enable them to edit
    field values for the current record there. Of course, your mileage might vary,
    and you''ll determine your own favorite set of options as you use the grid in
    your applications.


    # Events


    In addition to the properties listed previously, TDBGrid provides a number of
    events that you can respond to for finer control over the grid''s display and
    functionality. These events are listed in Table 6.5.


    # TABLE 6.5 TDBGrid Events


    | Event | Description |

    | :--- | :--- |

    | OnCellClick | Fires when the user clicks a cell. Does not fire when the user
    clicks a title cell, the indicator, or the grid background. |

    | OnColEnter | Fires immediately after focus enters the current column. |'
  merge: -1
  img_proc: true
