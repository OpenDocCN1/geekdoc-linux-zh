- pgno: 279
  md: '# # Properties


    TDBCtrlGrid introduces a handful of properties that you can use to customize its
    look and feel. Table 6.7 lists these properties.


    TABLE 6.7 TDBCtrlGrid Properties

    | Property | Description |

    | :------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
    |

    | AllowInsert | When True, the user can scroll past the last record in the grid
    to insert a new record. |

    | AllowDelete | When True, the user can delete the current record by pressing
    Ctrl+Delete. |

    | ColCount | Determines the number of columns displayed in the grid. |

    | Orientation | Determines the direction in which the grid scrolls to display
    more data. |

    | PanelBorder | Possible values are gbNone and gbRaised. gbRaised causes the grid
    to have a raised look. You can achieve other looks, such as lowered or bump, by
    setting PanelBorder to gbNone and dropping the TDBCtrlGrid on a panel with the
    desired bevel. |

    | PanelHeight | Refers the height, in pixels, of a single panel (cell). |

    | PanelWidth | Refers to the width, in pixels, of a single panel (cell). |

    | RowCount | Determines the number of rows displayed at a time in the grid. |

    | SelectedColor | Determines the background color of the current cell. |

    | ShowFocus | When True, a focus rectangle is drawn around the current cell. |


    The ColCount, PanelWidth, and Width properties are directly related. ColCount×PanelWidth
    is approximately equal to Width (allowing for the grid border and vertical scrollbar).
    Setting ColCount automatically adjusts the Width, as long as the Align setting
    does not prevent it. (Setting Align to aClient, for example, does not allow the
    grid to resize. In this case, setting ColCount automatically adjusts PanelWidth.)


    Similarly, the RowCount, PanelHeight, and Height properties are related. Setting
    one property affects the others.


