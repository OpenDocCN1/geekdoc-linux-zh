- pgno: 174
  md: 'The results of this test are impressive. The baseline test (which doesn’t disable
    controls) takes about 19.6 seconds to run on my 1.4GHz Pentium 4. With the additional
    five lines to disable and re-enable data-aware components, the code takes a mere
    560ms to execute (and has no annoying screen activity, to boot).


    # # BLOBs


    BLOBs, or Binary Large Objects, are a fundamental part of many modern database
    applications. Whether you want to store images, formatted and unformatted notes,
    streamed components, or any other chunk of bytes; BLOBs are an essential part
    of your database-programming repertoire.


    In this section, I’ll show you how to effectvively store BLOBs in a client dataset
    and how to retrieve them later. In the pages to follow, I’ll focus specifically
    on notes, images, streamed components, and generic BLOB storage.


    As with other field types, you can create BLOB fields either at design time or
    at runtime. The following code snippet shows how to create a BLOB field at runtime:


    ```

    ClienDataSet1.FieldDefs.Add( ''Notes'' , ftBLOB );

    ```


    This code creates a field named **Notes**, of type **ftBLOB**.


    # ## Notes


    One of the most common ways to use a BLOB field is to store notes, or free-format
    text. For small amounts of text a string field typically suffices, but if you
    want to store entire memos, you need to use a BLOB field.


    Accessing a BLOB as a string is particularly easy. You can simply call the **AsString**
    method on the field, like this:


    ```

    Memo1.Text := ClienDataSet1.FieldByName(''Notes'').AsString;

    ```


    Similarly, to store the memo back to the field, you would write code like the
    following:


    ```

    ClienDataSet1.FieldByName( ''Notes'' ).AsString := Memo1.Text ;

    ```


    # ## Images


    Another common use of BLOB fields is to store images. You might want to write
    a Delphi application to catalog the pictures you’ve taken on your digital camera,
    or you might want to track scanned documents in a paperness office. Either way,
    a BLOB field provides the necessary support to store these images in a database.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Like formatted and unformatted memos, Delphi provides a data-aware version
    of an image: **TDBImage**. **TDBImage** is lacking, however, because it only correctly
    stores and retrieves bitmaps (*.BMP files). A robust application should store
    bitmaps, JPGs, and (almost) any other image type that the user might want to store.


    There are at least three methods that you can use to store multiple image types
    in a dataset. They include:


    +   * Creating a separate field that will be used to store the image type. Use
    this field value to determine how to store/load the image.

    +   * Writing a value to the BLOB field indicating the image type, immediately
    followed by the image data.

    +   * Using a third-party imaging library to do the work for you.


    The following sections discuss these options.


    # Using a Separate Field to Store the Image Type


    One way to track the type of image stored in a dataset is to add a separate field,
    perhaps named `ImageType`, to track the type of image. Say, for the sake of argument,
    that your application can store BMPs and JPGs. You would set up constants for
    each image type, like this:


    ```

    const

    IMAGE_NONE = 0;

    IMAGE_BMP = 1;

    IMAGE_JPG = 2;

    ```


    Presumably, the `ImageType` field contains the value `IMAGE_NONE` when the BLOB
    field is **NULL**. To implement this method correctly, you must remember to set
    the `ImageType` field whenever the user loads an image, and then reset it to `IMAGE_NONE`
    if the user clears the image.


    # Streaming the Image Type as Part of the BLOB Field


    With a little extra code, you can dispense with the additional field and store
    the image type in the BLOB field along with the image itself. Figure 4.2 shows
    conceptually what is involved with this method.


    The following pseudo-code shows how you might implement this method:


    ```

    procedure SaveImage;

    begin

    OpenOutputStream;

    WriteImageType;

    WriteImageData;

    end;

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: "```\nprocedure LoadImage;\nvar\n   ImageType: Integer;\nbegin\n   OpenInputStream;\n\
    \   ImageType := ReadImageType;\n   case ImageType of\n      IMAGE_BMP: ReadBitmap;\n\
    \      IMAGE_JPG: ReadJPEG;\n   end;\nend;\n```\n\nThe sample application provided\
    \ at the end of this section illustrates both of these techniques.\n\n![](img/fe651f295b5f960d5463c4fb581d2281_176_0.png)\n\
    \n# FIGURE 4.2\n\n> The image type immediately precedes the image data in the\
    \ BLOB field.\n\n# Third-Party Imaging Libraries\n\nThird-party imaging libraries\
    \ generally follow the steps outlined in the preceding section (that is, they\
    \ typically store a value to the stream indicating the type of image stored in\
    \ the stream). Immediately following the image type is the image itself.\n\nHowever,\
    \ other third-party libraries might always store an image internally in a proprietary\
    \ format, and then read and write that image format to and from the stream. The\
    \ point is that after you decide on an imaging library and implement it in your\
    \ applications, you shouldn't expect that you can arbitrarily swap out the library\
    \ with a different one at a later date. Switching image libraries might require\
    \ you to write a data conversion program for your BLOB data."
  merge: -1
  img_proc: true
- pgno: 177
  md: "# NOTE\n\nIf you're looking for a good imaging library, check out Skyline Tools\
    \ Imaging's ImageLib Corporate Suite. ImageLib Corporate Suite has won numerous\
    \ awards as the best Delphi imaging library available (including *Delphi Informant\
    \ Magazine*'s coveted Reader's Choice award). I use ImageLib in my own applications\
    \ and recommend it highly. You can find Skyline Tools Imaging at `http://www.imagelib.com`.\n\
    \n# ## Streamed Data\n\nIn addition to streaming images, there are times when\
    \ you might want to stream out unstructured data to a BLOB field. Perhaps you\
    \ want to store a linked list of integers in a single field, for example. The\
    \ following code snippet shows how you can use a stream to save data to a BLOB,\
    \ and then read it back in later.\n\n```\nprocedure SaveListToBlob(List: TList);\n\
    var\n    Stream: TStream;\n    Num: Integer;\n    Index: Integer;\nbegin\n   \
    \ Stream := C1ientDataSet1.CreateBlobStream(\n        C1ientDataSet1.FieldByName('DATA'),\
    \ bmWrite);\n    try\n        // Write out the number of integers\n        Num\
    \ := List.Count;\n        Stream.Write(Num, sizeof(Num));\n\n        for Index\
    \ := 0 to List.Count - 1 do begin\n            Num := Integer(List[Index]);\n\
    \            Stream.Write(Num, sizeof(Num));\n        end;\n    finally\n    \
    \    Stream.Free;\n    end;\nend;\n```\n\n```\nprocedure LoadListFromBlob(List:\
    \ TList);\nvar\n    Stream: TStream;\n    Count: Integer;\n    Index: Integer;\n\
    \    Num: Integer;\nvar\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: "```\nbegin\n  Stream := ClientDataSet1.CreateBlobStream(\n            ClientDataSet1.FieldByName('DATA'),\
    \ bmRead);\n  try\n    List.Clear;\n\n    Stream.Read(Count, sizeof(Count));\n\
    \    for Index := 0 to Count - 1 do begin\n      Stream.Read(Num, sizeof(Num));\n\
    \      List.Add(Pointer(Num));\n    end;\n  finally\n    Stream.Free;\n  end;\n\
    end;\n```\n\nNote the use of `Stream.Write` and `Stream.Read` in the previous\
    \ procedures. Both of these methods take a reference to the data to be written\
    \ as the first parameter, and the number of bytes to write as the second parameter.\
    \ Saving a block of data is as straightforward as making repeated calls to `TStream.Write`.\
    \ You must make sure to read the data in exactly the same order as it was written\
    \ in, or you will end up with an exception at best and corrupted data at worst.\n\
    \nNote also the use of the `TDataSet` method `CreateBlobStream` to create a blob\
    \ stream suitable for the dataset. Many beginning Delphi database programmers\
    \ attempt to call `TBlobStream.Create`, like this:\n\n```\nvar\n  Stream: TBlobStream;\n\
    begin\n  Stream := TBlobStream.Create(...);\n  try\n    // Read from or write\
    \ to the stream here.\n  finally\n    Stream.Free;\n  end;\nend;\n```\n\nThe problem\
    \ with this approach is that `TBlobStream` is specific to the BDE. Creating an\
    \ instance of `TBlobStream` will not work with non-BDE datasets, such as `TClientDataSet`.\
    \ To create a blob stream that will work with the current dataset, always call\
    \ the dataset's `CreateBlobStream` method, like this:"
  merge: -1
  img_proc: true
- pgno: 179
  md: "```\n```\nvar\nStream: TStream;\nbegin\n    Stream := TheDataSet.CreateBlobStream(...);\n\
    \    try\n        // Read from or write to the stream here.\n    finally\n   \
    \     Stream.Free;\n    end;\nend;\n```\n```\n\nNotice that $Stream$ is defined\
    \ as a $TStream$, which is the ancestor class for streams. The actual stream returned\
    \ may in fact be a $TBlobStream$ (for a $BDE$ dataset) or another kind of stream.\
    \ Thanks to polymorphism, you can operate on the stream without knowing its exact\
    \ class type.\n\n# ## Streamed Components\n\nAlthough the concept of streaming\
    \ data relies on you (the programmer) to make sure to read and write data in the\
    \ same order, by creating and streaming a component, you can let Delphi's built-in\
    \ streaming mechanism do the work for you.\n\nDelphi provides streaming support\
    \ for components derived from $TPersistent$, as well as helper functions for the\
    \ $TCollection$ family of classes.\n\nTo make streaming the list of integers that\
    \ were described previously more automatic, let's create a component wrapper for\
    \ the data.\n\n```\n```\nTIntegerItem = class(TCollectionItem)\nprivate\n    FNumber:\
    \ Integer;\npublished\n    property Number: Integer read FNumber write FNumber;\n\
    end;\n```\n```\n\n```\n```\nTIntegerList = class(TComponent)\nprivate\n    FIntList:\
    \ TCollection;\npublished\n    property IntList: TCollection read FIntList;\n\
    end;\n```\n```\n\nGranted, this might be overkill for a data structure as simple\
    \ as a list of integers, but the same concept works for a component containing\
    \ multiple fields or complex subdata."
  merge: -1
  img_proc: true
- pgno: 180
  md: "> NOTE\n> It is beyond the scope of this book to present a detailed discussion\
    \ of Delphi's streaming support. For more information on streaming, please refer\
    \ to the *Component Writer's Guide* or to the ultimate reference, the VCL/CLX\
    \ source itself. If you are fortunate enough to own a copy of Danny Thorpe's *Delphi\
    \ Component Design*, it also has an informative chapter on Delphi's streaming\
    \ mechanism.\n\n# File BLOBs\n\nAnother common use of BLOB fields is storing an\
    \ entire file inside a BLOB. For example, say that you have a large number of\
    \ PDF documents that you want to catalog and allow your users to read.\n\nBy storing\
    \ the PDF files in a BLOB field, you can fairly easily create an application that\
    \ enables the user to search for the PDF by category or keyword, and then view\
    \ the file on his computer.\n\nYou can load an external file into a BLOB field\
    \ by using the field's `LoadFromFile` method, as the following code snippet shows:\n\
    \n```\nvar\n  B: TBlobField;\nbegin\n  B := ClientDataSet1.FieldByName('AttachedFile');\n\
    \  B.LoadFromFile('C:\\PROPOSAL.PDF');\nend;\n```\n\nIf you want to save the file\
    \ back to disk (perhaps to load it into an application such as Acrobat Reader),\
    \ you would write the following:\n\n```\nvar\n  B: TBlobField;\nbegin\n  B :=\
    \ ClientDataSet1.FieldByName('AttachedFile');\n  B.SaveToFile('C:\\TEMP.PDF');\n\
    end;\n```\n\n# Limitations of BLOB Fields\n\nFor all their usefulness, BLOBs do\
    \ have a couple of limitations. Namely:\n\n+   - You can't (currently) perform\
    \ a filter on a BLOB field. New versions of relational databases, such as Informix,\
    \ support searching on BLOBs. Once this functionality is added to the core dBExpress\
    \ technology, `TClientDataSet` might very well be updated to support it also."
  merge: -1
  img_proc: true
