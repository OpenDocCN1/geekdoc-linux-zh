- pgno: 269
  md: "# Solutions to Common Grid Questions\n\nIn this section, I\\'ll attempt to\
    \ answer a number of commonly asked questions about the `TDBGrid` component. The\
    \ solutions to these problems are not overly difficult, but in most cases they\
    \ involve more than simply calling a method or setting a property.\n\n# Determining\
    \ the Current Row or Column\n\nSometimes you might need to determine what row,\
    \ column, or cell is currently focused. Depending on the information that you\
    \ need, there are several ways to go about this.\n\nIf all you need to know is\
    \ what row has the focus, the easiest thing to do is to check the underlying dataset.\
    \ The dataset\\'s current record is the one that has focus. So, if you want to\
    \ get the value of the current `Salary` column, you can do the following:\n\n\
    ```\n```pascal\nvar\n CurrentSalary: Double;\nbegin\n CurrentSalary :=  DBGrid1.DataSource.DataSet.FieldName('Salary').AsFloat;\n\
    \ ...;\nend;\n```\n```\n\nTo get the index of the focused column, you can access\
    \ the grid\\'s `SelectedIndex` property. `SelectedIndex` is a zero-based number\
    \ indicating the absolute position of the selected column. `SelectedIndex` adjusts\
    \ for the indicator, so if the indicator is present, the first data column is\
    \ index 1. If the indicator is not displayed, the first data column is index 0.\n\
    \nTo retrieve the field object for the current column, you can reference the grid\\\
    's `SelectedField` property. `SelectedField` returns the underlying dataset\\\
    's `TField` object, so you can directly access it to retrieve the value of the\
    \ current cell.\n\n```\n`ShowMessage('The current cell value is ' + DBGrid1.SelectedField.AsString);`\n\
    ```\n\n**NOTE**\n\nIf the current column is not connected to a dataset field,\
    \ `SelectedIndex` returns −1 and `SelectedField` returns `nil`. If you display\
    \ any columns in your grid that are not tied to a field, you should always check\
    \ for −1 or `nil` before attempting to do something with the `SelectedIndex` or\
    \ `SelectedField` properties.\n\n# Getting the Cell at a Given Mouse Coordinate\n\
    \nWith a little effort, you can determine the row and column of the cell at any\
    \ mouse position. Normally, you don\\'t need to do this because you can use the\
    \ dataset\\'s current record and the grid\\'s `SelectedIndex` or `SelectedField`\
    \ properties to determine the current cell. However, you might want to know about\
    \ a cell that isn\\'t current."
  merge: -1
  img_proc: true
- pgno: 270
  md: "For example, say that you want to write an event handler that tracks the current\
    \ position of the mouse and provides information about the field at that location.\
    \ A more ambitious project might be to write code that displays a tooltip when\
    \ the mouse hovers over a cell whose contents are too long to be fully displayed\
    \ in the cell.\n\nIn either case, you can call the grid's `MouseCoord` method\
    \ passing in the X and Y coordinates of the mouse relative to the grid control.\
    \ `MouseCoord` passes back a `TGridCoord` structure, which contains X and Y fields\
    \ representing the absolute column and row indexes of the cell at that mouse position.\n\
    \n`TGridCoord`'s X and Y values deserve a little explanation. These are absolute\
    \ indexes, meaning that they take the indicator column and title rows into account.\
    \ If the indicator is displayed, the X position of the first data column is 1.\
    \ If the indicator is not displayed, it is 0. This is also true for the rows:\
    \ If the grid titles are not displayed (`dgTitles` is not set in the grid's `Options`\
    \ property), the Y position of the first row of data is 0. If titles are displayed,\
    \ it is 1.\n\nIf the mouse position is not over a cell (for instance, the mouse\
    \ is over the background area of the grid), the returned `TGridCoord`'s X and\
    \ Y values are both -1.\n\nThe following code snippet shows how you might update\
    \ a label to show the X and Y positions, as well as the field name, of the cell\
    \ at the current mouse position.\n\n```\n```pascal\nprocedure TForm1.DBGrid1MouseMove(Sender:\
    \ TObject; Shift: TShiftState; X,\n      Y: Integer);\nvar\n      GC: TGridCoord;\n\
    \      IndicatorOffset: Integer;\n      TitleOffset: Integer;\nbegin\n      GC\
    \ := DBGrid1.MouseCoord(X, Y);\n      if GC.X = -1 then\n        Label1.Caption\
    \ := IntToStr(GC.X) + ', ' + IntToStr(GC.Y)\n      else begin\n        if dgIndicator\
    \ in DBGrid1.Options then\n          IndicatorOffset := 1\n        else\n    \
    \      IndicatorOffset := 0;\n\n        if dgTitles in DBGrid1.Options then\n\
    \          TitleOffset := 1\n        else\n          TitleOffset := 0;\n\n   \
    \     if GC.X < IndicatorOffset then\n          Label1.Caption := IntToStr(GC.X)\
    \ + ', ' + IntToStr(GC.Y) +\n```\n```"
  merge: -1
  img_proc: true
- pgno: 271
  md: "```\n```text\n` - Indicator`\nelse\n    Label1.Caption := IntToStr(GC.X) +\
    \ ', ' + IntToStr(GC.Y) + ' : ' +\n        DBGgrid.Columns[GC.X - IndicatorOffset].FieldName;\n\
    \n// To move the dataset to the corresponding record, clone the dataset,\n// and\
    \ set the clone's RecNo property to GC.Y - TitleOffset.\nend;\nend;\n```\n```\n\
    \nAt the end of that code snippet is a comment explaining how to retrieve the\
    \ data for the appropriate cell. Here is the code required to do that (assuming\
    \ that the grid is connected to a client dataset):\n\n```\n```pascal\nvar\n  \
    \  ClonedDS: TClientDataSet;\n    FieldValue: string;\nbegin\n ...\n\nCionedDS\
    \ := TClientDataSet.Create(nil);\ntry\n    CionedDS.CloneCursor(DBGgrid.DataSource.DataSet);\n\
    \    CionedDS.RecNo := GC.Y - TitleOffset;\n\n    // Now access the fields of\
    \ the cloned dataset\n    FieldValue := ClonedDS.FieldByName(DBGgrid.Columns[GC.X\
    \ -\n        IndicatorOffset].FieldName).AsString;\nfinally\n    ClonedDS.Free;\n\
    end;\nend;\n```\n```\n\n# Setting Edit Mode Manually\n\nIf dgdAlwaysShowEditor\
    \ is True, the grid automatically enters edit mode when the user enters a cell.\
    \ If dgdAlwaysShowEditor is False, the grid enters edit mode when the user presses\
    \ F2. (The user can simply start typing a value to overwrite a cell’s contents.)\
    \ However, what if (for compatibility with another software package) you want\
    \ to enter edit mode when the user presses a different key—perhaps F9 instead\
    \ of F2?\n\nTo achieve this, you need to take control over when the grid enters\
    \ edit mode. The best place to do this is in the grid’s OnKeydown event. Within\
    \ that handler, set the grid’s EditMode property to True to enter edit mode.\n\
    \nThe following code snippet shows how to enter edit mode when the user presses\
    \ F9 (not when he or she presses F2)."
