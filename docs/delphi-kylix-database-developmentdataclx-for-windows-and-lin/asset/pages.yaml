    \n![](img/fe651f295b5f960d5463c4fb581d2281_25_0.png)\n\n# Disconnecting from the\
    \ Database\n\nWhen you are finished accessing the database in your application,\
    \ you should disconnect from it. This releases resources on both the client and\
    \ the server. You can disconnect from the database manually or automatically.\n\
    \n# Manually Disconnecting from a Database\n\nManually disconnecting from a database\
    \ is straightforward. Simply issue one of the following two commands:\n\n```\n\
    SQLConnection1.Connected := False;\n```\n\nor\n\n```\nSQLConnection1.Close;\n\
    ```\n\nThe method you use depends on whether you prefer to set a property or call\
    \ a method to disconnect from the database.\n\n# Automatically Disconnecting from\
    \ a Database\n\nIf you want to enable dbExpress to automatically disconnect from\
    \ the database when there are no open datasets, you should set `SQLConnection.KeepConnection\
    \ := False`. VCL/DataCLX monitors the number of open datasets on the connection,\
    \ and when the last dataset is closed, the connection is automatically dropped."
