- pgno: 374
  md: "The cdsContactsNewRecord and cdsTodosNewRecord events make a call to the local\
    \ method GetNextID. GetNextID clones the dataset in question and moves to the\
    \ first record in the dataset. The first record is the record with the lowest\
    \ numbered ID. It then assigns the next lower number to the ID of that record,\
    \ ensuring that the record has a negative primary key.\n\nThe reason this is done\
    \ is to ensure that all records that have not yet been added to the database have\
    \ a negative ID. The server-side data module checks for a negative ID and then\
    \ calls the database’s GEN_ID stored procedure to assign a unique ID. This ensures\
    \ that all added records receive a unique ID, regardless of what computer they\
    \ were added from. (Remember that multiple users may be running this application\
    \ at the same time.)\n\n# Note\n\nAn alternative to using the cloned dataset to\
    \ retrieve the next negative ID is to set up a private variable and retrieve the\
    \ next ID at program startup. That way you can simply decrement the variable to\
    \ obtain the next ID. The reason I don’t do this is because in real-world applications\
    \ I sometimes have 40 or 50 datasets in my data module. I don’t like to set up\
    \ 40 or 50 variables—one for each dataset. Instead, I use the common function\
    \ to retrieve the next ID on the fly.\nNote that cloning a dataset does temporarily\
    \ require a small amount of memory, and also takes a small amount of time to do.\
    \ If you need to generate temporary IDs as quickly as possible, you should consider\
    \ using a private variable instead.\n\nListing 9.5 contains the source code for\
    \ the client’s main form, which is where the bulk of the code for this application\
    \ lies.\n\n# LISTING 9.5\nConMan—MainForm.pas\n\n```\nunit MainForm;\n\ninterface\n\
    \nuses\n    Windows, Messages, SysUtils, Variants, Classes, Graphics, Controls,\
    \ Forms,\n    Dialogs, DBActns, StdActns, ComCtrls, BandActn, ExtCtrls, Menus,\
    \ Grids, DBGrids,\n    DB, StdCtrls, DBCtrl, Mask, ExtDlgs;\n\ntype\n    TfrmMain\
    \ = class(TForm)\n    StatusBar1: TStatusBar;\n    ImageList1: TImageList;\n```"
