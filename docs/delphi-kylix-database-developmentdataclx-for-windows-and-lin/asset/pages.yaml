- pgno: 230
  md: 'When it has a reference to the data link, CreateWnd sets up new event handlers
    for OnDataChange and OnUpdateData. OnDataChange is fired automatically when the
    underlying field data changes because either the current record changed, or because
    a new value was assigned to the field. OnUpdateData is fired when the user selects
    a value in the combo box, and the underlying field should be updated.


    TDBComboBox provides a handler for both of these methods, but the handlers don’t
    take into account our new FValues property. So, it’s necessary to override them.


    SetValues is called when you assign a new string list to the Values property,
    like this:


    ```

    ETHDBComboBox1.Values := MyStringList;

    ```


    It first assigns the string list, and then calls DataChange directly, which ensures
    that the combo box is updated to display the correct data.


    GetComboValue is a helper function that retrieves the correct value for a given
    index. It first checks the Values property to see if a value was assigned to the
    item in question. If so, it returns the value from that list. If not, it returns
    the value directly from the Items list.


    GetComboText returns the text for the currently displayed item in the combo box.
    If the combo box allows text entry—in other words, if the style is csDropDown
    or csSimple—the function simply returns the text displayed in the combo box. Otherwise,
    it calls GetComboValue to obtain the value of the current item.


    SetComboText works in reverse. It determines the index of a given string and makes
    that the current ItemIndex of the component.


    DataChange, as mentioned earlier, fires when the underlying field data changes.
    This method simply calls SetComboText to update the text displayed in the combo
    box.


    Conversely, UpdateData updates the underlying field so that it contains the correct
    value for the currently selected combo box item.


    TDBComboBox is used in a manner similar to the TDBRadioGroup component. If you
    leave the Values list empty, the item selected in the combo box is stored directly
    in the underlying field, which should be a string field. If the Values list is
    populated, the corresponding value is stored in the underlying field, which can
    be either a string field or a numeric field (depending on whether the Values list
    contains text or numbers).


    # TDBListBox


    TDBListBox is conceptually identical to TDBComboBox because it enables the user
    to select an item from a list of items. It also has the same limitation of TDBComboBox
    because it does not support a Values property. For that reason, I’ve created my
    own version of TDBListBox.'
  merge: -1
  img_proc: true
