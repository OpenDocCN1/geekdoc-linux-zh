  md: "![](img/fe651f295b5f960d5463c4fb581d2281_326_0.png)\n\n# **FIGURE 7.5**  \n\
    DataFetch main form showing relationships between components.\n\nTwo dBExpress\
    \ datasets—sqlContacts and sqlTodos—are linked in a master/detail relationship.\
    \ A TDataSetProvider is connected to the sqlContacts (master) dataset. Remember\
    \ that a provider is not needed for the detail dataset. This constitutes the server\
    \ side of the equation.\n\nNext, two client datasets—cdsContacts and cdsTodos—represent\
    \ the tables on the client side. cdsTodos is a nested dataset inside the cdsContacts\
    \ dataset.\n\nThe FormCreate method opens the cdsContacts client dataset. This\
    \ causes a chaining effect that opens the sqlContacts dBExpress dataset and sends\
    \ the results back to the client through the pvContacts provider.\n\nTwo buttons\
    \ on the form, labeled Fetch Details and Fetch Blobs, call the btnFetchDetailsClick\
    \ and btnFetchBlobsClick events, respectively. These two events, in turn, call\
    \ the client dataset's FetchDetails and FetchBlobs methods. They then call the\
    \ ShowTodoCount method, which we’ll examine shortly.\n\ncdsContractsAfterScroll\
    \ is fired whenever the current record changes on the cdsContracts dataset. It\
    \ also makes a call to ShowTodoCount.\n\ncdsContactsApplyUpdates is a method that\
    \ is connected to cdsContacts’ AfterDelete and AfterPost events. What it does\
    \ is ensure that whenever a record is posted to the cdsContacts dataset, it is\
