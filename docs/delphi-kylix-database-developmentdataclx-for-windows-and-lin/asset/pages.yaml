- pgno: 302
  md: 'Like several of the other sample applications presented in this book, the Updates
    application contains an event log list box that shows you when and in what order
    interesting events fire for both the dataset provider and the client dataset.
    These events are discussed in the section titled “Provider Events,” later in this
    chapter.


    # # Resolving Changes to BLOB Fields


    TDataSetProvider doesn’t automatically check for conflicts on BLOB fields, including
    memos. If two users change the contents of a BLOB field or memo, the second user’s
    changes will overwrite the first user’s changes without warning.


    Probably the best way to deal with this situation is to add a corresponding integer
    field to your database for each BLOB field. The integer field contains an “update
    number” for the BLOB field. For instance, if the database table contains a column
    named IMAGE, add an integer column named IMAGEUNIQUE, or something similar. Create
    a trigger for the IMAGE column such that the IMAGEUNIQUE column is incremented
    whenever the value of the IMAGE column changes.


    Using this technique, your application can detect changes on the IMAGEUNIQUE column,
    which indicates that the IMAGE column was changed also.


    # # Refreshing Data from the Server


    Earlier chapters discussed the TDBNavigator component, with the exception of one
    button—the Refresh button.


    TDBNavigator’s Refresh button (which calls the TDataSet.Refresh method) is used
    to refresh the dataset from the underlying database. For TClientDataSet, Refresh
    refreshes the data by refetching all rows through the dataset provider.


    ### CAUTION


    Refresh will raise an exception if the dataset’s change log is not empty. Before
    you call TClientDataSet.Refresh directly, you should check the ChangeCount property
    to see if it is zero. If it is nonzero, either apply or cancel the updates first
    (using ApplyUpdates or CancelUpdates) or refrain from calling Refresh.


    Refreshing data from the provider is useful in those cases in which a reconciliation
    error occurs and you want to retrieve the latest data from the underlying database.
    You can also call it at other times to ensure that the local copy of the data
    is up to date.'
  merge: -1
  img_proc: true
- pgno: 303
  md: "Rather than calling `Refresh` to refresh the entire dataset, you can also call\
    \ `TClientDataSet.RefreshRecord` to refresh only the current record. `RefreshRecord`\
    \ does not raise an exception if the dataset's change log is not empty. Rather,\
    \ it leaves the entire change log intact, including any changes that may have\
    \ been made to the refreshed record.\n\n> **Note**  \n> \n> `RefreshRecord` requires\
    \ that `pfrnKey` be set for all fields in the primary key (as discussed in the\
    \ following section). In addition, you should usually call `RefreshRecord` only\
    \ when the `UpdateSetStatus` of the current record is `usUnmodified`.\n> \n> ```\n\
    > if ClientDataSet1.UpdateSetStatus = usUnmodified then\n>     ClientDataSet1.RefreshRecord;\n\
    > ```\n\n# # Update Modes\n\nWhen resolving data to the database, `TDataSetProvider`\
    \ automatically builds the necessary SQL statement to send to the server to perform\
    \ the update. An example of such an SQL statement is\n\n```sql\nUPDATE CONTACTS\
    \ SET LAST = 'Smith' WHERE ID = 5\n```\n\n`TDataSetProvider` allows you some control\
    \ over how the SQL statement is built. The first level of control is afforded\
    \ by the `TDataSetProvider.UpdateMode` property. `UpdateMode` may be set to one\
    \ of the values shown in Table 7.3.\n\n# **TABLE 7.3**  UpdateMode Values\n\n\
    | Value | Description |\n| :--- | :--- |\n| `upWhereAll` | All designated fields\
    \ are included in the `WHERE` clause. |\n| `upWhereChanged` | Only key fields\
    \ as well as modified fields are included in the `WHERE` clause. |\n| `upWhereKeyOnly`\
    \ | Only key fields are included in the `WHERE` clause. |\n\n\n\nAssume a table\
    \ named `EMPLOYEES` has four columns: `ID`, `NAME`, `BIRTHDAY`, and `SALARY`.\
    \ `ID` is the primary key for the table. One particular record in the table contains\
    \ the values `1`, \"John Smith\", `5/1/1958`, `$40,000`.\n\nThe following SQL\
    \ statements show what SQL statement would be generated for the various settings\
    \ of `UpdateMode`, assuming John Smith's `SALARY` field was changed from $40,000\
    \ to $45,000."
  merge: -1
  img_proc: true
- pgno: 304
  md: "When `UpdateMode = upWhereAll`, the SQL statement would be\n\n```sql\nUPDATE\
    \ EMPLOYEES SET SALARY TO 45000 WHERE (ID = 1) AND (NAME = 'John Smith')\nAND\
    \ (BIRTHDAY = '5/1/1958') AND (SALARY = 40000)\n```\n\nWhen `UpdateMode = upWhereChanged`,\
    \ the SQL statement would be\n\n```sql\nUPDATE EMPLOYEES SET SALARY TO 45000 WHERE\
    \ (ID = 1) AND (SALARY = 40000)\n```\n\nFinally, when `UpdateMode = upWhereKeyOnly`,\
    \ the SQL statement would be\n\n```sql\nUPDATE EMPLOYEES SET SALARY TO 45000 WHERE\
    \ ID = 1\n```\n\nTable 7.3 describes designated fields and key fields. So what\
    \ constitutes a designated field or key field, anyway? Each persistent field created\
    \ on the server data module has a `ProviderFlags` property, which is used to instruct\
    \ the provider how to treat the field. `ProviderFlags` is a set property and can\
    \ contain any or all the values listed in Table 7.4.\n\n`ProviderFlags` is a property\
    \ of `TField`, which means you don't need to have persistent fields to use `ProviderFlags`.\
    \ You can set `ProviderFlags` for a nonpersistent field, like this:\n\n`SQLClients.FieldByName('ID').ProviderFlags\
    \ := [pfInWhere, pfInKey];`\n\n# **TABLE 7.4 UpdateMode Values**\n\n| Value |\
    \ Description |\n| :---- | :---------- |\n| pfUpdate | The field can be modified.\
    \ |\n| pfInWhere | The field is included in the WHERE clause when UpdateMode is\
    \ set to upWhereAll or upWhereChanged. |\n| pfInKey | The field is part of the\
    \ primary key and controls such features as refreshing records through a call\
    \ to RefreshRecord, as well as reconciliation options such as merging. |\n| pfHidden\
    \ | The field is included in data packets sent to and from the client only to\
    \ serve as a way to make each record unique. The client dataset can't see or modify\
    \ the field. |\n\n> **Note**\n> \n> Nonpersistent fields also have a `ProviderFlags`\
    \ property, which is automatically set to [pfInUpdate, pfInWhere].\n\nContinuing\
    \ with the previous EMPLOYEES table example, you would set up persistent fields\
    \ for the table as shown in Table 7.5."
  merge: -1
  img_proc: true
- pgno: 305
  md: '**TABLE 7.5** *ProviderFlags Settings for the Fictitious EMPLOYEES Table Fields*


    | Field | ProviderFlags |

    |---|---|

    | ID | [pfInUpdate, pfInWhere, pfInKey] |

    | NAME | [pfInUpdate, pfInWhere] |

    | BIRTHDAY | [pfInUpdate, pfInWhere] |

    | SALARY | [pfInUpdate, pfInWhere] |


    **ID** is the primary key for the table.


    **NAME**, **BIRTHDAY**, and **SALARY** can all be updated, and they should all
    be included in the *WHERE* clause of an update SQL statement when the provider''s
    *UpdateMode* property is set to *upWhereAll*.


    # # Provider Options


    *TDataSetProvider* supports various options that determine the way in which data
    is sent to the client dataset, what changes are allowed to the data, and the way
    in which updates to the data are handled. *TDataSetProvider.Options* is a set
    property that enables you to customize these options to your liking.


    Table 7.6 shows the valid settings for the *Options* property.


    **TABLE 7.6** *TDataSetProvider Options*


    | Option | Description |

    |---|---|

    | poFetchBlobsOnDemand | When *True*, BLOBs are not returned from the server as
    part of the data packet. The client application must call *TClientDataSet.FetchBlobs*
    to retrieve BLOB data. When *False*, BLOBs are returned as part of the data packet.
    |

    | poFetchDetailsOnDemand | Used when the provider is part of a master/detail relationship.
    When *True*, detail records are not returned from the server as part of the data
    packet. The client application must call *TClientDataSet.FetchDetails* to retrieve
    detail records. When *False*, detail records are returned as part of the data
    packet. |

    | poIncFieldProps | When *True*, field properties including *Alignment*, *Currency*,
    *DisplayFormat*, *DisplayLabel*, *DisplayValues*, *DisplayWidth*, *EditFormat*,
    *EditMask*, *MaxValue*, *MinValue*, and *Visible* are sent to the client along
    with the data. |'
  merge: -1
  img_proc: true
- pgno: 306
  md: '| **TABLE 7.6** | Continued |

    |:--|:--|

    | *Option* | *Description* |

    | poCascadeDeletes | Used when the provider is part of a master/detail relationship.
    When True, the server deletes detail records automatically when the master record
    is deleted. |

    | poCascadeUpdates | Used when the provider is part of a master/detail relationship.
    When True, the server automatically updates detail records when the key value(s)
    of the master record changes. |

    | poReadOnly | When True, you can’t edit the data in the client dataset. |

    | poAllowMultiRecordUpdates | When True, allows updates that affect multiple records.
    When False, updates that affect more than one record raise an exception. |

    | poDisableInserts | When True, client datasets will not be able to `Insert` or
    `Append` new records. |

    | poDisableEdits | When True, client datasets will not be able to `Edit` existing
    records. |

    | poDisableDeletes | When True, client datasets will not be able to `Delete` existing
    records. |

    | poNoReset | When True, calls to AS_GetRecords ignore the reset flag. |

    | poAutoRefresh | When True, the provider automatically refreshes updated records
    with the latest data from the database. It is important to note that this option
    is not yet implemented in Delphi as of version 6. |

    | poPropagateChanges | When True, any changes made to data during the `BeforeUpdateRecord`
    or `AfterUpdateRecord` event handlers are sent back to the client. |

    | poAllowCommandText | When True, the client dataset can override the `CommandText`
    property of the provider’s dataset. When False, attempting to set the client dataset’s
    `CommandText` property raises an exception. |

    | poRetainServerOrder | When True, alerts the client dataset that it should not
    attempt to sort the data returned from the server. |


    At the time of this writing, the `poAutoRefresh` option is not implemented. `poAutoRefresh`
    will be useful for refreshing an updated record from the database when the database
    fills in field values automatically.'
