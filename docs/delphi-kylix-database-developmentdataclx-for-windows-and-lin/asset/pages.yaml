- pgno: 70
  md: 'The preceding chapter presented an overview of dbExpress connections and the
    TSQLConnection component. You learned how to connect to and disconnect from a
    database, how to set connection parameters, and how to retrieve schema information
    from a database.

    In this chapter, I’ll introduce dbExpress datasets, which enable you to retrieve
    data from the database connection.


    I’ll make references to a number of dataset methods, such as First, Next, FieldByName,
    and so on. These methods are actually defined at the TDataSet level, which means
    that they are applicable to all types of datasets (including BDE, ADO, dbExpress,
    and the like).


    These methods are well documented in the Delphi help files and in other general-purpose
    Delphi books—I apply them in Chapter 3, “Client Dataset Basics.” For these reasons,
    I won’t go into excruciating detail here. Instead, I will provide short code snippets
    to show how they’re used in context.


    # # What Are dbExpress Datasets?


    Datasets are the means by which dbExpress retrieves data from a database. For
    example, given the following SQL SELECT statement:


    ```

    SELECT * FROM EMPLOYEES

    ```


    The employee rows are returned in a dataset. You saw in the preceding chapter
    that TSQLConnection could directly process SQL statements that did not return
    a result set. For queries that return a result set, TSQLDataSet (and its derivatives)
    should be used.


    Let’s take a moment to discuss the characteristics of dbExpress datasets, and
    then we’ll move into the concrete dbExpress classes that implement them.


    # ## dbExpress Datasets Are Unidirectional


    The most important thing to know about dbExpress datasets is that they are unidirectional.
    At first this might seem like a huge disadvantage, but in the rest of this book,
    you’ll see how the dbExpress architecture provides for an extremely lightweight,
    flexible, and powerful means of accessing and updating data.


    Because dbExpress datasets are unidirectional, the only navigating that you can
    do is moving from the beginning of the dataset to the end—one record at a time.
    If you’re familiar with other Delphi datasets (such as TTable, TADODataSet, or
    TIBDataSet), you might be wondering how to search for records or move backward
    through the dataset. Again, the solution to these issues will become crystal clear
    in later chapters.'
  merge: -1
  img_proc: true
- pgno: 71
  md: "# ## dbExpress Datasets Are Read-Only\n\ndbExpress datasets are a read-only\
    \ view into the underlying data in a database. No editing features are directly\
    \ supported by dbExpress datasets, so any attempt to edit a dbExpress record results\
    \ in a Delphi exception, as shown in Figure 2.1.\n\n![](img/fe651f295b5f960d5463c4fb581d2281_71_0.png)\n\
    \n**FIGURE 2.1**  \n*dbExpress datasets are read-only.*\n\n# ## dbExpress Datasets\
    \ Are Lightweight\n\nBecause dbExpress datasets are unidirectional and read-only,\
    \ they are extremely lightweight. There is no overhead involved for the fundamental\
    \ (but expensive) tasks of bidirectional cursor support, record buffering, and\
    \ the like.\n\nIf you're familiar with the *Borland Database Engine* (*BDE*),\
    \ you know that the BDE supports full editing capabilities, forward and backward\
    \ navigation of datasets, and drivers for multiple database backends. However,\
    \ the BDE install is approximately 10MB, and the BDE itself is memory-intensive.\
    \ Consider that dbExpress (when coupled with client datasets, which I'll discuss\
    \ in future chapters) consists of a mere two library files totaling some 400K.\
    \ Consider further that dbExpress (with client datasets) supports even more functionality\
    \ than the BDE, and you begin to appreciate why dbExpress is such a remarkable\
    \ database technology.\n\n# ### Types of Datasets\n\nAs with other Delphi database\
    \ technologies (such as ADO and IBX), dbExpress supports three different types\
    \ of datasets: tables, queries, and stored procedures. These are discussed in\
    \ the following sections.\n\n# ### Tables\n\nA table is a direct view of the underlying\
    \ database table. It consists of all columns for all rows in the table. You cannot\
    \ limit the rows returned from the table, and you cannot select a subset of columns\
    \ (or join columns from another table)."
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Queries


    A query provides a way to retrieve a subset of the data stored in the underlying
    database table. It also enables you to join information from one table to another.
    In general, a query enables you to execute any `SQL SELECT` statement and return
    the results.


    # Stored Procedures


    Stored procedures are procedures written in the underlying database, and stored
    in the database itself. dbExpress stored procedures enable you to retrieve data
    from a database stored procedure.


    # General-Purpose Datasets


    The dbExpress components that provide table-level, query-level, and stored procedure
    access are `TSQLTable`, `TSQLQuery`, and `TSQLStoredProc`, respectively. These
    components are provided solely for ease of conversion from BDE applications, and
    correspond to the BDE data-access components `TTable`, `TQuery`, and `TStoredProc`.


    For all new development, it is strongly recommended that you use the general-purpose
    component `TSQLDataSet`. `TSQLDataSet` allows access to tables, queries, and stored
    procedures alike, and is more flexible than any of the other special-purpose components
    mentioned previously.


    `TSQLDataSet` implements almost all of the dbExpress dataset functionality. `TSQLTable`,
    `TSQLQuery`, and `TSQLStoredProc` descend from `TSQLDataSet` and add behavior
    specific to tables, queries, and stored procedures. In turn, `TSQLDataSet` descends
    from `TDataSet`, which is the root class for all Delphi datasets.


    Table 2.1 lists the relevant properties defined by `TSQLDataSet`.


    TABLE 2.1 TSQLDataSet Properties


    | Property | Description |

    | :--- | :--- |

    | **Active** | Set to `True` to open the dataset, or to `False` to close the dataset.
    You can also read this property to determine whether the dataset is currently
    open or closed. |

    | **CommandText** | The way in which `CommandText` is used depends on the value
    of `CommandType`. See the following sections for more information on `CommandText`.
    |

    | **CommandType** | Set `CommandType` to `ctQuery` to execute a query, to `ctStoredProc`
    to execute a stored procedure, or to `ctTable` to open a table. See the following
    sections for more information on `CommandType`. |

    | **DataSource** | Used to establish a master/detail link between two datasets.
    See the section titled “Master/Detail Relationships” for more information. |'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Table 2.1  Continued


    | Property           | Description |

    |--------------------|---------------------------------------|

    | MaxBlobSize        | Sets the maximum amount of data returned from BLOB fields.
    See the section titled “BLOB Support” for more information. |

    | ObjectView         | When True, the dataset provides additional support for
    ADT fields, array fields, and master/detail relationships. See the section titled
    “Master/Detail Relationships” for more information. |

    | ParamCheck         | When True, the dataset automatically generates parameters
    whenever CommandText changes. If you want to create parameters manually, set this
    to False. See the section titled “Parameterized Queries” for more information.
    |

    | Params             | Contains a list of input and output parameters for the
    current query or stored procedure. See the section titled “Parameterized Queries”
    for more information. |

    | SortFieldNames     | Only used when CommandType=ctTable. Defines the order in
    which data is returned from the server. See the section titled “Ordering Data
    Returned from the Server” for more information. |

    | SQLConnection      | The TSQLConnection component to which this dataset is connected.
    You should set this property before setting any other properties in the dataset.
    |


    # Table-Level Access


    To access an underlying database table, you can use the TSQLTable component. The
    fundamental properties are SQLConnection and TableName. You can also set IndexName
    if you want to select an index for record-ordering purposes. The following code
    snippet illustrates how to set table properties and open a table-based dataset:


    ```

    SQLTable1.SQLConnection := conn;

    SQLTable1.TableName := ''CONTACTS'';

    SQLTable1.IndexName := ''IX_CONNMAE'';

    SQLTable1.Open;

    ```


    # Query-Level Access


    You can use TSQLQuery to create an ad hoc query for retrieving data from a database.
    The following code shows how to do this:


    ```

    SQLQuery1.SQLConnection := conn;

    SQLQuery1.SQL.Text := ''SELECT * FROM CONTACTS WHERE COUNTRY= "United States";''

    SQLQuery1.Open;

    ```'
