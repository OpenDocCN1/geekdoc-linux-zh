- pgno: 274
  md: "# Persisting Grid Settings\n\nUsers expect customizations to be persistent\
    \ across program invocations, and grid settings are no exception. When your users\
    \ resize or reorder the columns in a grid, they usually expect the column order\
    \ and size to be the same the next time they run the application.\n\nIt isn’t\
    \ difficult to persist grid column settings. There are two approaches that you\
    \ can take:\n\n+   *   Save the settings to a stream or to a separate file.\n\
    +   *   Save the settings to the Windows registry or to an ini file.\n\nThe first\
    \ option is simpler, so I’ll cover it first. `TDBGrid`’s `Columns` property provides\
    \ `SaveToFile` and `SaveToStream` methods that you can use to save column configurations,\
    \ to either a file or a stream, with a minimum of fuss. The following code snippet\
    \ shows how you can save column settings to a file:\n\n```\n```pascal\nDBGrid1.Columns.SaveToFile('GRID.CFG');\n\
    ```\n```\n\nSimilarly, to reload the settings:\n\n```\n```pascal\nDBGrid1.Columns.LoadFromFile('GRID.CFG');\n\
    ```\n```\n\nThe drawback to this approach is that if you have many different grids\
    \ in your application, you need separate configuration files to persist each one.\
    \ If that is the case, you might want to look at `SaveToStream` instead of `SaveToFile`.\
    \ With a little effort, you can use `SaveToStream` to save a grid’s column configuration\
    \ to an ini file or to the Windows registry. The following procedure saves column\
    \ information to an ini file:\n\n```\n```pascal\nprocedure SaveColumnConfiguration(const\
    \ FileName; string; Grid: TDBGrid;\n    const SectionName; string; const Name;\
    \ string);\nvar\n    Ini: TIniFile;\n    MemStream: TMemoryStream;\nbegin\n  \
    \  MemStream := TMemoryStream.Create;\n    try\n        Grid.Columns.SaveToStream(MemStream);\n\
    \        MemStream.Seek(0, soFromBeginning);\n\n        Ini := TIniFile.Create(FileName);\n\
    \        try\n            Ini.WriteBinaryStream(SectionName, Name, MemStream);\n\
    \        finally\n            Ini.Free;\n        end;\n    finally\n        MemStream.Free;\n\
    \    end;\nend;\n```\n```"
