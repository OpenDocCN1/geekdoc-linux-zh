    # 2.2.2 任务 2 启动内核调试


    对于工作环境的 Linux 主，尤其是提供服务或者内核服务的主机来说，关键系统管理员要充分关注的一件事：不恰当或不正确的内核的重启，会导致服务中断，重导致数据丢失或发生出等等不可挽回的后果。


    当然，我们对于面对面的问题可能很简单：只需要装好的主机重启，然后拨机家里去。主并没有提供在线服务，除了已经登录的本地用户外，没有其他在线用户，所以即使是重启主机的关键服务器也不会造成严重后果。但是，在任何情况下都不要不要使用这种方法以及其他不正确的内核方法和工具。


