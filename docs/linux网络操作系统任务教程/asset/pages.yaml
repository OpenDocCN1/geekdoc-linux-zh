    如指定网络接口名称，显示系统中的所有接口，包括所有接口，在后面

    加上 up 项，只会显示当前活跃接口，如清单 8-45所示。


    # 清单 8-45


    ```

    # ip link show      # 系统中所有接口属性

    # ip link show up     # 系统中所有活跃属性

    ```


    使用 s 选项，命令会显示网络接口的接收和发送统计信息，如清单 8-48

    所示。


    # 清单 8-48


    ```

    # ip link show en60777736

    2: en6077736<BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc qdisc pfifo_fast

    state UP mode DEFAULT qlen 1000

    link/ether 00:1c:29:2c:39:bd brd

    RX: packets errors dropped overrun mcast

    50638 0 0 0 0

    TX: packets errors dropped carrier collsns

    48230 511 0 0 0

    ```


    RX 和 TX 字段分别接收和发送，显示的统计信息如清单 8-11 所示。


    | 字段 | 意义 |

    |---|---|

    | bytes | 网络接口发送或收到的字节数 |

    | packets | 网络接口接收或发送的数据包数 |

    | errors | 发生错误的次数 |

    | overrun | 由于拥取，数据被丢弃的设备数量 |

    | mcast | 收到的多个数据包数量，很少的支持该选项 |

    | dropped | 由于系统资源限制而丢弃的数据包 |

    | carrier | 连接介质出现故障的次数，例如网络接头不良好 |

    | collsns | 以太网物理类型发生冲突的事件的次数 |


    > 注意


    接口的统计信息往往为了了解网络接口运行状态和定位网络故障。例如：


    +   * RX 的值如果很大，表示网络不稳定。

    * errors、overrun、dropped 为 0，说明网络比较稳定。

    * collisions 较大，说明网络状况不好，有网络故障的可能。

    * overrun 值较大，说明设备繁忙，无法处理接收的数据。

    * carrier 值较大，说明连接接头不理想，如线质量较差或网络接头不好。


