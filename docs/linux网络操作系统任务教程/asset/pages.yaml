  md: "# 小心\n\n/etc/sudoers 文件是一个文本文件，由于它的内容敏感，所以该文件是只读的。从理论上\n来说，root 用户可以使用任何文本编辑器直接编辑该文件，但必须确保\
    \ sudoers 格式正确，\n否则 sudo 命令将无法运行。\n\n+   - visudo 命令会锁 sudoers 文件，保存修改到临时文件后，检查文件格式，确保\n\
    \  正确后再覆盖 sudoers 文件。因此，建议使用 visudo 命令而非其他文本编辑器\n  来修改 sudoers 文件。\n- visudo 命令调用系统默认的文本编辑器如/etc/sudoers，在大部分\
    \ Linux 发行版\n  中，默认的编辑器都是 vi。\n\n/etc/sudoers 文件在没有改动的情况下该文件大约有100 多，其中应该如清单\n\
    6-35 所示的，这两行正是 sudoers 的核心配置行。\n\n```\nroot\n  ALL=(ALL:ALL) ALL\n  %wheel (ALL:ALL)\
    \ ALL\n```\n\n可以将此核心配置的格式如图 6-2 所示，其中共有 5 个字段，字段的具\n体说明如图 6-1 所示。\n\n![](img/a95c6704e7d3618800a5dd1f2c0aafd0_188_0.png)\n\
    \n表 6-16 /etc/sudoers 配置字段说明\n\n| 字段 | 说明 |\n| --- | --- |\n| 1 | 授权那些用户或用户组\n\
    \  - 以% 开头的用户“被授权的用户”，如清单中的 root\n  - 以%号开头的“被授权的用户”，如清单中的%wheel\n  允许执行的命令 |\n\
    | 2 | ALL 允许所有主机，如清单 6-36 所示\n  - 如果该字段为 ALL，则表示该用户只能在某些特定的机器上登录服务器来执行 sudo\n\
    \    命令。这个主机可以是主机，如 mycomputer.nbcc.cn，或者是一个 IP 地址\n  授权用户或用户组的权限 |\n| 3 | 冒号在前表示用户，冒号后表示用户组\n\
    \  - 用户组，例如 root，即表示用户或用户组身份执行指定命令的权限\n  - ALL 或者 ALL:ALL，表示任意用户和任意组身份执行指定命令的权限，如\n\
    \    6-36 所示\n  在执行命令时，是否需要输入用户密码 |\n| 4 | 如省略，则表示要求输入密码，如清单单\n  - 如为“NOPASSWD”，则表示不需要输入密码\n\
    \  允许执行的命令 |\n| 5 | ALL 授权可执行任何命令，如清单 6-36 所示\n  - 用别名来列命令或命令别名。注意，这里的命令均使用绝对路径，这是为了避免\n\
    \    目录下有同名命令被执行，从而造成安全隐患 |"
