    | TYPE ethernet，代表以太网 |

    | DEVICE 应用该接口的设备名，例子中恰叫ens33


    nmcli命令connection show 后跟具体连接名来指定连接的详情。列表中显示了ens33这个连接的详情，如清单8-26所示。这个列表列表可分为配置详情和激活连接详情两部分，例子中的配置详情主要是列出的连接的全局、以太网、IPv4、IPv6和代理服务器参数，激活连接详情中主要列出了当前的全局、IPv4、IPv6和DHCP运行参数。


