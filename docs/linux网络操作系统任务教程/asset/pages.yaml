  md: '# 4.3.1 知识点11 文件特殊属性


    在任务的知识点6中提到，完整的访问权限除了读、写外，还包含了文件的特殊访问权限。Linux文件中的特殊权限有3种，分别是SUID、SGID和Sticky Bit。事实上SUID、SGID和Sticky
    Bit一起占据了4位进制权限位中的某一位，同时，由于这3个特殊权限只对执行文件或者目录有意义，因此在9位文件权限字符中只占了所有者(u)、文件所属组(g)和其他用户(o)的执行权限，如表4-24和图4-9文件特殊权限。


    | 表4-24 文件特殊权限 |

    | 特殊权限 | 增记符号 | 八进制 |

    | suid | u(+)=s | 4 |

    | sgid | g(+)=s | 2 |

    | sticky | o(+)=s | 1 |


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_133_0.png)


    当文件的拥有执行权限时，特殊权限用s字符表示

    当文件没有执行权限时，特殊权限用大S或T表示


    在本节中，简要讨论3种特殊权限，并用6个例子说明它们。

    1. SUID (Set User ID) 特权文件拥有者ID 权限只对可执行的文件有效。设置这个权限的目的，就是就可以使得文件所有组和其他用户能够以文件所有者的身份执行该文件。


    案例1: 演示了系统中一个典型的SUID权限的文件/usr/bin/passwd。在权限的权限文件中所有者x的位置是一个s。这就意味着，对这个特定的程序来说，SUID和权限已经被设置了。无论哪个用户执行passwd
    命令时，passwd都是以root用户的身份运行的，它可以修改只有root有权限的系统用户配置和etc/passwd，如清单4-104所示。


    ```

    清单4-104

    $ ls -l /usr/bin/passwd

    -rwsrxr-x 1 root root 27022 8月22日2010 /usr/bin/passwd

    $ ls -l /etc/passwd

    -rw-r--r-- 1 root root 2270 9月27日12:27 /etc/passwd

    ```'
