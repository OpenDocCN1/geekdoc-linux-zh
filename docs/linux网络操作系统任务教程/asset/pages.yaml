  md: '# 8.2 任务实施


    # 8.2 任务实施


    #  8.2.1 子任务1 安装和启动 NetworkManager


    在 RHEL CentOS 中配置和网络管理的最佳工具就是 NetworkManager (后面统称为 NM)。事实上，红帽 (Red Hat) 公司开发
    NM 的主要目的就是降低在 Linux 与其他 Unix 操作系统上的计算机网络管理和使用难度。


    > 注意


    +   - 在 NM 出现后，系统管理员通常使用网络脚本脚本和配置文件来管理，其中网络脚本主要是使用脚本和它的一一系列其他脚本文件，配置文件的指定的 /etc/sysconfig/ifcfg
    文件以及 /etc 下 hosts、resolv.conf 文件，这种方法在当前 RHEL CentOS 发行版仍然被留下，习惯于使用脚本继续管理网络。

    - NM 的早期版本在配置和网络管理上并不完美，但是经过十多年的发展和完善，目前已成为一个非常强大的网络管理和配置工具。

    - 建议初学者使用 NM 而非脚本来管理网络工具。


    NM 不是一个前端应用程序，而是一个动态网络管理和配置服务的后台守护进程。NM 包中包含了 NM 本身，还会包含界面工具（如表 8-3 所示）。


    表 8－3 NM 用户界面

    | NM 用户界面 | 描述 |

    | --- | --- |

    | nmmtui | 使用带光标的简单文本用户界面 (TUI) |

    | nmcli | 命令行界面 (CLI) |

    | control-center | GNOME 下的图形化用户界面 |

    | nm-connection-editor | 基于 GTK+3 的图形化界面 |


    > 注意


    所有的 NM 用户界面都可以用来与 NM 进行交互，选择、管理和配置网络，但作为一线系统管理员，还是建议使用 NM 的命令行界面 nmcli。


    首先确认在系统中 NM 已经已经安装并启动。在 CentOS 中一般会默认安装，可以使用 yum 命令进行确认，如清单 8-1 所示。


    清单 8-1


    ```

    yum -q list NetworkManager

    已安装软件包

    NetworkManager.x86_64  1.10.0.2-13.el7 @anaconda

    ```


    如果没有安装，需要使用 yum 命令进行安装，如清单 8-2 所示。


    清单 8-2


    ```

    yum y install NetworkManager

    ```


    接下来使用 systemctl 命令确认 NM 守护进程是否已经启动，同时确认是否已开机启动，如清单 8-3 所示。'
