- img_proc: true
  md: '正则表达式比通配符，更精确地描述文本模式，当然，代价也就更复杂了。比如，可以用任意一个正则表达式，来匹配任意国家的手机号码；所有以1开头，后面跟着12位数字的字符串（像188300000000或1882345678）。


    学习正则表达式最好的方法是从例子开始，通过此方法将不同进行分类，给出一些正则表达式的例子，通过例子对 grep 命令和正则表达式作用建立一个初步的了解。


    # 注意


    正则表达式表达式分为两类，基本正则表达式（BRE）和扩展正则表达式（ERE）。两者的功能相同相似，是在某些字符和部分功能上有所区别。简单来说，在 grep
    中，+、*、\、（）是元字符，BRE是不支持这些元字符的。总来说，扩展正则表达式要更易读一些，功能也能增加一些，因此推荐使用扩展正则表达式。


    如果没有特别说明，本例用的正则表达式都是扩展正则表达式。


    # 1. 入门


    假设要在系统日志文件/var/messages 中包含这个 st 字符串的。可以按清单 5-56 所去做：


    # 清单 5-56


    ```

    grep "s.*tb" /var/messages

    ```


    这几乎是最简单的正则表达式匹配了，它可以精确地匹配这样的字符串：由两个字符组成，前一个字符是 s，后一个是 t，messages很多行里都包含这个 st 字符串，比如系统、stat、localhost等。如果用
    st 来查找，这里的 st 也会被找出来。如果想要精确地找到这个单词，应该用清单 5-57 所去做：


    # 清单 5-57


    ```

    grep "\bst\b" /var/messages

    ```


    其中，b 在正则表达式中一种叫作元字符（meta-character）的特殊字符。b代表单词的开头或结尾，也就是单词的分界符。


    # 注意


    b 不匹配空格、标点符号、换行、制表符，匹配分隔字符中的任意一个。事实上，b 并不匹配一个位置，后面许多字符也是这样的。

    上述的“单词”，和英语中“单词”的概念并不完全，和 grep 命令中的“单词”是一个概念，指的是一个由空格、<Tab>或换等字符分隔的字符串。


    假如要是以 st 开头，以结尾的单词，可以用清单 5-58 所示命令：


    # 清单 5-58


    ```

    grep "\bst.*\b" /var/messages

    ```


    这里，又出现了两个新的字符，其中“^”匹配除了换行以外的任意字符。

    “*”同样表示字符，不是字符，也不是数字，而是数量——“指定一个*"

    前面的任意字符可以连续重复任意次数以使整个正则表达式匹配。此，“*”在开头就意味着匹配任意数量不包含换行的字符。那么，“st.*tb”的意思就很明显了：是以
    st 开头，跟着任意数量不包含换行的字符以 tb 结尾的单词。换行符就是''n'',ASCII

    码为10（十六进制0xA）的字符。'
