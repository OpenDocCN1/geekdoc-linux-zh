  md: "# 表 8-4 nmcli device状态命令释义\n\n| 字 | 意义 |\n|---|---|\n| DEVICE | 接口设备，例如是 ens33\
    \ 和 lo |\n| TYPE | 设备类型，例如是 ethernet，以太网口，loopback 则返回回环接口 |\n| STATE | 接口状态，可以是已连接的，或已开启或者未托管\
    \ |\n| CONNECTION | 应用在该接口上的连接名，如接口未应用，则显示为-字符 |\n\n第三行输出的是系统的回环接口（loopback interface）状态，在系统中都有这一个回环接口，对系统运行非常重要，在本任务中并不涉及回环接口，因此可以不可视的。\n\
    \n> > 注意\n设备是回环接口，它并不是真正的物理设备，而是软件接口。回环接口允许运行在同一台主机上的客户端程序和服务器程序通过 TCP/IP 进行通信，大多数系统通常会将地址\
    \ 127.0.0.1 分配给该接口。\n\n第二行输出就是要配置的网络接口状态，设备名为 ens33，设备类型是以太网口，状态是“连接的”，接口上用了一个“有线连接\
    \ 1”的连接。\n\n> > 注意\n网络接口设备由系统按照规定命名，名称是有意义的，在旧任务中的 ens33 代表以太网（ethernet）接口设备；s\
    \ 代表 PCIe 槽（slot），也即太网接口插在某个 PCIe 槽中；最后的数字是插槽索引。\nRHEL CentOS7 中的网络接口名称与之前的版本有较大的变化，不再传统的\
    \ eth0、eth1……这样的命名方式，而是采用了所谓的一致性设备命名（consistent device naming），如果你希望了解相关细节，可以参考《Red\
    \ Hat Enterprise Linux 网络指南》（在红帽官网免费下载）。\n\n本例中未对接口进行任何配置，但许多接口已经可以使用了。nmcli dev\
