  md: '# 任务 1 获取和部署 Linux


    # 1.1 任务介绍


    为一台服务器安装操作系统看似简单，实则涉及方方面诸多相关的问题，一般来说至少应该考虑如下 3 个层面的问题：


    +   - 了解主硬件兼容性。

    - 确定并获取安装资质。

    - 规划磁盘分区和网络配置。


    这些考量应当满足用户要求为终极目标。如果用户并非 IT 专业人士，往往还需要从混沌芜的陈述、混乱不堪的数据和令夕的诉求中提炼出用户的真实需求。需求是，销售部门作为公司内部用户，IT
