  md: '# 任务 管理文件


    # 表 4-3 重要目录列表


    | 目录 | 用途 |

    | --- | --- |

    | / | 整个文件系统结构的根目录 |

    | bin | 必须加载的二进制文件，即系统管理员和用户可能使用的命令 |

    | boot | 引导程序的静态文件，该文件夹包含了启动程序所需的所有文件 |

    | dev | 设备文件 |

    | etc | 主机配置文件，“配置文件”只是一个用于控制操作的本地文件，它还是静态文件且不是可执行的二进制文件 |

    | lib | 必须的共享库和内核模块，某些情况下，库文件可能是lib32和lib64，lib作为其中之一的符号 |

    | mnt | 临时文件系统的挂载点。提供此目录是为了系统管理员能够在需要时临时挂载系统 |

    | opt | 外部应用程序包 |

    | sbin | 必须的系统命令的二进制文件，即系统管理员使用的命令 |

    | srv | 本系统提供的数据文件 |

    | tmp | 临时目录 |

    | var | 二级目录，包含多个用户的工具和应用程序

    | 变量数据，存放应用程序和日志的记录 |

    | home (必须) | 用户的目录，通常一个用户在目录下有一个用用户名命名的子目录，放置用户个人文件、设置（环境变量）等 |

    | root (非必须) | 管理用户的目录。放置用户个人文件、设置（环境变量）等


    # 注意


    > 在 RHEL/CentOS 7中，有4个一级目录包含了其他的符号链接：

    * /bin成了/usr/bin的符号链接。

    * /sbin成了/usr/sbin的符号链接。

    * /lib成了/usr/lib的符号链接。

    * /lib64成了usr/lib64的符号链接。


    # 4.3.2 认识文件路径


    在 Linux 文件中的路径简单来说就是在文件系统中访问文件的路径，而在 Linux 文件系统是一个树状结构，因此会有两种路径表示方式：绝对路径与相对路径：


    +   * 绝对路径是从根目录“/”开始，依次将各级目录的名字组合起来，形成的路径就是某个文件的绝对路径。例如，目录“/”下有目录 usr，usr 用户目录下有目录
    bin，bin 目录下有文件 ls，则 ls 文件的绝对路径就是/usr/bin/ls。绝对路径明确但往往很长。

    * 相对路径是相对于当前所在位置的路径，例如，当前的位置为/usr，则在根目录 usr 用户目录下，则 ls 文件相对于当前位置的路径为 bin/ls。相对路径短而可能仍然不明确。'
