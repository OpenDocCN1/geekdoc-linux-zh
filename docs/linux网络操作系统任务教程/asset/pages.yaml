    # 命令 mkfs


    用例：mkfs [选项]... 分区...

    功能：创建文件系统。

    mkfs 的常用选项及其说明见表 7-2 所示。


    | 表 7-2 mkfs 命令的常用选项及其说明 |

    |项 | 说明 |

    |---|---|

    | -t<类型> | 指定文件系统类型，默认支持的类型有 Ext2,Ext4, MS-DOS, VFAT 等 |

    | 这些选项只有在创建 Ext 系列或 XFS 文件系统时才能使用 |

    | -L | 指定文件系统数据标签 |

    | -b | 指定文件系统数据块的大小 |

    | -i | 为多少字节分配一个 inode


