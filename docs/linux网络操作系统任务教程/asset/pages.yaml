    第二个命令 mkfs，make file system 的缩写，顾名义，就是创建文件系统。

    事实上，mkfs 是通过调用调用其他一系列命令来实现不同文件系统的功能的，可以

    在键入 mkfs 后按两次Tab 键来查找 mkfs 能够的命令。mkfs 根据指定的

