  md: '# # 任务 1 获取和部署 Linux


    ——大风起于青萍之末。


    微系统开发有限公司 (Micro Device System Development Ltd.) 是一家从事智能移动设备和 App 开发的公司，最近在 N
    市设立了一个研发点，小 Y 作为该市场职业学院的应届生，通过了层层筛选和面试，成功成为了公司的一名用实习生，并被分配到 IT 支持部门，成为一名 Linux
    系统管理员。第一天，支持他的技术主管 D 让他给销售部的项目组部署一个服务器，并指派运维工程师 L 作为他的导师。接下来的几天，在 L 的热心帮助下，小 Y
    在手中学会了作为 Linux 系统管理员的第一课。下面和小 Y 一向开启 Linux 之旅的第一步吧


    # ## 任务场景


