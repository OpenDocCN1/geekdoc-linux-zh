    # 4.3.8 知识点 8 查找文件相关命令


    +   1. find 命令


    find 命令最常用的查找命令之一，同时也是最混乱的一个，因为它的语法与其他命令的标准语法有所不同。但是 find 命令很强大，使用它不仅可以通过文件的各种属性来查找文件，还可以对找到的文件行执行操作。下面首先介绍
    find 命令的语法格式，然后用 9 个例子来演示和说明。


    命令 命令


    用例：find [查找路径] [表达式]


    功能：在查找指定的目录结构中根据特定条件进行查找，并执行指定的操作。如果不指定的查找路径，则默认在当前工作目录下进行查找。其中，表达式由选项、测试和动作组成。


    find 命令常用的测试选项及说明如表 4-17 所示。


    表 4-17 find 命令常用的测试选项及说明


    | 选项 | 说明 |

    | --- | --- |

    | -depth | 先处理目录的内容再处理目录本身 |

    | -maxdepth n | 搜索的目录下层层深度，最深不超过 n 层 |

    | -nleaf | 搜索不遵循 UNIX 文件系统链接约定的系统时，如 NTFS、VFAT、ISO9660 |


    find 命令常用的测试条件项说明如表 4-18 所示。


    表 4-18 find 命令常用的测试条件项及说明


    | 选项 | 说明 |

    | --- | --- |

