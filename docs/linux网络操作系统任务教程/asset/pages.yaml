  md: '# 表 9-8 yum 常用选项及其说明


    | 选项 | 说明 |

    | --- | --- |

    | -y | 自动模式，对所有的提问都回答“yes” |

    | -q | 安静模式，只需输出信息，如-y 合用，则不输出信息 |

    | -v | 显示详细信息 |

    | -C | 完全从缓存中存储，而不去下载或更新任何软件包（即软件依赖信息） |


    yum 常用命令见 9-9 所示。


    # 表 9-9 yum 常用命令


    | 操作 | 说明 |

    | --- | --- |

    | install 软件包 | 安装指定的软件包 |

    | update 软件包 | 更新指定的软件包 |

    | remove 软件包 | 删除指定的软件包 |

    | info 软件包 | 显示指定软件包的描述和简介信息 |

    | list [选项][关键字] | 显示可选（但未安装）的软件包；列出名称匹配关键字的所有软件包清单，有两个常用选项：

    * available: 显示可选（但未安装）的软件包

    * installed: 显示已安装的软件包 |

    | search 关键字 | 通过关键字匹配软件包名称和简介搜索软件包 |

    | deplist <软件包> | 列出指定 RPM 软件包的所有依赖关系 |


    # 命令 yum-config-manager


    用法：yum-config-manager [选项]

    功能：yum-config-manager 是一个管理 yum 配置和软件仓库工具。

    yum-config-manager 命令的常用选项及其说明 9-10 所示。


    # 表 9-10 yum-config-manager 命令的常用选项及其说明


    | 选项 | 说明 |

    | --- | --- |

    | --enable <仓库名> | 启用指定仓库 |

    | --disable <仓库名> | 禁用指定仓库 |

    | --add-repo <仓库 repo 文件> | 从指定 repo 文件添加仓库 |


    # (1) 安装软件


    安装软件命令是 install，后面跟着安装的软件名称，如清单 9-33 所示。


    清单 9-33


    +   * yum install gcc

