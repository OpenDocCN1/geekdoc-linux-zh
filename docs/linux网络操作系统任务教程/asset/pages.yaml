  md: '# 2. 新建分区


    下面用一个典型例子来介绍 parted 新建分区的用法，硬盘大小为4TB，要建立

    分区的如表7-14所示。


    7-14 parted 硬盘分区需求范例


    | GPT 分区 | 大 小 |

    | --- | --- | |

