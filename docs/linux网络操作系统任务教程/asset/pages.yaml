  md: '# (1) repo 文件


    yum re repo 文件定义和配置的软件仓库。CentOS 官方软件仓库的 repo 文件

    CentOS-Base.repo 清单 9-32 所示。下面这个文件为例解释 repo 文件。


    清单 9-32


    ```

    # CentOS-Base.repo

    [base]

    name=CentOS-$releaser - Base

    mirlist=http://mirrorlist.centos.org/?release=$releaser&arch=$base

    archrepo=x86_64$infra=$infra

    baseurl=http://mirror.centos.org/centos/os/$basearch/

    gpgcheck=1

    file=/etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7


    #仓库 updates

    [updates]

    name=CentOS-$releaser - Updates

    mirlist=http://mirrorlist.centos.org/?release=$releaser&arch=$base

    archrepo=updates&infra=$infra

    baseurl=http://mirror.centos.org/centos/updates/$basearch/

    gpgcheck=1

    file=/etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-77


    #仓库 extras

    [extras]

    name=CentOS-$releaser - Extras

    mirlist=http://mirrorlist.centos.org/?release=$releaser&arch=$base

    archrepo=extras&infra=$infra

    baseurl=http://mirror.centos.org/centos/extras/$basearch/

    gpgcheck=1

    file=/etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7


    #仓库 centosplus

    [centosplus]

    ame=CentOS-$releaser - Plus

    mirlist=http://mirrorlist.centos.org/?release=$releaser&arch=$base

    archrepo=centosplus&infra=$infra

    baseurl=http://mirror.centos.org/centos/centosplus/$basearch/

    gpgcheck=1

    enabled=0

    file=/etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7

    ```


    这个 repo 文件分为 5 部分，表示定义的 5 个仓库，如 9-5 所示。


    > 表 9-5 CentOS 仓库列表


    | 仓库名称 | 内容 |

    | --- | --- |

    | base |  CentOS 基础软件包，和光源内部的内容相同，默认启用 |

    | updates | Base 仓库中软件包的更新版本，默认启用 |

    | extras | 一批附加的软件包，默认启用 |

    | centosplus | 针对 base 和 updates 软件仓库内的组件的更新。这些更新版本并不正式的发行，以便更新新的同时兼顾了与先版本的兼容性。启用该软件包会导致
    CentOS 与正版软件包有不同。默认不启用 |

    | contrib | 这个软件仓库包含了 CentOS 用户贡献的组件，它们不会与核心发行版本的重叠。这些组件未经过 CentOS 的开发者测试，亦未必必跟随
    CentOS 版本的发布。默认启用 |'
