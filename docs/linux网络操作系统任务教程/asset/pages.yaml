    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_224_0.png)


    +   - 在生产环境中，慎用使用 fuser -k 命令，因为可能有其他用户在使用这个文件

    系统，若关闭所有文件系统的进程可能导致其他用户丢失数据。

    - 如果非使用 fuser -k，建议加上 -i 选项，在结束每个进程之前都会询问


    也可以使用 umount -a 一次性将未在使用中的所有文件系统都卸载，前

    面已经在任务中进行过一次（如清单 7-28 所示）。


    原理很简单，即通过系统中的一个配置/etc/mtab（如清单 7-56 所示）来

    实现。


    # 清单 7-56


    ```

    rootfs rw 0

    sys /sys sysfs rw, reclabel, nosuid,nodev,noclatime, 0

    proc /proc proc rw, nosuid,nodev,noclatime, 0

    devtmpfs / devtmpfs rw, reclabel,size=999108,nr_inodes=249777,

    time=755 0

    ...此处省略若干行

    /dev/sd1 /data xfs rw, reclabel,atime,inode64,noquota 0

    /dev/sd3 /backup xfs rw, reclabel,atime2,inode64,noquota 0

    /dev/sd2 /project/wineblock rw, realtime,user_group_id=0,allow-

    other,blks=4096 0

    ...此处省略若干行

    /dev/loop0 /mnt iso960 rw,0 00

    /dev/loop1 /mnt vfat

    rw, realtime,fmask=0022,dmask=0022,codepage=437,charset=ascii,

    shortime=mixed,errors=remount-ro 0

    ```


    这个文件系统（非根用户）维护，其中总是保持着当前系统已挂载的分区

    信息（包括虚拟分区）。每挂载分区时、umount 卸载时，都会动态更新 mtab。

    umount 读写其中挂载分区信息，尝试一次性将使其全部卸载。


