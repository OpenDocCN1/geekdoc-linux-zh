  md: "# 笔记\n\n* 如果需要使用更严格的安全措施，可以使用用户写入权限文件（白名单）/etc/allow\n来仅限某些用户使用该权限，而其他用户则无权限。\n\
    \n# ## (2)安排 crontab 周期任务\n\nat 命令只能定义一次计划任务，并在某一个时间点执行，执行之后，如果\n想要重复这一操作，就需要重新定义一次计划任务。这种方式在实际使用过程中\n\
    具有局限性，就需要用到周期性的计划任务了。\n\ncron 是 Linux 下后台执行计划任务的工具，可以在无人工干预的情况下\n时周期性执行指定任务。由于\
    \ cron 本身是一个系统服务（守护进程），无交互\n交互，需要使用相应配置文件来告诉 cron 用户在何时执行何种任务。\n\n首先要确定 cron 的守护进程是否在运行（一般情况下\
    \ cron 是启动的），\n如清单 10-55 所示。\n\n# 清单 10-55\n\n```\n$ systemctl status cron\n●\
    \ cron.service - Command Scheduler\n   Loaded: loaded (/usr/lib/systemd/cron.service;\
    \ enabled; vendor preset: enabled)\n   Active: active (running) -- 2018-11-19\
    \ 22:39:53 CST, 7 min ago\n   Main PID: 1267 (crond)\n   Config: /usr/sbin/crond\
    \ -n\n```\n\n如果 cron 未启动，将用命令将其启动，并让开机启动，如清单 10-56 所示。\n\n# 清单 10-56\n\n```\n\
    $ systemctl enable cron\n```\n\n接下来就可以探索 crontab 计划任务了。常见的 crontab 计划任务可以分为系统\n\
    计划任务和用户任务。\n\n首先来看系统计划任务。系统计划任务的配置位于 /etc/crontab，打开 crontab\n文件，其内容应如清单 10-57\
    \ 所示。它描述了在编写系统计划任务过程中需要\n遵守的格式，对于普通用户的 crontab 格式也是按照这种方式，只不过系统的\n计划任务由 root 用户定义，而用户则是没有权限编辑这个文件的。\n\
    \n# 清单 10-57\n\n```\nSHELL=/bin/bash\nPATH=/sbin:/bin:/usr/sbin:/usr/bin\nMAILTO=root\n\
    \n# For details see man 4 cron\n\n# Example of job definition:\n#            \
    \   minute (0 - 59)\n#               hour (0 - 23)\n#               day of month\
    \ (1 - 31)\n#               month (1 - 12) OR jan,feb,mar,apr ...\n#         \
    \      day of week (0 - 6) (Sunday=0 or 7) SUN,mon,tue,wed,thu,fri,\n#       \
    \        sat\n\n# * * * * *  user-name  command to be executed\n```\n\n在子章节 3\
    \ 中已经提供了一图（图 10-3）清晰、直观地说明了 crontab\n计划任务写的具体格式。其中，对于复杂的时间的格式，crontab 计划任务"
