    # 10.3 必要知识


    # 10.3.1 进程和守护进程


    1. Linux 中的进程

    计算机中基本的操作（如计算两个数字的和等）称为指令（instruction），

    程序（program）则是由一系列指令整合而成的。通过过程，可以让计算机完成

    复杂的操作。程序多数时候被存储为可执行的文件，比如复制命令 cp 就是程序，文

    本编辑工具 vi 也是进程。进程（process）则是进程的一次执行过程，是程序的

    一个具体实现，在 Linux 中进程是唯一的实现方式。


    +   - 进程与程序是两个概念；进程只是一个静态的指令集合，不占用系统的资源，

    进程是一个随时可能发生变化的、动态的、使用系统的资源的进程。

    - 一个进程的运行，在诸宁市职业技术学校的网站

    （www.nbcc.edu）所用的 Web 服务器是 Apache Server。当服务器启动后，可以

    会有很多人来访问，也就是说，许多用户向服务器提出请求，服务器则会

    创建一个 http 进程来提供服务。


    注意


    2. Linux 中的守护进程

    在 Linux 中的守护进程是运行在后台的一种特殊进程，它独立于控制进程并且

    周期性执行某些任务或处理某些事件的进程。对于两个典型的例子来说：

    Linux上的 Web 服务器 Apache Server 的守护进程叫做 httpd。Linux 的任务守护进程 cron。启动后每分钟都会读取 /etc/

    crontab 配置文件检查是否有任务需要执行。


    注意


    +   - 守护进程被载入后就开始在后台运行，除非进程出现异常或被用户杀死，将一直

    运行，直到内核才结束。

    - 守护进程是非交互式进程，其本身没有与用户交互的功能，它既无标准输入


    在其他操作系统（UNIX）中，进程与线程是联系有不同的两个概念，但在 Linux 中，线程是一

    特殊的进程，所以线程是 Linux 进程的唯一的实现方式。'
