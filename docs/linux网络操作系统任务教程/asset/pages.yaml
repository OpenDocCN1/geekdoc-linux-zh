    # 2. 文件索引节点


    在 Linux 中，一个文件分为两部分：用户数据（user data）和元数据（metadata）进行存储。用户数据指的是文件或目录本身的数据，这些数据被存储在一个或多个块（data
    block）。元数据指的是文件或目录的属性（文件大小、类型、时间、所有者、访问权限等）以及指针（指向存储文件块的块），这些被存储在一个索引节点（inode）。


    一个文件只有一个索引节点，这个索引节点在本文件系统中是唯一的，因此文件索引节点（inode number）是唯一的。索引节点不是文件名。文件名只是为了方便人们的记忆和使用，系统或程序通过
    inode 寻找正确的文件数据，如图4-6 所示。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_128_1.png)


    图4-6 通过索引节点找到文件数据块


    可以通过 stat 命令或 ls -li 来查看文件的 inode 号，如清单4-94 所示。


    清单 4-94


    ```

    $ stat initial-setup-ks.cfg

    ```


    文件："initial-setup-ks.cfg"'
