  md: '# 1.2 实施方案


    主机的硬件信息需要确认是否能够兼容 CentOS。销售部部署的服务器访问的要求不高，而且是一个临时服务器，所部署在一台普通 PC 级别的服务器上。公司所提供的
    PC 级别的服务器是 IT 部门自行装配的兼容，其配置如 1-2 所示。


    表 1-2 主机硬件列表


    | 设备 | 型号 |

    | --- | --- |

    | CPU | Intel i3 8100 |

    | 内存 | DDR4 2666 4GB |

    | 硬盘 | 500GB SSD 硬盘 |

    | 光驱 | 18倍速 光驱 SATA 接口 |

    | 网卡 | Intel 1219-V |

    | 主板 | Intel Z370/LGA 1151 |

    | 显卡 | CPU 核心显卡 |

    | 鼠标/键盘 | USB 接口 |


    这些硬件并不普通，意想不到的硬件设备可能都能兼容。由于 RHEL/CentOS 7 官方文档中包含了最近3 年的主流服务器，但内核的硬件规格几乎每天都在变，因此很难保证所有的硬件都能被百分之百地兼容。如果主机的硬件特别老、特别新或者类型型号比较特殊，收集硬件信息并仔细检查兼容性将非常重要。建议查看“The
    Red Hat Ecosystem”的列表，或者查看硬件厂商的官方网站上的说明，以确保硬件可以被正确驱动。

    表 1-3 中列出了几种服务器上需要注意兼容性的项


    表 1-3 主机硬件兼容注意事项


    | 设备 | 说明 |

    | --- | --- |

    | 主板芯片组 | 这是一项比较重要的硬件，可能会影响硬件是否能够正常使用。主芯片组支持以及和内核模块的。考虑内核的时候需要注意对服务器的内核，对于服务器来说并不是问题
    |

    | 网络设备 | 对于服务器来说主要是网卡，注意，有些无线网卡的驱动还没有被整合进来 |

    | 显卡 | 主流的显卡都可以得到，如果需要，看一看显卡的厂商、数量大小就可以了，对于服务器来说，最好性能不强，自动驱动的性能和最好的集成显卡 |

    | 其他设备 | USB 键盘和鼠标可以被支持，蓝牙移动一般可以被支持，少数移动硬盘和U盘可能被支持，不过，对于服务器来说并不是什么问题


