    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_207_0.png)


    +   - 在 Linux 中，硬盘并不是固定的，在出现某些设备、重启等特殊情况下，序号可能会发生变化的，原本的 sda 可能是由于 Linux 内核对于存储设备到设备的映射规律造成的，基本取决于
    3 个因素：磁盘驱动程序的加载顺序、主扫描检测的顺序和硬盘本身输入顺序。这种变化有时会让管理员遇到错误，数据丢失，因此通过设备操作时要确定设备名称。


    +   - 在自动化的配置和部署文件中，如etc/fstab，绝对不要使用设备文件名来指定存储，应该使用设备的 UUID。


    # 2. 分区和标识


    在硬盘上进行分区（partition）之前，硬盘是无法用来存储数据的。事实上，硬盘进行分区的作用就是告诉操作系统可存储数据的区域，即每个分区的起始柱和结束柱。这些分区信息存储在一个叫作分区表（partition
    table）的数据结构中，分区表是块磁盘中最重要的数据。


    在任务实例中使用了 MS-DOS 和 GPT 两种分区格式，这也是实际应用中最常见的分区格式。它们的不同主要体现在分区的不同。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_207_1.png)


    改变分区格式会导致分区区中所有数据的丢失。


    +   - MS-DOS 是传统的分区格式，这种是为了兼容 PC 上 BIOS+MBR（main boot record，主引导记录）引导驱动启动，因此也称为
    MBR 分区。这种分区的分区表存储在磁盘的第一个分区（512字节）上，其中有 446 字节用于存放引导程序 bootloader。2 字节作为磁盘的区域标识，仅为了为分区保留了
    64 字节的存储空间，每个分区记录 16 字节，分区表中总计只有 4 个分区记录，导致了 MS-DOS 分区有如下限制：


    +   - 分区数目有限：主分区（primary）+扩展（extended）最多只有 4 个，如果想要使用 4 个以上的分区，就需要用到扩展分区，即在定义为扩展分区的磁盘'
