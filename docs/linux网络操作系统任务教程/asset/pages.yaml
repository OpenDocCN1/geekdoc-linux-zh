- img_proc: true
  md: "# 10.3 知道力 | 293\n\n除了对取范围内的异常值，还有特殊格式，也已经在子任务 3 的 10-1\n给出了说明。\n接下，在设置中添加如下\
    \ 5 个示例计划任务，保存退出，就会对这 5 个任务\n加了系统计划任务的，如清单 10-58 所示。\n\n```\n清单 10-58\n```\n5\
    \ \\*\\*\\* stu echo 示例计划任务 1: 每天 00:05 执行\n15 14 \\*\\*\\* rootecho 示例计划任务 2:\
    \ 每个月第一天的 2:15 执行\n0 22 \\*\\*\\* 1-5 stu echo 示例计划任务 3: 周一到周五的 22:00 执行\n23 0/23-\\\
    * stu echo 每天 00:23 执行，然后每 2 小时执行一次\n5 \\*\\*\\* sun rootecho 示例计划任务 5: 每个星期日的\
    \ 04:00 执行\n```\n```\n\n> 注意\n\n+   - 如果不想每次都去编辑/etc/crontab 文件来创建系统计划任务，还可以按照\n\
    \  crontab 的格式编写配置文件，放在 /etc/crontab 目录下，这样也会每次扫描\n  并执行。\n- 建立在 crontab 文件的每一个条目之上加上注释（以\
    \ # 开头），这样就可以知道\n  它的运行、时间，更重要的是，这个注释是用户定义的定时任务。\n\n接下是用用户计划任务，每个用户都可以安排自己自己的计划任务，用户的\n\
    任务配置文件放在 /var/spool/cron 目录下，并使用用户名。但普通用户没有权限\n直接用文本编辑器编辑这些 cron 配置文件，为此系统提供了一个名为\
    \ crontab\n的命令来操纵这些文件。\n\n# 命令 crontab\n\n用例：crontab [- user] [选项]\n功能：编辑用户的 crontab\
    \ 文件。\ncrontab 命令的常用选项及其详细说明 10-20 所示。\n\n| 选项 | 说明 |\n| --- | --- |\n| -u | 用来指定用户\n\
    是命令的参数，表示使用 file 作为 crontab 的列表文件并加载\n在执行中没有指定这个参数，crontab 命令将接收标准\n输入（键盘）上的键值，并将它们载入\
    \ crontab\n| -e | 编辑用户的 crontab 文件内容。如果不指定用户，则表示编辑当前用户\ncrontab 文件\n| -l | 显示当前用户的\
    \ crontab 文件内容，如果不指定用户，则显示当前\n用户的 crontab 文件内容\n| -r | 在 /var/spool/cron 目录中删除某个用户的\
    \ crontab 文件，如果不指定用户\n则，默认删除当前用户的 crontab 文件\n| -i | 在删除用户的 crontab 文件时询问确认 |\n\
    \n表 10-20 crontab 命令的常用选项及其说明\n\n终端使用用户的身份登录后，在命令中输入 crontab -e，此时会打开当前\n终端默认的文本编辑器，简单来说就是\
    \ vi，此时就可以编辑属于用户 自己的\ncrontab 配置文件了。输入“0111 * * * *”保存并退出，此时会在终端上"
