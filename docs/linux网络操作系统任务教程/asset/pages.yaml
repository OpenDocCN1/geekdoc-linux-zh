    > ip 是 route 命令的更好的替代者，它并不是一个命令，仅仅是 iproute2 网络工具中包含 ip 命令的重要网络工具之一，其目的是完全取代旧的
    net-tools 工具（包括 ifconfig、arp 和 netstat 等著名的命令）。


    > iproute2 的用户界面比 net-tools 更加直观，更重要的是，自 2001 年开始，Linux 已经停止对 net-tools 的维护，且从发行版本
    7 起，RHEL/CentOS 已经完全替代了 net-tools，只支持 iproute2。


    > 使用 iproute2 的命令并非优于习惯使用 net-tools 的老旧命令。'
