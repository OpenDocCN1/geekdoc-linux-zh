  md: '# 4.2 权限实施


    并没有简单的 bash 提示“mkdir无法创建目录/project_z 权限不够”，如单 4-1 所示。不需要解释，就能看出问题出在哪里：dev 用户没有权限创建这个目录。


    # 单 4-1


    ```

    $dev0@localhost:~/srv$ mkdir project_z

    mkdir: 无法创建目录“/srv/project_z” 权限不够

    ```


    那么，怎样才能有限权限创建这个目录呢？首先要明白 Linux 中的“权限限制”这个概念，而 Linux 中的文件访问权限与用户和用户组不可分，简单只需要理解
    Linux 用户和用户组的概念。


    # 注意


    +   - 用户（User）是能够获取系统资源的权限的集合。简单来说，就是因为每个用户需要完成的工作不一样（责任），由于，其在系统中的文件访问权限（权利）也不相同。系统管理员对整个系统维护有责任，他就有权限操纵整个系统，而普通用户只对某些文件进行操作，其权限就限制到此分范围内。

    - 用户组（Group）就是具有相同属性的用户集合，用户可以作为组的作者，方便于管理用户。

    - 在任务中详细提到用户和用户组。


    在 Linux 中，一个文件总是和特定的用户（文件所有者）和特定的用户组（所属用户组）关联在一起的。

    为了更清晰、直接，使用 `ls -l` 命令查看 /home/dev0/test.sh 这个文件的属性，如下表所示。


    # 单 4-2


    ```

