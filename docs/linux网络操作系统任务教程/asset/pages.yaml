  md: '# 前 言


    CentOS (Community Enterprise Operating System) 是基于当前主流的 Linux 商业版本——RHEL (Red
    Hat Enterprise Linux) 的自由 Linux 发行。它由 RHEL 源代码重新编译而成，除了没有 RHEL 的付费技术支持，其他方面与 RHEL
    完全相同，稳定性和兼容性优秀，同时可以学习者的系统运行知识和能够完全无缝迁移到 RHEL 中。本书使用的 Linux 版本为 CentOS 7.X。


    编写本书的目的是帮助 Linux 运行初学者完成一些常见的系统管理任务，并帮助从服务运维、嵌入式开发、移动应用开发等打好基础。采用全任务手册的编写方式，从一个刚入行的初级
    Linux 运维人员的视角出发，由浅入深、循序渐进地展开。本书共包含 10 个任务：任务 1 获取和部署 Linux，介绍如何配置主机环境、获取合适的 CentOS
    安装镜像，并根据客户需要部署安装系统；任务 2 创建任务，介绍 CentOS 默认的 Linux 基本，任务 3 初级任务，介绍如何与外部系统进行交互；任务
    4 管理文件，介绍 Linux 中查看和操作文件的方法；任务 5 网络创建和管理，介绍 Linux 在运用中重定向方向来解决复杂任务问题的方法；任务 6 管理用户，介绍
    Linux 中查看和用户和权限的方法；任务 7 磁盘管理，介绍 CentOS 中磁盘缓冲区、分区格式化和挂载的方法；任务 8 网络管理，介绍 CentOS
    中配置网络的方法；任务 9 软件包管理，任务 10 管理进程和服务，介绍在 CentOS 中监控进程和服务的。


    本书是课程《Linux 系统管理》的教材。本课程是面向一切的公共性职业课程，“中国大学课堂”已经上线，拥有数十万学生，课程内容涵盖了基础性、加强性、短小型的若干个视频及演示的测试，并让课程进行小组竞赛。本书是课程的延伸与补充，学者可以在学习该课程的同时使用本书，以获得良好的学习体验。另外，与本书配套教材《Linux
    系统管理》在“智慧课堂”（www.icve.com）上，学者可以登录进行在线学习及获取资源，教师也可以根据课程构建具有教学特色的 SPOC课程，详见“服务指南”，教师也可以通过邮件邮箱
    154813297@qq.com 获取资源。


    本书由宁波市职业技术学校的顾颜编著本书作为教材使用，建议安排 85 学时（17 周×5课时/周）；教师也可以根据实际需要，缩减到 51 学时（17 周×3课时/周），基本不会影响教学流程和教学安排。


    由于作者写作和水平有限，书中错错误和不足之处乃为所措，恳请读者指正。


    2020年2月


    孙 华'
