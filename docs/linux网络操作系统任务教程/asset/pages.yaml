  md: "# 注意\n\n在 RHEL/CentOS7，每个网络设备都可以有多个不同的配置文件，但是是在同一时间生效的只有一个。\n\n在 RHEL/CentOS7，用\
    \ NM 创建的每个连接都会创建一个对应的接口配置文件，对于对连接所做的改进，最终会体现在对应的接口文件中。当然，完全可以关闭 NM，用服务器直接编辑接口配置文件来配置网络接口。\n\
    \n在 RHEL/CentOS7，所有网络设备的配置文件都存放在 /etc/sysconfig/network-scripts/目录下，名称一般以“ifcfg-”开头，后缀-跟上连接名或在\
    \ NM 中的连接对应的命名，因此此配置文件会有如 ifcfg-ens39或ifcfg-office之类的名称。\n\n在本章将用若干例子来说明这个网络设备配置。首先给出的一个典型的静态配置的接口配置文件，其中网络设备部分进行了简单的说明，见清单\
    \ 8-54 。\n\n# 清单 8-54\n\n```\nTYPE=Ethernet\nBOOTPROTO=none\nONBOOT=yes\nIPADDR=192.168.4.128\n\
    PREFIX=24\nGATEWAY=192.168.4.1\nDNS1=192.168.4.2\nDNS2=192.168.4.3\nPEERDNS=yes\n\
    DEVICE=ens39\nDFROUTE=no\n```\n\n+   * 类型，Ethernet是以太接口\n* 配置方式，none 表示静态接口\n\
    * 接口是启动机\n* IP 地址\n* 接口子掩码\n* 网关\n* DNS，此处设置了两个 DNS\n* 是否允许配置文件中的 DNS 配置覆盖全局 DNS\n\
    * 配置文件/etc/resol.conf 中的 DNS 配置\n* 配置所对应的接口设备名，也相同配置文件\n* 能够读取到接口\n* 接口作为默认路由的\n\
    \n```\n--- 下面的配置项是 NM 的扩展配置项，如用 NM 管理，这些配置项都是无用的---\nIPV4_FAILURE=fatal\nNM_CONTROLLED=yes\n\
    NAME=cffe-con\n```\n\n+   * IPv4 失败时被视为激活失败\n* 接口是托管网，也即 NM 能管理托管接口\n* 配置所对应的连接名，往往是\
    \ ifcfg-office\n* 下半部分，此配置文件名为 ifcfg-\n\n# 清单 8-55\n\n```\nTYPE=Ethernet\nBOOTPROTO=dhcp\n\
    ONBOOT=yes\nDEVICE=ens38\n\n--- 下面的配置项是 NM 的扩展配置项，如用 NM 管理，这些配置项都是无用的--- \nIPV4_FAILURE=fatal\n\
    NM_CONTROLLED=yes\nNAME=cffe-on\n```\n\n+   * 配置方式，dhcp 表示 DHCP 动态获取配置\n\n最后，给出网络设备配置文件某些配置项的列表（表\
    \ 8-14 所示） 参参数，请注意其中有星号 (*) 标注的配置项只对 NM 有意义。\n\n![](img/a95c6704e7d3618800a5dd1f2c0aafd0_250_0.png)"
