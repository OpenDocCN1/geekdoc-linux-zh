    这些问题，Red Hat 开发了一套开放的软件包封装工具，名为 RedHat package

    manager (RPM)，是 Fedora、RHEL 及其发行版本，如 CentOS、Scientific Linux、

    OpenSU 以及其他 Linux 操作系统中默认的软件包方式，也是 Linux 中使用的

    广泛的软件软件包方式之一。'
