    “智慧职教”是由高等等教育出版社建设和运营的职业教育数字资源共建共享平台和在线课程教学服务平台，包括职业教育数字化学习中心平台（www.icve.com.cn）、职教云平台（zjy2.icve.com.cn）和课堂智慧职教
