    # 2. 元字符


    通过使用正则表达式中的一些元字符，可以很容易地匹配符合规则的字符标点号。“常用的匹配符所用的元字符如5-15所示，在上面的“入门”中使用。


    表 5-15 元字符


    | 字符 | 说明 |

    |---|---|

    | [:alnum:] | 与字母之外的任意一个字符匹配。若要匹配本身，必须在正则表达式前面加上转义符（\） |

    | [:space:] | 与任意空白字符匹配，包括空格、制表符、换行符等 |

