    第一行是默认路由，表示排除了 192.168.0.0/24 和 172.168.116.0/24 两个网段之外（这两个网段的路径由两条路由指向）的数据，都由
    ens38 出口转发，这是正常的。所有数据包的路径。由于是直连路由，路由由内核自动生成，显示 192.168.0.0/24 网关直连在 ens38 上，均可以直接访问，这与任务要求是相符的。如果一切正常，此时就可以尝试分别
