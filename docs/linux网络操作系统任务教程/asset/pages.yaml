    # 表 3-2 vim 环境设置命令


    | 命令 | 设置值 |

    | --- | --- |

    | set all | 显示当前的环境参数，默认不显示行 |

    | set nu | 在每行的开头显示当前行，默认不显示行 |

    | set hsearch | 将找到的字符串高亮显示，即使 vim 会高亮所有匹配的地方，默认高亮 |

    | set autointend | 自动缩进，当创建一个新行时，自动沿用上一行的缩进，默认不自动移动 |

    | set showmode | 是否显示当前模式，例如“插入”或“--INSERT--”之类的字符在左下角，默认显示 |

    | set backup | 自动保存，用备份时，vim 会生成一个备份文件，备份文件名是在原名的后面加上一个“”，例如，文件名是data.txt，默认不备份
    |

    | set ruler | 下划线向右移动，默认自动跟随 |

    | set wrap | 横行移动，以便查看所有的行，默认自动换，等待输入一个命令 |

    | set showcmd | 右下角，右侧显示未完成的命令。例如，输入<58>时，再输入<-g-后，<58>命令消失。默认不显示 |

    | set autowrite | 自动保存，默认不自动保存 |


