    ```


    了解这些后，就可以用以下命令完成任务了。注意在用输出定向时“>”将标准输出重定向到了 archived_files 文件（标准输出到文件描述符忽略了 1 选项），用“>2”将错误输出重定向到了
    err_file 文件，由于没有产生任何输出，如清单 5-3 所示。


