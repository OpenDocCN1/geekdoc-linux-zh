  md: '显示清单 10-59 中所示的字样，表示成功添加了一条新的计划任务。


    # 清单 10-59


    ```

    $ crontab -e

    c crontab for stu - using an empty one

    crontab: installing new crontab

    ```


    也可以用 crontab -l 列出当前的计划任务或用 crontab -r 删除当前的计划任务配置，清单 10-60所示。


    # 清单 10-60


    ```

    $ crontab -l # 列出当前用户(stu)的计划任务

    0 01 * * * echo "Hello"

    $ crontab -r # 删除当前用户(stu)的计划任务

    $ crontab -l

    no crontab for stu # 当前用户(stu)的计划任务为空

    ```


    > 注意

    > 要限制用户使用 cron，可以将其用户名（每一个的格式）写入禁止文件（黑名单）/etc/cron.deny，这些用户将无权使用 cron。系统默认一个空的/etc/cron.deny
    文件，表示所有用户都可以使用 cron。

    > 如果要使用更严格的安全措施，可以将用户名写入授权文件（白名单）

    > /etc/cron.allow 来明确仅哪些用户有权使用 cron，而其他用户则无权使用。


    # 10.4 任务总结


    在完成了本任务后，小 Y 应对 CentOS 中的进程和服务管理有了一些了解。现在，小 Y 应该：


    +   1. 查看系统中的进程。

    2. 操作系统中的进程。


    同时，小 Y 应该已经了解如下相关知识：


    +   1. 进程、作业和维护进程的概念。

    2. 进程状态查看命令。

    3. 向进程发送信号命令。

    4. systemd 系统的基本概念。

    5. systemctl 命令的主要用法。

    6. 计划任务相关概念和命令。'
