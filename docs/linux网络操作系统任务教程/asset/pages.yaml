    # 清单 8-47


    ```

    # ip link set dev ens33 up

    # ip link set dev ens3 name eth1

    # ip link set dev eth1 up

    # ip link set dev eth1 mtu 3000

    # ip link set dev eth1 address 00:01:4f:00:15:f1

    # ip link set dev eth0 txuel 100

    ```'
