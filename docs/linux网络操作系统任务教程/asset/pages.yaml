  md: '# 阅读说明


    本书的一些字体使用了不同的字体、大小和粗细。其中突出显示是有特别含义的，即用同一种风格显示不同同词来表明它们属于特定类型。用这种方式显示的各种字体类型如0-1所示。


    表 0-1 文档字体类型列表


    +   键盘上的按钮用这种方式显示，例如：

    * 使用<Tab>键命中，输入一个字符，然后按<Tab>键。终端机上就会显示目录中开头为那个字符的文件夹列表。

    * 使用<Ctrl+Alt+Backspace>组合退出图形界面，返回到图形登录界面或控制台。

    * 在图形界面的窗口中使用词汇、短语用这种方式显示。它用来标明某个图形界面或屏幕窗口中的某个元素（例如与复选框等相关的词），例如：

    * 使用如果要在屏保护程序前请求命令，可以选择“需要命令”复选框。

    此这类表格是在是在命令行中显示的输出。用户输入命令的响应、错误信息，以及程序或脚本中向用户请求输入的提示，都用这种方式来显示。例如：

    * 使用 ls 命令显示目录的内容：


    | Desktop | logs | paulberg.png |

    | --- | --- | --- |

    | Mail | backupfiles | reports |


    +   * 命令返回的输出（在上面的例子中是目录的内容）用这种方式显示。


    在此之外，本书还未使用 3 种不同的标记来强调某些信息。


    > 注意：


    记录，Linux 系统区分大小。例如，rose不是 ROSE 或 rOs。


    > 小心


    不要使用用户身份来执行日常任务，应该使用一个通用的账号，除非需要使用账号来执行系统管理任务。


    # 命令 ping


    用法:ping [主机]IP地址

    功能：向网络发送 ICMP Echo 请求（ECHO_REQUEST）分组。计算信号往返时间和（信息）包括丢失情况的统计信息，并且完成后显示一个摘要概述。


