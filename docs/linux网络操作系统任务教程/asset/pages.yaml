    # 6.3.4 知识点 4 允许用户 root


    在本章中，重点强调了让用户切换身份执行一个命令，以及与其紧密相关的配置文件/etc/sudoers。


    在任务 1 中提到，在多人共享系统的情况下，将系统的 root 密码共享的风险很大。sudo 命令允许用户不需要密码就能执行 root 命令的途径：sudo
    命令允许用户在范围内允许其他用户身份执行指定的命令，所以通过 sudo 命令可以配给普通用户一些的权限，让他们执行只有 root 或其他特权用户才能完成的任务。


    但在合理配置之前，系统默认只有 root 用户可以执行 sudo 命令，普通用户是无法使用 sudo 命令的。sudo 命令的生效并非重点，重点在 /etc/sudoers
    文件，这也是我们在前面将要介绍的内容。


    +   1. /etc/sudoers文件


    下面需要通过修改/etc/sudoers 文件来让其他用户能够执行 sudo 命令。etc/sudoers 文件是一个文本文件，可以直接通过 visudo
    命令来打开并编辑这个文件。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_187_0.png)'
