    # 9.2 任务实施


    # 9.2.1 子任务 1 RPM软件包安装


    RPM (Red Hat package manager) 是 Linux 中使用最广泛的软件包管理器，最早由红帽社区开发和维护，现在已开源社区维护。RPM
    目前是 Linux standard base (LS) 采用的管理系统，也是 RHEL、CentOS、Fedora、OpenSUSE、Scientific
    等发行版本中默认的软件管理器，可以算作行业标准之一。首先，需要获取这些软件的 RPM 软件包，在知识点2中将详细说明 rpm 命令用法。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_255_0.png)


    > 注意

