  md: '文件描述相关的调度都是通过文件流完成的。因此，文件流一来来说可以与文件描述对应的起来。习惯上，标准输入文件标识符是 0；标准输出是 1；标准错误是 2。


    理解了上面两个概念后，“输入/输出定向”就相当容易理解和记忆了。“输出定向”的不是将标准输出流 (stdout) 或者标准错误流 (stderr) 输出命令结果或者错误信息，而是将其写入到特定文件中。“输入/输出定向”的语法就是更简单了，可以用表
    5-2 进行查阅。


    # 表 5-2 输出定向语法


    | 命令 | 描述 |

    | --- | --- |

    | >文件名 或 >>文件名 | 表示将来自文件描述符 n 的输出重定向到文件；前者表示覆盖式的定向，也即输出流的内容会覆盖原有文件中的内容；后者表示追加式的重定向，也将输出流的内容会包含原有文件之内容。注意，无默认的标准输出是
    (1) |

    | &文件名 或 &&文件名 | 表示将标准输出和标准错误重定向到文件中。同时，前者表示覆盖式的定向，后者表示追加式的定向 |

    | n2>&m | 表示将来自文件描述符 n 的输出重定向到来自文件描述符 m 的输出中 |


