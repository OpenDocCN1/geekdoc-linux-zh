  md: '# 1. 分区表


    硬盘有一个简单的功能：保存数据并随时访问。对硬盘进行分区的目的非常明确；将操作系统与用户数据进行分离；可以使用不同的文件系统，可运行多个操作系统。分区主要为了实现分区表（partition
    table），分区表中记录了每个分区的起始和结束位置。分区表一旦丢失，硬盘上的数据就都毁了。


    # 2. 分区标准


    在 Linux 中支持两种物理硬盘分区类型：MS-DOS (MBR 分区表) 和 GPT (GUID 分区)。MS-DOS 是基于 BIOS 的计算机的较老的磁盘分区；GPT
    是新的分区格式，它是一种可扩展固件单元（UEFI）的一部分。当使用大硬盘（2TB 容量以上时），安装程序会自动选择 GPT 类型的分区；否则默认使用 MS-DOS
    分区类型。


    +   - 从前的图 1-10 可以看到，建立的分区表是 MS-DOS 类型的

    - MS-DOS 分区最多一个主分区（超过就必须使用扩展分区，不支持 2TB 以上的硬盘，扩容性能差，很有很大的局限性）。

    - GPT 分区理论上不支持分区（操作系统限制），支持 2TB 以上的大硬盘，容错性能良好，已经逐渐替代 MS-DOS。


    # 3. 逻辑分区


    逻辑分区 (LVM) 是 Linux 环境下对分区管理的一种机制，可以将多个分区合并在一起为一个设备提供给用户，并可以根据实际需要动态调整文件系统空间大小以提高活性；使用
    LVM 逻辑硬盘或分区格式化为物理的。一个或多个分区合并成卷组（同一个分区），每个卷组按需划分一个或多个逻辑卷（同一个分区），可以像操作一个分区一样在其中创建文件系统。例如，在任务中，在安装系统时划分的分区，除了启动分区/boot
    外，所有的分区都是 LVM 的逻辑分区。


    # 4. 交换 (Swap) 分区


    在 Linux 的安装过程中，需要划分一个作为 Swap 分区，也叫“交换分区”。来说，当程序的物理内存不足时，Linux 的解决方法是把不需要的数据存到硬盘上的“虚拟内存”中，交换的速度比内存慢，但至少容量大很多。另外，操作系统也可以把一些很久活跃的程序迁移到虚拟内存中，留出更多的内存给运行中的程序。交换分区就是在
    Linux 中专门用于虚拟内存分区。


    交换分区大小的划分对 Linux 服务器的性能非常重要。通过调整交换分区，有时可以越系统性能瓶颈，节省操作系统费用。在划分分区大小时，可以遵循如下准则'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 获取和部署 Linux


    +   - 交换分区不能太大。一个足够大的交换分区对于主机来说，其物理内存小的机器是必不可少的。

    - 交换分区也不能太大。划分过大的交换分区不仅不能加速机器运行速度，还会其反，并且浪费硬盘空间。


    +   - 如果主机有多个物理硬盘，最好把交换分区分布到每一块硬盘上以提高速度。因为交换分区的操作是读写的操作，如果有多个硬盘上的同一个交换分区，交换分区的轮流操作不同磁盘，这会导致均衡
    I/O 的速度。


    一般来说，在主机用途没有特殊的情况下，可以参考 Red Hat 推荐的交换分区的大小选择原则，见表 1-9 所示。


    表 1—9 RHEL推荐的交换分区设置

    |系统内存容量/GB | 建议交换分区大小 | 允许交换分区大小 |

    |---|---|---|

    |小于 2 | 物理内存的 2 倍 | 物理内存的 3 倍 |

    |2~8 | 与物理内存相同 | 物理内存的 2 倍 |

    |8~64 | 4GB 到物理内存的 0.5 倍 | 物理内存的 1.5 倍 |

    |超过 64 | 独立硬盘（至少 4GB） | 不建议使用休眠功能 |


    # 5. 挂载


    对 Linux 用户来说，没有几个分区，而是只有一个我们且唯一的根目录。Linux 中中每个分区都可以成为这一个目录的一部分，因为它采用了一种叫做“挂载”的处理方法，将一个分区和一个目录联系起来，Linux
    可以将分区“挂载”到某个目录下的某个目录。这个目录就称为“挂载点”，实际上就是该分区文件系统的入口目录。


    选择挂载点是安装到磁盘分区时必不可少的步骤，在任务 3 中安装系统自动生成的分区，除了 Swap 分外，其他分区的挂载点都设置为某个目录。这些设置的分区，在开机时会被自动挂载到预设的挂载目录上，然后就可以通过这些目录访问它们。也可以在安装完成后，通过手动的方式来挂载和卸载。


    # 6. 文件系统


    文件系统是一种存储和组织数据的方法，对于其获取和查找数据非常重要。Linux 支持多种文件类型的分区系统，其主要目标是提高兼容性，但它只能对其中少一部分进行创建和操作。


    CentOS 7 支持读写的所有文件系统包括 BTRFS, CAMFS, EXT2, EXT3, EXT4, FAT, GFS2, HFSPlus, Minix,
    MS-DOS, NTFS, ReiserFS, VFAT 和 XFS。


    注意在任务 3 中安装系统自动生成的分区，除了 Swap 分外，其他分区都被创建为 XFS，这是 CentOS 7 的默认文件系统。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_29_0.png)'
