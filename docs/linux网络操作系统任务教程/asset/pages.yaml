  md: '# 8-6 系统网络状态


    | 字段 | 意义 |

    | --- | --- |

    | STATE | 网络是否连接 |

    | CONNECTIVITY | 网络连接状态，有5种状态：

    - full: 主机连接网络，且能访问互联网

    - limited: 主机连接网络，但无法访问互联网

    - portal: 主机连接网络，需要通过认证后才能访问互联网

    - none: 主机未连接网络

    - unknown: 未连接的网络

    | WIFI/WIFI 无线连接状态：表示Wi-Fi硬件开关、Wi-Fi软件开关、WWAN硬件开关、WWAN开关状态，注意，即使系统中没有相关设备，默认全部启用
    |


    # 2. 查看连接


    nmcli命令显示正在连接的连接，命令输出只有一行，表示系统中有一个连接，共有4个字段（意义见8-7所示），如清单8-25所示。


    ```

    #nmcli connection show

    NAME UUID TYPE DEVICE

    ens33 f5b10626-0548-42a4-b16d-427ad46352ca ethernet ens33

