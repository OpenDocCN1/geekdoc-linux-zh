    # 注意


    关于 parted 命令的用法在本任务的知识3中详述。


    parted and fdisk一样，有一个与用户交互的界面，可以通过交互的方式来划分分区，但分区还可以通过非交交互的方式来划分分区。在效率、灵活和实用角度上，更偏向于使用非交交互的方式。


    # 小心


    parted所有的操作命令都是写入硬盘分区的，因此pared的每一步操作都是不可撤销的，要谨慎慎。


    硬盘/dev中没有分区表，与fdisk 会自动建立 MS-DOS 分区不一样，parted需要手动创建分区。要为/dev 建立 GPT 分区，可以使用 parted
    的 mklabel 命令来完成这一点，如清单 7-10 所示。


    清单 7-10


    ```

    #parted /dev/sdb mklabel gpt

    信息: You may need to update /etc/fstab.

    ```


    # 注意


    +   - 可能包括 MS-DOS 和 GPT 在内的多种类型的分区表，因此用户需要在分区前决定硬盘使用哪种分区类型，并建立相应的分区表。

    - fdisk 默认使用 MS-DOS 分区。


    # 小心


    mklabel 会改变分区类型，将导致硬盘上原本的所有数据丢失。操作无法撤销，要谨慎慎。


    接下来就可以用 parted 的 mkpart 命令划分第一个分区了，如清单 7-11 所示。注意 mkpart 所带的以下参数：


    +   - disk_pa: 给 GPT 分区的名字。这个参数对于 GPT 分区来说是必须的。

    - 0%和 25%: 分区的起始位置和结束位置，表示将前 25%的空间划分本分区，


