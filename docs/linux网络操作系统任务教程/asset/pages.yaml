    # 知识点 10.3 用 at 和 crontab 计划任务


    计划任务是系统自动完成的一种方式。原理就像闹钟一样，到了指定的某个时间点，系统就会自动执行某些操作，实现想要达到的目的。在实际生活中，有很多类似的例子。例如定时发送邮件、定时备份某个目录、定时检查服务器利用率并提醒管理员。Linux
    提供了 at 和 crontab两种不同的计划任务机制，使用户能够灵活的计划任务，达到实际生产中的。


    (1) 安排 at 定时任务


    就像一个定时闹钟一样，Linux 提供了能够在某一个时刻执行计划任务的命令，at 就是命令。


    首先要确定 at 的守护进程 atd 是否在运行（一般情况下 at 是开机启动的），如所示


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_300_0.png)'
