    # 10.3.3 知识点3 用kill操纵进程


    kill 系列命令是 Linux用来操控命令的主要工具，能够指定的信号发送给进程。在本节中，将介绍 kill、killall 和 skill 命令的语法，并通过若干实例展示这些命令的具体用法。


    (1) kill 命令


    # kill 命令


    用法：kill [选项] 进程发送指定信号。

    功能：向进程发送常用选项及其其说明如表10-9所示。

    kill 命令的常用选项及其说明


    | 项目 | 说明 |

    |---|---|

    | -1 | 列出全部进程名称 |

    | -p | 只标记正在运行的进程号，而不发送任何信号 |

    | -s | 指定要发送信号的进程号，如果没有指定任何信号，默认发送的信号为 SIGTERM (-15) |


    kill 常用的信号有表10-10所示的几种。如果你想了解信号的用途，可以通过 man 7 signal 命令来查看相应的帮助手册。


    | 信号 | 说明 |

    |---|---|

    | SIGUP (1) | 挂起进程，通常是因为终端断线或者用户退出引起 |

    | SIGINT (2) | 中断信号，与按下 [Ctrl+C] 组合键等 |

    | SIGQUIT (3) | 退出进程，与按下 [Ctrl+\] 组合键等 |

    | SIGTERM (15) | 终止信号，默认发送信号 |

    | SIGKILL (9) | 强制终止进程，不可捕获和忽略 |

    | SIGSTOP (19) | 暂停进程，与按下 [Ctrl+Z] 组合键等 |

    | SIGCONT (18) | 继续进程，与 STOP 信号相反 |


    用 kill 终止进程很简单，一般分步，查找确定进程 PID，用 kill 终止进程，如清单 10-21所示。


