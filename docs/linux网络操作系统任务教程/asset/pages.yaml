  md: '最后，还需要一个特殊的分区：要求使用 NTFS 文件系统/sdb2。MS Windows NT 系列（包括当前 Windows 10）所采用的主文件系统，但
    CentOS/RHEL 目前官方不支持 NTFS 文件系统（版权所有）。这个问题容易解决，只需要两个 RHEL 附加内核库中的软件包 ntfs-3 和 ntfprogs
    就可以支持 NTFS 的创建和挂载了，请查看清单 17。


    # 清单 17-1


    ```

    # yum install -y epel-release

    # 安装 NTFS/CentOS 附加内核库 EPEL，两个软件包含在该仓库中

    # yum install -y ntfs-3g

    # 安装 ntfs-3g 以支持读写 NTFS 文件系统

    # yum install -y ntfprogs

    # 使用 ntfprogs 以创建 NTFS 文件系统

    ```


    > 注意


    ntfs-3g 和 ntfprogs 都是 Tuxera 公司开发并维护的开源项目，目的是为 Windows 操作系统，如 Linux、Android、Mac
    OS、FreeBSD 等提供读写和管理 NTFS 文件系统的程序和实用工具。


    安装完成后，就可以为 sdb2 安装 NTFS 文件系统了，用 -t ntfs 指定定义的文件系统类型，请查看清单 17-1。


    # 清单 17-1


    ```

    # mkfs -t ntfs /dev/sdb2

    Cluster size has been automatically set to 4096 bytes.

    Initializing device with zeros: 100% - Done.

    Creating NTFS volume structures.

    mkntfs completed successfully. Have a nice day.

    ```


    > 小士


    用 ntfprogs 操作 NTFS 分区要小心，因为这竟不是微软的官方驱动，可能会对文件系统造成硬盘损坏。


