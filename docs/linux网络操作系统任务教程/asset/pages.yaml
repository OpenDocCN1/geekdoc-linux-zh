    # 2 SGID


    SGID (Set Group ID)，设置文件组 ID 权限仅对可执行文件和目录生效。这个位置对于可执行文件和目录的意义不同的，如表 4-25 所示。


    | 表 4-25 SGID 对可执行文件和目录的意义 |

    | 目标 | 意义 |

    | --- | --- |

    | 二进制可执行文件 | 对于可执行文件 A ，如果 SGID 设置在 A 组，则用户无论是普通用户，在执行 A 的时候，它的生效用户组将成为 A所属的组
    |

    | 目录 | 对于目录 D，如果 SGID 设置在 D 组，并且用户对 D 目录有写和执行权限，用户进入 D 时，生效的用户组将成为 D 的组，并在 D 目录内创建的文件或目录，将是此
    D 目录的用户组 |


    例 3: 显示一个典型的 SGID 权限的文件/usr/bin/mlocate。用“ls -l”命令查看，从文件权限组中应该出现 X 位置，表示该 /usr/bin/mlocate
    具有 SGID 权限。在本次任务的知识点 8 中提到，locate 命令实际上会访问 /var/lib/mlocate数据库。这个文件对于普通用户没有权限，由于
    mocate 没有 SGID 权限，在运行 mocate 创建进程时，这个过程就会得到 mlocate 命令的用户权限，相当于这个用户被临时加入了 mlocate
    组。对于 mlocate数据库这个文件有 r权限，可以访问，如清单 4-106 所示。


    # 清单 4-106


