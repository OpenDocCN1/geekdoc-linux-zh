    +   - 发送 SIGKILL (9) 信号要十分小心，这个信号不能被进程忽略或捕获，会直接结束进程，导致在结束前无法释放资源，一般不推荐使用，除非其他办法无效。

    - 当发送 SIGKILL (9) 信号后，通过 ps -ef 确认是否有残留僵进程。如果有，就需要通过终止其父进程来及时清理僵进程。


    # (2) kill 命令


    kill 命令用于终止进程进程发送信号。它也可以用 kill 命令通过进程 pid 发送信号，这往往往需要在之前用 ps 或者 top 命令确定进程 pid，而
    kill 把两个进程合并为一，是一个很好用的命令（系统中另外有一个 pkill 命令与 kill 命令功能类似，后面就不再赘了）。


    # 命令 kill


    用法：kill [选项] [进程名]

    功能：通过名字终止进程。

    kill 命令常用的选项及其说明如清单 10-11。

    kill 命令常用的 kill 命令的选项及其说明


    | 选项 | 说明 |

    | - | - |

    | -l | 列出全部进程名称 |

    | -s | 指定发送的进程号，如果没有指定进程号，默认发送的信号为 SIGTERM (-15) |

    | -I | 忽略进程中的大小号 |

    | -i | 交互模式，终止进程前询问用户 |

    | -q | 静默模式，如果未成功终止进程，不提示 |

    | -u | 向指定的用户的进程发送信号 |

    | -w | 等待所有需要终止的进程终止。kill 会每次检查一次是否已被终止的进程仍然存在，仅当这些进程结束后才返回。注意：如果信号被忽略或没有作用，或者进程停留在僵尸状态，kill
    可能会一直等待 |'
