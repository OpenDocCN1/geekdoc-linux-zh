- img_proc: true
  md: '# 7.3 必要知识 | 19


    添加一个扩展引导记录(ebr)，包括一个分区表，用于记录额外分区(逻辑区)的分区数据目。


    +   - 不能支持大小超过2.2TB的硬盘(切恳地，只能使用其中的2.2TB 空间，余下的就太浪费了。)

    - 可靠性差，分区表一旦损坏，硬盘数据就会丢失。

    - 不支持 UEFI 技术。

    - GPT (GUID partition table，全局唯一标识表)是一种全新的分区方式，解决了 MS-DOS 分区的很多缺点。该分区利用了硬盘头上的34个LBA
    逻辑块，默认大小为512字节并使用相同的LBA做了一个备份，并带有循环校验码(CRC)以确保分区完整和正确。它的优点在于：

    - 支持超过2TB的硬盘(64位地址空间)。

    - 支持128个分区。

    - 分区数据健全，不易损坏。

    - 支持 UEFI 技术。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_208_0.png)


    # 注意


    +   - 如果内核不支持 MS-DOS 格式。

    - 当前的主流 Linux内核版本都支持 GPT 分区格式。

    - 在实际应用中，往往使用逻辑管理器(LVM)来管理物理分区。


    # 3 文件系统


    分区完成后，还没有在硬盘上存储数据，还需要进行格式化，就是在分区上建立文件系统。文件系统是操作系统在磁盘上组织存储的数据的一种机制，也就是操作系统知道以何种形式在分区上读取/存放数据。


    到目前，Linux内核已完全支持几十种文件系统类型，如7-5所示。在RHEL/CentOS 7中默认使用的是


    > 7-5 Linux支持的文件系统 特点


    | 文件系统 | 特点 |

    | --- | --- |

    | Minix | 最初Linux所使用的文件系统，后面是 Ext 文件系统的鼻祖 |

    | Ext | 早期扩展文件系统(Extended FS)，在 Minix集成上扩展了若干功能 |

    | Ext2 | Linux中标准的内核系统是后期 Ext3 和 Ext4 系统的基础 |

    | Ext3 | Ext2的升级版，提供了更好的性能和可靠性，还有更为丰富的功能 |

    | NTFS | Windows NT/XP/78 操作系统使用的文件系统 |


    +   - UEFI (Unified Extensible Firmware Interface，统一的可扩展接口)是一种详细描述硬件类型的标准的。


    这种方法让操作系统自动从启动的操作的环境，加载到操作系统后，将替代传统的BIOS。'
