  md: '# 5.2 任务实施 | 133


    方法如清单 5-7 所示，表示将标准输出重定向到dev文件中，/dev 是 Linux 中的一个非常特殊的设备，写入内容将直接被丢弃。将标准输出重定向到该文件，就是将错误输出都丢弃，自然就不会有错误输出了。


    # 清单 5-7


    ```

    $ cp .*.bak tmp 2>/dev/null

    ```


    +   * /dev/null 在 Linux 中，/dev/null称为空设备，是一个特殊的设备，所有写入的内容都会永远消失，而会尝试从那里读取内容也不读或一个（读取时立即得到一个
    EOF，文件结束）。

    * 在程序者或系统管理员运行时，/dev/null称为垃圾桶（bit bucket）或者黑洞（black hole），设备通常用于丢不需要的输出流，作为对于输入的空设备，这些操作通过命令重定向即可完成。


    # 2. 使用输入重定向


    输入重定向的并不是通过标准输入流（stdin）获取命令输入，而是通过 shell 读取指定的文件内容作为命令的。


    在任务中不会用到输入重定向，但不对于输入重定向这部分内容就不需要掌握了。输入/输出重定向向来是一体，掌握了输出，不理解输入重定向，那就是一知半解了。


    输入重定向的语法可以通过表 5-3 概述。


    | 表 5-3 输入重定向语法 |

    | 操作 | 说明 |

    |---|--|

    | <filename> | 不是从标准输入流而是而是从指定的文件接收 |

    | <delimiter> | here-document 格式，表示从开始标记和结束标记delimiter的内容为输入 |


