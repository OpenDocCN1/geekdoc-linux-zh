    # 4.3 必要知识


    # 4.3.1 知识点 1 文件系统层级标准


    Linux 中所有文件存储在文件系统中，它们被组织到一个倾倒的目录树，称为文件系统结构，如图 4-2 所示。这棵树是倾倒的，因为根目录“/”在这一层结构的顶部，称为根目录，所有的文件和目录位于根目录“/”之下。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_98_0.png)


    图 4-2 文件系统层级结构


    在早期的 Linux 中，万家自己定义了自己的文件系统结构，比较混乱。Linux 为了避免产生相同的混乱，在世界上就开始了对 Linux 文件系统结构进行标准化的活动。FHS(Filesystem
    Hierarchy Standard)就是 Linux 基金会发布的文件系统结构标准，简单来说，规定了根目录“/”下面各个目录应该存放什么文件，例如 /etc
    应该放置设置，/bin 或 /sbin 应该放置可执行文件等。例如 /var 放置登录目录、/usr/share 共享数据等。


    FHS 主要定义了两个层级，第一层是根目录“/”下的每一个目录应该存放什么文件，第二层是针对 /usr 以及 /var 这两个一级目录的二级目录，例如 /var
    放置其中一些重要的目录如 4-3 所示。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_98_1.png)'
