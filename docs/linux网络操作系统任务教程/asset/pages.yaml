    # 10.3.4 知识点 4 Systemd


    Systemd 是 system management daemon 的简写，主要用来初始化和管理系统服务。Systemd 功能强大，好用方便，在当前大多数的
    Linux 发行版中（RHEL/CentOS 7+、Ubuntu 15.0+）Systemd 代替了从 UNIX 继承来的 System V 古老的 init
    程序以及以后的 Upstart，成为系统初始化和管理服务的默认组件。


    > 注意


    虽然 Systemd 当前已经成为事实上的行业标准，但其内部的争议一直存在，某些 Linux 发者（其中就包括 Linux 内核的开发者 Linus Torvalds）对
    Systemd 感到深痛，其中主要的原因是 Systemd 过于复杂和庞大，不仅是一个系统初始化程序，还包括了管理器、设备挂载、网络配置、会话管理、本地化支持、登录/注册/日志管理等一系列功能，违反了
    Unix 哲学“一次只做一件，并做好（Do one thing and do it all）”的准则。


    这并不是 Systemd 的优劣进行讨论，也不需要对其忠诚态，仅仅将 Systemd 作为一个通用的工具来看。


    Systemd 并不是一个命令，而是一个包含了若干守护进程、库和应用命令的软件，涉及系统管理的方面，其架构如图 10-4 所示。


    其中，systemd 守护进程的核心，是 Linux 内核启动的第一个进程，当内核检测到硬件并组织好了内存后，就会启动这个第一个进程，systemd 命令会按照指定方式启动系统中的其他进程，这也是
    systemd 命令的最重要的功能。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_290_0.png)


    图 10-4 Systemd 架构示意图


    *'
