  md: '# 8.3 知识点 resolv.conf and hosts


    在本节中，将两个网络相关的系统全局配置文件。这两个文件都

    域名解析相关，分别是/etc/resolv.conf文件和/etc/hosts文件。


    +   1. resolv.conf 文件


    /etc/resolv.conf 是 DNS 客户端配置文件，用于设置 DNS 服务器的 IP 地址和 DNS

    域名，还可以包含主机名的。其格式非常简单，每行一个配置项开头，后接-

    一个或多个带有空格的值，其配置项如表 8-15 所示。


    表 8-15 resolv.conf 配置项


    | 配置项 | 值 |

    | nameserver | DNS 服务器 IP 地址。其中，域名服务器是按照文件中顺序查询的，且只有当第一一

    nameserver 没有响应时才查找下面的 nameserver，最多配置 3 个 nameserver |

    | domain | 指定本地主机名 (local domain)。domain 默认为主机名 (hostname)中的

    域名部分，如果主机名中不包含域名，那么默认就是“*”作为其默认值。许多应用程序

    需要用到本地名 |

    | search | 表示查询的搜索列表。search 的值是域名指定的本地主机名，也可以指定域名

    域名为主机名解析。域名之间用空格隔开。当查询的主机名在 DNS 查询时，会在该列表中

    加上主机名如nmbdsdev.cn，变成 ping.nmbdsdev.cn |


    其中主要的是 nameserver 配置项，其他配置项都是可选的。清单 8-56 所示

    一个 /etc/resolv.conf 的内容。


    清单 8-56


    ```

    domain nmbdsdev.cn #指定本地主机名nmbdsdev.cn

    search nmbdsdev.cn intranet.nmbdsdev.cn #指定的两个主机名

    nameserver 172.18.14.1

    nameserver 172.18.14.2 #指定的两个 DNS 服务器地址

    ```


    > 注意


    +   * 在 NM 网络管理时，/etc/resolv.conf 中的内容可能是由 NM 在开机时自动生成的

    其中的域名值会来自本地/主机名指定主机名中的域名；nameserver

    值会来自本地接口配置的 DNS 值或来自 DHCP 指定。

    * 建议修改配置的 DNS 或主机名之前来接修改/etc/resolv.conf。


    如果想进一步了解 /etc/resolv.conf 文件更新更详细的信息，可以通过 man 5

    resol 查看该文件的文档。


    +   2. hosts 文件


    hosts 文件是 RHEL/CentOS 使用在本地快速解析 IP 地址与域名之间的文件，负责

    将主机名映射到相应的 IP 地址。hosts 文件通常用于补充或小型网络中 DNS 的

    功能，用户可以直接对/etc/hosts 文件进行控制。


    一般情况下，hosts 文件的每一行代表一个主机，由 3 个字段组成，每部分都

    空格隔开，格式如清单 8-57 所示。


    清单 8-57


    ```

    ip 地址 主机名/域名（主机名别，该字段可以省略）

    ```


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_252_0.png)'
