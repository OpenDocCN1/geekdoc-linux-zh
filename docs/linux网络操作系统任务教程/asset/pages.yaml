    | 格 式 | 功 能 |

    |---|---|

    | !n | 重新执行第 n 命令，n 表示历史命令列表中的序号 |

    | !! | 重新执行一条命令 |

    | !string | 执行最近运行的以“string”字符开始的历史命令 |

    | 上下箭头 | 遍历历史命令 |


    # shell 内命令 history


    用法：history [选项] [历史命令文件]

    功能：执行/编辑历史命令列表。

    history 的常用选项及说明如表 2-6 所示。


    # 表 2-6 history 的常用选项及说明


    | | | 说明 |

    |---|---|

    | -c | 清空历史列表，删除所有条目 |

    | -d offset | 删除历史命令列表中 offset 位置的历史命令 |

    | -a | 将“新”的历史命令（自当前 bash 会话开始录入的命令）追加到历史文件中 |


