    +   1. Linux 基本结构

    市面上 Linux 的种类非常多，从华为手机到神威、太湖之光用都是 Linux 操作系统，区别却是巨大的。为了为何会有如此不同的系统都是 Linux 呢？首先需要简单一下
    Linux 的基本结构才能回答这个问题。

    一个完善的 Linux 操作系统往往由 4 部分组成，即内核（kernel）、外壳（shell）、实用程序（utility）和应用程序（application），如图
    1-22 所示。内核是 Linux 的心脏，实现操作系统的基本功能，包括管理硬件设备、管理内存、提供硬件接口、处理基本 I/O、文件系统以及内核程序分配和
    CPU 时间；外壳是交互窗口，提供用户与内核之间进行交互的操作；实用程序是工具，是用户用于 Linux 系统日常维护和管理的一切程序，应用程序是给用户执行各种功能的第三方程序，如各种服务器、文档管理器


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_25_0.png)


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_25_1.png)


    > ① 华为手机所用的 EMU 操作系统是一种 Android 操作系统，采用的内核是 Linux 内核，所以从上来说也是 Linux。

    ②“太湖之光”是由中国计算机科学研究中心研发的超级计算机，算力性能数值为 125 FLOPS。2016年6月20日在 LINPACK 性能测试中取得了 93
    FLOPS 的测试结果荣冠天号（LINPACK 成为第 34 位），是世界上最强大的超级计算机，2018年6月8日由美国开发的超级计算机神富取代。神威、太湖之光用的是
    Linux 内核的系统（RaiseOS 2.0.5），主要面临问题和通用需求限制。


    微课 1-4

    选择 Linux 版本'
