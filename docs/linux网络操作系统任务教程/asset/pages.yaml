    | [字符集合] | 匹配字符属于字符集合中的任意一个字符。例如,[a,A,C]表示a、A或C这三个字符中的任意一个 |

    | [^字符集合] | 反匹配：匹配不在字符集合中的任意一个字符。例如,[^a,A,C]表示不属于a、A或C这三个字符的任意一个 |

    | [1-9] | 与字符串序列中从1到9的范围中的任意一个字符匹配。例如,[c-j]匹配c到j之间的小写字母字符中的任意一个；[2-8]表示2到8之间的任意一个数字；[a-z]表示任意的英文字母
    |


    # 3. 锚点


    只选择字符是不够的，还需要指定这些字符在什么位置出现，这就用到锚点（anchor）。在前面的入门时候碰到的b就是一个锚点，正则表达式中的锚点并不是具体的字符或字符串，而是一个位置。常用锚点如表5-16。


    表 5-16 锚点


    | 锚点 | 说明 |

    |---|---|

    | ^ | 匹配开头。例如,[^r]表示匹配行首的r或者p字符中的任意一个；$表示匹配行首的空白字符 |

    | $ | 匹配结尾。例如,[0-9]表示匹配行的任意一个数字；[[:alpha:]]表示匹配行的非字母数字 |

    | \b | 匹配边界。例如,[0-9]表示匹配行内的任意一个数字；[[:alpha:]]表示匹配行的非字母数字 |


    # 4. 限定


    除了限定字符种类，字符的位置，还需要指定字符出现多少次'
