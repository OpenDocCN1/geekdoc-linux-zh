  md: '# 文档简介


    《三十五》职业教育国家规划教材，也是国家精品在线开放

    程《Linux 系统管理》的配套教材。


    本书以 CentOS 7 为基础，采用任务式的编写模式，由浅入深、n序序地介绍 Linux 系统的知识和技能。全书包括 10 个任务：

    获取和部署 Linux、初级、Linux vim、管理文件、初级定义和向

    用户、、系统维护、网络、软件、进程和服务。


    本书还包含微视频、课程标准、教学设计、选用 PPT、案例源码

    及拓扑数字化学习差异化教程，与本书的教材“Linux 系统管理”

    在“智库教育”网站（www.icve.com）上，学习者可以登录网站进行

    在线学习和下载资源，教师可以根据课程构建符合自身教学特色的

    SPOC 课程、“智慧管理”服务。教师也可发布编辑邮件

    154810329@qq.com 获取相关资源。


    本书适合作为高校院校计算机或网络专业的教材，也适合作为

    Linux 系统管理相关人员的入门教程。


