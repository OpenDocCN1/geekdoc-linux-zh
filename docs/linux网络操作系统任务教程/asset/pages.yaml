  md: '8.3 必要知识 | 237


    # **地址有效范围，例如为 global，常见如下：


    +   - global: 表示地址全局有效，默认是这个值

    - link: 地址在本地接口内有效，例子中的 IPv6 地址

    - host: 地址在本地主机内有效，通过回环地址 127.0.0.1 的有效范围一直是 host 标识标志，通常与 local 相同）地址，例子中的第一个本地地址

    - dynamic: 表示地址是通过本地的自动配置建立的，例子中的第一个地址

    - secondary: 如果接口已经有一个地址，又给它设置了同一网段不同的地址，第二个地址就会成为一个（secondary）地址

    - deprecated: 表示这个地址已废弃。也就是说，地址虽然有效，但不能在新建的地址连接


    label 地址标签，例如如 ens33；或者设备名为，如 ens33:


    preferred list 如果移除 preferred 后，地址就会变成废弃（deprecated）状态


    valid list 如果移除，地址将失效，也无法使用


    如果不指定接口后缀，将显示系统中的接口，包括接口，如在后面加上选项，只会显示当前接口，如清单 8-49所示


    清单 8-49


