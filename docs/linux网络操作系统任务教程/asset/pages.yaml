    由于 git 服务器的主机名仅在范围内，并不由公司域名连接服务器的 DNS 服务器解析，因此需要将服务器名写入连接服务器的 PC 的本地主机名解析，在 Linux
    中通过 /etc/hosts 文件，默认如清单 8-22 显示，要在其中加入一行，用将 git.nmbsds.dev 解析为主主机地址 172.18.30.3。


    ```

    127.0.0.1       localhost.localdomain localhost4 localhost4.localdomain4

    :1             localhost.localdomain localhost6 localhost.localdomain6

    172.18.30.3     git01.nmbsds.dev

    ```


    清单 8-2


    > 注意


    当使用名称访问主机时，本地主机名解析的优先级是最高的，也即先用本地解析来解析主机名，如果不成功，则向 DNS 请求。因此，通常将使用的“主机 IP 地址”写入/etc/hosts
    文件，可以加快这些名称的速度（因为节省了访问 DNS 服务器的时间）。


    完成后，尝试通过主机名 ping git 服务器。如果 ping 通，则表示本地主机解析设置完成，PC可以通过 git 服务器的主机名 git.nmbsds.dev
