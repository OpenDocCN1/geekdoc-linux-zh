  md: '# 4.3.3 知识点 3 文件通配


    管理员经常需要对文件进行批量操作，这在文件数较少的情况下可以通过逐个操作来实现，但在目标文件较多的情况下，这种逐个操作就不可行的。好在 bash 中为用户提供了通配符
    (Wildcard) 工具。通配符可以让用户使用特定的字符来描述规则，可以匹配这个规则的所有字符（往往是文件或目录）。bash 中的常用通配符表 4-4 所示。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_100_0.png)


    表 4-4 常见通配符


    | 字符 | 含义 |

    | --- | --- |

    | ? | 匹配任意一个字符 | a?b: a 与 b 之间必须有一个字符，可以是任意字符， aab, abb, acb, a0b |

    | * | 匹配 0 或多个字符 | a*b: a 与 b 之间可以有任意的字符，也可以是 aabcb, abcxyz, a012b, ab-b |

    | [字符列表] | 匹配 list 中的任意一个字符 | a[xyz]: a 与 b 之间只能有一个字符，只能是 x 或 y 或 z如 axb, ayb,
    a-b |

    | [字符列表] | 匹配除列表中的任意字符 | [^0-9]:b: a 与 b 之间只能有一个字符，但不能是数字，如 axb, aab, a-b |

    | [字符-列表2] | 匹配一个连续的范围内的字符 | [0-9]:b: 0 到 9 之间只能有一个字符，如 a0b, a1b, ..., a9b |

    | [字符串列表] | 匹配一个或（更多）字符串 | {abc,xyz,123}: a 与 b 之间只能 abc 或 xyz 或 123 这三个字符之一 |

    | [字符.列表2) | 匹配一个连续的范围内的字符，这两个字符和排序序列中两个字符之间的所有字符 | (0-9):b: 0 到 9 之间只能有一个字符，如
    a0b, a1b, ..., a9b


    接下来，用若干范例来展示和说明通配符的用法。


    例 1：“?” 通配符，匹配任意一个字符，如单表 4-26 所示。


    ```

    $ ls ?.txt

    aax.txt abt.txt 匹配任意一个字符

    不存在 a.txt, b.txt bat.txt 匹配任意两个字符

    $ ls ??.txt

    ```


    注意


    “?” 不能匹配空字符，就是说，它占的位置必须存在字符。


    例 2：“*” 通配符，匹配任意数量字符，包括 0 个字符，如单表 4-27


    所示。


    单表 4-27


    ```

    $ ls *.txt

    aax.txt b.txt bat.txt 匹配任意数量字符

    ```'
