    发布的用于教学的类 Unix 系统 Minix 为蓝本，开发了一套新的内核 80386 操作系统内核，源代码码托管在芬兰最大的 FTP 站点上，这也是 Linux
    的 0.01 版。Linux 的发展到现在已经是非常成熟的操作系统内核，它是一个自由软件（free software），目前在 GNU 通用许可证第 2 版下发布。


    桌面 PC 领域，Linux 内核的操作系统逐渐从移动到服务器的其他领域。截至 2018 年 12 月，世界前 500 强的超级计算机全部使用 Linux
    内核的操作系统。Linux 内核版本（kernel version）目前（2019 年）是 5.x。


