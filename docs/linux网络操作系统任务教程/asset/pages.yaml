  md: '# 7.3 必要知识


    # 7.3.1 知识点1 硬盘、分区和文件系统


    # 1. 块设备文件


    在 Linux 中一切都是文件，关于这一点在任务 4 和任务 5 中都反复强调了，包括设备、设备文件都放在 /dev 级目录中，存储设备当然也不例外。常存存储如硬盘、光驱等一般来说都是块设备（block
    device），以块（block）的方式存储数据，可以随时访问任何块数据。


    可以用 find 命令查找系统中块的设备，如清单 7-30 所示。这些块设备完全允许程序通过标准输入/输出系统用来访问设备的数据。


    # 清单 7-30


    ```

    # find /dev -type b -ls

    71478 0 brw-rw- 1 root      8,18 Nov 24 12:34:52 /dev/sda2

    71477 0 brw-rw- 1 root      8,17 Nov 24 12:34:52 /dev/sdb1

    10606 0 brw-rw- 1 root     11,0 Nov 24 00:05:58 /dev/sr0

    9065 0 brw-rw- 1 root      8,2 Nov 24 00:05:58 /dev/sda1

    11400 0 brw-rw- 1 root      8,21 Nov 24 00:05:58 /dev/sda2

    11397 0 brw-rw- 1 root      8,16 Nov 24 12:34:52 /dev/sdb

    11396 0 brw-rw- 1 root      8,0 Nov 24 00:05:58 /dev/sda

    8880 0 brw-rw- 1 root     259,2 Nov 24 00:05:58 /nvme0n1p2

    11380 0 brw-rw- 1 root     259,1 Nov 24 00:05:58 /nvme0n1p1

    11379 0 brw-rw- 1 root     259,0 Nov 24 00:05:58 /nvme0n1

    ```


    其中一些设备是主设备（硬盘），另外一些是次设备（硬盘上的分区），可以通过 ls 命令更直观看到哪些是主设备（disk, ROM），哪些是从属于主设备的次设备（part），如清单
    7-31 所示。


    # 清单 7-31


    | NAME MAJ:MIN SIZE TYPE MOUNTPOINT |

