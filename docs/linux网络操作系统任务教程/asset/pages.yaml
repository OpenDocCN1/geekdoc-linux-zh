    > 小心


    +   - 在 GPT 的 rm 命令删除 MS-DOS 分区的逻辑操作要特别小心，因为删除

    序号在前面的分区会导致序号在后的所有分区序号的变化，也即分区的设备名称发生

    改变。在硬盘上有3个分区 sdb5、sdb6和sdb7，用 rm 命令删除sdb5后，

    sdb6和sdb7会自动变为sdb5和sdb6。

    - 千万因此引起低级错误，操作数据或者分区。


