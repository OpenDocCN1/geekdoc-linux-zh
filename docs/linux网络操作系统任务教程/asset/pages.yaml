    # 2.3.3 知识点 3 命令 shutdown


    在 CentOS 7 中，systemd 已经接管了电源管理这项内容。也就是说，系统的关闭、重启和休眠都是由 systemd 控制的。当然很多命令仍然可以使用，这些老命令是通过调用
    systemd 相应的功能来实现的，包括我们在任务执行的 shutdown 命令。


    > 注意


    在任务 10 的知识点 4 中将 systemd 系统。


    shutdown 命令仍然是一个功能强大、灵活的工具，它提供了 systemd 基本主机功能外的许多扩展功能，定时关机、取消关机、关机广播等功能，因此 shutdown
    命令仍然是我们机器的首选命令。下面介绍 shutdown 命令的语法，并用若干实例来演示其用法。


    # 命令 shutdown


    用法：shutdown [选项] [时间] [警告信息]

    功能：以一种安全的方式立即执行 shutdown 命令。


    +   - 时间：设置多久后执行 shutdown 命令。时间参数有 hh:mm 和 +m 两种格式。hh:mm 格式在几点后立即执行 shutdown 命令。例如，shutdown
    表示在 10:45 执行 shutdown 命令。+m 表示在 m 分钟后执行 shutdown 命令。比较特殊的用法是用现在表示立即执行 shutdown
    命令。注意的是，这部分参数不能省略。

    - [警告信息]：向广播所有已登录用户信息，这些信息会在当前登录用户的终端中显示。


    shutdown常用选项及说明表 2-11


    | 选项 | 说明 |

    | --- | --- |

    | -c | 取消前一个 shutdown 命令 |

    | -f | 重新启动时不执行跳过磁盘检测 |

    | -h | 关闭系统后所有服务后直接关机 |'
