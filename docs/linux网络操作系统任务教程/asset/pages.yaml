    # ## 4.3.9 知识点 3 打压缩相关命令


    # ### 1. tar 命令


    下面首先介绍 tar 命令的语法格式，然后用 10 个例来进行展示和说明。


    用法：tar [选项] 归档文件列表

    功能：命令最初设计将文件打包到磁带上，现在在我们都用它来实现备份特定分区或目录或者或者文件。使用 tar 命令可以归档多个文件或目录到单个归档文件中，并且归档可以进一步使用
    gzip 或 bzip2 等技术进行压缩。

    tar 命令的常用选项及表 4-21 所示。


    表 4-21 tar 命令的常用选项及说明


    | 选项 | 说明 |

    |---|---|

    | -A | 合并两个归档文件 |

    | -c | 创建一个新的归档文件 |

    | --delete | 从归档文件中删除一个文件 |

    | -r | 向归档文件末尾追加文件 |

    | -t | 列出归档文件中的文件 |

    | -u | 更新归档文件，仅替换归档文件中的文件 |

    | -X | 从归档文件中解压缩 |

    | -C | 指定归档目录 |

    | -f | 指定一个归档文件/设备进行操作 |

    | -Z | 使用 gzip 压缩/解压文件 |

    | -j | 使用 bzip2 压缩/解压文件 |

    | -v | 显示归档的过程 |


    例例 1: 创建一个归档文件。创建一个 myarchive.tar 文件，将/etc 目录和/root/anaconda-cs.cfg 文件包进去，如清单
    4-81 所示。


    ```

    # tar -cvf myarchive.tar /etc /root/anaconda-cs.cfg

    ```


    # # 注意


    +   - 归档文件的扩展名.tar不是必须的，但是一般约定成倍都会加上，以免告诉用户该文件是一个归档文件。

    - -f选项必须紧跟归档文件名。'
