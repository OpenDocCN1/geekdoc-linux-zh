  md: '# 文件 介绍


    | CentOS-7-x86_64-LiveGNOME-xxx.iso | 基于 GNOME/KDE 桌面环境的镜像安装操作系统 |

    | CentOS-7-x86_64-LiveKDE-xxx.iso | |

    | CentOS-7-x86_64-Minimal-xxx.iso | 最小化安装镜像，仅包含系统必要的软件包，大小约 900MB |

    | shasum.txt | 上面所有文件的 sha 哈希，用于在下载后校验镜像完整性 |

    | sha256sum.txt | 上面文件的 sha256 哈希，用于在下载后校验镜像完整性 |


    本任务要下载的是标准安装镜像 CentOS-7-x86_64-DVD-xxx.iso。


    # 2. 校验镜像的完整性


    下载镜像后，需要验证文件的完整性以保证文件未被发布者之外的第三方改动，这时就需要用到 shasum.txt 或 sha256sum.txt 了。


    在 Windows 中可以使用自带的 curl 命令（cmd 或 Power Shell）窗口，在其中运行清单 1-1 所示的命令，下载镜像文件的 sha1
    或 sha256 哈希值。


    # 清单 1-1


    ```

    #-hashfile 指定校验文件哈希，下载文件，SHA1 计算的哈希类型

    >curl -hashfile:shasum.txt CentOS-7-x86_64-DVD-804.iso SHA1

    SHA1 哈希结果为:CentOS-7-x86_64-DVD-804.iso:

    7c b3f 2f 01 a2 f 7e 7c 39 c9 a27 f1 6b 0e 67 c1 73

    #下载镜像成功

    >curl -hashfile:sha256sum.txt CentOS-7-x86_64-DVD-804.iso SHA256

    SHA256 哈希结果为:CentOS-7-x86_64-DVD-804.iso:

    50 6e 42 06 ab 7f 78 43 5b 52 47 55 d13 37 7e 9f 6b c8 65 65 53 d4 12 67 6f 5b
    63 45

    #命令完成成功。

    ```


    计算完成后，与 shasum.txt 以及镜像文件中列出的 sha1/sha256 码进行对比，如果文件计算的 sha1/sha256 码和文本中的 sha1/sha256
    相同，证明文件未被发布者之外的第三方改动，否则就说明此处所显示的文件有很大的安全风险，绝不能进行任何安装。


    +   注意：

    - 由于镜像文件较大，计算 sha1 或 sha256 需要等待一段时间，并非命令未响应。

    - 只需要校验 sha1 或 sha256 其中一个就可以了。

    - 在 Linux 中可以使用 shasum 或 sha256sum 命令计算文件的 sha1/sha256 码。


    下载镜像完成后，将 ISO 镜像刻录到 DVD 光盘或将其制作成能够引导安装的 U 盘，就可以安装 CentOS 了。由于本任务的主机有光驱，因此将其刻录成
    DVD 光盘来进行安装。


    # 1.2.3 任务 3 安装 CentOS


    接下来开始安装 CentOS 7。安装过程相当简单，难在于理解 Linux 的一些相关概念。'
