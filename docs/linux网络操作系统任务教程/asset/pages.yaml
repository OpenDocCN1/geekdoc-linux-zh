  md: '# 10.5 systemctl 管理资源


    systemctl 命令是用户用于维护进程进行交互的界面，也是 systemctl 套件中的命令（还有 journalctl, timedatectl, localctl,
    hostname 等其他一系列命令）。systemctl 是一个功能很多的命令，下面介绍 systemctl 的一些常用功能，并用几个例子来说如何应用这些功能：


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_291_0.png)


    # ## 命令 systemctl


    # ### 10-12 常用命令


    | 操作对象 | 命令 |

    | --- | --- |

    | Unit | list-units [单元] 列出当前加载到内存中的单元<br>- 排除未使用--all 全列出所有单元（直接引用的单元、被依赖关系引用的单元、被应用调度的单元、启动失败的单元），默认只列出的单元、失败的单元和处于运行状态的单元<br>-
    如果给出了单元，则表示命令用于指定特定的单元<br>- 还可以通过 type=unit 选项过滤要指定的单元<br>- 该命令是默认的启动命令<br>- status[PID]:
    显示单元的运行状态信息，以及这些单元最近的日志数据<br>- 如果指定了 PID，则指定 PID 所属单元的运行时状态以及这些单元最近的日志数据<br>-
    如果未指定单元或 PID，显示整个系统的状态信息<br>- start：启动（active）已经指定的单元（无法启动未加载的单元）<br>- stop：停止（inactive）指定的单元<br>-
    reload：要求对指定的单元重新加载它的配置<br>- restart：重启启动（先停止后再次启动）指定的单元，若单元尚未启动，则启动它<br>- kill：向指定的单元的
    kill-how 发送信号信号<br>- is-active：检查指定的单元中，是否处于有效（active）状态的单元<br>- is-failed：检查指定的单元，是否存在对于失败（failed）状态的单元<br>-
    set-property 单元属性=值：在运行时修改单元的属性值。<br>- 并非所有都可以在运行时修改，但大多数资源控制（见 systemd-control）可以实现<br>-
    修改会立即生效，并且不会重启<br>- 如果使用了 --runtime 选项，则修改临时生效，下次重启单元后，将会恢复原有的设置<br>- dependencies：显示单元的依赖关系<br>-
    isolate：启动指定的单元并其依赖的所有单元，同时停止它的其他单元或IgnoreIsolate-no 的单元（见 systemd unit 手册）。<br>-
    如果没有给出单元的类型，默认是 target<br>- 如果单元是 target，则该命令会立即停止在所有目标单元中不需要的单元，其中可能包含当前正在运行的图形界面以及使用的终端
    |


