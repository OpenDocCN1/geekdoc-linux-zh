    # 7.3.5 知识点 5 mount / umount 挂载/卸载文件系统


    In Linux 中，不同分区的文件可以通过目录的挂载点连接，之后再挂载，mount 就是 Linux 用于挂载文件系统的一个命令。在本节中将介绍这两个命令的语法，并若干示例演示其具体方法。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_219_0.png)


    用法：[option] 设备挂载目录

    功能：挂载文件系统。不选选项参数运行 mount 命令显示当前挂的文件系统信息。

    mount 命令的常用选项及其说明如下表 7-18 所示。


    表 7-18 mount 命令的常用选项及其说明


    | 选项 | 描述 |

    | --- | --- |

    | -t 文件系统类型 | 指定挂载分区的文件系统类型。常见的 Linux 支持的文件系统类型有 Ext2, Ext3, Ext4, FAT, ReiserFS,
    XFS, ISO9660 (光盘文件系统), NFS, CIFS, SMBFS (后 3 种为网络文件系统等) |

    | -L | 使用标签 (label) 来指定设备标签 |

    | -l | 列出设备 |

    | -a | 参照配置 /etc/fstab，将所有未挂载的设备都挂载上来 |

    | -o | 指定挂载的参数 |

    | ro, async | 是否允许被 mount -a 自动挂载 |

    | dev, nodev | 是否允许此分区上可创建文件 |

    | suid | 是否允许此分区含有 suid/gid 的文件格式 |

    | exec, noexec | 是否允许此分区有可运行二进制进行限制执行文件 |

    | uouser | 是否允许普通用户挂载此分区 |

    | defaults | 默认值为 swid, dev, exec, uouser 和 async |

    | remount | 重新挂载 |


    表 7-19 mount 挂载选项参数及其说明


    | 参数 | 描述 |

    | --- | --- |

    | ro, rw | 挂载文件系统为只读 (ro) 或可写 (rw) |

    | async, sync | 此系统是否使用同步写入 (sync) 或异步 (async) 的缓存机制，默认认为 async |'
