    tmpfs 1015072 | 1015072 0% /dev/shm

    tmpfs 1015072 10548 | 1004524 2% /run

    tmpfs 1015072 | 1015072 0% /sys/fs/cgroup

    tmpfs 203016 60 209256 1% /root

    /dev/nme0p2 106902460 32944 1068991316 1% /project/bin

    ```


