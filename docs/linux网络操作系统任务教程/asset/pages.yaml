  md: '# 3.3 必要知识


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_78_0.png)


    +   - 正常模式：vim 默认处于正常模式。在正常模式下，可以移动光标、选取、复制、贴接和删除文本，无论处于哪种模式，按Esc 键（有时需要按两次）都会进入正常模式。

    - 插入模式：在正常模式下按 <i>、<I>、<a><a><a> 等键，进入插入模式。在插入模式下只需按 <Esc> 键进入插入模式。在插入模式下，可以输入文本。

    - 命令模式：在正常模式下按 <（冒号）>键，进入命令模式。在命令模式下可以输入一些并执行所有 vim 或特定的命令。这些命令包括设置环境、文件操作、调用某些功能等。

    - 可可视模式：在正常模式下按 <Ctrl+v> 键，进入可视模式。可视模式下可以使用光标选取一个文本区域，并且允许删除、替换等操作。


    # 3.3.2 的寄存器


    vim 的寄存器 (vim register) 有类似于系统的剪贴板，vim 用于复制、删除、撤销等临时数据的存储，但 vim 的寄存器功能要强大多。vim
    具有几类不同的寄存器，分别存储不同的时刻，使用寄存器可以显著提高 vim 的效率。首先要清楚 vim 有哪几类寄存器，各有什么用；将若干例子来说 vim 寄存器的用法。


    根据官方帮助文档，vim 有 9 类寄存器，如表 3-12 所示。这几寄存器名字很特殊，都是用双引号开头的。


    | 序号 | 寄存器类别 | 名称 | 作用 |

    |---|---|---||

    | 1 | 无名 (unnamed) | "" | 缓存最后一次修改、删除操作

    | 2 | 数字 (numbered) | "0"~"9" | 缓存最近操作的内容，复制和删除最近一次修改的内容，“1"~"9" 缓存最近 9 次删除内容
    |'
