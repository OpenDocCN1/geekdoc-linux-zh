    # 注意


    +   - 修改或设置文件访问权限可以使用两种方法，这里使用的是助记的方法，助记分为以下三个部分：

    - 目标标记：a 代表所有用户，u 代表文件所有者，g 代表文件组，o 代表其他用户。

    - 操符标记：+ 代表添加权限，- 代表删除权限，= 代表设置权限。

    - 权限标记：r 代表可读，w 代表可写，x 代表可执行。

    - 如果需要对用户、组或组合设置不同的权限，可以通过逗号分隔不同的，例如 chmod u+r,g=rx,o-rwx hello 表示为文件所有者增加权限，设置文件组权限为可读可执行，删除其之外的所有权限


