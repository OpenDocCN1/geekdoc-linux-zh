    # 笔记


    用法: stat 文件名

    功能: 输出指定文件的索引信息。

    为了共享文件，Linux 系统引入了两种链接：硬链接(hard link)与符号链接(symbolic link)。链接除了共享文件，还可以带来隐藏文件路径、增加访问安全性能及存储节省等好处。硬链接和符号链接确实存在一些相同之处，又有不同的地方。


    # 硬链接


    硬链接(hard link)实质上就是同一个文件拥有的多个入口，如果一个索引节点对应多个文件，则称这些文件为硬链接，见图 4 所示。


