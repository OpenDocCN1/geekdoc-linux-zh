    输出结果有7个字段，这7个字段都代表了文件的一类属性，如图4-1 所示。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_90_0.png)


    | 可读 | 可写 | 可执行 | 可使用 | 安全 | 上下文 |

    | --- | --- | --- | --- | --- | --- |

    | 权限 | | | | | |

    | 所有者 | 所属组 | 其他用户 | SELinux |


    目前关注的就是字段1、字段3和字段4，其中字段3和字段4的意思非常明确，分别代表了文件的所有者（dev0 用户）和所属的用户组（group 用户）。

    对应的字段是字段1，这个字段由11个字符组成，如图4-1 所示。我们目前关注的是9个字符，这9个字符每3个字符为一组，分别表示所有者、文件组从组中、其他用户对文件的访问权限。每组的3个字符分别表示读（r）、写（w）和执行（x）权限，如果相应相应的权限被（-）替代，则表示该用户没有该权限。


