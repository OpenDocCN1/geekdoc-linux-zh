  md: '# 4. 符号链接


    符号链接的原理与硬链接完全不同；符号链接是一个普通文件，只是数据块内容有点特殊，它的内容另外一个文件的路径的。


    可以通过符号链接去写指向的文件，但符号链接和它指向的文件不是同一个文件，符号链接有着自己的 inode 号和用户数据，如图 4-8 所示。


    | 符号链接 | 索引节点 (inode) | 数据块 (data blocks) |

    | --- | --- | --- |

    | 文件名 | 索引节点 (inode) | 数据块 (data blocks) |

    | | 元数据 (metadata) | 用户数据 (user data) |


    图 4-8 符号链接原理


    例 5: 为文件创建符号链接。将当前目录 (/root) 下的 readme.txt 创建一个同名符号链接，并在 stu 用户目录中创建一个 readme_sl
    的符号链接，如清单 4-99。


    清单 4-99


    ```

    # echo "READ ME" >/root/readme.txt

    # 使用 -s选项，表示的是符号链接

