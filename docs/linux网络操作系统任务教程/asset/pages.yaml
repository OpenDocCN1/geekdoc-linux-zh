  md: '# 任务 9 管理软件


    笔记


    # 注意


    rpm 的软件包往往会形成所谓的安装依赖链，也就是要安装软件包 A、A 依赖软件包 B、B 软件包又依赖软件包 C、C 软件包又依赖软件包 D……此类类，rpm
    软件包可能多达上百，手动完成安装几乎是不可能的。


    # (2) 更新新软件


    rpm 命令用 -U 选项来更新，如果要更新的软件软件包不存在，则直接安装它。


    rpm 命令的 -i 选项不是替代 U 选项的，用 -i 选项来覆盖已存在的软件（不同版本的软件包）是不可行的，会提示不同版本的软件包的文件发生冲突。


    如果系统中已经存在了 openssl-libs:1.0.2k-el17.x86_64 这个软件包，将要更新为新的 openssl-libs:1.0.2k-el12，那么按照安装时会提示文件冲突如图
    9-21 所示。


    # 清单 9-21


    ```

    # rpm -Uvh openssl-libs:1.0.2k-el12.x86_64

    准备中...

    ########################################################### [100%]

    file /usr/lib64/libcrypto.so.10:hmac from install of openssl-libs-

    1.0.2k-el17.x86_64 conflicts with file from package openssl-libs-

    1.0.1-de34.el17.x86_64


    file /usr/lib64/openssl/engines/libusec.so from install of openssl-

    1.0.2k-el17.x86_64 conflicts with file from package openssl-

    1.0.1-de34.el17.x86_64

    ```


    # 注意


    更新时要关注软件包的依赖性。例如，将 A-1.00 更新为 A-1.10，但 A-1.00 软件包依赖于 B-1.00 软件包，或者被 B-1.00 软件包所依赖，就需要及时更新
    B-1.00 为 A-1.10 所匹配的版本 B-1.10，否则 rpm 将报冲突。


    如果系统中已经存在了 openssl-libs:1.0.1-de34.el17.x86_64 和 openssl:1.0.1-de34.el17.x86_64
    这两个软件包，其中 openssl 是依赖于 openssl-libs 的，那么单更新 openssl 或者 openssl-libs都会报冲突，如清单 9-22
    所示。


    # 清单 9-23


    ```

    # rpm -Uvh openssl-libs:1.0.2k-el12.x86_64

    错误: 检测依赖失败:

    openssl-libs (x86_64) = 1.0.2k-el17.x86_64 需要

    # rpm openssl-libs -1.0.2k-el12.x86_64 需要

    错误: 检测依赖失败:

    openssl-libs (x86_64) = 1.0.1-de34.el17 (已安装) 被 openssl:1.0.1-de34.el17.x86_64
    需要

    ```


    需要将 openssl 和 openssl-libs 这两个软件并更新，如清单 9-23 所示。


    ```

    # rpm -Uvh openssl-libs:1.0.2k-el12.x86_64

    openssl-libs:1.0.2k-el12.x86_64

    准备中...

    ########################################################### [100%]

    正在安装/...

    1:openssl-libs:1.0.2k-el12 ################################# [25%]

    2:openssl:1.0.2k-el12 ################################# [50%]

    ```'
