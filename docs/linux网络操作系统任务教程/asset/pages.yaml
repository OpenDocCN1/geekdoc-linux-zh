  md: '# 2-10 系统帮助文档分类


    | 序号 | 说明 |

    |---|---|

    | 1 | 可执行程序或普通命令的帮助文档 |

    | 2 | 系统调用，即内核提供的功能调用的帮助文档。例如，要调用的某个函数，不知道要什么头文件 |

    | 3 | C 语言函数调用的帮助文档 |

    | 4 | 特殊文件，也就是/dev下的各种设备文件的帮助文档 |

    | 5 | 一些帮助文档或者配置文件的内部格式的帮助文档，要了了解/etc/passwd中每个段落是什么意思 |

    | 6 | 游戏的帮助文档，基本做不到 |

    | 7 | 其他类型的帮助文档，如 Linux 文件系统、网络协议说明等 |

    | 8 | 系统内核命令的帮助文档，这些命令只能从 root 用户使用，如 fdisk |


    man 命令可以后跟 2-10 之间的 8 个数字中的一个，来表示要查阅的是系统哪部分的帮助文档。若不加数字，man 命令默认从较小的帮助文档中查找相关内容。


    特别说明的是，系统帮助文档的各部分可能会存在同名的命令。例如，行 man 和 man 2 的显示结果可能位于单 2-36 和单 2-37 中。可以看到其中的内容是不同的：单
