    # 注意


    +   - UUID 的全称是 Universally Unique Identifier (全局标识符)，系统为每个设备都是唯一的 UUID，用于可靠标识设备。

    - UUID 是唯一的。不同的 UUID 不会冲突，分区域标识则会遇到系统自动挂时，无法准确确定位置。

    - UUID 是不变的。分区的标识会发生变化，分区域的文件名取决于内核挂载的顺序，如果设备热插拔，设备名称可能发生变化，这会导致系统通过自动挂时，无法正确识别。


