    # 7.2.2 挂载和卸载文件系统


    +   1. 挂载/卸载文件系统


    在“任务 4 系统管理”中提到，Linux 的文件系统都是结构性的，所有的文件系统结合起来形成一个大的目录，任何一个文件系统能够被用户访问，必须通过“挂载”到某个子目录来实现，这个目录就是访问文件系统的入口。操作作为文件系统的“挂载”，目录即为“挂载点”，解除文件系统与目录目录连接的过程为“卸载”。


    例如，根系统的“根”就是根“/”，分区的的文件系统在机上的时候就会被挂载在根上。


    注意


    挂载过程会实际挂载的某个设备（或其他资源）的文件系统，通常带有将将其标记为“挂载设备”。


    接下来将所有在任务 1 中创建的分区，按照要求挂载到相应的挂载上。


    首先挂载的是 /dev/nme0p1 分区。由于 /dev/nme0p1 分区用于交互数据，无需挂载（如果需要卸载，稍后会进行操作），所以将/dev/nme0p1
    挂载到任务要求的目录上即可。


    使用的挂载命令为 mount，选项-t 用于指定特定的文件系统类型（XFS），两个参数分别指定要挂载的（dev/nme0p2）和挂载点（/project/bin）。在挂载之后，用
    df 命令查看系统中所有已挂载的文件系统的情况，挂载 nme0p2 已经存在，如


    清单 7-21


    ```

    # mkdir -p /project/bin

    # mount -t xfs /dev/nme0p2 /project/bin

    # df

