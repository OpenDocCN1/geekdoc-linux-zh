    |---|---|---|---|---|---|


    图 5-7 一切都是写文件


    简单来说，当打开文件时，VFS 会知道该文件对应的文件系统格式；VFS 把控制权传给实际的文件系统时，实际的文件系统再做出此区分，对于不同的文件类型执行不同的操作，如图
    5-8 所示。这就是“一切都是写文件”的根本所在。


    | read() | sys_read() | 具体文件系统的方法 |

    |---|---|--|

    | VFS | 具体文件系统 | 物理设备 |


    图 5-8 VFS 封装了底层的读写操作


    因此，对于一般的用户来说，在 Linux 中没有文件系统如 ext4 或 xfs 了，写一个普通的文件和写一个设备没有任何区别，都是操作一个字符字符串或字节流。输入输出设备同样例外，当执行一个命令时，shell
    会自动的将其打开并建立 3 种标准输入输出:


    +   - 标准输出 (stdout)，显示命令的输出，文件描述是 1。

    - 标准错误输出 (stderr)，显示命令的错误输出，文件描述是 2。

    - 标准输入 (stdin)，向命令提供输入，文件描述是 0。


    # 5.3.2 知识点 2 常用的过滤器


    本节重点讲解几个在前面要中用的命令，这些命令都是过滤器 (filters) 命令。这几个命令之所以称为“简单”，是相对于知识点 3 介绍的 grep 这个功能强大、用复杂的过滤器命令来实现的。


