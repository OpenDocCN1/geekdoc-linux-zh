    # 表 9–4 rpm 命令的常用选项及其其说明


    | 选项 | 说明 |

    | --- | --- |

    | -i<安装包名> | 安装软件 |

    | -U<安装包名> | 更新软件 |

    | -v | 显示安装详细信息（与-i 或 -U 使用） |

    | -h | 安装输出 (#) 作为进度条（与-iv 或-Uv 使用） |

    | -q<软件包名> | 查询软件包 |

    | -a | 列出所有已软件包（与-q 使用） |

    | -l<软件包名> | 列出软件包内包含的所有文件（与-q 使用） |

    | -t<软件包名> | 列出软件包的详细信息（与-q 使用） |

    | -f<软件包名> | 查询包含某文件的软件包名（与-q 使用） |

    | -p<安装包名> | 列出安装后软件包名（与-q 使用） |

    | -R<软件包名> | 列出软件包所依赖的其他软件包（与-q 使用） |

    | -e<软件包名> | 卸载软件包 |

    | --replacepkg | 无论软件包是否被安装，强制安装 |

    | --test | 安装测试，并不实际安装 |

    | --nodeps | 忽略软件包的依赖关系强制安装 |

    | -K<软件包名> | 检查软件包的 PGP 签名以其完整性和原真性 |

    | --import <PGP 签名名> | 导入 PGP 签名


    # (1) 安装软件


    rpm 命令使用选项来安装软件包，-i 选项尝试某些未安装的软件包，和 -v（显示详细信息）和 -h（显示速度）选项选择软件包，请见清单 9–18 所示。


    # 清单 9–18


    ```

    # rpm -i finger-0.17-63.fc29.x86_64.rpm

    ```


    如果使用 rpm 命令安装的软件包依赖某些未安装的软件包，将输出错误信息，并且且指出哪些未安装的软件包，请见清单 9–19 所示。


    # 清单 9–19


    ```

    # rpm -ivh /gnuplot-4.6.2-3.el7.x86_64.rpm

    错误:gnuplot-common=4.6.2-3.el7 被 gnuplot-4.6.2-3.el7.x86_64 需要

    ```


    rpm 命令知道 gnuplot 这个软件包有一个依赖 gnuplot-common。如果要正确安装gnuplot，则需要获取 gnuplot-common，然后尝试安装时它看到是否有其他依赖（因为
    gnuplot-common 可能还会依赖于别的包），重复这个过程，直到满足所有依赖关系为止。然而，gnuplot 并不依赖于其他未安装的软件包，由于安装成功了，请见清单
    9–20 所示。


    # 清单 9–20


    ```

    # rpm -ivh /gnuplot-4.6.2-3.el7.x86_64.rpm ./

    gnuplot-common-4.6.2-3.el7.x86_64.rpm

    ########################################### [100%]

    正在安装/...................................

    1:gnuplot-common-4.6.2-3.el7 ########################### [50%]

    2:gnuplot-4.6.2-3.el7 ########################### [100%]

    ```'
