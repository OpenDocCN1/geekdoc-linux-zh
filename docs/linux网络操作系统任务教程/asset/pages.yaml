    # 注意


    +   - 自动化处理或后台作业通常将标准输出和标准错误重定向到同一个文件中，以便在以后后查看。

    - 可以使用 & 或 & >> 将标准输出和标准错误重定向到同一个位置。


    方法二如清单 5-5 所示，将标准错误重定向到标准输出中，然后将标准输出重定向到当前工作目录下的 list.txt 文件中。


    # 清单 5-5


    ```

    $ ls -log* xfer* 2>&1 list.txt

    ```


    # 注意


    +   - 方法其实是通过文件描述符 n 进行重定向，然后使用 m>&n 或 m>> 将文件描述符 m 重定向到同一个位置，& 表示已经存在的文件描述符，1
    表示标准输出，2 表示错误输出。

    - 对输出重定向的顺序非常重要。例如，ls -l>&output.txt 和 ls -l>output.txt 是一样的，在同一个命令中，标准输出会在错误输出之后进行重定向，所以错误输出仍然会输出到终端。


