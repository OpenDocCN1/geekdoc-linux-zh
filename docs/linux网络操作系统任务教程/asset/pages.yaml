    # 5.3.3 知识点 3 正则表达式处理 grep


    grep 是 Linux 的一种功能强大、完善、也是最常用的文本工具。grep 是英文 global regular expression and print
    out 的缩写，grep 的意思是“全局搜索正则表达式并打印”。


    grep 的主要功能是进行字符串模式的比较，然后匹配用户需要的字符串并打印出来。但是注意，grep 在数据中查找一个字符时，是以“行”为单位进行数据筛选的。在一个或多个输入中执行“模式（pattern）”，搜索的结果会被推送到屏幕，不影响源文件内容。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_162_0.png)


    ```

    命令 grep

    ```


    使用：grep [选项] 正则表达式 [文件]

    功能：grep 在一个或多个文件中匹配指定的字符串模式，模式默认就是一个正则表达式（regular expression）。匹配的输出将输出到标准输出，不影响源文件内容。

    grep 命令的选项如下表 5-14 所示。


    表 5-14 grep 命令的选项及其说明


    | 选项 | 说明 |

    | --- | --- |

    | -E | grep 等同于 eg 命令，利用此命令可以使用扩展的正则表达式来进行文本搜索 |

    | -F | grep 等同于 fix 命令，利用匹配的字符串来对文本搜索，但不支持正表达式的用法 |

    | -i | 忽略大小写搜索 |

    | -n | 输出行号 |

    | -v | 显示未匹配到模式的本身，而非行 |

    | -o | 显示匹配的显示，未匹配的显示，未匹配的显示 |

    | -w | 按照单词进行匹配 |

    | -A n | 显示匹配到的后 n 行 |

    | -Bn | 显示匹配的前 n 行 |

    | -Cn | 显示匹配的前后 n 行 |

    | --color=auto | 高亮，匹配的关键字显示颜色 |


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_162_1.png)


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_162_2.png)


    事实上，grep 命令本身的语法虽然简单，要好用 grep，重点并不在于命令本身，而在于理解并写好正则表达式。那么，什么是正则表达式呢？对于 Linux 系统管理员或网络管理员，经常会有查找某些规则的字符串的需求，所以正则表达式就是用来描述这些规则的。调试时，正则表达式就是记录这些规则的代码。


    # 注意


    +   * 这可能会联结在任务 4 中使用的文件配符（wildcard），也就是 *? 和[]。

    切记，虽然配符是用来匹配文本的，但正则表达式与通配符是完全两种不同的东西。'
