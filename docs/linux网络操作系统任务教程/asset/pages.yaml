    Linux 中版本的 vim 有本地(huge)、大型(big)、正常(normal)、小型(small)和微型(tiny)之，不同的版本拥有不同的功能。可然而知，巨型版的功能完全全占用空间空间，而微型版的功能最少，占用空间最小。输入如下清单
