    # 5.3 学习知识


    # 5.1 什么是 VFS 和 I/O


    在任务任务 4 管理文件的任务 1 中提到过 Linux 中“一切文件”，这只是一种说法，“一切文件”是 UNIX（也是 Linux）的基本哲学之一。


    确切来说，Linux 提供了一种特殊的机制，称为虚拟文件系统（VFS），如图 5-7 所示，使得不同的文件系统（file system）中，普通文件、目录、各种输入设备、符号链接、管道、套接层的底层
    I/O 细节被掩盖了，最终被当作了我们理解的“字符串”（character stream）或“字节流”（byte stream），也就是一种字符串或字符序列，可以用相同的方式进行读（I/O）操作。


