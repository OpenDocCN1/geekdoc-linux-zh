    # 9.3.3 yum 软件包仓库和repo文件


    首先要清楚的是，yum 是一个“服务器-客户端”结构的软件，即通过配置，nyum 命令（客户端）到指定的 yum 仓库（服务器端）上获取软件包。因此，yum

    软件仓库就是一个服务器，它提供两种服务：一个是软件依赖关系的分析；二是下载软件包。yum 命令（客户端）如果需要安装某个软件包时，首先卸载 yum 仓库中的

    依赖性关系，通过对数据分析得知哪些是依赖的软件包，一次性下载来安装。'
