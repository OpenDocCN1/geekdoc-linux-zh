    5-17。


    # ### 表 5-17 限定符


    | 限定符 | 描述 |

    | --- | --- |

    | * | 匹配一个元素零次或多次。例如，*匹配一个任意长度的字符串或空字符串；[0-9]*匹配一个任意数字字符的字符串或空字符串 |

    | + | 匹配一个元素一次或多次。例如，[a-z]+表示一个以b字母开头至少少一个小写字母的字符串 |

    | ? | 匹配一个元素零次或一次。例如，n?表示匹配ran或 ran\n?匹配一个元素至少好n。例如，[0-9]{13}表示一个长度为13的数字 |

    | {n} | 匹配一个元素至少n次。例如，[A-Z]{5}表示一个至少为5的英文字符 |

    | {n,m} | 匹配一个元素至少n次，但不m次。例如，[0-9]{3,5}表示一个长度在3到5之间的数字 |


    # ### 5. 分组构造


    之前已经提到用限定符指定特定字符的次数，如果想要指定一个字符的出现次数，就可以将这个字符放入小括号内，来构建一个“分组构造(grouping constructs)”，来说。分组可以作为一个整体和整体限定符来使用它的出现次数。分组构造如表5-18所示。


    # ### 表 5-18 分组构造


