    # 符号链接和文件是不同的，注意它的索引节点符号

    # ls -il /root/readme.txt /tmp/readme.txt ~stu/readme_sl ->

    33714441 l lwxrxr-x 1 root root 16 6 12 22:44 /home/stu/readme_sl -> /root/readme.txt

    33714440 -rw-r--r-- 1 root root 15 5 12 22:25 /root/readme.txt

    31459846 lwxrxr-x 1 root root 16 6 12 21:44 /tmp/readme.txt -> /root/readme.txt

    ```


    > 注意


    在Linux系统中，符号链接的第一个字符是 l，指明是一个符号链接文件。符号链接文件名并不特殊，不仅包括文件名，还包括了一个“>”箭头，指向符号链接的目标文件，同时链接的颜色与普通文件不同，在
