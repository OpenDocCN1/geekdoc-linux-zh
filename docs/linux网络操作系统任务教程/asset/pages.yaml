    # 5. 网络和主机名配置


    单击“网络和主机名”图标即可进入网络配置界面，如图 1-6 所示。安装程序启动后探测可本地连接的接口，在检测到的接口在左侧框中，在右侧列表中的接口显示说明。激活或取消网络接口，请将界面右上角的开关“打开”或“关闭”按钮连接网络接口。


    在默认情况下，网络中有 DHCP（动态主机配置）服务，无需配置连接参数。如果要手动网络连接，可以单击该右下角的“配置”按钮，此时会弹出一个对话框供用户所选连接。由于局域网中有
