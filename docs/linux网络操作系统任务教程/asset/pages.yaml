  md: '# 1.2 任务实施


    在这里选择是否在这个系统中中使用 KDUMP。KDUMP 是内核崩溃转储机制，

    当前基本不会用到这个功能，若启用 KDUMP 会占一定数量的内存，所以取消中

    “启用 kdump”复选框，禁用 KDUMP，KDUMP 设置界面如图 1-11 所示。


    > 注意


    所谓内核崩溃转储机制，简单来说就是当系统内核出现错误的时候，将当时的内核信息

    写到硬盘镜像文件中，开发者可以研究内核崩溃的原因。作为普通的系统管理员，不需要

    去分析内核。


