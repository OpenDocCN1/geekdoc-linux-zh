    chmod 后跟了一个参数 dev1:dev1，其中冒号前面的表示文件所有者对于 dev1，冒号后面的表示文件组为 dev1(dev1 用户私有的)。修改完成后，dev1
    就对 project_z 目录有了完全的访问权限（可读可写可执行）。接着修改文件的访问权限，让从组用户和其他用户没有权限，使用 chmod 命令来实现，如清单
    4-7 所示


