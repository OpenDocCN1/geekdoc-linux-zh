    # 6.2 任务实施


    # 6.2.1 子任务 1 切换用户


    首先必须切换到 root，才能接下来的子任务 2。原因很简单，当前登录的用户是一个普通用户，而普通用户是没有任何创建新用户的权限的，在一般情况下，只有系统管理员，也就是
    root 用户有权创建用户。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_170_0.png)


    Linux 的用户（user）是分色的，角色不同，其权限和所能完成的任务不同。一般来说，Linux 中有几类用户：


    +   * root 用户，也叫管理员用户。在系统中的普通用户的名字是固定的，root 用户只有一个，它对整个系统中的所有文件都拥有全部的控制权限。

    * 普通用户。登录系统后，在默认情况下，新建的普通用户都从一个用户的用户同名目录开始创建，每个用户都有自己的目录，对自己目录中的文件拥有全部的控制权限，对系统没有权限。

    * 级用户，也作超级用户。这类用户没有登录系统的权限，主要是方便系统管理，满足对系统某些进程具有 root 属性的要求，例如 bin、daemon、adm、ftp
    mail、nbody 等。例如，内核运行时的身份就是 root 用户，匿名登录 ftp 时，使用的就是 root 用户。


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_170_1.png)


    +   * 系统可以以普通用户登录，在需要的时候再切换为 root 或者某个用户进行操作，避免权限风险。


    这次的解决办法有两个：一是通过 su 命令为 root 用户执行任务，任务完成后再切换回 root；二是通过 su 命令新建用户权限并给指定的普通用户，再进行操作。在本任务中使用第一种方法来完成这个新建用户，如清单
    6-1 所示。


    # 清单 6-1


    +   * 当当前用户是 su 时


    ```

    $ adduser su

    bash: su:/sbin/adduser # 权限不足

    $ su - root

    #在此处输入 root 的密码，密码是不会回显的

    ```


    ![](img/a95c6704e7d3618800a5dd1f2c0aafd0_170_2.png)


    +   * su 命令的方便，但使用 su 的前提是需要知道 root 用户的密码。在多人参与的系统中，这是一个极大的安全隐患，因为没有保证所有的管理员都能正常操作程序管理系统，其中任何一个失误都可能导致不可回的结果，同时不利于操作的追溯。因此，su
    适用于两人管理的小型系统。在这种情况下，一般会使用/etc/sudo 文件切换 root 的权限让给指定的普通用户，然后以普通用户身份使用 su 命令进行操作。

    关于 su 和 sudo 命令在知识点 1 和 4 中详细介绍。'
