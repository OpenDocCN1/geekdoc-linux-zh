    # 3. /etc/shadow


    /etc/shadow 文件是 /etc/passwd 的影子文件，这两个文件是互补的。shadow 内容包括用户被加密的密码、账户、密码的有效期等较为敏感的用户信息。这个文件访问权限限制非常严格，如果不使用用户身份查看这个文件，应该也会看到不到，提示权限不足，如清单
    6-31 所示。


