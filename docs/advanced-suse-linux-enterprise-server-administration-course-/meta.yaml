  md: '# APPENDIX A


    NOVELL CLP AND LPI REQUIREMENTS


    This appendix provides information about the LPI Level I objectives covered in
    this and the other Novell CLP certification courses (see Table A-1).


    LPI objectives named **1.xxx.y** are part of exams 101 and 102 (LPI Certification
    Level 1). LPI objectives named **2.xxx.y** are part of exams 201 and 202 (LPI
    Certification Level 2). CLP courses include the section number as well as the
    exam (such as **3037/3** for Course 3037 Section 3).


    Because the Novell CLP courses use SUSE Linux exclusively, there are some differences
    in the software used in those courses and those covered by the LPI objectives
    (such as CUPS for printing in SLES 9 and lpr in the LPI objectives).'
