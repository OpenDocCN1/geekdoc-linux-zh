  md: '# INTRODUCTION


    The Linux shell can control the system with commands and perform file operations
    or start applications. You can also create a file that includes several shell
    commands and start this file like an application.


    This type of file is called a **shell script**. The following are several reasons
    why you need to understand and create shell scripts:


    +   - You can automate several daily tasks with shell scripts. In many cases this
    increases speed and convenience in everyday work.

    - The boot procedure and many other system functions are controlled by shell scripts.
    To understand and manipulate the system behavior, you need a basic understanding
    of shell programming.

    - Shell programming is relatively easy to learn compared to other programming
    languages.

    - A shell script runs on almost every UNIX-like operating system and does not
    need to be adapted to other platforms.


    There are also some disadvantages to using shell scripts:


    +   - Shell scripts are rather slow compared with other scripting languages.

    - Shell scripts can use a lot of CPU power.


    However, in most cases these disadvantages are not significant.


    As you might have noticed, a Linux system offers different shell types. Shell
    scripts that are developed for one shell can sometimes be executed with a different
    shell, but this cannot be guaranteed.


    For this reason, this section focuses on the Bash shell, which is the default
    shell in SLES 9. As with all programing languages, shell scripting is learned
    best by actually writing code. The exercises in this section include a description
    of a script that needs to be written. At the end of the section are the solutions
    to the exercises. We recommend attempting to create the script, and then comparing
    your script to the solution to understand the scripting concepts covered.


    You can find all these scripts on the **3038 Course DVD** in the directory **/exercises/section_6**.
    By using these scripts as a template, you can customize them to meet the needs
    of your production environment.


    Although shell programing can be difficult at first, it becomes easier as you
    use the shell scripting language to automate tasks on your own system.'
  merge: -1
  pgno: 279
- img_proc: false
  md: '# Objective 1 Use Basic Script Elements


    The shell programming language is a powerful and complete programing language.
    Before you can start to create scripts, you need to become familiar with basic
    scripting techniques and elements.


    In this objective, you learn the following about the basics of the shell programming
    language and simple shell scripts:


    +   - Flow Charts for Scripts

    - The Basic Rules of Shell Scripting

    - How to Develop Scripts That Read User Input

    - How to Perform Basic Script Operations with Variables

    - How to Use Command Substitution

    - How to Use Arithmetic Operations


    # Flow Charts for Scripts


    Programming elements of a script are often visualized by using program flow charts.
    Illustrating a program through a flow chart provides the following benefits:


    +   - They force the author to lay down the steps the script should perform to
    achieve the desired goal, making it clearer which constructs need to be used.

    - They provide a clear symbolic outline of the algorithm, which can be used as
    a guide during the programming process.'
  merge: -1
