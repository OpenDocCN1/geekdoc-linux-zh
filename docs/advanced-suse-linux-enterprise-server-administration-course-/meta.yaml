  md: "Before the code can be executed, it needs to be converted into a binary format\
    \ that can be directly executed by the CPU. This conversion is done by a special\
    \ program called the **compiler**.\n\nExamples of compiler languages include C,\
    \ C++, and Fortran.\n\nTable 7-1 shows the advantages and disadvantages of each\
    \ programming language type.\n\n**Table 7-1**\n\n| Language Type | Advantages\
    \ | Disadvantages |\n|---|---|---|\n| Script language | • Most script languages\
    \ are relatively easy to learn.<br>• The development process in a script language\
    \ is rather fast.<br>• Script programs can basically run on all platforms where\
