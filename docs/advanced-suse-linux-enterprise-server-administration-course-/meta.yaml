  md: '# Glossary


    **opensslgensa command** — Used to generate public/private key pairs.


    **packet** — A unit of information sent on a network using IP.


    **physical memory** — The RAM that is installed on the system.


    **ping command** — Used to test network connectivity using ICMP.


    **Pluggable Authentication Modules (PAM)** — A set of components that allow programs
    to access user account information.


    **PoinTeR (PTR)** — A DNS record that identifies the FQDN associated with an IP
    address for reverse resolution.


    **preprocessor directive** — The first line in a C program that identifies the
    header file used before compilation.


    **primary partition** — A main division of a hard disk. There are four available
    primary partitions.


    **private key** — A string of data that is typically used to decrypt data that
    was encrypted using the public key.


    **public key** — A string of data that is typically used to encrypt data.


    **read command** — Takes input from a user during shell script execution and stores
    it in a variable.


    **Read-ahead** — A system feature that reads more data from a disk than required
    to speed up future read requests.


    **recode command** — Used to convert a text file to another Unicode format.


    **Red Hat Package Manager (RPM)** — The format of most software packages in SLES.
    RPM packages are pre-compiled for use on the system.


    **Redundant Array of Inexpensive Disks (RAID)** — A hard disk implementation that
    spreads data over several disks for improved performance or fault tolerance.


    **Relative Distinguished Name (RDN)** — The simple name of an object in LDAP.


    **Rescue System** — A small Linux system that is loaded into memory when booting
    from the SLES DVD and which may be used to repair a Linux system.


    **resolver** — A host that requests name resolution using DNS.


    **reverse resolution** — A name resolution request that desires the FQDN for a
    particular IP address.


    **Rivest Shamir Adleman (RSA)** — A common asymmetric encryption algorithm.


    **rmmod command** — Removes a module from the Linux kernel.


    **route** — A line in the routing table that lists the path a packet must take
    to arrive at a destination network or host.


    **router** — A device that is used to relay IP packets from one IP network to
    another.


    **routing table** — A table that is stored on each host that contains a list of
    local and remote networks and routers.


    **rsync (remote synchronization) command** — Used to copy files and directories
    to a different location on the local computer or to a remote computer across a
    network.


    **Samba** — A set of services in Linux that provides the SMB and CIFS protocols
    for file and printer sharing with Windows computers.


    **sax2 command** — Configures X settings in SLES.


    **schema** — The list of objects and object properties for an LDAP database.


    **script language** — A programming language whereby instructions are stored in
    a text file that is executed by an interpreter program.


    **script module** — See **shell function**.


    **Secure HyperText Transfer Protocol (HTTPS)** — The protocol used to obtain HTML
    Web pages and other Web content from a Web server using SSL encryption.'
  merge: -1
