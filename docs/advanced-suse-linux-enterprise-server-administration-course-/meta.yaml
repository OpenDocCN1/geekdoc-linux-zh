  md: "A while loop is terminated when the exit status becomes nonzero (when the condition\
    \ is not true), but an until loop is operative as long as the status is nonzero.\n\
    \n# Exercise 6-9 Use the while and until Commands\n\nDo the following:\n\n+  \
    \ 1. Create a script that performs a simple while loop 100 times. In every iteration,\
    \ the number of the current iteration should be printed to screen.\n2. Write a\
    \ second script which uses until instead of while.\n3. Compare your solution with\
    \ the scripts at the end of the section.\n\nThese scripts are also available as\
    \ **counter1.sh** and **counter2.sh** in the directory /exercises/section_6 on\
    \ your 3038 Course DVD.\n\n# Process Lists with the for Loop\n\nThe purpose of\
    \ a for loop is to process a list of elements. It has the following syntax:\n\n\
    ```\nfor variable in element1 element2 element3\ndo\n  commands\ndone\n```\n\n\
    A for loop executes the given commands once for every element on the list, and\
    \ the value of the variable matches one list element with each loop iteration.\
    \ The list itself is often created through command substitution.\n\nIf the for\
    \ command is not accompanied by a list of elements, the loop will be executed\
    \ with the contents of the variables $1, $2, $3, and so on. These elements represent\
    \ the command-line parameters that are passed to the script.\n\nAs with similar\
    \ constructs, a command separator must immediately precede the do and done parts\
    \ of the for loop. This means that a for loop can be entered in two different\
    \ ways:\n\n```\nfor i in 1 2 3 4 5 6 7 8\ndo\n  ping -c1 DA$i\ndone\n```\n\nIn\
    \ the example above, the command separator is a line break and the loop is started\
    \ only after entering the final done.\n\nYou could use a semicolon as a separator\
    \ instead. In this case, the same loop looks like the following:\n\n```\nfor i\
    \ in 1 2 3 4 5 6 7 8; do ping -c1 DA$i; done\n```"
