    # Read Options with getopts


    With the shell built-in command getopts, you can extract the options supplied
    to a script on the command line. The shell interprets command-line arguments as
    command options only if they are prefixed with a - (the default when using the
    shell interactively).


    This makes it possible to place options in different positions on the command
    line and to supply them in an arbitrary order.


    This means that the following command:


    ```

    cp -dpR *.txt texts/

    ```


    achieves the same thing as the command


    ```

    cp -R *.txt -d texts/ -p

    ```


    getopts recognizes options in the same way. The following is the getopts syntax:


    ```

    getopts optionstring variable

    ```


    The *optionstring* describes all options to be recognized. For instance, getopts
    abc declares a, b, and c as the options to be processed.


    If a parameter is expected for the option (such as -m maxvalue), the corresponding
    option must be followed by a : in the string (as in getopts m:).'
