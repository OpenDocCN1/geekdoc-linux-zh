  md: '■ **Upgrade to a faster network type.** If other measures do not lead to improved
    performance, upgrading to a faster network technology (such as Gigabit Ethernet)
    might help.


    However, you must make sure that the other components of your system (such as
    the chipset) can handle this speed.


    # CHAPTER SUMMARY


    +   - Regular monitoring of your SLES system is key to identifying bottlenecks
    and solving performance problems.

    - Monitoring the system load and CPU utilization will identify whether your CPU
    is able to handle the processes currently running on it. You can measure these
    parameters using the **top**, **uptime**, **mpstat** and KDE System Guard utilities.

    - Processes that use more physical memory than they need (called a memory leak)
    lead to reduced performance. Swap memory will be used extensively if there is
    not enough physical memory in your system, and will result in poor system performance.
    You can monitor physical and swap memory using the **free**, **vmstat** and KDE
    System Guard utilities.

    - The disk subsystem may be a bottleneck in some systems if it unable to service
    system read and write requests in a timely manner. You can use the **vmstat**,
    **hdparm**, and **iostat** utilities to identify these bottlenecks.

    - Malfunctioning, slow, or misconfigured network interfaces can also cause performance
    bottlenecks. The Traffic-vis, **ip**, and KDE System Guard utilities may be used
    to monitor the network interfaces in your system.

    - DNS, Proxy, and NFS servers on your network can indirectly lead to reduced network
    performance on your SLES system.

    - Restarting CPU-intensive processes, running SLES without X, reducing the number
    of running daemon processes, obtaining software updates, using multiple swap partitions
    across different hard disks, upgrading the CPU, increasing the swap, and upgrading
    the system memory are common solutions to most CPU or memory-related performance
    problems.

    - Many disk-related performance problems can be solved by changing a kernel parameter
    in the /sys or /proc directories. These parameters include the quantum parameter
    for the I/O Scheduler, the Read-ahead parameter for the system queue, and the
    swappiness parameter for the system swap.

    - You can also disable atime updates for mounted file systems, configure ext3
    writeback journaling mode, mount ReiserFS file systems using the notail option,
    or use the **hdparm** command to enable DMA for IDE hard disks to improve disk
    performance in certain situations.'
