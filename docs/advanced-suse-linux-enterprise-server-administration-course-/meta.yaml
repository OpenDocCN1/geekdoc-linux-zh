    The name \"hotplug\" is a bit misleading, because the hotplug system sets up different\
    \ kinds of devices, not only those that are really hot pluggable, like USB or\
    \ Firewire devices.\nEvery action hotplug performs must be triggered by a hotplug\
    \ event. Hotplug events can be created in the following ways:\n\n+   - **By the\
    \ Linux kernel.** The Linux kernel triggers a hotplug event when a connection\
    \ to a device is established, or when a driver is already loaded for a connected\
    \ device.\n\n  For example, when you plug in a USB device or insert a hotplug\
    \ PCI adapter a hotplug event is triggered.\n- **By Coldplug.** Coldplug is a\
    \ script that starts at boot time. It scans the system and creates a hotplug event\
    \ for every device it finds.\n\n  This way, the hotplug system is used for devices\
    \ other than hot pluggable devices.\n\nA hotplug event is basically a call of\
    \ the script /sbin/hotplug. The kernel is configured to call this script by an\
    \ entry in /proc/sys/kernel/hotplug.\nEvery hotplug event has an event type. The\
    \ event type is determined by a single parameter that is passed to the hotplug\
    \ script and some additional environment variables that can be read by the hotplug\
    \ script.\nThe command-line parameters determines the subsystem that has issued\
    \ the event in the kernel.\nThe following is a list of some possible parameters\
    \ and the corresponding subsystems:\n\n+   - **ieee1394.** This is used by the\
    \ Firewire subsystem of the kernel.\n- **usb.** This is used by the USB subsystem."
