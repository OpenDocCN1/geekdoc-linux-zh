  md: '# Section 1 Install SLES 9


    > SLES 9 supports only LVM version 2. For this reason, references to LVM in this
    section always refer to LVM version 2.


    Using LVM you can create logical volumes, which spread over several physical disks
    and partitions. Do not confuse logical volumes with physical, logical partitions
    in the extended partition of a hard disk.


    You can use a logical volume like a physical partition. You can create a file
    system on the volume and mount it at a mount point of your choice.


    > You can also use the YaST Expert Partitioner to create logical volumes after
    installation. There are also command-line tools for managing logical volumes.
    We do not recommend that you use LVM for the root partition of a system.


    You need to understand the following terms connected with logical volumes:


    +   - **Logical volume group.** A logical volume group is a group of physical
    partitions. The physical partitions can be spread over different hard disks.

    - **Logical volume.** A logical volume is a part of a logical volume group. A
    logical volume can be formatted and mounted like a physical partition.


    You can think of logical volume groups as logical hard disks and logical volumes
    as partitions on those logical hard disks.


    Before you can create a logical volume, you always need a logical volume group.'
