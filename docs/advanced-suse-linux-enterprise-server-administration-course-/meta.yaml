  md: '# SECTION 10


    # PREPARE FOR THE NOVELL CLP PRACTICUM


    +   In this section, you work through the following scenarios to help you to prepare
    for the Novell CLP (Certified Linux Professional) practicum exam:

    - Install and Configure SLES 9

    - Configure a DNS Server

    - Configue a Web Server

    - Configure a Samba File Server


    You must complete Scenario 1. You can then select any of the remaining scenarios
    to complete, depending on available time.

    Remember that skills from all three Novell CLP courses might be necessary to fulfill
    the required tasks.'
  merge: -1
