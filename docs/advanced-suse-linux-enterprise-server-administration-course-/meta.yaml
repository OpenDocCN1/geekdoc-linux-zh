  md: "Using \"@\" instead of the domain name causes the file /etc/named.conf to be\
    \ read to see for which domain this file is responsible.\n\nIn this case, it is\
    \ localhost which is also used for the name of the DNS server (this is why \"\
    @\" appears many times in the file).\n\n**The File /var/lib/named/master/127.0.0.zone**\
    \ In this file, the abbreviation \"@\" is also used. But here the computer name\
    \ must be given explicitly with localhost (remember the dot at the end):\n\n```\n\
    $TTL 1W\n@           IN SOA     localhost.    root.localhost. (\n            \
    \        42        ; serial (d. adams)\n                    2D        ; refresh\n\
    \                    4H        ; retry\n                    6W        ; expiry\n\
    \                    1W )      ; minimum\n\n                IN NS      localhost.\n\
    1               IN PTR     localhost.\n```\n\n# Create Additional Resource Records\n\
    \nApart from the resource records already discussed (SOA, NS, A, PTR), there are\
    \ MX and CNAME resource records, which are used to do the following:\n\n+   -\
    \ Define Mail Servers for the Domain\n- Assign Aliases for Computers\n\n**Define\
    \ Mail Servers for the Domain** To be able to use e-mail addresses in the form\
    \ geeko@digitalairlines.com, the e-mail server responsible for the domain must\
    \ be defined (the e-mail cannot be sent directly to the domain, but must be sent\
    \ to a mail server).\n\nTo achieve this, an MX (Mail Exchange) entry must be made\
    \ in the database file for forward resolution, after the DNS server entry:\n\n\
    ```\ndigitalairlines.com.    IN MX   0 mail\n                        IN MX  10\
    \ da1\n                        IN MX  10 da5\n```\n\nIf an e-mail is now sent\
    \ to the address geeko@digitalairlines.com, the computer sending the mail asks\
    \ the DNS server which computer is the mail server, and is sent the list of the\
    \ MX entries in return.\n\nSeveral mail servers can be given. On the basis of\
    \ their priorities, it is then decided to which computer the e-mail is sent. The\
    \ priority of mail servers is defined by the number in front of the computer name;\
    \ the lower this number, the higher the priority."
