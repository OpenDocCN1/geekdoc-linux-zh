  md: '# CHAPTER SUMMARY


    +   - A SLES installation is typically started by booting from CD or DVD installation
    media and selecting installation options. To help remedy installation problems,
    you can choose the **Installation – ACPI Disabled** or **Installation – Safe Settings**
    installation option.

    - Once the installation program has loaded into computer memory, YaST prompts
    you for installation settings. These include the system language, installation
    type, partition and file system configuration, software package selection, and
    boot loader configuration.

    - You must create a swap and root partition at minimum during a SLES installation.
    The size of these partitions depends on the packages selected for installation
    and computer role.

    - The YaST Expert Partitioner allows you to create RAID, LVM, and EVMS partitions
    in addition to simple Linux partitions. Alternatively, you can resize and use
    existing partitions on the hard disk.

    - On the first boot following package installation, you are prompted for a root
    user password, as well as network configuration settings, authentication type,
    additional user accounts and settings for graphics cards, monitors, printers,
    and sound devices.

    - Most installation problems can be avoided by ensuring that your computer has
    the appropriate media, hardware, and configuration settings.


    # KEY TERMS


    **/etc/fstab** — The file that contains partition mounting information and is
    used to mount file systems at system initialization.


    **/etc/passwd** — The file typically used to store user account information on
    Linux systems.


    **/etc/shadow** — The file typically used to store user account password information
    on Linux systems.


    **Advanced Configuration and Power Interface (ACPI)** — A standard that allows
    the operating system to control the power used by system components.


    **dependencies** — Software packages or components that must be installed prior
    to the installation of a certain software package.


    **Enterprise Volume Management System (EVMS)** — A hard disk partitioning scheme
    similar to LVM that may be used to create resizable partitions that may span multiple
    hard disks.


    **extended partition** — A primary partition that can contain logical partitions.


    **hard disk mirroring** — A RAID implementation that writes all data to two separate
    hard disks for fault tolerance.


    **Hardware RAID** — A RAID implementation that is managed by the hard disk controller
    hardware.


    **Lightweight Directory Access Protocol (LDAP)** — A software protocol used to
    locate resources in a network directory database.


    **logical partition** — A partition that exists within an extended partition.


    **logical volume** — A partition defined by the LVM service that can contain a
    file system.'
  merge: -1
