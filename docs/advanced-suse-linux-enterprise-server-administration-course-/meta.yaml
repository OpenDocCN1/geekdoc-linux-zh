    sense key error = 0\nresidue count = 0\nfile number = 1\nblock number = 0\nTape\
    \ block size 0 bytes.\nDensity code 0x25 (unknown).\nSoft error count since last\
    \ status=0\nGeneral status bits on (81010000):\n    EOF ONLINE IM_REP_EN\n```\n\
    \nNow the file number is set to 1, and the final line of the output contains EOF\
    \ (end of file) instead of BOT (beginning of tape).\n\nWith the option bsf, the\
    \ tape can be repositioned back by a corresponding number of files.\nIn general,\
    \ when positioning the tape, you should use a non rewinding device file like /dev/nst0.\n\
    \nIf you want the tape to be spooled back to the beginning after the reading or\
    \ writing process, enter the following command:\n\n```\nmt -f /dev/nst0 rewind\n\
    ```\n\nIf you want to eject the tape from the drive, then enter the following\
    \ command:\n\n```\nmt -f /dev/nst0 offline\n```\n\nNormally, tapes should always\
    \ be written without compression, because otherwise you cannot recover the subsequent\
