  md: '# SCENARIO


    Digital Airlines is planning on deploying SUSE Linux in its IT infrastructure.
    During the first phase, SLES 9 will be used on the back-end systems like file,
    Web, and network-infrastructure servers.


    As the network administrator for your Digital Airlines office, you (along with
    management) have designed a migration plan that includes the following services
    to be migrated to SLES 9:


    +   - DNS services on the internal network

    - Intranet Web server

    - File and Print services for Windows clients


    You decide to start by installing and testing these services on a computer in
    a computer in the test lab.


    # OBJECTIVE 1 INSTALL AND CONFIGURE SLES 9


    The following are tasks and requirements that need to be performed on the test
    server before installing and configuring services (such as DNS):


    +   - Install SLES 9 from the SLES 9 DVD.

    - Make sure that you use a partition setup that fits your needs.

    - Install only necessary applications and daemons to support a DNS server, a Web
    server, and a Samba file server.

    - Choose a root password

    - Create one additional normal user account.

    - Update the system with YOU (from server DA1) after the installation.

    - Secure the GRUB boot loader with a password.

    - Configure the network connection manually (with or without YaST).

    - Configure runlevel 3 as the system default.

    - Synchronize the system clock with DA1 using NTP.


    Read through these requirements carefully, then install and configure the server.'
  merge: -1
  pgno: 403
- img_proc: false
  md: '# # Objective 2 Configure a DNS Server


    One milestone of Digital Airlines moving to SUSE Linux is the implementation of
    Linux-based DNS servers. As a first step you decide to setup a test DNS server
    in your lab.


    On the SUSE Linux test server in your lab, do the following:


    +   - Configure a master DNS server for five test systems

    - (DA10-DA14).

    - Test your setup (you can use the command dig).

    - The server configuration files under /etc as well as the zone files should be
    backed up. Write a shell script that performs a full backup every Sunday and an
    incremental backup on the other days using the tar tool.

    - Configure your backup script as a cron job that runs every day at 10 pm.

    - With another student who is working on the same scenario, configure your servers
    to be slave DNS servers for each other.


    For test purposes, you can copy the backup files to the directory /tmp.


    # # Objective 3 Configure a Web Server


    Your Digital Airlines office runs an internal Web server that provides vital information
    for employees. The server hosts a general portal site and a virtual host for every
    department.


    Because the Web server needs to be migrated to SLES 9, you decide to create a
    prototype system for the general portal site and two departments (accounting and
    marketing) on the test server.


    Set up the prototype system using the following guidelines:


    +   - Install and configure an Apache Web server that hosts the general portal
    site and two virtual hosts for the departments accounting and marketing.

    - Use the Apache example pages as demo content.

    - The virtual host from accounting should run under SSL, and should only be accessible
    for the users in the group accounting.

    - Make additional entries in the file /etc/hosts to test the virtual host setup.

    - From each department one user should be allowed to login using SSH on the server
    to change the content of the virtual host.


    Create two normal users, JNelson and SRife, on your system. JNelson should be
    responsible for the marketing department and SRife for the accounting department.'
  merge: -1
  pgno: 404
- img_proc: false
  md: 'Use ACLs to make sure that JNelson and SRife can only read and access the content
    in the corresponding virtual host directory.


    +   - All pages which you have to migrate end in .htm. Create a shell script which
    replaces the .htm with .html.


    # Objective 4 Configure a Samba File Server


    As part of the SUSE Linux migration plan for your Digital Airlines office, you
    need to move file and print services to a Samba server running on SLES 9.


    You decide to test this migration for the marketing department on the test server
    in your lab.


    Set up the Samba server using the following guidelines:


    +   - Install the Samba server and client software.

    - Configure a marketing workgroup.

    - Create a UNIX group named **marketing**.

    - Create two normal users (PSmith and JWatson) who are members of the accounting
    group and are included in the file smbpasswd.

    - Create one shared folder for the group accounting.

    - Export the home directories of PSmith and JWatson as personal shared folders.

    - Test your shares (you can use the smbclient).

    - Create a bash script that searches for Windows executables on the shares. If
    an executable is found, the file should be moved to a directory outside of the
    share and a mail should be sent to the root user of the Samba server.


    Depending on your programing skills, you can choose one of the following methods
    to determine if a file is a Windows executable:


    +   - Search for file extensions such as .exe or .com (not a secure solution).

    - Identify the file type using the command file.'
