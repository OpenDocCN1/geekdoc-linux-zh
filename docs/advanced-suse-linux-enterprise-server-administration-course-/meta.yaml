- img_proc: false
  md: '# Section 8 Perform a Health Check and Performance Tuning


    Two different blocks of sensors are available:


    +   - **Receiver.** These sensors display information about the received network
    data.

    - **Transmitter.** These sensors display information about the sent network data.


    Table 8-4 describes some of the available sensors you can use to analyze network
    problems.


    Table 8-4


    | Sensor | Description |

    | :--- | :--- |

    | Data/Packets | The amount of data or packets sent or received by the interface.
    If performance problems occur during a high network load, the network connection
    or type might be too slow for the purpose of the server. |

    | Collisions | This sensor is only available for the transmitter. Collisions usually
    occur more frequently when too many hosts share the same Ethernet domain (such
    as hosts that are connected with a hub and instead of a switch).<br>Too many collisions
    can have a negative impact on the overall network performance. |

    | Dropped Packets | This sensor displays the number of packets that are either
    dropped when they are received by the host or by other network components like
    routers on their way to the destination.<br>Too many dropped packets can have
    a bad influence on the network performance. The following are some reasons for
    dropped packets:<br>- Network components are running at a different speed. For
    example, the server runs at 100 Mbps, but the router at only 10 Mbps.<br>- The
    network or system load of a server is too high to handle all received network
    packets properly.<br>- A network component runs with a misconfigured packet filter
    that drops network packets. |

    | Errors | An error occurs when a packet is transmitted but the content of the
    packet is corrupted. This can be caused by a bad physical connection or faulty
    network adapters. |


    There is also protocol specific information under **Network > Sockets**.


    Besides problems that are caused by the network or network setup itself, some
    network services can interfere with the overall system performance. These network
    services might not even be running on the same host that actually experiences
    performance problems.'
  merge: -1
