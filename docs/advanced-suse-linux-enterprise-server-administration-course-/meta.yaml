  md: '# Section 6  Create Shell Scripts


    Figure 6-1 shows typical symbols used to create flow charts.


    ![](bbox=[0.08, 0.12, 0.63, 0.61])


    # The Basic Rules of Shell Scripting


    Before writing your first shell script, you should consider a few points about
    scripting in general.


    A shell script is basically an ASCII text file containing commands to be executed
    in sequence. To allow this, it is important that permissions for the script file
    are set to “r” (readable) and “x” (executable) for the user that runs it.


    However, the execute permission is not granted by default to the newly created
    file. To assign this permission, you need to use a command such as the following:


    ```

    chmod +x script.sh

    ```


    You can also run the script from another shell with a command such as the following:


    ```

    sh script.sh

    ```'
  merge: -1
  pgno: 281
- img_proc: false
  md: 'In this example, it is not necessary to make the script executable. On SLES
    9, /bin/sh is a link to /bin/bash. It doesn''t really matter whether you call
    the script with sh script.sh or bash script.sh.


    Another important point is that the directory where the script is located must
    actually be in the user''s search path for executables.


    A good way to deal with this is to create a /bin directory for scripts under each
    user''s home directory. Then you can add this directory to the user''s search
    path by adding a line such as the following to your ~.bashrc:


    ```

    export PATH=$PATH:~/bin

    ```


    Otherwise, shell scripts must be started with the full pathname.


    When naming script files, it is a good idea to add an .sh extension to the filename.
    This ensures that the file can be easily recognized as a shell script.


    If you do not add the suffix, you need to make sure the filename is not identical
    to existing commands. For example, a common mistake is to name a script test.


    The basic structure of a shell script can be illustrated with a simple program
    that does nothing more than print the message "Hello world."


    Figure 6-2 is the flow chart for the script.


    ![](bbox=[0.116, 0.487, 0.305, 0.68])


    **Figure 6-2**


    The script consists of three elements:


    +   - The program start

    - The action to print out "Hello world"

    - The program stop'
