  md: "# Use Shell Functions\n\nSometimes you need to perform a task multiple times\
    \ in a shell script. Instead of writing the same code again and again, you can\
    \ use functions.\n\nShell functions act like script modules because they make\
    \ an entire script section available with a single name. Shell functions are normally\
    \ defined at the beginning of a script. You can store several functions in a file\
    \ and include this file whenever the functions are needed.\n\nThe following is\
    \ the basic syntax of a function:\n\n```\nfunctionname () {\n    commands\n  \
    \  commands\n}\n```\n\nThe following generates a function with the function command:\n\
    \n```\nfunction functionname {\n    commands\n    commands\n}\n```\n\nThe function\
    \ name can be composed of any regular character string that then can be used to\
    \ call the function.\n\nThe following is a simple function that creates a directory\
    \ and then changes to that directory:\n\n```\n# mcd: mkdir + cd; creates a new\
    \ directory and\n# changes into that new directory right away\n\nmcd (){\n   \
    \ mkdir $1\n    cd $1\n}\n```\n\nAfter having been created, this function can\
    \ be called in a shell scripts, as in the following:\n\n```\n...\nmcd directory\n\
    ...\n```\n\nThe parameter directory is called an *argument*. Within a function,\
    \ arguments can be accessed with the variables $1, $2, $3, and so on, depending\
    \ on the number of arguments passed to the function.\n\nThe following function\
    \ can be used to create a pause in a script. The script resumes only after the\
    \ Enter key is pressed:\n\n```\n# pause: causes a script to take a break\n\npause\
    \ (){\n    echo \"To continue, hit RETURN.\"\n}\n```"
  merge: -1
  pgno: 304
