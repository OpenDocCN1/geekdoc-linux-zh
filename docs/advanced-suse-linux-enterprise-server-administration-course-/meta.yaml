  md: '# Section 3 Configure Network Services


    **caching-only server** — A DNS server that is not authoritative for any zones.
    It only answers DNS queries when the answers come from other DNS servers.

    **Canonical NAME (CNAME)** — An alias for an A record in DNS.

    **certificate** — A public key that has been digitally signed by a CA.

    **Certificate Authority (CA)** — An organization that digitally signs public keys
    to verify the organization that produced them.

    **container** — An LDAP object used to organize leaf objects.

    **dig command** — Used to perform and test name resolution using a variety of
    options.

    **directives** — Options that you can specify in Apache configuration files.

    **Distinguished Name (DN)** — A full pathname to an LDAP leaf object.

    **DNS server** — A server that hosts the BIND service and responds to client (resolver)
    queries for name resolution.

    **DocumentRoot** — The default location of Web content on a Web server.

    **domain** — The name in DNS that identifies the organization and which exists
    under the TLD.

    **Domain Name System (DNS)** — The naming system used on the Internet. Each host
    is identified by a hostname and domain name.

    **entry** — A reference to an LDAP object.

    **forward resolution** — A name resolution request that desires the IP address
    for a particular FQDN.

    **forwarding server** — A DNS server that forwards any DNS queries it cannot resolve
    to another DNS server on the network.

    **Fully Qualified Domain Name (FQDN)** — A complete name that identifies a host
    computer in DNS. It consists of a hostname (or computer name) followed by subdomain/domain
    names and a TLD (e.g., *www.west.africa.com*).

    **GQ** — A graphical LDAP database browser.

    **host command** — Used to perform and test name resolution.

    **htpasswd command** — Used to generate Apache passwords for Apache user authentication.

    **HyperText Markup Language (HTML)** — The format of information that is processed
    by Web browsers.

    **HyperText Transfer Protocol (HTTP)** — The protocol used to obtain HTML Web
    pages and other Web content from a Web server.

    **ldapadd command** — Used to create objects in an OpenLDAP database using entries
    in an LDIF file.

    **ldapdelete command** — Used to remove an LDAP object from an LDAP database.

    **ldapmodify command** — Used to modify objects in an OpenLDAP database using
    entries in an LDIF file.

    **ldapsearch command** — Used to query LDAP databases.

    **LDIF** — The format of files that are used to create, modify, and query objects
    in an LDAP database. It stands for Lightweight Directory Interchange Format.'
