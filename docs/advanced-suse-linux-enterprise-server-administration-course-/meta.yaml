    # Objective 5 Mirror Directories with the rsync Command


    The command **rsync** (remote synchronization) is actually intended to create
    copies of complete directories across a network to a different computer.


    When copying data, **rsync** compares the source and the target directory and
    transfers only data that has changed or been created.


    **rsync** is the ideal tool to mirror the content of directories or to back up
    data across a network.


    You can use **rsync** in two different ways:


    +   - Perform Local Copying with rsync

    - Perform Remote Copying with rsync'
