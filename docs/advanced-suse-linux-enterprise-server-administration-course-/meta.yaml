  md: '# Section 8 Perform a Health Check and Performance Tuning


    +   - If software-based solutions do not lead to improved disk performance, you
    will need to upgrade your disk hardware to fast IDE, SCSI, or RAID.

    - Many network-related problems may be solved by changing a kernel parameter in
    the /proc directory or by using the **sysctl** command. If this does not improve
    network performance, you may need to reduce your network collision domain or upgrade
    your network hardware.


    # KEY TERMS


    +   - **/etc/fstab** — The file used to mount file systems at system initialization.

    - **/etc/init.d/boot.local** — A file that contains information that is processed
    during system initialization. It is commonly used to set kernel parameters.

    - **/etc/inittab** — The configuration file for the init daemon. It is used when
    changing system runlevels and sets the default runlevel during system initialization.

    - **/proc/sys/vm/swappiness** — A file that determines how often swap will be
    used to store information.

    - **/sys/block/device/queue/iosched/quantum** — A file that sets the number of
    I/O requests that are stored in a queue before being sent to the hardware device.

    - **/sys/block/device/queue/read_ahead** — A file that sets the amount of data
    that is read ahead when accessing information on a disk.

    - **bottleneck** — A component that slows the transfer of data. CPUs, memory,
    hard disks, and network interfaces are common bottlenecks in computer systems.

    - **chkconfig command** — Used to list and configure daemons to start in a certain
    runlevel.

    - **collision** — An event that leads to the destruction of a packet of information
    on a network. Congested networks have a high number of collisions; this results
    in a large number of retransmitted packets and poor network performance.

    - **collision domain** — The area of a network where collisions are more likely
    to occur. A collision domain is typically a LAN that uses the same device interconnect
    method.

    - **Direct Memory Access (DMA)** — A technology that allows a hardware device
    to bypass the CPU and access physical memory directly to increase performance.

    - **free command** — Displays physical and swap memory usage.

    - **hdparm command** — Used to view and change settings for IDE hard disks.

    - **init command** — Used to change the system runlevel.

    - **Input/Output (I/O) Scheduler** — A system component that executes disk requests
    for applications.

    - **iostat command** — Displays application, CPU, and I/O statistics for disk
    devices.

    - **ip command** — Used to configure network interfaces as well as view network
    interface statistics.

    - **journaling** — A file system feature that stores file system events in a journal
    file in case of system failure.

    - **KDE System Guard** — A graphical utility that can monitor the performance
    of almost all system hardware components.'
