    # Objective 2 Deploy OpenLDAP on a SLES 9 Server


    OpenLDAP is the most popular open source LDAP suite. It provides not only the
    LDAP server itself, but also applications and tools to control and query the server
    and to develop LDAP-based software.


    To deploy an OpenLDAP server with SLES 9, you need to know:


    +   - The Concept of a Directory Service

    - The Basics of LDAP

    - How to Install and Set Up an OpenLDAP Server

    - How to Add Entries to the LDAP Server

    - How to Query Information from the LDAP Server

    - How to Delete and Modify Entries of the LDAP Server

    - How to Use Graphical LDAP Applications'
  merge: -1
  pgno: 134
- img_proc: false
  md: '# The Concept of a Directory Service


    A directory is a specialized database that is optimized for reading, browsing
    and searching. Directories contain descriptive, attribute-based information and
    support sophisticated filtering.


    Directories are tuned to give quick responses to high-volume lookup or search
    operations. They can replicate information widely in order to increase availability
    and reliability, while reducing response time.


    There are many different ways to provide a directory service. Different methods
    allow different kinds of information to be stored in the directory; place different
    requirements on how that information can be referenced, queried, and updated;
    and determine how it is protected from unauthorized access.


    Some directory services are local, providing service to a restricted context (such
    as the finger service on a single machine). Other services are global, providing
    service to a much broader context (such as the entire Internet).


    Directory services can be used for many different purposes. Very often they are
    used as databases for user authentication. By default, SLES 9 uses OpenLDAP for
    user management and some configuration purposes.


    # The Basics of LDAP


    LDAP stands for Lightweight Directory Access Protocol. As the name suggests, it
    is a lightweight protocol for accessing directory services. LDAP runs over TCP/IP
    or other connection-oriented transfer services.


    The LDAP information model is based on entries. An *entry* is a collection of
    attributes that has a globally-unique distinguished name (DN). The DN is used
    to refer to the entry. Each of the entry''s attributes has a type, and one or
    more values.


    The types are typically mnemonic strings, like "cn" for common name, or "mail"
    for e-mail addresses. The syntax of values depends on the attribute type.


    For example, a cn attribute might contain the value "Tux Penguin." A mail attribute
    might contain the value "tux@example.com." A jpegPhoto attribute might contain
    a photograph in the JPEG (binary) format.


    In LDAP, directory entries are arranged in a hierarchical tree structure. If you
    use LDAP for user management, the structure normally reflects the organizational
    structure of the company or organization.


    Under the root of the tree are the country, organization, organizational unit
    and leaf objects (such as users).'
  merge: -1
  pgno: 135
- img_proc: false
  md: 'Figure 3-3 illustrates a LDAP tree.


    ![](bbox=[0.15, 0.1, 0.8, 0.48])


    An entry of the tree is referenced by its DN, which is constructed by taking the
    name of the entry itself (called the relative distinguished name, or RDN) and
    concatenating the names of its ancestor entries.


    For example, the entry for Tux Penguin in the example above has a DN of **uid=tux,ou=Management,dc=example,dc=com**.


    In addition, LDAP allows you to control which attributes are required and allowed
    through the use of objectClasses. The following objectClasses are used when LDAP
    is used for Linux user authentication.


    +   - posixAccount

    - shadowAccount

    - posixGroup


    Table 3-4 is an overview of some of the attributes used in these object classes.


    | Attribute Abbreviation | Description |

    | --- | --- |

    | uid | Login of the user |

    | uidNumber | Numerical user ID |

    | gid | Group name |

    | gidNumber | Numerical group ID |'
  merge: -1
  pgno: 136
- img_proc: false
  md: 'Table 3-4 (continued)


    | Attribute Abbreviation | Description |

    | :--- | :--- |

    | homeDirectory | Home directory |

    | loginShell | Login shell |

    | shadowLastChange | Date of the last password change |


    Object classes are defined in schema files. OpenLDAP ships with some basic schema
    files located in the directory /etc/openldap/schema.


    To create the tree structure, you use container objects, which can contain other
    objects. The following is a list of these objects:


    +   - **Root.** The root of the directory tree

    - **c.** Countries

    - **o.** Organizations

    - **ou.** Organizational units

    - **dc.** Domain components


    # How to Install and Set Up an OpenLDAP Server


    To install and set up an OpenLDAP server, you need to do the following:


    +   - Install the Required Software and Start the Server

    - Edit the OpenLDAP Configuration Files


    # Install the Required Software and Start the Server


    Normally, YaST sets up an OpenLDAP server during the installation process of SLES
    9. However, if you chose not to install the server during installation, you can
    set up an LDAP server by installing the following software packages with YaST:


    +   - openldap2

    - openldap2-client


    # Edit the OpenLDAP Configuration Files


    The configuration files for OpenLDAP are located in the directory /etc/openldap/.
    The directory contains two configuration files:


    +   - **slapd.conf.** This file is the main configuration file for the OpenLDAP
    server.

    - **ldap.conf.** This file contains the default configuration for LDAP clients.'
  merge: -1
