- img_proc: false
  md: '> > **CAUTION** In these files, the semicolon is used as a comment sign.


    **Structure of the Files** Each of the database files consists of a series of
    entries, or resource records. The syntax of these records is always as follows:


    *reference [TTL] class type value*


    The following describes each part of a record:


    +   - **reference.** The reference to which the record refers. This can be a domain
    (or subdomain) or a standalone computer (name or IP address).

    - **TTL.** The Time To Live value for the record. If this expires, a default TTL
    value is used.

    - **class.** The class of the record. For TCP/IP networks, this is always IN (internet).

    - **type.** The type of the record. The most important types are listed in Table
    3-2.

    - **value.** The value of the record. The value depends on the type of record
    as listed in Table 3-2.


    Table 3-2


    | Record Type | Meaning | Value |

    |---|---|---|

    | SOA | Start of Authority (term for the authority) | Parameter for the domain
    |

    | NS | DNS server | Name of one of the DNS servers for this domain |

    | MX | Mail exchanger | Name and priority of a mail server for this domain |

    | A | Address | IP address of a computer |

    | PTR | Pointer | Name of a computer |

    | CNAME | Canonical name | Alias name for a computer |


    > > **CAUTION** Individual entries must always start in the first column with
    the reference. If an entry does not start in the first column, the reference is
    taken from the previous entry.'
  merge: -1
  pgno: 118
- img_proc: false
  md: "# The File `/var/lib/named/master/digitalairlines.com.zone`\n\nUnlike earlier\
    \ versions of BIND, BIND 9 requires you to specify a default TTL for all information\
    \ at the beginning. This value is used whenever the TTL has not been explicitly\
    \ given for an entry.\n\nYou define the TTL with the following instruction:\n\n\
    ```\n;\n; definition of a standard time to live, here: two days\n;\n$TTL 172800\n\
    ```\n\nIn this example, the TTL is given in seconds. But it can be given in other\
    \ units, such as 2D for two days. Other units are M (minutes), H (hours), and\
    \ W (weeks).\n\nThis is followed by the definition of the SOA (Source of Authority)\
    \ entry, which specifies which DNS server has the authority for this domain:\n\
    \n```\n;\n; SOA Entry\n;\ndigitalairlines.com. IN SOA da1.digitalairlines.com.\n\
    adm.digitalairlines.com. (\n                        2004092601 ; serial number\n\
    \                        1D         ; refresh (one day)\n                    \
    \    2H         ; retry (two hours)\n                        1W         ; expiry\
    \ time (one week)\n                        3H         ; \"negative\" validity\
    \  (three hours)\n                        )\n```\n\nThe domain to which this entry\
    \ refers (here, **digitalairlines.com**) is listed first. The domain name must\
    \ end with a dot. If a name does not have a dot at the end, the name of the domain\
    \ is added on, which could lead to an error here.\n\nAfter the SOA entry the name\
    \ of the DNS server is listed (in this example, **da1.digitalairlines.com** with\
    \ a dot at the end). Alternatively, you could write da1, and the domain name digitalairlines.com\
    \ would be added after the name.\n\nNext comes the e-mail address of the person\
    \ who is responsible for the administration of the DNS server. The \"@\" usually\
    \ used in e-mail addresses must be replaced by a dot (so the e-mail address in\
    \ this example is *hostmaster.example.com*). This is necessary because @ has a\
    \ special meaning as an abbreviation.\n\nAfter this information there is a serial\
    \ number. Any number can be used, but normally the date and a version number are\
    \ used here. After any change to the data in this file, the serial number has\
    \ to be increased.\n\nSlave servers use this number to detect if they need to\
    \ copy this zone file or not. If the serial number on the master server is greater\
    \ than that on the slave server, the file is copied."
