  md: '# 398 Glossary


    **compiler language** — A programming language whereby instructions are stored
    in a text file that is later compiled into an executable program.


    **configure** — The script contained in a C source code directory that creates
    system-specific options used to compile a particular program. These options are
    stored in the Makefile.


    **container** — An LDAP object used to organize leaf objects.


    **continue command** — Used to force a loop control structure to continue to the
    beginning of the next loop.


    **control structure** — A statement in a shell script that alters its operation
    depending on a certain condition or conditions.


    **cron** — The system service that executes commands repetitively in the future
    based on information in crontabs.


    **crontab command** — Used to schedule user commands to execute repetitively in
    the future.


    **cut command** — Used to display certain fields from all lines in a delimited
    file.


    **Data Encryption Standard (DES)** — The default encryption method used in SLES
    for passwords.


    **datagrams** — Packets that typically use the UDP or ICMP protocols.


    **date command** — Displays and sets the system time and date.


    **dd command** — Used to copy files to an alternate location using a particular
    format or method.


    **declare command** — Declares variables of a certain type for use in arithmetic
    operations.


    **default route** — The route that is used if no other routes in the routing table
    match the desired destination.


    **dependencies** — Software packages or components that must be installed prior
    to the installation of a certain software package.


    **device** — The common name for a system hardware component.


    **device agent** — A hotplug agent that loads the device driver for a hotplug
    device.


    **dictionary attack** — An attempt to gain access to a system user account by
    guessing passwords using common dictionary word combinations.


    **differential backup** — A backup of all data on the file system that has been
    modified since the last full backup.


    **dig command** — Used to perform and test name resolution using a variety of
    options.


    **Direct Memory Access (DMA)** — A technology that allows a hardware device to
    bypass the CPU and access physical memory directly to increase performance.


    **directives** — Options that you can specify in Apache configuration files.


    **Distinguished Name (DN)** — A full pathname to an LDAP leaf object.


    **DNS server** — A server that hosts the BIND service and responds to client (resolver)
    queries for name resolution.


    **DocumentRoot** — The default location of Web content on a Web server.


    **domain** — The name in DNS that identifies the organization and which exists
    under the TLD.


    **Domain Name System (DNS)** — The naming system used on the Internet. Each host
    is identified by a hostname and domain name.


    **driver** — A software component used by the operating system to control hardware
    devices such as network devices.


    **Dynamic Host Configuration Protocol (DHCP)** — A protocol that is used to assign
    IP configuration information to a host on the network.


    **echo command** — Prints text to the terminal screen.


    **egrep command** — A version of the grep command that supports extended regular
    expression patterns.'
