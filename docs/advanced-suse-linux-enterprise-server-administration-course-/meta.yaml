  md: '# # Glossary


    **&& operator** — Processes the commands on the right hand side if the commands
    on the left hand side return a true (successful) exit status.


    **. (root domain)** — The root domain of DNS.


    **/bin/bash** — The BASH shell executable program.


    **/boot/grub/menu.lst** — The GRUB boot manager configuration file.


    **/dev/nst0** — A device file that refers to the first non-rewinding SCSI tape
    device.


    **/dev/st0** — A device file that refers to the first SCSI tape device.


    **/etc/apache2/default-server.conf** — The default Apache configuration file in
    SLES. It is overwritten by all other configuration files.


    **/etc/apache2/httpd.conf** — The main Apache configuration file.


    **/etc/apache2/vhosts.d** — The directory that stores Apache virtual host configuration
    files in SLES.


    **/etc/cron.d** — A directory that contains additional information used to schedule
    commands on a SLES system.


    **/etc/cron.daily** — The directory that stores scripts that will be executed
    daily by the cron service.


    **/etc/cron.hourly** — The directory that stores scripts that will be executed
    hourly by the cron service.


    **/etc/cron.monthly** — The directory that stores scripts that will be executed
    monthly by the cron service.


    **/etc/cron.weekly** — The directory that stores scripts that will be executed
    weekly by the cron service.


    **/etc/crontab** — The file used by the cron service to schedule system-wide commands.


    **/etc/fstab** — The file that contains partition mounting information and is
    used to mount file systems at system initialization.


    **/etc/grub.conf** — The file that lists the location of GRUB components.


    **/etc/host.conf** — A file that lists the order for hostname resolution. It is
    only used by applications that use older GNU C libraries.


    **/etc/HOSTNAME** — A file that contains the name of the host.


    **/etc/hotplug** — The directory that stores hotplug agents in SLES.


    **/etc/hotplug/blacklist** — A file that lists device driver kernel modules that
    cannot be loaded by a hotplug agent.


    **/etc/init.d/boot.local** — A file that contains information that is processed
    during system initialization. It is commonly used to set kernel parameters.


    **/etc/inittab** — The configuration file for the init daemon. It is used when
    changing system runlevels and sets the default runlevel during system initialization.


    **/etc/named.conf** — A file that lists the type of zones hosted on the DNS server
    and the location of the zone files.


    **/etc/nsswitch.conf** — A file that lists the order for hostname resolution.


    **/etc/openldap/ldap.conf** — The OpenLDAP client configuration file.


    395'
