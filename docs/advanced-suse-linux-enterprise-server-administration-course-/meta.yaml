  md: "+   - **net.** This is used by the networking subsystem for any kind of networking\
    \ interfaces.\n- **pci.** This is used for PCI devices.\n\nThe environment variables\
    \ provided for a hotplug event depend on the event type.\n\nBasically, the environment\
    \ variables provide the action of the event (such as add when a device has been\
    \ added or remove when a device has been removed) and additional information about\
    \ the affected device.\n\nDepending on the event type, the hotplug script starts\
    \ the *hotplug agents*.\n\nThere are two basic types of hotplug agents:\n\n+ \
    \  - **Device agents.** These agents are responsible for loading kernel modules\
    \ and calling additional commands to set up a device. To find the correct kernel\
    \ module, they first call the hwup script, which looks for a configuration file\
    \ of the corresponding device.\n- **Interface agents.** When the kernel module\
    \ loads, it usually registers an interface for the device. The registration of\
    \ the interface also triggers a hotplug event, which might be handled by an interface\
    \ agent.\n\nIn SLES 9, an interface agent is used to set up network interfaces.\
    \ Instead of calling hwup, the interface agent uses the ifup command, which reads\
    \ the corresponding interface configuration file.\n\nThe hotplug agents are located\
    \ in the directory `/etc/hotplug/`.\n\nIt might not be possible to start some\
    \ devices with the hwup script, because no configuration file can be found.\n\n\
    In this case, the agents have routines to find and load the correct driver module\
    \ automatically by searching module map files in the directories `/etc/hotplug/`\
    \ and `/lib/modules/kernelversion/`.\n\nThe file `/etc/hotplug/blacklist` contains\
    \ a list of driver modules that should never be loaded by hotplug.\n\nSometimes\
    \ coldplug and hotplug can cause errors during system startup; for example, when\
    \ a broken kernel module is loaded. In this case, you can switch off both coldplug\
    \ and hotplug with the following boot parameters:\n\n+   - **NOCOLDPLUG=1**\n\
    \  This switches coldplug off.\n- **NOHOTPLUG=1**\n  This switches hotplug off."
