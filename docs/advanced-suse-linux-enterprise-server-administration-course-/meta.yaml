  md: "In both cases, the owner class permissions are mapped to the ACL entry owner.\
    \ Other class permissions are mapped to their respective ACL entries. However,\
    \ the mapping of the group class permissions is different in the second case.\n\
    \nIn the case of a minimum ACL without a mask, the group class permissions are\
    \ mapped to the ACL entry owning-group. In the case of an extended ACL with a\
    \ mask, the group class permissions are mapped to the mask entry.\n\nThis mapping\
    \ approach ensures the smooth interaction of applications, regardless of whether\
    \ they have ACL support.\n\nThe access permissions that were assigned by permission\
    \ bits represent the upper limit for all other adjustments made by ACLs.\n\nAny\
    \ permissions not reflected here are either not in the ACL or are not effective.\
    \ Changes made to the permission bits are reflected by the ACL and vice versa.\n\
    \n# How to Use the ACL Command-Line Tools\n\nTo manage the ACL settings, you can\
