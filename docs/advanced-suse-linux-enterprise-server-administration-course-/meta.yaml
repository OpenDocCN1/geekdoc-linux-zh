  md: "**hotplug** — A hardware and software feature that allows hardware devices\
    \ to be plugged in and used while the computer is powered on.\n**hotplug agent**\
    \ — A software component that loads the driver and registers the interface for\
    \ a hotplug device.\n**hwup command** — Used to configure the device driver and\
    \ interface for a device.\n**ifup command** — Used to configure the interface\
    \ for a network device.\n**initrd** — The init ramdisk program that is used to\
    \ load device drivers at the onset of system initialization.\n**interface** —\
    \ A logical representation of a device used by software.\n**interface agent**\
    \ — A hotplug agent that creates and/or configures an interface for a hotplug\
    \ device.\n**kernel module** — A software component that is inserted into the\
    \ Linux kernel. Kernel modules are usually device drivers.\n**lsmod command**\
    \ — Used to list currently loaded kernel modules.\n**lspci command** — Lists information\
    \ about PCI devices on the system.\n**modprobe command** — Loads modules into\
    \ the Linux kernel.\n**rmmod command** — Removes a module from the Linux kernel.\n\
    **sax2 command** — Configures X settings in SLES.\n**sysfs** — The system file\
    \ system. It is a virtual file system used by the /sys directory.\n**user space\
    \ driver** — A program that runs in user space and functions as a device driver.\n\
    \n# Review Questions\n\n+   1. Which of the following methods may be used to load\
    \ a kernel module? (Choose all that apply.)\n    a. Using the **modprobe** command\n\
    \    b. Using the sysfs file system\n    c. By the hotplug system\n    d. Using\
    \ the **init** command\n2. What extension do kernel modules have? _______________________\n\
    3. Where can you expect to find interface information for your Webcam? (Choose\
    \ all that apply.)\n    a. /sys/bus\n    b. /sys/block\n    c. /sys/class\n  \
    \  d. /sys/devices"
