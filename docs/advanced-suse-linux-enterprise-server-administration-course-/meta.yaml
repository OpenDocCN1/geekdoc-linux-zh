  md: 'In the dialog box shown in Table 4-13, you can choose from four levels of local
    security.


    **Table 4-13**


    | Level | Description |

    |---|---|

    | Level 1 (Home Workstation) | This option represents the lowest level of local
    security. It should only be used on a home workstation that is not connected to
    any kind of network. |

    | Level 2 (Networked Workstation) | This option provides an intermediate level
    of local security. It is suitable for workstations that are connected to a network.
    |

    | Level 3 (Network Server) | This option enables a high level of local security.
    Systems that are used as a network server should be run with this setting. |

    | Custom Settings | This option lets you create your own level of local security.
    |


    By selecting one of the three predefined security levels and selecting **Next**,
    the chosen security level is applied. By selecting **Details**, you can change
    the settings for the security level you have selected.


    If you choose the **Customs Settings** and then select **Next**, you can directly
    change the details of the security configuration.


    The dialog boxes for the detail settings look the same for every security level,
    but the preselected options are different. In the following dialog boxes, you
    see the settings for Level 3 (Network Server).'
