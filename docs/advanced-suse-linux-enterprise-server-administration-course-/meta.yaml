    # ## Find More Information About DNS


    If there are syntax errors in one of the configuration or zone files, BIND writes
    verbose messages to the file /var/log/messages. These messages also contain information
    on the filename and the line in which this error occurs.


    If there is an error, the processing of the file is interrupted at this point
    (that is, errors later in the file are not detected now).


    ![](bbox=[0.126, 0.65, 0.189, 0.718])


    For more information about BIND and DNS, see *DNS and BIND* by Paul Albitz and
    Cricket Liu and the BIND homepage at www.isc.org/sw/bind/.


