    shadowMin: 0

    shadowLastChange: 12609

    ```


    This example LDIF file creates a user based on the default LDAP setup of SLES
    9. The attributes are listed below with an explanation of each:


    +   - **uid:** geeko. This attribute sets the login name of the user.

    - **uidNumber:** 1010. This attribute sets the numerical ID of the user.

    - **gidNumber:** 100. This attribute sets the default group ID of the user. The
    value 100 belongs to the group users in a SLES 9 installation.

    - **cn:** Geeky Chameleon. This attribute sets the full name of the user.

    - **givenName:** Geeky. This attribute sets the given name of the user.

    - **sn:** Chameleon. This attribute sets the surname of the user.

    - **homeDirectory:** /home/geeko. This attribute sets the path to the home directory
    of the user.

    - **loginShell:** /bin/bash. This attribute sets the login shell of the user.
    The default for SLES 9 is /bin/bash.

    - **ShadowMax:** 99999. This attribute sets the number of days before the password
    expires.

    - **ShadowWarning:** 7. Users can be warned before their passwords expire. This
    attribute sets the number of days before the warning is issued. Set to -1 to disable
    the warning.

    - **ShadowInactive:** -1. This attribute sets the number of days that a user can
    still log in after the password expires. Set to -1 to set an unlimited number
    of days.

    - **ShadowMin:** 0. This attribute sets the minimum number of days that need to
    pass before a password can be changed.

    - **ShadowLastChange:** 12609. This attribute sets the date of the last password
    change.


    # How to Query Information from the LDAP Server


    You can use the command ldapsearch to read data from the LDAP directory. The following
    command reads the entire tree:


    ```

    ldapsearch -x

    ```


    The -x option forces ldapsearch to use the simple authentication method. This
    is necessary if the LDAP server is not yet configured to use the SASL authentication
    method.'
  merge: -1
  pgno: 141
- img_proc: false
  md: 'ldapsearch reads the search base for the query out of the configuration file
    /etc/openldap/ldap.conf. The search base is the entry in the directory where ldapsearch
    starts the recursive search process.


    If the file ldap.conf file does not exist, or if you want to use a different search
    base, you can specify it with the -b option, as in the following:


    ```

    ldapsearch -x -b "dc=example,dc=com"

    ```


    If you have a lot of data in your LDAP tree, you might want to limit the output
    of ldapsearch to specific entries. You can do that by adding a filter expression
    to the ldapsearch command, as in the following:


    ```

    ldapsearch -x "(uid=g*)"

    ```


    In this example, ldapsearch displays all entries that have a uid attribute starting
    with g. You can use any attributes or objectClasses as a search filter.


    The output of ldapsearch looks like the following:


    ```

    # geeko, people, suse.de

    dn: uid=geeko,ou=people,dc=suse,dc=de

    objectClass: top

    objectClass: posixAccount

    objectClass: shadowAccount

    objectClass: inetOrgPerson

    cn: Geeko Chameleon

    gidNumber: 100

    givenName: Geeko

    homeDirectory: /home/geeko

    loginShell: /bin/bash

    shadowInactive: -1

    shadowMax: 99999

    shadowMin: 0

    shadowWarning: 7

    sn: Chameleon

    uid: geeko

    uidNumber: 1010

    shadowLastChange: 12623

    ```


    ldapsearch displays the result in LDIF format. That means you can transfer the
    data to another LDAP server by redirecting the data into a file and loading it
    with ldapadd on a different machine.'
  merge: -1
  pgno: 142
- img_proc: false
  md: '# How to Delete and Modify Entries of the LDAP Server


    The easiest way to modify data in the LDAP directory in SLES 9 is to modify an
    LDIF file and apply the changes with the ldapmodify tool.


    In the following example, the uidNumber of the user tux has been changed to 1011:


    ```

    # geeko, people, suse.de

    dn: uid=geeko,ou=people,dc=suse,dc=de

    objectClass: top

    objectClass: posixAccount

    objectClass: shadowAccount

    objectClass: inetOrgPerson

    cn: Geeko Chameleon

    gidNumber: 100

    givenName: Geeko

    homeDirectory: /home/geeko

    loginShell: /bin/bash

    shadowInactive: -1

    shadowMax: 99999

    shadowMin: 0

    shadowWarning: 7

    sn: Chameleon

    uid: geeko

    uidNumber: 1011

    shadowLastChange: 12623

    ```


    To apply the changes, use the following command:


    ```

    ldapmodify -x -D “cn=Manager,dc=example,dc=com” -W -f geeko. ldif

    ```


    Using the ldapmodify command is similar to using ldapadd. ldapmodify compares
    the data in the directory with the data from the LDIF file and applies the changes
    to the directory entries.


    To delete an entry from the LDAP directory, use the following command:


    ```

    ldapdelete -D cn=Administrator,dc=example,dc=com -x -W “cn=geeko, dc=example,
    dc=com”

    ```


    In this example, the entry with the distinguished name “cn=geeko, dc=example,
    dc=com” is deleted.'
  merge: -1
