  md: '# 172  Section 3  Configure Network Services


    **Server Level Security** — A Samba share security level that requires a valid
    login to another server in order to access a shared directory.


    **Server Message Block (SMB)** — A file and printer sharing protocol used by Windows
    systems.


    **Share Level Security** — A Samba share security level that requires a password
    in order to access a shared directory.


    **shares** — Shared directories or printers on a Windows or Samba computer.


    **slappasswd command** — Used to generate an encrypted password that may be used
    in the OpenLDAP configuration files.


    **slave server** — A DNS server that contains a read-only copy of the zone database
    obtained from a master server via a zone transfer.


    **smbclient command** — Used to view and access Windows and Samba file and printer
    shares.


    **smbd** — The Samba daemon.


    **smbpasswd command** — Sets a Windows-formatted password for Linux user accounts.


    **Start Of Authority (SOA)** — A DNS record that identifies zone-specific information
    and zone transfer settings.


    **subdomain** — The name in DNS that identifies a division of an organization
    and which exists under the domain and TLD.


    **testparm command** — Checks the syntax of /etc/samba/smb.conf.


    **Time To Live (TTL)** — The amount of time a name resolution result is cached
    on the computer. The default TTL is set in the SOA in the zone file on the DNS
    server.


    **Top Level Domain (TLD)** — The first level of names underneath the root domain
    in DNS.


    **Universal Naming Convention (UNC)** — A format used to specify a shared resource
    on a Windows or Samba computer (i.e., \\servername\sharename).


    **User Level Security** — A Samba share security level that requires a valid Linux
    login in order to access a shared directory.


    **virtual host** — An additional Web site that is hosted by a Web server.


    **Web browser** — A program that can obtain Web content from a Web server.


    **Web server** — A service that provides Web content to client computers that
    have a Web browser.


    **workgroup** — A name that identifies a group of computers in a Windows network
    that are not part of a domain.


    **zone** — A specific domain in DNS represented by a file on a DNS server that
    contains the records used for name resolution.


    **zone transfer** — The process whereby a master DNS server sends zone information
    to a slave DNS server.'
