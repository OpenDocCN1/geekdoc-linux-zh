- img_proc: false
  md: 'You can find the global section at the beginning of the configuration file.
    The password needs to be placed into that section as shown in the following example:


    ```

    color white/blue black/light-gray

    default 0

    timeout 8

    gfxmenu (hd0,5)/boot/message

    password --md5 $1$h8GCU0$Vt3impL0.Cr0nkGQY1jjJ1

    ```


    # Objective 3  Limit the Installed Software Packages


    Every software package that is installed on a system, but is not needed by that
    system, should be removed from a production server.


    The more software is installed, the more possible security problems can occur.
    For example, it does not make sense to install an X Server and graphical applications
    on a system that is exclusively used as Web server.


    To set up a production system, you can use the minimal system as a base for the
    software selection during the installation. Then you can manually add just those
    software packages that are needed.


    This rule is especially true for network daemons. A server should never offer
    any network services that are not needed. For example, if a server is used as
    a dedicated file server, it is not necessary to run a postfix mail server on the
    same system.


    You can use the following command to check which services are configured to start
    and their run levels:


    **chkconfig -l**


    The command displays a line for every service installed on the system. The following
    line shows the configuration of the Samba server:


    **smb 0:off 1:off 2:off 3:on 4:off 5:on 6:off**


    After the service name, the configuration for all six default run levels is displayed.
    On means the service is configured to be started in the corresponding run level;
    off means the service will not be started.


    You can use the following command to remove a service from its default run levels:


    **insserv -r *service_name***


    > Removing a service from the run level configuration does not stop an already
    running daemon. A daemon that is already running needs to be stopped manually
    or the system needs to be rebooted to start with the new run-level configuration.'
  merge: -1
  pgno: 205
