    # OBJECTIVE 4 CONFIGURE A SAMBA SERVER AS A FILE SERVER


    Samba is a suite of applications used to integrate a Linux system into a Windows
    network. Samba is most commonly used as a file server for Windows hosts.

    To configure a Samba file server, you need to know:


    +   ■ The Purpose and the Possibilities of Samba

    ■ How to Install and Set Up a Basic Samba Server

    ■ The Structure and Elements of the Samba Configuration File

    ■ How to Use the Samba Tools to Access SMB Shares from a Linux Computer

    ■ How to Configure a File Server With User Authenticaion

    ■ Additional Possibilities with Samba


    # The Purpose and the Possibilities of Samba


    The Server Message Block (SMB) protocol is a network protocol that provides file
    and print services in a Windows network. Samba enables Linux to use SMB so that
    Linux can work in a Windows environment.


    You can use Samba for the following purposes:


    +   ■ Use the Samba server to provide file and print services for Windows clients.

    ■ Use the Samba tools to access SMB file and print services on a Linux system.

    ■ Use Samba as a domain controller for Windows clients.


    SMB services are provided by the NetBIOS protocol. NetBIOS makes its own name
    space available, which is completely different from the domain name system.


    This name space can be accessed with the Unique Naming Convention (UNC) notation:
    all services provided by a server are addressed as \\Server\Servicename.


    File or print services offered by a server are also called ***shares.***


    The server side of Samba consists of two parts:


    +   ■ **nmbd.** This daemon handles all NetBIOS-related tasks.

    ■ **smbd.** This daemon provides file and print services for clients in the network.'
  merge: -1
  pgno: 172
- img_proc: false
  md: "To integrate Linux as client in a Windows environment, Samba provides two tools:\n\
    \n+   - **nmblookup.** This tool can be used for NetBIOS name resolution and testing.\n\
    - **smbclient.** This tool provides access to SMB file and print services.\n\n\
    # How to Install and Set Up a Basic Samba Server\n\nTo set up a basic Samba server,\
    \ you need to install the following packages with YaST:\n\n+   - **samba.** This\
    \ is the main Samba package. It contains the Samba server software.\n- **samba-client.**\
    \ This package contains the Samba client tools.\n- **samba-doc.** This package\
    \ provides additional documentation about Samba.\n\nAfter the packages have been\
    \ installed, you can start the two Samba daemons with the following commands:\n\
    \n```\nrcnmb start\nrcsmb start\n```\n\nTo start the Samba services automatically\
    \ when the system is booting, enter the following commands:\n\n```\ninsserv nmb\n\
    insserv smb\n```\n\n# The Structure and Elements of the Samba Configuration File\n\
    \nThe Samba services are configured in the file /etc/samba/smb.conf.\nThe options\
    \ in this file are grouped into different sections. Each section starts with a\
    \ keyword in square brackets.\n\nTo set up a simple file server with Samba, do\
    \ the following:\n\n+   - Create a Section for the General Server Configuration\n\
    - Create a Section for the Files to be Shared\n\n# Create a Section for the General\
    \ Server Configuration\n\nThe section for the general server configuration starts\
    \ with the keyword [global]. The following is an example of a basic global section:\n\
    \n```\n[global]\n    workgroup = DigitalAirlines\n    netbios name = Fileserver\n\
    \    security = share\n```"
  merge: -1
  pgno: 173
- img_proc: false
  md: "The entries of the global section in this example are described below:\n\n\
    +   - **workgroup = DigitalAirlines**\n\n  This line sets the Windows workgroup\
    \ of the Samba server (in this case, DigitalAirlines).\n\n+   - **netbios name\
    \ = Fileserver**\n\n  This line sets the name of the system in the NetBIOS name\
    \ space (in this case, Fileserver).\n\n+   - **security = share**\n\n  This line\
    \ determines how a client has to authenticate itself when accessing a share. This\
    \ option can have the following values:\n\n  - **share.** The client does not\
    \ need to provide a password when initially connecting to the server. However,\
    \ a password might be necessary when the client tries to access a share.\n  -\
    \ **user.** The client needs to provide a user name and password when connecting\
    \ to the server. Samba validates the password against the users available on the\
    \ Linux system and its own password file.\n  - **server.** The client needs to\
    \ provide a user name and password when it connects to the server. Samba contacts\
    \ another SMB server in the network to validate the password.\n  - **domain.**\
    \ The client needs to provide a user name and password when connecting to the\
    \ server. Samba connects to the domain controller and validates the password.\
    \ This works only if Samba joins a Windows domain.\n  - **ads.** Samba acts as\
    \ domain member of an ADS realm to validate the user name and password.\n\n> You\
    \ might need to configure additional settings for these options to work correctly.\
    \ For more information, see the man page of smb.conf.\n\n# ## Create a Section\
    \ for the Files to be Shared\n\nAfter the global section, you need to add a section\
    \ for the share of your file server. The following example is the simplest way\
    \ to set up for a share:\n\n```\n[data]\n    comment = Data\n    path = /srv/data\n\
    \    read only = Yes\n    guest ok = Yes\n```"
  merge: -1
  pgno: 174
- img_proc: false
  md: "# 158 Section 3 Configure Network Services\n\nThe entries of the section in\
    \ this example are described below:\n\n+   - **[data]**\n  This is the identifier\
    \ for the share. The share can later be accessed with the address \\\\Fileserver\\\
    data.\n\n+   - **comment = Data**\n  This option is a comment with additional\
    \ information about the share. The comment is displayed when you browse the network\
    \ with Windows Explorer.\n\n+   - **path = /srv/data**\n  This option sets the\
    \ path to the exported data on the local file system. You have to make sure that\
    \ the local user who needs to access the files of this share has sufficient file\
    \ system rights.\n\n+   - **read only = Yes**\n  If this option is set to yes,\
    \ the client accessing the share is not allowed to modify, delete or create any\
    \ files.\n\n+   - **guest ok = Yes**\n  If this option is set to Yes, a password\
    \ is not required to access the share.\n\n> There many more configuration options\
    \ available than those discussed in this section. For an overview of all options,\
    \ see the man page of smb.conf.\n\nAfter you have created a smb.conf file, you\
    \ should restart the Samba server daemons.\n\nBefore you restart the daemons,\
    \ you can test the syntax of the Samba configuration file by entering the following\
    \ command:\n\n**testparm**\n\nThe output of the command looks like the following:\n\
    \n```\nLoad smb config files from /etc/samba/smb.conf\nprocessing section \"[data]\"\
    \nLoaded services file OK.\nServer role: ROLE_STANDALONE\nPress enter to see a\
    \ dump of your service definitions\n```\n\nIn this case, no errors are found.\
    \ If there were any errors in the file, the command would display the errors grouped\
    \ by configuration sections."
