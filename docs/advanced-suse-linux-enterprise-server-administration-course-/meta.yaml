  md: '# # Advanced

    # SUSE Linux Enterprise Server Administration (Course 3038)


    Hands-on labs and plenty of practical examples combine to introduce readers to
    Novell''s SUSE Linux Enterprise Server configuration and maintenance tasks. Users
    will learn to configure network services, secure their SUSE Linux Enterprise Server
    systems, create and restore backups, fix boot problems, compile software, install
    hardware, and more. In addition, readers will be presented with useful management
    tools such as shell scripting, performance monitoring, and tuning. Coverage concludes
    with a series of questions that unite the essential principles learned, and features
    additional discovery exercises aimed at helping candidates prepare for the Novell
    Certified Linux Professional (CLP) Practicum certification exam.


    # ## Features


    +   - Suitable for systems administrators who need to learn Linux, yet have a
    basic understanding of SUSE or another Linux distribution, or have taken the 3037
    course

    - Features must-know information for guiding readers through the installation,
    management, and maintenance of SUSE Linux Enterprise Server system

    - Focused SUSE Linux coverage boasts generous examples and tables and a thorough
    discussion of configuration commands and files

    - Designed to help candidates prepare to pass the Novell Certified Linux Professional
    (CLP) certification exam on the first attempt


    # ## About the Author


    **Novell**-based courseware is developed by professional instructional designers
    and is designed to help manage, simplify, secure, and integrate technology environments
    by leveraging best-of-breed, open standards-based software.


    **Jason W. Eckert**, a graduate of the University of Waterloo, has 13 years of
    experience as a UNIX administrator and software developer. He teaches at triOS
    College and holds 12 UNIX and Linux certifications. Jason has authored several
    titles for Course Technology, including *Getting Started with Linux: Novell''s
    Guide to CompTIA''s Linux+*, and *SUSE Linux Enterprise Server Administration*.
    He has also co-authored *MCSE Guide to Managing a Microsoft Windows Server 2003
    Network, Enhanced*.


