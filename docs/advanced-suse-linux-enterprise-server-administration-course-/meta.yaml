  md: "# Section 6 Create Shell Scripts\n\nThere are several ways to use the Bash\
    \ shell to successively execute several commands. This includes using the separators\
    \ && and ||, which make it possible to execute a second command depending on the\
    \ success or failure of the first, as in the following:\n\n```\ncommand1 && command2\n\
    command1 || command2\n```\n\n+   - The && separator executes command2 if the command1\
    \ exits with success.\n- The || separator executes command2 if the command1 exits\
    \ with a failure.\n\nThese separators can also be understood as short forms of\
    \ an if branch.\n\nThis means that the following structure:\n\n```\nif test -e\
    \ file\nthen\n\t. file\nfi\n```\n\ncan be condensed into the following command\
    \ line:\n\n```\ntest -e file && . file\n```\n\nWhenever the comparison is a simple\
    \ one, as in the example above, you can replace the relatively complex if...then...fi\
    \ structure with a command line that uses && or || to chain the commands.\n\n\
    # Exercise 6-7 Use the if Command\n\nDo the following:\n\n+   1. Write a shell\
    \ script that checks for the existence of a given file, and if the file is executable.\n\
