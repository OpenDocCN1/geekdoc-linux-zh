  md: '# # Glossary


    **/etc/openldap/schema** — The directory that stores the OpenLDAP schema in SLES.


    **/etc/openldap/slapd.conf** — The OpenLDAP server configuration file.


    **/etc/pam.d** — The directory that stores PAM configuration files.


    **/etc/passwd** — The file typically used to store user account information on
    Linux systems.


    **/etc/permissions.local** — A file that lists the user-defined permission restrictions
    for system files.


    **/etc/permissions.secure** — A file that lists secure file permission restrictions
    for system files.


    **/etc/resolv.conf** — A file that lists up to three DNS servers that may be contacted
    to resolve a remote hostname to an IP address.


    **/etc/samba/smb.conf** — The main Samba configuration file.


    **/etc/securetty** — A PAM file that lists valid root login terminals.


    **/etc/security/limits.conf** — A PAM file that lists user resource limits.


    **/etc/shadow** — The file typically used to store user account password information
    on Linux systems.


    **/etc/sysconfig/hardware** — A directory that stores information about hardware
    devices on the system. Files in this directory are used by the hwup command.


    **/etc/sysconfig/network** — Stores information for network interfaces in SLES.
    Files in this directory are used by the ifup command.


    **/etc/sysconfig/network/routes** — A file that stores static routes for use on
    the system.


    **/lib/modules/*kernel-version*** — The directory that stores kernel modules in
    SLES.


    **/lib/security** — The directory that stores PAM modules.


    **/proc/sys/kernel/hotplug** — The file that the Linux kernel uses to call /sbin/hotplug
    when a hotplug event occurs.


    **/proc/sys/vm/swappiness** — A file that determines how often swap will be used
    to store information.


    **/sbin/hotplug** — The script called by the Linux kernel during a hotplug event.


    **/srv/www/htdocs** — The default DocumentRoot directory in Apache.


    **/sys/block** — A directory that stores interface information by device.


    **/sys/block/device/queue/iosched/quantum** — A file that sets the number of I/O
    requests that are stored in a queue before being sent to the hardware device.


    **/sys/block/device/queue/read_ahead** — A file that sets the amount of data that
    is read ahead when accessing information on a disk.


    **/sys/bus** — A directory that stores hardware information by bus type.


    **/sys/class** — A directory that stores interface information by type.


    **/sys/devices** — A directory that stores hardware information by device.


    **/var/lib/named** — The directory that stores zone files in SLES.


    **/var/log/messages** — The default log file for the DNS daemon.


    **/var/spool/cron/allow** — A file that lists users who can use the crontab command.


    **/var/spool/cron/deny** — A file that lists users who cannot use the crontab
    command.


    **/var/spool/cron/tabs** — The directory used by the cron service to schedule
    commands for a particular user account.


    **||** `operator` — Processes the commands on the right hand side if the commands
    on the left hand side return a false (unsuccessful) exit status.


    **<<** `(here) operator` — Used to read data from a file listed on the right of
    the operator, and send it to a command listed to the left of the operator.'
