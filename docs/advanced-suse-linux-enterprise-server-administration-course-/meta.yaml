  md: "The option string is followed by a *variable* to which all the command-line\
    \ options specified are assigned as a list.\n\nThe getopts command is mostly frequently\
    \ used in a while loop together with case to define which command to execute for\
    \ a given option, as in the following:\n\n```\nwhile getopts abc: variable\ndo\n\
    \    case $variable in\n        a ) echo \"The option -a was used.\" ;;\n    \
    \    b ) echo \"The option -b was used.\" ;;\n        c ) option_c=\"$OPTARG\"\
    \n            echo \"Option c has been set.\" ;;\n    esac\ndone\n```\n\n```\n\
    echo $option_c\n```\n\nIf the option -a or -b is used, the script prints out a\
    \ message that the corresponding option was used. If the option -c *value* is\
    \ used, the value is assigned to the variable option_c, which is printed to the\
    \ screen at the end of the script.\n\nThe parameter of an option can be accessed\
