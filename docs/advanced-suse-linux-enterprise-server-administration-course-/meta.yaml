  md: '# ## How to Use the Samba Tools to Access SMB Shares from a Linux Computer


    Although the main purpose of Samba is to provide services for Windows clients,
    it also provides tools to access SMB shares from Linux. It doesn''t matter if
    these shares are provided by Samba or a native Windows server.


    You can perform three basic tasks with the Samba tools:


    +   - Use nmblookup for Name Resolution in a NetBIOS Network

    - Use smbclient to Access SMB Shares

    - Mount SMB Shares into the Linux File System


    # ### Use nmblookup for Name Resolution in a NetBIOS Network


    With the tool nmblookup, you can resolve NetBIOS names into IP addresses. In the
    following example, the IP address for the Samba server with the NetBIOS name Fileserver
    is looked up:


    # #### nmblookup Fileserver


    The output of the command looks like the following:


    ```

    querying Fileserver on 10.0.0.255

    10.0.0.1 Fileserver<00>

    ```


    In the first line, nmblookup states that it queries the IP address with a broadcast
    to the address 10.0.0.255. In the second line, it displays the result of the query,
    in this case, address 10.0.0.1 for the system with the NetBIOS name Fileserver.


    > If the system you are querying is not in the same subnet as yours, the name
    cannot be resolved with a broadcast query. Instead, nmblookup uses a WINS server
    to resolve the name. For more information, see the man page for nmblookup.


    # ### Use smbclient to Access SMB Shares


    With the smbclient tool, you can access SMB shares on the network. It''s also
    a very useful tool to test a Samba server configuration.'
  merge: -1
  pgno: 176
- img_proc: false
  md: "You can perform three basic tasks with smbclient.\n\n+   - Browse the Shares\
    \ Provided by a Server\n- Access Files Provided by an SMB Server\n- Print on Printers\
    \ Provided by an SMB Server\n\n**Browse the Shares Provided by a Server** To display\
    \ the shares offered by an SMB server, enter a command such as the following.\n\
    \n```\nsmbclient -L //Fileserver\n```\n\nWhen smbclient asks for a password, press\
    \ **Enter** to proceed.\n\nThe output of smbclient looks like the following:\n\
    \n```\nDomain=[DigitalAirlines] OS=[Unix] Server=[Samba 3.0.4-SUSE]\n       Sharename\
    \       Type      Comment\n       ---------       ----      -------\n       data\
    \            Disk      Data\n       IPC$            IPC       IPC Service\n  \
    \     ADMIN$          IPC       IPC Service\nDomain=[DigitalAirlines] OS=[Unix]\
    \ Server=[Samba 3.0.4-SUSE]\n       Server          Comment\n       -------  \
    \       -------\n       Workgroup       Master\n       ---------       ------\n\
    \       DigitalAirlines Fileserver\n```\n\nsmbclient first displays all available\
    \ shares of the SMB server. Beside the shares you have configured in the smb.conf\
    \ file, an SMB server always offers at least two other shares:\n\n+   - **IPC$.**\
    \ This share provides information about the other shares available on the SMB\
    \ server.\n- **ADMIN$.** On a Windows computer this share points to the directory\
    \ where Windows itself is installed. This can be useful for administrative tasks.\
    \ When Samba tries to emulate a Windows server, it also offers this share. However,\
    \ it is not needed to administer a Linux server.\n\nThe lower part of the smbclient\
    \ output gives some information about the workgroup of the system.\n\nThis command\
    \ can also be very valuable for testing purposes. After you have set up a share,\
    \ you can check the availability of the share with smbclient.\n\nSome shares are\
    \ not browseable without authentication. In this case, you can pass a user name\
    \ to smbclient, as in the following:\n\n```\nsmbclient -L //Fileserver -U tux\n\
    ```\n\nIn the example, smbclient connects to the server with the user name tux\
    \ and prompt for the corresponding password."
  merge: -1
  pgno: 177
- img_proc: false
  md: '# # Configure a Samba Server as a File Server


    161


    **Access Files Provided by an SMB Server** The command to access a share on a
    server is similar to the command used to browse for available shares, but instead
    of supplying just the server name, the full path to the share needs to be supplied
    without the -L option.


    In the following example, smbclient connects to the share data on the server Fileserver:


    ```

    smbclient //Fileserver/data

    ```


    In this case, it is not necessary to supply a user name because the share data
    is configured with the guest ok = yes option. A user name can be supplied with
    the -U option.


    After smbclient has connected to a share, it displays the following prompt:


    ```

    Smb: \>

    ```


    Smbclient can be used like a command-line FTP client. The most important commands
    are the following:


    +   - **ls.** Displays the content of the current directory.

    - **cd.** Changes to a directory.

    - **get.** Copies a file from the share to the current working directory.

    - **put.** Copies a file to the share. The share must be writable to use this
    command.


    **Print on Printers Provided by an SMB Server** You can use smbclient to print
    on shared network printers. The basic syntax of a print command is shown in the
    following:


    ```

    smbclient //Printserver/laser -c ''print letter.ps''

    ```


    In this example, the file letter.ps is printed on a network printer accessed through
    the share laser of the SMB server Printserver.


    You can also use the command print on the smbclient command line after you have
    connected to the server. The -c option performs the given command automatically
    after the connection to the server has been established.


    # ## Mount SMB Shares into the Linux File System


    Instead of accessing shared files with smbclient, you can mount a share into the
    file system like a hard disk partition or a CD-ROM drive.


    The basic mount command is shown in the following:


    ```

    mount -t smbfs //Fileserver/data /mnt

    ```


    In this example, the share data of the SMB server Fileserver is mounted into the
    directory /mnt. The option -t smbfs is necessary to specify that the resource
    to be mounted is an SMB share.'
  merge: -1
  pgno: 178
- img_proc: false
  md: 'If the share requires authentication, you can supply a username and password,
    as in the following:


    ```

    mount -t smbfs -o username=tux,password=novell

    //fileserver/data /mnt

    ```


    # ## How to Configure a File Server with User Authentication


    In the previous example, the Samba share is accessible without supplying a user
    name and password. In most cases, this type of accessibility in not recommended.


    The following shows you how to configure Samba to require authentication with
    a user name and password:


    +   - Prepare the Server for User Authentication

    - Configure a Share That is Accessible to Only One User

    - Configure a Shared Access for a Group of Users

    - Configure the Export of Home Directories


    # ## Prepare the Server for User Authentication


    The first task is to change the security option in the smb.conf file to the following:


    ```

    security = user

    ```


    The value user for the option security forces user authentication when the client
    attempts to connect to the server.


    In the following examples, the configuration is based on User Level Security.
    In this security level, the Windows-compatible encrypted password file is stored
    in the file /etc/samba/smbpasswd (by default).


    Users who want to access SMB shares must first be created as Linux users. Then
    an SMB password needs to be set using the smbpasswd tool.


    The following example sets an SMB password for the user tux:


    ```

    smbpasswd -a tux

    ```


    Smbpasswd prompts you to enter the password twice and confirms the setting of
    the password by displaying the following message:


    ```

    New SMB password: novell

    Reenter smb password: novell

    Added user tux

    ```


    If smbpasswd is called without any parameters, the current user can change his
    SMB password. If smbpasswd is called with the -x option followed by a user name,
    that user is deleted from the smbpasswd file.'
  merge: -1
  pgno: 179
- img_proc: false
  md: "# Configure a Share That Is Accessible to Only One User\n\nThe following example\
    \ configures a share that is accessible only for the user tux:\n\n```\n[tux-dir]\n\
    \    comment = Tux Directory\n    path = /srv/share\n    valid users = tux\n \
    \   read only = no\n```\n\nEach line of this share is described below:\n\n+  \
    \ - **comment = Tux Directory**\n  This option sets the comment for the share.\n\
    - **path = /srv/share**\n  This option sets the path to the share.\n- **valid\
    \ users = tux**\n  This option lists all user who are allowed to connect to this\
    \ share. User names have to be separated by commas. You can add an entire UNIX\
    \ group with the syntax `@group_name`. However, all the users of the UNIX group\
    \ need accounts in the smbpasswd file.\n- **read only = no**\n  This option makes\
    \ the share writable by setting the read only option to no.\n\n# Configure Shared\
    \ Access for a Group of Users\n\nThe following example creates a share that is\
    \ readable and writable for all users of the UNIX group accounting:\n\n```\n[accounting]\n\
    \    comment = Accounting department\n    path = /srv/share\n    valid users =\
    \ @accounting\n    force user = tux\n    force group = accounting\n    read only\
    \ = no\n```\n\nCompared to the previous example, the following lines are new or\
    \ have changed:\n\n+   - **valid users = @accounting**\n  This line allows all\
    \ users who are in the UNIX group accounting to access the shared folder.\n- **force\
    \ user = tux**\n  This line forces the Samba server to perform all file operations\
    \ in the shared folder as user tux. This ensures that all files in the shared\
    \ folder are readable and writable for every user who is allowed to access the\
    \ share."
