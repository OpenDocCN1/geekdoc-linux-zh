  md: 'The following is the hotplug process for attaching a USB camera to the system:


    +   1. The camera is plugged into the system.


    +   2. The USB subsystem recognizes the camera and triggers a hotplug event by
    calling the hotplug script.


    +   3. The subsystem passes usb as the parameter to the script and provides additional
    information about the new device in environment variables.


    +   4. Because of the usb parameter, the hotplug script calls the USB hotplug
    agent.


    +   5. The USB agent tries to configure the device by calling hwup.


    +   6. If hwup fails, the agent tries to find the correct usb module by searching
    module mapfiles in /etc/hotplug and /lib/modules/kernelversion.


    +   7. If a driver is found, the corresponding module is loaded.


    Figure 9-2 illustrates the Linux hotplug process for a USB camera.


    ![](bbox=[0.162, 0.382, 0.792, 0.828])


    Figure 9-2'
