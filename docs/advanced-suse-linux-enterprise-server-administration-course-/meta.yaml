    with the -e option:


    +   - \a. Outputs an alert (sounding the bell). This does not work in the KDE
    Konsole.

    - \c. Do not add a new line at the end of the output.

    - \n. Add a new line (line break).


    The cat command is preferred over echo to output a text file or several lines
    of text.


    # Use the grep and egrep Commands


    The command grep and its variant egrep are used to search files for certain patterns,
    and use the following syntax:


    ```

    grep searchpattern filename ...

    ```


    The command prints lines that contain the given search pattern. You can specify
    several files, in which case the output will print the matching line and the corresponding
    filenames.


    Several options are available to specify that only the line number should be printed,
    for instance, or that the matching line should be printed together with leading
    and trailing context lines.


    Search patterns can be supplied in the form of regular expressions, although the
    bare grep command is limited in this regard.


    To search for more complex patterns, use the egrep command, which accepts extended
    regular expressions. As a simple way to deal with the difference between the two
    variants, make sure you use egrep in all of your shell scripts.


    The regular expressions used with egrep need to be in accordance with the standard
    regex syntax.


    To avoid having special characters in search patterns interpreted by the shell,
    enclose the pattern in quotation marks, as in the following:


    ```

    tux@DA1:~> egrep (b|B)lurb file*

    bash: syntax error near unexpected token |


    tux@DA1:~> egrep "(b|B)lurb" file*

    file1:blurb

    file2:Blurb

    ```


    # Use the sed Command


    The sed program is a stream editor, an editor used from the command line rather
    than interactively. sed performs text transformations on a line-by-line basis.


    You can specify sed commands either directly on the command line or in a special
    command script loaded by the program on execution.'
  merge: -1
  pgno: 310
- img_proc: false
  md: "The following is the syntax for the sed command:\n\n```\nsed *editing-command\
    \ filename*\n```\n\nThe available editing commands are single-character arguments\
    \ such as the following:\n\n+   - **d**: Delete\n- **s**: Substitute (replace)\n\
    - **p**: Output line\n- **a**: Append after\n\nAs with other commands, the output\
    \ of sed normally goes to standard output, but it can also be redirected to a\
    \ file.\n\nEach sed command must be preceded by an exact address or address range\
    \ specifying the lines to which the editing command applies.\n\nApart from the\
    \ single-character commands for text transformations, you can also specify options\
    \ to influence the overall behavior of the sed program.\n\nThe following are some\
    \ important command-line options for sed:\n\n+   - **-n, --quiet, --silent.**\
    \ By default, sed will print all lines on standard output after they have been\
    \ processed. This option suppresses the output so sed only prints those lines\
    \ for which the **p** editing command has been given to explicitly re-enable printing.\n\
    - ***-e command1 -e command2 ....*** This option is necessary when specifying\
    \ two or more editing commands. It must be inserted before each additional editing\
    \ command.\n- **-f *filename*.** With this option, you can specify a script file\
    \ from which sed should read its editing commands.\n\nFor many editing commands,\
    \ it is important to specify the exact line or lines that should be processed\
    \ by the command. One of the more frequently used address labels is $, which stands\
    \ for the last line.\n\nThe following are two examples of the sed command:\n\n\
    +   - **sed -n '1,9p' somefile**\n  This command prints only lines 1 through 9\
    \ on stdout.\n- **sed '10,$d' somefile**\n  This command deletes everything from\
    \ line 10 to the end of the file and also prints the first 9 lines of somefile.\n\
    \nYou can use a regular expression to define the address or address range for\
    \ an editing command. Regular expressions must be enclosed in forward slashes.\
    \ If an address is defined with such an expression, sed processes every line that\
    \ includes the given pattern."
  merge: -1
  pgno: 311
- img_proc: false
  md: 'The following is an example of using regular expressions:


    ```

    sed -n ''/Murphy.*/p'' somefile

    ```


    This example prints all lines that have the pattern Murphy.* in them.


    If you want sed to perform several editing commands for the same address, you
    need to enclose the commands in braces, as in the following:


    ```

    sed ''1,10{command1 ; command2}''

    ```


    Table 6–2 lists the most important editing commands available for sed.


    | Command | Example | Editing Action |

    | :--- | :--- | :--- |

    | d | sed 10,$d file | Delete line. |

    | a | sed ''a\text\text'' file | Insert text before the specified line. |

    | i | sed ''i\text\text'' file | Replace specified lines with the text. |

    | c | sed ''2000,$c\text '' file | Replace specified lines with the text. |

    | s | sed s/x/y/option | Search and replace. The search pattern x is replaced
    with pattern y. The search and the replacement pattern are regular expressions
    in most cases and the search and replace behavior can be influenced through various
    options. |

    | y | sed y/abc/xyz/ | (yank) Replace every character from the set of source characters
    with the character that has the same position in the set of destination characters.
    |


    You can use the following options with the s command (search and replace):


    +   - I. Do not distinguish between uppercase and lowercase letters.

    - g. Replace globally wherever the search pattern is found in the line (instead
    of replacing only the first instance).

    - n. Replace the nth matching pattern only.

    - p. Print the line after replacing.

    - w. Write the resulting text to the specified file rather than printing it on
    stdout.


    The following are some examples of using the s command:


    ```

    sed ''s/:/ /'' /etc/passwd

    This command replaces the first colon in each line with a space.

    sed ''s/:/ /g'' /etc/passwd

    This command replaces all colons in all lines with a space.

    ```'
