    \ of scripts application is rather slow.<br>• It's not possible to do system programming\
    \ with scripting languages (such as operating systems or device drivers). |\n\
    | Compiler language | • The execution is very fast compared with scripting languages.<br>•\
    \ It is possible to do system programming (such as operating systems or device\
    \ drivers). | • Compiler languages can be difficult to learn.<br>• The development\
    \ process usually takes longer.<br>• The source code needs to be recompiled before\
