    # ## Configure the Client Computers to Use the DNS Server


    You can use YaST to configure a client computer during installation to use the
    DNS server (configuration of the network) or you can configure it later. You simply
    have to enter the IP address of the DNS server and possibly add some information
    about your domain.


    This information is written to the file /etc/resolv.conf, as in the following:


    ```

    search digitalairlines.com

    nameserver 10.0.0.254

    ```


    Normally, this file has the following two types of entries:


    +   - **search.** A list of the names of domains (or subdomains) is provided after
    this keyword. Several domain names are entered on one line. This allows only the
    host name to be used to resolve to the correct IP address.


    The host name is expanded by the domain names specified here until a matching
    IP address is found.


    For example, if you provide digitalairlines.com and atl.digitalairlines.com as
    domain names, the host DNS server is expanded to server.digitalairlines.com and
    server.atl.digitalairlines.com to look for a corresponding IP address. The first
    matching IP address is returned.


    If both of these host names exist, you have to specify the FQDN to resolve the
    IP address.


    +   - **nameserver.** The keyword nameserver specifies the IP address of a DNS
    server to use. You can have up to three entries, but each of them must contain
    only one server address. If several entries of this type exist, the DNS servers
    are queried in this order.


    There is another important file for the clients: /etc/nsswitch.conf. This file
    applies to all programs that use the resolver functions of the current GNU C Library
    (libc6). (The predecessor of this file is /etc/host.conf, which applies to older
    versions of the GNU C Library.)


    This file configures the name service switch, which is responsible for resolving
    host names, network names, users, and groups.


    The relevant part for resolving host names looks like the following:


    ```

    #

    # /etc/nsswitch.conf

    #

    ```'
