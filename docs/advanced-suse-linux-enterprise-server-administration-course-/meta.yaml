- img_proc: false
  md: "# Locate the Apache Configuration Files\n\nThe configuration of the Apache\
    \ Web server is spread over several configuration files located in the directory\
    \ /etc/apache2.\n\nThe following is a list of the most important Apache configuration\
    \ files:\n\n+   - **httpd.conf.** This is the main Apache configuration file.\
    \ All other configuration files are included with this file.\n- **default-server.conf.**\
    \ This file contains the basic Web server setup. However, all options set in this\
    \ file can be overwritten by other configuration files.\n- **vhost.d/.** This\
    \ is a directory containing configuration files for virtual host setups. You will\
    \ learn more about virtual hosts later in this section.\n- **uid.conf.** This\
    \ configuration file sets the user and group id for Apache. By default, Apache\
    \ uses the user id wwwrun and the group id www.\n- **listen.conf.** In this configuration\
    \ file, you can specify the IP addresses and TCP/IP ports Apache is listening\
    \ to. By default, Apache listens to all assigned interfaces on port 80.\n- **server-tuning.conf.**\
    \ You can use this configuration file to fine tune the performance of Apache.\
    \ The default values should be fine unless you are going to run a Web server that\
    \ has to handle a lot of requests at the same time.\n- **error.conf.** In this\
    \ file you configure the behavior of Apache when a request cannot be performed\
    \ correctly.\n- **ssl-global.conf.** Configure the connection encryption with\
    \ SSL in this configuration file.\n\n# Understand the Basic Rules of the Configuration\
    \ Files\n\nThe options of the Apache configuration files are called *directives*.\
    \ Directives are case sensitive, which means that a word such as \"include\" is\
    \ not the same as \"Include.\"\n\nDirectives can be grouped so that they do not\
    \ apply to the global server configuration. In the following, the directives only\
    \ apply to the directory /srv/www/htdocs:\n\n```\n<Directory \"/srv/www/htdocs\"\
    >\n    Options None\n    AllowOverride None\n    Order allow,deny\n    Allow from\
    \ all\n</Directory>\n```\n\nThe directives are grouped by <Directory “/srv/www/htdocs”>\
    \ and </Directory>, which limits their validity to the directory/srv/www/htdocs\
    \ only."
  merge: -1
  pgno: 153
- img_proc: false
  md: 'You can use the # character to indicate comments in the configuration file.
    All lines starting with a # are ignored by the Apache server.


    Whenever you edit the Apache configuration files, you need to reload the Web server
    by entering the following:


    ```

    rcapache2 reload

    ```


    In some cases it''s not enough to reload Apache. You need to stop and restart
    the Web server by entering the following:


    ```

    rcapache2 restart

    ```


    If you are not sure that your changes use the correct syntax, you can verify the
    syntax of the configuration files by entering the following:


    ```

    apache2ctl configtest

    ```


    If the syntax is correct, the command displays the following message:


    ```

    Syntax OK

    ```


    # The Basic Apache Configuration


    You do the main Apache Web server configuration in the file /etc/apache2/default-server.conf
    by using directives such as those shown in Table 3-5.


    Table 3-5


    | Directive | Description |

    | :--- | :--- |

    | DocumentRoot | Specifies the DocumentRoot of the Web server. |

    | Directory "dir_name"/Directory | All directives used within this block apply
    only to the specified directory. |

    | Options | With this directive, additional options can be applied to logical
    blocks like directories. |

    | AllowOverride | Determines whether other directives are allowed to be overwritten
    by a configuration found in a .htaccess file of a directory. |

    | Alias "fakename" "realname" | Allows you to create an alias to a directory.
    |

    | ScriptAlias | Allows you to create an alias to a directory containing scripts
    for dynamic content generation. |


    In most cases the default settings are suitable and don''t need to be changed.'
