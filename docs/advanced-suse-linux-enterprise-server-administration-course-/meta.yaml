  md: "This example t is also available as **yes_no.sh** in the directory /exercises/section_6\
    \ on your 3038 Course CD.\n\n# Create Loops Using the while and until Commands\n\
    \nThe purpose of a loop is to test a certain condition and to execute a given\
    \ command while the condition is true (while loop) or until the condition becomes\
    \ true (until loop).\n\nThe following is the structure of a while loop:\n\n```\n\
    while condition\n  do\n    commands\n  done\n```\n\nThe following is a structure\
    \ of until loop:\n\n```\nuntil condition\n  do\n    commands\n  done\n```\n\n\
    Figure 6-11 illustrates the loop constructs.\n\n![](bbox=[0.135, 0.52, 0.547,\
    \ 0.795])\n\n**Figure 6-11**\n\nThese loops actually rely on the exit status of\
    \ a terminating condition: a while loop remains operative as long as the condition's\
    \ exit status is zero (path B in the flow chart), but an until loop is terminated\
    \ if the status is zero (path A in the flow chart)."
