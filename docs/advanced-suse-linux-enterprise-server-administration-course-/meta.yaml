- img_proc: false
  md: '# INTRODUCTION


    As with any system, sometimes the performance of a SLES 9 system is not sufficient.
    Because of the complexity of today''s IT systems and infrastructure, performance
    bottlenecks are sometimes not easy to find. All components interact with each
    other, and different kinds of server types require different measures to improve
    system performance.


    In this section, you learn about monitoring utilities that help you find the component
    having performance problems.


    You also learn some hints for solving performance problems. Remember that the
    solutions for your problems need to be based on the result of your performance
    analysis and depend on your system type.


    No matter what measures you choose, make sure that all changes are well tested
    before you enable them on the actual production system. Changes to the kernel
    parameters need to be tested very carefully.


    > For more information about Linux performance tuning, go to www.redbooks.ibm.com/abstracts/redp3862.html?Open.


    # OBJECTIVE 1 Find Performance Bottlenecks


    If you need to tune system performance, it is usually because the system is too
    slow. Before you make any changes, you need to identify the bottleneck that is
    causing the performance problem.


    Complaints from users or customers about a slow system are normally of a general
    character and do not provide detailed information about the cause of a problem.


    Before you start to troubleshoot a system, you should ask for more information
    to gain a better overview about the whole situation. The following is a list of
    questions that can help you to find the performance bottleneck:


    +   - **What kind of server is affected?** This includes information about the
    hardware and the purpose of the server.

    - **What are the exact symptoms of a problem?** The more information you have,
    the more likely you are to determine the cause of a problem.

    - **Does the problem occur at specific times of the day or the week?** For example,
    performance problems might occur in the morning when people start to work or after
    lunch break when people return to work.'
  merge: -1
  pgno: 349
- img_proc: false
  md: '+   - **When and how did the problem start?** Did the problem occur quickly
    or slowly over several days or months?

    - **Who is experiencing the problems?** Does just one person have the problem,
    or is it a group of people who are using the same file server?

    - **Can the problem be reproduced?** This can be very helpful when you are analyzing
    the system.


    When you have gathered enough information, you can start to analyze the system
    by doing the following;


    +   - Analyze Processes and Processor Utilization

    - Analyze Memory Utilization and Performance

    - Analyze Storage Performance

    - Analyze Network Utilization and Performance


    # Analyze Processes and Processor Utilization


    When you have a performance problem, you should look at the processor utilization
    first. If the processor is not fast enough to run all of your applications at
    a reasonable speed, this is the bottleneck you have to work on.


    One way to measure processor utilization is the system load. The load value can
    be displayed with various monitoring tools such as top or uptime.


    On a multiprocessing operating system like Linux, multiple processes can run virtually
    simultaneously. Since one processor can run only one process at a time, the Linux
    kernel splits the available processing time of a CPU into short slices that are
    assigned to the running processes.


    To assign the CPU time, the kernel puts the running processes into a queue. Depending
    on the priority of a process and the time since it was executed last, the kernel
    decides which process should be executed next.


    The load value is basically the average number of waiting processes in the process
    queue in a specific amount of time. Therefore programs like top or uptime display
    load values for the last 1, 5, and 15 minutes.


    On a system with a single processor, an average load value of 1 means that the
    full processing capacity is used by applications and the operating system.


    If the value is lower than 1, some capacity is not used. If the average value
    is higher than 1, the processor is not fast enough to handle all currently running
    processes.'
  merge: -1
  pgno: 350
- img_proc: false
  md: '> > **CAUTION**

    >

    > On a multiprocessor system, the load value can be higher. As a rule of thumb,
    the load value should not be higher than the number of processors installed in
    the system.


    A process that is started on a system does not always require CPU time. Depending
    on the kind of the process it is running, the CPU spends quite a lot of time waiting
    for I/O processes to be finished. For example, an I/O process can be user input
    or data that is read from or written to the hard disk.


    During these times the processes are not waiting in the kernel''s process queue
    and do not influence the load value of a system. This means that an application
    can be slow, but CPU time is not the reason for it.


    Table 8-1 is a list of monitoring utilities that can be used to display the current
    CPU utilization and the average load values.


    # Table 8-1


    | Program | Description |

    | :--- | :--- |

    | top | Displays a sorted list of applications and the three values for the average
    load values in the last 1, 5, and 15 minutes.<br><br>When you find that your system
    has a high load value, top can also be very helpful to find out which application
    is actually producing it. |

    | uptime | uptime can also be used to display the system load in the last 1, 5,
    and 15 minutes. |

    | mpstat | On multiprocessor systems, mpstat can be used to display the utilization
    of each installed processor. |

    | KDE System Guard | KDE System Guard displays a graphical representation of the
    system load. |


    # Analyze Memory Utilization and Performance


    Another bottleneck for system performance can be caused by system memory. Applications
    have to be loaded into memory before they can be executed by the CPU. The memory
    is also used by the Linux kernel itself and for caching I/O operations like network
    or storage access.


    The memory is controlled by the Memory Management system of the Linux kernel.
    Every application has to ask the kernel to allocate memory, and every application
    is only allowed to write into its own memory space.'
  merge: -1
  pgno: 351
- img_proc: false
  md: "There are two different kinds of memory available on a Linux system:\n\n+ \
    \  - **Physical memory.** This is memory that is actually installed in the system\
    \ in the form of memory bars or chips. Access to this kind of memory is usually\
    \ very fast.\n- **Swap memory.** A Linux system should have access to at least\
    \ one swap partition. The space on this partition is used to free parts of the\
    \ physical memory by copying temporarily unused memory pages. Access to swap memory\
    \ is very slow compared to physical memory.\n\nYou can view the utilization of\
    \ the physical and the swap memory with the free program by entering the following:\n\
    \n```\nfree\n```\n\nThe output looks like the following:\n\n| total | used | free\
    \ | shared | buffers | cached |\n|---|---|---|---|---|---|\n| Mem: | 516204 |\
    \ 502080 | 14124 | 0 | 29356 | 154920 |\n| -/+ buffers/cache: | 317804 | 198400\
    \ | | | | |\n| Swap: | 1036152 | 143320 | 892832 | | | |\n\nThe output contains\
    \ a headline with three lines of information:\n\n+   - **Mem.** This line contains\
    \ information about the physical memory. It contains the following details:\n\
    \  - **total.** This entry displays the total amount of available physical memory\
    \ in KBs. The number is lower than the installed physical memory, since the kernel\
    \ itself uses a small part of the memory.\n  - **used.** This entry displays the\
    \ amount of memory that is used for applications cached data.\n  - **free.** This\
    \ entry displays the memory that is not used and available at the moment.\n  -\
    \ **Shared/buffers/cached.** These columns display more detailed information about\
    \ how the memory is used.\n- **-/+ buffers/cache.** Some of the memory on a Linux\
    \ system is used to cache data for applications or devices. Parts of this memory\
    \ can be freed when it is needed for other purposes.\n\nThe free column displays\
    \ the buffer adjusted line, which shows the memory that would be used and available\
    \ if the buffer and the cache were freed.\n- **Swap.** This line shows informations\
    \ about the utilization of the swap memory. The information includes the amount\
    \ of total, used, and free available memory.\n\nAs accessing the hard disk is\
    \ much slower than accessing physical memory, the performance of the whole system\
    \ is affected when a lot of swap space has to be used."
  merge: -1
  pgno: 352
- img_proc: false
  md: "Usually this happens when there is not enough physical memory to perform the\
    \ desired functionality of a system. It can also happen if an application requests\
    \ much more memory than it actually needs.\n\nThis can happen when the application\
    \ crashes. It can also happen during normal operation, when the implementation\
    \ of the program is faulty. In this case, the application has a *memory leak*.\n\
    \nYou can use the top command to find programs that use a lot of memory. By default,\
    \ top sorts the process list by CPU utilization. By typing **F**, **n**, and then\
    \ pressing the **Enter** key, you can change the sorting column memory utilization.\
    \ This way the top memory consumers can be found at the top of the list.\n\nIf\
    \ a lot of used swap memory is displayed in free, this can indicate a performance\
    \ bottleneck caused by a lack of physical memory but is not always the case. Sometimes\
    \ a lot of memory is copied to the swap partition but is never touched again.\
    \ The performance of the system is only affected when the swap memory is actually\
    \ accessed.\n\nYou can use the command vmstat to display the activity of swap\
    \ memory, as in the following:\n\n```\nvmstat 1\n```\n\nThe option 1 lets vmstat\
    \ repeat its output every second. This way the usage of swap memory can be displayed\
    \ over a period of time. You can terminate the program pressing **Ctrl+C**.\n\n\
    The output of vmstat looks like the following:\n\n```\nprocs  ----------memory----------\
    \  -swap-  --io--  -system-  ----cpu----\n r  b    swpd   free   buff  cache \
    \  si   so    bi    bo   in   cs us sy id wa\n 0  0    4  6728 34464 244744  \
    \   0    0  447    42  1216  384 15  3  74  7\n 0  0    4  6728 34464 244744 \
    \    0    0    0     0  1186  222  1  1  98  0\n 0  0    4  6760 34464 244744\
    \     0    0    0     0  1282  299  3  0  97  0\n 0  0    4  6696 34532 244744\
    \     0    0    0    68  1139  147  1  1  97  1\n 0  0    4  6696 34532 244744\
    \     0    0    0     0  1105  123  0  0  98  0\n 0  0    4  6696 34532 244744\
    \     0    0    0     0  1117  131  0  0  98  0\n```\n\nThe output in the columns\
    \ si and so are of interest in this case. si stands for swap in, which means that\
