    # Select the Software


    SLES 9 contains a number of software packages for various application purposes.
    Instead of selecting needed packages one by one, you can select from four system
    types with various installation scopes.


    Depending on the available disk space, YaST selects one of the following predefined
    systems and displays it in the installation proposal:


    +   - **Minimal System** (recommended only for special purposes). This includes
    the core operating system with various services, but without any graphical user
    interface. Select this system type for servers that require little direct user
    interaction.

    - **Minimal Graphical System** (without KDE). If you do not want the KDE desktop
    or if there is insufficient disk space, install this system type. The installed
    system includes the X windows system and a basic window manager. You can use all
    programs that have a graphical user interface.

    - **Default System** (with KDE). This system type includes the KDE desktop, most
    of the KDE programs, and the CUPS print server. If possible, YaST selects this
    system type by default.

    - **Full Installation.** This system type includes all packages that ship SLES
    9, except those that create dependency conflicts.


    You need to understand the following terms to understand YaST software management:


    +   - **Package.** An RPM file, which is available on the SLES 9 installation
    media; a package typically contains an application and all additional files required
    to use the software.


    Sometimes larger applications can be split into multiple packages and several
    small applications can be bundled into a single package.'
