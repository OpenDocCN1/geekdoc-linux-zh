  md: '# # 404 Glossary


    **tar (tape archiver) command** — Used to create and extract tar archives. Tar
    archives are commonly used to store source code that is distributed on the Internet.


    **test command** — Used to create a condition that returns a true (successful)
    or false (unsuccessful) exit status.


    **testparm command** — Checks the syntax of /etc/samba/smb.conf.


    **Time To Live (TTL)** — A number used to represent the useful life of an IP packet.
    Each router decrements the TTL of packets it forwards to other networks. When
    the TTL of a packet reaches 0 it is discarded.


    **top command** — Displays the system load as well as the processes that use the
    most CPU time and memory.


    **Top Level Domain (TLD)** — The first level of names underneath the root domain
    in DNS.


    **tr command** — Used to substitute or delete characters from strings of data.


    **traceroute command** — Used to identify the route an IP packet takes to a remote
    host.


    **Traffic-vis** — A software utility that may be used to monitor the performance
    of network interfaces on individual hosts.


    **umask** — A special system variable used to set permissions on newly created
    files and directories.


    **umask command** — Used to set the umask variable.


    **Universal Naming Convention (UNC)** — A format used to specify a shared resource
    on a Windows or Samba computer (i.e., \\servernamesharename).


    **until** — A loop control structure that executes a series of commands repetitively
    until a certain condition returns a true (successful) exit status.


    **uptime command** — Displays the time the system has been active as well as the
    system load.


    **User Datagram Protocol (UDP)** — A part of the TCP/IP protocol suite that provides
    fast but unreliable communication between hosts on a network.


    **User Level Security** — A Samba share security level that requires a valid Linux
    login in order to access a shared directory.


    **user space driver** — A program that runs in user space and functions as a device
    driver.


    **variable** — A value stored in memory and used by the Linux shell.


    **variable substitution operators** — Used to modify the contents of a shell variable.


    **virtual host** — An additional Web site that is hosted by a Web server.


    **vmstat command** — Displays memory, process, swap, system, CPU, and I/O statistics.


    **Web browser** — A program that can obtain Web content from a Web server.


    **Web server** — A service that provides Web content to client computers that
    have a Web browser.


    **while** — A loop control structure that executes a series of commands repetitively
    while a certain condition returns a true (successful) exit status.


    **workgroup** — A name that identifies a group of computers in a Windows network
    that are not part of a domain.


    **YaST** — The main system configuration utility in SUSE Linux. It is also used
    to perform the SUSE Linux installation process. YaST stands for Yet another Setup
    Tool.


    **YaST Online Update (YOU)** — A YaST module that may be used to obtain patches
    for SLES from the SUSE Web servers.


    **zone** — A specific domain in DNS represented by a file on a DNS server that
    contains the records used for name resolution.


    **zone transfer** — The process whereby a master DNS server sends zone information
    to a slave DNS server.'
