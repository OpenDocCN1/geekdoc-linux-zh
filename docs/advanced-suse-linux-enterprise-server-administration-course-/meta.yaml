  md: '# Obtaining System Hardware Information


    Using the files and commands in this chapter, prepare a detailed log of the types
    of hardware devices in your computer and the resources that they use (IRQ, I/O
    Address, DMA). Next, insert any hotplug devices into your system and note their
    configuration. In your log, identify the source of the information for future
    reference.


    # Disabling Hotplug Agents


    In some cases, it may be preferable to prevent the hotplug system from automatically
    configuring a hardware device. In those cases, you can locate the kernel module
    and add it to the /etc/hotplug/blacklist file. Locate a module on your system
    that was configured using the hotplug system and add the module to the /etc/hotplug/blacklist
    file. Following this, reboot your computer and plug the hotplug device into your
    computer. Verify that the module was not automatically loaded.'
  merge: -1
