  md: '# Glossary


    **Secure Sockets Layer (SSL)** — A technology that uses public and private keys
    to encrypt Web content as it is being sent between a Web server and Web browser.


    **security concept** — A comprehensive security plan for an organization.


    **security policy** — The security requirements, policies, and procedures used
    by an organization.


    **sed command** — Used to edit text files using a search and replace syntax.


    **Server Level Security** — A Samba share security level that requires a valid
    login to another server in order to access a shared directory.


    **Server Message Block (SMB)** — A file and printer sharing protocol used by Windows
    systems.


    **Set Group ID (SGID)** — A special permission set on executable files and directories.
    When you run an executable program that has the SGID permission set, you become
    the group owner of the executable file for the duration of the program. On a directory,
    the SGID sets the group that gets attached to newly created files.


    **Set User ID (SUID)** — A special permission set on executable files. When you
    run an executable program that has the SUID permission set, you become the owner
    of the executable file while the program is running.


    **setfacl command** — Used to set the ACL on a file or directory.


    **sh command** — Used to execute shell scripts that have read permission for the
    current user.


    **Share Level Security** — A Samba share security level that requires a password
    in order to access a shared directory.


    **shared library** — A file on a hard disk that contains useful functions. Shared
    libraries are loaded into memory during program execution.


    **shares** — Shared directories or printers on a Windows or Samba computer.


    **shebang** — The first line of a script that starts with #! and denotes the shell
    used to interpret the commands within the shell script.


    **shell built-in command** — A command that is part of the shell executable (i.e.
    /bin/bash).


    **shell function** — A reusable series of commands within a shell script that
    may be executed by name.


    **shell script** — A text file that contains Linux commands that may be executed
    by a Linux shell.


    **slappasswd command** — Used to generate an encrypted password that may be used
    in the OpenLDAP configuration files.


    **slave server** — A DNS server that contains a read-only copy of the zone database
    obtained from a master server via a zone transfer.


    **smbclient command** — Used to view and access Windows and Samba file and printer
    shares.


    **smbd** — The Samba daemon.


    **smbpasswd command** — Sets a Windows-formatted password for Linux user accounts.


    **Software RAID** — A RAID implementation that is managed by operating system
    software.


    **Start Of Authority (SOA)** — A DNS record that identifies zone-specific information
    and zone transfer settings.


    **Sticky bit** — A special permission set on directories that prevents users from
    removing files that they do not own.


    **Storage Area Network (SAN)** — A private network that is used to back up data
    from servers and that includes network-attached storage devices.


    **subdomain** — The name in DNS that identifies a division of an organization
    and which exists under the domain and TLD.


    **subroutine** — See **shell function**.


    **swap memory** — Space on the swap partition used by applications when physical
    memory is unavailable.


    **sysctl command** — Used to view and set kernel configuration parameters.


    **sysfs** — The system file system. It is a virtual file system used by the /sys
    directory.


    **system load** — An overall measurement of the number and throughput of processes
    on a system.'
  merge: -1
  pgno: 420
