  md: "# Objective 5 Save Routing Settings to a Configuration File\n\nRouting settings\
    \ made with the ip tool are lost when you reboot your system. Settings have to\
    \ be written to configuration files to be restored at boot time.\n\nRoutes to\
    \ the directly connected network are automatically set up when a device is started.\
    \ All other routes are saved in the configuration file `/etc/sysconfig/network/routes`.\n\
    \nThe following shows the content of a typical configuration file:\n\n```\n149.44.171.0\
    \ 10.0.0.100 255.255.255.0 eth-id-00:30:05:4b:98:85\ndefault 10.0.0.8 - -\n```\n\
    \nEach line of the configuration file represents an entry in the routing table.\
    \ Each line is shown and explained below:\n\n+   - **149.44.171.0 10.0.0.100 255.255.255.0\
    \ eth-id-00:30:05:4b:98:85**\n\n  All packets sent to the network **149.44.171.0**\
    \ with the network mask **255.255.255.0** are sent through the gateway **10.0.0.100**\
    \ through the device with the id **eth-id-00:30:05:4b:98:85**. The id is the same\
    \ as used for the device configuration file.\n\n- **Default 10.0.0.8 - -**\n\n\
    \  This entry represents a default route. All packets that are not affected by\
    \ the previous entries of the routing table are sent through the gateway **10.0.0.8**.\
    \ It's not necessary to fill out the last two columns of the line for a default\
    \ route.\n\nTo apply changes to the routing configuration file, you need to restart\
