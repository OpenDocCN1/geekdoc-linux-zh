  md: '# # Section 1 Install SLES 9


    +   - **Rescue System.** Starts the SLES 9 rescue system. If you cannot boot your
    installed Linux system, you can boot the computer from the CD or DVD and select
    this option. This starts a minimal Linux system without a graphical user interface
    to allow experts to access disk partitions for troubleshooting and repairing an
    installed system.

    - **Memory Test.** Starts a memory testing program, which tests system RAM by
    using repeated read and write cycles. This is done in an endless loop, because
    memory corruption often shows up sporadically and many read and write cycles might
    be necessary to detect it.


    If you suspect that your RAM might be defective, start this test and let it run
    for several hours. If no errors are detected, you can assume that the memory is
    intact. Terminate the test by rebooting the system.


    Use the function keys, as indicated in the bar at the bottom of the screen, to
    change a number of installation settings:


    +   - **F1.** Opens context-sensitive help for the currently selected option of
    the boot screen.

