  md: '# Introduction


    In this section you learn how to install and configure four of the most popular
    Linux network services at the command line:


    +   - BIND

    - OpenLDAP

    - Apache

    - Samba


    Because configuring the services can be very complex, this section covers only
    the basic functionality of the services.


    The configuration is covered at the command-line level to show you a more direct
    way to manipulate the behavior of the services.


    The services as described in this section should be used within an internal network.
    You should make the services accessible from the Internet only if you have sufficient
    knowledge about network security.


    # Objective 1 Configure a DNS Server Using BIND


    The Domain Name System (DNS) is one of the most important network services. Without
    DNS, it would be difficult, if not impossible, to work with networked computers.


    To configure a DNS server (also called a name server) using the most popular software
    BIND (Berkeley Internet Name Domain), you need to:


    +   - Understand the Domain Name System

    - Install and Configure the BIND Server Software

    - Configure a Caching-Only DNS server

    - Configure a Master Server for Your Domain

    - Configure One or More Slave Servers

    - Configure the Client Computers to Use the DNS Server

    - Use Command-Line Tools to Query DNS Servers

    - Find More Information About DNS'
  merge: -1
