  md: "# Section 5 Manage Backup and Recovery\n\nMagnetic tape drives used under Linux\
    \ are always SCSI devices and can be accessed with the following device names:\n\
    \n+   - /dev/st0. Refers to the first tape drive.\n- /dev/nst0. Addresses the\
    \ same tape drive in the no rewind mode. This means that after writing or reading,\
    \ the tape remains at that position and is not rewound back to the beginning.\n\
    \nFor reasons of compatibility with other UNIX versions, two symbolic links exist:\
    \ /dev/rmt0 and /dev/nrmt0.\n\nYou can query the status of the tape by entering\
    \ the following command:\n**mt -f /dev/st0 status**\n\nIn this example, the -f\
    \ option is used to indicate the device name of the tape drive. The command status\
    \ displays the status of the tape drive.\n\nThe output of the command looks like\
    \ the following:\n\n```\ndrive type = Generic SCSI-2 tape drive\nstatus = 620756992\n\
    sense key error = 0\nresidue count = 0\nfile number = 0\nblock number = 0\nTape\
    \ block size 0 bytes. Density code 0x25 (unknown). Soft error count since last\
    \ status=0\nGeneral status bits on (41010000):\n  BOT ONLINE IM_REP_EN\n```\n\n\
    The most important information in this example is the file number (file number,\
    \ starting at 0) and the block numbers (block number, starting at 0).\n\nThese\
    \ parameters determine the position of the tape. In this example, the tape is\
    \ positioned at the beginning of the first file.\n\n> The file count starts with\
    \ 0.\n\nTo position the tape at the beginning of the next file, use the following\
    \ command:\n**mt -f /dev/nst0 fsf 1**\n\nIn this example, the command fsf forwards\
    \ the tape by the given number of files, and the tape will start before the first\
    \ block of the second file."
  merge: -1
  pgno: 257
- img_proc: false
  md: "This can be verified with the status command, as in the following:\n\n```\n\
