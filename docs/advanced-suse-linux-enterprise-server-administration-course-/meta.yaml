  md: "**logical volume group** — A group of physical partitions that is defined by\
    \ the logical volume manager. These groups can span multiple hard disks.\n\n**Logical\
    \ Volume Manager (LVM)** — A hard disk partitioning scheme in which partitions\
    \ are managed by system services and can be resized easily.\n\n**Network Information\
    \ Service (NIS)** — A network service that may be used to manage the configuration\
    \ of several Linux or UNIX computers.\n\n**primary partition** — A main division\
    \ of a hard disk. There are four available primary partitions.\n\n**Redundant\
    \ Array of Inexpensive Disks (RAID)** — A series of methods for storing data on\
    \ different hard disks to improve performance and provide fault tolerance.\n\n\
    **Software RAID** — A RAID implementation that is managed by operating system\
    \ software.\n\n**YaST** — The main system configuration utility in SUSE Linux.\
