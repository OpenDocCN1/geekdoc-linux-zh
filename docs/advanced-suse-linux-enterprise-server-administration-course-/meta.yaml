  md: '# Configure Name Resolution


    The name resolution is configured in the file /etc/resolv.conf.


    The content of the file is similar to the following:


    ```

    search digitalairlines.com

    nameserver 10.0.0.1

    nameserver 10.10.0.1

    nameserver 10.0.10.1

    ```


    The file contains two types of entries:


    +   - **search.** The domain name in this option is used to complete incomplete
    host names. For example, if you look up the host name da3, the name is automatically
    completed to the fully qualified domain name da3.digitalairlines.com.

    - **nameserver.** Every entry starting with nameserver is followed by an IP address
    of a name server. You can configure up to three name servers. If the first name
    server fails, the next one is used.


    # OBJECTIVE 7 TEST THE NETWORK CONNECTION WITH COMMAND-LINE TOOLS


    After the network is configured, you might want to test the network connection
    by doing the following:


    +   - Use ping to Test Network Connections

    - Use traceroute to Trace Network Packets


    # Use ping to Test Network Connections


    The tool ping lets you check network connections in a simple way between two hosts.
    If the ping command works, then both the physical and logical connections are
    correctly set up between the two hosts.


    The ping command sends special network packets to the target system and waits
    for a reply. In the simplest scenario, you enter ping with an IP address:


    **ping 10.0.0.1**


    You can also use the host name of the target system instead of an IP address.
    The output of ping looks similar to the following:


    ```

    PING 10.0.0.1 (10.0.0.1) 56(84) bytes of data.

    64 bytes from 10.0.0.1: icmp_seq=1 ttl=60 time=2.95 ms

    64 bytes from 10.0.0.1: icmp_seq=2 ttl=60 time=2.16 ms

    64 bytes from 10.0.0.1: icmp_seq=3 ttl=60 time=2.18 ms

    64 bytes from 10.0.0.1: icmp_seq=4 ttl=60 time=2.08 ms

    ```'
  merge: -1
  pgno: 97
- img_proc: false
  md: 'Each line of the output represents a packet sent by ping. Ping keeps sending
    packets until it''s terminated by pressing **Ctrl+C**.

    The output displays the following information:


    +   - The size of an ICMP datagram (64 bytes)

    - The IP address of the target system (from 10.0.0.1)

    - The sequence number of each datagram (seq=1)

    - The TTL (time to live) of the datagram (ttl=60)

    - The amount of time that passes between the transmission of a packet and the
    time a corresponding answer is received (time=2.95 ms). This time is also called
    the Round Trip Time.


    If you get an answer from the target system, you can be sure that the basic network
    device setup and routing to the target host works.

    Table 2-1 provides some options for ping you can use for advanced troubleshooting.


    | Option | Description |

    | :--- | :--- |

    | **-c count** | The number of packets to be sent. After this number has been
    reached, ping is terminated. |

    | **-I device_addr** | Specifies the network device to be used on a computer with
    several network devices. |

    | **-i seconds** | Specifies the number of seconds to wait between individual
    packet shipments. The default setting is 1 second. |

    | **-f** | (Flood ping) Packets are sent one after another at the same rate as
    the respective replies arrive. Only root can use this option. For normal users
    the minimum time is 200 milliseconds. |

    | **-l preload** | Sends packets without waiting for a reply. |

    | **-n** | The numerical output of the IP address. Address resolutions to host
    names are not carried out. |

    | **-t ttl** | Sets the Time To Live for packets to be sent. |

    | **-w maxwait** | Specifies a timeout in seconds, before ping exits regardless
    of how many packets have been sent or received. |

    | **-b** | Sends packets to the broadcast address of the network. |


    # Use traceroute to Trace Network Packets


    The diagnosis tool traceroute is primarily used to check the routing between different
    networks. To achieve this task, traceroute sends packets with an increasing TTL
    value to the destination host, whereby three packets of each value are sent.


    Traceroute also uses UDP packets, which are called *datagrams*.'
  merge: -1
  pgno: 98
- img_proc: false
  md: 'First, three datagrams with a TTL=1 are sent to the host, then three packets
    with a TTL=2 are sent, and so on. The TTL of a datagram is reduced by one, every
    time it passes through a router.


    When the TTL reaches zero, the datagram is discarded and a message is sent to
    the sender. Because the TTL is increased by one every three packets, traceroute
    can collect information about every router on the way to the destination host.


    You normally include a host name with the traceroute command, as in the following:


    **traceroute pluto.example.com**


    It''s also possible to use an IP address instead of the host name. The output
    of traceroute looks similar to the following:


    ```

    traceroute to pluto.example.com (192.168.2.1), 30 hops max, 40 byte packets

    1 sun.example.com (192.168.0.254) 0 ms 0 ms 0 ms

    2 antares.example.com (192.168.1.254) 14 ms 18 ms 14 ms

    3 pluto.example.com (192.168.2.1) 19 ms * 26 ms

    ```


    The first line of the output displays general information about the traceroute
    call. Each of the lines that follow represents a router on the way to the destination
    host. Every router is displayed with the host name and IP address.


    Traceroute also displays information about the round trip times of the three datagrams
    returned by every router. The last line of the output represents the destination
    host itself.


