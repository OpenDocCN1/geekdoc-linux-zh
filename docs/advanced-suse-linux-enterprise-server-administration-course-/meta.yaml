  md: "# Configuring a Samba Domain Controller\n\nOn the Internet, research the steps\
    \ required to use your Samba server as a Windows domain controller. Next, log\
    \ into tty1 as the root user and configure your Samba service as a domain controller\
    \ by editing your /etc/samba/smb.conf file. The minimum lines required in this\
    \ file are:\n\n```\n[global]\n    domain logons = yes\n    security = user\n \
    \   encrypt passwords = yes\n    wins support = yes\n    netbios name = _______________\n\
    \    workgroup = _______________     (put your domain name here)\n\n[netlogon]\n\
    \    path=/netlogon (create this directory with permissions 777)\n    public =\
    \ no\n    writable = no\n    locking = no\n```\n\nNext, create a new user on the\
    \ system (**useradd — m testuser**) and give them an encrypted password in the\
    \ samba database (**smbpasswd testuser**). Following this, add computer accounts\
    \ for each Windows XP computer that will be joining the domain on your Linux computer\
    \ by adding a line to /etc/passwd and /etc/shadow that lists the computer-name\
    \ followed by a $ character as shown below:\n\n```\n/etc/passwd sample line:\n\
    clientcomputername$:x:5000:5000::/dev/null:/bin/false\n\n/etc/shadow sample line:\n\
    clientcomputername$:*:6445:::::::\n```\n\nWhen finished, test your configuration\
