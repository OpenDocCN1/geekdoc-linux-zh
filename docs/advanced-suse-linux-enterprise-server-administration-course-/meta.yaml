  md: '10 Section 1 Install SLES 9


    # Introduction


    YaST presents an installation proposal (automatically generated during installation)
    that you can accept to make installation simple and quick.


    However, you also need to understand the more advanced installation options available.
    By changing the following installation proposal options, you can install servers
    that meet a variety of needs:


    +   - Installation mode

    - Partitioning scheme

    - Software selection

    - Authentication method

    - Hardware setup


    This section describes these and other SLES 9 installation options.


    # Objective 1 Perform the SLES 9 Base Installation


    Installing SLES 9 consists of a base installation phase and a configuration phase.

    To perform the base installation do the following:


    +   - Boot from the Installation Media

    - Select the System Language

    - Select the Installation Mode

    - Understand and Change the Installation Proposal

    - Partition the Hard Disk

    - Select the Software

    - Configure the Boot Loader

    - Start the Installation Process


    # Boot from the Installation Media


    To start the installation process, insert the SLES 9 DVD into the DVD drive and
    then reboot the computer to start the installation program.'
