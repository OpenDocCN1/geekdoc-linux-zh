  md: '# Glossary


    **Access Control List (ACL)** — A file attribute that allows additional user and
    group definitions to be added to the permission mode of the file.


    **break command** — Used to force a loop control structure to exit and resume
    on the next line following the loop control structure in a shell script.


    **access matrices** — A table that compares the types of workstation computers
    within an organization, the servers that they require access to, and the technologies
    involved.


    **broadcast** — A message destined for all computers on an IP network.


    **address** — See IP address.


    **cache** — An area of memory that stores information obtained from resolving
    DNS names. Entries are kept in the cache for the time period specified by the
    TTL.


    **Address record (A)** — A DNS record that identifies hosts within a domain.


    **caching-only server** — A DNS server that is not authoritative for any zones.
    It only answers DNS queries when the answers come from other DNS servers.


    **Advanced Configuration and Power Interface (ACPI)** — A standard that allows
    the operating system to control the power used by system components.


    **Canonical NAME (CNAME)** — An alias for an A record in DNS.


    **Apache** — The default Web server software in SLES.


    **case** — A decision control structure that may be used to execute one of several
    different sets of commands depending on the value of a variable.


    **argument** — A parameter that may be used to pass information to a function
    when it is executed.


    **cat command** — Used to display the contents of files.


    **ARPAnet** — The network that led to the development of the Internet. It stands
    for Advanced Research Projects Agency Network.


    **certificate** — A public key that has been digitally signed by a CA.


    **authoritative answer** — A name resolution response from a DNS server whereby
    the DNS server contained the appropriate record in its zone database.


    **Certificate Authority (CA)** — An organization that digitally signs public keys
    to verify the organization that produced them.


    **backtick (\`) character** — Used to denote an executable command within another
    command string for command substitution.


    **chkconfig command** — Used to list and configure daemons to start in a certain
    runlevel.


    **backup window** — The amount of time available to back up data. The backup window
    is not normally performed during working hours.


    **coldplug** — A script that detects and configures hotplug devices at system
    initialization.


    **barrier** — A device that restricts the flow of data, such as a firewall or
    file access restriction.


    **collision** — An event that leads to the destruction of a packet of information
    on a network. Congested networks have a high number of collisions; this results
    in a large number of retransmitted packets and poor network performance.


    **Berkeley Internet Name Domain (BIND)** — The reference implementation for DNS.


    **collision domain** — The area of a network where collisions are more likely
    to occur. A collision domain is typically a LAN that uses the same device interconnect
    method.


    **Blowfish** — An encryption method used to encrypt Linux passwords.


    **command substitution** — The processing of executable commands within other
    executable commands.


    **boot loader** — The program used to load and start the operating system kernel
    at system startup.


    **compiler** — A program that translates instructions from a text file into a
    binary executable program.


    **bottleneck** — A component that slows the transfer of data. CPUs, memory, hard
    disks, and network interfaces are common bottlenecks in computer systems.'
