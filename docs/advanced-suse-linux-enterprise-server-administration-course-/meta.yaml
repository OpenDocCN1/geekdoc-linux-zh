    When you are finished with this dialog box, select **Next**.


    **Change an Existing Configuration** After configuring a network card manually,
    or selecting an automatically detected card, the Network Setup dialog box appears
    with the following options:


    - **Automatic Address Setup (via DHCP).** If your network has a DHCP server, you
    can set up your network address automatically. You should also use this option
    if you are using a DSL line with no static IP address assigned by the ISP.


    If you decide to use DHCP, you can configure the details after selecting **DHCP
    Client Options** from the Advanced drop-down list. Specify whether the DHCP server
    should always broadcast its responses and any identifier to use.


