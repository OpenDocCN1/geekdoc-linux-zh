  md: '# 400 Glossary


    **hwup command** — Used to configure the device driver and interface for a device.


    **HyperText Markup Language (HTML)** — The format of information that is processed
    by Web browsers.


    **HyperText Transfer Protocol (HTTP)** — The protocol used to obtain HTML Web
    pages and other Web content from a Web server.


    **if** — A decision control structure that executes certain commands if a condition
    returns true.


    **ifdown command** — Used to deactivate a network interface.


    **ifup command** — Used to activate a network interface.


    **ifup command** — Used to configure the interface for a network device.


    **incremental backup** — A backup of all data on the file system that has been
    modified since the last backup.


    **init** — The first process started by the Linux kernel; it is responsible for
    starting and stopping other processes.


    **init command** — Used to change the system runlevel.


    **initrd** — The init ramdisk program that is used to load device drivers at the
    onset of system initialization.


    **Input/Output (I/O) Scheduler** — A system component that executes disk requests
    for applications.


    **insserv command** — Used to configure system services to start in certain system
    run levels.


    **interface** — A logical representation of a device used by software.


    **interface agent** — A hotplug agent that creates and/or configures an interface
    for a hotplug device.


    **Internet Control Message Protocol (ICMP)** — A part of the TCP/IP protocol suite
    that is used to relay information about network communications.


    **Internet Protocol (IP)** — The protocol used to communicate with other computers
    on the Internet and most other networks.


    **Internet Protocol (IP) address** — A unique address used to identify a computer
    on a TCP/IP network.


    **iostat command** — Displays application, CPU, and I/O statistics for disk devices.


    **ip command** — Used to view, configure, and manage network interfaces and the
    routing table.


    **IPv4** — The current version of the TCP/IP protocol suite.


    **IPv6** — A new version of the TCP/IP protocol suite that contains a larger address
    space and improvements to routing and security.


    **John the Ripper** — A common password checking program available on the Internet.


    **journaling** — A file system feature that stores file system events in a journal
    file in case of system failure.


    **KDE System Guard** — A graphical utility that can monitor the performance of
    almost all system hardware components.


    **kernel module** — A software component that is inserted into the Linux kernel.
    Kernel modules are usually device drivers.


    **ldapadd command** — Used to create objects in an OpenLDAP database using entries
    in an LDIF file.


    **ldapdelete command** — Used to remove an LDAP object from an LDAP database.


    **ldapmodify command** — Used to modify objects in an OpenLDAP database using
    entries in an LDIF file.


    **ldapsearch command** — Used to query LDAP databases.


    **LDIF** — The format of files that are used to create, modify, and query objects
    in an LDAP database. It stands for Lightweight Directory Interchange Format.


    **let command** — Performs integer arithmetic operations.


    **Lightweight Directory Access Protocol (LDAP)** — A software protocol used to
    locate resources in a network directory database.


    **link** — A connection between a network device and the network.'
