    # DISCOVERY EXERCISES


    # Checking for Memory Errors


    ![](bbox=[0.085, 0.785, 0.145, 0.835])


    During the interactive and non-interactive sections of a SLES installation, your
    computer may suddenly reboot, hang, or display a Fatal Signal 11 (Segmentation
    Fault) error. Although these problems may be the result of incompatible or malfunctioning
    hardware devices, they are most often the result of defective RAM. The SLES installation
    program can use all of the available locations in your RAM during the installation
    process. Hence, even if your system worked well before you started the SLES installation,
    the installation program may still'
  merge: -1
  pgno: 81
- img_proc: false
  md: 'detect bad locations in your RAM. As a result, it is good form to use the memtest86
    utility that is included on your SLES DVD to check your RAM before starting the
    installation. Boot your computer from the SLES DVD and select **Memory Test**
    from the menu to run the memtest86 utility on your computer. Were any errors found?
    When one full series of tests has been performed, press **Esc** to stop the utility.


    ![](bbox=[0.035, 0.186, 0.096, 0.252])


    # ## Preparing for Installation


    When implementing any technology, failing to plan is planning to fail. The same
    is true of a Linux installation. Prior to installing SLES, you should complete
    a pre-installation checklist that outlines the hardware present in your computer
    as well as the main configuration choices that you will select during the installation
    process. These include partition, file system, and software package configuration
    and should be planned carefully according to the computer role and future expansion.
    Prepare a short pre-installation checklist that includes this information for
    your SLES system.


    ![](bbox=[0.035, 0.378, 0.096, 0.444])


    # ## Text-based Installation


    Some video adapter cards are incompatible with the SLES installation program.
    In this case, you can install SLES using a text-based menu interface (called ncurses)
    rather than a graphical interface; on the first boot following installation, SLES
    will then detect and install your video card. Some administrators choose to perform
    a text-based installation because it is faster than a graphical installation since
    the graphical subsystem does not need to be loaded. Perform Exercise 1-1 again,
    but instead of selecting Installation in Step 3, press the **F2** key and choose
    to perform a **Text Mode** installation of SLES. You will need to use the **Tab**
    key to navigate through screen options during the installation.'
