  md: '# ## OBJECTIVE 7 TROUBLESHOOT THE BOOT PROCESS OF A SLES 9 SYSTEM


    Sometimes a Linux system cannot start up correctly. Another task of system recovery
    is to access a corrupted system and to fix the problem that prevents the normal
    boot process.


    To perform basic troubleshooting of the boot process, you need to know the following:


    +   - System Boot Process Issues

    - How to Boot a Corrupt System Directly into a Shell

    - How to Boot a Corrupt System with the Installation Media

    - How to Start and Use the SLES9 Rescue System


    # ## System Boot Process Issues


    The boot process of a modern Linux system can be very complex, and its possible
    to encounter problems during the boot process.


    The following are some of the most common problems:


    +   - The system cannot boot due to a misconfigured boot loader.

    - The system cannot boot because of file system corruption.

    - An init script has malfunctioned and is blocking the boot process.

    - The system does not start correctly because of hardware changes.


    In all of these cases you must access the file system of the corrupted system
    to detect and fix the problem.


    In this objective, you learn how to access a system which is not booting any longer.


    # ## How to Boot a Corrupt System Directly into a Shell


    The boot screen of the GRUB boot loader lets you pass parameters that modify the
    Linux kernel before the kernel is actually loaded.


    At the bottom of the GRUB boot screen is a Boot Options field. When you select
    an operating system in the boot screen, the boot options for that operating system
    are displayed in the field.


    To add a boot option, select an operating system and type the additional boot
    option in the Boot Options field.


    One way to access a system that is not booting anymore is to set a different program
    for the init process. Normally, the Linux kernel tries to find a program with
    the name init and starts this program as the first process. All other processes
    are then started by init.'
  merge: -1
  pgno: 265
- img_proc: false
  md: 'With the boot parameter `init=new_init_program`, you can change the first program
    loaded by the kernel. For example, by entering the boot parameter **`init=/bin/bash`**,
    the system is started directly into a bash shell.


    You can use this bash file to access the file system and to fix a misconfiguration.


    > **CAUTION** The file systems are mounted read-only after booting into a shell.
    To change configuration files, you need to remount the file system with the following
    command:

    `mount -o remount,rw,sync -t filesystem_type device_name mount_point`


    # How to Boot a Corrupted System with the Installation Media


    You can use the SUSE Linux installation media to boot a system with a misconfigured
    boot loader. To boot the system, you need to do the following:


    +   1. Insert the ***SLES 9 DVD*** into the DVD drive and reboot the system. Make
    sure that the system boots from the drive.

    2. Select **Installation**; then press **Enter**. Wait until the installation
    program starts.

    3. When YaST displays the language selection dialog box, select **Accept**.

    4. In the next dialog box, select **Boot installed system**; then select **OK**.
    YaST analyzes the hard disk and displays all Linux root partitions.

    5. Select the ***root partition*** of the system you would like to boot; then
    select **Boot**. The selected system is now booted.


    After the system has started, you can log in as root user and fix the boot loader
    problem.


    # How to Start and Use the SLES 9 Rescue System


    Another way to access a corrupted system is to use the SLES 9 Rescue System. The
    Rescue System is a Linux system that can be booted directly from the installation
    media.


    When this system is running, you can mount partitions from the corrupted system
    and fix problems.


    To start the Rescue System, do the following:


    +   1. Insert the ***SLES 9 DVD*** into the DVD drive and reboot the system. Make
    sure that the system boots from the drive.

    2. From the boot menu, select Rescue System; then press **Enter**.

    3. From the language selection dialog box, select ***your language***; then press
    **Enter**.'
