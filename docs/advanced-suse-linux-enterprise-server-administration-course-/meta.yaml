  md: '# # The Basics of GRUB


    GRUB is the standard boot loader of SLES 9 and includes the following features:


    +   - **Stage 2 File System Drivers.** Stage 2 of GRUB includes file system drivers
    for ReiserFS, ext2, ext3, Minix, JFS, XFS, FAT, and FFS (BSD).


    This means that GRUB can be used to access files by means of filenames even before
    the operating system is loaded. This feature is used to search for kernel and
    initrd images.


    +   - **GRUB Shell.** GRUB has its own shell that enables interactive control
    of the boot manager.


    # # How to Configure the GRUB Boot Loader


    You configure GRUB by editing the file /boot/grub/menu.lst. The following is the
    general structure of the file:


    +   - First, the general options such as the background color of the boot manager
    menu are listed:


    ```

    color white/blue black/light-gray

    ```


    +   - This is followed by options for the various operating systems that can be
    booted with the boot manager. Each entry for an operating system begins with a
    command title, as in the following:


    ```

    title linux

    kernel (hd0,0)/boot/vmlinuz root=/dev/hda1

    initrd (hd0,0)/boot/initrd

    ```


    The following is an example of a simple GRUB configuration file:


    ```

    default 0

    timeout 8

    title linux

    kernel (hd0,0)/boot/vmlinuz

    root=/dev/hda1

    initrd (hd0,0)/boot/initrd

    ```


    Each line in this example is described below:


    +   - **default 0**


    The first entry (numbering from 0) is the default boot entry that starts automatically
    if no other entry is selected with the keyboard.


    +   - **timeout 8**


    The default boot entry is started automatically after eight seconds.


    +   - **title linux**


    This is the first entry in the boot menu. By default, this entry is started.'
  merge: -1
  pgno: 268
- img_proc: false
  md: "# Section 5 Manage Backup and Recovery\n\n+   - **kernel (hd0,0)/boot/vmlinuz**\n\
    \  This entry describes the kernel location (in this example, the first partition\
    \ of the first hard disk).\n  Note the following regarding the designations for\
    \ hard disks and partitions:\n  - GRUB does not distinguish between IDE and SCSI\
    \ hard disks. The hard disk that is recognized by the BIOS as the first hard disk\
    \ is designated as hd0, the second hard disk as hd1, and so on.\n  - The first\
    \ partition on the first hard disk is called hd0,0, the second partition hd0,1,\
