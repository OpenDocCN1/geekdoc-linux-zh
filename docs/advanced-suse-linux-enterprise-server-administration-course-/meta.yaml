  md: '# # INTRODUCTION


    Even the best security measures cannot guarantee that data will never be lost.
    There is always the possibility that:


    +   - A hard disk failure will occur, destroying data on the affected disk.

    - Users will delete files by accident.

    - A virus will delete important files on a desktop computer.

    - A notebook will be lost or destroyed.

    - An attacker will delete data on a server.

    - Natural influences like thunderstorms will destroy storage systems.


    It is very important to ensure that you have a reliable backup of important data.


    In this section you learn how to develop a backup strategy and how to use the
    standard UNIX backup tools tar, rsync, and dd.


    You will learn about possible issues during the boot process and how to configure
    the GRUB boot loader.


    # # OBJECTIVE 1 Develop a Backup Strategy


    Backing up data is one of the most important tasks of a system administrator.
    But before you can actually back up data, you need to develop a backup strategy
    by doing the following:


    +   - Choose a Backup Method

    - Choose the Right Backup Media


    # ## Choose a Backup Method


    The best possible method of data backup is the *full backup*.


    In a full backup, all system data is copied to a backup media once a day. To restore
    the data, the most current backup media is copied back to the system''s hard disk.


    The disadvantage of this method is the ***backup window***. The backup window
    is the time frame available to perform backups.


    Backups should be performed when the system is not used, to avoid data changes
    on the disk during the backup. These data changes would lead to inconsistent data
    on the backup media.


    Therefore, a backup is normally performed at night when systems are not needed.


    In some cases, especially in larger companies, the backup window might be too
    small to perform a full backup every day.'
  merge: -1
  pgno: 249
- img_proc: false
  md: 'This can happen for the following reasons:


    +   - The amount of data to be backed up is so large, it takes too long to copy
    all data to a backup media during the backup window.

    - The affected systems have to be available around the clock, so the backup window
    is very small.


    In most cases, a combination of both reasons prevents you from using a full backup.

    To circumvent this problem, you can use a backup method other than full backup.
    The following are two basic backup alternatives:


    +   - Perform an Incremental Backup

    - Perform a Differential Backup


    # Perform an Incremental Backup


    In an incremental backup, you normally perform a full backup once a week (such
    as on the weekend). Then you perform a backup every day that copies only files
    that have changed since the backup the day before.


    For example, if you might perform a full backup on Sunday, while on Monday you
    just backup the files that have changed since Sunday. On Tuesday you back up the
    files that have changed since Monday, and so on.


    Before performing an incremental backup, you need to understand the following
    advantage and disadvantage of this method:


    +   - **Advantage.** Because you only back up files that have changed since the
    last backup, the backup window can be much smaller than the one you need for a
    daily full backup.

    - **Disadvantage.** The recovery time is longer. For example, you have performed
    a full backup on Sunday and incremental backups on Monday, Tuesday and Wednesday.
    On Thursday the server crashes and all data is lost.


    To restore the server you now need all incremental backups and the full backup
    since last Sunday. All these backups need to be copied to the server in the correct
    order.


    # Perform a Differential Backup


    In an incremental backup, you perform a full backup once a week, then you perform
    backups every day to record the files that have changed since the last full backup.


    For example, suppose you perform a full backup on Sunday. On Monday you back up
    the files that have changed since Sunday, on Tuesday you also back up the files
    that have changed since Sunday, and so on.'
  merge: -1
  pgno: 250
- img_proc: false
  md: 'Before performing a differential backup, you need to understand the following
    advantage and disadvantage of the method:


    +   - **Advantage.** To restore data from a differential backup, you need just
    two backup media: the last full backup and the last differential backup. This
    makes the average time needed to restore a system shorter.

    - **Disadvantage.** The amount of data to be backed up grows every day. At the
    end of the backup cycle, the amount of data might be too large for the available
    backup window.


    Figure 5-1 illustrates the difference between incremental and differential backups.


    ![](bbox=[0.15, 0.28, 0.65, 0.56])


    # Choose the Right Backup Media


    You must choose the right backup media for the amount of data to be backed up
    and the backup method.


    Tape drives are used most often because they still have the best price-to-capacity
    ratio. Normally these are SCSI drives, so that all kinds of tape drives can be
    accessed in the same way (such as DAT, EXABYTE, and DLT). In addition, tapes can
    be reused.


    Other media for data backup include writable CDs or DVDs, removable hard drives,
    and magnetic-optical (MO) drives.


    More and more frequently, Storage Area Networks (SANs) are used. With a SAN, a
    storage network is set up to exclusively back up data from different computers
    on a central backup server. But even a SAN often uses magnetic tapes to store
    the data.


    Backup media should always be stored separately from the backed up systems. This
    prevents the backups from being lost in case of a fire in the server room. Sensitive
    backup media should be stored safely offsite.'
  merge: -1
  pgno: 251
- img_proc: false
  md: '# OBJECTIVE 2  CREATE BACKUP FILES WITH TAR


    The tar (tape archiver) tool is the most commonly used application for data backup
    on Linux systems. It archives files in a special format, either directly on a
    backup medium (such as magnetic tape or floppy disk), or to an archive file.


    The following are tasks you perform when backing up files with tar:


    +   - Create tar Archives

    - Unpack tar Archives

    - Exclude Files from Backup

    - Perform Incremental and Differential Backup

    - Use tar Command-Line Options


    # Create tar Archives


    The tar format is a container format for files and directory structures. By convention,
    the extension of the archive files end in .tar.


    tar archives can be saved to a file to store them on a file system, or they can
    be written directly to a backup tape.


    Normally the data in the archive files is not compressed, but you can enable compression
    with additional compression commands. If archive files are compressed (usually
    with the command gzip), then the extension of the filename is either .tar.gz or
    .tgz.


    The tar command first expects an option, then the name of the archive to be written
    (or the device file of a tape recorder), and the name of the directory to be backed
    up. All directories and files under this directory are also saved.


    Directories are typically backed up with a command such as the following:


    ```

    tar -cvf /backup/etc.tar /etc

    ```


    In this example, the tar command backs up the complete contents of the directory
    /etc to the file /backup/etc.tar.


    The option -c (create) creates the archive. The option -v (verbose) displays a
    more detailed output of the backup process. The name of the archive to be created
    is entered after the option -f (file).


    This can either be a normal file or a device file (such as a tape drive), as in
    the following:


    ```

    tar -cvf /dev/st0 /home

    ```


    In this example, the /home directory is backed up to the tape recorder /dev/st0.


    When an archive is created, absolute paths are made relative by default. This
    means that the leading / is removed, as in the following output:


    ```

    tar: Removing leading / from member names

    ```'
  merge: -1
  pgno: 252
- img_proc: false
  md: 'You can view the contents of an archive by entering the following:


    ```

    tar -tvf /backup/etc.tar

    ```


    # Unpack tar Archives


    To unpack files from an archive, enter the following command:


    ```

    tar -xvf /dev/st0

    ```


    This writes all files in the archive to the current directory. Due to the relative
    path specifications in the tar archive, the directory structure of the archive
    is created here.


    If you want to extract to another directory, this can be done with the option
    -C, followed by the directory name.


    If you want to extract just one file, you can specify the name of the file with
    the -C option, as in the following:


    ```

    tar -xvf /test1/backup.tar -C /home/user1/.bashrc

    ```


    # Exclude Files from Backup


    If you want to exclude specific files from the backup, a list of these files must
    be written in an exclude file, line by line, as in the following:


    ```

    /home/user1/.bashrc

    /home/user2/Text*

    ```


    In this example, the file /home/user1/.bashrc from user1 and all files that begin
    with Text in the home directory of user2 will be excluded from the backup.


    This list is then passed to tar with the option -X, as in the following:


    ```

    tar -cvf /dev/st0 /home -X exclude.files

    ```


    # Perform Incremental and Differential Backups


    In an incremental or differential backup, only files that have been changed or
    newly created since a specific date must be backed up.


    The following are two methods you can use to accomplish the same thing with tar:


    +   - Use a Snapshot File for Incremental Backups

    - Use the find Command to Search for Files to Back Up


    # Use a Snapshot File for Incremental Backups


    Tar lets you use a snapshot file that contains information about the last backup
    process. This file needs to be specified with the -g option.'
  merge: -1
  pgno: 253
- img_proc: false
  md: 'First, you need to make a full backup with a tar command, as in the following:


    ```

    tar -cz -g /backup/snapshot_file -f /backup/backup_full.tar.gz /home

    ```


    In this example, the directory /home is backed up to the file /backup/backup_full.tar.gz.
    The snapshot file /backup/snapshot_file does not exist and is created.


    The next time, you can perform an incremental backup with the following command:


    ```

    tar -cz -g /backup/snapshot_file -f /backup/backup_mon.tar.gz /home

    ```


    In this example, tar uses the snapshot file to determine which files or directories
    have changed since the last backup. Only changed files are included in the new
    backup /backup/backup_mon.tar.gz.


    # Use the find Command to Search for Files to Back Up


    You can also use the find command to find files that need to be backed up as a
    differential backup.


    First, you use the following command to make a full backup:


    ```

    tar -czf /backup/backup_full.tar.gz /home

    ```


    In this example, the /home directory is backed up into the file /backup/backup_full.tar.gz.
    Then you can use the following command to back up all files that are newer than
    the full backup:


    ```

    find /home -type f -newer /backup/backup_full.tar.gz \

    -print0 | tar --null -cvf /backup/backup_mon.tar.gz -T -

    ```


    In this example, all files (-type f) in the directory /home that are newer than
    the file /backup/backup_mon.tar.gz are archived.


    The options -print0 and --null ensure that files with spaces in their names are
    also archived. The option -T determines that files piped to stdin are included
    in the archive.


    # Use tar Command-Line Options


    Table 5-1 lists some useful tar options.


    | Option | Description |

    | :--- | :--- |

    | -c | Creates an archive. |

    | -C | Changes to the specified directory. |

    | -d | Compares files in the archive with those in the file system. |

    | -f | Uses the specified archive file or device. |

    | -j | Directly compresses or decompresses the tar archive using bzip2, a modern
    efficient compression program. |

    | -r | Appends files to an archive. |'
