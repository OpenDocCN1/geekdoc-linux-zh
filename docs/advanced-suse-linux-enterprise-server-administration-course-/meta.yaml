    partition.


    **Resize Existing Partitions** Select a partition from the list and select **Resize**.


    > Although you can resize a partition without deleting it to increase free space
    on the hard disk, you should always back up the data on the partition before resizing
    it.


    If the selected partitions are formatted with the FAT or NTFS file system, do
    the following before resizing the partition:


    +   - **FAT file system.** To save time, first run Scan Disk and Defrag to make
    sure the FAT partition is free of lost file fragments and cross links and to move
    files to the beginning of the partition.


    If you have optimized virtual memory settings for Windows so that a contiguous
    swap file is used with the same initial (minimum) and maximum size limit, disable
    them before resizing and re-enable them after the resizing has been completed.


    > If these virtual memory settings are enabled, the resizing might split the swap
    file into many small parts scattered all over the FAT partition. Also, the entire
    swap file would need to be moved during the resizing, which makes the process
    rather slow.


    +   - **NTFS file system.** You must run Scan Disk and Defrag to move the files
    to the beginning of the partition or the NTFS partition cannot be resized.'
