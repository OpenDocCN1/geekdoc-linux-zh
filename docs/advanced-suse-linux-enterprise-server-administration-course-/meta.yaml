  md: "The following are three examples of this:\n\n+   - **DNS.** Many applications\
    \ or services rely on the name resolution of the DNS system. If a DNS server is\
    \ not working properly, the application is waiting for the response, which slows\
    \ down its operation.\n\n+   - **Proxy.** Applications that connect to a service\
    \ using a proxy server suffer from bad performance of this system.\n\n+   - **NFS.**\
    \ Applications or services that access data that is mounted using NFS can be blocked\
