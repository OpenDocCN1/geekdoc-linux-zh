  md: 'An overview of all Apache directives can be found at http://httpd.apache.org/docs-2.0/mod/directives.html.


    # How to Configure Virtual Hosts


    To use the virtual host feature of Apache, you need to know the following:


    +   - The Concept of Virtual Hosts

    - How to Configure a Virtual Host


    # The Concept of Virtual Hosts


    With the default setup, the Apache server can be reached with a browser using
    the following Web addresses:


    +   - http://localhost (from the computer where the Web server is running)

    - http://web_server_IP_address

    - http://web_server_hostname


    For all of these addresses, Apache serves the same files located in the DocumentRoot
    directory.


    To use this setup, you would need a dedicated computer for every domain of the
    Internet. To avoid this, Apache lets you set up multiple virtual Web servers on
    one physical system. These virtual Web servers are called virtual hosts.


    The physical system needs to have an entry in the DNS for every virtual host of
    the Apache Web server.


    The following outlines the steps in the process of sending a request to the virtual
    host www.example.com:


    +   1. The Web browser requests the IP address of the host www.example.com.

    2. The browser uses the IP address to request a file from the Apache Web server
    listening on the IP address of www.example.com.

    3. In the HTTP request, the browser includes the hostname of the server it wants
    to reach.

    4. Apache uses the hostname to determine the right virtual host and delivers the
    requested data from that host.


    Figure 3-9 illustrates this process.'
  merge: -1
  pgno: 155
- img_proc: false
  md: '![](bbox=[0.13, 0.05, 0.88, 0.57])


    # How to Configure a Virtual Host


    For every virtual host you need to create a configuration file in the directory
    /etc/apache2/vhosts.d/. The name of the configuration file must end with .conf.


    You can find a template file vhost.template in the directory /etc/apache2/vhosts.d/
    to use as a base for your configuration file.


    You need to edit the directives shown in Table 3-6 in the template.


    Table 3-6


    | Directive | Description |

    |---|---|

    | ServerAdmin | Enter the e-mail address of the Virtual Host administrator here.
    |

    | ServerName | Enter the hostname of the virtual host as it''s configured in the
    DNS. |

    | DocumentRoot | Set the DocumentRoot of the virtual host. The directory and the
    files in the directory must be readable by the user wwwrun. |

    | ErrorLog | Enter a filename for the error log. The file must be writable for
    the user wwwrun. |'
  merge: -1
  pgno: 156
- img_proc: false
  md: '| Directive | Description |

    |-----------|-------------|

    | CustomLog | Enter a filename for the general log file. The file must be writable
    for the user wwwrun. |

    | ScriptAlias | Set the ScriptAlias to a directory of your choice. The directory
    must not be under the DocumentRoot of the virtual host. If you don''t need scripts
    for dynamic content creation, delete this directive. |

    | <Directory "script_dir"> | If you set a ScriptAlias before, you have to adjust
    the settings for script directory accordingly. If you are not using a script directory,
    delete this directory block. |

    | <Directory "document_root"> | You need to adjust the path name of this directory
    directive to the path of your DocumentRoot. |


    After customizing the template file, you need to reload the Apache Web server.
    You also need to make sure that the settings in DNS are updated so that the **hostname**
    of your virtual host is resolved correctly.


    # ## How to Limit Access to the Web Server


    Normally Apache delivers data to all hosts in the network that can reach the Web
    server. Sometimes it can be useful to restrict access to the content delivered
    by Apache.


    The following are the most common methods used:


    +   - Limit Access on an IP Address Basis

    - Limit Access with User Authentication


    # ### Limit Access on an IP Address Basis


    Apache offers directives, shown in Table 3-7, to limit access to the Web server
    on an IP address basis.


    | Directive | Description |

    |-----------|-------------|

    | allow | IP addresses or networks listed after this directive are allowed to
    access the Web server. |

    | deny | IP addresses or networks listed after this directive are not allowed
    to access the Web server. |

    | order | This directive sets the order in which the allow and deny directives
    are evaluated. |'
  merge: -1
  pgno: 157
- img_proc: false
  md: "These directives must be used within a <Directory> block and control the access\
    \ to all data below that directory.\nThe following example allows only hosts from\
    \ the network 10.0.0.0/24 to access the data in the directory /srv/www/htdocs:\n\
    \n```\n<Directory \"/srv/www/htdocs\">\n    Order deny,allow\n    Deny from all\n\
    \    Allow from 10.0.0.0/24\n</Directory>\n```\n\nThe following lists and describes\
    \ the lines in the example:\n\n+   - **<Directory \"/srv/www/htdocs\">.** This\
    \ directive starts the directory block. The directives that follow apply to the\
    \ directory /srv/www/htdocs only.\n- **Order deny,allow.** The Order directive\
    \ determines in which order the allow and deny directives are evaluated.\n  -\
    \ **Deny,Allow.** The deny directives are evaluated before the allow directives.\
    \ Access is allowed by default. Any client who does not match a deny directive\
    \ or does match an allow directive is allowed access to the server.\n  - **Allow,Deny.**\
    \ The allow directives are evaluated before the deny directives. Access is denied\
    \ by default. Any client who does not match an allow directive or does match a\
    \ deny directive is denied access to the server.\n  - **Mutual-failure.** Only\
    \ those hosts that appear in the Allow list and do not appear on the Deny list\
    \ are granted access. This has the same effect as Order Allow,Deny and is deprecated\
    \ in favor of that configuration.\n- **Deny from all.** The Deny directive is\
    \ evaluated first, and in this case access is denied for all clients. You can\
    \ use the following options with the deny and the allow directives:\n  - **all.**\
    \ This option applies to all hosts.\n  - **A full IP address.** This option applies\
    \ to a specific IP address (such as 10.0.0.23).\n  - **A partial IP address.**\
    \ This option applies to IP addresses starting with the given IP address fragment\
    \ (such as 10.0.0).\n  - **A network/netmask pair.** This option applies to IP\
    \ addresses matching to the given network/netmask pair (such as 10.0.0.0/255.255.255.0).\n\
    \  - **A network/nnn CIDR specification.** This option applies to IP addresses\
    \ matching to the given CIDR expression (such as 10.0.0.0/24)."
  merge: -1
  pgno: 158
- img_proc: false
  md: '+   - **Allow from 10.0.0.0/24.** This allow directive is evaluated after the
    deny directive. In this case, the access is allowed for hosts in the network **10.0.0.0/24**.

    - **</Directory>.** This directive ends the directory block.


    # ### Limit Access with User Authentication


    By limiting access to certain IP addresses, you can control the hosts that access
    the Web server, but you have no control over the user that sits in front of the
    computer.


    Apache offers another possibility of access control called basic authentication.
    If you protect content on your Web server with this method, users are required
    to log in before they can access the data.


    Before you can configure Apache to use basic authentication, you first have to
    create user accounts for the Web server. You can do this by using the tool **htpasswd2**.


    The following command creates a password file and an account for the user tux:


    ```

    htpasswd2 -c /etc/apache2/htpasswd tux

    ```


    After entering this command, htpasswd2 prompts you for a password for the user
    you want to create. The passwords are stored in the file /etc/apache2/htpasswd.


    You can specify a different location for the password file, but you have to make
    sure that it is readable for the user wwwrun and that it is *not* located within
    the DocumentRoot of your server.


    When you use a password file for the first time, you have to call htpasswd2 with
    the -c option to create the file. If you want to add more users later, use the
    following command:


    ```

    htpasswd2 /etc/apache2/htpasswd *username*

    ```


    To delete a user from the password file, use the following command:


    ```

    htpasswd2 -D /etc/apache2/htpasswd *username*

    ```


    After you have created the user accounts, you need to configure Apache to prompt
    for a password when accessing restricted data. You need to add the following lines
    to the directory block of the directory that should be restricted:


    ```

    AuthType Basic

    AuthName "Restricted Files"

    AuthUserFile /etc/apache2/htpasswd

    Require user tux

    ```'
  merge: -1
  pgno: 159
- img_proc: false
  md: "The following describes each line:\n\n+   - **AuthType Basic.** This directive\
    \ sets the authentication method. For the type described in this section, the\
    \ value is Basic.\n- **AuthName \"Restricted Files\".** With this directive, you\
    \ have to choose a name for the restricted directory of your Web server. This\
    \ name is used for the authentication process between the browser and the Web\
    \ server.\n- **AuthUserFile /etc/apache2/htpasswd.** This directive sets the password\
    \ file used for the restricted directory.\n- **Require user tux.** This directive\
    \ lists the user of the password file who is allowed to access the directory.\
    \ You can add more than one user by separating the user names with spaces, or\
    \ you can use the following directive:\n\n  **Require user valid-user**\n\n  In\
    \ this case, access is granted to all users of the password file.\n\n# How to\
    \ Configure OpenSSL for Connection Encryption\n\nBy default, the connection between\
    \ the Web browser and the Web server are not encrypted. Anyone who can listen\
    \ to the network packets exchanged between browser and server can access the transferred\
    \ information.\n\nApache can use the SSL (Secure Socket Layer) protocol to encrypt\
    \ the connection. To configure an SSL encryption with an Apache Web server, you\
    \ need know the following:\n\n+   - The Basics of SSL Encryption\n- How to Create\
    \ a Test Certificate\n- How to Configure Apache to Use SSL\n- The Limitations\
    \ of the SSL Configuration\n\n# The Basics of SSL Encryption\n\nMost of the time\
    \ data is transmitted across a network in encrypted form by using RSA keys. This\
    \ method is used by the encryption software PGP (Pretty Good Privacy) to encrypt\
    \ e-mails, by ssh (Secure Shell) for encrypted data transfers between two computers,\
    \ and by Apache for secure data transmission between the Web server and the Web\
    \ browser.\n\nThis encryption is based on two different keys: a private key and\
    \ a public key. While the private key is known only to the owner, the public key\
    \ should be accessible to the public."
  merge: -1
  pgno: 160
- img_proc: false
  md: 'Figure 3-10 shows the encryption process.


    ![](bbox=[0.12, 0.09, 0.8, 0.35])


    **Figure 3-10**


    Public and private keys can also be used to sign data. In principle, when data
    is signed, an encrypted checksum is generated from the data. The sender signs
    the data with his private key. The signature can be checked by the recipient by
    using the public key of the sender to determine whether the data is really from
    her or whether the text has been modified by a third party. Figure 3-11 illustrates
    the signing process.


    ![](bbox=[0.11, 0.55, 0.8, 0.89])


    **Figure 3-11**'
  merge: -1
  pgno: 161
- img_proc: false
  md: "A problem with the encryption procedure described above is that you cannot\
    \ determine who the owner of a public key is. The solution to this problem is\
    \ a Certificate Authority (CA) which signs the public keys with its own private\
    \ keys.\n\nA public key that is signed by a CA is also called a *Certificate*.\n\
    \nCAs are well-known companies or organizations like VeriSign or VISA. The public\
    \ keys of these organizations are built into the Web browsers. By verifying the\
    \ signature with the public key of the CA, the browser can make sure that a public\
    \ key of a Web server is valid.\n\nThe following explains the process of using\
    \ a CA with SSL encryption for a Web server:\n\n+   1. The browser recognizes\
    \ a Web address starting with `https://`.\n   This means that the connection to\
    \ this server should be encrypted. The default port for SSL connections is 443\
    \ instead of port 80 (used for normal unencrypted HTTP connections).\n2. The Web\
    \ browser asks the server for its public RSA key.\n3. The Web server sends the\
    \ public key to the Web browser.\n4. The Web browser verifies the key of the server\
    \ with the public key of the CA that signed the key.\n5. If the key is valid,\
    \ the Web browser and Web server establish a secure connection.\n\nYou need an\
    \ officially signed key to set up a secure Web server. You can sign a key by yourself,\
    \ but this should only be done for test purposes.\n\n# How to Create a Test Certificate\n\
    \nTo set up a secure Web server for test purposes, you can create a certificate\
    \ by yourself. You should never use such a certificate for a production system.\n\
    \nTo create a test certificate, you do the following:\n\n+   - Create an RSA Key\
    \ Pair\n- Sign the Public Key to Create a Certificate\n\n**Create an RSA Key Pair**\
    \ To create a key pair, you need a file with as many random numbers as possible.\
    \ You can generate this file by entering the following command:\n\n```\ncat /dev/random\
    \ > /tmp/random\n```\n\nStop this procedure after a few seconds by pressing **Ctrl+C**.\
    \ The file generated should be at least a thousand bytes in size. You can now\
    \ generate the key pair by entering the following command:\n\n```\nopensslgenrsa\
    \ -des3 -out server.key -rand /tmp/random 1024\n```"
  merge: -1
  pgno: 162
- img_proc: false
  md: "During the process, you are prompted to enter a password. This password is\
    \ used to secure the private key of the key pair.\n\nThe generated keys are saved\
    \ together in the file server.key.\n\n**Sign the Public Key to Create a Certificate**\
    \ Next you need to sign your public key to create a certificate by entering the\
    \ following command:\n\n```\nopenssl req -new -x509 -key server.key -out server.crt\n\
    ```\n\nDuring the process, you are prompted for the following information:\n\n\
    +   - **Enter pass phrase for /tmp/server.key:**\n  Enter the passphrase you chose\
    \ for the server key.\n- **Country Name (2 letter code) [AU]:**\n  Enter the country\
    \ code of your country (such as DE for Germany).\n- **State or Province Name (full\
    \ name) [Some-State]:**\n  Enter your state or province name. You can enter a\
    \ period (.) to leave this field blank.\n- **Locality Name (eg, city) []:**\n\
    \  Enter the name of your city.\n- **Organization Name (eg, company) [Internet\
    \ Widgits Pty Ltd]:**\n  Enter the name of your company.\n- **Organizational Unit\
    \ Name (eg, section) []:**\n  Enter the name of your unit, or you can enter a\
    \ period (.) to leave it blank.\n- **Common Name (eg, YOUR name) []:**\n  Enter\
    \ the full hostname of your system (such as www.example.com). The certificate\
    \ will be valid for this hostname only.\n- **E-mail Address []:**\n  Enter the\
    \ e-mail address of the administrator who is responsible for the server.\n\nAfter\
    \ you have answered all questions, the server certificate is saved into the file\
    \ server.crt.\n\nFinally, you need to copy the files server.key and server.crt\
    \ to the correct locations:\n\n+   - Copy the file server.key to the directory\
    \ **/etc/apache2/ssl.key**.\n- Copy the file server.crt to the directory **/etc/apache2/ssl.crt**.\n\
    \n# **How to Configure Apache to Use SSL**\n\nAfter you have generated the RSA\
    \ key pair and the server certificate, you have to configure Apache to use SSL.\
    \ First, you need to change two settings in the file /etc/sysconfig/apache2."
  merge: -1
  pgno: 163
- img_proc: false
  md: "The settings in this file apply to the Apache startup script and do not belong\
    \ to the server configuration.\nSet the following variables to the appropriate\
    \ values:\n\n+   - **APACHE_START_TIMEOUT=\"10\"**\n    This setting extends the\
    \ start timeout of Apache so that you have more time to enter the passphrase of\
    \ the private RSA key.\n- **APACHE_SERVER_FLAGS=\"SSL\"**\n    The additional\
    \ server flag SSL defines the SSL variable when evaluating the Apache configuration\
    \ files. This enables some directives that are necessary for SSL encryption.\n\
    \    For example, it lets Apache listen on port 443 instead of only to port 80.\n\
    \nYou also need to change the server configuration files to enable SSL by doing\
    \ one of the following:\n\n+   - Configure the Main Server to Use SSL Encryption\n\
    - Configure a Virtual Host to Use SSL Encryption\n\n**Configure the Main Server\
    \ to Use SSL Encryption** To configure the main server, you need to add the following\
    \ directives to the file /etc/apache2/default-server.conf:\n\n```\nSSLEngine on\n\
    SSLCipherSuite ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP:+eNULL\n\
    SSLCertificateFile /etc/apache2/ssl.crt/server.crt\nSSLCertificateKeyFile /etc/apache2/ssl.key/server.key\n\
    ```\n\nEach line is described below:\n\n+   - **SSLEngine on**\n    This directive\
    \ enables the Apache SSL engine.\n- **SSLCipherSuite ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP:+eNULL**\n\
    \    This directive sets the details of the encryption method. The line displayed\
    \ above is the default configuration that comes with Apache.\n\n![](bbox=[0.12,\
    \ 0.84, 0.2, 0.92])\n\nFor more information about this directive, go to http://httpd.apache.org/docs-2.0/mod/mod_ssl.html#sslciphersuite.\n\
    \n+   - **SSLCertificateFile /etc/apache2/ssl.crt/server.crt**\n    This directive\
    \ points to the server certificate file."
  merge: -1
  pgno: 164
- img_proc: false
  md: '# Section 3  Configure Network Services


    - SSLCertificateKeyFile /etc/apache2/ssl.key/server.key


    This directive points to the server key file.


    After you make the described changes, you have to restart Apache. Apache prompts
    you for the passphrase of the server key file.


    The server might not start up correctly at boot time, because it requires the
