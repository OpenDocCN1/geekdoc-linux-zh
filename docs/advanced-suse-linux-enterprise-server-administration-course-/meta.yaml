  md: "If you want to use a range of numbers in your for loop, you can use the following\
    \ C-Style syntax:\n\n```\nLIMIT=10\n\nfor ((a=1; a <= LIMIT ; a++))\ndo\n    echo\
    \ -n \"$a \"\ndone\n```\n\nIn this example, the variable a is a count from 1 to\
    \ 10. The for expression contains the following three elements:\n\n+   - **a=1**.\
    \ This determines the start value for a.\n- **a <= LIMIT**. This is the condition\
    \ when the for loop should be terminated; in this case, when the a variable reaches\
    \ the value determined by the LIMIT variable (in this example, the value 10).\n\
    - **a++**. This command adds 1 to the a variable for every pass of the for loop.\n\
