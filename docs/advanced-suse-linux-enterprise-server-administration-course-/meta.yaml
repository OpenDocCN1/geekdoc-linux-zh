    # Testing a Performance Baseline


    To understand better how a system performance baseline can change based on system
    performance level, you should test your system against the baseline by running
    CPU, memory, and disk-intensive utilities and monitoring performance level. Run
    the **updatedb** command and take performance statistics. Compare these statistics
    to the baseline. What areas changed (CPU, memory, or disk)? Repeat this with three
    other utilities and note the effects on system performance compared to your performance
    baseline. Since the effects of these statistics are the result of normal system
    activity, you can assume that values that exceed the statistics are likely indicators
    of abnormal performance.'
