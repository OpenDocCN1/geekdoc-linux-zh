    \n# OBJECTIVE 8  CONFIGURE AND INSTALL THE GRUB BOOT LOADER\n\nTo boot the system,\
    \ you need a program, called the boot loader, which loads the operating system\
    \ kernel and starts the system.\n\nIn SLES 9 (by default) this task is handled\
    \ by the boot manager GRUB (GRand Unified Boot Loader).\n\nTo configure the GRUB\
    \ boot loader, you need to know the following:\n\n+   - The Basic Functionality\
    \ of a Boot Loader\n- The Basics of GRUB\n- How to Configure the GRUB Boot Loader\n\
    \n# The Basic Functionality of a Boot Loader\n\nThe following are the two basic\
    \ tasks of a boot loader:\n\n+   - Boot various operating systems\n- Pass boot\
    \ parameters to the Linux kernel\n\nThe boot loader performs these tasks in the\
    \ following two stages:\n\n+   - **Stage 1.** The program code for the first stage\
    \ of a boot loader is usually installed in the master boot record (MBR) of the\
    \ hard disk.\n\n  Because the space in the MBR is limited to 446 bytes, this program\
    \ code merely contains the information for loading the next stage. Stage 1 can\
    \ be installed in the boot sector of a partition or on a floppy disk.\n\n- **Stage\
    \ 2.** This stage usually contains the actual boot loader. The files of the boot\
    \ loader are located in the directory /boot."
