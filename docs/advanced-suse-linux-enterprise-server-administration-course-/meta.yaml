    # OBJECTIVE 7  ADD NEW HARDWARE TO A SLES 9 SYSTEM


    In general, new hardware is either detected with hotplug or can be easily configured
    with YaST. In some cases, however, some manual work is necessary to integrate
    new devices properly into the system.


    In this objective, you learn how to perform the following tasks:


    +   - Add a New Drive to the System

    - Replace a Graphics Card

    - Add a New Network Adapter


    # Add a New Drive to the System


    The following explains how to add a new drive to a SLES 9 installation. For this
    example, assume the following:


    +   - The system is equipped with a single hard disk and is used as a Web server.

    - The system is running out of disk space, so you need to add a new hard disk
    for the /srv directory.


    Do the following:


    +   1. Shut down the system and install the new drive.'
  merge: -1
  pgno: 394
- img_proc: false
  md: '2. Boot the system into runlevel 1 by passing the boot parameter **1** to the
    Linux kernel.

    3. Use YaST or command-line tools to create a partition and a file system on the
    new drive.

    4. Mount the drive temporarily in the /mnt directory.

    5. Copy the existing data from /srv to /mnt. Make sure that the file permissions
    copy properly. (Use the -a option for the cp command.)

    6. Verify the copied data and delete the content of the /srv directory.

    7. Umount the new hard disk.

    8. Edit the file /etc/fstab to mount the new hard drive automatically at boot
    time.

    9. Reboot the system to the default runlevel.


    # Replace a Graphics Card


    When you add a new graphics card to the system, the X Server starts up with the
    wrong driver configuration when booting into runlevel 5.


    > ![CAUTION](image_1)

    A similar problem occurs when you replace the monitor of your system. You can
    also use the following instructions in this situation.


    Do the following:


    +   1. Shut down the system and replace the graphics card.

    2. Boot the system into runlevel 3 by passing the boot parameter **3** to the
    Linux kernel.

    3. Log in as root and start **sax2** to configure the new graphics card.

    4. When finished, change to runlevel 5.


    # Add a New Network Adapter


    When adding a second network adapter, you have to make sure that the interface
    names of the devices are not confused.


    The interface names are determined by the order of the network adapters in the
    PCI bus. So an adapter might get a different interface name after another one
    has been plugged in.'
  merge: -1
