  md: 'Instructor''s Materials


    The following supplemental materials are available when this book is used in a
    classroom setting. All of the supplements available with this book are provided
    to the instructor on a single CD-ROM.


    +   - **Electronic Instructor''s Manual:** The Instructor''s Manual that accompanies
    this textbook includes additional instructional material to assist in class preparation,
    including suggestions for classroom activities, discussion topics, and additional
    projects.

    - **Solutions:** Answers to all end-of-chapter materials are provided, including
    the Review Questions, and, where applicable, Discovery Exercises.

    - **ExamView®:** This textbook is accompanied by ExamView, a powerful testing
    software package that allows instructors to create and administer printed, computer
    (LAN-based), and Internet exams. ExamView includes hundreds of questions that
    correspond to the topics covered in this text, enabling students to generate detailed
    study guides that include page references for further review. The computer-based
    and Internet testing components allow students to take exams at their computers,
    and also save the instructor time by grading each exam automatically.

    - **PowerPoint presentations:** This textbook comes with Microsoft PowerPoint
    slides for each section. These are included as a teaching aid for classroom presentation,
    to make available to students on the network for section review, or to be printed
    for classroom distribution. Instructors, please feel at liberty to add your own
    slides for additional topics you introduce to the class.

    - **Figure Files:** All of the figures in this textbook are reproduced on the
    Instructor''s Resource CD in bit-mapped format. Similar to the PowerPoint presentations,
    these are included as a teaching aid for classroom presentation, to make available
    to students for review, or to be printed for classroom distribution.


    Lab Requirements


    The following hardware is required for the Discovery Exercises at the end of each
    section and should be listed on the Hardware Compatibility List available at *www.novell.com/linux/suse*:


    +   - Pentium CPU (Pentium II 400 or higher recommended)

    - 256 MB RAM (512 MB RAM recommended)

    - 4 GB hard disk

    - A DVD drive (or a combination CD/DVD drive)'
