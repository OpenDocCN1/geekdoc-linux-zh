  md: "Before starting the DNS server, you have to make some basic configuration changes.\
    \ After finishing your configuration, you can start the server using the following\
    \ command:\n\n```\nrcnamed start\n```\n\nTo stop a running server, use the following\
    \ command:\n\n```\nrcnamed stop\n```\n\nTo have the DNS server start automatically\
    \ at boot time, use the following command:\n\n```\ninsserv named\n```\n\nThis\
    \ creates the necessary links in the runlevel directories.\n\n# Configure a Caching-Only\
    \ DNS Server\n\nA caching-only DNS server does not manage its own databases but\
    \ merely accepts queries and forwards them to other DNS servers. The supplied\
    \ replies are saved in the cache.\n\nA caching-only DNS server can be used on\
    \ a workstation or a gateway that has access to an external DNS server.\n\nThe\
    \ DNS server configuration is defined in the file /etc/named.conf. You can use\
    \ the example file that is installed with the DNS package as a configuration file\
    \ for a caching-only server.\n\nThe following example shows a simple configuration:\n\
    \n```\nDA1:~ # ip address show\n1: lo: <LOOPBACK,UP> mtu 16436 qdisc noqueue\n\
    #\n# /etc/named.conf: Configuration of the name server (BIND9)\n#\n# Global options\n\
    #\noptions\n{\n#\n# In which directory are the database files?\n#\n        directory\
    \ \"/var/lib/named\";\n};\n```\n\nThe global options are defined in the options\
    \ block at the beginning of the file. The directory containing the database files\
    \ (or zone files) is listed. Normally, this is /var/lib/named/.\n\nAll filenames\
    \ that follow the /var/lib/named directory refer to the directory. The directory\
    \ is created when installing the server package. It contains several preconfigured\
    \ files. Other options can also be defined in this file."
  merge: -1
  pgno: 114
- img_proc: false
  md: "# # Section 3 Configure Network Services\n\nThe Global options are followed\
    \ by the definition of the database files for the domains managed by the DNS server.\
    \ Several entries are needed for basic DNS server functions such as those provided\
    \ by a caching-only server.\n\nThree entries are needed for every DNS server:\n\
    \n+   - The entry for root DNS servers (This is not needed for BIND 9 because\
    \ it has the list of root DNS servers compiled into the software.)\n- The forward\
    \ resolution for localhost\n- The reverse resolution for the network 127.0.0.0\
    \ (localhost)\n\nThe following are examples of these entries:\n\n```\n## entry\
    \ for root nameservers#\nzone \".\" in {\n    type hint;\n    file \"root.hint\"\
    ;\n};\n\n#\n# forward resolution for localhost\n#\nzone \"localhost\" in {\n \
    \   type master;\n    file \"localhost. zone\";\n};\n\n#\n# reverse resolution\
    \ for localhost\n#\nzone \"0.0.127.in-addr.arpa\" in {\n    type master;\n   \
    \ file \"127.0.0. zone\";\n};\n```\n\nThe zone entry for the root DNS servers\
    \ contains a reference to a file containing the addresses of the root DNS servers.\
    \ This file (root.hint) is generated in the directory /var/lib/named/ during the\
    \ installation of the package bind.\n\nThe two files for the resolution of localhost\
    \ are also generated during the installation. The structure of these files is\
    \ explained later.\n\nThese entries are used to forward queries to the DNS server\
    \ directly to the responsible DNS servers. However, this resolution method can\
    \ be very slow. This problem can be solved by using forwarders.\n\nThe DNS server\
    \ has the addresses of other DNS servers in case it cannot resolve a host name\
    \ itself. You might be able to use the DNS servers of an Internet provider for\
    \ this purpose, as they usually have a lot of information in their cache."
  merge: -1
  pgno: 115
- img_proc: false
  md: "You can define these DNS servers in the options block in the file /etc/named.conf,\
    \ as in the following:\n\n```\noptions\n{\n    directory \"/var/lib/named\";\n\
    \    forwarders\n    {\n        10.0.0.254;\n    };\n};\n```\n\nYou can enter\
    \ up to three DNS server addresses. Queries that cannot be resolved by the local\
    \ DNS server are forwarded to one of the specified DNS servers.\n\nIf these DNS\
    \ servers cannot be reached, the queries are sent directly to the root DNS servers.\n\
    \n# Configure a Master Server for Your Domain\n\nThe following are the tasks you\
    \ need to do to configure a master DNS server for your domain:\n\n+   - Adapt\
    \ the Main Server Configuration File\n- Create the Zone Files\n- Create Additional\
    \ Resource Records\n\n# Adapt the Main Server Configuration File\n\nYou can adapt\
    \ the configuration for the caching-only DNS server for configuring a DNS server\
    \ containing its own information files.\n\nThis configuration already contains\
    \ the global entries for the directory and the forwarders (which can be omitted)\
    \ entries in the options block. The file also contains the mandatory entries for\
    \ the root servers and the resolution of localhost.\n\nThe global options are\
    \ followed by definitions for the database files (or zone files) for the domains\
    \ this DNS server serves. At least two files are necessary for each domain:\n\n\
    +   - A file for forward resolution (allocating an IP address to a computer name)\n\
    - A file for reverse resolution (allocating a computer name to an IP address)\n\
    \nIf several subnets belong to a domain, then one file for each of these networks\
    \ must be created for reverse resolution.\n\nEach definition begins with the instruction\
    \ *zone* (this is why the database files are also known as zone files), followed\
    \ by the name of this zone."
  merge: -1
  pgno: 116
- img_proc: false
  md: "For forward resolution, this is always the domain name. For reverse resolution,\
    \ the network prefix of the IP address must be given in reverse order (10.0.0.0\
    \ becomes 0.0.10.) to which the suffix in-addr.arpa is added (0.0.10.in-addr.arpa).\n\
    \nThe zone name is always followed by an “in” for Internet. (DNS servers can administer\
    \ information on different name spaces, not only that of the Internet. Other name\
    \ spaces are practically never used.)\n\nThe text in curly brackets defines the\
    \ type of DNS server for the corresponding zone (here it is always the type master;\
    \ other types are introduced later).\n\nFinally, there is the name of the file\
    \ in which the entries for this zone are located.\n\nThe entries for the Digital\
    \ Airlines configuration look like the following:\n\n```\n#\n# forward resolution\
    \ for the domain digitalairlines.com\n#\nzone \"digitalairlines.com\" in\n{\n\t\
    type master;\n\tfile \"master/digitalairlines.com.zone\";\n};\n#\n# reverse resolution\
    \ for the network 10.0.0.0\n#\nzone \"0.0.10.in-addr.arpa\" in\n{\n\ttype master;\n\
    \tfile \"master/10.0.0.zone\";\n};\n```\n\n# Create the Zone Files\n\nThe two\
    \ files for the domain localhost and the file for the root DNS servers are always\
    \ included in the installation. You do not need to change these files; however,\
    \ you must create the files required for the actual domain.\n\nThe subdirectory\
    \ /var/lib/named/master/ is used for the database files of a master server.\n\n\
    You need to know the following to manually create the zone files:\n\n+   - Structure\
    \ of the Files\n- The File /var/lib/named/master/digitalairlines.com.zone\n- The\
    \ File /var/lib/named/master/10.0.0.zone\n- The File /var/lib/named/master/localhost.zone\n\
    - The File /var/lib/named/master/127.0.0.zone"
  merge: -1
