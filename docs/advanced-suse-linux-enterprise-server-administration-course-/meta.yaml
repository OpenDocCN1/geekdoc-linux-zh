- img_proc: false
  md: 'In this example, assume the following:


    +   - The system has a single network adapter.

    - The system should be used as a router and so you need to install a second adapter.


    Do the following:


    +   1. Before you install the new adapter, open the interface configuration file
    of the existing adapter in /etc/sysconfig/network/.

    2. Add the following line to the configuration file:

    **PERSISTENT_NAME=''external''**

    This ensures that the device always gets the interface name external.

    3. Shut down the system and install the new network adapter.

    4. Start the system and boot into runlevel 1.

    5. Configure the new network adapter with YaST.

    6. Open the interface configuration file of the new network adapter and add the
    following line:

    **PERSISTENT_NAME=''internal''**

    7. Reboot the system into the default runlevel.


    With this method, the old adapter always gets the interface external while the
    new adapter gets internal.


    # Chapter Summary


    +   - The operating system interacts with interfaces that use a device driver
    to communicate with hardware devices.

    - Device drivers are typically loaded into the Linux kernel as modules, but may
    also be implemented as programs in user space.

    - Although most modules are loaded at system initialization or via a hotplug event,
    you can insert modules manually into the Linux kernel using the **modprobe** command.

    - To make finding hardware information easier, the **/sys** directory uses the
    sysfs virtual filesystem and lists information about devices and interfaces.

    - The **/sys/bus** and **/sys/devices** directories contain files that represent
    hardware devices on the system, whereas the **/sys/class** and **/sys/block**
    directories contain files that represent interfaces.'
  merge: -1
  pgno: 396
- img_proc: false
  md: '- For hotplug devices, the Linux kernel typically detects the addition of the
    device and runs a hotplug script (/sbin/hotplug) to load a hotplug driver agent
    that configures the appropriate device driver and a hotplug interface agent that
    configures an interface for the device. Hotplug agents are stored in the /etc/hotplug
    directory.

    - The **hwup** command is used by hotplug agents to locate the appropriate device
    driver module for a device via entries in the /etc/sysconfig/hardware directory.

    - Hotplug devices may also be detected using a coldplug script that runs at boot
    time to configure hotplug devices.

    - You can use boot options to prevent the hotplug and coldplug subsystems from
    starting during system initialization.

    - After adding a new hard disk to the system, you should boot to runlevel 1 to
    configure the partitions, file systems, and /etc/fstab entries.

    - After adding a new graphics card to the system, you should boot to runlevel
    3 and run the **sax2** utility to configure the appropriate driver and settings.

    - If you use multiple network interfaces, ensure that each interface contains
    a persistent name in its configuration file to make it easy to identify.


    # **KEY TERMS**


    +   - **/etc/fstab** — The file used to mount file systems at system initialization.

    - **/etc/hotplug** — The directory that stores hotplug agents in SLES.

    - **/etc/hotplug/blacklist** — A file that lists device driver kernel modules
    that cannot be loaded by a hotplug agent.

    - **/etc/sysconfig/hardware** — A directory that stores information about hardware
    devices on the system. Files in this directory are used by the **hwup** command.

    - **/etc/sysconfig/network** — Stores information for network interfaces in SLES.
    Files in this directory are used by the **ifup** command.

    - **/lib/modules/kernel-version** — The directory that stores kernel modules in
    SLES.

    - **/proc/sys/kernel/hotplug** — The file that the Linux kernel uses to call /sbin/hotplug
    when a hotplug event occurs.

    - **/sbin/hotplug** — The script called by the Linux kernel during a hotplug event.

    - **/sys/block** — A directory that stores interface information by device.

    - **/sys/bus** — A directory that stores hardware information by bus type.

    - **/sys/class** — A directory that stores interface information by type.

    - **/sys/devices** — A directory that stores hardware information by device.

    - **coldplug** — A script that detects and configures hotplug devices at system
    initialization.

    - **device** — The common name for a system hardware component.

    - **device agent** — A hotplug agent that loads the device driver for a hotplug
    device.

    - **driver** — A software component that is used to control a hardware device.'
  merge: -1
