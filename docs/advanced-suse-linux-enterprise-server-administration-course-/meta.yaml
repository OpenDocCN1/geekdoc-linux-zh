    # CHAPTER SUMMARY


    +   - In order to create an appropriate security concept for your organization,
    you should analyze network communication and protection requirements. Security
    policies may then be designed to reflect the changes required to the current network
    environment.

    - Protect your servers by storing them in a locked room, limiting the software
    that is installed on them, and using both BIOS and GRUB passwords.

    - PAM modules centralize authentication requests from applications and add additional
    security to Linux systems by placing restrictions on authentication and passwords.
    You can control PAM restrictions for specific applications using files in the
    /etc/pam.d directory.

    - It is good security practice to assign only the necessary permissions for system
    files and directories.

    - User home directories and the /tmp directory should give write access to the
    appropriate users, whereas most other files including configuration files should
    only grant read access to users.'
  merge: -1
  pgno: 241
- img_proc: false
  md: '+   - When using the SUID and SGID permissions, test your program thoroughly
    to ensure that no security loopholes exist during execution.

    - Use the sticky bit permission on public directories to prevent data loss.

    - ACLs may be used to expand the assignment of traditional Linux permissions to
    specific users and groups. You can set ACLs on files and directories using the
    **setfacl** command and obtain ACL information from files and directories using
    the **getfacl** command.

    - Default ACLs may be set on a directory to modify the ACL on newly created files
    and subdirectories within.

    - You can select an overall security level for your system using YaST to modify
    several configuration files that contain security-related information such as
    password encryption and system file permissions.

    - There are many Web resources that you can use to stay informed about current
    security issues.

    - The YOU module may be used to obtain important security-related patches from
    the SUSE update servers.


    # Key Terms


    **/boot/grub/menu.lst** — The GRUB boot manager configuration file.


    **/etc/pam.d** — The directory that stores PAM configuration files.


    **/etc/permissions.local** — A file that lists the user-defined permission restrictions
    for system files.


    **/etc/permissions.secure** — A file that lists secure file permission restrictions
    for system files.


    **/etc/securetty** — A PAM file that lists valid root login terminals.


    **/etc/security/limits.conf** — A PAM file that lists user resource limits.


    **/lib/security** — The directory that stores PAM modules.


    **Access Control List (ACL)** — A file attribute that allows additional user and
    group definitions to be added to the permission mode of the file.


    **access matrices** — A table that compares the types of workstation computers
    within an organization, the servers that they require access to, and the technologies
    involved.


    **barrier** — A device that restricts the flow of data, such as a firewall or
    file access restriction.


    **Blowfish** — An encryption method used to encrypt Linux passwords.


    **chkconfig command** — Used to list and configure services that are started in
    each system run level.


    **Data Encryption Standard (DES)** — The default encryption method used in SLES
    for passwords.


    **dictionary attack** — An attempt to gain access to a system user account by
    guessing passwords using common dictionary word combinations.


    **getfacl command** — Used to view the ACL on a file or directory.'
