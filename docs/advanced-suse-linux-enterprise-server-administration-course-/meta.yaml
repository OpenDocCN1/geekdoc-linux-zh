  md: "# INTRODUCTION\n\nAlthough almost every step of a network configuration is\
    \ done for you when you use YaST, it's sometimes useful to configure the network\
    \ settings manually. For testing and troubleshooting, it can be much faster to\
    \ change the network setup from the command line.\n\n# Objective 1 Understand\
    \ Linux Network Terms\n\nBefore you can configure the network manually with ip,\
    \ you need to understand the following Linux networking terms:\n\n+   - **Device.**\
    \ The network adapter built into the system. To use a physical device, a software\
    \ component creates an interface to the device. This interface can be used by\
    \ other software applications.\n\n  The software component which creates the interface\
    \ is also called a *driver*.\n  In Linux, network interfaces use a standard naming\
    \ scheme. Interfaces to Ethernet adapters follow the naming scheme eth0, eth1,\
    \ eth2, and so on. For every adapter installed in the system, an interface is\
    \ created when the appropriate driver is loaded.\n  The command-line tools for\
    \ the network configuration use the term *device* when they actually mean an interface.\
    \ The term device is used in this section for both physical devices and software\
    \ interfaces.\n\n- **Link.** The command-line tool ip uses the term *link* to\
    \ refer to the connection of a device to the network.\n\n- **Address.** The IP\
    \ address assigned to a device. The address can be either an IPv4 or an IPv6 address.\
    \ To use a device in a network, you have to assign at least one address to it.\
    \ However, you can assign more than one address to a device.\n\n- **Broadcast.**\
    \ The term *broadcast* refers the broadcast address of a network. By sending a\
    \ network packet to the broadcast address, you can reach all hosts in the locally\
    \ connected network at the same time. When you assign an IP address to a device,\
    \ you can also set this broadcast address.\n\n- **Route.** The path an IP packet\
    \ takes from the source to the destination host. The term *route* also refers\
    \ to an entry in the routing table of the Linux kernel.\n\n# Objective 2 Set Up\
    \ Network Devices with the IP Tool\n\nYou normally configure a network card with\
    \ YaST during or after installation. You can use the tool **ip** to change the\
    \ network card configuration quickly from the command line."
  merge: -1
  pgno: 85
- img_proc: false
  md: "Changing the network card configuration at the command line is especially useful\
    \ for test purposes; but if you want a configuration to be permanent, you must\
    \ save it in a configuration file. These configuration files are generated automatically\
    \ when you set up a network card with YaST.\n\nYou can use `ip` to perform the\
    \ following tasks:\n\n+   - Display the Current Network Configuration\n- Change\
    \ the Current Network Configuration\n\n> CAUTION: You can enter `/sbin/ip` as\
    \ a normal user to display only the current network setup. To change the network\
    \ setup, you have to be logged in as root.\n\n![](bbox=[0.11, 0.26, 0.18, 0.32])\n\
    \n# Display the Current Network Configuration\n\nWith the `ip` tool, you can display\
    \ the following information:\n\n+   - IP Address Setup\n- Device Attributes\n\
    - Device Statistics\n\n**IP Address Setup**\n\nTo display the IP address setup\
    \ of all devices, enter the following command:\n\n`ip address show`\n\nDepending\
    \ on your network setup, you see information similar to the following:\n\n```\n\
    DA1:~ # ip address show\n1: lo: <LOOPBACK,UP> mtu 16436 qdisc noqueue\n    link/loopback\
    \ 00:00:00:00:00:00 brd 00:00:00:00:00:00\n    inet 127.0.0.1/8 brd 127.255.255.255\
    \ scope host lo\n    inet6 ::1/128 scope host\n       valid_lft forever preferred_lft\
    \ forever\n2: eth0: <BROADCAST,MULTICAST,NOTRAILERS,UP> mtu 1500\n    qdisc pfifo_fast\
    \ qlen 1000\n    link/ether 00:30:05:4b:98:85 brd ff:ff:ff:ff:ff:ff\n    inet\
    \ 10.0.0.2/24 brd 10.0.0.255 scope global eth0\n    inet6 fe80::230:5ff:fe4b:9885/64\
    \ scope link\n       valid_lft forever preferred_lft forever\n3: sit0: <NOARP>\
    \ mtu 1480 qdisc noqueue\n    link/sit 0.0.0.0 brd 0.0.0.0\n```\n\nThe information\
    \ is grouped by network devices. Every device entry starts with a digit, called\
    \ the *interface index*, with the device name displayed below the interface index.\n\
    \nIn the above example, there are three devices:"
  merge: -1
  pgno: 86
- img_proc: false
  md: "# Section 2 Configure the Network Manually\n\n+   - **lo**. The loopback device,\
    \ which is available on every Linux system, even when no network adapter is installed.\
    \ Using this virtual device, applications on the same machine can use the network\
    \ to communicate with each other.\n\nFor example, you can use the IP address of\
    \ the loopback device to access a locally installed web server by typing **http://127.0.0.1**\
    \ in the address bar of your web browser.\n\n- **eth0**. The first Ethernet adapter\
    \ of the computer in this example. This is a physical device which is connected\
    \ to the local network. Ethernet devices are normally called eth0, eth1, eth2,\
    \ and so on.\n\n- **sit0**. This is a special virtual device that can be used\
    \ to encapsulate IPv4 into IPv6 packets. It's not used in a normal IPv4 network.\n\
    \nYou always have the entries for the loopback and sit devices. Depending on your\
    \ hardware setup, you might have more Ethernet devices in the ip output.\n\nSeveral\
    \ lines of information are displayed for every network device, such as eth0 for\
    \ the example above:\n\n```\n2: eth0: <BROADCAST,MULTICAST,NOTRAILERS,UP> mtu\
    \ 1500 qdisc pfifo_fast qlen 1000\n```\n\nThe most important information of the\
    \ line in this example is the device index (2) and the device name (eth0).\n\n\
    The other information shows additional attributes set for this device, such as\
    \ the hardware address of the Ethernet adapter (00:30:05:4b:98:85):\n\n```\nlink/ether\
    \ 00:30:05:4b:98:85 brd ff:ff:ff:ff:ff:ff\n```\n\nIn the following line, the IPv4\
    \ setup of the device is displayed:\n\n```\ninet 10.0.0.2/24 brd 10.0.0.255 scope\
    \ global eth0\n```\n\nThe IP address (10.0.0.2) follows inet, and the broadcast\
    \ address (10.0.0.255) after brd. The length of the network mask is displayed\
    \ after the IP address, separated by a /. The length is displayed in bits (24).\n\
    \nThe following lines show the IPv6 configuration of the device:\n\n```\ninet6\
    \ fe80::230:5ff:fe4b:9885/64 scope link\n       valid_lft forever preferred_lft\
    \ forever\n```\n\nThe address shown here is automatically assigned, even though\
    \ IPv6 is not used in the network that is connected with the device. The address\
    \ is generated from the hardware address of the device.\n\nDepending on the device\
    \ type, the information can differ. However, the most important information (such\
    \ as assigned IP addresses) is always shown."
  merge: -1
  pgno: 87
- img_proc: false
  md: "# Device Attributes\n\nIf you are only interested in the device attributes\
    \ and not in the IP address setup, you can enter the following command:\n\n```\n\
    ip link show\n```\n\nThe command produces an output similar to the following:\n\
    \n```\n1: lo: <LOOPBACK,UP> mtu 16436 qdisc noqueue\n    link/loopback 00:00:00:00:00:00\
    \ brd 00:00:00:00:00:00\n2: eth0: <BROADCAST,MULTICAST,NOTRAILERS,UP> mtu 1500\
    \ qdisc  pfifo_fast qlen 1000\n    link/ether 00:30:05:4b:98:85 brd ff:ff:ff:ff:ff:ff\n\
    3: sit0: <NOARP> mtu 1480 qdisc noqueue\n    link/sit 0.0.0.0 brd 0.0.0.0\n```\n\
    \nThe information is similar to what you saw when entering **ip address show**,\
    \ but the information about the address setup is missing. The device attributes\
    \ are displayed in brackets right after the device name.\n\nThe following is a\
    \ list of possible attributes and their meanings:\n\n+   - **UP**. The device\
    \ is turned on. It is ready to accept packets for transmission and it's ready\
    \ to receive packets from the network.\n- **LOOPBACK**. The device is a loopback\
    \ device.\n- **BROADCAST**. The device can send packets to all hosts sharing the\
    \ same network.\n- **POINTOPOINT**. The device is only connected to one other\
    \ device. All packets are sent to and received from the other device.\n- **MULTICAST**.\
    \ The device can send packets to a group of other systems at the same time.\n\
    - **PROMISC**. The device listens to all packets on the network, not only to those\
    \ sent to the device's hardware address. This is usually used for network monitoring.\n\
    \n# Device Statistics\n\nYou can use the option -s with the command ip to display\
    \ additional statistics information about the devices. The command looks like\
    \ the following:\n\n```\nip -s link show eth0\n```\n\nBy giving the device name\
    \ at the end of the command line, the output is limited to one specific device.\
    \ This can also be used to display the address setup or the device attributes."
  merge: -1
  pgno: 88
- img_proc: false
  md: "# Section 2 Configure the Network Manually\n\nThe following is an example of\
    \ the information displayed for the device eth0:\n\n```\n2: eth0: <BROADCAST,MULTICAST,NOTRAILERS,UP>\
    \ mtu 1500 qdisc pfifo_fast qlen 1000\n    link/ether 00:30:05:4b:98:85 brd ff:ff:ff:ff:ff:ff\n\
    \    RX: bytes  packets  errors  dropped overrun mcast\n    849172787  9304150\
    \  0       0       0       0\n    TX: bytes  packets  errors  dropped carrier\
    \ collsns\n    875278145  1125639  0       0       0       0\n```\n\nTwo additional\
    \ sections with information are displayed for every device. Each of the sections\
    \ has a headline with a description of the displayed information.\n\nThe section\
    \ starting with RX displays information about received packets, and the section\
    \ starting with TX displays information about sent packets.\n\nThe sections display\
    \ the following information:\n\n+   - **Bytes.** The total number of bytes received\
    \ or transmitted by the device.\n- **Packets.** The total number of packets received\
    \ or transmitted by the device.\n- **Errors.** The total number of receiver or\
    \ transmitter errors.\n- **Dropped.** The total number of packets dropped due\
    \ to a lack of resources.\n- **Overrun.** The total number of receiver overruns\
    \ resulting in dropped packets. As a rule, if a device is overrun, it means that\
    \ there are serious problems in the Linux kernel or that your computer is too\
    \ slow for the device.\n- **Mcast.** The total number of received multicast packets.\
    \ This option is supported by only a few devices.\n- **Carrier.** The total number\
    \ of link media failures, because of a lost carrier.\n- **Collsns.** The total\
    \ number of collision events on Ethernet-like media.\n- **Compressed.** The total\
    \ number of compressed packets.\n\n# Change the Current Network Configuration\n\
    \nYou can also use the ip tool to change the network configuration by performing\
    \ the following tasks:\n\n+   - Assign an IP Address to a Device\n- Delete the\
    \ IP Address from a Device\n- Change Device Attribute"
