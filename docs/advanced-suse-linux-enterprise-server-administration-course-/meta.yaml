    This script asks the user to enter his date of birth; if that happens to be today,
    the script congratulates him on his birthday. It does nothing if his birthday
    is another day.

    There are a number of items to consider when writing this script. From the flow
    chart, it should be obvious that the script consists of two basic steps:


    +   - Prompt the user to enter the date of birth.

    - Compare the date as entered by the user with the current date. If the dates
    are the same, the user sees "congratulations." If they are not equal, nothing
    appears.


    The branch is the actual mechanism that compares the current date and the date
    of birth.

    Before the comparison can be performed, both dates must be available in the same
    format. The user should be asked to specify the date of birth in a suitable format.


    You need to know the format in which the system obtains the current date. The
    obvious choice to get a date string is with the command date.


    The command `date + %m-%d` returns the current date in the form month-day, as
    in the following:


    ```

    date + %m-%d

    06-21

    ```'
