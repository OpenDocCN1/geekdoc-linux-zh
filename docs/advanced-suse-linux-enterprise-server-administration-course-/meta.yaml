  md: "# View the Routing Table\n\nTo view the current routing table, enter the following\
    \ command:\n\n```\nip route show\n```\n\nFor most systems, the output looks similar\
    \ to the following:\n\n```\n10.0.0.0/24 dev eth0  proto kernel  scope link  src\
    \ \\ 10.0.0.2\n169.254.0.0/16 dev eth0  scope link\n127.0.0.0/8 dev lo  scope\
    \ link\ndefault via 10.0.0.1 dev eth0\n```\n\nEvery line represents an entry in\
    \ the routing table. Each line in the example is shown and explained below:\n\n\
    +   - **10.0.0.0/24 dev eth0 proto kernel scope link src \\**\n  - **10.0.0.2**\n\
    \    This line represents the route for the local network. All network packets\
    \ to a system in the same network are sent directly through the device **eth0**.\n\
    - **169.254.0.0/16 dev eth0 scope link**\n    This line shows a network route\
    \ for the **169.254.0.0** network. Hosts can use this network for address auto\
    \ configuration.\n\n    SLES 9 automatically assigns a free IP address from this\
    \ network when no other device configuration is present. The route to this network\
    \ is always set, especially when the system itself has no assigned IP address\
    \ from that network.\n- **127.0.0.0/8 dev lo scope link**\n    This is the route\
    \ for the loopback device.\n- **default via 10.0.0.1 dev eth0**\n    This line\
    \ is the entry for the **default** route. All network packets that cannot be sent\
    \ according to the previous entries of the routing table are sent through the\
    \ gateway defined in this entry.\n\nDepending on the setup of your machine, the\
    \ content of the routing table varies. In most cases, you have at least two entries\
    \ in the routing table:\n\n+   - One route to the local network to which the system\
    \ is connected\n- One route to the default gateway for all other packets"
  merge: -1
  pgno: 94
- img_proc: false
  md: '# Add Routes to the Routing Table


    The following are the most common tasks you do when adding a route:


    +   - Set a Route to the Locally Connected Network

    - Set a Route to a Different Network

    - Set a Default Route


    ![](bbox=[0.16, 0.24, 0.66, 0.3])


    # Set a Route to the Locally Connected Network


    The following command sets a route to the locally connected network:


    ```

    ip route add 10.0.0.0/24 dev eth0

    ```


    This system in this example is in the **10.0.0.0** network. The network mask is
    **24** bits long (255.255.255.0). All packets to the local network are sent directly
    through the device **eth0**.


    # Set a Route to a Different Network


    The following command sets a route to different network:


    ```

    ip route add 149.44.171.0/24 via 10.0.0.100

    ```


    All packets for the network **149.44.171.0** are sent through the gateway **10.0.0.100**.


    # Set a Default Route


    The following command sets a default route:


    ```

    ip route add default via 10.0.0.1

    ```


    Packets that cannot be sent according to previous entries in the routing table
    are sent through the gateway **10.0.0.1**.


    # Delete Routes from the Routing Table


    To delete an entry from the routing table, use a command similar to the following:


    ```

    ip route delete 149.44.171.0/24 dev eth0

    ```


    This command deletes the route to the network **149.44.171.0** assigned to the
    device **eth0**.'
  merge: -1
  pgno: 95
