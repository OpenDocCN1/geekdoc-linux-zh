    # Chapter Summary\n\n+   - DNS comprises a hierarchical namespace that consists\
    \ of a root domain (.) followed by top level domains, domains, and subdomains.\
    \ Each host that uses DNS has an FQDN that identifies its hostname and domain\
    \ name.\n- FQDNs and their associated IP addresses are stored on authoritative\
    \ DNS servers in a zone file. Master DNS servers hold a read-write copy of the\
    \ zone file and transfer this to Slave DNS servers as read-only. Caching-only\
    \ or forwarding DNS servers simply forward requests to a Master or Slave DNS server\
    \ and cache the results for future reference.\n- Clients can query a DNS server\
    \ listed in /etc/resolv.conf to resolve an FQDN to an IP address (forward lookup),\
    \ or to resolve an IP address to an FQDN (reverse lookup). Name resolution requests\
    \ are stored in a cache on the client computer for a certain period of time determined\
    \ by the TTL.\n- To become a DNS server, you must install the BIND server software,\
    \ edit the /etc/named.conf configuration file, create zone files in the /var/lib/named\
    \ directory, and create resource records. This can be done manually or using YaST.\n\
    - The **host** and **dig** commands may be used to test DNS name resolution.\n\
    - The LDAP directory service allows network users to query information for a wide\
    \ range of uses including user authentication and information storage. LDAP is\
    \ supported by nearly all operating systems. SLES uses OpenLDAP to provide LDAP\
    \ services.\n- LDAP resources are organized into a hierarchical tree structure.\
    \ Each resource (leaf object) is stored in a series of container objects and can\
    \ be accessed using a DN or RDN.\n- You can edit the /etc/openldap/slapd.conf\
    \ file or use YaST to configure LDAP server settings. Similarly, you can edit\
    \ the /etc/openldap/ldap.conf file or use YaST to configure LDAP client settings.\n\
    - The GQ LDAP browser allows you to query an LDAP database within a desktop environment.\n\
    - The Apache Web server is the most common Web server on Linux systems. By default,\
    \ Apache uses the configuration file /etc/apache2/httpd.conf and hands out HTTP\
    \ Web content in the /srv/www/htdocs directory to client Web browsers.\n- Apache\
    \ may be used to host several Web sites on a single computer (virtual hosts),\
    \ and can restrict access to Web content based on IP address or user authentication."
  merge: -1
  pgno: 185
- img_proc: false
  md: '+   - OpenSSL may be used with Apache to provide encryption for Web content
    using public key certificates. You can then access secured Web pages using the
    HTTPS protocol.

    - To become a Samba server, you must start the Samba and NetBIOS daemons, configure
    share and server entries in the /etc/samba/smb.conf file, and configure Samba
    user accounts.

    - The **testparm** command may be used to detect syntax errors in the Samba configuration
    file, and the **nmblookup** command may be used to test name resolution.

    - You can connect to a Windows or Samba file server using the **mount** and **smbclient**
    commands.


    # KEY TERMS


    **. (root domain)** — The root domain of DNS.


    **/etc/apache2/default-server.conf** — The default Apache configuration file in
    SLES. It is overwritten by all other configuration files.


    **/etc/apache2/httpd.conf** — The main Apache configuration file.


    **/etc/apache2/vhosts.d** — The directory that stores Apache virtual host configuration
    files in SLES.


    **/etc/host.conf** — A file that lists the order for hostname resolution. It is
    only used by applications that use older GNU C libraries.


    **/etc/named.conf** — A file that lists the type of zones hosted on the DNS server
    and the location of the zone files.


    **/etc/nsswitch.conf** — A file that lists the order for hostname resolution.


    **/etc/openldap/ldap.conf** — The OpenLDAP client configuration file.


    **/etc/openldap/schema** — The directory that stores the OpenLDAP schema in SLES.


    **/etc/openldap/slapd.conf** — The OpenLDAP server configuration file.


    **/etc/resolv.conf** — A file on a resolver that lists up to three DNS servers
    that may be used to perform name resolution.


    **/etc/samba/smb.conf** — The main Samba configuration file.


    **/srv/www/htdocs** — The default DocumentRoot directory in Apache.


    **/var/lib/named** — The directory that stores zone files in SLES.


    **/var/log/messages** — The default log file for the DNS daemon.


    **Address record (A)** — A DNS record that identifies hosts within a domain.


    **Apache** — The default Web server software in SLES.


    **ARPAnet** — The network that led to the development of the Internet. It stands
    for Advanced Research Projects Agency Network.


    **authoritative answer** — A name resolution response from a DNS server whereby
    the DNS server contained the appropriate record in its zone database.


    **Berkeley Internet Name Domain (BIND)** — The reference implementation for DNS.


    **cache** — An area of memory that stores information obtained from resolving
    DNS names. Entries are kept in the cache for the time period specified by the
    TTL.'
