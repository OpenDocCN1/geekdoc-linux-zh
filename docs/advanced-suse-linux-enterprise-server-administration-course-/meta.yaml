    For example, the Apache Web server runs under the user id of the user wwwrun.\
    \ For this reason, the password files must be readable for the user wwwrun.\n\n\
    In this case you have to make sure that only this daemon account can read the\
    \ file and not any other user.\n\n# How Special File Permissions Affect the Security\
    \ of the System\n\nThere are three file system rights that influence the security\
