  md: '# Objective 2  Use Variable Substitution Operators


    In Bash, you can use special variable substitution operators to assign different
    values to variables without having to rely on external commands.


    For example, these special substitution operators allow changing variables by
    deleting certain patterns in their values and returning the rest.


    They also allow you to set a default for a variable for situations where no value
    can be assigned to it.


    The variable substitutions shown in Table 6-1 are possible.


    Table 6-1


    | Substitution Operator | Description |

    |---|---|

    | `${variable-value}` | Returns value if the variable does not exist. |

    | `${variable=value}` | Assigns value to the variable and returns value if the
    variable does not exist. |

    | `${variable+value}` | Returns value if the variable exists. |

    | `${#variable}` | Returns the number of characters in the value of variable.
    |

    | `${variable#pattern}` | Deletes the shortest part matched by pattern from the
    beginning of the variable''s value and returns the rest. |

    | `${variable##pattern}` | Deletes the longest part matched by pattern from the
    beginning of the variable''s value and returns the rest. |

    | `${variable%pattern}` | Deletes the shortest part matched by pattern from the
    end of the variable''s value and returns the rest. |

    | `${variable%%pattern}` | Deletes the longest part matched by pattern from the
    end of the variable''s value and returns the rest. |


    The substitution operators returning or setting a default value (−, =, and +)
    can also be prefixed with a colon so that substitution happens if the variable
    does not exist, or if it exists but has a null value (is empty).


    The following are some examples of how to use the substitution operators:


    ```

    tux@DA1:~> echo $VAR


    tux@DA1:~> echo ${VAR-value}

    value


    tux@DA1:~> echo $VAR


    tux@DA1:~> echo ${VAR=value}

    value


    tux@DA1:~> echo $VAR

    value

    ```'
