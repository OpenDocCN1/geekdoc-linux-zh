  md: 'For each domain there is one DNS server (or name server) defined as being "in
    charge" of its domain. This server is known as the *master server*, and it is
    the authority for this domain (providing authoritative answers).


    This authoritative information is important because DNS servers also temporarily
    store information on other domains in a cache and can pass this information on,
    with the note that it is a non-authoritative answer.


    There are other DNS servers called *slave servers* for the domain that distribute
    the load and serve as backups. Slave servers keep a copy of the information on
    the master server and update this information at regular intervals. This update
    is called *zone transfer*.


    Table 3-1 describes the DNS server types available.


    Table 3-1


    | Master server | Has the main responsibility for a domain. Gets its data from
    local files. |

    | --- | --- |

    | Slave server | Gets its data from the master server using zone transfer. |

    | Caching-only server | Queries data from other DNS servers and stores the information
    in the cache until its expiration date. All replies are nonauthoritative. |

    | Forwarding server | All queries the server cannot answer authoritatively are
    forwarded to other DNS servers. |


    # How to Query DNS


    Various programs are involved in processing a request to the DNS database. The
    first is the resolver, which is a set of library routines used by various programs.


    The resolver makes a request to a DNS server, interprets the answer (real information
    or error message), and sends back this information to the program that called
    it up.


    If the DNS server receives a request from a resolver, one of two things happens:


    - If the DNS server is the authority for the requested domain, the DNS server
    provides the required information to the resolver (the authoritative answer).


    *or*


    - If the DNS server is not the authority for the required domain, the DNS server
    queries the responsible authority for the request domain and gives the result
    to the resolver.


    The data is stored in the cache of the DNS server. If there is another request
    for this data later, the DNS server can provide it immediately (a non-authoritative
    answer). All data has a timestamp, and information is deleted from the cache after
    a certain time.


    Assume that your DNS server wants to find the IP address of the computer *www.suse.de*.
    To do this, the DNS server first makes a request to one of the DNS servers of
    the root domain.'
  merge: -1
  pgno: 112
- img_proc: false
  md: 'Each DNS server knows the authorities responsible for the TLDs. The address
    for each authority required is passed onto the requesting DNS server. For *www.suse.de*,
    this is a DNS server for the TLD *.de*, that is, the computer *dns2.denic.de*.


    Our DNS server then asks for the authority for the domain *suse.de* and, as an
    answer, is given the computer *ns.suse.de*.


    In a third step, this DNS server is queried and, as an answer, gives the IP address
    of the SUSE Web server. This answer is returned by our DNS server to the requesting
    resolver.


    This procedure is illustrated in Figure 3-2.


    ![](bbox=[0.15, 0.29, 0.85, 0.59])


    The DNS servers for the root domain play a very important role in name resolution.
    In order to alleviate the server load due to queries, every DNS server stores
    the information received from other names servers in its cache.


    When queries are made, this information is sent without querying the root DNS
    server anew. However, root DNS servers are very busy despite this caching mechanism.
    Several thousand queries per second are nothing unusual.


    # Install and Configure the BIND Server Software


    To run a DNS server, you need to install the following packages:


    +   - **bind.** The BIND server software (version 9 in SLES 9)

    - **bind-utils.** Utilities to query and test BIND (included in standard installation)'
