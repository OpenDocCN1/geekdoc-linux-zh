  md: '# # Glossary


    **logical partition** — A partition that exists within an extended partition.


    **logical volume** — A partition defined by the LVM service that can contain a
    file system.


    **logical volume group** — A group of physical partitions that is defined by the
    logical volume manager. These groups can span multiple hard disks.


    **Logical Volume Manager (LVM)** — A hard disk partitioning scheme in which partitions
    are managed by system services and can be resized easily.


    **loopback** — An IP address that is used to test the local host.


    **lsmod command** — Used to list currently loaded kernel modules.


    **lspci command** — Lists information about PCI devices on the system.


    **Mail eXchanger (MX)** — A DNS record that identifies the e-mail servers for
    a domain.


    **make command** — The GNU C make manager program. It is used to compile a program
    using the GNU C Compiler and compiler options in a Makefile. It can also be used
    to copy a compiled program to the correct directory on the file system.


    **Makefile** — The file that stores C compilation options for a specific program.
    It is typically created by the configure script.


    **Master Boot Record (MBR)** — The first area on a hard disk that stores the partition
    table and Stage 1 of the GRUB boot loader.


    **master server** — A DNS server that contains a read-write copy of the zone database.


    **memory leak** — A condition whereby a process continually allocates memory without
    releasing memory that it has already been allocated, leading to poor system performance.


    **Message Digest 5 (MD5)** — An encryption method used to encrypt Linux passwords.


    **modprobe command** — Loads modules into the Linux kernel.


    **mpstat command** — Displays CPU statistics for single or multi-processor systems.


    **mt (magnetic tape) command** — Used to manage tape devices.


    **name resolution** — The process whereby an FQDN is associated with its IP address.


    **name server** — A server that contains records for hosts on a network. It may
    be queried to resolve a hostname to an IP address. See DNS Server.


    **Name Server (NS)** — A DNS record that identifies a DNS server that is authoritative
    for the zone.


    **named** — The DNS/BIND daemon in Linux.


    **NetBIOS** — A Windows protocol that uses unique 15-character computer names
    to identify network hosts.


    **Network Information Service (NIS)** — A network service that may be used to
    manage the configuration of several Linux or UNIX computers.


    **network mask** — A number used to determine which portion of an IP address is
    used to identify the network.


    **nmbd** — The NetBIOS daemon in the Samba package.


    **nmblookup command** — Displays NetBIOS computer names for hosts.


    **nonauthoritative answer** — A name resolution response from a DNS server whereby
    the DNS server has to query other DNS servers in order to find the appropriate
    record.


    **notify** — The process whereby a master DNS server informs its slave DNS servers
    of a change to a zone file.


    **object** — A component of an LDAP database. The two main object types are container
    objects and leaf objects.


    **object class** — A type of object within an LDAP database.


    **OpenLDAP** — An LDAP service that is used in SLES.


    **OpenSSL** — The default software used to provide SSL in SLES.


    **openssl command** — Used to manage public/private key pairs in OpenSSL.'
