  md: "To determine your protection needs, ask yourself the following questions:\n\
    \n+   - **Which groups of people can access which information?**\n  Is there information\
    \ reserved for management, while other information is available to all employees?\n\
    - **Where is protected data located?**\n  The degree of data protection needed\
    \ determines the degree of protection for each individual computer in the corresponding\
    \ network.\n- **Which zones exist and what security needs do they have?**\n  You\
    \ should create corresponding security zones for computers belonging to the same\
    \ protection class.\n- **What might happen to security zones if security barriers\
    \ are breached?**\n  This question is not difficult to answer if the security\
    \ zones have previously been clearly defined.\n- **Who are potential attackers?**\n\
    \  You also need to estimate the financial and technical means of the potential\
    \ attackers.\n- **What information is of special interest to others?**\n  This\
    \ question helps you group zones with different security needs.\n- **What are\
    \ the remaining risks when the security concept is implemented?**\n  This question\
    \ can only be asked at the end of the analysis. Consider all questions asked,\
    \ the relevant answers, and the technical and organizational implementation of\
    \ the security concept.\n\nImportant parts of the communication analysis can be\
    \ represented in tables, also known as *access matrices*.\n\nTable 4-1 shows a\
