  md: '# Key Terms


    **Lightweight Directory Access Protocol (LDAP)** — A protocol used to provide
    central authentication and distribute information to network computers.


    **Mail eXchanger (MX)** — A DNS record that identifies the e-mail servers for
    a domain.


    **master server** — A DNS server that contains a read-write copy of the zone database.


    **name resolution** — The process whereby an FQDN is associated with its IP address.


    **name server** — See **DNS server**.


    **Name Server (NS)** — A DNS record that identifies a DNS server that is authoritative
    for the zone.


    **named** — The DNS/BIND daemon in Linux.


    **NetBIOS** — A Windows protocol that uses unique 15-character computer names
    to identify network hosts.


    **nmbd** — The NetBIOS daemon in the Samba package.


    **nmblookup command** — Displays NetBIOS computer names for hosts.


    **nonauthoritative answer** — A name resolution response from a DNS server whereby
    the DNS server has to query other DNS servers in order to find the appropriate
    record.


    **notify** — The process whereby a master DNS server informs its slave DNS servers
    of a change to a zone file.


    **object** — A component of an LDAP database. The two main object types are container
    objects and leaf objects.


    **object class** — A type of object within an LDAP database.


    **OpenLDAP** — An LDAP service that is used in SLES.


    **OpenSSL** — The default software used to provide SSL in SLES.


    **openssl command** — Used to manage public/private key pairs in OpenSSL.


    **opensslgenrsa command** — Used to generate public/private key pairs.


    **PoinTeR (PTR)** — A DNS record that identifies the FQDN associated with an IP
    address for reverse resolution.


    **private key** — A string of data that is typically used to decrypt data that
    was encrypted using the public key.


    **public key** — A string of data that is typically used to encrypt data.


    **recode command** — Used to convert a text file to another Unicode format.


    **Relative Distinguished Name (RDN)** — The simple name of an object in LDAP.


    **resolver** — A host that requests name resolution using DNS.


    **reverse resolution** — A name resolution request that desires the FQDN for a
    particular IP address.


    **Rivet Shamir Adleman (RSA)** — A common asymmetric encryption algorithm.


    **Samba** — A set of services in Linux that provides the SMB and CIFS protocols
    for file and printer sharing with Windows computers.


    **schema** — The list of objects and object properties for an LDAP database.


    **Secure HyperText Transfer Protocol (HTTPS)** — The protocol used to obtain HTML
    Web pages and other Web content from a Web server using SSL encryption.


    **Secure Sockets Layer (SSL)** — A technology that uses public and private keys
    to encrypt Web content as it is being sent between a Web server and Web browser.'
