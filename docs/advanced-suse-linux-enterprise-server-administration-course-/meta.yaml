    \ OpenSource projects or third-party vendors provide RPM packages that are made\
    \ for SLES 9 and can be installed with the RPM command-line tool or with YaST.\n\
    \nIn many cases, however, open source projects provide only tar archives with\
    \ the source code of an application. In this section you learn how to compile\
    \ and install software from these source archives.\n\n# OBJECTIVE 1 UNDERSTAND\
    \ THE BASICS OF C PROGRAMMING\n\nMost applications (and the Linux kernel) are\
    \ written in the C or C++ programming language. To compile and install software\
    \ from source achieves, it is useful to have a basic understanding of C and the\
    \ steps which are necessary to turn program code into an executable file.\n\n\
    > **NOTE:** The C++ language is considered the successor of C. The syntax of C++\
    \ is very similar to C, but C++ lets you create object-oriented code. However,\
    \ many applications and the Linux kernel are still written in C.\n\nIn this objective,\
    \ you learn the following C programming basics:\n\n+   - The Difference Between\
    \ Source Code and an Executable\n- The Structure of a Simple C Program\n- How\
    \ to Compile a Simple C Program\n\n# The Difference Between Source Code and an\
    \ Executable\n\nThere are basically two different types of programming languages:\n\
    \n+   - **Script languages.** Applications written in a script language can be\
    \ easily developed with just a text editor. The script files can be directly executed\
    \ with the help of an interpreter program.\n\n  Examples of script languages are\
    \ Perl, PHP, Python, and the Shell scripting language.\n\n- **Compiler languages.**\
    \ Applications written with this kind of programming language can also be created\
