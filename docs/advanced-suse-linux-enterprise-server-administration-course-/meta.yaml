  md: "+   - **force group**\n  This line forces the Samba server to perform all file\
    \ operations with the group accounting.\n\n# Configure the Export of Home Directories\n\
    \nThe following example exports the home directory of all UNIX users of the Samba\
    \ server. You need to add the users to the smbpasswd file before the setup works:\n\
    \n```\n[homes]\n    comment = Home Directories\n    valid users = %S\n    read\
    \ only = No\n    browseable = No\n```\n\nIn this example, you must name the share\
    \ homes. If Samba finds a share with this name in the configuration file, it is\
    \ treated in a special way.\n\nWhen a share is requested, Samba first scans the\
    \ existing sections of the configuration file. If no section is found, Samba uses\
    \ the requested share name as a user name and looks up the user in the local password\
    \ file.\n\nIf the user is found and the correct password is supplied, Samba automatically\
    \ creates a share for the home directory of the user.\n\nThe following describes\
    \ the lines in the example:\n\n+   - **valid users = %S**\n  The %S macro sets\
    \ the value of the valid users option to the name of the requested share.\n- **read\
    \ only = No**\n  The exported home directory should be readable and writable for\
    \ the authenticated user.\n- **browseable = No**\n  For security reasons, the\
    \ share is not browseable.\n\nTo access an exported home directory, use the address\n\
    *//server_name/user_name.*\n\n# Additional Possibilities with Samba\n\nThis section\
    \ explained only the basic usage of Samba. Many more features and configuration\
    \ options are available to help you customize Samba for your environment."
