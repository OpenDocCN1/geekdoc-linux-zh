  md: '**Section 2 Configure the Network Manually**


    # CHAPTER SUMMARY


    +   - Hosts use network devices that are linked to the network to communicate
    with other computers.

    - Each network device has at least one IP address that may be configured using
    the **ip** command. Alternatively, you can manage your IP configuration in a desktop
    environment using YaST.

    - Network interface and IP information is stored in the /etc/sysconfig/network
    directory. After system initialization, you can use the **ip**, **ifup**, and
    **ifdown** commands to manage the status of your network interfaces.

    - Different IP networks are connected to one another via routers. A host has a
    routing table that typically contains a default gateway route that identifies
    the router on the local network used to relay messages to remote IP networks.
    You can view and change the routing table using the **ip** command.

    - Each host contains a hostname that is stored in the /etc/HOSTNAME file.

    - To connect to network resources by name, a host typically contains the addresses
    of up to three name servers in the /etc/resolv.conf file. Hosts contact these
    name servers to resolve remote names to their respective IP addresses.

    - The **ping** and **traceroute** commands use datagrams to test network communication
    and routing, respectively.


    # KEY TERMS


    **/etc/HOSTNAME** — A file that contains the name of the host.


    **/etc/resolv.conf** — A file that lists up to three DNS servers that may be contacted
    to resolve a remote hostname to an IP address.


    **/etc/sysconfig/network** — The directory that contains most network configuration
    information.


    **/etc/sysconfig/network/routes** — A file that stores static routes for use on
    the system.


    **address** — See IP address.


    **broadcast** — A message destined for all computers on an IP network.


    **datagrams** — Packets that typically use the UDP or ICMP protocols.


    **default route** — The route that is used if no other routes in the routing table
    match the desired destination.


    **driver** — A software component used by the operating system to control hardware
    devices such as network devices.


    **Dynamic Host Configuration Protocol (DHCP)** — A protocol that is used to assign
    IP configuration information to a host on the network.


    **Ethernet** — The standard method used to access network media today. Most network
    adapters on networks use Ethernet.'
