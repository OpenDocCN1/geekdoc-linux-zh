  md: '# # Objective 4 Tune the Network Performance


    There are several different approaches to tuning the network performance of your
    Linux system. Because of the nature of networks, this sometimes includes not only
    your system but the whole network infrastructure.


    The following are two ways you can tune network performance:


    +   - Change Kernel Network Parameters

    - Change Your Network Environment


    # ## Change Kernel Network Parameters


    The Linux kernel lets you change some network parameters during runtime. This
    makes sense on systems that have to deal with a lot of parallel connections (such
    as Web servers).


    The parameters can be set with the sysctl command. To use this command, you have
    to be the root user, because changing kernel parameters is not permitted for normal
    users.


    The most important command line parameter of sysctl is `-w`. With this option,
    you can write a value into a kernel configuration parameter.


    You can also access the kernel parameters from the proc file system, which is
    mounted under /proc. You change the parameters by writing them into the corresponding
    files in the /proc directory.


    Table 8-7 lists several sysctl commands and their effect on network performance.


    Table 8-7


    | sysctl command | Effect |

    |---|---|

    | sysctl -w net.ipv4.tcp_tw_reuse=1

    sysctl -w net.ipv4.tcp_tw_recycle=1 | When a TCP connection has been closed, the
    corresponding socket stays in the TIME-WAIT status for a while. Setting these
    two parameters enables the reuse of these sockets for new connections. On a system
    with many TCP connections, this can reduce the number of open connections and
    the utilization of system resources. |'
  merge: -1
  pgno: 374
- img_proc: false
  md: "Table 8-7 (continued)\n\n| sysctl command | Effect |\n| --- | --- |\n| sysctl\
    \ -w net.ipv4.tcp_keepalive_time=900 | TCP connections are usually kept alive\
    \ for a specific amount of time. After this time period, a system probes to see\
    \ if the connection partner is still reachable. If not, the connection is closed\
    \ and the used resources are freed. The default time for SLES 9 is 1800 seconds.\
    \ By reducing this time, you can reduce the number of opened but unused connections.\
    \ |\n\n# Change Your Network Environment\n\nBecause networking involves more than\
    \ one system, you should consider which changes to other hosts or your network\
    \ infrastructure can improve the network performance.\n\nThe following are some\
    \ suggestions for improving network performance:\n\n+   - **Monitor all other\
    \ system components.** Before you change your network infrastructure, you should\
    \ make sure that your problem is really caused by the network connection.\n\n\
    \  Monitor all other components carefully over a longer period of time, especially\
    \ the CPU and memory utilization.\n- **Limit the collision domain.** If you see\
    \ a lot of collisions when you monitor your system's network interface, there\
    \ are probably too many systems that share the same Ethernet collision domain.\n\
    \n  In this case, you should restructure your network or use switches instead\
    \ of hubs.\n- **Check cable quality.** If you see a lot of transmission errors\
    \ when you monitor a network interface, you might have a problem with your network\
    \ cable. Replace the network cable and monitor the interface again.\n- **Check\
    \ both sides of a connection.** If your server has connectivity problems with\
    \ a specific client and all other clients are working correctly, you should check\
    \ the connection from the client side.\n- **Change network adapters.** In some\
    \ cases, a driver for a network adapter can be faulty and cause a performance\
    \ bottleneck. Try switching to an adapter from a different vendor and monitor\
    \ the system to see if performance improves."
