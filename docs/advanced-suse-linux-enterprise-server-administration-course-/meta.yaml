    \ of several items. To check if the user's birthday is today, two dates must be\
    \ compared: the birthday and the current date.\n\nThe user's birthday is stored\
    \ in the variable `BIRTHDAY`. The current date must also be stored in a variable\
    \ for the comparison. This can be done using command substitution, as in the following:\n\
    \n```\nTODAY=`date +%m-%d`\n```\n\nA closer examination of the comparison reveals\
    \ that the values in the variables cannot be compared with each other (`BIRTHDAY`:\
    \ 1973-12-21, `TODAY`: 09-24). Therefore, the dates must be compared without the\
    \ year.\n\nTo do this, the variable substitutions of the Bash shell can be used\
    \ to truncate the year from the date. The first part of the script should look\
    \ like the following:\n\n```\n#!/bin/bash\necho \"Please enter your date of birth\
    \ (YYYY-MM-DD, for instance 1978-06-21): \"\nread BIRTHDAY\nBIRTHDAY=${BIRTHDAY#*-}\n\
    TODAY= date +%m-%d\n```\n\nNow you can compare the two values with the help of\
    \ an if branch. Most variables are compared using the test command. The test command\
    \ is followed by a string condition such as test `$VARIABLE1 = $VARIABLE2`.\n\n\
    If the condition is met (if the value of `VARIABLE1` is identical to the value\
    \ of `VARIABLE2`), test returns a zero to indicate success.\n\nSo the second part\
    \ of the shell script could look like the following:\n\n```\nif test \"$BIRTHDAY\"\
