    # Creating a Performance Baseline


    ![](bbox=[0.01, 0.71, 0.07, 0.78])


    To aid in troubleshooting performance problems, it is good form to monitor your
    SLES system at various times of the day during normal performance; this is called
    a performance baseline. When a performance problem occurs, you can compare the
    performance baseline to the monitoring data you collect following the performance
    problem. The statistics that are most different will give you more insight into
    the source of the problem. Use the commands in this chapter to create a system
    performance baseline for your SLES system that is stored in a set of files or
    printed out and placed in a log book.'
