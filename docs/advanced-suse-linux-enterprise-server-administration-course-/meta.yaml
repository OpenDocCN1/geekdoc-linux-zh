  md: 'To start the installation program, your computer needs to be configured to
    start from a CD or DVD drive. You might need to change the boot drive order in
    the BIOS setup of your system to boot from the drive.


    Consult the manual shipped with your hardware for further information.


    When your system has started from the installation DVD, Figure 1-1 appears.


    ![](bbox=[0.1, 0.205, 0.8, 0.55])


    Figure 1-1


    You can use the arrow keys to select one of the following options:


    +   - **Boot from Hard Disk.** Boots the system installed on the hard disk (the
    system normally booted when the machine is started). This is the default option.

    - **Installation.** Starts the normal installation process. All modern hardware
    functions are enabled.

    - **Installation - ACPI Disabled.** Starts the installation process with ACPI
    (Advanced Configuration and Power Interface) disabled. If the normal installation
    fails, the system hardware might not support ACPI. In this case, you can use this
    option to install without ACPI support.

    - **Installation - Safe Settings.** Starts the installation process with the DMA
    mode and any interfering power management functions disabled. Use this option
    if the installation fails with the other options.

    - **Manual Installation.** When you select this installation mode, you can load
    driver modules manually and change the advanced installation settings.'
