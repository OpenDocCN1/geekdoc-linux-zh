- img_proc: false
  md: '+   - **rmmod.** This command removes loaded kernel modules. For example:


    ```

    rmmod usb-storage

    ```


    Only modules that are not needed can be removed. In this example, the USB device
    first has to be disconnected before the usb-storage module can be removed.


    Kernel modules are files that are stored in the directory /lib/modules/*kernel-version*/.


    Because modules normally work only with the kernel version for which they are
    built, a new directory is created for every kernel update you install.


    Modules are stored in several subdirectories with a filename extension of .ko
    for kernel object. When loading a module with modprobe, you can not the extension
    and use just the module name.


    # **OBJECTIVE 3 DESCRIBE HOW DEVICE DRIVERS ARE LOADED**


    Because it would be very inconvenient to load all kernel modules manually after
    every system start, there are several methods to perform this task automatically.


    The following is an overview of how device drivers are loaded in SLES 9:


    +   - **initrd.** Important device drivers that are necessary to access the root
    partition are loaded from initrd. initrd is a special file that is loaded into
    memory by the boot loader. Examples of such modules are the scsi host controller
    and file system drivers.


    +   - **initscripts.** Some initscripts are dedicated to loading and setting up
    hardware devices, such as the alsa sound script for sound cards.


    +   - **hotplug.** hotplug also loads kernel modules.


    +   - **X Server.** Although the graphics card drivers are not kernel modules,
    X Server loads special drivers to enable hardware 3D support.


    +   - **manually.** You can always load kernel modules on the command line or
    in scripts with the modprobe command or with the hwup or hwdown commands.


    # **OBJECTIVE 4 DESCRIBE THE SYSFS FILE SYSTEM**


    In the past it was difficult to determine which interface belonged to which device.
    This changed with kernel version 2.6 when the sysfs file system was introduced.


    sysfs is a virtual file system that is mounted under /sys. In a virtual file system,
    there is no physical device that holds the information. Instead, the file system
    is generated virtually by the kernel.'
  merge: -1
  pgno: 385
- img_proc: false
  md: '# Describe the sysfs File System 369


    sysfs represents all devices and interfaces of a Linux system. In sysfs, there
    are four main directories:


    +   - /sys/bus and /sys/devices. These directories contain different representations
    of system hardware. Devices are represented here.


    For example, the following represents a digital camera connected to the USB bus:

    /sys/bus/usb/devices/1-1/


    This directory contains several files that provide information about the device.
    The following is a listing of the files in this directory:


    1-1:1.0 bMaxPower manufacturer

    bcdDevice bNumConfigurations maxchild

    bConfigurationValue bNumInterfaces power

    bDeviceClass detach_state product

    bDeviceProtocol devnum serial

    bDeviceSubClass idProduct speed

    bmAttributes idVendor version


    For example, by reading the content from the manufacturer file, you can determine
    the manufacturer of the device:

    cat manufacturer

    OLYMPUS


    In this case, an Olympus digital camera is connected with the system.


    +   - /sys/class and /sys/block. The interfaces of the devices are represented
    under these two directories.


    For example, the interface belonging to the Olympus digital camera is represented
    by the following directory:

    /sys/block/sda/


    The directory named /sda is the digital camera accessed like a SCSI hard disk.

    The following is the content of the /sda directory:

    dev queue removable size

    device range sda1 stat


    The subdirectory /sda1 represents the interface to the first partition on the
    cameras memory card. For example, by reading the content of /sda1/size, you can
    determine the size of the partition:

    cat sda1/size

    31959


    The partition has a size of 31959 512-byte blocks, which is about 16 MB.


    To connect an interface with a device, file system links are used. In the Olympus
    digital camera example, a link exists from the file /sys/block/sda/device to the
    corresponding device:


    ```

    ll device

    lrwxrwxrwx 1 root root 0 Aug 17 14:03 device ->

    ```'
  merge: -1
