  md: '**Enterprise Volume Management System (EVMS)** — A hard disk partitioning scheme
    similar to LVM that may be used to create resizable partitions that may span multiple
    hard disks.


    **entry** — A reference to an LDAP object.


    **Ethernet** — The standard method used to access network media today. Most network
    adapters on networks use Ethernet.


    **exit code** — See *exit status*.


    **exit status** — An integer value returned by a program that indicates whether
    the program completed successfully (0) or unsuccessfully (1–255).


    **export command** — Used to create and export environment variables.


    **expr command** — Performs integer arithmetic operations.


    **extended partition** — A primary partition that can contain logical partitions.


    **external command** — A command that is represented by an executable file in
    the file system.


    **find command** — Used to find files on the file system using various criteria.


    **for** — A loop control structure that processes a set of elements using the
    same commands until all elements have been processed.


    **forward resolution** — A name resolution request that desires the IP address
    for a particular FQDN.


    **forwarding server** — A DNS server that forwards any DNS queries it cannot resolve
    to another DNS server on the network.


    **free command** — Displays physical and swap memory usage.


    **full backup** — A backup of all data on the file system.


    **Fully Qualified Domain Name (FQDN)** — A complete name that identifies a host
    computer in DNS. It consists of a hostname (or computer name) followed by subdomain/domain
    names and a TLD (e.g., *www.west.africa.com*).


    **function command** — Used to create shell functions.


    **gateway** — See *router*.


    **gcc command** — The GNU C Compiler program.


    **getfacl command** — Used to view the ACL on a file or directory.


    **getopts command** — Used during shell script execution to obtain the options
    entered on the command line when the shell script was executed.


    **GNU Build Tool Chain** — A series of software components that may be used to
    compile C programs in SLES.


    **GQ** — A graphical LDAP database browser.


    **Grand Unified Boot Loader (GRUB)** — The default boot manager in SLES.


    **grep command** — Used to display lines of a file that match a certain regular
    expression pattern.


    **grub-md5-crypt command** — Used to generate an MD5 encrypted password for use
    in the GRUB configuration file.


    **gzip command** — Used to compress files on Linux systems.


    **hard disk mirroring** — A RAID implementation that writes all data to two separate
    hard disks for fault tolerance.


    **Hardware RAID** — A RAID implementation that is managed by the hard disk controller
    hardware.


    **hdparm command** — Used to view and change settings for IDE hard disks.


    **header file** — A file that contains C function declarations for shared libraries.
    To use a shared library in a program, you must refer to the header file during
    program compilation.


    **host** — A computer that can communicate on a network.


    **host command** — Used to perform and test name resolution.


    **hotplug** — A hardware and software feature that allows hardware devices to
    be plugged in and used while the computer is powered on.


    **hotplug agent** — A software component that loads the driver and registers the
    interface for a hotplug device.


    **htpasswd command** — Used to generate Apache passwords for Apache user authentication.'
