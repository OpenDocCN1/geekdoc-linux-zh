  md: '**gateway** — See **router**.


    **host** — A computer that can communicate on a network.


    **ifdown command** — Used to deactivate a network interface.


    **ifup command** — Used to activate a network interface.


    **Internet Control Message Protocol (ICMP)** — A part of the TCP/IP protocol suite
    that is used to relay information about network communications.


    **Internet Protocol (IP)** — The protocol used to communicate with other computers
    on the Internet and most other networks.


    **Internet Protocol (IP) address** — A unique address used to identify a computer
    on a TCP/IP network.


    **ip command** — Used to view, configure, and manage network interfaces and the
    routing table.


    **IPv4** — The current version of the TCP/IP protocol suite.


    **IPv6** — A new version of the TCP/IP protocol suite that contains a larger address
    space and improvements to routing and security.


    **link** — A connection between a network device and the network.


    **loopback** — An IP address that is used to test the local host.


    **name server** — A server that contains records for hosts on a network. It may
    be queried to resolve a hostname to an IP address.


    **network mask** — A number used to determine which portion of an IP address is
    used to identify the network.


    **packet** — A unit of information sent on a network using IP.


    **ping command** — Used to test network connectivity using ICMP.


    **route** — A line in the routing table that lists the path a packet must take
    to arrive at a destination network or host.


    **router** — A device that is used to relay IP packets from one IP network to
    another.


    **routing table** — A table that is stored on each host that contains a list of
    local and remote networks and routers.


    **Time To Live (TTL)** — A number used to represent the useful life of an IP packet.
    Each router decrements the TTL of packets it forwards to other networks. When
    the TTL of a packet reaches 0 it is discarded.


    **traceroute command** — Used to identify the route an IP packet takes to a remote
    host.


    **User Datagram Protocol (UDP)** — A part of the TCP/IP protocol suite that provides
    fast but unreliable communication between hosts on a network.'
