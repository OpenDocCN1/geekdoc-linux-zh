  md: '# How to Add Entries to the LDAP Server


    OpenLDAP provides the command ldapadd to insert data that is in LDIF format into
    the directory. You can use files in the LDIF format to avoid specifying all values
    on the command line.


    LDIF files contain the information that should be included into the directory
    service in a plain text format.


    You can create a different file for each user you would like to add, but you can
    also have multiple user records in one file. An LDIF file contains the following
    entries:


    +   - **dn.** The distinguished name of the object you want to add.

    - **objectclass.** The object classes of the new entry.

    - **attribute.** An attribute of the entry. You normally add more than one attribute
    at the same time.


    If you installed an LDAP server during installation, the basic tree structure
    for user authentication has already been created. If you set up the server later,
    you need to create the structure manually with an LDIF file like the following:


    ```

    dn: dc=example,dc=com

    dc: example

    o: example

    objectClass: organization

    objectClass: dcObject

    ```


    ```

    dn: ou=people,dc=example,dc=com

    objectClass: top

    objectClass: organizationalUnit

    ou: people

    ```


    The file creates two entries in the directory tree:


    +   - The base entry with the DN dc=example,dc=com.

    - An entry below the base entry for the ou people. The dn for this entry is ou=people,dc=example,dc=com.


    Every entry in an LDIF file does the following:


    +   - Sets the distinguished name of the entry.

    - Lists the object classes used for the entry.

    - Lists the attributes and their corresponding values.'
  merge: -1
  pgno: 139
- img_proc: false
  md: '> **CAUTION** Make sure that there are no empty spaces or tabs at the beginning
    or end of a line.


    Because LDAP uses Unicode (UTF-8), special characters in LDIF files have to be
    coded into UTF-8, or they might not be evaluated. This means you need to edit
    the LDIF file with a Unicode editor, or convert the file later.


    You can convert the file by entering the following command:


    ```

    recode lat1.utf8 *ldif_file*

    ```


    The command to insert a data set that exists as an LDIF file looks like the following:


    ```

    ldapadd -x -D *dn_of_the_administrator* -W -f *file*.ldif

    ```


    You need to use the -x option because you haven''t configured SASL authentication
    yet.


    Use the option -D to specify who can access the directory. This should be rootdn,
    specified in the server configuration file.


    Use the option -W to display a password prompt. Otherwise, you must enter the
    password directly at the command line, where it will be visible as plain text.


    Finally, specify the LDIF file with the option -f.


    If the LDIF file is called *example.ldif*, ldapadd should be run as follows:


    ```

    ldapadd -x -D "cn=Manager,dc=example,dc=com" -W -f example. ldif

    Enter LDAP Password:

    adding new entry "dc=example,dc=com"

    adding new entry "cn=people,dc=example,dc=com"

    ```


    After you have set up the basic tree structure (during or after installation),
    you can add a user to the directory with an LDIF file similar to the following:


    ```

    dn: uid=geeko,ou=people,dc=suse,dc=de

    objectClass: top

    objectClass: posixAccount

    objectClass: shadowAccount

    objectClass: inetOrgPerson

    uid: geeko

    uidNumber: 1010

    gidNumber: 100

    cn: Geeko Chameleon

    givenName: Geeko

    sn: Chameleon

    homeDirectory: /home/geeko

    loginShell: /bin/bash

    shadowMax: 99999

    shadowWarning: 7

    shadowInactive: -1

    ```'
  merge: -1
