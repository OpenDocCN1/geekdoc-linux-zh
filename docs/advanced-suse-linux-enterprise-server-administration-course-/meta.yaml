  md: '# OBJECTIVE 3 CONFIGURE AN APACHE WEB SERVER


    The Apache Web server is the leading Web server software. Apache was developed
    as open source software and is shipped with SLES 9.


    To set up an internal Apache Web server, you need to know:


    +   - The Basic Functionality of a Web Server

    - How to Install and Set Up a Basic Apache Web Server

    - The Structure and the Basic Elements of the Apache Configuration Files

    - The Basic Apache Configuration

    - How to Configure Virtual Hosts

    - How to Limit Access to the Web Server

    - How to Configure OpenSSL for Connection Encryption


    # The Basic Functionality of a Web Server


    A Web server delivers data that is requested by a Web browser. The data can have
    different formats such as HTML files, image files, Flash animations, or sound
    files.


    Web browsers and Web servers communicate using HTTP (Hyper Text Transfer Protocol).
    Figure 3-7 shows the relationship between the browser, server, and HTTP.


    ![](bbox=[0.1, 0.54, 0.65, 0.65])


    Figure 3-7


    In addition to delivering data to the Web browser, a Web server can perform tasks
    such as limiting access to specific Web sites, logging access to a file, and encrypting
    the connection between a server and browser.'
