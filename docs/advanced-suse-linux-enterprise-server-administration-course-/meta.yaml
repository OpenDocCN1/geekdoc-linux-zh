  md: '# Preface


    Open Source Software such as Linux has radically changed how the computer industry
    approaches software development. One of the largest changes since 2000 was Novell’s
    switch to SUSE Linux as their main enterprise platform. Today, there are millions
    of Linux users, administrators, and developers, and this community continually
    grows as companies adopt Linux and Open Source technologies. To provide benchmarks
    for hiring, many vendors such as CompTIA, Novell, Red Hat, and the Linux Professional
    Institute (LPI) have released Linux certification exams geared towards different
    skill sets required for common Linux job functions. The Novell Certified Linux
    Professional (CLP) certification is practicum-based, and focuses on the in-depth
    administration of SUSE Linux systems. Using carefully constructed examples, questions,
    and practical exercises, the *Advanced SUSE Linux Enterprise Server Administration
    (Course 3038)* text discusses the concepts required to successfully administer
    Linux systems in an enterprise environment. Alongside *SUSE Linux Enterprise Server
    Administration (Course 3037)*, this text provides you with the information that
    is tested on the CLP certification exam.


    # The Intended Audience


    This book is appropriate for anyone who has experience administering Linux systems
    as well as those who are working towards obtaining the Novell CLP, LPI Level 1,
    or LPI Level 2 certifications. The concepts introduced in this book are a continuation
    of those introduced in *SUSE Linux Enterprise Server Administration (Course 3037)*.
    Although it is preferred that readers have experience administering the SUSE Linux
    distribution, readers who have experience administering other Linux distributions
    will find their skills easy to transfer to SUSE Linux using the examples provided
    in this book.


    # Section Descriptions


    **Section 1, “Install SLES 9,”** discusses the methods and procedures used to
    install the SUSE Linux Enterprise Server (SLES) distribution. This section also
    discusses how to perform post-installation tasks including network configuration,
    software updates, user administration, and hardware installation.


    **Section 2, “Configure the Network Manually,”** discusses the various tools and
    procedures used to configure and test network interfaces. More specifically, this
    includes the configuration of TCP/IP, routing tables, and name resolution.'
  merge: -1
  pgno: 12
- img_proc: false
  md: '# Advanced SUSE Linux Enterprise Server Administration (Course 3038)


    Section 3, “Configure Network Services,” examines the detailed configuration and
    management of the major network services on SLES systems: DNS/BIND, OpenLDAP,
    Apache, and Samba.


    Section 4, “Secure a SLES Server,” introduces the concepts and practices used
    to secure a SLES system. The security of boot loaders, software, PAM, file system
    permissions, and ACLs are examined. In addition, YaST security settings and security
    update management are discussed.


    Section 5, “Manage Backup and Recovery,” discusses the procedures used to backup
    and restore data using the tar, dd, and rsync utilities. In addition, this section
    examines the configuration of scheduled backups and the GRUB boot loader along
    with the procedures used to boot a corrupted system.


    Section 6, “Create Shell Scripts,” introduces the elements and common commands
    used in basic shell scripts. Major topics include input/output, variable substitution,
    decision structures, loop structures, and shell functions.


    Section 7, “Compile Software from Source,” discusses the process used to create
    and compile C programs in SLES as well as the GNU Build Tool Chain. In addition,
    the management of shared libraries is examined.


    Section 8, “Perform a Health Check and Performance Tuning,” examines the procedures
    and tools used to identify performance bottlenecks on a SLES system. Following
    this is a discussion of the procedures and utilities that can be used to tune
    and optimize system performance.


    Section 9, “Manage Hardware and Component Changes,” covers the structure and configuration
    of device drivers and interfaces in SLES. Focus is placed on the sysfs file system
    and the hotplug system.


    Section 10, “Prepare for the Novell CLP Practicum,” allows you to configure many
    of the technologies discussed in previous sections as part of a real-world exercise.
    This exercise is good practice for the Novell CLP certification candidates.


    Appendix A maps the concepts introduced in this course to the Novell CLP and LPI
    certification examinations.


    # Features


    To ensure a successful learning experience, this book includes the following pedagogical
    features:


    +   Section Objectives: Each section in this book begins with a detailed list
    of the concepts to be mastered within that section. This list provides you with
    a quick reference to the contents of that section, as well as a useful study aid.'
  merge: -1
  pgno: 13
- img_proc: false
  md: '■ **Screenshots, Illustrations, and Tables:** Wherever applicable, screenshots
    and illustrations are used to aid you in the visualization of common installation,
    administration, and management steps; theories; and concepts. In addition, many
    tables provide command options that may be used in combination with the specific
    command being-discussed.


    ■ **Exercises:** Exercises are distributed throughout the body of each section.
    They contain specific step-by-step instructions that enable you to apply the knowledge
    gained in the section.


    +   ■ **End-of-Chapter Material:** The end of each section includes the following
    features to reinforce the material covered in the section:

    - **Chapter Summary:** Gives a brief but complete summary of the section

    - **Key Terms List:** Lists all new terms and their definitions

    - **Review Questions:** Test your knowledge of the most important concepts covered
    in the section

    - **Discovery Exercises:** Include theoretical, research, or scenario-based projects
    that allow you to expand on your current knowledge of the concepts that you learned
    in the section


    # Text and Graphic Conventions


    Wherever appropriate, additional information and exercises have been added to
    this book to help you better understand what is being discussed in the section.
    Icons throughout the text alert you to additional materials. The icons used in
    this textbook are as follows:


    Notes present additional helpful material related to the subject being discussed.


    The Caution icon identifies important information about potential mistakes or
    hazards.


    Each Discovery Exercise in this book is preceded by the Discovery Exercise icon.


    **On the DVDs:** On the DVDs included with this text you will find a copy of SLES
    9, VMWare emulation software for lab setup, the Student Manual PDF, files used
    for section exercises, and a Self Study Workbook.'
