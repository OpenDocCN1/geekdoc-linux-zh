  md: '# INTRODUCTION


    Given the number of press reports about attacks on computers, it is not surprising
    that computer security is being taken more seriously.


    Despite the increased interest in security not all administrators and decision
    makers understand what security IT means and why this is important to them.


    An entire branch of the IT industry is concerned with security. Many security
    products have been created in recent years. Firewall solutions and antivirus software
    have become bestsellers, and yet an important component of every security concept—perhaps
    even the most important component—is being neglected.


    Without the appropriate knowledge you cannot recognize and understand security-critical
    issues in complex IT infrastructures.


    This section begins with a general overview of security concepts. This is because
    every aspect of security needs to be seen in the context of the environment. It
    does not make sense to secure one server when the same data can be stolen or manipulated
    on other systems.


    After the introduction, you will learn details about local security. Local security
    covers every threat that can be caused by users of the local system.


    This section does not cover topics that belong to the area of network security.
    Topics such as firewalls and packet filtering are beyond the scope of this course.


    # OBJECTIVE 1 CREATE A SECURITY CONCEPT


    > “It is easy to run a secure computer system. You merely have to disconnect all
    dial-up connections and permit only direct wired terminals, put the machine and
    its terminals in a shielded room and post a guard at the door.”


    F.T. Grampp and R.H. Morris


    It might be possible to operate a computer system in this secure manner, but it’s
    not practical. To deal with network problems in the real world, a different security
    concept is required.


    This objective does not provide sample solutions that can be adapted to your own
    problem solving. Instead, you learn how to create your own security concepts.


    The process of creating a security concept consists of the following parts:


    +   - Understand the Basics of a Security Concept

    - Perform a Communication Analysis

    - Analyze the Protection Requirements

    - Analyze the Current Situation and Necessary Enhancements'
  merge: -1
  pgno: 195
- img_proc: false
  md: "# # Understand the Basics of a Security Concept\n\nFirst, you must know what\
    \ you are protecting your system from. A security concept for a computer used\
    \ by multiple users at different times is different from a security concept for\
    \ an environment in which many different users use multiple computers at the same\
    \ time.\n\nIf users work on different computers and use common resources, such\
    \ as disk space or printers, then a security concept pertaining to a network must\
    \ be considered.\n\nThe formal method of creating a security concept presented\
    \ in this section has been tried and proven in practice. It helps to detect errors\
    \ and sources of danger that are not obvious and provides good documentation of\
    \ the concept.\n\n# # Perform a Communication Analysis\n\nCreating a security\
    \ concept begins with a communication analysis. This includes analyzing the security\
    \ situation and evaluating the dangers.\n\nResources are differentiated according\
    \ to what a user needs and how the access to these resources is controlled.\n\n\
    If users should not have access to certain resources, you can assign different\
    \ access rights. For example, you can determine which user groups can use a resource,\
    \ or if the user groups can only access the resource during a certain time period.\n\
    \nBy answering the following questions, you can learn valuable information to\
    \ use in developing a structured overall picture of your security needs.\n\n+\
    \   - **What information will be exchanged across which barriers and in which\
    \ direction?**\n  A *barrier* can be the virtual barrier between the home directories\
    \ of two users in a UNIX system or a firewall between two networks.\n- **Which\
    \ data packets will be transported with which protocols to which hosts in the\
    \ network?**\n  The fewer protocols you use, the better security you will have,\
    \ simply because there are fewer sources of error.\n- **What resources are available\
    \ to individual users and with which access rights?**\n  Consider the resources\
    \ users will need: printers, files on storage media, the storage media themselves\
    \ (such as CD-ROM drives), sound cards, modems, fax cards, ISDN cards, network\
    \ services (such as FTP or HTTP), and the computing capacity of CPUs.\n- **Which\
    \ resources must be available in each work area?**\n  Even in small companies,\
    \ different departments require different resources."
  merge: -1
  pgno: 196
- img_proc: false
  md: "+   - **Which data must users have access to and in which way?**\n  It does\
    \ not make sense to organize access to data for each specific user individually.\
    \ It is better to structure access rights for user groups.\n- **Which external\
    \ users have external access to company resources, what resources do they use,\
    \ and how is access controlled?**\n  Pay special attention to the authenticating\
    \ external users.\n- **Which external resources does the company provide?**\n\
    \  Usually this means Web and mail servers and other Internet services.\n- **Should\
    \ users be charged for resources?**\n  Many organizations charge users or departments\
    \ for expensive resources (such as Internet bandwidth).\n- **Which tasks must\
    \ external service providers be involved in?**\n  Determine if it is necessary\
    \ to exchange any security-relevant data with the external service provider?\n\
    - **How do security restrictions affect users, and how open are users to these\
    \ restrictions?**\n  Users are more willing to live with restrictions if they\
    \ understand why the restrictions are needed.\n- **Will you filter transmitted\
    \ or stored information on gateways between networks or on computers?**\n  This\
    \ applies to virus control, which should take place where the viruses can be reliably\
    \ detected, on workstations and file servers.\n- **How available do individual\
    \ resources need to be?**\n  Not every file server in the company needs to have\
    \ a high availability setup. This is why it is important to calculate exactly\
    \ what costs are incurred if a resource fails.\n\n# Analyze the Protection Requirements\n\
    \nAfter you have determined the communication demands, you need to analyze the\
    \ protection requirements for the data.\n\nThe expense of securing individual\
    \ resources is determined by the amount of potential damage that could be caused\
    \ by an attack, a faulty operation, or a natural catastrophe.\n\nYou should estimate\
    \ the frequency of the occurrence of possible damage to use in your calculations."
  merge: -1
