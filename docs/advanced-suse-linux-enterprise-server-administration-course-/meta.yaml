  md: "Section 6 Create Shell Scripts\n\n```\nfly ) echo \"A $CREATURE has 6 legs.\"\
    \n;;\n* ) echo \"I haven t the faintest idea how many\n   legs a(n) $CREATURE\
    \ has.\"\n;;\n\nesac\nexit 0\n```\n\nThis script prompts the user to enter the\
    \ name of an animal. The name is then stored in a variable and compared with a\
    \ number of possible matches. For the matches found, the script tells the user\
    \ how many legs the animal has.\n\nTo allow for several expressions to be matched\
    \ within one and the same branch, several expressions can be listed on one line\
    \ with a | symbol as a separator.\n\nThe user input is read and assigned to the\
    \ CREATURE variable.\n\nThe case statement then compares this value against each\
    \ of the expressions provided as alternatives. For instance, if the user enters\
    \ cat, the script prints the matching sentence that says that this animal has\
    \ four legs.\n\nThe asterisk (*) is often used as the last expression to be evaluated\
    \ to cover all cases not matched by the other alternatives. The corresponding\
    \ message states that the number of legs is not known.\n\nIt is important that\
    \ the expressions provide for an exact match of any allowable expression. For\
    \ instance, if someone entered Dog instead of dog, the script will not know the\
    \ number of legs for this strange kind of animal.\n\nFor this reason, it is useful\
    \ to supply the possible alternatives beforehand, as in the following:\n\n```\n\
    case \"$CREATURE\" in\n  [dD]og | [cC]at | [mM]ouse )\n```\n\nYou can provide\
    \ such alternatives in brackets, in the same way as the shell's filename expansion\
    \ mechanism.\n\n# Exercise 6-8 Use the case Command\n\n+   Do the following:\n\
