  md: '# # Run Only Required Software


    The easiest but most effective way to reduce the system load is to run only the
    software that is required to fulfill the purpose of a system. This includes the
    following methods:


    +   - Run a Server System without X

    - Reduce the Number of Daemon Processes


    # ## Run a Server System without X


    Usually, it''s not necessary to run an X-Server on a server system. Most administrative
    tasks including those done in YaST can be done on the text console or remotely
    with SSH or SUSE Linux Remote Administration.


    Preventing the X-Server from being started saves memory and CPU utilization. To
    do so, you can switch to runlevel 3 manually by entering the following:


    ```

    init 3

    ```


    You can also set the default runlevel to 3 to boot the system to runlevel 3 automatically.

    To change the default runlevel, you need to open the file `/etc/inittab` with
    a text editor. In the file, look for a line like the following:


    ```

    id:5:initdefault:

    ```


    By changing 5 to 3, you can change the default runlevel from 5 (multiuser, network,
    graphical login) to 3 (multiuser, network).


    After the change, the line looks like the following:


    ```

    id:3:initdefault:

    ```


    # ## Reduce the Number of Daemon Processes


    In most cases, a server offers only a few services but a lot more daemons are
    actually running.

    By reducing the number of running daemon processes, you can reduce the processor
    and the memory load.


    To get an overview of the current service configuration, you can use the `chkconfig`
    command by entering the following:


    ```

    chkconfig -l

    ```


    The `-l` option lists all services and their configuration in each runlevel. For
    example, the following is the output of the Apache Web server:


    ```

    apache2        0:off  1:off  2:off  3:on   4:off  5:on   6:off

    ```


    As you can see, apache2 is enabled for runlevels 3 and 5.'
  merge: -1
  pgno: 364
- img_proc: false
  md: 'Review the list and make sure that the only services that are running are those
    needed in the default runlevel of your server. If you find a service that is not
    necessary, you can prevent it from starting up at boot time by removing its start
    script from the init process.


    Use a command like the following to remove a service from the init process:


    ```

    chkconfig apache2 off

    ```


    In this example, apache2 is disabled in all runlevels. To re-enable a service,
    use a command like the following:


    ```

    chkconfig apache2 3

    ```


    In this example, apache2 is enabled in runlevel 3.


    Changing the runlevel configuration does not affect the currently running instance
    of a service. If you don''t want to reboot your system with the new configuration,
    you need to stop a running service by calling its rc script manually.


    The command in the following example stops a running instance of apache2:


    ```

    rcapache2 stop

    ```


    # Keep Your Software Up to Date


    There are many reasons to keep your software up to date. Beside possible security
    issues caused by outdated software, up to date software can improve performance.

    Implementation errors that lead to a high utilization of system resources might
    be fixed in a newer release. And newer, faster algorithms might be used.

    However, there might be exceptions to the rule. For this reason, you should test
    new releases carefully before using them in a production environment.


    # Optimize Swap Partitions


    On a system with a lot of swapping, you should usually add more main memory to
    enhance the performance. However, if you can''t do so, optimizing the swap partitions
    can help.

    First, you should make sure that you have enough available swap space. The old
    rule—that you should have double the size of the physical memory as swap space—is
    a bit outdated but still a reasonable starting point.

    The key to speeding up the swap space is to spread it over several disks. This
    works only on systems that have more than one installed disk.

    Every swap partition has an entry in the file /etc/fstab that looks like the following:


    ```

    /dev/hda1    swap    swap    0 0

    ```'
  merge: -1
  pgno: 365
- img_proc: false
  md: 'You can use more than one swap partition by creating partitions and adding
    these to /etc/fstab, as in the following:


    ```

    /dev/hda1    swap    swap    pri=1    0 0

    /dev/hdb1    swap    swap    pri=1    0 0

    /dev/hdc1    swap    swap    pri=1    0 0

    ```


    In this example, three partitions are used on three different disks. The additional
    parameter pri=1 assigns the same priority to all swap partitions.


    With a priority 1 assigned to all swap partitions, the kernel can use the partitions
    in parallel. This leads to a higher overall performance of swapping operations.


    The drives that hold swap partitions should run at the same speed.


    # Change Hardware Components


    If the above methods to reduce the system load do not lead to a lower resource
    utilization, you should consider upgrading the following hardware:


    +   - Upgrade the CPU

    - Upgrade the Memory


    # Upgrade the CPU


    If your system shows a high system load but all other parameters like memory,
    network, and storage load or utilization are not significantly high, you should
    consider upgrading the CPU.


    However, you need to consider the following before upgrading the CPU:


    +   - Are there significantly faster CPUs available for the type of system you
    are using (socket type, BIOS support)?

    - Are the rest of the system components fast enough for the new CPU? Otherwise,
    you could work on one bottleneck and create a new one.

    - Is the system going to be replaced in the near future?

    - Are other, faster systems available in your organization that could be used
    instead of the current system?


    Depending on the answers to these questions, you might decide to replace the whole
    system instead of just the CPU. In some cases, this might even be more economical
    in the long run than just a CPU upgrade.


    # Upgrade the Memory


    Upgrading the memory usually means installing more physical memory. The first
    question you might ask is how much additional memory you should install.'
  merge: -1
  pgno: 366
- img_proc: false
  md: "# Section 8 Perform a Health Check and Performance Tuning\n\nA way to answer\
    \ this question is to look at the amount of swap space that is used by the system\
    \ when the performance problems occur. Adding double the amount of used swap space\
