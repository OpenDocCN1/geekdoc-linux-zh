  md: '**Section 3**   Configure Network Services


    # # How to Install and Set Up a Basic Apache Web Server


    To set up a basic Apache Web server, you need to do the following:


    +   - Install the Required Software Packages

    - Start and Test the Web Server

    - Locate the DocumentRoot of the Web Server


    # ## Install the Required Software Packages


    To run a basic Apache Web server, you need to install the following packages with
    YaST:


    +   - **apache2.** The basic Web server software.

    - **apache2-prefork.** An additional Apache package that influences the multiprocess-ing
    behavior of the Web server.

    - **apache2-example-pages.** Sample HTML pages.


    SLES 9 ships with two Apache versions: Apache series 1 and Apache series 2. This
    section covers Apache series 2 because this version will continue to be developed.


    When you install the packages listed above, YaST prompts you to install also one
    or more additional packages required by Apache. Confirm the additional package
    installation by selecting OK to resolve all dependencies of the Apache packages.


    # ## Start and Test the Web Server


    After installing the required software, you need to start the Web server. Do this
    as the root user by entering the following:


    ```

    rcapache2 start

    ```


    As with all services, enter the following to stop the Web server:


    ```

    rcapache2 stop

    ```


    If you want the Web server to start up at boot time, you need to enter the following:


    ```

    insserv apache2

    ```


    To test whether the Web server is properly installed, open a Web browser and enter
    the following address:


    ```

    http://localhost

    ```


    The browser displays the page shown in Figure 3-8.


    If your SLES 9 server is connected to a network, you (and other hosts on the network)
    can remotely access the Web server by entering the following:


    ```

    http://your_system_IP_address

    ```


    If your network provides a DNS server, you can use the hostname instead of the
    IP address.'
