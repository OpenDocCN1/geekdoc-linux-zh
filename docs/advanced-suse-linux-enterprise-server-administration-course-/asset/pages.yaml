  md: '# OBJECTIVE 4 UNDERSTAND THE LINUX USER AUTHENTICATION


    User authentication plays a central role in IT security. Users are almost always
    granted access to programs and data based on password authentication.


    Even the best mechanisms for administering and setting user permissions would
    be useless if a normal user could log into a system as the system administrator.


    Authentication on a Linux system is based on Pluggable Authentication Modules
    (PAM). To understand and use PAM properly, you need to know the following:


    +   - How PAM Works

    - PAM Configuration

    - The Requirements for a Secure Password


    # How PAM Works


    The Pluggable Authentication Modules (PAM) for Linux is a collection of software
    modules that handles the authentication process. A Linux system administrator
    can use these modules to configure the way programs should authenticate users.


    For example, if a user logs into a Linux system on a virtual terminal, a program
    called login is usually involved in this process.


    Login requires a user''s login name and the password. The password is encrypted
    and then compared with the encrypted password stored in an authentication database.
    If the encrypted passwords are identical, login grants the user access to the
    system by starting the user''s login shell.


    This is sufficient if authentication is done using Linux or UNIX passwords. If
    other authentication procedures are used, such as chip cards instead of passwords,
    all programs that perform user authentication must be able to work together with
    these chip cards.


    Before PAM was introduced, login and all other applications that handle authentication
    like FTP, SSH, or the KDM Display Manager had to be extended to support a chip
    card reader.


    PAM makes things easier. PAM creates a software level with clearly defined interfaces
    between applications (such as login) and the current authentication mechanism.
    Instead of modifying every program, a new PAM module just needs to be added to
    enable authentication with a chip card reader.'
  merge: -1
  pgno: 206
- img_proc: true
  md: "The graphic shown in Figure 4–1 illustrates the role of PAM.\n\n![](img/501a26f547021936f65b9bd40bb47394_207_0.png)\n\
    \nFigure 4-1\n\n# PAM Configuration\n\nThe PAM modules are located in the directory\
    \ /lib/security. Every filename of a module starts with the prefix pam_.\n\nPAM\
    \ configuration is done in the directory /etc/pam.d/. This directory contains\
    \ a configuration file for every application that uses PAM.\n\nThe name of the\
    \ configuration file usually corresponds to the name of the application. For example,\
    \ the name of the configuration file for the application login is also login.\n\
    \nThere is one special configuration file with the name other. This file contains\
    \ the default configuration if no application-specific file is found.\n\nEvery\
    \ line in a configuration file enables a PAM module. Each line consists from the\
    \ left to the right of the following entries:\n\n+   - module-type. One of four\
    \ PAM module types. The four types are as follows:\n  - auth. These modules provide\
    \ two ways of authenticating the user.\n\nFirst, it establishes that the user\
    \ is who he claims to be by instructing the application to prompt the user for\
    \ a password or other means of identification.\n\nSecond, the module can grant\
    \ group membership or other privileges through its credential-granting properties."
