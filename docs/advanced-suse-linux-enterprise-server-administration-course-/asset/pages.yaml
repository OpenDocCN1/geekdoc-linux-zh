    # Chapter Summary


    +   - In order to create an appropriate security concept for your organization,
    you should analyze network communication and protection requirements. Security
    policies may then be designed to reflect the changes required to the current network
    environment.

    - Protect your servers by storing them in a locked room, limiting the software
    that is installed on them, and using both BIOS and GRUB passwords.

    - PAM modules centralize authentication requests from applications and add additional
    security to Linux systems by placing restrictions on authentication and passwords.
    You can control PAM restrictions for specific applications using files in the
