    kernelversion/

    The file /etc/hotplug/blacklist contains a list of driver modules that should
    never be loaded

    by hotplug.

    Sometimes coldplug and hotplug can cause errors during system startup; for example,
    when

    broken kernel module is loaded. In this case, you can switch off both coldplug
    and hotplug

