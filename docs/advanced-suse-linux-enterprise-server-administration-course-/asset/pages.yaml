  md: '# Linux Certification


    While the primary audience for this course is the current Novell CNE™m who has
    completed courses 3036 and 3037 in the CLP curriculum, Linux professionals and
    administrators with experience in other operating systems can also use this course
    to help prepare for the Novell CLP Practicum.


    # LINUX CERTIFICATION


    With Novell® and Linux, you are going places! Industry-recognized certification
    exams are available to leverage your Linux experience and training. Novell''s
    commitment to the open source community is evident by our support of CompTIA''s
    Linux+ vendor-neutral exam.


    # CompTIA Linux+


    The CompTIA Linux+ certification is an international industry credential that
    validates the knowledge of individuals with at least six months of practical Linux
    experience. Professionals who want to certify their technical knowledge in basic
    installation, operation, and troubleshooting for Linux operating systems should
    consider this certification. The skills and knowledge measured by this examination
    were developed with global input to assure accuracy, validity, and reliability.
