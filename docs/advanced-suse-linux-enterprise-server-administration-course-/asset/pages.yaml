  md: '# How to Use the Samba Tools to Access SMB Shares from a Linux Computer


    Although the main purpose of Samba is to provide services for Windows clients,
    it also provides tools to access SMB shares from Linux. It doesn''t matter if
    these shares are provided by Samba or a native Windows server.


    You can perform three basic tasks with the Samba tools:


    +   - nmmblookup for Name Resolution in a NetBIOS Network

    - smclient to Access SMB Shares

    - Mount SMB Shares into the Linux File System


    # Use nmmblookup for Name Resolution in a NetBIOS Network


    With the tool, nmmblookup, you can resolve NetBIOS names into IP addresses. In
    the following example, the IP address for the Samba server with the NetBIOS name
    Fileserver is looked up:


    nmmblookup Fileserver


    The output of the command looks like the following:


    ```

    querying Fileserver on 10.0.0.255

    10.0.0.1 Fileserver<00>

    ```


    In the first line, nmmblookup states that it queries the IP address with a broadcast
    to the address 10.0.0.255. In the second line, it displays the result of the query,
    in this case, address 10.0.0.1 for the system with the NetBIOS name Fileserver.


    ![](img/501a26f547021936f65b9bd40bb47394_176_0.png)


    > CAUTION If the system you are querying is not in the same subnet as yours, the
    name cannot be resolved with a broadcast query. Instead, nmmblookup uses a WINS
    server to resolve the name. For more information, see the man page for nmmblookup.


    # Use smclient to Access SMB Shares


    With the smclient tool, you can access SMB shares on the network. It''s also a
    very useful tool to test a Samba server configuration.'
  merge: -1
