  md: '# Learn About Useful Commands in ShellScripts 293


    The following are some of the special sequences recognized by echo when run with
    the -e option:


    +   - \a. Outputs an alert (sounding the bell). This does not work in the KDE
    Konsole.

    - \c. Do not add a new line at the end of the output.

    - \n. Add a new line (line break).


    The cat command is preferred over echo to output a text file or several lines
    of text.


    # Use the grep and egrep Commands


    The command grep and its variant egrep are used to search files for certain patterns,
    and use the following syntax:


    ```

    **grep searchpattern filename ...**

    ```


    The command prints lines that contain the given search pattern. You can specify
    several files, in which case the output will print the matching line and the corresponding
    filenames.


    Several options are available to specify that only the line number should be printed,
    for instance, or that the matching line should be printed together with leading
    and trailing context lines.


    Search patterns can be supplied in the form of regular expressions, although the
    bare grep command is limited in this regard.


    To search for more complex patterns, use the egrep command, which accepts extended
    regular expressions. As a simple way to deal with the difference between the two
    variants, make sure you use egrep in all of your shell scripts.


    The regular expressions used with egrep need to be in accordance with the standard
    regex syntax.


    To avoid special characters in search patterns interpreted by the shell, enclose
    the pattern in quotation marks, in the following:


    ```

    tux@DA1:~> egrep (b|B) lurp file*

    bash: syntax error near unexpected token |

    tux@DA1:~> egrep "(b|B) lurp"

    file1:blur

    file2:Blurb

    ```


    # Use the sed Command


    The sed program is a stream editor, an editor used from the command line rather
    than interactively. It performs transformations on a line-by-line basis.


    You can specify sed commands either directly on the command line or in a special
    command script loaded by the program on execution.'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'The following is the syntax for the sed command:


    ```

    sed editing-command filename

    ```


    The available editing commands are single-character arguments such as the following:


    +   - d: Delete

    - s: Substitute (replace)

    - p: Output line

    - a: Append after


    With other commands, the output of sed normally goes to standard output, but it
    can also be redirected to a file.


    Each sed command must be preceded by an exact address or address range specifying
    the lines to which the editing command applies.


    Apart from the single-character commands for text transformations, you can also
    specify options to influence the overall behavior of the sed program.


    The following are some important command-line options for sed:


    +   -n, --quiet, --silent. By default, sed will print all lines on standard output
    after they have been processed. This option suppresses the output so sed only
    prints those lines for which the p editing command has been given to explicitly
    re-enable printing.


    +   -e command1 -e command2 .... This option is necessary when specifying two
    or more editing commands. It must be inserted before each editing command.


    +   -ffilename. With this option, you can specify a script file from which sed
    should read its editing commands.


    For any editing commands, it is important to specify the exact line or lines that
    should be processed by the command. One of the most frequently used address labels
    is $, which stands for the last line.


    The following are two examples of the sed command:


    +   - sed -n ''1,9p'' somefile


    This command prints only lines 1 through 9 on stdout.


    +   - sed ''10,$'' somefile


    This command deletes everything from line 10 to the end of the file and prints
    the first 9 lines of somefile.


    You can use a regular expression to define the address or address range for an
    editing command. Regular expressions must be enclosed in forward slashes. If an
    address is defined with such an expression, sed processes every line that includes
    the given pattern.'
  merge: -1
  pgno: 311
