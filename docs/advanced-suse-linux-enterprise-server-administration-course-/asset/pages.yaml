- img_proc: true
  md: '- args. The args are a list of tokens that are passed to the module when it
    is invoked, much like arguments to a typical Linux shell command. Valid arguments
    are usually optional and are specific to any module.


    The following is the default configuration file for the login program on SLES
    9:


    ```

    auth requisite pam_unix2.so nullok

    auth required pam_security.so

    auth required pam_nologin.so

    auth required pam_env.so

    auth required pam_mail.so

    account required pam_unix2.so

    password required pam_pwcheck.so nullok

    password required pam_unix2.so nullok use_first_

    pass_use_authtok

    session required pam_unix2.so none

    session required pam_limits.so

    ```


    The configured modules perform the following tasks:


    +   - auth requisite pam_unix2.so nullok


    The module pam_unix2.so is used during the authentication process to validate
    the login and password provided by the user.


    The control flag is set to requisite; that means that a failure of this module
    (such as a wrong password) stops the authentication process.


    +   - auth required pam_security.so


    This module checks the file /etc/security.so for a list of valid login terminals.
    If a terminal is not listed in that file, the login is denied from that terminal.
    This concerns only the root user.


    +   - auth required pam_nologin.so


    This module checks whether a file /etc/nologin exists. If such a file is found,
    login is denied for all but the root user.


    +   - auth required pam_env.so


    This module can be used to set additional environment variables. The variables
    can be configured in the file /etc/security/pam_env.conf.


    +   - auth required pam_mail.so


    This module displays a message if new mail is in the user''s mail box. It also
    sets an environment variable pointing to the user''s mail directory.


    +   - account required pam_unix2.so


    In this entry the pam_unix2.so module is used again, but in this case it checks
    whether the password of the user is still valid or if the user needs to create
    a new one.'
