  md: "# Build Multiple Branches with a case Statement\n\nYou can create multiple\
    \ branches with case. In a case statement, the expression contained in a variable\
    \ is compared with a number of expressions, and a command is executed for each\
    \ expression matched.\n\nA case statement has the following structure:\n\n```\n\
    case $variable in\n    expression1) command1;\n    expression2) command2;\nesac\n\
    ```\n\nIn the flow chart shown in Figure 6-10, multiple branching with case looks\
    \ similar to a simple branch created with if.\n\n![](img/501a26f547021936f65b9bd40bb47394_298_0.png)\n\
    \nFigure 6-10\n\nThe following is an example of how a multiple branch works:\n\
    \n```\n#!/bin/bash\ncat << EOF\n    Name me an animal and I will tell you how\
    \ many legs it has!\nEOF\n\nread CREATURE\ncase \"$CREATURE\" in\n    dog | cat\
    \ | mouse ) echo \"A \\$CREATURE has 4 legs.\"\n    ;;\n    bird | human | monkey\
    \ ) echo \"A \\$CREATURE has 2 legs.\"\n    ;;\n    spider ) echo \"A \\$CREATURE\
    \ has 8 legs.\"\n    ;;;\n```"
