  md: '# SECTION

    9


    # MANAGE HARDWARE AND COMPONENT CHANGES


    In this section, you learn how SLES 9 handles hardware and device drivers. You
    also learn how to add and replace certain types of hardware.


    +   * Describe the Differences Between Devices and Interfaces

