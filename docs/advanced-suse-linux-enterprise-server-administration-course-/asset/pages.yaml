  md: '# Deploy LDAP on SLES 9 Server


    If you installed the LDAP server during SLES 9 installation, the configuration
    file slapd.conf has already been set up. Otherwise, you need to set the following
    options of the configuration file to reflect your environment:


    +   - suffix dc=your-domain,dc=com


    In this line you set the domain components "dc" according to your domain name.


    +   - rootdn cn=Manager,dc=example,dc=com


    This line sets the administrator of the LDAP server. You can also configure the
    domain components in this line:


    +   - rootpw secret


    This line specifies the password for the administrator. The default password secret
    must be changed.

    For security reasons, the password should be stored in an encrypted form. To create
    an encrypted password, use the following command:


    ```

    slappasswd -s your_password

    ```


    The command outputs a string that has to be copied into the configuration file.
    The entry for the command rootpw looks like the:


    ```

    rootpw {SSH}rawtcakVvoB1sJ6w2+yPa8H02Dprax

    ```


    After finishing the configuration, you can start the server with the following
    command:


    ```

    ldap start

    ```


    If you want to start the LDAP server automatically when the server boots, use
    the following command:


    ```

    inserv ldap

    ```


    After you change the server configuration file, you change the client configuration
    file ldap.conf. You have to set at least two lines:


    +   - host localhost


    This line sets the default server that LDAP clients should connect to.


    +   - base dc=suse,dc=de


    This is the default directory search base that should be used by LDAP clients.


    The configuration shown above is for a SLES 9 authentication server. Depending
    on your environment, you may need a different setup and tree structure.


    ![](img/501a26f547021936f65b9bd40bb47394_138_0.png)'
