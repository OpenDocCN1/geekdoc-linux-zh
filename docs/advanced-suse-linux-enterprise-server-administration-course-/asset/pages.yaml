    # CHAPTER SUMMARY


    +   ■ Regular monitoring of your SLES system is key to identifying bottlenecks
    and solving performance problems.


    +   ■ Monitoring the system load and CPU utilization will identify whether your
    CPU is able to handle the processes currently running on. You can measure these
    parameters using the top, uptime, mpstat and KDE System Guard utilities.


    +   ■ Processes that use more physical memory than they need (called a memory
    leak) lead to reduced performance. Swap memory will be used extensively if there
    is not enough physical memory in your system, and will result in poor system performance.
    You can monitor physical and swap memory using the free, vmstat and KDE System
    Guard utilities.


    +   ■ The disk system may be a bottleneck in some systems if unable to service
    system read and write requests in a timely manner. You can use the vmstat, hdparam,
    and iostat utilities to identify these bottlenecks.


    +   ■ Malfunctioning, slow, or misconfigured network interfaces can also cause
    performance bottlenecks. The Traffic-vis, ip, and KDE System Guard utilities may
    be used to monitor the network interfaces in your system.


    +   ■ DNS, Proxy, and NFS servers on your network can indirectly lead to reduced
    network performance on your SLES.


    +   ■ Starting CPU-intensive processes, running SLES without X, reducing the number
    of daemon processes, obtaining software updates, using multiple swap partitions
    across different hard disks, upgrading the CPU, increasing the swap, and upgrading
    the system memory are common solutions to most CPU or memory-related problems.


    +   ■ Many disk-related performance problems can be solved by changing a kernel
    parameter in the /sys /proc directories. These parameters include the quantum
    parameter for the I/O Scheduler, the Read-ahead parameter for the system queue,
    and the swappiness parameter for the system swap.


    +   ■ You can also disable time updates for mounted file systems, configure ext3
    journaling mode, mount ReiserFS file systems using the notation option, or use
    the hdparam command to enable DMA for IDE hard disks to improve disk performance
    in certain situations.'
