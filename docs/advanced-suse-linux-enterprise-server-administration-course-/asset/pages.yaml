    # Objective 5 Mirror DIRECTORIES WITH THE RSYNC COMMAND


    The command rsync (remote synchronization) is actually intended to create copies
    of complete directories across a network to a different computer.


    When coping data, rsync compares the source and the target directory and transfers
    only data that has changed or been created.


    rsync is the ideal tool to mirror the content of directories or to back up data
    across a network.


    You can use rsync in two different ways:


    +   - Perform Local Copying with rsync

    - Perform Remote Copying with rsync'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Perform Local Copying with rsync


    You can mirror all home directories by entering the following:


    ```

    rsync -a /home /shadow

    ```


    In this example, the mirroring is made to the directory /shadow.

    The directory /home is first created in the directory /shadow, and then the actual
    home directories of the users are created under /home.


    If you want to mirror the content of the directory and not the directory itself,
    you can use a command such as the following:

    rsync -a /home/. /shadow


    By adding a / to the end of the source directory, only the data under /home is
    copied.

    If you run the same command again, only files that have changed or that are new
    will be transferred.

    The option -a used in the examples puts rsync into archive mode. Archive mode
    is a combination of various other options (namely rlptgoD) and ensures that the
    characteristics of the copied files are identical to the originals.


    The following describes these options:


    +   * Symbolic links (option l)

    * Access permissions (option p)

    * Owners (option o)

    * Group membership (option g)

    * Time stamp (option t)


    The option -r ensures that directories are copied recursively.


    Table 5-2 lists some useful rsync options.


    | Option | Description |

    | - | - |

    | -a | Puts rsync into the archive mode. |

    | -X | Saves files on one file system only, which means rsync does not follow
    symbolic links to other file systems. |

    | -v | Enables the verbose mode. Use verbose mode to output information about
    the transferred files and the progress of the copying process. |

    | -z | Compresses the data during the transfer. This is es useful for remote synchronization.
    |

    | --delete | Deletes files that no longer exist in the original directory from
    the mirrored directory. |

    | --exclude-from | Does not back up files listed in an exclude file. |'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'The last option can be used as follows:


    ```

    rsync -a --exclude-from=/home/exclude /home//.shadow home

    ```


    In this example, all files listed in the file /home/exclude are not backed up.
    Empty lines or lines beginning with ; or # he are ignored.


    # Perform Remote Copying with rsync


    rsync and SSH, you can log in to other systems and perform data synchronization
    remotely over the network.


    The following command copies the home directory of the user tux to a backup server:


    ```

    rsync -ave ssh root@DA1:/home/tux/backup/home/

    ```


    In this example, the option -e specifies the remote shell (ssh) that should be
    used for the transmission. The source directory is specified by the expression
    root@DA1:/home/tux. This means that rsync should log in to DA1 as root and transfer
    the /home/tux.


    Of course, this also works in the other direction. In the following example, the
    backup of the home directory is copied back to the DA1 system:


    ```

    rsync -ave ssh /backup/home/tux root@DA1:/home/

    ```


    ![](img/501a26f547021936f65b9bd40bb47394_262_0.png)


    rsync must be installed on both the source and the target computer.


    There is also another way to perform remote synchronization with rsync by running
    an rsync server. This way you can enable remote synchronization without allowing
    an SSH login.


    > For more information, consult the rsync documentation at http://samba.anu.edu.au/rsync/


    ![](img/501a26f547021936f65b9bd40bb47394_262_1.png)


