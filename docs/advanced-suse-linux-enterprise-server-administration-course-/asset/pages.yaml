- img_proc: true
  md: '# Use ACLs for Advanced Access Control


    In effect, this means that all access permissions not contained in the mode value
    are removed from the respective ACL entries. Although no permissions were removed
    from the ACL entry group of the group class, the mask entry was modified to mask
    permissions not using mode.


    This approach ensures the smooth interaction of applications, such as compilers,
    with ACLs. You can create files with restricted access permissions and subsequently
    assign them as executable. The mask mechanism guarantees that the right users
    and groups can execute them as desired.


    # The ACL Check Algorithm


    A check algorithm is applied before any process or application is granted access
    to an ACL-protected file system object.


    As a basic rule, the ACL entries are examined in the following sequence: owner,
    named user, owning group or named group, and other. The access is handled in accordance
    with the entry that best suits the process. Permissions do not accumulate.


    Things are more complicated if a process belongs to more than one group and belongs
    to several group entries. An entry is randomly selected from the suitable entries
    with the required permissions.


    It is irrelevant which of the entries triggers the final result, which is access
    granted. Likewise, if none of the suitable group entry contains the correct permissions,
    a randomly selected entry triggers the final result, which is access denied.


    # How Applications Handle ACLs


    As described in the preceding sections, you can use ACLs to implement very complex
    permissions scenarios that meet the requirements of applications.


    The traditional permission concept and ACLs can be combined in a smart manner.
    However, some important applications still lack ACL support. Except for the star
    archiver, there are currently no backup applications that guarantee the full preservation
    of ACLs.


    The basic file commands (cp, mv, ls, and so on) support ACLs, but many editors
    and file managers (such as Konqueror) do not.


    For example, when you copy files with Konqueror, the ACLs of these files are lost.
    When you modify files with an editor, the ACLs of files are sometimes preserved,
    sometimes not, depending on the backup mode of the editor used.


    If the editor writes the changes to the original file, the access ACL is preserved.
    If the editor saves the updated contents to a new file that is subsequently renamed
    to the old filename, ACLs might be lost, unless the editor supports ACLs.'
  merge: -1
  pgno: 224
