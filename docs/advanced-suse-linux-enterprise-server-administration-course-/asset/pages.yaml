  md: 'In this example, assume the following:


    +   - The system has a single network adapter.


    +   - The system should be used as a router and so you need to install a second
    adapter.


    Do the following:


    +   1. Before you install the new adapter, open the interface configuration file
    of the existing adapter in /etc/sysconfig/network/.


    +   2. Add the following line to the configuration file:

    PERSISTENT_NAME=''external''


    This ensures that the device always gets the interface name.


    +   3. Shut down the system and install the new network adapter.


    +   4. Start the system and boot into level 1.


    +   5. Configure the new network adapter with YaST.


    +   6. Open the interface configuration file of the new network adapter and add
    the following line:

    PERSISTENT_NAME=''internal''


    +   7. Reboot the system into the default runlevel.


    With this method, the old adapter always gets the interface external while the
    new adapter gets internal.


    # CHAPTER SUMMARY


    +   - The operating system interacts with interfaces that use a device driver
    to communicate with hardware devices.


    +   - Device drivers are typically loaded into the Linux kernel as modules, but
    may also be implemented as programs in user space.


    +   - Although modules are loaded at system initialization or via a hotplug event,
    you can insert modules manually into the Linux kernel using the modprobe command.


    +   - To make finding hardware information easier, the /sys directory uses the
    sysfs filesystem and lists information about devices and interfaces.


    +   - The /sys/bus and /sys/devices directories contain files that represent hardware
    devices on the system, whereas the /sys/class and /sys/block directories contain
    files that represent interfaces.'
