  md: '# Section 7 Compile Software from Source


    gcc my_name.c -o my_name


    install: my_name

    install -m 755 my_name /usr/local/bin/my_name


    uninstall: /usr/local/bin/my_name

    rm -f /usr/local/bin/my_name


    clean:

    rm -f my_name


    This Makefile can perform the following tasks:


    +   - Compile the program from source.

    - Install the program.

    - Uninstall the program.

    - Clean up the directory where the compilation is performed.


    Every Makefile consists of targets, dependencies, and commands for the targets.
    Targets and dependencies are separated by a colon. The commands must be placed
    under the target, indented with one tab space. A # introduces comments.


    If you execute the command make while you are in the respective directory, the
    program will search this directory for the files GNUMakefile, Makefile, or make.


    If make is executed without any parameters, the first target of a Makefile is
    used. In the example above, this is all. Target is associated with the target
    my_name, which specifies the step to take: compile the file my_name.c with gcc.


    The command make can also be used with individual targets. For example, the command
    make install (as root) installs the binary file at the specified location and
    make removes the binary file.


    Even large software projects are created in the same way, but the Makefiles are
    much more extensive and complex. If the software will be compiled to a functional
    program on multiple architectures, things are much more complicated.


