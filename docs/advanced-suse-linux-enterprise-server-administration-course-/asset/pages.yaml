  md: '# Device Attributes


    If you are only interested in the device attributes and not in the IP address
    setup, you can enter entering the following command:


    # ip link show


    The command produces an output similar to the following:


    ```

    1: lo: <LOOPBACK,UP> mtu 16436 qdisc noqueue

    link/loopback 00:00:00:00:00 brd 00:00:00:00:00

    2: eth0: <BROADCAST,MULTICAST,TRAILERS,UP> mtu 1500 qdisc pfifo_fast qlen 1000

    link/ether 00:30:05:4b:98:85 brd ff:ff:ff:ff:ff

    3: sit0: <NOARP> mtu 1480 qdisc noqueue

    link/sit 0.0.0.0.0

    ```


    The information is similar to what you saw when entering ip address show, but
    the information about the address setup is missing. The device attributes are
    displayed in brackets after the device name.


    The following is a list of possible attributes and their meanings:


    +   * UP. The device is turned on. It is ready to accept packets for transmission
    and it''s ready to receive packets from the network.

    * LOOPBACK. The device is a loopback device.

    * BROADCAST. The device can send packets to all hosts sharing the same network.

    * POINTPOINT. The device is only connected to one other device. All packets are
    sent to and received from the other device.

    * MULTICAST. The device can send packets to a group of other systems at the same.

    * PROMISC. The device listens to all packets on the network, not only to those
    sent to the device''s hardware address. This is usually used for network monitoring.


    # Device Statistics


    You can use the option -s with the command to display additional statistics information
    about the devices. The command looks like the following:


    # ip -s link show eth0


    By giving the device name at the end of the command line, the output is limited
    to one specific device. This can also be used to display the address setup or
    the device attributes.'
