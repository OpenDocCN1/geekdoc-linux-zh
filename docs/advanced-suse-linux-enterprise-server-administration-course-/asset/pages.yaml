    # Preparing for Installation


    ![](img/501a26f547021936f65b9bd40bb47394_82_0.png)


    When implementing any technology, failing to plan is prone to fail. The same is
    true of a Linux system. Prior to installing SLES, you should complete a pre-installation
    checklist that outlines the hardware present in your computer as well as the main
    configuration choices that you will select during the installation process. These
    include partition, file system, and software package configuration and should
    be planned carefully according to the computer role and future expansion. Prepare
    a short pre-installation checklist that includes this information for your SLES
    system.


    ![](img/501a26f547021936f65b9bd40bb47394_82_1.png)


    # Text-based Installation


    Some video adapter cards are incompatible with the SLES installation program.
    In this case, you can install SLES using a text-based menu interface (called ncurses)
    rather than a graphical interface; on the first boot following installation, SLES
    will then detect and install your video card. Some administrators choose to perform
    a text-based installation because it is faster than a graphical installation since
    the graphical subsystem does not need to be loaded. Perform Exercise 1-1 again,
