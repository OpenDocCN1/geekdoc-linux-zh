    # Analyze Storage Performance


    The performance of the storage system can be an issue, especially on systems that
    have heavy hard disk utilization like ftp, fbp, or other kinds of files servers.


    Before you analyze the hard disk performance and utilization, you should make
    sure that you don''t have any problems with a too-high system load or a lack of
    physical memory.


    A system where the performance problems are caused by the disk subsystem usually
    shows a relatively low network and CPU utilization but a high activity of the
    installed disks that is not caused by memory paging or swapping.'
