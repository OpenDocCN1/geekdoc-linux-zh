    \ is the basic usage of the if command:\n\n```\nif condition\nthen\n  commands\n\
    fi\n```\n\nThe if statement can be extended with an optional else statement, as\
    \ in in the following:\n\n```\nif condition\nthen\n  command1\nelse\n  command2\n\
    fi\n```\n\nIn a program flow chart, a branch created with an if statement can\
    \ be represented like that shown in Figure 6-7.\n\n![](img/501a26f547021936f65b9bd40bb47394_293_0.png)\n\
    \nFigure 6-7\n\nA branch of this type must begin with if and end with fi. Command1\
    \ is only executed if the condition is true.\n\nIf the return code of a command\
    \ is used as condition, the exit code zero (success) represents true. If the exit\
    \ status is not zero or the condition is not true, the shell goes to the end of\
    \ the branch, or if an else statement is present, to the else statement.\n\nWhen\
    \ you use these control structures in a shell script, individual commands (such\
    \ as if, then, and fi) must follow immediately after a command separator."
