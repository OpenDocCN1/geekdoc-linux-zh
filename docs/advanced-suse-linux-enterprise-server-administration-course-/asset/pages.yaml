    The following describes each line:


    +   # include <stdio.h>


    This line is a preprocessor directive. Before the actual source code is compiled
    into a binary file, the file is processed by the preprocessor. In this example,
    the directive instructs the preprocessor to include the file stdio.h.


    A file such as stdio.h contains information about functions that are used later
    in the program. This is a typical characteristic of C. Every variable or function
    needs to be declared before it can be used.


    Files that contain function declarations are called header files and their filenames
    typically end in .h


    +   main(void)


    This line starts the main function of the program. This is the function that is
    initially called when the program is started. A program can consist of more functions,
    but it must have at least a main function.


    The function head normally has three parts:


    +   First, the type of the return value is determined; in this case, int, an integer.


    +   This is followed by the function name. The main function always has the main
    name.


    +   Finally, the arguments of the function are listed in parentheses. The keyword
    void means the function does not expect an argument.


    +   {


    Every thing that belongs to a function is included in curly brackets. This line
    starts the block of the main function.


    +   char name[80];


    This line declares a variable name. The type of the variable is char, a variable
    type for a single character. In this example, since you need to store more than
    just one character in the variable, declare 80 char variables [80].


    This shows another characteristic of C. It is not enough to declare a variable
    before you can use it, you need to specify the type of variable. In the example
    above, it would not be possible to store other data like integers in the variable.'
