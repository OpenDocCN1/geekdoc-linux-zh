  md: '# Section 1 Install SLES 9


    Edit Existing Partitions Select a partition from the list and select Edit. You
    can edit only primary and logical partitions with the Expert Partitioner. You
    cannot edit extended partitions or the entry for the full hard disk.


    If you edit a primary or logical partition, a dialog box appears which is very
    similar to the Create Partition dialog box described above. You can change all
    options except for the partition size.


    After changing the partition parameters, select OK to save your changes to the
    partition list.


    Delete Existing Partitions To delete a partition, from the list, select Delete,
    and then select Yes in the confirmation dialog box. The partition is deleted from
    the partition list.


    Remember that you also delete all logical partitions when you delete an extended
    partition.


    # Resize Existing Partitions Select a partition from the list and select Resize.


    Although you can resize a partition without deleting it to increase free space
    on the hard disk, you should always back up the data on the partition before resizing
    it.


    ![](img/501a26f547021936f65b9bd40bb47394_41_0.png)


    If the selected partitions are formatted with the FAT or NTFS file system, do
    the following before resizing the partition:


    +   FAT file system. To save time, first run Scan Disk and Defrag to make sure
    the FAT partition is free of lost file fragments and cross links and to move files
    to the beginning of the partition.


    If you have optimized virtual memory settings for Windows so that a contiguous
    swap file is used with the same initial (minimum) and maximum size limit, disable
    them before resizing and re-enable them after the resizing has been completed.


    ![](img/501a26f547021936f65b9bd40bb47394_41_1.png)


    If these virtual memory settings are enabled, the resizing might split the swap
    file into many small parts scattered all over the FAT partition. the entire swap
    file would need to be moved during the resizing, which makes the process rather
    slow.


    +   NTFS file system. You must run Scan Disk and Defrag to move the files to the
    beginning of the partition or the NTFS partition cannot be resized.'
