    # Use Command-Line Tools to Query DNS Servers


    Several command-line tools are available to query DNS server. These include the
    following:


    +   - host Command

    - dig Command


    # host Command


    The most important command-line tool for querying a DNS server is *host*. The
    general syntax is as follows:


    ```

    host computer nameservers

    ```


    The following example shows how it is used:


    ```

    da2:~ # host da50

    da50.digitalairlines.com has address 10.0.0.50

    da2:~ # host 10.0.0.49

    49.0.0.10.in-addr.arpa domain name pointer da49.digitalairlines.com.

    ```


    If a DNS server address is not provided, host contacts the servers listed in /etc/resolv.conf.
    If you want to use another DNS server, you have to provide its IP address with
    the command.


    By default, host returns the IP address or the host name, depending on what information
    is given. If you want to query domain information, you need to use the option
    -t with the type of information required, in the following:


    ```

    da2:~ # -t ns novell.com

    novell.com name server ns.novell.com.

    novell.com name server ns1.westnet.net.

    novell.com name server ns2.utah.edu.

    ```


    In this example, the host names of the DNS servers for the domain novell.com are
    requested.'
