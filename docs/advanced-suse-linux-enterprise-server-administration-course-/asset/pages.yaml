  md: '# INTRODUCTION


    Although most hardware devices can be configured with YaST or are even automatically
    detected when plugged into the system, it is sometimes helpful to understand how
    they work in the background.


    In this section, you are introduced to SLES 9 hardware management and how device
    drivers are loaded.


    # OBJECTIVE 1 DESCRIBE THE DIFFERENCES BETWEEN DEVICES AND INTERFACES


    This objective uses the terms "device" and "interface." These terms are often
    confused, not by users and administrators but also by developers of operating
    systems and related tools.


    This course uses the following devices for device and interface:


    +   - **Device.** A device is a real, physical piece of hardware. This can be
    a PCI network adapter, an AGP graphic adapter, a USB printer, or any kind of hardware
    that you can hold, feel, or break if you want to.

    - **Interface.** An interface is a software component associated with a device.
    To use a physical piece of hardware, it needs to be accessed by a software interface.


    A device can have more than one interface.


    Interfaces are usually created by a driver. In Linux, a driver is usually a software
    module that can be loaded into the Linux kernel. Therefore, a driver can be seen
    as the glue between a device and its interfaces.


    # OBJECTIVE 2 DESCRIBE HOW DEVICE DRIVERS WORK


    As described, device drivers access and use a device. There are two basic kinds
    of device drivers:


    +   - **Kernel modules.** The functionality of the Linux kernel can be extended
    by kernel modules. These modules can be loaded and removed during runtime. They
    allow the kernel to provide access to hardware.

    - **User space drivers.** Some hardware needs additional drivers that work in
    user space. Examples of this kind of hardware are printers or scanners.'
  merge: -1
  pgno: 383
- img_proc: true
