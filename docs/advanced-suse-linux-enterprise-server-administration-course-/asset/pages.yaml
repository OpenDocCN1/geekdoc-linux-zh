  md: '# Configure a DNS Server Using BIND 103


    Is is followed by the following time information (the first three entries listed
    here are only important for slave servers):


    +   - The first entry causes a slave server to query a master server after this
    to see if there is a new version of the files (in the example, this is 1D or one
    day).

    - If the slave server cannot reach the master server, the next time entry specifies
    at what intervals new attempts should be made (in the example, this is 2H or two
    hours).

    - If the master server is not reached for a longer period of time, the first time
    entry specifies when the slave server should discard its information on this zone
    (in the example, this is 1W or a week).

    - The basic idea here is that it is better not to pass on any information than
    pass on outdated information.

    - The fourth entry defines for how long negative responses from the DNS server
    are valid. Each requesting server stores responses in its cache, even if a computer
    name could not be resolved (in the example, this is 3H or three hours).


    These time definitions are followed by the name of the computer that is responsible
    for this domain as the DNS server. In all cases, the master server must be entered
    here. If slave servers are used, they should also be entered, as in the following:


    ```

    ;

    ; entry for the name server

    ; digitalirlines.com.      IN NS dai.digitalirlines.com.

    ```


    The name of the domain can be omitted at this point. Then the name from the previous
    entry is taken (the SOA entry).


    At the end of the file are the IP addresses that are allocated to computer names.
    This is done with A (address) entries, as in the following:


    ```

    ;

    ; Allocation of IP addresses to host names

    ;

    dail10      IN A      10.0.0.10

    dail12      IN A      10.0.0.12

    dail13      IN A      10.0.0.13

    ```


    **The File /var/lib/named/master/10.0.0.zone** The file for reverse resolution
    contains similar entries as the file for forward resolution. At the beginning
    of the file there is the definition of a default TTL and an SOA entry.


    In the SOA and NS entries, the IP address of the network is written in reverse
    order:


    +   - Database file for the domain digitalirlines.com:

    - reverse resolution for the network'
