  md: '# INTRODUCTION


    His textbook is based on Novell Authored Courseware Advanced SUSE Linux Enterprise
    Server Administration (Course 3038), which Novell sells and distributes to commercial
    and academic institutions, as well as self-study customers.


    Utilizing the strength of Novell''s original content, software, and hands-on exercises,
    Course Technology has reformatted and enhanced the texts for an academic audience.
    Additional end-of-chapter exercises, student labs, and instructor tools—test banks,
    slide decks, and online deliverables—have been added to produce quality courseware
    based on Novell''s SUSE Linux.


    The Novell course developers have reviewed the manuals from Course Technology
    to ensure that, although in a new format, the content is consistent with Novell''s
    own manuals, meeting the objectives to prepare students to take the Certification
    Exams.


    To learn more about Novell Academic Programs, visit www.novell.com/natp.


    In the Advanced SUSE Linux Enterprise Server Administration (3038) course you
    learn the SUSE Linux Enterprise Server 9 (SLES 9) administration skills necessary
    to complete your basic SLES 9 skill set.


    These skills, along with those taught in the SUSE Linux Fundamentals (3036) and
    SUSE Linux Enterprise Server Administration (3037) courses, prepare you to take
    the Novell® Certified Linux Professional (Novell CLP) certification practicum
    test.


    The contents of your kit include two DVDs. The first DVD is your Course DVD and
    contains the following:


    +   - Advanced SUSE Linux Enterprise Server Administration (3038) Manual

    - Advanced SUSE Linux Enterprise Server Administration (3038) Self-Study Workbook

    - Advanced SUSE Linux Enterprise Server Administration (3038) Self-Study Files

    - SLES 9 VMware Server'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    The second DVD contains a full evaluation version of SUSE Linux Enterprise Server
    9. To accommodate this academic deliverable, the original software has been modified
    from CD to DVD and is distributed on an "AS IS" basis. Please note that this software
    is for classroom use only and is not to be used in a production environment.


    To download a fully functional, supported, and upgradable version of the SUSE
    Linux-Enterprise Server and other Novell Open Source products, visit www.novell.com/downloads.


    The SLES 9 3038 VMware Server DVD contains a VMware Workstation SLES 9 server
    that you can use with the Advanced SUSE Linux Enterprise Server Administration
    Self-Study Workbook (in PDF format on your Course CD) outside the classroom to
    practice the skills you need to take the Novell CLP practicum.


    ![](img/501a26f547021936f65b9bd40bb47394_19_0.png)


    Instructions for setting up a self-study environment are included in the Advanced
    SUSE Linux Administration Self-Study Workbook.


    If you do not have a copy of VMware Workstation, you can obtain a 30-day evaluation
    version at www.vmware.com. If you want to dedicate a machine to install SLES 9,
    instructions are also provided in the Self-Study Workbook.


    # COURSE OBJECTIVES


    The course teaches you how to perform the following SUSE Linux administrative
    tasks for SLES 9:


    +   1. Install SLES 9 with a custom partitioning

    2. Configure the network manually

    3. Configure network services

    4. Secure a SLES 9 server

    5. Manage backup and recovery

    6. Create shell scripts

    7. Compile software from source

    8. Perform a health check and performance tuning

    9. Manage hardware and component changes


    These tasks are common to an experienced SUSE Linux administrator in an enterprise
    environment.


    The final day of class is reserved for a "LiveFire" exercise that provides a set
    of scenarios to test your SLES 9 administration skills and prepare you to take
    the Novell CLP Practicum.'
  merge: -1
