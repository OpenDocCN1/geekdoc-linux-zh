  md: '# Key Terms 255


    /etc/cron.hourly — The directory that stores scripts that will be executed hourly
    by the cron service.


    /etc/cron.monthly — The directory that stores scripts that will be executed monthly
    by the cron service.


    /etc/cron.weekly — The directory that stores scripts that will be executed weekly
    by the cron service.


    /etc/crontab — The file used by the cron service to schedule system-wide commands.


    /etc/grub.conf — The file that lists the location of GRUB commands.


    /var/spool/cron/allow — A file lists users who can use the crontab command.


    /var/spool/cron/deny — A file that lists users who cannot use the crontab command.


    /var/spool/cron/tabs — The directory used by the cron service to schedule commands
    for a particular user account.


    backup window — The amount of time available to back up data. The backup window
    is not normally performed during working hours.


    boot loader — The program used to load and start the operating system kernel at
    startup.


    cron — The system service that executes commands repetitively in the future based
    on information in crontabs.


    crontab command — Used to schedule user commands to execute repetitively in the
    future.


    dd command — Used to copy files to an alternate location using a particular format
    or method.


    differential backup — A backup of all data on the file system that has been modified
    since the last backup.


    find command — Used to find files on the file system using various criteria.


    full backup — A backup of all data on the file system.


    Grand Unified Boot Loader (GRUB) — The default boot manager in SLES.


    gzip — Used to compress files on Linux systems.


    incremental backup — A backup of all data on the file system that has been changed
    since the last backup.


    init — The first process started by the Linux kernel; it is responsible for starting
    and stopping other processes.


    Master Boot Record (MBR) — The first area on a hard disk that stores the partition
    table and Stage 1 of the GRUB boot loader.


    mt (magnetic tape) command — Used to manage tape devices.


    Rescue System — A small Linux system that is loaded into memory when booting from
    the SLES DVD and may be used to repair a Linux system.


    rsync (remote synchronization) command — Used to copy files and directories to
    a different location on the local computer or to a remote computer across a network.


    Storage Area Network (SAN) — A private network that is used to back up from servers
    that includes network-attached storage devices.


    tar (tape archiver) command — A command-line utility that may be used to archive
    files and directories.'
