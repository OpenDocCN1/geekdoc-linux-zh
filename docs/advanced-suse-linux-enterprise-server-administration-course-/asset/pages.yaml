  md: '# Discovery Exercises


    # DISCOVERY


    # Creating a Security Policy


    Using the information provided in this chapter, create a sample security policy
    document for your school, company, or organization. Ensure that you perform a
    communication analysis, analyze the protection requirements, and prepare an access
    matrix to summarize the servers, clients, and connection technologies used.


    ![](img/501a26f547021936f65b9bd40bb47394_246_0.png)


    # Configuring Local Security


    Using the information and procedures outlined in this chapter, secure your local
    SLES computer as much as possible without restricting access to information that
    you require. More specifically, perform the tasks listed below:


    +   1. Physically secure the location of your computer.

    2. Physically secure the BIOS and boot manager.

    3. Ensure that unnecessary services are stopped in runlevel 5.

    4. Restrict root logins to tty1 and tty2 only.

    5. Verify that all user passwords are greater than six characters and resist dictionary
    attacks.

    6. Verify that any files that use the SUID and SGID bits are either part of the
    SLES operating system or have been thoroughly tested.

    7. Ensure that no unnecessary permissions have been granted to regular users for
    system files and directories.


    ![](img/501a26f547021936f65b9bd40bb47394_246_1.png)


    # Configuring Local Security Using YaST


    Several security-related parameters may be changed using the Security Settings
    module under Security and Users in YaST. Use this module to set custom security
    settings for your computer that perform the following actions:


    +   1. Require that passwords are a minimum of eight characters long, be checked
    against dictionary words, and be difficult to guess.

    2. Store passwords using the Blowfish encryption algorithm.

    3. Expire passwords every 42 days. Users should be warned five days before expiration.

    4. Restrict the ability to shut down the system from the KDM to the root user.

    5. Record failed login attempts, and sets a delay after two invalid login attempts.

    6. Set secure file permissions.

    7. Allow the current directory in the path statement for all users.


    ![](img/501a26f547021936f65b9bd40bb47394_246_2.png)'
