  md: '# Key Terms 225


    +   - When using the SUID and SGID permissions, test your program thoroughly to
    ensure no security loopholes exist during execution.


    +   - Use the sticky bit permission on public directories to prevent data loss.


    +   - ACLs may be used to expand the assignment of traditional Linux permissions
    to specific users and groups. You can use ACLs on files and directories using
    the setfacl command and obtain ACL information from files and directories using
    the getfacl command.


    +   - Default ACLs may be set on a directory to modify the ACL on newly created
    files and subdirectories.


    +   - You can select an overall security level for your system using YaST to modify
    several configuration files that contain security-related information such as
    password encryption and system file permissions.


    +   - There are many Web resources that you can use to stay informed about current
    security issues.


    +   - The YOU module may be used to obtain important security-related patches
    for the SUSE update servers.


    # Key Terms


    +   - /boot/grub/menu.list — The GRUB boot manager configuration file.

    - /etc/pam.d — The directory that stores PAM configuration files.

    - /etc/permissions.local — A file that lists the user-defined permission restrictions
    for system files.

    - /etc/security.secure — A file that lists file permission restrictions for system
    files.

    - /etc/securetty — A PAM file that lists valid root login terminals.

    - /etc/security/limits.conf — A PAM file that lists user resource limits.

    - /lib/security — The directory that stores PAM modules.

    - Access Control List (ACL) — A file attribute that allows additional user and
    group definitions to be added to the permission mode of the command.

    - access matrices — A table that compares the types of workstations within an
    organization, the servers they require access to, and the technologies involved.

    - barrier — A device that restricts the flow of data, such as a firewall or file
    access restriction.

    - Blowfish — An encryption method used to encrypt Linux passwords.

    - chconfig command — Used to list and configure services that are started in each
    system run level.

    - Data Encryption Standard (DES) — The default encryption method used in SLES
    for passwords.

    - dictionary attack — An attempt to gain access to a system user by guessing passwords
    using common dictionary word combinations.

    - getfacl command — Used to view the ACL on a file or directory.'
