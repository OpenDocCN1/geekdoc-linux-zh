  md: "# Configura a DNS Server Using BIND\n\nBefore starting the DNS server, you\
    \ have to make some basic configuration changes. After finishing your configuration,\
    \ you can start the server using the following command:\n\n```\nrcnamed start\n\
    ```\n\nTo stop a running server, use the following command:\n\n```\nrcnamed stop\n\
    ```\n\nTo have the DNS server start automatically at boot time, use the following\
    \ command:\n\n```\ninsnerv named\n```\n\nThis creates the necessary links in the\
    \ runlevel directories.\n\n# Configure a Caching-only DNS Server\n\nA caching-only\
    \ DNS server does not manage its own databases but merely accepts queries and\
    \ forwards them to other DNS servers. The supplied replies are saved in the cache.\n\
    \nA caching-only DNS server can be used as a workstation or a gateway that has\
    \ access to an external DNS server.\n\nThe DNS server configuration is defined\
    \ in the file /etc/named.conf. You can use the example file that is installed\
    \ with the DNS package as a configuration file for a caching-only server.\n\n\
    The following example shows a simple configuration:\n\n```\nDA1:- # ip address\
    \ show\n1: lo: LOOPBACK,UP> mtu 16436 qdisc noqueue\n#\n# /etc/named.conf: Configuration\
    \ of the name server (BIND9)\n#\n# Global options\n#\noptions\n{\n# In which directory\
    \ are the database files?\n#\n    directory \"/var/lib/named\";n\n};\n```\n\n\
    The global options are defined in the options block at the beginning of the file.\
    \ The directory containing the database files (or zones files) is listed. Normally,\
    \ this is /var/lib/named/\n\nAll filenames that follow the /var/lib/named directory\
    \ refer to the directory. The directory is created when installing the server\
    \ package. It contains several preconfigured files. Other options can also be\
    \ defined in this file."
