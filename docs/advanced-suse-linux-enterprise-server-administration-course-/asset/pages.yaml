  md: '# ACL Types


    There are two basic classes of ACLs:


    +   - Minimum ACL. A minimum ACL comprises the entries for the types owner, owning
    group, and other, which correspond to the conventional permission bits for files
    and directories.


    +   - Extended ACL. An extended ACL goes beyond this. It contains a mask entry
    and can contain several entries of the named user and named group types.


    ACLs extend the classic Linux file permission by the following permission types:


    +   - named user. With this type, you can assign permissions to one or more users.


    +   - named group. With this type, you can assign permissions to one or more groups.


    +   - mask. With this type, you can limit the permissions of named users or groups.


    Table 4-10 is an overview of all possible ACL types.


    | Type | Text Form |

    | --- | --- |

    | owner | user::rwx |

    | named user | user::name:rwx |

    | owning group | group::rwx |

    | named group | group:name:rwx |

    | mask | mask::rwx |

    | other | other::rwx |


    The permissions defined in the entries owner and other are always effective. Except
    for the mask entry, all other entries (named user, owning group, and named group)
    can be either effective or masked.


    If permissions exist in the named user, owning group, or named group entries as
    well as in the mask, they are effective. Permissions contained only in the mask
    or only in the actual entry are not effective.


    This means that the entries for named user, owning group, and named group are
    combined by a logical AND with the mask entry.


    Table 4-11 determines the effective permissions for the user jane.


    | Entry Type | Text Form | Permissions |

    | --- | --- | --- |

    | named user | user:jane:r-x | r-X |

    | mask | mask::rw- | rw |

    | Effective permissions: | | r-- |'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Section 4 Secure a SLES 9 Server


    The ACL contains two entries, one for the named user jane and one mask entry.
    Jane has the permissions to read and execute the corresponding file, but the mask
    only contains permissions for reading and writing.


    Because of the AND combination, the effective rights allow jane to read only the
    file.


    # How ACLs and Permission Bits Map to Each Other


    When you assign an ACL to a file or directory, the permissions set in the ACL
    are mapped to the standard UNIX permissions.


    Figure 4-2 illustrates the mapping of a minimum ACL.


    | owner | user::rw-- | rw-- | owner class |

    |---|---|---|---|

    | owning group | group:r-- | r-- | group class |

    | other | other::--- | --- | other class |


    Figure 4-2


    The figure is structured in three blocks:


    +   * The left block shows the type specifications of the ACL entries.

    * The center block displays an example ACL.

    * The right block shows the respective permission bits according to the conventional
    permission concept as displayed by ls -l, for example.


    Figure 4-3 shows an example of an extended ACL.


    | owner | user::rw-- | rw-- | owner class |

    |---|---|---|---|

    | named user | user:jane:rw-- | | |

    | owning group | group:r-- | | |

    | mask | mask::rw-- | rw-- | group class |

    | other | other::--- | --- | other class |


    Figure 4-3'
  merge: -1
