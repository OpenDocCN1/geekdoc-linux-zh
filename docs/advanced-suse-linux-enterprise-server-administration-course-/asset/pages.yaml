    # OBJECTIVE 5 Ensure File System Security


    After a user has logged in to the system, what he can and can''t do is mainly
    determined by the security settings of the file system.


    In UNIX systems like Linux, file system security is especially important as every
    resource available on the system is represented as a file.


    For example, when a user tries to access the sound card to play back audio data,
    the access rights of the sound card are determined by the permission settings
    of the corresponding device file in the /dev directory.


    To ensure a basic file system security, you need to know the following:


    +   - The Basic Rule for User Access


    +   - The Basic Rule for User Read Access


    +   - How Special File Permissions Affect the Security of the System


    # The Basic Rule for User Write Access


    The files used in Linux are structurally UNIX file systems. They support the typical
    file access permissions (read, write, execute, sticky bit, SUID, SGID, etc.).


    Apart from additional standard functionalities, such as various time stamps, the
    access permissions can be administered separately for file owners, user groups,
    and the rest of the world (user, group, other).


    As a general rule, a normal user should only have write access in the following
    directories:


    +   - The home directory of the user


    +   - The /tmp directory to store temporary files


    Depending on the purpose of a computer other directories can be writable by users.
    For example, if you install a Samba file server, a writable share needs a directory
    that is also writable for the UNIX user the connection is mapped to.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Section 4 Secure a SLES 9 Server


    Some device files (like for sound cards) might also be writable for users since
    applications need to send data to the corresponding devices.


    # The Basic Rule for User Read Access


    Some files in the system should be protected from user read access. This is important
    for files that store passwords.


    No normal user account should be able to read the content of such files. Even
    when the passwords in a file are encrypted, the files must be protected from any
    unauthorized access. The following lists some files containing passwords on a
    Linux system.


    +   * /etc/shadow. This file contains user passwords in an encrypted form. Even
    when LDAP is used for user authentication, this file contains at the root password.

    * /etc/samba/smbpasswd. This file contains the passwords for Samba users.

    * Files with Apache passwords. The location of these files depends on your configuration.
    They contain passwords for the authorized access to the Web server.

    * /etc/openldap/slapd.conf. This file contains the root password for the openLDAP
    server.

    * /boot/grub/menu.lst. This file can contain the password for the GRUB boot loader.


    ![](img/501a26f547021936f65b9bd40bb47394_213_0.png)


    This list is not complete. There can be more password files on your system, depending
    on your system configuration and your software selection.


    Some password files can be readable for a nonroot account. This is normally the
    account under which user ID a service daemon is running.

    For example, the Apache Web server runs under the user ID of the wwwrun. For this
    reason, the password files must be readable for the user wwwrun.

    In this case you have to make sure that only this daemon account can read the
    file and not any other user.


    # How Special File Permissions Affect the Security of the System


    There are three file system rights that influence the security in a special way:


    +   * The SUID bit. If the SUID bit is set for an executable, the program is started
    under the user ID of the owner of the file. In most cases, this is used to allow
    normal users to run application with the rights of the root users.

    This bit should only be set for applications that are well tested and in cases
    where no other way can be used to grant access to a specific task.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Use ACLs for Advanced Access Control 197


    An attacker could get access to the root account by exploiting an application
    runs under the UID of root.


    +   - The SGID bit. If this bit is set, it lets a program run under the GID of
    the group to which the executable file belongs. It should be used as carefully
    as the SUID bit.


    +   - The sticky bit. The sticky bit can influence the security of a system in
    a positive way. In a globally writable directory,it prevents users from deleting
    other files that are stored in these directories.


    Typical areas for the sticky bit include directories for temporary storage (such
    as /tmp and /var/tmp). Such a directory must be writable by all users of a system.


    However, the write permissions for a directory do not only include the permission
    to create files and subdirectories, but also the permission to delete these, regardless
    of whether the user has access to these files and subdirectories.


    If the sticky bit is set for such writable directory, deleting or renaming files
    in this directory is only possible if one of the following conditions is fulfilled:


    +   - The effective UID of the deleting or renaming process is that of the file
    owner.


    +   - The effective UID of the deleting or renaming process is that of the owner
    of the writable directory marked with the sticky bit.


    +   - The superuser root is allowed to do anything.


    # OBJECTIVE 6 Use ACLs for Advanced Access Control


    To use ACLs for advanced file system access control you need to know the following:


    +   - The Basics of ACLs

    - Important ACL Terms

    - ACL Types

    - How ACLs and Permission Bits Map to Each Other

    - How to Use the ACL Command-Line Tools

    - How to Configure a Directory with an Access ACL

    - How to Configure a Directory

    - The ACL Check Algorithm

    - How Applications Handle ACLs'
