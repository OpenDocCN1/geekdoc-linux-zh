  md: '# Troubleshoot the Installation Process 53


    Table 1-1 contains an overview of the most common installation problems, possible
    causes, and solutions.


    # Table 1-1


    | Problem | Cause | Solution |

    |---|---||

    | The system does not start from the installation media. | The system is not configured
    to boot from the CD or DVD drive. | Enter the BIOS setup of the system and choose
    the CD or DVD drive as the first boot drive. Read the system manual for details
    about the BIOS setup. |

    | | The CD or DVD drive is defective. | Try to boot a different system with the
    SLES 9 DVD. If it works, the CD or DVD drive of the actual system might be defective.
    If the installation DVD does not boot on a different system, the CD or DVD itself
    could be defective. Contact your reseller to exchange the SLES 9 CD or DVD set.
    |

    | The installation program does not start. | Your system does not support port
    network hardware features correctly. | Select Installation – ACPI Disabled. If
    that doesn''t fix the problem, select Installation – Save Settings from the Boot
    menu of the CD or DVD. |

    | | | Install at least 256 MB of main memory and start the installation again.
    |

    | The installation process stops. | Your system has less than 256 MB of main memory.
    | Select Installation – ACPI Disabled. If that doesn''t fix the problem, select
    Installation – Save Settings from the Boot menu of the CD or DVD. |n| | Your system
    does not support network hardware features correctly. | If the installation process
    also stops on a different system, the CD or DVD drive could be defective. Contact
    your reseller to exchange the SLES 9 CD or DVD set. |

    | | The installation CD or DVD is defective. | | |

    | The network connection test or Online Update fails. | There is no DHCP server
    in the network. | If you configured your network card to use DHCP, assign a static
    IP address and configure routing and DNS settings manually. |

    | | There is no route to the Internet. | Set the default gateway correctly. |

    | | The system is using the wrong Proxy settings. | Set the right proxy configuration
    in the network configuration dialog box.

    nYou can also skip the connection test and the Online Update and perform an Online
    Update in the installed system. |'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Section 1 Install SLES 9


