  md: 'The file /etc/sysconfig/network/ifcfg.template contains a template that you
    can use as a base for device configuration files.


    # Configure a Device Dynamically with DHCP


    If you want to configure a device by using a DHCP server, you set the BOOTPROTO
    option to dhcp as shown in the following:


    ```

    BOOTPROTO=''dhcp''

    ```


    When the device is configured using DHCP, you don''t need to set any options for
    the network address configuration in the file. If there are any settings, they
    are overwritten by the settings of the DHCP server.


    # Start and Stop Configured Devices


    To apply changes to a configuration file, you need to stop and restart the corresponding
    device. You can do this with the commands ifdown and ifup.


    For example, entering the following ifdown command disables the device eth0:


    ```

    ifdown eth0

    ```


    The following ifup command enables eth0 again:


    ```

    ifup eth0

    ```


    When the device is restarted, the new configuration is read from the configuration
    file.


    # OBJECTIVE 4 SET UP ROUTING WITH THE IP TOOL


    You use the ip tool to configure the routing table of the Linux kernel. The routing
    table determines the path IP packets use to reach the destination system.


    > CAUTION Because routing is a very complex topic, this objective only covers
    the most common routing scenarios.


    You use the ip tool to perform the following tasks:


    +   - View the Routing Table

