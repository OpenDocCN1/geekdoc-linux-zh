  md: '# View the Routing Table


    To view the current routing table, enter the following command:


    ```

    ip route show

    ```


    For most systems, the output looks similar to the following:


    ```

    10.0.0.0/24 dev eth0 proto kernel scope link src \ 10.0.0.2

    169.254.0.0/16 dev eth0 scope link

    127.0.0.0/8 dev lo scope link

    default via 10.0.0.1 dev eth0

    ```


    Every line represents an entry in the routing table. Each line in the example
    is shown and / explained below:


    +   - 10.0.0.0/24 dev eth0 proto kernel scope link src \


    +   - 10.0.0.2


    This line represents the route for the local network. All network packets to a
    system / in the same network are sent directly through the device eth0.


    +   - 169.254.0.0/16 dev eth0 scope link


    This line shows a network route for the 169.254.0.0 network. Hosts can use this
    / network for address auto configuration.


    SLES automatically assigns a free IP address from this network when no other /
    device configuration is present. The route to this network is always set, especially
    / when the system itself has no assigned IP address from that network.


    +   - 127.0.0.0/8 dev lo scope link


    This is the route for the loopback device.


    +   - 10.0.0.1 dev eth0


    This line is the entry for the default route. All network packets that cannot
    be sent / according to the previous entries of the routing table are sent through
    the gateway / defined in this.


    Depending on the setup of your machine, the content of the routing table varies.
    In most / cases, you have at least two entries in the routing table:


    +   - One route to the local network to which the system is connected


    +   - One route to the default gateway for all other packets'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Add Routes to the Routing Table


    The following are the most common tasks you do when adding a route:


    +   - Set a Route to the Locally Connected Network

    - Set a Route to a Different Network

    - Set a Default Route


    > Remember to substitute your own network and gateway addresses when using the
    following examples in a production environment.


    # Set a Route to the Locally Connected Network


    The following command sets a route to the locally connected network:


    ```

    ip route add 10.0.0.0/24 dev eth0

    ```


    This system is an example in the 10.0.0.0 network. The network mask is 24 bits
    long (255.255.255.0). All packets to the local network are sent directly through
    the device eth0.


    # Set a Route to a Different Network


    The following command sets a route to different network:


    ```

    ip route add 149.44.171.0/24 via 10.0.0.100

    ```


    All packets for the network 149.44.171.0 are sent through the gateway 10.0.0.100.


    # Set a Default Route


    The following command sets a default route:


    ```

    ip route add default via 10.0.0.1

    ```


    Packets that cannot be sent according to previous entries in the routing table
    are sent through the gateway 10.0.0.1.


    # Delete Routes from the Routing Table


    To delete an entry from the routing table, use a command similar to the following:


    ```

    ip route delete 149.44.171.0/24 dev eth0

    ```


    This command deletes the route to the network 149.44.171.0 assigned to the device
    eth0.'
  merge: -1
  pgno: 95
