  md: '# The Basics of ACLs


    Traditionally, three sets of permissions are defined for each file object on a
    Linux system. These sets include the read (r), write (w), and execute (x) permissions
    for each of three types of users: the file owner, the group, and others.


    This concept is adequate for most practical cases. In the past, however, for more
    complex scenarios or advanced applications, system administrators had to use a
    number of tricks to circumvent the limitations of the traditional permission concept.


    ACLs (Access Control Lists) provide an extension of the traditional file permission
    concept. They allow you to assign permissions to individual users or groups if
    they do not correspond to the original owner or the owning group.


    ACLs are a feature of the Linux kernel and are supported by the ReiserFS, Ext2,
    Ext3, JFS, and XFS file systems. Using ACLs, you can create complex scenarios
    without implementing complex permission models on the application level.


    The advantages of ACLs are clearly evident in situations like replacing a Windows
    server with a Linux server providing print services with Samba.


    Since Samba supports ACLs, user permissions can be configured both on the Linux
    server and in Windows with a graphical user interface (only on Windows NT and
    later).


    With winbind, it is even possible to assign permissions to users that only exist
    in the Windows domain without any account on the Linux server.


    # Important ACL Terms


    The following list defines terms concerning ACLs:


    +   **user class.** The conventional POSIX permission concept uses three classes
    of users for assigning permissions in the file system: the owner, the group, and
    other users.


    Three permission bits can be set for each user class, giving permission to read
    (r), write (w), and execute (x).


    +   **access ACL.** The user and group access permissions for all kinds of file
    system objects (files and directories) are determined by ACLs.


    +   **default ACL.** Default ACLs can only be applied to directories. They determine
    the permissions a file system object inherits from its parent directory when it
    is created.


    +   **ACL entry.** Each ACL consists of a set of ACL entries. An ACL entry contains
    a type, a qualifier for the user or group to which the entry refers, and a set
    of permissions. For some entry types, the qualifier for the group or users is
