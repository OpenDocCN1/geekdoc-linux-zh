    # KEY TERMS


    +   **etc/fstab** — The file used to mount file systems at system initialization.

    **etc/hotplug** — The directory that stores hotplug agents in SLES.

    **etc/hotplug/blacklist** — A file that lists device kernel modules that cannot
    be loaded by a hotplug agent.

    **etc/sysconfig/hardware** — A directory that stores information about hardware
    devices on the system. Files in this directory are used by the **hwcmd** command.

    **etc/sysconfig/network** — Stores information for network interfaces in SLES.
    Files in this directory are used by the **ifup** command.

    **/lib/modules/kernel-version** — The directory that stores kernel modules in
    SLES.

    **/proc/sys/kernel/hotplug** — The file that the Linux kernel uses to call /sbin/hotplug
    when a hotplug event occurs.

    **/sbin/hotplug** — The script called by the Linux kernel during a hotplug event.

    **/sys/block** — A directory that stores interface information by device.

    **/sys/bus** — A directory that stores hardware information by type.

    **/sys/class** — A directory that stores information information by type.

    **/sys/devices** — A directory that stores hardware information by device.

    **coldplug** — A script that detects and configures hotplug devices at system
    initialization.

    **device** — The common name for a system hardware component.

    **device agent** — A hotplug agent that loads the device driver for a hotplug
    device.

    **driver** — A software component that is used to control a hardware device.'
