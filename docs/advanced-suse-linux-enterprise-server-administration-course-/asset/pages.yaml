    # KEY TERMS


    +   /etc/fstab — The file contains partition mounting information and is used
    to mount file systems at system initialization.

    /etc/passwd — The file typically used to store user account information on Linux
    systems.

    /etc/shadow — The file typically used to store user account password information
    on Linux systems.


    Advanced Configuration and Power Interface (ACPI) — A standard that allows the
    operating system to control the power by system components.

    ddependencies — Software packages or components that must be installed prior to
    the installation of a certain software package.


    Enterprise Volume Management System (EVMS) — A hard disk partitioning scheme similar
    to LVM that may be used to create resizable partitions that may span multiple
    hard disks.

    extended partition — A primary partition that can contain logical partitions.

    h disk mirroring — A RAID implementation that writes all data to two separate
    hard disks for fault tolerance.


    Hardware RAID — A RAID implementation that is managed by the hard disk controller
    hardware.

    Lightweight Directory Access Protocol (LDAP) — A software protocol used to locate
    resources in a network directory database.


    logical partition — A partition that exists within an extended partition.

    logical volume — A partition defined by the LVM service that can contain a file
    system.'
