    # Creating a Binary Clock


    Modify your shell script in the previous exercise to display time every second
    in 24-hour format as well as in binary format. For the binary format, the bottom
    row represents 1 (2^0), the second row from the bottom represents 2 (2^1), the
    third row represents 4 (2^2), and the fourth row represents 8 (2^3).


    Thus the time 8:56pm (53 seconds) could be represented as:


