  md: '# Glossary


    # 397


    Access Control List (ACL) — A file attribute that allows additional user and group
    definitions to be added to the permission mode of the file.


    break command — Used to force a loop structure to exit and resume on the next
    line following the loop structure in a shell script.


    access matrices — A table that compares the types of workstations within an organization,
    the servers they require access to, and the technologies involved.


    broadcast — A message delivered to all computers on an IP network.


    cache — An area of memory that stores information obtained from DNS names. Entries
    are kept in the cache for the period specified by the TTL.


    address — See IP address.


    caching-only — A DNS server that is not authoritative for any zones. It only answers
    queries from other DNS servers.


    Address record (A) — A DNS record that identifies hosts within a domain.


    Canonical Name (CNAME) — An alias for an A record in DNS.


    Advanced Configuration and Power Interface (ACPI) — A standard that allows the
    operating system to control power by system commands.


    case — A decision structure that may be used to execute one of several sets of
    commands depending on the value of a variable.


    Apache — The default Web server software in SLES.


    cat command — Used to display the contents of files.


    argument — A parameter that may be used to pass a command string for when it is
    executed.


    certificate — A public key that has been digitally signed by a CA.


    ARPANET — The network that led to the development of the Internet. It stands for
    Advanced Research Projects Network.


    Certificate Authority (CA) — An organization that digitally signs public keys
    to verify the organization that produced them.


    authoritative answer — A name response from a DNS server where the DNS server
    contained the appropriate record in its database.


    chkconfig — Used to list and configure daemons to start in a certain runtime.


    backtick (^) — Used to execute an executable within another command string for
    substitution.


    coldplug — A script that detects and configures hotspot devices at system installation.


    backup window — The amount of time available to back up data. The backup window
    is normally performed during working hours.


    collision — An event that leads to the destruction of a packet of information
    on a network. Congested networks have a high number of collisions; results in
    a large number of retransmitted packets and poor performance.


    barrier — A device that restricts the flow of data, such as a firewall or file
    access restriction.


    collision domain — The area of a network where collisions are more likely to occur.
    A collision domain is typically a LAN that uses the same interconnect method.


    Berkeley Internet Name Domain (BIND) — The reference implementation for DNS.


    command substitution — The processing of executable commands within other executable
    commands.


    Blowfish — An encryption method used to encrypt Linux passwords.


    compiler — A program that translates instructions from a text file into a binary
    program.


    boot loader — The program used to load and start the operating system kernel at
    startup.


    bottleneck — A component that slows the transfer of data. CPUs, memory, hard disks,
    and network interfaces are common bottlenecks in computer systems.'
