    # How to Configure a Directory with an Access ACL


    To configure a directory with ACL access, do the following:


    +   1. Before you create the directory, use the umask command to define which
    access permissions should be masked each time a file object is created.

    The command umask 027 sets the default permissions by giving the owner the full
    range of permissions (0), denying the group write access (2), and giving users
    no permissions at all (7).

    umask actually masks the corresponding permission bits or turns them off.


    For more information about umask, see the corresponding man page umask.


    ![](img/501a26f547021936f65b9bd40bb47394_219_0.png)


    The command mkdir mydir should create the mydir directory with the default permissions
    as set by umask. Enter the following command to check if all permissions were
    assigned correctly:


    ls -dl mydir


    The output of the command looks like the following:

    drwxr-x---- ... tux project3 ... mydir


    +   2. Check the initial state of the ACL by entering the following command:

    getfacl mydir.

    The output of the command looks like the following:


    ```

    # file: mydir

    # owner: tux

    # group: project3

    user::rwx

    group::r-x

    other::--

    ```


    The output of getfacl precisely reflects the mapping of permission bits and ACL
    entries as described before. The first three output lines display the name, owner,
    and owning group of the directory.'
