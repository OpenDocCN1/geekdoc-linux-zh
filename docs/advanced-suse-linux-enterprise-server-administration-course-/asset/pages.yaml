    # KEY TERMS


    +   (root domain) — The root domain of DNS.

    /etc/apache2/default-server.conf — The default Apache configuration file in SLES.
    It is overwritten by all other configuration files.

    /etc/apache2/httpd.conf — The main Apache configuration file.

    /etc/apache2/vhosts.d — The directory that stores Apache virtual host configurations
    in SLES.

    /etc/host.conf — A file that lists the order for hostname resolution. It is only
    used by applications that use older GNU libraries.

    /named.conf — A file that lists the type of zones hosted on the DNS server and
    the location of the zone.

    /etc/sswitch.conf — A file that lists the order for hostname resolution.

    /etc/ldap.conf — The OpenLDAP client configuration file.

    /etc/ldap/schema — The directory that stores the OpenLDAP schema in SLES.

    /etc/slapd.conf — The OpenLDAP server configuration file.

    etc/resol.conf — A file on a resolver that lists up to three DNS servers that
    may be used to perform name resolution.

    /etc/samba/smb.conf — The main Samba configuration file.

    /srv/www/htdocs — The default DocumentRoot directory in Apache.

    /var/lib/named — The directory that stores zone files in SLES.

    /var/log/messages — The default log file for the DNS daemon.


    Address record (A) — A DNS record that identifies hosts within a domain.

    Apache — The default Web server software in SLES.


