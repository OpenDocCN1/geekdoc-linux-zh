    # Manage EVMS Volumes


    EVMS (Enterprise Volume Management System) volumes, select EVMS in the YaST Partitioner.


    EVMS is a similar approach to LVM. In the latest versions of EVMS and LVM both
    use the device mapper of the kernel to manage logical volumes. However, YaST''s
    configuration tools are not developed for EVMS as they are for LVM, EVMS is not
    covered in as much detail in this section.


    The EVMS setup is very similar to the LVM setup with the exception that logical
    volume groups are called containers in EVMS.


    After selecting EVMS in the YaST Partitioner, you create a container and add physical
    partitions to it. Then you can create logical volumes in the container, format
    them with a file system, and choose a mount point for them.


    You can also use striping to enhance the performance of your EVMS volumes.


    # Manage Soft RAID Setups


    To manage soft RAID (Redundant Array of Inexpensive Disks) setups, select RAID
    in the YaST Partitioner.


    The purpose of RAID is to combine several hard disk partitions into one large
    virtual disk for optimizing performance and improving data security.


    There are 2 types of RAID configurations:


    +   Hardware RAID. Hard disks are combined by the hard disk controller. The operating
    system sees the combined hard disks as hard disks as one device. No additional
    RAID configuration is necessary at the operating system level.


    +   Software RAID. Hard disks are combined by the operating system. The operating
    system sees every single disk and needs to be configured to use them as a RAID
    system.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Perform the SLES 9 Base Installation


    Hardware RAID provides better performance and data security than software RAID,
    but it is also much more expensive. Use software RAID to enhance disk performance
    and security if you cannot afford a hardware RAID solution.


    In this section, you learn how to set up software RAID.


    You combine hard disks according to RAID levels. UsingYaST you can set up RAID
    levels 0, 1, and 5 (RAID levels 2, 3, and 4 are not available with software RAID):


    +   - RAID 0. This level improves the performance of your data access. With RAID
    0, two hard disks are pooled together. Disk performance is very good, but the
    RAID system is vulnerable to a single point of failure. If one of the two disks
    fails, the system is destroyed and the data is lost.


    +   - RAID 1. This level provides enhanced security for your data because the
    data is copied to both hard disks. This is also known as hard disk mirroring.
    If one disk is destroyed, a copy of its contents is available on the other disk.


    +   - RAID 5. RAID 5 is an optimized compromise between RAID 0 and RAID 1 in terms
    of performance and redundancy. The data is distributed over the hard disks with
    RAID 0, while one partition serves as checksum of the written data.


    If one hard disk fails, it must be replaced as soon as possible to avoid the risk
    of losing data. If more than one hard disk fails at the same time, the data on
    the disks is lost.


    To create software RAID with YaST, do the following:


    +   - Partition your hard disks. For RAID 0 and RAID 1, at least two partitions
    on different disks are needed (RAID 1 requires two partitions; no more) RAID 5
    requires at least three partitions. We recommend that you use only partitions
    of the same size.


    +   - Set up RAID. Select RAID in the YaST Expert Partitioner to open a dialog
    box to choose between the RAID levels 0, 1, and 5, and add partitions to the new
    RAID.


    Choose a file system and a mount point for your RAID. By changing the chunk size,
    you can fine tune the RAID performance.


    Select Persistent Superblock to ensure that the partitions are recognized when
    booting.


    After finishing the configuration, the RAID partitions appear in the partition
    list of the Expert Partitioner.


    # Create Crypt File Partitions By selecting Crypt File, you can create an encrypted
    file system within a file. This file can be mounted and used as a normal partition.


    You can use a crypt file to securely store confidential data on your computer.


    We do not recommend that you create crypt files during the installation process,
    as the file systems to create the crypt file are not yet available.'
  merge: -1
