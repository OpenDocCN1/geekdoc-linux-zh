  md: '# Section 3 Configure Network Services


    +   .mil for military institutions (such as army.mil and navy.mil)

    .net for institutions that provide and manage network infrastructure (such as
    internic.net and att.net)

    .org for noncommercial institutions (such as eso.org and eff.org)


    arpa was used as a TLD, the ARPANet transferred from host files to DNS. All computers
    from the ARPANet were later put into the other TLDs. Tharpa TLD still has a special
    meaning which will be explained later in this section.


    These TLDs are also known as generic TLDs. Other TLDs for individual countries
    were defined, such as .de for Germany, .uk for the United Kingdom, and .ch for
    Switzerland.


    Recently, TLDs such as .info or .biz have become operational. Each of these TLDs
    is administered by its own institution (the Network Information Center or NIC).


    Part of the Internet namespace is shown in Figure 3-1.


    ![](img/501a26f547021936f65b9bd40bb47394_111_0.png)


    Figure 3-1


    The complete computer or fully qualified domain name (FQDN) is made from the actual
    computer name, the domain name, and the name of the TLD (one or more subdomains
    might be included).


    Examples of FQDNs are ns.nsude.de, www.astro.physik.uni-goetingenen.de, and mail.novell.com.
    To be precise, all names end with a dot (such as ns.nsude.de) indicating the root
    domain. But as a rule the dot normally is not used.


    # How Name Servers Work


    Domains are administered locally instead of using a global authority. Each domain
    has its own administration point (in practice, many domains are administered from
    one location).'
