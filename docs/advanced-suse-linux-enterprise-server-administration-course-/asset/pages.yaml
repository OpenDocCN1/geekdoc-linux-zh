    # # OBJECTIVE 3 OPTIMIZE THE STORAGE SYSTEM


    There are many different ways to optimize the performance of your storage systems,
    including the following:


    +   - Configure IDE Drives with hdparm

    - Tune Kernel Parameters

    - Tune File System Access

    - Change Hardware Components


    ![](img/501a26f547021936f65b9bd40bb47394_368_0.png)


    # ## Configure IDE Drives with hdparm


    You can use the hdparm to tune some settings of IDE hard drives. Entering the
    following command displays the current settings of a drive:


    ```

    hdparm -i /dev/hda

    ```


    In this example, the settings of the device hda are listed.

    The most important setting you can change with hdparm is DMA (direct memory access).
    With DMA, data from a disk can be written directly to the main memory of a system
    without CPU utilization. This enhances performance in two ways:


    +   - The transfer itself is much faster than with disabled DMA.

    - The CPU is not utilized and can be used for other tasks.


    By default, DMA should be enabled for IDE hard disks. However, if you experience
    a weak disk performance, you should check the settings. DMA can also be enabled
    for CD/DVD drives, which increases performance, especially for large data transfers.


    You can use the following command to check the current status of the DMA configuration:


    ```

    hdparm -d /dev/hda

    ```


    In this example, the DMA settings for the device hda are checked, with an output
    similar to the following:


    ```

    /dev/hda = 1 (on)

    ```


    In this example, DMA is enabled for the device hda; otherwise, the variable using_dma
    would have the value 0.'
  merge: -1
  pgno: 368
- img_proc: true
  md: 'You can enable DMA with a command such as the following:


    ```

    hdparm -d 1 /dev/hda

    ```


    In this example, DMA is enabled for the device hda.


    With hdparm, you can also use command options that affect a drive''s performance.

    Table 8-6 lists the most important options.


    # Table 8-6


    | Parameter | Description |

    |---|---|

    | -c1 | Enables 32-bit transfers of disk data over the PCI bus. |

    | -u1 | A setting of 1 permits the driver to unmask other interrupts processing
    of a disk interrupt, which greatly improves Linux''s responsiveness and eliminates
    serial port overrun errors. |

    | -X value | Configures the drive to use a specific transfer mode. |

    | -A1 | Enables read-ahead, which increases performance when dealing with large,
    sequential file operations. |


    ![](img/501a26f547021936f65b9bd40bb47394_369_0.png)


    Before you change any settings with hdparm, you should make sure that important
    files on your system are saved and backed up. Improper settings can lead to system
    crashes or data loss. For more information, see hdparm.


    hdparm also provides an option to measure the transfer performance of a hard disk,
    as in the following command for the device hda:


    ```

    hdparm -t /dev/hda

    ```


    The output for this command might look like the following:


    ```

    /dev/hda:

    Timing buffered disk reads: 156 MB/in 3.01 seconds = 51.75 MB/sec

    ```


    In this example, the disk offers a sequential transfer rate of 51.75 Mbps. To
    achieve valid results, you should repeat the test several times and compare the
    results. In general, the test should be run at a low system and storage load.


    All changes that are made with hdparm are active until the next reboot. To make
    sure hdparm commands are executed every time the system boots, you can add them
    to the file /etc/init.d/boot.local.


    # Tune Kernel Parameters


    The components of the Linux kernel that are responsible for hard disk access offer
    some parameters that can be changed at runtime.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# Optimize the Storage System 353


    None of these parameters are saved permanently. If you want to set them every
    time the system starts up, you can enter a command to set a parameter in the file
    /etc/init.d/boot.local.


    Tunable parameters let you do the following:


    +   - Tune the IO Scheduler

    - Change the Read Ahead Parameter

    - Change the Swappiness Parameter


    # Tune the IO Scheduler


    Because Linux is a multitasking operating system, more than one process at a time
    might need to access the hard disk.


    For this reason, the Linux kernel contains a component called the I/O Scheduler.
    This scheduler collects requests from the processes and hands them over to the
    hardware driver that is responsible for the drive.


    The SLES 9 I/O Scheduler has one parameter that you can use to tune the I/O performance.
    The parameter is stored in the file /sys/block/device/queue/iosched/quantum.


    The parameter determines how many I/O requests are stored in a queue before they
    are handed over to the driver. By queuing the requests, the scheduler can optimize
    the order of the requests.


    When you use this parameter, there is a tradeoff between data throughput and latency.
    Using the following rule:


    +   - Lower value = Shorter latency but lower data throughput

    - Higher value = Longer latency but higher data throughput


    The default value for SLES 9 is four requests.


    You can set the value of the parameter with a command similar to the following:

    echo 6 > /sys/block/hda/queue/iosched/quantum


    When you change the value, you should always benchmark your application to measure
    the success of the change.


    Changes to the I/O Scheduler parameters might not lead to performance enhancements
    on general purpose servers. However, on systems with a high disk utilization like
    database servers, it can be useful to experiment with these settings.


    # Change the Read-Ahead Parameter


    Another kernel parameter lets you determine how much data should be used for the
    read-ahead. Read-ahead basically means that more data from a file is read than
    requested by an application.'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'This is done because an application usually wants to read all data from a file,
    not just the data at the beginning. You can set the read-ahead parameter in the
    file /sys/block/device/queue/read_ahead_kb.


    The value determines how much data (in KB) is read ahead from file. The default
    value on SLES 9 is 128 KB. Larger values can lead to a better overall throughput
    with the drawback of a higher latency.


    You can set the parameter with the following command:


    ```

    echo 256 > /sys/block/device/queue/read_ahead_kb

    ```


    # Change the Swappiness Parameter


    The swappiness parameter affects both the memory and the I/O performance. It basically
    determines when a system starts to swap out data to the disk, and can be set in
    the file /proc/sys/vm/swappiness.


    You can set the parameter value from 0 and 100. The higher value, the more the
    system will swap. The default value for SLES 9 is 60.


    You can set the parameter with a command like following:


    ```

    echo 40 > /proc/sys/vm/swappiness

    ```


    The parameter determines how much you value the page cache over program memory.


    # Tune File System Access


    To achieve a performance advantage for an application, you can control the way
    the kernel accesses the file system by doing the following:


    +   - Disable atime Update

    - Implement File System Dependent Tuning Options


    # Disable atime Update


    For every file Linux stores the following information:


    +   - When the file was created.(ctime)

    - When the file was modified the last time (mtime)

    - When the file was accessed the last time (atime)


    To keep the atime information up to date, the kernel needs to update the atime
    attribute every time a file is accessed. Updating the atime means that the kernel
    needs to perform a write process, which causes additional load for the hard disk.


    If the atime attribute is not important to you, you can mount a data partition
    with the noatime option.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Optimize the Storage System 355


    The following shows an fstab entry for the partition /dev/hda2 that uses the noatime
    option: /dev/hda2 /data reiserfs noatime 0 0


    # Implement File System Dependent Tuning Options


    Besides the general disk tuning options, you can also configure the file system
    to:


    +   - Mount a Reiser File System with the notail Option

    - Configure the Journaling Mode of Ext3


    ![](img/501a26f547021936f65b9bd40bb47394_372_0.png)


    On traditional UNIX systems, small files or the rest of a big file (the tail)
    are used as a full block of the file system although they don''t really fill the
    block.


    Reiserfs can store this data much more efficiently in the file system internal
    structure. However, this costs some performance. You can use the mount option
    notail to disable this feature.


    You can use the notail option either with the -o option of mount or in the /etc/fstab
    file as in the following: /dev/hda2 /data reiserfs notail 0 0


    # Configure the Journaling Mode of Ext3


    The ext3 file system offers journaling functionality. In journaling, every file
    system transaction is logged in a special area of a partition, called the journal.
    The data in the journal helps to restore a consistent file system in case of a
    system crash or a power failure.


    The ext3 file system offers three journaling modes that also affect the disk performance:


    +   - data=journal. If you use this mode, the data of a transaction and the file
    metadata are logged in the journal. This is the most secure option for data security.

    - data=ordered. When an ext3 file system is mounted with this option, only the
    file metadata is stored in the journal. However, it forces the file data to be
    written to disk before the metadata, and is the default for SLES 9.

    - data=writeback. This is the fastest journaling option. Metadata is logged to
    the journal, but file data is not treated in a special way. However, you still
    have the advantages of a journaling file system when a crash or a power failure
    occurs.


    This option is a good compromise between speed and reliability.


    You can use these options with the -o option of the mount command, or add them
    to the /etc/fstab, as in the following: /dev/hda2 /data ext3 data=writeback 0
    0'
  merge: -1
  pgno: 372
