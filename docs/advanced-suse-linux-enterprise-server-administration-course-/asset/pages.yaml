  md: '# Partition the Hard Disk


    In most cases, YaST proposes a reasonable partitioning scheme that you can accept
    without change. However, you might need to change the partitioning manually if:


    +   - You want to optimize the partitioning scheme for a special purpose (such
    as a file server).

    - You have more than one hard drive and want to configure RAID or LVM devices.

    - You want to delete existing operating systems so you have more space available
    for your SLES 9 installation.


    To partition the hard drive manually, you need to know the following:


    +   - The Basics of Hard Drive Partitioning

    - The Basic Linux Partition Scheme

    - Partitioning Schemes for Different Server Types

    - How to Change YaST''s Partitioning Proposal

    - How to Use the YaST Expert Partitioner


    # The Basics of Hard Drive Partitioning


    Partitions divide the available space of a hard drive into smaller portions. This
    lets you install more than one operating system on a hard drive or to use different
    areas for programs and data.


    Every hard disk has a partition table with four entries. An entry in the partition
    table can correspond to a primary partition or an extended partition. Only one
    extended partition is allowed.


    A primary partition consists of a continuous range of cylinders (physical disk
    areas) assigned to a particular operating system. If you use only primary partitions,
    you are limited to four partitions per hard disk (because the partition table
    can only hold four partitions).


    This is why extensions are used. Extended partitions are also continuous ranges
    of disk cylinders, but can be subdivided into logical partitions. Logical partitions
    do not require entries in the main partition table. In other words, an extended
    partition is a container for logical partitions.


    If you need more than four partitions, create an extended partition before you
    create the fourth partition. This extended partition should include the entire
    remaining free cylinder range. Then create multiple logical partitions within
    the extended partition. The maximum number of logical partitions is fifteen on
    SCSI disks and 63 on (E)IDE disks.


    It does not matter which type of partitions you use on Linux systems; primary
    and logical partitions both work well.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# The Basic Linux Partition Scheme


    The optimal partition scheme for a server depends on the purpose of the server.


    A SLES 9 installation needs at least two partitions:


    +   - Swap partition. This partition is used by Linux to move unused data from
    the main memory to the hard drive. Moving unused data from the main memory to
    the hard drive helps the performance of the system.


    +   - Root partition. This is the partition for the operating system itself, and
    is mounted under / in the installed system.


    No matter what partition scheme you choose, you always need a swap partition and
    a root partition.


    The following guidelines help you determine the size of your root partition:


    +   - 500 MB. This allows for a minimal installation with no graphical interface.
    With this configuration, you can only use console applications.


    +   - 700 MB. This allows for an installation with a minimum graphical interface.
    This includes the X window system and a few graphical applications.


    +   - 1.5 GB. This is the default installation recommended by YaST. This configuration
    includes a modern desktop environment (such as KDE or GNOME), and provides enough
    space for large applications (such as Netscape or Mozilla).


    +   - 2.5 GB. This allows for a full installation, including all software packages
    shipped with SLES 9.


    If your server hosts data (such as a web server or a file server) you will probably
    need more space on the root partition.


    # Partitioning Schemes for Different Server Types


    It often makes sense to create more than the default Linux partitions. The following
    list provides examples of partitions for different server types:


    +   - File server. Hard disk performance is crucial for a file server. Create
    an extra partition with enough space for the data that is hosted by the server.


    +   - Web server. You should create an extra partition for the web space hosted
    by the server. Make the partition large enough to hold the expected amount of
    hosted data.


    +   - Compute server. A compute server carries out extensive calculations in the
    network. Fast disk throughput is only needed for the swap partitions. If possible,
    use more than one swap partition and distribute swap partitions to multiple hard
    disks.


    +   - Desktop workstation. Create a separate partition for users'' home directories.
    This lets you reinstall the operating system without losing user data.'
  merge: -1
