    #  OBJECT 3 LIMIT THE INSTALLED SOFTWARE PACKAGES


    Every software package that is installed on a system, but is not needed by that
    system, should

    be removed from a production server.


    The more software is installed, the more possible security problems can occur.
    For example,

    it does not make sense to install an X Server and graphical applications on a
    system that is

    exclusively used as Web server.


    To set up a production system, you can use the minimal system as a base for the
    software

    selection during the installation. Then you can manually add those software packages

    that are needed.


    This rule is especially true for network daemons. A server should never offer
    any network

    services that are not needed. For example, if a server is used as a dedicated
    file server, it is

    nnecessary to run a postfix mail server on the same system.


    You can use the following command to check which services are configured to start
    and

    the run levels:


    ```

    ```chkconfig -l```

    ```


    The command displays a line for every service installed on the system. The following
    line

    shows the configuration of the Samba server:


    ```

    ```smb 0:off 1:off 2:off 3:on 4:off 5:on 6:off```

    ```


    After the service name, the configuration for all six default run levels is displayed.
    On means

    t service is configured to be started in the corresponding run level; off means
    the service

    will not be started.


    You can use the following command to remove a service from its default run levels:


    ```

    ```inserv -r service_name```

    ```


    > Removing a service from the run level configuration does not stop an already

    running daemon. A daemon that is already running needs to be stopped

    manually or the system needs to be rebooted to start with the new run-level.


