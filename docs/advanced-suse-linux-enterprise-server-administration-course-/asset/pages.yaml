  md: '# Configure a DNS Server Using BIND


    # Understand the Domain Name System


    To understand the basics of name resolution with DNS, you need to know:


    +   - How Name Resolution Worked in the Early Days of the Internet

    - The Internet Domain Concept

    - How Name Servers Work

    - How to Query DNS


    # How Name Resolution Worked in the Early Days of the Internet


    Computers communicate with each other using IP addresses, but for humans it is
    simpler to address a computer by using its name. This requires some kind of conversion
    that provides computers with IP addresses when a user enters a computer name.


    In the early days of the Internet, when there were relatively few computers connected
    to each other, a file was maintained at the Network Information Centre (NIC) of
    the Stanford Research Institute in California that provided exactly this conversion.


    Whenever system administrators added a new computer to the Internet or changed
    the name of an already connected computer, these changes were sent by e-mail to
    the SRI-NIC where they were written to a file called hosts.txt.


    Every system administrator had to copy this file by FTP and distribute it to all
    computers for whom he was responsible.


    In 1984, Paul Mockapetris created a powerful solution: the Domain Name System
    (DNS). DNS is a distributed database system that allows local administration of
    areas and guarantees unique computer names worldwide. Its hierarchical structure
    is very similar to the tree structure of the Linux file system.


    # The Internet Domain Concept


    DNS consists of several domains that can be divided into subdomains. The top level
    of this structure is the root domain. It is represented simply by a dot (".")."


    There are over 13 computers worldwide that act as root name servers. The first
    layer beneath the root domain contains the top level domains (TLDs).


    In the early days of DNS there were seven TLDs:


    +   - .com for commercial institutions (such as nov.com and suse.com)

    - .edu for educational institutions and research institutes (such as harvard.edu
    and stsci.edu)

    - .gov for institutions of the U.S. government (such as nasa.gov and whitehouse.gov)

    - .int for international institutions (such as un.int and ecb.int)'
  merge: -1
