    # Use the date command


    You can use the date command whenever there is a need to obtain a date or time
    string for further processing by a script. Without any options specified, the
    command''s output looks like the following:


    ```

    date

    Fri Sep 03 14:18:12 CEST 2007

    ```


    The date command lets you change the output format in almost every detail. With
    the -I option (as in the following), date prints the date and time in ISO format
    (which is the same as if the options had been +Y-%m-%d):


    ```

    date -I

    2007-09-03

    ```


    ```

    date +%m-%d %H:%M

    09-03/07, 14:19

    ```


    ```

    date %+D, %r

    09-03/07, 02:19:58 PM

    ```


    ```

    date %+d.%m.%y

    03.09.07

    ```


    ```

    date %+d.%m.%Y

    03.09.2007

    ```


    ```

    date %+e.-m.%y, %1.M %p

    3.9.07, 2.20 PM

    ```


    ```

    date %+A, %+e. %+B %Y

    Friday, 3. September 2007

    ```


    To view a list with all the possible format options for date, see man date. In
    any case, you should be able to customize the output to exactly match the requirements
    of your script.


    # Use the echo command


    The echo command, which exists both as a shell built-in command and as an external
    command, prints text lines on standard output. A line break is inserted automatically
    after each line. When called with the -e option, echo accepts a number of additional
    options.'
