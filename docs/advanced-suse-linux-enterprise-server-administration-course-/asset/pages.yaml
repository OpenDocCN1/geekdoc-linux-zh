    +   - session required pam_unix2.so none


    Here the session component of the pam_unix2.somodule is used. It uses the syslog
    daemon to log the user''s login.


    +   - session required pam_limits.so


    The pam_limits.so resource limits for the users that can be configured in the
    file /etc/security/limits.conf.


    ![](img/501a26f547021936f65b9bd40bb47394_210_0.png)


    > NOTE

    For an overview of the default PAM modules and their configuration options consult
    the PAM documentation under /usr/share/doc/packages/pam.

    Third-party vendors can supply other PAM modules to enable specific authentication
    for their products, such as the PAM modules that enable Novell''s Linux User Management
    (LUM) authentication with eDirectory.


    # The Requirements for a Secure Password


    Even the best security setup for a system can be defeated if users choose to guess
    passwords. With today''s computing power, a simple computer can be used to crack
    an easy password within seconds.


    These attacks are also called dictionary attacks, as the password cracking program
    just tries one word after another from a dictionary file.


    Therefore, a password should never be a word which could be found in a dictionary.
    A good, secure password should always contain some numbers and uppercase characters.


    To check whether user passwords fulfill this requirement, you can enable a special
    PAM module to test a password first before a user set it. The PAM module is called
    pam_pwcheck.so and uses the clicklib library to test the security of passwords.


    By default, this PAM module is enabled on SLES 9.


    If a user enters a password that is not secure enough, the following message is
    displayed:


    ```

    Bad password: too simple

    ```


    and the user is prompted enter a different one.'
