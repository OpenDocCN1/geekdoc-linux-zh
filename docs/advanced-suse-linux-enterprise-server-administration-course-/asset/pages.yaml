  md: "# Configure a DNS Server Using BIND\n\nYou can define these DNS servers in\
    \ the options block in the file /etc/named.conf, as in the following:\n\n```\n\
    options {\n  directory \"/var/lib/named\";\n  forwarders {\n    10.0.0.254;\n\
    \  }\n}\n```\n\nYou can enter up to three DNS server addresses. Queries that cannot\
    \ be resolved by the local DNS server are forwarded to one of the specified DNS\
    \ servers.\n\nIf these DNS servers cannot be reached, the queries are not sent\
    \ directly to the root DNS servers.\n\n# Configure a Master Server for Your Domain\n\
    \nThe following are the tasks you need to do to configure a master DNS server\
    \ for your domain:\n\n+   - Adapt the Main Server Configuration File\n- Create\
    \ the Zone Files\n- Create Additional Resource Records\n\n# Adapt the Main Server\
    \ Configuration File\n\nYou can adapt the configuration for the caching-only DNS\
    \ server for configuring a DNS server containing its own information files.\n\n\
    This configuration already contains the global entries for the directory and the\
    \ forwarders (which can be omitted) entries in the options block. The file also\
    \ contains the mandatory entries for the root servers and the resolution of localhost.\n\
    \nThe global options are followed by definitions for the database files (or zone\
    \ files) for the domains this DNS server serves. At least two files are necessary\
    \ for each domain:\n\n+   - A file for forward resolution (allocating an IP address\
    \ to a computer name)\n- A file for reverse resolution (allocating a computer\
    \ name to an IP address)\n\nIf several subnets belong to a domain, then one file\
    \ for each of these networks must be created for reverse resolution.\n\nEach definition\
    \ begins with the instruction zone (this is why the database files are also known\
    \ as zone files), followed by the name of this zone."
