    # How to Configure OpenSSL for Connection Encryption


    By default, the connection between the Web browser and the Web server are not
    encrypted. Anyone who can listen to the network packets exchanged between browser
    and server can access the transferred information.


    Apache can use the SSL (Secure Socket Layer) protocol to encrypt the connection.
    To configure an SSL encryption with an Apache Web server, you need to know the
    following:


    +   * The Basics of SSL Encryption

    * How to Create a Test Certificate

    * How to Configure Apache to Use SSL

    * The Limitations of the SSL Configuration


    # The Basics of SSL Encryption


    Most of the data is transmitted across a network in encrypted form by using RSA
    keys. This method is used by the encryption software PGP (Pretty Privacy) to encrypt
    e-mails, by ssh (Secure Shell) for encrypted data transfers between two computers,
    and by Apache for secure data transmission between the Web server and the Web
    browser.


    This encryption is based on two different keys: a private key and a public key.
    While the private key is known only to the owner, the public key should be accessible
    to the public.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Section 3 Configure Network Services


    Figure 3-10 shows the encryption process.


    ![](img/501a26f547021936f65b9bd40bb47394_161_0.png)


    Figure 3-10


    Public and private keys can also be used to sign data. In principle, when data
    is signed, an encrypted checksum is generated from the data. The sender signs
    the data with his private key.


    The signature can be checked by the recipient by using the public key of the sender
    to determine whether the data is really from him her or whether the text has been
    modified by a third party.


    Figure 3-11 illustrates the signing process.


    ![](img/501a26f547021936f65b9bd40bb47394_161_1.png)


    Figure 3-11'
