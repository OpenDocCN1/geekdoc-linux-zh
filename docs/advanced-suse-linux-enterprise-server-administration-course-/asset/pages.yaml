  md: "# Configure an Apache Web Server\n\nA problem with the encryption procedure\
    \ described above is that you cannot determine who the owner of a public key.\
    \ The solution to this problem is a Certificate Authority (CA) which signs the\
    \ public keys with its own private keys.\n\nA public key that is signed by a CA\
    \ is also called a Certificate.\n\nCAs are well-known companies or organizations\
    \ like VerSign or VISA. The public keys of these organizations are built into\
    \ the Web browsers. By verifying the signature with the public key of the CA,\
    \ the browser can make sure that a public key of a Web server is valid.\n\nThe\
    \ following explains the process of using a CA with SSL encryption for a Web server:\n\
    \n+   1. The browser recognizes a Web address starting with https://.\n\n means\
    \ that the connection to this server should be encrypted. The default port for\
    \ SSL connections is 443 instead of port 80 (used for non unencrypted HTTP connections).\n\
    2. The Web browser asks the server for its public RSA key.\n3. The Web server\
    \ sends the public key to the Web browser.\n4. The Web browser verifies the key\
    \ of the server with the public key of the CA that signed the key.\n5. If the\
    \ key is valid, the Web browser and Web server establish a secure connection.\n\
    \nYou need an officially signed key to set up a secure Web server. You can sign\
    \ a key by yourself, but this should only be for test purposes.\n\n# How to Create\
    \ a Test Certificate\n\nTo set up a secure Web server for test purposes, you can\
    \ create a certificate by yourself. You should never use such certificate for\
    \ a production system.\n\nTo create a test certificate, you do the following:\n\
    \n+   - Create an RSA Key Pair\n- Sign the Public Key to Create a Certificate\n\
    \n**Create an RSA Key Pair** To create a key pair, you need a file with as many\
    \ random numbers as possible. You can generate this file by entering the following\
    \ command:\n\n```\ncat /dev/random > /tmp/random\n```\n\nStop this procedure after\
    \ a few seconds by pressing Ctrl+C. The file generated should be at least a thousand\
    \ bytes in size. You can now generate the key pair by entering the following command:\n\
    \n```\nopensslgenrsa -des3 -out server.key -rand /tmp/random 1024\n```"
  merge: -1
