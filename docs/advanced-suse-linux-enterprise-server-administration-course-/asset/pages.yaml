  md: '# Section 9 Manage Hardware and Component Changes


    +   - For hotplug, the Linux kernel typically detects the detection of the device
    and runs a hotplug script (/sbin/hotplug) to load a hotplug driver agent that
    configures the appropriate device driver and hotplug interface agent that configures
    an interface for the device. Hotplug agents are stored in the /etc/hotplug directory.


    +   - The hwup command is used by hotplug agents to locate the appropriate device
