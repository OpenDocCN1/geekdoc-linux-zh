- img_proc: true
  md: '# How to Add Entries to the LDAP Server


    OpenLDAP provides the command ldapadd to insert data that is in LDIF format into
    the directory. You can use files in the LDIF format to avoid specifying all values
    on the command line.


    LDAP files contain the information that should be included into the directory
    service in a plain text format.


    You can create a different file for each user you would like to add, but you can
    also have multiple user records in one file. An LDIF file contains the following
    entries:


    +   * dn. The distinguished name of the object you want to add.

    * objectclass. The object of the new entry.

    * attribute. An attribute of the entry. You normally add more than one attribute
    at the same time.


    If you installed an LDAP server during installation, the basic tree structure
    for user authentication has already been created. If you set up the server later,
    you need to create the structure manually with an LDIF file like the following:


    ```

    dn: dc=example,dc=com

    dc: example

    o: example

    objectClass: organization

    objectClass: dcObject

    dn: ou=people,dc=example,dc=com

    objectClass: top

    objectClass: organizationalUnit

    ou: people

    ```


    The file creates two entries in the directory tree:


    +   * The base entry with the DN dc=example,dc=com.

    * An entry below the base entry for the ou people. The dn for this entry is ou=people,dc=example,dc=com.


    Every entry in an LDIF file does the following:


    +   * Sets the distinguished name of the entry.

    * Lists the object classes used for the entry.

    * Sets the attributes and their corresponding values.'
  merge: -1
