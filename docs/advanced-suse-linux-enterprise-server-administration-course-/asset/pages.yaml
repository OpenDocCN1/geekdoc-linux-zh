  md: '# Section 4 Secure a SLES 9 Server


    It is often useful to use two columns for individual protocols, matching the two
    transport directions (IN or OUT).


    Besides application level gateways, routers with activated packet filtering also
    count as firewalls.


    # Analyze the Current Situation and Necessary Enhancements


    A company-wide security policy should guarantee the confidentiality, data integrity,
    availability, and transparency of a company''s business processes and prevent
    damage.


    The security policy determines what security demands are required for specific
    data and resources. The security policy should include the analysis of the remaining
    risk. Risks that cannot be removed or can only partially be removed by taking
    appropriate protective measures should be highlighted.


    The security policy also describes the current actual state of security. For this,
    information is needed on who is required to do what to achieve the desired security
    level.


    Table 4-2 shows what topics need to be covered in the security policy. The table
    also includes the physical access to the IT infrastructure.


    # Table 4-2


    | Security of network components | How the components and their physical storage
    areas are secured against unauthorized access |

    |---|---|n| Actual state | The network cabinets are freely accessible so that
    each member of staff can patch his own network connections. |

    | Target state | Technical rooms are locked, so only system administrators have
    access. |

    | Task | The locks must be checked and keys assigned to system administrators.
    |

    | Date | 2007-02-02 |

    | Responsible Person | Jenny Doe, head of System Administration department. |

    | Estimated expense | Approximately five days and $1200. |\n| Done/checked | 2007-03-01
    Henry Boardman, Assistant to the Board. |


    The reasons given in the description of the actual state show that:


    +   - Members of the staff need to be told why they can no longer patch their
    network connections themselves.


    +   - Administrators must be made available to patch the network connections in
    the future.'
