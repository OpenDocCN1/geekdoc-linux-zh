  md: '# Understand the GNU Build Tool Chain


    In objective, you learn how to do the following to perform a standard build process:


    +   - Use configure to Prepare the Build Process

    - Use make to Compile the Source Code

    - Use make to install the Compiled Program

    - Install the Required Packages for a Build Environment


    # Use configure to Prepare the Build Process


    The actual compilation process can be started, you must prepare the source code
    with a configure script. This needs to be done for the following reasons:


    +   - Many applications can be compiled on different UNIX systems, Linux distributions,
    and hardware platforms. To make this possible, the build process needs to be prepared
    for the actual environment.

    - The build process itself is controlled by a program called make. The instructions
    for how to compile the different source files are read from Makefiles. The configure
    script generates these Makefiles depending on the system environment.

    - You can use configure to enable or disable certain features of an application.


    To run the configure script, you need to use the following command at the top
    of the source directory:


    ```

    /configure

    ```


    To enable or disable certain features of an application, configure takes additional
    arguments. The available arguments depend on the application that will be compiled.


    You can use the following command to list all available configure options:


    ```

    /configure --help

    ```


    # Use make to Compile the Source Code


    You use the tool to compile multiple source files in the correct order. Make is
    controlled by Makefiles. Normally, these Makefiles are generated by the configure
    script, but you can also create them manually.


    You can also use make to install and uninstall the program to or from the right
    location on the hard disk.


    The following is a simple Makefile that shows how Make works:


    ```

    # Makefile for my_name

    \all: my_name


    _name: my_name.c

    ```'
