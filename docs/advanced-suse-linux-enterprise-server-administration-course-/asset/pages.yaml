    # Chapter Summary


    +   - DNS comprises a hierarchical namespace that consists of a root domain ()
    followed by top level domains, domains, and subdomains. Each host that uses DNS
    has an FDN that identifies hostname and domain name.


    +   - FDNs and their associated IP addresses are stored on authoritative DNS servers
    in a zone file. Master DNS servers hold a read-write copy of the zone file and
    transfer this to Slave DNS servers read as-only. Caching-only DNS servers simply
    forward requests to a Master or Slave DNS server and cache the results for future
    reference.


    +   - Clients can query a DNS server listed in /etc/resol.conf to resolve an FDN
    to an IP address (forward lookup), or resolve an IP address to an FDN (reverse
    lookup). Name resolution results are stored in a cache on the client computer
    for a certain period of time determined by the TTL.


    +   - To become a DNS server you install the BIND server software, edit the /etc/named.conf
    configuration file, create zone files in the /var/lib/named directory, and create
    resource records. This can be done manually or using YaST.


    +   - The host and dig commands may be used to test DNS name resolution.


    +   - LDAP directory service allows network users to query information for a wide
    range of uses including user authentication and information storage. LDAP is supported
    by all operating systems. SLES uses OpenLDAP to provide LDAP services.


    +   - LDAP resources are organized into a hierarchical tree structure. Each resource
    (leaf object) is stored in a series of container objects and can be accessed using
    a DN or RDN.


    +   - You can edit the /etc/openldap/slapd.conf file or use YaST to configure
    LDAP settings. Similarly, you can edit the /etc/openldap/ldap.conf file or use
    YaST to configure client settings.


    +   - The GQ LDAP browser allows you to query an LDAP database within a desktop
    environment.


    +   - Apache Web server is the most common Web server on Linux systems. By default,
    Apache uses the configuration file /etc/apache2/httpd.conf and handles HTTP Web
    content in the /srv/www/htdocs directory to client Web browsers.


    +   - Apache may be used to host several Web Sites on a single computer (virtual
    hosts), and can restrict access to Web content based on IP address or user authentication.'
