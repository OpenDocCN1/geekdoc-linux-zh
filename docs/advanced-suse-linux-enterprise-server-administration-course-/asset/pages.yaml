    If you are not sure which file system to choose, select Reiser for root and data
    volumes and Swap for swap volumes.


    +   - Options. Select this button to change parameters for the selected file system.
    You can use the default parameters in most cases.


    +   - Encrypt file system. Select this box to encrypt the file system of the volume.
    You should only use this option for non-system volumes like user home directories.


    +   - Logical volume name. Enter the name of the logical volume.


    +   - Size. Enter the size of the logical volume in this field. Use M for MB and
    G for GB. For example, enter 5G for a volume size of 5 GB.


    +   - Max. Set the size of the maximum available space of the volume group.


    +   - Stripes. If you choose a value larger than one from this drop-down list,
    the file written to the volume will be spread in small pieces (stripes) over all
    physical devices in the volume group.


    This enhances disk performance by using all available disks at the same time.


    The number of stripes you must select must not exceed the number of physical disks
    in the system.


    If you need more performance than a single disk can deliver, this might be a good
    option for you. However, a real hardware RAID system is normally a better choice.


    +   - Stripe Size. Select the size of a single stripe.


