  md: '# Glossary 401


    logical partition — A partition that exists within an extended partition.


    mt (magnetic tape) command — Used to manage tape devices.


    logical volume — A partition defined by the LVM service that can contain a file
    system.


    name resolution — The process whereby a FDN is associated with its IP address.


    logical volume group — A group of physical partitions that is defined by the logical
    volume manager. These groups can span hard disks.


    name server — A server that contains records for hosts on a network. It may be
    queried to resolve a hostname to an IP address. See DNS Server.


    Logical Volume Manager (LVM) — A hard partitioning scheme in which partitions
    are managed by system services and can be resized easily.


    Name Server (NS) — A DNS record that identifies a DNS server that is authoritative
    for the zone.


    loopback — An IP address that is used to test the local host.


    named — The DNS/BIND daemon in Linux.


    lsmod command — Used to list currently loaded modules.


    NetBIOS — A Windows protocol that uses 15-character names to identify network
    hosts.


    lspci command — Lists about PCI devices


    Network Information Service (NIS) — A network service that may be used to manage
    the configuration of several Linux or UNIX computers.


    Mail exchanger (MX) — A DNS record that identifies the e-mail servers for a domain.


    network mask — A number used to determine which portion of an IP address is used
    to identify the network.


    make command — The GNU make program is used to compile a program using the GNU
    Compiler and compiler options in a Makefile. It can also be used to copy a compiled
    program to the correct directory on the file system.


    nmbd — The NetBIOS daemon in the Samba package.


    Makefile — The file that stores compilation options for a specific program. It
    is typically created by the configure script.


    nmblookup command — Displays NetBIOS computer for hosts.


    Master Boot Record (MBR) — The first area on a hard disk that stores the partition
    table and Stage 1 of the GRUB boot.


    nonauthorative answer — A response from a DNS server where has to query other
    DNS servers in order to find the appropriate record.


    master server — A DNS server that contains a read-write copy of the zone database.


    notify — The process whereby a master server informs its DNS servers of a change
    to a zone file.


    memory leak — A condition which continually allocates memory without releasing
    it that has been allocated, leading to poor system performance.


    object — A component of an LDAP database. The two object types are objects and
    leaves


    Message Digest 5 (MD5) — An encryption method used to encrypt Linux passwords.


    object class — A type of object within an LDAP database.


    OpenLDAP — An LDAP service that is used in SLES.


    modprobe command — Loads modules into the Linux kernel.


    OpenSSL — The default software used to provide SSL in SLES.


    openssl command — Used to manage public/private pairs in OpenSSL.


    mpstat command — Displays CPU statistics for single or multi-processor systems.'
