  md: '# INTRODUCTION


    Although almost every step of a network configuration is done for you when you
    use YaST, it''s sometimes useful to configure the network settings manually. For
    testing and troubleshooting, it can be much faster to change the network setup
    from the command line.


    # OBJECTIVE 1 UNDERSTAND LINUX NETWORK TERMS


    Before you can configure the network manually with ip, you need to understand
    the following Linux networking terms:


    +   **Device.** The network adapter built into the system. To use a physical device,
    a software component creates an interface to the device. This interface can be
    used by other software applications.

    The software component which creates the interface is also called a *driver*.

    In Linux, network interfaces use a standard naming scheme. Interfaces to Ethernet
    adapters follow the naming scheme eth0, eth1, eth2, and so on. For every adapter
    installed in the system, an interface is created when the appropriate driver is
    loaded.

    The command-line tools for the network configuration use the term *device* when
    they actually mean an interface. The term device is used in this section for both
    physical devices and software interfaces.

    **Link.** The command-line tool ip uses the term *link* to refer to the connection
    of a device to the network.

    **Address.** The IP address assigned to a device. The address can be either IPv4
    or an IPv6 address. To use a device in a network, you have to assign at least
    one address to it. However, you can assign more than one address to a device.

    **Broadcast.** The term *broadcast* refers to the broadcast address of a network.
    By sending a network packet to the broadcast address, you can reach all hosts
    in the locally connected network at the same time. When you assign an IP address
    to a device, you can also set this broadcast address.

    **Route.** The path an IP packet takes from the source to the destination host.
    The term *route* also refers to an entry in the routing table of the Linux kernel.


    # OBJECTIVE 2 SET UP NETWORK DEVICES WITH THE IP TOOL


    You normally configure a network card with YaST during or after installation.
    You can use the tool ip to change the network card configuration quickly from
    the command line.'
  merge: -1
