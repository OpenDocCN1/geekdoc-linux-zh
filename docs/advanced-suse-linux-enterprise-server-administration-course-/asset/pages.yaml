  md: "# Locate the Apache Configuration Files\n\nThe configuration of the Apache\
    \ Web server is spread over several configuration files in the directory /etc/apache2.\n\
    \nThe following is a list of the most important Apache configuration files:\n\n\
    +   - httpd.conf. This is the main Apache configuration file. All other configuration\
    \ files are included with this.\n- default-server.conf. This file contains the\
    \ basic Web server setup. However, all options in this file can be overwritten\
    \ by other configuration files.\n- vhost.d/. This is a directory containing configuration\
    \ files for virtual hosts setup. You will learn more about virtual hosts in this\
    \ section.\n- uid.conf. This configuration file sets the user and group id for\
    \ Apache. By default, Apache uses the user wwwrun and the group id.\n- listen.conf.\
    \ In this configuration file, you can specify the IP addresses and TCP/IP ports\
    \ Apache is listening to. By default, Apache listens to all assigned interfaces\
    \ on port 80.\n- server-tuning.conf. You can use this configuration file to tune\
    \ the performance of Apache. The default values should be fine unless you are\
    \ going to run a Web server that has to handle a load of requests at the same\
    \ time.\n- error.conf. In this file you configure the behavior of Apache when\
    \ a request cannot be performed correctly.\n- ssl-global.conf. Configure the connection\
    \ encryption with SSL in this configuration file.\n\n# Understand the Basic Rules\
    \ of the Configuration Files\n\nThe options of the Apache configuration files\
    \ are called directives. Directives are case sensitive, which means that a word\
    \ such as \"include\" is not the same as \"Include.\"\n\nDirectives can be grouped\
    \ so that they do not apply to the global server configuration. In the following,\
    \ directives only apply to the directory /srv/www/htdocs:\n\n```\n<Directory \"\
    /srv/www/htdocs\">\n    Options None\n    AllowOverride None\n    Order allow,\
    \ deny\n    Allow from all\n</Directory>\n```\n\nThe directives are grouped by\
    \ <Directory \"/srv/www/htdocs\"> and </Directory>, which limits their validity\
    \ to the directory /srv/www/htdocs only."
  merge: -1
  pgno: 153
