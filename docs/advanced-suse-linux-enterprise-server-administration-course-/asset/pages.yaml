  md: '# Section 3 Configure Network Services


    +   - force group


    This line forces the Samba server to perform all file operations with the group
    accounting.


    # Configure the Export of Home Directories


    The following example exports the home directory of all UNIX users of the Samba
    server. You need to add the users to the smpasswd file before the setup works:


    [homes]


    ```

    comment = Home Directories

    valid users = %S

    read only = No

    browseable = No

    ```


    In this example, you must share the home names. If Samba finds a share with this
    name in the configuration file, it is treated in a special way.


    When a share is requested, Samba first scans the existing sections of the configuration
    file. If no section is found, Samba uses the requested share name as a user name
    and looks up the user in the local password file.


    If the user and the correct password is supplied, Samba automatically creates
    a share for the home directory of the user.


    The following describes the lines in the example:


    +   - valid users = %S


    The %S macro sets the value of the valid users option to the name of the requested
    share.


    +   - read only = No


    The exported home directory should be readable and writable for the authenticated-user.


    +   - browseable = No


    For security reasons, the share is not browseable.


    To access an exported home directory, use the address


    ```

    //server_name/user_name

    ```


