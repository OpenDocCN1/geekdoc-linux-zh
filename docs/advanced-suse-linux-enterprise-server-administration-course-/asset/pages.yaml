  md: '# 22 Section 1 Install SLES 9


    This dialog box provides the following options:


    +   **Format.** This lets you choose one of the following options:

    * **Do not format.** Do not format the newly created partition. if you need to
    change an existing partition instead of creating a new one.

    * **Format.** Formats the new partition with the file system you select from the
    File System drop-down list.


    You can choose from the following file systems:


    +   * **Ext2.** Formats the partition with the Ext2 file system. Ext2 is an old
    and proven file system, but it does not include journaling.

    * **Ext3.** Formats the partition with the Ext3 file system. Ext3 is the successor
    of Ext2 and offers a journaling feature.

    * **FAT.** Formats the partition with the FAT file system. FAT is an older file
    system used in DOS and Windows. You can use this option to create a data partition,
    which is accessible from Windows and Linux. You must not create a root partition
    with this file system.

    * **JFS.** Formats the partition with JFS, a journaling file system developed
    by IBM.

    * **Reiser.** Formats the partition with ReiserFS, a modern journaling file system.
    (This is the default option.)

    * **XFS.** Formats the partition with XFS, a journaling file system originally
    developed by SGI.

    * **Swap.** Formats the partition as a swap partition.


    If you are not sure which file system to choose, select Reiser for root and data
    partitions and Swap for swap partitions.


    +   **Options.** By selecting Options, you can change parameters for the file
    system you selected. You can use the default parameters in most cases.


    +   **Encrypt file system.** If you select this option, the partition file system
    is encrypted. You should only use this option for non-system partitions such as
    user home directories.


    +   **Size.** Lets you configure the size of the new partition with the following:

    * **Start Cylinder.** The start cylinder determines the first cylinder of the
    new partition. YaST normally preselects the first available free cylinder of the
    hard disk.


    +   **End.** The end cylinder determines the size of the new partition. To configure
    the end cylinder, do one of the following:

    * Enter the cylinder number.'
