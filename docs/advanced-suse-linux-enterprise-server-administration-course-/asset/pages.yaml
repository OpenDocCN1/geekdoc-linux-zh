  md: '# Configure a Samba Server as a File Server


    Access Files Provided by an SMB Server The command to access a share on a server
    is similar to the command used to browse for available shares, but instead of
    just the server name, the full path to the share needs to be supplied with the
    -L option.


    In this example, smbclient connects to the share data on the server Fileserver:
    smbclient //Fileserver/data


    In this case, it is not necessary to supply a user name because the share data
    is configured with the guest ok = yes option. A user name can be supplied with
    the -U option.


    After smbclient has connected to a share, it displays the following prompt:


    ```

    Smb: >

    ```


    Smbclient can be used like a command-line FTP client. The most important commands
    are the following:


    +   - ls. Displays the content of the current directory.

    - cd. Changes to a directory.

    - get. Copies a file from the share to the current working directory.

    - put. Copies a file to the share. The share must be writable to use this command.


    Print on Printers Provided by an SMB Server You can use smbclient to print on
    shared network printers. The basic syntax of a print command is shown in the following:


    ```

    smbclient //Printserver/laser -c ''print letter.ps''

    ```


    In this example, the file letter.ps is printed on a network printer accessed through
    the share laser of the SMB Printserver.


    You can also use the command on the smbclient command line after you have connected
    to the server. The -c option performs the given command automatically after the
    connection to the server has been established.


    # Mount SMB Shares into the Linux File System


    Instead of accessing shared files with smbclient, you can mount a share into the
    file system like a hard disk partition or a CD-ROM drive.


    The basic mount command is shown in the following:


    ```

    mount -t smbfs //Fileserver/data /mnt

    ```


    In this example, the share data of the SMB server Fileserver is mounted into the
    directory /mnt. The option -t sm is necessary to specify that the resource to
    be mounted is an SMB share.'
