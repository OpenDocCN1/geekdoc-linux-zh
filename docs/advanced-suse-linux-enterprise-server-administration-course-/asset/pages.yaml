  md: '# INTRODUCTION


    Given the number of press reports about attacks on computers, it is not surprising
    that computer security is being taken more seriously.


    Despite the increased interest in security not all administrators and decision
    makers understand what security IT means and why this is important to them.


    Every branch of the IT industry is concerned with security. Many security products
    have been created in recent years. Firewall solutions and antivirus software have
    become bestsellers and yet an important component of every security concept-perhaps
    even the most important component-is being neglected.


    Without the appropriate knowledge you cannot recognize and understand security-critical
    issues in complex IT infrastructures.


    This section begins with a general overview of security concepts. This is because
    every aspect of security needs to be seen in the context of the environment. It
    does not make sense to secure one server when the same data can be stolen or manipulated
    on other systems.


    After the introduction, you will learn details about local security. Local security
    covers every threat that can be caused by users of the local system.


    This section does not cover topics that belong to the area of network security.
    Topics such as firewalls and packet filtering are beyond the scope of this course.


    # OBJECTIVE 1 CREATE A SECURITY CONCEPT


    > “It is easy to run a secure computer system. You merely have to disconnect all
    dial-up connections and permit only direct wired terminals, put the machine and
    its terminals in a shielded room and post a guard at the door.”


    F.T. Grammpp and R.H. Morris


    It might be possible to operate a computer system in this secure manner, but it’s
    not practical. To deal with network problems in the real world, a different security
    concept is required.


    This objective does not provide sample solutions that can be adapted to your own
    problem solving. Instead, you learn how to create your own security concepts.


    The process of creating a security concept consists of the following parts:


    +   - Understand the Basics of a Security Concept

    - Perform a Communication Analysis

    - Analyze the Protection Requirements

    - Analyze the Current Situation and Necessary Enhancements'
  merge: -1
  pgno: 195
- img_proc: true
  md: "# Understand the Basics of a Security Concept\n\nFirst, you must know what\
    \ you are protecting your system from. A security concept for a computer used\
    \ by multiple users at different times is different from a security concept for\
    \ an environment in which many different users use multiple computers at the same\
    \ time.\n\nIf users work on different computers and use common resources, such\
    \ as disk space or printers, then a security concept pertaining to a network must\
    \ be considered.\n\nThe formal method of creating a security concept presented\
    \ in this section has been tried and in practice. It helps to detect errors and\
    \ sources of danger that are not obvious and provides good documentation of the\
    \ concept.\n\n# Perform a Communication Analysis\n\nCreating a security concept\
    \ begins with a communication analysis. This includes analyzing the security situation\
    \ and evaluating the dangers.\n\nResources are differentiated according to what\
    \ a user needs and how the access to the resources is controlled.\n\nIf users\
    \ should not have access to certain resources, you can assign different access\
    \ rights. For example, you can determine which user groups use a resource, or\
    \ if the user groups only access the resource during a certain time period.\n\n\
    By answering the following questions, you can learn valuable information to use\
    \ in developing a structured overall picture of your security needs.\n\n+   **\
    \ What information will be exchanged across which barriers and in which direction?**\n\
    \  > *Barrier* can be the virtual barrier between the home directories of two\
    \ users in a UNIX system or a firewall between two networks.\n\n** Which data\
    \ packets will be transported with which protocols to which hosts in the network?**\n\
    \  > The fewer protocols you use, the better security you will have, simply because\
    \ there are fewer sources of error.\n\n** What resources are available to individual\
    \ users and with which access rights?**\n  > Consider the resources users will\
    \ need: printers, files on storage media, the storage media themselves (such as\
    \ CD-ROM drives), sound cards, modems, fax cards, ISDN cards, network services\
    \ (such as FTP or HTTP), and the computing capacity of CPUs.\n\n** Which resources\
    \ must be available in each work area?**\n  > Even in small companies, different\
    \ departments require different resources."
  merge: -1
  pgno: 196
- img_proc: true
  md: '+   Which data must users have access to and in which way?


    It does not make sense to organize access to data for each specific user individually.
    It is better to structure access rights for user groups.


    +   Which external users have external access to company resources, what resources
    they use, and how is access controlled?


    Pay special attention to the authenticating users.


    +   Which external resources does the company provide?


    Usually this means Web and mail servers and other Internet services.


    +   Should users be charged for resources?


    Many organizations charge users or departments for expensive resources (such as
    Internet bandwidth).


    +   Which tasks must external service providers be involved?


    Determine if it is necessary to exchange any security-relevant data with the external
    service provider?


    +   How do security restrictions affect users, and how open are users to these
    restrictions?


    Users are more willing to live with restrictions if they understand why the restrictions
    are needed.


    +   Will you filter transmitted or stored information on gateways between networks
    or on computers?


    This applies to virus control, which should take place where the viruses can be
    reliably detected, on workstations and file servers.


    +   How available do individual resources need to be?


    Not every file server in the company needs to have a high availability setup.
    This is why it is important to calculate exactly what costs are incurred if a
    resource fails.


    # Analyze the Protection Requirements


    After you have determined the communication demands, you need to analyze the protection
    requirements for the data.


    The expense of securing individual resources is determined by the amount of potential
    damage that could be caused by an attack, a faulty operation, or a natural catastrophe.


    You should estimate the frequency of the occurrence of possible damage to use
    in your calculations.'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'To determine your protection needs, ask yourself the following questions:


    +   ** Which groups of people can access which information?**

    Is there information reserved for management, while other information is available
    to all employees?


    +   ** Where is protected data located?**nThe degree of data protection needed
    determines the degree of protection for each individual computer in the corresponding
    network.


    +   ** Which zones exist and what security needs do they have?**

    You should create corresponding security zones for computers belonging to the
    same protection context.


    +   ** What might happen to security zones if security barriers are breached?**

    This question is not difficult to answer if the security zones have previously
    been clearly defined.


    +   ** Who are potential attackers?**

    You also need to estimate the financial and technical means of the potential attackers.


    +   ** What information is of special interest to others?**

    This question helps you group zones with different security needs.


    +   ** What are the remaining risks when the security concept is implemented?**

    This question can only be asked at the end of the analysis. Consider all questions
    asked, the relevant answers, and the technical and organizational implementation
    of the security concept.


    Important parts of the communication analysis can be represented in tables, also
    known as access matrices.


    Table 4-1 shows a simple access matrix.


    | Proxy Server | Web Server | Mail Server |

    |---|---|--|

    | Workstation Office | 8080 | | |

    | Workstation Web Designer | 8080 | ssh | |

    | Workstation Sysad | 8080 | ssh | ssh |

    | Mail Server Intranet | | | smtp |'
  merge: -1
