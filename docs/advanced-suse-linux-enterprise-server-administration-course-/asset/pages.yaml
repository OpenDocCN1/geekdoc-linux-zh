  md: '# How to Perform Basic Script Operations with Variables


    In this part of the section, you learn how to use variables in shell scripts.


    The flowchart and script in Figure 6-5 show how a string value can be assigned
    to a variable.


    ![](img/501a26f547021936f65b9bd40bb47394_286_0.png)


    Figure 6-5


    You want to read the user''s first and last name and then print both names to
    the screen. However, this time you create a variable called NAME, which holds
    both the first and the last name.


    The following is an interesting line in the script:


    ```

    NAME=$FIRSTNAME $LASTNAME

    ```


    This line shows how you can combine two variables, in this case, FIRSTNAME and
    LASTNAME, and assign the combined value to another variable, in this case, NAME.


    In this example, you can also see another rule of the variable handling in shell
    scripts. If you assign a value to a variable, you just use the name of the variable,
    in this case, NAME=$.


    If you want to use the value of a variable, put a $ before the name, in this case,
    $FIRSTNAME.


    It is often useful to assign a default value to a variable. This might prevent
    errors, if the user has entered a value that cannot be interpreted in a meaningful
    way.'
