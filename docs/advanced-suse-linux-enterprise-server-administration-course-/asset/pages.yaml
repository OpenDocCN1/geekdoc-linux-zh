  md: '# 400 Glossary


    hwup command — Used to configure the device driver and interface for a device.


    ostat command — Displays application, CPU, and I/O statistics for disk devices.


    HyperText Markup Language (HTML) — The format of information that is processed
    by Web browsers.


    ip command — Used to view, configure, and manage network interfaces and the routing
    table.


    HyperText Transfer Protocol (HTTP) — The protocol used to obtain Web pages and
    other content from a Web server.


    IPv4 — The current version of the TCP/IP protocol


    IPv6 — A new version of the TCP/IP protocol suite contains a larger address space
    and improvements to routing and security.


    ifdown command — Used to deactivate a network interface.


    John the Ripper — A common password checking program over the Internet.


    ifup command — Used to activate a network interface.


    journaling — A file system feature stores file system events in a journal file
    of system failure.


    ip command — Used to configure the interface for a network device.


    KDE System — A graphical utility that can monitor the performance of almost all
    system components.


    incremental backup — A backup of all data on the system that has been modified
    since the last backup.


    kernel module — A software component that is inserted into the Linux kernel. Kernel
    modules are usually device drivers.


    init — The first process started by the Linux kernel; it is responsible for starting
    and stopping other processes.


    init command — Used to change the system runlevel.


    ldapadd — Used to create objects in an LDAP database using entries in an LDAP
    file.


    initrd — The init ramdisk that is used to load device drivers at the onset of
    system initialization.


    ldapdelete command — Used to remove an LDAP object from an LDAP database.


    Input/Output (I/O) Scheduler — A system component that executes disk requests
    for applications.


    ldapmodify command — Used to modify objects in an LDAP database using entries
    in an LDAP file.


    inserv command — Used to configure system services to start in certain run levels.


    ldapsearch — Used to query LDAP databases.


    interface — A logical representation of a device used by software.


    LDIF — The format of files that are used to create, modify, and query objects
    in an LDAP database. It stands for Lightweight Interchange Format.


    interface agent — A hotplug agent that creates and configures an interface for
    a hotplug device.


    let command — Performs integer arithmetic operations.


    Internet Control Protocol (ICMP) — A part of the TCP/IP protocol suite that is
    used to relay information about network communications.


    Lightweight Directory Access Protocol (LDAP) — A software protocol used to locate
    resources in a network directory database.


    Internet Protocol (IP) — The protocol used to communicate with other computers
    on the Internet and most other networks.


    Internet Protocol (IP) address — A unique address to identify a computer on a
    TCP/IP network.


    link — A connection between a network device and the network.'
