  md: '# Key Terms 327


    # CHAPTER Summary


    +   - Although most software for SLES comes in RPM format, you may use the GNU
    Build Tool Chain to compile program source code into software.


    +   - Script languages and compiler languages are used to create text files that
    contain program instructions. For script languages, these text files may be executed
    using an interpreter program. For compiler languages, these text files (called
    source code files) must be converted to an executable program using a compiler.


    +   - The C programming language is a common compiler language that uses the GNU
    Compiler (gcc).


    +   - Most source code files are available on the Internet in compressed tar format.


    +   - To compile source code files, you typically run the configure script in
    the source code directory to save the options for compilation in the Makefile.
    Following this, you can run the make command to compile the program using gcc
    and the options in the Makefile. Finally, the make install command may be used
    to copy the compiled program executable and supporting files to the appropriate
    directory on the file system.


    +   - Shared libraries are functions that are used by several different programs.
    You can create programs in less time by referencing shared libraries instead of
    recreating the same functions manually.


    +   - Most source code files use header files to locate shared library files.
    Header files for system software packages are not installed by default; these
    files are part of a package that has the extension -devel.


    # Key Terms


    +   - compiler — A program that translates instructions from a text file into
    a binary executable program.


    +   - compiler language — A programming language whereby instructions are stored
    in a file that is later compiled into an executable program.


    +   - configure — The script contained in a C source directory that creates system-specific
    options used to compile a particular program. These options are stored in the
    Makefile.


    +   - gcc command — The GNU C Compiler program.


    +   - GNU Build Tool Chain — A series of software components that may be used
    to compile C programs in SLES.


    +   - header file — A file that contains function declarations for shared libraries.
    To use a shared library in a program, you must refer to the header file during
    program compilation.


    +   - make command — The GNU make manager program. It is used to compile a program
    using the GNU C Compiler and compiler options in a Makefile. It can also be used
    to copy a compiled program to the correct directory on the file system.


    +   - Makefile — The file that stores C compilation options for a specific program.
    It is typically created by the configure script.'
