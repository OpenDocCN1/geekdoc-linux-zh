  md: "# Configure and install the GRUB Boot Loader\n\n# The Basics of GRUB\n\nGRUB\
    \ is the standard boot loader of SLES 9 and includes the following features:\n\
    \n+   - Stage 2 File System Drivers. Stage 2 of GRUB includes file system drivers\
    \ for ReiserFS, ext2, ext3, Minix, JFS, FAT, and FFS (BSD).\n\nThis means that\
    \ GRUB can be used to access files by means of filenames even before the operating\
    \ system is loaded. This feature is used to search for kernel and initrd mcodes.\n\
    \n+   - GRUB Shell. GRUB has its own shell that enables interactive control of\
    \ the boot manager.\n\n# How to Configure the GRUB Boot Loader\n\nYou configure\
    \ GRUB by editing the file /boot/grub/menu.lst. The following is the general structure\
    \ of the file:\n\n+   - First, the general options such as the background color\
    \ of the boot manager menu are listed:\n  - color white/blue/black/light-gray\n\
    \n+   - This is followed by options for the various operating systems that can\
    \ be booted with the boot manager. Each entry for an operating system begins with\
    \ a command title, as in the following:\n```\ntitle linux\nkernel (hd0,0)/boot/vmlinuz\
    \ root=/dev/hda\ninitrd (hd0,0)/boot/initrd\n```\n\nThe following is an example\
    \ of a simple GRUB configuration file:\n\n```\ndefault 0\ntimeout 8\ntitle linux\n\
    kernel (hd0,0)/boot/vmlinuz\nroot=/dev/hda\ninitrd (hd0,0)/boot/initrd\n```\n\n\
    Each line in this example is described below:\n\n+   - default 0\n  The first\
    \ entry (numbering from 0) is the default boot entry that starts automatically\
    \ if no other entry is selected with the keyboard.\n\n+   - timeout 8\n  The default\
    \ boot entry is started automatically after eight seconds.\n\n+   - title linux\n\
    \  This is the first entry in the boot menu. By default, this entry is started."
