    # OBJECTIVE 2 LIMIT PHYSICAL ACCESS TO SERVER SYSTEMS


    If a server is not protected from unauthorized physical access, even the best
    software configuration cannot prevent someone from misusing it. By rebooting a
    server from a floppy or CD, or by passing boot parameters to the Linux kernel,
    someone can access the server without knowing the password.


    To prevent unauthorized users from physically accessing the server, do the following:


    +   - Place the Server in a Separate, Locked Room

    - Secure the BIOS with a Password

    - Secure the GRUB Boot Loader with a Password


    # Place the Server in a Separate, Locked Room


    The best way to prevent physical access to a server is to lock the server in a
    dedicated room. We highly recommended that you do this for every production system.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Limit Physical Access to Server Systems 187


    The server room should be locked with a solid door, and only system administrators
    should have access. The room should be protected against fire and be equipped
    with an automatic fire-extinguishing system.


    What can be done depends on the size of the company and on the available financial
    resources. At the least, a separated locked room for all servers is recommended.


    # Secure the BIOS with a Password


    For test systems or workstations that are not placed in a secure room, there are
    some things you can do to make it more difficult to access a system without an
    account.


    One of these is to set a password for the BIOS setup.


    The BIOS represents the lowest level of software and lies underneath the operating
    system. Modern BIOS versions give you the option of protecting the boot process
    with a password. You can also protect the BIOS settings and prevent the system
    from booting from media like floppies or CDs.


    > NOTE The exact procedure for protecting the BIOS depends on the BIOS vendor
    and version. For more details on this, please consult your vendor documentation.


    By preventing the system from booting from a different media, only the installed
    system can be started. This system is password protected and cannot be accessed
    without any further effort. However, a BIOS password is never a replacement for
    a dedicated server room.


    # Secure the GRUB Boot Loader with a Password


    Another way to misuse physical access to a Linux system is to reboot and pass
    additional parameters to the kernel. This makes it possible to start and access
    the system without entering a password.


    The boot loader GRUB can be configured to prompt for a password before any parameters
    can be entered. To do this, you need to create an encrypted password with the
    following parameter:


    ```

    grub-md5-crypt

    ```


    GRUB asks for a password that needs to be confirmed once and outputs an encrypted
    string. This string looks like the following:


    ```

    $SEVCU0SS.7WQL05kHi4VKDSsKtfII

    ```


    Then the password needs to be added to the GRUB configuration file as follows:


    ```

    /boot/grub/menu.lst

    ```'
