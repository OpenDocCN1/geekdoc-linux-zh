  md: '# CONFIGURE AN APACHE WEB SERVER


    # OBJECTIVE 3 CONFIGURE AN APACHE WEB SERVER


    The Apache Web server is the leading Web server software. Apache was developed
    as open source software and is shipped with SLES 9.


    To set up an internal Apache Web server, you need to know:


    +   - The Basic Functionality of a Web Server

    - How to Install and Set Up a Basic Apache Web Server

    - The Structure and the Basic Elements of the Apache Configuration Files

    - The Basic Apache Configuration

    - How to Configure Virtual Hosts

    - How to Limit Access to the Web Server

    - How to Configure OpenSSL for Connection Encryption


    # The Basic Functionality of a Web Server


    A Web server delivers data that is requested by a Web browser. The data can have
    different formats such as HTML files, image files, Flash animations, or sound
    files.


    Web browsers and Web servers communicate using HTTP (Hyper Text Transfer Protocol).
    Figure 3-7 shows the relationship between the browser, server, and HTTP.


    ![](img/501a26f547021936f65b9bd40bb47394_150_0.png)


    Figure 3-7


    In addition to delivering data to the Web browser, a Web server can perform tasks
    such as limiting access to specific Web sites, logging access to a file, and encrypting
    the connection between a server and browser.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# How to Install and Set Up a Basic Apache Web Server


    To set up a basic Apache Web server, you need to do the following:


    +   - Install the Required Software Packages

    - Start and Test the Web Server

    - Locate the DocumentRoot of the Web Server


    # Install the Required Software Packages


    To run a basic Apache Web server, you need to install the following packages with
    YaST:


    +   - apache2. The basic Web server software.

    - apache2-prefork. An additional Apache package that influences the multiprocessing
    behavior of the Web server.

    - apache2-example-pages. Sample HTML pages.


    SLES 9 has two Apache versions: Apache series 1 and Apache series 2. This section
    covers Apache 2 because this version will continue to be developed.


    When you install the packages listed above, YaST prompts you to install also one
    or more additional packages required by Apache. Confirm the additional package
    installation by selecting OK to resolve all dependencies of the Apache packages.


    # Start and Test the Web Server


    After installing the required software, you need to start the Web server. Do this
    as the root user by entering the following:


    apache2 start


    As with all services, enter the following to stop the Web server:


    apache2 stop


    If you want the Web server to start up at boot time, you need to enter the following:


    inserv apache2


    To test whether the Web server is properly installed, open a Web browser and enter
    the following address:


    http://localhost


    The browser displays the page shown in Figure 3–8.


    If your SLES 9 is connected to a network, you (and other hosts on the network)
    can remotely access the Web server by entering the following:


    ```

    http://your_system_IP_address

    ```


    If your network provides a DNS server, you can use the hostname instead of the
    IP address.'
  merge: -1
  pgno: 151
