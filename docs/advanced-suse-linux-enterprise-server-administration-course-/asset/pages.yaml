  md: '# OBJECTIVE 5 LEARN ABOUT USEFUL COMMANDS IN SHELL SCRIPTS


    You can use external commands in shell scripts to perform certain tasks. In this
    objective, you learn how to:


    +   - Use the catCommand

    - Use the cut Command

    - Use the date Command

    - Use the echo Command

    - Use the grep and egrep Commands

    - Use the sed Command

    - Use the test Command

    - Use the tr Command


    # Use the cat Command


    When combined with here operator (<<), the cat command is a good choice to output
    several lines of text from a script. In interactive use, the command is mostly
    run with a filename as an argument, in which case cat prints the file contents
    on standard output.


    # Use the cut Command


    You can use the cut command to cut out sections of lines from a file, so only
    the specified section is printed on standard output.


    The command is applied to each line as available in a file or on standard input.
    You can use cut -f to cut out fields. cut -c works with the specified characters.


    You can specify single sections (characters or fields) or several sections. The
    default delimiter to separate fields from each other is a tab, but you can specify
    a different field separator with the -d option.


    The following are some examples of using cut:


    ```

    cut -d : -f1 /etc/passwd

    root

    bin

    demon

    1p

    mail

    news

    ```


    The above command specifies that the field separator should be a colon. In every
    line of /etc/passwd, the field that comes before the first colon is taken and
    printed to stdout:


    ```

    ls -l somedir/ | cut -c 35- | sort -n

    ```'
  merge: -1
  pgno: 308
