  md: '# OBJECTIVE 8 STAY INFORMED ABOUT SECURITY ISSUES


    One of the most important security tasks for an administrator is to stay informed
    about

    current security issues.


    Damage can be prevented only when security patches are installed as quickly as
    possible.

    You can use the following resources to gather information about Linux-related

    security issues:


    +   * www.suse.de/en/business/security.html. This Web site is the central security

    information site of SUSE. All security issues affecting the SUSE products are

    announced here.


    You will also find information about security and OpenSource software and the

    SUSE security team.


    +   * www.suse.de/en/business/mailinglists.html. This Web site offers an over-view
    of all SUSE related mailing lists.


    There are two security related mailing lists that you can subscribe to for further

    security information.


    +   * security-announce. This mailing list is intended for security-relevant

    discussions.

    * security-security-announce. This mailing list announces security issues and

    fixes. This mailing list is read only. For discussions please use-suse-security.


    To subscribe to a mailing list, select the check boxes by the name of the list,
    enter your mail address at the bottom of the page, and then click OK.


    +   * www.securityfocus.com/. This Web site is about general IT security. It also
    offers various security-relevant mailing lists.


    # Exercise 4-3 Subscribe to the SUSE Security Announcements


    In this exercise, you subscribe to the SUSE mailing list. This means that Novell/

    SUSE will inform you by e-mail about current security issues of SUSE Linux Products.


    If you don''t want to receive these messages, skip this exercise.


    Do the following:


    +   * From the KDE start menu, select Internet > Web Browser.

    * In the address bar of the browser, enter the following:

    www.suse.com/us/business/mailinglists

    * Scroll down to the entry suse-security-announce; then select the check box for
    that entry.'
