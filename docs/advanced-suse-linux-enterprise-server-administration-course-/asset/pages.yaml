  md: "# OBJECTIVE 6 AUTOMATE DATA BACKUPS WITH THE CRON SERVICE\n\nBacking up data\
    \ is a task that you should perform on a regular basis. You can automate backups\
    \ in Linux with the cron service.\n\nSystem jobs are controlled by the file /etc/crontab\
    \ and the files in the directory /etc/cron.d. They are defined with the scripts\
    \ in the directories /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, and\
    \ /etc/cron.monthly.\n\nSpecifying which users can create cron jobs is done through\
    \ the files /var/spool/cron/allow and /var/spool/cron/deny, which are evaluated\
    \ in this order. If both files do not exist, then only root can define jobs.\n\
    \nThe jobs of individual users are stored in files in the directory /var/spool/cron/tabs\
    \ with names matching the user name. These files are processed with the cron command.\n\
    \nThe following is an example of a cron job:\n\n```\n0 22 * * 5 /root/bin/backup\n\
    ```\n\nIn this example, the script /root/bin/backup is started every Friday at\
    \ 10 p.m. The format for the line is described in man crontab.\n\n# Exercise 5-4\
    \ Configure a cron Job for Data Backups\n\nIn this exercise, you use cron for\
    \ data backup by doing the following:\n\n+   1. Open a terminal window and set\
    \ to root.\n2. Change to the directory /usr/local/bin/ by entering the following:\n\
    \   cd /usr/local/bin\n3. Create the file home_backup.sh in the directory and\
    \ enter the following commands in the file:\n   !/bin/bash\n   rsync -av /home/geeko\
    \ /tmp/rsync_test\n4. Save the file and close the editor.\n5. Make the file executable\
    \ by entering the following:\n   chmod 744 home_backup.sh\n6. Open the file /etc/crontab\
    \ in the crontab editor by entering crontab -e.\n7. Add the following to the end\
    \ of the file:\n   30 15 * * root /usr/local/bin/home_backup.sh\n8. Check after\
    \ 3:30 p.m. (or tomorrow) to see if the backup has been completed by entering\
    \ the following:\n   Is /tmp/rsync_test\n9. (Optional) Try changing the time of\
    \ the backup job."
