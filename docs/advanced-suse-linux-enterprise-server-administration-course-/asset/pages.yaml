  md: '# Understand the Linux User Authentication 193


    +   - password required pam_pwcheck.so nullock


    This is an entry for a module of the type password. It is used when a user attempts
    to change the password. In this case, the module pam_pwcheck.so is used to check
    if a new password is secure enough.


    +   - password required pam_unix2.so nullock use_first_pass user_authtok


    The pam_unix2.so module is also necessary when changing a password. It takes the
