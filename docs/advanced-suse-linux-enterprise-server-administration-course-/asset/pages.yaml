  md: '# How to Configure a Directory with a Default ACL


    Directories can have a default ACL, which is a special kind of ACL that defines
    the access permissions objects under the directory inherit when they are created.
    A default ACL affects subdirectories as well as files.


    There are two different ways in which the permissions of a directory''s default
    ACL are passed to the files and subdirectories in it:


    +   - A subdirectory inherits the default ACL of the parent directory both as
    its own default ACL and as an access ACL.

    - A file inherits the default ACL as its own access ACL.


    All system functions create file system objects using a mode parameter that defines
    the access permissions for the newly created file system object.


    If the parent directory does not have a default ACL, the permission bits as defined
    by the umask are subtracted from the permissions passed by the mode parameter,
    with the result being assigned to the new object.


    If a default ACL exists for the parent directory, the permission bits assigned
    to the new object correspond to the overlapping portion of the permissions of
    the mode parameter and are defined in the default ACL. The umask command is disregarded
    in this case.


    The following three examples show the main operations for directories and default
    ACLs:


    +   - Add a default ACL to the existing directory mydir with the following command:

    setfacl -d -m group:jungle:mydir


    The option -d of the setfacl command prompts setfacl to perform the modifications
    (option -m) in the default ACL.


    Take a closer look at the result of this command:


    ```

    # file: mydir

    # owner: tux

    # group: project3

    user::rwx

    user:jane:rwx

    group::r-x

    group:jungle:rwx

    mask::rwx

    other::-\-

    default:user::rwx

    default:group::r-x

    default:group:jungle:r-x

    default:mask::r-x

    default:other::---

    ```'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Section 4 Secure a SLES 9 Server


    getfac returns both the access ACL and the default ACL. The default ACL is formed
    by all lines that start with default.


    Although you merely executed the setfacl command with an entry for the jungle
    group for the default ACL, setfacl automatically copied all other entries from
    the access ACL to create a valid ACL.


    Default ACLs do not have an immediate effect on access permissions. They come
    into play when file system objects are created. These new objects inherit permissions
    from the default ACL of their parent directory.


    +   In the following example, mkdir is used to create a subdirectory in mydir,
    which inherits the default ACL:

    ```

    mmkdir mydir/mysubdir

    getfacl mydir/mysubdir

    # file: mydir/mysubdir

    # owner: tux

    # group: project3

    user::rwx

    group::r-x

    group:ungle:r-x

    mask:r--

    other::-

    dault:user:rwx

    dault:group:r-x

    dault:group:ungle:r-x

    dault:mask:r--

    dault:other::-

    ```


    As expected, the newly-created subdirectory mysubdir has permissions from the
    default ACL of the parent directory.


    The access ACL of mysubdir is an exact reflection of the default ACL of mydir,
    as is the default ACL that this directory holds to its subordinate objects.


    +   In the following example, touch is used to create a file in the mydir directory:

    ```

    touch mydir/myfile

    ls -l mydir/myfile

    --rw-r--r++ tux project3 ... mydir/myfile

    getfacl mydir/myfile

    # file: mydir/myfile

    # owner: tux

    # group: project3

    user::rwgroup:: r- x # effective:r-

    group:ungle:r- x # effective:r-

    mask:r--

    other::-

    ```


    touch passes a mode with the value 0666, which means that new files are created
    with read and write permissions for all user classes, provided no other restrictions
    exist in umask or in the default ACL.'
