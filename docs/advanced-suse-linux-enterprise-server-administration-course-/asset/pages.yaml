- img_proc: true
  md: "# Configure an Apache Web Server\n\nThese directives must be used within a\
    \ <Directory> block and control the access to all data below that directory.\n\
    \n```\n<Directory \"srv/www/htdocs\">\n  Order deny,allow\n  Deny from all\n \
    \ Allow 10.0.0.0/24\n</Directory>\n```\n\nThe following lists and describes the\
    \ lines in the example:\n\n+   - <Directory \"/srv/www/htdocs\">\\ This directive\
    \ starts the directory block.\nThe directives that follow apply to the directory\
    \ /srv/www/htdocs.\n- Order deny,allow. The Order directive determines in order\
    \ which the allow and deny directives are evaluated.\n\nYou have the following\
    \ options:\n\n+   - Deny,Allow. The deny directives are evaluated before the allow\
    \ directives.\nAccess is denied by default. Any client who does not match a deny\
    \ directive or does match an allow directive is allowed access to the server.\n\
    - Allow,Deny. The allow directives are evaluated before the deny directives.\n\
    Access is denied by default. Any client who does not match an allow directive\
    \ or match a deny directive is denied access to the server.\n- Mutual-failure.\
    \ Only hosts that appear in the Allow list and do not appear on the Deny list\
    \ are granted access. This has the same effect as Allow,Deny and is deprecated\
    \ in favor of that configuration.\n- Deny from all. The deny directive is evaluated\
    \ first, and in this case access is denied for all clients. You can use the following\
    \ options with the deny and the allow directives:\n- all. This option applies\
    \ to all hosts.\n- A full IP address. This option applies to a specific IP address\
    \ (such as 10.0.0.23).\n- A partial IP address. This option applies to IP addresses\
    \ starting with the given IP address fragment (such as 10.0).\n- A network/netmask\
    \ pair. This option applies to IP addresses matching to the given network/netmask\
    \ pair (such as 10.0.0.0/255.255.255.0).\n- A network/nnn CIDR specification.\
    \ This option applies to IP addresses matching to the given CIDR expression (such\
    \ as 10.0.0.0/24)."
