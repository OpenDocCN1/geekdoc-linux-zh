    In the installation step, YaST displays the Service Configuration dialog box.
    In the top part of the dialog box, you can choose one of the following options:


    +   ■ Skip Configuration. Skip this configuration step. You can enable the services
    later in the installed system.


    +   ■ Use Following Configuration. Use the automatically generated configuration
    displayed below this option or select one of the following headlines to change
    the configuration:


    +   ■ CA Management. The purpose of a CA (certificate authority) is to guarantee
    a trust relationship among all network services that communicate with each other.


    If you decide that you do not want to establish a CA, you must secure server communications
    using SSL and TLS separately for each individual service.


    By default, a CA is created and enabled during the installation.


    +   ■ LDAP Server. You can run an LDAP service on your host to have a central
    facility managing a range of configuration settings. Typically, an LDAP server
    handles user account data, but with SLES 9, you can use LDAP for mail, DHCP, and
    DNS related data.


    By default, an LDAP server is set up during installation. If you decide not to
    use an LDAP server, the YaST mail server module does not work because it depends
    on LDAP. However, you can still set up a server on your system using the Mail
