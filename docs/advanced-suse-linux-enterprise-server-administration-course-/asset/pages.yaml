  md: '# Table 4-17 (continued)


    | Option | Description |

    | --- | --- |

    | User Launching Updatedb | This option determines under which user ID the command
    updated is executed by cron.

    nThe updatedb program indexes all files in the file system. The generated database
    can be queried with the locate command.

    The choices of this option are:

    - nobody. The command is launched under the user ID of the system user nobody.
    This way only files that are accessible for the user nobody are indexed.

    - root. The command is executed under the user ID of the root user.

    This way all files in the file system should be indexed.

    | Current Directory In Root Path | For security reasons you should use the user
    nobody. This way no files are indexed that should not be accessible for normal
    users.

    If this option is selected, the current directory is added to the search path
    of root.

    This could lead to security problems if an attacker places an executable with
    a common name ls into a directory.

    If root enters in that directory, the executable of the attacker could be launched
    instead of the normal ls command |

    | Current Directory In Path Of Regular Users | Never select this option.

    If this option is selected, the current directory is added to the search path
    of normal users.

    In a security sensitive environment, this option should not be enabled.

    | Enable Magic SysRq Keys | This option enables special key combinations that
    give you some control over the system in the case of a system crash.

    This is useful for debugging purposes but should be disabled on production systems.
    |


