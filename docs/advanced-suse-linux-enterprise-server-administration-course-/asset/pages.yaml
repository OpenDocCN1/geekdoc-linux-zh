  md: '# 396 Glossary


    /etc/ldap/schema — The directory stores the

    OpenLDAP schema in SLES.


    /etc/ldap/slapd.conf — The OpenLDAP server

    configuration file.


    /etc/pam.d — The directory stores PAM conf-

    ration files.


    /etc/passwd — The file typically used to store user

    account information on Linux systems.


    /etc/permissions.local — A file that lists the user-

    edefined permissions for system files.


    /etc/permissions.secure — A file that lists secure

    permission restrictions for system files.


    /etc/resolv.conf — A file that lists up to 3 DNS

    servers that may be contacted to resolve a remote host-

    name to an IP address.


    /etc/samba/smb.conf — The main Samba configura-

    tion.


    /etc/security — A PAM file that validates root login

    terminals.


    /etc/security/limits.conf — A PAM file that lists user

    resource limits.


    /etc/shadow — The file typically used to store user

    account password information on Linux systems.


    /etc/sysconfig/hardware — A directory that stores

    information about hardware devices on the system.

    Files in this directory are used by the hw command.


    /etc/sysconfig/network — Stores for net-

    works in SLES. Files in this directory are used

    by the ifconfig command.


    /etc/sysconfig/network/routes — A file that stores

    static routes for the system.


    /lib/modules/kernel-version — The directory that\stores kernel modules in SLES.


    /lib/security — The directory that stores PAM modules.


    /proc/sys/kernel/hotplug — The file that the Linux

    kernel uses to call /sbin/hotplug when a hot event

    occurs.


    /proc/sys/vm/swappiness — A file that determines

    how often swap will be used to store information.


    /sbin/hotplug — The script called by the Linux

    kernel during a hot event.


    /srv/rw/htdocs — The default DocumentRoot

    directory in Apache.


    /sys/block — A directory that stores interface informa-

    by device.


    /sys/block/device/queue/iosched/quantum — A

    file that sets the number of I/O requests that are stored

    a queue before being sent to the hardware device.


    /sys/block/device/queue/read_ahead — A file that

    s the amount of data that is read when access-

    ing on a disk.


    /sys/bus — A directory that stores hardware information

    by type.


    /sys/class — A directory that stores informa-

    by type.


    /sys/devices — A directory that stores hardfor-

    mation device.


    /var/lib/named — The directory that stores zones files

    in SLES.


    /var/log/messages — The default log file for the DNS

    daemon.


    /var/spool/cron/allow — A file that lists users who

    use the crontab.


    /var/spool/cron/deny — A file that lists users who

    cannot use the crontab.


    /var/spool/cron/tabs — The directory used by the

    cron service to schedule commands for a particular

    account.


    || operator — Processes the commands on the right

    hand if the commands on the left hand return

    a false (unexpected) exit status.


    << (here) operator — Used to read data from a file

    listed on the right of the operator, and send it to a

    command to the left of the operator.'
