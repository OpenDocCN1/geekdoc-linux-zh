    \ and lowercase letters.**\n- **g. Replace globally wherever the search pattern\
    \ is found in the line (instead of replacing only the first instance).**\n- **n.\
    \ Replace the nth matching pattern only.**\n- **p. Print the line after replacing.**\n\
    - **w. Write the text to the specified file rather than printing it on stdout.**\n\
    \nThe following are some examples of using the s command:\n\n+   - `sed 's/:/\
    \ /etc/passwd`\n  This command replaces the first colon in each line with a space.\n\
