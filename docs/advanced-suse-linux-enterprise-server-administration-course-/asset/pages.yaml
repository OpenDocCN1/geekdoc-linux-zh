  md: '# Configure an Apache Web Server


    The following describes each line:


    +   **AuthType Basic.** This directive sets the authentication method. For the
    type described in this section, the value is Basic.

    * **AuthName "Restricted Files". With this directive, you have to choose a name
    for the restricted directory of your Web server. This name is used for the authentication
