  md: "# Section 3 Configure Network Services\n\nFor forward resolution, this is the\
    \ domain name. For reverse resolution, the prefix of the IP address must be given\
    \ in reverse order (10.0.0.0 becomes 0.10.0.10.) to which the suffix in-addr.arpa\
    \ is added (0.0.10.in-addr.arpa).\n\nThe zone name is followed by an \"in\" for\
    \ Internet. (DNS servers can administer information on different name spaces,\
    \ not only that of the Internet. Other name spaces are practically used.)\n\n\
    The text in curly brackets defines the type of DNS server for the corresponding\
