- img_proc: true
  md: '# Section 3 Configure Network Services


    In this example, the computer mail.digitalairlines.com has the highest priority
    (is therefore the primary mail server); da1.digitalairlines.com and da5.digitalairlines.com
    both have the same priority.


    If the mail server with the highest priority cannot be reached, the mail server
    with the second highest priority is used. If several mail servers have the same
    priority, then one of them is chosen at random. An address entry must be made
    for each mail server.


    **Assign Aliases for Computers** If you want a computer to be reached by more
    than one name (such as addressing a computer as da30.digitalairlines.com and www.digitalairlines.com),
    then corresponding aliases must be given.


    These are the CNAME (canonical name) entries in the database file for forward
    resolution:


    | da30 | IN A 10.0.0.30 |

    | www | IN CNAME da30 |


    > The names of the mail servers for the domain (MX entry) cannot be alias names,
    since some mail servers cannot handle this correctly.


    # Configure One or More Slave Servers


    To guarantee reliable operation, at least one DNS master server besides the master
    server is required. This can take over part of the load from the DNS master server.
    but it is especially important in the case the DNS master server is not available.
    This new DNS server is set up as a DNS slave server.


    The essential difference between the two types is that a slave server receives
    copies of the zone files from the master server. Modifications to the zone files
    are only made on the master server.


    As soon as a slave server is started, it connects to the master server and receives
    from it a copy of the zone files. This is called a zone transfer.


    Comparison of data between the servers takes place automatically. On the one hand,
    the slave server queries the master server at regular intervals and detects, using
    the serial number of the zone files, whatever has anything changed.


    By default, the master server sends a message to all listed slave servers (called
    *notify*) as soon as it has been restarted in order to read in modified zone files.


    In the configuration file /etc/named.conf for a slave server, there are at two
    entries that define the master server.They are the two zone definitions for the
    loopback network (localhost).


    There may also be a zone definition for the root DNS server. But a zone definition
    is only necessary if the slave server will forward requests to other DNS servers.'
