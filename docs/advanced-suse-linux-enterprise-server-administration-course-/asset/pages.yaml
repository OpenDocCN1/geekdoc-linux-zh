  md: '# Section 5 Manage Backup and Recovery


    +   - kernel (hd0,0)/vmlinuz

    - This entry describes the kernel location (in this example, the first partition
    of the first hard disk).


    +   Note the following regarding the designations for hard disks and partitions:

    - GRUB does not distinguish between IDE and SCSI hard disks. The hard disk is
    recognized by the BIOS as the first hard disk is designated as hd0, the second
    hard disk as hd1, and so on.

    - The first partition on the first hard disk is called hd0,0, the second partition
    hd0,1, and so on.


    +   - root=/dev/hda1

    - This root option specifies the root partition of the system. This can be followed
    by other kernel parameters.


    +   - initrd (hd0,0)/initrd

    - This entry sets the location of the initial ramdisk (initrd). The initrd contains
    hardware drivers that are needed before the kernel can access the hard disk (such
    as a driver for the IDE or SCSI controller).


    Another GRUB configuration file is /etc/grub.conf. It contains information on
    how and where the components of the GRUB boot manager are supposed to be installed
    (for example, whether GRUB should reside in the MBR or in the boot record of a
    partition). This file is read only once when the boot loader is first installed.


