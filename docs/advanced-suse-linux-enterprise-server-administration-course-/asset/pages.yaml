  md: "# Configure an Apache Web Server\n\nThe settings in this file apply to the\
    \ Apache startup script and do not belong to the server configuration.\nSet the\
    \ following variables to the appropriate values:\n\n+   - APACHE_START_TIMEOUT=\"\
    10\"\n  This setting extends the timeout of Apache so that you have more time\
    \ to enter the passphrase of the private RSA key.\n- APACHE_SERVER_FLAGS=\"SSL\"\
    \n  The additional server flag defines the SSL variable when evaluating the Apache\
    \ configuration files. This enables some directives that are necessary for SSL\
    \ encryption.\n  For example, it lets Apache listen on port 443 instead of only\
    \ to port 80.\n\nYou also need to change the server configuration files to enable\
    \ SSL by doing one of the following:\n\n+   - Configure the Main Server to Use\
    \ SSL Encryption\n- Configure a Virtual Host to Use SSL Encryption\n\n**Configure\
    \ the Main Server to Use SSL Encryption** To configure the main server, you need\
    \ to add the following directives to the file /etc/apache2/default-server.conf:\n\
    SSLECipher on\nSSLCipherSuite\nALL:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP:+NULL\n\
    SSLCertificate /etc/apache2/ssl.crt/server.crt\nSSLCertificateKey /etc/apache2/ssl.key/server.key\n\
    \nEach line is described:\n\n+   - SSLEng on\n  This directive enables the Apache\
    \ SSL engine.\n- SSLCipherSuite\n  ALL:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP:+NULL\n\
    \  This directive sets the details of the encryption method. The line displayed\
    \ is the default configuration that comes with Apache.\n\nFor more information\
    \ about this directive, go to http://httpd.apache.org/docs-2.0/mod/mod_ssl.html#sslciphers.\n\
    \n![](img/501a26f547021936f65b9bd40bb47394_164_0.png)\n\n+   - SSLCertificateFile\
