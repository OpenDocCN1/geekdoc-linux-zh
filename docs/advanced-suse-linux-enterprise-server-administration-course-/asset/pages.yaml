    # CHAPTER SUMMARY


    +   - To maximize the use of your backup window, you should carefully develop
    a backup strategy. This includes choosing a backup method and media type.


    +   - Since full backups take a great deal of time to perform, they are typically
    combined with incremental and differential backups. Incremental backups archive
    data that has changed since the previous backup, whereas differential backups
    archive data that has changed since the previous full backup.


    +   - You can use the *tar* command to create full, incremental, and differential
    backups. Alternatively, you can use the *dd* command to create full backups and
    the *rsync* command to create and update full backups.


    +   - To manage tape media, you can use the *mt* command.


    +   - To schedule tasks to occur repetitively in the future, you must use the
    cron system. Tasks are scheduled to run using the /etc/crontab file. User tasks
    are scheduled using the crontab command and are stored in the /var/spool/cron
    directories.


    File corruption, hardware errors, or a misconfigured boot loader or init script
    may prevent the Linux system from booting normally. You may temporarily use your
    Linux system using a GRUB boot parameter or by booting from your SLES DVD and
    choosing the appropriate options. Alternatively, you may choose Rescue System
    after booting from your SLES DVD to obtain a Linux product that may be used with
    standard Linux commands to repair your system.


    +   - GRUB is the default boot loader in SLES and is configured using the /boot/grub/menu.list.
    It is a two-stage boot loader that contains file system support and an interactive
    shell.


    # KEY TERMS


    +   - /boot/grub/menu.list — The GRUB configuration file in SLES.

    - /dev/nst0 — A device that refers to the first non-rewinding SCSI tape device.

    - /dev/st0 — A device that refers to the first SCSI tape device.

    - /etc/cron.d — A directory that contains additional information used to schedule
    commands on a SLES system.

    - /etc/cron.daily — The directory that stores scripts that will be executed daily
    by the cron'
