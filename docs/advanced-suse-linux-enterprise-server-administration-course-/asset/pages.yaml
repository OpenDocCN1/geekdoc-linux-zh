    ate will be valid for this hostname only.


    +   E-mail Address []:

    Enter the e-mail address of the administrator who is responsible for the server.


    After you have answered all questions, the server certificate is saved into the
    file server.crt.

    Finally, you need to copy the files server.key and server.crt to the correct locations:


    +   Copy the file server.key to the directory /etc/apache2/ssl.key.


    +   Copy the file server.crt to the directory /etc/apache2/ssl.crt.


