  md: "# OBJECTIVE 7 TROUBLESHOOT THE BOOT PROCESS OF A SLES SYSTEM\n\nSometimes a\
    \ Linux system cannot start up correctly. Another task of system recovery is to\
    \ access a corrupted system and to fix the problem that prevents the normal boot\
    \ process. To perform basic troubleshooting of the boot process, you need to know\
    \ the following:\n\n+   * System Boot Process Issues\n* How to Boot a Corrupted\
    \ System Directly into a Shell\n* How to Boot a Corrupted System with the Installation\
    \ System\n* How to Start and Use the SLES9 Rescue System\n\n# System Boot Process\
    \ Issues\n\nThe boot process of a modern Linux system can be very complex, and\
    \ its possible to encounter problems during the boot process. \nThe following\
    \ are some of the most common problems:\n\n+   * The system cannot boot due to\
    \ a misconfigured boot loader.\n* The system cannot boot because of file system\
    \ corruption.\n* An init script has malfunctioned and is blocking the boot process.\n\
    * The system does not start correctly because of hardware changes.\n\nIn all of\
    \ these cases you must access the file system of the corrupted system to detect\
    \ and find the problem.\nIn this objective, you learn how to access a system which\
    \ is not booting any longer.\n\n# How to Boot a Corrupted System Directly into\
    \ a Shell\n\nThe boot screen of the GRUB boot loader lets you pass parameters\
    \ to modify the Linux kernel before the kernel is actually loaded.\nAt the bottom\
    \ of the GRUB boot screen is a Boot Options field. When you select an operating\
    \ system in the boot screen, the boot options for that operating system are displayed\
    \ in the field.\n\nTo add a boot option, select an operating system and type the\
    \ additional boot option in the Boot Options field.\n\nOne way to access a system\
    \ that is not booting anymore is to set a different program for the init process.\
    \ Normally, the Linux kernel tries to find a program with the name init and starts\
    \ this program as the first process. All other processes are then started by init."
  merge: -1
  pgno: 265
