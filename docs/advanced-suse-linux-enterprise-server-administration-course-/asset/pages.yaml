  md: '# Set Up Network Devices with the ip Tool 73


    # Assign an IP Address to a Device


    To assign an address to a device, a command similar to the following:


    ```

    ip address add 10.0.0.2/24 brd + dev0

    ```


    In this example, the command assigns the IP address 10.0.0.2 to the device eth0.
    The network mask is 24 bits long, as determined by the /24 after the IP address.
    The brd + option sets the broadcast address automatically as determined by the
    network mask.


    You can enter the following command to verify the assigned IP address:


    ```

    ip address show dev eth0

    ```


    The assigned IP address is displayed in the output of the command line.


    You can assign more than one IP address to a device.


    # Delete the IP Address from a Device


    To delete the IP address from a device, use a command similar to the following:


    ```

    ip address del 10.0.0.2 dev eth0

    ```


    In this example, the command deletes the IP address 10.0.0.2 from the device eth0.


    Use the following command to verify that the address was deleted:


    ```

    ip address show eth0

    ```


    # Change Device Attributes


    You can also change device attributes with the ip tool. The following is the basic
    command to set device attributes:


    ```

    ip link set device attribute

    ```


    The possible attributes are described in “Display Device Attributes.” The most
    important attributes are up and down. By setting these attributes, you can enable
    or disable a network device.


    To enable a network device (such as eth0), enter the following command:


    ```

    ip link set eth0 up

    ```


    To disable a network device (such as eth0), enter the following command:


    ```

    ip link set eth0 down

    ```'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# OBJECTIVE 3 SAVE DEVICE SETTINGS TO A CONFIGURATION FILE


    All device configuration changes you make with ip are lost when the system is
    rebooted. To restore the device configuration automatically when the system is
    started, the settings need to be saved in configuration files.


    The configuration files for network devices are located in the directory /etc/sysconfig/network.


    If the network devices are set up with YaST, one configuration file is created
    for every device.


    For Ethernet devices, the filenames consist of ifcfg-eth-id- and the hardware
    address of the device. For a device with the hardware address 30:00:05:4b:98:85,
    the filename would be ifcfg-eth-id-00:30:05:4b:98:85.


    We recommend that you set up a device with YaST first and make changes in the
    configuration file. Setting up a device from scratch is a very complex task, because
    the hardware driver also needs to be configured manually.


    If you have more than one network adapter in your system, it might be difficult
    to find the corresponding configuration file for a device.


    You can use the command ip link show to display the hardware address for each
    Ethernet device. Because the hardware address is part of the file name, you can
    identify the right configuration file.


    The content of the configuration files depends on the configuration of the device.
    To change the configuration file, you need to know how to do the following:


    +   - Configure a Device Statically

    - Configure a Device Dynamically with DHCP

    - Start and Stop Configured Devices


    # Configure a Device Statically


    The content of a configuration file of a statically configured device is similar
    to the following:


    ```

    BOOTPROTO=''static''

    MTU=''

    REMOTE_IPADDR=''

    STARTMODE=''onboot''

    UNIQUE=''oxTw.AkBxsqn01A9''

    nm_name=''bus-pci-0000:02:08.0''

    BROADCAST=''149.44.171.255''

    IPADDR=''10.0.0.2''

    NETMASK=''255.255.255.0''

    NETWORK=''10.0.0.0''

    ```'
  merge: -1
  pgno: 91
- img_proc: true
  md: "# Save Device Settings to a Configuration File\n\nThe configuration file includes\
    \ several lines. Each line has an option and a value assigned to that option,\
    \ and is shown and explained below:\n\n+   - BOOTPROTO='static'\nnThe option BOOTPROTO\
    \ determines the way the device is configured. There are two possible values:\n\
    \  - Static. The device is configured with a static IP address.\n  - DHCP. The\
    \ device is configured automatically with a DHCP server.\n\n+   - MTU=''\nYou\
    \ can use the MTU option to specify a value for the MTU (Maximum Transmission\
    \ Unit). If you don't specify a value, the default value is used. For an Ethernet\
    \ device, the default value is 1500 bytes.\n\n+   - REMOTE_IPADDR=''\nYou need\
    \ to set the value for the REMOTE_IPADDR option only if you are setting up a point-to-point\
    \ connection.\n\n+   - STARTMODE='onboot'\nThe STARTMODE option determines how\
    \ the device is started. The option can include following values:\n  - onboot.\
    \ The device is started at boot time.\n  - manual. The device must be started\
    \ manually.\n  - hotplug. The device is started when it's plugged in if your system\
    \ offers PCI hotplugging.\n\n+   - UNIQUE='oxTw.AkBxsqnOIA9'\n- _nm_name='bus-pci-0000:02:08:0'\n\
    \nThese two lines contain options added by YaST when the device is configured.\
    \ They don't affect the network configuration itself.\n\n+   - BROADCAST='149.44.171.255'\n\
    - IPADDR='10.0.0.2'\n- NETMASK='255.255.255.255'\n- NETWORK='10.0.0.0'\n\nThese\
    \ four lines contain the options for the network address configuration. The options\
    \ have the following meaning:\n  - BROADCAST. The broadcast address of the network.\n\
    \  - IPADDR. The IP address of the device.\n  - NETMASK. The network mask.\n \
    \ - NETWORK. The address of the network interface."
