  md: '# Section 9 Manage Hardware and Component Changes


    This command for example:


    +   - rmmod. This command removes loaded kernel modules.


    rmmod usb-storage


    Only modules that are not needed can be removed. In this example, the USB device
    first has to be disconnected before the usb-storage module can be removed.


    Kernel modules are files that are stored in the directory /lib/modules/kernel-version/.
    Because modules normally work only with the kernel version for which they are
    built, a new directory is created for every kernel update you install.


    Modules are stored in several subdirectories with a filename extension of .ko
    for kernel object. When loading a module with modprobe, you can omit the extension
    and just use the module name.


    # OBJECTIVE 3 DESCRIBE HOW DEVICE DRIVERS ARE LOADED


    If it would be inconvenient to load all kernel modules manually after system start,
    there are several methods to perform this task automatically.


    The following is an overview of how device drivers are loaded in SLES 9:


    +   - initrd. Important device drivers that are necessary to access the root partition
    are loaded from initrd. initrd is a special file that is loaded into memory by
    the boot loader. Examples of such modules are the scsi host controller and file
    system drivers.


    +   - initscripts. Some initscripts are dedicated to loading and setting up hardware
    devices, such as the alsa sound script for sound cards.


    +   - hotplug. hotplug also loads kernel modules.


    +   - X Server. Although the graphics card drivers are not kernel modules, X Server
    loads special drivers to enable hardware 3D support.


    +   - manually. You can always load kernel modules on the command line or in scripts
    with the modprobe command or with the hwup or hwdown commands.


    # OBJECTIVE 4 DESCRIBE THE SYSFS FILE SYSTEM


    In the past it was difficult to determine which interface belonged to which device.
    This changed with kernel version 2.6 when the sysfs file system was introduced.


    sysfs is a virtual file system that is mounted /sys. In a virtual file system,
    there is no physical device that holds the information. Instead, the file system
    is generated virtually by the kernel.'
