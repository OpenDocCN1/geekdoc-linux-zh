    # Process Lists with the for Loop


    The purpose of a for loop is to process a list of elements. It has the following
    syntax:

    for variable in element1 element2 element3

    do commands

    done


    A for loop executes the given commands once for every element on the list, and
    the value of the variable matches one list element with each loop iteration. The
    list itself is often created through command substitution.


    If the for is not accompanied by a list of elements, the loop will be executed
    with the contents of the variables $1, $2, $3, and so on. These elements represent
    the command line parameters that are passed to the script.


    As with similar constructs, a command separator must immediately precede the do
    and done parts of the for loop. This means that a for loop can be entered in two
    different ways:


    ```

    for i in 1 2 3 4 5 6 7 8

    do  ping -cl DA$i

    done

    ```


    In the example above, the command separator is a line break and the loop is started
    only after entering the final done.


    You could use a semicolon as a separator instead. In this case, the same loop
    looks like the following:


    ```

    for i in 1 2 3 4 5 6 7 8; do ping -cl DA$i; done

    ```'
