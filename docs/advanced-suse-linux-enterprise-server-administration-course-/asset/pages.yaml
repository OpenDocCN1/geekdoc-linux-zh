    zone \"digitalairlines.com\" in\n{\n    type slave;\n    file slave/digitalairlines.com.\
    \ zone;\n    masters\n    {\n        10.0.0.254;\n    }\n}\n```\n\nThe slave server\
    \ gets data from the master server with the IP address 10.0.0.254 and stores it\
    \ in the directory /var/lib/named/slave/. This directory is created when you install\
    \ the BIND package.\n\nA similar configuration must be made for reverse resolution,\
    \ as in the following:\n\n```\nzone \"0.0.10.in-addr.arpa\"\n{\n    type slave;\n\
    \    file \"slave/10.0.0.0. zone\";\n    masters\n    {\n        10.0.0.254;\n\
    \    }\n}\n```\n\nIn the simplest configuration, the slave server gets information\
    \ from the master server at regular intervals. This can cause the slave server\
    \ to provide outdated information for a certain length of time.\n\nThis is why\
    \ it is reasonable to instruct the master server to inform the slave servers about\
    \ modifications in the database files. The slave servers then immediately carry\
    \ out a zone transfer, which always brings them up to date.\n\nIn order for the\
    \ master server to be able to communicate with the slave servers, it must know\
    \ about them. By default, the master server automatically informs its slave servers.\
    \ But this can be done in the options section of the file /etc/named.conf, as\
    \ in the following:\n\n```\noptions\n{\n    notify yes;\n}\n```\n\nSubsequently,\
    \ the slave servers must be entered as DNS servers in the database files (of the\
    \ forward and reverse resolution):\n\n| digitalairlines.com. | IN NS | da8.digitalairlines.com.\
