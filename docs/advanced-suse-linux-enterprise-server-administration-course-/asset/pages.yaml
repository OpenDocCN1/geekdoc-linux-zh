  md: '# 402 Glossary


    openssl — Used to generate public/private key pairs.


    Rescue System — A small Linux system that is loaded into memory booting from SLES
    DVD and which may be used to repair a Linux system.


    packet — A unit of information sent on a network using IP.


    resolver — A host that requests name resolution using DNS.


    physical memory — The RAM that is installed on the system.


    reverse resolution — A name resolution request that requests the FQDN for a particular
    IP address.


    ping command — Used to test network connectivity using ICMP.


    Rivest Shamir Adleman (RSA) — A common asymmetric algorithm.


    Pluggable Authentication Modules (PAM) — A set of components that allow programs
    to access user account information.


    rmmod command — Removes a module from the Linux kernel.


    PointIn (PTR) — A DNS record that identifies the FQDN associated with an IP address
    for reverse resolution.


    route — A route in the routing table that lists the packet must take to arrive
    at a destination network or host.


    preprocessor directive — The first line in a C program that identifies the header
    file used before compilation.


    router — A device that is used to relay IP packets from one network to another.


    primary partition — A main division of a hard disk. There are four primary partitions.


    routing table — A table that stored on each host that contains a list of local
    and remote networks and routers.


    private key — A string of data that is typically used to decrypt data that was
    encrypted using the public key.


    rsync (remote synchronization) — Used to copy files and directories to a different
    location on the local computer or to a remote computer across a network.


    public key — A string of data that is typically used to encrypt data.


    Samba — A set of services in Linux that provides the SMB and CIFS protocols for
    file and printer sharing with Windows computers.


    read command — Takes input from a user during script execution and stores it in
    a variable.


    sax2 command — Configures X in SLES.


    read-ahead — A system that reads more data from a disk than needed to speed up
    future read requests.


    schema — The list of objects and object properties for an LDAP database.


    recode command — Used to convert a text file to another Unicode format.


    script language — A programming language whereby instructions are stored in a
    text file that is executed by an interpreter program.


    Red Hat Package Manager (RPM) — The format of most software packages in SLES.
    RPM packages are pre-compiled for use on the system.


    script module — See function.


    Redundant Array of Inexpensive Disks (RAID) — A hard disk implementation that
    spreads data over several disks for improved performance or fault tolerance.


    Secure HyperText Transfer Protocol (HTTPS) — The protocol used to obtain HTML
    Web pages and other content from a Web server using encryption.


    Relative Distinguished Name (RDN) — The simple name of an object in LDAP.'
