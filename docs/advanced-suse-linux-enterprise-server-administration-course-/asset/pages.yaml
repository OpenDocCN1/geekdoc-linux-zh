  md: '# Glossary


    compiler — A programming language whereby instructions are stored in a text file
    that is later compiled into an executable program.


    device — The common name for a system hardware component.


    configure — The script contained in a C source directory that creates system-specific
    options used to compile a particular program. These options are stored in the
    Makefile.


    device agent — A hotplug agent that loads the device driver for a hotplug device.


    dictionary attack — An attempt to gain access to a system account using guessing
    passwords with common dictionary combinations.


    container — An LDAP object used to organize leaves.


    differential backup — A backup of all data on a file system that has been modified
    since the last backup.


    continue command — Used to force a loop structure to continue to the beginning
    of the next loop.


    dig command — Used to perform and test name resolution using a variety of options.


    control structure — A statement in a shell script that alters its operation depending
    on a condition or conditions.


    Direct Memory Access (DMA) — A technology that allows a hardware device to bypass
    the CPU and access physical memory directly to increase performance.


    cron — The system service that executes commands repetitively in the file based
    on information in crontab.


    directives — Options that can be used in Apache configuration files.


    crontab command — Used to schedule user commands to execute repetitively in the
    future.


    Distinguished Name (DN) — A full pathname to an LDAP leaf object.


    cut command — Used to display fields from all lines in a delimited file.


    DNS server — A server that hosts the BIND service and responds to client (resolver)
    queries for name resolution.


    Data Encryption Standard (DES) — The default encryption method used in SLES for
    passwords.


    DocumentRoot — The default location of Web content on a Web server.


    datagram — Packets that typically use the UDP or ICMP protocols.


    domain — The name in DNS that identifies the organization and existence under
    the TLD.


    date command — Displays and sets the system time and date.


    Domain Name System (DNS) — The naming system used on the Internet. Each host is
    identified by a hostname and domain name.


    dd command — Used to copy files to an alternate location using a particular format
    or method.


    driver — A software component used by the operating system to control hardware
    devices as network devices.


    declare command — Declares variables of a certain type for arithmetic operations.


    Dynamic Host Configuration Protocol (DHCP) — A protocol that is used to assign
    IP configuration information to a host on the network.


    default route — The route that is used if no other routes in the routing table
    match the desired destination.


    dependencies — Software packages or components that must be installed prior to
    the installation of a certain software package.


    echo command — Prints text to the terminal screen.


    egrep command — A version of the grep command that supports extended expression
    patterns.'
