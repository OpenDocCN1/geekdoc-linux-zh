- img_proc: true
  md: '**account.** These modules perform nonauthentication based account management.


    It is typically used to restrict or permit access to a service based on the time
    of day, currently available system resources (maximum number of users), or perhaps
    the location of the applicant user (for example, to limit ''root'' login to the
    console).


    **session.** These modules are associated with performing tasks that need to be
    done for the user before she can be given access to a service or after a service
    is provided to her.


    Such things include logging information concerning mounting directories and the
    opening and closing of some data exchange with another user.


    **password.** This last module is required for updating the authentication associated
    with the user. Typically, there is one module for each challenge/response-authentication
    (auth) module type.


    Some PAM modules (such as pam_unix.so) can be used for different module types
    listed below:


    **control-flag.** The control-flag indicates how PAM will react to the success
    or failure of the module with which it is associated.


    Since modules can be stacked (modules of the same type execute in a series, one
    after another), the control-flags determine the relative importance of each module.


    The Linux-PAM library interprets these keywords in the following manner:


    **required.** This indicates that the success of the module is required for the
    module-type facility to succeed. Failure of this module is not apparent to the
    user until all of the remaining modules (of the same module-type) have executed.


    **requisite.** Like required, in the case that such a module returns a failure,
    control is directly returned to the application. The return value is associated
    with the first or requisite module to fail.


    **sufficient.** The success of this module is deemed “sufficient” to satisfy the
    Linux-PAM library that this module-type succeeded in its purpose.


    If no previous required module has failed, no more “stacked” modules of this type
    are invoked. Even if this module type fails, the application can be satisfied
    that the module type has succeeded.


    **optional.** As name suggests, this control-flag marks the module as not critical
    to the success or failure of the user’s application for service.


    **module-path.** The pathname to the module itself. If the first character of
    the module path is /, it is assumed to be a complete path. If this is not the
    case, the given module path is appended to the default module path /lib/security.'
