  md: '# How to Configure a File Server with User Authentication


    If the share requires authentication, you can supply a username and password,
    as in the following:


    ```

    mount -t smbfs -o username=tux,password=novell

    //Fileserver/data/mnt

    ```


    In the previous example, the Samba share is accessible without supplying a user
    name and password. In most cases, this type of accessibility is not recommended.


    The following shows you how to configure Samba to require authentication with
    a user name and password:


    +   * Prepare the Server for User Authentication

    * Configure a Share That is Accessible to Only One User

    * Configure a Shared Access for a Group of Home Users

    * Configure the Export of Home Directories


    # Prepare the Server for User Authentication


    The first task is to change the security option in the smb.conf file to the following:


    ```

    security = user

    ```


    The value user for the option security forces user authentication when the client
    attempts to connect to the server.


    In the following examples, the configuration is based on User Level Security.
    In this security level, the Windows-compatible encrypted password file is stored
    in the /etc/samba/smbpasswd (by default).


    Users who want to access SMB shares must first be created as Linux users. Then
    an SMB password needs to be set using the smbpasswd tool.


    The following example sets an SMB password for the user tux:


    ```

    smbpasswd -a tux

    ```


    smbpasswd prompts you to enter the password twice and confirms the setting of
    the password by displaying the following message:


    ```

    New SMB password: novel

    Reenter sm password: novel

    Added user tux

    ```


    If smbpasswd is called without any parameters, the current user can change his
    SMB password. If smbpasswd is called with the -x option followed by a user name,
    that user is deleted from the smbpasswd file.'
