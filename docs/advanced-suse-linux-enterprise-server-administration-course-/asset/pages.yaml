  md: '+   Shell scripts start with a shebang that denotes the shell that is called
    to run the commands within the shell script.


    +   User input may be obtained using the read command and is stored in a variable
    that may be used throughout the shell script. Additionally, you may use the echo
    command to send output to the terminal screen.


    +   Backticks are used to perform command substitution within other commands.


    +   Arithmetic operations may be performed using the expr, declare, and let commands
    as well as using parentheses and brackets.


    +   The value of a variable may be modified using a variable substitution operator.


    +   The flow of a program may be modified using one of several control structures.
    There are two types of control structures: decision structures and loop structures.


    +   The if decision structure can perform certain actions if a command returns
    a successful exit status or a certain condition is met.


    +   The case decision structure can perform one of several different actions depending
    on the outcome of some event or value of some variable.


    +   The while loop structure performs commands repetitively while a certain condition
    is met. Alternatively, the until loop structure performs commands repetitively
    until a certain condition is met.


    +   The for loop structure can be used to execute commands repetitively for a
    series of elements.


    +   The continue and break commands may be used to modify the execution of a loop
    structure by proceeding to the next loop or exiting the loop, respectively.


    +   The && operator processes the command on the right if the command on the left
    is successful. The || operator processes the command on the right if the command
    on the left is unsuccessful.


    +   You can create reusable subroutines within shell scripts called functions.
    You may create a function using the function command or by using the function
    () syntax.


    +   The getopts command may be used within a shell script to obtain the options
    specified on the command line when the shell script is executed.


    +   The most Linux commands used within a shell script include cat, cut, date,
    echo, grep, egrep, sed, test, and tr.


    # KEY Terms


    && operator — Processes the commands on the right hand side if the commands on

    left hand side return a true (successful) exit status.


    /bin/bash — The BASH shell executable program.'
