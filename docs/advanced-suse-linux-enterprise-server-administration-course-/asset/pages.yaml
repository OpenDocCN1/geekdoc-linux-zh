  md: '# Configuring a Samba Domain Controller


    On the Internet, research the steps required to use your Samba server as a Windows
    domain controller. Next, log into tty1 as the root user and configure your Samba
    service as a domain controller by editing your /etc/samba/smb.conf file. The minimum
    lines required in this file are:


    ```

    [global]

    domain logons = yes

    security = user

    encrypt passwords = yes

    wins support = yes

    netbios name = =

    workgroup = (put your domain name here)

    ```


    ```

    [netlogon]

    path=/netlogon (create this directory with permissions 777)

    public = no

    writable = no

    locking = no

    ```


    Next, create a new user on the system (useradd — m testuser) and give them an
    encrypted password in the samba database (smbpasswd testuser). Following this,
    add computer accounts for each Windows XP computer that will be joining the domain
    on your Linux computer by adding a line to /etc/passwd and /etc/shadow that lists
    the computer-name followed by a $ character as shown below:


    /etc/passwd sample line:

    clientusername:x:5000:5000::/dev/null:/bin/false


    /etc/shadow sample line:

    clientusername:*:6445::::


    When finished, test your configuration by joining a Windows client to the domain
    and testing domain. Log out of tty1 on your Samba server when finished.


