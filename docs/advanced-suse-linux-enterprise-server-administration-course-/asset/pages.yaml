    - pci. This is used for pci devices.


    The environment variables provided for a hotplug event depend on the event type.

    Basically, the environment variables provide the action of the event (such as
    add when a

    device has been added or remove when a device has been removed) and additional

    information about the affected device.


    Depending on the event type, the hotplug script starts the hotplug agents.

    There are two basic types of hotplug agents:


    +   - Device agents. These agents are responsible for loading kernel modules and

    calling additional commands to set up a device. To find the correct kernel module,

    they first call the hwup script, which looks for a configuration file of the

    corresponding device.

    - Interface agents. When the kernel module loads, it usually registers an interface

    for the device. The registration of the interface also triggers a hotplug event,

    might be handled by an interface agent.


    In SLES 9, an interface agent is used to set up network interfaces. Instead of
    calling

    hwup, the interface agent uses the ifup command, which reads the corresponding

    interface configuration file.


    The hotplug agents are located in the directory /etc/hotplug/

    It might not be possible to start some devices with the hwup script, because no
    configura-

    tion file can be found.


    In this case, the agents have routines to find and load the correct driver module
    automatically

