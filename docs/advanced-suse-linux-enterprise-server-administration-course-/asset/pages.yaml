    # How to Use Command Substitution


    The term command substitution basically means that the output of a command is
    used in a shell command line or a shell script.


    In the following example, the output of the command date is used to generate the
    output of the current date:


    ```

    #!/bin/bash


    echo "Today is `date +%m/%d/%Y`"

    ```


    An important thing to remember is the command date +%m/%d/%Y is included in backticks
    (` ... ).


    Instead of printing the output of a command to the screen with echo, it can also
    be assigned to a variable, as in the following:


    ```

    #!/bin/bash


    TODAY=`date +%m/%d/%Y`

    echo "Today is $TODAY"

    ```


    In this case, the output of date is assigned to the variable TODAY, and then TODAY
    is printed to the screen with echo. Make sure that there are no spaces before
    or after the equal sign.'
