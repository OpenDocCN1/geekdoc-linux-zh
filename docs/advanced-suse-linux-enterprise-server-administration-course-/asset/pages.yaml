    # How to Use Arithmetic Operations


    Shell scripts often use values assigned to variables for calculation. There are
    several ways to implement this.


    The Bourne shell is limited in this regard, but it can perform such operations
    by relying on external commands (such as expr).


    The Bash shell comes with built-in support for arithmetic operations, but there
    are some limitations to this as well. Specifically, the arithmetic capabilities
    of Bash are limited in the following ways:


    +   - Only operations with whole numbers (integers) can be performed.

    - All values are signed 64-bit values. Thus, possible values range from -2^63
    to +2^63-1.


    So even when using Bash, you might need to use external commands, such as bc for
    floating-point calculations.


    The following paragraphs list all the possible methods and formats for arithmetic
    operations. All of them use this sample operation:


    ```

    A=B+10

    ```


    +   - Use the external command expr (Bourne shell compatible)

    A=`expr` $B + 10`


    Since an external command is used, this method will also work with the Bourne
    shell. Scripts using external commands will always perform slower than those relying
    on built-in commands.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '+   Use the Bash built-in command let

    let A=$B + 10

    In Bash, you can use the let command to perform an arithmetic expression.


    +   Use arithmetic expressions inside parentheses or brackets (two different formats)

    A=$((B + 10))

    or

    A=$[B + 10]

    Arithmetic expressions can be enclosed in double parentheses or in brackets for
    expansion by Bash. Both $((..)) and $[..] are possible, but the latter is considered
    deprecated and should be avoided.


    +   Use the built-in command declare

    declare -i A

    declare -i B

    A=B+10


    This declares a variable as an integer.

    If all the variables involved in a calculation have previously been declared as
    integers through declare -i, arithmetic evaluation of these variables happens
    automatically when a value is assigned to them.


    This means that the variable B, for example, does not have to be prefixed with
    the $ to be evaluated.


    With the expr command, only the following five operators are available: +, -,
    *, /, and

    %. Additional operators (which are identical to those of the C programming language)
    can be used with all of the above Bash formats.


    For a complete list, consult the man page for bash.


    ![](img/501a26f547021936f65b9bd40bb47394_289_0.png)


    It makes sense to limit yourself to one of the described possibilities. As far
    as Bash is concerned, a good choice might be to only use the declare command,
    since it makes the best use of the available features.'
