  md: '# Objective 6 USE THE HWUP COMMAND


    The command hwup is used by the hotplug agent to start preconfigured devices.
    In this objective, you learn how to use this command and how to interpret the
    corresponding configuration files.


    hwup reads the device configurations from files in the directory /etc/sysconfig/hardware/.


    In order to determine the correct configuration file, the configuration filenames
    follow a specific naming scheme.


    The following is the filename for a PCI network adapter:


    ```

    hwcfg-bus-pci-0000:02:08.0

    ```


    The filename consists of the following four elements separated by hyphens:


    +   * hwcfg. This is the beginning of every device configuration file.

    * bus. This determines that the device is identified by the bus to which it is
    connected.

    * pci. This indicates that the device is connected to the PCI bus.

    * 0000:02:08.0. This is the address of the device in the PCI bus.


    You can display the PCI address of a device with the spci command, in the following:


    ```

    0000:02:08.0 Ethernet controller: Intel Corp. 82801BD

    PRO/100 VE (LOM) Ethernet Controller (rev 81)

    ```


    Other device types might use different elements in their configuration filename.
    For more information about the naming scheme, see the manpage of getcfg (man getcfg).


    Table 9-1 lists the possible variables in a device configuration file.


    | Variable | Description |

    |---|---|

    | STARTMODE | This determines when and how a device will be started:

    | **auto.** The device is automatically started at boot time or by hotplug when
    connected to the system.

    | **manual.** The device *should not* be started automatically, but it *can* be
    started manually.

    | **off.** The device should never be started. |'
  merge: -1
  pgno: 390
- img_proc: true
  md: '| Table 9-1 (continued) |

    | Variable | Description |

    | MODULE | The value of this variable determines the name of the kernel module
    that should be loaded for the device. If multiple modules have to be loaded, you
    can use this variable multiple times with a suffix appended. You must then use
    the same suffixes for multiple MODULE_OPTIONS variables. |

    | MODULE_OPTIONS | With this variable, options can be passed to the kernel module.
    |

    | SCRIPT(UP,DOWN)_[type] | This specifies the script to be called for initialization
    and deconfiguration of a specific device type. |

    | SCRIPT(UP,DOWN) | This script is called if the type of the device to be initialized
    matches the type given in this parameter. This specifies the script to be called
    for initialization and deconfiguration of the device. It will be called only if
    no matching type-specific scripts are configured. |


    The following is an example of a configuration file for a network adapter:


    ```

    MODULE=''e100''

    MODULE_OPTIONS=''''

    STARTMODE=''auto''

    ```


    When the module e100 is loaded, there are no options for this module and the device
    is started automatically at boot time.


    The hwup command is usually called by hotplug agents, but you can also use it
    manually. For example, the hwup command starts the network card shown in the previous:


    hwup bus-pci-0000:02:08.0


    The last three elements of the configuration filename specify the device.

    You can use the command hwdown to deconfigure devices, as in the following:

    hwdown bus-pci-0000:02:08.0'
