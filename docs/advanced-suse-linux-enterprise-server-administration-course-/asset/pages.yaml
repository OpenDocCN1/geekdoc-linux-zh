    # Creating a Performance Baseline


    To aid in troubleshooting performance problems, it is good form to monitor your
    SLES system at various times of the day during normal performance; when a performance
    baseline occurs, you can compare the performance baseline to the monitoring data
    you collect following the performance baseline. The statistics that are most different
    will give you more insight into the source of the problem. Use the commands in
