  md: '# Enterprise Volume Management System (EVMS)


    A hard disk partitioning scheme similar to LVM may be used to create resilient
    partitions that may span multiple hard disks.


    entry — A reference to an LDAP object.


    Ethernet — The standard method used to access network media today. Most network
    adapters on users use Ethernet.


    exit code — See exit status.


    exit status — An integer value returned by a program that indicates whether the
    program completed fully or unsuccessfully (0–255).


    export command — Used to create and environment variables.


    expr command — Performs integer arithmetic operations.


    extended partition — A primary partition that can contain partitions.


    external command — A command that is represented by an executable file in the
    file system.


    find command — Used to find files on the file system using various criteria.


    for — A loop structure that processes a set of elements using the same commands
    until all elements have been processed.


    forward resolution — A name resolution request that desires the IP address for
    a particular FQDN.


    forward server — A DNS server that forwards any queries it cannot resolve to another
    DNS server on the network.


    free — Displays physical and swap memory usage.


    full backup — A backup of all data on the file system.


    Fully Qualified Domain Name (FQDN) — A complete name that identifies a host in
    DNS. It consists of a hostname (or computer name) followed by subdomain/domain
    names and a TLD (e.g., www.west.africa.com).


    function command — Used to create shell functions.


    gateway — See router.


    gcc command — The GNU Compiler program.


    getfac command — Used to view the ACL on a file or directory.


    getops command — Used during shell execution to obtain the options entered on
    the command line when the shell script executed.


    GNU Tool Build — A series of software components that may be used to compile C
    programs in SLES.


    GQ — A graphical LDAP database browser.


    Grand Unified Boot Loader (GRUB) — The default boot manager in SLES.


    grep command — Used to display lines of a file that match a regular expression
    pattern.


    grub5-crypt command — Used to generate an encrypted password for use in the GRUB
    configuration.


    gzip command — Used to compress files on Linux systems.


    hard mirroring — A RAID implementation that writes all data to two hard disks
    for fault tolerance.


    Hardware RAID — A RAID implementation that is managed by the hard disk controller
    hardware.


    hdparam command — Used to view and change settings for IDE disks.


    header file — A file that contains function declarations for shared libraries.
    To use a shared library in a program, you must refer to the header file during
    compilation.


    host — A command that can communicate on a network.


    host command — Used to perform and test resolution.


    hotplug — A hardware and software feature that allows hardware devices to be plugged
    in and used while the computer is powered on.


    hotplug agent — A software component that loads the driver and registers the interface
    for a hotplug device.


    htpasswd command — Used to generate Apache passwords for user authentication.'
