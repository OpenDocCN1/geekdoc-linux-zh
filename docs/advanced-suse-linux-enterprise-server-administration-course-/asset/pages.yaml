  pgno: 314
- img_proc: true
  md: 'A complete list of all special characters handled by tr is included in the
    man page of the program.


    The following is the standard syntax of tr:


    ```

    tr set1 set2

    ```


    The characters included in set1 are replaced with the characters included in set2.


    The following is an example of using the tr command:


    ```

    cat text-file | tr a-z A-Z

    ```


    This command causes lowercase characters in a file to be changed to uppercase,
    and the result is printed to stdout.


    You can use tr to delete characters from the first set by entering the following:


    ```

    tr -d set1

    ```


    This will not translate anything; it only deletes the ones included in set1, printing
    the rest to standard output.


    The following is another example of using the tr command:


    ```

    VAR=''echo $VAR | tr -d %''

    ```


    In this example, tr deletes the percent sign from the original value ofVAR and
    the result is assigned to the same variable.


    By entering a command like


    ```

    tr -s set1 char

    ```


    you can also use tr to replace a set of characters with a single character.


