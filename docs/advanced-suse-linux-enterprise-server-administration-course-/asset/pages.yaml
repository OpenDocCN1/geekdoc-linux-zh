- img_proc: true
  md: 'In this example, it is not necessary to make the script executable. On SLES
    9, /bin/sh is a link to /bin/bash. It doesn''t really matter whether you call
    the script with sh script.sh or bash script.sh.


    Another important point is that the directory where the script is located must
    actually be in the user''s search path for executables. Then you can add this
    to the user''s search path by adding a line such as the following to your ~.bashrc:


    ```

    export PATH=$PATH:~/bin

    ```


    Otherwise, shell scripts must be started with the full pathname.


    When naming script files, it is a good idea to add an .sh extension to the filename.
    This ensures that the file is easily recognized as a shell script.


    If you do not add the suffix, you need to make sure the filename is not identical
    to existing commands. For example, a common mistake is to name a script test.


    The basic structure of a shell script can be illustrated with a simple program
    that does nothing but print the message "Hello world."


    Figure 6-2 is the flow chart for the script.


    ![](img/501a26f547021936f65b9bd40bb47394_282_0.png)


    Figure 6-2


    The script consists of three elements:


    +   - The program start


    +   - The action to print out "Hello world",


    +   - The program stop'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'Figure 6-3 illustrates the three elements with the corresponding script code
    on the right.


    | start | #!/bin/bash |

    | --- | This script ... |

    | output: hello world | echo "Hello world!" |

    | stop | exit 0 |


    Figure 6-3


    Before looking closer at each of the three elements, you need to understand that
    the general rules for creating shell scripts, as explained in this section, can
    be applied to any conceivable script.


    The following describes the three elements of the script:


    +   * **Start.** The first line of any shell script must be the shebang as ##!/bin/bash).
    This line specifies the script program to be called to execute the script. As
    with any other program, a subshell is started to run the script.


    +   * The script''s start section should also include a comment describing what
    the script does. A comment is introduced with a # character in shell scripts.


    +   * It is also a good idea to include the name of the author, the date, and
    the version number of the script. Also, any variables and functions used in the
    script should be defined at the top of the script.


    +   * **Commands.** The sample script above includes the echo command as the only
    executed (to print the “Hello world” greeting). Shell scripts in general rely
    on the echo command as the most common solution to display information on the
    screen.


    +   * **Stop.** Before the script ends, it might be necessary to do some cleanup.
    For example, you might want to remove any temporary files created by the script.


    As the very last step, you should define the script''s exit status with an exit
    value. This informs the parent process how the script was terminated. The exit
    status returned by the script can be queried afterward with echo $.


    Every script that you write should use this basic structure.'
