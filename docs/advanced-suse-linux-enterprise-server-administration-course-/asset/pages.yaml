  md: '# Glossary 403


    Secure Sockets Layer (SSL) — A technology that uses public and private keys to
    encrypt Web content as it is being between a Server and Web browser.


    shell built-in command — A command that is part of the shell executable (i.e.
    /bin/bash).


    security concept — A comprehensive security plan for an organization.


    shell function — A reusable set of commands within a shell script that may be
    executed by name.


    security policy — The security requirements, policies, and procedures used by
    an organization.


    shell script — A text file that contains Linux commands that may be executed by
    a Linux shell.


    sed command — Used to edit text files using a search and replace syntax.


    slapppasswd command — Used to generate an encrypted password that may be used
    in the OpenLDAP configuration.


    Server Level Security — A Samba security level that requires a valid login to
    server order to access a shared directory.


    slave server — A DNS server that contains a read-only copy of the zone database
    obtained from a master server via a zone transfer.


    Server Message Block (SMB) — A file and printer protocol used by Windows systems.


    smblient command — Used to view and access Windows and Samba file printers.


    Set Group (SGID) — A special permission on executable files and directories. When
    you run an executable program with the SGID permission set, you become the group
    owner of the executable file for the duration of the program. On a directory,
    SGID sets the group that attached to newly created files.


    smbd — The Samba daemon.


    smbpasswd command — Sets a Windows-formatted password for Linux user accounts.


    Set User ID (SUID) — A special permission on executable files. When you run an
    executable program with the SUID permission set, you become the owner of the executable
    file while the program is running.


    Software RAID — A RAID implementation that is managed by operating system software.


    setfacl command — Used to set the ACL on a file or directory.


    Start Of Authority (SOA) — A DNS record that identifies zone-specific information
    and zone transfer.


    Sticky bit — A special permission on directories that prevents removing files
    that they do not own.


    sh command — Used to execute shell scripts that have read permission for the current
    user.


    Share Level Security — A Samba security level that requires a password in order
    to access a shared directory.


    subdomain — The name in DNS that identifies a division of organization and which
    exists under the domain and T.


    shared library — A file on a hard disk that contains functions. Shared libraries
    are loaded into memory during program execution.


    subroutine — See shell function.


    shares — Shared directories or printers on a Windows or Samba computer.


    swap memory — Space on the swap partition used by applications when physical memory
    is unavailable.


    shebang — The first line of a script that starts with #! and denotes the shell
    used to interpret the commands within the shell script.


    sysctl command — Used to view and see kernel configuration parameters.


    sysfs — The system file system. It is a virtual file system used by the /sys directory.


    system load — An overall measurement of the number and throughput of processes
    on a system.'
