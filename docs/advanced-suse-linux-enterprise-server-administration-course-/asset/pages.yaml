  md: '# Key Terms 307


    || operator — Processes the commands on the right hand side if the commands on
    the left hand side return a false (unsuccessful) exit status.


    << (here) operator — Used to read data from a file listed on the right of the
    operator, and send it to a command listed to the left of the operator.


    argument — A parameter that may be used to pass information to a function when
    it is executed.


    backtick ('') character — Used to denote an executable command within another
    command string for substitution.


    break command — Used to force a loop control structure to exit and resume on the
    next line following the loop control structure in a shell script.


    case — A decision control structure that may be used to execute one of several
    different sets of commands depending on the value of a variable.


    cat command — Used to display the contents of files.


    command substitution — The processing of executable commands within other executable
    commands.


    continue command — Used to force a loop control structure to continue to the beginning
    of the next loop.


    control structure — A statement in a shell script that alters its operation depending
    on a certain condition or conditions.


    cut command — Used to display certain fields from all lines in a delimited file.


    date command — Displays sets the system time and date.


    declare command — Declares variables of a certain type for use in arithmetic operations.


    echo command — Prints text to the terminal screen.


    egrep command — A version of the grep command that supports extended expression
    patterns.


    exit code — See exit status.


    exit status — An integer value returned by a program that indicates whether the
    program completed successfully (0) or unsuccessfully (1-255).


    export command — Used to create and export environment variables.


    expr command — Performs integer operations.


    external command — A command that is represented by an executable file in the
    file system.


    for — A loop control structure that processes a set of elements using the same
    commands until all elements have been processed.


    function command — Used to create shell functions.


    getops command — Used during shell script execution to obtain the options entered
    when the command line was executed.


    grep command — Used to display lines of a file that match a certain regular expression
    pattern.


    if — A decision control structure that executes certain commands if a condition
    returns true.


    let command — Performs integer arithmetic operations.'
