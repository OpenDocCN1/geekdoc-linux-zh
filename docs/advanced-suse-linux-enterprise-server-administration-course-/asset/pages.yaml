- img_proc: true
  md: '# Glossary


    tar (tape archive) command — Used to create and extract archives. Tar archives
    are commonly used to store source code that is distributed on the Internet.


    User Level Security — A Samba share level that requires a Linux login order to
    access a shared directory.


    test command — Used to create a condition that returns a true (successful) or
    false (unsuccessful) exit.


    user space driver — A program that runs in user space and functions as a device
    driver.


    testpar command — Checks the syntax of /etc/samba/smb.conf.


    variable — A value stored in memory and used by the Linux shell.


    Time To Live (TTL) — A number used to represent the useful life of an IP packet.
    Each router decrements the TTL of packets to forwards others. When the TTL of
    a packet reaches 0 it is discarded.


    variable substitution operators — Used to modify the contents of a shell.


    top command — Displays the system load as the processes that use CPU memory and
    time.


    virtual host — An additional Web site that is hosted by a Web server.


    Top Level Domain (TLD) — The first level of names under the root domain.


    vmstat command — Displays memory, process, swap, CPU, and I/O statistics.


    tr command — Used to substitute or delete characters from strings of data.


    Web browser — A program that can obtain content from a Web server.


    traceroute — Used to identify the route an IP packet takes to a remote host.


    Web server — A service that provides Web content to clients that have a browser.


    Traffic-vis — A software utility that may be used to monitor the performance of
    network interfaces on individual hosts.


    while — A loop structure that executes a series of commands repeatedly until a
    certain condition returns a true (successful) exit status.


    workgroup — A name that identifies a group of computers in a Windows network that
    are not part of a domain.


    umask — A special variable used to set permissions on newly created files and
    directories.


    YaST — The main system configuration interface in SUSE Linux. It is also used
    to perform the SUSE Linux installation.YaST stands for Yet Setup.


    umask command — Used to set the umask variable.


    Universal Naming Convention (UNC) — A format used to specify a shared resource
    on a Windows or Samba computer (e.g., \server\share).


    YaST Online Update (YOU) — A YaST module that may be used to obtain patches for
    SLES from Web servers.


    until — A loop structure that executes a series of commands repeatedly until a
    certain condition returns a true (successful) exit status.


    zone — A specific domain in DNS represented by a file that contains the records
    used for name resolution.


    uptime command — Displays the system has been active as well as the system load.


    zone transfer — The process whereby a master DNS server sends zone information
    to a slave DNS server.


    User Data Protocol (UDP) — A part of the TCP/IP protocol suite that provides fast
    but unreliable communication between hosts on a network.'
