  md: '+   lo. The loopback device, which is available on every Linux system, even
    when no network adapter is installed. Using this virtual device, applications
    on the same machine can use the network to communicate with each other.


    For example, you can use the IP address of the loopback device to access a locally
    installed web server by typing http://127...0.1 in the address bar of your browser.


    +   eth0. The first Ethernet adapter of the computer this is a physical device
    which is connected to the local network. Ethernet devices are normally called
    eth0, eth1, eth2, and so on.


    +   sit0. This is a special virtual device that can be used to encapsulate IPv4
    into IPv6 packets. It''s not used in a normal IPv4 network.


    You always have the entries for the loopback and sit devices. Depending on your
    hardware setup, you might have more Ethernet devices in the ip output.


    Several lines of information are displayed for every network device, such as eth0
    for the example above:


    ```

    2: eth0: <BROADCAST,MULTICAST,NOILERS,UP> mtu 1500

    discisc pfifo_fast qlen 1000

    ```


    The most important information of the line in this example is the device index
    (2) and the device name (eth0).


    The other information shows additional attributes set for this device, such as
    the hardware address of the Ethernet adapter (00:30:05:4b:98:ff:ff:ff:ff:ff)


    ```

    link/ether 00:30:05:4b:98 brd ff:ff:ff:ff:ff

    ```


    In the following line, the IPv4 setup of the device is displayed:


    ```

    inet 10.0.0.2/24 brd 10.0.0.255 scope global eth0

    ```


    The IP address (10.0.0.2) follows inet, and the broadcast address (10.0.0.255)
    after brd. The length of the network mask is displayed after the IP address, separated
    by a /. The length is displayed in bits (24).


    The following lines show the IPv6 configuration of the device:


    ```

    inet6 fe80::230:5ff:fe4b:9885/64 scope link

    valid_lft forever preferred_lft forever

    ```


    The address shown here is automatically assigned, even though IPv6 is not used
    in the network that is connected with the device. The address is generated from
    the hardware address of the device.


    Depending on the device type, the information can differ. However, the most important
    information (such as assigned IP addresses) is always shown.'
