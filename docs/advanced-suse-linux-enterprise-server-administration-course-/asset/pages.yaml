    (account information is stored in the files /etc/passwd and /etc/shadow):


    +   **User Data.** Enter the full user name, the login name, and the password.


    +   To provide effective security, a password should be 5-8 characters long. The
    maximum length for a password is 128 characters. However, if no special security
    modules are loaded, only the first eight characters are used to discern the password.


    +   Passwords are case-sensitive. Special characters are allowed, but they might
    be hard to enter depending on the keyboard layout. Other special characters (such
    as 7-bit ASCII) and numbers 0-9 are allowed.


    +   **Password Settings.** Select this option to change advanced password settings
    (such as password expiration). The default settings are suitable in most cases.


    +   **Details.** Select this option to edit details of the user account. The default
    settings are suitable in most cases.


