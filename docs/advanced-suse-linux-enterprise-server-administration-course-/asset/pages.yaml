  md: '# Section 7 Compile Software from Source


    Figure 7-2 illustrates how shared libraries work.


    ![](img/501a26f547021936f65b9bd40bb47394_339_0.png)


    Figure 7-2


    Normally, a shared library has two basic parts:


    +   - The shared library file itself, which is loaded when a program requires
    a function of the corresponding library. The filenames for these files end in
    .so (shared object)


    +   - The header files of the library, which contain the functions declaration
    of the library. The filenames of these files end in .h (header file).


    As described at the beginning of this section, the C programming language requires
    that every function used in a program has to be declared.


    This means that the header files of a library need to be installed on a system
    to compile software that uses functions of that library. To run already compiled
    software, only the shared library files are necessary.


    Because the software that ships with SLES 9 is already compiled, the header files
    of some libraries are not installed by default. These libraries are split into
    two packages: the software packages that contain the header files have the extension
    -devel attached to the package name.


    For example, the package libpng contains the shared library, and the package libpng-devel
    contains the corresponding header files.


    When you run the configure script, it sometimes prompts you about missing libraries
    that should be installed on the system. If you install the required packages with
    YaST, you have to make sure that you select both the shared library and the corresponding
    devel package.'
  merge: -1
