  md: '# Linux Format 2022


    # Orchestrating with Xen


    Set up a machine dedicated to hosting VMs with yet another high-powered hypervisor,
    XCP-ng.


    the distinction between Type 1 hypervisors (being minimal OSes designed only to
    host metal) and Type 2 (which run VMs inside a regular operating system) can get
    a little muddy. KVM, which virtualization programs like QEMU use, might appear
    to be categorically of the second type. But that''s not really correct. The KVM
    module actually transforms the whole Linux kernel into a ''bare metal'' hypervisor
    and allows you to load in a VM alongside the rest of your OS. Your userspace not


    and a single control plane dom0 exists for administering them. This is still a
    very privileged one. Domains are more isolated than they would be in a Type 2
    situation.

    XCP-ng is a next-generation Type 1 hypervisor based on XenServer (which now Citrix
    Hypervisor). It is open source and makes easy to host a crowd of VMs. XCP-ng is
    widely used to support up to STB of RAM and up to 280 or 66 cores. If you have
    a powerful server with 16GB of RAM it can happily host half a dozen-behave VMs.


    # XCP-NG IN NUTSHELL


    "XCP-ng is a next-generation Type 1 hypervisor, based on XenServer. Its open source
    and makes easy work of hosting a crowd of VMs."


    ![](img/30dd1f03e281db741ecfce8d69849415_83_0.png)


    become transformed into a VM (and is indeed untouched by the process), but it
    does add some convenient abstractions (networking and such) so that you can talk
    to them. Hyper-V does make the thing in Windows.

    Still, it natural to suppose if you want to have a machine dedicated to hosting
    VMs, then it''s getting to grips with a hypervisor that is more the Type 1 of
    the spectrum. XenServer is an off-client example. Here VMs are referred to as
    dom0,


    ![](img/30dd1f03e281db741ecfce8d69849415_83_1.png)


