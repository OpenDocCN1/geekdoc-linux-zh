    # # Import and convert images to 3D models


    *Taking inspiration from images that lasted outside of Blender, Michael Reed**
    helps you turn them into shiny 3D objects.*


    We''re going to look at a couple of ways of taking externally sourced images and
    turning them into 3D objects using a rough sketch as our starting point. Then
    using vector drawing Inkscape (inkscape.org), we''ll convert this into a set of
    curves and lines before importing it into Blender. From here, we can convert this
    flat shape into a solid 3D object. Most importantly we can make it shiny! (now
    interested - Ed)

    Secondly, we''ll look at working from a reference photo to draw an outline of
    a real-world object. use a lathe-like technique to turn this into a solid 3D shape
    to we can verify that it holds. From there, it''s a cinch to add a texture to
    it, and give it a realistic-looking finish.


    ![](img/30dd1f03e281db741ecfce8d69849415_151_0.png)


