    # SENSORS AND

    SENSIBILITY


    Recalling a past life where we gazed on dials and Galilean thermometers,

    Jonni Bidwell assesses Linux''s system monitoring offerings.


    e don''t think that governments or tech giants have good reason to court our lives.
    But we do think it''s well within our remit to monitor all minutia of your Linux
    machine.

    CPU load, speeds, temperatures, traffic and data sources are some of the things
    you can keep an eye on. And when it''s presented in delightful graph form it''s
    a pleasure to do.

    There''s good reason to keep an eye on this data. If it could be because it''s
    run out of memory, or because a task is hogging the CPU, or from a graphical system
    monitor. The culprit could be overheating, which you could check by probing the
    heatsinks on your


    CPU and graphics card, but we don''t recommend that. Instead, we''ll show you
    how to read thermal information from the command line and even while you''re playing
    your favourite GPU-intensive shooting game and then graph it with Gnuplot.

    Modern graphics cards have all kinds of sensors on them and Windows users have
    long enjoyed GUI applications to monitor and medley with frequencies. The open
    source AMD driver avoids''s System Management Interface (SMI) enables users of
    hardware to do so from the command line. For AMD there''s rade-gpu which can monitor
    everything in real time. Not only can you use it to fine-tune your GPU settings
    for maximum performance or optimal efficiency.


