    ![](img/30dd1f03e281db741ecfce8d69849415_101_0.png)


    Ksenya Fedorov is a document specialist from OnlyOffice. She spends all day documenting
    and all night dreaming about them.


    owadays, many users are concerned about the safety of their data, especially when
    it comes to document editing which is essential part of our everyday working routines.
    It''s important to know how to protect your documents, and boost data security
    measures. In one of my previous articles (see LX27) we discussed how to collaborate
    on documents were fully encrypted with OnlyOffice''s Private Room features.


    Digital signatures are commonly used to verify the authenticity and integrity
    of official documents, such as contracts, invoices, orders, and reports. Signatures
    verify that content no alterations have been made to its contents. If a digital
    signature is added, the document cannot be edited if it has been changed then
    the signature becomes invalid.


    ![](img/30dd1f03e281db741ecfce8d69849415_101_1.png)


    Selecting a digital certificate in OnlyOffice.


    To sign a document, you need a signing certificate by a Certificate Authority.
    Certificates provide a public key which is used to validate the authenticity of
    digital signatures.


    A private key is used to sign the document. Only the owner of the certificate
    can access such key. A public key is used by the recipient of the document – this
    validates the authenticity of the


    Filling in the ''Purpose'' for signing this document'' field.


    signature added by the certificate owner signed the document. To create a digital
    signature, create a new file or open the existing one with OnlyOffice Editors.
    Switch to the Protection tab, click the arrow next to the Signature button and
    then select the Add digital signature.


    In the opened window, fill in the purpose for signing the document. Then select
    a digital certificate and key files, then clicking OK in the signature window.


    Once done, your document is signed and protected from editing. This signature
    is not visible in the text, but you can find details and settings on the right-side
    window, including the certificate details, date and time of the signature, as
    well as options to remove or add another one.


    If someone makes alterations in the signed document, an error message appears
    saying that the file is protected. Deleting any will remove the signature, so
    you will know that the content was modified intentionally.


    ![](img/30dd1f03e281db741ecfce8d69849415_101_2.png)


    # Signature lines


    A signature line is visible in the document text and enables the addition of signatures
    from other users.


    To add a signature, create a new file or open the existing one with OnlyOffice
    Desktop. Use the mouse cursor where you want to place a signature. Switch to the
    Protection tab, click the arrow next to the Signature button and then select the
    Add signature option.


    Digital signatures are commonly used to verify the authenticity and integrity
    of official documents, e.g., contracts, invoices, orders, reports, etc.


