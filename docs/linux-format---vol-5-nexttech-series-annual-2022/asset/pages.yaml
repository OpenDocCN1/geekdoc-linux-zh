  md: '# Linux Format 2022


    # # Multi-room Pi audio


    Get your Raspberry Pi in sync, with audio throughout your home.


    Multi-room audio systems can cost a penny, but who needs to buy an expensive set
    of speakers when we can achieve the same effect? With several Raspberry Pis and
    3.5mm wired speakers/speakers (with 3.5mm audio inputs) to play music from a streaming
    service in sync via Bluetooth from your phone, tablet or computer we show how
    to do this with a single speaker and Raspberry Pi and then replicate it in others.
    It is an excellent project for replacing old equipment. If you have a non-Bluetooth
    receiver, just add a Bluetooth receiver to the jack and connect your to your Raspberry
    Pi.


    Instead of Raspberry OS, we will use BalenaSoundOS to make the Bluetooth connection
    stable (to our other devices) and eliminate the need for a monitor, keyboard and
    mouse for Raspberry Pi. Create an account at https://balena.io/signup. Then Open
    the BalenaSound application page at https://sound.balena.io/docs/getting-. You
    must also be logged into your Balena account for that to work. Click Deploy Application
    and select from the left column


    # YOU NEED


    +   - Raspberry Pi 4 or Pi 400 (one unit per room)

    - 8GB (or larger) microSD card, U3 cards recommended. One per room

    - 3.5 mm audio cables

    - Amplified speakers or a receiver with 3.5mm/phone audio input

    - Power supplies for your Raspberry Pi

    - Optional: Smartphone or tablet


    ![](img/30dd1f03e281db741ecfce8d69849415_171_0.png)


    ![](img/30dd1f03e281db741ecfce8d69849415_171_1.png)


    # Connect and update


    Remove the microSD card from your computer and insert it into Raspberry Pi. Connect
    the speaker to the Pi via the 3.5 mm audio cable. Power up your Pi. Wait 15 minutes
    for your Pi to boot and update BalenaOS. Only the initial boot requires the internet.
    You can check the status of your Balena Sound OS in your Balena dashboard. For
    Raspberry Pi 400, connect a USB speaker instead of the 3.5mm audio jack. With
    that for your Raspberry Pi BalenaOS update and confirm all systems are running.


    From BalenaSound-Dashboard, Click Add device and choose Raspberry Pi 400 or Raspberry
    Pi 3. Select the radio for Bluetooth. If Wi-Fi, select the radio for Ethernet
    and enter your credentials. Click download, BalenaOS and a file zip will start
    downloading. Using Balena Etcher or otherwise.


    #  MULTI-DEVICE/MULTI-ROOM SYNC


    For-multi-device, repeat the stages we described above for each device. You can
    flash the same image from earlier if you''re using the same model of Raspberry
    Pi. With the same Bluetooth device mentioned music can now stream to all Raspberry
    Pis and their connected speakers. You will need to connect one Pi via Bluetooth
    to your phone for each Raspberry Pi Balena Sound speakers.

    That’s how you can create multi-room-home sound experiences in your Raspberry
    Pi devices while


    Dating from your smartphone, tablet, or computer like pro.


    If you''re an audiophile who won''t care much for Bluetooth audio, or indeed the
    headphone output on the Raspberry Pi is insufficient, use a variety of DAC (digital
    analog converter) HAT boards that have faithful audio reproduction for not much
    money. Iqado has been part of the Pi community since 2018 and we’ve been a fan
    of range of DAC and amplifier boards. Now Iqado is part of Raspberry Pi and those
    boards are being added to the range of Raspberry Pi products.


