    # ## REMOVE WATERMARKS FROM PDF


    As useful as scanning applications such as CamScanner, the free versions of such
    programs often insert watermarks to the finished file. If you''re already inserted
    watermarks with ''Scanned with CamScanner'' on your PDF, there''s an easy fix
    to remove them.


    We''ll use ocrmypdf, pdftk and the pdftools tools. The utility is available for
    all-package users on Linux distributions.


    The first step is to OCR the PDF file with the ocrmypdf pdf-ocr-file.pdf. Next,
    we need to compress the PDF file to


    as be able to edit in text editors. We can do this using pdftk:


    ```

    $ ocrmypdf pdf-ocr-file.pdf uncompressed

    ```


    We''re finally able to remove watermarks. This process involves using the pdftk
    as well as the ps2pdf utilities:


    ```

    $ pdftops uncompressed.pdf -s | Scanned with CamScanner/ | ps2pdf - watermark.pdf

    ```


    The watermark.pdf file no longer contains the annoying text. For this technique
    to work, the PDF must have a


    ![](img/30dd1f03e281db741ecfce8d69849415_59_3.png)


    Depending on the watermark technique, this doesn''t work on all PDF files.


