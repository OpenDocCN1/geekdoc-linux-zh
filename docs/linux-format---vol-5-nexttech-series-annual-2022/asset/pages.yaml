    and drag it into Inkscape. Click on the image to select it. Then use Trace Bitmap
    (Ctrl+Trace Bitmap...). In most cases, the default options are not sufficient,
    because the default bitmap is often too detailed. Adjust the settings to get an
    image that is exactly what you want. Note that you can increase the size of the
