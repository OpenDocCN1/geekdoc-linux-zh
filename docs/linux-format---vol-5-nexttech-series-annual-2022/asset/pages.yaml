  md: '# Take it to Blender


    Back in Blender, delete the cube (left-click and press Delete), and import the
    SVG that you''ve just created (File>Import>Scalable Graphics). Blender has difficulty
    interpreting these images as being rather small. The easiest way to rectify this
    is to stay at the zoom level, click the object, move the mouse to orient it on
    screen. Orient your view using the zoom (mouse wheel) and move the mouse with
    middle button+ Shift functions). You will have a view of the object, slightly
    tilted.


    At this point, you will have a bit of flat drawing, so we need to give it some
    depth. Blender handles the drawing as a set of vertices, and creates faces for
    the areas between them. To do this, find the Properties Browser (bottom right-hand
    side) of the Object (not Object Properties), click Extrude Mesh, and this will
    increase the depth of the object, making it 3d. Note that this can be a bit tricky
    when you drag the mesh. To get around it, this smaller value works best by directly
    clicking on the face box or holding Shift down.


    To make the object look like a real, world-ready object, select the edges and
    pull it down to bevel, increasing the depth as needed. The bevel parameter value
    tends to work better. It is possible that some flaws from our clean-up operations
    will be visible in the 3D object that we have now. If so, consider Edit mode (press
    Tab). Having done this, you''re immediately in Viewport, but for results, press
    7 on the numpad keyboard to get the perspective view (no orthographic).


    The controls for the curves are represented by the lines that you might see dotted
    around the object. If you spot an obvious distortion you want to smooth out, click
