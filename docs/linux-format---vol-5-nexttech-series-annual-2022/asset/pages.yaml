    We''ve talked about web browsers and privacy previously in the magazine, and most
    of the points raised there are security concern too. Third-party advertising networks
    are regularly compromised; so blocking cookies (using Firefox to isolate them)
    or JavaScript (for example, using NoScript) is just to avoid obvious ads and unnecessary
    tracking.


    There''s much to worry about your browsing or OS if you click a malicious link.
    Major browsers use updated safe browsing lists and sandboxing to keep users safe.
    And thanks to Let''s Encrypt, most websites you use HTTPS


    # CREATE A MASTERPASSWORD


    > “A good technique is to join five or six random words and come up with a mnemonic
    to remember them.”


    indicated by the green padlock in the URL bar to ensure that third parties don''t
    compromise your browsing (and sniff off what you do) and secondly that you''re
    not being done some sort of importing. Hackers are ingenious and we are popular
    targets. If you use a site (you''re using an ad network) that might be compromised
    by some JavaScript script (like the Megagarget password manager), you could be
    compromised everywhere else.

    Much of your data is stored online and protected by a password, so exceeding password
    hygiene is critical. If you recycle a password (even if you''re using an insecure
    connection) and that site is compromised,


    who or whatever will certainly try to and use those credentials elsewhere. No
    service should store passwords in plaintext, and indeed password hashes has been
    the norm since the early days. But thanks to good salting, cracking at passwords
    (using Hashcat and Ripper) (and open source tools), if an attacker gets a list
    of passwords (from a stolen database, say), they''ll almost always need to crack
    the simplest passwords.


    Firefox, Chrome and many other browsers have their own password managers built
    in. You may need to use those to take care of your passwords, then use Firefox
    to sync them across other devices. We''re fans of services like Lastpass, which
    can also do the same thing. If you want to take responsibility for your passwords
    you could use KeePassXC locally and optionally sync the key via Nextcloud.


