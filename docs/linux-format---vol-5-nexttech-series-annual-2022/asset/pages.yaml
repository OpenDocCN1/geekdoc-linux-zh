  md: '# Linux Format 2022


    # # Tweaking Pop!OS


    Linux and Pop!OS can, do a lot for your laptop''s performance and security with
    just a little persuasion...


    Pop!OS is one of few distributions to offer out-of-the-box support for full encryption.
    This is something that''s more relevant for laptop users because there is some
    kind of risk. If your laptop gets stolen the thief has access to all your files.
    Now you never need to remove the drive and plug it into another machine.


    Other distributions support home directory encryption (viaCrypt), but this is
    not as flexible. The home directory is mounted only when you log in, but if something
    goes wrong and this doesn''t happen (there have been bugs that cause this behavior),
    a determina attitude could gain access if the laptop is lost. Then there is the
    question of sensitive data stored outside of the home directory, temporary files,
    system logs, if you''re working with sensitive data then you should look full
    disk encryption.


    Full disk encryption is easy. It works on the whole drive - none of that matters
    a selection of


    partitions, the whole shebang. Pop!OS will give you the option to enable it if
    you choose ''Erase and install''. Otherwise any operating system already installed
    on the drive would break, which means you won''t be able to find your files.


    If you dare (and I mean dare carefully), you''ll have to install your Pop!OS boots
    first. For the device, so it won''t be configured with your user identity. Under
    the hood it uses Unified Key Setup (LUKS). This partition is encrypted at early
    boot (from a root/boot partition containing system-boot) and it''s worth noting
    that the key is stored in memory when the device is powered off, so encryption
    won''t protect its contents while powered on.


    # ## Battery booster


    Everyone wants their laptop''s battery life. Pop!OS lasts battery twice as long
    (and Chromebooks can last longer), but this depends on using the right software.
    Beyond the obvious turning down the brightness and using wireless - there''s much
    you can do to improve battery life.


    # ## WHAT''S NEW IN POP!OS 20.10?


    If you want to experience life then try out the latest release of Pop!OS! It''s
    based on the stable release of Ubuntu, which has LTS releases each bringing new
    features. Most obviously you''ll have all the extra hardware support of the kernel.


    If you have a newer machine and couldn''t get something working the new release
    may well fix it. As inheriting from a new Ubuntu base, Pop!OS has some new features
    too, like awesome tiling mode here, which helps you perhaps should, since no change
