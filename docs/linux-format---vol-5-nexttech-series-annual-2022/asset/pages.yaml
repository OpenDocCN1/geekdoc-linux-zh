    # ## clean up


    In (Ctrl+mouse) mode you will erase the trace. If you have any parts that you
    want to remove, use the Edit+Paths nodes (delete-handle tool). The types of nodes
    that you''ll want to deal with are unwanted gaps and nodes. Drag over them to
    select the unwanted elements and then delete the path.


    To complete the loop, look at the status at the bottom of the window, and you''ll
    see the number of nodes. If there''s too many nodes, try to simplify the path
    (Option+Path) to see if you can reduce the number of nodes without greatly sacrificing
    the quality of the drawing.


    If there''s still too many nodes, it''s well better to have a smaller number of
    nodes, to reduce complexity and give to smoother curves over the edges.


