  md: '# Linux Format 2022


    # # Backups in depth


    Use snapshots and cloud backups to keep your data safe with minimal effort – just
    way we like it!


    ![](img/30dd1f03e281db741ecfce8d69849415_53_0.png)


    ardcore users may prefer to back up using the command line rsync. This can be
    automated via cron (see ps54) or system timers), and encryption can be added to
    the mix.


    rsync is an efficient protocol (so only changed files get updated) and runs remotely
    via SSH connection. It''s a complex task for the novice user, but check out the
    manual page if you''re interested.


    A common gotcha is that slashes when passing paths will be inconvenient and recovery
    could turn one problem into two. Enter the popular command line tool Duplicity,
    which uses rsync (by a much nicer synct) and connect


    (CoW Write) snapshots to do things much more efficiently than the traditional
    rsync method it uses on other filesystems. When a file is changed, a new version
    is written out and the old copy is marked for deletion and metadata updated. This
    offers resilience, in the event of a power outage. It also enables snapshots at
    the filesystem level, keeping hold of the changes between old and new files. At
    first these seem intuitive, as a snapshot initially takes no time, but grows as
    time goes on.


    If you don''t use TimeShift (but you can still take Btrfs snapshots, In fact,
    they''re extremely useful for saving the gaps, in a week a schedule, for example,
    you could keep half day daily snapshots, and then delete daily snapshots back
    days ago). This enables you to quickly roll back your files to yesterday or last
    Tuesday, when that''s when this feature has been in – by taking snapshots before
    and after each update.


    # ## MAKE USE OF ALL OPTIONS

