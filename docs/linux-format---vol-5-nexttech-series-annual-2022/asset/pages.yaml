  md: '# Linux Format 2022


    # PHOTOREC


    # Recovering deleted files


    Shashank Sharma knows from experience that deleted files is far easier than gaining
    hair over a bald patch.


    ![](img/30dd1f03e281db741ecfce8d69849415_55_0.png)


    Hardware failure and a careless user adventurous with powerful utilities such
    as disk can lead to data loss. Not only that sometimes cleaning a partition or
    directory can also lead to accidentally overwriting useful files. Should that
    happen, there''s no reason to despair. With PhotoRec, you can easily recover any
    variety of files, even archives and so on.


    Distributed by CGSecurity and released under the GPL, it is a companion of TestDisk,
    which is used to recover and restore partitions. You can use either of these tools
    to recover files, but each has a job that''s best suited for it.


    ![](img/30dd1f03e281db741ecfce8d69849415_55_1.png)


    TestDisk is suited for recovering partitions on account of you overwriting or
    deleting a partition, or a partition becoming unreadable. Whether or not TestDisk
    can help you recover the partition or at least the lost data. But if you''re interested
    in recovering deleted files from a partition, hard or even USB drive, you can
    use PhotoRec. Initially designed to recover


    You can stop a recovery operation at any time, and if you want, even said PhotoRec,
    when you start next PhotoRec, it will ask you to restore the previous session.


    recover image files (hence name). PhotoRec can be used to recover just any matter
    of file. Better PhotoRec works by ignoring the signatures on the filesystem, partition
    disk or USB drive. It focuses on the unique signatures left behind by different
    file types. Thus, why PhotoRec can work with FAT, NTFS, ext3 and other partition
    types. TestDisk only supports a limited number of files.


    +   ### OUR EXPERT

    Shashank Sharma

    is a half lawyer living in Delhi and an Arch user. He''s always on the hunt for
    geeky memorabilia...


    # >> OTHER RECOVERY SOLUTIONS


    TestDisk and PhotoRec have gone past most of all recovery CD tools because of
    their effectiveness. But they aren''t the only tools that can help you recover
    deleted files, or extract data from corrupted or damaged partitions.


    A new tool worth mentioning is Undelete. It is a simple command-line tool to recover
    files you want to recover, as you already know exactly where the file was located.
    We will be using the `undelete /dev/sda1` command to recover all files from the
    partition. Note that we use `undelete /dev/sda1` command here.


    Scalpel is another powerful tool, like PhotoRec, and can work independently of
    the underlying filesystem. This means you can use it to recover files from different
    filesystems such as FAT, NTFS, or even ext4. By default, Scalpel is not configured
    for any file types, so the first step is to define the file types you want to
    look for in the `scalpel.conf` file. You can use Scalpel to recover deleted files
    as PDFs or images.


    # Understanding the basics


    PhotoRec isn''t installed individually, but part of the TestDisk utility. You
    can install it using the software manager because it''s part of the most popular
    tools in Linux distributions like Fedora, Debian and Ubuntu. The command is `sudo
    apt install testdisk`


    Before you start PhotoRec, it''s important to understand how a filesystem handles
    deleted files. When you delete a file, it isn''t immediately ziped to oblivion.
    Instead, the system merely marks the file as deleted and assigns the space it
    occupied occupied


