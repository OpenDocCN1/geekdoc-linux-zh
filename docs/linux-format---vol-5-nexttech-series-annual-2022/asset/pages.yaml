  md: '# # Linux Format 2022


    # # QEMU, KVM and the others ones


    Learn about virtualising Linux with, libvirt and Virtual Machine Manager, and
    jokes about Inception.


    VirtualBox and VMware, with their friendly GUIs, are great tools for spinning
    up VMs on whatever OS you have to be running at the time. They also have command
    line interfaces and all kinds of management features. If you want to deal with
    VMs you can comfortably run them on your screen, at these tools are more than
    enough for most people.


    Linux has its own virtualization solution, KVM (Kernel Virtual Machine) and is
    highly popular, both at home and at scale. As the name suggests, QEMU in the kernel
    transforms it into a hypervisor. But to


    make use of it, we need a userspace program to provide our abstract hardware interfaces
    and the most common way to do this is through QEMU, an emulator, but also a virtualiser.


    You can run QEMU from the command line if you need to. Once you''re comfortable
    with it, you will need to type everything just right until you find yourself craving
    something better. Enter libvirt, which provides a high-level API for creating
    and managing VMs. It is not a framework in itself, but a thing that does exist
    in the form of the intuitive Virtual Machine Manager.


    # ## SPEEDING UP VMs


    Storing your VMs on an SSD is the simplest way to make them go faster. But there
    are a few other tricks. Having to emulate network devices, hard disk controllers
    and video cards is messy. When there''s no real hardware beyond the peripherals
    to talk to, it still adds latency. Actually, several layers of abstraction in
    the communication can be the main bottleneck.


    To end this is to use paravirtualisation, where we would modify the guest (OS)
    settings so that it''s aware of the underlying hardware and use a paravirtualized
    disk controller. This is a special version called VirtIO, and it''s included in
    the Linux kernel. And most modern Windows distributions will support it.


    Red Hat drivers for Windows guests, and further details are available at https://docs.redhat.org/quick-docs/virtual-machines-windows-drivers.
    If you''re looking at the QEMU threads, you can limit CPU cores, or use the pages
    for more efficient memory. It''s all in the manual.


    ![](img/30dd1f03e281db741ecfce8d69849415_81_0.png)


    Having fewer in a paravirtualisation stack might seem like the kind of unnecessary
    complication that Linux is often accused of, but once you do all things and interact
    with other tools, libvirt for example can manage VMs just as well as QEMU/KVM
    ones. You can also set up virtual networks and bridges so your guests can talk
    to each other or the physical network as you wish.


    All the required bits and pieces for crafting VMs on your device


    If you want to run a headless Ubuntu Server host without connections, see base,
    (page) you will need the following command of line:


    ```

    sudo apt install qemu-kvm-libvirt-daemon-system

    ```


    ```

    sudo apt install qemu-kvm-libvirt-clients

    ```


    To communicate with the libvirt daemon, and manage your VMs you must use the appropriate
    groups (on most distros). After you do this once for setup, you''ll need to look
    out for the changes to take effect. A bit of nomenclature and ritual with which
    it pays to be familiar before you start creating your own world.


    # ## Keeping things separate


    When you run a kernel (as a domain) through libvirt, it''s faster than when that''s
    all done through separate user account. If something goes wrong and the desktop
    crashes - you''ll find your guests just as easily as you''ve left. We''ll be in
    a moment connecting to libvirt remotely, where everything is fragile, and what
    comes into its own. But a bit of libvirt getting one run locally


    Start Virtual Machine Manager (hereafter Virt Manager), you''ll find it in the
    Applications Grid, and click the New VM in the top left. If you see an error about
    libvirt not running you may need to restart it.


    ![](img/30dd1f03e281db741ecfce8d69849415_81_1.png)


