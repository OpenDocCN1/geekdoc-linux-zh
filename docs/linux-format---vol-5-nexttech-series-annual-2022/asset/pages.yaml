  md: "message of the OLED. This is what we need for now\n\n# Read the input voltage\n\
    \nProcess computers, by default, live in the digital world. For everything, everything\
    \ is made of zeros and ones. Saul would require us to read analog voltages quite\
    \ regularly. The solution for this is an analog-to-digital converter (ADC), which\
    \ translates voltages across a range in fashion similar to the one shown in figure.\n\
    \nWhile the ADC of the Raspberry Pi has 12 bits resolution, the MicroPython tool\
    \ can standardise on a 16-bit resolution. With this individual values are scaled\
    \ from 0 to 65535. Keep in mind that this done via multiplication adds neither\
    \ resolution nor accuracy. This gives us the advantage to parametrize our code:\n\
    \n```\nadc = machine.ADC(machine.SPI(12, 64, spi, dc, res))\n```\n\nconversion_factor\
    \ = 3 / 65535\nInitialising the ADC is that simple because MicroPython provides\
    \ numeric IDs for the ADC inputs. To read the ADC inputs, you must convert the\
    \ value from zero to the GPIO pin.\n\nconversion_factor is the value that will\
    \ be used to convert the ADC into a natural voltage. 3.3v is an approximation\
    \ of the reference of our ADC. More detailed discussion of the ADC reference voltages\
    \ would be, out of the scope of this article.\nThe ADC we use has limitations\
    \ in converting an analog into a digital value. This is in an endless loop — constant\
    \ reading of offset which is required to prevent the screen flickering from strings\
    \ being seen on top of another:\n\n```\nwhile True:\n    reading = adc.read_u16()\
    \ / conversion_factor\n    reading = adc.read_u16() / conversion_factor\n    reading\
    \ = adc.read_u16() / conversion_factor\n    factor += adc.read_u16() / conversion_factor\n\
    ```\n\n```\noled.fill(0)\noled.text(str(reading), 4, 5)\ntime.sleep(1)\n```\n\n\
