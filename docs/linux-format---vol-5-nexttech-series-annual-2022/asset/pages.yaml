  md: 'reduce the size of the PDF file with command-line tools.


    Our choice for this is Ghostscript. It''s an interpreter for the PostScript and
    PDF files, and if it''s not available on your device, you can install it using
    the software repositories.


    sudo apt install ghostscript will install the tool on Debian, Ubuntu, and other
    Debian-based systems. If you''re using another distribution, you''ll need to run
    `sudo apt install ghostscript`.


    The actual Ghostscript command to reduce the size of PDF files involves quite
    a few options. Look at this example and then we''ll find the different options:


    ```

    `gs -dNOPAUSE -dBATCH -dPDFLevel=1 -dPDFSETTINGS=/ebook -sOutputFile=output.pdf
    input.pdf`

    ```


    Since the complete command is what you''ll use with the symbol:


    ![](img/30dd1f03e281db741ecfce8d69849415_58_0.png)


    If ocrmpdf reports any too many tonics, it doesn''t mean the command has failed.


    | Command | Function |

    | - | - |

    | -dNOPAUSE | Disables the prompt and pause at the end of each image |

    | -dBATCH | Exit ghostscript after processing the file |

    | -DEVICE | Specify the output device. |

    |dCompatibilityLevel=4 | Specify the PDF format |

    You have the choice of screen, ebook, preset |


    | Option | Size |

    | - | - |

    | -PDFSETTINGS=/screen | (screen-view – 72 DPI images) |

    | -PDFSETTINGS=/ebook | (low-quality – 150 DPI images) |

    | -PDFSETTINGS=/printer | (high-quality – 300 DPI images) |

    | -PDFSETTINGS=/jpeg | (high-colour and preserving – 300 DPI images) |


    > QUICK TIP The main pages, help website for projects like Ghostscript and pdpdf
    are all to help you master their capabilities. Check out the tutorials and instructions,
    and even online that describe how to perform different operations.


    You can also achieve the same effect using the pdpdf utility. Although you''ll
    have to install it from the software repositories. Once installed, you can run
    the `pdpdf input.pdf output.pdf` command to produce a smaller file. It converts
    the PDF into a PS file and then refers it as a PDF, resulting in smaller file
    size.


    The most important option, and the one that actually shrinks the size of PDF files
    is the `-PDFSETTINGS` option. The rest can be used to set the output format. The
    Ghostscript command supports a wide variety of formats, including PDF, JPEG, and
    PS. When you run `gs -h` for a list of all supported options, you''ll find overstuffed
    with `-DEVICE`, which we''ve pdffitted for the pdf.


    Depending on the size of the file, you''ll have to choose between screen, ebook
    or printer. Use `-PDFSETTINGS` if you want to reduce the size of the original
    PDF file in size, and also the quality of it!


    # Merge and split


    With popdf-utils, one of the most useful features is to merge multiple PDFs into
    one. If you have a PDF that is an electronic printer, then popdf is an electronic
    scanner-raster-bullet-point, secret-decoder-renderer You can use the tool to merge
    PDFs into a single document, split PDF files into smaller ones, or extract a PDF
    file into just one page that every PDF file will contain. There are more advanced
    options such


    # WORKING POPPER-UTILS


    While we have discussed many different utilities to manipulate PDF files in your
    life, Linux distribution has many more tools to offer, for all situations.


    The poppler-utils package is a collection of tools built on poppler libraries.
    Each of these tools is designed to work with PDF without over control. From here
    you can install the `poppler-utils` package by running `sudo apt install poppler-utils`
    if you''re on a Debian, Ubuntu


    distribution. Run `sudo apt install poppler-utils` if you''re on a RHEL-based
    system.


    The package includes many different utilities that can be used to convert a PDF
    into HTML while retaining the formatting of the original PDF file. `pdftm` is
    used to break the pages of an individual PDF into images and extract text from
    an index file using `output_html.txt`


    You can similarly use the pdfseparate utility to split a PDF file into smaller
    files. It works the PDF file, which we''ve already discussed, and uses the same
    tools for its main details. The pdfmerge utility provides the opposite functionality,
    and can stitch together multiple PDFs.


    The bottom of the main page lists the other utilities that are part of the poorer-utils
    package such as `pdfimages`, `pdfinfo` and `pdftotext`.'
