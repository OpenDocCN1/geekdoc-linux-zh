  md: "# MotionEyeOS\n\nLearn to build your own motion-triggered home security camera.\n\
    \nhome security systems have exploded in popularity while decreasing price over\
    \ the last few years. There are first vendors often charge a fee to store your\
    \ data, and you might not want video and photos from your home in this project\
    \ being shared with a third party.\n\nMotionEyeOS is a daemon that enables you\
    \ to turn a Raspberry Pi into a video monitoring system where the photos and videos\
    \ stay on your device (and home network), or if you choose, uploaded to a cloud-storage\
    \ service as Google Drive or Dropbox.\n\nHere is how to set up a Raspberry Pi\
    \ security camera with MotionEyeOS. This software works with almost any Raspberry\
    \ Pi (connected to the internet). There is no fancy getting around—it works. Download\
    \ the latest version of MotionEyeOS corresponding to the model of Pi you are using\
    \ and write it to the SD card. When the process completes, physically remove and\
    \ restart your microSD card. We do this because the software automatically restarts\
    \ the process completes, but we may need to add one file before the next step.\n\
    \nCreate a new file named wpa_supplicant.conf with the following text, replacing\
    \ \"YOUR_NETWORK\" and \"YOUR_PASSWORD\" with your data:\n\n```\ncountry=us\n\
    update_config=1\nctrl_interface=/var/run/wpa_supplicant\nnetwork={\n  ssid=\"\
    YOUR_NETWORK\"\n  psk=\"YOUR_PASSWORD\"\n}\n```\n```\n\nSave the SD card and insert\
    \ it into Pi. Connect your camera, monitor and power supply to your Raspberry\
    \ Pi and power up. If you have not connected your Pi's IP address will be displayed\n\
    \n# YOU NEED\n\n+   - Raspberry Pi 3B+, 4 or Pi Zero\n- 8GB (or larger) microSD\
    \ card\n- Raspberry Pi Cam, HQ Camera, Infrared Camera and webcam\n- Monitor/power\
    \ supply/HDMI cable\n\n![](img/30dd1f03e281db741ecfce8d69849415_176_0.png)\n\n\
    ![](img/30dd1f03e281db741ecfce8d69849415_176_1.png)\n\n![](img/30dd1f03e281db741ecfce8d69849415_176_2.png)\n\
    \nDon't rely on SD cards for storage: cloud storage will make files easier to\
    \ access to.\n\non the Pi screen, you can find out from Nmap or your router configuration.\n\
    \nEnter your IP address into a browser and MotionEye will start streaming.\n\n\
    # Configuring MotionEye\n\nClick the Icon in your menu panel to join the Login\
    \ screen. Log in with the default credentials, and and the password field should\
    \ be blank. Select your Time Zone from the dropdown menu in Time Zone. MotionEye\
    \ will take a few minutes to set. This is important as each video is timestamped.\n\
    \nThe Frame Threshold setting determines the detection of pixels that change color.\
    \ The intent is to set it low enough to prevent false positives like noise, but\
    \ high enough to avoid recording a cloud. In most cases, this is achieved through\
    \ first 4% Frame Threshold and then move up until desired.\n\nClick Apply to reveal\
    \ extra settings. Click the icon on the right of Still Images to reveal extra\
    \ settings. For Movie Capture, select Motion Capture and record. Move Motion to\
    \ Trigger and choose an appropriate recording interval for both. A week is recommended\
    \ if you're working with an 8GB card.\n\nSet your Camera Name, Resolution and\
    \ options in the Video Device section. Click Apply to save changes. The live feed\
    \ view will see you thumbnails for viewed images and video.\n\nIn the current\
    \ setup you won't leave your local behind. But if you prefer having your media\
    \ in the cloud try to set MotionEyeOS to upload to Google Drive or Dropbox. Alternatively,\
    \ you may need to enable remote access to your camera. You will need to configure\
    \ port forwarding on your router to do this, if there are official iOS and Android\
    \ apps you can check where you're out.\n\n> This Raspberry Pi security camera\
    \ can be used to record porch children, or watch out for burglars."
