  md: '# Linux Format 2022


    # Google ChromeOS


    With a limited lifespan you''ll eventually want to replace the Google-maintained
    OS for something with much more than tux.


    It''s absolutely clear: we''re going to wipe everything off your Chrome. This
    might break it in the process, because we''re messing around with fire. You do
    that at your own risk, with clear warnings onwards:


    We have a love-hate relationship with ChromeOS. It''s Google (good!), but it''s
    built on Linux and Android so far. If you want an affordable with decent battery
    life and a Linux heritage then they''re hard to ignore. Chrome uses CoreBase in
    the device firmware usually complies with the initial setup.


    There are various approaches you can take to get Linux on your Chromebook: the
    official Linux mods, run a


    distro via the cheap Crouton tool or do a install. The first option - if your
    device supports it - easiest, but doesn''t offer hardware acceleration or access
    to the GPU (maybe this is coming along). Similar limitations apply to the second
    option, but that provides a full-life OS.


    The final option seems a bit extreme, especially because you''ll usually need
    to install a third-party firmware to boot from a USB drive. Most Chrome devices
    have a five-year update limit, once Google has stopped updating you feel if you''re
    out of options.


    # Choice of you


    We''re going to look at two approaches that make sense for you, but also, there
    are others to consider and ARM. The majority of Chromebooks are intel based, if
    you own one then your life is far easier and we can easily go on using Gallium.org.
    This is a Linux distro for Chromebooks and is maintained. The last major release
    was at the end of 2019 the Reddit group is mostly active. Arm-based devices are
    another whole problem and we''ll look at ProtoOS at that''s later.


    Before we get into you should be aware that PCs have a bootloader. This is the
    software that puts in the initial firmware power-on and then hands over to the
    operating system''s kernel. Open source Linux/BSD systems are usually ready. Grub
    can work with BIOS or UEFI firmware.


    ChromeOS uses Google''s Coreboot firmware which will refuse to run anything other
    than a signed ChromeOS unless installing in develop mode later


    ![](img/30dd1f03e281db741ecfce8d69849415_45_0.png)


    It''s good sense to create a recovery drive before doing anything:


    # >> MAKING IT SAFE


    If we''re using the base operating system to protect your recovery, Google has
    created a simple recovery system that just needs you to install a Chrome Extension
    and then write it a recovery OS to a 8 GB (large) USB drive. This can be a back-up,
    so when you do it follow these instructions:


    Head to the Google Site and get the Recovery Utility (https://bit.ly/3nf2recovery).
    Follow the instructions, click the model number for your device is (shown above)
    and then follow the prompts to create


    With safety in the buffer you can go and do whatever you like to your Chromebook,
    know that you have a stable OS backup running up on your drives.


    If you need to recover a device, disconnect everything and power down your Chromebook.
    Press and hold the Esc and Refresh keys, then power on Chrome and release the
    keys. When a message appears release the other keys. At this point you can use
