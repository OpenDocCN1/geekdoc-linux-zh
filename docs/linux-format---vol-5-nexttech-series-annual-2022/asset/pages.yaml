    brief introduction, we can try to out a TM in our first simulator:


    # The Turing simulator


    To start, download the code for first TM simulator, which goes by the name of
    Turing, from https://github.com/schatetz/turing. Although a TM can be designed
    to perform any function that can be expressed logically, even the simplest examples
    can take a huge amount of time to execute, with the machine moving back and forth
    along the tape. To limit the number of steps required to execute our first example,
    we will design a simple TM, keeping things as simple as possible, we''re going
    to use unary instead of binary information.


    You might not come across the unary representation before. Known as base 1, the
    rules we''ve learned for interpreting decimal (base 10), binary (base 2) or hexadecimal
    change. Starting from the left and moving right, we assign values to positions
    for powers of one, two, three, etc. Uniquely among numbers, these all equal to
    the same number, which means that the unary representation of a number is the
    number of ones. For example, decimal 3 is 111, and decimal 6 is 111111.


    Although Turing allows the operation of a TM on the tape, including the initial
    part to the tape and setting the initial position, the remainder of the definition
    is external. So, the definition for unary addition, which you should add to your
    editor:


    ```

    # start 0

    # end 4

    000R

    101R

    11R

    20-L

    211R

    300L

    ```


    The first two lines define the state and symbols that cause the TM to halt, and
    the third specifies a symbol to be written to all positions on the tape as an
    instalment. The remaining lines, which define for each combination of state and
    tape symbol (but only those that are to be encountered), define the symbol that
    should be written to the tape, the direction to move along the tape (L or R) and
    state. For example, the line 20- means that the TM is in state 2 and reads a 0
    from the tape, it moves one to the left, and enter state 3.


    To run and load your unary addition program, you''ll see the transition table
    and the various rules at the left of the screen. Then you''ll see that every position
    on the tape contains an asterisk, and a couple of lines below, the Current State
    is shown as 0, both of which we will define:


