    # # GPIO

    Control real-world hardware on your PC


    Mike Bedford shows PC users how to add GPIO interfaces to their computers, just
    like Raspberry Pi and Arduino users who are familiar with.


    ![](img/30dd1f03e281db741ecfce8d69849415_131_0.png)


    OUR EXPERT

    Mike Bedford built his first PC with a soldering iron and parts. He still has
    a love for combining electronics and computing.


    Users of Raspberry Pi and Arduino SBCs are familiar with these boards: GPIO (general
    purpose input/output) ports that enable them to interface with real-world electronic
    devices. PCs deviate of GPIOs, but are available that provide that facility and
    connect to the PC via a USB port. Such devices are the FT232H and the MCP221,
    both from Adafruit. Here we see how to use them.


    These boards differ in their number of ports: FT232H (36 pins from Pimor) has
    12 digital inputs but no analog outputs, while the MCP221 (66 pins from Pimor)
    has three analogue inputs, one of which can be used as an analogue output, but
    they share the pin with analogue outputs. These boards have USB connectors, so
