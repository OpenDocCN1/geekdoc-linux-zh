  md: '# Scanning for vulnerabilities


    Needless to say, testing for common vulnerabilities and exploits is ever important.
    Before the deployment reaches production, you should already be sure that it has
    no vulnerabilities. How do you go about that?


    While there is a growing number of tools like ZAP that can help you analyze your
    web app, very few appear to be CI/CD out of the box. However, we are starting
    to see more enter this space, most notably StackHawk, which is free and open source
    and built around a ZAP based solution.


    One of notable things about this particular option is that the Founder of ZAP,
    Simon Bennett, joined the team in 2020. ZAP is now Open Source and continues to
    support development. It is possible to build your own solution around ZAP if you
    want to keep your pipeline of codeing, but in the long run a self-build solution
    will probably cost you money. There are other commercial alternatives, such as
    Snyk and integrated platform CI/CD constantly exposing public endpoints to your
    staging environments, which is its bound of potential issues that are best manageable
    with StackHawk and ZAP.


    Integrating vulnerability scanning into your CI/CD means you''ll be able to check
    your web app for the same problems that hackers are looking for. This results
    in automated de-bugging by attacks by having automated security tests. To put
    it simply, automated vulnerability scanning is to Dynamic analysis what is to
    Static analysis. The bare minimum that you should be doing to test your web app
    is like making it acceptable to your boss with minor code style consistency features
    (like a missing doc on a function), isn''t really enough for a well-designed


