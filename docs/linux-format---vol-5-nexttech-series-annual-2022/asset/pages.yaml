    objects. First we''ll take some measurements from the object, then we''ll model
    the main components of the mug; the body and the hand. We''re going to add materials
    to surfaces of the model. Bear in mind that Blender is a 3D modeller and not a
    CAD program, so we''re going for something that assembles the original object
    rather than following it to the millimeter.


