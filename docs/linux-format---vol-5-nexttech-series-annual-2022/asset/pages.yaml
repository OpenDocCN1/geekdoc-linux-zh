  md: '# Linux Format 2022


    # # Contain yourself


    Containerisation is an uneasy midgel with virtualisation, but it''s a big deal
    too. A Docker whale-sized big deal, as we discover...


    decade or so before the VMs came a rise of containers, and in particular Docker.
    Containers are the spiritual successors of BSD jails and chroots, but on modern
    features in the kernel, namely groups and namespaces, which make applications
    can be appropriately isolated without machine isolation. Chromium uses them for
    sandboxing and so do the new Flatpak and Snap packages.


    Containers use the host''s kernel, and whatever resources you allow them, enable
    applications and their dependencies to be packaged and run anywhere. You could
    call it application rather than machine virtualisation, but it does so without
    the need for a whole OS to be packaged up,


    so things are, in theory, faster and easier. Containers don''t quite join the
    same separation (from each other and the host) as virtual machines, but Spectre
    and Meltdown have VM security in their work and Docker exploits are quite hard
    to pull off.


    In our Chelsea (feature #40) we saw how Leela used Nvidia VMs to get a CUDA-enabled
    Docker image and run Docker. But it has a bit of a problem: VMs which require
    direct access to hardware. Containers can be granted the privilege to access these
    things. But lots of effort gone to make it possible, and so box to familiarise
    yourself with some of them.


    But let''s talk about Docker. And containers in general because Docker is not
    just Docker. Ultimately, it solves the problem of "this program works on my machine,
    but not on theirs" and not in the same as a VM does, by bundling everything that
    it needs (hardware and software). As,, containers bundle all the libraries in
    the userspace, whereas the Docker (or other container) runtime is completely deconstructed.


    ![](img/30dd1f03e281db741ecfce8d69849415_85_0.png)


    Here''s Windows 10 in action, complaining about disk space and with confused Windows
    Update. Just the right thing to be honest.


