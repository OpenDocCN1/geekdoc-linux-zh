  md: '# Linux Format 2022


    # What’s new in 21.04?


    It may not be packed with feature of eye-catching new features, Ubuntu 21.04 features
    plenty of improvements.


    Wayland may be the headlining, but it''s not the only new feature that arrived
    in Ubuntu 21.04. Several other features are linked to Wayland, of course – the
    PipeWire project, with aim to “improve” handling of audio and video under Linux
    hardware.


    status menus and Calendar tool. In addition, look out for small, but pleasing
    updates to the Nautilus Manager, including icons redesigns rounded corners.


    In practical terms, it primarily improves the ability to share and record your
    desktop with compatible applications such as OBS Studio and Discord. It also improve
    audio support in sandboxed applications as those inside Firefox.


    One interesting made in Ubuntu 21.04 is the not to stick with GNOME 3.38 (or more
    precisely).


    # Desktop improvements


    One change that could make life a lot simpler is the introduction of a new desktop
    extension finally handles drag and drop interactions between desktop applications
    (such as via the file manager). Take a trip to Settings>Power where you should
    find assuming your configuration has proper kernel – you can now configure profiles
    from the switch between power and saver. This feature is clearly aimed at users,
    with the only downside being that your settings won’t survive a reboot.


    The default programs Firefox and LibreOffice have also been updated to the latest
    versions at release – LibreOffice is now v7.2.


    # Security improvements


    There are several security updates in Ubuntu 21.04 worthy highlighting. Users’
    Home folders are made more private. This means that users can no longer browse
    the contents of others’ home folders unless their permissions have been tweaked.


    When installing Ubuntu 21.04 on an encrypted partition, you’ll be glad to know
    that a fail-safe exists in the form of an official recovery key, which you can
    use to recover your system if hardware fails out for the option appearing during
    boot.


    The built-in firewall now has nftables as back-end. You can still use the more
    user-friendly ufw to manage the firewall and it should show no difference in functionality.
    The main advantages of nftables over iptables are that it is easier to use when
    rules are defined, has no need to update with new protocols.


    Finally, UEFI Secure Boot has been improved to support SBAT-compatible chips,
    grub2, and flatpak – to mitigate consequences of the security vulnerabilities.
    The desktop also gains better support for smart authentication, which can be used
    in place of passwords for logging on your system.


    The kernel has also been updated in Ubuntu 21.04 with kernel 5.8, and in addition
    to however security fixes you’ll also benefit from the latest hardware support
    and other performance improvements. Examples include reduced memory swapping thanks
    to another anonymous


