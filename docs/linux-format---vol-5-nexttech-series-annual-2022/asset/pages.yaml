    as you have references to Red Hat, and all pictures of red hats, you''re free
    to distribute them (but you make your changes also). It''s CentOS, and it''s scientific
    Linux. And it did.


    CentOS users were plenty, and they weren''t motivated by impartiality. Big companies
    (Google, GoDaddy, Rackspace) deployed it on their networks, and it''s one of two
