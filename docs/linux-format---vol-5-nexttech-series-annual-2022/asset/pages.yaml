    watch out for. Let us explain...


    ales desktop PCs have been declining for years. It''s wrong to view your venerable
    ATX desktop the way we did anytime soon, but it''s not foolish to acknowledge
    that more of our computing is on laptops and mobile devices. As a reader of this
    personal piece, you''ll find it your duty to install Linux on said devices. And
    it would be better to show you how. You may have heard horror stories of Linux
    breaking or making laptops, and the relationships of those using them. Some of
    them might be true but plenty false, at least nowadays.


    Back when Secure Boot was introduced, many saw it as conspiracy to establish further
    dominance over users'' hardware. This was mostly concerned. We haven''t encountered
    a device feature that we''ve heard readers complain about for some time. And plenty
    of drivers opted to use a shim by Microsoft, to get in just with Secure Boot.


    ![](img/30dd1f03e281db741ecfce8d69849415_38_0.png)


    # Primary disk facts


    However, it''s not that many manufacturers don''t do it, but that laptops, are
