    mail servers, then you''ll receive emails that contain viruses, and not just Linux
    ones. ClamAV is simple and easy to integrate with mail agents. If you are running
    Windows binaries through Wine, then lots of malware works without failing. Not
    only does this save you whole virtual machines, but it could turn your Linux system
    into a spam-bombing zone. Without safeguards your programs can access files without
    the prefix they''re running. Wine or no, if any program (or what you spawn) can
    decrypt or encrypt your home directory, or any other location where you have access
    to, Linux drives (which is how most desktop distros work), then that could be
    exposed to exploit further havoc, corrupting other files; installing rootkits
    or overwriting Old Ones. AppArmor and SELinux administrators apply much more granular
    permissions to these applications. These are used in Ubuntu and Fedora respectively;
    applications have their own profiles to stop them from doing what they shouldn''t.
