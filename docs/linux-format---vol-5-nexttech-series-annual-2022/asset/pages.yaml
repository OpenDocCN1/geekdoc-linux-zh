    # # Build that firewall


    Protect your ports, lock down sockets – a pocket storm ahead.


    Linux now ships with its firewall enabled by default. Desktop users can run a
    friendly GUI such as ufw, or even write their own iptables or nftables rules,
    but nothing will leave this up to an attacker. A cynic might say that Linux has
    enough trouble with networking as it is, but the reality is that most desktop
    users don''t need a firewall.


    This changes as you start running services (as having listening ports that the
    whole world can connect to). The NAT (network address translation


    world you''ll still have to do this. Modern applications though, can submit their
    own port forwards to (compliant) routers through UPnP; so that these are all arranged
    previously. One example is Transmission BitClient, which can find the port(s)
    of your choosing and allows peers to connect to a site using your firewall. If
    you can''t be reached, the firewall will block the connection to your site, thanks
    to the port-forwarding magic outlined previously without a hitch.


    However, if a good program can do it, so can a rogue one, causing users (and those
    who have no idea) disable UPnP in their home router settings. A technique called
    NAT slipstreaming was revealed by Sammy Kamarni in November 2020. This showed
    it is possible for an attacker to establish a connection to a machine behind a
    NAT gateway by visiting a site using a control proxy and making the victim download
    a script. The attacker has access to the victim''s machine, but may have control
    over the flow, which the Application Layer Gateway (ALG) protocol handles.


