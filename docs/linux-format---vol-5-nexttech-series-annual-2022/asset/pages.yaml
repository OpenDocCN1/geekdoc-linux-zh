  md: '# A virtual history


    Datacentres are full of VMs, but why and how did they get that way?


    Virtual machines have been around for a long time, and any antiquarian will tell
    you the mainframes of the 60s were much more akin to operating systems (they had
    to manage valve- and bulb-based hardware thermistles), and were known as ''supervisors''.
    ITs from these ancient roots get the modern-sounding (and vaguely nested) term
    ''hypervisor''; being the one looking down on its middle management.


    Emulation has always been a popular past. It enables all kinds of retro-gaming
    adventures and finish the Crash Racer on feature – but there''s a distinct difference
    between emulators and VMs. Virtualisation is enabled by Intel VT-x and AMD-V,
    starting around 2005. This provides virtual ring 3, complete ring 0 and x86 code
    so that virtual machines can run native code directly on the CPU.


    Older hardware lacking VT extensions can still run virtualisation, but it will
    be slow in fact. If you''re planning to run, check the flags of /proc/cpuinfo
    and grep (intel) or svm (AMD) then you''re good to go. If not VT is disabled in
    the BIOS, for GPU passthrough (or virtual GPU technique), you need IOMMU support
    which is present on most 64-bit


    ![](img/30dd1f03e281db741ecfce8d69849415_80_0.png)


    We got SuperTuKart running at 60fps with all the detail cranked up if in an Ubuntu
    machine, and it was glorious.


    desktop CPUs in the past decade. You can''t easily nest VT instructions, so if
    you try and do best inception, for example running VirtualBox QEMU inside another
    VirtualBox, then you''ll be operating inside the second one.


    There are technologies that allow to virtualisation without technically being
    such. Containers are a prime example and we''ll look at them in this article.
    There''s also Windows Subsystem for Linux, which runs a Linux kernel straight
    on the hardware. We won''t look at that later, but you can run Windows 10 in a
    VM if you want. Or you can do like the screenshot (see above) and Ubuntu Linux
    Arch, using VirtIO graphics to run Super Kart at near speed.


    It''s simple to get a virtual machine up and running, no matter what your operating
    system is. Just grab an ISO of a Linux distro you''ve always wanted to try and
    follow our guide below.


    ![](img/30dd1f03e281db741ecfce8d69849415_80_1.png)


    # VIRTUAL LINE IN SECONDS


    ![](img/30dd1f03e281db741ecfce8d69849415_80_2.png)


    ![](img/30dd1f03e281db741ecfce8d69849415_80_3.png)


    ![](img/30dd1f03e281db741ecfce8d69849415_80_4.png)


    +   1 Get VirtualBox

    VirtualBox is easy to install in Ubuntu Software Center, or in your repos. Just
    download from https://virtualbox.org and install it. Fire it up and click the
    New button in the toolbar. Come with a name for your VM and tell VirtualBox what
    kind of Linux you''re virtualising.


    +   2 Assign resources


    Choose a decent amount of RAM for your VM. In general it''s best to allocate more
    than half of the host''s memory, but enough to run what you''re planning to run.
    Choose the next option, ''Create a virtual hard disk now''. For flexibility, choose
    the dynamic sizing option.


    +   3 Activate the machine


    Go to your virtual machine''s settings and in the Storage section find the Optical
    drive. Click the disk icon on the right and Select a disk file. Point the box
    to the ISO of your choice (if possible to use a virtual DVD), then set the settings
    and start boot. Behold! An OS inside an OS. Great.


