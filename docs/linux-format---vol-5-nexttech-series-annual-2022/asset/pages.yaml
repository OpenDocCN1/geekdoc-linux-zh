  md: '# Environment sensors


    With sensors and neat tidy cables, that we grow our gardens.


    Last issue''s monitoring feature showed how your PC''s CPU temperature could be
    displayed and graphed by a Pi with an LCD display. For this project we will take
    that idea further and measure a greater range of accuracy variables. Thermistors
    and most components that measure such factors are analog, so they''re immediately
    suitable for the Pi, which only has digital (GPIO) inputs. With HATs like the
    Grove, it''s easy to get your Pi talking to analogue sensors. We used a high accuracy
    temperature sensor, a moisture meter, and a light sensor, but getting them working
    with GrovePi is super easy.


    We haven''t covered Pi (any model will do), but if you want to set it up SSH and
