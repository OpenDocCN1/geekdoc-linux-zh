    We briefly alluded to VirGL graphics, and earlier you may have spotted the 3D
    acceleration checkbox in VirGL-virtual video settings. We noticed that there''s
    an OpenGL in the Display Space, and which list type is not only to run to work.
    Check inside your VMs by running globo-info and looking at the beginning output
    you should see:


    ```

    GL_RENDERER = virgl

    ```


    signing that the 3D capabilities of the host system are being used directly


    through the VirGL (or pronounced Virgil) rendering, splitting the cogs of entity
    to spin smoothly. You can go further and dedicate an entire graphics card (or
    if you need it) to a VM. Your reality is to use PCIe passthrough in VFIO and for
    up-to-date info check the Arch Wiki. We also found


    Looking glass at all with this, so you should really visit https://github.io to
    find out more.


    If you have a recent Intel chipset (Broadwell or later) you can use one of the
    integrated GPU which enables you to pass through the onboard graphics, exposing
    a virtual GPU that will go as fast as the real thing, while still using some of
    its memory (on the host). Radeon Pro and Nvidia Quadro cards have similar features
    by different names, too.


