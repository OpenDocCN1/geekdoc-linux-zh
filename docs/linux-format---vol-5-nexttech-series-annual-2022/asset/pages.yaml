    Finally, we''ve used ranges with ''handles'' to define the sequence of pages in
    the output file. There are many different ways to specify the order of pages when
    working with pdfcat. By using numbers, such as 14 or 20-32, you can also include
    certain words except one, or even range pdfcat includes all pages in the file.


