    # # FORTRESS LINUX!


    Linux is pretty secure, but the ever-vigilant Jonni Bidwell has studied the threatscape
    and recommends applying reinforcements...


    As humanity becomes more connected to our lives and information about them ineluctably
    online. In times past, the only information about citizens was held in parish
    chambers and consisted of little more than names, occupations and dates of birth.
    A few conquests and burned libraries in history show government buildings, regular
    folks having bank accounts and companies to store and share data among themselves.
    You might have found yourself in a phone directory or found yourself in a lonely
    heart''s column.


    From fact to today an average human generates information of a day (and counting),
    companies, authorities and criminals would love to get their hands on. Some of
    this information is stored at home, or some of it we perhaps


    unwisely entrust to the clouds and some of it we don''t even pause to consider
    where it goes. Put a few pieces of security credentials in the heavy hands and
    precious memories can be deleted, bank accounts can be identified and stolen.


    Linux can''t stop government-mandated three-letter agencies hoing over your data
    and metadata (though it can make stop handling data over social media (which we
    can handle geotag and EXIF data). But it does have sorts of tooling that can protect
    your systems from being compromised and your data purloined to ransom or worse.


    We''ll look at firewalls, password managers, PPG messages, SSH keys and much more.
    We spend a lot of time in a web browser (Firefox BTW) and we''ll wager we go a
    whole section about safe browsing. Let''s get started.


