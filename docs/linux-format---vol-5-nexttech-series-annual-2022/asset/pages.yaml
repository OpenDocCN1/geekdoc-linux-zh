  md: '# # Linux Formal Annual 2022


    # ## QUICK TIP


    The ocrmypdf utility exits with an error if the specified PDF file has already
    OCR. You can use either the reduce-ocr or the force-ocr options in these cases.


    changing the rotation of any page in the PDF file, or encrypting the PDF file
    with a password.


    As with the other utilities that we''ve discussed in this tutorial, you will have
    to use the software management tool to install pdft from the software repositories.


    To perform a merge operation, where you join several small PDFs into a single
    document, the tool expects a spaced list of PDF files in the order you want and
    the name of the output file.


    ```

    $ pdfmerge input1.pdf input2.pdf input3.pdf fourth.pdf combined.pdf

    ```


    # ## Combine PDFs


    You can use pdf to string together as many PDF files as you like, you can also
    specify the files in the order you want in the output file. If all the files are
    sequentially numbered or by name, you can also use pdftk with wildcard instead
    of typing the name of each individual file:


    ```

    $ pdfcombine output mixed.pdf

    ```


    These examples will add all the pages of the input to the output, but you may
    on occasion want to use specific pages from different PDF files. You can do that
    by using the -cat option:


    ```

    $ pdfcat A-first-file.pdf B-second-file.pdf cat A1-3 B2-5 output mixed.pdf

    ```


    Now we''ve used the A & B for different files. These are called ''handles''. You
    can also use multiple ''handles'' with pdfcat where each handle is a separate
    PDF file. You''ll also notice that the


