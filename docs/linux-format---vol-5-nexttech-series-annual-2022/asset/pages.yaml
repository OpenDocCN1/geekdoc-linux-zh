  md: '# # Pi-based KVM over IP


    Use your Pi as a remote control for your PC, even if it won''t boot on an OS.


    Those who have needed to access a PC remotely will probably have tried VPN or
    other applications such as TeamViewer. However, this kind of software only works
    within the remote computer''s OS, which means you cannot access the BIOS, reboot,
    install or power on the computer. There are several solutions that make it possible
    to control a PC independently of its operating system, and a KVM over IP is one
    of the most convenient and affordable ways.


    A well-made KVM over IP device can cost hundreds of pounds, it is easy to use
    a Raspberry Pi to build your own. A novel system by David Mayo (http://kvm.org/).
    If you have the parts, you can use the software that Pi-kvm provides, and with
    your Pi, to do it for far cheaper.


    Here, we will show how to build your own Raspberry Pi-based KVM over IP that provides
    output control, GPIO ports and USB ports, configure server using ATX functions
    and you''ll be able to control the whole via a web browser from another device
    on your network.


    # ## Download image


    The first thing we need is to download the SD card image from depending on which
    Raspberry Pi you use and whether you use the HDMI-to-CSI or HDMI-to-USB adapter.
    The file is l-compressed, so Etcher can handle this automatically, so follow the
    guide from earlier and write it to an SD card.


    Now we move on to installing the HDMI-to-CSI cable and connecting the ribbon cable
    from the HDMI-to-CSI to the Raspberry Pi''s camera port. Make sure that the blue
    faces match the black. If you''re using an HDMI-to-USB dongle, connect it to a
    USB port on your Pi. If you''re using a Pi Zero then you will need a USB-to-Type
    A adapter.


    Disable the 5v pin on the USB-Type A connector that connects to your supply. It
    is easier to place a small piece of Kapton tape over the right-most pin on the
    connector. You could also try cutting the lead to that pin, that''s more complicated.
    This will be the connector that attaches to a USB port on the PC you wish to control.
    If you don''t disable


    # ## YOU NEED


    +   > Raspberry Pi 4 or Zero


    +   > HDMI-to-CSI or HDMI-to-USB capture dongle


    +   > USB female-to-male Type A adapter


    +   > USB C to Type-A cable


    5V power supply with USB Type-A output. You will be plugging a Type-A cable into
    it so the official Raspberry Pi power won''t drop


    # ## Pi-KVM software


    At this point we are ready to start up the Pi-KVM. On first boot it''ll take longer
    to expand the microSD card. Just wait - it won''t last long. Find the Pi''s IP
    address in your router''s control panel or use Nmap in a browser of your computer
    client (if you''re using to control the Pi). You''ll be redirected to the login
    page, which should log into username and password.


    Click the KVM icon. You will be presented with a screen allowing you access to
    the remote PC and a number of options. Further instructions are available on the
    Pi-KVM GitHub.


    ![](img/30dd1f03e281db741ecfce8d69849415_172_0.png)'
