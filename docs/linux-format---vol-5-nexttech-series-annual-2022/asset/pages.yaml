    # Jitsi Meet


    Set up secure and self-host your own videoconencing nirvana, and you''ll never
    have to use Zoom.


    ![](img/30dd1f03e281db741ecfce8d69849415_117_0.png)


    Jitsi is a completely free, open source videoconferencing program that can connect
    via a browser or smartphone app. You can use it now by visiting meet.jitsi.si
    and choosing any version (including one of the others randomly). There are no
    downloads or configuration required; they just need to click a link which they
    share from within the meeting room. Or they can also connect with a PIN.


    Obviously Jitsi free service has some limitations, but these will vanish when
    we host our own Jitsi installation. You don''t need particularly special hardware
    to do this, and thanks to excellent Debian and Ubuntu you don''t really need to
    do in the way of configuration at all. You will only need a name for your conference
    service such as DkDs or Dynord with.


    just use IP addresses directly. But it''s probably easier in that to have an in-person
    (where''s the fun in that--Ed) conversation rather than installing the machines.
    If you do, you can automatically generate Let''s Encrypt certificates, and then
    won''t need to see them anymore.


    Jitsi is a collection of servers, all working in harmony to help build smiley
    faces closer in a world that grows ever more connected on web with pretty wild
    JavaScript. Most of the office is written in Java...


    The magic of connecting more than two participants is handled by Jitsi VideoBridge
    (JVB). This uses the XMPP (like Jabberd) and WebRTC (like Google Meet) protocol
    to route video and audio. Deciding which participant is, and who uses ''focused''
    on their screens, is handled by Jitsi Videobridge Focus. All the video processing
    and decoding is handled on the user side. At the heart of all the ProsMPX server
    keeps all these components secured. You''ll find more information about how it
    works.


    As you can imagine (and we''ll look at it in a moment if you can), the Jitsi is
    a complicated affair. After not you don''t have to manage the variance through
    native gateways paths (like STUN and our routers), we also need to set it up with
    SSL, so you should create and use a self-signed certificate, or your users will
    see scary warnings.


    https://jitsi.github.io/Handbook


    Jitsi Probably too much


    If you''re happy for you to use Jitsi there are some warnings (or brave enough
    to add an extra to your browser), using a bogus domain name and fudge /etc hosts
    to resolve this to machine. Or we


    In order for Jitsi to work without STUN back, firewalls or obstacles in the stack,
    XMPP messages and web traffic must be able to flow to your server. So you need
    to open UDP ports 10000 and 4444, and TCP port 4443 can be used for communications
    (UDP connections are blocked for a) server). If you''re building this home under
    router, you''ll need to configure this stuff too.


