  md: '# Get your kit ready


    Prepare your USB cables, SD cards and a cup of tea.

    It''s Raspberry Pi project time...


    With more than 34 million units sold, the Raspberry Pi is not only one of the
    world''s most popular computers – it''s also one of the most important. Designed
    to keep kids engaged this impressive, single-board system is the leading choice
    for makers, developers and hobbyists who want to do anything building industrial
    robots to setting up retro arcade machines. Whether you''re eight or 80, you will
    love the Raspberry Pi is made for you. And there are many models from £5 to £65
    to suit any budget.


    Whatever you do with your Raspberry Pi, you''re going to need an SD card and an
    operating system. The official Raspberry Pi OS (formerly Raspian) is a popular
    choice and in many cases a great start for many projects. Discover more at www.raspberrypi.org/software/operating-systems.
    There''s an official Raspberry Pi Imager that you can use (or one of other OSs)
    to an SD card, or use any tool that has the advantage of being able to handle
    compressed images.


    ![](img/30dd1f03e281db741ecfce8d69849415_168_0.png)


    Cheap power supplies are another cause of errors. The Pi 3 and 4 are less of a
    problem, or they''ll get a goofy 5.2V or they switched power input from micro
    to USB-C, and unfortunately this new port isn''t USB-C compliant. If you use a
    fake smart charger, it won''t power the device, or it might damage your Pi.


    > The latest incarnation of the Pi, the 400 model, embeds a Pi 4 also pictured,
    within a keyboard.


    You won''t run into these issues if you use the official charger, so that. If
    you''re opposed to that, we''ll need that cheaper USB-C cables-ones that last
    the charge-fine. Cheap chargers should work well, but they may not be so reliable,
    so caveat ever.


    We''ve handpicked some useful, fun and interesting projects to show the true scope
    of things that can be achieved with the humble Pi. From gaming to machine learning
    and Bitcoin, the possibilities are endless...


    # Troubleshooting


    Throughout this feature we''ll use few different OS images, we''ve made a handy
    guide to writing them below. If you run into troubles, it''s worth remembering
    that a faulty card might be to blame. So it''s worth trying a different one if
    things goes wrong.


    # WRITING SD CARD WITH ETCHER


    ![](img/30dd1f03e281db741ecfce8d69849415_168_1.png)


    +   1 Download Etcher

    nYou''ll find Linux, macOS and Windows builds at https://etcher.io. On Linux it''s
    a zip file, so you just need to unzip it, run it. chmod 755 on the file (see Properties*)nPermissions
    and check the box to allow execution). You can now double-click the Appimage to
    run it (or so from the CL).


    +   2 Prepare the target

    Insert your SD card, select the Flash from file option and navigate to downloaded
    image. Select Card and available drives. Drives are hidden to prevent you from
    accidentally overwriting them. Use your card reader, and to make sure there''s
