  md: '# Linux Format 2022


    # # Image recognition


    Get into machine learning and train your Pi to recognize and classify other Pis,
    without having to write a single line of code.


    # YOU NEED


    +   - Raspberry Pi 3, 4 or 400

    - 8GB (larger) microSD card

    - Raspberry Pi Camera or a USB webcam

    - Power supply for your Raspberry Pi

    - Smartphone for taking photos

    - Selection of Pis or other objects for classification


    We''re going to train our Raspberry Pi to identify Raspberry Pis (or objects)
    with machine learning (ML). Why is this important? It''s an industrial application
    for this type of ML. Detecting defects in circuit boards is easy when a machine
    can be trained to identify a defective circuit for troubleshooting. Home has some
    neat machine learning and artificial intelligence tutorials for face recognition
    and face detection. In those projects, all the training images were stored locally
    on the Raspberry and the training model was built on the Pi. In this tutorial,
    we''ll use a web platform called Edge Image to create and train our model to allow
    it to run. One advantage of Edge Image is that it can run from a (smartphone)
    without having to install an app.


    We will use BalenaCloud instead of the standard Raspberry OS because the folks
    at Balena have prebuilt an API to call Edge. The previous recognition and face
    mask identification tutorials required complex command line interface packages
    and Python code. This project replaces commands and interfaces with an intuitive
    GUI.


    Scan it and open in browser and you''ll be taken to a data collection site. You
    won''t need to download or install apps.


    Accept permissions on your smartphone and take Collecting images? Tap the label
    and enter a tag for the object you want to identify. Take at least 30 photos.
    Some will be used for training and others will be used for testing the model.
    Edge Image automatically splits photos between training and testing. Repeat the
    process for each label until you have 30-50 photos per object you need. We recommend
    to five identified objects for your initial model. You''ll have to re-train the
    model if you want more objects.


    # Training on the Edge


    Go to //edgeimage.com and create a free account (login), from a browser on your
    phone or desktop. Select Data Acquisition from the menu left. You can upload photos
    from your desktop or scan a QR code with your smartphone. This will is ideal for
    taking photos with our smartphone: Show QR code and a QR code to setup your project.


    # Impulse design


    Click Impulse design in the left column. Click Add a block and select Image to
    add an image to the second column. From the next block, select Learning. Click
    the Impulse button on the right. Click Impulse design in the left column. Select
    General features to the recognition. Select the top of of the Training set block.


    From the Data Acquisition block in Impulse window, you should see the total number
    of photos (collected) and the number of labels you''ve classified. Map the refresh
    to update. You can click any of the data collection samples to view uploaded data.


    ![](img/30dd1f03e281db741ecfce8d69849415_169_0.png)


    You can collect data from developments, from your own devices, or by uploading
    an dataset.


    Use your phone


    Select your phone to upload photos, audio, or images, and then next.


    Data any from the data development


    Select from computer or desktop or over a network connection.


    Upload data


    Select the file to upload your datasets directly in lets, [jpg, PNG, CSV]


    Integrate with your cloud


    Select the option where Balena Impulse integrates directly with the data stored
    in your platform.


    It takes five minutes (or more) to train depending on how many images you have
    uploaded. Select learning for running, select your settings (data augmentation
    block), and click Start. After training, you''ll be able to see the predicted
    accuracy of the model. For this example, the model in the algorithm can only identify
    a Raspberry Pi 3 64.3 percent of the time and will misclassify a Pi 3 as a Pi
    Zero 28.6.


    Besides images from your mobile device.


    Edge can connect to all of data sources


