    # # Manipulate and work with PDF files


    Shashank Sharma breaks down the different things you can do with PDF files, apart
    from reading and creating them from the bleakness of a terminal.


    ![](img/30dd1f03e281db741ecfce8d69849415_57_0.png)


    According to the statistics released by Adobe in 2018, as part of the 25th anniversary
    of PDF more than 200 billion PDF files were accessed using Adobe products in 2017.
    The years, and taking into account indicate a large number of PDF files accessed
    in a year, or even on a daily basis.


    desktop, taken using your camera or a DSLR, you''ll end up with a PDF file where
    each page is of a different size. You can overcome this problem by specifying
    the size, and other parameters with the convert command:


    ```

    `convert image1.png image2.png image3.png output.pdf`

    ```


    The trusted and popular document format started its journey as a proprietary format
    at Adobe in 1993. Today, there are available a large number of graphical and command-line
    tools that can be used for manipulating PDF files.


    You can use the -quality and -resize to affect the final PDF file. The extract
    command will demand upon you to take some time if you use ImageMagick for your
    purpose of output files, and in large PDF files.


    Here, we will discuss splitting PDF files into single ones, or merging multiple
    files into a single PDF file. We will also discuss how to shrink the size of a
    PDF. We will run qpdf on your PDF files, extract text, or encrypt PDFs.


    If you want to keep the size of the original image, ImageMagick works by default
    in most distributions, you can stitch multiple images into a single PDF and also
    specify the size of the result with the following command:


    ```

    `magick image1.png image2.png image3.png output.pdf`

    ```


    # ### Creating a PDF from image


    the -page command option expects an insensitive value, and to manually specifying
    the length and width of the page, also supports various sizes as A4, Letter, and
    S.


    It''s a common practice to use your cell phone to digit documents. Unless using
    a dedicated scanner, you will end up with PDF files. You can convert these images
    into PDFs using the ImageMagick suite.


    How you can also alter colors in your PDF, by changing the portrait to landscape
    orientation. Use the -page option


    ImageMagick is a suite of command-line tools that allow you to perform various
    operations on images. If you are creating GIFs, or overlayering images, these
    can be performed using one of the included tools.


    ```

    `qpdf --landscape input.pdf output.pdf`

    ```


    However, the convert can also be used to stitch multiple files into a PDF.


    The simple command expects a series of images and the output file as arguments.
    It works well if all your images are the same size - have the same resolution
