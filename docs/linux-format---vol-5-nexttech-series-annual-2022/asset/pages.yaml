    # ## Sketch to


    We''re going to take a sketch and turn it into a 3D object in Blender. For this,
    we''ll assume you''ve already got a black-and-white 3D object. This example starts
    with a sketch. There''s no reason not to create something amazing in Inkscape,
    using its excellent facilities available. All you have to do is to turn it into
    a shape inside Inkscape, either as an SVG and then import it into Blender.


    Inkscape is the ideal starting point for this type of work, and we''ll use it
    to prepare the image for importing into Blender, and we''ll assume you''ve already
    set everything up. We''re going to scale the sketch to a vector object, a collection
    of lines and curves, rather than an image of pixels.


    > QUICK TIP

    Rely on Undo (Ctrl+Z) to explore techniques, but remember that there are a limited
