    You find that your data - represents numbers for 3 and 5 elements, because the
    zeros are on the tape, starting at position 0, with the left-hand head. Now try
    to execute the TM using the first and execute the next rule button which is the
    third button after Current State, and the one that looks like a footstep with
    forward


    # >> TURING MACHINES


    Although modern Turing Machines are more powerful than the original, it''s an
    interesting difference. That the grid of cells enable graphical patterns to be
    calculated and displayed, if colours are written to contain letters or numbers.

    When you read about ordinary 2D TMs, the only difference is that the read/write
    head is able to move left, right, up, or down. So the movements are defined absolutely,
    so we can use the current position of the head as a turn of the figure and defined
    as 0, 90, or 180 degrees, after which the head moves. If you''re looking for simulations
    of 2D TMs they''re often called Turing, and there doesn''t seem to be as many
    native Linux applications as ours


    To get feels, go to https://mcodit.github.io/ and run the Turing definition. It
    proposed as for symbols, and it seems useful to try out random definitions to
    appreciate the range of behaviors that can result from repeating a simple set
    of rules.


