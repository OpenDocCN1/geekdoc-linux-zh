    ## Network storage


    Linux isn''t just a desktop operating system; it also comes in versions that do
    a specific job. FreeNAS is one such example—an operating system that will turn
    your computer into a fully functional network attached storage (NAS) device that
    will enable you to share your files and documents all over your house. In this
    chapter, we will show you how to install and configure FreeNAS.


    ## CHAPTER 7

    ### Making your own NAS


    If you have an old PC sitting around doing, you could turn it into network storage
    utilizing the powerful FreeNAS system. An old PC can easily go to waste, with
    FreeNAS you can make good use of it and turn it into a powerful network-attached
    storage (NAS) device. Best thing of all is that FreeNAS, as its name suggests,
    is completely free. Unlike commercially available NAS devices, FreeNAS has a wealth
    of features and, as you are using a PC, the ability to support a lot of hard disks.
    We''ll show you how to install and share files, with pages 136 to 139 covering
    configuration options.


    To install FreeNAS on an old PC, you need a computer with at least one hard disk
    and an optical drive. The best installation of FreeNAS uses a USB drive. You''ll
    need a drive with at least 64MB of disk space; if you don''t have one, to start,
    download the ISO of the operating system from freenas.org. There are two versions
    for download: for Intel processors and one for AMD 64-bit processors. Make sure
    you select the right version, and download the ISO to your PC. This is an image
    of a CD that needs to be written to a blank disc (see page 46 for details). For
    Windows users, use burn.


    ## GIVE IT BOOT


    Once the files are on a CD, you can boot from the disc on the computer you''ll
    use for FreeNAS. Before you do, there are some configuration options you need
    to adjust. First, for maximum flexibility you should install FreeNAS on a USB
    flash disk for free. To do this, insert your USB drive and enter the BIOS setup
    (normally you have to press Delete, F10, or F12). Typically USB boot orders are
    listed here. You may have an option to select USB flash drive from the Boot menu
    or the option to make Boot Devices. In our case the USB drive was detected as
    a hard disk and we had to select it as first.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_133_0.png)


    If you can''t boot from USB, you can install FreeNAS to one of your hard disks,
    but this makes configuration harder and prevents you from using this hard disk
    in RAID array. Alternatively, you can connect the drive to a USB port and boot
    the PC from the FreeNAS Live CD. Your settings will be saved automatically to
    the flash drive, there''s no installation at all. This makes trickier to upgrade
    to the latest version of FreeNAS.


