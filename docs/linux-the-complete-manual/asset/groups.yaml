    # Sharing files between Linux and Windows


    Your home network probably includes more than just your Linux PC. Here''s how
    to share files between Linux and Windows systems


    Changes are that you have at least one Windows PC at home in addition to your
    Linux system, and it makes sense to share files and folders between them. Fortunately,
    this is easy to do in Ubuntu, because Linux has the same file-sharing protocols
    Windows uses. Over the next few pages we will show you how to share files and
    folders easily.


    Linux may use a file system that''s incompatible with Windows, but sharing files
    over a network is different, both Linux and Windows use the SMB protocol for file
    sharing. This means that a file is read from the Windows or Linux hard disk, sent
    using the mutually compatible SMB protocol and saved to the receiving computer''s
    hard disk in the native format. Consequently, Linux is a simple


