    # 在笔记本电脑上安装 Ubuntu


    在便携电脑上安装 Ubuntu——即使是配置相对较低的电脑——也能让它焕发新的活力。


    Linux 的优点之一是，与 Windows 相比，它需要的资源较少。这对于笔记本电脑等低配置电脑来说特别方便。它还可以为普通笔记本电脑提速，因为 Windows
    是一个资源大户，并且并不是为小屏幕而设计的，而 Ubuntu 的设计初衷是充分利用低分辨率和相对较慢的处理速度。


    专门为高性能机器定制的 Ubuntu 网络版（Network Edition）已不再提供，但标准版本已经过调整，可以在所有电脑上运行。然而，并非所有笔记本电脑都带有安装
    Ubuntu 的驱动器，你的笔记本或电脑的情况与前四页有所不同。


    在开始之前，你需要打开电脑并进入 Windows。许多笔记本电脑或电脑需要特定的软件才能使快捷键生效。这些键在 Ubuntu 中可能仍然有效，因此最好关闭无线网络或使用其他设备。完成后，关闭电脑。


    安装文件可以从 www.ubuntu.com 免费下载。点击链接下载适用于你笔记本或电脑的 CD 级 ISO 文件，你也可以使用光盘刻录软件（来自 /cdubnerxp
    的 CDBurnerXP 是一个免费选择）将此文件写入空白光盘并从其启动，或者使用软件包附带的光盘并按照说明操作。然而，由于你们大多数人没有光驱，最好是使用
    USB 驱动器。你需要一个容量至少为 2GB 的驱动器。确保你已备份了存储在上面的任何文件，因为驱动器将被格式化。我们使用的是被 BIOS 识别的 USB
    闪存盘，因此如果驱动器无法工作，你可能需要尝试另一个。在运行有 Windows 的电脑上，将驱动器插入 PC，通过点击“开始”菜单中的“计算机”记下它的驱动器号。记住这一点至关重要，否则你可能会删除重要数据。


    > Universal USB 安装程序可以将 USB 闪存盘转换为安装 Linux 的启动盘


    ```Universal USB Installer 1.9.3 设置程序

    设置你的选择页面：

    选择一个 Linux、ISO/ZIP 文件和你的 USB 闪存盘。

    步骤 1：从下载列表中选择一个 Linux 发行版放入你的 USB 中。

    尝试其他 Live Linux ISO

    步骤 2：选择你的 "iso"

    C:\windows\ubuntu-10.04-notebook-amd64.iso

    步骤 3：选择你的 USB 闪存盘

    [x] 如果你想格式化 G 盘，请勾选此框

    点击此处访问 Universal USB Installer 获取更多帮助

    Universal USB Installer http://www.pendrivelinux.com

    ```


