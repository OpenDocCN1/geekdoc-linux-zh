    ## Getting connected


    Here we will show you how to connect your Linux PC to a local network and take
    advantage of the mobile internet


    ![](img/8ce336de6d0b78d8a67df502f94ad436_89_0.png)


    What is a computer that isn''t on a network? A few years ago, that was an old
    question. Times have changed, however, and connectivity is now as much a part
    of computing as USB flash drives and flat-screen monitors. Over the next few pages,
    we''ll outline the different options for connecting your Linux computer to your
    home network. We''ll also help you set up wireless and 3G so you can use your
    laptop on the move.


    The internet has revolutionised the way we use computers. Once, PCs were standalone
    devices communicated with the outside world through the medium of floppy disks,
    but now almost every home PC in the UK is connected to a global network. Not only
    that the connection is now provided by a high-speed broadband, the idea that you
    would forgo an internet connection is almost inconceivable; we''ve explored all
    the issues you''ll encounter when connecting your Linux PC, whether you''re at
    home or on the move.


    The good news is that if you have a home network with an internet connection,
    you can simply attach an Ethernet cable to your Linux PC and connect it to your
    broadband router. Turn it on and it will connect automatically. However, if you
    wanted to customise your setup, or if you experience problems, read the Ethernet
    connection section below. To skip to Going wireless, way of networking your computer.
    There''s no likelihood of data leakage, whereas with Wi-Fi and Ethernet has a
    considerably higher throughput. Ubuntu should have no trouble recognising any
    network built into today''s PCs or laptops.


    As long as the rest of your network is connected to the internet, several things
    should happen automatically when you boot Ubuntu. First, it will try to get an
    IP address automatically using a service called DHCP. There''s usually only one
    DHCP server on your network which is enough. Finding the router DHCP largely handles
    the hassle of deout, so you don''t need to configure anything.


    Ubuntu usually refers to Ethernet as eth0. If you have two cards, the other will
    be labelled as eth1. You can add more cards and these will be labelled in a file.


    From the Ubuntu search, run Terminal. This brings up a command line. Type ifconfig,
    some information will appear. Part of the information associated with eth contains


    > Ubuntu now supports line-wired equipment such as Ethernet LAN driver


    ## USING AN ETHERNET CONNECTION


    The typical way is to use a standard Ethernet card and cable, which plugs into
    a simple router or hub. This is arguably the most secure


    ![](img/8ce336de6d0b78d8a67df502f94ad436_89_1.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_89_2.png)


    a line that starts ''inet addr:''

    The address that follows is the IP address for your network interface.

    The first three numbers in the address are called the network address. This sequence
    of numbers will depend on how your router is configured, but on a local home network
    the default is 192.168.0.

    You''ll need to know if you want to assign a permanent or ''static'' IP address
    to your Ubuntu computer, rather than using an ever-changing DHCP address.

    This is easy to achieve.


    ### ADDRESSING THE SITUATION


    First, before you start the terminal, enter the command ''route -n''. The last
    line of the output that will contain an address like 192.168.0.1, which is the
    address of your network''s default gateway. Your broadcast router, through which
    all non-local traffic flows - for the internet. Next, enter the command ''/etc/resolv.conf''.
    The last line contains the name of the DNS server to turn names into IP addresses.
    Note down these two pieces of information.

    Select Network Connections from the System Settings. This will cause a small box
    to appear. Next select your hardwired network adapter from the list and click
    Edit. The box will pop up, displaying the network configuration options.

    Click the IPv4 Settings tab. This will show that the method of assigning an IP
    address is set to Automatic (DHCP). Use the pull-down menu to select Manual. When
    you do, the other options on the window become active. Click the Add button and
    enter the 192.168.0.50/255.255.255.0 netmask and the gateway 192.168.0.1. Apply
    your changes, close the Network Connections dialog and select the mobile broadband
    from the Network Manager.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_90_0.png)


    ## GOING WIRELESS


    Ubuntu excels at Wi-Fi networks, making it a great choice for people on the move.
    The typical way is to use a standard Ethernet card and cable, which plugs into
    a simple router or hub. This is arguably the most secure way of networking your
    computer. There''s no likelihood of data leakage, whereas with Wi-Fi and Ethernet
    has a considerably higher throughput. Ubuntu should have no trouble recognising
    any network built into today''s PCs or laptops.


    As long as the rest of your network is connected to the internet, several things
    should happen automatically when you boot Ubuntu. First, it will try to get an
    IP address automatically using a service called DHCP. There''s usually only one
    DHCP server on your network which is enough. Finding the router DHCP largely handles
    the hassle of deout, so you don''t need to configure anything.


    Ubuntu usually refers to Ethernet as eth0. If you have two cards, the other will
    be labelled as eth1. You can add more cards and these will be labelled in a file.


    From the Ubuntu search, run Terminal. This brings up a command line. Type ifconfig,
    some information will appear. Part of the information associated with eth contains


    > Ubuntu now supports line-wired equipment such as Ethernet LAN driver


    ## USING NETWORK TOOLS


    Ubuntu comes equipped with a range of network tools. For convenience, the most
    important tools have been gathered into a single multi-tab window. Open Gnome''s
    System menu, select Administration and choose the Network Tools. The window pops
    up with several tabs. Select the network you want and it will display its details
    and statistics.


    The Ping tab lets you contact other machines on your local network or over the
    internet to test if they''re running and discover how long packets take to reach
    them. The ''ping'' sends sends of packets to the destination allow you to enter
    any special details supplied by your ISP''s technical support.


    ## USING 3G MOBADBAND


    Public Wi-Fi hotspots are available in many towns and cities, but it''s sometimes
    better to use your mobile provider''s own network. Linux used to struggle with
    new external communications hardware, but those days are long gone, and longer
    have to fight with the command line to make things work. To demonstrate how Linux
    has changed, we show how to connect a Virgin Mobile 3G USB dongle.


    Insert the dongle into a convenient USB port and the New Mobile Broadband Connection
    wizard will appear. Click Forward to continue. Enter your country and broadband
    service provider, then press Forward. The window will show a summary of the connection
    and ask you to give it a name.


    Click Apply and you''ll be able to open the Network Manager icon on the little
    bar. Your new mobile option should appear in the list of known connections. Before
    you can connect, however, you need to enter your details to authenticate yourself
    to the mobile network. Reopen Network Connections and click on the Mobile Broadband


