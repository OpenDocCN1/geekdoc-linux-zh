    # Playing music files with Banshee


    Ubuntu''s built-in music player lets you organise your music, create playlists
    and listen to podcasts and internet radio stations


    Banshee Music Player is the default application for importing music. If you prefer
    Rhythmbox you can install it from the Ubuntu Software Centre. We''ll focus on
    Banshee in this guide, which is a powerful media manager you can use to rip your
    CDs to MP3 format.


    Before start, you need to install the necessary audio codecs. Click on Ubuntu
    Software Centre from the Launcher and restrict into the search bar. Double-click
    Ubuntu restricted extracts and install. You can now start Banshee.


    On the left, you''ll find a pane with your library shortcuts, music stores and
    playlists. When music sits under Library, you''ll see three panes for artist,
    album and a track listing. These will be blank, or until you import your music
    collection


    To import tracks from a CD, you need to set your import preferences. Click on
    Preferences from the Edit menu, then on the Source


    Specific tab. Select Audio CDs from the Source menu. Under Format select MP3 (Lame
    Encoder), then click Edit. Select the Bitrate that you want to use. We recommend
    a medium of 192kb/s, but 320kb/s will give you higher quality audio that rivals
    of the original CD.


    To import an CD, simply insert into your computer an optical drive. The disc will
    appear in the left-hand pane of Banshee and track title will be automatically
    downloaded from the internet. Right-click the CD and select Import "Audio CD"
    to convert the tracks to MP3. A status bar at the bottom shows how far through
    the process it is. When it''s finished, you can remove your CD.


    # IMPORTING OLD MUSIC


    The best place to store tracks that you already have in MP3 format is in the Music
    folder, which you can access in Ubuntu''s Places menu. To import your existing
    MP3 tracks, head to the media menu in Banshee and choose Folders, then click Import.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_73_0.png)


    > The first job you need to do in Banshee is import your music collection


    ![](img/8ce336de6d0b78d8a67df502f94ad436_73_1.png)


    > Banshee supports album art and will show garish visualizations when playing
    tracks if you so desire


    ![](img/8ce336de6d0b78d8a67df502f94ad436_73_2.png)'
