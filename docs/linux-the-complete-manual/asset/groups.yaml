    # 在 Linux 和 Windows 之间共享文件


    你的家庭网络可能包含不仅仅是 Linux PC。以下是如何在 Linux 和 Windows 系统之间共享文件。


    变化在于，你家里除了 Linux 系统外，至少有一台 Windows PC，并且在它们之间共享文件和文件夹很有意义。幸运的是，这在 Ubuntu 中很容易实现，因为
    Linux 使用与 Windows 相同的文件共享协议。在接下来的几页中，我们将向你展示如何轻松共享文件和文件夹。


    Linux 可能使用与 Windows 不兼容的文件系统，但通过网络共享文件是不同的；Linux 和 Windows 都使用 SMB 协议进行文件共享。这意味着文件从
    Windows 或 Linux 硬盘中读取，使用互兼容的 SMB 协议发送，并以原生格式保存到接收计算机的硬盘中。因此，Linux 是一个易于集成到网络中的操作系统。你所需的所有工具都是内置的，因此在
    Linux PC 和 Windows PC 之间共享文件和文件夹非常简单。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_39_0.png)


    ## 了解 Linux


    如果发生这种情况，你可以重命名 Linux 文件夹（因为它字符少于 12 个），或者你可以更改共享名称（共享名称基本上是网络计算机查看文件夹的方式），而保持
    Linux 文件夹不变。第二种方案是最简单的。在我们的示例中，我们共享了共享名称 ''docs''。你可以在注释框中添加共享文件夹的说明，这是可选的。


    有两个选项可以选择。默认情况下，每个文件夹都是只读的，因此其他人无法修改现有文件或写入新文件。如果你想在此文件夹中创建和删除文件，请点击。如果你想允许用户进行读写访问并输入，请选择“访客”（Guest）。完成后，点击“创建共享”。你创建的每个共享都可能会弹出一个对话框，提示你需要权限，在这种情况下，你应该点击“允许权限”。你的共享文件夹上方将有一个红色箭头，表示它已共享。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_40_0.png)


    ## 共享大同小异


    从原则上说，在 Linux 中共享文件夹与在 Windows 中完全相同。你可以共享任何需要的文件夹。要创建并共享新文件夹，首先点击“位置”（Places），“文档”（Documents）查看你的文档，然后右键点击并选择“新建文件夹”。给文件夹一个合适的名称，例如
    My Shared Files，并按回车。


    要共享该文件夹，右键点击它并选择“共享选项”。勾选“共享此文件夹”复选框，你会看到一个对话框提示未安装共享服务。点击下一个对话框中的“安装服务”按钮并按确定。共享服务将自动下载并安装。你需要重启以继续。


    一旦你重新登录计算机，回到你的新文件夹，右键点击它并选择“共享选项”。勾选“共享此文件夹”框后，其他选项将不再显示为灰色。在对话框底部，有一条消息提示你共享名称过长——这是因为共享文件夹的名称最多允许为
    12 个字符。


    - 共享服务将自动下载并安装

    - 按照正常方式创建一个新文件夹来存放你的共享文件


    在从另一台计算机访问你的共享文件夹之前，你需要找到主机（计算机）名称，打开终端窗口（可以在搜索框中输入 ''terminal'' 或前往菜单>应用程序>终端）。输入
    ''hostname'' 并记录你的计算机。接下来，输入 ''ifconfig'' 查看 IP 地址。输入（可能是 eth0）你的网卡名称。''inet addr''
    之后的数字应该像 192.168.0.3。


