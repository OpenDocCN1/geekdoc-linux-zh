    Windows 7 开始菜单。


    点击此图标启动 Ubuntu 软件中心（Ubuntu Software Centre），你可以从中安装和删除应用程序。有数千个应用程序供选择，它们将从互联网自动下载。


    点击此按钮可以缩小并查看所有可用的工作空间，这些是虚拟桌面。你可以在工作空间之间拖放应用程序，保持桌面整洁不乱。


    这是 Ubuntu 的垃圾箱（Wastebasket）。它的工作方式与 Windows 的回收站完全相同，允许你恢复已删除的文件。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_21_0.png)


    启动器（Launcher）是一个用于应用程序快捷方式的专用栏。正在运行的应用程序旁边会有白色箭头。要将应用程序保留在启动器中，右键点击它并选择“保留在启动器中”。要从启动器删除应用程序，只需取消勾选。如果启动器消失了，将鼠标移动到屏幕左侧。


    这是通知区域，看起来和 Windows 一样。图标出现在这里，通知你各种功能的状态。在这里你可以看到蓝色条指示的 Wi-Fi 信号强度，并通过点击扬声器图标静音量。点击信封会显示列出所有消息应用程序的菜单，包括
    Empathy（它是 Ubuntu 的默认消息应用）。


    点击你的用户名会弹出一个类似于 Windows 关机的菜单。这允许你重启电脑、进入睡眠模式、切换到不同的用户账户或关闭电脑。用户名左侧的图标显示你当前的即时消息状态。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_22_0.png)


    与 Mac OS X 一样，应用程序共享一个标题栏，其中包含菜单（文件、帮助等）。将鼠标悬停在此区域即可查看可用菜单。


    在 Ubuntu 中，浏览文件和文件夹非常简单。如果你在 Windows 中可以操作，在这里你也会感到很熟悉。几乎所有东西感觉是一样的，从菜单到导航图标和文件夹列表。像
    Windows 一样，预创建了“文档”、“音乐”、“图片”和“视频”文件夹。


    # 添加外设


    如果安装硬件的想法让你对 Linux望而却步，请重新考虑一下：现在在 Ubuntu 中添加外设变得非常容易。曾几何时，在一个句子里同时使用“Linux”和“硬件”足以让
    IT 专家流泪，但仅此而已。Linux 已经成熟，处理外设时像 Windows 一样简单。在过去的几年里，开源开发者一直为各种外设编写驱动程序和应用程序。USB
    和蓝牙让他们的工作变得更容易，但与任何操作系统一样，仍然有一些需要注意的问题。Windows 在当前硬件上存在问题，而 Linux 则倾向于让过时的硬件引起问题。在
    Ubuntu 中，流行的硬件非常好，你可能面临的问题只是决定想用设备运行哪些应用程序。接下来的几页将展示如何使用 Ubuntu 安装一系列常用外设。


    # 音频建议


    在 Linux 中让音频硬件运行起来应该没有任何问题，任何现代声卡都可以直接工作。Linux 管理音频硬件的方式与 Windows 不同，因此值得仔细观察一下发生了什么。


    点击 Ubuntu 标志并输入“系统设置”（System Settings）并按回车加载控制中心。如果你在播放 CD 时听不到声音，请选择“音频”（Sound）选项，这应该是第一个检查的地方。“音频偏好”（Sound
    Preferences）在下拉菜单中列出可用设备。在很多情况下，这些都属于同一块声卡。一个常见问题是将声器插入 PC 的模拟接口，却让 Linux 使用数字输出。如果你在音频偏好对话框的选定设备名称中看到“数字”（Digital）字样，这个错误应该是显而易见的。要修复此问题，将其更改为“模拟立体双工”（Analog
    Stereo Duplex）并点击测试。这应该产生音调。如果没有，尝试将设备类型改为“打开音频系统”（OSS）下拉选项。如果你仍然听不到声音，请查看 Alsa
    部分。你还可以使用此对话框更改特定系统事件播放的声音。点击“声音”（Sounds）选项卡，你会看到事件列表，每个事件的状态为“默认”（Default）或“禁用”（Disabled）。如果你点击状态并选择“自定义”（Custom），你可以导航到声音文件或网络
    URL。一旦板载音频正常，你可以直接从任何 USB MP3 播放器播放音乐。


