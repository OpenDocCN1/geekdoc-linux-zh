    a backup, and so require a less disk space. To perform a full restoration of your
    data from an incremental backup, however, you will also need a copy of the full
    backup. Incremental backups should be made more regularly, we suggest doing this
    at once a day.


    ## TREAT YOUR MEDIA WITH CARE


    From the previous two pages, you''ve worked out which type of backup media of
    choice; it''s important that you protect your backup media and treat it carefully;
    dropping your backup disk isn''t only expensive, but may cause you to lose all
    your data. For important data you should even consider using two drives, one set
    away from your house, such as with a friend.


    Ubuntu has a backup utility called Simple Backups, which is incredibly easy to
    use and configure. Here we''ll show you how to use it.


    > Ubuntu has default folders for all your data; it''s worth making to backup up
    easier


    ![](img/8ce336de6d0b78d8a67df502f94ad436_123_0.png)


    ## BACKUP TYPES


    There are two types of file backup that you can make: full and incremental. A
    full backup, as its name implies, backs all your files regardless of when they
    were modified. You should make at least one full backup a week, so that you''ve
    got a copy of every file that you need.


    The downside with full backups is that they take up a lot of disk space. If you
    only run full backups you could end up backing up exactly the same files time
    after time. For this reason, there are incremental backups.


    ## SYSTEM HEALTH


    ![](img/8ce336de6d0b78d8a67df502f94ad436_124_0.png)


