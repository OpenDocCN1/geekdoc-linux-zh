    > You can share music from FreeNAS to iTunes using its

    > FreeNAS can share media files using its built-in UPnP server


    # ITUNES AND UPnP


    If you want to share your media files, FreeNAS makes this easy. It supports iTunes
    sharing, lets you share music files with computers running iTunes and media servers,
    and UPnP, which lets you share music with a wide range of media servers. Both
    services work in the same way, so we''ll just explain how to use UPnP:


    First you will need a folder to store all your media. This can be an existing
    folder in a share or you can create one specific using the instructions above.
    In either case, make sure that you have network access to this folder so you can
    copy new files to it, by creating a new share.


    To turn on the UPnP server, select UPnP from the Services menu and select Enable.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_140_2.png)


    | UPnP Services | | |

    |---|---|---|

    | Interface | UPnP enabled | |

    | Port | 1900 | |

    | Description | The port used for UPnP. You can choose a port other than 1900,
    but UPnP will use the one you specified. | |

    | Location | The path to the media folder. | |

    | Directory | The directory of the media files. | |

    | Password | The password for the web interface web page. | |

    | Transcoding Directory | A directory to store transcoded files | |

