    # Firewalls and internet security


    Linux may be more secure than Windows, but it''s not completely immune to attack.
    Here we show you how to protect your system.


    Linux is widely considered to be more secure than Microsoft Windows. This is partly
    because of its open-source nature, which allows anyone to spot and report programming
    errors and vulnerabilities in the operating system and its applications instantly.


    It''s not immune from attack, though. Over the next few pages we''ll show you
    how to boost your computer''s security by configuring Linux''s built-in firewall
    and anti-virus software.


    Hackers are entirely motivated by money, and they''ll try any trick to get information
    that they can sell for cash. While Linux has been relatively immune to attacks,
    as its base was too small, its increasing popularity means that hackers have the
    OS in their sights.


    As such, you need to boost the security of your computer. For starters, every
    computer on the internet needs de-facto protection from unwanted intrusions by
    hackers, for example. Linux also needs anti-virus protection. Security companies
    are now waking up to the threat posed to Linux operating systems lately, and have
    begun supplying basic Linux versions of most of their products without introducing
    any significant drain on resources or network performance.


    A number of commercial firewalls include a vast range of features. However, at
    their most basic, firewalls simply need to decide whether to allow or ''drop''
    packets based on a set of rules. Configuring a firewall is a matter of writing
    these rules to tell it which types of network traffic to let through, and which
    to block.


    - Firewall''s main interface

    - The Lock Firewall button is for use in emergencies only


    ![](img/8ce336de6d0b78d8a67df502f94ad436_107_0.png)


    ## THE FIREWALL


    The purpose of a firewall is to inspect every data packet entering or leaving
    the computer, and decide whether or not to allow it on its way or to block it.
    Firewalls are closely connected to the operating system itself and have been capable
    of running at top speed.


    Linux traditionally comes with a firewall iptables that requires system administrators
    to set it up using extensive configuration files. For the rest of us, there''s
    a friendlier one called FirewallD. Like most commonly used on Microsoft Windows,
    this is an entirely graphical application that makes configuration very simple.


    ## INSTALLING FIRESTARTER


    Firestarter is free. To install, it first starts the Ubuntu Software Centre. Type
    ''firestarter'' in the search box and press Return. The Firestarter application
    should appear in the list below the search box. Click the install button to begin
    the installation process.


    You may be asked for your password in a subsequent pop-up window. If this happens,
    enter OK and Ubuntu will download and install the latest version of Firestarter.
    Once the process is complete, click Close. Firestarter will now be installed and
    ready to protect your computer.


    ## CONFIGURING THE FIREWALL


    To open Firestarter''s user interface, first open it in the Ubuntu software centre.
    The first time you run it, enter your password to confirm you want to make changes
    to the system, you''ll see a configuration wizard. Click Forward to continue.


    The part allows you to assign the firewall to a network connection. This should
    default to Eth0 if you have a single wired connection, which most people do, so
    leave it as is unless you are using a wireless network card, or select another
    available from the pull-down list.


    Your internet gateway assigns all PCs on your network an IP when they boot up.
    Unless you''ve chosen to disable this and assign IP addresses manually, the IP
    is assigned via DHCP before the firewall button again.


    There''s no need to enable connection sharing on your Ubuntu machine, so you can
    safely press forward and finally save.


    The main Firestarter control panel will now pop up. The firewall status status
    panel should show it as being active.


    INTERNET ON LINUX


    ![](img/8ce336de6d0b78d8a67df502f94ad436_108_0.png)


    ## ACTIVE CONNECTIONS


    There are two buttons on the Firestarter control panel. The first is Lock. When
    you hit it, Ubuntu''s firewall blocks all incoming and outgoing traffic and the
    status icon changes to a padlock. It''s the button you should click if you think
    something is suspicious. Clicking this button lasts for a few seconds until the
    firewall continues allowing traffic to pass through it as you - subject to its
    security rules, of course, which we''ll come to in a moment.


    The second button on the Firestarter control panel is Stop. When you press it,
    the status changes to Disabled. Another useful part of the control panel is Active
    Connections.


    ## DIFFERENT MODES


    Firestarter works in two modes. The first is called Permissive and is the default.
    The second is Restrictive, which blocks all traffic except what you allow.


    To put Firestarter into Restrictive mode, first click the Policies tab. Now select
    Output traffic. This allows you to browse the web. In the lower pane of the Policies
    tab, right-click and select Add Rule. This produces a small pop-up window. Select
    the option "When source" to choose Anyone. Click the Add button to add your new
    rule to the list and it will be activated.


    Do the same for HTTPS (the secure version of the HTTP protocol used when buying
    online). Both HTTP and HTTPS rules have been created, press Apply.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_109_0.png) again and everything should
    work smoothly.


    If you normally need to email from Ubuntu and find that it now does not work,
    you will need to add rules for SMTP and POP3. You will also need to add a rule
    for Samba or add a rule for a port that''s not named in the list, simply enter
    it in the input box. To find out the port number for a particular type of traffic,
    visit http://tinyurl.com/portnumbers.


    ## ANTI-VIRUS SOFTWARE


    Because of its importance, Linux is beginning needing virus protection. We are
    going to show how to download and install the popular BitDefender antivirus package,
    which offers free scanning with some options. The installation process requires
    you to use the command line, but by following our instructions, it''ll be a simple
    process.


    First, you need to obtain a free personal license key. Click on Request License,
    enter your email address and country, then click the tick box to confirm you are
    a person and not a. Your license key will be emailed to you.


    Next, go to http://tinyurl.com/lymsjb and click the link. You will get the 32-bit
    run package. Otherwise, click the amd64-bit run package. This opens the download
    manager. Select save and finish click OK.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_109_1.png)

