    # 第 4 章


    ## 提升 Ubuntu 的视觉效果和体验


    多工作区、图形效果和快捷键都可以让 Linux 的使用更快、更方便。在这里，我们将向你展示如何实现。


    在默认状态下，Ubuntu Linux 在处理应用程序方面与 Windows 非常相似。然而，通过一些细微调整和设置，它可以变得更加强大。凭借其图形效果和多工作区，Ubuntu
    也可以变得比 Windows 更具吸引力且更易用。第一次使用 Ubuntu 非常简单；它的界面和窗口处理与 Windows 相似，但仅保持默认设置将限制这一优秀操作系统的实用性和运行速度。在这里，我们将解释如何让
    Ubuntu 的外观、体验和处理能力变得更好。


    页面上的方框显示了你可能需要的所有键盘快捷键，但你必须先遵循本指南才能使其生效。这种努力是值得的，因为 Linux 将变成一个惊人的图形操作系统，让 Windows
    7 望尘莫及。


    > 需要启用电脑的 3D 驱动程序才能使用 Ubuntu 的图形效果。


    - 启用驱动程序？


    ### 加速显卡驱动


    适用于 NVIDIA 显卡的 3D 加速专有显卡驱动。该驱动用于利用 NVIDIA 显卡的 3D 潜力，并为较新的显卡提供 2D加速。


    - 如果需要此驱动程序。


    如果未启用此驱动程序，你无法启用桌面效果，也无法运行需要 3D 加速的软件（例如某些游戏）。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_83_0.png)


    ## 进入图形界面


    Ubuntu 11.04 默认关闭许多效果，但没有办法可以管理它们。要实现这一点，你需要安装 Compiz 以便管理图形效果。打开 Ubuntu 软件中心，输入
    Compiz 进行搜索并安装。选择 OpenGL 窗口，然后点击桌面设置（Desktop Settings）。点击更改更改系统将进行安装。


    对于图形效果，你需要一个 3D 图形芯片。过去几年制造的任何显卡（包括所有带有集成显卡的 PC）都能应付 3D 图形。你还需要安装显卡的受限驱动程序。如果你还没有这样做，请选择屏幕顶部栏中的“受限驱动程序”图标。在出现的显卡列表中，请选择推荐项并点击应用。驱动程序将下载并安装。完成后，电脑需要重启。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_84_0.png)


    ## 基础桌面任务


    一旦安装了驱动程序，你就可以开始启用桌面效果了。这些效果都由 Compiz 管理，这是我们安装的控制其设置的应用程序。你可以在系统设置（System Settings）、个人设置（Personal）、CompConfig
    设置管理器（CompConfig Settings Manager）中找到它，从这里你可以启用所有额外的桌面效果。


    左侧面板包含各个部分的所有快捷键，我们将依次介绍。“全部”（All）列出了该页上的所有设置，而“常规”（General）仅包含基本选项。对于每个选项，你可以勾选复选框启用它，或点击文字更改高级设置。如果你尝试启用与另一个设置冲突的设置，系统会询问是否继续或继续当前设置。不要启用桌面立方体（Desktop
    Cube）或任何会禁用 Unity 插件的选项，因为这将破坏用户界面并导致你的 PC 几乎无法使用。某些选项需要你点击进入子菜单，在管理任何效果之前，你必须安装高级桌面效果设置应用程序。


    > 开启透明度（Opacity）后，你可以快速聚焦于某一个窗口，使其他窗口变透明


    ![](img/8ce336de6d0b78d8a67df502f94ad436_84_1.png)


    开启高级效果后，窗口移动时会晃动。选项包括增强桌面缩放（Enhanced Desktop Zoom）以及让文字更容易阅读的应用程序。右侧的框亮出了你需要按哪些键来激活这些快捷键。在遵循本指南时，请查看选项以确保你启用了所有想要的功能。


    - 辅助功能选项包括增强工具和透明度功能


    ## 提高辅助性


    辅助功能选项旨在让 Linux 更易使用。在这里你会找到标准的辅助功能选项，可以调整窗口颜色的亮度和对比。你可能想使用的一个功能是透明度；鼠标悬停在窗口上，所有其他窗口都会变得不透明，这样在拥挤的桌面上工作就会容易得多。


    ## 桌面操作


    桌面设置包含了与你使用电脑相关的所有功能。一旦启用了这些功能，你就会怀疑自己在没有它们的情况下是如何生存的。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_85_0.png)


    桌面壁纸（Desktop Wall）为你提供了切换工作区的方法。右侧框中的快捷键显示了如何在工作区之间移动。你也可以将应用程序拖动到屏幕侧边以旋转立方体并放置在另一个工作区。


    启用 Expo 后，同时按下 Windows 键和 S 键将缩小并显示所有工作区。你可以抓取一个窗口并移动到另一个地方。这比使用标准的任务切换器要简单得多。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_85_1.png)


    ## 窗口管理


    这些设置控制打开的窗口的方式。“缩放”（Scale）是最有趣的选项，它提供了一个类似 Mac Expos 风格的切换器。按 Shift-Alt-Up 显示所有工作区的所有窗口，或按
    Windows-W 显示当前工作区的所有窗口。然后你可以使用鼠标或光标键选择应用程序。


    ## 桌面快捷键


    - 打开搜索菜单

    -  Windows 运行命令，但它也会显示之前命令的结果。对于大多数用户来说，标准的搜索菜单是一个更简单的选择


    ## 已启用桌面效果的快捷键


    - 在工作区之间向左或向右移动

    - 在工作区之间向上或向下

    - 在所有工作区之间切换当前打开的窗口

    - 以 Mac Expos 风格查看所有工作区的所有窗口

    - 以 Mac Expos 风格查看当前工作区的所有窗口

    - 反转当前窗口的颜色

    - 反转整个屏幕的颜色

    - 鼠标滚轮缩放

    - 鼠标中键选择区域以缩放到矩形

    - 鼠标中键调整窗口大小

    - 鼠标点击窗口上的任何地方

    - 鼠标点击显示工作区


    ## 效果


    你可以使用设置来控制花哨的效果，例如晃动窗口。查看每个效果作用的最佳方法是启用它并开始使用电脑。你可能会发现某些效果过于强烈，但我们发现它们可以为桌面增添一些趣味。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_86_0.png)


    > Expo 允许你查看所有虚拟桌面，甚至在它们之间拖放文件。你可以像 Mac OS X 的 Expos 一样查看所有打开的窗口并快速切换任务


    # 第 5 章


    Ubuntu 从底层开始就是为互联网设计的。事实上，它与在线世界的整合比 Windows 更紧密，你安装的大多数应用程序会自动从网络下载。然而，有一些棘手的在线任务你可能想在
    Linux 中完成但在 Windows 中很简单，例如在线观看视频、将文件上传到你的网站等。在本章中，我们将带你了解所有这些选项，并展示如何将你的 Ubuntu
    电脑变成终极互联网 PC。


    | 连接 | 88 |

    | :--- | :--- |

    | 控制网页 | 92 |

    | 配置电子邮件 | 96 |

    | 使用 VoIP | 100 |

    | 增强你的网络浏览 | 102 |

    | 社交网络 | 104 |

    | 防墙和网络安全 | 106 |

    | 在线存储文件 | 110 |

    | 使用 FTP 上传文件 | 112 |

    | 使用 Ubuntu One 备份 | 114 |


