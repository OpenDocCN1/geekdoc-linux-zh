    # 连接其他设备


    连接到其他 Linux 计算机就像连接到 Windows 电脑简单简单。点击“位置”，“连接服务器：Windows 共享”，在“服务器”框中输入你想要连接的
    Linux 计算机名称，并点击“连接”。当你访问共享内容时，连接的 Linux 计算机会提示你输入用户名和密码。注意，你不需要更改域名。


