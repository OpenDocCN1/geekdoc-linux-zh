    ![](img/8ce336de6d0b78d8a67df502f94ad436_19_2.png)


    使用如 Disk Manager 等镜像软件备份整个硬盘，或按照笔记本电脑附带的说明创建恢复媒体。当你启动电脑时，你需要配置用户账户和电脑名称。为了安全起见，你必须输入密码，尽管你可以选择“自动登录”。为了最大的安全性，点击“登录时需要密码”和“加密我的主文件夹”并点击继续。最终文件将复制到你的硬盘并安装，这取决于你的
    USB 驱动器速度和网络连接，完成安装可能需要一段时间。完成后，点击“立即重启”。


    一旦你的电脑重启，你需要在提示符处登录。你将进入一个看起来整洁的桌面。屏幕左侧的图标允许你访问所有


    应用程序，顶部的状态栏显示当前的电池状态、未读邮件和网络状态。点击屏幕顶部的 Ubuntu 图标将你进入主菜单并点击“更新管理器”。点击“检查”按钮，让软件生成更新列表，如果有任何更新则进行安装。


    连接互联网以下载任何更新是有值的，以防电脑在安装期间没有自动更新。你还需要浏览网页、配置电子邮件等。如果你使用有线连接，它应该会自动连接。否则，点击屏幕右上角的无线图标并选择你的无线网络。在提示时输入密码并按确定。Ubuntu
    会接受错误的密码但不会警告你。然后点击连接。


    根据更新数量和网络速度，系统更新到最新版本可能需要 30 分钟。更新完成后，可能会提示你重启电脑。


    一旦电脑重启，就可以像正常一样使用了。所有的应用程序位于左侧的菜单中。现在是使用内置电子邮件客户端 Evolution 设置邮件的好时机，它将在主菜单列出。我们将在第五章详细介绍配置和使用
    Evolution。


    接下来，你应该更新 Ubuntu。点击左侧菜单中的应用程序图标，然后点击系统。滚动到最后。现在你可以使用菜单系统找到你的应用程序，并点击右上角的电源按钮关闭电脑。


