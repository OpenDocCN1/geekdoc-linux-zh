    # EXTRA HELP


    One of the best things about Firefox is that people can extend its capabilities
    by writing plugins for it. These are known as addons. The good news is that addons
    are operating-system independent, so you can use the same ones in Windows and
    Linux. To see what''s available, go to www.firefox.com/addons Here to find the
    database of addons that you can browse and search. They perform useful jobs; Download


    Statusbar, for example, displays your current downloads in a handy status bar
    using the download manager. When you''ve found an addon you like, just click the
    ''Add to Firefox'' button. When prompted, click Install. If there''s no ''Add
    to Firefox'' button, for an addon that you like the sound of, it''s probably because
    there''s no Linux version. You should search the addon database to see if there''s
    something similar.


    # Don''t bank on it ActiveX won''t work


    Microsoft''s Explorer is a proprietary technology for developing web applications.
    It used to be very popular, but many websites refuse to use it because it''s not.
    What''s more, Explorer is the only browser that supports it.


    However, some websites, as Egg Money Manager, still use the technology. This is
    a problem if you''re running Linux, as you can''t use Internet Explorer. It''s
    not a problem that''s easy to overcome, either


    Explorer can be installed using the Windows Emulator, WINE, but it''s complicated
    and you also need to copy some Windows DLL files to get ActiveX working. Because
    there''s no ActiveX for Firefox, you can''t use ActiveX in Linux without a lot
    of hassle. If you need to do so, you can search Google for help getting Internet
    Explorer installed in Linux, or use a Windows PC for those times when you need
    to access that website.


