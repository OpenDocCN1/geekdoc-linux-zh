    如果你经常需要在 Windows PC 上访问该共享文件夹，右键点击它并选择“映射网络驱动器”。从现在起，共享文件夹将作为普通驱动器出现在“此电脑”中，你可以快速访问它。


    ## 从 Linux 访问


    从 Linux PC 共享文件夹很容易。我们已经在你的 Windows 上共享了一些文件夹。若要从 Linux 系统访问它们，你需要知道你的计算机名称，最好还知道它的
    IP 地址。


    如果你想更改计算机名称，可以通过输入 ''sudo edit /etc/hostname'' 并按回车来实现。在出现的文档中，将现有名称替换为你想要的名称。


    要获取计算机名称，输入你的 Windows 计算机名称，右键点击并选择“属性”。名称将列在页面上。要获取 IP 地址，输入命令提示符 ''ping <ip>''
    并按回车。记录 IPv4 地址。


    ## 通过 Windows 连接


    一旦你拥有了所有信息，就可以从 Windows PC 连接到 Linux 计算机。如果你连接到“网络”，Linux 计算机会自动出现在 Windows 中，但这种效果并不好。最好直接连接。按
    Windows-R 运行命令，输入 \\<IP 地址>，如果无效，输入你的 Linux 计算机的 IP 地址。


    第二种方法的问题是，除非你使用静态 IP，否则在 Linux 计算机上，点击“位置”，“网络”：你应该在这里看到你的 Windows 计算机，双击它。如果不在那里，点击“连接服务器”并更改“服务”。在
    Linux 计算机上点击“服务器”，然后点击“连接”。输入 Linux 计算机的名称。如果无效，尝试输入你的 Windows PC 的 IP 地址。


    一旦你的 PC 连接上，就可以看到所有共享文件夹。双击其中一个打开。如果你没有运行访客模式，将提示你输入用户名和密码。在你的 Linux 中访问文件夹时，点击“记住”以供下次使用。


    在两种情况下，如果你保护了共享，系统将提示你输入用户名和密码。现在你可以将文件从共享文件夹拖动到你的计算机上。如果你允许写入，你还可以重命名并复制文件夹到共享区中。你可以按照上述步骤更改共享名称，或者如果你想停止共享，请使用“共享”选项。


    你需要 Linux 计算机的 IP 地址。


    ```bash

    david@desktop:~$ File Edit Search Terminal

    david@desktop:~$ sudo add addr 192.168.1.100/24 eth0

    david@desktop:~$ set eth0 up

    ```


    40 完整 Linux 手册


