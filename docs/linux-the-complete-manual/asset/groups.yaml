    # 55


    # Burning CDs and DVDs


    Brasero is Ubuntu''s built-in-disc burning application and it offers a range of
    easy-to-use options. Here''s how to use it:


    ## HOW TO... BURN AN AUDIO CD


    1. Creating data discs and audio CDs is easy with Brasero. The friendly interface
    has a selection of large buttons that allow you to burn audio CDs and data discs,
    create video DVDs, make direct copies of CDs and DVDs and burn ISO images of a
    CD or DVD. It can erase rewritable CDs and DVDs.

    2. Insert a blank CD-R into your CD and launch Brasero Disc Burner, which you''ll
    find searching in the Applications menu. Click the Audio project button under
    the "Create a new project:" heading.

    3. Add some audio files by clicking the green + and browsing to your music. Brasero
    supports any format for which you have the codecs installed. Fire it immediately
    after you install Ubuntu and you won''t find it support MP3s. To install a codec,
    simply search the formats you need in Synaptic Package and mark them for installation.
    When this is done, click the files you want to burn. Ctrl-A selects all files
    in the folder, or click the first one you want, hold Shift and click the last
    to select a block of files.

    4. Click Add and the files will be added to the project. You can type a title
    for the CD in the box at the bottom, and double-click on each track to edit the
    information; useful if you have a CD player. You can split tracks with the knife
    icon in the toolbar which adds a two-second pause after a track.

    5. Click the Burn button in the bottom-right corner. The only option you may use
    if you have problems burning discs is to reduce the burning speed to a setting
    lower than Maximum. Once you''ve clicked Burn, Brasero will make all the tracks
    the same volume (normalization), write the CD information and then burn the tracks.
    When the process is complete, the disc should eject and be ready to play.


