    \n## LINUX 上的互联网\n\n你将收到提示，已安装最新版本的 Java。使用此技术的网站现在应该可以工作了。\n\n## 视频区\n\n在不使用\
    \ Flash 的网站上也可以运行视频。访问一个你知道有视频的网站，强制 Firefox 询问你搜索最近的插件。例如，要让视频工作，请访问 football365.com。视频将尝试加载但失败，此时会弹出对话框询问你是否搜索。你应该点击搜索。\n\
    \n给出选项时，选择 gstreamer10-plugins。插件将自动下载并安装。完成后，视频将显示。如果你没有看到它，可以手动安装所有需要的插件。要这样做，从应用程序的\
    \ Software Centre 点击 gstreamer 并安装。\n\n![](img/8ce336de6d0b78d8a67df502f94ad436_96_0.png)\n\
    \n## 额外帮助\n\nFirefox 的优秀之处之一是人们可以通过编写插件来扩展它的功能。这些被称为扩展。好消息是扩展与操作系统无关的，因此你可以在 Windows\
    \ 和 Linux 上使用相同的扩展。要查看哪些可用，访问 firefox.com/addons 浏览并搜索扩展。它们非常有用；例如，状态栏显示你当前的下载。当你找到喜欢的扩展时，只需点击“添加到\
    \ Firefox”。提示时，点击安装。如果没有“添加到 Firefox”按钮，可能是因为 Linux 版本的原因。你应该搜索类似的扩展。\n\n## 不要依赖\
    \ ActiveX\n\nMicrosoft Explorer 是一种用于开发 Web 的专有技术。它曾经非常流行，但许多网站拒绝使用它，因为它是唯一支持它的浏览器。然而，如果你运行的是\
    \ Linux，可以使用 Wine 安装 Explorer，但这很复杂，而且你还需要复制一些 DLL 文件让它工作。因为 Firefox 可以让你在 Linux\
    \ 上使用 ActiveX。如果你需要，可以搜索 Google 帮助在 Linux 上安装。\n\n# 第 5 章\n\n## 配置电子邮件\n\nEvolution\
    \ 电子邮件客户端让你与家人朋友保持联系。在这里我们解释如何设置 Ubuntu 上最流行的电子邮件客户端。当你第一次点击此图标时，Evolution 将启动设置向导引导你完成基本配置。要完成此操作，你需要互联网服务提供商的一些信息，你还可以获取当前电子邮件程序的设置。你需要知道\
    \ ISP 的邮件服务器地址，例如 POP3 服务器。对于入站邮件，这通常是 POP3 服务器或 IMAP 邮件服务器，取决于你使用的服务器类型。你还需要确定你的电子邮件是否需要任何加密（TLS\
    \ 或 SSL 等常见类型）。出站邮件也需要服务器，例如 smtp.yourisp.co.uk。最后，你需要电子邮件帐户的用户名和密码。\n\n## Evolution\
    \ 设置\n\nEvolution 设置向导的第一页欢迎回来。点击下一步。下一个屏幕可从备份恢复 Evolution 的设置和电子邮件。现在我们假设你从头创建一个账户，所以点击下一步。\n\
    \n会被要求提供姓名和电子邮件。你也可以指定一个回复邮箱地址，这样当有人回复你的邮件时，邮件将发送到这里。大多数人在此处留空。点击下一步配置你接收电子邮件的方式。为你的\
    \ ISP 入站服务器和用户名选择 POP 或 IMAP。选择“记住”让 Evolution 存储密码；如果不这样做，每次下载邮件都必须输入密码。下一个屏幕询问你多久检查一次新邮件。这是一个个人选择。\n\
    \n![](img/8ce336de6d0b78d8a67df502f94ad436_97_0.png)\n\n## LINUX 互联网\n\n发送邮件需要服务器身份验证（用户名和密码），勾选“服务器需要身份验证”框。大多数\
    \ ISP 不要求你通过安全连接连接服务器，但请先检查。\n\n![](img/8ce336de6d0b78d8a67df502f94ad436_98_0.png)\n\
    \n如果你的提供商不使用加密，将“使用安全连接”设置为无加密；如果你需要加密，从下拉菜单中选择加密类型。如果你使用用户名，点击“记住密码”框。当你向它发送消息时，Evolution\
    \ 会记录你的 ISP 邮件帐户。\n\n但默认的 10 分钟很不错，所以保持此设置，并在“每检查一次新消息”框中勾选。点击下一步配置你如何发送邮件——简单邮件协议或\
    \ SMTP；在服务器配置框中输入你 ISP 的 SMTP 服务器名称。如果你的提供商有\n\n再次点击下一步允许你配置账户名称。点击下一步并输入时间。最后，再次点击下一步然后完成配置过程。当你准备好发送和接收电子邮件并自定义账户时，Evolution\
    \ 就就绪了：\n\n要打开 Evolution，点击任务栏上的信封图标。按“撰写”创建新消息并并到 Webmail 账户。输入消息，按发送。然后去\n\n\
    ![](img/8ce336de6d0b78d8a67df502f94ad436_98_1.png)\n\n"
