    Windows 电脑上设置的权限将决定你只能读取文件还是可以写入文件。


    与 Linux 不同的是，Windows 没有网络驱动器。相反，它有书签，其功能类似。要为共享文件夹添加书签，请按照上述过程访问共享内容，然后点击“书签”，“添加书签”。当你重启电脑时，共享文件夹将依然存在。你可以通过打开
