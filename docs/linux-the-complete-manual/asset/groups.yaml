    # 第 6 章


    ## 创建你的系统镜像


    系统镜像是你可以执行的最完整的备份，因为它对你的操作系统、应用程序和文件进行了复制。


    现在，你已经让 Ubuntu 以你想要的方式运行，并下载了所有需要的驱动程序和额外软件。这是从零开始让计算机运行起来。想象一下，如果你的 PC 在明天决定故障，并带走了你的硬盘，你会感到多么痛苦。更有可能的是，随着时间的推移，你会遇到麻烦。你安装和卸载的所有额外应用程序和硬件都可能导致问题或让你的系统臃肿。从头重新安装感觉像是一项巨大的工程。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_127_0.png)


    想象一下你正在不断进行备份。如果你的 PC 以某种方式发生故障，你只需要将电脑恢复到上一个镜像；类似于“超级恢复”。


    镜像程序还包含标准的文件备份选项，因此你可以少制作一些镜像（这些镜像会占用大量的磁盘空间，但可以保护你的所有数据）。


    这就是使用磁盘镜像程序可以为你节省大量麻烦的地方。这些应用程序会获取硬盘的完整副本，包括操作系统、你的应用程序以及硬盘上的每一个文件。这是你能对它所做的最完整的备份。


    ## 硬盘


    理想情况下，你应该将镜像存储在外部硬盘上，这样如果主硬盘发生故障，你就不会丢失它们（这些镜像太大了，无法存储在 DVD 等介质上）。这意味着你还可以恢复硬盘（或者在发生严重问题时恢复到新硬盘），在短时间内恢复运行。你也可以备份到主硬盘上的第二个分区。


    ## 无需重新安装


    ## CLONEZILLA


    恢复时，重新映像化将你带回镜像制作的那一天。它的优点是显而易见的：当 Ubuntu 不再以你想要的方式运行时，你不需要重新安装它，只需要刷写硬盘并回到最初安装它时的状态，带有你所有的设置和应用程序。因此，不需要几个小时的工作，磁盘镜像应用只需要一部分的时间。


    虽然 Windows 用户在操作系统内的磁盘镜像软件方面有很多选择，但它并不像 Linux 那么简单。在 Ubuntu 中，你可以使用从桌面运行的应用程序，只需下载免费的
    Clonezilla 实用程序并刻接到备用 CD 或 DVD 中。这张光盘可以用于备份和恢复镜像。


    最棒的是，你不仅局限于制作一个镜像。通过正确的软件，你还可以安排磁盘镜像应用定期运行，由于你无法在操作系统内部运行这些程序，你需要减少频繁地进行这些备份。你应该在进行重大的系统更改或安装新硬件之前恢复它们，并将克隆与文件备份相结合以获得最佳保护。


