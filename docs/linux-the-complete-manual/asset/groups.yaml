    # 防火墙与网络安全


    Linux 可能比 Windows 更安全，但它并非完全免受攻击。在这里我们将向你展示如何保护你的系统。


    Linux 被广泛认为比 Microsoft Windows 更安全。这部分归功于它的开源特性，允许任何人能够立即发现并报告操作系统及其应用程序中的编程错误和漏洞。


    然而，它并不能免受攻击。在接下来的几页中，我们将展示如何通过配置 Linux 内置的防火墙和防病毒软件来增强计算机的安全性。


    黑客完全是由金钱驱动的，他们会尝试任何技巧来获取可以变现现金的信息。虽然 Linux 由于基数较小一直以来相对免受攻击，但其不断增长的普及意味着黑客已经盯上了这个操作系统。


    因此，你需要增强计算机的安全性。首先，互联网上的每台电脑都需要防范来自黑客的意外入侵（例如事实上的保护）。Linux 也需要防病毒保护。安全公司现在已经意识到近期
    Linux 操作系统所面临的威胁，并开始提供他们大多数产品的基础 Linux 版本，且不会对资源或网络性能造成任何重大消耗。


    许多商业防火墙包含了大量功能。然而，在最基础的层，防火墙只需根据一组规则决定是允许还是“丢弃”数据包。配置防火墙就是编写这些规则，告诉它允许哪些类型的网络流量通过，以及拦截哪些流量。


    - 防火墙主界面

    - 锁定（Lock）防火墙按钮仅供紧急情况使用


    ![](img/8ce336de6d0b78d8a67df502f94ad436_107_0.png)


    ## 防火墙


    防火墙的目的是检查进入或离开计算机的每一个数据包，并决定是允许其通过还是拦截。防火墙与操作系统本身紧密结合，并能够以高速运行。


    Linux 传统上带有一个名为 `iptables` 的防火墙，它要求系统管理员使用大量的配置文件进行设置。对于我们其他人来说，有一个更友好的工具叫做 FirewallD。就像在
    Microsoft Windows 上常用的工具一样，这完全是一个图形化应用程序，使配置变得简单。


    ## 安装 FIRESTARTER


    Firestarter 是免费的。要进行安装，它首先会启动 Ubuntu 软件中心。在搜索框中输入 ''firestarter'' 并按回车。Firestarter
    应用程序将出现在搜索框下方的列表中。点击安装按钮开始安装过程。


    在随后的弹出窗口中，可能会要求你输入密码。如果发生这种情况，输入 OK，Ubuntu 将下载并安装最新版本的 Firestarter。进程完成后，点击关闭。Firestarter
    现在已安装，并准备好保护你的计算机。


    ## 配置防火墙


    要打开 Firestarter 的用户界面，首先在 Ubuntu 软件中心中打开它。第一次运行时，输入密码以确认你想对系统进行更改，你会看到一个配置向导。点击“继续”继续。


    此部分允许你将防火墙分配给网络连接。如果你只有一个有线连接，这应该是默认 `Eth0`（大多数人都是如此），除非你正在使用无线网卡，否则请保持原样，或从下拉列表中选择另一个可用项。


    你的互联网网关会在 PC 启动时为网络上的所有电脑 分配 IP。除非你选择禁用并手动分配 IP 地址，否则会在防火墙按钮之前通过 DHCP 分配 IP。


    你的 Ubuntu 机器上不需要开启连接共享，因此你可以安全地点击继续并最终保存。


    Firestarter 的主控制面板现在会弹出。防火墙状态面板应显示其为激活状态。


    Linux 上的互联网


    ![](img/8ce336de6d0b78d8a67df502f94ad436_108_0.png)


    ## 激活连接


    Firestarter 控制面板上有两个按钮。第一个是锁定（Lock）。当你点击它时，Ubuntu 的防火墙会阻止所有进入和出的流量，状态图标将变为一把锁。如果你觉得某些东西可疑，就点击这个按钮。点击此按钮将持续几秒钟，直到防火墙继续允许流量通过——当然，这取决于它的安全规则，我们稍后会介绍。


    Firestarter 控制面板上的第二个按钮是停止（Stop）。当你按下它时，状态将变为已禁用（Disabled）。控制面板的另一个有用部分是激活连接（Active
    Connections）。


    ## 不同模式


    Firestarter 以两种模式工作。第一种是“许可模式”（Permissive），是默认设置。第二种是“限制模式”（Restrictive），它会拦截除你允许之外的所有流量。


    要将 Firestarter 置于限制模式，先点击策略（Policies）选项卡。现在选择输出（Output）流量。这允许你浏览网页。在策略选项卡的下部面板中，右键点击并选择添加规则（Add
    Rule）。这将产生一个小弹出窗口。选择选项“当源自”（When source）并选择任何人（Anyone）。点击添加按钮将你的新规则添加到列表中，它将被激活。


    对 HTTPS（在线购物时使用的 HTTP 协议安全版本）执行相同的操作。HTTP 和 HTTPS 规则都已创建，点击应用（Apply）。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_109_0.png) 再次操作，一切应该都会运行顺畅。


    如果你通常需要从 Ubuntu 发送邮件但发现现在无法工作了，你需要为 SMTP 和 POP3 添加规则。你还需要为 Samba 添加规则，或者为列表列表中未命名的端口添加规则，只需在输入框中输入即可。要查找特定类型流量的端口号，请访问
    http://tinyurl.com/portnumbers。


    ## 防病毒软件


    由于其重要性，Linux 开始需要防病毒保护。我们将展示如何下载和安装流行的 BitDefender 防病毒软件包，它提供免费扫描及一些选项。安装过程需要你使用命令行，但按照我们的说明操作，这将是一个简单的过程。


    首先，你需要获取一个免费的个人许可密钥。点击请求许可（Request License），输入你的电子邮件地址和国家，然后勾选复选框确认你是人类机器人。你的许可密钥将通过电子邮件给你。


    接下来，访问 http://tinyurl.com/lymsjb 并点击链接。你将获得32 位运行包。否则，点击 amd64 位运行包。这将打开下载管理器。选择保存并完成，点击
    OK。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_109_1.png)


    '
