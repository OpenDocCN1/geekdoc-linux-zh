    ![](img/8ce336de6d0b78d8a67df502f94ad436_15_2.png)

    ![](img/8ce336de6d0b78d8a67df502f94ad436_15_3.png)


    8 Linux needs a /swap partition, which is the equivalent of the Windows swap file
    used for virtual memory. When your PC''s memory fills up, Ubuntu will swap bits
    of the memory that aren''t currently being used – like inactive applications –
    to the hard disk. This gives the impression that your computer has more than it
    actually does, enabling you to run more applications.


    First, create a new partition in the free space and enter a size (in megabytes)
    that is equal to the amount of RAM in your computer, selecting Swap from the ''Use
    as'' drop-down list leave the other settings at default and click OK.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_15_4.png)


    9 Next, select the /home partition, which is where user files are kept. It is
    the equivalent of Windows'' Documents folder, but its on a separate partition.
    The advantage of this method is that if you need to reinstall Linux, you can do
    so and your documents won''t be overwritten. Make this partition as large as you
    like, but keep around 5GB free for the /root partition. Select /home as the mount
    point before clicking OK.


    10 The final customizing task you need to perform is to set the /root partition.
    This is where Ubuntu is installed, and it will use all the remaining space. Set
    the mount point as / and click OK. You can see the final structure from the screen
    above. Click Install Now you''re ready to continue.


    14 THE COMPLETE LINUX MANUAL


    # INSTALLING UBUNTU


    Ubuntu will now start installing your computer. While it''s copying files, you
    need to specify some settings. First, you need to set your current location on
    a map of the world in order for Ubuntu to set the date and time region. You can
    also type the name of your town or city in the text box. Click when you''re done.


    # 11


    With your configuration options set, Ubuntu will now go through the process of
    finalising the installation and copying the remaining files to your hard disk.
    This process takes a while, so you can leave it copying.


    You''ll be prompted to enter a username and password for your computer. Enter
    your password, and Ubuntu will tell you if it''s weak, fast or strong password.
    You need to decide how you want to log in. Logging in automatically will boot
    straight to the desktop, but the ''Require password to login'' option is more
    secure. If you choose the latter, you can also select ''Encrypt my home folder
    for security''. Click Forward when you''re ready.


    # 12


    Once Ubuntu has installed, go to the Software Centre, the online app store from
    the Launcher on the left-hand side of the screen, to find and install new programs.
    When applications are downloaded from the internet using an intuitive package
    manager, any additional components (known as dependencies) are automatically downloaded
    and installed. Applications also can be removed using this tool.


    # 14


    Because of its rising popularity, Ubuntu Linux is attracting interest from malicious
    attackers, so you need to make sure security patches are installed. Ubuntu has
    its own update manager and checks periodically for updates. When new updates become
    available, you''ll see a warning on the application bar. Click on the warning
    to bring up the list of updates and then click Install Updates button.


