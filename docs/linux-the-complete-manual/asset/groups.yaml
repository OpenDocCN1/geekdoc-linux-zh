    with a dedicated FTP client (see page 212).


    ![](img/8ce336de6d0b78d8a67df502f94ad436_139_1.png)


    # INTERNET ACCESS


    The next step is to give access to the computer over the internet. The first problem
    to overcome is that your home has IP address shared by all computers on your network.
    This IP address can change, making it impossible to access your home. Frankly,
    with Dynamic DNS you can create a simple name that updates regularly so it always
    points to your home. The only point to make is if your router doesn''t support
    Dynamic DNS (the DNS service). FreeNAS does, so you won''t need to download any
    other software.


    Select Dynamic DNS from the Services menu, enable and type your DynDNS.org account.
