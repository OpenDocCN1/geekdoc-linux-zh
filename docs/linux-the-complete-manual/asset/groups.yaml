    ## VIRTUAL AND MACHINES


    As you''ll see, there aren''t just applications that support iPod; you can run
    Ubuntu in VirtualBox, which is an application through which you can install and
    run a virtual copy of Windows, and subsequently, iPods.

    A word of warning: Don''t try Wine (Windows Emulator). Ubuntu supports only old
    versions of iTunes, and many iPods require newer versions, so it won''t work.
    In addition, previously purchased music won''t work.

    The bottom line with iPods in Ubuntu is that there''s no guarantees it will be
    easy to get your particular model working. Some programs require your iPod to
    be ''jailbroken'' to work with you. Another point to note is that you''ll need
    to format (or initialise) iPod on a Windows PC if it''s previously formatted on
    a computer running Mac OS, otherwise Ubuntu will not be able to recognize it.
    If you have any other computer running Windows or Mac OS, or if you''re running
    Windows and Linux, using Synaptic Manager is likely to cause fewer headaches than
    ''real'' iTunes, if you however, have an older iPod.


    ## USING GTPOD


    GTKpod is a lightweight application that was designed to synchronise with iPods.
    Search for it in Synaptic Manager and it will appear immediately. When it''s installed,
    you''ll find Sound & Video in the Applications menu. It supports first generation
    iPods, including Mini, Shuffle, Nano but not the iPod or iPhone. It''s capable
    of transferring MP3, WAV, audiobooks and video files to your iPod, but you''ll
    additionally need to install podcaster if you want podcasts. The interface is
    basic, but it gets the job done.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_76_0.png)


    ## AMOROK


    Amarok is a music player that has a Linux version and looks like iTunes. It works
    well and is great for music, but it doesn''t support video files.


    - Banshee is a look-like iTunes, but even though it supports first generation
    iPods for most iPods and can synchronise any videos you may have, it is worth
    trying out as a music management application with a simple interface. Banshee
    is the default music manager in Linux distributions, and it now supports music
    to your iPod and also supports podcasts. Unfortunately, although it lacks, it
    doesn''t support iPod Touch or iPhone.


    ## VBOX


    VirtualBox can run operating systems in a Ubuntu window. As long as you have limited
    disk and product key, you can use it to install Windows in Linux. You can then
    install Windows programs you like, including the latest version of iTunes. Virtualbox
    doesn''t provide direct access to your computer''s hardware so Windows may not
    run particularly quickly, but it should allow music to synchronise. For property,
    this is a copy-paste fast as you could easily install Windows on a hard disk partition
    to Ubuntu, and it is underneath. If you decide to give VirtualBox a try, you can
    find it in the same way as any other application by using the Quick search box
    in Synaptic Manager.


    ## Connecting an MP3 player


    Transferring music, videos and podcasts to your MP3 player is simple in Ubuntu.
    Here we''ll show you how we''ve already looked at Banshee on page 72, and seen
    that it''s extremely easy to use. It''s also great for MP3 players that use the
    MSC standard and show them in the left-hand pane under the Devices heading. MSC
    Stands for Mass Storage Class and is essentially the standard used by most USB
    devices and Linux is able to recognise when these devices are plugged in, just
    as Windows does. A window should pop up asking which you''d like to open, and
    an icon should appear on the desktop. You can then access the device just like
    any hard disk.


    ## MSC or MTP?


    Some MP3 players support both MSC and MTP standards. MTP - the Media Transfer
    Protocol is closely linked with Windows Media Player and allows DRM-protected
    audio files (usually those have been purchased from an online music store) to
    be transferred to authorised players.


    If Ubuntu doesn''t automatically detect your MP3 players, check its settings menu
    to see whether you can switch its mode from MTP to MSC. Some players, such as
    certain models in SanDisk''s Sansa range, require a combination of buttons to
    be pressed to switch.


    - Most MP3 players recognized by Ubuntu without any problems


    ![](img/8ce336de6d0b78d8a67df502f94ad436_77_0.png)


    If you prefer to transfer files, just use a File Browser window to copy music
    and video if your player supports it - straight to its internal memory.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_77_1.png)


    ## BASIC DESKTOP TASKS


    ## MANUALLY MANAGING MEDIA


    Banshee supports videos, but it may not meet your needs if you have an MP3 player
    that can also play video. In this case, the best method may be to copy manually
    if it were an external disk. If you browse your player''s contents in File Browser,
    you''ll find folders for Photos, Music, Videos and Voice Recordings.


    Any videos you download need to be converted. WiB FF can also support most formats.
    And with audio files, you''ll need to specify the specific format your player
    can handle, including both the audio and video resolution, plus the maximum bit
    rate for audio and video. Search for the best settings and help, and once you''ve
    done that, you can carry on with batches of others. As we''ve already said, check
    the manufacturer''s website for details, or contact support.


    - MP3 players must work with Banshee


    ## MANAGING MUSIC IN BANSHEE


    Banshee makes it easy to get music on your player. Once your MP3 player is listed
    under Devices, all you need to do is drop tracks onto it. You can select a range
    of tracks, artists, or albums, or just drag the artists or albums to all listed
    entries on your player if it has enough room.


    When you drop tracks on your player, you''ll see a progress bar in the bottom
    right corner of the window. This shows how many tracks have been transferred in
    the current time.


    For some things like podcasts, just drag and drop them on your player, and they''ll
    be transferred. Unfortunately, Banshee has no synchronization capabilities, so
    you cannot fill your player automatically with a manual selection of music in
    the same way as Windows Media Player. If you want an application that can sync
    music, you''ll need to install Amarok via the Synaptic Package Manager.


    > Amarok is an alternative music player that can synchronise tracks with MP3 players


    ![](img/8ce336de6d0b78d8a67df502f94ad436_78_0.png)


