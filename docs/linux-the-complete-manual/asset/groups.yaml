    # 添加用户


    要添加新用户，请访问 FreeNAS 的 Web 管理页面并登录。点击“Access”（访问）选项卡并选择“Users and Groups”（用户和组）。点击蓝色按钮，系统将提示你通过输入用户名和密码来添加用户。最好输入与你在
    PC 上相同的用户名和密码，这样就可以自动从 Windows 电脑访问网络（Linux 用户需要进行身份验证）。


    你还可以将用户分配到不同的组。目前，所有用户都将访问每台服务器。不过，FreeNAS 的后续版本将更新此功能，这将安全管理变得更简单，因为你可以允许或拒绝任何用户组访问特定服务。不过，我们将所有用户都放在了“admin”组中。当你创建一个用户后，点击“Add”（添加）。然后“Apply
    Changes”（应用更改）。点击蓝色按钮添加另一个用户。


    # 开启安全


    使用 NAS 时，是时候从“Services”（服务）菜单中使用 CIFS 了。要开启安全，从“Authentication”（认证）菜单中选择“Local
    User”（本地用户），然后点击“Save and Restart”（保存并重启）。当你看到消息“The changes have been applied
    successfully”（更改已成功应用）时，你的所有网络都是安全的，只有授权用户才能访问它们。


    当你访问共享时，系统会提示输入用户名和密码。如果你创建的用户名和密码与你当前的 Windows 用户匹配，你就可以访问共享内容；否则，系统将提示你输入有效的用户名和密码。


    # 更智能的共享


    在之前的四页中，我们展示了如何共享一个目录挂载点（硬盘或 RAID 阵列），但这并不是磁盘的最佳使用方式。共享特定文件夹更有意义。例如，你可以为每个用户提供自己的共享空间。类似的参数适用于其他服务。


    要共享一个文件夹，你首先需要创建一个。FreeNAS 拥有一个内置的文件浏览器，可以让你实现这一点。点击“Advanced”（高级）并选择“File Manager”（文件管理器），使用你登录的用户名和密码进行登录。


    > 内置的文件浏览器允许你从 Web 界面管理你的文件和文件夹。


    ![](img/8ce336de6d0b78da67df502f9ad436_138_0.png)


    FreeNAS 的 Web 管理页面。你将使用类似资源管理器的浏览器来查看每个文件和文件夹。创建一个新的共享文件夹，你需要知道将其放在哪里。与 Windows
    为磁盘分配不同盘符不同，FreeNAS 是基于 Linux 的。在 120-135 页，你将为每个硬盘或 RAID 阵列创建一个挂载点，这些存储在 `mnt`
    文件夹中。在这里你将看到你创建的挂载点列表。点击其中一个：从下拉菜单中选择“Directory”（目录），输入名称并点击创建文件夹。新共享将具有权限，并允许用户写入……在“Services”（服务）菜单中点击“CIFS/SMB”，点击“Shares”（共享）选项卡。点击蓝色按钮，为共享输入名称（我们选择了用户名），并点击按钮导航到
    `mnt` 挂载点。点击“Add”（添加），然后“Apply Changes”（应用更改）。当你通过 Linux 或 FreeNAS 共享时，你的新共享将会出现。如果性能出现问题，请关闭
    FreeNAS 上的主共享。


    | 名称 | 大小 | 类型 | 修改日期 | 操作 |

    |---|---|---|---|---|

    | 组 | 512 Bytes | 目录 | 2005/05/25 | - |

    | 共享 (14.05 GB) | | | | |

    | 转码项目 | | | | |


    # 第 7 章


    ![](img/8ce336de6d0b78da67df502f9ad436_139_0.png)


    完成后，点击“Save and Restart”（保存并重启）。要测试是否运行，打开浏览器并输入 `http://<ip address>`。提示时，输入有效的用户名和密码，你就可以浏览
    PC 上的所有文件。这是基础，为了更多的控制，你最好使用专用 FTP 客户端（见第 212 页）。


    ![](img/8ce336de6d0b78da67df502f9ad436_139_1.png)


    # 互联网访问


    下一步是通过互联网访问计算机。要解决的问题是你的网络中所有电脑共享的 IP 地址。这个 IP 地址可能会变化，导致无法访问家里。坦率地说，通过动态 DNS
    你可以创建一个指向你家的简单名称。唯一的问题是如果路由器不支持动态 DNS（DNS 服务）。FreeNAS 支持，因此你不需要下载任何其他软件。


    从“Services”（服务）菜单中选择“Dynamic DNS”，启用并输入你的 DynDNS.org 帐户。运行动态 DNS 后，你需要配置路由器，使其将入站请求发送到你的
    FreeNAS 服务器。这很简单，涉及端口转发（网络上的所有服务器访问整个设备，通过点击共享名称旁的红色图标）。


    # 设置 FTP


    网络共享的问题是它们不容易通过互联网共享。注意，FreeNAS 的设置非常基础，并允许用户访问 `/mnt` 文件夹和每个硬盘。要开启 FTP，从“Service”（服务）菜单中选择“FTP”（不要选择
    HTTP，因为这是一个非常基础的 FTP）。在“Enable”（启用）框中打钩，并勾选“Only allow authenticated users”（仅允许经过验证的用户）。禁止匿名登录。你可以保持其他设置不变，但你可能想要开启“Resume”（恢复），它允许用户在文件中断时继续下载；以及
    SSL/TLS，允许用户与你的服务器建立安全连接。后者将提供


    ![](img/8ce336de6d0b78da67df502f9ad436_139_2.png)


    > 使用端口转发通过互联网访问你的 FreeNAS 服务器


    # 网络存储


    点击 Database（数据库）目录旁边的按钮。这可以存储在任何地方，但为了方便，我们放在名为“Media”的目录中，用于存储媒体文件。点击“Content”（内容）旁的“Add”（添加），你可以重复此步骤将媒体添加到多个目录中。


    | 图库 | 日期 | 专辑 | 体派 | 评分 |

    |---|---|---|---|---|

    | Music | | 2+3 (The Classics) | Hits to The Heart | 4 |

    | Music | | 2+3 (The Classics, Elvis B... | Hits to The Heart | 4 |

    | Soundtrack | | Rick Ast (Never Give Up) | Hits to The Heart | 4 |

    | Video | | The-ness | Hits to The Heart | 4 |

    | Audio | | Here I And And You Begin, The... | Hits to The Heart | 4 |


    如果你有一个媒体服务器，可以使用转码将一个文件转换为另一个。然后将其放入“Transcoding”（转码）框中，FreeNAS 将文件转换为兼容格式。转码操作是
    CPU 密集型的，如果你的 PC 性能受到影响，请关闭此功能，并选择一个用于存储转码文件的“Temporary Directory”（临时目录）。


    最后，启用“Enable web interface”（启用 Web 界面），点击“Save and restart”（保存并重启）。你的服务器现在开始工作了。你可以点击
    URL 链接查看服务器状态的网页。


    ![](img/8ce336de6d0b78da67df502f9ad436_140_0.png)


    配置一条新规则，将所有指向端口 21 的入流量转发到你 NAS 的 IP 地址。你的路由器手册将告诉你是如何操作，www.portforward.com 有关于它的帮助信息。


    完成后，你就可以通过互联网访问 FreeNAS 了。在 Web 浏览器中，输入 `http://yourNAS` 以及你创建的路径。要开启 iTunes 共享，从“Services”（服务）菜单中选择“iTunes/UPnP”，并遵循这些说明。唯一的不同是你需要为
    Web 界面设置密码，否则 iTunes 将无法检测到 NAS。


    ![](img/8ce336de6d0b78da67df502f9ad436_140_1.png)


    > 你可以使用内置的 UPNP 服务器从 FreeNAS 共享音乐

    > FreeNAS 可以使用内置的 UPNP 服务器共享媒体文件


