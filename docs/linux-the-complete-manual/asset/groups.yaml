    # Installing Ubuntu on a laptop


    Installing Ubuntu on a portable computer – even a relatively low-powered one –
    can give it a new lease of life.


    One of the best things about Linux is that it requires comparatively few resources
    when compared with Windows. This is particularly handy on low-powered computers
    such as notebooks. It can also give normal laptops a speed boost, as Windows can
    be a resource hog and isn''t really designed to run on small screens, where Ubuntu
    is designed to make the most out of low resolutions and relatively slower processes.


    The Network Edition of Ubuntu – which was tailored specifically for powered machines
    is no longer available, but the standard version has been tweaked to make it work
    on all computers. However, as not all laptops have the drives for installing Ubuntu
    on your notebook or laptop differ from the previous four pages.


    Before you start, you''ll need to power on your computer and go into Windows.
    Many notebooks or laptops require Software for the shortcut keys to work. These
    keys may work in Ubuntu, so it''s best to turn the wireless network off or use
    other devices. Once that is done, shut down your computer.


    The installation file is a free download from www.ubuntu.com. Selecting the link
    down a CD-ready ISO file for your notebook or laptop, you can also use CD-burning
    software (CDBurnerXP from /cdubnerxp. is a free choice) to write this file to
    blanc CD which you can boot from, or use the CD included with the pack and follow
    instructions. However, as most of you don''t have a optical drive, it''s better
    to use a USB drive. You''ll need a model with at least 2GB capacity. Make sure
    you back up any files stored on, as the drive will get formatted. We use USB flash
    drives that be recognised by a BIOS, so if drive fails to work, you may need to
    try another. On a computer with Windows on it and plug your drive into your PC
    and make a note of its drive letter by clicking on Computer the Start menu. It''s
    vital that you remember this or you could wipe important data.


    > The Universal USB Installer turns a USB drive into a bootable disk for installing
    Linux


