    ## 增强你的照片


    这张照片是我们湖湖区（Lake District）拍摄的，在将好照片与坏照片分开后，几乎没有进入我们的“最佳图像”文件夹。然而，尽管外观如此，我们能看到它巨大的潜力。Gimp
    出现了营救，并允许我们增强它。在这里我们将向你展示如何使用 Gimp 的修饰工具。


    - 在 Gimp 中打开图像并直接进入“级别”（Levels）工具，你可以在“色彩”（Colours）菜单中找到它。这打开了一个看起来可能令人生畏的窗口，但值得知道它是
    Gimp 最有效的工具之一，特别是对于像这样没有灵魂的照片注入对比度。直方图显示了图像像素强度的表示。左侧是非常暗的像素，随着向右移动，它们逐渐变亮。向内拖动左箭头直到它与上升曲线的开始对齐。这会加深阴影。在右侧，抓住白色箭头并将其拖到图表消失的地方。这会点亮高光。


    锐化照片总是一个好主意，因为数字相机倾向于在对比度方面过分并留有一点柔和。锐化照片可以通过“锐化”（Sharpen）工具轻松地添加，你可以在“滤镜”（Filters）菜单中找到它。通过“预览”（Preview）开关开启或关闭来查看效果。移动滑块直到看到想要的结果。如果出现伪影，只需点击重置（Reset）按钮。这样可以避免损坏原始图像。现在图像看起来很不错，在移动到下一张之前，不要忘记图像。保存原始图像，或者保存一个副本。


