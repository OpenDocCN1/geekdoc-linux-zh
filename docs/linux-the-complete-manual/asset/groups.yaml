    # CHAPTER 8


    ![](img/8ce336de6d0b78d8a67df502f94ad436_141_0.png)


    # Troubleshooting


    Although we''ve thoroughly checked the advice in this book and made the steps
    as easy to follow as possible, you may occasionally run into problems. Perhaps
    your computer is crashing or a piece of hardware isn''t working as it should.
    Don''t worry: we''re here to help. Over the next few pages we''ll guide you towards
    finding the best solutions to any problems.


    How to use your free Ubuntu 11.04 disc


    # CHAPTER 8


    # Troubleshooting


    When things go wrong, Linux can seem impossible to fix, but it isn''t. We''ll
    help you find the answers to any problems you may have.


    Though Linux is a lot easier to use than it is used to, when you run into problems
    it can seem just as confusing as ever. Don''t panic—though getting your PC working
    again isn''t as hard as you might think.


    # FIND OUT WHAT HAPPENED


    The first step to fixing a problem is knowing what went wrong and why. It could
    be that Ubuntu fails to load one day no fault of your own, but it''s more likely
    that installing a new piece of hardware or software caused the issue. Remember
    any changes you''ve made, so you''ll be able to fix the help you need and avoid
    making the same change in the future.


    # IS IT A HARDWARE PROBLEM?


    A problem with your computer could easily be an issue with hardware as well as
    software.


    > Cinnamon Mint is free GPL software, and comes with ABSOLUTE NO WARRANTY.

    * An asterisk (*) will be shown for the selection.

    * It is recommended to backup important files before restoring. If you have enough
    space, map your selection to show an asterisk when the selection is done:


    | Select mode | Cinnamon Settings |

    |---|---|

    | restorable | Restore_as_image_to_disk |

    | restored | Create_recovery_iso |

    | build | Exit. Enter the command then |

    | | (OK) | (Cancel) |


    - Make a complete image of your computer so you can restore it after a problem

    - What appears to be a Linux problem may actually be a hardware problem


    If your computer won''t turn on or there''s nothing, perhaps something wrong with
    your hardware, rather than Linux.


    If you''ve installed some hardware, remove the new bit of kit and see if it makes
    a difference. If you''ve upgraded your PC, make sure that the memory, expansion
    and processor are all fitted correctly.


    # HAVE A BACKUP


    If your computer has completely broken and won''t start Linux, do avoid trying
    to fix it instead. Instead, reach for a system backup (page 126). A system image
    enables you to restore your computer working point before the trouble started.
    It''s the easiest and best method of fixing a problem, and highlights why you
    should make a backup before making any system changes.


    # FOLLOW OSCREEN INSTRUCTIONS


    Linux can be frustrating as it often doesn''t provide a graphical way of fixing
    a problem. However, you''ll often see an onscreen message telling you the command
    that you need to type. Look out for any helpful messages and try typing them into
    a Terminal window (or directly screen on Ubuntu not even load the graphical interface.
    If the command won''t run, try using "sudo" in front of it. This will run the
    command with higher-level privileges. You''ll be prompted to type in your password
    when using sudo.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_143_0.png)

    ![](img/8ce336de6d0b78d8a67df502f94ad436_144_0.png)


    # KNOW THE DETAILS


    Ubuntu has lots of versions that are not compatible with each other. In fact,
    the differences between "point releases," such as 9.04 and 9.10, can sometimes
    mean that software and hardware that work on one work on the other. For this reason,
    make sure you know which version you''re running.


    You will need to know the exact name or version you''re having problems. All this
    information will give you the right help for the version of Linux you have on.
    There''s official documentation for each version of Ubuntu on the operating system
    (https://ubuntu.com). Make sure you click the right link for the version of the
    OS (10.04 or 10.10 you installed). In documentation, you''ll find step-by-step
    instructions on how to perform tasks, as well as explanations. Make this your
    first step when you''re trying to troubleshoot a problem.


    # READ THE DOCUMENTATION


    The official forums and documentation don''t have the answers to everything, so
    Google can be your last resort. Remember, you will need to provide the details
    in the search that you''re looking for in order to get the best results. Know
    the "details" before you start. Many forums contain information related to your
    problem.


    # SEARCH GOOGLE


    You''ll probably find the best answer and then comments from other users can really
    help you track down.


    # DON''T PANIC


    Many troubleshooting solutions require you to edit a file or use strange-sounding
    commands. Don''t worry about these. Many of the members are so passionate about
    the OS that they will do anything to help others struggling. At http://ubuntuforums.org
    you''ll find people who are having problems with Ubuntu. Before you post, search
    the forums to see if there''s an answer to your problem. Also don''t worry about
    the occasional person who posts messages in the wrong place or use the wrong language.
    Read the Forum FAQ and Code of Conduct first so that you don''t post in this right
    way.


    > Forum threads are a sure-way to ask and find help


    ![](img/8ce336de6d0b78d8a67df502f94ad436_144_1.png)


    # CHAPTER 8


    # MISSING DISC? If your Ubuntu 11.04 disc is missing, please ask your local newsagent.


    # How to use your free Ubuntu 11.04 disc


    To make things as easy as possible, we''ve included a free CD of Ubuntu 11.04
    with this book. Here''s how to use it ![](img/8ce336de6d0b78d8a67df502f94ad436_145_0.png)


    - 1 INSERT DISC

    Your free disc is an Ubuntu 11.04 installation CD that contains no other software.
    You can boot your computer directly from it and choose one of two: either a test
    version of Ubuntu without installing so you can try it out, or install Ubuntu
    on your hard drive by following the guide on page 12. First, you need to turn
    on your computer and insert the CD into your optical drive. If it doesn''t boot,
    go to step 2: otherwise skip to step 3.


    - 2 SET YOUR COMPUTER TO BOOT FROM DISC

    To use the disc, your computer needs to be set up so that optical drive is the
    first boot device. To do this, you press the key to enter the BIOS when your computer
    first powers up. This is likely the Delete, F12 key, but look for a message onscreen.
    In the BIOS, find options which is likely to be under Advanced Options. Select
    the first Boot Device as CD-ROM. When that''s done, save the changes and exit
    the BIOS.


    ```

    1st Boot Device      CD-ROM

    2nd Boot Device      Hard Disk

    3rd Boot Device      USB Drive

    4th Boot Device      Floppy Disk

    ```


    - 3 INSTALL LINUX

    Your computer will now automatically boot from the CD. On the first menu, select
    English as your language and you''ll see the Ubuntu menu. From here, you can Try
    Ubuntu without making changes to your computer to run from the CD. Give Linux
    a try! When you''re ready to put Ubuntu on your PC reboot and follow the installation
    instructions on page 12.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_145_1.png)


