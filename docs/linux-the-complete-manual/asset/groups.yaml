    # Welcome to the Ubuntu desktop


    Once you have Ubuntu up and running, it''s easy to find your way around. Here
    we take you on a whistle-stop tour of the desktop.


    Ubuntu 11.04 has the brand new Unity interface, which does away with lots of the
    old menus. Click the Ubuntu button to open the search bar. Start typing and matching
    applications and documents will be shown, in a similar way to how the Windows
    7 Start menu operates.


    Click this icon to launch the Ubuntu Software Centre, which lets you install and
    remove applications. There are thousands of applications to choose from, and they''ll
    be automatically downloaded from the internet.


    Click this to zoom out and view all available workspaces, which are virtual desktops.
    You can drag and drop applications between workspaces, keeping your desktop near
    and uncluttered.


    This is Ubuntu''s Wastebasket. It works in exactly the same way as Windows'' Recycle
    Bin, and allows you to recover deleted files.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_21_0.png)


    The Launcher is a dedicated dock for application shortcuts. Applications that
    are currently running have white arrows next to them. To keep an application in
    the Launcher, right-click it and select Keep in Launcher. To remove an application
    from the Launcher, simply remove the tick. If the Launcher disappears, move the
    mouse to the left of the screen.


    This is the notification area, and looks just like Windows. Icons appear here
    to inform you of the status of various functions. Here you can see the strength
    of your Wi-Fi signal, indicated by the blue bars, and mute the volume by clicking
    on the speaker icon. Clicking on the envelope shows a menu listing all the messaging
    applications, including Empathy, which is Ubuntu’s default messaging.


    Clicking on your username brings up a menu similar to Windows’ shut-down menu.
    This allows you to reboot the computer, put it into sleep mode, switch to a different
    user account or shut down the computer. The icon to the left of your username
    shows your current status for instant messaging.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_22_0.png)


    As with Mac OS X, applications share a common title bar, which houses the menus
    (File, Help and so on). Roll the mouse over this area to view the available menus.


    Navigating around your files and folders is simple with Ubuntu. If you can do
    it in Windows, you’ll feel right at home here. Almost everything feels the same,
    from the menus to the navigation icons and folder listings. Like Windows, there
    are pre-created folders for Documents, Music, Pictures and Videos.


    # Adding peripherals


    If the thought of installing hardware has been putting you off Linux, think again:
    it''s now easy to add peripherals in Ubuntu. There was a time when using words
    ''Linux'' and ''hardware'' in the same sentence was enough to make IT gurus cry,
    but not more. Linux has grown up and works just as easily as Windows with peripherals.
    Over the past few years, open-source developers have been busy writing drivers
    and applications for a wide range of peripherals. USB and Bluetooth have made
    their job easier, but there are still a few issues to look out for, with just
    as with any operating system. Windows offers problems with current hardware, whereas
    Linux tends to be obsolete hardware that causes problems. In Ubuntu, popular hardware
    is so good that the only problem you''re likely to be deciding which applications
    you want to use with your devices. The next few pages will show how to install
    a range of common peripherals using Ubuntu.


    # SOUND ADVICE


    Getting sound hardware up and running should pose no problems in Linux, and any
    modern sound card would work straight away. Linux manages sound hardware in a
    different way to Windows, so it''s worth taking a closer look at what''s going
    on.


    Click on the Ubuntu logo and type System Settings and Enter to load the Control
    Centre. Select Sound option if you can''t hear anything when playing CDs, for
    this should be the first place to look. Sound Preferences lists the available
    devices on a pull-down menu. In many instances, these will all be for the same
    sound card. One common problem is caused by plugging speakers into a PC''s analogue
    socket and leaving Linux to use a digital output. This error should be obvious
    if you see the word ''Digital'' in the name of the selected device in the Sound
    Preferences dialog box. To fix this, change it to ''Analog Stereo Duplex'' and
    click the Test. This should generate a tone. If not, try the Open Sound System
    (OSS) drop-down option for the type of device. If you still hear nothing, for
    the Alsa see next. You can also use this dialog box to change the sounds played
    for specific system events. Click on the Sounds tab and you''ll see a list of
    events, each with a status of Default or Disabled. If you click the status and
    select Custom, you''ll be able to navigate to the sound file or web URL. Once
    onboard sound is working, you can play music directly from just any USB MP3 player.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_23_0.png)


    # INSTALLING UBUNTU


    We used an old Tevian 512MB MP3 player packed with music ripped from CDs by Windows
    Media Player.


    Plug your MP3 into a USB port on your Ubuntu PC. A dialog will open to confirm
    that the operating system has recognised the connection of your MP3 player. It
    will also open a window asking if you''d like to play the media via Banshee. Click
    OK and the Banshee application will open.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_24_0.png)


