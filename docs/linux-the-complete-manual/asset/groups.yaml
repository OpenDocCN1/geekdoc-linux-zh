    ## 使用 FTP 上传文件


    如果你有自己的网站，可能需要通过 FTP 向其上传文件。Linux 内置了对 FTP 支持，但使用 FileZilla 会更简单。


    文件传输协议（FTP）被大多数网络托管提供商用于让你能够在网站与本地之间上传和下载文件。图形化的 FileZilla 与 Windows 版本相同——它是使用
    FTP 的最佳方式。


    ## 安装 FILEZILLA


    可以从互联网下载 FileZilla，但直接从命令行安装它更简单。从 Ubuntu 搜索菜单中启动终端窗口，按回车键。输入你的用户名并再次按回车。在出现提示时，输入
    Y（注意是大写字母），然后在下次提示时输入 Y 并按回车。这将从互联网下载最新版本的 FileZilla 并安装到你的电脑上。安装完成后，你可以关闭终端窗口。现在可以通过
    Ubuntu 搜索菜单访问 FileZilla 了。


    ```bash

    sudo apt-get update

    sudo apt-get install -y filezilla

    Building dependencies for FileZilla...

    Checking package lists...

    Reading package information...Done.

    The following NEW packages will be installed:

    filezilla-gtk 3.0.10-1ubuntu1 [amd64]

    0 upgraded, 1 new installed, 0 to remove and not upgraded.

    After disk space required for this operation: 3.4 MB will be used.

    Do you want to continue? [Y/n]

    ```


    ![](img/8ce336de6d0b78d8a67df502f94ad436_113_0.png)


    - 可以像安装其他应用程序一样安装 FileZilla


    ## 使用 FILEZILLA


    FileZilla 是一个非常易用的应用程序。当你第一次使用它时，会看到存储在电脑硬盘上的文件列表，在“本地站点”（Local site）下方还有一个空白窗口“远程站点”（Remote
    site）。当你连接到你的托管服务时，远程站点窗口将填充文件；然后你可以在两者之间进行拖放。


    ## 添加站点


    点击站点管理器（工具栏上的第一个图标）调出一个新站点。你可以为你使用的所有 FTP 站点指定位置，这样你就可以访问它们而无需每次输入详细信息。


    要添加新站点，点击“新站点”（New Site）并为想要连接的站点输入一个易记的名字。输入主机名（网站地址，例如 ftp.mywebsite.com），除非你的网络托管商另有说明，否则将端口留空。点击“常规登录”（Login
    to normal）并输入你的用户名和密码。点击“确定”保存设置或点击“连接”（Connect）直接连接。


    - 可以终端窗口从互联网快速高效地安装 FileZilla


    ## 互联网在线


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114_0.png)


    FileZilla 可以记住你连接的所有 FTP 站点


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114_1.png)


    FileZilla 简单易用，让你能像管理本地文件一样轻松地在 PC 和网络主机之间传输文件。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114_2.png)


    要连接到站点，只需点击站点图标，选择你想连接的站点并连接。如果你遇到问题并确定已正确输入了连接详情，尝试选择站点并点击“传输设置”（transfer settings）选项卡。将模式从“默认”（Default）更改为“主动”（Active），如果仍然没有运气，尝试选择“被动”（Passive）。某些
    FTP 站点仅支持这些选定选项中的一个。


    你还可以选择“跳过文件”（Skip）、“覆盖”（overwrite）（当你尝试复制的文件比要覆盖的文件新时，有很多选项可用）或“重命名”（Rename）。你也可以选择每次都应用相同的选项，或者对于正在传输的文件进行“询问”。最后，FileZilla
    将自动更新并下载最新版本到你的电脑上。每当你启动应用程序时，如果有新版本，将通知你。


    ## 传输文件


    一旦连接到站点，就可以轻松从那里传输文件。远程站点窗口将显示你站点上的文件夹。双击文件夹查看其文件。当你找到了想要的文件夹，可以使用“本地站点”窗口导航到特定文件夹。


    你可以在本地站点和远程站点之间拖放文件（或反之）。FileZilla 底部的状态栏将显示传输进度。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114_3.png)


    你还可以直接从 Windows 资源管理器拖放文件到远程站点（或反之）开始传输。这比使用 FileZilla 导航你的本地驱动器要简单得多。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114.png)


    ## 高级功能


    不要担心新文件覆盖旧文件，FileZilla 会检查这一点。如果检测到重复文件，你会看到一个警告框询问你想做什么。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_5.png)


    ## 使用 Ubuntu One 备份


    如果你想要一种快速备份文档的方法，内置的 Ubuntu 应用程序可以帮助确保其被备份。最可靠的方法之一是使用安全存储数据的在线备份服务。对于 Linux 用户来说，好消息是
    Ubuntu 有这样一个工具。备份是确保重要文件安全的极佳方法。通过将数据存储在远程服务器上，即使你的房子着火或电脑丢失，你的文件也是安全的。最新版本的 Ubuntu
    带有 Ubuntu One，可以为你实现这一点。我们将向你如何使用免费账户，它提供 2GB 的存储空间。如果你需要更多空间，还有更高容量的账户，升级现有账户也很简单。


