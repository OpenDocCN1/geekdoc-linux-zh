    # Social networking


    Ubuntu integrates seamlessly with your social-networking and instant-messaging
    accounts, helping you stay up to date


    Keeping up with your friends via social networking and messaging (IM) is easy
    with Ubuntu''s built-in twitter. Here''s how to configure it.


    # BROADCAST NEWS


    One of the most impressive things about Ubuntu is the way in which it integrates
    with online accounts, giving you status updates for services such as Twitter and
    more. Getting started is easy using the built-in Broadcast Accounts via the Gwibber
    application. We''ll show you how to get started with Twitter, although these instructions
    are equally valid for other services.


    Click on your username at the top of the screen (Me Menu) and select Broadcast
    Accounts from the menu. Select the service you want, such as Twitter, from the
    drop-down menu. You''ll need to click the Author button, then enter your username
    and password before clicking Allow. When done, click the Add button


    ![](img/8ce336de6d0b78d8a67df502f94ad436_105_0.png)


    +   - You need to authorize your social-networking accounts before you can access
    them


    > Broadcast Accounts lets you log in your existing social-networking sites


    so your account appears in the left-hand panel. Repeat these steps to add your
    other accounts. Once you''re done, you''ll need to configure how your broadcast
    accounts work. The best way to do this is to start Gwibber from the Ubuntu search.
    This lets you view all the updates from the social-networking sites you subscribe
    to. Each message has the logo of the related service next to it, so you can use
    the panel on the left to filter messages from a single service. A bar at the bottom
    lets you status all your services at once, although you can use the icons to select
    specific services to use.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_105_1.png)


    To set preferences, just click Edit, Preferences. The notifications options determine
    which messages pop up on screen; it''s probably distracting to have every message
    pop up, so select ''Mentions and replies only''. The default refresh time is 15
    minutes; you may want to reduce this to keep up to date with what''s going on,
    particularly with Twitter, which has constant live updates coming through. Click
    Close when you''re done.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_105_2.png)'
