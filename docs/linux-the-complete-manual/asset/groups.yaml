    # # Installing Ubuntu


    It''s just as easy to install Linux as it is to install Windows. Here, we''ll
    show you what to do with a step-by-step guide


    You''ve probably already found the CD stuck to the inside of this book. We''ve
    included it to save you the hassle of downloading the 700MB file yourself. It
    is the Desktop Edition of version 11.04, which was the latest at the time of writing.
    Linux is regularly updated, so check website http://www.ubuntu.com/getubuntu to
    see if there''s a new version, or if you want to install a different version,
    such as the 32-bit edition. If you do download one of these (ISO image), you''ll
    need to burn it to a CD before you can use it. We recommend using CDBurnXP, which
    is a free download from http://cdubnerxp.exe. Alternatively, use the free Unboot
    tool (see page 9) to create a bootable USB flash drive with the ISO image.


    +   1 Put the Ubuntu CD from this book (or the one that you''ve created) into
    your optical drive and wait for the "Press key to load Ubuntu CD" message. If
    you miss this message, you''ll have to restart your computer to load the Ubuntu
    installation routine. The first splash screen should load very quickly.


    You don''t need to commit to installing Linux at this stage; if you just want
    to give it a try, you can run it directly from your installation disc (see Step
    2 for more details).


    +   2 You''ll be presented with a Language menu and a choice of two options. The
    default option is to try without making any changes to your computer. This simply
    loads Ubuntu from the CD and doesn''t write any files to your hard disk. This
    is an excellent way to try Linux without making changes and filling up your hard
    disk, and is the safest option if you''re not sure about the installing system.
    If you want to install Ubuntu, select the Ubuntu installation.


