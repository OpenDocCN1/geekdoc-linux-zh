    # Synchronising a mobile with Linux


    Backing up your phone to a PC is a great way to save your settings and make sure
    you have the same contacts wherever you are


    Even with Windows PCs, all the phone manufacturers provide software that lets
    you synchronise your phone with your computer. With Linux this isn''t the case.
    Fortunately, that doesn''t mean you''re stuck; there''s third-party software that
    works with most phones so that you can back up your messages. There''s no simple
    way to synchronise your phone directly with Ubuntu''s email client, Evolution,
    so first think about what you want to do. If your phone can synchronise its settings
    with an email service over its data connection, such as Google Mail, this might
    be the best option, or you can simply synchronise Evolution with the same source.


    Even if you decide to use a different method, connecting your phone to Ubuntu
    will be useful for other reasons, such as downloading pictures. First, you have
    to work out how you want to synchronise: Bluetooth or USB. USB is easier as you
    just have to plug in a compatible phone. Bluetooth is more convenient, you''ll
    never have to physically connect your phone to your PC.


    If you''re using USB, you''ll probably see several connection options when you
    plug in your phone. A Mass Storage, or similar, option will appear as a normal
    storage device; a native mode, like Nokia, which will want handset appear as a
    phone, and you''ll need other software to connect to it.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_79_0.png)


    > You can easily synchronise mobile phones with Ubuntu


    Where Bluetooth is installed on your computer, you''ll see a new icon to show
    it''s working


    # CONNECTING WITH BLUETOOTH


    To use a Bluetooth, you need a Bluetooth adaptor on your PC. If you''re using
    a laptop this may be built in, but for a PC you''ll need to buy a Bluetooth dongle
    - just a few pounds and should be recognised by Ubuntu when you plug it in.


    Once you''ve connected your adapter you''ll see a list of options, click Setup
    new device, which searches for a new Bluetooth device. However, this doesn''t
    always work, so it might be easier to manage the connection from your phone. First,
    click the Bluetooth icon and select Preferences. Click the Make computer discoverable
    box and type in a name for your computer, which will appear on the phone you''re
    searching from.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_79_1.png)


    # BASIC DESKTOP TASKS


    ![](img/8ce336de6d0b78d8a67df502f94ad436_80_0.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_80_1.png)


    Type in your passcode

    To connect your phone to your computer


    Phone type

    Please select phone manufacturer or type. Try to be specific as possible.


    M-Mmu makes it simple to connect Linux computer to most mobile phones.


    - Phone type

    - I don''t know

    - Smart based phone

    - Alcatel phone

    - Samsung phone

    - Nokia phone

    - Sony phone

    - Sharp phone

    - Ericsson phone

    - None of the above


    Go to the Bluetooth menu on your phone and make it''s turned on. Next, look for
    an to start a search and then type in a discovered. Numeric code of yours and
    select OK. A dialog will appear on your PC asking you to type in the same code.
    Do this and click OK.


    Once your devices are paired, your phone will appear in the list of devices, with
    the type of device it is (Phone). On you may get an option to connect to your
    computer. Select Yes and your phone will connect to your computer every time it''s
    in range. This prevents you from having to make a physical connection each time.


    To connect you, select Connect of the Phone menu. If there''s an error, try running
    the wizard and selecting different connections. To view, contacts messages, calls
    and calendar entries from your phone, select the appropriate option from the Retrieve
    menu. You can edit, create new entries, contacts messages and that changes are
    automatically written to the phone.


    # BROWSING YOUR PHONE


    When you click on the Bluetooth icon, phone will appear under Devices. Select
    it and you''ll see an option to browse files. Choose this and you''ll be able
    to copy files from the phone''s internal memory.


    # BACKING UP YOUR PHONE


    To back up your phone, you''ll need to install Wammu. Select Software Centre from
    the Applications menu and type ''wammu'' to the search box. Double-click on Wammu
    the results and then click on Install.


    To back up your data, use the drop-down menu to save contacts (vCard format).
    If you save contacts and calendar information, you can import them into another
    application. If you''re using Bluetooth, you''ll need to make your phone temporarily
    visible, otherwise Wammu won''t fit. You can export your contacts or events from
    Evolution, you can import them into Wammu and save them on your phone.


    # USINGOGLEOGLEKTOP


    The fact that Ubuntu does everything slightly differently to Windows can make
    it a bit confusing at first. In particular, locating your files can be tricky,
    as they''re stored in different places. While the built-in search tools help this,
    you may prefer to use Google Desktop to search your PC (including those stored
    in Ubuntu''s email client, Evolution) as quickly as you can search the internet.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_80_2.png)


    # DOWNLOAD AND INSTALLATION


    Just as Google makes searching the web easy, it show you how to making files and
    emails. On the next page you will be presented with a choice of applications.
    Choose the .deb version, which is for Ubuntu. Make sure you get the right version
    for your operating system (32-bit or 64-bit). Click OK and click Install on the
    next.


    Once you download the file to your hard disk, double-click the file in Firefox''s
    Downloads window. This will launch the Package Installer. Desktop is available
    for Windows and Linux in the same way on both. If you''ve already used the Windows
    version, you''ll be right at home with the Linux version and it will help you
    get to the new. However, the installation steps differ for the Linux version,
    so here''s how to get Google Desktop isn''t available from Software Centre, so
    you have to download it manually. Go to http://google-desktop.com/linux/index.html
    and click on Download Desktop button.


    # RUNNING GOOGLE DESKTOP


    Google Desktop is accessed through the Applications menu. The first time you run
    it will be prompted to set your home directory to Google. You should leave this
    option selected to make it easier to search your PC. You can also choose to send
    crashes, which can be used to improve the software in the future. When you''ve
    finished, click agree.


    Before it begins, Google Desktop has to index your directory. Depending on the
    number of files you have, this can take up to a few hours to complete. Until the
    process has finished, Google Desktop won''t be able to present you with accurate
    search results.


    # SETTING PREFERENCES


    While you''re waiting for your computer to index files, it makes sense to configure
    Google Desktop to work the way you want it to. In


    ![](img/8ce336de6d0b78d8a67df502f94ad436_81_0.png)


    # SEARCHING YOUR COMPUTER


    Search Desktop. You can use the other options here to select how many search results
    you want to see. Click Save Preferences when you are.


    # SEARCHING YOUR COMPUTER


    The easiest way to search your computer is to tap Ctrl i. This will bring up a
    search box. Type what you are looking for in the search box and it will appear
    in the drop down. The icons next to it tell you if it is an image, file or email.
    If one of the images listed is what you want, select it and it will be opened
    directly.


    Alternatively, if you can''t see what you''re looking for in the list, you can
    see it all in a browser. Use Firefox and display the Google Page, only if you
    search your computer not the internet. You can change the search term by entering
    something different in the search box, or you can filter the results using the
    links at the top of the page. You can refine your search to view emails, media
    files and websites you''ve visited, and all other types of file.


    Where available, results will be accompanied by a thumbnail of the file and a
    text extract. Here you may narrow down the search to find the file you want to
    open after.


    Once you''ve chosen a type of search, you can use further options to find a specific
    file. For example, if you select Media, you can then specify from the drop down
    menu what you want to look at JPEG files; for email, you can specify that you
    want to look at emails from a particular person.


    Finally, search results will also tell you how to complete the index of your computer.
    If you see a warning message, you should wait until the index has been completely
    built and then search again; searching soon means there''s a good chance that
    the file you''re looking for hasn''t been indexed yet.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_82_0.png)


