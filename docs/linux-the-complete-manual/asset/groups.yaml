    # # Using LibreOffice


    Ubuntu comes with a complete office suite that caters for your word processing,
    spreadsheet, presentation and business graphics needs


    If you''ve ever used an office suite such as Microsoft Office or Works, you''ll
    be right at home with LibreOffice. In fact, you''ll be hard pushed to find the
    differences between Word, Excel or PowerPoint and Writer, Calc or Impress, their
    LibreOffice equivalents. Save in mind


    Writer wouldn''t be much use if you couldn''t save documents in a format that
    Microsoft Office users could. Fortunately, LibreOffice can save in many formats,
    so you can pick one that''s compatible with the people you''ll be sharing it with.


    Writer is indistinguishable from Microsoft Word and has a very similar set of
    features. Even the menus are organised in the same way, so you should be able
    to find all the commonly used functions in seconds.


    Since Ubuntu comes with the latest version of LibreOffice, you''ll always get
    updates when they''re released. However, few people will need more than that.
    Writer provides controls for the text-formatting, you can insert pictures, tables,
    videos, audio, headers and footers.


