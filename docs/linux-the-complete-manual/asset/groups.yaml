    # # Getting started


    Allow us to guide you through your first steps with this powerful, free operating
    system


    Now that you''ve installed Ubuntu Linux, the next step is to explore the interface
    and find out how to perform tasks that were second in Windows. Here, we''ll give
    you a tour of the default Gnome desktop if you installed Ubuntu using the default
    options. We''ll explain how to perform common tasks as easily as you did in Windows,
    if not more.


    Using a new operating system can be a scary business. But don''t worry, even running
    a simple program can be tricky. Tasks such as customizing the look and feel of
    the interface, searching for files or writing data to a DVD might seem distant
    goals. Over the next few pages, we''ll show you how to get started with Ubuntu


    Linux. Within minutes, you''ll be doing the same things you were doing in Windows,
    and hopefully finding that life''s even smoother.


    Many of the options you''ll need are available via the launch bar, which is similar
    to Windows'' taskbar. This is a narrow area that runs across the screen. It displays
    a number of icons and text. The first option is Ubuntu along with a text label
    that reads Applications. This is the equivalent of the Windows Start. If you click
    it, a dropdown menu appears showing a list of programs you can run. Click on the
    System menu, which will appear to the right of the launch bar, and you''ll see
    the sort of options you find in Windows'' Control Panel.


    > There''s a wealth of free, well-supported open source software to install, and
    it''s easy to do


    # INSTALLING AND RUNNING APPLICATIONS


    Click Applications on the launch bar to access the programs that were installed
    when you first set up Ubuntu. These will be listed in a number of different categories.
    Move mouse over a category to open, and left-click on an application to run it.


    To add a new application, click Software Center. A three-pane window appears.
    In the left-hand pane, you''ll see the categories available. Select one, and a
    list of applications in the main pane. Click one, and its description appears
    in the other pane. You can select one or more programs to install by clicking
    the checkboxes. Then Apply Changes. After you''ve been given a final chance to
    change your mind, you''ll be asked to enter your password. Ubuntu will download
    the latest relevant packages and install them. Your new programs will now be available
    from the Applications menu.


