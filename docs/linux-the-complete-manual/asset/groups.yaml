    from scratch doesn''t sound like a huge amount of fun. This is where using disk-imaging
    program can save you a world of trouble. These applications take a complete copy
    of your hard disk, including the operating system, your applications, all settings
    and every file on your disk. It''s the most complete backup that you can make
    of your PC.


