    # Backing up with Ubuntu One


    If you want a quick way to back up your documents, the built-in Ubuntu One application
    can help


    The data we store on our PCs becoming increasingly valuable, making sure that
    it''s backed up is essential. One of the best and most reliable approaches is
    to use an online backup service, where data is stored securely. The good news
    for Linux users is that Ubuntu has such a tool in Ubuntu One. Backup is a great
    way of making sure important files are protected. By storing data on a remote
    server, your files will be safe even if your house burns down or your computer
    is lost. The latest version of Ubuntu comes with Ubuntu One, which does this for
    you. It''s still worth making local backups using the


    built-in Linux backup tools as these are quicker to restore, but online backup
    will give you that extra peace of mind.


