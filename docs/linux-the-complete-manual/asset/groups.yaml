    ![](img/8ce336de6d0b78d8a67df502f94ad436_45_1.png)


    # VIEWING SHARED FOLDERS


    When you''ve successfully connected to the remote folder, you will see all the
    files, just as you would if sitting at the Ubuntu computer. Ubuntu has three views:
    Icon, List and Compact.


    There are several ways to select the files you want: making a selection with your
    mouse, selecting everything, or selecting some files.


