    # Sharing files between Linux and Windows


    Your home network probably includes more than just your Linux PC. Here''s how
    to share files between Linux and Windows systems.


    The changes are that you have at least one Windows PC at home in addition to your
    Linux system, and it makes sense to share files and folders between them. Fortunately,
    this is easy to do in Ubuntu, because Linux has the same file-sharing protocols
    Windows uses. Over the next few pages we will show you how to share files and
    folders easily.


    Linux may use a file system that''s incompatible with Windows, but sharing files
    over a network is different; both Linux and Windows use the SMB protocol for file
    sharing. This means that a file is read from the Windows or Linux hard disk, sent
    using the mutually compatible SMB protocol and saved to the receiving computer''s
    hard disk in the native format. Consequently, Linux is a simple operating system
    to integrate into your network. All the tools you need are built in, so it''s
    easy to share files and folders between Linux PCs and Windows PCs.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_39_0.png)


    ## GETTING TO KNOW LINUX


    If this happens, you can rename the Linux folder as it has fewer than 12 characters,
    or you can change the Share name, which is basically the way network computers
    see, leaving the Linux folder intact. The second option is the easiest. In our
    example, we''ve shared the share name ''docs''. You can add a description of the
    shared folder in the comment box, this is optional.


    There are two options to select. By default, every folder is read-only, so other
    people won''t be able to modify existing files or write new ones. Click if you
    want to create and delete files in this folder. If you want to allow read and
    write access to type in as a user, select ''Guest''. When you''re done, click
    Create Share. Each share you make, may see a dialog box telling you that permissions
    are needed, in which case you should click ''Allow permissions''. Your shared
    folder will have a red arrow above it, indicating it''s shared.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_40_0.png)


    ## SHARE AND SHARE ALIKE


    In principle, sharing a folder in Linux is exactly the same as it is in Windows.
    You can share pretty any folder you want. To create and share a new folder, first
    click on Places, Documents to view your documents, then right-click and select
    New Folder: Give the folder a suitable name, such as My Shared Files, and press
    Enter.


    To share the folder, right-click on it and select Sharing Options. Click the ''Share
    this folder'' checkbox and you''ll see a dialog box informing you that the sharing
    service is not installed. Click the ''Install service'' button in the next dialog
    box and press OK. The sharing service will then be downloaded and installed automatically.
    You will need to restart, to continue.


    Once you''ve logged back to your computer, go back to your new folder, right-click
    on it and select Sharing Options. Tick ''Share this folder'' box and the other
    options will no longer be greyed out. At the bottom of the dialog box a message
    telling you that the share name is too long – this is because shared folders are
    allowed a maximum of 12 characters in names.


    - The sharing service will be downloaded and installed automatically

    - Create a new folder to contain your shared files in the normal way


    Before you access your shared folder from another computer, you will need to find
    out the Host (computer) name, open a Terminal window, either by typing ''terminal''
    in the search box or going to Menu, Accessories, Terminal. Type ''hostname'' and
    make a note of your computer. Next, type ''ifconfig'' and see the IP address.
    Type (possibly eth0) your network card name. The number after ''inet addr'' should
    be like 192.168.0.3.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_40_1.png)


    39 THE COMPLETE LINUX MANUAL


    ## CHAPTER 3


    ![](img/8ce336de6d0b78d8a67df502f94ad436_41_0.png)


    If you want to access the shared folder on your Windows PC on a frequent basis,
    right-click it and select ''Map network drive''. From this point on, the shared
    folder will appear as a normal drive in Computer, you will get quick access to
    it.


    ## ACCESSING FROM LINUX


    Sharing a folder from a Linux PC is easy. We''ve already shared some folders on
    your Windows. To access them from a Linux system, you need to know your computer
    name, and preferably, its IP.


    If you want to change the name of your computer, you can do so by typing ''sudo
    edit /etc/hostname'' and pressing Enter. In the document that appears, replace
    the existing name with the one you want.


    To get the computer name, type your Windows computer name, right-click and select
    Properties. The name will be listed on the page. To get your IP address, type
    a command prompt, ''ping <ip>'' and Enter. Make a note of the IPv4 address.


    ## CONNECTING VIA WINDOWS


    Once you have all this information, you can connect your Linux computer from a
    Windows PC. Your Linux computer will appear automatically in Windows if you connect
    to Network, but this doesn''t work well. It''s best to connect directly. Press
    Windows-R to run a command type \\<IP address> and if that doesn''t work, type
    your Linux computer''s IP address.


    The problem with the second method is, unless you''re using a static IP, on your
    Linux computer, click Places, Network: You should see your Windows computer listed
    here, double-click it. If it isn''t there, click Connect to server and change
    the Service. On your Linux computer click Server and then click Connect. Type
    the name of your Linux computer. If this doesn''t work, try to type your Windows
    PC''s IP address.


    Once your PC is connected, you can see all the shared folders. Double-click one
    to open it. If you don''t run Guest mode, you''ll be prompted for a username and
    password. In your Linux to access the folder click ''Remember'' to save for the
    next time you want to use it.


    In both cases, if you''ve protected sharing, you''ll be prompted to type your
    username and password. You can now drag and drop files from shared folder to your
    computer. If you allowed write to it, you can also rename and copy folders to
    the share. You can change the name of the share by following the steps above,
    or if you want to stop sharing, use the ''Share'' option.


    You need to know the IP address of your Linux computer.


    ```bash

    david@desktop:~$ File Edit Search Terminal

    david@desktop:~$ sudo add addr 192.168.1.100/24 eth0

    david@desktop:~$ set eth0 up

    ```


