    Right-click and select Properties. You can set its height in pixels and whether
    it appears as a centralised bar or stretches the width of the screen, as if it
    should be hidden automatically. You can also choose to display manual handle and
    show buttons (if you don''t use the auto-hide feature).


    Click the Background tab and you can set the bar''s transparency.


    You can add gadgets and icons around the launch bar. Right-click and select Add
