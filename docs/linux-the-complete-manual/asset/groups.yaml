    It''s possible to get video working in websites that don''t use Flash. Visit a
    website that you know has video and force Firefox into asking you to search for
    a recent plugin. For example, to get streaming WMV to work, go to, football365.com.
    A video will attempt to load and fail, but a dialog box will appear that asks
    if you want to search for it. You should then click Search.


    When given the option, select gstreamer0.10-plugins and click install. The plugin
    will download and install automatically. When it''s complete, streaming WMV movies
    will show. If you don''t see this, you can manually install all the plugins that
    you''ll need. To do this, click on the Software Centre from Applications for Gstreamer
    and then install each of the Gstreamer plugins that appears


