    ## 连接网络


    在这里我们将向你展示如何将你的 Linux PC 连接到本地网络，并利用移动互联网。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_89_0.png)


    没有接入网络的计算机算什么？几年前，这是一个老问题。然而，时代已经改变，连接性现在已经像 USB 闪存和液晶显示器一样，是计算的一部分。在接下来的几页中，我们将概述将
    Linux 计算机连接到家庭网络的各种选项。我们还将帮助你设置无线和 3G，以便你可以在移动时使用笔记本电脑。


    互联网彻底改变了我们使用电脑的方式。曾经，PC 是独立设备，通过软盘介质与外部世界通信，但现在英国几乎每家家庭的 PC 都连接到了全球网络。不仅如此，现在的连接由高速宽带提供，放弃互联网连接的想法几乎是不可思议的；我们已经探索了无论你在家里还是在旅途中，连接
    Linux PC 时会遇到的所有问题。


    好消息是，如果你有一个带有互联网连接的家庭网络，只需将以太网线连接到你的 Linux PC 并将其接入宽带路由器即可。打开电源，它将自动连接。然而，如果你想自定义设置，或者遇到问题，请阅读下方的以太网连接部分。直接跳转到“使用无线，计算机的联网方式”。数据泄露的可能性较低，而
    Wi-Fi 和以太网的吞吐量大得多。Ubuntu 识别今天 PC 或笔记本电脑内置的任何网络都不会有问题。


    只要你网络的其他部分连接到互联网，启动 Ubuntu 时应该会自动发生几件事。首先，它将尝试使用名为 DHCP 的服务自动获取 IP 地址。你的网络中通常只有一个
    DHCP 服务器，这足够了。路由器的 DHCP 大部分处理了设置的烦恼，所以你不需要配置任何内容。


    Ubuntu 通常将以太网称为 `eth0`。如果你有两个网卡，另一个将标记为 `eth1`。你可以添加更多网卡，这些将在文件中被标记。


    从 Ubuntu 搜索中运行终端（Terminal）。这将打开命令行。输入 `ifconfig`，将出现一些信息。与 `eth` 关联的信息部分包含


    > Ubuntu 现在支持如以太网 LAN 驱动等有线设备


    ## 使用以太网连接


    典型的方法是使用标准的以太网卡和电缆，将其插入简单的路由器或集线机。这被认为是最安全的


    ![](img/8ce336de6d0b78d8a67df502f94ad436_89_1.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_89_2.png)


    以 ''inet addr:'' 开头的行

    随其后的地址是你的网络接口的 IP 地址。

    地址中的前三个数字被称为网络地址。这组数字取决于你路由器的配置，但在本地家庭网络中，默认值是 192.168.0。

    你需要确定是否想为你的 Ubuntu 计算机分配一个永久的或“静态”IP 地址，而不是使用不断变化的 DHCP 地址。

    这很容易实现。


    ### 处理这种情况


    首先，在启动终端之前，输入命令 `route -n`。输出的最后一行将包含类似 192.168.0.1 的地址，这是你网络默认网关的地址。你的广播路由器是所有非本地流量（即互联网流量）流经的地方。接下来，输入命令
    `/etc/resolv.conf`。最后一行包含 DNS 服务器的名称，用于将名称转换为 IP 地址。注意这些信息。

    从系统设置中选择网络连接（Network Connections）。这将弹出一个小框。选择你的有线适配器。点击 IPv4 选项卡。这将显示将分配 IP 地址的方法设置为“自动
    (DHCP)”。使用下拉菜单选择手动192.168.0.50/255.255.255.0 子掩码和网关192.168.0.1。应用更改，关闭网络连接对话框，从网络管理器中选择移动宽带。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_90_0.png)


    ## 使用无线


    Ubuntu 擅长 Wi-Fi 网络，它是移动者的绝佳选择。典型的方法是使用标准的以太网卡和电缆，将其插入简单的路由器或集线机。这被认为是最安全的计算机联网方式。数据泄露的可能性较低，而
    Wi-Fi 和以太网的吞吐量大得多。Ubuntu 识别今天 PC 或笔记本电脑内置的任何网络都不会有问题。只要你网络的其他部分连接到互联网，启动 Ubuntu
    时应该会自动发生几件事。首先，它将尝试使用名为 DHCP 的服务自动获取 IP 地址。你的网络中通常只有一个 DHCP 服务器，这足够了。路由器的 DHCP
    大部分处理了设置的烦恼，所以你不需要配置任何内容。


    Ubuntu 通常将以太网称为 `eth0`。如果你有两个网卡，另一个将标记为 `eth1`。你可以添加更多网卡，这些将在文件中被标记。


    从 Ubuntu 搜索中运行终端（Terminal）。这将打开命令行。输入 `ifconfig`，将出现一些信息。与 `eth` 关联的信息包含


    > Ubuntu 现在支持如以太网 LAN 驱动等有线设备


    ## 使用网络工具


    Ubuntu 配备了一网络工具。为了方便，最重要的工具整合在一个多标签窗口中。打开 Gnome 系统菜单，选择管理并选择网络工具。窗口弹出多个标签。选择你要的网络，它将显示详细信息和统计数据。Ping
    标签卡允许你联系本地网络或互联网上的其他机器，以测试它们是否运行并发现数据包到达它们所需的时间。“ping”向目标发送数据包，允许你输入由 ISP 技术支持提供的任何特殊详情。


    ## 使用 3G 移动宽带


    许多城镇和城市都有公共 Wi-Fi 热点，但有时使用你移动运营商自己的网络更好。Linux 过去很难处理新的外部通信硬件，但那些日子已经过去了，不再需要与命令行战斗来让功能工作。为了演示
    Linux 的变化，我们展示了如何连接 Virgin Mobile 3G USB 网狗。


    将网狗插入方便的 USB 端口，新移动宽带连接向向导将出现。点击继续。输入你的国家和宽带服务提供商，然后按继续。窗口将显示连接摘要并要求你对其命名。


    点击应用，你就可以打开顶部工具栏上的网络管理器图标了。你的新移动选项应该出现在已知连接列表中。然而，在连接之前，你需要输入详细信息以在移动网络中进行身份验证。重新打开网络连接并点击移动宽带


    ![](img/8ce336de6d0b78d8a67df502f94ad436_91_1.png)


