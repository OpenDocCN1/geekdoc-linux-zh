    # CHAPTER 4


    ## Improving the look and feel of Ubuntu


    Multiple workspaces, graphical effects and shortcut keys can all make using Linux
    faster and easier. Here we show you how.


    In its default, Ubuntu Linux looks and feels very similar to Windows in the way
    it handles applications. However, with a few tweaks and settings it can be even
    more powerful. With its graphical effects and multiple workspaces, Ubuntu can
    also be made more attractive and easier to use than Windows. Using Ubuntu for
    the first time is pretty simple; its interface and window-handling are similar
    to those in Windows, sticking with the default setup will limit the usefulness
    and speed of this great operating system. Here we explain how you can make Ubuntu
    look, feel, and handle better.


    The box over the page shows all the keyboard shortcuts you''re likely to need,
    but you''ll have to follow this guide first to get it working. It''s worth the
    effort, as Linux becomes an amazing graphical operating system that wipes the
    floor with Windows 7.


    > Need to enable your computer''s 3D driver to use Ubuntu''s graphical effects.


    - Enable driver?


    ### accelerated graphics driver


    3D-accelerated proprietary graphics driver for NVIDIA cards. This driver is required
    to utilise the 3D potential of NVIDIA graphics cards, as well as provide 2D acceleration
    of newer cards.


    - If this driver is required.


    If this driver is not enabled, you will not be able to enable desktop effects
    and will not be able to run software that requires 3D acceleration, such as some
    games.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_83_0.png)


    ## GOING GRAPHICAL


    Ubuntu 11.04 has lots of effects turned off by default, but there''s no way to
    manage them. To do this, you''ll need to install Compiz so you can manage the
    graphical effects. Open the Ubuntu Software Centre and type Compiz to search and
    install. Select OpenGL window then click Desktop Settings. Click Apply Changes
    and the system will be installed.


    For graphical effects, you need a 3D graphics chipset. Any graphics card made
    in the past few years will be able to cope with 3D graphics, as all PCs that include
    integrated graphics. You''ll also need to install your graphics card''s restricted
    driver. If you haven''t done this already, select the Restricted Drivers icon
    in the bar at the top of the screen. From the list of graphics that appears, please
    select the recommended and click Apply. The driver will be downloaded and installed.
    Once your computer will have to be restarted.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_84_0.png)


    ## BASIC DESKTOP TASKS


    Once you''ve installed your driver, you''re ready to start enabling the desktop
    effects. These are all managed by Compiz, the application we installed to control
    its settings. You can find this in System Settings, Personal, CompConfig Settings
    Manager, and from here you''ll be able to enable all the extra desktop effects.


    The side panel on the left contains all the shortcuts for the various sections,
    which we''ll cover in turn. ''All'' lists every setting on one page, while ''General''
    includes only basic options. For each option, you can select the checkbox to enable
    it or click the words to change advanced settings. If you try to enable a setting
    that conflicts with another setting, and the option to proceed or continue with
    the current settings. Don''t enable the Desktop Cube or anything that will disable
    the Unity Plugins, as this will break the user interface and make your PC practically
    impossible to use. Some options require you to click them to get a sub-menu, where
    before you can manage any effects, you have to install the Advanced Desktop Effects
    Settings application.


    > With Opacity turned you can quickly focus on one window, making the others transparent


    ![](img/8ce336de6d0b78d8a67df502f94ad436_84_1.png)


    With the Advanced Effects switched on, windows wobble as they move. Options, such
    as Enhanced Desktop Zoom, and applications that make text easier to read. The
    box on the right highlights which keys you need to press to activate these shortcuts.
    When following this guide, have a look through the options to make sure you''ve
    enabled everything you want.


    - Accessibility options include an enhanced tool and the Opacity feature


    ## IMPROVING ACCESSIBILITY


    Accessibility options are designed to make Linux easier to use. Here you will
    find standard accessibility options that adjust the brightness and contrast of
    windows in their colours. One feature you may want to use is Opacity; hovering
    the mouse over a window makes all the other windows opaque, so you can make working
    on a crowded desktop a lot easier.


    ## ON THE DESKTOP


    The Desktop settings contain all the features that relate how you use your computer.
    Once you''ve enabled these features, you''ll wonder how you ever lived without
    them.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_85_0.png)


    The Desktop Wall gives you a way to switch between workspaces. The shortcut keys
    in the box on the right show you how to move between the workspaces. You can also
    drag applications to the side of the screen to rotate the cube and place them
    on another workspace.


    With Expo enabled, pressing the Windows and the S keys simultaneously will zoom
    out and show all your workspaces. You can grab a window and move it to another.
    This is considerably easier than using the standard task-switcher.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_85_1.png)


    ## WINDOW MANAGEMENT


    These settings control how open windows are controlled. Scale is the most interesting
    option, and provides a Mac Expos-style-switcher. Shift-Alt-Up to display all windows
    on all workspaces or Windows-W to display all windows on the current workspace.
    You can then use the mouse or cursor keys to select an application.


    ## DESKTOP SHORTCUTS


    - Open the Search menu

    - Similar to the Windows Run command, but it also displays the results of previous
    commands. The standard Search menu is an easier option for most users


    ## DESKTOP EFFECTS ENABLED SHORTCUTS


    - Move left or right between workspaces

    - Move up or down between workspaces

    - Switch between currently open windows across all

    - View all windows from all workspaces in a Mac Expos-style view

    - View all windows from the current workspace in a Mac Expos-style view

    - Invert the current window''s colours

    - Invert the colours of the entire screen

    - Mouse Scroll Wheel Zoom in and out

    - Middle Mouse Button Select a region to zoom into a rectangle

    - Middle Mouse Button Resize the window

    - Left Mouse Button Click anywhere on a window

    - Left Mouse Button Show workspaces


    ## EFFECTS


    You can use the Settings to control the fancy effects, such as wobbly windows.
    The best way to see what each does is to enable it and start using your computer.
    You might find that some of them are overbearing, but we find that they can add
    a bit of interest to the desktop.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_86_0.png)


    > Expo allows you to view all virtual desktops and even drag and drop files between
    them You can view all open windows and switch quickly tasks, as with Mac OS X''s
    Expos


    # CHAPTER 5


    Ubuntu has been designed from the ground up for the internet. In fact, it''s more
    tightly integrated into the online world than Windows, and most of the applications
    you install are automatically downloaded from the web. However, there are some
    tricky online jobs that you''ll want to do in Linux that are easy in Windows,
    such as viewing videos online, uploading files to your website and more. In this
    chapter we''ll take you through all these options and show you how to turn your
    Ubuntu computer into the ultimate internet PC.


