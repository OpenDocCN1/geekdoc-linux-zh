    ![](img/8ce336de6d0b78d8a67df502f94ad436_99_0.png)


    到账户。消息应该已经送达。然后，在 Evolution 中使用“发送/接收”（Send/Receive）按钮检查回复是否有新邮件。如果您在收件箱中发送邮件并向您的
    ISP 邮件服务器请求任何未读邮件，回复邮件将会被下载。


    然后点击“邮件偏好”（Mail Preferences）类别。“常规”（General）选项卡允许您设置磁盘空间，您在此查找邮件。为了节省空间，可以勾选“退出时清空垃圾箱”（Empty
    wastebasket on exit）框框。如果您可能需要恢复删除的任何邮件，请不要选择此选项。


    一旦配置好电子邮件，您可以通过设置菜单中的“偏好”（Preferences）来添加新帐户或更改设置。如果您选择已设置的账户并点击“编辑”（Edit），将弹出一个包含多个标签的窗口。如果您移动到新的
    ISP，或者您的提供商为您启动了不同的连接（例如，加密链接），您可以在此处更改服务器详细信息。点击“确定”（OK）。


    接下来，点击“HTML 消息”（HTML messages）标签页。这控制您如何查看 HTML 内容。默认设置是自动加载图像，这是一个很好的选择；如果您选择“从网上加载”，垃圾邮件发送者就可以验证您的电子邮件地址是否活跃。一个阻止垃圾邮件发送者的实用技巧是将
    HTML 模式更改为“始终显示纯文本”（Only ever show PLAIN）。这将显示邮件中链接的完整地址，使其不容易被钓鱼邮件欺骗。


    ## 高级配置


    配置的左侧面板有几个类别。如果您使用“自动完成”（Autocomplete），您将能够设置是否让 Evolution 在输入时自动补全任何电子邮件地址。如果您有多个地址簿，可以选择应用此功能的地址簿。


    “联系人与地址”（Contacts & Address）标签页会在您回复消息时自动在地址簿中创建联系人。这告诉 Evolution 未来来自该地址的入邮件不是垃圾邮件，它们不会被误判为垃圾。


    左侧面板中的“组合器偏好”（Composer Preferences）类别允许定义您如何编写新邮件和回复。在这里，您可以指定：


    98 完整的 Linux 手册


    邮件是否以 HTML 格式发送、当您输入相关文本时 Evolution 是否插入表情符号，以及您是否希望收件人的客户端在阅读消息时发送回执。


    使用默认的“引用”（Quoted）回复样式，在回复邮件时，原始消息会被引用。大多数人只需在引用部分的顶部回复，或者如果有很长的对话需要阅读，则从上到下阅读。勾选“回复时从回复开始”（starting
    by the reply）将光标置于消息末尾靠近开头的地方。


    您还可以通过签名来个性化您的消息。点击“签名”（Signatures）标签页，为签名输入名称和文本。完成后，按“确定”（OK）并“关闭”（Close）。


    在主界面上，可以通过点击屏幕底部的“联系人”（Contacts）来管理您的邮件联系人。这会打开地址簿。双击用户打开编辑联系人详情的表单。它有三个标签页：个人和邮件信息，因此
    Evolution 的用途远不止存储电子邮件地址。


    要返回收件箱，点击底部屏幕左侧的“邮件”（Mail）按钮。


    ## 拦截垃圾邮件


    使用 SpamAssassin 阻止垃圾邮件很容易，它是一个用于扫描电子邮件的智能免费实用。如果您从 Google Mail 或其他网页邮件服务下载邮件，由于邮件已经过过滤，您可以检测到垃圾邮件过滤。


    在使用 SpamAssassin 之前，您需要安装它。从启动器中选择“Ubuntu 软件中心”。在框中输入“spam”。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_100_0.png)


    在 Ubuntu 软件中心可以找到 SpamAssassin 应用，因此安装是一个简单的点击过程。


    一旦 Evolution 配置完成并准备好发送接收邮件，它看起来像这样：


    ![](img/8ce336de6d0b78d8a67df502f94ad436_100_1.png)


    双击 SpamAssassin 条目并点击“安装”（Install）。在提示时输入您的密码，SpamAssassin 将下载并安装到您的计算机。


    您现在需要在 Evolution 中启用 SpamAssassin。从“编辑”（Edit）菜单点击“垃圾邮件”（Junk），选择“邮件过滤器”（Mail Filters）并将
    SpamAssassin 设置为“默认垃圾插件”。您应该看到一条显示 SpamAssassin 可用的消息。在下方，如果您勾选“包含远程测试”（Include
    remote tests），SpamAssassin 将在线检查邮件是否来自垃圾邮件源。


    ## 邮件服务器说明


    您的 ISP 或电子邮件提供商可能为您提供 POP3（有时称为 POP）或 IMAP 服务器的选择，您应该选哪一个？


    POP3 是最常见且最易用的。您的客户端邮件连接到服务器并下载邮件。通常，完成后它会从服务器上删除邮件，仅在您的 PC 上保留邮件副本。IMAP 服务器之间没有交互，邮件存储在服务器上并由客户端访问。您在
    PC 上阅读的任何邮件在服务器上都会标记为已读，反之亦然。如果您在外并使用网页邮件阅读邮件，回到家里时，您的客户端将显示该邮件已读。如果您在服务器上有大量的邮件存储空间（例如
    Google Mail 的 7GB 限制），IMAP 是最佳选择。


    完整的 Linux 手册


    ## 使用 VoIP


    使用 Ubuntu 与朋友进行实时通信非常简单。


    在这里向您展示如何在 Linux 上配置 Skype


    Skype 可能以通过 IP 的语音（VoIP）应用而闻名，但它也有一些出色的文本聊天功能。为了与伙伴保持联系，Ubuntu 提供了许多与各种聊天服务协议兼容的其他客户端，包括微软和雅虎聊天。


    在使用 Skype 之前，您需要下载并安装它。打开 Firefox 并访问 www.skype.com，点击“下载”（Download），然后点击右侧的 Skype
    链接。点击“下载”按钮并选择 Ubuntu 8.04，这将显示包含更多 Skype 信息的对话框。点击“安装包”（Install Package）开始安装应用程序，并在提示时输入您的密码。

    '
