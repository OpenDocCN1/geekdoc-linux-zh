    尽管我们已经彻底检查了书中的建议，并尽可能让步骤易于操作，但你偶尔可能会遇到问题。也许是你的电脑崩溃了，或者某个硬件没有正常工作。别担心：我们在这里为你提供帮助。在接下来的几页中，我们将引导你找到任何问题的最佳解决方案。


    如何使用你的免费 Ubuntu 11.04 光盘


    # 第 8 章


    # 故障排除


    当出现问题时，Linux 看起来似乎无法修复，但事实并非如此。我们将帮助你找到可能遇到的任何问题的答案。


    虽然 Linux 比以前用得多，但当你遇到问题时，它看起来可能和以前一样令人困惑。不要恐慌——让你的电脑重新工作起来并没有你想象的那么困难。


    # 了解发生了什么


    修复问题的第一步是知道出了什么以及为什么。可能是某天 Ubuntu 无法加载，这并不是你的错，但更有可能是安装了新硬件或软件导致了问题。记住你所做的任何更改，这样你就能修复所需的帮助，并避免在将来再次进行相同的更改。


    # 是硬件问题吗？


    电脑的问题很容易可能是硬件问题，也可能是软件问题。


    > Cinnamon Mint 是免费的 GPL 软件，不提供任何保证。

    * 选中项将显示星号 (*)。

    * 建议在恢复之前备份重要文件。如果你有足够的空间，请映射你的选择项，以便在选择完成后显示星号：


    | 选择模式 | Cinnamon 设置 |

    |---|---|

    | restorable | Restore_as_image_to_disk |

    | restored | Create_recovery_iso |

    | build | Exit. 运行命令，然后 |

    | | (OK) | (Cancel) |


    - 为你的电脑创建一个完整镜像，以便在出现问题后进行恢复

    - 看起来像 Linux 的问题实际上可能是硬件问题


    如果你的电脑无法启动或屏幕没有任何显示，也许是硬件出了问题，而不是 Linux。


    如果你安装了某些硬件，请移除新设备看看是否有变化。如果你升级了电脑，请确保内存、扩展卡和处理器都安装正确。


    # 准备好备份


    如果你的电脑完全损坏且无法启动 Linux，请避免尝试修复它。相反，请寻找系统备份（第 126 页）。系统镜像允许你恢复到故障发生之前的电脑工作状态。这是修复问题最简单、最好的方法，并突显了为什么在进行任何系统更改之前你应该做好备份。


    # 遵循屏幕指令


    Linux 可能会让人感到沮丧，因为它通常不提供修复问题的图形化方法。然而，你通常会看到屏幕上的消息告诉你需要输入的命令。留意任何帮助信息，并尝试将它们输入
    Terminal（终端）窗口（或者在 Ubuntu 无法加载图形界面时直接在屏幕上输入）。如果命令无法运行，尝试在前面加上 "sudo"。这将以更高的权限运行命令。使用
    sudo 时，系统会提示你输入密码。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_143_0.png)

    ![](img/8ce336de6d0b78d8a67df502f94ad436_144_0.png)


    # 了解细节


    Ubuntu 有许多版本，它们之间互不兼容。事实上，“点版本”（point releases）如 9.04 和 9.10 之间的差异可能意味着软件和硬件在其中一个版本上正常而在另一个版本上。。由于原因，请确保你运行的是哪个版本。


    你需要知道遇到问题的确切名称或版本。所有信息都将为你运行的 Linux 操作系统提供正确的帮助。对于每个 Ubuntu 版本（https://ubuntu.com），都有官方文档。在
    10.04 或 10.10 版本中，你将找到如何执行任务的逐步说明以及解释。当你尝试排除故障时，这应该是你的第一步。


    # 阅读文档


    官方论坛和文档并没有涵盖所有答案，所以 Google 可以作为你的最后手段。记住，在搜索之前你需要提供正在查找的“细节”。许多论坛包含与你的问题相关的信息。


    # 搜索 Google


    你可能会找到最好的答案，其他用户的评论真的可以帮助你。


    # 不要恐慌


    许多故障排除方案需要你编辑文件或使用听起来很的命令。不要担心这些。许多成员对操作系统如此热衷，以至于他们会尽一切帮助他人。在 http://ubuntuforums.org
    你会找到遇到 Ubuntu 问题的人。在发布之前，搜索论坛看看是否有你问题的答案。不要担心那些偶尔会在错误的地方发布或使用错误语言的人。先阅读论坛 FAQ
    和行为准则，这样你的发布才是正确的。论坛帖子是寻求帮助的可靠方法![](img/8ce336de6d0b78d8a67df502f94ad436_144_1.png)


    # 第 8 章


    # 缺少光盘？如果缺少 Ubuntu 11.04 光盘，请询问当地报刊。如何使用你的免费 Ubuntu 11.04 光盘为了让事情尽可能简单，我们在书中附带了一张
    Ubuntu 11.04 CD。以下是使用方法 ![](img/8ce336de6d0b78d8a67df502f94ad436_145_0.png)


    - 1 插入光盘

    你的免费光盘是 Ubuntu 11.04 安装 CD，不包含其他软件。你可以直接从它启动电脑并选择两种方式之一：不安装的 Ubuntu 测试版本进行尝试，或者按照第
    12 页的指南在你的硬盘上安装 Ubuntu。首先，你需要打开电脑并将 CD 插入光驱。如果没有启动，转到第 2 步；否则跳到第 3 步。


    - 2 设置电脑从光盘启动

    要使用光盘，电脑需要设置为光驱为第一个启动设备。为此，你需要在电脑启动时按键进入 BIOS。这可能是 Delete 或 F12 键，但请留意屏幕上的消息。在
    BIOS 中，找到位于 Advanced Options 下的选项。将第一个启动设备设置为 CD-ROM。完成后，保存更改并退出 BIOS。


    ```

    1st Boot Device      CD-ROM

    2nd Boot Device      Hard Disk

    3rd Boot Device      USB Drive

    4th Boot Device      Floppy Disk

    ```


    - 3 安装 Linux

    电脑现在会自动从 CD 启动。在第一个菜单上，选择英语英语即可看到 Ubuntu 菜单。在这里，你可以在不更改电脑的情况下从 CD 运行 Ubuntu。尝试
    Linux 吧！当你准备好将 Ubuntu 放入 PC 时，重启并遵循第 12 页的安装说明。


