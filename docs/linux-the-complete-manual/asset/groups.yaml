    ### Changing your passwords: Tough to crack, and to remember


    ![](img/8ce336de6d0b78d8a67df502f94ad436_36_1.png)


    It''s important to use secure passwords and change them regularly. This is especially
    true if you use Ubuntu on a laptop. This method will help you easily remember
    passwords that are not tough to crack.


    Think of a password you know well. Take the initial of each word in the first
    line. Each letter (except ''u'') to the phrase that physically represents it,
    as As4. Use the first two letters of All Things Beautiful and Beautiful you use
    4b4b4q4s.


    To change your password, select About Me from the Preferences menu. Press Change
    Password, enter the current password and press Authenticate. Enter and re-enter
    your new password and Close.


    # CHAPTER 3


    # USING THE FOLDER


    ![](img/8ce336de6d0b78d8a67df502f94ad436_37_0.png)


    Get your mouse moving the way you like and your Ubuntu will be more positive.


    Click the Places on the launch bar. The first few entries are set up during installation.
    They are in your Home folder the equivalent of My Documents in Windows. Click-click
    once on your Home Folder to open the file browser.


    As Windows, right-clicking allows you to create a new folder, rename it and delete
    it. You can also increase and decrease the size of the icons. Furthermore, Gnome
    remembers the various zones that you set for different parts of the folder. Over
    the top of the folder, you will see three icons that represent the path from your
    home folder to the desktop. This enables you to navigate and move quickly between
    the file to one of the ten icons. To delete a file, right-click and select ''Move
    to the deleted items''. You can also find this on the right of the launch bar.
    If you click it, you can get list of all deleted files, delete individual items
    and restore them, just as you can in Windows.


    # CUSTOMISING THE DESKTOP


    You can customise the Gnome launch bar in more ways than you can use the taskbar.


    # FINDING THINGS


    To find a file, click Places and select ''Search'' for files. Enter a snippet
    of the filename into the field called ''Name contains''. There are more options
    available if you click on the triangle to ''Select more options ''.


    # GETTING TO KNOW LINUX


    You can add extra search criteria, such as the number of days since modification,
    the owner or the file size. You can also search the content of files. Use the
    Available Options list to select a criterion and press Add. The list builds a
    list of files matching your requirements should appear. Right-click on result
    to open it, open its location or delete it.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_38_0.png)


    # EXPLORING THE NETWORK NEIGHBOURHOOD


    Ubuntu has excellent support for shared folders. Make sure you have one folder
    shared on a Windows PC on your network. Click Places and select Network. The window
    that appears will show an icon called Windows Network: Double-click to see its
    contents; Double-click to display a list of PCs with shared folders. If you double-click,
    you will see the shared folders. Click on one of these and you''ll see the shared
    files.


    Gnome supports multiple desktops, which is very useful for organising your work.


    You can switch between workspaces by holding down Ctrl-Alt while pressing the
    left or right cursor key. The icon at the top left of all windows gives you the
    same options as in Windows (Restore, Minimize and so on), also allows you to move
    the window between workspaces, as well as allowing you to display it in front
    of all other windows each time.


    # MAKING MOUSE ADJUSTMENTS


    If you use mouse movements in Windows, the speed with Ubuntu initially moves the
    pointer may be too fast. You can easily slow down. Click on the System menu in
    the launch bar and select Preferences. Then pull the acceleration slider to the
    left and test the mouse until it moves the way you''d like. Finally, click the
    Close button.


    # WRITING FILES TO DEVICE


    Trying to save files to optical media in Windows can be a deeply frustrating experience.
    In Ubuntu, it''s simple to insert a blank DVD or CD and watch the system open
    a window asking which application you''d like to use. Leave the selection as DVD
    Creator and drag the files you want to save into the file window. Enter a name
    for the disk and press Write. That''s all there is to.


    # CHANGING BETWEEN DESKTOPS


    Ubuntu supports multiple saved workspaces. You can switch between monitors, which
    is an excellent way to jump between lots of programs. On the second bar at the
    bottom of the screen, you''ll see two small icons, one brown and one grey. These
    represent the different workspaces.


    # KEEPING UP TO DATE


    Each time you log in, the system checks Ubuntu''s servers for updates to be installed.
    If there are any, it displays a small speech bubble on the launch bar that you
    click to start the update. Press Install on the pop-up and enter your password.
    Ubuntu asks for your password whenever you''re about change the system. Enter
    it, and the system downloads and installs the packages. You may be asked to reboot.


    Right-click to select the number of workspaces you want, rename them (by double-clicking
    a name in the list) and stack them rather than displaying them in a line. If you
    select ''Show workspaces names'', the name will appear on the toolbar; then you
    use Desk 1. If you click Desk 2, Gnome displays a second view of your desktop.


