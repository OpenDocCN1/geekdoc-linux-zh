    # # Playing DVDs


    Using your computer to watch movies and videos is easy with Ubuntu. All you need
    to do download and install VLC


    Ubuntu comes with Totem Movie Player, but due to licensing laws in certain countries,
    it can''t play commercial, encrypted DVD movies. Don''t worry, though, as it''s
    simple to install the excellent VLC media player. You can install the MPEG2 codec
    required to play DVDs, but installing VLC is an easier way to


    watch movies. You may already be familiar with it as it''s also available for
    Windows and Mac OS, and it looks and works identically under Linux. It supports
    more than just DVDs, however: in fact, it can play MPEG2, MPEG4, H.264, and MPEG1
    formats, as well as MP3, OGG, AAC and other audio files. You can even use it as
    a media converter or for streaming video across a network.


    Menus are self-explanatory, and many functions can be accessed quickly by right-clicking
    on the video itself.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_71_0.png)


    Double-click on the video to make it full screen. Another double-click will return
    it to a window.


    Drag the bar to jump to a point in the movie. Hover your mouse over the handle
    to display the time.


    Click and drag on the volume control to increase or lower the volume.


    Controls let you play and pause the move, jump to the menu or go to the next or
    previous chapter.


    The extended settings button lets you tweak audio and video effects.'
