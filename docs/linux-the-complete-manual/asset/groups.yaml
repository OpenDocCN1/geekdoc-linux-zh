    - Calc 处理你的电子表格需求，无论是基础信息表格还是需要公式的表格，Calc 都能胜任。它有一个函数向导可以帮助你构建图表向导，以及一个导航器弹出窗口可以帮助你在大型表格中设置并返回到特定区域。


    与 Word 一样，它内置了拼写和语法检查，在打印前也可以轻松选择设置，以将整个表格适应到 A4 纸上，这在整个套件应用程序的右下角也是常见的。顶部工具栏中还有一个
    PDF 按钮，你可以直接将表格导出为 PDF 文件，这样几乎每台电脑都能读取。


    Calc 默认保存为 .ODS 格式，请确保你选择与任何需要电子表格的人兼容的格式，支持 Microsoft XLSX 格式。保存为 .PPT 格式以获得最佳兼容性。你也可以将文件导出为
    PDF 文件。


    # DRAW


    Draw 与微软或 Illustrator 的图形软件包最为相似。它对所有人都有用，但如果你需要创建 Logo 或任何基于矢量的图像，它就会派上用场。


    矢量图像可以调整大小而不丢失质量；如果你放大 JPG 图片，它可能会变得块状且变暗。而对于绘画，无论你缩放到什么大小，质量都会保持不变。


    Draw 拥有许多绘制线条和形状的工具，它的界面与 Word、Calc 和 Impress 相同，因此很容易找到功能所在。如果你需要画图表，最好使用 Calc，但如果你有耐心，Draw
    也可以做到。在其他应用程序中，你可以将文件导出为 PDF 并在打印前：


    # IMPRESS


    如果你需要创建演示文稿，Impress 与微软的 PowerPoint 一样灵活。内置模板让你遵循向导创建你喜欢的背景、幻灯片之间的切换效果——有很多可选——以及你何时希望在演示时间后自动幻灯片。


    一旦创建了基础演示文稿，就有许多幻灯片布局可供选择，你可以像在 PowerPoint 中一样直接在幻灯片上输入来插入文本。你还可以在幻灯片中插入图表、图像和音频剪。


    Impress 每个幻灯片有几种不同的视图，其中一种允许你为幻灯片添加注释以便打印或在 A4 纸上排版。还有一个讲稿标签页，你可以每页打印九张幻灯片给观众。


    Impress 默认以 .ODP 格式保存文件，除非你更改了默认设置。我们建议：


    - 如果你熟悉 PowerPoint，Impress 将很容易使用。它并没有完全超越任何对手，但能让你创建出整洁、吸引人的幻灯片。


