    The Add Clip button. Click this when''re ready to export your finished movie in
    a format that your player is compatible with.


    Drag an effect from the list to a clip to add that effect. You can add multiple
    effects to each clip and adjust their properties with the Effect Stack tab on
    the left.


    The project monitor shows the whole movie, but you can switch it for a view of
    the current clip by clicking on the Clip Monitor tab below.


    Click the Add button to import video clips from your hard disk, memory card or
    directly from your video camera.


    If you make a mistake, you can use the Undo History to jump back to the point
    you want to restart from.


    These are the video clips in your project. They can be added to the timeline as
    many times as you like.


    The zoom control lets you see more detail when you need to adjust and edit clips
    more precisely.


    The Razor tool lets you split video into multiple chunks while on the timeline.


    These two waveforms represent the left and right audio channels in each video
    clip.


    The playback marker shows the current position in the movie.


    There are two clips on the timeline. The tracks work like layers in photo-editing
    software. Video on top will obscure clips below unless the top video is transparent
    or occupies part of the frame.


    The selection tool is used for dragging and trimming clips on the timeline.


