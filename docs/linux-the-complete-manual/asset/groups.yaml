    # 第 6 章


    ## 备份


    无论你使用哪种操作系统，保持文件安全都至关重要。幸运的是，在 Linux 中进行备份非常简单。


    文件备份是保护数据的一种极其重要的方式。你应该定期进行备份，以确保在发生灾难时不会丢失任何重要文件。幸运的是，在 Ubuntu 中设置文件备份策略非常。


    在开始之前，有一些事情需要考虑。首先，备份的优劣取决于你提供给它的信息；如果你不告诉电脑备份某个文件，它就会因为某些原因而不执行。因此，请确保你的电脑组织良好，并将数据存在排列整齐的文件夹中，而不是散落在整个硬盘上。


    Ubuntu 与 Windows 不同，它为每个用户设置了预定义的文件夹，包括文档、音乐、图片和下载。我们认为将文档保存在这些文件夹中是值得的，因为这样你就能确切知道它们的位置。及早建立备份机制可以确保在电脑发生灾难性故障时，你不会意外覆盖任何文档并丢失数据。


    这些备份仅包含自上次备份以来修改过的文件，因此所需的磁盘空间较少。然而，要从增量备份中完整恢复数据，你还需要一份完整备份的副本。增量备份应该更频繁地进行，我们建议每天执行一次。


    ## 爱善对待你的媒体


    通过前两个页面，你已经确定了所需的备份介质类型；保护你的备份媒体并小心对待它非常重要；掉落备份硬盘不仅昂贵，还可能导致你丢失所有数据。对于重要数据，你甚至应该考虑使用两个驱动器，将一个放在家里，例如存放在朋友那里。


    Ubuntu 有一个名为 Simple Backups（简单备份）的备份工具，它非常容易使用和配置。在这里我们将向你如何使用它。


    > Ubuntu 为你的所有数据提供了默认文件夹；这让备份变得更容易


    ![](img/8ce336de6d0b78d8a67df502f94ad436_123_0.png)


    ## 备份类型


    你可以进行两种类型的文件备份：全备份和增量备份。全备份顾如名，会备份你所有的文件，无论它们何时被修改。你应该每周至少进行一次全备份，以确保你拥有所需的每个文件的副本。


    全备份的缺点是占用大量的磁盘空间。如果你只运行全备份，你可能会一次又一次地备份完全相同的文件。出于这个原因，有了增量备份。


    ## 系统健康


    ![](img/8ce336de6d0b78d8a67df502f94ad436_124_0.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_124_1.png)


    要安装 Simple Backup，从启动器中点击 Ubuntu 软件中心，并在搜索栏中输入 backup。


    桌面 Simple Backup 套件（核心功能）将会出现。选择它并点击安装。安装将开始下载并安装备份和恢复工具。


    设置而不是。你也可以选择使用压缩来节省磁盘空间。


    如果你想将文件写入外部介质（如 CD 或 DVD），可以使用“将备份存档拆分为多个块”选项来创建一组大小合适的文件。


    - 在提示时输入你的密码。安装将是一个相当快速的过程，只需要几分钟，取决于你电脑和互联网的速度。软件安装完成后，点击关闭，Simple Backup 现在可以可以使用了。


    - 在完成初始设置后，点击Include选项卡。这列出了将要备份的文件夹。默认设置非常好，包含了所有默认文件夹。如果你在其他地方存储了重要文件，可以通过 Add
    Directory（添加目录）来添加新的待备份文件夹。


    使用 Add File（添加文件）选项时要小心，因为它允许你手动指定要备份的单个文件，而不是其所在文件夹的内容。


    - 你可以从系统管理菜单运行 Simple Backup 的配置。当它启动时，你将看到第一个屏幕，其中有一个良好的默认备份配置。如果你想更频繁地备份数据，请更改“至少隔
    xx 执行一次全备份”设置。


    - 点击 Exclude（排除）选项卡，排除不需要备份的文件。你可以添加不包含任何有用数据的文件夹，例如 `/var/cache/`。文件类型选项让你选择文件。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_124.png)


    ## 创建镜像


    系统镜是你执行的最完整的备份，因为它为你的操作系统、应用程序和文件创建了一个副本。


    现在你让 Ubuntu 以你想要的方式运行，并下载了所有需要的驱动程序和额外软件。想象一下，如果你的电脑决定明天发生故障，带着硬盘该有多痛苦。随着时间的推移，安装和卸载的额外内容可能会导致问题。从头重装听起来并不是件乐事。使用磁盘镜像程序可以节省大量的麻烦。这些程序提供了硬盘的完整副本，包括操作系统、应用程序、所有设置和磁盘上的每个文件。这是为电脑制作的最完整的备份。


    > 如果你的电脑完全故障，系统镜像可以帮助你快速恢复备份。如果你的电脑由于某种方式故障，你只需将电脑恢复到最后的镜像。镜像程序还包括文件备份选项，可以使用大量的磁盘空间，但保护了所有数据。


    ## 硬盘


    理想情况下，你应该将镜像存储在外部硬盘上，这样当硬盘故障时就不会丢失它们（这些镜像太大，无法存储在 DVD 等其他介质上）。这也意味着在遇到严重问题时，可以在短时间内重新运行。你也可以备份到主硬盘上的次级分区。


    ## 不再重装


    恢复时，镜像将把电脑恢复到你首次安装时的状态，带有所有设置和应用程序。优点显而易见：当 Ubuntu 不再工作时，你无需重新安装，只需刷镜像即可回到你想要的状态。这样，比起几个小时的工作，磁盘镜像应用只需要一部分时间。


    ## CLONEZILLA


    最好的一点是你不仅限于制作一个镜像。使用正确的软件，你还可以定期计划镜像。Windows 用户在 OS 中运行磁盘镜像软件不像 Linux 那么简单。Ubuntu
    没有桌面，所以你需要下载免费的 Clonezilla 工具并将其刻录到空白 CD 或 DVD。此光盘可以用于备份和恢复镜像。在操作系统内部，你会更频繁地运行此类备份，因此在进行重大系统更改或安装新硬件之前应该备份，以获得最佳保护。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_125_0.png)


    ## 系统健康


    ![](img/8ce336de6d0b78d8a67df502f94ad436_126_0.png)


    ## 1


    选择 CD/USB 的 ISO 或选择 USB 驱动器或硬盘。如果你点击它，请在这里点击帮助或选择 Clonezilla。如果你点击它来创建分区，对于每个部分，请点击它。


    选择 clonezilla 顺序

    选择你想从哪里复制的软件、想复制到哪里以及使用什么方法。选择分区、全部或其他选项。选择 clonezilla live。


    | 源 | 目的地 | 类型 | 状态 |

    |---|---|---|---|

    | sda | sdb | | |

    | sda | sdc | | |

    | sda | sdd | | |


    ## 2


    选择要写入的光盘镜像

    ... clonezilla-live-2009018-karmic.iso: 117.0 MB


    ![](img/8ce336de6d0b78d8a67df502f94ad436_126_1.png)


    ## 3


    Clonezilla 是一个从自己的 CD 制作电脑镜像的优秀免费程序，你需要先下载它。


    要启动 Clonezilla，下载最新版本的软件。链接并在 Alternative（基于 Ubuntu）下选择 iso。选择 .iso 文件并等待下载窗口出现。点击保存文件。


    要为电脑制作镜像，你需要重启并从光盘启动。这是因为我们需要确保没有被锁的文件，以便制作硬盘及其所有内容的完整副本。


    取决于你网络连接的速度，117MB的文件应该在大约15 分钟内下载。


    在重启电脑之前，确保你已保存所有工作，并从屏幕右上角的菜单进行选择。重启电脑时，确保操作系统从光驱驱动器启动，否则普通操作系统将启动。当 BIOS 配置正确时，Clonezilla
    将自动从那里启动；你不需要按任何键。


    文件下载完成后，在 Firefox：下载中点击右键并选择打开文件夹。右键点击该文件并用浏览器打开。将空白 CD 或 DVD 刻录到电脑的光驱驱动器中。刻录完成后，点击关闭。CD
    就是你需要的，因为 Clonezilla 是很小的程序。文件写入只需要几分钟。


