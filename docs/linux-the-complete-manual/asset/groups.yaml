    Windows PC blocking. This commonly happens if you''ve installed a third-party
    firewall such as ZoneAlarm, which blocks connections from local network. You''ll
    need to disable the firewall temporarily or add your Ubuntu computer to the list
    of ''trusted'' IP addresses. You can find the IP address by opening Network Tools.
    If you''re connected by Wi-Fi, this will be wan0, or if you''re using a network
    cable, it will be eth0. Next to the IP address, you''ll need to enter into your
