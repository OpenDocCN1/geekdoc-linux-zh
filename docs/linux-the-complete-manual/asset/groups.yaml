    # 如何刻录 ISO 镜像


    ISO 是 CD 或 DVD 上所有文件的归档。当你刻录 ISO 镜像时，其中的文件会被写入 CD 或 DVD。你经常需要将镜像刻录到 CD 或 DVD，当有新版本的
    Ubuntu 发布时。Brasero 可以处理这种需求。

    - 将一张空白的 CD-R 插入你的 CD 驱并启动 Brasero Disc Burner（你可以在应用程序菜单中找到它）。在“创建新项目：”标题下点击“音频项目”按钮（此处应为
    ISO 项目）。

    - 选择要刻录的镜像，浏览到它所在的文件夹。

    - 现在，点击“属性”按钮。在刻录速度上，如果你在刻录过程中遇到错误，建议将速度低于光盘的额定速度。

    - 如果你的 CD 或 DVD 刻录机支持“防烧”（burnproof）模式（大多数都支持），请确保勾选了该框。

