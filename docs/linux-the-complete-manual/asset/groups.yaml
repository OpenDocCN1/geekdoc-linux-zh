    # CHANGING SCREEN RESOLUTION


    Changing the screen resolution is simple. In the System menu, select Preferences.
    Near the bottom of the menu, you''ll see the Screen Resolution option. When you
    select it, a window will open displaying a pull-down menu of resolutions and monitor
    frequencies that your hardware supports. Simply select one preset and the resolution
    will change.


    A slight glitch occurs when changing from a lower resolution to a higher one.
    It may seem to have no effect, but logging out and back in automatically picks
    up the correction. In other cases, you may be unable to use a resolution higher
    than 800x600. If you see a green icon at the top-right, hover over it to see a
    ''Recommended'' message, click it and choose the recommended drivers. Click the
    Activate button and the driver will be installed, enabling high display resolutions.


    # INSTALLING FLASH PLAYER


    To view YouTube videos and get the most of them, you need Adobe Flash Player.
    If you visit YouTube within your web browser, you''ll see a link to Adobe''s site.
    Follow this and select click for Ubuntu 8.04 as the software type. Then click
    Agree and Install Now. In the pop-up, click OK. This opens the file using the
    package installer. Install Flash Player.


    - Many popular sites as YouTube rely on Adobe''s Flash Player to work properly.


    # CUSTOMING THE DESKTOP


    To change the desktop wallpaper, right-click on the desktop and select Change
    Desktop Background. A window will pop up showing selection of pictures. Press
    the Add button to bring up a file selector that gives you the chance to add your
    own pictures to the list. Select one from your collection and press OK, and it
    will become your wallpaper.


    You can open this window another way if you prefer. Click on the System menu and
    choose Preferences and Appearance. You''ll see a number of tabs. Click the Theme
    tab, and you will be able to change the other default Gnome themes, just as you
    can in the Custom button, and change the shade of the borders, colors and so on.
    You can also install downloaded themes.


    The Gnome website has a theme area (http://art.gnome.org/) that contains an overview
    of free themes. Select a category, browse until you find one and then click the
