    ## Uploading files with FTP


    If you have your own website, you may need to upload files to it via FTP. Linux
    has built-in support for FTP, but using FileZilla is easier.


    The File Transfer Protocol (FTP) is used by the vast majority of web hosting providers
    to let you upload and download files to and from your website. The graphical FileZilla
    is the same as for Windows – it is the best way to use FTP.


    ## INSTALLING FILEZILLA


    FileZilla can be downloaded from the internet, but it''s easier to install it
    directly from the command line. Start a terminal window from the Ubuntu search
    menu, press Enter. Type in your username and Enter again. When prompted, type
    Y (note this is upper case) and then, prompted, Y and Enter. This will cause the
    latest version of FileZilla to be downloaded from the internet and installed on
    your computer. Once the installation has completed, you can close the terminal
    window. FileZilla can now be accessed through the Ubuntu search menu.


    ```bash

    sudo apt-get update

    sudo apt-get install -y filezilla

    Building dependencies for FileZilla...

    Checking package lists...

    Reading package information...Done.

    The following NEW packages will be installed:

    filezilla-gtk 3.0.10-1ubuntu1 [amd64]

    0 upgraded, 1 new installed, 0 to remove and not upgraded.

    After disk space required for this operation: 3.4 MB will be used.

    Do you want to continue? [Y/n]

    ```


    ![](img/8ce336de6d0b78d8a67df502f94ad436_113_0.png)


    - FileZilla can be installed like any other application


    ## USING FILEZILLA


    FileZilla is an incredibly easy application to use. When you use it for the first
    time, you will be presented with a list of files stored on your computer''s hard
    disk, under Local site will also be a blank window ''Remote site''. When you connect
    to your hosting service, the remote site window will be populated with files;
    you can then drag and drop between the two.


    ## ADD SITES


    Click the Site Manager (the first icon in the toolbar) to bring up a new site.
    You can specify location for all the FTP sites you use, so that you can access
    them without having to enter details every time.


    To add a new site, click the New Site and enter a memorable name for the site
    you want to connect to. Type in the Host name (the address of the site, such as
    ftp.mywebsite.com), Leave the Port option blank, unless told by your web host.
    Click Login to normal and type in your username and password. Click OK to save
    the settings or Connect to connect straight away.


    - FileZilla can be installed quickly and efficiently from the internet by using
    a terminal window


    ## INTERNET ONLINE


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114_0.png)


    FileZilla can remember all the FTP sites to which you connect


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114_1.png)


    FileZilla is easy to use and lets you transfer files from your PC and web host
    as easily as that you manage local files.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114_2.png)


    To connect to a site, simply click the Site icon, select the site you want to
    connect and connect. If you''re having trouble and you''re sure you entered the
    connection details correctly, try selecting site and clicking on the transfer
    settings tab. Change the mode from Default to Active and if you still have luck,
    try selecting Passive instead. Some FTP sites will work with only one of these
    selected options.


    You can also choose to Skip the file, or overwrite (there are lots of options
    for choosing when if the file you''re trying to copy is newer than the one you''re
    trying to overwrite) and Rename. You can also choose whether to apply the same
    option every time, or to uploads for the current set of files you''re transferring
    (''current query name'').


    Finally, FileZilla will automatically update, downloading the latest version to
    your computer and installing it. Every time you start the application, you''ll
    quickly be informed if there''s a new version available.


    ## TRANSFERING FILES


    Once you''re connected to a remote server, you can easily transfer files from
    the two. The Remote site window will be populated with folders on your site. Double-click
    a folder to view its files. When you''ve found the folders you want, you can navigate
    to a specific folder on your home computer using the Local site window.


    You can then drag and drop files between the Local and Remote sites (or vice versa).
    The status bar at the bottom of the main FileZilla window will show how the transfer
    is progressing.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114_3.png)


    You can also drag and drop files directly from Windows File Explorer into the
    Remote site (and vice versa) to start a transfer. It is much easier and easier
    than using FileZilla to navigate through your local drive.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114_4.png)


    ## ADVANCED FEATURES


    Don''t worry about overwriting a new file with an old copy, as FileZilla will
    check for this. If a duplicate file is detected, you''ll see a warning dialog
    box asking you what you want.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_114_5.png)


    ## Backing up with Ubuntu One


    If you want a quick way to back up your documents, the built-in Ubuntu application
    can help making sure it''s backed up. One of the best and most reliable approaches
    is to use an online backup service where data is stored securely. The good news
    for Linux users is that Ubuntu has such a tool. Backup is a great way of making
    sure important files are protected. By storing data on a remote server, your files
    will be safe even if your house burns down or your computer is lost. The latest
    version of Ubuntu comes with Ubuntu One which does this for you. It''s still worth
    making local backups using built-in Linux tools as these are quicker to restore,
    but online backup will give you that extra peace of mind. We''ll show you how
    to get started with a free account, which gives you 2GB of storage space. Higher-capacity
    accounts are also available if you need more space, and it''s easy to upgrade
    an existing account.


    To do this, you''ll need to create an Ubuntu One account. Click on Ubuntu One
    from the Launcher. The first time that run the application, you''ll see a screen
    asking you to create one. If you''ve already got an account, click ''I already
    have an account''; otherwise, click Join, fill out the form and click Email. A
    verification code will be sent to your email. Copy this code and paste it into
    the dialog box. You''ll then be prompted to enter your password which you have
    set up. A message telling you that your account is ready will be displayed. Once
    you''ve created your account, you''ll be taken to the application. The first tab
    will tell you what kind of account you have and lets you upgrade the storage space.
    This can be bought in blocks of 20GB, which will cost you £2.99 a month or £18.50
    per year. Click on the Services tab to see what will be synchronised with your
    online storage


    ## GETTING STARTED


    Before you use the online backup tool, you need an Ubuntu One account.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_115_0.png)


    | Create Ubuntu One |

    | --- |

    | David |

    | Editor |

    | File System |

    | Network |

    | Pictures |

    | Downloads |


    Ubuntu One is a Ubuntu One account, and if you don''t have one, this will create
    one for you. The password must have a minimum of 8 characters and include one
    uppercase letter.


    I agree with the Ubuntu One Terms & Conditions


    Already have an account? Click here again. Items: Free space: 20.6 GB


    ''Copy content for offline operation'' and ''Autocomplete with this address book''.
    Click OK and your settings will be changed.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_116_0.png)


    ## BACKING UP FILES


    One of the main benefits of Ubuntu One is its ability to back up files automatically
    and synchronise changes between multiple computers. It sets up default, although
    it''s good to check the settings. Note that you can''t back up a single file using
    the File Manager; it has to be entire.


    Open the file browser from the Launcher. Here you''ll see a new folder called
    Ubuntu One. This is automatically backed up and you can synchronise with your
    online storage. This is also used for some special features, we''ll cover later.


    You can also synchronise other folders. Open your documents folder and click the
    bar across the top. There should be a tick in the ''Synchronise this folder''
    box, showing that the folder and all its contents are backed up. You can remove
    the tick to stop the folder from synchronising. To synchronise other folders,
    browse to them and click them. All folders are automatically synchronised and
    can be turned off or individually. Have a green tick next to them they''re backed
    up online.


    By default, Ubuntu One is set to synchronise Firefox bookmarks, messages, contacts
    and files.


    To get Firefox synchronisation, you will install the Extension. To do this, shut
    Firefox and click the Install button. A dialog will appear, click Install and
    enter your password and the Extension will install. When you start Firefox, you''ll
    see the Add-ons dialog highlighted. This backs up your settings automatically.
    You can shut down Firefox and it will automatically back up existing and future
    bookmarks, it will also remove any from the online storage that delete the software.


    - Use the Preferences dialog box to select what you want to back up


    ![](img/8ce336de6d0b78d8a67df502f94ad436_116_1.png)


    ## MAKING CONTACTS


    When Ubuntu One is set up, it creates an address book in Evolution. However, it''s
    not filled automatically. To do this, start Evolution and Contacts. Click ''Personal''
    under ''On This Computer'' and select ''Copy All Contacts''. Select Ubuntu One
    in the next dialog box and click OK. Your contacts will be across.


    To make sure that all future changes are replicated, tell Evolution to use your
    Ubuntu One address book as the primary source. To do this, click Ubuntu One in
    Contacts and select Address Book Properties from the Actions menu. ''Mark'' as
    the default address book.

