    # 启动盘


    要使 USB 闪存盘变为可启动状态，你需要从 http://tinyurl.com/Bootrun 下载 USB 安装程序，并从硬盘硬盘运行它。你可以从下拉列表中选择要安装的
    Linux 发行版。你将发现所有最受欢迎的发行版可供选择，甚至还有一个下载 ISO 文件的选项；但是，Ubuntu 11.04 可能不在列表中。如果你从第一个下拉菜单中选择“Other
    Live Linux ISO”，请浏览并导航到你下载的 Ubuntu ISO 文件。


    最后，选择你之前记录的 USB 闪存盘字母，勾选格式化框并点击“创建”。你的 USB 驱动器将自动转换为启动盘。


    这可能被列为 USB 设备，如果有，闪存盘可能会出现在硬盘启动优先级中。完成后，选择保存设置并退出 BIOS 的选项。你的笔记本电脑应该重启并从 USB 驱动器启动。你看到的第一个界面是一个菜单。第一个选项允许你在不安装系统的情况下尝试
    Ubuntu，而第二个选项允许你在你的笔记本电脑上安装操作系统。


    # 从 USB 启动


    # 如何……在你的网络或笔记本电脑上安装 UBUNTU


    接下来，你需要配置你的电脑或笔记本从 USB 闪存盘启动。将 USB 插入端口并打开笔记本电脑。你需要按下正确的键进入 BIOS，这通常是 F2、F2 或
    F10，但请注意任何提示。进入 BIOS 后，寻找“启动优先级”（Boot Priority）部分。这在每台电脑上的位置都不相同，因此你可能需要到处寻找。一旦找到它，尝试将第一个启动设备设置为你的
    USB 驱动器。


    在第一个屏幕上，你会看到一个符合最佳安装标准的标准清单。连接互联网是最重要的，因为 Ubuntu 在安装时可以下载最新的补丁；选择“安装时更新”。Ubuntu
    需要安装额外的软件。点击“安装此项”并继续。你现在必须决定对硬盘做什么。如果你不再需要现有的操作系统，选择“删除分区”并继续。这将擦除整个磁盘，包括你拥有的任何分区。我们建议备份


