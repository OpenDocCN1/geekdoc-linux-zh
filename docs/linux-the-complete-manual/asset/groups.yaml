    it''s still simple to share files on the network


    ![](img/8ce336de6d0b78d8a67df502f94ad436_44_1.png)


    ### Choose people to share with


    People must have an account and password for this computer to access the files
    they shared. To edit the sharing, select the Network and Sharing Center.


    ## In Windows 7, you need to enable certain options in the Home and Sharing Center
    before folders can be shared


    ![](img/8ce336de6d0b78d8a67df502f94ad436_44_2.png)


    Right-click on the folder and click Sharing and Security. If you want to share
    a whole hard disk, you''ll need to tick the box next to that says "If you understand
    the risk and want to share the root of the disk, click here".


    On the Sharing tab, tick the box next to share this folder on the network. You
    can change the name of the folder so you can easily identify it on your computer.
    For example, you might change My Computer to ''Documents'' if you need to share
    the My Documents folder for multiple users on the PC. Click OK, and Windows will
    apply the changes.


    ### Choose people to share with


    People must have an account and password for this computer to access the files
