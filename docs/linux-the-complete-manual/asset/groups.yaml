    # Connecting a video camera to your PC


    Linux is perfectly capable of editing your video files. Here we''ll show you how
    to transfer your files from your camcorder to your PC.


    Connecting your digital video camera to Ubuntu should be pretty easy, as the operating
    system has built-in support for recorders. However, there are some areas that
    could give you problems. Before we start, we''ll talk you through the difficulties
    that you might face.


    There are two types of video-camera that you''re likely to want to connect to
    your computer: MiniDV and memory storage models. In short, MiniDV models will
    be very tricky to install. Many require a FireWire port to connect and a specific
    driver to be installed. It''s not possible to work around the problem, but you''re
    likely to run into a number of difficulties when doing so. Our advice is to keep
    a PC running Windows handy for connecting this kind of camera.


    If you have a flash-based or hard-disk camcorder, things are a lot easier. In
    this section we''ll show you how to use this type of camera and copy files from
    it to Ubuntu.


    - Modern flash-memory or hard-disk camcorders are easy to connect to Ubuntu


    ## CONNECTING YOUR CAMERA


    Depending on the type of camera that you own, you''ll have a choice of connection
    methods. If your camera has removable storage, such as an SD card, you can just
    use that. All you have to do is have a card reader, take the card out of your
    camera and put it in the reader. The card will be available on the desktop.


    If your camera uses internal memory or a hard disk, or you don''t have a memory
    card reader, your only option is to plug in your camera using USB. In our experience,
    camcorders can use various wonderful USB cables, so remember to use the one that
    came in the box.


    ## BASIC DESKTOP TASKS


    Digital cameras may offer multiple connection modes like Picture Transfer Protocol
    (PTP), but video cameras only have one: mass storage. All you have to do is plug
    your camera via USB and it will be recognised as a flash storage device. If you
    have photos stored on your camera using stills as well as videos, you''ll see
    a dialog telling you "you have inserted a media with digital photos." The default
    option will be Shotwell. Don''t select this; instead select Folder and click.


    Alternatively, you can view your camcorder''s files by clicking on the Places
    menu. You can then browse your camcorder as though it were any other storage device.
    Any videos that you find can be copied from the device to your hard disk by dragging
    and dropping.


    - Before you can play a video file, you may have to install an additional codec.
    Please select the packages for installation to provide the following plugins:


    - h264-decoder

    - gstreamer-1.0-plugins-good


    ## VIEWING FILES


    Before you start editing videos (see page 68), you may want to check the lists
    that you don''t want to use. Ubuntu can play back most video files and we have
    no problems with 1080 HD video files from our camcorder. However, some HD cameras
    have been known to use strange formats, so you may need to search the Ubuntu forums
    for information on what to do.


    To view a file, simply double-click it and the Totem Movie player will start.
    By default, this player doesn''t have a lot of video codecs (the software used
    to display a video file), but it can detect automatically what it needs to install.
    When you try to play a file, you''ll see an option to install additional plugins,
    such as:


    - You can preview your video files and keep the ones you want to be edited.

    - gstreamer-0.10-ffmpeg H.264 codec.


    Select the default option and click. Once the codec has installed, you''ll be
    able to preview your video. The software doesn''t always get it right, so the
    pictures may look square. Use the Aspect Ratio Adjust menu. This should fix the
    square and make it look right. Once you''ve previewed it, you can delete the ones
    you don''t want and save the others to edit.


    Installing the codec also means that supported videos will automatically have
    a thumbnail generated in the file browser. This is similar to the way in which
    Windows handles video files. It makes it easy to see quickly what you''ve got
    and select the right clip without having to preview it first.


    Once you''ve copied from your camcorder, you can edit them in the package which
    you choose. We''ve got more details on how to do this in our guide to video editing
    with Kdenlive on the following page.


    - You can browse your camcorder''s files just like any other storage device.


    # CHAPTER 4

    # Editing video


    Want to cut out the chaff from your video footage before uploading it to YouTube?
    We''ll show you how using Kdenlive.


    You may have noticed that Ubuntu doesn''t come with an application to edit video.
    That''s because only recently developers have started work on it.

    '
