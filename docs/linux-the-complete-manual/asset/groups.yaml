    ## CHAPTER 7


    ### Configuring FreeNAS


    In the previous chapters we showed you how to install FreeNAS and turn an old
    computer into a network-attached device. However, we only scratched the surface
    of what FreeNAS can do. Here we''ll take you through some of its advanced features
    so you can use the application to its full potential.


    The first place to start is security. Default installation of FreeNAS doesn''t
    have any usernames or passwords, so anyone could access it. While this is fine
    on a local network, if you''re going to use advanced features that are accessible
    over the internet, such as the FTP server, you''ll need to know how to set up
    users and groups.


    At the time of writing, the current version of FreeNAS doesn''t let you choose
    which users have access each service. This means that with any username and password
    one can access every feature. For home this shouldn''t make any difference, unless
    you''re really to restrict access for members of your family.


    ## BACK UP CONFIGURATION


    If you develop a problem or if you need to reinstall FreeNAS, you''ll need to
    restore it. If you don''t back up your configuration, you risk losing every file
    stored in your RAID array.


    To do this, log on to FreeNAS''s web-based management and click Backup/Restore
    from the System menu. Click Download configuration and save the file to your PC.
    If you need to restore your configuration, use the same name, click the Browse
    button, select the file you backed up and click Restore configuration.


    It''s also worth checking that you have the up-to-date version of FreeNAS. Go
    to www.freenas.org and download the. From the list of files, download the latest
    iso (i386 for 32-bit and amd64 for 64-bit versions), which you''ll need to burn
    to CD. In FreeNAS''s web-management page, select Firmware from the System menu.
    Select Enable for upload, click Browse the .img file you downloaded and click
    Upgrade firmware. This will upload the file automatically and update your computer,
    restarting it when completed.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_137_0.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_136_1.png)


