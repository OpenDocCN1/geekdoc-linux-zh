    # EXTERNAL DRIVES


    The process of transferring files from a USB hard drive, flash drive or memory
    card is almost identical to the process we''ve described for networks. The only
    difference is that when you plug one of these storage devices into your computer,
    a File Browser should automatically appear showing the feature of Ubuntu that
    is a shortcut. The drive will appear on the desktop so you can quickly access
    the drive while it remains connected.


    Once you''ve selected the files, then press Ctrl+C to copy them or choose Copy
    from the Edit menu. Navigate to the folder on where you want to transfer the files
    (you can open a new File Browser window; just head to the Places menu and choose
    one of the folders there). Then choose Paste from the Edit menu or press Ctrl+V
    if you prefer to use keyboard shortcuts.


    If you want to move the files rather than copy them, choose Cut from the Edit
    menu when you''ve selected them. However, this will work if you only ticked the
    ''Allow network users to change my files'' box when sharing folders in Windows
    XP. This shouldn''t be a problem with Windows Vista computers, as the default
    permission is ''Owner''.


    You now select files and copy them to your hard disk using the same methods as
    transferring files over the network. Before unplugging your USB flash drive, hard
    disks or memory cards, click the eject icon, which appears to the right of the
    drive in the Places pane of the File Browser window. This helps prevent files
    from becoming corrupted.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_46_1.png)


    # WHAT A DRIVE


    Another way to transfer files, which may be the easiest way for some people, is
    to have two File Browser windows open on your desktop. One window will show the
    files stored on the remote computer, while the other will show the folder on your
    local hard disk that you want to copy to. To resize the File Browser window, simply
    hover your mouse over the bottom-right corner of each window until the cursor
    changes, then drag until the window is the right size; it''s exactly the same
    process as in Windows.


