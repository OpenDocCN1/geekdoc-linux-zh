    folder. File type option lets you select files.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_124_2.png)


    ## Making an image of your system


    A system image is the most complete backup you can perform, as it makes a copy
    of your operating system, applications and files.


    Now you have Ubuntu working the way you want it and downloaded all the drivers
    and extra software you need, know just how much it is to get a computer up and
    running from scratch. Imagine the pain you''d feel if your PC decided to fail
    over tomorrow taking your hard disk with it. More or likely, as time goes on,
    you''ll suffer from trouble. All these extras applications and hardware you installed
