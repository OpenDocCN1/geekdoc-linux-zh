    20GB 为一组购买，每月 2.99 英镑或每年 18.50 英镑。点击“服务”选项卡查看哪些内容将与你的在线存储同步


    ## 开始使用


    在使用在线备份工具之前，你需要一个 Ubuntu One 账户。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_115_0.png)


