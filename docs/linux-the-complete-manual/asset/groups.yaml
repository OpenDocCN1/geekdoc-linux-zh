    # Connecting a digital camera


    Before you can edit your photos, you need to transfer them from your digital camera.
    This is as easy in Linux as it is in Windows.


    Linux has come a long way since it was first created. It''s now just as friendly
    towards multimedia devices as digital cameras as Windows. In this guide we''ll
    show you how to connect your digital camera to your computer and download your
    photographs.


    ## USING A CARD READER


    One of the easiest ways to download pictures to your PC is to use a USB card reader,
    just as you would in Windows. These simple devices cost around £10 for a reader
    that will work with pretty many card formats in the world. Make sure that your
    format is supported before buying, remember you need a device that will support
    SDHC if you use SD cards larger than 32GB in size.


    - Other than that, it couldn''t be easier than simply plug the reader into your
    computer and Ubuntu will recognise it. When you plug in a card, it will be recognised
    in a similar way to a USB disk, allowing you to copy files from it using the File
    Browser; the memory card will be listed on the left where all your other drives
    are listed.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_59_0.png)


    > You may need to change your camera''s mode for computer to recognise it

    USB card reader is an easy and convenient way to transfer files from your digital
    camera.


    The alternative method is to download pictures directly from your digital camera,
    too, is very easy to do, but there are some things you need to look out for. To
    start with you should check the modes that your camera supports. Many digital
    cameras can be recognised as either a mass storage or a Picture Transfer Protocol
    (PTP) device.


    When set to mass storage, the camera is recognised by your computer as a USB storage
    device. PTP tells the computer it''s a camera that gets connected. We tested both
    modes and found that Ubuntu supports both, so you probably won''t need to change
    anything; however, if you''re having problems, we recommend changing your camera''s
    mode. We typically set our cameras to use PTP, as this is slightly easier to use
    with a computer.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_59_1.png)


    # BASIC DESKTOP TASKS


    ![](img/8ce336de6d0b78d8a67df502f94ad436_60_0.png)


    You have just inserted a medium with digital photos. Choose what application to
    launch.


    You can choose how to deal with files when you connect a digital camera to your
    PC.


    The thumbnail previews help you manage pictures you want to copy from your camera.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_60_1.png)


    Open Shotwell Photo Manager


    ![](img/8ce336de6d0b78d8a67df502f94ad436_60_2.png)


    draw RAW images from your Nikon D80 DSLR.


    All you have to do is select the images that you want to copy. Press Ctrl+left-click
    to select individual images, using Shift+left-click to select a range of images.


    # GETTING CONNECTED


    Plugging your camera in is as simple as connecting the provided USB cable to your
    computer and camera, and then turning it on. Depending on the model and type of
    camera, you can also select the PC modes that the camera knows will be transferring
    images to you.


    When you''re happy with your selection, click Import Photos. Your pictures are
    copied to your Photos folder and sorted into folders by date and then.


    Once connected, a window will pop onscreen telling that you''ve inserted a medium
    with digital photos. You then choose which application to launch.


    When you''re ready, click Copy copying the images from your camera to your hard
    disk. Depending on the size of your memory card, the size of the images and the
    number of photos, this process can take anything from a few seconds to several
    minutes. Once the process has completed you''ll get a message and be asked to
    delete the photos from your camera.


    You have two options: the Shotwell photo manager or Folder Link. The latter lets
    you access the camera directly and manually copy files from it. We prefer the
    Shotwell Photo Manager option; select this and click OK.


    # SHOTWELL


    # IMPORTING PHOTOS


    Shotwell will start and display a window with a list of photos on your camera,
    with a thumbnail preview. The software supports pretty much every image format
    and could


    When you''ve completed copying files from your digital camera, the photos will
    be stored on your computer. You can then edit and organise them with Gimp (see
    page 60 for more information). Alternatively, you can view them in Shotwell. To
    do this, click Last Import to view all imported files or click Library to view
    all the image files on your computer.


    > Once you''ve imported your photos, you can edit in Shotwell Photo Manager


    You''ll be able to see thumbnails of all your photos. Double-click on an image
    to open it in the photo editor. Here you can view the full-screen, adjust its
    colour, straighten and crop it and remove red-eye. You might need to make only
    a few changes, these tools will be plenty enough for you. However, they''re fairly
    simplistic; Gimp is a far more capable image-editing application, while Picas
    (see page 64) enables you to organise your photos into searchable libraries.


    ![](img/8ce336de6d0b78da67df502f94ad436_60_3.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_60_4.png)


    THE COMPLETE MANUAL 59


    # Getting started with Gimp


    It may have a funny name, Gimp is a powerful photo-editing application, and it
    comes free with Ubuntu.


    If you can look past the unusual name [wait, if you can look past the unusual
    name], Gimp is an excellent image-editing package. Its interface isn''t quite
    easy to use as Adobe''s Photoshop Elements, but it has improved hugely over the
    past few years. In fact, the three-separate-window approach makes it much more
    like the full-blown Photoshop, and there are lots of features that will keep even
    enthusiastic photographers happy.


    This is the main window and shows the photo you''re editing.


    Click this button to show the undo history.


    This is where you''ll find the bulk of the tools, including selection, scaling
    and perspective, cloning, blur, sharpen and smudge. There''s even a Healing Tool,
    which can automatically fix blemishes.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_61_0.png)


    Layers let you work on different parts of an image without affecting the rest
    of it, like transparencies on a projector; placing several on top of each image
    besides on the wall. In this case, the final image is one in the main window.
    You can show or hide a layer by clicking the eye icon.


    The brush options let you choose the shape of the brush, its size and opacity,
    and a number of other advanced settings.


    The brushes palette can be switched for patterns or gradients by clicking the
    respective icon at the top.


    The zoom control lets you zoom in and out of the image. Selecting 100% shows you
    the actual pixels that make up the image.


    # BASIC DESKTOP TASKS


    ![](img/8ce336de6d0b78d8a67df502f94ad436_62_0.png)


    If you need to install Gimp from the Ubuntu Software Centre, it''s not installed
    by default. It loads quickly, but doesn''t automatically ask if you want to open
    a photo. You can drag a photo from File Browser or use the File, Open... menu.


    Be careful when dragging images into Gimp if another is already open, by default,
    Gimp will add a new layer to the existing image.


    The quickest way to zoom in and out is to hold down Ctrl and roll your mouse wheel
    up or down. You can also use the zoom box at the bottom, or the magnifying glass
    icon in the tool palette and click and drag on the area you want to zoom.


    # LAYING ON THICK


    Layers are a powerful way to edit photos. You can load multiple photos as different
    layers of the same image, unlike you might want to do this. Only the photo in
    the top-most layer will be visible unless you make it more transparent. This will
    let the layers behind through, creating an effect like ghostly.


    There are many uses for layers, one which to create high dynamic range photos,
    where you load the same shot at different exposures: one underexposed, one overexposed.
    By blending the three and erasing portions of each layer, you can create some
    results.


    Each new layer uses more of your PC''s memory, so if you have lots of layers,
    your Gimp might feel sluggish and you may need to upgrade your computer.


    # ROLLING BACK THE DAYS


    If you think you''ve made a mistake and want to go back to a previous version
    of your photo, click on the yellow arrow near the top of the Layers palette. This
    switches the view from Layers to History: to switch back, click on the stack of
    frames, or press Ctrl+Z.


    In the History, you''ll see all the changes you''ve made to the photo. Each list
    item is updated with a small icon showing the change and a description of the
    tool effect used. Just click on any entry in the list.


    # TOUCH-UP JOB


    Layers may be interesting, but for the most part, you''ll probably want to improve
    photos in order to print them, send them to friends and family or post them on
    the internet after a party, for example. On the next two pages, we''ll show you
    how to use Gimp''s tools to turn a flatter-looking photo into something that looks
    as if you''ve got real photographic flair.


    THE COMPLETE LINUX MANUAL | 61

