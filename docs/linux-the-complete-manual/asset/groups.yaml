    # 移动设备与 Linux 同步


    将手机备份到 PC 是保存设置并确保无论在何处都拥有相同联系人的绝方法。


    即使在 Windows PC 上，所有手机制造商都提供了让你可以将手机与计算机同步的软件。但在 Linux 上情况并非如此。幸运的是，这并不意味着你无计可施；有第三方软件可以兼容大多数手机，让你能够备份短信。目前没有简单的方法可以将手机直接与
    Ubuntu 的邮件客户端 Evolution 同步，因此请先想好你想做什么。如果你的手机可以通过数据连接与如 Google Mail 等邮件服务同步设置，这可能是最佳选择，或者你也可以简单地让
    Evolution 与同一源同步。


    即使你决定使用其他方法，将手机连接到 Ubuntu 对其他用途也有帮助，例如下载照片。首先，你必须确定想如何进行同步：蓝牙还是 USB。USB 更简单，因为你只需要插入兼容的手机即可。蓝牙则更方便，你永远不需要物理上将手机连接到
    PC。


    如果你使用 USB，在插入手机时可能会看到几个连接选项。“大容量存储（Mass Storage）”或类似的选项将作为普通存储设备出现；原生模式（如诺基亚）会希望手机以手机身份出现，你需要其他软件来连接它。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_79_0.png)


    > 你可以轻松地与 Ubuntu 同步手机


    如果你的计算机上安装了蓝牙，你会看到一个新图标显示它正在工作


    # 通过蓝牙连接


    要使用蓝牙，你的 PC 上需要一个蓝牙适配器。如果你使用的是笔记本电脑，这可能是内置的，但对于台式 PC，你需要一个蓝牙适配器——只需几英镑，在插入时 Ubuntu
    就能识别它。


    一旦连接好适配器，你将看到一个选项列表，点击“设置新设备（Setup new device）”，这将搜索新的蓝牙设备。然而，这并不总是有效，因此从手机上管理连接可能会更容易。首先，点击蓝牙图标并选择“偏好（Preferences）”。勾选“允许计算机可见（Make
    computer discoverable）”框并为计算机输入名称，该名称将出现在你正在搜索的手机上。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_79_1.png)


    # 基础桌面任务


    ![](img/8ce336de6d0b78d8a67df502f94ad436_80_0.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_80_1.png)


    输入你的密码

    将你的手机连接到计算机


    手机类型

    请选择手机制造商或类型。请尽可能具体。


    Wammu 让 Linux 计算机连接到大多数手机变得简单。


    - 手机类型

    - 我不知道

    - 智能手机

    - 阿尔卡特（Alcatel）手机

    - 三星手机

    - 诺基亚手机

    - 索尼手机

    - 夏普手机

    - 爱立信手机

    - 以上都不是


    进入手机上的蓝牙菜单并确保其已开启。接下来，寻找一个图标开始搜索，然后输入你发现的数字代码并选择 OK。PC 上将弹出一个对话框要求你输入相同的代码。执行此操作并点击
    OK。


    一旦设备配对成功，你的手机将出现在设备列表中，并显示设备类型（手机）。你可能会得到连接到计算机的选项。选择“是”，这样你的手机每次在范围内都会连接到你的计算机。这避免了你每次都进行物理连接。


    要进行连接，从手机菜单中选择“连接”。如果出现错误，尝试运行向导并选择不同的连接。要查看手机上的联系人、短信、通话和日历条目，请从“检索（Retrieve）”菜单中选择相应的选项。你可以编辑、创建新的联系人、短信，且更改将自动写入手机。


    # 浏览你的手机


    当你点击蓝牙图标时，手机将出现在“设备”下。选择它，你将看到“浏览文件”选项。选择此项，你就可以从手机内部内存拷贝文件。


    # 备份你的手机


    要备份手机，你需要安装 Wammu。从应用程序菜单中选择“软件中心”，并在搜索框中输入‘wammu’。双击结果中的 Wammu，然后点击“安装”。


    要备份你的数据，请使用下拉菜单保存联系人（vCard 格式）。如果你保存了联系人和日历信息，可以将其导入到另一个应用程序中。如果你使用蓝牙，你需要让手机临时变为可见，否则
    Wammu 将无法找到。你可以从 Evolution 导出联系人或事件，将它们导入 Wammu 并保存到手机上。


    # 使用 Google DESKTOP


    Ubuntu 的某些操作与 Windows 有许不同，这起初可能会让人困惑。特别是定位文件可能很困难，因为它们存储在不同的地方。虽然内置搜索工具有所帮助，但你可能更喜欢使用
    Google Desktop 来搜索 PC（包括存储在 Ubuntu 邮件客户端 Evolution 中的文件），速度像搜索互联网一样快。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_80_2.png)


    # 下载与安装


    正如 Google 让搜索网页变得简单，它还会教你如何制作文件和电子邮件。在下一页，你将面临应用程序的选择。选择 .deb 版本，适用于 Ubuntu。确保获取了适用于你操作系统的正确版本（32
    位或 64 位）。点击 OK 并在下一页点击“安装”。


    一旦你将文件下载到硬盘，在 Firefox 的下载窗口中双击该文件。这将启动包安装程序。Desktop 在 Windows 和 Linux 上的用法相同。如果你已经用过
    Windows 版本，你对 Linux 版本会非常熟悉，它将帮助你上手新功能。然而，Linux 版本的安装步骤不同，这里是获取 Google Desktop
    的方法：软件中心未提供，因此必须手动下载。访问 http://google-desktop.com/linux/index.html 并点击“Download
    Desktop”按钮。


    # 运行 GOOGLE DESKTOP


    Google Desktop 通过应用程序菜单访问。第一次运行时它会提示你设置目录。在开始之前，你应该让 Google Desktop 按照你想要的方式工作。取决于文件的数量，可能需要几个小时。


    # 设置偏好


    在等待计算机索引文件时，你可以配置 Google Desktop。在这里你可以


    ![](img/8ce336de6d0b78d8a67df502f94ad436_81_0.png)


    # 搜索你的计算机


    搜索 Desktop。你可以使用其他选项来选择查看多少搜索结果。完成后点击保存。


    # 搜索你的计算机


    搜索计算机最简单的方法是按 Ctrl i。这将弹出一个搜索框。在搜索框中输入你想找的内容，它将出现在下拉列表中。它旁边的图标告诉你它是图片、文件还是邮件。如果列表中的某个图像是你想要的，选择它将直接打开。


    或者，如果你在列表中没有找到要的，可以在浏览器中查看所有内容。使用 Firefox 搜索你的计算机而不是互联网。你可以通过页面顶部的链接细化搜索结果。


    在可用情况下，结果将附带文件的缩略图和文本摘。在这里你可以缩小搜索范围以找到想要打开的文件。


    一旦你选择了搜索类型，可以使用更多选项来查找特定文件。例如，如果你选择了媒体，则可以从下拉菜单中指定你想查看的 JPEG 文件；对于邮件，你可以指定查看来自特定人的邮件。


    最后，搜索结果还会告诉你如何完成计算机的索引。如果你看到警告消息，应该等待索引完全完成后再次搜索；过早搜索意味着你正在找的文件可能尚未被索引。


    '
