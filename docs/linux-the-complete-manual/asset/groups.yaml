    you can only read files or write to them.


    Unlike Linux, Windows doesn''t have network drives. Instead, it has bookmarks,
    which perform a similar function. To add a bookmark for a shared folder, follow
    the process above to access a share, then click Bookmarks, Add Bookmark. When
    you restart your computer, the shared folder will remain. You can view it by bringing
    up a Nautilus Browser window (do this by clicking Places, Home), where you can
    view your bookmarks in the bottom-half of the left-hand panel.


    # CONNECTING ELSEWHERE


    Connecting to other Linux computers is as simple as connecting to a Windows PC.
    To this do, click Places, Connect to Server: Windows shares, type the name of
    the Linux computer to which you want to connect in the Server box and click Connect.
    When you access a share and are prompted for a username and password on the Linux
    computer to you''re connecting. Note that you don''t need to change the domain
    name.


    You may occasionally see an error where the bookmark retains itself as SMB; if
    this happens, right-click on it and select Rename, then type a useful name.


    You can also create a bookmark when you connect to a computer using the Places,
    Connect to Server dialog: just click the ''Add bookmark'' box and type in a bookmark
    name.


    # Transferring files to your Linux computer


    Now Ubuntu is up and running, you''ll want to transfer your documents and media
    to the computer. Here''s how:


    Now that your computer is set up just the way you want it, you can hopefully already
    tell that Linux feels considerably quicker than Windows. It should shut down faster
    and boot up in just a few seconds. However you probably have lots of files from
    your Windows PC that you want to transfer to your new one, such as documents,
    music, photos and videos. Alternatively, you may need to copy files from an external
    hard disk or USB flash drive to which you''ve backed up files. If your computer
    has a memory card reader, you will also be able to transfer files from the card
    to hard disk. Over the next few pages, we''ll show you how to do it.


    # CONNECTING OVER A NETWORK


    In most cases, your Ubuntu computer will be connected to your home network by
    a network cable or Wi-Fi.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_43_0.png)


    - You need to share folders in Windows before they''ll be visible on the network

    - Your Wi-Fi network should provide the correct connection settings, but you can
    alter these easily


    ![](img/8ce336de6d0b78d8a67df502f94ad436_43_1.png)


    Somewhere on your network is likely to be a broadband router that allows you to
    share internet access between all the computers on the network. This router will
    also allow PCs to share files with each other, and this is one way to transfer
    files to your Ubuntu computer.


    Before you do this, you can share the folders that contain the files you want
    to transfer to the other computers on your network, otherwise Ubuntu won''t be
    able to access the files. In Windows XP, use Windows Explorer to navigate to the
    folder you want to share, but don''t open the folder itself. For most people,
    it makes sense to share the My Documents folder.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_43_2.png)


