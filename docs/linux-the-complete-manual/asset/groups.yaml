    C:\windows\ubuntu-10.04-notebook-amd64.iso

    Step 3: Select your USB Flash Drive

    [x] Check the box if you want to format Drive G:

    Click HERE to visit the Universal USB Installer for additional HELP

    Universal USB Installer http://www.pendrivelinux.com

    ```


