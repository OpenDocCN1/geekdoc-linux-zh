    \ will launch and be immediately familiar if you've used the Windows version before.\
    \ You'll be prompted to choose whether you want Chromium to be the default browser;\
    \ if you do, click 'Set as default'.\n\nOne of Chromium's best features is ability\
    \ to synchronise bookmarks, extensions, preferences and more between different\
    \ computers and the cloud. You all need a Google account with '@gmail' address.\
    \ If you don't have one, you can get one for free from www.google.com. Once you\
