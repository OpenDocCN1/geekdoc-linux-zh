    4 |


    If you have a media server you can use transcoding to turn one file into another.
    Then put it in the Transcoding box, and FreeNAS will convert files into a compatible
    format. Transcoding operation is processor-intensive, so if your PC''s performance
    suffers, you turn off this feature, select a Temporary Directory in which to store
    the transcoded files.


    Finally, Enable web user interface, click Save and restart the server. Your server
    will now be working. You can click on the URL link to view a web page with the
    status of your server.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_140_0.png)


    configure a new rule that forwards all incoming traffic to Port 21 to the IP address
    of your NAS. Your router''s manual will tell you how to do this, and www.portforward.com
    has help information about it.


    Once that''s done, you can access FreeNAS over the internet. In a web browser,
    you type `http://yourDynDNS.org` you created, such as http://computers.homeip.net,
    you can also use your DynDNS.org URL in a Dictated file path.


    To turn on iTunes sharing, select iTunes/UPnP from the Services menu and follow
    these instructions. The only difference is that you need to set a password for
    the administrator''s web page, and then click OK at the bottom of the page to
    make sure these two network services are selected and turned on, otherwise iTunes
    will not detect your NAS.


