    when it''s finished, leaving only the copy of your email on your PC. There is
    no interaction between an IMAP server, mail is stored on the server and accessed
    by the client. Any email you read on your PC is marked as read on the server,
    and vice versa. If you are away and use webmail to read email, when you get home,
    your client will have that email has been read. IMAP''s best choice if you have
    a lot of email storage on a server, such as with Google Mail''s 7GB limit.


