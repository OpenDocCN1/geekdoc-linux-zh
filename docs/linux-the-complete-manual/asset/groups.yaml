    Brasero 是 Ubuntu 内置的光盘刻录程序，它提供了一系列易于使用的选项。以下是使用方法：


    ## 如何……刻录一张音频 CD


    1. 使用 Brasero 创建数据盘和音频 CD 非常简单。友好的界面有一了一大大按钮，允许你刻录音频 CD 和数据盘、创建视频 DVD、制作 CD 和
    DVD 的直接复制，以及刻录 CD 或 DVD 的 ISO 镜像。它可以擦除可重写的 CD 和 DVD。

    2. 将一张空白的 CD-R 插入你的 CD 驱并启动 Brasero Disc Burner（你可以在应用程序菜单中找到它）。在“创建新项目：”标题下点击“音频项目”按钮。

    3. 点击绿色的 + 号并浏览你的音乐来添加音频文件。Brasero 支持你已安装解码器的任何格式。如果你在安装 Ubuntu 后立即运行它，你会发现它不支持
    MP3。要安装解码器，只需在 Synaptic 软件包管理器中搜索你需要的格式并将其标记为待安装。完成后，点击你想要刻录的文件。Ctrl-A 选择文件夹中的所有文件，或点击你想要的第一个文件，按住
    Shift 键点击最后一个文件以选择一组文件。

    4. 点击“添加”，文件将被添加到项目中。你可以在底部的框中为 CD 输入标题，并通过双击每个音轨来编辑信息；如果你有一台 CD 播放器，这非常有用。你可以使用工具栏上的刀形图标拆分轨道，这会在轨道后添加两秒钟的暂停。

    5. 点击“添加”，文件将被添加到项目中。你可以在底部的框中为 CD 输入标题，并通过双击每个音轨来编辑信息；如果你有一台 CD 播放器，这非常有用。你可以使用工具栏上的刀形图标拆分轨道，这会在轨道后添加两秒钟的暂停。点击底部的“刻录”按钮。如果你在刻录过程中遇到问题，唯一的方法是将刻录速度降低到某个设置。当你点击“刻录”后，Brasero
