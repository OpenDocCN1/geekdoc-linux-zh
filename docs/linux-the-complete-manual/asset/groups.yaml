    # 第 4 章


    ## 使用 Gimp 优化照片


    对于初次用户来说，Gimp 的界面可能会让人有些无从从。这些简短的教程将引导你如何使用主要工具。


    Gimp 可能不是最易用的照片编辑器，但它是最强大的编辑器之一。与 Picasa 等程序相比，它对你的照片提供了更多的控制权。


    阴影比眼睛外圈要深。你可以调整色调以匹配主体眼睛的实际颜色，但一旦缩回原来的，不太可能有人注意到。


    ## 处理红眼


    你的收藏中免会有这样的照片，其中主体患有红眼症。否则，非常棒的照片可能会被直向外看的激光红眼所毁掉。这是由于相机闪光灯的光线从主体的视网膜上反射造成的，你总会在晚上在室内拍摄的拍照片中看到这种效果。幸运的是，使用
    Gimp 很容易去除红眼，只需要几分钟时间。


    - 启动 Gimp 并打开你想编辑的照片。我们的照片是在晚上的一家餐厅拍摄的，我们使用了开启闪光灯的紧凑相机。两个主体的眼睛看起来都有魔性，我们需要处理这个问题。

    - 放大到你想处理的眼睛，放大到 400% 左右。使用套索工具（顶部左侧）在区域周围画一个圆。如有必要，按 Enter 键完成选择。然后按住 Ctrl 键并选择眼睛中间的白色亮部分，我们不想调整这部分。

    - 在“工具”（Tools）菜单中，点击“色彩工具”（Colour Tools），然后点击“色调/饱和度”（Hue-Saturation）。向左拖动“饱和度”（Saturation）滑块，以及“亮度”（Lightness）滑块，直到


    ![](img/8ce336de6d0b78d8a67df502f94ad436_63_0.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_63_1.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_63_2.png)


    - 按 Ctrl-Shift-A 检测眼睛，你会发现它看起来相当不错。对图像中的其他眼睛重复步骤 2 和 3。最后，使用窗口底部的下拉框将缩放级别更改为 100%，你就可以欣赏你精湛的作品了。在移动到下一张之前，别忘记保存图像。


    - 现在我们需要一点饱和度，所以我们向右一点打开“色调/饱和度”工具——拖动“饱和度”滑块，取决于你相机的处理情况，你可能需要比我们在这里应用的 +15 更多或更少


    如果你想增加单个颜色的饱和度——例如草地的绿色或天空的蓝色——点击你想要的颜色旁边的白色圆圈，并调整你想修改的滑块。如果你犯了错，只需点击“重置”（Reset）按钮即可。


    ![](img/8ce336de6d0b78d8a67df502f94ad436_64_3.png)


