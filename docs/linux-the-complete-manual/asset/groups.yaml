    Install bottom. Once you have completed, you can use Ubuntuzilla to install Firefox.
    Bring up the Terminal from Athe Ubuntu search menu and type in the following command:


    ```

    sudo apt-get install firefox

    ```


    If the installer says it can''t get a PGP key, try this command:


    ![](img/8ce336de6d0b78d8a67df502f94ad436_94_0.png)


    Press y to accept the latest version of Firefox. Then type 13 to choose EN-GB
    as the language and press y to accept the change. Now your browser will be downloaded
    and installed on your computer.


    Once the installation is finished, you can launch the version of the browser from
    the Applications menu. It will be called Firefox and the quick-launch icon will
    also point to the new installation.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_94_1.png)


    # GONE IN A FLASH


    Flash is one of the main internet technologies and is used for diverse things
    as menus and videos. To watch YouTube, use the Flash player. If you visit a site
    that requires Flash, you may be prompted to install it automatically, but this
    isn''t the case, so it''s best to install it manually.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_94_2.png)


    To do this, open Flash and go to help down menu, you can select different versions
    depending on your Linux distribution. Select Ubuntu 10.04 and click the Agree
    and install now! The button will be downloaded to your computer: Once it is finished,
    double-click the install file (install_flash_player_10_linux.deb). Cancel any
    messages about a newer version being available and click install. Type in your
    password when requested and Flash will install automatically. After a few minutes,
    Click to complete the installation.


    Once the installation is completed, restart your browser. Shut down and start
    Firefox again. To make sure it''s working, you should visit a website that uses
    Flash, such as YouTube. You will be able to play video. If Flash is not working;
    you get an error message, download and reinstall.


    # CUP OF JAVA


    Java is another common web technology that is used by many websites. It''s not
    always visible, but it''s often used behind the scenes to make jobs such as filling
    out forms easier. Ubuntu comes with its own virtual machine (VM) installed,


