    and hopefully finding that life''s even smoother.


    Many of the options you''ll need are available via the launch bar, which is similar
    to Windows'' taskbar. This is a narrow area that runs across the screen. It displays
    a number of icons and text. The first option is Ubuntu along with a text label
    that reads Applications. This is the equivalent of the Windows Start. If you click
    it, a dropdown menu appears showing a list of programs you can run. Click on the
    System menu, which will appear to the right of the launch bar, and you''ll see
    the sort of options you find in Windows'' Control Panel.


