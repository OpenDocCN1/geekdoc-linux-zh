  md: '# # Using LibreOffice


    Ubuntu comes with a complete office suite that caters for your word processing,
    spreadsheet, presentation and business graphics needs


    If you''ve ever used an office suite such as Microsoft Office or Works, you''ll
    be right at home with LibreOffice. In fact, you''ll be hard pushed to find the
    differences between Word, Excel or PowerPoint and Writer, Calc or Impress, their
    LibreOffice equivalents. Save in mind


    Writer wouldn''t be much use if you couldn''t save documents in a format that
    Microsoft Office users could. Fortunately, LibreOffice can save in many formats,
    so you can pick one that''s compatible with the people you''ll be sharing it with.


    Writer is indistinguishable from Microsoft Word and has a very similar set of
    features. Even the menus are organised in the same way, so you should be able
    to find all the commonly used functions in seconds.


    Since Ubuntu comes with the latest version of LibreOffice, you''ll always get
    updates when they''re released. However, few people will need more than that.
    Writer provides controls for the text-formatting, you can insert pictures, tables,
    videos, audio, headers and footers.


    As you expect, Writer includes spelling and grammar checkers, you can also add
    notes to a document; these appear in the margin with the author''s name and a
    date. The Format Painter works just like Writer''s: highlight some text, click
    the paintbrush icon and you subsequently adopt the formatting of the text you
    originally selected.


    By default, Writer''s completion is turned on. This predicts which commonly used
    word you''re typing and automatically displays it onscreen. If you don''t like
    it, you can


    easily disable it by going to Tools, AutoCorrect Options... and until enabling
    Writer word completion on the Word Completion tab.


    Another change you probably want to make is when saving every file using the .odt
    format. Head to Tools, Options... and then go to Load/Save. This will expand to
    the General tab; click this and change the format in the Always as save box. A
    good choice is Word 97/2000/XP, but the latest 2007 XML format is also there.


    Calc is the application to use if you need a spreadsheet, and is happy to use
    most Excel spreadsheets without fuss. Whether you want to create a basic sheet
    to keep track of a project''s costs or you need more complex


