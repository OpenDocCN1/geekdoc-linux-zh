  md: '# Backing up with Ubuntu One


    If you want a quick way to back up your documents, the built-in Ubuntu One application
    can help


    The data we store on our PCs becoming increasingly valuable, making sure that
    it''s backed up is essential. One of the best and most reliable approaches is
    to use an online backup service, where data is stored securely. The good news
    for Linux users is that Ubuntu has such a tool in Ubuntu One. Backup is a great
    way of making sure important files are protected. By storing data on a remote
    server, your files will be safe even if your house burns down or your computer
    is lost. The latest version of Ubuntu comes with Ubuntu One, which does this for
    you. It''s still worth making local backups using the


    built-in Linux backup tools as these are quicker to restore, but online backup
    will give you that extra peace of mind.


    We''ll show you how to get started with a free account, which gives you 2GB of
    storage space. Higher-capacity accounts are also available if you need more space,
    and it''s easy to upgrade an existing account.

    You''ll need to create an Ubuntu One-Sign account. To do this, click on Ubuntu
    One from the Launcher. The first time that you run the application, you''ll see
    a screen asking you to create an Ubuntu One Single-Sign (SSO) account. If you''ve
    already got an account, click ''I already have an account''; otherwise, click
    Join, fill out the form and click Email. A verification code will be sent to your
    email. Copy this code and paste it into the dialog box on you. You''ll then be
    prompted to enter your password, which you have already set up. A message telling
    you that your account is ready will be displayed. Once you''ve created your account,
    you''ll be taken to the Ubuntu One application. The first tab will tell you what
    kind of account you have and lets you upgrade the storage space. This can be bought
    in blocks of 20GB, which will cost you $2.99 (around £1.85) a month or $30 (around
    £18.50) per year.

    Click on the Services tab to see what will be synchronised with your online storage


    # GETTING STARTED


    > Before you use the online backup tool, you need an Ubuntu One account


