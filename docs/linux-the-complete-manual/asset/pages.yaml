  md: '# CHAPTER 4


    # # Connecting an iPod


    iPods can be a little trickier to use with Ubuntu than other MP3 players. Here
    are some tips on how to synchronise music and video to


    If there''s one area in which Ubuntu might prove frustrating, it''s compatibility
    with iPods. This is mainly Apple''s fault, not Ubuntu''s. Most iPods don''t show
    up as generic mass storage devices, which means you can''t copy music and videos
    to them using Ubuntu''s file manager as you can with most MP3 players. The portion
    of storage that does appear when you connect an iPod to Ubuntu is the part that
    stores photos and possibly contacts, calendars, notes and recordings.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_75_0.png)


    The internal database is in a proprietary format, which Apple created to prevent
    music and videos from being illegally copied from an iPod to another computer.
    However, there are ways to use your iPod with Ubuntu, and plenty of models can
    be fully synchronized, just as you would in Windows or Mac OS.

    The only models that are likely to cause problems are the iPod Touch, iPhone and
    the latest generation of Nano, Classic, and Video.


    +   - iPods, such as this Classic, work fine with Ubuntu


