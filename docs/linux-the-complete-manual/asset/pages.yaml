  md: '# Installing software


    Although Ubuntu is packed with programs, you can easily add more. Here we''ll
    show you how to bring your system to life


    Everyone knows how to install software in Windows: just double-click the setup
    program and answer a few questions. It sounds you''ll be amazed that discovering
    programs to a Linux system is even easier. In many cases, you won''t even need
    to download the software yourself; Linux software-management system knows where
    to download it from. In other words, Linux does the hard work for you.


    One of Linux''s major advantages is that it grants you easy access to a large
