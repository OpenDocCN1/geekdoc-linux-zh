    # INTRODUCTION TO LINUX


    +   Updates are easy. Ubuntu has a central update manager that updates for all
    the programs you''ve installed. This means there''s just one place you need to
    go to get new versions, one program to run. Windows, on the other hand, doesn''t
    make updates for third-party software. A typical Windows PC is littered with programs
    that run constantly, checking for new versions of the program as is available.
    Ubuntu uses system resources and makes your computer run more slowly.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_8_0.png)


    +   Ubuntu is easy to use, and provides help at every turn


    You don''t need a second monitor. In Windows, you have only one desktop. Open
    a few windows and you''ll be tired of juggling them all. In Ubuntu, you have multiple
    workspaces, which like virtual desktops. Click on an icon, and switch to a new,
    clean desktop. It''s easy to flip between workspaces that you will never be able
    to go back.


    # WHAT CAN''T LINUX DO?


    There are many failings for Linux, but you won''t be able to play the latest titles
    that are available for Windows. This is Linux''s weak area. However, you can run
    Ubuntu along Windows - a technique called dual-booting - which is so easy to call
    of Duty, Colin MacRae: Dirt 2 or your favourite games on the same computer.


    If we''re not honest, Linux does have other failings. Although, there are a number
    of small omissions; for example, Ubuntu needs a code to be installed manually
    to run music in MP3 format. Hardware support, as we''ve said, is good, but it''s
    possible that some things might not work on your computer. Linux on many PCs and
    laptops: some worked perfectly, while others caused headaches. Problems ranged
    from major issues as not being able to boot after installing Ubuntu on a Sony
    Vaio laptop to as unreliable wireless. You may also find that buttons on like
    brightness and volume controls don''t work. The good news is that someone is bound
    to have your problem before, and you''re highly likely to find the solution in
    a forum such as #ubuntuforums.org. If not, ask in the forum, and you''re sure
    to get help.


    There''s no shareware or extra numbers. If you want to install Ubuntu''s Package
    Manager, there are thousands of applications to choose from, and all are free.
    If you like the software keep using it. If not, you will uninstall it. You''ll
    never have to be bombarded by emails.


    It''s just to know how. If you want to use Windows with Ubuntu, you''ll be right
    at home everything works the same way from the ''start'' menu to navigating files
    and folders. Tooltips will help you learn each each icon and button, and there''s
    also a Comprehensive Help.


    Hardware is much better than it used to. One people may have tried Linux because
    they don''t work with their hardware. The truth is that, unless you have a really
    obscure bit of kit, Ubuntu is easy to work with. You''ll probably find that most
    of your computer''s features work as soon as Ubuntu is installed, from wireless
