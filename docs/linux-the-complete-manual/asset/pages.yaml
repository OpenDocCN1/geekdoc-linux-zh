    # INTERNET ACCESS


    The next step is to give access to the computer over the internet. The first problem
    to overcome is that your home has an IP address shared by all computers on your
    network. This IP address can change, making it impossible to access your home
    network. Fortunately, with Dynamic DNS you can create a simple name that updates
    regularly so it always points to your home.


    The only point to make is if your router doesn''t support DynDNS (the free DNS
    service). FreeNAS does, so you won''t need to download any other software.


    Select Dynamic DNS from the Services menu, enable and type your DynDNS.org account.


    With Dynamic DNS up running, you need to configure your router so that it knows
    to send incoming FTP requests to your FreeNAS server. This is straightforward
    and involves configuring port forwarding (all virtual servers on your network.
