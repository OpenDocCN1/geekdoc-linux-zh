  md: '# Firewalls and internet security


    Linux may be more secure than Windows, but it''s not completely immune to attack.
    Here we show you how to protect your system


    Linux is widely considered to be more secure than Microsoft Windows. This is partly
    because of its open-source nature, which allows anyone to spot and report programming
    errors and vulnerabilities in the operating system and its applications instantly.


    It''s not immune from attack, though. Over the next few pages we''ll show you
    how to boost your computer''s security by configuring Linux''s built-in firewall
    and anti-virus software.


    Hackers are entirely motivated by money, and they''ll try any trick to get information
    that they can sell for cash. While Linux has been relatively immune to attacks,
    as its base was too small, its increasing popularity means that hackers have the
    OS in their sights.


    As such, you need to boost the security of your computer. For starters, every
    computer on the internet needs a protection from unwanted intrusions by hackers,
    for example. Linux also needs anti-virus protection. Security companies are now
    waking up to the threat posed to Linux operating systems lately, and have begun
    supplying basic Linux versions of most of their products.


    without introducing any significant drain on resources or network performance.


    A number of commercial firewalls include a vast range of features. However, at
    their most basic, firewalls simply need to decide whether to allow or ''drop''
    packets based on a set of rules. Configuring a firewall is a matter of writing
    these rules to tell it which types of network traffic to let through, and which
    to block.


    +   - Firewall''s main interface

    - The Lock Firewall button is for use in emergencies only


    ![](img/8ce336de6d0b78d8a67df502f94ad436_107_0.png)


    # THE FIREWALL


    The purpose of a firewall is to inspect every data packet entering or leave the
    computer, and decide whether or not to allow it on its way or to block it. Firewalls
    are closely connected to the operating system itself and have be capable of running
    at top speed'
