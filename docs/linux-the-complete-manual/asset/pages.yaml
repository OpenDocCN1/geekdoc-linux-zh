  md: '# CHAPTER 3


    # Configuring Ubuntu


    Everyone likes to customise your PC to their liking. Here we''ll show how to tweak
    Ubuntu''s themes and enable its special effects


    n the same way that you can set Windows'' wallpaper to an image of your choice,
    you can do the same in Ubuntu. You can also change the colour scheme, icons and
    windows are personalised to your taste.


    To see Ubuntu''s default themes, go to the System menu at the top of the screen,
    click Preferences. Then you''ll find 11 themes to choose from, and Human is already
    selected. Click on any theme and it will be immediately obvious you can see how
    it affects not only the window you have, but also the desktop, including the top
    and bottom bars. Clearlooks, for example, are much subtler than others. changes
    the icons and switches the default orange/brown colour to a light blue; however,
    click High Contrast Inverse and the changes are much more noticeable. If you like
    a particular theme, simply click the Close button and the theme will remain applied.


    The default themes are a little limited, so it''s worth installing some new ones.
    Leave the Appearance window open and head to the System menu again, then click
    Package Manager. Enter your password, and the Package Manager will commence and
    update the list of packages. In the Quick Search box type gnome. You should see
    the package list update and then gnome-themes-extra at the top of the list. Click
    on the grey square to the left of it, and then Mark for Installation in the menu
    that appears.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_47_0.png)


    Click on the Green button below the top of the window, and you will be asked if
    you want to mark required changes. This is simply saying that additional packages
    need to be installed or other packages need to be updated, so click on Mark button.
    You will now progress three files being downloaded. Once this is complete, click
    OK on the box.


    You will see the new themes in the Appearance window, so click to find one you
    like. We''ve chosen Nova. However, if you don''t like any of them, you can install
    more themes


