  md: '# # BASIC DESKTOP TASKS


    # # MANUALLY MANAGING MEDIA


    Banshee supports videos, but it may not meet your needs if you have an MP3 player
    that can also play video. In this case, the best method may be to copy files to
    it manually, as if it were an external hard disk.


    If you browse your player''s contents in File Browser, you''ll probably find it
    folders for Photos, Music, Videos, and Voice Recordings.


    While a File Browser will transfer any files you like into any folder, your player
    will only support certain formats. If you need a program to convert them from
    one format to another by searching for Synaptic Manager sound converter, you''ll
    find it in the Applications menu under Sound & Video.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_78_0.png)


    modes, rather than having a setting. If it is possible to install MPTP devices
    to be detected by Banshee using a File Browser to copy music and other files to
    MPTP-only players manually. It''s also best, if possible, to avoid DRM-protected
    music, as you''re likely to run into problems getting Banshee to play or transfer
    it to player


    # # MANAGING MUSIC IN BANSHEE


    Banshee makes it easy to get music on your player. Once your MP3 player is listed
    under the Devices, all you need to do is drop tracks onto it. You can select a
    range of tracks, artists, or albums, or just drag the artists or albums to all
    listed entries on your player if it has enough room for your entire library.


    When you drop tracks on your player, you''ll see a progress bar in the bottom
    right corner of the window. This shows how many tracks have been transferred in
    the current time.


    For some things like podcasts, just drag and drop them on your player, and they''ll
    be transferred. Unfortunately, Banshee has no synchronisation capabilities, so
    you cannot fill your player automatically with a manual selection of music in
    the same way as Windows Media Player. If you want an application that can sync
    music, you''ll need to install Amarok via the Synaptic Package Manager.


    > Amarok is an alternative music player that can synchronise tracks with MP3 players


    +   - MP3 players must work with Banshee


    Any videos you download need to be converted. WiB FF can also support most formats.
    And with audio files, you''ll need to specify the specific format your player
    can handle, including both the audio and video resolution, plus the maximum bit
    rate for audio and video. Search for the best settings and help, and once you''ve
    done that, you can carry on with batches of others. As we''ve already said, check
    the manufacturer''s website for details, or contact support.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_78_1.png)


