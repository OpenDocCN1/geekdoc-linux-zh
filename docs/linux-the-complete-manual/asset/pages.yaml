  md: '# CHAPTER 4


    # Improving your photos using Gimp


    For the first-time user, Gimp''s interface can be a little overwhelming. These
    brief tutorials will guide you through using the main tools


    Gimp may not be the easiest photo editor to use, but it is one of the most powerful.
    It gives you much control over your photos than programs as Picasa.


    the shade is darker than the outside of the eye. You can adjust the hue to match
    the actual colour of the subject''s eye, but once zoomed back out, it''s unlikely
    anyone will notice.


    # DEALING WITH RED EYE


    There are bound to photos in your collection in which the subjects are suffering
    from red eye. Otherwise great photos can be ruined by laser-red eyes staring at
    out. It''s caused by the light of the camera''s flash reflecting off the subject''s
    retina, and you will always see the effect in photos taken indoors at night. Fortunately,
    red eye is easy to remove using Gimp, and should take only minutes.


    +   Press Ctrl-Shift-A to detect the eye and you''ll see that it''s looking reasonably
    good. Repeat steps 2 and 3 for the other eyes in the image. Finally, change the
    zoom level to 100% using the drop-down box at the bottom of the window, and you
    can admire your skillful work. Don''t forget to save the image before moving to
    the next one.


    +   Start Gimp and open the photo you want to edit. Our shot was taken in a restaurant
    at night, and we used a compact camera with its flash turned on. Both subjects''
    eyes have devilish look, which we will need to address.


    +   Zoom into the eye you want to tackle, to around 400 per cent magnification.
    Use the lasso tool (from the left on top) to draw a circle around the area. If
    necessary hit Enter to complete the selection. Then hold the Ctrl key and select
    the white highlight in the middle of the eye, and we don''t want to adjust this
    portion.


    +   In the Tools menu, click Colour Tools, then Hue-Saturation. Drag the Saturation
    slider to the left, and the Lightness slider, until


