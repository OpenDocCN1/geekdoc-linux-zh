  md: '# Using Google Desktop


    Just as Google makes searching the web easy, it can do the same for your PC. We
    show you how to making files and emails simple


    The fact that Ubuntu does everything slightly differently to Windows can make
    it a bit confusing at first. In particular, locating your files can be tricky,
    as they''re stored in different places.


    While the built-in search tools help improve this, you may prefer to use the Google
    Desktop to search your PC (including those stored in Ubuntu''s email client, Evolution)
    as quickly as you can search the internet.


    On the next page you will be presented with a choice of applications. Choose the
    .deb version, which is for Ubuntu. Make sure you get the right version for your
    operating system (32-bit or 64-bit). Click any OK. The necessary files and click
    Accept and Install on the next.


    Once you download the file to your hard disk, double-click the file in Firefox''s
    Downloads window. This will launch the Package Installer.


    Google Desktop is available for Windows and Linux in the same way on both. If
    you''ve already used the Windows version, you''ll be right at home with the Linux
    version and it will help you get to the new OS However, the installation steps
    differ for the Linux version, so here''s how to get


    # DOWNLOAD AND INSTALLATION


    Google Desktop isn''t available from Software Centre, so you have to download
    it manually. Go to http://google-desktop.com/linux/index.html and click on the
    Download Desktop button.


    # RUNNING GOOGLE DESKTOP


    Google Desktop is accessed through the Applications menu. The first time you run
    it will be prompted to set your home directory to Google. You should leave this
    option selected to make it easier to search your PC. You can also choose to send
    Google crashes, which can be used to improve the software in the future. When
    you''ve finished, click I agree.


    Before it begins, Google Desktop has to index your directory. Depending on the
    number of files you have, this can take up to a few hours to complete. Until the
    process has finished, Google Desktop won''t be able to present you with accurate
    search results.


    # SETTING PREFERENCES


    While you''re waiting for your computer to index your files, it makes sense to
    configure Google Desktop to work the way you want it to. In


