  md: '# INTERNET ON LINUX


    computer waits for a response. This is an incredibly useful tool (see the ''Ping
    commander'' box for more details).


    To use this tab, simply enter the DNS name or IP address of a destination computer
    and press Enter. The screen will fill with a bar chart showing how long, in milliseconds,
    each of the ping requests takes. If you are having trouble reaching a website,
    this tab will tell you if the machine has crashed or if the connection is very
    slow. It''s a good way to verify that your network connection is working correctly.


    The Net tab provides low-level routing information, but the Traceroute is far
    more interesting. If you enter the IP address or name of a destination computer
    and press Enter, this tab will fill up with the route taken to get there. Each
    entry is called a ''hop'' along the route. It helps to find your websites, but
    if your network contains several subnets connected by routers and a connectivity
    problem, it will indicate where the problem lies failing at that point.


    The Port Scan tab is useful for your own network. It tells you which of your computer''s
    ports are open and listening for traffic. If you enter a DNS name or IP address
    and press Enter. If you try this on the internet, you may trip an intrusion detection
    system and the website may block your ISP. This port scan is a technique that
    hackers use to find vulnerable computers. If you''ve found a scanner over the
    internet, you might get banned by your ISP.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_92_0.png)


    # Ping commander Testing a network connection


    Network administrators have a procedure for testing network connections that can
    quickly pinpoint a bottleneck''s location. Tools make it easy to perform simple
    tests.


    On the Ping tab, enter ''localhost'' as the hostname. Localhost is a special machine
    name that refers to the computer you''re using. When you send traffic to localhost,
    the network card detects that the address is local and responds itself, thereby
    proving that it''s working properly.


    Now ping the local machine''s IP address. This traffic enters the network and
    comes straight back, proving that the local subnet to the left or switch is working.


    If you have two subnets, ping a computer on the other subnet to make sure the
    router between them is working properly. Finally, ping a website that''s outside
    your local network, such as www.google.uk. If you can''t reach it, check that
    your broadband router is working.


    > The Lookup tab finds details of public machines easily. Enter a DNS name or
    IP address and select the type of information you require. What is Whois? Enter
    a domain name (without the ''www'' prefix) and the tab will call a public Whois
    server to retrieve the details of the owner''s.


