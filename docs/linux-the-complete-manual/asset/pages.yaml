  md: '# CHAPTER 3


    # # Creating user accounts


    Creating separate user accounts for all the people who use your computer has many
    benefits. Here''s how to do it


    If you share your PC with family members, it makes sense to create a user account
    for each person. Creating separate accounts also allow each user have their own
    set of folders to store documents and media.


    Separate accounts allow each person to customise the theme and background to their
    liking. They can also put multiple accounts and files on the desktop, which might
    otherwise become cluttered with everyone''s.


    In Windows you can create multiple accounts when you first install, but in Ubuntu
    you will do it via the Administration menu.


    You can also set the type of account using the Profile menu. Ubuntu gives you
    three choices: Administrator, User and Desktop user. You should only choose between
    latter, as Administrator gives you more access to the operating system than is
    necessary for a normal user, and as a security risk, the user could create delete
    system files.


    In most cases, it is the best choice as this allows users to access external storage
    devices, connect to the Internet, use CD or DVD drives and the local system. Unprivileged
    users cannot do any of these things.


    +   1. Go to System Administration, Users and Groups (the final entry in the list).
    You will see the Settings window, but you''ll notice that the Add User button
    is greyed out. You will not be able to make any changes until you click on the
    key at the bottom of the window and enter your user password and Authenticate.


    +   2. The buttons for adding and deleting users are now active. Click Add User
    and the New user account will open. Here you can enter a username, real name and
    password.


    +   3. You can change the privileges by clicking on the Privileges tab. This lists
    what the user can or cannot, but only the items you might want to change from
    the default Desktop user profile is to allow a user to configure printers and
    share files with the local network. You fill in the user''s address and phone
    numbers on the Information tab, but this wasn''t usually necessary. Settings in
    the Advanced tab will be greyed out and should be ignored. Click OK to close the
    window and add the new account. You may have to enter your user password and click
    Authenticate to complete the process. The new user will appear in the list, and
    you can repeat the process for additional users.


