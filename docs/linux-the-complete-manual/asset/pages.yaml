    # INSTALLING AND RUNNING APPLICATIONS


    Click Applications on the launch bar to access the programs that were installed
    when you first set up Ubuntu. These will be listed in a number of different categories.
    Move mouse over a category to open, and left-click on an application to run it.


    To add a new application, click Software Center. A three-pane window appears.
    In the left-hand pane, you''ll see the categories available. Select one, and a
    list of applications in the main pane. Click one, and its description appears
    in the other pane. You can select one or more programs to install by clicking
    the checkboxes. Then Apply Changes. After you''ve been given a final chance to
    change your mind, you''ll be asked to enter your password. Ubuntu will download
    the latest relevant packages and install them. Your new programs will now be available
    from the Applications menu.


