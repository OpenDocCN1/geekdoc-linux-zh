  md: 'Linux traditionally comes with a firewall iptables that requires system administrators
    to set it up using extensive configuration files. For the rest of us, there''s
    a friendlier called Firewall. Like most commonly used on Microsoft Windows, this
    is an entirely graphical application that makes configuration very simple.


    # # INSTALLING FIRESTARTER


    Firestarter is free. To install, it first start the Ubuntu Software Centre. Type
    ''firestarter'' in the search box and press Return. The Firestarter application
    should appear in the list below the search box. Click the install button to begin
    the installation process.

    You may be asked for your password in a subsequent pop-up window. If this happens,
    enter OK and Ubuntu will download and install the latest version of Firestarter.
    Once the process is complete, click Close. Firestarter will now be installed and
    ready to protect your computer.


    # # CONFIGURING THE FIREWALL


    To open Firestarter''s user interface, first all it in the Ubuntu software centre.
    The first time you run it, enter your password to confirm you want to make changes
    to the system, you''ll see a configuration wizard. Click Forward to continue.

    The part allows you to assign the firewall to a network connection. This should
    default to Eth0 if you have a single wired connection, which most people do, so
    leave it as is unless you are using a wireless network card, or be available from
