  md: '# Getting started with Gimp


    It may have a funny name, Gimp is a powerful photo-editing application, and it
    comes free with Ubuntu


    f you can look past the unusual name, Gimp is an excellent image-editing package.
    Its interface isn''t quite easy to use as Adobe''s Photoshop Elements, but it
    has improved hugely


    over the past few years. In fact, the three-separate-window approach makes it
    much more like the full-blown Photoshop, and there are lots of features that will
    keep even enthusiastic photographers happy.


    This is the main window and shows the photo you''re editing.


    Click this button to show the undo history.


    This is where you''ll find the bulk of the tools, including selection, scaling
    and perspective, cloning, blur, sharpen and smudge. There''s even a Healing Tool,
    which can automatically fix blemishes.


