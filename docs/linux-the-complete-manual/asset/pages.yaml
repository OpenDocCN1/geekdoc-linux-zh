  md: '# CHAPTER 1


    # How to get Linux


    Now that you''re ready to give Linux a go, we''ll outline the different versions
    on offer


    Hopefully you''re now well convinced that Linux is worth trying. The trouble is,
    how do you choose between the multitude of different distributions? Each ''distro''
    as they''re called, has a particular kind of user in mind, and if you''re just
    starting out with Linux it''s best to choose one that''s specifically tailored
    to your needs.


    There''s another consideration, though: type of computer which you want to run
    it. There is distro for desktop PCs, laptops and notebooks. The latter deserves
    special attention. While most distros will happily work on a desktop, some may
    be too much for a notebook. Then it might be a question of resources, screen resolution
    or hard disk space, but whatever the reason, a cut-down Linux distro could be
    the answer.


    +   * Linux Mint is the best-looking distro. It has a Windows-style Start menu,
    complete with a search bar


    ![](img/8ce336de6d0b78d8a67df502f94ad436_9_0.png)


    applications, plus user reviews, which makes it easy to decide whether a package
    is what you''re after. Adobe Flash and Java are installed by default, so most
    websites containing music and video, such as YouTube, work straight away. Download
    it from linuxmint.com.


    If you''re after for the whole family, try Qubuntu (www.kubuntu.com). It''s based
    on Ubuntu and has a friendly interface and built-in parental controls for controlling
    internet access. It comes even with educational games.


    # DIFFERENT DISTROS


    A version of Ubuntu for specifically designed for notebooks used to be available,
    the standard distro now been updated to work on all computers. The new design
    makes it perfect for low resolution screens, making it perfect for notebooks,
    and you no longer need a special version of the operating system. You may find
    a version of Linux for your notebook, for example, was designed for Asus EeePC
    not you can use it on all laptops; download it from www.geteaseasy.com.


    If you plan to run Linux on a PC or laptop, there''s a wide selection of user-friendly
    distros. The obvious difference between them is the number and type of programs
    they include. Linux Mint, for example, is based on Ubuntu but has a start menu
    like the one on Windows. The installer shows screenshots and ratings of


    Fedora (http://fedoraproject.org) and Debian (www.debian.org) are mainstream distros
    that aren''t quite Ubuntu. Fedora prides itself on having the latest versions
    of applications, Debian is stable and has an enormous choice of software available
    through its package manager.


    However, we think the best distro for most people is Ubuntu, its look and feel
    very close to Windows, and unfamiliar aspects such as the Package Manager and
    virtual desktops are hidden away. It''s because of this that Ubuntu has become
    the most popular Linux distribution.


