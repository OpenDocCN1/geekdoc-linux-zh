    ![](img/8ce336de6d0b78d8a67df502f94ad436_64_2.png)


    Now we need a little saturation, so we open the Hue-Saturation tool from a little
    to the right – Drag the Saturation slider as depending on your camera''s processing
    you may need more or less than the +15 we''ve applied here.


    If you want to increase the saturation of individual colours – say, green for
    grass or blue for skies - click the white circle next to the colour you want and
    adjust the slider for that you want to modify. If you make a mistake, just hit
    the Reset button.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_64_3.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_64_4.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_64_5.png)


    If the Levels adjustment hasn''t given you quite enough contrast, you can add
    it easily with the Brightness-Contrast tool, which you''ll find it in the Colours
    menu. Simply adjust the Contrast slider until you see the desired result.


    # ENHANCING YOUR SHOTS


    This shot, which we took in the Lake District, almost didn''t make it into our
    ''Best images'' folder after sorting the good ones from the not so. However, despite
    its appearance, we could see it had the potential to be great. Gimp came to rescue
    and allowed us to enhance it. Here we''ll show you how to use Gimp''s retouching
    tools.


    +   Open the image in Gimp and head straight for the Levels tool, which you''ll
    find in the Colours menu. This opens a window that may look daunting, but it''s
    worth to know it''s one of the most effective tools in Gimp''s, especially for
    injecting contrast into lifeless shots like this one. The histogram shows a representation
    of the intensity of pixels in the image. At the left are very dark pixels, which
    become progressively lighter as you move to the right. Drag the left-hand arrow
    inward until it''s in line with the start of the rising curve. This deepens the
    shadows. On the right, grab the white arrow and drag it to the point the graph
    trails off. This brightens highlights.


    Sharpen your photos is always a good idea, as digital cameras tend to err on the
    side of contrast and leave a little soft. Gimp''s Enhance Mask tool is perfect
    for doing this. You ll find it in the Enhancement section of the Filters menu.
    Move the preview to an area of the image that shows fine detail and toggle the
    Preview tick on or off to see the difference settings make. Don''t overshar an
    image, or you''ll cause unwanted artifacts.


    Now the image is looking good, and we''re finished with the retouching. It''s
    a good idea to save a copy rather than saving over top of the original photo.
    This means you can start from scratch if you don''t like the changes you''ve made.


