  md: '# # Connecting an MP3 player


    Transferring music, videos and podcasts to your MP3 player is simple in Ubuntu.
    Here we''ll show you how


    We''ve already looked at Banshee on page 72, and seen that it''s extremely easy
    to use. It''s also great for MP3 players that use the MSC standard and show them
    in the left-hand pane under the Devices heading. MSC Stands for Mass Storage Class
    and is essentially the standard used by most USB devices (and Linux) is able to
    recognise when these devices are plugged in, just as Windows


    does. A window should pop up asking which you''d like to open, and an icon should
    appear on the desktop. You can then access the device just like any hard disk.


    # ## MSC or MTP?


    Some MP3 players support both MSC and MTP standards. MTP - the Media Transfer
    Protocol is closely linked with Windows Media Player and allows DRM-protected
    audio files (usually those have been purchased from an online music store) to
    be transferred to authorised players.


    If Ubuntu doesn''t automatically detect your MP3 players, check its settings menu
    to see whether you can switch its mode from MTP to MSC. Some players, such as
    certain models in SanDisk''s Sansa range, require a combination of buttons to
    be pressed to switch


    +   - Most MP3 players recognized by Ubuntu without any problems


    ![](img/8ce336de6d0b78d8a67df502f94ad436_77_0.png)


    If you prefer to transfer files, just use a File Browser window to copy music
    and video if your player supports it - straight to its internal memory


    ![](img/8ce336de6d0b78d8a67df502f94ad436_77_1.png)'
