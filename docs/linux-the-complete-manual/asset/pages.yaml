  md: '# ADDING USER


    To add a new user, go to FreeNAS''s web-based management page and log on. Click
    the Access tab and select Users and Groups. Click the Blue button and you will
    be prompted to add a user by typing in a username and password. It''s best to
    type in the same names and passwords that you use on your PC, as this will automatically
    be able to access networks from Windows PCs (Linux users will have to authenticate).


    You can also assign users to groups. At the moment, all users will have access
    to every server. However this is updated in a later release of FreeNAS, which
    will make security easier as you''ll be able to allow or deny any group of users
    access to a service. Though, we''ve put all our users in the ''admin'' group.
    When you''ve created one user, click Add. Then apply changes. Click the Blue button
    to add another user.


    # TURNING ON SECURITY


    When use NAS, it is time to use, CIFS from the Services menu. To turn on security,
    select Local User from the Authentication menu and then Save and Restart. When
    you see the message, "The changes have been applied successfully", all your networks
    are secure and only authorised users can access them.


    When you access the share it will be prompted to type in a username and password.
    If you created a username and password that matches your current Windows user,
    you''ll be able to access the shares; if not, you''ll be prompted to type in a
    valid username and password.


    # SMARTER SHIRES


    On the previous four pages we showed how to share an entry mount point (hard disk
    or RAID array), but this isn''t the best use of disk. It''s much more sense to
    share a particular folder. For example, you can give each user their own share
    to use. A similar argument goes for other services.


    To share a folder, you first need to create one. FreeNAS has a built-in file browser
    that lets you do this. Click on Advanced and select File Manager, log on with
    the username and password that you use to log on


    > The built-in file browser allows you to manage your files and folders from the
    interface.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_138_0.png)


    to FreeNAS''s web-management page. You''ll use an Explorer-style file browser
    that you can view every file and folder. To create a new folder for share you
    need to know where to put it. Unlike Windows, which have different letters for
    each disk, FreeNAS is based on Linux. On pages 120-135, you''ll read that for
    each hard or RAID array you have to create a mount point, and it''s the mount
    point you need to access. These are stored in the ''mnt'' folder. Here you will
    see a list of folders with the names of the mount points you created. Click on
    one to access it: Select Directory from the drop-down menu, type in a name and
    Click to make a folder. The new folder will have the permissions and only allow
