    replacing the old Task Bar and Applications on the left-hand side of the screen,
    although it sits out of view if you''ve got an application maximised: move the
    mouse to bring it back.


    Right-clicking on an icon may give you new options for an application, such as
    Open New Window in Firefox. The application is not always visible in Launcher,
    you can click Keep in pin to it. This gives you a quick shortcut.


