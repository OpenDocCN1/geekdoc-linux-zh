  md: '# # Getting started


    Allow us to guide you through your first steps with this powerful, free operating
    system


    Now that you''ve installed Ubuntu Linux, the next step is to explore the interface
    and find out how to perform tasks that were second in Windows. Here, we''ll give
    you a tour of the default Gnome desktop if you installed Ubuntu using the default
    options. We''ll explain how to perform common tasks as easily as you did in Windows,
    if not more.


    Using a new operating system can be a scary business. But don''t worry, even running
    a simple program can be tricky. Tasks such as customizing the look and feel of
    the interface, searching for files or writing data to a DVD might seem distant
    goals. Over the next few pages, we''ll show you how to get started with Ubuntu


