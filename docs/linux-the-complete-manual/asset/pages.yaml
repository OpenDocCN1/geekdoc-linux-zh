  md: '# Controlling the web


    Linux doesn''t come with all the technologies we need to view pages, but you can
    add them easily. Here is how we show you


    indows-based browsers have got to the point where they''ll prompt you to add missing
    web components. The same isn''t true with Linux, and you may run into problems
    getting websites such as YouTube to work. Over the next few pages, we''ll show
    you how to get everything working.


    The internet is filled with an impressive array of videos, applications and multimedia
    for your enjoyment—at least, if you have the right browser and addons. Ubuntu
    comes with just about everything you need to get, including the excellent Firefox
    browser. However, nothing will work straight away, and you may find that a few
    websites, such as YouTube won''t display video. Fortunately, things are easy to
    fix.


    Our instructions focus on Firefox, as it''s currently the default browser for
    Ubuntu.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_93_0.png)


    +   - You can install Adobe Flash manually. Once done, you''ll be able to view
    videos on YouTube and use other Flash-enabled websites.


    +   - The installer lets you choose which language Firefox will use


    Internet Explorer is a Windows-only browser, and you can''t install it on Linux
    unless you use the WINE emulator (see the "Don''t bank on it" box on page 95 for
    details). Google''s Chrome is available for Ubuntu, and we show you how to use
    this on page 102. You can get other browsers, but they''re not as popular and
    don''t have the same level of support as Firefox.


    # UPDATATING YOUR BROWSER


    The first thing you do is to make sure you have the latest version of Firefox.
    Unfortunately, you won''t be able to check this using Ubuntu''s Software Centre
    or the Addons menu. You must update the software manually. This is what we do
    with the free Ubuntu application, which you can download from http://sourceforge.org/projects/ubuntu/files.


