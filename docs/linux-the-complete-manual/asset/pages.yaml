    # # Making your own NAS


    If you have an old PC sitting around doing, you could turn it into network storage
    utilizing the powerful FreeNAS system


    An old PC can easily go to waste, with FreeNAS you can make good use of it and
    turn it into a powerful network-attached storage (NAS) device. Best thing of all
    is that FreeNAS, as its name suggests, is completely free. Unlike commercially
    available NAS devices, FreeNAS has a wealth of features and, as you are using
    a PC, the ability to support a lot of hard disks. We''ll show you how to install
    and share files, with pages 136 to 139 covering advanced configuration options.

    To install FreeNAS on an old PC, you need a computer with at least one hard disk
    and an optical drive. The best installation of FreeNAS uses a USB drive. You''ll
    need a drive with at least 64MB of disk space; you can buy USB models for under
    £3 if you don''t have one. To start, download the ISO of the operating system
    from freenas.org. You need to download the LiveCD version. There are two versions
    for download:


    for Intel processors and one for AMD 64-bit processors. Make sure you select the
    right version, and download the ISO to your PC. This is an image of a CD that
    needs to be written to a blank disc (see page 46 for details on burning a disc).
    For Windows users, use free CDBurn (http://cdubner.np).


    # GIVE IT BOOT


    Once the files are on a CD, you can boot from the disc on the computer that you''ll
    use for FreeNAS. Before you do, there are some configuration options you need
    to adjust. First, for the maximum flexibility you should install FreeNAS on a
    USB flash disk, linking your hard disks completely for free storage. For this
    work, you''ll need to set your BIOS to boot from USB device.


    To do this, insert your USB drive and enter the BIOS setup * (normally you have
    to press Delete, F10, or F12, but look out for a message telling you key to press).
    Typically the USB boot orders are listed here. You may have an option to select
    a USB flash drive from the Boot menu or the option to make Boot Other Devices.
    In our case the USB drive was detected as a hard disk and we had to select it
    as first.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_133_0.png)


    If you can''t boot from USB flash drives, you can install FreeNAS to one of your
    hard disks, but this makes configuration harder and prevents you from using this
    hard disk in RAID array.


    Alternatively, you can connect the drive to a USB port and boot the PC from the
    FreeNAS Live CD. Your settings will be saved automatically to the flash drive,
    there''s no


