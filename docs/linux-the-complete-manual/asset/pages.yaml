  md: '# CHAPTER 5


    # Storing files online


    Online storage is an efficient and secure way to back up your files. It''s also
    incredibly easy using the Dropbox service


    Being able to store files securely has become very popular. As well as providing
    a safe location for backups that can''t be damaged by home or physically stolen,
    online storage is also incredibly convenient, allowing you to access your files
    from anywhere. Dropbox is a free online service for Linux. The software lets you
    synchronise files with multiple computers over the internet. When you save a file
    on one computer it automatically gets updated on all the others. Dropbox has 2GB
    of free storage (up to 100GB of free if paid for), which you can use for standard
    online storage. It also has a dedicated Linux client for it. Here, we''ll show
    you how to use it.


    +   - You have to install Dropbox manually, but it''s a simple procedure


    | Dir: ~/dropbox |

    | Package: nautilus-dropbox | Install Package |

    | Status: All dependencies are satisfied | |

    | Description: Details included | |

    | Dropbox Integration for Nautilus | |

    | Dropbox integrates the Dropbox web service with your computer. | |

    | Check us out at http://www.dropbox.com/ | |


    # INSTALLATION


    To install Dropbox, download the package from getdropbox.com. Click on the Download
    button, making sure that you have the right version of Ubuntu and the (32-bit
    or 64-bit). When the file has downloaded, double-click in Firefox''s Downloads.


    +   - Dropbox lets you synchronise files between multiple PCs


    This will launch the Package Installer. Install Package and Dropbox will be installed
    on your computer. Once it''s finished, click the Close button and shut down the
    Package Manager. Start Dropbox from the Ubuntu search, and you''ll see a dialog
    box that you need to install a proxy daemon. Click OK and this will be downloaded
    automatically from the internet to your computer. It should take only a few minutes.


    # GETTING UP AND RUNNING


    Restart your computer when the installation has complete. Next your computer starts
    you notice a new icon in the top-right of the screen for Dropbox. If you click
    it, a window will appear asking if you don''t have a Dropbox account and click
    Next. Fill out all the required details. You''ll be asked which type of Dropbox
    account you want (2GB,


    ![](img/8ce336de6d0b78d8a67df502f94ad436_111_0.png)


    ![](img/8ce336de6d0b78d8a67df502f94ad436_111_1.png)


    +   - Dropbox has to install some proprietary software to work properly


    In order to use Dropbox, you must download the proprietary daemon.


