  md: '# CHAPTER 5


    computer except for the user tells to block. The second mode called is Restrictive,
    which blocks all traffic except for the dataflow present on the ports you explicitly
    allow.


    For the security, Firestarter should run in this second mode so that it blocks
    all traffic except what you allow. It blocks only outgoing traffic, not incoming
    traffic, but this is enough to stop hackers compromising your security as it prevents
    your computer from replying to any malicious packages.


    To put Firestarter into Restrictive mode, first click the Policies tab under the
    Firewall button. Now click the Pull-down menu and select Output traffic. This
    policy allows two buttons to be displayed unless you navigate under. Select the
    one marked by default, whitelist. Press Policy at the top of the window and open
    a web browser.


    After a few seconds of trying to connect, a browser will return an error message
    because Firestarter is blocking all outgoing traffic. You will need to allow HTTP
    and HTTPS traffic through so you can browse the web.


