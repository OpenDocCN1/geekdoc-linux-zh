  md: '# # Synchronising a mobile with Linux


    Backing up your phone to a PC is a great way to save your settings and make sure
    you have the same contacts wherever you are


    Even with Windows PCs, all the phone manufacturers provide software that lets
    you synchronise your phone with your computer. With Linux this isn''t the case.
    Fortunately, that doesn''t mean you''re stuck; there''s third-party software that
    works with most phones so that you can back up your messages. There''s no simple
    way to synchronise your phone directly with Ubuntu''s email client, Evolution,
    so first think about what you want to do. If your phone can synchronise its settings
    with an email service over its data connection, such as Google Mail, this might
    be the best option, or you can simply synchronise Evolution with the same source.


    Even if you decide to use a different method, connecting your phone to Ubuntu
    will be useful for other reasons, such as downloading pictures. First, you have
    to work out how you want to synchronise: Bluetooth or USB. USB is easier as you
    just have to plug in a compatible phone. Bluetooth is more convenient, you''ll
    never have to physically connect your phone to your PC.


    If you''re using USB, you''ll probably see several connection options when you
    plug in your phone. A Mass Storage, or similar, option will appear as a normal
    storage device; a native mode, like Nokia, which will want handset appear as a
    phone, and you''ll need other software to connect to it.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_79_0.png)


    > You can easily synchronise mobile phones with Ubuntu


    Where Bluetooth is installed on your computer, you''ll see a new icon to show
    it''s working


    # CONNECTING WITH BLUETOOTH


    To use a Bluetooth, you need a Bluetooth adaptor on your PC. If you''re using
    a laptop this may be built in, but for a PC you''ll need to buy a Bluetooth dongle
    - just a few pounds and should be recognised by Ubuntu when you plug it in.


    Once you''ve connected your adapter you''ll see a list of options, click Setup
    new device, which searches for a new Bluetooth device. However, this doesn''t
    always work, so it might be easier to manage the connection from your phone. First,
    click the Bluetooth icon and select Preferences. Click the Make computer discoverable
    box and type in a name for your computer, which will appear on the phone you''re
    searching from.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_79_1.png)'
