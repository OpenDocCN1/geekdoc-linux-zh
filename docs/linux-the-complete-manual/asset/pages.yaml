  md: '# INTRODUCTION TO LINUX


    # ALL ABOUT UBUNTU


    Ubuntu has excellent compatibility, which means it will run on just about any
    hardware. It also optimises itself for your computer, including setting the correct
    screen resolution for your monitor and finding your wireless network. In fact,
    Ubuntu can sometimes be easier to use than Windows. Connect an external monitor
    to a laptop, for example, press the function key combination and Ubuntu will automatically
    set the right resolution and configure an external desktop to the side of your
    laptop''s screen.


    Ubuntu updates every six months. Some versions have the letters ''LTS'' for ''long-term
    support''. This lasts for three years, while standard releases support for 18
    months. Updating to a new version is simple and done from the Update Manager.
    In between are constant updates, so your PC always has the latest versions of
    applications installed.


    Boot times are fast, and you''ll realise how slow Windows is when you see your
    desktop appear in 30 seconds. As LibreOffice, Firefox is preinstalled, so you
    can get online away.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_10_0.png)


    > If you''re looking for a version of Linux that can be used by the family, give
    Ubuntu a try


    We realise, though, not every computer has a CD or DVD drive. In this case, a
    2GB USB flash drive, plus a computer running Windows will work for all modern
    computers made in the past two or three years. If you don''t have a flash drive,
    you can buy one of pocket sized streets such as PC World or Wh. You''ll find a
    step-by-step guide to installing Ubuntu from a flash drive at ubuntu.com/getubuntu.


    While the 700MB file is downloading, navigate to your USB drive, go to http://ubuntu.sourcecode.net
    and click Download for Windows. This will be downloading the latest version of
    Ubuntu, and there''s no need to select the distribution from the menu. Select
    desktop.


    # INSTALLATION OPTIONS


    For most people, installing Ubuntu will be a breeze. Simply pop the CD that comes
    with this book into your computer''s drive and press the power button. It''s just
    a piece of cake following the onscreen instructions. You''ll find out complete
    guide to installation in Chapter 2.


    > Ubuntu will run smoothly even on low-powered computers as notebooks


    Once Ubuntu is downloaded, click the ''...'' button to select the right image
    and navigate to the Ubuntu ISO file. Choose your USB flash drive letter (check
    in Windows If you''re using) and click OK. This will copy Ubuntu to your flash
    drive and configure it so your computer can boot from it.


    Plug the flash drive into the computer you wish to install Ubuntu on, and restart
    it. If it doesn''t boot from the USB drive in your computer''s BIOS, change the
    boot options and press Delete. F1 or F2 (or look for a message telling you which
    key to press enter Setup). Look for the boot options and change the settings so
    that the first boot device is an External drive or a USB drive. Save your changes
    and reboot.


    ![](img/8ce336de6d0b78d8a67df502f94ad436_10_1.png)


    THE COMPLETE LINUX MANUAL'
