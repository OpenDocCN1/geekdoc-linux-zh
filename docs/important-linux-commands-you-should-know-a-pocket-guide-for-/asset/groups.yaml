    # A Complete Introduction to the Linux Command Line


    ![](img/df24534eff215443b1bf728f904e6756_6_0.png)


    ## Introduction


    Want to use a Linux-based, open-source Unix-like operating system to increase
    the productivity and efficiency of your everyday computing? You can get ideas,
    strategies, and tips on how to do the task in this book. This book''s main objective
    is to make system administration on Linux machines simple by giving you all the
    information you need. This book takes a task-oriented approach to system administration;
    as a result, it is structured around the requirements of a system administrator
    rather than the characteristics of the Linux operating system.


    The command-line interface is one of the nearly all well built trademarks of Linux.
    There exists an ocean of Linux commands. Although, this to the end of time creates
    a problem: by all of so copious commands accessible to manage, you dont comprehend
    where and at which point to fly learning them, especially when you are learner.
    If you are facing this problem, and are peering a painless method to begin your
    command line journey in this book, you come to the right place, in this book,
    we will launch you to a hold of well liked and helpful Linux commands:


    - You can copy, manage, and remove files

    - Identify any network connectivity issues.

    - Modify the ownership and permissions of files and folders.

    - Manage, add, and create users and groups.

    - Use "su" and "sudo" to securely access the root account.

    - Create and modify text files using a graphical editor, and a lot more things.


    This book is heavily focused on Linux system administration. It will make an effort
    to explain how to use the command line interface more effectively. How does everything
    work? What is its scope? What method of use is ideal? However, by giving the reader
    a strong foundation in the use of the command line, a necessary tool for any significant
    system administration activity, it will set them up for further exploration of
    a command-line executable software or utility. There is no quick route to Linux
    wisdom. The line is difficult to learn and requires significant effort. It''s
    not so difficult; rather, it''s so big. On a typical Linux system, you can use
    literally a plethora of programs via the command line. Be forewarn: learning the
    command line is not something you should take lightly. On the other hand, as 90%
    of cloud infrastructure and hosting services use Linux, mastering the Linux command
    line is quite advantageous.


    ## Have Fun!


    Remember that a command line is an interface that receives lines of text and converts
    them into instructions for your computer while you go through this book. A **graphical
    user interface** (GUI) is simply a commandline application abstraction. For instance,
    a command is carried out every time you click the "X" to close a window. Make
    sure to install Linux on your computer before diving into the most popular commands.


    > "All the best people in life free seem to like LINUX."


    –Steve Wozniak


    ![](img/df24534eff215443b1bf728f904e6756_8_0.png)


    - Note:

    - **Linux version used:** CentOS Linux release 7.3.1611 (Core)


    ![](img/df24534eff215443b1bf728f904e6756_8_1.png)


    ## 17 Principles of the philosophy of UNIX


    ![](img/df24534eff215443b1bf728f904e6756_9_0.png)


    - Principle of **Modularity**: A system should be composed of several components
    that are joined, collaborate well, and have clearly defined functions

    - Principle of **Clarity**: Clearness is better than smartness

    - Principle of **Composition**: Create software that can communicate with other
    software

    - Principle of **Separation**: Programming mechanisms and rules should be kept
    distinct. Keep front-end interfaces and back-end engines separate

    - Principle of **Simplicity**: Build for simplicity and only add complexity where
    necessary

    - Principle of **Parsimony**: Only write a large program when it is clear by demonstration
    that nothing else will work

    - Principle of **Transparency**: Design with visibility in view to simplify analysis
    and troubleshooting

    - Principle of **Robustness**: Clearness and ease of use produce robustness

    - Principle of **Representation**: Create programs easier to understand for any
    programmer involved in the project so that it can be maintained


    When offered the choice, programmers should choose to complicate the data rather
    than the procedural logic of the software because complex data is simpler for
    us to understand than complex logic


    - Principle of Least Surprise: Developers should be encouraged to create user-friendly,
    intuitive products

    - Principle of Silence: Allow programmers and other programs to get the data they
    require from a program''s output without having to interpret unnecessary extensive
    and detailed

    - Principle of Repair: Programmers should create software that fails in a way
    that is simple to identify and diagnose

    - Principle of Economy: Project development costs should be minimized

    - Principle of Generation: Programmers should develop abstract, high-level programs
    that produce code rather than writing code by hand to decrease human error and
    save time

    - Principle of Optimization: Before you can optimize it, get it working. Software
    should be developed and tested before being masterfully crafted by developers

    - Principle of Diversity: Make programs flexible, enabling their use in ways other
    than those their creators intended

    - Principle of Extensibility: Increase the usefulness and lifespan of the developer''s
    written code


