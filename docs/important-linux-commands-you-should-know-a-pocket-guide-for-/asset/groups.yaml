    # Linux 命令行完全介绍


    ![](img/df24534eff215443b1bf728f904e6756_6_0.png)


    ## 引言


    想要使用基于 Linux 的开源类 Unix 操作系统来提高你日常计算的生产力和效率吗？你可以在书中获得关于如何执行这些任务的思路、策略和技巧。本书的主要目标是通过提供你所需的所有信息，让
    Linux 系统的系统管理变得简单。本书采用了以任务为导向的管理方法；因此，它的结构是围绕系统管理员的需求而非 Linux 操作系统的特征构建的。


    命令行界面是 Linux 几乎所有优秀标志之一。Linux 命令多如海。然而，这到最后产生了一个问题：面对如此多可用可管理的命令，你不知道该从哪里以及在何时开始学习它们，尤其是当你还是一个初学者时。如果你面临这个问题，并并在书中寻找一种无痛的方法来开启命令行之旅，那么你来对地方了。在书中，我们将带你进入一系列受欢迎且实用的
    Linux 命令世界：


    - 你可以复制、管理和删除文件

    - 识别任何网络连接问题。

    - 修改文件和文件夹的所有权和权限。

    - 管理、添加和创建用户及组。

    - 使用 "su" 和 "sudo" 安全地访问 root 账户。

    - 使用图形编辑器创建和修改文本文件，以及更多内容。


    本书侧重于 Linux 系统管理。它将尝试解释如何更有效地使用命令行界面。一切是如何运作的？它的范围是什么？哪种使用方法是最理想的？通过让读者建立命令行使用方面的坚实基础（这是任何重大系统管理活动的必要工具），它将为他们进一步探索命令行可执行软件或实用程序奠定基础。通往
    Linux 之智慧没有捷径。命令行很难，需要付出巨大的努力。它并不是那么困难，而是太庞大了。在典型的 Linux 系统上，你可以通过命令行使用字面意义大量的程序。预警：学习命令行不是你应该轻视的事情。另一方面，由于
    90% 的云基础设施和托管服务使用 Linux，精通 Linux 命令行是非常有利的。


    ## 玩开心！


    请记住，在你阅读这本书的过程中，命令行是一个接收文本行并将其转换为计算机指令的界面。**图形用户界面**（GUI）仅仅是命令行应用程序的一种抽象化。例如，每当你点击“X”关闭窗口时，就会执行一条命令。在深入学习最常用的命令之前，请确保你的电脑已安装了
    Linux。


    > “生活中所有最棒的人似乎都喜欢 LINUX。”


    – Steve Wozniak


    ![](img/df24534eff215443b1bf728f904e6756_8_0.png)


    - 注意：

    - **使用的 Linux 版本：** CentOS Linux release 7.3.1611 (Core)


    ![](img/df24534eff215443b1bf728f904e6756_8_1.png)


    ## UNIX 哲学的 17 原则


    ![](img/df24534eff215443b1bf728f904e6756_9_0.png)


    - **模块化**原则：系统应该由几个组件组成，这些组件连接良好、协作良好并具有定义定义的功能

    - **清晰性**原则：清晰比聪明更好。

    - **组合**原则：创建可以与其他软件通信的软件

    - **分离**原则：编程机制和规则应保持独立。将前端接口和后端引擎分离

    - **简单性**原则：为简单构建，仅在必要时增加复杂性

    - **节约**原则：只有在证明没有其他方法可以工作时，才编写大型程序

    - **透明性**原则：设计时考虑可见性，以简化分析和故障排除

    - **健壮性**原则：清晰度和易用性产生健壮性

    - **表示性**原则：让任何参与项目的程序员都能更容易地理解程序，以便进行维护


    在提供选择时，程序员应该选择复杂数据而不是软件的过程逻辑，因为复杂的数据比复杂的逻辑更易于我们理解。


    - 最小惊讶原则：鼓励开发者创建用户友好、直观的产品

    - **沉默**原则：允许程序员和其他程序从程序的输出中获取所需数据，而无需解释不必要的、详尽的

    - **修复**原则：程序员应该创建以简单识别和诊断的方式失败的软件

    - **经济性**原则：应尽可能减少项目开发成本

    - **生成**原则：程序员应该开发抽象的高级程序来产生代码，而不是手写代码，以减少人为错误并节省时间

    - **优化**原则：在优化之前，先让它运行起来。软件在被开发者精雕细琢之前应经过开发和测试

    - **多样性**原则：增加程序的灵活性，使其能够以创作者意之外的方式被使用

    - **可扩展性**原则：增加开发者编写代码的实用性和寿命


    ![](img/df24534eff215443b1bf728f904e6756_10_0.png)


