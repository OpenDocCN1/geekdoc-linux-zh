    # STEP 3 Customize the Platform Package


    The next step is to customize the packages and configuration options for our new
    hardware target. This consists of going each of the CDL commands in the CDL script
    files associated with our hardware platform to make modifications and additions
    that match the new hardware.


    There might be additional CDL scripts that we need to modify other than the ones
    we edited in step 1. The extent of the changes depends on the HAL used for a baseline
    and the differences between the baseline HAL and the new hardware platform. In
    general, we need to check the real-time clock/counter configurations and the device
    driver packages included, specifically for serial ports and flash memory devices.


    > NOTE It is best to eliminate as many of the packages as possible and establish
    a minimal set of functionality for the new target platform. Having too many packages
    increases the amount of code in the initial image, as well as the possibility
    of encountering problems. After the minimal set of functionality is operating
    properly on our new platform, packages can be added back to the new platform to
    extend the feature set.


    Packages can be removed from the new platform configuration using the Package
    dialog box, which is launched by selecting Build -> Packages from the menu. This
    dialog box is shown in Figure 11.15. Additional information about adding and removing
    packages is covered in Chapter 11.'
