- img_proc: true
  md: '# 9.3.2.2 Ethernet


    The other method for RedBoot communication is using an Ethernet port. In order
    to use an Ethernet port, the RedBoot image must include networking support, and
    obviously, the target hardware must have an Ethernet port.


    One issue that must be resolved is the method for RedBoot to obtain the Ethernet
    MAC address. RedBoot attempts to use the MAC address provided by the board manufacturer.
    However, the MAC address is not provided on all target hardware platforms. On
    some hardware platforms, the Ethernet driver allows RedBoot to program a MAC address
    into the configuration, using the fconfig command. A default MAC address can also
    be built into the RedBoot image.


    Another issue when using the Ethernet port for RedBoot communication is obtaining
    an IP address. RedBoot offers two methods for obtaining an IP address, static
    and dynamic. Selection of the method is controlled by the fconfig command, which
    is described in the User Interface and Command Section of this chapter.


    When using the static method, you must create a unique IP address for the RedBoot
    image. Several IP address ranges are good to use because they are private addresses.
    By using private addresses, you can create a private network for your debugging
    configuration, and packets that leave this private network are not forwarded.
    According to RFC 1918, the reserved private addresses are:


    +   - 10.0.0.0 to 10.255.255.255

    - 172.16.0.0 to 172.31.255.255

    - 192.168.0.0 to 192.168.255.255


    It is important to realize that RedBoot does not offer any routing support; therefore,
    the IP address selected for the target hardware RedBoot and the host must be on
    the same subnet. RedBoot uses ARP to resolve the host address and sends packets
    directly to the host unit.


    When using the dynamic method, the BOOTP protocol is enabled in the RedBoot image.
    Again, selecting the dynamic method is accomplished through the fconfig command.
    The dynamic method also requires a BOOTP server running on the host. There are
    several free or shareware servers available on the Web, including the BOOTP Turbo
    from Weil Solutions and a DHCP/BOOTP Server from Dr. Heinrichinkel.


    Once the IP address is assigned to the target hardware Ethernet port, you can
    use the ping utility to verify connection between the target and the host. Most
    operating systems should offer this utility. RedBoot also contains a ping command,
    which is described in the User Interface and Command Section of this chapter.


    After the IP address is assigned to the target hardware Ethernet port, you can
    connect to RedBoot from the host using a Telnet client application. Most operating
    systems provide a Telnet application utility and if not, a search on the Web will
    bring you up a few options. Next, the port number that is used for Telnet protocol
    communications must be set on the host'
  merge: -1
  pgno: 212
