    # 9.4.1 RedBoot Commands


    The basic form of RedBoot command is:


    ```

    RedBoot> COMMAND [-OPTION1] [--OPTION2 VALUE] OPERAND

    ```


    where COMMAND is one of the supported RedBoot commands. The two switches, OPTION1
    and OPTION2, modify the behavior of a standard command. The OPERAND specifies
    additional information needed for particular commands.


    Commands are not case sensitive and can be abbreviated to their shortest unique
    string. For example, to execute the dump command on a default (default means no
    other commands beginning with d have been added) d, du, dum, or dump can be entered.


    There are a few editing commands used in RedBoot:'
