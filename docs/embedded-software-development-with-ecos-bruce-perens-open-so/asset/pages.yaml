    to take corrective action. These conflicts can be bypassed; however, compile-time
    or link-time failure might occur. Conflicts must be resolved before continuing
    with the system configuration. The configuration tools try to resolve conflicts
    that arise during the configuration process. The tools might apply a solution
    automatically or ask for intervention in solving the conflict. Additional information
    about conflicts can be found in Chapter 11.


    # ### 1.3.1.4 Components and Packages


    A component encapsulates more detailed options within. Entire components can be
    enabled or disabled, depending on the needs of a particular application. For example,
    in Figure 1.2, the Kernel Exception Handling component can be disabled by checking
    the box next to the component. Disabling the component causes all configuration
    options under that component, as well as any files associated with the component,
    to be irrelevant and not included in the build. This hierarchy of encapsulation
    gives us control of the configuration at a higher level. Eliminating unused components
    also reduces the compile time of the eCos image.


    Another example where component control is useful in the case where a particular
    device on the target hardware, such as an Ethernet port, is not going to be used
    in the application. Eliminating the device driver for the Ethernet port reduces
    memory usage in the system.


    A package is a type of component that is used for distribution. In a package all
    the necessary source code files, header files, configuration description files,
    documentation, and other relevant files. A package is often contained in a single
    file, allowing it to be installed with the appropriate tool or updated in the
    future when changes are. Having a distribution package as a standalone unit allows
    third-party developers to extend the functionality offered in the eCos system.
    Enabling a package loads the configuration data into the appropriate tool. You
    also have control over the version of the packages that are used in the system.


    # ### 1.3.1.5 Targets


    A target is the piece of hardware on which the application will be executed. The
    target might be an off-the-shelf evaluation board, your own hardware platform,
    or a simulator. When creating a configuration, you select a target so that the
    component framework can load particular packages to support the devices and HAL
    relevant to the target. In addition, configuration options are changed from their
    default values to settings appropriate for the target.'
