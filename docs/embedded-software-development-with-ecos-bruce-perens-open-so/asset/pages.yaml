  md: '# # The Configuration Tool


    11.2 There are two tools you can use to configure the eCos repository according
    to your specific requirements. As mentioned in Chapter 1, the configuration tools
    give you the ability to customize the eCos library to meet your application needs
    through source-level configuration. You can use the command-line tool or the graphical
    Configuration Tool.


    The command-line tool does not offer the ability to resolve conflicts interactively.
    The Configuration Tool provides interactive conflict resolution, as well as an
    easy-to-use interface for configuration setup and management, the facility to
    build the eCos RTOS library, and the capability to build and run tests on a target
    platform. We are going to focus on the use of the Configuration Tool for manipulating
    our configurations throughout this book. If you would like to become more familiar
    with the command-line tool, additional information can be found online in the
    eCos User''s Guide:


    http://sources.redhat.com/ecos/docs.html


    The eCos development tools are located in D:\ecos\bin directory from our installation
    in Chapter 10. The source code for all eCos development tools is located under
    the D:\ecos host directory.


    There are two different versions of the Configuration Tool we installed, 1.3.net
    and 2.11. The version 1.3.net of the Configuration Tool only supports host environments
    running the Windows operating system. Version 2.11 of the Configuration Tool can
    run on Windows and Linux host environments.


    The major difference between the two versions is that the 1.3.net version includes
    a graphical window called the Memory Layout Tool (MLT) for manipulating memory
    configurations. Since the MLT functionality is expected to move into a separate
    application (at sometime in the future), it is not included in the version 2.11
    release of the Configuration Tool.


    In this book, we use version 2.11 of the Configuration Tool for configuring the
    eCos framework and building eCos images. We also cover the MLT, in version 1.3.net
    of the Configuration Tool, later in Chapter 10. Both versions of the Configuration
    Tool were installed


    We get a basic understanding of the relationship between the Configuration Tool
    and the component repository in this chapter. DSL script files are included with
    all packages, which allow the Configuration Tool to interpret and display the
    proper information about a given package.


    The Configuration Tool can be invoked by either using the desktop icon, if created
    during the installation procedure, or by the Start -> Programs -> eCos Configuration
    Tool menu.


