    # 11.1.2 The Component Definition Language Overview


    We now take a brief look at the CDL. This section gives us a basic understanding
    of how and how scripts are used with packages in the component repository. Using
    the information in this, we can then proceed to explore the eCos configuration
    tools and how the package CDL script files are interpreted in The Configuration
    Tool section of this chapter. An in-depth look into the CDL is provided online
    in the eCos Component Writer''s Guide:


    > http://sources.redhat.com/ecos/docs.html


    Details the CDL command and keyword syntax are in the CDL Language Specification
    of the eCos Component Writer''s Guide.


    CDL is not a new language, it is an extension of the existing Tool Command Language
    (Tcl) scripting language. The CDL uses Tcl syntax. The CDL is a key part of the
    eCos component framework that is used in scripts (with the extension .cdl) to
    describe the architecture to the framework. These CDL script files contain information
    on all of the configuration options within a package, as well as details on how
    to build the package.


    # 11.1.2.1 CDL Script Files


    Each package has a single top-level CDL script, typically located in the cdl subdirectory,
    as shown in Figure 11.1. The first command in the top-level script should be cdl_package,
    which is used in the package database file ecos.db. There should only be one cdl_package
    per package.


    The CDL syntax implements a command hierarchy. This allows options to be controlled
    as a group; therefore, disabling a single component disables all options within
    the component as well. The hierarchy also enables a simpler representation in
    the Configuration Tool for navigation and modification of options, as we see in
    The Configuration Tool section of this chapter.'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'There are four CDL commands used in scripts:


    +   **cdl_package**—The unit of distribution, which might contain option, component,
    or interface commands within its body. Typically, this is the top level of the
    CDL script file. The package command body can use of most option properties as
    well as additional properties or commands that apply to the entire package.


    +   **cdl_component**—A configuration option that might contain additional options
    or subcomponents within its body. The body of a component command might also contain
    the same properties as the option command.


    +   **cdl_option**—The basic unit of configurability that generally contains a
    single choice. The body of the option command contains properties that describe
    and define the characteristics of the option. There might also be information
    to aid in your decision, such as a text description of the option.


    +   **cdl_interface**—A calculated configuration option that provides an abstraction
    mechanism. The body of the interface command might contain a subset of the option
    properties.


    Every command must have a command name. All command names must be unique within
    a configuration. If two names exist within two different packages, it is not possible
    to load both packages in a configuration.


    > **NOTE** You might notice that some packages use the same CDL command names.
    For example, all HAL packages define the CYG_HAL_STARTUP. Even though all command
    names must be unique within a configuration, this is because only one HAL package
    can be loaded at a time; therefore, the name CYG_HAL_STARTUP only exists within
    a configuration.


    Typically, the command framework outputs a #define for every active and enabled
    option, using the command name as the symbol defined. For example, enabling the
    option command named:


    ```

    CYIMP_KERNEL_INTERRUPTS_DSRS

    ```


    which is located within the ECos kernel package, in the Kernel Interrupt component
    causes


    ```

    #define CYIMP_KERNEL_INTERRUPTS_DSRS 1

    ```


    to be placed in the designated kernel package header file. Some options are set
    to values in which the configured value is used when setting the #define statement.


    Command names in the ECos component repository follow a naming convention to avoid
    clashes with other packages. An example of a package name is CYGPKG_HAL_I386_PC.'
