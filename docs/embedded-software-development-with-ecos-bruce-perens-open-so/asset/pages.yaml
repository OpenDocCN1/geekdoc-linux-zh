  md: '# Configuring the Windows Host


    > NOTE Before proceeding with the installation it is important to ensure that
    all Cygwin applications, if any, running on your system are shut down. If you
    have never installed Cygwin tools on your system, you do not have to worry about
    this.


    It is also a good idea to disable any anti-virus software you have running. Occasionally
    conflicts occur, such as system hangs, between the Cygwin files and certain anti-virus
    software.


    Having a space in your Windows logon name might also cause a problem using the
    Cygwin tools. To avoid any problems, it is best to install within a Windows logon
    name without spaces.


    If you are upgrading a previous version of the Cygwin tools, you should refer
    to the readme,txt file in the cygwin directory in the CD-ROM to guarantee that
    the proper steps are performed prior installation.


