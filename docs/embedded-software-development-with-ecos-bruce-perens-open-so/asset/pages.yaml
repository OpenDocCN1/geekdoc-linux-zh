    # 4.1.2 Virtual Vector Table Initialization


    The common HAL defines, in the file hal_if.h, to execute and set the services
    within the VVT, hal_virtual_vector_table. There are two macros defined for each
    virtual vector, a call macro--which executes the service in the VVT, and a set
    macro--which sets the service in the VVT. Listing 4 shows the call and set macros
    for the Reset vector. The call macro has the form CY_ACC_CALL_IF_XXX, as we see
    on lines 1 and 2, and set macro has the form CYG_ACC_CALL_IF_XXX_SET, which sets
    the defined name of the vector that gives its location in the VVT. The number
    of parameters passed into the call macro varies depending on the virtual vector
    service function. The macro always has a single value passed in, the address of
    the service function or the data to set in the VVT.


    ```

    #define CYGACC_CALL_IF_RESET(p_, _n_) \\

    (hal_virtual_vector_table[CYGNUM_CALL_IF_RESET]({p_, _n_}))

    ```'
