    # 3.3 Summary


    In this chapter, we looked at eCos exception handling. We saw how the VSR table
    is used by eCos to run exception handlers. We looked at the two options for exception
    handling. One option allows the HAL and kernel to provide default exception routines.
    The other option requires complete support of exception handling to be provided
    by the application.


    Then we proceeded to examine the eCos split interrupt processing scheme using
    ISRs and DSRs. This provides us with a mechanism to reduce interrupt latency and
    allows interrupts to synchronize with the threads running in the system. Finally,
    we went through the eCos interrupt handling process.'
