- img_proc: true
  md: '# 10.2 Configuring the Windows Host


    In order to develop eCos applications using the Windows operating system, tools
    must be installed to build the eCos compilers and other development tools. The
    tools that run under the Windows operating system are called Cygwin, Cygwin, an
    acronym for GNU Cygnus Windows, a UNIX environment for Windows consisting of a
    Dynamic Link Library (DLL) that acts as a UNIX emulation layer and a collection
    of UNIX tools ported to Windows. The Cygwin site located at:


    ```

    http://cygwin.com

    ```


    The Cygwin tools are capable of running on Windows 95/98/ME/NT/2000/XP operating
    systems, but the basic steps involved in setting up the eCos system on a Windows
    host are:


    +   1. Install Cygwin, the GNU native development tools for Windows—The native
    host allows us to build the eCos tools. This information is covered in this chapter.

    2. Build the platform-specific cross-development tools—The Cygwin tool allows
    us to build the development tools needed to construct the eCos RTOS and applications
    for a specific processor. We cover this process for the x86 specific tools in
    this chapter. Details for building the tools for other processors are also described
    in this chapter.

    3. Install the eCos development kit—The eCos development kit contains a release
    of the eCos code repository and configuration tools for building the eCos kernel.
    The development kit installation is covered in this chapter.

    4. Set up and configure the eCos Configuration Tool—The Configuration Tool is
    used, among other things, to assist in creating the application-specific eCos
    library files. This final procedure is detailed in Chapter 11.


    > NOTE It is a good idea when using the Windows operating system for your host
    development computer to use the NTFS or FAT32 file systems on which the tools
    are installed. The tools contain numerous small files, which can waste disk space
    if the hard drive is not formatted with NTFS or FAT32.


    Table 10.1 lists the disk space used by each of the host development modules for
    the Windows platform.


    We are going to be building the x86 platform cross-development tools. This allows
    us to develop and debug applications using a second PC as our target hardware.
    We cover examples using the target PC hardware in Chapter 12.


    And away we go...'
