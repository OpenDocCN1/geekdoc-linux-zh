  md: '# Porting eCos


    Getting your application running on your new target hardware platform is typically
    the main goal in embedded software development. This typically includes porting
    eCos to the target hardware as well. eCos was designed for portability using a
    layered approach to the different software system components. When porting eCos,
    moving the HAL to the target hardware is the first step, which enables the higher
    layer components, such as the kernel, to also run on the target hardware. Additional
    functionality, such as display drivers and Ethernet drivers, can then be incorporated
    to meet the requirements of the system and get the system fully operational.


    Because of the unique nature of each target system, it is impossible to cover
    every possible detail for each target system. Instead, in this chapter, we look
    at a platform example to get an overall understanding of the eCos porting process.
    Using one of the proved evaluation platforms as a baseline, we can add a new target
    platform to the eCos framework and see how to get this new platform up and running
    the eCos tools. We then go through some of the details that need to be addressed
    in other porting procedures.


    The PowerPC GNU cross-development tools are included on the CD-ROM in case you
    want to build this porting example, although this is not necessary for understanding
    the porting process. These tools are located under the `gnu/get` directory.


    # 13.1 Overview of Porting


    Now that we have an understanding of the components in the eCos system, how to
    use the tools, and how to write an application using eCos, we can focus on the
    main task involved with using any RTOS: getting the software running on our own
    hardware. This is typically the main goal'
  merge: -1
  pgno: 333
- img_proc: true
  md: '316


    Chapter 13 • Porting eCos


    when using RTOS. Porting to a new hardware platform can be a painful and slow
    process because it is typically occurring at the same time the hardware itself
    is being debugged.


    The layered architecture of eCos, as described in Chapter 1, An Introduction to
    the eCos World and shown in Figure 1.1, makes the porting process bit easier.
    To move to a new hardware platform we start by porting the HAL and ensuring that
    it functions properly on the new hardware. Since the higher application layers
    sit on on top of the HAL, they are not dependent on a specific piece of hardware.
    Options can then be configured to meet the needs of the new hardware platform.


    Since every piece of hardware is unique in its own, the porting process described
    in this chapter should be used as a general guide. Your hardware might require
    its own code such as serial and display drivers to get the system operating properly.
    There will be implementation details you need to make for your hardware in order
    to port eCos.


    The porting of eCos HAL can be broken down into three types: Platform, Variant,
    and Architecture porting. Platform porting consists of using the HAL of a current
    platform supported by eCos, which is similar to the new hardware platform, as
    a baseline and then making modifications for the new platform, including the new
    memory layout and any specific initialization. New drivers might need to be developed
    to accommodate additional hardware resources. Of the three types, porting usually
    requires the least amount of effort if an existing HAL can be used as a baseline.


    Variant port uses a closely related existing HAL as a baseline. As described in
    Chapter 2, The Hardware Abstraction Layer, a HAL supports differences of a specific
    processor from the generic processor architecture. A variant port might consist
    of redefining interrupts, cache, or other features that the default implementation
    of the architecture HAL not. The amount of effort necessary for a variant port
    corresponds to the similarity of the existing variant for the specific processor.


    Finally architecture porting consists of using an existing architecture HAL as
    a baseline. The reason why this can be such a daunting task is that compiler support
    must be present before the porting process; eCos is closely coupled to the GNU
    C/C++ Compiler. Although the GNU C/C++ Compiler supports numerous architectures,
    if it does not support your architecture then the task of porting the GNU compiler
    needs to be completed as well. After the architecture HAL port is complete, a
    compiler port must be done in order to support the new hardware.


    Before setting out a new variant or architecture port it is a good idea to search
    the eCos discussion mailing lists if anyone else in the development community
    is currently undertaking the same port. You can then see if the developer intends
    to contribute the port back by others.


    http://sources.redhat.com/ml/ecos-discuss


    If no one else is performing the same port, you can post your intentions to the
    list using the address ecos-discus@sources.redhat.com. You might receive a reply
    giving you some additional tips or resources to help you out.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# 13.2 A Platform Porting Example


    In order to get a better understanding of platform porting procedure, we are going
    to go through the process of creating a new hardware platform for our imaginary
    piece of hardware. In this example, we use the Motorola MBX860 platform HAL as
    our baseline. The Motorola MBX860 HAL is located under the hal\powerrpc\mbx subdirectory.


    During the software development process, choosing an off-the-shelf evaluation
    board allows us to do parallel software development while the hardware is being
    developed. Although the specific platform implementation details might differ
    among various HALs, this should be used as a general guideline that can be applied
    to all platform ports.


    For this porting example, we use RedBoot as the template. Additional information
    about RedBoot can be found in Chapter 9, The RedBoot Monitor; Since command-line
    interface sitting on top of the HAL with GDB stub functionality, we can leverage
    off the RedBoot development to put us steps in the porting process.


    Once the HAL is ported to the new hardware, RedBoot gives us the ability to load
    and debug code on our new target platform. We want to strip out any unnecessary
    functionality included in the RedBoot template so that we have a “bare bones”
    build of the RedBoot image. As we progress with our new hardware, we can add back
    the functionality we need to produce a fully featured RedBoot image.


    It is important to establish some baseline hardware priority for setting out on
    the eCos port. We should write out any basic hardware problems, as memory writing
    errors, before proceeding. This baseline functionality can be established using
    basic RAM read/write tests and ROM, if a flash ROM device is used, read/write
    tests. Having the proper tools during the early stages of bringing up hardware
    is crucial. Most processors have some type of In-circuit Emulator (ICE) or Background
    Debug Mode (BDM) tools available. A good article about ICE technology can be found:


    > www.embedded.com/1999/09/0910.html


    Having one of these tools can give you the ability to load code onto the target
    hardware without going through the process of burning EPROMs whenever you need
    to test changes. Testing of the new code is essential during the eCos porting
    process.


    Other equipment is good to have when bringing up a new piece of hardware is a
    logic analyzer and oscilloscope. These pieces of equipment can guarantee that
    the hardware is meeting their associated specifications.


    An evaluation board is a great piece of hardware to have during the initial phases
    of a project. Using the evaluation board, you can begin writing the application
    for your system long before your hardware is ready. Then, when your new hardware
    comes online you can go through the platform porting procedure, as described later
    in this section, to get eCos up and running on your new platform. The evaluation
    board also gives you a baseline of functionality that you can use to check your
    software as the project progresses. If something is not working correctly on your
    new hardware, you can always test it on the evaluation board to see how'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'it works in a more stable environment. A list of the evaluation boards supported
    by eCos can be found in Appendix A, Supported Processors and Evaluation Platforms.
    The latest additions to this list can also be found online at:


    http://sources.redhat.com/ecos/hardware.html


    Figure 13.1 is an overview flowchart of the platform porting example we go through
    in this chapter.


    # Figure 13.1 eCos porting process flowchart.


    ![](img/185e30b232edb8183f2482fa0071447a_336_0.png)


    We see in Figure 13.1, we begin by basing our new platform on an existing evaluation
