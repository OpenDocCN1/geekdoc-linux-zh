  md: '# Installation and Configuration


    RedBoot typically resides in the flash boot sector or boot ROM on the target platform.
    This gives control to RedBoot when the board is powered up. RedBoot can be configured
    to run from RAM if you need to debug the RedBoot code itself. This might be the
    case if you are porting RedBoot to run on your own hardware platform.


    The method for programming the RedBoot image onto the target hardware varies from
    platform and depends on the tools available. Some platforms include their own
    ROM monitor, such as the Motorola PowerPC MBX860 board, which can be used to program
    an image into flash memory and then run the program on power up. In other cases,
    a device programmer might need to be used in order to burn the image into memory.
    Detailed instructions on programming a RedBoot image for each target platform
    supported by RedBoot can be found at:


    http://sources.redhat.com/ecos/docs.html


    The steps involved in running an image on the i86 PC platform and the Motorola
    PowerPC MBX860 platform are covered in Chapter 12. These same steps can be applied
    to running the RedBoot image as well.


    The resources (ROM, RAM, and communication ports) used by RedBoot vary for each
    platform. A description of the resource utilization for the supported platforms
    can be found in the RedBoot documentation. The Configuration Tool''s Memory Layout
    viewer can be used to check and modify the RAM and ROM resources used by RedBoot.
    We cover the Configuration Tool, and all of its features, in Chapter 11.


