  md: '# The RedBoot ROM Monitor


    His chapter covers the RedBoot ROM monitor embedded software tool. The RedBoot
    ROM monitor provides debugging and bootstrap support. We cover thne installation
    and configuration details necessary to get RedBoot running on target hardware
    and communicating with a host unit.


    We look at the RedBoot user interface and commands provided for controlling the
    features provided. It is important to understand the method for building a RedBoot
    image to make use of upgrades and to extend the default command set; however,
    we cover this information in later chapters of this book. Although RedBoot is
    a standalone program that can be used with any real-time operating system, the
    information in this chapter focuses on using RedBoot with eCos applications.


    # 9.1 Overview


    RedBoot is an acronym for Hat Embedded Debug and Bootstrap. It is a program designed
    for embedded systems to provide a debugging and bootstrap environment. RedBoot
    is intended to take the place of older programs; specifically, CygMon and GDB
    stub ROM. In fact, CygMon is no longer supported.


    RedBoot is an eCos-based application and uses the eCos Hardware Abstraction Layer
    for its foundation. However, RedBoot can be used on any embedded system or with
    any RTOS. RedBoot can be used for debug support during the product development
    cycle or in a released product to provide flash and network booting. Some of the
    features provided by RedBoot include:


    +   * Boot scripting support

    * Command Line Interface (CLI) for monitor and control support'
  merge: -1
  pgno: 203
- img_proc: true
  md: '186


    Chapter 9 • The RedBoot ROM Monitor


    +   - Access via serial or Ethernet ports

    - GDB support

    - Flash image system support

    - X/Y modem support

    - Network bootstrap support using BOOTP or static IP address configurations


    RedBoot is a standalone, self-contained module that runs as an algorithm on the
    target platform. Included in RedBoot is a GDB stub (see Chapter 8, Additional
    Functionality and Third-Party Contributions, for more information) that allows
    connection to the target platform from a GDB host for application debugging. This
    debug connection can be over the serial or Ethernet port. RedBoot uses a standalone
    stack, separate from the eCos stack, which provides a base of functionality for
    network communications.


    Redboots booting from ROM, RAM, flash, or an Integrated Disk Electronics (IDE)
    hard drive running the eCos system. A ROMBoot startup mode is also available;
    in which case, RedBoot resides in ROM but is copied to RAM before it begins to
    run.


    When we build a RedBoot image, as in Chapter 12, An Example Application Using
    eCos, the result is a binary file that is programmed onto the target hardware.
    This RedBoot image can contain, depending on the configuration options and packages,
    all the software components to use all features of the target hardware.


    Figure 9.1 shows the block architecture of some of the features included with
    the RedBoot ROM monitor. From this illustration, we can see that the functionality
    provided by RedBoot is all contained within the RedBoot program image. The interaction
    between RedBoot and the eCos application varies depending on the configuration
    options in both images. RedBoot can be configured to provide simple load and run
    functionality, or can be configured to provide flash management support, monitor
    and control for the eCos application via the CLI using the serial port, and GDB
    debugging capabilities.


    RedBoot is shipped in many products currently on the market, including:


    +   - Intel Serial Gateway

    - Intel XScale Development Board

    - Intel StrongARM Development Boards

    - MIPS Malta 4kc/5kc/20kc Development Board

    - MIPS Atlas 4kc/5kc/20kc Development Board


    The latest developments and information about the RedBoot ROM monitor can be found
    online at:


    http://sources.redhat.com/redboot'
