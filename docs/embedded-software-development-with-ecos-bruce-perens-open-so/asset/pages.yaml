  md: '# Interrupts


    Careful consideration is necessary when specifying the HAL interrupt configuration
    settings. Since the DSR executes with interrupts enabled, another interrupt might
    occur during the execution of the DSR. This means the processor state information,
    which can be sizable for certain architectures, for the current interrupt needs
    to be saved on the stack.


    The stack depends on the Use Separate Stack For Interrupts option. If this option
    is disabled, every thread in the system needs to be able to store the interrupt
    state on its stack, since interrupts can happen at any time. If multiple interrupts
    occur, the stack would need to hold the state information for each of these interrupts.


    If Use Separate Stack For Interrupts is enabled, the threads in the system would
    only need to store a single interrupt state from the interrupt that caused the
    thread to de-schedule, with its own thread stack. Only the interrupt stack has
    the responsibility to store this state information. The size of the interrupt
    stack should be carefully selected.


    Another option that can change the way interrupts are handled is the configuration
    of Allowed interrupts. The default setting for this option is disabled, meaning
    that interrupts are disabled during the ISR. When this option is enabled, the
    ISR enables interrupts to the processing of any higher priority interrupts that
    may occur. Some architectures support this feature in hardware. Most systems,
    the need to allow nested interrupts is nonexistent because the ISR is kept very
    short and the work is accomplished in the DSR.


    The kernel-level interrupt configuration options are under the Kernel Interrupt
    Handling (CYPGK_KERNEL_INTERRUPTS) component. Within this component is the main
    option Use Delayed Service Routine (CYGIMP_KERNEL_INTERRUPTS_DSR), which enables
    or disables the Ecos split interrupt handling scheme.


    > NOTE If the Delayed Service Routines configuration is disabled, it is up to
    the user to accommodate synchronization between ISRs and threads. Many of the
    kernel API functions cannot be called from an ISR context, as shown in the kernel
    API tables throughout this book.


    The kernel-level interrupt subtions are available when DSRs are listed in Item
    List 3.5.


    # Item List 3.5 Kernel Interrupt Configuration Options


    | Option Name | Use Linked Lists For DSRs |

    | CDL Name | CYGIMP_KERNEL_INTERRUPTS_DSR_LIST |

    | Description | Allows the kernel to keep track of pending DSRs in a linked list,
    preventing a table overflow from occurring. However, interrupts are disabled for
    a brief period before the kernel traverses the list. Alternatively, a fixed-size
    table can be used, with the number of entries configurable. This option is enabled
    by default.|


    | Option Name | Use Fixed-Size Table For DSRs |

    | CDL Name | CYGIMP_KERNEL_INTERRUPTS_DSR_TABLE |'
