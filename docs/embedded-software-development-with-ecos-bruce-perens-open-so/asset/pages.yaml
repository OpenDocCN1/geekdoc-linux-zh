    # 8.8 The GoAhead EmbeddedWebServer


    Although SNMP is the long-time standard for remote management, more and devices
    are seeking an alternative to eliminate the shortcomings of SNMP. The latest trend
    is to use Web protocols, such as HyperText Transfer Protocol (HTTP), HyperText
    Markup Language (HTML), and Java, for remote device management, also called Web-based
    management. This is accomplished through the use of an embedded Web server running
    on the device. A device''s data can be used to generate dynamic content that is
    represented in a Web page. These pages are accessed by any standard browser and
    the graphical interface to the device. Devices become more user friendly when
    they can be controlled using a common interface, such as the browser. For example,
    programming a VCR might not be as daunting as a task if the job could be done
    via a browser interface.


    There are a few disadvantages to using SNMP for remote management. One disadvantage
    is the requirement of application software to control devices which is often costly
    and difficult to use. Another disadvantage is that SNMP uses UDP, which is an
    unreliable protocol for communication across networks. Packets that are lost in
    transmission are not retransmitted, and acknowledgment of received packets is
    not performed. This can have consequences if the information contained in that
    packet was crucial.


    Along with being, up-and-coming trend. Using the use of a standard interface that
    is familiar to most users. Having the browser as an interface also allows the
    use of handheld devices, most of which have browsers standard, for portable management.
    Network communication from devices is achieved using TCP, which is a reliable
    protocol.


    Companies currently using the GoAheadWebServer in products include Hewlett-Packard,
    Honeywell, Siemens, and Canon. A complete list of companies is provided on the
    GoAhead WebServer site at:


    www.goahead.com/webserver/customers.html


    > My wife, who finds programming the VCR a daunting task, can verify this and,
    therefore, relies on me for all of her video recording needs. Yet she is a wizard
    using a computer to navigate the Web with her favorite browser.'
