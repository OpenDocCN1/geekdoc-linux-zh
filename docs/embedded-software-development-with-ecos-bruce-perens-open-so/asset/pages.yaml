    button exits the dialog box without applying any solutions.


    If you choose not to apply the proposed solutions, the resolve conflicts dialog
    box can be displayed by selecting Tools -> Resolve Conflicts from the menu bar.
    Unresolved conflicts are also displayed in the Conflicts window and a total count
    is shown on the bottom-right side of the status bar.


    Finally, resolving a conflict might cause other conflicts to occur. In this case,
