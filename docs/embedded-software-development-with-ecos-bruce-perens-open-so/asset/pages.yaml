    # 8.3.3 Journaling Flash System Version 2


    ECos also provides support for the Journaling Flash System, version 2 (JFFS).
    JFF2 is based on JFFS (version 1). JFFS was designed to use embedded flash memory
    devices more efficiently. JFFS and JFF2 also take into account the characteristics
    of flash technology when dealing with the situation in an embedded system where
    the system is not always shut down.


    JFF2 is a log-structured file system, whereas a typical embedded file system emulates
    a traditional file system using block-based storage and keeps track of the files
    in these blocks. JFF2 builds on the version 1 technology.


    The JFF2 package (CYPGK_FS_JFF2) is contained in the jffs2 directory under the
    file system''s directory fs. The license for the JFF2 file system can be found
    in the file License over the src directory. Additional details about JFF2 can
    be found online at:


    > http://sources.redhat.com/jffs2


    # 8.4 PCI Cu Support


    ECos provides a Peripheral Component Interconnect (PCI) bus which is a highperformance
    32- or 64-bit bus that has multiplexed address and data lines. The bus is intended
    to connect peripheral controller components, add-boards, and processor/memory
    systems. The PCI bus is commonly found in PCs today, but is also made its way
    into embedded system designs. The current version of the PCI bus specification
    is 2.2. Additional information about the PCI specification can be found online
    at:


    www.pcisig.com'
