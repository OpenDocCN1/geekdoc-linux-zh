    # 6.2 Synchronization Mechanisms


    The eCos kernel provides the mechanisms for the threads in the system to communicate
    with each other and synchronize access to shared resources. The mechanisms provided
    by the eCos kernel are:


    +   * Mutexes

    * Semaphores

    * Condition variables

    * Flags

    * Message boxes

    * Spinlocks (for SMP systems)


    The kernel also provides API functions that allow applications to make use of
    the synchronization mechanisms. Some of the synchronization mechanism API functions
    provided are either blocking or nonblocking.


    Blocking function calls, such as cyg_semaphore_wait, halt execution of the thread
    until the API function can complete successfully. Nonblocking function calls,
    such as cyg_semaphore_trywait, attempt to complete successfully; however, if the
    API function is not, a return code indicates the status of the call so the thread
    can proceed with its execution.


    Another type of blocking call, blocking with timeout, exists for certain synchronization
    mechanisms. These may halt execution of the thread for a specified period of time,
    such as cyg_semaphore_timed_wait, while attempting to complete the function successfully.
    If the function does not complete before the timeout period, the function returns,
    indicating an unsuccessful status.


    # 6.2.1 Mutexes


    The first synchronization mechanism provided by eCos is the mutex. A mutex (mutual
    exclusion object) allows multiple threads to share a resource serially. The resource
    can be an area of memory or a piece of hardware, such as a Direct Memory Access
    (DMA) controller.


    A mutex is similar to a binary semaphore that it has only two states—locked and
    unlocked. However, there are a couple of differences between a binary semaphore
    and a mutex.'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'A mutex provides protection against priority inheritance, whereas a binary
    semaphore does not.

    Priority inheritance is discussed further later in this section.


    A mutex also has the concept of an owner, and only the owner can lock the mutex.
    A binary semaphore does not have this requirement; it is possible for one thread
    to lock a binary semaphore and another to unlock it. Once a mutex is locked, it
    should not be locked again; this might cause undefined behavior. A thread that
    attempts to lock a mutex by another thread will wait until the owner unlocks the
    mutex.


    One issue arises in real-time systems when using mutexes is *priority inheritance*.
    Priority inversion occurs when a high priority thread is incorrectly prevented
    from executing by a low priority thread. An example of this is when the high priority
    thread is waiting on a mutex that is currently owned by the low priority thread.
    Then, an unrelated medium priority thread preempts the low priority thread, preventing
    the high priority thread from executing at its proper priority level.


    ecos provides two solutions to the priority inversion problem that are selectable
    as configuration options. The first solution is *priority ceiling*. In the priority
    ceiling protocol, all threads that acquire the mutex have their priority level
    raised to a preconfigured value. This value is available as a configuration option.
    One disadvantage to this protocol is that the priority level for threads using
    the mutex must be known ahead of time so the priority value can be set. Another
    disadvantage is that if the ceiling is set too high, unrelated threads with priority
    levels below the ceiling can be locked out from executing, possibly causing real-time
    deadlines to be missed. The priority inversion protocol is used when priority
    inversion is not occurring.


    A more elegant ecos provides a *priority inheritance protocol*. The priority inheritance
    protocol allows a thread that owns the mutex to be raised to the priority level
    equal to the highest level of all threads waiting for the mutex. The priority
    inheritance protocol is only used when a high priority thread is waiting for the
    mutex. The drawback to using this protocol is synchronization costs as could cause
    the scheduler must comply with the inheritance protocol each time.


    The configuration options for the mutex synchronization primitive can be found
    in the *Synchronization Priorities* component within the *Kernel package*. The
    main configuration option Priority In Protocols (CYGSEM_KERNEL_SYNCH_MUTEX_PRIORITY_INVERSION_PROTOCOL)
    controls the inversion algorithm used for mutex operations. This option enables
    or disables the use of one of the priority inversion protocols for mutex. Eliminating
    the use of a priority inversion protocol reduces code and sizes. For example,
    ecos defines one algorithm for protection against priority inversion called *Simple*,
    which is only available with the multilevel queue scheduler. The Simple algorithm
    is designed to be fast and deterministic. The priority protocol used within the
    Simple algorithm can be set by configuration options. The configuration suboption
    that specifies the inversion protocol used is *Default Priority Inversion Protocol*,
    which can be set to INHERIT, CEILING, or NONE. List 6.3 lists the configuration
    suboptions for the mutex priority inversion protocol.'
