    # 4.1.2  Communication Channels


    Since the HOL controls the low-level I/O functions for diagnostic and debug communication,
    it is important to understand that eCos uses to access to the I/O ports. All HAL
    I/O happens via the communication channels called COMMS channels. There are two
    types of COMMS channels within HAL, console and debug. Each channel type can be
    configured using any physical port, such as Ethernet, on the target hardware.


    Console channels are used for I/O during the debugging process; for example, routing_printk
    function output for logging, tracing, or assertion messages. Normal I/O should
    use proper device drivers as described in the I/O Control System section of Chapter
    7. Debug channels are used for communication between the host debugger, such as
    GDB, and the ROM.


    The number of communication channels varies among the different platforms. The
    configuration option Number of Communication Channels on the Board (CYGNUM_HAL_VIRTUAL_VECTOR_CHANNELS),
    under the HAL architecture-specific components, define how many channels are present
    for a particular platform.


    There is a Communication Interface Table (CIT) associated with each COMMS channel
    in the system. The CIT, defined as hal_virtual_comm_table_t in the HAL, is an
    array that contains pointers to or relevant data to the specific COMMS channel.
    The CIT is allocated, in the file hal_init, for each COMMS channel supported by
    the platform using the Number of Communication Channels on the Board configuration,
    plus an additional CIT for the possible use of mangler procedures is described
    later in this. Table 4.2 lists the supported COMMS CIT procedures. The procedures
    in the CIT allow access to various COMMS functionality.


    # Table 4.2 Console and Debug Communication Interface Table Procedures


    | Procedure | Table Index | Description |

    |---|---|--|

    | Channel Data | 0 | Pointer to the communication controller address. All procedures
    in the table use this address as their first argument. |

    | Write | 1 | Send a buffer to a device. |

    | Read | 2 | Get a buffer from a device. |'
