    # 11.3.2 The Command-Line Configuration Tool


    Configuration of packages in the ECos repository for your specific application
    requirements can also be done with the ECos command-line tool. The command-line
    configuration tool is installed with the ECos development kit installation, which
    we did in Chapter 10.


    The executable is located in the D:\ecos\bin subdirectory. The command-line configuration
    tool can be invoked from the bash prompt by running the file ecosconfig.exe. Invoking
    the command-line executable without any parameters displays the message showing
    the different commands. The source code for this tool is also installed with the
    ECos development kit at D:\ecos\configtool


    Since the Graphical Configuration Tool is able to run on both Windows and Linux,
    with version 2.0 and beyond, we do not get into the details of using the command-line
    configuration tool. It is much easier to use the Configuration Tool to set up,
    configure, and build the ECos library. The command-line configuration tool also
    does not offer the ability to interactively resolve conflicts that arise during
    the configuration process.


    # 11.4 Building the ECos Tools


    Even the Eco development tools, including the Graphical Configuration Tool, the
    Package Administration Tool, and the command-line configuration tool, are open
