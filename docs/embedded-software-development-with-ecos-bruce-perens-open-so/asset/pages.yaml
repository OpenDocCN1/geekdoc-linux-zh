    # 1.2.2 The eCos Configuration Method


    As embedded systems are pushed to smaller, faster, cheaper, and more sophisticated,
    control over all software in the system is necessary. There are different methods
    to control the behavior of components in an application image. The philosophy
    of the eCos component implementation is to reduce the size for systems that have
    resource limitations, even to the detriment of systems that do not have strict
    resource constraints. With this design philosophy in mind, minimal systems do
    not suffer from additional code necessary to support advanced features only used
    in more complex systems.


    One method to control software components is at run time. In this method, no up-front
    configuration of the component is done. The code linked to the application provides
    support for all behaviors of the component whether it is required by an application
    or not, causing the code to be much larger. An example of run-time control is
    an application that runs on a desktop. When the application is executed from the
    disk, the shared libraries (Dynamic Link Libraries [DLL], etc.) needed by the
    application are loaded when the application starts.


    Another method for component control is at link time. In this case, the code can
    use only the specific functions of a component that it needs, and the code that
    supports functionality such as the GNU linker (ld), offer link-time control, or
    commonly called, *selective linking*. With selective linking, unreferenced functions
    needed by the application are left out. Data are removed from the application
    image. However, this is still insufficient because only entire functions can be
    removed-at link time.


    Compile-time control gives the developer control of the component behavior at
    the earliest stage, allowing the implementation of the component itself to be
    built for the specific application for which it is needed. Compile-time control
    gives the best results in terms of code size because the control is at the individual
    statement level in the source code rather than at the function or object level.
    This manage-time control is well suited for embedded development.


    eCos uses compile-time control methods for its software components, with selective
    linking provided by the GNU linker. Using compile-time control or source-level
    configuration is achieved using the C preprocessor. An example of source-level
    configuration is shown in Code Listing 1.1. The flag `INCLUDE_FUNCTIONALITY` is
    enabled or disabled by the developer. When this section of the code is compiled,
    only the code that is needed is included in the application image.


    ```

    1 #ifdef INCLUDE_FUNCTIONALITY

    2

    3

    4

    5else

    ```'
