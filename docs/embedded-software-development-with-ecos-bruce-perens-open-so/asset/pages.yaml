    while the source code files contain *src* for installing the Cygwin tools, for
    example, *cygwin-1.3-2-tar-src.bz2*. All of the files necessary for installing
    the Cygwin tools can be found online:


    ```

    http://cygwin.com/download.html

    ```


    If traffic is busy on the main Cygwin site, it might be necessary to use one of
    the mirror sites. A list of Cygwin mirror sites can be found online at:


    ```

    http://cygwin.com/mirrors.html

    ```


    The Cygwin readme.txt, is also contained on the CD-ROM of the cygwin directory.
    It is a good idea to read this prior to beginning the Cygwin installation. The
    readme can also be found online at any of the Cygwin distribution sites. For any
    additional information or problems installing or using the Cygwin tools, you can
    look at the Cygwin discussion mailing list located online at:


    ```

    http://cygwin.com/ml/cygwin

    ```


    Posts to this discussion list should be sent to cygwin@cygwin.com. Additional
    Cygwin discussion mailing lists can be found online at:


    ```

    http://cygwin.com/lists.html

    ```


    Manuals for the different Cygwin development tools can be found online at:


    ```

    www.gnu.org/manual

    ```'
