    ```c\n#define HAL_ENABLE_INTERRUPTS() \\\nCYG_MACRO_START \\\ncyg_uint32 tmp1,\
    \ tmp2;\nasm volatile \\\nmfmr %0; \\\nori %1,%0,0x8000; \\\nrlwmi %0,%1,0.16,16;\
    \ \\\nmtmsr %0; \\\n:: \"r\" (tmp2); \\\nCYG_MACRO_END\n```\n```\n\n**Code Listing\
    \ 2.2** PowerPC architecture implementation of `HAL_ENABLE_INTERRUPTS()` macro.\n\
    \nIn Listings 2.1 and 2.2, we see that the call `HAL_ENABLE_INTERRUPTS()`, as\
    \ shown on line 1 of both lists, is same regardless of the architecture. However,\
    \ the process for actually executing an interrupt event varies from architecture\
    \ to architecture, as shown on lines 2 through 9 in Code Listing 2.1 and lines\
    \ 2 through 10 in Code Listing 2.2. The HAL allows the application to directly\
    \ access hardware and any architectural features and does not assume that it is\
    \ the only controller of all hardware in the system.\n\nGeneral design principles\
    \ were followed during the architecting of the HAL. First, the entire HAL is implemented\
    \ in C and assembly language. This allows the HAL to have the widest range of\
    \ application.\n\nSecond, interfaces to the HAL are implemented in C macros the\
    \ most efficient implementation to be used and the interface is not affected.\
    \ The interfaces can be implemented as inline assembly code, inline C code, or\
    \ external function calls to C or assembler code. By using the inline approach,\
    \ the run-time overhead associated with a function call is eliminated; however,\
