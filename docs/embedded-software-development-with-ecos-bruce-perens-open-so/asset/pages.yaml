    # # 8.1 Compatibility Layers


    Compatibility layers are specifications that define standard APIs to interface
    to the underlying ECos kernel in order to encapsulate implementation-specific
    functionality. This allows components to adapt the API, easing the porting of
    applications across different platforms and operating systems. This section gives
    a brief overview of the compatibility layer support offered by ECos. Resources
    for additional detailed information are included as well. ECos supports different
    compatibility layers:


    +   * POSIX

    * µTRON


    The packages for these layers are found under the compat subdirectory. This is
    further divided into the posix and uitron subdirectories. Figure 1.3, in Chapter
    1, shows the overall directory structure.


    # # 8.1.1 POSIX


    The Portable Operating System Interface (POSIX) is a Set of Electrical and Electronics
    Engineers, Inc. (IEEE) designed to ensure application portability. The POSIX specifications
    define APIs that detail how applications interface to operating systems.


    ECos supports the POSIX 1003.1996 Specification (ISO/IEC 9945-1). Support for
    a function means that the data types and definitions necessary to support the
    particular function, including the objects it manages, are also defined. ECos
    POSIX support is a subset of the POSIX standards, including the implementation
    of threads, signals, and synchronization objects. Additional information about
    POSIX can be found in the standard Portable Operating System Interface (POSIX)—Part
    1: System Application Programming Interface (API)[C Language]ISO/IEC 9945-1;1996,
    IEEE.


    ECos divides its support into two packages called the POSIX Compatibility Layer
    (CYPGKG_POSIX) and POSIX File IO Compatibility Layer (CYPGKG_IO_FILEIO). The POSIX
    Compatibility package provides support for threads, signals, synchronization,
    timers, and message queues, while the File IO Compatibility Layer package provides
    support for file and device I/O.


    ECos defines a template for POSIX that is used to ensure the standard configuration
    options for POSIX compatibility. Chapter 11, The ECos Toolset, describes the process
    for using templates in greater detail. There are configuration options for both
    the POSIX Compatibility'
