    # 1.2.1 In a Word: Configurability


    In order to get an understanding of the eCos architecture


    Most embedded software today provides more functionality than what might be needed
    for a particular application. Often, extra code is included in a software system
    that gives generic support for functionality that developers are not concerned
    with and is not needed. Furthermore, the more code, the greater the chance of
    something going wrong. An example would be a simple "Hello World" program which
    would be included, even though it is not necessary for a simplistic application.
    eCos gives the developer ultimate control over run-time components where functionality
    that is not needed can easily be removed, eCos can be scaled from a few hundred
    bytes up to kilobytes with features such as networking stacks included and third-party
    components such as Web servers used.


    Developers are able to select components that satisfy basic application needs,
    and configure for the specific requirements for the application. This could mean
    enabling or disabling a feature within a component, or selecting a particular
    implementation for the component. An example of this is in the kernel scheduler
    configuration. eCos offers the developer options such as the ability to select
    the priority of levels and time slice unused. meeting the developer’s requirements
    is limited in the final image of the application.


    Configurability allows a company to build an internal foundation of reusable components
    with access to the source code of the component. This can reduce development time
    and time to market because the components are highly portable and can be used
    in a wide range of applications. The eCos framework encourages third-party development
    to extend the features and functionality of the core eCos components. As more
    and more developers work extending the functionality on projects and contribute
    these components back to the eCos project, the'
