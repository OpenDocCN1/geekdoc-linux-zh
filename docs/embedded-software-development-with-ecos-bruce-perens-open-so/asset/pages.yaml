  md: '# Packages


    The first three characters of the name identify the organization that produced
    the package; in this case, CYG is for Cygnus Solutions. The next three characters
    indicate the nature of the option; in this case, PKG is used to indicate that
    this is a package. A complete list of command tags is given in The ECos Component
    Writer''s Guide. The HAL portion of the name identifies the location of the option
    within the overall hierarchy; in this case, we see that this is a HAL package.
    The last part, I386_FC, identifies the option itself. If this is the i386 architecture
    PC package.


    Each CDL command contains a body that might include properties or commands that
    describe the component framework how to handle each option. Properties are descriptions
    of the command or values set by you when the package is built. Commands within
    the CDL command body define header files, source files to build for the package,
    or identify constraints that must be met if the package is active. The basic CDL
    command is shown in Code List 11.2.


    ```

    1 cdl_package PACKAGE_NAME {

    2 <package properties and commands>

    3 cdl_command COMPONENT_NAME {

    4 <component properties and commands>

    5 }

    6 cdl_option OPTION_NAME {

    7 <option properties and commands>

    8 }

    9 }

    ```


