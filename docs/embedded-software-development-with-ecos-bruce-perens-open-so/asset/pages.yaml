    eCos supports two different schedulers that implement distinct policies. The eCos
    kernel is built using only one scheduler at any one time. The schedulers are:


    +   * Multilevel queue


    +   * Bitmap


    > NOTE A third scheduler exists in the eCos repository called the lottery scheduler,
    which is located in the file lottery.cxx under the kernel/scheduled subdirectory.
    The lottery scheduler is currently an experimental implementation and not shown
    in any configuration options. The multilevel queue and bitmap schedulers are actively
    supported. To use the lottery scheduler, hand-editing of the eCos system configuration
    is needed to implement the lottery code implementation.


    # 5.1.3.1 Multilevel Queue


    The multilevel queue scheduler allows the execution of multiple threads at each
    of its priority levels. The number of priority levels is a configuration option
    from 1 to 32, corresponding to priority numbers 0 (highest priority) to 31 (lowest
    priority). The scheduler allows preemption between different priority levels.


    Symmetric Multi-Processing (SMP) is only supported when using the multilevel queue
    scheduler. Additional information about SMP support under eCos can be found in
    Chapter 8.


    Preemption is a context switching halting of a lower priority thread, thereby
    allowing a higher priority thread to execute. The multilevel queue scheduler also
    allows timeslining within a priority level.


    Timeslining each thread at a given priority to execute for a specified amount
    of time, which is controlled by a configuration option. The queue implementation
    for the multilevel scheduler uses double linked lists to join threads within a
    priority level and threads at different priority levels.


    In 5.3, we show the multilevel scheduling queue representation along with an example
    of execution using this scheduler.


    In the scenario shown in Figure 5.3, three threads—Thread A, Thread B, and Thread
    C—are configured during creation of the threads at priority levels 0, 0, and 30,
    respectively. The state of the scheduler queue after thread creation is shown
    in Figure 5.3. For this scenario, timeslining is enabled. The timeline is a snapshot
    that starts with Thread C executing.'
