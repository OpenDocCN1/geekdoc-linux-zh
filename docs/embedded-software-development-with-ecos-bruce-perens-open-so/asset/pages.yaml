    # 9.3 Installation and Configuration


    eCOS provides a template RedBoot. Using this template, the default packages with
    the RedBoot ROM monitor are loaded and configured with the default option settings.
    The specific packages deployed on the hardware platform you are using. For example,
    the Motorola PCW MBX860 board platform loads the Ethernet driver which is supported
    on the MBX platform. However, the Intel StrongARM SA-1100 Multimedia board platform
    does not contain Ethernet support; therefore, the Ethernet driver is not loaded
    on the SA-1100 Multimedia platform. We cover building a RedBoot image in Chapter
    12.


    > NOTE Most HAL packages include a .ecm file that can be imported, along with
    the RedBoot template, in order to set up the packages to build the RedBoot ROM
    monitor for a specific platform. The files are typically named redboot.ecm, rom.ecm,
    or romram.ecm, where ROM, RAM, and ROMRAM determine the startup type for the RedBoot
    ROM monitor. The files are located in the misc subdirectory under the HAL packages.
    We cover the details of using .ecm files with the Configuration Tool in Chapter
    11.


    Although .ecm files are useful for loading a baseline of the proper packages for
    a specific platform, you should still verify the configuration option settings
    prior to building the RedBoot image. This ensures that the proper functionality
    you need is supported by RedBoot, for example, the configuration of certain options
    allows RedBoot to include certain required functionality, or alternatively eliminate
    particular features, reducing RedBoot''s memory footprint.'
