  md: '# Overview


    Finally, an emphasis on the ease of platform porting was made because the developers
    themselves typically perform this task.


    The HAL consists of three separate modules (or submodules); however, the boundary
    between each module is intentionally fuzzy;


    +   - Architecture

    - Platform

    - Variant


    The first HAL submodule defines the architecture. Each processor family supported
    by ECos is considered a different architecture. Each architecture submodule contains
    the code necessary for CPU startup, interrupt delivery, context switching, and
    other functionality specific to the instruction set architecture of the processor
    family.


    A second HAL submodule defines the variant. A variant is a specific processor
    within the processor family described by the architecture. An example of a feature
    that might be included at this level is support for an on-chip peripheral such
    as a Memory Management Unit (MMU).


    The third HAL submodule defines the platform. A platform is a specific piece of
    hardware that includes the selected processor architecture and, possibly, a variant.
    This module typically includes code for platform startup, chip select configuration,
    interrupt controllers, and timer devices.


