    # 12.3 RedBoot


    In this section we go through the process of building, loading, and booting RedBoot.
    There are pre-built images of the RedBoot ROM monitor. These are located in the
    online eCos repository under the subdirectory eCos/images. The RedBoot images
    are grouped according to hardware architecture. It might suffice to use these
    images in the beginning; however, understanding how to build your own RedBoot
    image is important if you need to make fixes or enhance the standard RedBoot program.


    The RedBoot image built in this example uses the FLOPPY Type configuration option.
    This means that the RedBoot image boots and runs from the floppy disk drive of
    the target PC.


