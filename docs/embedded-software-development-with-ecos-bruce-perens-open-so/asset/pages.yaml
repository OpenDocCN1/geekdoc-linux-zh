    # 10.2.4 Accessing the Online eCos Source Code Repository


    Due to the constant changes, contributions, and bug fixes made to the eCos source
    code, which will quickly become necessary to take advantage of these modifications
    and update your local source repository. It is very important to keep up to date
    with the latest fixes and enhancements to the eCos, and RedBoot, source. In order
    to do this, we must configure our system to access the remote repository.


    The eCos source repository, which includes RedBoot, is managed by CVS, and can
    be accessed publicly without requiring an account on the remote machine, which
    is termed anonymous CVS access. Additional information about CVS can be found
    online:


    www.cvshome.org


    Additional information about eCos access to the source repository using anonymous
    CVS can be found online at:


    http://sources.redhat.com/ecos/anoncvs.html'
