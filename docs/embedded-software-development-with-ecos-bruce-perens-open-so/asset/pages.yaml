    # 6.2.3 Condition Variables


    Another synchronization mechanism is the condition variable. Condition variables
    are used with mutexes to allow multiple threads to share data. Typically, a single
    thread waits for data to be available. The thread producing the data can either
    signal a single thread to wake up or all threads to wake up, with a broadcast
    signal, when the data is available. The waiting threads can then process the data
    as needed. Item 6.6 lists the API variable control functions.


