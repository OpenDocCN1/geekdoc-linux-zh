    The Block storage mechanism has the advantage of using fixed-size blocks management
    of memory easier. Another advantage is that the allocation mechanism is configured;
    however, the malloc implementation can be excluded from the image. A disadvantage
    of this mechanism is when using the malloc allocation method; each block causes
    a malloc function call than a single call for the file memory. The memory is also
    only available for the RAM file system.


    There are two configuration options that determine the storage implementation
    used for the RAM file system. These options are Simple Implementation (CYPGK_FS_RAM_SIMPLE)
    and Block-Based Allocation (CYPGK_FS_RAM_BLOCKS). Only one of the two storage
    implementations can be selected for the RAM file system. The Simple Implementation
    contains the configuration subset that sets the amount of memory to allocate for
    new data to a file. This subscription is Size of File Data Storage Increment (CYGNUM_RAMFS_REALOC_INCREMENT).
