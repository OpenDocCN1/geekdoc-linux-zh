  md: '# 8.2.3 GDB Stub


    At the core of the low-level ROM monitors is the GDB stub. The GDB stub is a piece
    of software that provides the low-level interaction with the HAL, as the GDB protocol
    communication layer. The low-level HAL interaction hooks into the serial port
