    # A Brief Take on Open Source Development


    There have always been “agnostics” in the debate of open source versus closed
    source—it sometimes comes down to whether the funding is available to purchase
    software tools and support. Each has its benefits and shortcomings, let’s take
    a brief look at some of the pros and cons developers have found when working on
    both sides of the open-source and closed-source fence. What it ultimately comes
    down to is, the product work, and can the schedule and cost be met using this?


    Open source can be a confusing term. In an article by Daniel Benenstein,¹ he states
    that open source is free software in the sense of freedom of knowledge. Much more
    reliance is placed on the individual developer to find problems, correct the problems,
    and make the solution available to the open-source community. This iterative process
    is the method that creates a more robust and free code base.


    Presumably, the draw of talent is worldwide, the best and brightest developers
    are working to make the product better. With closed source, a development support
    team assembled to work on fixing problems that they probably did not. The team
    might be very talented; however, the pool of talent from which to draw is very
    small compared to a worldwide talent pool.


    Often times, closed-source, proprietary and open-source software work work hand
    in complement each other. Many proprietary products are derived from open-source
    projects. Proprietary software—otherwise, why would people pay for something that
    they can get for free? Looking at things from this point of view, open source
    pushes proprietary software to the extreme of innovation.


    There are some advantages and disadvantages to using open-source software. One
    advantage is that the source is available if you are not able to get support from
    the open-source community, you can drive right and find out what is going with
    the code. There is no need for support from an open source, which can reduce debug
    time drastically.


    Another advantage of open-source software is that it is not tied to any specific
    company. In the case of proprietary software, if the owning company changes directions,
    or disappears, the application developers using that solution are left out in
    the cold. Open-source software prevents this developers from having full access
    to the code and can choose the path for their system software.


