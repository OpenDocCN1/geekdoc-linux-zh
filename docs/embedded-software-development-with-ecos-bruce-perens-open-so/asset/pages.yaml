  md: '# 4.1.1 Virtual Vector Configuration


    The virtual vector configuration options affect the initialization of the VVT.
    The default configuration options for the VVT, which can be overridden, are that
    the ROM monitor provides the debugging and diagnostic I/O services, and RAM applications
    rely on these services. In the case of a standalone production system, all services
    are provided by the application.


    The ROM Support (CYPGK_HAL_ROM_MONITOR) configuration option within the HAL Common
    Configuration Components. The main virtual vector configuration option is Enable
    Use of Virtual Vector Calling Interface (CYGSEM_HAL_VIRTUAL_VECTOR_SUPPORT), which
    is enabled by default and can only be disabled by hand-editing configuration files.
    Item List 4.1 lists the virtual vector configuration options.


    The two configuration options, behave as a ROM Monitor (CYGSEM_HAL_ROM_MONITOR)
    and Work With a ROM Monitor determine the type of being built. These options are
    also found under ROM Support (CYPGK_HAL_ROM_MONITOR) configuration option within
    the HAL Common Configuration Components. The two ROM monitor options dictate where
    the virtual vector configuration settings take effect. For RAM application debugging,
    typically Work With a ROM Monitor is selected. Behave as a ROM Monitor


    # Item List 4.1 Virtual Vector Configuration Suboptions


    +   Option Name Inherit Console From ROM Monitor

    CDL Name CYGSEM_HAL_VIRTUAL_VECTOR_INHERIT_CONSOLE

    Description Allows the RAM application to inherit the console setup by the ROM
    monitor using the console channel and text encoding.


    +   Option Name Debug Channel Is Configurable

    CDL Name CYGPR_HAL_VIRTUAL_VECTOR_DEBUG_CHANNEL_CONFIGURABLE

    Description Allows the HAL startup code to make use of the debug channel configuration.


    +   Option Name Console Channel Is Configurable

    CDL Name CYGPR_HAL_VIRTUAL_VECTOR_CONSOLE_CHANNEL_CONFIGURABLE

    Description Allows the HAL startup code to make use of the console channel configuration.


    +   Option Name Initialize Virtual Vector Table

    CDL Name CYGSEM_HAL_VIRTUAL_VECTOR_INIT_WHOLE_TABLE

    Description Causes the entry VVT to be initialized a default service function,
    nop_service. This is performed in hal_init.


    +   Option Name Claim Virtual Vector Entries By Default

    CDL Name CYGSEM_HAL_VIRTUAL_VECTOR_CLAIM_DEFAULT

    Behave as a ROM Monitor'
