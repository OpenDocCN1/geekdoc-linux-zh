  md: 'the exception number and possibly some parameters, to process the exception.
    After returning from this exception handler function, the thread can continue
    its execution.


    There are two methods for exception handling in Cos. The first is a combination
    of HAL and Kernel Exception Handling. The HAL provides general hardware-level
    exception processing and passes control to the application for any extended exception
    support needed. This is the default configuration method.


    The second exception handling method is Application Handling. This allows the
    application to take full control over any or all of the exceptions and attaches
    a vector service routine directly to the hardware. The exception handler routine
    needs to be written in assembly language when using this configuration method.


    markdown": "The configuration options that control the exception handling are
    the HAL Exception Support (CYPGK_HAL_EXCEPTIONS) option, located under the Platform-Independent
    HAL Options (CYPGK_KERNEL_HAL_COMMON) component, and the Exception Handling package.
    Each of these configuration components requires configuration. Enabling these
    options allows HAL and Kernel Exception Handling. If both of these configuration
    options are disabled, it is up to you to provide exceptions for Application Handling.


    Figure 3.1 shows the exception handling execution flow for the two main configuration
    options. The gray boxes illustrate, using a system exception as an example, the
    HAL and Kernel Exception execution flow. The white boxes show the execution flow
    for Application Exception Handling using an alignment exception as an example.
    We look at the execution flow shown in Figure 3.1 in this chapter.


    Another option, all exception handling can be disabled in the system. If this
    configuration is selected and an exception occurs, the macro CYG_FAIL is called
    and an assertion is raised. If assertions are not enabled, the state of the processor
    is restored; however, the cause of the exception might still exist. This is not
    a very elegant method for exception handling and can lead to undefined system
    behavior when an exception occurs. However, if code space is extremely important,
    it may be necessary to eliminate any extended exception processing.


    # 3.1.1 HAL and Kernel Exception Handling


    It is important that an exception handler is installed for each exception supported
    by the processor. If a handler is not installed for a particular exception and
    it occurs during execution, the process will jump to the exception address to
    find no code to execute. This can cause erratic behavior that can be very difficult
    to debug and may lead to system failures.'
