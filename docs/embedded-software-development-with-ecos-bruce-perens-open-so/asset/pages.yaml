    # ## 8.6 Networking Tests


    The eCos networking package provides tests for exercising different features of
    network communications. The tests can be performed over any of the network interfaces.
    The network tests, located in the tests under the common networking directory,
    are also a good source for examples on performing various network functions. For
    example, the file udp_test.c demonstrates how to initialize the network interface,
    create a UDP client for sending data, and create a UDP server for receiving data.


    There are two configurations for building network tests, one based on the Basic
    Networking Framework package and the other using networking stack implementation
    (OpenBSD or FreeBSD) package. Both configuration options are Build Networking
    Tests (Demo Programs) (CYGPKG_NET_BUILD_TESTS).


    Some of the tests require additional host machines included in the working package.
    A Makefile, make.linux, is included to build these tests on the host machine.
