  md: '# FOREWORD


    n 1997, there were over 100 commercially supported embedded operating systems,
    none of which had more than a minority share of the overall embedded OS market,
    not to mention countless thousands of others developed for specific projects (cell
    phones, radar arrays, networking equipment, etc.) that had no application developer
    base beyond that specific project.

    In short, the embedded operating systems market was highly fragmented, and the
    cost of this fragmentation was beginning to seriously limit the viability of many
    embedded software projects and the OEMs who funded those software projects.


    While it was clear to many that the major embedded software companies needed to
    change their business models in radical ways, each company believed that it could
    somehow outlast its competition, and that it could consolidate the market through
    a strategy of attrition rather than a strategy of innovation. At Cyus Solutions,
    we couldn''t wait for 90 percent of the market to give up; moreover, we weren''t
    sure if we wanted to serve a market that was 90-percent dead. Therefore, we took
    up our own challenge to create an embedded operating system that could address
    the incredible variety of possible embedded system designs, from the very small
    to the highly complex, using a single source base.


    In our market research we identified two primary reasons why people write their
    own RTOSes: first, they didn''t want to pay per-unit royalties to a third party,
    and second, they didn''t want to suffer the indirect cost of code that they didn''t
    write/control/understand using resources within their systems. The fact that writing
    and debugging an RTOS is expensive (in time and money), and the fact that most
    custom RTOSes required a complete understanding of the entire system in order
    order to make the smallest manual changes, often resulted in systems that were
    both more expensive to maintain and inferior in functionality to commercial alternatives,
    but such were the compromises required to avoid direct and indirect per-unit costs.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'The design philosophy of eCos was to augment an open-source RTOS (which meant
    no per-unit royalties) with source-level configuration tools that would enable
    embedded developers to scale their RTOS from hundreds of bytes to hundreds of
    kilobytes without needing to manually change a line of source code. Of course,
    if some code needed to be rewritten for some unique requirement, open-source licensing
    meant the option was there. However, for most cases the 200+ configuration points
    supported by eCos resulted in systems that were faster to build (all the hard
    work coded into the configuration rules) and resulted in smaller systems than
    manual methods could produce (because the automated rules were all-seeing and
    knowing most embedded developers could afford to be).


    Anthony''s book is easily the most complete treatment of eCos system development.
    I believe it is destined to become part of every eCos developer''s library.


    Michael Tiemann

    CTO, Red Hat, Inc.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# PREFACE


    Whether you''re working on an existing project or moving to a new development,
    eventually you''re going to have to decide on what Real-Time Operating System
    (RTOS) to use. Numerous questions arise, including how much does it cost to get
    started, there are royalties associated with the RTOS, what is the quality of
    the tools, is source code available, what features are available for realities,
    and so on. In most situations, the lowest-cost solution in both upfront costs
    and royalties is the best solution, as long as it works. Eliminating royalties
    is very important for high-volume products, where every nickel counts.


    There are also concerns of previous investments made, both in developer knowledge
    and financially, for the current solution. Anxiety can occur when considering
    existing code to a new software platform, which can be intimidating depending
    on the size of the project. Bringing a new RTOS to your hardware platform can
    create more trepidation.


    Decisions about whether to develop your own RTOS or use an off-the-shelf solution
    in some cases as well; especially when specific functionality is needed for a
    specialized hardware platform. In some cases, rolling your own RTOS might be the
    only solution. However, you can put your development ahead by leveraging software
    that is already implemented, tested on numerous platforms and in various situations,
    and, most importantly, proven because it is successfully running on other products.
    This eliminates the need for implementing functionality that is readily available.


    This book focuses on one solution to these concerns: the Embedded Configurable
    Operating System (eCos). The open-source and royalty-free nature of eCos allows
    it to be downloaded, set up, and used; and here''s the key: no cost. When finished
    with this book, you will have a complete embedded software development environment—all
    the tools necessary to tackle any project.'
  merge: -1
  pgno: 14
