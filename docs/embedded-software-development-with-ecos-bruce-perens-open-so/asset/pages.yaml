- img_proc: true
  md: '# Additional Features


    The startup sequence is different on SMP systems. A single CPU, the primary, han-deals
    the startup sequence, while the other CPUs, called secondary, are either placed
    in a suspended state or put into an idle loop by the HAL. After the application
    calls cyg_scheduler_start, the secondary CPUs are initialized.


    One major issue in an SMP is the ability for the kernel to protect its data structures
    from concurrent accesses. This is easily accomplished in a single-processor system
    by disabling interrupts. However, in a system with multiple CPUs, disabling interrupts
    on one CPU does not block another CPU from accessing the data structures.


    When the kernel is operating a single-processor process, accesses to the kernel
    data structures are blocked using the scheduler lock. The scheduler lock is implemented
    as a simple counter that is atomically incremented to acquire and decremented
    to release the lock. When the value of the lock is zero, the scheduler is allowed
    to select a different thread to run. Since ISRs can be serviced while the scheduler
    is locked, certain kernel functions can only be called from operating contexts.
    Additional information about the scheduler for single-processor systems can be
    found in The Scheduler section of Chapter 5, The Kernel.


    For SMP systems, a kernel-locking mechanism is needed that does not rely on interrupt
    manipulation. This special synchronization mechanism is called a spinlock. Spinlocks
    are provided for SMP systems, although the other synchronization mechanisms work
    in SMP systems as well. Spinlocks are described in Chapter 6, Threads and Synchronization
    Mechanisms.


    In addition, functions have been added for interrupt processing in SMP systems.
    One of these functions allows routing of interrupts to a specific CPU in the system.
    The other function enables you to find out which interrupts in the system are
    handled by which CPUs. Detailed information about these, and other interrupt function
    calls can be found in Chapter 3, Exceptions and Interrupts.


    # 8.10 Additional Features


    Now that we have covered some of the additional functionality available for use
    in the Ecos system, let''s take a quick look at some other additional features
    support by Ecos. This section is intended to make you aware of some of the features
    supported by Ecos; the details of operation for these packages are omitted.


    The dynamic loader allows Executable and Linking Format (ELF) file images to be
    loaded onto a target during run. After the new ELF image is loaded, the running
    application can call functions in the new image. The dynamic loader package (CYGPKG_LOADER)
    is located in the services\loader directory.


    The zlib package is a general-purpose compression/decompression library widely
    known in the software community. It provides in-memory compression and decompression
    functions that are thread safe and include integrity checks of the uncompressed
    data. Reading and writing of files in zip format, with interface functions similar
    to stdio, is also supported by the zlib library. The zlib package (CYGPKG_COMPRESS_ZLIB)
    contains a port of zlib to Ecos and is contained in the services\compress\zlib
    directory. Additional information about the zlib library can be found online at:'
  merge: -1
