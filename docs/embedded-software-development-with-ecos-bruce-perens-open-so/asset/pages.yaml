  md: '# Exceptions and Interrupts


    In this chapter, we begin with a look at exceptions and how they are handled at
    the HAL and application layers within the ecos system. Next, we cover the ecos
    interrupt model, including interrupt configuration, handling, and control. The
    exception and interrupt information prepares us for managing software and hardware
    events that occur.


    # 3.1 Exceptions


    An exception is a synchronous event that occurs during the execution of a thread
    that disrupts the normal flow of instructions. If exceptions are not properly
    processed during program execution, severe consequences, such as system failures,
    can occur. Exception handling is extremely important, especially in embedded systems,
    to avoid these failures, and improves the robustness of software. Properly implemented
    exception handling can also aid in software execution recovery so that an application
    can proceed with its task after an exception has occurred.


    Examples of exceptions that can occur in a system include those raised by hardware
    (such as a memory access error) and those raised by zero error. After the exception
    causes an interrupt, the processor will jump to a defined address (or exception
    vector) and begin to run the instructions at that location. The address that the
    processor jumps to the exception handling code to process the error. Different
    architectures might locate the exception handlers at various places and implement
    this jump process in a variety of methods.


    The method for implementing exception handling can vary. ecos does not provide
    an implementation similar to the throw and catch facilities provided in C++. For
    an embedded system, the simplest and most flexible method for handling exceptions
    is to call a function. This function needs a context or an area to do its work,
    and is typically passed in information, as'
