    # 8.1.1.1 ELIX


    ELIX is an API developed by Red Hat to provide compatibility across different
    operating systems including Linux, embedded Linux, and eCos. The ELIX API encapsulates
    subsets of the ISO/IEC 9899:1990 (ISO C) and ISO/IEC 9945-1 (POSIX 1003.1) APIs,
    as well as a number of well-known functions commonly found on Unix and particularly
    Linux that are suitable for embedded systems.


    The ELIX interface ensures application portability for operating systems adopting
    the Standard, which preserves the investment in software development and developer
    knowledge. Red Hat has initiated the ELIX API as an open-source project. Other
    companies involved with ELIX include Intel, MIPS, Toshiba, and Pacific Softs.
    Additional detailed information about ELIX can be found at:


    > http://sources.redhat.com/elix


    Since the base of ELIX functionality is the POSIX specification, operating systems
    that conform to the POSIX standard should be largely compatible with the ELIX
    specification.

    eCos Functions are present at the associated level and all higher levels. The
    ELIX-package follows Level 1, the RTOS compatibility layer. These various API
    subsets are different defined within ELIX:


    +   * Level 1—RTOS Compatibility Layer. These functions are available in both
    Linux and embedded operating systems, such as eCos, RTEMS, VxWorks, and PSOS.
    Certain functions at this level may have reduced or modified semantics.

    * Level 2—Linux Single Process Only. Includes Level 1 along with functions from
    Linux that are not easily implemented on an RTOS. Includes the full implementation
    of any reduced Level 1 functions.

    * Level 3—Linux Multiprocess for Embedded Applications. Based on POSIX.1 with
    the removal of functions not intended for embedded applications.

    * Level 4—Full POSIX or Linux Compliance. These functions are present in a standard
    Linux kernel.'
