- img_proc: true
  md: '# ABOUT THE CD-ROM


    The CD-ROM included with Embedded Software Development with eCos contains all
    of the software and source code needed to set up a complete embedded software
    development environment, centered on the eCos real-time operating system. The
    CD-ROM includes the following:


    +   * A readme file, Read.txt, which gives additional details about the contents
    of the CD-ROM and installation of the software it contains.

    * A UNIX environment for Windows consisting of a Dynamic Link Library (DLL) that
    acts as a UNIX emulation layer and a collection of UNIX tools ported to Windows
    called Cygwin.

    * A snapshot of the eCos source code repository with all of the eCos configuration
    and development tools.

    * Example files demonstrating how to use the eCos configuration tools to build
    the RedBoot monitor, the eCos library, and an application. As well as an example
    showing how to port the eCos HAL.

    * The GNU cross-development tools for the i386 and PowerPC platforms including
    the GNU Binary Utilities (binutils), GNU C/C++ Compiler (GCC), and GNU Debugger
    (EDB)

    * An open-source list program, named Splint, which is used to statically verify
    a program, or part of a program, by standard libraries.

    * An open-source code analysis and comprehension tool Source-Navigator.

    * A Windows-based CVS client called WinCVS, which allows anonymous access to the
    eCos source code repository.

    * A popular CVS client called TTCS.


    The CD-ROM can be used on Microsoft Windows®95/98/NT/2000/Me/XP and Linux. with
    service pack 3 or above and Red Hat Linux 7.0 (or later). The Cygwin tools are
    for use on Windows-based host host..

    The recommended operating system, which is used for the examples in this book,
    is Windows with service pack 6.0a.


    # License Agreement


    Use of the software accompanying Embedded Software Development with eCos is subject
    to the terms of the License Agreement and Limited Warranty, found on the previous
    pages.


    # Technical Support


    Prentice Hall does not offer technical support for any of the programs on the
    CD-ROM. However, if the CD-ROM is damaged, you may obtain a replacement copy by
    sending an email that describes the problem to: disc_exchange@prenhall.com.'
