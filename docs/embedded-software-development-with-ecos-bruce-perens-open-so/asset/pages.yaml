    The final step in the kernel startup procedure is to invoke the scheduler. The
    scheduler that is started, either multilevel queue or bitmap, depends on the configuration
    options under the kernel component package.


    > NOTE Code running during initialization with interrupts disabled and the scheduler
    locked. Enabling interrupts and unlocking the scheduler is not allowed because
    the system is in an inconsistent state at this point.


    Since the scheduler is started after cyg_user_start returns, it is important that
    kernel services are not used within this routine. Initializing kernel primitives,
    such as a semaphore, is acceptable; posting or waiting on a semaphore would cause
    undefined behavior and possibly system failure.


    # 5.1.3 The Scheduler


    The core of the ECos kernel is the scheduler. The jobs of the scheduler are to
    select the appropriate thread for execution, provide mechanisms for these executing
    threads to synchronize, and control the effect of interrupts on thread execution.
    This section does not describe the implementation details of the different schedulers,
    but instead gives a basic understanding of how the existing ECos schedulers operate
    and the configuration options available.


    During the execution of the scheduler code, interrupts are not disabled. Because
    of this, interrupt latency is kept low.


    A counter exists within the scheduler that determines whether the scheduler is
    free to run or disabled. If the lock counter is nonzero, scheduling is disabled;
    when the lock counter returns'
