    This option only needs to be specified if the image will be loaded with the fis
    command.

    - s data_length--Length in bytes of the actual data to be written to flash memory.
    If this option is not specified, the image length is -1. If data_length is less
    than the length for the -l option, the remainder of the image in flash memory
    is left blank.

    - n--FIS directory without copying data from RAM to flash. This option can be
    used to recreate the FIS entry if it has been destroyed.

    ame--Name of the image to create.


    Description: Create an image in the FIS directory, which causes data currently
    in RAM to be stored in flash memory. Data for the image must be present in RAM
    prior to calling this command.


    +   Syntax: fis delete

    Options: --Name of the image to delete.

    Description: Remove the image by the name parameter, from the FIS, which causes
    the image to be erased from flash memory and removed from the FIS directory.


    +   Syntax: fis erase -f <flash_addr> -l <length>

    Options: -f flash_addr--Start flash memory to erase.

    -l length--Length in bytes to erase.

    Description: Force an erase of a portion of flash memory. No checking is done
    to ensure whether the area specified corresponds to a loaded image.


    +   Syntax: fis free

    Options: None

    Description: Display areas of flash memory that are not currently in use, meaning
    that the block contains non-erased contents. This command can be used to check
    if a particular location is in use prior to loading an image.


    +   Syntax: fis init [-f]

    Options: -f--Erase or format all blocks of flash memory.

    Description: Initialize the FIS. This command should be executed once during the
    first installation of RedBoot on the target hardware. Executing this command may
    cause the loss of data in flash memory.


    +   Syntax: fis load -b <memory_load_addr> [-d] name

    Options: -b memory_load_addr--Location in RAM to copy the image from flash memory.
    If this option is not specified, the image is copied from flash memory to the
    address where the image was created. Executable images normally load at their
    linked location.

    -c--Compute and display the checksum of the image data after loading is complete.'
