    share the ports it uses for debugging and diagnostics with the Ecos.


    > NOTE To avoid terminating a RedBoot communication channel that is using the
    networking stack, you must ensure proper configuration of two options within the
    Ecos application image.


    The first configuration, Insert Console Settings From ROM Monitor (CYGSEM_HAL_VIRTUAL_VECTOR_INHERIT_CONSOLE),
    must be enabled. The second configuration option, Claim Comms Virtual Vectors
    (CYGSEM_HAL_VIRTUAL_VECTOR_CLAIM_COMMS), must be disabled. These configuration
    options are located under the ROM Monitor support component within the common
    configuration components of the Ecos HAL.


    One issue to keep in mind when configuring debug environment settings is that
    a serial port for debug communications can be slow when you are loading large
    application images.


    Typically, if the port resources can be dedicated for either RedBoot usage or
    application usage. The HAL configuration options allow you to set up debug and
    diagnostic I/O communications to meet your needs. The following two configuration
    options are used to configure the method of communication with the application.
    The first configuration option, Route Diagnostic Output to Debug Channel (CYGDBG_HAL_DIAG_TO_DEBUG_CHAN),
    under the Platform-Indent HAL components allows the use of RedBoot''s debug channel
    for diagnostic messages from the application. RedBoot provides mangling-support,
    with GDB, which outputs the message to the host. Mangling in the scenario described
    below means that RedBoot converts diagnostic messages from the application into
    a properly formed GDB remote protocol.


    The second configuration option is Inher Console Settings From ROM Monitor (CYGSEM_HAL_VIRTUAL_VECTOR_INHERIT_CONSOLE)
    under ROM Monitor Support within the common configuration components. This option
    allows the application to use the configured RedBoot console setup for output
    from the application. RedBoot handles the mangled needed for proper communication.


    Two-platform configuration options allow specific designation of the port number
    used for debug and diagnostic communications. If only one port exists on the platform,
    these options should be configured to use that port. The first is Debug Serial
    Port (CYGNUM_HAL_VIRTUAL_VECTOR_DEBUG_CHANNEL), which determines the port used
    to connect to the GDB host.


    The other configuration option is Diagnostic Serial Port (CYGNUM_HAL_VIRTUAL_VECTOR_CONSOLE_CHANNEL),
    which determines the port used for output of diagnostic messages; for example,
    using the diag_printf function. Chapter 4 details this configuration'
