  md: '# I/O Control System


    The I/O Sub-System functions use a handle to access the device driver. This handle
    is retrieved from the device I/O table using the cyg_io_lookup function, which
    takes the device name as a parameter. Device names, as "/dev/serial0" or "/dev/eth0",
    are set up using configuration options. Once the handle for a particular device
    driver is retrieved, it can be used with the I/O Sub-System API functions. List
    7.9 defines the I/O Sub-System API functions which return standard error codes
    that are defined in the codes.h under the error subdirectory.


    The I/O Sub-System (CYPGKG_IO) package has two configuration options available.
    The first is Debug I/O Sub-System (CYDBG_IO_INIT), which enables diagnostic message
    output during the initialization of the I/O Sub-System interface. This option
    is disabled by default.


    The second configuration option, Basic Support for File Based I/O (CYPGKG_IO_SUPPORT),
    enables simple file I/O functions to support configurations that include the networking
    stack. This option is disabled when File I/O (CYPGKG_IO_FILEIO) package is incorporated
    into a configuration. This option is enabled by default. The subcontract Number
    of Open Files (CYPGKG_IO_NFILE) controls the total number of open files in the
    system.


    # Item List 7.9 I/O Sub-System API Functions


