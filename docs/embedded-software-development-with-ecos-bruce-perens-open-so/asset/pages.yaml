  md: '6. After the ISR returns, the default interrupt VSR calls the function interrupt_end.
    The function interrupt_end is part of the kernel interrupt handling code and can
    be found in the file intr.cxx under the kernel\current\intr subdirectory.


    7. If a DSR needs to execute, interrupt_end calls the function post_dsr.post_dsr,
    also part of the kernel interrupt handling code in the file intr.cxx, manages
    the implementation of posting the DSR. The two kernel interrupt configuration
    options Use Linked Lists for DSRs and Fixed-Size Table for DSRs determine the
    structure for the DSR. See the Interrupt Configuration section in this chapter
    for a detailed description of these options.


    8. After post_dsr returns, interrupt_end then unlocks the scheduler.


    9. If the scheduler lock variable is at 0, the DSR executes. If the scheduler
    lock variable is greater than 0, then the thread unlocks the scheduler executes
    at this point. In case, we assume another thread that has not locked the scheduler.
    An example of a DSR is shown in Code Listing 3.2.


    After the DSR completes, the scheduler code continues execution.


    10. Next, the HAL default interrupt VSR restores the processor state. This takes
    place in the restore_state, the same function called from the default exception
    VSR.


    11. Finally, thread execution continues.


    > NOTE It is important to realize that the thread interrupted, as described in
    step 1, might not be the thread that is restored for execution by the scheduler,
    detailed in the thread 11. This can happen if the DSR executes, as described in
    step 8, and causes another thread to become ready to run that is at a higher priority
    than the thread that was interrupted.

    For example, let''s say that two threads are created in a system—thread A and
    thread B—where thread B is at a higher priority than thread A. Thread B waits
    on a semaphore indicating that data has arrived from a device. Suppose that thread
    A is currently executing when the device causes an interrupt, indicating data
    arrived, as shown in step 8. Steps 9 through 8 occur. However, in step 9, the
    DSR associated with this interrupt posts the semaphore that thread B is waiting
    on. When the scheduler unlock continues execution, the context of thread B is
    restored because it is at a higher priority than thread A. Therefore, in step
    11, thread B executes.


