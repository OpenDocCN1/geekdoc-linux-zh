  md: 'xviii


    Preface


    Since eCos is open source, the developer, is in complete control over your embedded-software
    design. Even the tools described in the eCos development system are open source,
    thereby allowing you to become completely self sufficient—although the eCos development
    community is out there available to help when needed.


    # Book Layout and Overview


    Let''s take a look at the layout of the book and get an overview of what is covered
    and where it is located. This enables you to find the specific aspects of eCos
    that you need to understand.


    The layout of the book is intended to build on information covered in later chapters.
    We start with understanding the key components within eCos, then move to additional
    functionality offered in the system, and finally, get down to using eCos and the
    development environment.


    For new developers to the eCos world, or embedded software altogether, it is helpful
    to understand the components that make up the eCos system by starting at the beginning.
    This gives the baseline understanding of the different features provided by eCos.
    You can then implement these components in an actual system.


    More experienced developers looking for an evaluation of eCos can skip to the
    later chapters and begin right away. The format of the development platform installation
    and examples allows a quick setup of the tools and immediate results. This lets
    answer the question, "will eCos work for me?"


    Current eCos users can fill in any holes that may be present in the eCos knowledge,
    by looking at some of the eCos concepts from a different point of view.


    Chapter 1, An Introduction to the eCos World, begins with a brief introduction
    to eCos, which includes a background about the eCos open-source project and the
    company behind it starts. A description of the eCos terminology is detailed as
    well. This terminology is used throughout the book and in the eCos development
    community. The beginning of the book is intended to provide developers who are
    unfamiliar with eCos means to become acquainted with the eCos open-source project.


    Next, we discuss the components within the eCos system, presenting a closer look
    under the hood of these major software modules. The key components offer an understanding
    about how the different software modules work independently and to provide functionality
    required by the system.


    Chapter 2, The Hardware Abstraction Layer, focuses on the software closest to
    the hardware that enables higher-level software modules to be unaware of the low-level
    functionality of the hardware.


    In Chapter 3, Exceptions and Interrupts, we detail exceptions and interrupts and
    show how they are set up and handled in the eCos system. We discuss vectors in
    Chapter 4, Virtual Vectors, which provide a means to share services between ROM
    and RAM applications.


    The heart of the eCos RTOS, the kernel, is the focus in Chapter 5, The Kernel.
    The kernel supplies the scheduling and the synchronization mechanisms for the
    software. Moving on to Chapter 6, Threads and Synchronization Mechanisms, we discuss
    the basic unit of'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Preface


    execution in eCos, the thread, and provides a detailed look at the various synchronization
    mechanisms supported by eCos.


    Chapter 7, Other ECos Architecture Components, continues with our look at the
    different ECos components by focusing on timing components, asserts and tracing
    functionality, and the I/O control system.


    Chapter 8, Additional Functionality and Third-Party Contributions, includes a
    broader look at some of the additional features available for eCos developed by
    the eCos project maintains and third-party contributors. These include networking
    support, ROM monitors, file systems, PCI support, CVS support, and the GoAhead
    WebServer.


    In Chapter 9, The RedBoot ROM Monitor, we focus on the RedBoot ROM monitor. This
    standalone program for embedded systems to provide a debugging and bootstrap environment.
    RedBoot is an eCos-based application and uses the eCos Hardware Layer (HAL) for
    its installation.


    We begin our hands-on experience in Chapter 10, The Host Development Platform,
    with the installation of the host development tools. We discuss the Cygwin native
    tools, GNU cross-development tools, and the eCos development kit. We also cover
    the installation of a Concurrent Version System (CVS) client, WinCVS, to enable
    access to the eCos source code repository. This gives you the ability to take
    advantage of any fixes or extended functionality contributed to the eCos source.


    In Chapter 11, The eCos Toolset, we delve into the eCos tools with a detailed
    look at how the tools operate on the eCos source code, and the layout of the tools.
    Also included some other open-source tools to round out and complete our open-source
    embedded development system. This prepares us for the next step, putting the tools
    to work to build our application.


    Chapter 12, An Example Application Using eCos, lets you put your knowledge to
    work. The chapter starts with an overview of the eCos build process, followed
    by a build of the RedBoot ROM monitor. We then do a build of the eCos real-time
    operating system, and, finally, put it together by building an application. This
    chapter provides a baseline on which you can then add additional components to
    assemble a system to meet your embedded software requirements.


    Chapter 13, Porting eCos, closes with a look at portant eCos onto another platform.
    This is the key to getting your application running on your new hardware platform,
    which is typically the main goal in embedded software development.


    # Development System and Examples


    As mentioned previously, in Chapter 10 we go through the process of setting up
    an eCos development system. This development system includes the native Cygwin
    tools for Windows, the GNU-development tools (binutils, compiler, and debugger),
    the eCos configuration and management tools, a CVS client, and a list program.


    This system enables you to configure and build the eCos library, which is linked
    with an application to run the eCos RTOS. The RedBoot ROM monitor is also built
    using this system.'
  merge: -1
