    # 3.2 Interrupts


    An interrupt is an asynchronous external event that occurs during program execution,
    causing a break in the normal program execution. Typically, these external events
    are hardware related, such as a button press or timer expiration. Interrupts can
    happen at any time. Interrupts allow time-critical operations to be performed
    with normal program execution.


    Similar to exception processing, when an interrupt occurs, the processor jumps
    to a specific address for execution of the Interrupt Service Routine (ISR). Hardware
    support for interrupts varies among different architectures. Each processor has
    its own number of interrupt priority to trigger the ISR.


    The methods for vector handling among different architectures are diverse. Some
    processor architectures support vectoring to individual vectors, while others
    have a single vector for all interrupts. When individual vectors are supported,
    an ISR can be attached directly to the vector for processing when the interrupt
    occurs. For single vector, the software must determine which interrupt occurred
    before proceeding to the appropriate ISR.


    One of the keys in embedded systems with respect to interrupts is latency. Latency
    is the interval of time when an interrupt occurs until the ISR begins to execute.
    Ecos employs an interrupt handling scheme to reduce interrupt latency in the system.


    # 3.2.1 Ecos Interrupt Model


    Ecos uses a split interrupt scheme where the interrupt is divided into two parts.
    The first part is the ISR, and the second part is the Deferred Routine (DSR).
    This scheme allows for the minimal amount of interrupt latency in the system by
    reducing the amount of time spent inside interrupt service routines. The idea
    is to keep the processing done in the ISR to a bare minimum. In this scheme, the
    DSR is executed with interrupts enabled, allowing other priority interrupts to
    occur and be processed in the manner of servicing a lower priority interrupt


    In cases, where very little interrupt needs to be done, the interrupt can be handled
    by the ISR completely. If more complex servicing is required, a DSR should be
    used. The DSR is executed at a later time when thread scheduling is allowed. Executing
    the DSR at a later time allows the DSR to use kernel synchronization mechanisms;
    for example, to signal a thread, via a semaphore, that an interrupt has occurred.
    However, there are periods where thread scheduling is disabled by the kernel,
    although these periods are kept as small as possible. User threads can suspend
    scheduling as well. This prevents the DSR from executing. from executing in a
    timely manner can lead to system failures from an interrupt source'
