    # 6.3 Summary


    We began this chapter with a look at threads and how we use them in the eCos system,
    including the importance of how we set the stack size for a particular thread
    based on its execution flow. We then examined the different synchronization mechanisms
    available in the eCos system. Proper use of the various synchronization mechanisms
    is important for our applications to operate as intended.'
