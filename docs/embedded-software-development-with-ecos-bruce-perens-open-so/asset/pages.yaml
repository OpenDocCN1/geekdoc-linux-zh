  md: '# Package Control


    After a template has been loaded, it is often necessary to load or unload particular
    packages to set up the configuration to support all of the features for the application.
    Adding and removing packages is accomplished by using the Packages dialog box
    as shown in Figure 11.15. This dialog box is displayed by selecting *Build ->
    Packages* from the menu bar.


    The left side of the Packages dialog contains a scroll list of all available packages
    in the eCos component repository under the label *Available Packages*. The right
    side contains a scroll list of the packages selected in the configuration under
    the label *Use These Packages*. The version of the currently selected package
    is shown in the drop-down list below the label *Version*. If multiple packages
    are selected, the versions common to both packages are displayed in the version
    drop-down list. The description of the package is located below the version. The
    description window is blank when multiple packages are selected. In Figure 11.15,
    we see that the version of the *RAM Filesystem* package is selected from the available
    packages.


    To add a package to the configuration, select the package from the available packages
    list and click the *Add* button. Multiple packages can be selected by holding
    down the *Ctrl* key while clicking packages. Next, select the version of the package
    you want to add from the *Version* drop-down list. This contains all versions
    installed under your component repository installation. Since the *current* version
    is the one we installed in Chapter 10, this is the only version shown.


    To remove a package from the configuration, select the package from the current
    packages being used and click the *Remove* button. Again, multiple packages can
    be selected by holding down the *Ctrl* key while clicking packages.


    > NOTE An error message is displayed when you try to add particular packages from
    the package dialog box. For example, if you were to try to add a device driver
    that is not supported by your selected platform, a message box appears informing
    that you need to load a different hardware template to order the package you specified.
    This means that there is some conflict between the packages you have currently
    selected and the package you are trying to add. In this case, the hardware template
    selected does not support the device driver you are trying to add.


