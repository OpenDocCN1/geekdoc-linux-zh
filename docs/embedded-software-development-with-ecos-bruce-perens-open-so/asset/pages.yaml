  md: '# Introduction to

    the eCos World


    In this first chapter, we take a brief look at the origins of the Embedded Configurable
    Operat ing System (eCos) and the people and company behind it. We then get an
    overview of the configurable architecture of eCos, the core functionality, the
    different processors and evaluation platforms supported, and technical assistance
    options available.


    Lastly, we get an overview of the eCos architecture and a look at the terminology
    used to describe the different pieces of the configuration system. The overview
    gives us a general idea of the components we detail in later chapters, and the
    terminology described in this chapter is used throughout the book.


    # 1.1 Where It Started—Cygnus Solutions


    Michael Tiemann, David Henkel-Wallace, and John Gilmore founded Cygnus Solutions
    in 1989. The idea behind Cygnus Solutions was to provide high-quality support
    and development for open source software. It was initially unclear whether this
    business model would work out; how- ever, by the end of the first year it was
    obvious from the value of the support and development contracts that the business
    was real. The workload was enormous for the five-person company (the three founders,
    a salesperson, and a part-time graduate student).


    It was clear that the engineering support model worked; the costs to fulfill these
    contracts were very high. In order to generate income at a lower cost, the engineers
    had to put their heads together to come up with an idea. The plan was to focus
    their development efforts on a small set of open-source technology that could
    be sold. The key to maintaining this development order that could be handled by
    the group was to keep the focus very small. What they came up with was selling
    the GNU compiler (GCC) and debugger (GDB) as shrink-wrapped software. This was
    the right team of people to do the job. Michael Tiemann, who contributed'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'numer GCC compilers and also wrote the first C++ compiler (GNU C++ or G++),
    took on the task of working on GCC; David Henkel-Wallace worked on the binary
    utilities (bintils) and the library; and John Gilmore worked on GDB.


    This task grew to monumental proportions. One advantage, or so it seemed, was
    that John decided to become the new GDB maintainer. Making this known to the community
    immediately flooded him with different versions of GDB. Now came the task of integrating
    these new feature versions.


    Eventually, the hard work paid off in what today is called the GNUPro Developers
    Kit. The kit includes:


    +   - GCC--the highly optimized ANSI-C compiler.

    - G++--ANSI C++ compiler.

    - GDB--source- and assembly-level debugger.

    - GAS--GNU assembler.

    - LD--GNU linker.

    - Cygwin--UNIX environment for Windows.

    - Insight--a graphical user interface (GUI) for GDB.

    - Source-Navigator--source code comprehension tool.


    # 1.2 The Origins of eCos


    Initial design discussions for eCos began in 1997. The primary goal was to bring
    a cost-effective, high-quality embedded software solution to the marketplace.
    This new development would also complement the GNUPro tools, thereby expanding
    Cygnus'' product offering.


    Another essential requirement was that eCos needed to be designed in such a way
    that a small resource footprint could be. Working with different semiconductor
    companies, Cygnus was able to architect a real-time operating system (RTOS) that
    abstracted the hardware layer and was highly configurable. This enabled RTOS to
    fit into many diverse embedded systems. The highly configurable nature of eCos
    allowed companies to reduce time to market for embedded products.


    Reducing cost is always a concern in embedded systems. By using the open-source
    model, eCos was available with no initial costs. It could be downloaded and ''test
    driven'' free of charge. In addition to eliminating startup costs, another attractive
    cost-saving feature was that eCos had no back charges—and to be royalty-free.


    Developers have full access to the entire software source code, including the
    tools, which can be modified as necessary (see Appendix B, eLicense, for the eCos
    license). There are no up-front license fees for the eCos run-time source code
    or any of the associated tools; everything needed to set up a complete embedded
    software development environment can be accomplished'
