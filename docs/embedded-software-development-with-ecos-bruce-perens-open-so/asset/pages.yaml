  md: '# 3.2.2 Ecos Interrupt Configuration


    The Ecos interrupt configuration options affect how the interrupts are processed
    in the system. Configuration options are available at the HAL and kernel level.
    The configuration options are architecture dependent.


    The HAL-level configuration options are located under the HAL Interrupt Handling
    (CYGPEK_HAL_COMMON_INTERRUPTS) within the HAL Common Configuration Components.
    Item List 3 lists the configuration options for setting up interrupts at the HAL
    level.


    # Item List 3.4 HAL Interrupt Configuration Options


    | Option Name | Use Separate Stack For Interrupts |

    | CDL Name | CYGIMP_HAL_COMMON_INTERRUPTS_USE_INTERRUPT_STACK |

    | Description | Allows a separate stack, maintained by the HAL, during interrupt
    processing. This eliminates the need for every thread stack to allow space for
    interrupt handlers. This is enabled by default |


    | Option Name | Interrupt Stack Size |

    | CDL Name | CYGUM_HAL_COMMON_INTERRUPTS_STACK_SIZE |

    | Description | Specifies, in bytes, the size of the interrupt stack. This is
    the stack that will be for all interrupts when Use Separate Stack For enabled.
    The value for this option is dependent on the architecture and application, as
    well as other interrupt configuration, such as interrupt nesting. This is also
    used during the HAL startup process. The default value for this option is 4096.
    |


    | Option Name | Allow Nested Interrupts |

    | CDL Name | CYSEM_HAL_COMMON_INTERRUPTS_ALLOW_NESTING |

    | Description | Causes HAL default interrupt VSR to re-enable interrupts prior
    to invoking the interrupt handler. This allows other interrupts, of higher priority,
    to occur and be processed. This option is disabled by default. |


    | Option Name | Save Minimum Context On Interrupt |

    | CDL Name | CYGDBG_HAL_COMMON_INTERRUPTS_SAVE_MINIMUM_CONTEXT |

    | Description | Permits the HAL interrupt handling code to use architecture-specific
    calling conventions, reducing the amount of state information saved. This improves
    performance and reduces code size. The drawback is that debugging is often more
    difficult. This option is enabled by default. |


    | Option Name | Chain All Interrupts |

