    # 11.2.1.4 Conflicts Window


    The Conflicts window, in Figure 11.3, displays any problems that arise during
    modification, installation, or removal of configuration items. A conflict occurs
    when requirements are not met between configuration items that are defined in
    the CDL.


    The Conflicts window is split into three columns: Item, Conflict, and Property.
    The Item column displays the macro name of the item involved in the conflict.
    The Conflict column shows a description of the conflict type, such as Unsatisfied
    or Illegal. The Property column contains a description of the configuration item
    property that caused the conflict. The Conflicts window can be enabled or disabled
    by selecting View -> Conflicts from the menu bar or using the hot-key combination
    Alt+5.


    Right-clicking on a particular item in the Conflicts window pops up a menu with
    two options, Locate and Resolve. Locate causes the configuration item to be selected
    in the Configuration window. Resolve allows you to resolve the conflict prior
    to building the eCos library.

    Resolving conflicts is covered in the Using Templates section of this chapter.'
