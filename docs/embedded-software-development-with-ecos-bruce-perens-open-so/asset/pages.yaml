    software projects. By parsing through C, C++, Java, T, FORTRAN, COBOL, and assembly
    language code, Source-Navigator builds a project database. The database includes
    useful information such as internal program structures, the location of function
    declarations, contents of class declarations, and the relationships between program
    components. The home site for the Source-Navigator project can be found at:


    http://sources.redhat.com/srcenav


