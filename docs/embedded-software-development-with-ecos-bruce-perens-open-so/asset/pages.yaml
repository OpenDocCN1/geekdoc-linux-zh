  md: 'The following is a step-by-step description of the execution flow shown in
    Figure 3.2; the numbers correspond to the events in the diagram.


    +   1. The first item in Figure 3.2 shows the execution of a thread.

    2. The next event is an external hardware interrupt.

    3. Now, the processor looks into the VSR table, `hal_vsr_table`, to determine
    the location of the interrupt vector service routine to execute. During HAL startup,
    `hal_mon_init` installs the default interrupt VSR into the VSR table for the external
    interrupt. The names of the default interrupt VSRs are shown in Table 3.2. The
    ARM architecture is not shown in the table because it defines separate vector
    service routines for each of its interrupts.

    4. Next, the default interrupt VSR begins executing. The first task of the interrupt
    VSR is to save the current processor state. As mentioned, the current processor''s
    state can be saved either on a thread''s stack or on the interrupt stack, depending
    on the HAL configuration options selected. After the processor''s state information
    has been stored, the default interrupt VSR increments the `cyg_scheduler_lock`
    kernel variable to ensure that scheduling does not take place.

    Next, the default vector service routine needs to find out which ISR to call.
    ISRs are installed by the application, as we see in the example in Code Listing
    3.2.

    The HAL uses three tables, implemented as arrays, to maintain the ISR information
    needed. The size of tables is specific. The ISR tables are:

    * `hal_interrupt_handlers`-contains the addresses of the interrupt service routines
    installed by the application.

    * `hal_interrupt_data`-contains the data to be passed into the ISR.

    * `hal_interrupt_objects`-contains information that is used at the kernel level
    and hidden from the application layer.

    The HAL interrupt VSR uses an architecture-specific function, `hal_intc_decode`,
    to perform the lookup in the `hal_interrupt_handlers` table. This function finds
    the index in the table based on the interrupt vector number and/or through examining
    the hardware, as an interrupt controller. The value is used for indexing into
    the data (which is passed into the ISR) and objects (used at the kernel level)
    tables.

    5. Next, the default VSR calls the ISR installed by the application, which executes
    at the application level, performs any necessary functions for the particular
    interrupt. The ISR notifies the kernel that the DSR should be posted for execution
    by returning `CYG_ISR_CALL_DSR`. The ISR also returns `CYG_ISR_HANDLED` to terminate
    chained interrupt processing. An example of an ISR and DSR is shown in Code Listing
    3.2.'
