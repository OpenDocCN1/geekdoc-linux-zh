    # 9.4.1.1 Boot Stripping


    RedBoot supports running scripts during the hardware boot cycle. Boot stripping
    allows you to run commands you always wanted after power up. For example, if you
    are constantly going to load an image into memory for execution and debug, you
    can avoid entering commands manually by setting up a boot script. A timeout is
    included in the boot script setup allows you to abort the boot script during a
    particular power up cycle by simply pressing Ctrl+C. This boot script is set up
    and run on the Motorola PowerPC MBX8630.


    Boot scripts are set up using the fconfig command. Entering true (or t) when fconfig
    prompts for Run script at boot RedBoot in a mode allowing you to'
