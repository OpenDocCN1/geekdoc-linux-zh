    build a Reboot image with the Martini name that has the functionality to operate
    the MBX evaluation board. This allows us to verify the build process using our
    new hardware package.


    To verify that our Martini package is present, we first need to launch the Configuration
    Tool. In the Configuration Tool, we can select our new Martini package using the
    Templates dialog. The Templates dialog is displayed by selecting Build -> Templates
