- img_proc: true
  md: '# The Host Development Platform


    This is the first of four chapters that covers the configuration of the host development
    platform, the eCos toolset, examples using the eCos system, and porting eCos.
    These chapters guide us through the steps necessary to configure the different
    components of the eCos development environment. At the end of these chapters,
    you will have a complete embedded software development environment and an understanding
    of how to build an application using the eCos system.


    To start, in this chapter, we get an overview of the main steps involved with
    configuring our host PC, focusing on setting up the tools needed to build eCos.


    Next, in Chapter 11, The eCos Toolkit, we proceed with the installation of the
    eCos configuration tools and the source code repository. This lays the foundation
    for building the eCos RTOS library.


    In Chapter 12, An Application Using eCos, allows us to put our tools to work by
    developing an application to run on our development system. We focus on the target-specific
    compiler and debugging tools. This chapter offers a basic example in which additional
    functionality and components can be added to develop a fully featured, embedded
    application.


    Finally, Chapter 13, Porting eCos, we look at the steps necessary to move eCos
    onto a new hardware platform. This chapter lays the foundation for getting eCos
    up and running on your own product.


    # 10.1 Overview


    The eCos development system is available on the Internet. In this chapter, we
    focus on setting up the eCos development system using the Net release since it
    is freely (no up-front costs to get started) available to everyone—provided that
    you abide by the license terms for each tool or program.'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'The CD-ROM accompanying this book contains all of the files needed to set up
    the eCos development environment described in this book. Links are given to show
    exactly where the files can be obtained online. Source code is provided for the
    executable tools contained on the CD-ROM. This is one method for satisfying the
    requirements of the GNU General Public License (GPL). The GPL (version 2) is contained
    in the latter part of Appendix B, eCos License, and can be found on:


    www.gnu.org/licenses/gpl.html


    The files on the CD-ROM have actually been used to set up the eCos development
    suite described in this book. These are open-source tools, which are constantly
    evolving and being updated.


    The readme file, Read.txt, included on the CD-ROM under the root directory contains
    additional information about the contents of the CD-ROM.


    > NOTE You might find that you need to use a newer version of a particular tool
    that incorporates specific features or bug fixes. Information on upgrading the
    Cygwin tools is provided in Appendix C, Cygwin Tools Upgrade Procedure.

    However, the general rule to follow concerning the tools is:

    If it ain''t broke, don''t fix it.

    Basically, if you installed your tool can accomplish all of your development tasks,
    it is best to leave the system in its current working state. Leave the upgrade
    for later when you have time to devote to it. Alternatively, configure and use
    a system other than your main development environment.


    The best approach for managing your tools is to get a stable working development
    platform using the tools provided on the CD-ROM. Prior to performing any upgrade,
    ensure that you leave yourself a backup (by backing up any necessary files) to
    restore your current working environment before proceeding with any upgrades.
    This will guarantee that you always have a functioning development environment
    to.


    The eCos development suite can be set up under two operating systems—Linux and
    Windows.


    The Windows configuration has been tested using Windows NT 4.0, although Windows
    2000, Windows XP, Windows 98, and Windows 95 can also be used.


    In this book, we use the Windows NT 4.0 (Service Pack 6.0a) operating system for
    your host development platform. You can find information on configuring the Linux
    operating system for eCos development on the eCos home page.'
  merge: -1
