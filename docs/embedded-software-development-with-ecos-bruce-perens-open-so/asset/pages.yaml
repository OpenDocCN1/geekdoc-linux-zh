    # ### 8.3.2 RAM File System


    The ECos file system purely uses RAM to store file data. Therefore, it does not
    permanently store the file system data because contents are lost when the system
    is reset. The RAM file system starts uninitialized with no files. It can then
    be used to store temporary data using the classic file system abstraction, for
    applications a file system, or it can be loaded with the contents of a ROM file
    system to provide a fully writable file system.


    The ECos RAM File System (CYGPFS_RAM) is located in the ram subdirectory. Figure
    1.3 in Chapter 1 shows the overall directory structure. The RAM file system, similar
    to the ROM implementation, uses a node to describe directories and files in the
    system.


    The node structure, ramfs_node, is defined in the file ramfs.c and includes the
    node type, size of the file in bytes, the last access time, and last file modification
    time. The RAM file system implementation contains two storage mechanisms, Simple
    and Block.


    The Simple mechanism uses the malloc and free routines to allocate memory for
    nodes and the file data. If the file data increases in size, memory is reallocated
    for file. This mechanism has the advantage of using only the amount of memory
    it needs to contain all files in the RAM file system. The Simple mechanism, as
    the name implies, is a straightforward approach. One disadvantage of this mechanism
    is fragmentation of the heap from constant real locations for files. This can
    lead to the inability of a file to grow because the file size might be larger
    than the amount of memory that can be allocated from the heap. Another disadvantage
    is that the malloc mechanism must be included in the ECos image.


    The Block mechanism divides file data into fixed-size blocks. The allocation for
    these blocks can be from a predefined array of blocks or using malloc and free.
    Data storage for each node, ramfs_node, is arranged in three arrays of pointers
    to the data block structure, ramfs_block. The number of arrays is set by configuration
    options, shown in Item List 8.3. Three arrays allow direct access, single-level
    indirect access, and two-level indirect access to the data blocks. Figure 8.2
    shows the three different data access arrays for an example file node with filename
    sys_info.txt.'
