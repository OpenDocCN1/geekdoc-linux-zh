  md: '# Other eCos Architecture Components


    His chapter details the other software components that are part of the core eCos
    architecture, including Timing components, Assert functionality, and Tracing functionality,
    and the I/O Control System. The timing components provide different mechanisms
    for periodic events and are comprised of counters, clocks, alarms, and timers.
    asserts and traces provide additional debug functionality so you can build robust
    embedded systems. Finally, the I/O Control System describes the I/O communication
    scheme and device driver support.


    # 7.1 Counters, Clocks, Alarms, and Timers


    Most architectures provide a clock or timer mechanism, typically a programmable
    register, which generates a periodic interrupt. This register is programmed with
    an initial value that determines how often the interrupt occurs. If the processor
    architecture does not support an onboard timer mechanism, the platform will have
    an external source for generating the periodic interrupt.


    eCos uses the hardware timer mechanism to drive its timing features, which consists
    of:


    +   * Counters

    * Clocks

    * Alarms

    * Timers


    The kernel uses these timing features to provide time-out, delay, and scheduling
    services for executing threads. Applications can use the timing features for specific
    timing-related needs as well.'
  merge: -1
