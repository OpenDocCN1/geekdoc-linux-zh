  md: "The kernel API contains interrupt control functions that make use of the macros.\
    \ Therefore, it is not necessary for an application to call directly into the\
    \ HAL; rather, it can use the kernel API to configure system interrupts. The HAL\
    \ and kernel interrupt control functionality is broken down into three groups:\n\
    \n+   * Interrupt Service Routine Management\n* Interrupt State Management\n*\
    \ Interrupt Controller Management\n\n> **NOTE** It is important to use the kernel\
    \ API functions and avoid using the HAL directly. Using the Kernel API guarantees\
    \ consistency over the underlying HAL macro implementations. An example of maintaining\
    \ consistency is when using the configuration option to chain interrupts together.\
    \ By going through the kernel API when attaching interrupts (`cyg_interrupt_attach`),\
    \ rather than directly using the `HAL_INTERRUPT_ATTACH` macro, the algorithm for\
    \ inserting the interrupt in the chain list is handled by the kernel API function.\
    \ This ensures that the interrupts are inserted into the list process each time.\n\
    \n# 3.2.1 Interrupt Service Routine Management\n\nThe first of the three groups,\
    \ Interrupt Service Routine Management, controls the attachment and detachment\
