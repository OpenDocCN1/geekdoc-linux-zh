  md: '# An Example Application Using ECos


    n this chapter, we get down to debug ECos and the development tools. The examples
    here detail one method for setting up a debug environment using RedBoot, building
    an eCos library, and then building an application that incorporates ECos. There
    are several different approaches to use to achieve a similar development and debug
    environment using different configuration options. These examples provide a straightforward
    method to achieving our goal: getting ECos up and running.


    We begin by building the RedBoot ROM monitor, which allows us to debug our application
    using GDB on our host development system. Next, we build an eCos library image
    for us to use with our application. Then, we build a simple application, which
    includes the eCos library image, to understand the process. Each of the examples
    in this chapter builds on the previous steps. After becoming familiar with the
    process, you will be able to tailor the build and debug procedure to meet your
    needs and development style.


    # 12.1 The ECos Build Process


    The main goal of the ECos build process is the generation of an eCos library.
    This library is called libtarget.a. Other target files are also generated, such
    as a linker script file, and in some cases, additional libraries may be generated.


    The RedBoot build process is slightly different than for ECos as a binary file
    is generated at the end of a RedBoot build, which is then installed on the target
    hardware.


    The ECos library build process uses makefiles and the GNU make utility to assist
    in generating the ECos library. The ECos build process involves three separate
    trees: source, build, and install. The source tree is the source code repository,
    which is located under the packages directory.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Chapter 12 • An Example Application using eCos


    The build tree is generated by the configuration tools and contains intermediate
    files, such as makefiles and object files. The structure of the build tree might
    differ between system builds. Typically, each package in the configuration has
    its own directory in the build tree, which is used to store that package''s makefiles
    and object files.


    The install tree consists of the eCos main library files and the exported header
    files, which are used when the application is built. The library files are located
    under the lib subdirectory, and the header files are contained under the include
    subdirectory. By default, the build and install trees are contained in the same
    working directory.


