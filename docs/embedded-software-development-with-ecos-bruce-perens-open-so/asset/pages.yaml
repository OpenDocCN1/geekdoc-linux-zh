    The next step is to modify the HAL initialization code for the new hardware platform.
    The main platform initialization code can be found in the assembly (.S) file located
    under the src subdirectory. In our example, this is the file martini.S. The routine
    hal_hardware_init contains the platform-specific code. The modifications necessary
    are dependent on the platform used as the baseline and the additional functionality
    needed for the new hardware platform.


    We also need to verify the initialization code in the other files such as hal_aux.c
    and hal_diag.c, also located in the src subdirectory. Other HAL platforms have
    additional source files that need to be verified. Additional information about
    the HAL startup process can be found in Chapter 2.


    Some areas of code to modify or comment out during this phase of the porting process
    are common across most platforms. These general modifications include configuring
    the processor registers such as the real-time clock, chip select, and interrupt
    control, which is accomplished in the routine hal_hardware_init.


    Another modification is to disable initialization and data caches, as well as
    the MMU if possible, since speed is not a concern at this point. In our example,
    we can prevent the caches from being enabled by defining the macro CYPGRI_ENABLE_CACHES
    found in the file plf_cache.h under the include subdirectory.


    We also need to make sure that the serial port initializes it appropriately for
    our new hardware platform. It is also a good idea to use a polling mode driver,
    rather than an interrupt driver. By using RedBoot, which uses only polling mode
    for serial communications, we have the proper communication functionality we need
    at this point in the porting process.


    In addition, the serial communication channel needs to be hooked into the communication
    interface table and virtual vector table. Detailed information about the communication
    interface table and virtual vector table can be found in Chapter 4, Virtual Vectors.
    The platform used as a baseline already hooked the necessary serial communication
    functions into the tables, in which case we need to verify the serial port is
    properly initialized.


    In our example, the new Merit platform has two ports whereas the MBX platform
    has only one. We need to initially get the serial port up and running and then
    add the second serial port of our new platform by adding packages we need to verify
    that the code operates as intended for our hardware.


    # STEP 6 Build the RedBoot Image for the New Platform


    We are now ready to build the RedBoot Image for our new Merit platform. The new
    platform is built by selecting RedBoot-> Library from the Configuration Table.
    The method and tools needed to load the image onto the new hardware platform are
    unique to the platform.


    +   1. This is just another reminder about the file extension for the assembly
    file. In this case, it is important that the extension of the assembly file is
    an uppercase "S" rather than a lowercase "s". The uppercase "S" allows the GNU
    C compiler to perform preprocessing on the assembly file.'
  merge: -1
  pgno: 351
- img_proc: true
  md: 'It might be necessary to use the GNU Utility objcopy to convert the file to
    a format that is required by the device programming tools. Additional information
    about the objcopy utility can be found online at:


    www.gnu.org/manual/manual.html


    After the RedBoot image is installed onto the new target platform, the board is
    reset to boot the new software. If RedBoot initializes and runs successfully,
    the initialization message is output on the serial port, similar to the message
    shown in Code Listing 9.1 in Chapter 9. If this message is not received, it is
    necessary to verify the changes made for the new target platform.


    At this point, your embedded debugging skills come into play. Toggling an I/O
    port pin (possibly connected to an LED) to track the progress is great for low-level
    debugging through assembly files.


    # STEP 7 Additional Functionality


    Once the RedBoot image is up and running on the new hardware, additional functionality
    can be added to the configuration. Some of these additional features Might include
    adding a reset, which can be implemented in software or using a hardware watchdog.


    Testing to make sure the single-step process, which should already be present
    in the HAL, is operating properly can be useful using GDB to step through code.
    Enabling the cache for the processor, if is present, is another feature to add
    that can enhance program speed.


    # 13.2.2 Porting Hints


    Here are some hints that can come in when performing your eCos port:


    +   * Start with the smallest amount of code possible to get a minimal RedBoot
    image running on your new platform. Having too many packages increases the amount
    of code in the initial image, as well as the possibility of encountering problems.
    Functionality can be added after the hardware has some basic features up and running.

    * Stay up to date with the eCos source code. Tracking the changes made to the
    platform you use as your baseline for the port is crucial because bug fixes might
    be incorporated that you need to take advantage of.

    * Various hardware tools, such as an ICE or BDM, can speed up the debug process
    by giving you visibility into the processor''s operation.

    * As mentioned previously, when low-level assembly debugging is necessary, toggling
    an I/O pin to track the progress through the software can be very helpful.

    * A trace buffer, or trace messages output, is useful in tracking a variable''s
    value or other information during execution of the software.

    * Assertions can be used to expose bugs or missing features in the software. Assertions
    are disabled by default in eCos configurations.

    * Using the test applications included in the eCos framework can divulge problems
    with your target platform.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# 13.3 Summary


    In this chapter, we went through the procedure for porting eCos to a new platform.
    We started with getting eCos noticed by the Configuration Tool so that we could
    build our new hardware platform image. We then looked at some of the modifications
    that might be necessary to get eCos running on new hardware.


    Although the exact steps necessary for bringing up eCos on a new hardware platform
    are unique to that particular hardware, this porting example gives us a basic
    understanding of the procedure. Finally, we finished the chapter with some hints
    that can be used to aid in porting eCos.


    # Reference


    Ganssle, Jack. "ICE Technology Unplugged." *Embedded Systems Programming* (October
    1999): 103.'
  merge: -1
