  md: 'After the steps in Chapter 10, a complete open-source embedded software development
    environment is configured.


    We go through examples of building RedBoot, the eCos library, and an application
    in Chapter 12. Rather than requiring a specific development board to run the examples,
    a second PC is needed for the target platform. This is a better approach to becoming
    familiar with the development tools since it''s typically easy to find a spare
