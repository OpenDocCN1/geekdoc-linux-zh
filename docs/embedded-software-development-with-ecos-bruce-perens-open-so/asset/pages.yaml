    # 6.1.1 Thread Stacks and Stack Sizes


    As learned from the example shown in Code Listing 6.1, the application is responsible
    for providing the stack for a thread, which is used for local variables and tracking
    function calls and returns. The stack is typically in the form of static data
    to eliminate the dynamic memory allocation functionality in the kernel.


    It is important to understand the size requirements for a given thread so an accurate
    stack size can be created. This eliminates wasting memory if the stack size is
    too large, or avoids overflowing if the stack size is too small for the thread.
    Stack overflowing can be a very difficult problem to track down.


    The stack size depends on a number of factors, which are determined by the characteristics
    of the code executed by the thread. For example, nesting function calls or large
    arrays might require larger stack sizes for a given thread.


    There are also configuration options that can have an effect on a thread''s stack
    usage. The interrupt configuration option Use Separate Interrupts, when disabled
    allows interrupt handlers to use a thread''s stack during execution. The interrupt
    configuration option Nested Interrupts can compound the problem when enabling
    higher priority interrupts to occur during execution of another interrupt, requiring
    additional stack size. Additional information about the different interrupt configuration
    options and issues related to a thread''s stack are in Item List 3.5 of Chapter
    3, Interrupts and Interrupts.


    The HAL defines two macros that can be used by an application as reasonable sizes
    for a thread''s stack. The values for these macros vary among the different processor
    architectures. These two macros are typically defined in the HAL in the hal_arch.h,
    which gives an explanation of how the values were derived for a particular architecture.


    The first macro is CYGNM_STACK_SIZE_MINIMUM. A thread with this size is appropriate
    for threads that run a single function and make simple system calls. It is illegal
    to attempt to create a thread with a stack smaller than this value.


    The other macro is CYGNM_STACK_SIZE_TYPICAL. This value is appropriate for a thread''s
    stack size when nested function execution is limited to approximately six times
    with no large arrays on the stack.


    The kernel provides control, by configuration options, which can help detect stack
    overflows. Additional information about these and other kernel thread configuration
    options can be found in Item List 6.1.


    One configuration option is Check Thread Stacks For Overflows. When this option
    is enabled (the default case for a debug build), a small amount of space at the
    stack limit'
