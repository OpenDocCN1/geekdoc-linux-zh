  md: '# 12.6 The ECos Tests


    The ECos repository provides test suites for various packages. The tests are designed
    to thoroughly exercise the various functionality within the different packages
    to ensure proper operation. These tests execute at the module, component, and
    system levels and include stress and performance testing.


    The ECos repository includes tests for the kernel, various device drivers, and
    the I/O Sub-System. The kernel includes tests that exercise the different synchronization
    mechanisms, various thread-related functions, and use the different lock functionality.
    The I/O Sub-System includes various serial port tests. There are also tests for
    the different target hardware platforms.


    The test source code is contained in the ECos source repository and located under
    the tests directory within a package''s directory structure; see Figure 11.1 for
    an illustration of the generic directory structure. The test source code provides
    a great example of how to implement functionality within an application. These
    tests can be used to guide you through understanding the different ECos APIs.


    Now let us focus on how we use the Configuration Tool to build and run tests in
    the ECos framework. The tests are built using the Configuration Tool by selecting
    Build -> Tests. The output files from the test procedure are located in the install
    tree under the tests directory. The output files are ELF format files.


    > NOTE Some tests, such as those included in the Basic Networking work package,
    contain a configuration option that must be enabled to build the specific tests.
    The Build Networking Tests (Demo Programs) (CYPOS_NET_BUILD_TESTS) configuration
    option, when enabled allows additional networking tests to be built.


    After the tests are built, the Configuration Tool facilitates downloading and
    running the tests on the target hardware. To run tests using the Configuration
    Tool, Tools -> Run Tests. This brings up the Run Tests dialog as shown in Figure
    12.14.


    The first tab, Executables, displays all of the tests that are available for running
    on the target hardware. Checking the box to select the tests for running. Tests
    can be added or removed using the buttons at the bottom of the dialog box. Once
    the tests are configured to run, the Run button at the bottom of the dialog begins
    execution of the selected tests.


    The next tab is Output. It displays output from the tests as they execute on the
    target hardware. The Summary tab keeps track of the results of each test, including
    the time it took to execute and the status as to whether the test passed or failed.


    Prior to running the tests, the method for connecting to the target hardware is
    selected. Clicking the Properties button at the bottom of the Run Tests dialog
    brings up the Settings dialog box as shown in Figure 12.15.'
  merge: -1
