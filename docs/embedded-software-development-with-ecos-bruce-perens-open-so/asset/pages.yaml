  md: '# PowerPC HAL Directory and File Structure


    Let''s take a closer look at the PowerPC HAL directory structure focusing on the
    Motorola MBX860 platform. We need to know the location of the files and subdirectories
    that contain the functionality for the MBX platform. Figure 13.2 shows the relevant
    HAL directories for the Motorola MBX60 platform. The version subdirectories are
    left out in Figure 13.2; we are using the current version in other. Other HAL
    platforms have similar directory structures.


    The subdirectory common contains the package configuration files general to all
    HAL architectures, including files for generic interrupt configuration, virtual
    memory layout, and HAL debugging control. Function wrappers are contained in this
    subdirectory to create commonality among all HAL implementations.


    The arch subdirectory is located under the powerpc architecture HAL directory
    and includes files for generic support for the PowerPC processor. Functionality
    included in this generic support consists of exception initialization, ROM and
    RAM startup configuration, common exception and exception handling, thread context
    switching, a generic linker script file, and debugging functions.


    The mbx subdirectory contains the Motorola MBX860 source files. The description,
    in CDL script format, of the MBX package is in the file hal_powerpc_mbx.cdl located
    in the cdl subdirectory.


    The include subdirectory contains all header files for the MBX platform. Under
    the include subdirectory is the pkgconfig package which is where the memory layout
    files are located.


    The misc subdirectory includes RedBoot minimum configuration files that can be
    imported into the Configuration Tool to establish a baseline of configured options
    and packages.


    The subdirectory src contains the main source assembly, mbx.S, for the MBX platform.
    This file contains the hardware setup code in the routine hal_hardware_init, which
    configures all necessary processor registers, and initializes the chip set configuration
    for the MBX platform. The tests subdirectory contains tests for the MBX platform.


    The mpc86x and quiec subdirectories are used because they are variants of the
    MPC860 architecture used by the MBX platform. We need to be aware of the variants
    used by the platform we are using as a baseline in case we need to modify or extend
    the support offered in the variant packages.


