    new Martini. We need to edit the .h and .ldi files to match the memory on the
    new hardware platform. The .mlt files are used by the Configuration Tool to store
    the graphical information for the memory layout. There are two sets of memory
    layout files, one for RAM startup and one for ROM startup.


    Initially we can edit these files. After the code is up and running on our new
    platform, it is best to use the Configuration Tool Memory Layout window, as described
    in Chapter 11 for changes to the memory structure. The memory layout editor is
    currently only in version 1.3 of the Configuration Tool. Version 2 of the Configuration
    Tool does not have the capability to edit memory configurations.


    It is helpful to have the GNU linker documentation when editing these files. The
    documentation describes all of the linker script commands that are defined in
    the memory layout. The online site for GNU linker (ld) is:


    www.gnu.org/manual/manual.html


