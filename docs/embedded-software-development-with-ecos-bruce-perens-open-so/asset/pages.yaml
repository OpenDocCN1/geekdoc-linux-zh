    value is 8.


    # Priority Level for Background Network Processing


    **Option Name** CDL

    **CDL Name** CYGPKG_NET_THREAD_PRIORITY


    **Description** Sets the priority level of the background networking thread. The
    default priority level is 7.


    # Priority Level for Fast Network Processing


    **Option Name** CDL

    **CDL Name** CYGPKG_NET_FAST_THREAD_PRIORITY


    **Description** Sets the priority level of the fast network thread. This priority
    level should be higher than the background networking thread. The default priority
    level is 6.


    # Fast Network Through Tickle Driver


    **Option Name** CDL

    **CDL Name** CYGPKG_NET_THREAD_TICKLE_DEVS


    **Description** Allows the network thread to tickle the network driver due to
    a hardware problem as a lost interrupt. Attempting to send a packet allows the
    driver to become unlocked. This option is necessary for protocols that exchange
    keep-alive packets periodically, such as TCP. A subset sets the delay (in kernel
    ticks) to wait before sending the packet. The default is enabled with a delay
