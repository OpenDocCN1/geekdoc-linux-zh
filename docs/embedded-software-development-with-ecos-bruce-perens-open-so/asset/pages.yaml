    # 8.6.3 lwIP


    There is a network stack contribution called Lightweight TCP/IP (lwIP), which
    is basically a small memory footprint implementation of the TCP/IP protocol suite.
    The focus of the lwIP implementation is to provide full TCP/IP support while reducing
    the necessary memory footprint. lwIP supports IP, ICMP, UDP, and TCP and is available
    under a BSD-style license. Additional information about the lwIP contribution
    can be found online at:

    www.sics.se/~adam/lwip


    # 8.6.4 Networking Threads


    The eCos networking uses threads to accomplish particular tasks. It is important
    to understand what networking threads are running in the system to determine the
    resources needed when using the networking stack.

    it is also necessary to keep the thread priorities in mind when designing the
    overall thread priority scheme to ensure adequate network performance is achieved.
    Certain threads can be enabled or disabled via the Basic Networking configuration
    options or under the specific stack implementation, OpenBSD or FreeBSD, and the
    configuration options used to set the specific priority level.


