    # 11.2 Ecos Repository Database


    The Configuration Tool uses the ecos repository database to understand the components
    within the repository. The descriptions of the packages in the repository database
    are contained in the file ecos.db, which is located on D:\packages subdirectory
    in our installation. This file uses the CDL to describe all packages and targets
    in the database.


    The Configuration Tool needs to know the location of this file, and the entire
    repository. The Configuration Tool searches for the component repository by first
    using the most recently used repository location, then by using the default location
    setup by installation, and finally, by whatever path you select. The component
    repository location should already be configured from our installation.


    If you needed to change the location of the component repository, you could do
    so by selecting Building->Repository from the menu bar. This brings up a dialog
    box that allows you to browse to the new location of repository.


    We can see an example of the relationship between the repository database file,
    ecos.db, and the Configuration Tool in Figure 11.9. In 11.9, the CDL package description
    for the ecos HAL is shown along with the Configuration window, the Properties
