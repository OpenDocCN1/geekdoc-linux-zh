    # 8.3 File Systems


    eCos provides three different file systems: ROM, RAM, and JFFS. JFF2 Allocation
    (FAT) is also being developed.

    The Journaling File System version 2 (JFS2) is a log-structured file system for
    embedded systems containing flash devices.


    Both the ROM and RAM file systems use the POSIX File I/O Layer (CYPEGK_IO_FILEIO)
    package. The POSIX package provides control over the file systems installed and
    can be found in the fileio subdirectory under the IO Sub-System. The POSIX package
    contains a file system table containing entries from each installed file system.
    The entries in this array are of the type cyg_fatstab_entry, defined in the fileio.h.
    Each entry contains information about the file system, such as the name that might
    have a value of "romfs" for a ROM file system. Also included with each entry are
    pointers to functions that control directories and files; for example, make directory,
    romfs_mkdir, and change directory, romfs_chdir. The maximum number of installed
    file systems is controlled by a configuration option, as shown in Item List 8.2.'
