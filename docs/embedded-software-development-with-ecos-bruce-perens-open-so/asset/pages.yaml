    \ called spinlocks. The other synchronization mechanisms work as well as SMP systems.\
    \ Additional information about SMP support within eCos can be found in Chapter\
    \ 8, Additional Functionality and Third-Party Contributions.\n\nA spinlock is\
    \ basically a flag that processor can check before executing a particular piece\
    \ of code. If the spinlock is not locked, the processor can set the flag and continue\
    \ executing the thread. If the spinlock is locked, the thread spins in a tight\
    \ loop continuously checking the flag until it is released. Spinlocks operate\
    \ at a lower level than other synchronization mechanisms and the implementation\
    \ is hardware specific. Some processors offer a test-and-set instruction for implementing\
    \ a spinlock.\n\nThreads that do not acquire a spinlock are not suspended; therefore,\
    \ it is important that spinlocks are held for a short period of time, typically\
    \ on the order of 10 or 12 instructions. Understanding the consequences of using\
    \ a spinlock is important. For example, since a processor acquires a spinlock\
    \ that it does not get preempted. This could cause another processor to wait for\
    \ a timescale period or longer for the spinlock. To avoid this, the kernel spinlock\
    \ API, as shown in Item List 6.9, provides a function to disable interrupts on\
    \ the processor where the thread is executing.\n\n> NOTE Spinlocks should only\
    \ be used in SMP systems and are not appropriate for single-processor systems.\
    \ The problems of using spinlocks on a single-processor system are illustrated\
    \ in an example. Let's take the case where a high priority thread attempts to\
    \ acquire a spinlock held by a lower priority. The high priority thread waits\
    \ forever waiting for the lower priority to release the spinlock. However, since\
    \ the lower priority thread never gets a chance to run, it can never release the\
    \ spinlock; hence, a deadlock arises. A deadlock scenario could arise if an interrupt\
