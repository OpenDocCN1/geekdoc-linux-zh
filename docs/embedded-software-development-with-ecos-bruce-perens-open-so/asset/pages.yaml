    # 8.6 Networking Support


    Internet connectivity for embedded devices is quickly becoming a standard requirement.
    From Internet Applications to remote sensor controllers, the ability to send and
    receive data over the Internet, or a private network, is becoming standard. The
    core to this connectivity is the network stack. Figure 8.3 shows a general architecture
    diagram of the protocols supported by the eCos Networking package.


    ![](img/185e30b232edb8183f2482fa0071447a_185_0.png)


    **Figure 8.3** eCos general networking architecture.


    Networking stacks use several different protocols for communication. For example,
    the Simple Mail Transfer Protocol (SMTP) is used to send and receive email. The
    eCos Networking package incorporates the frequently used standard protocols for
    network communication. Using these protocols, a wide range of application layer
    components can be developed, such as a mail'
  merge: -1
