    # 7.4.2 Device Drivers


    A device driver is a piece of code that controls a specific hardware component.
    ECos device driver design focuses on efficiency, eliminating unnecessary layering.
    It is the job of the device driver to isolate and encapsulate the component-specific
    implementation. This allows the I/O Sub-System to present a standard interface
    to higher-level software modules using the I/O table.


    The I/O table is a structure defined as cyg_dev_table_t in the file devtab.h.
    This structure defines read, get configuration, and set configuration functions
    for accessing device drivers. The device I/O table is initialized by the cyg_io_init
    function, which is defined in iys.c. This function is called by the HAL startup
    along other constructors. In each turn, the device driver initialization function,
    defined in the driver''s I/O table entry, is called.


    For example, when an application needs to output a text message on a serial port,
    the application calls the I/O Sub-System API function, which uses the appropriate
    device driver to manage the hardware for transmission on the serial line. The
    application does not need to be aware of any hardware-specific details, such as
    the registers to program in order to transmit a character over the serial port.
    Using separate device drivers in this manner allows the software to be portable
    across different hardware platforms because the higher-level application code
    is not dependent on the specific hardware implementation. The modular approach
    also eases the understanding and debugging of the software.


    A device IO table describes ECos device drivers. This structure, cyg_devtab_entry_t
    located in the file devtab.h, defines the device name, device name layered below
    (if applicable), a pointer to the device I/O table handler functions, the device
    initialization function, the device I/O table lookup function, and a placeholder
    for device specific data.


    With along the standard controls supplied by the device driver, additional functions
    are provided that are specific to the type of device supported. The device driver
    also contains the ISR and ISR functions for the device it manages.


    Device drivers use an API for interacting with the kernel the HAL. The function
    parameters and definitions are the same as the non-specific kernel API functions,
    which do not contain _drv_ in the function name. The cyg_drv_isr_lock and cyg_drv_isr_unlock
    functions are defined the same as the cyg_interrupt_disable and cyg_interrupt_enable
    functions, respectively. The function cyg_drv_scheduler_lock is defined the same
    as cyg_scheduler_lock, and cyg_drv_csr_unlock is defined the same as cyg_scheduler_unlock.'
