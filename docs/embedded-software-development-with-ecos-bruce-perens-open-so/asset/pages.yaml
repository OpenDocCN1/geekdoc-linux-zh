    # 7.1.1 Counters


    The first eCos feature is a counter. A counter is an abstraction, which maintains
    an increasing value by a source of ticks. The source of the tick does not have
    to be from a hardware device, nor does the tick need to be periodic. However,
    it is up to the owner of the counter to ensure that the counter object is ticked.


    eCos offers two implementations of the counter object. The first implementation
    uses a single linked list for maintaining alarms attached to counters. When a
    tick occurs, the kernel goes through this linked list, usually at the DR level.
    Therefore, if there is a sizable number of alarms attached to a single counter
    object, the system dispatch latency is affected.


    The second implementation uses a table of linked lists for maintaining alarms
    attached to counters, allowing the size of the table to be set by a configuration
    subsection. This can improve the responsiveness of the kernel because only one
    list is searched per tick; however, extra code and data are required. The counter
    configuration options are described in Item List 7.3.


    # Item List 7.3 Counter Configuration Options


    | Option Name | Implement Counters Using a Single List |

    | CDL Name | CYGNIMP_KERNEL_COUNTERS_SINGLE_LIST |

    | Description | Uses a linked list for maintaining alarms. This is a more efficient
    use of memory when a small number of alarms are used in the system. The default
    setting for this option is enabled. |


    | Option Name | Implement Counters Using a Table of Lists |

    | CDL Name | CYGNIMP_KERNEL_COUNTERS_MULTI_LIST (Wait, checking text...) CYGNIMP_KERNEL_COUNTERS_MULTI_LIST
    |

    | Description | Uses a table of linked lists for alarm objects. This reduces the
    amount of computation necessary when many timers are triggered, which is useful
    when many alarms are used in the system. This option is disabled by default. When
    using a table of lists the Size of Counter List Table, which has a default value
