    # 10.2.2 Installing the Platform-Specific Cross-Development Tools


    Next, we will install tools that allow us to build eCos and our applications for
    our specific processes; in our case, the Intel x86. The cross-development tools
    are used to build the eCos library for our specific platform; in our case, the
    Intel x86. We also use these tools when building applications, as we see in Chapter
    12.


    Rather go through the procedure of configuring and building the i386 GNU-development
    tools, pre-built tools are supplied on the CD-ROM. This eliminates the possibility
    of generating incorrect GNU tools, which is very easy considering the command
    strings that need to be edited. These tools are used in the examples included
    with this book. The procedure used to configure and build the GNU cross-development
    tools is contained in Appendix D, Building the GNU Cross-Development Tools.


    > Pre-built binary versions of the PowerPC GNU cross-development tools are also
    included on the CD-ROM in the file ppgnutools.tar.bz2 under the gncpptools directory.
    These tools are used in Chapter 13.


    The platform-specific cross-development tools can be broken down into three different
    groups:


    +   * GNU Binary Utilities (commonly called binutils)

    * GNU C/C++ Compiler

    * GNU Insight Debugger with Insight Interface


    The file needed to install the GNU cross-development tools is located on the CD-ROM
    under the gnu subdirectory and is called i386gnutools.tar.bz2. The versions we
    are using of the GNU cross-development tools are shown in Table 10.2.


    Table 10.2 GNU Cross-Development Tools Versions

    | Tool | Version |

    |---|---|

    | GNU Binary Utilities | 2.11.2 |

    | GNU C/C++ Compiler | 2.95.2 |

    | GNU Debugger with Insight Interface | 5.1 |'
