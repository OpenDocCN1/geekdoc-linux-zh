  md: 'NOTE Prior to using templates for different hardware architectures you must
    make sure that the platform-specific cross-development tools have been built for
    the hardware architecture you have selected. You must also make that the appropriate
    cross development tools are selected from the Tools -> Path -> Build Tools in
    the Configuration Tool.


    The Config tool will display errors if you try to configure and build the library
    with the wrong cross-development tools installed. The installation of the cross-development
    tools is covered in Chapter 10.


    The templates dialog box allows the selection of a combination of hardware and
    package templates. The hardware templates are defined in the eCos database, eCos.db,
    using CDL script commands. The hardware template is selected from the drop-down
    list in the Templates dialog box under the Hardware label.


    Beneath the drop-down list is a brief description of the target platform selected.
    The hardware template ensures that the packages are loaded into the Configuration
    Tool for a particular platform, including HAL, I/O, and device drivers. There
    is a hardware template in the drop-down list for each of the supported platforms
    supported by eCos, as shown in Appendix A, Supported Processors and Evaluation
    Platforms.


    The package templates are generic across all hardware platforms and are defined
    under the templates subdirectory under the D:\packages directory. The package
    template is also selected from a drop-down list under the Packages label in the
    Templates dialog box.


    Next to the package template list is a drop-down list that allows you to select
    the version of the package template to load. In this case, the current template
    version is selected.


    A brief description of the package template selected is located beneath the drop-down
    lists Clicking the Details button displays a scroll list of the packages that
    are contained in the package template, as shown in Figure 11.10.


    Each package template subdirectory containing a file named current.ent, as well
    as a Changelog file. You can generate your own package template files, which can
    be useful if you need to change different versions of various packages. Before
    the new package template is noticed, the Configuration Tool needs to be restarted.
    The package template files included with eCos are defined in Table 1.2 in Chapter
    1.


    # 11.2.4.1 Conflicts and Resolutions


    When templates are loaded into the Configuration Tool, sometimes conflicts arise
    between different components and configuration options. When and how conflicts
    are displayed depends on the settings selected under the Tools -> Options menu.
    This allows you to check for conflicts after any item is changed, before saving
    and building, or never.


    When the conflict option Automatically Suggest Fix is selected, a dialog box is
    displayed when a conflict arises by the Configuration Tool, similar to the one
    shown in Figure 11.14, which allows you to resolve the conflicts before proceeding
    the setup.'
