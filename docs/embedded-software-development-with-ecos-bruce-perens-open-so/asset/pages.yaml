- img_proc: true
  md: 'A description of each step numbered in the HAL startup process shown in Figure
    2.3 follows:


    +   1. The starting point for the startup is after a power cycle occurs, labeled
    Hardware Powerup. This startup process also applies for a soft reset startup.


    +   2. After a hard or soft reset occurs, the processor jumps to its reset vector
    (cleverly reset_vector in the diagram). The reset vector is found in the file
    vectors.S under the arch for each HAL architecture. This file contains the starting
    point for all HAL packages. The reset vector performs the minimum processor register
    configuration to allow the system to continue with the initialization process.


    +   3. Next, the reset vector jumps to _start. This is also found in vectors.S
    and the main starting point for all HAL initialization.


    +   4. Next, the routine hal_cpu_init is called, which is located in either variant.inc
    or arch.inc depending on the architecture. This function handles processor-specific
    registers, such as disabling instruction and caches, to ensure that the processor
    is in a known state for the remainder of the initialization process.


    +   5. The next routine called is hal_hardware_init. The functionality contained
    in this routine is platform specific and therefore found in the platform assembly
    file (for the Motorola MBX board, which is the mbx.s file). Hardware setup in
    this routine includes configuration, setting interrupt registers to a default
    state, disabling watchdog, setting real-time clocks registers, and configuring
    chip select registers based on the platform-specific hardware.


    +   6. The next step is to set up an interrupt stack. This reserves a storage
    area for saving processor information when an interrupt occurs. The amount of
