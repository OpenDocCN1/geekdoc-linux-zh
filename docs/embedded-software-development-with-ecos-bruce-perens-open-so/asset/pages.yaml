    # 2.1.2 HAL Macro Definitions


    The HAL defines macros that have a common API for encapsulating the processor-specific
    implementation functionality. The HAL macros are used to control the interrupt,
    cache, memory management, IO, diagnostics, debugging, and architectural features
    for the processor, given that the processor provides the functionality. This section
    gives a general overview of these HAL macros and their location within the HAL
    architectures. Additional detailed descriptions of the HAL macros containing specific
    functionality (e.g., interrupt, and clock macros) are described in their associated
    chapters.


    Generally, HAL macros are enclosed within #ifdef to allow the macro to be overridden
    within the platform or variant submodules. Code Listing 2.3 shows an example of
    this.


