    # 3.2.3 Interrupt Handling


    An interrupt is a type of exception that can be found in a processor''s exception
    table. As men-

    tioned previously, different architectures support interrupts in various methods;
    however, eCos

    provides a standard method for handling HAL architectures. The ARM

    architecture is the exception that deviates from the standard eCos interrupt handling
    model.


    The eCos interrupt handling mechanism, in this section, can be bypassed by

    installing a service routine in the VSR table directly from the application layer.
    The appli-

    cation then solely responsible for implementing, in assembly language, all support
    that

    otherwise have been provided by the HAL default interrupt VSR, as storing and
    restoring

    the processor''s current state after the interrupt has been served.


    We are going to take a look at the default configuration when the HAL default
    interrupt VSR

    is used. The HAL default interrupt VSR for the different architectures are shown
    in Table 3.2.

    Figure 3.2 illustrates the execution flow of the eCos interrupt handling method.
    This figure

    shows the level--application, kernel, and HAL--responsible for executing each
    piece of code.


    Table 3.2 Default Interrupt Vector Service Routines


    | Architecture | Default Interrupt Vector Service Routine |

    | --- | --- |

    | CalmRISC16  | __default_irq_vsr and __default_fig_vsr |

    | Fujitsu FR-V | __interrupt |

    | i386 (including Synth), PowerPC, SuperH | cyg_hal_default_interrupt_vsr |

    | Hitachi H8/300, MIPS, MN10300 | __default_interrupt_vsr |

    | V8x | do_interrupt |

    | SPARC, SPARClite | hal_default_interrupt_vsr |


    ª The CalmRISC16 processor contain two default exception routines, for a swi exception
    and one

    a trace exception.'
