    # 8.7 SNMP Support


    SNMP is the standard for the exchange of management information between network
    devices. SNMP uses simple requests and responses to communicate management information
    about a particular device on a network. A management application runs on a remote
    system that controls the SNMP agent, which runs on the device. SNMP uses UDP at
    the transmission layer. Management Information Base (MIB) contains information
    and statistics for each device in a network. The MIB is constantly updated to
    keep track of the current status of the networked device. The SNMP agent accesses
    the MIB to fulfill the management requests.


    The eCos SNMP package is part of the UCD-SNMP version 4.1.2 code base. The UCD-SNMP
    implementations are done at Carnegie Mellon University and University of California
    at Davis. This code base has been transformed into Net-SNMP, which is managed
    by Source-Forge. Additional information about the original SNMP code base can
    be found online:


    ```

    http://snmp.sourceforge.net

    ```


    This site contains additional SNMP tools, including a tool to request or get information
    from SNMP agents, a tool to generate and handle SNMP traps, and a graphical Perl/Tk/SNMP-based
    mib.


    eCos SNMP is supported in two packages, the agent and library. The SNMP package
    is arranged in this manner to remain consistent with the original UCD-SNMP implementation.
    The separation of packages also allows an eCos client application to use the SNMP
    library without including the agent package.


    The agent contains agent-specific headers that allow a remote manager to manage
    the device. The library contains the code for formatting packets with the SNMP
    protocol and uses Abstract Syntax Notation (ASN). The library supports SNMP version
    2 and contains security and authentication aspects of version 3. The database
    information is a MIB-II compatible.


    The eCos SNMP packages are located in the SNMP subdirectory under the net subdirectory.
    The SNMP agent (CYPGK_SNMP) package is contained in the agent subdirectory, and
    the SNMP library (CYPGK_SNLIB) is in the lib subdirectory. The SNMP package requires
    the inclusion of the Networking package.


    The agent contains a single thread, snmp located in the file snmp.c, which is
    initialized in the routine cyg_net_snmp_init. The tasks run at a priority level
    that is lower than the background network network task (CYPGK_NET_THREAD_PRIORITY).
    The application must call the cyg_net_snmp_init function, located in the file
    snmptask.c, to start the SNMP agent.'
