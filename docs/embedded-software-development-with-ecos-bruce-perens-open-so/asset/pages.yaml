  md: '# User Interface and Command Set


    +   * Delete (0x7F) and Backspace (0x08) erase the previous character.

    * Period (.) (0x2E) halts the editing of a command, leaving the current item unchanged.

    * Caret (^) (0x5E) is used as an arrow for commands, as fconfig goes through a
    list of parameters to set.

    * Dollar ($) (0x24) switches RedBoot in GDB stub mode. The GDB stub controls and
    waits for a connection from a GDB host. To get out of GDB stub mode, a disconnect
    message is sent from the GDB host or by a reset of the target.

    * Return (0x0D) leaves the value for a parameter unchanged.


    RedBoot generates error messages when commands are entered incorrectly or invalid
    switch is omitted by mistake. In the following example, the dump command is entered;
    however, the -b switch causing RedBoot to generate the error message we see on
