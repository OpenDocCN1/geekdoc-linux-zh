    # 8.6.7 DNS Support


    Domain Name System (DNS) is a standard that allows resolution of domain names
    into IP addresses. For example, instead of typing 209.249.29.67 into your browser
    to visit a particular site, you can type in sources.red.com and your browser is
    directed to the appropriate Web site. It is easier to remember the domain name
    rather than an IP address. DNS handles the translation from domain name to IP
    address.


    The DNS Client (CYPKG_NS_DNS) package is included by default when either the net
    or new_net templates are used. Otherwise, the package can be added separately
    using the ECos configuration tools. The DNS client source code is located in the
    dns subdirectory under the net subdirectory


