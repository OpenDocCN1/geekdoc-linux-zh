    status and control, which might meet the needs of many embedded devices. Additional
    information about the working stack, including the networking stacks API, can
    be found online at:


    http://sources.redhat.com/ecos/docs.html


    Several sources are available that detail the different protocols commonly used
    for network communications. One good source is the TCP/IP Illustrated, Volume
    1: The Protocols by W. Richard Stevens.


    Another source for detailed information about Internet protocols is the Request
    For Comments repository. RFCs are documents that set standards for the Internet
    community. Several sites are available by browsing through these, one RFC site
    is:


    www.ietf.org/rfc.html


    There is a Basic Networking Framework package provided with eCos for networking
    support. This Basic Networking Framework package is modular, which allows the
    selection of the actual stack implementation as a configuration option. There
    are two different network stack implementations. One is adapted from OpenBSD and
    the other from FreeBSD.


    # 8.6.1 OpenBSD


    The first implementation is derived from the OpenBSD networking code. OpenBSD
    is a UNIX-like open-source operating system project posted on 4.4BSD source code.
    Various components are incorporated in the OpenBSD project, including a networking
    stack. Additional information about OpenBSD can be found online at:


    www.openbsd.org


    The protocols supported in the OpenBSD implementation are:


    +   * IPv4—Internet Protocol version 4

    * ARP—Address Resolution Protocol

    * RARP—Reverse Address Resolution Protocol

    * ICMP—Internet Control Message Protocol

    * UDP—User Datagram Protocol

    * TCP—Transmission Control Protocol

    * DHCP—Dynamic Host Configuration Protocol

    * BOOTP—Bootstrap Protocol

    * TFTP—Trivial File Transfer Protocol


    In addition, the OpenBSD implementation also supports raw packet interface. There
    are other features supported, but untested, by the OpenBSD network stack. These
    other features include:'
