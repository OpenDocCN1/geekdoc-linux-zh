    Although GNU cross-development tools binary files are included on the CD-ROM for
    the Intel x86 and PowerPC processor architectures, the instructions for configuring
    and building the GNU cross-development tools for other processor architectures
    are provided in Appendix D, Building the GNU Cross-Development Tools.


    The embedded development tools are installed, and examples are built, on a Windows
    development system. However, the necessary files to get an embedded software system
    up and running on a Linux system are included on the CD-ROM. Since the eCos configuration
    tools are able to run on both Linux and Windows, for building and running the
    examples applies to both operating systems.


    The CD-ROM accompanying this book contains the files needed to set up the complete
    embedded software system for eCos as detailed in Chapter 10. The examples in Chapters
    12 and 13 are also contained on the CD-ROM under the examples directory.


    A website is available to download the source code and updates. The site is located
