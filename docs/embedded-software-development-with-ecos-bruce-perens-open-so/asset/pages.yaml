  md: '# ISO C and Math Libraries


    configuration option. The HAL diagnostic device uses a polling mode for communication.
    This means that output can be slow especially when communicating with a GDB host,
    which involves utilizing the GDB remote protocol. Input can be processing intensive,
    meaning that threads might not have an opportunity to run.


    For better performance, an interrupt driver should be used. Enabling the proper
    hardware driver, such as `/dev/tty0`, using the Hardware Serial Device Drivers
    (CYPGK_IO_SERIAL_DEVICES) configuration package and then layering a TTY-driver,
    such as `/dev/tty0`, over the hardware device driver accomplishes this. The TTY-Mode
    Serial Device Drivers (CYPGK_IO_SERIAL_TTY) configuration package controls the
    TTY-drivers. The serial drivers are located under the Serial Device Drivers (CYPGK_IO_DEVICES).
    The Default Console Device configuration option is then set to use `/dev/tty0`.
    The serial and TTY device driver names may vary based on the hardware-platform.


    It is not possible to receive console input when using GDB to debug an application;
    for example, using scanc. Instead, either GDB should not be used or a different
    HAL diagnostic device needs to be used for communication.


    The source code for the ISO C library package is found under the subdependency
    languages\clibc. The math library source code is found under the languages\clilibm
