    There is also a mechanism for obtaining the kernel state using the CYG_TRACE_DUMP
    macro, which is also defined in the file cyg_trac.h. Eco defines five different
    types of trace macros. The various macros provide standard mechanisms for outputting
    trace macros. The trace macro%%, where # defines the number of arguments (zero
    through nine) passed into the macro for outputting the trace message, and %% defines
    the format for the argument output. Eco defines trace macros to allow up to eight
    arguments for output. Table 7.1 shows different trace macros along with a description.


    # Table 7.1 Trace Macros


    | Macro Name | Description |

    |---|---|

    | CYG_TRACE0 through CYG_TRACE8 | First parameter is a Boolean that determines
    whether the trace message is output. The other possible arguments are output using
    printf-style formatting. |

    | CYG_TRACE1X through CYG_TRACE8X | First parameter is a Boolean that determines
    whether the trace message is output. |

    | CYG_TRACE1Y through CYG_TRACE8Y | X—outputs arguments using %0x format.

    | CYG_TRACE1D through CYG_TRACE8D | Y—outputs arguments using %x format.

    D—outputs arguments using %d.

    | CYG_TRACE1XV through CYG_TRACE8XV | First parameter is a Boolean that determines
    whether the trace message is output. X, Y, and D have the same formats defined
    as previously. V causes the argument to be named output in the trace message.
    For example:

    CYG_TRACE1XV(var);

    would output the following trace message:

    TRACE:file.c[8]rout(): var=12 |'
