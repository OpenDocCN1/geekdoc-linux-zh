    look at the graphical Configuration Tool used to customize and build the eCos
    library, and then build and run tests on your target platform.


    Finally, we look into the other eCos tools and additional open-source tools to
    aid in our embedded software development. These additional open source tools allow
    us to set up a complete software embedded development environment at no cost.
    This chapter prepares us for building the eCos library with the tools provided
    in the eCos development kit. Using this information, we can then build an example
    application, which is covered in the next chapter, and run it on our target hardware
    platform.


    # 11.1 Packages


