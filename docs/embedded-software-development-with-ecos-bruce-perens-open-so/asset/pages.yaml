    www.pphtpr.com/massa/


    If you find any errors that need correction, feel free to contact me and I will
    update the source code accordingly.


    # Some Notes about the C


    All example code in this book is in Cor assembly language, eCos also uses the
    Component Definition Language (CDL), an extension of the existing Tool Command
    Language (Tcl) scripting language. We cover this in Chapter 11.


    In the text a 32-bit hexadecimal value is shown, the most significant 16 bits
    and least 16 bits are separated by an underscore (''_'') (e.g., 0ABCD_EF12) for
    readability.


    Sidebars are also included, which are used to point out important or additional
    information. The sidebars look like the following:


    > NOTE Example of a sidebar.


    This book includes several Uniform Resource Locator (URL) links showing where
    additional information can be obtained on the Internet. The most up-to-date links
    are included in the text; however, we all know that links have a finite existence.


    Item lists throughout the book detail the eCos API functions. These lists contain
    a field named ''Context''. This field shows the context from where the specified
    function can be'
