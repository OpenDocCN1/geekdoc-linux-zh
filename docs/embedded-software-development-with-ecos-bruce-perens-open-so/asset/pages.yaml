    source and configuration files for distribution. A package can be for a single
    hardware device or for an entire networking stack. Packages can be configured,
    using the different eCos tools, to operate in a mode specific to your application.
    We see how to manipulate packages with the eCos configuration tools in the Package
    Control section of this chapter.


    In order for the eCos framework to make use of packages, the package must follow
    rules imposed by the framework. A CDL script file is included with each package,
    which describes the package to the component framework. Included in the CDL script
    files are'
