  md: '# 12.5.2 Loading the Application


    This produces the file basic1.srec. This file is loaded onto the target hardware
    using RedBoot, as described in the next section.


    Now we can load and run the application using RedBoot. On the host, we use the
    Windows HyperTerminal program, which contains the facility to transfer files using
    X, Y, and Z modem protocols. As previously mentioned, RedBoot allows transfer
    of data using various communication methods such as SSH and TFTP. Additional information
    about other communication methods using RedBoot can be found in Chapter 9.


    One utility that can come handy is the GNU size utility. The size utility lists
    the sizes of the different sections and the total size of the object file. To
    get the size of our example application we run the command:


    ```

    $ 1386-elf-size basic1.exe

    ```


    The output from the size utility is in Code List 12.5.


    | text | data | bss | dec | hex filename |

    | 2 | 76900 | 54 | 113188 | lba24 | basic1.exe |


    **Code List 12.5** Output from size utility for basic application image.


    In Code List 12.5, the section names, text, data, and bss, are shown on line 1.
    On line 1 is the total size of the basic.exe object file in decimal (dec) and
    hexadecimal (hex). The size values are listed under their respective sections
    on line 2. Adding the text, data, and bss sections gives the total size of the
    file, 113, 188 bytes, Adding up the dec column, which equates to lBA24 in hexadecimal,
    shown in the hex column.


    Before continuing, ensure that RedBoot is up and running on the target hardware.


    # STEP 5


    To load the application using RedBoot, we enter the command:


    ```

    RedBoot load -v -m yMODEM

    ```


    The option -v enables verbose mode during the loading process. The -m yMODEM option
    informs RedBoot that we want to use the Y modem protocol to transfer our image.
    After entering this command, characters (the character is c) are printed that
    indicate that RedBoot is waiting for the transmission of the image to begin.


    To begin transferring the basic1.srec image, we select Transfer->Send File from
    the menu in HyperTerminal. This brings up the dialog box shown in Figure 12.9.


    As shown in Figure 12.9, weant select Ymodem from the protocol drop-down list.
    Then, click the Browse button to select the basic1.srec file under the D:\workdir\application
    subdirectory. When the transfer begins, the status of the transfer is displayed
    in a dialog box similar to the one in Figure 12.10.'
