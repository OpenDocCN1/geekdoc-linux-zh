  md: 'Allows tracing and assertion messages to be stored in a buffer. These messages
    are output when CYG_TRACE_PRINT is called. Suboptions define the buffer size and
    whether the buffer wraps, halts, or outputs when it is full. The trace buffer
    can also be configured to output when an assertion occurs.


    Option Name Function Names CDL Description CYGDBG_INFRA_DEBUG_FUNCTION_PSEUDOMACRO
    Allows trace and assert macros to include the function name in output messages.
    Although this is helpful to read during debugging, this option increases the code
    size.


    The **Asset** configuration option defines four suboptions for the asset macro.
    The first suboption is called *Preconditions* (CYGDBG_INFRA_DEBUG_PRECONDITIONS),
    which is used to determine if a condition is met prior to proceeding.


    The second suboption is called *Postconditions* (CYGDBG_INFRA_DEBUG_POST-CONDITIONS),
    which checks that a condition is met at the end of a piece of code, typically
    before a function return.


    Another suboption is called *Loop Invariants* (CYGDBG_INFRA_DEBUG_LOOP_INVARIANTS),
    which is used to determine if a condition is true for every iteration through
    a loop.


    The final suboption is called *Use Assert Text* (CYGDBG_INFRA_DEBUG_ASSERT_MESSAGE).
    This option allows you to insert your own message within the asset macro output
    to aid debugging.


    > NOTE It is important to realize that outputting text messages using the tracing
    function in eCos can cause a significant increase in your code size.


    The *Tracing* configuration option also defines suboptions. The first suboption
    is called *Trace Function Reports* (CYGDBG_INFRA_DEBUG_FUNCTION_REPORTS). This
    suboption enables individual trace output messages for entry and exit of functions.


    The other suboption is called *Use Trace Text* (CYGDBG_INFRA_DEBUG_TRACE_MESSAGE),
    which allows to insert the assertion, adds additional text to be embedded into
    the trace output message.


    # 7.3 ISO C and Math Libraries


    The *ISO C library* package provides compatibility with the International Organization
    for Standardization (ISO) 9899:1990 (also known as American National Standards
    Institute (ANSI) C3.159-1989) specification for the C language. This library does
    not include mathematical functions. Instead, eCos provides a separate math library
    that incorporates these mathematical functions. These libraries allow you to use
    well-known C functions. By default, ISO C support is thread safe.


    The ISO C standard outputs the diagnostic console device provided by the HAL.
    This is controlled by the *Default Console Device* (CYGAT_LIBC_STDIO_DEFAULT_CONSOLE)'
