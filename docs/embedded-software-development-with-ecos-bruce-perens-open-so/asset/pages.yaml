  md: 'mbuf has a fixed size of 128 bytes, which can store smaller-sized packets.
    If the packet exceeds the mbuf limit, a memory cluster, which has a fixed size
    of 4096 bytes, is added to contain the remaining data. The memory pool is a private
    heap used by various functions of the network stack, which can malloc and free
    memory as needed. Fine-tuning the amount of memory designated for use by the Networking
    package may be necessary to handle the network data for the embedded device''s
    specific application.


    A good source for a detailed description of the memory architecture used in the
    4.BSD operating system, which is the basis for the networking packages, is the
    book The Design and Implementation of the 4.BSD Operating System by Marshall Kirk
    McKusic and Keith Bostic.


    Another configuration option is to take a closer look at the Initialization Options
    for ''eth0''. The Networking package contains configuration for two Ethernet network
    interfaces. The second Ethernet device is configured with the Initialization Options
    for ''eth1'' configuration option. It is important to put some thought into how
    each device is used in the relaxed system; perhaps one interface can be used for
    debug and one for monitor and control via SNMP. It is necessary to ensure that
    each device is properly initialized with an appropriate network address when the
    system is initialized.


    A MAC address needs to be configured for each Ethernet network interface. The
    MAC typically resides in some read-only memory that is set during hardware manufacturing.
    For some devices, the MAC address can be set by configuration data in the KedBox
    ROM or monitor configured in the application.


    There are three options available for the initialization of the Ethernet network
    interfaces. The first option is Initialize ''eth0'' (CYGWR_NET_ETH0_MANUAL). This
    requires the application to perform all device interface initialization and network
    configuration up and running.


    The next option we want to use BOOTP/DHCP To Initialize (CYGWR_NET_ETH0_BOOT).
    The use of DHCP Rather than BOOTP for ''eth0'' (CYGWR_NET_ETH0_DHCP) determines
    which protocol is used for the network interface initialization. The default is
    to use DHCP, which, in case, a DHCP server is needed to provide the IP address.
    When using BOOTP or DHCP for network interface initialization, the application
    needs to call the function init_all_network_interfaces to initialize the network
    interface using the selected protocol. The application must include the network.h
    in order to use the networking package API functions.


    If the configuration option Use Full DHCP Instead of BOOTP (CYGPKG_NET_DHCP) is
    enabled, a DHCP management thread is started, which monitors the network interface
    to ensure that the DHCP leases are properly handled. If this configuration option
    is disabled, the application is responsible for renewing DHCP leases. A semaphore,
    dhcp_needs_attention, and a function, dhcp_bind, are provided for the application
    to manage the DHCP leases.'
