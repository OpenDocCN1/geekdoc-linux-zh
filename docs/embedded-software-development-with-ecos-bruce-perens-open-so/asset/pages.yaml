    # 7.1.4 Timers


    A timer is an alarm that is attached to a clock. A timer object is defined by
    the kernel. However, eCos does not provide a formal implementation, and kernel
    API functions, for the timer object.


    Timers in the eCos system are used within the µITRON compatibility layer package.
    The µITRON package uses the timer object attached to the real-time clock for performing
    its needed related functions.'
