- img_proc: true
  md: '# Installation and Configuration


    options and the steps involved for a typical debug environment configuration using
    the RedBoot ROM monitor with a separate application RAM image.


    > NOTE If the RedBoot image is built with the configuration option Allow RedBoot
    To Use Any I/O Channel For Its Console (CYPGK_REBOOT_ANY_CONSOLE) enabled, which
    is the default value, the debug and diagnostic serial port configuration settings
    are ignored and RedBoot latches on to the first port that it receives input.


    # 3.9.2 Host Configuration


    Currently, there are two methods for connecting a host to a target running RedBoot,
    serial or Ethernet. With either method, RedBoot uses the connection for both GDB
    and RedBoot command communications, although RedBoot can be configured to use
    separate communication channels for debugging. RedBoot provides commands, which
    are detailed in the User Interface and Command Section of this chapter, for configuring
    the different parameters associated with boot communication methods. After setting
    these parameters, they are used over subsequent boots of the target hardware.


    One point to regard is that the RedBoot driver implementations, for both serial
    and Ethernet, is polled (not interrupting) for I/O communication. The configuration
    option Processing Idle time (ms) (CYNUM_REBOOT_IDLE_TIMEOUT) sets the RedBoot
    processing interval. After this timeout, RedBoot assumes the command console is
    idle and performs various background tasks. The default value for this option
    is 10 milliseconds. If traffic increases, there might be a point at which the
    RedBoot driver cannot keep up and packets are dropped. In that case, it might
    be necessary to adjust the timeout configuration option or re-check that the RedBoot
    needs to process on the communication channel.


    # 3.9.2.1 Serial


    Using the serial connection requires a host-side terminal. The default parameters
    that RedBoot uses for a serial connection are specific to the target hardware
    platform. On some target hardware platforms, the RedBoot baud rate can be changed
    using the baudrate command, which is detailed in the User Interface and Command
    Section of this chapter.


    Most hardware platforms should contain at least one serial port for RedBoot communications.
    Some platforms contain multiple serial ports. The serial port RedBoot uses for
    serial communication is described in the RedBoot Configuration section of this
    chapter. By default, RedBoot attempts to communicate with the host via the serial
    port, set by the configuration options, on power up. Once a command is received
    by RedBoot on one of the serial ports, that port is used for communications. There
    is a channel command available, which is detailed in the User Interface and Command
    Section of this chapter, that allows the port Red-Boot for console communication
    to be changed.'
