    can then be added and/or removed based on the requirements of the system. Then,
    fine-grained configuration is performed on the configuration options.


    We then moved on to the other tools available in the ecos development kit, as
    well as other open-source tools that allow us to configure a complete embedded
    development environment free of charge since the tools are all open source. Now
