  md: '# List 8.6 Basic Networking Framework Package Configuration Options


    **Option Name** INET Support

    CYGPKG_NET_INET

    Allows the use of IPv4 and ARP within the networking stack. This option is enabled
    by default. This option contains suboptions for enabling IPv6 Support (CYGPKG_NET_INET6),
    Multicast Routing (CYGSEM_NET_ROUTING), and the Use Random Sequence (CYGSEM_NET_RANDOMID).
    All suboptions are disabled by default.


    **Option Name** TFTP (RFC-1350) Support

    CYGPKG_NET_TFTP

    Includes client and server library for TFTP. This option is enabled by default.
    Priority Level for TFTP Daemon (CYGPKG_NET_TFTP_THREAD_PRIORITY) suboption sets
    the priority level of the TFTP server default. The priority level is 10.


    **Option Name** Use Full DHCP Instead of BOOT

    CYGPKG_NET_DHCP

    En the use of DHCP for initialization of the IP address for network interfaces.
    Otherwise, BOOTP is used, which does not require as much resources as DHCP. This
    option is enabled by default. When this option is enabled, suboptions configure
    the DHCP management threads.


    **Option Name** Options Controlling IPv6 Routing

    CYGPKG_IPV6_ROUTING

    The configuration suboptions control the IPv6 routing for sending router solicitation
    messages, such as priority and the rate at which solicitations are sent. This
    option is only enabled by default when the IPv6 Support configuration suboption
    is enabled.


    **Option Name** Debug Output

    CYGPKG_NET_DEBUG

    Enables diagnostic output for various stack operations. The default for this option
    is disabled.


    **Option Name** Network Timing Statistics

    CYGPKG_NET_TIMING_STATS

    Controls the output of timing messages to various function calls such as memcopy
    and mbuf_alloc. The default for this option is disabled.


    **Option Name** Build Networking Tests (Demo Programs)

    CYGPKG_NET_BUILD_TESTS

    Enables network tests to be built. This option is disabled by default.


    **Option Name** Initialization Options for ''eth0''

    CYGWR_NET_DRIVER_ETH0_SETUP_OPTIONS

    This component contains configuration options that specify the method (DHCP/BOOTP
    or static) for initializing the Ethernet 0 interface. The default is to use DHCP/BOOTP
    for initialization.'
