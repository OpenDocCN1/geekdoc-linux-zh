    PC Target.


    # STEP 2


    Now that we have a baseline configuration for our eCos image, we want to verify
    the configuration settings. We need to tailor the configuration option settings
    according to the specific hardware we are using. Some of the configuration may
    be set to the proper values for build by default. If no modifications are necessary.


    First, we want to verify the Startup Type (CYG_HAL_STARTUP) configuration option.
    This is nested under the eCos image, under i386 Architecture (CYGPK_HAL_I386)
    package, under the i386 PC Target. We want to set the Startup Type to RAM, so
    that we can load our application into RAM for running and debugging.


    Next, since we are using the RedBoot monitor, we want to verify the ROM Monitor
    supports. Specifically, we want to enable the Work With A ROM Monitor (CYSEM_HAL_USE_ROM_MONITOR)
    configuration option. Since we are going to use GDB on our host system for debugging,
    we want to set this option to GDB_stubs.


    It is a good idea to use assertions during the debug phase of a project. This
    enables various levels of checking in the system, such as argument checking, to
    ensure the software is behaving properly. As the software gets closer to a release
    assertions should be disabled to ensure there are no timing problems hindering
    the system. Assertions are enabled by selecting the Asserts & Tracing (CYGPK_INFRA_DEBUG)
    configuration and then enabling the Use Asserts (CYDBG_USER_ASSERT) configuration
    option, which is enabled by default. This configuration is located under the Infrastructure
    package.


    Other configuration options might need to be validated or modified for your specific
    target hardware. This is intended to make us aware of the key configuration option
    settings necessary to build an eCos library that works for our examples.


