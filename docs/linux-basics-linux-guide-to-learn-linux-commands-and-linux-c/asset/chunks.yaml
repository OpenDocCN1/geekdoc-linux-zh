  trans: "\n然而，此操作需要输入密码，而该密码通常在系统中不可用。因此，避免任何问题的常见做法之一是在任何命令前加上 `sudo` 单词。这种方法允许自动以\
    \ root 权限运行命令。如果你被允许作为 root 用户工作，你就可以进行任何编辑。\n\n通过使用 `sudo` 命令，你可以运行命令并对文件进行更改，例如配置文件、所有用户通用的应用程序，以及编辑所有用户的文件夹和文件的权限。没有\
    \ root 用户访问权限可能会阻止你向系统上安装或编辑设置。所有的 root 权限都已添加到 `/etc/sudoers` 下的“sudoers”文件中。\n\
    \n```\nsudo cat /etc/sudoers\n```\n\n运行上述命令，你可以看到 `/etc` 文件夹的内容，而这在其他情况下是无法访问的。\n\
    \n以下命令显示了当前操作系统上可的用户列表：\n\n```bash\ncut -d: -f1 /etc/passwd\n```\n\n此外，你还可以查看当前正在使用的用户：\n\
    \n```bash\nwhoami\n```\n\n![](img/00003.jpeg)\n\n管理用户的下一步是如何创建用户组。此操作的主要目标是创建具有相同规则和功能的组。这项任务非常有用，因为属于同一组的所有用户都可以操作同一组文件夹、文件，并且他们被允许执行某些应用程序。\n\
    \n## 在用户上应用更改\n\n### 添加新用户\n\n常见操作之一是添加新用户。要执行此任务，你只需要像下面一样输入，使用 `adduser` 命令后跟新用户的名称：\n\
    \n```bash\nsudo adduser user1\n```\n\n![一张包含手、鸟的自动生成的描述](img/00004.jpeg)\n\n首先，需要管理员密码来运行\
    \ `adduser` 命令。\n\n然后，它会要求输入与新用户相关的密码并再次输入。\n\n此外，另一个要求是用户的全名，在我们的示例中为“User1”。\n\
    \n之后，操作系统还需要诸如房间号、工作电话、家庭电话等信息。这些信息都是可选的。最后，它会询问信息是否正确。只需输入：\n\n```bash\nY\n```\n\
    \n新用户现在已添加到你的列表中。\n\n### 验证用户是否为组成员\n\n运行 `id` 命令查看该用户是否为组成员：\n\n```bash\nid user1\n\
    ```\n\n### 删除用户\n\n你可以使用 `deluser` 命令后接要删除的用户名称来删除用户：\n\n```bash\nsudo deluser\
    \ user1\n```\n\n### 锁定和解锁特定用户\n\n可以使用以下命令锁定或解锁用户：\n\n```bash\nsudo passwd -l user1\n\
    sudo passwd -u user1\n```\n\n选项 `-l` 和 `-u` 的作用是分别锁定和解锁用户。\n\n### 查看与用户相关的所有进程\n\
    \n如果你想查找有关如“user1”等某个用户的进程详细信息，输入命令 `ps`：\n\n```bash\nps -u user1\n```\n\n## 在组上应用更改\n\
    \n### 如何查看你是否属于某个组\n\n运行以下命令查看你属于哪个组：\n\n```bash\ngroups\n```\n\n![](img/00005.jpeg)\n\
    \n示例中报告的组有 ubuntu, adm, dialout, cdrom, floppy, sudo, audio, dip, video, plugdev,\
    \ lxd, netdev。\n\n此外，你可以使用以下命令检查你的用户是哪些组的一部分。你可以显示服务列表以及你所需的权限（如 root）。\n\n```bash\n\
    sudo cat /etc/group\n```\n\n### 将用户添加到组\n\n用于将用户添加到已知组的命令是 `usermod`。你需要指定参数为用户名，然后是要关联的组。\n\
    \n```bash\nsudo usermod -a -G user1 ubuntu\n```\n\n在上面的示例中，“user1”被添加到“ubuntu”组中。\n\
    \n再次运行命令查看用户列表，你可以检查用户是否已添加：\n\n```bash\nsudo cat /etc/group\n```\n\n如下所示，用户已成功添加并显示在“ubuntu”下。\n\
    \n```\nuser1:x:1001:ubuntu\n```\n\n![](img/00006.gif)\n\n### 创建新组\n\n当你需要创建一个尚不存在的新组时，可以使用\
    \ `groupadd` 命令和组名（组可以是“usergroup1”）。\n\n```bash\nsudo groupadd usergroup1\n```\n\
    \n### 从组中删除用户\n\n正如我们之前在本节中针对用户看到的那样，用户也可以从组中移除。要应用这些更改，请使用 `deluser` 命令，后接用户名然后是组名。\n\
    \n```bash\nsudo deluser user1 usergroup1\n```\n\n如果你想查看用户属于哪些组，只需使用以下命令：\n\n```bash\n\
    sudo groups user1\n```\n\n然后，按下组合键 `CTRL + X` 退出文件并输入“Y”保存更改。系统会要求以相同的名称“visudo”保存文件以覆盖它。按\
    \ `enter` 继续。\n\n新的“user1”现在能够以 root 权限执行任何命令。\n\n## 权限\n\n对于用户来说，权限是一个非常有用的操作。在这种情况下，你需要输入信息列表：\n\
    \n*   第一个是类型，可以是文件 (-)、目录 (d) 或符号链接 (l)\n*   用户权限、组权限和其他权限被分为：\n    *   读取 (r)\n\
    \    *   写入 (w)\n    *   执行 (x)\n\n对于读取、写入和执行的每种操作，都根据角色被分配了一个数字。\n\n### 给用户授予权限\n\
    \n可能会产生大量工作的操作之一是编辑特定用户的权限。此操作需要检查包含所有用户信息的“visudo”文件。\n\n首先，使用以下命令打开 `visudo`\
    \ 文件：\n\n```bash\nsudo nano visudo\n```\n\n现在，在此处输入如下内容，并将“user1”替换为需要需要授予 root\
    \ 权限的用户名：\n\n```\nuser1 ALL=(ALL) ALL\n```\n\n此外，你也可以按照此处所示给 user1 授予权限：\n\n```\n\
    User_Alias ADMINS = user1\nCmnd_Alias HTTPD = /etc/init.d/httpd\nADMINS ALL =\
    \ HTTPD\n```\n\n### 如何向目录添加权限\n\n下面你将找到为“NewFolder”文件夹添加读取和写入权限的方法：\n\n```bash\n\
    sudo chmod -R g+w $HOME/Documents/NewFolder\n```\n\n同样，也可以向想要访问“NewFolder”文件夹的用户拒绝权限：\n\
    \n```bash\nsudo chmod -R o-x NewFolder\n```\n\n通过此程序，你能够同时给一个组和多个组授予权限。为了克服这一限制，你可以使用访问控制列表（ACL）。这里的命令允许对“NewFolder”文件夹进行“读取”权限。这意味着该文件夹现在对于名为“users3”的组也是访问的，而无需涉及其他用户的权限。\n\
    \n```bash\nsetfacl -m g:usergroup3:rx $HOME/Documents/NewFolder\n```\n\n允许同一组的用户写入“NewFolder”文件夹，请使用以下命令：\n\
    \n```bash\nsetfacl -m g:auditors:rwx $HOME/Documents/NewFolder\n```\n\n## 执行常规系统健康检查\n\
    \n保持系统性能稳定的良好做法是检查并对整个系统运行检查。操作系统的可靠性取决于虚拟内存状态（这可以通过 `vmstat` 系统实用程序访问）、CPU 使用率、硬盘驱动器使用情况、输入输出设备、网络分析以及当前运行的进程。所有这些操作对于\
    \ Linux 服务器管理员都是至关重要的。\n\n### Top 命令 – 监控任务\n\n需要记住的非常重要的步骤之一是实时监控资源以及硬件的使用情况。虽然这看起来可能没用，但你可能会发现这种方法有助于监督所有活动并就何处干预做出决策。该命令显示\
    \ CPU 使用率、内存状态、交换内存、缓存大小、缓冲区大小、进程 PID 等……\n\n```bash\ntop\n```\n\n运行以下命令 `top`\
    \ 查看所有运行的服务：\n"
- fmt: "\n# top\n\n![A screenshot of a cell phone Description automatically generated](images/00007.jpeg)\n\
    \nAs displayed above, you have a complete report of what are services running\
    \ at this time. You can quit the utility, just pressing “q” from your keyboard.\n\
    \nYou can also quit after showing 10 results with the following command:\n\n```bash\n\
    top -n 10\n```\n\nMore in details the terms listed are:\n\n*   `PID`: The process\
    \ id\n*   `PR`: It identifies the priority of the task\n*   `SHR`: The shared\
    \ memory usage for each activity\n*   `VIRT`: The virtual memory usage for each\
    \ activity\n*   `USER`: User who is running the task\n*   `%CPU`: The CPU usage.\n\
    *   `TIME+`: CPU Time expressed in seconds\n*   `SHR`: The Shared Memory size\
    \ (kb) usage for each activity\n*   `NI`: The Nice Value of an activity. The priority\
    \ can be positive or negative, meaning a lower level of priority or higher\n*\
    \   `%MEM`: The Memory usage for each activity\n\n## Sorting information with\
    \ different orders\n\nThe command `top` allows to list information with different\
    \ orders. Here you may see some examples of how to sort tasks.\n\n### Sorting\
    \ by process PID\n\nFor instance, you may want to sort of the statistics with\
    \ the PID of process. To add a filter to sort data, press the combination of `SHIFT\
    \ + O`. You are now able to decide how to filter your information. Press “a” to\
    \ view the process PID.\n\nAfter pressing `SHIFT + O` from the keyboard, type\
    \ the following:\n\n```\na\n```\n\n### The option -k – kill process\n\nNow that\
    \ you know the name of a PID process, you can kill a process with the option `k`:\n\
    \n```bash\ntop -k\n```\n\nThen, press any key to come back to the top of the screen.\
    \ After that, if you want to exit from the report, just press:\n\n```\nq\n```\n\
    \n### Sorting by CPU Usage\n\nThe combination `SHIFT + P` allows you to sort the\
    \ tasks by CPU usage.\n\n### The option -u - User\n\nType the following option\
    \ if you need to display the report of a known user:\n\n```bash\ntop -u user1\n\
    ```\n\nAs shown in the example the command `top` if followed then by the option\
    \ `u` and the `user1` which is currently the user who is performing the operations.\n\
    \n![A close up of a street Description automatically generated](images/00008.jpeg)\n\
    \n### The -b option - Batch mode\n\nUse the option `-b` to display the output\
    \ to a file or any other application:\n\n```bash\ntop -b\n```\n\n### The option\
    \ -s – Secure mode\n\nThe option `top -s` enables the secure mode:\n\n```bash\n\
    top -s\n```\n\n### The option -d – Delay time\n\nWhile the default settings for\
    \ the delay time is 3s, you are able to edit this setting, just using the option\
    \ `-d` as reported here below:\n\n```bash\ntop -d 2\n```\n\nPassing as argument\
    \ `-d` and `2`, it sets the delay time to 2 seconds.\n\n### The option -c - Absolute\
    \ path\n\nPress the option `c` to list the absolute path of running process.\n\
    \n![A screenshot of a cell phone Description automatically generated](images/00009.jpeg)\n\
    \nAgain, press “q” to leave the terminal open without showing the list of tasks.\n\
    \n### The option -h – Help\n\nIf you need a summarize of all commands available,\
    \ press the following:\n\n```bash\ntop -h\n```\n\nNow, you can see options you\
    \ can use for your Linux distributions.\n\n## Monitoring the Memory\n\nWith the\
    \ first step, you took a look to the general performances of your system. Now\
    \ you can dig into some more details about the memory usage. Why is so important?\n\
    \nA higher load of tasks and size of data at the same time can imply an increase\
    \ in use of memory. As a result, when memory is not enough, the system may occur\
    \ in decreasing the performances and using other resources, such as the CPU, that\
    \ usually should be regularly used without overcoming a certain level.\n\nOne\
    \ of the main activities that you would like to approach is checking the free\
    \ space available in your operating system.\n\nType the following command to see\
    \ the space currently available in your memory:\n\n```bash\nwatch free -m\n```\n\
    \n![A screenshot of a cell phone Description automatically generated](images/00010.jpeg)\n\
    \nBy default, every two seconds the memory usage is updated. You can update this\
    \ setting, adding `-n 10` to set up a refresh every 10 seconds:\n\n```bash\nwatch\
    \ -n 5 free -m\n```\n\n![A screenshot of a cell phone Description automatically\
    \ generated](images/00011.jpeg)\n\nThe amount of memory used is expressed in MB.\
    \ This means that the total physical memory in the machine is 978 MB, with 114\
    \ MB used, 310 MB free, with no space shared. The buff cache is 553MB with still\
    \ 718 MB available. Instead, the swap space is 0.\n\nTo exit, just press `CTRL\
    \ + X`.\n\n## The VmStat (virtual memory statics)\n\nVmStat is an essential utility\
    \ that provides information about the virtual memory statistics. This means that\
    \ it shows a summarize with memory usage, paging, hard drives status and CPU usage,\
    \ and more.\n\nRun the command here below to see the information from the last\
    \ reboot:\n\n```bash\nvmstat\n```\n\n![A picture containing screenshot, clock\
    \ Description automatically generated](images/00012.jpeg)\n\nMore in details you\
    \ find a report about processes, memory, swap, io, system and CPU:\n\n*   **Procs**\n\
    \    *   `r`: The number of processes waiting for run time.\n    *   `b`: The\
    \ number of processes in uninterruptible sleep.\n*   **Memory**\n    *   `swpd`:\
    \ the amount of virtual memory used.\n    *   `free`: the amount of idle memory.\n\
    \    *   `buff`: the amount of memory used as buffers.\n    *   `cache`: the amount\
    \ of memory used as cache.\n    *   `inact`: the amount of inactive memory.\n\
    \    *   `active`: the amount of active memory.\n*   **Swap**\n    *   `si`: the\
    \ amount of memory swapped in.\n    *   `so`: the amount of memory swapped out.\n\
    *   **IO**\n    *   `bi`: blocks received from a device.\n    *   `bo`: blocks\
    \ sent to a device.\n*   **System**\n    *   `in`: the number of interrupts per\
    \ second.\n    *   `cs`: the number of context switches per second.\n*   **CPU**\n\
    \    These are percentages of total CPU time.\n    *   `us`: time spent running\
    \ non-kernel. (user time)\n    *   `sy`: time spent running kernel. (system time)\n\
    \    *   `id`: time spent idle.\n    *   `wa`: time spent waiting for IO.\n  \
    \  *   `st`: time stolen from a virtual machine.\n\nAll the information reported\
    \ above are accessible typing:\n\n```bash\nman vmstat\n```\n\n### Why is so crucial\
    \ to check the VmStat?\n\nOne of the columns you should focus your attention is\
    \ `swap`. It is significant important to assure that this data is set to 0 or\
    \ close to. A higher value indicates there are considerable issues. Some causes\
    \ for swapping may include an application that impacted the memory causing an\
    \ exceed of usage, some problems in the configurations, or a low amount of memory\
    \ installed in the machine.\n\nWhatever is the case, trying to identify the problem\
    \ is always positive to contain any issue in the future. As seen earlier, the\
    \ command `top` is able to help you to monitor the activities on processes.\n\n\
    ### Executing VmStat for a specific number of seconds\n\nType the following command:\n\
    \n```bash\nvmstat 2 4\n```\n\nExecuting this command, the report will be updated\
    \ every 2 seconds for 4 times before stopping. As mentioned earlier in this section,\
    \ data refer to the updated values from the last time of the reboot.\n\n![A screen\
    \ shot of a computer Description automatically generated](images/00013.jpeg)\n\
    \nAs also illustrated with a recap from `man vmstat`, the `r` addresses to the\
    \ run queue, which refers to the queue that each application has to wait in order\
    \ to be executed.\n\nSome options you can see more details about the information.\n\
    \n### The option -a – active and inactive memory\n\nThe option `-a` also specifies\
    \ the status active and inactive of the memory.\n\n### The option -t – timestamp\n\
    \nUse the option `-t` to view the timestamps in each line.\n\n```bash\nvmstat\
    \ -t\n```\n\n![A picture containing orange, room Description automatically generated](images/00014.jpeg)\n\
    \n### The option -d – Disk\n\nWith the option `-d`, you can view the disk status\
    \ like here below:\n\n![A screenshot of a cell phone Description automatically\
    \ generated](images/00015.jpeg)\n"
  raw: "top\n\n![A screenshot of a cell phone Description automatically generated](images/00007.jpeg)\n\
    \nAs displayed above, you have a complete report of what are services running\
    \ at this time. You can quit the utility, just pressing “q” from your keyboard.\n\
    \nYou can also quit after showing 10 results with the following command:\n\ntop\
    \ -n 10 \n\nMore in details the terms listed are:\n\n*   PID: The process id\n\
    \n*   PR: It identifies the priority of the task\n\n*   SHR: The shared memory\
    \ usage for each activity\n\n*   VIRT: The virtual memory usage for each activity\n\
    \n*   USER: User who is running the task\n\n*   %CPU: The CPU usage.\n\n*   TIME+:\
    \ CPU Time expressed in seconds\n\n*   SHR: The Shared Memory size (kb) usage\
    \ for each activity\n\n*   NI: The Nice Value of an activity. The priority can\
    \ be positive or negative, meaning a lower level of priority or higher\n\n*  \
    \ %MEM: The Memory usage for each activity\n\nSorting information with different\
    \ orders\n\nThe command “top” allows to list information with different orders.\
    \ Here you may see some examples of how to sort tasks.\n\nSorting by process PID\n\
    \nFor instance, you may want to sort of the statistics with the PID of process.\
    \ To add a filter to sort data, press the combination of SHIFT + O. You are now\
    \ able to decide how to filter your information. Press “a” to view the process\
    \ PID.\n\nAfter pressing SHIFT + O from the keyboard, type the following:\n\n\
    a\n\nThe option -k – kill process\n\nNow that you know the name of a PID process,\
    \ you can kill a process with the option “k”:\n\ntop -k\n\nThen, press any key\
    \ to come back to the top of the screen. After that, if you want to exit from\
    \ the report, just press:\n\nq\n\nSorting by CPU Usage\n\nThe combination SHIFT\
    \ + P allows you to sort the tasks by CPU usage.\n\nThe option -u - User\n\nType\
    \ the following option if you need to display the report of a known user:\n\n\
    top -u user1\n\nAs shown in the example the command top if followed then by the\
    \ option “u” and the “user1” which is currently the user who is performing the\
    \ operations.\n\n![A close up of a street Description automatically generated](images/00008.jpeg)\n\
    \nThe -b option - Batch mode\n\nUse the option -b to display the output to a file\
    \ or any other application:\n\ntop -b\n\nThe option -s – Secure mode\n\nThe option\
    \ top -s enables the secure mode:\n\ntop -s\n\nThe option -d – Delay time\n\n\
    While the default settings for the delay time is 3s, you are able to edit this\
    \ setting, just using the option -d as reported here below:\n\ntop -d 2\n\nPassing\
    \ as argument “-d” and “2”, it sets the delay time to 2 seconds.\n\nThe option\
    \ -c - Absolute path\n\nPress the option “c” to list the absolute path of running\
    \ process.\n\n![A screenshot of a cell phone Description automatically generated](images/00009.jpeg)\n\
    \nAgain, press “q” to leave the terminal open without showing the list of tasks.\n\
    \nThe option -h – Help\n\nIf you need a summarize of all commands available, press\
    \ the following:\n\ntop -h\n\nNow, you can see options you can use for your Linux\
    \ distributions.\n\nMonitoring the Memory\n\nWith the first step, you took a look\
    \ to the general performances of your system. Now you can dig into some more details\
    \ about the memory usage. Why is so important?\n\nA higher load of tasks and size\
    \ of data at the same time can imply an increase in use of memory. As a result,\
    \ when memory is not enough, the system may occur in decreasing the performances\
    \ and using other resources, such as the CPU, that usually should be regularly\
    \ used without overcoming a certain level.\n\nOne of the main activities that\
    \ you would like to approach is checking the free space available in your operating\
    \ system.\n\nType the following command to see the space currently available in\
    \ your memory:\n\nwatch free -m\n\n![A screenshot of a cell phone Description\
    \ automatically generated](images/00010.jpeg)\n\nBy default, every two seconds\
    \ the memory usage is updated. You can update this setting, adding “-n 10” to\
    \ set up a refresh every 10 seconds:\n\nwatch -n 5 free -m\n\n![A screenshot of\
    \ a cell phone Description automatically generated](images/00011.jpeg)\n\nThe\
    \ amount of memory used is expressed in MB. This means that the total physical\
    \ memory in the machine is 978 MB, with 114 MB used, 310 MB free, with no space\
    \ shared. The buff cache is 553MB with still 718 MB available. Instead, the swap\
    \ space is 0.\n\nTo exit, just press CTRL + X.\n\nThe VmStat (virtual memory statics)\n\
    \nVmStat is an essential utility that provides information about the virtual memory\
    \ statistics. This means that it shows a summarize with memory usage, paging,\
    \ hard drives status and CPU usage, and more.\n\nRun the command here below to\
    \ see the information from the last reboot:\n\nvmstat\n\n![A picture containing\
    \ screenshot, clock Description automatically generated](images/00012.jpeg)\n\n\
    More in details you find a report about processes, memory, swap, io, system and\
    \ CPU:\n\n*   Procs\n\n    *   r: The number of processes waiting for run time.\n\
    \n    *   b: The number of processes in uninterruptible sleep.\n\n*   Memory\n\
    \n    *   swpd: the amount of virtual memory used.\n\n    *   free: the amount\
    \ of idle memory.\n\n    *   buff: the amount of memory used as buffers.\n\n \
    \   *   cache: the amount of memory used as cache.\n\n    *   inact: the amount\
    \ of inactive memory. (-a option)\n\n    *   active: the amount of active memory.\
    \ (-a option)\n\n*   Swap\n\n    *   si: the amount of memory swapped in from\
    \ disk (/s).\n\n    *   so: the amount of memory swapped to disk (/s).\n\n*  \
    \ IO\n\n    *   bi: blocks received from a block device (blocks/s).\n\n    * \
    \  bo: blocks sent to a block device (blocks/s).\n\n*   System\n\n    *   in:\
    \ the number of interrupts per second, including the clock.\n\n    *   cs: the\
    \ number of context switches per second.\n\n*   CPU\n\nThese are percentages of\
    \ total CPU time.\n\n*   us: time spent running non-kernel code. (user time, including\
    \ nice time)\n\n*   sy: time spent running kernel code. (system time)\n\n*   id:\
    \ time spent idle. Prior to Linux 2.5.41, this includes IO-wait time.\n\n*   wa:\
    \ time spent waiting for IO. Prior to Linux 2.5.41, included in idle.\n\n*   st:\
    \ time stolen from a virtual machine. Prior to Linux 2.6.11, unknown.\n\nAll the\
    \ information reported above are accessible typing:\n\nman vmstat\n\nWhy is so\
    \ crucial to check the VmStat?\n\nOne of the columns you should focus your attention\
    \ is the “swap”. It is significant important to assure that this data is set to\
    \ 0 or close to. A higher value indicates there are considerable issues. Some\
    \ causes for swapping may include an application that impacted the memory causing\
    \ an exceed of usage, some problems in the configurations, or a low amount of\
    \ memory installed in the machine.\n\nWhatever is the case, trying to identify\
    \ the problem is always positive to contain any issue in the future. As seen earlier,\
    \ the command “top” is able to help you to monitor the activities on processes.\n\
    \nExecuting the VmStat for a specific number of seconds\n\nType the following\
    \ command:\n\nvmstat 2 4\n\nExecuting this command, the report will be updated\
    \ every 2 seconds for 4 times before stopping. As mentioned earlier in this section,\
    \ data refer to the updated values from the last time of the reboot.\n\n![A screen\
    \ shot of a computer Description automatically generated](images/00013.jpeg)\n\
    \nAs also illustrated with a recap from “man vmstat”, the “r” addresses to the\
    \ run queue, which refers to the queue that each application has to wait in order\
    \ to be executed.\n\nSome options you can see more details about the information.\n\
    \nThe option -a – active and inactive memory\n\nThe option -a also specifies the\
    \ status active and inactive of the memory.\n\nThe option -t – timestamp\n\nUse\
    \ the option -t to view the timestamps in each line.\n\nvmstat -t\n\n![A picture\
    \ containing orange, room Description automatically generated](images/00014.jpeg)\n\
    \nThe option -d – Disk\n\nWith the option -d, you can view the disk status like\
    \ here below:\n\n![A screenshot of a cell phone Description automatically generated](images/00015.jpeg)"
