    test the activity of a server providing the IP address. Through the ping command
    you are able to check out if the Ip you are looking for is currently active.


    The command works sending the requests through the packages (Internet Control
    Message Protocol). At the same time, the recipient answers to the message with
    another Internet Control Message Protocol. The communication may result in problems
    such as delays that are evidenced launching the command ping. Also, some packages
