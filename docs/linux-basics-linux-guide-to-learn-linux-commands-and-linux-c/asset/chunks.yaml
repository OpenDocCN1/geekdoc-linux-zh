  trans: "\n\n# top\n\n![手机截图 自动生成的描述](img/00007.jpeg)\n\n如上所示，你获得了一份关于当前运行服务的完整报告。你可以通过按下键盘上的“q”来退出实用程序。\n\
    \n你也可以通过以下命令在显示 10 个结果后退出：\n\n```bash\ntop -n 10\n```\n\n列出的术语详细说明如下：\n\n*   `PID`:\
    \ 进程 ID\n*   `PR`: 标识任务的优先级\n*   `SHR`: 每个活动的共享内存使用情况\n*   `VIRT`: 每个活动的虚拟内存使用情况\n\
    *   `USER`: 运行任务的用户\n*   `%CPU`: CPU 使用率\n*   `TIME+`: 以秒为单位表示的 CPU 时间\n*   `SHR`:\
    \ 每个活动的共享内存大小 (kb) 使用情况\n*   `NI`: 活动的 Nice 值。优先级可以是正数也可以是负数，意味着优先级较低或较高\n*  \
    \ `%MEM`: 每个活动的内存使用情况\n\n## 使用不同顺序进行排序的信息\n\n`top` 命令允许按不同的顺序列出信息。在这里你可以看到一些对任务进行排序的示例。\n\
    \n### 按进程 PID 排序\n\n例如，你可能想按进程 PID 对统计数据进行排序。要添加过滤器排序数据，请按下 `SHIFT + O` 组合键。现在你可以决定如何过滤你的信息。按下“a”查看进程\
    \ PID。\n\n在键盘上按下 `SHIFT + O` 后，输入以下内容：\n\n```\na\n```\n\n### 选项 -k – 杀死进程\n\n\
    现在你已经知道了 PID 进程的名称，可以使用选项 `k` 杀死一个进程：\n\n```bash\ntop -k\n```\n\n然后，按下任意键返回屏幕顶部。之后，如果你想退出报告，只需按下：\n\
    \n```\nq\n```\n\n### 按 CPU 使用率排序\n\n组合键 `SHIFT + P` 允许你按 CPU 使用率对任务。\n\n### 选项\
    \ -u - 用户\n\n如果你需要显示已知用户的报告，请输入以下选项：\n\n```bash\ntop -u user1\n```\n\n如示例所示，执行\
    \ `top` 命令后接选项 `u` 和 `user1`，其中 `user1` 是当前执行操作的用户。\n\n![街道特写 自动生成的描述](img/00008.jpeg)\n\
    \n### -b 选项 - 批模式\n\n使用选项 `-b` 将输出到文件或任何其他应用程序：\n\n```bash\ntop -b\n```\n\n###\
    \ 选项 -s – 安全模式\n\n选项 `top -s` 启用安全模式：\n\n```bash\ntop -s\n```\n\n### 选项 -d – 延迟时间\n\
    \n虽然延迟时间的默认设置为 3s，但你可以使用此处所示的选项 `-d` 来编辑此设置：\n\n```bash\ntop -d 2\n```\n\n通过传递参数\
    \ `-d` 和 `2`，它将延迟时间设置为 2 秒。\n\n### 选项 -c - 绝对路径\n\n按下选项 `c` 列出运行进程的绝对路径。\n\n![手机截图\
    \ 自动生成的描述](img/00009.jpeg)\n\n再次按下“q”可以离开终端，但不显示任务列表。\n\n### 选项 -h – 帮助\n\n如果你需要所有可用命令的摘要，请按下：\n\
    \n```bash\ntop -h\n```\n\n现在，你可以看到适用于你的 Linux 发行版的各种选项。\n\n## 监控内存\n\n通过第一步，你查看了系统的整体性能。现在你可以深入了解内存使用的更多细节。为什么这非常重要？\n\
    \n任务负载和数据量的同时增加可能意味着内存使用的增加。结果是，当内存不足时，系统可能会性能下降并使用其他资源（例如 CPU），而这些资源通常应该定期使用而不应超过某个水平。\n\
    \n你想要处理的主要活动之一是检查操作系统中的可用空空间。\n\n输入以下命令查看内存中当前可用的空间：\n\n```bash\nwatch free -m\n\
    ```\n\n![手机截图 自动生成的描述](img/00010.jpeg)\n\n默认情况下，内存使用每两秒更新一次。你可以通过添加 `-n 10` 来更新此设置，以便每\
    \ 10 秒刷新一次：\n\n```bash\nwatch -n 5 free -m\n```\n\n![手机截图 自动生成的描述](img/00011.jpeg)\n\
    \n使用的内存量以 MB 表示。这意味着机器上的总物理内存为 978 MB，已用 114 MB，剩余 310 MB，没有共享空间。缓冲缓存为 553MB，仍有\
    \ 718 MB 可用。相反，交换空间为 0。\n\n要退出，只需按下 `CTRL + X`。\n\n## VmStat (虚拟内存统计)\n\nVmStat\
    \ 是一个本质的实用程序，提供有关虚拟内存统计的信息。这意味着它显示了内存使用、分页、硬盘状态和 CPU 使用率等的摘要。\n\n运行下方的命令查看上次重启以来的信息：\n\
    \n```bash\nvmstat\n```\n\n![包含截图、时钟的图片 自动生成的描述](img/00012.jpeg)\n\n更多细节是关于进程、内存、交换、io、系统和\
    \ CPU 的报告：\n\n*   **Procs**（进程）\n    *   `r`: 等待运行时间的进程数。\n    *   `b`: 不可中断睡眠的进程数。\n\
    *   **Memory**（内存）\n    *   `swpd`: 使用的虚拟内存量。\n    *   `free`: 空闲内存量。\n    * \
    \  `buff`: 缓冲内存量。\n    *   `cache`: 缓存的内存量。\n    *   `inact`: 不活跃内存量。\n    * \
    \  `active`: 活跃内存量。\n*   **Swap**（交换）\n    *   `si`: 换入的内存量。\n    *   `so`: 换出的内存量。\n\
    *   **IO**（输入/输出）\n    *   `bi`: 从设备接收的块。\n    *   `bo`: 发送到设备的块。\n*   **System**（系统）\n\
    \    *   `in`: 每秒中断数。\n    *   `cs`: 每秒上下文切换数。\n*   **CPU**\n    这些是占总 CPU 时间的百分比。\n\
    \    *   `us`: 运行非内核的时间（用户时间）。\n    *   `sy`: 运行内核的时间（系统时间）。\n    *   `id`: 空闲花费的时间。\n\
    \    *   `wa`: 等待 IO 的时间。\n    *   `st`: 从虚拟机中窃取的时间。\n\n所有上述报告的信息都可以通过输入访问：\n\n\
    ```bash\nman vmstat\n```\n\n### 为什么检查 VmStat 如此关重要？\n\n你应该关注的列之一是 `swap`。确保此数据设置为\
    \ 0 或接近 0 非常重要。高值表示存在相当的问题。导致交换的一些原因可能包括影响内存导致使用过载的应用程序、配置中的某些问题，或者机器安装的内存较少。\n\
    \n无论情况如何，尝试识别问题对于未来包含任何问题始终是积极的。正如之前看到的，`top` 命令能够帮助你监控进程的活动。\n\n### 执行指定秒数的 VmStat\n\
    \n输入以下命令：\n\n```bash\nvmstat 2 4\n```\n\n执行此命令后，报告将每 2 秒更新 4 次，然后停止。正如本节之前提到的，数据指的是自上次重启后的更新值。\n\
    \n![计算机截图 自动生成的描述](img/00013.jpeg)\n\n正如 `man vmstat` 的摘要所示，`r` 指向运行队列，该队列是指每个应用程序必须等待才能执行的队列。\n\
    \n你可以通过某些选项查看有关信息的详细信息。\n\n### 选项 -a – 活跃和不活跃内存\n\n选项 `-a` 还指定内存的活跃和不活跃状态。\n\n\
    ### 选项 -t – 时间戳\n\n使用选项 `-t` 查看每行的时间戳。\n\n```bash\nvmstat -t\n```\n\n![包含橙色、房间的图片\
    \ 自动生成的描述](img/00014.jpeg)\n\n### 选项 -d – 磁盘\n\n使用选项 `-d`，你可以如下所示查看磁盘状态：\n\n![手机截图\
    \ 自动生成的描述](img/00015.jpeg)\n\n"
- fmt: '

    The data about the hard drives provides three columns with reads, writes, IO.
    In the summarize there is a full list of written sectors, readable sectors, and
    the time to access this information.


    ## The option -s – switch


    With the option `-s`, you are able to see the events and memory statics.


    ![A screenshot of text Description automatically generated](images/00016.jpeg)


    ## The iostat command – CPU and I/O statistics


    `iostat` is a tool that monitors data about input and output devices and the CPU.
    In order to optimize all sources, it is essential to have a clear idea of the
    loading time of each device, the average to transfer files, etc.


    Attempting to execute the command `iostat` you may find a similar output that
    asks to install `sysstat`:


    ```

    iostat

    ```


    ![A screenshot of a social media post Description automatically generated](images/00017.jpeg)


    Type the following command as it follows:


    ```bash

    sudo apt install sysstat

    ```


    ![A picture containing indoor, bird Description automatically generated](images/00018.jpeg)


    Just type “y” to continue with the `sysstat` installation.


    ![A picture containing indoor, bird Description automatically generated](images/00018.jpeg)


    Once that the installation is completed type again:


    ```bash

    iostat

    ```


    You are then able to display the information as it follows:


    ![A screenshot of a cell phone Description automatically generated](images/00019.jpeg)


    ### The option -c – CPU statistics


    The option `-c` is used to display only the statistics related to CPU:


    ```bash

    iostat -c

    ```


    Statistics on the CPU usage are useful to identify how to figure out the slowdowns
    of the machine, especially if it only has one instead of two.


    ### The option -d – Disk I/O statistics


    The option `-d` is used to display only the partitions of the disk showing the
    devices such as `sda`. Information includes the time of response to write on disks
    displayed in disk.


    ```bash

    iostat -d

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00020.jpeg)


    The operating system stores all the information on the memory. The best way to
    perform successfully this activity is saving data on a temporary memory instead
    of just using the physical memory. Accessing to what is called “cache”, your information
    can be delivered more quickly.


    ### The option -p – Disk I/O statistics


    Once that you know the disk you would like to take in exam, you can further investigate
    about it, using the option `-p` as it follows here:


    ```bash

    iostat -p loop0

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00021.jpeg)


    As shown above, there is specific information about the device `loop0` that describes
    the speed rate on writing, reading, etc.


    ### The option -N – LVM statistics


    The option `-N` offers information about the statisticd on LVM:


    ```bash

    iostat -N

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00022.jpeg)


    ### The option -v – Iostat Version


    Type the option `-v` to find out the `iostat` version.


    ## The iotop command


    `iotop` is a utility that can be installed on the Ubuntu distributions to trace
    activities that use input and output devices. It makes use of the kernel and python
    to work.


    In Ubuntu, the `iotop` utility can be easily installed through the `apt` command.
    Type the `iotop` command to see the results:


    ![A screenshot of a social media post Description automatically generated](images/00023.jpeg)


    Then, when the installation is completed, run the command:


    ```bash

    sudo iotop

    ```


    The results of the command show a list with the columns `TID`, `PRIO`, `USER`,
    `DISK READ`, `DISK WRITE`, `SWAPIN`, `IO>`, and `COMMAND`. The column `command`
    refers to the type of process or thread taken in exam, while the other columns
    just displays the time to read and write while waiting for a I/O. The `IO` command
    operates on the I/o usage for each process. `Swapin` works on the swap usage of
    each listed process.


    You can also apply a filter to view only the processes that show more specific
    information toward the I/O:


    ![A screenshot of a cell phone Description automatically generated](images/00024.jpeg)


    Some useful options for this command are:


    *   Option `-d SEC`, `--delay=SEC`. It sets the delay between iterations in seconds
    (1 second by default). It accepts non-integer values such as 1.1 seconds.

    *   Option `-p PID`, `--pid=PID`. It provides a list of processes/threads to monitor
    (all by default).

    *   Option `-u USER`, `--user=USER`. It provides a list of users to monitor (all
    by default).

    *   Option `-P`, `--processes`. It only shows processes. Normally `iotop` shows
    all threads.

    *   Option `-a`, `--accumulated`. It shows accumulated I/O instead of bandwidth.
    In this mode, `iotop` shows the amount of I/O processes have done since `iotop`
    started.

    *   Option `-k`, `--kilobytes`. It uses kilobytes instead of a human friendly
    unit. This mode is useful when scripting the batch mode of `iotop`. Instead of
    choosing the most appropriate unit `iotop` will display all sizes in kilobytes.

    *   Option `-t`, `--time`. It adds a timestamp on each line (implies `--batch`).
    Each line will be prefixed by the current time.

    *   Option `-q`, `--quiet`. It suppresses some lines of header (implies `--batch`).
    This option can be specified up to three times to remove header lines.


    Type `man iotop` to see all the options available as reported here above.


    ## The htop command


    The `htop` command is a tool available in Ubuntu with no installation. It’s a
    good alternative to the `top` command and similarly provides the real-time processes
    currently executing.


    Type the command to see the results:


    ```bash

    htop

    ```


    ![A screenshot of a cell phone Description automatically generated](images/0025.jpeg)


    As shown above, you are able to scroll in vertical to see the list and then horizontal
    to see the full overview. You can directly kill a process no need to enter the
    PID. Also, `htop` is more user friendly because you can use the pointer to select.
    Some of the main information highlighted is the CPU usage, Memory usage, and Time.


    Below that, you find the statistics about the CPU, Memory, Swap and also shows
    tasks, load average, and Up-time.


    Like shown in the example, you find a progress bar with different colors. Each
    color matches with a meaning:


    *   Blue: CPU usage with low priority

    *   Green: CPU usage with regular priority

    *   Red: CPU usage with system processes

    *   Orange: CPU usage through IRQ time

    *   Magenta: CPU usage with regular priority through Soft IRQ time

    *   Grey: CPU usage through IO Wait time

    *   Cyan: CPU usage through Steal time


    What indicates the tabs in the columns? Here you can review more details what
    each term stands for:


    *   `PID`: Process ID

    *   `USER`: The who is using the machine

    *   `PRI`: The priority of a process

    *   `N`: The priority of process reset by the user or root.

    *   `VIR`: Virtual memory in use

    *   `RES`: Physical memory in use

    *   `SHR`: Shared memory in use

    *   `S`: The state of a process

    *   `CPU%`: CPU usage by process

    *   `MEM%`: Memory usage by process

    *   `TIME+`: Time needed to execute a process

    *   `Command`: The process itself is referred to.


    All the processes are by default filtered according to the CPU usage. Some additional
    functionalities can be tried using the keyboards:


    *   Up and Down: Use the keyboard to see the processes

    *   `U`: Use it to processes of a particular user

    *   `P`: To filter the process with higher CPU usage

    *   `M`: To filter the processes with higher memory usage

    *   `T`: To filter the processes depending on the time

