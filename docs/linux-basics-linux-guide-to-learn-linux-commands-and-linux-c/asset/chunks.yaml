    \ 当前目录\n* `Rtd`: 根目录\n* `Txt`: 文本文件\n* `Mem`: 内存映射文件\n\n然后，后续的值是：\n\n* `R`: 读取\n\
    * `W`: 写入\n* `U`: 读写\n\n# 用于健康检查的其他工具\n\n## Nmon 工具\n\n该工具的目标是分析系统在 cpu、内存、网络、磁盘、文件系统、nfs、顶层进程、资源和功率微分区方面的性能。\n\
    \n在 Ubuntu 发行版中，你需要使用以下命令安装该工具：\n\n```bash\nsudo apt install nmon\n```\n\n安装完成后，运行下面的命令\
