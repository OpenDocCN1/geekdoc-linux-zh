- fmt: '

    A frequent operation in Linux requires to create scheduled tasks. To accomplish
    this activity, you may use `Cron`, a handful utility that can enable tasks that
    work on the background while you are working on other files. You can decide when
    to schedule these tasks so that they work at different times such as backup, notifications,
    cleanup system files, synchronize files, and more. All these operations are called
    “cron jobs” and they can be run with the `crontab` command. The “tab” refers to
    the tables where all the tasks are listed.


    In this short introduction to this section, you may revise how to check if you
    already have a version of `Cron` installed in your system, then run the task through
    the command line.


    Users can create their own cron jobs which are collected in the directory `/var/spool/cron/crontabs`,
    although it is only accessible through the command line.


    ## Permissions on crontabs


    The file in the directory `/etc/cron.deny` can limit user to edit the crontab.
    If the file `cron.deny` exists, the name of the user is usually listed in this
    file and this means that the user is not able to apply changes to the cron jobs.
    On the other hand, if the file `cron.allow` is available under the same directory
    `/etc/` it means that only the users listed are able to edit the scheduled jobs.
    When both the files exist at the same time, the `cron.allow` fiel is able to override
    the `cron.deny` file.


    The information is usually available in these folders:


    * `/etc/cron.allow`

    * `/etc/cron.deny` (editing the file we may disable some users to the features)

    * `/var/spool/cron/crontabs`


    Cron is usually already installed in the Linux distributions. Just in case you
    don’t have a version ready to be run, you may proceed with updating the APT:


    ```bash

    sudo apt update

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00048.jpeg)


    After completing the update, you should have a similar screenshot showing the
    number of packages upgraded for the APT.


    And then, you can go on installing Cron:


    ```bash

    sudo apt install cron

    ```


    When the installation is completed, you can start the Cron Service. You have to
    use the `sudo` before the command to run the commands as an administrator.


    ```bash

    sudo service cron start

    ```


    After that, you can check the status of the Cron Service. Here below you can see
    how it should look like. The service results to be enabled with the status “active
    (running)”.


    ![A close up of a newspaper Description automatically generated](images/00049.jpeg)


    All the times that you would like to add a scheduled task, you open to edit the
    crontab file and edit it adding an expression.


    Running the following command, you are able to edit the crontab file for the current
    user:


    ```bash

    crontab -e

    ```


    ## The expressions with the crontabs


    To create the expressions there is a precise syntax that you could follow:


    ```bash

    0 7 * * * /root/backup.sh

    ```


    This example executes a backup at 7 am. No information has been provided for day
    of month, month of the year, and day of the week. This means that the con job
    is activated and repeated each day.


    Here below a summarize of the expression:


    * First position: Minute with values between 0 and 59 – In the example the value
    is 0

    * Second position: Hour with values between 0 and 23 – In the example the value
    is 3

    * Third position: Day of Month with values between 1 and 31 – In the example the
    value is `*`

    * Fourth position: Month of the year with values between 1 and 12 or Jan through
    Dec – In the example the value is `*`

    * Fifth position: Day of week with values between 0 and 6 or Sun through Sat –
    In the example the value is `*`

    * Sixth position: Script or command (This includes the path to the command) –
    In the example the value is `/root/backup.sh`


    The operators for the cron jobs are:


    * Asterisk (`*`): all values or any possible one for the field

    * Comma (`,`): refers to a list of different values

    * Dash (`-`): refers to a range of values

    * Separator (`/`): refers to 1/10 or increment of a range


    Examples of use that combine an operator with the number shown in a position like
    here:


    * `* * * *` - Executes the operation every minute.

    * `15 * * * *` - Executes the operation 15 minutes after every hour.

    * `0,15,30,45 * * * *` - Executes the operation every 15 minutes.

    * `*/15 * * * *` - Executes the operation every 15 minutes.

    * `0 5 * * *` - Executes the operation every day at 5:00 AM.

    * `0 7 * * 2-4` - Executes the operation every Tuesday, Wednesday, and Thursday
    at 7:00 AM.

    * `15,30 */7 * 7-12 *` - Executes the operation on the 15th and 30rd minute of
    every 7th hour every day of the last 6 months of the year


    Another example to clarify the use of expressions:


    ```bash

    15 7 10 * * /root/backup.sh

    ```


    With the command here above, the cron job has been setup to run a backup every
    10 of the month at 7:15.


    An example with the day in letters:


    ```bash

    30 2 * * mon /root/backup.sh

    ```


    The task runs a backup every Monday at 2:30.


    ## How to list the Cron jobs


    As seen earlier, the cron jobs run on the background and the deamons is able to
    read the information. The option `-e` refers to the user.


    ```bash

    crontab -e

    ```


    Running the command, usually a list of choices for the text editor is presented
    to you. By default, the editor widely used is Nano if no option is listed:


    * `/bin/nano`

    * `/usr/bin/vim.basic`

    * `/usr/bin/vim.tiny`

    * `/bin/ed`


    If you are able to decide the editor, you can just enter the option from 1 to
    4.


    The `option -l` instead refers to the list. It allows to view the file without
    editing it:


    ```bash

    sudo crontab -l

    ```


    Even if you are running the command with `sudo`, you may not be able to execute
    the code if the file `cron.deny` exists or the `cron.allow`.


    Or you can also use the command here below specifying the username:


    ```bash

    sudo crontab -u user1 -l

    ```


    Usually this command should be executed with `sudo` because only the administrator
    has the privileges to the cron jobs.


    ## How to delete the cron jobs


    You can decide to delete all the cron jobs. The `option -r` stands for “erase”
    and it can be applied with the following command:


    ```bash

    crontab -r

    ```


    Also, you can delete the cron job for a specific user such as `user1`:


    ```bash

    crontab -r -u user1

    ```


    Another option also offers the chance to confirm before deleting:


    ```bash

    crontab -i -r

    ```


    ## The strings in Crontab


    Another useful feature of the Cron Jobs is the use of strings that allow to avoid
    a waste of time not repeating the same part of the expressions. Here there is
    list:


    * `@hourly`: Performed once every hour i.e. `0 * * * *`

    * `@midnight`: Performed once every day i.e. `0 0 * * *`

    * `@daily`: Performed when is midnight

    * `@weekly`: Performed once every week i.e. `0 0 * * 0`

    * `@monthly`: Performed once every month i.e. `0 0 1 * *`

    * `@annually`: Performed once every year i.e. `0 0 1 1 *`

    * `@yearly` or `@annually`: Performed once a year

    * `@reboot`: Performed once at startup


    ## Other examples to schedule tasks


    Though seems very simple at the beginning, it is obvious that there are commands
    that may result more complex when you try to manage the commands for specific
    tasks.


    This is the syntax to create a log file:


    ```bash

    0 * * * /path/to/your/script >> /var/log/cron.log

    ```


    Check out the execution of the cron job in the syslog:


    ```bash

    grep ''CRON.*(yourusername)'' /var/log/syslog

    ```


    For more details about the `crontab` command in Linux Ubuntu, you can enter as
    it follows here:


    ```bash

    man crontab

    ```

