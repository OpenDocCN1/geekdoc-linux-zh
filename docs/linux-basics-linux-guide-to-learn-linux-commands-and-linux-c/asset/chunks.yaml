    颜色的变化代表了重要性，让你一眼看出应该优先关注哪里。绿色表示一切正常。蓝色则需要我们留意以弄清楚发生了什么。紫色表示警告，而红色则指出需要快速采取行动的关键问题。


    ## Glances 选项


    在这里你还可以找到一些用于显示特定细节的选项：


    * `a`: 自动列出进程

    * `c`: 按 CPU 占用列出进程

    * `m`: 按内存占用列出进程

    * `p`: 按名称列出进程

    * `i`: 按 I/O 速率列出进程

    * `d`: 显示或隐藏磁盘 I/O 统计信息

    * `f`: 显示或隐藏文件系统统计信息

    * `n`: 显示或隐藏网络统计信息

    * `s`: 显示或隐藏传感器统计信息

    * `y`: 显示或隐藏 hddtemp 统计信息

    * `l`: 显示或隐藏日志

    * `b`: 网络 I/O 使用字节 (Bytes) 或比特 (bits)

    * `w`: 移除警告日志

    * `x`: 移除警告和严重日志

    * `t`: 检查网络和 I/O 设备设置

    * `u`: 检查累计网络 I/O


    该工具还允许通过网络界面（Web UI）监控本地机器，或将统计数据导出到 CSV 文件。


    你可以通过帮助选项 `-h` 或输入 `man glances` 查看关于 Glances 的所有信息。


    退出该工具请按 quit：


    ```

    q

    ```


    ## 什么是服务？


    当应用程序运行时，任务会在机器上执行。服务会等待请求并给出回答。


    你可能的问题是你的操作系统中有哪些可用服务。为了回答这个问题，你可以在这里列出所有可的服务：


    ```bash

    service --status-all

    ```


    ![一张手机截图，描述：自动生成](img/00039.jpeg)


    ## Systemd 工具


    Systemd 是一个系统和服务管理器，可以在进程运行时运行时跟踪它们。你可以使用这个实用的工具来运行、停止或重启服务。在 Systemd 中，单元（units）是可识别为服务的块，例如
    `(.service)`、`(.device)`、`(.sockets)`、slice 等……


    服务可以并行运行，利用了一种显示服务的新方式。


    在启动时，系统在 BIOS 通过引导程序调用后被加载。之后，内核（Kernel）加载 systemd 并运行进程。此时，用户被加载，其环境也通过 systemd
    加载。


    以下是一些需要记住的目录，用于查找单元文件：


    * `/usr/lib/systemd/user/`: 在每个用户创建的文件夹下，你可以找到所有文件

    * `/run/systemd/system/`: 单元文件的运行时位置

    * `/etc/systemd/system/`: 单元文件可以通过将其存储在此文件夹中进行扩展。


    运行 `systemctl` 命令，可以获取 Systemd 下所有可用单元的列表：


    ```bash

    systemctl

    ```


    ![一张包含文本的图片，描述：自动生成](img/00040.jpeg)


    在列表中，你可以看到 `Unit`（单元）、`Load`（加载）、`Active`（激活）、`Sub`（子项）的状态，以及总结每行单元类型的 `Description`（描述）。


    然后运行以下命令来查看每个单元当前状态的单元文件列表：


    ```bash

    systemctl list-unit-files

    ```


    ![一张手机截图，描述：自动生成](img/00041.jpeg)


    你也可以显示初始化失败的单元：


    ```bash

    systemctl –failed

    ```


    要将分析限制为仅服务而不是所有服务的列表，你可能需要使用以下命令：


    ```bash

    systemctl list-unit-files –type=service

    ```


    要启动服务，输入单词 `start`，然后是服务名称以及扩展名 `.service`：


    ```bash

    systemctl start name.service

    ```


    要停止服务，输入单词 `stop`，然后是服务名称以及扩展名 `.service`：


    ```bash

    systemctl stop name.service

    ```


    要重启服务，输入单词 `restart`，然后是服务名称以及扩展名 `.service`：


    ```bash

    systemctl restart name.service

    ```


    要重载服务，输入单词 `reload`，然后是服务名称以及扩展名 `.service`：


    ```bash

    systemctl reload name.service

    ```


    要查看服务状态，输入单词 `status`，然后是服务名称以及扩展名 `.service`：


    ```bash

    systemctl status name.service

    ```


    ### 启用和禁用服务


    可以使用 Systemctl 相应的启用和禁用服务。以下命令用于启用服务：


    ```bash

    systemctl enable name.service

    ```


    下方的命令用于禁用服务：


    ```bash

    systemctl disable name.service

    ```


    ### 掩蔽或取消掩蔽服务


    每个服务都可以被掩蔽或取消屏蔽，以避免所有单元同时运行。


    这是运行掩蔽服务的命令：


    ```bash

    systemctl mask name.service

    ```


    这是运行取消掩蔽服务的命令：


    ```bash

    systemctl unmask name.service

    ```


    ## Acct 工具


    Acct 工具是一个后台运行的应用程序，用于监控用户运行的操作。该工具的目标是检查任务消耗的资源。作为开发者或管理员，你经常需要确保使用量不会超过阈值且性能稳定。否则，Apache
    Web Server 等服务可能会出现严重问题，导致加载重要文件时出现延迟。因此，拥有像 Acct 这样的工具对于减少使用不同命令解决相同问题的时间非常有帮助。


    该工具的一些主要功能是：


    * 登录和注销的用户统计

    * 访问机器的用户统计

    * 用户之前执行过的命令仍然可用


    要安装 Acct 工具，你可以像下面所示使用 APT：


    ```bash

    sudo apt-get install acct

    ```


    在这种情况下，你需要在开头运行 `sudo` 以获得 root 权限运行命令。


    输入以下命令查看从 `wtmp` 文件中收集的数据。它们提供了用户连接系统的时间：


    ```bash

    ac

    ```


    ![](img/00042.jpeg)


    ### -d 选项


    `option -d` 显示以天为单位的时间：


    ```bash

    ac -d

    ```


    ![电脑截图，描述：自动生成](img/00043.jpeg)


    ### -p 选项


    `option -p` 显示每个用户的总登录时间：


    ```bash

    ac -p

    ```


    ![](img/00044.jpeg)


    ### sa 命令


    执行 `sa` 命令可以查看可用且最近执行的命令摘要：


    ```bash

    sa

    ```


    ![一张手机截图，描述：自动生成](img/00045.jpeg)


    对收集的数据表格进行详细分析，可以看到每一列对应的内容：


    * 第 2 列 `0.00re` - 墙钟时间（分钟）

    * 第 3 列 `0.00cp` - 系统/用户时间（cp）

    * 第 5 列 `1131k` – 单位数量对应的 CPU 时间

    * 第 6 列 `ac` – 所指的命令


    ### -u 选项


    `option -u` 显示单个用户的信息：


    ```bash

    sa -u

    ```


    ### -m 选项


    `sa` 命令结合 `option -m` 显示以 CPU 分钟表示的进程数：


    ```bash

    sa -m

    ```


    ![一张手机截图，描述：自动生成](img/00046.jpeg)


    ### -c 选项


    `sa` 命令结合 `option -c` 显示用户的百分比：


    ```bash

    sa -c

    ```


    ![一张手机截图，描述：自动生成](img/00047.jpeg)


    # 如何创建计划任务


