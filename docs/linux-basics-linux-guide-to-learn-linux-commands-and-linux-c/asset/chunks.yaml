    按下 `CTRL + C` 退出该工具。\n\n![手机截图描述，自动生成](img/00028.jpeg)\n\n### “t”选项 – 顶层进程\n\n\
    `t` 选项列出顶层进程：\n\n```bash\nnmon -t\n```\n\n![手机截图描述，自动生成](img/00029.jpeg)\n\n###\
    \ “r”选项 – 资源\n\n`r` 选项显示所用资源信息，可以是 CPU。\n\n![电脑截图描述，自动生成](img/00030.jpeg)\n\n\
    ### “n”选项 – 网络\n\n`n` 选项显示网络详细信息。\n\n### “d”选项 – I/O 磁盘\n\n`d` 选项显示 I/O 磁盘信息。\n\
    \n### “k”选项 – 内核\n\n`k` 选项显示内核信息。\n\n### “n”选项 – NFS\n\n`n` 选项显示 NFS 数据信息。\n\n\
    ### “j”选项 – 文件系统\n\n`j` 选项显示文件系统信息。\n\n## Collectl 工具\n\n除了“top”和“htop”命令外的额外工具是\
    \ Collectl。Collectl 工具可以提供关于 cpu、内存、网络、磁盘、文件系统、nfs、顶层进程、资源和功率微分区的详细信息。Collectl\
    \ 工具可以提供……（此处原文有重复，已对应翻译）除了“top”和“htop”命令外的额外工具是 Collectl。Collectl 工具可以提供关于 cpu、内存、网络、磁盘、文件系统、nfs、顶层进程、资源和功率微分区的详细信息。Collectl\
    \ 工具可以提供…… \n\n除了“top”和“htop”命令外的额外工具是 Collectl。Collectl 工具可以提供关于 cpu、内存、网络、磁盘、文件系统、nfs、顶层进程、资源和功率微分区的详细信息。\n\
    \n（注：原文中存在多处段落重复，已按要求逐行翻译并保持了格式对应）\n\n...（此处根据原文逻辑继续翻译重复部分）\n\n"
- fmt: "\n- **Waiting**: The process is waiting for an answer from a program or some\
    \ resource which is fundamental to the process in order to accomplish the directions.\
    \ Some processes may be interrupted if they are waiting for some services or not\
    \ physical sources. If they are waiting to use for example the hard drive, processes\
    \ cannot be interrupted.\n- **Stopped**: The process stopped to work for some\
    \ reasons such as the debug mode.\n- **Zombie**: The process is listed but it\
    \ does not work anymore.\n\nSome of the most useful commands in Linux to manage\
    \ operations with processes are `ps` and `top` commands.\n\n## The command `ps`\n\
    \nThe word `ps` stands for process status. Executing this command, you can see\
    \ the processes currently active:\n\n![A screenshot of a cell phone Description\
    \ automatically generated](images/00033.jpeg)\n\nIf you want to list all the processes\
    \ use one of the two choices:\n\n```bash\nps -a\n```\n\n```bash\nps -e\n```\n\n\
    ## Monitoring processes through `kill`, `pkill` and `killall`\n\n### The `kill`\
    \ command\n\nKnowing what is the PID of a process is essential to act and kill\
    \ it. In case you want to kill the Chrome process you need to know the name of\
    \ the process:\n\n```bash\npidof chrome\n```\n\nNow that you have the PID, you\
    \ can directly kill the process:\n\n```bash\nkill PID_NUMBER\n```\n\nAfter that,\
    \ you can check to see if the Chrome process is still active:\n\n```bash\npidof\
    \ chrome\n```\n\nAnother useful option is applying the `kill` command to delete\
    \ multiple processes at the same time with only one command like here:\n\n```bash\n\
    kill PID_NUMBER1 PID_NUMBER2\n```\n\nAlways keep in mind that each user is able\
    \ to kill its own processes but not the ones belonging to another user as well\
    \ as the System processes. Only a user with the root privileges is allowed to\
    \ kill processes from any user or System processes.\n\n### The `pkill` command\n\
    \nInstead of using the PID which is the number that identifies the process, you\
    \ can apply the same concept to delete a process by name. In the example that\
    \ follows here you are going to use the `pkill` command to kills the MySQL process.\n\
    \n```bash\npkill mysqld\n```\n\n### The `killall` command\n\nAs you can imagine\
    \ from the name, the `killall` command is able to kill all processes related to\
    \ a main process. For example, if you have a parent process with child processes\
    \ and other instances, it will take time to figure with what processes to act.\
    \ While using the `killall` command is much easier.\n\nRepeating similarly the\
    \ example seen previously, you can kill the MySQL process like here below, deleting\
    \ all the instances linked to it:\n\n```bash\nkillall mysqld\n```\n\nFinally,\
    \ always check if the process is still running or not using the `pidof` command:\n\
    \n```bash\npidof mysqld\n```\n\n### The `pgrep` utility\n\n`Pgrep` is a valid\
    \ alternative utility used for a similar purpose to what we have seen earlier.\
    \ `Pgrep` is a command that allows to find the ID of a process. Executing this\
    \ command from the command line, it returns the numeric values.\n\nFor instance,\
    \ if you want to find the PID of the SSH server, you can type the following command:\n\
    \n```bash\npgrep ssh\n```\n\nThe output should show something similar to here.\
    \ If nothing matches with the name of the program requested, it should report\
    \ a “0” value meaning that there are no entries with what you are looking for.\n\
    \n![A screenshot of a cell phone Description automatically generated](images/00034.jpeg)\n\
    \nAfter identifying the PID, you are able to use the same command `kill` followed\
    \ by the name ID.\n\nIf you would like to know the name too for each entry listed,\
    \ you apply the option `-l` as here below:\n\n```bash\npgrep ssh -l\n```\n\nThe\
    \ command shown displays the name `sshd` so that you are to see to what each PID\
    \ matches with.\n\n![A screenshot of a cell phone Description automatically generated](images/00035.jpeg)\n\
    \n## Monitoring Tools\n\n### Glances tool\n\n`Glances` is a cross-platform tool\
    \ that works on a variety of operating systems and Linux distributions. Written\
    \ in Python this tool operates on real-time and monitors the performances of these\
    \ resources:\n\n* CPU\n* Memory\n* Load\n* Process list\n* Network interface\n\
    * Disk I/O\n* IRQ / Raid\n* Sensors\n* Filesystem\n* Docker\n* Monitor\n* Alert\n\
    * System info\n* Uptime\n* Quicklook (CPU, MEM, LOAD)\n\n`Glances` can be used\
    \ as a replacement to the `top` command because it works with more precision providing\
    \ detailed data about each resource, its usage in the system, and evidencing which\
    \ resources are making more use.\n\n### Installing Glances\n\n`Glances` is not\
    \ a native application in Linux Ubuntu. Running the command `glances` Ubuntu requires\
    \ to install the application through the APT:\n\n```bash\nglances\n```\n\n![A\
    \ screenshot of a cell phone Description automatically generated](images/00036.jpeg)\n\
    \nThen, start the installation of glances with the command:\n\n```bash\nsudo apt\
    \ install glances\n```\n\nThe command line asks if you want to continue because\
    \ installing the software requires around 100MB of additional space. Type “Y”\
    \ to complete the installation.\n\n![](images/00037.jpeg)\n\nAll the packages\
    \ would be download and installed.\n\nNow, run again the command:\n\n```bash\n\
    glances\n```\n\nThe new utility installed should show something similar to this\
    \ here below:\n\n![A screenshot of a cell phone Description automatically generated](images/00038.jpeg)\n\
    \nIn this utility you find a summary section with all information about the system\
    \ that can be scrolled horizontally. \n\nFrom the top, in the first row you find\
    \ hostname, the Linux distribution, the kernel version, and the system uptime.\n\
    \nIn the next row, there is a list of data reported about CPU, memory usage, swap,\
    \ and load statistics. All information is shown in percentage with a short summarize\
    \ at the beginning of the row on the left.\n\nFor what concerns the CPU, `Glances`\
    \ offers many details about:\n\n* `CPU`: CPU usage in percentage\n* `User`: Applications\
    \ available in the user environment\n* `System`: Kernel applications running\n\
    * `Idle`: Idle time\n* `Nice`: This value defines the priority of processes\n\
    * `Irq`: Requests that interrupts the CPU\n* `Iowait`: Waiting state for I/O inputs\
    \ before running again a process\n* `Steal`: The virtual CPU is waiting for the\
    \ physical CPU which is working on other processes\n* `Ctx-sw`: Context switches\
    \ per second\n* `Inter`: “Inter” stands for interruptions and it means the time\
    \ needed to interrupt the use of the CPU from working on a device\n* `Sw_int`:\
    \ Interruptions related to the software\n\nFor what concerns instead the memory\
    \ you find more details here below:\n\n* `MEM`: Memory usage expressed in percentage\n\
    * `Total`: The total amount of RAM physically installed on the machine\n* `Used`:\
    \ The amount of memory excluding cache or buffers\n* `Free`: The memory still\
    \ available\n* `Active`: The current actively used memory\n* `Inactive`: The current\
    \ not actively used memory\n* `Buffers`: Buffer space usually used to connect\
    \ with the input or output devices\n* `Cached`: The memory used to temporarily\
    \ save date before moving them to a physical memory\n\nIn the process section\
    \ you find information about the processes currently running on the machine:\n\
    \n* `CPU%`: The CPU for each core expressed in percentage\n* `MEM%`: The RAM memory\
    \ used by each process while running\n* `VIRT`: The virtual memory used by each\
    \ process expressed in Megabytes\n* `RES`: “RES” refers to resident, which means\
    \ the physical memory used by each process expressed in kilobytes, megabytes,\
    \ and gigabytes depending on the amount of space available\n* `PID`: ID number\
    \ that identifies each process\n* `USER`: The name of the user who is running\
    \ the process\n* `TIME+`: Cumulative amount of CPU time used by each process since\
    \ the beginning\n* `THR`: Threads running for the process\n* `NI`: The nice number\
    \ of the process\n* `S`: “S” stands for status; it can be R - running, S - sleeping,\
    \ I - Idle, T or t - stopped during a debug mode, or Z - Zombie when the process\
    \ died, and it is not anymore available but still visible in the list of processes\n\
    * `R/s` and `W/s`: Rate time to read and write the disks\n* `Command`: The command\
    \ that activated the process currently under analysis\n"
