    As suggested by the name, this log file is used to monitor information on the
    failures on login sessions.


    The path for the Login Failog Log files is:  /var/log/faillog


    In Ubuntu versions as well as other distributions, the faillog log files are placed
    in the directory /var/log/faillog. In order to display the failure on logins on
    Ubuntu, execute the following command from the terminal:


    faillog


    The syslogd (System Logging Daemon)


    Both used for Linux and Unix operating systems make use of the syslogd also known
    as System Logging Daemon. It handles messages from different sources putting them
    in communication with the final destination. The syslogd works through the configuration
    file, reading information reported and forwarding the messages to the specified
    recipient.


    The path of the configuration file is:  /etc/syslog.conf.


    Each life of this file contains the selector and the action, which respectively
    is identified with the facility that matches with the recipient. The facility
    is meant as the process that triggers an event.


    Taking the example here below, the line of that will be forwarded to the configuration
    file is made of the facility “mail” and the action “/var/log/mail” which is the
    file of destination.


    Defining the priorities


    Also, the line consists in a priority assigned to the facility. The level of priority
    varies each time separated by “.”.


    mail.emerg /var/log/mail


    Some examples of facilities are auth, daemon, and more. Priorities are listed
    from the lowest in terms of importance like “debug, info, notice, warning, err,
    crit, alert” to the highest level “emerg”.


    As shown in the example, “mail” is the facility while “emerg” is the priority.


    You can also use the @ to redirect the message to a hostname.


    *.emerg     @mail.domain.com


    The message will be interpreted by the system taking all messages with priority
    “emerg” and sending them to the user with the hostname mail.domain.com.


    In fact, the symbol “*” means all the facilities. Typing as it follows here below
    you will refer to all the facilities and all levels of priority:


    *.*     @mail.domain.com


    Then, the “=” indicates messages with similar priority, while usually it is applied
    to the ones which have the same level or an increasing number.


    As opposite to the equal sign, the “!” sign is used to apply the rules of message
    and exclude the ones with certain priorities.


    In the configuration file, in the same line with the action that has to be sent,
    more selectors can be added using the “;” symbol. Moreover, also facilities can
    be added using the “,” symbol that separates one from each other.  


    What does a log file contains?


    Open the terminal and execute the following command to move to the folder containing
    the logs:


    cd /var/log


    “cd” is the command used in the Unix operating systems to move from the current
    position to another folder separated by “/”.


    Then type the following command to see the content listed under the folder “log”:


    ls


    ![A screenshot of a cell phone Description automatically generated](images/00002.jpeg)


    The example above shown a screenshot from the console using Amazon AWS. Some of
    the directories listed are the same took in exam at the beginning of this guide.


    When displaying this information, you may find some sort of duplicates such as
    “daemon.log.0” reported in sequence with different numbers. Don’t panic. These
    files are generated by the system copying and pasting the initial file to generate
    new ones. The starting files are not completely deleted from your operating system,
    but they are compressed separately. This utility known as log rotation works efficiently
    to save some space. As a result, you may find in your list of files something
    similar to daemon.log.0.gz that indicates the files compressed in the .gz archive.


    One of the easiest ways to edit files with no issues is just using the “nano”
    command in the console. Typing the example below you are able to read the content
    of the kernel.log file:


    nano kernel.log


    Once you finished with your edits, you can simply close it using the combination
    CTRL + C.


    Other two helpful features to edit the log files are “head” and “tail”. These
    two commands are used to show the head of the file, and the content at the bottom.


    head file.log


    Using the command “head” you will be able to view the first lines at the top of
    the file file.log.


    If you need to display an amount of lines at 15 from the beginning, just type:


    head -n 15 file.log


    As a consequence, the command “tail” works as the opposite to the head command.
    This command shows exactly the content at the bottom:


    tail file.log


    Like the head command also tail has the same functionalities. Specifying the number
    of lines, it shows 15 lines instead of the fixed number of 10 lines:


    tail -n 10 file.log


    If you need to monitor at the same time a file and see edits on the file you can
    use the command line “tail -f”:


    tail -f file.log


    Another command you may perform is any search of the log files in terms of content.
    You may want to use the command here below to seek the word “mail” in the file
    file.log:


    grep "mail" file.log


    Also, you can use grep with “^” to look for words repeated in each line:


    grep "^mail" file.log


    # Managing Users and Groups


    Knowing how to manage users and groups is a critical task for any user or administrator.
    One of the main reasons is because good practices on the management can be effective
    on the security of the network and the system. Also, it is essential to be confident
    about this topic to protect your data from external sources.


    Before starting to mention any command used to these procedures you should be
    aware of how users and groups work. 


    Each user is separated from others and under its account there are folders, files,
    and applications that are being used while in action. So, once the session is
    active with the specific user the operations are completed with a profile. Also,
    the user has a home directory assigned to it with the same name.


    By default, a new operating system that is installed has a username defined as
    “root user”.


    Type the following command to work as the root administrator:


    su'
