    FD, TYPE, DEVICE SIZE/OFF, and NODE NAME.


    Digging into more information about it, FD means “File descriptor” and accepts
    the values:


    *   Cwd: current directory


    *   Rtd: root directory


    *   Txt: text file


    *   Mem: memory-mapped file


    Then, the values are followed by:


    *   R: Read


    *   W: Write


    *   U: Read and write


    Other utilities for your health check


    The Nmon Utility


    The utility has the goal to analyze the performances of a system regarding the
    cpu, memory, network, disks, file systems, nfs, top processes, resources, and
    power micro-partition.


    In the Ubuntu distributions you need to install the utility with the following
    command:


    sudo apt install nmon


    When the installation is completed, launch the command here below “nmon”:


    nmon


    As shown below all the statistics are shown. With the option “c” you are able
    to filter the information about the CPU.


    Press CTRL + C to exit from the utility.


    ![A screenshot of a cell phone Description automatically generated](images/00028.jpeg)


    The option “t” – Top processes


    The option “t” shows the top processes listed:


    nmon -t


    ![A screenshot of a cell phone Description automatically generated](images/00029.jpeg)


    The option “r” – Resources


    The option “r” displays information about the resources used which can be the
    CPU.


    ![A screen shot of a computer Description automatically generated](images/00030.jpeg)


    The option “n” – Network


    The option “n” shows the details about the network.


    The option “d” – I/O Disks


    The option “d” displays information about the I/O disks.


    The option “k” – Kernel


    The option “k” displays information about the kernel.


    The option “n” – NFS


    The option “n” displays information the data NFS.


    The option “j” – File System


    The option “j” displays information the file system.


    The Collectl utility


    An additional tool to “top” and “htop” commands is the Collectl utility. The name
    “Collectl” can give a hint about the purpose of this application. In fact, the
    utility is used to collect data about the status of the system such as cpu, disk,
    memory, network, sockets, tcp, inodes, etc.


    Some of the main functionalities are the exportation of the output in a diversity
    of formats, the monitoring of the subsystem, the monitoring of the remote machines,
    the ability to write a file or a socket.


    Typing “collectl” you see that the command is not found in Ubuntu:


    collectl


    ![A screenshot of a social media post Description automatically generated](images/00031.jpeg)


    Run the command to install “collectl”:


    sudo apt install collect


    It asks to confirm pressing “y” in order to continue the installation.


    After this, it asks what kind of web server to use. The options are Apache2, Lighttpd,
    and more. Pressing the selection and then “ok”, the installation is then completed.


    The information is about the subsystem which includes cpu, disks, and network.


    ![A screenshot of a cell phone Description automatically generated](images/00032.jpeg)


    The option “--all” – File System


    The option “--all” displays information all the subsystems.


    The option “stc” – File System


    The option “stc” displays information about the tcp and cpu.


    Here below you find a detailed list of the options:


    *   b – buddy info (memory fragmentation)


    *   c – CPU


    *   d – Disk


    *   f – NFS V3 Data


    *   i – Inode and File System


    *   j – Interrupts


    *   l – Lustre


    *   m – Memory


    *   n – Networks


    *   s – Sockets


    *   t – TCP


    *   x – Interconnect


    *   y – Slabs (system object caches)


    # Managing Processes and Services


    Before analyzing in depth handy commands to manage processes and services, we
    need to clarify what are processes and services.


    What do we mean with “process”?


    Process is an instance of a running program. As a consequence, all the times that
    an application is running, a process is initiated and an identification number
    called “PID”, that stands for Process ID, is attributed together with the group
    or the user. Processes are running at the same while the machine is working on
    different tasks using the same sources such the memory and the CPU. This means
    that whereas there is a variety of tasks completed at the same time, the number
    or sources is still the same. That’s why as an administrator you should be able
    to maximize the performances of your machine.


    Processes can be divided in two major groups which are the background processes
    and the interactive processes. With the first group we mean all the processes
    that are not started directly by the user, but they are working automatically
    on the background. One of the most famous processes is the Deamons. This category
    of processes runs on the background and with no input by the user, though they
    can be managed directly if needed. In the second case, the interactive group identifies
    the processes that are started by the user, recalling a command from the command
    line. Therefore, the user is in complete control of these processes.


    A new process


    Creating a new process for the Linux distributions means copying and then pasting
    the current process. The PID is changed to a new one as seen earlier is a different
    ID.


    In addition to the PID that identifies the process itself, each process can be
    recognized through the PPID which is the parent process ID. Executing the tasks,
    parent processes activate other processes which are the child processes that complete
    their operations at the same time.


    One of the most famous processes is the init process. This process is so important
    because is executed at the boot while still other processes are not running. For
    this reason, its ID is always 1, as it is the first process to be run. To find
    the PID of a process you can use the command “pidof”. So, if you would like to
    know the PID of system, you can use:


    pidof system


    What are the states of processes in Linux?


    A process can change the state on the run. Each process is created, then accepted
    and when is ready to be used it can be finally executed through the schedule dispatch.
    Also, a process may be put a waiting status if there are I/O sources needed or
    an event that requires the attention. The event then can change status once that
    the waiting time is completed. If there is a no hardware request, the process
    can be interrupted before being able to run. At the end of the steps, the execution
    is stopped. 


    Here below you find some examples:


    *   Running: In this state, processes are running which means that the process
    has been created and it is active'
