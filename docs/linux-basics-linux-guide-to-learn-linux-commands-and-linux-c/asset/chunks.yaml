    ## Route 命令


    在深入研究 `route` 命令之前，对 IP 路由概念有一个整体了解是有用的。我们所说的 `IP 路由` 是指主机在将数据转发到最终目的地之前，先到达另一个主机的过程。在这种方法中，接收者在中间工作并处理接收到的数据包，决定在将其发送到最终主机之前如何对其进行排序。它通常由一个路由器标识，无论最终主机是否连接，第一个主机都会使用它。在主要步骤中，会检查
    IP 地址以查看其是否属于同一个网络。然后 `TCP` 负责重建传输过程中收集的信息。


    有了这个总体的介绍，请记住你正在学习的命令的目标。通过输入 `route` 命令，你可以显示或编辑路由表。


    路由表包含有关发送和接收的数据包传输过程的信息，包括网络细节。该命令的主要功能之一是在网络中设置静态路由和接口。


    如下例所示，你可以输入该命令来访问当前路由表：


    ```bash

    route

    ```


    ![手机手机截图，自动生成的描述](img/00057.jpeg)


    截图中报告的数据提供了路由表的预览。根据列名，`Destination`（目的地）指示目标主机或网络的 IP 地址。


    然后，`Gateway`（网关）表示为过滤目的地可用数据的路由器的 IP 地址。路由器作为传输的中介，它会根据如何将接收到的数据发送到最终主机做出决策。`Flags`（标志）描述了最终接收者主机的类型，对于判断它是路由器还是其他设备很有用。此外，`Iface`
    提供了在网络中使用的接口。在所示的示例中，接口是常用的 `eth0`。


    通过路由表的过程，第一个主机尝试到达目标主机，并命名处理流量的路由器。通过这样，即使最终主机不在发送者的同一个网络中，也可以进行通信。


    `route` 命令有一些可以添加的选项，以略有不同的显示信息。通过选项 `-n`，你可以以数字形式查看 IP 地址列表：


    ```bash

    route -n

    ```


    ![手机手机截图，自动生成的描述](img/00058.jpeg)


    IP 地址 `ip-172-31-32-1` 现在被数字 `172.31.32.1` 替换。


    使用相同的命令，你还可以设置默认网关，以便在最终 IP 地址不属于同一个网络时使用：


    ```bash

    route add default gw 172.31.32.3

    ```


    在 `Destination` 下显示的将不是 IP 地址，而是 `gateway` 单词。


    以下命令用于编辑主机：


    ```

    route add -host 172.31.32.3 reject

    ```


    ## Nslookup 命令


    `Nslookup` 命令代表“名称服务器查询”（name server lookup），是另一个处理网络的强大工具。你可以简单地使用它来发现 IP 地址或域名。


    `DNS` 提供的数据可以通过交互模式和非交互模式进行传输。交互模式显示属于同一域的主机列表，而非交互模式则仅显示特定主机的信息。


    该命令的目的是查找与 `DNS` 配置相关的问题。


    只需输入命令，即可使用交互模式：


    ```bash

    nslookup

    ```


    ![手机手机截图，自动生成的描述](img/00059.jpeg)


    输入 `nslookup` 后，系统会要求输入以域名开头的其他信息，如示例所示的 `google.com`。随后，关于服务器和 IP 地址的所有信息将显示给你。每当你输入
    IP 地址或域名时，你都在请求一个查询，该查询将揭示你的搜索信息。当提供 IP 地址而不是域名时，你是在使用反向 DNS 查询。


    第二种方法更适用于已经具有该主题知识并知道要查找什么参数的用户。


    同样，你也可以请求查找 `MX` 记录中的信息。在这种特定情况下，你需要添加 `set type=mx`：


    ![包含表格的图片，自动生成的描述](img/00060.jpeg)


    如预览所示，在输入：


    ```bash

    nslookup

    ```


    你必须输入过滤器：


    ```

    set type=mx

    ```


    然后是域名：


    ```

    google.com

    ```


    同样，你可以通过输入 `type=`ns` 来查找有关 `DNS` 服务器的信息：


    ```

    set type=ns

    ```


    还可以应用其他选项，例如通过 `type=`soa` 查看 `SOA`：


    ```bash

    set type=soa

    ```


    ![包含鸟的图片，自动生成的描述](img/00061.jpeg)


    如前所述，可以应用于 `nslookup` 的第二种方法是非交互模式。你不是单独插入参数，而是在输入 `nslookup` 的同时，还需要像这里这样包含域名：


    ```bash

    nslookup google.com

    ```


    或者你可以对 IP 地址进行查询：


    ```bash

    nslookup 209.18.47.62

    ```


    ## host 命令


    给定域名，可以使用 `host` 命令查找 IP 地址，或者提供 IP 地址来查找关联的 IP 地址。只需输入命令 `host`，即可获得可用选项：


    ```

    host

    ```


    ![屏幕截图，自动生成的描述](img/00062.jpeg)


    如上所示，在没有向命令传递特定参数的情况下，列出了选项。


    输入以下内容查看 google 的 IP 地址：


    ```bash

    host google.com

    ```


    ![包含表格、照片、坐着的图片，自动生成的描述](img/00063.jpeg)


    如预览所示，地址 `172.217.10.238` 匹配域名 `google.com`。


    同样，也可以反向查找。这意味着通过 IP 地址获取域名。


    ```bash

    host 172.217.10.238

    ```


    选项 `-C` 可以比较权威名称服务器上的 `SOA` 记录：


    ```bash

    host -C google.com

    ```


    ![包含室内、表格、鸟的图片，自动生成的描述](img/00064.jpeg)


    选项 `-a` 代表 `ANY`，意味着它尝试查找有关 Google 主机的任何信息：


    ```bash

    host -a google.com

    ```


    选项 `-t` 可查找特定的 DNS，如 `ns`：


    ```bash

    host -t ns google.com

    ```


    ![电脑截图，自动生成的描述](img/00065.jpeg)


    ## whois 命令


    `whois` 能够查找有关注册域名、IP 地址和名称服务器的信息。


    `whois` 命令是一个用于查找你所连接的 `whois` 服务器信息的实用程序。它通过默认端口（`43`）接受请求，并翻译接收到的数据，以便以不同的格式读取。


    使用该命令，你可以列出关于域名注册商、域名状态、名称服务器、过期日期的所有信息：


    '
- fmt: '

    `whois google.com`


    ![A screenshot of a cell phone Description automatically generated](images/00066.jpeg)


    Also, the same command can be used to get the information given an IP address:


    `whois 209.18.47.62`


    But how this information can be provided to you?


    The ICANN is a non-profit organization that manages the IP address assigned to
    each domain name and they work with the registries. They are in charge of the
    domains such as `.com`. Below this level, registrars operate with the final customers
    such as GoDaddy, TuCows, and more. As a result, anyone who would like to register
    a new domain will apply for a registration to common registrars.


    Using the command `whois google.com` you send a request for a query to the listening
    port `43` which provides a series of information collected from the registry.


    Additional information is provided to you if in the same query you also include
    the registrar where the domain is registered:


    `whois -h whois.markmonitor.com google.com`

    '
