    ifconfig eth0 down\n```\n\nThe same `ifconfig` command is also used to assign\
    \ an IP address to an interface like the `wth0`:\n\n```bash\nifconfig eth0 192.16.20.120\n\
    ```\n\nAlso, the `ifconfig` can be used with the command `netmask` to enable the\
    \ network mask on a specific interface such as `eth0`:\n\n```bash\nifconfig eth0\
    \ netmask 255.255.255.220\n```\n\nWhile the setting of the same command with `broadcast`\
    \ sets the broadcast address on a specific interface:\n\n```bash\nifconfig eth0\
    \ broadcast 192.16.20.120\n```\n\nThe `MTU`, which stands for maximum transmission\
    \ unit, is the largest part in a unit sent through a network interface. The attribution\
    \ to the type of interface can be edited, also defining the threshold for the\
    \ number of packets that can be sent each time.\n\nThe example below sets up the\
    \ transmission to a limit of 800 packets:\n\n```bash\nifconfig eth0 mtu 800\n\
    ```\n\nWhereas usually the regular process checks if the packets belong to the\
    \ interface currently in use, there is also an option to activate or disable what\
    \ it is defined as promiscuous mode. With this type of mode packets are anywhere\
    \ accepted. The following command in then used for this purpose:\n\n```bash\n\
    ifconfig eth0 promisc\n```\n\nIn opposition to the `promisc` command used to enable\
    \ the configuration of the the promiscuous mode, the `promisc` command disables\
    \ this setting:\n\n```bash\nifconfig eth0 -promisc\n```\n\nAnother interesting\
    \ feature is the alias that can be assigned to the interface `eth0`. The value\
    \ is in the same range of the subnet mask. Adding the IP address to `ifconfig\
    \ eth0:0` you give the alias, while just `ifconfig eth0:0` checks the alias itself.\n\
    \n```bash\nifconfig eth0:0 192.16.20.120\n\nifconfig eth0:0\n```\n"
