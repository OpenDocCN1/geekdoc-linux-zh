- fmt: "\nThe `ping` command which stands for Packet Internet Groper is widely used\
    \ to test the activity of a server providing the IP address. Through the `ping`\
    \ command you are able to check out if the Ip you are looking for is currently\
    \ active.\n\nThe command works sending the requests through the packages (Internet\
    \ Control Message Protocol). At the same time, the recipient answers to the message\
    \ with another Internet Control Message Protocol. The communication may result\
    \ in problems such as delays that are evidenced launching the command `ping`.\
    \ Also, some packages would result as lost during the transmission of data. \n\
    \nOnce that the command `ping` has been typed, it will reiterate the same operation\
    \ for an infinite time.\n\nType the command here below to ping google.com:\n\n\
    ```bash\nping google.com\n```\n\n![A close up of a screen Description automatically\
    \ generated](images/00050.jpeg)\n\nIn each line you can see the result of the\
    \ `ping` command.\n\n56 bytes is the default number of data bytes which then 64\
    \ bytes for the Internet Control Message Protocol. While the IP address is `ord30s31-in-f238.1e100.net`\
    \ `172.217.4.238`. The sequence of consecutive packages is then generated from\
    \ 1 to n, with the like it follows here below:\n\n```text\nicmp_seq=1\n```\n\n\
    Use the `option -c` to avoid repeating endlessly the same operation:\n\n```bash\n\
    ping -c 4 google.com\n```\n\nThe number “4” refers to the packages sent, so the\
    \ `ping` command is able to interpret how many packages are expected to be sent\
    \ and then stop the execution.\n\nThe `ping` command is so important because it\
    \ allows to quickly check if the server you are trying to reach is working.\n\n\
    ![A close up of a person Description automatically generated](images/00051.jpeg)\n\
    \nIf you do not receive an answer typing the command `ping` there may be a problem\
    \ on the network. In some cases, network issues also produce a loss of packages\
    \ over the connection to the destination. One of the solutions that can be applied\
    \ is just using the command here below to check the status of the lost packages\
    \ and see what happens:\n\n```bash\ntraceroute\n```\n\nAnother useful option for\
    \ the `ping` command, in addition to `-c`, is using the `-i` option. This rule\
    \ can be used when there is another gateway source like here below:\n\n```bash\n\
    ping -I eth0 www.yourdomain.com\n```\n\nAlso, you can choose form which kind of\
    \ internet protocol between IPv4 and IPv6 you want to send the ping. The IPv4\
    \ and IPv6 with respectively interpreted with `-4` and `-6`.\n\n![A picture containing\
    \ table, bird Description automatically generated](images/00052.jpeg)\n\n# The\
    \ Netstat command\n\nThe `netstat` command is a great source to figure out the\
    \ statistics of the network. This means checking the if the ports TCP and UDP\
    \ are open and more. The `netstat` utility is usually already available in your\
    \ system. \n\nType the following command to see the current version of `netstat`:\n\
    \n```bash\nnetstat -v\n```\n\nBefore digging in-depth the potentials of the `netstat`\
    \ command, you should have a clear idea of how the ports TCP and UDP work. In\
    \ fact, TCP and UDP are the two methods that can be chosen to send packets through\
    \ a network. What you need to forward is the number of the port, the type of port,\
    \ and the IP address of your destination.\n\nJust to refresh your memory, TCP\
    \ stands for Transmission Control protocol and it is the most reliable method\
    \ between the two. It connects the sender with the receiver, and it waits for\
    \ an answer from the second one. The connection is established directly between\
    \ the two and it only stops at the end. On the other hand, UDP stands for User\
    \ Datagram protocol is a less reliable transmission of data, but at the same time\
    \ also requires a lower load of work though the network.\n\nIn order for a server\
    \ to communicate with another machine, it needs a port that can be used as listener\
    \ of incoming connections that have to be accepted from the server itself. Ports\
    \ can be open or closed depending if there is a service such as a firewall that\
    \ blocks the transmission of data. One of most common ports used by default for\
    \ the TCP port is the port 80.\n\nType the following command to list the TCP ports\
    \ available as listener which means they accept connections:\n\n```bash\nsudo\
    \ netstat -t\n```\n\n![A screenshot of a cell phone Description automatically\
    \ generated](images/00053.jpeg)\n\nWhile the option `sudo netstat -u` shows the\
    \ UDP ports they are listening:\n\n```bash\nsudo netstat -u\n```\n\nThe command\
    \ with the option `-l` shows the listening ports:\n\n```bash\nsudo netstat -l\n\
    ```\n\n![A close up of text on a white background Description automatically generated](images/00054.jpeg)\n\
    \nAs listed in the example here above, there is some important information displayed\
    \ by the command. Starting with `proto`, the `ping` command produced the protocol\
    \ used by the socket, then `local address` which indicates the IP address as well\
    \ as the port that is listening to, and finally the `state` that specifies `LISTEN`.\n\
    \nOther options that can be used:\n\n* `-n` shows the addresses separated by dots.\n\
    * `-p` displays PID (process identifier associated with a connection) and it has\
    \ to be used with permissions as administrator.\n* `-a` shows the sockets available\
    \ for incoming connections\n\nAll the options can be used at the same time all\
    \ together to see the particular results.\n\nTo check the statics of a network\
    \ interface `option -I` in the kernel `option -a`:\n\n```bash\nnetstat -ai\n```\n\
    \nWith the following command you can check the services, their state and the PID:\n\
    \n```bash\nsudo netstat -tunlp\n```\n\nAdding `grep` you can filter the ports\
    \ and see what services are using the specified port 80:\n\n```bash\nsudo netstat\
    \ -tnlp | grep :22\n```\n\n![](images/00055.jpeg)\n\n# The ifconfig command\n\n\
    `ifconfig` is another of most widely used commands by an administrator to configure\
    \ the network. As the name itself describes, `ifconfig` deals with the interface\
    \ configuration, showing the network interfaces that can be used such as `eth0`,\
    \ `lo`, etc.:\n\n```bash\nifconfig\n```\n\n![A screenshot of text Description\
    \ automatically generated](images/00056.jpeg)\n\nAs a consequence, using the following\
    \ command, you are able to see the configuration on the interface `eth0`:\n\n\
    ```bash\nifconfig eth0\n```\n\nEach interface can also be activated or disabled\
    \ according to your needs.\n\nThe commands `ifconfig up` and `ifup` work in this\
