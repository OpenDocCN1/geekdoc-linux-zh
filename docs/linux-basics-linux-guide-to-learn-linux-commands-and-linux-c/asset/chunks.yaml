    whois -h whois.markmonitor.com google.com'
  toc: []
  trans: '


    `whois google.com`


    ![手机截图，自动生成的描述](img/00066.jpeg)


    此外，相同的命令也可以用于通过 IP 地址获取信息：


    `whois 209.18.47.62`


    但是这些信息是如何提供给你的呢？


    ICANN 是一个非营利组织，负责管理给每个域名的 IP 地址，并与注册局（registries）合作。他们负责诸如 `.com` 等域名。在这一层之下，注册商（registrars，如
    GoDaddy、TuCows 等）与最终客户交道。因此，任何想要注册新域名的用户都会向常见的注册商提交注册申请。


    使用 `whois google.com` 命令，你将向监听端口 `43` 发送查询请求，该端口将提供从注册局收集的一系列信息。


    如果你在同一个查询中还包含了该域名所属的注册商，系统将向你提供额外信息：


    `whois -h whois.markmonitor.com google.com`

    '
