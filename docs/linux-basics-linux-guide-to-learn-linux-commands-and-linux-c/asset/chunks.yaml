    `ping` 命令代表 Packet Internet Groper（数据报网络探测器），广泛用于测试提供 IP 地址的服务器活动状态。通过 `ping`
    命令，你可以检查你正在查找的 IP 是否处于激活状态。


    该命令通过数据包（互联网控制消息协议 ICMP）发送请求来工作。同时，接收端用另一个互联网控制消息协议进行响应。这种通信可能会导致延迟等问题，这可以通过运行
    `ping` 命令得到证明。此外，在数据传输过程中某些数据包可能会丢失。


    一旦输入 `ping` 命令，它将无限次地重复相同的操作。


    输入以下命令来 ping google.com：


    ```bash

    ping google.com

    ```


    ![一张自动生成的屏幕近写描述](img/00050.jpeg)


    在每一行中，你都可以看到 `ping` 命令的结果。


    56 字节是默认的数据字节数，其中 64 字节用于互联网控制消息协议。当 IP 地址为 `ord30s31-in-f238.1e100.net` `172.217.4.238`
    时，连续数据包的序列将从 1 到 n 生成，如下所示：


    ```text

    icmp_seq=1

    ```


    使用 `option -c` 来避免无限地重复相同的操作：


    ```bash

    ping -c 4 google.com

    ```


    数字“4”指的是发送的数据包数量，因此 `ping` 命令能够解释预期发送多少个数据包，然后停止执行。


    `ping` 命令非常重要，因为它允许你快速检查尝试访问的服务器是否正在工作。


    ![一张自动生成的个人近写描述](img/00051.jpeg)


    如果你在输入 `ping` 命令后没有收到回复，可能是网络存在问题。在某些情况下，网络问题还会导致通往目的地的连接出现丢包。可以应用的解决方案之一是直接使用下面的命令检查丢失数据包的状态并查看发生了什么：


    ```bash

    traceroute

    ```


    除了 `-c` 之外，`ping` 命令的另一个可用选项是使用 `-i` 选项。当存在如下所示的其他网关源时可以使用此规则：


    ```bash

    ping -I eth0 www.yourdomain.com

    ```


    此外，你还可以选择从 IPv4 或 IPv6 哪种互联网协议发送 ping。IPv4 和 IPv6 分别用 `-4` 和 `-6` 解释。


    ![一张包含表格、鸟的自动生成的图片描述](img/00052.jpeg)


    # Netstat 命令


    `netstat` 命令是获取网络统计信息的极佳来源。这意味着检查 TCP 和 UDP 端口是否已打开等更多信息。`netstat` 工具通常在你的系统中已经可用。


    输入以下命令查看 `netstat` 的当前版本：


    ```bash

    netstat -v

    ```


    在深入研究 `netstat` 命令的潜力之前，你应该对 TCP 和 UDP 端口的工作原理有一个清晰的认识。事实上，TCP 和 UDP 是通过网络发送数据包的两种方法。你需要转发的是端口号、端口类型以及你目的地的
    IP 地址。


    为了帮你复习一下记忆，TCP 代表传输控制协议（Transmission Control protocol），它是这两种方法中最可靠的一种。它将连接发送者和接收者，并等待后者的回答。连接在两者之间直接建立，仅在结束时停止。另一方面，UDP
    代表用户数据报协议（User Datagram protocol），是一种可靠性较低的数据传输方式，但同时对网络的工作负载要求也较低。


    为了让服务器与另一台通信，它需要一个可以作为监听器的端口，用于接受来自服务器自身的入站连接。端口可以是开启或关闭的，取决于是否有防火墙等服务阻止数据传输。TCP
    端口默认最常用的端口之一是 80 端口。


    输入以下命令列出作为监听器的可用 TCP 端口，这意味着它们接受连接：


    ```bash

    sudo netstat -t

    ```


    ![一张自动生成的手机截图描述](img/00053.jpeg)


    而选项 `sudo netstat -u` 显示了它们正在监听的 UDP 端口：


    ```bash

    sudo netstat -u

    ```


    带有选项 `-l` 的命令显示监听的端口：


    ```bash

    sudo netstat -l

    ```


    ![一张自动生成的白色背景文字近写描述](img/00054.jpeg)


    如上面的示例所示，命令显示了一些重要信息。从 `proto` 开始，`ping` 命令产生套字使用的协议，然后是 `local address` 指明 IP
    地址以及正在监听的端口，最后是指定为 `LISTEN` 的 `state`。


    其他可用的选项：


    *   `-n` 显示用点分隔的地址。

    *   `-p` 显示 PID（与连接关联的进程标识），必须以管理员权限使用。

    *   `-a` 显示用于入站连接的可用套字


    所有选项可以同时使用以查看特定的结果。


    要检查内核中 `option -a` 下网络接口的统计信息 `option -I`：


    ```bash

    netstat -ai

    ```


    通过以下命令你可以检查服务、其状态和 PID：


    ```bash

    sudo netstat -tunlp

    ```


    加上 `grep` 后，你可以过滤端口并查看哪些服务正在使用指定的 80 端口：


    ```bash

    sudo netstat -tnlp | grep :22

    ```


    ![](img/00055.jpeg)


    # ifconfig 命令


    `ifconfig` 是管理员配置网络时最常用的命令之一。正如名称本身所描述，`ifconfig` 处理接口配置，显示可以使用的网络接口，如 `eth0`、`lo`
    等：


    ```bash

    ifconfig

    ```


    ![一张自动生成的文字截图](img/00056.jpeg)


    因此，使用以下命令，你可以看到 `eth0` 接口上的配置：


    ```bash

    ifconfig eth0

    ```


    每个接口也可以根据你的需求激活或禁用。


    `ifconfig up` 和 `ifup` 命令以这种方式应用更改。


    如果接口已经启用，则任何内容都不会改变：


    ```bash

    ifconfig eth0 up

    ```


    同样，要禁用如 `eth0` 的接口，请使用 `ifconfig down` 或 `ifdown eth0`：


    ```bash

    ifconfig eth0 down

    ```


    `ifconfig` 命令还用于为如 `eth0` 的接口分配 IP 地址：


    ```bash

    ifconfig eth0 192.16.20.120

    ```


    此外，`ifconfig` 可以配合 `netmask` 命令为特定接口如 `eth0` 设置子网掩码：


    ```bash

    ifconfig eth0 netmask 255.255.255.220

    ```


    而使用同一命令配合 `broadcast` 则为特定接口设置广播地址：


    ```bash

    ifconfig eth0 broadcast 192.16.20.120

    ```


    `MTU` 代表最大传输单元（maximum transmission unit），是通过网络接口发送的单元中最大的部分。接口类型的属性可以编辑，同时也定义了每次可以发送的数据包数量阈值。


    下面的示例设置传输限制为 800 个数据包：


    ```bash

    ifconfig eth0 mtu 800

    ```


    通常常规进程检查数据包是否属于当前使用的接口，但还有一个选项可以激活或禁用被定义为混杂模式（promiscuous mode）。在这种模式下，数据包都会被接受。以下命令随后用于此目的：


    ```bash

    ifconfig eth0 promisc

    ```


    与用于启用混杂模式配置的 `promisc` 命令相反，`promisc` 命令用于禁用此设置：


    ```bash

    ifconfig eth0 -promisc

    ```


    另一个有趣的特性是可以分配给 `eth0` 接口的别名。该值在子网掩码的相同范围内。通过向 `ifconfig eth0:0` 添加 IP 地址可以赋予别名，而仅用
    `ifconfig eth0:0` 则检查别名本身。


    ```bash

    ifconfig eth0:0 192.16.20.120


    ifconfig eth0:0

    ```


    '
- fmt: '

    The simple inclusion of “down” at the end of the command removes the alias assigned
    to the interface.


    ```

    ifconfig eth0:0 down

    ```


    From the command line you can find out what is your MAC address and edit it. `MAC`
    stands for Media Access Control and it is the identification number assigned to
    a network. Adding “hw ether” to `ifconfig` you are able to change the information.


    ```bash

    ifconfig eth0 hw ether AA:BB:CC:DD:EE:FF

    ```


    ## The Tcpdump tool


    `Tcpdump` is a utility that works only from command line. It analyzes the `TCP/IP`
    packets that are received and sent through a network interface and it decides
    if they can be stored to be interpreted in the future.


    Type the command to see the results:


    ```bash

    sudo tcpdump

    ```


    If you want to limit your search to just a specific type of interface, you can
    add to the command `-i` to the command `tcpdump`.


    ```bash

    tcpdump -i eth0

    ```


    Through your search you can also filter the number of packets to displayed as
    output just adding the option `-c`:


    ```bash

    tcpdump -c 5 -i eth0

    ```


    ## The Route command


    Before digging into the command `route` is useful to have an overview of the concept
    of IP routing. With the term `IP routing` we mean a process where a host reaches
    another host before forwarding data to the final destination. With this method,
    the recipient works in between and takes care of the packets received deciding
    how to sort them before sending them to the final host. It is usually identified
    with a router that is used by the first host whether the final host is connected
    or not. In the main step the IP address is checked to see if it belongs to the
    same network or not. The `TCP` is then in charge of recreating the information
    collected over the transmission.


    With this overall introduction, keep in mind what is the goal of the command you
    are learning. Typing the `route` command you are able to show or edit the routing
    tables.


    The routing tables contain information about how the process of transmission of
    the packets sent and received, included the details of the network. One of the
    main features of this command is setting up static routes and interfaces in a
    network.


    As shown in the example here below, you can type the command to access to the
    current routing tables:


    ```bash

    route

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00057.jpeg)


    The data reported in the screenshot offer a preview of the routing tables. Following
    the columns, `Destination` indicates the IP address of the host of destination
    or the network.


    Then, the `Gateway` is expressed as an IP address of the router that filters the
    data available at the destination. The router, which is the mediator of the transmission,
    takes decisions in terms of how to send the data received to the final host. `Flags`
    describes the type of host of the final recipient and it is useful to figure if
    it is a router or a different device. Also, `Iface` provides the interface that
    it is used in the network. In the example shown the interface is the common `eth0`.


    Through the process of routing table, the first host tries to reach the host of
    destination and names the router that handles the traffic. In this way, the communication
    can be performed even if the final host is not in the same network of the sender.


    The `route` command has some options that can be added to display the information
    slightly differently. With the `option -n` you can see the list of the IP addresses
    in numbers:


    ```bash

    route -n

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00058.jpeg)


    The IP address `ip-172-31-32-1` is now replaced with the digits `172.31.32.1`.


    With the same command you can also set up a default gateway to use in case the
    final IP address does not belong to the same network:


    ```bash

    route add default gw 172.31.32.3

    ```


    Instead of the IP address the destination would have the word `gateway` displayed
    under `Destination`.


    The following command is used to edit the host:


    ```bash

    route add -host 172.31.32.3 reject

    ```


    ## The Nslookup command


    The command `Nslookup`, which stands for “name server lookup”, is another great
    utility to work with the network. You can simply use it to discover the IP address
    or the domain name.


    The data provided by the `DNS` can be transferred through the interactive and
    noninteractive mode. While the interactive mode shows a list of the hosts belonging
    to the same domain, the noninteractive mode shows only the information for a specific
    host.


    The command has the purpose to find problems linked to `DNS` configurations,


    Just typing the command, you are able to use the interactive mode:


    ```bash

    nslookup

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00059.jpeg)


    After typing `nslookup` it would be asked to enter other information starting
    with the domain like in the example reported is `google.com`. All the information
    is then displayed to you for what concerns the server and the IP address. All
    the time you enter an IP address or domain you request a query that will disclose
    the information of your search. When the IP address is provided instead of the
    domain, you are making use of a reverse DNS lookup.


    The second method instead is more specific for users who already have knowledge
    about the topic and know what parameters to look for.


    Similarly, you can also request to find information on the `MX` records. In this
    specific case you need to add `set type=mx`:


    ![A picture containing table Description automatically generated](images/00060.jpeg)


    As shown in the preview, after entering:


    ```bash

    nslookup

    ```


    You have to enter the filter:


    ```

    set type=mx

    ```


    and then the domain:


    ```

    google.com

    ```


    In the same way you can find the information about the `DNS` server typing the
    type=`ns`:


    ```bash

    set type=ns

    ```


    Further options can be applied for example to see the `SOA` with the type=`soa`:


    ```bash

    set type=soa

    ```


    ![A picture containing bird Description automatically generated](images/00061.jpeg)


    As explained previousl, the second method that can be applied to the `nslookup`
    is the noninteractive mode. Instead of inserting the parameter separately, at
    the same time you type `nslookup` you also need to include the domain name as
    it follows here:


    ```bash

    nslookup google.com

    ```


    or you can ask for a query on the IP address:


    ```bash

    nslookup 209.18.47.62

    ```


