    \nRun the command “id” to see if the user is a member:\n\nid user1\n\nDeleting\
    \ a user\n\nYou can delete a user using he command “deluser” attached then to\
    \ the name of the user you are going to delete:\n\nsudo deluser user1\n\nLocking\
    \ and Unlocking specific users\n\nEach user can be locked or unlocked with the\
    \ following commands:\n\nsudo passwd -l user1\n\nsudo passwd -u user1\n\nThe options\
    \ -l and -u work in this sense to respectively lock and unlock the users.\n\n\
    View all the processes related to a user\n\nIf you want to find details about\
    \ the processes that involve one user like “user1”, type the command “ps”:\n\n\
    ps -u user1\n\nApplying changes to the groups\n\nHow to see if you belong to a\
    \ group\n\nRun the command below to see what group you belong to:\n\ngroups\n\n\
    ![](images/00005.jpeg)\n\nThe groups reported in the example are ubuntu, adm,\
    \ dialout, cdrom, floppy, sudo, audio, dip, video, plugdev, lxd, netdev.\n\nAlso,\
    \ you can use the following command to revise what groups your user is part of.\
    \ You can display a list of the services and what permissions you need such as\
    \ root.\n\nsudo cat /etc/group\n\nAdding a user to a group\n\nThe command used\
    \ to add a user to a known group is “usermod”. You need to specify as arguments\
    \ the name of the user and then the group that has to be associated to.\n\nsudo\
    \ usermod -a -G user1 ubuntu\n\nIn the example above, the “user1” is added to\
    \ the group “ubuntu”.\n\nRunning again the command to see the list of users, you\
    \ are able to check if the user has been added:\n\nsudo cat /etc/group\n\nAs shown\
    \ here below the user has been successfully added and displayed under “ubuntu”.\n\
    \nuser1:x:1001:ubuntu\n\n![](images/00006.gif)\n\nCreating a new group\n\nWhen\
    \ you need to create a new group that it does not exist you can intervein with\
    \ the command “groupadd” and the name of the group which can be “usergroup1”.\n\
    \nsudo groupadd usergroup1\n\nDeleting a user from a group\n\nLike we have previously\
    \ seen in this section for the users, also the user can be removed from the groups.\
    \ To apply these changes, use the command “deluser” followed then by the name\
    \ of the user and then the group.\n\nsudo deluser user1 usergroup1\n\nIf you want\
    \ to review what groups a user belongs to, just use the following command:\n\n\
    sudo groups user1\n\nThen, press the combination CTRL + X in order to exit from\
    \ the file and enter “Y” to save the changes. It is asked to save the file with\
    \ the same name “visudo” to override it. To proceed press “enter”.\n\nThe new\
    \ “user1” is now able to perform any command with the root privileges.\n\nPermissions\n\
    \nA useful operation for users is about permissions. In this case you need to\
    \ enter a list of information:\n\n*   The first one is the type which can be a\
    \ file (-), directory (d), or symlink (l)\n\n*   The user permissions, group permission,\
    \ and other permissions are then divided in:\n\n    *   read (r)\n\n    *   write\
    \ (w)\n\n    *   execute (x)\n\nFor each of the operations read, write, and execute\
    \ has been assigned a number depending on the role.\n\nGiving privileges to a\
    \ user\n\nOne of the operations that may result handful is editing the privileges\
    \ of a specific user. This action requires to revise the file “visudo” that contains\
    \ all the information about users.\n\nFirst of all, open the file visudo with\
    \ the following command:\n\nsudo nano visudo\n\nNow, type as follows here and\
    \ replace “user1” with the name of the user you need to give the root privileges:\n\
    \nuser1 ALL=(ALL) ALL\n\nAlso, you can give the permissions to the user1 as it\
    \ follows here:\n\nUser_Alias ADMINS = user1\n\nCmnd_Alias HTTPD = /etc/init.d/httpd\n\
    \nADMINS ALL = HTTPD\n\nHow to add permissions to a directory\n\nHere below you\
    \ find a way to add permissions to read and write to the folder “NewFolder”:\n\
    \nsudo chmod -R g+w $HOME/Documents/NewFolder\n\nSimilarly, permissions can also\
    \ be denied to users that want to access to the folder “NewFolder”:\n\nsudo chmod\
    \ -R o-x NewFolder\n\nWith this procedure you are able to give the permissions\
    \ to only one group of users and multiple groups at the same time. To overcome\
    \ this limitation, you can use the access control lists. The command that follows\
    \ here below enables the permissions to “read” the folder “NewFolder”. This means\
    \ that the folder is now accessible even to a group named “users3” without involving\
    \ any permissions for other users.\n\nsetfacl -m g:usergroup3:rx -R $HOME/Documents/NewFolder\n\
    \nTo allow the same group of users to write the folder “NewFolder” use the following\
    \ command:\n\nsetfacl -m g:auditors:rwx -R $HOME/Documents/NewFolder\n\n# Performing\
    \ a General System Health Check\n\nA good practice to keep steady the performances\
    \ of your system is checking and running a checkup of the entire system. The reliability\
    \ of the operating system depends on the status of the virtual memory that can\
    \ be accessed through the vmstat system utility, the CPU usage, the hard drives\
    \ usage, devices in input and output, an analysis of the network, and processes\
    \ currently running. All these operations are fundamental for a Linux server administrator.\n\
    \nTo perform a health check of the system, we are going to use different sets\
    \ of commands. Also, running commands includes using utilities that are handful\
    \ for this purpose.\n\nThe command Top – Monitoring the tasks\n\nOne of the main\
    \ steps that is very important to keep in mind is monitoring sources and what\
    \ hardware are using in real-time. While it may seem useless, you may find that\
    \ this method helps to supervise all the activities and make decisions on where\
    \ to intervein. The command shows the CPU usage, memory status, swap memory, cache\
    \ size, suffer size, process PID, etc…\n\nThe command “top”\n\nRun the following\
    \ command “top” to see all services running:"
