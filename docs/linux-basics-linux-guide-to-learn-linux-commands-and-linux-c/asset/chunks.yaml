- fmt: "\nKeeping track of the history of the logins, you are able to parse incoming\
    \ external attacks that attempted to enter a username and password to log on your\
    \ operating system. Having access to this information you are conscious about\
    \ who are other users who tried to access to your personal data. In this category\
    \ you will find records on the last login sessions, current logins, and login\
    \ failure.\n\n# Last Logins\n\nIn this list you will find the last logins to your\
    \ system, meaning records on user that logged in and logged out.\n\nThe path for\
    \ the Last Logins Log files is: `/var/log/lastlog`\n\nIn the Ubuntu versions,\
    \ you can use the following command from terminal to show a list of accesses.\
    \ The `less` command will just help you to list this information in each page.\
    \ You will be able to review the content in a more manageable way instead of scrolling\
    \ down an endless list.\n\n```bash\nlastlog | less\n```\n\nThe result on the output\
    \ will be a list with username, IP address, date and time of access, `pts/0` (which\
    \ shows that the server has been accessed via SSH connection), date of creation\
    \ of the folder.\n\n# Current Logins\n\nYou can check the current users logged\
    \ in to your operating system.\n\nThe path for the Current Logins Log files is:\
    \ `/var/log/wtmp`\n\nIn addition to the folder `wtmp` that stores the information,\
    \ using the command below you are also able to list the names of the users currently\
    \ logged in:\n\n```bash\nwho\n```\n\n![](images/00001.jpeg)\n\n# Login Failures\n\
    \nUnder the same directory `/var/log` reside other log files including the `failog`.\
    \ As suggested by the name, this log file is used to monitor information on the\
    \ failures on login sessions.\n\nThe path for the Login Failog Log files is: `/var/log/faillog`\n\
    \nIn Ubuntu versions as well as other distributions, the `faillog` log files are\
    \ placed in the directory `/var/log/faillog`. In order to display the failure\
    \ on logins on Ubuntu, execute the following command from the terminal:\n\n```bash\n\
    faillog\n```\n\n# The syslogd (System Logging Daemon)\n\nBoth used for Linux and\
    \ Unix operating systems make use of the `syslogd` also known as System Logging\
    \ Daemon. It handles messages from different sources putting them in communication\
    \ with the final destination. The `syslogd` works through the configuration file,\
    \ reading information reported and forwarding the messages to the specified recipient.\n\
    \nThe path of the configuration file is: `/etc/syslog.conf`.\n\nEach life of this\
    \ file contains the selector and the action, which respectively is identified\
    \ with the facility that matches with the recipient. The facility is meant as\
    \ the process that triggers an event.\n\nTaking the example here below, the line\
    \ of that will be forwarded to the configuration file is made of the facility\
    \ `mail` and the action `/var/log/mail` which is the file of destination.\n\n\
    ## Defining the priorities\n\nAlso, the line consists in a priority assigned to\
    \ the facility. The level of priority varies each time separated by `.`.\n\n```text\n\
    mail.emerg /var/log/mail\n```\n\nSome examples of facilities are `auth`, `daemon`,\
    \ and more. Priorities are listed from the lowest in terms of importance like\
    \ `debug, info, notice, warning, err, crit, alert` to the highest level `emerg`.\n\
    \nAs shown in the example, `mail` is the facility while `emerg` is the priority.\n\
    \nYou can also use the `@` to redirect the message to a hostname.\n\n```text\n\
    *.emerg      @mail.domain.com\n```\n\nThe message will be interpreted by the system\
    \ taking all messages with priority `emerg` and sending them to the user with\
    \ the hostname `mail.domain.com`.\n\nIn fact, the symbol `*` means all the facilities.\
    \ Typing as it follows here below you will refer to all the facilities and all\
    \ levels of priority:\n\n```text\n*.*      @mail.domain.com\n```\n\nThen, the\
    \ `=` indicates messages with similar priority, while usually it is applied to\
    \ the ones which have the same level or an increasing number.\n\nAs opposite to\
    \ the equal sign, the `!` sign is used to apply the rules of message and exclude\
    \ the ones with certain priorities.\n\nIn the configuration file, in the same\
    \ line with the action that has to be sent, more selectors can be added using\
    \ the `;` symbol. Moreover, also facilities can be added using the `,` symbol\
    \ that separates one from each other.\n\n# What does a log file contains?\n\n\
    Open the terminal and execute the following command to move to the folder containing\
    \ the logs:\n\n```bash\ncd /var/log\n```\n\n`cd` is the command used in the Unix\
    \ operating systems to move from the current position to another folder separated\
    \ by `/`.\n\nThen type the following command to see the content listed under the\
    \ folder `log`:\n\n```bash\nls\n```\n\n![A screenshot of a cell phone Description\
    \ automatically generated](images/00002.jpeg)\n\nThe example above shown a screenshot\
    \ from the console using Amazon AWS. Some of the directories listed are the same\
    \ took in exam at the beginning of this guide.\n\nWhen displaying this information,\
    \ you may find some sort of duplicates such as `daemon.log.0` reported in sequence\
    \ with different numbers. Don’t panic. These files are generated by the system\
    \ copying and pasting the initial file to generate new ones. The starting files\
    \ are not completely deleted from your operating system, but they are compressed\
    \ separately. This utility known as log rotation works efficiently to save some\
    \ space. As a result, you may find in your list of files something similar to\
    \ `daemon.log.0.gz` that indicates the files compressed in the `.gz` archive.\n\
    \nOne of the easiest ways to edit files with no issues is just using the `nano`\
    \ command in the console. Typing the example below you are able to read the content\
    \ of the `kernel.log` file:\n\n```bash\nnano kernel.log\n```\n\nOnce you finished\
    \ with your edits, you can simply close it using the combination `CTRL + C`.\n\
    \nOther two helpful features to edit the log files are `head` and `tail`. These\
    \ two commands are used to show the head of the file, and the content at the bottom.\n\
    \n```bash\nhead file.log\n```\n\nUsing the command `head` you will be able to\
    \ view the first lines at the top of the file `file.log`.\n\nIf you need to display\
    \ an amount of lines at 15 from the beginning, just type:\n\n```bash\nhead -n\
    \ 15 file.log\n```\n\nAs a consequence, the command `tail` works as the opposite\
    \ to the head command. This command shows exactly the content at the bottom:\n\
    \n```bash\ntail file.log\n```\n\nLike the head command also tail has the same\
    \ functionalities. Specifying the number of lines, it shows 15 lines instead of\
    \ the fixed number of 10 lines:\n\n```bash\ntail -n 10 file.log\n```\n\nIf you\
    \ need to monitor at the same time a file and see edits on the file you can use\
    \ the command line `tail -f`:\n\n```bash\ntail -f file.log\n```\n\nAnother command\
    \ you may perform is any search of the log files in terms of content. You may\
    \ want to use the command here below to seek the word `mail` in the file `file.log`:\n\
    \n```bash\ngrep \"mail\" file.log\n```\n\nAlso, you can use `grep` with `^` to\
    \ look for words repeated in each line:\n\n```bash\ngrep \"^mail\" file.log\n\
    ```\n\n# Managing Users and Groups\n\nKnowing how to manage users and groups is\
    \ a critical task for any user or administrator. One of the main reasons is because\
    \ good practices on the management can be effective on the security of the network\
    \ and the system. Also, it is essential to be confident about this topic to protect\
    \ your data from external sources.\n\nBefore starting to mention any command used\
    \ to these procedures you should be aware of how users and groups work. \n\nEach\
    \ user is separated from others and under its account there are folders, files,\
    \ and applications that are being used while in action. So, once the session is\
    \ active with the specific user the operations are completed with a profile. Also,\
    \ the user has a home directory assigned to it with the same name.\n\nBy default,\
    \ a new operating system that is installed has a username defined as `root user`.\n\
    \nType the following command to work as the root administrator:\n\n```bash\nsu\n\
    ```\n"
