    # Managing Processes and Services


    Before analyzing in depth handy commands to manage processes and services, we
    need to clarify what are processes and services.


    ## What do we mean with “process”?


    Process is an instance of a running program. As a consequence, all the times that
    an application is running, a process is initiated and an identification number
    `PID`, that stands for Process ID, is attributed together with the group the user.
    That’s why as an administrator you should be able to maximize the performances
    of your machine.


    Processes can be divided in two major groups which are background processes and
    interactive processes. With the first group we mean all the processes that are
    not started by the user, but they are working automatically on the background.
    One of the most famous processes is Deamons. In the second case, the interactive
    group identifies the processes that are started by the user, recalling a command
    from the command line.


    ## A new process


    Creating a new process for the Linux distributions means copying and then pasting
    the current process. The `PID` is changed to a new one as seen earlier is a different
    ID.


    In addition to the `PID` that identifies the process itself, each process can
    be recognized through `PPID` which is the parent process ID. Executing the tasks,
    parent processes activate other processes which are the child processes that complete
    their operations at the same time.


    One of the most famous processes is the `init` process. This process is so important
    because is executed at the boot while still other processes are not running. For
    this reason, its ID is always 1, as it is the first process to be run. To find
    the `PID` of a process you can use the command `pidof`.


    ```bash

    pidof system

    ```


    ## What are the states of processes in Linux?


    A process can change the state on the run. Each process is created, then accepted
    and when is ready to be used it can be finally executed through the schedule dispatch.
    Also, a process may be put waiting status if there are I/O sources needed or an
    event that requires the attention. The event then can change status once that
    the waiting time is completed. If there is a no hardware request, the process
    can be interrupted before being able to run. At the end of the steps, the execution
    is stopped.


    * Running: In this state, processes are running which means that the process has
    been created and it is active

