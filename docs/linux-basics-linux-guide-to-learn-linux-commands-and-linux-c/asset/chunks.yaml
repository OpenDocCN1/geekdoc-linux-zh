    ## Options in Glances


    Here you also find some options to evidence particular details:


    * `a`: It lists processes automatically

    * `c`: It lists processes by amount of CPU

    * `m`: It lists processes by amount of memory

    * `p`: It lists processes by name

    * `i`: It lists processes by I/O rate

    * `d`: it shows or hides disk I/O stats ols

    * `f`: it shows or hides file system statshhddtemp

    * `n`: it shows or hides network stats

    * `s`: it shows or hides sensors stats

    * `y`: it shows or hides hddtemp stats

    * `l`: it shows or hides logs

    * `b`: Bytes or bits for network I/Oools

    * `w`: it removes warning logs

    * `x`: it removes warning and critical logs

    * `t`: To review settings on network and I/O devices

    * `u`: To review cumulative network I/O


    This utility also allows to monitor local machine with the web interface (Web
    UI) or export stats to a CSV file.


    You can view all the information about Glances from the help option `-h` or typing
    `man glances`.


    To leave the utility press quit:


    ```

    q

    ```


    ## What are services?


    When an application is running tasks are executed on the machine. A service waits
    for a request and it gives an answer.


    The question you may have is about what services are available in your operating
    system. To answer to this question, you can list here below the services available:


    ```bash

    service --status-all

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00039.jpeg)


    ## The Systemd Utility


    The Systemd is a system and service manager that traces processese while they
    are running. You can use this useful utility to run, stop, or restart services.
    In the Systemd, units are the blocks that can be identified with services such
    as `(.service)`, `(.device)`, `(.sockets)`, slice, etc…


    Services can run in parallel taking advantage of a new way to show services.


    At the boot, the system is loaded after the BIOS recalled it through the boot
    loader. After that, the Kernel loads the systemd and processes are run. At this
    point the user is loaded and its environment is loaded through the systemd.


    These are some important directories to remember where to find unit files:


    * `/usr/lib/systemd/user/`: Under the folder of created for each user, you find
    all files

    * `/run/systemd/system/`: Location runtime for unit files

    * `/etc/systemd/system/`: Unit files can be extended storing them in this folder.


    Running the command `systemctl` you can retrieve a list of all units available
    under the Systemd:


    ```bash

    systemctl

    ```


    ![A picture containing text, newspaper Description automatically generated](images/00040.jpeg)


    In this list you can see the same of the `Unit`, the status for `Load`, `Active`,
    `Sub`, and the `Description` that summarizes what type of unit is for each row.


    Run then the following command to see the list of unit files with the current
    state for each unit:


    ```bash

    systemctl list-unit-files

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00041.jpeg)


    You can also display units which are failed to be initialized:


    ```bash

    systemctl –failed

    ```


    To restrict the analysis to only the services instead of a list of all services,
    you may want to use the following command:


    ```bash

    systemctl list-unit-files –type=service

    ```


    To restart a service, you type the word `start` and then the name of the service
    followed by the extension `.service`:


    ```bash

    systemctl start name.service

    ```


    To restart a service, you type the word `stop` and then the name of the service
    followed by the extension `.service`:


    ```bash

    systemctl stop name.service

    ```


    To restart a service, you type the word `restart` and then the name of the service
    followed by the extension `.service`:


    ```bash

    systemctl restart name.service

    ```


    To restart a service, you type the word `reload` and then the name of the service
    followed by the extension `.service`:


    ```bash

    systemctl reload name.service

    ```


    To restart a service, you type the word `status` and then the name of the service
    followed by the extension `.service`:


    ```bash

    systemctl status name.service

    ```


    ### Enable and Disable a service


    Services can be enabled and disabled accordingly using the Systemctl. The following
    command is used to enable a service:


    ```bash

    systemctl enable name.service

    ```


    This command here below is used to disable a service:


    ```bash

    systemctl disable name.service

    ```


    ### Mask or unmask a service


    Each service can be masked or unmasked to avoid that all units are running at
    the same time.


    This is the command to run to mask the service:


    ```bash

    systemctl mask name.service

    ```


    This is the command to run to unmask the service:


    ```bash

    systemctl unmask name.service

    ```


    ## The Acct tool


    The Acct tool is an application running on background to monitor activities run
    by users. The goal of the tool is checking the amount of resources used for tasks.
    As a developer or administrator, you constantly need to assure that the usage
    does not overcome the threshold and performances are steady. Otherwise, major
    issues on services such as Apache Web Server may occur and lead to latency while
    loading important files. For this reason, having a tool like Acct is a great help
    to reduce time in using different commands to solve the same issues.


    Some of the main features of this tool are:


    * Statistics of users that logged in and logged off

    * Statistics of users that accessed to the machine

    * Commands previously executed by a user are still available


    To install the Acct utility, you can use the APT as shown here below:


    ```bash

    sudo apt-get install acct

    ```


    In this case, you need to run this command with the `sudo` at the beginning in
    order to have permission as root to run the command.


    Type the following command to see the data collected from the `wtmp` file. They
    provide the time the user connected to the system:


    ```bash

    ac

    ```


    ![](images/00042.jpeg)


    ### The option -d


    The `option -d` shows the time expressed in days:


    ```bash

    ac -d

    ```


    ![A screen shot of a computer Description automatically generated](images/00043.jpeg)


    ### The option -p


    The `option -p` shows the total login time of each user:


    ```bash

    ac -p

    ```


    ![](images/00044.jpeg)


    ### The command sa


    Executing the command `sa` you are able to see a summary of the commands available
    and recently executed:


    ```bash

    sa

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00045.jpeg)


    Taking a closer analysis of the tabled collecting the data, you see to what each
    column corresponds to:


    * Column 2: `0.00re` - time expressed in wall clock minutes

    * Column 3: `0.00cp` - system/user time expressed in cp

    * Column 5: `1131k` – time of CPU expressed for the numbers of units

    * Column 6: `ac` – the command it refers to


    ### The option -u


    The `option -u` shows information about the individual user:


    ```bash

    sa -u

    ```


    ### The option -m


    The command `sa` attached to the `option -m` works to show the number of processes
    expressed in cpu minutes:


    ```bash

    sa -m

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00046.jpeg)


    ### The option -c


    The command `sa` attached to the `option -c` works to show the percentage of users:


    ```bash

    sa -c

    ```


    ![A screenshot of a cell phone Description automatically generated](images/00047.jpeg)


