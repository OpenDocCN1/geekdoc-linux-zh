    command `host`, a list of options is available:


    ```bash

    host

    ```


    ![A screenshot of text Description automatically generated](images/00062.jpeg)


    As shown above, without no specific argument passed to the command, options are
    listed above.


    Enter the following to see the IP address of google:


    ```bash

