    Once that the command ping has been typed, it will reiterate the same operation
    for an infinite time.


    Type the command here below to ping google.com:


    ping google.com


    ![A close up of a screen Description automatically generated](images/00050.jpeg)


    In each line you can see the result of the ping command.


    56 bytes is the default number of data bytes which then 64 bytes for the Internet
    Control Message Protocol. While the IP address is  ord30s31-in-f238.1e100.net
    172.217.4.238. The sequence of consecutive packages is then generated from 1 to
    n, with the like it follows here below:


    icmp_seq=1


    Use the “option -c” to avoid repeating endlessly the same operation:


    ping -c 4 google.com


    The number “4” refers to the packages sent, so the ping command is able to interpret
    how many packages are expected to be sent and then stop the execution.


    The ping command is so important because it allows to quickly check if the server
    you are trying to reach is working.


    ![A close up of a person Description automatically generated](images/00051.jpeg)


    If you do not receive an answer typing the command “ping” there may be a problem
    on the network. In some cases, network issues also produce a loss of packages
    over the connection to the destination. One of the solutions that can be applied
    is just using the command here below to check the status of the lost packages
    and see what happens:


    traceroute


    Another useful option for the ping command, in addition to “-c”, is using the
    “-i” option. This rule can be used when there is another gateway source like here
    below:


    ping -I eth0 www.yourdomain.com


    Also, you can choose form which kind of internet protocol between IPv4 and IPv6
    you want to send the ping. The IPv4 and IPv6 with respectively interpreted with
    -4 and -6.


    ![A picture containing table, bird Description automatically generated](images/00052.jpeg)


    The Netstat command


    The netstat command is a great source to figure the statistics of the network.
    This means checking the if the ports TCP and UDP are open and more. The netstat
    utility is usually already available in your system. 


    Type the following command to see the current version of netstat:


    netstat -v


    Before digging in-depth the potentials of the netstat command, you should have
    a clear idea of how the ports TCP and UDP work. In fact, TCP and UDP are the two
    methods that can be chosen to send packets through a network. What you need to
    forward is the number of the port, the type of port, and the IP address of your
    destination.


    Just to refresh your memory, TCP stands for Transmission Control protocol and
    it is the most reliable method between the two. It connects the sender with the
    receiver, and it waits for an answer from the second one. The connection is established
    directly between the two and it only stops at the end. On the other hand, UDP
    stands for User Datagram protocol is a less reliable transmission of data, but
    at the same time also requires a lower load of work though the network.


    In order for a server to communicate with another machine, it needs a port that
    can be used as listener of incoming connections that have to be accepted from
    the server itself. Ports can be open or closed depending if there is a service
    such as a firewall that blocks the transmission of data. One of most common ports
    used by default for the TCP port is the port 80.


    Type the following command to list the TCP ports available as listener which means
    they accept connections:


    sudo netstat -t


    ![A screenshot of a cell phone Description automatically generated](images/00053.jpeg)


    While the option “sudo netstat -u” shows the UDP ports they are listening:


    sudo netstat -u


    The command with the option “-l” shows the listening ports:


    sudo netstat -l


    ![A close up of text on a white background Description automatically generated](images/00054.jpeg)


    As listed in the example here above, there is some important information displayed
    by the command. Starting with “proto”, the ping command produced the protocol
    used by the socket, then “local address” which indicates the IP address as well
    as the port that is listening to, and finally the “state” that specifies “LISTEN”.


    Other options that can be used:


    *   -n shows the addresses separated by dots


    *   -p displays PID (process identifier associated with a connection) and it has
    to be used with permissions as administrator.


    *   -a shows the sockets available for incoming connections


    All the options can be used at the same time all together to see the particular
    results.


    To check the statics of a network interface “option  -I”  in the kernel “option
    -a” :


    netstat -ai


    With the following command you can check the services, their state and the PID:


    sudo netstat -tunlp


    Adding “grep” you can filter the ports and see what services are using the specified
    port 80:


    sudo netstat -tnlp | grep :22


    ![](images/00055.jpeg)


    The ifconfig command


    Ifconfig is another of most widely used commands by an administrator to configure
    the network. As the name itself describes, ifconfig deals with the interface configuration,
    showing the network interfaces that can be used such as eth0, lo, etc.:


    ifconfig


    ![A screenshot of text Description automatically generated](images/00056.jpeg)


    As a consequence, using the following command, you are able to see the configuration
    on the interface eth0:


    Ifconfig eth0


    Each interface can also be activated or disabled according to your needs.


    The commands ““ifconfig up” and ““ifup” work in this way to apply changes.


    If the interface is already enabled, anything does not change:


    ifconfig eth0 up


    Similarly, to disable an interface such as eth0, use the commands “ifconfig down”
    or “ifdown eth0”:


    ifconfig eth0 down


    The same ifcong command is also used to assign an IP address to an interface like
    the wth0:


    ifconfig eth0 192.16.20.120


    Also, the ifconfig can be used with the command netmask to enable the network
    mask on a specific interface such as eth0:


    ifconfig eth0 netmask 255.255.255.220


    While the setting of the same command with “broadcast” sets the broadcast address
    on a specific interface:


    ifconfig eth0 broadcast 192.16.20.120


    The MUT, which stands for maximum transmission unit, is the largest part in a
    unit sent through a network interface. The attribution to the type of interface
    can be edited, also defining the threshold for the number of packets that can
    be sent each time.


    The example below sets up the transmission to a limit of 800 packets:


    ifconfig eth0 mtu 800


    Whereas usually the regular process checks if the packets belong to the interface
    currently in use, there is also an option to activate or disable what it is defined
    as promiscuous mode. With this type of mode packets are anywhere accepted. The
    following command in then used for this purpose:


    ifconfig eth0 promisc


    In opposition to the “promisc” command used to enable the configuration of the
    of the promiscuous mode, the “promisc” command disables this setting:


    ifconfig eth0 -promisc


    Another interesting feature is the alias that can be assigned to the interface
    eth0\. The value is in the same range of the subnet mask. Adding the IP address
    to “ifconfig eth0:0” you give the alias, while just “ifconfig eth0:0” checks the
    alias itself.


    ifconfig eth0:0 192.16.20.120


    ifconfig eth0:0'
