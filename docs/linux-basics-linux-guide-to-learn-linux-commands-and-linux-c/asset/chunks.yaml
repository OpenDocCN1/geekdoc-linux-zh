  raw: 'One of the main groups of log files is the system logs. To this category belongs
    all the logs that are essentially based on activities executed directly on the
    operating system and not log files created by other applications. The origin of
    the syslog can depend on syslog service, syslog protocol or syslog message. Syslog
    service addresses to receiving or forwarding messages. Based on a listener that
    then translates messages that are written or sent out to a remote server. Through
    the protocol log it is possible to figure the structure of messages and see how
    they are transmitted to another server. And finally, the syslog message is any
    message which has a standard header and a content that includes the timestamp,
    the application, the location in the system, and the priority.


    Some examples of these files are:


    *   System Log


    *   Authorization Log


    *   Deamon Log


    *   Kernel Log


    *   Debug Log


    System Log Files


    The System Log is the file that includes the majority of information related to
    the operating system.


    The path for the System log file is: /var/log/syslog


    In Ubuntu as well as other Debian-based systems all the files related to the system
    are stored under the syslog directory. While with some Linux distributions there
    is an exception for the messages which are available in a separate folder under
    the directory  /var/log/messages. These are generic files that describe who logged
    in when starting the machine such as any hardware issues that has to be identified
    at the reboot.


    Authorization Log Files


    This category of log files refers to a record with all the authentications including
    attempts which can be successful or failed accesses, the sudo command, passwords,
    management of users also through the Pluggable Authentication Module (PAM) system,
    and remote accesses through SSH (sshd logins).


    The path for the Authorization log file is:  /var/log/auth.log


    Other Linux distributions such as Redhat and CentrOS save the authorization logs
    in    /var/log/secure.


    Through the use of these files you will be able to keep track of vulnerable methods
    and possible unauthorized accesses from not listed users. As an administrator
    you will need a further investigation to track these activities.


    Deamon Log Files


    This group relates to all the services and application deamons that run on background
    with no direct intervention from the user and no output shown. Some examples are
    printing services, Bluetooth applications, Gnome Display Manager, MySQL database
    (mysqld), etc…


    The path for the Deamon log file is:  /var/log/daemon.log


    Kernel Log Files


    They give all the information about the Linux kernel such as who has logged in
    through the kernel. These logs provide warning and other messages that are really
    helpful for troubleshooting, such as for example a custom-built kernel as well
    as issues on hardware or network.


    The path for the Deamon log file is:  /var/log/kern.log


    Kernel Ring Buffer


    Using the utility dmesg utility you are able to access to messages that describe
    any related issues with hardware at the boot. The Kernel Ring Buffer messages
    provide information that are effectively useful to detect and solve any critical
    problem of communication between a device and its driver.


    The path for the Kernel Ring Buffer messages is:  /var/log/dmesg


    Kernel Log Files


    It provides information about the debug messages of the operating system.


    The path for the Debug log files is:  /var/log/debug


    Application Logs


    Applications may create the log files under the directory  /var/log/. They are
    usually well recognizable because you can find exactly the name of the application
    they refer to.


    Apache server log files


    In Ubuntu all the log files of apache are located under the subdirectory  /var/log/apache2/.
    Other Linux distributions contain the Apache log files under  var/log/httpd/.


    Here there are all the files used and loaded by Apache. This also means including
    in the list the IP address, user id all clients that are sending a request to
    the web server, time, date, HTTP resulting from a query.


    All accesses to the Apache server are stored separately in two files: the access_log
    and error_log. The access log refers to issues with the memory as well as the
    request sent to the web server in order to access. Whereas the error_log reports
    all errors related to the web server which means issues occurred over the httpd
    requests.


    In addition to these two files, the Apache server also has a different file for
    the attempts and accesses which is the access_log file.


    Whether the attempts are successfully finalized or not, all the logs are anyway
    registered. And this information is clearly resourceful to reiterate critical
    bugs.


    MySQL Log Files


    For some Linux distributions, the MySQL Log files are placed in the directory  /var/log/mysqld.log
    or  /var/log/mysql.log. The error logs for the newer versions of Linux Ubuntu
    can be found in  /var/log/mysql/error.log.


    While the location of the file can be different according to the Linux versions
    that you are using, the activity of monitoring is almost the same. You may use
    the file to trace unexpected behaviors of MySQL daemon mysqld such as starting
    while running or completing operations. A closer diagnosis on behaviors of the
    client with connections to a MySQL and requests of queries are examples of issues
    that may impact performances. Being knowledgeable of the content of a log file,
    you will be able to solve problems, crashes, and delays related to your database.


    CUPS Print System Logs (Ubuntu versions)


    The term CUPS stands for Common Unix Printing System and the error_log contains
    all the error related to printing issues on Ubuntu versions.


    The path for the CUPS Print System Log files is:  /var/log/cups/error_log


    Rootkit Hunter Log (Ubuntu versions)


    The Rootkit Hunter is a utility that has the goal to look for possible backdoors,
    sniffers and rootkits that may constitute a thread for your operating system.
    The Rootkit Hunter is available in the latest versions of Linux Ubuntu.


    The path for the Rootkit Hunter  Log files is:  /var/log/rkhunter.log


    Samba (SMB) Server


    SMB which stands for Server Message Block is a protocol used to share and transfer
    files between the same version of operating system as well as a variety of distributions
    or operating systems. That’s why it is so important as an administrator to be
    confident with these category of log files. Some attacks could come from a connection
    to another computer, and it is therefore a priority to be aware about how to face
    problems with the SMB protocol.


    The path for the Samba Server Log files is:  /var/log/samba


    Under the directory “samba” for the latest Ubuntu versions, you fill other categories
    which are the log.nmbd, log.smbd, and log.[IP_ADDRESS]. The first group named
    log.nmbd identifies with operations on the network which means Samba''s NETBIOS
    over IP adresses. The log.smbd provides information on the activities of sharing
    files, also known as Samba''s SMB/CIFS. The last typology, log.[IP_ADDRESS], contains
    information on requests for specific services sent by IP addresses.


    X11 Server Log (Ubuntu versions)


    In case you need solving issues with the X11 environment, you can look for the
    specific log files.


    The path for the X11 Server Log files is:  /var/log/Xorg.0.log


    If you are using an Ubuntu version, Xorg X11 is the default server used to run
    X11 Windowing Server.


    Other services and events logs


    Kernel


    The information is about connections through the kernel. This type of log is useful
    to retrieve any issues such as warnings related to the kernel.


    Login History'
