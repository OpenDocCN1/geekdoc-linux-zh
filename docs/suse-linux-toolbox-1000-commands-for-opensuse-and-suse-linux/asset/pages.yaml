  md: '# Chapter 11: Managing Network Connections


    As you can see, the longest hop is between 4 (Global Crossing probably in Minneapolis)
    and 5 (GC in Seattle). That gap is not really a bottleneck; it reflects the distance
    between these hops. Sometimes, the last hops look like this:


    ```

    28 * * *

    29 * * *

    30 * *

    ```


    The lines of asterisks (*) at the end of the trace can be caused by firewalls
    blocking traffic to the target. However, if you see several asterisks before the
    destination, those can indicate heavy congestion or equipment failures and to
    a bottleneck.


    By default, traceroute uses UDP packets, which provides a more realistic picture
    than ICMP. That''s because some Internet hops will give lower priority to ICMP
    traffic.


    By default, traceroute connects to port 80. You can set a different port using
    the -p option:


    ```

    traceroute -p 25 boost.turbosphere.com Connect to port 25 in trace

    ```


    You can view IP addresses instead of hostnames by disabling name resolution of
    hops:


    ```

    traceroute -n boost.turbosphere.com Disable name resolution in trace

    ```


    An alternative to traceroute is the tracepath, which also uses UDP to perform
    the trace:


    ```

    tracepath boost.turbosphere.com Use UDP to trace the route

    ```


    To view and manipulate the kernel''s routing table, the route command used to
    be the tool of choice. This is slowly being replaced by the ip route command.
    For the most part, the SUSE network scripts rely on ip route. But it doesn''t
    hurt to be familiar with both, because route is still commonly used.


    You can use the old route command to display your local routing table. Here are
    two examples of the route command, and without DNS name resolution:


    ```

    # route Display local routing table information

    Kernel IP routing table

    Destination Gateway Genmask Flags Metric Ref Use Interface

    10.0.0.0 * 255.255.255.0 U 0 0 eth0

    default ritchie 0.0.0.0 UG 0 0 eth0

    # route -n Display local routing table without DNS lookup

    ```


    ```

    Destination Gateway Genmask Flags Metric Ref Use Interface

    10.0.0.0 * 255.255.255.0 U 0 0 eth0

    0.0.0.0 10.0.0.1 0.0.0.0 UG 0 0 eth0

    ```


    211'
