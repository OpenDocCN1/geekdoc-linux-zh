    ```


    When a source code (src.rpm) is installed, rpm places the files it contains in
    default build tree under the /usr/src/packages/ directory, as shown by the ls
    command. You can install the RPM package, make changes to the source files of
    that package, and then rebuild the package using the commands in the following:


    ```

    $ rpm -Uvh BashBurn-2.1.1-0-pm.1.src.rpm

