  md: '# Chapter 3: Using the Shell


    # # Creating Simple Shell repetitive Scripts


    Shell scripts are good for automating repetitive shell tasks. Bash and other shells
    include the basic constructs found in various programming languages, such as loops,
    tests, case statements, and so on. The main difference is that there is only one
    type of variable: strings.


    # ## Editing and Running a Script


    Shell scripts are simple text files. You can create them using your favorite text
    editor (such as vi). To run, the script file must be executable. For example,
    if you created a shell script with a name of `myscript.sh`, you could make it
    executable as follows:


    ```

    $ chmod u+x myscript.sh

    ```


    Also, the first line of your bash scripts should always be the following:


    ```

    #!/bin/bash

    ```


    As with any command, besides executing the shell script you create must also either
    in your PATH or be identified by its full or relative path when you run it. In
    other words, if you just try to run your script, you may get the following result:


    ```

    $ myscript.sh

    bash: myscript.sh: command not found

    ```


    In this example, the command containing `myscript.sh` is not included in your
    PATH. To correct this problem, you can edit your path, copy the script to a directory
    in your PATH, or enter the full or relative path to it. Those four examples, are
    shown below:


    ```

    $ mkdir /bin; cp myscript.sh /bin/; PATH=$PATH:-/bin

    $ cp myscript.sh /usr/local/bin

    $ ./myscript.sh

    $ /tmp/myscript.sh

    ```


    Avoiding a dot (.) into the PATH to indicate that commands can be run from the
    current directory. This is a technique that could result in commands with the
    same file name as important, well-known commands (such as `ls` or `cat`), which
    could be overridden if a command of the same name exists in the current directory.


    # ## Adding Content to Your Script


    Although a shell script can be a simple sequence of commands, shell scripts can
    also be used as you would any programming language. For example, a script can
    produce different results based on giving it different input. This section describes
    how to use compound commands, such as `if/then` statements, case statements, and
    `for/while` loops in your shell scripts.'
