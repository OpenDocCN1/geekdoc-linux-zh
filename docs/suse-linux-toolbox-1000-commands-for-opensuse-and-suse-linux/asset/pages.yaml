  md: '# 8

    Backups and Removable Media


    Data backups in Linux were traditionally done by running commands to archive and
    compress the files to back up, then writing that backup archive to tape. Choices
    for archive tools, compression techniques, and backup media have grown tremendously
    in recent years. Tape archiving has, for many, been replaced with techniques for
    backing up data over the network, to other hard disks, or to CDs, DVDs, and other
    low-cost removable media.


    +   ### IN THIS CHAPTER

    - Creating backup archives with tar

    - Compressing backups with gzip, bzip2, and izop

    - Backing up over the network with SSH

    - Doing network backup ups with rsync

    - Making backup ISO images with mkisofs

    - Burning backup images to CD or DVD with dcdrecord


    This chapter details some useful tools for backing up and restoring your critical
    data. The first part of the chapter details how to use basic tools such as tar,
    gzip, and rsync for backups.


    # Backing Up Data to Compressed Archives


    If you are coming from a Windows background, you may be used to tools such as
    WinZip and PKZIP, which both archive and compress groups of files in one application.
    Linux offers separate tools for gathering groups of files into a single archive
    (such as tar) and compressing that archive for efficient storage (gzip, bzip2,
    and lzop). However, you can also do the two steps by using additional options
    to the tar command.


    # Creating Backup Archives with tar


    The tar command, which stands for tape archiver, dates back to early Unix systems.
    Although magnetic tape was the common medium that tar write originally, today
    tar is most often used to create an archive file that can be distributed to a
    variety of media.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Chapter 8: Backups and Removable Media


    The fact that the tar command is rich in features is reflected in the dozens of
    options available with tar. The basic operations of tar, however, are used to
    create a backup archive (-c), extract files from archive (-x), compare differences
    between archives (-d), and update files in archive (-u). You can also append files
    to (-r or -a) or delete files from (-d) an existing archive, or list the contents
    of an archive (-t).


    > NOTE Although the tar command is available on nearly all Unix and Linux systems,
    it behaves differently on many systems. For example, Solaris does not support
    -z to manage archives compressed in gzip format. The Star (ess-tar) command supports
    access control lists (ACLs) and file flags (for extended permissions used by Samba).


    As part of creating a tar archive, you can add options that compress the resulting
    archive. For example, add -j to compress the archive in bzip2 format or -z to
    compress in gzip format. Regular tar files end in .tar, while compressed files
    end in .tar.bz2 (compressed with bzip2) or .tar.gz (compressed with gzip). If
    you compress a file manually with lz (see www.lzop.org), the compressed file should
    end in .tar.lz.


    Besides being for backups, tar files are popular to distribute source code and
    binaries from software projects. That''s why you can expect every Linux and Unix-like
    system to contain the tools you need to work with tar files.


    > One quirk of working with the tar command comes from the fact that tar was created
    before there were standards regarding how options are entered. Although you can
    prefix options with a dash, it isn''t always necessary. You might see a command
    that begins tar xvf no dashes to indicate the options.


    A classic example of using the tar command might combine old-style options and
    pipes for compressing the output:


    ```

    $ tar c *.txt | gzip -c myfiles.tar.gz Make archive, zip it, and output

    ```


    The example just shown illustrates a two-step process you might find in documentation
    for Unix systems. The command creates (-c) an archive from all .txt files in the
    current directory. The output is piped to the gzip command and output to stdout
    (-c), and redirected to the myfiles.tar.gz file. Note that tar is one of the few
    commands which don''t require options to be preceded by a dash (-).


    New tar versions, on modern Linux systems, can create the archive and compress
    the output in one step:


    ```

    $ tar czf myfiles.tar.gz *.txt Create zipped tar file of .txt files

    $ tar cvf myfiles.tar.gz *.txt Be more verbose creating archive

    textfile1.txt

    textfile2.txt

    ```'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Chapter 8: Backups and Removable Media


    In the examples just shown, note that the new archive name (myfiles.tar.gz) must
    immediately follow the option to tar (which indicates the name of the archive).
    Otherwise the output from tar will be directed to stdout (in other words, your
    screen). The z option says to gzip compression, and v produces verbose descriptions
    of processing.


    When you want to return the files to a file system (unzipping and untaring), you
    can also do that as a one-step or two-step process, using the tar command and
    optionally the gunzip command:


    ```

    $ gunzip -cf myfiles.tar.gz | tar x

    Unzips and untars archive

    ```


    Or try the following command instead:


    ```

    $ gunzip myfiles.tar.gz ; tar xf myfiles.tar

    Unzips then untars archive

    ```


    To do that same procedure in one step, you could use the following command:


    ```

    $ tar xvf myfiles.tar.gz

    textfile1.txt

    textfile2.txt

    ```


    The result of the previous commands is that the archived .txt files are copied
    from the archive to the current directory. The x option extracts the files, z
    uncompresses (unzips) the files, v makes the output, and f indicates that the
    next option is the archive file (myfiles.tar.gz).


    # Using Compression Tools


    Compression is an important aspect of working with backup files. It takes less
    disk space on your backup medium (CD, DVD, tape, and so on) or server to store
    compressed files. It also takes less time to transfer the archives to the media
    or download the files over a network.


    While compression can save a lot of storage space and transfer times, it can significantly
    increase your CPU usage. You can consider using hardware compression on a tape
    drive (see www.amanda.org/docs/faq.html#id346016).


    In the examples shown in the previous section, tar calls the gzip command. But
    tar can work with many compression tools. Out of the box on SUSE, tar will work
    with gzip and bzip2. A third compression utility we add to our toolbox is the
    lz command, which can be used with tar in a different way. The order of these
    tools from fastest/least compression to slowest/most compression is: lz, gzip,
    and bzip2.


    141'
