  md: '# Chapter 11: Managing Network Connections


    Here''s how to do a basic host scan with nmap:


    ```

    # nmap 10.0.0.1    Scan ports on computer at 10.0.0.1

    ```


    To get maximum verbosity from nmap, use the -vv option:


    ```

    # nmap -vv 10.0.0.1    Show maximum verbosity from nmap output

    ```


    Use nmap to scan an entire network, use the network address as an argument. In
    the following example, we use the -sp option to tell nmap to perform a simple
    ping sweep:


    ```

    # nmap -sv -S 10.0.0.0/24    Scan hosts on an entire network

    ```


    You can be very specific about the information that nmap gathers for you. In the
    following example, the -P0 option tells nmap not to use ping (this is good for
    scanning machines that do not respond to ping). The -O option tells OS fingerprinting
    the machine you are scanning. The -p 100-200 option tells nmap to scan only ports
    100 through 200:


    ```

    # nmap -vvO -P0 -p 100-200 10.0.0.1    No ping, OS fingerprint, ports 100-200

    ```


    The nmap command has lot more options for advanced usage. Refer to the nmap man
    page (man nmap) for further information.


    # Summary


    Nearly every aspect of the network connections from your SUSE system can be configured,
    checked, and monitored using command line tools. You can view and change settings
    of your NICs using the ethtool command. You can view network statistics with netstat.


    To start and stop your network, commands such as service, chkconfig, ifup, and
    ifdown are easy manage. Once a connection is established, you can see statistics
    about connection using ifconfig and ip commands.


    Besides using Ethernet cards, other network hardware such as wireless LAN cards
    and dial-up modems are supported in Linux. Use commands such as iwconfig to work
    with wireless interfaces, and wdialconf and minicom to configure modems.


    To check DNS name resolution, use the dig, host, and hostname commands. Commands
    for checking connectivity and routes to a host include ping, arp, traceroute,
    and ip.'
