  md: '# Chapter 2: Installing openSUSE and Adding Software


    # Verifying Installed Packages with rpm


    There are times when you will question the binary of a package installed on the
    system. It may not perform correctly, or may not start at all. Problems with corrupt
    packages from unstable network connections or power outages do happen. It becomes
    useful to check the files on the system against the information stored in the
    RPM database.


    > NOTE It''s possible that an intruder replaces a key binary file may also have
    tampered with your RPM database. So, use this tool as one way of checking the
    validity of your system, but not necessarily the only.


    For each verified, rpm runs multiple checks and displays the result in a series
    of characters at the beginning of the line. A dot means the check was okay. A
    letter or number the check failed. Table 2-7 shows the most useful checks and
    the characters that represent their failure.


    # Table 2-7: RPM Package Verification Failure Messages


    | Letter Indicating Check Failure | Description |

    |---|---|

    | S | File size differs |

    | M | Mode differs: includes permissions and file type |

    | 5 | MD5 checksum differs |

    | U | User ownership differs |

    | G | Group ownership differs |

    | T | mTime (timestamp of last modification) differs |


    Use the following command to verify all installed packages and filter for files
    with bin in their path:


    ```

    # rpm -Va | grep bin

    S.5....T /usr/bin/curl

    ```


    This shows that the curl binary on the file system has a different size, MD5 checksum,
    and modification time than the one that came with the RPM. In other words, the
    file has been replaced. Here are a few other examples using the verify option:


    ```

    # rpm -Vv coreutils Verbose check files from coreutils

    # rpm -Vf /usr/bin/pr Verify package containing pr

    ```'
