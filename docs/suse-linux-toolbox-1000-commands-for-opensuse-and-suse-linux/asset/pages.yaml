  md: '# Chapter 9: Checking and Managing Running Processes


    # # Listing Active Processes


    To see which processes are currently running on a system, most people use the
    ps and top commands. The ps command gives a snapshot (in a simple list) of processes
    running at the moment. The top command offers a screen-oriented, constantly updated
    list of running commands, sorted as you choose (by CPU use, memory use, UID, and
    so on).


    # ## Viewing Active Processes with ps


    Every Linux system (as well as every system from Unix, as BSD, Mac OS X, and others)
    includes the ps command. Over the years, many slightly different versions of ps
    have appeared, offering slightly different options. Because ps dates back to the
    first Unix systems, it also supports nonstandard ways of entering options (for
    example, allowing you to drop the dash in option (some cases)).


    The different uses of ps in this chapter will work on SUSE, openSUSE, and most
    other Linux systems. Here are some examples of how you can show running processes
    for the current user (Table 9-1 lists column descriptions of processes):


    ```

    $ ps                          List processes of current user at current shell

    PID TTY                       COMMAND

    2552 pts/0                   00:00:00 bash

    3438 pts/0                   00:00:00 ps

    $ ps -u chris                 Show all chris'' running processes (simple output)

