  md: '# Chapter 11: Managing Network Connections


    # Starting and Stopping Ethernet Connections


    The reason that your wired Ethernet interfaces just up in many cases when you
    boot SUSE is that the network service is set to be on when the system enters the
    common boot run levels (run 3 and 5). There is a set of underlying configuration
    files and scripts that make happen and a few simple commands that you can control.


    For SUSE, control scripts and configuration files are located in the /etc/sysconfig/network/;
    NICs are configured by editing /etc/sysconfig/network/ifcfg-interface, where interface
    is your NIC''s network interface. For example, for the first Ethernet interface,
    the configuration file is named ifcfg-eth0.


    The script that starts the configured network files is /etc/init.d/network. As
    with other Linux services, you can start and stop the network service using the
    service command and let it start automatically with the chconfig command.


    To take all NICs off then bring them back online, allowing any change to the network
    scripts to take that effect, use the following:


    ```

    # service network restart Shutdown and bring up network interfaces

    Shutting down network interfaces:

    eth0 device: Intel Corporation PRO/100 VE Network Connection done

    lo IP address: 127.0.0.1 done

    Setting up network service . . . done.

    SuSEFirewall2: Setting up rules from /etc/sysconfig/SuSEFirewall2 ...

    SuSEFirewall2: batch committing...

    SuSEFirewall2: Firewall rules successfully s

    ```


    Use the start and stop options to start and stop your network interfaces, respectively:


    ```

    # service network stop Shutdown network interfaces

    # service network start Bring up network interfaces

    ```


    To check the status of your network interfaces, use the following:


    ```

    # service network status Check network interface status

    Checking optional network interfaces:

    eth0 device: Intel Corporation PRO/100 VE Network Connection (rev 01)

    eth0 DHCP client not running, because it got an infinite lease

    eth0 IP address: 192.168.1.106/24 (DHCP)

    eth0 IP address: 192.168.1.106/24 running

    Checking mandatory network interfaces:

    lo IP address: 127.0.0.1 running

    Checking service network running

    ```'
