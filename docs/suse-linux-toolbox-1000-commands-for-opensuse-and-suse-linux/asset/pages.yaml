    bytes). Large packets (such as the 1500-byte setting just shown) are good to make
    faulty NICs or connections stand out.


    # Checking Address Resolution Protocol (ARP)


    If you''re not to ping your gateway, you may have an issue with the Ethernet MAC
    layer. The Address Resolution Protocol (ARP) can be used to find information at
    the MAC layer. To view and configure ARP entries, use the arp or ip neighbor command.
    This example shows listing entries in the ARP cache by hostname:


    ```

    # arp -v List ARP cache entries by name

    Address HwType Address Flags Mask Iface

    ritchle ether 00:10:5A:AB:F6:A7 C eth0

    einstein ether 00:0B:6A:02:EC:98 C eth0

    Entries: 1 Skipped: 0 Found: 1

    ```


    In this example, you can see the names of other computers that the local computer''s
    ARP cache knows about the associated hardware type and hardware address (MAC)
    of each computer''s NIC. You can disable name resolution to see those computers''
    IP addresses instead:


    ```

    # arp -vn List ARP cache entries by IP address

    Address HwType Address Flags Mask Iface

    10.0.0.1 ether 00:10:5A:AB:F6:A7 C eth0

    10.0.0.50 ether 00:0B:6A:02:EC:98 C eth0

    Entries: 1 Skipped: 0 Found: 1

    ```


    To delete an entry from the ARP cache, use the -d option:


    ```

    # arp -d 10.0.0.50 Delete address 10.0.0.50 from ARP cache

    ```


