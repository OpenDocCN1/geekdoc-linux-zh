    Using visual mode


    This appendix focuses on features of the editor that can not only help you with
    basic editing, but also help you do some advanced text manipulation. We chose
    to chooser vi rather than Emacs because vi is more universal and leaner, and also
    because keyboard shortcuts require only two arms. Because many Linux systems use
    the Vim (Vi Improvsed) editor in place of the older vi, the descriptions in this
    appendix are extended to cover Vim as well. Some features in Vim that are not
    in vi do-notde include multiple undo levels, syntax highlighting, and online help.


    > NOTE If you have never used vi or Vim before, try out the tutor that comes with
    the vim-base package. Run the vimtutor command and follow the instructions to
    step through many of the key features of vi and Vim.


