    the same inode number). Changing permissions, ownership, date/time stamps, or
    content of any hard link to a file results in all others being changed as well.
    However, deleting one link will not remove the file; it will continue to exist
    until the last link to the file is deleted.


    Here are some examples of using the ln command to create hard and symbolic links:


    ```

    $ touch myfile

    $ ln myfile myfile-hardlink

    $ ln -s myfile myfile-symlink

    $ ls -ii myfile

    29207 -rw-r--r-- 2 users 2007-09-29 11:51 myfile

    29207 -rw-r--r-- 2 users 2007-09-29 11:51 myfile-hardlink

    29208 lrwxrwxr-x 1 users 2007-09-29 11:51 myfile-symlink -> myfile

    ```


    Note that after creating hard and symbolic links, we used the ls -i command to
    list the results. The -li option shows the inodes associated with each file. You
    can see that myfile and myfile-hardlink both have the inode number of 29207 (signifying
    the exact same file). The myfile-symlink symbolic link has a different inode number.
    And although the hard link simply appears as a file (-), the symbolic link is
    identified as a link (1) with wide-open permissions. You won''t know if you can
    access the symbolic link points until you try it or list the link target.


    # Using Devices Files


    When applications need to communicate with your computer''s hardware, they access
    device files. By convention, device files are stored in the /dev directory. Devices
    are generally divided into block devices (such as storage media) and character
    devices (such as serial ports and terminal devices).


    Each device file is associated with a major number (indicating the type of the
    device) and minor number (indicating the instance number of the device). For example,
    (tty) devices are represented by major character 4, whereas SCSI hard disks are
    represented by block device number 8. Here are examples of device files:


    ```

    $ ls -l /dev/tty0 /dev/sda List character and block special devices

    br-rw--r-- 1 root root 8, 2007-09-05 08:34 /dev/sda

    crw-rw-rw- 1 root root 4, 2007-09-05 08:34 /dev/tty0

    ```


    A listing of device names and numbers allocated in Linux is available in SUSE
    in the online manual for the MAKEDEV command (you must install the separate maked
    package to get this.). Most device files are created automatically for you at
    boot time, based on entries in the /etc/maked.d directory. However, you may need
    to create your own device file using the mknod command. Here''s an example:


    ```

    $ mknod /dev/ttyS4 c 68 Add device for fifth serial port

    $ ls -l /dev/ttyS4 List new device file

    crw-rw--r-- 1 root root 4, 2007-09-29 00:35 /dev/ttyS4

    ```'
