- img_proc: true
  md: '# Chapter 12: Accessing Network Resources


    Add and modify NFS directories by making changes to the /etc/exports file. You
    can define permissions, as described in the exports man page. To get changes to
    take effect, type any of the following as root:


    ```

    # service nfs reload Reload exported shared directories

    # exports -rv Reload exported shared directories

    # exports -rv Verb reload of exported shares

    exporting client.example.com:/export/myshare

    exporting *:/mnt/public

    ```


    From the Linux server system, you can use the showmount command to see what directories
    are available from the local system. For example:


    ```

    # /usr/bin/showmount -e

    Export list for server.example.com

    /export/myshare client.example.com

    /mnt/public

    ```


    From a client system, you can use the showmount command to see what directories
    are available from a selected computer. For example:


    ```

    # /usr/bin/showmount -e server.example.com

    /export/myshare client.example.com

    /mnt/public

    ```


    # Mounting NFS Shares


    Use the mount command to mount a remote NFS share on the local computer. Here
    is an example:


    ```

    # mkdir /mnt/server-share

    # mount server.example.com:/export/myshare /mnt/server-share

    ```


    This example notes the NFS server (server.example.com) and the shared directory
    from that (/export/myshare). The local mount point, which must exist before mounting
    the share, appears at the end of the command (/mnt/server-share).


    Pass NFS-specific options to the mount command by adding them with the -o option:


    ```

    # mount -o rw,hard,int server.example.com:/export/myshare /mnt/server-share

    ```


    The rw option mounts the remote directory with read-write permissions, assuming
    that permission is available. With hard set, using the server will see a server
    responding message when a read or write operation times out. If that happens,
    having set the intr option lets you interrupt a hung request to a remote server
    (Ctrl+c).'
  merge: -1
  pgno: 254
- img_proc: true
  md: "By default, NFS version 3 (nfs3) protocol is used to connect to the share.\
    \ To use NFS version 4, which is designed to work over the Internet and through\
    \ firewalls, indicate that protocol as the file system type on the command line\
    \ as follows:\n\n```\n# -t nfs4 server.example.com: /mnt/server-share\n```\n\n\
    Use this as a guideline. You need to create the mount-point directory first. And,\
    \ you should ensure that you have configured NFS to your liking.\n\n> NOTE Depending\
    \ on which version of SLUSE you use, the implementation of NFS v4 may not be robust\
    \ enough for production. It may be safer or more reliable to tunnel errors of\
    \ NFS over SSH. You can find more information on this topic with an Internet search\
    \ for “nfs ssh”. see www.howforge.org/nfs_ssh_tunneling and http://tldp.org/HOWTO/HOWTO-security.html\
    \ for more on on security and NFS.\n\n# Sharing Remote Directories with Samba\n\
    \nSamba is the open source implementation of the Windows file and printing protocol\
    \ originally known as Server Management Block (SMB) and now called Common File\
    \ System (CIFS). There is an implementation of Samba in Linux, and as in many\
    \ other operating systems.\n\nGraphical tools for sharing, querying, and monitoring\
    \ shared SMB directories from Windows include the Samba web-based administration\
    \ tool. To use the SWAT tool in Linux, install the samba-swat package, enable\
    \ the xinetd service (by typing xinetd start), and turn on SWAT (ch swat on).\
    \ Open SWAT by pointing your browser to the SWAT service (http://localhost:901)\
    \ and typing the root user and password.\n\nWhen SWAT started on SUSE, you may\
    \ need to add a port number to the SWAT configuration file (The port number is\
    \ defined as 901 in /etc/services). If you cannot connect to swat from a web browser,\
    \ edit the file /etc/xinetd.d/swat. The port number setting is the only change\
    \ necessary:\n\n# SWAT is the Samba Web Administration Tool.\n\n```\nservice swat\n\
    {\n  port = 901\n  socket_type = stream\n  protocol = tcp\n  wait = no\n  user\
    \ = root\n  server = /usr/bin/swat\n  only_from = 127.0.0.1\n  log_on_failure\
    \ += USERID\n}\n```"
