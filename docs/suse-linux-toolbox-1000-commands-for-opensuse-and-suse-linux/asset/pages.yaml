    Using the -P and -L options to pw and cd, you can work with symbolically linked
    directories in their permanent or link locations, respectively. For example, cd
    -L .. takes you up one level to your home directory, while cd -P takes you up
    one level above the permanent directory (/). Likewise, -P and -L options to pw
    show permanent and link locations.


    Bash can remember a list of working directories. Such a list can be useful if
    you want to return to previously visited directories. That list is organized in
    the form of a stack. Use pushd and popd to add and remove directories to bash’s
    list:


    ```

    $ pwd

    /home/francois

    $ pushd /usr/share/man/

    /usr/share/man ~

    $ pushd /var/log/

    /var/log /usr/share/man ~

    $ dirs

    /var/log /usr/share/man ~

    $ dirs -v

    0 /var/log

    1 /usr/share/man

    2 -

    $ popd

    /usr/share/man

    $ pwd

    /usr/share/man

    $ popd

    ~

    $ pwd

    /home/francois

    ```


    The dirs, pushd, and popd commands can also be used to manipulate the order of
    directories on the stack. For example, pushd -0 pushes the last directory on the
    stack to the top of the stack (making the current directory). The pushd -2 pushes
    the third directory from the bottom of the stack to the top.


