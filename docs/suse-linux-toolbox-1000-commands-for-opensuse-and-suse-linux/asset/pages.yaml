    # Creating and Using Swap Partitions


    Swap partitions are needed in Linux systems to hold data that overflows from your
    system''s RAM. If you didn''t create a spare partition when you installed Linux,
    you can create it later using the mkswap command. You can create a swap partition
    on a regular disk partition or in a file formatted as a swap partition. Here are
    some examples:


    ```

    # mkswap /dev/sda      Format sda as a swap partition

    ```


