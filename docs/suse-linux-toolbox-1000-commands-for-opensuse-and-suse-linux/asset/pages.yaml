    The tools cover network troubleshooting, mostly at the network layer (layer 3).
    To display information about packets sent between layer protocols (TCP and UDP)
    and ICMP, you can use the netstat command:


    ```

    $ netstat -s | less                        Show summary of TCP, ICMP, UDP activities

    ```'
