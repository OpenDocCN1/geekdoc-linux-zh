  md: 'HTTP redirects that prevent rpm from installing straight from HTTP. Or you
    may want

    to script the automated download of a file, such as a log file, every.


    The wget command can download files from web servers (HTTP and HTTPS) and FTP

    servers. With a server that doesn''t require authentication, a wget command can
    be

    simple as the wget command and the location of the download file:


    ```

    $ wget \

    http://dag.wieiers.com/rpm/packages/acroread/acroread-5.0.10-1.el5.rf.i386.rpm

    ```


    If, for example, an FTP server requires a login and password, you can enter information
    on

    the wget command line in the following forms:


    ```

    $ wget ftp:user:password@ftp.example.com/path/to/file

    $ wget --user=user --password=password@ftp.example.com/path/to/file

    ```


    For example:


    ```

    $ wget http://mykuilpwd@ftp.linuxoys.net/home/chris/image.jpg

    $ wget --ftp-user=chris --ftp-password=mykuilpwd \

    ftp://.linuxoys.net/home/chris/image.jpg

    ```


    You can use wget to download a single web page as follows:


    ```

    $ wget http://www.wiley.com  Download only the Web Page

    ```


    If you open the index.html, you''ll have all sorts of broken links. To down-

    all the images and other elements required to render the page properly, use the

    -p option:


    ```

    $ wget -p http://www.wiley.com  Download Web page and other elements

    ```


    But if you opening the index.html in your browser, chances are you will still

    have all the broken links even though the images were downloaded. That''s because

    links need to be translated to point to your local files. So, do this:


    ```

    $ wget -pk http://www.wiley.com  Download pages and use local file names

    ```


    And you''d like wget to keep the original file and also do the translation, this
    type:


    ```

    $ wget -pkK http://www.wiley.com  Rename to local names, keep original

    ```


    Sometimes an HTML file you download does not have a .html extension, but ends

    in .asp or .cgi instead. That may result in your browser knowing how to open

    tour local copy of the file. You can have wget append .html to those files using
    the

    -E option:


    ```

    $ wget -E http://www.asexamples.com  Append .html to downloaded files

    ```'
