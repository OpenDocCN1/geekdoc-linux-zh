  md: '# 12


    # Accessing

    Network Resources


    In the time it takes to fire up a graphical FTP client, you could have already
    downloaded a few dozen files from a remote server using command line tools. When
    a GUI is available, commands for transferring files, web browsing, sharing directories,
    and reading mail can be quick and efficient to use. When no GUI is available,
    they can be lifavers.


    +   IN THIS CHAPTER

    Web browsing

    with links

    Wget, curl, lftp, and

    scp for file transfers

    Sharing directories

    with NFS, Samba,

