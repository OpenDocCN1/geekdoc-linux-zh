  md: '# Getting Information

    from /proc


    Originally intended to be a location for storing information used by running processes,
    the /proc file system eventually became the primary location for storing all kinds
    of information used by the Linux kernel. Despite the emergence of /sys to provide
    a more orderly framework for kernel information, many Linux utilities still gather
    and present data about your running system from /proc.


    > IN THIS APPENDIX


    Viewing /proc

    information


    Changing /proc

    information variables


    If you are someone who prefers to cut out the middleman, for /proc there is a
    separate directory utilities that read /proc files and read (and sometimes even
    write to) /proc files directly. By checking /proc you can find the state of processes,
    hardware devices, kernel subsystems, and other attributes of Linux.


    # Viewing /proc information


    Checking out information in files from the /proc directory can be done by using
    a simple cat command. In /proc each running process (named by its process ID)
    contains information about the process. There are also /proc files that contain
    data for all kinds of other things, such as your computer''s CPU, memory usage,
    soft-ware versions, disk partitions, and so on.


    The following examples describe some of the information you can get from your
    Linux system''s /proc directory:


    ```

    $ /proc/cmdline Shows options passed to the boot prompt

    root=/dev/disk/by-id=/scsi-SATA-FUJITSU-MPG3409-VH06T10RV9W-part2

    resume=/dev/sda5 splash=silent showopts

    $ /proc/cpuinfo Shows information about your processor

    Processor:

    vendor_id : GenuineIntel

    cpu family : 6

    model : 8

    model name : Pentium III (Coppermine)

    ```'
  merge: -1
  pgno: 307
