  md: '# 10


    # Managing the System


    Without careful management, the demands on your Linux system can sometimes exceed
    the resources you have available. Being able to monitor your system''s activities
    (memory, CPU, and device usage) over time can help make sure that your machine
    has enough resources to do what you need it. Likewise, managing other aspects
    of your system, as the device drivers it uses and how the boot process works,
    can help avoid performance problems and system failures.


    This chapter is divided into several sections that relate to ways of managing
    your SUSE or other Linux system. The first section can help monitor the resources
    (processing power, devices, and memory) on your Linux system. The next section
    describes how to check and set your system clock. Descriptions of the boot process
    and subsequent run levels. The last sections describe how to work with the kernel
    and related device drivers, as well as how to view information about your computer''s
    hardware components.


    # IN THIS CHAPTER


    +   Checking memory use with free, top, vmstat, and slabtop


    +   Viewing CPU use with iostat, dstat, and top


    +   Monitoring storage devices with iostat, vmstat, and isof


    +   Working with dates/time using date, hwclock, cal, and NTP


    +   Changing GRUB boot loader behavior


    +   Rebuilding the initial ramdisk


    +   Dealing with run levels with runlevel and init


    +   Adding, removing, and listing services with chkconfig and service


    +   Shutting down the system with reboot, halt, and shutdown


    +   Checking and changing kernel driver settings with ismod, modinfo, and modprobe


    +   Watching hardware settings with lci, dmidecode, and hdparam


    # Monitoring Resources


    SUSE, openSUSE, and other Linux systems do a wonderful job of keeping track of
    what they do. If you care to look, you can find lots of information about how
    your CPU, hard disks, virtual memory, and other computer resources are being used.


    You can go to where the kernel stores information about your system by directly
    viewing the contents of files in the /proc file system (Appendix C). An alternative,
    however, is to use commands to view information about your computer''s virtual
    memory, processor, storage devices, and network interfaces being used on your
    system.'
