    # Working with Software Packages


    Software delivered particularly for SUSE systems is packaged in what are called
    RPM packages. An RPM package (.rpm extension) contains not only the software you
    want to install, as a compressed archive, but also holds lots of information about
    the contents of the package. That information can include software descriptions,
    dependencies, computer architecture, vendor, size, and licensing information.
    RPMs may include installation scripts.


    Once a basic openSUSE system is installed, you can add, remove, and otherwise
    manage openSUSE packages to suit how you use that system. OpenSUSE and SLED/SLES
    use RPM Package Manager (RPM) to create and manage software for these systems.
    This RPM package management tool is also used on other Linux systems, including
    Fedora, Red Hat Enterprise Linux, kernel, and Mandriva.


    A plethora of software management tools are available for your openSUSE/SLED/SLES
    system, including RPM, YaST, SMART, APT, yum, and ZENworks, just to name a few.
    Historically, SUSE systems have relied on YaST and RPM to get the package management
    job done. This chapter covers three package management utilities to provide resources
    for software management in SUSE Linux:


    +   - YaST — Use YaST, a text-based interface (YaST also provides a graphical
    interface), to download and install packages from online repositories. The yast
    command is preferred over rpm for installing packages in most cases because yast
    will get dependent packages needed by those packages you want to install. Also,
    by getting packages from official repositories, you are most likely to get the
    latest available packages.

    - Zypper — The zypper command provides an easy command-line tool for managing
    packages. Use zypper to add repositories (Software Catalogs in YaST) as search
    for and display information about available software packages, patches, and updates.
    With YaST, zypper will automatically resolve software package dependencies, so
    you do not have to hunt for every package needed to install a single piece of
    software. Note, however, Novell does not recommend mixing zypper with an environment
    managed by Novell ZENworks, since zypper does not use the ZENworks dm database.
    For more information on Zypper integration, visit the openSUSE web site (http://en.opensuse.org/Zypper/Usage#About).


