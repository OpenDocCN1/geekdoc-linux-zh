  md: '# Chapter 12: Accessing Network Resources


    The lftp session illustrates how you can use shell command names to operate on
    remote directories (provided you have permission). and mkdir commands create a
    directory and leave permissions only to your user account. The put command uploads
    one or more files to the remote server. The mput command can use wildcards to
    match multiple files for download. Other commands include mirror and mirror -R
    (to download a directory tree).


    lftp also provides a script for non-interactive downloads: lftpget. The syntax
    of lftpget is similar to the wget command:


    ```

    $ lftpget ftp://mirrors.kernel.org/centos/5.0/x86_64/RELEASE-NOTES-en

    ```


    Keep in mind that standard FTP clients are insecure because they do all their
    in clear text. So your alternative, especially when security is a major issue,
    is to use SSH tools to transfer files.


    # Using SSH Tools to Transfer Files


    Because SSH utilities are among the most important tools in a system administrator''s
    arsenal of communications commands, some of the more complex uses of configuring
    and using SSH utilities are covered in Chapter 13. However, in their most basic
    form, SSH utilities are the tools you should use most often for basic file transfer.


    In particular, the scp command will do what you need to get a file from one computer
    to another, while making that communication safe by encrypting both the password
    stage and data transfer stage of the process. The scp command replaces the rcp
    command as the most popular tool for host-to-host copies.


    > WARNING! You do not get a warning before overwriting existing files with scp,
    so be sure that the target host doesn''t contain any files or directories you
    want that in the path of your scp file copies.


    # Copying Remote Files with scp


    To use scp to transfer files, the SSH service (usually the sshd daemon) must be
    running on the remote system. Here are some examples of useful scp commands:


    ```

    $ scp myfile francois@server1:/tmp/

    Password: ********

    $ scp server1:/myfile .

    ```


    Copy myfile to server1

    Copy remote myfile to local working dir


    Use the -p option to preserve permissions and timestamps on the copied files:


    ```

    $ scp -p myfile server1:/tmp/

    ```'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Chapter 12: Accessing Network Resources


    If the SSH service is configured to listen on a other port than the default port
    22, we use -P to indicate that port on the scp command line:


    ```

    $ scp -P 12345 myfile server1:~/tmp      Connect to a particular port

    ```


    To do recursive copies, from a particular point in the remote file system, use
    the -r option:


    ```

    $ scp -r mydir francois@server1:~/tmp      Copies all mydir to remote /tmp

    ```


    Although scp is most useful when you know the exact locations of the file(s) you
    need to copy, sometimes it''s more helpful to browse and transfer files interactively.


    # Copying Remote Files in sftp and Lftp Sessions


    The sftp command uses an SFTP-like interface to find and copy files over SSH protocols.
    Here''s an example of how to start an sftp session:


    ```

    $ sftp chris@server1

    chris@server1''s password: ******

    sftp->

    ```


    Use sftp in the same manner as use regular FTP clients. Type ? for a list of commands.
    You can change remote directories (cd), change local directories (lcd), change
    current remote and local directories (pwd and lpwd), and list remote and local
    contents (ls and ls). Depending on the permission of the user you logged in as,
    you may be able to create and remove directories (mkdir and rdir), and change
    permissions (chmod) and ownership/group (chown and chgrp) of files and directories.


    You can also use lftp (discussed in this chapter) as an sftp client. Using lftp
    adds some user-friendly features such as path completion using the Tab key:


    ```

    $ lftp sftp@chris@server1

    Password: ********

    lftp chris@server1:->

    ```


    # Using Windows File Transfer


    In many cases, people need to get files from Linux servers using Windows clients.
    If your client operating system is Windows, you can use one of the open source
    tools to get files from Linux servers:


    +   WinSCP (http://winscp.net) — Graphical scp, sftp, and FTP client for Windows
    over SSH1 and SSH2 protocols.


    +   FileZilla (http://filezilla.sourceforge.net) — Provides graphical client FTP
    and SFTP services in Windows, as well as offering FTP server features.'
