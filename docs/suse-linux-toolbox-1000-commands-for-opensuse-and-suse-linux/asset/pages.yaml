  md: '# Chapter 3: Using the Shell


    # Watching Commands


    If you need to keep an eye on a command whose output is changing, use the `watch`
    command. For example, to keep an eye on your load average:


    ```

    $ watch /proc/loadavg

    ```


    Every two seconds, `watch` runs the `cat` command again. Use Ctrl+c to quit. To
    change the refresh rate to 10 seconds, type the following:


    ```

    $ watch -n 10 ''ls -1''

    ```


    To highlight the difference between screen updates, type:


    ```

    $ watch -d ''ls -1''

    ```


    Type Ctrl+c to exit the `watch` command.


    # Watching Files


    You can use the `watch` command to watch the size of a file. For example, to watch
    a large file named `myddownload.iso` as it downloads, use the following command:


    ```

    $ watch ''ls -l mydownload.iso''

    ```


    To watch the contents of a plain file grow over time, you can use the `tail` command.
    For example, you can watch as messages are added to the `/var/log/messages` file
    as follows:


    ```

    $ tail -f /var/log/messages

    ```


    Pressing Ctrl+c will exit the `tail` command. You must have superuser permissions
    to access the messages file.


    # Acquiring Superuser Power


    When you open a shell, you are able to run commands and access files and directories
    based on your user/group ID and the permissions for those components. Many system
    features are restricted to the `root` user, also referred to as the `superuser`.


    # Using the su Command


    With a shell open as a regular user, you can use the `su` (superuser) command
    to become the root user. However, simply using `su`, as in the following code,
    doesn''t give you a login shell with root''s environment:


    ```

    $ su

    Password:****

    ```'
