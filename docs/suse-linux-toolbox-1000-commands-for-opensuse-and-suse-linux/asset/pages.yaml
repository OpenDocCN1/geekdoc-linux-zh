  md: '# Chapter 4: Working with Files


    # Using Directories


    A directory is a container for files and subdirectories. Directories are set up
    in a hierarchy from the root (/) to multiple subdirectories, each separated by
    a slash (/). Directories are called folders when you access them from graphical
    file managers.


    To create directories for storing your data, you can use the mkdir command. Here
    are examples of using mkdir to create directories in different ways:


    ```

    $ mkdir /tmp/new      Create "new" directory in /tmp

    $ mkdir -p /tmp/a/b/c Create parent directories as needed for "new"

    $ mkdir -m 700 /tmp/new2 Create new2 with drwx------ permissions

    ```


    The first command adds the new directory to the existing /tmp directory. The second
    example creates directories as needed (subdirectories a, b, and c) to create the
    resulting new directory. The last command adds the -m option to set directory
    permissions as well.


    You can identify the file as a directory because the first character in the 10-character
    permission string for it is a d:


    ```

    $ file /tmp/new

    /tmp/new: directory

    $ ls -ld /tmp/new

    drwxr-xr-x 2 chris 4096 2020-09-29 11:42 /tmp/new

    ```


    Another thing to notice about directories is that the execute bit (x) must be,
    if you want people to be able to use the directory as their current directories.


    # Using Symbolic and Hard Links


    Instead of copying files and directories to different parts of the file system,
    links can be set up to access that same file from multiple locations. Linux supports
    both soft links (usually called symbolic links) and hard links.


    When you try to create a symbolic link which points to a file or change to one
    that points to a directory, the command you run acts on the file or directory
    that is the target of that link. The target has its own set of permissions and
    ownership that you cannot see from the symbolic link. The symbolic link can exist
    on a different partition than the target. In fact, the symbolic link can exist,
    even if the target doesn''t.


    A hard link, by contrast, can only be used on files (not directories) and is basically
    a way of giving multiple names to the same physical file. Every file has at least
    one hard link, which is commonly thought of as the file itself. Any additional
    names (hard links) point to that single physical file must be on the same partition
    as the original target file (in fact, one way to tell that files are hard links
    is that they all have


    61'
