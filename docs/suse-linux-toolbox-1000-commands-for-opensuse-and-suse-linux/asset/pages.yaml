    # Removing a Package with rpm


    To remove an installed package, use the -e option as follows:


    ```

    # rpm -e flash-player

    ```


    Sometimes, you will find that rpm will not remove a package due to failed dependencies.
    This is one of the downsides of rpm — it does not resolve these dependencies.


    ```

    # rpm -e gzip

    Failed dependencies:

    gzip is needed by (installed) perl-5.8.8-75.i586

    gzip is needed by (installed) mkinitrd-2.1-36.i586

    ```


    The command failed because of dependency issues. The best way to resolve dependency
    issues is to use zypper or gast to work through the dependencies automatically.
    However, you may reach a point where you have to force the install or removal
    of a package.


    > WARNING! Forcing the install or removal of a package is DANGEROUS and may result
    in an unstable system. Make sure you know precisely what you''re doing.


    In this example, you specify that you want to remove the i586 version of the zoo
    package and ignore dependencies:


    ```

    # rpm -e --nodops zoo-2.10-938.i586

    ```


    # Querying Information about RPM Packages


    The following example shows how to query installed packages for the zoo package
    and display version information about that package:


    ```

    # rpm -q zoo

    zoo-2.10-938

    ```


    Use the -qp option to get information about an RPM file in the present directory:


    ```

    # rpm -qp zoo-2.10-938.i586.rpm

    zoo-2.10-938

    ```


    To see a list of all the packages installed on your system, type the following:


    ```

    # rpm -qa | less

    OpenOffice_org-templates-labels-letter-1.0-2

    ```'
