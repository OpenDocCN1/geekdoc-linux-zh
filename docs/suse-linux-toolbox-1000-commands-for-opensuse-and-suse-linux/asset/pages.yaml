    # Graphical Text Editors


    Just because you are editing text doesn''t you have to use a text-based editor.
    The main advantages of using a graphical text editor is that you can use a mouse
    to select menus, highlight text, cut and copy text, or run plugin-ins.


    You can expect to have the GNOME text editor (gedit) if your Linux system has
    the GNOME desktop installed. Features in edit like checking spelling, document
    statistics, change display fonts and colors, and print your documents. The KDE
    desktop also has its own KDE text editor (kate). It includes similar features
    to the GNOME text editor, with many extras, such as the ability to send the current
    document with kmail or another user-configurable KDE component.


    Vim itself comes with an XUI version. It is launched with the gvim command, which
    is part of the vim package. You also need to it. If you''d like to turn GUI Vim
    into a more user-friendly text editor, you can download a third-party configuration
    called Cream from http://cream.sourceforge.net/.


    Other text editors you can install include nedir (for using macros and executing
    shell commands) and leappad (which is similar to the Windows Notepad editor).
    The Scribes text editor (scribes) includes some advanced features for automatic
    correction, replacement, indentation, and word completion.


