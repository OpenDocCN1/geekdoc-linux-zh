    # Unmounting File Systems with umount


    To unmount a file system, use the umount command. You can unmount the file system
    using the device name or the mount point. You''re better off unmounting with the
    mount point, to avoid the confusion when bind mounts (one device, multiple mount
    points). Here is an example of each, with verbosity on:


    ```

    # umount -v /dev/sda

    /dev/sda unmounted

    # umount -v /mnt/mymount/

    /tmp/diskboot.img unmounted

    ```


    Unmount by device name

    Unmount by mount point


    If the device is busy, the unmount will fail. A common reason for an unmount to
    fail is that you have a open file with the current directory of a directory inside
    the mount:


    ```

    # umount -v /mnt/mymount/

    umount: /mnt/mymount: device is busy

    umount: /mnt/mymount: device is busy

    ```


    Sometimes, it''s not obvious what makes the device busy. You can use lsof to list
    open files, then search for the mount point that interests you:


    ```

    # lsof | grep myount

    bash 9341 francois cwd DIR 8,1 1024 /mnt/mymount

    ```


    Find open files on myount partition


    You can see that a bash process run by francois with a PID of 9341 is preventing
    the myount partition from being unmounted.


    Another option when a file system is busy to perform a lazy unmount


    ```

    # umount -vl /mnt/mymount/

    Perform a lazy unmount

    ```


    A lazy unmounts the file system from the tree now, but waits for the device to
    no longer be busy before cleaning everything. Unmounts of removable media can
    also be done with eject. This unmounts a CD and ejects the CD from the drive:


    ```

    # eject /dev/cdrom

    Unmount and eject a CD

    ```


