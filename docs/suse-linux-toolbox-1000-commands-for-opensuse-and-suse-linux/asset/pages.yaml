  pgno: 171
- img_proc: true
  md: '# Chapter 8: Backups and Removable Media


    If you are archiving and compressing large amounts of data, the time it takes
    to compress your backups can be significant. So you should be aware that, in general,
    bzip2 may take about 10 times longer than lzip and only give you the compression.
    However, with each compression command, you can choose different compression levels,
    to balance the need for more compression with the time that takes.


    To use the tar with bzip2 compression, use the -j option:


    ```

    $ tar cvf myfile.tar.bz2 *.txt Create archive, compress with bzip2

    ```


    You can also uncompress (-j) a bzip2 compressed file as extract files (-x) using
    the tar command:


    ```

    $ tar xvf myfile.tar.bz2 Extract files, uncompress bzip2 compression

    ```


    The lzip compression is a less integrated into tar. Before you can use lzip, you
    need to install the lzip program. You can download a statically linked pre-built
    version of the program, as well as the program sources, from www.lzip.org. The
    packman repository, covered in Chapter 3, includes a package of lzip for SUSE
    10.0. By the final release of SUSE 10.3, you should also be able to download a
    SU package for lzip. Once installed, to use lzip compression, you must use the
    --use-compress-program option:


    ```

    $ tar --use-compress-program=lzip -cf myfile.tar.lzo *.txt

    $ tar --use-compress-program=lzip -xf myfile.tar.lzo

    ```


    In the previous examples, the command line reverses the old syntax of tar with
    a switch before the command. For normal use and in other examples, we used the
    modern syntax of tar with no switch.


    > NOTE You may encounter .rar compressed files in the RAR format. This format
    seems to be popular in the world of peer-to-peer networks. RAR is a proprietary
    format so there is no widespread compression tool. The packman repository has
    a rar RPM package for some versions of SUSE.


    # Compressing with gzip


    As noted, you can use any of the compression commands alone (as opposed to the
    tar command line). Here are some examples of the gzip command to create and work
    with gzip-compressed files:


    ```

    $ gzip myfile gzips myfile and renames it myfile.gz

    ```


    The following command provides the same result, with verbose output:


    ```

    $ gzip -v myfile gzips myfile with verbose output

    myfile: 86.0% -- replaced with myfile.gz

    $ gzip -tv myfile.gz Tests integrity of gzip file

    myfile.gz: OK

    ```'
