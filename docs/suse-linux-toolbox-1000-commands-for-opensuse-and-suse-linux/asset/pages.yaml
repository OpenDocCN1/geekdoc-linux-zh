    # Other Useful Network Tools


    If you''d like to see header information about packets as they are sent and received
    by your system, use tcpdump. The tcpdump command has a lot of advanced features,
    most of which revolve around filtering and finding a needle in a haystack of packets.
    If you run tcpdump on a remote machine, your screen will be flooded with all the
    ssh traffic between your client and the remote machine. To get started without
    learning too much about tcpdump filtering works, run the following:


    ```

    # tcpdump | grep -v ssh    Find packets except those associated with ssh

    ```


    If you''d like to dip into packet-level traffic, use wireshark (formerly known
    as ethereal). Make sure you have the wireshark package installed. You can run
    wireshark with O X server on a remote machine. Wireshark is a very powerful packet
    sniffer that rivals the best commercial tools.


    To explore networks and remote machines and see what services they offer, use
    nmap. The nmap command is the most common port scanner. It was even featured in
    the The Matrix Reloaded! Make sure that you are authorized to scan the systems
    or networks you are scanning. The nmap command is part of the nmap package and
    can be run as a user, but several scan types require root privileges.


    213'
