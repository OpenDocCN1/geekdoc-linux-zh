    # Traversing the File System


    Basic commands for changing directories (cd), checking the current directory (pwd)
    and listing directory contents (ls) are well known to even casual shells. This
    section focuses on some less-common options to those commands, as well as other
    lesser-known features for moving around the file system. Here are some quick examples
    of cd for moving around the file system:


    ```

    $ cd Change to your home directory

    $ cd $HOME Change to your home directory

    $ cd - Change to your home directory

    $ cd -francois Change to francois'' home directory

    $ cd $OLDPWD Change to previous working directory

    $ cd $OLD Change to previous working directory

    $ cd -public/html Change to usr/bin from root directory

    $ cd .. Change to parent of current directory

    $ cd /usr/bin Change to usr/bin beneath current directory

    ```


    If you want to find out your current directory is, use pwd (print working directory):


    ```

    $ pwd

    /home/francois

    ```


    Creating symbolic links is a way to access a file from other parts of the file
    system (see the section "Using Symbolic and Hard Links" earlier in the chapter
    for more information). However, symbolic links can cause some confusion about
    how parent directories are viewed. The following commands create a symbolic link
    to the /tmp directory from your home directory and show how to tell where you
    are related to a linked directory:


    ```

    $ cd $HOME

    $ ln -s /tmp tmp-link

    $ ls -l tmp-link

    lrwxrwxr-x 1 users 2007-09-29 12:41 tmp-link -> /tmp

    $ pwd

    /home/francois/tmp-link

    $ pwd -P

    /home/francois

    $ pwd -L

    /home/francois/tmp-link

    $ cd -L ....

    ```


    67'
