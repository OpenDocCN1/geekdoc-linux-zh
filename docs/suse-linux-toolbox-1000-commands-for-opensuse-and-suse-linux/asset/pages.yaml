    # Converting Images in Batches


    Most of the image conversions described in this chapter can be done quite easily
    using a graphical image manipulation tool such the GIMP. However, where the convert
    commands we describe really shine when you use them in scripts. So, instead of
    resizing, rotating, writing on, or colorizing a single file, you can do any (or
    all) of those things to a whole directory of files.


    You may want to create thumbnails for your duck collection or perhaps to reduce
    all your wedding photos so they can play well on a digital photo frame. You might
    even want to add copyright information to every image in a digital directory before
    you share them on the Web. All these things can be done quite easily with the
    convert commands already described and some simple shell scripts.


    Here''s an example of a script you can run to resize an entire directory of photos
    to 1024 × 768 pixels to play on a digital photo frame:


    ```

    $ cd $HOME/myimages

    $ mkdir small

    $ for pic in ''ls *.png''

    do

    echo "converting $pic"

    convert -resize 1024x768 $pic small-sm-$pic

    done

    ```


    Before running this script, this procedure changes to the $HOME/myimages directory
    (which happens to contain a set of high-resolution images). Then it creates a
    subdirect to hold the reduced images called small. The script starts lists each
    file in .png in the current directory (you might need to make that .jpg or other
    image suffix). Then, each file is resized to 1024 × 768 and copied to the small
    directory, with sm- added to each file.


    Using basic script, you can use any of the convert commands shown earlier, or
    make your own to suit your needs. You might be able to convert a whole directory
    of images in a few minutes that would have taken you hours clicking in the GUI.


    # Summary


    The shell can provide a quick and efficient venue for working with your audio
    and digital images. This chapter describes ways of playing, ripping, encoding,
    converting, and streaming audio files from the command line. As for digital images,
    we may provide many examples of using the convert command for resizing, rotating,
    writing on, and otherwise manipulating these images.


    109'
