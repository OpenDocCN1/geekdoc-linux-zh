  md: '# Chapter 10: Managing the System


    With commands such as ps top, you can see how much memory each application is
    consuming on your system. The kernel itself, however, has its own memory to keep
    track of its resources, called the kernel slab. You can use the vmstat command
    to display kernel slab memory statistics (from /proc/slabinfo) as follows:


    ```

    $ vmstat -m | less Page through kernel slab memory cache

    Cache Num Size Pages

    f_nat:help 2 13 308 13

    f_nat:base 0 0 276 14

    bridge_fdb_cache 0 0 64 59


    extext3_inode_cache 1236 2928 488 8

    extext3_kattr 29 156 48 78

    ```


    The slab memory cache shows each cache name, the number of objects active for
    that cache type, the total number of objects available for that cache type, the
    size of the cache (in bytes), and the number of pages for each. You can display
    kernel memory information in a screen-oriented view (similar to the top command)
    using slabtop:


    ```

    $ slabtop

    Active / Total Objects (% used) : 49127 / 70942 (69.2%)

    Active / Total Slabs (% used) : 3094 / 3094 (100.0%)

    Active / Total Cache (% used) : 101 / 145 (69.7%)

    Active / Total Size (% used) : 8830.29K / 12013.73K (73.5%)

    Minimum / Average / Maximum Object : 0.01K / 0.17K / 128.00

    ```


    | OBJECT USE OBJ SIZE SLABS OBJ/SLAB CACHE NAME |

    | 11600 4303 37% 0.13K 400 29 16000 dentry_cache |

    | 2928 1246 42% 0.48K 366 8 13400 radix_tree_node |

    | 4355 2535 58% 0.28K 335 13 | |

    | 219 219 100% 0.04K 219 1 876K slab-4096 |


    slabtop updates every three seconds. By default, slab caches are sorted by the
    number of objects (first column) in each cache. By pressing c you can sort by
    cache size indent (as shown in the previous example).


    # Monitoring CPU Usage


    An overburdened CPU is another obvious place to look for performance problems
    on your system. The vmstat command, shown earlier, can produce basic statistics
    relating to CPU usage (user activity, system activity, idle time, i/O wait time,
    and time stolen from a virtual machine). The iostat command (from the sys package),
    however, can generate more detailed reports of CPU utilization.


