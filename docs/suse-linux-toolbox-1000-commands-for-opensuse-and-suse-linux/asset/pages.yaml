  md: '# Chapter 3: Using the Shell


    Just as you can direct standard output from a command, you can also direct standard
    input to a command. For example, the following command e-mails the /etc/hosts
    file to the user named chris on the local system:


    $ mail chris < /etc/hosts


    Using pipes, you can redirect output from one process to another process rather
    than just files. Here is an example where the output of the ls command is piped
    to the sort command to have the output sorted:


    ```

    $ ls /tmp | sort

    ```


    In the next example, a pipe and redirection are combined (the stdout of the ls
    command is sorted and stderr is dumped to the bucket):


    ```

    $ ls /tmp/ /tmp 2> /dev/null | sort

    ```


    Pipes can be used for things:


    ```

    $ rpm -qa | grep -i sql | wc -l

    $ ps auww | grep firefox

    $ ps auww | less

    $ whereis -m rpm | awk ''print $2''

    ```


    The first command in the preceding code lists all installed packages, grabs those
    packages that have sql in them (regardless of case), and does a count of how many
    lines are left (effectively counting packages with sql in the name). The second
    command line displays Firefox processes taken from the long process list (assuming
    the Firefox web browser is running). The third command line lets you page through
    the process list. rpm: the path to the rpm man page, and then displays the word
    rpm followed by the path to the man page (the second element on the line).


    Using backticks, you can execute one section of a command line and feed the output
    of that command to the rest of the command line. Here are examples:


    ```

    $ rpm -qf which ps

    $ ls -1 which zypper

    ```


    The first command line in the preceding example finds the full path of the ps
    command and finds the package that contains ps command. The second command line
    finds the full path to zypper command and does a long list (ls -1) of that command.


