  md: '# Chapter 9: Checking and Managing Running Processes


    There are several ways to change the behavior of top as it''s running. Press d
    and type a number representing seconds to change the delay between refreshes.
    Press u and enter a user name to only display processes for the selected user.
    To view only a select of processes, type n and the number you want to see. Press
    = at any point to return to the original top.


    You can act on any of the running processes in different ways. To signal (kill)
    a running process, type k followed by the PID of the process you want to send
    to the signal. Then type 9 to end it or a different signal to send to the signal.
    To give a process higher or lower priority, type n and then add a negative number
    (to increase priority) or a positive number (to reduce priority).


    If you want to find more information about how to use top, type ? during a top
    session. The main page also has a lot of information about how to use top:


    ```

    $ man top

    ```


    View the top man page


    When you are using top, type q to exit.


    # Finding and Controlling Processes


    Changing a running process first means finding the process you want to change,
    modifying the processing priority or sending the signal to change its behavior.
    If you are looking for a particular process, you might find it tough to locate
    it in a large list of processes output by ps or top. The pgrep command offers
    ways of searching through your active processes for the ones you are looking for.
    The rename command lets you change the processing priority of running processes.
    The kill, killall commands let you send signals to running processes (including
    signals to end those processes).


    # Using pgrep to Find Processes


    In its most basic form, you use pgrep to search for a command name (or part of
    one) and produce the process ID of any process that includes that. For example:


    ```

    $ pgrep init

    1

    3906

    3907

    ```


    Show PID for any process including ''init'' string


    Because we know there is only one init command running, we next use the -l option
    to see each process''s command name (to learn why two processes showed up):


    ```

    $ pgrep -l init

    1 init

    3906 start_kdedeinit

    3907 kdeinit

    ```


    Show PID and name for any process including ''init'' string


    163'
