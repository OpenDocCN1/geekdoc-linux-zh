  md: '# Chapter 11: Managing Network Connections


    If you are not able to configure your wireless LAN card using the Network Card
    panel, you may be able to get your wireless card working using drivers and tools
    available from Atheros (www.atheros.com), the MadWiFi (www.madwfi.org) project,
    or the Ndiswrapper project (ndiswhisper.sourceforge.net).


    If you need determining exactly which wireless card you have, try the following:


    ```

    # lspci | grep -i wireless Search for wireless PCI cards

    01:09.0 Network controller: Broadcom Corporation BCM4306 802.11b/g

    Wireless LAN Controller (rev 03)

    ```


    Assuming that your wireless card is up and running, there are some useful commands
    in the wireless-tools package you can use to view and change settings for your
    wireless cards. In particular, the ifconfig command can help you work with your
    wireless LAN interfaces. The following scans your network interfaces for supported
    wireless cards and lists their current settings:


    ```

    # ifconfig

    eth0 no wireless extensions.*

    eth1 IEEE 802.11-DS ESSID:"* Nickname:HERMES I"

    Mode:Managed Frequency:2.457 GHz Access Point:Not-Associated

    Bit Rate:11 Mb/s Tx-Power=15 dbm Sensitivity:1/3

    Retry limit:4 RTS thr:off Fragment:off

    Encryption key:off

    Power Management:off

    ```


    Wireless interfaces may be named wlanX or ethX, depending on the hardware and
    driver used. You may be able to obtain more information after setting the link
    up on the wireless interface:


    ```

    # ip link set eth up

    # ifconfig

    eth1 IEEE 802.11-DS ESSID:"* Nickname:HERMES I"

    Mode:Managed Frequency:2.457 GHz Access Point:None

    Bit Rate:11 Mb/s Tx-Power=15 dBm Sensitivity:1/3

    Retry limit:4 RTS thr:off Fragment:off

    Encryption key:off

    Power Management:off

    Link Quality:0/92 Signal level=134/153 Noise level=134/153

    Rx invalid nwid:0 Rx invalid crypto:0 Rx invalid frag:0

    Tx excessive retries:0 Invalid misc:0 Missed beacon:0

    ```


    The settings can be modified in a few ways. Here are some ways to use ifconfig
    to modify your wireless interface settings. In the following examples, we operate
    on a wireless interface named wlan0. These operations may or not be supported,
    depending on which wireless card and driver you are using:


    ```

    # ifconfig wlan0 essid "MyWireless" Set ssid to MyWireless

    # ifconfig wlan0 channel 3 Set the channel to 3

    # ifconfig wlan0 mode Ad-Hoc Change from Managed to Ad-Hoc mode

