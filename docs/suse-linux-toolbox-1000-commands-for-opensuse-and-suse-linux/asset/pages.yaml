    # Sharing Remote Directories with SSHFS


    Another magical trick you can do over the SSH protocol is mount remote file systems.
    Using the SSH file system (sshfs), part of the sshfs package, you can mount any
    directory from SSH server that your user account can access from your local Linux
    system. sshfs provides encryption of the mount operation as well as all of the
    data transferred. Another cool aspect of sshfs is that it requires no setup on
    the server side (other than having service running).


    Here is a quick procedure for mounting a directory of documents from a remote
    server to a local directory. Doing only requires that the remote server is running
    SSH, is accessible, and that the directory you want is accessible to your user
    account on the server. Here we are mounting a named directory /var/docs from the
    host at 10.0.0.50 to a mount point called /mnt/docs on the local system:


    ```

    $ mkdir /mnt/docs

    $ sshfs chris@10.0.0.50:/var/docs /mnt/docs

    Create mount point

    Mount remote directory

    ```


    When you are done using the remote directory, you can unmount it with the fusermount
    command:


    ```

    $ fusermount -u /mnt/docs

    Unmount remote directory

    ```


