    |---|---|---|---|

    | 1 | Yes | No | yast2 | openSUSE-10.3-... | openSUSE-10.3-... |

    | 2 | Yes | Yes | rpm-md | madwifi |

    | 3 | No | Yes | rpm-md | ftp.gwdg.de | ftp.gwdg.de

    ```


    Likewise, the following command turns off Refresh of the ftp.gwdg.de repository:


    ```

