    # Transferring Files with FTP Commands


    SUSE comes with the standard FTP client (ftp command) that works the same way

    en on most Unix and Windows systems. We recommend using the full-featured,

    user-friendly lftp interface, part of the lftp package. (The lftp command replaces

    cftp, an older command).


    With these FTP clients, you open a session to the FTP server in order to just
    grab-

    ing a file, as you do with wget and curl). Then you navigate the server as much
    as you

    would a local file system, getting and putting documents across the network con-

    er of how to connect to an FTP server with lftp:


    ```

    $ ftp mirrors.kernel.org               Anonymous connection

    lftp mirrors.kernel.org->

    $ ftp francois@example.com             Authenticated connection

    lftp example.com->

    $ ftp -u francois example.com             Authenticated connection

    Password: ******

    lftp example.com->

    $ ftp -u francois,mypwd example.com Authentication with password

    $ ftp                               Start lftp with no connection

    lftp -> open mirrors.kernel.org       Start connection in lftp session

    lftp mirrors.kernel.org->

    ```


    > WARNING! The fourth example should be avoided in real life. Passwords that are

    entered in a command line end stored in clear text in your ~/.bash_history.

    They may be visible to other users in the output of ps auxw.


    Once a connection is established to an FTP server, you can use a set of commands

    during the session. FTP commands are similar to shell commands. Just like in

    b bash, you can press Tab to autocomplete file names. In a session, lftp also\supports
    sending multiple jobs to the background (Ctrl+z) and returning them to

    foreground (wait or fg). These are useful if you want to continue traversing the

    FTP site while files are downloading or uploading. Background jobs run in parallel.

    Type jobs to see a list of running background jobs. Help to see a list of lftp

    commands.'
