    \ You can also see the data length, playback time, and average bitrate.\n\nThe\
    \ flac command (from the flac package) is an encoder for oggenc, except that the\
    \ WAV, AIFF, RAW, FLAC or Ogg file is encoded to a FLAC file. Besides flac is\
