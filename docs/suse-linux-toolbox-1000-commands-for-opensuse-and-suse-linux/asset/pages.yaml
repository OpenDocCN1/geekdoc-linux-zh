  md: '# Chapter 7: Administering File Systems


    The basic business of using LVM is to create the volume groups and logical volumes
    you need, assign the extents (small chunks of disk) to those areas where they
    are needed. Unlike disk partitioning schemes, where you might have to back up
    your data, change your partitioning, return data to the resized partitions, or
    simply add unused extents where they are needed.


    LVM comes with a set of commands (in the lvm package) that can be used to work
    with LVM volumes. Step through the procedure in the following section to learn
    about many of those LVM commands.


