    # Streaming Music


    If you are on one machine, but you are working from another machine, setting up
    a streaming music server is a quick way to broadcast your music so it can be picked
    up from one or more computers on your network. To do this, install the icecast
    streaming media server and icecast audio source client.


    ```

    # yum install icecast ices

    ```


    Here''s a quick and dirty procedure for setting up icecast and ices to stream
    your music. Perform this on the computer that can handle the music you want to
    serve:


    +   1. Edit the /etc/icecast.xml file to change all passwords listed. Search for
    hackers to find the current passwords. You probably need user and administrative
    passwords, especially if you allow others to stream music to the server. Remember
    the passwords you set for later. You may want to change other settings in this
    file, such as hostname.

    2. If you have a firewall, check that TCP port 8000 is accessible.

    3. Start the icecast server as root user by typing the following (the server will
    actually run as the icecast user):


    ```

    # service icecast start

    ```


    +   4. Add a new user account ices, and then use the  user account to create your
    playlist. As root user, type the following:

    # useradd -m ices

    # passwd ices'
