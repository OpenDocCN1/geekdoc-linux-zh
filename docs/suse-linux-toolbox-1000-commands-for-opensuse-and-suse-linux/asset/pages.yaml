    ```


    If you had an MD5sum file to check against, you could use the md5sum command in
    the same way. By combining the find command earlier in this chapter with the md5sum
    command, here''s how to create an MD5 checksum for every file in the /etc directory
    so you can verify any part of your file system. They can be checked later to see
    if they have changed:


    ```

    $ find /etc -type f -exec md5sum {} \ 2>/dev/null > /tmp/md5.list


    # cd /etc

    # md5sum -c /tmp/md5.list | grep -v ''OK''

    ./hosts.allow: FAILED

    md5sum: WARNING: 1 of 1668 computed checksums did NOT match

