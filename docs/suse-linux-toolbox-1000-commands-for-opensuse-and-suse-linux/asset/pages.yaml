    # Backing Up to Removable Media


    The capacity of CDs and DVDs, and the low costs of those media, have made them
    attractive options as computer backup media. Using tools that commonly with Linux
    systems, you can gather files to back up CD or DVD images and burn those images
    to the appropriate media.


    Command line tools as mkisof (for creating CD images) and cdrecord (for burning
    images to CD or DVD) once provided the most popular interfaces for making backups
    to CD or DVD. There now many graphical-ends to those tools you could also consider.
    For example, GUI tools for mastering and burning CDs/DVDs include K3b (the KDE
    CD and DVD Kreator) and Nautilus (GNOME’s file manager that offers a CD-burning
    feature). Other GUI tools for burning CDs include gcombust, X-CD-Road, and graveman.


