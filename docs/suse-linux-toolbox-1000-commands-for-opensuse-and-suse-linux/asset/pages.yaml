  md: '# Chapter 3: Using the Shell


    A more advanced and powerful way to take the output of one command and pass it
    as parameters using the xargs command. For example:


    ```

    $ ls /usr/bin/rpm* | xargs rpm -qf

    ```


    To display the command xargs is going to run, use the following:


    ```

    $ ls /usr/bin/rpm* | xargs -t rpm -qf

    rpm -qf /usr/bin/rpm2cpio /usr/bin/rpmbuild /usr/bin/rpmdb /usr/bin/rpme

    /usr/bin/rpmgraph /usr/bin/rpmi /usr/bin/rpmlocate /usr/bin/rpmpack

    /usr/bin/rpmquery /usr/bin/rpmsign /usr/bin/rpmu /usr/bin/rpmverify

    rpm-4.4.2-140

    rpm-4.4.2-140

    rpm-4.4.2-140

    rpm-4.4.2-140

    rpm-4.4.2-140

    rpm-4.4.2-140

    aaa_base-10.3-90

    rpm-4.4.2-140

    rpm-4.4.2-140

    rpm-4.4.2-140

    rpm-4.4.2-140

    ```


    In this example, the entire output of ls is passed to a single rpm -qf command.
    Using the -t option a verbose output of the command line appears before the command
    is executed. Now let''s have xargs pass each output from ls as input to individual
    rpm commands. We define {} as the placeholder for the string:


