  md: '# About the Authors


    **Christopher Negus** is the author of the best-selling Fedora and Red Hat Linux
    Bibles, Linux Toys, Linux Troubleshooting Bible, and Linux Bible 2007 Edition.
    He is a member of the Madison Linux Users Group. Prior to becoming a full-time
    writer, Chris served for eight years on development teams for the Unix operating
    system at AT&T, where Unix was created and developed. He also worked with Novell
    on Unix development and Caldera Linux.


    **François Caen**, through his company Turbosphere LLC, hosts and manages business
    application infrastructures, with 95 percent running on Linux systems. As an open
    source advocate, he has lectured on OSS network management and Internet services,
    and served as president of the Tacoma Linux User Group. François is a Red Hat
    Certified Engineer (RHCE). In his spare time, François enjoys managing enterprise
    Cisco networks.'
