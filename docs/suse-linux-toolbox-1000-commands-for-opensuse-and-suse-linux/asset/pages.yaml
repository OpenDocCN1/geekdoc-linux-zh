    # # Using alias


    Use the alias command to set and list aliases. Some aliases are already set in
    your system/etc/bashrc or /etc/profile.d/* files or the user''s ~/.bashrc. Here''s
    how to list the aliases that are currently set:


    ```

    $ alias

    alias +==''pushd .''

    alias -==''popd''

    alias ..=''cd ..''

    alias ...=''cd ../''

    alias beep=''echo -en \007*''

    alias cd..=''cd ..''

    alias dirs=''ls -1''

    alias l=''ls -aF''

    alias la=''ls -la''

    alias ll=''ls -1''

    alias ls=''ls $LS_OPTIONS''

    alias ls-l=''ls -1''

    alias md=''mkdir -p''

    alias o=''less''

    alias rd=''rmdir''

    alias rehash=''hash "Error: Try the command; ummount 1>&2" false''

    alias you=''umount -c /sbin/ystab2 online_update*''

    ```


    Notice that aliases are set simply as a way of adding options to the default behavior
    (such as ls=''ls $LS_OPTIONS''), which adds any file listing options from an environment
    variable into the default bash session. You can define your own aliases as follows:


    ```

    $ alias la=''ls -la''

    ```


    Add that line to your ~/.bashrc file for the definition to occur for each new
    bash session. Remove an alias from the current bash session using the unalias
    command, as follows:


    ```

    $ unalias             Unalias the previously aliased command

    $ unalias -a           Unalias all aliased commands

    ```'
