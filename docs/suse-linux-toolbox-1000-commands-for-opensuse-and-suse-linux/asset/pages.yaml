  md: '# Chapter 5: Manipulating Text


    We prefer to use the awk command when columns are separated by a varying of spaces,
    such as the output of the ps command. And we prefer the cut command when dealing
    with files delimited by commas (,) or colons (;), such as the /etc/password file.


    # Converting Text Files to Different Formats


    Text files in the Unix world use a end-of-line character (\n) than those used
    in the DOS/Windows world(\r\n). You can view these special characters in a text
    file with the os command:


    ```

    $ od -c -t x1 myfile.txt

    ```


    So they will appear properly when copied from one environment to the other, it
    is necessary to convert the files. Here are some examples:


    +   * unix2dos = myfile.txt > mydosfile.txt

    * cat mydosfile.txt | dos2unix > unixfile.txt


    The unix2dos example just shown converts a Linux or Unix plain text file (unixfile.txt)
    to a DOS or Windows text file (mydfile.txt). The dos2unix example demonstrates
    the possibility of converting a DOS/Windows file to a Linux/Unix file. You need
    to install the unix2dos package to get these commands.


    # Summary


    Linux and Unix systems traditionally use plain text files for system configuration,
    documentation, output from commands, and many forms of stored information. As
    a result, many commands have been created to search, edit, and otherwise manipulate
    plain text files. Even with today''s GUI interfaces, the ability to manipulate
    plain text files is critical to becoming a power Linux user.


    This chapter explores some of the most popular commands for working with plain
    text files in Linux. Those commands include text editors (such as vi, nano, and
    joe), as well as commands that can edit streaming data (such as sed and awk commands).
    There are also commands for sorting text (sort), counting text (wc), and translating
    characters in text (tr).'
