  md: '# 6


    # Playing with Multimedia


    There''s no need to go to a GUI tool, if all you need to play a song or convert
    an image or audio file to a different form. There are commands for working with
    multimedia files (audio or images) that are quick and efficient if you find yourself
    working from batches of multimedia files, the same command you use to transform
    one file can be added to a script to repeat the process on many files.


    This chapter focuses on tools for working with audio and digital image files from
    the shell.


    # Working with Audio


    There are commands available for Linux systems that can manipulate files in dozens
    of audio formats. Commands such as `ogg123`, `mpg321`, and `play` can be used
    to listen to audio files. There are commands for ripping songs from music CDs
    and encoding them to store efficiently. There are even commands to let you stream
    audio so any your network to listen to your playlist.


    +   IN THIS CHAPTER

    Playing music with play, ogg123, and mpg321

    Adjusting audio with alsamixer and aumix

    Ripping music CDs with cdparanola

    Encoding music with ogg, frac, and lame

    Streaming music with icecast and ices

    Converting audio files with sox

    Transforming digital images with convert


    # Playing Music


    Depending on the audio format you want to play, there are several command line
    players available for Linux. The `play` command (based on the `sox` facility,
    described later), can play audio files in multiple, freely available formats.
    Using `ogg123` to play popular open source music formats, including Ogg Vorbis,
    Freeless Audio Codec (FLAC), and Speex files. The `mpg321` player, which is available
    via third-party RPM repositories, is popular for playing MP3 music files.'
