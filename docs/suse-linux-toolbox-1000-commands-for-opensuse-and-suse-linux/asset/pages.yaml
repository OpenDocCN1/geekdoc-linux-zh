    \ in one-half the size, as opposed to tenth size with oggenc. Here is an example\
    \ of the flac command:\n\n```\n$ flac now.wav                Encodes WAV to FLAC\
    \ (now.flac)\n$ sock now.wav.aiff                   Encodes WAV to AIFF (now.aiff)\n\
