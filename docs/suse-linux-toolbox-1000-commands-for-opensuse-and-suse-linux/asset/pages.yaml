    Although you can use the init command to change any run level, including init
    0 (shut down) as halt and init 6 (reboot), there are also specific commands for
    stopping Linux. The advantages of commands such halt, reboot, poweroff, and shutdown
    are that they include you to stop some features before shutdown occurs. For example:


    > WARNING! Don''t try to run the commands if you don''t intend to actually turn
    off your system, especially on a remote system.


    +   * reboot      The computer

    * halt -h      Don''t run sync to hard drives before shutdown

    * halt -h      Put hard drives in standby mode before halting

    * shutdown 10  Shutdown in ten minutes after warning the users

    * shutdown -r 10  Reboot in ten minutes after warning the users

    * shutdown 10 Bye''! Send custom message to users before shutdown


    Besides the reboot and init 6 commands, you can also use the old PC keystroke
    Ctrl+Alt+Del to reboot your computer. If you''d like to disable that feature,
    for an example on a public-access PC, simply comment out the following line from
    /etc/initittab:


    ```

