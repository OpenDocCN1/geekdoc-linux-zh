  md: '# Encoding Music


    After a music file is ripped from CD, encoding that file to save disk space is
    usually the next step. Popular encoders include oggenc, flac, and lame, for encoding
    to Ogg Vorbis, FLAC, and MP3 formats, respectively.


    With oggenc, you can start with audio files or streams in WAV, AIFF, FLAC, or
    raw format and convert them to Ogg Vorbis format. Although Ogg Vorbis is lossy,
    the decoding of WAV files provides very good quality audio and can result in a
    file that''s about one-tenth the size. Here are some examples of oggenc:


    ```

    $ oggenc ab.wav Encodes WAV to Ogg (ab.ogg)

    $ oggenc ab.flac -o new.ogg Encodes FLAC to Ogg (new.ogg)

    $ oggenc ab.wav -q 9 Raises encoding quality to 9

    ```


    By default, the quality of the ogg output is set to 3. You can set the quality
    to any number from 1 to 10 (including factors such as 5.5).


    ```

    $ oggenc NewSong.wav -o MySong.ogg \\

    -a Bernstein -G Classical \\

    -d 06/15/1972 -t "Simple Song" \\

    -1 "Bernsteins Mass" \\

    -c info="Kennedy Center" \

    ```


    The command just shown converts MySong.wav to MySong.ogg. The artist name is Bernstein
    and the music type is Classical. The date is June 15, 1972, the song title is
    Simple Song and the album name is Bernstein Mass. It is a comment from Kennedy
    Center. The backslashes aren''t needed if you just keep typing the command on
    one line. However, if you add backslashes, make sure there are no spaces after
    the backslash.


    The preceding example adds information to the header of the resulting Ogg file.
    You can see the header information, with other information about the file, using
    ogginfo:


    ```

    $ ogginfo NewSong.ogg

    Processing file "NewSong.ogg"

    ```


    ```

    Channels: 2

    Rate: 44100

    Nominal bitrate: 112.00000 kb/s

    User comments follows...\...\info=From Kennedy Center

    title=Simple Song

    artist=Bernstein

    genre=classical

    date=06/15/1972

    album=Bernsteins Mass

    ```


    ```

    Vorbis stream 1:

    Total data length: 3039484 bytes

    Playback length: 3m:25.240s

    Average bitrate: 118.475307 kb/s

    Logical stream 1 ended

    ```'
