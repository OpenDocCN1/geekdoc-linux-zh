    # Using Text-Based E-mail Clients


    Mail User Agents (MUAs) are GUI-based these days. So if you began using e-mail
    in the past decade or so, you probably think of Evolution, Kmail, Thunderbird,
    or (on Windows systems) Outlook when it comes to e-mail clients. On the first
    Unix and Linux systems, however, e-mail was handled by text-based applications.


    If you find yourself needing to check e-mail on a remote server or venerable text-based
    mail clients are available and still quite useful. In some, hard-core geeks still
    use text-based mail clients exclusively, touting their efficiency and scoffing
    at HTML-based messages.


    The mail clients described in this chapter expect your messages to be stored in
    MBOX format on the local system. That means that you are either logged into the
    mail server or you have already downloaded the messages locally (for example,
    by POP3 or similar).


    > NOTE Text-based mail clients can be used to read mail already downloaded by
    other clients. For example, you could open your Evolution mail Inbox by typing
    `mail -f $HOME/.evolution/mail/loc/Inbox`.


    # Managing E-mail with mail


    The oldest command, and easiest to use when you just want a quick check for messages
    in the root user''s mailbox on a remote server, is the command `/bin/mail`. While
    mail can be used interactively, it is often used for sending script-based e-mails.
    Here are some examples:


    ```

    $ mail -s ''MY SUSE version'' chris@example.com < /etc/SUSE-release

    ps auxw | mail - ''My Process List'' chris@example.com

    ```


    The two examples just shown provide quick ways to mail some text without having
    to open a GUI application. The first example sends the contents of /etc/SUSE-release
    file to the user chris@example.com. The subject (-s) is set to ''My SUSE Version''.
    In the second example, a list of running processes (ps auxw) is sent to the user
    with a subject of ''My Process List''.


    > NOTE You will likely need to configuremail, postfix, or some other application
    to actually send e-mail to its destination. Otherwise, chris@example.com will
    never know all the processes running on your system.'
