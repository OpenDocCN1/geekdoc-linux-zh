    # Searching for Software with zypper


    The zypper utility has a very feature-rich search utility built in that allows
    you to quickly

    and efficiently search through all, or certain, repositories for packages. Having
    the search

    ut right at your fingertips allows making software maintenance very easy. Table
    2-6

    shows some of the most useful search commands for zypper.


    Table 2-6: Useful zypper Search Commands


    | Command | Abbreviation | Description |

    |---|---|---|

    | search | se | Use with a search pattern to narrow the search query or without
    to see all available packages. Use -t to specify a resolvable to limit searching
    to. |

    | patches | pch | Search for and display all patches. |

    | patch-info | | Include the patch name in the command to display full information
    about that patch. |


    Continued


