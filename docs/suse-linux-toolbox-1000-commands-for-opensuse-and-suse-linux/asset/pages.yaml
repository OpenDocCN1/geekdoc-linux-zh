  md: '# Chapter 10: Managing the System


    The hardware clock is part of the motherboard''s CMOS and runs on a battery attached
    to the motherboard when the system is powered off. You set the hardware clock
    with the hwclock.


    There are many other tools that can be used to work with time in Linux systems.
    For example, there are tools for checking time in different ways, such as using
    clockdiff (to measure clock difference between computers) and uptime (to see how
    long your system has been up).


    # Changing Time/Date with Graphical Tools


    Graphical tools in SUSE, openSUSE, and other Linux systems for changing the date,
    time, and time zone on your system include the Date & Time Properties pane from
    the Configure desktop choice in the SUSE menu. From the Administrator in mode,
    you can enable the Network Time Protocol (NTP), to automatically synchronize your
    Linux system''s date and a selected time server over the network.


    The Date/Time Properties pane modifies the /etc/sysconfig/clock file. During SUSE
    startup, the /etc/sysconfig/clock file is read to set your time zone and your
    system is using UTC time.


    Your Linux system''s time zone is based on the contents of the /etc/localtime
    file. You can set a new time zone by copying the file representing your time zone
    from a subdirectory of /usr/share/zoneinfo. For example, to change the current
    time to that of America/Chicago, you could do the following:


    ```

    # cp /usr/share/zoneinfo/America/Chicago /etc/localtime

    ```


    This can also be accomplished by creating a symlink:


    ```

    # ln -s /usr/share/zoneinfo/America/Chicago /etc/localtime

    ```


    To change time permanently, set the TIMEZONE value in /etc/sysconfig/clock to
    the time zone you want. For example, TIMEZONE="US/Central"


    # Displaying and Setting Your System Clock


    The date command is the primary command-based interface for viewing and changing
    date and time settings, if you are not having that date automatically with NTP.
    Here are examples of date commands for displaying dates and time in different
    ways:


    ```

    $ date                              Display current date, time and time zone

    Sun Aug 12 01:26:50 CDT 2007         Display day, month, day of month, year

    $ date ''+%B %d %G''                   Sunday August 12 2007

    $ date ''+The date today is %F.'' Add words to the date output

    The date today is 2007-07-12

    ```'
