  md: '# Chapter 10: Managing the System


    A matter of pride among Linux enthusiasts is how long they can keep their Linux
    systems without having to reboot. Linux systems have been known to run for years
    without having to reboot. The time that a Linux system has been running since
    the previous reboot is referred to as uptime. You can check your system''s uptime
    as follows:


    ```

    $ uptime check how long your system has been running

    6:53pm up 196 days, 14:25, 3 users, load average: 1.66, 0.88, 0.35

    ```


    The output of uptime shows the current time, how many days and hours the system
    has been up, and how many users are currently logged in. After that, uptime shows
    the system load over the last 1-, 5-, and 15-minute time periods.


    # Managing the Boot Process


    When a computer starts up, the basic input/output system (BIOS) looks to its boot
    order settings to determine where to find the operating system. Typically, if
    a bootable media has not inserted into a removable drive (CD, DVD, floppy disk,
    and so on), the BIOS looks to the master boot record (MBR) on the first bootable
    hard disk. At this point, for most Linux systems, the boot process is handed to
    the boot loader.


    For SUSE, in fact, most Linux systems these days, the Grand Unified Boot Loader
    (GRUB) is the boot loader that is used by default. GRUB is a replacement for LILO,
    which was the most popular Linux boot loader during the 1990s. GRUB can be set
    up to boot not only your Linux system, but also to boot any other systems installed
    on your hard disks (Windows, BSD, or others). GRUB can also include boot options
    with each operating system to refine the boot process, such as turn on or off
    support for a particular type of hardware.


    Once a Linux system is selected to boot from the boot loader, the boot loader
    loads the kernel on the hard drive. The following dilemma occurs: the kernel needs
    to appropriate drivers (block device modules), a small initial ramdisk (initrd)
    containing the block device modules is mounted by the boot loader. This allows
    the Linux kernel to read the root file system. After that, the init process takes
    over and begins starting the system services, based on the run level that is set
    for the system.


    The following sections describe commands for modifying the boot loader, startup
    scripts, and run levels associated with your Linux system.


    # Using the GRUB Boot Loader


    Assuming GRUB was set up when you installed SUSE, the settings for your boot loader
    are stored in the /etc/grub.conf file. Any changes you make to that file are'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Chapter 10: Managing the System


    picked up automatically when you reboot SUSE. In addition, major settings reside
    in the file /boot/grub/menu.lst. Here''s an example of the contents of the /boot/grub/menu.lst
    file:


    ```

    default=0

    timeout=8

    gfxmenu=(hd0,0)/message


    title openSUSE 10.3

    root (hd0,0)

    kernel=vmlinuz-2.6.22.5-29-default root=/dev/disk/by-id/scsi

    SATA_ST332620AS_9QF4AKJA-part2 vga=0x31a resume=/dev/sda3 splash=silent

    showopts

    inititrd=initrd-2.6.22.5-29-default

    ```


    This example shows only one operating system (openSUSE 10.3). The default=0 line
    says that the first entry is booted by default. The timeout=8 line says that GRUB
    passes eight seconds at the splash screen before


    The actual boot entry (title openSUSE 10.3) points to the first partition on the
    hard disk (hd0,0), which contains the kernel and init RAM disk (initrd) to be
    booted. To change how kernel boots, you can add options to the end of the kernel
    line. Or you can add new entry to boot different kernels or operating systems.


    Some available boot options are described in Table 2-1 in Chapter 2. Options you
    might want to add to the end of the kernel line 3 (to boot runlevel3, text mode)
    or ide=nodma (to turn off DMA if your system is having hard errors)


    In normal circumstances, you don''t need to run any commands to changes to menu.lst
    picked up by your boot loader. However, if the MBR becomes corrupted for some
    reason and your system won''t boot, you may need to reload the GRUB boot loader.


    To reinstall GRUB on your hard disk''s MBR, boot a SUSE live CD or install rescue
    mode and follow the instructions to change root (chroot) to the hard partition
    containing your SUSE system. Assuming that you''re booting from your computer''s
    first SATA hard disk, type the following to reload the boot loader over the MBR:


    ```

    # grub-install /dev/sda

    ```


    The boot loader should now be installed on your hard disk''s MBR. If your grub.conf
    and menu.lst files are corrupted, your system should be able to reboot from hard
    disk now.


