  md: '# Chapter 9: Checking and Managing Running Processes


    The last part of cronab entry is the command that is run. The first five fields
    represent the time and date the command is run. The fields from left to right
    are: minute (0 to 59), hour (0 to 23), day of the month (0 to 31), month (0 to
    12 or Jan, Feb, Mar, Apr, May, Jun, Jul, Sep, Oct, Nov, Dec), and day of the week
    (0 to 7 or Sun, Mon, Tue, Wed, Thu, Fri, Sat). An asterisk (*) in a field means
    any value for that.


    Here are other options with the cronab:


    ```

    $ cron -eu chris      Edit another user''s cronab (root only)

    $ cron -l               List contents of your cronab file

    15 8 * * Mon, Tue, Wed, Thu Fri mail < /var/project/stats.txt

    * * 1,4,7,10 * find | grep .doc > /var/sales/documents.txt

    $ cron -r               Delete your cronab file

    ```


    The traditional way to configure system cron jobs is to add them to the system
    cronab. Although this is not alone, OSE provides an easier way to create hourly,
    daily, weekly, and monthly cron jobs, by associating the command you want to run
    with a cron directory. Simply create a script that you want to run. Then copy
    the script to /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly or /etc/monthly
    directory. The command will then run in the time frame indicated by the directory
    (hourly, daily, or monthly).


    An alternative to the cron facility is the anacron facility. With anacron, you
    can configure commands to run periodically. However, anachron is appropriate for
    machines that are not on all the time. If a command is not run because the computer
    was off during the scheduled time, the next time the computer is on, the anacron
    facility makes sure the commands that were missed during the downtime are run
    after the system resumes.


    # Summary


    Watching and working with the processes that run on your Linux system is important
    activities to make sure that your system is operating efficiently. Using commands
    such as ps and top, you can view the processes running on your system. You can
    use pgrep to search for and list particular processes.


    With commands such as nice and renice, you can adjust the recommended priorities
    at selected processes run. When a process is running, you can change how it is
    running or kill the process by sending a signal to the kill or killall command.


    After launching a command from the current shell, you can set that command''s
    process to run in the background (bg) or foreground (fg). You can also stop and
    restart the process using different control codes.


    To schedule a command to run at a later time, you can use the at or batch command.
    To set up a cron to run repeatedly at set intervals, you can use the cron or anacron
    facilities.


    171'
