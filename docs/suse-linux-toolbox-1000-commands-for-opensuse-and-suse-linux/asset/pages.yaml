  md: '# 4


    # # Working with Files


    Everything in a Linux file system can be viewed as a file. This includes data
    files, directories, devices, named pipes, links, and other types of files. Associated
    with each file is a set of information that determines who can access the file
    and how they can access it. This chapter covers many commands for exploring and
    working with files.


    | IN THIS CHAPTER |

    | Setting permissions |

    | Traversing the file system |

    | Creating and copying files |

    | Using hard and symbolic links |

    | Changing file attributes |

    | Searching for files |

    | Listing and verifying files |


    # # Understanding File Types


    Directories and regular files are by far the types you will use most often. However,
    there are several other types of files you will encounter you use Linux. From
    the command line, there are many ways you can create, find, and list types of
    files.


    Files that provide access to the hardware components on your computer are referred
    to device files. There are character and block devices. There are hard and soft
    links you can use to make the same file accessible from different locations. Less
    often used by regular users are named pipes and sockets, which provide access
    points for processes to communicate with each other.


    # # Using Regular Files


    Regular files consist of data files (documents, music, images, archives, and so
    on) and commands (binaries and scripts). You can determine the type of a file
    using the file command. In the following example, you can change the directory
    containing bash shell documentation and use the file command to view some type
    of files in that directory:


    ```

    $ cd /usr/share/doc/packages/groff/

    $ file *

    ```


    +   - BUG-REPORT: ASCII English text

    ChangeLog: ISO-8859 English text

    ChangeLog.jp: ISO-8859 C program text'
