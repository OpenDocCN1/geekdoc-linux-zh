  md: "# Chapter 9: Checking and Managing Running Processes\n\nThe default nice value\
    \ is 0. You can use the nice command to run a process at a higher or lower priority.\
    \ The default priority can range from -20 (most favorable-scheduling priority)\
    \ to 19 (least favorable scheduling priority). Although the root user can raise\
    \ or lower any nice value, a regular user can only lower the priorities of a process\
    \ (setting a higher value).\n\n> > WARNING! Proceed with caution when assigning\
    \ negative nice values to to processes. This can possibly crash your machine if\
    \ critical system processes lose their high priority.\n\nHere are few examples\
    \ of starting a command with nice to change a command's value:\n\n```\n$ -n 12\
    \ roff -man a.roff | less    Format pages at low priority\n# nice -n 10 gimp \
    \                    Launch gimp at higher priority\n```\n\nWhen a process is\
    \ already running, you can change the process's nice value using the rename command.\
    \ Here are some examples of the rename command:\n\n```\n$ renice +2 -u francois\
    \               Renice francois' +2\n$ renice +5 4737                        \
    \  Renice PID 4737 by +5\n# renice -3 -pgrep -u chris spam       Renice chris'\
    \ spam processes -3\n9688: old already running, new priority -3\n20279: old priority\
    \ -1, new priority -3\n20282: old priority -1, new priority -3\n```\n\nThe backticks\
    \ are used in the previous command line to indicate that the output of the pgrep\
    \ (presumably PIDs of spam daemons runs by chris) is fed to the rename command.\n\
    \nThe niceness settings for your processes are displayed by default when you run\
    \ top. You can also see niceness settings using -o nice when you produce custom\
    \ output from the ps command.\n\n# Running Processes in the Background and Foreground\n\
    \nWhen you run a process from a shell, it is in the foreground by default. That\
    \ means you can't type another command until the first one is done. By adding\
    \ an ampersand (&) to the end of a command, you can run that command line in the\
    \ background. Using the fg, bg, and jobs commands, along with various control\
    \ codes, you can move processes between background and foreground.\n\nIn the following\
    \ sequence of commands, we start the GIMP image program from a Terminal window.\
    \ After that is a series of control keys and commands to stop and start the process\
    \ and move it between foreground and background:\n\n```\n$ gimp              \
    \               Run gimp in the foreground\n<Ctrl+z>                         \
    \  Stop process and place in background\n[1]+ Stopped                        \n\
    $ bg 1                            Start process running again in background\n\
    ```\n\n166"
