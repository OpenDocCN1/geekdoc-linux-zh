  md: '# Chapter 2: Installing openSUSE and Adding Software


    The result of this command is an RPM file that is output to a directory that is
    specific to your computer architecture: /usr/src/packages/RPMS/noarch/, where
    arch is replaced by a name indicating the computer architecture (such as i386,
    i586, and so on). The resulting RPM file is ready to be installed.


    # Extracting Files from RPMs


    An RPM is basically an archive of files you want to install to your computer and
    some header information (descriptions, checksums, build information, and so on).
    You can remove the archive from an RPM package and output the archive to a cpio
    archive file.


    The cpio format is similar to the tar format, described in Chapter 8, and can
    be similarly used for backing up and transporting files. Here''s an example using
    the rpmcpio command to extract the cpio archive from an RPM:


    ```

    # rpmcpio BashBurn-2.1.1-0.pm.1.src.rpm > BashBurn-2.1.1-0.pm.1.src.cpio

    ```


    In this example, the archive contained within the BashBurn RPM package is extracted
    to a cpio archive via BashBurn-2.1.1-0.pm.1.src.cpio. Instead of sending the output
    of the rpmcpio command to a cpio archive file, you can pipe it through the cpio
    -tv command to view a list of contents of that:


    ```

    # rpmcpio BashBurn-2.1.1-0.pm.1.src.rpm | cpio -tv

    -rw-rw-- root 103937 Aug 31 15:51 BashBurn-2.1.1.tar.gz

    -rw-rw-r root 3128 Aug 31 15:51 BashBurn.spec

    ```


    The results of the preceding command can also be produced by the rpm command.
    For example, rpm -qlvp BashBurn-2.1.1-0.pm.1.src.rpm produces the identical output
    of the rpmcpio command line shown.


    To extract a single file from an RPM file, you can use rpmcpio with a cpio -idv
    command that indicates the file you want. In the following command, the BashBurn.spec
    file is extracted to the current directory.


    ```

    # rpmcpio BashBurn-2.1.1-0.pm.1.src.rpm | cpio -idv BashBurn.spec

    ```


    If you try this example above, the package you may have different version numbers.


    # Summary


    Software for openSUSE and other SUSE-distributions is packaged in RPM format.
    YaST installer is used to initially install openSUSE, SLED, and SLES. Using boot
    options, you can choose different types and adapt to different environments. To
    install additional software, you can use the YaST and zypper utilities to get
    packages from online repositories. To install packages locally, or query verify
    installed packages, you can use the RPM tools.'
