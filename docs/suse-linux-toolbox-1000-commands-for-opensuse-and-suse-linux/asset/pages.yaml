  md: '# Chapter 4: Working with Files


    To follow along with examples in this section, create a directory called /tmp/test
    and a file /tmp/test/hello.txt. Then do a long listing of those two items, as
    follows:


    ```

    $ mkdir /tmp/test

    $ echo "some text" > /tmp/test/hello.txt

    $ ls -ld /tmp/test /tmp/test/hello.txt

    drwxr-xr-x 2 francois 4096 2007-09-29 13:11 /tmp/test

    -rw-r--r-- 2 francois 10 2007-09-29 13:11 /tmp/test/hello.txt

    ```


    After creating the directory and file, the first character of the long lists /tmp/test
    as a directory (d) and hello.txt as a file (-). Other types of files available
    in Linux include character devices (c), block devices (b) or symbolic links (l),
    named pipes (p), sockets (s).


    The next characters represent the permissions on the file and the directory. The
    first rwx indicates that the owner (francois) has read, write, and execute permissions
    on the directory. The group sales (r-); the dash indicates the missing write permission.
    For the hello.txt file, the user has read and write permissions (rw-) and members
    of the group others have read permission (r--).


    When you out to change permissions, each permission can be represented by an octal
    number (where read is 4, write is 2, and execute is 1) or a letter (rwx). Generally
    speaking, read permissions you see you the contents of the directory, write lets
    you change (add or modify) the contents of the directory, and execute lets you
    to change (in other words, access) the directory.


    If you don''t like the permissions you see on files or directories you own, you
    can change those permissions using the chmod command.


    # Changing Permissions with chmod


    The chmod command lets you change the access permissions of files and directories.
    Table 4-1 shows several chmod command lines and how to access the directory or
    file changes.


    # Table 4-1: Changing Directory and File Access Permissions


    | chmod command (octal or letters) | Original Permission | New Permission | Description
    |

    |---|---|---|---|

    | chmod 0700 | any | drwx------ | The directory''s owner can read or write files
    in that directory as well as change to it. All other users (except root) have
    no access. |'
