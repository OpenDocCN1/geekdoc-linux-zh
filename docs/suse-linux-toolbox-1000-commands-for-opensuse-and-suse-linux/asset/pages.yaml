  md: "# Chapter 12: Accessing Network Resources\n\n+   - PSCP (www.chiark.greenend.org.uk/~sgtatham/putty/)\
    \ — Command line scp client is part of the PuTTY suite.\n\n+   - PSFTP (www.chiark.greenend.org.uk/~sgtatham/putty/)\
    \ — Command line sftp client is part of the PuTTY suite.\n\n# Sharing Remote Directories\n\
    \nTools described to this point in the chapter provide atomic file access, where\
    \ a connection is set up and files are transferred in one shot. When where more\
    \ persistent, ongoing access to a remote directory of files is needed, services\
    \ for sharing and mounting remote file systems can be most useful. Such services\
    \ include Network File System (NFS), Samba, and SSHFS.\n\n# Sharing Remote Directories\
    \ with NFS\n\nAssuming a server is already running the NFS service (typing service\
    \ nfs start as root starts in SUSE), you can use exportfs and showmount commands\
    \ to see available and mounted shared directories. Mounting a shared directory\
    \ is done with special options to the mount command. \n\nSUSE installs an NFS\
    \ client package by default, not a server. You can choose the nfs-server package\
    \ for a server that runs in user space, or nfs-kernel-server for a kernel-based\
    \ server. To get the exportfs command, install the nfs-kernel-server package.\
    \ You need to install one of these packages to set up an NFS server:\n\n# Viewing\
    \ and Exporting NFS Shares\n\nRun from the NFS server, this exportfs command shows\
    \ all shared directories available\n\n```\n# /usr/bin/exportfs -av\n/export/myshare\
    \ client.example.com(rw,wdelay,root_squash,no_subtree_check)\n/mnt/public <rw,wdelay,root_squash,no_subtree_check>\n\
    ```\n\nThe two directories being shared are /export/myshare and /mnt/public. The\
    \ first is only available to host client.example.com, whereas the second is available\
    \ to everyone. Options for each share are in parenthesis. The first share is available\
    \ read-only (ro), writes to the share are delayed to improve performance when\
    \ more writes are expected (wdelay), and requests from the root user on the client\
    \ are mapped into the anonymous UID (root_squash). Also, a less thorough check\
    \ of file system permission is done (no_subtree_check). The second share allows\
    \ read-write mounting (rw).\n\n223"
