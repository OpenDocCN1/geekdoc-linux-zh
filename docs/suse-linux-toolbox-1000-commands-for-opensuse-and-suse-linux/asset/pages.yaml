    /dev/zero is a special file that generates null characters. In the example shown,
    the dd command takes /dev/zero as input file and outputs to /tmp/mynullfile. The
    count is the number of blocks. By default, a block is 512 bytes. The result is
    a 512-byte file full of null characters. However, a better tool to view the file
    could use less or vi to view the contents of the file. However, od (Octal Dump)
    command:


