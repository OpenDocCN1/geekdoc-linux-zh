  md: '# Chapter 5: Manipulating Text


    knowing how to at least minor file edits in vi is a critical skill for any Linux
    administrator. One day, if you find yourself in a minimalist, foreign Linux environment
    trying to bring a server back online, vi is the tool that will always be there.


    On SUSE, make sure you have the vim-enhanced package installed. (Vi IMproved)
    with the vim-enhanced package provides the most up-to-date, feature-rich and user-friendly
    vi editor. By default, SUSE installs the regular vim packages. For more details
    about using vi, refer to Appendix A.


    Traditionally, the other popular Unix text editor is Emacs and its more graphical
    variant, XEmacs. Emacs is a powerful multi-function tool that can also act as
    a mail/news reader, and perform other functions. Emacs is also known for its very
    complex series of keyboard shortcuts that require three arms to execute.


    In the mid-90s, Emacs was ahead of all features. Now that Vi is widely available,
    both can provide all the text editing features you''ll ever need. If you are not
    already familiar with either vi or Emacs, we recommend you start by learning vi.


    There are many other command-line and GUI text editors available for Linux. Text-based
    editors that you may find simpler than vi and Emacs include JOE, JED, and nano.
    Start any of those editors by typing their command name, optionally followed by
    the file you want to edit. The following sections offer some description of how
    to use each of those editors.


    # Using the JOE Editor


    If you have used classic word processors such as StarWord that worked with text
    files, you may be comfortable with the JOE editor (from the JOE package, installed
    by default). To use the spell checker in JOE, install the aspell package. With
    JOE, instead of entering a command or text mode, you are always ready to type.
    Move around the file using the arrow keys. To open a text file for editing, you
    can type joe and the file name or use one of the following:


    ```

    $ joe memo.txt               Open memo.txt for editing

    $ joe -wordwrap memo.txt      Turn on wordwrap while editing

    $ joe -largin 5 -tab 5 memo.txt  Set left margin to 5 and tab to 5

    $ joe +5 memo.txt             Begin editing on line 25

    ```


    To add text, just begin typing. You can use keyboard shortcuts for functions.
    Move the cursor left, right, up, or down. Use the Delete key to delete text under
    the cursor or the Backspace to erase text to the left of the cursor. Press Enter
    to add a line break. Press Ctrl+h to see the help screen. Table 5-2 shows the
    most commonly used.'
