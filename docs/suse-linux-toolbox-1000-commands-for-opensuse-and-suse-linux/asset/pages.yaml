  md: '# Introduction


    Starting with Chapter 7, we get into topics relating to system administration.
    Creating and checking file systems are covered in Chapter 7, while commands for
    doing data backups are described in Chapter 8. Chapter 9 describes how to manipulate
    running processes and Chapter 10 describes administrative tools for managing basic
    components, such as hardware modules, CPU use, and memory use.


    Chapter 11 begins the chapters devoted to managing network resources by describing
    how to set up and work with wired, wireless, and dial-up network interfaces. Chapter
    12 covers text-based commands for web browsing, file sharing, file charts, and
    e-mail. Tools for doing remote system administration are included in Chapter 13.


    The last chapter (Chapter 14) tells how to lock down security using features such
    as firewalls and logging. After there are three appendices that provide reference
    for text editing, shell features (metacharacters and variables), and system settings
    (from `/proc file system).


