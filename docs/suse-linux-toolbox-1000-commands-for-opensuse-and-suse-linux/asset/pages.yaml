  md: '# Chapter 7: Administering File Systems


    Here is a simple mount command to mount the /dev/sdal device on an existing directory

    /mnt/mymmount:


    ```

    # mount /dev/sdal /mnt/mymmount/  Mount a local file system

    # mount -v /dev/sdal /mnt/mymmount/  Mount file system, more verbose

    mount: you didn''t specify a filesystem type for /dev/sdal

    I will try ext3

    /dev/sdal on /mnt/mymmount type ext3 (rw)

    ```


    In the examples above, the mount command will either look for an entry for /dev/sdal

    in the /etc/fstab file or try to guess the type of file system.


    Use -t to explicitly indicate the type of file system to:


    ```

    # mount -v t ext3 /dev/sdal /mnt/mymmount/  Mount an ext3 file system

    /dev/sdal on /mnt/mymmount type ext3 (rw)

    ```


    You can also display the label/name of the partition that is mounted:


    ```

    # mount -vl - t ext3 /dev/sdal /mnt/mymmount/  Mount file system/show label

    ```


    If you''re mounting something that is listed in your fstab file already, you only
    need to specify one item: mount point or device. For example, with the following
    fstab entry:


    | /dev/sdal /mnt/mymmount ext3 defaults 1 2 |


    you can do either of the following to mount the file system:


    ```

    # mount -v /dev/sdal  Mount file system with device name only

    /dev/sdal on /mnt/mymmount type ext3 (rw)

    # mount -v /mnt/mymmount/  Mount file system with mount point only

    /dev/sdal on /mnt/mymmount type ext3 (rw)

    ```


    You can specify mount options by adding -a and, comma-separated list of options.
    They are the same options you can add to field 4 of the /etc/fstab file. By default,
    partitions are mounted with read/write. You can explicitly indicate to mount a
    file system as read-write (rw) or read-only (ro):


    ```

    # mount -v ext3 -o rw /dev/sdal /mnt/mymmount/  Mount read/write

    /dev/sdal on /mnt/mymmount type ext3 (rw)

    # mount -v ext3 -o ro /dev/sdal /mnt/mymmount/  Mount read-only

    /dev/sdal on /mnt/mymmount type ext3 (ro)

    ```


    A few other mount options you can use:


    +   - noatime — Does not update the access time on files. Good on file systems
    with a lot of I/O, such as swap pools and logs.


    +   - noexec — Prevents execution of binaries located in /tmp in environments
    with untrusted users to increase security, for example for /tmp in environments
    with untrusted users.'
