    # Formatting a File System


    With your disks in place, you can build a file system of your choice on each partition.
    Most Linux systems come with the commands needed to make and check file systems
    that are commonly used in Linux. Commands for formatting and checking file systems
    are mkfs and fsck, respectively.


    The mkfs command serves as the front end for many different commands aimed at
    particular file types, such as mkfs.ext2, mkfs.ext3, mkfs.cram, mkfs.msdos, mkfs.ntfs,
    and mkfs.vfat. By adding packages that support other file systems, additional
    mkfs commands are available seamlessly with mkfs. These include mkfs.bfs, mkfs.minix,
    mkfs.xfs, and mkfs.xafs. Use each command directly (as in mkfs.vfat /dev/sd1)
    or via the mkfs command (as in mkfs -t vfat /dev/sd1).


    # Creating a File System on a Hard Partition


    Basic software packages you need in USE to do system creation and checking include
    util-linux (which includes mkfs and other general utilities) and e2fsgs (ext2/ext3-specific
    tools). Specific mkfs commands for different file system types are included in
    ntfs-3g (ntfs), dosfst (msdos and vfat), xfgs (xfs), jsutils (jfs), mtd-utils
    (jfs and jfs2) and reiserfs-utils (reiserfs).


    Here are examples of the mkfs command to create file systems (be sure to add the
    -t first):


    +   * mkfs -t ext3 /dev/sd1      Create ext3 file system on sbal

    * mkfs -t ext3 -v c /dev/sd1      More verbose and scan for bad blocks

    * mkfs.ext3 -c /dev/sd1         Same result as previous command


    If you would like to add a partition label to the new partition, use the -L option:


    ```

