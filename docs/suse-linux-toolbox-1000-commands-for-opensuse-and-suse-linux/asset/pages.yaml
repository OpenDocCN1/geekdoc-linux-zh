  md: '# Chapter 10: Managing the System


    If you didn’t configure NTP to set time for your system when you first installed
    your Linux system, you can do so later by turning on the ntpd service. For example:


    ```

    # service ntp start           Start NTP service immediately

    # chkconfig ntp on             Set NTP service to start at each reboot

    ```


    The ntp service uses information in the /etc/sysconfig/ntp file. For example,
    by default the time from the NTP server is not used to reset the hardware clock.
    To have the hardware clock updated, set NTPD_ADJUST_CMOS_CLOCK to use (NTPD_ADJUST_CMOS_CLOCK="yes")
    in the /etc/sysconfig/ntp file.


    Whether you install ntpd manually or let the installer do it automatically, the
    resulting setup turns your machine into a time server, listening on UDP port 123.
    Unless you have very specific needs (and your own GPS or atomic clock), running
    ntpd on your machine can be a waste of resources and a security risk. For example,
    some administrators prefer using ntdate (often in a daily cronjob) to set their
    system time via NTP:


    ```

    # ntpdate pool.ntp.org

    15 Aug 00:37:12 ntpdate[9706]:

    adj time server 66.92.68.11 offset 0.009204 sec

    ```


    If you running ntpdate while ntpd is running, you will get the following error:


    ```

    # ntpdate pool.ntp.org

    1 Oct 19:30:59 ntpdate[14179]: the ntpd socket is in use, exiting

    ```


    > NOTE The ntpd command has been marked as deprecated and will disappear in the
    future. It has been replaced by the following options of ntpd:

    # -q


    The -q option tells ntpd to exit after setting the clock (as opposed to keep running
    as a daemon). The -q option prevents ntpd from panicking if the system clock is
    off by more than 1000 seconds.


    # Trying Other Date/Time Commands


    There are few extraneous commands you can use to work with time settings on your
    system. The clockdiff command can be used to check the difference between the
    date/time on your system and that on another system. For example:


    ```

    # clockdiff pool.ntp.org Compare clocks on local/remote host

    ................

    host=pool.ntp.org rtt=63(0)ms/60ms delta=4ms/5ms

    Sun Aug 12 16:35:25 2007

    ```'
