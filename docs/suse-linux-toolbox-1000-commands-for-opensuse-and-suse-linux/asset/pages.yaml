    To save space, output is sometimes truncated (or sometimes skipped altogether).
    Three dots (...) are sometimes used to indicate that additional output was cut.
    If a command is particularly long, backslashes will appear at the end of each
    line to continue to the next. Here is an example:


    ```

    # oggenc NewSong.wav -o Newsong.org \\

    -a Bernstein -G Classical \

    -d 06/15/1972 -t "Simple Song" \

    -1 "Bernsteins Mass" \

    -c info=From Kennedy Center

    ```


    In the example just, you can literally type the backslashes to have all information
    included in the single line. Or, you can simply put all the information on a single
    line (excluding the backslashes). On SUSE systems, there are different command
    prompts for regular users and the root user. For example:


    ```

