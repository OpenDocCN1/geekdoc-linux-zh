  md: '# Chapter 4: Working with Files


    Having the sticky bit on a directory keeps users from removing or renaming files
    from that directory they don''t (/tmp is an example). Given the right permissions,
    however, users can change the contents of files they don''t own in a sticky bit
    directory. The final permission is t instead of x on a sticky directory. A command
    with sticky bit on used to cause the command to stay in memory, while not being
    used. This is an old Unix feature that is not supported in Linux.


    The -R option is a handy feature of the chmod command. With -R, you recursively
    change permissions of files and directories starting from a point in the file
    system. Here are some examples:


    ```

    # chmod -R 700 /tmp/test    Open permission only to owner below /tmp/test

    # chmod -R 000 /tmp/test    Close all permissions below /tmp/test

    # chmod -R +rwx /tmp/test    All permissions to all below /tmp/test

    ```


    Note that the -R option is inclusive of the directory you indicate. So the permissions
    above, for example, would change for the /tmp/test directory itself, and not just
    for the files and directories below that directory.


    # Setting the umask


    Permissions given to a file or directory are assigned originally at the time it
    is created. How those permissions are set is based on the user''s current umask
    value. Using the umask command, you can set the permissions to files and directories
    when you create them.


    ```

    $ umask 0066    Make directories drwx--x-- and files -rw-----

    $ umask 0077    Make directories drwx------ and files -rw-------

    $ umask 0022    Make directories drwxr-xr-x and files -rw-r--r-

    $ umask 0777    Make directories d-------- and files ----------

    ```


    The default for USERS is 0022.


    # Changing Ownership


    When you create a file or directory, your user account is assigned to that file
    or directory. So is your primary group. As root user, you can change the ownership
    (user) and group assigned to a file to a different user or group using chown and
    chgrp commands. Here are some examples:


    ```

    # ch chris test/          Change owner to chris

    # ch chris:market test/     Change owner to chris and group to market

    # chgrp market test/         Change group to market

    # chown -R chris test/       Change all files below test/ owner chris

    ```


    The recursive option to chown (-R) just shown is useful if you need to change
    the ownership of an entire directory structure. With chmod, using chown recursively
    changes permissions for the directory named, along with its contents. You might
    use this'
