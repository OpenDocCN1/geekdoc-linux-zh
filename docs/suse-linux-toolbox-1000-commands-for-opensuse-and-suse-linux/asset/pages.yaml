    The -R option also copies a directory structure, but assigns ownership to the
    current user and adds current date/time stamps.


    The dd command is another way to copy data is very powerful because on Linux systems,
    everything is a file, including hardware peripherals. Here is an example:


    ```

    $ dd if=/dev/zero of=/tmp/mynullfile count=1

