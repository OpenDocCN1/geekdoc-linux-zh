  md: '# Chapter 2: Installing openSUSE and Adding Software


    In the YaST section earlier, we added a repository from ftp.gwdg.de. We can demonstrate
    adding a Zypper repository using this same location. First we''ll remove the install
    location and then add, refresh, modify, and rename it.


    The following example tells zypper to show all the repositories it knows as well
    as all example output, fields too long to have been edited to fit the page width.


    ```

    # zypper lr

    | | Enabled | Type | Alias | Name |

    |---|---|---|---|---|

    | 1 | Yes | No | wast2 | openSUSE-10.3-... | openSUSE-10.3-... |

    | 2 | Yes | Yes | rpm-mdw | madwifi | madwifi |

    | 3 | Yes | Yes | rpm-mdw | Guru''s RPM site | Guru''s RPM site... |

    | 4 | Yes | Yes | wast2 | http://dnlowa... | Main Repository... |

