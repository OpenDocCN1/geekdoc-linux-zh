    Add a dash before a number from 1 to 9 to set the compression level. As illustrated
    above, -1 is the fastest (least) and -9 is the slowest (most). The default for
    gzip is level 6. The lzip command has fewer levels: 1, 3 (default), 7, 8, and
    9. Compression levels for bzip2 behave differently.


    To compare a zipped file, you can use the gzip command. Use one of the following
    examples:


    ```

    $ gzip -v myfile.gz Unzips myfile.gz and renames it myfile

    file.gz: 86.0% -- replaced with myfile

    $ gzip -dv myfile.gz Same as previous command line

    ```


    Although the examples just shown refer to zipping regular files, the same options
    can be used to compress tar archives.


    # Compressing with bzip2


    The bzip2 command is considered to provide the highest compression among the compression
    tools described in this chapter. Here are some examples of bzip2:


    ```

    $ bzip2 myfile Compresses file and renames it myfile.bz2

    $ bzip2 -v myfile Same as previous command, but more verbose

    myfile: 9,529:1, 0.840 bytes/byte, 89.51% saved, 334045 in, 35056 out.

    $ bzip2 myfile.bz2 Uncompresses file and renames to myfile

    $ bzip2 -dv myfile.bz2 Same as previous command

    $ bzip2 -v myfile.bz2 Same as previous command, but more verbose

    myfile.bz2: done

    ```


    # Compressing with lzip


    The lzip command behaves differently from gzip and bzip2. The lzip command is
    best in cases where compression speed is more important than the resulting compression
    ratio. When lzip compresses the contents of a file, it leaves the original file
    intact (unless you use -u), but creates a new file with a .lzo suffix. Use either
    of the following examples of the lzip command to compress a file named compressed
    file:


    ```

    $ lzip -v myfile Leave myfile, create compressed myfile.lzo

    compressing myfile into myfile.lzo

    $ lzip -U myfile Remove myfile, create compressed myfile.lzo

    ```'
