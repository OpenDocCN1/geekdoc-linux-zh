    # Transforming Images


    With directories full of digital images, the ability to manipulate images from
    the command line can be a huge saver. The ImageMagick package (available with
    SUSE) comes with some very useful tools for transforming your digital images into
    forms you can work with. This section shows some commands for manipulating digital
    images, and provides examples of simple scripts for making those changes in batches.


    # Getting Information about Images


    To get information about an image, use the identify command, as follows:


    ```

    $ identify p2090142.jpg p2090142.jpg JPEG 2048x1536+0+0 DirectClass 8-bit 402.037kb

    $ identify -verbose p2090142.jpg | less\Standard deviation deviation:61.1665 (0.239869)

    Colors: 205713

    Rendering intent: Undefined

    Resolution: 72x72

    Units: PixelsPerInch

    Filesize: 402.037kb

    Interlace: None

    Background color: white

    Border color: rgb(223,223,223)

    Matte color: grey74

    Transparent color: black

    Page geometry: 2048x1536+0+0

    Compression: JPEG

    Quality: 44

    ```


    The first command in the preceding example displays basic information about the
    image (its name, format, geometry, class, channel depth, and file size). The second
    command shows every bit of information it can extract from the image. In addition
    to the information you see in the example, the verbose output also shows creation
    times, the type of camera used, aperture value, and ISO speed rating.


