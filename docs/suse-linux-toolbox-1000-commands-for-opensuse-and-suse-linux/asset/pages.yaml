  md: '# Chapter 8: Backups and Removable Media


    # Deleting Files from tar Archives


    If you have a tar archive file on your hard disk, you can delete files from that
    archive. Note that you can''t use this technique to delete files from tar output
    on magnetic tape. Here is an example of deleting files from a tar archive:


    ```

    $ tar --delete filel.txt -f myfile.tar Delete filel.txt from myfile.tar

    ```


    # Backing Up Over Networks


    After you have backed up your files and gathered them into a tar archive, what
    do you do with archive? The primary reason for having a backup is in some happens
    (such as a hard disk crash) where you need to restore files from that backup.
    Methods you can employ to keep your backups safe include:


    +   - Copying backups to removable media such as tape, CD, or DVD (as described
    in this chapter)

    - Copying them to another machine over a network


    Fast and reliable networks, inexpensive high-capacity hard disks, and the security
    that comes with moving your data off-site make backups a popular practice. For
    an individual backing up personal data or a small office, combining a few commands
    may be all you need to create efficient and secure backups. This approach represents
    a direct application of the Unix philosophy: joining together simple programs
    to do one thing to get a more complex job done.


    Although just any command that copy files over a network can be used to move your
    backup data to a remote machine, some utilities are es good for the job. Using
    OpenSSH tools such as ssh and scp, you can set up secure passwordlesstransfer
    of backup archives and encrypted transmissions of those archives.


    Tools like the rsync command can save resources by backing up only files (or parts
    of files) that have changed since the previous backup. With tools such as unison,
    you can back up files over a network from Windows, as well as Linux systems.


    The following sections describe some of these techniques for backing up your data
    to other machines over a network.


    > NOTE A similar tool that might interest you is the rsnapshot command (yum install
    rsnapshot). The rsnapshot command (www.rsnapshot.org/) can work with rsync to
    make configurable hourly, daily, weekly, or monthly snapshots of a file system.
    It uses hard links to keep a snapshot of a file system, which it can sync with
    changed files.


    # Backing Up tar Archives Over ssh


    OpenSSH (www.openssh.org/) provides tools to securely do remote login, remote
    execution, and remote file copy over network interfaces. By setting up two machines'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Chapter 8: Backups and Removable Media


    to share encryption keys, you can transfer files between those machines without
    ever for each transmission. That fact lets you create scripts to back up your
    data from an SSH client to an SSH server, without any manual intervention.


    From a central Linux system, you can gather backups from multiple client machines
    using SSH commands (installed by default on SUSE). The following example runs
    the tar command on a remote site (to archive and compress files), pipes the tar
    stream to standard output, and uses the ssh command to catch the backup locally
    (over ssh) with tar:


    ```

    $ mkdir mybackup ; cd mybackup

    $ ssh francois@server1 ''tar cf - myfile*'' | tar xvf -

    francois@server1''s password: *****

    ```


    In the example shown, all files beginning with myfile are copied from the home
    directory of francois and placed in the current directory. Note that the left
    side of the pipe connects the archive and the right side expands the files from
    the current directory. (Keep in mind that ssh will overwrite local files if they
    exist, which is why we created an empty directory in the example.)


    To reverse the process and copy files from the local system to the remote system,
    we run a local tar command first. This time, we add a cd command to put the files
    in our choice of directory on the remote:


    ```

    $ tar cf myfile* | ssh francois@server1 \

    ''cd /home/francois/folder; tar xvf -''

    francois@server1''s password: *****

    ```


    In this next example, we''re not going to untar the files on the receiving end,
    but instead write the results to tgz files:


    ```

    $ ssh francois@server1 ''tar cz myfile*'' | cat > myfiles.tgz

    $ tar cvzf - myfile* | ssh francois@server1 ''cat > myfiles.tgz''

    ```


    The first example takes all files beginning with myfile from the francois''s home
    directory on server, tars and compresses those files, and transfers them to the
    myfiles.tgz on the local system. The second example does the reverse by taking
    all files beginning with myfile in the local directory and sending them to a myfiles.tgz
    file on the remote system.


    The examples shown just are given for copying files over the network. Besides
    providing compression they also enable you to use any tar features you choose,
    such as incremental backup features.


