    # Using the Pico and nano Editors


    Pico is a popular, very small text editor, distributed as part of the Pine e-mail
    client. Although Pico is free, it is not truly open source. Therefore many Linux
    distributions don''t offer Pico. Instead, most distributions offer an open source
    clone of Pico called nano (nano''s another editor). SUSE provides both Pico and
    nano as optional packages. This section describes the nano editor.


    nano (represented by the nano command) is a compact text editor that runs from
    the shell, which is screen-oriented (owing to the fact that it is based on the
    curses library). nano is popular with those who formerly used the mail client
    because nano''s editing features are the same as those used by Pine''s Pico editor.
    On the rare occasion that you don''t have the vi editor on a Linux system (such
    as installing a minimal Gentoo Linux), nano may be available. On SUSE, nano is
    part of the nano package and relies on the spell program for spell checking. This
    program is not merely available on SUSE, though.


    As with the JOE editor, instead of commanding and typing modes, you can just begin
    typing. To open a file for editing, just type nano and the file name or use some
    of the following options:


    ```

    $ nano memo.txt      Open memo.txt for editing

    $ nano -b memo.txt      Saving, back up previous to ~filename

    $ nano -m memo.txt      Turn on move cursor (if supported)

    $ nano +83 memo.txt    Begin editing on line 83

    ```


    As with JOE, to add text, just begin typing. Use arrow keys to move the cursor,
