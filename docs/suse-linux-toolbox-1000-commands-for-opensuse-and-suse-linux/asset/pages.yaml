    | list-updates | lu | List all available updates. |


    The following example shows how to add a repository and search for packages and
    patches using the zypper command. In this example, we''ll tackle software drivers
    for wireless networking cards, because you often require extra repositories to
    find drivers for wireless cards, and the drivers get patched frequently. If your
    system sports a wireless card, you''ll often want to install drivers for your
    card, or download patches to update those drivers.


    The Madwif (http://madwifi.org/) project provides a SUSE repository of packages
    for the popular Ather chipset, a chipset used in wireless networking cards from
    many vendors. For installing wireless networking kernel drivers, having a repository
    custom tailored for your SUSE system can be very handy.


    Start by adding the Madwif install location using the zypper command in the same
    way as the previous example. Make sure you are adding the correct install location
    for the version of openSUSE you are running. Because we are using openSUSE 10.3
    for this chapter, we''ll add the 10.3 install location (change this for your version
    if necessary) and name the repository madwifi.


    ```

    # zypper ar http://madwifi.org/suse/10.3/ madwifi

    ```


    You can now use the zypper command to perform a case-insensitive search of anything
    you want. You can see in the results that the returned case-insensitive search
    returned the original term.


