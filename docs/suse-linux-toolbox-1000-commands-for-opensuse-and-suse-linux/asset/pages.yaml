  md: '# 3


    # Using the Shell


    The use of a shell command interpreter (usually just called a shell) dates back
    to the early days of the first Unix systems. Besides its obvious use of running
    commands, shells have many built-in features such as environment variables, aliases,
    and a variety of functions for programming. The shell used most often with Linux
    systems is the Bourne Again Shell (bash), there are other shells available as
    well (such as sh, csh, ksh, tcsh, and others). Some of these are outgrowths or
    replacement versions of older shells, a fact reflected by, for example, sh being
    a symbolic link to bash.


    | IN THIS CHAPTER |

    | Accessing the shell |

    | Using command history and completion |

    | Assigning aliases |

    | Gaining superuser access |

    | Writing simple shell scripts |


    This chapter offers information that will help you use Linux shells, in general,
    and the bash shell, in particular.


    # Terminal Windows and Shell Access


    The most common way to access a shell from a Linux graphical interface is using
    a Terminal window. From a graphical interface, you can often access virtual terminals
    to get to a shell. With no graphical interface, a text-based login you typically
    dropped directly to a shell after login.


    > SUSE has traditionally supplied the K Desktop Environment, or KDE, as the default.
    Modern versions of SUSE supply both KDE and its main competitor, the GNOME desktop
    environment. The graphical examples in this book use the traditional KDE environment.
    Similar commands exist within the GNOME environment.


    # Using Terminal Windows


    To open a Terminal window from KDE (the default SUSE desktop), select the reptile
    menu (based on the SUSE logo) and from the default Favorites'
