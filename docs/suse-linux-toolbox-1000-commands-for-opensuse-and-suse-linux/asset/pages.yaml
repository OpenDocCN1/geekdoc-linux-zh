  md: '# Using Named Pipes and Sockets


    When you want to allow one process to send information to another process, you
    can simply pipe () the output from one to the input of the other. However, to
    provide a presence in the file system from which a process can communicate with
    other processes, you can create named pipes or sockets. Named pipes are typically
    used for interprocess communication on the local system, while sockets can be
    used for processes communication over a network.


    Named pipes and sockets are often set up by applications in the /tmp directory.
    Here are some examples of named pipes and sockets:


    ```

    $ ls -l /tmp/.tv-chris/tvtimefifo-local /tmp/.X11-unix/xo

    prw-r---- 1 chris chris 2007-09-29 /tmp/.tv-chris/tvtimefifo-local

    srwxrxrwx 1 root chris 2007-09-29 01:30 /tmp/.X11-unix/xo

    ```


    The first listing is a named pipe set up by the tvtime TV player card (note the
    p at the beginning a named pipe). The second listing is a socket set up by the
    X GUI for interprocess communications.


    To create your own named pipe, use the mkfifo command as follows:


    ```

    $ mkfifo mypipe

    $ ls -l mypipe

    prw-r--r-- 1 chris 2007-09-29 00:57 mypipe

    ```


    Unless you are developing applications, you probably won''t need to create named
    pipes. If you want to find where named pipes and sockets exist on your system,
    you can use the -type option to find the find command, as described later in this
    chapter.


    # Setting File and Directory Permissions


    The ability to access files, run commands, and change to a directory can be restricted
    with permission settings for user, group, and other users. When you do a long
    list (ls -l) of files and directories in Linux, the beginning 10 characters indicate
    what the item is (file, directory, block device, and so on) along with or not
    the item can be read, written, or executed. Figure 4-1 illustrates the meaning
    of these 10 characters.


    ![](img/68ec7bb02370c395a1474375111dfbb9_93_0.png)


    > Figure 4-1: Read, write, and execute permissions are set for files and directories.'
  merge: -1
