    The openSUSE media are available with books that cover openSUSE, such as Linux
    Book 2007 Edition (Wiley, 2007), or by downloading media from the openSUSE website
    (www.opensuse.org). Get media for Novell SLES/SLED from www.novell.com (select
    Downloads). Subscription fees may apply for Novell SLED/SLES products.


    # Preparing to Install


    If you are going to erase everything on your computer''s hard disk and install
    openSUSE, you don''t have to make preparations for your install in advance. If
    you want to keep any data from your hard disk, back up that data before proceeding.
    To keep existing data on your hard disk and add openSUSE, you may need to resize
    disk partitions and partitioning your disk. See Chapter 7 for information on disk
    resizing and partitioning


    # Choosing Installation Options


    All SUSE-based Linux distributions use YaST (Yet Another Setup Tool) installer
    to initially install the system. This is also the name of the tool you run, after
    installation, to modify other system settings. YaST can run in text-based or GUI
    mode.


    # Start the Install Process


    Begin the install by booting from the DVD or CD in the install set. As an alternative,
    you will need to boot from install floppies or a USB key, refer to the README
    file in the boot/i386/ directory of CD #1, or visit the "Installation without
    CD" section on the openSUSE website (http://en.opensuse.org/Installation_without_CD).
    Choose one of the following methods to begin the installation process:


    +   - **CD or DVD** — Insert the DVD or first CD in the set and reboot the computer.
    You can also boot from the hard disk if you accidentally leave the CD after reboot.


    +   - **Minimal CD image** — Locate the appropriate mini.iso (for example SUSE-Linux-10.1-Remastered-i386-mini.iso)
    image from the iso directory of openSUSE download mirrors (http://mirror.colorado.edu/pub/opensuse/distribution/SL-10.1/iso/).
    Burn mini.iso to a CD. This lets you install from the CD, but continue from some
    other medium (such as an online repository) after starting. This is useful when
    you''re doing a quick installation and don''t have all the media with you.


    +   - **USB flash drive** — Review the instructions at http://en.opensuse.org/Installation_without_CD
    and http://en.opensuse.org/SuSE_install_from_USB_drive to get a proper installation.'
