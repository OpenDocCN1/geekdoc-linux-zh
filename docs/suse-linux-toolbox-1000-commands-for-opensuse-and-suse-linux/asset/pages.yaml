    You can use the mr command to modify the Refresh or Enabled attributes. Turning
    the Refresh attribute will mean you to refresh this repository manually; zypper
    will not do it automatically. You may want to disable repositories that you''ve
    added with development software so you''re not automatically retrieving software
    from places that may be unstable. Here''s an example of disabling a repository:


    ```

    # zypper mr -d "ftp.gwdg.de"

    Repository ftp.gwdg.de has been successfully modified.

    ```


    You can see the ftp.gwdg.de repository as disabled now:


    ```

