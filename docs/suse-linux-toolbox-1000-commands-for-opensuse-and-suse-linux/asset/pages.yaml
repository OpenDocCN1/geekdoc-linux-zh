    # # Setting Up the VNC Server


    In openSUSE, the VNC server is run as a service from the xinetd daemon. You can
    enable or disable the VNC server through YaST, under Network Services Remote Administration
    (VNC). You can also control VNC from the command line like any other xinetd service:


    ```

    # chconfig --list vnc Display VNC server startup setting

    xinetd based services:

    vnc: on

    # chconfig vnc on Set VNC server to start when xinetd loads

    # chconfig vnc off Prevent VNC server from starting when xinetd loads

    # service xinetd reload Reload xinetd

    ```


    The VNC server can create one or more displays available over the network. The
    YaST approach enables vnc for display :1, whereas the chconfig method enables
    multiple displays as defined in /etc/xinetd.d/vnc.


    If you are iptables firewall built into your system, make sure you open the port(s)
    for VNC. This can be done when you enable VNC through YaST by selecting Open Port
    in Firewall. If you enable VNC through the command line, this needs to be done
    manually. Each display runs on its own port. Display number N is accessed by TCP
    port 5900+N. For example, display 1, which is configured by default, is accessible
    on port 5901. Refer to Chapter 14 for more details on iptables.


    When the VNC server is running and the system is at level 5, you are ready to
    log in remotely.


    > NOTE If you use a GNOME desktop, you may want to install the vino package. This
    will allow you to easily share your local desktop (display :0).


