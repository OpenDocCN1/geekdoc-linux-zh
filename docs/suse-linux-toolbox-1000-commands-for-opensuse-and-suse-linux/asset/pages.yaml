  md: '# Using VNC on Untrusted Networks with SSH


    VNC is considered to be an insecure protocol. The password is sent using fairly
    weak encryption, and the rest of the session is not encrypted at all. For that
    reason, when using VNC over an untrusted network or Internet, we recommend you
    tunnel it over SSH.


    For a general description of how the SSH service works, refer to the "Doing Remote
    Login and Tunneling with SSH" section earlier in this chapter. To forward VNC
    display 1 (port 5901) on the computer named myserver to the same local port, type
    the following:


    ```

    $ ssh -L 5901:localhost:5901 myserver

    ```


    # Summary


    If you find yourself in a position where you need to administer multiple Linux
    systems, you have a rich set of commands with Linux for doing remote system administration.
    The Secure Shell (SSH) facility offers encrypted communications between clients
    and servers for remote login, tunneling, and file transfer.


    Virtual Network Computing (VNC) lets one Linux system share its desktop with a
    client system so that the remote desktop appears right on the client''s desktop.
    VNC can be tunneled over SSH to provide the security it lacks.'
