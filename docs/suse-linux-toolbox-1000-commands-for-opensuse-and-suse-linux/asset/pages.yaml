  md: '# Chapter 2: Installing openSUSE and Adding Software


    # Installing a Package with rpm


    The following example uses wget to download the rar package, a compression and
    packaging utility. The example then installs the rpm package located in the current
    directory. Options in the rpm command include -U for update, -v for verbose, and
    -h to show progress hashes


    > NOTE The -i option can also be used to install a package. However, most people
    use the -U option because it causes the package you are installing to replace
    an earlier, existing package of the same name if one exists. You can use the -i
    option, however if you want multiple instances of the package to exist on the
    system. Having multiple kernel packages is an example of this.


    ```

    # wget \

    ://packman.iu-bremen.de/suse/10.3/i586/rar-3.7.1-0.pm.0.i586.rpm

    # rpm -Uvh rar-3.7.1-0.pm.0.i586.rpm

    Preparing...

    ################################ [100%]

    :rar

    ```


    Using the rar package as an example, the following command installs the package
    directly from the Internet. This approach works with http and ftp protocols.


    ```

    # rpm -Uvh \

    http://packman.iu-bremen.de/suse/10.3/i586/rar-3.7.1-0.pm.0.i586.rpm

    Retrieving http://packman.iu-bremen.de/suse/10.3/i586/rar-3.7.1-0.pm.0.i586.rpm

    warning: /var/tmp/rpm-xfer.EuO3a: Header V3 DSA signature: NOKEY, key ID

    9a795806

    Preparing...

    ################################ [100%]

    :rar

    ```


    # Upgrading a Package with rpm


    If an older version of the package is already installed, an error will occur.
    Use -Uvh to upgrade an existing package to a newer version:


    ```

    # rpm -Uvh \

    http://packman.iu-bremen.de/suse/10.3/i586/rar-3.7.0-0.pm.0.i586.rpm

    Retrieving http://packman.iu-bremen.de/suse/10.3/i586/rar-3.7.0-0.pm.0.i586.rpm

    warning: /var/tmp/rpm-xfer.HgM2qb: Header V3 DSA signature: NOKEY, key ID

    9a795806

    Preparing...

    ################################################ [100%]

    :rar ################################# [100%]

    ```


    This example installed an older version of the command. To upgrade, use the same
    rpm command lines, with a newer package. For example:


    ```

    # rpm -Uvh \

    http://packman.iu-bremen.de/suse/10.3/i586/rar-3.7.1-0.pm.0.i586.rpm

    Retrieving http://packman.iu-bremen.de/suse/10.3/i586/rar-3.7.1-0.pm.0.i586.rpm

    warning: /var/tmp/rpm-xfer.HgM2qb: Header V3 DSA signature: NOKEY, key ID

    ```'
