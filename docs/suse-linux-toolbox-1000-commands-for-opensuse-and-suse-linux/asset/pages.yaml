    # # Using awk and cut to Process Columns


    Another massive text processing tool is the awk command. The awk command is a
    full-blown programming language. Although there is much more you can do with the
    awk command, the following examples show you a few tricks related to extracting
    columns of text:


    ```

    $ ps auwx | awk ''(print $1,$11)''

    $ ps auwx | awk ''/francois/ (print $11)''

    $ ps auwx | awk ''(print $11)'' Same as above

    ```


    The first example displays the contents of the first column (user name) and element
    (command name) from currently running processes output from the ps command (awk).
    The next two commands produce the same output, with one using the awk command
    and the other using the grep command to find all processes owned by the user named
    francois. In each case, processes owned by francois are found, column 11 (command
    name) is displayed for each of those processes.


    By default, the awk command assumes the delimiter between columns is spaces. You
    can specify a different delimiter with the -F option as follows:


    ```

    $ awk -F:''(print $1,$5)'' /etc/passwd Use colon delimiter to print cols

    ```


    You can get similar results with the cut command. As with the previous awk example,
    we specify a colon (:) as the column delimiter to process information from the
    /etc/passwd file:


    ```

    $ cut -d:-f1,5 /etc/passwd Use colon delimiter to print cols

    ```


    The cut command can also be used with ranges of fields. The following command
    lists 1 through 5 of the /etc/passwd file:


    ```

    $ cut -d:-f1-5 /etc/passwd Show columns 1 through 5

    ```


    Instead of a dash (-) to indicate a range of numbers, you can use it to print
    all columns from a particular column number and above. The following command displays
    all columns from column 5 and above from the /etc/passwd file:


    ```

    $ cut -d:-f5- /etc/passwd Show columns 5 and later

    ```'
