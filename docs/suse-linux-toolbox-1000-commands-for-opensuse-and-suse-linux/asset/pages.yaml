  md: '# Listing Text Files


    The most basic method to display the contents of a text file is with the cat command.
    The cat command concatenates (in other words, outputs as a string of characters)
    the contents of a text file to your display (by default). You can then use shell
    metacharacters to direct the contents of that file in different ways. For example:


    ```

    $ cat myfile.txt

    $ cat myfile.txt > copy.txt

    $ cat myfile.txt >> myfile.txt

    $ cat -s myfile.txt

    $ cat -n myfile.txt

    $ cat -b myfile.txt

    ```


    Send entire file to view the screen

    Direct file contents to another file

    Append file contents to another file

    Display consecutive blank lines as one

    Show line numbers with output

    Show line numbers only on non-blank lines


    However, if your block of text is more than a few lines long, using cat by itself
    becomes impractical. That''s when you need better tools to look at the beginning
    or the end, or through the entire text.


    To view the top of a file, use head:


    ```

    $ head myfile.txt

    $ cat myfile.txt | head

    ```


    Both of these commands use the head command to output the top 10 lines of the
    file. You can use the line count as a parameter to display any number of lines
    from the beginning of a file. For example:


    ```

    $ head -n 50 myfile.txt

    $ ps auxw | head - 15

    ```


    Show the first 50 lines of a file

    Show the first 15 lines of ps (shorter)


    This can also be done using this obsolete (but shorter) syntax:


    ```

    $ tail -n 50 myfile.txt

    $ tail -n 15 myfile.txt

    $ ps auxw | tail - 15

    ```


    You can use the tail command to view the end of the file:


    ```

    $ tail -n 15 myfile.txt

    $ tail -n 15 myfile.txt

    $ ps auxw | tail - 15

    ```


    Display the last 15 lines in a file

    Display the last 15 lines in a file

    Display the last 15 lines in ps output


    The tail command can also be used to continuously watch the end of a file as is
    written to another program. This is very useful for reading live log files when
    troubleshooting apache, sendmail, or many other system services:


    ```

    $ tail -f /var/log/messages

    $ tail -f /var/log/mail

    ```


    Watch system messages live

    Watch mail server messages live'
