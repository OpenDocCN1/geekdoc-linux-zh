  md: '# Appendix C: Getting Information from /proc


    ```

    btime 1181950070\processes 519308

    procs_running 1

    procs_blocked 0

    ```


    The /proc/stat file contains statistics related to CPU and process activities.
    The

    cpu line shows totals for all CPUs, while separate lines for each processor (cpu0,

    cpu1, and on) shows stats for each CPU on the computer. There are seven fields

    (from left to right) of cpu information: normal number of processes executed in
    user

    mode, niced processes executed in user mode, kernel idle processes,

    iowait processes (waiting for input/output to finish), serving interrupts (IRQ),
    and

    serving IRQs.


    ```

    $ cat /proc/swaps

    Filename Type Size Used Priority

    /dev/sda partition 2010288 201124 -1

    $ cat /proc/utime

    Seconds since system booted/total seconds idle

    2300251.03 2261855.31

    $ cat /proc/version

    ```


    List kernel version and related compiler

    Linux version 2.6.22.5-23-default (geekobuildhost) (gcc version 4.2.1

    SUX Linux) #1 SMP 2007/09/18 05:23:45 UTC


    # Changing /proc information


    Some values in the /proc/sys directory can be changed on the fly. For

    /proc/sys files that accept binary values (0 disabled or 1 enabled) people would

    off simply a value to any files they wanted to change. For example, to allow

    forwarding of IPv4 packets, such as to allow a system to do Network Address

    Translation (NAT) or IP Masquerading, you could type:


    ```

    # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    Although you could use this technique to make temporary changes to your sys-

    tem, the preferred method of changing /proc/sys information on the file is using
    the

    sysctl command. To change these settings on a permanent basis, you should

    add entries to the /etc/sysctl.conf file. Here are some examples of the sysctl

    command:


    ```

    # sysctl -A | less

    Display all kernel runtime parameters

    # sysctl -w net.ipv4.ip_forward=1  Turn on IPv4 packet forwarding

    ```


    See Chapter 10 as well as the sysctl and sysctl.conf pages for further

    information.


