  md: '# Chapter 14: Locking Down Security


    # Managing Users the GUI Way


    With or without X, you can manage users and groups with YaST (Security and Users
    User Management). When managing user accounts for servers, one option is to use
    webbased GUIs. The most common use general-purpose tool is Webmin (www.webmin.com).
    Make sure you not run Webmin on its default port (10000) for security reasons.
    You can also use special-purpose web interfaces. For example, there are many web
    hostingautomating GUIs, such as cPanel (www.cpanel.com), Plesk (www.swsoft.com/plesk),
    and Ensim (www.ensim.com).


    # Adding User Accounts


    To add new users, you can use the useradd command. The only option that is required
    to add a new user is the user name you are adding. You can see some of the default
    settings for adding a new user by entering the -D option:


    ```

    # useradd -D

    GROUP=100                  Show default values Set group ID to 100 (users)

    HOME=/home                 Set base home directory to /home

    INACTIVE=-1                Password expiration is disabled (-1)

    EXPIRE=                     Don''t set date to user account

    SHELL=/bin/bash            Set the default shell to /bin/bash

    SKEL=/etc/skel             Copy config files from /etc/skel to $HOME

    CREATE_MAIL_SPOOL=yes Create a mail spool directory

    GRO=video,dialout Assign user to groups video and dialout

    CREATE_MAIL_SPOOL=no Do not create mail spool file

    ```


    By default, the user ID assigned to the first user created is 1000 and the group
    ID is 100. The home directory is the user name appended to /home and is only created
    if you add the -m option. So, for example, if you created the first regular user
    account on the system as follows:


    ```

    # useradd -m willz

    ```


    The result will be a new user account with a willz user name (UID 1000), member
    of the groups users, video and dialout, a home directory of /home/willz, and a
    set of configuration files copied to the home directory from /etc/skel. The account
    remain active indefinitely (no expiration date). Add a password as follows, and
    in most cases all you''ll need to do is having a working user account.


    ```

    # passwd horatio

    Changing password for user horatio.

    New UNIX password: *****

    Retype new UNIX password: *****

    passwd: authentication tokens updated successfully.

    ```


    NOTE Remember to use strong, non-dictionary-based passwords.


