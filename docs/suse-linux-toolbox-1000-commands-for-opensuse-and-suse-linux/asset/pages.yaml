  md: '# Chapter 4: Working with Files


    The command line finds files in /sbin with permissions that match 750:


    ```

    $ find /sbin/ -perm 750 -print

    ```


    The exec option to find is very powerful, because it lets you act on the files
    found with the find command. The following command finds all files in /var owned
    by francois (must be a valid user) and executes the ls -1 command on each one:


    ```

    $ find -user francois exec ls -1 {} \

    ```


    An alternative to the find command''s exec option is xargs:


    ```

    $ find -user francois -print | xargs ls -1

    ```


    There are big differences on how the two commands just shown operate, leading
    to very different performance. The find -exec spawns the ls for each result it
    finds. The xargs command works more efficiently by passing many results as input
    to a single ls.


    To negate a search criteria, place an exclamation point (!) before criteria. The
    next example finds all the files that are not owned by the group root and are
    regular files, and then does an ls -1 on each:


    ```

    $ find ! -group root -type f -print 2> /dev/null | xargs ls -1

    ```


    The next example finds files in /sbin that are regular files and are not executable
    by others, feeds them to an ls -1 command:


    ```

    $ find /sbin -type f ! -perm /o -print | xargs ls -1

    -drwxr-xr-x--- 1 root root 18372 2007-09-21 17:06 /sbin/acpid

    -drwxr-xr-x--- 1 root root 9996 2007-09-21 16:51 /sbin/audispd

    ```


    Finding by size is a great way to determine what is filling up your hard disks.
    The following command finds all files that are greater than 10MB (+10M), lists
    those from largest to smallest (-ls -S) and directs that to a file (/tmp/bigfiles.txt):


    ```

    $ find -xdev -size +10M -print | xargs ls -lS > /tmp/bigfiles.txt

    ```


    In this example, the -xdev option prevents any mounted file system, besides the
    root file system, from being searched. This is a good way to keep the command
    from searching the /proc directory and any remotely mounted file systems, as well
    as other locally mounted file systems. You may also want to run this command as
    root.'
  merge: -1
