  md: '# ## Chapter 11: Managing Network Connections


    You can add a default gateway using the gw option:


    ```

    # route add default gw 10.0.0.2    Add 10.0.0.2 as default gateway

    ```


    You can add a new route to your network by specifying either the interface (eth0)
    or IP address of the gateway (such as gw 10.0.0.100):


    ```

    # route add -net 192.168.0.0 netmask 255.255.255 eth0

    # route add -net 192.168.0.0 netmask 255.255.255 10.0.0.100

    ```


    You can delete a route using the del option:


    ```

    # route del -net 192.168.0.0 netmask 255.255.255.0    Delete a route

    ```


    Using the new ip command, you can do the same activities just shown with the route
    command. Here are three different ways to show the same basic routing information:


    ```

    # ip route show                        Display basic routing information

    10.0.0.0/24 dev eth0 proto kernel scope link src 10.0.0.195

    169.254.0/16 dev eth0 scope link

    default via 10.0.0.1

    # ip route                             Display basic routing (example #2)

    # ip r                                Display basic routing (example #3)

    ```


    Here are examples for adding and deleting routes with ip:


    ```

    # ip add 192.168.0.0/24 via 10.0.0.100 dev eth0    Add to interface

    # ip add 192.168.0.0/24 via 10.0.0.100      Add route no interface

    # ip del 192.168.0.0/24                               Delete route

    ```


    To make a new route permanent, create a /etc/sysconfig/network/ file named ifcfg-ethX
    (for example, ifcfg-eth0) and place the information about the new route for network
    interface in that. For example, add the route added with the ip command above,
    adding following lines to /etc/sysconfig/network/ifcfg-eth0:


    ```

    ADDRESS=192.168.0.0

    NETMASK=255.255.255.0

    GATEWAY=10.0.0.100

    ```


