  md: '# Chapter 12: Accessing Network Resources


    # Summary


    Network access commands provide quick and efficient ways to get content you need
    over a network. The links web browser is a popular screen-oriented command for
    browsing the web or taking a quick look at any HTML file. Dozens of commands are
    available to download files over FTP, HTTP, SSH, or other protocols, including
    wget, `curl`, `lftp`, and `scp`.


    For ongoing access to remote directories of files, this chapter covers how to
    use NFS, Samba, and SSHFS command tools. You can do IRC chats, which are popular
    among open source projects, using the `irssi` command. For text-based e-mail clients,
    you have choices such as the `mail` and `mutt` commands.'
