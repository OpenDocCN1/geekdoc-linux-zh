    # Controlling Startup and Run Levels


    After the kernel has started up, it handles control of the system to the init
    process. The init process becomes the first running process on the system (PID
    1), directing the startup of other processes based on the contents of the /etc/initab
    file, the default run level, and the init scripts set to run at that level.


    The default run level is typically set to 5 for desktop systems and 3 for server
    systems (based on the value of initdefault in the /etc/initab file). As noted
    earlier, that value can be overridden by adding a different run level number (S,
    1, 2, 3, 4, or 5) to the end of the kernel boot line from the boot screen.


    Most Linux administrators leave the basic startup features alone and focus on
    which services are turned on or off at the selected run level. The mechanism for
    starting run level scripts in SUSE, and similar systems is based on the V Init
    facility (sysvinit package), used originally in AT&T Unix System systems.


    This section contains commands for working with init scripts and changing run
    levels. As root, you can use the runlevel command to see the current run level:


    ```

    # runlevel Display current and previous run levels

    N3

    ```


    Because the system in this example booted directly to run level 3, there is no
    previous run level (N). To change the current run level, you can use the init
    command:


    ```

    # init 5 Change the current run level to 5 (X Desktop)

    ```


    In this example, the current run level changes from the previous level (in this
    case, 3) to run level 5 (which starts the X Window graphical user interface).
    You can also use'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Chapter 10: Managing the System


    the q option to reexamine the /etc/initab file and start or stop processes based
    on changes made to that file:


    ```

    # init q Start or stop changed processes in initab file

    ```


    Note that running init q does not start or stop System V services. It is used
    mostly when tinkering with the getdefs defined in initab.


    To manage services, you can use the chkconfig and service commands. You need to
    install the samba package first. For example, to start the Samba service immediately,
    you could use this:


    ```

    # service smb start Start Samba service immediately

    Starting SMB services: [ OK ]

    ```


    The service command starts the init script (smb in this example) from the /etc/init.d
    directory. Most of these scripts support start and stop options, with some other
    features you support as well. Here is how to use service to start and stop services:


    ```

    # service smb Show usage statement (with no options)

    Usage: /etc/init.d/smb [start|stop|try-restart|restart|force-reload|reload|probe]

    # service smb restart Restart Samba service (first, then on)

    Shutting down Samba SMB daemon done

    Starting Samba SMB daemon done

    # service smb try-restart Restart Samba service (if already running)

    Checking for Samba SMB daemon done

    Shutting down Samba SMB daemon done

    # service smb reload Reload settings in smb.conf file

    Reloading Samba SMB daemon done

    # service smb status Check if the Samba service is running (smbd)

    Checking for Samba SMB daemon done

    # service smb stop Stop Samba service

    Shutting down Samba SMB daemon done

    ```


    Any of the init scripts contained in /etc/init.d can be started with this, but
    not all scripts support all the features shown. Most scripts, however, can use
    their usage statement with no option (as in the first example above).


    While the service command starts the run level script immediately, to have a service
    start automatically at boot or during a run level, you can use the chkconfig.
    With chkconfig, you can list services, turn them on, or turn them off per-run
    level basis.


    ```

    # chkconfig smb Turn on the Samba service

    # chkconfig --list List runlevels is on or off

    smb 0:off 1:off 2:off 3:on 4:off 5:on 6:off

    # chkconfig --list List all services, indicating on or off

    # chkconfig --level 2 smb off Off Samba service for run level 2

    ```


    # 189'
