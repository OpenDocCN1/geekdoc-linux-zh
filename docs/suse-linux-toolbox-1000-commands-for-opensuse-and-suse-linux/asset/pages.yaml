    Instead of letting ARP dynamically learn about other systems, you can add static

    ARP entries by using the -s option:


    ```

    # arp -s 10.0.0.51 00:0b:6a:02:ec:95    Add IP and MAC addresses to ARP

    ```


    To do the same actions with the command that you just did with the arp command,
    use the neighbor object (notice neighbor, nei, and not objects can be reused interchangeably:


    ```

    # ip neighbor

    10.0.0.1 dev eth0 laddr 00:10:5a:ab:f6:a7 DELAY

    10.0.0.50 dev eth0 laddr 00:0b:6a:02:ec:98 REACHABLE

    # ip del 10.0.0.50 dev eth0

    # ip add 10.0.0.51 laddr 00:0b:6a:02:ec:95 dev eth0

    ```


    To a query to see if an IP is already in, or to find the MAC address of the device
    using it, use the arping command. The arping command is used by ifup to avoid
    IP conflicts when querying an Ethernet NIC up. Here are examples:


    ```

    # arping 10.0.0.50                    Query to see if 10.0.0.50 is in

    ARPING 10.0.0.50 from 10.0.0.195 eth0    [00:0b:6a:02:ec:98] 0.694ms

    Unicast reply from 10.0.0.50             [00:0b:6a:02:ec:98] 0.683ms

    # arping -i eth0 10.0.0.50               Specify interface to query from

    ```


    Like the ping command, the arping command continuously queries for the until the
    command is ended. Typically, you just want to know if the target is alive, so
    you can run one of the following commands:


    ```

    # arping -f 10.0.0.50                    Query 10.0.0.50 and stop at the first
    reply

    # arping -c 2 10.0.0.51                   Query 10.0.0.50 and stop after 2 counts

    ```


    # Tracing Routes to Hosts


    After make sure that you can ping the gateway and reach machines that are outside
    of your network, you may still have issues reaching a specific host or network.
    That is, you can use traceroute to find the bottleneck or point of fault:


    ```

    $ traceroute boost.turbine.com Follow the route to a host

    troute to boost.turbine.com (66.113.99.70) 30 hops max,40 byte packets

    1 10.0.0.1 (10.0.0.1) 0.281 ms 0.289 ms 0.237 ms

    2 tl-031.hcb.net (64.211.14.14) 6.623 ms 6.189 ms 6.083 ms

    3 172.157.2.153 (172.172.153) 14.070 ms 14.025 ms 13.974 ms

    4 so-3-0-2.2.MIN1.glbx.net (208.148.1.1) 19.076 ms 19.053 ms 19.004 ms

    5 so-108-248.MR4.SEA1.glbx.net (67.771.210) 94.697 ms 94.668 ms 94.612 ms

    6 64.215.31.114 (64.215.31.114) 99.643 ms 101.647 ms 101.577 ms

    7 dr02-v109.tac.ofustion.net (209.147.112.50) 262.301ms 233.316ms 233.153 ms

    8 dr01-v100.tac.ofustion.net (66.113.96.1) 99.313 ms 99.401 ms 99.353 ms

    9 boost.turbine.com (66.113.99.70) 99.251 ms 96.215 ms 100.220 ms

    ```


