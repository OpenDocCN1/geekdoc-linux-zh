  md: '# Chapter 14: Locking Down Security


    Locking a user account with passwd causes an exclamation mark (!) to be placed
    at the front of the password field in the /etc/shadow file (where user passwords
    are stored). When a user account is unlocked, the exclamation marks are removed
    and the user’s previous password is restored.


    An administrator can use the passwd command to require users to change passwords
    regularly, as well as when passwords are about to expire. To use the password
    expiration feature, the user account needs to have password expiration enabled.
    The following examples use passwd to modify password expiration:


    ```

    # passwd -n 2      Set minimum password life to 2 days

    # passwd -x 300     Set maximum password life to 300 days

    # passwd -w 10      Warn of password expiration 10 days in advance

    # passwd -i 14      Days after expiration account is disabled

    ```


    In the first example, the user must wait at least two days (-n 2) before changing
    a new password. In the second, the user must change the password within 300 days
    (-x 300). In the next, the user is given 10 days before the password expires (-w
    10). In the last example, the user account is disabled 14 days after the password
    expires (-i 14).


    To view password expiration, you can use the chage command as follows:


    ```

    # chage -l vern         View password expiration information

    Last password change   : Aug 04, 2007

    Password expires       : May 31, 2008

    Password inactive      : Jun 14, 2008

    Account expires        : never

    Minimum number of days between password change : 2

    Maximum number of days between password change : 300

    Number of days of warning before password expires : 10

    ```


    As system administrator, you can use the chage command to manage password expiration.
    Besides being able to set minimum (-m), maximum (-M), and warning (-W) days for
    password expiration, chage can also set the day when a user must set a new password
    or a particular date the account becomes inactive:


    ```

    # chage -I 40 frank Make inactive in 40 days

    # chage -d 5 perry Force user''s password to expire in 5 days

    ```


    Instead of five days (-d 5), you could set that to 0 and cause the user to have
    to set a new password the next time he she logs in. For example, the next time
    the user logged in, if -d 0 had been set, perry would be prompted for a new password
    as follows:


    ```

    login: perry

    Password: ********

    You are required to change your password immediately (root enforced)

    Changing password for perry.

    ```


    # 256'
