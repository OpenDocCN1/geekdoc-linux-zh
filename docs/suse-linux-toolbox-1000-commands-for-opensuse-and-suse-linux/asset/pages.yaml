  md: '# Chapter 6: Playing with Multimedia


    # # Converting Images


    The convert command is a Swiss Army knife of file converters. Here are some ways
    to manipulate images using the convert command. The following examples convert
    image files from one format to another:


    ```

    $ convert tree.jpg tree.png

    $ convert icon.gif icon.bmp

    $ convert photo.tiff photo.pcx

    ```


    Convert a JPEG to a PNG file

    Convert a GIF to a BMP file

    Convert a TIFF to a PCX file


    Image types that convert supports JPG, BMP, PCX, GIF, PNG, TIFF, XPM, and XWD.
    Here are examples of convert being used to  resize images:


    ```

    $ convert -resize 1024x768 hat.jpg hat-sm.jpg

    $ convert -sample 50%x50 dog.jpg dog-half.jpg

    ```


    The first example creates an image (hat-sm.jpg) that is 1024 × 768 pixels. The
    second example reduces the image dog.jpg in half (50%x50%) and saves it as dog-half.jpg.


    You can rotate images from 0 to 360 degrees. Here are examples:


    ```

    $ convert -rotate 270 sky.jpg sky-final.jpg

    $ convert -rotate 90 house.jpg house-final.jpg

    ```


    Rotate image 270 degrees

    Rotate image 90 degrees


    You can add text to an image using the -draw option:


    ```

    $ convert -fill black -pointsize 60 -font helvetica \

    -draw ''text 10,80 "Copyright Negus Inc.\'' \

    p10.jpg p10-cp.jpg

    ```


    The previous example adds copyright information to an image, using 60 point black
    Helvetica to write text on the image. The text is placed 10 points in 80 points
    down from the upper left. The new image name is p10-cp.jpg, to indicate that the
    new image has copyright information added.


    Here are some examples to create thumbnails with the convert command:


    ```

    $ convert -thumbnail 120x120 a.jpg a-a.png

    $ convert -thumbnail 120x120 -polaroid 0 a.jpg a-b.png

    $ convert -thumbnail 120x120 -polaroid 8 -background red a.jpg a-c.png

    ```


    All three examples create a 120 x 120 thumbnail. The second adds the -polaroid
    option to put a border around the thumbnail, so it looks like a Polaroid picture.
    The last example sets the -polaroid angle to 8 so that the image looks slightly
    askew. Figure 6-1 shows the results of these three examples.


