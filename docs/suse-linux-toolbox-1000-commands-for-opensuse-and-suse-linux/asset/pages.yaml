  md: '# Chapter 2: Installing openSUSE and Adding Software


    # Choose an Installation Method


    Each of the methods described should result in an openSUSE installer boot screen
    appearing. Here are your choices on how to proceed from the boot screen:


    +   **Graphical install** — With a CD or DVD graphical install, the down arrow
    keys to move to the Installation item. You can use function keys to modify the
    installation: press F2 to change the language, F3 to change the video mode, F5
    to change or install a special driver needed for your hardware. Press F4 to change
    where you get the packages used for installation from the CD/DVD to another location.
    Your choices are either hard disk or an online repository (available via FTP,
    HTTP, or SMB/CIFS protocols).


    **NOTE** For information on available install methods see the openSUSE website
    under the Installation section (http://en.opensuse.org/Installation). Special
    vnc and ssh install options, are available from the boot prompt, as described
    later.


    If you don''t need any additional boot options, press Enter to continue with a
    graphical install from the selected media. You can skip from here right to the
    "Answering Installation Options" section.


    +   **Boot prompt install** — To have the install proceed from a simple boot prompt,
    press the Esc from the boot screen and select OK from the pop-up that appears.
    Once at the boot prompt, you can add boot options to do special things, such as
    installing using ssh or vnc. Continue to the next section for information on boot
    options.


    # Add Boot Prompt Options


    If you choose to bypass the menu on the boot screen and start your install from
    a simple boot prompt, there are a lot of options you can enter to direct install
    procedures. Here are examples of some handy install types you can request from
    the boot prompt after pressing the Esc key:


    ```

    boot: linux               start the install normally

    boot: linux ssh=1         installer starts ssh server

    boot: linux vnc=1         installer starts a vnc server

    ```


    **WARNING!** Note that the vnc=1 method may pass your install over the network
    in clear text, as the root password. You may want to consider using the ssh option
    whenever possible.


    If you run this in text mode (if your graphical screens are garbled), you will
    be working in the YaST text mode. If you run a VNC install, using the vnc=1 parameter,
    you can step through the graphical section of the install remotely by connecting
    a VNC client to the IP of the machine. The installer will show you IP address
    to connect to when it starts the VNC server. If you want to run an SSH install,
    the ssh=1 parameter will launch an SSH server on the installer, which you can
    connect to using the ssh -X parameter. The installer will show you the SSH connection
    instructions on the screen.'
