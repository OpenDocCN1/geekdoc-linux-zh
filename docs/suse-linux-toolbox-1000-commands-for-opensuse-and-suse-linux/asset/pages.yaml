    # Logical Volume Manager


    Logical Volume Manager (LVM) is a feature to help you cope with the changing for
    disk space on Linux systems. With your hard disks configured as LVM volumes, you
    have tremendous flexibility in growing, shrinking, and moving the storage space
    as your systems needs change. LVM also allows for snapshots, a feature typically
    found on expensive SANs, or Storage Area Networks.


    SUSE incorporates LVM2 into its releases and uses it to define how partitions
    are allocated when you install SUSE. Using LVM2, you define and manage volume
    groups (vg), logical volumes (lv). Each logical volume and physical volume is
    divided into logical extents and physical extents, respectively.


