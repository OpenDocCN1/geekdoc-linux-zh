    # Burning Backup Images with crecord


    The crecord command is the most popular Linux command line tool for burning CD
    and DVD images. After you have created an ISO image (as described earlier) or
    obtained one otherwise (such as downloading an install CD or live CD from the
    Internet), crecord makes it easy to put that image on a disc.


    > NOTE the crecord command has been replaced with widom command. The widom command
    was created from the crecord code base and still supports most of the options.
    If you run crecord, you will actually be running widom in this SUSE release. For
    help visit the CDRkit project (http://cdrkit.org).


    There is no difference in making a CD or DVD ISO image, aside from the fact that
    a DVD image can obviously be bigger than a CD image. Check the media you have
    for their capacities. A CD can typically hold 650MB, 700MB, or 800MB, whereas
    mini CDs can hold 50MB, 180MB, 185MB, or 193MB. Single-layer DVDs can hold 4.7GB,
    while double-layer DVDs can hold 8.4GB.'
