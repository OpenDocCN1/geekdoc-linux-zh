  md: '# Sorting Output with sort


    It can also be useful to sort the content of the file or the output of a command.
    This can be helpful in bringing order to disorderly output. The following examples
    list the names of all RPM packages currently installed, grabs any with apparmor
    and the name, and sorts the results in alphanumeric order (forward and reverse):


    ```

    $ rpm -qa | grep apparmor | sort

    $ rpm -qa | grep apparmor | sort -r

    ```


    The following command sorts processes based on memory usage (fourth field of ps
    output). The -k option specifies the key field to use for sorting. 4, 4 indicates
    that the fourth field, and only the fourth field, is a key field.


    ```

    $ ps aux | sort -k 4,4

    ```


    The following command line sorts loaded kernel modules in increasing size order.
    The n option tells sort to treat the second field as a number and not a string:


    ```

    $ lsmod | sort -k 2,2n

    ```


    # Finding Text in Binaries with Strings


    There are times when you need to read the ASCII text that is inside a binary file.
    You can learn lot about an executable that way. For those occurrences, use strings
    to extract all human-readable ASCII text. The strings command is part of the binutils
    package. Here are some examples:


    ```

    $ strings /bin/ls | grep -i libc Find occurrences of libc in ls

    $ cat /bin/ls | strings List all ASCII text in ls

    $ strings /bin/ls List ASCII text in ls

    ```


    # Replacing Text with sed


    Finding text within a file is sometimes the first step to replacing text. Editing
    streams of text is done using the sed command. The sed command is actually a full-script
    language. For the examples in this chapter, we cover basic text replacement with
    the sed command.


    If you are familiar with text replacement commands in sed, sed has some similarities.
    In the following example, you would replace only the first occurrence per line
    of francois with chris. Here, sed takes its input from a pipe, sending its output
    to stdout (your screen):


    ```

    $ cat myfile.txt | sed s/francois/chris/

    ```


    Adding a g to the end of the substitution line, as in the following command, causes
    every occurrence of francois to be changed to chris. Also, in the following example,
    input is directed from the file myfile.txt and output is directed to myfile.txt:


    ```

    $ sed s/francois/chris/g < myfile.txt > myfile.txt

    ```'
