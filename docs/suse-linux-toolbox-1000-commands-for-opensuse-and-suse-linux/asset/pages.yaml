    IRC chats with irsi

    Mail and mutt e-mail

    clients


    This chapter covers commands for accessing resources (files, e-mail, shared directories,
    and online chats) over the network.


    # Running Commands

    To Browse the Web


    Text-mode web browsers provide a quick way to check that a web server is working
    or to get information from a server when a usable GUI isn''t available. The once-popular
    lynx text-based browser was supplanted in most Linux systems by the links browser,
    which was later replaced by elinks on many versions of Linux. On SUSE, install
    the links and lynx packages to get these text-based web browsers.


    The links browser runs in a terminal. Aside from not displaying images in the
    terminal, links can handle most basic HTML content and features: tables, frames,
    browsing, cookies, history, mime types, and simple cascading sheets. You can use
    your mouse to follow links and select menu items. Here are some examples of links
    command lines:


    ```

    $ links Launches empty browser, press Esc to menu enter URL

    $ links www.handsonhistory.com Opens file name or URL you request

    $ links http://www.handsonhistory.com Opens URL you request

    ```'
