  md: '# Chapter 7: Administering File Systems


    # Table 7-1: File System Types Supported in Linux (continued)


    | File System Type | Description |

    | --- | --- |

    | ufs | Popular file system on Solaris and SunOS operating systems from Sun Microsystems.
    |

    | vfat | Extended FAT (VFAT) file system. Useful when file systems need to share
    files with old Windows systems (as with dual booting or removable drives). |

    | xfs | Journaling file system for high-performance environments. Can scale up
    to systems that include multiple terabytes of data that transfer at multiple gigabytes
    per second. |


    Besides the file system types listed in the table, there are also what are referred
    to as network shared file systems. Locally, a network shared file system may be
    an ext3, ntfs, or other normal file system type: Whether or all of those file
    systems can be shared with network protocols such as Samba (smbfs) or cifs file
    system type), NFS (nfs), and NetWare (ncpfs).


    Many available file system types are either not for creating new file systems
    or not fully supported in every version of Linux. For example, file system types
    such as minix (for Minix), befs (for BeOS) and, affs (for Amiga systems) are mostly
    useful if you need to mount and access old backup media from those systems. Even
    popular file systems may not be fully supported. For example, reisers file systems
    cannot be used with Security Enhanced Linux (SELinux) in Fedora and RHEL.


    # Creating and Managing File Systems


    SUSE gives you the option of having the installer create a default partitioning
    and file system scheme or letting you set that up manually when you install Linux.
    The installer lets you choose to erase the hard disk, or use only free disk space
    to set the partitions. To take the manual approach instead, you must choose to
    create a custom layout.


    With the manual approach, the disk-partitioning tool lets you divide the hard
    disk into partitions as you choose. Later, there are a lot of command-line utilities
    you can use to change and work with your disk partitions and the file systems
    created on those partitions.


    # Partitioning Hard Disks


    Historically, PC hard drives have used a 32-bit PC-BIOS partition table with a
    Master Boot Record (MBR). This limits partition sizes to 2TB and allows only four
    primary partitions per drive. The use of extended partitions is a way to overcome
    the'
