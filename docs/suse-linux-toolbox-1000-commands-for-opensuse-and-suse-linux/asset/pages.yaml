  md: '# Chapter 3: Using the Shell


    # Redirecting stdin and stderr


    Typing a command in a shell makes it run interactively. The resulting process
    has two output streams: stdout for normal command output and stderr for error
    output. In the following example, when /tmp isn''t found, an error message goes
    to stderr but the output from listing /tmp (which goes to stdout):


    ```

    $ ls /tmp

    ls: /tmp: No such file or directory

    /tmp/

    gconf-fcaen keyring-b4iWub keyring-itEWbz mapping-fcaen orbit-fcaen

    ```


    By default, all output is directed to the screen. Use the greater-than (>) to
    direct output to a file. More specifically, you can direct the standard output
    stream (using >) or standard error stream (using 2>) to a file. Here are examples:


    ```

    $ ls /tmp > output.txt

    ls: /tmp: No such file or directory

    ```


    ```

    $ ls /tmp 2> errors.txt

    /tmp/

    gconf-fcaen keyring-b4iWub keyring-itEWbz mapping-fcaen orbit-fcaen

    ```


    ```

    $ ls /tmp 2> errors.txt > output.txt

    ```


    ```

    $ ls /tmp > everything.txt 2>&

    ```


    In the first example, stdout is redirected to the file output.txt, whereas stderr
    is still directed to the screen. In the second example, stderr (stream 2) is directed
    to errors.txt whereas stdout goes to the screen. In the third example, the first
    two examples are combined. The last example directs both streams to the everything.txt
    file. To append to a file instead of overwriting it, use two greater-signs:


    ```

    $ ls /tmp >> output.txt

    ```


    If you don''t ever want to see an output stream, you can simply direct the output
    stream to a special bit bucket file (/dev/null):


    ```

    $ ls /tmp 2> /dev/null

    ```


    > TIP Another time you may want to redirect stderr when you run jobs from crontab.
    You could redirect stderr to a mail message that goes to the crontab''s owner.
    That way any error messages can be sent to the person running the job.'
