  md: '# Chapter 10: Managing the System


    # Displaying and Setting Your Hardware Clock


    Anyone can use the hwclock command to view hardware clock settings. However, you
    must have root privileges to change those settings. To use hwclock to view the
    current time from your computer''s hardware clock, use the following:


    ```

    # hwclock -r              Display current hardware clock settings

    Sun 12 Aug 2007 03:45:40 PM CDT      -0.447403 seconds

    ```


    Even if your hardware clock is set to UTC time, hwclock displays local time by
    default. If your system time strays from your hardware clock (for example, if
    you tried some of the commands shown previously), you can reset your system clock
    from your hardware clock as follows:


    ```

    # hwclock --hctys      Reset system clock from hardware clock

    ```


    Likwise if your hardware clock is incorrectly set (for example, if you replaced
    the CMOS battery on your motherboard), you can set the hardware clock from your
    system clock as follows:


    ```

    # hwclock --systohc    Reset system clock from hardware clock

    ```


    Over time your hardware clock can drift. Because the clock tends to drift the
    amount each day, hwclock can keep track of this drift time (which it does in the
    /etc/adjime file). You can adjust the hardware clock time based on the adjime
    file as follows:


    ```

    # hwclock --adjust      Adjust hardware clock time for drift

    ```


    To set the hardware clock to a specific time, you can use the --set option. Here
    is an example:


    ```

    # hwclock --set --date="3/18/08 18:22:00"      Set clock to new date/time

    ```


    In this example, the hardware clock is set to March 18, 2008 at 6:22 p.m. This
    does not immediately affect the system clock.


    # Using Network Time Protocol to Set Date/Time


    When you install SUSE or openSUSE, you are given the opportunity to set your system
    date and time. An option at time is to use preconfigured Network Time Protocol
    (NTP) servers to automatically get the current date and time when your system
    reboots. If you choose that option, the installer will set up the ntpd daemon
    (part of the xnt package) and use it to keep your time synchronized.


    184'
