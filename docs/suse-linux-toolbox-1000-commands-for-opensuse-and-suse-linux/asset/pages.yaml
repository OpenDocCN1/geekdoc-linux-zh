  md: '# Chapter 5: Manipulating Text


    The next example replaces the first occurrences of /var/www on each line in the
    /etc/ apache2/http.conf file with /home/www. Here, you have to use quotes and
    back-slashes to escape the forward slashes so they are not interpreted as delimiters:


    ```

    $ sed ''s\/var/www\\\/home/www\\\/'' < /etc/apache2/http.conf

    ```


    You must first installed the apache2 package for the original file to be present.


    Although the forward slash is sed''s default delimiter, you can change the delimiter
    to any character of choice. Changing the delimiter can make your life easier when
    the string contains slashes. For example, the previous command line that contains
    a path could be replaced with either of the following commands:


    ```

    $ sed ''s\/var/www/-/home/www/-'' < /etc/apache2/http.conf

    $ sed ''sd/var/www/D/home/www/-'' < /etc/apache2/http.conf

    ```


    In the first line, a dash (-) is used as the delimiter. In the second case, the
    letter D is the delimiter.


    The sed command can run multiple substitutions at once, by preceding each one
    with -e. Here, in the text streaming from myfile.txt, all occurrences of francois
    are changed to FRANCOIS and occurrences of chris are changed to CHRIS:


    ```

    $ sed -e s/francois/FRANCOIS/g -e s/chris/CHRIS/g < myfile.txt

    ```


    You can use sed to add newlines to a stream of text. Where <Enter> appears the
    Enter key. The > on the second line is generated by bash, not typed in.


    ```

    $ echo aaabccc | sed ''s/b\<Enter>

    > /''

    aaa

    ccc

    ```


    The trick just does not work on the left side of the sed substitution command.
    When you need to substitute newline characters, it''s easier to use the tr command.


    # Translating or Removing Characters with tr


    The tr command is an easy way to do character translations on the fly. In the
    following example, new lines are replaced with spaces, so all the files from the
    current direc- are output on one line:


    ```

    $ ls | tr ''\n'' '' ''               Replace newline characters with spaces

    ```


    The tr command can be used to replace one character with another, but does not
    work with strings like sed. The following command replaces all instances of the
    lowercase letter f with a capital F.


    ```

    $ tr f F < myfile.txt      Replace every f in the file with F

    ```'
