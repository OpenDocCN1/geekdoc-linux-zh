    # Advanced Security Features


    A dozen or so pages covering security-related commands are not nearly enough to
    address the depth of security tools available to you as a Linux system administrator.
    Beyond the commands covered in this chapter, here are descriptions of some features
    you may want to look into further securing your Linux system:


    +   AppArmor — The AppArmor feature provides a method of securing the applications
    running on your Linux system in such a way that exploitation of one application
    cannot reach other areas. For example, if intruders were to compromise your web
    daemon, they wouldn''t necessarily be to compromise the rest of the system.


    AppArmor was originally created by Immun, and then acquired by Novell. AppArmor
    is powerful and yet simpler to configure than SELinux, the computing technology
    developed by the U.S. National Security Agency (NSA) and used in the Red Hat world.
    AppArmor can be configured either via YaST or via the command line utilities in
    the apparmor-utils package.


    +   File Integrity Agent (FIA) — FIAs are a family of security tools that take
    a snapshot of all the files on your system, later use that snapshot to find any
    of


