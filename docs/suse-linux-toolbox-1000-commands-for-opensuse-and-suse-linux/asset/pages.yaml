  md: '# Chapter 8: Backups and Removable Media


    # Creating Backup Images with mkisofs


    Most data CDs and DVDs can be accessed on both Windows and Linux systems because
    they are created using the ISO9660 standard for formatting the information on
    those discs. Because most modern operating systems need to save more information
    about files and directories than the basic ISO9660 standard includes, extensions
    to that were added to contain that information.


    Using the mkisofs command, you can back up the file and directory structure from
    any point in your Linux system and produce an ISO9660 image. That image can include
    the following kinds of extensions:


    +   - Use Sharing Protocol (SUSP) records are identified in the Rock Interchange
    Protocol. SUSP records can include Unix-style attributes, such as ownership, long
    file names, and special files (such as device and symbolic links).


    +   - Joliet directory records store longer file names in a format that makes
    them usable to Windows systems.


    +   - Hierarchical File System (HFS) extensions allow the ISO to appear as an
    HFS file system, which is the native file system for Macintosh. Likewise, Data
    and Resource forks can be added in different ways to be read by Macs.


    When you set out to create your ISO image, consider where you will ultimately
    need to access the files by backing up using mkisofs (Linux, Windows, or Mac).
    Once the image is created, it can be used in different ways, the most obvious
    of which is to burn the image to a CD or DVD.


    Besides being useful in producing all or portions of a Linux file system to use
    on a portable medium, it is useful for adding boot information to the image that
    can launch a Linux kernel or other operating system, bypassing the computer''s
    hard drive.


    > NOTE Although you can still use the mkisofs command in SUSE


    Because most Linux users store their personal files in their home directories,
    a common way to use mkisofs to back up files is to back up everything under the
    /home directory. There are some examples of using mkisofs to create an ISO image
    from all files and directories under the /home directory.


    ```

    # /tmp

    # mkisofs -o home.iso /home          Create basic ISO9660 image

    # mkisofs -o home2.iso -J -R /home      Add Joliet Rock Ridge extensions

    # mkisofs -o home3.iso -J -R -hfs /home Also add HFS extensions

    ```'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Chapter 8: Backups and Removable Media


    In each of the three examples, all files and directories beneath the /home directory
    are added to the ISO image (home.iso). The first example has no extensions, so
    all file names are converted to DOS-style naming (8. characters). The second example
    uses Juliet and Ridge extensions, so file names and permissions should appear
    as they did on the original Linux system when you open the ISO on a Linux or Windows
    system. The last example also makes the files on the image readable from a Mac
    file system. You will see a warning when running this example.


    You can have multiple sources added to the image. Here are some examples:


    ```

    # mkisofs -o home.iso -R -j music/ docs/ \ Multiple directories/files chris.pdf
    /var/spool/mail \

    # mkisofs -o home.iso -R \ Graft files on the image -graft-points /var/pics/ /home/chris

    ```


    The first example shows various files and directories being combined and placed
    on the root of the ISO image. The second example grants the contents of the /var/pics
    directory into the /home/chris/Pictures directory. As on the CD image the /Pictures
    directory will contain all content from the /var/pics directory.


    Adding information about the header of the ISO can help you identify the contents
    of it later. This is especially useful if the image is saved or distributed online,
    without a physical disk you can write on. Here are some examples:


    ```

    # mkisofs -o /tmp/home.iso -R \\ Add header into ISO -p www.handsonhistory.com
    \

    -publisher "Swan Boy Art Center" \

    -V "WebBackup" \

    -A mkisofs \

    -volset "1 of 4 backups, July 30, 2007" \\

    /home/chris

    ```


    In the example, -p identifies the preparer ID, which could include a phone number,
    mailing address, or web site for contacting the preparer of the ISO image. With
    the option -publisher, you can indicate a 128-character description of the preparer
    (possibly the company or organization name). The -V indicates the volume ID. Volume
    ID is important in many Linux systems, this volume ID is used to mount the CD
    when it is inserted. For example, in the command shown above, the CD would be
    mounted on /media/WebBackup in SUSE and other Linux systems. The -A option used
    to indicate the application used to create the ISO image. The -volset option can
    contain a string of information about a set of ISO images.


    When you have created your ISO image, and before you burn it to disc, you can
    check the image and make sure you can access the files. Here are ways to check
    it out:


    ```

    # volname home.iso Display volume name

    WebBackup

    # infoiso -d i home.iso Display header information

    CD-ROM is in ISO 9660 format

    System id: LINUX

    ```


