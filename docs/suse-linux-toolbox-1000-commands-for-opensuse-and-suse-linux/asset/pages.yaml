  md: '# Chapter 5: Manipulating Text


    In this example, the rpm -qa command lists all software packages installed on
    your system and pipes that list to the sort command, to be sorted alphabetically.
    That list is piped to the pr command, which converts the single-column list into
    two columns (--columns=2) and paginates it. Finally, the less command lets you
    page through the text.


    Instead of paging the output, you can send the output to a file or to printer.
    Here are examples of that:


    ```

    $ rpm -qa | sort | --column=2 > pkg.txt

    $ rpm -qa | sort | --column=2 | lpr

    ```


    Other text manipulation you can do with the pr command includes double-spacing
    the text (-d), controlling characters (-c), or offsetting the text a certain number
    of spaces from the left margin (for example, -o 5 to indent five spaces from the
    left).


    # Searching for Text with grep


    The grep command is handy when you need to perform more advanced string searches
    in a file. In fact, the phrase to grep has actually entered the computer jargon
    as a verb, just as Google has entered the popular language. Here are examples
    of the grep command:


    ```

    $ grep francois myfile.txt

    $ grep 404 /var/log/apache2/*

    $ ps auxw | grep init

    $ ps auxw | grep "[a]*"

    $ dmesg | grep "[ata]*|ata"

    ```


    Show lines containing francois

    Show lines containing 404, if you installed the apache2 web server

    Show init lines from ps output

    Show bracketed commands

    Show ata kernel device information


    The command lines just shown have some particular uses, beyond being examples
    of the grep command. By searching apache 404 you can see requests to web server
    for pages that were not found; these could be someone fishing to exploit your
    system, or a page you moved or forgot. (You must install a web server as apache2
    first.) Displaying bracketed commands that are output from the ps command is a
    way to see commands for which ps cannot display options. The last command checks
    the kernel buffer ring for any ATA device information, such as hard disks and
    CD-ROM drives.


    The grep command can also recursively search a few or a lot of files at the same
    time. The following command recursively searches files in the /etc/apache2 directory
    for the string VirtualHost:


    ```

    $ grep -R VirtualHost /etc/apache2/

    ```


    Add lines (-n) to your grep command to find the exact lines where the search terms
    occur:


    ```

    $ grep -Rn VirtualHost /etc/apache2/

    ```


