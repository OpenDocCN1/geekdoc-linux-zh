    # Troubleshooting Network Problems


    Troubleshooting networks is generally done from the bottom layer up. As discussed

    at beginning of the chapter the first step is to make sure that the physical network

    layer components (cables, NICs, and so on) are connected and working. Next, check

    the links between physical nodes are working. After that, there are lots of tools

    for checking connectivity to a particular host.


    # Checking Connectivity to a Host


    Once you have a link and no duplex mismatch, the next step is ping to

    your default gateway. You should have configured the default gateway (gw) in

    the /etc/sysconfig/network file or in the individual network card''s /etc/

    sysconfig/network-script/? Check your default gateway in the

    actual routing table, use the ip command as follows:


    ```

    # ip route

    10.0.0.0/24 dev eth0 proto kernel scope link src 10.0.0.1

    169.254.0.0/16 dev eth0 metric scope link

    default via 10.0.0.1 dev eth0

    ```


    The gateway for the default route is 10.0.0.1. To make sure there is IP connectivity
    to gate-

    use the ping command as follows:


    ```

    $ ping 10.0.0.1

    64 bytes from 10.0.0.1: (10.0.0.1) 56(84) bytes of data.

    icmp_seq=1 ttl=64 time=0.382 ms

    64 bytes from 10.0.0.1: icmp_seq=2 ttl=64 time=0.313 ms

    64 bytes from 10.0.0.1: icmp_seq=3 ttl=64 time=0.360 ms

    64 bytes from 10.0.0.1: icmp_seq=4 ttl=64 time=1.43 ms

    ```'
