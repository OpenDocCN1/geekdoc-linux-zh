    or other day. The user is.


    In other words, the book is meant to be a companion as you work on openSUSE or
    SUSE Linux Enterprise operating system. Depending on your version, those systems
    are available for some or all of the following computer architectures: x86, AMD64,
    Intel64, and IBM POWER (formerly known as PowerPC). If you don''t already have
    openSUSE or SUSE Linux Enterprise installed, refer to Chapter 2 for information
    on getting and installing those systems.


    All of the commands in this book have been tested against openSUSE on x86 or x86_64
    architecture. However, because many of these commands have been around for a long
    time (some dating back over 30 years to the original Unix days), will work exactly
    as described here on SUSE Linux Enterprise systems, regardless of CPU architecture.


    Many of the commands described in this book will work on other Linux and Unix
    systems as well. Because this book focuses on SUSE distributions, descriptions
    will differ from other Linux systems prominently in the areas of packaging, installation,
