  md: "# Chapter 14: Locking Down Security\n\nyour computer as a mail server (with\
    \ sendmail, postfix, or other SMTP service). The second example creates a nat\
    \ table ruling to allow the firewall to do Source Network Address Translation\
    \ (SNAT). The SNAT feature lets you have IP addresses behind your firewall that\
    \ can communicate to the public Internet using the firewall's external IP.\n\n\
    To use SNAT or any other form of NAT, you must also enable IP forwarding on the\
    \ machine. This can be done using either of the following commands:\n\n```\n#\
    \ echo 1 > /proc/sys/nat/ipv4/forward    Allow port forwarding\n# sysctl -w net.ipv4.forwarding=1\
    \      Same as above\n```\n\nIn cases where you have an Internet-facing service\
    \ offered behind your firewall, you can instruct the firewall to forward requests\
    \ for that service to that machine. The following example uses a feature called\
    \ port forwarding to pass requests for a service through the firewall to the destination\
    \ machine:\n\n```\n# iptables -t nat -A PRERUTING \\ Add nat PRERUTING rule\n\
    \ -p tcp -d 11.22.33.1 \\ accepts tcp requests on 11.22.33.1\n --dport 80 \\ for\
    \ port 80 (Web service)\n -j DNAT \\ jump to the DNAT target\n --destination 10.0.0.2\
    \ \\ forward those packets to 10.0.0.2\n```\n\nThere are many other types of rules\
    \ you can create to change how your firewall behaves. Refer to the iptables man\
    \ or the Netfilter web site (www.netfilter.org) for further information on using\
    \ the iptables facility.\n\n# Working with System Logs\n\nMost Linux systems are\
    \ configured to log many of the activities that occur on those systems. These\
    \ activities are written to log files in the /var/log directory or its subdirectories.\
    \ This logging is done by the Syslog facility.\n\nOpenSUSE uses syslog (next generation\
    \ system log daemon) and klog (kernel log daemon) to manage system logging. Those\
    \ daemons are started automatically from the syslog init script (/etc/init.d/syslog).\
    \ Information about system activity is directed to files in the /var/log directory\
    \ such as messages, warn, and mail, based on settings in the /etc/syslog/syslog-conf\
    \ file.\n\nAutomatic log rotation is handled by logrotate, based on settings in\
