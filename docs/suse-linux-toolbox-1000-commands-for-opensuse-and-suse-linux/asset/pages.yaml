    # Building RPMs from SRPMs


    By rebuilding the source code that is used to build an RPM package, you can change
    it to better suit the way you use the software. Begin, you need to get the source
    RPMs (SRPMs) you want to modify and install the rpm-devel package (zypper install-devel).


    For example, you could download and rebuild the BashBurn SRPM package in the current
    directory by typing the following:


    ```

    $ wget

    http://packman.iu-bremen.de/suse/10.3/src/BashBurn-2.1.1-0-pm.1.src.rpm

    $ rpm --rebuild BashBurn-2.1.1-0-pm.1.src.rpm

