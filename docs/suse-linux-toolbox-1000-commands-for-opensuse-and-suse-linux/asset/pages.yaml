    | $ gzip -lv myfile.gz | Get detailed info about gzip file |

    | method crc date time | compressed uncompressed ratio uncompressed_name |

    | defla 07d29e4 Jul 10 04:48 | 46785 | 334045 | 86.0% | myfile |


    Use one of the following commands to compress all files in a directory:


    ```

    $ gzip -rv mydir All files in a directory

    midir/file: 39.1% -- replaced with mydir/file1.gz

    midir/file: 39.5% -- replaced with mydir/file2.gz

    $ gzip -1 Fastest compression time, least compression

    $ gzip -9 Slowest compression, most compression

