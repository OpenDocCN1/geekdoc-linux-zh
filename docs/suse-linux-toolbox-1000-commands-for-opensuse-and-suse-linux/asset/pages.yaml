  md: '# Chapter 10: Managing the System


    When an init script is added to /etc/init.d, chconfig needs to be aware of its
    existence. This is done automatically when the new init script is part of rpm,
    and needs to be done manually if you add your own init scripts. To do so, running
    the following:


