    To check your swap area for bad blocks, use the -c option to mkswap:


    ```

    # mkswap -c /dev/sda

    ```


    If you don''t have a spare partition, you can create a swap area within a file:


    ```

    # dd if=/dev/zero of=/tmp/swapfile count=65536

