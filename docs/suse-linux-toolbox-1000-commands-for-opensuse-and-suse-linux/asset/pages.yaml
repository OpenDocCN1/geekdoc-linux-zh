  md: '# Chapter 2: Installing openSUSE and Adding Software


    If you search for something more generic, you''ll see that zypper searches across
    all enabled repositories, and reports back with the packages and repositories
    where the search query was found:


    ```

    # zypper se util

    * Reading installed packages [100%]


    S | Repository      | Type     | Version      | Arch

    +--------------------+------+----------------+-------

    v | openSUSE-10.3... | package | alsa-utils   | 1.0.14-25 | 1586

    i | http://downlo... | package | alsa-utils   | 1.0.14-25 | 1586

    v | testcdrom        | package | alsa-utils   | 1.0.14-25 | 1586

    | openSUSE-10.3... | package | apache2-utils...| 2.2.6-66 | 1586

    | http://downlo... | package | apache2-utils...| 2.2.4-70 | 1586

    ```


    In the first column of the output is the status. Av or i indicates that another
    version of the package is installed, or the package, as listed, is already installed.
    The second column shows in which Zypper repository the search word was found.
    The Type shows the type of resolvable line refers to. Name and Version or Arch
    lists whether this package is compiled for a specific system architecture.


    Zypper uses called resolvables to designate the different types of resources you
    want to work with. A resolvable can be a package, patch, pattern, language, or
    product. You can select the different types of resolvables using the -t flag along
    with the resource you want to act on:


    ```

    # zypper se -t patch

    S | Repository      | Type   | Version      | Arch

    +--------------------+------+----------------+-------

    | openSUSE-10.3... | patch | fetchmstftont... | 4347-0 | noarch

    i | patch | update-test-a... | 2609-0 | noarch

    ```


    To limit the patch to a specific piece of software, you could add a search pattern
    to the zypper command:


    ```

    # zypper se -t patch mstfont

    * Reading installed packages [100%]


    S | Repository             | Type   | Version                          | Arch

    +--------------------------------+--------------------------------+-------

    | openSUSE-10.3-Updates... | patch | fetchmstftfonts.sh | 4347-0 | noarch

    ```'
