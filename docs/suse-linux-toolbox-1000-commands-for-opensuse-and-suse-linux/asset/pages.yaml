- img_proc: true
  md: '# Chapter 11: Managing Network Connections


    The Network Card window (select Network Devices from the YaST Control Center)
    offers a GUI for configuring your network interface, network hardware, DNS servers,
    host list, and even IPsec private networks. You can configure both dynamic (DHCP,
    bootp) and static IP addresses. You can set up static network routes.


    In cases, your network interfaces may not be working. Likewise, there may be ways
    to work with your network interfaces that are not supported by the GUI. For those
    cases, the following sections describe how to work with your network interfaces
    from the command line.


    # Managing Network Interface Cards


    If the network hardware on your computer didn''t immediately come up and let you
    connect to the Internet, there are some steps you should go through to troubleshoot
    the problem:


    +   - Check that your network interface card (NIC) is properly installed and that
    the cable is connected to your network (ISP''s CPE, and so on).

    - After the cable is connected, make sure you have a link with no speed or duplex
    mismatches.

    - If all else fails, consider replacing your NIC with known-good spare to isolate
    a hardware failure.


    To check your link from Linux, and to set speed and duplex, use ethtool (ethtool
    package). Use ethtool unless you have a very old NIC and NIC driver that are not
    compatible with the ethtool command.


    > NOTE Older versions of Linux provide a tool call mii-tool, which is not supported
    on SUSE.


    To view the syntax of the ethtool command, type the following:


    ```

    # ethtool -2|i | View options to the ethtool command

    ```


    The ethtool command outputs its built-in help to stderr. To be able to page through
    that with less, redirect stderr to stdout.


    To display settings for a specific Ethernet card, add the interface name to the
    command. For example, use card information for eth0, type:


    ```

    # ethtool eth0 See settings for NIC at eth0

    Settings for eth0:

    Supported ports: [ TP MII ] 10baseT/Half 10baseT/Full

    Supported link modes: 100baseT/Half 100baseT/Full

    ```'
