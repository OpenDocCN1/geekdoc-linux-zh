  md: "# Chapter 9: Checking and Managing Running Processes\n\nThe kill command can\
    \ send signals to processes by ID or job number the killall command can send signals\
    \ by command name. Here are some examples:\n\n```\n$ kill 28665 Send SIGTERM to\
    \ process with PID 28665\n$ kill -9 4895 SIGKILL to process with PID 4895\n$ kill\
    \ -SIGCONT 5254 Continue a stopped process (pid 5254)\n$ kill %3 Kill the process\
    \ represented by job #3\n$ killall spamd Kill all daemons currently running\n\
    $ killall -SIGHUP sendmail Have 자신이 reread config files\n```\n\nThe SIGKILL (signal),\
    \ used by trigger-happy novice administrators, should be reserved as a last resort.\
    \ It does not allow the process to exit cleanly but forces it to abruptly. This\
    \ can potentially result in loss or corruption of data handled by that process.\
    \ The SIGHUP signal was originally used on Unix systems to indicate that a terminal\
    \ was disconnected from a mainframe (such as from a hang-up of a dial-in modem).\
    \ However, daemon processes, such as sendmail and httpd, implemented to catch\
    \ SIGHUP signals as indication that those processes should reread configuration\
    \ files.\n\n# Running Processes Away from the Current Shell\n\nIf you want a process\
    \ to continue to run, even if you disconnect from the current shell session, there\
    \ are several ways to go about that. You can use the nohup command to run a process\
    \ in a way that is impervious to a hang-up signal:\n\n```\n$ nohup updatedb &\
    \ Run with no ability to interrupt\n# nohup nice -9 gcc hello.c & Run gcc uninterrupted\
    \ and higher priority\n```\n\nUsing nohup is different than running the command\
    \ with an ampersand alone because nohup the command will keep running, even if\
    \ you exit the shell that launched the command.\n\nThe nohup command was commonly\
    \ used in the day of slow processes and dial-up connections (so you didn't have\
    \ to stay logged in an expensive connection while a long compile completed). Also,\
    \ today using tools such as screen (described in Chapter 14) you can keep a session\
    \ active, even after you disconnect your network-connection to that shell.\n\n\
    # Scheduling Processes to Run\n\nCommands associated with the cron facility can\
    \ be used to set a command to run at a specific time (including now) so that it\
    \ is not connected to the current shell. The at runs a command at the time you\
    \ want:\n\n```\n$ at +1 min Start command running in one minute\nat> updatedb\
    \ <Ctrl+d> \njob 5 at Mon Aug 20 20:37:00 2007\n$ at teatime Start command at\
    \ 4pm today\n$ at +5 days Start a command in five days\n$ at 06/25/08 Start a\
    \ command at current time on June 25, 2008\n```"
