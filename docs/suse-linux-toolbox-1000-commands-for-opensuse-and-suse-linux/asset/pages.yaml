  md: '# Chapter 5: Manipulating Text


    A regex search pattern can include a specific string of text (as in a word as
    Linux) or a location (such as the end of a line or the beginning of a word). It
    can also be specific (just find the hello) or more inclusive (find any word beginning
    with h and ending with o).


    Appendix C includes reference information for shell metacharacters that can be
    used in conjunction with regular expressions to do the kind of matches you are
    looking for. This section shows examples of using regular expressions with several
    different tools you encounter throughout this chapter.


    Table 5-1 shows some examples using basic regular expressions to match text strings.


    Many examples of regular expressions are used in examples throughout this chapter.
    Keep in mind that not every command that incorporates regex uses its features
    the same way.


    | Expression | Matches |

    | --- | --- |

    | a* | a, ab, abc, and aecjeich |

    | ^a | Any “a” appearing at the beginning of a line |

    | *a$ | Any “a” appearing at the end of a line |

    | a.c | Three-character strings that begin with a and end with c |

    | [bcf]at | bat, cat, dat, but not Aat, Bat, etc. |

    | [a-d]at | aat, bat, cat, dat, but not Aat, Bat, etc. |

    | [A-D]at | Aat, Bat, Cat, and Dat, but not aat, etc. |

    | 1[3-5]7 | 137, 147, and 157 |

    | \Hello | A tab character preceding the word Hello |

    | \. [Tt] [xX] [Tt] | .txt, .TxT, .Txt, or other case combinations |


