    most basic ways of performing a task. More complex operations require options
    that are only available from the command line.


    +   - GUI is broken or not installed — If no graphical interface is available,
    or if the installed GUI is not working properly, you may be forced to work from
    the command line. Broken GUIs can help for lots of reasons, such as when you use
