  md: '# Chapter 9: Checking and Managing Running Processes


    Another way to run a command that''s not connected with the current shell is with
    the batch command. With batch, you can set a command to start as soon as the processor
    is ready (load average below8):


    ```

    $ batch

    Start command running immediately

    at> find /mnt/isos | grep jpg$ > /tmp/mypics

    at> <Ctrl+d> <EOT>

    ```


    After that or at commands you will see a secondary at> prompt. Type the command
    you want to run at that prompt and press Enter. After that, you can continue to
    enter commands. When you are done, press Ctrl+d on a line by itself to queue the
    commands you entered to run.


    After the commands are entered, you can check the queue of jobs that are set to
    run by typing the at command:


    ```

    $ atq

    Wed Sep 5 21:10:00 2007 a francois

    11

    Fri Aug 24 21:10:00 2007 a francois

    10

    8 Thu Aug 23 20:53:00 2007 a francois

    ```


    Regular users can only see their own jobs that are queued. The root user can see
    everyone''s queued jobs. If you want to delete an job from the queue, use the
    atm command:


    ```

    $ atm 11

    Delete at job number 11

    ```


    The at and batch commands are for queuing a command to run as a one-shot deal.
    You can use the cron facility to set up commands to run repeatedly. These commands
    are scripted into cron jobs which are scheduled in crontab files. There is one
    system crontab file (/etc/crontab). Also, each user can create a personal crontab
    file. To create a personal crontab file, type the following:


    ```

    $ crontab -e

    Create a personal crontab file

    ```


    The crontab -e opens your crontab file (or creates a new one) using the vi editor.
    Here are examples of several lines you could add to your crontab:


    ```

    * * Mon,Tue,Wed,Thu,Fri mail chris < /var/project/stats.txt

    * * 1,4,7,10 * find / grep .doc$ > /var/sales/documents.txt

    ```


    The first crontab example shows a named user chris by directing the contents of
    /var/project/stats.txt into that message. Mail command is run Monday through Friday
    at 8:15 a.m. In the second example, on the first day of January, April, July,
    and October, the find command looks for every .doc file on the system and saves
    the listing of files to /var/sales/documents.txt.'
