    # Changing Running Processes


    Even a process is running, you can change its behavior in different ways. With
    the renice command, earlier, you can adjust a process''s priority in your system''s
    scheduler. With the nice command, you can determine the default priority and set
    a higher or lower priority at the time you launch a process.


    Another way you can change how a running process behaves is to send a signal to
    that process. The kill and killall commands can be used to send signals to running
    processes. Likewise, the kill command can send a signal to a process.


    # Adjusting Processor Priority with nice


    Every process has a nice value that can be used to tell the Linux process scheduler
    what priority should be given to that process. Positive values of niceness give
    your process a lower priority. The concept came about during the days of long


    Niceness doesn''t enforce scheduling priority, but is merely a suggestion to the
    scheduler. To see your nice value, you can type the nice command with no options:


    ```

    $ nice                        Run nice to determine current niceness

    0

    ```'
