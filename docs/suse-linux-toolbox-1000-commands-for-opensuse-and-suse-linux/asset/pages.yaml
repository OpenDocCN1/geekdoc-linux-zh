    Use specific UID and GID for user

    Create /var/xjj home directory

    Add user to support and sales groups

    Add user''s full name to comment field

    Assign a new default shell (tcsch)

    Add account to expire April 01, 2008

    Create a disabled account

    Keep user from shelling in

    Create a user without creating his home dir


    The example with -e is useful for setting an expiration date for a user that you
    know to be temporary. Change the default shell to nologin when you want to be
    able to access the computer (via FTP, POP3, and so on), but you don''t want to
    allow access to a regular Linux shell. Likewise, the last example might allow
    a user to access a machine, but not have a home directory.


    Before you add a user to a group, that group must exist (see the group command
    section later in this chapter). A user must belong to one initial group that can
    be defined with -g and can also belong to supplementary groups, defined with -G.


    To list the group(s) that a user belongs to, use the groups command:


    ```

    $ groups francois

    users dialout video

    ```


    # Changing useradd Defaults


    The default values you get when you create a new user account with useradd (default
    shell, GID, expire dates, and so on) are set by values in the /etc/login.defs
    and /etc/command/useradd files. You can edit these values to change defaults or
    run the useradd command with the -D option to list or select values:


    ```

    # useradd -D

    # useradd -D -b /home2 -s /bin/bash

    # useradd -D -e 2009-01-01

    ```


    List default settings for useradd

    Set default base dir and shell

    Set new users expire in 2009


    As noted, files and directories from the /etc/skel directory are copied to create
    the new user''s home directory when the account is created. These files include
    some shell files and configuration files in the .kde directory. You can add other
    files and directories to /etc/skel so that each new user gets them. For example,
    if you are configuring a web server, you might create public_html and public_ftp
    directories for users to add web pages and files they want to share.


