    # # Mounting File Systems with the mount command


    The mount command is used to view mounted file systems, as well as may mount any
    (hard disk, USB drive, CD, DVD, and so on) to remote (NFS, Samba, and so on) file
    systems. Here is an example of the mount command for listing file systems:


    ```

    $ List mounted remote and local file systems

    /dev/sda on / type ext3 (rw,acl,user_xattr)

    proc on /proc type proc (rw)

    sysfs on /sys type sysfs (rw)

    devpts on /dev/pts type devpts (rw,mode=0620,gid=5)

    /dev/sda6 on /mnt/debian type ext3 (rw)

    /dev/sda3 on /mnt/slackware type ext3 (rw)

    tmpfs on /dev/sh type tmpfs (rw)

    none on /proc/sys/fs/binfmt_misc type binfmt_misc (rw)

    sunprpc on /var/lib/nfs/rpc_pipes type rpc_pipes (rw)

    ```


    Use the -t option to list mounts of a specific file system type:


    ```

    $ mount -t ext3 List mounted ext3 file systems

    /dev/sda7 on / type ext3 (rw,acl,user_xattr)

    /dev/sda6 on /mnt/debian type ext3 (rw) [/mnt/debian]

    /dev/sda3 on /mnt/slackware type ext3 (rw) [/mnt/slackware]

    ```


    To display labels with mount information, use the -l option:


    ```

    $ mount -t ext3 -l List mounted ext3 file systems and labels

    /dev/sda7 on / type ext3 (rw) [/123]

    /dev/sda6 on /mnt/debian type ext3 (rw) [/mnt/debian]

    /dev/sda3 on /mnt/slackware type ext3 (rw) [/mnt/slackware]

    ```'
