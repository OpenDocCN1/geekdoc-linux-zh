  md: '# Introduction


    After you''ve had some experience with Linux, you don''t need someone telling
    you to click the Help button for help or drag a file to the Trash to delete it.
    What you need is a reference book that shows you powerful commands and options
    that you take hold of your Linux system, as well as the processes, users, storage
    media, network resources, and system services associated with it.


    SUSE Linux Toolbox provides you with more than 1000 specific command lines to
    help you become a Linux power user. Whether you are a systems administrator or
    desktop user, the book will show you commands to create file systems, troubleshoot,
    lock down security, and dig out almost anything you care to know about your Linux.


    This book''s focus for your Linux command-line journey is openSE, the community-based
    Linux distribution sponsored by Novell, Inc. and SUSE Linux Enterprise. Tapping
    into the skills needed to run those systems can help you to work with your own
    Linux systems and to learn what you need as a Linux professional.


    # Novell''s Bold Move with SUSE


    Novell, Inc., which develops SUSE Linux systems, shook the free and open source
    software in 2006 when it entered into a cooperative agreement with Microsoft.
    That agreement promised to protect each of the two companies'' customers from
    patent-related lawsuits that could arise from the other company''s patent portfolios,
    while threatening to set a precedent for a Microsoft tax on thousands of installed
    Linux systems in existence today.


    The agreement also brought with it the probability that thousands of SUSE installations
    would make their way into locations that were once exclusively Microsoft shops.
    Linux systems that were touted as evil, broken, incompatible, "just a toy," or
    stolen from honest commercial software developers is, in one wave of the had,
    just for the Microsoft faithful to use . . . as long as they choose Novell''s
    SUSE systems.


    Despite the fact that Microsoft has not contributed code to Linux, the alliance
    between Novell and Microsoft has made only SUSE Linux customers safe from Microsoft''s
    lawsuit threats (and only for a limited time). This has angered many and open
    source software developers to the point where they will no longer have anything
    to do with SUSE.


    With this book, however, we are taking a different approach.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction


    The authors of this book will not try to break your operating system, charge you
    a tax for the work we have put into Linux, or even persuade you not to use SUSE.
    That''s not how we have ever done business and is not how we are going to do it
    now.


    Instead, we will teach you Linux. For today, we will help you keep your job and
    thrive in your Linux environment. If some day SUSE becomes less relevant, you
    will still need the power and flexibility that the free and open source software
    movement affords (which is today best reflected in Linux), you will have the skills
    you need to move forward.


    Make no mistake about it. This is Linux book for professionals or serious hobbyists.
    Linux is a powerful, network-enabled, multi-user, multitasking operating system.
    It is built from the ground up for security and interoperability. Microsoft''s
    alliance has connected many of its customers need Linux. It''s time for you to
    see how it works as a power user.


    In this book, you will get the commands to master your SUSE Linux systems. Most
    of those skills will translate to other Linux systems as well, you will have the
    freedom to use those systems as Ubuntu, Fedora, Slackware, Gentoo, Red Hat Enterprise
    Linux, or any other Linux you choose. So, even if your employer or software vendor
    boxes you contractually to SUSE, it will not box in your mind.


    Your teachers in this endeavor are no couple of latecomers to this newfound Microsoft/Novell
    Linux. Our credentials reflect more than 40 years experience with Linux systems
    and the Unix systems on which they were based. You will learn from those who have
    used Linux for years and are willing to bring you into it, for whatever reason
    you have been drawn to Linux.


    # Who Should Read This Book


    This book is for anyone who wants to access the power of a Linux system as a systems
    administrator or user. You may be a Linux enthusiast, a Linux professional, or
    possibly a computer professional who is increasingly finding the Windows systems
    in your data center supplanted by Linux boxes.


    The bottom line is that you who want to find quick and efficient ways of getting
    openSUSE and SUSE Linux Enterprise systems working at peak performance. Those
    systems may be a few desktop systems at work, a file and print server at your
    school, or a home Web server that you''re doing just for fun.


    In the best case, you should already have some experience with Linux. However,
    if you are a computer professional with skills managing other types of operating
    systems, such as Windows, you should be able to easily adapt your knowledge to
    be able to use the specific commands we cover in the book.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Introduction


    # # What This Book Covers


    This is not a beginner''s Linux book. Before you jump in, it would be best if
    you have a basic working knowledge of what Linux, how the shell works, and what
    processes, file systems, and network interfaces are. The book will then supplement
    that knowledge-edge information you need to do the following activities:


    +   - Get software — USE offers the YaST Package Manager GUI tool for getting
    software. With tools like `rpm`, you''ll learn the best ways to search, download-install,
    update, and otherwise manage software from the command line.

    - Use the shell — Find techniques and tips for using the shell.

    - Play with multimedia — Play and stream multimedia content from your computer.
    You can also modify audio and image files, and then convert the content of those
    to different formats.

    - Work with files — Use, manipulate, convert, and secure a wide range of file
    types in Linux.

    - Admin file systems — Access, format, partition, and monitor your file storage
    hardware (hard disks, CD/DVD drives, floppy disks, USB flash drives, and so on).
    Then create, format and check the file systems that exist on those hardware.

    - Backup and restore data — Use simple commands to gather, archive, and compress
    your files into efficient backup archives. Store those archives locally or on
    remote computers.

    - Work with processes — List running processes in a variety of ways, such as CPU
    use, process user, or process ID. Change running processes to have them run in
    the background or foreground. Send signals to processes to have them re-read configuration
    files, stop and resume processing, or stop completely (abort).

    - Manage the system — Run commands to check system resources, such as memory usage,
    run levels, boot loaders, and kernel modules.

    - Monitor networks — Bring wired, wireless, and dial-up network connections up
    and down. Check routing, DNS, and host information. Keep an eye on network traffic.

    - Get network resources — Connect to Linux and Windows remote file systems using
    FTP, NFS and Samba facilities. Use shell-based commands to browse the web.

    - Do remote administration — Access and administer computers using remote login
    (ssh, telnet, and so on), and screen. Learn about remote administration interfaces,
    such as Webmin, SWAT, and CUPS.

    - Lock down security — Set up firewalls and system logging to secure your Linux
    systems.

    - Get reference information — Use the appendices at the end of this book to get
    more information about the shell (such as metacharacters and shell variables)
    and the state of the system (/proc/).'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Introduction


    Hopefully, if we have done it right, it will be easier to use this book than to
    Google

    the command lines or GUI tools you need.


    Once you have mastered many of the features described in this book, you''ll have

    gained the following advantages:


    +   - Hundreds of commands — By compressing a lot of information into a small
    space,

    you will have access to useful commands, in over 1000 command lines,

    in a handy form to carry with you.


    +   - Critical Linux information — This book lists connections to the most critical
    infor-\mation the Web for seeking with Linux, in general, and SUSE, in particular.


    +   - Transferable knowledge — Most of the commands and options you use in

    SUSE will work exactly the same way on other Linux systems. Different Linux

    distributions, on the other hand, offer different graphical administration tools.

    and even within a particular distribution, graphical tools change more than

    commands.


    +   - Quick solving — By the times you have started up a desktop and

    lunched a graphical administration tool, you will have already run a half dozen

    commands and solved the problem.


