    As shown in the preceding example, with the +i option set, the grub.conf file
    becomes immutable, meaning it cannot be deleted, renamed or changed or have a
    link created to it. This prevents any arbitrary changes to the grub.conf file
    (Not even the root user can change the file until the i attribute is gone.)


    The -R option in the example recursively sets the +A option, so all files in the
    directory below have access times (a time record) modified. Setting attributes
    can save some disk I/O on laptops or flash drives. If you use the dump command
    to back up your ext2/ext3 file systems, the +d option can prevent selected files
    from being backed up. In this case, we chose not to have a large ISO image backed
    up.


    To remove an attribute with chatter, use the minus sign (-). For example:


    ```

    # chatter -i /etc/grub.conf

    ```


    > NOTE Crackers who successfully break into a machine will often replace some
    binaries (such as ls or ps) with corrupt versions and make them immutable. It''s
    a good idea to occasionally check the attributes for your executables (in /bin,
    /usr/bin, /sbin, and /usr/sbin, for example).


    # Searching for Files


    SUSE uses a database of all files in the file system (with a few exceptions defined
    in /etc/sysconfig/locate) using features of the findutils-locate package. The
    locate command allows you to search that database. The results come back instantly,
    since the database is searched and not the actual file system. Before locate was
    available, most Linux users run the find command to find files in the file system.
    Both locate and find are covered here.'
