  md: '# Chapter 13: Doing Remote System Administration


    # Accessing SSH on a Different Port


    For security purposes, a remote host may have its SSH listening on a different
    port than the default port number 22. If that is the case, use -p option to `ssh`
    to connect to that service:


    ```

    $ ssh -p 12345 francois@turbosphere.com    Connect to SSH on port 12345

    ```


    # Using SSH to Do Tunneling (X11 Port Forwarding)


    With SSH tunneling configured as described earlier, the SSH service forwards Window
    System clients to your local display. However, tunneling can be used with other
    TCP-based protocols as well.


    # Tunneling for X11 Clients


    The following sequence of commands illustrates starting an SSH session, then starting
    a few applications as they operate on the local device:


    ```

    $ francois@myserver      Start ssh connection to myserver

    francois@myserver''s password: ******

    [francois@myserver ~] echo $DISPLAY Show the current X display entry

    localhost:10.0             SSH sets display to localhost:10.0

    [francois@myserver ~] xecho         Show moving desktop eyes

    [francois@myserver ~] xterm          Launch basic terminal

    [francois@myserver ~] konsole&     Launch KDE terminal

    ```


    # Tunneling for CUPS Printing Remote Administration


    X11 is not the only protocol that can be tunneled over SSH. You can forward any
    TCP port with SSH. This is a great way to configure secure tunnels quickly and
    easily. No configuration is required on the server side.


    For example, myserver is a print server for the CUPS printing service''s web-based
    interface enabled (running on port 631). That GUI is only accessible from the
    local machine. On my client PC, I tunnel that service using ssh with the following
    options:


    ```

    $ ssh -L 1234:localhost:631 myserver

    ```


    This example forwards port 1234 on your client PC to localhost port 631 on the
    server. We can now browse to http://localhost:1234 on the client PC. This will
