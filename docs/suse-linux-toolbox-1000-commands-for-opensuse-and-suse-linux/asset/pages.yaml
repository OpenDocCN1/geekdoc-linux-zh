  md: '# Chapter 2: Installing openSUSE and Adding Software


    The zypper utility is designed to be compatible with the Novell Rug (Red Carpet
    updater) and ZENworks software management systems, but does not require the ZLM
    daemon to be running in order. Furthermore, zypper does not use the ZENworks zm2
    database, so Novell recommends not use zypper with ZENworks. This leaves a lighter
    footprint on system resources as well as fewer requirements for managing your
    software.


    Zypper can be used to search for, install, remove, and update software packages
    as well as manage installation sources called repositories. Zypper offers a powerful
    way of managing software, the same as APT for Debian and the Yum unit for Fedora
    and Red Hat Linux systems. What follows are useful ways of managing software on
    openSUSE using the zypper utility.


    # Working with zypper Repositories


    When you define a repository, zypper holds a configuration that tells zypper where
    to find software to work with. If you have configured locations like YaST, zypper
    will use them as well as other installation sources you have configured through
    aptRPM, local file sources, and most ZENworks management systems. You can use
    zypper to list, add, rename and delete repositories. Table 2-5 shows the commands
    needed for managing zypper repositories, along with shortcut abbreviations for
    the commands. Also, keep in mind that command line help can be obtained by typing
    zypper -h at the command line.


    Table 2-5: Managing zypper Repositories


    | zypper Command | Abbreviation | Description |

    |---|---||

    | addrepo | ar | Adds a new repository. You will need to provide a URI for the
    install source as well as a name for it. |

    | removerepo | rr | Removes a repository. |

