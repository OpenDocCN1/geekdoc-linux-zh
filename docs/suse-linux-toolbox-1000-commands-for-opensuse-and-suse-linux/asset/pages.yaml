- img_proc: true
  md: '# Chapter 11: Managing Network Connections


    The numbers shown above are replaced by real IP addresses of computers that serve
    as DNS name servers. Once you can connect to working DNS servers, there are commands
    you can use to query those servers and look up host computers.


    The dig command (which should be used instead of the deprecated nslookup command)
    can be used to look up information from a DNS server. The host command can be
    used to look up address information for a hostname or domain name.


    To search your DNS servers for a popular host name (www.turbosphere.com in in
    the following examples), use the dig command as follows:


    ```

    $ dig www.turbosphere.com    Search DNS servers set in /etc/resolv.conf

    ```


    Instead of using your assigned name server, you can query a specific name server.
    The following example queries the DNS server at 4.2.2.1:


    ```

    $ dig www.turbosphere.com @4.2.2.1

    ```


    Using dig, you can also query for a specific record type:


    ```

    $ dig turbosphere.com mx    Queries for the mail exchanger

    $ dig turbosphere.com ns      Queries for the authoritative name servers

    ```


    Use the +trace to trace a recursive query from the top-level DNS servers down
    to the authoritative servers:


    ```

    $ dig +trace www.turbosphere.com    Recursively trace DNS servers

    ```


    If you want to see the IP address of a host computer, use the +short option:


    ```

    $ dig +short www.turbosphere.com    Display only name/IP address pair

    turbosphere.com.

    66.113.99.70

    ```


    You can use dig to perform a reverse lookup to find DNS information based on an
    IP address:


    ```

    $ dig -x 66.113.99.70          Get DNS information based on IP address

    ```


    You can use host to perform a reverse DNS lookup as well:


    ```

    $ host 66.113.99.70

    70.99.133.66-in-addr.ptr domain name pointer boost.turbosphere.com.

    ```


    To get hostname information for the local machine, use the hostname and dnsdomainname
    commands:


    ```

    $ hostname                    View the local computer''s full DNS host name

    boost.turbosphere.com

    $ host -s                     View the local computer''s short host name

    boost

    ```'
