  md: '# Chapter 5: Manipulating Text


    # Paging Through Text


    When you have a large chunk of text and need to get to more than just its beginning
    or end, you need a tool to page through the text. The original Unix system pager
    was the more command:


    ```

    $ ps auxw | more

    $ myfile.txt      Page through the contents of a file

    ```


    However, more has some limitations. For example, in the example with ps above,
    more could not scroll up. The less command was created as a more powerful and
    user-friendly more. The common saying when less was introduced: “What is less
    less is more!” We recommend you no longer use more, and use less instead.


    > NOTE less has another benefit worth noting. Unlike text editors such as vi,
    it does not read the entire file when it starts. This results in faster start-up
    times when viewing large files.


    The less command can be used with the same syntax as in the examples above:


    ```

    $ ps auxw | less      Page through the output of ps

    $ myfile.txt | less    Page through the contents of a file

    $ myfile.txt         Page through a text file

    ```


    The less allows you to navigate using up and down arrows, PageUp, PageDown, and
    the spacebar. If you are using less on a file (not standard input), press p to
    open the current file in vi. The editor used by less comes from the VISUAL environment
    variable, or the EDITOR environment where VISUAL is not set. If none are set,
    less defaults to vi. As in vi, Shift+g takes you to the end of the file. Shift+f
    takes you to the end of the file, and then scrolls the as new input is added,
    similar to a tail -.


    Press Ctrl+c to interrupt that mode. As in vi, viewing a file with less, you can
    search for a string by pressing / (forward slash) followed by the string and Enter.
    To search for further occurrences, press / and Enter repeatedly.


    To scroll forward and back using less, use the f and b keys, respectively. For
    example, 10f scrolls forward 10 lines and 15b scrolls back 15 lines. Type d to
    scroll down half a screen and u to scroll up half a screen.


    # Pagin Text Files with pr


    The pr command provides a quick way to format a bunch of text into form where
    it can be printed. This can be particularly quick if you want to print the results
    of some commands, without having to open a word processor or text editor. With
    pr, you can format text pages using header information as date, time, file name,
    and page number. Here is an example:


    ```

    $ rm -qa | sort | pr --column=2 | less  Package package list in 2 cols

    ```'
