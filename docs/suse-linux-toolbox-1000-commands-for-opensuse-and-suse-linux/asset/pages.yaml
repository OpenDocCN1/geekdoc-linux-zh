  md: '# Chapter 13: Doing Remote System Administration


    You also now have a public key (id_rsa.pub), which was created by the previous
    command. This public key needs, to be installed on hosts you want to connect to.
    The content of ~/.ssh/id_rsa.pub needs to be copied (securely) to ~/.ssh/authorized_keys2
    for the user you want to ssh to the remote server. The authorized_keys2 file can
    contain more than one public key, if multiple users use ssh to connect to this
    account.


    Log in to the remote server system as the user that you want to ssh with the key.
    If you don''t already have a ~/.ssh directory, the first step is to create it
    as follows:


    ```

    $ cd

    $ mkdir .ssh

    $ chmod 700 .ssh

    ```


    The next step is to copy (securely) the public key file from the client and put
    it in authorized keys file on the server. This can be accomplished using scp.
    For example, assuming a client named myclient and a client user named chris, the
    following on the server:


    ```

    $ scp chris@myclient:home/chris/.ssh/id_rsa.pub  Get client id_rsa.pub

    $ cat id_rsa.pub >> ~/.ssh/authorized_keys2  Add to your keys

    $ chmod 600 ~/.ssh/authorized_keys2  Close permissions

    $ rm id_rsa.pub  Delete public key after copying its content

    ```


    This procedure can also be accomplished by editing the - / ~/.ssh/authorized_keys2
    text file on the server and copy/pasting the public key from the client. Make
    sure you do so securely over ssh, and make sure not to insert any line breaks
    in the key. The entire key should fit on a single line, even if it wraps on your
    screen.


    Then from the client (using the client and server user accounts you just configured),
    you can just ssh to the server and the key will be used. If you set a passphrase,
    you will be asked for it as you would for a password.


    # Saving Private Keys to Use from a USB Flash Drive


    If you''d like to store your public key somewhere safer than your hard drive,
    you can use a USB flash drive (sometimes called a thumbdrive or pen drive):


    ```

    $ mv ~/.ssh/id_rsa media/THUMBDRIVE1/myprivatekey

    ```


    And then, when you want to use the key, insert the USB drive and type the following:


    ```

    $ ssh -i /media/THUMBDRIVE1/myprivatekey chris@myserver

    ```


    Using keys with passrases is more secure than simple passwords, but also more
    cumbersome. To make your life easier, you can use ssh-agent to store unlocked
    keys to your running ssh-agent, for the duration of your session. When you add
    an unlocked key you can run ssh using the key without being prompted for the passphrase
    each time.


