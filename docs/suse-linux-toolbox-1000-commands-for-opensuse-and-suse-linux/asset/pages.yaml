    # Mastering Time


    Correct time on your Linux system is critical to the system’s proper functioning.
    Your computer Linux ever keeps time in two different ways: a system clock (which
    Linux uses to keep track of time) and a hardware clock (that sets the system time
    when Linux boots up).


    The system time is what is used for timestamps for file creation, run times, and
    anything else where date and time are used. System time can be viewed and manually
    (with the date command) or automatically (with the ntpd service, from the xntp
    package).'
