    probably rely on the command line:


    +   - Almost any time something goes wrong — Ask a question at an online forum
    to solve some Linux problem you are having and the help you will always come in
    the form of commands to run. Also, command line tools typically offer much more
    feedback if there is a problem configuring or accessing files and directories.


    +   - Remote systems administration — If you are administering a remote server,
    you may not have graphical tools (using X Applications or VNC) and web-based administration
    tools may be available, they usually run more slowly than what you can do from
