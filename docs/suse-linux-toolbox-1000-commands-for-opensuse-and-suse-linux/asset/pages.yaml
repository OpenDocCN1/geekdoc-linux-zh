  md: '# Chapter 4: Working with Files


    **NOTE** Searching the entire file system can take a long time to complete. Before
    searching the file system, consider searching a subset of the file system or excluding
    directories or remotely mounted file systems.


    This example searches the root file system (/) recursively for files e100:


    ```

    $ find -name e100* -print

    find: /etc/skel/Documents: Permission denied

    find: /etc/auditspd: Permission denied

    /sys/module/e100

    /sys/module/mii/holders/e100

    ```


    Running find as a normal user can result in lists of Permission denied as find
    tries to enter a directory you do not have permissions to. You can filter out
    the inaccessible directories:


    ```

    $ find -name e100 -print 2>&1 | grep -v "Permission denied"

    ```


    Or send all errors to the /dev/null bit bucket:


    ```

    $ find -name e100 -print 2 >dev/null

    ```


    Because searches with find are case sensitive and match the name exactly (e100
    won''t match e100.ko), you can use regular expressions to make your searches more
    inclusive. Here''s an example:


    ```

    $ find -name ''e100*'' -print

    /lib/modules/2.6.22.59-default/kernel/drivers/net/e1000

    /lib/modules/2.6.22.59-default-kernel/drivers/net/e1000/e1000.ko

    /lib/modules/2.6.22.59-default-kernel/drivers/net/e1000e

    /lib/modules/2.6.22.59-default-kernel/drivers/net/e1000e/e1000e.ko

    /lib/modules/2.6.22.59-default-kernel/drivers/net/e100.ko

    /sys/module/e100

    /sys/module/mii/holders/e100

    /sys/bus/pci/drivers/e100

    ```


    You can also find files based on timestamps. This command line finds files in
    /usr/bin/ that have been accessed in the past two minutes:


    ```

    $ find /usr/bin/ -amin -2 -print

    /usr/bin/

    /usr/bin/find

    ```


    This finds files have not been accessed in /home/chris/ for more than 60 days:


    ```

    $ find /home/chris/ -time +60

    ```


    Use the -type option to find directories. The following command line finds directories
    under /etc and redirects stderr to the bit bucket (/dev/null):


    ```

    $ find /etc -type d -print 2 >dev/null

    ```


    73'
