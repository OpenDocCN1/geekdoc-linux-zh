    # Configuring the Built-In Firewall


    A firewall is a critical tool for keeping your computer safe from intruders over
    the Internet or other network. It can protect your computer by checking every
    packet of data that comes to your computer''s network interfaces, making a decision
    about what to do with that packet based on the parameters you set. The firewall
    built into the current Linux Kernel is called iptables. You may also hear of ipchains,
    which iptables'' predecessor in kernel 2.2.


    The iptables firewall (www.netlify.org) is extraordinarily powerful, which you
    can use from the command line. For reason, many people set up their basic firewall
    rules using a graphical interface. OpenSUSE includes a Firewall GUI (under Security
    and Updates) for configuring basic firewalls. Third-party open source GUIs are
    also available (either in RPM or source tarball) to help you configure iptables:


    +   * Firestarter: www.fs-security.com

    * FWBuilder: www.fwbuilder.org

    * Shorewall: www.shorewall.net


    When you install openSUSE, the firewall is enabled by default. The default configuration
    is controlled by YaST. Under the hood the /sbin/SuSEfirewall2 script,'
