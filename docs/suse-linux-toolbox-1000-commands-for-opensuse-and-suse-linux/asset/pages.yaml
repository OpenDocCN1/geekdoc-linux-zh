  md: "# Chapter 14: Locking Down Security\n\nThe nat table just shown applies to\
    \ a feature Network Address Translation. NAT allows you to do such things as exit\
    \ addresses before leaving. The packets from internal LAN machines exit the firewall,\
    \ the source address is rewritten with the IP address of the firewall's external\
    \ interface. The firewall keeps track of these sessions in order to allow the\
    \ return traffic through the LAN machines. All this is configured with the MASQUERADE\
    \ line on the POSTROUTING chain.\n\nIn the example above, the DNAT line in the\
    \ PREROUTING chain contains requests to port 8785, at IP address 11.22.33.44,\
    \ to be forwarded to the LAN IP address 10.0.0.155 on port 22 (a trick to let\
    \ someone ssh into a computer behind the firewall through a non-standard port).\n\
    \nHere are other examples for listing information about your firewall (the iptables\
    \ command can be found at www.phildev.net/iptables/):\n\n+   * iptables -n Filter\
    \ rules: IP numbers (no DNS lookup)\n* iptables -vL Verbose output (with packet/byte\
    \ counts)\n* iptables -L --line-numbers Show line in chain for each rule\n* iptables\
    \ -nvL --line-numbers Our Tech Editor's favorite combination\n* iptstate Show\
    \ top-listing of iptables entries\n* iptables -tl Same thing with DNS names and\
    \ totals\n\nOn openSUSE, if iptables is not started you can start the firewall\
    \ manually by typing the following:\n\n+   # SuSEfirewall start To start iptables\
    \ now\n# SuSEfirewall on To set iptables to start at boot time\n\nHere is how\
