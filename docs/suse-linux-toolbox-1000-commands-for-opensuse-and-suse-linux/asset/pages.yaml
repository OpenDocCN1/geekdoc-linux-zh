  md: '# Chapter 7: Administering File Systems


    partition limit. In order to overcome the 2TB limit, PC-BIOS partition tables
    are replaced with GPT (GUID Partition Tables).


    The standard command for working with disk partitions is fdisk. Because fdisk
    cannot work with GPT partitions, it is slowly being deprecated. A more powerful
    and actively supported tool is the parted command.


    > NOTE If you prefer to graphical tools for partitioning, resizing, and otherwise
    manipulating your hard disk, you can try the YaST partitioner, found in the System
    section of the YaST interface.


    # Changing Disk Partitions with fdisk


    The fdisk command is a useful tool for listing and changing disk partitions. Keep
    in mind that modifying or deleting partitions can cause valuable data to be removed,
    so make sure of your changes before writing them to disk. To use the fdisk command
    to list information about the partitions on your hard disk, type the following
    command as root:


    ```

    # fdisk -l

    List disk partitions for every disk

    Disk/sda: 82.3 GB, 8234827760 bytes

    255 heads, 63 sectors/track, 10011 cylinders

    Units = cylinders of 16065 * 512 = 8225280 bytes

    ```


    | Device Start End Blocks Id System |

    | /dev/sda * | 14 | 104391 | 83 Linux |

    | /dev/s2 | | 10011 | 7926410 | 83 Linux |

    | /dev/sda3 | | 9882 | 1044225 | 82 swap |


    This example is for an 80 GB disk that is divided into three partitions. The first
    (/dev/sda) is a small/boot partition that is configured as a Linux ext3 file system
    (Id 83). Note the asterisk (*), indicating that the first partition is bootable.
    The partition is assigned to the root system and is also ext. The final partition
    is Linux swap.


    > NOTE Since 2.6.20 of the Linux kernel, both IDE and SCSI disks use device names
    /dev/sd?, where the ? is replaced by a letter (a, b, c, and so on). In earlier
    versions of,, only SCSI disks and USB flash drives used the /dev/sd? names. IDE
    hard drives used /dev/hd? instead.


    If multiple disks exist, fdisk -l will list them all unless you indicate the specific
    disk you want:


