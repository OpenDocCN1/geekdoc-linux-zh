  md: '# Chapter 12: Accessing Network Resources


    The xchat utility is a good graphical, multi-operating system IRC client. The
    elite way to do IRC is to run a text-mode client in screen on an always-on machine,
    such as an old server. Another simpler option is to use an IRC proxy client, also
    known as a bouncer, such as dircproxy.


    The original IRC client was ircII. The allowed of scripts (in some ways similar
    to macros found in productivity suites) that automated some of the commands and
    increased usability. The most popular was Phoenix by Vagasso. Then came BittX,
    which started as an ircII script and became a full-blown client. Today, most people
    use irssi. Install the irssi package to get this. To launch irssi from SUSE, type:


    ```

    $ irssi -n JayJoe199x

    ```


    In this example, the user name (nick) is set to JayJoe199x (you should choose
    your own). You see a blue status bar at the bottom of the screen indicating that
    you are in Window 1, the status window. IRC commands are preceded with a / character.
    For example, connect to freenode server, type:


    ```

    /connect chat.freenode.net

    ```


    If you didn''t add your user name on the command line, you are connected to chat
    .freenode.net with the user name you are logged under. On IRC, a chat room is
    a channel and has a sign (#) in front of the name. Next, try joining the #centos
    channel:


    ```

