    * Removing repository ''Guru''s_RPM_site''

    Repository Guru''s RPM site 1 has been removed.

    ```


    To add this location using zypper and give it the alias Guru''s RPM site, issue
    the zypper command as follows (you must use quotes around the service name as
    it contains whitespace and a single quote):


    ```

    # zypper ar http://ftp.gwdg.de/pub/linux/misc/suser-gurer/rpm/10.3/RPMS/ \

    "Guru''s RPM site"

    * Adding repository ''Guru''s RPM site''

