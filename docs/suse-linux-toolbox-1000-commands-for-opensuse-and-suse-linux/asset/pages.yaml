  md: '# Chapter 4: Working Files


    > NOTE To get these commands and files, install the findutils package. Then, run
    the updatedb command to set up the database used by the locate command.


    # Finding Files with locate


    Because the database contains every name of node in the file system, and not just
    commands, you can use locate to find commands, devices, man pages, data files,
    or anything else identified by a name in the file system. Here is an example:


    ```

    $ locate e100

    /lib/modules/2.6.22.59-default-kernel/drivers/net/e1000

    /lib/modules/2.6.22.59-default-kernel/drivers/net/e1000e

    /lib/modules/2.6.22.59-default-kernel/drivers/net/e1000/e1000.ko

    /lib/modules/2.6.22.59-default-kernel/drivers/net/e1000e/e1000e.ko

    /lib/modules/2.6.22.59-default-kernel/drivers/net/e100.ko

    /usr/share/cups/model/gutenprint/stp-escp2-e100.5.0.ppd.gz

    /usr/share/cups/model/gutenprint/stp-escp2-e100.5.0.sim.ppd.gz

    ```


    The above example finds e100ko, e1000e, and e1000 kernel modules. Locate is sensitive
    until you use the -i option. Here''s an example:


    ```

    $ locate -i itco_wdt

    /lib/modules/2.6.22.59-default-kernel/drivers/char/watchdog/itCO_wdt.ko

    ```


    Here are some examples using locate with regular expressions:


    ```

    $ locate -r /ls$

    Locate files ending in /ls$

    /bin/ls

    /opt/kde3/share/locale/110n/ls

    /usr/share/locale/110n/ls

    $ locate -r ^/boot/grub/me

    Locate files beginning with /boot/grub/me

    /boot/grub/menu.list

    ```


    The findutils-locate RPM package (or locate on some Linux distributions) includes
    a cron job that runs the updatedb command once per day to update the locate database
    of files. The file you may have removed since the database was updated, you can
    use the locate -e option to check if the file found in the database still exists:


    ```

    $ locate -e filename

    ```


    To update the locate database immediately, you can run the updatedb command manually:


    +   * updateddb


    # Locating Files with find


    Before the days of locate, the way to find files was with the find command. Although
    locate will come with a file faster, find has many more powerful options for finding-files
    based on attributes other than the name.'
