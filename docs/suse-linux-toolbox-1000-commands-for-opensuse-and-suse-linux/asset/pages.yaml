  md: '# Managing Passwords


    Adding or changing a password is usually done quite simply with the passwd command.
    However, there are additional options available with passwd that let an administrator
    manage things as user account locking, password expiration, and warnings to change
    passwords. Beside passwd, there are commands such as chage, and vipw, for working
    with user passwords.


    Regular users can change only their own passwords, whereas the root user can change
    the password for any user. For example:


    ```

    $ passwd Change a regular user''s own password

    Changing password for chris.

    Changing password for chris.

    (current) UNIX password: ********

    New UNIX password: *

    BAD PASSWORD: it''s way too short

    New UNIX password: ********

    Retype new password: ********

    passwd: all authentication tokens updated successfully.

    # joseph Root change any user''s password

    Changing password for joseph.

    New UNIX password: *

    BAD PASSWORD: it''s way too short

    Retype new UNIX password: *

    passwd: all authentication tokens updated successfully.

    ```


    In the first example, a regular user (chris) changes his password. Even logged
    in, the user must type the current password before entering a new one. passwd
    keeps a regular user from setting a password that is too short, based on a dictionary
    word, user doesn''t have enough different characters, or is easy to guess. The
    root user, in the second example, can change any user password without the old
    password. Likewise, the root user is warned about a password that''s insecure.
    However, the root user can assign a short or easy-to-guess password, despite those
    warnings.


    Passwords should be at least eight characters and a combination of letters and
    other characters (numbers, punctuation, and so on), and should not include real
    words. Make passwords easy to remember but hard to guess.


    A system administrator can use passwd to lock and unlock user accounts. For example:


    ```

    # passwd -u char Lock the user account (carl)

    Password changed.

    # passwd -u char Unlock a locked user account (carl)

    Password changed.

    # passwd -u jordan Fails to unlock account with blank password

    Cannot unlock the password for `jordan!`

    ```'
