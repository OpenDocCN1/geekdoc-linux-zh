  md: '# Chapter 11: Managing Network Connections


    ```

    # iwconfig wlan0 any any

    # iwconfig wlan0 sens -50

    # iwconfig wlan0 retry 20

    # iwconfig wlan0 key 1234-5555

    ```


    Use any access point available

    Set sensitivity to -50

    Set MAC retransmissions to 20

    Set encryption key to 1234-5555


    The ssid is sometimes called the Network Name or Domain ID. Use it as the common
    name to identify your wireless network. Setting the channel lets your wireless
    LAN operate on that channel.


    With Ad-Hoc mode, the network is composed of only interconnected clients without
    central access point. In Managed/Infrastructure mode, by setting ap to a specific
    MAC address, you can force the card to connect to the access point at that address,
    or you can set ap to any and allow connections to any point.


    If you have performance problems, adjusting the sensitivity (sens) to either a
    negative value (which represents dbm) or positive value (which is either a percentage
    or sensitivity value set by the vendor). If you get retransmission failures, you
    can increase the retry value so your card can send more packets before failing.


    Use the key to set an encryption key. You can enter hexadecimal digits (XXXX-XXXX-XXXX-XXXX
    or XXXXXXXX). By adding an s: in front of the key, you can enter an ASCII string
    as the (in s:My927pwd).


    # Dial-up Modems


    Although high-speed DSL, cable modem, and wireless LAN hardware have become widely
    available, there may be times when a phone line and a modem are the only way to
    get on the Internet. Linux offers both graphical and command line tools for configuring
    and communicating with modems.


    As with other connections in SUSE, dial-up modem connections can be configured
    using the Network Devices panel. Most external serial modems will work with Linux
    without any special configuration. Most hardware PCI modems will also work. However,
    many software modems (sometimes called Winmodems) will not work in Linux (some
    can be configured with special drivers, and are referred to as Linmodems).


    Instead of deforming the contortions you must go through to get Winmodems working
    in Linux, we recommend that you purchase either a modem that connects to an external
    serial port or a hardware modem. If you want to try configuring your Winmodem
    yourself, refer to the Linmodems site (www.linmodems.org).


    If you are not able to get your modem working from the Network Devices panel,
    there are some commands you can try. First try the wvdialconf command to scan
    any modems to your serial ports and create a configuration:


