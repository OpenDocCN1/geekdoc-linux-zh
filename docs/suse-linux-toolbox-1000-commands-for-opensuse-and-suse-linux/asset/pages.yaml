  md: '# Chapter 14: Locking Down Security


    those files have been changed. First, you take a baseline of your system. Then
    at regular intervals, you run an integrity check to see if any of your applications
    or configuration files have been modified. The most popular FIA has become semi-commercial
    over the last few years. For that reason, openSUSE includes the Open source AIDE
    (Advanced Intrusion Detection Environment). You can install it via YaST or zypper.


    +   - RPM database — Another way to check if any of your applications have been
    modified is by using the `rpm` command to validate the applications and configuration
    files you have installed on your system. Using `rpm -V`, you can verify the size,
    MD5sum, permissions, type, and ownership of every item in an RPM package. See
    Chapter 2 for information on using `rpm` to verify the contents of installed RPM
    packages.


    +   - chkrootkit — If you suspect your system has been compromised, download and
    build `chkrootkit` from www.chkrootkit.org. This will help you detect rootkits
    that have been used to take over your machine. We recommend you run `chkrootkit`
    from a LiveCD or after mounting the suspected drive on a clean system.


    # Summary


    Although there are many tools available for securing your Linux system, the first
    line of security starts with securing the user accounts on your system and the
    services that run on your system. Commands such as `useradd`, `groupadd`, and
    `password` are standard tools for setting up user and group accounts.


    Because most security breaches outside your organization can come from intruders
    accessing your systems on public networks, setting up secure firewalls is important
    for any system connected to the Internet. The ipt facility provides the firewall
    features that are built into the Linux kernel.


    To keep track of activities on your system, the Syslog facility logs information
    about nearly every aspect of the actions that take place on your system. Packages
    such as `rotate` and `logwatch`, make it easy to manage and do daily checks on
    your system logs.'
