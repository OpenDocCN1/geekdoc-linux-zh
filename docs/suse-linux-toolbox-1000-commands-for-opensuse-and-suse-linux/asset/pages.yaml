    # Adding Groups


    Each user is assigned to one or more groups. You can create groups at any time
    and add users to those groups. The permissions that each group has use files and
    directories in Linux depend on the group permission bits are set on each item.
    Assigning users to a group allows you to attach ownership to files, directories,
    and applications that those users can work together on a project or have common
    resources.


    Commands similar to those for working with users are available for managing groups.
    You can add groups (groupadd), change group settings (groupmod), delete groups
    (groupdel), and add and delete members from those groups (groupmem). Here are
    some examples for adding new groups with the groupadd command:


    +   * groupadd marketing Create new group with next available GID

    * groupadd -g 701 sales Create new group with GID of 701

    * groupadd -r myadmin Create new group with admin GID (under 499)

    * groupadd -o g 74 mysshyd Create group with existing GID


    With the groupmod command, you can change the name or group ID of an existing
    group. Here are examples:


    +   * groupmod -g 491 myadmin Modify admin to use GID 491

    * groupmod -n myad myadmin Change name of myadmin group to myad


    To remove an existing group, use the groupdel command. Here is an example:


    +   * groupdel myad Remove existing myad group


    Keep in mind that a group or user doesn''t remove files, directories, devices,
    or other items owned by that group or user. If you do a long listing (ls -l) of
    a file or directory assigned to a user or group that was deleted, the UID or GID
    of the deleted user or group is displayed.


    # Checking on Users


    After you have created user accounts, and let those users loose on your computer,
    there are several commands you can use to keep track of how they are using your
    computer. Commands for checking user activity on your Linux system that are covered
    in other chapters include following:


    +   * Use the find command (see Chapter 4) to search the system for files anywhere
    on the system that are owned by selected users.


    257'
