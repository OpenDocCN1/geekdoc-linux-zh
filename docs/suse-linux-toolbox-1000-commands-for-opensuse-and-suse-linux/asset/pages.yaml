    # Backing Up with unison


    Although the unison command is good to back up one machine to another, it assumes
    the machine being backed up is the only one where the data is modified. What if
    you have two machines that both modify the same file and you want to sync those
    files? Unison is a tool that will do that for you.


    It''s common for people to work with the same documents on their laptop and desktop
    systems. These machines might even run different operating systems. Because unison
    is a cross-platform application, it can let you sync files that are both Linux
    and Windows systems. To use unison in SUSE, you must install the unison package.


    With unison, you can define roots the two paths to synchronize. Those roots can
    be local or remote over ssh. For example:


    ```

    $ unison /home/francois ssh://francois@server1//home/fcaen

    $ unison /home/francois /mnt/backups/francois-homedir

    ```


    > Users have reported issues attempting to sync using unison versions installed
    by default between SUSE systems and Fedora or Ubuntu systems. Be sure to check
    that the versions of unison you use are at the same version number between the
    platforms.


    Unison contains both graphical and command-line tools for doing unison backups.
    It will try to run the graphical version by default. This may fail if you don''t
    have a desktop running or if you''re launching unison within screen. To force
    to run in command line mode, use the -ui option as follows:


    ```

    $ unison /home/francois ssh://francois@server1//home/fcaen -ui text

    Contacting server...

    francois@server1''s password:

    Looking for changes

    Waiting for changes from server

    Reconciling changes

    local

    newfile ---> memo.txt [f] y

    Propagating updates

    ...

    ```'
