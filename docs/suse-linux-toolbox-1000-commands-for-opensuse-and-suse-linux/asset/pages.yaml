    # Using the Shell


    After you open a shell (whether from a text-based log or Terminal window), the
    shell environment is set up by the user who started the shell. Bash settings for
    all users'' shells are located in /etc/bashrc, /etc/profile, and /etc/profile.d/.
    User-specific shell settings are determined by commands executed from several
    files in the user''s home directory (if they exist): .bash_profile, .bash_login,
    and .profile. When a shell is closed, commands in the user ~/.logout are executed.
    Changing settings in files permanently changes the user''s shell settings but
    does not affect shells that are already running. (Other shells use different configuration
    files.)


    There are a variety of ways in which you can change and list your shell environment.
    One of the biggest ways is to change who you are; in particular, to become the
    super user ("quiring Super Power") later in this chapter.


    # Using Bash Again History


    The Bourne Again Shell (bash) is the shell used by most modern Linux systems.
    Built into bash, as all others, is a history feature that lets you review, change,
    and reuse commands that you have run in the past.


    When bash starts, it reads the ~/.bash_history file and loads it into memory.
    This history file is set by the value of $HISTFILE. During a bash session, commands
    are added to history in memory. When bash exits, history in memory is written
    back to the .bash_history file. The number of commands held in history during
    a bash session is set by $HISTSIZE:


    ```

    $ HISTFILE $HISTSIZE $HISTSIZSIZE

    /home/fcean/.bash_history 1000 1000

    ```


    To list the entry, type history. To list a previous number of commands, follow
    history with a number. This lists the previous five commands in your history:


    ```

    $ 5

    975 mkdir extras

    976 mv *doc extras/

    977 ls -CF

    978 vi house.txt

    979 history

    ```


    To move among the commands in your history, use the up arrow and down arrow. Once
    a command is displayed, you can use the keyboard to edit the current command like
    any'
