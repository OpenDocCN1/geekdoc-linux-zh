  md: '# Chapter 13: Doing Remote System Administration


    Although there are still uses for the legacy remote commands (see the “Using Legacy
    Communications Tools” sidebar), most of this section describes how to use SSH
    commands to handle most of your needs for remote communications use.


    # Using Legacy Communications Tools


    Despite the fact that SSH provides better tools for remote communications, legacy
    communications commands, sometimes referred to as commands, are still included
    with most major Linux distributions. In openSUSE, these commands are part of the
    rsh package. Some of these tools will perform faster than equivalent SSH commands
    because they don''t need to encrypt. Some old-school Unix administrators use them
    on private networks or include them in old scripts. Although for the most part
    you should ignore these legacy remote commands, some of these commands in particular
    can be useful in some cases: telnet.


    The telnet command is still used to communicate with some network appliances (routers,
    switches, UPSes, and some that do not have the horsepower to run an ssh daemon).
    Even though it poses a security risk, some manufacturers include telnet support
    anyway.


    One good way to use the telnet command, is for troubleshooting many Internet protocols
    like POP3, SMTP, HTTP, and others. Under the hood, plain-text protocols are simply
    automated telnet sessions when a client (such as a browser or user agent) exchanges
    text with a server. The only difference is the TCP port use. Here is an example
    of how you could telnet to the HTTP port (80) of a web server:


    ```

    $ telnet www.example.com 80

    Trying 208.77.188....

    Connected to www.example.com.

    Escape character is ''^''.

    GET / HTTP/1.0


    Enter a second carriage return here


    HTTP/1.1 200 OK

    ```


    Similarly, you can telnet to a mail server on port 25 (SMTP) and 110 (POP3) and
    issue the proper commands to troubleshoot e-mail problems. For more complete descriptions
    of using the telnet command to troubleshoot network protocols, refer to Linux
    Troubleshooting Bible (ISBN 076456997, Wiley Publishing, 2004), pages 505 and
    508.


    If you need to exit your telnet session, use the escape sequence (Ctrl+) by default.
    This will stop sending your keyboard input to the remote end and bring you to
    telnet''s command prompt where you can type quit or ? for more options.


    # Configuring SSH


    Nowadays, the Swiss army knife of system administration is Secure Shell (SSH).
    SSH commands and services replace all the old tools and add strong encryption,
    public keys, and many other features. The most common implementation of SSH in
    the Linux world is OpenSSH (www.openssh.com), maintained by the OpenBSD'
