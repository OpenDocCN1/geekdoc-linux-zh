  md: '# Chapter 8: Backups and Removable Media


    # Making and Burning DVDs with growisofs


    Using the growisofs command, you can combine the two steps of gathering files
    into an ISO image (mkisofs) and burning that image to DVD (cdrecord). Besides
    saving a step, the growisofs command also offers the advantage of keeping a session
    open by default until you close it, so you don''t need to do anything special
    for multi-burn sessions.


    Here is an example of using growisofs commands for a multi-burn session:


    ```

    # growisofs -Z /dev/dvd -R /home/chris      Master and burn to DVD

    # growisofs -Z /dev/dvd -R /home/francois    Add to burn

    # growisofs -M /dev/dvd=/dev/zero           Close burn

    ```


    If you want to add options when creating the ISO image, you can simply add mkisofs
    options to the command line. (For example, see how the -R and -J options are added
    in the above examples.)


    If you want to burn a DVD using growisofs, you can use the -dvd-compat option.
    For an example:


    ```

    # growisofs -dvd-compat -Z /dev/dvd-image.iso Burn an ISO image to DVD

    ```


    The -dvd-compat option can improve compatibility with different DVD drives over
    some multi-session DVD burning procedures.


    # Summary


    Linux and its predecessor Unix systems handled data backups by combining commands
    that each handled a discrete set of features. Backups of your critical data can
    be done still in this way. In fact, many of the tools you perform more securely
    and efficiently than ever before.


    The archive utility (tar command) has expanded well beyond its original job of
    making magnetic tape backups of data files. Because nearly every Linux and UNIX
    system includes tar, it has become a standard utility for packaging software and
    backing up data to compressed archives. Those archives can be transported and
    stored in a variety of ways.


    To move backed data to other machines over a network, you can use remote features
    of OpenSSH tools (such as ssh). You can also use an excellent utility called rsync.
    With rsync, you can save resources by only backing up files (or parts of files)
    that have changed.


    Inexpensive CDs and DVDs have become popular media for doing personal and small-office
    backups. The mkisofs command can create file systems of backed up data in ISO9660
    format that can be restored on a variety of systems (the Linux, Windows, or Mac).
    Once mkisofs command has created an ISO image, the image can be burned to CD or
    DVD using the cdrecord or growisofs command.'
