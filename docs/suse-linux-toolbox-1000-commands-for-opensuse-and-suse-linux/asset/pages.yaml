    ```


    Your screen should look similar to Figure 12-1.


    ![](img/68ec7bb02370c395a1474375111dfbb9_260_0.png)


    Figure 12-1: connected to #freenode


    You are now in the channel in Window 2, indicated by the status bar. Switch among
    the irssi windows by typing Alt+1, Alt+2, and so on (Ctrl+n and Ctrl+p). To get
    help at any time, /help command, where command is the name of the command you
    want more information about. Help will output in the status window, not necessarily
    the current window.


    To add to the IRC chat, simply type a message and press Enter to send the message
    to those in the channel. Type /part to leave a channel. Type /quit to exit the
    program.


