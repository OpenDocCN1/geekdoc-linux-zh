  md: '# Adding and Deleting Text in vi


    Adding and deleting in vi is a bit more complicated than the same in pico. Whereas
    in pico, you basically just place your cursor where you want to make changes,
    vi has a whole set of commands that you use to specify where the changes should
    occur (Tables 4.1, 4.2, and 4.3 list only a few of your options). Plus, to issue
    the commands, you have to switch to command mode.


    # To add or delete text in vi:


    +   1. vi

    To begin, type vi at the shell prompt.


    +   2. i

    Change into input mode.


    +   3. There once was a man from Nantucket

    Type some text that you''ll want to add.


    +   4. Esc

    Press Esc to enter command mode before you issue the commands.


    +   5. Choose a command, based on what you want to do the text.

    Table 4.1 lists commands to add text.

    Table 4.2 lists commands to delete text.

    Table 4.3 lists miscellaneous editing commands.


    +   6. dd

    Type the command. Here, we''re deleting the current line of text.


    Table 4.1

    | COMMAND | FUNCTION |

    | :--- | :--- |

    | a | Adds text after the cursor |

    | A | Adds text at the end of the current line |

    | i | Inserts text before the cursor |

    | I | Inserts text at the beginning of the current line |

    | o | Inserts a blank line after the current line |

    | 0 | Inserts a blank line before the current line |


    Table 4.2

    | COMMAND | FUNCTION |

    | :--- | :--- |

    | x | Deletes one character (under the cursor) |

    | X | Deletes one character (behind the cursor) |

    | dd | Deletes the current line |

    | 5dd | Deletes five lines starting with the current line (any number would work
    here) |

    | dw | Deletes the current word |

    | cw | Changes the current word (deletes it and enters input mode) |

    | r | Replaces the character under the cursor with the next character you type
    |

    | R | Replaces the existing text with the text you type (like overwrite mode in
    most word processors) |


    Table 4.3

    | COMMAND | FUNCTION |

    | :--- | :--- |

    | yy | Copies the current line |

    | p | Pastes any text after the cursor or current line |

    | J | Joins the current and following lines |

    | u | Undoes the last change |

    | U | Undoes all changes on the current line |

    | . | Repeats the last command |'
