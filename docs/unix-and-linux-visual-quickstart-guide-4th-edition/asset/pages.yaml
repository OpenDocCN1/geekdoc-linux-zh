  md: '# Encoding Files with uenencode


    You''ll use encoding whenever you''re sending a binary file (a nontext file) through
    e-mail. Although many e-mail programs will take care of encoding for you (and,
    therefore, you won''t need to concern yourself with the information here), you
    may occasionally have to do it yourself.


    Files must be encoded so that you can pass through Internet e-mail gateways unscathed.
    If you don''t encode a file and your program doesn''t do it for you, the file
    will arrive as a bunch of unusableberish. This is because the gateways assume
    that all text passing through uses 7-bit words while binary files use 8-bit (1
    byte) words; therefore, binary files are garbled. To prevent gibberish, just encode
    your files before you send them, as shown in Code 13.1.


    ```

    [ejr@hobbes compression]$ ls

    Folder bigfile.uue folder.zip home.gz.ue

    Zippedodadah file1.html fortunes1.txt newzip.zip

    bigfile.gz file2.html fortunes1.zip ourhomepage.zip

    bigfile.new.gz folder gzip temp

    [ejr@hobbes compression]$ uenencode ourhomepage.zip ourhouse.jpg > house.uu

    [ejr@hobbes compression]$ head house.uu

    begin 64 ourhouse.jpg

    M@H*C"@#"@"@@"@"@"@@"@"@"@"@"@"@"@"@C

