  md: '# Getting Started with Unix


    # # Listing Directories and Files with ls


    Your Unix system is made up of directories and files that store a variety of information,
    including system setup, configuration settings, programs, options, as well as
    other files and directories. You might think of your Unix system as a tree (tree
    roots, actually), with subdirectories stemming from higher-level directories.
    As shown in Figure 1.6, all of these files and directories reside within the root
    directory, which contains everything in the system.


    Using the ls command, you can find out exactly what''s in your Unix system and
    thereby find what''s available to you. You can list the files and directories
    of a directory that you''re currently in or a directory that you specify.


    To list the files and directories of the directory you''re in:


    +   - ls


    At the prompt, type ls ls to list the files and directories in the current directory,
    which in this case is our home directory (**Code Listing 1.2**).


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_27_0.png)


    **Figure 1.6** All files and directories are nested within the root directory,
    which serves to contain them in the system.


    ```

    $jdoe@fraz jdoe$ ls

    limerick mail/ Project/ public_html/

    testfile testlink@ tmp/

    jdoe@fraz jdoe$

    ```


    **Code Listing 1.2** Use ls by itself to list the files and subdirectories of
    the directory you''re in.


    13'
