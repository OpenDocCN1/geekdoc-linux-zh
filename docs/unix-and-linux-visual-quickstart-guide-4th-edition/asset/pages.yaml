  md: '# Linking with ln -s (Soft Links)


    Now suppose you want to pawn off entire workload on your new helper. Rather than
    just give him access to a single file, you''ll want to make it easy for him to
    access your project directory. You can do this using soft links (created with
    ln -s), essentially provide other users with a shortcut to the file or directory
    you specify.


    Hard links, soft links sometimes require that you have access to another user''s
    directory and files. See Chapter 5 for more on file permissions and ownership
    and Chapter 7 for the lowdown on file systems.


