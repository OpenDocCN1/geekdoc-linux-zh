  md: '# Chapter 1


    # To redirect output to a new file:


    +   1. ls /usr/local/bin > local.programs.txt

    In this case, we start with the same directory, add a greater-than-symbol (>),
    and then specify a filename. This will redirect the output of ls to a file named
    local.programs.txt.

    Be careful with this command! If the file already exists, it could be replaced
    with the output of the ls program here.


    +   2. ls local*

    Here, we''re just checking to see that the new local.programs.txt file has been
    fully created. The asterisk wildcard (*) specifies that we want a list of all
    files that begin with the word local, such as localize, localyoker, or localano
    (see Code Listing 1.6). See the next section, “Using Wildcards,” for handy information.


    # To append output to an existing file:


    +   ◆ ls /usr/bin >> all.programs.txt

    Appending output to an existing file is similar to redirecting it to a new file;
    however, instead of creating a new file to hold the output (or replacing the contents
    of an existing file), you add content to the end of an existing file. Notice that
    you use two greater-than symbols, rather than one.


    +   ✔ Tip


    +   ✔ You can pipe and redirect at the same time. For example, you might list
    a directory, pipe it to wc to count the entries, then append the results to a
    directoryinfo file, like this: ls | wc -l >> directoryinfo. You can learn more
    about counting files and their contents with wc in Chapter 6.'
