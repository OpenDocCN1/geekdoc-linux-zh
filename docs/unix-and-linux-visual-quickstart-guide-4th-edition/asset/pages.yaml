  md: '# Working with Encoded and Compressed Files


    # Compressing Files

    with compress


    ```

    [ejr@hobbes compression]$ ls -l l*

    -rw-r-r- 1 ejr users 501760 Jul 27

    - 10:06 labrea.tar

    [ejr@hobbes compression]$ compress

    labrea.tar.Z

    [ejr@hobbes compression]$ ls -l l*

    -rw-r-r- 1 ejr users 297027 Jul 27

    - 10:06 labrea.tar.Z

    [ejr@hobbes compression]$

    ```


    Compressing a file just means making it smaller that it takes up less disk space.
    It''s likeのである a toy box, closing the lid, then sending it on to smooth the contents
    so that they fit into a smaller space. Any time you create a file that you''re
    sending via FTP or people will access through the Web, you''ll want to compress
    the file so that it takes less time to send and download.


    **Code 13.8** Listing files before and after compressing them lets see how much
    smaller the new file is.


    **Code 13.8** shows, you compress files using the compress command.


    # To compress a file with compress:


    +   * compress labrea.tar

    At the shell prompt, type compress followed by the filename. Here, we''re compressing
    a tar file, which contains multiple files. You can see in Code Listing 13.8, the
    compressed file has a new extension (.Z) that shows that it''s compressed, and
    it replaces the original, uncompressed file.


    # ✓ Tips


    +   * You can compress only one file at a time. If you have multiple files you
    want to compress, consider archiving them using tar, and then compressing the
    single archived file. See the section called "Archiving with tar" earlier in this
    chapter.

    * You can add the -c flag to compress to leave the original file untouched and
    send the compressed version to standard output (where you''ll probably specify
    a name and save it to a file). For example, you might use compress -c labrea.tar
    > labrea.tar.Z. See Chapter 1 for some mighty interesting information on redirecting
    output.


