  md: '# Using ROT13 Encoding with sed


    In various places on the Internet, text is often encoded with something called
    "rotate (which is an abbreviation for "rotate the alphabet) by 13)". That is,
    A becomes N, B becomes O, and so forth. If text is encoded, people have to take
    extra steps to decode the message. For example, if a message includes an offensive
    joke, people who don''t want to see it won''t have to. Similarly, if the message
    is a movie review, people who don''t want to know the ending won''t have the surprise.
    Instead, the message encoded with ROT13 might look like this:


    ```

    Tbbq sbh lbh--lbh svertaq vg bhg! Naq ab, gurer''f ab chapuyvar. Ubcr lbh rawbjrq
    gur obxx! Qorenu Narep

    ```


    A great way to use ROT13 encoding (and decoding) is with sed, which will let you
    easily manipulate text.


    # To use ROT13 encoding with sed:


    +   1. vi script.sed

    Use the editor of your choice to create a file called script.sed. Because the
    command we''re using will be reused, we''ll create a sed script instead of just
    typing everything at the shell prompt.


    +   2. y/abcdefghijkklmnopqrstqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ/

    Start with a y at the beginning of the command. y is the sed command to translate
    characters (capital to lowercase or whatever-specify).

    After y, type a slash (/), the original characters to look for (all lowercase
    and uppercase characters), and another slash.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_327_0.png)


    continues on next page


    313'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Chapter 16


    3. y/abcdefghijklmnopqrstuvwxyzABCDEFGHI

    IJKLMNOPQRSTUVWXYZ/nopqrstuvwxyz

    abcdefghijklmnopqrstuvwxyzABC

    HIJKLM/


    After the second slash, the characters (the lowercase alphabet, starting with
    n and continuing around m, then uppercase from N to M), followed by a slash to
    conclude the replace script.


    4. Save the script and exit the editor.


    5. sed -f script.sed | | more

    Test the ROT13 encoding by applying it to a file. Here we apply it to the limerick,
    and then pipe the output to more for your inspection. You''ll see that all you
    get is gibberish. To test it thoroughly, use sed -f script.sed | | sed -f script.sed
    | more to run it through the processor twice. You should end up with normal text
    at the end of this pipeline (**Code Listing 16.6).**


    # ✔ Tips


    ■ Text is rotated by 13 because there are 26 letters in the alphabet, so you can
    use the same program to encode or decode. If you rotate by a different number,
    you''ll need to have separate programs to encode and decode.


    ■ Check out the next section to see how to turn this lengthy process into a shell
    script and make it even easier to reuse over and over.


    ```

    [ejr@hobby creative]$ sed -f script.sed

    → limerick

    Bhe snibev yzvrevpx

    1.

    Gurer baph jnf n zna sez Anagphxrg,

    june neebruv vahu yapa va n ohxrg,

    Frva yr jvu n cvr,

    Vs V whf ung qabah V'' qax vg.

    [ejr@hobby creative]$ sed -f script.sed

    → limerick -f script.sed

    Our favorite limerick

    1.

    There once was a man from Nantucket,

    Who carried his lunch in a bucket,

    Said he with a sigh,

    As ate a whole pie,

    If I just had a donut I''d dunk it.

    [ejr@hobby creative]$

    ```


    **Code Listing 16.6** A spiffy sed command can ROT13 encode and decode messages.


    314'
