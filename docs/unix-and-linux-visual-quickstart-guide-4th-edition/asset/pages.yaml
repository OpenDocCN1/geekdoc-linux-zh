  md: '# Accessing a Unix System


    Using a Unix system is different from working on a PC. Using a PC, the computer''s
    hard drive is your personal space, and—generally—you don''t have access to what''s
    on someone else''s hard drive. With Unix, you have your own personal space that''s
    located within a much bigger system. You might think of Unix as an apartment building,
    with lots of individual apartment spaces, a central office, and perhaps other
    general spaces, like a maintenance office. With Unix, you have the entire system
    that houses dozens, hundreds, or even thousands of personal spaces as well as
    private spaces (for, the system administrator, bosses, or IT [Information Technology]
    department staff). You can access your apartment only, but the system administrator
    (or designated people with authorization) can access any apartment.


    People choose to use Unix for a number of reasons:


    +   - Control: Unix users offers more control and customization on the legal and
    licensing side as well as the "getting stuff done".


    +   - Economy: Many flavors of Unix offer free or nearly free licensing.


    +   - Power: Experienced Unix geeks do more with less effort on Unix than Windows—for
    many things, at least.


    In the final analysis, though, most Unix people end up sticking with Unix because
    they tried it, slogged through the initial learning curve, and then decided they
    like it.'
  merge: -1
