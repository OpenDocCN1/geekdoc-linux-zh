  md: '# # Keeping up with watch


    As a system administrator, you practically have to have eyes in the back of your
    head and be aware of all kinds of activities that might be going on. The watch
    command is your friend. It keeps an eye on pretty much (users, system, or files)
    you want to monitor.


    To watch:


    +   - watch last

    Use watch to monitor the output of a specific command. When something changes,
    you''ll see it in the watch output (Figure 15.5). In this case, we''re monitoring
    who logged in and when.


    +   - watch --differences=cumulative

    → ls -1 /var/spool/mail

    You can see if mail''s getting delivered monitored by ls -1 output from the /var/spool/mail
    directory. The extra flags show cumulative differences since you started watch.


    # ## Tips


    +   - The watch utility can be readily, but sometimes it''s easier to just type
    something like tail -f /var/log/httpd/access_log to keep track of the web server
    log or write a shell script to periodically run last. Basically, watch is useful,
    but it''s not the only way to monitor what''s going on.


    +   - On the lighter side, you can also use watch to periodically run other programs.
    For example, watch -n 5 fortune will display a new fortune every five seconds.


