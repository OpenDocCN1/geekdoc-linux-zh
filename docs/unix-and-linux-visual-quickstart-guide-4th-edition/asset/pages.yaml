  md: "# Adding to Your zsh Path\n\nOne of the most useful changes you can make to\
    \ your environment is adding to the default path, which is determined by the path\
    \ statement. The path statement tells the shell where to look for commands, scripts,\
    \ and programs. That is, if you issue a command, the path statement tells the\
    \ system to look for that command in each of the named directories in a specific\
    \ order.\n\nBe sure not to remove anything from your path unless you know what\
    \ you are doing, but feel free to add any additional directories to it as you\
    \ want. For example, if you started writing scripts (in Chapter 10), you might\
    \ put them in a scripts subdirectory and add to that to your path.\n\nAs the following\
    \ steps, you change your zsh path by first identifying where your path statement\
    \ is located, then editing the file that contains it (**Code Listing 8.4**).\n\
