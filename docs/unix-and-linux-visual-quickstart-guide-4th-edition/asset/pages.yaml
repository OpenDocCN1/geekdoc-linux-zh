  md: '# Chapter 15


    # Monitoring the System


    Monitoring the system is one of the key responsibilities of a system administrator.
    You need to make sure that everything is as it should be on the system, or tell
    people to call the cops, order a new hard drive, or whatever is required. On a
    single-user system, there''s really much to do, but on a larger system with many
    users, monitoring is a significant part of a system administrator''s job.


    Among other things, you can monitor the system logs (located in /var/log or /var/adm),
    the users logged in, and the overall system load.


    # To monitor logs:


    +   - sudo tail -1000 /var/log/messages

    - more


    Use sudo to gain root access and look at the end (last 1,000 lines) of the messages
    log file. The output of tail is piped to more so you can actually read it.


    or


    +   - sudo tail -f /var/log/httpd/error_log


    If you''re looking for a specific occurrence of an event as happens, you can use
    tail -f to keep displaying the log as new errors, in the case of this log, are
    added to it. In this example, we''re looking at the very end of the Web server''s
    error log, as shown in Figure 15.3.


    ```

    root@example.com ~# tail -f /var/log/httpd/error_log

    Jan 17 05:20:48 [error] cmd /usr/bin/python -m script /var/lib/php

    Jan 17 05:20:48 [error] cmd /usr/bin/python -m script /var/lib/php

    Jan 17 05:20:48 [error] job: TTY=0; exe=/home/www; USER=root

    Jan 17 05:20:48 [error] job: TTY=0; exe=/home/www; USER=root

    Jan 17 05:20:48 [error] job: TTY=0; exe=/home/www; USER=root

    error_log: 102 messages

    error_log: 102 messages

    Jan 17 05:21:15 [error] client 192.168.1.101 File does not exist: /var/www/html/index.php

    Jan 17 05:21:15 [error] client 192.168.1.101 File does not exist: /var/www/html/index.php

    ```


