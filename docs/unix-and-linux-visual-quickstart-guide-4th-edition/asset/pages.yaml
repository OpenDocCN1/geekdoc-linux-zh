  md: '# Chapter 10


    # Creating a Shell Script


    A shell script is nothing more than a list of commands for Unix. To execute a
    shell script, follow these steps:


    +   1. Open your favorite editor and start a script file.


    +   2. Start the shell script with !/bin/sh.


    +   3. Add the shell script code one line at a time. This code will look strangely
    familiar—it’s like code you’ve already used in this book.


    +   4. Save and close the file.


    In the following steps, we’ll show you how to try this out by writing a script
    that prints three lines onscreen (Figure 10.1). Yeah, we know—whoopee—but you
    have to start somewhere, and you can apply the same principles to other shell
    scripts you create.


    # To create a shell script:


    +   1. pico myscript


    +   2. !/bin/sh

    For starters, access the editor of your choice and start a new file. In this case,
    call it myscript.


    +   3. # this is my first shell script

    On the first line of the script, enter #!bin/sh, which specifies the complete
    path to the shell that should run the script.


    +   On the next line, type a # (to indicate a comment), and then add any other
    notes you want to make. It’s always a good idea to use extensive comments in your
    scripts to see what’s going on. Remember, comments are for your reference and
    won’t show up onscreen or do anything.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_206_0.png)


    Figure 10.1 You create shell scripts in an editor one line at a time.


