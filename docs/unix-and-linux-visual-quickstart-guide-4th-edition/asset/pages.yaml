  md: '# Chapter 9


    # Running a Command


    Throughout this book, you''ve been running a single command. Unix doesn''t really
    care if you''re running a built-in command that comes with the system, you installed,
    or a script your friend wrote—it''s all the same as Unix. Code Listing 9.1 shows
    some options on running a command.


    To run a command:


    +   - ls


    At the shell prompt, type the command and press Enter.


    # To run a specific script:


    +   - /home/jdoe/scripts/ls


    It''s certainly possible that you want to write a script that would list the files
    in your directory in a special way—for example, a script to list the files and
    to save the listing into a new file for later reference. (You might name it ls
    if you want to.) To run the specific script, enter the whole path to the script
    (so Unix doesn''t doesn''t just run the first one it finds in your path). See
    Chapter 8 for more about path statements.


    # Tips


    +   - You can combine commands on the same line, as you''ve seen earlier in this
    book. Just use a ; to separate the commands, and you''re set. For example, you
    could do ls; pwd to list files and show the current directory.


    +   - If you use && to combine commands, the system will run both in sequence
    but run only if the first succeeds. For example, you could use mv touch todolist
    todolist.&& touch todolist to move your list to a different file and create a
    new to-do list. If the first command fails (for example, because you don''t have
    permission to create a new file), the second command won''t run.


    ```

    $ [jdoe@Project]$ ls

    keep keeper.jpg kept kidder.txt kiddo

    kidness kidneypie kids kidupate

    ```


    ```

    $ [jdoe@Project]$ /bin/ls

    keep keeper.jpg kept kidder.txt kiddo

    kidness kidneypie kids kidupate

    ```


    ```

    $ [jdoe@Project]$ /home/jdoe/

    scripts/ls

    keep keeper.jpg kept kidder.txt kiddo

    kidness kidneypie kids kidupate

    You listed these files.

    ```


    ```

    $ [jdoe@Project]$ ls ; pwd

    keep keeper.jpg kept kidder.txt kiddo

    kidness kidneypie kids kidupate

    ```


    ```

    $ [jdoe@Project]$ /home/jdoe/Project

    ```


    Code Listing 9.1 To run a script, or program, enter the name and the path at the
    shell prompt.


