    At the shell prompt, type vi. The program starts up and you''ll see something
    like Figure 4.11. The ~ symbols show blank lines below the end of the file.


    +   2. i

    Type i to get into input mode. This itself is a command issued in command mode,
    it won''t show up on the screen.


