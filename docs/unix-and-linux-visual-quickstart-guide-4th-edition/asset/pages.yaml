- img_proc: true
  md: '# Tips


    +   As with using su to become yourself (or another user), you can use su - ensure
    that all of the root environment variables are set correctly. If you just use
    su without the hyphen, environment variables and the like will be set for only
    the root identity and not you. Which is more appropriate depends on your situation.
    If you get unexpected error messages (file not found, for example) with one approach,
    try the other.


    +   If you''re connecting to a system with telnet (as opposed to ssh), do not
    become root. The root password could be "snified" by malicious users, and if a
    hacker gains your root password, you''re potentially in big trouble. Your best
    choice is just to use ssh or to use sudo if ssh is simply impossible.


    +   Usually, you''ll have to log in to a system as you, and then become root.
    It''s a rare system that will allow you to log remotely as root. Again, this is
    a security measure to help minimize the possibility of break-ins. Even if someone
    gets the root password on a system, they can''t act as root if they can''t log
    in as a normal user.


    +   There are no real secrets on a Unix system. If you have something that must
    be a secret, you must encrypt it, or the root user (as well as other users) could
    know it.'
