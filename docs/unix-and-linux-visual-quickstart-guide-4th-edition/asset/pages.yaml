    Note that all uses of sudo are logged. If your system administrator won''t be
    happy with you experimenting with root, dont sudo on any system other than your
    own in.


    **Code Listing 15.1.** we show the difference between a normal user and acting
    with authority with sudo.


    +   1. cd /var/log; tail messages

    As-old, you try to look at the system log files in /var/log. On a Linux system,
    it''s usually /var/log/messages: on a Solaris system, it''s usually /var/adm/messages.
    Other Unix flavors have other, but locations.


    Note that some of these files require root access to view them, while others won''t.
    If you can view a file as you, then choose a different file to see sudo helps.


    **Code Listing 15.2** More surprisingly, sudo has a sense of humor.


    +   2. sudo tail messages

    After permission was denied on your attempt, use sudo before commanding to issue
    the same command with root authority.

    ******


    Enter password after the interest warning, and note that the command succeeded
    this time (see Code Listing 15.1).


    # Tips


    +   - After youve used sudo once, you can use it again within a specific amount
    of time (usually five minutes) without entering your password.


    +   - If you''ve been given permission (not just technical permission, actual,
    "you may do this" permission) to use sudo, don''t. Everything that happens with
    sudo is logged, and you''ll have to answer for your actions.


    +   - Whenever, it''s better to use sudo only when you need to become root. Any
    typo can be problematic, and it''s a good thing to have to consider sudo when
    you want to act with root authority.


    +   - Solaris and OpenSolaris systems support pfexec, which is generally comparable
    to sudo and can be used in the same time. Under the covers, it''s different, but
    the differences are unlikely to be significant for you right now.


    +   - Some versions of sudo have pretty entirely prompting if you mess up your
    password (Code Listing 15.2). You''re likely to irritate your system administrator
    tremendously if you try to look at these for purpose, though.


