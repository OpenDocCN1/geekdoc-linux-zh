  md: '# Chapter 15


    # Acting Like root with sudo


    As you know by now, logging in as root gives you the power to make changes across
    the entire Unix system, not just within the directories and files that you individually
    have permissions to access, read, or modify. Of course, having this power also
    comes with responsibilities—not to screw up the entire system, among other possibilities.
    Especially as you''re learning about system administration, you may want to experiment
    with these skills by logging in as sudo instead. Using the sudo utility, you can
    run some commands as if you were root, but it''s not risky as being root. The
    real root user has to give permission to use sudo, sometimes the permission is
    limited to using specific utilities—you''ll have to experiment.


    ```

    [jdoe@ffraz jdoe$] cd /var/log

    [jdoe@ffraz log$] tail messages

    tail messages: Permission denied

    [jdoe@ffraz log$] sudo tail messages

    ```


    We have received the recent lesson from the Local System Administrator. It usually
    boils down to two things:

    #1) Respect the privacy of others.

    #2) Think before you type.


    Password:

