  md: '# Chapter 4


    # # Saving in pico


    You''ll generally save your files whenever you''re editing them—and you should.
    Remember, Murphy is watching you!


    # ## To save in pico:


    Use `Ctrl O` periodically to write ''out'' the text you are editing.


    +   - hairspiders

    - Specify the filename for your file (**Figure 4.5**)


    +   - After you save a file for the first time and want to save new changes, press
    `Ctrl O` and then press `Enter` to confirm the current filename and save it.


    +   - When you exit pico, you''ll get a last chance to save your changes. See
    "Exiting pico" in this chapter for the specifics.


    +   - If you try to save a new file over an existing one—which would obliterate
    the original—pico carefully asks you if you want to overwrite the file. Yes, and
    you''ll no longer have the original; No, and you''ll get to choose a new filename.


