  md: '# Generating Reports with awk


    Back in Chapter 6, we showed how to edit delimited files with awk, which is cool
    because it lets you extract specific pieces of information, such as names and
    numbers, from delimited files. As shown in Code Listing 16.4, you can also use
    awk to generate reports. We start with the information from ls -la command, and
    then use awk to generate a report about who owns.


    # To generate reports with awk:


    +   - ls -la | awk ''{print "$ owned by " \rightarrow "Files" }''


    Whew! In general, pipe ls -la to the long-winded awk command (Yes, this is the
    origin of awkward.) awk then prints the ninth field ($9), the words ''owned by'',
    then the third field ($3), and at the end of the output, the total number of records
    processed (print NR "Total Files\). Code Listing 16.4 shows the printed report.


    # Tip


