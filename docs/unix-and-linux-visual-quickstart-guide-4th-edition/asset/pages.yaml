  md: '# Writing Basic Scripts


    # To write an if-then conditional statement:


    +   1. vi deef


    To begin, access your editor and the script

    file. Here we''re adapting an existing script

    (for feedback) in vi.


    +   2. if [ -f feedback ]


    Start the loop with if, and then follow it

    with a conditional statement, in this case

    if [ -f feedback ], which checks the

    existence of a file named in the

    current directory. If that file exists, then

    the expression is true.


    continues on next page


    # More on If-Then


    Using the steps provided in this test, some of these other if-then possibilities:


    +   * [ -f filename ] checks to see whether a file exists.


    +   * [ ! -f filename ] checks to see whether a file does not exist. The ! symbol
    (not) makes

    test report "true" when the previous example would be "false".


    +   * [ -d name ] checks to see whether name exists and is a directory.


    +   * [ first -nt second ] checks to see whether the modification date of the
    first file or direc-

    tory is newer than the second.


    +   * [ first -ot second ] checks to see whether the modification date of the
    first file or direc-

    tory is older than the second.


    +   * [ -n string ] checks to see whether the string has a length greater than
    0.


    +   * [ -z string ] checks to see whether the string is 0 length.


    +   * [ string1 = string2 ] checks to see whether the first string is equal to
    the second.


    +   * [ \( condition1 \) -a \( condition2 \) checks to see whether both conditions
    are

    true (can include other conditions).


    +   * \( condition1 \) -o \( condition2 \) checks to see if either condition1
    or condi-

    tion2 is true.


    Type man test for more information about creating conditional statements.


