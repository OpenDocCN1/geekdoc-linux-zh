  md: '# Finding Out About Users

    with finger


    Using the finger command, you can find out who is currently logged into the Unix
    system as well as what they''re doing, how long they''ve been logged in, and other
    snoopy, not-necessarily-your-business information

    **(Code Listing 7.9).


    To find out who is logged in

    using finger:


    +   1. finger

    At the shell prompt, type finger to see who else is logged into the system and
    to get a little information about them (Code Listing 7.9).

    2. finger @example.com

    Type finger, @, and a host name (in this case example.com) to find out who is
    logged into another host.

    ingering a different host doesn''t always work, depending on security settings
    on the other computer(s). If the host doesn''t allow it, you''ll get a message
    like the one in Code Listing 7.9.


    | Login | Name | Idle | Login Time | Office | Office Phone |

    |---|---|---|---|---|---||

    | asr | | * | 1 | Jul 24 13:32 | | |

