    is''t essential but can be useful.


    # Tips


    +   - You can also reverse lookups (match-

    ing to name). This can be handy

    for identifying the addresses of unknown

    e-mail (from the email headers), among many other tasks.

    Use lookup 192.168.1.23 (substituting

    t appropriate IP address) or dig -x

    192.168.1.82 to match an address

    name. Note that many servers have a

    single IP address that supports many

    domain names, so the answer from this

    not be as definitive as it looks.


