  md: '# Chapter 15


    # Setting the Date and Time


    Setting the date and time is very important for a system administrator. Why Because
    you find something inappropriate or problematic in your log files (e.g., repeated
    unsuccessful login attempts from a source location), you will be able to accurately
    cross-reference your log files with the files of your colleagues at the other
    location. That can happen only if the time on both hosts is pretty close to accurate.


    To set the time with nptdate:


    +   - sudo /usr/sbin/nptdate pool.ntp.org  Use nptdate with the name of a time
    server (currently available servers are listed at www.ntp.org) to update your
    system clock to the current time (Code 15.7). If you get an error message about
    the socket being in use, use ps -ef grep to find the ntp daemon that''s running
    to keep your time synchronized. If this happens, your time is probably OK and
    doesn''t need to be set.)


    +   - sudo date -s "Tues Jan 25 5:30:2010"


    or


    If you have nptdate, you have to set the time manually. Use sudo, date with the
    -s option, and all rest of the needed information. (If you need to change, only
    the time, you can just provide the time, as in sudo date -s 5:45).


    # ✓ Tip


    It''s much better to use nptdate or have the ntpd daemon run to keep your time
    up-to-date at all times. Use date manually is a poor choice.


    ```

    [jdoe@frazz jde]$ sudo /usr/sbin/nptdate

    + pool.ntp.org

    27 Jan 05:26:50 nptdate[1470]: adjust time

    - server 192.168.96.3 offset -0.000140 sec

    [jdoe@frazz jde]$ sudo date -s 5:30

    Mon Jan 25 07:30:00 MST 2010

    [jdoe@frazz jde]$ sudo date -s "Tues"

    Tue Jan 25 05:30:21 MST 2010

    [jdoe@frazz jde]$ sudo date -s "Mon Jan

    - 27 5:30:21 2010"

    ```


    ```

    [jdoe@frazz jde]$ date

    Mon Jan 27 05:30:35 MST 2010

