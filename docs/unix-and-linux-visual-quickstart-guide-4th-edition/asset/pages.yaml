  md: '# Changing Ownership of Files and Directories with chown


    Suppose you''ve been working on a file called sailboat, and your boss decides
    to let a coworker, Merrilee, take over the project. In this case, to fully pay
    off your project to your coworker, you need to change ownership of the file from
    you to her. Depending on how your system administrator set up the system, you
    can often change ownership of files using chown (Code Listing 5.6).


    To change ownership with chown:


    +   1. ls -l


    For starters, type ls -l at the shell prompt to verify the file name and ownership,
    as in Code Listing 5.6. Remember that the ownership information is located after
    the permissions and linking information.


    +   2. chown merrilee rowyour


    Type chown followed by the person you want to transfer ownership to and the filename.
    In this case, the chown command changes the ownership for rowyourboat to merrilee.
    rowyourboat and its associated problems will now be hers, and life will be a dream.


    ```

    ejr@hobbes merrilee]$ ls -l

    total 26

    -rw-rw-r- 1 ejr users 24850 Jul 24 15:17 rowyourboat

    [ejr@hobbes merrilee]$ chown merrilee rowyourboat

    [ejr@hobbes merrilee]$ ls -l

    total 26

    -rw-rw-r- 1 merrilee users 24850 Jul 24 15:17 rowyourboat

    [ejr@hobbes merrilee]$

    ```


    Code Listing 5.6 Changing ownership of files transfers complete control.'
  merge: -1
