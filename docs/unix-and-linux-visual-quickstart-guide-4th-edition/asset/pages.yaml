  md: '# Being Root


    # Tips


    # Installing Software


    +   - The /etc/motd file is really handy for providing warnings, notes, and comments
    to system users. Particularly if you''re planning on having system downtime for
    maintenance, it''s nice to warn users with a message in /etc/motd.


    As root, you can also install your own software. The old way, was a bit challenging
    at times, is outlined on the Web in our online chapter, "Compiling and Installing
    Your Own Software" (see the Intro for more information).


    +   - Virtually every change you might make in /etc will also affect everyone
    on the system. Be careful.


    The new way, though, is easier. Most newer Unix and Linux systems, you can use
    a special program that will go out on the Web and download the program you need
    (along with any supplemental programs needed for your choice to run) and install
    it automatically. Whe!


    +   - Depending on what you choose to change or in /etc, you might need to restart
    the appropriate daemon (as described in the previous section) for your changes
    to take effect. If it looks like your change worked, restart the daemon.


    For example, on Ubuntu Linux, if you want to install the fortune application so
    you can see more or clever sayings than otherwise, you can simply type sudo apt-get
    fortune and stand back.


    +   - Man pages also usually describe the configuration files found in /etc. Use
    man (as in, man exports) to find out what the configuration does.


    The comparable method on OpenSolaris is pexec install fortune.


    On CentOS, RedHat, SuSE, and others, you use sudo rpm --install fortune.


    For all of these cases, we encourage you to explore the man pages for the command
    of your choice—you can do a lot with these commands, and it''s worth a couple
    of minutes to read up on the options.


    In all of these cases, you can accomplish the same thing using a spiffy GUI from
    your Unix desktop. Not only does this install the software, but it also tells
    you what''s available to choose from. Poke around the desktop menus (if you have
    more than just a ssh connection to your system) and see what you can find. For
    things like “Package Manager,” and you’ll be set.


