  md: '# INTRODUCTION


    Greetings, and welcome to Unix and Linux!


    In this book, you''ll find the information you need to get started with the operating
    system, advance your skills, and make Linux or Unix do the hard work for you.
    This book focuses on the most common Unix and linux commands, but it also gives
    you ideas for working smartly and efficiently.


    For the purposes of this book, Unix and Linux are pretty much interchangeable—the
    commands and usages are the same. You may find small differences among Unix versions
    or between specific Unix or Linux versions, but they''ll be small indeed.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_11_0.png)'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction


    # # How Do You Use This Book?


    We designed this book to be used as both a tutorial and reference. If you are
    a Unix newbie, you should start at the beginning and work through the first several
    chapters. As you progress through the chapters, you''ll build on concepts you
    learned in previous chapters. Then, as you become more proficient, you can start
    choosing topics depending on what you want to do. Be sure to refer the table of
    contents, index, and the appendixes to find information at a glance.


    If a line of code in a numbered step is particularly, the code might wrap to a
    second line. Just type the characters shown, without pressing `Enter` until the
    end of the command. Also, in listings throughout the book, a single line of code
    on screen might wrap to two lines in the book. If this happens, the continuous
    line will start with a ~ , so it might look like this:


    The beginning of code starts here → but continues on this line.


    Sometimes you will have to press a special key or combination-like `Ctrl-C` to
    cancel a key press. We will use this special keyboard format for keys, not for
    multiple letters, or symbols you might type.


    The commands used throughout this book apply to any version of Unix (or Linux)
    you might be using, including OpenSolaris, Solaris through your local Internet
    provider, Linux, AIX or HP-UX at work, your Mac OS X Linux system, or any flavor
    (that''s the technical term) you can find. You can run Unix from your Windows
    system with Cygwin or VirtualBox. You will find more about flavors and getting
    access to Unix in Chapter 1.


    Finally, most sections end with a couple of hints. Look here for ways to combine
    Unix commands, suggestions for using commands efficiently, and for finding out
    more information.


    # # Bonus Chapter Online


    Each chapter covers topics, each of which is presented in its own section. Each
    section begins with a brief overview of the topic, including examples or descriptions
    of how or when to use a command.


    You can download an additional chapter of this book, titled "Compiling and Installing
    Your Own Software", free for the publisher''s Web. Simply register for a free
    account at //peachpit.com, and then, while signed in at your Account page, register
    the book using its ISBN, 032163783. After you register the book, a link to the
    additional content will be listed on your Account page under Registered Products.
    You can also access the book''s Web page directly at www.peachpit.com/unixlinuxvx.


    Next, you will find a step-by-step (or a couple of them) to show how to complete
    a process. Note that the code you type appears as the numbered step, and a description
    follows it, like this:


    +   - The code you type will appear in a block font.


    An explanation will appear in this more regular font. Here, we often describe
    what you''re typing, giving alternates, or provide cross-references to related
    information.


    xii'
