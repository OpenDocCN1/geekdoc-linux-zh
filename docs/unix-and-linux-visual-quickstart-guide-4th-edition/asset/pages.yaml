  md: '# Getting Familiar with Unix Internet Lingo


    Before you venture out onto the Internet using the information in this chapter,
    you should become familiar with some concepts and terminology.


    A server is a computer that stores data and ''serves'' whenever requested. For
    example, you might think of a Web server as a big storehouse for .html files.
    Its job is to store request files, wait for another computer to find the requested
    files and ''serve'' them to the requesting computer. And, yes, your Unix system
    might be a Web server, but it doesn''t have to be.


    A client is a program that runs on your Unix system and is used to access data
    on a server. For example, your lynx browser is a client—that is, it runs on your
    Unix system and is used to access files on a Web server.


    An IP (Internet Protocol) address is the address of a specific computer. This
    address identifies it, much the way your street address identifies your home.
    You use IP addresses, for every time you access a Web page. You might type www.ray.com
    (which is called the host name), but behind the scenes, that''s translated into
    a specific IP address, such as 192.168.141.12. You will use host names (such as
    www.oracle.com or www.sun.com) more often, because they''re easier to remember
    than a string of numbers. Whether you type in a character address or a number
    address, all you''re doing is accessing a specific address for a specific computer.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Accessing the Internet


    Table 12.1

    Internet Ports and Protocols


    | PORT | PROTOCOL |

    |---|---|

    | 21 | ftp |

    | 22 | ssh |

    | 23 | telnet |

    | 70 | gopher |

    | 80 | http |

    | 119 | nntp |

    | 8080 | http (usually for test servers) |


    Protocols are the languages that computers communicate with one another. For example,
    FTP (File Transfer Protocol) is used to transfer files from one computer to another.
    HTTP (Hypertext Transfer Protocol) is used to transfer data on the Web.


    Ports are like a computer''s—they''re “places” that computers listen for connections.
    Most Web servers run at port 80, and com: 80/; if you connect to http://www.ray.com:80
    you''re explicitly saying that you want to talk to the www.ray.com computer, at
    port 80, using HTTP You could specify a different protocol (FTP, for example)
    or a different port (8080, for example) to communicate with the same computer
    in a different way, as Table 12.1 shows.'
  merge: -1
