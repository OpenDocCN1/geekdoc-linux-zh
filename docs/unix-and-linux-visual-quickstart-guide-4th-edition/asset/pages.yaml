  md: '# Chapter 13


    # # Unarchiving files with tar


    You''ll also use tar to unarchive files, where you take all of the individual
    files out of the single tarred file—like dumping the bunch of toys out of the
    tar-box—as shown in Code Listing 13.6.


    ### To unarchive files with tar:


    +   * tar -xf labrea.tar


    At the prompt, type tar -xf (here, x means) followed by the name of the tarred
    file to unarchive. The bunch of once-tarred files will be separated into the original
    files or directories, as shown in Code Listing 13.6.


    # ## To unselect files with tar:


    +   * tar -xf labrea.mammoth


    You can also extract specified files from a tar file. You may do this to restore
    a couple of files from a backup archive, for example. This command extracts the
    named mammoth from the labrea tar and places it back where it belongs (Code Listing
    13.7).


    # ## Tips


    +   * Consider moving files into a temporary directory before you unarchive them.
    When you unarchive, tar overwrites all files with the same names as files that
    are extracted. Using a temporary directory will prevent this.


    +   * Use tar -tf filename to list the files (to check your work, perhaps, or
    find a backup file) without actually unarchiving the files.


    +   * Use tar -xvf filename to see the names of the files as they are extracted
    from the archive.


    ```

    $ej@hobbes compression]$ tar -xf

    → labrea.tar

    $ej@hobbes compression]$ ls -l Labrea/

    total 483

    -rw-r-r- 1 ejr 53678 Jul 27

    → 10:05 bigfile.gz

    -rw-r-r- 1 ejr 128886 Jul 27

    → 10:06 mammoth.jpg

    -rw-r-r- 1 ejr 177607 Jul 27

    → 10:05 house_ue

    ```


    **Code Listing 13.6** untarring files reconstruct the original directory structure.


    ```

    $ej@hobbes compression]$ tar -xf

    → labrea.mammoth

    $ej@hobbes compression]$ ls -l Labrea/*

    -rw-r-r- 1 ejr 128886 Jul 27

    → 10:06 Labrea/mammoth

    $ej@hobbes compression]$

    ```


    **Code Listing 13.7** Extract just a single file to replace a missing or corrupted
    file.


