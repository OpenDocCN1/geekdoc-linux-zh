  md: '# Changing Your Identity

    with su


    Occasionally, you may need to log in with

    userid other than your own or need to relog in

    with your own userid. For example, you might

    want to check configuration settings that

    You''ve changed before logging out to make

    sure that they work. Or, if you change your

    shell, you might want to check it before you

    log out (and you should do that, by the way).


    You can use the su (substitute user) command to either log in as another user
    (Code Listing 3.12) or to start a new login shell.


    ```

    [ejr@hobbes asr]$ ls

    Projects testing

    [ejr@hobbes asr]$ su asr

    Password:

    [asr@hobbes asr]$ ls

    Projects testing

    [asr@hobbes asr]$ su - ejr

    Password:

    [ejr@hobbes ejr]$ ls

    Mail

    editime                 script2.sed

    Projects                fortunes.copy   scripttext.sed

    Xrootenv.0              fortunes1.txt  sedtest

    above.htm               fortunes2.txt  sorted.address.temp

    address.book           groups           temp.htm

    address.temp           history.txt      tempsort

    axome                  html.htm        test

    bogus                   html.mail        test2

    clean                   manipulate      testing.gif

    compression            nmail           testing.wp

    [ejr@hobbes asr]$ exit

    [asr@hobbes asr]$ exit

    [ejr@hobbes ejr]$ exit

    ```


    **Code Listing 3.12** Changing back and forth from one user to another (exiting
    from multiple shells) can get a little confusing, but the prompt often tells you
    who you are and what directory you''re in.'
