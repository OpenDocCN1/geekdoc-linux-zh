    # Tips


    +   - You aren''t bound to one editor or another. You can use any editor at any
    time. We often use pico for email or plain writing because we can type without
    thinking. We switch to vi when we really need power or just want to make a quick
    edit without pico''s menus, which often seem cumbersome to some.


    +   - You can specify a default editor that will launch automatically in programs
    that start up an editor for you. Chapter 8 provides details about setting your
    editor environment variable.


    +   - See Chapter 8 for more information about configuration files, Chapter 10
