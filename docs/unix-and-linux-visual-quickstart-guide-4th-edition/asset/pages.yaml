  md: '# Chapter 11


    # Managing E-mail with procmail


    procmail can help you automatically—or selectively—respond to e-mail. As you''ll
    see, procmail is similar to forwarding e-mail and using the vacation program,
    but you''ll probably find procmail much more flexible.


    To specify how messages should be filtered (to "write a recipe\):


    +   1. vi ~/.procmailrc


    In vi, access your .procmailrc file.


    +   2. Move to the end of the file, below the setup information.


    +   3. :0:

    Start a new recipe with :; as shown in Figure 11.18. (Don''t ask why you use :;.
    That''s the way it is.)


    +   4. * ^TOFBuddies

    Set the criteria for procmail to filter. Here,


    +   * * ^TO tells procmail to examine the TO line (and, actually, the CC line,
    too) of all incoming messages


    +   5. $MAILDIR/FriGolFBuddies

    Specify where the filtered mail should go. In this case, filtered mail would go
    in the FriGolFBuddies folder, but you might filter mail messages from mailing
    lists into a listmail folder.


    +   6. Save and close the file.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_246_0.png)


    ```

    Activate Vacation Program

    :0 {

    | /usr/bin/vacation jdoe


    * ^TOFBuddies

    $MAILDIR/FriGolFBuddies

    ```


    Figure 11.18 Add the recipes of you to your .procmailrc file.


