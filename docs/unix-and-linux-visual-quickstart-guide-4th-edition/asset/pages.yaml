  md: "# Chapter 12\n\n# # Checking Connections\nwith ping\n\nThink of using ping\
    \ as saying “Are you there?” to a remote computer. For example, suppose your trying\
    \ to connect to a Web page but getting no response from the computer. Rather than\
    \ waste and wonder what's going on, type ping to find out if the computer is up\
    \ and functional (**Code List 12.5**).\n\n# ## To check a computer with ping:\n\
    \n+   - ping www.raycomm.com\n  - At the prompt, type ping and the host name to\
    \ connect the connection to a specific host, as shown in Code List 12.5.\n  -\
    \ Depending on your Unix system, it may check the connection one time and report\
    \ the results. Or, it may continue to ping the other computer every second or\
    \ until you tell it to stop. If that's the case, just press [Ctrl+C] to stop it.\n\
    \n# ## Tips\n\n+   - If you're having problems connecting to a particular computer,\
    \ you might consider using traceroute, which pings all the computers on the path\
    \ between A and B. While ping tells you if a host responds or not, traceroute\
    \ will give you an idea of where the problem might lie. See the next section for\
    \ more details about traceroute.\n\n+   - The ping command doesn't provide a definitive\
    \ answer to the status of the remote computer. Some systems are configured not\
    \ to respond to pings for security reasons. If you get a response from ping, the\
    \ system is definitely up and you can communicate with it; however, a lack of\
    \ response from ping may not mean anything about that system's status.\n\n```\n\
    [ejr@hobbes ejr]$ ping www.raycomm.com\nPING www.raycomm.com (204.228.141.112):\
    \ 56\n- data bytes\n64 bytes from 204.228.141.112: icmp_seq=0\n- ttl=251 time=190.3\
    \ ms\n64 bytes from 204.228.141.112: icmp_seq=1\n- ttl=251 time=197.7 ms\n64 bytes\
    \ from 204.228.141.112: icmp_seq=2\n- ttl=251 time=166.5 ms\n64 bytes from 204.228.141.112:\
    \ icmp_seq=3\n- ttl=251 time=157.5 ms\n- www.raycomm.com ping statistics\n4 packets\
    \ transmitted, 4 packets received\n- 0% loss\nround-trip min/avg/max = 157.5/178.0/197.7\
    \ ms\n```\n\n**Code List 12.5** Using ping, you can find out whether you can connect\
    \ to a specific computer.\n\n254"
