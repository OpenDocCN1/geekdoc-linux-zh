  md: '# Manipulating Files


    # Changing with tr


    Sometimes you just have to make changes to a file to change all occurrences of
    one term or character to another. For example, you might have reversed the case
    in a file (by accidentally typing with Caps Lock on!) and need to change it back.
    Or you might want to turn a document into a list of words (one per line) that
    you can count or sort. The tr utility is just what you need (see Code Listing
    6.20).


    To translate with tr:


    +   - cat limERICK | tr a-za-Z A-Za-z

    At the shell prompt, use the cat command and the pipe to send a file to tr, which
    will translate lowercase to uppercase, and vice versa.


    To break lines with tr:


    +   - cat limERICK | tr -c a-za-Z "\n"

    Change anything that''s not a letter (upper or lowercase) to a new line, breaking
    the limERICK into a list of words. The -c indicates that anything that does not
    match the first set of characters (the complement of those characters) should
    be changed to the new character.


    ```

    $joe@frazz joe$ cat limERICK

    There once a man from Nantucket,

    Who carried his lunch in a bucket,

    Said he with a sigh,

    As he a whole pie,

    If I just had a donut I''d dunk it.


    $joe@frazz joe$ cat limERICK | tr

    → a-za-Z A-Za-z

    THERE WAS A MAN FROM nANTUCKET,

    WHO CARRIED HIS LUNCH IN A BUCKET,

    sAID HE WITH A SIGH,

    AS HE A WHOLE PIE,

    if I JUST HAD A DONUT I''D DUNK IT.


    $joe@frazz joe$ cat limERICK | tr -c

    → a-za-Z "\n"

    once

    was

    a

    man

    from

    Nantucket

    Who

    carried

    his

    lunch

    in

    a

    bucket

    Said

    he

    with

    a

    sigh

    as

    he

    ate

    a

    whole

    pie

    If

    continued

    ```


    continues


    | just

    had

    a

    donut

    dI

    dunk

    it |


    **Code Listing 6.20** Use tr to translate characters in files.


