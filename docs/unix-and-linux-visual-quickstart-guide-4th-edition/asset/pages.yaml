    # Tip


    +   Don''t forget that newer Unix and Linux systems are configured to automatically
    send your e-mail through procmail, even having to turn it on. I recommend trying
    the steps in the task “To specify settings for procmail” first and see if that
    works, and only try the steps in the “To turn on procmail filtering” if just specifying
    settings is insufficient.


    +   3. Save and close the file.

    That''s all you have to do for incoming messages and if they get filtered as intended
    (as you''ll set up in the next section). It''s a good idea to use a different
    e-mail account to send yourself and confirm that your changes work as you expect.


