  md: '# Viewing File Endings with tail


    Occally, you might also need to use tail, which displays the lines of a file.
    tail is particularly handy for checking footers or updating information in a footer
    (see Code Listing 6.5). Just as with head (described in the previous pages), tail
    offers several options for viewing files.


    To view file endings with tail:


    +   - honeydo

    At the shell prompt, type tail followed by the filename. you''ll see the last
    ten lines on the screen.


    To view the endings of multiple files:


    +   - tail -15 honeydo

    Here, you can add a specific number of lines you want to view (-15).


    Pipe the tail command and the files (multiple files indicated with *) to more
    (Code Listing 6.6).


    +   - honeydo* |


    +   Tip

    head and its counterpart, tail, are great for splitting lines. Use wc -1 to count
    the lines. If the file has 500 lines, but you care about only the beginning and
    ending lines, then type -25 filename > filename to put the first 25 lines of the
    file into a new file. Do the same with tail to put the last 25 lines of the file
    into another new file.


    ```

    [ejr@hobbes manipulate] tail honeydo

    Empty diaper pail

    Take garbage out

    -End of today''s list-


