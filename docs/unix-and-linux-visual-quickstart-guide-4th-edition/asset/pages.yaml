  md: "Chapter 15\n\n# Starting, Stopping, and Restarting Daemons\n\nAs root, you\
    \ can do anything on the system, but you shouldn't have much to do at all. Unix\
    \ (or Linux) systems are configured so that the programs should be running all\
    \ the time (like the Web server software, mail server software, or similar programs)\
    \ are automatically started in the background when the system is booted. Then\
    \ you, as root, need only handle crises and problems. (Ha! Easier said than done.)\n\
    \nThat said, sometimes you'll need to start or stop these daemons (programs running\
