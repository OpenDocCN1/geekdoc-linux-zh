  md: '# Sending and Reading E-mail


    +   5. Scroll through the configuration list using the ⇧ and ↓ keys. pine offers
    you gobs of options to configure.Table 11.1** describes the ones you might find
    most useful.


    +   6. Press `Enter` to select the option you want to change.


    +   7. Make your selection or fill in the necessary information.


    +   8. Press `Enter` to exit the configuration menu and return to the setup menu.
    You''ll be prompted to save your changes. If you want to do so, press `Y`; if
    not, press `N`. You''ll then whiz back to the main menu.


    # ✓ Tip


    +   You can customize pine so that it automatically opens your inbox whenever
    you start it. In the initial-keystroke-list, just type 1,v, and press `Enter`
    to specify the initial characters.


    | Option | Description |

    | --- | --- |

    | initial-keystroke-list | Specifies keys for pine to use when starting, just
    as if you''d type them directly. |

    | quit-without-confirm signature-at-bottom | Allows you to exit pine without the
    “are you sure?” message. Puts your automatic signature at the end of the message
    you''re replying to, rather than above it. |

    | saved-msg-name-rule | Sets pine to automatically save your saved messages in
    a specific folder, based on the characters (sender, etc.) of the message. |

    | fcc-name-rule | Sets your file of outgoing messages to be saved in a particular
    folder. We use the recipient option, which filters messages to whom we sent them
    to. |

    | use-only-domain-name | Sets pine to send all outgoing messages with the domain
    name and not the machine name on From: line. For example, our messages come from
    raycomm.com, not from Frazz.raycomm.com |'
