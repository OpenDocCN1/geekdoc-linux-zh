  md: '# Creating and Editing Files


    For the purposes of this book, we''re going to treat vi and nano as equivalent—if
    you have nano, just mentally write that in wherever you see vi.


    pi is distributed with the pine program, if you have pine available to you, you
    likely also have vi. (See Chapter 1 for a reminder on how to find out if vi and
    pi are available to you.) If pi is not available to you, and if you cannot find
    nano either, ask your system administrator to install one or the other.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_85_0.png)


    Figure 4.2 vi gives you a clean screen and makes you remember all of its cryptic
    commands.


    # About vi


    Although vi is likely responsible for much of Unix''s reputation for being complicated
    and confusing, Plus, vi is universally available (unlike pi), so for these two
    reasons, you should consider taking the time to learn it. You might find vi cryptic,
    counterintuitive, and niticky, and for this reason, you might want to choose a
    different editor if you won''t require vi''s capabilities. As **Figure 4.2** shows,
    if you use vi—you''ll have to get used to using menus at your disposal—commands
    like `Esc`;q or `Esc`:%s/vi is arcane/vi is powerful/.


    Yes, continuing the theme from a couple of paragraphs ago, there is an equivalent
    of vi, called vim, that''s licensed differently and that''s somewhat more powerful.
    For basic use—everything in this book and far more—the two are identical. In this
    case, though, you will always find vi, even if it''s really vim (vi may actually
    be a symlink, or shortcut, to vim). If you find vim, though, it will assuredly
    be vim. All commands will be the same, so just dive in and enjoy.'
