    Another handy command you can use is sed, which lets you make multiple changes
    to files, without ever opening an editor. For example, you might use sed to change
    all occurrences of the previous webmaster''s e-mail address to your. We will show
    in this section, you can use sed to make global changes within documents.


    # To make global changes with sed:


    +   - sed ''/oldaddr@raycomm.com/

    -> /newaddr@raycomm.com/g'' address.htm

    -> address-new.htm


    Type sed


    +   - A single quote (''

    - A leading ''s''

    - A slash (/

    - The text want to replace (oldaddr@raycomm.com)

    - Another slash (/

    - The replacement text (newaddr@raycomm.com)

    - Yet another slash (/

    - g, which tells sed to apply the change globally (if you omit the g, only the
    first occurrence on each line will be changed).

    - Another single quote (''

    - The name of the file in which the changes should be made (address.htm)

    - You can redirect the output to a filename (see Code Listing 6.10) or pipe it
    to another command entirely. You can''t redirect to the same filename or you''ll
    end up with no content in your file.


    Code Listing 6.10 Use sed to make changes throughout files, such as the address
    change here.


    # ### Tips


    +   - You can use sed through multiple documents. See Chapter 10 for information
    on how to make a shell script with a loop.

    - Because sed commands can be long and unwieldy, it might be helpful to save the
    commands in a separate file (so you don''t have to retype them). For example,
    if you saved the command s/oldaddr@raycomm.com/newaddr@raycomm.com/g in a file
    called sed.sed, you could use sed -f script.sed address-new.htm to run the sed
    commands from the script file. You can have as many commands as you want in your
    script.sed file.


