  md: '# Combining Commands


    We''ve shown you in this chapter, you use separate commands to uencode/udecode,
    tar/untar, compress/uncompress, and zip/unzip files and directories. A lot of
    times, however, you can pipe commands together and run them in sequence, saving
    time and hassle. For example, as Listing 13.14 shows, you can udecode and gunzip
    files at the same time by piping the commands together. You can also uncompress
    and untar at one time, and you can tar or gunzip at one time.


    To udecode and gunzip at one time:


    +   1. ls -l h*


    Use ls -l to verify the existence of your uencoded and zipped file.


    +   2. udecode -o /dev/stdout home.gz.uue

    → gunzip > home


    Here, we use -o /dev/stdout to send the udecode output to the standard output,
    then pipe the output of the udecode command to gunzip, then redirect the output
    of gunzip to the home file. Whew! See Listing 13.14 for the details.


    ```

    [ejr@hobbes compression]$ ls -l h*

    -rw-rw-r- 1 ejr users 73978 Jul 23 11:15 home.gz.uue

    -rw-rw-r- 1 ejr users 177607 Jul 27 09:34 house.uue

    [ejr@hobbes compression]$ udecode -o /dev/stdout home.gz.uue | gunzip >

