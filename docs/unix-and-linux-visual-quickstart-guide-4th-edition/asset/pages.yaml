- img_proc: true
  md: '# Chapter 5


    # ✓ Tips


    +   - After you change a file''s ownership, what you can do with the file depends
    on the group and other permissions and memberships. The new owner, however, will
    be able to do anything with the file.


    +   - When changing the ownership of a directory, you can add the -R flag to chow
    to make it apply recursively to all files and directories below it.


    +   - If the system does not allow you to use chow to give files away, consider
    using cp to make a copy of a file to accomplish the same thing. If you copy someone''s
    file (that you have permission to read) to another name or location, the copy
    is fully yours. (In giving-the-file-away example, the recipient should use cp.)


    +   - Again here, if you need to make changes to permissions and find you can''t,
    take a glance at sudo to see if that might help you in your situation. As described
    in Chapter 15, sudo provides some users with the ability to act with the power
    of a system administrator, in limited circumstances. Of course, if that doesn''t
    solve your problem, there''s always the next tip.


    +   - Even if you can''t chow, you are still able to request that the system administrator
    change file ownership for you: "Could you please change the ownership of my rowyourboat
    to Merilee, with chow merrilee /home/shared/me/rowyourboat. Thanks!" (This could
    happen because many versions of Unix do not allow nonroot users to change file
    ownership.)'
