  md: '# Getting Information About the System


    # Viewing File Systems with df


    If you''re used to Windows or Macintosh operating systems, you''re probably accustomed
    to seeing separate hard drives (C; D; E: for Windows users, or real names for
    Macs), which are just different storage spaces. In Unix systems, different storage
    spaces are grafted onto the overall tree structure—tacked onto what already exists
    without any clear distinction indicating where actual disk drives are located.
    For example, if you have a folder on a Windows computer, you know that all of
    the subfolders and files within it are located on the same drive. In Unix, everything
    resides within the root directory, but any different directory could be located
    on a different physical drive. You might think of it as tackling a new branch
    onto your artificial Christmas tree.


    These tacked-on storage spaces are called file systems. Particularly if you''re
    running a Unix system (as opposed to just one), you might need to find out what
    file systems are in (or mounted in the system, in technical terms), how much space
    they have, and where they attach to the Unix system (or their mountpoints are).
    You can find out this information using df, in Code Listings **7.3** and **7.4**
    (on the following page).


    | Filesystem | Used | Available | Capacity | Mounted on |

    |---|---|---|---|---||

    | /dev/hda1 | 515161 | 316297 | 172255 | 65% | / |

    | /dev/hdb4 | 66365 | 4916 | 58022 | 8% | /home |

    | /dev/hdb1 | 416656 | 324633 | 70504 | 82% | /usr/local |

    | /dev/sbpcd | 596704 | 596704 | 0 | 100% | /mnt/cdrom |


    ```

    ejr@hobbes ejr$ df

    Filesystem  1024-blocks  Used        Available  Capacity  Mounted on

    /dev/hda1   515161      316297     172255     65%       /

    /dev/hdb4   66365       4916       58022      8%        /home

    /dev/hdb1   416656      324633     70504      82%       /usr/local

    /dev/sbpcd   596704      596704     0          100%      /mnt/cdrom

    ejr@hobbes ejr$ $

    ```


    **Code Listing 7.3** This small Linux system has relatively simple file systems.


    135'
