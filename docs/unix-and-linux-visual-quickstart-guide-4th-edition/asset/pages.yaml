  md: '# Getting Started with Unix


    # Displaying File Contents

    with cat


    Instead of using more to display files, you can use cat ("concatenate") which
    displays files but does not pause so you can read the information. It displays
    the file or files—which by onscreen—and leaves you looking at the last several
    lines of the file **(Code Listing 1.8).**


    The cat command also lets you redirect one or more files, offering a function
    that some versions of more do not.


