  md: '# Customizing pine


    Although pine is rather intuitive to use, it is also quite powerful, giving you
    ample options for customizing it. **Figure 11.9** shows pine''s customization
    screen, as well as a few of the options you can choose.


    To customize pine:


    +   1. pine At the shell prompt, type pine to start the program.


    +   2. M to visit the main menu.


    +   3. S to summon the setup menu.


    +   4. C to access the configuration menu, which is shown in Figure 11.9.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_230_0.png)


    **Figure 11.9** By using the configuration menu, you can tailor pine for your
