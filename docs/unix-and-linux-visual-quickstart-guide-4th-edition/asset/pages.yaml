  md: '# Chapter 5


    # Translating Mnemonic Permissions to Numeric Permissions


    The permissions of a file, as you''ve seen throughout this chapter, come in three—*rwx*,
    for read, write, and execute permissions. And, as you have seen, you specify these
    permissions by specifying that each is either "on" or "off". For example, `u+rwx`
    sets read, write, and execute to "on" for user, while `a+rw` sets read and write
    to "on" for everyone, and `a-x` sets execute to "off" (indicated in directory
    listings with the -).


    Rather than set permissions with letters and hyphens, you can translate them into
    numeric values, using 1 for "on" and 0 for "off". So, *rw-*, would translate into
    the numeric 110. You could think of this as counting in binary—000, 001, 010,
    011, 100, 110, 111, with a 1 in each place that the permission is set to "on".


    Table 5.1 Each of these combinations of on/off permissions (or binary numbers)
    can be expressed as a unique decimal digit between 0 and 7, as shown in Table
    5.1. It is elite that you use set digits


    # Table 5.1


    | MNEMONIC (rwx) EQUIVALENT | BINARY EQUIVALENT | NUMERIC PERMISSIONS |

    | :--- | :--- | :--- |

    | --- | 000 | 0 |

    | -x | 001 | 1 |

    | -w | 010 | 2 |

    | -wx | 011 | 3 |

    | r- | 100 | 4 |

    | r-x | 101 | 5 |

    | rw- | 110 | 6 |

    | rwx | 111 | 7 |


    # To set permissions using numeric equivalents:


    ```

    chmod 777 rowyouroursat

    ```


    Type chmod followed by the desired permissions for the user, group, and other
    using the numeric permissions listed in Table 5.1, followed by the filename. In
    example, we used 777 to set read, write, and execute permissions to "on" for the
    user, group, and other.


    Or, for example, 724 would give the user full read, read, write, and execute permissions,
    the group only write permissions, and other only read permissions.


    # Tips


    +   - Setting permissions with numeric equivalents sets permissions absolute,
    rather than adding to or subtracting from existing permissions.

    - You can use either numeric or mnemonic permissions—whicheveru2013 is easier
    for you. However, you will need to use the numeric system to set default permissions
    that apply when you create new files. See the next section for the full scoop.


    106


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_120_0.png)'
  merge: -1
