  md: '# Chapter 11


    # # Choosing an E-mail Program and Getting Started


    In general, you have a choice of three programs for sending and receiving e-mail
    on a Unix system:


    +   - An e-mail program installed on your local computer or network that interacts
    with the Unix system for you. You might know these programs as mail clients and
    might have used one Thunderbird or Outlook Express. These are handy because they
    usually have a spiffy interface and can handle attachments with a lot of hassle
    on your part, but they''re really Unix e-mail programs. These programs also let
    you store your mail on your desktop system (Windows or Macintosh) or even Unix
    desktops, but those are beyond the scope of the book.


    +   - A Web-based e-mail program that you access through your Web browser on your
    local computer. These include Gmail, Yahoo! Mail, and many more. These are also
    outside the scope of the book (although most of the servers that have Web programs
    actually run Unix or Linux).


    An e-mail program that allows you to use directly on the Unix system. These programs,
    as pine, mutt, and mail, let you send and receive with varying degrees of ease.
    Additionally, pine and mutt let you send attachments with not a lot of hubbub.
    Because the mail remains on the Unix system, you can access your mail from anywhere
    you can access the Internet.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_224_0.png)


    Figure 11.1 pine''s interface and features are intuitive


