    \ It also keeps you from inadvertently accessing someone's files and settings,\
    \ and it keeps you from making changes to the system itself.\n\nTo log in:\n\n\
    +   1. Have your userid (user identification) and password ready.\nContact your\
    \ system administrator if you don't have these.\n\n+   2. Type your userid at\
    \ the login prompt, then press [Enter].nYour userid is sensitive, so you type\
    \ it exactly as your system administrator instructed.\n\n+   3. Type your password\
    \ at the password prompt, then press [Enter].nYour password is sensitive, too.\n\
    \n+   4. Read the information and messages that come up on the screen.\nThe information\
    \ that pops up—the message of the day—might be just funny or lighthearted, as\
