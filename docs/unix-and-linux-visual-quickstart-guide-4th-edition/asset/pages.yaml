  md: '# Chapter 16


    3. read choice


    On the next line, add read followed by the name of the variable to read in. We
    chose choice because we''re using this input to set the preferred EDITOR environment
    variable.


    4. if [ $choice = "vi" ]


    Start an if statement—in this case, one that tests for the vi option.


    5. then EDITOR=/usr/bin/vi ; export EDITOR=; echo "You chose vi!"


    Here, the clause sets the EDITOR environment variable to vi, exports the environment
    variable, and announces your choice.


    6. elif [ $choice = "pico" ]


    Check for your other option with elif (else if). This statement covers the pico
    option.


    7. then EDITOR=/usr/bin/pico ; export EDITOR=; echo "You chose pico!"


    This clause sets the EDITOR environment variable to pico, exports the environment
    variable, and announces your choice.


    8. else echo "Editor unchanged"


    Set up an else statement, which will be used if neither option was entered at
    the read prompt. In this example, if neither vi nor pico was entered, it''ll just
    say that the editor was unchanged.


    9. fi


    End the if statement.


    10. Save and exit.


    11. su - yourid


    At the shell prompt, type su - followed by your user to log in again and test
    the revised login script (Code Listing 16.5).


    > Tip


    +   This technique is very useful for setting the TERM(inal) environment variable
    if you access the system from different remote locations with different capabilities.


