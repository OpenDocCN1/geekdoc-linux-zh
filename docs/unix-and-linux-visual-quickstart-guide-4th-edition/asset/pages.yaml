  md: '# Creating a Signature File


    If you''ve using e-mail for any length of time, you have undoubtedly noticed signature
    files, which appear at the bottom of messages and include contact information,
    company name, and perhaps a short funny quote or saying. You can add a signature
    to your outgoing messages by creating a .signature file (Figure 11.13).


    To create a signature file:


    +   1. pico ~/- signature

    At the shell prompt, type an editor''s name (here we use pico, but you can use
    the editor of your choice (with -)), and then specify the directory (with -) .signature
    filename. Note the leading dot in the filename, which makes the file hidden.


    +   2. Eric J. Ray ejray@raycomm.com

    My thoughts are my own ... is that OK, honey?


    Go ahead, type your signature information (Figure 11.13). We recommend that your
    .signature file include, at minimum, your name and e-mail address. You can also
    add funny sayings ("You know you''re a geek when you refer to the bathroom as
    "downloading") or disclaimers ("My opinions are mine and not my company''s.\ Whatever
    you want, really. Keep your signature as short as possible; long signatures are
    hard to wade through.


    +   3. Save and exit the file.

    If you''re using pico or vi, you can get a quick reminder about this in Chapter
    4.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_239_0.png)'
