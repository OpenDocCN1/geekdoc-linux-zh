  md: '# Automatically Forwarding Incoming Messages


    Suppose you''re the boss of a big project, and everyone uses all the important
    related e-mail messages. You can tell Unix to automagically forward these incoming
    messages to the people who will actually do something about them. Hey, you''re
    the boss, right? Or you just got a different e-mail account, and you want incoming
    mail sent to your old address to your new address. As Figure 11.14 shows, all
    you have to create . forward file.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_241_0.png)


    # To forward incoming e-mail messages:


    +   1. vi ~/forward

    To begin, type at the shell prompt (or the appropriate command for whichever editor
    you use), indicating your home directory (~/), and then type .forward as the filename.


    +   2. mynew@raycomm.com

    Add, as the first line of the file, address what you want your e-mail forwarded
    (Figure 11.14). In addition to forwarding to a single address, you can also use
    . forward file with multiple addresses on lines to send incoming e-mail to several
    addresses at once.


    +   3. Save and close the file.

    Check out Chapter 4 for details about saving and closing files using pi or vi.


    # Tips


    +   Check with your system administrator to see if a . forward file will really
    do what you want. Many newer Linux and Unix systems automatically send mail to
    procmail (and ignore the . forward file), so you might need to use a procmail
    file to forward your mail. It''s equally effective, but different. See "Managing
    e-mail with procmail" later in this chapter for details.


    +   If you want, you can keep a copy of all incoming messages (in your e-box,
    and forward them to unsuspecting recipients). Just type \your@address.com (substituting
    your userid on the current system for your address and to forward the mail for
    other@address.com).


    +   Forwarding messages is also handy if you change ISPs. You can forward all
    messages sent to your old address to your new one, which helps tremendously in
    ensuring you receive all your important messages while friends and coworkers update
    their address books.'
