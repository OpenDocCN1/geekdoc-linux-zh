  md: "# Removing Files with rm\n\nYou can easily—perhaps too easily—remove (delete)\
    \ files from your Unix system. As Murphy will tell you, it’s a good idea to think\
    \ twice before doing this: once you remove a file, it’s gone (unless, of course,\
    \ you plead with your system administrator to restore it from a backup tape—that’s\
    \ another story). At any rate, it’s permanent, unlike deletions in Windows or\
    \ Mac OS, or even many Unix desktop environments like GNOME or KDE, where the\
    \ Recycle Bin or Trash give you a second chance.\n\n| ls | oldfile |\n| --- |\
    \ --- |\n| Completed | soon.to.be.gone.file |\n| $ rm -i soon.to.be.gone.file\
    \ |\n| rm: remove 'soon.to.be.gone.file'? y |\n| $ ls |\n| Completed | newfile\
    \ oldfile |\n\n**Code Listing 2.9** Use rm -i to safely and carefully remove directories\
    \ and files.\n\nYou remove files using rm, as shown in **Code Listing 2.9**. And,\
    \ as you’ll see in the following steps, you can remove files one at a time or\
    \ several at a time.\n\n# To remove a file:\n\n+   1. ls -l\n   List the files\
    \ in the current folder to verify the name of the file you want to remove.\n\n\
    +   2. rm -i soon.to.be.gone.file\n   At your shell prompt, type rm -i followed\
    \ by the name of the file you want to remove.\nThe -i tells the system to prompt\
    \ you before removing the files (Code Listing 2.9).\n\n+   3. ls\n   It is gone,\
    \ isn't it?"
