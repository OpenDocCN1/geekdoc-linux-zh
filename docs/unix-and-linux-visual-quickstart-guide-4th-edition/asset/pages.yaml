  md: '# Chapter 3


    # # Using Completion in the zsh Shell


    The zsh shell also offers completion with added twists over the bash shell for
    the power user. Basically, though, you can type just part of a command, Tab, and
    have the zsh-complete command for you (**Code Listing 3.10**).


    # ## To use completion in the zsh shell:


    +   1. ls


    Use ls to list the files in your current directory.


    +   2. cd pub Tab


    Type a partial command, as shown here, and then press Tab to complete the command.
    In this example, we typed the cd command and part of the public_html directory
    (truncated to pub in the example), and then pressed the Tab key to complete it
    (see Code Listing 3.10).


    ```

    $ ls

    Complete NewProject bogus2

    - ftp pupuppy

    Completed News dead.letter

    - mail temp

    Mail access files

    - public_htmltest

    $ cd public_html

    $

    ```


    **Code Listing 3.10** In this example, we typed only the ls command by cd pub
    and pressed the Tab key; zsh completed the command for us.


    # ## Tips


    +   - In the Z-shell, command completion works even if multiple files match the
    partial command that you type. For example, if you type cd pu (for public_html)
    and there''s another subdirectory called puppy, then press Tab to complete the
    name, the shell will show you the options (public_html and puppy), and cycle through
    the options as continue hitting Tab.


    +   - You can use command completion to complete commands, directory names within
