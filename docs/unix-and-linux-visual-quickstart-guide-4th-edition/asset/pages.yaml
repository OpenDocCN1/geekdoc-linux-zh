  md: '# Chapter 1


    # # Viewing File Contents

    with more


    As you become more familiar with Unix, you''ll want to start exploring the contents
    of files, including some programs and scripts as files you eventually create.

    One of the easiest ways to view file contents is to use the more command, which
    will display screens, a page at a time. As shown in Figure 1.8, long files are
    displayed with "More" at the bottom of each screen


    **To view a file with more:**


    +   1. more fortunes

    At the prompt, type more plus the name of the file you want. You''ll see the contents
    of the file requested, starting at the top (Figure 1.8).


    +   2. Spacebar

    Press Spacebar to see the next screen of information. As you move through the
    file, you can press B to move back through previous screens.


    +   3. Q

    When you''re done, press Q to go back to the shell prompt.


    # ## Tips


    If you want to view just an additional line (rather than an entire screen) when
    using more, press Enter Spacebar.

    You can also use less to view files. less is similar to more, but it''s more powerful
    and flexible. How can less be more and more be? As you''ll see in Appendix C:
    "Commands and Flags," the more command has 10 options or so; the less command
    has about 40.


    You can also view files using the cat command. See the next section instead of
    the full scoop.


