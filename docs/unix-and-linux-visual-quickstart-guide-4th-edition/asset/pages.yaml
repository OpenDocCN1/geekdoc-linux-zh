  md: '# Chapter 1


    # Different types of Unix access


    So, the first question is how you might access a Unix system to get started with
    all of this. Given that this is Unix, you have exactly 1.2 bazillion options.
    Let''s look at these options:


    +   - Connect to a shell account

    - Access your company''s (or school''s organization''s) Unix system

    - Use a live CD, such as an Ubuntu or Solaris CD

    - A Unix installation in a virtual machine on your computer

    - A Unix-only installation on an old or spare computer

    - A Unix/Windows installation on your everyday computer


    # Accessing a shell account


    The traditional approach (back in the old days, when we wrote the first version
    of this book) was to connect to a "shell account" provided by your dial-up ISP.
    That''s still an option, if you have certain ISPs (and with some broadband connections).
    If your ISP offers a shell account, go ahead and use it; it'' still a good option.
    Try Googling "Unix shell account" as well.


    # Accessing your company''s system


    If not (that is, if you have a cable modem, DSL connection, or dial-up connection
    through any of the huge companies that provide Internet access, "not" is the case),
    you still have a ton of options. Check at work; many companies use Unix in a number
    of ways, and if you can provide the system administrator with appropriate quantities
    of cookies or other goodies, you may be able to get Unix access.'
