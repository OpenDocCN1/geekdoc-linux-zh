  md: '# # Using Regular Expressions with grep


    In addition to using grep to search for text strings, you can use grep to search
    for regular expressions. Regular expressions are like wildcards, where you use
    a symbol to represent a character, number, or other symbol. With expressions,
    you can search for different parts of files, such as the end of a line or a text
    string next to another specified text Table 6.1 lists some of the more common
    regular expressions.


    To use regular expressions with grep:


    +   - grep .logan limerick

    Type grep followed by the regular expression and the filename. Here, we''ve used
    the regular expression .logan to find all instances of "logan" that are preceded
    by a single character (Code Listing 6.9). Note that this usage of a . to match
    a single character closely resembles the ? wildcard.

    You could also use multiple periods for specific numbers of characters. For example,
    to find "Dogbert" and "Dilbert", you might use grep D..bert plagiarized_.sayings.

    In some cases, you may need to search the string slightly differently, depending
    on the expression you''re using and the information you''re looking for. Check
    out the additional examples in Table 6.1 for more information.


    ```

    [ejr@hobbes manipulate]$ grep .logan

    -> limerick

    ```


    > [ejr@hobbes manipulate]$ grep .logan

    Worked hard all day on a slogan,

    You see, the slogan''s still broken.

    [ejr@hobbes manipulate]$


    Code Listing 6.9 Use grep with regular expressions to create fancy wildcard commands.'
