    # Making a Script Executable


    ```

    [ejr@hobbes scripting]$ head -2 myscript

    #!/bin/sh

    # This is my first shell script

    [ejr@hobbes scripting]$ chmod u+x myscript

    [ejr@hobbes scripting]$ pwd ; echo $PATH

    /home/ejr/scripting

    -> /usr/local/bin:/usr/bin:/usr/X116/

    -> bin:/usr/local/games:/home/ejr/bin:

    -> home/ejr/scripting

    [ejr@hobbes scripting]$ myscript

    friendsjustfriends

    ```


    In the previous section, we showed you that you can run a shell script by typing
    sh followed by the name of the shell script file. You can also make a script executable,
    which means you can run it by simply typing the script name at the prompt (omitting
    the name of the shell). Doing so is handy because it allows you to use the script
    as conveniently as any other command.

    As Code Listing 10.2** shows, you must set up a little before you can execute
    the script.


    **Code Listing 10.2** After a little onetime preparation, you can run executable
    scripts by typing the script name at the prompt.


    +   1. `-2 myscript`nAt the shell prompt, check to verify that your script has
    the #/bin/sh line at the top to specify the script that it runs. Remember from
    Chapter 6 that it will list the top two lines of the file specified.


    +   2. `chmod u+x myscript`nHere, use the chmod command to give the user(that''s)
    you execute permission. See the section in Chapter 5 called "Changing Permissions
    with chmod" for details on settings.


    +   3. `pwd ; echo $PATH`nDisplay the name of your current directory and the full
    path, and verify that the current directory is in the path. The current directory
    (the one in you just granted yourself execute permission) must be contained in
    the path; otherwise, the script will not be as easily executable from the shell
    prompt.


    +   4. `myscript`nAt the shell prompt, type the name of the script. Assuming that
    your current directory is in the path, the script will run.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_209_0.png)


    continues on next page


