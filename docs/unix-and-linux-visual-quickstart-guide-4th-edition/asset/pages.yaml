    | ejr@hobbes clean]$ !40 |

    | cd |

    | ejr@hobbes clean]$ ejr$ |


    The Z-shell also lets you reuse commands from your session history, which is the
    list of commands you used during a session or in previous sessions (**Code Listing
    3.11**). The functions are here for reviewing your session, reusing commands (instead
    of retyping), and modifying (rather than completely redoing) or complex commands.


    To view session history in the zsh shell:


    +   1. Use zsh as you would, redirecting output, or doing other tasks. For example,
    review the previous chapter and practice the commands you''ve learned so far.

    2. Press ↵ one time.

    Note that the last (previous) command you appeared on the command line, as shown
    in Code Listing 3.11. To reissue the command, press [Enter].

    3. Continue to press [↑] or [↓] to scroll back or forward through your history.
    When you reach a command you want to use, press [Enter].

    If you see a command that''s close but not exactly what you want to use, you can
    edit it. Use across the line. Then, insert text by typing it using [Backspace]
    or [Delete] to delete text. When you''ve modified the command, press [Enter] (you
    don''t have to reach the end of the line to do so).

    4. Type history at the prompt to see a numbered list of previous commands you''ve
    entered.


    **Code Listing 3.11** In this example, we typed the first command, and then pressed
    the [↑] key to reuse the previous command. !40 recycled the 4th command from the
    listing.


