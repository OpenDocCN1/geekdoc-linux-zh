  md: '# # SENDING AND

    Reading E-MAIL


    If you''re anything like us, your whole day revolves around getting goodies in
    your e-mail inbox and sending "highly important" messages (of course, they''re
    important, right?). In any case, sending and receiving e-mail will probably be
    rarer tasks in your Unix experience.


    In this chapter, we''ll introduce you to a few Unix e-mail programs and show you
    how to get started with them. (Of course, just use the instructions that apply
    to the program you''re using!) Then, we''ll show you some clever things you can
    do with Unix, such as creating signature files and sending automatic vacation
    e-mail replies.


    Throughout this chapter, we''ll be referring to a program called pine. Depending
    on your system, you might have pine, or you might have a newer, similar program
    called alpine. The program called alpine is simply a newer version of pine (well,
    there are some licensing changes similar to those with pi nano back in Chapter
    4, but those won''t affect your daily life with e-mail). For your purposes, just
    use the program available—pine or alpine—and know the instructions for each will
    apply to both.


