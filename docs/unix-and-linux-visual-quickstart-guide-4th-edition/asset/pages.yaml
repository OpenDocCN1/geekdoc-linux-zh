  md: '# Changing Permission Defaults with umask


    Every time you create a file, the Unix system applies default permissions for
    you. This is great because, for many uses, the default permissions will be just
    what you want. In other cases, you''ll want to specify different default permissions.


    You can change the default permissions using umask. The umask command uses a numeric
    representation for permissions (as in the previous section), but the numeric value
    you specify here is not the same as the one you use with chmod. (Don''t ask why.
    We assume that Batman and Robin got together and made this command usable only
    by the Wonder Twins when their powers were activated.) So you have to figure out
    the umask value for the permissions you want, then use that value to set the new
    default permissions.


    Note that you cannot execute permissions by default, so you''re only figuring
    out the read and write permissions for u, g, and others.


    # To figure the umask value:


    +   1. 666

    Start with 666. Again, don''t ask why; it''s just what you''re supposed to start
    with.

    2. Figure out which numeric values you use to set your desired permissions with
    the chmod command.

    You might review the previous section, "Translating Mnnemonic Permissions to Numeric
    Permissions," and peek at Table 5.1 in that section.

    3. Subtract that numeric value from 666.

    For example, if the numeric value you use with chmod is 644, subtract that from
    666: 666 - 644 = 022. So 022 is the number you''ll use with umask.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_121_0.png)'
  merge: -1
  pgno: 121
