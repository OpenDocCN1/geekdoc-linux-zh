  md: '# Accepting Input While a Script Is Running


    In the previous section, we showed that you can require information be along with
    the script in order for the script to run, but it''s easy to forget to input the
    information and not get the results you expected. You can also require input while
    a script is running. The script runs, you input some information, and then the
    script continues (probably) using the information that you (Figure 10.8). In this
    case, the script counts misspelled words, but you can apply it to anything you
    want.


    To accept input while a script is running:


    +   1. pico retentive

    Use your favorite editor to edit your script.


    +   2. -e "Which file do you want to analyze?"

    Specify the text for the prompt that you''ll see onscreen. Here, the onscreen
    text will read, "Which file do you want to analyze?"


    +   3. read choice

    At whatever point the script want to accept information, type read followed by
    the name of the variable to accept the input. Here, we name the variable choice.


    +   4. echo "Choice has cat choice | spell | wc -1 misspelled words"

    Echo a phrase (and embedded command) to check the spelling, count the misspelled
    words, and report the number for the file specified. At each place should appear,
    substitute choice.


