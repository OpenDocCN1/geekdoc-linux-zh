  md: '# Introduction


    Often, we''ll tell you to press a combination of keys on the keyboard, as in `Ctrl
    V`. Here, you all do press the `Ctrl` key (not the lowercase `v`) key, both at
    the same time (sequentially is fine also). Even though the keyboard uses capital
    letters (and, thus, the little key icons also do in this book, you would not take
    the extra step to capitalize the V (or whatever) in applying combinations.


    +   - Some commands have flags associated with them (you might think of flags
    as options for the command) For example, you might see the `ls -l` or `ls -a`.
    In each case, `ls` lists the files in a directory, the optional `-l` flag specifies
    that you want the long format, and the optional `-a` flag specifies all files,
    including hidden ones (don''t worry, we''ll go over this again!). Just keep in
    mind that flags are essentially options you can use with a given command.


    +   - You can also put multiple commands on the same line. All you have to do
    is separate the commands with a semicolon (;); `ls; pwd`


    which would list the files in the current directory (ls) and find out what directory
    you''re in (`pwd`)—all in one step!


    So, with these things in mind, see you in Chapter 1!


    # Anything Else You Should Know?


    Yup! Please feel free to send us a message to books@raycomm.com. We welcome your
    input, suggestions, and questions related to this book. Thanks, and we look forward
    to hearing from you!


    Note to Mac Users

    For simplicity, we consistently write `Enter` (not `Return`), `Ctrl` (not `Control`),
    `Alt` (not `Option`), and we refer (not very often, though) to a Recycle Bin (not
    a Trash Can). No slight ignored to those who do not use PCs or Windows—we just
    tried to keep the complexity of the instructions to a minimum.


    xiv'
