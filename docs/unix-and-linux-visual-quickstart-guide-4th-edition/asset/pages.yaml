  md: '# Chapter 2


    # # Moving Files with mv


    Moving directories and files moving them from location (think of location as an
    absolute file path, like /home/ejr/ofFile) in your system to another location
    (say, /tmp/home/ejr/AnotherFile). Essentially, you have only one version of a
    file, and you change the contents of that version. For example, you might move
    a directory when you''re reorganizing your directories and files. Or, you might
    move a file to rename it—that is, move a file from one name to another.


    ```

    $ ls

    Completed existingfile oldfile

    $ mv existingfile newfile

    $ ls

    Completed newfile oldfile

    $

    ```


    Code List 2.8 Files to see the current files, use mv to rename one of the files.


    You move directories and files using mv, as shown in Code List 2.8.


    # To move a file or directory:


    +   1. ls

    To begin, use ls to verify the name of the file you want to move. If you''re changing
    the name of the file, you''ll want to ensure that the new filename is not yet
    in use. Use mv a file to an existing file-name, the contents of the old file will
    be replaced with the contents of the new file.


    +   2. mv existingfile

    Type mv plus the existing filename and the new filename. Say goodbye to the old
    file and hello to the new one (Code List 2.8).

    You use the same process—exactly—to move directories; just specify the directory
    names, as in mv ExistingDirectoryNewDirectory.


    +   3. ls


    Verify that the file is now located in the location you intended.


    # ## Tips


    +   - You can also use mv to move files into out of directories. For example,
    mv Projects/testfile /home/deb/test moves testfile from the Projects and subdirectories
    of the current directory De Bob''s home directory, using the name testfile.


    +   - mv -i oldfilename filename require the system to prompt you before overwriting
    (destroying) existing files. The -i is for "interactive," and it works with the
    cp command.


    +   - Check out Chapter 8 to learn how to use aliases with mv so that the system
    alerts you before overwriting files and you don''t have to remember the -i flag.


    +   - If you use mv and specify an existing directory as the target (as in, mv
    something ExistingDirectory), "something" in this case, will be placed into ExistingDirectory.\Something"
    can be either a file or a directory.


