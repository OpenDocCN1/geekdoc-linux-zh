  md: '# Configuring Your Unix Environment


    # To change your zsh prompt:


    +   1. grep -i PROMPT ~/.zsh; grep -i PS1

    ~/.zsh*


    To begin, search through the configuration files located in your home directory
    and, if necessary, in the /etc directory. It will look something like PROMPT=%n%m@%~
    %#3-%(!.,$.) " # default prompt, as shown in Code Listing 8.6.


    The "Setting Your zsh Prompt Prompt" sidebar will help translate these symbols.


    +   2. cp ~/.zshrc ~/.zshrc-backup; vi

    ~/.zshrc


    Make a backup copy. The ~/.zshrc file is a likely place for your prompt to be
    set, as it is only read when your shell is interactive.


    continues on next page


    # Setting Your zsh Prompt Prompt


    You can set your prompt to contain all sorts of information. The following list
    shows what code to use to add certain kinds of information to your prompt (as
    well as help you translate the code in your existing prompt):


    +   * %u shows the userid of the current user—that''s you.


    +   * %~ shows the current working directory with a ~ notation within your home
    directory.


    +   * %c shows the current directory without the path.


    +   * %t shows the time.


    +   * %W shows the date without the year.


    +   * %d shows the date with the year.


    +   * \n forces a new line, making the prompt appear split on two lines (you need
    single quotes around the prompt).


    +   * %m shows the name of the computer (like the frazz and hobbes examples in
    this book).


    +   * %M shows the complete host name of the computer, including the domain name.


