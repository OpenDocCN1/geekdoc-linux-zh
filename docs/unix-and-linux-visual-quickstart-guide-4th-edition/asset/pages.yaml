  md: '# Splitting Files with split


    Suppose you''re fuzzing with your digital camera and want to share a photo of
    your new computer (what else is cool enough to take pictures of?) via e-mail with
    your friends and family. Access the file, attach it to an e-mail message, and
    then—bang—ISP fails to send the file because it''s too big. Although you could
    modify the file itself—reduce the physical size, reduce the number of colors used,
    or crop nonessential parts,—you can also just split the file with split. For example,
    if the ISP tells you that no files over 0.51 MB will be accepted, you can use
    split to split the files into chunks—using one easy command (Code Listing 6.22).


    ```

    $jdoe@frazz]$$ ls -lh

    total 1.1M

    -rwxxxr-x 1 jdoe jdoe 1.0M Jan 12:42 mongopicture.jpg*

    $jdoe@frazz]$$ ls -l

    total 1060

    -rwxxxr-x 1 jdoe jdoe 1079300 Jan 12:42 mongopicture.jpg*

    $jdoe@frazz]$$ split -b 500M mongopicture.jpg

    $jdoe@frazz]$$ ls -lh

    total 2.1M

    -rwxxxr-x 1 jdoe jdoe 1.0M Jan 12:42 mongopicture.jpg*

    -rw-rw-r 1 jdoe jdoe 500K Jan 13:03 xaa

    -rw-rw-r 1 jdoe jdoe 500K Jan 13:03 xab

    -rw-rw-r 1 jdoe jdoe 54K Jan 13:03 xac

    $jdoe@frazz]$$ split 500K mongopicture.jpg chunk

    $jdoe@frazz]$$ ls -lh

    total 3.2M

    -rw-rw-r 1 jdoe jdoe 500K Jan 13:03 chunkaa

    -rw-rw-r 1 jdoe jdoe 500K Jan 13:03 chubab

    -rw-rw-r 1 jdoe jdoe 54K Jan 13:03 chucac

    -rwxxxr-x 1 jdoe jdoe 1.0M Jan 12:42 mongopicture.jpg*

    -rw-rw-r 1 jdoe jdoe 500K Jan 13:03 xaa

    -rw-rw-r 1 jdoe jdoe 500K Jan 13:03 xab

    -rw-rw-r 1 jdoe jdoe 54K Jan 13:03 xac

    $jdoe@frazz]$$ cat chunhaa chunakac > reconstituted_picture.jpg

    $jdoe@frazz]$$ cmp mongopicture.jpg reconstituted_picture.jpg

    $jdoe@frazz]$$

    ```


    Code Listing 6.22 use split to break files into smaller chunks.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Chapter 6


    # To split files with split:


    +   - split -b 500k mongopicture.jpg


    With that, split gives you three files (xaa, xab, xac) that are each 500 KB (the
    first two) or less (the last one, containing the leftovers). Mail each of those,
    and you''ve squakeded under the ISP''s size limit.


    # Tips


    +   - Control the names of the files by adding a prefix to the end. For example,
    try split -b 500k mongopicture.jpg chunk to get three pieces called chunkaa, chunkab,
    and chunkac.


    +   - use cat to restore the original; for example, cat cat chunkaa chunkab chunkac
    > reconstitutedpicture.jpg.


    +   - If you''re following the photo example used here, note that the recipient
    of the e-mailed file pieces will have to assemble the pieces in order to view
    the photo. Even if the recipient isn''t a Unix user, all systems have utilities
    to accomplish this task. Now, whether your recipient would want to take the time
    or would have the skill to do this is another question. You might check with him
    or her first.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_146_0.png)


