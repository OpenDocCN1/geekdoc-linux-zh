  md: '# Chapter 7


    # Getting System

    Information with uname


    Information about your Unix system might come in handy if you''re planning to
    try some new software or to figure out system idiosyncrasies. Some systems tell
    you this information when you log in. Sometimes, especially if you''re using an
    ISP, you may not have been told any particulars about the Unix system. You can
    easily find out kind of Unix system you are using *uname*, as shown in Code Listings
    **7.1** and **7.2**.


    # To find out the system

    using uname:


    +   1. `uname`nTo begin, type *uname* to find what kind of a system you''re on.
    The Unix system in Code Listings 7.1 and 7.2 is Solaris (aka SunOS). Other systems
    (not an exhaustive list, by any means) are Linux, AIX, BSD, and HP/UX.

    2. `-sr`nAdd the *-sr* flags to the command, yielding *-sr*, to find out both
    the operating system type and the release level. It is useful to determine whether
    specific software is compatible with the operating system.

    3. `-a`nFor the whole yards, use *uname -a* to print all information, including
    the operating system type, host name, version, and hardware. The specifics you
    get here will vary a bit from system to system.


    ```

    ejray@home ~ ssh frizz

    Last login: Wed Oct 10 09:59:09 for frazz

    Sun Microsystems Inc. SunOS 5.9 Generic

    - May 2002

    ejray@frizz $ uname

    SunOS

    ejray@frizz $ uname -sr

    SunOS 5.9

    ejray@frizz $ uname -a

    SunOS 5.9 Generic_112233-01 5un4u

    - spac SUNW,Ultra-S_10

    ```


    Code List 7.1 Variants on the uname command provide all kinds of interesting or
    useful information about the system.


    ```

    ejray@frizz $ uname

    Linux

    ejray@frizz $ uname -sr

    Linux 2.4.19-16mdk

    ejray@frizz $ uname -a

    Linux frazz.raycomm.com 2.4.19-16mdk #1 Fri

    - Sep 20 18:15:05 CEST 2002 i686 unknown

    - unknown GNU/Linux

    ejray@frizz $

    ```


    Code List 7.2 On a different system, the same commands provide slightly different
    details, the basic information remains the same.


    134'
