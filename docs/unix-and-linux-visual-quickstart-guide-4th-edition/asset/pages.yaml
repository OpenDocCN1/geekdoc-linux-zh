    into which you want to put the files (Code Listing 12.3). incoming is often the
    right name to use, particularly on public FTP servers.


    +   5. binary

    Set the file type. You''ll want to use the binary file type for any other files
    than text or HTML; use ascii for text or HTML.


    +   6. put myjokes.gz

