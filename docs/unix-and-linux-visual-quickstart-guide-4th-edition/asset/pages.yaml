  md: '# Chapter 2


    # To remove multiple files:


    +   1. ls -l *.html


    List the files to make sure you know which files you want to remove (and not remove).


    +   2. rm -i *.html


    Using the asterisk wildcard (*), you can remove multiple files at one time. In
    this example, we remove all files in the current directory that end with .html.
    (Refer to Chapter 1, specifically the section called “Using Wildcards,” for details
    about using wildcards.)


    or


    +   1. rm -i dangerous


    Here, -i specifies that you''ll be prompted to verify the removal of a directory
    or file dangerous before it''s removed.


    +   2. rm -ir dan*


    This risky command removes all of the directories or files that start with dan
    in the current directory and all of the files and subdirectories in the subdirectories
    starting with dan. If you''re sure, don''t use the i flag to have the files removed
    without prompting you for confirmation. (Remember that the flags -i could also
    be written as -i or -ri or -r -i. Unix is flexible.)


    # Can You Really Screw Up the System?


    In general, no. When you log in to a Unix system and use your personal userid,
    the worst you can do is remove your own directories and files. As long as you''re
    logged in as yourself, commands you type won''t affect anything critical to the
    Unix system, only your own personal directories and files. Score for Unix—as an
    average user, you cannot break the system. With Windows, though, it can be a different
    story.


    If you have system administrator rights, meaning that you can log in as root (giving
    you access to all the system directories and files), you can do a lot of damage
    if you''re not extremely careful. For this reason, don''t log in as root absolutely
    have to.


    Many systems won''t let you log in as root. Instead, you need to use su or an
    equivalent, as discussed in Chapter 3. There, you''ll find more information about
    su, which can help reduce the risk of being logged in as root.


