  md: '# Chapter 3


    # To log in as a different user with su:


    +   - su as


    At the shell prompt, type su plus the userid of the user you''re logging in as.
    You''ll be prompted for a password just as you were logging in to the system for
    the first time (Code Listing 3.12). If you do not specify a username, the system
    will assume you mean the root user. If you''re logged in as root to begin with,
    you won''t be prompted to give a password. You will be logged in as the new user
    and able to work just as if you were that user, though you''ll be in the same
    directory with the same settings that you had before issued the su command.


    # To start a new login shell with su:


    +   - su - your_id


    At the shell prompt, type su - your_id (of course, use your userid or that of
    the user you want to change). The addition of the hyphen (-) will force a new
    login shell and set all of the environment variables and defaults according to
    settings for the user.


    # Tips


    +   - If you have root access and ssh to the system to administer it, you should
    use su to provide a little extra security. Rather than log in directly as root
    and leave the remote possibility of having your password stolen (sniffed) off
    your local system, log in as yourself, then use su (with no other information)
    to change to root.


    +   - If you switch to another user with su (no hyphen) and the new user doesn''t
    read and execute permissions for the current directory, you will see shell error
    messages. You can disregard these. See Chapter 5 for more about read and execute
    permissions.


    # To return to the previous shell:


    +   - exit


    Type exit at the shell prompt to leave the current shell and return to the previous
    one. If you use exit from the original login shell, you''ll completely log out
    of the Unix system.


