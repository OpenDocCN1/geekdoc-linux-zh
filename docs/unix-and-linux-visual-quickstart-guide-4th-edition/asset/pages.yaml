    # # Finding Out What Processes Are Running with ps


    The jobs we''ve been talking about so far are actually types of processes, *Processes*
    programs, scripts, or commands—anything you do in the Unix system. All processes
    are processes, but not all processes are jobs.


    Occasionally, you may want to find out what processes are running on the Unix
    system. You can do this using **ps**, as shown in **Code Listing 9.12**.


    # To find out what processes are running with ps:


    +   * ps


    At the prompt, type **ps** to see the list of the current processes you''re running
    in your current shell, including processes for your current shell, as well as
    any other jobs (Code Listing 9.12).


    The exact information you will vary from system to system. In general, you''ll
    find the *PID* (process identification) number at the far left and the process
    name at the right.


    Code Listing 9.12 Using ps, you can find out what processes are currently running.


