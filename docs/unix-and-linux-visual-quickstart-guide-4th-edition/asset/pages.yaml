  md: '# Chapter 16


    5. cp $i .bak


    Make a backup copy of each file before you change it. Remember, Murphy is watching
    you.


    6. sed "s/\*BLINK>//g" $i >.new


    Specify your search criteria and replace text. A lot is happening in this line,
    from the left, this command sends sed followed by


    +   * , which starts the command.


    +   * s/, which tells sed to search for something.


    +   * <, which is the first character to be searched for.


    +   * \, which allows you to search for the /. (The \ escapes the / so the / can
    be used in the search.)


    +   * which specifies zero or more of the previous characters (/), which takes
    care of both the opening and closing tags (with and without a / at the beginning).


    +   * BLINK, indicates the rest of the text to search for. Note that this searches
    only for capital letters.


    +   * //, ends the search section and the replace section (there''s nothing in
    the replace section because the tag will be replaced with nothing).


    +   * g, tells sed to make the change in all occurrences (globally), not just
    in the first occurrence on each line.


    +   * , which closes the command.


    +   * $i .new, which indicates that the output is redirected to a new filename.


    (See Code Listing 16.3.)


