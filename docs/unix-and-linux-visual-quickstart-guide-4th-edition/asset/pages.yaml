  md: 'Creating and Editing Files


    # ✓ Tips


    +   A great use for the search-and-replace feature is if you end up with DOS text
    files in your Unix account (by uploading a text file from a Windows machine as
    a binary file, most likely). If you view DOS files through a Unix shell, all the
    lines in the file will end with ^. But if you try to type ^ when you''re searching
    and replace, the ^ won''t show up. What to do? Press `Ctrl|V`, then `Ctrl|M`.
    Just search and replace with `:%/^M/g`. The `Ctrl|V` command “escapes” the following
    character, so you can press it out exactly what the command would otherwise do.
    If you don''t escape `Ctrl|M`, it thinks you just pressed `Enter` and tries to
    execute the unfinished command.


    +   See the section on **grep** in Chapter 6 for information about searching with
    regular expressions.


    +   Add a g at the end of the command to make it apply to all occurrences in the
    file. Otherwise, it applies only to the first occurrence on each line.


