  md: '# Getting Started with Unix


    # Changing Your Password with passwd


    ```

    $ passwd

    Changing password for ejr

    (current) Unix password:

    New UNIX password:

    Retype new UNIX password:

    passwd: all authentication tokens updated

    $ successfully

    ```


    Virtually all Unix systems require passwords to help ensure that your files and
    data remain your own and that the system is secure from hackers and crackers (malicious
    hackers). **Code 1.1** shows how you change your password.


    List 1.1 Change your password regularly using the passwd command.


    Throughout your Unix adventure, you''ll likely change your password:


    +   - You''ll probably want to change your password by system administrator after
    you log in for the first time. Hint,

    - You''ll probably change your password at regular intervals. Many Unix systems
    require that you change your password every often—every 30 or 60 days

    - You might also change your password voluntarily if you think someone might have
    learned it or if you tell anyone your password (although you really shouldn''t
    do anyway).


    # The SSH Preferences Dialog Box


    In the SSH Preferences dialog box, you can fix some of the idiosyncrasies are
    caused by how your ssh program talks to the Unix system. You can''t identify these
    idiosyncrasies until you start using your Unix system, but remember that you can
    fix most problems here. For example:


    +   - If your `Backspace` keys don''t work, look for an option in your ssh or
    telnet program that defines these keyboard functions.

    - If you start typing and nothing happens onscreen, local echo to off.

    - If you start typing and everything shows twice, local echo to off.

    - If you want to be able to scroll up onscreen during your Unix session, change
    the buffer size to a larger number.


    Exactly which options you''ll have vary from program to program, but these are
    ones that are commonly available. Click OK when you''re done playing with the
    settings.


    # To change your password:


    +   1. `passwd`


    +   2. `oldpassword`


    Enter your password—the one you''re currently using. (Of course, in your old password,
    not the sample one we''ve used!) Note that the password doesn''t show up onscreen
    when you type it, in case someone is lurking over your shoulder, watching you
    type, and asking, “Whatcha doing?”


