  md: 'Working with Encoded and Compressed Files


    # Zipping a File or Directory with gzip


    If you want to compress only a single file or directory, you might choose gzip,
    rather than compress. The gzip command is more efficient, so you wind up with
    smaller files than you do with compress. As Listing 13.10 shows, you use gzip
    in much the same way that you use compress.


    To zip a file or directory with gzip:


    +   1. ls -l z*


    At the prompt, use ls -l to confirm the name of the file or directory you want
    to zip. In this example, we''re looking for z (as zipadeedoodah file).


    +   2. gzip zipadeedoodah.tar


    Type gzip followed by the name of the file or directory to zip. The zipped file
    will replace the unzipped version and have a new .gz extension.


    # Tips


    +   - If you want to keep a copy of the original, unzipped file, try gzip -c filetozip
    >


    +   - If the compressed files will be accessed by someone using Windows, you should
    consider using zip, which is discussed later in this chapter. Although gzip is
    more convenient in the Unix world, zip is not the same as an old .zip files used
    in Windows.


    +   - Another utility used for compressing files is bzip (bzip2, actually). You
    can find more information about at www.bzip.org/. It is quite powerful and quickly
    gaining popularity.


    +   - You can tar a group of files and then compress the single file using gzip.


    ```

    [ejr@hobbes compression]$ ls -l z*

    [-rw-r--r-- 1 ej users 501760 Jul 27 10:22 zipadeedoodah.tar

    [ejr@hobbes compression]$ gzip zipadeedoodah.tar

    [ejr@hobbes compression]$ ls -l z*

    [-rw-r--r-- 1 ej users 239815 Jul 27 10:22 zipadeedoodah.tar.gz

    [ejr@hobbes compression]$

    ```


    Code Listing 13.10 Use zip to zip up those bulky tar files.'
