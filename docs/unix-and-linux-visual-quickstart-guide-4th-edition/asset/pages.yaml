  md: '# Manipulating Files


    # Eliminating Duplicates with uniq`


    If you''ve sorted files using the handy-dandy sort command, you might end up with
    results that have duplicates in them. Heck, you might have files with duplicates.
    At your rate, here''s how to find and work with them. As Code Listing 6.18


    you can get rid of duplicate lines using the uniq command (short for "unique")
    in conjunction with sort.


    # Tips


    +   - uniq finds only identical, adjacent (sorted) lines. For example, if you
    have both Jones and jones in your address book, uniq will not identify either
    because they differ in capitalization.


    +   - You can use the -d flag to specify that you want to see only the duplicate
    lines. For example, you want to see all of the people who are in your carpool
    file and your tonight file. You just use sort carpool overnight


    +   - You can sort and eliminate duplicates in one step with sort -u uniq.book.


    # To eliminate duplicates with uniq:


    +   - sort long.address | uniq

    At the prompt, type sort and the filename, | uniq to pipe the output of uniq which
    will not contain any duplicated entries (Code Listing 6.18).


    ```

    [ejr@hobbes manipulate]$ more long.address.book

