  md: '# Chapter 1


    # Piping Input and Output


    In general, you can think of each Unix command (ls, cd and so on) as an individual
    program that Unix executes. For example, if you type cat /etc/motd at the prompt,
    Unix will display the contents of /motd in the /etc directory. Each program requires
    input (in this example, cat, the program, takes the contents of /etc/motd as input)
    and outputs (it, the displayed results).


    Frequently, you''ll want to run programs in sequence. For example, you could tell
    Unix to read your resume and then spell-check it. In doing this, you connect two
    commands together and have them run in sequence. which process the output of one
    program to another is called piping. Depending on what you want to do, you can
    pipe many commands as you want—with the output of each command acting as the input
    of the next.


    Figure 1.7 shows, you pipe commands using the pipe symbol, which is the | character.
    In the following, we''ll pipe the output of the ls command (which lists the contents
    of a directory) to the more command (which lets you read screen at a time). For
    details about more, see "Viewing File Contents with more," later in this chapter.


    # To pipe commands:


    +   - ls | more


    Here, all you include a pipe symbol between the two commands, or without a space
    on both sides of the pipe. This code produces a list of the files in the current
    directory, then pipes the results to more, which lists the results one screen
    at a time (see Figure 1.7).


    ```

    $ jdoe@frazz.raycm.com:~bin

    [jdoe@frazz bin $]$ ls | more

    arch*

    awk*

    basename*

    bash*

    bash2*

    cat*

    chgrp*

    chmod*

    chown*

    consoleclears*

    cp*

    pio*

    cd*

    cut*

    date*

    ddt*

    df*

    dmesy*

    domainname=

    doexec

    domainname=

    echo

    More

    ```


    Figure 1.7 To execute multiple commands in sequence, pipe them using the pipe
    symbol (|).


    # ✓ Tips


    +   - If you pipe more than two commands, you can. Just adding the commands (with
    a pipe symbol in each, like | this) in the order you executed them.


    +   - Remember that the output of each command is piped to the next command. So
    a piped command, as ls | sort, lists files within a directory, then spell-check
    the list, then sort the misspelled words and display them onscreen. The filenames
    that are found in the system dictionary would not appear.


    +   - Venture to Chapter 15 to find out about running a spell-checker and Chapter
    6 to find out about sorting.


