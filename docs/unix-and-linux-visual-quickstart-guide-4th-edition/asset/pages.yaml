  md: "# Understanding Shells and Options\n\nDepending on the particular Unix system\
    \ you're using, you may have several shells available to you. **Table 3.1** describes\
    \ a few of the more common ones. Each of these shells has slightly different capabilities\
    \ and features. Keep in mind that the differences in shells do not affect what\
    \ you can do in Unix; rather, they affect how easily and flexibly you interact\
    \ with the system.\n\nYou'll likely have **bash** as your shell, but you can change\
    \ to one of many other shells fairly easily. As **Code Listings 3.3** and **3.4**\
    \ show, you can start by finding out which shells are available to you. **Figure\
    \ 3.1** shows some shells and how they relate to each other.\n\n![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_67_0.png)\n\
    \n**Figure 3.1** Shell fit neatly into a few \"families\" with the exception of\
    \ a few stragglers. Each shell in a family shares many characteristics with the\
    \ others in the same family.\n\n# Table 3.1\n\n| Common Shells | FEATURES |\n\
    |---|--- |\n| sh | This shell, which is the original Unix shell (often called\
    \ the Bourne), is fine for scripting but lacks a lot of the flexibility and power\
    \ for interactive use. For example, it doesn't have features like command completion,\
    \ e-mail checking, or aliasing.\\ |\n csh and tcsh | This family of shells adds\
    \ great interactive uses but discounts the popular scripting support that sh-related\
    \ shells offer in favor of a C programming-like syntax. Because of the C syntax,\
    \ this is often called the C shell. Unless you're a C programmer, these are unlikely\
    \ to be your best choices. |\n| ksh, bash, and zsh | These provide a good blend\
    \ of scripting and interactive capabilities, but they stem from different sources\
    \ (bash is most similar to sh, hence the Bourne Again SHell name). |"
