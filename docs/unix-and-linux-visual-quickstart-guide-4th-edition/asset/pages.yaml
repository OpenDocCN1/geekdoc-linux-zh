  md: '# Embedding ROT13

    Encoding in a Shell Script


    If you completed the steps in the previous section, you might have noticed that
    you did a lot of typing. And, goodness, if you made it through steps 3 and 5,
    your fingers are probably on strike right about now. If you plan to encode or
    decode with ROT13 frequently, consider embedding the sed commands in a shell script
    to avoid retyping them each time you encode or decode text, as shown in Figure
    16.4. You might refer back to Chapter 10 for details on shell scripts before you
    get started here.


    To create a ROT13 shell script:


    +   vi rot13

    Start a new shell script to process your commands.


    +   #! /bin/sh

    Add the obligatory shell specification, as shown in Figure 16.4.


    ```

    Telnet bobber.rapcom.com

    Connect to... Initial wait...

    #! /bin/sh

    sed g=''abcdefuvwxyzABCDEFGHIJKLMNOPDEFGHIJKLMQRSTUVWXYZ/nopqrstuvwxyzABCDEFGHIJKLMN/$1''
    | more

    ```


    Figure 16.4 A brief shell script makes ROT13 as easy as, well, EBG13.'
