  md: '# Using Advanced Redirection with stderr


    Throughout this book, we''ve been redirecting input to the input, piping the output
    of one command to the input of another, and generally getting fairly fancy. Can
    you believe that there''s even more you can do with redirection?


    Unix provides three channels (technically known as file descriptors) for communication
    between the user and the system:


    +   - Standard input (stdin), which refers to providing information at the shell
    prompt or accepting information from a different program.


    +   - Standard output (stdout), which refers to the output you see whirring by
    your screen after you issue a command—example, if you issue the command find /name
    test.


    +   - Standard error (stderr), which includes error messages you might see whir
    by your screen after you issue a command. You might think of this channel as the
    ''second'' output channel.


    Until now, you''ve been redirecting stdin with stdout with <, |, >, and sometimes
    tee. Everything on stderr has just accompanied stdout. Adding separate redirection
    of stderr to your arsenal can make your Unix experience even more flexible.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Sensational Unix Tricks


    To redirect stderr in zsh, bash, and similar shells:


    +   1. time -p ls


    Use the time utility, covered in Chapter 9, and note that you get both the output
    of ls and the output of time. As it happens, the output of time is on the stderr
    channel, although you can''t see that (the output all just shows up on the screen).


    +   2. time -p ls 2> time-results.txt


    Where you usually put a> to redirect everything to a file, use 2> to redirect
    the second output channel to a. Now you''ll get the output of ls on stdout your
    screen, and the output of time sent to stderr, in time-results.txt (Code Listing
    16.9).


    continues on next page


    ```

    [jdoe@sulley Project]$ ls

    keep keeper.jpg kept kidder.txt kiddo kidneypie kids kidupdate

    [doe@sulley Project]$ time -p ls

    keep keeper.jpg kept kidder.txt kiddo kidneypie kids kidupdate

    real 0.00

    user 0.00

    sys 0.01

    [doe@sulley Project]$ time -p ls 2> time-results.txt

    keep kept kiddo kidneypie kidupdate

    keeper.jpg kidder.txt kids time-results.txt

    jdoe@sulley Project]$ time -p ls 1 >/dev/null

    real 0.00

    user 0.00

    sys 0.00

    jdoe@sulley Project]$ time -p ls >/dev/null 2>&1

    jdoe@sulley Project]$

    ```


    **Code Listing 16.9** Redirecting standard output and standard error separately
    can be handy.


    321'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Chapter 16


    3. time -p ls 1> /dev/null


    Or you can send the stdout to oblivion

    (/dev/null, which just throws it away)

    and get stderr on your screen.


    4. time -p ls 1 >/dev/null 2>&1


    Or you can send the stderr to stdout and

    stdout to oblivion. It''s apparently point-

    less but useful in shell scripts if you care

    only to know whether succeeded or failed. (Note that, technically,

    1> and the old standby are the same—

    but this example makes more sense if you

    regard redirecting stdout (1) and stderr

    (2) explicitly.


    # ✔ Tips


    +   - If you''re using zsh, you''ll need to specify

    t full path to time (/usr/bin/time).

    time is a special zsh built-in command,

    so it works a bit differently from the other

    shells.


    +   - Redirecting stdout and stderr separately

    in csh is more challenging, but you can

    accomplish the same thing with time -p

    ls >& /dev/null. This also works in bash

    and zsh.


    +   - You can echo $ to find out whether

    your command succeeded. You''ll get

    imbus points for being the first person

    who e-mails a valid original example

    the value of this operation to books@

    raycomm.com.


    322'
