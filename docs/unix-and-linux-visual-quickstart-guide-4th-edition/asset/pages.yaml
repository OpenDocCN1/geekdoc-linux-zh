  md: '# Chapter 6


    # ✓ Tips


    +   - Rather use cat to send the file to tr, you can use spiffy Unix redirection
    tools (in this case) to do it. An equivalent command to translate case would be
    a-zA-Z A-Za-z < limerick.


    +   - With tr, you can accomplish all kinds of translations. For example, you
    could set up a bit of a code to keep secret information somewhat secret, by translating
    letters to garble your text, then retranslating when you want them. For example,
