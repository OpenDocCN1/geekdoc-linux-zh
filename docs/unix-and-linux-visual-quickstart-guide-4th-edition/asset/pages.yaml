    \ updated your address book file and send it to your book in addition to putting\
    \ it in your own files. You can do just that, using tee, which redirects output\
    \ to two different places (see Code Listing 6.19).\n\nTo redirect output to two\
    \ locations with tee:\n\n# tee Time?\n\n> You might think of the tee command as\
    \ similar to a plumber's pipe joint—that is, it takes stuff from one location\
    \ and sends out to two different places.\n\n+   * sort address.book new.addresses\
