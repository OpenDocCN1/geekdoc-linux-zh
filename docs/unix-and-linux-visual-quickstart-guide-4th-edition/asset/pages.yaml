  md: '# Getting Started with Unix


    # Connecting to the Unix System


    # About Connecting


    Once upon a time, when dinosaurs roamed the earth, Unix users connected to their
    systems using telnet. With telnet, your password and everything you do is straight
    across the wire and can be easily read by anyone on the same part of the network.
    Yikes is right! That''s why, more and more, ISPs and system administrators require
    something called ssh (Secure Shell) to connect to their systems. With ssh, everything
    is encrypted, precisely why your Web connection is encrypted when you use an e-commerce
    site and see that the padlock in your browser is closed.


    Your first step in using Unix is to connect to the Unix system. Exactly how you
    connect will vary depending on what kind of Internet connection you use, but the
    following steps get you started.


    # To connect to the Unix system:


    +   1. Connect to the Internet, if necessary.

    If you have to start your Internet connection manually, launch it now. If you
    use a fulltime Internet connection at home, work, or school, or if you''re using
    Mac or Linux system at home, just ignore this step.


    +   2. If you want to connect to a remote system, start your ssh program and connect
    to the Unix system.


    Yes, we know you don''t have secrets, but if a hacker logs into your SSH system,
    then that hacker has won 50 percent of the battle for taking over that system
    for any number of illegal activities. And, if you''re 19-year-old so sniffs (the
    technical term) your user identification (often called the user or user ID) and
    password over your cable modem connection (possible), he can probably guess that
    your eBay password, broker password, whatever are the same as or similar.


    Using ssh you can connect to a remote computer (as your ISP''s computer) and work
    if the remote computer was sitting on your desk. ssh brings a remote computer''s
    capabilities to your fingertips, regardless of where you''re physically located.
    (See the ''About Connecting'' sidebar for more information about connection technologies).

    Exactly how you connect to the particular program you use. For Windows users,
    we recommend PuTTY, which is a free ssh client available at www.chark.greenend.org/~gtathom/putty/.
    For Macintosh users (pre-OS X), MacSSH, also free, available at http://sourceforge.net/projects/macssh.


    Throughout this book, we will show examples using ssh. If, for reason, your system
    administrators don''t require ssh, we recommend using it anyway; there is absolutely
    no reason not to, because there are no disadvantages to ssh compared to telnet.
    If your systems do not support ssh, you can use the telnet or login/rsh program
    as alternatives.


    continues on next page


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_21_0.png)'
