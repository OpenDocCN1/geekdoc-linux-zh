  md: '# # CONFIGURING Your UNIX ENVIRONMENT


    Back in Chapter 3, we introduced you to Unix shells—what they are and what you
    can do with them. In this chapter, we''ll take a bit further and look at configuring
    your environment using the **zsh** and **bash** shells. By configuring your environment,
    you can make the Unix system adapt to your needs, rather than adapting to an existing
    environment that may not work for you. These configurations differ (slightly)
    for different shells, so make sure you''re following along with the instructions
    appropriate for the shell you use.


    | Chapter Contents |

    | Understanding your Unix environment |

    | Discovering your current environment |

    | Adding or changing variables |

    | Looking at your zsh configuration files |

    | Changing your zsh path |

    | Changing your zsh prompt |

    | Looking at your bash configuration files |

    | Changing your bash path |

    | Changing your bash prompt |

    | Setting aliases |'
