    foreground (Code Listing 9.8).


    Depending on the job you''re bringing back into the foreground, you may or may
    not get to see the running job onscreen. Sometimes you''ll be ''planked'' back
    into the foreground of the job and be able to enter information as prompted. Other
    times, you''ll just see the prompt for the program returned to the foreground.
    If this is the case, try typing ? (for help), which often forces the program to
    display something onscreen and refresh the display.


