  md: '# Chapter 8


    # Changing Your zsh Prompt


    Your default prompt (the text on the screen in front of the place you type commands)
    may vary a bit, depending on your Unix system; you might see a dollar sign ($),
    a dollar sign and, or other information outlined in the "Setting Your zsh Prompt
    Promptly" sidebar. You can set your prompt to include information that''s handy
    for you.


    You actually have multiple prompts:


    +   - The main prompt that you usually think of as the shell prompt. This prompt
    is called PS1 or just PROMPT.


    +   - A secondary prompt that you see when the system requires additional information
    to complete a command. Logically, this prompt is called PS2.


    You can change either of these prompts using the following steps. You start by
    finding your prompt statement (Code Listing 8.6), and modifying it in your editor
    (Figure 8.2).


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_174_0.png)


    ```

    jdoe@sully - $ grep -i PROMPT ~/*; grep -i PS1 ~/*

    /home/jdoe/.zshrc# configuration for keys umask PROMPT and variable

    /home/jdoe/.zshrc# Set prompts

    PROMPT="%n@%m %3~ %#!(.#)$ " # default prompt

    jdoe@sully - $

    ```


    Code Listing 8.6 Use grep to search your configuration files for a zsh prompt
    statement.


    160'
