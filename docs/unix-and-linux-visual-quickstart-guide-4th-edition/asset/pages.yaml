  md: '# Tips


    +   - Commands from the current session are kept in memory to scroll through,
    while commands from previous sessions are kept in the ~/.bash_history file. You
    can edit .bash_history with any editor to delete unwanted commands or simply delete
    the file to get rid of the history file, which will then be re-created with the
    next command you issue. (A history of commands is a great jumping-off point to
    write a script to do commands automatically. Chapter 10 gives you the specifics.)


    +   - When you''re viewing the history, you can recycle commands by typing an
    exclamation point (!) and the line number of the command you want to run again.
    You''d type !40, for example, to run command 40.


    +   - Use history followed by a number to specify the number of items to list.
