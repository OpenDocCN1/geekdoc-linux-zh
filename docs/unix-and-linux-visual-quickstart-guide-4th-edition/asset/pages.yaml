  md: '# Table 1.1


    # Exploring the System


    Common Unix Directories and Their Contents

    | Directory | Contents |

    | /bin | Essential programs and commands for use by all users |

    | /etc | System configuration files and global settings |

    | /home | Home directories for users |

    | /sbin | Programs and commands needed for system boot |

    | /tmp | Temporary files |

    | /usr/bin | Commands and programs that are less basic to Unix system functionality
    than those in /bin but were installed with the system or that come as part of
    the distribution |

    | /usr/local | Most files and data that were developed or customized on the system
    |

    | /usr/local/bin | Locally developed or installed programs |

    | /usr/local/man | Manual (help) pages for local programs |

    | /usr/share/man | Manual (help) pages |

    | /var | Changeable data, including system logs, temporary data from programs,
    and user mail store |


    With these few keys in hand, you''re ready to start exploring your Unix system.
    In doing so, you can quickly get an idea of what''s available and gain useful
    experience in entering commands.


    Think of your Unix system as a thoroughly kid-proof house: You can look around
    and touch stuff, but you can''t do anything to hurt yourself or the system. So,
    don''t worry! You can''t hurt anything liking around, and even if you tried to
    break something, most Unix systems are configured enough that you could.


    Table 1.1 shows some of the directories you''re likely to find most interesting
    or useful (Appendix B of this book provides a comprehensive list of directories).
    You can use the following steps to get started exploring.


    # To explore locally installed programs:


    +   1. cd /usr/bin


    Change to /usr/bin, which is where most installed programs are.


    +   2. ls | more


    List the files (which will be programs, in this example) and pipe the output to
    more so you can read the names one at a time.


    +   3. ssh


    Type the name of any program you want to run; ssh, in this case, allows you to
    connect to another system and use it as you''re using your Unix system now.


    # ✓ Tip


    +   You can man followed by a command name to learn more about Unix programs.
    See the next section for information about unix help.


