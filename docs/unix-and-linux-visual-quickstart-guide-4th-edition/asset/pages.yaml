  md: '# Chapter 9


    # Suspending Jobs


    Suppose you''ve just started a job that requires no input from you—say, downloading
    files with ftp—and you suddenly realize that you have to finish something else
    right now. Instead of waiting for the files to download or stopping the job completely,
    you can instead suspend the job and resume it later (Listing 9.5). In doing so,
    you can make the Unix system work your way—that is, you don''t lose the progress
    you''ve made toward getting the job done, and you can do the other stuff you need
    to do as well.


    ```

    [ejr@hobbes ej$ ftp calvin.raycom.com

    Connected to calvin.raycom.com.

    220 calvin Microsoft FTP Service

    - (Version 2.0).

    Name (calvin.raycom.com:ejr): anonymous

    331 Anonymous access allowed, send identity

    - (e-mail name) as password.

    Password:

    230 Anonymous user logged in.

    Remote system type is Windows_NT.

    ft>

    [1]+ Stopped ftp calvin.raycom.com

    ejr@hobbes ej$]

    ```


    # To suspend a job:


    +   - While the job is running, press these keys to suspend the process (Listing
    9.5). Ctrl Z doesn''t terminate the process; it pauses the job in the same way
    that pressing the Pause button on your iPod


    Listing 9.5 Susending jobs is just like pushing the Pause button on your iPod.


    # Tips


    +   - After you''ve suspended a job, you can restart it in the background using
    bg, restart it in the foreground using fg, check on its status using jobs, or
    delete it completely using kill. Refer to the appropriate sections in this chapter
    for details on using these commands. (Note that if the suspended job requires
    input from you, as your ftp example above does, then it will be immediately suspended
    if you want to restart it in the background.)


    +   - Because it''s pretty easy to forget that you''ve suspended a job, most shells
    will remind you that "there are stopped jobs" when you try to get out of the system.
    You should either resume the job or kill it before you log out. The Unix system
    uses the terms "stopped jobs" and "suspended jobs" more or less interchangeably.


    +   - You can suspend as many jobs at a time as you want. Just use Ctrl Z to do
    so, then use jobs to check the status of suspended job if you need to.


