    the network outage is and whom you''re waiting to get things up and running.


    # To trace a connection with traceroute:


    +   * traceroute www.google.com

    At the prompt, type traceroute plus the address of the other computer in the connection.
    You''ll see similar to those shown in Code 12.6. Each line in the traceroute output
    represents a computer (or other device) on the Internet that receives your packets
    and passes them to the next computer.


    # Tips


    +   * If you''re experiencing connectivity problems, try using traceroute to several
    different, geographically dispersed hosts to isolate the problem. If you''re in
    the Midwest and traceroute all the way to www.stanford.edu (physically located
    in Palo Alto, California) but not to www.mit.edu (in Boston, Massachusetts), there''s
    likely trouble on the Internet between you and the East Coast.

    * You can specify the traceroute process by using the -n flag; for example, traceroute
    -n hostname. This checks the path using only IP addresses and does not translate
    the IP addresses into host names with you''re familiar.


    +   * Many firewalls do not pass through the ICMP (Internet Control Message Protocol,
    or ping) packets (there''s a tech term for you) that traceroute uses. If you get
    a lot of lines with * * in them, as shown in Code Listing 12.7, that might be
    the problem.


