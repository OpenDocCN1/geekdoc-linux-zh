  md: '# Chapter 3


    # # Viewing Session History

    in the bash shell


    **To view session history in the bash shell:**


    +   1. Use the shell for a little, changing directories, redirecting output, or
    other tasks.

    Take your time. We''ll wait.


    +   2. Press the [+] key one.

    Note that the (previous) command you applied appears on the command line, as shown
    in Code Listing 3.9. To reissue the command, press Enter.


    +   3. Continue to press [+] or [-] to scroll back or forward through history.
    When you reach a command you want to use, press Enter.

    If you see a command that''s close, but not exactly what you want to use, you
    can edit it. Use the arrow keys to move across the line, insert text by typing
    it, and use Backspace or Delete to delete text.

    When you''ve fixed the command, press Enter (you don''t have to be at the end
    of the line to so).


    +   4. history

    Type history at the shell prompt to see a numbered list of previous commands you
    entered.


    ```

