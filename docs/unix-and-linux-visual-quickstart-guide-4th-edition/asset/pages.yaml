    \ is really quite easy. To do so, you just apply the command (introduced in the\
    \ \"Changing Identity with su\" section in Chapter 3), where you change to the\
    \ root identity (**Code Listing 15.3**).\n\nOnce again, we want to stress that\
    \ being root on a Unix system carries with a lot of responsibility. First, you\
    \ must be extraordinarily careful about what you type and what you do. Every system\
    \ administrator there has a horror story wrecking a system (to a greater or lesser\
    \ degree) through careless use of the root shell. We've done it, too. Second,\
    \ you must be very responsible about what you do. You can read anything, see anything,\
    \ and change anything. You can, therefore, easily infringe upon the privacy of\
    \ your users.\n\n# To become root:\n\n+   1. su\n   Enter su to become root.\n\
    \   ******\n\n+   2. \\*\\*\\*\n   Enter the root password when prompted. Note\
    \ that, after you succeed, you'll see a different prompt (#). This is your confirmation\
    \ that you succeeded and are now root (Code Listing 15.3).\n\n+   3. exit\n  \
    \ Enter exit or Ctrl D to exit the root shell and become yourself again.\n\n```\n\
    jdoe /home/jdoe $ su\nPassword:\n[root@sulley jde]# exit\njdoe /home/jdoe $ su\
    \ -\nPassword:\n[root@sulley root]#\n```\n\n**Code Listing 15.3** Becoming root\
    \ is remarkably easy."
