    # To monitor system load:


    +   * top


    Use top to monitor your system loads. Different systems will show distinctly different
    patterns, but in Figure 15.4 if you''ve got used to checking top when everything
    seems normal on your system, you''ll be able to better tell if something is abnormal
    or even what''s wrong when the time comes. Press Q


    +   * Develop scripts that automatically run when you log in and perform the "normal"
    system checks. By doing so, you don''t have to run routine checks manually, and
    you can come to speed quickly on what''s going on.


    +   * Use top -d 2 grep Mem for a running status check on your available memory.
    grep for other characteristics from top output, as appropriate.


    Anything that''s different from usual is worth being concerned about. Check man
    pages or search the Web to find out for sure.


    +   * Tips


    +   * There''s a lot to monitor and a lot to keep up with. Time to read man pages,
    search the Web, and ask around for tips and tricks. A wide variety of utilities
    exist to make these processes easier for you.


