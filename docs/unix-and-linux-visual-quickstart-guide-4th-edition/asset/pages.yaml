    get an appropriate error message if you scheduled something to happen at 55 hours,
    12 minutes, on the ninth day of the week).


    # What Are Those Funky Numbers?


    When entering a cron job, you specify


    +   * Minutes (0–59)

    * Hours (0–23)

    * Day of the month (1–31)

    * Month (1–12)

    * Day of the week (0–6, with Sunday as 0)


    # Tips


    +   When scheduling cron jobs, you need to specify full and absolute paths to
    the files—that is, specify /home/ejroy/file rather than file. Also, if you write
    a shell script and reference it in a cron job, you need to specify paths in the
    shell script as well. cron doesn''t check your personal environment variable settings
    when runs, so the full path name is essential.


    If you replace the number with a *, cron will match all possible values, so, if
    a job is scheduled for


    +   * 1 * *, it will happen at one minute after every hour

    * 15 3 * *, it will happen at 3:15 a.m. every day

    * 59 23 1 * *, it will happen at 11:59 p.m., seven times a year (once in each
    of the months with 31st)

    * 0 12 * * *, it will happen at noon on Sundays


    +   Use cron -l to display a listing of cron jobs.


    You can use a comma to separate multiple values. For example, if you want something
    to happen on the hour and half-hour December, you must use 0,30 * * *.


    Use a hyphen (-) to indicate a range. For example, to schedule something for every
    hour 9 a.m. to 5 p.m. every day, use 9-17 * * *.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_193_0.png)


