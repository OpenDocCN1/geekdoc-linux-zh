  md: '# Configuring Your Unix Environment


    ```

    [ejr@hobbes ejr]$

    + NNTPSSERVER=news.xmission.com

    [ejr@hobbes ejr]$ export NNTPSSERVER

    [ejr@hobbes ejr]$ echo $NNTPSSERVER

    news.xmission.com

    [ejr@hobbes ejr]$

    ```


    By following the steps in this section, you can add or change environment variables
    for the current session. As Code Listing 8.2 shows, for example, you can specify
    a news environment variable (called NNTPSSERVER) that some Usenet news readers
    require to access the news (nntp) server.


    Code Listing 8.2 in the zsh and bash shells, you can add a new environment variable
    by specifying the variable and its value, exporting the variable to the system.


    # To add or change a variable in zsh or bash:


    +   1. NNTPSSERVER=news.xmission.com

    At the prompt, type the name of the variable (in this case, NNTPSSERVER), followed
    by = and the value you want for the variable (here, news.xmission.com), as shown
    in Code Listing 8.2. In this step, you''re setting up the variable and its value
    and making it available to all programs and scripts that run in the current shell
    session.

    If the value contains spaces or special characters, put the value in quotes.


    +   2. export NNTPSSERVER

    Type export followed by the name of the variable. By exporting the variable, you
    make it available to all programs and scripts that run in the current shell session
    (again, Code Listing 8.2).

    Until it is exported, it is a shell variable, which will not be available to other
    processes that this shell starts.


    +   3. echo $NNTPSSERVER

    Optionally, type echo followed by a $ and the name of the variable to have the
    shell tell you what the variable is set to.


    Tip


    +   In bash or zsh, save a step by typing NNTPSSERVER=news.xmission.com.


