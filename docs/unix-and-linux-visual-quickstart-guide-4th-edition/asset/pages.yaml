  md: '# Chapter 13


    # # Unzipping a gzip Filenwith gunzip


    To access gzipped files, you''ll need to unzip them. You do so using gunzip, as
    **Code Listing 13.11** shows.


    ## To unzip a `gzip` file with gunzip:


    +   1. `ls -l *.gz`


    At the prompt, verify the name of the gzipped file with `ls -l` (Code Listing
    13.11).


    +   2. `gunzip zipipedeoodah.tar` and the name of the file to unzip. `gunzip`
    will uncompress the file(s) and return you to the shell prompt.


    # ## Tips


    +   * When you''re unzipping files with gzip, you''re not required to enter the
    file extension. `gunzip zipipedeoodah` would work just well as `gunzip zipipedeoodah.gz`.


    +   * You might encounter gzipped files with a `.tgz` (tarred, gzipped), `.tar.gz`,
    or `.gz` extension. It''ll handle any of those gracefully.


    +   * Some systems don''t recognize the gzip command, so you might need to use
    `gzip -d` to uncompress the files.


    +   * If you have a compressed file that you know is text—oldfunnysaysfhent.gz,
    for example—you can uncompress it (without deleting the original file) and view
    it with a single command: `zcat oldfunnysaysfhent | more`.


    +   * gzip understands how to uncompress most (compressed) files, including those
    compressed with compress or `.zip` files from Windows systems.


    ```

    [ejr@hobbes compression]$ ls -l *.gz

    -rw-r-r- 1 users       53678 Jul 23 06:42 bigfile.gz

    -rw-r-r- 1 users       53678 Jul 23 10:16 bigfile.new.gz

    -rw-r-r- 1 users       239811 Jul 27 10:22 zipipedeoodah.gz

    [ejr@hobbes compression]$ gunzip zipipedeoodah.tar

    [ejr@hobbes compression]$ ls -l *.gz

    -rw-r-r- 1 users       501768 Jul 27 10:22 zipipedeoodah.tar

    [ejr@hobbes compression]$ ls -l *.gz

    -rw-r-r- 1 users       53678 Jul 23 06:42 bigfile.gz

    -rw-r-r- 1 users       53678 Jul 23 10:16 bigfile.new.gz

    ]$

    ```


    **Code Listing 13.11** Use gunzip to uncompress zipped files.


