  md: "# Accessing the Internet\n\n# Surfing the Web with lynx\n\nYou can also surf\
    \ the web with lynx, a text-based browser. It is not as flashy as links and doesn't\
    \ handle many pages as gracefully, but it has its place in your toolbox. Generally,\
    \ you can access the wealth of information available on the Web (Figure 12.7),\
    \ and you can use lynx to easily download-and reform parameters.\n\n# To surf\
    \ the Web with lynx:\n\n+   1. lynx http://www.yahoo.com/\n   At the prompt, type\
    \ lynx followed by the name of a .html file or a Web address. Here, we're accessing\
    \ the Yahoo Web site (Figure 12.7).\n   If you only type in lynx, you'll get the\
    \ default page for your system, which is likely the Yahoo home page or the main\
    \ page for your ISP.\n\n+   2. Surf, surf, surf!\n   See the sidebars \"Navigating\
    \ with lynx\" and \"Useful lynx Keystrokes\" in this section for details.\n\n\
    +   3. Q\n   Press Q to quit and return to the shell prompt. That's it!\n\n# Navigating\
    \ with lynx\n\n+   * (Enter) follows the currently highlighted link to a new page.\n\
    \n+   * returns to the previous page.\n\n+   * Tab moves the highlight to the\
    \ next link in the document.\n\n+   * Shift moves the highlight up to the previous\
    \ link in the document.\n\n+   * M returns to the first screen accessed in the\
    \ session—the one you saw in step 1.\n\n+   * Spacebar scrolls to the next page.\n\
    \n+   * B scrolls to the previous page.\n\n![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_265_0.png)\n\
