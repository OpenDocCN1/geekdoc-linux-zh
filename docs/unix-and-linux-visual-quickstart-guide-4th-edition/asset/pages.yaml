  md: '# Chapter 9


    # # Scheduling Regularly

    urring Jobs with cron


    Suppose you want to send yourself a reminder message before you go home at the
    end of day—say, a reminder to turn off the coffeopot, or suppose you want to make
    a backup copy of specific files each week. You can do this by using the crontab
    command to schedule jobs or scripts to run regularly at times you prefer. In doing
    so, you can schedule tasks to occur specific times and know that the jobs will
    happen unattended (Figure 9.2).


    # ## To schedule a regularly occurring job with cron:


    +   1. crontab -e


    At the prompt, type crontab, followed by the -e flag, which lets you edit your
    cron file. As shown in Figure 9.2, your cron file will appear in your default
    editor. It''s likely to be empty (if you haven''t set up jobs before), but you
    might have some content in there.


    +   2. 55 16 * * 1-5 mail -s "Go home now!"

    - ejray@raycomm.com


    On the first line of the cron file, enter values for minutes, hours, day of the
    month, month, and day of the week, then the command you want to run. See the "Are
    Those Funky Numbers?" sidebar for more details about specifying times and days.
    In this example, we''re sending an e-mail to ejray every weekday at 4:55 p.m.
    reminding him to go home.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_192_0.png)


    > Figure 9.2 The cron file, which is what you specify the cron job, opens in your
    default editor. If you''ve previously specified cron jobs, they''ll show up in
    the editor.


    ```

    55 16 * * 1-5 mail -s "Go Home Now"

    - ejray@raycomm.com < /dev/null












































































    ```


    ```

    "/tmp/crontab.16206" 3 lines,

    - 192 characters written

    crontab: installing new crontab

    [ejray@hobbes ej]#

    ```


    Code Listing 9.4 This job reminds ejray to go home every day. The message toward
    the end indicates that the cron job has been successfully entered.


