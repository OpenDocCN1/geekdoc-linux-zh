  md: '# Discovering Your Current Environment


    A good first step in changing your environment is determining what environment
    you have. Using the steps in this section, you can discover which environment
    and which variables are set—including ones specified in the configuration files
    as ones you set for the current session (**Code Listing 8.1**).


    As you''re going through these steps, you might check out the "Variables Shouldn''t
    Touch" in Your Environment this section for a list of variables you should leave
    alone. Then, in the next section, check out "Variables You Can Mess With" to find
    ones you can change.


    To show your current environment in **zsh** or bash:


    +   - set


    At the shell prompt, type set. You''ll see a list of the current environment and
    shell variables, as shown in Code Listing 8.1. Some of variables may look familiar
    to you (such as the ones showing your shell or user name), others are likely to
    be more cryptic (such as the line showing the last command you ran, in this case,
    _cd).


    ```

    [ejr@hobbes ejr]$ set

    ASH=/bin/bash

    ASH_VERSION=1.14.7(1)

    COLUMNS=80

    ENV=/home/ejr/.bashrc

    UID=500

    HISTFILE=/home/ejr/.bash_history

    HISTSIZE=1000

    SIZE=1000

    HOME=/home/ejr

    HOSTNAME=hobbes.raycomm.com

    HOSTTYPE=i386

    IFS=

    LINES=24

    LOGNAME=ejr

    MAIL=/var/spool/mail/ejr

    MAILCH=60

    PWD=/home/ejr/src-2.5.1

    OPTERM=1

    OSTYPE=Linux

    PATH=/usr/local/bin:/bin:/usr/bin:/usr/

    X11RK=/home/ejr/bin

    PPID=1943

    PS1=[\u@\h \W]\$

    PS2=

    PS4=\=

    PWD=/home/ejr

    SHELL=/bin/bash

    SHLV=3

    TERM=vt220

    UID=500

    USER=ejr

    USERNAME=

    _cd

    [ejr@hobbes ejr]$

    ```


    **Code Listing 8.1** You can find out which variables exist in the zsh or bash
    shells with set.'
