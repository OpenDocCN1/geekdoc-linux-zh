  md: '# Changing the Group Association of Files and Directories with chgrp


    Suppose you have a file called black that is currently being used by the pot group
    and you want to change the file''s permissions so that it can be accessed by the
    kettle group. To do this, you''ll need to change which group file is associated
    with—in this case, change the association from the pot group to the kettle group.
    You can change which group file or directory is associated with using chgrp, as
    shown in Code Listing 5.5.


    **To change group association with chgrp:**


    +   1. ls -l

    Type ls -l at the shell prompt to verify the file''s name and the group it''s
    associated with. Remember that the second column in the middle of the listing,
    just before the file sizes, lists the group membership.

    2. chgrp kettle black

    Type chgrp followed by the name of the existing group you want to be associated
    with and the filename. Here, the chgrp command changes the group association for
    the file called black to the kettle group.


    ```

    [ejr@hobbes permissions]$ ls -l

    total 178

    -rw-rw-r- 1 ejr pot 24850 Jul 24 14:59 black

    -rw-rw-r- 1 ejr ejr 128889 Jul 24 14:33 sage.sayings

    -rw-rw-r- 1 ejr ejr 23890 Jul 24 14:33 sayings

    [ejr@hobbes permissions]$ chgrp kettle black

    [ejr@hobbes permissions]$ ls -l

    total 178

    -rw-rw-r- 1 ejr kettle 24850 Jul 24 14:59 black

    -rw-rw-r- 1 ejr ejr 128889 Jul 24 14:33 sage.sayings

    -rw-rw-r- 1 ejr ejr 23890 Jul 24 14:33 sayings

    ```


    Code Listing 5.5 Pots and kettles can both be black, but only one at a time.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_113_0.png)'
