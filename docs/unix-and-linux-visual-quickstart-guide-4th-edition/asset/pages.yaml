  md: '# Using Directories and Files


    # To create a directory:


    +   1. ls


    Start by listing directories to make sure the planned name doesn''t conflict with
    an existing directory or filename.


    +   2. mkdir


    Type the mkdir command to make a new directory; in this case, it''s called Newdirectory.
    Refer to the sidebar "Naming Directories (and Files)" for guidelines.


    +   3. ls -l


    Now you can use ls -l (the -l flags a long format) to look at the listing for
    your new directory (Code Listing 2.1). The d at the far left of the line indicates
    that it''s a directory and not a file. Of course, if you trust Unix to do as you
    say, you can skip this step.


    # Naming Directories (and Files)


    As you start creating directories (and files), keep in mind the following guidelines:


    +   * Directories and files have unique names. For example, you cannot name a
    directory golf and a file gof. You can, however, have a directory called golf
    and a file called gof. The difference in capitalization makes each name unique.
    with an initial cap, and filenames are all lowercase.


    +   * Directory and filenames, can not include the following characters: angle
    brackets (<), braces ({}), brackets ([]), parentheses (()), double quotes ("),
    asterisks (*), question marks (?), pipe symbols (#), slashes (/), carets (^),
    dollar signs ($), ampersands (&), and tildes (-).


    Different shells handle special characters differently, and some will have no
    problems with these characters. Generally, special characters are more trouble
    than they''re worth.


    +   * Generally, avoid names that include spaces. Programs don''t easily with
    them correctly, so to use spaces you have to use workarounds. Instead, stick to
    periods (.) and underscores (_) to separate words, characters, or numbers.


    +   * Use names that describe the directory''s contents so you easily remember
    them.


    +   * If you attempt to create a directory with a file or directory name that
    exists. Unix will not overwrite the existing directory. Instead, you will be told
    that a file name already exists. Try again with a different name.


    +   * You can create several directories and subdirectories at once with the -p
    flag. For example if you want to create a new subdirectory called Projects with
    a subdirectory Cooking within that a subdirectory called Desserts within that,
    you can use mkdir -p Projects/Cooking/Desserts and get it all at once. Without
    the -p flag, you have to create Projects, which is a longer recipe to make the
    same tree structure.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_45_0.png)'
