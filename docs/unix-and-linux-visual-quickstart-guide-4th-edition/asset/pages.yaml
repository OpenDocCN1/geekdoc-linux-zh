  md: "# Chapter 10\n\n# # Creating If-Then Statements\n\nThe basic principle of *if-then\
    \ statements* is that a certain condition is met, then one does thing; if the\
    \ condition is not met, then another thing happens. That is, if you walk into\
    \ your office in the morning and you sit down your to-do list, then you work.\
    \ If you walk into your office in the morning and you get to lounge all day. Or\
    \ something like that.\n\n```\n```bash\n#!/bin/bash\n# This is my first shell\
    \ script\necho -e \"\\Greetings!\\\"\necho -e \"\\You're looking mighty sharp\
    \ today!\" | in -f | head -1\n\nif in | grep \"feedback\" > /dev/null; then\n\
    \    echo \"There's feedback on the latest project\"\nelse\n    echo \"Oops, no\
    \ feedback yet\"\nfi\n```\n```\n\n**Figure 10.6** *Using if-then conditional statements,\
    \ you can let the computer determine whether something is true or not, and then\
    \ act accordingly.*\n\nAs **Figure 10.6** shows, you can create if-then statements\
    \ using if, then, and else commands. When you set up these conditional statements,\
    \ the computer has to test the condition to determine whether it's true or false,\
    \ in the next example, we set up a fairly simple if-then conditional statement\
    \ requiring the computer to test whether or not a file exists and tell us what\
    \ it finds. Use the following steps to get started with if-then statements, and\
    \ see the “More on If-Then” sidebar in this section to learn how to expand your\
    \ if-then statements."
  merge: -1
