  md: '# Calculating with bc


    Unix ever offers a handy calculator utility that lets you...er..calculate things.
    Just use bc, as shown in Code Listing 14.2.


    To calculate with bc:


    +   1. bc

    At the prompt, type bc. You''ll find yourself at a blank line, waiting for math
    to do.


    +   2. 6*5

    Enter the numbers, operators, expressions, or whatever you want to calculate.
    Use + to add, - to subtract, * to multiply, and / to divide. The answer appears
    on the next line (Code Listing 14.2).


    +   3. Ctrl

    Quit bc when you''re done.


    # Tips


    +   - You can tell bc to calculate expressions within a file using bc filename.
    (Of course, replace filename with the real filename.) Then, bc waits for more
    to do from the command line.


    +   - Type man bc for more details about bc''s capabilities.


    ```

    xmission> bc

    6*5

    30

    xmission>

    ```


    Code Listing 14.2 Using the bc utility, you can calculate and calculate....'
