  md: '# Evaluating Expressions with expr


    Unix also provides expr, which you can use for evaluating expressions. (In this,
    the term expressions refers to the mathematical, logical, scientific meaning of
    the word.) In addition to evaluating mathematical expressions, you can evaluate
    anything else. The expr utility is used in shell scripts—and you''ll probably
    find the value in expr in that context—but it works just fine at command line,
    as shown in Code Listing 14.3.


    To evaluate with expr:


    +   * expr 3 * 4


    At the shell prompt, enter expr followed by the expression it should evaluate.
    In this example, we''re multiplying 3 times 4. (We have to use a \ to escape (protect)
    the * from being interpreted as a wildcard by the shell).


    +   * expr 5 % 3


    Determine the modulo (remainder) of 5 divided by 3. The answer appears on the
    next line (Code Listing 14.3).


    +   * a=$PWD; b=$HOME; expr $a $b


    This cryptic expression sets a to the current directory and b equal the home directory,
    and then compares the two. If returns 1 (true), you''re in your home directory.
    If it returns 0 (false), you''re not.


    # ✔ Tips


    +   * Comparisons within shell scripts allow you to check whether or not something
    is true, and then act accordingly. Chapter 10 for more information.


    +   * The expr man page is not particularly helpful; search the Internet to get
    help with expr.


    | jdoefrazz jdoe expr 3 * 4 |

    | 12 |

    | jdoefrazz jdoe expr 5 % 3 |

    | 2 |

    | jdoefrazz jdoe a=$PWD; b=$HOME; expr $a = $b |

    | 1 |

    | jdoefrazz j$ cd bin |

    | jdoefrazz bin a=$PWD; b=$HOME; expr $a = $b |

    | 0 |

    | jdoefrazz bin$ |


    **Code Listing 14.3** Using the expr, evaluating the value or the truth (or lack
    thereof) of expressions is straightforward.'
