  md: '# ## Tips


    +   - "Regular expression" is often abbreviated as "regexp" or "regex" in Unix
    documentation and Internet discussions.


    +   - The command egrep is closely related to grep, adding a little more flexibility
    for extended regular expressions, but fundamentally works the grep command is
    really egrep—when you type in either one, really running egrep.


    +   - If searching for whole words through large files, use grep for faster searching.
    It uses the same general syntax as grep, but searches only for words (not regular
    expressions) and so goes much faster.


    +   - See Chapter 1 for details about wildcards.


    # Table 6.1 Regular Expressions, Examples, and Explanations


    | REGULAR EXPRESSION | FUNCTION | EXAMPLE | EXPLANATION |

    |---|---|---|---|

    | * | Matches any character. | grep b.rry | This finds all of "berry" or "bar".
    |

    | Matches zero or more instances of the preceding item, so a*b would find "ab"
    as well as "aaab," but not "abc." | grep ''*s*day'' | Here, the * matches zero
    or more of the items immediately precede the *, in this case the letter ''s''.
    |

    | ^ | Matches only instances of the string at the beginning of a line. | grep
    ''^Some'' sayings | With the ^, you can search for the string at the beginning
    of a line. This finds a line with "Some" but not one beginning with "Read Some.\
    |

    | $ | Matches only the string at the end of a line. | grep ''$ach$'' sayings |
    This example finds all lines in the file sayings that end with "ach.\ |

    | Escapes (quotes) the following character—so you can search for literal characters
    like * or $ that are operators. | grep ''\*'' sayings | grep ''\*'' searches for
    all instances of in the file sayings. The \ tells grep to interpret literally
    as an asterisk character, rather than as a wildcard |

    | ] | Matches any member of the set, [a-z], [o-6], or [321] (three or one). |
    grep ''[0-9]'' | Use square brackets ([]) to enclose a set of numbers, number2,
    number3, and so forth in the file called specifications. Here, [0-9] would match
    all specifications options.|


