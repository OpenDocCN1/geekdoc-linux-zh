  md: '# Getting Started with Unix


    # Using Wildcards


    ```

    [jdoe@frazz Project]$ ls

    keep keeper.jpg kept kidder.txt

    - kiddo kidnews kidneypie

    - kids kidupdate

    [jdoe@frazz Project]$ ls ki*

    kidder.txt kiddo kidnews kidneypie

    - kids kidupdate

    [jdoe@frazz Project]$ ls kid*

    kidder.txt kiddo kidnews kidneypie

    - kids kidupdate

    [jdoe@frazz Project]$ ls ??*

    keep kept kids

    [jdoe@frazz Project]$ ls *date

    kidupdate

    [jdoe@frazz Project]$ ls *d*

    kidupdate

    [jdoe@frazz Project]$ ls kid?*

    kidder.txt kiddo kidnews kidneypie

    - kids kidupdate

    ```


    You might think of wildcards as placeholders for omitted letters or numbers. For
    example, if you''re looking for a file but aren''t sure whether it is kidnews
    or kidupdate, you can use a wildcard to stand for the part you''re uncertain of.
    That is, you could list the files of a directory with ls kid (Code Listing 1.7),
    which would list all files with the characters kid. In the result, you would find
    a file named kid if there were one, as well as files that begin with kid but have
    varying endings, such as kidneas, kiddo, or kidneypie.


    You can use wildcards for just any purpose in Unix, although listing files and
    directories will likely be the most common use. Just follow these guidelines:


    +   You use ? as a placeholder for one character or number.


    +   You use * as a placeholder for zero or more characters or numbers. Zero characters
    in case you''re curious, specifies that the search results include all variants
    of kid, including the word itself with no suffix.


    +   You can include a wildcard at any place in a name: at the beginning (*kid),
    some-where in the middle (k*d), or even in multiple places (*kid*).


    **Code Listing 1.7** You use wildcards (? or *) to act as placeholders for missing
    characters.


