  md: '# Working with Your Shell


    # # Fixing Terminal Settings with stty


    ```

    xmission> ls ^?^?^

    : No file or directory

    xmission> stty erase ''^?''

    xmission> ls

    ```


    **Listing 3.13** You can often straighten out a confused nettext or Unix system
    by using an stty command. This fixes the errant key.


    Another handy thing you can do with your shell is to fix those annoying problems
    that occur with terminal programs. Back in Chapter 1, I mentioned that you might
    encounter difficulties such as `Backspace` and `Delete` keys working properly.
    You can fix these problems using stty (Code **Listing 3.13**).


    To fix `Backspace` and `Delete` key oddities with stty:


    +   - `stty erase ''^?''`


    ```

    xmission> jf^H^H

    jf^H^H: Command not found

    xmission> ls ^H^H

    : No file or directory

    xmission> stty erase ''^''

    xmission>

    ```


    **Listing 3.14.** The stty command fixes here the `Delete` key to work like `Backspace`.


    If you''re using `Backspace` to erase characters to the left of the cursor and
    you just get a bunch of `^H` symbols on the screen when you try it, you need to
    educate yourself `erase`. Type `stty erase` to fix it (Code Listing 3.13).


    In cases, depending on your terminal program, you might need to set stty `erase
    ''^H''` and then press `Ctrl H` to backspace. To enter this command, type `stty
    erase` and press `Ctrl V`, then `Ctrl H` (Code Listing 3.14).


    # ## Tips


    +   - If `stty sane` doesn''t fix a messed-up display, try reset or logging out
    and restarting your terminal program.


    +   - You can fix `Backspace` oddities by adding the appropriate stty command
    to your configuration files or by making changes in your terminal client. See
    Chapter 8 for details about and Refer to Chapter 1 for more helpful details about
    terminal programs like ssh and telnet.


    # To fix general terminal weirdness with stty:


    +   - `stty sane`


    Typing `stty sane` at the prompt will fix a lot of oddities. For example, if accidentally
    issue a bad command and all of nothing shows up on the screen or if you see general
    gibberish showing up on the screen, `stty sane` may return your terminal session
    to sanity.


    The reset command is also often effective at fixing a messed-up terminal.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_81_0.png)


    67'
