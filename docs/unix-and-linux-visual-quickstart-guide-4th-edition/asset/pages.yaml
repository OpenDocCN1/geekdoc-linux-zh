    **Code Listing 5.7** Use ls -l to see the permissions on files.


    Suppose you''ve been working on a file called rowspeedboat and you want to have
    coworkers review it. To do so, you''ll need to give other people permission to
    access the document. You can either give people in specific groups access or give
    everybody on the Unix system access. In particular, you can specify permissions
    for u(ser—that you), g(roup), o(thers), and #(ll).


    In addition to specifying permissions, you can also specify how much access a
    person or group can have to your file. For example, you can specify #(read), w(write),
    and e(execute) access, depending on how much you trust them not to ruin your rowspeedboat
    masterpiece.


    As in **Code Listing 5.7**, your first step is to check what the current permissions
    are. Then, you can set permissions, to add them, or remove them as necessary.


    # **Check current permissions:**


    +   * ls -l r*


    To begin, type ls -l r* to get a long listing of rowspeedboat in the current directory.
    Code Listing 5.7 shows that the permissions are rwxr-x---. This is actually three
    sets of permissions:


    +   * For the user (rw-, in this example)

    * For the group (r-x, here)

    * or the world (---, here)


    In this example, the user has read, and execute permissions; the group has only
    read and execute permissions; and all other users have no permissions.


