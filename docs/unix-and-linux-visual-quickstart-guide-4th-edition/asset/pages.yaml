  md: '# Introduction


    # Who Are You?


    Alternatively, you can dabble in Unix invasively by using an account on a system
    at work, or through an Internet service provider. Probably the easiest options,
    if you have a newly computer and are concerned about not messing up what you have,


    We assume that you''ve picked up this book because you already have a need for
    or an interest to learn Unix, or any Unix-like operating system, like Linux, OpenSolaris,
    Mac OS, BSD, HP -UX, AIX, Solaris, or others. We assume that


    +   - You want to know how Unix do things at work, school, or.


    +   - Cygwin to Unix as part of your Windows environment


    +   - You may not have already experience with Unix.


    +   - VirtualBox or other similar programs to run Unix in a "virtual machine"
    as an application in your Windows environment


    +   - You don''t necessarily have either geeky-er, techie-computer skills or experience.


    +   - A bootable Unix (Linux or OpenSolaris) CD to experiment without having anything
    at all your computer


    You want to learn Unix, but probably not want to delve into all of the arcane
    details about Unix.


    # What Do You Need to Know Get Started?


    In short, we assume you want Unix to achieving your goals. You want to know what
    you can do, get an of the potential that a command offers, and learn how to work
    smart.


    As you get learning Unix, keep in mind the following Unix conventions for typing
    commands:


    +   - Unix terminology and commands are typically arcane, cryptic, and funny looking.
    For example, the command to list files or directories is just ls--short and cryptic.
    We''ll walk through the commands one at a time, so you know how to read and apply
    them to your uses. Just follow the steps in the order.


    You can do all of these things using this book. Basically, all you need is access
    to a Unix account or system and a goal (or goals) that you want.


    +   - Unix case sensitive, so type commands follow the capitalization used in
    the book.


    # What Do You Need Computer-Wise?


    Computer-wise, you can learn or experiment with Unix virtually any computer you
    might have available. If you''re using a Mac with OS X or later, you''re all set;
    it is Unix under the hood. If you have an extra computer sitting around, even
    something as old as a Pentium III, you can install different flavors of Unix or
    Linux, including OpenSolaris, Ubuntu, RedHat, or SuSE. Certainly you can install
    Unix on an extra hard drive (or empty space) on your regular desktop computer,
    and generally without affecting your existing Windows configuration.


    +   - Whenever you type a command, you also have to press Enter, if we say


    +   1. funny-looking command goes here you''ll type it, then press Enter, which
    sends the command along to the Unix system.


