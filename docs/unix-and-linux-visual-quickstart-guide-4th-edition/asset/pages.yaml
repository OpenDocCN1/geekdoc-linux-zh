    Jan 25 06:03:00 frank CRON22867: (mail) CMD (/usr/bin/python -S /var/lib/mailman/cron/runner)

    Jan 25 06:04:00 frank CRON22872: (mail) CMD (/usr/bin/python -S /var/lib/mailman/cron/runner)

    Jan 25 06:04:17 fraz sudo: jdoe : TTY=pts/1; PWD=/var; USER=root; COMMAND=/usr/bin/tail
    messages

    [jdoe@ffraz log$]


    Code List 15.1 The sudo command lets you do things that you can''t do as a normal
    user, but that isn''t as risky as being.


