  md: '# Determining Disk Usage with du


    Another piece of information that you can access is how much disk space within
    the Unix system is in. You can do so using du, as shown in Code Listing 7.6.


    To determine disk usage with du:


    +   * du

    At the shell prompt, enter du. As Code Listing 7.6, you''ll get information about
    disk usage in the current directory as in all subdirectories. The numbers are
    usually measured in 1 Kbyte blocks (as df). You can actually read the output by
    using du -h.


    # Tips


    +   * If you''re on a system that enforces disk-space quotas (as many ISPs do),
    you can find out what your quota is and how close you are to reaching it. Just
    type quota -v at the prompt.

    * You can use du with a path name to check the disk usage in a single directory
    or sub True (see Code Listing 7.7) du summarizes the usage by subdirectly as it
    prints the results.

    * Use du -s, optionally with a specific directory, to just print a summary of
    the amount of space used.


    ```

