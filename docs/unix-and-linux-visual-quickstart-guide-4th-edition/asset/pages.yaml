  md: '# Creating and Editing Files


    # # Starting vi and Dabbling with It


    Before you go off to use vi, understand that it has two modes (both of which look
    pretty much like **Figure 4.11**:


    +   - Insert mode (sometimes called input mode), in which the keys you press actually
    show up in the file that you''re editing. Use this mode to add or change text.


    +   - Normal mode (sometimes called command mode), in which every keystroke is
    interpreted as a command. You use this mode to do everything except enter.


    What''s confusing for many people about vi is that it starts in command mode,
    meaning if you just start typing, you may see some blank spaces, characters, and
    bits of words that you type—essentially, a bunch of garbage that does not exactly
    represent what you''re typing—and you''ll hear a lot of beeps. So, as we''ll show
    you in the following steps, you''ll need to access the input mode as soon as you
    start vi.


