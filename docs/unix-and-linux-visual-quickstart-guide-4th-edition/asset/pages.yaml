  md: '# Chapter 8


    # Adding or Changing Variables


    After you''ve poked around in your environment, you might determine that you want
    to set a variable that''s currently not available or change one to make it meet
    your needs. In general, you won''t randomly specify variables; you''ll do it because
    a certain program requires a specific variable in order to run.


    # Variables You Can Mess With


    The following table includes some of the variables you can safely change. Keep
    in mind that the shell itself might not use a specific variable, like NPTSERVER,
    while programs running under the shell. Sometimes shells assign default variables,
    while in other cases you''ll have to manually set the value.


    | ZSH AND BASH | DESCRIPTION |

    |---|---|

    | CDPATH | Specifies the path for directories specified by c.d. This is similar
    to PATH. |

    | COLUMNS | Specifies the width of the edit window in characters. |

    | EDITOR | Specifies the default editor. |

    | ENV | Specifies where to look for configuration files. |

    | HISTFILE | Specifies the name of the file containing the command history. |

    | HISTSIZE | Specifies the maximum number of lines to keep in the history file.
    |

    | HOSTFILE | Specifies the name of the file hosting name aliases for expansion.
    |

    | IGNORENOFF | Specifies that Ctrl-D should not log out of the shell. Use IGNOREOFF=.
    |

    | LINES | Specifies the number of lines on the screen. |

    | MAIL | Specifies the location of incoming mailbox so you can receive your of
    mail. |

    | MAILCHECK | Specifies how often (in seconds) checks for mail. |

    | MAIL_WARNING | Specifies the message to be displayed if you have read but not
    reread. |

    | noclobber | Specifies that the shell should not overwrite an existing file when
    redirecting output. |

    | PATH | Specifies the path for commands, including multiple paths separated by
    colons. |

    | PROMPT_COMMAND | Specifies the command to be run before displaying each prompt
    . |

    | PS1 | Specifies the primary prompt. |

    | PS2 | Specifies the default select-prompt. |

    | PS3 | Specifies the prompt for the select command in scripts. |

    | PS4 | Specifies the prompt used when tracing execution of a script. |

    | TMOUT | Specifies times in seconds to wait for input before closing the shell.
    |

    | VISUAL | Specifies the default visual editor—usually the same as EDITOR, but
    referenced by different programs.


