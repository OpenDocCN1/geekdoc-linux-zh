  md: '# Chapter 12


    # ✔ Tips


    +   - If the FTP connection seems to get stuck as soon as you log in, try -yourid@where.com
    as the password. The character disables system announcements and helps keep your
    ftp client happy.


    +   - Some firewalls–particularly the ones on home networks–do not deal gracefully
    with some of the intricacies of the FTP protocol. If you can connect and log,
    but not list files or get anything, the firewall might be the problem. As soon
    as you log in, type pass (for passive) and the problem should go away.


    +   - Another use for - is to view text files onscreen. For example, type get
    filename - to have the text scroll by on screen.


    +   - Instead of using get, use newer (as in new goodokes .g2) to get a more recent
    file with the same name as the one you have.


    +   - If you start downloading a file and the FTP connection breaks, type repeat
    and the filename to continue the transfer from wherever it left off. (You''ll
    have to reestablish the connection, first of course).


    +   - You can tell ftp to make sure all the transferred files have unique names
    by using run instead of get. This can ensure that files dont overwrite existing
    files on your local system.


    +   - Use Unix commands like ls and cd to move around the remote system, and prefix
    them with an l to apply to your system. For example, cd .. would change to the
    next higher directory on the remote system, and cd .. (from within the ftp client)
    would change to the next higher directory on the local system. The current directory
    is where your files will be saved.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_260_0.png)


    # Getting Multiple Files


    If you''ll be getting multiple files with ftp, follow steps 1 through 6 in this
    section,


    +   - prompt


    Optionally, type prompt to tell the ftp client not to prompt for each individual
    file you want to get. You''ll be informed that prompt is set to no. If you want
    to turn it back on, issue prompt.


    +   - mget*


    At the ftp-prompt, type mget (for “multiple get”) by the string and filenames
    to match. In this example, use start* to get all files that begin with “start.”
    You could also use mget *.gz, for example, to get files with the .gz extension.
    See Chapter 1 for more about wildcards.


    +   - quit


    When you''re finished getting files, just type quit.


    # 246'
