  md: '# Chapter 10


    # # Embedding Commands


    Suppose you create a script that will automatically run when you log in each day.
    The script might, for example, print "Greetings!" onscreen and deliver a cle(a)ver
    message: "Say, you''re looking sharp today!" You could easily do this with the
    information you''ve learned so far in this chapter.


    What would be handy here would be to add a line to the script that tells Unix
    to add all those things plus the most recently used file—for those of you who
    need a reminder about what you were last working on. You could just use ls command,
    but that would only list the filenames and not integrate the greeting with the
    rest of your morning. Instead, a better (and more attractive) idea would be to
    bundle a couple of commands and use them with echo (Figure 10.4) to embed the
    information right into the greeting.


    To embed a command:


    +   1. vi myscript


    To begin, open myscript or another script in your favorite editor. Your script
    might look like Figure 10.4, with the greeting onscreen.


    ```

    ```bash

    user@example.com:~/home/user

    #!/bin/bash

    # this is my first shell script

    echo -e "Greetings!"

    echo -e "You''re looking sharp today: $(ls -t | head -1)"


    # echo "You were most recently working on is"

    ```

    ```


    **Figure 10.4** Embedding commands just requires an additional couple of lines
    in the script.


