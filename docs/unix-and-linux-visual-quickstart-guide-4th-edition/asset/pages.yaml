  md: '# Using Directories and Files


    # To remove a directory:


    +   1. cd /home/ejr/Yourdirectory


    To begin, change to that directory by typing cd plus the name of the directory
    you want to remove.


    +   2. ls -a


    List all (-a) of the files, including hidden files that might be present, in the
    directory, and make sure you don''t need any of them. If you see . and .. (which
    indicate the current directory and its parent directory, respectively), you can
    skip ahead to step 4.


    +   3. Do one of these:


    +   ▲ If you have files in the directory, type rm * * to delete those files plus
    all the rest of the files.


    +   ▲ If you have subdirectories in the directory, type cd and the subdirectory
    name, essentially repeating the process with step 1. Repeat this process until
    you remove all subdirectories.


    When you finish this step, you should have a completely empty directory, ready
    to be removed.


    +   4. cd ..


    Use the change directory command to move up one level, to the parent of the directory
    you want to remove.


    +   5. rmdir Directory


    There it goes—wave goodbye to the whole directory! See Code Listing 2.10 for the
    sequence.


    # ✓ Tips


    +   ■ You can remove multiple directories at one time. Assuming you''re starting
    with empty directories, list them like: `rmdir Directory Yourdirectory OtherDirectory`


    +   ■ As an alternative to `rm`, you can remove a directory and all its contents
    at once using `rm -r` flag for example, `rm -rf Directoryname`. Be careful! This
    method removes the directory and everything in it, so you won''t have the opportunity
    to examine your path before deleting file. If you''re getting asked for confirmation,
    absolutely, completely sure that you''re doing the right thing, use `rm -rf Directoryname`
    to force immediate deletion.


    +   ■ If you''re getting comfortable with command strings, you can specify commands
    with a directory path, as in `ls /home/ejr/Directory` or `rm /home/ejr/Directory*`.
    This technique is particularly good if you want to be absolutely sure that you''re
    deleting the right directory, and not a directory with the same name in a different
    place on the system.


