  md: '# # WRITING BASIC SCRIPTS


    So far in this book, you''ve been typing commands (or perhaps combining commands),
    pressing Enter, then waiting for Unix to execute the command(s) you specified...and
    typing in commands, pressing Enter. You get the idea, and you probably have tired
    fingers by now.


    Using shell scripts, you can create a series of commands, save them as a single
    file, and then execute them any time you want—without having to re-create the
    commands or do all that tedious typing over and again. For example, suppose you
    want to do a complex search-replace on all the .html files in your home directory.
    With a shell script, you can take the time to structure the commands just one
    time, save the commands as a single file, and apply it to any directory you want.
    You do not hard work one time, and then reuse the script any time you need to.


    # ### Chapter Contents


    +   * Creating shell scripts

    * Running shell scripts

    * Making scripts executable

    * Getting a head start on creating scripts

    * Embedding commands in scripts

    * Looping scripts

    * Creating if-then statements

    * Accepting command-line input

    * Accepting command-line input while a script is running

    * Debugging scripts


    In this book we will discuss creating scripts using the sh (Bourne) shell. Scripts
    can be written with any shell—and zsh and bash in particular are quite good for
    scripting. Revisit Chapter 3, if needed, to learn more about zsh and bash shells.


    In this chapter, we will show you how to get started creating and using shell
    scripts, and will give you enough information to create your own scripts and apply
    them to your particular uses.


    WRITING BASIC SCRIPTS'
