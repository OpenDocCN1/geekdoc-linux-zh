  md: '# Configuring Your Unix Environment


    # Tips


    +   - If you do as we often do and try to use show to show the environment variables
    (“showing” the variables seems logical, right?), you might get a weird question
    about the standard mail directories and the MH handler. Just press `Ctrl+C` to
    return to your shell prompt.


    +   - If the list of environment variables is long, you pipe set to more so that
    you can read the variables one screen at a time. Try set more. See Chapter 1 for
    a reminder about piping commands.


    # Variables in Your Environment You Shouldn''t Touch


    Before you go running off and changing your environment, note that there are some
    things you should really leave alone. These variables that the shell automatically
    affect how your Unix system works (or doesn''t work, if you try to change some
    of these variables!). Some of these cannot be changed, but some can, with unpredictable
    results. When don''t, see the sidebar "Variables You Can Mess With" in the following
    section for a list of variables you can change.


    | ZSH AND BASH | DESCRIPTION |

    | --- | --- |

    | HISTCMD | Keeps track of the current command from the history. |

    | HOSTYPE | Holds a string describing the type of hardware on which the shell
    is running. |

    | IFS | Specifies the characters indicating the end or of words. |

    | LINENO | Contains the number of seconds within the shell or a shell script.
    |

    | OLPWD | Contains the previous working directory. |

    | OSTYPE | Holds a string describing the operating system on which the shell is
    running. |

    | PPID | Contains the process ID of the shell''s parent. |

    | PWD | Contains the current working directory. |

    | RANDOM | Contains a special value to generate random numbers. |

    | SECONDS | Contains the number of seconds since the shell started. |

    | SHELL | Contains the name of the current shell. |

    | SHLVL | Contains a number indicating the sub-shell level (if SHLVL is 3, two
    parent shells exist and you''ll have to exit from three total shells to completely
    log out). |

    | UID | Contains the userid of the current user. |


