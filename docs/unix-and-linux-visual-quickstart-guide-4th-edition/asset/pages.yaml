  md: "Chapter 2\n\n# Removing Directories with rmdir\n\nAnother handy thing you can\
    \ do is remove directories using rmdir. Think of removing directories as trimming\
    \ branches on a tree. That is, you're not sitting on the branch you want to off.\
    \ You have to sit on the next closest branch; otherwise, you'll fall to the ground\
    \ along with the branch you trim off. Ouch! Similarly, when you remove a directory,\
    \ you must not be located in the directory you want to remove.\n\nYou must remove\
    \ a directory's contents (all subdirectories and files) before you remove the\
    \ directory itself. In doing so, you can verify what you're removing and avoid\
    \ accidentally removing important stuff. In the following steps (illustrated in\
    \ Code Listing 2.10), we'll show you how to remove a directory's contents, and\
    \ then remove the directory itself.\n\n```\n$ cd /home/Yourdirectory\n$ ls -la\n\
    total 7\ndr-xr-xr-x 2 ejr users 1024 Jun 29 20:59\ndr-xr-xr-- 8 ejr users 1024\
    \ Jun 29 20:59 .\n-rw-rw-r-- 1 ejr users 1475 Jun 29 20:59 cancelled.project.notes\n\
    -rw-rw-r-- 1 ejr users 2876 Jun 29 20:59 outdated.contact.info\n$ *\n$ cd ..\n\
    $ rmdir Yourdirectory\n$ ls\nNewdirectory all.programs.txt newer.programs short.fortunes\n\
    Projects files newest.programs temp\nXrootenv.0 fortunes touching\nall.programs\
    \ local.programs.txt schedule\n$ \n```\n\nCode Listing 2.10 Removing directories\
    \ with rmdir can be a little tedious—but safe than sorry.\n\n42"
