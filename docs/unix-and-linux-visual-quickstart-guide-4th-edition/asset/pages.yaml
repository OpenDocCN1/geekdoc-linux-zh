    When you bring suspended jobs into the foreground, you''ll sometimes see the job
    activities onscreen. At other times, you''ll see only a prompt and will need to
    summon help to see anything of the program.


    When you''re ready to resume a suspended or background job, you can do so using
    fg. Remember, when you suspend a job, what you''re doing is moving the job into
    limbo. fg just moves the job into the foreground again (**Code Listing 9.8**),
    so you can see, for example, what it does or provide input.


    # To run jobs in the foreground with fg:


    +   1. jobs


