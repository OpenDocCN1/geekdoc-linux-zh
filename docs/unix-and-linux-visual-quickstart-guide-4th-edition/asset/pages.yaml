  md: "# Tracing Connections with traceroute\n\nWhen you're connecting to a remote\
    \ computer, you're actually connecting through a series of computers (routers\
    \ and other expensive Internet stuff). That is, your computer connects to another\
    \ computer, which connects to yet another, and so on until your computer connects\
    \ to the one you're trying to reach.\n\nThe data that you're sending or receiving\
    \ actually meanders through the path in packets (little chunks of data) that are\
    \ reassembled into the correct sequence at the other end. But not all packets\
    \ take precisely the same route from the sending computer to the destination computer.\
    \ Communication on the Internet is much like sending a lot of letters than making\
    \ a phone call. A bunch of messages passed along, not a continuous connection.\n\
    \nUsing traceroute, you can satisfy your curiosity or possibly identify bottlenecks.\
    \ How? You find out what route the packets take to arrive at the destination computer,\
    \ as in Code Listing 12.6. For example, you see how the routes to your favorite\
    \ (but)\n\n```\nejay> traceroute we.yahoo.com\ntoute to www1.yahoo.com (204.71.200.75),\
    \ 30 hops max, 40 byte packets\n 1 198.60.22.1 8 ms 2 ms 3 ms\n 2 903.Hss5-0-0.GW1.SLT1.ALTER.Net\
    \ (157.13.160.141) 18 ms 13 ms 14 ms\n 3 124.ATM-0-CR1.SFO1.Alter_Net (137.39.68.9)\
    \ 68 ms 65 ms 52 ms\n 4 311.atm3-0-gw1.sfo1.alter.net (137.39.13.49) 60 ms 50\
    \ ms 39 ms\n 5 Hss1-0-bri1.NUQ.global.center (157.13.193.150) 40 ms 39 ms 28 ms\n\
    \ 6 pos8-1-155M.mr.NUQ.global.center (206.132.160.50) 30 ms 48 ms 42 ms\n 7 pos1-0-G62M.mr1.SNV.global.center\
    \ (206.251.0.74) 50 ms 67 ms 61 ms\n 8 pos5-0-0155M.cr1.SNV.global.center (206.251.0.105)\
    \ 48 ms 40 ms 41 ms\n 9 wwww10.yahoo.com (204.71.200.75) 43 ms 50 ms 53 ms\neijay>\n\
    ```\n\ncontinues on next page\n\nCode Listing 12.6 traceroute, see how data meanders\
    \ between your computer and a remote computer.\n\n![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_269_0.png)"
