  md: '# Chapter 1


    Many of the examples and screenshots for this book were taken from Unix systems
    running on VirtualBox on one of our desktop systems.


    Cygwin provides you with a Unix environment that''s actually part of your Windows
    system. It takes a bit of getting used to, but Cygwin is stable and reliable.
    The hardest part about using Cygwin is that it can be confusing to know whether
    you''re dealing with Unix or Windows at any given moment.


    # Different Unix flavors


    So, given all of those options for getting access to Unix, the choice of which
    kind of Unix (which Unix flavor) must be clear and straightforward—right? Of course
    not.


    If you''re just getting started with Unix, we recommend having choose the flavor
    that your most tech friends or the folks at work use. This will give you potential
    built-in tech support options.


    If you''re starting purely from scratch, look into the most popular and highly
    rated Linux distributions. (Currently, the Web site www.distrowatch.com provides
    a great set of recommendations, but as you know, Web sites change, so you might
    want to do some Web searching for recommended Linux distributions.)


    A new popular (or popular again) option is OpenSolaris, from Sun Microsystems.
    For Solaris was a bit tricky (well, a lot tricky) to get installed and functional
    on a regular desktop system; however, it''s now as easy as the Linux systems,
    and it offers a tremendous amount of power and flexibility, in addition to some
    cutting-edge technologies.


    +   * Tip

    * If you''re Mac OS X or later, you''re already using Unix—you just need to bring
    up a terminal window to be able to follow right along with the book.


    That said, any option you choose will be pretty similar for the purposes of this
    book. Differences among the options primary show up in more advanced applications.'
