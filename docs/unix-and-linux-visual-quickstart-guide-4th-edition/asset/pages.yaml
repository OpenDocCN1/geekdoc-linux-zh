  md: '# Making Backups with rsync


    The rsync utility is a way to synchronize files and directories, either locally
    or across a network. We like to use it to make backups so we don''t have to worry
    when we something up. Yes, we could use cp or something equally boring, but we
    like the speed and flexibility of rsync. In this example, we''re copying files
    locally, but we could be easily making backups to another server somewhere else.


    # To make backups with rsync:


    +   1. `mkdir - ~/BACKUPDIR`


    Create a directory to house your backups. Ideally, you''ll create the directory
    on a different physical disk from the stuff you''re backing up, but what can you
    do? We''re creating a backup directory that''s a subdirectory of the home directory,
    which will help protect against self-inflicted damages against disk failures (We
    trust the system administrator for protecting against disk failures... Eric, you
    are up-to-date on our backups, are you?)


    +   2. `rsync -v -a /home/jdoe/data ~/BACKUPDIR`


    Specify the rsync command, -v (for verbose), and -a (for archive) options, as
    the source and destination directories (Code Listing 1.8).


    Wait until it does the initial backup (showing you each file as it gets). The
    first backup takes a while but not longer than cp would.


    ```

    [joe@frazz bin$] rsync -v -a

    /home/jdoe/data ~/.BACKUPDIR

