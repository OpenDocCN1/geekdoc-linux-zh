  md: '# Getting Started with Unix


    # Changing Directories

    with cd


    ```

    [jdoe@frazz jdoe$] cd /

    [jdoe@frazz /]$] cd

    [jdoe@frazz jdoe$] cd /home/jdoe/Project/

    [jdoe@frazz Project$] cd /etc

    [jdoe@frazz etc$] cd /home/jdoe/

    [jdoe@frazz mail$] cd /mail/

    [jdoe@frazz jdoe$] cd ..

    ```


    To explore Unix and its capabilities, you''ll need to move around the directories.
    You do so using the cd command, which takes you from the directory you''re currently
    in to one that you specify: Code Listing 1.4 illustrates how you use cd to change
    directories.


    **Code Listing 1.4** Using cd, you can change directories and move around in the
    system. Note that the prompt directory shows the name of the current directory,
    which can be handy.


    # To change directories:


    +   1. cd Projects


    To move to a specific directory, type cd plus the name of the directory. In this
    example, we move down in the directory tree to a subdirectory called Projects.
    (See the "Moving Up and Down" sidebar for an explanation of what "up" and "down"
    mean in Unix terms.)


    +   2. cd ..


    Type cd .. to move up one level in the directory tree.


    +   3. cd /etc


    Here, /etc tells the system to look for the etc directory located at the system
    root.


    # Moving Up and Down


    Throughout this book, we''ll talk about moving "up" and "down" through the Unix
    file system. Moving "up" means moving into the directory that contains the current
    directory—that is, closer to the root directory. Moving "down" means moving into
    subdirectories that are contained by the current directory—that is, further from
    the root directory.'
