    \ program.\n\n![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_248_0.png)\n\n# Sample\
    \ procmail Recipes\n\nThe following recipes, with annotations, should help you\
    \ get started filtering with procmail:\n\n```\n# Filter based on the To:, Cc:\
    \ and\n~ similar headers\n```\n\n```\n:0:\n* ^TO.*awr.*raycomm.com\n$MAILDDIR/interesting\n\
    ```\n\n```\n# Filter based on the subject\n```\n\n```\n:0:\n* ^Subject:.*Status\
    \ Report.\\*\n$MAILDDIR/status-reports\n```\n\n```\n# Filter based on sender\n\
    ```\n\n```\n:0:\n* ^From:.*spammer@example.com\n$MAILDDIR/IN.TO-DELETE\n```\n\n\
    ```\n# Filter directly to garbage,\n~ irrevocably, based on sender\n```\n\n```\n\
    :0:\n* ^From:.*spammer@example.com\n/dev/null\n```\n\n```\n# Filter based on size\
    \ (greater than)\n~ 1000 bytes)\n```\n\n```\n:0:\n* > 1000\n$MAILDDIR/long\n```\n\
    \n+   3. Save and close the file.\n\nNow all the mail you receive will be\nstored\
    \ and passed along for the vacation\nprogram to respond to.\n\n# Tips\n\n+   Your\
    \ procmailrc file gets processed in\norder. As soon as a recipe matches an\nincoming\
