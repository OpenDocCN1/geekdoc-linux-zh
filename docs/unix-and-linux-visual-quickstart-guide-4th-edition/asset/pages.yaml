  md: '# Getting Information About the System


    # Tips


    +   - You can use df with a specific directory to get a report on the status of
    the system containing that directory. For example, you might use df /user/local/src
    to find out where directory is mounted and how much space is available on.


    +   - df -k to make sure the usage is reported in 1 Kbyte blocks, not in 512 byte
    blocks. Adding the -k flag will also ensure that you get output like that in Code
    Listing 7.3.


    +   - df -h to get human-readable output. This works with many commands (like
    ''ls'', for example) that output comprehensible information, as Code Listing 7.5.


    Code Listing 7.3 and that show the output of different systems. If you''re a system
    administrator, you can use this information to diagnose problems occurring in
    the system. If you''re an average user (of-average curiosity), you can use this
    information to satisfy your inquisitive inclinations or tip off a system administrator
    to errors. If you''re getting odd errors or unpredictable results with a specific
    program, using df might reveal the /home file system is full or maybe that you
