  md: '# Chapter 13


    # Uncompressing Files with uncompress


    Compressing a file is handy for reducing the amount of disk space it uses, but
    you can''t do much with a compressed file—directly, at least. You won''t need
    to uncompress it first.

    **Code Listing 13.9** shows how to do so using the uncompress command.


    ```

    [ej@hobbes compression]$ ls -l 1*

    -rwr-r--r 1 ejr users 297027 Jul 27

    - 10:06 labrea.tar.Z

    [ej@hobbes compression]$ uncompress

    -> labrea.tar.Z

    [ej@hobbes compression]$ ls -l 1*

    -rwr-r--r 1 ejr users 501760 Jul 27

    - 10:06 labrea.tar

    [ej@hobbes compression]$

    ```


    # To uncompress a file with uncompress:


    +   * uncompress labrea.tar.Z

    At the prompt, type uncompress followed by the filename of the file to uncompress.
    The compressed file is replaced by the uncompressed file, which is named like
    the original, but without the .Z (see Code Listing 13.9).


    **Code Listing 13.9** You can uncompress files with a single switch command and
    possibly double your disk usage at the same time, as shown here.


    # ✔ Tips


    +   * Remember that uncompressed files take up more space—sometimes a lot more
    than compressed files. You might want to check your storage quota with your ISP
    before you uncompress a file to make sure that you don''t exceed your limit. As
    Chapter 7 explains, you can often check your quota by typing -v at the prompt.


    +   * You can use the -c flag to uncompress to leave the original file untouched
    and send the uncompressed version to standard output. For example, you might use
    uncompress -c tarred.tar.Z > tarred. See Chapter 1 for more information on redirecting
    output, as is shown here.


    +   * You can also use gzip to uncompress compressed files. Check out "Unzipping
    a gzip File with gzip" later in this chapter.


