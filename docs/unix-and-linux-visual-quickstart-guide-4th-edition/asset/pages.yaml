  md: '# Getting Information About Your userid with id


    Occasionally, you may need to find out information about your userid, as your
    userid''s numeric value and to what groups you belong. This information is essential
    when you''re sharing files (as discussed in Chapter 5) because you''ll need it
    to let people access your files and to theirs. You can easily get information
    about your userid with id, as shown in Code Listing 7.14.


    ```

    [ejr@hobbes ejr]$ id

    uid-500(ejr) gid-500(ejr) groups=500(ejr),

    - 10(wheel), 100(users)

    [ejr@hobbes ejr]$ id deb

    uid-505(deb) gid-505(deb) groups=100(users)

    [ejr@hobbes ejr]$ groups ejr

    jer : ejr wheel users

    ```


    **Code Listing 7.14** Use to get information about userids and group memberships.


    To check userid information using id:


    +   * id


    At the shell prompt, type id to find the numeric value of your userid and to what
    groups (by name and numeric userid value) (see Code Listing 7.14). See "Finding
    Out Which Group You''re in", in Chapter 5, for more about the /etc/group file.


    **Tips**


    +   - You can also check someone''s status with id to find out what groups they''re
    in. Use just id userid (substituting the other person''s userid for userid, of
    course).


    +   - Use groups to find out which groups—in human-readable terms—a specific userid
    is in. For example, ejr in the ejr, wheel, and users groups, as shown in Code
    Listing 7.14.'
