    you could also use r for read or x for execute permissions, as your needs dictate.


    +   - The filename (rowyourboat).


    # To remove permissions:


    +   - chmod go-w rowyourboat


    At the shell prompt, use chmod go-w plus the filename to remove permissions for
    everyone except you, the file''s owner. Note that we handled both group and other
    in a single command this time, although we could have used chmod g-w rowyourboat
    and chmod o-w rowyourboat to accomplish the same thing.'
