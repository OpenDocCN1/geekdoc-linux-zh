  md: '# Chapter 13


    # # Unzipping Zipped Files

    with unzip


    You can unzip zipped files using unzip, which is logical because you certainly
    wouldn''t unzip zipped files with un-Velcro or unsnap

    **(Code Listing 13.13).**


    To unzip a zip file using unzip:


    +   1. `ls -l *.zip`n   At the shell prompt, verify the name of the zip file with
    `ls *.zip`.

    2. `unzip zipped.zip`n   Enter the name of the file extension to unzip (with or
    without the `.zip extension). unzip will uncompress the file(s) and return to
    the shell prompt.


    # ## Tips


    +   * If you attempt to unzip a file and the file to be unzipped is already unzipped,
    unzip will prompt you for one to determine if you want to overwrite (destroy)
    the existing file, cancel the unzip process, or rename it to a safe name. Alternatively,
    use the -n (never overwrite) or -o (always overwrite) flag to avoid this promptly.

    * gunzip also understands how to decompress .zip files, so you can use gunzip
    instead of unzip, if you like. On the Unix side of things, whatever seems easiest
    to you, or gunzip if you really don''t care.

    * To see the contents of a zip file, use unzip -l zipped.zip.


