    To save text in vi:


    +   - Esc:w | to get out of input mode and into command mode, type :w (for "write",
    as in write to the disk) followed by a space and then the filename (namely, in
    this example) you want to use for the file, then press Enter. If you''ve already
    saved the file once, just press Esc and type :w, then press Enter.


    # Tips


    +   - If you''ve already saved your file at least once, you can save changes and
    exit vi in one swoop. In command mode, type :wq (for "write quit"). For more information
    about quitting vi, see the section "Exiting vi," later in this chapter.


