    Figure 11.2 mutt''s interface and features are fairly easy to use but not as easy
    as pine''s.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_224_2.png)


    Figure 11.3 mail''s interface and features are well, kind of pain to use.


