  md: '# Chapter 5


    The left column contains ten characters, the last nine of which specify permissions
    for each file:


    +   - r means read permission, w means write permission, and x means execute permission.

    - The first set of rwx is for the user, the second set is for the group, and the
    last set is for other.

    - A dash (-) instead of a letter indicates that the user/group does not have level
    of permission.

    For example, rwx—would mean that the user has read, write, and execute permission,
    while group and other have no permissions at all.

    The two columns in the middle indicate the file''s owner (and in likelihood your
    userid) and the group membership for the file. In Code Listing 5.1, ejroy is the
    owner of all the files. Most of the files are associated with the users group,
    while a few directories are associated with the www.

    On this system, files that individual users create are created with the users
    group, while those on other systems, the default group for files might be a group
    with the same name as the userid, as shown in Code Listing 5.2.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_110_0.png)


    Figure 5 Most of the files in /etc are owned by root.


    # Tips


    +   - Sometimes you''ll see references to world-readable or world permissions.
    This is the same as other. "Other" just refers to any one who is not you or in
    the group.

    - You might also hear of s or setuid permissions, which indicate that the program
    or file can run with the effective userid of the file''s owner (root). For example
    /usr/bin/passwd has s permissions because you can run passwd to change your password,
    but the command needs to run as root to actually modify the password database.

    - You might also see a t at the end of the list of permissions, which indicates
    that the sticky bit is set. Setting the "sticky bit" means primarily that, in
    a shared directory, you can only delete your own files (and not accidentally delete
    files belonging to others).


    3. ls -l /etc

    You can also use the ls -l command on a system directory, such as /etc. Here,
