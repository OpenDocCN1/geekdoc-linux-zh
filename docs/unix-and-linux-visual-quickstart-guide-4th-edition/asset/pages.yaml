  md: '# Accessing the Internet


    # Matching Domain Names

    with IP Addresses


    ```

    jdoe /home/jdoe $ nslookup www.raycom.com

    Note: nslookup is deprecated and may be

    - removed from future releases.

    Consider using the ''dig'' or ''host'' programs

    - Instead. Run nslookup with

    the ''-sil[ent]'' option to prevent this

    - message from appearing.

    Server:       ns1.netrack.net

    Address:     206.168.112.653

    ```


    When accessing a computer on the Internet,

    y generally type in a domain name (such

    as www.raycom.com) and your system

    translate it into an IP address (such

    204.228.141.12). As a rule, the translation

    from domain name to IP address proceeds

    without a problem. Most of the time,

    you won''t even notice it happened.

    Occasionally, you''ll come across an

    error message that says something like "failed

    DNS lookups." All that this means

    is that the domain name server (probably on

    y Unix system) cannot match the domain

    name you provided to an IP address.


    So, what do you do?


    +   - Just be patient for a day or until the

    problem is resolved. (In the meantime,

    make sure the problem isn''t a typo on

    your part.)


    +   - Use nslookup or dig. These commands

    anually convert a domain name to the

    matching IP address (**Code Listing 12.8**).

    Then you can connect directly to the

    IP address rather than use the domain

    name.


    To match a domain name with an IP

    address using nslookup:


    +   - nslookup www.raycom.com

    At the shell prompt, type nslookup fol-

    low by the domain name you want to

    look up and the server you want to do

    the for you (Code Listing 12.8).

    Remember, if you get one of those pesky

    "failed DNS lookup" messages, the prob-

    bley resides with your name server;

    therefore, you''ll need to specify a different

    name server to match the domain name

    and IP address for you.


    Code Listing 12.8 You can manually translate a

    domain name into an IP address using nslookup.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_271_0.png)


