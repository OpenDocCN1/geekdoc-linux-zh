  md: "# Looping Your Scripts\n\nSuppose you've created a script that you like to\
    \ apply to several files. For example, say at the end of the day you need to make\
    \ backup copies of all .html files in your directory. You could make a copy of\
    \ each individual .html file, but that's a lot of work. An easier way would be\
    \ to create a short script to copy a .html file, and then loop (repeat) the script\
    \ to apply to all .html files in your directory (Figure 10.5). You create one\
    \ short script; Unix does not the tedious work for you.\n\nTo make a loop:\n\n\
    +   1. vi head_ache\nAt the shell, start your editor and open the script you want\
    \ to loop. In this case, we're using vi and the head_ache file. (Of course, you\
    \ could name the script html_backup or something mundane like that.)\n\n+   2.\
    \ /bin/sh\nTell your Unix system which shell to use to run the script. In this\
    \ example, we're telling it (with #!) to run the script with /bin/sh.\n\n+   3.\
    \ cd ~/\nMake sure that you're in the directory in which the loop will take place.\
    \ In this example, our script resides in our home directory, but the files to\
    \ the loop will also reside in the ~ directory.\n\n+   4. for i in 'ls *.html'\n\
    OK, don't panic. Read this: \"Look for items in the list of .html files.\" In\
    \ this code, we're providing the output of the embedded command (`ls *.html`)\
    \ to the for (.html files), as shown in Figure 10.5. The -1 flag on the ls command,\
    \ as mentioned in the previous section, forces a single list of output, which\
    \ is ideal for script use, rather than several columns, which is easy to read\
    \ onscreen but doesn't work well for scripts.\n\n```\n# jdoe@frazz.raychem.com\
    \ ~home/jdoe\n!/bin/sh\ncd /www\nfor i in `ls -1 *.html`;\ndo\n  cp $i $i.bak\n\
    \  echo \"$i backed up!\"\ndone\n```\n\n![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_214_0.png)\n\
    \nFigure 10.5 Using a loop with an embedded command, you can automatically apply\
    \ a script to several files."
