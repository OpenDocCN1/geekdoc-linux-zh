  md: '# Chapter 4


    # # Choosing an Editor


    Basically, all editors are designed to do the same things: enable you to create,
    modify, and save text files. These files could include configuration files, email
    messages, or scripts—essentially any text file you create. Exactly which editor
    you choose is up to you, depending on your specific needs and how much you''re
    willing to learn.


    In this book, we will stick to three biggies—pico, vi, and emacs—which will likely
    give you all the capabilities you need. We choose these because pico is (arguably)
    the easiest editor to use, vi is one of the most powerful and available on almost
    every Unix system, and emacs provides an unbelievable number of options and is
    a handy tool for up-and-coming Unix pro.


    # ## About pico


    pico is one of the most straightforward Unix editors and has become quite popular
    because it is extremely easy to use. In particular, as shown in Figure 4.1, it''s
    menu-driven and intuitive. All of the commands are visible, and you can open,
    modify, and close files with little effort. pico is a great choice if you''re
    just starting with Unix or if you won''t be needing an editor to leap tall files
    in a single bound.


    For a variety of reasons, mostly connected to open source licensing issues, a
    clone of pico, called nano, has been developed and included in a number of Linux/Unix
    distributions as well as on systems that you be using. The nano editor is command-for-command
    as pico, but it offers some supplemental higher-end (yet still easy-to-use) features.


    ![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_84_0.png)


    Figure 4.1 pico offers onscreen command reminders to make it easier to use.


    # ## Editors Abound


    By the way, dozens of other editors exist, such as


    +   - ed, ex, and red, which are simple (in functionality, but not necessarily
    usage) line-by-line editors

    - joe and jed, which are fairly simple editors and comparable to pico in many
    ways


