  md: '# # Viewing File Beginnings with head


    Using head, as shown in Code Listing 6.3, you can find out in a jiffy''s in a
    file by viewing the top few lines. This is particularly handy when you''re browsing
    file listings or trying to view a specific file among several others with similar
    content.


    To view file beginnings with head:


    +   - head honeydo

    - At the prompt, type head followed by the filename. As Code Listing 6.3 shows,
    you''ll see the first ten lines on the screen. Notice that "lines" are defined
    by head returns, so a line could, in some cases, wrap to many screen lines.


    To view a specific number of lines:


    +   - head -20honeydo

    - Add -20 (or whatever number of lines you want to view) to view a specific number
    of lines.


    To view the beginnings of multiple files:


    +   - head honeydo* more

    - You can view the top of multiple files by piping head (plus filenames) to more.
    Note that head conveniently tells you the filename of each file, as shown in Code
    Listing 6.4.


    ```

