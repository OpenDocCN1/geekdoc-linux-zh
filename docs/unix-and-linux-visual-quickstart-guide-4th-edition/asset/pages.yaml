  md: "# Writing Basic Scripts\n\n# Accepting Command-Line Arguments in Your Scripts\n\
    \nSuppose that at the end of every month you need to send a progress report to\
    \ your boss. You might set up a script to address an e-mail to your boss, and\
    \ still have the file containing the progress report would likely have this script\
    \ automatically address a message to your boss and put in the subject line, but\
    \ would use command-line input to tell the script which file you want to send.\
    \ By using command-line input, you can give your scripts a bit more flexibility\
    \ and still have much of a process automated for you. You run the script and specify\
    \ the input at the shell prompt, in Figure 10.7.\n\n![](img/6b5a7d9e490d4d2c7a13fc35dda61fae_219_0.png)\n\
    \n```\n```bash\ndoe@frank.com$ cat status-report\n#!/bin/sh\n\nmail boss@example.com\
    \ -s \"Status report for $1\" < /reports/$1\n\ndoe@frank.com$ ./status-report\
    \ August\ndoe@frank.com$ \n```\n```\n\nFigure 10.7 Using command-line input, you\
    \ can add flexibility to a script and still have the script do the grunt for you.\n\
    \n```\n```\n[ej@hobbes scripting]$ more status-report\n#! /bin/sh\n```\n```\n\n\
    mail -s \"Status report for $1\"\nboss@example.com < ~/reports/$1\n\n```\n```\n\
    [ej@hobbes scripting]$ ./status-report\nAugust\n[ej@hobbes scripting]$\n```\n\
    ```\n\n# Accept command-line arguments in a script:\n\n+   1. status-report\n\n\
    Use your editor to edit your script.\n\n+   2. mail -s \"Status report for $1\"\
    \n\nboss@example.com < ~/reports/$1\nEnter a command, with $1 appearing in each\
    \ place you want to use the first item of input from the command line. In this\
    \ example, the script starts a message to the boss, fills in the subject line\
    \ (adding the monthly), and sends the appropriate monthly report (the one specified\
    \ on the command-line) from the reports directory under your home directory.\n\
    \nSee Chapter 11 for more information about e-mail.\n\n+   3. Save and exit, then\
    \ run the script (Code Line 10.6), though you might first have to find a boss\
    \ to take your status report and have to provide the content for the status report.\n\
    \nCode Line 10.6 By providing command-line input (in this case August), you can\
    \ control what the script does.\n\n# Tips\n\n+   * See the information provided\
    \ at the command line, echo back out all variables of $*. The $ variable provides\
    \ all of the command-line input, with $1, $2, $3, etc. (up to $9) containing the\
    \ individual arguments.\n\n+   * You can also accept input at specified points\
    \ while a script is running. See the next section for more details.\n\n205"
