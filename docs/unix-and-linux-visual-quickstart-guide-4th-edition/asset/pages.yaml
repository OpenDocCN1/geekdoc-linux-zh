  md: '# Chapter 4


    # About emacs


    With emacs, you start to understand incredibly customizable Unix be. It can be
    “just” an editor—although a very powerful one with all kinds of features—or it
    can be an email program, file manager, or darn anything else. We''re going to
    stick to the functions, but if you feel like you don''t hesitate to explore the
    Web for other options and features of this editor. Figure 4.3 shows you what to
