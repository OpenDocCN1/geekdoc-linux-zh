  md: '# Chapter 11


    # Configuring procmail


    Let''s see...two messages from the boss...17 messages from the strict collectors''
    discussion group...oh, hey, a message from Mom...and...


    One of the finest you can do to make your Unix life easier is to use procmail
    (a mailing-filtering program) to automatically handle some of your incoming email.


    In this section, we''ll show you how to configure procmail so you can manage incoming
    messages. Figures 16 and 17 show what you need to do to set up your system to
    manage mail with procmail:


    +   - Specify settings for procmail (Figure 11.16). For example, incoming mail
    normally gets plumbed directly into your inbox; however, procmail filters before
    it even gets to your inbox, you need to tell procmail where your mail folders
    are, do some other things.


    +   - Tell procmail to do its (Figure 11.17). Essentially, you create a .forward
    file that sends your incoming mail to procmail for processing before you see it.
    This step is not necessary for many systems, particularly Linux and Unix systems.


    To specify settings for procmail:


    +   1. pico ~/.procmail


    To begin, access your editor and create a .procmailrc in your home directory.


    +   2. LOGFILE=$HOME/.maillog

    Give procmail a place to log of all its activities, so it can tell you what it''s
    done:I threw away 7 messages from your boss... filed 3 messages from Joe in the
    Golfbuddies folder...In this example, we tell procmail to keep a log file called
    .maillog in your home directory (Figure 11.16). Keep an eye on this file, because
    it can grow over time.


