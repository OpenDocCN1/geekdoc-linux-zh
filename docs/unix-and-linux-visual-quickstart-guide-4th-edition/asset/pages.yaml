  md: "# Logging in to Remote Systems with ssh\n\nYou might already be using ssh to\
    \ connect to your Unix system. You can, though, use it to connect and use any\
    \ other computer system on the Internet (assum you have rights to log in it),\
    \ **Code List 12.1**.\n\n```\n[jdoe@frazz jdoe]$ ssh server.example.com\njdoe@server's\
    \ password:\njdoe /home/jdoe $ whoami\njdoe\njdoe /home/jdoe $ uname -a\nLinux\
    \ server.example.com 2.4.19-ac4 #13 SMP\n- Sat Nov 16 05:30:56 MST 2002 i2686\n\
    - unknown unknown GNU/Linux\njdoe /home/jdoe $ logout\n[jdoe@frazz jdoe]$\n```\n\
    \n**To connect to another computer using ssh:**\n\n+   1. `server.example.com`\n\
    \   At the prompt, type ssh followed by the name of the system to which you want\
    \ to connect.\n2. Log in using your remote login name for accessing the system.\n\
    \   Presumably, if you're accessing a system over the Internet, you have some\
    \ reason and permission to do so. In some cases, you'll type the name of the application,\
    \ or you might be using the remote system just as you use the system from which\
    \ you are connecting.\n3. After you've finished using the remote system, log out\
    \ according to the instructions and policies of the remote system.\n\n**Code Listing\
    \ 12.1** Use ssh to connect securely to other systems on the Internet.\n\n# Tips\n\
    \n+   - For help with ssh, type ssh at the shell prompt and look up the list of\
    \ options, or type `man ssh` for more help. When you have an active session, use\
    \ `Enter -` to get help with the current session.\n- If you have a different login\
    \ name on the remote system, you can specify that to ssh with `ssh server.example.com\
    \ -l username` to log in more easily. Or, if it's easier to remember, try `username@server.example.com`.\n\
    \n+   - You can use the `wall` (Write ALL) command to send `write` messages to\
    \ everyone logged into the system. System administrators generally use `wall`\
    \ when they need to warn people that the system is being brought down.\n- Use\
    \ `who` to find out who is logged into the system. See the sections \"Learning\
    \ Who Else Is Logged In with who\" and \"Learning Who Else Is Logged In with w\"\
    \ in Chapter 7 for more information."
