  md: '# Chapter 5


    # To set permissions:


    +   - chmod chmod u=rwx, g=rx, o=r*


    Type chmod and specify who has access. In this case users have read, write, and
    execute permissions; the group has read and execute permissions; and others have
    read permissions for all files in the directory that start with row (Code Listing
    5.8). The equals specifies that the permissions granted in the command are the
    only permissions that apply. Any previous permissions will be removed. The wildcard
    expression here (*) specifies that the command applies to all files and directories
    that start with “row” in the current directory.


    # Tips


    +   - You can also use the -R flag with chmod to recursively apply the changes
    you make to permissions to all files and subdirectories in a directory. For, chmod
    -R go-rx* revokes all permissions from everyone except the user for all files
    in the current directory, and all subdirectories in the current directory, and
    all files in all subdirectories.

    - There are about a million and one ways to express permissions. For example,
    you could use chmod ugo= * (note the space before *) or chmod u-rwx,g-rx,o-* to
    revoke all permissions from files in the directory (Note that you''ll have to
    add your permissions back to the files before you can do anything with them, if
    you try out).

    - If you want to change permissions for multiple files, use a wildcard


    ```

    [ej@hobbes permissions]$ ls -l

    total 332

    -rw-rw-r- 1 ejr users 24850 Jul 24 14:59 black

    -rwx-xr-x- 1 ejr users 152779 Jul 24 15:10 rowyboat

    -rw-rw-r- 1 ejr users 128889 Jul 24 14:33 sage.sayings

    -rw-rw-r- 1 ejr users 23890 Jul 24 14:33 sayings

    [ej@hobbes permissions]$ chmod u=rwx,g=rx,o=r*

    [ej@hobbes permissions]$ ls -l

    total 329

    -rw-rw-r- 1 ejr users 24850 Jul 24 14:59 black

    -rwx-xr-x- 1 ejr users 152779 Jul 24 15:10 rowyboat

    -rw-rw-r- 1 ejr users 128889 Jul 24 14:33 sage.sayings

    -rw-rw-r- 1 ejr users 23890 Jul 24 14:33 sayings

    [ej@hobbes permissions]$

    ```


    **Code Listing 5.8** You can set permissions to ensure that all files have equivalent
    permissions.'
