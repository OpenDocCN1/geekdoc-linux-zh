  md: '# Redirecting Output


    Suppose you''ve developed your resume and spell-checked it. As you learned in
    the previous section, the results you see onscreen will be the output of the last
    command—in this case, a list of misspelled words. A lot of times, you''ll want
    to redirect the final output to another location, such as a file or a printer
    (if a printer is an option for you), rather than view it onscreen. You can do
    this using redirection, which sends the final output to somewhere else than your
    screen.


    As shown in Code Listing 1.6, you will often redirect output results to a file.
    Notice the greater-than symbol (>), which indicates that the output of the program
    is to be redirected to the location (or filename) you specify after the symbol.


    In the following examples, we will show how to redirect output to a new file and
    how to redirect output to append it to an existing file.


    ```

    [doe@frazz jdoe]$ ls /usr/local/bin > local.programs.txt

    [doe@frazz jdoe]$ ls local*

    localize localono local.programs.txt localokyel

    [doe@frazz jdoe]$ ls /usr/local/bin >> other.programs.txt

    [doe@frazz jdoe]$

    ```


    Code Listing 1.6 In this case, the output of ls gets redirected to local.programs.txt,
    as indicated by the greater-than (*) symbol. The asterisk (*) acts as a placeholder
    for letters or numbers. Finally, the listing of /usr/bin gets appended to the
    other.programs.txt file.'
