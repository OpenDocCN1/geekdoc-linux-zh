  md: "# Chapter 9\n\n# Controlling Job Priority with nice\n\nSuppose you need an\
    \ enormous file from the Internet that would take practically all afternoon to\
    \ download. By downloading it, you would hog system resources and make the system\
    \ response time much slower for other users. OK, bad example. Suppose your coworker\
    \ needs to download an enormous file and would hog system resources all afternoon.\
    \ Would hope she'd had the courtesy to not tie up resources that you need to use.\n\
    \nFortunately, she can, using nice, which lets her control job priority. As **Code\
    \ Listing 9.9** shows, you rank your job priority using numbers from 1 to 19,\
    \ with nice (higher priority) and 19 being fabulously nice (lower priority). The\
    \ Unix system uses the number you provide to determine how much attention to devote\
    \ to the job:\n\n# To control job order with nice:\n\n+   - nice -n 19 scriptlow\n\
    \  At the prompt, type nice, the -n flag, followed by the appropriate adjustment\
    \ (19), and the name of the program or script to run (Code Listing 9.9). In this\
    \ example, scriptlow runs with the low-effort priority.\n\n# **Tips**\n\n+   -\
    \ To find how nice you need to be, you might check out how many processes (and\
    \ which kinds) are currently running on the Unix system. You can do this using\
    \ ps, as described later in this chapter.\n- Use nice\n- If you are the system\
    \ administrator and logged in as root, you can use negative numbers (down to -20)\
    \ with nice to increase the priority (nice -16 priority job).\n- Use nice to change\
    \ the niceness of a running job. For example, run nice -n 18 2058 (the job number).\
    \ If you're the system administrator, you can increase or decrease the niceness\
    \ of any job; if you're a peer—who mean a regular computer user at your company—you\
    \ can only decrease the priority of your own jobs, not increase it. In a pinch,\
    \ you could ask your system administrator to increase the priority of your job.\n\
    - Could use nice and run a job in the background—for example, use nice -n 12 funscript\
    \ & to run funscript in the background with a niceness level of 12.\n\n```\nejr@hobbes\
    \ ejr$ nice -n 19 scriptlow\n```\n\n**Code Listing 9.9** By using nice as an adjustment,\
    \ you can let Unix determine how hard to work on your job.\n\n184\n\n+   You can\
    \ just nice the niceness of the job name (as in nice sortlow). Doing so automatically\
    \ specify 10 as the niceness level (the default setting)."
