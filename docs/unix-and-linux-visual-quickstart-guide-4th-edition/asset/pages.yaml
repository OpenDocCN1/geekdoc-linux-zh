  md: '# Copying Directories and Files with cp


    When working in Unix, you''ll frequently want to make copies of directories and
    files. For example, you might want to copy a file you''re working on to copy an
    original, uncashed version handy. Or you might want to maintain copies of important
    directories and files in case you inadvertently delete them or save something
    over them. Accidents do happen, according to Murphy.


    Whatever your reason, you can copy directories and files using the cp command,
    as shown in Code Listing 2.3. When you copy directories and files, all you''re
    doing is putting a duplicate in another location; you leave the original untouched.


    # To copy a directory:


    +   1. cp -r /home/ejr/Projects /home/shared/deb/Projects

    At the shell prompt, type cp -r, followed by the old and new (to be created) directory
    names, to copy a complete directory. The r stands for "recursive", if that''ll
    help you remember it.

    2. ls /home/shared/deb/Projects

    You can use ls plus the new directory name to verify that the duplicate directory
    and its contents are in the intended location (Code Listing 2.3).


    ```

    $ cp -r /home/ejr/Projects

    -> /home/shared/deb/Projects

    $ ls /home/shared/deb/Projects

    current new.ideas schedule

    $

    ```


    Code Listing 2.3 Use cp -r to copy directories.'
