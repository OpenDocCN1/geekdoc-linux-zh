    # Changing Groups


    Each file in Linux has a group. A group is a collection of users who have the
    same access to devices and files.


    Each regular user belongs to a group that has the same name as his or her account.
    At the discretion of the root user, users can also belong to other groups.


    The group attribute lets the owner define whether other users can work with the
    file, and what they can do with it.


    It can also be used by the root owner to protect files from casual use or accidental
    damage.


    The group of a file is one which the owner belongs to. The group may be changed
    by either the present owner or the root user.


    Valid owners are listed in the /etc/group file.


    # Changing Groups From the Desktop


    +   1. From the file’s pop-up menu, select Properties. The Properties window displays.'
