- pgno: 194
  md: "+   5 If you are choosing a viewer, do one of three things:\n+   \n+   ▼ Select\
    \ an application from the directory tree.\n+   or\n+   ▼ Use the Browse button\
    \ to find a viewer.\n+   or\n+   ▼ Type the path of a viewer.\n\nIf the chosen\
    \ browser is capable of displaying the file, then the file displays.\n\n# ## Viewing\
    \ Files From the Command Line\n\nLinux includes so many tools for viewing files\
    \ from the command line that some are widely considered obsolete.\n\nFor example,\
    \ cat is less commonly used than it once was, probably because it has few options.\
    \ However, cat is still useful for a quick, no-frills view of a short file.\n\n\
    Similarly, although more is still a functional tool, for most people it has been\
    \ replaced by less, whose name is a play on the saying that \"less is more.\"\n\
    \nIn general, less is the standard tool for viewing files. However, specialized\
    \ commands also exist:\n\n+   - **tac**: Displays files from the end backwards.\n\
    +   - **head**: Displays the first lines of a file.\n+   - **tail**: Displays\
    \ the last lines of a file.\n\n# ## Viewing Short Files: Using the cat Command\n\
    \nThe cat command is useful for viewing files that are less than a screen in length.\
    \ For longer files that you want to scroll back and forth in, use less instead."
  merge: -1
  img_proc: true
