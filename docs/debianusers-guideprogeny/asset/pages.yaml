    # ## Viewing User Information from the Desktop: Using the gw Command


    ![](img/e36b94f8548b09d00212238f073b11d9_246_1.png)


    The gw utility is the desktop equivalent of the w command. It displays information
    about users. If you are logged in as root user, it displays information about
    all users currently logged in. If you are logged in as a regular user, then only
    information about the current account displays.


    Type gw from a command line. The Active User screen opens.'
