    # ## Changing Owners


    Each file in Linux has an owner. This attribute gives users some privacy. It can
    also be used by the root owner to protect files from casual use or accidental
    damage.


    The owner of a file is usually the user who created the file. However, the owner
    may be changed by either the present owner or the root user.


    Valid owners are listed in the /etc/passwd file.


    An owner is identified by the user account or a user ID.


    # ## Changing Owners From the Desktop


    +   1. From the file''s pop-up menu, select Properties. The Properties window
    displays.'
