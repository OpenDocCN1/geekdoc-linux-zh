    # Scheduling With the at Command


    You can use the at command to schedule a command or script to run a single time.
    The command includes several utilities. See “Using the at Utilities,” page 335.


    > **Note**

    > If you want to schedule a command more than once, look into the `cron` tab command.


    By default, only the root user can use the at command. However, the root user
    can use two files to allow regular users the command:


    +   * /etc/at.allow: If this file exists, only users listed in it can use the
    command.

    +   * /etc/at.deny: If this file exists, users listed in it cannot use the command.'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'The at command depends on a plain text file. This file lists commands or scripts,
    one per line. The end of the file must be marked by `<EOF>` on a line by itself.


    The time for a task can be set using several formats. The simplest is a 24 hour
    clock in the HH:MM format, followed by the date in the MM:DD:YYYY format.


    You can enter commands by entering:


    +   ▼ The name of a plain text file in which commands or scripts are listed, one
    per line. Type: `at -I FILE COMMAND TIME DATE`.


    +   ▼ By entering the time and entering the commands at an at prompt, one per
    line. The end of the file must be marked by `<EOF>` on a line by itself. Type:
    `at TIME DATE`. This method is especially useful if you are entering multiple
    commands.


    # The at Command (Scheduling): Options


    | Option | Action | Comment |

    | :--- | :--- | :--- |

    | -c TASK | Displays listed tasks. | |

    | -d TASK | Deletes the specified tasks. | |

    | -f FILE | Read tasks from the file entered. | |

    | -l | Lists all tasks scheduled for the current user. | |

    | -m | Sends mail to the user when the task is run. | |'
  merge: -1
  img_proc: true
