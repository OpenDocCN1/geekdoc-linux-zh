- pgno: 296
  md: '# 12 Doing Everyday Administration


    To keep your Progeny Debian system running smoothly, you need to do some routine
    tasks. These tasks usually need to be done more frequently on a network, but they
    are also important on standalone desktop machines.


    The basic administration tasks are:


    +   - Managing Users.

    +      - Managing Groups.

    +      - Managing Printing and Print Jobs.

    +      - Managing Processes.

    +      - Backing up and Compressing Files.

    +      - Scheduling Tasks.

    +      - Checking Filesystems.


    Only the root user can do all these tasks. Regular users can only do some of these
    tasks for their own accounts.


    These tasks are generally done from the command line. Although desktop tools exist
    for some of them, few are as useful or as versatile as the commands that they
    are based on.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Managing User Accounts


    Linux is designed for multiple users. To use the system, you must log in with
    a user account. A user account consists of a user name, a password, and a number
    of saved settings.


    User accounts are organized into groups of accounts with similar access to the
    system. The software and the hardware you can use depends on your user accounts
    and the groups that it is in. See “Changing Individual Passwords,” page 301.


    # Adding a User Account


    New users can be added by the root user. Setting up a new user means:


    +   ▸ Adding the user to the list in /etc/passwd.

    +   ▸ Assigning an initial password. The user may change this password later.

    +   ▸ Creating a home directory, a mail file, and startup files.


    While you can configure files in a text editor, the easiest way to add a user
    is to use the useradd and passwd tools.


    Log in as the root user. Then:


    1 Create the new user. Type: useradd OPTIONS USER. The new user is added to the
    end of the /etc/passwd file.


    ![](img/e36b94f8548b09d00212238f073b11d9_297_0.png)


    > To fully set up the new account, type useradd -m -k directory user. The directory
    is the new user''s home directory.


    2 Create an initial password. Type: passwd USER. The password is now added to
    the /etc/shadow file. See “Change the group ownership on the files.'
  merge: -1
  img_proc: true
- pgno: 298
