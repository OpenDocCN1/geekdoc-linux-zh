  md: '# ## Reading Standard Log Files From the Command Line


    Standard logs are plain text files. You can use any viewing tools to view logs
    from the command line. The most useful tools are less, head, and tail. See “Viewing
    Files From the Command Line,” page 193.


    # ## Keeping a Log File Open Using the tail Command


    If you are troubleshooting, you may want to keep a log file open so that you can
    constantly refer to it:


    +   1 Log in as root user and open a command line.

    +   2 *Type:* `tail -f /log`.


    The `-f` option keeps the `tail` viewing command open as new messages are added
    to it.


    # ## Standard Log Files


    | Log | Contains messages about or from… |

    | :--- | :--- |

    | auth.log | Attempts to log on and log off the system. |

    | daemon.log | Daemons and attempts to use modprobe. |

    | debug | All parts of the system that might be useful for trouble-shooting. |

    | kern.log | The kernel. |

    | lpr.log | The printer. |

    | mail.err | Problems with the e-mail subsystem. Duplicates much of the information
    in mail.warn. |'
