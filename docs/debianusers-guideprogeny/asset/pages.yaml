    # # Reading Icon Properties


    You can add three main types of icons to the desktop:


    +   ▼ Directory: A folder on the desktop.


    ![](img/e36b94f8548b09d00212238f073b11d9_146_0.png)


    +   ▼ URL Link: A web page link.


    ![](img/e36b94f8548b09d00212238f073b11d9_146_1.png)


    +   ▼ Application: An icon to start a program. This icon is also the default.


    ![](img/e36b94f8548b09d00212238f073b11d9_146_2.png)


    No matter where they are - the work space, the menu, or the panel - all icons
    have the same properties. You can read an icon''s properties by'
