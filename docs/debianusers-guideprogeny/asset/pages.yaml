- pgno: 255
  md: '# Reading /proc Files


    The /proc directory contains several files that are useful when you are configuring
    or troubleshooting your system.


    # Information Files in the /proc Directory


    | File | Information |

    | --- | --- |

    | /proc/cpuinfo | General information about the system, including the processor
    type, its speed, and cache size. |

    | /proc/interrupts | Maps IRQ addresses to devices. |

    | /proc/parport | Information about parallel ports and the devices attached to
    them. |

    | /proc/sound | The system’s sound configuration, including the drivers installed.
    |


    **Warning**

    Changing these files can damage your system. Regular users should not have write
    permission to these files, and the root user should be careful about changing
    them.


    # Reading Log Files


    Log files record messages about all activities on your system. Some can be viewed
    by regular users, but many can only be viewed by the root user.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Logs are generally found in the /var/log directory. Their purposes are usually
    obvious: cron.log lists messages from crontab, daemon.log lists messages from
    daemons, and so on. The general log file is /var/log/messages. See “Standard Log
    Files,” page 257.


    Logs are controlled by syslogd daemon. This daemon starts almost as soon as your
    computer starts, and records most events that happen on the system. It is configured
    in the /etc/syslog.conf file.


    You can view logs from either the desktop or the command line. Information is
    in four column in standard log files.


    A few log files are not in the standard format. They cannot be read by using desktop
    tools, nor, in several cases, by using the standard command line viewing tools.
    See “Non-Standard Log Files,” page 259


    # ## Reading Standard Log Files From the Desktop


    +   1 From the menu, select Programs > System log monitor. The System log viewer
    window opens.


    ![](img/e36b94f8548b09d00212238f073b11d9_256_0.png)


    +   2 Choose a log to display. Select File > Open log. The default is /var/log/messages.


    +   3 If necessary, select an item from the View menu:'
  merge: -1
