    # Mounting and Unmounting Filesystems


    Mounting is the process of associating a filesystem with a directory on your system.
    A filesystem is a formatted partition or removable drive.


    Filesystems listed in the /etc/fstab file are generally mounted when the system
    starts. The settings in fstab also control how users can access each filesystem.


    You can also mount or unmount filesystems not listed in fstab. Removable drives
    must usually be mounted or unmounted each time you use them. However you can also
    set the automounter feature for removable drives.


    You must always mount a floppy or cd drive before using it, and unmount it before
    switching to another floppy or cd.


    At any time, you can see a list of currently mounted filesystems by opening /etc/mtab
    or by typing mount at a command line.


    # Mounting Drives When the System Starts


    The /etc/fstab (“filesystem table”) file lists filesystems that are mounted when
    your computer starts. You may choose to add other filesystems to fstab, but not
    mount them.'
