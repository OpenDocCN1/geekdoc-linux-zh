- pgno: 384
  md: '# Troubleshooting With a Network Card


    Progeny Debian should detect most network cards automatically. However, if you
    are having trouble establishing a connection:


    +   ▼ Check that the card is properly installed.


    +   ▼ Check that your ethernet card or other network interface card is supported
    by Linux.


    +   ▼ Check that your network card is working. Type: `ifconfig -a`. A list of
    active interfaces displays. Your network card is probably `/dev/eth0`.


    +   ▼ Check that your network card is active. Type: `ifconfig DEVICE up`. The
    card is probably `/dev/eth0`.


    # Checking a Modem Connection


    Modems are useful for dialup connections to the internet, or for receiving faxes
    on your system.


    Modems are probably the most difficult piece of hardware to work with under Linux.
    The problem is that many modems today, especially internal ones, are winmodems.
    That is, most of them require a running copy of Windows to work. While a few winmodems
    have Linux drivers available, these drivers are usually written for a specific
    kernel, and may not work if you upgrade the kernel.


    An external modem or a PCMCIA card should generally work. However, research brands
    on the internet to see if they are Linux compatible before you buy.


    To check that Linux recognizes your modem, type `dpkg-reconfigure pppconf` at
    the command line. `pppconf` is a tool for setting up a dialup connection. It starts
    by detecting the modem, then going on to configure a dialup connection.


    If your modem does not respond:


    +   ▼ Check that it is not a winmodem.


    +   ▼ Check that it is properly connected to your system and to a live phone jack.'
  merge: -1
  img_proc: true
