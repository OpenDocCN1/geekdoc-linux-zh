    # Recompiling a Kernel


    The Linux kernel contains the drivers for hardware, filesystems, and other features
    of the operating system.


    Since most types of hardware or feature has its own modules, you can make your
    operating system quicker and more efficient by only loading support for what is
    actually on your system.


    You may need to reconfigure the kernel when you add or remove hardware or other
    features. You can temporarily enable a module, with the modprobe command. However,
    if you reboot the system, you will need to use the command again.


    Making permanent changes to the kernel consists of three steps:


    +   1.  Editing the kernel.

    +   2.  Building or compiling the kernel.'
  merge: -1
  img_proc: true
- pgno: 354
  md: "# 3 Installing the kernel.\n\nHowever, before configuring the kernel, you should\
    \ gather information about the present configuration, and prepare carefully so\
