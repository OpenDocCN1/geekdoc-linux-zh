- pgno: 329
  md: '# Scheduling With the crontab Command


    You can use the `crontab` command to run commands at regular times. For example,
    you could schedule a backup of your files every Friday. Commands can be scheduled
    to the minute.


    > Note

    > If you want to schedule a command to run only once, look into the at command.


    The `crontab` command works by reading a crontab file. A crontab file is a plain
    text file that lists all the jobs you have scheduled.


    Each line of the crontab file consists of the command with all its options and
    arguments, and the date and time to run it.


    By default, all users can set up their own crontab files. However, the root user
    can use two files to control access:


    +   * `/etc/cron.allow`: If this file exists, only users listed in it can use
    crontab.

    +   * `/etc/cron.deny`: If this file exists, users listed in it cannot use crontab.


    All crontab files are stored in the `/var/spool/cron/crontabs/` directory. However,
    since regular users do not have read or write permission to this directory, they
    must use the `crontab` command to schedule jobs.


    In addition, many system administrators use three files to schedule jobs: `/etc/cron.daily`,
    `/etc/cron.weekly`, and `/etc/cron.monthly`. As the names suggest, these directories
    contain regularly scheduled jobs that run at daily, weekly or monthly intervals.


    To use a crontab file:


    +   1. Type: `crontab OPTIONS USER` or `crontab -e`.


    Only the root user can specify another user''s crontab file.


    The crontab file opens in the vim editor. The first time that you use a file,
    it is blank.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '+   2 Enter the file, and save it. See “Editing and Reading a crontab File,”
    page 329.


    # The crontab Command (Scheduling)


    Option | Action | Comment

    ---|---|---

    -e | Opens a user’s crontab file in the vi text editor. | If no user is specified,
    the crontab file opened is the current user’s.

    FILE | Creates a crontab file. | Mostly useful for placing the file in a non-standard
    location.

    -l USER | Views a user’s crontab file. | Usable only by the root user.

    -r USER | Removes a user’s crontab file. | Usable only by the root user.

    -u USER | Sets which user’s crontab file is affected. | Usable only by the root
    user.


    # Editing and Reading a crontab File


    To edit a crontab, type crontab -e user. The file opens in the default editor
    for the current user.


    Each line in a crontab file schedules a single task.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# Note


    If you need to use a percentage sign, put a back slash in front of it: \%. Otherwise,
    it is read as the start of a new line, and the command does not run.


    Each line consists of six columns, each one separated by a line or a tab. Each
    of the first five columns is an option for setting the date and time. Each of
    the first five columns can specify:


    +   A particular date or time. See “Column Entries in a Crontab File,” page 331.


    +   A series of dates or times, with a comma between them.


    +   A range of dates or time, beginning with the start, with a hyphen between
    them.


    The sixth column is the command to run, including options and arguments. No quotation
    marks are needed to enclose the command.


    For example, 0 12 * * * /usr/share/bin/alarm would run a script called alarm every
    day at noon.


    # Note


    Jobs only run if the time and date match all column settings. Setting column 3
    to 1 and column 5 to 1 would only run a job when the first of the month falls
    on a Monday.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Note


    Since you are editing a plain text file, no validity check is made. If you set
    column 3 to 31 and column 4 to 2, setting the time to February 31, then the job
    never runs.


    # Column Entries in a Crontab File


    | Column or Option (from left to right) | Argument | Comments |

    | --- | --- | --- |

    | 1 Minute | 0-59 |  |

    | 2 Hour | 0-23 | 0 is midnight. |

    | 3 Day of the month | 1-31 |  |

    | 4 Month | 1-12 |  |

    | 5 Day of the week | 0-6 | 0 is Sunday. |

    | 6 Job | any command | Options or arguments can be included. No quotation marks
    are needed around the string. |'
  merge: -1
