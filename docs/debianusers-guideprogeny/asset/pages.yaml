    \n+   ▼ For a list of currently loaded kernel modules, type: modprobe -l.\n+ \
    \  ▼ To see the version of the kernel you are using, type: uname -r.\n\n# **Preparing\
    \ to Build a Kernel**\n\n+   ▼ Make sure that you have a usable rescue disk. If\
    \ the kernel does not work after you build it, the rescue disk gives you a way\
    \ to start your system and correct the problem.\n+   \n+   ▼ Make a copy of your\
    \ kernel and give it a different name. Usually, your kernel is /boot/vmlinuz*.\
    \ The kernel number usually repeats the file – for example, vmlinuz-2.2.18 or\
    \ vmlinuz-2.4.2.\n+   \n+   If you are unsure of your kernel’s name, check the\
    \ boot manager entries.\n+   \n+   ▼ Add a stanza for your kernel to the boot\
    \ manager. By adding this entry, you ensure that you can start your system if\
    \ the kernel does not work after you build it.\n+   \n+   ▼ Gather information\
    \ about any hardware whose settings you are enabling or changing. Use the manuals,\
    \ the system’s BIOS settings, and Linux’s information commands to find the information\
    \ you need. See “Reading System Information,” page 241.\n\n# **Selecting Modules**\n\
    \nThe first step in configuring the kernel is to select the modules to enable:\n\
    \n+   1 While logged in as root user, type cd /usr/src/linux.\n+   2 Open one\
    \ of the kernel editing tools:\n+   \n+   ▼ make menuconfig: a command line tool\
    \ with a basic interface.\n+   ▼ make xconfig: a desktop tool."
