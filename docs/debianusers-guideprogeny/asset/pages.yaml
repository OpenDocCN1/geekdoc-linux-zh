    # Configuring a Network Connection


    A Dynamic Host Configuration Protocol (DHCР) connection is the most

    common network connection today. In addition, a DHCР connection is also

    used for an ADSL or cable internet connection.


    Nowadays, the connection is generally through an ethernet card. However,

    another type of network interface card may also be used.


    # Preparing to Configure a Network Connection


    Before you start to configure the network, you need to know:


    +   The type of card you use to connect to the internet. On most modern

    +   computers, the card should be an ethernet card. If you are on a laptop,

    +   you are probably using an ethernet interface with a PCMCI A card. Consult

    +   the documentation that comes with the card.


    Consult your system administrator or internet provider for:


    +   Your user account.

    +   Your domain name.

    +   Your computer''s IP address and hostname.

    +   The IP address of your network.'
