- pgno: 24
  md: '# # Introducing Progeny Debian


    Progeny Debian is a version of the Debian GNU/Linux operating system. The cds
    that come with this manual contain not only a complete operating system, but also
    the tools and games for most computing needs.


    If you want an even larger selection of software, you can download it for free
    from the Progeny web site (http://www.progeny.com/download) or Debian web site
    (www.debian.org).


    This manual is designed to get started with Progeny Debian. It is also designed
    for use in front of your computer.


    The manual does not assume that you are an expert. However, it does assume that
    you have used computers before, and want to transfer your skills to Linux.


    At the very least, you are assumed to be willing to learn. Linux tools have come
    a long way in the last few years, but Linux is still built with a do-it-yourself
    philosophy. While you can ignore this philosophy, adapting it can bring a sense
    of power and control to your computing.


    If you master this manual, you will still not be an expert. To cover Linux completely
    requires hundreds of pages. However, you should be able to configure the basic
    parts of your system and be ready to explore Linux on your own.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# ## Learning About Linux


    Linux is an operating system: a series of programs that let you interact with
    your computer and run other programs.


    Linux is modelled on the UNIX operating system. From the start, Linux was designed
    to be a multi-tasking, multi-user system. These facts are enough to make Linux
    different from other well-known operating systems.


    However, Linux is even more different than you might imagine. In contrast to other
    operating systems, nobody owns Linux. Much of its development is done by unpaid
    volunteers.


    Development of Linux began in 1984, when the GNU Free Software Foundation (www.gnu.org)
    began development of a free UNIX-like operating system. Its name is derived from
    that of Linus Torvalds, who began development of a UNIX-like kernel in 1991. While
    many groups and individuals have contributed to Linux, the largest single contributor
    is still the Free Software Foundation, which created not only most of the tools
    used in Linux, but also the philosophy and the community that made Linux possible.


    Linux is released under the GNU General Public License (GPL). Unlike most software
    licenses, the GPL encourages users to freely copy, change, and distribute source
    code. For the Free Software foundation, the emphasis of the GPL is on free software
    as a philosophical right. The group that focuses on applying the ideals in the
    GPL to business solutions is called the Open Source movement. Its emphasis is
    on the faster development and higher quality of software released under a public
    licence. However, to outsiders, these differences are mainly a matter of emphasis.


    Although the GPL is often said to encourage fragmentation, Linux remains more
    or less standardized for several reasons.


    First, final approval of changes to the kernel are overseen by Linus Torvalds
    and his closest associates, especially Allan Cox.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Second, Linux is released in different versions or distributions. Some distributions,
    like Debian, are volunteer efforts. Others, like Progeny, are largely commercial.
    However, all programs are kept as compatible as possible within the same distribution.
    Many programs also work with other distributions, or can be made to work with
    a little effort.


    Third, volunteer software projects are usually coordinated by informal project
    managers known as maintainers. Although anyone can write improvements to a piece
    of software, the maintainer makes the final decision about which improvements
    become an official part of the project. Usually, the maintainer makes these decisions
    after consulting the leading contributors to the project.


    These mechanisms are loose enough that Linux users still have immense freedom
    of choice in their software. For example, Linux users can choose from a dozen
    different command line shells and several graphical desktops. This selection is
    often bewildering to users of other operating systems, who are not used to thinking
    of the command line or desktop as something that they can change.


    In addition to software selection, Linux is less likely to crash, better able
    to run more than one program at the same time, and more secure than many operating
    systems. With these advantages, Linux is the fastest growing operating system
    in the server market. More recently, Linux has begun to be popular among home
    and business users as well.


    # # Learning About Debian


    Development at Progeny Linux Systems is based on Debian GNU/Linux (www.debian.org).
    Debian is a popular version of Linux. It is developed by a decentralized team
    of over 600 volunteer programmers in all parts of the world, and includes over
    6000 software packages.


    Debian was founded in 1993 by Ian Murdock, now president and CEO of Progeny. The
    name of Debian combines Ian’s name with that of his wife Debra. Its full name,
    Debian GNU/Linux, recognizes the central role of the GNU Free Software Foundation
    in developing Linux.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Debian has been a major force in the rise of Linux and Open Source software
    over the last seven years. In fact, the Debian Free Software guidelines became
    the main source of the Open Source Definition in 1998. Although Debian has been
    almost entirely non-commercial, it is one of the most popular distributions of
    Linux. It is also the basis for several commercial distributions, including Progeny
    Debian.


    Debian is especially popular among advanced users because of its technical excellence
    and its deep commitment to the needs and expectations of the Linux community.
    Debian also introduced many features to Linux that are now commonplace.


    For example, Debian was the first Linux distribution to include a package management
    system for easy installation and removal of software. It was also the first Linux
    distribution that could be upgraded without requiring rein-stallation.


    Debian continues to be a leader in Linux development. Its apt program is second
    to none for managing software over the Internet. Moreover, its development process
    is an example of just how well the Open Source development model can work - even
    for very complex tasks such as building and maintaining a complete operating system.


    # Learning About Progeny Debian


    Progeny Debian is not a distribution spun off from Debian in the sense that Mandrake
    is based on Red Hat. Progeny''s efforts are contributions to Debian, not a replacement
    for it. In fact, many Progeny employees are (or have been) actively involved with
    Debian.


    One of Progeny Debian''s main goals is to bring ease of use and system integration
    enhancements to Debian without taking away the flexibility and power of the underlying
    Debian system. The areas that Progeny is working in include installation, system
    administration, hardware detection, and software management.


    Another goal is to apply an additional testing and release cycle to the general
    Debian development cycle. Progeny hopes that this effort will help Debian provide
    its users with more frequent current and stable releases.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'So far as possible, Progeny works with existing free software, and with existing
    Debian development efforts. As with Debian, all of Progeny Debian''s development
    occurs in an open forum. Everyone is welcome and encouraged to participate.


    To get involved in Progeny''s Debian development efforts, subscribe to the progeny-debian
    mailing list. Send an e-mail to progeny-debian-request@lists.progeny.com with
    the word subscribe in the subject line or message body.


    # What is in this Product?


    The box that this manual came in should contain:


    +   The Install CD, containing the operating system.


    +   The Extras CD, containing additional programs, including the KDE desktop.


    +   Two source code CDs.


    +   A boot floppy for systems that cannot start from the CD drive.


    +   A registration card for technical support a three month subscription to the
    Progeny Service Network.


    +   The Progeny Debian User''s Guide (this manual).


    If anything is missing, please contact Progeny Linux Systems at 1-317-833-0313
    or custserv@progeny.com.


    # Conventions Used in This Manual


    To help you concentrate on learning, this manual uses as few conventions as possible.
    In fact, it has only three:


    +   When you have to choose an icon or menu item with the mouse, you may be told
    to "select" or to "click" or "click on." All these instructions mean that you
    should select an item with the cursor while depressing the left mouse button.'
  merge: -1
  img_proc: true
- pgno: 29
  md: "Similarly, “right click” means to use the right mouse button, while, “middle\
    \ click” means to use the middle mouse button or the equivalent.\n\n+   Information\
    \ to type appears in a sans serif text, like this: chmod 777 todo.txt. Punctuation\
    \ after this text should not be typed.\n\n+   Small capitals in sans serif text\
    \ indicate variable information. For example, the standard format for a command\
    \ is:\n+   **COMMAND OPTIONS ARGUMENT FILES**\n+   \n+   The small capitals in\
    \ gray indicate that any command can replace the word “command,” any options the\
    \ word “options,” and so on.\n\n# Note\n\nWhenever files are a variable, you can\
    \ also use a directory name.\n\n# Note\n\nVariable information often includes\
    \ **SOURCE** and **TARGET**. The source is the file that original information\
    \ is taken from. The target is the file that is acted upon.\n\nFor example, when\
    \ a file is copied, the source is the file being copied, and the target is the\
    \ new copy that is created.\n\n# Familiarizing Yourself with Linux\n\nThis manual\
    \ introduces concepts as you are likely to need them. For now, here are some concepts\
    \ that may be new to you:\n\n+   Linux generally uses a three-button mouse. If\
    \ you do not have a middle mouse button, you can emulate three buttons by clicking\
    \ the left and the right mouse buttons at the same time.\n\n28\n\nIntroducing\
    \ Progeny Debian"
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   The command line is much more flexible than you might think. It includes
    the abilities to cut and paste, to re-use previous commands, and to complete what
    you have typed in with a command.


    +   For greater security, Linux makes strict use of accounts. Unlike some operating
    systems, you cannot bypass logging in to the system by pressing the Enter key.
    Most users have only limited access to files. Typically, only the root user (also
    called the super user or system administrator) has access to all files.


    +   Linux has a consistent system for naming hardware, but the system is different
    from that of other popular operating systems. You should know the Linux naming
    system to avoid accidentally over-writing information.


    +   Linux’s directory system is similar to UNIX’s. Knowing the structure can help
    you find files.


    +   Progeny Debian includes the GRUB boot manager. With a boot manager, you can
    use more than one operating system on the same computer.


    +   Many Linux system settings can be changed by editing a configuration file
    in a text editor.


    +   Linux provides services such as printing through a number of independent programs
    or processes. Processes that start with your machine and run in the background
    until you need them are called daemons.


    At first, these differences may seem overwhelming. Take your time and learn them
    as the need arises. Once you have learned them, you will find that the features
    of Linux give you more convenience, efficiency, and hands-on control than other
    popular operating systems.'
  merge: -1
  img_proc: true
