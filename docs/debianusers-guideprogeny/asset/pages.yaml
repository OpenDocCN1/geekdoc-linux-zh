- pgno: 115
  md: '# # Entering Commands


    To new users, a command can look overwhelming. However, once you realize that
    all commands follows the same basic structure, you can start using them efficiently.


    This section covers:


    +   * Understanding the parts of a command.

    +   * Understanding command structures.

    +   * Entering multiple file names.

    +   * Entering wild cards.

    +   * Entering multiple commands.

    +   * Combining commands.

    +   * Running commands in the background.


    # # Understanding the Parts of a Command


    A command is sometimes a single word. However, a command may include:


    +   * Options: variations on how the command is carried out. Options begin with
    one hyphen (-) if they were developed for UNIX or by unaffiliated programmers,
    or by two hyphens (--) if they were developed by the GNU Foundation. Because GNU
    commands are often complete words, they are often more user-friendly.

    +   * Arguments: Fixed values that affect exactly what the command does, or how
    it does it.

    +   * Directories or files: What the command affects. Some commands, such as cp
    (copy) need a source file (the file being worked with) and a target file (the
    one affected).

    +   * Strings: A set of characters enclosed by double or single quotation marks.
    Often, a string contains a regular expression or wild card.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'What a command does can vary greatly, depending on what options, arguments,
    and files are used. For example, If you simply type date, then the current date
    and time display. However, if you type date 0707132101, then your computer’s date
    is changed to 1:21 PM on July 7, 2001.


    # Note


    Commands, options, and arguments are often abbreviated descriptions of what they
    do. For example, cp copies a file, while su switches the user account you are
    using. Similarly, in some commands, the -v option is short for version, and lists
    the version number of the command. Knowing the full description is a useful way
    to memorize commands.


    # Understanding Command Structures


    The parts of a command are always entered in the same order:


    COMMAND OPTIONS ARGUMENT FILES


    A typical command is chgrp -Rv root /home/itang/ToDo.


    In this example:


    +   chgrp is the basic command. It is short for “change group.” It transfers the
    ownership of the file at the end of the command from one group of users to another.


    +   • -Rv are two options:


    +       • -R (recursive) makes the command affect all files and sub-folders below
    the directory at the end of the command.


    +       • -v (verbose) makes the command list the files and folders as it changes
    them.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Note


    You only need one hyphen for both commands. However, you can enter -R -v if you
    prefer.


    +   root is an argument. In this case, it means that the ownership of the directory
    will be transferred to the root user.


    +   /home/itang/ToDo is the directory whose ownership is being changed. Originally,
    it belonged to the user itang, since it is in the home directory for that user.
    After the command is run, the ToDo directory will belong to the root user.


    # Understanding Common Options


    Many options differ with each command. However, a few basic options are used reasonably
    consistently. Some may have slight variations, such as using upper or lower case
    letters. If you have any doubt about an option, check the help before using it.


    # Common Command Options


    | Option | What It Does |

    | --- | --- |

    | ▾ -d | Displays debugging information |

    | ▾ --debug |  |

    | ▾ -f | Runs the command no matter what the consequences, such as over-writing
    existing files. |

    | ▾ --force |  |

    | --help | Displays info help for the command |'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Common Command Options


    | Option | What It Does |

    | --- | --- |

    | ▼ -i, --interactive ▼ --ignore-case | ▼ Waits for confirmation before doing
    each part of the command (i, interactive). |

    | or ▼ Ignores the distinction between lower case and capital letters (ignore-case).
    | |

    | ▼ -R, -r ▼ --recursive | Includes files and sub-directories of the directory
    name in the command. |

    | ▼ -V, -v ▼ --verbose | Displays what a command is doing so you can see its progress.
    |



    # Entering Multiple File Names for a Command


    The simplest way to have a command affect multiple files is to enter the file
    names with a space between them. Because this method specifies which files are
    affected by the command, it reduces the chances of accedently applying the command
    to the wrong file.


    For example, if a user called mary wanted to copy files called tasklist and notes
    to her backup directory, she would type:


    ```

    `cp /home/mary/tasklist notes /home/mary/backup/`

    ```


    # Entering Commands with Strings


    Some commands use a string as an argument. A string is a combination of letters,
    numbers, characters and/or spaces inside single or double quotation marks.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Within a string, you can type in multiple words, or disable metacharacters
    (also known as wild cards). A string that uses metacharacters is referred to as
    a regular expression. See “Using Metacharacters or Wild Cards,” page 118.


    If you use double straight quotation marks, all metacharacters are disabled except
    environment variables, such as $HOME.


    Single straight quotation marks disable all special characters. In most cases,
    use single quotation marks.


    Do not use true quotation marks (“ ”). True quotation marks may be a problem if
    you copy and paste from a word processor.


    For example, if you wanted to search user jsmith’s home directory for a file that
    contained the phrase “business expenses,” you would use the grep command with
    the phrase as an argument: grep ''business expenses'' /home/jsmith/.


    # **Using Metacharacters or Wild Cards**


    Metacharacters are characters that designate a range of choices. They are also
    called special characters or wild cards.


    You may know the basic metacharacters from other operating systems:


    +   ▼ A asterisk (*) includes any number of characters.

    +   ▼ A question (?) mark includes any single character.


    **Warning**

    Metacharacters can be extremely powerful, especially when used in combination.
    Be careful about using them when you are deleting and copying files.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Note


    If you want to search for a character that is usually used as a metacharacter,
    place a backward slash (\) in front of it. For example, \? searches for a question
    mark, instead of any character.


    # Metacharacters or Wild Cards


    | Metacharacter | Stands for |


    +   - . | Any character except a new line marker.


    +   - ? | Any one character, or none.


    +   - [ ] | Any one of the enclosed characters.


    +   - * | Any number of characters, or none.


    +   - ^STRING | The string at the start of the line.


    +   - STRING$ | The string at the end of the line.


    +   - STRING+ | Match one or more of the characters in the string


    +   - STRING | Match a range of instances


    +   - (STRING | STRING) | One of the strings.


    Metacharacters are especially powerful when used together. For example:'
  merge: -1
  img_proc: true
- pgno: 121
  md: '+   * `^contacts$` matches text in which `contacts` is the only word on a line.


    +   * `[Cc]ontacts` matches `Contacts` or `contacts`.


    +   * `^...5` searches for any line of three characters.


    +   * `compan(y|ies)` searches for `company` or `companies`.


    +   * `[A-Za-z]` searches for any upper or lowercase letter. Similarly, `[0-9A-Za-z]`
    searches for any number or any letter.


    # ## Entering Multiple Commands


    Separate multiple commands by a semi-colon.


    For example, if you type `cd /backup;ls s*`, you move to the `/backup` directory
    (using `cd`), and list all files in the directory that start with `s`.


    # ## Combining Commands


    You can combine commands by typing them with the pipe character (`|`) between
    them. This technique is known as piping.


    For example, if you type `ls|less`, you display the files of the current directory
    (`ls`) using the `less` command, which allows you to scroll back and forth in
    the list. This combination would be useful if you had a long list of files.


    ![](img/e36b94f8548b09d00212238f073b11d9_121_0.png)


    # ### Warning


    Use piping carefully. Sometimes, it has unwanted or unexpected results.


    # ## Running Programs in the Background


    If you are using the X Window System, the command prompt is generally in its own
    window. As a result, you can easily do another task while a command is running.
    However, if you are using only the command line, you can run a command in the
    background, so that you can use the shell for another task while the command is
    running.


    To run a command in the background, type `COMMAND &`.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# # Stopping Commands from Running


    Press Ctrl-C.


    The command that is running stops. Then a new command prompt displays below the
    previous one.


    # # Navigating the Command Line


    Linux systems store files in directories. The directories are arranged in a tree-like
    structure. At the top of the tree is the root directory (\/. Even directories
    on another partition are sub-directories of the root directory. See “Searching
    for Files and Text,” page 167.


    Using a few basic commands, you can


    +   - Change directories.

    +   - Read the contents of directories.

    +   - Identify the type of entries in a directory.

    +   - Find your current directory.

    +   - Clear the screen.


    # # Changing directories


    *Type cd* DIRECTORY.


    Unless the directory you are changing to is a sub-directory of the current one,
    usually you should type the full path name to the directory.


    To change to the directory immediately above the present one, type cd..(two periods).


    # # Reading the Contents of Directories


    *Type ls* OPTIONS DIRECTORY.


    By carefully selecting your options, you can use the ls list command to help you
    locate files. For example, -s lists files in order of size, while -t lists files
    by when they were modified.'
  merge: -1
  img_proc: true
- pgno: 123
