- pgno: 38
  md: '# Gathering Information About Linux Device Names


    Linux uses its own system for naming hardware. If you know this system during
    installation, you can choose your options more intelligently. You can also avoid
    over writing partitions that you want to keep.


    # Understanding Device Names


    All operating systems use a system for naming devices such as hard drive partitions
    and serial and parallel ports.


    Partitions are subdivisions of your hard drive. Serial and parallel ports are
    connectors on the back of your computer where devices such as a mouse or printer
    can be connected to the system.


    No matter what operating system you are using, hard drives are divided into partitions.
    Partitions can be of three types: primary, extended, and logical.


    +   - A hard drive can have up to four primary partitions. However, as hard drives
    grew in size, a way around this limitation was needed. The answer was logical
    partitions, which can be partitioned into any number of smaller or extended partitions.


    # Finding Information About Partitions


    You can find information about your partitions by using:


    +   - `fdisk` on Linux or Windows.

    +   - A partitioning tool such as GNU parted or PartitionMagic.


    # Understanding Windows Device Names


    Many users are familiar with Window’s naming system:


    +   - A and B are the first and second floppy drives.

    +   - The first primary partition is C. Often, this is the only partition on a
    Windows system.

    +   - All primary partitions on all hard drives are named first.'
  merge: -1
  img_proc: true
- pgno: 39
  md: "+   · Logical drives are named, starting with the first one on the first hard\
    \ drive.\n\n+   · The last drive letter is the CD drive.\n\n+   · Serial ports\
    \ are prefixed with COM and start at 1.\n\n+   · Parallel ports are prefixed with\
    \ LPT and start at 1.\n\nThe Windows naming system has several problems. First,\
    \ few modern computers have a second floppy drive. Therefore, B is rarely used.\n\
    \nMore importantly, if you add or delete one partition, the names of many partitions\
    \ can change. As a result, you can easily lose track of your partitions.\n\n#\
    \ Understanding Linux Device Names\n\nLinux takes a consistent approach to naming\
    \ All drives and ports are named in the same way:\n\n+   · An ID for the type\
    \ of device. These IDs include hd for an IDE hard drive, ttyS for a serial port,\
    \ and lp for a parallel port.\n\n+   · A letter ID for the device. If, like most\
    \ users, you have an IDE system, then:\n\n+   ◇ a is the primary master device.\n\
    \n+   ◇ b is the primary slave device.\n\n+   ◇ c is the secondary master device.\n\
    \n+   ◇ d is the secondary slave device.\n\n> **Note**\n> \n> Check your BIOS\
    \ or the contents of each device to find details about master and slave devices.\n\
    \n+   · A number ID for the partition or port. Primary or extended partitions\
    \ are named 1~4, while logical partitions are named 5 or higher.\n\n+   · Serial\
    \ and parallel ports start with 0, and can have any number."
  merge: -1
  img_proc: true
- pgno: 40
  md: 'For example, the first partition on the first IDE hard drive is hda1. Similarly,
    the first serial port is ttyS0.


    This naming convention is simple, and gives you information about your system.
    The device ID gives you information about the type of hardware installed, while
    the partition ID tells you whether it is a primary or logical partition.


    In addition, if you add or delete partitions, only the number ID changes. Even
    then, it can only change so far. A logical partition can never become hda4, because
    4 is reserved for primary partitions. By contrast, D could be either type of partition
    under Windows.


    Similarly, when you re-arrange primary partitions on one hard drive, the numbering
    of primary partitions on other hard drives is unaffected. Under Windows, changing
    primary partitions on any drive affects all primary partitions on the system.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# ## Reading Linux Device Names


    Before you install, decide whether you want to keep any existing partitions on
    your system. If you do, then translate the partition names to the Linux conventions
    so that you know where they are when you install.


    # ## Linux Device Names


    | Device Type | General | Specific |

    |---|---|---|

    | Partitions on an IDE hard drive or a CD drive | hd | A letter, starting with
    a, then: <br> ▼ 1 to 4 for a primary or extended partition. <br> ▼ 5 or more for
    a logical partition. |

    | Partitions on an SCSI hard drive or a CD drive | sd | A letter, starting with
    a, then: <br> ▼ 1 to 4 for a primary partition. <br> ▼ 5 or more for a logical
    partition. |

    | Floppy drives | fd | A number, starting with 0. |

    | Serial or COM ports | ttyS | A number, starting with 0. |

    | Parallel ports | lp | A number, starting with 0. |


    # ## Translating Windows Names to Linux Names


    If you are installing Linux on an existing computer, translate Windows names to
    Linux names to avoid confusion. For example, if all your Windows files are on
    C, then you need to translate C into the Linux name if you want to be sure that
    you never delete or reformat the partition.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/e36b94f8548b09d00212238f073b11d9_42_0.png)


    # Note


    On most computers, your Windows C partition is hda1 in the Linux naming system.
    However, check before working with any partitions.


    Notice, too, that port names on Windows start with 1, while on Linux they start
    with 0.


    # Linux Equivalents for Common Windows Device Names


    | Type of Device | Windows | Linux |

    |---|---|---|

    | 1st floppy drive | A | fd0 |

    | 1st partition, 1st hard drive (IDE) | C | hda1 |

    | 1st partition, 1st hard drive (SCSI) | C | sda1 |

    | 1st serial port | com1 | ttyS0 |

    | 1st parallel port | lpt1 | lp0 |


    # Backing Up Your System


    Before you start to install Progeny Debian, back up your system. At the very least,
    make copies of important files. You may also want to create new rescue disks for
    existing operating systems.


    41


    Preparing to Install Progeny Debian'
  merge: -1
  img_proc: true
