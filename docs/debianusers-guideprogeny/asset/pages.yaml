- pgno: 418
  md: '# Upgrading from the Debian Testing Release


    Upgrading from the Debian testing release may have mixed results. Depending on
    when the release was last upgraded, it many contain packages that Progeny Debian
    has not tested. Because of the strong possibility that upgrades from the testing
    release will cause problems on your system, Progeny Linux Systems does not support
    them.


    If you want to try an upgrade anyway, backup all important information and follow
    the instructions for upgrading from Debian 2.2.


    Otherwise, do a complete install that includes reformatting of all Linux partitions.


    # Upgrading from the Debian Unstable Release


    The Debian unstable release is changing rapidly, and includes many packages not
    tested by Progeny. For these reasons, upgrading from the Debian Unstable Release
    is not supported by Progeny Linux systems. Instead, do a normal install, reformatting
    all Linux partitions.


    # Upgrading from VA Linux Debian Set


    The VA Linux Debian distribution was released between Debian 2.1 and 2.2, and
    is a mixture of the two.


    +   1 Add the following line at the top of the `/etc/apt/sources.list` file: deb

    +      http://archive.progeny.com/progeny stable main contrib non-free.

    +   2 Run the following commands:

    +   a apt-get update.

    +   b apt-get -f dist-upgrade.

    +   c apt-get install debconf.

    +   d apt-get install progeny-slink-upgrade.

    +   3 Install the Progeny Debian standard system package. Type: apt-get install
    progeny-standard-system.'
  merge: -1
  img_proc: true
- pgno: 419
  md: '+   4. Remove the Progeny Debian upgrade package. Type: `dpkg --remove progeny-slink-upgrade`.


    +   5. Restart your system. This step is recommended, but optional.


    # Upgrading from Debian 2.2 With Ximian (Helix) GNOME


    Ximian GNOME (formerly known as Helix) is a customized version of the GNOME desktop.
    It may be installed over an existing Debian version, most likely Debian 2.2. It
    is also a standard part of the Storm hail release and the latest releases of Libranet.


    ![](img/e36b94f8548b09d00212238f073b11d9_419_0.png)


    # Note


    > Due to the timing of releases, systems using earlier versions of Debian with
    Ximian GNOME are uncommon.


    +   1. Add the following line at the top of the `/etc/apt/sources.list` file:
    `deb http://archive.progeny.com/progeny stable main contrib non-free`.


    +   2. Remove Ximian’s customized packages. Enter the following series of commands:

    +       a. `apt-get remove mc-common`.

    +       b. `apt-get remove libpopl0`.

    +       c. `apt-get remove libgtk1.2`.

    +       d. `apt-get remove gnome-games-locale`.


    +   3. Repeat the following command until all package dependencies have been satisfied:
    `apt-get -f dist-upgrade`.


    +   4. Install the Progeny Debian 2.2 upgrade package. Type: `apt-get install
    task-progeny-potato-upgrade`.'
  merge: -1
  img_proc: true
- pgno: 420
  md: '5 Install the Progeny Debian standard system package. Type: apt-get install
    progeny-standard-system.


    6 Remove the Progeny Debian 2.2 upgrade package. type: dpkg --remove progeny-potato-upgrade.


    7 Restart your system. This step is recommended, but optional.


    # Upgrading from Storm Linux


    Storm Linux is a Debian-based distribution, available in two releases: rain and
    hail.


    To upgrade the Storm Linux rain release, follow the instructions for upgrading
    from older versions of Debian.


    To upgrade the Storm Linux hail release, follow the instructions for upgrading
    from Debian 2.2 with Ximian GNOME.


    # Upgrading from Libranet


    Libranet is a Debian-based distribution, available in a number of releases. Before
    upgrading, check which version of Debian the Libranet release is based on, then
    follow the instructions for that Debian version. The latest versions of Libranet
    can be upgraded by following the instructions for upgrading from Debian with Ximian
    GNOME.


    # Upgrading from Corel Linux


    Corel Linux is a Debian-based distribution, available in two releases. Because
    of the extensive changes in Corel Linux, upgrading it to Progeny Debian is neither
    recommended nor supported.


    Instead, users of all releases of Corel Linux should backup all important information,
    and do a complete install of Progeny Debian that includes reformatting all Linux
    partitions.


    To reproduce the look and feel of Corel Linux as closely as possible, install
    KDE from the Extras CD and use it as the default desktop.'
  merge: -1
  img_proc: true
