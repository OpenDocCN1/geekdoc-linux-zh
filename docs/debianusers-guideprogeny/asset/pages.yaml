- pgno: 200
  md: '# Making Simple Comparisons of Files: Using the comm Command


    Use the `comm` command for a basic comparison of text files. For more advanced
    comparisons, use `diff`.


    *Type:* `comm OPTIONS 1ST_FILE 2ND_FILE`.


    The results are printed in three columns. From left to right, they are:


    +   1. Lines unique to the first file.

    +   2. Lines unique to the second file.

    +   3. Lines common to both files.


    Use the -`NUMBER` option to keep a column from displaying. Arguments are 1, 2
    or 3.


    If you want to block two columns, enter them without any comma or space between
    them. For example, if you want to display only lines common to both files, enter
    `-12`.


    * The `comm` command has no other options.


    # Making Complex Comparisons: Using the diff Command


    Use the `diff` command if you want to:


    +   - Compare two directories, including their sub-directories.

    +   - Show lines before and after differences.

    +   - Use metacharacters.


    *Type:* `diff OPTIONS 1ST_FILE 2ND_FILE`.'
  merge: -1
  img_proc: true
