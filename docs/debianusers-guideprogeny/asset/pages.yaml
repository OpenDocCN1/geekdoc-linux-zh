    # Changing Permissions


    Permissions define how users can work with a file or directory - or whether they
    can work with it at all. Permissions are also called access rights, or file or
    access permissions.


    The three types of permissions are:


    +   - Read: Permission to view. For a directory, this permissions means that you
    can view the contents. Abbreviated to r in file attributes.


    +   - Write: Permission to change. For a directory, this permission means that
    you can add or remove files form it. Abbreviated to w in file attributes.'
  merge: -1
  img_proc: true
- pgno: 229
  md: "+   Execute: Permission to run if the file is a binary. For a directory, this\
    \ permission means that you can view the file attributes and change into the directory\
    \ or its sub-directories. Abbreviated to x in file attributes.\n\nA hyphen (-)\
    \ in the list of file attributes indicates that no permission is set.\nIn addition,\
    \ a file may be set as Sticky. That means that only the user or root user can\
    \ delete it.\n\nPermissions are set for three categories of users:\n\n+   The\
    \ owner: Usually, the owner can read, write and execute. The owner can be identified\
    \ by either his or her user account, or by the user account ID (UID).\n\n> Warning\
    \  \n> Setting the user ID to the root user can create security problems if other\
    \ users have execute permission on a file.\n\n+   The group: A group that the\
    \ owner belongs to. The group can be identified by its name or by the group ID\
    \ (GID).\n\n+   Other: Other users on the system. On many systems, other users\
    \ have read permission for system files, but cannot read files in other users'\
    \ home directories.\n\n> Note  \n> The root user can read, write, and execute\
    \ all files on the system.\n> \n> Occasionally, you may find some graphic tools\
    \ that do not allow the root user complete access. However, the root user can\
    \ always access all files from the command line."
  merge: -1
  img_proc: true
