- pgno: 302
  md: '# Changing Individual Passwords


    1    Type passwd USER. You are prompted for (current) UNIX password.


    You do not need to enter the user for the current account. For information about
    selecting a password,


    2    Enter your current password. You are prompted for your New UNIX password.


    3    Enter your new password. You are prompted to retype new UNIX password.


    4    Enter your new password again. A message displays: All authentication tokens
    updated successfully.


    The next time you log in to the account whose password you have changed, you must
    use the new password.


    # Choosing a Password


    A good password is one that is hard to crack. That is, it is:


    +   - A mixture of letters, numbers, symbols, and of upper and lower case.

    +   - At least six characters long.

    +   - Not based on anything associated with you, such as a birthday, a spouse’s
    name, a pet, or a favorite sports team or movie.

    +   - Not a common word found in a dictionary.

    +   - Different from your passwords on other machines.

    +   - Different to your user account.

    +   - Not written down anywhere.


    # Managing Groups


    User groups can define:


    +   - How users can access the system.

    +   - What files, directories, and services uses can work with.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '+   What hardware users can work with.


    Some of these features are defined when the group is created. Others are created
    by using permissions or configuration settings.


    Groups are listed in the `/etc/group` file. Each group has a unique ID (GID).


    # Reading the /etc/group File


    The `/etc/group` file lists all existing groups. By default, any user can view
    this file, but you must be logged in as the root user to edit it.


    Each group is defined in a line in `/etc/group`. Columns are separated by a colon.
    Information is given in the following order:


    GROUP: ENCRYPTED_PASSWORD: GROUP_ID: USERS_IN_GROUP.


    Note:


    +   The group name generally reflects what access the group has to the system.
    For example, the lp group defines who can use the printer.


    +   The encrypted password is rarely used any more. Usually, an x is added as
    a placeholder.


    +   The group ID is usually a number from 1 to 50.


    +   The list of users in the group only needs to contain those who are not in
    the group by default.


    You can edit `/etc/group` directly in a text editor. However, often, the command
    line tools are easier to use.


    # Adding a Group


    +   1. Log in as root user.


    +   2. Type: groupadd -g GID GROUP.


    You can create a group without a group ID by leaving out the option.


    # Deleting a Group


    +   1. Delete the group. Logged in as root user, type: groupdel GROUP.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '+   2 Find files that belong to the group. Type: `find -l -group GROUP`. See
    “Searching for Files and Text,” page 167.


    +   3 Change the group ownership on the files. See “Changing Groups,” page 225.
    To save effort, select multiple files.


    # ## Editing a Group


    +   1 Select the group. Logged in as root user, type: `groupmod -g GID`.


    +   2 Find files that belong to the group. Type: `find -l -group GROUP`. See “Searching
    for Files and Text,” page 167.


    +   3 Change the group ownership on the files. See “Changing Groups,” page 225.
    To save effort, select multiple files.


    # ## Managing Printing


    Linux includes a number of command line tools for administering printing. These
    commands are useful on networks, or for troubleshooting and managing printing
    on any system.


    Each printer on a Linux system has its own spool or queue in the /var/spool/lpd
    directory. This spool uses the short name of the printer, which is created when
    the printer is first configured. When a file is printed, it becomes a job in the
    spool. Each job is stored in a spool until it is printed.


    Printing tools generally start with lp (short for “line printer”). If you are
    familiar with other Linux commands, you can usually make a good guess at what
    the rest of the command should be. For example, lprm removes a print job from
    the spool


    You can use the following tools for managing printing:


    +   - lpq: Checks the status of print jobs.


    +   - lprm: Removes a print job from a spool.


    +   - lpstat: Reads the status of a spool.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# # Checking the Status of Print Jobs


    Type: lpq OPTIONS USER.


    The command''s name comes from the fact that a spool is sometimes called a “queue.”


