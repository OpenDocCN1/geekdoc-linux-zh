- pgno: 168
  md: '# # 8


    # ## Searching for Files and Text


    Progeny Debian includes many tools for locating files. This chapter describes
    the tools for:


    +   -   Searching for files and text.

    +   -   Viewing files and text.

    +   -   Comparing files.


    From the desktop, you can search with most common options and view files. However,
    you need to use the command line for:


    +   -   Advanced searching, especially for text.

    +   -   Selected viewing of parts of files.

    +   -   Comparing files.


    First, however, you need to know something about how the Linux directory structure.


    # ## Understanding Linux Files


    Linux treats everything on your hard drives and disks as a file. In practice,
    Linux uses three main types of object to store information:'
  merge: -1
  img_proc: true
- pgno: 169
  md: "+   * Files: Containers of information. Files that start a program are called\
    \ executables or binaries. Binaries are stored in a /bin directory (short for\
    \ binary), or in an /sbin directory (short for system binaries).\n\n+   * Links:\
    \ Pointers to another file. Links are useful for saving space when you need a\
    \ file in more than one place.\n\n+   * Directories: Collections of files, links\
    \ and/or other directories. A directory within a directory is called a sub-directory.\n\
    \n> **Note**  \n> Strictly speaking, links and directories are specialized files.\
    \ You can copy them or change their permissions exactly as you would with any\
    \ other file.\n\n# Understanding Linux Names\n\nThe names of Linux files, links\
    \ and directories follow certain rules:\n\n+   * No single directory or file can\
    \ be longer than 256 characters, and the complete path cannot be longer than 4096.\n\
    \n+   * They are case sensitive, distinguishing between lower and upper case letters.\
    \ Jsmith, jsmith, and JSmITH could all be files in the same directory.\n\n+  \
    \ * They can use any letter or number. However, to avoid potential problems, do\
    \ not include characters used metacharacters, or for some other purpose, such\
    \ as the hash mark (#) that indicates a comment.\n\n+   * They use a forward slash\
    \ (/) at the start to indicate a directory. Windows, by contrast, uses a backward\
    \ slash (\\).\n\n> **Note**  \n> A forward slash by itself is shorthand for the\
    \ root directory."
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Understanding File Extensions in Linux


    Extensions are file name suffixes that start with a period. Usually, they are
    two or three letters long.


    Linux can read many file extensions used by other platforms, such as .jpg for
    a graphic file, or .html for a web file. However, unlike Windows, Linux does not
    always use extensions to identify file types.


    Often, the directory where a file is placed is a better indication of what type
    of file it is. See “Using Directories to Find Files,” page 171.


    However, Linux does use a few regular extensions.


    # Extensions Used in Linux


    | Extension | File Type |

    | :--- | :--- |

    | .bz2 | A file compressed using bzip2. |

    | .c | A file written in the C programming language. |

    | .conf | A configuration file. In some places, “conf” is used as part of a file
    name, but is not an extension. |

    | .deb | A Debian package for installing software. |

    | .lock | A lock file that prevents the use of another file. |

    | .rpm | A Red Hat package file. Although you can use .rpms in Progeny Debian,
    doing so can have unexpected results and is not generally recommended. You can
    also convert packages using the alien utility. |'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# ### Extensions Used in Linux


    | Extension | File Type |

    | :--- | :--- |

    | .so | A shared object (a library or module). |

    | .src | A source code file. Written in plain text, a source file must be compiled
    to be used. |

    | .tar | A single file made of a collection of files archived using the tar command.
    |

    | .tar.gz | A single file made of a collection of files archived using the tar
    command, then compressed used the gzip command. |

    | .tgz | A single file made of a collection of files archived using the tar command,
    then compressed used the gzip command. |

    | .gz | A file compressed using the gzip command. |


    # ### Introducing the Linux Directory Structure


    Linux''s directory structure is based on UNIX''s. Like other operating systems,
    Linux arranges directories in a tree-like hierarchy, in which any directory may
    contain other-directories or files.


    However, Linux''s directory structure has several differences from those in other
    popular operating systems:


    +   ▼ Linux systems are deeper. That is, Linux tends to have more sub-directories.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Linux systems all start with the root directory. The root directory is denoted
    by a forward slash (/). All other directories, even those on other partitions,
    are sub-directories of the root directory.


    ![](img/e36b94f8548b09d00212238f073b11d9_172_0.png)


    # Note


    Do not confuse the root directory (/) with the root user, the root user''s home
    directory (/root), or the root partition (the hard drive partition which the root
    directory is on).


    You cannot always tell from a directory''s position whether it is on a separate
    partition from the root directory. For example, the /usr directory could be on
    the same partition as the root directory. It could just as easily be on another
    hard drive altogether.


    The advantage of this system is that you can position a partition almost anywhere
    on the system.


    # Using Directories to Find Files


    Linux directories are consistent in their contents. The result is that a file''s
    directory is usually a clue to what type of file it is.


    For example, if you are looking for an executable program, it is probably in the
    /bin or /usr/bin directory. "Bin" is short for "binary," which is a term used
    for an executable program.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'The following table shows the directories where certain types of files are
    likely to be located. This structure is very similar in all Linux distributions,
    although small differences exist.


    # # The Linux Directory Structure


    | Directory | What''s in It |

    | :--- | :--- |

    | / | The root directory. Contains all other files and directories. |

    | | The complete or absolute path to other directories starts from the root directory.
    |

    | /bin | Binary or executable files that can be used by both the root user and
    normal user. |

    | | Look in other /bin directories for other executable files. |

    | /boot | Files needed to start Linux, including the kernel. Most files in /boot
    generally cannot be configured using a text editor. |

    | /cdrom | The usual mount point for the CD drive. If the system has a second
    CD drive, its mount point is usually /cdrom2. |

    | /dev | Definitions for drives, partitions, and other devices. /dev also includes
    the makedev tool to create new devices. |'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# The Linux Directory Structure


    | Directory | What''s In It |

    | :--- | :--- |

    | `/etc` | Most of the system''s configuration files. Including `/etc/X11` for
    the X Window system and `/etc/opt` for third party applications. |

    | `/floppy` | The usual mount point for the first floppy drive. If the system
    has a second floppy drive, its mount point is usually `/floppy2`. |

    | `/home` | Home directories for all regular users. The root user''s home directory
    is `/root`. |

    |  | Subdirectories of `/home` are named for the user name of each account. Personal
    configuration files that start with a `.` (a period) are in each home directory.
    |

    | `/initrd` | Files for Linux''s RAM disk. |

    | `/lib` | Programming libraries needed to start the system and run basic commands.
    |

    |  | Look for other lib directories scattered throughout the system. |

    | `/lost+found` | Files recovered when a check is run on a damaged file system.
    |'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# The Linux Directory Structure


    **Directory What''s In It**


    **/mnt** A folder for other mount points, usually other partitions not used directly
    by Linux, including those for other operating systems.


    **/proc** Process and system information. Be extremely careful of changes to /proc
    while you are logged in as the root user, because they can easily bring the system
    down.


    **/root** The home directory for the root user.


    Home directories for other users are generally sub-directories of /home.


    **/sbin** System binary files. Some of these are usable-only by the root user.


    Other executables are in /bin.


    **/usr** Programs and system files that are shared by all users. A common location
    for free software or for third-party software. Important sub-directories include
    /usr/local and /usr/share.


    **/var** Data files whose content changes frequently, such as caches, spools,
    log files and user mailbox files.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# The Linux Directory Structure


    | Directory | What''s In It |

    | /var/lock | Lock files that prevent another user from opening or saving particular
    files. |

    | /var/log | Log files for different programs. These logs are invaluable for solving
    problems. |


    # Understanding Absolute and Relative File Paths


    A file path is a list of the directories above the file, ending with the file
    name.


    Linux uses two types of paths: absolute and relative paths:


    +   - An absolute path always starts with the root directory.

    +       For example, the absolute path to a file in a sub-directory in a user''s
    home directory might be `/home/khcong/10100/january.txt`.

    +       This path can take a long time to type, but is completely clear.

    +   - A relative path starts in your present working directory.

    +       For example, if you were in the `/home/khcong` directory, the relative
    path to a file in a sub-directory might be `10100/january.txt`.

    +       You can find your present working directory by using the `pwd` ("present
    working directory") command.


    In addition, `/` indicates the present working directory when you are using the
    command line.


    # Searching from the Desktop


    You can search for files or text from the desktop using:'
