  md: '# ## Viewing Intensive Processes


    The top command shows a constantly updated summary of the processes that are using
    the most system resources. The figures given are relative to each other, rather
    than representing the actual amount of RAM used.


    *Type:* `top OPTIONS`.


    Once the display is running, you can use keyboard commands to:


    +   -   ▽ Change the details of the display, including the time between updates
    and the statistics shown

    +   -   ▽ Change the process or number of processes shown.

    +   -   ▽ Sort the display according to different criteria.

    +   -   ▽ Set a priority, as with the `nice` command. See “Setting the Priority
    for a Process From the Command Line,” page 319.

    +   -   ▽ Stop a process as with the `kill` command. See “Stopping a Process From
    the Desktop,” page 315


    # ## The top Command (Views Intensive Processes)


    | Option | Action |

    | :--- | :--- |

    | -d SECONDS | To set the interval between updatings of the display. |

    | -p PROCESS_ID | To display only processes with a particular ID. |'
