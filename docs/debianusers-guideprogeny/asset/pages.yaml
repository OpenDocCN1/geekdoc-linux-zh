- pgno: 141
  md: '+   Select a workspace.

    +   Select the next or previous workspace.

    +   Customize how the workspace functions.


    # Finding Your Way Around the Desktop


    The GNOME desktop works in much the same way as other desktops:


    +   You start programs by left-clicking on an icon or a menu item,

    +   You set properties by right-clicking on a desktop element.

    +   Windows are minimized or maximized using either their menus or the icons in
    the upper right corner.

    +   Windows become active (or come into focus, as GNOME puts it) by clicking with
    the mouse on any part of them.

    +   Minimized (also called "iconified") windows display in the task list.

    +   The Trash can stores deleted files in case you want to restore them.


    ![](img/e36b94f8548b09d00212238f073b11d9_141_0.png)


    However, if you are new to Linux, some of its functions may be unfamiliar to you.
    Instead of repeating what you already know, this section concentrates on these
    unfamiliar functions.


    # Using A Three Button Mouse


    Like other Linux desktops, GNOME is designed for a three button mouse. If your
    mouse only has two buttons, then you can configure your system to emulate a three-button
    mouse. When emulation is enabled, pressing both buttons at the same time is the
    same as using the middle mouse button.


    In most circumstances:


    +   The left mouse button selects an icon or menu item to start.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '▼ The right mouse button displays a pop-up menu. Often, this menu is used for
    setting the properties of a desktop element, such as an icon.


    ▼ The middle button is used for other functions, if they exist.


    To see other functions for the mouse buttons, roll the mouse over a part of the
    desktop to see a pop-up list.


    | Button1-Move | move-window-interactively |

    | Button1-Off | raise-window |

    | Button1-Click2 | toggle-window-shaded |

    | Button2-Off | lower-window |

    | Button3-Click1 | popup-window-menu |


    # # Using the Desktop Pop-Up Menus


    The panel, the menus, icons, and the work space all have pop-up menus. However,
    the work space has two pop-up menus:


    ▼ Clicking with the right mouse button on a blank space on the desktop opens the
    desktop pop-up menu.


    From this menu, you can create icons, rescan the desktop to update it, and set
    other desktop properties.


    ![](img/e36b94f8548b09d00212238f073b11d9_142_0.png)


    ▼ Clicking with the middle mouse button on a blank space opens a general pop-up
    menu.'
  merge: -1
