    # ## Shutting Down Progeny Debian


    Linux is generally running many processes at once. Many of these run in the background,
    where they are easy to forget. For this reason, shutting down the system properly
    is essential.


    A proper shutdown is often called a graceful shutdown or exit. During a graceful
    shutdown:


    +   - All processes and programs are closed.


    +   - All information in RAM memory or on the swap partition is written to the
    hard drive.


    +   - All log files are updated.


    +   - All partitions are dismounted.


    ![](img/e36b94f8548b09d00212238f073b11d9_106_1.png)


    # **Warning**


    If you do not shut down properly, you may damage the operating system or lose
    files. At best, the next time you start your computer, you have a long delay while
    the root partition is checked.


    You can shut down from:'
