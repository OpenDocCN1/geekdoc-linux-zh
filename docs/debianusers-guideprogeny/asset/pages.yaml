- pgno: 50
  md: '# ## Installing Progeny Debian Without a Graphical Display


    The Progeny Debian installer is designed primarily for users who want a graphical
    display. However, you may decide not to use a graphical display (the X Window
    System) if you are an experienced user, or are installing a server.


    If you do not want a graphical display, note the following steps:


    +   - Start the minimal install with the command `linux secondstage=text`. The
    minimal installation will use a generic VGA display, but the other stages will
    be text based.

    +   - At the start of the configuration stage, do not select X configuration.

    +   - During the software installation stage, do one of the following:

    +       - De-select the pre-selected GNOME and X Window package set.

    +       - Leave the default package sets, then remove the X Window package set
    once Progeny Debian starts.


    # ## Navigating the Install Program


    The install program detects your mouse so that you can use it during the install.


    The install program uses a simple set of buttons for navigation:


    +   - Back: Returns you to the previous screen.

    +   - Next: Moves to the next screen.

    +   - Cancel: Exits the install program.


    In some cases, a button may not be available until a task is completed.


    # ### Navigating Without a Mouse


    If your mouse does not work in the install program, you can use the keyboard to
    navigate the menu choices. Later, you can configure your mouse in the Pointer
    screen or after the install.


    To navigate the install program without a mouse, use:'
  merge: -1
  img_proc: true
- pgno: 51
  md: '▼ The left arrow key or Shift-Tab key to move between buttons and selections
    in the current screen.


    ▼ The space bar to select an item in the current screen.


    ▼ The Enter key to activate choices.


    # Opening a Virtual Terminal for Troubleshooting


    If you have trouble installing Progeny Debian, open a virtual terminal:


    +   - During the minimal install stage, press Ctrl-Alt-F2. Press Alt-F7 to return
    to the install.

    +   - During the configuration stage, middle-click anywhere on the screen except
    for the window.

    +   - During software installation, the output displays for you.


    # Installing the Minimal System


    Installing the minimal system is the first stage in the installation of Progeny
    Debian.


    Installing the minimal system consists of three steps:


    +   - Selecting the target installation: Determining which hard drive and partitions
    are used.

    +   - Partitioning your hard drive: Creating and formatting the partitions for
    the install.

    +   - Configuring the system start-up: Choosing whether to use the GRUB boot manager,
    an existing boot manager (such as LILO), or no boot manager.


    Once you have made your choices, the necessary partitions are prepared and the
    minimal system is installed.


