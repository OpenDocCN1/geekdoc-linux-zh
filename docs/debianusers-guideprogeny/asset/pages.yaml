    ![](img/e36b94f8548b09d00212238f073b11d9_143_0.png)


    # ## Using Keyboard Shortcuts


    To save time, you can add keyboard shortcuts for basic desktop tasks by selecting
    Sawfish Window Manager, then Shortcuts from the Control Center. Only a few shortcuts
    are defined by default. However, you can add a long list of keyboard shortcuts,
    or edit existing ones. See “Making the Desktop Your Own,” page 149.


    # ## Manipulating Windows


    ![](img/e36b94f8548b09d00212238f073b11d9_143_1.png)


    An open window in Progeny Debian has:


    +   - An “X” icon in the upper right corner to close the window

    +   - An up arrow icon in the upper left corner to maximize the window.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   ▼  A down arrow icon in the upper left corner to minimize the windows.


    +   ▼  A menu that you can open by right clicking on the title bar. From the menu,
    you can minimize, maximize, or close the window, and manipulate it in other ways
    as well.


    In addition, a window appears in the task list and the pager on the panel if it
    is on the current work space.


    However, the window menu and the pop-up menu in the task list also let you manipulate
    an open window in ways that may be unfamiliar to you.


    # # Ways to Manipulate Windows from the Menu


    | To... | Select from the window menu... |

    | :--- | :--- |

    | Allow a window to be active when cycling through windows | Toggle > Focusable<br><br>If
    the window is already focusable, then selecting this menu item again sets it to
    Ignored. |

    | Change a window''s position in a stack of windows | Stacking<br><br>You can
    position the window behind or above other open windows, depending on your choice
    from the sub-menu |

    | Close a window | Close<br><br>Any process that was displayed in the window still
    runs. You can also close a window from the pop-up menu of the task list. |'
