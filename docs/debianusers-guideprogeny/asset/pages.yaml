    # Compressing and decompressing With the bzip2 Command


    The bzip2 command is one of two tools for compressing and decompressing files.
    The other is gzip. The gzip command is more common, but bzip2''s compression is
    10 to 20 percent greater, depending on the file.


    Compressed files made with bzip2 have a .bz2 extension.


    Type: bzip2 OPTIONS FILES.


    Separate each name with a space.


    The bzip2 command has three related utilities:'
  merge: -1
  img_proc: true
- pgno: 344
  md: '+   ▼ bzipcat: Displays the contents of a file in a bzip compressed file. Uses
    the same options as the cat command.


    +   ▼ bziprecover: Helps to recover damaged compressed files.


    +   ▼ bunzip2: decompresses files. However, many users prefer bzip2 -d for decompressing
    files.


    All these utilities have the same command format as bzip2.


    # ## The bzip2 Command (Compress)


