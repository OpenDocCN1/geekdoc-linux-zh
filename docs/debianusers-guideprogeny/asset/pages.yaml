- pgno: 219
  md: "+   ▼ To merge separate files into a new file, type: cat FILES > MERGED_FILE.\n\
    \n+   ▼ To add files to an existing file, type: cat SOURCES >> TARGET.\n+   \n\
    +   Separate file names by a space.\n\nYou could also use less or more to merge\
    \ files. See “Viewing Files From the Command Line,” page 193.\n\n# Merging Files\
    \ Using the diff3 Command\n\nThe diff3 command can be used for comparing files.\
    \ However, you can also use the command to merge files. This function is especially\
    \ useful when two versions of a file have been worked on separately.\n\nType:\
    \ diff3 TARGET ORIGINAL VERSION.\n\nNote:\n\n+   ▼ The original file is the one\
    \ that the other two are based on.\n\n+   ▼ The version file is the first modified\
    \ version of the original file.\n\n+   ▼ The target file is the second modified\
    \ version of the original file.\n\n+   ▼ The contents of each file displays on\
    \ the screen.\n\n+   ▼ The order of the files is important. The command compares\
    \ the original and the version file, then the target and the version file.\n\n\
    +   ▼ A change in the target file always over rides a change in the version file.\n\
    \n# Working With Symbolic Links\n\nA link is a small file that points to another\
    \ file. When a command is used by a link, it is passed on directly to the original\
    \ file.\n\nA link is useful when you need a file in two places and/or when you\
    \ want to save disk space. However, if the original file is moved or deleted,\
    \ the symbolic link no longer works.\n\nLinks are also used to create launchers\
    \ on the desktop. Because the launchers are links, deleting them does not delete\
    \ the file to which they point."
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Linux uses two types of links:


    +   Absolute links (also called hard links) get their name because of how they
    are stored on the filesystem.


    For the average user, hard links are more limited than symbolic links. An absolute
    link must be on the same filesystem as the original file, and is not recognized
    by ls and other commands.


    +   Symbolic links (also called soft links) are copied, moved, or deleted like
    other files.


    Deleting a link does not affect the original file. However, the creation of symbolic
    links and administering the connections between them requires a little more care
    than with other files.


    # ## Viewing Symbolic Links From the Desktop


    +   Open the GNOME Midnight Commander. Do one of the following:


    +   From the workspace, select the Home directory launcher.


    +   From the menu, select Programs > File Manager.


    +   Do one of the following:


    +   Select the Custom icon from the tool bar.


    +   Select Layout > Custom View from the menu.


    In all cases, files that are links have an l as the first character in the Permissions
    column.


    # ## Viewing Symbolic Links From the Command Line


    The ls command displays the current directory''s contents. To display the symbolic
    links in the current directory, open a command line and type: ls -l.


    The attributes of each file are displayed on a separate line. If a file is a link,
    then the first character is an l.


    In addition, any symbolic link is displayed with the original file beside it.
    For example, if the original file was ToDo and the link was Monday, then the entry
    for the link would be: Monday -> ToDo.'
  merge: -1
  img_proc: true
- pgno: 221
