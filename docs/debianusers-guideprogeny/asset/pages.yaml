- pgno: 348
  md: '# 13

    Configuring the System


    Progeny Debian automatically configures your system during installation. However,
    you may need to use other configuration methods if:


    +   ▼ Your system works, but some settings can be improved.

    +   ▼ Your system works, but you want to lower the settings to save system resources
    or improve speed.

    +   ▼ You want to make adjustments based on personal preferences.

    +   ▼ A device is not detected.


    This chapter explains how to set up basic hardware, as well as many parts of your
    everyday working environment, including:


    +   ▼ Hardware.

    +   ▼ Partitions.

    +   ▼ Networks and internet connections

    +   ▼ Graphical Displays.

    +   ▼ Other Settings.'
  merge: -1
  img_proc: true
- pgno: 349
  md: "# Understanding Configuration Methods\n\nLinux includes dozens of configuration\
    \ tools, from command line utilities that ask you questions to graphical interfaces.\
    \ However, the most common methods for configuration in Progeny Debian are:\n\n\
    +   - `dpkg-reconfigure` TOOLS: Configures using simple question and answer dialogs.\
    \ Two useful tools are `ethernet` and `pppconf`.\n\n+   - GNOME Control Center\
    \ > System: The same tools that you used during the install are available there.\n\
    \n+   - Manually editing the necessary configuration files: This method requires\
    \ exact knowledge, but allows complex configuration and is always available so\
    \ long as you have a text editor.\n\n> **Note**\n> \n> Hardware connected with\
    \ the graphical display including the monitor, video card, and pointer can be\
    \ configured by editing the profiles in the /etc/X11/Xf86Config-4 file. In each\
    \ section of the file, the first profile is used by default.\n\n+   - Recompile\
    \ the kernel: This method requires exact knowledge, and can be intimidating to\
    \ new users. However, it may be necessary, especially if hardware is undetected.\n\
    \n# Understanding the System Settings\n\nProgeny Debian includes the tools used\
    \ to configure during the install as part of the GNOME Control Center.\n\n+  \
    \ 1. Do one of the following:\n\n+   - From the panel, select the Control Center\
    \ icon from the panel.\n+   - From the menu, select Settings > System.\n+   -\
    \ From the menu, select Programs > Settings > System."
  merge: -1
  img_proc: true
- pgno: 350
  md: '+   2 Select the configuration tool to use. Choice are:

    +       - Date and Time.

    +       - Electronic Mail.

    +       - Network.

    +       - Printer.

    +       - X Configuration (Display).


    # ## Understanding Manual Configuration


    Most configuration files are found in the `/etc/` directory. Configuration file
    can be changed in a text editor.


    Dozens of text editors are available, but you should learn either a variant of
    `vi` or `emacs`. At least one of these editors should be available on any Linux
    system. By default, Progeny Debian uses `vim` ("vi improved") editor.


    Manual configuration is especially useful if you are using single-user mode, or
    do not have the X Window System running.


    For more information on your preferred text editor, see its on-line help.


    +   1 Prepare an emergency disk if you do not already have one.

    +   2 Log in as root.

    +   3 Make an extra copy of the file you are editing.

    +   4 Edit and save the file in a text editor.


    > **Note**

    > As an extra precaution, write down the changes you have made.


    +   5 In some cases, you may have to restart the X Window System or your computer
    for the changes to take effect.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Recovering from Errors While Manually Reconfiguring


    If changing settings may make your system unusable, you can recover by fol-

    lowing these steps:


    +   1. Start your machine with a boot disk or select single-user mode from the

    +      boot manager.


    +   2. Type: cp -f BACKUP FILE.


    The backup the configuration file overwrites the damaged file.


    +   3. Restart your system. The damage to your system is now repaired.


    ![](img/e36b94f8548b09d00212238f073b11d9_351_0.png)


    # Note


    If you wrote down the changes you made, you can

    also edit the configuration file in a text editor.


    # Using the vim Text Editor


    The *vim* editor is an enhanced version of *vi*, one of the standard text editors.

    Like *vi*, *vim* has two modes:


    +   - Command mode: For entering keyboard commands about the program or

    +     the file being edited.


    +   - Insert mode: For editing a file.


    Type *vim* to start. To open *vim* with a file, type *vim FILE*.


    ![](img/e36b94f8548b09d00212238f073b11d9_351_1.png)


    # Note


    Using these two modes may be confusing if you are

    unfamiliar with them, so practice using *vim* enough

    so that you are comfortable enough to use it in an

    emergency.'
  merge: -1
  img_proc: true
