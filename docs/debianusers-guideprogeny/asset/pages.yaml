- pgno: 273
  md: '# Installing and Removing Packages With the apt-pkgset Command


    Progeny Debian simplifies package selection by grouping related packages into
    sets. If a program requires more than one package, you can install all the packages
    at the same time using Progeny''s apt-pkgset utility.


    As the name implies, apt-pkgset is the command line version of GNOME apt-pkg-
    set, Progeny’s desktop tool.


    Both are based on the apt utility. Both include much of the functionality of apt,
    and works in much the same way. For example, like apt, both depend on a sources
    list.


    However, experienced users may find apt-pkgset limiting and prefer to use apt.
    See “Installing and Removing Packages With the apt-get Command,” page 273.


    Type: apt-pkgset COMMAND PACKAGESSET.


    No hyphen is placed in front of a command.'
  merge: -1
  img_proc: true
