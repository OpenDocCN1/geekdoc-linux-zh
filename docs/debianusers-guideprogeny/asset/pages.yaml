    # ## Configuring a Temporary Network Connection


    You can use Linux commands to set up a temporary connection without editing files.
    This type of on-the-fly configuration is especially useful for testing configurations.


    To setup a temporary connection:


    +   1. Logged in as root user, type: `ifconfig DEVICE IPADDRESS NETMASK`.

    +   2. Add the route. Type: `route add default gw ROUTE`.

    +   3. If necessary, add your nameserver to /etc/resolv.conf.


    If you log out, re-do the first two steps to re-create the temporary connection.


    # ## Configuring a Dialup Internet Connection


    A dialup connection uses a modem and an unmodified telephone line. A dialup connection
    is also known as a Point-to-Point Protocol (ppp) connection.


    ![](img/e36b94f8548b09d00212238f073b11d9_388_0.png)


    ### Warning

    For greater security, use a regular user account for your connection. Never use
    the internet when logged in as root user.'
