    \ can configure a network during the install process or after. A dialup connection\
    \ is not part of the install program, but you can set up one after the install\
    \ process.\n\nIf you need help with the choices on this screen, consult your system\
    \ administrator or Internet service provider.\n\n+   1  From the GNOME Control\
    \ Center, select System > Electronic Mail.\n\n> **Note**\n> \n> If you are using\
    \ the KDE desktop, type `/usr/bin/mail-configlet-applet` at the command line.\n\
    \n+   2  Select the General mail setup. Choices are:\n\n+   ▼ Internet Site: The\
