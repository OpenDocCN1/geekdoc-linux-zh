  md: '+   ▾ Command pasting.

    +   ▾ Aliases.

    +   ▾ Abbreviating file paths.

    +   ▾ Redirecting inputs and outputs.

    +   ▾ Environment variables.


    # ## Using Tab Completion


    By pressing the Tab key, you can have the shell complete the command you are typing.
    You can also use Tab completion as a guide to commands if you are unsure of which
    command you want.


    If only one command completes what you have typed, then the full command is entered
    automatically. However, you still need to add any options, arguments and files,
    and press the Enter key.


    If more than one command completes what you typed, then a list of possible completions
    displays. You can use the list as a guide to commands. Or you can type another
    letter, press the Tab key, and display another list of completions.


    For example, if you type chg then press the Tab key, the command chgrp is entered
    at the prompt. No other command completes chg.


    On the other hand, if you type cha, you get the following list:


    chage chat chattr


    This time, these three command complete what you have typed.


    # ## Using Command History


    The .bash_history file in your home directory lists all the commands that you
    have entered from the command line.


    You can use this file to re-enter commands that you have already used. This ability
    is useful if you are doing repetitive work, or if you have made a mistake and
    want to correct it without re-typing.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'To move through the command history, use the up arrow key to repeat the previous
    command in the history. Use the down arrow key to repeat the next command.


    If you are at the last command, then using the arrow key deletes what you have
    entered at the command prompt.


    If you change user accounts, you cannot use the command history of the original
    account.


    # ### Using Text Pasting


    You can use the mouse to copy and paste text that still displays on the screen.


    To paste a command:


    +   1. Press the left mouse button, and drag the cursor over the text that you
    want to paste. The text is highlighted.


    +   2. Release the mouse button.


    +   3. Place the cursor at the spot where you want to paste the text. Then click
    the middle mouse button. The text is pasted. If you selected an entire line with
    a command, then the command runs automatically.


    # ### Using Command Aliases


    An alias is a shorter name for a command. Aliases are especially useful if you
    want a shortcut for a command with a set of commonly used options.


    You can:


    +   *   Create an alias.


    +   *   Delete an alias.


    +   *   View existing aliases.


    # #### Creating an Alias


    Type `alias ALIAS = COMMAND OPTION`.


    If the original command includes options and arguments, enter it as a string in
    single quotation marks'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'For example, if you regularly printed three copies of everything to a printer
    called progeny, you could create an alias by typing alias p3=''lpr -3 -P progeny''
    .

    Once the alias is created, you can use the alias instead of the original command.
    For example, to send the file contactlist.txt to the printer, you would type s3
    contact.txt.


    # ### Deleting an Alias

    Type unalias ALIAS.


    # ### Viewing Aliases

    Type alias. A list of aliases displays.


    # ### Abbreviating File Path Names

    One of the biggest drawbacks to the command line is that typing file names can
    be cumbersome. You can reduce the amount of typing by using:


    * Shortcut symbols.


    * Relative paths.


    # ### Using Special Symbols

    You can use the following special symbols to reduce the amount of typing you need
    to do in file names.


    # ## Special Symbols for the Command Line


    | Symbol | What it stands for |

    |---|---|

    | . | The directory that you are now in (the working directory). |

    | .. | The directory above the one you are in now (the parent directory). |'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Special Symbols for the Command Line


    | Symbol | What it stands for |

    | :----- | :----------------- |

    | \~ | Your home directory. |

    | \~USER | The home directory for the user account listed. |

    | / | The root directory |


    # Using Relative Path Names


    A file’s complete path name starts with the root directory. For example, the path
    for the file ToDo in the January folder of the home directory of *jgill* would
    be /home/jgill/January/ToDo.


    A complete path is generally known as the absolute path.


    Instead of typing the absolute path, you can save time by typing the relative
    path. A relative path:


    +   ✔ Starts with the current directory, instead of the root directory.

    +   ✔ Must be to a sub-directory of the current directory.

    +   ✔ Does not start with a forward slash.


    For example, if you were in the /jgill/January directory, the relative path to
    *ToDo* would be *January/ToDo*. In the home directory, the relative path would
    be /jgill/January/ToDo.


    # Redirecting Input and Output for Commands


    In most cases, you enter a command from the keyboard, and the results and any
    error messages display on the screen.


    In other words, the keyboard is the standard input, and the screen is the standard
    output and standard error.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'By changing these standards, you can often save time and effort.


    Uses for redirection include:


    +   ■ Writing the results or errors to a file to keep a permanent record.

    +   ■ Writing the results or errors to the printer, to have a hardcopy record.

    +   ■ Using a file for input, instead of typing the input.

    +   ■ Combining two commands so that they work together.


    As you learn the command line, you may find other uses for redirection.


    To redirect a command’s input, output, or error, you use a small set of char-acters
    known as redirection operators.


    # ## Redirection Operators


    | Characters | What it does |

    | :--- | :--- |

    | `>` | Redirects the output to a file or a piece of hardware, such as the printer.
    If the file already exists, the older file is automatically overwritten. |

    | `>>` | Redirects the output, but if the output is a file that already exists,
    adds the output to the end of the existing file. Usually, this character is safer
    to use than `>`, since it does not overwrite existing files. |

    | `2>` | Redirects the error output to a file or a piece of hardware, such as
    the printer. |

    | `<` | Redirects the input of the command from a file or device. |'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'The format for using redirection is:


    ```

    COMMAND OPERATOR TARGET

    ```


    For example, if you wanted to save a copy of a search for the keyword “expenses”
    in a file, you could type grep ''expenses'' January2001> expenses.txt.


    In this example:


    +   - grep is the search command.


    +   - expenses is the argument string you are searching for.


    +   - January2001 is the file to search.


    +   - expenses.txt is the file that the results are printed to. If the file does
    not exist, it is created.


    # Using Environment Variables


    Environment variables define different aspects of the way that you interact with
    the system. Some, like $HOME (the variable for your home directory) are set for
    you. However, you can also create your own variables to use in scripts or for
    saving time when you use the command line.


    Variables that you create are stored in the .bash_profile file in your home directory.


    # Adding a Variable


    Type: export VARIABLE=VALUE.


    For example, if you wanted to create the variable $INCOME to refer to the directory
    /home/jsmith/Expenses, you would type export $INCOME /home/jsmith/Expenses.


    # Using a Variable


    To use a variable, type its name with a dollar sign in front of it where you would
    ordinarily type the value. For example, if you create the variable $INCOME to
    refer to the directory /home/jsmith/Expenses, you can view the file /Expenses/january,
    by typing less $INCOME/january.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# ## Finding Help for Commands


    This manual lists only a few basic commands. A thorough guide to commands would
    require well over 1000 pages.


    To find more information about Linux commands, you can use either the *man* or
    *texinfo* help systems. For quick help, you can use *whatis*.


    # ### Using man Pages


    Man (“manual”) pages are the traditional help files of UNIX and Linux. Man pages
    exist for both commands and configuration files.


    Man pages are summaries rather than how-tos. In addition, many are no longer being
    updated. For this reason, man pages are often hard to use.


    To open a man page, type *man COMMAND* or *man FILE*.


    # ### Searching man Pages


    You can search man pages for all entries on a particular topic by typing: *apropos
    KEYWORD*. The one drawback to this command is that common topics can list an overwhelming
    number of entries.


    # ### Using Info Documents


    Info documents are GNU help. Usually, info files are more current and more thorough
    than man pages. Most people find them easier to use.


    To open an info document, type *COMMAND –help*.


    # ### Using whatis


    The whatis command gives a short summary of the topic entered.


    *Type:* *whatis KEYWORD*.'
  merge: -1
  img_proc: true
