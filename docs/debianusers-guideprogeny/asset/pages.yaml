- pgno: 345
  md: '# ## Checking or Repairing a File System


    The native Linux filesystem (*ext2*) does not need to be defragmented. However,
    occasionally, you may need to check a partition''s file allocation and make repairs.


    Type: `fsck OPTIONS FILESYSTEM` or `fsck OPTIONS MOUNTPOINT`.


    Note that:


    +   - By default, repairs are done without prompting.

    +   - Two ways of specifying a filesystem exist. You do not need to specify a
    filesystem if you use the -t or -A options.

    +   - This check is also run when the system starts if it was not shut down gracefully
    or after a predefined number of reboots.


    > Linux partitions do not need defragmenting. `FAT16` and `FAT32` filesystems
    can be defragmented under another operating system.


    # ## The `fsck` Command (Checks Filesystems)


    | Option | Action | Comment |

    |---|---|---|

    | -A | Checks all filesystems listed in `/etc/fstab`. | |

    | -r | Prompts before each repairs is done. | |'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# The fsck Command (Checks Filesystems)


    | Option | Action | Comment |

    | :--- | :--- | :--- |

    | -R | Checks all filesystems listed in /etc/fstab except the root partition.
    | Use with -A. |

    | -t TYPE | To only check filesystems of a certain type | Common types are: \n-
    ▼ ext2: The native Linux format. \n- ▼ swap: Linux swap file. Use only for the
    swap file. \n- ▼ vfat: The format for Windows 98, ME, and the second release of
    Windows 95. \n- ▼ iso9660: CD drive |'
