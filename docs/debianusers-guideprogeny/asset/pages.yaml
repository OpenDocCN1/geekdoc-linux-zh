  md: "# ## 9\n# Working with Directories, Files, and Links\n\nIn general, all information\
    \ on your Linux system is stored in files. Although you often use separate commands\
    \ to manipulate directories and links, both are basically specialized types of\
    \ files.\n\nThis chapter covers the basic tasks, such as creating, selecting,\
    \ copying and deleting directories and files. It also explains how to view and\
    \ create links, and how to change file attributes.\n\n> **Note**\n> \n> You cannot\
    \ manipulate files unless you have permission to do so. This limitation is one\
    \ of the major differences between Linux and many popular operating systems. See\
    \ “Changing Permissions,” page 227.\n\nOn the desktop, you can use the GNOME Midnight\
    \ Commander for the most common file functions.\n\nHowever, for a complete set\
    \ of options, you must use the command line. In fact, a few tasks, such as merging\
    \ or splitting files can only be done from the command line."
