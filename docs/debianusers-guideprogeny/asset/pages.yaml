    # ## Configuring Partitions


    Linux users often spend more time configuring partitions than the users of other
    operating systems. Many users prefer to mount important directories on different
    partitions, either to control the space used by certain files, or to make recovery
    from disaster easier.


    Even more have multiple operating systems on the same machine, and not only have
    to divide their hard drives into more partitions, but also need to use a boot
    loader to select a operating system when their computers start.


    This section covers:


    +   * Partitioning a hard drive.


    +   * Mounting and unmounting partitions.


    +   * Creating swap partitions.


    +   * Configuring the boot loader.


    # ### Partitioning a Hard Drive


    The `fdisk` and `cfdisk` commands are standard Linux utilities. However, these
    commands are limited by the fact that they cannot manipulate a partition while
    preserving data. Instead, Progeny recommends that you use the parted ("partition
    editor") utility for manipulating partitions whenever possible.


    Although a command line utility, `parted` has much of the functionality of commercial
    on-the-fly partitioning tools. The utility allows you to create, delete, resize,
    and move partitions. You can use it with a Linux native (ext2), FAT32 or FAT16
    partition.


    361


    Configuring the System'
  merge: -1
  img_proc: true
- pgno: 363
  md: '1  Back up all important information.


    While parted is generally safe to use, interruptions to your computer’s problems
    or other accidents could destroy information.


    2  At a command line, type: **parted -OPTIONS DEVICE COMMAND.**


    Note that:


    +   - The -i ( “interactive” ) option prompts you for a decision if any are necessary.
    You can omit this option if you want.

    +   - For information on how Linux names devices, see “Reading Linux Device Names,”
    page 40.


    # The parted Command (Partitioning): Commands


