- pgno: 32
  md: '# ## Preparing to Install Progeny Debian


    Installing Linux is much easier than it was a few years ago. However, if you have
    never installed an operating system, installing Linux can still be nerve-wracking.
    You may find that your hardware either does not support Linux or needs to be configured
    manually to work well.


    To avoid trouble during the install, gather the information you need during the
    install before you start. This chapter explains how to:


    +   1.  Meet hardware requirements.

    +   2.  Name partitions according to Linux’s and Windows’ conventions.

    +   3.  Save data from accidental loss during the install.


    # ### Understanding Your System’s Hardware


    In most cases, you can let Progeny Debian detect your hardware and accept the
    settings suggested during the install. However, these suggestions may not always
    work. To minimize problems, before you install, you should:


    +   1.  Gather information about your hardware before you start to install. At
    the very least, have the information handy if you need it.

    +   2.  Check hardware compatibility.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '+   Check that your computer meets the minimum requirements for the type of
    install that you want to do.


    # Finding Sources of Hardware Information


    Hardware information can be gathered from:


    +   - The manuals that come with each piece of hardware.


    +   - The BIOS setup screens of your computer. You can view these screens when
    you start your computer by pressing a combination of keys. Check your manual for
    the combination. Often, it is the Delete key.


    +   - The cases and boxes for each piece of hardware.


    +   - The System window in the Windows Control Panel.


    +   - System commands or tools in another operating system, including file manager
    displays. This source is especially useful for information about RAM and hard
    drive memory.


    +   - Your system administrator or Internet Service Provider. These sources can
    tell you the settings you need to set up your networking and e-mail.


    # Gathering Hardware Information


    The exact information you need depends on how much control you want over the install:


    +   - If you want, you can let the installer automatically partition your hard
    drive and accept the settings that the installer suggests.


    However, these settings may not be the best ones for your hardware.


    > > **Warning**

    > > Do not do an automatic installing without backing up important information.
    Otherwise, you may lose the information.


    +   - If you want a custom install, the following table shows the information
    needed.'
  merge: -1
  img_proc: true
- pgno: 34
