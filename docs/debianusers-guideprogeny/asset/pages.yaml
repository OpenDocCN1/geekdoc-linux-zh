- pgno: 134
  md: '# # 6 Getting to Know the Desktop


    Most operating systems offer two ways to interact with your computer: a desktop
    and a command line.


    In popular operating systems, the command line is usually de-emphasized. *Progeny
    suggests that you take a mixed approach to Linux.*


    For routine work, the desktop is convenient and easy to learn. However, consider
    using the command line for complex work. The Linux command line takes longer to
    learn than a graphical interface, but in many circumstances it is easier and quicker
    to use.


    The default graphical interface for Progeny Debian is GNOME (GNU Network Object
    Model Environment). This chapter describes the features of GNOME. However, you
    may also install KDE (The K Desktop Environment) from the Extras CD. The two desktops
    have similar features and functionality.


    Most modern computer users (at least those installing Linux) know the basics of
    using a desktop. For this reason, this chapter is written more to point out features
    than to explain them. Its main focuses are:


    +   - Where to find features that you already know.

    +   - What features new Linux users may not know.


    For more detail, see the GNOME on-line help.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Understanding Graphical Interfaces


    Unlike other popular operating systems, Linux lets you customize all the parts
    of your graphical interface.


    Linux uses the X Window System (also called "X") to display graphics. The X Window
    System uses three parts to provide a graphical interface:


    +   The X server: The program that provides basic graphical support. The default
    X server for most versions of Linux is XFree86.


    +   The window manager: A program that controls the placement and movement of
    windows on the interface. A few window managers have so many features that they
    are almost desktops in their own right. Progeny Debian uses Sawfish, which is
    currently the most popular GNOME window manager.


    +   The desktop: A program that includes a set of features that works with the
    windows manager to provide a complete graphical environment.


    You can choose each of these parts separately. Only a few Linux users change the
    X server, but many change the window manager and desktop regularly. Some users
    prefer a window manager, but no desktop.


    In addition, you can also change the look of a window manager or desktop by changing
    themes, the default colors and designs. Entire web sites are devoted to themes,
    notably www.themes.org


    # Getting to Know the Parts of the Default Desktop


    The GNOME desktop is similar to desktops on other operating systems. However,
    take the time to find where the parts of the desktop are. Some features may not
    be in the position you expect, while others can be reached in more than one way.


    You can add many features to the GNOME desktop. However, the default desktop consists
    of:


    +   The Menus.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '+   ▼ The Panel.


    +   ▼ The File Manager.


    +   ▼ Workspaces.


    # The Menus


    The menus: You can select a program to run by opening one of two menus:


    +   ▼ The GNOME main menu at the top left of the screen.


    ![](img/e36b94f8548b09d00212238f073b11d9_136_0.png)


    +   ▼ The Programs item in the pop-up menu for the work space.


    # Note


    > To have a menu or sub-menu stay open, double-click on the top part above the
    dotted line. The menu becomes a regular window. This feature is sometimes called
    a “tear-off menu.”'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# The Panel


    The panel runs across the top of the desktop. It contains the menu, icons, and
    commonly used tools. The panel contains:


    +   The GNOME menu on the left.


    +   The GNOME Help icon for on-line help.


    +   The browser icon for your internet connection.


    +   The GNOME Control Center for configuring the desktop. See “Making the Desktop
    Your Own,” page 149.


    +   The Add/Remove Software icon.


    +   The terminal icon for opening a command line.


    +   The GNOME Desktop Guide, or pager, beside the task list. The pager opens a
    list of currently running processes and shows where windows are open on the work
    space.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Select the pager to open or close it.


    ![](img/e36b94f8548b09d00212238f073b11d9_138_0.png)


    +   The status dock for showing the windows on each workspace.


    ![](img/e36b94f8548b09d00212238f073b11d9_138_1.png)


    +   The task list for displaying minimized windows on the right.


    ![](img/e36b94f8548b09d00212238f073b11d9_138_2.png)


    Notice, too, the arrows on each side of the panel. Selecting an arrow slides the
