  md: '![](img/e36b94f8548b09d00212238f073b11d9_274_0.png)


    # Note


    For a list of package sets, see /usr/share/package-sets. Each package set includes
    a file with an extension of .contents, which lists the packages in the set, and
    a file with an extension of .description, which displays in gnome-apt-pkgset.


    # The apt-pkgset Command


    | Command | Action |

    | install | Adds the package set to your system. |

    | remove | Removes the package set from your system. |

    | status | Reports on the package set''s status. |

    | purge | Removes the package set from your system and all files and associated
    with it. |


    # Installing and Removing Packages With the apt-get Command


    The apt-get (A Package Tool or Advanced Package Tool) utility is widely considered
    one of the most sophisticated package tools available. Although still in development,
    apt-get can reliably upgrade your system over the internet or upgrade all packages
    on your system in a single operation.


    The apt-get command can run from the command line, or be selected as a source
    in dselect, the old text-based package management tool in Debian.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'the apt-get utility is not so much a command, but a collection of commands.

    This fact is reflected in its format, which can include not only options, but
    a specific command as well.


    > Type: apt-get *OPTIONS* COMMAND *PACKAGE\_NAME*.


    Note that:


    +   ▼ You may be asked questions during the install. Many can be answered with
    a y (“yes”) or n (“no”).

    +   ▼ Some commands can be entered without specifying package names. If no packages
    are mentioned, commands like *upgrade* affect the entire system. Others commands,
    such as *install*, require that a package is specified.

    +   ▼ Options can be entered as part of the command or set in /etc/apt/ apt.conf.
    Options set in the configuration file can be overridden from the command line
    by using the option-OPTION\_NAME=no.


    # The apt-get Command (Manage Packages): Options


    | Option | Action | Comment |

    | :--- | :--- | :--- |

    | ▼ -b<br>▼ --compile<br>▼ --build | Compiles source packages after they are downloaded.
    | |

    | ▼ -d<br>▼ --download-only | Downloads packages, but does not unpack them. |
    The option for the configuration file is: apt:Get: Download-only |

    | ▼ -f<br>▼ --fix-broken | Adds missing dependencies. | The option for the configuration
    file is: apt:Get: :Fix-Broken |'
