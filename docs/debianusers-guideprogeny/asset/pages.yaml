- pgno: 100
  md: "# ## 4  \n# Starting and Stopping the System and Graphical Interface\n\nLike\
    \ any version of Linux, Progeny Debian has strict procedures for starting and\
    \ stopping a system. These procedures are part of the operating system's security\
    \ features. They also prevent accidental damage to the system.\n\nTo start your\
    \ computer, you must choose the operating system to load from the boot manager,\
    \ and then log in to a user account.\n\nTo stop your computer, you must log out\
    \ of the user account, then half or reboot the system.\n\nThis chapter explains:\n\
    \n+   * Working with user accounts.\n+   * Choosing an operating system from the\
    \ boot manager.\n+   * Logging in to the desktop and to the command line.\n+ \
    \  * Shutting down from the desktop.\n+   * Starting and closing the graphical\
    \ interface.\n+   * Changing user accounts after logging in."
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Working With User Accounts


    Linux is designed for multiple users. To use the system, you must log in with
    a user account. To use an account, you must know both the user name and the password.


    User accounts are organized into groups of accounts with similar access to the
    system. The software and the hardware you can use depends on the user account
    that you are using and the groups to which it belongs.


    For more information, see “Managing User Accounts,” page 231 and “Managing Groups,”
    page 235.


    When you install Progeny Debian, create at least two user accounts: a regular
    user account for everyday computing, and a root account for system admin- istration.
    Normally, you want one regular user account for each person who uses the system.


    # Understanding Regular User Accounts


    A regular account is used for everyday computing. Each account has a home directory.
    By default, users’ home directories are beneath the /home direc- tory. This home
    directory is usually the same as the user name for the account.


    When you are logged in with an account, you usually can:


    +   Read, write, and use all files and directories in the account’s home direc-
    tory.


    +   Read, write, and use all files and directories to which other users give you
    permission.


    +   Read, but not write or use basic system files.


    On some systems, the system administrator may choose to make basic sys- tem files
    unreadable by regular users.


    Accounts may annoy those familiar with other operating systems. However, user
    accounts have several advantages:'
  merge: -1
  img_proc: true
- pgno: 102
  md: "+   ▼ Your private files are secure. You can change your setting so that other\
    \ regular users cannot change, nor even see your files.\n+   ▼ Your desktop and\
    \ command line interfaces can be customized.\n+   ▼ Viruses are less likely to\
    \ infect the computer. While viruses are not the problem on Linux that they are\
    \ on other operating systems, any damage is likely to affect only one user's files.\n\
    +   ▼ Only the root user can use important files. Mistakes, like viruses, are\
    \ likely to affect only a user's personal files.\n\n# ### Understanding the Root\
    \ Account\n\nThe root account has full access to all software and hardware on\
    \ the system. In most cases, it should be the only account that has full access.\
    \ For this reason, the root user is sometimes called the super user or privileged\
    \ user. The root user's home directory is /root.\n\n> **Note**\n> \n> The /root\
    \ directory is different from the root directory at the top of the Linux directory\
    \ tree. Nor is it the same as the root partition - the partition that the root\
    \ directory is on.\n\nTo avoid damaging your system, take the following precautions\
    \ when using the root account:\n\n+   ▼ Use the root account only for configuration\
    \ or administration.\n+   ▼ Use the root account as briefly as possible.\n+  \
    \ ▼ As few people as possible should know the password for the root account. Each\
    \ of those people should use another account for everyday computing\n+   ▼ Do\
    \ not give root privileges to any other account.\n+   ▼ Do not use the root account\
    \ on the Internet.\n+   ▼ Use these precautions even on a single, unnetworked\
    \ computer."
  merge: -1
  img_proc: true
- pgno: 103
  md: "# Using the Boot Manager\n\n![](img/e36b94f8548b09d00212238f073b11d9_103_0.png)\n\
    \nMany users have multiple operating systems or Linux kernels on the same computer.\
    \ Using a boot manager, you can choose which operating system or kernel to start\
    \ your computer with.\n\nProgeny Debian uses GRUB (Grand Unified Boot Manager).\
