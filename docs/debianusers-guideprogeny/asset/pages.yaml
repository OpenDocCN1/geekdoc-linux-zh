    # Changing Permissions From the Command Line


    The chmod command has two modes: the symbolic (or character) and the absolute
    (or octal) mode.


    As well as the usual options in any command, the symbolic mode uses a series of
    individual arguments. Use the symbolic mode if you want to assign the permissions
    carefully, and in full.


    By contrast, the absolute mode uses octal notation to reduce the arguments in
    the commands to three characters. Despite its name, absolute mode is quick and
    efficient once you learn it.


    # Changing Permissions in Symbolic Mode


    Type: `chmod OPTIONS GROUP ACTION PERMISSIONS FILE`.


    The possible entries for each part of this command is explained in one of the
    tables below.'
