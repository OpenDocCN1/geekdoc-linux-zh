    # ## Unmounting a file-system


    Unmounting makes a file-system inaccessible until the mount command is used again.


    Only file-systems that are not currently in use can be unmounted. Unless you boot
    from a floppy, CD or other removable device, you cannot unmount:


    +   - The root partition.

    +   - The swap partition (unless you use the `swapon` command first).

    +   - Any file-system that has a binary that is currently in use on the system.


    You must unmount a removable file-system before changing it.


