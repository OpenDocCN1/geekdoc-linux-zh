- pgno: 360
  md: '# Configuring a Sound Card


    Progeny Debian detects most sound cards automatically. However, in some cases,
    you may need to configure sound support in the kernel. See “Recompiling a Kernel,”
    page 352.


    Before editing the kernel, you need to know your card''s:


    +   - IRQ numbers.

    +   - DMA channels.

    +   - Port addresses.


    If your card is already installed, you can find information about it:


    +   - In `/proc/sound`.

    +   - The computer''s BIOS settings.

    +   - The sound card''s manual, which may list defaults.

    +   - From the tools of another operating system on which the card is already
    installed.


    # Installing Plug and Play Sound Cards


    Instead of configuring the kernel, you can use a command tool to enable cards
    that support the Plug and Play standard:


    +   1. Type: `pnpdump> /etc/isanp.conf`.

    +   2. Open `isanp.conf` in a text editor.

    +   3. Uncomment the settings you want to try. Remove the hash marks from the
    lines on which the settings are listed.

    +   4. Save the file, and then reboot your system.

    +   5. To check whether sound is enabled, start a program that uses sound. If
    you have none, enable sound for the desktop in the Control Center.


    # Setting Up Palm Synchronization


    Progeny Debian is not installed with support for Palm-compatible devices. However,
    you can easily add this support by installing a package or two.'
