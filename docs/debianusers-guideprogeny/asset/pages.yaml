    \n+   7 Select the OK button.\n\n+   8 Restart the desktop or reboot the computer\
    \ for the changes to take effect.\n\n# Configuring a Video Card Manually\n\nYou\
    \ can configure your video card in the Screen section of /etc/X11/ XF86Config-4."
  merge: -1
