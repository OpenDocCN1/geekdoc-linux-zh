- pgno: 150
  md: '# # 7


    ## Making the Desktop Your Own


    GNOME is famous for being highly customizable. You can customize almost every
    feature globally or individually. For example, you can customize all the panels
    on the desktop, or just one.


    Customization controls are scattered throughout the desktop. However, most of
    them are available from:


    +   - The GNOME Control Center icon on the panel.

    +   - The Settings menu.

    +   - Pop-up menus for different parts of the desktop.


    This chapter directs you to the windows where you can customize:


    +   - Display settings.

    +   - General settings for the GNOME desktop and the Sawfish window manager.

    +   - Program launchers (icons).

    +   - General desktop behavior, including confirmation dialogs.

    +   - The Panel.

    +   - The Menu.

    +   - Individual windows.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '▼ The program launched when a specific type of file is selected (MIME Type).


    For complete information about the features that you can customize, see the on-line
    GNOME help.


    If a feature are unfamiliar to you, whenever possible, use the Try button to see
    the result. If you see no effect, write down the change and the original setting
    so you can reverse the change after exploring.


    On some systems, particular changes may have no effect until you reboot or restart
    the X server.


    ▼ **Note**

    If you change window managers, some of your configuration options may change.


    This chapter assumes that you are working with a default desktop using the Sawfish
    window manager.


    # ## Configuring Monitor Color Display


    If you are doing graphics work, or need to adjust your monitor''s display, select
    Settings > ImLib Configuration Options from the main menu.


    ![](img/e36b94f8548b09d00212238f073b11d9_151_0.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: "You can edit:\n\n+   - Color palettes: The colors used for the desktop display.\n\
    +   - Rendering: The technical aspects of displaying images, such as dithering\
    \ and the cache size reserved by the desktop.\n+   - Display: Forcing selections\
    \ if they are not used by your hardware. Otherwise, this tab is blank.\n+   -\
    \ RGB Color correction: The calibration of basic colors for the display: Red,\
    \ Green and Blue.\n\nYou can save configurations for the current user or, if you\
    \ are logged in as root, for the entire system.\n\n> **Warning**\n> Changing these\
    \ settings can worsen your display if you do not know what you are doing. Make\
    \ changes carefully, and record original settings so that you can restore them.\n\
    \n# Customizing General Settings for GNOME and Sawfish\n\nYou can customize settings\
    \ for the behavior of GNOME, the Sawfish window manager, and your themes from\
    \ the Control Center.\n\nTo customize general settings:\n\n+   1. Do one of the\
    \ following:\n+   \t- Select the Control Center icon from the panel.\n+   \t-\
    \ From the menu, select Settings > GNOME Control Center.\n+   \t- Middle-click\
    \ on the workspace area to display a pop-up window, then select an item from the\
    \ Customize menu."
