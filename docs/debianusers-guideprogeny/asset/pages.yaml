    # Checking Hardware Compatibility


    Many brand name products work without trouble on Linux. Moreover, hardware for
    Linux is improving daily. However, Linux still does not run as many different
    types of hardware as some operating systems.


    In particular, Linux usually cannot run hardware that requires a running version
    of Windows to work. Although some Windows-specific hardware can be made to run
    on Linux, doing so usually requires extra effort.


    So called win-modems are the most common type of this hardware. However, printers
    and other equipment may also be Windows-specific.


    You can check hardware compatibility by:


    +   * Checking manufacturers'' web sites for new drivers.


    +   * Looking at web sites or manuals for information about emulation. Lesser
    known brands can sometimes use the drivers or settings for better-known ones.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '+   Checking hardware compatibility lists for Linux, such as www.linux-doc.org/HOWTO/Hardware-HOWTO.html.


    +   Searching the Internet for other users’ experiences.


    # ## Meeting Minimum Hardware Requirements


    Once you have gathered information about your computer’s hardware, check that
    your hardware will let you do the type of installation that you want to do.


    Depending on your needs, you might manage with less than some of the recommended
    hardware listed in the table below. However, most users risk being frustrated
    if they ignore these suggestions.


    # ## Recommended Minimum System Requirements


    | Install Type | Processor | RAM | Hard Drive |

    |---|---|---|---|

    | No desktop | Pentium 100 | 16 megabytes | 450 megabytes |

    | With Desktop | Pentium 100 | 64 megabytes | 1 gigabyte |

    | Server | Pentium II-300 | 128 megabytes | 4 gigabytes |


    # ## Note


    If you are using a desktop, you will find that some window managers run better
    with more RAM.'
  merge: -1
