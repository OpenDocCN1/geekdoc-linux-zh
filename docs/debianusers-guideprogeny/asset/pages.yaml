- pgno: 422
  md: '# # B


    # ## Automating Multiple Installs


    Once you have installed Progeny Debian on a single system, you can auto-mate other
    installs by creating an automated install floppy. The automated install floppy
    is inserted in the floppy drive when you start an install.


    Making the automated install floppy consists of two steps:


    +   - Creating the configuration files.

    +   - Creating the automated installer floppy.


    # ## Creating Configuration Files


    The configuration files are created on an existing Progeny Debian system, then
    copied to the floppy for use during the install.


    You should know that:


    +   - `ssisord.lst, netmod.lst, and sources.lst` can be blank, but must be in
    the `/conf` directory with the other configuration files.

    +   - `postinst` is not required.


    Place all finished configuration files in a directory named /conf. This direc-tory
    can be a sub-directory any place on the system. Commands to create the automated
    install floppy are run from this directory.


    Examples of configuration files are available in `/usr/share/doc/autoinstall/`.'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# Creating the Global Configuration File (global.cfg)


    The global.cfg file contains the master information for the automated install.
    One option is entered per line. When an option requires a value, leave a space
    between the option and the value.


    # Options for the global.cfg File


    | Option | What It Does |

    | --- | --- |

    | baseurl | The URL for the minimal system’s tar file. The URL can be a CD (cdrom:)
    or a web address (http://). This option is required. |

    | rootpwd | The password hash for the root user. This option is required |

    | nosafe | Continues the install, even if a filesystem exists on the target machine.
    |

    | network | Allows the automated installer to configure the network. Possible
    values are: ▼ dhcp: Use DHCP. ▼ netdb: configure using the network.cfg file. ▼
    none: do not configure the network. |'
  merge: -1
  img_proc: true
- pgno: 424
  md: '# Options for the global.cfg File


    Option What It Does

    cdinst Install using a CD, instead of a network.


    nfs cd The path to an NFS-mounted CD image that will

    be used for the installation


    # Creating the debconf Configuration File (debconf.cfg)


    Make a copy of the debconf database. Type: /usr/sbin/readdebconf /~/CONF/debconf.cfg.


    # Creating the Network Modules File (netmod.lst)


    The netmod.lst file lists the SCSI kernel modules to load. Modules are listed
    one per line.


    Look at the example provided. Type: less /usr/share/doc/autoinstall/examples/netmod.lst
    on an existing Progeny Debian System. The file must be configured to fit your
    hardware.


    # Creating the SCSI Module File (scsimod.lst)


    The scsimod.lst file lists the SCSI kernel modules to load. Modules are listed
    one per line.


    Look at the example provided. Type: less /usr/share/doc/autoinstall/examples/scsimod.lst
    on an existing Progeny Debian System. The file must be configured to fit your
    hardware.


    # Creating the Network Configuration Database (network.cfg)


    The network.cfg file describes the network and all machines on it. The file consists
    of pairs of stanzas.'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'The first stanza in a pair is the global stanza. Global stanzas may be added
    for any network or routers. Global stanzas contain the following entries, with
    one characteristic per line:


    +   1 gateway


    +   2 network


    +   3 netmask


    +   4 name server


    +   5 broadcast


    +   6 domain name


    Leave a space after each characteristic, then add the value for characteristic.


    The second stanza in each pair is a local stanza. It defines local machines attached
    to the network or to the router. Each line defines a single machine. Each machine
    is defined by three columns:


    +   1 MAC address (ethernet card ID)


    +   2 IP address


    +   3 host name


    Columns are separated by a single space.


    At the bottom of a local stanza, you can add a default entry. The default entry
    is used if a machine cannot be otherwise connected to the machine. The default
    entry uses default for the MAC address and unassigned for the host name.


    # Creating the Partitioning Information File (partinfo.cfg)


    The partinfo.cfg file describes how the install program should partition each
    system during an automated install.


    One line is used for each partition. Each line has the same format:


    ```

    PARTITIONTYPE FILESYSTEM SIZE MOUNTPOINT SIZE.

    ```


    The size is either m (megabytes) or % (percentage of total disk space).'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'In most cases, you want at least a root partition and a swap partition.


    # Entries in partinfo.cfg


    | Entry | Choices |

    | :--- | :--- |

    | PARTITION TYPE | ▾ primary.<br>▾ logical. |

    | FILESYSTEM | ▾ ext2: Linux native.<br>▾ swap: Linux swap. |

    | SIZE | Any size, given in megabytes. |

    | MOUNTPOINT | The file should include at least one partition mounted as root
    ( / ).<br>A swap file has no mount point, but is entered as swap. |


    # Creating the Package Selection List (select.cfg)


    The select.cfg file lists the packages to install. To create the file, type: dpkg
    --get-selections > /-conf/select.cfg on an existing Progeny Debian System, then
    edit as desired.


    # Creating the Post Installation Script (postinst)


    The post installation script is a series of commands that are run after installation
    is complete. The script can be written any language supported by the fully installed
    system.


    The post installation script is optional. It is not needed for an automated install.'
  merge: -1
  img_proc: true
- pgno: 427
  md: '# Creating the Sources List File (sources.lst)


    This file is a list of sources for apt. It can be copied from any sources list
    for apt. You can create it by:


    +   Typing `cp /etc/apt/sources.lst ~CONF/sources.lst`


    +   Creating a plain text file called `sources.lst` in the target directory with
    the following line: `deb http://archive.progeny.com/progeny progeny main contrib
    non-free`.


    # Creating the Automated Installer Floppy


    Before creating the floppy for the automated installer, you must create all configuration
    files and place them in the `~conf` directory. Only the `postinst` file is optional.


    +   1. From the `~conf` directory, type: `make-autoinst-initrnd KERNEL_VERSION`.


    The kernel version is the version of the kernel that you want to use on the floppy
    to create the initial RAM disk that is used to start the system. The kernel must
    be installed on the system that you are currently using.


    +   2. Place a floppy disk in the drive. The drive is mounted automatically in
    the next step.


    +   3. From the `~conf` directory, type: `make-autoinst-disk KERNEL_VERSION`.


    **Note**

    Enter the same kernel version as you did in the first step.


    The automated install floppy is created.'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# Starting an Automated Install


    1. Check that you have an install source. The install source can be:


    +   - A CD.

    +   - A CD image available over an NFS-mounted CD image.

    +   - An URL. In this case, sources.lst must point to a valid Progeny mirror.


    Whatever the source, it must be specified in the global.cfg file.


    2. Place the automated install floppy in the floppy drive.


    3. Start the machine.'
  merge: -1
  img_proc: true
