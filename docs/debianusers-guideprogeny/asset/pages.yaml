- pgno: 98
  md: '# Installing Software From the Extras CD


    Progeny Debian includes an Extras CD with additional software, including the KDE
    desktop, a popular choice for a graphical display.


    To install software from the Extras CD:


    +   1. Log in to the system as the root user.

    +   2. Open a command line by selecting the icon on the top panel.


    ![](img/e36b94f8548b09d00212238f073b11d9_98_0.png)


    +   3. At the prompt, type: apt-cdrom add. Then follow the on-screen instructions,
    placing the Extras CD into the drive to add its package sets to the list on your
    system.

    +   4. From the menu in the top left corner of the screen, select Programs > System
    > Add/Remove Software.


    ![](img/e36b94f8548b09d00212238f073b11d9_98_1.png)


    The Configure Software screen opens. The screen resembles the one that you used
    to add software during the install, except that now it includes the contents of
    the Extras CD as well.


    +   5. Select the package sets to install.

    +   6. If you choose, double-click on a package set to view or select the individual
    packages in the set.

    +   7. Select the Apply button to install the software.


    The installation of your Progeny Debian system is now complete.


    If you need to fine-tune the system configuration, use the System tools in the
    GNOME Control Center. They are similar to the screens that you use during installation.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'If you want to add software or upgrade the system, use the apt-get utility
    or select Programs > System > Add/Remove Software from the main menu. Re-installing
    over an existing Progeny Debian system is often difficult.

    If you do re-install, backup all important information and reformat the partitions
    you are using.'
