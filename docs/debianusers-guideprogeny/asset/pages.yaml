    # Using Metacharacters With grep Commands


    Metacharacters are characters that can be used to set special conditions for searching.
    They are also known as wild cards. See “Using Special Symbols,” page 127.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Metacharacters are added to a text string. A text string that includes metacharacters
    is called a regular expression. Regular expressions are useful for finding variations
    in wording or in the positioning of the string on a line.


    Metacharacters can be used with both grep and egrep. However, grep can use fewer
    metacharacters than egrep. Whenever you want to use metacharacters, egrep is usually
    the tool to use.


    If you do not want to use any metacharacters at all, or do not have the characters
    memorized for use, use fgrep.


    Metacharacters can be extremely powerful, especially when used in combination.
    However, when you are using search tools, little is likely to go wrong unless
    you combine a grep command with another one that makes changes to files.


    # Note


    > If you want to search for a character that is usually used as a metacharacter,
    place a backward slash (\) in front of it. For example, \? searches for a question
    mark, instead of any character.


    Metacharacters are especially powerful when used together. For example:


    +   - ^contacts$ searches for matches in which contacts is the only word on a
    line.


    +   - [cC]ontacts matches contacts or Contacts.


    +   - ^...$ searches for any line of three characters.


    +   - compan(ies) searches for company or companies.


    +   - [A-Za-z] searches for any upper or lowercase letter. Similarly, [0-9A-Za-z]
    searches for any number or any letter.'
  merge: -1
  img_proc: true
