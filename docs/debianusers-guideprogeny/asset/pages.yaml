    # Loading an Operating System Not on the First Hard Drive


    GRUB generally reads from the first hard drive. For this reason, you sometimes
    need to temporarily remap additional hard drives to the first hard drive.


    Add the following lines to each stanza that refers to an operating system on another
    hard drive:


