- pgno: 307
  md: '# ## Managing Processes


    A process is a running program to which the Linux kernel has assigned a share
    of your system''s resources or computing power. Because Linux is a multi-tasking
    operating system, dozens of processes can be running at any one time.


    Some of the reasons that you may want to check the processes that are running
    include:


    +   - **To Troubleshoot:** Your system is not responding properly. The processes,
    the combination of processes, and the resources used by processes should all be
    examined as a routine part of troubleshooting.


    +   - **To check system security:** If you suspect an intruder on the system,
    the processes used may provide a clue. You should also check what user or group
    ID a process is running under. In particular, check programs running under the
    root account, since they could do the most damage.


    +   - **To close a frozen or strangely behaving program:** while Linux itself
    is stable, the desktop has developed rapidly, and some programs that run under
    the X Window System behave erratically. You may also need to close a program while
    testing it.


    # ## Understanding Processes


    Linux uses three basic types of processes:


    +   - **Interactive:** An ordinary program started by a user. Many commands entered
    from the command line are interactive processes. So is each new window opened
    in the X Window system.


    +   - **Batch:** Any process run without a command line terminal.


    +   - **Daemon:** A process that runs continuously. Usually, they are started
    when the system starts, but they can also be started by the root user. Daemons
    generally run in the background.


    You should also know:


    +   - **A major characteristic of each process is its priority.** If system resources
    are short, the priority determines what share of the resources the process'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'uses. In extreme cases, the priority determines the order in which processes
    can use system resources.


    +   Processes can be hierarchal. For example, the printing daemon is always running,
    but a new copy of it is started for an individual print job, then closed after
    the job is printed. The same thing happens when you open a command line, then
    enter a command.


    In both cases, the original process is called the parent, the secondary process
    the child. Because of this type of relation, you may sometimes hear about process
    trees.


    +   The opening of a secondary process is also called forking.


    Linux includes a number of tools for working with processes. See “Viewing Intensive
    Processes,” page 313.


    **Warning**

    Be careful about killing a process or changing its priority. Unless you know what
    you are doing, you can easily crash your system. Be especially careful of daemons,
    which often manage important system services and resources.


