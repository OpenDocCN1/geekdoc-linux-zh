    # ### Compressing and decompressing Files With the gzip Command


    The gzip command is one of the two Linux tools for compressing and decompressing
    files. The other is bzip2. The bzip2 command can compress files more, but gzip
    is more common, and can sometimes read zipped files, or compressed files created
    with the obsolete tool compress.


    A file compressed using gzip has a .gz extension.


    Type: **gzip OPTIONS FILES**.


    Separate file names with a space.


    The gzip command has several related utilities:


    +   * ▼ zcat: Displays files in a gzip archive.

    +   * ▼ zcmp: Compares files in a gzip archive.

    +   * ▼ zdiff: Compares files in a gzip archive.

    +   * ▼ zgrep, zegrep, zlgrep: Search for text patterns in files in a gzip archive.

    +   * ▼ gunzip: decompresses files. However, gzip -d also decompresses.'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'All these commands have the same format as gzip. They can use the same options
    as the regular versions of the commands.


    # # The gzip Command (Compress)


    | Option | Action | Comment |

    | --- | --- | --- |

    | --best | Sets the amount of compression to greatest setting (on a scale of 1
