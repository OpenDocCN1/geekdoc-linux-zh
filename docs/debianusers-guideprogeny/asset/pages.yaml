  md: '# # Configuring a Network Connection From the Command Line


    +   1. Logged in as root user, add your hostname to /etc/hostname.

    +   2. Add your hostname and IP address to /etc/hosts.

    +   3. Add at least your IP address, and netmask to /etc/init.d/network. You may
