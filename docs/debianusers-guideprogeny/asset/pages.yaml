- pgno: 148
  md: '![](img/e36b94f8548b09d00212238f073b11d9_148_0.png)


    # **Note**


    On the desktop, you can also select Directory or URL Link by right-clicking on
    the work space and making a selection from the New menu.


    # Icon Properties Tabs


    | Tab | Editable Information |

    | --- | --- |

    | Statistics | Basic information about the icon. You can change the icon text
