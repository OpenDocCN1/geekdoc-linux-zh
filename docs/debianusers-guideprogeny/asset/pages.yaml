- pgno: 236
  md: 'You can calculate the digit to use by adding the octal number for each permission.
    See “Calculating Numbers for the chmod Command Absolute Mode,” page 235. You must
    use at least three digits in Absolute Mode.


    A fourth number is sometimes added as a prefix to set user or group ID or to set
    sticky. See “The chown Command (Change Permissions): The 4th Digit in Absolute
    Mode,” page 200.


    # Calculating Numbers for the chmod Command Absolute Mode


    To calculate each digit in Absolute Mode, add the octal numbers for the permissions
    you want to set. For example, the number to set read and execute permission is
    5 (4+1).


    The first three digits are for the user, group, and others. For example, 754 gives:


    +   The user read, write, and execute permission.


    +   The group read and execute permission.


    +   Others read permission.


    You may also use a fourth digit. See “The chmod Command (Change Permissions):
    The 4th Digit in Absolute Mode,” page 236.


    # The chmod Command (Permissions): Absolute Mode


    | Permission | Octal Number |

    | :--- | :--- |

    | Read permission. | 4 |

    | Write permission. | 2 |'
  merge: -1
