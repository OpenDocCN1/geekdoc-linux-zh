    \ in a text editor. You can change the look of the display by changing desktops\
    \ or window-managers.\n\n+   This section discusses:\n+   \n+   - Configuring\
    \ a video card.\n+   - Configuring a monitor.\n+   - Configuring the graphical\
    \ display (screen color depth and resolution)\n+   - Configuring a pointer\n+\
    \   - Changing desktops.\n+   - Changing window managers."
  merge: -1
  img_proc: true
- pgno: 395
  md: '# # Configuring a Video Card From the Desktop


    ![](img/e36b94f8548b09d00212238f073b11d9_395_0.png)


    Information about your video card is detected automatically by the system. However,
    you can change this information if necessary.


    > **Warning**

    > Choosing settings that are not supported by your video card could damage it
    or the monitor.


    +   1 Select **Systems** > **X Configuration** from the GNOME Control Center.


    > **Note**

    > If you are using the KDE desktop, type `/usr/bin/xserver-configure-capplet`
    at a command line.


    +   2 From the **X Configuration** pane, select the **Video Card** tab.'
  merge: -1
  img_proc: true
- pgno: 396
  md: "+   3 Enter a name or identifier for your video card configuration. After the\
    \ install, you can see this name in the XFree86Config file.\n\n+   4 If necessary,\
    \ select the X server package (graphic display driver) to use. In most cases,\
    \ you can use the one suggested by the install program.\n+   \n+   If you have\
