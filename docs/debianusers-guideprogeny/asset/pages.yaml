- pgno: 112
  md: '# 5

    Getting to Know the Command Line


    A command line is a text-based interface for interacting with your computer. You
    type a command, then press the Enter key to run it. If you have used DOS, then
    you have used a command line.


    The command line is also known as the terminal, xterm, console, command shell,
    or shell. Some of these terms make technical distinctions, but, for most purposes,
    you can consider them identical.


    This chapter explains the basics of using the Linux command line. It covers:


    +   - Why Use the Command Line: An explanation of why you should learn to use
    the command line.


    +   - Starting the Command Line: The different ways that you can open a command
    line.


    +   - Navigating the Command Line: How you can move through directories and list
    files from the command line.


    +   - Entering a Command: How a command is structured and how you run one.


    +   - Using Command Line Shortcuts: Features of the Linux command line that save
    you time, effort, and typing.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '+   ► Finding Help for Commands: The on-line help systems for commands.


    The rest of the manual also contains command line solutions to different computing
    tasks.


    # ### Why Use the Command Line?


    Most Windows and MacOS users work with a graphical desktop and ignore the command
    line. Increasingly, many Linux users are doing the same. However, you should learn
    how to use the command line for several reasons:


    +   ► Many useful tools can only be used from the command line.


    +   ► The command line gives you more flexibility and power, especially when you
    are working with multiple files.


    +   ► If you ever need to recover, you will do so from the command line. Maintenance
    work in single-user mode also requires familiarity with a command line.


    These reasons are important enough that many Linux users work from the command
    line instead of the desktop.


    If you have used DOS, you will find the Linux command line much easier and much
    more powerful. Not only does it have many shortcuts to save you time, but you
    can even choose the command line interface - the shell - that best suits your
    needs. This manual assumes that you are using BASH (Bourne Again Shell), the default
    for Progeny Debian and most other Linux distributions.


    # ## Starting a Command Line


    If your computer is not set-up to use a graphical desktop, it starts with the
    command line already running.


    To start a command line while running a graphical desktop, do one of the following:'
  merge: -1
  img_proc: true
