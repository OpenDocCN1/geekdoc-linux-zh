  md: '# Configuring Printers


    ![](img/e36b94f8548b09d00212238f073b11d9_87_0.png)


    In this screen, you can configure printers for your system.


    +   1. Select the Printer definition to create or edit. If you have not created
    a Printer definition already, you can only select New.


    +   2. Enter a short name and a long name for the printer definition. These names
    can help you identify the printer.


    The short name appears on the printer pool, that stores files before they are
    sent to the printer, and in configuration files. The long name is used mainly
    to help you identify the printer


    At some companies, printers are named with a theme, such as animals or famous
    people.


    However, names based on some combination of the manufacturer, model, and or path
    name of the printer may be easier to work with.


    +   3. Select the location of the printer:


    +   Local: the printer is attached to the machine on which you are installing.
    You need to enter the device to which the local printer is attached. Usually,
    the device will be the first parallel port, /dev/lp0'
