    # ## Configuring Electronic Mail


    ![](img/e36b94f8548b09d00212238f073b11d9_85_0.png)


    Unless set to local only, e-mail requires a network or dialup connection. You
    can configure a network during the install process or after. A dialup connection
    is not part of the install program, but you can set up one after the install process.


    If you need help with the choices on this screen, consult your system administrator
    or Internet service provider.


    +   1 Select the General mail setup. Choices are:


    +   - **Internet Site:** The same machine that originates the mail sends it and
    receives any incoming mail.


    +   - **Internet with smart host:** A dedicated server delivers mail. This setting
    is often used when you are connecting to an Internet service provider.


    +   - **Satellite system:** No mail is delivered locally. Mail is delivered only
    through the smarthost.


    +   - **Local only:** E-mail can only be sent and received by users on the present
    machine.'
