  md: '# Customizing Program Launchers


    A program launcher is a link to a file represented by an icon. Launchers can be
    added, deleted, or repositioned. You can also restore the default launchers that
    appear the first time that you start the system.


    In most cases, the process for customizing launchers is the same, regardless of
    whether they are on the panel, a menu, or the desktop work space.


    # Adding Launchers


    Adding a program launcher is the same process if you are adding it to the desktop
    workspace, the panel, or a menu.


    To add an icon for a launcher:


    +   Right click to display the pop-up menu for the part of the desktop:

    +   - On the desktop, select New > Launcher.

    +   - On the panel, select Panel > Add to Panel > Launcher.

    +   - On the main menu, select Add New Item to this menu (available only to the
    root user.'
  merge: -1
  img_proc: true
