- pgno: 59
  md: '# ## Selecting the Installation Target


    Selecting the Installation Target is the first step in configuring the minimal
    system. Unless you select Custom partitioning, it is also the only step.

    Each installation target uses your hard drive in a different way.

    If you are unsure of which to choose, study the advantages and disadvantages of
    each target to decide which is best for you.


    # ## Installation Targets for Progeny Debian


    | Advantages | Disadvantages |

    | :--- | :--- |

    | **Entire Disk** | |


    +   ▼ You do not need any special knowledge.

    +   ▼ It''s quick.


    +   ▼ You lack full control of the process.

    +   ▼ Information is lost unless you back it up.

    +   ▼ The default setup may not be what you want, especially if you are an advanced
    user.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Installation Targets for Progeny Debian


    | Advantages | Disadvantages |

    | :--- | :--- |

    | **Free Space** |  |

    | ▼ Information is not destroyed. | ▼ The hard drive must have enough continuous
    space for the necessary partitions. |

    | ▼ Existing partitions are kept. |  |

    | ▼ You do not need any special knowledge. | ▼ You lack full control of the process.
    |

    | ▼ It''s quick. | ▼ The partitions created may be smaller than you want or need.
    |

    | **Custom** |  |

    | ▼ You fully control the process. | ▼ You must understand what you are doing.
    |

    | ▼ You decide whether to keep existing partitions. |  |

    | ▼ You can put major directories such as /home or /usr on different partitions.
    | ▼ You could destroy information by accident. |'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Creating and Editing Partitions


    ![](img/e36b94f8548b09d00212238f073b11d9_61_0.png)


    When you select Custom partitioning as your installation target, the Edit Partitions
    screen opens.


    Using the Edit Partitions screen, you can create, delete, or edit partitions.
    Partitions are divisions of your hard drive.


    You need at least a root partition before you can continue the install. You should
    also add a swap partition for virtual memory.


    If you want, you can also create other partitions.


    For example, many Linux users prefer to have personal files on a separate partition
    to make back ups easier.


    Similarly, some put printer queues on a separate partition to limit their size.'
  merge: -1
  img_proc: true
