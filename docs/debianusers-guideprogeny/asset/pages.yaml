- pgno: 262
  md: '# # 11

    ## Installing, Removing, and Upgrading Software


    You can install software in Progeny Debian in several ways:


    +   - **Using a Progeny package set:** The easiest way to install common, related
    packages.


    +   - **Using a Debian package:** The easiest and most common method for installing
    packages in general.


    +   - **Compiling and installing source code from a tar file:** A method used
    when a Debian package does not exist.


    +   - **Converting a package from another format:** This method is not commonly
    used, because it is not always reliable.


    +   - **Using a third party installer:** Some developers of commercial or Open
    Source software have developed their own installers.


    Many third party installers are easy to use. However, none are standard, so discussing
    any of them is beyond the scope of this manual. For information on them, check
    the information provided by the developer of each installer.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '![](img/e36b94f8548b09d00212238f073b11d9_263_0.png)


    No matter what method you use, in almost every case, you must be logged in as
    root user to install or remove software.


    # Understanding Packages


    A Linux packages is an archive of files for installing software easily: Each package
    contains a program and the scripts needed to install, configure, and remove it.


    Linux has two main package systems:


    +   - The Red Hat Package manager is used by Red Hat and other distributions derived
    from it, such as Mandrake and SUSE. Its packages have an .rpm extension. They
    are often not compatible with Progeny Debian or other Debian systems, and not
    recommended for use.


    +   - Progeny and Debian use the Debian package system. Its packages end with
    a .deb extension. The Debian package system is widely known for its sophistication
    and reliability. Unlike RPM packages, Debian packages resolve any dependency problems,
    providing the necessary libraries instead of simply reporting the need for them.
    You can even upgrade your system while it is running with a single command.


    The two package systems are not compatible, although some conversion programs
    exist. One of the most common is alien. However these conversion programs do not
    always work.


    Debian packages are available from a Progeny or Debian CD, or from www.progeny.com
    or www.debian. org.


    ![](img/e36b94f8548b09d00212238f073b11d9_263_1.png)


    Progeny Linux Systems cannot guarantee that a package from a Debian-based distribution
    can work with Progeny Debian.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Understanding Package Management Tools


    Progeny Debian offers several tools for package management, including:


    +   gnome-apt-pkgset: Progeny''s desktop tool for installation and removal of
    sets of common packages.


    +   apt-pkgset: Progeny''s command line tool for installation and removal of sets
    of common packages.


    +   apt-get: An advanced package management utility.


    +   apt-setup: A tool for editing the sources list for gnome-apt-pkgset and apt.


    +   dpkg: A package management utility, not as advanced as apt, but capable of
    complex searches for packages and their contents.


    +   dpkg-deb: A utility for managing packages.


    Other tools available include dselect and apts, two text-based interfaces. How-
    ever, because new users often find these tools confusing, they are only men- tioned
    here without any further documentation.


    All these tools work with a list of sources. These sources may be CDs or internet
    sites. Packages are transferred from a source to your hard drive. They can then
    be installed, either immediately or later.


    Once you know something about the structure of Debian packages, you can use these
    tools quickly and easily.


    # Understanding Debian Package Management


    Before installing, removing, or upgrading software, you may want to learn more
    about:


    +   The life cycle of a package


    +   Information in packages, including:


    +   The contents of packages.


    +   Package names.


    +   Priorities.'
  merge: -1
  img_proc: true
- pgno: 265
  md: "+   Dependencies.\n\n+   Package management files.\n\n+   Statuses\n\n+   Package\
    \ flags.\n\n> **Note**\n> \n> If this information seems too overwhelming just\
    \ now, you can skip this section, especially if you are using Progeny's GNOME\
    \ apt-pkgset tool. However, refer back to this section if you are ready to know\
    \ more than the basics.\n\n# # Understanding the Life Cycle of a Package\n\nDebian\
    \ package management uses very specific terms to describe what is done with a\
    \ package:\n\n+   Downloaded: The package has been put on to the system from a\
    \ CD or from the internet.\n\n+   Unpacked: The files for the package have been\
    \ unarchived, but are not ready for use.\n\n+   Compiled: A binary has been made\
    \ from the source package has been made into a binary.\n\n+   Configured: The\
    \ package is ready for your system, but not installed.\n\n+   Installed: The package\
    \ can be used.\n\n+   Deinstalled: The package is removed, except for its configuration\
    \ files.\n\n+   Purged: The entire package is removed, including its configuration\
    \ files.\n\n# # Understanding Package Information\n\nPackages contain a wealth\
    \ of information. You can install a program without reading this information,\
    \ but, reading it often saves you wasted effort."
  merge: -1
  img_proc: true
- pgno: 266
  md: 'For example, you generally do not want to install a package that conflicts
    with another, or to start the installation of a package whose installed size is
    greater than the free space on your hard disk.


    This section explains:


    +   - The contents of packages.

    +   - Package names.

    +   - Important files for packages.

    +   - Priorities.

    +   - Dependencies.


    # ## Understanding the Contents of Packages


    Debian packages are either binary or source. A binary package contains a compiled
    program that can be run after installation. A source package must be compiled
    before it can be installed.


    A Debian binary package contains:


    +   - A binary or executable file: The program itself.

    +   - The conffiles file: Lists the configuration files for the package.

    +   - Configuration files: Files need to install or remove the package.

    +   - Installation scripts: Scripts that run automatically when a package tool
    is used. Some may require input from the user. Scripts are in the /var/lib/dpkg/info
    directory. Usually, there are four:


    +   - preinst: Runs before installation of the package.

    +   - postinst: Runs after installation of the package.

    +   - prerm: Runs before removal of the package

    +   - postrm: Runs after removal of the package.

    +   - man and/or info pages: Help for the program.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'The control file: A summary of the libraries required by the package, the name
    and version of the package, its priority, its installed size, its main-tainer,
    and other basic information.


    **Note**


    Look at the control file for basic information about the package before you install
    it.


    # ## Understanding Package Names


    Debian packages have a consistent naming convention:


    ```text

    PROGRAM_VERSION-REVISION_PROCESSOR.deb

    ```


    In other words, the name consists of:


    +   1. The program name, sometimes an abbreviation.

    +   2. The version number, usually a sequential number.

    +   3. The revision number, usually a sequential number.

    +   4. The processor type, such as i386 for Intel machines. This part of the con-vention
    is the least likely to be included.

    +   5. The .deb extension, which identifies a Debian or Progeny Debian package.
    Debian-based distributions may also use this extension.


    **Note**


    Progeny Debian packages are named in the same way as a standard Debian package.


    # ## Understanding Package Priorities


    A package''s priority is listed in the control file. The priority describes how
    important it is to the operating system:


    * **Requires:** The system must have the package.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '+   - **Important**: The system does not strictly need the package, but having
    it adds to the basic functionality.


    +   - **Standard**: The system benefits from having the package.


    +   - **Optional**: Most systems include this package.


    +   - **Extra**: Either the system does not need this package, or else it may
    con-  flict with a package that has higher priority.


    # Understanding Dependencies


    A package’s dependencies are listed in the control file. The dependencies describe
    how a package interacts with other packages or programming libraries:


    +   - **Depends**: The package needs another package to work. It may need a par-  ticular
    version of another program.


    +   - **Recommends**: The package works better with another package, but does
    not strictly need it.


    +   - **Suggests**: For most purposes, the package works better with another package.


    +   - **Conflicts**: The package does not work with another package. The two programs
    should not be run together. Consider removing one of the packages.


    +   - **Replaces**: The package over writes or removes another package.


    +   - **Provides**: The package includes another package, or at least its function-  ality.


    +   - **Predepends**: The package requires another package to run. You may have
    to install the other package first.


    # Finding Package Management Files


    Important files for package management are:


    +   - **/etc/apt/sources.list**: The internet sources of packages for use with
    apt and gnome-apt-package. **/var/state/apt/cdroms.list**: The list of cd sources
    for use with apt.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '+   ❖ /etc/apt/apt.conf: The configuration file for apt.


    +   ❖ /usr/share/package-sets: The directory that lists the contents and the description
    of a Progeny package set.


    +   ❖ /var/lib/dpkg/available: Lists packages on the system.


    +   ❖ /var/lib/dpkg/status: Lists the status of packages on the system. See “Understanding
    Package Statuses,” page 268.


    # ## Understanding Package Statuses


    As you use the package management tools, a package may be in several different
    states:


    +   ❖ config-files: Only the configuration files for the package are on the system.


    +   ❖ half-configured: Configuration was started, but interrupted.


    +   ❖ half-installed: Installation was started, but interrupted.


    +   ❖ installed: The package is unpacked and configured.


    +   ❖ not-installed: No part of the package is installed.


    +   ❖ unpacked: The package is unpacked, but not configured.


    # ## Understanding Selection States


    As you decide what to do with a package, it can be in one of several states. You
    can view the selection state using the dpkg command:


    +   ❖ Install: The package is selected for configuration and installation.


    +   ❖ Deinstall: All package files have been selected for removal except the configuration
    files.


    +   ❖ Purge: All package files have been selected for removal, including the configuration
    files.


    +   ❖ Hold: The current version of the package will not be over-written.


    +   ❖ Unknown: The package has not been unpacked.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Understanding Package Flags


    Packages may be flagged with two options. You can view package flags using the
    **dpkg** command:


    +   - **Hold:** Nothing is done with the package unless the `--force-hold` option
    is used with `apt`.

    +   - **Reinst-required:** The package is broken and needs to be reinstalled.
    The package can only be removed with the `--force-reinstreq` option for `apt`.


    # Installing and Removing Package Sets With gnome-apt-pkgset


    Progeny Debian simplifies package selection by grouping commonly used related
    packages into sets. If a program requires more than one package, you can install
    all the packages at the same time using Progeny’s **gnome-apt-pkgset** utility.


    As the name indicates, **gnome-apt-pkgset** is based on the **apt** utility. It
    is also the tool that you use during installation to select software. It includes
    much of the functionality of **apt**, and works in much the same way.


    However, experienced users may find **gnome-apt-pkgset** limiting and prefer to
    use **apt**. See “Installing and Removing Packages With the **apt-get** Com- mand,”
    page 273.


    > **Note**

    > For a list of package sets, see `/usr/share/package-sets`. Each package set
    includes a file with an exten- sion of `.contents`, which lists the packages in
    the set, and a file with an extension of `.description`, which displays in **gnome-apt-pkgset**.'
  merge: -1
  img_proc: true
