  md: '+   3 Enter a short name and a long name for the printer definition. These
    names can help you identify the printer.


    The short name appears on the printer spool, that stores files before they are
    sent to the printer, and in configuration files. The long name is used mainly
    to help you identify the printer.


    At some companies, printers are named with a theme, such as animals or famous
    people.


    However, names based on some combination of the manufacturer, model, and or path
