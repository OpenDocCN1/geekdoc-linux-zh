    +   ▼ Remote: The printer is on a network to which your machine is attached. You
    need to enter:


    +   ▼ The hostname: The machine to which the printer is attached.


    +   ▼ The printer name: The name of the printer on the system to which it is attached.


    If you do not have this information, consult your system administrator.


    +   5 Select the printer driver from the list. Printers are listed by manufacturer,
    then by model.


    If your printer is not listed, it may be able to emulate one that is. Try Hewlett-Packard
    Laserjet drivers for both postscript and non-postscript printers.


    +   6 Select the Apply button to enter the printer definition.


    +   7 Select the default printer. If you entered only one printer definition in
