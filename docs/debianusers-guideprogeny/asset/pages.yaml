    # ### Installing Unpackaged Software


    Linux developers often offer programs as tar files of uncompiled source code instead
    of in a package format. While a program is in early development, continually remaking
    packages would be a waste of effort, so most programmers do not bother. The source
    code is, after all, what most programmers are interested in.


    A tar file of unpackaged software may be listed as being dynamically linked or
    static. A dynamically linked piece of software calls on programming libraries
    as it needs them. By contrast, static software includes the necessary functions
    within itself.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Whenever possible, install the static version. Usually, the static version
    uses more software space. However, dynamically linked software often assumes a
    system that uses the Red Hat Package Management System, and may not work.


    Exact instructions vary with each piece of unpackaged software. However, the following
    instructions give a general overview.


    +   1 Download a tar file. Choose the static binary whenever possible


    +   2 If the site that you download from specifies that any dependencies are needed,
    download and install them before you install the software.


    +   3 Log in as root user.


    ![](img/e36b94f8548b09d00212238f073b11d9_291_0.png)


    # Note


    Do not use the internet while root user. Doing so makes your system vulnerable
    to attacks.


    +   4 Place the tar file in the root directory and unarchive it. A directory structure
    is created for the program.


    +   5 Change to the sub-directory that contains the program.


    Since there is no standard, you may have to search a while. Often, however, it
    is the /src (source) directory.


    +   6 Find and read the file that contains installation instructions. Usually
    it is called Install or Readme.


    +   7 Type ./configure. During the configuration process:


    +   Variables in the program are defined to suit your system


    +   Install scripts are created for your system


    +   Make files (the files needed for installation) are created.


    During configuration, a long list of information scrolls. If the last few lines
    contain no messages about errors, you can continue.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '8 **Type**: `/.make`. The software is compiled – that is, converted from source
    code to the binary format in which you use it.

    While the software is compiled, information scrolls by in the command line. If
    no error messages display, you can continue.


    9 **Type**: `/.install`. The software is installed. Generally, the program is
    added to the `/us/local` directory structure.


    These last three steps may take several minutes apiece. In each case, watch the
    display on the screen for errors. You may have to install a programming library
    on your system to get past these steps without errors.

    At the end of this process, the software should be ready for use. You may want
    to:


    +   - Clean up after installing unpackaged software, you can conclude by typing
    `/.make clean`.

    +   - Add an icon or a menu item for it to your desktop.


    **Note**

    The most likely error when installing unpackaged software is a missing dependency.
    However, because unpackaged software is often in development, it may not work
    on all systems.


    # # Making Debian Packages From Other Formats


    Often, you can make a Debian package from another format using the alien utility.
    However, because of the complexities of converting from one format to another,
    alien does not always work.

    For this reason, you may prefer to use a static tar file instead. See “Installing
    Unpackaged Software,” page 289.


    +   1 Obtain the package you want to install. You can convert from the following
    formats:

    +   - `rpm`: Red Hat Package Management format.'
  merge: -1
