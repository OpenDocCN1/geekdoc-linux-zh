- pgno: 356
  md: '# # Installing a Kernel


    Installing a kernel is third step in configuring a kernel.


    +   1. Build the kernel. See “Building the Kernel,” page 354.


    +   2. Move zImage to the root partition, renaming it. The /boot directory is
    the conventional location.


    Traditionally, the kernel is vmlinuz. If you have several versions of a kernel,
    add a suffix identifying the kernel version or some unique aspect of the kernel.
    For instance, if only one kernel has SCSI support, you could name it vmlinuz-scsi.


    +   3. If necessary, add the new kernel to the boot manager.


    +   4. Create a new boot disk. See “Create a new boot disk . .” page 355.


    You can now start your system with the new kernel by selecting it from the boot
    manager. If you have any problems, you can use the older kernel to start your
    system.


    # # Configuring Hardware


    Linux hardware support is rapidly improving. However, Linux still cannot run as
    much hardware as some popular operating systems. Before buying hardware for your
    Progeny Linux System, check that it runs under Linux. If the hardware is supported,
    Progeny Debian should generally detect it once it is added.


    As a general rule, if Linux supports your SCSI controller card, then you should
    be able to use any SCSI software, including scanners, CD drives, and removable
    drives, including Iomega Bernoulli and Zip drives, and Syquest drives.


    Support for IDE hardware is more varied. In some cases, you need to install a
    driver or recompile the kernel before an IDE device is usable.


    USB support is just starting to become commonplace for Linux. For this reason,
    check compatibility before purchasing new software.


    You can check the support for a particular piece of hardware by:'
  merge: -1
  img_proc: true
- pgno: 357
  md: '+   * Contacting the manufacturer.


    +   * Doing an internet search on the manufacturer and model. Look for hardware
    compatibility lists, how-tos, and discussion groups in which people describe their
    experiences.


    +   * Contacting Progeny Linux Systems or posting to the Progeny Debian mailing
    lists.


    Once you add the hardware to your system, it should generally be detected automatically.
    However, in some cases, you may need to configure it.


    This section outlines some of the more common hardware issues:


    +   * Configuring a printer.


    +   * Configuring a sound card.


    +   * Setting up Palm synchronization.


    +   * Setting up a scanner.'
  merge: -1
