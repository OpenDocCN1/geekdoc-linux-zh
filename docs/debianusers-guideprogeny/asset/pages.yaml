- pgno: 402
  md: '# Setting Display Settings from the Desktop


    ![](img/e36b94f8548b09d00212238f073b11d9_402_0.png)


    From the Desktop screen, you can set the resolution and color depth for the graphical
    display on your system.


    Settings for the graphic display depend on the capabilities of your video card
    and monitor. If you did not collect this information before installing, see “Gathering
    Hardware Information,” page 32.


    **Warning**

    Choosing settings that are not supported by both your video card and monitor could
    damage either piece of hardware.


    +   1. Select **Systems > X Configuration** from the GNOME Control Center.'
  merge: -1
  img_proc: true
- pgno: 403
  md: '**Note**

    If you are using the KDE desktop, type `/usr/bin/xserver-configlet-capplet` at
    a command line.


    +   2. From the X Configuration pane, select the Desktop tab.


    **Warning**

    Choosing settings that are not supported by both your video card and monitor may
    damage them.


    +   3. Select the resolutions to support. By default, your desktop starts in the
    highest resolution supported, but you can change the resolution:


    +   - Temporarily, by pressing Alt-Ctrl-keypad+ to cycle through the available
    resolutions.


    +   - Permanently, by editing the XFree86Config file.


    +   4. From the drop-down list, select the color depth, or the number of colors
    that your desktop will use.


    Fewer colors mean a less realistic display of graphics, but a faster redraw time.


    However, if you have a video card with more than 4 megabytes of memory, for most
    purposes you can use the highest available color depth without any trouble.


    **Warning**

    Choosing settings that are not supported by both your video card and monitor could
    damage either piece of hardware.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '+   5 Select the resolutions to support. By default, your desktop starts in
    the highest resolution supported.


    +   6 From the drop-down list, select the color depth, or the number of colors
    that your desktop will use.


    Fewer colors mean a less realistic display of graphics, but a faster response
    time.


    However, if you have 128 megabytes of RAM and/or a video card with more than 4
    megabytes of memory, for most purposes you can use the highest available color
    depth without any trouble.


    +   7 Select the X configuration tab for advanced display options.


    ![](img/e36b94f8548b09d00212238f073b11d9_404_0.png)


    From the X Server screen, you can set advanced options for your graphical display.
    If you are unsure what these settings mean, use the defaults.


    +   8 Select who can use a graphic display from the drop-down list:


    +   ◄ Root Only: Only the root user.


    +   ◄ Anybody: All users, whether local or remote.


    +   ◄ Console Users Only: Users can only start the graphical display at the local
    keyboard and monitor.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '9 Select the process priority. This setting determines what share of your system''s
    resources are given to the graphic display at any given time.


    # Warning


    Changing the priority for your graphical display can seriously affect system performance.
    Do not change this setting from -10 unless you are sure what you are doing.


    # Setting Display Settings Manually


    Settings for the graphical display are stored in the Display subsection of /etc/X11/XF86Config-4
    in the main section Screen.


    Entries in the Display subsection are arranged by color depth (Depth). Below each
    Depth are the resolutions (Modes) that can be used by each color depth. When the
    video card profile defined in the Screen section is used, the system defaults
    to the highest color depth and resolution listed. You can change the default by:


    +   Commenting out or deleting depths that you do not want to use.

    +   Adding or deleting modes.

    +   Placing the mode you want to be the default first in the horizontal list of
    modes.


    You can toggle through other resolutions by pressing Ctrl, Alt, numberpad+.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '![](img/e36b94f8548b09d00212238f073b11d9_406_0.png)


    # Warning


    Selecting color depths or resolutions unsupported by your monitor and video card
    can damage them. Refer to the hardware manuals while configuring the screen display.


    # Screen Display Depths and Modes


    | Setting | Comments |

    | :--- | :--- |

    | Depth | The color depth, in bits. This setting ranges from 1 to 24 bits (up
    to 4 billion colors). |

    | Mode | The screen resolution. All resolutions supported by the driver and color
    depth are listed in the line, with the default one first. Resolutions usually
    range from 640 x 480 to 1600 x 1200. Each resolution is surrounded by double quotation
    marks. |'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# # Configuring a Pointer from the Desktop


    ![](img/e36b94f8548b09d00212238f073b11d9_407_0.png)


    The pointer is usually a mouse. However, it can also be a trackball, a palette,
    or any other device that replaces a mouse.


    If you have been using the mouse during the install, you can accept the settings
    listed. However, if your mouse is not working, you can adjust the settings.


    +   1.  Select Systems > X Configuration from the GNOME Control Center.


    > > **Note**

    > >

    > > If you are using the KDE desktop, type /usr/bin/

    > > xserver-conflict-capplet at a command line.


    +   2.  From the X Configuration pane, select the Pointer tab.

    +   3.  Select the port to use.

    +       *   In most cases, it is /dev/ttyS0 (COM1) or /dev/ttyS1 (COM2) for a
    serial mouse, or /dev/psaux for a Ps2 mouse.

    +   4.  Select the protocol or driver to use.'
  merge: -1
  img_proc: true
- pgno: 408
  md: 'If you are using a serial mouse, then select the name of the manufacturer from
    the drop-down list. Use PS2 for a generic PS2 mouse.


    If you cannot find a protocol for your mouse or pointing device, select Auto to
    have it detected automatically.


    You can also try different protocols to see if your mouse can use them.


    +   5. Select “Emulate 3-button mouse” if you have a 2 button one.

    +   With three button emulation, pressing both buttons on the pointer is the same
    as pressing the middle button on a three-button pointer.


    Linux is designed for use with a three button mouse, so most users of two-button
    mouses should choose this option.


    +   6. Select “Enable scroll-wheel event” to use a scroll wheel.

    +   If your mouse has a scroll wheel, you probably want this option.


    # Configuring a Pointer Manually


    A pointer is usually a mouse, but can include trackballs and other devices used
    instead of a mouse.


    To edit the pointer manually, edit the Input Device Section of the /etc/X11/XF86Config-4
    file. Existing entries can help you make your own.


    Entries are in three columns:


    +   ▼ First Column: The general listing category. The first two must be "Identifier,"
    "Driver." The rest are "Option."


    +   ▼ Second Column: The exact listing. The first two must be the identifier and
    the driver. The rest are specific options, and must include "Device" and "Protocol."
    All entries must be in double quotation marks.'
  merge: -1
  img_proc: true
- pgno: 409
  md: '▼ Third Column: The setting for any options. Neither the Identifier nor Driver
    have a third column entry. All entries must be in double quotation marks. There
    must be an entry for the "Device" and "Protocol" option.


    # Pointer Settings in XF86Config-4


    | Setting | Comments |

    |---|---|

    | Identifier | The label for this pointer configuration. By default, it is "Configured
    Mouse" or "Generic Mouse." |

    | Driver | Usually, just "mouse." |

    | Device | The port that the mouse is connected to. In most cases, this setting
    is /dev/psaux or /dev/tty0 or /dev/tty1. |

    | Protocol | The driver for the pointer. The name of the protocol is usually based
    on the manufacturer, or on the type of mouse. See the man page for the file for
    a complete set of options. |

    | Emulate3Button | Set to "true" to enable three-button emulation. |

    | Corepointer | Makes the entry the primary pointer. Useful for laptops, which
    may have a built-in pointer, but are also capable of using a plug-in mouse. No
    entry is needed for this option in the third column. |'
  merge: -1
  img_proc: true
- pgno: 410
  md: "# Pointer Settings in XF86Config-4\n\n| Setting | Comments |\n|---|---|\n|\
    \ SendCoreEvents | Use for a secondary pointer, such as a plug-in mouse on a laptop.\
    \ | Set to \"true\" to the third column. |\n| ZAxisMapping | Enables the use of\
    \ a scroll wheel. | Set to \"4 5\" in the third column. |\n\n# Changing Desktops\n\
    \nProgeny Debian installs the GNOME desktop by default. You can also install the\
    \ KDE desktop using the Extras CD. See “Installing Software From the Extras CD,”\
    \ page 97.\n\nWhen either desktop is installed, you can choose which desktop to\
    \ run by selecting it from the Sessions menu of the log in screen.\n\n**Note**\n\
    \nWhen both are installed, you can run applications written for one desktop on\
    \ the other.\n\n# Changing Window Managers From a Desktop\n\n+   1 Install the\
    \ window manager packages. You can use the Progeny Debian Window managers package\
    \ set listed in the Add/Remove Software utility, or install the packages individually.\n\
    +   \n+   Installed window manager files are generally in a sub-directory of /usr/share,\
    \ with the executable in /usr/bin or /usr/X11R6.\n+   \n+   2 From the GNOME Control\
    \ Center, select Desktop > Window Manager."
  merge: -1
  img_proc: true
- pgno: 411
  md: "+   3. If necessary, select the Add button to add a window manager to the list.\
    \ Enter its name and executable.\n\n+   4. Highlight a window manager in the list.\
    \ Then select the Try button.\n\n+   5. A message window offers you the chance\
    \ to save the change. If you decide to save the change later, check the Save current\
    \ setup box as you log out.\n\n+   6. Do one of the following:\n+      \n+   \
    \   - Select the Revert button to return to your original window manager.\n+ \
    \     - Select the ok button to continue using the new window manager.\n+    \
    \  \n+      If you lose the desktop background image, select Desktop > Background\
    \ to restore it.\n\n# Changing Window Managers From the Command Line\n\n+   1.\
    \ Install the window manager packages. You can use the Progeny Debian Window managers\
    \ package set listed in the Add/Remove Software utility, or install the packages\
    \ individually.\n+      \n+      Installed window manager files are generally\
    \ in a sub-directory of /usr/share, with the executable in /usr/bin or /usr/X11R6.\n\
    \n+   2. Type update-alternatives --config x-window-manager. A list of installed\
    \ window manager displays.\n\n+   3. Type the number of the window manager you\
    \ want to use. Then press the Enter key.\n\n# Changing Other Settings\n\nThis\
    \ section explains:\n\n+   - How to change the date and time on your system.\n\
    +   - How to change command line shells."
  merge: -1
  img_proc: true
- pgno: 412
  md: '# Setting Date and Time From the Desktop


    ![](img/e36b94f8548b09d00212238f073b11d9_412_0.png)


    1  Select **Systems > Date and Time** from the GNOME Control Center.


    Note


    If you are using the KDE desktop, type `/usr/bin/time-configlet-coppel` at the
    command line.


    2  Under **Time Zone**, select your Region and Time Zone from the drop-down lists.


    The Time Zone list varies with the Region that you select.


    +   3  Select:

    +   - **The System set to UTC** box to set the system to Greenwich Mean Time.

    +   - **The path to your Network Time Server**, if you have one.


    4  Under **Date and Time**, select the month and year.


    The arrows on the left of the month and year display move the month or year backward,
    while the arrow on the right moves it forward.'
  merge: -1
  img_proc: true
- pgno: 413
  md: 'If you move the month from December to January, the year changes automatically.


    +   5 Select the day by highlighting it on the calendar.


    +   6 Enter the hour, minute and seconds.


    In each field, you can either enter highlight the current entry and over write
    it or else use the arrow keys to change it.


    +   7 Set the time to AM or PM.


    ![](img/e36b94f8548b09d00212238f073b11d9_413_0.png)


    # Note


    If you prefer a 24 hour clock or to use Greenwich Mean Time, you can reset the
    date once you install.


    +   8 Select the Set Date and Time button to apply your changes.


    +   9 Select the OK button.


    # Setting Date and Time From the Command Line


    As the root user, type date MMddhhmmmy at the command line. MM is the month given
    as a two digit number, and mm is minutes. Hours should be in 24-hour format.


    To set the time to Greenwich Mean Time, use the -u option.


    ![](img/e36b94f8548b09d00212238f073b11d9_413_1.png)


    # Note


    A desktop clock may take a moment to update.


    For more information about the date command, see its on-line help.


    # Setting the Command Shell


    Linux has many command line interfaces. These interfaces are called shells. The
    default shell is BASH (the Bourne Again Shell). This manual assumes that you are
    using it.'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'To change a shell temporarily, enter its name as a command. The next time you
    open a command line, you will be using BASH again.


    To change your default shell permanently:


    +   1. Type csh at the command line.


    +   2. When prompted, type the path to the shell''s executable. Executables for
    shells are usually in the /bin directory. They have the same name as the shell.


    ![](img/e36b94f8548b09d00212238f073b11d9_414_0.png)


    # Note


    You can also use the usermod -s SHELL to change a user''s shell.


    # ## Additional Linux Command Shells


    | Shell | Description |

    | :--- | :--- |

    | ash | A smaller shell than BASH, very popular for writing scripts. |

    | csh | The C shell. Popular with programmers because of its familiar syntax.
    |

    | tcsh | An enhanced version of the csh shell. In addition to the features of
    other shells, it includes a spell checker. |'
  merge: -1
  img_proc: true
