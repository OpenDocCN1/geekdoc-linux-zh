- pgno: 44
  md: '# 3


    # Installing Progeny Debian


    This chapter explains how to install Progeny Debian for the first time. If you
    want to:


    +   Upgrade an existing Debian or Debian-based operating system, see Appendix
    A.


    +   Do identical installs on different machines, see Appendix B.


    Progeny Debian features a graphical installer. The installer automatically detects
    many types of hardware, and suggests many settings.


    If you do not need a graphical display, you can use text-mode from the second
    stage of the install onwards.


    If you run into problems, you can usually follow the settings suggested by the
    installer and get a working system.


    After configuration, you can fine-tune the configuration from within Progeny Debian.


    Installation should take 30–60 minutes. The exact time depends on your choices,
    your experience, and the speed of your system.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Note


    If you have already installed Progeny Debian on your system, use the Add/Remove
    Software option to upgrade your system rather than reinstalling. Unlike some commercial
    distributions, Progeny Debian is not designed to reinstall over an existing system.


    Installation consists of five steps:


    +   - Organizing the install.

    +   - Installing the minimal system.

    +   - Configuring Progeny Debian.

    +   - Selecting and installing software.

    +   - Installing Software on the Extras CD.


    # Organizing the Install


    Immediately before installing, you need to:


    +   - Prepare for the install.

    +   - Choose the order in which to install different operating systems.

    +   - Decide on your install source and prepare for its use. Progeny Debian can
    be installed from:

    +       - A floppy and CD.

    +       - A CD.

    +       - A network.

    +   - Start the install.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# ## Preparing for the Install


    Collect the information about your system that you need, and have it handy during
    the install. Depending on how you choose to install, this information may include:


    +   - The partitions on the hard drive and which ones already contain an operating
    system.

    +   - The manufacturer and model for your video card, monitor, and printer.

    +   - Settings for your network or for your internet connection.


    In addition, back up any information that you do not want to lose. Errors or power
    surges and interruptions during the install could lose or corrupt it.


    For complete information about preparing for an install, see “Preparing to Install
    Progeny Debian,” page 31.


    # ## Installing Multiple Operating Systems


    If you are going to install more than one operating system on the same machine,
    install all versions of Windows first. Otherwise, the Windows installation program
    may destroy your ability to start other operating systems or encourage you to
    reformat partitions with other operating systems.


    You can recover from these actions or avoid them, but installing Windows first
    saves you trouble.


    # ## Preparing a CD or Floppy Installation


    Depending on your computer, you may need to change the boot order in the BIOS
    so that you can start from a CD or floppy.


    ![](img/e36b94f8548b09d00212238f073b11d9_46_0.png)


    You only need the floppy if your computer cannot start from a CD.


    The boot order is a listing of the drives that your computer tries to start from,
    and the order in which drives are tried. Your machine starts with the first operating
    system that it finds.'
  merge: -1
  img_proc: true
- pgno: 47
  md: "How you change the boot sequence may depend on whether you have an IDE or SCSI\
    \ system.\n\n# ### Changing the Boot Order on IDE Computers\n\n+   1. As your\
    \ computer starts, press the keys to enter the BIOS utility. Consult the system\
    \ documentation for the exact keystrokes.\n+   2. Find the boot sequence in the\
    \ setup utility. Its location depends on your machine, but you are looking for\
    \ a field that lists drives.\n+   \n+   Common entries on IDE machines are C,\
    \ A, CDROM or A, C, CDROM.\n+   \n+   C is the hard drive, and A is the floppy\
    \ drive.\n+   \n+   3. Change the boot sequence setting so that the CDROM or the\
    \ floppy is first. Usually, the Page Up or Page Down keys cycle through the possible\
    \ choices.\n+   4. Save your changes. Instructions on the screen tell you how\
    \ to save the changes on your computer.\n\nRemember to change the boot order after\
    \ the minimal Progeny system is installed, so that you restart your machine from\
    \ the hard drive.\n\n# ### Changing the Boot Order on SCSI Computers\n\n+   1.\
    \ As your computer starts, press the keys to enter the SCSI setup utility.\n+\
    \   \n+   You can start the SCSI setup utility after the memory check and the\
    \ message about how to start the BIOS utility displays when you start your computer.\n\
    +   \n+   The keystrokes you need depend on the utility. Often, it is Ctrl-F2.\n\
    +   \n+   2. Find the utility for changing the boot order.\n+   3. Set the utility\
    \ so that the SCSI ID of the CD drive is first on the list."
  merge: -1
  img_proc: true
- pgno: 48
  md: "# Note\n\nIf you need to use the floppy drive, follow the instructions for\
    \ changing the boot order on IDE computers. Floppies are never SCSI devices.\n\
    \n+   Save your changes. Instructions on the screen tell you how to save the changes\
    \ on your computer. Often, you must press F10.\n\n# Installing From a Floppy\n\
    \nIf your computer cannot start from the CD drive, you need to start from a floppy\
    \ disk:\n\n+   Check that the computer is set to boot from the floppy drive. See\
    \ “Preparing a CD or Floppy Installation,” page 45.\n\n+   Place the Install floppy\
    \ in the floppy drive.\n\n+   Place the Progeny Debian CD in the CD drive.\n\n\
    +   Restart your computer. The installation program begins.\n\n# Installing From\
    \ a Network\n\nA network install provides a single install source for multiple\
    \ machines. When doing a network install, you might want to create an auto-install\
