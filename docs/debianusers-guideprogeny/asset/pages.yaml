- pgno: 391
  md: '+   Internet with smarthost: A dedicated server delivers mail. This setting
    is often used when you are connecting to an Internet service provider.


    +   Satellite system: No mail is delivered locally. Mail is delivered only through
    the smarthost.


    +   Local only: E-mail can only be sent and received by users on the present machine.


    +   No configuration: No e-mail is configured.


    3 Enter the outgoing mail hostname. Consult your system administrator or ISP provider
    for the hostname needed.


    4 Enter the incoming mail hostname. Consult your system administrator or ISP provider
    for the hostname needed.


    5 Enter the SMTP relay host. Consult your system administrator or ISP provider
    for the hostname needed.


    6 Check the appropriate box if you want a world-writable mail drop.


    A world-writable mail drop allows users to receive mail directly, instead of only
    through your network''s mail system. It is faster, but can be a security risk.


    If in doubt, do not select world writable mail drop.


    7 Check the appropriate box if you want to use “procmail” for local mail delivery.


    Procmail lets you filter incoming messages and deliver them to folders other than
    your Inbox.


    You can use other tools to filter, so, if in doubt, do not use procmail.


    8 Configure the mail program you want to use.


    # Directing E-Mail Using procmail


    You can use procmail to arrange your e-mail so that messages from a sources go
    into a particular directory.'
  merge: -1
  img_proc: true
- pgno: 392
  md: "+   1 In the GNOME Control Center, select the box beside Use \"procmail\" for\
    \ local delivery on the System > Electronic Mail pane.\n\n+   2 Create a text\
    \ file called .procmailrc in your home directory. See “Lines in the .procmail\
    \ File,” page 391.\n\n+   3 If necessary, create the directory in which to filter\
    \ mail. This directory can be one created and used by another mailreader.\n\n\
    +   4 Create a sub-directory in your home directory called .procmail to hold procmail\
    \ files.\n\n+   5 Create filters. Place each filter in a file called rc.FILTER\
    \ in the .procmail directory. See “Filters for procmail,” page 392.\n\n+   6 Create\
    \ a file called .forward in your home directory. This file activates procmail\
    \ when new mail arrives.\n\nIn the .forward file, enter:\n\n```\n\"IFS='\\| '\
    \ exec /usr/bin/procmail -f || exit 75 #user\"\n```\n\n![](img/e36b94f8548b09d00212238f073b11d9_392_0.png)\n\
    \n> Note\n> \n> For examples of .procmail files and more ideas of what you can\
    \ do with them, see the sample files in the /usr/share/docs/procmail/examples\
    \ directory.\n\n# Lines in the .procmail File\n\n| Line | What It Does |\n| :---\
    \ | :--- |\n| PATH= /usr/bin | Defines the location of the utility. |\n| MAILDIR=DIRECTORY\
    \ | Defines the directory to which mail is sent. If this directory does not already\
    \ exist, be sure to create it. |"
  merge: -1
  img_proc: true
- pgno: 393
  md: '# Lines in the `.procmail` File


    | Line | What It Does |

    | :--- | :--- |

    | PMDIR=~/HOME/.procmail | Defines the directory in which procmail files are stored.
    |

    | LOGFILE=~/HOME/.procmail/log | Defines the procmail log file. |

    | DEFAULT=MAILDIRECTORY/DIRECTORY | Defines the default location for mail. This
    setting is overridden by any INCLUDEDRC line. |

    | INCLUDEDRC=~/HOME/.procmail/rc.FILTER | Defines a sender whose mail you want
    to filter. Include one line for each sender. |


    # Filters for procmail


    | Filter | What It Does |

    | :--- | :--- |

    | :0:\n^Sender: *KEYWORD\nDIRECTORY | Sends a message that contains the keyword
    to the specified directory. |'
  merge: -1
  img_proc: true
- pgno: 394
  md: "# ## Filters for procmail\n\n| Filter | What It Does |\n| :0:<br>^From: ADDRESS<br>DIRECTORY\
    \ | Sends a message from the e-mail address to the specified directory. |\n| :0:<br>^Subject:.*KEYWORD<br>DIRECTORY\
    \ | Sends a message whose subject contains the keyword to the specified directory.\
    \ |\n\n# ## Configuring the Graphical Display\n\nThe graphical display in Linux\
    \ is controlled by the X Window System. You can configure the basic settings for\
