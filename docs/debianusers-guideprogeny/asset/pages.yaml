- pgno: 139
  md: '# The File Manager


    ![](img/e36b94f8548b09d00212238f073b11d9_139_0.png)


    The default file manager is the GNOME Midnight Commander. You can start it by:


    +   Selecting Program > File Manager from the main menu.


    +   Selecting New Window from the pop-up menu that starts when you right-click
    on the desktop.


    +   Typing mc at a command line.


    +   Selecting the Home directory icon.


    # The Workspaces


    Using GNOME, you can create multiple or virtual desktops called workspaces. Each
    workspace can have columns or rows that help to position windows. See “Making
    the Desktop Your Own,” page 149.


    Multiple workspaces require more memory to run. However, they can be useful if:


    +   You have a small monitor.


    +   You want a different set of icons for different tasks.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '+   You work with many windows open, so that you have a hard time keeping track
    of them.


    +   You want to keep a window open for use, but do not want it always taking up
    room on your main workspace.


    If necessary, you can turn off multiple workspaces to save memory.


    To move between workspaces, do one of the following:


    +   Select a workspace on the pager.


    ![](img/e36b94f8548b09d00212238f073b11d9_140_0.png)


    or


    +   Middle-click on the current workspace and select another one.


    ![](img/e36b94f8548b09d00212238f073b11d9_140_1.png)


    From the Workspace sub-menu, you can:'
  merge: -1
