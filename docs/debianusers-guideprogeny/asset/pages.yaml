    # Configuring the Boot Loader


    Progeny Debian uses the Grand Unified Boot Manager (GRUB). The boot manager is
    a program that lets you choose which operating system to use when you start your
    computer.


    You can also use a boot manager to run different Linux kernels. In fact, if you
    recompile the kernel, you can guarantee that your system remains workable by making
    a copy of your kernel and adding an entry for the copy to the boot manager.


    # Understanding the GRUB Naming Conventions


    GRUB uses its own naming convention for hard drives and partitions. This convention
    is different from either the Linux or Windows conventions:


    +   * All numbering starts at 0, so that `(hd0)` is the first hard drive.

    +   * No distinction is made between IDE and SCSI devices. `(hd0)` could be either
    type of hard drive.

    +   * Primary and extended partitions are numbered from 0 to 3.

    +   * LogicalSee “Configuring a Network Connection From the Command Line,” page
    387 partitions are numbered from 4.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '+   All hard drive and partition numbers are enclosed in parentheses. For example:
    (hd0) is the first hard drive.


    +   The partition number follows the hard drive number, with a comma between them.
    For example, (hd1,2) is the third partition on the second hard drive.


    +   The root partition is the one that GRUB is installed on, not neccesarily the
    root partition for Linux.


    GRUB files are in /boot/grub. You can edit the boot manager in three ways:


    +   By opening the GRUB shell with /sbin/grub.


    +   By highlighting an item in the menu as your computer starts and pressing the
    E key. This method is useful only for editing existing entries.


    +   By opening /boot/grub/menu.lst in a text editor. This method is the easiest,
    and is the one covered here.


    You can find complete information about GRUB by typing info grub at a command
    line.


    # ## Editing the Boot Manager Configuration File


    The configuration file for the boot manager is /boot/grub/menu.lst.


    menu.lst is divided into groups of options, or stanzas. The first stanza contains
    global settings for GRUB. Each of the other stanzas contains the settings for
    one operating system or kernel.


    Unless the default option is used in the global stanza, the default operating
    system is the first one after the global stanza.


    Options are generally placed one per line, but this convention is not necessary.
    It exists only to make the file easier to read.'
  merge: -1
  img_proc: true
