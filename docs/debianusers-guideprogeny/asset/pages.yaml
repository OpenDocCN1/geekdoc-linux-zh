- pgno: 242
  md: '# # 10

    ## Reading System Information


    Linux is built by users who have a hands-on approach to computing. As a result,
    your system includes many command line tools for displaying infor-mation.


    You can view information about:


    +   - ▼ The operating system and hardware.

    +   - ▼ Processes running on the system.

    +   - ▼ Memory being used and memory available.

    +   - ▼ Users.


    You can gather information by:


    +   - ▼ Using command line tools.

    +   - ▼ Viewing files in the /proc directory.

    +   - ▼ Reading log files.


    Graphical tools have been made for some of the command line tools, but they are
    generally less complete and flexible than the command line tools.


    # ## Reading System Information From the Desktop


    Progeny Debian installs with two basic desktop tools:


    +   - ▼ System Info: Basic information about your system.

    +   - ▼ gtop: Processes, memory and filesystems.

    +   - ▼ gw: Information about users'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'In addition, the Applets menu includes several useful monitors that display
    graphs of how the system is being used.


    # Using the System Information Tool


    The System Info tool is the graphical equivalent of the uname -a and w commands.


    +   1. From the main menu, select Applications > System > System Info. The System
    Info window opens.


    ![](img/e36b94f8548b09d00212238f073b11d9_243_0.png)


    +   2. If you want to save the information select either:


    +   Save Information to File.


    +   Email Information.


    A dialogue box opens for you to select or enter a file name or e-mail address.


    +   3. Select either a file or e-mail address.'
  merge: -1
  img_proc: true
