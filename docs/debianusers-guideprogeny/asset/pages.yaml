- pgno: 336
  md: '# Using the at Utilities


    The at command can be controlled by two utilities:


    +   - atrm: Deletes tasks. Type: atrm job.

    +   - atq: Lists tasks for the current user, or all jobs if used by the root user.
    Type: atq.


    # Compressing and Archiving Files From the Command Line


    Compressing and archiving files are useful for making backups and e-mail attachments.


    Compression reduces the size of files and places them in a single file. Archiving
    creates a single file in which to store multiple files.


    In both cases, the individual files cannot be accessed by file managers or normal
    commands for manipulating files. Instead, you must use special tools designed
    for the utility that you used for compression.


    The processes of decompressing and unarchiving are both referred to as extracting.
    You can use special commands for extracting, or options in the same tools that
    you use for compressing or archiving.


    Archived files are called tar files, tarred files, or tarballs.


    Linux includes several tools for compressing and archiving:


    +   - tar: mainly an archive tool, but also compresses files. Many long time users
    prefer tar to the alternatives.

    +   - gzip: a compression tool. Sometimes, gzip can decompress a zip file from
    another operating system, but do not confuse the two formats or expect them to
    be always interchangeable.

    +   - bzip2: another compression tool. The bzip2 tool is capable of greater compression
    than gzip, and includes a recovery tool, but less widely used.


    In addition, Linux includes tools for viewing, searching, and comparing files
    compressed using gzip.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Archiving and Compressing From the Desktop


    By default, Progeny Debian installs the guitAR program in the main menu. Despite
    the name, guitAR uses the tar, gzip, and gzip2 utilities, as well as several others.


    +   1. From the main menu, select Programs > Utilities > guitAR. The guitAR window
    opens.


    ![](img/e36b94f8548b09d00212238f073b11d9_337_0.png)


    +   2. Select a task from the tool bar:


    +   - New: Create a new archive. You can select:

    +     - The tool to use.

    +     - The level of compression.

    +     - The files to add to the archive.

    +   - Open: Open an existing archive.

    +   - Close: Close the display of an existing archive.

    +   - Add: Add files to an existing archive. You can select the archive from a
    file manager.

    +   - View: Browse an existing archive.

    +   - Extract: Choose an archive, and the files to extract from it.

    +   - Delete: Choose an archive, and the files to delete from it.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# # Archiving and Compressing Using the tar Command


    The **tar** command can compress as well as archive files. Its **-z** option is
    equivalent to using the **gzip** command.


    An archive file has a **.tar** extension. An archive file that is also compressed
    has a **.tgz** extension. At times, an archived and compressed file will have
    a **tar.gz** extension


    The **tar** command is some times used for back ups. However, **cpio** is often
    used instead, because it offers more control over back ups. See “Checking or Repairing
    a File System,” page **344**.


    Type: **tar OPTIONS ARCHIVE FILES**.


    The archive is the **tar** file to create or extract from. If it does not exist,
    it is created by the command.


    Separate each file name by a space.


