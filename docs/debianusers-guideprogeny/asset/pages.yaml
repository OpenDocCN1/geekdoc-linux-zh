- pgno: 398
  md: '# # Configuring a Monitor From the Desktop


    ![](img/e36b94f8548b09d00212238f073b11d9_398_0.png)


    Information about your monitor is automatically detected. However, you can change
    these settings if necessary.


    **Warning**


    Choosing settings that are not supported by your monitor could damage it or the
    video card. Consult the monitor documentation for the correct settings.


    +   1.  Select **Systems** > **X Configuration** from the GNOME Control Center.


    **Note**


    If you are using the KDE desktop, type `/usr/bin/xserver-configure-lapplet` at
    a command line.


    +   2.  From the *X Configuration* pane, select the Monitor tab.'
  merge: -1
  img_proc: true
- pgno: 399
  md: "+   3   Select a name for your monitor setting. You can find this name after\
    \ the install in the XFree86Config file.\n\n+   4   Select the Simple, Medium,\
    \ or Expert button to choose the means of configuring your monitor:\n\n+   ▶ \
    \  Simple: Select the monitor size from the drop-down list. Then select the ok\
    \ button.\n\n+   ▶   Medium: Select the resolution that you want to use from the\
    \ drop down list. Then select the ok button.\n\n+   Your choice should not exceed\
    \ the highest resolution supported by both your monitor and your video card.\n\
    \n+   ▶   Expert: Enter the Horizontal Sync Range and Vertical Refresh Rate for\
    \ your monitor.\n\n+   If you do not know these statistics, 30-130 for the Horizontal\
    \ Sync and 60-160 for the Vertical Refresh should work for most monitors.\n\n\
    > ❖   Note\n> \n> Simple and Medium modes or the suggested Horizontal Sync Range\
    \ and Vertical Refresh Rate may not always give the best settings for your monitor.\n\
    > \n> If necessary, you can change the settings after the install.\n\n+   5  \
    \ Select the ok button.\n\n+   6   Restart the desktop or reboot the computer\
    \ for the changes to take effect.\n\n# Configuring a Monitor Profile Manually\n\
    \nYou can configure your monitor in the Monitor section of `/etc/X11/XF86Config-4`.\n\
    \nEntries are in two columns, with the option in the first column and the setting\
    \ in the second column."
  merge: -1
  img_proc: true
- pgno: 400
  md: 'The first three entries should always be the Identifier, Horizsync, and VertRefresh.


    For a complete list of settings, see the man page for the XF86Config.


    > Warning Never edit a monitor profile without consulting the monitor''s documentation.
    Settings that are too high for the monitor can damage it or prevent it from working.


    # ## Monitor Settings


    | Setting | Comments |

    | :--- | :--- |

    | Identifier | The name for this monitor profile. |

    | HorizSync | The horizontal scanning frequency. Usually, this is a range. 30-130
    should work for most monitors. |

    | VertRefresh | The vertical scanning frequency. Usually, this is a range. 60-160
    should work for most monitors |

    | Gamma | Set the gamma correction for the monitor. In order, settings are listed
    for red, green and blue, using RGB values. |'
  merge: -1
  img_proc: true
