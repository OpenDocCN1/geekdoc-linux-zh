- pgno: 203
  md: '# 13.2.5 Directory-related Tags


    A number of tags are used to specify directories and paths that are used in various
    phases of RPM''s build and install processes. There''s not much more to say collectively
    about these tags, so let''s dive right in and look them over.


    # The prefix Tag


    The prefix tag is used when a relocatable package is to be built. A relocatable
    package can be installed normally or can be installed in a user-specified directory,
    by using RPM''s --prefix install-time. The data specified after the prefix tag
    should be the part of the package''s path that may be changed during installation.
    For example, if the following prefix line was included in a spec file:


    ```

    Prefix: /opt

    ```


    and the following file was specified in the spec file''s %files list:


    ```

    /opt/blather/foonly

    ```


    then the file would be installed in /opt/blather if the package was installed
    normally. It would be installed in /usr/local/blather if the package was installed
    with the --prefix /usr/local option.


    For more information about creating relocatable packages, see chapter 15.


    # The buildroot Tag


    The buildroot tag is used to define an alternate build root. The name is a bit
    misleading, as the build root is actually used when the software is installed
    during the build process. For a build root to be defined and accurately used,
    a number of issues must be taken into account. These issues are covered in chapter
    16. This is what a buildroot tag would look like:


    ```

    Buildroot: /tmp/cdplayer

    ```


    The buildroot tag can be overridden at build-time using the --buildroot command-line
    option.


    # 13.2.6 Source and Patch Tags


    To build and package software, RPM needs to know where to find the original sources.
    But it''s not quite that simple. There might be more than one set of sources that
    need to be part of a particular build. In some cases, it might be necessary to
    prevent some sources from being packaged.


    And then there is the matter of patches. It''s likely that changes will need to
    be made to the sources, so it''s necessary to specify a patch file. But the same
    issues that apply to source specifications are also applicable to patches. There
    may be more than one set of'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 13.2 Tags: Data Definitions


    required.


    The tags that follow are crucial to RPM, so it pays to have a firm grasp of how
    they are used.


    # The source Tag


    The source tag is central to nearly every spec file. Although it has only one
    piece of data associated with it, it actually performs two functions:


    +   1. It shows where the software''s developer has made the original sources
    available.


    +   2. It gives RPM the name of the original source file.


    While there is no hard and fast rule, for the first function, it''s generally
    considered best to put this information in the form of a Uniform Resource Locator
    (URL). The URL should point directly to the source file itself. This is due to
    the source tag''s second function.


    As mentioned above, the source tag also needs to direct RPM to the source file
    on the build system. How does it do this? There''s only one requirement, and it
    is ironclad: The source filename must be at the end of the line as the final element
    in a path. Here''s an example:


    ```

    Source: ftp://ftp.gnomision.com/pub/cdplayer-1.0.tgz

    ```


    Given this source line, RPM will search its SOURCES directory for cdplayer-1.0.tgz.
    Everything prior to the filename is ignored by RPM. It''s there strictly for any
    interested humans.


    A spec file may contain more than one source tag. This is necessary for those
    cases where the software being packaged contains more than one source file. However,
    the source tags must be uniquely identified. This is done by appending a number
    to the end of the tag itself. In fact, RPM does this internally for the first
    source tag in a spec file, in essence turning into source0. Therefore, if a package
    contains two source files, they may either


    ```

    Source: blather-4.5.tar.gz

    Source1: bother-1.2.tar.gz

    ```


    or as:


    ```

    source0: blather-4.5.tar.gz

    Source1: bother-1.2.tar.gz

    ```


    Either approach may be used. The choice is yours.


    # The nosource Tag


    The nosource tag is used to direct RPM to omit one or more source files from the
    source package. Why would someone want to go through the trouble of specifying
    a source file, only to'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'exclude it? The reasons for this can be varied, but let''s look at one example:
    the software known as Pretty Good Privacy, or PGP.


    PGP contains encryption routines of high quality that the United States government
    restrict their export. While it would be nice to create a PGP package file, the
    resulting package could not legally be transferred between the U.S. and other
    countries, or vice-versa.


    However, what if all files other than the original source, were packaged using
    RPM? Well, a binary package made without PGP would be of little use, but what
    about the source package? It would contain the spec file, maybe some patches,
    and perhaps an icon file. Since the controversial PGP software was not a part
    of the source package, this sanitized source package could be downloaded legally
    in any country. The person who downloaded a copy could then go about obtaining
    the PGP sources themselves, place them in RPM''s SOURCES directory, and create
    a binary package. They wouldn''t even need to change the nosource tag. One rpm
    -ba command later, and the user would have a perfectly usable PGP binary file.


    Since there be more than one source tag in a spec file, the format of the nosource
    tag is as follows:


    ```

    nosource: <src-num>, <src-num>...<src-num>

    ```


    The <src-num> represents the number following the source tag. If there is more
    than one number in the list, they may be separated by either commas or spaces.
    For example, consider a package containing the following source tags:


    ```

    source: blather-4.5.tar.gz

    Source1: bother-1.2.tar.gz

    source2: blather-lib-4.5.tar.gz

    source3: bother-lib-1.2.tar.gz

    ```


    If the source files for blather and bother-lib were not to be included in the
    package, the following nosource line could be added:


    ```

    NoSource: 0, 3

    ```


    What about that 0? Keep in mind that the first unnumbered source tag in a spec
    file is automatically numbered 0 by RPM.


    # The Patch Tag


    The patch tag is used to identify which patches are associated with the software
    being packaged. The patch files are kept in RPM''s SOURCES directory, so only
    the name of the patch file should be specified. Here is an example:


    ```

    Patch: cdp-0.33-fsstnd.patch

    ```


    > There is also an "international" version that may be used in non-US countries.
    See Appendix G on page 427.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 13.2 Tags: Data Definitions


    There are no hard and fast requirements for naming the patch files, but traditionally
    the filename starts with the software name and version, separated by dashes. The
    next part of the patch file name includes one or more words indicating the reason
    for the patch. In our example, the patch file contains changes necessary to bring
    the software into compliance with the Linux File System, hence the fastnd incantation.


    RPM processes patch the same way it does source tags. Therefore, it''s acceptable
    to use a Uniform Resource Locator (URL) on a patch line, too.


    A spec file may contain more than one patch tag. This is necessary for cases where
    the software being packaged requires more than one patch. However, the patch tags
    must be uniquely identified. This is by adding a number to the end of the tag.
    In fact, RPM does this internally for the first patch tag in a spec file, essence
    turning it into patch0. Therefore, if a package contains three patches, the following
    two methods of specifying are equivalent:


    ```

    Patch: blather-4.5-bugfix.patch

    Patch1: blather-4.5-config.patch

    Patch2: blather-4.5-somethingelse.patch

    ```


    This is the same as:


    ```

    Patch0: blather-4.5-bugfix.patch

    Patch1: blather-4.5-config.patch

    Patch2: blather-4.5-somethingelse.patch

    ```


    Either approach may be used, but the second method looks nicer.


    # The noopatch Tag


    The noopatch tag is similar to the nosource tag discussed earlier. Just like the
    nosource tag, the noopatch tag is used to direct RPM to omit something from the
    source package. In the case of nosource, that "something" was one or more sources.
    For the noopatch tag, the "something" is one or more patches.


    Since each tag in a spec file must be numbered, the noopatch tag uses those numbers
    to specify which patches are not to be included in the package. The noopatch tag
    is used in this manner:


    ```

    NoPatch: 2 3

    ```


    In this example, the source files specified on the source2 and source3 lines are
    not to be included in the build.


    This concludes our study of RPM''s tags. In the next section, we will look at
    the various scripts RPM uses to build, as well as to install, and erase, packages.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 13.3 Scripts: RPM''s Workhorse


    The scripts that RPM uses to control the build process are among the most varied
    and interesting parts of the spec file. Many spec files also contain scripts that
    perform a variety of tasks whenever the package is installed or erased.


    The start of each script is denoted by a keyword. For example, the %build keyword
    marks the start of the script RPM will execute when building the software to be
    packaged. It should be noted that, in the strictest sense of the word, these parts
    of the spec file are not scripts. For example, they do not start with the traditional
    invocation of a shell. However, the contents of each script section are copied
    into a file and executed by RPM as a full-fledged script. This is part of the
    power of RPM: Anything that can be done in a script can be done by RPM.


    Let''s by looking at the scripts used during the build process.


    # 13.3.1 Build-time Scripts


    The scripts that RPM uses during the building of a package follow the steps known
    to every software developer:


    +   - Unpacking the sources.

    - Building the sources.

    - Installing the sources.

    - Cleaning up.


    Although each of the scripts perform a specific function in the build process,
    they share a common environment. Using RPM''s --test option2, we can see the common
    portion of each script. In this example, we''ve taken the cdplayer package, issued
    an rpm-ba --test directory. This section (with the appropriate package-specific
    values) is present in every script RPM executes during a build:


    ```

    #!/bin/sh -e

    # Script generated by rpm


    RPM_SOURCE_DIR="/usr/src/redhat/SOURCES"

    RPM_BUILD_DIR="/usr/src/redhat/BUILD"

    RPM_DOC_DIR="/usr/doc"

    RPM_OPT_FLAGS="-02 -m486 -fno-strength-reduce"

    RPM_ARCH="i386"

    RPM_OS="Linux"

    RPM_ROOT_DIR="/tmp/cdplayer"

    ```


    > 2Described in section 12.1.11 on page 154.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 13.3 Scripts: RPM''s Workhorse


    ```

    RPM_BUILD_ROOT="/tmp/cdplayer"

    RPM_PACKAGE_NAME="cdplayer"

    RPM_PACKAGE_VERSION="1.0"

    RPM_PACKAGE_RELEASE="1"

    set -x

    ```


    umask 022


    As we see, the script starts with the usual invocation of a shell (in this case,
    the Bourne shell). There are no arguments passed to the script. Next, a number
    of environment variables are set. Here''s a brief description of each one:


    +   - RPM_SOURCE_DIR — This environment variable gets its value from the rpmrc
    file entry sourcedir, which in turn can get part of its value from the topdir.
    It is the path RPM will prepend to the file, specified in the source tag.

    - RPM_BUILD_DIR — This variable is based on the builddir rpmrc file entry, which
    in turn can get part of its value from the topdir. This environment variable translates
    to the path of RPM''s build directory, where most software will be unpacked and
    built.

    - RPM_DOC_DIR — The value of this variable is based on the defaultdocdir rpmrc
    file. Files marked with the %doc directive can be installed in a subdirectory
    of defaultdocdir. For more information on the %doc directive, refer to section
    13.6.1 on page 199.

    - RPM_DPT_FLAGS — This environment variable gets its value from the optflags rpmrc
    file entry. It contains options that can be passed to the build procedures of
    the software being packaged. Normally this means either a configuration script
    or the make command itself.

    - RPM_ARCH — As one might infer from the example above, this environment variable
    contains a string describing the build system''s architecture.

    - RPM_OS — This contains the name of the build system''s operating system.

    - RPM_BUILD_ROOT — This environment variable is used to hold the "build root",
    into which the newly built software will be installed. If no explicit root has
    been specified (either by command line option, spec tag line, or rpmrc file entry),
    this variable will be null.

    - RPM_PACKAGE_NAME — This environment variable gets its value from the name tag
    line in the package''s spec file. It contains the name of the software being packaged.

    - RPM_PACKAGE_VERSION — The version tag is the source of this variable''s translation.
    Predictably, this environment variable contains the software''s version number.

    - RPM_PACKAGE_RELEASE — This environment variable contains the package''s release.
    Its value is obtained from the release tag line in the spec file.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# 182 Inside the Spec File


    All of these environment variables are set for your use, to make it easier to
    write scripts that will do the right thing even if the build environment changes.


    The script also sets an option that causes the shell to print out each command,
    complete with expanded arguments. Finally, the default permissions are set. Past
    this point, the scripts differ. Let''s look at the scripts in the order they are
    executed.


    # The %prep Script


    The %prep script is the first script RPM executes during a build. Prior to the
    %prep script, RPM has performed preliminary consistency checks, such as whether
    the spec file''s source tag points to files that actually exist. Just prior to
    passing control over to the %prep script''s contents, RPM changes into into RPM''s
    area, which, by default, is /usr/src/redhat/BUILD.


    At that point, it is the responsibility of the %prep script to:


    +   - Create the top-level build directory.

    - Unpack the original sources into the build directory.

    - Apply patches to the sources, if necessary.

    - Perform any other actions required to get the sources in a ready-to-build state.


    The first three items on this list are common to the vast majority of all software
    being packed. Because of this, RPM has two macros that greatly simplify these
    routine functions. More information on RPM''s %setup and %patch macros can be
    found in section 13.4 on page 186.


    The last item on the list can include creating directories or anything else required
    to get the sources in a ready-to-build state. As a result, a %prep script can
    range from one line invoking a single %setup macro, to many lines of tricky shell
    programming.


    # The %build Script


    The %build script picks up where the %prep script left off. Usually the %prep
    script has gotten everything right for the build, the %build script is usually
    somewhat anticlimactic — normally invoking make, maybe be a configuration script,
    and little else.


    Like %prep before, the %build script has the same assortment of environment variables
    to draw on. Also, like %prep, %build changes directory into the software''s top-level
    build directory (located in RPM.BUILD_DIR, or usually called <name>-<version>).


    Unlike %prep, there are no macros available for use The reason is simple: Either
    the commands required to build the software are simple (such as a single make
    command), or they are so unique that a macro wouldn''t make it easier to write
    the script.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# 13.3 Scripts: RPM''s Workhorse


    # The %install Script


    The environment in which the %install script executes is identical to the other
    scripts. Like the other scripts, the %install script''s working directory is set
    to the software''s top-level directory.


    As the name implies, it is this script''s responsibility to whatever is necessary
    to actually install the newly built software. In most cases, this means a single
    make install command, or a few commands to copy files and create directories.


    # The %clean Script


    The %clean script, as the name implies, is used to clean up the software''s build
    directory. RPM normally does this for you, but in certain cases (most notably
    in those packages that use a build root) you''ll need to include a %clean script.


    As usual, the %clean script has the same set of environment variables as the other
    scripts you''ve covered. Since a %clean script is normally used when the package
    is built in a build root, the RPM_BUILD_ROOT environment variable is particularly
    useful. In many cases, a simple


    ```

    rm -rf $RPM_BUILD_ROOT

    ```


    will suffice.


    # 13.3.2 Install/Erase-time Scripts


    The other type of scripts that are present in the spec file are those that are
    only used when the package is installed or erased. There are four scripts, each
    meant to be executed at different times during the life of a package:


    +   * Before installation.

    "* After installation.

    "* Before erasure.

    "* After erasure."


    Unlike the build-time scripts, there is little in the way of environment variables
    for these scripts. The only environment variable available is RPM_INSTALL_PREFIX,
    and that is only set if the package uses an install prefix.


    Unlike the build-time scripts, there is an argument defined. The sole argument
    to this is a number representing the number of instances of the package currently
    installed


    > Keep this command in a %clean script can wreak havoc if used with a build root
    of, say, Section 12.1.1.13 on page 158 discusses this in more detail.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'on the system, after the current package has been installed or erased. Sound
    tricky? It really isn''t. Here''s an example:


    Assume a package, called blather-1.0, is being installed. No previous versions
    of blather have been installed. Since the software is being installed, only the
    %pre and %post scripts are executed. The argument passed to these scripts will
    be 1, the number of blather packages installed is 1.4


    Continuing our example, a new version of the blather package, version 1.3, is
    now available. Clearly it''s time to upgrade. What will the scripts'' values be
    during the upgrade? blather-1.3 is being installed, its %pre and %post scripts
    will have an argument equal to 2 (for version 1.0 already installed, plus 1 for
    version 1.3 being installed). As the final part of the upgrade, it''s time to
    erase blather version 1.0. As the package is being removed, its %pre and %post
    scripts are executed. Since there will be only one blather package (version 1.3)
    installed after version 1.0 is erased, the argument passed to version 1.0''s scripts
    is 1.


    To bring to end this example, we''ve decided to erase blather1.3. We just don''t
    need it anymore. As the package is being erased, the %pre and %post scripts will
    be executed. Since there will be no blather packages installed once the erase
    completes, the argument passed to the scripts is 0.


    With all that said, what possible use would this argument be? Well, here are two
    interesting properties:


    +   1. When the first version of a package is installed, the %pre and %post scripts
    will be passed an argument equal to 1.


    +   2. When the last version of a package is erased, the %pre and %post scripts
    will be passed an argument equal to 0.


    Based on these properties, it''s trivial to write an install-time script that
    can take certain actions in specific circumstances. Usually, the argument is used
    in the %pre or %post scripts to perform a special task when the last instance
    of a package is being erased.


    What is normally done during these scripts? The exact tasks may vary, but in general,
    the tasks are any need to be performed at these points in the package''s existence.
    One very common task is to run ldconfig when shared libraries are installed or
    removed. But that''s not the only use for these scripts. It''s even possible to
    use the scripts to perform tests to ensure the package install/erase procedure
    correct.


    Since each of these scripts will be executing on whatever system installs the
    package, it''s necessary to choose the script''s choice of tools carefully. Unless
    you''re sure a given program is going to be available on all the systems that
    could possibly install your package, you should not use it in these scripts.


    > Or it will be 1, once the package is completely installed. Remember, the number
    is based on the number of packages installed after the current package''s install
    or erase completes.'
