- pgno: 253
  md: '# 15.4.2 Test-Driving a Relocatable Package


    Looks like cdplayer is a poor candidate for being made relocatable. However, since
    we did get a hamstring version to build successfully, we can use it to show how
    to test a relocatable package.


    First, let''s see if the binary package file''s prefix has been recorded properly.
    We can do this by using the --queryformat option in RPM''s query:


    ```

    # rpm -qp --queryformat ''%{DEFAULTPREFIX}\n'' cdplayer-1.0-1.i386.rpm

    /usr/local

    #

    ```


    The DEFAULTPREFIX tags RPM to display the prefix used during the build. As we
    can see, it''s /usr/local, just as intended. The --queryformat option is discussed
    in chapter 5, specifically in section 5.2.2 on page 67.


    So it looks like we relocatable package. Let''s try a couple of installs and see
    if we really can install it in different locations. First, let''s try a regular
    install with no prefix specified:


    ```

    # rpm -Uvh cdplayer-1.0-1.i386.rpm

    cdplayer ###########################

    #

    ```


    That seemed to work well enough. Let''s see if the files went where we intended:


    ```

    # ls -al /usr/local/bin

    total 558

    -drwxrxr-x 1 root 40739 Oct 7 13:23 cdp

    -lrwxrwxr-x 1 root 18 Oct 7 13:40 cdplayer -> /usr/local/bin/cdp*

    ```


    ```

    # ls -al /usr/local/man/man1

    total 9

    -rwxr-xr-x 1 root 4550 Oct 7 13:23 cdp.1*

    ...

    #

    ```


    Looks good. Let''s erase the package and reinstall it with a different prefix:


    ```

    # rpm -e cdplayer

    # rpm -Uvh --prefix /usr/foonly/blather cdplayer-1.0-1.i386.rpm

    cdplayer ###########################

    #

    ```'
  merge: -1
