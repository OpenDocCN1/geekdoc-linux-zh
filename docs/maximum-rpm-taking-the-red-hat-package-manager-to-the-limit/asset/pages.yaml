- pgno: 335
  md: '# Creating Uninstall Scripts


    Where there are install scripts, there are uninstall scripts. While there is no
    ironclad rule to that effect, it is a good practice. Following this practice,
    we have an uninstall script for the client package, and one for the server. Let''s
    take the client first:


    ```

    %postun client


    # First, see if we''re the last amanda-client package on the system...

    # If not, then we don''t need to do this stuff...


    if [ "$1" -eq 0 ];

    then

    ```


    As before, we start out with a declaration of the type of script this is, and
    which subpackage it is for. Following that we have an if statement similar to
    the one we used in the install scripts, save one difference. Here, we''re comparing
    the argument against zero. The reason is that we are trying to see if there be
    zero instances of this package after the uninstall is complete. If this is the
    case, the remainder of the script needs to be run, since there are no other amanda
    client packages left.


    Next, we remove bin from the disk group:


    +   # First, get rid of bin from the disk group...


    ```

    if grep "disk::*bin" /etc/group > /dev/null

    then


    # Nuke bin at the end of the line...

    sed -e ''s/\(disk::[0-9]\]{1,\}:\{1,\}:,bin$/$\1/'' /etc/group

    >/etc/group.tmp


    # Nuke bin on the line by itself...

    sed -e ''s/\(disk::[0-9]\]{1,\}:\\)bin$/$\1/'''' /etc/group.tmp

    >/etc/group1.tmp


    # Nuke bin in the middle of the line...

    sed -e ''s/\(disk::[0-9]\]{1,\}:\{1,\}:,bin,\(\{1,\}:\{1,\})*/$\1\2/''

    >/etc/group1.tmp > /etc/group2.tmp


    # Nuke bin at the start of the line...

    sed -e ''s/\(disk::[0-9]\]{1,\}:\{1,\}:bin,\{1,\}:\{1,\})*/$\1/''

    etc/group2.tmp > /etc/group


    # Clean up after ourselves...

    rm -f /etc/group.tmp /etc/group1.tmp /etc/group2.tmp

    ```'
  merge: -1
  img_proc: true
- pgno: 336
  md: "# 20.4 Package Building\n\nNo surprises there. Continuing our uninstall, we\
    \ start on the network-related tasks:\n\n```\n# Next, lose the amanda line in\
    \ /etc/services...\n# We only want to do this if the server package isn’t installed\n\
    # Look for /usr/sbin/amdump, and leave it if there...\n```\n\n```\nif [ -f /usr/sbin/amdump\
    \ ];\nthen\n  if grep \"amanda\" /etc/services > /dev/null\n  then\n    grep -v\
    \ \"amanda\" /etc/services > /etc/services.tmp\n    mv -f /etc/services.tmp /etc/services\n\
    \  fi\n```\n\nThat’s odd. Why are we looking for a file from the server package?\
    \ If you look back at the install scripts for the client and server packages,\
    \ you’ll find the one they have in common is that both the client and the server\
    \ require the same entry in /etc/services.\nIf amanda server is going to back\
    \ itself up, it also needs the amanda client software. Therefore, both subpackages\
    \ need to add an entry to /etc/services. But what if one of the packages is removed?\
    \ Perhaps the server is being demoted to a client, or maybe the server is no longer\
    \ going to be backed up by amanda. So, in the case of the client, we look for\
    \ a file from the server subpackage, and if the entry in /etc/services must stay.\
    \ If it’s there, we leave the entry alone.\n\nGranted, this is a somewhat easy\
    \ way to see if a certain package is installed. Some of you are probably saying,\
    \ “Why can’t RPM be used? Just do an rpm -q amanda-server, and decide what to\
    \ do based on that.” And that would be the best way to do it, except for one point:\n\
    \nOnly one invocation of RPM can run at any given time.\nSince RPM is running\
    \ to perform the uninstall, if the uninstall-script were to attempt to run RPM\
    \ again, it would fail. The reason it would fail is because only one copy of RPM\
    \ can access the database at a time. So we are stuck with our unsightly friend.\n\
    Continuing the network-related uninstall tasks:\n\n```\n# Finally, the amanda\
    \ entry in /etc/inetd.conf\n```\n\n```\nif grep \"amanda\" /etc/inetd.conf > /dev/null\n\
    then\n  grep -v \"amanda\" /etc/inetd.conf > /etc/inetd.conf\n  mv -f /etc/inetd.conf\
    \ /etc/inetd.conf\n```\n\n```\n# Kick inetd\n```\n\n```\nif [ -f /var/run/inetd.pid\
    \ ];\n```"
