- pgno: 354
  md: "# 21.2 rpmlib Functions\n\n# 21.2.9 Package And File Verification\n\nThe functions\
    \ in this section perform the verification operations necessary to ensure that\
    \ the files comprising a package have not been modified since they were installed.\n\
    Verification takes place on three distinct levels:\n\n+   1. On the file-by-file\
    \ level.\n2. On a package-by-wide level, through the use of the %veriscript verification\
    \ script.\n3. On an inter-package level, through RPM's normal dependency processing.\n\
    \nBecause of this, there are two functions to perform each specific verification\
    \ operation.\n\n# Verify File — rpmVerifyFile()\n\n```\n#include <rpm/rpmlib.h>\n\
    #include <rpm/header.h>\n\nint rpmVerifyFile(char * root,\n    Header h,\n   \
    \ int filenum,\n    int * result);\n```\n\nThis function verifies the file'th\
    \ from the package whose header is h. If root is specified, it is used as the\
    \ path to a directory that will serve as the root directory while the file is\
    \ being verified. The results of the file verification are returned in result,\
    \ and consist of a number of flags. Each flag that indicates a verification failure.\n\
    \nThe flags are defined in rpmlib.h, and are of form RPMVERIFY_xxx, where xxx\
    \ is the name of the data that failed verification.\n\nThis function returns 0\
    \ on success, and 1 failure.\n\n# Execute Package's %veriscript Verification Script\
    \ — rpmVerifyScript()\n\n```\n#include <rpm/rpmlib.h>\n#include <rpm/header.h>\n\
    \nint rpmVerifyScript(char * root,\n    Header h,\n    int err);\n```\n\nThis\
    \ function executes the %veriscript verification script for the package whose\
    \ header is h. err must contain a valid file descriptor. If rpmIsVerbose() returns\
    \ true, the %veriscript verification script will direct all status messages to\
    \ err.\nThis function returns 0 on success, and 1 failure."
  merge: -1
  img_proc: true
- pgno: 355
  md: '# 21.2.10 Dependency-Related Operations


    The functions in this section are used to perform the various dependency-related
    operations supported by rpmplib.


    Dependency processing is entirely separate from normal package-based operations.
    The package installation and removal functions do not perform any dependency processing
    themselves. Therefore, dependency processing is somewhat different from other
    aspects of rpmplib''s operation.


    Dependency processing centers around the rpmDependencies data structure. The operations
    that are to be performed against the RPM database (adding, removing, and upgrading
    packages) are performed against this data structure, using functions that are
    described below. These functions simply populate the data structure according
    to the operation being performed. They do *not* perform the actual operation on
    the package. This is an important point to keep in mind.


    Once the data structure has been completely populated, a dependency check function
    is called to determine if there are any dependency-related problems. The result
    is a structure of dependency conflicts. rpmDependencyConflict is defined in rpmplib.h.


    Note that it is necessary to free both the conflicts structure and the rpmDependencies
    structure when they are no longer needed. However, free() should not be used special
