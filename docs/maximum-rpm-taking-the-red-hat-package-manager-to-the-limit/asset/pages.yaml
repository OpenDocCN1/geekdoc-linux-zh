- pgno: 233
  md: 'For example, what should be done if a package will build under multiple architectures
    requires slightly different build scripts? Or if a package requires a certain
    set of files under one operating system, and an entirely different set under another
    operating system? The architecture and operating system-specific tags we''ve discussed
    earlier in the chapter do nothing to help in such situations. What can be done?


    One approach would be to create different spec files for each architecture or
    operating system. While it would certainly work, this approach has some problems:


    +   - More work. The existence of multiple spec files for a given package means
    that the effort required to make any changes to the package is multiplied by however
    many different spec files there are.

    - More chance for mistakes. If any work needs to be done to the spec files, the
    fact they are separate means it is much easier to forget to make the necessary
    changes to each one. There is also the chance of introducing mistakes each time
    changes are.


    The other approach is to somewhat prevent the conditional inclusion of architecture-
    or operating system-specific sections of the spec file. Fortunately, the RPM designers
    chose this approach, and it makes multi-platform package building easier and less
    prone to mistakes. We discuss multi-platform package building in depth in chapter
    19. For now, let''s take a quick look at RPM''s conditionals.


    # ## ifmarch Conditional


    The ifmarch conditional is used to begin a section of the spec file that is architecture-specific.
    It is followed by one or more architecture specifiers, each separated by commas
    or whitespace. Here is an example:


    ```

    %ifmarch i386 sparc

    ```


    The contents of the spec file following this line would be processed only by Intel
    x86 or Sun SPARC-based systems. However, if only this line were placed in a spec
    file, this would happen if a build was attempted:


    ```

    # rpm -ba cdplayer-1.0.spec

    Unclosed %if

    Build failed.

    #

    ```


    The problem that surfaced here is that any conditional must be "closed" by using
    either %else or %endif. We''ll be covering them a bit later in the chapter.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# 13.8 Conditionals 207


    # The %ifnarch Conditional


    The %ifnarch conditional is used in a similar fashion to %ifarch, except that
    the logic is reversed. If a spec file contains a conditional block starting with
    %ifnarch alpha, that block would be processed only if the build was done on a
    Digital Alpha/AXP-based system. However, if the conditional block started with
    %ifnarch alpha, then that block would be processed only if the build were not
    being done on an Alpha.


    Like %ifarch, %ifnarch can be followed by one or more architectures and must be
    closed by a %else or %endif.


    # The %ifos Conditional


    The %ifos conditional is used to control RPM''s spec file processing based on
    the build''s operating system. It is followed by one or more operating system
    names. A conditional block started with %ifos must be closed by a %else or %endif.
    Here''s an example:


    %ifos linux


    The contents of the spec file following this line would be processed only if the
    build was done on a linux system.


    # The %ifnos Conditional


    The %ifnos conditional is the logical complement to %ifos: that is, if a conditional
    starting with the line %ifnos irix is present in a spec file, the file contents
    after the %ifnos will not be processed if the build system is running Irix. As
    always, a conditional block starting with %ifnos must be closed by a %else or
    %endif.


    # The %else Conditional


    The %else conditional is placed between a %if conditional of some persuasion,
    and a %endif. It is used to create two blocks of spec file statements, only one
    of which will be used in any given case. Here''s an example:


    ```

    %ifarch alpha

    make RPM_OPT_FLAGS="$RPM_OPT_FLAGS -I ."

    else

    make RPM_OPT_FLAGS="$RPM_OPT_FLAGS"

    endif

    ```


    When a build is performed on a Digital Alpha/AXP, some additional flags are added
    to the command. On all other systems, these flags are not added.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# The %endif Conditional


    A %endif is used to end a conditional block of spec file statements. It can follow
    one of the %if conditionals, or the %else. The %endif is always needed after a
    conditional, otherwise the build will fail. Here''s short conditional block, ending
    with a %endif:


    ```

    %ifarch i386

    make INTELFLAG=-DINTEL

    %endif

    ```


    In this example, we see the conditional block started with a %ifarch and ended
    with a %endif.


    Now that we have some more in-depth knowledge of the spec file, let''s take a
    look at some RPM''s additional features. In the next chapter, we''ll explore how
    to add dependency information to a package.'
  merge: -1
