- pgno: 37
  md: '# 10 An Introduction to Package Management


    +   - The package file format wasn''t extensible. This made it very difficult
    to add functionality, since any change to the file format would cause older versions
    of RPM to break.


    Even though their Linux distribution was a success, and RPM was much of the reason
    for it, Marc and Erik knew that some changes were going to be necessary to carry
    RPM to the next level.


    # 1.3 RPM of Today: Version 2


    Looking back on their experiences with RPM version 1, Marc and Erik made a major
    change to RPM''s design: they rewrote it entirely in C. This did wonderful things
    to RPM''s speed and size. Querying the database was quicker now, and there was
    no need to have Perl around just to do package management.


    In addition, the database was redesigned to improve both performance and reliability.
    Displaying package information can take as little as a tenth of the time spent
    in RPM version 1, for example.


    Realizing RPM''s potential in the non-Linux arena, they also created rpilib, a
    library of RPM routines that allow the use of RPM functionality in other programs.
    RPM''s ability to function on more than one architecture was also enhanced. Finally,
    the package file format was made more extensible, clearing the way for future
    enhancements to RPM.


    So is RPM perfect? No program can ever reach perfection, and RPM is no exception.
    But as a package manager that can run on several different types of systems, RPM
    has a lot to offer, and it will only get better. Let''s take a look at the design
    criteria that drove the development of RPM.


    # 1.3 RPM Design Goals


    The design goals of RPM could be summed up with the phrase "something for everyone".
    While the main reason for the existence of RPM was to make it easier for Red Hat
    Software to build the several hundred packages that comprised their Linux distribution,
    it was not the only RPM created. Let''s take a look at the various requirements
    the Red Hat team used in their design of RPM:


    # 1.3.1 Make it easy to get packages on and off the system


    As we''ve seen earlier in this chapter, the act of installing a package can involve
    many complex steps. Ensuring these steps to a person who may not have the necessary
    experience is a strategy for failure. So the goal for RPM was to make it as easy
    as possible for anyone to install packages. The same holds true for removing packages.
    It is a complex and error-prone operation, and one that RPM should handle for
    the user.


    The other side of this issue is that RPM should give the package builder almost
    total control in terms of how the package is installed. The reason for this is:
    if the package builders'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 1.3 RPM Design Goals


    their homework, their package should install and uninstall properly.


    # 1.3.2 Make it easy to verify a package was installed correctly


    Because software problems are a fact of life, the ability to verify the proper
    installation of a package is vital. If done properly, it should be possible to
    catch a variety of problems, including things such as missing or modified files.


    # 1.3.3 Make it easy for the package builder


    While we''re dedicating an entire book to package management, in reality it should
    be a small portion of the package builder''s job. Why? They''ve got better things
    to do! If they are the people who are actually creating the software to be packaged,
    that''s where they should be spending the majority of their time.


    Even if the package builder isn''t actually writing software, they still have
    better things to do than worry about building packages. For instance, they may
    be responsible for building many packages. The less time spent on building an
    individual package translates to more packages that can be built.


    # 1.3.4 Make it start with the original source code


    Delving a bit more into the package builder''s world, it was deemed important
    that RPM start with the original, unmodified source code. Why is this so important?


    Using the original sources makes possible to separate the changes required to
    build the package from any changes implemented to fix bugs, add new features,
    or anything else. This is a good thing for package builders, since many of them
    are not the original authors of the programs they package.


    This separation makes it easy, months down the road, to know exactly what changes
    were made in order to get the package to build. This is important when a new version
    of the packaged software becomes available. Many times it''s only necessary to
    apply the original "package building" changes to the new software. At worst, the
    changes provides a starting point to determine what sorts of things might need
    to be changed in the new version.


    # 1.3.5 Make it work on different computer architectures


    One of the tougher things for a package builder to do is take a program, make
    it run on more than one type of computer, and distribute packages for each. Because
    RPM makes it easy to take a program''s original source code, add the necessary
    changes to get it to build, and produce a package for each architecture in one
    step, can be pretty handy.'
  merge: -1
  img_proc: true
