  md: '# Building Packages: A Simple Example


    +   * After a package is installed.

    * Before a package is erased.

    * After a package is erased.


    We''ll see how these scripts are used in chapter 20 on page 279.


    The %clean Section


    The other missing section has the rather descriptive title of %clean. This section
    can be used to clean up any files that are not part of the application''s normal
    build area. For example, if the application creates a directory structure in /tmp
    as part of its build, it will not be removed. By adding a sh script to the %clean
    section, such situations can be handled gracefully, right after the binary package
    is created.


    # 11.4 Starting the Build


    Now it''s time to begin the build. First, we change directory into the directory
    holding cdplayer''s spec file:


    ```

    # cd /usr/src/redhat/SPECS

    #

    ```


    Next, we start the build with an rpm -b command:


    ```

    # rpm -ba cdplayer-1.0.spec

    ```


    The following -b option directs RPM to perform all phases of the build process.
    Some-it is necessary to stop at various phases during the initial build to resolve
    problems that crop up while writing the spec file. In these cases, other letters
    can be used after the -b in order to stop the build at the desired phase. For
    this example however, we will continue through the entire build process.


    In this example, the only other argument to the build command is the name of the
    package''s spec file. This can be wild-carded to build more than one package,
    but in our example, we''ll stick with one.


    Let''s look at RPM''s output during the build:


    +   * Package: cdplayer

    + umask 022

    + echo Executing: %prep

    Executing: %prep

    + cd /usr/src/redhat/BUILD'
