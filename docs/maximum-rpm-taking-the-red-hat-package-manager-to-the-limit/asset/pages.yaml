- pgno: 85
  md: 'One thing to keep in mind is that group specifications are case-sensitive.
    Issuing the command -rqg base won''t produce any output.


    ```

    --whatprovides <x>: Query the Packages That Provide Capability <x>

    ```


    RPM provides extensive support for dependencies between packages. The basic mechanism
    used is that a package may require another package provides. The thing that is
    required and provided can be shared a character string chosen by the package builder.
    It can also be a library''s soname. In any case, it''s important to be able to
    display which packages provide a given capability.


    This is just what --whatprovides option does. When the option, followed by a capability,
    is added to a query command, RPM will select those packages that provide the capability.
    Here''s an example:


    ```

    # rpm -q --whatprovides module-info

    kernel-2.0.18-5

    ```


    ```

    #

    ```


    In this case, the only package that provides the module-info capability is kernel-2.0.18-5.


    ```

    --whatrequires <x>: Query the Packages That Require capability <x>

    ```


    The --whatrequires option is the logical complement to the --whatprovides option
    described above. It is used to display which packages require the specified capability.
    Expanding on the example we started with --whatprovides, let''s see which packages
    require the module-info capability:


    ```

    # rpm -q --whatrequires module-info

    kernelcfg-0.3-2

    ```


    There''s only one package that requires module-info — kernelcfg-0.3-2.


    # 8.2.2 Query Commands, Part Two: Information Selection


    After specifying the package (or packages) you wish to query, you''ll need to
    figure out what you''d like RPM to retrieve. As we''ve seen, by default, RPM only
    returns the complete package label. But there''s much more to package than that.
    Here, we''ll explore every information selection option available to us.'
  merge: -1
