  md: '# Getting Information About Packages


    What to do? There are two options:


    +   1. Make sure you always specify a package free of symlinks. This can be pretty
    tough, though. An alternative approach is to use namei to track down symlinks:


    ```

    # namei /usr/X11/bin/xterm

    f: /usr/X11/bin/xterm

    d

    d usr

    1 X11 -> X11R6

    d X11R6

    d bin

    #

    ```


    It''s pretty easy to see the X11 to X11R6 symlink. Using this approach you can
    enter the non-symlinked path and get the desired results:


    ```

    # rpm -qf /usr/X11R6/bin/xterm

    XFree86-3.1.2-5

    #

    ```


    +   2. Change your directory to the one holding the file you want to query. Even
    if you use a symlinked path to get there, the file should then work as you''d
    expect:


    ```

    # cd /usr/X11/bin

    # rpm -qf xterm

    XFree86-3.1.2-5

    #

    ```


    So if you get a “not owned by any package” error, and you think it may not be
    true, one of the approaches above.


