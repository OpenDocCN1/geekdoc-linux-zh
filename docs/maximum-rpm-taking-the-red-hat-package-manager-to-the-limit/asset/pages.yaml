    lrwx-xr-x 1 root root 18 Oct 7 13:45 cdplay -> /usr/local/bin/cdp

    #

    ```


    Uh-oh. That cdplay symlink isn''t right. What happened? If we look at cdplayer''s
    makefile, we see the answer:


