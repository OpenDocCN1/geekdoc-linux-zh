  md: '# A.2 RPM File Format


    Since the header is a header structure just like the signature, we know that the
    next bytes are for the first index entry:


    ```

    0000160: 0000 03e8 0000 0006 0000 0000 0001 ......................

    ```


    The first four bytes (0000 03e8) are the offset, which is the tag for the package
    name. The next four bytes indicate the data is type 6, or a null-terminated string.
    There''s an offset of zero in the next four bytes, meaning that for this tag is
    first in the store. Finally, the last four bytes (0000 0001) show that the data
    count is 1, which is the only legal value for data of type STRING.


    To find the data, we need to take the offset from the start of the first index
    entry in the header (60), and add in the count of index entries (21) multiplied
    by the size of an index entry (10). Doing the math (all the values shown, are
    in hex, remember!), we arrive at the offset to the store, hex 370. Since this
    particular index entry is zero, the data should start at offset 370:


    ```

    0000370: 7270 6400 322e 322e 3100 5265 6420 rpm.2.2.1.1.Red

    ```


    Since the data type for this entry is a null-terminated string, we need to keep
    reading bytes until we reach a byte whose numeric value is zero. We find the bytes
    72, 70, 6d, and 00 a null. Looking at the ASCII display on the right, we find
    that the bytes form the string rpm, which is the name of this package.


    Now for a slightly complicated example. Let''s look at the following index entry:


    ```

    0000250: 0403 0400 0008 0000 0199 0018 ......................

    ```


    Tag 403 means that this entry is a list of filenames. The data type 8, or STRING_ARRAY,
    seems to be this out. From the previous example, we found that the data area for
    the header began at offset 370. Adding the offset to the first filename (199),
    we give us 509. Finally, the count of 18 hex means that there are 24 null-terminated
    strings containing filenames:


    ```

    0000500: 696e 6974 6462 0a0a 002f 6269 62e2 7270 initdb...../bin/rp

    0000510: 6400 2f65 7f72 7063 0023 0755 m./etc/rpmrc/us

    ```


    The offset at 502f is a "/”. Reading up to the first null byte, we find that the
    filename is /bin/rpm, followed by /etc/rpmrc. This continues for 22 more filenames.


    There are many more tags we could use, but they are all done in the same manner.


    # Header Tag Listing


    The following list shows the tags available, along with their defined values,
    for use in the header. This list is current as version of 2.3 of RPM. For the
    most up-to-date version, look in the lib file/rpmlib.h in the latest version of
    the RPM sources.'
  merge: -1
  img_proc: true
