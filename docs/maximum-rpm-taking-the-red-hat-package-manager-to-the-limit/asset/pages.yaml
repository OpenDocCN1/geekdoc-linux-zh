  md: '# 12 rpm -b — What Does It Do?


    #


    After executing the %prep, %build, and %install sections, handling any special
    documentation files, RPM then creates a binary package file. In the sample output,
    we see that first RPM performs automatic dependency checking. It does this by
    determining which shared libraries are required by the executable programs contained
    in the package. Next, RPM actually executes the files to be packaged, optionally
    signs the package, and outputs the finished product.


    The last part of RPM''s output looks suspiciously like a section in the spec file
    being executed. In our example, there is no %clean section. If there were, however,
    RPM would have executed any commands in the section. In the absence of a %clean
    section, RPM simply issues the usual commands and exits normally.


    # 12.1.5 rpm -ba — Execute %prep, %build, %install, package (bin, src)


    The -ba option directs RPM to perform all the stages in building a package. With
    this one command, RPM:


    +   * Unpacks the original sources

    * Applies patches (if desired)

    * Builds the software

    * Installs the software

    * Creates the binary package file.

    * Creates the source package file.


    That''s quite a bit of work for one command! Here it is, in action:


    ```

    # rpm -ba cdplayer-1.0.spec

    * Package: %cdplayer

    Executing: %prep

    ...

    + exit 0

    Executing: %build

    ...

    + exit 0

    Executing: %install

    ...

    + exit 0

    Executing: special doc

    ...

    + exit 0

    Binary Packaging: cdplayer-1.0-1

    ```'
  merge: -1
  img_proc: true
