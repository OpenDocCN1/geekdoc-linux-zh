- pgno: 338
  md: '# 20.4 Package Building


    # Bits and Pieces


    However, just because a package has been properly built, and installs and can
    be erased without problems, doesn''t mean the package builder''s job is done.
    It''s necessary to look at each newly-built package from the user''s perspective.
    Does the package contain everything the user needs in order to deploy it effectively?
    Or will the user need to fiddle with it, guessing as they go?


    In the case of the amanda packages, it was obvious that some additional documentation
    was required so that the user would know what needed to be done in order to finalize
    the installation. Simply directing the user to the standard amanda documentation
    wasn''t the right solution, Many of the steps outlined in the INSTALL document
    had already been done by the post-install scripts. No, an interim documento was
    required. Two, actually: one for the client, and one for the server.


    So two files were created, one to be added to each subpackage. The question was,
    how to do it? Essentially, there were two options:


    +   1. Put the files in the amanda directory tree that had been used to perform
    the initial builds and generate a new patch file

    2. Create a tar file containing the two files, and modify the spec file to unpack
    the documentation into the amanda directory tree.

    3. Drop the files directly into the amanda directory tree without using tar.


    Since the second approach was more interesting, that''s the approach we chose.
    It required an additional source tag in the spec file:


    ```

    Source1: amanda-rpm-instructions.tar.gz

    ```


    Also required was an additional %setup macro in the %prep script:


    ```

    %setup -T -D -a 1

    ```


    While the %setup macro might look intimidating, it wasn''t that hard to construct.
    Here''s what each options means:


    +   -T — Do not perform the default archive unpacking.

    -D — Do not delete the directory before unpacking.

    -a 1 — Unpack the archive specified by the source1 tag after changing directory.


    Finally, two additions to the %files lists were required. One for the client:


    ```

    %doc amanda-client.README

    ```'
