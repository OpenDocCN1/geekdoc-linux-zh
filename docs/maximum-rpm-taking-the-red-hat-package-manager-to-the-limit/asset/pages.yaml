    mind that the %files list must be generated manually. By using the -bl option,
    the following steps are all that''s necessary to create a %files list:


    +   - Writing the %files list.

    - Using the -bl option to check the %files list.

    - Making any necessary changes to the %files list.


    It may take one iteration through these steps, but eventually the list check will
    pass. Using the -bl option to check the %files list is certainly better than starting
    a new'
