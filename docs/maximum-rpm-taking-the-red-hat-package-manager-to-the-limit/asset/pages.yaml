  md: '# 258 Creating Subpackages


    In addition, we need the main package''s %files list, which remains unnamed:


    %files


    The contents of each %files list is dictated entirely by the software''s requirements.
    If, for example, a certain file needs to be packaged in more than one package,
    it''s perfectly all right to include the filename in more than one list.


    # Controlling Packages With the %files List


    The %files list wields considerable power over subpackages. It''s even possible
    to prevent a package from being created by using the %files list. But there is
    a reason why you''d want to go to the trouble of setting up subpackages, only
    to keep one being created?


    Actually, there is. Take, for example, the case where client/server-based software
    is to be packaged. Certainly, it makes sense to create two subpackages: one for
    the client and for the server. But what about the main package? Is there any need
    for it?


    Quite often there''s no need for a main package. In those cases, removing the
    main %files list entirely result in no main package being built.


    # A Worth Noting


    Please keep in mind that an empty %files list (ie, a %files list that contains
    no files) is not the same as not having a %files list at all. As we noted above,
    removing a %files list results in RPM not creating that package. However, if RPM
    comes across a %files list with no files, it will happily create an empty package
    file.


    This feature also works with subpackage %files lists) comes in handy when used
    in concert with conditionals. If a %files list is enclosed by a conditional, the
    package will be created (or not) based on the evaluation of the conditional.


    # Our Spec File So Far...


    Ok, let''s update our example spec file. Here''s what it looks like after adding
    each of the subpackages'' %files list:


    ```

    Name: foo

    Version: 2.7

    Release: 1

    Source: foo-2.7.tgz

    Copyright: probably not

    Summary: The foo app, and the baz library needed to build it

    Group: bogus/junque

    %description

    This is the long description of the foo app, and the baz library needed to build
    it...

    ```'
