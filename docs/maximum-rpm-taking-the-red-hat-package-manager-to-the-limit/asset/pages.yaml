- pgno: 434
  md: '# E.4 Macros


    See also: Section 13.4.1, page 188


    # The -D Option


    The -D option is used to direct %setup to not delete the build directory prior
    to unpacking the sources. This option is used when more than one source archive
    is to be unpacked into the build directory, normally with the -b or -a options.


    ```

    %setup -D -T -b 3

    ```


    See also: Section 13.4.1, page 189


    # The -T Option


    The -T option is used to direct %setup to not perform the default unpacking of
    the source archive specified by the first source tag. It is used with the -a or
    -b options.


    ```

    %setup -D -T -a 1

    ```


    See also: Section 13.4.1, page 189


    # The -b <n> Option


    The -b option is used to direct %setup to unpack the source archive specified
    on the nth source tag line before changing directory into the build directory.


    ```

    %setup -D -T -b 2

    ```


    See also: Section 13.4.1, page 190


    # The -a <n> Option


    The -a option is used to direct %setup to unpack the source archive specified
    on the nth source tag line after changing directory into the build directory.


    ```

    %setup -D -T -a 5

    ```


    See also: Section 13.4.1, page 190


    # E.4.2 The %patch Macro


    The %patch macro, as its name implies, is used to apply patches to the unpacked
    sources. With no additional options specified, it will apply the patch file specified
    by the patch (or patch0) tag.


    ```

    %patch

    ```


    When there is more than one patch tag line in a spec file, they can be specified
    by appending the number of the patch tag to the %patch macro name itself.'
