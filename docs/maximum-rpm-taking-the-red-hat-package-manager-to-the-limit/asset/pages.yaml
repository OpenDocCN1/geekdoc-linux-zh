- pgno: 312
  md: '# 20.3 Initial Building With RPM


    # 20.3 Initial Building With RPM


    Now that amanda has been configured, built, and operational on our build system,
    it''s time to have RPM take over each of these tasks. The first task is to have
    RPM make the necessary changes to the original sources. To do that, RPM needs
    a patch file.


    # 20.3.1 Generating patches


    The amanda-2.3.0 directory tree is where we did all our work building amanda.
    We need to take all the work we''ve done in that directory tree and compare it
    against the original sources contained in the amanda-2.3.0-orig directory tree.
    But before we do that, we need to clean things up a bit.


    # Cleaning up the test build area


    Looking through our work tree, it has all sorts of junk in it: emacs save files,
    object files, and the executable programs. In order to generate a clean set of
    patches, all these extraneous files must go. Looking over amanda''s makefiles,
    there is a clean target that should take care of most of the junk:


    ```

    # make clean

    Making clean in common-src

    ...

    rm -f *.o *.a genversion version.c Makefile

    ...

    Making clean in client-src

    ...

    rm -f amandad sendsize calcsize sendbackup-dump

    sendbackup-gnutar runart selfcheck * *.o Makefile

    ...

    Making clean in server-src

    ...

    rm -f amrestore adminin amflush amlabel amcheck amdup

    amcleanup antape taper damper driver planner reporter

    getconf * *.o Makefile

    ...

    Making clean in changer-src

    ...

    rm -f chg-generic * *.o Makefile

    ...

    Making clean in man

    ...

    rm -f * Makefile.out

    ...

    #

    ```'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# 286 Real-World Package Building


    Looking in the tools and config directories where we did all our work, we see
    there are still emacs save files there. A bit of studying confirms that the makefiles
    dont bother to clean these two directories. It''s a nice touch because a make
    clean won''t wipe out copies of the config files, giving you a chance to get them
    in case you''ve botched something. However, in our case, we''re sure we won''t
    need the save files, so they go:


    ```

    # cd /usr/src/redhat/SOURCES/amanda-2.3.0

    # find . -name "*" -exec rm -vf \

    ./config/config.h

    ./config/options.h

    ./tools/munge#

    ```


    We find a look at the whole directory tree, just in case there was something still
    out there that we''d forgotten about. As you can see, the only save files are
    from the files we''ve been working on.


    You''ll notice we''ve left our modified munge file, as well as the config.h and
    options.h files we so carefully crafted. That''s intentional, as we want to make
    sure those changes are applied when RPM patches the sources. Everything looks
    pretty clean, so it''s time to make the patches.


    # Actually Generating patches


    This step is actually anticlimactic:


    ```

    # diff -uNR amanda-2.3.0-orig/ amanda-2.3.0/ > amanda-2.3.0-linux.patch

    #

    ```


    With that command, we''ve compared each file in the untouched directory tree (amanda-2.3.0-orig)
    with the directory tree we''ve been working in (amanda-2.3.0). If we''ve done
    our homework, the only things in the patch file will be related to the files we''ve
    changed. Let''s take a look through it to make sure:


    ```

    # cd /usr/src/redhat/SOURCES

    # cat amanda-2.3.0-linux.patch

    diff -uNR amanda-2.3.0-orig/config/config.h amanda-2.3.0/config/config.h

