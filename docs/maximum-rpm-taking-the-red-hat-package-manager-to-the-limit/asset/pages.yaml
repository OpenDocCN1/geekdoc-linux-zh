- pgno: 454
  md: '# Appendix G


    # An Introduction to PGP


    Assuming you''re not the curious type and haven''t flipped your way back, you
    are probably here looking for some information on the program known as Pretty
    Good Privacy, or PGP.


    # G.1 PGP - Privacy for Regular People


    PGP, or "Pretty Good Privacy", is a program that is intended to help make electronic
    mail more secure. It does this by using sophisticated techniques known *public
    key encryption*.

    If you find yourself wondering what electronic mail and making information unreadable
    by spies has to do with RPM, you have a good point. However, PGP''s claim to fame
    is the handling of e-mail in total privacy, and there are other tricks up its
    sleeve.


    # G.1.1 Keys your Locksmith Wouldn''t Understand


    As we mentioned above, PGP uses public key encryption to do some of its magic.
    You might guess from name that type of encryption involves keys of some sort.
    But, as you might imagine, these are not keys that you can copy down to the local
    hardware store. They are numbers — *large numbers*. Here''s what a key might look
    like:


    ```

    -----BEGIN PGP PUBLIC KEY BLOCK-----

    Version: 2.6

    QMCNAZE2yXJQAAEEKAKG/Y0VUSIc9Wige6Bmg6erGRClzmFyzioAho8kDIJSrcmi

    F9FdqP+fJ72pegwII1bBOYtSyZn9y21qm5hkHPODfN18wyTFsxr8ygosLRC1TP

    xqVhItnGrfZ2LoSpvL1dwQme0y0p0pJgndh0zMXqXgf584vaug6PHLovp55AAUR

    tcPSZWqSGOFInvZN3rYJ31LC8Cb.MunIdxZywROXRAcmkaGFOLmNvt6BJafUD

    ```


    > ¹When we say keys are numbers, we aren''t even lying though the example key
    doesn''t look like a number. It has been processed so that it can be concisely
    displayed using only printable characters.'
  merge: -1
  img_proc: true
- pgno: 455
