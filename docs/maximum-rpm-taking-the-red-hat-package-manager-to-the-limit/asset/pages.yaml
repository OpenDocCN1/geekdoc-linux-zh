    Much better...


    Tags The most important parts of a format string are the tags. Each tag specifies
    what information is to be displayed and can include field-width, as well as justification
    and data formatting instructions. But for now, let''s look at the basic tag. In
    fact, let''s look at three — the tags that fetch the package name, version, and
    release.

    Strangely, these tags are called NAME, VERSION, and RELEASE. In order to be used
    in a format string, the tags must be enclosed in curly braces and preceded by
    a percent sign. Let''s give it a try:


    ```

    # rpm -q --queryformat ''%{NAME}%{VERSION}%{RELEASE}\n'' rpm

    rpm2.31

    #

    ```


    Let''s add a dash between the tags and see if that makes the output easier to
    read:


    ```

    # rpm -q --queryformat ''%{NAME}-%{VERSION}-%{RELEASE}\n'' rpm

    rpm-2.3-1

    #

    ```


    Our format string outputs standard package labels.


    Field Width and Justification Sometimes it''s desirable to allocate fields of
    a particular size for a tag. This is done by putting the desired field width between
    the tag''s leading percent sign, and the opening curly brace. Using our package-labeling
    format string, let''s allocate a 20-character field for the version:


    ```

    # rpm -q --queryformat ''%{NAME}-%-20%{VERSION}-%{RELEASE}\n'' rpm

    rpm-

    #

    ```


    The result is a field of 20 characters: 17 spaces, followed by the three characters
    that make up the version.


    > ⁵RPM uses printf to --queryformat formatting. Therefore, you can use any of
    the printf modifiers discussed in the printf(3) man page.'
