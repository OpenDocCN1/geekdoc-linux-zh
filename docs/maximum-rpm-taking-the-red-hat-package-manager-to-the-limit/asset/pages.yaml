- pgno: 135
  md: '# 8.3 Source Package Files and How To Use Them


    One day, you may run across a package file with a name similar to the following:

    etckskel-1.0-3.src.rpm


    Notice the src. Is that a new kind of computer? If you use RPM on an Intel-based
    computer, you''d normally expect to find i386. Maybe someone messed up the name
    of the file. Well, we know that the file command can display information about
    a package file, even if the filename has been changed. We''ve used it before to
    figure out what package a file contains:


    ```

    # file foo.bar

    foo.bar: RPM v2 bin i386 eject-1.2-2

    #

    ```


    In this example, foo.bar is an RPM version 2 file, containing an executable package
    hence, the “bin" built for Intel processors – the “i386”. The package is version
    1.2, release 2.


    Let''s try the file on this mystery file and see what we can find out about it:


    ```

    # file etckskel-1.0-3.src.rpm

    etckskel-1.0-3.src.rpm: RPM v2 src i386 etckskel-1.0-3

    #

    ```


    Well, it''s a package file right - for version 1.0, release 3 of the etckskel
    package. It''s in RPM version 2 format, and built for Intel-based systems. But
    what does the “src" mean?


    # 8.3.1 A gentle introduction to source code


    This package file contains not the executable, or "binary", files that a normal
    package contains, but rather the "source" files required to create these binaries.
    When programmers create a new program, they write the instructions, often called
    “code", in one or more files. The source code is then compiled into a binary that
    can be executed by the computer.


    As part of the process of building package files (a process we cover in great
    detail in the second half of this book), two types of package files are created:


    +   1. The binary, or executable, package file


    +   2. The source package file


    The source package contains everything needed to recreate not only the programs
    and associated files that are contained in the binary package file, but the binary
    and source package files themselves.'
  merge: -1
  img_proc: true
