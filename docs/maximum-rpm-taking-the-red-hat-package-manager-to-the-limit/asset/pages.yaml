    We piped the output of cat into RPM. The dash at the end of the command line directs
    RPM to read the package from standard input.


    -g <group>: Query Packages Belonging To Group <group>


    When a package is built, the package builder must classify the package, grouping
    it with other packages that perform similar functions. RPM gives you the ability
    to query installed packages on their groups. For example, there is a group known
    as Base. This group consists of packages that provide low-level structure for
    a Linux distribution. Let''s see what installed packages make up the Base group:


    ```

    # rpm -q Base

    setup-1.5-1

