  md: "# 21.2 rpmlib Functions\n\n+   * RPM_INT16_TYPE — The entry contains a sixteen-bit\
    \ integer.\n* RPM_INT32_TYPE — The entry contains a thirty-two-bit integer.\n\
    * RPM_INT64_TYPE — The entry contains a sixty-four-bit integer.\n* RPM_STRING_TYPE\
    \ — The entry contains a null-terminated character string.\n* RPM_BIN_TYPE — The\
    \ entry contains binary data that will not be interpreted by rpmlib.\n* RPM_STRING_ARRAY_TYPE\
    \ — The entry contains an array of null-terminated strings.\n\n# Get Entry From\
    \ Header headerGetEntry()\n\n```\n#include <rpm/rpmlib.h>\n#include <rpm/header.h>\n\
    \nint headerGetEntry(Header h,\n    int_32 tag,\n    int_32 *type,\n    void **pp,\n\
    \    int_32 *c);\n```\n\nThis function retrieves the entry matching tag from header\
    \ h. The type of the entry is returned in type, a pointer to the data is returned\
    \ in p, and the size of the data is returned in c. Both type and c may be null,\
    \ in which case data will not be returned. Note that if the entry type is RPM_STRING_ARRAY_TYPE,\
    \ you must issue a free() on p when done with the data.\nThis function returns\
    \ 1 on success, and 0 on failure.\n\n# Add Entry To Header headerAddEntry()\n\n\
    ```\n#include <rpm/rpmlib.h>\n#include <rpm/header.h>\n\nint headerAddEntry(Header\
    \ h,\n    int_32 tag,\n    int_32 *type,\n    void *p,\n    int_32 *c);\n```\n\
    \nThis function adds a new entry to the header h. The entry's tag is specified\
    \ by the tag parameter, and the entry's type is specified by the type parameter.\n\
    The entry's data is pointed to by p, and the size of the data is specified by\
    \ c.\nThis function always returns 1."
