- pgno: 287
  md: '# 18.4.3 Install- and Erase-time Scripts


    The install- and erase-time scripts, %pre, %preun, %post, and %postun, can all
    be named exactly the same method as was used for the other subpackage-specific
    sections of the spec file. The script used during package verification, %verifyscript,
    can be made package-specific as well. Using the subpackage structure from our
    example spec file, we would end up with script definitions like:


    +   * %pre server

    * %postun client

    * %preun -n bazlib

    * %verifyscript client


    Other than the change in naming, there''s only one thing to be aware of when creating
    scripts for subpackages. It''s important that you consider the possibility of
    scripts from various subpackages interacting with each other. Of course, this
    is simply good script-writing practice, even if the packages involved are not
    related.


