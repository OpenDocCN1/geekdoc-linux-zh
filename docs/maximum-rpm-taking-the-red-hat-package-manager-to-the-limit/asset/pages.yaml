    ```


    With one command RPM gives you the answer.¹


    The -p option can also use Uniform Resource Locators to specify package files.
    See section 2.2.1 on page 17 for more information on using URLs.


    There''s one last trick up -p''s sleeve — it can also perform a query by reading
    a package from standard input. Here''s an example:


    ```

    # cat bother-3.5-1.4386.rpm | rpm -qp

    bother-3.5-1

