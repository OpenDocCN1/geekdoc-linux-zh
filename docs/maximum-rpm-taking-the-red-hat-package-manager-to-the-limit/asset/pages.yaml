- pgno: 132
  md: '# 8.2 Using rpm2cpio


    # 8.1.5 --version -- Display the current RPM version


    If you''re not sure what version of RPM is presently installed on your system,
    the easiest way to find out is to ask RPM itself using the --version option:


    ```

    # rpm --version

    RPM version 2.3

    #

    ```


    # 8.2 Using rpm2cpio


    From time to time, you might find it necessary to extract one or more files from
    a package file. One way to do this would be to:


    +   - Install the package

    - Make a copy of the file(s) you need

    - Erase the package


    An easier way would be to use rpm2cpio.


    # 8.2.1 rpm2cpio — What does it do?


    As the name implies, rpm2cpio takes an RPM package file and converts it to a cpio
    archive. Because it''s written to be used primarily as a filter, there''s not
    much to be specified. rpm2cpio takes only one argument, and even that''s optional!


    The optional argument is the name of the package to be converted. If there is
    no filename specified on the command line, rpm2cpio will simply read from standard
    input and convert that to a cpio archive. Let''s give it a try:


    ```

    # rpm2cpio logrotate-1.0-1.i386.rpm

    0702020018a6a40000081a400000000000000000133118bb000002c200000008000

    00000300000000000000000001900000e7e3usr/man/man8/logrotate.8." logrotate

    - log fi

    le rotator

    .TH rpm 8 "28 November 1995" "Red Hat Software" "Red Hat Linux"

    .SH NAME

    ```


    (We''ve just shown the first few lines of output.) rpm2cpio is written as a filter.
    It writes the cpio archive contained in the package file to standard output, which,
    if you''ve redirected it somehow, is your screen. Here''s a more reasonable example:'
  merge: -1
  img_proc: true
- pgno: 133
  md: '```

    # rpm2cpio logrotate-1.0-1.i386.rpm > blah.cpio

    # file blah.cpio

    blah.cpio: ASCII cpio archive (SVR4 with CRC)

    #

    ```


    Here we''ve directed rpm2cpio to convert the logrotate package file. We''ve also
    redirected rpm2cpio''s output to a file called blah.pio. Next, using the file
    command, we find that the resulting file is indeed a true-blue cpio archive file.
    The following command is entirely equivalent to the one above and shows rpm2cpio''s
    ability to read the package file from its standard input:


    ```

    # cat logrotate-1.0-1.i386.rpm | rpm2cpio > blah.cpio

    #

    ```


    # 8.2.2 A more real-world example — Listing the files in a package file


    While there''s nothing wrong with using rpm2cpio to actually create a cpio archive
    file, it takes a few more steps and uses a bit more disk space than strictly necessary.
    A somewhat cleaner approach would be pipe rpm2cpio''s output directly into cpio:


    ```

    # rpm2cpio logrotate-1.0-1.i386.rpm | cpio -t

    usr/man/man8/logrotate

    usr/sbin/logrotate

    14 blocks

    #

    ```


    In this example, we used the -t option to direct cpio to produce a “table of contents”
    of the archive created by rpm2cpio. This can make it much easier to get the right
    filename and path when to extract a file.


    # 8.2.3 Extracting one or more files from a package file


    Continuing the example above, let''s extract the man page from the logrotate package.
    In the table of contents, we see that the full path is user/man/man8/logrotate.8.
    All we need to do is use the filename and path as shown below:


    ```

    # rpm2cpio logrotate-1.0-1.i386.rpm | cpio -iv usr/man/man8/logrotate.8

    usr/man/man8/logrotate

    14 blocks

    #

    ```'
  merge: -1
  img_proc: true
