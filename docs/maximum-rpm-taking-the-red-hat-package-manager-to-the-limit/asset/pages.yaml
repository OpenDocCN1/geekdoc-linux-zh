    That was short! And this huge difference brings up a good point about writing
    scripts: It''s important to understand what you as the package builder should
    do for the user, and what they should do for themselves.


    In the case of the client package, every one of the steps performed by the post-install
    script was something that a fairly knowledgeable user could have done. But each
    of these steps have one thing in common. No matter how the user configures amanda,
    these steps will never change. And given the nature of client applications, there’s
    a good chance that many more client packages will be installed than amanda servers.
    You would like to be tasked with installing this package on twenty systems, and
    performing each of the steps we’ve automated, twenty times? We thought not.


    There is one step that we did *not* automate for the client package. The step
    left out is the creation of .hosts file. Since this file must contain the name
    of the amanda server, we have no way of knowing what the file should look like.
    Therefore, that’s one step we can’t automate.


    The server’s post-install script is so short because there is little little that
    can be automated. The other steps required to set up an amanda server include:


    +   1. Choosing a configuration name, which requires user input

    2. Creating a directory to hold the server configuration files, named according
    to the configuration name, which depends on the first step

    3. Modifying example configuration files to suit the site, which requires user
    input

    4. Adding cron entries to run amanda nightly, which requires user input


    Since every step depends on the user making decisions, the best way to handle
    this is to not handle them at all. Let the user do it!'
