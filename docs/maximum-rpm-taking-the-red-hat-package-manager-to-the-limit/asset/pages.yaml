  md: "# A Guide to the RPM Library API\n\nTrack Package Installation Progress — rpmNotifyFunction()\n\
    \n```\n#include <rpm/rpmplib.h>\ntypedef void (*rpmNotifyFunction)(const unsigned\
    \ long amount,\n                               const unsigned long total);\n```\n\
    \nA function can be passed to rpmInstallSourcePackage or rpmInstallPackage via\
    \ the notify parameter. The function will be called at regular intervals during\
    \ the installation, and will have two parameters passed to it:\n\n+   1. amount\
    \ — The number of bytes of install that have been completed so far.\n2. total\
    \ — The total number of bytes that will be installed.\n\nThis function permits\
    \ the creation of a dynamically updating progress meter during package installation.\n\
    \nRemove Installed Package — rpmRemovePackage()\n\n```\n#include <rpm/rpmplib.h>\n\
    int rpmRemovePackage(char * root,\n                     rpmdb db,\n          \
    \           unsigned int offset,\n                     int flags);\n```\n\nThis\
    \ function removes the package at record number offset in the RPM database specified\
    \ by db. If root is specified, it is used as the path to a directory that will\
    \ serve as the root directory while the package is being removed.\n\nThe flags\
    \ parameter is used to control the package removal behavior. The flags that may\
    \ be passed are defined in rpmplib.h, and are of the form RPMUNINSTALL_xxx, where\
    \ xxx is the name of the flag.\n\nThe following flags are currently defined:\n\
    \n+   - RPMUNINSTALL_TEST — Perform all erase-time checks, but do not actually\
    \ remove the package.\n- RPMUNINSTALL_NOSCRIPTS — Do not execute the package’s\
    \ erase-time scripts.\n\nThis function returns the following status values:\n\n\
    +   0 — The package was removed successfully.\n1 — The package removal failed."
