- pgno: 430
  md: '# E.3 Scripts


    By convention, the source filename is usually preceded by a URL pointing to the
    location of the original sources, but RPM does not require this.


    ```

    Source0: ftp://ftp.gnomovision.com/pub/cdplayer-1.0.tgz

