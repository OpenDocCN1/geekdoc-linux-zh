  md: "# 21.2.8 Package Manipulation\n\nThese functions perform the operations most\
    \ RPM users are familiar with. Functions that install and erase packages are here,\
    \ along with a few related lower-level support functions.\n\nInstall Source Package\
    \ File — rpmInstallSourcePackage()\n\n```\n#include <rpm/rmplib.h>\nint rpmInstallSourcePackage(char\
    \ * root,\n int fd,\n char **specFile,\n rpmNotifyFunction notify,\n char * labelFormat);\n\
    ```\n\nThis function installs the source package specified by fd. If root is not\
    \ NULL, it is prepended to the variables RPMWAR_SOURCEDIR and RPMWAR_SPECDIR prior\
    \ to the actual installation. If specFile is not NULL, the complete path and filename\
    \ of the just-installed spec file is returned.\n\nThe notify parameter is used\
    \ to specify a progress-tracking function that will be called during the installation.\
    \ Please refer to page 326 for more information on this parameter.\n\nThe labelFormat\
    \ parameter is used to specify how the package label should be formatted. It is\
    \ used when printing the package label once the package install is ready to proceed.\
    \ If labelformat is NULL, the package is not printed.\n\nThis function returns\
    \ the following status values:\n\n+   - 0 — The source package was installed successfully.\n\
    \n+   - 1 — The source package file contained incorrect magic numbers.\n\n+  \
    \ - 2 — Another type of error occurred.\n\nInstall Binary Package File — rpmInstallPackage()\n\
    \n```\n#include <rpm/rmplib.h>\nint rpmInstallPackage(char * rootdir,\n rpmdb\
    \ db,\n int fd,\n char * prefix,\n int flags,\n rpmNotifyFunction notify,\n char\
    \ * labelFormat,\n char * netsharedPath);\n```"
