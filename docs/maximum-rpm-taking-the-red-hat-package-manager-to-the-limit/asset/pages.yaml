  md: '# 2.3 Two handy options


    # 2.2.2 A warning message you might never see


    Depending on circumstances, the following message might be rare or very common.
    While performing an ordinary install, RPM prints a warning message:


    ```

    # rpm -i cdp-0.33-100.i386.rpm

    warning: /etc/cdp-config saved as /etc/cdp-config.rpmorig#

    ```


    What does it mean? It has to do with RPM''s handling of config files. In the example
    above, RPM found a file (/etc/cdp-config) that didn''t belong to any RPM-installed
    package. Since the cdp-0.33-100 package contains a file of the same name that
    is to be installed in the same directory, there is a problem.


    RPM solves this best way it can. It performs two steps:


    +   1. It renames the original file to cdp-config.rpmorig

    2. It installs the new cdp-config file that came with the package.


    Continuing our example, if we look in /etc, we see that this is exactly what has
    happened:


    ```

    # ls -al /etc/cdp*\n-rw-rw-r-- 1 root 119 Jun 23 16:00 /etc/cdp-config

    -rw-rw-r-- 1 root 56 Jun 14 21:44 /etc/cdp-config.rpmorig#

    ```


    This is the best possible solution to a tricky problem. The package is installed
    with a config file that is known to work. After all, the original file may be
    of an, incompatible version of the system software. However, the original file
    is saved so that it can be studied by the system administrator, who can decide
    whether the original file should be put back into service or not.


    # 2.3 Two handy options


    There are two options to rpm -i that work so well, and are so useful, you might
    think they should be RPM''s default behavior. They aren''t, but using them only
    requires that you type an extra two characters:


    # 2.3.1 Getting a bit more feedback -v


    Even though rpm -i is doing many things, it''s not very exciting, is it? When
    performing installs, RPM is pretty quiet, unless something goes wrong. However,
    we can ask for a bit output by adding -v to the command:'
