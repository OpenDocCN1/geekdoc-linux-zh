  md: "# 21.3 Example Code\n\nBefore opening the RPM database, it's necessary to know\
    \ where the database resides. Information is stored in rpmprc files, which are\
    \ read by rpmReadConfigFiles(). To show that this function is really doing its\
    \ job, we retrieve the RPM database path before after the rpmprc files are read.\
    \ Note we that the return value of rpmGetVar(RPM.DBPATH) and if it is null, we\
    \ insert (none) in the printf() output. This prevents core dumps if no database\
    \ path has been set, and besides, it's more user-friendly.\n\n```\nif (rpmdbopen(\"\
    \", &db, O_RDONLY, 0644) != 0) {\n    printf(stderr, \"cannot open /var/lib/rpm/packages.rpm\\\
    n\");\n    exit(1);\n}\n```\n\nHere we are opening the RPM database, and doing\
    \ some cursory error checking to make sure we continue.\n\n```\noffset = rpmdbFirstRecNum(db);\n\
    ```\n\nWe get the offset of the first database record...\n\n```\nwhile (offset)\
    \ {\n    h = rpmdbGetRecord(db, offset);\n    if (!h) {\n        printf(stderr,\
    \ \"headerRead failed\\n\");\n        exit(1);\n    }\n}\n```\n\nHere we start\
    \ a while loop based on the record offset. As long as there is a non-zero offset\
    \ (meaning there is still an active record), we get the record. If there's a problem\
    \ getting the record, we exit.\n\n```\nheaderGetEntry(h, RPMTAG_NAME, &type, void\
    \ (void **) &name, &count);\nif (strcmp(name, argv[1]) == 0)\n    headerDump(h,\
    \ stdout, 1);\n```\n\nNext, we get the package name entry from the record, and\
    \ compare it with the name of the package we are interested in. If it matches,\
    \ we dump the contents of the entire record.\n\n```\nheaderFree(h);\n\noffset\
    \ = rpmdbNextRecNum(db, offset);\n}\n```\n\nAt the end of the loop, we free the\
    \ record, and get the offset to the next record."
