  md: "# A Guide to the RPM Library API\n\n# Verify A Package File's Signature — rpmVerifySignature()\n\
    \n```\n#include <rpm/rpmlib.h>\n\nint rpmVerifySignature(char *file,\n    int_32\
    \ sigTag,\n    void *sig,\n    int count,\n    char *result);\n```\n\nThis function\
    \ verifies the signature of the package pointed to by file. The result of the\
    \ verification is stored in result, in a format suitable for printing.\nThe sigTag\
    \ parameter specifies the type of signature to be checked. The sig parameter specifies\
    \ the signature against which the package is to be verified. The count parameter\
    \ specifies the size of the signature; at present, this parameter is only used\
    \ for PGP-based signatures.\nThis function returns the following values:\n\n+\
    \   - RPMSIG_OK — The signature verified correctly.\n- RPMSIG_UNKNOWN — The signature\
    \ type is unknown.\n- RPMSIG_BAD — The signature did not verify correctly.\n-\
    \ RPMSIG_NOKEY — The key required to check this signature is not available.\n\n\
    # Free Signature Read By rpmReadPackageInfo() — rpmFreeSignature()\n\n```\n#include\
    \ <rpm/rpmlib.h>\n#include <rpm/header.h>\n\nvoid rpmFreeSignature(Header h);\n\
    ```\n\nThis function frees the signature h.\n\n# 21.2.13 Header Manipulation\n\
    \nThe header is one of the key data structures in rpmlib. The functions in this\
    \ section perform basic manipulations of the header.\nThe header is actually a\
    \ data structure. It is not necessary to fully understand the actual data structure.\
    \ However, it is necessary to understand the basic concepts on which the header\
    \ is based.\nThe header serves as a kind of miniature database. The header can\
    \ be searched for specific information, which can be retrieved easily. Like a\
    \ database, the information contained in the header can be of varying sizes."
