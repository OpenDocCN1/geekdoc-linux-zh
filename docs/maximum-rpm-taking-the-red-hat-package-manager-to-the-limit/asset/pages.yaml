  md: '# # Appendix E


    # # Concise Spec File Reference


    # ## E.1 Comments


    Comments are a way to make RPM ignore a line in the spec file. To create a comment,
    enter an octothorp (#) at the start of the line. Any text following the comment
    character will be ignored by RPM:


    ```

    # This is the spec file for playmidiidi 2.3...

    ```


    Comments can be placed in any section of the spec file. See also: Section 13.1,
    page 165


    # ## E.2 The Preamble


    # ### E.2.1 Package Naming Tags


    The name Tag


    The name tag is used to define the name of the software being packaged. Name:
    cdplayer


    See also: Section 13.2.1, page 167


    The version Tag


    The version tag defines the version of the software being packaged. Version: 1.2


    See also: Section 13.2.1, page 167'
  merge: -1
  img_proc: true
- pgno: 425
  md: '# The release Tag


    The release tag can be thought of as the package’s version.

    Release: 5

    See also: Section 13.2.1, page 167


    # E.2.2 Descriptive Tags


    The %description Tag


    The %description tag is used to define an in-depth description of the packaged
    software. In the descriptive text, a space in the first column indicates that
    line of text should be presented to user as-is, with no formatting done by RPM.
    Blank lines in the descriptive text denote paragraphs.


    ```

    %description

    It slices!

    It dices!

    It’s a CD player that can’t be beat.

    ```


    By using the resonant frequency of the CD itself, it is able to simulate 20X oversampling.
    This leads to sound quality that cannot be equaled by more mundane software...


    The %description tag can be made specific to a particular subpackage by adding
    the subpackage name, and optionally, the -n option:

    %description bar

    %description -n bar

    The subpackage name and usage of the -n option must match those defined with the
    %package directive.

    See also: Section 13.2.2, page 168


    # The summary Tag


    The summary tag is used to define a one-line description of the packaged software.

    Summary: A CD player app that rocks!

    See also: Section 13.2.2, page 169


    # The copyright Tag


    The copyright tag is used to define the copyright terms applicable to the software
    being packaged.'
  merge: -1
  img_proc: true
