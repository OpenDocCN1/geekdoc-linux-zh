  md: '# Getting Information About Packages


    +   - Tags, with optional field width, formatting, iteration information.

    - Array Iterators.


    Let''s look at each of these components:


    Literal text Any part of a format string that is not associated with tags or array
    iterators will be treated as literal text. Literal text is just that: It''s text
    that is printed as it appears in the format string. In fact, a format string can
    consist of nothing but literal text, although the output wouldn''t tell us much
    about the packages being queried. Let''s give you --queryformat option to try,
    using a format string with nothing but literal text:


    ```

    # rpm -q --queryformat ''This is a test!'' rpm

    This is the test!!

    ```


    The RPM command might look a little unusual, but if you take out the --queryformat
    option, along with its format string, you''ll see this is just an ordinary query
    of the rpm package. When --queryformat option is present, RPM will use the text
    immediately following the option as a format string. In our case, the format string
    is ''This is a test!''. The single quotes are required. Otherwise, it''s likely
    your shell will complain about some of the characters contained in the average
    format string.


    The output of this command appears on the second line. As we can see, the literal
    text from the format string was printed exactly as it was entered.


    Carriage Control Escape Sequences Wait a minute. What is that # doing at the end
    of the output? Wait, that''s our shell prompt. You see, we didn''t direct RPM
    to move to a new line producing the output, so the shell prompt ended up being
    tacked to the end of our output.


    Is there a way to fix that? Yes, there is. We need to use an escape sequence.
    An escape sequence is a sequence of characters that starts with a backslash (\).
    Escape sequences add carriage control information to a format string. The following
    escape sequences can be used:


    +   - \a Produces a bell or similar alert.

    - \b Backspaces one character.

    - \f Outputs a form-feed character.

    - \n Outputs a newline character.

    - \r Outputs a carriage return character.

    - \t Causes a horizontal tab.

    - \v Causes a vertical tab.

    - \\ Displays a backslash character.'
