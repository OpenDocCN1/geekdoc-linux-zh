    31ZE55E1AP4B35Xhv27hdu/U9JKSKJ9/FXHCazBoPU+72Ylmf27QI7E0IHw

    822Z9NFA9S+8V1CMYpdA1+DeVdwjbjcDnU3/Z/ACY219U45Pmt0BSIJAUD

    BRaXcXUGQ60+IXMcSubABfA/9V1fQQYJIV4Hu51Nv7LWy4wx/SFTqCM

    1XdXJdoDrbVlYGWw6B6HES66Q01LI/VC3BY2IT4E6WHQOPADZ0ZPQ

    fdkIILUtaY/UARcsGT5YHuKWR3S+MgqJD2FUHXCIN1ArItse9m

    h7etYKadMEDef66/p6IInosQEB35C+sCIANNG01xS25C1C2RXmYF0

    ymuKS/SrvruJ00UIH4K4cV5TIfDI1A6uy6x5WvTR3S2XyrzXKLtMI2ZIq0j

    ffaqq7ME+XPM8N7TCAwkj1/1p09AEvKKIU64A1QMFEDEP6pZecN0r/H7EB

    jp4d/ib1F1fCZTA5QG60j1RxzW0MnrrN291Jdn3zuQ81/1b1V3yCyRIh

    NyvnpfTcCg9RhPI1aXd2574D/v7HHLrRC5xku7YT05SOGKT01F1Vb4XcmY

    HR2ZWSbtKe2eb5Z4K47A6uhvtPokV00Qwk9B-LPPKXv4

    --- PGP PUBLIC KEY BLOCK ---


    PGP uses two types of keys: public and private. The public key, as its name suggests,
    it can be shared with anyone. The key shown above is, in fact, a public key. The
    private key, as its name suggests, should be kept secret. PGP creates keys in
    pairs — one private and public. A public key must remain private; if one is lost,
    the other is by useless. Why? Because the two keys have an interesting property
    that can be exploited in two ways:


    +   - A message encrypted by a public key can only be decrypted with the corresponding-private
    key.

    - A message encrypted by a private key can only be decrypted with the corresponding-key.


    In the case of sending messages in total, the key pairs are used in the first
    manner. It allows people to exchange private messages without first exchanging
    any “secret codes”. The only requirement is that each know the other’s public
    key.


    However, for RPM, the second method is the important one. Let’s say a company
    needs to send you a document, and you’d like to make sure it really did come from
    them. If the company first encrypts the file with their private key and sent it
    to you, you would have an encrypted file you couldn''t read.


    Or could you? If you have the company’s public key, you should be able to decrypt
    it. In fact, if you can, you are sure that the message you received did not come
    from them!


    It is this feature that prove by RPM. By using PGP’s public key encryption, it
    is possible to not only provide a package file from a certain person or persons,
    but also that it was not changed somewhere along the line.


    Or at least that it didn''t make it to you unchanged.'
  merge: -1
  img_proc: true
- pgno: 456
  md: '# G.1 PGP - Privacy for Regular People


    # G.1.2 Are RPM Packages Encrypted?


    In a word, no. Rather than being encrypted, RPM package files possess a digital
    signature. This is a way of using encryption to attach a signature (again, basically
    a large number) to some information, such that:


    +   - The signature cannot be separated from the information. Any attempt to verify
    the signature against any other information will fail.

    - The signature can only be produced by one private key.


    In the case of RPM, the information signed is the contents of the .rpm file itself.
    A digital signature is just like a regular signature. It doesn’t obscure the contents
    of the document being signed, it provides a method of determining the authenticity
    of a document. Here is an example of a digital signature turned into printable
    text:


    ```

    ----BEGIN PGP SIGNATURE-----

    Version: 2.6.3a

    Charset: noconv

    ```


    ```

    iQVAwUBXVMGMFIA2NdXZHJZZAQFe4QAAZ0FQaZrHdH8o+zckIv1/4Abg4gE7cG0xE

    Z2JG9GWD2it4G+s1/IWEY64-9725JrkF4Ti2upAWTN2Pnb/x0G8WJQVKQZ

    mZCZnAaYQgFe8iiuAVFLChYeWj1Pqq0weGcCtjQIrrzmGxV7xXKoJus+6V

    rML3tXnSQda=

    ```


    ```

    ----END PGP SIGNATURE----

    ```


    # G.1.3 Do All RPM Packages Have Digital Signatures?


    Again, no. In a perfect world, every .rpm file would be signed. However, RPM has
    no formal requirement that this be the case. There is no requirement that you
    do anything with a signed .rpm file. Think of it as an extra feature that you
    can take advantage of, or not — it’s strictly your choice.


    # G.1.4 So Much to Cover, So Little Time


    PGP has a wealth of features, 99% of which we will not cover in this book. For
    more information on the basics of encryption, Applied Cryptography by Bruce Schneider,
    contains a wealth of information on the subject. For more details on PGP specifically,
    O’Reilly’s PGP: Pretty Good Privacy by Simon Garfinkel is an excellent reference.


    If you’d rather surf the Net, use your favorite World Web index to hunt for “crypto

    or “PGP”, and you’ll be in business.'
  merge: -1
  img_proc: true
- pgno: 457
  md: "# G.2 Installing PGP for RPM's Use\n\nTo use RPM's PGP-related capabilities,\
    \ you'll need PGP installed on your system. If it's installed already, you should\
    \ be able to flip to the chapters on verifying package signatures and signing\
    \ packages and be in business in a matter of minutes. Otherwise, read on a thumbnail\
    \ sketch of what's required to install PGP.\n\n# G.2.1 Obtaining PGP\n\nThe first\
    \ step in being to verify .rpm files is to get a copy of PGP. Unfortunately, this\
    \ is not quite as simple as it might read. The reason is that PGP is very controversial.\
    \ Why the controversy? It centers on PGP's primary mission — to provide a means\
    \ of communicating with others in complete privacy. As we've discussed, PGP uses\
    \ encryption to provide this privacy. Good encryption. Very good encryption. Encryption\
    \ so good, it appears some of the world's governments consider PGP a threat to\
    \ their national security.\n\n**Know Your Laws!** Various countries have different\
    \ stances on the use of \"strong encryption\" products such as PGP. In some countries,\
    \ possession of encryption software is strictly forbidden. Other countries attempt\
    \ to control the flow of encryption technology into (or out of) their country.\
    \ It is vital you know your country's laws, lest you find yourself in prison,\
    \ or possibly in front of a firing squad!\n\n**Patent/Licensing Issues Surrounding\
    \ PGP** Over and above PGP's legal status, there are other aspects to PGP that\
    \ people living in the U.S. and Canada should keep in mind:\n\n+   - PGP is free\
    \ for non-commercial use only. If you are going to use PGP for business purposes,\
    \ you should look into getting a commercial copy. PGP is marketed in the United\
    \ States:\n  Pretty Good Privacy, Inc.\n  2121 S. El Camino Real\n  Suite 902\n\
    \  San Mateo, CA 94403\n  Main: (415) 572-0240\n  Fax: (415) 572-1932\n  http://www.pgp.com/\n\
    \n+   - Part of the software that comprises PGP is protected by several United\
    \ States patents. Versions of PGP approved for use in the U.S. contain a licensed\
    \ version of this software, known as RAREF. RAREF includes a patent license that\
    \ allows the use of the software in noncommercial settings only. RSAREF requires\
    \ a separate license. This is one reason why there are restrictions on the commercial\
    \ use of PGP in the United States and Canada.\n\nWhile outside the U.S. and Canada\
    \ can use RAREF-based PGP, they will probably choose the so-called \"international\"\
    \ version. This version replaces RSAREF"
  merge: -1
  img_proc: true
- pgno: 458
  md: 'with software known as MPILIB. MPILIB is, in general, faster than RSAREF, but
    it cannot legally be used in the United States or Canada.


    To summarize, if you are using PGP for commercial purposes in the U.S. or Canada,
    you''ll need to purchase it. Otherwise, people living in the U.S. or Canada should
    use a version of PGP incorporating RSAREF. People in other countries can use any
    version of PGP they desire, though they''ll probably choose the MPILIB-based “international”
    version³.


    Getting RSAREF-based PGP The official source for the latest version of PGP based
    on RSAREF is the Massachusetts Institute of Technology. Due to the restrictions
    on export of encryption technology, the process is somewhat convoluted. The easiest
    way to obtain PGP from the official MIT archive is to use the World Wide Web.
    Point your browser at:


    ```

    http://web.mit.edu/network/pgp.html

    ```


    Simply follow the steps, and you''ll have the necessary software on your system
    in no time. There is a more cumbersome method that doesn''t use the Web. It involves
    first using anonymous ftp to obtain several files of instructions and license
    agreements. You will then be directed to use telnet to obtain the name of a temporary
    ftp directory containing the PGP software. You can use anonymous ftp to retrieve
    the software. To start this process, ftp to:


    ```

    net-dist.mit.edu

    ```


    Then change directory to:


    ```

    /pub/PGP

    ```


    Obtain a copy of the file README and follow the instructions in it exactly.


    If all this seems too much trouble, there is another alternative. You can find
    copies of PGP on just any BBS, FTP, or Web site advertising freely available software.
    We are aware, however, that “Floyd''s Storm Door and BBS Company” may not be as
    trustworthy a place at MIT to obtain encryption software. It''s a question of
    how paranoid you are.


    Outside the United States and Canada For people living in other countries, it
    is much easier to find PGP (depending on the legality of encryption software,
    course). Try any of the places you''d normally look for free software. Keep in
    mind, however, that you shouldn''t download PGP from any sites in the U.S. Doing
    so is considered an “export” of


    ³ Note that there are no commercial restrictions regarding PGP in countries other
    than the U.S. and Canada.'
  merge: -1
  img_proc: true
- pgno: 459
  md: '# 432                               An Introduction to PGP


    munitions, and can get the people responsible for the site in deep trouble. Wherever
    you

    eventually get PGP from, since the patents that complicate matters for the U.S.
    do not

    abroad apply, you''ll probably end up with the “international” versions of PGP.


    # G.2.2 Building PGP


    Building PGP is mostly a matter of following instructions. However, users of ELF-based

    Linux distributions (Such as Red Hat Linux) will find that PGP will not build.
    The problem,

    according to the PGP FAQ, is that two files do not properly handle the C preprocessor

    directives that affect support for ELF. The changes are to two files: 80386.S
    and matcha.S.\Near the beginning of each, you''ll find either a #ifndef or a #ifdef
    for SYSV. If you find:


    ```

    #ifndef SYSV

    ```


    It should be changed to read:


    ```

    #if !defined(SYSV) && !defined(_ELF_)

    ```


    If you find:


    ```

    #ifdef SYSV

    ```


    It should be changed to read:


    ```

    #if defined(SYSV) || defined(_ELF_)

    ```


    After making these changes, PGP should build with no problems.


    # G.2.3 Ready to Go!


    After building and installing PGP, you''re ready to start using RPM’s package
    signature

    capabilities. If your primary interest is in checking the signatures on packages
    built by

    some else, chapter 7 will tell you everything you need to know.


    On the other hand, if you are a package builder and would like to start signing
    packages,

    chapter 17 will have you signing packages in no time.'
  merge: -1
  img_proc: true
