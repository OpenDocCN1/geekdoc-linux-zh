    rename that to amanda-2.3.0-orig, and unpack the sources so follows:


    ```

    # ls

    total 177

    drwxr-xr-x 11 adm 1024 May 19 1996 amanda-2.3.0/

    -rw-r--r-- 1 root root 178646 Nov 20 10:42 amanda-2.3.0.tar.gz

