- pgno: 376
  md: "# A.2 RPM File Format\n\n+   - The header.\n\"- The archive.\"\n\nPackage files\
    \ are written to disk in network byte order. If required, RPM will automatically\
    \ convert to host byte order when the package file is read. Let's take a look\
    \ at each section, with the lead.\n\n# A.2.2 The Lead\n\nThe lead is the first\
    \ part of an RPM package file. In previous versions of RPM, it was used to store\
    \ information used internally by RPM. Today, however, the lead's sole purpose\
    \ is to make it easy to identify an RPM package file. For example, the file(1)\
    \ command uses the lead.¹¹ All the information contained in the lead has been\
    \ duplicated or superseded by information contained in the header.\n\nRPM defines\
    \ a C structure that describes the lead:\n\n```\nstruct rpmlead {\n  unsigned\
    \ char magic[4];\n  unsigned char major, minor;\n  short type;\n  short archnum;\n\
    \  char name[66];\n  short osnum;\n  short signature_type;\n  char reserved[16];\n\
    }\n```\n\nLet's take a look at an actual package file and examine the various\
    \ pieces of data that make up the lead. In the following display, the number to\
    \ the left of the colon is the byte offset, in hexadecimal, from the start of\
    \ the file. The eight groups of four characters show the hex value of the bytes\
    \ in the file — two bytes per group of four characters. Finally, the characters\
    \ on the right show the ASCII values of the data bytes. A dot (\".\") is inserted\
    \ instead. Here are the first thirty-two bytes of a package file — in this case\
    \ the package file rpm-2.2.1.1386.rpm:\n\n```\n00000000: eadb eeb 0300 0001 0000\
    \ 7270 64d2 322e ................rpm-2.\n00000010: 322e 312d 3100 0000 0000 0000\
    \ 0000 2.1-...................\n```\n\nThe first four bytes (eadbeeb) are the\
    \ magic values that identify the RPM package file. Both the file command and RPM\
    \ use these magic numbers to determine whether a file is legitimate or not\n\n\
    > ¹Please refer to section A.4 on page 361 for identifying RPM package files with\
    \ the file command.\n²The header is discussed in section A.2.5 on page 356."
