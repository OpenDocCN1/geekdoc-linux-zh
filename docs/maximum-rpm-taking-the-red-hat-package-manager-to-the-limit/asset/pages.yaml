- pgno: 332
  md: "# 20.4 Package Building\n\nFirst, we start the script with a %post statement,\
    \ and indicate that this script is for the client subpackage. As the comments\
    \ indicate, we only want to perform the following tasks if this is the first time\
    \ the client subpackage has been installed. To do this, we use the first and only\
    \ argument passed to the script. it is a number indicating how many instances\
    \ of this package will be installed after the current installation is complete.\n\
    \nIf the argument is equal to 1, that means that no other instances of the client\
    \ subpackage are presently installed, and that one is for the first. Let's continue:\n\
    \n+   # Set disk devices so that bin can read them\n# (This is actually done on\
    \ Red Hat Linux; only need to add bin to\n# group disk\n\n```\nif grep \"disk::.*bin\"\
    \ /etc/group > /dev/null\nthen\n  true\n```\n\n+   # If there are any members\
    \ in group disk, add bin after a comma,\nsed -e 's/disk::[0-9]\\{1,\\}/\\1,\\\
    /\\1,bin/' /etc/group > /etc/group.tmp\n\n+   # If there are no members in group\
    \ disk, add bin.\nsed -e 's/disk::[0-9]\\{1,\\}/\\1,bin/' /etc/group.tmp > /etc/group\n\
    \n```\n# clean up!\nrm -f /etc/group.tmp\n```\n\nOne of amanda's requirements\
    \ is that the user ID running the dumps on the client needs to be able to read\
    \ from every disk's device file. The folks at Red Hat have done half the work\
    \ for us by creating a group disk and giving that group read/write access to every\
    \ disk device. Since our dumpiser is bin, we only need to add bin to the disk\
    \ group. Two lines of sed, and we're done!\n\nThe next section is related to the\
    \ last. It focuses on making sure bin can access everything it needs while doing\
    \ backups:\n\n+   # Also set /etc/dumpdates to be writable by group disk\n\n```\n\
    chgrp disk /etc/dumpdates\nchmod g+w /etc/dumpdates\n```\n\nAmanda uses dump to\
    \ back up the backups, and since dump keeps track of the backups in /etc/dumpdates,\
    \ it's only natural that bin will read/write access to the file. In a perfect\
    \ world, /etc/dumpdates would have already been set to allow group disk to read\
    \ and write, but we have to do it ourselves. It's not a big problem, though"
  merge: -1
  img_proc: true
- pgno: 333
  md: "Next, we need to create the appropriate network-related entries, so that amanda\
    \ clients communicate with amanda servers, and vice versa:\n\n# # Add amanda line\
    \ to /etc/services\n\n```\nif grep \"amanda\" /etc/services >/dev/null\nthen\n\
    \    true\nelse\n    echo amanda 10080/udp # Added by package amanda-client >>\n\
    \    /etc/services\n```\n\nBy using grep to look for lines that begin with the\
    \ letters amanda, we can easily see if /etc/services is already configured properly.\
    \ It isn't, we simply append a line to the end.\n\nWe also added a comment to\
    \ sysadmins who will know where the entry came from, and either take our word\
    \ for it or issue an rpm -q --scripts amanda-client command and see for themselves.\
    \ We did it all on one line because it makes the script simpler.\n\nLet's look\
    \ at the rest of the network-related part of this script:\n\n# # Add amanda line\
    \ to /etc/inetd.conf\n\n```\nif grep \"amanda\" /etc/inetd.conf >/dev/null\nthen\n\
    \    true\nelse\n    echo \"amanda dgram udp wait bin /usr/lib/amanda/amandad\
    \ amanda\nadded by package amanda-client\" >>/etc/inetd.conf\n```\n\n# # Kick\
    \ inetd\n\n```\nif [ -f /var/run/inetd.pid ];\nthen\n    kill -HUP 'cat /var/run/inetd.pid'\n\
    fi\nfi\nfi\n```\n\nWe've used the same approach to add an entry to /etc/inetd.conf.\
    \ We then hup inetd so the change will take effect, and we're done!\n\nOh, and\
    \ that last fi at the end? That's to close the if [ \"$1\" = 1 ] at the start\
    \ of the script. Now let's look at the server's post-install script:\n\n# %post\
    \ server"
