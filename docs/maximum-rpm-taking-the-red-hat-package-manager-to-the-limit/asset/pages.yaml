  md: '# 7.3 Using rpm -K


    Current time: 1996/06/01 22:50 GMT


    Looking for new keys...

    pub 1024/CBA29BF9 1996/02/20 Red Hat Software, Inc. <redhat@redhat.com>


    Checking signatures...


    Keyfile contains:

    1 key(s)


    One or more of the new keys are not fully certified.

    Do you want to certify any of these keys yourself (y/N)? n


    Here we''ve added Red Hat Software''s public key, since we''re going to check
    some package files produced by them. The file RPM-PGP-KEY contains the end. At
    the end, PGP asks us if we want to certify the new key. We answered "no" since
    it isn''t necessary to certify keys package files.


    Next, we''ll verify a package file:


    ```

    # rpm -K rpm-2.3-1.i386.rpm

    rpm-2.3-1.i386.rpm: size pg md5 OK

    #

    ```


    While the output might seem somewhat anti-climactic, we can now be nearly 100%
    certain this package:


    +   1. was produced by Red Hat Software, Inc.

    2. is unchanged from their original copy.


    The output from this command shows that there are actually three distinct features
    of the package file that are checked by the -K option:


    +   1. The size message indicates that the size of the packaged files has not
    changed.

    2. The pgpg message indicates that the digital signature contained in the package
    file is a valid signature of the package file contents, and was produced by the
    organization that originally signed the package.

    3. The md5 message indicates that a checksum contained in the package file and
    calculated when the package was built, matches a checksum calculated by RPM during
    verification. Because the two checksums match, it is unlikely that the package
    has been modified.'
