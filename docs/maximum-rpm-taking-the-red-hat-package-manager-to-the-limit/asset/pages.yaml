- pgno: 390
  md: "# Appendix B\n\n# The rpmrc File\n\nThe rpmrc file is used to control RPM's\
    \ actions. The file's entries have an effect on nearly every aspect of RPM's operations.\
    \ Here, we describe the rpmrc files in more detail, as well as the command used\
    \ to show how RPM interprets the files.\n\n# B.1 Using the --showrc Option\n\n\
    We'll see in a moment, RPM can read more than one rpmrc file, and each file can\
    \ contain nearly thirty different types of entries. This can make it difficult\
    \ to determine what values RPM is actually using.\nLuckily, there's an option\
    \ that can be used to help make sense of it all. The --showrc option displays\
    \ the value for each of the entries. The output is divided into two sections:\n\
    \n+   1. Architecture and operating system values.\n2. rpmrc values.\n\nThe architecture\
    \ and operating system values define the architecture and operating system that\
    \ RPM is running on. These values define the environment for both building and\
    \ installing packages. They also define which architectures and operating systems\
    \ are compatible with each other.\n\nThe rpmrc values define many aspects of RPM's\
    \ operation. These values range from the path to RPM's database, to the name of\
    \ the person listed as having built the package.\n's an example of --showrc output:\n\
    \n```\n# rpm --showrc\nARCHITECTURE AND OS:\n  build arch      : i386\n  build\
    \ os        : Linux\n```"
  merge: -1
  img_proc: true
