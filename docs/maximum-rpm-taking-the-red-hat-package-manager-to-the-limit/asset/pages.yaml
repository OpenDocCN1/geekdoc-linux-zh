- pgno: 400
  md: '# B.4 rpmrc File Entries


    The netsharedpath entry is used to define one or more paths that, on the local
    system, are shared with other systems. If more than one path is specified, they
    must be separated with colons.


    # B.4.18 optflags


    Default value: (architecture-specific)


    The optflags entry is used to define a standard set of options that can be used
    during the build process, specifically during compilation.

    The format of the optflags entry is slightly different from most other rpmrc file
    entries. Instead of the usual `<name>:<value>` format, the optflags entry looks
    like this:

    optflags:<architecture> <value>


    For example, assume the following optflags entries were placed in an rpmrc file:

    optflags: i386 -02 -m486 -fno-strength-reduce

    optflags: sparc -02


    If RPM was running on an Intel 80386-compatible architecture, the optflags value
    would be set to -02 -m486 -fno-strength-reduce. If, however, RPM was running on
    a Sun SPARC-based system, optflags would be set to -02.

    This entry sets the RPM_OPT_FLAGS environment variable, which can be used in the
    %prep, %build, and %install scripts.


    # B.4.19 packager


    Default value: (none)


    The packager entry is used to define the name and contact information for the
    individual responsible for building the package. The contact information is traditionally
    defined in the following format:

    packager:Erik Troan <ert@redhat.com>


    # B.4.20 pgp_name


    Default value: (none)


    The pgp_name entry is used to define the name of the PGP public key that will
    be used to sign each package built. The value is not case sensitive, but the key
    name entered here must match the actual key in every other aspect.'
