    Looking at the section labeled Executing: special doc, we find that RPM is doing
    something for us. It starts by making sure there is no pre-existing documentation
    directory. Next, RPM creates the documentation directory and copies files into
    it.


    The remainder of this action is identical to that of a package being built without
    a build root being specified. However, although the output is identical, there
    is one crucial difference. When the binary package is created, RPM prepends the
    build root path first, instead of using each in the %files list verbatim. If this
    wasn''t, RPM would attempt to find the files, relative to the system''s root directory,
    and would, of course, because of the automatic prepending of the build root, it''s
    important to not include the root path in any %files list entry. Otherwise, the
    files would not be found by RPM, and the build would fail.


    Although RPM has to go through a bit of extra effort to locate the files to be
    packaged, the resulting binary package is indistinguishable from the same package
    created without a build root.


    # 16.1.1 Some Things to Consider


    Once the modifications have been made to support a build root, it''s necessary
    for the package builder to keep some issues in mind. The first is that the build
    root specified in the spec file can be the build root (and therefore, the value
    of $RPM_BUILD_ROOT) to one of the following values:


    +   - The value of buildroot in the spec file.


    +   - The value of buildroot in rpmprc


    +   - The value following the --buildroot option on the command line.


    Because of this, it''s important that the spec file and the Makefile be written
    in such a way that no assumptions about the build root are made. The main issue
    is that the build root must not be hard-coded anywhere. Always use the RPM_BUILD_ROOT
    environment variable!


    Another issue to keep in mind is cleaning up after the build. Once software builds
    and is packaged successfully, it''s probably longer necessary to leave the build
    root in place. Therefore, it''s a good idea to include the necessary commands
    in the spec file''s %clean section: Here''s an example:'
