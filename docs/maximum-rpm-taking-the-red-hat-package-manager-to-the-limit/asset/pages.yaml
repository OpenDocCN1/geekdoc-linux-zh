- pgno: 142
  md: '# Chapter 9


    # The Philosophy Behind RPM


    As we saw in the first half of this book, RPM can make life much easier for the
    user. With automated installs, upgrades, and erasures, RPM can take a lot of the
    guesswork out of keeping a computer system up-to-date.


    But what about people that sling code for a living? Does RPM have anything to
    offer them? The answer is yes! One of the best things about RPM is although it
    was designed to make life easier for users, it was written by people that would
    be using it to build many packages. So the design philosophy of RPM has a definite
    bias toward making life easier for developers. Here are some of the reasons you
    should consider building packages with RPM:


    # 9.1 Pristine Sources


    While many developers might use RPM to package their own software, just as, if
    not more, because of this there are some aspects to RPM''s design that are geared
    toward "third-party" package builders. One such aspect is RPM''s use of "pristine"
    sources.


    When a third-party package builder decides to package someone else''s software,
    they often get the software from the Net, as a tar file compressed with something
    like GNU zip. That''s probably the only generalization we can make when talking
    about software that is eligible for packaging. Once we look inside the tar file,
    there are a world of possible differences:


    +   - The application could be available in pure source form, in pure binary form,
    or some combination of both.


    +   - The application might have been written to be built using make, imake, or
    a script included with the sources. Or, it might have to be built entirely by
    hand.


    +   - The application might need to be configured before use. Maybe it uses GNU
    configure, a custom configuration script, or one or more files that need to be
    edited to reflect the target environment.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# The Philosophy Behind RPM


    +   * The application might have been written to reside in specific directories,
    and those directories do not exist, or are not appropriate on the target system.


    +   * The application might not even support the target environment, requiring
    all manner of changes to port it to the target environment.


    We could go on, but you probably get the idea. It’s a rare application that comes
    off the Net to package, and the changes required widely. What to do?


    This is where the concept of pristine sources come in. RPM has been designed to
    use the sources as the application’s developer, no matter how it has been packaged
    and configured. The main benefit is that the changes as a package builder need
    to make, remain separate from the original sources, in a distinct collection of
    patches.


    This may not sound much like an advantage, but consider how this would work if
    a new version of the application came out. If the new version had a few localized
    fixes, it’s entirely possible the original patches could be applied, and a new
    package built, with a single RPM command. Even if the patches didn’t apply cleanly,
    it would at least give an indication as to what needs to be done to get the new
    version built and packaged.


    If your users customize packages, pristine sources makes it easier for them, too.
    They can see what patches you’ve created and can add their own.


    Another benefit to using pristine sources is that it makes track of multiple versions
    of a package simple. Instead of keeping patched sources around, or battling a
    revision control system, it’s necessary to keep:


    +   * The original sources in their tar file.


    +   * A copy of the patches you applied to get the application to build.


    +   * A file used by RPM to control the package building process.


    With these three items, it’s possible to easily build the package at any time.
    Keeping track of multiple versions only keeps track of each version of these three
    components, rather than hundreds or thousands of patched source files.


    In fact, it gets better build a source package containing these three components.
    The source package, named using RPM’s standard naming convention, keeps everything
    you need to recreate a specific version of a package, in one uniquely named file.
    Keeping track of multiple versions of multiple package is simply a matter of keeping
    the appropriate source packages around. Everything else can be built from them.


    # 9.2 Easy Builds


    RPM makes it easy to build packages. Just as with the use of pristine sources,
    the fact that the build process is simple is an even greater advantage to the
    third-party package builders responsible for many packages, than to a one-package
    software development house. But in either case, RPM’s ease of building is a welcome
    relief. The following sections document some of the ways that RPM makes making
    packages a straightforward process.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 9.3 Multi-architecture/operating system Support


    # 9.2.1 Reproducible Builds


    One of the biggest problems facing developers is reproducing a particular build.
    This single problem is the main reason so much effort is put into creating and
    deploying version control systems to manage sources.


    While RPM cannot compete with a full-blown version control system, it does an
    excellent job of keeping in one place everything required to build a particular
    version of a package. Remember the source package we mentioned above? With one
    command, RPM can open the package, extract the sources, patch them, perform a
    build, and create a new package, ready for your users. The best part is that the
    binary package will be the same every time you use it because everything needed
    to create it is kept in source package.


    # 9.2.2 Unattended Builds


    As mentioned above, completely building a package takes only one RPM command.
    This makes it easy to set up automated build procedures that can build hundred
    packages as easily as one. Anything from a single package consisting of one application
    to the several hundred packages that comprise an entire operating system, can
    be built automatically using RPM.


    # 9.3 Multi-architecture/operating system Support


    It has become a fact of life for software developers that their applications need
    to be ported to multiple operating systems. It is also becoming more common that
    a particular operating system might run on different platforms, or architectures.


    RPM''s ability to support multiple architectures and operating systems makes it
    easy to build the same package for many OS/platform combinations. A package may
    be configured to build on only one architecture/OS combination, or on several.
    The only limitation is the application''s portability.


    # 9.4 Easier For Your Users


    While we are primarily concerned with RPM''s advantages from the developer''s
    point of view, it''s worth looking at RPM from the user''s standpoint for a moment.
    After all, if RPM makes life easier for your users, that can translate to lower
    support costs.


    # 9.4.1 Easy Upgrades


    Probably yet the biggest headache for user and developer alike is the upgrade
    of an application, or worse yet, an entire system! RPM can make upgrading a one-step
    process. With one command, a new package can be installed, and the remnants of
    the old package removed.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# 9.4.2 Intelligent Configuration File Handling


    Configuration files nearly every application has them. They may go by different
    names, but they all control the behavior of their application. Users normally
    customize files to their liking and would be upset if their customizations were
    lost during the installation, upgrade, or removal of a package.


    RPM takes special care for a user''s config files. By using MD5, RPM can determine
    what action is most appropriate with a config file. If a config file has been
    modified by the user and has to be replaced, it is saved. That way a user''s modifications
    are never lost.


    # 9.4.3 Powerful Query Capabilities


    RPM uses a database to keep track of all files it installs. RPM''s database provides
    other benefits, such as the variety of information that can be easily retrieved
    from it. RPM''s query command makes it easy for users to quickly answer a number
    of questions, such as


    +   - Where did this file come from? Is it part of a package?

    - What does this package do?

    - What packages are installed on my system?


    These are just a few of the many ways RPM can provide information about one or
    more packages on a user''s system.


    # 9.4.4 Easy Package Verification


    Another way that RPM leverages the information stored in its database, is by providing
    an easy to verify that a package is properly installed. With this capability,
    RPM makes it easy to determine, for example, what packages were damaged by a wildcard
    delete in /usr/bin. In addition, RPM''s verification command can detect changes
    to file attributes, such as a file''s permissions, ownership, and size.


    # 9.5 To Summarize...


    RPM was written by developers for developers. It makes building packages as easy
    as possible, even if the software being packaged hasn''t been developed in-house.
    In addition, RPM presents some significant advantages to users, thereby reducing
    support needs.


    In the next chapter, we''ll introduce the basic concepts of package building with
    RPM.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Chapter 10


    # The Basics of Developing With RPM


    Now that we''ve seen the design philosophy of RPM, let''s look at the nuts and
    bolts of RPM''s build process. Building a package is similar to compiling code
    engine that does the dirty work, and outputs.


    # 10.1 The Inputs


    There are three different kinds of inputs that are used to drive RPM''s build
    process. Two of the three inputs are required, and the third, strictly speaking,
    is optional. But unless you''re packaging your own code, chances are you''ll need
    it.


    # 10.1.1 The Sources


    First and foremost, are the sources. After all, without them, there wouldn''t
    be much to build! In the case of packaging someone else''s software, the sources
    should be kept as the author distributed them, which usually means a compressed
    tar file. RPM can handle other formats, but a bit more up-front effort is required.


    In any case, you should not modify the sources used in the package building process.
    If you''re a third-party package builder, that means the sources should be the
    way you get them from the author''s FTP site. If it''s your own software, the
    choice is up to you, but you should consider starting with your mainstream sources.


    # 10.1.2 The Patches


    Why all the emphasis on unmodified sources? Because RPM gives you the ability
    to automatically apply patches to them. Usually, the nature of these patches falls
    into one of the'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 120


    # The Basics of Developing With RPM


    following categories:


    +   - The patch addresses an issue specific to the target system. This could include
    changing makefiles to install the application into the appropriate directories,
    or resolving cross-platform conflicts, as replacing BSD system calls with their
    SYSSV counterparts.

    - The patch creates files that are normally created during a configuration step
    in the installation process. Many times, it''s necessary to edit configuration
    files or scripts in order to set up things for compilation. In other cases, a
    configuration utility needs to be run before the sources are compiled. In either
    instance, the patches create the environment required for proper compilation.


    # Creating the Patches


    While it might sound a bit daunting to take into account the types of patches
    outlined above, it''s quite simple. Here''s how it''s done:


    +   1. Unpack the sources.

    2. Rename the top-level directory. Make it end with "orig", for example.

    3. Unpack the sources again, leaving the top-level directory name unchanged.


    The source tree that you created the second time will be the one you''ll use to
    get the software to build.


    If the software builds with no changes required, great you won''t need a patch.
    But if you had to make any changes, you''ll have to create a set of patches. To
    do so, simply clean the source tree of binaries. Then, issue a recursive diff
    to compare the source tree you used for the build, against the original, unmodified
    source tree. It''s as easy as that!


    # 10.1.3 The Spec File


    The spec file is at the heart of RPM''s packaging building process. Similar in
    concept to a gọi, it contains information required by RPM to build the package,
    as well as instructions telling RPM how to build it. The spec file also dictates
    exactly what files are part of the package, and where they should be installed.


    As you might imagine, with this many responsibilities, the spec file format can
    be a bit complex. However, it''s broken into several sections, making it easier
    to handle. All told, there are eight sections:


    The Preamble preamble contains information that will be displayed when users request
    information about the package. This would include a description of the package''s
    function, the version number of the software, and so on. Also in the preamble
    lines identifying sources, patches, and even an icon to be used if the package
    is manipulated by graphical interface.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 10.1 The Inputs


    The Prep Section The prep section is where the actual work of building a package
    starts. As the name implies, this section is where the necessary preparations
    are made prior to the actual building of the software. In general, if anything
    needs to be done to the sources prior to building the software, it needs to happen
    in the prep section. Usually, this boils down to unpacking the sources.


    The contents of this section are an ordinary shell script. However, RPM does provide
    two macros to make life easy. One macro can unpack a tar file and cd into the
    source directory. The other macro easily applies patches to the unpacked sources.


    The Build Section Like the prep section, the build section consists of a shell
    script. As you might guess, this section is used to perform whatever commands
    are required to actually compile the sources. This section could consist of a
    single make command, or be more complex if the build process requires it. Since
    most software is built today using make, there are no macros available in this
    section.


    The Install Section Also containing a shell script, the install section is used
    to perform the commands required to actually install the software. If the software''s
    author added an install target in the makefile, this section might only consist
    of a make install command. Otherwise, you will need to add the usual assortment
    of cp, mv, or install commands to the job done.


    Install and Uninstall Scripts While the previous sections contained either information
    required by RPM to build the package, or the actual commands to do the deed, this
    section is different. It consists of scripts that will run, on the user''s system,
    when the package is actually installed or removed. RPM can execute a script:


    +   - Prior to the package being installed.

    - After the package has been installed.

    - Prior to the package being erased.

    - After the package has been erased.


    One example of this capability would be required when a package contains shared
    libraries. In this case, ldconfig would need to be run after the package is installed
    or erased. Another example, if a package contains a shell, the file /etc/shells
    would need to be updated appropriately when the package was installed or erased.


    The Verify Script This is another script that is executed on the user''s system.
    It is executed when RPM verifies the package''s proper installation. While RPM
    does most of the work verifying packages, this script can be used to verify aspects
    of the package that are beyond RPM''s capabilities.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 122 The Basics of Developing With RPM


    The Clean Section Another script that can be present is a script that can clean
    things after the build. This script is rarely used, since RPM normally does a
    good job of clean-up in most build environments.


    The File List The last section consists of a list of files that will comprise
    the package. Additionally, a number of macros can be used to control file attributes
    when installed, as well as to denote which files are documentation, and which
    contain configuration information. The file list is very important — if it is
    missing, no package will be built.


    # 10.2 The Engine: RPM


    At the center of the action is RPM. It performs a number of steps during the build
    process:


    +   * Executes the commands and macros in the prep section of the spec file.

    * Checks the contents of the file list.

    * Executes the commands and macros in the build section of the spec file.

    * Executes the commands and macros in the install section of the spec file. Any
    macros in the file list are executed at this time, too.

    * Creates the binary package file.

    * Creates the source package file.


    By using different options on the RPM command line, the build process can be stopped
    at any of the steps above. This makes the initial building of a package that much
    easier, as it is then possible to see whether each step completed successfully
    before continuing on to the next step.


    # 10.3 The Outputs


    The end product of this entire process is a source package file and a binary package
    file.


    # 10.3.1 The Source Package File


    The source package file is a specially formatted archive that contains the following
    files:


    +   * The original compressed tar file(s).

    * The spec file.

    * The patches.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Since the source package contains everything needed to create the binary package,
    the source package, and provide the original sources, it''s a great way to distribute
    source code. As mentioned earlier, it''s also a great way to archive all the information
    needed to rebuild a particular version of the package.


    # ## 10.3.2 The Binary RPM


    The binary package file is the one part of the entire RPM building process that
    is most visible to the user. It contains the files that comprise the application,
    along with any additional information needed to install and erase it. The binary
    package file is where the “rubber hits the road.”


    # ## 10.4 And Now...


    Now that we''ve seen, in broad brush terms, the way RPM builds packages, let''s
    take a look at an actual build. The next chapter will do just that, showing how
    simple it can be to build a package.'
  merge: -1
  img_proc: true
