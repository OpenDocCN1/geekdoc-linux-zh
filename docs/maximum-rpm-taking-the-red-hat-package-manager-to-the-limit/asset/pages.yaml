- pgno: 377
  md: 'The next two bytes (0300) indicate RPM file format version. In this case, the
    file''s major version number is 3, and the minor version number is 0. Versions
    of RPM later than 2.1 create version 3.0 package files.


    The next two bytes (0000) determine what type of RPM file the file is. There are
    presently two types defined:


    +   - Binary package file (type = 0000)

    - Source package file (type = 0001)


    In this case, the file is a binary package file.

    The next two bytes (0001) are used to store the architecture that the package
    was built for. In this case, the number 1 refers to the i386 architecture.In the
    case of a source package file, these two bytes should be ignored, as source packages
    are not built for a specific architecture.


    ```

    rpm-2.2.1-1

    ```


    Since the name rpm-2.2.1-1 is shorter than the sixty-five bytes allocated for
    the name, the leftover bytes are filled with nulls.

    Skipping the past space allocated for the name, we see two bytes (0001):


    ```

    00000040: 0000 0000 0000 0000 0000 0001 0000 0005

    00000050: 0400 0000 24e1 ffbf 66b3 0008 00e6 ffbf ......k...

    ```


    These bytes represent the operating system which this package was built. In this
    case, 1 equals Linux. With the architecture-to-number translations, the operating
    system and corresponding code number can be found in the file, /usr/lib/rpmrc.

    The next two bytes (0005) indicate the type of signature used in the file. A type
    5 signature is new to version 3 RPM files. The signature appears next in the file,
    but we need to discuss an additional detail before exploring the signature.


    # A.2.3 Wanted: A New RPM Data Structure


    By looking at the C structure that defines the lead, and matching it with the
    bytes in an actual file, it''s trivial to extract the data from the lead. From
    a programming standpoint, it''s also easy to manipulate data in the lead—It''s
    simply a matter of using the element names from the structure. But there''s a
    problem. And because of problem the lead is no longer used by RPM.


    > ³It should be noted that the architecture used internally by RPM is actually
    stored in the header. This is vital when searching for file(1)''s use.'
