    # 1.4.2 Labels And Names: Similar, But Distinct


    Package labels are used internally by RPM. For example, if you ask RPM to list
    every installed package, it will respond with a list of package labels. When a
    package file is created, part of the filename consists of the package label. There
    is no technical requirement for this, but it does make it easier to keep track
