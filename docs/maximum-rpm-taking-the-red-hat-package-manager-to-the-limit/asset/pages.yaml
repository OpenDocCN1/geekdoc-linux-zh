- pgno: 479
  md: '# maximum rpm


    From an introduction to software package management to the step-by-step examples
    of the Red Hat Package Manager in daily use; you''ll learn how to install and
    upgrade packages, perform sophisticated RPM database queries, and verify your
    RPM-based system. In addition to covering packages from the user perspective,
    Maximum RPM tells you how to build your own RPM packages. You''ll learn the right
    way to build RPM packages that are easy to use and maintain.


    Written in cooperation with Marc Ewing and Erik Troan, the developers of the RPM
    technology, Maximum RPM is the official, definitive technical reference to the
    RPM system. It provides accurate and detailed coverage of RPM''s history, philosophy,
    usage, and internals, from both the user and package perspectives.


    For seasoned RPM packagers, this volume covers many advanced packaging techniques,
    including:


    +   - relocatable packages

    - building packages without root access

    - package dependencies

    - using the RPM library

    - supporting multiple architectures


    RPM currently runs on Linux, IRIX, Solaris, SunOS, AIX, HP/UX, AmigaOS, and FreeBSD,
    and is quickly becoming the de-facto packaging standard for free software on the
    Internet.


    Edward Bailey is an operating systems specialist with over fifteen years of UNIX
    and Linux experience. He currently provides high-level systems support at the
    National Institute of Environmental Health Sciences, in Red Triangle Park, NC.


    ![](img/79f5db8841a8b87ef6f1474946ec14ad_479_0.png)


    ![](img/79f5db8841a8b87ef6f1474946ec14ad_479_1.png)'
  merge: -1
  img_proc: true
