- pgno: 437
  md: '# 410 Concise Spec File Reference


    See also: Section 13.6.1, page 200


    # The %verify Directive


    The %verify directive is used to control which of nine different file attributes
    are to be verified by RPM. The attributes are:


    +   1. owner — The file''s owner.

    2. group — The file''s group.

    3. mode — The file''s mode.

    4. md5 — The file''s MD5 checksum.

    5. size — The file''s size.

    6. maj — The file''s major number.

    7. min — The file''s minor number.

    8. symlink — The file''s symbolic link string.

    9. mtime — The file''s modification time.


    If the keyword not precedes the list, every attribute except those listed will
    be verified.

    `%verify(mode md5 size min symlink mtime) /dev/ttyS0


    See also: Section 13.6.1, page 200


    # E.6.2 Directory-related Directives


    # The %docdir Directive


    The %docdir directive is used to add the specified directory to RPM''s internal
    list of directories containing documentation. When a directory is added to this
    list, every file packaged in this directory (and any subdirectories) will automatically
    be marked as documentation.

    See also: Section 13.6.2, page 201


    # The %dir Directive


    The %dir directive is used to direct RPM to package only the directory itself,
    regardless of what files may reside in the directory at the time the package is
    created.

    `%dir /usr/blather

    See also: Section 13.6.2, page 203'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# E.7 The %package Directive


    The %package directive is used to control the creation of subpackages. The subpackage
    name is derived from the first name tag in the spec file, followed by the name
    specified after the %package directive. Therefore, if the first name tag is:


    Name: foo


    and a subpackage is defined with the following %package directive:


    %package bar


    the subpackage name will be foo-bar.


    See also: Section 13.7, page 204


    # E.7.1 The %package -n Option


    The -n option is used to change how RPM derives the subpackage name. When the
    -n option is used, the name following the %package directive becomes the complete
    subpackage name. Therefore, if a subpackage is defined with the following %package
    directive:


    %package -n bar


    the subpackage name will be bar.


    See also: Section 13.7.1, page 205


    # E.8 Conditionals


    The %if conditionals are used to begin a section of the spec file that is specific
    to a particular architecture or operating system. They are followed by one or
    more architecture or operating system specifiers, separated by commas or whitespace.


    Conditionals may be nested within other conditionals, provided that the inner
    conditional is completely enclosed by the outer conditional.


    The %ifarch Conditional


    If the build system''s architecture is specified, the part of the spec file following
    the %ifarch, but before a %else or %endif will be used during the build.


    %ifarch i386 sparc


    See also: Section 13.8, page 206


    The %ifnarch Conditional


    If the build system''s architecture is specified, the part of the spec file following
    the %ifnarch but before a %else or %endif will not be used during the build.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '412


    Concise Spec File Reference


    %ifnarch i386 sparc


    See also: Section 13.8, page 207


    # The %ifos Conditional


    If the build system is running one of the specified operating systems, the part
    of the spec file following the %ifos but before a %else or %endif will be used
    during the build.


    %ifos linux


    See also: Section 13.8, page 207


    # The %ifnos Conditional


    If the build system is running one of the specified operating systems, the part
    of the spec file following the %ifnos but before a %else or %endif will not be
    used during the build.


    %ifnos linux


    See also: Section 13.8, page 207


    # The %else Conditional


    The %else conditional is placed between a %if conditional of some persuasion,
    and an %endif. It is used to create two blocks of spec file statements, only one
    of which will be used in any given case.


    ```

    %ifarch alpha

    make RPM_OPT_FLAGS="$RPM_OPT_FLAGS -I ."

    %else

    make RPM_OPT_FLAGS="$RPM_OPT_FLAGS"

    %endif

    ```


    See also: Section 13.8, page 207


    # The %endif Conditional


    An %endif is used to end a conditional block of spec file statements. The %endif
    is always needed after a conditional, otherwise, the build will fail.


    ```

    %ifarch i386

    make INTEL_FLAG=-DINTEL

    %endif

    ```


    See also: Section 13.8, page 207'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# Appendix F


    # RPM-related Resources


    There are a number of resources available to help you with RPM, over and above
    the RPM man page, and this book. Here are some pointers to them.


    # F.1 Where to Get RPM


    Perhaps before asking, Where can I get RPM? it might be better to see if RPM is
    already installed on your system. If you have Red Hat Linux on your system, it''s
    there already. But be sure to check on other systems – people are porting RPM
    to different systems every day, and it just might be waiting for you.


    Here''s a quick way to see if RPM is installed on your system:


    ```

    % rpm --version

    RPM version 2.3

    %

    ```


    If this command doesn''t work, it might be that your path doesn''t include the
    directory where RPM resides. Check the usual "binary" directories before declaring
    RPM a no-show!


    # F.1.1 FTP Sites


    If you can''t find RPM on your system, you''ll have to grab a copy by FTP. RPM
    can be found practically anywhere Red Hat Linux is available. While the most obvious
    site, ftp.redhat.com, is certainly an option, it might not be your best choice.
    For one, it can be very busy. For another, unless your link to the Internet is
    near Red Hat''s sprawling development camp in Durham, North Carolina, there''s
    probably an FTP site that is closer to you.


    Here is a list of sites that mirror Red Hat Software''s main FTP site. Be aware
    that this list'
