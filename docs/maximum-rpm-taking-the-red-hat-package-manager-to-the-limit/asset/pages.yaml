- pgno: 79
  md: '# 5.1 rpm -q — What does it do?


    One of the nice things about using RPM is that the packages you manage don''t
    end up going into some kind of black hole. Nothing would be worse than to install,
    upgrade, and erase several different packages and not have a clue as to what''s
    on your system. In fact, RPM''s query function can help you get out of sticky
    situations:


    +   - You''re poking around your system, and you come across a file that you just
    can''t identify. Where did it come from?

    - Your friends send you a package, and you have no idea what the package does,
    what it installs, or where it originally came from.

    - You know that you installed XFree86 couple months ago, but you don''t know what
    version, and you can''t find any documentation on it.


    The list could go on, but you get the idea. The rpm -q command is what you need.
    You''re the kind of person that doesn''t like to have more options than you know
    what to do with, rpm -query might look imposing. But fear not. Once you have a
    handle on the basic structure of RPM query, it''ll be a piece of cake.


    # 5.2 The parts of an RPM Query


    It becomes easy to construct a query command once you understand the individual
    parts. First is the -q (You can also use --query, if you like). After all, you
    need to tell RPM what function to perform, right? The rest of the query command
    consists of two distinct parts: package selection (or what packages you''d like
    to query), and information selection (or what information you''d like to see).
    Let''s take a look at selection first:


    # 5.2.1 Query Commands, Part One: Package Selection


    The first thing you''ll need to decide when issuing an RPM query is what package
    (or packages) you''d like to query. RPM has several ways to specify packages,
    so you have quite an assortment to choose from.


    # The Package Label


    In earlier chapters, we discussed RPM''s package label, a string that uniquely
    identifies every installed package. Every label contains three pieces of information:


    +   - The name of the packaged software.

    - The version of the packaged software.

    - The package''s release number.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# 5.2 The Parts of an RPM Query


    When issuing a query command using package labels, you must always include the
    package name. You can also include the version and even the release, if you like.
    The only restrictions are that each part of the package label specified must be
    complete, and that any parts of the package label are missing, all to the right
    must be omitted as well. This second restriction is just a long way of saying
    that if you specify the release, you must also specify the version as well. Let''s
    look at a few examples.


    Say, for instance, you''ve recently installed a new version of the C libraries,
    but you can''t remember the version number:


    ```

    # rpm -q libc

    libc-5.2.18-1

    #

    ```


    In this type of query, RPM returns the complete package label for all installed
    packages that match the given information. In the example above, if version 5.2.17
    of the C libraries was also installed, its package label would have been displayed,
    too.

    In this example, we''ve included the version as well as the package name:


    ```

    # rpm -q rpm-2.3

    rpm-2.3-1

    #

    ```


    Note, however, RPM is a bit picky about specifying package names. Here are some
    queries for the C library that won''t work:


    ```

    # rpm -q LibC

    package LibC is not installed

    #

    ```


    ```

    # rpm -q lib

    package lib is not installed

    #

    ```


    ```

    # rpm -q "lib*"

    package lib* is not installed

    #

    ```


    ```

    # rpm -q libc-5

    package libc-5 is not installed

    #

    ```


    ```

    # rpm -q libc-5.2.1

    package libc-5.2.1 is not installed

    #

    ```'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'As you can see, RPM is case sensitive about package names and cannot match
    partial names, version numbers, or release numbers. Nor can it use the wildcard
    characters we''ve come to know and love. As we''ve seen, however, RPM can perform
    the query when more than one field of the package label is present. In the case,
    rpm -q libc-5.2.18, or even rpm -q libc-5.2.18-1 would have found the package,
    libc-5.2.18-1.


    Querying by package labels may seem a bit restrictive. After all, you need to
    know the exact name of a package in order to perform a query on it. But there
    are other ways of specifying packages...


    +   -a — Query All Installed Packages


    Want lots of information fast? Using the -a option, you can query every package
    installed on your system. For example:


    ```

    # rpm -qa

    ElectricFence-2.0.5-2

    ImageMagick-3.7-2

    ...

    tetex-xtexsh-0.3.3-8

    lout-3.06-4

    #

    ```


    (On a system installed using RPM, the number of packages can easily number 200
    or more; we''ve deleted most of the output.)


    The -a option can produce mountains of output, which makes it a prime candidate
    for piping through the many Linux/UNIX commands available. One of the prime candidates
    would be a pager as more, so that the list of installed packages could be viewed
    a screenful at a time.


    Another handy command to pipe rpm -qa''s output is through grep. In fact, using
    grep, it''s possible to get RPM''s lack of built-in wildcard processing:


    ```

    # rpm -qa / grep -i sysu

    SysVinit-2.64-2

    #

    ```


    In this example, we were able to find the SysVinit package, even though we didn''t
    the complete package name, or capitalization.


    +   -f <file> — Query the Package Owning <file>


    How many times have you found a program sitting on your system and wondered “what
    does it do?” Well, if the program was installed by RPM as part of a package, it''s
    easy to'
