- pgno: 86
  md: '# 5.2 The Parts of the RPM Query


    -i — Display Package Information


    Adding -i to rpm -q tells RPM to give you some information on the package or packages
    you selected. For the sake of clarity, let''s take a look at what it gives you
    and explain what you''re looking at:


    ```

    # rpm -qi rpm

    Name         : rpm               Distribution: Red Hat Linux Vanderbilt

    Version      : 2.3               Vendor: Red Hat Software

    Release      : 1                 Build Date: Tue Dec 24 09:07:59 1996

    Install date: Thu Dec 26 23:01:51 1996 Build Host: porky.redhat.com

    Group        : Utilities/System Source RPM: rpm-2.3-1.src.rpm

    Size         : 631157

    Summary      : Red Hat Package Manager

    ```


    Description :

    RPM is a powerful package manager, which can be used to build, install, query,
    update, and uninstall individual software packages. A package consists of an archive
    of files, and package information, including name, version, and description.


    #


    There''s quite a bit of information here, so let''s go through it entry by:


    +   - Name — The name of the package you queried. Usually (but not always) it
    bears some resemblance to that of the underlying software.

    - Version — The version number of the software, as specified by the software''s
    original creator.

    - Release — The number of times a package containing this software has been packaged.
    If the version number should change, the release number should start over again
    at “1


    As you''ve probably noticed, these three pieces of information comprise the package
    label we''ve come to know and love. Continuing, we have:


    +   - Install — This is the time when the package was installed on your system.

    - Group — In our example, this looks suspiciously like a path. If you went searching
    for a directory tree by that name, you would come up dry — it isn''t a set of
    directories at all.


    When a package builder starts to create a new package, it will enter a list of
    words that describe the software. The list, which goes from least specific to
    most specific, attempts to categorize the software in a concise manner. The primary
    use for group is to enable graphically ordered packages based on RPM to present
    Red Hat Linux''s glint command does this.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Size — This is the size (in bytes) of every file in this package. It might
    make your decision to erase an unused package easier if you see six or more digits
    here.


    Summary — This is a concise description of the packaged software.


    Description — This is a verbose description of the packaged software. Some descriptions
    might be better than others, but hopefully it will be enough to clue you in as
    to the software''s role in the greater scheme of things.


    Distribution — The word "distribution" is really not the best name for this field.
    "Product" might be a better choice. In any case, this is the name of the product
    package is a of.


    Vendor — The organization responsible for building this package.


    Build Date — The time the package was created.


    Build Host — The name of the computer system that built the package.²


    Source RPM — The process of building a package results in two files:


    +   1. The package file used to install the packaged software. It is sometimes
    called the binary package.


    +   2. The package file containing the source code and other files used to create
    the binary package file. This is known as the source RPM package file. This is
    the filename that is displayed in this field.


    Unless you want to make changes to the software, you probably won''t need to worry
    about source packages. But if you do, stick around, because the second part of
    this book is for you...


    # -1 — Display the Package''s File List


    Adding -l to rpm -q tells RPM to display the list of files that are installed
    by the specified package or packages. If you''ve used ls before, you won''t be
    surprised by RPM''s file list. Here''s a look at one of the smaller packages on
    Red Hat Linux — adduser:


    ```

    # rpm -ql adduser

    /usr/sbin/adduser

    #

    ```


    The adduser package consists of only one file, so there''s only one filename displayed.


    > ²Note to software packagers: Choose your build machine wisely! A silly or offensive
    name might be embarrassing...'
