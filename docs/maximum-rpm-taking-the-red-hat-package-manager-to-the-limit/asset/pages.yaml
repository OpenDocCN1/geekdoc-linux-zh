  md: '# 18.4 Spec File Changes For Subpackages


    # 18.4 Spec File Changes For Subpackages


    The creation of subpackages is based strictly on the contents of the spec file.
    This doesn''t mean you''ll have to learn an entirely new set of tags, conditionals,
    and directives in order to create subpackages. In fact, you''ll only need to learn
    one.


    The primary change to a spec file is structural and starts with the definition
    of a preamble for each subpackage.


    # 18.4.1 The Subpackage’s “Preamble"


    When we introduced RPM package building in chapter 10, we said that every spec
    file contains a preamble. The preamble contains a variety of tags that define
    all sorts of information about the package. In a single package situation, the
    preamble must be at the start of the spec. The spec file we''re creating will
    have one, there,


    When creating a spec file that will build subpackages, each subpackage also needs
    a preamble of its own. These “sub-preambles” only define information for the subpackage
    when that information differs from what is defined in the main preamble. For example,
    if we wanted to define an installation prefix for a subpackage, we would add the
    appropriate prefix tag to that subpackage''s preamble. That subpackage would then
    be relocatable.


    In a single-package spec file, there is nothing that explicitly identifies the
    preamble, other than its position at the top of the file. For subpackages, however,
    we need to be a bit more explicit. We use the %package directive to identify the
    preamble for each subpackage.


    # The %package Directive


    The %package directive actually performs two functions. As mentioned above, it
    is used to denote the start of a subpackage''s preamble. It also plays a role
    in forming the subpackage''s name. As an example, let''s say the main preamble
    contains the following name:


    ```

    name: foo

    ```


    Later in the spec file, there is a %package directive:


    %package bar


    This would result in the name of the subpackage being foo-bar.


    In this way, it''s easy to see the relationship of the subpackage to the main
    package (or other subpackages, of that matter). Of course, this naming convention
    might not be appropriate in every case. So there is an option to the %package
    directive for this circumstance.


    # Adding -n To the %package directive


    The -n option is used to change the final name of a subpackage from mainpackage-subpackage
    to subpackage. Let''s modify the %package directive in our example above to:'
  merge: -1
