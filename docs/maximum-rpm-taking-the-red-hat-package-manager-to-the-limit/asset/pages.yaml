    The "v3" in file''s output indicates the package file format.


    # 17.3.3 --addsign Add a Signature To a Package


    The --addsign option, as the name suggests, is used to add another signature to
    the package. It''s pretty easy to see why someone would want to have a package
    that had been signed by the package builders. But what reason would there be for
    *adding* a signature to a package?


    One reason to have more than one signature on a package would be to provide a
    means of documenting the path of ownership from the package builder to the end-user.


    As an example, the division of a company creates a package and signs it with the
    division''s key. The company''s headquarters checks the package''s signature and
    adds the corporate signature to the package, enlace stating that the signed package
    received by them is authentic.


    Continuing the example, the doubly-signed package makes its way to a retailer.
    The retailer checks the package''s signatures and, when they check out, adds their
    signature to the package.


    The package now makes its way to a company that wishes to deploy the package.
    After checking every signature on the package, they know that it is an authentic
    copy, unchanged since it was created. Upon deploying the deploying company''s
    internal controls, they may choose to add their own signature, reassuring their
    employees that the package has received their corporate "blessing".


    After this lengthy example, the actual output from the --addsign option is a bit
    climactic:


    ```

    # rpm --addsign blather-7.9-1.i386.rpm

    Enter pass phrase: <passphrase> (Not echoed)

    ```


    ```

    Pass phrase is good.

    blather-7.9-1.i386.rpm:

    #

    ```


    If we check the signatures of this package, we''ll be able to see the multiple
    signatures:


    ```

    # rpm --checksig blather-7.9-1.i386.rpm

    ```'
