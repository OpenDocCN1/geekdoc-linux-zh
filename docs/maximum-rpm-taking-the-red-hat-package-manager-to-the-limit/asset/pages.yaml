    # A.2.5 The Header


    The header contains all available information about the package. Entries such
    as the package''s name, version, and file list, are contained in the header. Like
    the signature section, the header is in header format. Unlike the signature, which
    has only three possible tag types, the header has more sixty different tags. The
    list of currently defined tags appears in this appendix on page 357. We beware
    the list of changes frequently — the definitive list appears in the RPM sources
    in lib/rpmplib.h.


    # Analyzing the Header


    The easiest way to find the start of the header is to look for the second header
    structure by scanning for its magic number (8ead). The sixteen bytes, starting
    with the magic, follow the same format as the header in the signature''s header
    structure:


