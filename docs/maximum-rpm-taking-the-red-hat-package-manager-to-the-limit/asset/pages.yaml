  md: '# 13.8 Conditionals


    %package: <string>


    The <string> should be a name that describes the subpackage. This string is appended
    to the base package name to produce the subpackage''s name. For example, if a
    spec file contains a name tag value of "foonly", and a "%package doc" line, then
    the subpackage name will be foolly-doc.


    # 13.7.1 -n <string> — Use <string> As the Entire Subpackage Name


    As we mentioned above, the name of a subpackage normally includes the main package
    name. When the -n option is added to the %package directive, it directs RPM to
    use the name specified on the %package line as the entire package name. In the
    example above, the following %package line would create a subpackage named foolly-doc:


    %package doc


    The following %package line would create a subpackage named:


    %package -n doc


    The %package directive plays another role in subpackage building. That role is
    to act as a place to collect tags that are specific to a given subpackage. Any
    tag placed after a %package directive will only apply to that subpackage.


    Finally, the name string specified by the %package directive is also used to denote
    which parts of the spec file are part of that subpackage. This is done by including
    the string (along with the -n option, if present on the %package line) on the
    starting line of the section that is to be subpackage-specific. Here''s an example:


    ```

    %package -n bar

    ```


    ```

    ..

    ```


    ```

    %post -n bar

    ```


    ```

    ..

    ```


    In this heavily edited spec file segment, a subpackage called bar has been defined.
    Later in the file is a post-install script. Because it has subpackage bar''s name
    on the %post line, the post-install script will be of the bar subpackage only.


    For information on building subpackages, please see chapter 18 on page 251.


