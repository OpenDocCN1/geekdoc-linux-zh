    # 7.1 rpm -K — What Does it Do?


    One aspect of RPM is that you can get a package from the Internet, and easily
    install it. But what do you know about that package file? Is the organization
    listed as being the "vendor" of the package really the organization that built
    it? Did someone make unauthorized changes to it? You can trust that, if installed,
    it won''t make a copy of your password file to a system cracker?


    Features built into RPM allow you to make sure that the package file you''ve gotten
    won''t cause you problems once it is installed, whether the package was corrupted
    by line noise when you downloaded it, or something else happened to it.


    The command rpm -K (The option --checksig equivalent) verifies a package file.
    Using this command, it is easy to make sure the file has not been changed in any
    way. rpm -K can also be used to make sure that the package was actually built
    by the organization listed as being the package''s vendor. That''s very impressive,
    but how does it do that? Well, it just needs help to be "Pretty Good" software.'
  merge: -1
  img_proc: true
- pgno: 121
  md: "# 7.1.1 Pretty Good Privacy: RPM’s Assistant\n\nThe “Pretty Good” software\
    \ is referred to as “Pretty Good Privacy”, or PGP. While all the information on\
    \ PGP could fill a book (or several), we’ve provided a quick introduction to help\
    \ you get started.\n\nIf PGP is new to you, a quick glance through Appendix G\
    \ should get you well on your way to understanding, building, and installing PGP.\
    \ If, on the other hand, you’ve got PGP already installed and sent an encrypted\
    \ message or two, you’re probably more than ready to continue with this chapter.\n\
    \n# 7.2 Configuring PGP for rpm -K\n\nOnce PGP is properly built and installed,\
    \ the actual configuration for RPM is trivial. Here’s what needs to be:\n\n+ \
    \  - PGP must be in your path. If PGP’s usage message doesn’t come up when you\
    \ enter pgp at your shell prompt, you’ll need to add pgp’s directory to your path.\n\
    - PGP must be able to find the public keyringing file that you want to use when\
    \ checking package file signatures. You can use two methods to direct PGP to the\
    \ public keyringing:\n  - 1. Set the GPPATH environment variable to point to the\
    \ directory containing the public keyring file.\n  - 2. Set the pgp.path rpmrc\
    \ file to point to the directory containing the public keyring file.\n\nWe’re\
    \ ready.\n\n# 7.3 Using rpm -K\n\nAfter all the preliminaries with PGP, it’s time\
    \ to get down to business. First, we need to get the package builder’s public\
    \ key and add it to the public keyring file used by RPM. You’ll need to do this\
    \ once for each package builder whose packages you’ll want to check. This is what\
    \ you will need to do:\n\n```\n# pgp -ka RPM-PGP-KEY /pubring.gpg\nPretty Good\
    \ Privacy (tm) 2.6.3a - Public-encryption for the masses.\n(c) 1990-96 Phil Zimmermann,\
    \ Phil’s Pretty Good Software. 1996-03-04\nUses the RAREF(tm) Toolkit, which is\
    \ copyright RSA Data Security, Inc.\nDistributed by the Massachusetts Institute\
    \ of Technology.\nExport of this software may be restricted by the U.S. government.\n\
    ```\n\n> ¹For more information on rpmrc files, rpersc file entries, and how to\
    \ use them, see Appendix B on page 363."
