    Let''s continue by looking at the next part of the spec file that changes when
    building subpackages.


    # 18.4.2 The %files List


    In an ordinary single-package spec file, the %files list is used to determine
    which files are actually going to be packaged. It is no different when building
    subpackages. What is different, is that there must be a %files list for each subpackage.


    Since each %files list must be associated with a particular %package directive,
    we simply label each %files list with the name of the subpackage, as specified
    by each %package lines were: Going back to our example, our %package lines were:


    ```

    %package server

    %package client

    %package -n bazlib

    ```


    Therefore, our %files lists should start with:


    ```

    %files server

    %files client

    %files -n bazlib

    ```'
