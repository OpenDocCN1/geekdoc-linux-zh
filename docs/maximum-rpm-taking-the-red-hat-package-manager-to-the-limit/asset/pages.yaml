  md: 'Looking at this more verbose output, it''s easy to see there''s a great deal
    going on. Some of it is not directly pertinent to checking the %files list, For
    example, the output extending from the first line, to the line reading * Package:
    cdplayer, reflects processing that takes place during actual package building,
    and can be ignored.


    Following that section is the actual %files check. In this section, every file
    named in the %files list is checked to make sure it exists. The phrase, again,
    reflects RPM''s package building. When using the -bl option, however RPM is simply
    making sure the files exist on the build system. If the --timecheck option (described
    a bit later, on page 159) is present, the checks required by that option are performed
    here, as well.


    After this list check, the MD5 checks of each file are calculated and displayed.
    This information is vital during actual package building, it is not used when
    the -bl option.


    Finally, RPM determines which shared the listed files requires. In this case,
    there are only two libso.5, and libcurses.so.2. While not strictly part of the
