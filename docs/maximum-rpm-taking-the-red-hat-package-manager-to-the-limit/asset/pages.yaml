    # ## 17.2.2 Preparing RPM


    RPM''s configuration process is quite straightforward. It consists of adding a
    few rpmrc entries in a file of your choice. For more information on rpmrc files
    in general, please see Appendix B on page 363.


    The entries that need to be added to an rpmrc file are:


    +   - signature

    - pgp_name

    - pgp_path


    Let''s check out the entries.


    The signature entry is used to select the type of signature that RPM is to use.
    At the time this book was written, the only legal value is pgp. So you would enter:

    signature: pgp


    pgp_name The pgp_name entry gives RPM the user ID of the key it is to sign packages
    with. In our key generation example, the user ID of the key we created was Example
    Key for RPM Book, so this is what our entry should look like:


    pgp_name: Example Key for RPM Book


    pgp_path The pgp_path entry is used to define the path to the directory where
    the keys are kept. This entry is not needed if the environment variable PGPPATH
    has been defined. In our example, we didn''t move them from PGP''s default location,
    which is in the subdirectory .pgp, of the user''s login directory. Since we generated
    the key as root, our path is /root/.pgp. Therefore, our entry would look like
    this:


    pgp_path: /root/.pgp


    And that''s it. Now it''s time to sign some packages.


