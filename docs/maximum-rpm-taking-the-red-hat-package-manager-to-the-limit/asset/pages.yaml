- pgno: 152
  md: '# Chapter 11


    # Building Packages: A Simple Example


    In the previous chapter, we looked at RPM''s build process from a conceptual level.
    In this chapter, we will be performing an actual build using RPM. In order to
    keep things understandable for this first pass, the build will be very simple.
    Once we''ve covered the basics, we''ll present more real-world examples in later
    chapters.


    # 11.1 Creating the Build Directory Structure


    RPM requires a set of directories in which to perform the build. While the directories''
    locations and names can be changed, unless there''s a reason to do so, it''s best
    to use the default layout. Note that if you''ve installed RPM, the build directories
    are most likely in place already.


    The normal directory layout consists of a single top-level directory (The default
    name is /usr/src/redhat), with five subdirectories. The five subdirectories and
    their functions are:


    +   * /usr/src/redhat/SOURCES — Contains the original sources, patches, and icon
    files.

    * /usr/src/redhat/SPECS — Contains the spec files used to control the build process.

    * /usr/src/redhat/BUILD — The directory in which the sources are unpacked, and
    the software is built.

    * /usr/src/redhat/RPMS — Contains the binary package files created by the build
    process.

    * /usr/src/redhat/SRPMS — Contains the source package files created by the build
    process.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Building Packages: A Simple Example


    In general, there are no special requirements that need to be met when creating
    these directories. In fact, the only important requirement is that the BUILD directory
    part of a filesystem has sufficient free space to build the package expected.
    Here is a directory listing showing a typical build directory tree:


    ```

    # ls -LF /usr/src/redhat

    total 5

    drwxr-xr-x 3 root 1024 Aug 5 13:12 BUILD/

    drwxr-xr-x 3 root 1024 Jul 17 17:51 RPMS/

    drwxr-xr-x 4 root 1024 Aug 4 22:31 SOURCES/

    drwxr-xr-x 2 root 1024 Aug 5 13:12 SPECS/

    drwxr-xr-x 2 root 1024 Aug 4 22:28 SRMS/

    #

    ```


    Now we have the directories ready to go, it''s time to prepare for the build.
    For the remainder of this chapter, we''ll be building a fictional piece of software
    known as cdplayer.


    # 11.2 Getting the Sources


    The first thing we need to do in order to build a package for cdplayer, is to
    obtain the sources. Being avid cdplayer fans from way back, we know that the latest
    source can be found at GnomVision''s FTP site, so we get a copy.


    We now have a gzipped tar of cdplayer version 1.0 on our system. After putting
    a copy in the SOURCES directory, we''re ready to tell RPM what to do with it.


    # 11.3 Creating the Spec File


    The way we create RPM in the build process is to create a spec file. As we saw
    in the previous chapter, the spec file contains eight different sections, most
    of which are required. Let''s go through each section and create cdplayer''s spec
    file as we go.


    # 11.3.1 The Preamble


    The preamble contains a wealth of information about the package being built, and
    the people that built it. Here''s cdplayer''s preamble:


    ```

    #

    # Example spec file for cdplayer app...

    ```


    > In reality, this software is a mercilessly hacked version of cp, which was written
    by Sariel Har-Peled. The software was hacked to provide a simple example package,
    and in no way represents the fine work done by Sariel at cdot.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 11.3 Creating the Spec File


    #


    Summary: A CD player app that rocks!

    Name: cdplayer

    Version: 1.0

    Release: 1

    Copyright: GPL

    Group: Applications/Sound

    Source: http://ftp.gnomovision.com/pub/cdplayer/cdplayer-1.0.tgz

    URL: http://www.gnomovision.com/cdplayer/cdplayer.html

    Distribution: WSS Linux

    Vendor: White Socks Software, Inc.

    Packager: Santa Claus <sclaus@northpole.com>


    %description

    It slices! It dices! It''s a CD player app that

    ''t be beat. By using the resonant frequency

    of the CD itself, it is able to simulate 20X\oversampling. This leads to sound
    quality that

    cannot be equaled with more mundane software...


    In general, the preamble consists of entries, one per line, that start with a
    tag followed by a

    colon, then some information. For example, the line starting with “Summary:” gives
    a

    short description of the packaged software that can be displayed by RPM. The order
    of the

    lines is not important, as as long as they appear in the preamble.


    Let''s take a look at each line and see what function it performs:


    Name — The line defines what the package will actually be called. In general,
    it''s

    a good idea to use the name of the software. The name will also be included in
    the package

    label, and the package filename.


    Version — The version line should be set to the version of the software being
    packaged.

    The version will also be included in the package label, and the package filename.


    Release — The release is a number that is used to represent the number of times
    the

    software, at the present version, has. been packaged. You can think of it as the
    package''s

    version number. The release is also part of the package label and package filename.


    Copyright The copyright line is used to hold the packaged software''s copyright
    in-

    formation. This makes it easy to determine which packages can be freely redistributed,

    and cannot. In our case, cdplayer is made available under the terms of the GNU
    General

    Public License, so we use GPL on the net.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Group Building Packages: A Simple Example


    Group — The group line is used to hold a string that defines how the packaged
    software should be grouped with other packages. The string consists of a series
    of words separated by slashes. From left to right, the words describe the packaged
    software more explicitly. We grouped cdplayer under Applications, because it is
    an application, and then under Sound, since it is an application that is sound-related.


    Source — The source line serves two purposes:


    +   - To document where the packaged software''s sources can be found.


    +   - To give the name of the source file as it exists in the SOURCES subdirectory.


    In our example, the cdplayer sources are contained in the file cdplayer-1.0.tgz,
    which is available from ftp.gnomision.com, in the directory /pub/cdplayer. RPM
    actually ignores everything prior to the last filename in the source line, the
    first part of the source string could be anything you''d like. Traditionally,
    the source line usually contains a Uniform Resource Locator, or URL.


    URL — The URL line is used to contain a URL, like the source line. How are they
    different? While the source line is used to provide the source filename to RPM,
    the URL line points to documentation for the software being packaged.


    Distribution — The distribution line contains the name of the product which the
    packaged software is a part of. In the Linux world, the operating system is often
    packaged together into a “distribution”, hence the name. Since we''re using a
    fictional application in this example, we filled in the distribution line with
    the name of a fictional distribution. There''s no requirement that the spec file
    contain a distribution line, so individuals will omit this.


    Vendor — The vendor line identifies the organization that distributes the software.
    Maintaining our fictional motif, we invented fictional company, White Socks Software,
    to add our spec file. Individuals will probably omit this as well.


    Packager — The packager line is used to identify the organization that actually
    packaged the software, as opposed to the author of the software. In our example,
    we''ve chosen the greatest packager of them all, Santa Claus, to work at White
    Socks Software. Note that we''ve included contact information, in the form of
    an e-mail address.


    Description — The description line is a bit different, in that it starts with
    a percent sign. It is also different because the information can take up more
    than one line. It is used to provide a more detailed description of the packaged
    software that the summary line.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 11.3 Creating the Spec File


    A Comment on Comments At the top of the spec file, there are three lines, each
    starting with a pound sign. These are comments and can be sprinkled throughout
    the spec file to make it easily understood.


    # 11.3.2 The prep Section


    With the preamble, we provided a wealth of information. The majority of this information
    is meant for human consumption. The name, version, release, and source lines have
    a direct bearing on the package building process. However, in the %prep section,
    the focus is entirely on directing RPM through the process of preparing the software
    for building.


    It is in the %prep section that the build environment for the software is created,
    starting with removing the remnants of any previous builds. Following this, the
    source archive is expanded. Here is what the %prep section looks like in our example
    file:


    ```

    %prep

    rm -rf $RPM_BUILD_DIR/cdplayer-1.0.tgz | tar -xvf -

    ```


    If the %prep section looks like a script, that''s because it is. Any sh constructs
    can be used here, including expansion of environment variables (Like the $RPM_BUILD_DIR
    variable defined by RPM), and piping the output of zcat through tar.


    In this case, we perform a recursive delete in the gzipped file to remove any
    old builds. We then uncompress the gzipped file and extract its contents into
    the build directory.


    Quite often, the sources may require patching in order to build properly. The
    %prep section is the appropriate place to patch the sources, but in this example,
    no patching is required. Fear not, however, as we''ll explore patching in all
    its glory in chapter 20 on page 279, when we build a more complex package.


    # Making Life Easier With Macros


    While the %prep section as we described it isn''t that difficult to understand,
    RPM macros make life even easier. In this simple example, there''s precious little
    to be made easier, but macros will prevent a wealth of headaches when it''s time
    to build more complex packages. The macro we''ll introduce here is the %setup
    macro.


    The average gzipped file is %setup''s stock in trade. Like the hand-crafted %prep
    section we described above, it cleans up old build trees and uncompresses and
    extracts the files from the original source. While %setup has a number of options
    that we''ll cover in later chapters, for now we need for a %prep section is:


    ```

    %prep

    %setup

    ```


    > For more information on the environment variables used in the build-time scripts,
    please refer to section 13.3.1 on page 180.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Building Packages: A Simple Example


    That is simpler than our %prep section, so let''s use the %setup macro instead.
    The %setup macro has a number of options to handle many different situations.
    For more information on this and other macros, please see section 13.4 on page
    186.


    In our example here, the %prep section is complete. Next comes the actual build.


    # 11.3.3 The %build Section


    Not surprisingly, the part of the spec file that is responsible for performing
    the build, is the %build section. Like the %prep section, the %build section is
    an ordinary sh script. Unlike the %prep section, there are no macros. The reason
    for this is that the process of building software is either to be very easy, or
    highly complicated. In either case, macros won''t help much. In our example, the
    build process is simple:


    ```

    %build

    make

    ```


    Thanks to the make utility, only one command is necessary to build the %cdplayer
    application. In the case of an application with more esoteric build requirements,
    the %build section could get a bit more interesting.


    # 11.3.4 The %install Section


    The %install section is executed as a sh script, just like %prep and %build. If
    the application is built with make and has an "install" target, the %install section
    will also be straightforward. The %cdplayer application is a good example of this:


    ```

    %install

    make install

    ```


    If the application doesn''t have a means of automatically installing itself, it
    will be necessary to create a script to do so, and place it in the %install section.


    # 11.3.5 The %files Section


    The %files section is different from the others, in that it contains a list of
    the files that are part of the package. Always remember — if it isn''t in the
    file list, it won''t be put in the package!


    ```

    %files

    %doc README

    /usr/local/bin/cdp

    /usr/local/bin/cdplay

    /usr/local/man/man1/1

    ```'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 11.3 Creating the Spec


    The line starting with %doc is an example of RPM''s handling of different file
    types. As you might guess, %doc directs is used to mark files as being documentation.
    In the example, the README file will be placed in a package-specific directory,
    located in /usr/doc, and called docplayer-1.0-1. It''s also possible to mark files
    as documentation and have them installed in other directories. This is covered
    in more detail in 13.6.1 on page 199.


    The rest of the files in the example are shown with complete paths. This is necessary
    as the files will actually be installed in those directories by the application''s
    makefile. Since RPM needs to be able to find the files before packaging them,
    complete paths are required.


    # How Do You Create the File List?


    Since RPM automates many aspects of software installation, it''s easy to fall
    into the trap of assuming RPM does everything for you. Not so! One task is still
    a manual process of creating the file list. While it may seem at first glance,
    it could be automated somehow, it''s actually a more difficult problem than it
    seems


    Since the majority of an application''s files are installed by its makefile, RPM
    has no control over that part of the build process, and cannot automatically determine
    which files should be part of the package. Some people have attempted to use a
    modified version of install that logs the name of every file it installs. But
    not every makefile installs, or if it does, it sporadically.


    Another approach was to obtain a list of every file on the build system, immediately
    before and after a build, and use the differences as the file list. While this
    would certainly find every file that the application installed, it can also pick
    up extraneous files, such as system logs, in /tmp, and the like. The only way
    to begin to make this approach workable would be to do nothing else on the build
    system, which is highly inconvenient. This approach also precludes building more
    than one package on the system at any given time.


    At present, the best way to create the file list is to read the makefile to see
    what files it installs, verify against the files installed on the build system,
    and create the list.


    # 11.3.6 The Missing Spec File Sections


    Since our example spec file is simplistic, it''s missing two sections that might
    be used in more complex situations. We''ll go over each one briefly here. More
    complete information on these sections will be covered at various points in the
    book.


    # The Install/Uninstall Scripts


    One missing section in our spec file is the section that would define one or four
    possible scripts. The scripts are executed at various times when a package is
    installed or erased.


    The scripts can be executed:


    +   Before a package is installed.'
  merge: -1
  img_proc: true
