  md: '# 20.4 Package Building


    The files in /usr/sbin are programs that will be run by the amanda administrator
    in order to perform backups and restores. The files in /usr/lib/amanda are the
    server-side programs that do the actual work during backups. Following that are
    a number of man pages: one for each program to be run by the amanda administrator,
    and one with an overview of amanda.


    Brying up the rear are a number of files that are not installed, but would be
    handy for the use of the client subpackage, and there is some overlap with the
    files that would be part of the client subpackage, but the additional files discuss
    features that would interest only amanda administrators. Included here is the
    example subdirectory, which contains a few example configuration files for the
    amanda server.


    As in the client %files list, last files can''t be packaged by RPM as we''ve listed
    them. We need to use a few of RPM''s tricks to get them packaged.


    # Applying Directives


    Since we''d like the client subpackage to include those files that are not normally
    installed, and since the files are documentation, let''s use the %doc directive
    on them. That will accomplish two things:


    +   1. When the client subpackage is installed, it will direct RPM to place them
    in a package-specific directory in /usr/doc

    2. It will tag the files as being documentation, making it possible for users
    to easily track the documentation with a simple rpm -qd command


    In the course of looking over the %files list, it becomes apparent that the directory
    /usr/lib/amanda will contain only files from the two amanda subpackages. If the
    subpackages are erased, the directory will remain, which won''t hurt anything,
    but it isn''t neat as it could be. But if we add the directory to that directory,
    RPM will automatically package every file in the directory. Since the files are
    part of both the client and the server subpackages, we''ll need to use the %dir
    directive to instruct RPM to package only the directory.


    After these changes, what''s the client %files list look like:


    ```

    %files client

    %dir /usr/lib/amanda/

    %usr/lib/amanda/amamad

    %usr/lib/amanda/sendsize

    %usr/lib/amanda/calcsize

    %usr/lib/amanda/sendbackup-dump

    %usr/lib/amanda/selfcheck

    %usr/lib/amanda/sendbackup-gnutar

    %usr/lib/amanda/runtar

    %doc README

    %doc COPYRIGHT

    %doc docs/INSTALL

    ```'
