- pgno: 443
  md: '# 416 RPM-related Resources


    Although the version numbers may change, the types of files kept in this directory
    will not.

    The files RPM-HOWTO, paper.ps.gz, and rpmbuild.ps.gz contain a variety of information
    concerning RPM. As they are valuable sources of supplemental information. The
    remaining files contain RPM, packaged for various architectures, and in source
    form. We''ll look at them, grouped according to their contents. Here''s the first
    group of:


    ```

    -rw-r--r-- root 97 365319 Jul 18 06:05 rpm-2.2.2-1.arp

    -rw-r--r-- root 97 282015 Jul 18 06:05 rpm-2.2.2-1.i386.rpm

    -rw-r--r-- root 97 279855 Jul 18 06:05 rpm-2.2.2-1.sparc.rpm

    ```


    The files above are binary package for RPM version 2.2.2, release 1, on the Digital
    Alpha, the Intel 386/486/Pentium, and the SUN SPARC. That the version number will
    change in time, but the other parts of the file naming convention won''t. As binary
    package files, they must be installed using RPM. So if you don''t have RPM, they
    won''t do you much good.² Let''s look at the next file:


    ```

    -rw-r--r-- root 97 359354 Jul 18 06:05 rpm-2.2.2-1.src.rpm

    ```


    This is the source package for RPM version 2.2.2, release 1. Like the binary packages,
    the source package requires RPM to install - it cannot be used to perform an initial
    install of RPM. Let''s see what else is here:


    ```

    -rw-r--r-- root 97 122157 Jul 18 06:05 rpm-devel-2.2.2-1.asp

    -rw-r--r-- root 97 51132 Jul 18 06:05 rpm-devel-2.2.2-1.i386.rpm

    -rw-r--r-- root 97 544070 Jul 18 06:05 rpm-devel-2.2.2-1.sparc.rpm

    ```


    The files above are binary package files that contain the rpm-devel subpackage.
    The rpm-devel package contains header files and the RPM library, and is used for
    developing programs that can perform RPM-related functions. These files cannot
    be used to get RPM running. That leaves two left:


    ```

    -rw-r--r-- root 97 278620 Jul 18 06:05 rpm-2.2.2-1.i386.cpio.gz

    -rw-r--r-- root 97 356943 Jul 18 06:05 rpm-2.2.2.tar.gz

    ```


    The first file is a zipped cpio archive of files comprising RPM. When uncompressing
    the file, cpio can be used to extract the files and place them on your system.
    Note, however, that there is a cpio archive for the i386 architecture only. To
    extract the files, issue the following command:


    ```

    # zcat file.cpio.gz | ( cd / ; cpio --extract)

    ```


    > If you want to install RPM on one of your systems, it might be a good idea to
    consider the appropriate binary package. That way, once you have RPM running,
    you can reinstall it with the --force option to ensure RPM is properly installed
    and configured.'
  merge: -1
  img_proc: true
- pgno: 444
  md: '# F.2 Where to Talk About RPM


    (When actually issuing the command, file.cpio.gz should be replaced with the actual
    name of the cpio archive.)


    Note that the archive should be extracted using GNU cpio version 2.4.1 or greater.
    It may also be necessary to issue the following command prior to using RPM:


    ```

    # mkdir /var/lib/rpm

    ```


    The last file, rpm-2.2.2.tar.gz, contains the sources for RPM. Using it, you can
    build RPM from scratch. This is the most involved option, but it is the only choice
    for people interested in porting RPM to a new architecture. See chapter 8 on page
    101 for an example of RPM being built from the sources.


    # F.2 Where to Talk About RPM


    As much as we''ve tried to make this book a comprehensive reference for RPM, there
    are going to be times when you''ll need additional help. The best way to connect
    with other that use RPM is to try one of the following mailing lists.


    # F.2.1 The rpm-list Mailing List


    Red Hat Software, Inc. maintains a mailing list specifically for RPM. In order
    to subscribe to the list, it''s necessary to send a mail message to:


    ```

    rpm-list-request@redhat.com

    ```


    On the message''s subject line, place the word subscribe. After a short delay,
    you should receive an automated response with general information about the mailing
    list. To send messages to the list, address them to:


    ```

    rpm-list@redhat.com

    ```


    As with other on-line forums, it is advisable to “lurk” for a while before sending
    anything to the list. That way, you''ll be able to see what types of questions
    are acceptable for the list. Let the list''s name be your guide; if the message
    you want to send doesn''t have anything to do with RPM, you shouldn''t send it
    to rpm-list!


    In general, the flavor of rpm-list is a biased towards RPM''s development, building
    packages, and issues surrounding theing of RPM to other systems. If your question
    is along the lines of, How do you use RPM to install new software? consider reviewing
    the first half of this book and lurking on rpm-list a while first.'
  merge: -1
  img_proc: true
- pgno: 445
  md: '# F.2.2 The redhat-list Mailing List


    The redhat-list mailing list is meant to serve as a forum for users of Red Hat
    Software''s Linux operating system. If your questions concerns the use of RPM
    on Red Hat Linux, then the redhat-list is a good place to start. To subscribe,
    send a message to:


    ```

    redhat-list-request@redhat.com

    ```


    On the message''s subject line, place the word subscribe. After a short delay,
    you should receive an automated response with general information about the mailing
    list. As with rpm-list, it''s best to lurk for a while before posting to the list


    To send messages to the list, address them to:


    ```

    redhat-list-digest@redhat.com

    ```


    # F.2.3 The redhat-digest Mailing List


    Some people might find the number of messages on redhat-list more than they can
    handle. However, there is a digest version of the list available. Each digest
    consists of one or more messages sent to redhat-list. The digest sent might have
    one long message, or twenty smaller ones. In either case, you''ll have the collected
    knowledge of the Red Hat Software development team and their many customers in
    one message.


    To subscribe to redhat-digest, send a message to:


    ```

    redhat-digest-request@redhat.com

    ```


    On the message''s subject line, place the word subscribe. After a short delay,
    you should receive an automated response with general information about the mailing
    list. To send messages to the list, address them to:


    ```

    redhat-list@redhat.com

    ```


    As always, observe proper “netiquette” – lurk before you leap!


    # F.3 RPM On the World Wide Web


    Up-to-date information on RPM can always be found at Red Hat Software''s web site:
    http://www.redhat.com/'
