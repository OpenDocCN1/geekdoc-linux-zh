    # 17.3.2 --resign Replace a Package’s Signature(s)


    As we mentioned at the end of the previous section, from time to time it may be
    necessary to change your public key. Certainly this would be necessary if your
    key’s security was compromised, but other, more mundane situations might require
    this.


    Fortunately, RPM has an option that permits you to replace the signature on an
    already-built package, with a new one. The option is called --resign, and here''s
    an example of its use:


    ```

    # rpm --resign blather-7.9-1.i386.rpm

    Enter pass phrase: <passphrase> (Not echoed)

    ```


    Pass phrase is good.

    blather-7.9-1.i386.rpm:


    ```

    #

    ```


    While the output is not as exciting as a package build, the --resign option can
    be a life-saver if you need to change a package’s signature, and you don''t want
    to rebuild. As you might have guessed, the --resign option works properly on multiple
    package files:


    ```

    # rpm --resign blah.rpm

    Enter pass phrase: <passphrase> (Not echoed)

    ```


    Pass phrase is good.

    blather-7.9-1.i386.rpm:

    bother-3.5-1.i386.rpm:


    ```

    #

    ```


