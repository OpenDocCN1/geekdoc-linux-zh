  md: '# Making a Package That Build Anywhere


    %clean

    rm -rf $RPM_BUILD_ROOT


    RPM executes the %clean section after the binary package has been created, it''s
    the place to delete the build root tree. In the example above, that''s exactly
    what we''re doing. We''re also doing the right thing using the %RPM.BUILD_ROOT,
    instead of a hard-coded path.


    The last issue to keep in mind revolves around the %clean section we just created.
    At the start of the chapter, we mentioned that it''s not a good idea to define
    a build root of "/. The %clean section is why: if the build root was set to "/,
    the clean section would blow your root filesystem! Keep in mind that this can
    bite you, even if the package''s spec file doesn''t specify "/ as a build root.
    It''s possible to use the --buildroot option to specify a dangerous build root,
    too:


    ```

    # rpm -buildroot /cdplayer-1.0.spec

    ```


    But for all the possible hazards using build roots can pose for the careless,
    it''s the only way to prevent a build by disrupting the operation of certain packages
    on the build system. And for the person wanting to build packages without root
    access, it''s the first of three steps necessary to accomplish the task. The next
    step is to direct RPM to build the software in a directory other than RPM''s default.


    # 16.2 Having RPM Use a Different Build Area


    While RPM build requires a certain amount of spec file and make file tweaking
    in order to get it working properly, directing RPM to perform the build in a different
    directory is a snap. The hardest part is to create the directories RPM will use
    during the build process.


    # 16.2.1 Setting up a Build Area


    RPM''s build area consists of five directories in the top-level:


    +   1. The BUILD directory is where the software is unpacked and built.

    2. The RPMS directory is where the newly created binary package files are written.

    3. The SOURCES directory contains the original sources, patches, and icon files.

    4. The SPECS directory contains the spec files for each package to be built.

    5. The SRMS directory is where the newly created source package files are written.


    The description of the RPMS directory above, is missing one key point. Since the
    binary package files are specific to an architecture, the directory actually contains
    one or more'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 16.2 Having RPM Use a Different Build Area


    subdirectories, one for each architecture. It is in these subdirectories that
    RPM will write the binary package files.


    Let''s start by creating the directories. We can even do it with one command:


    ```

    % pwd

    /home/ed

    % mkdir mybuild\

    ? build/BUILD\

    ? build/RPMS\

    ? build/RPMS/i386\

    ? build/SOURCES\

    ? build/SPECS\

    ? build/SRPMS

    ```


    That''s all there to it. You may have noticed that we created a subdirectory to
    RPMS called i386 — This is the architecture-specific subdirectory for Intel x86-systems,
    which is our example build system.


    The next step in getting RPM to use a different build area is telling RPM where
    the new build area is. And it''s almost as easy as creating the build area itself.


    # 16.2. Directing RPM to Use the New Build Area


    All that''s required to get RPM to start using the new build area is to define
    an alternate value for topdir in an rpmrc file. For the non-root user, this means
    putting the following line in a file called .rpmrc, located in your home directory:


    ```

    topdir:<path>

    ```


    By replacing "<path>" with the path to the new build area''s top-level directory,
    RPM will attempt to use it next time a build is performed. Using our newly created
    build area as an example, we''ll set topdir to /home/ed/mybuild:


    ```

    topdir /home/ed/mybuild

    ```


    That''s all there to it. Now it''s time to try a build.


    # 16.2.3 Performing a Build in a New Build Area


    In the following example, a non-root user attempts to build the cdplayer package
    in a personal build area. If the user has modified rpmrc file to change the default
    build area, the command used to start the build is just like the one used by a
    root user. Otherwise, the --buildroot option will need to be used:'
