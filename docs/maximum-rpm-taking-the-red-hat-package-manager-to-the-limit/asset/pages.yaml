- pgno: 374
  md: '# Appendix A


    # Format of the RPM File


    # A.1 RPM File naming convention


    While RPM will run just as well if a package file has been renamed, when the packages
    are created during RPM''s build process, they follow a specific naming convention.
    The convention is:


    ```

    name-version-release.architecture.rpm

    ```


    where:


    +   * **name** is a name describing the packaged software.

    * **version** is the version of the packaged software.

    * **release** is the number of times the software has been packaged.

    * **architecture** is a shorthand naming the type of computer hardware the packaged
    software is meant to run on. It may also be the string *src*, or *nosrc*. Both
    of these strings indicate the file is an RPM source package. The *nosrc* string
    means the file contains only package building files, while the *src* string means
    the file contains the necessary package building files and the software''s source
    code.


    A few notes are in order. Normally, the package name is taken verbatim from the
    packaged software''s name. Occasionally, this approach won''t work usually this
    occurs when the software is split into multiple "subpackages", each supporting
    a different set of functions. An example of this situation would be the ways *nurses*
    was packaged on Red Hat Linux. The package incorporating *nurses* build functionality
    was called *nurses*, while the package incorporating those parts of *nurses*''
    program development functionality was named *nurses-devel*.


    The version number is normally taken verbatim from the package''s version. The
    only restriction on the version is that it cannot contain a dash "-".'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# Format of the RPM File


    The release can be thought of as the package''s version. Traditionally it is a
    number, starting

    at 1, that shows how many times the packaged software, at a given version, has
    been built.

    This is tradition and not a restriction, however. Like the version number, the
    only restriction

    is that dashes are not allowed.


    The architecture specifier is a string that indicates what hardware the package
    has

    built for. There are a number of architectures defined:


    +   - i386 — The Intel x86 family of microprocessors, starting with the 80386.

    - alpha — The Digital Alpha/AXP series of microprocessors.

    - sparc — Sun Microsystem''s SPARC series of chips.

    - mips — MIPS Technologies'' processors.

    - ppc — The Power PC microprocessor family.

    - m68k — Motorola’s 68000 series of CISC processors.

    - SGI — Equivalent to “MIPS”


    This list will almost certainly change. For the most up-to-date list, please refer
    to the

    file /usr/lib/rpmrc. It contains information used internally by RPM, including
    a list of

    architectures and equivalent code numbers.


    # A.2 RPM File Format


    While the following details concerning the actual format of an RPM package file
    were accu-

    rate at the time this was written, two points should be kept in mind:


    +   1. The file format is subject to change.

    2. If a package file is to be manipulated somehow, you are strongly urged to use
    the

    appropriate rpmlib routines to access the package file. Why? See point number
    1!

    3. This appendix describes the most recent version of the RPM file format: version
    3.

    Thefile(1) utility can be used to see a package’s file format version.


    With those caveats out of the way, let''s take a look inside an RPM file...


    # A.2.1 Parts of an RPM File


    Every RPM package file can be divided into four distinct sections. They are:


    +   - The lead.

    - The signature.'
