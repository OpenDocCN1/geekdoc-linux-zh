  img_proc: true
- pgno: 212
  md: '# 13.3 Scripts: RPM''s Workhorse


    # %pre Script


    The %pre script executes just before the package is to be installed. It is the
    rare package that requires anything to be done prior to installation; none of
    the 350 packages that comprise Red Hat Linux 4.0 make use of it.


    # %post Script


    The %post script executes after the package has been installed. One of the most
    popular reasons a %post script is needed to run ldconfig to update the list of
    available shared libraries after a new one has been installed. Of course, other
    functions can be performed in a %post script. For example, packages that install
    shells use the %post script to add the shell name to /etc/shells.


    If a package uses a %post to perform some function, often it will include a %postun
    script that performs the inverse of the %post script, after the package has been
    removed.


    # %preun Script


    If there''s a time when your package needs to have one last look before the user
    erases it, the place to do it is in the %preun script. Anything that a package
    needs to do immediately prior to RPM any action to erase the package, can be done
    here.


    # %postun Script


    The %postun script executes after the package has been removed. It is the last
    chance for a package to clean up after itself. Often, %postun scripts are used
    to run ldconfig to remove newly erased libraries from /ld.so.cache.


    # 13.3 Verification-Time Script — The %veryscript Script


    The %veryscript executes whenever the installed package is verified by RPM''s
    verification command. The contents of this script is entirely up to the package
    builder, but in general the script should do whatever is necessary to verify the
    package''s proper installation. Since RPM automatically verifies the existence
    of a package''s files, along with other file attributes, the %veryscript script
    should concentrate on different aspects of the package''s installation. For example,
    the script may ensure that certain configuration files contain the proper information
    for the package being verified:


    ```

    for n in ash bsh;

    echo -n "Looking for $n in /etc/shells... " \

    if grep "/$(n)" /etc/shells > /dev/null; then

    echo "missing"

    echo "$(n) missing from /etc/shells " >&2

    ```'
  merge: -1
  img_proc: true
