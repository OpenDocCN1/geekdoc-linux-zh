- pgno: 43
  md: '# 2.1 rpm -i — What does it do?


    Of the many things RPM can do, probably the one that people think of first is
    the installation of software. As mentioned earlier, installing new software is
    a complex, error-prone job. RPM tends that process into a single command.


    rpm -i (--install is equivalent) installs software that''s been packaged into
    an RPM package file. It does this by:


    +   - Performing dependency checks.

    - Checking for conflicts.

    - Performing any tasks required before the install.

    - Deciding what to do with config files.

    - Unpacking files from the package and putting them in the proper place.

    - Performing any tasks required after the install.

    - Keeping track of what it did.


    Let''s go through each of these steps in a bit more detail.


    **Performing dependency checks:** Some packages will not operate properly unless
    some other package is installed, too. RPM makes sure that the package being installed
    will have its dependency requirements met. It will also insure that the package''s
    installation will not cause dependency problems for that already-installed packages.


    **Checking for conflicts:** RPM performs a number of checks during this phase.
    These checks looks for things like attempts to install an already installed package,
    attempts to install an older package over a newer version, or the possibility
    that a file may be overwritten.


    **Performing any tasks required before the install:** There are cases where one
    or more commands must be given prior to the actual installation of a package.
    RPM performs these commands exactly as directed by the package builder, eliminating
    a common source of problems during installations.


    **Deciding what to do with config files:** One of the features that really sets
    RPM apart from other package managers, is the way it handles configuration files.
    Since these files are normally changed to customize the behavior of installed
    software, simply overwriting a config file would tend to make people angry — all
    customizations would be gone! Instead, RPM analyzes the situation and attempts
    to do “the right thing” with config files, even if they weren''t originally installed
    by RPM


    > Are you interested in what “the right thing” means? Turn to page 44 and read
    section 4.1.1 for more details.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 2.2 Performing Install


    Unpacking files and putting them in the proper place: This is the step most people
    think of when they think about installing software. Each package file contains
    a list of files that are to be installed, as well as their destination on your
    system. In addition, many other file attributes, such as permissions and ownerships,
    are set correctly by RPM.


    Performing any tasks required after the install: Very often a new package requires
    one or more commands be executed after the new files are in place. An example
    of this would be running ldconfig to make new shared libraries accessible.


    Keeping track of what it did: Every RPM installs a package on your system, it
    keeps track of the files it installed, in its database. The database contains
    a wealth of information necessary for RPM to do its job. For example, RPM uses
    the database when it checks for possible conflicts during an install.


    # 2.2 Performing Install


    Let''s have RPM install a package. The only thing necessary is to give the command
    (rpm -i) followed by the name of the package file:


    ```

    # rpm -i eject-1.2-2.i386.rpm

    #

    ```


    At this point, all the steps outlined above have been performed. The package is
    now installed. Note that the file name may not adhere to RPM''s naming convention:


    ```

    # mv eject-1.2-2.i386.rpm baz.txt

    # rpm -i baz.txt

    ```


    In this case, we changed the name of the package file eject-1.2-2.i386.rpm to
    baz.txt and then proceeded to install the package. The result is identical to
    the previous install, that is, the eject-1.2-2 package successfully installed.
    The name of the package file, although normally incorporating the package label,
    is not used by RPM during the installation process. RPM uses the contents of the
    package file, which means even if the file was placed on a DOS floppy and the
    name truncated, the installation would still proceed normally.


    # 2.2.1 URLs — Another Way to Specify Package Files


    If you''ve searched the World Wide Web, you''ve doubt noticed the web pages are
    identified:


    ```

    http://www.redhat.com/support/docs/rpm/RPM-HOWTO/RPM-HOWTO.html

    ```'
