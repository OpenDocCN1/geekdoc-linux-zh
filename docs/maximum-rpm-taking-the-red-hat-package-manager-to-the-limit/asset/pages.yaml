- pgno: 223
  md: '# 196 Inside the Spec File


    How did the %patch macro know which patch to apply? Keep in mind that, like the
    source tag lines, every patch tag is numbered, starting at zero. The %patch macro,
    by default, applies the patch file named on the patch (or patch0) tag line.


    # Specifying Which patch Tag To Use


    The %patch macro actually has two different ways to specify the patch tag line
    it is to use. The first method is to append the number of the desired patch tag
    to the end of the %patch macro itself. For example, in order to apply the patch
    specified on the patch2 tag line, the the following %patch macro could be used:


    ```

    %patch2

    ```


    The other approach is to use the -P option. This option is followed by the number
    of the patch line desired. Therefore, this line is identical in function to the
    previous one:


    ```

    %patch -P

    ```


    Note that the -P option will not apply the file specified on the patch0 line,
    by default. Therefore, if you choose to use the -P option to specify patch numbers,
    you''ll need to use the following format when applying patch zero:


    ```

    %patch -P 0

    ```


    -p <#> - Strip <#> slashes and directories from patch filenames


    The -p (Note the lowercase "p") option is sent directly to the patch command.
    It is followed by a number, which specifies the number of leading slashes (and
    the directories in between) to strip from filenames in the patch file. For more
    information on this option, please consult the patch man page.


    -b <name> - Set the backup file extension to <name>


    When the patch command is used to apply a patch, unmodified copies of the files
    patched are renamed to end with the extension .orig. The -b option is used to
    change the extension used by patch. This is normally done when multiple patches
    are to be applied to a given file. By doing this, copies of the file as it existed
    prior to each patch are readily readily.


    # -E Remove Empty Output Files


    The -E option is passed directly to the patch program. When patch is run with
    the -E option, any output files that are empty after the patches have been applied,
    are removed. Now let''s use %patch on a test-drive, and put it into its paces.'
