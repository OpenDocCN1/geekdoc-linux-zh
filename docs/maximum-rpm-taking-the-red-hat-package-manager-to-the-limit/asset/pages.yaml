    ```


    This function reads a header from file fd, converting it from network byte order
    to the host''s system byte order. If magicp is defined to be HEADER_MAGIC_YES,
    headerRead() will expect magic numbers, and will return an error if they are not
    present. Likewise, if magicp is defined to be HEADER_MAGIC_NO, headerRead() will
    not check the header''s magic numbers, and will return an error if they are present.


    On error this function returns NULL.


