    ```


    So far, so good - the proper directories are there. Let''s look at the man page
    first:


    ```

    # cd /usr/foogly/blather/man/man1/

    # ls -al

    total 5

    -rwxr-xr-x 1 root root 4550 Oct 7 13:23 cdp.1*

    #

    ```


    That looks ok. Now on to the files in bin:


    ```

    # cd /usr/foogly/blather/bin

    # ls -al

    total 41

