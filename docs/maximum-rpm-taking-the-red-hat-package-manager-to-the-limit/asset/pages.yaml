  md: '# Misscellia


    ".patch" are patches to the source. RPM permits patches to be processed when building
    binary packages. The patches are bundled along with the original, unmodified sources
    in the source package.


    The last file is a gzipped tar file. If you''ve gotten software off the Internet,
    you''re probably familiar with tar files, gzipped or not. If we look inside the
    file, we should see all the usual kinds of things: README file, a Makefile or
    two, and some source code:


    ```

    # tar zf cdp-0.33.tgz

    cdp-0.33/COPY

    cdp-0.33/ChangeLog

    cdp-0.33/INSTALL

    cdp-0.33/Makefile

    cdp-0.33/README

    cdp-0.33/cdp

    cdp-0.33/cdp-0.33.lsm

