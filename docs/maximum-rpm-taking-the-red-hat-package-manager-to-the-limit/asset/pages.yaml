- pgno: 60
  md: '# 2.4 Additional options for rpm -i


    # 2.4.15 --ftport <port>: Use in FTP-based Installs


    Back in section 2.2.1 we find how RPM can access package files by the use of a
    URL. We also mentioned that some systems may not use the standard FTP port. In
    those cases, it''s necessary to give RPM the proper port number to use. As we
    mentioned above, one approach is to embed the port number in the URL itself.


    Another approach is to use the --ftport option. RPM will access the desired port
    when this option, along with the port number, is added to the command line. In
    cases where the port seldom changes, it may be entered in an rpmrc file using
    the ftport entry.¹⁰


    # 2.4.16 --ftproxy <host>: Use As Proxy In FTP-based Installs


    Many companies and Internet Service Providers (ISPs) employ various methods to
    protect their network connections against misuse. One of these methods is use
    a system that will process all FTP requests on behalf of the other systems on
    the company or ISP network. By using a single computer as a proxy for the other
    systems, it serves to protect the other systems against any FTP-related misuse.


    When RPM is employed on a network with an FTP proxy system, it will be necessary
    for RPM to direct all its FTP requests to the FTP proxy. RPM will send its FTP
    requests to the specified proxy when the --ftproxy option, with the proxy hostname,
    is added to the command line.


    In cases the proxy host seldom changes, it may be entered in an rpmrc file by
    the ftproxy entry.¹¹


    # 2.4.17 --ignorearch: Do Not Verify Package Architecture


    When a package file is created, RPM specifies the architecture, or type of computer
    hardware, for which the package was created. This is a good thing, as the architecture
    is one of the main factors in determining whether a package for one computer is
    going to be compatible with another computer.


    When a package is installed, RPM uses the arch_compat rpmrc entries to determine
    what are normally considered compatible architectures. Unless you''re prompting
    RPM to a new architecture, you shouldn''t make any changes to these entries.¹²
    While RPM attempts to make the right decisions regarding package compatibility,
    there are times when it errors on the side of conservatism. The --ignorearch option
    is used in those cases. When added to the command line, RPM will not perform any
    architecture-related checking.


    Unless you know what you''re doing, you should never use--ignorearch!


    > ¹⁰The use of rpmrc files is described in Appendix B


    > ¹¹The use of rpmproxy files is described in Appendix B


    > ¹²If you are prompting RPM, you''ll find more on arch_compat in section 19.3.1
    or on page 273.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 2.4.18 --ignoreos: Do Not Verify Package Operating System


    When a package file is created, RPM specifies the operating system for which it
    was created. This is a good thing as the operating system is one of the main factors
    in determining whether a package written for one computer is going to be compatible
    with another computer.


    When a package is installed, RPM uses the os_compat rpmrc entries to determine
    what are normally considered compatible operating systems. Unless you''re porting
    RPM to a new operating system, you shouldn''t make any changes to these entries.¹¹³
    While RPM attempts to make the right decisions regarding package compatibility,
    there are times it errs on the side of conservatism. In those cases, it''s necessary
    to override RPM''s decision. The --ignoreos option is used in those cases. When
    added to the command line, RPM will not perform any operating system-related checking.


    Unless you really know what you''re doing, you should never use --ignoreos!


    ¹³If you are porting RPM, you''ll find more on os_compat in section 19.3.1 on
    page 273.'
