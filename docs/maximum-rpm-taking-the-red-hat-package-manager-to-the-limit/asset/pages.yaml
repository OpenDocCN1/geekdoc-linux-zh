    cdp-0.33/cdp.1.Z

    cdp-0.33/cdp.c

    cdp-0.33/cdp.h

    ```


    There''s more, but you get the idea. OK, so there are the sources. But what is
    that "spec" file mentioned in the output? It mentions something about "/usr/src/redhat/SPECS",
    so let''s see what we have in that directory:


    ```

    # ls -al /usr/src/redhat/SPECS

    -rw-r--r-- 1 root root 397 Apr 24 22:36 cdp-0.33.spec

    ```


    Without making a story too short, a spec file contains information used by RPM
    to create the binary and source packages. Using the spec file, RPM:


    +   - Unpacks the sources.

    - Applies patches (if any exist).

    - Builds the software.

    - Creates the binary package file.

    - Creates the source package file.

    - Cleans up after itself.


    Theneat part of this is that RPM does this all automatically, under the control
    of the spec file. That''s all we''re going to say about how RPM builds packages.
    For more information, please refer to the second half of this book.'
