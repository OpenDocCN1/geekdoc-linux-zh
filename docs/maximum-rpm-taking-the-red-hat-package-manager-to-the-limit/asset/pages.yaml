- pgno: 378
  md: '# A.2 RPM File Format


    # The lead: Abandoned Data Structure


    What''s the problem, and why is the lead no longer used by RPM? The answer to
    these questions is a single word: inflexibility. The technique of defining a C
    structure to access data in a file just isn''t very flexible. Let''s look at an
    example.


    Flip back to the lead''s C structure on page 349. Say, for example, that some
    software comes along, and it has a long name. A very long name. A name so long,
    in fact that the 66 bytes defined in the structure element name just couldn''t
    hold it.


    What can we do? Well, we could certainly change the structure such that the name
    element would be 100 bytes long. But once a new version of RPM is created using
    this new structure, we have two problems:


    +   - Any package file created with the new version of RPM wouldn''t be able to
    read older package formats.

    - Any older version of RPM would be unable to install packages with the newer
    version of RPM.


    Not a very good situation! Ideally, we would like to eliminate the requirement
    that the format of the data written to a package file be engraved in granite.
    We should be able to do the following things, all without losing compatibility
    with existing versions of RPM.


    +   - Add extra data to the file format.

    - Change the size of existing data.

    - Reorder the data.


    Sounds like a big problem, but there''s a solution...


    # Is There a Solution?


    The solution is to standardize the method by which information is retrieved from
    a file. This is done by creating a well-defined data structure that contains easily
    searched information about the data, and then physically separating that information
    from the data.


    When the data is required, it is found using the easily searched information,
    which points to the data itself. The benefits are, that the data can be placed
    anywhere in the file, and that the format of the data itself can change.


    # The Solution: The Header Structure


    The header structure is RPM''s solution to the problem of easily manipulating
    information in a standard way. The header structure''s sole purpose in life is
    to contain zero or more pieces of data. A file can have more than one header structure
    in it. In fact, an RPM package file has two the signature, and the header. Was
    from this that the header structure got its name.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# Format of the RPM File


    There are three sections to each header structure. The first section is known
    as the “header structure header”. The header structure header is used to identify
    the start of a header structure, its size, and the number of data items it contains.


    Following the header structure header is an area called the “index”. The index
    contains one or more index entries. Each index entry contains information about,
    and a pointer to, a specific data item.


    After the index comes the “store”. It is in the store that the data items are
    kept. The data in the store is packed together as closely as possible. The order
    in which the data is stored is immaterial — a far cry from the C structure used
    in the lead.


    # The Header Structure in Depth


    Let’s take a more in-depth look at the actual format of a header structure, starting
    with the header structure:


    The Header Structure Header — The header structure always starts with a three-byte
    magic number: 8ae e8. Following this is a one-byte version number. Next are four
    bytes that are reserved for future expansion. After the reserved bytes, there
    is a four-byte number that indicates how many index entries exist in this header
    structure, followed by another four-byte number indicating how many bytes of data
    are part of the header structure.


    The Index Entry — The header structure’s index is made up of zero or more index
    entries. Each entry is sixteen bytes long. The first four bytes contain a “tag”
    — a numeric value that identifies what type of data is pointed to by the entry.
    The tag values change according to the header structure’s position in the RPM
    file. A list of the actual tag values, and what they represent, will be included
    later in this appendix.


    Following the tag, is a four-byte “type”, which is a numeric value that describes
    the format of the data pointed to by the entry. The types and their values do
    not change from header structure. Here is the current list:


    +   * NULL = 0

    * CHAR = 1

    * INT8 = 2

    * INT16 = 3

    * INT32 = 4

    * INT64 = 5

    * STRING = 6

    * BIN = 7'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# A.2 RPM File Format


    +   * STRING_ARRAY = 8


    A few of the data types might need some clarification. The STRING data type is
    simply a null-terminated string, while the STRING_ARRAY is a collection of strings.
    Finally, the BIN data type is a collection of binary data. This is normally used
    to identify data that is longer than an INT, but not a printable STRING.


    Next is a four-byte "offset" that contains the position of the data, relative
    to the beginning of the store. We''ll talk about the store in just a moment.


    Finally, there is a four-byte "count" that contains the number of data items pointed
    to the index entry. There are a few wrinkles to the meaning of the count, and
    they center around the STRING and STRING_ARRAY data types. STRING data always
    has a count of 1, while STRING_ARRAY data has a count equal to the number of strings
    contained in the store.


    The Store — The store is where the data contained in the header structure is stored.
    Depending on the data type being stored, there are some details that should be
    kept in mind:


    +   * For STRING data, each string is terminated with a null byte.


    +   * For INT data, each integer is stored at the natural boundary for its type.
    A 64-bit INT is stored on an 8-byte boundary, a 16-bit INT is stored on a 2-byte
    boundary, and so on.


    +   * All data is in network byte order.


    With all these details out of the way, let''s look at the signature.


    # A.2.4 The Signature


    The signature follows the lead in the RPM package file. It contains information
    that can be used to verify the integrity, and optionally, the authenticity of
    the package file. The signature is implemented as a header structure.


    You probably noticed the word, "majority," above. The information in the signature
    header structure is based on the contents of the package file''s header and archive
    only. The data in the lead and signature header structure are not included when
    the signature information is created, or are they part of subsequent checks based
    on that information.


    While this omission might be a weakness in RPM''s design, it isn''t. In the case
    of lead, since it is used only for identification of package files, any changes
    made to that part of the file would, at least, leave the file in a state that
    RPM wouldn''t recognize it as a valid package file. Likewise, any changes to the
    signature header would make it impossible to verify the file''s integrity, since
    the signature information would have changed from their original values.'
  merge: -1
  img_proc: true
