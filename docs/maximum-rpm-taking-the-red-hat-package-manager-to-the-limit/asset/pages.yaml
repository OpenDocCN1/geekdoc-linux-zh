- pgno: 395
  md: '# B.2.2  /etc/rpmrc


    Next, we have /etc/rpmrc.


    The file /etc/rpmrc, unlike /usr/lib/rpmrc, is fair game for modifications and
    additions. In fact, /etc/rpmrc isn''t created by default, so its contents are
    entirely up to you. It''s the perfect place to keep rpmrc entries of a system-wide
    or global nature.


    The vendor entry is a great example of a good candidate for inclusion in /etc/rpmrc.
    In most cases, a particular system is dedicated to building packages for one vendor.
    In these instances, the vendor entry in /etc/rpmrc is best.


    In the hierarchy is a file named .rpmrc, residing in the user''s login directory.


    # B.2.3  .rpmrc in the user''s login directory


    As you might imagine, a file called .rpmrc in a user''s login directory is only
    going to be read by that user when she runs RPM. Like /etc/rpmrc, this file is
    not created by default, but it can contain the same rpmrc entries as the other
    files. The packager entry, which should contain the name and contact information
    for the person who built the package, is not an appropriate candidate for 7.rpmrc.


    # B.2.4  File indicated by the --rcfile option


    The --rcfile option is best used only when a totally different RPM configuration
    is desired for one or two packages. Since the only other rpmrc file used is /usr/lib/rpmrc
    with its low-level default settings, the file specified with the --rcfile option
    will have to be more comprehensive than /etc/rpmrc or 7.rpmrc.


    # B.3  rpmrc File Syntax


    As you might have surmised from the example file we briefly reviewed, the basic
    syntax of an rpmrc file entry is:


    <name>:<value>


    The <name> part of the entry is not case sensitive, so any capitalization is acceptable.
    The colon separating the name from its value must immediately follow the name.
    No spaces are allowed here. The formatting requirements on the value side of the
    entry vary from value to value and will be discussed along with each entry.


    # B.4  rpmrc File Entries


    In this section, we discuss the various entries that can be used in each of the
    rpmrc files.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# B.4 rpmrc File Entries


    # B.4.1 arch_canon


    The arch_canon entry is used to define a table of architecture names and their
    associated numbers. This canonical architecture names and numbers are then used
    internally by RPM whenever architecture-specific processing takes place. This
    entry''s format is: arch.canon:<label>: <string> <value>


    The <label> is compared against information from uname(2) after it''s been translated
    using the appropriate buildarchtranslate entry. If a match is found, then <string>
    is used by RPM to reference the system''s architecture. When building a binary
    package, RPM uses <string> as part of the package''s filename, for instance.


    The <value> is a numeric value RPM uses internally to identify the architecture.
    For example, this number is written in the header of each package file so that
    the file command identify the architecture for which the package was built.


    # B.4.2 os_canon


    The os_canon entry is used to define a table of operating system names and their
    associated numbers. These canonical operating system names and numbers are then
    used internally by RPM whenever operating system-specific processing takes place.
    This entry''s format is: os.canon:<label>: <string> <value>


    The <label> is compared against information from uname(2) after it''s been translated
    using the appropriate buildarchtranslate entry. If a match is found, then <string>
    is used by RPM to reference the operating system.


    The <value> is a numeric value RPM uses internally to uniquely identify the operating
    system.


    # B.4.3 buildarchtranslate


    The buildarchtranslate entry is used in the process of defining the architecture
    that RPM will use as "build" architecture. As the name implies, it is used to
    translate the raw information from uname(2) to the canonical architecture defined
    by arch.canon.


    The format of the buildarchtranslate entry is slightly different from most other
    rpmrc file entries. Instead of the usual <name>:<value> format, the buildarchtranslate
    entry looks like this:


    buildarchtranslate:<label>: <string>


    The <label> is compared against information from uname(2). If a match is found,
    then <string> is used by RPM to define the build architecture.


    > ¹The buildarchtranslate rpmrc file entry is discussed on page 370.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# B.4.4 buildostransfer


    The buildostransfer entry is used in the process of defining the operating system
    RPM will use the "build" operating system. As the name implies, it is used to
    translate the raw information returned by uname(2) to the canonical operating
    systemd defined by os_canon.

    The format of the buildostransfer entry is slightly different from most other
    rpmrc file entries. Instead of the usual <name>:<value> format, the buildostransfer
    entry looks like this:


    buildostransfer:<label>: <string>


    The <label> is compared against information from uname(2). If a match is found,
    then <string> is used by RPM to define the build operating system.


    # B.4.5 arch_compat


    The arch_compat entry is used to define which architectures are compatible with
    one another. This information is used when packages are installed; in this way,
    RPM can determine whether a given package file is compatible with the system.
    The format of the entry is:

    arch_compat:<label>: <list>


    The <label> is an architecture string, as defined by an arch_canon entry. The
    <list> following consists of one or more architectures, also defined by arch_canon.
    If there is more than one architecture in the list, they should be separated by
    a space.


    The architectures in the list are considered compatible to the architecture specified
    in the label.


    # B.4.6 os_compat (operating system-specific)


    Default value:


    The os_compat entry is used to define which operating systems are compatible with
    one another. This information is used when packages are installed; in this way,
    RPM can determine whether a given package file is compatible with the system.
    The format of the entry is:

    <name>:<label>: <list>


    The <label> is an operating system string, as defined by an os_canon entry. The
    <list> following consists of one or more operating systems, also defined by os_canon.
    If there is more than one operating system in the list, they should be separated
    by a space.


    The operating systems in the list are considered compatible to the operating system
    specified in the label.'
