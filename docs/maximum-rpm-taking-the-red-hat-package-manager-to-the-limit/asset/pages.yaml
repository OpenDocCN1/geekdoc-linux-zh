    # 5.2.6 --dbpath <path>: Use <path> To Find RPM Database


    In order for RPM to do its hardwork, it needs access to an RPM database. Normally,
    this database exists in the directory specified by the rpmrc entry, dppath. By
    default, dppath is set to /var/lib/rpm.


    Although the dppath entry can be modified in the appropriate rpmrc file, the --dbpath
    option is probably a better choice when the database path needs to be changed
    temporarily. An example of --dbpath option would come in handy when it''s necessary
