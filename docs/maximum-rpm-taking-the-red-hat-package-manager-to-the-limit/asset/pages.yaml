  md: '# Chapter 18


    # Creating Subpackages


    In this chapter, we will explore one of RPM''s more interesting capabilities:
    the capability to create subpackages.


    # 18.1 What Are Subpackages?


    Very simply put, a subpackage is one of several package files created from a single
    spec file. RPM has the ability to create a main package, along with one or more
    subpackages. Subpackages may also be created without the main package. It''s all
    up to the package builder.


    # 18.2 Why Are They Needed?


    If all the software in the world followed the usual "one source, one binary" structure,
    there would be no need for subpackages. After all, RPM handles the building and
    packaging of a program into a single package file just fine.


    But software doesn''t always conform to this simplistic structure. It''s not unusual
    for software to support two or more different modes of operation. A client/server
    program, for example, comes in two flavors: a client, and a server.


    And it can get more complicated than that. Sometimes software relies on another
    program so completely that the two cannot be built separately. The result is often
    severe packages. While it is entirely possible that some convoluted procedure
    could be devised to force these kinds of software into a single-package structure,
    it makes more sense to let RPM manage the creation of subpackages. Why? From the
    package builder''s viewpoint, the main reason to use subpackages is to eliminate
    any duplication of effort.


    By using subpackages, there''s no need to maintain separate spec files and endure
    the resulting-headaches when new versions of the software become available. By
    keeping everything in'
