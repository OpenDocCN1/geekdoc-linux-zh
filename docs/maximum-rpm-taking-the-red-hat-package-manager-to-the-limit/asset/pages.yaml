- pgno: 178
  md: '# rpm -b — What Does It Do?


    Normally, the -bc option instructs RPM to stop the build after the %build section
    of the spec file has been executed. By adding --short-circuit, however, RPM starts
    the build by executing the %build section and stops everything in %build has been
    executed.


    There is only one other build stage that can be --short-circuited, and that is
    the install stage. For this restriction it is difficult to bypass RPM''s use of
    pristine sources. If there were possible to --short-circuit to -bb or -ba, a package
    builder might take the "easy" way out and simply hack at the build tree until
    the software builds successfully, then package the hacked sources. RPM will only
    --short-circuit to -bc or -bi. Nothing else will do.


    What exactly does an rpm -bi --short-circuit do? Like an rpm -bc --short-circuit,
    it starts executing at the named stage, which in this case is %install. Note that
    the build environment must be ready to perform an install before attempting to
    --short-circuit to the %install stage. If the software installs via make install,
    will automatically compile the software anyway.


    And what happens if the environment isn''t ready and a --short-circuit is attempted?
    Let''s see:


    ```

    # rpm -bi --short-circuit cdplayer-1.0.spec

    # Package: cdplayer

    + umask 022

    + echo Executing:%install

    Executing:%install

    + cd /usr/src/redhat/BUILD

    + cd cdplayer-1.0

    /var/tmp/rpmbu0115aaa: cdplayer-1.0: No such file or directory

    Bad exit status

    #

    ```


    RPM blindly started executing the %install stage, but came to an abrupt halt when
    attempted to change directory into cdplayer-1.0, which didn''t exist. After giving
    a descriptive error message, RPM exited with a failure status. Except for some
    minor differences, rpm -bc would fail the same way.


