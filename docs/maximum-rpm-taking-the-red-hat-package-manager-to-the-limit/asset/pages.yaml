    one reason or another, will not produce useful output when using in a format string.
    For a comprehensive list of queryformat tags, please see Appendix D on page 385.


    # 5.2.3 Getting a lot more information with -vv


    Sometimes it is necessary to have even more information than we can get with -v.
    By adding another v, we can start to see more of RPM''s inner workings:


    ```

    # rpm -qqv rpm

    D: opening database in //var/lib/rpm/

    D: querying record number 2341208

    rpm-2.3-1

    #

