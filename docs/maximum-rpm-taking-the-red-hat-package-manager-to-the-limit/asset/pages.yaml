  md: '# 1.4 What’s in a package?


    With all the magical things we claimed that package management software in general
    (and RPM in particular) can do, you''d think there was a tiny computer guru bundled
    in every package. However, the reality is not magical. Here''s a quick overview
    of the more important parts of an RPM package¹


    # 1.4.1 RPM’s Package Labels


    Every package built for RPM has to have a specific set of information that uniquely
    identifies it. We call this information a package label. Here are two sample package
    labels:


    +   * nls-1.0-1

    * perl-5.001m-4


    While these labels look like they have very little in common, in fact they all
    follow RPM’s labelling convention. There are three different components in every
    package label. Let''s look at each one in order:


    # Component #1: The Software’s Name


    Every package label begins with the name of the software. The name may be derived
    from the name of the application packaged, or it may be a name describing a group
    of related programs bundled together by the package builder. The software names
    in the packages listed above are: nls and perl. As you can see, the software name
    is separated from the rest of the package label by a dash.


    # Component #2: The Software’s Version


    Next in the package label is an identifier that describes the version of the software
    being packaged. If the package builder bundles a number of related programs together,
    the soft-version is probably a number of their own choosing. However, if the package
    consists of one major application, the software version normally comes directly
    from the application’s developer. The actual version specification is quite flexible,
    as can be seen in the examples above. The versions shown are: 1.0 and 5.001m.
    A dash separates the software version from the remainder of the package label.


    # Component #3: The Package’s Release


    The package release is the most unambiguous part of a package label. It is a number
    chosen by the package builder. It reflects the number of times the package has
    been rebuilt using the same version software. Normally, the builds are due to
    bugs uncovered after the package


