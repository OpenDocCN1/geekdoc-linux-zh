- pgno: 90
  md: '# 5.2 The Parts of an RPM Query


    1. normal — A file in the normal state has not been modified by installing another
    package on the system.


    2. replaced — Files in the replaced state have been modified by installing another
    package on the system.


    3. not installed — A file is classified as not installed when it, er, isn''t installed!
    This state is normally seen only if the package was partially installed. An example
    of a partially installed package would be one that was installed with the --excluded
    option. Using this option, no documentation files would be installed. The RPM
    database would still contain entries for these missing files, but their state
    would be not installed.


    4. net shared — The net shared state is used to support client systems that NFS
    mount points of their filesystems from a server. The server most likely exports
    filesystems to more than one client, if client erased a package that contains
    files on a shared filesystem, other client systems would have incomplete installed
    packages. The net shared state is used to alert RPM to the fact that a file is
    on shared filesystem and should not be erased. Files will be in the net shared
    state when two things happen:


    +   (a) The netsharedpath rpmrc file entry has been changed from its default (null)
    value.³


    +   (b) The file is to be installed in a directory within a net shared path.


    Here''s an example showing how file states appear:


    ```

    # rpm -qs adduser

    normal /usr/sbin/adduser

    #

    ```


    (That normal at the start of the line is the state, followed by the file name)


    The file state is one of the tools RPM uses to determine the most appropriate
    action to take when packages are installed or erased.


    Now would the average person need to check the states of files? Not really. But
    if there should be problems, this kind of information can help get back on track.


