- pgno: 255
  md: '# 228 Making a Relocatable Package


    Ah, when the software is installed during RPM''s build process, the make file
    sets up the symbolic link. Looking back at the %files list, we see cdplay listed.
    RPM blindly packaged the symlink, complete with its non-relocatable string. This
    is why we mentioned absolute symlinks as a prime example of relocatable software.


    Fortunately, this problem isn''t that difficult to fix. All we need to do is change
    the line in the makefile that creates the symlink from:


    ```

    ln -s /usr/local/bin/cdp /usr/local/bin/cdplay

    ```


    To:


    ```

    ln -s /cdp /usr/local/bin/cdplay

    ```


    Now cdplay will always point to cdp, no matter where it''s installed. When building
    relocatable packages, relative symlinks are your friend! After rebuilding the
    package, let''s see if our modifications have the desired effect. First, a normal
    install with the default prefix:


    ```

    # rpm -Uvh --nodeps cdplay-1.0-1.i386.rpm

    cdplay      ############################################################


    # cd /usr/local/bin/

    # ls -al cdplay

    lrwxxr-x 1 root 30 Oct 8 22:32 cdplay -> ./cdp*

    ```


    Next, we''ll try a second install using the --prefix option (after we first delete
    the original package):


    ```

    # rpm -e cdplay

    # rpm -Uvh --nodeps --prefix /a/dump/prefix cdplay-1.0-1.i386.rpm

    cdplay      ############################################################


    # cd /a/dump/prefix/

    # ls -al cdplay

    lrwxxr-x 1 root 30 Oct 8 22:34 cdplay -> ./cdp*

    #

    ```


    As you can see, the trickiest part about building relocatable packages is making
    sure the software you''re packaging is up to the task. Once that part of the job
    is done, the actual modifications are straightforward.


    In the next chapter, we''ll cover how packages can be built in non-standard directories,
    as well as how non-root users can build packages.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Chapter 16


    # Making a Package That CannBuild Anywhere


    While RPM makes building packages as easy as possible, some of the default design
    decisions might not work well in a particular situation. Here are two situations
    where RPM''s method of package building may cause problems:


    +   1. You are unable to dedicate a system to RPM package building, or the software
    you''re packaging would disrupt the build system''s operation if it were installed.

    2. You would like to package software, but you don''t have root access to an appropriate
    build system.


    Either of these situations can be resolved by directing RPM to build, install,
    and package the software in a different area on your build system. It requires
    a bit of additional effort to accomplish this, but take a step at a time, it is
    not difficult. Basically, the process can be summed up by addressing the following
    steps:


    +   * Writing the package''s spec file to support a build root.

    * Directing RPM to build software in a user-specified build area.

    * Specifying file attributes that RPM needs to set on installation.


    The methods discussed here are not required in every situation. For example, a
    system administrator developing a package on a production system may only need
    to add support for a build root. On the other hand, a student wishing to build
    a package on a university system will need to get around the lack of root access
    by implementing every method described here.'
