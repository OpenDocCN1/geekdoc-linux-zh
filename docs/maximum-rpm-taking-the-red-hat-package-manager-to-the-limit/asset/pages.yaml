- pgno: 265
  md: '# Making a Package That Can Build Anywhere


    +   - The <user> is represented in traditional numeric fashion.

    - The <user> is specified by the login name of the user. Numeric UIDs are not
    used, for reasons we''ll explore in a moment.

    - The <group> is specified by the group''s name, as entered in /etc/group. Numeric
    GIDs are not used, either. Yes, we''ll be discussing that, too!

    - <file> represents the file. Shell-style globbing is supported.


    There are a couple other wrinkles to use the %attr macro. If a particular file
    attribute doesn''t need to be specified, that attribute can be replaced with a
    dash "-” and %attr will not change it. Say, for instance, that a package''s files
    are installed with the permissions correctly set, as they almost are. Instead
    of having to go to the trouble of entering the permissions for each every file,
    each file can have the same %attr:

    %attr(-, root, root)


    This works for user and group specifications, as well.

    The wrinkle is that, although we''ve been showing the three file attributes separated
    by commas, in reality they could be separated by spaces as well. Whichever delimiter
    you choose, it pays to be consistent throughout a spec file.

    Let''s pick cdplayer with a liberal sprinkling of %attrs. Here''s what the %files
    list looks like after we''ve done with our way:


    ```

    %files

    %attr(-, root, root) %doc README

    %attr(4755, root, root) /usr/local/bin/cdp

    %attr(-, root, root) /usr/local/bin/cdplay

    %attr(-, root, root) /usr/local/man/man1/cdp.1

    ```


    A couple points are worth noting here. The line for README shows that multiple
    macros can be used on a single line in this case to set file attributes, and one
    to mark the file as being documentation. The %attr for /usr/local/bin/cdp declares
    the file to be reuido root. It sends a shiver down your spine to know that you
    can create any package that will run setuid root when installed on your system
    — Good! Just because RPM makes it easy to install software doesn''t mean that
    you should blindly install every package you find.

    A single RPM command can quickly point out areas of potential problems and should
    be issued on any file package that you don''t trust:


    ```

    % rpm -glup .../RPM/i386/cdplayer-1.0-1.i386

    drwxr-xr-x root 1024 Sep 10 20:16 /usr/local/cdplayer-1.0-1

    -rw-r--r-- root 1085 Nov 10 20:10 /usr/local/cdplayer-1.0-1/README

    -rxr-xr-x root root 40739 Sep 13 21:32 /usr/local/bin/cdplay -> ./cdp

    lrwxr-xr-x root root 47 Sep 13 21:32 /usr/local/bin/cdplay -> ./cdp

    -rxr-xr-x root rot 4550 Sep 13 21:32 /usr/local/man/man1/cdp.1

    ```'
