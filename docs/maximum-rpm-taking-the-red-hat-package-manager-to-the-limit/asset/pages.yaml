    # Updating Our Spec File


    Let''s apply some of our newly found knowledge to the spec file we are writing.
    Here''s the

    list of subpackages that we need to create:


    +   * The server subpackage, to be called foo-server.

    * The client subpackage, to be called foo-client.

    * The baz development library subpackage, to be called bazlib.


    Since our package name is foo, and since the %package directive creates subpackage
    names

    by prepending the package name, the %package directives for the foo-server and

    foo-client subpackages would be written as:


    ```

    %package server

    and

    %package client

    ```


    Since the baz library''s package name is not to start with foo, we need to use
    the -n option

    on its %package directive:


    ```

    %package -n bazlib

    ```


    Our requirements further state that foo-server and foo-client are to have the
    same

    version as the main package.

    One of the time-saving aspects of using subpackages is that there is no need to
    duplicate

    information for each subpackage if it is already defined in the main package.
    Therefore,

    since the main package''s preamble has a version tag defining the version as 2.7,
    the two

    subpackages that lack a version tag in their preambles will simply inherit the
    main package''s

    version definition.


    Since the bazlib subpackage''s preamble contains a version tag, it must have its
    own unique

    version.

    In addition, each subpackage must have its own summary tag.

    So based on these requirements, our spec file now looks like this:


    ```

    Name: foo

    Version: 2.7

    Release: 1

    Source: foo-2.7.tgz

    Copyright: probably not

    Summary: The foo app, and the baz library needed to build it

    Group: bogus/junque

    %description

    ```'
