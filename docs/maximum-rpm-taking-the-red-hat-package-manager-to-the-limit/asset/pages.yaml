    Source Packaging: blather-7.9-1


    Generating signature: 1002

    Wrote: /usr/src/redhat/SRPMS/blather-7.9-1.src-rpm

    #

    ```


    Once the pass phrase is entered, there''s very little that is different from a
    normal build. The only obvious difference is the Generating signature message
