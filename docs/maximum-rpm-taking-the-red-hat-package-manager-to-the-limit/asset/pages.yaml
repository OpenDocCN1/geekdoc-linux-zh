- pgno: 432
  md: "# E.3 Scripts\n\n# The %clean Script\n\n %clean script, as the name implies,\
    \ is used to clean up the software’s build directory tree. RPM normally do this\
    \ for you, but in certain cases (most notably in those packages that use a build\
    \ root) you'll need to include a %clean script. The commands in the script can\
    \ be any valid sh commands.\n\n%clean\n\nSee also: Section 13.3.1, page 183\n\n\
    # E.3.2 Install-/Erase-time Scripts\n\nThese scripts are executed whenever the\
    \ package is installed or erased. Each script can consist of any valid sh commands.\n\
    \nNote: Each of the following scripts can be made specific to a particular subpackage\
    \ by adding the subpackage name, and optionally, the -n option:\n\n+   %post bar\n\
    \n+   %preun -n bar\n\nThe subpackage name and usage of the -n option must match\
    \ those defined with the %package directive.\n\nEach script has the following\
    \ environment variable defined:\n\n+   - RPM_INSTALL_PREFIX\n\nFor more information\
    \ on this environment variable please see section 183 on page 183.\n\n# The %pre\
    \ Script\n\n %pre script executes just before the package is to be installed.\n\
    \n%pre\n\nSee also: Section 13.3.2, page 185\n\n# The %post Script\n\n %post script\
    \ executes just after the package is to be installed.\n\n%post\n\nSee also: Section\
    \ 13.3.2, page 185\n\n# The %preun Script\n\n %preun script executes just before\
    \ the package is to be erased."
