  md: '# Using RPM to Install Packages


    This is called a Uniform Resource Locator, or URL. RPM can also use URLs, although
    they

    look a little different. Here''s one:


    ```

    ftp://ftp.redhat.com/pub/redhat/code/rpm/rpm-2.3-1.i386.rpm

    ```


    The ftp: signifies that this is a File Transfer Protocol. As the name implies,
    the

    type of URL is used to move files around. The section containing ftp.redhat.com
    specifies

    the hostname, or name of the system where the package resides.


    The remainder of the URL (/pub/redhat/code/rpm/rpm-2.3-1.i386.rpm) specifies the\path
    to the package file, followed by the package itself.


    RPM''s use of URLs gives us the ability to install a package located on the other
    side of the

    world, with a single command:


    ```

    # rpm -i ftp://ftp.gnomvision.com/pub/rpms/foobar-1.0-i386.rpm

    #

    ```


    This command would use anonymous FTP to obtain the foobar version 1.0 package
    file and

    install on your system. Of course, anonymous FTP (no username and password required)

    is not always available. Therefore, the URL may also contain a username and password

    ceding the hostname:


    ```

    ftp://smith:mypass@ftp.gnomvision.com/pub/rpms/foobar-1.0-i386.rpm

    ```


    However, entering a password where it can be seen by anyone looking at your screen
    is a

    bad idea. So try this:


    ```

    ftp://smith@ftp.gnomvision.com/pub/rpms/foobar-1.0-i386.rpm

    ```


    RPM will prompt you for your password, and you''ll be in business:


    ```

    # rpm -i ftp://ftp.gnomvision.com /pub/rpms/apmd-2.4-1.i386.rpm

    Password for smith@ftp.gnomvision.com: mypass (not echoed)

    #

    ```


    After entering a valid password, RPM installs the package.


    On some systems, the FTP daemon doesn''t run on the standard port 22. Normally
    this is

    done for the sake of enhanced security. Fortunately, there is a way to specify
    a non-standard

    port in the URL:


    ```

    ftp://ftp.gnomvision.com:1024/pub/rpms/foobar-1.0-i386.rpm

    ```


    This URL will direct the FTP request to port 1024. The --ftpport option is another
    way

    specify the port. This option is discussed later in the chapter, on page 33.'
