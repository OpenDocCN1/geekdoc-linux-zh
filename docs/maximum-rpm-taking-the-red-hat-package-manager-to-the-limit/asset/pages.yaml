  md: '# 21.2 rpmilib Functions


    This function installs the binary package specified by fd. If a path is specified
    in rootdir, the package will be installed with that path acting as the root directory.
    If a path is specified in prefix, it will be used as the prefix for relocatable
    packages. The RPM database specified by db is updated to reflect the newly installed
    package.


    The flags parameter is used to control the installation behavior. The flags are
    defined in rpmilib.h and take the form RPMINSTALL_xxx, where xxx is the name of
    the flag.


    The following flags are currently defined:


    +   * RPMINSTALL_REPLACEPKG — Install the package even if it is already installed.

    * RPMINSTALL_REPLACEFILES — Install the package even if it will replace files
    owned by another package.

    * RPMINSTALL_TEST — Perform all-install checks, but do not actually install the
    package.

    * RPMINSTALL_UPGRADE — Install the package, and remove all older versions of the
    package.

    * RPMINSTALL_UPGRADETOOL — Install the package, even if the package is an older
    version of an already-installed package.\n* RPMINSTALL_NODOCS — Do not install
    the package''s documentation files.

    * RPMINSTALL_NOSCRIPTS — Do not execute the package''s install- and crash-time
    (in the case of an upgrade) scripts.

    * RPMINSTALL_NOARCH — Do not perform architecture compatibility tests.

    * RPMINSTALL_NOOS — Do not perform operating system compatibility tests.


    The notify parameter is used to specify a progress tracking function that will
    be called during the installation. Please refer to page 326 for more information
    on this parameter.


    The labelFormat parameter can be used to specify how the package label should
    be formatted. This information is used when printing the package label once the
    package install is ready to proceed. It is used when printing the package label
    once the package install is ready to proceed. If labelformat is NULL, the package
    label is not printed.


    The netsharedpath is used to specify which part of the file system that is shared
    with other systems. If there is more than one path that is shared, the paths should
    be separated with a colon.


    This function returns the following status values:


    +   * 0 — The binary package was installed successfully.

    * 1 — The package file contained incorrect magic numbers.

    * 2 — Another type of error occurred.'
