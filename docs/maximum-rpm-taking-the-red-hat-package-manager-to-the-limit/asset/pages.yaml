- pgno: 111
  md: '# 6.2.1 Other Verification Failure Messages


    When rpm -V finds other problems, the output is a bit easier to understand:


    ```

    # rpm -V blather

    Unatisfied dependencies for blather-7.9-1: bother >= 3.1

    #

    ```


    It''s pretty easy to see that the blather package requires at least version 3.1
    of the bother package.


    The output from a package''s verification script is a bit harder to categorize,
    as the script''s contents, as well as its messages, are entirely up to the package
    builder.


    # 6.3 Selecting What to Verify, and How


    There are several ways to verify packages installed on your system. If you''ve
    taken a look at RPM''s query command, you will find that many of them are similar.
    Let''s start with the simplest method of specifying packages — the package label.


    # The Package Label — Verify an Installed Package Against the RPM Database


    You can follow the rpm -V command with all or part of a package label. With every
    other RPM command that accepts package labels, you''ll need to carefully specify
    each part of the label you include. Keep in mind that package names are case-sensitive,
    so rpm -V PackageName and rpm -V packageName are not the same. Let''s verify the
    initscripts package:


    ```

    # rpm -V initscripts

    #

    ```


    While it looks like RPM didn''t do anything, the following steps were performed:


    +   - For every file in the package, RPM checked the nine file attributes that
    were discussed above.

    - If the package was built with dependencies, the RPM database was searched to
    ensure the packages that satisfy those dependencies were installed.

    - If the package was built with a verification script, that script was executed.


    In our example, each of these steps was performed without error — the package
    verified successfully. Remember, with rpm -V you''ll only see output if a package
    fails to verify.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 6.3 Selecting What to Verify, How


    -a — Verify All Installed Packages Against the RPM Database


    If you add -a to rpm -V, you can easily verify every package on your system. It
    might take a while, but when it''s done, you''ll know exactly what''s changed
    on your system:


    ```

    # rpm -Va

    M.5....T /usr/X11R6/lib/X11/fonts/misc/fonts.nd

    missing /var/spool/at/.lockfile

    missing /var/spool/at/spool

    5....T /usr/lib/rhs/glint/icon.py

    ....T c /etc/inittab

    .5....T /usr/bin/loadkeys

    #

    ```


    Don''t be surprised if rpm -Va turns up a surprising number of files that failed
    verification. RPM''s verification process is very strict! In many cases, the changes
    flagged indicate problems — they are only an indication of your system''s configuration
    being different than what the builders of the installed packages had on their
    system. Also, some attributes change during normal system operation. However,
    it would be wise to check each verification failure, just to make sure.


    -f <file> Verify the Package Owning <file> Against the RPM Database


    Imagine this: you''re hard at work when a program you''ve used million times before
    suddenly stops working. What do you do? Well, using RPM, you probably tried to
    find other files associated with that program and see if they had changed recently.


    Now you can let RPM do at least part of that slething for you. Simply direct RPM
    to verify the package owning the ailing program:


    ```

    % rpm -Vf /sbin/cardmgr

    S.5....T c /etc/sysconfig/pcmcia

    ```


    Hmmm. Looks like a config file was recently changed.


    This isn''t to say that using RPM to verify a package will always get you out
    of trouble, but it''s a quick step to be one of the first things you try. Here''s
    an example of rpm -Vf not working out as well:


    ```

    % rpm -Vf /etc/blunder

    file /etc/blunder is not owned by any package

    ```


    (Note that the issue surrounding RPM and symbolic links mentioned in "A Tricky
    Detail" (page 55) also applies to rpm -Vf. Watch those symlinks!)'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 86 <file> — Verify Against a Specific Package File


    ```

    -p <file> — Verify Against a Specific Package File

    ```


    Unlike the previous options to rpm -V, each of which verified one or more packages
    against RPM''s database, the -p option performs the same verification, but against
    a package file. Why on earth would you want to do this when the RPM database is
    sitting there just waiting to be used?


    Well, what if you didn''t have an RPM database? While it isn''t a common occurrence,
    power failures, hardware problems, and inadvertent deletions (along with non-existent
    backups) can leave your system "sans database" — when your system hiccups — what
    do you do now?


    This is where a CD full of packages can be worth its weight in gold. Simply mount
    the CD and verify to your heart content:


    ```

    # rpm -Vp /mnt/cdrom/RedHat/RPM/i386/adduser-1.1-1.i386.rpm

    ```


    # Whatever else is wrong with this system, at least we can add new users. But
    what if you have many packages to verify? It would be a very slow process doing
    one package at a time. That''s where the next option comes in hand...


    ```

    -g <group> — Verify Packages Belonging To <group>

    ```


    When a package is built, the package builder must classify the package, grouping
    it with other packages that perform similar functions. RPM gives you the ability
    to verify installed packages based on their groups. For example, there is a group
    known as Shells. This group consists of packages that contain, strangely enough,
    shells. Let''s verify the proper installation of every shell-related package on
    the system:


    ```

    # rpm -Vg Shells

    missing /etc/bashrc

    #

    ```


    One thing to keep in mind is that group specifications are case-sensitive. Issuing
    the command rpm -Vg wouldn''t verify many packages:


    ```

    # rpm -Vg shells

    group shells does not contain any packages

    #

    ```


    ```

    --nodeps: Do Not Check Dependencies Before Erasing Package

    ```


    When the --nodeps option is added to a verify command, RPM will bypass its dependency
    verification processing. In this example, we''ve added the -vv option to so we
    can watch RPM at work:'
  merge: -1
