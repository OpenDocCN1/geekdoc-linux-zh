  md: '# Using RPM to Verify Package Files


    The OK means that each of these tests were successful. If any had failed, the
    name would have been printed in parentheses. A bit later in the chapter, we''ll
    see what happens there are verification problems.


    # 7.3.1 -v — Display Additional Information


    Adding v to a verification command will produce more interesting output:


    ```

    # rpm -Kv rpm-2.3-1.i386.rpm

    rpm-2.3-1.i386.rpm:

    Header-Archive size OK: 278686 bytes

    Good signature from user "Red Hat Software, Inc. <redhat@redhat.com>"

    Signature made 1996/12/24 18:37 GMT using 1024-bit key, key CBA29BF9

    ```


    WARNING: Because this public key is not certified with a trusted signature, it
    is not known with high confidence that this public key actually belongs to: "Red
    Hat Software, Inc. <redhat@redhat.com>"

    MD5 sum OK: 8738632c5e036a03dee87d990e75349

    #


    With a bit of digging, we can see that each of the three tests was performed,
    and also passed. The reason for that-sounding warning is that PGP is meant to
    operate without a central authority managing distribution. PGP certifies keys
    based on webs of trust. For example, if an acquaintance of yours creates a public
    key, you can certify it by attaching your digital signature to it. Then anyone
    who knows and trusts you can also trust your acquaintance''s public key.


    In this case, the key came directly from a mass-produced Red Hat Linux CDROM.
    If someone was trying to masquerade as Red Hat Software, Inc. then they have certainly
    gone through a lot of trouble to do so. In this case, the lack of a certified
    public key is not a major problem, given the fact that the CDROM came directly
    from the Red Hat Software offices.


    # 7.3.2 When the Package is Not Signed


    As mentioned earlier, not every package you''ll run is going to be signed. If
    this is the case, here''s what you''ll see from RPM:


    ```

    # rpm -K bother-3.5-1.i386.rpm

    bother-3.5-1.i386.rpm: size md5 OK

    #

    ```


    > 2Red Hat Software''s public key is also available from their website, at http://www.redhat.com/redhat/contact.html.
    The RPM sources also contain the key, and are available from their FTP site at
    http://ftp.redhat.com/pub/redhat/code/rpm.'
