    RPM has another tag that can be used with the --queryformat option. It''s called
    INSTALLPREFIX and using it displays the prefix under which a package was installed.
    Let''s give it a try:


    ```

    # rpm -q --queryformat ''%{INSTALLPREFIX}\n'' cdplayer

    /usr/foogly/blather

    #

