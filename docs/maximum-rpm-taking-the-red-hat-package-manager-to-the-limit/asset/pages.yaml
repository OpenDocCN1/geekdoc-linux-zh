    # 12.1.10 --sign Add a Digital Signature to the Package


    The --sign option directs RPM to add a digital signature to the package being
    built. Currently, this is using PGP. Here''s an example of --sign in action:


    ```

    # rpm ba --sign cdplayer-1.0.spec

    Enter pass phrasephrase: <passphrase> (not echoed)

    Pass phrase is good.

    Package: cdplayer

    ...

    Binary Packaging: cdplayer-1.0-1

    ...

    Generating signature: 1002

    Wrote: /usr/src/redhat/RPMS/i386/cdplayer-1.0-1.i386.rpm

    ...

    Source Packaging: cdplayer-1.0-1

    ...

    Generating signature: 1002

    Wrote: /usr/src/redhat/SRPMS/cdplayer-1.0-1.src.rpm

    #

    ```


    The most obvious effect of adding the --sign option to a build command is RPM
    then asks for your private key''s passphrase. After entering the passphrase (not
    echoed), the build proceeds as usual. The only other difference between this and
    a non-signed build is that the Generating signature: lines have a non-zero value.


    Let''s check the source and binary packages we''ve just created and see if they
    are, in fact, signed:


    ```

    # rpm --checksig /usr/src/redhat/SRPMS/cdplayer-1.0-1.src.rpm

    /usr/src/redhat/SRPMS/cdplayer-1.0-1.src.rpm: size pgp md5 0

    # --checksig /usr/src/redhat/RPMS/i386/cdplayer-1.0-1.i386.rpm

    /usr/src/redhat/RPMS/i386/cdplayer-1.0-1.i386.rpm: size pgp md5 0

    #

    ```


    The fact that there is a pgp in --checksig''s output indicates that the packages
    have been signed.


    For more information on signing packages, see Chapter 17 on page 241. Appendix
    G on page 427 contains information on obtaining installing PGP.'
