  md: '# 13.4 Macros: Helpful Shorthand for Package Builders 197


    # An example of the %patch Macro in Action


    Using the example patch tags we''ve used throughout this section, let''s put together
    an example and look at the resulting commands. In our example, the first patch
    to be applied needs to have the root directory stripped. Its %patch macro will
    look like this:


    ```

    %patch -p1

    ```


    The next patch is to be applied to files in the software''s lib subdirectory,
    so we''ll need to add a cd command to get us there. We''ll also need to strip
    an additional directory:


    ```

    cd lib

    %patch -P 1 -p2

    ```


    Finally, the last patch is to be applied from the software''s top-level directory,
    so we need to cd back up a level. In addition, this patch modifies some files
    that were also patched the first time, so we''ll need to change the backup file
    extension:


    ```

    cd

    %patch -P 2 -p1 -b .last-patch

    ```


    Here''s what the %prep script (minus any %setup macros) looks like:


    ```

    %patch -p1

    cd lib

    %patch -P 1 -p2

    cd ..

    %patch -P 2 -p1 -b .last-patch

    ```


    And here''s what the macros expand to:


    ```

    echo "Patch #0:"

    patch -p1 -s < /usr/src/redhat/SOURCES/patch-zero

    cd lib

    echo "Patch #1"

    patch -p2 -s < /usr/src/redhat/SOURCES/patch-two

    cd ..

    echo "Patch #2"

    patch -p1 -b .last-patch -s < /usr/src/redhat/SOURCES/patch-two

    ```


    No surprises here. Note that the %setup macro leaves the working directory of
    the software''s top-level directory, so our cd commands with their relative paths
    will do the right thing. Of course, we have environment variables available that
    could be used, too.


    Compressed Patch Files If a patch file is compressed with gzip, RPM will automatically
    decompress it before applying the patch. Here''s a compressed patch file as specified
    in the spec file:'
