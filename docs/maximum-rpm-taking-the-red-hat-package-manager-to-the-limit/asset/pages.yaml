    +   - The /usr/sbin/adduser is simple: it''s the name of the file being dumped.

    - 4442 is the size of the file, in bytes.

    - How about 841083888? It''s the time the file was last modified, seconds past
    the Unix date of January 1, 1970.

    - The ca55fa53c7952aa5b5e3a5fa5d8904b is the MD5 checksum of the file''s contents,
