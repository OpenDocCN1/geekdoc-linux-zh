    #define RPMTAG_TRIGGERFLAGS 1068

    #define RPMTAG_TRIGGERINDEX 1069

    #define RPMTAG_VERIFYSCRIPT 1079

    ```


    # A.2.6 The Archive


    Following the header section is the archive. The archive holds the actual files
    that comprise the package. The archive is compressed using GNU zip. We can verify
    this if we look at the start of the archive:


    ```

    00000d40: 0001 8b08 0000 0000 0002 03ec fd7b ........{

    00000d50: 7c13 d516 388e 4e92 69b1 4a20 010a 1428 |..B.N.I.J... (

    ```


    In this example, the archive starts at offset d43. According to the contents of
    /usr/lib/magic, the first two bytes of a zipped file should be 1f8b, which is,
    in fact, what we see. The following byte (08) is the flag used by GNU zip to indicate
    the file has been compressed with zip''s "deflation" method. The eighth byte has
    a value of 02, which means that the archive has been compressed with zip''s maximum
    compression setting. The following byte contains a code indicating the operating
    system under which the archive was compressed. A 03 in this byte indicates that
    the compression ran under a UNIX-like operating system.


    The remainder of the RPM package file is compressed. After the archive is uncompressed,
    it is an ordinary cpio in SVR4 format with a CRC checksum.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# A.3 Tools For Studying RPM Files


    In the tools directory packaged with the RPM sources, are a number of small programs
    that use the RPM library to extract the various sections of a package file. Normally
    used by the RPM developers for debugging purposes, these tools can also be used
    to make it easier to understand the RPM package format. Here is a list of the
    programs, and what they do:


    +   * rpmlead — Extracts the lead section from a package file.

    * rpmsignature — Extracts the signature section from a package file.

    * rpmheader — Extracts the header from a package file.

    * rpmarchive — Extracts the archive from a package file.

    * dump — Displays a header structure in an easily readable format.


    The first four programs take an RPM file as their input. The package file can
    be read either from standard input, or by including the file name on the command
    line. In either case, the programs write to standard output. Here is how rpmlead
    can be used to display the file from a package file:


    ```

    # rpmlead foo.rpm | od -x

    000000 abed dbee 0003 0010 0702 2d6d 2e32

    000020 2e32 2d31 0031 0000 0000 0000 0000

    000040 0000 0000 0000 0000 0000 0000 0000

    000100 0000 0000 0000 0000 0000 0100 0500

    000120 0004 0000 e124 bfff b36b 0800 e600 bfff

    000140

    #

    ```


    Since each of these programs can also act as filters, the following command is
    equivalent to the one above:


    ```

    # cat foo.rpm | rpmlead | od -x

    000000 abed dbee 0003 0010 0702 2d6d 2e32

    000020 2e32 2d31 0031 0000 0000 0000 0000

    000040 0000 0000 0000 0000 0000 0000 0000

    000100 0000 0000 0000 0000 0000 0100 0500

    000120 0004 0000 e124 bfff b36b 0800 e600 bfff

    000140

    #

    ```'
  merge: -1
  img_proc: true
