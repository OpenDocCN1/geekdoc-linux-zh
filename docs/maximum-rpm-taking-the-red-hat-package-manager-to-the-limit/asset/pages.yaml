- pgno: 71
  md: '# 4.1 rpm -U What Does it Do?


    If there was one RPM command that could win over friends, it would be RPM''s upgrade
    command. After all, anyone who has ever tried to install a newer version of any
    software knows what a traumatic experience it can be. With RPM, this process is
    reduced to a single command: rpm -U. The rpm -U command (--upgrade is equivalent)
    performs two distinct operations:


    +   1. The desired package.


    +   2. Erases older versions of the package, if any.


    If it sounds to you rpm -U is nothing more than an rpm -i command (see chapter
    2) followed by the appropriate number of rpm -e commands, you''d be exactly right.
    In fact, we will be referring back to those chapters as we discuss rpm -U, so
    if you''ve skipped those chapters, you might want to do that now.


    While some people might think it''s a "cheap shot" to claim that RPM performs
    an upgrade when it''s just doing the equivalent of a couple of other commands,
    in fact, it''s a very smart thing to do. By carefully crafting RPM''s package
    installation and erase commands required during an upgrade, it makes RPM more
    tolerant of misuse by preserving important files even if an upgrade isn''t being
    done.


    If RPM had been written with a "smart" command, the install and erase commands
    couldn''t handle upgrades at all, installing a package could overwrite a modified
    configuration file. Likewise, erasing a package would also mean that config files
    could be erased. Not a good situation! However, RPM''s approach to upgrades makes
    it possible to handle even the trickiest situation — having multiple versions
    of a package installed instantaneously.


    # 4.1.1 Config file magic


    While the rpm -i and rpm -e commands do their part to keep config files straight,
    it is with rpm -U that the full power of RPM''s config file handling shows. There
    are no less than six different scenarios that RPM takes into account when handling
    config files.


    In order to make the appropriate decisions, RPM needs information. The information
    used to decide how to handle config files is a set of three large numbers known
    as MD5 checksums. An MD5 checksum is produced when a file is used as the input
    to a complex set of mathematical operations. The resulting checksum has a unique
    property, any change to the file''s contents will result in a change to the checksum
    of that file. Therefore, MD5 checksums are a powerful tool for determining whether
    two different files have the same contents or not.


    In the previous paragraph, we stated that RPM uses three different MD5 checksums
    to determine what should be done with a config file. The three checksums are


    > Actually, there''s one in 2¹²⁸ a chance will go undetected, but for all practical
    purposes, it''s close to perfect as we get.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 4.1 rpm -U — What Does it Do? 45


    +   1. The MD5 checksum of the file when it was originally installed. We''ll call
    this the original file.


    +   2. The MD5 checksum of the file as it exists at upgrade time. We''ll call
    this the current file.


    +   3. The MD5 checksum of the corresponding file in the new package. We''ll call
    this the new file.


    Let''s take a look at the various combinations of checksums, see what RPM will
    do because of them, and discuss why. In the following examples, we''ll use the
    letters X, Y, and Z in place of length MD5 checksums.


    Original file = X, Current file = X, New file = X In this case, the file originally
    installed was never modified.The file in the new version of the package is identical
    to the file on disk.


    In this case, RPM installs the file, overwriting the original. You may be wondering
    why to go the trouble of installing the new file if it''s just the same as the
    existing one. The reason is that aspects of the file other than its name and contents
    might have changed. The file''s ownership, for example, might be different in
    the new version.


    Original file = X, Current file = X, New file = Y The original file has not been
    modified, but the file in the new package is different. Perhaps the difference
    represents a bug-fix, or a new feature. It makes no difference to RPM.


    In this case, RPM installs the file, overwriting the original. This makes sense.
    If it didn''t, RPM would never permit new, modified versions of software to be
    installed! The original file is not saved, since it had not been changed. A lack
    of changes means that no site-specific modifications were made to the file.


    Original file = X, Current file = Y, New file = X Here we have a file that was
    changed at some point. However, the new file is identical to the existing file
    prior to the local modifications.


    In this case, RPM takes the viewpoint that the original file and the new file
    are identical, the modifications made to the original version must still be valid
    for the new version. It leaves the existing, modified file in place.


    Original file = X, Current file = Y, New file = Y — At some point the original
    file was modified, and those modifications happen to make the file identical to
    the new file. Perhaps the modification was made to fix a security problem, and
    the new version of the file has the same fix applied to it.


    > Or, as some sticklers for detail note, it may have been modified, and subsequently
    those modifications were undone.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 46 Using RPM to Upgrade Packages


    In this case, RPM installs the new version, overwriting the modified original.
    The same philosophy in the first scenario applies here – although the file has
    not changed, perhaps some other aspect of the file has, so the new version is
    installed.


    Original file = X, Current file = Y, New file = Z – Here the original file was
    modified at some point. The new file is different from both the original and the
    modified versions of the original file.


    RPM is not able to analyze the contents of the files, and determine what is going
    on. In this instance, it takes the best possible approach. The new file is known
    to work properly with the rest of the software in the new package – at least the
    people building the new package should have ensured it. The modified original
    file is an unknown: it might work with new package, it might not. RPM installs
    the new file.


    BUT.. the existing file was definitely modified. Someone made an effort to change
    the file, for some reason. Perhaps the information contained in the file is still
    of use. Therefore, RPM saves the modified file, naming `file.rpmsave`, and prints
    a warning, so the user knows what happened:


    ```

    warning: /etc/skel/.bashrc saved as /etc/skel/.bashrc.rpmsave

    ```


    These five scenarios cover just every possible circumstance, save one. The missing
    scenario?


    Original file = none, Current file = ??, New file = ?? – While RPM doesn’t use
    checksums in this particular case, we will describe it in terms, for the sake
    of consistency. In this instance, RPM had not originally installed the file, so
    there is no original checksum. Because the file had not originally installed as
    part of a package, there is no way for RPM to determine if the current file in
    place had been modified. Therefore, the checksums for the current file and the
    new file are irrelevant; they cannot be used to clear up the mystery.


    When this happens, RPM renames the file to `file.rpmorig`, prints a warning, and
    installs the new file. This way, any modifications contained in the original file
    are saved. The system administrator can review the differences between the original
    and the newly installed files and determine what action should be taken.


    As you can see, in the majority of cases RPM will automatically take the proper
    course of action when performing an upgrade. It is only when config files have
    been modified and are to be overwritten, that RPM leaves any post-upgrade work
    for the system administrator. Even in those cases, many the modified files are
    not worth saving and can be deleted.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 4.2 Upgrading a Package


    # 4.2 Upgrading a Package


    The most basic version of the rpm -U command is simply “rpm -U”, followed by the
    name of a .rpm package file:


    ```

    # rpm -U eject-1.2-2.i386.rpm

    #

    ```


    Here, RPM performed all the steps necessary to upgrade the eject-1.2-2 package,
    faster than could have been done by hand. In RPM''s install command, Uniform Resource
    Locators, or URLs, can also be used to specify the package file.


    # 4.2.1 rpm -U Dirty Little Secret


    Well, in the example above, we didn''t tell the whole story. There was no older
    version of the eject package installed. Yes, it''s true — rpm -U works just fine
    as a replacement for the normal install command rpm -i.


    This is another, more concrete example of the strength of RPM''s method of performing
    upgrades. Since RPM''s install command is smart enough to handle upgrades, RPM''s
    upgrade command is really just another way to specify an install. Some people
    never even bother to use RPM''s install command; they always use rpm -U. Maybe
    the “U” should stand for, “Uh, do the right thing”.


    # 4.3 They’re Identical...


    Given the fact that rpm -U can be used as a replacement for rpm -i, it follows
    that most of the options available for rpm -U are identical to those used with
    rpm -i. Therefore, to keep the duplication to a minimum, we will discuss only
    those options that are unique to rpm -U, or behave differently from the same option
    when used with rpm -i. The table on page 43 at the start of this chapter shows
    all valid options to RPM''s upgrade command, and indicates which are identical
    to those used with rpm -i.


    # 4.3.1 --oldpackage: Upgrade To An Older Version


    This option might be used a bit more by people who like to stay on the “bleeding
    edge” of new versions of software, but eventually, everyone will probably need
    to use it. Usually, the situation plays out like this:


    +   - You hear about some new software that sounds pretty nifty, so you download
    the .rpm file and install it.


    For more information on RPM''s use of URLs, please see section 2.2.1 on page 17.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'The software is great! It does everything you ask for, and more. You end up
    using it every day for the next few months.


    You hear that a new version of your favorite software is available. You waste
    no time in getting the package. You upgrade the software by using rpm -U. No problem!


    Fingers arched in anticipation, you launch the new version. Your computer''s screen
    goes blank!


    Looks like a bug in the new version. Now what do you do? Hmmm. Maybe you can just
    "upgrade" to the old version. Let''s try to go back to release 2 of cdp-0.33 from
    release 3:


    ```

    # rpm -U cdp-0.33-2.i386.rpm

    Installing cdp-0.33-3 (which is newer) is already installed

    error: cdp-0.33-2.i386.rpm cannot be installed

    #

    ```


    That didn''t work very well. At least it told us that the problem was — we were
    trying to upgrade to an old version of a package that is already installed. Frankly,
    there''s a special option for this situation: --oldpackage. Let''s give it a try:


    ```

    # rpm -U --oldpackage cdp-0.33-2.i386.rpm

    Installing cdp-0.33-2.i386.rpm

    ```


    By using the --oldpackage option, release 3 of cdp-0.33 is history, and has been
    replaced by release 2.


    # 4.3.2 --force: The Big Hammer


    Adding --force to an upgrade command is a way of saying "Upgrade it anyway!" In
    essence, it adds --replacepkg, --replacefiles, and --oldpackage to the command.
    Like a big hammer, --force is an irresistible⁴ that makes things happen. In fact,
    the only thing that will prevent a --force upgrade from proceeding is a dependency
    conflict.


    And like a big hammer, it pays to fully understand why you need to use --force
    before actually using it.


    # 4.3.3 --noscripts: Do Not Execute Install and Uninstall Scripts


    The --noscripts option prevents package''s pre- and post-install scripts from
    being executed. This is no different from the option''s behavior when used with
    RPM''s install command.


    > ⁴Pun intended.'
  merge: -1
