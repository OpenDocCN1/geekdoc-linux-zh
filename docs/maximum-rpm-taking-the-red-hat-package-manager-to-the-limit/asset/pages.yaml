    # 21.2.12 Signature Verification


    The functions in this section deal with the verification of package signatures.
    A package file may contain more than one type of signature. For example, package
    may contain a signature that contains the package''s size, as well as a signature
    that contains cryptographically-derived data that can be used to provide the package''s
    origin.


    Each type of signature has its own tag. These tag values are defined in rpmlib.h
    and are of the form RPMSIGTAG_xxxx, where xxxx is the type of signature.'
