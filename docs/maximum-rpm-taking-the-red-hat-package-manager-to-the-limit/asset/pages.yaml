    The Package Builder Can Also Control What Gets Verified When a package builder
    creates a new package, they can control what attributes are to be verified on
    a file-by-file basis. The reasons for excluding specific attributes from verification
    can be quite involved, but here''s an example just to give you the flavor:


    When a person logs into a system, there are device files associated with that
    user''s terminal session. In order for the terminal device (called tty) to function
    properly, the owner and group of the device must change to that of the person
    logging in. Therefore, if RPM were to verify the package that created the tty
    device files, any tttys that were in use at the time would fail to verify. However,
    by using the %verify⁵ directive, a package builder can save you from trivial verification
    failures.


