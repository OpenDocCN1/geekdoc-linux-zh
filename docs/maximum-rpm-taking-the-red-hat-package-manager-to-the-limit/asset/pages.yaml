    That''s about it for RPM''s macros. Next, let''s take a look at the %files list.


    # 13.5 The %files List


    The %files list indicates to RPM which files on the build system are to be packaged.
    The file list consists of one file per line. The file may have one or more directives
    preceding it. These directives give RPM additional information about the file
    and are discussed more fully below.


    Normally, each file includes its full path. The patch performs two functions.
    First, it specifies the file''s location on the build system. Second, it denotes
    where the file should be placed when the package is to be installed.


    For packages that contain hundreds of files, it can be quite cumbersome creating
    a list that contains every file. To make this situation a bit easier, if the %files
    list contains a path to a directory, RPM will automatically package every file
    in that directory, as well as every file in each subdirectory. Shell-style globbing
    can also be used in the %files list.


    # 13.6 Directives For the %files list


    The %files list may contain a number of different directives. They are used to:


    +   - Identify documentation and configuration files.

    - Ensure a file has the correct permissions and ownership set.

    - Control which aspects of a file are checked during package verification.

    - Eliminate some of the tedium in creating the %files list.


    > ⁶This is not entirely the case when a relocatable package is being built. For
    more information on relocatable packages, see page 15 on page 219.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 13.6 Directives For the %files list


    The %files list, one or more directives may be placed on a line, separated by
    spaces, before or more filenames. Therefore, if %foo and %bar are two %files list
    directives, they may be applied to a file baz in the following manner:


    ```

    %foo %bar baz

    ```


    Now it''s time to take a look at the directives that inhabit the %files list.


    # 13.6.1 File-related Directives


    RPM processes files according to their type. However, RPM does not have a method
    of automatically determining file types. Therefore, it is up to the package builder
    to appropriately mark files in the %files list. This is done using one of the
    directives below. Keep in mind that not every file will need to be marked. As
    you read the following sections, you''ll see that directives are only used in
    special circumstances. In most packages, the majority of files in the %files list
    will not need to be marked.


    # The %doc Directive


    The %doc directive flags the filename(s) that follow, as being documentation.
    RPM keeps track of documentation files in its database, so that a user can easily
    find information about an installed package. In addition, RPM can create a package-specific
    documentation during installation and copy documentation into it. Whether or not
    this additional step is taken, is dependent on how a file is specified. Here is
    an example:


    ```

    %doc README

    %doc /usr/local/foonly/README

    ```


    The file README exists in the software''s top-level directory during the build,
    and is included in the package file. When the package is installed, RPM creates
    a directory in the documentation directory named the same as the package (ie,
    <software><version>-<release>), and copies the README file there. The newly created
    directory and the README file are marked in the RPM database as documentation.
    The default documentation directory is /usr/doc, and can be changed by setting
    the defaultdoc rpmrc file entry. For more information on rpmprc files, please
    see chapter B on page 363.


    The file /usr/local/foonly/README was installed into that directory during the
    build and is included in the package file. When the package is installed, the
    README file is copied into /usr/local/foonly and marked in the RPM database as
    being documentation.


    # The %config Directive


    The %config directive is used to flag the specified file as being a configuration
    file. RPM performs additional processing for config files when they are erased,
    and during installations and updates. This is due to the nature of config files:
    they are often changed by the system administrator, and those changes should not
    be lost.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 200 Inside the Spec File


    There is a restriction to the %config directive, and that restriction is no more
    than one filename may follow the %config. This means that the following example
    is the only allowable way to specify config files:


    %config /etc/foonly


    Note that the full path to the file, as it is installed at build time, is required.


    # The %attr Directive


    The %attr directive permits finer control over three key file attributes:


    +   1. The file''s permissions, or “mode"

    2. The file''s user ID.

    3. The file''s group ID.


    The %attr directive has the following format:

    %attr(<mode>, <user>, <group>) file


    The mode is specified in the traditional numeric format, while the user and group
