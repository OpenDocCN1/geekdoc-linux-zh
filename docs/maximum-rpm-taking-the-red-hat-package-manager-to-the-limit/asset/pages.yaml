    # ## 3.1 rpm -e What Does it Do?


    The rpm -command (--erase equivalent) removes, erases, or one or more packages
    from the system. RPM performs a series of steps when it erases a package:


    +   * It checks the RPM database to make sure that no other packages depend on
    the package being erased.


    +   * It executes a pre-uninstall script (if one exists).


    +   * It checks to see if any of the package''s config files have been modified.
    If so, it saves copies of them.


    +   * It reviews the RPM database to find every file listed as part of the package,
    and if they do not belong to another package, deletes them.


    +   * It executes a post-uninstall script (if one exists).'
