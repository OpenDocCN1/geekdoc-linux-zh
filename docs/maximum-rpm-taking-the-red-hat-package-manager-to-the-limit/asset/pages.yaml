- pgno: 246
  md: '# Chapter 15


    # Making a Relocatable Package


    RPM has the ability to give users some latitude in deciding where packages are
    to be installed on their systems. However, package builders must first design
    their packages to give users this freedom.

    That''s all well and good, but why would the ability to "relocate" a package be
    all that important?


    # 15.1 Why relocatable packages?


    One of the many problems that plague a system administrator''s life is disk space.
    Usually, there''s not enough of it, and if there is enough, chances it''s in the
    wrong place. Here''s a hypothetical example:


    +   - Some new software comes out and is desired greatly by the user community.

    - The system administrator carefully reviews the software''s installation documentation
    prior to doing to the installation.¹ She notes that the software, all 150MB of
    it, installs into /opt.

    - Frowning, the sysadmin fires off a quick command:


    ```

    # df

    Filesystem      Used Available Capacity Mounted on

    /dev/sda0       100118 28434 66614 30% /

    /dev/sda6       999195 365527 575218 39% /usr

    ```


    Bottom line: There''s no way 150MB of new software is going to fit on the filesystem.


    > ¹Hey, we said it was hypothetical!'
  merge: -1
  img_proc: true
- pgno: 247
  md: '* Sighing heavily, the sysadmin ponders what to do. If only there were some
    way to install the software somewhere on the /usr filesystems...


    It doesn''t have to be this way. RPM has the ability to make packages that can
    be installed with a user-specified prefix that dictates where the software will
    actually be placed. By making packages relocatable, the package builder can make
    life easier for sysadmins everywhere. But what exactly is a relocatable package?


    A relocatable package is a package that is standard in every way, save one. The
    difference lies in the prefix tag. When this tag is added to a spec file, RPM
    will attempt to build a relocatable package.


    Note the word "attempt". There are few conditions that must be met before a relocatable
    package can be built successfully, and this chapter will cover them all. But first,
    let''s look at exactly how RPM can relocate a package. and the one component at
    the heart of package relocation is the prefix tag.


    # # 15.2 The prefix tag: Relocation Central


    The best way to explain how the prefix tag is used is to step through an example.
    Here''s a sample prefix tag:


    Prefix: /opt


    In this example, the prefix path is defined as /opt. This means that, by default,
    the package will install its files under /opt. Let''s assume the spec file contains
    the following line in its %files list:

    /opt/bin/baz


    If the package is installed without any relocation, this file will be installed
    in /opt/bin. This is identical to a non-relocatable package is installed.


    However, if the package is to be relocated on installation, the path of every
    file in the %files list is modified according to the following steps:


    +   1. The part of the file''s path that corresponds to the path specified on
    the prefix tag line is removed.


    +   2. The user-specified relocation prefix is prepended to the file''s path.


    Using our /opt/bin/baz file as an example, let''s assume the user installing the
    package wishes to override the default prefix (/opt), with a new prefix, say,
    /usr/local/opt. Following the steps above, we first remove the original prefix
    from the file:

    /opt/bin/baz becomes /bin/baz


    Next, we add the user-specified prefix to the front of the remaining part of the
    filename:'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 15.3 Relocatable Wrinkles: Things to Consider


    /usr/local/opt +/bin/baz =/usr/local/opt/bin/baz


    Now that the file''s new path has been created, RPM installs the file normally.
    This part of it seems simple enough, and it is. But as we mentioned above, there
    are a few things the package builder needs to consider before getting on the relocatable
    package bandwagon.


    # 15.3 Relocatable Wrinkles: Things to Consider


    While it''s certainly no problem to add a prefix tag line to a spec file, it''s
    necessary to consider a few other issues:


    +   * Every file in the %files list must start with the path specified on the
    prefix tag line.

    * The software must be written such that it at can operate properly if relocated.
    Absolute symlinks are a prime example of this.

    * Other software must not rely on the relocatable package being installed in any
    particular location.

    * inside-install/erase


    Let''s cover each of these issues, starting with the %files list.


    # 15.3.1 %files List Restrictions


    As mentioned above, each file in the %files list must start with the relocation
    prefix. If this isn''t done, the build will fail:


    ```

    # rpm -ba cdplayer-1.0.spec

    * Package: cdplayer

    * umask 022

    * echo Executing: %prep

    ...

    Binary Packaging: cdplayer-1.0-1

    Package Prefix = usr/local

    File doesn''t match prefix (usr/local): /usr/doc/cdplayer-1.0-1

    File not found: /usr/doc/cdplayer-1.0-1

    Build failed.

    #

    ```


    In our example, the build proceeded normally until the time came to create the
    package file. At that point RPM detected the problem. The error message says it
    all: The prefix line in the file (/usr/local) was not present in the first part
    of the file''s (/usr/doc/cdplayer-1.0-1). This stopped the build in its tracks.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'The fact that every file in a relocatable package must be installed under the
    directory specified in the prefix line, raises some issues. For example, what
    about a program reads a configuration file normally kept in /etc? This question
    leads right into our next section.


    # 15.3.2 Relocatable Packages Must Contain Relocatable Software


    While this section''s title seems pretty obvious, it''s not always easy to tell
    if a particular piece of software can be relocated. Let''s take a look at the
    question raised at the end of the previous section. If a program has been written
    to its configuration file from /etc, there are three possible approaches to making
    that program relocatable:


    +   1. Set the prefix to /etc and package everything other than /etc.

    2. Package everything somewhere other than /etc and leave out the config file
    entirely.

    3. Modify the program.


    The first approach would certainly work from a purely technical standpoint, but
    not many people would be happy with a program that is installed itself in in /etc.
    So this approach isn''t viable.


    The second approach might be more appropriate, but it forces users to complete
    the install by having them create the config file themselves. If RPM''s goal is
    to make software easier to install and remove, this is not a viable approach,
    either!


    The final approach might be the best. Once the package is installed, when the
    rewritten software is first run, it could see that no configuration file existed
    in /etc, and create one. However, even though this would work, when the time came
    to erase the package, the config file would be left behind. RPM had never installed,
    so RPM couldn''t get rid of it. There''s also the fact that this approach is probably
    more labor intensive than most package builders would like.


    None of these approaches are very appealing, are they? Some software doesn''t
    relocate very well. In general, any of the following things are warning signs
    that relocation is going to be:


    +   * The software contains one or more files that must be installed in specific
    directories

    * The software refers to system files using relative paths (Which is really just
    another way of saying the software must be installed in a particular directory)


    If these kinds of issues crop up, making the software relocatable is going to
    be tough. And there''s still one issue to consider:


    # 15.3.3 The Relocatable Software Is Referenced By Other Software


    Even assuming the software is written so that it can be put in a relocatable package,
    there might still be a problem and that package centers on the relocatable software
    itself, but on other programs that reference the relocatable software.'
  merge: -1
  img_proc: true
- pgno: 250
  md: "# 15.4 Building a Relocatable Package\n\nFor example, there are times when\
    \ a package needs to execute other programs. This might include backup software\
    \ that needs to send mail, or a communications program that needs\nto compress\
    \ files. If these underlying programs are relocatable, and not installed where\n\
    other packages expect them, then they would be of little use.\n\nGranted, this\
    \ isn't a common problem, but it can happen. And for the package builder interested\
    \ in building relocatable packages, it's an issue that needs to be explored. Unfortunately,\n\
    this type of problem can be the hardest to find.\n\nIf, however, a software product\
    \ has been found to be relocatable, the mechanics of actually\building a relocatable\
    \ package are pretty straightforward. Let's give it a try.\n\n# 15.4 Building\
    \ a Relocatable Package\n\nFor this example, we will use our tried-and-true cdplayer\
    \ application. Let's start by reviewing\nt spec file for possible problems:\n\n\
    ```\n#\n# Example spec file for cdplayer app...\n#nSummary:A CD player app that\
    \ rocks!\nName: cdplayer\n...\n%files\n%doc README\n/usr/local/bin/cdplayer\n\
    /usr/local/bin/man/man1/cdplayer\n%doc /usr/local/man/man1/cdp.1\n%config /etc/cdp-config\n\
    ```\n\nEverything looks all right, except for the %files list. There are files\
    \ in /usr/local/bin,\na man page in /usr/local/man/man1, and a config file in\
    \ /etc. A prefix of /usr/local\nwould work pretty well, except for that cdp-config\
    \ file.\n\nFor the sake of this first, we will declare the config file unnecessary\
    \ and remove it from\nt %files list. We'll then add a prefix tag line, setting\
    \ the prefix to /usr/local. After\nthese changes are made, let's try a build:\n\
    \n```\n# rpm -ba cdplayer-1.0.spec\n* Package: cdplayer\n+ umask 022\n+ echo Executing:\
    \ %prep\nExecuting: %prep\n+ cd /usr/src/redhat/BUILD\n+ cd /usr/src/redhat/BUILD\n\
    + rm -rf cdplayer-1.0\n+ gzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz\n```"
