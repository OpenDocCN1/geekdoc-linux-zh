    be in version 3 format, at least. If you attempt to resign a package that is too
    old, here’s what you’ll see:


    ```

    # rpm --resign blah.rpm

    Enter pass phrase: <passphrase> (Not echoed)

    ```


    Pass phrase is good.

    blah.rpm:

    blah.rpm: Can’t re-sign v2.0 RPM


    ```

    #

