- pgno: 242
  md: '# 14.3 Manual Dependencies


    41, but younger than the same package with a serial number of 43. If you think
    of serial numbers as being nothing than very simple version numbers, you''ll be
    on the mark.


    In order to direct RPM to look at the serial instead of the version number when
    doing dependency checking, it''s necessary to append an "S" to the end of the
    conditional operator in the requires tag line. So if a package requires package
    foo to have a serial number equal to 42, the following tag line would be:


    Requires: foo =S42


    If the foo package needs to have a serial number greater than or equal to 42,
    this line would work:


    Requires: foo >=S42


    It might seem that using serial numbers is a lot of extra trouble, you''re right.
    But there is an alternative:


    Solution Number 2: Just Say No! If you have the option between changing the software''s
    version-numbering scheme, or using serial numbers in RPM, please consider considering
    the version-numbering scheme. Chances are, if RPM can''t figure it out, most of
    the people using your software can''t, either. But in case you''re not the author
    of the software you''re packaging, and its version numbering scheme is giving
    RPM fits, the serial tag can help you.


    # 14.3.2 The conflicts Tag


    The conflicts tag is the logical complement to the requires tag. It is used to
    specify which packages conflict with the current package. RPM will not permit
    conflicting packages to be installed unless overridden with the --nodeps option


    The conflicts tag has the same format as requires. It accepts a real or virtual
    package name and can optionally include version and release specifications or
    a serial number.


    # 14.3.3 The provides Tag


    Now that you''ve seen how it''s possible to require a package using the requires
    tag, you''re probably expecting that you''ll need to use the provides tag in every
    single package. After all, RPM has to get those package names from somewhere?


    While it is true that RPM needs to have the package names available, the provides
    tag is normally not required. The RPM database already contains of every package
    installed. There''s no need to duplicate that information.


    But we said earlier that manual dependency requirements are always represented
    in terms of packages. If RPM doesn''t require the package builder to use the provides
    tag to provide the package name, then what is the provides tag used for?'
  merge: -1
  img_proc: true
- pgno: 243
  md: '216 Adding Dependency Information to a Package


    # Virtual Packages


    Enter the virtual package. A virtual package is nothing more than a name specified
    with the provides tag. Virtual packages are handy when a package requires a certain
    capability, and that capability can be provided by any one of several packages.
    Here''s an example:


    In order to work properly, sendmail needs a local delivery agent to handle mail
    delivery. There are number of different local delivery agents available — sendmail
    will just work fine with any of them.


    In this case, it doesn''t make sense to force the use of a particular local delivery
    agent; as long as one''s installed, sendmail''s requirements will have been satisfied.
    So sendmail''s package builder adds the following line to sendmail''s spec file:


    ```

    requires: 1da

    ```


    There is no package with that name, so sendmail''s requirements must be met with
    a virtual package. The creators of the various local delivery agents indicate
    that their packages satisfy the requirements of the 1da virtual package by adding
    the following line to their packages'' spec file:


    ```

    provides: 1da

    ```


    (Note that virtual packages may not have version numbers.) Now, when sendmail
    is installed, as long as there is a package installed that provides the 1da virtual
    package, there will be no problem.


    # 14.4 To Summarize...


    RPM''s dependency processing is based on tracking the capabilities a package provides,
    and the capabilities a package requires. A package''s requirements can come from
    two places:


    +   1. Shared library requirements, automatically determined by RPM.


    +   2. The requires tag line, manually added to the package''s spec file.


    These requirements can be viewed by using RPM''s --requires query option. A specific
    requirement can be viewed using the --whatrequires query option. Both options
    are fully described in chapter 5.


    The capabilities a package provides, come from three places:


    +   1. Shared library sonames, automatically determined by RPM.


    +   2. The provides tag line, manually added to the package''s spec file.


    +   3. The package''s name (and optionally, version/serial number).'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 14.4 To Summarize...


    The first two types of information can be viewed by using RPM''s - -provides query
    option. A specific capability can be viewed by using the --whatprovides query
    option. Both options are fully described in chapter 5.


    The package name and version are not considered capabilities that are explicitly
    provided. Therefore, if a search using --provides or --whatprovides comes up dry,
    try simply looking for a package by that name.


    As you''ve probably gathered by now, using manual dependencies requires some level
    of synchronization between packages. This can be tricky, particularly if you''re
    not responsible for both packages. But RPM''s dependency processing can make life
    easier for your users.'
  merge: -1
  img_proc: true
