  md: '# 12.1.11 --test — Create, Save Build Scripts For Review


    There are times when it might be necessary to get a more in-depth view of a particular
    build. By using the --test option, it''s easy. When --test is added to a build
    command, the scripts RPM would normally use to actually perform the build, are
    created and saved for you to review. Let''s see how it works:


    ```

    # rpm ba -test cdplayer-1.0.spec

    Package: cdplayer

    #

    ```


    Unlike a normal build, there''s not much output. But the --test option has caused
    a set of scripts to be written and saved for you. The question is: Where are they?

    If you are using a customized rpmrcfile, the scripts will be written to the directory
    specified by the rpmrc tmpath. If you haven''t changed this setting, RPM, by default,
    writes the scripts in /var/tmp. Here they are:


    ```

    # ls -l /var/tmp

    total 4

    --rw-r--r-- 1 root root 670 Sep 17 20:35 rpmbu00236aaa

    --rw-r--r-- 1 root root 449 Sep 17 20:35 rpmbu00236baa

    --rw-r--r-- 1 root root 482 Sep 17 20:35 rpmbu00236caa

    --rw-r--r-- 1 root root 552 Sep 17 20:35 rpmbu00236daa

    ```


    Each file contains a script that performs a given part of the build. Here''s the
    first file:


    ```

    #!/bin/sh -e

    # Script generated by rpm


    RPM_SOURCE_DIR=/usr/src/redhat/SOURCES

    RPM_BUILD_DIR=/usr/src/redhat/BUILD

    RPM_DOC_DIR=/usr/doc

    RPM_OPT_FLAGS="-02 -m486 -fno-strength-reduce"

    RPM_ARCH="i386"

    RPM_OS="Linux"

    RPM_ROOT_DIR=/tmp/cdplayer

    RPM_BUILD_ROOT=/tmp/cdplayer

    RPM_PACKAGE_NAME="cdplayer"

    RPM_PACKAGE_VERSION="1.0"

    RPM_PACKAGE_RELEASE="1"

    set -x


    umask 022

    ```'
