    # --nosfiles: Do Not Verify File Attributes


    The -nosfiles option disables RPM''s file-related verification processing. When
    this option is used, only the verification script and dependency verification
    processing are performed. In this example, the package has a file-related verification
    problem:


    ```

    # rpm -Vvv bash

    D: opening database in //var/lib/rpm/

    D: verifying record number 279448

    D: dependencies: looking for libc.so.5

    D: dependencies: looking for libtermcap.so.5

    missing /etc/bashrc

    #

    ```


    When the -nosfiles option is added, the missing file doesn''t cause a message
    any more:


    ```

    # rpm -Vvv --nosfiles bash

    D: opening database in //var/lib/rpm/

    D: verifying record number 279448

    D: dependencies: looking for libc.so.5

    D: dependencies: looking for libtermcap.so.5

    #

    ```


    This is not to say that the missing file problem is solved, just that no file
    verification is performed.


    # -v — Display Additional Information


    Although RPM won''t report an error with the command syntax if you include the
    -v option, you won''t see much in the way of additional output:


    ```

    # rpm -Vvv bash

    ```'
