- pgno: 257
  md: '# 16.1 Using Build Roots in a Package


    Of the process of packaging software with RPM is to actually build the software
    and install it on the build system. The installation of software can can only
    be accomplished by someone with root access, so a non-privileged user will certainly
    need to handle RPM''s installation phase differently. There are times, however,
    when even a person with root access will not wait RPM to copy new files into the
    system''s directories. As mentioned above, the reasons might be due to the fact
    that the software being packaged is already in use on the build system. Another
    reason might be as mundane as not having enough free space to install the software
    into the default directories.


    Whatever the reason, RPM provides the ability to direct a given package to install
    into an alternate root. This alternate root is known as a "build root". Several
    requirements must be met in order for a build root to be utilized:


    +   - A default build root must be defined in the package''s spec file.

    - The installation method used by the software being packaged must be able to
    support installation in an alternate root.


    The first part is easy. It entails adding the following line to the spec file:


    ```

    BuildRoot: <root>

    ```


    Of course, you would replace "<root>" with the name of the directory in which
    you''d like the software to install.¹ If, for example, you specify a build root
    of /tmp/foo, and the software you''re packaging installs a bar in /usr/bin, you
    will find bar residing in /tmp/foo/usr/bin after the build.


    A note for non-root package builders: make sure you can actually write to the
    build root you specify! Those of you with root access also make sure you choose
    your build root carefully. For an assortment of reasons, it''s not a good idea
    to declare a build root of "/!" We''ll get into the reasons why shortly.


    The final requirement for adding build root support is to make sure the software''s
    installation method can support installing into an alternate root. The difficulty
    in meeting this requirement can range from dead simple to nearly impossible. There
    are probably as many different ways of approaching this as there are packages
    to build. But in general, some variant of the following approach is used:


    +   - The environment variable RPM_BUILD_ROOT is set by RPM and contains the value
    of the build root to be used when the software is built and installed.

    - The install section of the spec file is modified to use RPM_BUILD_ROOT as part
    of the installation process.


    ¹Keep in mind that the build root can be overwritten at build-time using the --buildroot
    option or the buildroot rpm file entry. See chapter 12 on page 139 for more details.'
  merge: -1
  img_proc: true
