    # 21.2.11 Diagnostic Output Control


    The functions in this section are used to control the amount of diagnostic output
    produced by other rpmlib functions. The rpmlib library can produce a wealth of
    diagnostic output, making it easy to see what is going on at any given time.


    There are several verbosity levels defined in rpmlib.h. Their symbolic names are
    of the form RPMMESS_xxx, where xxx is the name of the verbosity level. It should
    be noted that the numeric values of the verbosity levels increase with a decrease
    in verbosity. Unless otherwise set, the default verbosity level is RPMMESS_NORMAL.


    # Increase Verbosity Level — rpmIncreaseVerbosity()


    ```

    #include <rpm/rpmlib.h>

    ```


    ```

    void rpmIncreaseVerbosity(void);

    ```


    This function is used to increase the current verbosity level by one.'
