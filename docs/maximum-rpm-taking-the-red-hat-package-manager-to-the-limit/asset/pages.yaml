  md: '# # Chapter 17


    # # Adding PGP Signatures to a Package


    In this chapter, we''ll explore the steps required to add a digital signature
    to a package, using the software known as Pretty Good Privacy, or PGP. If you''ve
    used PGP before, you probably know everything you''ll need to start signing packages
    in short order.


    On the other hand, if you feel need a bit more information on PGP before starting,
    please refer to Appendix G on page 427 for a brief introduction. Once you feel
    comfortable with PGP, come on back and learn how easy signing packages is…


    # ## 17.1 Why Sign a Package?


    The reason for signing a package is to provide authentication. With a signed package,
    it''s possible for your user community to verify that the package they have was
    in your possession at some time and has not been changed since then. That “not
    changed” part is also a good reason to sign your packages, as digital signatures
    are a very robust way to guard against any modifications to the package.


    Of course, with anything else in life, adding a digital signature to a package
    isn''t an ironclad guarantee that everything is right with the package, but it''s
    about as sure a thing as humans can make it.


    # ## 17.2 Getting Ready to Sign


    OK, we''ve convinced that signing packages is a good idea. Now we''ve got to make
    sure PGP and RPM are up to the task. As you might imagine, there are two parts
    to this process: one for PGP, and one for RPM. Let''s get PGP ready first.'
  merge: -1
  img_proc: true
- pgno: 269
  md: "# 17.2.1 Preparing PGP: Creating a Key Pair\n\nThere is really very little\
    \ to be done to PGP, assuming it's installed properly. The only thing required\
    \ is to generate a key pair. As mentioned in our mini-primer on PGP, the key pair\
    \ consists of a secret key and a public key. In terms of signing packages, you\
    \ will use your secret key to do the actual signing. Anyone interested in checking\
    \ your signature will need your public key.\n\nCreating a key pair is quite simple.\
    \ All that's required is to issue a pgp -kg command, enter some information, and\
    \ create some random bits. Here's an example key generating session:\n\n```\n\
    # pgp -kg\nPretty Good Privacy(tm) 2.6.3a - Public-key encryption for the masses.\n\
    (c) 1990-96 Philip Zimmermann, Phil's Pretty Good Software. 1996-03-04\nUses the\
    \ RSAREF(tm) Toolkit, which is copyright RSA Data Security, Inc.\nDistributed\
    \ by the Massachusetts Institute of Technology.\nExport of this software may be\
    \ restricted by the U.S. government.\nCurrent time: 1996/10/31 00:42 GMT\n```\n\
    \nPick your RSA key size:\n\n+   1) 512 bits- Low commercial grade, fast but less\
    \ secure\n2) 768 bits- High commercial grade, medium speed, good security\n3)\
    \ 1024 bits- \"Military\" grade, slow, highest security\n\nChoose 1, 2, or 3,\
    \ or enter desired number of bits: 3\nGenerating an RSA key with 1024-bit modulus\n\
    \nYou need a user ID for your public key. The desired form for user ID is your\
    \ name, followed by your E-mail address enclosed in <angle brackets>, if you have\
    \ an E-mail address.\n example: John Q. Smith <12345.6789@compuserver.com\n\n\
    Enter a user ID for your public key:\n\nEnter Key for RPM Book\n\nYou need a pass\
    \ phrase to protect your RSA secret key.\nYour pass phrase can be any sentence\
    \ or phrase and may have many words, spaces, punctuation, or any other printable\
