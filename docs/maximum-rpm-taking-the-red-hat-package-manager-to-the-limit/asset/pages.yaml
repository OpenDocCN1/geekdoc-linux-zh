    specified by the -n option. This makes it unsuitable as a means of unpacking sources
    in directories other than the top-level build directory. In the upcoming example
    on page 191, we''ll show a way around this restriction.


    A quick word of warning: If the name specified with the -n option doesn''t match
    the name of the directory created when the sources are unpacked, the build will
    stop pretty quickly, so it pays to be careful when using this option.


    -c - Create Directory (and change to it) Before Unpacking


    How many times you have grabbed a tar file and unpacked it, only to find that
    it splattered files all over your current directory? Sometimes source archives
    are created without a top-level directory.


    As you can see so far, %setup expects the archive to create its own top-level
    directory. If this isn''t the case, you''ll need to use the -c option.


    This option simply creates the directory and changes directory into it before
    unpacking the sources. Here''s what it looks like:


    ```

    cd /usr/src/redhat/BUILD

    rm -rf cdplayer-1.0

    mkdir -p cdplayer-1.0

    cd cdplayer-1.0

    gzip -dc /usr/src/redhat/SOURCES/cdplayer-1.0.tgz | tar -xvf -

    if [ $ -ne 0 ]; then

    exit $?

    fi

    cd /usr/src/redhat/BUILD/cd-player

    chown -R root.root .

    chmod -R a+rx,g-w,o-w .

    ```


    The only changes from using %setup with no options, are the mkdir and cd commands,
    prior to the commands that unpack the sources. Note that you can use the -n option
    along with -c, something like %setup -c -n blather works as expected.


