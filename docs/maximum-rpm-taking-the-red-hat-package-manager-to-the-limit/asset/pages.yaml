  md: 'It''s easy to see that the first two tags are required, but what about summary?
    Well, we locked out on that one: we already included a summary for each subpackage
    in our example spec file.


    Let''s take a look at the %description tag first.


    # The %description Tag


    As you''ve proudly noticed, the %description tag differs from other tags. First
    of all, it starts with a percent sign. Secondly, its data can span multiple lines.
    The third difference is that the %description tag must include the name of the
    subpackage it describes. This is done by appending the subpackage name to the
    %description tag itself. So given these %package directives:


    ```

    %package server

    %package client

    %package -n bazlib

    ```


    our %description tags would start with:


    ```

    %description server

    %description client

    %description -n bazlib

    ```


    Notice that we''ve included the -n option in the %description tag for bazlib.
    This was intentional, as it makes the name completely unambiguous.


    # Our Spec File So Far...


    OK, let''s take a look at the spec file after we''ve added the appropriate %descriptions,
    along with group tags for each subpackage:


    ```

    Name: foo

    Version: 2.7

    Release: 1

    Source: foo-2.7.tgz

    CopyRight: probably not

    Summary: The foo app, and the baz library needed to build it

    Group: bogus/junque

    %description

    This is the long description of the foo app, and the baz library needed to build
    it...

    ```


    ```

    %package server

    Summary: The foo server

    Group: bogus/junque

    ```'
