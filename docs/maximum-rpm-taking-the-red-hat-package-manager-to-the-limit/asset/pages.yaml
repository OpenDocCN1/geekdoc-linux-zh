- pgno: 340
  md: '# Chapter 21


    # A Guide to the RPM Library

    API


    In this chapter, we''ll explore the functions used internally by RPM. These functions
    are available for use, making it possible to add RPM functionality to new and
    existing programs. Rather than continually refer to "the RPM library" throughout
    this chapter, we''ll use the name of the library''s main include file — rpmilib.


    # 21.1 An Overview of rpmilib


    There are a number of files that make up rpmilib. First and foremost, of course,
    is the rpmilib library, librpm.a. This library contains all the functions required
    to implement the basic functions contained in RPM.


    The remaining files define the various data structures, parameters, and symbols
    used by rpmilib:


    +   - rpmilib.h

    - dbindex.h

    - header.h


    In general, rpmilib.h will always be required. When using rpmilib''s header-related
    functions, header.h will be required, while the database-related function will
    require dbindex.h. As each function is described in this chapter, we''ll provide
    the function''s prototype as well as the #include statements that the function
    requires.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# 21.2 rpmlib Functions


    There are more than sixty functions in rpmlib. The tasks they perform range from
    low-level database record traversal, to high-level package manipulation. We''ve
    grouped the functions into different categories for easy reference.


    # 21.2.1 Error Handling


    The functions in this section perform rpmlib''s basic error handling. All error
    handling centers on the use of specific status codes. The status codes are defined
    in rpmlib.h and are of the form RPMERR.xxx xxx is the name of the error.


    Return Error Code — rpmErrorCode()


    ```

    #include <rpm/rpilib.h>

    ```


    ```

    int rpmErrorCode(void);

    ```


    This function returns the error code set by the last rpmlib function that failed.
    Should only be used in an error callback function defined by rpmErrorSetCallback().


    Return Error String — rpmErrorString()


    ```

    #include <rpm/rpilib.h>

    ```


    ```

    char *rpmErrorString(void);

    ```


    This function returns the error string set by the last rpmlib function that failed.
    Should only be used in an error callback function defined by rpmErrorSetCallback().


    Set Error Callback Function — rpmErrorSetCallback()


    ```

    #include <rpm/rpilib.h>

    ```


    ```

    rpmErrorCallbackType rpmErrorSetCallback(rpmErrorCallbackType);

    ```


    This function sets the current error callback function to the error callback function
    passed to it. The previous error callback function is returned.


    # 21.2.2 Getting Package Information


    The following functions are used to obtain information about a package file.'
  merge: -1
  img_proc: true
