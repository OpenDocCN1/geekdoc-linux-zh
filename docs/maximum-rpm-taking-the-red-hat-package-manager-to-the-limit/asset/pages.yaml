    # The nosource Tag


    The nosource tag is used to alert RPM to the fact that one or more source files
    should be excluded from the source package file. The tag is followed by one or
    more numbers. The numbers correspond to the numbers following the source tags
    that are to be excluded from packaging.


    ```

    NoSource: 0, 3

    ```


    See also: Section 13.2.6, page 177


    # The patch Tag


    The patch tag is used to define the name of a patch file to be applied to the
    package''s sources. When there is more than one patch tag in a specific file,
    one must be numbered so they are unique, starting with the number 0. When there
    is only one tag, it does not need to be numbered.


    ```

    Patch: cdp-0.33-fsstnd.patch

    ```


    See also: Section 13.2.6, page 178


    # The nopatch Tag


    The nopatch tag is used to alert RPM to the fact that one or more patch files
    should be excluded from the source package file. The tag is followed by one or
    more numbers. The numbers correspond to the numbers following the patch tags that
    are to be excluded from packaging.


    ```

    NoPatch: 2 3

    ```


    See also: Section 13.2.6, page 179


