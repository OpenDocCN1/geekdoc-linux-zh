  md: '# 140 rpm -b Command Reference


    proceed. In this chapter, we''ll explore every aspect of rpm -b.

    An RPM build command must have two additional pieces of information, over and
    above

    `rpm -b`:


    +   1. The names of or more spec files representing software to be packaged.

    2. The desired stage at which the build is to stop.


    As we discussed in chapter 10, the spec file is one of the inputs to RPM''s build
    process. It contains the information necessary for RPM to perform the build and
    package the software.

    There are number stages that RPM goes through during a build. By specifying that

    t build process is to stop at a certain stage, the package builder can monitor
    the build''s

    progress, make any changes necessary, and restart the build. Let''s start by looking
    at

    various stages that can be specified in a build command.


    # 12.1.1 rpm -bp Execute %prep


    The command rpm -bp directs RPM to execute the very first step in the build process.

    in the spec file, this step is labeled %prep. Every command in the %prep section
    will be

    executed when the -bp option is used.

    Here''s a simple %prep section from the spec file we used in chapter 11:


    %prep

    setup


    This %prep section consists of a single %setup macro. When using rpm -bp against
    this

    spec file, we can see exactly what %setup does:


