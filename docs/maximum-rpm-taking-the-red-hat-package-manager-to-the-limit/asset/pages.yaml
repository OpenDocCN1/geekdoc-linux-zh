  md: '# Chapter 8


    # Miscellania


    As with any other large, complex subject, there are always some leftovers — things
    that just don''t seem to fit in any one category. RPM is no exception. This chapter
    covers those aspects of RPM that can only be called “miscellania”...


    # 8.1 Other RPM Options


    The following options are not normally used on a day to day basis. However, some
    of them can be quite important when the need arises. One such option is --rebuilddb.


    # 8.1.1 --rebuilddb — Rebuild RPM database


    We hope all the day never comes, and for many of us, it never does. But still,
    there is a chance that one day, while you''re busy using RPM to install or upgrade
    a package, you''ll see this message:


    free list corrupt (42)- contact rpm-list@redhat.com


    Once this happens, you''ll find very little that you can do, RPM-wise. However,
    before you fire an e-mail to the RPM mailing list, you might try the --rebuilddb
    option. The format of the command is simple:


    ```

    rpm --rebuilddb

    ```


    The command produces no output, either. After a few minutes, it completes with
    a peep. Here is an example of --rebuilddb being used on an RPM database that wasn''t
    corrupt. First, let''s look at the files that comprise the database:


    ```

    # cd /var/lib/rpm

    ```'
