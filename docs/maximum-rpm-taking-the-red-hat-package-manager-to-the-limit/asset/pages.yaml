    # 16.3.2 Betcha Thought We Forgot...


    At the start of this section, we mentioned that the %attr macro wouldn''t accept
    numeric uids or gids, and we promised to explain why. The reason is simply that,
    even if a package requires a certain user or group to own the package’s files,
