- pgno: 236
  md: '# Chapter 14


    # Adding Dependency\Information to a Package


    Since the very first version of RPM hit the streets, one of the side effects of
    RPM''s case of use was that it made it easier for people to break things. Since
    RPM made it so simple to erase packages, it became common for people to joyfully
    erase packages until something broke.


    Usually this only bit people once, but even once was too much of a hassle if it
    could be prevented. With this in mind, the RPM developers gave RPM the ability
    to:


    +   - Build packages that contain information on the capabilities they require.

    - Build packages that contain information on the capabilities they provide.

    - Store this "provides" and "requires" information in the RPM database.


    In addition, they made sure RPM was able to display dependency information, as
    well as to warn users if they were attempting to do something that would break
    a package''s dependency requirements.


    With these features in place, it became more difficult for someone to unknowingly
    erase a package and wreak havoc on their system.


    # 14.1 An Overview of Dependencies


    We''ve already alluded to the underlying concept for RPM''s dependency processing.
    It is based on two key factors:


    +   - Packages advertise what capabilities they provide.

    - Packages advertise what capabilities they require.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Adding Dependency Information to a Package


    By simply checking these two types of information, many possible problems can
    be avoided. For example, if a package requires a capability that is not provided
    by any already-installed package, that package cannot be installed and expected
    to work properly.


    On the other hand, if a package is to be erased, but its capabilities are required
    by other installed packages, then it cannot be erased without causing other packages
    to fail.


    As you might imagine, it''s not quite simple. But adding dependency information
    can be easy. In fact, in most cases, it''s automatic!


    # 14.2 Automatic Dependencies


    When a package is built by RPM, if any file in the package''s %files is a shared
    library, the library''s "soname" is automatically added to the list of capabilities
    the package provides. The soname is the name used to determine compatibility between
    different versions of a library.


    Note that this is not a filename. In fact, no aspect of RPM''s dependency processing
    is based on baselines. Many people new to RPM often make the assumption that a
    failed dependency represents a missing file. This is not the case.


    Remember that RPM''s dependency processing is based on knowing what capabilities
    are provided by a package and what capabilities a package requires. We''ve seen
    how RPM automatically determines what shared library resources a package provides.
    But does it automatically determine what shared libraries a package requires?


    Yes! RPM does this by running ld on every executable program in a package''s %files
    list. Since ld provides a list of the shared libraries each program requires,
    both halves of the equation are complete—that is, the packages that make shared
    libraries available, and the packages that require those shared libraries, are
    tracked by RPM. RPM can then take that information into account when packages
    are installed, upgraded, or erased.


    # 14.2.1 The Automatic Dependency Scripts


    RPM uses two scripts to handle automatic dependency processing. They reside in
    /usr/bin and are called find-requires, and find-provides. We''ll take a look at
    them in a minute, but first let''s look at why there are scripts to do this sort
    of thing. Wouldn''t it be better to have this built into RPM itself?


    Actually, creating scripts for this sort of thing is a better idea. The reason
    is that RPM has already been ported to a variety of different operating systems.
    Determining what shared libraries an executable requires, and the soname of shared
    libraries, is simple, but the exact steps required widely from one operating system
    to another. Putting this of RPM into a script makes it easier to port RPM.


    Let''s take a look at the scripts that are used by RPM under the Linux operating
    system.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "# 14.2 Automatic Dependencies 211\n\nfind-requires — Automatically Determine\
    \ Shared Library Requirements\n\nThe find-requires script for Linux is quite simple:\n\
    \n```\n#!/bin/sh\n\n# note this works for both a.out and ELF executables\n\nulimit\
    \ -c 0\n\nfilelist='xargs -r file | grep executable | cut -d:-f1 '\n\nfor f in\
    \ $filelist; do\n  ldd $f | awk '->/ { print $1 }'\ndone sort -u | xargs -n 1\
    \ basename | sort -u\n```\n\nThis script first creates a list of executable files.\
    \ Then, for each file in the list, ldd identifies the file's shared library requirements,\
    \ producing a list of sonames. Finally, the list of sonames is sanitized by removing\
    \ duplicates, and removing any paths.\n\nfind-provides — Automatically Determine\
    \ Shared Library Sonames\n\nThe find-provides script for Linux is a bit more complex,\
    \ but still pretty straightforward:\n\n```\n#!/bin/bash\n\n# This script reads\
    \ filenames from STDIN and outputs any relevant\n# provides information that needs\
    \ to be included in the package.\n\nfilelist=$(grep '\\.so' | grep -v \"/lib/ld.so\
    \ \" |\nxargs files -L 2>/dev/null | grep \"ELF.**shared object\" | cut -d: -f1)\n\
    \nfor f in $filelist; do\n  soname=$(objdump -p $f | awk '/SONAME/ { print $2\
    \ }')\n\n  if [ \"$soname\" != \"\" ]; then\n    if [ ! -L $f ]; then\n      echo\
    \ $soname\n    else\n      echo ${f##*/}\n  fi\ndone sort -u\n```\n\nFirst, a\
    \ list of shared libraries is created. Then, for each file on the list, the soname\
    \ is extracted, cleaned up, and duplicates removed."
  merge: -1
  img_proc: true
- pgno: 239
  md: '212


    Adding Dependency Information to a Package


    # 14.2.2 Automatic Dependencies: An Example


    Let''s take a widely used program, ls, the directory lister, as an example. On
    a Red Hat Linux system, ls is part of the fileutils package and is installed in
    /bin. Let''s play the part of RPM during fileutils'' package build and run find-requires
    on /bin/ls. Here''s what we''ll see:


    ```

    # find-requires

    /bin/ls

    <ctrl-d>

    libc.so.5

    #

    ```


    The find-requires script returned libc.so.5. Therefore, RPM should add a requirement
    for libc.so.5 when the fileutils package is built. We can verify that RPM did
    add ls'' requirement for libc.so.5 by using RPM''s --requires option to display
    fileutils'' requirements:


    ```

    # rpm -q --requires fileutils

    libc.so.5

    #

    ```


    OK, that''s the first half of the equation — RPM automatically detecting a package''s
    shared library requirements. Now let''s look at the second half of the equation
    — RPM detecting packages that provide shared libraries. Since the libc package
    includes, among others, the shared library /lib/libc.so.5.3.12, RPM would obtain
    its soname. We can simulate this using find-provides to print out the library''s
    soname:


    ```

    # find-provides

    /lib/libc.so.5.3.12

    <ctrl-d>

    libc.so.5

    #

    ```


    OK, so /lib/libc.so.5.3.12''s soname is libc.so.5. Let''s see if the libc package
    really "provide" the libc.so.5 soname:


    ```

    # rpm -q --provides libc

    libm.so.5

    libc.so.5

    #

    ```


    Yes, there it is, along with the soname of another library contained in the package.
    In this way, RPM can ensure that any package requiring libc.so.5 will have a compatible
    library'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# 14.3 Manual Dependencies


    available as long as the libc package, which provides libc.so.5, is installed.


    In most cases, automatic dependencies are enough to fill the bill. However, there
    are circumstances when the package builder has to manually add dependency information
    to a package. Fortunately, RPM''s approach to manual dependencies is both simple
    and flexible.


    # 14.2.3 The autoreqprov Tag — Disable Automatic Dependency Processing


    There may be times when RPM''s automatic dependency processing is not desired.
    In these cases, the autoreqprov tag may be used to disable it. This tag takes
    a yes/no or 0/1 value. For example, to disable automatic dependency processing,
    the following line may be:


    ```

    AutoReqProv: no

    ```


    # 14.3 Manual Dependencies


    You might have noticed that we''ve been using the words "requires" and "provides"
    to describe the dependency relationships between packages. As it turns out, these
    are the exact words used in spec files to manually add dependency information.
    Let''s look at the first tag: requires.


    # 14.3.1 The requires Tag


    We''ve been deliberately vague about what it is that a package requires. Although
    we''ve used the word "capabilities", in fact, manual dependency requirements are
    always represented in terms of packages. For example, if package foo requires
    that package bar is installed, it is only necessary to add the following line
    to foo''s spec file:


    ```

    requires: bar

    ```


    Later, when the foo package is being installed, RPM will consider foo''s dependency
    met if any version of package bar is already installed.¹


    If more than one package is required, they can be added to the requires tag, one
    after another, separated by commas and/or spaces. So if package foo requires packages
    bar and baz, the following line will do the:


    ```

    requires: bar, baz

    ```


    > ¹As long as the requiring and providing packages are installed using the same
    invocation of RPM, the dependency check will succeed. For example, the command
    rpm -ivh *.rpm will properly check for dependencies, even if the package ends
    up being installed before the providing package.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Adding Dependency Information to a Package


    As long as any version of bar and baz is installed, foo''s dependencies will be
    met.


    # Adding Version Requirements


    When a package has slightly stringent needs, it''s possible to require certain
    versions of a package. All that''s necessary is to add the desired version number,
    preceded by one of the following comparison operators:


    +   < Requires package with a version less than the specified version

    <= Requires package with a version less than equal to the specified version

    = Requires package with a version equal to the specified version

    >= Requires package with a version equal to or greater than the specified version

    > Requires package with a version greater than the specified version


    Continuing with our example, let''s suppose that the required version of package
    bar actually needs to be at least 2.7, and the baz package must be version 2.1
    — no other version will do. Here''s what the requires tag would look like:


    requires: bar >= 2.7, baz = 2.1


    We can get even more specific and require a particular release of a package:


    requires: bar >= 2.7-4, baz = 2.1-1


    # When Version Numbers Aren''t Enough


    You might think that with all these features, RPM''s dependency processing can
    handle every conceivable situation. You''d be right, except for the problem of
    version numbers. RPM needs to be able to determine which version numbers are more
    recent than others, in order to perform its version comparisons.


    It''s pretty simple to determine that version 1.5 is older than version 1.6. But
    what about 2.01 and 2.1?7.6a and 7.67? There''s no way for RPM to keep up with
    all the different version-numbering schemes in use. But there is a solution; two,
    in fact...


    # Solution Number 1: Serial numbers When RPM can''t decipher a package''s version
    number, it''s to time out the serial tag. This tag is used to help RPM determine
    version number ordering. Here''s a sample serial tag:


    Serial: 42


    This line indicates that the package has a serial number of 42. What does the
    42 mean? Only that this version of the package is older than the same package
    with a serial number'
