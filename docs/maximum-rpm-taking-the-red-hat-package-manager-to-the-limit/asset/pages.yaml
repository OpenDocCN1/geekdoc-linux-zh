    that haven''t been installed? The -p option can do that for you.


    One situation where this capability would help, occurs when the name of a package
    file has been changed. Since the name of the file containing a package has *nothing*
    to do with the name of the package (though, by tradition it''s nice to name package
    files consistently), we can use this option to find exactly what a package file
    contains:'
