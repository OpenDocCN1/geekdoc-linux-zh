    passwd-0.50-2

    redhat-release-4.0-1

    rootfiles-1.3-1

    termcap-9.12.6-5

    #

    ```


    > On many Linux systems, the file command can be used to obtain similar information.
    See Appendix A for details on how to add this capability to your system''s file
    command.'
