    ```


    This function writes the header, to file fd, converting it from host byte order
    to network byte order. If magicp is defined to be HEADER_MAGIC_YES, headerWrite()
    will add the appropriate magic numbers to the header being written. If magicp
    is defined to be HEADER_MAGIC_NO, headerWrite() will not include magic numbers.


