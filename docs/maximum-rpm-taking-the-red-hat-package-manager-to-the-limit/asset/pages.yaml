  md: '# A.2 RPM File Format


    offset is calculated from the start of the store. So first we must find where
    the store begins, and we can do that by performing a simple calculation.


    First, go back to the start of the signature section. (We''ve made a copy here
    so you won''t need to flip from page to page)


    00000060: 8ead e801 0000 0000 0000 0000 0ac .................


    After the magic, the version, and the four reserved bytes, there is the number
    of index entries (0000 0003). Since we know that each index entry is sixteen bytes
    long (four for the tag, four for the offset, and four for the count), we can multiply
    the number of entries (3) by the number of bytes in each entry (16), and obtain
    the total size of the index. Since the first entry starts at hex offset 70, we
    can simply add hex 30 to hex 70, and get, in hex, offset a0. So let''s skip down
    to offset a0, and see what''s there:


    000000a0: 0004 4c4f 02b5 b097 1597 01d2 df35 d169 ..5.i


    If we''ve done our math correctly, the first four bytes (0004 4c4f) should represent
    the size of this file. Converting to decimal, this is 281,679. Let''s take a look
    at the size of the actual file:


    ```

    # ls -al rpm-2.2.1-1.i386.rpm

    -rw-r-- 1 ed 282015 Jul 21 16:05 rpm-2.2.1-1.i386.rpm

    #

    ```


    Hmm, something''s not right. Or is it? It looks like we''re short by 336 bytes,
    or in hex, 150. Interesting that there''s a nice round number, isn''t it? For
    now, let''s continue through the remainder of the index entries, and see if hex
    pops up up elsewhere.


    Here''s the next index entry. It has a tag of decimal 1001, which is an MD5 checksum.
    It is type 7, which is 16 bytes long, and its data starts four bytes after the
    beginning of the store:


    00000080: 0000 03e9 0000 0007 0000 0004 0000 0010 .................


    And here''s the data. It starts with b02b5 (Remember that offset of four!!) and
    ends on the second line with 5375. This is a 128-bit MD5 checksum of the package
    file''s header and archive sections.


    00000a00: 0004 4c4f 02b5 b097 1597 01d2 df35 d169 ..LO..2.5.i

    000000b0: 329c 5375 8900 0530 0500 6390 a520 2.Su......1.c..


    Ok, let''s jump back to the last index entry:


    00000090: 0000 03ea 0000 0007 0014 0000 0098 .................'
