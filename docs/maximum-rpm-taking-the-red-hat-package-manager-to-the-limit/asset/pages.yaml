- pgno: 30
  md: '# Chapter 1


    # An Introduction to Package

    Management


    # 1.1 What are Packages, and Why Manage Them?


    To answer that question, let''s go back to the basics for a moment. Computers
    process

    information. In order for this to happen — there, are some prerequisites:


    +   - A computer (Obviously)!

    - Some information to process (Also obvious!).

    - A program to do the processing (Still pretty obvious).


    Unless these three things come together there is little going to happen, information
    processing-

    wise. But each of these items have their own requirements that need to be satisfied
    before

    things can get exciting.


    Take the computer, for example. While it needs things like electricity and a cool,
    dry place

    to operate, it also needs access to the other two items — information and programs
    — in

    order to do this. The way to get information and programs into a computer is to
    place

    them in the computer''s mass storage. These days, mass storage invariably means
    a disk

    drive. Putting information and programs on the disk drive means they are stored
    as

    files. So much for the computer''s part in this.


    OK, let''s look at the information. Does information have any particular needs?
    Well, it

    needs sufficient space on the disk drive, but more importantly, it needs to be
    in the proper

    format for the program that will be processing. That''s for information.


    Finally, we have the program. What does it need? Like the information, it needs
    sufficient

    disk space on the disk drive. But there are many other things that it may need:


    +   - It may need information to process, in the correct format, named properly,
    and in the

    appropriate area on a disk drive somewhere.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# An Introduction to Package Management


    +   - It may need one or more configuration files. These are files that control
    the program''s behavior and permit some level of customization. Like the information,
    these files must be in the proper format, named properly, and in the appropriate
    area on a disk. We''ll be referring to them by their other name config files throughout
    the book.


    +   - It may need work areas on a disk, named properly, and located in the appropriate
    area


    +   - It may need even other programs, each with their own requirements


    +   - Although not strictly required by the program itself, the program may come
    with one or more files containing documentation. These files can be very handy
    for the humans trying to get the program to do their bidding!


    As you can imagine, this can get pretty complicated. It''s not so bad everything
    is set up properly, but how do things get up properly in the first place? There
    are two possibilities:


    +   1. After reading the documentation that comes with the program you''d like
    to use, you copy the various programs, configuration files, and information into
    your computer, making sure they are all named correctly, located in the proper
    place, and that there is sufficient disk space to hold them all. You make the
    appropriate changes to the configuration file(s). Finally, you run any setup programs
    that are necessary, giving them whatever information they require to do their
    job.


    +   2. You let the computer do it.


    If it seems the first choice isn''t so bad, consider how many files you''ll need
    to keep track of. On a typical Linux system, it''s not unusual to have over 20,000
    different files. That''s a lot of documentation reading, file copying, and configuring!
    And what happens when you want a newer version of the program? More of the same!


    Some people think the second alternative is easier. RPM was made for them.


    # 1.1.1 Enter the Package


    When you consider that computers are very good at keeping track of large amounts
    of data, the idea of giving your computer the job of riding over 20,000 files
    seems like a good idea. And that''s exactly what package management software does.
    But what is “package”? A package in the computer sense is very similar to a package
    in the physical sense. Both are methods of keeping related objects together in
    the same place. Both need to be opened before the contents can be used. Both can
    have a “packing slip” taped to the side, identifying the contents.


    Normally, package management systems take all the various files containing programs,
    data, documentation, and configuration information, and place them in one specially
    formatted file — a package file. In the case of RPM, the package file is sometimes
    called a “package”.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 1.1 What are Packages, and Why Manage Them?


    a "rpm file", or even a "RPM". All mean the same thing — a package containing
    software meant to be installed using RPM.


    What types of software are normally found in a package? There are no hard and
    fast rules, but normally a package''s contents consist of one of the following
    types of software:


    +   - A collection of one or more programs that perform a single well-defined
    task. This is normally what we people think of as an "application". Word processors
    and programming languages would fit into this category.


    +   - A specific part of an operating system. Examples might be system initialization
    scripts, a particular command shell, or the software required to support a web
    server, for example.


    # Advantages of a Package


    One of the most obvious benefits to having a package is that the package is easily
    manageable chunk. If you move it from one place to another, there''s no risk of
    any part getting left behind. But although this is the most obvious advantage,
    it''s not the biggest


    The biggest advantage is that the package can contain the knowledge about what
    it takes to install itself on your computer. And if the package contains the steps
    to install itself, the package can also contain the steps to uninstall itself.
    What used to be a painful manual process is now a straightforward procedure. What
    used to be a mass of 20,000 files becomes a couple hundred packages.


    # 1.1.2 Manage Your Packages, or They Will Manage You


    A couple hundred? Even though the use of packages has decreased the complexity
    managing a system by an order of magnitude, it hasn''t gotten to the level of
    being a "no-brainer". It''s still necessary to keep track of what packages are
    installed on your system. And if there are some packages that require other packages
    in order to install or operate correctly, these should be tracked as well.


    # Packages Lead Active Lives


    If you start looking at a computer system as a collection of packages, you''ll
    find that a distinct set of operations will take place on those packages time
    and time again:


    +   - New packages are installed. Maybe it''s a spreadsheet you use to keep track
    of expenses, or the latest shoot-em-up game, in either case it''s new and you
    want it.


    +   - Old packages are replaced with newer versions. Whoever wrote the word processor
    you use daily, you''ll probably want to install the new version and remove the
    old one.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# An Introduction to Package Management


    +   - Packages are removed entirely. Perhaps that over-hyped strategy game just
    didn''t cut it. You better things to do with that disk space, get rid of it!


    With this much activity going on, it''s easy to lose track of things. What types
    of package information should be available to keep you informed?


    # Keeping Track of Packages


    Just as there are certain operations that are performed on packages, there are
    also certain types of information that will make it easier to make sense of the
    packages installed on your system:


    +   - Certainly you''d like to be able to see what packages are installed. It''s
    easy to forget if that fax you tried a few months ago is still installed or not.


    +   - It would be nice to be able to get more detailed information on a specific
    package. This might consist of anything from the date the package was installed,
    to a list of files installed on your system.


    +   - Being able to access this information in a variety of ways could be helpful,
    Instead of simply finding out what files a package installed, it might be handy
    to be able to name a particular file and find out which package installed it.


    +   - If this amount of detail is possible, then it should be possible to see
    if the way a package is presently installed varies from the way it was originally
    installed. It''s not at all to make a mistake and delete one file — or a hundred.
    Being able to tell if one or more packages are missing files could greatly simplify
    the process of getting an ailing system back on its feet.


    +   - Files containing configuration information can be a real headache. If it
    were possible to pay extra attention to these files and make sure any changes
    made to them weren''t lost, life would certainly be a lot easier.


    # 1.2 Package Management: How to Do It?


    Well, all that sounds great —easy install, upgrade, and deletion of packages;
    getting package information presented several different ways; making sure packages
    are installed correctly; and even tracking changes to config files. But how do
    you do it?


    As mentioned above, the obvious answer is to let the computer do it. Many groups
    have tried to create package management software. There are two basic approaches:


    +   1 Some package management systems concentrate on the specific steps required
    to manipulate a package.


    +   2 Other package management systems take a different approach, keeping track
    of the files on the system and manipulating packages by concentrating on the files
