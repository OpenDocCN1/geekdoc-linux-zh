  md: '# 15.4 Building a Relocatable Package


    225


    82 blocks

    Generating signature: 0

    Wrote: /usr/src/redhat/SRPMS/cdplayer-1.0-1.src.rpm

    #


    The build completed normally. Now the files to be placed in the binary package
    file are listed, minus the prefix of /usr/local. Some of you might be wondering
    why the cdp.1 file didn''t cause problems. After all, it had a %doc directive,
    too. The answer lies in the way the file was specified. Since the file was specified
    using an absolute path, and that path started with the prefix /usr/local, there
    was no problem. A more complete discussion of the %doc directive can be found
    in section 13.6.1 on page 19.


    # 15.4.1 Tying Up the Loose Ends


    In the course of building this package, we ran into two hitches:


    +   1. The config file cdp-config couldn''t be installed in /etc.

    2. The README file could not be packaged using the %doc directive.


    Both of these issues are due to the fact that the /files'' paths do not start
    with the default path /usr/local. Does this mean this package cannot be relocated?
    Possibly, there are two options to consider. The first option is to review the
    prefix. In the case of our example, if we chose a prefix of /usr instead of /usr/local,
    the README file could be packaged using the %doc directive, since the default
    documentation directory is /usr/doc. Another approach would be to use the %docdir
    directive to define another documentation-directory somewhere along the path.


    This approach wouldn''t work for /etc/cdp-config, though. To package that, we''d
    need to resort to more extreme measures. Basically, this approach would entail
    packing the file in an acceptable directory (something under /usr/local) and using
    the %post post-install script to move the file to /etc. Pointing a symlink at
    the config file is another possibility.


    Of course, this has some problems. First, you''d need to write a %post script
    to undo what the %post script made the files were in place would be nice, too.
    Second, because the file or symlink wasn''t installed by RPM, there''s no entry
    for it in the RPM database. This reduces the utility of RPM''s -c and -d options
    when querying. Finally, if you actually move files around using the %post script,
    the files you move will not verify properly, and when the package is erased, your
    users will get disconcerting messages when RPM can''t find the moved files to
    erase them. If you have to resort to these kinds of tricks, it''s probably best
    to forget trying to make the package relocatable.


    > For more about the %docdir directive, please see section 13.6.2 on page 201.

    Install and erase-time scripts have an environment variable, RPM_INSTALL_PREFIX,
    which can be used to write scripts that act appropriately if the package is relocated.
    See section 13.3.2 on page 183 for more information.'
