- pgno: 24
  md: '# Preface


    # 0.1 Linux and RPM - A Brief History


    Welcome! This is a book about the Red Hat Package Manager or, as it is known to
    it''s friends, RPM. The history of RPM is inextricably linked to the history of
    Linux, so a bit of Linux history may be in order. Linux is a full-featured implementation
    of a UNIX-like operating system, and has taken the computing world by storm.


    And for good reason an Intel-based personal computer that had previously been
    prisoner of the dreaded Windows hourglass is transformed into a fully multitasking,
    network capable, personal workstation. For all the cost of the time required to
    download, install and configure the software.


    Of course, if you''re not the type to tinker with downloaded software, many companies
    have created CDROMs containing Linux and associated software. The amount of tinkering
    required with these distributions has varied widely. The phrase "You get what
    you pay for" is never more true than in the area of Linux distributions.


    One distribution bears the curious name "Red Hat". Produced by a company of the
    same name, this distribution was different. One of the key decisions a new Linux
    user needs to make is which of the many different parts of the distribution to
    install on their system. Most distributions use some sort of menu, making it easy
    to pick and choose. Red Hat is no different.


    Over time, Red Hat has become the most popular distribution available today. For
    to edge out the previous leader (known as Slack) in just two years is amazing.
    There has to be a reason for this kind of success, and a good part of the reason
    is RPM. But until now, there has been precious little in terms of RPM documentation.
    You could say that RPM''s ease of use has made detailed instructions practically
    unnecessary, and you''d be right.


    However, there are always people that want to know more about their computers,
    and given the popularity of Red Hat, this would have made a book on RPM worthwhile.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'xxii


    Preface


    But there''s more to the story than that.


    There is a truism in the world of free software, that goes something like this:
    If there''s a better solution freely available, use it! RPM is no exception to
    the rule. Put under the terms of the GNU General Public License (Meaning: RPM
    cannot be made proprietary by anyone, not even Bill Gates), RPM started to attract
    the attention of others in the Linux, Unix, and free software communities.


    At present, RPM is used by several commercial software companies producing Linux
    applications. They find that RPM makes it easier to get their products into the
    hands of their customers. They also find that it can even make the process of
    building their software easier. (Those of you that develop software for fun and
    profit, stick around - the second half of this book will show you everything you
    need to know to get your software “RPM-ized”)


    People have also ported RPM to several commercial UNIX systems, including DEC''s
    Digital Unix, IBM''s AIX, and Silicon Graphics'' IRIX. The simple answer is that
    it makes it easier to install, upgrade, and de-install software. If all these
    people are using RPM, shouldn''t you?


    # 0.2 Parts of the book, and Who They''re For


    This book is divided into two major sections. The first section is for anyone
    that needs to know how to use RPM on their system. Given the state of the Linux
    arena, this could include just about anyone, including people who are new to Linux,
    or even UNIX. Those of you who think that


    ```

    ls -FAL !*|less

    ```


    is serious magic (or maybe even a typing error), relax — we''ll explain everything
    you''ll need to know in the first section.


    In the book''s second half, we''ll be covering all there is about building packages
    using RPM. Since software engineering on Linux and UNIX systems requires in-depth
    knowledge of the operating system, available tools, and basic programming concepts,
    we''re going to assume that the reader has sufficient background in these areas.
    Feel free to browse through the second half, but don''t hesitate to seek additional
    information if you think that it gets a bit tough.


    # 0.3 Acknowledgements


    Writing a book is similar to entering a long-term relationship with an obsessive
    partner. Throughout the months it took to write this book, life went on job changes,
    births, deaths, and even a hurricane. Throughout it all, the book demanded attention.
    I''d like to thank the people that made it possible to focus on the book to the
    exclusion of nearly everything else. My wife, Deb and son, Matt supported and
    encouraged me throughout, even when I was less than a reclusive houseguest hunched
    over'
  merge: -1
  img_proc: true
