- pgno: 88
  md: '# 5.2 The parts of an RPM Query


    -v Display Additional Information In some cases, the -v option can be added to
    a query for additional information. The -v l option we''ve been discussing is
    an example of just such a case. Note how the -v option adds verbosity.


