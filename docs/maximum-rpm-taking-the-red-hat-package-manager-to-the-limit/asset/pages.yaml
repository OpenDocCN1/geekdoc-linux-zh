  md: 'The vast majority of cases, it will not be necessary to use -vv. It is normally
    used by software engineers working on RPM itself, and the output can change without
    notice. However, it''s a handy way to gain insights into RPM.


    ```

    --dbpath <path>: Find RPM Database

    ```


    In order for RPM to do its handiwork, it needs access to an RPM database. Normally,
    this database is set to the directory specified by the rpm file entry, dbpath.
    By default, dbpath is set to /var/lib/rpm.


    Although the dbpath entry can be modified in the appropriate rpmrc file, the -dbpath
    option is probably a better choice when the database path needs to be changed
    temporarily. An example of a time the --dbpath option would come in when it''s
    necessary to examine an RPM database copied from another system. Granted, it''s
    not a common occurrence, but it''s difficult to handle any other way.


    ```

    --root <path>: Alternate Root to <path>

    ```


    Adding --root <path> to verify commands forces RPM to assume that the directory
    specified by <path> is actually the “root” entry. In addition, RPM expects its
    database to reside in the directory specified by the rpmrc file entry, relative
    to <path>.⁴

    Normally this option is only used during an initial system install, or when a
    system has been booted off a “rescue disk”, and some packages need to be re-installed
    in order to restore operation.


    ```

    --rcfile <rcfile>: Alternate rpmrc file to <rcfile>

    ```


    The --rcfile option is used to specify a file containing default settings for
    RPM. Normally, this option is not needed. By default, RPM uses /etc/rpm and a
    file named .rpmrc, located in your login directory.


    This option would be used if there was a need to switch between several of RPM
    options. Software developer and package builders will be the people using --rcfile.
    For more information on rpm files, see Appendix B.


