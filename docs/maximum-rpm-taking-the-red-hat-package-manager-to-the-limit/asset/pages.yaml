    The bottom line using the %setup macro is that you can probably get it to do what
    you want, but don''t be afraid to tinker. And even if %setup can''t be used, it''s
    easy enough to add the necessary commands to do the work manually. Above all,
    make sure you use the --test option when testing your %setup macro, so you can
    see what commands they''re translating to.


    Next, let''s look at RPM''s second macro, %patch.


    # 13.4.2 %patch Macro


    The %patch macro, as its name implies, is used to apply patches to the unpacked
    sources. In the following examples, our spec file has the following patch tag
    lines:


    ```

    patch0 patch-zero

    patch1 patch-one

    patch2 patch-two

    ```


    At its simplest, the %patch macro can be invoked without any options:

    %patch


    Here are the resulting commands:


    ```

    echo "Patch #0"

    patch -p0 -s < /usr/src/redhat/SOURCES/patch-zero

    ```


    The %patch macro nicely displays a message showing that a patch is being applied,
    invokes the patch command to actually do the dirty work. There are two options
    to the patch command:


    +   1. The -p option, which directs patch to remove the specified number of slashes
    (and any intervening directories) from the front of any filenames specified in
    the patch file. In this case, nothing will be removed.


    +   2. The -s option, which directs patch to apply the patch file without displaying
    any informational messages. Only errors from patch will be displayed.'
