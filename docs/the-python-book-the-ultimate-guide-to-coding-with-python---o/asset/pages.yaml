    test_post.author = 'Me'\ntest_post.pub_date = datetime.now()\n```\n\nAnd save\
    \ it with:\n\n```\ntest_post.save()\n```\n\nStart the site-backend\nTo create\
    \ the admin site, edit urls.py in your project and add the following lines:\n\n\
    ```\nfrom django.contrib import admin\nfrom django.urls import path\n[path('admin/',\
