  md: '# Preparing the structure


    As we have mentioned previously, XBMC extension type follows a certain naming
    convention. In this case we are building a video plug-in, so the plug-in name
    would be the root directory. We will need some other folders and files as well.


    Describing the directory structure of L0/UIEntity:


    ```

    $addon

    - plugin/Root directory

    - default.xml

    - changelog.txt

    - icon.png

    - LICENSE.txt

    -README

    - resources/

    - settings.txt

    ```


    In the example we have added a library xmbc_python version 2.1. Currently it is
    also a mandatory dependency. To make the dependency mandatory


    The root element of the addon is the <addon> tag. It is defined as:


    ```

    <addon id="plugin.name" name="L0 HB SW Viewer" version="1.0">

    ```


    The rest of the content is placed here under


    ```

    <extension>

    ```


    Here, the id refers to the plug-in, it should be unique among all the XBMC extensions,
    and it is also used for the mandatory version. The version number, which helps
    in its ability to deliver the addon, is specified


    Note: Steps 3-5 cover other entries that need to be added with the extension tag.


    # Adding dependency information


    Dependency on an extension is managed using the <requires> element.


    ```

    <requires>

    <import addon="xmbc.python">

    ```


    # Setting up metadata


    ```

    version="2.3.0"

    <import addon="plugin.video">

    youtube="1.0.0"

    <import addon="plugin.video.vime"

    version="2.3.0"

    <import addon="plugin.library"

    mylylcom="1.0.0"

    </requires>

    ```


    Metadata about the plug-in is provided in extension point="xmbc.addon.metadata".
    The following are important elements:


    xplatform: For most them, XBMC extensions are cross-platform. However, if you
    depend on a native library that is only available on certain platforms then you
    will need to set the supported platforms here. Accepted platforms for the plug-in
    are x86, x64 (Apple iOS), Windows (Windows DirectX), Linux and


    summary: This gives a description of the plug-in. We use the example language
    as English, but you can also use it for other languages.


    description: A description of the plug-in.


    website: Where the plug-in is hosted.

    source: Code repository URL. If you are hosting your plug-in on GitHub, you can
    put the repository URL here.


    forum: For discussion URL, for your plug-in.

    email: Your email address. You can directly-type or use a bot-friendly email address
    like domain@com.


    # Setting changelog, icon and licence


    We need a few additional things in the plug-in...


    changelog: You should change the changelog for your plug-in releases. The changelog
    is visible from the XBMC UI.


    An example here:


    +   - 0.1

    - Initial Release

    - 0.0.2

    - Fixed Video Buffering Issue


    icon.png: This will represent the plug-in in the XBMC UI. It needs to be a non-transparent
    PNG image of size 256x256.


    fanart.jpg: (optional) The favicon is rendered in the background if a user selects
    the plug-in in XBMC. The mark needs to be rendered in HD format, so its size can
    range from 1280x720 (720p) up to the maximum 1920x1080 (1080p).


    # Setting up the version entry point


    Our extension is to provide the video content for XBMC. In order to do that, we
    have to set up the following:


    ```

    <extension extensionpoint="xmbc.addon.metadata"

    plugsource="default">

    ```


    Here, the id attribute sets the plug-in entry. In this example default plug-in
    will be executed when the user activates the plug-in. The type is what it provides.
    This also reflects the placement of the plug-in. Since we are a video plug-in,
    it will show up in the Sections of XBMC.


    The Python Book 83'
