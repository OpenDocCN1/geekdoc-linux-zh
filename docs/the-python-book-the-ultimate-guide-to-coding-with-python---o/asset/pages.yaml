  md: '# # Use Python with Pi


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_160_0.png)


    # ## Setting up


    Having detailed comments in your code is important because it allows you to note
    down things you find confusing and complex procedures. If another programmer has
    to work with your code, they''ll be extremely grateful. With a description of
    what the program will do and your name, All comments start with a hash (#) and
    are not interpreted by the Python interpreter. We use the sys library so we can
    use the exit function to extend our program later. We also import everything from
    the decimal library because we want to make use of the type.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_160_1.png)


    We don''t have messy folders on our Pi, so let''s go to the file manager and organise
    them. Open the file manager by clicking the menu icon on the left of the screen.
    Create a new folder by right-clicking and selecting NewFolder, then type a name
    and click OK. We created a folder called Python, and inside that folder called
    Hello-World-v2.


    # 01 Staying organising


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_160_2.png)


    # 05 Variables


    A variable is data that is stored in memory and can be accessed by name. Our program
    is going to ask for your first name, so we start with a variable and then output
    a message. We want to add a comment that explains why we use a variable called
    name. We capitalised the first letter of the second word to make it easier to
    read. We want to hold the value that the user enters in the variable, and then
    use it for the user input. The question is passed into the function within brackets,
    and this is because a string is enclosed in quotes. The extra space we added after
    the colon will show the user their input is typed correctly.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_160_3.png)


    # 03 Saving your work


    It''s always good to save your work. As you create a Python program, you could
    be saving anything you''ve been working on. To save your file for the first time,
    press Ctrl+S or go to File as save. Give the file a simple name and save it in
    the folder we created earlier. It''s always better to save work before you start
    making changes, especially when your projects become bigger and more complex.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_160_4.png)


    # 02 Starting Going


    Start by going to the LXE menu and going to Python. From here, once you''re in
    the file editor, create a new Python file from a template named ''template.py''.
    Delete everything in it except for the first line #bin/env python. This is important
    because we can now run the code from the command line and the Bash will know to
    open it with the Python interpreter.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_160_5.png)


    ```

    # /usr/bin/env python

    # Hello World

    # programming in Python

    import sys

    from sys import exit

    # from decimal import *

    ```


    +   1 # /usr/bin/env python

    2 # Hello World

    3 # programming in Python

    4 import sys

    5 from sys import exit

    6 # from decimal import *


    # 06 Printing a message


    We need to have a message in the file: we will print to the screen using Python.
    The function is print() followed by a pair of brackets which encloses the value.
    When we use print with several arguments, they are joined together. The function
    doesn''t need quotation marks because it''s the name of a variable. If it was
    enclosed in quotes, the text would be a character (new line characters) in our
    output to leave one blank line before we start our next example.


    ```

    print(''Hello '' + name + ''!'')

    ```


    > When using the addition operator with strings, they are joined together


    The Python Book 161'
