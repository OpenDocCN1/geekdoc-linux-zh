  md: '# Web development


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_146_0.png)


    # Install Python


    Django is based on Python, and requires it to be installed to develop. Python
    2.7 is the recommended version, and this is installed with the python package.
    If you want to check your version, start the Python Shell by typing ''python''
    into the terminal.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_146_1.png)


    # Install Django


    Most operating systems have a Django package available in the repository, python-django
    in Debian. The Django website has a list you to find it, or you could build it
    from source. Make sure you install version 1.3.


    # Verify Django


    To make sure Django installed properly, and that you have the right version, enter
    the terminal, by typing ''python'' and enter the following:


    ```

    import django

    print django.version()

    ```


    It will return a version number if it has installed correctly, which should be
    ideal.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_146_2.png)


    # Start a new project


    In the terminal, cd to the folder you want to start the blog in, and run the following:


    ```

    django-admin startproject myblog

    ```


    Here, ''myblog'' can be replaced by whatever you want to name the project, but
    we''ll use it for the upcoming examples.


    # Start the development server


    Django comes with a lightweight development server to test work locally. We can
    also use it to check our work, so cd to your myfolder and then use python manage.py
    runserver


    If all goes well, it should return no errors. Use Ctrl+C to exit.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_146_3.png)


    # Configure the database


    The database settings are kept in the settings.py file. Open it with your favourite
    editor and go to the Databases section. Change


    ```

    ''ENGINE'': ''django.db.backends.sqlite3'',

    ''NAME'': ''/home/user/projects/myblog/sqlite.db'',

    ```


    Save and exit.


    # Create the database file


    The database file will be generated by using the command:


    ```

    python manage.py migrate

    ```


    During the creation, it will ask you to set up your supervisor, which you can
    do.


    The SQLite database file will be created in your myblog folder.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_146_4.png)


    The Python Book 147'
