    # Program objects


    David Ames, who uses Pygame to teach at events across the UK, said, "Teaching
    when it comes to kids is different. OOP (object-oriented programming) is perfectly
    absorbed but it can''t be ignored."


    Perhaps the best approach is using Pygame and simple to start, dropping in a piece
