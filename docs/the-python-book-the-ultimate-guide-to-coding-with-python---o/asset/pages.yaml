  md: "# Making web apps with Python\n\nPython provides quick and easy way to build\
    \ applications, including web apps. Read on to find how to use it to build a feature-complete\
    \ web app\n\nPython is known for its simplicity and capabilities. At this there\
    \ is nothing so advanced that you cannot do with Python, and conquering the web\
    \ is one of the possibilities. When you are using Python you get access to a huge\
    \ catalogue of modules and community support - make the most of them.\n\nplain\
    \ old CGI modules to utilising foiled web frameworks. The latter is the most popular\
    \ method of building web applications with Python, since it allows you to build\
    \ low-level applications without worrying. There are many web frameworks available\
    \ for Python, Django, TurboGear and WebPy. For instance Django will use our preferred\
    \ options:\n\nWeb development in Python can be in many different ways, right from\
    \ using the\n\n# 01 Creating the Django magazine issue tracker\n\nThe django-adminpy\
    \ file is used to create new Django projects. Lets create one for our issue tracker.\n\
    \nIn Django, a project represents the site and its settings. On the other hand,\
    \ it represents a specific feature of the site, like blogging or tagging. The\
    \ benefit of this approach is that your Django application becomes portable and\
    \ can be integrated with other sites with very little effort.\n\n```\n$ django-admin.py\
    \ startproject\n```\n\nA project will be created. This will also act as the root\
    \ of your development web server directory. Under the project directory you will\
    \ find the following:\n\n+   - manage.py: A Python package which contains your\
    \ settings and configuration-data.\n\n+   - __init__.py: This file contains the\
    \ project options.\n\n+   - urls.py: This file contains various URL mappings.\n\
    \n# 02 Configuring the Django project settings\n\nBefore we start working on the\
    \ application, configure the Django project as we require.\n\n> lissuetracker/settings.py\
    \ as follows (only parts requiring modification are shown):\n\nDatabase Settings:\
    \ We will use SQLite3 for our database.\n\nNOTE: Red text indicates new code or\
    \ default:\n\n```\n'default': {\n    'ENGINE': 'django',\n    'backend': 'sqlite3',\n\
    \    'NAME': 'lissuetracker.db',\n}\n```\n\n# Path settings\n\nDjango requires\
    \ absolute paths for project settings. But we want to be able to use the path\
    \ using relative directories. In order to do that we will add a helper function.\
    \ Insert the following at the top of the settings.py:\n\n```\nimport os\nTEMPLATE_DIRS\
    \ = [os.path.join(os.path.dir(os.path.abspath(__file__)), 'templates')]\nMEDIA_ROOT\
    \ = get_path.join('media')\n```\n\n# Resources\n\nPython 2.7:\nhttps://www.python.org/download/releases/2.7/\n\
    \nDjango version 1.4:\nhttps://www.django.project/com/"
