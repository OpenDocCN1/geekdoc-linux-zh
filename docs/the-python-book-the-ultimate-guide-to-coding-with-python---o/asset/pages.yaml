    \n```\n>>> from shutil import copytree, ignore_patterns\n>>> copytree(source,\
    \ 'destination',\n      ignore=ignore_patterns('*.tmp'))\n```\n\nmake_archive(base_name,\
    \ format, root_dir, base_dir=None, verbose=None, logger=None): Think of this as\
