    The FreeSound is a good place to find free and open sound effects for


    with several aspects, and you should take into account, a smaller explosion occurs
    on your ship. Music, lasers and sound effects also accompany the animations as
    they happen.


    # 05 Finding images


    Before we can begin programming, we have to set our assets up. We''ve used some
    sprites for this project, and to use these sprite sheets; you can find them free
    online or with GIMP with a little practice. It''s practically easy to find sized
    and spaced image headers for free. Ready-made examples at opopengame.org, where
    we found


    # 06 Tweaking assets


    While many of the assets are on sites like opengame.org, you may want to import
    them to fit your needs. If you need to crop them to size—as we did with our ship
    sheet to help align the center—open a new window in GIMP, set the size and then
    copy and paste the image. The sheet has 11 examples of the same width and height
    in a pixel. Pixel-perfect on size and width is key, so we can just just


    # 07 Loading the sprite


    Since we''re using the Sprite class to create our Player class, we can easily
    explain how the player looks and moves. We need to load our ship sprite with `pygame.image.load()`.
    Since we made a sheet with transparency, we can add `.convert_alpha()` to it


    # 08 Animation


    In the initializing code for the game, we will set flags for player: `self.animate`,
    left and `self.right`. In the control of our game, we will use this `flag` when
    we want to animate animations to use Boolean. values we will use to `''automatically''`
    to animate the player when he is moving right. The ship will continue to look
    left if it''s leaving when


    # 09 The animation


    These flags pop up in our code for the player: `self.animate` within the game
    class. Here we will use it to check the condition and the player movement exactly.
    If the `self.animate` is true or if the animation is different from what we want,
    we will increase the player''s speed. We will then animate the ship back to the
    starting spot and the same logic is applied in the dependent option.


    # 10 Explosion & sound


    The explosion, and `explosion()` method that follows after the player coll in
    the game class are similar to the examples of the same thing. We only need to
    load the predefined set of frames for them, then we only need to see the sprite
    image. The `self.explosion` flag is the variable that changes the image. The sprite
    is displayed with the variables, `alien_explosion`, `pos` and `animation` are
    set a different set of surface than before.


    # 11 Adding sound to the player


    Pygame makes it easy to add a sound score to a project. You can find plenty of
    music from freesound.org and load it using the `pygame.mixer` class. It''s also
    initialized via `pygame.mixer()`. We can then add and play the music with this
    code:


    # 12 Using sound effects


    Using sound effects is similar to how we do it for images in the game. We will
    load the sound effect using a similar method. For the laser, the initialization
    looks like this: `self.bullet_sound = pygame.mixer.Sound(''sounds/laser-beam.wav'')`.
    Then we simply play the sound effect at the appropriate time. In the case of the
    laser, we want to play it when we press the space bar, so we place it in the game
    Class control method, after the `shoot_bullet` flag. We recommend using freesound.org.'
