  md: "# # Build tic-tac-toe with Kivy\n\nEase into the workings of Kivy by creating\
    \ the pen-and-paper classic in just under 100 lines of Python...\n\nKivy is a\
    \ highly cross-platform framework for Python, for the creation of innovative user\
    \ interfaces multitouch apps. The applications can run not only on the main desktop\
    \ platforms, OS X and Windows, but also on Android and iOS, plus they look like\
    \ native apps.\n\nYou can also develop cross-platform apps using Python libraries\
    \ as Requests, SQLAlchemy or NumPy. Great feature is the Cython-optimized OpenGL\
    \ graphics pipeline, allowing advanced GPU effects where they are applicable.\n\
    \nKivy is a set of Python modules that can be easily installed, but with a custom\
    \ backend it is API. Use Kivy for compilation of speedy graphics internals, and\
    \ SDL2 for media handling. You can install them from Kivy's repositories, or via\
    \ pip where available.\n\nWith satisfied dependencies, you can install Kivy with\
    \ the normal incantation. The current version is 1.8.0, which supports both python\
    \ and python3. The code in this tutorial is also available for running in python\
    \ 2.7.\n\nIf you have any problems installing kivy, you can use easy_install.kivy.\n\
    \nThere are also packages or repositories for popular distributions. You can find\
    \ them online.\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_107_0.png)\n\ninformation\
