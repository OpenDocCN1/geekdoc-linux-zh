  md: '# Files


    When dealing with files, you need to create a file object to interact with it.
    The file command takes methods like ''open'', ''read'' and ''close'' to create
    a file object. You can then call the file object methods like ''open'', ''read'',
    and ''close'' to get data out of it. If you are doing processing, you can also
    use the ''readline'' method. When opening a file, there is an explicit ''open''
    command to simplify the process. It takes a string with the file name, and an
    optional parameter that is a string that defines the mode. It takes a string such
    as writing (''w'') or appending (''a''). After opening the file, a file object
    is returned so that you can further interact with it. You can then read, write
    to it, and finally close it.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_20_0.png)


    # Yielding


    In many cases, a function may need to yield the control of execution to another
    function. This is the case with generators. The preferred method for a generator
    is that it will only calculate the value when it is requested through the ''next''
    command. This command saves the state of the generator, and return control to
    the calling function. In this way, the state of the generator is remembered and
    it picks up the next value when requested. In this way, you only need enough memory
    to store the needed value, rather than storing all of the values possible in memory.


    # Picking data


    There are few different ways of serializing memory when needed. One of these is
    called picking. Pickle is a module that allows converting objects to a byte stream.
    To store data on the hard drive, you can use the dump method to write the data
    out. When you want to retrieve the same data, you can use the unpickle method.
    If you want to unpickle an object, it might succeed, or lack of it. There is another
    module, cpickle, which provides similar functionality. Since it is written in
    C, it can be as fast as 1000 times faster. One drawback to pickle is that it does
    not store information for the class, but only its instance information. When you
    unpickle it, it may have different methods and attributes if the class definition
    has changed in the interim.


    # Shelving data


    While picking is useful, it needs some reference processing within Python. The
    shel module allows you to store almost anything that can be pickled. The storage
    of the data on the hard drive is handled by the pickle database. When you open
    a shel, you can read and write using key-value pairs. When you are done, it is
    important to specify the class of the data to store. It is best not to open the
    raw files outside of the shel module in Python. You can also open the file with
    writeback set to True. If so, you can call the sync method to write out changes
    created.


    # Threads


    ```

    import threading


    # Use the ''thread'' command to create a new thread for execution. It follows
    the same technique as the process module.

    thread = threading.Thread(target=my_function)

    thread.start()

    ```


    You can create multiple threads of execution within Python. The ''thread'' command
    can create a new thread for execution. It follows the same technique as the process
    module. When first, you need to create a function, and then a handler for it.
    Then you call the thread command to start it. You can have multiple threads with
    different function handlers. One advantage is that threads are just like POSIX
    threads. This means everything is the responsibility of the programmer. You need
    to handle locks with the ''lock'' command. When you are need to ''exit'' the lock
    to ensure that it is cleaned up and no resources are left behind. You can also
    have fine-grained control over the threads, being able to set lock status for
    each thread.


