    In these pages we will learn extensions for XBMC. These are a way of adding features
    to XBMC without having to learn C++ . An additional advantage is that XBMC uses
    Python as its scripting language, and this helps new developers involved in the
    project as Python is easy to learn compared to C++. We cover Add-Ons, Plugins,
