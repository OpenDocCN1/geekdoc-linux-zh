  md: "# Web development\n\nPython has several frameworks available for all of your\
    \ various web development tasks. We will look at some of the more popular ones\n\
    \nWith the content and the database hosting on a server, web application can guarantee\
    \ a consistent experience for end users. The Django framework provides a complete\
    \ environment of plugins and modules on the DRY principle (Don't Repeat Yourself).\
    \ Because of this, you should be able to build your application very quickly.\
    \ Django is built on Python, you should be able to install it with \"sudo pip\
    \ install Django\". Most distributions should have a package for Django, too.\
    \ Depending on what you want to do you may need to install a database like MySQL\
    \ or postgresql to store your application data.\n\nThere are Django utilities\
    \ to automatically generate a starting point for your new project's:\n\ndjango-admin\
    \ start-project\n\nThis command creates a file named \"management.py\" and a folder\
    \ named \"file\" which contains several useful functions you can use to manage\
    \ your project. The directory also contains the files \"__init__.py\", \"settings.py\"\
    , \"urls.py\" and \"views.py\". These files and the directory reside in your project\
    \ root. You can change the site name in the code which can be found in the \"\
    settings.py\". The URL declarations, basic tables of contents for site, are also\
    \ included in a Python package that gets loaded when your web server starts. The\
    \ \"wsgi.py\" file creates an entry point for WSGI-compatible web servers.\n\n\
    Once your application is done, it should be hosted on a web server. But as you\
    \ will find out, Django has a web server built into it. To start the framework,\
    \ you can simply change directory to the \"project\" directory and run the following\
    \ command:\n\npython manage.py runserver\n\nThis will start up a server listening\
    \ on port 8000 on your local machine. This server is built for development, automatically\
    \ reloads your Python code for each change. This means that you don't need to\
    \ restart the server to see your code changes.\nAll of these steps help you to\
    \ create a working project. You are now ready to start developing applications.\
    \ Within the \"webservice\" project, you can use:\n\npython manage.py startapp\n\
    \nThis will create a new directory named \"newapp\", with the files \"models.py\"\
    , \"tests.py\" and \"views.py\", among the simplest view consists of:\n\n```\n\
    from django.http import HttpResponse\n\ndef index(request):\n    return HttpResponse(\"\
    hello world\")\n```\n\nThis is not enough to make it work, however. You also need\
    \ to create a URL for the view. If the file \"urls.py\" doesn't exist, then add\
    \ the following:\n\nThe last step is to get the URL registered within your project.\
    \ You can do this with the code\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_75_0.png)\n\
    \n```\nfrom django.urls import include, url\nfrom django.contrib.admin import\
    \ include\n\nurlpatterns = [\n    url('newapp/', include('newapp.urls')),\n]\n\
    ```"
