  md: "# # Python essentials\n\n`none': None`\n\n```\nself.position += 0.5 * dt *\
    \ dir__\ndict(self.direction())\n```\n\n```\nimport random\n```\n\nFig. 04\n\n\
    These on_touch handlers are Kivy's method for handling touch or mouse input, they\
    \ are automatically called when the input is detected and you can do anything\
    \ you want in response. In this case we set the Player's direction property to\
    \ either keyboard or touch input, and use this to move the player when update\
    \ method is called. We can also add the report for the ball.\n\n```\nclass Block(Widget):\n\
    \    def __init__(self, **kwargs):\n        super(Block, self).__init__(**kwargs)\n\
    \        self.color = random.choice([\n            (0.75, 0.25, 0.2), (0.28, 0.63,\
    \ 0.28), (0.25, 0.28, 0.70)\n        ])\n```\n\nFig. 05\n\nThe ball bounces off\
    \ every wall by forcing the velocity to point back from the paddle - as well as\
    \ bouncing with an extra kick if it hits the paddle. It also handles any collision\
    \ with the blocks or any win/lose conditions, but it tries to catch the game if\
    \ the ball hits the player's body.\n\n```\n<Player:\n    size_hint: 0.0, 0.05\n\
    \    # canvas part\n```\n\nThis should handle the loss, showing a pop-up with\
    \ a message and a button to try again. Finally, we should handle destroying blocks\
    \ when the ball hits them.\n\n```\n<Ball:\n    size_hint: 0.1, 0.125\n    pos_hint:\
    \ {'x': self.position.x, 'y': self.position.y}\n    size_hint: None\n    size:\
    \ None\n    size_size: self.parent.width, 0.3*self.parent.width\n    # canvas\
    \ part\n```\n\nThis covers all last conditions, collision with Kivy's built-in\
    \ collide_widget method by comparing pos and size. The direction will depend on\
    \ how the ball has penetrated, so we will tell it how to fix it.\n\n```\nfrom\
    \ kivy.clock import Clock\nfrom kivy.core.window import Window\nfrom kivy.utils\
    \ import platform\n```\n\nSo we there is, you can call run() to play your simple\
    \ game. It's very simple now, but hopefully you could add lots of other details\
    \ to the behavior. You could add types of blocks and player-levels, a level decoration,\
    \ or even a full game interface with menu and settings screen.\n\n```\nclass Game(Layout):\n\
    \    def update(self, dt):\n        self.ball.update(dt) # Not defined yet\n \
    \       self.player.update(dt) # Not defined yet\n```\n\nWe're just showing one\
    \ code that you can do - how do you do your game for Android? Kivy takes any Android\
    \ app and turn it into an Android app that will run on Android. However, Kivy\
    \ can access even the Android API to access hardware or OS features like vibration,\
    \ sensors, and notifications.\n\n```\ndef start(self):\n    Clock.schedule_interval(self.update,\
    \ 1./60.)\n```\n\n```\ndef stop(self):\n    Clock.unschedule(self.update)\n```\n\
    \nWe'll build the Builder now, and a Kivy project wrapping our build tools to\
    \ create different packages packages. This takes care of configuring and running\
    \ the Android build tools (NDK, JDK, and Kivy) to create the APK.\n\n```\ndef\
    \ reset(self):\n    for block in self.blocks:\n        self.remove(block)\n  \
    \  self.blocks = []\n    self.ball.velocity = [random.random(), 0.5]\n    self.player.position\
    \ = 5\n```\n\n```\nclass Breakout(App):\n    def build(self):\n        if platform\
    \ == 'android':\n            Window.bind(on_key_down=self.on_key_down)\n     \
    \       Window.bind(on_key_up=self.on_key_up)\n        self.reset()\n        Clock.schedule_once(self.start,\
    \ 0)\n        return game\n```\n\nThe Python Book 59"
