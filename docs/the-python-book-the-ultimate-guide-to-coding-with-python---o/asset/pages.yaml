  md: "# # Work with Python\n\nLearn how Python is an important part of system administration\
    \ and as it can help to replace the usual shell scripting...\n\n# ## Resources\n\
    \n+   - **python-dev**: libraries for compiling and installing python-related\
    \ packages\n- **setuptools**: allows you to download, build, upgrade, and uninstall\
    \ packages with ease\n\nSystem administration is an important part of our computing\
    \ environment. It does not matter whether you are managing systems at work or\
    \ at home, a Linux-based system already has many shells (not just one but many,\
    \ like Bash, zsh, fish) and many other features which make the Linux system administrator's\
    \ job easier. So why do we need Python instead of Linux scripting? Python language\
    \ is very easy to read and learn. That's not just what we say, but many Linux\
    \ distributions also use Python for many of their internal tasks.\n\n# ## Parsing\
    \ configuration files\n\nConfiguration files provide a way for applications to\
    \ store settings. In order to write a script that allows you to modify the settings\
    \ of a particular application, you should be able to parse the configuration file.\
    \ Although the file format is very popular with many modern open sources, such\
    \ as XML and YAML.\n\n```\nimport configparser\nconfig = configparser.ConfigParser()\n\
    config.read('config.ini')\n```\n\nConfigParser is a built-in module that handles\
    \ configuration files. You use this module to parse and edit configuration files.\n\
    \nHere we look into executing sysadmin tasks using Python.\n\n> We have persistent\
    \ connections.\nmysql_allow_persistent = True\nmysql_max_persistent = 20\nmysql_max_connections\
    \ = -1\n\n```\nconfig.set('MySQL', 'host', 'localhost')\nconfig.set('MySQL', 'trace_mode',\
    \ 'off')\nconfig.set('MySQL', 'connect_timeout', '60')\nconfig.set('MySQL', 'default_port',\
    \ '3306')\nconfig.set('MySQL', 'max_query', '14')\nconfig.set('MySQL', 'allow_persistent',\
    \ 'True')\nconfig.set('MySQL', 'persistent', '20')\n```\n\n```\nwith open('php.ini',\
    \ 'ap') as configfile:\n    config.write(configfile)\n```\n\n```\nmysql_max_persistent\
    \ = 20\nmysql_allow_persistent = True\nmysql_default_port = 3306\nmysql_host =\
    \ 'localhost'\nmysql_connect_timeout = 60\n```\n\n```\n@code.configParser\n@:Parsing\
    \ and updating the configfile\n```\n\n```\nimport configparser\nconfig = configparser.ConfigParser()\n\
    config.read('php.ini')\n# Print config values\nprint(config.get('MySQL', 'host'))\n\
    ```\n\nThis is written for Python 2.X series, but it will work in Python distribution\
    \ across all platforms (including Linux distros, and macOS).\n\n12 The Python\
    \ Book"
