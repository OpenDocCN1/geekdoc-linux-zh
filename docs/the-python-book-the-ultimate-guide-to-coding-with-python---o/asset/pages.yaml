  md: "# Autowiring the admin interface\n\nAdmin sections can be problematic in their\
    \ own right.\nDjango provides an extensible admin interface for you\n\n# 03 Enable\
    \ Admin Management\n\nTo enable our module and associated models to be managed\
    \ through the admin interface, we need to register them with the admin module.\
    \ Open blog/admin.py and then add a line to import and register the models in\
    \ turn (you may need one or two lines currently). Save the file and refresh the\
    \ admin site to see the posts that are now available.\n\n# Hosting Python apps\n\
    \nAdmin sections can be problematic in their own right.\nDjango provides an extensible\
    \ admin interface for you\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_140_0.png)\n\
    \n# Getting Started with Heroku\n\nHeroku is one of the best-known cloud hosting\
    \ providers. Their stack environment supports a number of core web apps including\
    \ Django as standard. Their unique command-line features and integration with\
    \ git make it incredibly easy to scale and improve performance, making an obvious\
    \ choice. A free account will allow you to run a Django app on one instance without\
    \ cost.\n\n# Heroku heroku.com\n\n# 01 Create Admin User\n\nDjango makes content\
    \ administration incredibly easy and has an admin interface available by default\
    \ as shown at http://127.0.0.1:8000/admin/. You need to create a superuser by\
    \ running the associated command and specify user details to proceed and log in.\n\
    \n```\n$ python manage.py createsuperuser\n(Leave blank to use 'admin')\nEmail\
    \ address: admin@domain.com\nPassword:\nPassword again:\nSuperuser created successfully.\n\
    $ admin\n```\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_140_1.png)\n\npython\
    \ manage.py createsuperuser\n\n# 02 Switch blog management\n\nLogged into the\
    \ interface you will be greeted with features to manage groups and roles, which\
    \ are all powerful and provided by Django. There is not yet, however, any way\
    \ to manage our blog posts so let's turn that on:\n\n# from django.contrib import\
    \ admin\n\n# # Register your models here.\n\n# 04 Create View\n\nDjango admin\
    \ interface accepting new subscribers for a view page to display them. Open blog/views\
    \ and import the Post class from models. Create a method to fetch all posts from\
    \ the database and output them as a table,\n\n# from django.urls import HttpResponse\n\
    \n```\ndef index(request):\n\ndef post_list(request):\n    post = Post.objects.get(id=request['id'])\n\
    \    return HttpResponse(str(post.content))\n```\n\n# Host, run, and code Python\
    \ in the cloud!\n\nreturn HttpResponse(request)\n\n# 05 Manage URLs\n\nCreate\
    \ 'blog.urls' and add it to the views that we want to manage in the module and\
    \ the accompanying URLs. Open blog/urls.py and add the URL function for the index\
    \ view. View the result: http://127.0.0.1:8000/\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_140_2.png)\n\
    \n# Python Anywhere\n\nwww.pythonanywhere.com\nAnother hosted option created specifically\
    \ for Python applications is general Python Anywhere. The free basic plan has\
    \ enough weight and power to get started with a Python app without having to scale,\
    \ but as soon as your projects traction, you can switch and boost your performance\
    \ effortlessly.\n\n# Using the dev server\n\nDjango starts with a very helpful\
    \ development server, which will help you out by autocomloading and reloading\
    \ after you make code changes. When you have to start the server is to run the\
    \ 'python manage.py runserver' command from your terminal within\n\n# # blog/urls\n\
    \n```\nfrom django.urls import url\nfrom . import views\npatterns = (\n    url('',\
    \ views.index),\n    url('post/<int:id>/', views.post_list),\n\n),\n```\n\n# #\
    \ my/urls.py\n\n```\npatterns = (\n    url('blog/', include('blog.urls')),\n \
    \   url('admin/', admin.site.urls),\n),\n```\n\nthe project directory.\n\nIt offers\
    \ an incredibly impressive range of tools to import into your apps, available\
    \ to implement immediately to get you started, including Django and Flask stacks\n\
    \nyou need them.\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_140_3.png)\n\n* Next"
