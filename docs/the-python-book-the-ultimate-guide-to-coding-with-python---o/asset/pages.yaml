    \  rpiGpio.setPinDir(PIND0, rpiGpio::OUTPUT);\n  rpiGpio.setPinDir(PIND1, rpiGpio::OUTPUT);\n\
    \  rpiGpio.setPinDir(PIND2, rpiGpio::OUTPUT);\n  rpiGpio.setPinDir(PIND3, rpiGpio::OUTPUT);\n\
    \  rpiGpio.setPinDir(PIND4, rpiGpio::OUTPUT);\n  rpiGpio.setPinDir(PIND5, rpiGpio::OUTPUT);\n\
    \  rpiGpio.setPinDir(PIND6, rpiGpio::OUTPUT);\n  rpiGpio.setPinDir(PIND7, rpiGpio::OUTPUT);\n\
    ```\n\nAbove is the full schematic of the LED matrix we're working with (here\
    \ you can view it at its full size on Fritidio)\n\n# 12 Energy cost\n\nLEDs light\
    \ up when current flows through them. SetData puts pins of the 74HC24 low to ensure\
    \ the current from the 74HC238 can flow through the diode.\n\nStep 13\n\n```\n\
    unsigned char dataStore[16];\nfor (int j=0; j<16; j++) {\n  dataStore[j] = 0;\n\
    }\n```\n\n# 13 Avoid GPIO trouble\n\nThe Raspberry Pi has a tendency to crowd\
    \ the expansion header with regularity, which has problems for manufacturers of\
    \ cheaper processors. It's recommended to handle the mapping between pins and\
    \ functions via a set of defines. Our choice is a Raspberry Pi with a short header—40-pin\
    \ variant which requires requirements mapping some physical pins to correspond\
    \ to the logical GPIO numbers.\n\nStep 14\n\n```\nint blockCounter=0;\nint rowCounter=0;\n\
    while(1) {\n  if (blockCounter==16) {\n    blockCounter=0;\n  }\n  if (rowCounter==0)\
    \ {\n    blockCounter=0;\n    rowCounter++;\n  } else {\n    blockCounter++;\n\
    \    rowCounter++;\n  }\n```\n\n# 14 Add data sample\n\nAll connections between\
    \ the pins and the single-board computer, and proceed to starting the compiled\
    \ code. Don't forget to use sudo command - direct access is restricted to root\
    \ to prevent events from causing physical memory faults. Users are alerted to\
    \ this, so requiring to put a sudo in front of the command does not cause concern.\n\
    \n# 15 Click off\n\nTest the code by setting the dataStore to a value. Setting\
    \ 64 to all fields will display one row in each part of the display.\n\nStep 15\n\
    \n```\nsafeleyGetRow(rowCounter, rpiGpio);\nsetAddress(dataStore[rowCounter],\
    \ rpiGpio);\nsleep(100);\n\nreturn 0;\n```\n\n# 15 Notice flicker\n\nSharp-edged\
    \ LEDs will notice an occasional flicker where one appears brighter than the others.\
    \ This is caused by the stalling of the process - if the kernel does other work,\
    \ the scheduling routine can't run. We could solve this problem using a real-time\
