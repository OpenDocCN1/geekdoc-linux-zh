  md: '# System administration


    # Get the most out of Python in handling all the day-to-day upkeep that keeps
    your system healthy


    System administration tasks are some of the most annoying things you need to deal
    with when you own. Because of this, administrators have constantly been trying
    to find ways to automate these tasks to maximise their time. They began with basic
    shell scripts, and moved on various scripting languages. For a long time, Perl
    had been the language of developing these types of maintenance tools. However,
    Python is growing in popularity and has reached the point where most Linux distributions
    have a Python interpreter included in order to run system scripts, so you shouldn''t
    have any doubt about writing your own scripts.

    Because you are doing a lot system level work, you will have most of a couple
    of Python modules. This provides the bulk of the interfaces for interacting with
    the underlying system.

    The first step is to look at the environment where your script is running to see
    what information might exist there for your script. The following code gives you
    a mapping object where you can interact with the environment variables active
    now:


    ```

    import os

    sos.environ

    ```


    You can get a list of all the environment variables with the function os.environ.keys(),
    and then access individual variables with "os.environ[''key'']". These variables
    are used when you spawn a subprocess. So if you will want to change values, like
    the PATH or the current working directory, in order to run these subprocesses
    correctly, there is a "put" function that unfortunately does not exist on all
    systems. So better


    Left Python scripts enable you to instruct and interact with your operating system


    | SYSTEM ADMINISTRATION

    BASH, PERL, PYTHON |


    | OPERATING SYSTEM |


    | FILES/IO |


    way to do this is to edit the values within the environ mapping.

    Another task that you might want to automate when working with files. For example,
    you can get the current working directory with code like


    ```

    cwd = os.getcwd()

    ```


    You can get a list of the files in this directory


    ```

    os.listdir(cwd)

    ```


    You can move around the file system with the function "os.chdir()". Once you are
    interested in it, you can open it with "open" and open it for reading, writing
    and/or appending. You can then read or write to it using functions "read()" and
    "write". Once, you can close the file with "close".


    # Running subprocesses from Python


    The understanding of Unix is to build small, specialised programs that do one
    thing well. You then chain them to build more complex behaviors. There is no reason
    to try and do everything in one script. There are several utility programs to
    use with very little on your part. The old way of doing this was to use shell
    scripts. Now we use the subprocess module, but the better way of running other
    programs is by using the subprocess module instead. You can then launch a program
    by


    This provides you with a log file for the current directory. The function "run"
    was introduced in Python 3.5 and is the most suggested way of handling this. If
    you have an argument that you want to pass to the program, you can pass it as
    an element of the list. You can then get the output, the return code and anything
    else you need.


    # Scheduling with cron


    Once you have a script ready to run, you want to run it automatically without
    manually logging in. In Linux systems, you can have cron run your script on a
    schedule. "crontab -l" lists the cron jobs and "crontab -e" allows you to edit
    the scheduled jobs you want to run.


    ```

    cmd_output = subprocess.run([''ls'', ''-l''],

    stdout=subprocess.PIPE)

    ```


    ```

    import subprocess

    subprocess.run([''ls'', ''-l''])

    ```


    The "cmd_output" returns a CompletedProcess that contains the return code and
    a string holding the stdout output.


