    or perhaps a fan of time-lapse photography that you''ve overlooked the Raspberry
    Pi module for a while.


    floor, you''ll need your Pi camera mounted in a similar way, looking rather than
    down.


    If you''re a fan of animation or you simply want to extend the possibilities of
    the module, why not build a stop-motion camera? By using Python the Raspberry
    Pi can be the perfect little animator.


    Various options are available, such as smartphone mounts and dashboard mounts.
    Most of these should be suitable for securely mounting your Raspberry Pi.


    Better still, you go beyond animating toys or bits of LEGO and go to school by
    mounting the Pi on a rostrum and creating a cartoon. Even if you can''t buy or
    build one, you can mount your stop-motion camera with a smartphone for stability.


    # 02 Find somewhere to


    For your first attempt at shooting a stop-motion video, you might use a wide and
    uncluttered space. This might be a desk, a kitchen work surface or the floor,
    but it should be a hard and flat area in most cases. You will need a stable environment
    for your video to aid the creation of your stop-motion film.


    Before you get started, think about the type of camera you''re going to use. If
    you''re using the traditional webcam method, used by classic animators, you''ll
    need a rostrum to mount the Raspberry Pi.


    # 01 Mount your stop-motion camera


    As you progress, your skill develops, other surfaces can provide useful alternatives,
    but keep it simple for now and get to grips with the art form while you are using
    the Raspberry Pi stop-motion camera.


    Alternatively, you may be animating something on a desk, or perhaps the


    # 03 Connect the Pi camera module


    Next you''ll need to connect your Raspberry Pi to the Pi camera module. All models
