    # 37. Performing basic file operations (copy, delete and rename)


    You can use the ''shutil'' module to perform file operations at high level. This
    module works with your regular files and will not work with special files like
    named pipes, blocks, and


    ```

    >>> shutil.copy(src, dst)

    Copies the file to a dst directory.

    >>> shutil.copyfile(src, dst)

    Copies the files from src to dst.

    >>> shutil.move(src, dst)

    Moves a file to directory.

    >>> shutil.copytree(src, dst, symlinks=True)

    Recursively copies an entire directory at src.

    >>> shutil.rmtree(path, [ignore_errors])

    Deletes an entire directory.

    ```


    # 35. Working with zipfile


    You can use the ''zipfile'' module to zip and unzip files.


    ```

    >>> import zipfile

    >>> zipfile.ZipFile(''filename.zip''

