  md: '# # Create a graphical interface for Python games


    Bring everything together with a Python GUI and take the next step in programming
    your own software


    The three basic games we have made so far have all run in graphics. While this
    allowed us to show off different ways to use Python, we haven''t actually shown
    you how to present it yet. In this tutorial, we will take all three games and
    put them into one nearly unified graphical interface.


    To do this, we''ll need some of the small line of code we created at the bottom
    of each previous tutorial so we can import them


    modules into our main graphical script. We''ll also modify the existing code to
    add elements. To do this we''ll be using tkinter, a default module in Python that
    allows us to create windows and frames with simple code.


    All you need for this tutorial is an up-to-date copy of Python, from your distro
    repository or the website, and the IDLE development environment for Raspberry
    Pi. This will also work on Raspberry Pi distros, such as Raspbian.


    # Resources


    +   Python 2: [www.python.org/download](https://www.python.org/download)

    IDLE: [www.python.org/idle](https://www.python.org/idle)


    # ### The start


    Here we''re doing getting a new module that helps us create a simple graphical
    interface


    # ### The imports


    We''re importing the three games we created in past issues so we can call upon
    or use them


    # ### The window


    Creating a graphical window and give it a name so we can add functions to it


    # ### The frame


    Define the dimensions of the window and give a rough guide to the placement of
    objects within


    # ### The welcome


    Put a message in the window and place it in specific orientation. This was a little
    different to print


    # ### The button


    The focus of this month is making Rock-Paper-Scissors work in a graphical interface,
    so we''re creating a new function for it


    # ### The creating


    Creating and formatting to start the other two games via command line or shell


    # ### The exit


    Here we create a button that quits the window and ends the script. We also placed
    it at the bottom of the window


    # ### The loop


    The mainloop allows the window to continue to work and update without the program
    unless specified


    # Main Interface Code Listing


    > # Linux & Developer presents: Mega Ecommerce Collection


    ```

    from tkinter import *


    import rockscissors

    import human

    import happen


    troot = tk.Tk()


    frame = tk.Frame(root, height=200, width=500)

    frame.pack(pady=5)


    label = Label(frame, text="Welcome to Linux & Developers Mega Ecommerce Collection.

    Please select one of the games to play:", wraplength=400)

    label.pack(side=TOP)


    rps_button = Button(frame, text="Rock, Paper, Scissors", command=rockscissors.game)

    rps_button.pack()


    human_button = Button(frame, text="Hangman", command=human.start)

    human_button.pack()


    pd_button = Button(frame, text="Poker Dice", command=pokerdice.start)

    pd_button.pack()


    exit_button = Button(frame, text="Quit", command=root.destroy)

    exit_button.pack(side=BOTTOM)


    root.mainloop()

    ```


    44 The Python Book'
