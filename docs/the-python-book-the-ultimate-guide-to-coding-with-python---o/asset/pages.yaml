  md: '# Make a visual novel game with with Python


    Bridge the gap between books and videogames by creating an interactive novel or
    choose-your-own-adventure with Python and Pygame


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_123_0.png)


    +   * Change scenes to add more depth to the story, and allow the game to have
    decisions and routes


    # Resources


    +   **Python 2:**

    www.python.org/

    **Pygame:**

    pygame.org/download.html

    **IDLE Python IDE**

    **Game assets**

    **Code from FileSilo (optional)


    Most people look for a compelling story in modern videogames, and those that don''t
    have one are appearing less and less. A great way to tell a story is through the
    genre of visual novels, and you can make one simply in Python. These interactive
    entertainments are an extremely popular form of entertainment in Japan, and usually
    work by having the player click through a story and make decisions as they go
    along, in order to experience different plots and endings.


    In Python, this is a relatively simple project to create, but with the addition
    of the Pygame module we can make it easier still, and even more expandable for
    the future. Pygame adds support for images and text, creating display windows
    and keyboard inputs, simplifying the coding process.

    ''ll be coding in this standard Python 2, so make sure to run it in IDLE 2 and
    not IDLE 3 while you are writing, testing, and coding.'
