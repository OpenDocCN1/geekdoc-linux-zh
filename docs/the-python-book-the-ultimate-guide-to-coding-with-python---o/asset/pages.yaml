  md: '# Pygame Zero


    Pygame Zero cuts out the boilerplate to turn your ideas into games instantly,
    and we''ll show you how


    # Resources


    +   Pygame Zero:

    pygame-zero.readthedocs.org


    +   Pygame:

    pygame.org/download.html


    +   Pip

    pip-installer.org


    +   Python 3.2 or later

    www.python.org/


    +   Code from FileSilo (optional)


    Games are a great way of understanding a language: you have a goal to work towards,
    and each feature you add brings more fun. However, games need libraries and modules
    for graphics and other essential features. While Pygame library made it relatively
    easy to make games, there are still barriers - barriers to your kids getting started
    in code.


    Pygame Zero cuts out all of the boilerplate code for you, so you get coding games
    instantly! PG (as we will approximate) it makes sensible assumptions about what
    you''ll need for a game - from the size of the window to importing the game library
    - so that you can get straight to coding your ideas.


    PG''s creator, Daniel Popa, told us that the library ''grew out of talking to
    teachers at Python UK''s education track, and trying to understand that they need
    to get immediate results and breaks into bite-size fragments, in order to keep
    up with speed.


    To give an idea of what''s involved, we''ll build up a simple game from a Pong-like
    style. Ball and catch smashing blocks. The project will illustrate what can be
    done with very little effort. Right early development but still offers a great
    start - and is now included in the Pi in Raspberry Pi image.


    We''ll look at installation on other platforms, but let''s see what magic it can
    bring.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_127_0.png)'
