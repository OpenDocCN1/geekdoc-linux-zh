  md: '# Send an SMS from your Raspberry Pi


    Create a program that combines Twilio and simple Python code to enable you send
    an SMS (text message) from your Pi to a mobile phone


    # Resources


    Raspberry Pi Twilio account


    Text messaging, or SMS (Short Message Service), has become a staple of everyday
    communication. What began life as a 50 pence message service is now offered by
    most tariff providers as an unlimited service. Twilio, a cloud communications
    company enables you to send SMS messages for free from Raspberry Pi to a mobile
    phone using just six lines of code.


    +   01 Set up your Twilio account

    The first step of this project is to register for a Twilio account and Twilio
    number. This is free and will enable you to send an SMS to a registered, verified
    phone. Once signed up, you will receive a verification code via the registered
    phone. When prompted, enter this onto the Twilio site to authenticate your account
    and phone. Go to twilio.com/try-twilio and create your account.


    +   02 Register and verify mobile numbers

    Your Twilio account is a trial account (unless you pay the usage fee, which means
    you can only send and receive communications from a validated phone number). Enter
    the number of the mobile that you want to verify, ensuring that you select the
    correct country code. Twilio will tell you a verification code. Enter this code
    into the website and submit.


    > With this method you could drop it when it finishes running a script


