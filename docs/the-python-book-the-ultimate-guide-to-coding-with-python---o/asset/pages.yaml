  md: '# 32. Using regular expression-based search


    The ''re'' module makes it easy to use regexp-based search. You can use the function
    with a regexp-based expression. Check out the following example:


    ```

    >>> import re

    >>> s = "Kunal is a bad boy"

    >>> if re.search(''K'', s):

    >>>     print(''Match'') # char literal

    nMatch

    >>> if re.search(''[A-Z]'', s):

    >>>     print(''Match'') # char class

    nMatch

    >>> if re.search(''[0-9]'', s):

    >>>     print(''Match'') # digits

    Match

    ```


    # 34. SQLite database with Python


    SQLite is fast and very popular embedded database because of its zero configuration
    needed, and superior level of performance. You can use the ''sqlite3'' module
    in order to work with SQLite databases.


    ```

    Example:

    >>> import sqlite3

    >>> connection = sqlite3.connect(''test.db'')

    >>> cursor = connection.cursor()

    >>> cursor.execute(''''''CREATE TABLE item

    (id integer primary key, item

    name text, desc text, price real))'''''')

    site3.Cursor object at 0x000a4b2de

    ```


    # 33. Using bz2(bz2) compression format


    You can use the ''bz2'' module to read and write data using the bz2 compression.


    ```

