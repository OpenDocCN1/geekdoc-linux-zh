  md: '# With modulus


    The ''with'' command provides the ability to create a code block with methods
    defined by a context manager. This can help clean up code and make it easier to
    read what that piece of code is doing months later. A classic example of using
    ''with'' dealing with files. If you have a more complicated ''with'' command it
    will open and prepare it for reading. You can then read the file in the code block
    which will be automatically closed when the block is exited, regardless of the
    reason. So, if the block throws an exception, you don''t need to worry about closing
    the handler. For example, you can create a context manager class to help out.


    # Printing


    The simplest way of getting output to the user is with the print command. This
    will send text to the console. If you are using version 2.X of Python, there are
    many ways of you can use the print command. The most common has been called simply
    as a print statement, but you can use syntax for any other function. So, the example
    would look like ''print("hello")''. If you use the print syntax, you can add parameters
    that give you finer control over the output. For example, you can define the ''file''
    parameter to have the print statement dumped into the text file. It will also
    accept any object that has some string representation.


    # 26 Ranges


    You may make a list of numbers, or a tuple for a loop. The ''range()'' command
    will create an iterable list of numbers. With one parameter, it generates a range
    starting from zero. With two, you can specify an optional start as well as a step.
    Negative numbers count not.


    # 27 Xranges


    One problem with ranges is that all the elements to be calculated up front and
    stored in memory. The command ''range()'' takes the same parameters and provides
    the same values but only the next element as it is needed.


    # 28 Iterators


    Iteration is a Pythonic way of dealing with things. For objects that are not iterable,
    you can use the command ''iter()'' command to wrap your object and provide an
    iterable interface for use with other functions.


    # 29 Sorted lists


    You can use the command ''sorted()'' to sort a list of elements. You can use a
    custom function, and for more complex cases, provide a function that pulls out
    a ranking from each element for comparison.


