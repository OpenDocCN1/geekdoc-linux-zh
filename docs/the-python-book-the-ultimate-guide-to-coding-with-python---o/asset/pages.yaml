  md: '# Work with Python


    # Robotics and electronics


    Robotics is the most direct interface between your code and

    the real world around you


    Robotics is the most direct way that your code can interact with the world around
    you. It can read actual sensor information and move real actuators and get real-world
    results.


    The first thing your robot needs is the ability to sense the world around it.
    The first thing that we humans feel is sight. With web cameras you can easily
    setup and connect to hardware, vision is easy to give to your robot. The real
    problem is to interpret this data. Luckily, you can use the OpenCV project to
    do just that, it is a vision that can provide image gathering and processing,
    extremely complex functions like feature recognition and extraction of 3D objects.
    You can identify and track objects moving through your field of view. You can
    also use OpenCV to give your robot some reasoning capabilities, to includes a
    sets of features or even neural networks.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_79_0.png)


    for machine learning, you can do statistical classification or clustering, and
    it is easy to feed decision trees or even neural networks.


    Another important sense that you may want to use is sound. The sound project that
    you design is to give a complete voice control system. This project would help
    you give your robot the ability to listen and respond to your verbal commands.
    The project has the power to which you can give it a command and the voice recognition
    software to build a mapping of text to correspond to what commands to execute.


    There are also other sensors you could use, but this begins to leave the realm
    of store-bought hardware. Other sensors, like pressure, temperature, orientation
    or location, special hardware that needs to be interfaced with the computer for
    your robot.


    # Arduino


    Contrast to the Raspberry Pi, which runs all full OS, the Arduino are microcontrollers
    with fewer resources. Computers of installing Arduino platform code that is open
    hardware. It is mainly used to interface with motors, sensors, devices such as
    LEDs, and can be powerful. Arduino is easy to use as a great complement to the
    Pi.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_79_1.png)


    # Raspberry Pi


    # ROS - Robot Operating System


    While we could gladly write some code to do that, we haven''t decided what kind
    of computer to use for your projects, so we decided on Raspberry Pi. This thing
    a dedicated system - the Robot Operating System (ROS) is designed to provide the
    same type of interface between different parts of a robot.


    Because ROS is a complete system, rather than a library, it is wrong to think
    that you can use it in Python. It is better to write your python code that can
    be used in ROS. The fundamental design is to be a framework of libraries. This
    means that your code should be clean and not particular where you are using or
    who is talking to.


    The first thing that your robot needs is any architecture that might be it enough
    to allow running Linux or Python. It is simple to copy your code code directly
    to the Raspberry Pi. It also includes its own GPIO bus so that you can read and
    write to sensors.


    available that do allow you to coordinate tasks, using figuring where sensors
    or libs are in space. ROS is also great for data processing, and creating and
    managing the processes that can be created. For extremely time-sensitive tasks,
    a library that allows you to write C++ plugin that can be loaded with ROS processes.


    of processes with messages being passed between them.


