  md: "# Python essentials\n\nPython uses carriage returns to separate statements,\
    \ and an indentation to separate code blocks. Most of the compiled programming\
    \ languages, such as C and C++, use semicolons and curly brackets to separate\
    \ code.\n\n# 4. Python statements\n\nPython uses '=' for assignment and '==' for\
    \ comparison. Assignment does not support multiple assignment; so to avoid accidentally\
    \ assigning the value you actually want to swap with\n\n# 5. = and operators\n\
    \nYou can use '+' to concatenate strings.\n\n```\n```\nprint('kunal')\n```\n```\n\
    \n# 6. Concatenating strings\n\n# 7. __init__\n\nThe __init__ method of an object\
    \ is an instance. The method is used to do any initialization you want to do with\
    \ your object. The __init__ method is analogue to a constructor in C++ or Java.\n\
    \n```\n```\nclass Person:\n    def __init__(self, name):\n        self.name =\
    \ name\n\n    def hello(self):\n        print('Hello, my name is', self.name)\n\
    \np = Person('Kunal')\np.hello()\n```\n```\n\nExample:\n\n```\n```\nimport my.function\n\
    def max(a, b):\n    if a > b:\n        return a\n    else:\n        return b\n\
    \nModule Usage\nimport my_function\n```\n```\n\n# 8. Modules\n\nTo keep your programs\
    \ as they grow in size, you might want to break them down into modules. This allows\
    \ you to put multiple functions into one file as a module that can be imported\
    \ into other scripts and programs. These files must have a .py extension.\n\n\
    # 9. Module defined functions\n\nThe built-in dir() can be used to find out what\
    \ a module defines. It returns a list of strings.\n\n```\n```\nimport time\ndir(time)\n\
    ['__file__', '__name__', '__package', 'accept', 'altzone', 'clock', 'daylight',\
    \ 'gmtime', 'sleep', 'struct', 'struct_time', 'time', 'timezone', 'tz']\n```\n\
    ```\n\n# 10. Module documentation\n\nYou can see the internal documentation of\
    \ a module by calling help().\n\nExample:\n\n```\n```\nhelp(time.clock)\nclock()\
    \ -> floating number\nThis returns the CPU time or time since the first call to\
    \ clock(). It can also be returned as a tuple of system records.\n```\n```\n\n\
    # 11. Passing arguments to a Python script\n\nPython lets you access the arguments\
    \ you have passed to a script while calling. The 'command line arguments' are\
    \ stored in sys.argv.\n\n```\n```\nimport sys\nprint(sys.argv)\n```\n```\n\n#\
    \ 12. Loading modules or commands\n\nYou can load predefined modules or commands\
    \ at the start of any Python script by setting PYTHONPATH. You can set the environment\
    \ PYTHONPATH to a file that contains the instructions necessary modules or commands.\n\
    \n# 13. Converting a string to a date object\n\nYou can use the function 'strptime'\
    \ to convert a string to date object.\n\nExample:\n\n```\n```\nfrom datetime import\
    \ datetime\n```\n```\n\n# 14. Converting to a list\n\nYou can convert a date to\
    \ string in either of the following ways:\n\n1st method:\n\n+   - list = ['span',\
    \ 'ham', 'eggs']\n- print(' '.join(list))\nspan ham eggs\n\n2nd method:\n\n```\n\
    ```\nprint(' '.join(list))\nspan ham eggs\n```\n```\n\n# 15. Table completion\n\
    \nIn Python you can achieve auto inspection by adding lines to your python file\
    \ or to your python script using import.\n\n```\n```\nimport readline\nreadline.parse_complete(tab='complete')\n\
    ```\n```\n\nThis will make Python partially typed function and variables show\
