  md: "# # Python essentials\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_57_0.png)\n\
    \n+   - Running the app shows we our colour blocks on the screen, but they all\
    \ overlap! We can fix that easily\n\nYou probably noticed that one of the Block's\
    \ instructions refers to colour property. This means we can change the property\
    \ to update the colour of the block, or in this case give each block a random\
    \ colour (Fig.04).\n\nNow our game with widgets has a graphical representation,\
    \ let now tell Game where to place them, so we can start up the app and actually\
    \ see them there.\n\n```\nclass GameLayout:\n    def set_blocks(self):\n     \
    \   for x in range(5):\n            y = random.randint(0, 100)\n            block\
    \ = Block(pos=(x*50, y), size=(40,40))\n            self.blocks.append(block)\n\
    \            self.add_widget(block)\n```\n\n```\nclass BreakMyApp:\n    def build(self):\n\
    \        g = Game()\n        g.setup_blocks()\n        return g\n```\n\nHere we\
    \ create the widgets we need to add_widget to the graphics root. Our root widget\
    \ on the screen is an instance of Game which is added to the window.\n\nThe new\
    \ thing is that every block has been given a pos_hint, here how we handle\n\n\
    this special property and it is used by FloatLayout: like Game we set their position\
    \ to the layout.\n\nThe dictionary is to handle various parameters, but in this\
    \ case 'x' and 'y' and block relative to the parent width and height.\n\nYou can\
    \ run the app now, and it will go to the Game before starting it. The screen will\
    \ show one of three possible collision patterns and in a post, you'll notice that\
    \ they all overlap.\n\nThis takes care of keeping all game widgets positioned\
    \ and sized in the layout. The Ball and Player will use the properties we set,\
    \ so we'll be able to move them just by setting three properties and letting layout\
    \ automatically update their positions.\n\nThis also uses an extra property to\
    \ remain rather than rectangular, because the alternative would likely look a\
    \ little bit odd.\n\nWe have almost the final details of the graphics of our app!\n\
    \nYou can run the game again now, and so will be able to see all the graphics\
    \ working per second, updating the collisions. Nothing moves yet, except for the\
    \ FloatLayout: everything should stay in proportion if you resize the game/window.\n\
    \nNow we have to add the mechanics. For a game like this we want to run up many\
    \ times per second, updating the widget positions and carrying out collisions\
    \ with the ball (Fig.0).\n\nThe Clock can schedule any function at intervals once\
    \ or repeatedly. A function updates the time since its last call dt we've passed\
    \ through to the ball and the player via events we created in language.\n\nAt\
    \ this point we have added the first steps to handle keyboard input, by pressing\
    \ the window to call a Method of the Player every a key is pressed. We can then\
    \ turn off the Player class by adding this key handler with touch/mouse input.\n\
    \n```\nclass Player(Widget):\n    def on_down(self, touch):\n        self.direction\
    \ = 'right' if touch.x > self.parent.width/2 else 'left'\n        self.center_x\
    \ =\n```\n\n```\nclass Ball(Widget):\n    def on_down(self, touch):\n        self.direction\
    \ = 'none'\n```\n\n```\ndef on_key_down(self, key, keyargs):\n    if key == 'right':\n\
    \        self.direction = 'right'\n    elif key == 'left':\n        self.direction\
    \ = 'left'\n    self.direction = 'none'\n```\n\n```\ndef update(self, dt):\n \
    \   self.dir_dict = {'right': 1, 'left': -1}\n```\n\n58 The Python Book"
