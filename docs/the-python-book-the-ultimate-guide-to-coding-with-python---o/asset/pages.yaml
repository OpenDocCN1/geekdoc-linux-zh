    > "A classic example of using ''with'' is when dealing with files. The best part
    of doing this is that the file will automatically closed when the block is exited,
    regardless of the reason"


    # 33 Memoryview


    Sometimes you need to access the raw data of some object, which is a buffer of
    bytes. You can copy this data into a tuple, but for example, this might not be
    optimal for large objects. The command ''memoryview()'' wraps an object and allows
    access to its internal data without copying. It accesses elements one at a time.
    In many cases, the elements are one byte. But, you can find out the size of an
    element in bytes with the property ''itemsize''. Once you have your memoryview
    created, you can access the individual elements you would get from a list (item,
    view, for example).


    # 30 Summing items


    Above, we saw the general reduction function. A specific type of reduction operation,
    summation, is common enough to mention. You can use the command ''sum(iterable_object)''.
    You can include a second parameter that will provide a starting value.'
