    Driving LEDs in an efficient fashion is a science of its own. The common availability
    of single-board computers has put the necessary technology within reach of everyone.


    When dealing with LED displays, different systems must be considered. We will
    focus on traditional methods, made up of one or more. Their affordable nature
    makes them ideally suited to classic display applications; they mimic currency
    prices, provide stock-broker updates from the internet, even been used as basic
    displays for primitive oscillators.


    Finally, we will provide an overview of electronic basics. This tutorial is a
    bit more advanced than the ones we usually run in this section of the magazine,
    and it is worth noting that we''re going to be programming with C rather than
    Python. Following the code listing above:


    +   01 Think about LEDs

    Standard LEDs are primitive - they light up current flows through them. Driving
    a few LEDs is as easy as connecting to GPIO pins with a resistor. Sadly, this
    method becomes wasteful once more than a few of them involved - driving LEDs requires
    up to 18 pins.


    +   02 Arrange your diodes

    were wired to reduce the number of pins needed. Matrix-based systems are resilient
    to individual failures, and provide a pin-to-LED ratio of n/2. The following step
    shows a 16x16 LED matrix which is made according to Figure A. Since LEDs current
    in one direction, you can enable a single LED by bringing the corresponding high
    and low.


