    \ copies the metadata.\nsymtree(src, dst,links=False,ignore=None): This is similar\
    \ to 'cp -r' - it allows you to copy an entire directory.\nignore_patterns(*patterns):\
    \ ignore is a function that can be used to filter out files and directories by\
    \ the global-style pattern.\nrmtree(path, onerror=None): rmtree(path) is used\
    \ to delete an entire directory tree.\nmove(src,dst): move(src,dst) allows you\
