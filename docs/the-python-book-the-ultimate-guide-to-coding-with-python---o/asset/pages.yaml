    # ## About NumPy


    Despite its simple name, NumPy is a powerful Python package that is mainly for
    working with arrays and matrices. There are many ways to create an array and the
    simplest is by using array().


    ```

    one = array([1,2,3,4])

    ```


    The aforementioned command creates a one-dimensional array. If you want to create
    a two-dimensional array, you can use the array() function:


    ```

    two = array([[1,2,3],

    [3,4,5],

    [-1,0,1]])

    ```


    You can also create arrays with more dimensions.


    # ## Making simple calculations


    Given an array myArray, you can find the minimum and maximum values in it by executing
    the following commands:


    ```

    myArray.min()

    myArray.max()

    ```


    Should you wish to find the value of all array elements, run the next command:


    ```

    myArray.mean()

    ```


    Similarly, you can find the median of an array by running the following command:


    ```

    median(myArray)

    ```


    The median value of a set is an element that divides the set into two subsets
    (left and right) with the same number of elements. If the set has an odd number
    of elements, the median is the part of the data. On the other hand, if the set
    has an even number of elements, the median value is the average of the two centre
    elements of the sorted data.


