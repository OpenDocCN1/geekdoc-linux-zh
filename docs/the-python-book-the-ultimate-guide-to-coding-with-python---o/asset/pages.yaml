  md: "# # Python essentials\n\n```\nclass Ball(Widget):\n    def update(self, dt):\n\
    \        self.pos_hint_x.x += self.velocity[0] * dt\n        self.pos_hint_y.y\
    \ += self.velocity[1] * dt\n        if self.right > self.parent.right:\n     \
    \       self.velocity[0] *= -1\n        if self.left < 0:\n            self.velocity[0]\
    \ *= -1\n        if self.top > self.parent.top:\n            self.velocity[1]\
    \ *= -1\n        if self.bottom < 0:\n            self.velocity[1] *= -1\n   \
    \     if self.y > self.parent.y:\n            self.parent.lose() # Not Implemented\n\
    \            self.bounce_from_player(self.player)\n\n    def bounce_from_player(self,\
    \ player):\n        if self.collide_widget(player):\n            self.velocity[0]\
    \ = -self.velocity[0]\n            self.velocity[1] = (\n                0.1 *\
