  md: '# Create with Python


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_108_0.png)


    # Kivy with all the tools needed to use kv language


    As before, the syntax defines a rule for how a GridEntry widget should be constructed,
    by setting the ''font_size'' property that changes the size of the text in the
    label. The entry automatically references the button it will be linked to and
    will create a binding to this relationship when a ''GridEntry'' widget changes;
    its ''font_size'' will change to match it perfectly. We have made this change
    not in Python (instead of the ''bind'' method used later), but by referencing
    the property in the kv language.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_108_1.png)


    A tic-toe-grid now accepting any widgets to fit adding an O or X alternatively


    automatically manages any widgets nicely with as many rows as necessary. Tic-toe-grid
    requires a simple language for making rules


    Here we introduce the Kivy language (kd), a simple language that removes a lot
    of boilerplate code for manipulating Kivy widgets. It is like HTML for JavaScript.
    Kivy gives us the dynamic power to do anything, but with that power comes the
    difficulty of writing a GUI. While you don''t need Kivy language, you can do the
    same thing in Python alone,


    Let''s look at how ''GridEntry'' widgets (Fig.01) introduces new concepts. When
    we instantiated our ''GridEntry'' widgets, we used the ''coords'' property by
    simply passing it as a kwarg. A minor feature that is automatically handled by
    Kivy property.


    Kivy comes with all the tools you need to use kv language; the simplest way is
    to write it in a file with a name matching your App class.


    We will use the ''bind'' method to catch the grid''s ''button'' method which the
    ''GridEntry'' dispatches on a release event. It will occur when a user presses,
    then the ''GridEntry'' is bound to ''bind_press'', which is dispatched when the
    first click, or to any Kivy property which is dispatched whenever the property
    changes.


    We added ''GridEntry'' widget to our ''grid'' using the ''add_widget'' method.
    This is how it works, and so it will automatically arrange them into a grid with
    the number of columns we set earlier.


    forming, a rule for the TicTacToeGrid by declaring that entry TicTacToeGrid instantiated
    set cols to 3.


    We''ll use more Kivy features later, but for now Python to create the widgets
    that will be in our root


    ```

    from kivy.properties import ListProperty


    class Grid(ListProperty):

    ```


    This is how Kivy''s ''Button'' widget, dispatches events when we touch it. We
    can hook these events to our call when a user presses a button, and can set the


    TicTacToeGrid:


    ```

    cols: 3 # of columns

    ```


    This is the basic syntax of kv language that we make a rule defining it its behavior,
    including its properties and adding child widgets. This example demonstrates


    As with the TicTacToeGrid, we''ll style our class with kv language, but we will
    show a more interesting feature:


    ```

    GridEntry:

    font_size: self.height

    ```


    Python Book 109'
