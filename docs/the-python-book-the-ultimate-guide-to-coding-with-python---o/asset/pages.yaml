  md: '# Web development


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_136_0.png)


    Thanks to the introduction of the Web Server Gateway Interface (WSGI) in 2003,
    developing Python apps for general web servers became a viable solution as opposed
    to reinventing them.


    Apple''s implementation of it differs greatly from the official release. Installing
    Homebrew helps you keep up to date and also means you get the Python package up
    to date.


    Python executables and installers are widely available from the official Python
    site at https://www.python.org.


    Many developers can also benefit from using Homebrew to install and manage their
    versions. While OS X comes bundled with Python, it has potential drawbacks. Updating
    it helps clear out any downloaded packages,


    Once Python is installed the first package to download should be virtualenv (''pip
    install virtualenv''), which allows you to create and run projects on separate
    versions of Python with project-specific packages installed.


    Check out the Hitchhiker''s Guide to Python for more information: docs.python.org/en/latest/


    # # Frameworks


    Let''s take a look at some of the frameworks available when developing Python
    applications


    # ## Django djangoproject.com


    GOOD FOR: Large database-driven web apps with multiuser and sites that need to
    have heavily complicated admin interfaces.


    Django contains plenty of features, all in the framework and modules. This includes
    securing, admin interfaces and database management tools, by default and applications.
    Django will help enable rapid application development for enterprise-level projects,
    while also enabling a clear modular approach to using subapplications.


    # ## Flask flask.pococoo


    GOOD FOR: Creating full-featured REST APIs. Its ability to manage multiple routes
    and methods is very powerful


    Flask''s aim is to be a set of comfy components used as URL routing and templates.
    Flask will also work on controlling the request and response objects, all-in-all
    means it is lightweight but still powerful framework.


    # ## Werkzeug werkzeug.pococoo


    GOOD FOR: API creation, interacting with databases and following strict URL routes
    whilst managing HTTP utilize


    Werkzeug is the underlying framework for Flask and other Python frameworks. It
    provides a unique set of tools that enable you to perform URL routing processes
    as well as request and response objects, and it includes a powerful debugger.


    # ## Pyramid pylonproject.com


    GOOD FOR: Highly extensible and adaptable to any project requirement. A lightweight
    system either


    Heavily focused on documentation, Pyramid brings all the much needed support for
    most regular tasks. Pyramid is open source and provides a great deal of extensibility
    - it comes with the powerful Werkzeug debugger.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_136_1.png)


    # Flask is Fun


    Flask is a microframework for Python built on Werkzeug, Jinja2 and good intentions.
    And before you ask: it''s BSD licensed!


    overview: docs // community // snippets // extensions


    Latest Version: 0.1.0


    ```

    from flask import Flask

    app = Flask(__name__)

    ```


    The Python Book 137'
