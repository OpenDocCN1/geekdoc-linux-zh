    # 03 Testing Pivaders


    With Python installed and the project cloned to your machine — simply also find
    the zip on FileSilo – unpack and copy it to your home directory. You can then
    take a look to make sure everything is set up properly. Now you need to run python
    pivaders from within the terminal you opened. You can start the game with the
    space bar, but then simply and use the left and right arrows to move your player
    right.


    you can''t regain individual items within them. For constants, which aren''t designed
    to change anything,

    nYou could, for example, have a class that mimics a dog and barks! They''ll be
    different in many ways, but they have both fur and fury like the same parent.
    You could do exactly that with your Ammo class, using it to create the player
    bullets and all the missiles. They are different but fundamentally one and the
    same. This saves us creating unnecessary constants and ensures better objects
    we create.


    # 04 Classes – part 1


    A class is a blueprint for an object you''d like to make. In the case of our player,
    it contains all the required info, from which you can make instances. We created
    the instance in the class _player_ halfway through the project. The great thing
    about the classes in Pivaders is that you can create different types of enemies
    and shortshots from Pivaders'' game. They are created, from pivaders.py, inherit
    from the Sprite class. You can read here to learn more about the Sprite class
    via


    # 04 Creating your own class


    Once you''ve racked up a high score (anything over 2000 points is respectable
    and we are interested in improving our game), you might want to add some enemies.
    If you want to create a new project, create a new project and use either IDLE
    or Leah for the pivaders.py file (also create and save it as pivaders).


    # 07 Classes – part 2


    In Pivaders, creating different types of enemies is quite simple since they are
    similar variables — the class object (an alien, or a bullet). All of the enemies
    have an _update method apart from the Block class (which is a function within
    a class). The (update) method is called in the main loop (which we called main_loop)
    and asks the object to move. In the case of a bullet it moves down the screen.
    If it goes off the screen, we destroy it (since we don''t need it anymore).


    # 05 Global variables & tuples


    Once we''ve implemented the modules we need, for the project; there''s quite a
    long list of variables that we need global. These variables are constants (or
    tuples). They are important because they never change — they represent things
    like the colours, block sizes and resolution. You''ll also need that colours and
    sizes stored in lists — or tuples. We use square brackets to make them lists,
    but we use tuples here since they''re immutable,


    # 09 The game


    The class is called Game. This is where the main function of the game it comes
    in, but it''s just a list of things — nothing actually creates a Game object until
    the line at the bottom of the code. This is the central control of the game, so
    we initialize the Sprite, our imagery for protagonist and extraterrestrial enemies
    and create GameStates. We use this to control aspects of the game, like the player''s
    movement and deciding if we need to start the game, among others.


    # 10 The main loop


    There are a lot of methods (functions) in the Game class, and each is designed
    to control a particular aspect of the game itself. The actual logic that controls
    what happens during one frame of the game (main_loop) at the method of the pivaders.py
    script is the key to unlocking what comes next. We need to write and binding line
    by line down to this list, so we can see what''s being made every 20 seconds when
    you''re playing the game.


    # 11 Main loop – part 1


    Firstly the game loop checks if the end_game attribute is false. If so, it enters
    the main loop (main_loop) and is flagged to go straight to pygame.quit(), exiting
    the game. This is set to happen only if the player closes the game window or presses
    the key. If start_game is true, the main loop can start with the (control) method,
    which checks if to see the location of the player. We need to update every enemy
    and every bullet that can be created. We use the (update) method for each one
    and actor using a simple loop. This loop makes every screen update up to date
    before we check collisions in calc_loop.


    # 12 Main loop – part 2


    Once objects have been created, we check if the game is still to continue. We
    do so with with(dead) and (defenses_broken) — if these methods return true, we
    return to the start screen. Otherwise, we also need to see if we have killed all
    the aliens, from within win_loop. While not dead, the aliens are still alive and
    can increase their speed across the screen. Finally, we refresh the screen so
    that what''s been moved, shot or can be updated or removed from the screen. Remember,
    the main loop happens 20 times — so the time we wait for the screen call to update
    right at the end of the loop is of no consequence.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_117_0.png)


    We used only available open-source art and fonts to make the game


    # 08 Ammo – class


    What''s most important is that you can use one class to create lots of different
    things.'
