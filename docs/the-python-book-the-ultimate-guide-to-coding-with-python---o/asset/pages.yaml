  md: '# Use Python with Pi


    The Model A has the Pi-camera connector next to the Ethernet port, as does the
    Model B. The B+ and the Raspberry Pi 2, the connector is in a similar position,
    but it is a little further from the Ethernet port, audio-out and HDMI ports.


    Connecting the camera module can be tricky. Begin with taking your Pi out of its
    case remove the top and disconnect all cables. Take precautions before removing
    the device from your antistatic bag, as the camera module is very sensitive to
    electricity.


    Align the plastic catch on the camera connector and slot the camera module flex
    into with the shiny contacts facing away from the Ethernet port. Once the flex
    is fully slotted, push the plastic catch back into place.


    # 04 Test your Pi camera module


    After connecting the Pi camera, check that it works by booting the Raspberry Pi
    (I assume you''re running Raspberrybian) and entering this in the command line:


    ```

    rasppi-config

    ```


    With the keyboard, move down to open the following screen: Hit ''Enable Camera'',
    and tap Enter. If you''re not already signed into the GUI, do so (if you''re in
    the command line interface, enter start to launch the desktop view). Reboot and:


    ```

    raspill -o image.jpg

    ```


    You can review the resulting image in your Home directory.


    # 05 Straighten the image


    With the Pi camera up and running, you may notice that it''s outputting the image
    with the axes flipped. We can fix this using Python, open the terminal and enter:


    ```

    sudo apt-get install python-picamamera python-pic3

    ```


    ```

    sudo idle3

    ```


    In the Python Editor, open FileNew and enter the following code, camera.flip =
    True or False as needed. Save as ''camflip.py'', then press F5 to run the script
    and view the correctly output image.


    To save time, you might try rotating your Pi camera module:


    ```

    import picamera

    from time import sleep

    ```


    ```

    with picamera.Camera() as camera:

    camera.flip = True

    camera.start_preview()

    sleep(1)

    camera.capture(''/home/pi/image2.jpg'')

    camera.stop_preview()

    ```


    # 06 Set up the breadboard and button


    We have two ways to add a button to the Raspberry Pi, but before proceeding, you
    have switched the computer off and disconnected it from the mains. You should
    also disconnect any cables and wires from the breadboard.


    Adding a button is easy with a solder-free breadboard and a male single-state
    pushbutton. Connect the button to the breadboard with male-female wires running
    to GPIO pins GND and 17. With a script designed to detect action from the button
    on the GPIO, frame of your animation can be captured with a single button push.


