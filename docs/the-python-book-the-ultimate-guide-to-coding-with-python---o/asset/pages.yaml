  md: '# # Create a two-step authentication with Twilio


    Increase security in access to your web services by building a simple two-step
    authentication with Twilio’s SMS APIs to help you


    # Resources


    +   - Python 2.7+

    - Flask 0.10.0](https://github.com/pallets/flask)

    - Flask-RESTful](https://github.com/mitmiko/flask-restful)

    - A Twilio account

    - Twilio’s Python API Library](https://github.com/twilio/twilio-python)

    - MySQLDB](http://python.sqlalchemy.org/)


    Telephony is one of the most versatile technologies in our households. Despite
    being invented over 100 years ago, the basic infrastructure that once carried
    voices now manages to deliver rich media content at incredible speeds. As is with
    wonderful things, they can also be complicated. Phones are now more part of our
    daily lives than ever. So, what can we do with some variety of technology?

    Well, why use an API? Twilio has created a RESTful API that removes a deal of
    complexity of telephony so that we can write apps and services that are able to
    deliver calls and texts using various endpoints and services. In this tutorial,
    we are going to use Flask to help us create the authentication system for logging
    into service. We are also going to use Flask to create our routes and generate
    our pages, but of Flask’s detail will be covered here.


    # 01 Get a Twilio account and phone number


    Signing up to Twilio is pretty easy. First, head over to http://twilio.com and
    sign-up process. At this point, the process doesn''t really differ from any other
    service, but after you’ve entered an email address and phone number, given the
    nature of Twilio API, it makes sense to ask them to confirm that you’re human,
    by sending them a text to confirm. Hey, a two-step authentication is exactly what
    we’re working towards.


    You can enter any time you like, as it is a condition to confirm, but at this
    point we are authenticating using a phone that can receive SMS. Once confirmed,
    you’ll receive a text on your phone - enter it and you’ll be presented with a
    Twilio phone number. This is your Twilio phone number and what we are using to
    send and receive our authentication texts.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_111_0.png)


    The Twilio interface is kept nice and simple—no unnecessary complications here


    # 02 Add credit


    Twilio is free to try, although it is inexpensive. To continue, you need to add
    a card and some funds to your trial account. Created on the page of the dashboard,
    you’ll see a big deal asking to upgrade your trial account; follow the instructions
    on how to add the amount of credit you would like to use. The minimum amount of
    $20 (USD) will be more than plenty for this and other projects. Once that’s done,
    you’re almost ready to start sending messages—but first head back over the dashboard
    and configure your account SID and auth to take down somewhere, you’ll need a
    little later.'
