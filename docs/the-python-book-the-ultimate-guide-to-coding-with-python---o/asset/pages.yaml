  md: "# # Python essentials\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_67_0.png)\n\
    \n# ## Built-in modules\n\n# ### 23. Do-while loops\n\nSince Python has no do-while\
    \ or do-until loop (yet), you can use the following method to mimic their results:\n\
    \n```\n```python\nTrue:\n    do_something()\n    if condition:\n        break\n\
    ```\n```\n\n# ### 19. Executing functions at the time of Python interpreter\n\n\
    You can use \"eval() to execute functions at the time of Python interpreter.\n\
    \nExample:\n\n```\n```python\ndef sum():\n    print(4+5)\ndef message():\n   \
    \ print(\"Executing Now\")\nimport atexit\natexit.register(sum)\natexit.register(message)\n\
    ```\n```\n\nOutput:\n\n```\n```text\nExecuting Now\n```\n```\n\n# ### 24. Detecting\
    \ system platform\n\nTo use platform-specific functions, it is useful to detect\
    \ the platform on the Python interpreter is running. Use the current platform.\n\
    \nExample:\n\n```\n```python\nimport sys\nprint(sys.platform)\n# On MacOS Linux\n\
    print(sys.os.release)\n```\n```\n\n# ### 28. Fractional numbers\n\nsum() returns\
    \ the sum of all elements in the list. It accepts an optional second argument:\
    \ the value to start with when summing (defaults to 0).\n\nFraction can be created\
    \ using the following constructor:\n\n```\n```python\nFraction(numerator, denominator)\n\
    ```\n```\n\n# ### 29. Math operations\n\nThe math module provides a plethora of\
    \ mathematical functions. These functions work on integer and float numbers. For\
    \ complex numbers, use cmath module.\n\nExample:\n\n```\n```python\nmath.acos(x)\
    \ : Returns the cosine of x.\nmath.factorial(x) : Returns factorial.\n```\n```\n\
    \n# ### 20. Converting to hex, binary, and oct\n\nPython provides easy-to-use\
    \ functions to convert integers to hex, binary, and octal format.\n\nExample:\n\
    \n```\n```python\nbin(24)\nhex(24)\noct(24)\n```\n```\n\n# ### 25. Disabling and\
    \ enabling garbage collection\n\nSometimes you may want to enable or disable the\
    \ garbage collector. Use the 'gc' module to enable or disable garbage collection.\n\
    \nExample:\n\n```\n```python\ng.enable()\ng.disable()\ng.collect()\ng.disable_garbage_collection()\n\
    ```\n```\n\n# ### 21. Converting string to UTF-8\n\nYou can use the following\
    \ function to convert any string to UTF-8.\n\n```\n```python\n.encode('utf-8')\n\
    ```\n```\n\n# ### 22. Removing duplicates from list\n\nIf you want to remove duplicates\
    \ from a list, just convert it to a dict by using 'dict()' and then return the\
    \ dict keys.\n\n```\n```python\nfrom operator import itemgetter\ndef dupe(list):\n\
    \    d = dict((x, i) for i, x in enumerate(list))\n    return list(d.keys())\n\
    ```\n```\n\n# ### 26. Using C-style lists for better performance\n\nMany Python\
    \ lists have overhead. Using these lists will provide a significant performance\
    \ boost in complex applications.\n\nExample:\n\n```\n```python\nfrom collections\
    \ import Counter\nc = Counter(string)\n```\n```\n\n# ### 37. Calculating maximum\
    \ and minimum out of any list or iterable\n\nYou can use the following functions\
    \ to find the largest element in a list:\n\n```\n```python\nmax = max(list)\n\
    min = min(list)\n```\n```\n\n# ### 30. Working with arrays\n\nThe 'array' module\
    \ provides an efficient way to use arrays in your programs. The 'array' module\
    \ defines:\n\n```\n```python\nimport array\na = array.array('i', initializer)\n\
    ```\n```\n\nOnce you have created an array, you can insert, delete, and access\
    \ elements of it. Here are some methods:\n\n```\n```python\narray.count(x) : Returns\
    \ the number of occurrences of x in array.\narray.index(x) : Returns the index.\n\
    array.reverse() : Reverse the order of the array.\n```\n```\n\n# ### 31. Sorting\
    \ items\n\nThe 'bisect' module allows you to keep lists in order. You can use\
