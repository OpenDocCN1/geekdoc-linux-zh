  md: "# Django application development\n\nDjango is a full Python web-app framework\
    \ with impressive command-line tools\n\n# Installing Django\n\nThe installation\
    \ of Django is relatively easy once you have python installed. See for how we\
    \ build a simple app here\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_139_0.png)\n\
    \n# Database models & migration\n\nDjango's ability to manage the migration and\
    \ maintenance of database schema and project is very impressive\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_139_1.png)\n\
    \n# 03 Create Core Project\n\nDjango install some incredibly useful command-line\
    \ tools, which will help you to run a number of repetitive and difficult tasks.\
    \ Use one of them to create a fresh project structure for you. Run the admin.py\
    \ script with the name of the project you created.\n\n```\ndjango-admin.py startproject\
    \ myproject\n```\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_139_2.png)\n\n# 01\
    \ Generate the model\n\nOpen blog.py and create the first model class, naming\
    \ the properties and fields for each. Use django.db.models for field types. Once\
    \ complete, open settings.py and add the block to the list of installed applications\
    \ so that your project will load.\n\n```\n# models.py\nclass Post(models):\n \
    \   title = models.CharField(max_length=200)\n    text = models.TextField()\n\n\
    INSTALLED_APPS = ['django.contrib.admin', 'django.staticfiles']\n```\n\n# 04 Initial\
    \ Migration\n\nNavigate into the project directory where the terminal is. Use\
    \ the apps included in the project to create database tables. Run the manager\
    \ to create all of them. Django will keep you informed of your progress and what\
    \ has been applied from the migration.\n\n# 02 Data Migration\n\nAny changes to\
    \ models or data need to be migrated. So we need to make migrations from the model\
    \ data, which sequentially generates files. Run the migration to generate the\
    \ requested SQL, and then the command performs the database execution.\n\n# 01\
    \ Create Virtual Environment\n\nCreate a new environment for your project using\
    \ a Virtualenv. Create a new environment for project, opting to use the latest\
    \ Python 3. Your Python location may be vary, so set the correct path for the\
    \ python binary.\n\n# 02 Activate and Install\n\nUsing your Terminal to start\
    \ the project-specific shell, Virtualenv has a local version of Python. Once your\
    \ pip package manager is installed, run the command to install Django.\n\n+  \
    \ - venv/bin/activate\npip install Django\n\n# 05 Create App\n\nEach Django project\
    \ should have at least one app or module. Run the startup command to create a\
    \ new app module, which will require the code adjust to the main project structure.\n\
    \n```\npython manage.py startapp blog\npython manage.py makemigrations\npython\
    \ manage.py migrate\n```"
