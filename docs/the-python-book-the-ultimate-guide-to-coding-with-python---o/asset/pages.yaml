    \ to show when you've won! We'll need to add some code to check if the game ended.\n\
    \nKivy properties have other useful features, where they change automatically.\
    \ We can create an 'on_status' method if needed and dispatch an event in the Kivy\
    \ event system. It is very easy to write code that triggers when a property changes\
    \ both in Python and Kivy as language. We can use this to check the status list\
    \ every time\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_109_0.png)\n\nThe game\
    \ with some additions, making the grid square and extending the interface\n\n\
    it is updated, doing something special if a player has filled a row, column, or\
