  md: '# Get started with Python


    # Variables and data types


    Let''s get in, and what better way than the programmer''s first friend, the "Hello
    World! start by opening a terminal. Your current working directory will be your
    home directory. It''s probably good to make a directory for the first project
    you will be creating, rather than having them lose in your home directory. Create
    a directory called python using the command mkdir python.


    The next step is to create an empty file using the command touch hello.py. Our
    expert used the touch command followed by the filename. Making files is easy,
    and the most important part is writing the code inside hello.py. We will do this
    with the command echo >> hello.py. Now that we have set up, we can open it in
    any editor of our choice. Geist is an editor with syntax highlighting that should
    be available on your distribution. You''ll be able to install it using your package
    manager if you don''t have it already.


    A variable is a name in source code that is associated with an area that you can
    use to store data, which is then called upon throughout the code. The data can
    be one of many types, including:


    | Integer | Stores numbers |

    | Float | Stores decimal numbers |

    | Boolean | Can have a value of True or False |

    | String | Stores a collection of characters, "Hello World" is a string |


    As well as many types, there are sequences (technically, a sequence is a base
    type but some of us we''ve classed it as a main data type):


    Our Hello World program only needs two lines. The first line begins with a #shebang
    (the symbol # is also known as a hashtag) followed by the path to the Python interpreter.
    The second line uses the print function to output Hello World to the screen. These
    lines need to be indented. If you''re running this in an IDE, you don''t necessarily
    need to do this.


    | List | Contains a collection of data in a specific order |

    | Tuple | Contains a collection immutable data in a specific order |


    A tuple would be like a coordinate, containing an x and y value as a single variable,
    whereas a list is typically used to store larger collections. The data in a tuple
    is immutable because you''re not able to change values of elements in a tuple.
    In contrast, you can add, remove, or change elements in a list.


    You save the changes you''ve made to the file by using the combination Ctrl+S,
    followed by Enter. Use Ctrl+S


    It is also useful to know how Python''s dictionary works. A dictionary is a mapped
    type. It stores data in key-value pairs. You can access elements in the dictionary
    by that value''s key, which is how you would want to do it with a list. In a list,
    you access an element by its list''s index (a number).


    ```

    #!/usr/bin/python2

    print("Hello World")

    ```


    To run the Hello World program by predicting

    /hello.world.py - in this case you type:


    ```

    [liamhello@python~$] ./hello.world.py

    Hello World

    ```


    > A variable is in source code that is associated with an area in memory that
    you use to store data


    Let''s work on a program to demonstrate how to use variables and data types. It''s
    worth noting that the variables and data types are dynamic in Python. Feel free
    to create this in any editor you like. Everything will work as long as you remember
    to make the file executable. We''re going out calls variables.


    If you were using a graphical editor as that, you would have to do the last step
    of making the file executable. You only have to mark the file as executable. Then
    you can freely edit the file once it is executable.


    # Interpreted vs compiled languages


    An interpreted language like Python is one where the source code is compiled to
    machine code and executed each line by line. Unlike compiled languages where the
    source code is only compiled to machine code once - the resulting machine executes
    each line run.'
