    # # Functions and variable scope


    Functions are used in programming to break down into smaller chunks. This makes
    code much easier to read. Functions can have variables reassigned in certain ways.
    In Python arguments are passed by value, which means that a copy of the variable
    is passed to the function that is only valid in the scope of the function. Changes
    made to the original variable inside the function will be discarded. Functions
    can also return values, so this isn''t an issue. Variables are defined with the
    local keyword. Any variables that can be passed out in the brackets of the function
    name. Multiple variables are separated by commas. The names given to the variables
    in these brackets are the ones


    that they have in the scope of the function, regardless of what the variable that
    was passed to the function called. Let''s see the output from the program opposite
    is as follows:


    > "Functions are used in programming to break processes down"


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_13_0.png)


    ```

    #!/usr/bin/env python 2

    # Below is a function called modify_string, which accepts a variable

    # that will be called original in the scope of the function. Anything

    # indented with 4 spaces under the function definition is in the

    # scope:

    def modify_string(original):

    original += " that has been modified."

    # At the moment, the local copy of this string has been modifiedndef modify_string_return(original):

    original += " that has been modified."

    # However, we can return our local copy to the caller. The function

    # ends as the return statement is used, regardless of where it

    # is in the function.

    return original

    ```


    We are now outside of the function, and the modified string has changed, as we
    have reduced the level of indentation


    ```

    test_string = "This is a test string"

    modify_string(test_string)

    print(test_string)

    ```


    The string won''t be changed in this code


    ```

    test_string = modify_string_return(test_string)

    print(test_string)

    ```


    # The function''s return value is stored in the variable test_string,

    # overwriting the original and therefore changing the value that is

    # printed.


