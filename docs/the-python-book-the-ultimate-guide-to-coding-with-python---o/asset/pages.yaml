    \ Its function is described in the Figure B on the next page.\n\n# 04 Separate\
    \ concerns\n\nChip two has many of 74HC24, which outputs as an octal buffer with\
    \ tri-state capability. Outputs can physically disconnect them from the bus line.\
    \ This permits you to output terminals without fear of short-circuiting as all\
    \ one chip can be in tri-state mode, no current can flow between high and low\
    \ outputs.\n\n# 05 Round up them pins\n\nFour GPIO pins enable the display. Three\
    \ pins configure the architecture from which is, while the signal emitted from\
    \ the fourth pin is connected to the active. This ensures that only one is active.\
