    \ references to them. One example of this is the lambda expression. With this,\
    \ you can create an anonymous function. This also you functional programming techniques\
    \ with Python. The lambda expression is useful; for example, you could create\
    \ your own function to square using 'lambda x: x**x'. You then have a function\
    \ that practically creates new functions and returns them. With this capability,\
    \ you can create function generators that have self-modifying properties. The\
    \ only limitation is that they are limited to a single expression, so you can't\
    \ generate complex functions.\n\n# 45 Compiling objects\n\nPython is an interpreted\
    \ language, which means that the source code that you write needs to be compiled\
    \ into a byte code. This byte code then gets fed into the actual Python engine\
    \ to speed things up. Within your program, you have the need to take control over\
    \ the process of converting to code and returning the results. You might want\
    \ to build your own interpreter. The 'compile' command takes a string and returns\
    \ a collection of Python code, and an object that represents a byte translation\
    \ of this code. This new object can then be handed to either 'eval()' or 'exec()'\
    \ to be executed. You can use the parameter 'mode' to tell what kind of code is\
    \ being compiled. The 'single' mode is for a single expression and 'eval' is a\
    \ single expression\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_22_0.png)\n\n\
    # 46 init_method\n\nWhen you create a new class, you can include a private method\
    \ that gets called when a new instance of the class is created. This method is\
    \ useful when the new object needs some data loaded in it\n\n# 47 del_method\n\
    \nWhen an object is about to be destroyed, the '__del__' method is called. This\
    \ gives you the opportunity to release any resources that may be required. This\
    \ might be closing files, or disconnecting connections. This object is finally\
    \ destroyed and resources are freed.\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_22_1.png)\n\
    \n# 48 Exiting your program\n\nThere are two ways to exit the Python interpreter:\
    \ 'exit()' and 'sys.exit()'. The latter takes an optional parameter which sets\
    \ the exit code for the program. The first is better to use when exiting your\
    \ program from the main module ('sys.exit()').\n\n# 49 Return values\n\nEvery\
    \ function returns a value to the calling function. Because everything in Python\
    \ is an object, functions have types. Use the 'return' command to return any object\
    \ to the caller.\n\n![](img/3c5b3591dd9ac4cceb489cee11bd7908_22_2.png)\n\n# 50\
    \ String concatenation\n\nWe will finish with what most lists - string concatenation.\
    \ The easiest way to join strings is using the '+' operator. If you want to include\
    \ other items, like numbers, you can use the 'str()' casting to convert it to\
    \ a string object.\n\nThe Python Book 23"
