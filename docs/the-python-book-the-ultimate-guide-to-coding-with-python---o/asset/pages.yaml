    # 02 Reloading modules


    When a module is imported first, any initialization functions are run at that
    time. This may involve creating objects, establishing connections. But this is
    only the first time during a given session. Importing the module again will not
    re-execute any of the code. If you want to have it re-run, you must use the reload
    command. The format is ''reload(modulename)''. To keep in mind is that the previous
    import is buried, unless otherwise specified. This means that if you reload the
    module, the related variables are updated correctly, but if you define a reference,
    the old one will still stick around and be accessible. There may be side effects,
    so use with caution.


    # 01 Importing modules


    The strength of Python is to be extended through modules. The first step in many
    programs is to import modules you need. The simplest import is to just call ''import''.
    In this case, functions and objects are not in the global namespace. By using
    ''from modulename as modulename'', you can shorten the ''modulename.'' to ''as''.
    You can skip this by using ''from modulename import *'' to import everything from
    the module. Then you can call provided capabilities directly. If you only need
    a few of the items, you can import them selectively by using the object attributes.


    # 03 Installing modules


    While most of what we are looking at are Python commands there are a few essential
    commands that need to be executed outside Python. Installing a module involves
    downloading the source code, and compiling any external code. Luckily, there is
    a repository of hundreds of Python modules available at http://pypi.org/. Instead
    of doing everything manually, you can install using ''pip install modulename''.
    This command is available to everyone. You may need administrator rights to install
    this new module in the global library for your computer. On a Linux machine, you
    might use the pip command with sudo. Otherwise, you can install it to your personal
    library directory by using the --user flag.


    > "Every programming language out there has a core of functionality to know to
    get useful work done. Python is no different"


    # 04 Executing a script


    Importing a module runs the code within the module file, but it does the module
    within the Python environment. This engine ensures all code is running properly.
    If you only want to execute a Python script and execute the code within your current
    session, you can use the ''exec(''filename.py'')'' command, where the main option
    is a string that points to the Python file to load. This will be loaded into the
    globals and locals of the current session. You can optionally include two extra
    parameters to the execute command. These can be used for two different sets of
    locals and a different set of globals. If you only have one dictionary, it is
    assumed to be the global dictionary. The return value of this is None.


    # 05 An enhanced shell


    The default shell is provided by the ''python'' command, and it provides an interactive
    environment to develop code. As a developer a history system is available, which
    allows you to see not only commands from the current session, but all magic commands
    you have produced while interacting with the current Python session. You can also
    peek into the memory of the Python session. You can create profiles that allow
    you to handle initialisation steps that you may need to do every time you use
    Python.


    # 06 Evaluating code


    Sometimes you may have chunks of code that need be put together programmatically.
    If these are pieces of code you can execute the result with a string ''eval_code''.
    Any syntax errors within the code will be executed within the current session,
    using the current globals and locals. You have two other parameters available
    to provide a different set of dictionaries for the globals and locals. If there
    is only one additional parameter, it will be the global dictionary. You can optionally
    handle it as a dictionary object that is created with the compile command instead
    of the code string. The return value of this is None.


    Python Book 17'
