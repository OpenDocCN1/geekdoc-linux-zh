  md: '# 02 Downloading Pygame


    Git is a version control system that helps programmers store their code and associated
    files. It doesn''t only help you retain a licence, a record of history of changes,
    but also means you can use code from many places like GitHub. To download the
    version of the project we created for this tutorial, use the command line `git
    clone` and `type`:


    ```

    git clone https://github.com/realstuff/pygame

    ```


    This will create a folder named `pygame` - inside which you can `cd pygame` and
    take a look.


    # 03 Navigating the project


    The project is laid out quite simply. Within folders you will find a licence file,
    a media folder and a second folder. The main file, `game.py`, contains the game
    logic. You will also find folders for graphics and sounds, as well as the folder
    for scores. To take a test-drive, simply simplify the players by editing `pygame/sprites/player.py`
    to see how it works.


    Use the keys to move left and right and the bar to shoot. You can quit to the
    main screen with the Esc key or exit the game window completely.


    # 04 Animation & sound


    Compared with the last tutorial, it''s now a much more dynamic. The player moves
    when you change direction and shoots when you either press the direction or lift
    your finger off the button. When you shoot an alien, the sprite


