    # # Interactive science with pyplot


    For a lot of scientific problems, you need to play with your data in an interactive
    way. The original way you would do this was to use the Matplotlib library, which
    has since been replaced by Jupyter. For those who have used a program like Mathematica
    or Maple, the interface will seem familiar. Jupyter runs by default on port 8888,
    and then will open a web browser where you can open a worksheet. Most other programs
    of this type lose calculations after the session. The order that you take steps
    matters: if you edit an earlier entry, all of the following needs to be re-executed
    manually, in order to propagate that change through the entire notebook.


    Jupyter has support for pretty printing within the notebook. You can write code
    and text blocks within the same page, which allows you to produce very educational
    material, and then actually run it and see results. Jupyter also allows you to
    embed LaTeX in text sections, so you can graph some data with code that you generated.
    It is true that the advantage is that you can always go back and see how any analysis
    was done and be reproduce any result at all.


    The ability to generate complex plots is essential


    differential equations, you can use the "integrate" section to see with code that
    they look like


    ```

    import scipy

    import scipy.integrate

    result = scipy.integrate.quad(lambda x: np.sin(x), 0, 4.5)

    ```


    Differential equations crop up in almost every scientific field. If you want to
    do some signal processing, you can use the "signal" section and the "fft" section.
    This package is de facto for anyone wanting to do any scientific processing.


    Once you have collected your data, you may need to graph it, in order to get a
    visual representation of patterns. The primary library we use for this is Matplotlib.
    If you use the graphs produced by Matplotlib you will save quite a few days. There
    are two categories of graphics: low-level and high-level. High-level functions
    let you take care of all of the mental tasks, creating a plot with just a few
    lines of code. Low-level functions give you control over almost every part of
    the plot, from drawing individual pixels to controlling how the data is drawn
    into a memory buffer. This means that you can draw graphs without any quality
