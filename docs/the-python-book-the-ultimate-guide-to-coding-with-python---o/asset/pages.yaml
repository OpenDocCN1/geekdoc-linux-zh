  md: "problem, unfortunately, as the drawing is static. When we later move the player\
    \ widget, the red rectangle stays in the same place, and the widget is invisible\
    \ when it reaches its real position.\n\nWe find that by keeping references to\
    \ our canvas and repeatedly updating its properties to track the player, but there's\
    \ an easier way to do all of this - we can use the Kivy language for drawing on\
    \ the widget canvas, which we can use to draw each of our widget shapes:\n\n```\n\
    <Player>:\ncanvas:\n  Color:\n    rgba: 1, 1, 1, 1\n  Rectangle:\n    pos: self.pos\n\
    \    size: self.size\n```\n\n```\n<Ball>:\ncanvas:\n  Color:\n    rgba: 1, 0.55,\
    \ 0\n  Rectangle:\n    pos: self.pos\n    size: self.size\n```\n\n```\n<Block>:\n\
    canvas:\n  Color:\n    rgba: self.colour\n  # A property we defined before\n \
    \ Rectangle:\n    pos: self.pos\n    size: self.size\n  Rectangle:\n    rgba:\
    \ 0.1, 0.1, 0.1\n    self: self,\n    size: self.width,height: self.height\n```\n\
    \nThe canvas is special, unless we can draw instructions like this. Don't get\
    \ confused - canvas is not a widget or graphics instructions like Like. This kind\
    \ of instructions that is unique to the canvas. All instructions have different.\
    \ To set the pos and size of the canvas, you can check the Kivy documentation\
    \ for all the possibilities. The biggest advantage is that although we define\
    \ all canvas instructions, Kivy language is able to detect what properties we\
    \ have referred to and automatically track them, so when the widget moves or is\
    \ resized the canvas moves to follow:\n\n# Once you have the basic techniques,\
    \ you aren't limited to one app... your imagination is the only limit\n\n```\n\
    from kivy.app import App\nfrom kivy.uix.floatlayout import FloatLayout\nfrom kivy.uix.modalview\
    \ import ModalView\n\nclass Layout(FloatLayout):\n    __version__ = '0.1' # Used\
    \ during Android collision\nclass BreakoutApp(App):\n    pass\n\nBreakoutApp().run()\n\
    ```\n\nFig. 01\n\n```\nfrom kivy.properties import ListProperty, NumericProperty,\
    \ StringProperty\n\nclass Game(FloatLayout):\n    blocks = ListProperty([]) #\
    \ Will contain everything\n    player = ObjectProperty() # The player instance\n\
    ball = ObjectProperty() # The game's instance\n\nclass Player(Widget):\n    #\
    \ A moving player\n    position = NumericProperty(0.5)\n    direction = StringProperty(none)\n\
    \nclass Ball(Widget):\n    # A bouncing ball\n    pos_hint = NumericProperty()\
    \ # For horizontal positioning, seeing below\n    pos_y = NumericProperty(0)\n\
    \    size = NumericProperty(0)\n    velocity = NumericProperty(())\n\nclass Block(Widget):\n\
    \    # Each coloured block\n    colour = ListProperty((1, 0, 0))\n```\n\nFig.\
    \ 02\n\n```\nfrom kivy.graphics.context import Color\nfrom kivy.graphics.instructions\
    \ import Rectangle\n\nclass Player(Widget):\n    def __init__(self, **kwargs):\n\
    \        super(Player, self).__init__(**kwargs)\n        with self.canvas:\n \
    \           Color(0, 0, 1) # r, g, b, a\n            Rectangle(pos=self.pos, size=self.size)\n\
    \    # or without the syntax, self.canvas.add((..))\n```\n\nFig. 03"
