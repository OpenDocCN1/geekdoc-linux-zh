  md: '![](img/3c5b3591dd9ac4cceb489cee11bd7908_65_0.png)


    Python is a programming language that works for you more quickly and integrate
    your systems more effectively. Today, Python is one of the most popular programming
    languages in the open source space. Look around and you will find it running everywhere,
    from various configuration tools to XML parsing. Here is the collection of 50
    gems to make your Python experience worthwhile...


    # Basics


    +   1. Running Python scripts

    On most of the UNIX systems, you can run

    $ python myprog.py


    +   2. Running Python programs from Python interpreter

    The Python interactive interpreter makes it easy to try your first steps in programming
    and using all Python commands. You just issue each


    command at command prompt (>>>), one by one, and the answer is immediate.

    Python interpreter can be started by issuing the command:

    $ python

    kunal@ubuntu:~$ python

    Python 2.6.2 (release268-main, Apr 19 16:41) [GCC 4.3.3] on linux

    >>> type ("help", "copyright", "credits"

    or "license" for more information)

    >>>

    In this article, the code starting at the

    >>> symbol is meant to be given at the

    >>> prompt.


    It is also important to remember that Python takes very seriously - so if you
    are receiving any error that mentions tabs, consider the tab spacing.


    +   3. Dynamic typing

    In Java, C and other statically typed languages, you must specify the data type
    of the function return value and each function argument. On the other hand, Python
    is a dynamically typed language. In Python you never have to specify the data
    type of anything. Based on what value you assign, Python will keep track of the
    data type internally.'
