  md: '# Asserting values


    At some point we need to debug some piece of code that we are trying to write.
    One of the useful tools in this concept is the Python assertion. An assert checks
    a condition is true. If it is, then nothing happens. If it is not, then an AssertionError
    is raised. You can use assert to make sure invariants remain true and to check
    assumptions made within your code. You can optionally include a custom message
    to the assert command. This second argument is printed if the assertion fails.
    By providing a detailed error message that gets printed out, you may want to include
    cleanup code to recover from the failed assertion.


    # Mapping functions


    A common task that is done in modern programming is to map one element to another.
    Python provides the map() function to do this. Map returns a list of the results
    of the function applied to each element of an iterable. If there is more than
    one iterable a list of tuples is returned, with each element of the tuple containing
    the result from each. If the function takes more than one input, it will take
    them from the given iterables. If the iterables are of the same length, then they
    are all necessary for the map to function.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_17_0.png)


    # 09 Virtual environments


    Because of the complexity of the Python environment, it is sometimes to set up
    a clean environment within which to install only the modules you need for a project.
    In this way you can create a new environment, for example VENV. This will create
    a bins directory, include pip, and populate them with an initial python. You can
    then start using this new environment, activate it which will change environment
    variables, such as the PATH. This allows you to reset your environment back to
    its previous condition. In this way, you can have environments that only contain
    the modules you need for a set of tasks.


    While not strictly commands, everyone needs to know how to deal with loops. The
    two main types of loops are fixed iteration loops and a conditional loop (while)


    # 10 Loops


    While not strictly commands, everyone needs to know how to deal with loops. The
    two main types of loops are fixed iteration loops and a conditional loop (while).
    In a for loop you iterate over a sequence of values, putting them one at a time
    in a variable. You continue until you have either processed every element or you
    have a break. In a while loop you continue going through the loop as long as some
    condition evaluates to True. Loops can also be exited early by using a break,
    and skip pieces of code inside the loop by using a continue to selectively stop
    this current iteration and move to the next one.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_17_1.png)


    # 11 Filtering


    Where a map returns a value for every element in an iterable


    # 12 Reductions


    In many cases there is a reduction operation. This is when you want to take some
    list of elements and reduce it to a single value. In Python you can use the ''reduce'',
    function, to apply the reduction function to each element of an iterable cumulatively.
    For example if you want to sum up a list of integers, you would get the result
    as (((1)+2)+3)+4)+5. You can also apply the reduction to elements from the iterable,
    and it is returned as a default if the iterable is empty. You can use a lambda
    function in the function to reduce your code as tight as possible. In this case,
    it should only take two input parameters.


    18 The Python Book'
