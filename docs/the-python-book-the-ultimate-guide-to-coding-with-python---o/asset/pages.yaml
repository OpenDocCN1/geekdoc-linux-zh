  md: "# # The stopping condition for a while loop\n\n```\nyesNo = False\n```\n\n\
    ```\n# A while loop that runs until the user enters either \"yes\" or \"no\"\n\
    while yesNo == False:\n```\n\n```\n    result = input(\"Do you want to continue?\
    \ (yes/no)\")\n\n    if result == \"yes\":\n        yesNo = True\n    else:\n\
    \        print(\"Error, please type yes or no\" + \"\\n\")\n```\n\n12 Input validation\
    \ with While loops and statements\nTo demonstrate a while loop, we will output\
    \ a question to the user for an answer. We are asking them if they want to continue\
    \ - or if we require either a case-yes, or case-no. A while loop that runs until\
    \ a condition is met can be created using a variable yesNo to False. The yesNo\
    \ variable will be set to True when the user enters yes. \n\nA while loop that\
    \ has a \"condition\" which is part of the while loop code needs to be defined\
    \ in the lines before. Any code that should not be part of the statement is indented.\
    \ The statement is checked with the comparison operator \"==\". An assignment\
    \ operator \"=\" equals a comparison operator \"!=\" which means \"not equal\"\
    .\n\nWe created a variable \"result\", which holds the result of the question,\
    \ do you want to continue? We check this with the variable yesNo. The operator\
    \ \"=\" allows us to update the variable. If the input is correct then we set\
    \ yesNo to True, which stops the loop. Otherwise, the loop will run again. We\
    \ can use the Ctrl+C at the terminal to exit the program at any time.\n\n13 Continue\
    \ or exit?\nNext we will use the result that was stored inside the while loop\
    \ with a function. If the user typed \"continue\", we will print \"Exiting\" and\
    \ then we don't have to do anything else for the program to continue because we\
    \ call the sys function. This code also shows how the newline character is in\
    \ a string, not in separate quotation marks.\n\n# # Create the count\n\n14 Loops\
    \ with numbers\nWe will use a while loop with a variable and c (less than or equal\
    \ to count) as its stopping condition. The while loop will run each time the count\
    \ variable is incremented. The count variable allows us to count how many times\
    \ the loop has been executed.\n\n# The count has been thrown through the loop\n\
    \n16 Finishing off\nThe final step is to print the program. This is the last line\
    \ and we don't have to do anything else because Python simply finishes when there\
    \ are no more lines to print.\n\n```\ncount = 1\nwhile count <= 5:\n    print(\"\
    Number \" + str(count))\n    count += 1\n```\n\n15 Increasing numbers with a loop\n\
    In this case the while loop will run until count is 6, meaning it runs for a total\
    \ of 5 times. On each run, the loop increments the number variable and this value\
    \ is added to the original count. Finally, the count is incremented.\n\n17 Admire\
    \ your work\nNow that we've finished coding, save everything you have made and\
    \ run your program with the F5-key.\n\nThe Python Book 163"
