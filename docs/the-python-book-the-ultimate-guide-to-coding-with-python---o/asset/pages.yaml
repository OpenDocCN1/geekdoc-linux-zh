  md: "# Python essentials\n\n```\nMEDIA_URL = '/media/'\n```\n\nNow we will to create\
    \ the admin interface for our Django site. This is a new feature of Django which\
    \ allows the automatic creation of an admin interface based on the data model.\
    \ The admin interface is used to add and manage content for a Django site.\n\n\
