    # What is this?


    Everything in Python is an object. You can check whether this object is an instance
    of the class with the command ''instance(object,class)''. This returns a boolean
    value.


    # Is it a subclass?


    The command ''issubclass(class1,class2)'' checks if class1 is a subclass of class2.
    If class1 and class2 are the same, this returns True.


    # Global objects


    You can get a dictionary of the symbol table for the current module with the command
    ''globals()


    # Local objects


    You can access an dictionary of the local symbol table by using the command ''locals()''


    # Variables


    The command ''vars(object)'' returns attributes of an object. If you use ''vars()''
    it behaves like ''locals()''


    # How true is a list?


    In some cases, you may have a collection of elements in a list that can be evaluated
    to True or False. For example, you may have a list of possibilities which your
    computation has created of which ones passed. You can use the command ''any()''
    to check if any element in your list is true, and ''all()'' to check if all of
    them are satisfied, and False if neither do. They do return if the iterable is
    empty; however, ''all()'' returns True if the iterable is empty, whereas the command
    ''any()'' returns False for any empty iterable.


    # Casting


    Variables in Python don''t have any type of object. The actual data, however,
    is of one type or another. When performing operations, you must assume that the
    input values are of the same type. When you use the operator, it is enough to
    make the type of conversion that you need to make. To convert your data from one
    type to another, there are class of functions that can be used to do this conversion.
    The process is as simple as using ''int()'', ''float()'', ''str()'', and so on.
    For the number-based conversion functions, there is an order of precedence where
    integers are ''lower'' than float. When converting up, the value should hold true.
    When converting down, some amount of precision is lost; for example, converting
    from float to int, Python converts the numbers towards zero.


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_18_0.png)


    # Enumerating


    In some cases, we need to list the iterable objects with their index so they can
    be processed at some time. You could do this by looping through the elements and
    building an enumerated list. However, the enumerate function does this. It takes
    an iterable and creates a list of tuples with the i-indexed position, along with
    the element itself. You can also start from any value by including an optional
    second parameter. For example, you can enumerate a list of names with the command
    start=1. In this example, we decided to start the indexing at 1 instead.


    # Raising an exception


    When an error occurs, you can use the ''raise'' command to throw up an Exception.
    You can include an exception type and a message.


    # Nonlocal variables


    In Python 3.x, you can access names from the nearest enclosing scope with the
    command ''nonlocal'' and bind it to the local scope.


    # Dealing with an exception


    Exceptions can be caught in a try-except block. If the code in the try block raises
    an exception, the code in the except block gets run.


    # Static methods


    You can create a static method, similar to that in Java or C++, with the command
    ''staticmethod(function,name).''


    Python Book 19'
