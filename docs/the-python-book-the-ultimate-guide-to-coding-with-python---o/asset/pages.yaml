    We''ll be implementing an instant messenger in Python with a client-server architecture.
    This means each client connects to the server, which relays any message from one
    client to all others. The server will also notify all clients when someone joins.
    We can work over any TCP socket, such as across computers on a LAN if we were
    to configure over the internet correctly. However, our messages aren''t encrypted,
    so we''d recommend that:


    Writing an instant messenger is an interesting technical problem that covers a
    bunch of areas that you may not come across before programming:


    +   - We''ll be employing sockets, which are used to transmit data across networks.


    We''ll also use threading, which allows a program to do multiple things at once.


    +   - We''ll cover the basics of writing a simple graphical interface with GTK,
    as well as how to interact with it from a different thread.


    +   - We''ll touch on the use of regular expressions to parse data from strings.


    Before getting started, you''ll need Python installed, as well as the PyGTK bindings
    and the Python2 GObject bindings. The chances are that you have a system with
    a fair amount of software installed, so it may be easier to wait and see if you''re
    missing any libraries when you attempt to import them. All of the above packages
    are commonly used, so you should be able to install them using your distro''s
    package manager.


