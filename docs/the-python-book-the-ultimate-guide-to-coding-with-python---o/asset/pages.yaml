    With the Code Club age group - about eight feeding information to solve problems
    works well. It with adults, but there''s always something to read ahead and has
    a few tricky questions,


    ![](img/3c5b3591dd9ac4cceb489cee11bd7908_129_1.png)


    # 08 Batty


    If you can think of Breakout as essentially being a moving ball - that is, you''re
    hitting a moving ball in order to knock out blocks. Batty is a rectangle, and
    Pygame''s Rect objects manage it. We use Rect(left,top),(width,height)) to define
    where the bat is on the screen, then use the draw function to put the bat on the
    screen, using


    ```

    W = 800

    H = 600

    RED = (200, 0, 0)

    bat = Rect(W/2, 0.96 * H), (150, 15))

    draw.clear()

    screen.draw_filled(rect,bat)

    ```


    # 076 Sprite


    The example from the Pygame docs shows that one sprite will hang around a group
    of .jpg or a .png in a subclass images.


    +   - alien = Alien(''alien'')


    ```

    WIDTH = 500

    HEIGHT = alien.height + 20

    draw.clear()

    screen.draw(alien)

    ```


    We used the alien from the Pygame documentation to show you the animation, but
    then we''re making a different approach in game.


    # 07 Breakout you


    While Pygame is a stretch for a 1980s hit - Breakout comes from the 1970s and
    is a descendant arcade classic: We follow the route from Pangland to Breakout
    (which historically involved Apple founders Steve Wozniak and Steve Jobs) in the
    steps to create our code, leaving you with the option of developing the Pong elements
    into a proper game, as well as refining the Breakout.


    # 09 Move


    We move the bat, and the mouse is closer to an arcade paddle than the keys. Add
    the following:


    ```

    x, y = pos

    bat.center = (x, bat.center[1])

    ```


    Use prgnrun to test that you have a screen, bat and movement,


