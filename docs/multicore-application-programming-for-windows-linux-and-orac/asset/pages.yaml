    \ waits for a message from the child. The child sends a message and then closes\
    \ its connection to the message queue. The parent receives the message and then\
    \ closes the connection to the message queue and deletes the queue.\n\n# Pipes\
    \ and Named Pipes\n\nA pipe is a connection between two processes. It can be either\
    \ an anonymous pipe between two processes or a named pipe, which uses an entry\
    \ in the file system for communication between processes or threads. The pipe\
    \ is a streamed first-in, first-out structure.\n\nA named pipe is created by a\
    \ call to pipe() typically before the child process processes. The pipe creates\
    \ two file descriptors, one for reading from the pipe and a second for writing\
    \ into the pipe. After the fork, both the parent and child inherit both their\
    \ file descriptors. Typically one pipe would be used for unidirectional communication\
    \ between the parent and the child.\n\nReading and writing to pipes can use the\
    \ functions that take file descriptors as parameters, such as read and write.\n\
    \nListing 5.61 shows an example of using an anonymous pipe to communicate between\
    \ a child and parent process."
