    The use of pointer variables raises a common problem. To the compiler, a pointer
    can point to any location in memory, including the address of other variables
    or the addresses held by other pointers. Hence, any memory location accessed through
    a pointer may have been modified by a different memory access.

    If two pointers hold the address of the same memory location, they are said to
    alias. The safe assumption is for the compiler to assume that any pointer may
    alias with any other data. In some cases, the compiler is able to prove that a
    particular memory location was not accessed through the pointer, and then the
    compiler can avoid reloading or storing data. However, the presence of a pointer
    may mean the compiler cannot safely perform many optimizations. In Listing 2.31,
