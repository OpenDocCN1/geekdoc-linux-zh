    \ i<200; i++)\n    {\n        pthread_mutex_lock(&mutex);\n        queue[length++]\
    \ = i;\n        pthread_cond_broadcast(&cv);\n        pthread_mutex_unlock(&mutex);\n\
    \    }\n}\n```\n\nThere is no advantage to using broadcast in a situation where\
