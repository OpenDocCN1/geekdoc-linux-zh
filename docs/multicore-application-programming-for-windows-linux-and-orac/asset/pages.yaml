  md: "# Creating Native Windows Threads\n\nThe call to _beginthread() avoids a difficulty\
    \ with _beginthread(). If the thread terminates, the handle returned by the call\
    \ to _beginthread() will be invalid or reused, so it is impossible to query the\
    \ status of the thread or even be confident that the handle to the thread is a\
    \ handle to the same thread which it originally pointed. Listing 6.4 shows an\
    \ example of this problem.\n\nListing 6.4 Code Where a Thread Handle Could Be\
    \ Reused\n\n```\n#include <windows.h>\n#include <process.h>\n\nvoid mywork1( void\
    \ * data ) {\n}\n\nvoid mywork2( void * data ) {\n    volatile int i;\n    for\
    \ (i=0; i<100000; i++) // because i is volatile most compilers will\n    // eliminate\
    \ the loop\n}\n```\n\n```\nint main(int argc, TCHAR* argv[]) {\n    HANDLE h1,\
    \ h2;\n    h1 = (HANDLE)_beginthread(&mywork1, 0, 0);\n    h2 = (HANDLE)_beginthread(&mywork2,\
    \ 0, 0);\n    WaitForSingleObject(h1, INFINITE);\n    WaitForSingleObject(h2,\
    \ INFINITE);\n}\n```\n\nThe routine mywork1() in Listing 6.4 terminates quickly\
    \ and may have already terminated by the time the thread reaches the call to create\
    \ the second. If the first thread has terminated, the handle to the first thread\
    \ may be reused as the handle to the second thread. Queries using the handle of\
    \ the first thread might succeed, but they will work on the wrong thread. In the\
    \ code shown in Listing 6.4, the calls to WaitForSingleObject() may not be a correct\
    \ or valid handle for either of the threads depending on the completion time of\
    \ the threads.\n\nListing 6.5 shows an equivalent code that uses _beginthreadex().\
    \ Threads created with _beginthreadex() need to be cleaned up with a call to CloseHandle().\
    \ Consequently, the calls to WaitForSingleObject() are certain to get the correct\
    \ handles."
