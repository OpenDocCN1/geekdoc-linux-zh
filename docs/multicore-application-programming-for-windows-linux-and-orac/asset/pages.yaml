    # Creating Processes


    To create a process, the first process calls CreateProcess(), which takes a number
    of parameters. The three critical parameters are the name (and any parameters)
    of the process to be run, together with a pointer to a STARTUPINFO structure and
    a PROCESS_INFORMATION structure. Table 6.4 shows the full parameters to this function.


    Table 6.4 Parameters Passed to CreateProcess()

    | Parameter Type | Comment |

    | --- | --- |

    | LPCSTR | Name of the application. |

    | LPCSTR | Command line. |

    | LPSECURITY_ATTRIBUTES | Pointer to security attributes for the child process.
    |

    | LPSECURITY_ATTRIBUTES | Pointer to security attributes for the first thread
    in the child process. |

    | BOOL | A boolean that indicates whether the created process should inherit the
    handles from the calling process. |

    | DWORD | An optional set of process creation flags and priority flags. These
    flags control various characteristics of the created process such as whether the
    process has a window or whether the main thread is created in the suspended state.
    The flags also control the scheduling priority for the process, which in turn
    determines how much share of the CPU process is given. |

    | LPVOID | An optional pointer to a new set of environment strings. If this is
    null, the process will inherit the runtime environment of the calling process.
    |

    | LPCSTR | An optional pointer to a string containing the current directory for
    the process. If this parameter is null, the process inherits the runtime directory
    of the calling process. |

    | LPSTARTUPINFO | Pointer to the STARTUPINFO structure. |

    | LPPROCESS_INFORMATION | Pointer to the PROCESS_INFORMATION structure. |'
