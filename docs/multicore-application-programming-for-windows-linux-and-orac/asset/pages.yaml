  md: '# 80 Coding for Performance


    ![](img/9337ae7b0be66cc11725becaa009908f_101_0.png)


    A similar view is available from Apple''s Instruments tool, as shown in Figure
    2.17. An instrument is the name given to a tool that gathers data about processor,
    disk, network, and memory usage over the run of an application. This particular
    example shows sensor utilization by the two threads over the run of the application.
    The time line view is particularly useful for multithreaded applications. To get
    the best performance, the work needs to be divided evenly between all threads.
    The time line view is a quick way of telling which threads are more active than
    others. It can also be used for codes where a synchronization event, such as garbage
    collection in Java, causes issues with the threads in an application to pause.


    Performance analysis tools are crucial in producing optimal serial and parallel
    codes. Consequently, it is important to become familiar with the tools available
    on your system. For serial codes, a performance analysis tool will identify the
    region of code that need to be improved to increase the performance of an application.
    For parallel codes, it will allow you to identify regions of code where the parallelization
    could be improved or where the work could be better distributed across the available
    processors or threads.


    # How Not to Optimize


    When people talk about optimizing an application, there is a temptation to immediately
    think of the hot routines in assembly language or of reaching for one of the'
