- pgno: 64
  md: '# How Structure Impacts Performance


    +   - Common functionality can be extracted into a library that can be shared
    between different projects or applications. This can lead to better code reuse,
    more efficient use of developer time, and more effective use of memory and disk
    space.

    - Placing functionality into libraries can lead to more convenient upgrades where
    only the library is upgraded instead of replacing all the executables that use
    the library.

    - Libraries provide better separation between interface and implementation. The
    implementation details of the library can be hidden from the users, allowing the
    implementation of the library to evolve while maintaining a consistent interface.

    - Stratifying functionality into libraries according to frequency of use can improve
    application start-up time and memory footprint by loading only the libraries that
    are needed. Functionality can be loaded on demand rather than setting up all possible
    features when the application starts.

    - Libraries can be used as a mechanism to dynamically provide enhanced functionality.
    The functionality can be made available without having to change or restart the
    application.

    - Libraries can enable functionality to be selected based on the runtime environment
    or characteristics of the system. For instance, an application may differ optimized
    libraries depending on the underlying hardware or select libraries at runtime
    depending on the type of work it is asking to perform.


    On the other hand, there are some nontechnical reasons why functionality gets
    placed into libraries. These reasons may represent the wrong choice for the user.


    +   - Libraries often represent a convenient product for an organizational unit.
    One group of developers might be responsible for a particular library of code,
    that does not automatically imply that a single library represents the best way
    for that code to be delivered to the end users.

    - Libraries are also used to group related functionality. For example, an application
    might contain a library of string-handling functions. Such a library might be
    appropriate if it contains a large body of code. On the other hand, if it contains
    only a few small routines, it might be more appropriate to combine it with another
    library.


    There is a strong attraction to breaking applications down into a set of libraries.
    Libraries make sense for all the reasons outlined previously, but it is quite
    possible to have either splits of functionality or libraries that implement too
    little functionality.


    There are costs associated with libraries. A call into a function provided by
    a library will typically be more costly than a call into a function that is in
    the main executable. Code provided in a library may also have more overhead than
    code provided in the executable. There are a few contributors to cost:'
