- pgno: 393
  md: '# Chapter 9 Scaling with Multicore Processors


    One cost of thread migration is related to the fact that the thread was using
    now resides in the cache of the old processor. The data will need to be fetched
    into the cache of the new process. It is important to notice that this is likely
    to be a cache to transfer, rather like the situation with false sharing. For some
    systems, fetching data from another processor''s cache may be lower cost than
    fetching that from memory. However, on some systems the cost of fetching data
    from another cache may be higher than fetching that from memory. The typical reason
    for this is that the data needs to be stored before the new processor can fetch
    it.


    However, there is an additional potential cost to thread migration in a multiprocessor
    system. Modern operating systems have some idea of the topology of the memory
    subsystem. Hence, the operating system can provide a thread with memory that has
    the lowest latency. Unfortunately, if a thread is migrated, it can be located
    on a different processor with a much higher memory latency. This issue causes
    systems to attempt to keep threads, if not exactly where they were originally,
    but within the group of virtual CPUs that share the same memory latencies.


    This gives rise to the idea of locality groups, groups of threads that share the
    same memory access latencies. If a thread is moved within a locality group, there
    will be no change in memory latency costs; the migration cost is a small cost
    to the thread moving to a potentially cold cache.


    Linux provides the tool numactl both to query the topology of the hardware and
    allow the user to specify the virtual processor where the application will be
    run. Listing 9.30 shows the output from numactl that indicates the system has
    two nodes, processors, and the amount of memory associated with each node.


    # 9.30 NUMA Characteristics from Linux


    ```

    $ numactl --hardware

    aavailable: 2 nodes (0-1)

    node 0 size: 2047 MB

    node 0 free: 88 MB

    node 1 size: 1983 MB

    node 1 free: 136 MB

    ```


    Solaris provides the tool lgprinfo, which reports on the locality groups of the
    system. The output shown in Listing 9.31 is from a system with two locality groups.
    Solaris provides the separate tool pbind to specify the binding of a process to
    virtual CPUs.


