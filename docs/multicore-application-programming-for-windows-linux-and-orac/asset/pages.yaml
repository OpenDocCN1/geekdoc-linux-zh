- pgno: 220
  md: '# Windows Threading


    Multithreading support under the Microsoft Windows operating system is broadly
    similar to the support provided by POSIX threads. The differences are largely
    in the names of the functions in the API rather than any significant differences
    in the actual functionality.This chapter compares the Windows threading support
    with that of POSIX threads. By the end of the chapter, the reader should be familiar
    with Windows threading and will be able to convert code between Windows and POSIX
    conventions.


    # Creating Native Windows Threads


    A basic Windows application will start with a single thread. The function call
    to request Windows creates a CreateThread(). This call takes the parameters in
    Table 6.1.


    Table 6.1 Parameters Passed to CreateThread()

    | Parameter Type | Comment |

    |---|--- |

    | LTHREADATTRIBUTES | The create attributes of the thread; a discussion of this
    is outside the scope of this text. However, passing zero will suffice for the
    purposes of creating child threads. |

    | SIZE_T | The stack size for the thread. The default is for each thread to get
    1MB of stack space. A thread created using a POSIX API will have its stack size
    provided by a separate attribute structure. |

    | LTHREAD_START_ROUTINE | The address of the function that the thread will execute.
    The parameters are to be passed to the thread. |

    | LPVOID | Whether the thread should be created in a suspended state. A suspended
    thread needs to be started by a call to the ResumeThread() function. |

    | LPDWORD | A pointer to variable where the thread ID can be written.|'
