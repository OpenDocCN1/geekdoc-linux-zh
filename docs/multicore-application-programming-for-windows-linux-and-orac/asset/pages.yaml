    This indicates that when a single thread is running on the core, it is resident
    and has few L1 caches. When a second thread joins this on the same core, the combined
    memory footprint of the two threads exceeds the size of the L1 and cache causes
    both threads to have L1 cache misses. However, the combined memory footprint is
    smaller than the size of the L2 cache, so there is no increase in L2 cache misses.


    Therefore, it is important to minimize the memory footprint of the codes running
    on the system. Most memory footprint optimizations will appear to be good programming
    practice and are often automatically implemented by the compiler. For example,
    if there are unused local variables in a function, the compiler will not allocate
    stack space to hold them.


    Other issues might be less apparent. Consider an application that manages its
    own memory. It would be better for this application to return deallocated memory
    to the thread that deleted rather than return memory to us. The reason is that
    the recently deallocated memory might still be resident. Reusing the same memory
    avoids the cache misses that would occur if the memory manager returned an address
    that had not been recently used and the thread had to fetch cache line from memory.


