  img_proc: true
- pgno: 114
  md: '# Using Parallelism to Improve the Performance of a Single Task


    Of course, there would also be problems on the weekend, when you both want to
    read the same newspaper at the same time. So, perhaps you would need two copies
    of the paper or work out some way of sharing it if only one of you had the paper
    at a time.


    On the other hand, there would be plenty of benefits.You could be painting one
    wall, while yours is painting.You could mow the lawn the other washes the dishes.You
    could even work together cooking the dinner; one of you could be chopping vegetables
    while the other is frying.


    Although the idea of this kind of double benefit is fanciful, these examples represent
    very real issues that arise when writing parallel applications. As a thought experiment,
    imagining two people collaborating on a particular task should help you identify
    ways to divide the task and also indicate some of the issues that result.


    The rest of the chapter will explore some of these opportunities and issues in
    more detail. However, it will help in visualizing the later parts of the chapter
    if you can take some of these “human” examples and draw the parallels to the computational
    problems.


    Parallelism provides an opportunity to get more work done.This work might be independent
    tasks, such as mowing the lawn and washing the dishes.This work could correspond
    to different processes or perhaps different users using the same system. Painting
    the walls of a house requires a little communication—you might need to identify
    which wall to paint next—but the two tasks proceed independently.However, when
    it comes to cooking a meal, the tasks are much more tightly coupled.The order
    in which the vegetables are chopped should correspond to the order in which they
    are needed.You might need messages like “Stop what you''re doing and get me olive
    oil, now!” Preparing a meal requires a high amount of communication between the
    two workers.


    The more communication is required, the more likely it is that the effect of the
    two workers will not be a doubling of performance. An example of communication
    might indicate which order the vegetables should be prepared in. Inefficiencies
    might arise when the person cooking is waiting for the other person to complete
    chopping the next needed vegetable.


    The issue of accessing resources, for example, both wanting to read the same newspaper,
    is another important concern. It can sometimes be avoided by duplicating resources—both
    of you having your own copies—but if there is only a single resource, we will
    need to establish a way to share that resource.


    In the next section, we will explore this thought experiment further and observe
    how the algorithm we use to solve a problem determines how efficiently the problem
    can be solved.


    # How Parallelism Can Change the Choice of Algorithms


    Algorithms have characteristics that make them more or less appropriate for a
    multi-threaded implementation. For example, suppose you have a deck of playing
    cards that are in a random order but you would like to sort them in order. One
    way to do this'
