- pgno: 102
  md: '# How Not to Optimize


    ![](img/9337ae7b0be66cc11725becaa009908f_102_0.png)


    Figure 2.17 Time line information from Apple''s Instruments


    many books about performance optimization that talk about loop unrolling, invariant
    hoisting, and so.


    These do not represent the best place to start. In general, it is best to avoid
    optimizations that make the code easy to read. The best approach is to make minimal
    changes to the source code or select improved compiler flags.


    It used to be that performance optimization did writing in assembly language or
    manually applying loop transformations in the source. This is why optimizations
    typically have extensive coverage of these topics. However, these optimizations
    are usually trivial for any modern compiler to do, given the right flags. Using
    the compiler to do the optimization has several benefits:


    +   - The first, the compiler will get the optimization correct. Manually undertaking
    complex instructions can potentially lead to bugs.

    - The second benefit is that the code remains manageable. If the details of algorithm
    change, it will require only the minimal number of modifications to the source
    code, and the compiler will reaply the same optimization.

    - There is a third benefit—that the compiler will do the optimization only if
    it is likely to result in a performance gain. Some optimizations might be help
    on one processor but result in performance loss on a different processor.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Chapter 2 Coding for Performance


    Therefore, the important steps are to identify where the time is spent and determine
    why the compiler is solving the problem simply by a minor change to the source
    code or the addition of a compiler flag.


    Having said that, there will be situations where it is impossible to coax optimal
    out of the compiler and where manually optimizing the code is unavoidable. However,
    even before doing this, consider that the optimization will provide. Doubling
    the performance of part of the code where 10% of the runtime is spent will result
    in a 5% gain in performance. This gain needs to be considered in light of the
    time spent rewriting the code to gain and the maintenance costs of the new code.


    # Performance by Design


    This chapter has outlined a number of different places in the design process that
    impact performance. One way of visualizing this is to realize that there is a
    maximum possible performance for a given combination of system and problem to
    be solved. The choices made during design and implementation will either lead
    to the system meeting this maximum upper bound or cause the performance to be
    below this.


    Decisions made early in the design process potentially have the largest impact
    on the performance of the application. The choice of algorithm can completely
    change the way the application behaves as the size of the problem increases. Similarly,
    a poor choice of algorithm can limit the scaling of the application as the number
    of available cores increases.


    In many cases, it is possible to write the application in such a way as to encapsulate
    the choice of algorithm for critical parts of the code so that if it becomes critical
    to performance, it can be replaced at a later point. With careful consideration,
    the code can be structured so that the compiler can avoid any inefficiencies introduced
    by this encapsulation.


    With all design processes, it is usually easy to make significant changes early
    in the design rather than later. Change introduced earlier takes less to implement
    and is cheaper than later-introduced fixes. Hence, early consideration given to
    appropriate workloads and cases will lead to better choices during design and
    implementation.


    All too often, performance tuning is considered at the point just before the application
    ships or at the point that it becomes obvious that the application is slow.At
    this stage, it can be hard, and costly, to make the changes that are necessary
    to improve performance. Figure 2.18 shows the traditional view of the impact of
    change over the development cycle of an application.


    Some program modifications are relatively easy to do at the end of the development
    cycle, such as changing the compiler flags, but the impact is likely to be small.
    Other actions, such as implementing a new algorithm, will have much higher costs
    if performed at the end of the project but could have a much greater impact. Ideally,
    such high-impact work should be completed early where it incurs less cost.'
  merge: -1
  img_proc: true
