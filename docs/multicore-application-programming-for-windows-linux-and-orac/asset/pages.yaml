    # Alternative Languages


    The languages described so far in this chapter have been extensions to what might
    be standard C/C++. In some ways, C and C++ are not ideal languages for parallelization.
    One particular issue is the extensive use of pointers, which makes it hard to
    prove that memory accesses do not alias.

    A consequence of this, other programming languages have been devised that either
    target developing parallel applications or do not suffer from the issues that
    are C/C++. For example, Fortress, initially developed by Sun Microsystems, has
    a model where loops are parallel by default unless otherwise specified. The Go
    language from Google includes the concept of go routines that, rather like OpenMP
    tasks, can be executed in parallel with the main thread.

    One area of interest is functional programming. With pure functional programming,
    the evaluation of an expression depends only on the parameters passed into that.
    Hence, functions can be evaluated in parallel, or in any order, and will produce
    the same result. We consider Haskell as one example of a functional language.

    10.16 evaluates the Nth Fibonacci number in Haskell. The language allows the return
    values for functions to be defined for particular input values. So, in this instance,
    we are setting the return values for 0 and 1 as well as the general return value
    for any other numbers.


    Listing 10.16 Evaluating the Nth Fibonacci Number in Haskell


    ```

    fib 0 = 0

    fib 1 = 1

    fib n = fib (n-1) + fib (n-2)

    ```'
