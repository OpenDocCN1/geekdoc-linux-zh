  md: '# Chapter 6 Windows Threading


    Windows 7 introduced two further function calls into the slim reader/writer API.
    In the Windows Vista API, function calls to acquire the reader/writer lock will
    return only once the lock has been acquired. In some situations, it is better
    to perform some other operation in the event that the lock is not available. The
    two functions that provide this are TryAcquireSRLockExclusive() and TryAcquireSRLockShared().
    These two functions return immediately. If the lock is available, the function
    call will have acquired the lock for the thread, and the return value will be
    nonnonzero; if the lock is unavailable, the return value will be zero.


    # Semaphores


    Semaphores are a way of keeping track of a count of numbers, as well as a way
    of communicating resource availability between threads. At the simplest level,
    they can be used as an alternative implementation of a mutex, but more complex
    use would be to communicate readiness between multiple threads.


    A semaphore can be created through a call to CreateSemaphore(), which takes four
    parameters. The first parameter is the security attributes, or it is null if the
    default is used. The second parameter is the initial value for the semaphore.
    The third parameter is the maximum value for the semaphore. The final parameter
    is an optional name for the semaphore. The name can be used when other threads
    or processes want to attach to the same semaphore. If a semaphore of the given
    name exists and was created with the SEMAPHORE_ALL_ACCESS access, then the function
    will return a handle to the existing semaphore.


    The second way of creating a semaphore is through the CreateSemaphoreEx() call.
    This takes the first four parameters and adds two more. The fifth parameter is
    a set of flags, but it must be the zero value. The sixth parameter is for access
    rights. Passing SEMAPHORE_ALL_ACCESS as this parameter will create a semaphore
    that can be shared between processes. The name of the shared semaphore also needs
    to be placed in the global namespace. Creating shared semaphores will be covered
    later in this chapter.


    The final way of getting a handle to a semaphore is to call OpenSemaphore(), passing
    in three parameters. The first parameter is the desired access rights. The second
    parameter is a boolean that indicates whether the semaphore should be inherited
    by child processes. This is one of the options available through the security
    attribute used by SemaphoreCreate() and SemaphoreCreateEx(). The third parameter
    will not create the semaphore if it does not already exist.


    Semaphores are kernel objects, so the create function will return a handle to
    the new semaphore. When the application has finished with the semaphore, it should
    release it with a call to CloseHandle. Once there are no outstanding handles to
    the semaphore, the kernel object is disposed of.


    A semaphore can be decremented by a call to one of the waits. The one that is
    most likely to be useful is WaitSingleObject(), which takes the handle of the
    semaphore and a timeout. The function will either return having decremented the
    semaphore or return when the timeout expires out.'
