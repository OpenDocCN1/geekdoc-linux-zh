    documents could no longer be held at the same virtual address; they would need
    different virtual addresses. If the editor application was poorly coded, activities
    in one window could cause changes to the data held in the other.


    There are plenty of reasons why someone might choose to write an application that
    uses multiple threads. The primary one is that multiple threads on a system with
    multiple hardware threads would produce results faster than a single thread doing
    the work. Another reason might be that the problem naturally decomposes into multiple
    threads. For example, a web server will have many simultaneous connections to
    remote machines, so it is a natural fit to code it multiple threads. The other
    advantage of using multiple processes is that threads share more of the machine
    state, in particular the TLB and cache entries. If all the threads need to share
    some data, they can all read it from the same memory address.


    What should you take away from this discussion is that threads and processes are
    ways of getting multiple streams of instructions to coordinate in delivering a
    solution to the problem. The advantage of processes is that each process is isolated—if
    one process dies, then it can have no impact on other running processes. The disadvantages
    of multiple processes is that each requires its own TLB, which increases the TLB
    and cache miss rates. The other disadvantage of using multiple processes is that
    sharing data between processes requires explicit control, which can be a costly
    operation.


    Multiple threads have advantages in low costs of sharing data between threads—one
    thread can share an item of data to memory, and that data becomes immediately
    visible to all the other threads in that process. The other advantage to sharing
    is that all threads share the same TLB and cache entries, so multithreaded applications
    can end up with lower cache miss rates. The disadvantage is that one thread failing
    will probably cause the entire application to fail.'
