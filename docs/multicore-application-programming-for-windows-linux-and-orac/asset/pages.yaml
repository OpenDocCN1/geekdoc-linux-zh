  md: 'At runtime, the processor has hoisted the store to the lock so that it becomes
    visible to the rest of the system from the store to the variable count. Here,
    the lock is released before the new value of count is visible. Another processor
    could see that the lock was free and load up the old value of count rather than
    the new value.


    The solution is to place a memory barrier between the two stores to tell the processor
    not to reorder them. Listing 1.8 shows the corrected code. In this example, the
    member instruction ensures that all previous store operations have completed before
    the next store is executed.


    # Listing 1.8 Using a Memory Barrier to Enforce Store Ordering


    ```

    LOAD [count], %A

    INC %A

    STORE %A, [count]

    MEMBAR #store, #store

    STORE 0, [#lock]

    ```


    There are other types of memory barriers to enforce other orderings of load and
    store operations. Without these memory barriers, other memory ordering errors
    could occur. For example, a similar issue could occur when the lock is acquired.
    The load that fetches the value of count might be executed before the store that
    sets the lock to be acquired. In such a situation, it would be possible for another
    processor to modify the value of count between the time that the value was retrieved
    from memory and the point at which the lock was acquired.


    The programmer''s reference manual for each family of processors will give details
    about the exact circumstances when memory barriers may or may not be required,
    so it is essential to refer to these documents when writing custom locking.


