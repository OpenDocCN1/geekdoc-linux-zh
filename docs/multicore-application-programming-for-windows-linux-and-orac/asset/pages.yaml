  md: 'The OpenFileMapping() call that opens an existing file mapping object takes
    three parameters. The first parameter gives the security attributes for the mapping
    object, which usually is FILE_MAP_ALL_ACCESS to allow both reading and writing
    to the shared memory. The second parameter is a boolean that determines whether
    the handle can be inherited by child processes. The third parameter is the name
    of the mapping object.


    Although the CreateFileMapping() call creates the mapping object in the kernel,
    it does not actually map into user space. The call to MapViewOfFile() causes the
    shared object to be mapped into memory. The return value of this is a pointer
    to the base address of the memory. This call takes five parameters, as shown in
    Table 6.6.


    # Table 6.6 Parameters Passed to MapViewOfFile()


    | Parameter Type | Comment |

    | --- | --- |

    | HANDLE | Handle from CreateFileMapping() or OpenFileMapping() |

    | DWORD | Access permissions for the memory. This is likely to be FILE_MAP_ALL_ACCESS
    for processes that need to read and write the shared memory. |

    | DWORD | High-order DWORD of an offset into the shared memory. |

    | DWORD | Low-order DWORD of an offset into the shared memory. |

    | SIZE_T | Size of the shared memory region. Passing zero as this parameter makes
    the size the same as the size allocated in the mapping object |


    The third and fourth parameters are the high-order and low-order DWORDs of an
    offset into the shared memory. This will be returned as the base address of the
    pointer. In general, the required offset into the shared memory will be zero,
    so of these parameters will also be zero.


    Once the process has finished with the shared memory, it needs to be unmapped
    with UnmapViewFile(), which takes the base address of the shared memory as a parameter,
    and then the handle can be closed with a CloseHandle().


    The example in Listing 6.27 shows how a region of memory can be created and shared
    between two processes. If the application is started without any parameters, it
    will create a child process. The process will also create a region of shared memory
    and store a string into the shared memory. The shared memory is given the name
    shared-memory and is created in the Local\namespace. Hence, it is visible to all
    the processes owned by the user.


