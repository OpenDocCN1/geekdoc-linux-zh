  md: '# Using Automatic Parallelization to Produce a Parallel Application


    The Intel compiler uses the option -parallel to enable parallelization and the
    option -par-report to report its success. The compiler also has the option -par-threshold(n),
    which controls the threshold that the compiler will parallelize a loop. The -par-threshold0
    will make the compiler parallelize all loops; the default of -par-threshold100
    indicates that the compiler should parallelize only those loops that are certain
    to benefit. Listing 7.3 shows the output from the Intel compiler on the same source
    file. The flag -fno-inline-functions disables inlining in the compiler and ensures
    that the generated code is the same for the two compilers.


    # Listing 7.3 Automatic Parallelization Using the Intel Compiler


    ```

    $ icc -std=c99 -0 -parallel -par-report -par-threshold0 \\n-fno-inline-functions
    omp_vector.c)\nomp_vector.c(6): (col. 3) remark: LOOP WAS AUTO-PARALLELIZED.

    ```


