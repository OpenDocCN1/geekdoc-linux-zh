    # False Sharing


    False sharing is the situation where multiple threads are accessing items of data
    on a single cache line. Although the threads are all using separate items of data,
    the cache line itself is shared between them so only a single thread can write
    to it at any time. This is purely a performance issue because there is no correctness
    issue. It would be a correctness issue if a single variable was on the cache line
    shared between the threads.


    The performance impact comes from the fact that each thread requires the cache
    line to be present and writable in the cache of the processor where the thread
    is executing. If another thread recently wrote to the cache line, then the modified
    data needs to be written back to memory and then sent to the next processor that
    wants to write to it.'
