  md: "```\nreturn total;\n}\n\nint main() {\n    double array[1024];\n    omp_init_lock(&lock);\n\
    \    calc(array, 1024);\n    omp_destroy_lock(&lock);\n}\n```\n\n# ## Conditional\
    \ Serial Execution of Parallel Regions\n\nIn some instances, it is useful to identify\
    \ conditions when a parallel region should be executed by a single thread. This\
    \ saves having to place both a serial version and a parallel version of the block\
    \ of code in the source of the application.\n\nThe most obvious occasion for doing\
    \ this would be when there is insufficient work to justify using more than one\
    \ thread. The if() clause can be applied to a parallel directive to determine\
    \ the conditions when the region should be executed in parallel. Listing 7.57\
    \ shows an example of using this directive. The code will execute the region using\
    \ multiple threads only if the variable length has a value greater than 1,000.\n\
    \n# Listing 7.57 Conditional Parallel Execution using the if Clause\n\n```\ndouble\
    \ calc(double * array, int length) {\n    double total = 0.0;\n    #pragma omp\
    \ parallel for reduction(+: total) if(length > 1000)\n    for (int i=0; i<length;\
    \ i++) {\n        total += array[i];\n    }\n    return total;\n}\n```\n\nAnother\
    \ use for the if() clause would be in situations where using multiple threads\
    \ to execute a region of code would cause correctness issues. For example, if\
    \ a loop calculates some function of two vectors, the code is sometimes called\
    \ with vectors that alias. The if() clause can be used to check whether the vectors\
    \ alias and the code in parallel only if no aliasing is present."
