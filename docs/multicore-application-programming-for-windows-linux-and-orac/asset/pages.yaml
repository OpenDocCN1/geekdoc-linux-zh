  md: '# The Translation of Source Code to Assembly Language 25


    However, there are situations where the programmer needs to step in. These can
    be either architecture specific (SPARC processors and x86 processors have different
    requirements) or implementation specific (one type of SPARC processor may have
    different needs than another type of SPARC processor). The good news is that the
    system libraries implement the appropriate mechanisms, so multithreaded applications
    that use system libraries would never encounter this.


    On the other hand, there is overhead from calling system libraries, so there could
    be a performance penalty for writing custom synchronization code. This situation
    is covered in Chapter 8, "Hand-Coded Synchronization and Sharing."


    The memory ordering instructions are given the name barriers (membar) on SPARC
    and memory fences (mfence) on x86. These stop memory operations from becoming
    outside the thread in the wrong order. The following example will illustrate why
    this is important.


    Suppose you have a variable, count, protected by a locking mechanism and you want
    to increment that variable. The lock works by having the value 1 stored into when
    it is acquired and the value 0 stored into it when the lock is released. The code
    for acquiring the lock is not relevant to this example, the example starts with
    the assumption that the lock is already acquired, and therefore the variable lock
    contains the value 1. Now the lock is acquired, the code can increment the variable
    count. Then, to release the lock, the code would store the value 0 into the variable
    lock. The process of incrementing the variable and releasing the lock with a value
    of 0 would look something like the pseudocode shown in Listing 1.6.


    # Listing 1.6 Incrementing a Variable and Freeing a Lock


    ```

    LOAD [&count], %A

    INC %A

    STORE %A, [&count]

    STORE 0, [&lock]

    ```


    As as the value 0 is stored into the variable lock, then another thread can come
    to acquire the lock and modify the variable count. For performance reasons, some
    processors implement a weak ordering of memory operations, meaning that stores
    can be moved past other stores or loads can be moved past other loads. If the
    previous code is run on a machine with a weaker store ordering, then the code
    at execution could look like the code shown in Listing 1.7.


    # Listing 1.7 Incrementing and Freeing a Lock Under Weak Memory Ordering


    ```

    LOAD [&count], %A

    INC %A

    STORE 0, [&lock]

    STORE %A, [&count]

    ```'
