    These attributes are passed into the call to pthread_mutex_init() to set the attributes
    of the initialized mutex. Once the attributes have been used, they can be disposed
    of by a call to pthread_mutex_attr_destroy().


    A mutex can have other attributes set using the same mechanism:


    +   The type of mutex. This can be a normal mutex, a mutex that detects errors
    as multiple attempts to lock the mutex, or a recursive mutex that can locked multiple
    times and needs to be unlocked the same number of times.


    +   The protocol for when another thread is waiting for the mutex. This can be
    the default of no change to thread priority, that the thread holding the mutex
    inherits the priority of any higher-priority thread waiting for the mutex, or
    that the thread gets the highest priority among the mutexes held by it.


    +   The priority ceiling of the mutex. This is the priority that any lower-priority
    thread will be elevated while it holds the mutex.


    The attributes governing the priority of any thread holding the mutex are designed
    to avoid problems of priority inversion when a higher-priority thread is waiting
    for a lower-priority thread to release the mutex.


    # Using Spin Locks


    The critical difference between spin locks and mutex locks is that a spin lock
    will keep spinning in a tight loop and consuming processor resources until it
    acquires the lock. Mutex locks will immediately put a thread to sleep when it
    cannot get the lock, or an adaptive mutex lock will spin for a short time waiting
    for the lock to become free before going to sleep.


    The interface for spin locks is very similar to that of mutex locks. The call
    pthread_spin_init() will initialize a spin lock. The spin lock can be created
    between processes or to the process creating it. A spin lock that is private to
    a process is created by passing the value PTHREAD_PROCESS_PRIVATE as a parameter
    to the call to pthread_spin_init(), and passing the value PTHREAD_PROCESS_SHARED
    creates a spin lock that can be shared between processes.


    Multiple threads in the process that created the lock will always be able to access
    it. However, if the spin lock is created to be private to a process, the behavior
    of the lock is not defined if its used by other processes. The default is for
    the lock to be private to the creating process.


    The call pthread_spin_lock() will spin until the lock is acquired, and finally
    the call pthread_spin_unlock() will release the lock, any resources used by the
    lock. Listing 5.22 demonstrates the use of a spin lock allows access to a local
    variable under the control of the spin lock; however, in this example, the variable
    is not shared between threads, so it is not actually necessary to use any locking.'
