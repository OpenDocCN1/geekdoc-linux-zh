  md: "Chapter 7 Using Automatic Parallelization and OpenMP\n\n# Allowing Only the\
    \ Master Thread to Execute a Region of Code\n\nThe master directive is similar\
    \ to the single directive in that it specifies only one thread should execute\
    \ the enclosed region. There are two differences between the directives. The first\
    \ is that it identifies the master thread as the one that will do the work; the\
    \ single directive does not specify which thread will perform the work. The second\
    \ difference is that the master directive does not cause the other threads to\
    \ wait for the work in the region to be completed before they continue.\n\nThe\
    \ master directive is useful in situations where only one thread needs to complete\
    \ the work. It ensures the same thread executes the region of code, so any thread-local\
    \ variables will carry over from previous executions. This can be useful for broadcasting\
    \ and sharing the value of variables between threads. An example of the master\
    \ directive can be seen in Listing 7.50.\n\n# Restricting Execution of a Region\
    \ to a Single Thread\n\nFor correctness, it is sometimes necessary to restrict\
    \ a region of code so that it is executed only by a single thread at a time. This\
    \ can be achieved using the critical directive. Listing 7.53 shows a very inefficient\
    \ way of performing a reduction using a critical directive to ensure that one\
    \ thread changes the reduction variable at any time.\n\nListing 7.53 Reduction\
    \ Operation Implemented Using a critical Directive\n\n```\ndouble calc(double*\
    \ array, int length) {\n    double total = 0.0;\n    #pragma omp parallel for\n\
    \    for (int i=0; i<length; i++) {\n        #pragma omp critical\n        total\
    \ += array[i];\n    }\n    return total;\n}\n```\n\nThe critical directive takes\
    \ an optional name. This enables the same critical section to protect multiple\
    \ regions of code. For example, all accesses to the variable total could be protected\
    \ by a critical section of the name total_critical_section, as shown in Listing\
    \ 7.54.\n\nListing 7.54 Named Critical Section\n\n```\n#pragma omp critical (\
    \ total_critical_section ) {\n    total += array[i];\n}\n```"
