  md: '# Summary 381


    important to consider the memory locality of the data that is using. The migration
    of a thread between processors will cause local data to become remote. If data
    is shared between threads, some of those threads might see local, and some might
    remote access costs. For optimal performance, it may be appropriate to consider
    binding threads to virtual CPUs.


    Although multicore processors present great opportunities for running workloads,
    they also have constraints. Most critical is the sharing of resources between
    virtual CPUs. These resources might restrict processor instruction pipeline, or
    cache. These constraints will have an impact on the scaling of a single process
    as the number of threads increases. Scaling to higher numbers of threads will
    demonstrate limitations of both the hardware and software.


    Even within a single multicore chip, it may be worth considering binding threads
    to virtual processors. The optimal assignment for work will probably be achieved
    by placing as few threads as possible on each core. This is a task that operating
    systems should perform automatically, but there may be situations where this does
    not happen. One example might be when there are multiple processes active on the
    machine, making it hard for the OS.The OS may make the decision to place the threads
    where there is spare compute resource rather than placing threads optimally for
    the process.


    # Summary


    This chapter described the common reasons why an application may not reach ideal
    scaling. The discussions should provide you with the ability to identify the particular
    hardware—or software-related reasons for restricted scaling and understand the
    limiting factors. You should be able to determine ways of solving those problems
    that have solutions.


    An important discussion in this chapter has the comparison between multicore processors
    and multiprocessor systems. Multicore processors avoid or reduce some of the scaling
    limitations of multiprocessors systems. Understanding the differences will enable
    you to write code that works on both kinds of systems.This is an important consideration
    for applications need to perform well regardless of the underlying hardware.'
