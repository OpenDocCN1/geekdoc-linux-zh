  md: '# Chapter 2 Coding for Performance


    ![](img/9337ae7b0be66cc11725becaa009908f_99_0.png)


    Figure 2.13 Apple''s Shprof tool offering suggestions for performance improvement


    Some tools are able to provide suggestions on how to improve the performance of
    the application. Figure 2.13 shows output from Apple''s Shprof tool, which suggests
    improving by recompiling the application using SSE instructions.


    Many problems can be analyzed and solved at the levels of source code. In some
    instances, the problem is related to how the routine is used. In this situation,
    it becomes important to see the call stack for a routine. Figure 2.14 shows a
    chart from Intel''s VTune. The tool shows two threads in the application and indicates
    the caller-callee relationship between the functions by the two threads.


    An alternative way of presenting callee-callee data is from the Oracle Studio
    Performance Analyzer, as shown in Figure 2.15. This hierarchical view allows the
    user to drill down into the hottest regions of code.


    Another view of the data that is particularly useful is the time line view. Figure
    2.16 shows the time line view from the Solaris Studio Performance Analyzer. In
    this case, the time line view shows both activity, which corresponds to the shaded
    region of the horizontal bars, with every call information, indicated by the different
    colors used to shade the bars. Examining the run of an application over time can
    highlight issues when the behavior of an application changes during the run. An
    example of this might be an application that develops a great demand for memory
    at some point in its execution and consequently spends a period of its runtime
    exclusively in memory allocation code.'
