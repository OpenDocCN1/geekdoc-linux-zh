  md: '# 2


    # Coding for Performance


    This chapter discusses how to design and write programs with performance in mind.
    Serial performance remains important even for parallel applications. There are
    two reasons for this. Each thread in a parallel application is a serial stream
    of instructions. Making these instructions execute as fast as possible will lead
    to better performance of the entire application. The second reason is it is rare
    to find a parallel application that contains no serial code. As the number of
