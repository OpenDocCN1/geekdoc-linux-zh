    threads. The communication might be the command for all the threads to start,
    or it might represent each thread notifying the main thread that it has completed
    its work.


    We can denote this synchronization cost as some function F(N), since it will increase
    the number of threads increases. In the best case, F(N) would be a constant, indicating
    that the cost of synchronization does not change as the number of threads increases.
    In the worst case, it could be linear or even exponential with the number of threads.
    A fair estimate for the cost might be that it is proportional to the logarithm
    of the number of threads (F(N)=K*ln(N)); this is relatively easy to argue since
    the logarithm represents the cost of communication if those threads communicated
    using a balanced tree. Taking this approximation, the cost of scaling to N threads
    would be as follows:


    ```

    Runtime = S + \frac{P}{N} + K \ln(N)

    ```


    The value of K would be some constant that represents the communication latency
    between two threads together with the number of times a synchronization point
    is encountered (assuming that the number of synchronization points for a particular
    application and workload is constant). K will be proportional to memory latency
    for the systems that communicate through memory, or per cache latency if the communicating
    threads share a common cache. Figure 3.12 shows the curves resulting from an unrealistically
    large value for the constant K, demonstrating that at some thread count the performance
    gain over the serial case will start decreasing because of the synchronization
    costs.


