    However, the runtime libraries have not had the opportunity to set up the thread-local
    data structures they need. In most instances, the libraries will create any structures
    they need the first time that they are called, but not all library calls are able
    to do that. Therefore, it is recommended instead of calling CreateThread(), the
    calls provided by the runtime libraries are used. The two recommended ways of
    creating a thread are the calls _beginthread() and _beginthreadex(). The two functions
    take different parameters. Table 6.2 shows the parameters for _beginthread().


    # Table 6.2 Parameters Passed to _beginthread()


    | Parameter Type | Comment |

    | void(*) | The address of the function that the thread will execute |

    | unsigned int | The stack size for the thread |

    | void* | The pointer to the parameters that are be passed to the thread |


    Table 6.3 shows the parameters for _beginthreadex().These are the same as the
    parameters taken by CreateThread().


    # Table 6.3 Parameters Passed to _beginthreadex()


    | Parameter Type | Comment |

    | void* | A pointer to the security attributes of the thread |

    | unsigned int | The stack size for the thread |

    | unsigned int*(void*) | The address of the function that the thread will execute
    |

    | void* | A pointer to the arguments that should be passed to the thread |

    | unsigned int | A flag indicating whether the thread should be created in a suspended
    state |

    | unsigned int * | An optional pointer to a variable where the thread ID can be
    written


    There is no difference between these two routines other than the parameters they
    take. A thread created by a _beginthread() will close the handle to the thread
    when the thread exits. The handle returned by _beginthreadex() will have to be
