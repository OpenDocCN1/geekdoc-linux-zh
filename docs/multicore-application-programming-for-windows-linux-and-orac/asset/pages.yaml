    \ Has Different Computational Costs\n\n```\ndouble calc( int count ) {\n  double\
    \ d = 1.0;\n  for( int i=0; i < count*count; i++) {\n    d += d;\n  }\n  return\
    \ d;\n}\n```\n\n```\nint main() {\n  double data[200][100];\n  int i, j;\n  #pragma\
    \ omp parallel for private(i,j) shared(data) schedule(dynamic)\n  for ( int i=0;\
    \ i<200; i++) {\n    for ( int j=0; j<200; j++) {\n      data[i][j] = calc(i+j);\n\
    \    }\n  }\n  return 0;\n}\n```\n\nRunning this modified code on the same platform\
    \ results in a runtime of 2.5 seconds—half the original single-threaded runtime.\n\
    \nDynamic scheduling avoids the issue of distributing work even across the threads.\
    \ However, it is not apparent in this small example. Rather than use any other\
    \ code to demonstrate it, it is relatively simple to explain the reason for this\
    \ increase in overhead.\n\nWith static scheduling, the threads get their iterations\
