    \ omp section\n  array1 = (double*)malloc(sizeof(double)*1024*1024);\n  #pragma\
    \ omp parallel for shared(array1)\n  for ( int i=0; i<1024*1024; i++ )\nn  {\n\
    \    array1[i] = i;\n  }\n}\n  #pragma omp omp section\n  array2 = (double*)malloc(sizeof(double)*1024*512);\n\
    \  #pragma omp parallel for shared(array2)\n  for ( int i=0; i<1024*512; i++ )\n\
    \  {\n    array2[i] = i;\n  }\n}\n\n```\n\nUsing nested parallelism is complex,\
    \ so detailed discussion is left to specialist texts on the topic of OpenMP.\n\
    \n# Using OpenMP for Dynamically Defined Parallel Tasks\n\nThe OpenMP 3.0 specification\
    \ introduced tasks. A task is a block of code that task will execute at some point\
    \ in the future by the team of threads. Every time the task directive is executed\
    \ at runtime, a new task is created and added to the list of tasks to be completed.\
    \ This fully enables OpenMP to tackle many of the problems that previously could\
    \ only be addressed using threads. As an example, it is possible to write a version\
    \ of the echo server from Chapter 5,\"Using POSIX Threads,\" using OpenMP tasks.\
    \ This example combines parallelism across loops, parallel sections, and nested\
    \ parallelism, with parallel tasks.\n\nThe application uses parallel sections\
    \ to start both a client and a driver thread. Listing 7.38 shows the source code\
    \ to do this. The code uses nested parallelism, so this needs to be enabled by\
    \ calling omp_set_nested() with a nonzero value. The parallel section explicitly\
    \ requests two threads using the num_threads(2) clause. Note that for correct\
    \ execution, the code relies on having at least two virtual CPUs. If the code\
    \ is run on a system with only a single virtual CPU, the will not function correctly\
    \ because it will stall executing the echthread() code and will never get to execute\
    \ the driverthread()."
