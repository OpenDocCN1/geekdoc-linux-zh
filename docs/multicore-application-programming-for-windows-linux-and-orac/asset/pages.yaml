    \    pthread_mutex_lock(&mutex);\n        while ( length == 0 )\n        {\n \
    \           struct timespec now;\n            now.tv_sec = time( 0 ) + 1;\n  \
    \          now.tv_nsec = 0;\n            if ( pthread_cond_timedwait(&cv, &mutex,\
    \ &now ) == ETIMEDOUT )\n            {\n                seconds++;\n         \
