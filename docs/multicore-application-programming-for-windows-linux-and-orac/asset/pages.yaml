  md: '# Chapter 9 Scaling with Multicore Processors


    To summarize this discussion, some algorithms are serial in nature, so to parallelize
    application, the algorithm may need to change. Not all parallel algorithms will
    be equally effective. Critical characteristics are the number of threads an algorithm
    scales to and the amount of overhead that the algorithm introduces.


    In the context of the previous discussion, bubble sort is serial but can be generalized
    to an odd-even sort. This makes better use of multiple threads but is still not
    very efficient algorithm. Changing the algorithm to a quick sort provides a more
    efficient algorithm that still manages to scale to many threads.


    In this particular instance, we have been fortunate that our parallel algorithm
    also happened to be more efficient than the serial version. This need not always
    be the case. It will sometimes be the case that the parallel algorithm scales
    well, but at the cost of lower serial performance. In these instances, it is worth
    considering whether algorithms needs to be implemented and a runtime selection
    made to which is the more efficient.


    There is another approach to algorithms that is not uncommon in some application
    domains, particularly those where the computation is performed across clusters
    with significant internode communication costs. This is to use an algorithm that
    iteratively converges. The number of iterations required depends on the accuracy
    requirements for the calculation. This provides an interesting tuning mechanism
    for parallelizing the algorithm.


    It is probably easiest to describe this with an example. Suppose the problem is
    to model the flow of a fluid along an obstructed pipe. It is easy to split the
    pipe into multiple sections and allocate a set of threads to perform the computation
    for each section. However, the results for one section will depend on the results
    for the adjacent sections. So, the true calculation requires a large volume of
    data to be exchanged at the intersections.


    This exchange of data would serialize the application and limit the amount of
    scaling that could be achieved. One way around is to approximate the values from
    the adjacent sections and refine those approximations as the adjacent sections
    refine their results. In this way, it is possible to make the computations nearly
    independent of each other. The cost of this approximation is that it will take
    more iterations of the solver for it to converge on the correct answer.


    This kind of approach is often taken with programs on clusters where there is
    significant cost associated with exchanging data between two nodes. The approximations
    enable each node to continue processing in parallel. Despite the increased number
    of iterations, this approach can lead to faster solution times.


