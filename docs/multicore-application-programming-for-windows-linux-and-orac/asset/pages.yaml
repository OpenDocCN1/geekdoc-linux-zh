    # Scaling of Library Code


    Issues are not restricted to just the application. It is not surprising to find
    scaling issues in code provided in libraries. One of the most fundamental library
    routines is the memory allocation provided by malloc() and free(). The code shown
    in Listing 9.11 represents a very simple benchmark of malloc() performance as
    the number of threads increases, and each thread repeatedly allocates and frees
    a chunk of 1KB memory. The application completes after a fixed number of malloc()
    and free() calls have been completed by the team of threads.'
