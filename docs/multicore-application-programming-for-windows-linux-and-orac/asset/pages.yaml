    \    return total;\n}\n```\n\nAnother scheduling mode is guided. With guided scheduling,\
    \ the size of the chunk of work assigned is proportional to the amount of work\
    \ remaining. Initially the threads will get assigned large chunks of work, but\
    \ then they get smaller chunks until all the work is completed. Guided scheduling\
    \ can also take an optional parameter that determines the smallest chunk to be\
    \ used. The default minimum chunk size is a single iteration. Listing 7.35 shows\
    \ an example of guided scheduling.\n\n# Listing 7.35 Guided Scheduling with Chunk\
    \ Size Calculated at Runtime\n\n```\ndouble sum( double *a, int n )\n{\n    double\
