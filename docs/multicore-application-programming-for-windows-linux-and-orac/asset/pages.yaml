    \ if it is expected that the application will end scaling beyond a single system.\n\
    \n# Reentrant Code and Compiler Flags\n\nDepending on the platform and compiler,\
    \ it may be necessary to compile with special flags to indicate that the application\
    \ is multithreaded. On some platforms, gcc has the flag -pthread, which links\
    \ in the POSIX threading library and defines _REENTRANT. The Solaris compiler\
    \ has the flag -mt, which performs the same task; only the flag defined is _REENTRANT.\n\
    \nDefining the preprocessor flag includes a set of \"reentrant\" functions to\
    \ go with the usual set. The reentrant versions are denoted by the _postfix. The\
    \ reason these functions exist is that the C library functions are selfish, meaning\
    \ that a call to the function sets up some state that is then used in function\
    \ calls. This statefulness means that multiple threads cannot call the function\
    \ at the same time without the state becoming corrupted. The reentrant versions\
    \ of the functions typically use a structure that the calling thread provides\
    \ to hold the state for that calling thread. The code in Listing 5.75 uses the\
    \ readdir() call to print out the contents of the current directory.\n\n# Listing\
    \ 5.75 Multithread Unsafe Code for Listing a Directory\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint main()\n{\n  DIR * directory = opendir(\".\" );\n \
    \ while ( 1 )\n{\n    struct dirent * entry = readdir( directory);\n    if (entry!=0)\n\
    \    {\n      printf(\"%s\\n\", entry->d_name );\n    }\n    else\n{\n      closedir(\
