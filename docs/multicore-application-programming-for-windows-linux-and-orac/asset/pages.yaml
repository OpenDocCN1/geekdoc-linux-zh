  md: '# How Structure Impacts Performance


    inlining a routine from one source file into the place where it''s called in another
    source file. This can negate much of performance loss incurred by the structure
    used to store the source code. Cross-file optimization will be discussed in more
    detail in the section “How Cross-File Optimization Can Be Used to Improve Performance."


    Some methodologies reduce the ability of the compiler to perform optimizations
    across source files. One common approach to building is to use either static or
    dynamic libraries as part of the build process. These libraries combine a number
    of object files into a single library, and at link time, the linker extracts the
    relevant code from the library.


    Listing 2.7 shows the steps in this process. In this case, two source files are
    combined into a single archive, and that archive is used to produce the application.


    # Listing 2.7 Creating an Archive Library


    ```

    $ cc -c a.c

    $ cc -c b.c

    $ ar -r lib.a a.o b.o

    at: creating lib.a

    $ cc main.c lib.a

    ```


    There are three common reasons for using static libraries as part of the build
    process:


    +   - For “aesthetic” purposes, in that the final linking of the application requires
    fewer objects. The build process appears to be cleaner because many individual
    object files are combined into static libraries, and the smaller set appears on
    the link line. The libraries might also represent bundles of functionality provided
    to the executable.


    +   - To produce a similar build process whether the application is built to use
    static or dynamic libraries. Each library can be provided as either a static or
    a dynamic version, and it is up to the developer to decide which they will use.
    This is common when the library is distributed as a product for developers to
    use.


    +   - To hide build issues, but this is the least satisfactory reason. For example,
    an archive library can contain multiple versions of the same routine. At link
    time, the linker will extract the first version of this routine it encounters,
    and it will not warn that there are multiple versions present. If the same code
    was linked using individual object files without having combined the object files
    into an archive, the linker would fail to link the executable.


    Listing 2.8 demonstrates how using static libraries can hide problems with multiply
    defined functions. The source files a.c and b.c both contain a function status().
    When they are combined into an archive and linked into an executable, the linker
    will extract one of the two definitions of the function. In the example, the linker
    selects the definition from a.c. However, the build fails with a multiply defined
    symbol error if an attempt is made to directly link the object files into an executable.'
