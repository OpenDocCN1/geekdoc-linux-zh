    improvements (issuing multiple instructions at the same time, and so on). However,
    recent processors have increased the number of cores on the chip rather than emphasizing
    gains in the performance of a single thread running on the processor. The core
    of a processor is the part that executes the instructions in an application, so
    having multiple cores enables a single processor to simultaneously execute multiple
    applications.


