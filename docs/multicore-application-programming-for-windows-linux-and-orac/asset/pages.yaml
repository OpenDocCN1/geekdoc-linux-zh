    \ 5.16 Output from Both Original and Child Threads\n\n```\n$ cc -mt t.c\n$ ./a.out\n\
    In thread code\nIn main thread\n```\n\nHowever, sometimes the application will\
    \ produce output only from the main thread, as shown in Listing 5.17.\n\nListing\
    \ 5.17 Output from Only the Original Thread\n\n```\n$ ./a.out\nIn main thread\n\
    ```\n\nThe reason for this behavior is that sometimes the main thread terminates\
    \ before the child thread had time to execute. To avoid this, the main thread\
    \ needs to call pthread_exit(), which for the main thread, will wait until all\
    \ the other threads have terminated before exiting. This is true, even if the\
    \ child threads have been detached. Listing 5.18 shows a version of the code with\
    \ this change."
