    # Using Parallelism to Improve the Performance of a Single Task


    Virtualization provides one way of utilizing a multicore or multiprocessor system
    by extracting parallelism at the highest level: running multiple tasks or applications
    simultaneously. For a user, a compelling feature of virtualization is that utilizing
    this level of parallelism becomes largely an administrative task.


    But the deeper question for software developers is how multiple cores can be employed
    to improve the throughput or computational speed of a single application.The next
    section discusses more tightly integrated parallelism for enabling performance
    gains.


    # One Approach to Visualizing Parallel Applications


    One way to visualize parallelism conceptually is to imagine that there are two
    of you; each thinks the same thoughts and behaves in the same way. Potentially,
    you could achieve as much as one of you currently, but there are definitely some
    issues that the two of you will have to face.


    You might imagine that your double could go out to work while you stay home and
    read books. In this situation, you are implicitly controlling your double:You
    tell them what to do.


    However, if you are identical, your double would also prefer to stay home and
    read while you go out to work. So, perhaps you would have to devise a way to determine
    which of you goes to work today—maybe splitting the work so that one would go
    one week, and the other the next week.'
