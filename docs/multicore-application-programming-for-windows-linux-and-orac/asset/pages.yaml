  md: "Memory-carried dependencies are more subtle. These represent the situation\
    \ where a memory access must be ordered with respect to another memory access\
    \ to the same location. Consider the snippet of code in Listing 3.5.\n\n# Listing\
    \ 3.5 Code Demonstrating Ordering Constraints\n\n```\nint val=0;\n\nvoid g() {\n\
    \    val = 1;\n}\n\nvoid h() {\n    val = val + 2;\n}\n```\n\nIf the routines\
    \ g() and h() are executed by different threads, then the result depends on the\
    \ order in which the two routines are executed. If g() is executed followed by\
    \ h(), then val will hold the result 3. If they are executed in the opposite order,\
    \ then val will contain the result 1. This is an example of a memory-carried dependence\
    \ because to produce the correct answer, the operations need to be performed in\
    \ the correct order.\n\n# Antidependencies and Output Dependencies\n\nSuppose\
    \ one task, A, needs the data produced by another task, B; A depends on B and\
    \ cannot start until B completes and releases the data needed by A. This is referred\
    \ to as true dependency. Typically, B writes some data, and A needs to read that\
    \ data. There are other combinations of two threads reading and writing data.\
    \ Table 3.1 illustrates the four ways that tasks might have a dependency.\n\n\
    # Table 3.1 Possible Ordering Constraints\n\n| First task | Second task |\n|---|---|\n\
    | Read | Write |\n| | Read after read (RAR) | Write after read (WAR) |\n| | No\
    \ dependency | Antidependency |\n| Write | Read after write (RAW) | Write after\
    \ write (WAW) |\n| | True dependency | Output dependency |\n\nWhen both threads\
    \ perform read operations, there is no dependency between them, and the same result\
    \ is produced regardless of the order the threads run in."
  merge: -1
  img_proc: true
