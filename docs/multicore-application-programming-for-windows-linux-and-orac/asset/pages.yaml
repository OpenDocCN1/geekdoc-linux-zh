  md: "# The ABA Problem\n\nThis example is an instance of a general problem called\
    \ the ABA problem. The ABA problem is the situation where a thread is switched\
    \ off the virtual CPU when the program is in state off-CPU, the system changes\
    \ into a second state, B, before returning to state A. This is different from\
    \ the original state but looks identical to the thread that switched back onto\
    \ a virtual CPU. When the first thread returns to the CPU, it continues to act\
    \ as if the state had not changed, and this causes an error.\n\nIn the circular\
    \ buffer problem described in the previous section, the first thread is taken\
    \ off the virtual CPU while believing it has a pointer to a free slot. When it\
    \ returns to CPU, it has a pointer to what it believes is the free slot, but it\
    \ has no indication that the state of the rest of the system has changed.\n\n\
    A general solution to the ABA problem is to encode a version number with any stored\
    \ data. In this example of the circular buffer, the data would be accompanied\
    \ by this version number, and the version number would be incremented every time\
    \ the circular buffer was traversed.\n\nWith this version number, the thread that\
    \ took off-CPU would have to match both the version number and the data for it\
    \ to successfully add or remove an element from the buffer.\n\nAdding the version\
    \ number has reduced but not eliminated the possibility that a thread might return\
    \ to the CPU to find a match of version number and data. However, the probability\
    \ can be so small as to be practically impossible.\n\nFor example, if the version\
    \ number is held as a 4-bit integer, then there are more than 4 billion possible\
    \ values. If the code traverses the circular buffer 1,000 times a second, it would\
    \ take one and a half months before the version number was repeated. The race\
    \ condition can occur only if the version number matches the version number when\
    \ a thread is context switched back onto the CPU. No thread would be switched\
    \ off the CPU for a month and a half, so the race condition will not occur.\n\n\
    The code in Listing 8.29 is a modified version of the circular buffer code that\
    \ includes a version number for each element of the buffer. The version is incremented\
    \ in the routine nextupdate every time the counter wraps around the buffer.\n\n\
    # Listing 8.29 Using Version Numbers to Avoid the ABA Problem\n\n```\nunion ABAValue\n\
    {\n  long long value;\n  struct element\n```"
