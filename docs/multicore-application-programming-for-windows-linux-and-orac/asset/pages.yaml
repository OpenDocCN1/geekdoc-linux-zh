  md: "# Grids\n\nPossibly the simplest approach to utilizing multiple compute threads\
    \ is to use a grid. A grid is a collection of nodes. A task can be dispatched\
    \ to the grid, and at some point the results of that task will be returned to\
    \ the user.\n\nConceptually, a grid is the task management of MapReduce without\
    \ the \"map\" and \"reduce\" algorithms for performing computation. A grid will\
    \ provide much greater node management functionality than a MapReduce implementation.\
    \ Node management might extend to powering down idle nodes or allocating clusters\
    \ of work to co-located nodes. So, the two approaches will be complementary in\
    \ nature.\n\n# Transactional Memory\n\nWe have already talked about some of the\
    \ complexities of implementing a functionally correct parallel application. One\
    \ particular problem is that data races. In a large program, it can be quite hard\
    \ to eliminate all possible races. Even using data detection tools does not guarantee\
    \ that there are no further races hidden in the code.\n\nThe safe software solution\
    \ is to use mutex locks around potentially critical sections of code. The mutex\
    \ locks ensure that only a single thread can access the critical variables and\
    \ hence that the application will work correctly. However, mutex locks impose\
    \ a performance penalty on access to the shared variables and also work only if\
    \ all accesses to the variables are protected by a common lock.\n\nThe idea of\
    \ transactional memory is to address both issues. Transactional memory is really\
    \ aimed at the correctness issue. It can also make a difference to performance,\
    \ as is an additional benefit rather than a critical benefit.\n\nTransactional\
    \ memory enables the developer to protect accesses within a transaction. A transaction\
    \ is a block of code that either completes successfully or fails and does not\
    \ result in any change to system state.\n\nA common syntax for transactions has\
    \ not yet been developed. One possibility is the use of the keyword atomic to\
    \ wrap the entire transaction. Listing 10.25 shows an example of this. The transaction\
    \ moves a value from one location in an array to another. The keyword atomic indicates\
    \ that the specified amount must be moved atomically between the two locations\
    \ in an array. Since transactions can fail, the atomic keyword implicitly retry\
    \ the transaction until it successfully completes. The critical points here are\
    \ first that the transaction cannot leave the data in an unclean partially completed\
    \ state and second that no other process can see a partially completed transaction.\
    \ This makes the use of the keyword atomic appropriate.\n\nListing 10.25 Accessing\
    \ Multiple Accounts in a Single Transaction\n\n```\nvoid move(int from, int to,\
    \ int value )\n{\n  atomic\n  {\n    accounts[from] -= value;\n```"
