    \ the lock as a writer, the call is `pthread_rwlock_trywlock()`. Listing 5.28\
    \ shows an example of these calls.\n\n# Listing 5.28 Updating a Shared Value Only\
    \ If the Read-Write Lock Is Acquired\n\n```\nvoid typeUpdate(int value)\n{\n \
    \   if (pthread_rwlock_trylock(&lock) == 0)\n    {\n        count += value;\n\
    \        pthread_rwlock_unlock(&lock);\n    }\n}\n```\n\nThere is a further option\
    \ of using a timeout when acquiring the lock. The routines `pthread_rwlock_timedlock()`\
    \ and `pthread_rwlock_timedwlock()` return 0 if the lock is acquired or an error\
