    \ for items to be placed in the queue. In situations where there are already items\
    \ in the queue, the consumer thread will not have stopped.\n\nIt is also possible\
    \ to use broadcast to signal to all waiting threads that there is an item in the\
    \ queue. The function pthread_cond_broadcast() wakes all the threads waiting on\
    \ the condition variable. In the version of the producer shown in Listing 5.43.\n\
    \n# Listing 5.43 Broadcasting the Arrival of a New Item to All Waiting Threads\n\
