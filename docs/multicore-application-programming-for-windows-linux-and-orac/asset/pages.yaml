- pgno: 155
  md: '# Memory, Shared Memory, and Memory-Mapped Files


    The easiest way for multiple threads to communicate is through memory. If two
    threads access the same memory location, the cost of access is little more than
    the memory latency of access. Of course, memory accesses still need to be controlled
    to ensure that only one thread writes to the same memory location at a time. A
    multithreaded application will share memory between threads by default, so this
    can be a very low-cost approach. The only things not shared between threads are
    variables on the stack of each thread (local variables) and thread-local variables,
    which will be discussed later.


    Sharing memory between multiple processes is more complicated. By default, all
    processes have independent address spaces, so it is necessary to reconfigure regions
    of memory that can be shared between different processes.


    To set up shared memory between two processes, one process will make a library
    call to create a shared memory region. The call will use a unique descriptor for
    shared memory. This descriptor is usually the name of a file in the file system.
    The create returns a handle identifier that can then be used to map the shared
    memory region into the address space of process. This mapping returns a pointer
    to the newly mapped memory. This pointer is exactly like the pointer that would
    be returned by malloc() and can be used to access memory within the shared region.


    When each process exits, it detaches from the shared memory region, and then the
    last process to exit can delete it. Listing 4.15 shows the rough process of creating
    and deleting a shared memory.


    # Listing 4.15 Creating and Deleting a Shared Memory Segment


    ```

    ID = Open SharedMemory( Descriptor );

    Memory = Map SharedMemory( ID );

    ...

    Memory[100]++;

    ...

    Close SharedMemory( ID );

    Delete SharedMemory( Descriptor );

    ```


    Listing 4.16 shows the process of attaching to an existing shared memory segment.
    In this instance, the shared memory region is already created, so the same descriptor
    it can use is to attach to the existing shared memory region. This will provide
    the process with an ID that can be used to map the region into the processes.


    # Listing 4.16 Attaching to an Existing Shared Memory Segment


    ```

    ID = Open SharedMemory( Descriptor );

    Memory = Map SharedMemory( ID );

    ...

    Close SharedMemory( ID );

    ```'
