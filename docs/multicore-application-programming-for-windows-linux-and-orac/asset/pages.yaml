  md: "# 174 Chapter 5 Using POSIX Threads\n\n```\nprintf(\"Received %i\\n\", item);\n\
    }\n}\n\n```\n\nIn this version of the code, the consumer threads wait on the condition\
    \ variable for each iteration of the loop. If the condition variable is signaled\
    \ before the consumer thread reaches the wait call, the signal is lost, and the\
    \ consumer will wait until the next signal. If no further work is produced by\
    \ the producer, the consumer thread will wait indefinitely, even though it has\
    \ work waiting. This problem is compounded if the thread is set to signal only\
    \ when new work was added to an empty queue; in this instance, the consumer thread\
    \ will never get signaled, and the producer will keep adding to the queue.\n\n\
    Condition variables have a method to provide a timeout when being signaled by\
    \ the condition variable. The call is pthread_timedwait(), which takes the timeout\
    \ period, specified as an absolute time, well as the condition variable and mutex.\
    \ This call will return either holding the mutex lock or an error code indicating\
    \ the reason for the return. The code in Listing 5.46 illustrates using this function\
    \ call to count the number of minutes waited until the condition variable was\
    \ signaled.\n\n# Listing 5.46 Using a Timeout to Count Elapsed Minutes\n\n```\n\
    #include <time.h>\n#include <errno.h>\n```\n\n```\nvoid * consumer(void* param\
