  md: '# 3 Identifying Opportunities for Parallelism


    This chapter discusses parallelism, from the use of virtualization to support
    multiple operating systems through the use of multiple threads within a single
    application. It also covers the concepts involved in writing parallel programs,
    some ways of visualizing parallel tasks, and ways of architecting parallel applications.
    The chapter continues with a discussion of various parallelization strategies,
    or patterns. It concludes by examining some of the limitations of the chapter,
    you should be in a position to understand some of the ways that a system can support
    multiple applications and that an existing application might be modified to utilize
    multiple threads. You will also be able to identify places in the code where parallelization
    might be applicable.


    # Using Multiple Processes to Improve System Productivity


    Consider a home computer system. This will probably have only one active user
    at a time, but that might be running a number of applications simultaneously.
    A system where there is a single core produces the illusion of simultaneous execution
    of applications by switching between the active applications many times every
    second. A multicore system has the advantage of being able to truly run multiple
    applications at the same time.


    A typical example of this happens when surfing the Web and checking e-mail. You
    may have an e-client downloading your e-mail at the same time your browser is
    rendering a web page in the background. Although these applications will utilize
    multiple threads, they do not require much processor time; their performance is
    typically dominated by the time it takes to download mail or web pages from remote
    machines. For these, even a single-core processor provides sufficient processing
    power to produce a good user experience. However, a single-core processor can
    get saturated if the e-client is indexing mail while an animation-heavy web page
    is being displayed.'
