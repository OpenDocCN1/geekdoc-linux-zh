  md: "# Using OpenMP to Produce a Parallel Application\n\n# Performing Operations\
    \ Atomically\n\nSometimes, all that is necessary is the atomic modification of\
    \ a variable. OpenMP supports this through the atomic directive that applies only\
    \ to the following modification of a variable. Listing 7.55 shows how the reduction\
    \ could be coded using an atomic directive. The atomic directive ensures correct\
    \ behavior may not be any faster than using a critical section.\n\nListing 7.55\
    \ Reduction Implemented Using an Atomic Directive\n\n```\ndouble calc(double*\
    \ array, int length)\n{\n    double total = 0.0;\n    #pragma omp parallel for\n\
    \    for (int i=0; i<length; i++)\n    {\n        #pragma omp atomic\n       \
    \ total += array[i];\n    }\n    return total;\n}\n```\n\n# Using Mutex Locks\n\
    \nOpenMP also supports the flexibility offered by mutex locks, which are supported\
    \ through OpenMP locks. A lock is declared to be of the type omp_lock_t and initialized\
    \ through a call to omp_init_lock(). The lock is destroyed with a call to omp_destroy_lock().\
    \ To acquire the lock, the code calls omp_unset_lock(). The code can test whether\
    \ the lock is available by calling omp_test_lock(). It is possible to rewrite\
    \ the reduction code to use OpenMP locks, as shown in Listing 7.56.\n\nListing\
    \ 7.56 Reduction Implemented Using an OpenMP Lock\n\n```\n#include <omp.h>\nomp_lock_t\
    \ lock;\ndouble calc(double* array, int length)\n{\n    double total = 0.0;\n\
    \    #pragma omp parallel for\n    for (int i=0; i<length; i++)\n    {\n     \
    \   omp_set_lock(&lock);\n        total += array[i];\n        omp_unset_lock(&lock);\n\
    \    }\n}\n```"
