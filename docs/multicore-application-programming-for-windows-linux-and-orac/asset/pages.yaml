  md: "# Chapter 4 Synchronization and Data Sharing\n\n```\nIf (Item on Queue())\n\
    {\n  Item = remove Queue();\n}\nUntil ( Item != 0 );\nReleaseMutex();\n```\n\n\
    The consumer thread will wait on the condition variable if the queue is empty.\
    \ The producer thread signals to wake it up, it will first check to see whether\
    \ there is anything on the queue. It is quite possible for the consumer thread\
    \ to be woken only to find the queue; it is important to realize that the thread\
    \ waking does not imply that the condition is now true, which is why the code\
    \ is in a repeat loop in the example. If there is an item on the queue, then the\
    \ consumer thread can handle that item; otherwise, it returns to sleep.\n\nThe\
    \ interaction with the mutex is interesting. The producer thread needs to acquire\
    \ the mutex before adding an item to the queue. It needs to release the mutex\
    \ after adding the item to the queue, but it holds the mutex when signaled. The\
    \ consumer thread cannot be woken until the mutex is released. The producer thread\
    \ releases the mutex after the signaling has completed; releasing the mutex is\
    \ necessary for the consumer thread to make progress.\n\nThe consumer acquires\
    \ the mutex; it will need it to be safely modify the queue. If there are no items\
    \ on the queue, the consumer thread will wait for an item to be added. The call\
    \ to wait on the condition variable will cause the mutex to be released, and the\
    \ consumer thread will wait to be signaled. When the consumer thread wakes up,\
    \ it will hold the mutex; either it will release the mutex when it has removed\
    \ an item from the queue, or if there is still nothing in the queue, it will release\
    \ the mutex with another call to the condition variable.\n\nThe producer can use\
    \ two types of wake-up calls: Either it can wake a single thread or it can broadcast\
    \ to all threads. Which one depends on the context. If there are multiple items\
    \ of data ready for processing, it makes sense to wake up multiple threads with\
    \ a broadcast. On the other hand, if the producer has added only a single item\
    \ to the queue, it is more appropriate to wake up only a single thread. If all\
    \ the threads are awakened, it can take some time for all the threads to wake\
    \ up, execute, and return to waiting, placing an unnecessary burden on the system.\
    \ Notice that each thread has to the mutex when it wakes up, the process of waking\
    \ all the waiting thread is serial; only a single thread can be woken at a time.\n\
    \nThe other point to observe is that when a wake-up call is broadcast to all threads,\
    \ some of them may be woken when there is no work for them to do. This is one\
    \ reason why it is necessary to place the wait on the condition variable in a\
    \ loop.\n\nThe other problem to be aware of with condition variables is the lost\
    \ wake-up. This occurs when the signal to wake the waiting thread is sent before\
    \ the thread is ready"
