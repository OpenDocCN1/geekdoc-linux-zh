- pgno: 437
  md: '# Chapter 11. Concluding Remarks


    multicore processors share the cores resources may make it more effective to use
    multiple threads than to try to improve the performance of a single thread.


    A single thread running on the otherwise idle multicore machine may get more than
    its fair share of resources. Adding a second thread will reduce the available
    resources. However, while one of threads is stalled, the other will still have
    access to the full resources of the core.


    Hence, for a multicore processor, the time that a thread spends stalled represents
    time when other threads can make forward progress. The practical result of this
    is that there may be no benefit in throughput from eliminating all cycles from
    every thread.


    An alternative way of thinking about this is that a multicore processor is issuing
    an instruction at every opportunity, there is no further benefit to be had from
    removing stall cycles from the threads running on it. Each thread will spend some
    amount of time waiting to issue another regardless regardless of it spends its
    time waiting for a stall condition to resolve or just waiting while other threads
    issue instructions.


    The end result is that multicore processors do three things that simplify the
    development of applications:


    +   - They provide the necessary hardware to run parallel applications.

    - They reduce the synchronization costs of parallel applications.

    - They reduce the impact of instruction stream stalls, so it becomes less critical
    to produce optimal code.


    # The Future


    This book has covered a number of approaches to producing parallel applications.
    We have discussed the classic approaches of POSIX threads, Windows native threads,
    and OpenMP We have also covered some of the emerging alternatives such as Intel''s
    Threading Blocks and CUDA from Nvidia.


    What is certain that is now critical to be familiar with writing parallel programs.
    Parallelism is pervasive; it is no longer possible, desirable, to assume that
    increasing single-threaded performance will solve the performance issues of an
    application. The opportunity is to double or quadruple application performance
    using multiple threads.


    As a result of reading this book, you should be able to identify and use the tools
    that you need to write parallel programs that are functionally correct and scale
    well to many cores.


    Multicore processors represent the perfect storm for parallel programming. They
    provide the developer with plenty of threads, and they reduce the impact of the
    traditional limitations to scaling. The low synchronization costs and costs of
    data sharing of multicore processors make it possible to produce applications
    that potentially scale to greater numbers of threads or perhaps scale on parts
    of the code that previously were too short to parallelize profitably.'
