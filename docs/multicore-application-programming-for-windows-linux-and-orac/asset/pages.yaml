- pgno: 92
  md: "The compiler cannot determine whether the memory location where the variable\
    \ total is stored is part of the array. It has to make the false assumption that\
    \ the variable is part of the array, which results in code that stores the value\
    \ of the variable back to memory in every iteration. The loop shown in Listing\
    \ 2.46 comes from the code compiled at a low level of optimization.\n\n# Listing\
    \ 2.46 Containing Store Operation Because of Potential Aliasing\n\n```\ntop:\n\
    ld      [%ol],%f0    ! Load of array[i]\nadd     %04,1,%o4      ! Increment\n\
    add     %01,1,%o0      ! Increment pointer to array[i];\ncmp     %04,%f5     \
    \  ! Check for end of loop\nfadded %f2,$f0,$f4    ! Perform addition\nstd    \
    \ %f4,[i0]       ! Store of the variable top\nbl,a,pt %icc,top    ! Loop to top\n\
    ld      [%0],f2       ! Reload of the variable total\n```\n\nAt higher levels\
    \ of optimization, the compiler can vary the loop so that the version that performs\
    \ the store to memory can be avoided if the loop contains no alias. Listing 2.47\
    \ shows the equivalent source code.\n\n# Listing 2.47 Source Code Showing Two\
    \ Versions of Loop with Potential Pointer Aliasing\n\n```\nvoid sum(double *total,\
    \ double *array, int len ) {\n  if ( (total < array) || (total > array + len ))\
    \ {\n    double tmp = *total;\n    for (int i=0; i<len; i++) {\n      tmp += array[i];\n\
    \    }\n    *total = tmp;\n  } else {\n    for (int i=0; i<len; i++) {\n     \
    \ *total += array[i];\n    }\n  }\n}\n```\n\nThe modified source code uses a temporary\
    \ variable to hold the calculated value so that the compiler knows no aliasing\
    \ is possible. This is a good technique to use in order to avoid possible aliasing\
    \ issues with pointers to global data."
  merge: -1
  img_proc: true
- pgno: 93
  md: "# Chapter 2 Coding for Performance\n\nThere are two fundamental performance\
    \ issues in the presence of potential aliasing. The first is illustrated in the\
    \ example disassembly in Listing 2.46. Aliasing requires the compiler to include\
    \ unnecessary stores or loads of variables. It is possible to identify this problem\
    \ by counting the generated memory operations and confirming that this corresponds\
    \ to the expected number from the source code.\n\nThe second issue is more subtle\
    \ and involves the ability of the compiler to reorder instructions. Often, a compiler\
    \ will move loads earlier in the instruction stream to give them more time to\
    \ complete and moves stores to later in the instruction stream to give more time\
    \ for the instruction feeding to data. Unfortunately, aliasing issues limit the\
    \ ability of the compiler to do this. When the disassembly is viewed, the problem\
    \ appears as a store instruction followed immediately by a load instruction. This\
    \ schedule ensures the correct memory ordering, but it may not be optimal for\
    \ performance.\n\n# Listing 2.48 Code with Potential Aliasing Issues\n\n```\n\
    void func(int * a, int * b)\n{\n    (*a)++;\n    (*b)++;\n}\n```\n\nWhen compiled,\
    \ this code produces the SPARC assembly code shown in Listing 2.49.\n\n# Listing\
    \ 2.49 SPARC Assembly Code Produced in the Presence of Possible Pointer Aliasing\n\
    \n```\nld      [%0],%5    Load *a\nadd     %0,1,%5    Increment\nst     [%5,%o0]\
    \   Store *a    // Store of first variable\nld      [%1],o4    Load *b     //\
    \ Load of second variable\nadd     %o4,1,%o4   Increment\nst     [%o3,%o1]   Store\
    \ *b\n```\n\nThe store of a variable needs to be completed before the load of\
    \ the variable b is issued. The code shown in Listing 2.50 has no pointer aliasing\
    \ problems.\n\n# Listing 2.50 Code with No Aliasing Problems\n\n```\nvoid func(int\
    \ * a)\n{\n    a[0]++;\n    a[1]++;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 94
  md: "# The Role of the Compiler\n\nCompiling the code shown in Listing 2.50 produces\
    \ the SPARC assembly code\nshown in Listing 2.51.\n\n# Listing 2.51 SPARC Assembly\
    \ Code Produced in the Absence of Pointer Aliasing\n\n```\nld      [%0],%0   \
    \   ! Load a[0]\n      [%0+4],%4   ! Load a[1] // Load of second variable\nadd\
    \     %5,1,%5       ! Increment\nst      %5,[0]        ! Store a[0] // Store of\
    \ first variable\nadd     %04,1,%3      ! Increment\nst      %3,[%1]       ! Store\
    \ a[1]\n```\n\nBecause the compiler is able to tell that there is no aliasing\
    \ between the two operations, it can reorder the instructions as early as possible.\n\
    A bigger problem with aliasing is that it often inhibits the compiler's ability\
    \ to perform complex transformations of the code. Once the code has more than\
    \ two input data, it becomes very difficult to produce runtime code that dynamically\
    \ checks for aliasing issues. For instance, the compiler would find runtime checking\
    \ for aliasing difficult for the code shown in Listing 2.52. In this case, the\
    \ matrix a is accessed continuously as the compiler has knowledge of the range\
    \ of memory that will be modified.\nThe matrix b is accessed through the first\
    \ index, which is a pointer into multiple arrays. Any of these arrays might overlap\
    \ with the one pointed to by a.\n\n# Listing 2.52 Code Where Runtime Checking\
    \ of Aliasing Is Difficult\n\n```\nvoid add(double **a, double **b)\n{\n  for(int\
    \ i=0; i<100; i++) {\n    for(int j=0; j<100; j++) {\n      a[i][j] += b[i][j];\n\
    \    }\n  }\n}\n```\n\nThere are multiple ways to avoid aliasing issues. The first\
    \ is to use local or stack-based variables. The compiler knows that these variables\
    \ cannot alias with global variables; therefore, it can produce code based on\
    \ this knowledge. For scalar variables with aliasing problems, this can be the\
    \ simplest solution.\nAnother approach is to advise the compiler what assumptions\
    \ is allowed to make about the code. The Solaris Studio compiler supports the\
    \ flag -xalias_level=level, which allows the developer to specify, fix the degree\
    \ of aliasing that occurs.\nThe compiler also supports the flag -restrict, which\
    \ tells the compiler that pointers passed into functions do not alias. Incidentally,\
    \ this is the default for the Fortran language.\nThe gcc compiler supports the\
    \ flag -fansi-alias, which tells the compiler that the code has aliasing that\
    \ conforms to the C standard. The biggest issue with these flags is that they\
    \ specify aliasing at the file or application level, and for large applications\
    \ it can be difficult or impossible to prove that applying the flags is safe."
  merge: -1
  img_proc: true
- pgno: 95
  md: "# Chapter 2 Coding for Performance\n\nCompilers often support pragmas or directives\
    \ that can be added to the source code to indicate the degree of aliasing at a\
    \ function level. The finer level of control means that the directives can be\
    \ added in places (a) where the biggest performance impact is seen and (b) where\
    \ the developer can be certain that aliasing does not occur. However, compiler\
    \ pragmas or directives are rarely the same across compilers, using them may lead\
    \ to code that only complies with a particular compiler and is not portable to\
    \ others.\n\nThe most effective solution to the aliasing problem for C-language\
    \ programs is the restrict keyword. This enables the developer to use restrict-qualified\
    \ pointers. These tell the compiler that no other pointers point to the same memory\
    \ at the position in the code where the pointer is assigned. This is most useful\
    \ for when pointers are passed into functions. Listing 2.53 shows the code modified\
    \ to use the restrict keyword.\n\nListing 2.53 Code Modified to Use the restrict\
    \ Keyword\n\n```\nvoid add(double ** a, double ** b) {\n    for (int i=0; i<100;\
    \ i++)\n        for (int j=0; j<100; j++)\n            a[i][j] += b[j][i];\n}\n\
    ```\n\nThe fact that every array a or b is restrict-qualified means that there\
    \ is no aliasing between the arrays and means the compiler can generate more efficient\
    \ code.\n\n# Identifying When Time Is Spent Using Profiling\n\nAs soon as it is\
    \ possible to run the application with meaningful results, a runtime file of the\
    \ application should be collected. Profiling is important for multiple reasons,\
    \ the most fundamental of which is what is not measured is not managed. If the\
    \ performance of the application is not monitored as it develops, then there is\
    \ no mechanism to identify changes that impact the performance of the application.\
    \ However, there are other reasons for this:\n\n+   Verifying that the time is\
    \ mainly spent in the functionally critical part of the code. Applications will\
    \ go through multiple states at runtime, some concerned with start-up or teardown,\
    \ but there will be a critical section of code that actually defines the purpose\
    \ of the application. The time should be spent in the critical sections of the\
    \ code and not in the parts of the code that facilitate the code. Imagine an application\
    \ that loads data from a database, performs some analysis of that data, and then\
    \ produces a chart as output. Time spent doing the analysis is probably the critical\
    \ purpose of the application, and the bulk of the time should be spent there.\
    \ The other sections of code should be completed as quickly as possible. If this\
    \ is not the case, then you might question the code used in those stages."
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Identifying Where Time Is Spent Using Profiling


    Depending on where the time is spent, this might be the method of retrieving the
    data or the complexity of the charts being printed.


    +   - Avoid time spent in noncritical or error-handling code. A frequent performance
    sink for applications is code that shouldn''t be executed. This might be exception-handling
    code, writing error messages to stderr, or code that was meant to only handle
    corners cases. Once an application is profiled, it is relatively easy to identify
    sections of the code that were not expected to be visible in the profile.

    - Checking the distribution of time between user, system, and other program states.
    Some applications might spend significant time in system code or some kind of
    waiting. System time might be necessary for the application to perform its task,
    but it could be an indication of something going wrong or being poorly coded.
    An application might spend system time calling a heavyweight function to get the
    data for a time stamp when a lighter alternative exists. Similarly, an application
    might spend significant time waiting for data to be returned across the network
    or waiting for the screen to redraw; performance might be improved by having a
    second thread running on computation while the main thread is in the wait state.

    - Detecting time spent in exceptional conditions. These might be software traps
    handling floating-point calculations involving subnormal numbers, or they could
    be something mundane as TLB misses. These conditions are hard to detect because
    they may not cause additional system time, but they are detectable through observation
    using hardware counters or by careful examination of the exact language instruction
    where the time is attributed


    Profiling applications as they are written and used is the most effective way
    of managing the performance of the application and should be routinely done during
    the development cycle as any changes are made to the application.


    # Commonly Available Profiling Tools


    Most profiling tools do not require you to do anything to the application. However,
    it is often beneficial to build the application with debug information. The debug
    information can enable the tools to aggregate runtime at the level of individual
    lines of source code. There are also two common approaches to profiling.


    The first approach is system-wide profiling: this approach taken by tools such
    as Intel''s VTune, AMD''s CodeAnalysis, and the open source profiling tool profile.
    The entire system is profiled, and timing information is gathered for all the
    processes running on the system. This is a very useful approach when there are
    a number of applications running on the system. During the analysis of the data,
    it is normal to focus on a single application.


    Figure 2.9 shows the output from the AMD CodeAnalysis listing all the active processes
    on the system.'
