- pgno: 124
  md: 'the system and on the operating system, but there would be no synchronization
    constraints between the applications running on the system.

    A system running multiple tasks could be represented as a single system running
    three independent tasks, A, B, and C, as shown in Figure 3.13.


    ![](img/9337ae7b0be66cc11725becaa009908f_124_0.png)


    **Figure 3.13** Three independent tasks


    An example of this kind of usage would be consolidation of multiple machines down
    to a single machine. This consolidation might just be running the web server,
    e-mail server, and so on, on the same machine or might involve some form of virtualization
    where different tasks are isolated from each other.

    This approach is very common but not terribly interesting from a parallelization
    strategy since there is no communication between the components. Such an approach
    would increase the utilization of the machine and result in space or power savings
    that should not be expected to lead to a performance change (except that is attained
    from the intrinsic differences in system performance).

    One place where this strategy is common in cluster, grid, or cloud computing.
    Each individual *node* (that is, *system*) in the cloud could be running a different
    task, and the tasks are independent. If a task fails (or a node fails while completing
    a task), the task can be retried on a different node. The performance of the cloud
    is the aggregate throughput of all the nodes.

    What is interesting about this strategy is that the tasks are independent, performance
    (measured as throughput) should increase nearly linearly with the number of available
    threads.


    # Multiple Loosely Coupled Tasks


    A slight variation on the theme of multiple independent tasks would be where the
    tasks are different, but they work to form a single *application*. Some applications
    need to have multiple independent tasks running simultaneously, with each task
    independent and often different from the other running tasks. However, the reason
    for this is an application rather than just a collection of tasks that there is
    some element of communication within the system. The communication might be from
    the tasks to the central task controller, or the tasks might report some status
    back to a status monitor.'
