- pgno: 142
  md: '# # 4

    Synchronization and Data Sharing


    For a multithreaded application to do useful work, it is usually necessary for
    some common state to be shared between the threads. The degree of sharing that
    is necessary depends on the task. At one extreme, the only sharing necessary may
    be a single number that is passing performed. For example, a thread in a web server
    might be told only the port number to respond to. At the other extreme, a pool
    of threads might be passing information constantly among themselves to indicate
    what tasks are complete and what work is to be completed. Beyond sharing to coordinate
    work, there is sharing common data. For example, all threads might be updating
    a database, or all threads might be responsible for updating counters to indicate
    the amount of work completed.


    This chapter discusses the various methods for sharing data between threads and
    the costs of these approaches. It starts with a discussion of data races, which
    are situations where multiple threads are updating the same data in an unsafe
    way. One way to avoid data races is by utilizing proper synchronization between
    threads. This chapter provides an overview of the common approaches to data sharing
    supported by most operating systems. This discussion focuses, as much as possible,
    on the abstract methods of synchronization and coordination. The following chapters
    will provide implementation-specific details for POSIX and Windows environments.


    # ## Data Races


    Data races are the most common programming error found in parallel code. A data
    race occurs when multiple threads use the same data item and one or more of threads
    are updating it. It is best illustrated by an example. Suppose you have the code
    shown in Listing 4.1, where a pointer to an integer variable is passed in and
    the function increments the value of this variable by 4.'
