  md: "# Lockless Algorithms\n\nThe other approach to lockless algorithms is to code\
    \ the algorithms so that they do not require locks. This can be complicated to\
    \ achieve because it requires consideration of the state of the data and the transitions\
    \ between data states to ensure that the system remains in legal states all the\
    \ time.\n\n# Dekker's Algorithm\n\nOne of the first lockless algorithms was Dekker's\
    \ algorithm for mutual exclusion. Without using any atomic operations, the algorithm\
    \ ensures that only one thread at out of a pair of threads can enter a critical\
    \ region. Listing 8.16 shows an implementation of Dekker's algorithm. To increment\
    \ the counter a thread would call the function increment() with its thread ID.\n\
    \nListing 8.16 Implementation of Dekker's Algorithm for Mutual Exclusion\n\n```\n\
    volatile int priority = 0;\nvolatile int counter = 0;\nvolatile int waiting[2];\n\
    \nvoid increment( int id )\n{\n    waiting[id] = 1;\n\n    while( waiting[1-id]\
    \ == 1 )\n    {\n        if ( priority! == id )\n        {\n            waiting[id]\
    \ = 0;\n            while ( priority! != id )\n                waiting[id] = 1;\n\
    \        }\n    }\n    /* Critical section */\n    counter++;\n    /* Exit critical\
    \ section */\n    priority = 1-id;\n    waiting[id] = 0;\n}\n```\n\nThe algorithm\
    \ works because each thread signals that it is waiting to get into the critical\
    \ section. If the other thread has not signaled that it is waiting for or has\
    \ already entered the critical section, then the current thread can enter it.\
    \ If both threads are waiting, then one of the threads gets priority, and the\
    \ other thread waits until it gets priority."
