    \ each thread to test a different number. Listing 6.13 shows a serial version\
    \ of the code to do this.\n\n# Listing 6.13 Algorithmic Version of Code to Test\
    \ Range of Numbers for Primality\n\n```\nvolatile int counter = 0;\n\nunsigned\
    \ int _stcdalloc test(void * )\n{\n  while ( counter<100) {\n    int number =\
    \ counter++;\n    printf(\"Thread %i, value = %i, isprime = %i\\n\",n        \
    \   GetCurrentThreadId(),number, isprime(number));\n  }\n  return 0;\n```\n\n\
    However, using two to perform this algorithm would cause a data race if both threads\
    \ accessed the variable counter at the same time. If we chose to select this particular\
    \ algorithm, we would need to prevent the increment of the variable counter to\
