  md: '# Parallelization Patterns 109


    multiple clients (in which case any gains in throughput are a fortunate by-product
    rather than a design goal).


    # Splitting Responsibility into a Producer and a Consumer


    A *producer-consumer model* is similar to both the pipeline model and the client-server.
    Here, the producer is generating units of work, and the consumer is taking those
    units of work and performing some kind of process on them.


    For example, the movie-rendering problem described earlier might have a set of
    producers generating rendered frames of a movie. The consumer might be the task
    that has the work of ordering these frames correctly and then saving to disk.


    This can be represented as multiple copies of task A sending results to a single
    copy of task B, as shown in Figure 3.21. Alternatively, there could be multiple
    producers and a single consumer or multiple producers and consumers.


    ![](img/9337ae7b0be66cc11725becaa009908f_130_0.png)


    Figure 3.21 Producer-consumer division of work


    Again, this approach does not necessarily reduce the latency of the tasks but
    it provides an improvement in throughput by allowing multiple tasks to progress
    simultaneously. In common with the client-server approach, it may also provide
    a way of reducing the complexity of combining the output from multiple producers
    of data.


    # Combining Parallelization Strategies


    In many situations, a single parallelization strategy might be all that is required
    to produce a parallel solution for a problem. However, in other situations, there
    is no single strategy sufficient to solve the problem effectively, and it is necessary
    to select a combination of approaches.


    The pipeline strategy represents a good starting point for a combination of approaches.
    For example, one stage might use multiple threads to perform a calculation on
    one item of data. A different stage might have multiple threads working on separate
    items of data.


    When mapping a process to an implementation, it is important to consider all the
    ways that it is to exploit parallelism and avoid limiting yourself to the first
    approach that comes to mind. Consider a situation where a task takes 100 seconds
    to'
