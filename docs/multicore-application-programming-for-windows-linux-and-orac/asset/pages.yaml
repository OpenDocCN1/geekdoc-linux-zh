  md: "# Chapter 5 Using POSIX Threads\n\nThe modifications introduce a second semaphore,\
    \ limit. This semaphore is initialized with a value of 10. The producer adds an\
    \ item to the queue, calls sem_wait(), which will decrement the value of the semaphore.\
    \ Every time the consumer removes an item from the queue, it calls sem_post(),\
    \ which will increase the value of the semaphore. When the semaphore reaches zero,\
    \ the producer will call sem_wait() and will not return from the call until the\
    \ consumer has removed an item from the list. This will stop the producer thread\
    \ from adding more items to the queue before the consumer has had the chance to\
    \ deal with those items already there.\n\n# Condition Variables\n\nCondition variables\
