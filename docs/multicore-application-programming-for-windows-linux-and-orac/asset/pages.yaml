  md: '# The Translation of Source Code to Assembly Language


    An executing application is called a process. A process is a bit more than instructions
    and data, since it also has state. State is the set of values held in the processor
    registers, the address of the currently executing instruction, the values held
    in memory, and any other values that uniquely define what the process is doing
    at any moment in time. The important difference is that as a process runs, its
    state changes. Figure 1.22 shows the lay out of an application running in memory.


