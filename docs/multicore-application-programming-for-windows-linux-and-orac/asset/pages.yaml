    \ and the code coverage for the particular data used provide the best indication\
    \ of whether the application has these modes. Input data that do not cover parts\
    \ of the code base are a strong indicator for the existence of these modes and\
    \ definitively indicate that more input data should be used in providing training\
    \ data for the application's build.\n\nThe performance benefit from profiling\
    \ with profile feedback is variable. Codes where the time is spent in loops tend\
    \ to benefit less from profile feedback, whereas codes containing high numbers\
    \ of transfer instructions tend to see a much greater benefit. The typical gain\
    \ is probably around 5% to 10%, but gains can be much greater if the profile feedback\
    \ leads to other opportunities for further performance gains. The developer's\
    \ choice to use profile feedback should be taken in light of whether it gets performance\
    \ gains.\n\n# How Potential Pointer Aliasing Can Inhibit Compiler Optimizations\n\
    \nOne of the most common barriers to optimization with C and C++ codes is pointer\
    \ aliasing. In most situations, a compiler cannot tell whether two (or more) pointers\
    \ point to the same address in memory or to different addresses. The compiler\
    \ needs to make the safe choice, so it will often default to assuming the pointers\
    \ alias, even if the programmer knows that the pointers do not. In some cases,\
    \ the compiler is able to work around this by producing multiple versions of the\
    \ code and using runtime checking to determine which version is appropriate. Consider\
    \ the code shown in Listing 2.45.\n\nListing 2.45 Code with Potential Pointer\
    \ Aliasing\n\n```\nvoid sum(double * total, double * array, int len )\n{\n  for\
    \ (i=0; i<len; i++)\n{\n    *total += array[i];\n  }\n}\n```"
