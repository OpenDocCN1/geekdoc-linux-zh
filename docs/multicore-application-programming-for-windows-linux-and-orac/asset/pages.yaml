- pgno: 430
  md: '# Summary 409


    operation. However, SIMD instructions act on a vector of values. A vector might
    hold two double-precision values or four single-precision values, and so on.


    For a SIMD instruction set that handles two double-precision values in parallel,
    each iteration through the SIMD version of the loop performs loads of a pair of
    elements each, an addition operation on that pair of elements, and a store that
    writes the result of pair elements back to memory. Consequently, the trip count
    around the loop will have reduced by a factor of two. As the latencies of the
    operations remain the same, the resulting code will run twice as fast.


    Modern compilers have the facility to identify and utilize SIMD instructions,
    either by default or under a combination of flags. The generated code will work
    only on hardware that supports the instructions.


    SIMD instructions complement parallelization strategies. If the loop shown in
    Listing 10.2 acted on large arrays of data, multiple threads could handle the
    computation efficiently. However, if the arrays were small in size, the synchronization
    overhead would dwarf the gains from parallelism. SIMD instructions would be effective
    in both situations, perhaps providing a doubling of performance. However, they
    could potentially provide doubling of performance even when the length of the
    arrays is too short for efficient parallelization.


    # Summary


    In this chapter, we met other approaches to parallelization. These included library-based
    approaches such as Threading Building Blocks, which seek to provide infrastructure
    for parallel applications and preprocessors such as Cilk that hide some of the
    complexity of the underlying libraries. A particularly interesting domain is how
    the future C and C++ language standards may include support for parallelism, which
    would go a long way toward enabling code at the language level. Another approach
    to providing parallelism is using different programming paradigms, such as functional
    programming languages like Haskell. This approach could potentially avoid some
    of the problems by making coding code parallel in C/C++.


    Parallelism should not be considered a problem to be solved within a machine.
    One of the more complex problems is using parallelism to compute the solutions
    to problems that are too large to be solved by a single system. Technologies such
    as MPI enable a single application to span many systems. The approach of using
    multiple systems enables other hardware features, such as bandwidth or scale with
    the number of processors. Algorithms such as MapReduce are an approach that allows
    problems to be broken down into chunks that can be solved in parallel using many
    systems.


    Finally, we looked at how hardware can provide more opportunities for parallelism.
    The CUDA approach of providing many simple cores enables a block of simple code
    to be executed by hundreds of threads in parallel. Transactional memory presents
    a possible solution for the problem of producing correct multithreaded code. SIMD
    instructions'
