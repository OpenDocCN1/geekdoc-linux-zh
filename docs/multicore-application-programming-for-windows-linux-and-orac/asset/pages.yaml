  img_proc: true
- pgno: 129
  md: 'two performing task B. Here the combination would complete one task every second,
    which would match the throughput of tasks A and C. It is also worth considering
    that the best throughput occurs when all the stages in the pipeline take the same
    amount of time. Otherwise, some stages will be idle waiting for more.


    # Division of Work into a Client and a Server


    With a client-server configuration, one thread (the client) communicates requests
    to another thread (the server), and the other thread responds. The split into
    client and server might provide a performance improvement, while the server is
    performing some calculation, the client can be responding to the user; the client
    might be the visible UI to the application, and the server might be the compute
    engine that is performing the task in the background. There are plenty of examples
    of this approach, such as having one thread to manage the redraw of the screen
    while other threads handle the activities of the application. Another example
    is when the client is a thread running on one system while the server is a thread
    running on a remote system; web browsers and servers are obvious, everyday examples.


    A big advantage of this approach is the sharing of resources between multiple
    clients. For example, a machine might have single Ethernet port but have multiple
    applications that need to communicate through that. The client would send requests
    to a server. The server would have exclusive access to the Ethernet device and
    would be responsible for sending out the packets from the clients and directing
    packets to the appropriate client in an orderly fashion.


    This client-server relationship can be represented as multiple clients: A, communicating
    with server, B, as shown in Figure 3.20. Server B might also control access to
    a set of resources, which are not explicitly included in the diagram.


    ![](img/9337ae7b0be66cc11725becaa009908f_129_0.png)


    Figure 3.20 Client-server division of work


    Implicit in the client-server pattern is the notion that there will be multiple
    clients seeking the attention of a single server. The single server could, of
    course, be implemented using multiple threads.


    The client-server pattern does not improve responsiveness but represents a way
    of sharing the work between multiple threads, especially where the server actually
    does some work. Alternatively, it represents a way of sharing a common resource
    between-'
