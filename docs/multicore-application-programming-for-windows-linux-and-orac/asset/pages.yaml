    # The Characteristics of Multiprocessor Systems


    Although processes with multiple cores are now prevalent, it is also becoming
    more common to encounter systems with multiple processors. As soon as there are
    multiple processors in a system, accessing memory becomes more complex. Not only
    can data be held in memory, but it can also be held in the caches of the other
    processors. For code to execute correctly, there should be only a single up-to-date
    version of each item of data; this feature is called cache coherence._


    The common approach to providing cache coherence is called *snooping*. Each processor
    broadcasts the address that it wants to read or write. The other processors watch
    for these broadcasts. When they see the address of data they hold take one of
    two actions, they can return the data if the other processor wants to read the
    data and they have the most recent copy. If the other processor wants to store
    a new value for the data, they can invalidate their copy.


    However, this is not the only issue that appears when dealing with multiple processors.
    Other concerns are memory layout and latency.


    Imagine a system with two processors. The system could be configured with all
    the memory attached to one processor or the memory evenly shared between the two
    processors. Figure 1.18 shows these two alternatives.


    ![](img/9337ae7b0be66cc11725becaa009908f_39_0.png)


    Figure 1.18 Two alternative memory configurations'
