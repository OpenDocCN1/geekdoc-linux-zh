    \ The other thread only reads the variable. As long as the reading thread sees\
    \ the updates in the correct order and each variable is updated atomically, the\
    \ thread will continue to wait until the array is ready and only read that data.\n\
    \nA subtle characteristic of the code is that the updates of the pointers into\
    \ the array are carried out by a function call. The function call acts as a compiler\
    \ memory barrier"
