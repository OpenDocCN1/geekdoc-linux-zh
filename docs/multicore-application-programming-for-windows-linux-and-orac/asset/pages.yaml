  md: '# Improving Machine Efficiency Through Consolidation


    # Using Containers to Isolate Applications Sharing a Single System


    One such technology is containerization. The implementations depend on the particular
    operating system, for example, Solaris has Zones, whereas FreeBSD Jails, but the
    concept is the same. A control container manages the operating system, along with
    a multitude of guest containers. Each guest container appears to be a complete
    operating system instance in its own right, and an application running in a guest
    container cannot see other operations on the system either in other guest containers
    or in the control container. The guests do not ever share disk space; each guest
    container can appear to have its own root directory system.


    The implementation of the technology is really a single instance of the operating
    system, and the illusion of containers is maintained by hiding applications or
    resources that are outside of the guest container. The advantage of this implementation
    is very low overhead, performance comes very close to that of the full system.
    The disadvantage is that the single operating system represents a single point
    of failure. If the operating system crashes, then all the guests also crash, since
    they also share the same image. Figure 3.4 illustrates containerization.


    | Guest container 1 | Guest container 2 |

    | --- | --- |

    | User 1 | User 3 |

    | User 2 | User 4 |

    | \multicolumn{2}{|c|}{{ Host operating system } } |

    | \multicolumn{2}{|c|}{{ Hardware } |


    Figure 3.4 Using containers to host multiple guest operating systems in one system


    # Hosting Multiple Operating Systems Using Hypervisors


    Two other approaches that enforce isolation between guests'' operating systems
    also remove the restriction that the guests run the same operating system as the
    host. These approaches are known as type 1 and type 2 hypervisors.


    Type 1 hypervisors replace the host operating system with a very lightweight but
    high-level supervisor system, or hypervisor, that can load and initiate multiple
    operating system instances on its own. Each operating system instance is entirely
    isolated from the others while sharing the same hardware.'
