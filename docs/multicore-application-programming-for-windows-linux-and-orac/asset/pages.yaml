    The main advantage of using these atomic operations is that they avoid the overhead
    of using a mutex to protect the variable. Although the mutex locks usually also
    have a compare and swap operation included in their implementation, they also
    have overhead around that core operation. The other difference is that the mutex
    operates at a different location in memory from the variable that needs to be
    updated. If both the lock and variable are shared between threads, there would
    typically be cache misses for obtaining the lock and performing an operation on
    the variable. These two factors combine to make the atomic operation more efficient.


    Atomic operations are very effective for situations where a single variable needs
    to be updated. They will not work in situations where a coordinated update of
    variables is required. Suppose an application transfers money from one bank account
    to another. Each account could be modified using an atomic operation, but there
    would be a point during the entire transaction where the money had been removed
    from one account and had not yet been added to the other. At this point, the total
    value of all accounts would be reduced by the amount of money in transition. Depending
    on the rules, this might be acceptable, but it would result in the total amount
    of money held in the bank being impossible to know exactly while transactions
    were occurring.


    The alternative approach would be to lock both accounts using mutex locks and
    then perform the transaction. The act of locking the accounts would stop anyone
    else from reading the value of the money in those accounts until the transaction
    had resolved.


    Notice that there is the potential for a deadlock when multiple transactions of
    this kind exist. Suppose an application needs to move x pounds from account A
    to B and at the same time another thread in the application needs to move y pounds
    from account B to A. If the first thread acquires lock account A and B, then neither
    thread will be able to make progress. The simplest way is to enforce an ordering
    (perhaps order of memory addresses, low to high) on the acquisition of locks.
    In this instance, if all threads had to acquire lock A before they would attempt
    to get the lock on B, only one of the two threads would have succeeded in getting
    the lock on A, and consequently the deadlock would be avoided.'
