    \ is made available to the main thread through the pthread_join() call.\n\n# Detached\
    \ Threads\n\nThe previous discussion focused on joinable threads, threads that\
    \ terminate and wait for the main thread to return their value before the resources\
    \ they consume are recycled.\n\nIt is also possible to create detached threads\
    \ that do not wait for another thread to call pthread_join() before the resources\
    \ are recycled. One way to do this is to set the appropriate attribute in the\
    \ thread attributes structure; this will be discussed in the next section. Another\
    \ way is to call pthread_detach() on an existing thread. Calling pthread_join()\
    \ on detached threads is an error; you do not need the call, and making the call\
    \ will return an error value.\n\nThe handle of the detached thread may be recycled\
    \ when the thread exits, so any cached version of the handle may no longer refer\
    \ to the original thread; hence, care needs to be taken when writing code that\
    \ uses detached threads.\n\nListing 5.7 shows an example of detaching a thread.\
    \ The child thread calls pthread_self() to get its own handle, which can then\
    \ use to convert itself into a detached thread.\n\nListing 5.7 Detaching a Thread\
    \ Using pthread_detach() Call\n\n```\n#include <pthread.h>\n#include <stdio.h>\n\
    \nvoid* child_routine( void * param ) {\n    int id = (int)param;\n    printf(\"\
    Detach thread %i\\n\", id );\n    pthread_detach(pthread_self());\n}\n\nint main()\
    \ {\n    pthread_t thread[10];\n    for ( int i=0; i<10; i++) {\n        pthread_create(&thread[i],\
    \ 0, child_routine, (void*)i);\n    }\n}\n```\n\nThreads can also be created in\
    \ the detached state. To do this, it is necessary to pass a set of attributes\
    \ into the call to pthread_create()."
