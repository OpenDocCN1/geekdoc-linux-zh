    # Why Algorithmic Complexity Is Important


    Algorithmic complexity represents the executed performance of a section of code
    as the number of elements being processed increases. In the limit, the greatest
    algorithmic complexity will dominate the runtime of the application.


    Assume that your function has two regions of code, one is O(N) and another is
    O(N²). If you run a test workload of 100 elements, you may find that the O(N)
    code takes longer to execute, because there be more instructions associated with
    the computation on each element. However, if you were to run a workload of 10,000
    elements, then the more complex runtime would start to grow as important, assuming
    it did not completely dominate the runtime of the application.


    Picking a small workload will mislead you to which parts of the code need to be
    optimized. You may have spent optimizing the algorithmically simpler part of the
    code, when the performance of the application in a real-world situation will be
    dominated by the algorithmically complex part of the code. This emphasizes why
    it is important to select appropriate workloads for developing and testing the
    algorithm. Different parts of the application will scale differently as the workload
    size changes, and regions that appear to take no time suddenly become dominant.


    Another point to realize is that a change of algorithm is one of the things that
    can make an order of magnitude difference to performance. If 80% of the application''s
    runtime was spent sorting a 1,000-element array, then switching from a bubble
    sort to a quicksort could make a 300x difference to the performance of function,
    making the time spent sorting 300x smaller than it was previously. The 80% of
    the runtime spent sorting would largely disappear, and the application would end
    up running about five times faster.


    Table 2.1 shows the completion time of a task with different algorithmic complexities
    as the number of elements grows. It is assumed that the time to complete a single
    unit of work is 100ns. As the tables illustrate, it takes remarkably elements
    for an O(N²) algorithm to start consuming significant amounts of time.


    Table 2.1 Execution Duration at Different Algorithmic Complexities


    | Elements | O(1) | O(N) | O(N log₂ N) | O(N²) |

    |---|---|---|---|---| |

    | 1 | 100ns | 100ns | 100ns | 100ns |

    | 10 | 100ns | 1,000ns | 3,322ns | 10,000ns |

    | 100 | 100ns | 10,000ns | 66,439ns | 1,000,000ns |

    | 1,000 | 100ns | 100,000ns | 996,578ns | 100,000,000ns |

    | 10,000 | 100ns | 1,000,000ns | 13,287,712ns | 10,000,000,000ns |'
