    \ an algorithm that is fast for the single-threaded case and scales with multiple\
    \ threads.\n\n# Insufficient Work\n\nIf we return to the Mandelbrot example used\
    \ in Chapter 7,\"Using Automatic Parallelization and OpenMP\" made the work run\
    \ in parallel by each thread compute a different range of iterations. A grid of\
    \ 4,000 by 4,000 pixels was used, so there was plenty of work to be performed\
    \ by each thread. On the other hand, if we were computing a grid of 64 by 64 pixels,\
    \ then using the same scheme would not get scaling beyond 64 threads; each thread\
