  md: "# Synchronization Primitives\n\nListing 4.7 Placing Mutex Locks Around Accesses\
    \ to Variables\n\n```\nint counter;\n\nmutex_lock mutex;\n\nvoid Increment()\n\
    {\n    acquire(&mutex);\n    counter++;\n    release(&mutex);\n}\n```\n\n```\n\
    void Decrement()\n{\n    acquire(&mutex);\n    counter--;\n    release(&mutex);\n\
    }\n```\n\nIn the example, the two routines Increment() and Decrement() will either\
    \ increment or decrement the variable counter. To modify the variable, a thread\
    \ has to first acquire the mutex lock. Only one thread at a time can do this;\
    \ all the other threads that want to acquire the lock need to wait until the thread\
    \ holding the lock releases it. Both routines use the same mutex; consequently,\
    \ only one thread at a time can either increment or decrement the variable counter.\n\
    \nIf multiple threads are attempting to acquire the same mutex at the same time,\
    \ then only one thread will succeed, and the other threads will have to wait.\
    \ This situation is known as a contended mutex.\n\nThe region of code between\
    \ the acquisition and release of a mutex lock is called a critical section, or\
    \ critical region. Code in this region will be executed by only one thread at\
    \ a time.\n\nAs an example of a critical section, imagine that an operating system\
    \ does not have an implementation of malloc() that is thread-safe, or safe for\
    \ multiple threads to call at the same time. One way to fix this is to place the\
    \ call to malloc() in a critical section by surrounding it with a mutex, as shown\
    \ in Listing 4.8.\n\n# Listing 4.8 Placing a Mutex Lock Around a Region of Code\n\
    \n```\nvoid * threadSafe(size_t size )\n{\n    acquire(&mutex);\n    void * memory\
    \ = malloc(size);\n    release(&mutex);\n    return memory;\n}\n```"
