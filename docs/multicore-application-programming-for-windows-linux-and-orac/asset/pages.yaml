    \  printf(\"Final value=%i\\n\", data);\\n    return 0;\n}\n```\n\n# Improving\
    \ Work Distribution Using Scheduling\n\nThe default scheduling for a parallel\
    \ loop is called scheduling. The iterations are divided evenly, in chunks of consecutive\
    \ iterations, between the threads. If there are two threads working to complete\
    \ 100 iterations, the first thread will complete the first 50 iterations, and\
    \ the second thread will complete the second 50 iterations. This scheme works\
    \ well in situations where each iteration takes the same amount of work in each\
    \ iteration. However, in some cases, a different amount of work will be performed\
    \ in each iteration. Consequently, both threads may complete the same number of\
    \ iterations, but one may have more work to do in these iterations. Listing 7.31\
    \ shows an example of this. The number of iterations performed in the routine\
    \ `calc()` depends on the value passed into it. The value passed depends largely\
    \ on the loop induction variable i. With static scheduling, threads that get assigned\
    \ the higher values of i will take longer to complete their work.\n\n# Listing\
    \ 7.31 Code Where Each Iteration Has Different Computational Costs\n\n```\ndouble\
    \ calc(int count) {\n    double d = 1.0;\n    for(int i=0; i < count; i++) {\n\
    \        d += d;\n    }\n    return d;\n}\n```"
