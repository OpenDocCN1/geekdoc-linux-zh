- pgno: 427
  md: '# MapReduce as a Strategy for Scaling


    MapReduce is an algorithm that is well suited to clusters because it requires
    little communication and is a relatively flexible approach so long as there are
    multiple parallel queries to be completed. Implementations are available in various
    languages


    The MapReduce algorithm has two steps. The map step takes a problem and distributes
    it across multiple nodes. The reduce step takes the results from those nodes and
    combines them to provide a final result.


    MapReduce works best when there is an operation to be performed on multiple sets
    of input data. For example, considering the frequency of the use of all words
    over a range of documents. A single thread would compute this by reading each
    document and then using a map to increment the value of a counter for each word
    encountered in the document.


    The MapReduce version of the code would perform the following two steps. In the
    map phase, the master thread would assign each worker thread to perform the word
    count on a particular document. In the reduce step, each worker thread would return
    the list of word frequencies for its particular document, and the master thread
    would combine all into a single set of results.


    From experience, it should be obvious that the algorithm could be implemented
    using MPI. In fact, the only difference between this and the code to compute the
    Mandelbrot set is that the MPI master thread did not need to tell the worker threads
    what to compute since this information was provided in the source code.


    What makes MapReduce different from an algorithm implemented in MPI? There are
    two major differences.


    First, MPI is a general-purpose framework for the composition of parallel problems,
    whereas MapReduce is an approach for a specific kind of problem. So it be possible
    to implement MapReduce-type problems in MPI, but it is not generally possible
    to implement all MPI problems using a MapReduce framework.


    The second difference is that MPI is designed to work on a known grid of computers.
    MPI relies on the fact that a known node performing the work and that this will
    at some point return the result of the computation. MapReduce is built on the
    base that the nodes performing the work may not be reliable. If a node does not
    provide the result within a suitable time, the master node can restart the query
    on a different node.


    There are two characteristics of the MapReduce framework which enables this restart.
    First is the master node explicitly requests work from the worker nodes. If the
    worker node fails, the master node can make the same request of another worker.
    The second characteristic is that the nodes do not contain state. If a worker
    node fails, the master node can restart from a known point and not have the problem
    that one of the other nodes is already using partial answers from the failed node.


    MapReduce is usually implemented as a library, such as the Hadoop implementation.
    This library provides the functionality for distributing the work across multiple
    systems, restarting the work if one of the nodes fails, and so on. The advantage
    of providing this as a library is that improvements to the library code will be
    felt by all users of the library.'
