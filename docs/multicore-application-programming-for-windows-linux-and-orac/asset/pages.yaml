- pgno: 271
  md: "The two loops in the code, the compiler parallelizes the outer loop but not\
    \ the inner loop.This is the best decision to make for performance. The threads\
    \ performing the work in parallel need to synchronize once the parallel work has\
    \ completed. If the outer loop is parallelized, the threads need to synchronize\
    \ only once the outer loop has completed. If the inner loop were to be parallel,\
    \ the threads would have to synchronize every iteration of the outer loop. The\
    \ number of synchronization events would equal the number of times that the outer\
    \ loop was iterated. Hence, it is much more efficient to make the outer loop.\n\
    \n# Identifying and Parallelizing Reductions\n\nWhen a loop reduces a large amount\
    \ of data down to a smaller set of values, the operation is called a reduction.The\
    \ classic example of a reduction is computing the sum of an array of numbers,\
    \ as shown in Listing 7.11.\n\nListing 7.11 Calculating the Sum of an Array of\
    \ Numbers\n\n```\ndouble sum(double* array, int length )\n{\n  double total=0;\n\
    \  int i;\n  for (i=0; i<length; i++) {\n    total += array[i];\n  }\n  return\
    \ total;\n}\n```\n\nTo create a reduction in parallel, the reduction operator\
    \ needs to be commutative—performing the operations in a different order must\
    \ not cause an incorrect result.The possible reduction operations are addition,\
    \ subtraction, multiplication, and the logical operations, as well as the operations\
    \ AND or OR, the operations MIN and MAX when applied to an array of numbers.\n\
    \nSome operations on floating-point numbers cannot beordered without causing some\
    \ numeric differences to the output. The addition of floating-point values is\
    \ a good example of this. There are situations where adding A and B and then C\
    \ will give a different numeric value than adding C and A and then B. The order\
    \ of operations is important. This is not a problem unique to parallel codes;\
    \ serial codes have the same ordering constraints. For parallel codes, this constraint\
    \ may stop a compiler from producing a parallel version of code construct.\n\n\
    To consider a contrived example, assume you have an array of floating point numbers\
    \ from the largest element to the smallest element. When you sum the elements\
    \ in this array, the value may reach a point where the sum becomes so large that\
    \ adding the small elements onto this sum causes no impact, because the increase\
    \ is less than can be registered as an increase in the variable holding the total."
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Using Automatic Parallelization to Produce a Parallel Application


    Suppose you take this array and use two threads to compute the result. Each

    thread computes a partial total over half of the range of numbers. The first thread
    calculates the sum of the first half of the array, which contains the list of
    large numbers. The second thread calculates the sum of the second half of the
    array, which contains the list of small numbers. Now the second thread will compute
    a much smaller value for its partial total. When two positive values are added
    together, it is more likely that the result is greater than the largest of the
    two values. In contrast, if a small value is added to a larger value, it is likely
    that the result will be identical to the larger value. the consequence is that
    this small values will accumulate and be recorded in the summation computed by
    the second thread.


    At the end of the parallel region, the values from both threads are added to produce
    the final value. While the second thread computes is potentially large enough
    to cause a small change in value added to the large result from the first thread,
    the result in the computation by using two threads is likely to be different from
    the result using only one thread. This difference might be in the smallest significant
    figure, or it might even be a rounding difference. But, the result could potentially
    be different.


    Some compilers make the decision of whether to perform reductions under control
    of the user. The Solaris Studio compiler requires that the user specify the flag
    -xreduction to parallelize reduction operations. The Intel compiler does not require
    an additional flag to recognize reductions. We see the results of using this flag
    on the code from Listing 7.5 in the output shown in Listing 7.12.


    # Listing 7.12 Parallelization of Reduction Operations


    ```

    $ cc -g -xautoparop -xloopinp -reduction -0 -c fploop"

    "flop.c", line 5: PARALLELIZED, and serial version generated

    "flop.c", line 8: not parallelized, not profitable

    ```


    The compiler output shows that it recognized the inner loop at line 8 and did
    not declare an independence dependency. Instead, the loop is not being profitable
    to parallelize. This is the expected behavior; as we have previously discussed,
    it is much more effective to parallelize the outer loop and leave the inner loop
    as serial code.


    Reductions are in many codes, and it is usually appropriate to parallelize them
    as long as the developer is aware that this may cause a difference in the generated
    results.


    # Automatic Parallelization of Codes Containing Calls


    We discussed the impact made on performance by calling other routines in Chapter
    2, "Coding for Performance."The basic problem with calling another function is
    that the compiler has no idea what that routine might do—it could change global
    data or perhaps never return. For this reason, a loop that contains function calls
    cannot, in general, be automatically parallelized.'
  merge: -1
  img_proc: true
