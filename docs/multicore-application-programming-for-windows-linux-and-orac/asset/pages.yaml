    Such containment and security is critical for supporting multiple simultaneous
    users. As the number of users increases, so does the chance that one of them will
    do something that could “damage” the rest of the system. This could be as simple
    as deleting critical files or enabling someone to get unauthorized access to the
    system.


    # Improving Machine Efficiency Through Consolidation


    Multicore computing is really just the continuing development of more powerful
    system architectures. Tasks that to use a dedicated machine can now be performed
    using a single core of a multicore machine. This is a new opportunity to consolidate
    tasks from multiple separate down to a single multicore machine. An example might
    be using a single machine for both a web server and e-mail server where previously
    these functions were running on their old dedicated machines.


    There are many ways to execute this. The simplest would be to log into the machine
    and start both the e-mail and web server. However, for security reasons, it is
    often necessary to keep them separate. It would be unfortunate if it were possible
    to send a suitably formed request to the web server to retrieve someone’s e-mail
    archive.


    The obvious solution would to run both servers as different users. This could
    use the default access control system but it does not guard against user error.
    For example, someone might accidentally put one of the mail server’s files under
    the wrong permissions, leaving the mail open to reading or perhaps leaving it
    possible to install a back door into the system. For this reason, smarter technologies
    have evolved to provide better separation between processes running on the same
    machine.'
