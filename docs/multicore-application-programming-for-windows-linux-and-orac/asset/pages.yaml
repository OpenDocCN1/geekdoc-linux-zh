- pgno: 127
  md: 'Once again, the performance of the system is an increase in throughput, not
    an improvement in the rate at which work is completed.


    # Single Task Split Over Multiple Threads


    Splitting a single task over multiple threads is often what people think of parallelization.
    The typical scenario is distributing a loop''s iterations among multiple threads
    so that each thread gets to compute a discrete range of the iterations.


    This scenario is represented in Figure 3.18 as a system running three threads
    and each of the threads handling a separate chunk of the work.


    ![](img/9337ae7b0be66cc11725becaa009908f_127_0.png)


    Figure 3.18 Multiple threads working on a single task


    In this instance, a single unit of work is being divided between the threads,
    so the time taken for the unit of work to complete should diminish in proportion
    to the number of threads working on it. This is a reduction in completion time
    and would also represent an increase in throughput. In contrast, the previous
    examples in this section have represented increases in the amount of work completed
    (throughput), but not a reduction in the completion time for each unit of work.


    This pattern can also be considered a fork-join pattern, where the fork is the
    division between the threads, and the join is the point at which all the threads
    synchronize, having completed their individual assignments.


    Another variation on this theme is the divide-and-conquer approach where a problem
    is recursively divided as it is divided among multiple threads.


    # Using a Pipeline of Tasks to Work on a Single Item


    A pipeline of tasks is perhaps a less obvious strategy for parallelization. Here,
    a single unit of work is split into multiple stages and is passed from one stage
    to the next rather than an assembly line.


    Figure 3.19 represents this system. A system has separate threads; when a unit
    of work comes in, the first thread completes task A and passes the work on task
    B, which is performed by the second thread. The work is completed by the third
    thread performing task C. As each thread completes its task, it is ready to accept
    new work.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Parallelization Patterns


    ![](img/9337ae7b0be66cc11725becaa009908f_128_0.png)


    Figure 3.19 Pipeline of tasks


    There are various motivations for using a pipeline approach. A pipeline has some
    amount of flexibility, in that the flow of work can be dynamically changed at
    runtime. It also has implicit scalability because an implementation could use
    multiple copies of a particular time-consuming stage in the pipeline (combining
    the pipeline pattern with the multiple copies of a single task pattern), although
    the basic pipeline model would have a single copy of each stage.


    This pattern is most critical in situations where it represents the most effective
    way to the problem can be scaled to multiple threads. Consider a situation where
    tasks come in for processing, and are then retransmitted. A single thread can
    copy only with a certain limit of packets per second. More threads are needed
    in order to improve performance. One of doing this would be to increase the number
    of threads doing the receiving, processing, and forwarding. However, that might
    introduce additional complexity in keeping the packets in the same order and synchronizing
    the multiple threads.


    In this situation, a pipeline looks attractive because each stage can be working
    on a separate packet, which means that the performance gain is proportional to
    the number of active threads. The way to view this is to assume that the original
    processing of a packet took three seconds. So, every three seconds a new packet
    can be dealt with. When the processing is split into three pipeline stages, each
    stage will take a second and leave the first thread able to take a new packet
    of work. So, every three seconds there will be a packet starting. A three-stage
    pipeline has improved performance by a factor of three. The issues of ordering
    and synchronization can be dealt with placing the items in a queue between the
    stages so that order is maintained.


    Notice that the pipeline does not reduce the time to process each unit of work.
    In fact, queuing stages may increase it. So, once again, it is a throughput improvement
    rather than a reduction in unit processing time.


    One disadvantage to pipelines is that the rate that work can go through the pipeline
    is limited by the time that it takes for the work of the slowest stage to complete.
    As an example, consider the case where task B takes two seconds. The second thread
    can accept work only every other second, so regardless of how much faster tasks
    A and C are to complete, task B limits the throughput of the pipeline to one every
    two seconds. Of course, it might be possible to rectify this bottleneck by having'
