  md: '# 180 Chapter 5 Using POSIX Threads


    If the fork() call is not followed by an exec() call, we have two copies of the
    same process. The process state, up to the point at which the fork call was made,
    duplicated in both processes. We will see how this can be useful in the following
    sections on up communications between multiple processes.


    # Sharing Memory Between Processes


    Usually different processes share nothing; however, it is possible to set up multiple
    processes to share the same memory. The shm_open() call creates a shared memory
    segment. This takes a name for the segment, and a set of flags for the shared
    memory, together with the permission bits. The return value from the call is a
    file descriptor of the shared memory segment.


    The name is a string with the first character as /, and no subsequent slashes.
    The flags used by the call are familiar from creating files. O_RDONLY creates
    a read-only segment. O_RDWR will create a segment that permits reading and writing.
    O_CREATE will create the segment if it does not exist or return a handle to it
    if it does. O_EXCL will return an error if the segment already exists. The final
    parameters are the access permissions.


    The memory segment will be created, if it does not already exist, with a size
    of 0 bytes. The size of the reserved segment can be set with a call to ftruncate(),
    passing the file descriptor of the segment together with the requested size.


    Once the segment exists, the process can attach to with a call to mmap(). Table
    5.1 shows the parameters to mmap.


    # Table 5.1 Parameters Passed to mmap()


    | Parameter Type | Comment |

    | --- | --- |

    | void * size_t | The preferred start address of the segment in memory. The size
    of the segment in bytes. |

    | int | The protection flags for the segment. These can be PRO_EXEC for pages
    that can be executed, PRO_READ for pages that can be read, and PRO_WRITE for pages
    that can be written. The permissions will usually match the set up in the call
    to shm_open(). |

    | int | The sharing flags for the segment, either MAP_SHARED to share the segment
    with other processes or MAP_PRIVATE to keep the segment private to the current
    process. |

    | int off_t | The file descriptor of the shared memory. An offset in the shared
    memory region.


    The return value of the call to mmap() is a pointer to the shared memory segment.
    Once the process has finished with the shared memory segment, it can unmap it
    from its address space using the munmap() call, which takes a pointer to the memory
    region together with its size parameters.'
