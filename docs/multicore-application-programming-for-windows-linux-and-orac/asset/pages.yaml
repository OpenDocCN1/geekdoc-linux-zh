    Figure 3.5 Type 1 hypervisor


    A type 2 hypervisor is a normal user application running on top of a host operating
    system. The hypervisor software is architected to host other operating systems.
    Good examples of type 2 hypervisors are the open source VirtualBox software,VMWare,
    or the Paralle software for the Apple Macintosh. Figure 3.6 illustrates a type
    2 hypervisor.

    Clearly, it is also possible to combine these strategies and have a system that
    supports multiple levels of virtualization, although this might not be good for
    overall performance. Even though these strategies are complex, it is worth exploring
    why virtualization is an appealing technology.


    +   - In a virtualized or containerized environment, it is very hard for an application
    in one virtual operating system to obtain access to data held in a different one.
    This also applies to operating systems being hacked; the damage that a hacker
    can do is constrained by what is visible to them from the operating system that
    they hacked into.

    - Robustness. With virtualization, a fault in a guest operating system can affect
    only those applications running on that operating system, not other applications
    running in other guest operating systems.'
