  md: "# Clustering Technologies\n\nHistorically, one of the ways of gathering large\
    \ numbers of processors together was to use a cluster of machines. An advantage\
    \ of doing this was that it increased the available disk space, memory, and bandwidth\
    \ as well as the number of CPUs. The capacity of a single multicore processor\
    \ has increased such that work that previously required a small cluster will now\
    \ fit onto a single system. It is therefore interesting to consider technologies\
    \ that might be used in this domain.\n\n# MPI\n\nMessage Passing Interface (MPI)\
    \ is a parallelization model that allows a single application to span over multiple\
    \ nodes. Each node is one or more software threads on a system, so it is quite\
    \ possible to host multiple nodes on the same system. Hence, a multicore system\
    \ can host multiple MPI nodes.\n\nCommunication between the nodes is, as the name\
    \ suggests, accomplished by passing messages between the nodes. The messages can\
    \ be broadcast to all nodes or directed to a particular node. Since there is no\
    \ addressable shared memory between the nodes, the communication costs depends\
    \ on size and frequency of the messages. Hence, the best scaling will be achieved\
    \ if the application does minimal communication. A consequence of this is that\
    \ MPI codes have scale well by design. This means that they can often run on a\
    \ multicore or multiprocessor system so long as no other system resources, such\
    \ as bandwidth or memory, are exhausted.\n\nEach node executes the same application.\
    \ The first action the application needs to take is to initialize the MPI library\
    \ with a call to MPI_Init(); the final action it needs is to shut down the library\
    \ with a call to MPI_Finalize(). Each MPI process needs to know both the total\
    \ number of processes in the application and its own rank in group of processes.\
    \ The call to MPI_Comm_size() returns the total number of processes, and the call\
    \ to MPI_Comm_rank() provides each process with its identifier. Listing 10.21\
    \ shows the framework for a typical MPI program.\n\nListing 10.21 A Bare-Bones\
    \ MPI Program\n\n```\n#include \"mpi.h\"\n\nint main(int argc, char *argv[])\n\
    {\n    int numproc, myid;\n    MPI_Init(&argc, &argv);\n    MPI_Comm_size(MPI_COMM_WORLD,\
    \ &numproc);\n    MPI_Comm_rank(MPI_COMM_WORLD, &myid);\n\n    MPI_Finalize();\n\
    \    return 0;\n}\n```"
