    # Language Extensions


    Perhaps the most obvious place to add support for parallelism is through extensions
    to existing languages. The language C++ with its expressive power is a good vehicle
    for extensions such as Intel''s Thread Building Blocks. C++, again from Intel,
    provides a set of language extensions that can be preprocessed to generate the
    appropriate code. This section explores many ways that language extensions can
    be used to enable the development of parallel applications.


    # Threading Building Blocks


    Intel''s Thread Building Blocks (TBB) is a C++ library that uses templates to
    provide common parallelization functionality and supporting objects. For example,
    the library provides fundamental objects such as containers and synchronization
    objects. It also provides functionality such as access to threads and memory management
    routines.

    The TBB library is open source and ported to multiple platforms.


    Some of the functionality provided by the library could be used as objects in
    conventional code. The code in Listing 10.2 uses the concurrent queue template
    to manage communication between a producer and consumer thread.'
