  md: '# Chapter 1 Hardware, Processes, and Threads


    The other advantage to using virtual memory is that the same address can be reused
    by multiple applications. For example, assume that all applications are started
    by calling at 0x10000. If we had only physical memory addresses, then only one
    application could reside at 0x10000, we could run only a single application at
    a time. However, given virtual memory addressing, we can put as many applications
    as we need the same virtual address and have this virtual address map to different
    physical addresses. So, to take the example of starting an application by calling
    0x10000, all the applications could use this same virtual address, but for each
    application, this would correspond to a different physical address.


    What is interesting about virtual memory is that the virtual CPU count increases.
    A system that has many active threads will have applications that reserve lots
    of memory but make little actual use of that memory. Without virtual memory, this
    reservation of memory would stop applications from attaining the memory size they
    need. It is also much easier to produce a system that runs multiple applications
    if those applications do not need to be arranged into the one physical address
    space. Hence, virtual memory is almost a necessity for any system that can simultaneously
    run multiple threads.


    # Translating from Virtual Addresses to Physical Addresses


    The critical step in using virtual memory is the translation of a virtual address,
    as used by an application, to a physical address, as used by the processor, to
    fetch the data from memory. This step is achieved using a part of the processor
    called the look aside buffer (TLB). Typically, there will be one TLB for translating
    the address of instructions (the instruction TLB or ITLB) and a second TLB for
    translating the address of data (the data TLB, or DTL).


    Each TLB is a list of virtual address and corresponding physical address of each
    page in memory. When a processor needs to translate a virtual address to a physical
    address, it splits the address into a virtual page (the high-order bits) and an
    offset from that page (the low-order bits). It then looks up the address of this
    virtual page in the list of translations in the TLB. It gets the physical address
    of the page and adds the offset to this to get the data in physical memory. It
    can use this to fetch the data. Figure 1.17 shows this process.


    Unfortunately, a TLB can hold only a limited set of translations. Sometimes, a
    processor will need to find a physical address, but the translation does not reside
    in the TLB. In these cases, the translation is fetched from an in-memory data
    structure called a page table, and this structure can hold many more virtual to
    physical mappings. When a translation does not reside in the TLB, it is referred
    to as a TLB miss, and TLB misses have an impact on performance. The magnitude
    of the performance impact depends on whether the hardware fetches the TLB entry
    from the page table or whether this task is managed by software; most current
    processors handle this in hardware. It is also possible to have a page table miss,
    although this is typically an expensive or slow event.'
