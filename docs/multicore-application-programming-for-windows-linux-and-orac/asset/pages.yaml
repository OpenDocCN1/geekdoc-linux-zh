  md: "# Reordering of Operations by the Compiler\n\nAlthough the hardware can reorder\
    \ operations, it is also possible for the compiler to do the same. Although the\
    \ compiler will try to do the “right thing,” there will be situations where it\
    \ needs hints in order to produce code that runs correctly.\n\nIt is often thought\
    \ that the volatile keyword provides a safety net that the compiler from optimizing\
    \ code. Unfortunately, this is not true. The volatile keyword determines that\
    \ the compiler needs to reload data from when it needs to use it and should store\
    \ it back to memory as soon as it is modified. It does not stop the compiler from\
    \ performing optimizations around the data nor does it form any kind of protection\
    \ against races.\n\nHowever, the volatile keyword is necessary to avoid the compiler\
    \ optimizing away accesses to a variable. Consider the code in Listing 8.8. The\
    \ variable *start* is declared as volatile. If this were not the case, the compiler\
    \ would determine that the loop was neither entered nor finished.\n\n+   Listing\
    \ 8.8 Code volatile Keyword Is Necessary to Ensure Reloading of Variable start\n\
    \n```\nvolatile int start;\n\nvoid waitforstart()\n{\n    while (start == 0) {\
    \ }\n}\n```\n\nA very similar situation exists with the code in Listing 8.9. In\
    \ this case, the code contains a function call. Function calls, generally, cause\
    \ the compiler to reload global data. However, if the variable count is not declared\
    \ to be volatile, it is still possible for the compiler to generate an infinite\
    \ loop. The reason for this is if count does equal zero and it is not a volatile\
    \ variable, then the call to `getElementFromList()` will not be made, and the\
    \ variable will remain zero. An optimizing compiler may identify this situation\
    \ and replace the *else* branch with an infinite loop.\n\n+   Listing 8.9 Function\
    \ Calls Do Not Always Enforce Reloading of All Variables volatile int count;\n\
    \n```\nint* getnextelement()\n{\n    int element = 0;\n    while (element == 0\
    \ )\n    {\n        if (count>0)\n        {\n            element = getElementFromList();\n\
    \        }\n```"
