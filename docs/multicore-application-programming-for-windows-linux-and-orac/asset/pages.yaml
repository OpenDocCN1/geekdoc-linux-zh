  md: '# Chapter 9 Scaling with Multicore Processors


    The code as shown is for a machine where the virtual CPUs are interleaved. The
    particular Intel machine this run on had two hyperthreading-enabled cores, making
    a total of four virtual CPUs. Virtual CPUs 0 and 2 are located on core 0, and
    virtual CPUs 1 and 3 are located on core 1.


    When the manipulation code is run with one thread, it takes about two seconds.
    When two threads run on the same core, it runs in two and a half seconds. If the
    runtime had remained the same, then as much work would have been achieved in the
    same time. However, this was not the case—twice as much work was achieved in 25%
    more time. This represents a 60% gain in throughput.


    The same code was also run on an UltraSPC T2 machine, with the binding strategy
    modified. The topology of this machine is interesting because each core can support
    eight threads, and these threads are arranged into two groups of four. Each group
    of four can issue one operation per cycle, but the two groups share a single load/store
    pipeline and a single floating-point pipeline. When run on this machine, using
    a single thread, the code took seconds. When two threads assigned to the same
    core completed in seven seconds, achieving only slightly more work per unit than
    a single thread. When the two threads are assigned to different groups on the
    same core, the threads complete their work in four seconds. With this distribution,
    the amount of work achieved per unit time is doubled.


    As more threads become active, the scaling of a processor depends on the architecture
    of the core. The more available capacity, the more the throughput of the core
    will increase as the number of threads increases. An alternative view is that
    work very hard to extract every bit of performance from a single-threaded code
    will end up with fewer cycles for a second thread to use. Once a core becomes
    fully utilized, additional threads will steal cycles from those that are already
    running and will cause all the active threads to run slower.


    If all the threads are performing useful work, then to a large extent it does
    not matter how well the processor scales—long as it is completing more work than
    it was when running with a single thread.


