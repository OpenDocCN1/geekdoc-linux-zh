    \ communication costs when each new chunk of work is fetched.\n\nThe default size\
    \ of the chunks for a dynamic schedule is one. Each thread performs a single iteration\
    \ before returning for more work. This can be too low, resulting in significant\
    \ synchronization overhead. An additional parameter can be given to the scheduler\
    \ clause to govern the chunk size used. This parameter can be a static value or\
    \ can be calculated at runtime. Listing 7.34 shows an example of dynamic scheduling\
    \ with a chunk size calculated.\n\n# Listing 7.34 Dynamic Scheduling with Chunk\
    \ Size Calculated at Runtime\n\n```\ndouble sum( double *a, int n )\n{\n    double\
    \ total = 0.0;\n    #pragma omp parallel for reduction (+: total) schedule(dynamic,\
