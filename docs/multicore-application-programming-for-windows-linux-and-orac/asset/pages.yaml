  md: "The two functions should take about the same amount of time to execute, so\
    \ it would make sense to execute them in parallel. Listing 10.20 shows the code\
    \ to do this.\n\n# Listing 10.20 Stand-Alone Parallel Program\n\n```\nimport Control.Parallel\n\
    \nmain = print (parallel 2 20)\n\nfib 0 = 0\fib 1 = 1\n n = fib (n-1) + fib (n-2)\n\
    \nfib 0 = -1\nfib 1 = 1\n n = fib (n-1) + fib (n-2)\n\nparallel a b\n  let x =\
    \ fib a\n      y = fib b\n  in x `par` `seq` (x+y))\n```\n\nIn the code, let expressions\
    \ are not assignments of values but declarations of local variables. The local\
    \ variables will be evaluated only if they are needed; this is lazy evaluation.\
    \ These local variables are used in the expression, which performs the computation.\
    \ The import statement at the start of the code imports the Control.Parallel module.\
    \ This module defines the `par` and `seq` operators. These two operators are used\
    \ so that the computation of x`fib` a and y`fib` b is performed in parallel, and\
    \ this ensures that the result (x+y) is calculated before y completed. Without\
    \ these elaborate preparations, it is possible that both threads might choose\
    \ to compute the value of the function x first.\n\nThe example given here exposes\
    \ parallelism using low-level primitives. The preferred way of coding parallelism\
    \ in Haskell is to use strategies. This approach separates the computation from\
    \ parallelism.\n\nHaskell highlights the key advantage of pure functional programming\
    \ languages that are helpful for writing parallel code. This is the result of\
    \ a function depends only on the parameters passed to it. From this, the compiler\
    \ knows that a function can be scheduled in any arbitrary order, and the results\
    \ of the function do not depend on the time at the call is made. The advantage\
    \ that this provides is adding the `par` operator to produce a parallel version\
    \ of an application is guaranteed not to change the result of the application.\
    \ Hence, parallelism is a solution for improving performance and not a source\
    \ of bugs."
