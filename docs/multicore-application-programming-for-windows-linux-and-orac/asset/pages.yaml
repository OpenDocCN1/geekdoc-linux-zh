  md: 'Writing Parallel Applications


    413


    # ## Determining Dependencies


    The largest barrier to parallelization is dependencies within the algorithm. These
    can be true dependencies where a result is required before the application can
    use that result or false dependencies where the dependency is a result of the
    implementation rather than the algorithm.


    False dependencies are easiest to resolve. A change to the implementation will
    remove the dependency enabling the application to run in parallel. For example,
    a dependency might be broken using two arrays—one to hold the original value and
    the second to hold the modified value.


    True dependencies come in two forms. Data-carried dependencies are where the result
    of a previous operation is needed before the next operation can start. Memory-carried
    dependencies are where the next operation relies on the results of a previous
    computation being available in memory.


    Even if the problem is a true dependency, it need not stop all parallelism. Sometimes
    it is possible to use speculation to enable computation to continue even when
    the exact result is not yet known. At other times there may be independent work
    that can be completed while one thread works on a serial section.


    # ## Data Races and the Scaling Limitations of Mutex Locks


    Bugs caused by data races are the most obvious manifestation of a parallelization
    problem. These relate to updates of variables without ensuring exclusive access
    to the variables. They are usually resolved by adding synchronization primitives
    (such as mutex locks) into the code to ensure exclusive access to the variables.


    Although mutex locks can be used to ensure that only a single thread has access
    to a resource at a time, they cannot enforce the ordering of accesses to data.
    An alternative approach is required if there is an order constraint on the accesses
    to shared resources. For example, if two threads need to update a variable, a
    mutex can ensure that they do not update the variable at the same time. However,
    a mutex cannot force one of the threads to be the last to perform the update.


    The problem with adding mutex locks into the code is that they serialize the access
    to the variables. Only a single thread can hold the lock, so if there are multiple
    threads that need to access the data, the application effectively runs serially
    because only one thread can make progress at a time. Even if requiring the mutex
    lock is a rare event, it can become a bottleneck if the lock is held for a long
    time or if there are many threads requiring access to the lock.


    # ## Locking Granularity


    The granularity of a lock is how much data it protects. With coarse granularity
    will protect a large amount of data, and with fine granularity will protect a
    small amount of data. Although it is tempting to place locks at the finest level
    of granularity possible, it is not usually the best strategy. Having many locks
    with fine granularity tends'
