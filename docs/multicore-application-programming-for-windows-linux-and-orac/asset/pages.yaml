  md: '# Operating System Constraints to Scaling 379


    easy to end up with multiple applications bound to the same group of virtual CPUs.
    This would result in reduced performance for all the threads bound to share virtual
    CPUs and an inefficient use of the system''s resources. This is why it is usually
    best to let the operating system manage resources. For situations where some kind
    of static allocation of threads to virtual CPUs is desired, it may be worth investigating
    some of the virtualization or resource allocation facilities provided by the operating
    system. There may be a way to divide resources between applications without running
    the risk that some of the resources might be oversubscribed and some undersubscribed.


    There is a potentially interesting situation when binding threads to virtual CPUs
    on a processor. If threads work on the memory regions with close proximity, then
    performance will be obtained when these threads are bound to cores with close
    proximity. This binding would ensure that data is shared between the threads ends
    in caches that are also shared. If thread 0 happens to fetch all the elements
    into cache, then thread 1 may be able to access a set of overlapping arrays, from
    there, rather than having to fetch them from memory.


    However, consider the situation where work is unevenly distributed between the
    threads. Suppose the amount of work done each thread diminishes that thread 0
    does the most work and thread 15 does the least. If thread 0 and 1 are bound to
    virtual CPUs on the same core, then both threads will be competing for pipeline
    resources and will consequently run slowly. On the other hand, if thread 0 were
    paired with thread 15, then thread 15 would rapidly complete its work leaving
    all the resources of the core available for use by thread 0.


    Processor binding is not something that should be undertaken without some careful
    consideration of the situation. Although it has the potential to improve performance,
    it also restricts the freedom of the operating system to dynamically schedule
    for better performance, and this can lead to the bound application taking many
    times longer than its unbound runtime.


    # Priority Inversion


    All processes and threads can have some associated priority. The operating system
    uses this to determine how much CPU time to assign to the thread. So, a thread
    with a higher priority will get more CPU time than a thread with a lower priority.
    This enables the developer to determine how time is distributed between the threads
    that comprise an application.


    For example, threads that handle the user interface of an application are often
    assigned a high priority. It is important for these threads to accept input and
    refresh the screen. These activities make the application feel responsive to the
    user. However, the application might also need to be doing some background processing.
    This background processing could be quite compute intensive. Run at a low priority,
    the background task gets into the gaps where the interface does not need attention.
    If it were scheduled with a high priority, then it would be competing with the
    user interface'
