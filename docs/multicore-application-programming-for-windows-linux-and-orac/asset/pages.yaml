  md: '# Chapter 2 Coding for Performance


    The amount of data loaded into each level of cache by a load instruction depends
    on the size of the cache line. As discussed in "Using Caches to Hold Recently
    Used Data" in Chapter 1, 64 bytes is a typical length for a cache line; however,
    some caches have longer lines than this, and some caches have shorter lines. Often
    the caches that are closer to the processor have shorter lines, and the lines
    further from the processor have longer lines. Figure 2.2 illustrates what happens
    when a line is fetched into cache from memory.


    ![](img/9337ae7b0be66cc11725becaa009908f_75_0.png)


    Figure 2.2 Fetching data from memory into caches


    On a cache miss, a cache line will be fetched from memory and installed into the
    second-level cache. The portion of the cache line requested by the memory operation
    is installed into the first-level cache. In this scenario, accesses to data on
    the 16-byte cache line as the original item will also be available from the first-level
    cache. Accesses to data that share the same 64-byte cache line will be fetched
    from the second-level cache. Accesses to data outside the 64-byte cache line will
    result in another fetch from memory.


    If data is fetched from memory when it is needed, the processor will experience
    the entire latency of the memory operation. On a modern processor, the time taken
    to perform this fetch can be several hundred cycles. However, there are techniques
    that reduce this latency:


    +   * Out-of-order execution is when the processor will search the instruction
    stream for future instructions that it can execute. If the processor detects a
    future load instruction, it can fetch the data for this instruction at the same
    time as fetching'
  merge: -1
  img_proc: true
