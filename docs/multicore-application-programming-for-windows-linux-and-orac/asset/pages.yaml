- pgno: 172
  md: "# Compiling Multithreaded Code\n\nTwo potential problem areas that arise when\
    \ compiling multithreaded code are header files and libraries. Header files might\
    \ require adaptations for multithreading, and multithreaded versions of supporting\
    \ libraries might need to be linked. In general, the compiler will make the correct\
    \ decisions, but it is important to be aware of these issues by reading the documentation\
    \ when encountering a new platform for the first time.\n\nOne example of how the\
    \ included header files might change in the presence of multithread is the errno\
    \ variable on Solaris. Solaris provides different implementations of this variable\
    \ for single-threaded and multithreaded applications. In a single-threaded application,\
    \ there is only one errno variable, so this can be an integer value. In a multithreaded\
    \ application, an errno variable needs to be defined for each thread. The compiler\
    \ flag -mt passes the define -D _REENTANT, which makes the errno variable multithread-aware\
    \ macro.\n\nListing 5.13 shows an example of a code that calls errno in a multithreaded\
    \ context. Both the main and child threads call fopen() with invalid parameters;\
    \ the child thread attempts to open the current directory for writing, and the\
    \ main thread attempts to write to an unspecified file. Both of these actions\
    \ result in the value of errno set to an error value.\n\n# Listing 5.13 Example\
    \ of Using errno in a Multithreaded Application\n\n```\n#include <stdio.h>\n#include\
    \ <errno.h>\n#include <pthread.h>\n\nvoid threadl(void * param) {\n    FILE *handle\
    \ = fopen(\".\", \"w\");\n    if (!handle) { printf(\" %d\\n\", threadl, errno);\
    \ }\n    else { fclose(handle); }\n}\n\nint main() {\n    pthread_t thread_datal;\n\
    \    int i;\n    pthread_create(&thread_datal, 0, threadl, 0);\n    FILE *handle\
    \ = fopen(\".\", \"r\");\n    if (!handle ) { printf(\" %d\\n\", main, errno);\
    \ }\n    else { fclose(handle); }\n    pthread_join(thread_datal, 0);\n}\n```"
