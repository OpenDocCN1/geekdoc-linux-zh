  md: "Chapter 4 Synchronization and Data Sharing\n\n# Avoiding Data Races\n\nAlthough\
    \ it can be hard to identify races, avoiding them can be very simple: Make sure\
    \ that only one thread can update the variable at a time. The easiest way to do\
    \ this is to place a synchronization lock around all accesses to that and ensure\
    \ that before referencing the variable, the thread must acquire the lock. Listing\
    \ 4.6 shows a modified version of the code. This version uses a mutex lock, described\
    \ in detail in the next section, to protect accesses to the variable counter.\
    \ Although this ensures the correctness of the code, it does not necessarily give\
    \ the best performance, as will be discussed in later chapters.\n\nListing 4.6\
    \ Code Modified to Avoid Data Races\n\n```\nvoid * func(void * params) \n{\n \
    \ pthread_mutex_lock(&mutex);\n  counter++;\n  pthread_mutex_unlock(&mutex);\n\
    }\n```\n\n# Synchronization Primitives\n\nSynchronization is used to coordinate\
    \ the activity of multiple threads. There are various situations where it is necessary;\
    \ this might be to ensure that shared resources are not accessed by multiple threads\
    \ simultaneously or that all work on resources is complete before new starts.\n\
    \nMost operating systems provide a rich set of synchronization primitives. It\
    \ is usually most appropriate to use these rather than attempting to write custom\
    \ methods of synchronization. There are two reasons for this. Synchronization\
    \ primitives provided by the operating system will be widely recognized by the\
    \ tools provided with that operating system. Hence, the user will be able to do\
    \ a better job of detecting data races or correctly. The operating system will\
    \ often provide support for sharing the primitives between threads or processes,\
    \ which can be hard to do efficiently without operating system support. However,\
    \ the most critical consideration is that the code provided by the operating system\
    \ is likely to contain bugs. Discussion of writing custom synchronization primitives\
    \ is covered in Chapter 8, \"Hand-Coded Synchronization and Sharing.\"\n\n# Mutexes\
    \ and Critical Regions\n\nThe simplest form of synchronization is a mutually exclusive\
    \ (mutex) lock. Only one thread at a time can acquire a mutex lock, so they can\
    \ be placed around a data structure to ensure that the data structure is modified\
    \ by only one thread at a time. Listing 4.7 shows how a mutex lock could be used\
    \ to protect access to a variable."
