    # The Performance of 32-bit vs 64-bit Code


    A 64-bit processor can, theoretically, address up to 16 exabytes (EB), which is
    4GB squared, physical memory. In contrast, a 32-bit processor can address a maximum
    of 4GB of memory. Some applications only find able to address 4GB of memory to
    size—a limitation—a particular example is databases that can easily exceed 4GB
    in size. Hence, a change to 64-bit addresses enables the mapping of much larger
    data sets, such as AMD64, EMT64, x86-64, or just x64.


    The 64-bit instruction extensions for the x86 not only increase the memory that
    the processor could address, but also improved performance by eliminating or reducing
    two problems.


    The first issue addressed is the stack-based calling convention. This convention
    leads to code using stack and load instructions to pass parameters into functions.
    In 32-bit code when a function is called, all the parameters to that function
    need to be stored on the stack. The first action that the function takes is to
    load those parameters back off the stack and into registers. In 64-bit code, the
    parameters are kept in registers, avoiding all load and store operations.


