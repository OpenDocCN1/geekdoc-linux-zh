  md: '# Operating System Constraints to Scaling


    Recent x86 processors have implemented a pause instruction, which causes the thread
    to pause for a number of cycles before issuing the next instruction. On older
    processors, the pause instruction maps onto a no-op instruction; however, the
    use of the instruction is fine on older hardware, but the old hardware will not
    actually pause. Windows implements a yieldprocessor() macro for pause/delay to
    provide an easy way of accessing this operation.


    # Operating System Constraints to Scaling


    Most limitations to scaling are caused by either limitations of the hardware or
    inefficiencies in the implementation of the actual application. However, as the
    number of cores increases, it is not uncommon to uncover problems in the operating
    system or the libraries provided with it.


    # Oversubscription


    Oversubscription is when there are too many active threads on a system. This is
    not a constraint on the absolute number of threads the system, only on the number
    of active threads. If there are continuously more threads requesting CPU time
    than there are virtual CPUs, then the system may be considered to be oversubscribed.


    Although consequent threads take resources as much, they do not tend to consume
    much processor time, so a system can sustain a high count of idle threads. A system
    can sustain more active threads than there are virtual CPUs, but each active thread
    will only get a share of the available CPU resources. On a system where there
    are twice as many active software threads as are hardware threads to sustain them,
    each active software thread will end up with 50% of the time of one of the virtual
    CPUs.


    Having multiple threads share the same CPU will typically lead to a greater linear
    reduction in performance because of a number of factors such as the cost of switching
    switching between the active threads, the eviction of useful data from the cache,
    and the costs associated with the migration of threads between virtual CPUs. It
    is also worth considering that each thread requires some memory footprint, and
    a proliferation of threads is one of causing a shortage of memory.


    A key point to observe is that having more active threads than are virtual CPUs
    can only decrease the rate at which each thread works. There is one situation
    where there is likely to be a benefit from having more threads than virtual CPUs.
    Threads that are sleeping or blocked waiting for a resource do not consume CPU
    and should not impact the performance of the active threads. An example of this
    is when there are many threads waiting for disk or network activity to complete.


    It may be useful to have many threads waiting for disk I/O to complete. In this,
    it is a critical matter of improving the performance of applications that have
    waits for I/O—the main thread can continue, while a child thread waits for the
    completion of an I/O request.


    The code in Listing 9.29 can be used to demonstrate how the performance of a single
    thread can suffer in the presence of other active threads. The code measures how'
