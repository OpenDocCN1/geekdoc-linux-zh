  img_proc: true
- pgno: 125
  md: 'In this instance, the tasks themselves are largely independent. They may occasionally
    communicate, but that communication is likely to be asynchronous or perhaps limited
    to exceptional situations.


    Figure 3.14 shows a single system running three tasks. Task A is a control or
    supervisor, and tasks B and C are reporting status to task A.


    ![](img/9337ae7b0be66cc11725becaa009908f_125_0.png)


    The performance of the application depends on the activity of these individual
    tasks. If the CPU-consuming part of the "application" has been split off into
    a separate task, then the rest of the components can become more responsive. For
    an example of this improved responsiveness, assume that a single-threaded application
    is responsible for receiving and forwarding packets across the network and for
    maintaining a log of activity on disk. This could be split into two loosely coupled
    tasks—one receives and forwards packets while the other is responsible for maintaining
    the log. With the original code, there might be a delay in processing an incoming
    packet if the application is busy writing status to the log. If the application
    is split into separate tasks, the packet can be received and forwarded immediately,
    and the log writer will record this event at a convenient point in the future.


    The performance gain arises in this case because we have shared the work between
    two threads. The packet-forwarding task only has to process packets and does not
    get delayed by disk activity. If we assume that it takes 1ms to read and forward
    the packet and another 1ms to write status to disk, then with the original code,
    we can process a new packet every 2ms (this represents a rate of 5,000 packets
    per second). Figure 3.15 shows this situation.


    ![](img/9337ae7b0be66cc11725becaa009908f_125_1.png)'
