    # How Latency and Bandwidth Impact Performance


    Memory latency is the time between a processor requesting an item of data and
    that item of data arriving from memory. The more processors there are in a system,
    the longer the memory latency. A system with a single processor can be cold, and
    when the system gets large latency of less than 100ns; with two processors this
    can be double, and completes multiple boards, the memory latency can become very
    high. Memory latency is a problem because there is little that a processor can
    do while it is waiting for order(Oo) execution, which enable the processor to
    make some progress while waiting for data from memory. However, it is unlikely
    that these techniques will hide the entire cost of a memory miss, although they
    may manage to cover the time to get data from the second-level cache. These techniques
    also add significant complexity and implementation area to the design of the processor
    core.


    Cores that support multiple hardware threads are an alternative to the problem
    of memory latency. When one thread is still waiting for data to be returned from
    memory, the other threads can still make forward progress. Although having multiple
    hardware threads does not improve the performance of the stalled thread, it improves
    the utilization of the core and consequently improves the throughput of the core
    (that is, there are threads completing work even if one thread is stalled).


