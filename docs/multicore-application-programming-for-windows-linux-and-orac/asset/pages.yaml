  md: "# Chapter 3 Identifying Opportunities for Parallelism\n\nWith an antidependency,\
    \ or write after read, one task has to read the data before the second task can\
    \ overwrite it. With an output dependency, or write after write, one of the tasks\
    \ tasks has provide the final result, and the order in which the two tasks write\
    \ their results is critical. These two types of dependency can be most clearly\
    \ illustrated using serial code.\nnThe code shown in Listing 3.6, there is an\
    \ antidependency on datal. The first statement needs to complete before the second\
    \ statement because the second statement replaces the variable datal.\n\nListing\
    \ 3.6 An Example of an Antidependency\n\n```\nvoid antidependency()\n{\n    result1\
    \ = calculation( datal ); // Needs to complete first\ndatal = result2 + 1;   \
    \   // Overwrite datal\n}\n```\n\nIf one of the statements was modified to use\
    \ an alternative or temporary variable, for example, datal_prime, then both statements\
    \ could proceed in any order. Listing 3.7 shows this modified code.\n\nListing\
    \ 3.7 Fixing an Antidependency\n\n```\nvoid antidependency()\n{\n    datal_prime\
    \ = datal; // Local copy of data\n    result1 = calculation( datal_prime );\n\
    datal = result2 + 1; // No longer has antidependency\n}\n```\n\nThe code shown\
    \ in Listing 3.8 demonstrates an output dependency on the variable datal. The\
    \ second statement needs to complete after the first statement only because both\
    \ write to the same variable.\n\nListing 3.8 An Output Dependency\n\n```\nvoid\
    \ output-dependency()\n{\n    datal = result1 + 2;\ndatal = result2 + 2; // Overwrites\
    \ same variable\n}\n```\n\nIf the first target variable was renamed datal_prime,\
    \ then both statements could proceed in any order. Listing 3.9 shows this fix."
