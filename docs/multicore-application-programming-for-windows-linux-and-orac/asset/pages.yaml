    Processes are the fundamental building blocks of applications. Multiple applications
    running simultaneously are really just multiple processes. Support for multiple
    users is typically implemented using multiple processes with different permissions.
    Unless the process has set up to explicitly share state with another process,
    all of its state is private to the process—no other process can see in. To take
    a tangible example, if you run two copies of a text editor, they might both have
    a variable current_line, but neither could read the other''s value for this particular.


    A particularly critical part of the state for an application is the memory that
    has been allocated to it. Recall that memory is allocated using virtual addresses,
    so both copies of the hypothetical text editor might store the document at virtual
    addresses 0x11a000. Each application will maintain its own TLB mappings, so virtual
    addresses will map onto different physical addresses. If one core is running the
    TLB for its mappings—so multiple active processes will end up increasing the pressure
    to use half the TLB entries for mappings on internal chip structures like the
    TLBs or caches so that the number of TLB or caches will increase.


    Each process could run multiple threads. A thread has some state, like a process
    does, but its state is basically just the values held in its registers plus the
    data on its stack. Figure 1.23 shows the memory layout of a multithreaded application.nA
    thread shares a lot of state with others in the application. To go back to the
