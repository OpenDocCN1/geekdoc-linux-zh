  md: "# Chapter 5 Using POSIX Threads\n\n# Message Queues\n\nMessage queues are a\
    \ method of passing messages between threads or processes. Messages can be placed\
    \ into a queue, and they will be read out of the queue in a prioritized first-in,\
    \ out-order.\n\nTo attach to a message queue, the mq_open() function needs to\
    \ be called, which will return a handle to the message queue. This takes a minimum\
    \ of the name of the message queue and flags. The name of the message queue should\
    \ start with a / and then up to 13 further characters. The flags need to be O_RDONLY,\
    \ O_WRONLY, or O_RDWR to produce a read-only, a write-only message queue, or a\
    \ read-write message queue.\n\nThe open in this call will open an existing message\
    \ queue or fail if the message queue does not exist. If the additional flag O_CREATE\
    \ is passed, the call will create the message queue if it not already exist. The\
    \ additional flag O_EXCL can be passed if the call to open the queue should succeed\
    \ only if the message queue does not exist. If the flag O_CREATE is passed, the\
    \ call to mq_open() requires two parameters, a mode setting that is used to set\
    \ the access permissions for the message queue and a pointer to the attributes\
    \ for the message queue; if this pointer is null, default values are used for\
    \ the message queue attributes.\n\nThe attributes for a message queue are held\
    \ in a mq_attr structure, which contains the fields mq_maxmsg, which is the maximum\
    \ number of messages that can be held in the message queue, and mq_msgsize, which\
    \ is the maximum size of the messages that can be stored in the message queue.\n\
    \nThe other flag that can be passed to mq_open() is O_NONBLOCK. If this flag is\
    \ set, attempts to write to a full message queue or read from an empty one will\
    \ fail and return immediately. The default is to block until the message queue\
    \ has space for sending an additional message, or has a message in it.\n\nThe\
    \ function mq_close(), which takes the handle to a message queue as a parameter,\
    \ will close the connection to the message queue. The message queue will continue\
    \ to exist. To remove the message queue from the system, it is necessary to call\
    \ mq_unlink(), which takes the name of the message queue as a parameter. After\
    \ a call to mq_unlink(), the message queue will be removed once all current references\
    \ to the message queue have been closed.\n\nThe code in Listing 5.59 demonstrates\
    \ creating and deleting a message queue.\n\n# Listing 5.59 Opening and Closing\
    \ a Message Queue\n\n```\n#include <mqueue.h>\n\nint main()\n{\n    mq_attr attr;\n\
    \    mqd_t queue;\n    attr.mq_maxmsg = 1000;\n```"
