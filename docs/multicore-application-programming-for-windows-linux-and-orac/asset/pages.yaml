  md: "# Using OpenMP to Produce a Parallel Application\n\n# Allowing Threads to Continue\
    \ Execution Beyond a Parallel Region\n\nThe nowait clause applies to parallel\
    \ sections, and single directives. All of these directives have an implicit wait\
    \ at the end of the parallel region. Use of the directive means that the threads\
    \ in the parallel region will continue into the next code region once they have\
    \ completed the current one without waiting for the other threads to complete\
    \ their work. Listing 7.49 contains an example of two loops that iterate over\
    \ two different ranges on different sets of variables. Once the threads have completed\
    \ the first loop, there is no reason why they should not start the second loop.\
    \ This preference can be denoted by labeling the first loop with the nowait clause.\
    \ The second loop keeps the implicit wait clause, so execution will not continue\
    \ until all threads complete their second loop.\n\nListing 7.49 Using the nowait\
    \ Clause\n\n```\ndouble calc(double *a, int len,\\    double totala = 0.0, totalb\
    \ = 0.0;\n    #pragma omp parallel\n    {\n        #pragma omp for nowait reduction(+:\
    \ totala)\n        for (int i=0; i<len; i++)\n        {\n            totala +=\
    \ a[i];\n        }\n        #pragma omp omp for reduction(+:totalb)\n        for\
    \ (int i=0; i<lenb; i++)\n        {\n            totalb += b[i];\n        }\n\
    \    }\n    return totala + totalb;\n```\n\n# Causing Waits Until All The Threads\
    \ Have Completed Their Work\n\nThe barrier directive places an explicit barrier\
    \ in a parallel region. In Listing 7.50, the barrier directive is used with the\
    \ master directive to ensure that all threads wait while the master thread completes\
    \ its task. The master directive does not have an implicit wait clause, so without\
    \ the barrier directive, the single thread may print its output before the master\
    \ thread. With this barrier in place, the code will always print the string \"\
    Master thread\" before it prints the string \"Single thread\"."
  merge: -1
  img_proc: true
