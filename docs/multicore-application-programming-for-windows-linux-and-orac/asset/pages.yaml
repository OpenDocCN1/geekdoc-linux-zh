  md: "# Ensuring That Code in a Parallel Region Is Executed in Order 285\n\n# Ensuring\
    \ That Code in a Parallel Region Is Executed in Order\n\nIn cases, it may be necessary\
    \ to ensure that a section of code is executed in the same order as the serial\
    \ code would execute it. Unfortunately, such ordering is unlikely to allow the\
    \ code to get the full benefit of multiple threads, but it should enable some\
    \ gains to be attained from parallelization.\n\nOpenMP supports the ordered directive,\
    \ which ensures that the order of parallel execution is the same as the serial\
    \ ordering. The directive needs to be applied to the parallel region, and the\
    \ loop also needs to be identified as an ordered loop using the ordered clause\
    \ on the parallel directive.\n\nListing 7.58 shows how the ordered directive can\
    \ be used to ensure that the loop iterations are printed in the correct order.\n\
    \nListing 7.58 Using the Ordered Directive to Ensure Code Executes in the Serial\
    \ Order\n\n```\n#include <stdio.h>\n#include <omp.h>\n\nint main() {\n    #pragma\
    \ omp parallel for ordered\n    for ( int i=0; i<100; i++) {\n        #pragma\
    \ omp ordered\n        {\n            printf(\" Iteration %i, thread ID %%d\\\
    n\", i, omp_get_thread_num());\n        }\n    }\n}\n```\n\nThe ordered directive\
    \ is most useful when applied to loops that do not use static scheduling. With\
    \ the default static scheduling in the example, the first thread will execute\
    \ the first portion of the iterations, the second thread the second portion, and\
    \ so on. Since the ordered region needs to be executed in the serial order, the\
    \ second thread ends up waiting at the ordered code block until the first thread\
    \ has completed all of its assigned work. This means that the work is serialized,\
    \ but each serial chunk of work has been performed by a different thread.\n\n\
    The ordered directive is a useful way of exploring the impact of the scheduling\
    \ on the order in which iterations are assigned to threads. Listing 7.59 shows\
    \ the code modified to use dynamic scheduling."
