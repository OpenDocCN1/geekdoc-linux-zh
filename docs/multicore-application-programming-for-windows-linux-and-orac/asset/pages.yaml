    }\n```\n\n```\nvoid updateMatrix(int x, int y, int value)\n{\n  pthread_rwlock_wrlock(&lock);\n\
    \  matrix[x,y] = value;\n  pthread_rwlock_wunlock(&lock);\n}\n```\n\nThe read-write\
    \ lock is unnecessary in this short code snippet because load or store accesses\
