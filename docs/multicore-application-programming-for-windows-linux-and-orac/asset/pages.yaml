- pgno: 436
  md: '# Parallel Code on Multicore Processors 415


    Many of the other issues encountered with parallel programs relate to the communication
    costs between the threads. For example, the cost of false sharing where multiple
    threads update sensitive items of data residing on the same cache line is the
    cost of migrating a cache line between different processors. On a multiprocessing
    system, the cost of false sharing is some multiplier of memory latency. On a multicore
    processor, the shared cache becomes resident in the cache, and the communication
    costs are substantially reduced. This means the performance costs of false sharing
    can become insignificant. Similarly, the cost of true sharing are reduced; data
    becomes resident, and even mutex locks can become resident in the cache.


    Low communication latency leads to better scaling because the overheads associated
    with synchronization are substantially reduced. Hence, multicore processors have
    a better scaling potential than multiprocessor systems


    # Optimizing Programs for Multicore Processors


    In some senses, the process of optimizing programs for multicore processors is
    no different from the process of optimizing them for single-core processors. An
    improvement in the performance of the serial code will still lead to a performance
    gain on a multicore processor. Therefore, traditional program optimization skills
    are still very relevant.


    What changed are the potential benefits of parallelization versus those from optimization.
    Suppose an application spends half of its time in a particular routine. Traditional
    optimizations applied to that routine might lead to a 10% gain in performance,
    and perhaps it might even be possible to double the performance of that part of
    the code. Ideally, the gains would come from algorithmic improvements, but they
    often come from tuning to take advantage of the features of the hardware. Hardware
    tuning tends to be high cost because there is no guarantee that it will be effective
    on a different processor, and consequently, runs the risk of requiring further
    tuning in the future.


    The other option is to parallelize the code. If this is successful, the performance
    of the routine with two threads could be twice that of one thread, and it may
    be possible to scale to four or eight threads, even more impressive gains over
    the serial code. The potential gains from parallelization are far greater than
    the gains from traditional performance tuning. Although the traditional approaches
    are still relevant, it is best to consider parallelization for performance as
    early as possible.


    The best approach is probably a hybrid. It is still important to profile the serial
    code to ensure that there are no obvious problems with it before using multiple
    threads inefficiently either a poor choice of algorithm or a poor implementation.
    Once any major issues with the serial algorithm have been resolved, the work can
    move on improving the scaling and performance of the parallel implementation.
    The final choice of where to spend time depends on the potential gain from the
    work. Could a developer get more performance by optimizing the serial code or
    through parallelizing the serial code?


    There is one aspect of multicore processors that causes parallelization to be
    a more attractive approach than serial performance tuning. The way that threads
