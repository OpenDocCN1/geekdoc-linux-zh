  md: "# Clustering Technologies\n\nThe worker processes run the code shown in Listing\
    \ 10.24. Each process computes every Nth row of the matrix and then passes this\
    \ row to the master process. The main routine is also in this listing. This routine\
    \ needs to do the normal setup and teardown of the MPI library and then decide\
    \ whether the process is the master or one of the workers.\n\nListing 10.24 MPI\
    \ Worker Thread and Setup Code\n\n```\nvoid workerprocess()\n{\n    int *data,\
    \ row;\n    data = malloc(sizeof(int) * COLS);\n    row = myid;\n    while (row\
    \ <= ROWS )\n{\n        computer(row, data, data);\n        MPI_Send(data, COLS,\
    \ MPI_INT, 0, row, MPI_COMM_WORLD);\n        row += numproc-1;\n    }\n    free(data);\n\
    }\n\nint main(int argc, char *argv[])\n{\n    MPI_Init(&argc, &argv);\n    MPI_Comm_size(MPI_COMM_WORLD,\
    \ &numproc);\n    MPI_Comm_rank(MPI_COMM_WORLD, &myid);\n    if (myid == 0 ) (\
    \ masterprocess(); ) else { workerprocess(); }\n    MPI_Finalize();\n    return\
    \ 0;\n}\n```\n\nThe program as achieves little parallelism. This is for a couple\
    \ of reasons. The first is that the send and receive operations are blocking.\
    \ The sending processes cannot make progress until the receiving process receives\
    \ the data. The receiving process pounds this by looking for the data in order.\n\
    \nThe code could be modified using a nonblocking send operation so that the worker\
    \ could overlap communication with computation. Another improvement to the code\
    \ would be for the master process to accept data from the workers in any order,\
    \ rather than requiring the data to be received in order.\n\nWith the increase\
    \ in the number of available cores, it becomes appropriate to combine MPI for\
    \ parallelization across nodes with OpenMP for parallelization within a node.\
    \ This allows an application to use coarse-grained parallelism to scale to large\
    \ numbers of nodes and then a finer degree of parallelism to scale to large numbers\
    \ of cores."
