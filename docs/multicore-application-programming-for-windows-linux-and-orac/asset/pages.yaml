- pgno: 22
  md: '# Hardware, Processes, and Threads


    It is not necessary to understand how hardware works in order to write serial
    or parallel applications. It is quite permissible to write code while treating
    the internals of a computer as a black box. However, a simple understanding of
    processor internals will make some of the later topics more obvious. A key difference
    between serial (or single-threaded) applications and parallel (or multithreaded)
    applications is that the presence of multiple threads causes more of the attributes
    of the system to become important to the application. For example, a single-threaded
    application does not have multiple threads contending for the same resource, whereas
    this can be a common occurrence for a multithreaded application. The resource
    might be space in the caches, memory bandwidth, or even just physical memory.
    In these instances, the characteristics of the hardware may manifest in changes
    in the behavior of the application. Some understanding of the way that the hardware
    works will make it easier to understand, diagnose, and fix any aberrant application.


    # Examining the Insides of a Computer


    Fundamentally a computer computes one or more processors and some memory. A number
    of chips and wires glue this together. There are also peripherals such as disk
    drives or network cards.


    Figure 1.1 shows the internals of a personal computer. A number of components
    go into a computer. The processor and memory are plugged into a circuit board,
    called the motherboard. Wires lead from this to peripherals such as disk drives,
    DVD drives, and so on. Functions such as video or network support are integrated
    into the motherboard or are supplied as plug-in cards.


    It is possible to understand how the components of the system are related if the
    information is presented as a schematic, as in Figure 1.2. This schematic separates
    the compute side of the system from the peripherals.'
  merge: -1
  img_proc: true
