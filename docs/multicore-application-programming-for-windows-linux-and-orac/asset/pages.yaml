  md: "# Operating System–Provided Atomics\n\nUsing the information in this chapter,\
    \ it should be possible for you to write some fundamental atomic operations as\
    \ an atomic add. However, these operations may already be provided by the operating\
    \ system. The key advantage of using the operating system-provided code is that\
    \ it should be correct, the cost is typically a slight increase in overhead. Hence,\
    \ it is recommended that this code be taken advantage of whenever possible.\n\n\
    gcc provides the operations such as __sync_fetch_and_add(), which fetches a value\
    \ from memory and adds an increment to it. The return value is the variable before\
    \ the increment. Windows defines InterlockedExchangeAdd(), which provides the\
    \ same operation, and Solaris has a number of atomic_add() functions to handle\
    \ different variable types. Table 8.1 on page 311 provides a mapping between the\
    \ atomic operations provided by gcc, Windows, OS X, and Solaris. An asterisk in\
    \ the function name indicates it is available for multiple types.\n\nThe code\
    \ in Listing 8.15 uses the gcc atomic operations to enable multiple threads to\
    \ increment a counter. The program creates ten threads, each of which completes\
    \ the function work(). The original program also executes the same code. Each\
    \ thread increments the counter 10 million times so that at the end of the program,\
    \ variable holds the value 110 million. If the atomic add operation is replaced\
    \ with a normal unprotected increment operation, the output is unpredictable due\
    \ to the data race that introduces.\n\n# Listing 8.15 Using Atomic Operations\
    \ to Increment a Counter\n\n```\n#include <stdio.h>\n#include <pthread.h>\n\n\
    volatile int counter=0;\n\nvoid *work(void * param)\n{\n    int i;\n    for(i=0;\
    \ i<1000000; i++)\n    {\n        __sync_fetch_and_add(&counter, 1);\n    }\n\
    }\n\nint main()\n{\n    int i;\n    pthread_t threads[10];\n    for(i=0; i<10;\
    \ i++)\n{\n```"
