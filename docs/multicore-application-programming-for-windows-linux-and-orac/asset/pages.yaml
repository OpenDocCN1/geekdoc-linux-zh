  md: '# Chapter 9 Scaling Multicore Processors


    Note that this code contains a call to the Solaris function processor_bind(),
    which binds a thread to a particular CPU. This is used in the code to ensure that
    two threads are placed on the same core. Binding will be discussed in the section
    "Using Processor Binding to Improve Memory Locality."


    Obviously, when multiple threads are bound to the same processor core, there are
    other reasons why the performance might not scale. To prove that the problem we
    are observing is a cache capacity event, we need to eliminate the other options.


    In this particular instance, the only other possible reason is that instruction
    capacity was unable to instruct the instructions from both streams as it could
    instruct the instructions from a single stream.


    There are two ways to determine whether the size of the data used by each thread
    was the problem. The first way is to perform the experiment where the size of
    the data used by each thread is reduced so that the combined footprint is less
    than the size of the cache. If this is done and there is no impact performance
    from adding a second thread, it indicates that the problem is a cache capacity
    issue and not of the two threads sharing issue.


    However, modifying the structures of an application is only practical on test
    codes. It is hard to perform the same experiments on real programs. An alternative
    way to identify the same issue is to look at miss rates using the hardware counters
    available on most processors.


    One tool to access the hardware counters on Solaris is exploit. This tool reports
    the number of hardware counter event triggered by a single process. Listing 9.24
    shows the results of using exploit to count the cache misses from a single-threaded
