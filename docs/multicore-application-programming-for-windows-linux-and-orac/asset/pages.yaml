  md: "# Chapter 7 Using Automatic Parallelization and OpenMP\n\nListing 7.50 Using\
    \ the barrier Directive to Cause Other Threads to Wait for Master Thread\n\n```\n\
    #include <stdio.h>\n\nint main()\n{\n    #pragma omp parallel\n    {\n       \
    \ #pragma omp master\n        {\n            printf(\"Master thread\\n\");\n \
    \       }\n        #pragma omp barrier\n        #pragma omp single\n        {\n\
    \            printf(\"Single thread\\n\");\n        }\n    }\n}\n```\n\nWaiting\
    \ for All Child Tasks to Complete\nWhen an application has been parallelized using\
    \ tasks, it can be useful to wait for all the current child tasks from a parallel\
    \ region to complete before continuing execution. The taskwait directive ensures\
    \ that this condition is met. Consider the code shown in Listing 7.51.\n\nListing\
    \ 7.51 Using the taskwait Directive Wait for Child Tasks to Complete\n\n```\n\
    #include <stdio.h>\n\nint work(int i)\n{\n    if (i > 0)\n    {\n        #pragma\
    \ omp parallel\n        {\n            #pragma omp task\n            {\n     \
    \           work(i-1);\n            }\n            #pragma omp task\n        \
    \    {\n                work(i-1);\n            }\n            #pragma omp taskwait\n\
    \        }\n    }\n}\n```"
