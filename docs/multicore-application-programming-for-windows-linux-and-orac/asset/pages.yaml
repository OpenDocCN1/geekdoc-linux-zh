    To keep fetching instructions, the processor needs to guess the next instruction
    that will be executed. Most of the time this will be the instruction at the following
    address in memory. However, a branch instruction might change the address where
    the instruction is to be fetched—but the processor will know this only once all
    the conditions that the branch depends on have been resolved and the actual branch
    instruction has been executed.


    The usual approach to dealing with this is to predict which branches are taken
    and start fetching instructions from the predicted address. If the processor predicts
    correctly, then there is no interruption to the execution—and no cost to the branch.
    If the processor predicts incorrectly, all the instructions executed after the
    branch need to be flushed, and the correct instruction stream needs to be fetched
    from memory. These are called branch mispredictions, and their cost is proportional
    to the length of the pipeline. The longer the pipeline, the longer it takes to
    get the correct instructions through the pipeline in the event of a mispredicted
    branch.


    Pipelining enabled higher clock speeds for processors, but they were still executing
    only a single instruction every cycle. The next improvement was “super-scalar
    execution,” which means the ability to execute multiple instructions per cycle.
    The Intel Pentium was the first x86 processor to execute multiple instructions
    on the same cycle; having two pipelines, each of which could execute an instruction
    every cycle. Having two potentially doubled performance over the previous generation.


