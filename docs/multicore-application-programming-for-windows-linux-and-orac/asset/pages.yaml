- pgno: 160
  md: '# Named Pipes


    UNIX uses pipes to pass data from one process to another. For example, the output
    from the command ls, which lists all the files in a directory, could be piped
    into the command, which counts the number of lines, words, and characters in the
    input. The combination of the two commands would be a count of the number of files
    in the directory. Named pipes provide a similar mechanism that can be controlled
    programmatically.


    Named pipes are file-like objects are given a specific name that can be shared
    between processes. Any process can write into the pipe or read from the pipe.
    There is no concept of a "message"; the data is treated as a stream of bytes.
    The method for using a named pipe is much like the method for using a file:The
    pipe is opened, data is written into it and then the pipe is closed.


    Listing 4.23 shows the steps necessary to set up and write data into a pipe, before
    closing and deleting the pipe. One process needs to make the pipe, and once it
    has been created, it can be opened and used for either reading or writing. Once
    the process has completed, the pipe can be closed, and one of the processes should
    also be responsible for deleting.


    Listing 4.23 Setting Up and Writing into a Pipe


    ```

    MakePipe( Descriptor );

    ID = OpenPipe( Descriptor );

    WritePipe(ID, Message, sizeof(Message) );

    ...

    ClosePipe( ID );

    DeletePipe( Descriptor );

    ```


    Listing 4.24 shows the steps necessary to open an existing pipe and read messages
    from it. Processes can use the same descriptor and use the same pipe for communication.


    Listing 4.24 Opening an Existing Pipe to Receive Messages


    ```

    ID=OpenPipe( Descriptor );

    ReadPipe(ID, buffer, sizeof(buffer) );

    ...

    ClosePipe( ID );

    ```


    # Communication Through the Network Stack


    The network stack is a fairly complex set of layers that range from the network
    card up to the layer that provides the network packet communication used by applications
    like browsers. Full coverage of it is outside the scope of this book. However,
    networking is available on most platforms, and as such it is a possible candidate
    for communication. An advantage to using networking to communicate is that applications
    communicate'
