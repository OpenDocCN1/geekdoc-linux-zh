  md: "# Chapter 6 Windows Threading\n\nsleep, the thread that was in the critical\
    \ section will already have left it. Therefore, making the thread sleep and then\
    \ waking it up is just a waste of time.\nThere are two alternatives. The programmer\
    \ can call TryEnterCriticalSection(), which will return immediately returning\
    \ true, meaning that the thread has acquired access to the critical section, or\
    \ false, meaning that the thread is currently in the critical section. The code\
    \ that protects access to the counter could be written using TryEnterCriticalSection(),\
    \ as shown in Listing 6.16.\n\n# Listing 6.16 TryEnterCriticalSection() to Avoid\
    \ Putting Calling Threads to Sleep\n\n```\nwhile (count<100)\n{\n    while (!TryEnterCriticalSection(&critical\
    \ )) { }\n    int number = count++;\n    LeaveCriticalSection(&critical);\n  \
    \  printf(\"Thread ID %i; value = %i, is prime = %s\\n\",\n           GetCurrentThreadId(),number,\
    \ isprime(number));\n}\n```\n\nThis would cause the process to spin continuously\
    \ until it got the lock. One of the problems with having a thread spin is that\
    \ it is potentially depriving other threads of processor time. In particular concern\
    \ would be the case where the spinning thread stops the other thread, which is\
    \ currently in the critical section, from getting back onto the processor. Consequently,\
    \ this style of programming is one that should only be undertaken with care.\n\
    \nThe other approach is to have the thread wanting to enter the critical section\
    \ spin briefly in the hope that the thread currently in the critical section will\
    \ soon leave. If the other thread leaves the critical section, the spinning thread\
    \ can immediately enter the critical section. Once the thread has spun for a predetermined\
    \ time, it goes to sleep until the other eventually leaves the critical section.\
    \ This approach represents a trade-off between the immediacy of spinning for the\
    \ critical section and the poor utilization of resources that spinning causes.\n\
    \nCritical sections support this spinning for a short time before sleeping. There\
    \ are two ways of setting the number of times that a thread calling\nEnterCriticalSection()\
    \ will spin before it goes to sleep. The critical section can be initialized with\
    \ the value through the initialization call\nInitializeCriticalSectionAndSpinCount(),\
    \ which takes the pointer to the critical section, and the spin count as parameters.\
    \ Or, once the critical section has been created, the spin count can be set through\
    \ a call to SetCriticalSectionSpinCount().\n\nListing 6.17 shows calls to these\
    \ routines."
