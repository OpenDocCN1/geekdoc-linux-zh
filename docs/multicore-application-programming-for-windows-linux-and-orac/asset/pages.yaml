- pgno: 149
  md: '# Chapter 4 Synchronization and Data Sharing


    If the calls to malloc() are replaced with the threadSafeMalloc() call, then only
    one thread at a time can be in the original malloc() code, and the calls to malloc()
    become thread-safe.


    Threads block if they attempt to acquire a mutex lock that is already held by
    another thread. Blocking means that the threads are sent to sleep immediately
    or after a few unsuccessful attempts to acquire the mutex.


    One problem with this approach is that it can serialize a program. If multiple
    threads simultaneously call threadSafeMalloc(), only one thread at a time will
    progress. This causes the multithreaded program to have only a single executing
    thread, which stops the program from taking advantage of multiple cores.


    # Spin Locks


    Spin locks are essentially mutex locks. The difference between a mutex and a spin
    lock is that a thread waiting to acquire a spin lock will keep trying to acquire
    the lock without sleeping. In comparison, a mutex lock may sleep if it is unable
    to acquire the lock. The advantage of using spin locks is that they acquire the
    lock as soon as it is released, whereas a mutex lock will need to be woken by
    the operating system before it can get the lock. The disadvantage is that a spin
    lock will spin on a virtual CPU monopolizing resource. In comparison, a mutex
    lock will sleep and free the virtual CPU for another thread to.


    Often locks are implemented to be a hybrid of spin locks and more traditional
    mutex locks. The thread attempting to acquire the spins for a while before blocking.
    This is a performance advantage to this. Since most mutex locks are held for a
    short period of time, it is quite likely that the lock will quickly become free
    for the waiting thread to acquire. So, spinning for a short period of time makes
    it likely that the waiting thread will acquire the mutex as soon as it is released.
    However, continuing to spin for a long period of time consumes hardware resources
    that could be better used in other software threads to run.


    # Semaphores


    Semaphores are counters that can be either incremented or decremented. They can
    be used in situations where there is a finite limit to a resource and a mechanism
    is needed to impose that limit. An example might be a buffer that has a fixed
    size. Every time an element is added to a buffer, the number of available positions
    is decreased. Every time an element is removed, the number available is increased.


    Semaphores can also be used to mimic mutexes; if there is only one element in
    the semaphore, then it can be either acquired or available, exactly as a mutex
    can be locked or unlocked.


    Semaphores will also signal or wake up threads that are waiting on them to use
    available resources; hence, they can be used for signaling between threads. For
    example, a thread might set a semaphore once it has completed its initialization.
    Other threads could wait on the semaphore and be signaled to start work once the
    initialization is complete.'
  merge: -1
  img_proc: true
