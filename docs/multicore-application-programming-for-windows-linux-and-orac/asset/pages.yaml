- pgno: 161
  md: '# Chapter 4 Synchronization and Data Sharing


    between processes on a single system or processes on different systems connected
    by a network. The only changes necessary would be in the address where the packets
    of data were sent. Although communications across a network can be quite high
    latency, using networking to communicate between processes on the same machine
    will typically be lower cost, but not as low as some of the other methods of communication.


    Communication across the network usually involves a client-server model. To set
    up a server, it is first necessary to open a socket and bind that socket to the
    address on the local host before starting to listen for incoming connections.
    When a connection arrives, data can be read from it or written to it, until the
    connection is closed. Once the connection is closed, it is possible to close the
    socket. The server thread illustrates how the client-server network connection
    can be set up.


    # 4.25 Setting Up Socket to Listen for Connections


    ```

    ID = Open Socket( Descriptor );

    Bind Socket(ID, Address );

    Listen(ID)

    Conn = Wait for connection( ID );

    Read(Conn, buffer, sizeof(buffer) );

    ...

    Close( Conn);

    Close Socket( ID );

    ```


    Listing 4.26 shows the steps necessary to set up a client socket to connect to
    the server. Connecting to a remote server also requires initially setting up a
    socket. Once the socket is open, it can be used to connect to the server. After
    the communication is complete, the socket can be closed.


    # 4.26 Setting Up a Socket to Connect to a Remote Server


    ```

    ID=Open Socket( Descriptor );

    Connect(ID, Address );

    Write(ID, buffer, sizeof(buffer) );

    ...

    Close( ID );

    ```


    # Other Approaches to Sharing Data Between Threads


    There are several other approaches to sharing data. For example, data can be written
    to a file to be read by another process at a later point. This might be acceptable
    if the data needs to be persisted or if the data will be used at some later point.
    Still, writing to disk presents a long latency operation, which is not the best
    mechanism if the purpose is purely communication.'
