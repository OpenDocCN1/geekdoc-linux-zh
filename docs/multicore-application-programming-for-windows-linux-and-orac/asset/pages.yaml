    # Using Caches to Hold Recently Used Data


    When a processor requests a set of bytes from memory, it does not get only those
    bytes that it needs. When the data is fetched from memory, it is fetched together
    with the surrounding bytes as a cache line, as shown in Figure 1.12. Depending
    on the processor in a system, a cache line might be as small as 16 bytes, or could
    be as large as 128 (or more) bytes. A typical value for cache line size is 64
    bytes. Cache lines are always aligned, so a 64-byte cache line will start at an
    address that is a multiple of 64. This design decision simplifies the system because
    it enables the system to be optimized to pass around aligned data of this size;
    the alternative is a more complex memory interface that would have to handle chunks
    of memory of different sizes and differently aligned addresses.


