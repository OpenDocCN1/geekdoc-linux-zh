  md: "# Chapter 7 Using Automatic Parallelization and OpenMP\n\n# Setting Runtime\
    \ Loop Scheduling\n\nThe scheduling for loops with the runtime schedule clause\
    \ is controlled with the environment variable OMP_SCHEDULE. The schedule can be\
    \ set at runtime through a call to omp_set_schedule(), and the current schedule\
    \ can be obtained through a call to omp_get_schedule(). The function to get and\
    \ set the schedule take two parameters. The first is an index that indicates the\
    \ schedule requested. The second is the chunk size (the second parameter is ignored\
    \ for schedules that do not require a chunk size). The available schedules are\
    \ omp_sched_static, omp_sched_dynamic, omp_sched_guided, and omp_sched_auto. 7.48\
    \ demonstrates using the calls to get and set the schedule.\n\n# 7.48 Getting\
    \ and Setting the Schedule\n\n```\n#include <omp.h>\n#include <stdio.h>\n\nint\
    \ main() {\n{\n    omp_sched_t schedule;\n    int chunksize;\n    omp_get_schedule(&schedule,\
    \ &chunksize);\n    printf(\"Schedule = %i, chunksize = %i\\n\", schedule, chunksize);\n\
    \    omp_set_schedule(omp_sched_guided, 10);\n}\n```\n\n# Specifying the Stack\
    \ Size for Worker Threads\n\nThe stack size of the master thread is set through\
    \ the normal operating system environment. This can be changed using the ulimit\
    \ command on UNIX-like systems. On Windows, the default stack size is set at link.\n\
    \nThe default stack size for each worker thread created by the OpenMP runtime\
    \ library is implementation specific. Depending on the requirements for this stack,\
    \ the default may not be sufficient. The environment variable OMP_STACKSIZE determines\
    \ the stack space for the worker threads. There is no call to the runtime library\
    \ that sets this size.\n\nThe environment variable takes a number with an optional\
    \ suffix. A number with no suffix is interpreted as kilobytes, the suffix B indicates\
    \ that the number is in bytes, the suffix K indicates that it is in kilobytes,\
    \ the suffix M is interpreted as megabytes, and the suffix G indicates gigabytes.\n\
    \n# Waiting for Work to Complete\n\nFor most parallel constructs, there is an\
    \ implicit barrier at the end to ensure that all threads complete their work before\
    \ the next block of code is started. This section describes the options in OpenMP\
    \ for changing the default barrier behavior."
  merge: -1
  img_proc: true
