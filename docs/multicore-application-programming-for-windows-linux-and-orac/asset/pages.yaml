    \ to CreateFileMapping()\n\n| Parameter Type | Comment |\n| --- | --- |\n| HANDLE\
    \ | INVALID_HANDLE_VALUE that indicates this call should create shared memory.\
    \ |\n| LPSECURITY_ATTRIBUTES | Optional pointer to security attributes that determine\
    \ whether the handle can be inherited by child processes. |\n| DWORD | Page protection\
    \ attributes for the created memory, for shared memory, this will most likely\
    \ be some combination of read or write access. |\n| DWORD | High-order DWORD (as\
    \ an unsigned 4-byte integer) of the size of the region. |\n| DWORD | Low-order\
    \ DWORD of the size. |\n| LPCTSTR | Optional name of the mapping object. |\n\n\
    An object can be shared between processes by sharing its handle, which will be\
