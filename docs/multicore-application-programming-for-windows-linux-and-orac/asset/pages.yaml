  md: "# Selecting the Appropriate Array Access Pattern\n\nOne common data access\
    \ pattern is striding through elements of an array. The performance of the application\
    \ would be better if the array could be arranged so that the selected elements\
    \ were contiguous. Listing 2.29 shows an example of code accessing array with\
    \ a stride.\n\nListing 2.29 Noncontiguous Memory Access Pattern\n\n```\n```\n\
    double array;\ndouble total=0;\n\nfor (int i=0; i<cols; i++)\n  for (int j=0;\
    \ j<rows; j++)\n    total += array[j][i];\n```\n```\n\nC/C++ arrays are laid out\
    \ in memory so that the adjacent elements of the final index (in this case indexed\
    \ by the variable i) are adjacent in memory; this is called row-major order. However,\
    \ the inner loop within the loop is nesting over the first index into the matrix\
    \ and accessing the ith element of that array. These elements will not be located\
    \ in contiguous memory.\n\nIn Fortran, the opposite ordering is followed, so adjacent\
    \ elements of the first index are adjacent in memory. This is called column-major\
    \ order. Accessing elements by a stride is a common error in codes translated\
    \ from Fortran into C. Figure 2.5 shows how memory is addressed in C, where adjacent\
    \ elements in a row are adjacent in memory.\n\n| Contiguous memory |\n| --- |\n\
    | Row 1 |\n| Row 2 |\n| Row 3 |\n| Row 4 |\n\nFigure 2.5 Row major memory ordering"
