  md: '# Hot Locks


    Contended (or hot) mutex locks are one of the common causes of poor application
    scaling. This comes when there are too many threads contending for a single resource
    protected by a mutex. There are two attributes of the program conspiring to produce
    the hot lock.


    +   - The first attribute is the number of threads needed to lock a single mutex.
    This is the usual reason for poor scaling; there are just too many threads trying
    to access this resource.

    - The second, more subtle, issue is that the interval between a thread''s accesses
    of the resource is too short. For example, imagine that each thread in an application
    needs to access a resource for one second and then does not access that again
    for nine seconds. In those nine seconds, another thread could access the resource
    without a conflict. The application would be able to scale well to ten threads,
    but if an eleventh thread was added, the application would not scale as well,
    since this additional thread would delay the other threads from access to the
    resource.


    These two factors result in the more complex behavior of an application with threads.
    The application may scale to a particular number of threads but start scaling
    poorly because there is a contended lock that limits scaling. There are a number
    of potential fixes for this issue.


    The most obvious fix is to "break up" the mutex or find some way of converting
    the single mutex into multiple mutexes. If each thread requires a different mutex,
    these mutex accesses are less likely to contend until the thread count has increased.


    Another approach is to increase the amount of time between each access to the
    critical resource, then the chance of two threads requiring the resource simultaneously
    is reduced. An equivalent change is to reduce the time spent holding the lock.
    This change alters the ratio between the time spent holding and not holding the
    lock, with the consequence that it becomes less likely that threads will require
    the lock at the same time.


    There are other approaches that can improve the situation, such as using atomic
    operations to reduce the cost of the critical section of code.


