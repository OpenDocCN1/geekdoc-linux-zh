    to copy a value into a region. The copyin clause copies the value from the master
    thread into the threadprivate variables held by the worker threads. This clause
    can be placed on parallel regions. Listing 7.44 shows an example of the copyin
    clause. The value of the variable within the parallel region will be -1 for all
    threads.


