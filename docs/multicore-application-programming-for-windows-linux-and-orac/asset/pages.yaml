  md: '# Chapter 9 Scaling with Multicore Processors


    threads for compute resources, and there would be a noticeable lag between the
    user performing an action and the application responding.


    One problem with priority is that priority inversion, where one thread is waiting
    for the resources held by another thread. If the thread holding the resources
    is of lower priority, then the priority is to be inverted.


    A potential issue in this situation is when a low-priority thread holds a mutex.
    A thread with a higher priority wakes up and descheduled from the CPU. The thread
    waiting for the mutex could be of an higher priority, but it will now have to
    wait for both the lower-priority threads to complete before it can acquire the
    mutex.


    A common solution for this problem is for thread holding the resources to temporarily
    acquire the priority of waiting threads, ideally reducing the time it holds the
    resources. Once the releases the resources, it resumes its original priority,
    and the higher-priority thread continues execution with its original priority.


    An alternative solution is to boost the priority of any thread that acquires a
    particular resource so that the thread is unlikely to be preempted while it is
    holding a resource.


    # Multicore Processors and Scaling


    The two big advantages of multicore processors are their ability to run multiple
    threads and the low synchronization costs between those threads. Synchronization
    costs mean that the code will scale more effectively to higher thread counts.
    A similar reasoning leads to the enticing possibility that developers can produce
    parallel versions of routines that were previously too small to parallelize. Consequently,
    there is a fortuitous convergence that processors with low synchronization costs
    enable scaling to high thread counts provides the threads that will perform scaling.


    The low synchronization costs lead a number of reasons that scaling could be limited,
    and a number of these are implicitly functions of the communication costs between
    cores. The most obvious example of this is false sharing.


    The cost of false sharing is that updates to the cache line depend on communication
    latency between cores where the threads are running. This is typically of the
    order of memory latency. On a multicore processor, the communication cost between
    two threads is the latency of the shared level of cache between the two processors.
    Since this cache is usually on chip, the latency is an order of magnitude less
    than memory latency. If we take the code demonstrating false sharing from Listing
    9.20 and run it on a multicore system, the increase in runtime due to false sharing
    is minimal.


    However, these benefits from multicore processors are likely to disappear if the
    system is a multiprocessor system. If the system has multiple processors, then
    it becomes more'
