  md: "# Workload Imbalance\n\nAnother common software issue is workload imbalance,\
    \ when the work is not evenly distributed over the threads. We have already seen\
    \ an example of this in the Mandelbrot example in Chapter 7. The code in Listing\
    \ 9.6 has a deliberate workload imbalance. The number of iterations in the compute()\
    \ function is proportional to the square of the value passed into it; the larger\
    \ number passed into the function, the more time it will to complete.\n\nA parallel\
    \ loop iterates over a range from small values to large values, passing each value\
    \ into the function. If the work is statistically distributed, the threads that\
    \ get the initial iterations will spend less time computing the result than the\
    \ threads that get the later iterations.\n\nListing 9.6 Code Exhibiting Workload\
    \ Imbalance\n\n```\n#include <stdlib.h>\n\nint compute(int value)\n{\n    value\
    \ = value*value;\n    while (value > 0)\n    {\n        value = value - 12.0;\n\
    \    }\n    return value;\n}\n\nint main()\n{\n    #pragma omp parallel for\n\
    \    for(int i=0; i<3000; i++)\n    {\n        compute(i);\n    }\n}\n```\n\n\
    Figure 9.1 shows the timeline view of running the code with eight threads. Each\
    \ horizontal bar represents a thread actively running user code. The duration\
    \ of the run is governed by the time taken by the longest thread. The longest\
    \ threads completed in just nine seconds. In 9 seconds, the eight threads accumulated\
    \ 27 seconds of user time. The time represents the amount of work that the threads\
    \ actually completed. If those 27 seconds of user time had been spent evenly across\
    \ the eight threads, the application would have completed in about 3.5 seconds.\n\
    \nChanging the scheduling of the parallel loop to guided scheduling results in\
    \ the timeline shown in Figure 9.2. After this change, the work is evenly distributed\
    \ across the threads, and the application runs in just over 3.5 seconds."
