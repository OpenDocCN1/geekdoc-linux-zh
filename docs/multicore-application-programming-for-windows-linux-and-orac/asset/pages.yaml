    There, is a balance between the convenience of the developers of libraries and
    the convenience of the libraries'' users. Rough guidelines for how to use libraries
    are as follows:


    +   * Libraries make sense when they contain code that is rarely executed. If
    a substantial amount of code does not need to be loaded from disk for general
    use of the application, the load time of the application can be reduced if this
    functionality is placed in a library that is loaded only when needed.

    * It is useful to place code that is common to multiple applications into shared
    libraries, particularly if the applications are out of the control of the developers
    of the libraries. This is the situation with most operating systems, where the
    applications that use libraries will be developed separately from the core operating
    system. Most applications use libc, the C standard library, so it makes sense
    to deliver this library as a shared library that all applications can use. If
    the internals of the operating system change or if a bug is fixed, then the libraries
    can be modified without needing to change the applications that use those libraries.
    This is a form of encapsulation.'
