  md: '# Scaling with Multicore Processors


    The key advantage of a multicore processor is that it is able to allocate more
    cores to solving a compute problem. Hence, to get the best out of a multicore
    processor, each thread of an application needs to be efficient, and the application
    needs to be able to effectively utilize multiple threads. An ideal application
    will double in performance when run with two hardware threads and will quadruple
    in performance with four.


    This chapter discusses the issues surrounding application scaling. By the end
    of the chapter, you will have an understanding of the common ways that hardware
    and software limit the scaling of applications. You will also know how to recognize
    these issues and potentially solve them. You will also appreciate the difference
    between using multiple multicore and using single-core processors.


    # Constraints to Application Scaling


    Most applications, when run in parallel over multiple cores, will get less than
    speedup. We discussed this in Chapter 3, "Identifying Opportunities for Parallelism.\
    Amdahl''s law indicates that a section of code will limit the scaling of the application
    over multiple cores. If the application spends half of its runtime in a section
    of code that has been made parallel and half in a section that has not, then the
    best that can be achieved with two threads is that the application will run in
    three-quarters of the original time. The best that could be achieved would be
    for the code to run in half about the original time, given enough threads.


    However, there will be other limitations that stop an application from scaling
    perfectly. These limitations can become hardware bottlenecks where some of the
    system has reached a maximum capacity. Adding more threads divides this amount
    of resources between consumers but not increase the amount available. Scaling
    can also be limited by hardware interactions where the presence of multiple threads
    causes the hardware to become less effective. Software limitations can also constrain
    scaling where synchronization overheads become a significant part of the runtime.'
