  md: "Storing Thread-Private Data 141\n\nThere are also operating system-specific\
    \ approaches to sharing data between processes. Solaris doors allow one to pass\
    \ an item of data to another process and have the processed result returned. Doors\
    \ are optimized for the round-trip and hence can be cheaper than using two different\
    \ messages.\n\n# # Storing Thread-Private Data\n\nA single-threaded application\
    \ might use global data to hold program state. For example, a single-threaded\
    \ processor might have global variables that hold the name of the document being\
    \ edited or the current line number.\n\nIn a multithreaded application, it is\
    \ sometimes necessary for each thread to hold state. This state is private to\
    \ the thread but accessible by all the code that the thread executes. Returning\
    \ to the word processor example, if it opens multiple documents and each document\
    \ is handled by a single thread, then each thread will want to have a separate\
    \ variable to hold the name and the current line number. This would be private\
    \ to each—no other thread could read it. The application may still have some global\
    \ state—records details of the person using—and all threads would have access\
    \ to such information.\n\nThere are various approaches that a thread can use to\
    \ store private data. The obvious way to do this is to allocate an array to hold\
    \ the thread-private data for all threads and use the ID of the thread as an index\
    \ into the array. This is a relatively straightforward approach that may suffice\
    \ in a number of situations. Listing 4.27 shows how an array can be used to store\
    \ data that is private, or local, to the thread. The array MyData[] is accessed\
    \ by the ID of the currently executing thread. This allows each thread to store\
    \ data at a unique location in the array.\n\nListing 4.27 Using an Array to Store\
    \ Thread-Local Data\n\n```\nint ThreadedCode(int parameter)\n{\n    MyData[GetMyThreadID()]\
    \ = parameter;\n}\n```\n\nAnother approach would be to store local thread data\
    \ on the stack. Each thread has a stack that is private to the thread. Consequently,\
    \ a thread can allocate data on the stack and have that data remain private to\
    \ the thread. It is not advisable to use pointers to hold data across other threads,\
    \ since stack-based data is valid only while the thread is alive and the stack\
    \ frame containing the data exists. Listing 4.28 shows an example of using the\
    \ stack to hold thread-local data."
