  md: '# How Structure Impacts Performance 39


    potentially need a more experienced developer to maintain it. The point is that
    using more complex algorithms can have an impact on developer time and cost. A
    simpler algorithm might be easier to implement and result in lower development
    costs. It may also be possible that the code does not need a more complex algorithm
    for typical workloads.


    A second point to consider is that algorithmic complexity is concerned with the
