  md: '208 Chapter 6 Windows Threading


    the application has finished with the resource, the call to CloseHandle() enables
    the kernel to free the associated kernel space resources.


    Resources with handles can be shared between processes. Once a resource exists,
    other processes can open a handle to that resource or duplicate an existing handle
    to the resource. It is important to realize that the handle of a kernel resource
    sense only within the context of the process that has access to the resource.
    Passing the value of the handle to another process does not enable the other process
    to get access to the resource; the kernel needs to enable access to the resource
    and provide a new handle for the existing resource in the new process.


    Some functions do not return a handle. For these functions, there is no associated
    kernel resource; hence, it is not necessary to call CloseHandle() once the resource
    is no longer needed.


    # Methods of Synchronization and Resource Sharing


    The range of synchronization objects provided by Windows is very similar to those
    specified in POSIX:


    +   - Mutex locks ensure that only one thread has access to a resource at a time.
    If the lock is held by another thread, thread attempting to acquire the lock will
    sleep until the lock is released. A timeout can also be specified so that acquisition
    will fail if the lock does not become available within the specified interval.
    If multiple threads are waiting for the lock, the order in which the waiting threads
    acquire the mutex is not guaranteed. Mutexes be shared between processes.

    - Critical sections are similar to locks. The difference is that critical sections
    cannot be shared between processes; consequently, their performance overhead is
    lower. Critical sections also have a different interface from that provided by
    mutex locks. Critical sections do not take a timeout value but do have an interface
    that allows the calling thread to try to enter the critical section. If this fails,
    it immediately returns, enabling the thread to continue execution. They also have
    the facility of spinning for a number of iterations before the thread goes to
    sleep in the situation where the thread is unable to enter the critical section.

    - Slim reader/writer locks provide support for the situation where there are multiple
    threads that read shared data, but on rare occasions the shared data needs to
    be written. Data that is reading can be simultaneously accessed by multiple threads
    without concern for problems of corruption of the data being shared. However,
    only a single thread can update the data at any one time, and other threads cannot
    access that data during the write operation. This is to prevent threads from reading
    incomplete or corrupted data that is in the process of being written. Slim reader/writer
    locks cannot be shared across processes.

    - Semaphores provide a method of restricting access to a finite set of resources
    or signaling that a resource is available. These are essentially the same as the
    sem-'
