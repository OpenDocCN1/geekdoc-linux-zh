- pgno: 171
  md: '# Chapter 5 Using POSIX Threads


    Another command that controls stack size is ulimit -s <stacksize>. On Linux, this
    command is used to set the default stack size for both the initial thread created
    and for subsequent threads. On Solaris, this command controls only the stack size
    for the initial thread. Consequently, to write portable codes, it is best to explicitly
    control the size of the stack for any child threads, particularly if the code
    places large objects on the stack or uses recursion.


    The obvious question to ask is, why not set the largest stack size for all child
    threads? The answer to this question leads to a discussion on how stacks are created.

    To allow the heap (where malloc obtains its memory) and the stack to grow, the
    heap is usually placed after the application at the low end of the addressable
    memory, and the stack is usually placed at the upper end of memory, as in Figure
    5.1. The heap grows upward, and the stack can grow downward.


    ![](img/9337ae7b0be66cc11725becaa009908f_171_0.png)


    Figure 5.1 Location of heap and stack in memory


    This approach works for a single-threaded application, but each thread in a multi-threaded
    application needs its own stack. To do this, the application must have a limit
    to the size of the initial stack for the main thread. Each child thread must also
    have a limit to its stack size. The resulting layout in memory is rather like
    Figure 5.2.


    ![](img/9337ae7b0be66cc11725becaa009908f_171_1.png)


    Figure 5.2 Memory layout for a multithreaded code


    Each thread receives an adjacent block of memory of fixed size for its stack.
    There is a finite address space available, memory used for stack space is taken
    from memory that can be used for the heap. For 64-bit applications, the address
    space is sufficiently large that this is not a problem. For 32-bit applications,
    it is relatively easy to run out of address space. If each thread allocates an
    8MB stack, then there can be at most 512 simultaneous threads (512 * 8 MB = 4GB
    address space). For some applications, it can be a good idea to assess how much
    memory is actually required for the stack of each child thread. The absolute minimum
    acceptable memory to provide to a thread is stored in the variable PTHREAD_STACK_MIN.
    This would provide no space on the stack for local variables or function calls,
    so it would rarely be used with out including some additional space.'
