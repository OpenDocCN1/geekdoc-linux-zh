- pgno: 318
  md: '# Atomic Operations


    c that this pointer is used as a memory access. The plus sign indicates that the
    instruction will both read and write the location in memory.


    The third list is the "clobber" list indicating what the instruction will modify.
    In both instances, the instruction will modify memory.


    The virtual registers are numbered from the input registers, so register $0 is
    assigned the value of variable address. The output registers are the next set
    of virtual registers, so the variable value gets assigned to $1.


    It is also useful to look at the actual assembly language instructions. The $xadd
    instruction is an exchange add, so it adds the variable value to the value held
    at the memory address, but it also returns the value at the address after the
    operation was performed; this is the exchange operation. The instruction just
    adds one to the value held in memory but does not return a value in register.
    Both instructions are prefixed with the $lock operation. The $lock operation locks
    the system bus so that no other processors can touch the memory location that
    is being updated; hence, it is the $lock prefix that actually makes these instructions
    atomic. Without it, the result of the operations would be undefined if there were
    multiple threads acting on the same memory.


    The routine $atomic_add_int() adds the amount to the value held at the memory
    location and returns the value held before the atomic operation.

    The routine $atomic_inc_int() increments the value held at the memory location
    and returns the value currently held in memory. Since the instruction does not
    return the new value, the return value is a load of value held in memory. This
    might not be the true result of the operation; the value could have been modified
    between the atomic operation and the final load.


    # Using Compare and Swap Instructions to Form More Complex Atomic Operations


    Not all processors implement atomic add or increment instructions. However, most
    processors implement a variant of the compare and swap instruction. This instruction
    can form the basis of most atomic operations.


    An compare and swap (CAS) operation compares the value held at a memory location
    with the value held in a register. If the value at that location matches the desired
    value passed to the instruction, then the value held in memory will be atomically
    updated with a second value passed into the instruction. The return value from
    CAS is the original value that was held in memory. If the operation succeeded,
    the return value will be the same as the desired value. If the operation did not
    succeed, the return value will be some other value. This enables the code to determine
    whether the operation succeeded.


    This operation can be useful in a number of situations. For example, assume a
    mutex lock is implemented using a variable that holds one when the lock is held
    or zero when the lock is available. The CAS operation can be used to transition
    the lock from free to taken. To acquire the lock, the variable lock must hold
    the value zero, and the instruction needs to atomically replace the zero with
    a one. Listing 8.2 shows the code for a


