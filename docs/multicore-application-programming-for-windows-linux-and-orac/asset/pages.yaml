  md: "# Creating and Resuming Suspended Threads\n\nA suspended thread is one that\
    \ is not currently running. Threads can be created in the suspended state and\
    \ then started at a later time. If a thread is in the suspended state, the call\
    \ to start the thread executing ResumeThread(), which takes the handle of the\
    \ thread as a parameter. There is a SuspendThread() call that will cause a thread\
    \ to be suspended. This is expected to be used only by tools as debuggers; suspending\
    \ a thread may lead to problems if the thread holds resources such as mutexes.\
    \ Listing 6.10 shows the creation of a suspended thread and then calling ResumeThread()\
    \ on that thread. The code uses a call to getchar(), which waits for the enter\
    \ key to be pressed, to separate the creation of the thread from the act of resuming.\n\
    \nListing 6.10 Creating and Resuming a Suspended Thread\n\n```\n#include <windows.h>\n\
    #include <process.h>\n\nunsigned int __stdcall mywork(void * data)\n{\n    printf(\"\
    %i\\n\", GetCurrentThreadId());\n    return 0;\n}\n\nint _tmain(int argc, _TCHAR\
    \ argv[])\n{\n    HANDLE handle;\n    handle = (HANDLE)beginthreadex(0,0,&mywork,\
    \ 0, CREATE_SUSPENDED, 0);\n    getchar();\n    ResumeThread(handle);\n    getchar();\n\
    \    WaitForSingleObject(handle, INFINITE);\n    CloseHandle(handle);\n    return\
    \ 0;\n}\n```\n\nThe suspension state of the thread is handled as a counter, so\
    \ multiple calls to SuspendThread() need to be matched with multiple calls to\
    \ ResumeThread().\n\n# Using Handles to Kernel Resources\n\nMany of the Windows\
