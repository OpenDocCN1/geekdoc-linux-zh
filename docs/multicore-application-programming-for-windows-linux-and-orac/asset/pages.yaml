  md: "# Chapter 7 Using Automatic Parallelization and OpenMP\n\n# Listing 7.28 Parallel\
    \ Region Accesses the Value of a Private Variable\n\n```\n#include <stdio.h>\n\
    \nint main() {\n    int data=1;\n    #pragma omp parallel for private(data)\n\
    \    for (int i=0; i<100; i++) {\n        printf(\"data=%i\\n\", data);\n    }\n\
    \    return 0;\n}\n```\n\nAlthough the variable data is initialized to the value\
    \ outside the parallel region, this value is not passed into the private copy\
    \ that each thread obtains inside the parallel region. Hence, the value that is\
    \ printed is undefined. To initialize the variable in the parallel region to the\
    \ value it held before the region, the variable needs to be declared using the\
    \ clause `firstprivate(variables)`. This tells the compiler to include code that\
    \ copies the existing value into the private copy held by each thread in the parallel\
    \ region. Listing 7.29 shows the modified code.\n\n# Listing 7.29 Declaring a\
    \ Variable as firstprivate to Pass Its Value into the Parallel Region\n\n```\n\
    #include <stdio.h>\n\nint main() {\n    int data=1;\n    #pragma omp parallel\
    \ for firstprivate(data)\n    for (int i=0; i<100; i++) {\n        printf(\"data=%i\\\
    n\", data);\n    }\n    return 0;\n}\n```\n\nAnother situation is where the value\
    \ of a variable is used after a parallel region. In this case, it is important\
    \ to retain the value that was written into this variable by the thread that executed\
    \ the last iterations of the loop. This preserves the semantics of the serial\
    \ program. The clause enables this to happen is `lastprivate(variables)`. This\
    \ clause is also supported on `parallel sections`, which will be introduced later.\
    \ Listing 7.30 shows an example of using `lastprivate` to retain the last value\
    \ written into the variable."
