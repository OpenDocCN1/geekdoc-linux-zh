- pgno: 316
  md: '# Hand-Coded Synchronization and Sharing


    The synchronization mechanisms provided by the operating system are typically
    designed to be fully featured, fast, and correct. In most cases, these will be
    the appropriate mechanism to use. However, there will be situations where it is
    desirable to have a different mechanism for synchronization and sharing, and often
    the motivation for this is one of improved efficiency.


    Many pitfalls are associated with coding synchronization primitives. The objective
    of this chapter is to describe the issues that need to be faced when writing synchronization
    and communication primitives, both to provide information when doing this and
    to explain why the operating system-provided mechanisms are coded the way that
    they are.


    This chapter starts with a discussion of atomic operations and the atomic operations
    that are provided by the operating system. This is a useful warm-up for a discussion
    of how atomic operations can be hand-coded. The final section of the chapter discusses
    the issues around writing synchronization primitives.


    # Atomic Operations


    Atomic memory operations appear to the rest of the system as operations that either
    succeed or fail; there''s no partial state or state where the operation completes
    but the result is incorrect. Loads and stores, in most instances, are atomic.
    A load instruction will not fetch the data from the most recent store to that
    cache and half of what was previously fetched in the cache line. Similarly, a
    store will not perform a partial update of a memory address.


    More complex operations are not atomic. For example, incrementing a value in memory
    is usually implemented as a load, the increment, and a store of the new value
    back to memory. Unfortunately, in a multithreaded environment, another thread
    could interrupt this sequence and replace the original value in memory with a
    new value. The final would store the calculated value back to memory, but the
    entire operation would not reflect an increment of the new value held in memory.
    This is an example of a data race, as we have previously discussed.'
