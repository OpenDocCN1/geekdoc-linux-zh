  md: "```\n{\n  setuplist(&var2);   // Set up second linked list\n}\n\n```\n\nThe\
    \ parallel region is introduced using the #pragma omp parallel directive. In this\
    \ example, it is combined with the sections directive to produce a single statement.\
    \ This identifies the region of code containing one or more sections of code that\
    \ can be executed. Each individual section is identified using the directive #pragma\
    \ omp section. It is important to notice the open and close braces that denote\
    \ the range of code included in the parallel sections and also denote the code\
    \ in each parallel section. In the absence of the braces, the parallel section\
    \ would only apply to the following line of code.\n\nAll threads wait at the end\
    \ of the parallel sections region until all the work has been completed, before\
    \ any of the subsequent code is executed.\n\nAlthough parallel sections increase\
    \ the range of applications that can be parallelized using OpenMP, it has the\
    \ constraint that the parallelism is statically defined in the source code. This\
    \ static definition of parallelism limits the degree of scaling that can be expected\
    \ from the application. Parallel sections are effectively only in situations where\
    \ there is a limited, static opportunity for parallelism. In other cases, parallel\
    \ tasks, which we will discuss later, may be a better solution.\n\n# Nested Parallelism\n\
    \nThe OpenMP API also supports nested parallelism. Here, a parallel region is\
    \ encountered inside another parallel region. This can be a useful way of attaining\
    \ parallelism by having tasks or parallel sections that provide course-grained\
    \ parallelism and using a parallel to gain further parallelism within the task\
    \ or region. Nested parallelism is also useful in situations where the algorithm\
    \ is recursive in nature.\n\nListing 7.37 shows an example of nested parallelism\
    \ where two parallel sections contain parallel for values. Support for nested\
    \ parallelism can be enabled through the environment variable O_NESTED or a call\
    \ to the routine omp_set_nested() with a value other than zero. However, support\
    \ of omp_set_nested() is optional. It can be determined whether nested parallelism\
    \ is enabled or not through a call to omp_get_nested().\n\nListing 7.37 Using\
    \ Nested Parallelism to Perform Array Set Up in Parallel\n\n```\n#include <stdlib.h>\n\
    #include <omp.h>\n\nint main() {\n  int * array1, *array2;\n```"
