  md: "When a thread wants to enter the critical section, it calls EnterCriticalSection().\
    \ If no other thread is in the critical section, the calling thread acquires it\
    \ and continues execution. If another thread is in the critical section, the calling\
    \ thread will sleep until the thread executing the critical section leaves it\
    \ calls LeaveCriticalSection(). The thread that calls EnterCriticalSection() will\
    \ not return until it has obtained access to the critical section; there is no\
    \ concept of a timeout.\n\nListing 6.15 shows an example of using a critical section\
    \ to protect access to the variable.\n\n# Listing 6.15 Using a Critical Section\
    \ to Protect Access to a Variable\n\n```\nvolatile int counter = 0;\nCRITICAL_SECTION\
    \ critical;\n\nunsigned int __stdcall test(void * )\n{\n    while ( counter <\
    \ 100)\n    {\n        EnterCriticalSection(&critical);\n        int number =\
    \ counter++;\n        LeaveCriticalSection(&critical);\n        printf(\"ThreadId\
    \ %i; value = %i, is prime = %i\\n\",\n               GetCurrentThreadId(), number,\
    \ isprime(number));\n    }\n    return 0;\n}\n\nint _tmain(int argc, _TCHAR* argv[])\n\
    {\n    HANDLE h1, h2;\n    InitializeCriticalSection(&critical);\n    h1 = (HANDLE)_beginthreadex(0,\
    \ 0, (void*)0, 0, 0, NULL);\n    h2 = (HANDLE)_beginthreadex(0, 0, (void*)1, 1,\
    \ 0, NULL);\n    WaitForSingleObject(h1, INFINITE);\n    WaitForSingleObject(h2,\
    \ INFINITE);\n    CloseHandle(h1);\n    CloseHandle(h2);\n    getchar();\n   \
    \ DeleteCriticalSection(&critical);\n    return 0;\n}\n```\n\nPutting threads\
    \ to sleep and waking them up again is time-consuming, because it involves entering\
    \ the kernel. All critical sections should be designed to be as short-lived as\
    \ possible. With that in mind, it is likely that the time the thread has spent\
    \ to"
