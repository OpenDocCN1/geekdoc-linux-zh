    The compiler does not recognize either of the for loops that are parallelized.
    The reason is for the possibility of aliasing between the store to out[i] and
    the values used to determine the loop bound..row and col. A requirement for the
    compiler to automatically parallelize the loop is that the loop must remain constant.
    A store of the loop boundaries would violate that restriction. Therefore, it is
    not a form of loop that can be automatically parallelized. As a programmer, it
    would be unusual to write code that relies on stores in the array boundaries,
    but for the compiler, the only safe assumption is that these might alias.

    The most general-purpose way of correcting this is to place the loop limits in
    local temporary variables. This removes the possibility that the loop limit might
    alias with one of the stores in the loop. For the code in Listing 7.5, it is easy
    to perform the equivalent change and pass the loop bounds by value rather than
    passing them as pointers to the values.


