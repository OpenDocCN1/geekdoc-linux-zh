- pgno: 274
  md: "# Using Automatic Parallelization to Produce a Parallel Application 253\n\n\
    However, calls to mathematical functions represent a small proportion of the calls\
    \ that might be encountered in loops. There is no standard way to denote that\
    \ a call to a particular function can be safely made in parallel, although individual\
    \ compilers might implement mechanisms that could be used. The best way to enable\
    \ a loop containing a function to be parallelized automatically is by inlining\
    \ the function. Inlining replaces a call to a function with the actual code for\
    \ the called function. Function inlining is enabled with a general compiler flag\
    \ or a flag enabling a routine to be inlined. Listing 7.16 shows a variant of\
    \ the code where part of the calculation is performed by a routine.\n\n# Listing\
    \ 7.16 Code Where Part of the Calculation Is Performed by Another Function\n\n\
    ```\n#include <math.h>\n\ndouble calc(double a, double b )\n{\n    return a *\
    \ b;\n}\n\nvoid matVec(double **mat, double *vec, double * restrict out,\n{\n\
    \    int row, int col;\n{\n    int i,j;\n    for (i=0; i<row; i++) // Line 12\n\
    \    {\n        out[i]=0;\n        for (j=0; j<col; j++) // Line 15\n        {\n\
    \            out[i] += calc(mat[i][j], vec[j]);\n        }\n    }\n}\n```\n\n\
    When this code is compiled, the compiler fails to automatically parallelize the\
    \ loops because they contain a call that may be unsafe. However, when the code\
    \ is compiled at an optimization level of -x04 or higher, the compiler automatically\
    \ performs inlining optimizations, which eliminates the call and allows the loop\
    \ to be parallelized.This is shown in Listing 7.17.\n\n# Listing 7.17 Inlining\
    \ Enables the Compiler to Automatically Parallelize Loop\n\n```\n$ cc -xautopar\
    \ -xloopinfo -x04 -c ffloop.c\n\"fflop.c\", line 12: PARALLELIZED, and serial\
    \ version generated\n\"fflop.c\", line 15: not parallelized, unsafe dependence\n\
    ```"
