  md: "# Keeping Data Private to Threads\n\nIt is possible to set thread-local data\
    \ using the OpenMP directive threadprivate. This directive works in a similar\
    \ way to the __thread declaration, described in Chapter 5, in making each thread\
    \ hold a private copy of some variable. Listing 7.42 shows an example of declaring\
    \ a threadprivate variable.\n\nListing 7.42 Declaring a threadprivate Variable\n\
    \n```\nint i;\n#pragma omp threadprivate( i )\n\nint main()\n{\n    ...\n}\n```\n\
    \nThe value of the threadprivate variable can persist between parallel regions.\
    \ The rules governing when this will happen are slightly complex but can be summarized\
    \ as the requirement that the active thread count is the same for the two parallel\
    \ regions.\nThere are other constraints on threadprivate variables. If the code\
    \ is parallelized using tasks and the value of the variable depends on the order\
    \ that the tasks are completed, then the value will be unpredictable.\n\nDuring\
    \ serial portions of the application's execution, the variable will return the\
    \ value held by the master thread. This can be demonstrated using the code shown\
    \ in Listing 7.43. The variable i is thread private. In the master thread, it\
    \ is to set the value -1, but in the parallel region, it is set to hold the thread\
    \ ID. Each thread will set the value of i to its thread ID. The ID of the master\
    \ thread is zero. Outside the parallel region, the reference to i resolves to\
    \ the value held by the master thread. So, the final version of the variable i\
    \ will be zero.\n\nListing 7.43 Printing the Value of a threadprivate Variable\n\
    \n```\n#include<stdio.h>\n#include<comp.h>\n```\n\n```\nint i;\n#pragma omp threadprivate(\
    \ i )\n\nint main()\n{\n    i = -1;\n    #pragma omp parallel\n    {\n       \
    \ i = omp_get_thread_num();\n    }\n```"
