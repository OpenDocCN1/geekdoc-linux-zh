  md: "# Chapter 3 Identifying Opportunities for Parallelism\n\n# Listing 3.11 Speculatively\
    \ Parallelized Code\n\n```\nvoid doWork(int x, int y)\n{\n    int value1, value2;\n\
    \    #pragma start parallel region\n    {\n        #pragma perform parallel task\n\
    \        {\n            value1 = longCalculation(x, y);\n        }\n        #pragma\
    \ perform parallel task\n        {\n            value2 = secondCalculation(x,\
    \ y);\n        }\n        #pragma wait for parallel tasks to complete\n      \
    \  if (value > threshold)\n        {\n            return value1 + value2;\n  \
    \      }\n        else\n        {\n            return value1;\n        }\n   \
    \ }\n}\n```\n\nThe #pragma directives in the previous code are very similar to\
    \ those that are used in OpenMP, which we will discuss in Chapter 7,\"OpenMP and\
    \ Automatic Parallelization.\"The first directive tells the compiler that the\
    \ following block of code contains statements that will be executed in parallel.\
    \ The two #pragma directives in the parallel region identify the two tasks to\
    \ be performed in parallel. A final directive indicates that the code cannot exit\
    \ the parallel region until both tasks have completed.\n\nOf course, it is important\
    \ to consider whether the parallelization will slow performance down more than\
    \ it will improve performance. There are two key reasons why the parallel implementation\
    \ could be slower than the serial code.\n\n+   - The overhead of performing the\
    \ work and synchronizing after the work is close in magnitude to the time taken\
    \ by the parallel code.\n\n+   - The second long calculation takes longer than\
    \ the first calculation, and the results of it are rarely used.\n\nIt is possible\
    \ to put together an approximate model of this situation. Suppose the first calculation\
