    # Communicating with Pipes


    Pipes are a method of stream communication where data written to a pipe can be
    read from the pipe by a different thread. Pipes on Windows enable communication
    between threads within a process, between threads in different processes, or even
    between threads on different systems.


    Pipes are available in two flavors. A named pipe can be used to uniquely identify
    a connection by name. An anonymous pipe does not have an explicit name, so processes
    wanting to communicate obtain its handle. On Windows, anonymous pipes are implemented
    using a unique name, but this is not specified by the application when the pipe
    is created.


    To create an anonymous pipe, the application should call CreatePipe(). This takes
    four parameters. The first and second parameters are pointers to the variables
    to hold the read and write handles for the pipe. The third parameter is the security
    attributes for the pipe, which if NULL, gives the default attributes that do not
    allow child processes inherit the handle. Passing a pointer to a security attributes
    object is necessary if inheritance of the handle is desired. The fourth parameter
    is a handle to the appropriate size of buffer to use for the pipe. A value of
    zero indicates that the default value should be used.


    To create a named pipe, an application needs to call CreateNamedPipe(). This creates
    a pipe and returns a handle to the pipe. The same handle can be used for read
    or write operations, assuming the pipe was set up to allow the operation. This
    function takes eight parameters; these are listed in 6.7.'
