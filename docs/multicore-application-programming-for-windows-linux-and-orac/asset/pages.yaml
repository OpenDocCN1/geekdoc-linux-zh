- pgno: 324
  md: '# Atomic Operations 303


    The kinds of memory loads available are defined by the architecture. The x86 architecture
    defines the following:


    +   - mfence. Ensures that all previous loads and stores are visible to the system
    before any future loads and stores become visible

    - sfence. Ensures that all previous stores are visible to the system before any
    future stores become visible

    - ifence. Ensures that all previous loads are visible to the system before any
    future loads become visible


    The SPARC architecture defines a slightly finer set of memory barrier semantics.
    The instruction member takes a combination of options to indicate the particular
    type of barrier required. The following types of memory barrier can be combined:


    +   - #StoreStore. Ensures that all stores complete before the following stores

    - #StoreLoad. Ensures that all stores complete before the following loads

    - #LoadStore. Ensures that all loads complete before the following stores

    - #LoadLoad. Ensures that all loads complete before the following loads


    Modern SPARC and x86 processors implement a strong memory-ordering model. This
    means that memory-ordering operations are rarely needed. However, writing software
    is safe for future processors where the memory-ordering constraints may have changed
    and weaker memory ordering requires that these instructions are included in the
    code. Processors that do not need the operations will typically get only minimal
    performance penalty.


    On x86, the mfence instruction provides sufficient constraints on memory ordering
    for it to be used as both an acquire and a release barrier. On SPARC, it is sufficient
    to use member #LoadLoad|#StoreLoad to acquire barrier semantics and release by
    member #StoreLoad|#StoreStore to ensure that all previous loads have completed
    before memory operations. Release memory operations have completed before the
    following store instruction.


    On both SPARC and x86 processors, atomic operations enforce total memory ordering;
    the atomic operation enforces an ordering between loads and stores and stores
    that are to be issued. Hence, in general, no memory barrier is required before
    or after an atomic operation.


    # Compiler Support of Memory-Ordering Directives


    Windows provides the MemoryBarrier() macro, which causes the compiler to emit
    memory-ordering instructions. OS X provides MemoryBarrier(), which provides the
    same functionality.


    +   - gcc and Solaris Studio support using inline assembly to generate memory-ordering
    instructions. For example, asm volatile ("mfence"::"memory")") would insert an
    mfence instruction at the desired location in the code.'
