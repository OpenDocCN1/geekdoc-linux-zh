  md: "# Synchronization Primitives\n\nDepending on the implementation, the method\
    \ that acquires a semaphore might be called wait, down, or acquire, and the method\
    \ to release a semaphore might be called post, signal, or release. When the semaphore\
    \ no longer has resources available, the threads requesting resources will block\
    \ until resources are available.\n\n# Readers-Writer Locks\n\nData races are a\
    \ concern only when shared data is modified. Multiple threads reading the shared\
    \ data do not present a problem. Read-only data does not, therefore, need protection\
    \ with some kind of lock.\n\nHowever, sometimes data that is typically read-only\
    \ needs to be updated. A readerswriter lock (or multiple-reader lock) allows many\
    \ threads to read the shared data but can then lock the readers out to allow one\
    \ thread to acquire a writer lock to modify the data.\n\nA writer cannot acquire\
    \ the writer lock until all the readers have released their reader locks. For\
    \ this, the locks tend to be biased towards writers; as soon as one is queued,\
    \ the lock stops further readers to enter. This action causes the number of readers\
    \ holding the lock to diminish and eventually allow the writer to get access to\
    \ the lock.\n\nThe code snippet in Listing 4.9 shows how a readers-writer lock\
    \ might be used. Most threads will be calling the routine readData() to return\
    \ the value from a particular pair of cells. Once a thread has a reader lock,\
    \ they can read the value of the pair of cells, before releasing the reader lock.\n\
    \nTo modify the data, a thread needs to acquire a writer lock. This will stop\
    \ any reader threads from acquiring a reader lock. Eventually all the reader threads\
    \ will have released their lock, and at that point the writer actually acquire\
    \ the lock and is allowed to update the data.\n\n+   Listing 4.9 Using a Readers-Writer\
    \ Lock\n\n```\nint readData(int cell1, int cell2) \n{\n  acquireReaderLock(&lock);\n\
    \  int result = data[cell] + data[cell2];\n  releaseReaderLock(&lock);\n  return\
    \ result;\n}\nnvoid writeData(int cell1, int cell2, int value) \n{\n  acquireWriterLock(&lock);\n\
    \  data[cell1] += value;\n  data[cell2] -= value;\n  releaseWriterLock(&lock);\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Barriers


    There are situations where a number of threads have to complete their work before
    any of the threads can start on the next task. In these situations, it is useful
    to have a barrier where the threads will wait until all are present.


    One common example of using a barrier arises when there is a dependence between
    different sections of code. For example, suppose a number of threads compute the
    values stored in a matrix. The variable total needs to be calculated using the
    values stored in the matrix. A barrier can be used to ensure that all the threads
    complete the computation of the matrix before the total variable is calculated.
    Listing 4.10 shows a situation using a barrier to separate the calculation of
    a variable from its use.


    Listing 4.10 Using a Barrier to Order Computation


    ```

    Compute_values_held_in_matrix();

    Barrier();

    total = Calculate_value_from_matrix();

    ```


    The variable total can be computed only when all threads have reached the barrier.
    This avoids the situation where one of the threads is still completing its computations
    while the other threads start using the results of the calculations. Notice that
    another barrier could be needed after the computation of the value for total if
    that value is used in further calculations. Listing 4.11 shows this use of multiple
    barriers.


    Listing 4.11 Use of Multiple Barriers


    ```

    Compute_values_held_in_matrix();

    Barrier();

    total = Calculate_value_from_matrix();

    Barrier();

    Perform_next_calculation( total );

    ```


    # Atomic Operations and Lock-Free Code


    Using synchronization primitives can add a high overhead cost. This is particularly
    true if they are implemented as calls into the operating system rather than calls
    into a supporting-library. This overhead lowers the performance of the parallel
    application and can limit scalability. In some cases, atomic operations or lock-free
    code can produce equivalent code without introducing the same amount of overhead.


    An atomic operation is one that will either succeed completely or fail; it is
    not possible for the operation to result in a "bad" value or other threads on
    the system to observe a transient value. An example of this would be an atomic
    increment, which would mean that the calling thread would replace a variable that
    currently holds the value N with the value N+1. This might sound trivial, but
    bear in mind that the operation of incrementing a variable can involve multiple
    steps, as shown in Listing 4.12.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Listing 4.12 Steps Involved in Incrementing a Variable


    ```

    LOAD    [%0], %ol // Load initial value

    ADD     %ol, 1, %ol // Increment value

    STORE   %ol, [%0] // Store new value back to memory

    ```


    During the execution of the three steps shown in Listing 4.12, another thread
    could have interfered and replaced the value of the variable held in memory with
    a new value, creating a data race.


    An atomic increment operation would not allow another thread to modify the same
    variable and cause an erroneous value to be written to memory. Performing the
    increment operation atomically is logically equivalent to implying acquiring a
    mutex before the increment and releasing it. The difference is that a mutex relaxes
    on other threads using the same mutex to protect that variable. A thread that
    did not use the same mutex could cause an incorrect value to be written back to
    memory. With atomic operations, another thread cannot cause an incorrect value
    to be written to memory.


    Most operating systems or compilers provide support for a range of atomic operations.
    However hardware typically provides only for a limited range of operations; the
    more complex atomic operations are usually made from simple atomic instructions
    that the hardware provides.


    Atomic operations are often used to enable the writing of lock-free code. Using
    a synchronization device such as a mutex solves the correctness problem; only
    one thread can access the protected memory location at a single time. However,
    it is not necessarily the approach with a mutex scales well, as threads are waiting
    for access are blocked (sent to sleep). A lock-free implementation would not rely
    on a mutex to protect access; instead, it would use a sequence of operations that
    would perform the operation without having to acquire an higher performance with
    a lock. Lock-free does not imply that the other threads would not have to wait;
    only they do not have to wait on a lock. A wait-free implementation would allow
    all threads to simultaneously make forward progress.


    Most of the more complex atomic operations are actually lock-free implementations.
    They use a low-level, hardware-provided atomic operation and wrap code around
    that to ensure the higher-level operation is actually atomic.


    An example of a low-level atomic operation would be compare and swap (CAS), if
    the value held in a register with the value held in memory and only if the value
    held matches the expected value. As an example of this hardware-provided atomic
    operation to produce a higher-level atomic operation, to this, the CAS instruction
    would be executed in a loop. Each iteration, it would attempt to replace the value
    held in memory with the incremented value. The loop would exit when the CAS instruction
    successfully performed the increment operation.


    Lock-free code can be used to achieve more complex operations; this will be discussed
    in Chapter 8, "Hand-Coding Synchronization and Sharing."'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Deadlocks and Livelocks


    So far, we''ve demonstrated some fundamental ways to share access to resources
    between threads. We now need to discuss the situations where strategies might
    go wrong.


    First is the deadlock, where two or more threads cannot make progress because
    the resources they need are held by the other threads. It is easiest to explain
    this with an example. Suppose two threads need to acquire locks A and B to complete
    some task. If thread 1 has already acquired lock A and thread 2 has already acquired
    lock B, then A cannot make forward progress because it is waiting for lock B,
    and thread 2 cannot make progress because it is waiting for lock A. Listing 4.13
    shows this situation.


    Listing 4.13 Two Threads in a Deadlock


    | Thread 1 | Thread 2 |

    | --- | --- |

    | void update1() | void update2() |

    | { | { |

    | acquire(A); <<< Thread 1 | acquire(B); |

    | acquire(B); | acquire(A); |

    | waits here | waits here |

    | variable1++; | variable1++; |

    | release(B); | release(B); |

    | release(A); | release(A); |

    | } | }


    The best way to avoid deadlocks is to ensure that threads always acquire the locks
    in the same order. So if thread 2 acquired locks in the order A and then B, it
    would stall while waiting for lock A without having acquired lock B. This would
    enable thread 1 to acquire B and eventually release both locks, allowing thread
    2 to make progress.


    A livelock traps threads in an unending loop acquiring acquiring locks. Livelocks
    can be caused by backing out of deadlocks. In Listing 4.14, the programmer has
    tried to implement a mechanism that avoids deadlocks. If the thread cannot obtain
    the second lock, it releases the lock that it already holds.


    The two routines update1() and update2() have each other avoid. Routine update1()
    acquires lock A and attempts to acquire lock B, while update2() does this in the
    opposite order. This is a classic deadlock opportunity, and to avoid it, the developer
    has written code that holds the lock to be released if it is not possible to acquire
    the lock. The routine canAcquire(), in this example, returns immediately after
    acquiring the lock or having failed to acquire the lock.


    Listing 4.14 Two Threads in a Livelock


    | Thread 1 | Thread 2 |

    | --- | --- |

    | void update1() | void update2() |

    | { | {'
