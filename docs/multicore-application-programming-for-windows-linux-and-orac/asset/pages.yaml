  md: '![](img/9337ae7b0be66cc11725becaa009908f_81_0.png)


    As in any example, there are undoubtedly better structures to choose for holding
    a dictionary of words. Choosing the appropriate one for a particular application
    is a case of balancing the following factors:


    +   - Programmer time to implement the algorithm. There will probably be constraints
    on the amount of time that a developer can spend on implementing a single part
    of the application.

    - User sensitivity to application performance. Some features are rarely used,
    so a user might accept that, for example, performing a spell-check on an entire
    document will take time. It may also be the case that the complete part of the
    task is not critical; in the case of a spell-check, if a spelling error is reported,
    the user may spend time reading the text to determine the appropriate word to
    use, during which the application could continue and complete the spell-check
    of the rest of the document.

    - The problem size is not enough limited to documents of only a few hundred words,
    it is unlikely that a spell-check of the entire document would take more than
    about half a second. Any performance gains from the improved algorithm would be
    unnoticeable.


    In many situations, there are preexisting libraries of code that implement different
    data management structures. For C++, the Standard Template Library provides a
    wealth of data structures. Careful coding to encapsulate the use of the data structures
    can minimize developer time by allowing the original structures to be easily replaced
    with more efficient ones that prove necessity.


    # The Role of the Compiler


    The purpose of the compiler is to take the source code and produce a functionally
    correct implementation, using only the information that the developer provides
    either in the source code or as part of the compilation process. It is important
    to recognize the constraints that the compiler is working under—something that
    is obvious to the developer may not be obvious to the compiler.'
