  md: "# Variables and Memory 177\n\nHowever, it is sometimes useful to have “global”\
    \ data that is private to a thread—data that is visible to all the routines that\
    \ a thread executes but the restriction that each thread sees only its own private\
    \ copy of the data; this is known as thread-local storage.\nThere are two ways\
    \ of allocating thread-local data. The first is to declare globally with the __thread\
