  md: '# Using OpenMP to Produce a Parallel Application 273


    The code uses three OpenMP directives. We have already met the omp parallel directive,
    which denotes the start of a parallel region, but not the omp single directive,
    which tells the compiler that only one thread is to execute the enclosed code.
    As discussed, all the threads will execute the code in the parallel region by
    default. This single thread is responsible for accepting incoming connections
    and then producing new tasks that handle the details of the connection.


    Finally, the omp task encloses the region of code that is to be executed as a
    task. The variable is scoped as firstprivate by default, each task gets a private
    copy of the variable. Within the task, this variable is assigned the value that
    it holds at the time the task was created. The new task handles the echoing back
    of data that is sent on that particular socket.


