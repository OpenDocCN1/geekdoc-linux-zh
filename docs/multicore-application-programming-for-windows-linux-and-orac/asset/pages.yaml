  md: "# Communication Between Threads and Processes 133\n\n```\nint done=0;\nwhile\
    \ (!done)\n{\n  acquire(A);\n  if ( canAcquire(B) )\n  {\n    variable1++;\n \
    \   release(B);\n    release(A);\n    done=1;\n  }\n  else\n  {\n    release(A);\n\
    \  }\n}\nint done=0;\nwhile (!done)\n{\n  acquire(B);\n  if ( canAcquire(A) )\n\
    \  {\n    variable2++;\n    release(A);\n    release(B);\n    done=1;\n  }\n \
    \ else\n  {\n    release(B);\n  }\n}\n```\n\nIf two threads encounter this code\
    \ at the same time, they will be trapped in a livelock of constantly acquiring\
    \ and releasing mutexes, but it is unlikely that either will make progress. Each\
    \ thread acquires a lock and attempts to acquire the second lock that it needs.\
    \ If it fails to acquire the second lock, it releases the lock it is holding,\
    \ before attempting to acquire both locks again. The thread exits the loop when\
    \ it manages to successfully acquire both locks, which will eventually happen,\
    \ but until then, the application will make no forward progress.\n\n# Communication\
    \ Between Threads and Processes\n\nAll parallel applications require some element\
    \ of communication between either the threads or the processes. There is usually\
    \ an implicit or explicit action of one thread sending data to another. For example,\
    \ one thread might signal to another that work is ready for them. We have already\
    \ seen an example of where a semaphore might indicate whether there are other\
    \ threads waiting for signal. Alternatively, a thread might placing a message\
    \ on a queue, and the message would be received by the thread tasked with handling\
    \ that queue.\n\nThese mechanisms usually require operating system support to\
    \ mediate the sending of messages between threads or processes. Programmers can\
    \ invent their own implementations, but it can be more efficient to rely on the\
    \ operating system to push a thread to sleep until a condition is true or until\
    \ a message is received.\n\nThe following sections outline various mechanisms\
    \ to enable processes or threads to pass messages or share data."
