  md: "# Chapter 5 Using POSIX Threads\n\nListing 5.18 Main Thread Calls Waits for\
    \ Child Threads to Complete\n\n```\n#include <pthread.h>\n#include <stdio.h>\n\
    \nvoid thread_code( void * param )\n{\n    printf(\"In thread code\\n\");\n}\n\
    \nint main()\n{\n    pthread_t thread;\n    pthread_create(&thread, &thread, &thread_code,\
    \ 0, 0 );\n    pthread_detach( thread);\n    printf(\"In main thread\\n\");\n\
    \    pthread_exit( 0);\n}\n```\n\nAfter this change, all the threads will print\
    \ their output before the main thread exits.\n\n# Sharing Data Between Threads\n\
    \nA key advantage of multithreaded codes is that all threads see the same memory,\
    \ so data is already shared between threads. However, it often important to coordinate\
    \ access to this data, since failure to coordinate accesses could cause data races\
    \ that lead to incorrect results. POSIX provides a large number of synchronization\
    \ and data-sharing methods.\n\n# Protecting Access Using Mutex Locks\n\nA mutex\
    \ is a mechanism supported by the POSIX standard that can be acquired by only\
    \ one thread at a time. Other threads that attempt to acquire the same mutex must\
    \ wait until it is released by the thread that has it.\n\nBefore they can be used,\
    \ mutex locks must be initialized by a call to pthread_mutex_init(), or for statically\
    \ defined mutexes, by assignment with the value PTHREAD_MUTEX_INITIALIZER. The\
    \ call to pthread_mutex_init() takes an optional parameter that points to attributes\
    \ describing the type of mutex required. Initialization through static assignment\
    \ uses default parameters, as passing a null pointer in the call to pthread_mutex_init().\n\
    \nOnce a mutex is no longer needed, the resources it consumes can be freed with\
    \ a call to pthread_mutex_destroy(). Listing 5.19 shows examples of initializing\
    \ and destroying mutexes."
  merge: -1
  img_proc: true
- pgno: 176
  md: "# Listing 5.19 Creating and Destroying Mutexes\n\n```\n#include <pthread.h>\n\
    ```\n\n```\npthread_mutex_t m1 = PTHREAD_MUTEX_INITIALIZER;\npthread_mutex_t m2;\n\
    \\pthread_mutex_init(&m2, 0);\n\npthread_mutex_destroy(&m1);\npthread_mutex_destroy(&m2);\n\
    ```\n\nA thread can lock a mutex by calling pthread_mutex_lock(). Once it has\
    \ finished with the mutex, the thread calls pthread_mutex_unlock(). If a thread\
    \ calls pthread_mutex_lock() while another thread holds the mutex, the calling\
    \ thread will wait, block, until the other thread releases the mutex, allowing\
    \ the calling thread to attempt to acquire the mutex.\n\nIn many situations, it\
    \ is not desirable for the calling thread to wait for the mutex to be available.\
    \ The calling pthread_mutex_trylock() will attempt to acquire the mutex. If it\
    \ succeeds, the function will return the value of 0, and the calling thread will\
    \ now be the owner of the mutex. If the mutex is already locked by another thread,\
    \ the function will immediately return a nonnonzero value indicating the exact\
    \ situation.\n\nThe code shown in Listing 5.20 shows a mutex protecting the variable\
    \ count against simultaneous access by multiple threads. The variable count is\
    \ declared volatile to ensure that it is read from memory on each access and written\
    \ back to memory after each access. Without mutex, there would be a data race\
    \ between the two threads. Hence, it is very unlikely that count would end up\
    \ with the correct value.\n\n# Listing 5.20 Mutex Lock Avoiding Data Race\n\n\
    ```\n#include <pthread.h>\n#include <stdio.h>\n```\n\n```\npthread_mutex_t mutex;\n\
    volatile int counter = 0;\n```\n\n```\nvoid * count(void * param)\n{\n  for (int\
    \ i=0; i<100; i++)\n  {\n    pthread_mutex_lock(&mutex);\n    counter++;\n  }\n\
    \  printf(\"Count = %i\\n\", counter);\n```"
