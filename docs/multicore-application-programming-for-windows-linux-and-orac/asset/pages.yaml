  md: '# The Characteristics of Multiprocessor Systems


    Each link between processor and memory will increase the latency of any memory
    access by processor. So if only one processor has memory attached, then processor
    will see low memory latency, and the other processor will see higher memory latency.
    In the situation where both processors have memory attached, then they will both
    have local memory that is low to access and remote memory that is higher cost
    to access.


    For systems where memory is attached to multiple processors, there are two options
    for reducing the performance impact. One approach is to interleave memory, often
    at a cache line boundary, so for most applications, half the memory accesses will
    see the short memory access, and half will see the long memory access; so, on
    average, applications will record memory latency that is the average of the two
    extremes. This approach typifies what is known as a uniform memory architecture
    (UMA), where all the processors see the same memory latency.


    The other approach is to accept that different regions of memory will have different
    access costs for processors in a system and then to make the operating system
    aware of this hardware characteristic. With operating system support, this can
    lead to applications usually seeing the lower memory cost of accessing local memory.
    A system with this architecture is referred to as having coherent nonuniform memory
    architecture (ccNUMA).


    For the operating system to manage ccNUMA memory characteristics effectively,
    it has to do a number of things. First, it needs to be aware of the locality structure
    of the system so that for each processor it is able to allocate memory with low
    latencies. The second challenge is that once a process has been run on a particular
    processor, the operating system needs to keep scheduling that process to that
    processor. If the operating system fails to achieve this second requirement, then
    all the locally allocated memory will become remote memory when the process gets.


