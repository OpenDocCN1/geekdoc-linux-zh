  md: "# Chapter 7 Using Automatic Parallelization and OpenMP\n\nListing 7.59 Using\
    \ the Ordered Directive to Explore the Scheduling Directive\n\n```\n#include <stdio.h>\n\
    #include <omp.h>\n\nint main()\n{\n    #pragma omp parallel for ordered schedule(\
    \ dynamic )\n    for (int i=0; i<100; i++) {\n        #pragma omp ordered\n  \
    \      {\n            printf(\"Iteration %i, thread ID %i\\n\", i, omp_get_thread_num());\n\
    \        }\n    }\n}\n```\n\nListing 7.60 shows the effect of this change in scheduling.\
    \ Dynamic scheduling causes the two threads to work with the default chunk size\
    \ of a single iteration, so the two threads alternate performing iterations.\n\
    \n# Listing 7.60 Exploring the impact of Dynamic Scheduling\n\n```\n$ cc -oopenmp\
    \ ordered.c\n$ export OMP_NUM_THREADS=2\n$ ./a.out\nIteration 0 Thread 0\nIteration\
    \ 1 Thread 1\nIteration 2 Thread 0\nIteration 3 Thread 1\n... \n```\n\n# Collapsing\
    \ Loops to Improve Workload Balance\n\nThe parallel for directive applies only\
    \ to the next loop. As always, it is best to apply parallelization at the outermost\
    \ loop, because this reduces the number of synchronization necessary. However,\
    \ a low trip count for the outer loop will limit the number of threads that can\
    \ be used in parallel. In these cases, it might be appropriate to parallelize\
    \ the inner loop, since this could have a higher iteration count. Without knowing\
    \ the trip counts for the two loops, it is not possible to decide which strategy\
    \ is more appropriate.\n\nHowever, OpenMP provides a way of avoiding this with\
    \ the outermost loop having a low trip count, which is to collapse the inner and\
    \ outer loops into a single loop. The clause to do this is collapse, which takes\
    \ the number of loops to collapse as a parameter"
