  md: '# Chapter 3 Identifying Opportunities for Parallelism


    ![](img/9337ae7b0be66cc11725becaa009908f_139_0.png)


    complete in. A program might complete tasks A, B, C, and D. Not all of the tasks
    need to have dependencies. B might depend on the results of A, and D might depend
    on the results of B and C, but C might not depend on any previous results. This
    kind of data can be displayed on a graph such as the one in Figure 3.24.

    It is relatively straightforward to identify the critical path in a process once
    the dependencies and durations have been identified. From this graph, it is apparent
    that task C could be performed in parallel with tasks A and B. Given timing data,
    it would be possible to estimate the expected performance of this parallelization
    strategy.


    # # Identifying Parallelization Opportunities


    The steps necessary to identify parallelization opportunities in cases are as
    follows:


    +   1. Gather a representative profile of the application, and identify the regions
    of code where the most time is currently being spent.

    2. For these regions, examine the code for dependencies, and determine whether
    the dependencies can be broken so that the code can be performed as multiple parallel
    tasks or as a loop over multiple parallel iterations. At this point, it may also
    be worth investigating whether a different algorithm or approach would give code
    that could be easily made parallel

    3. Estimate the overheads and likely gains from this parallelization strategy.
    If the approach comes close to linear scaling with the number of threads, then
    its a good approach; if the scaling does not look very efficient, it may be worth
    broadening the scope of the analysis.

    4. Broaden the scope of the analysis by considering the routine that calls the
    region of interest. Is it possible to make this routine parallel?


    The important point to remember is that parallelization incurs synchronization
    costs, so the more work that each task performs before it needs synchronization,
    the better the code will scale. Consequently, it is always worth looking further
    up the call stack of a region of code to determine whether there is a more effective
    parallelization point. For example, consider the pseudocode shown in Listing 3.14.'
