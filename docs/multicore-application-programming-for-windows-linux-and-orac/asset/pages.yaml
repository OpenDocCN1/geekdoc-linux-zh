    This tells us that the number of threads that a code can scale to is proportional
    to the ratio of work that can be parallelized and the cost of synchronization.
    So, the scaling of the application can be increased either by making more of the
    code run in parallel (increasing the value of P) or by reducing the synchronization
    costs (reducing the value of K). Alternatively, if the number of threads is held
    constant, reducing the synchronization cost (making K smaller) will enable smaller
    sections of code to be made parallel (P can also be made smaller).


    What makes this interesting is that a multic processor will often have threads
    sharing through a shared level of cache. The shared level of cache will have lower
    latency than if two threads had to communicate through memory. Synchronization
    costs are usually proportional to the latency of the memory through which the
    threads communicate through a shared level of cache will result in lower synchronization
    costs. This means that multicrocessors have the opportunity to be used for either
    parallelizing regions of code where the synchronization costs were previously
    prohibitive or, alternatively, scaling the existing code to higher thread counts
    that were previously possible.


    So far, this chapter has discussed the expectations that a developer should have
    when scaling their code to multiple threads. However, a bigger issue is how to
    identify work that can be completed in parallel, as well as the patterns to use
    to perform this work. The next section discusses common parallelization patterns
    and how to identify when to use them.


    # Parallelization Patterns


    There are many ways that work can be divided among multiple threads. The objective
    of this section is to provide an overview of the most common approaches and to
    indicate when these might be appropriate.


    Broadly speaking, there are two categories of parallelization, often referred
