  md: "# Multiprocess Programming 183\n\nOnce the child has exited, the parent process\
    \ continues to execute, obtaining the return value of the child process from the\
    \ call to waitpid().The macro WSTATUS converts the exit status from waitpid()\
    \ to the return value from the child process.\n\nThe parent process also acquires\
    \ the mutex and increments the shared variable before releasing the mutex. It\
    \ then prints the value of the shared variable, which has the value, indicating\
    \ that both the parent and the child process incremented.The final actions of\
    \ the parent process are to destroy the mutex then unmap and unlink the shared\
    \ memory segment.\n\nOne thing to pay attention to the alignment of objects created\
    \ in shared memory segments. Depending on the operating system, there may be constraints\
    \ on the alignment. For example, Solaris requires that mutexes be aligned on 8-byte\
    \ boundaries.\n\n# Sharing Semaphores Between Processes\n\nAs discussed in the\
    \ section semaphores, it is very easy to create a named semaphore that is shared\
    \ between multiple processes. Listing 5.58 shows a parent process creating a child\
    \ process. Both the parent and child process operate the same semaphore, and this\
    \ semaphore is used to ensure the child process completes before the parent process.\n\
    \n+   Listing 5.58 Sharing a Named Semaphore\n\n```\n#include <unistd.h>\n#include\
    \ <stdio.h>\n#include <semaphore.h>\n\nint main()\n{\n    int status;\n    pid_t\
    \ f = fork();\n    sem_t * semaphore;\n    semaphore = sem_open(\"/my_semaphore\"\
    , O_CREAT, 0777, 1 );\n    if ( f == 0 ) {\n        /* \"Child process completed\"\
    \ */\n        printf(\"Child process completed\\n\");\n        sem_post( semaphore\
    \ );\n        sem_close( semaphore );\n    }\nelse {\n        sem_t * semaphore;\n\
    \        sem_wait( semaphore );\n        printf(\"Parent process completed\\n\"\
    );\n        sem_close( semaphore );\n        sem_unlink(\"/my_semaphore\" );\n\
    \    }\n}}\n```"
