- pgno: 432
  md: '# 11


    # Concluding Remarks


    This book has covered a large range of parallelization approaches and topics.
    The next steps are to take this knowledge and apply it to an existing or a new
    application. This final chapter acts as a summary of the steps necessary to successfully
    develop correct and scalable multithreaded applications.


    # Writing Parallel Applications


    The key part of writing parallel applications is identifying where the parallelization
    will provide the most benefit for the least cost. If the application has not yet
    been written, then analysis is necessary to determine what can be completed in
    parallel. This analysis needs to take the critical performance metrics for the
    application into account— is the application more concerned with throughput, or
    response time more important? Both are equally important, and the question can
    be interpreted as whether the expected response time is sufficiently fast, in
    which case the threads can be assigned to throughput, or the response time is
    insufficient, in which case the threads should be assigned to reducing this.


    Making an existing running application in parallel is a harder task. The first
    step is to profile the application to determine where the time is spent. The art
    of performance tuning is to determine a region of code where sufficient time is
    spent so that any improvement in that region would result in an observable performance
    gain for the entire application.


    # Identifying Tasks


    The basic building block of parallelism might be called a task. A task can be
    passed to a single virtual CPU for computation. Identifying these tasks is a matter
    of carefully examining the profile of the application and locating the largest
    chunk of independent work.


    There are two potentially conflicting constraints. The most efficient scaling
    will come from identifying the largest chunk of work that can be completed independently.
    Doing this will keep the synchronization costs to a minimum. However, the greatest
    scaling will'
  merge: -1
  img_proc: true
- pgno: 433
  md: 'be achieved by identifying the largest number of independent tasks. Consequently,
    the best overall scaling will result from meeting both of these criteria—identifying
    a large number of tasks, each of which takes a significant amount of time before
    it requires synchronization with others.


    Profiles will help in discovering these tasks. There are multiple ways that the
    profile can be "sliced." The traditional slice is to look at the top functions,
    identify the function that is taking the time, and attempt to make this function
    parallel. This might identify sections of the functions that are independent or
    perhaps a loop that can be executed in parallel.


    However, when parallelizing an application, this slice of the profile may not
    be sufficient. The time spent in the top function could be only a small percentage
    of the total runtime. Therefore it might be necessary to look at the time spent
    both in a function and in all the functions it calls; this might be referred as
    a function''s callee, or its inclusive time. This would represent a larger amount
    of time, which could be divided between more tasks, or provide a small set of
    threads with more work before they require synchronization.


    Parallelization is not just about parallel computation. It is also appropriate
    to consider how the code spends waiting for some external event. Take a web server
    as an example. It will wait until it receives a request from a remote client,
    and then will send an appropriate response to the client. We have already looked
    at a parallel version of this where one thread waits for incoming requests while
    other threads serve the requests that have arrived. The performance and utilization
    gains come from enabling multiple to wait in parallel.


    An application might employ multiple parallelism strategies in order to utilize
    the most CPU resources. Taking the web server, we already have some fundamental
    parallelism in the incoming requests, and a further level of parallelism might
    be found using multiple threads to formulate each individual response.


    # Estimating Performance Gains


    One critical aspect of parallelism is knowing the expected performance gains,
    usually estimated using a variant of Amdahl''s law. Knowing how much work will
    be performed in parallel has an impact on how it will hit the runtime. An application
    where half of the work could be performed in parallel has an expectation of getting
    most twice as fast when parallelized. Knowing the degree of parallelism that the
    code can support provides a realistic expectation for the scaling of the code.
    If the code scales to only eight threads, then the code can get at most 1.8x faster
    when parallelized.


    Understanding this scaling helps in determining which parts of the code should
    be targeted for parallelization. After a first parallel region has been identified
    and coded the remaining code will probably contain further opportunities for parallelism,
    and these opportunities will be a more significant proportion of the remaining
    runtime. Hence, it is likely that parallelizing an application is an iterative
    process, with each stage causing further opportunities to become more attractive.'
