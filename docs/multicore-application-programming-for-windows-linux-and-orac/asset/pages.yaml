  md: '![](img/9337ae7b0be66cc11725becaa009908f_104_0.png)


    Figure 2.18 Cost of change and impact on performance over life cycle


    # # Summary


    From this chapter you should have gained an understanding of how performance needs
    to be engineered into an application. Understanding the desirable performance
    characteristics of the problem will help guide development of a product that will
    meet those characteristics. That performance can be reduced by a poor choice of
    algorithms, data structures, compiler flags, or other decisions made during the
    process of design and implementation. Rectifying these decisions increases costs,
    and the later fixes have greater cost.


    You should have gained an appreciation of how a compiler can be used to produce
    the best code and how good development practices can enable the compiler to do
    a better job.


    One important point to take away from this chapter is that it is important to
    profile an application during the development process to ensure both that it is
    fast enough to meet the acceptance criteria and that it is spending its runtime
    in useful work and not suboptimal code.'
