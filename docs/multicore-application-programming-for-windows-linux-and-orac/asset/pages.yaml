    # Features Proposed for the Next C and C++ Standards


    The revisions of both the C and C++ standards contain some features that will
    help in the development of multithreaded code. In previous chapters, we looked
    at the differences between POSIX threads and Windows threads. The functionality
    provided by the two implementations is similar, but there are many differences
    in how functionality-is exported to the developer. Incorporating some of this
    support into the language standards is a huge improvement in the ability to write
    portable parallel code.


    At the time of writing, it is not certain these features will be accepted or modified
    in the final version. Consequently, it is not possible to write compilable code
    that demonstrates these new features, both because the features may be in the
    final version and because there are no compilers that implement these features.
    However, there seems to three areas that the languages are standardizing.


