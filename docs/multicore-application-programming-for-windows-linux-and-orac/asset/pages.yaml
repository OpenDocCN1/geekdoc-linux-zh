    It should be apparent from the previous discussion that it is not trivial to use
    atomic operations to manage the addition and removal of elements from a circular
    buffer. The basic problem is that the atomic operation allows the atomic modification
    of the circular list but is a separate operation to update the shared pointer
    to the next element. These two operations would need to be somehow combined into
    a single atomic operation for the code to work correctly.


    # Summary


    Having completed this chapter, you should have an appreciation of some of the
    issues that need to be considered when writing synchronization code. It is important
    to consider both the memory ordering observed by other threads and the possibility
    that a thread might be descheduled at any point.

    Correct memory ordering needs to be enforced to ensure that memory operations
    become visible to other threads in the appropriate order. Failure to do this will
    result in other threads picking up stale or invalid values.

    When threads are descheduled, they give other threads the opportunity to program
    state. It is clearly possible to write safe synchronization mechanisms, it is
    usually best to look for primitives provided by the compiler or operating system
    because these will have been validated for correct operation. It is only when
    these prove to be high cost and the alternatives have been exhausted that it is
    worth investigating custom synchronization primitives.'
