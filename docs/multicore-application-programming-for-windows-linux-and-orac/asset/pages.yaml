  md: "Listing 7.61 shows an example of a code where the outer loop has a low trip\
    \ count, and using the collapse clause enables scaling to higher numbers of threads.\n\
    \n# Listing 7.61 Using the collapse Clause to Improve Scaling\n\n```\n#include\
    \ <math.h>\n\nvoid main() {\n    double array[2][10000];\n    #pragma omp parallel\
    \ for collapse( 2 )\n    for(int i=0; i<2; i++) {\n        for(int j=0; j<10000;\
    \ j++) {\n            array[i][j] = sin(i+j);\n        }\n    }\n}\n```\n\nWithout\
    \ the collapse clause, the outermost loop will only ever scale to two threads.\
    \ With the collapse clause, the combined loop can be up to a theoretical 20,000\
    \ threads (although the synchronization overhead would cause the code to run slowly\
    \ far before that count was reached). Using the collapse clause may introduce\
    \ additional overhead into the parallel region, so it is worth evaluating whether\
    \ the clause will improve performance or cause a performance loss.\n\n# Enforcing\
    \ Memory Consistency\n\nMemory consistency is when the values held in registers\
    \ by a thread match those held in memory. If another thread modifies a variable\
    \ in a register by this thread, the value has become inconsistent and needs to\
    \ be refetched from memory. OpenMP directives already enforce appropriate memory\
    \ consistency, so it is rare to be a concern for codes parallelized using OpenMP.\
    \ However, there could be situations where it is necessary to manually enforce\
    \ consistency.\n\nOpenMP allows the developer to explicitly specify the places\
    \ in the code where variables must be saved to memory or loaded from memory using\
    \ the flush directive. Unless the directive specifies a list of variables, it\
    \ applies to all the thread visible variables. If a list of variables is specified,\
    \ these variables will either be stored to memory or reloaded from memory depending\
    \ on which action is necessary.\n\nThe example shown in Listing 7.62 uses the\
    \ flush directive to produce a synchronization barrier between a pair of threads.\n\
    \n# Listing 7.62 Using the flush Directive to Produce a Barrier\n\n```\n#include\
    \ <stdio.h>\n#include <omp.h>\n#include <stdlib.h>\n```"
