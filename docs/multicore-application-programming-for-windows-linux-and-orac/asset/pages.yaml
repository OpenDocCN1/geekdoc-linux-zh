  md: "# Multiprocess Programming 185\n\nMessage queues are prioritized-first, first-out\
    \ (FIFO) queues. Messages are added to the queue using the call mq_send() and\
    \ received from the queue using the O_NONBLOCK attribute, if the queue has been\
    \ created with the mq_receive(). Then these functions return immediately whether\
    \ or not they were successful. There are versions of these functions available,\
    \ which will return after a timeout if they are unsuccessful; use mq_timedsend()\
    \ and mq_timedreceive(), which take an unsigned int and mq_retimedsend_np() and\
    \ mq_retimedreceive_np(), which take a relative time.\n\nThe parameters to mq_send()\
    \ are the message queue, a pointer to a buffer containing the size of the message,\
    \ and a priority. Messages with a higher priority will be placed before messages\
    \ with a lower priority and after messages with the same or higher priorities.\
    \ The message is copied from the buffer into the queue. The call to mq_send()\
    \ will fail if the message size is greater than the mq_msgsize attribute for the\
    \ queue.\n\nThe call to mq_receive() takes the message queue, a pointer to a buffer\
    \ where the message will be copied, the size of the buffer, and either a null\
    \ pointer or a pointer to an unsigned int where the priority of the message will\
    \ be written. If the size of the buffer is smaller than the size of the message,\
    \ the call will fail.\n\nNote that sending messages requires at least two copy\
    \ operations to be performed on the message—one to copy it into the queue and\
    \ once to copy it out of the queue. Hence, it is advisable to send short messages\
    \ and use shared memory to pass longer items of information.\n\nListing 5.60 shows\
    \ an example of sending messages between a parent and child process. On Solaris,\
    \ the code will need to be linked with the real-time extensions library using\
    \ the compiler -lrt.\n\n# Listing 5.60 Passing Messages Between a Parent Process\
