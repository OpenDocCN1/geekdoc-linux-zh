  md: "# Clustering Technologies 403\n\nMPI provides a rich API for communicating\
    \ between processes. The simplest level of this is the ability to pass an array\
    \ of data to another MPI process using a call to MPI_Send() and for that process\
    \ to receive the data using a call to MPI_Recv(). Other calls exist to provide\
    \ more intrinsic functionality like reductions.\n\nSince the communication overhead\
    \ is often quite large, it makes most sense to use MPI to solve problems that\
    \ are too large for a single system. With multiprocessors, the size of the problem\
    \ that can be tackled has become less dependent on the number of threads and more\
    \ dependent on considerations such as the memory footprint of the data set or\
    \ the amount of bandwidth of the system. This highlights an important motivator\
    \ for MPI programs—system characteristics as amount of bandwidth or amount of\
    \ available memory scale with the number of systems. For a problem that is limited\
    \ by the time it takes to process two systems will provide twice as fast. Using\
    \ two threads on a single system does not necessarily provide the same doubling\
    \ of bandwidth and certainly does not double the memory capacity of the system.\n\
    \nHigh communication costs also cause a change in the approach to using MPI to\
    \ solve problems. As we have previously discussed, the best scalability will result\
    \ from codes that have the fewest and smallest amounts of communication. Tuning\
    \ algorithms to remove or reduce the need for communication result in better performance.\
    \ It is more efficient for an algorithm to use approximations to return the values\
    \ from other processes rather than waiting for those to return the exact answers,\
    \ even if this approximation causes the algorithm to iterate longer before terminating.\n\
    \nTo illustrate the use of MPI, we'll use to produce a larger image of the Mandelbrot\
    \ set. The algorithm that we are going to use is a single master process and a\
    \ number of worker processes. The worker processes compute a line of the Mandelbrot\
    \ set at a time and pass this to the master process. Listing 10.22 shows the code\
    \ necessary to compute a line of the Mandelbrot set.\n\n# Listing 10.22 Computing\
    \ of a Mandelbrot Set\n\n```\n#include \"mpi.h\"\n#include <stdlib.h>\n\n#define\
    \ COLS 1000\n#define ROWS 1000\n\nint inset(double ix, double iy )\\n{\n    int\
    \ iterations = 0;\n    double x = ix, y = iy, x2 = x*x, y2 = y*y;\n    while (\
    \ ( x2 + y2 < 4 ) && ( iterations < 1000 ) ) {\n        y = 2 * x * y + iy;\n\
    \        x = x2 - y2 + ix;\n        x2 = x * x;\n    }\n}\n```"
