    the signal, it can extract the value of this field from the sigval union passed
    into it.

    Compiling and running the code produces the output shown in Listing 5.71.


    # Listing 5.71 Parent Sending Information to the Child Process


    ```

    $ gcc child2.c

    $ ./a.out

    Signal arrived

    Child completed go=7

    Parent completed

    ```


    The parent process creates a child process and then sends a SIGRTMIN+4 signal
    to the child. The child process loops until the variable goes nonzero. When the
    child process receives the signal, it sets the variable to go nonzero, and this
    enables the process to print a message and exit. In the meantime, the parent process
    has been waiting for the child process to exit. When the child process eventually
    exits, the parent process prints a message and exits.


    One significant problem with using signals is that they can disrupt a system call
    the thread is making at the time the signal is received. If this happens, the
    system will set errno to the value EINTR indicating that the call should be retired.
    However, the exact behavior is system dependent and should be carefully explored
    before relying on signals.


    # Sockets


    A full treatment of socket programming is beyond the scope of this book. However,
    sockets remain an important way that processes or threads can communicate, so
    it is worth examining the use of sockets for communication within the same system.
    A particular advantage of using sockets for communication is that scaling beyond
    a single system becomes a relatively minor change to the code.'
