  md: '# Using Parallelism to Improve the Performance of a Single Task


    # Determining the Maximum Practical Threads


    If we take Amdahl''s law as a reasonable approximation to application scaling,
    it becomes an interesting question to ask how many threads we should expect an
    application to scale to.


    If we have an application that spends only 10% of its time in code that can be
    parallelized, it is unlikely we will see noticeable gain when using eight threads
    over four threads. If we assume it 100 seconds to start with, then four threads
    would complete the task in 92.5 seconds, whereas eight threads would take 91.25
    seconds. This is just over a second out of a total duration of a minute and a
    half. In the case of seconds might be seen as a way of trivializing the difference,
    imagine that the original code took 100 days; then the difference is equivalent
    to a single day out of a duration of three months.


    There will be some applications where every last is critical and it makes sense
    to use as many resources as possible to increase the performance to as high as
    possible. However, there are probably a large number of applications where a small
    gain in performance is not worth the effort.


    We can analyze this issue assuming that a person has a tolerance, T, within which
    they cease to care about a difference in performance. For many people this is
    10%; if the performance that they get is within 10% of the best possible, then
    it is acceptable. Other groups might have stronger or weaker constraints.


    Returning to Amdahl''s law, recall the runtime of an application that has a portion
    P of parallelizable code and S of serial code that is run with N threads is as
    follows:


    > $Runtime_n = S + \frac{P}{N}$


    The optimal runtime, when there are an infinite number of threads, is S. So, a
    runtime within T percent of the optimal would be as follows:


    > Acceptable runtime = $S*(1+T)$


    We can compare the acceptable runtime with the runtime with N threads:


    > $S*(1+T) = \left(S + \frac{P}{N}\right)$


    We can then rearrange and solve for N to get the following relationship for N:


    > $N = \frac{P}{ST} = \frac{P}{(1-P)T}$'
