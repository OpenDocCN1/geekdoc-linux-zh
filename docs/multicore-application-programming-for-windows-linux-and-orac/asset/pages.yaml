  md: "Fortunately, most compilers are often able to correctly interchange the loops\
    \ and improve the memory access patterns. However, there are many situations where\
    \ the compiler is unable to make the necessary transformations because of aliasing\
    \ or the order in which the elements are accessed in the loop. In these cases,\
    \ it is necessary for the developer to determine the appropriate layout and restructure\
    \ the code appropriately.\n\n# Choosing Appropriate Data Structures\n\nChoosing\
    \ the best structure to hold data, as choosing an algorithm of the appropriate\
    \ complexity, can have a major impact on overall performance. This hacks back\
    \ to the discussions of algorithmic complexity earlier in this chapter. Some structures\
    \ will be efficient when data is accessed in one pattern, while other structures\
    \ will be more efficient if the access pattern is changed.\n\nConsider a simple\
    \ example. Suppose you have a dictionary of words for a spellchecker application.\
    \ You don't know at compile time how many words will be in the dictionary, so\
    \ the easiest way to cope with this might be to read in the words and place them\
    \ onto a linked list, as shown in Figure 2.6.\n\n![](img/9337ae7b0be66cc11725becaa009908f_80_0.png)\n\
    \nFigure 2.6 Using a linked list to hold an ordered list of words\n\nEvery time\
    \ the application needs to check whether a word is in the dictionary, it traverses\
    \ the linked list of words, so a spell-check of the entire document is an O(N²)\
    \ activity.\n\nAn alternative implementation might be to allocate an array of\
    \ known length to hold pointers to the various words, as shown in Figure 2.7.\n\
    \ there might be some complications in choosing the array to be the right length\
    \ to hold all the elements, the benefit comes from being able to do a binary search\
    \ on the sorted list of words held in the array. A binary search is O(log2(N))\
    \ activity, performing a spell-check on an entire document would be an O(N*log2(N))\
    \ activity, which, as indicated earlier, would be a significantly faster approach."
