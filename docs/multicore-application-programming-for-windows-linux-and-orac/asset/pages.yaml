- pgno: 90
  md: '# The Role of the Compiler


    inline routines that will benefit performance and avoid inlining those that will
    only increase the instruction cache footprint.


    Profile feedback, or feedback-directed optimization, allows the compiler opportunity
    to gather runtime information on the behavior of the application. It is a three-step
    process. The first step is to build an instrumented version of the application
    to collect runtime metrics. The next step is to run this on a data set, which
    is “typical” of the one that the application will really run on whose runtime
    is much shorter. The final step is to recompile the application using this profile
    information. Listing 2.44 shows the steps using the Solaris Studio compiler.


    # Listing 2.44 Steps for Using Profile Feedback with the Sun Studio Compiler


    ```

    $ cc -0 -xprofile=collect:./profile -o a.out prog.c

    $ a.out

    $ cc -0 -xprofile=./profile -o a.out prog.c

    ```


    The benefit of profile feedback depends on the application. Some applications
    will have no benefit, while some may see a significant gain. As outlined earlier,
    the gains come from either getting the compiler to lay out performance-critical
    section of code in an optimal way or inlining a performance-critical routine.


    It is interesting to observe that profile feedback tends to give the greatest
    benefit to codes where there are lots of branches or calls than codes where there
    are a lot of loops. The compiler predicts that loops will be iterated many but
    has a harder job correctly guessing for codes where there are plenty of control
    flow instructions. Codes that have control flow instructions also tend to have
    few instructions between control flow, so there are not many opportunities for
    the compiler to extract performance in other ways. Hence, profile feedback can
    be the most effective way of improving performance in a class of code that is
    otherwise hard to optimize.


    There are two concerns with using profile feedback. The first is that using profile
    feedback complicates the build process and its duration. This can be controlled
    by using profile feedback only on the release builds and not as part of the regular
    developer builds. It can be managed by ensuring that the build process is as efficient
    as possible. For instance, the build can be parallelized so that it takes advantage
    of multiple cores.


    The other concern is that using profile feedback optimizes the application for
    one particular scenario at the expense of performance in other scenarios. This
    is the zero view of performance; a gain on one workload is compensated by a loss
    of performance in another. In, this concern is misplaced. Profile feedback helps
    the compiler decides about executed paths and frequently called functions. In
    most instances, the behavior of the application is only weakly dependent on the
    input data set. For example, the same routines called (although with a different
    frequency), the same branches get taken, and so forth. This does not mean that
    every control transfer instruction has the same profile, but the majority of the
    control transfers in the code have the same direction.'
  merge: -1
  img_proc: true
