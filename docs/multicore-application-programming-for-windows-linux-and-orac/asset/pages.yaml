  md: "data for a previous load instruction. Both loads will be fetched simultaneously,\
    \ and in the best case, the total cost of the loads can be potentially halved.\
    \ If more than two loads can be simultaneously fetched, the cost is further reduced.\n\
    \n+   * Hardware prefetching of data is where the processor is dedicated to detecting\
    \ streams of data from memory. When a stream of data is identified, the hardware\
    \ starts fetching the data before it is requested by the processor. If the hardware\
    \ prefetch is successful, the data may have become in the cache before it was\
    \ needed. Hardware prefetching can be very effective in situations where data\
    \ is fetched as a stream or through a strided access pattern. It is not able to\
    \ prefetch data when the access pattern is less linear.\n* Software prefetching\
    \ is the act of adding instructions to fetch data from memory before it is needed.\
    \ Software prefetching has an advantage in that it does not need to guess where\
    \ the data will be requested from the memory, because the prefetch instruction\
    \ can come from exactly the right address, even when the address is not a linear\
    \ stride from the previous address. Software prefetch is an advantage when the\
    \ access pattern is nonlinear. Hardware prefetching may be more efficient because\
    \ it does not take up any space in the instruction stream.\n\nAnother approach\
    \ to covering memory latency costs is CMT processors. When one thread stalls because\
    \ of a cache miss, the other running threads get to use the processor resources\
    \ of the stalled thread. This approach, unlike those discussed earlier, does not\
    \ improve the execution speed of a single thread. This can enable the processor\
    \ to do more work by sustaining more active threads, improving throughput rather\
    \ than single-threaded performance.\n\nThere are a number of common coding styles\
    \ that can result in suboptimal layout in memory. The following sections describe\
    \ each of these.\n\n# Improving Performance Through Data Density and Locality\n\
    \nPaying attention to the order in which variables are declared and laid out in\
    \ memory can improve performance. As discussed earlier, when a load brings a variable\
