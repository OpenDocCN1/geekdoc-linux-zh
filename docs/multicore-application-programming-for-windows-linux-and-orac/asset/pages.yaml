    # Condition Variables


    Condition variables were introduced in version of Vista. They work with either
    a critical section or a slim reader/writer lock to allow threads to sleep until
    a condition becomes true. They are user constructs, which cannot be shared across
    processes. The call


    InitializeConditionVariable() initializes the condition variable for use.

    A thread uses a condition variable by acquiring a slim reader/writer lock and
    then calling SleepingConditionVariablesRW() or entering a critical section and
    calling SleepingConditionVariablesCS(). When they are woken they again acquired
    either the critical section or the reader/writer lock (depending on how the condition
    variable is being used). The first thing that thread needs is to determine whether
    the conditions it is waiting on are true, since it is possible for the thread
    to be woken when the conditions are not met. If the conditions have not been met,
    the thread should return to sleeping on a condition variable.


    There are two calls to wake threads sleeping on a condition variable.

    WakeConditionVariable() wakes one of the threads waiting on a condition variable.

    WakeAllConditionVariable() wakes all the threads sleeping on a condition variable.


    Listing 6.22 shows an example of using a condition variable to mediate a producer-consumer
    pairing of threads. The producer thread add items onto a queue. To do this, thread
    first needs to enter the critical section where it is safe to manipulate the queue
