- pgno: 275
  md: "# Assisting Compiler in Automatically Parallelizing Code\n\nThe code in Listing\
    \ 7.18 has a potential aliasing issue. The changes in the array **myapp** might\
    \ also change the value pointed to by **length** if it happens to be a member\
    \ of **myapp**.\n\nListing 7.18 Incrementing All Values Held in an Array of Numbers\n\
    \n```\nvoid sum(double* myarray, int *length )\n{\n  int i;\n  for ( i=0; i<length;\
    \ i++ )\n  {\n    myapp[i] += 1;\n  }\n}\n```\n\nIt is possible to modify the\
    \ code so that a compiler can automatically parallelize it. One way to resolve\
    \ this would be to specify that **length** is a **restrict**-qualified pointer\
    \ so that the compiler would know that stores to **array** would not alter the\
    \ value pointed to by **length**. Another approach would be to place the value\
    \ pointed to by **length** into a temporary variable. This second approach has\
    \ an advantage in that it does not rely on support for the **restrict** keyword.\n\
    \nIn many situations, the compiler will be able to parallelize loops if some of\
    \ the potential aliasing issues are resolved using temporary variables or type\
    \ casting using **restrict**-qualified pointers. The code shown in Listing 7.19\
    \ exhibits a number of potential aliasing issues.\n\nListing 7.19 Code That Passes\
    \ Data Using Structures\n\n```\ntypedef struct s {\n  int length;\n  double *array1,\
    \ *array2;\n} S;\n\nvoid calc( S *data )\n{\n  int i;\n  for ( i=0; i < data->length;\
    \ i++ )    // Line 10\n  {\n    data->array1[i] += data->array2[i];    // Line\
    \ 12\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 276
  md: "# Using Automatic Parallelization to Produce a Parallel Application 255\n\n\
    The first issue that the compiler finds is it fails to recognize the loop at line\
    \ 10 as one that can be parallelized. This is because changes to data->array might\
    \ change the value of the variable data->length. The problem is that the compiler\
    \ cannot know how many iterations of the loop will be performed, so it cannot\
    \ divide those iterations between threads. This can be resolved by using a local\
    \ copy of the data->length and using that as the loop iteration limit.\n\nThis\
    \ converts the loop into one that can be recognized by the compiler, but the compiler\
    \ is still unable to parallelize because there is potential aliasing between reads\
    \ from data->array2 and writes to data->array1. This issue can be resolving by\
    \ making local restrict qualified pointers to the two arrays. Listing 7.20 shows\
    \ the modified source.\n\nListing 7.20 Modified Code That Passes Data Using Structures\n\
    \n```\ntypedef struct s {\n    int length;\n    double *array, *array2;\n} S;\n\
    \nvoid calc(S *data) {\n    int i;\n    int length = data->length;\n    double\
    \ * restrict array1 = data->array1;\n    double * restrict array2 = data->array2;\n\
    \    for (i=0; i < length; i++) {\n        array1[i] += array2[i];\n    }\n}\n\
    ```\n\nIn some instances, the compiler may be able to use versioning of the loop\
    \ to automatically parallelize code like that in Listing 7.19. The compiler produces\
    \ multiple versions of the loop, and the appropriate version is selected at runtime.\
    \ The loop is used when there is aliasing between stores to memory and variables\
    \ used by the loop. In the code in Listing 7.19, the stores to data->array1 might\
    \ alias with data->array2, data->length, or the structure pointed to data. A parallel\
    \ version is generated for use when there is no aliasing.\n\nThe techniques to\
    \ improve the change that a compiler can automatically parallelize an application\
    \ can be summarized as follows:\n\n+   By default, most compilers will assume\
    \ that all pointers alias. This can be resolved by making local copies of invariant\
    \ data, by specifying a stronger aliasing assumption, or by declaring pointers\
    \ with the restrict keyword."
  merge: -1
  img_proc: true
- pgno: 277
  md: '+   The compiler may require additional flags for it to produce parallel versions
    of all loops. This may be a flag to give permission to perform parallelization
    of reductions, such as the -xreduction flag needed by the Solaris Studio compiler.
    Alternatively, it may be a flag that alters the threshold at which the compiler
    will consider a loop profitable to parallelize. For example, the Intel compiler
    has the -par-threshold0 flag. Finally, there may be additional flags for the compiler
    to recognize loops containing intrinsic functions as being safe to parallelize;
    the Solaris Studio compiler requires the -xbuiltin flag for this purpose.


    +   Compilers cannot parallelize loops unless they are certain that the function
    calls are without side effects. In some cases, there may be compiler directives
    that can be placed in the source code of the application to provide this assertion.
    In other cases, it may be possible to force the compiler to inline the function,
    which would then enable it to parallelize the resulting loop.


    From this, it appears that compilers are able to automatically extract some parallelism
    from a subset of applications. The size of the subset can be increased using the
    feedback provided by the compiler and some of the techniques described here. However,
    the ability of compilers to perform automatic parallelization is limited, and
    some of the code changes proposed here may reduce the clarity of the source code.


    Alternatively, the OpenMP API provides a way to expose the parallelism in a code
    by making minimal changes to the source code. With most compilers, it can be used
    in addition to automatic parallelization so that more of the application can be
    parallelized.


    # Using OpenMP to Produce a Parallel Application


    With OpenMP, directives in the source code are used to express parallel constructs.
    These directives start with the phrase #pragma omp. Under appropriate compilation
    flags, the directives are read by the compiler and used to generate a parallel
    version of the application. If the required flags are not provided, the directives
    are ignored. The OpenMP API specification details these as well as library calls
    to determine or modify runtime parameters such as the current number of threads.
    As we saw in Chapter 3, "Identifying Opportunities for Parallelization," a benefit
    of using OpenMP directives is that it separates the parallelism from the algorithm.
    The code can be read without worrying about how the parallelization is implemented.
    Some other advantages to using OpenMP are as follows:


    +   The directives are recognized only when compiled with a particular compiler
    flag, so the source base can be used to generate the serial and parallel versions
    of the code. This simplifies debugging since it is relatively easy to determine
    whether, for a given problem, the parallel version produces a different answer
    to the serial version and therefore whether a bug is because of the parallelization
    or the original algorithm.'
  merge: -1
  img_proc: true
- pgno: 278
  md: "# Using OpenMP to Produce a Parallel Application\n\n+   - Each directive is\
    \ limited to the region of code to which it applies. Consequently, the developer\
    \ can focus on making the critical section of the code without being concerned\
    \ about changing the rest of the code to support this parallelization. This is\
    \ referred to as the ability to perform incremental parallelization.\n\n+   -\
    \ Possibly the biggest advantage is that the compiler and supporting library are\
    \ responsible for all the parallelization work and the runtime management of threads.\n\
    \nIt is probably easiest to demonstrate the use of OpenMP directives through the\
    \ simple example shown in Listing 7.21. The OpenMP directive is indicated in bold.\n\
    \n# Listing 7.21 Loop Parallelized Using OpenMP\n\n```\nvoid calce(double* array1,\
    \ double * array2, int length ) {\n  #pragma omp parallel for\n  for ( int i=0;\
    \ i<length; i++) {\n    array1[i] += array2[i];\n  }\n}\n```\n\nThe code in Listing\
    \ 7.21 shows how the OpenMP directive can be placed above the loop to which it\
    \ applies. The OpenMP directive places the burden of ensuring the code is safe\
    \ to execute in parallel on the developer, not on the compiler. Although the compiler\
    \ will produce a parallel version of the loop, it is up to the developer to ensure\
    \ that this is a safety optimization. An instance of where might be unsafe is\
    \ if the arrays had some degree of overlap, then the parallel version might not\
    \ produce the same result as the serial version.\n\nThe OpenMP directive has three\
    \ parts:\n\n+   - #pragma omp indicates to the compiler what follows is an OpenMP\
    \ directive.\n\n+   - parallel tells the compiler to start a new parallel region.\
    \ Unless otherwise specified, all the threads will execute the code in the parallel\
    \ region.\n\n+   - for tells the compiler that the for loop should be executed\
    \ in parallel.\n\nMultiple threads will work on independent parts of the range\
    \ of iterations. At end of the loop, the threads will wait until all the iterations\
    \ have completed before the next part of the code is executed.\n\nThe statement\
    \ given in this code snippet iters is the simplest possible example, but illustrates\
    \ exactly what the OpenMP specification aims to achieve."
  merge: -1
  img_proc: true
- pgno: 279
  md: "# Using OpenMP to Parallelize Loops\n\nOpenMP places some restrictions on the\
    \ types of loops that can be parallelized. The runtime library needs to be able\
    \ to determine the start points and end points for the work assigned to each thread.\
    \ Consequently, the following constraints are needed:\n\n+   - The loop has to\
    \ be for loop of this form:\n  for (int expression; test expression; increment\
    \ expression)\n- The loop variable needs to be one of the following types: a signed\
    \ or unsigned integer, a pointer, or a C++ random access iterator.\n- The loop\
    \ variable needs to be initialized to one end of the range.\n- The variable needs\
    \ to be incremented (or decremented) by a loop invariant increment.\n- The test\
    \ expression needs to be one of >, >=, <, <=. The comparison needs to be with\
    \ a loop invariant value.\n\nUnder these conditions, it is possible for the runtime\
    \ to take the loop and partition the iteration ranges to the work. Loops that\
    \ do not adhere to these specifications need to be restructured before they can\
    \ be parallelized using an OpenMP parallel construct.\n\n# Runtime Behavior of\
    \ an OpenMP Application\n\nOpenMP works using a combination of compiler support\
    \ plus a runtime library. The compiler uses the directives in the source code\
    \ to produce appropriate blocks of code together with the necessary calls into\
    \ the runtime library.\n\nFor example, when the compiler encounters a directive\
    \ defining a parallel region, the compiler will produce a new block of code that\
    \ will be executed by the threads in parallel. The runtime library is responsible\
    \ for assigning the work to the various threads.\nOpenMP follows a fork-join model.\
    \ The runtime library will create a team of threads. When a parallel region is\
    \ encountered, the work is divided between members of these threads. At the end\
    \ of the region, the original thread, called the master thread, will continue\
    \ executing the code after the region. The other threads, called worker threads,\
    \ will wait until the master thread reaches the next parallel region and new work\
    \ is assigned to them. The number of threads that will be used is set by the environment\
    \ variable OMP_NUM_THREADS, but this can be adjusted by the application at runtime\
    \ calls into the runtime support library. For example, consider the code in 7.22.\n\
    \nListing 7.22 OpenMP Parallel Region\n\n```\n#include <stdio.h>\n\nvoid main()\
    \ {\n{\n```"
  merge: -1
  img_proc: true
- pgno: 280
  md: "# Using OpenMP to Produce a Parallel Application 259\n\n```\n#pragma omp parallel\n\
    {\n    printf(\"Thread\\n\");\n}\n```\n\nWhen compiled and run, each thread of\
    \ the number of threads specified by OMP_NUM_THREADS will execute the parallel\
    \ region. For the Solaris Studio compiler to recognize the OpenMP directives,\
    \ it needs the flag -xopenmp. The flag -xloopinfo tells the compiler to provide\
    \ information about the parallelization it has been undertaken. Listing 7.23 shows\
    \ the output of compiling and running this program. Each of the two threads executes\
    \ the parallel region and prints the output Thread.\n\n# Listing 7.23 OpenMP Parallel\
    \ Region\n\n```\n$ cc -0 -xopenmp -xloopinfo ompt.c\n$ export OMP_NUM_THREADS=2\n\
    $ ./a.out\n```\n\nThread\nThread\n\n# Variable Scoping Inside OpenMP Parallel\
    \ Regions\n\nOne of the trickier aspects of parallelization is the scoping of\
    \ variables used in the parallel region. In Listing 7.24, there are four variables\
    \ used in the parallel region: i, length, array1, and array2. The variables can\
    \ be either shared, so each thread shares the same variable, or private, where\
    \ each thread gets its own copy of the variable.\nThe loop counter i needs to\
    \ be private to each so that each thread gets its own copy of the variable. The\
    \ variables array1 and array2 are shared. Each thread works on a separate range\
    \ of values, so there is no actual sharing of data. The variable length is also\
    \ shared between the threads, but since it is not modified, it does not matter\
    \ whether it is shared or private. It is possible to see how the Solaris Studio\
    \ compiler has scoped these variables using the code analysis tool er_src on the\
    \ generated object file, as shown in Listing 7.24.\n\n# Listing 7.24 Using to\
    \ Examine Variable Scoping for Parallel Region\n\n```\n$ cc -c -g -xopenmp -xloopinfo\
    \ omploop.c\n\"omloop.c\", line 4 PARALLELIZED, user pragma used\n$ er_src omploop.o\n\
    ```\n\n```\n...\n1. void calc(double * array1, double * array2, int length)\n\
    2. {\n<Function: calc>\n```"
  merge: -1
  img_proc: true
- pgno: 281
  md: "# Chapter 7 Using Automatic Parallelization and OpenMP\n\nSource OpenMP region\
    \ below has tag RI\nPrivate variables in R1: i\nShared variables in R1: array2,\
    \ length, array1\n\nSource loop below has tag LI\nLI parallelized by explicit\
    \ user directive\n...\n\n```\n4. for(int i=0; i<length; i++)\n5. {\n6. array1[i]\
    \ += array2[i];\n7. }\n8. \n```\n\nThe rules governing the default variable scoping\
    \ in OpenMP are complex. The simplified summary of the rules is they define the\
    \ loop induction variable as being private, variables defined in the parallel\
    \ code as private, and variables outside the parallel region as shared. This should\
    \ be appropriate in simple situations but may not be appropriate in more complex\
    \ ones. In these situations, it is better to manually define the variable The\
    \ default scoping rules can be disabled using the clause default(none), which\
    \ will cause the compiler to issue an error for any variables whose scoping is\
    \ not specified. Variables can be scoped as private or shared using the clause\
    \ private(variables) or shared(variables), respectively. Listing 7.25 shows the\
    \ original source modified to manually specify variable scoping.\n\nListing 7.25\
    \ Loop Parallelized Using OpenMP with Explicitly Stated Variable Scoping\n\n```\n\
    void calc(double* array1, double* array2, int length )\n{\nint i;\n#pragma omp\
    \ parallel for private(i) shared(length, array1, array2)\nfor (i=0; i<length;\
    \ i++) {\narray1[i] += array2[i];\n}\n\n```\n\n# Parallelizing Reductions Using\
    \ OpenMP\n\nNot all variables can be scoped as shared or private. The most obvious\
    \ example of a more complex situation is a reduction. Listing 7.26 shows an example\
    \ of a reduction. The variable total is computed by adding all the elements in\
    \ an array."
  merge: -1
  img_proc: true
- pgno: 282
  md: "# Using OpenMP to Produce a Parallel Application\n\nListing 7.26 Loop Containing\
    \ a Reduction Operation\n\n```\ndouble calc(double* array, int length )\n{\n \
    \   double total = 0.0;\n    for (int i=0; i<length; i++) {\n        total +=\
    \ array[i];\n    }\n    return total;\n}\n```\n\nThe result returned by the variable\
    \ total will happen to be serialize access to the variable using a mutex or an\
    \ atomic operation, which would render this parallelization of the loop pointless.\n\
    The OpenMP specification allows for a reduction to be applied over a parallel\
    \ region. The reduction gives each thread a private copy of the reduction variable,\
    \ which it uses for computation in the parallel region. At the end of the parallel\
    \ region, the private copies of the reduction variable are combined to produce\
    \ the final result. The syntax for the reduction clause is reduction(operator:variable).\
    \ Listing 7.27 shows the loop parallelized using a reduction clause.\n\nListing\
    \ 7.27 Loop Containing a Reduction Operation\n\n```\ndouble calc(double* array,\
    \ int length )\n{\n    double total = 0.0;\n    #pragma omp parallel for reduction(+:\
    \ total)\n    for (int i=0; i<length; i++) {\n        total += array[i];\n   \
    \ }\n    return total;\n}\n```\n\nThe operator to which the reduction applies\
    \ is not limited to additions. It includes a number of other operations such as\
    \ subtraction; multiplication; the bitwise operations AND, OR, or XOR; and the\
    \ logical operations AND and OR.\n\n# Accessing Private Data Outside the Parallel\
    \ Region\n\nWhen a variable is declared as private, each thread gets a private\
    \ copy of the variable. However, the variable does not initialized at the start\
    \ of the parallel region, and its value does not get propagated beyond the end\
    \ of the region. Listing 7.28 shows an example of code where the value of the\
    \ variable before the parallel region is important."
  merge: -1
  img_proc: true
