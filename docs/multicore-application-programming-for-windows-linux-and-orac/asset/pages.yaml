  md: '# How Structure Impacts Performance


    where it is appropriate add padding to the structure is when the structures are
    always accessed randomly, so it is more important to ensure that the critical
    data is not split across a cache line.


    The performance impact of poorly ordered structures can be hard to detect. The
    cost is spread over all accesses to the structure over the entire application.
    Reordering the structure members can improve the performance for all the routines
    that access the structure. Determining the optimal layout for the structure members
    can also be difficult. One guideline would be to order the structure members by
    access frequency or group them by those that are accessed in the hot regions of
    code. It is worth considering that changing the order of structure members could
    introduce a performance regression if the existing ordering happens to have been
    optimal for a different frequently executed code.


    A similar optimization is structure splitting, where an existing structure is
    split into members that are accessed frequently and members that are accessed
    infrequently. If the infrequently accessed structure members are removed and placed
    into another structure, then each fetch of data from memory will result in more
    of the critical structures being fetched in one action. Taking the previous example,
    where we assume that var is rarely needed, we would end up with a pair of structures,
    as shown in Figure 2.4.


    | var1 | var2 | var1 | var2 | var1 | var2 | var1 | var2 | var1 |

    |---|---|---|---|---|---|---|---|---|n| struct s0[0] | | | struct s0[1] | | |
    struct s0[2] | | | struct s0[3] |

    | Cache line | | | | Cache line | | | | |

    | var1 | var3 | var3 | var3 | var2 | var3 | var3 | var3 |

    | s1[0] | s1[1] | s1[2] | s1[3] | s1[4] | s1[5] | s1[6] | s1[7] | s1[8] |

    | Cache line | | | | Cache line | | | |


    > Figure 2.4 Using structure splitting to improve memory locality


    In this instance, the original structure s has been split into two, with s0 containing
    all the frequently accessed data and s1 all the infrequently accessed data. In
    the limit, this optimization is converting what might be an array of structures
    into a set of arrays, one for each of the original structure members.'
