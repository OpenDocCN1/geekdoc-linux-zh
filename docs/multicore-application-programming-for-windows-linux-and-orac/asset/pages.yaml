  md: '# Chapter 3 Identifying Opportunities for Parallelism


    Each operating system appears to have access to its own machine. It is not apparent,
    from within the operating system, that the hardware is being shared.The hardware
    has effectively been virtualized, in that the guest operating system will believe
    it is running on whatever type of hardware hypervisor indicates.


    This provides the isolation that is needed for ensuring security and robustness,
    while at the same time making it possible to run multiple copies of different
    operating systems as guests on the same host. Each guest believes that the entire
    hardware resources of the machine are available. Examples of this kind of hypervisor
    is the Logical Domains provided on the Sun UltraSPARC T1 and T2 product lines
    or the Xen hypervisor software on x86. Figure 3.5 illustrates a type 1 hypervisor.


    | Guest operating system 1 | Guest operating system 2 |

    |---|---|

    | User 1 | User 2 | User 3 | User 4 |

    | Hypervisor | |

