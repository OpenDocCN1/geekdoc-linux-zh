  md: '# Multiple Users Utilizing a Single System


    ![](img/9337ae7b0be66cc11725becaa009908f_108_0.png)


    Figure 3.2 Single user on system


    It is also possible to have multiple users in a home environment. For example,
    on Windows, it is quite possible for one user to be logged in and using the computer
    while another user, having logged in earlier, has set some other applications
    running. For example, you may have left some DVD-authororing package running in
    the background while another user logs into their account to check their e-mail.


    # Multiple Users Utilizing a Single System


    In business and enterprise computing, it is much more common to encounter systems
    with multiple simultaneous users. This often is because the computer and software
    being shared are more powerful and costly than the typical consumer system. To
    maximize efficiency, a business might maintain a database on a single shared system.
    Multiple users can simultaneously access this system to add or retrieve data.
    These users might just be as easily as other applications as well as humans.


    For years, multiuser operating systems like UNIX and Linux have enabled sharing
    of compute resources between multiple users. Each user gets a “slice” of the available
    compute resources. In this way, multicore systems provide more compute resources
    for the users to share.


    Figure 3.3 illustrates the situation with multiple users of the same system. Multicore
    systems can be very well utilized running multiple applications, running copies
    of the same application, and supporting multiple simultaneous users. To the OS,
    these are all just processes, and they will all benefit from the capabilities
    of a multicore system.


    Multiser operating systems enforce separation between the applications run by
    different users. If a program user was running to cause other applications to
    crash or to write randomly to disk, the damage is limited to only those applications
    owned by that user or the disk space they have permission to change.'
