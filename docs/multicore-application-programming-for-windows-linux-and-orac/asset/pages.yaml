    \ Inlining Optimization\n\n```\n#include <stdio.h>\n\nint a;\n\nvoid main() {\n\
    \  a = 3;\n  printf(\"The value of a is %i\\n\", a );\n}\n```\n\nAt optimization\
    \ level, most compilers support inlining within the same source file. Hence, the\
