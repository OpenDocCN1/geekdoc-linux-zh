  md: "# Multiprocess Programming\n\nalternative to multithreaded applications is\
    \ multiprocess applications, as suggested in Chapter 1, “Hardware, Processes,\
    \ and Threads.”The main advantage of multiprocess programming is that a failure\
    \ of one process does not cause all the processes to die, and as a result, it\
    \ is possible to recover from such failures.\n\nIt is very easy to start multiprocess\
    \ and have these processes load common initialization parameters from a file or\
    \ the command line to start communicating. However, it is often useful to do this\
    \ programmatically. The UNIX model of process creation is the Fork-Exec model.The\
    \ fork() call makes a process that receives an exact duplicate of the parent’s\
    \ memory.The exec() call replaces the current process with a new executable.The\
    \ calls often go together that one application calls fork() to create a new process;\
    \ then the child immediately calls exec() to replace itself with a new executable.\n\
    \nThe fork() call is interesting because the child and parent processes return\
    \ from this call. The only difference is the return value of the call. The child\
    \ process will return with a value of zero, and the parent process will return\
    \ with process ID of the child.\n\nThe code in Listing 5.55 fork() to create a\
    \ new child process. The child process will execute a sleep command with a parameter\
    \ of 10 so that it will sleep for ten seconds. The parent will wait for the child\
    \ to terminate and report the exit status of the child process. The execcl() is\
    \ used to execute the sleep command. The execcl() calls the path to the executable\
    \ plus the arguments to be passed to that executable, and the first argument should\
    \ be the name of the executable itself.\n\n# Listing 5.55 Using Fork to Create\
    \ a Child Process\n\n```\n#include <unistd.h>\n#include <stdio.h>\n#include <sys/wait.h>\n\
    \nint main()\n{\n    int status;\n    pid_t f = fork();\n    if ( f == 0 )\n \
    \       /* Child process * */\n        execcl(\"/usr/bin/sleep\", \"/usr/bin/sleep\"\
    , \"10\");\n    else\n{\n        waitpid( f, &status, 0);\n        printf(\"Status\
    \ = %i\\n\", status);\n    }\n}\n```"
