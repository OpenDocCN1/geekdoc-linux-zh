    \n# How Dependencies Influence the Ability Run Code in Parallel\n\nDependencies\
    \ within an application (or the calculation it) define whether the application\
    \ can possibly run in parallel. There are two types of dependencies: loop-data-carried\
    \ dependencies and memory-carried dependencies.\n a loop-dependency, the next\
    \ calculation in a loop cannot be performed until the results of the previous\
    \ iteration are known. A good example of this is the loop to calculate whether\
    \ a point is in the Mandelbrot set. Listing 3.4 shows this loop.\n\nListing 3.4\
    \ Code to Determine Whether a Point Is in the Mandelbrot Set\n\n```\nint inSet(double\
    \ ix, double iy) {\n int iterations=0;\n double x = ix, y = iy, x2 = x*x, y2 =\
    \ y*y;\n while ((x2+y2) < 4) && (iterations < 1000) {\n y = 2 * x + iy;\n x =\
    \ x2 - y2 + ix;\n x2 = x * x;\n y2 = y * y;\n iterations++;\n}\n return iterations;\n\
    }\n```\n\nEach iteration of the loop depends on the results of the previous iteration.\
    \ The loop terminates either when 1,000 iterations have been completed or when\
    \ the point escapes a circle centered on the origin of radius two. It is not possible\
    \ to predict how many iterations this loop will complete. There is also insufficient\
    \ work for each iteration of the loop to be split over multiple threads. Hence,\
    \ this loop must be performed serially."
