- pgno: 435
  md: '# Chapter 11. Concluding Remarks


    to introduce overhead. The overhead comes from the increased amount of memory
    needed to hold these locks and the decreased likelihood that the locks will be
    cache resisdent when they are needed.


    However, having few locks usually results in those locks becoming contended by
    multiple threads, which limits the scaling of the application. Therefore, the
    granularity of the locks is some kind of trade-off between a few contended locks
    and many uncontended locks. The appropriate balancing point will depend on the
    number of threads, so it may actually change if the application is run with different
    workloads or with different numbers of threads. Hence, it is important to test
    an application with representative workloads and on a representative system with
    sufficient virtual CPUs.


    The key to picking the optimal locking strategy is a good grasp of the theoretical
    performance of the application, in comparison with the actual profile of the application.
    It is also important to examine the actual scaling of the application as the number
    of threads increases.


    # Parallel Code on Multicore Processors


    For serial codes, there are few differences between running on a single thread
    of a multicore processor and running on a single CPU of a multiprocessor system.
    The differences occur when running a application on a multicore processor compared
    to running the application on a multiprocessor system.


    One of the largest problems for a multiprocessor system is that of nonuniform
    memory latency. An application will get the best performance if it is close to
    the memory where its data lies. Unfortunately, it is too easy for an application
    to be migrated away from its ideal location, resulting in the application experiencing
    an increase in the memory latency and a corresponding drop in performance.


    Although it is possible to get multicore systems that are also multiprocessor
    it is common to have only a single multicore processor. A single multicore processor
    can provide sufficient threads for many parallel tasks. A single multiprocessor
    system also experiences a uniform memory latency, often lower than the latency
    of a multiprocessor system. Migration of threads between cores of a single multicore
    processor has a smaller impact than migration between processors.


    However, the migration of threads between virtual CPUs on the same processor is
    not free of cost; there will be cost if a thread migrates from a virtual CPU where
    it has some data in the first-level cache to one where it does not.


    Threads on the same multicore processor can communicate through shared memory,
    typically either the first or second level of cache. Most synchronization relies
    on memory operations between threads, and using memory that is resident in the
    on-chip caches means that the communication costs between threads are the cost
    of the latency to the shared cache. The latency of on-chip cache is measured in
    cycles; memory latency is usually measured in hundreds of cycles. This low latency
    allows-'
  merge: -1
