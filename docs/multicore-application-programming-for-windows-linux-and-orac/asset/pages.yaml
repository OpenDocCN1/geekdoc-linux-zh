    # ## Restricting the Threads That Execute a Region of Code


    There are situations where it is necessary to restrict the number of threads that
    can execute a block of code. For example, there might be algorithmic reasons why
    only a single thread should execute a region of code. Alternatively, for correctness,
    it is necessary to ensure that only a single thread at a time executes a region
    of code. It may be necessary to restrict the number of threads executing a parallel
    region if there is insufficient work for more threads to complete. This section
    describes multiple ways the number of threads can be restricted.


    # ## Executing a Region of Code Using a Single Thread


    We met the single directive in the section "Using OpenMP for Dynamically Defined
    Parallel Tasks." The single directive specifies that only one thread will execute
    the code in the region. All the other threads will wait for this to be executed
    before continuing. The nowait clause can be used if the other threads should continue
    execution before the single thread completes execution. For an example of the
    single directive, see Listing 7.40.'
