  md: '# 10


    # Other Parallelization

    Technologies


    Previous chapters have dealt with some of the mainstream approaches to developing
    parallel applications. There are many alternative ways of producing applications
    that take advantage of multicore processors. This chapter introduces a number
    of alternative approaches ranging from the use of GPU hardware by OpenCL and CUDA
    to the C++ library provided by Intel''s Threading Building Blocks.


    This chapter also covers some cluster technologies such as MPI. Although running
    a cluster of machines is outside the scope of this text, it is interesting to
    realize that a single machine can now offer an equivalent number of processors
    as might have been found in a cluster few years ago. Although most users may not
    experience using an actual cluster, some of the technologies that are appropriate
    for clusters are now appropriate for single systems.


    By the end of the chapter, you should have a good appreciation for some other
    approaches to parallelization. You will also have understanding of what the strengths
    and weaknesses are for the various approaches and also have knowledge of how to
    write code to exploit the different methods.


    # GPU-Based Computing


    An approach to parallelization that has recently evolved the use of graphics co-processors
    as accelerators for computation. This came about because as the requirements for
    fast and detailed graphical representations evolved, the hardware to implement
    them began to increasingly resemble hardware that could perform parallel floating-point
    or integer computation. Recently, there have been multiple efforts to export the
    ability to perform computation on graphics processing units (GPUs) to common programming
    languages. The most well-known of these are Compute Unified Device Architecture
    (CUDA) and Open Computing Language (OpenCL). CUDA is specific to Nvidia, whereas
    OpenCL is supported on GPUs from both Nvidia and ATI.'
