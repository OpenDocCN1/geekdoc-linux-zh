    Memory is typically allocated with some policy that attempts to place the memory
    used by the thread close to the processor where the thread will run. In instances,
    this will be first-touch placement, which places memory close to the thread that
    first accesses the memory.


    There is a subtle point to be made. The act of allocating memory is often considered
    as the call that the application makes to malloc(). Although this is the call
    that causes an address range of memory to be reserved for the use of the process,
    physical first touch works in situations where the memory is used only by the
    thread that first touches it. If it is initialized by one thread and then utilized
    by another, this is less optimal, because the memory will be located to the thread
    that initialized it and not close to the thread that is using.


