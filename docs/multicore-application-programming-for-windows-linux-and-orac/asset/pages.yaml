    \ a subset of the active variables. In the worst case, it could be resolved by\
    \ both tasks working independently and then having a short bit of code that sets\
    \ the variables to the correct state.\n\n# Using Speculation to Break Dependencies\n\
    \nIn some instances, there is a clear potential dependency between different tasks.\
    \ This dependency means it is impossible to use a traditional parallelization\
    \ approach where the work is split between the two threads. Even in these situations,\
    \ it is possible to extract some parallelism at the expense of performing some\
    \ unnecessary work. Consider the code shown in Listing 3.10.\n\nListing 3.10 Code\
    \ with Potential for Speculative Execution\n\n```\nvoid doWork( int x, int y )\n\
    {\n  int value = longCalculation( x, y);\n  if (value > threshold)\n  {\n    return\
    \ value + secondLongCalculation( x, y);\n  }\n  else\n  {\n    return value;\n\
    \  }\n}\n```\n\nIn this example, it is not known whether the second calculation\
    \ will be performed until the first one has completed. However, it would be possible\
    \ to speculatively compute the second calculation at the same time as the first\
    \ calculation is performed. Then depending on the return value, either discard\
