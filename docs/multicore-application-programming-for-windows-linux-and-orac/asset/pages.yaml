    which points to the region of memory where the parameters to the function are
    held. In contrast, the SPARC code passed the parameters to functions in registers.
    The method of passing parameters is called the calling convention, and it is part
    of the application binary interface (ABI) for the platform. This specification
    covers how programs should be written in order to run correctly on a particular
    platform.


    Both the snippets use a single register to hold the address of the memory being
