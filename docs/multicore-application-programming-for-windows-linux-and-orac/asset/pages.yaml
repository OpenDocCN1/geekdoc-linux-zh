    As mentioned previously, the code uses an event object to ensure that the server
    thread starts before the client thread sends a request. The event is created through
    a call to CreateEvent(). The event is created unsigned so it can be signaled by
    the server thread, and this signaling will allow the client thread to progress.
    The event is set to require a manual reset that once it has been signaled, it
    remains in that state. This ensures that any later client threads will not block
