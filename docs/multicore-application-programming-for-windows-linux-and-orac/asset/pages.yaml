    \nFigure 9.5 Scaling of two different implementations of malloc() and free ()\n\
    \nThere is an interesting, though perhaps not surprising, observation to be made\
    \ from the performance of the two implementations of malloc() and free (). For\
    \ the single-threaded case, the default malloc() provides better performance than\
    \ the alternative implementation. The algorithm that provides improved scaling\
