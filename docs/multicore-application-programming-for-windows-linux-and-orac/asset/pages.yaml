    libraries is a critical factor in managing the start-up time of an application.


    # The Impact of Data Structures on Performance


    Data structure is probably what most people think first when they hear the word
    structure within the context of applications. Data structure is arguably the most
    critical structure in the program since each data structure will be accessed millions
    of times during the run of an application. Even a slight gain in performance here
    can be magnified by the number of accesses and become significant.


    When an application needs an item of data, it fetches it from memory and installs
    it in cache. The idea with caches is that data is frequently accessed will become
    resident in the cache. The cost of fetching data is substantially lower than the
    cost of fetching it memory. Hence, the application will spend less time waiting
    for frequently accessed data to be retrieved from memory. It is important to realize
    that each fetch of an item of data will also bring adjacent items into the caches.
    So, placing data that is likely to be used nearly the same time in close proximity
    will mean that when one of the items of data is fetched, the related data is fetched.'
