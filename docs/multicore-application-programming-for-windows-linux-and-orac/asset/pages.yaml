    the same amount of work is performed, regardless of the number of threads used.

    This indicates that the poor scaling is not the result of the threads having to
    perform an increasing amount of work. If the amount of work is not increasing,
    it suggests that the scaling problems are the result of work being poorly distributed
    between the threads.


    Figure 7.1 shows the timeline of work from the Solaris Studio Performance Analyzer
    running with two threads. This view shows the activity of the two threads over
    the entire duration of the run. There are three lines. The top line shows the
    activity of all the threads in the application. This shows that initially both
    threads were running entirely in user mode, and around 8 seconds into the run,
    only one of the two threads in user mode while the other thread was idle.


    ![](img/9337ae7b0be66cc11725becaa009908f_312_0.png)


    Figure 7.1 Timeline of Mandelbrot code with two threads


    The other two lines indicate the activity of the two threads. The top one shows
    that the master thread was active over the entire duration of the run, as is to
    be expected by the OpenMP execution model. The second thread was active only during
    the first 8.5 seconds of the run. This confirms that the poor scaling is because
    of an unequal distribution of work between the two threads.


    It is easy to understand where this workload imbalance comes when the actual image
    being computed. Figure 7.2 shows the image that is computed. One thread is computing
    the left half, the other right half. For a large number of points, colored black
    in the image, it takes only a few iterations to determine that the point is not
    in the set. However, it takes the maximum limit on the iteration count to determine
    that a point is in, or might be in the; these points are colored white.


    The areas that are shaded black in the figure take relatively few iterations and
    therefore take some time to compute. Comparing the left half and right halves
    of the image, it is apparent that the right half contains more black pixels than
    the left half. This means that the thread computing the right half will take less
    time than the thread computing the left half. This is the source of the workload
    imbalance between the two threads.


    Fixing the workload imbalance is relatively easy since it is just a matter of
    the scheduling clause for the parallel code. Either dynamic or guided scheduling
    could be used. Listing 7.67 shows the code modified to use dynamic scheduling.'
