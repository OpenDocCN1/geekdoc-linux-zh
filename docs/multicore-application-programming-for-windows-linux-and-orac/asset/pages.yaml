  md: "# Setting the Attributes for Pthreads\n\nThe attributes for a thread are set\
    \ when the thread is created. Some attributes, such as the detached state, can\
    \ be modified once the thread exists, but others cannot be changed. To set the\
    \ initial thread attributes, first create a thread attributes structure, and then\
    \ set the appropriate attributes in that structure, before passing the structure\
    \ into the pthread_create() call. Once the attributes used to set up a thread,\
    \ they can be destroyed by pthread_attr_destroy(). Listing 5.8 shows the basic\
    \ outline of this.\n\nListing 5.8 Passing Attributes to pthread_create\n\n```\n\
    #include <pthread.h>\n...\n\nint main()\n{\n  pthread_t thread;\n  pthread_attr_init(&attributes);\n\
    \  pthread_create(&thread, &attributes, child_routine, 0);\n  pthread_attr_destroy(&attributes);\n\
    }\n```\n\nThere are various attributes that can be set using API calls. The most\
    \ useful ones determine whether the thread is created in the detached or joinable\
    \ state, as well as the size of the stack allocated to the new thread.\n\nA thread\
    \ can be created as either a detached or a joinable thread. The default is to\
    \ create a joinable thread. The code in Listing 5.9 sets the attributes to create\
    \ a detached thread.\n\nListing 5.9 Creating a Detached Thread\n\n```\n#include\
    \ <pthread.h>\n#include <stdio.h>\n\nvoid* child_routine(void * param)\n{\n  int\
    \ id = (int)param;\n  printf(\"Thread %d\\n\", id);\n}\n\nint main()\n{\n  pthread_t\
    \ thread;\n```"
