  md: '# Using POSIX Threads


    The POSIX¹ standards specify the coding standards for portable UNIX applications.
    Most UNIX and UNIX-like operating systems adhere to the key features of these;
    hence, an application coded to the standards will be portable UNIX implementations
    and UNIX-like systems, such as Linux and FreeBSD, and Mac OS, which is also based
    on a UNIX-like kernel. Microsoft Windows does not implement the POSIX standards
    directly, although there are some solutions that enable programs using POSIX interfaces
    to run on Windows platforms.


    This chapter will discuss how to write multithreaded programs using the POSIX
    standard interfaces. These enable an application to create new threads and synchronize
    data between threads and processes.


    # Creating Threads


    An application initially starts with a single thread, which is often referred
    to as the main thread or the master thread. Calling pthread_create creates a new
    thread. It takes the following parameters:


    +   - A pointer to a pthread_t structure. The call will return the handle to the
    thread in this structure.

    - A pointer to a pthread attributes structure, which can be a null pointer if
    the default attributes are to be used. The details of this structure will be discussed
    later.

    - The address of the routine to be executed.

    - A value or pointer to be passed into the new thread as a parameter.


    Listing 5.1 shows how this API call can be used.'
