    \ the value stored in the array. Imagine that either the store or the load was\
    \ nonatomic. If an element was transitioning from holding the value zero to holding\
    \ a nonzero value, then a nonatomic load might get the older half of the value\
    \ (which would be zero) and the new lower half of the value (which would be nonzero).\
    \ The resulting value would be incorrect.\n\nThe requirement for ordering stores\
    \ is that the code removes elements from the array. The location containing the\
    \ element to be removed is zeroed out, the pointer to it is advanced to the next\
    \ location in the array. If these actions become visible to the producer in the\
    \ wrong order, the producer would see that the end point had been advanced. This\
    \ would allow it to enter the code that adds a new element. However, this first\
    \ test code performs to check that the new location is really empty. If the store\
    \ of zero to the released array position was delayed, this location would still\
    \ contain the old value, and the code would exit with an error. The code is \"\
    logically\" unnecessary but validates that the code is behaving.\n\nSeveral characteristics\
    \ of the algorithm enable it to work correctly. There are two points to locations\
