- pgno: 24
  md: '# The Motivation for Multicore Processors


    The compute performance characteristics of the system are basically derived from
    the performance of the processor and memory. These will determine how quickly
    the machine is able to execute instructions.


    The performance characteristics of peripherals tend to be of less interest because
    their performance is much lower than that of memory and processor. The amount
    of data that processor can transfer to memory is measured in gigabytes. The amount
