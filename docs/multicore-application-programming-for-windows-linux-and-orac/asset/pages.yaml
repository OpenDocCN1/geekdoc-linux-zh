    is a reduced instruction set computer (RISC), meaning it has a small number of
    simple instructions, and all operations must be made up of these simple building
    blocks. x86 is a complex instruction set computer (CISC), so it has instructions
    that perform more complex operations. The x86 instruction has a single instruction
    that adds increment to a value at a memory location. In the example, the instruction
    to add 1 to the value at the address held in register %eax is this single CISC
    instruction, which contrasts with three RISC instructions on the SPARC side to
    achieve the same result.


