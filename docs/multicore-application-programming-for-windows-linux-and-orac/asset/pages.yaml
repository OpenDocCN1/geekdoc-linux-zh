  img_proc: true
- pgno: 126
  md: 'If we split these into separate tasks, we can handle a packet every 1ms, so
    throughput will have doubled. It will also improve the responsiveness because
    we will handle each packet within 1ms of arrival, rather than within 2ms. However,
    it still takes 2ms for the handling of each packet to complete, so the throughput
    of the system has doubled, but the response time has remained the same. Figure
    3.16 shows this situation.


    ![](img/9337ae7b0be66cc11725becaa009908f_126_0.png)


    Figure 3.16 Using two threads to perform packet forwarding and log writing


    # Multiple Copies of the Same Task


    An easy way to complete more work is to employ multiple copies of the same task.
    Each individual task will take the same time to complete, but because multiple
    tasks are completed in parallel, the throughput of the system will increase.

    This is a very common strategy. For example, one system might running multiple
    copies of a rendering application in order to render multiple animations. Each
    application is independent and requires no synchronization with any other.

    Figure 3.17 shows this situation, with a single system running three copies of
    task A.


    ![](img/9337ae7b0be66cc11725becaa009908f_126_1.png)


    Figure 3.17 Multiple copies of a single task'
