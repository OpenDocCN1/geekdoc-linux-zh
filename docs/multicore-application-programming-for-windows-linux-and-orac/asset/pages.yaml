  md: '# Using Automatic Parallelization and OpenMP


    Previous chapters have covered low-level approaches to creating processes or threads
    and sharing data between them them. Fortunately, many approaches enable the developer
    to focus on higher levels of application design and leave the mechanics of managing
    threads and sharing data to runtime libraries and the compiler. In an ideal case,
    the compiler manages everything, identifying parts of the code to run in parallel
    providing the mechanisms to support parallelism. However, without some help from
    the developer, current compiler technology rarely be able to exploit all the parallelism
    in an application. The most commonly used and commonly available language extension
    for parallelism is the OpenMP API.


    The OpenMP specification defines an API that enables a developer to produce their
    serial version of the application. This chapter describes both automatic parallelization
    provided by many compilers and how the OpenMP API can produce parallel applications
    from serial codes.


    # Using Automatic Parallelization to Produce a Parallel Application


    Most compilers are able to perform some degree of automatic parallelization. In
    an ideal world, automatic parallelization would be just another compiler optimization,
    but currently there are significant limitations on what can be achieved. This
    is an area that will improve in time. However, in many instances, it is possible
    to assist the compiler in making the code parallel.


    In this section, we will explore the ability of both the Oracle Solaris Studio
    and Intel compilers to perform automatic parallelization. As well as the ability
    to perform automatic parallelization, it is also important for the compilers to
    provide feedback'
