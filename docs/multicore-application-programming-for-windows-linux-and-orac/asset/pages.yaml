  md: '# Chapter 5 Using POSIX Threads


    The use of sockets is different from other communication mechanisms because the
    client has different responsibilities than the server connected to the socket.
    So, it is appropriate to tackle the client and server as two entirely separate
    applications.


    The first thing that any process that uses sockets has to request a socket. The
    socket is a potential connection to the network. The call to `socket()` takes
    three parameters: the family of socket requested, the type of socket within that
    family, and the protocol. The protocol should be set to zero to indicate that
    the default protocol should be `AF_INET` or `AF_INET6`, and the protocol type
    for these families is either `SOCK_STREAM` for TCP/IP or `SOCK_DGRAM` for UDP/IP


    Once a socket has been established, it is necessary to connect it to an address.
    We can illustrate this by initially working through the code to write a server
    process that waits for a connection from a client, before discussing the code
    that would be found in such a client. This makes because the two scenarios have
    little code in common.


    A server will `bind()` with the address of the local host and the port on which
    it will listen for connections. The function `bind()` takes as parameters the
    previously established socket, a pointer to structure containing the details of
    the address to bind to, the value `INADDR_ANY` is typically used for this, and
    the size of the structure. The particular structure that needs to be used will
    depend on the protocol, which is why it is passed by the pointer.


    Once a server has been bound to an address, the server can call `listen()` on
    the socket. The parameters to this are the socket and the maximum number of queued
    connections as a parameter.


    After a call to listen, the server can `accept()` for a connection from a client
    calling `accept()`. The parameters to this are the socket, an optional pointer
    to a socket address structure, and the size of the structure. If the pointer to
    the socket address structure is not zero, the call to `accept()` will write details
    of the client into the socket address structure. The call will return a new socket
    descriptor that is the connection to the client.


    The server can read or write to the socket until the connection is terminated
    by either the client or the server calling `close()` on the new socket.


    Data can be sent through the socket using the `write()` or the `send()` call.
    The `send()` affords additional flexibility in sending data. Similarly, data can
    be received from the socket using either the `read()` or `recv()` call. A socket
    that has been closed is identified by a return of an error from the calls.


