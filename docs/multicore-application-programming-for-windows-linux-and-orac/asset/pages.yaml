  md: "# Using OpenMP to Produce a Parallel Application\n\ncally.The schedule(runtime)\
    \ clause enables the environment variable OMP_SCHEDULE to determine the type of\
    \ schedule used.\nStatic scheduling can also take an optional chunk size parameter.\
    \ If a chunk size is specified for static scheduling, the work is split into equal\
    \ units of the specified chunk size. These are distributed round-robin to the\
    \ worker threads. This may mean that some workers have no work assigned to them\
    \ or some threads end up with more chunks of work than others. In the absence\
    \ of a specified chunk size, the work is divided evenly over all the threads.\n\
    \n# Using Parallel Sections to Perform Independent Work\n\nOpenMP parallel sections\
    \ provide another way to parallelize a code into multiple independent units of\
    \ work that can be assigned to different threads. Parallel sections allow the\
    \ developer to assign different sections of code to different threads. Consider\
    \ a situation where in the process of being initialized an application needs to\
    \ set up two linked lists.\n 7.36 shows an example.\n\nListing 7.36 Using Parallel\
    \ Sections to Perform Independent Work in Parallel\n\n```\n#include <stdlib.h>\n\
    \ntypef struct s {\n    struct s* next;\n};\n\nvoid setuplist( S *current) {\n\
    \    for(int i=0; i<10000; i++)\n    {\n        current->next = (S*)malloc(sizeof(S));\n\
    \        current = current->next;\n    }\n    current->next = NULL;\n}\n\nint\
    \ main() {\n    S var1, var2;\n    #pragma omp parallel sections\n    {\n    \
    \    #pragma omp section\n        {\n            setuplist(&var1); // Set up first\
    \ linked list\n        }\n        #pragma omp section\n```"
