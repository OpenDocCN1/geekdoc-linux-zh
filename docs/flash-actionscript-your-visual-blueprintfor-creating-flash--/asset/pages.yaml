  md: '# FLASH ACTIONSCRIPT QUICK REFERENCE


    # BUTTON HANDLERS


    You use handlers to instruct Flash how to respond when the user clicks, moves
    the mouse, or interacts in other way with a button. The table below lists button
    handlers and their purpose.


    | HANDLER | PURPOSE |

    | --- | --- |

    | on(release) | Performs specified actions when the pointer is over the button
    and the user releases the mouse. This is the default handler. |

    | on(press) | Performs specified actions when the pointer is over the button and
    the user presses the mouse. |

    | on(releaseOutside) | Performs specified actions when the user drags the pointer
    outside the button area and releases the mouse. |

    | on(rollOver) | Performs specified actions when the user rolls over the button.
    |

    | on(rollOut) | Performs specified actions when the user rolls the pointer over
    and outside of the button area. |

    | on(dragOver) | Performs specified actions when the user clicks the button, drags
    the pointer away from the button, and then drags the pointer back over the area.
    |

    | on(dragOut) | Performs specified actions when the pointer is over the button
    and the user presses the mouse and drags the pointer outside the area. |

    | on(keyPressed, "key") | Performs specified actions when the user presses a specified
    key. |


    # MOVIE CLIP HANDLERS


    You use movie clip handlers to instruct Flash how to respond when the user loads
    or reloads a movie clip, enters a frame, moves the mouse, or contracts in some
    other way with a movie clip. The table below lists movie clip handlers and their
    function.


    | HANDLER | PURPOSE |

    | --- | --- |

    | onClick(load) | Performs the specified actions when the movie clip appears on
    the Timeline. This is the default handler. |

    | onClick(unload) | Performs the specified actions in the first frame after you
    remove the movie clip from the Timeline. |

    | onClick(enterFrame) | Performs the specified actions as frames play. |

    | onClick(mouseDown) | Performs the specified actions every time the user moves
    the mouse. |

    | onClick(mouseDown) | Performs the specified actions when the user presses the
    mouse. |

    | onClick(mouseUp) | Performs the specified actions when the user releases the
    mouse. |

    | onClick(keyDown) | Performs the specified actions when the user presses any
    key. |

    | onClick(keyUp) | Performs the specified actions when the user releases any key.
    |

    | onClick(data) | Performs the specified actions when ActionScript receives data.
    |'
