  md: '# USING THE SOUND OBJECT (CONTINUED)


    You use the start method to play your sound. The syntax for the Sound.start method
    is


    ```

    soundName.start(secondoffset, offset);

    ```


    Use the idName argument to specify the name of the Sound object. The secondOffset
    argument to specify the point at which you want to sound. If you have a 20-second
    sound and you use a secondOffset of 10, the sound will start playing in the middle
    of the sound. Note that playback does not delete the first 10 seconds, but instead
    starts the sound at the 10-second mark. The secondOffset argument is optional.
    Use the loop argument to specify the number of times the sound should loop.


    Use the idName argument to specify the name of the sound you want to stop. Enclose
    the idName in quotes. The idName argument is optional. If you do not specify an
    idName, all sounds stop.


    You can also use the stopAllSounds action to stop the sounds. Set streaming to
    resume when the playhead moves over. The syntax for the stopAllSounds action is


    ```

    stopAllSounds();

    ```


    The stopAllSounds action does not take any arguments.


    In Flash, you can play multiple sounds at the same time. You can play background
    music while a narrator narrates your video. You can start a sound in a frame or
    using the button or movie clip. This means you can stop the sound with a button,
    when the user hovers over or enters a frame.


    Once you have started your sound, you use the stop argument to stop. The syntax
    for the stop argument is


    ```

    soundName.stop("idName");

    ```


