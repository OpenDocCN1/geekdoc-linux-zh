  md: '# FLASH ACTIONSCRIPT


    # # ROUND ROUNDS


    You can use the Math.round to round a number to an integer. Use the syntax for
    the Math.round method is Math.round(x): Use the argument x to specify the number
    you want. If the value after the decimal point is 0.5 or higher, the round method
    rounds up. If the decimal point is lower than 0.5, the round method rounds down.


    The Math.round, Math.ceil, and Math.floor methods all round your number to the
    nearest integer. If you want to round your number to one, two, or three decimal
    places, you can multiply the number by 10, round the number, and then divide the
    result by 10. If you want two decimal places, multiply the number by 100 and divide
    by 100. If you want three decimal places, multiply by 1000 and divide by 1000.


    If you want to round regardless of the value after the decimal point, use the
    Math.ceil method. The syntax for the Math.ceil method is Math.ceil(x): Use the
    argument x to specify the number you want. The statement Math.ceil(123.01) returns
    124.


    If you want to round regardless of the value after the decimal point, use the
    Math.floor method. The syntax for the Math.floor method is Math.floor(x): Use
    the argument x to specify the number you want. The statement Math.floor(123.99)
    returns 123.


    # Extra


    Math.round returns the following values:


    | TYPE: | RESULT |

    | --- | --- |

    | roundNumber = math.round(123.50) | 124 |

    | TYPE: | RESULT |

    | roundNumber = math.round(123.49) | 123 |


