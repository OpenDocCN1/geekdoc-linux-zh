  md: '# LOAD VARIABLES


    The loadVariables action reads data from an external file. This is useful when
    you need to read data from a file or you are working with data from CGI, Active
    Server Page (ASP), or Personal Home Page (PHP) script. Your file and the data
    must be located in the same subdomain unless you are accessing the data from a
    Web browser.


    Use variableName to specify the name of the variable. Use value to specify the
    value you are assigning to the variable. Separate each variable/value pair with
    &. The variable names in your text file must match the names in your movie.


    The syntax for loadVariables is loadVariables(url, location, variables); The url
    argument is used to specify the absolute or relative URL of the file containing
    the variables you want to load. The location argument is used to specify the level
    or target path that will receive the variables. For more information on levels
    and targets, see page 224. The variables argument is used to specify the method
    you want to use. Choose get or post.


    Certain characters cannot be read directly from a text file. You must use URL
    encoding for these characters. For example, if your file includes temperature=+15,
    ActionScript will read it as temperature=15, dropping the plus. Plus, use URL
    encoding for the & and % with %26 and %25. To avoid ActionScript reading the data
    entry correctly, see Chapter 14 for the URL encoding details.


    ActionScript needs to subscribe to loadVariableNum. If you are entering your script
    using the Normal mode, this is done automatically. See the appendix for more information
    on loadVariable and loadVariableNum.


    Set up the data you want to load by entering it in the following format: variableName=variableName&variableName=value...


    ![](img/72fce958343eeb5d6d0322213ea85399_109_0.png)


    +   Select the frame, button, or movie clip which you want to add ActionScript.


