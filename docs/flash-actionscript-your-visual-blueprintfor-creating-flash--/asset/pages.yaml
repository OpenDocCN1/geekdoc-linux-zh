  md: '# FLASH ANSCRIPT


    # PUBLISH MOVIES


    Publishing your movie enables you to present it to your audience. You can present
    your movie in several formats a Flash movie for the Web; a GIF, JPEG, or QuickTime
    animation; an HTML document; or as a stand-alone executable for Windows or Macintosh.


    Selecting Generate Size Report creates a TXT file containing detailed information
    on the size of each frame, scene, and object in your movie. Omit Trace Actions
    causes Flash to ignore trace actions included in your movie. Refer Chapter 13.
    When you save your movie, Flash assigns the movie as an FLA extension. When you
    publish your movie, as a Flash movie for the Web, Flash assigns the movie as a
    SWF extension. From Import prevents others from importing your SWF file and converting
    it to an FLA file.


    You use the Publish Settings dialog box to publish your movie. You choose the
    formats. Flash assigns a default name. You can use the default name or assign
    an assigne.


    When publishing your movie for the Web, you can select several options including
    the order in which the layers load. The Layer order controls which layer Flash
    Player draws when the player uses the movie over a slow modem or network connection.
    Additionally, you can select the following options: Generate Size, Report Trace
    Actions,ing, Importing, and Debugging Permitted.


    A JPEG quality slider is also available and enables you to adjust the quality
    of JPEG graphics — the higher quality the larger size.


