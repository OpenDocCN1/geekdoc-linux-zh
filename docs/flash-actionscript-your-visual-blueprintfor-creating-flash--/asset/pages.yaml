  md: '# FLASH ACTIONSCRIPT


    # GET BOUNDS


    If you have placed a movie clip on the Stage or you have added a movie clip to
    the Stage using the duplicateMovieClip action for it. You now want to place another
    movie clip to the left, right, or above the movie. You can use the getbounds method
    to obtain the coordinates of a movie clip that is on the Stage. You can then position
    another movie clip in a position relative to the original clip. The getbounds
    method returns the clip coordinates and allows you to position objects on the
    Stage.


    To use the MovieClip argument to specify the movie clip whose coordinates you
    want to obtain. Use the targetCoordinateSpace argument to specify the target path
    of the coordinates you want to use as a point of reference. The getbounds method
    returns an object with xmin, xmax, ymin and ymax properties. The xmin property
    represents the left edge of the movie clip, the xmax property represents the right
    edge, the ymin property represents the top edge, and the ymax property represents
    the bottom edge.


    You may also know the boundaries of a movie clip so that you can trigger an action
    when the mouse comes within a certain distance of a movie clip. For example, you
    could make a pumpkin glow if the mouse comes within 15 pixels of the pumpkin.


    To obtain the xmin, xmax, ymin and ymax properties, assign the results of the
    getbounds method to a variable. Then proceed the property with the variable name
    followed by a dot.


    The syntax for MovieClip.getbounds method is MovieClip.getbounds(targetCoordinateSpace);


