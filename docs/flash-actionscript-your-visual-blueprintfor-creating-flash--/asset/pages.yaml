  md: '# FLASH ACTIONSCRIPT


    # CREATE GRAPHICS


    Flash provides you with several tools you can use to create or modify graphics.
    Use the Line tool to create straight lines, the Oval tool to create circles and
    ellipse, and the Rectangle tool to create squares and rectangles. Use the Paint
    Bucket and Brush tools to add color to images.


    The Pen tool gives you the ability to draw straight lines and smooth curves. Use
    the Select tool to select objects without lines. Strokes outline a graphic. Use
    the Ink Bottle tool to change the stroke color, width, or style. Flash fills the
    color of a graphic. Use the Dropper tool to copy and fill attributes from one
    object to another. The Eraser tool gives you the ability to erase.


    You can use the Arrow and Lasso tools to select objects on the Flash Stage. You
    can group, move, copy, or select objects. Grouping enables you to manipulate several
    objects as a single object. You use the Arrow tool to select a button or movie
    clip when you want to associate ActionScript with a button or movie clip.


    Flash has modifiers you can use to set tool options. Color boxes enable you to
    set the stroke and fill colors associated with selected area. You can change the
    stroke and fill colors the color to color or set the colors to the default colors.
    The Arrow tool provides you with options for smoothing, straightening, and rotating
    objects. The Rectangle tool provides an option for rounding corners. You can change
    the size and shape of the Brush. The Eraser offers several methods and a shortcut
    that enables you to erase the selected area. With the Pencil, you can choose to
    have straight lines, smooth lines, or free-form lines.


    ![](img/72fce958343eeb5d6d0322213ea85399_21_0.png)


    +   1 Click to select a tool.


    +   2 Click to select modifiers.


    +   3 Move to the Stage and drag to create a shape.


    +   You can create a square with or or a circle with by holding the Shift key
    as you drag.


    +   You can create rectangles with the Rectangle tool, ellipses with the Oval
    tool, straight lines with, paint with the Brush tool, or free-form lines with
    the Pencil tool, or you can erase with the Eraser tool.'
  merge: -1
