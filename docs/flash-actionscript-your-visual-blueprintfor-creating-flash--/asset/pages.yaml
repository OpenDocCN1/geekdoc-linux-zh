  md: '# THE DATE OBJECT


    Flashplayer uses the system clock on the computer running Flashplayer to retrieve
    the date and time. You can use the information retrieved to perform many types
    of arithmetic, including the calculation of elapsed time and the calculation of
    the time between two dates.


    Use the getMonth() method to retrieve the current month based on local time. Use
    the getUTCMonth() method to retrieve the current month based on Universal Coordinated
    Time. The getMonth() and getUTC() methods return an integer from 0 to 11. The
    value represents January, February, and so on.


    Before calling date, you must use the new Date constructor to create an instance
    of the Date object. Use the syntax object = new Date(); Use the object variable
    to name the Date object.


    Use the getDate() method to retrieve the day of the month based on local time.
    Use the getUTCDate() method to retrieve the current day based on Universal Coordinated
    Time. The getDate() method returns an integer from 1 to 31, representing the day
    of the month.


    ActionScript provides several methods you can use to retrieve date and time values
    using object.method(); Use the argument to specify the Date object. Use the method
    argument to specify the method you want to use.


    Use the getYear() method to retrieve a four-digit number representing the year
    based on local time. The getUTCFullYear() method to retrieve a four-digit number
    representing the year based on Universal Coordinated Time.


    Some and date methods retrieve the local date and time. Other methods retrieve
    the time based on Greenwich Mean — also referred to as Universal Coordinated Time.


