    Script divides data types into two categories: primitive and reference. Strings,
    numbers, and Booleans are primitive data types. A variable that contains a primitive
    data type stores the value that has been assigned to it. Primitive types do not
    update when changes are made to the assigning value. Each time the last assignment
    occurs updates, for example, a = 10; b = 30; In this example, b is equal to 10.
    The value of b remains 10 even though the value of a has changed to 30. This is
    b contains the value at the time of assignment. Changes to a do not automatically
    update b.


