  md: '# CREATE A CONDITIONAL LOOP


    When you need to execute ActionScript statement or a series of ActionScript statements
    several times, you can use the while action enables you to run statements repeatedly.
    The syntax for while action is

    while(condition) {

    statement;

    }


    The while loop must include a statement that changes the condition and the condition
    must eventually evaluate to false, or the loop will continue infinitely. Programmers
    refer to this situation as a loop. Often, you can use the increment operator with
    a loop and the loop continue for as long as a value is less than the specified
    amount. The example uses the increment operator to increase the value after each
    execution of the statements. For more on the increment operator, Chapter 5.


    The condition is an expression that evaluates to true or false. The statement
    is an instruction to execute if the condition is true. When ActionScript encounters
    the action evaluates the condition. If the condition is true, all the statements
    have been executed, ActionScript returns to the while and executes the condition
    again. If the condition is still true, it executes the first statement after the
    action.


    ```

    x = 0

    while (x < 10) {

    statement;

    ++;

    }

    ```


    ![](img/72fce958343eeb5d6d0322213ea85399_155_0.png)


