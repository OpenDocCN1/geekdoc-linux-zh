    for evaluation. If it is not an index value of 1, the third error is sent to the
    user.


    When using the string.charAt method, proceed the the word charAt with a string
    from which you want to retrieve a character by a period. Place the index of the
    character you want enclosed in parentheses followed by a period. How do you determine
    the index position? Starting from the left, the first character in a string has
    an index value of 0, the second character has an index value of 1, and so on.
    In example


    ```

    x = "abcdef".charAt(2)

    ```


    The letter a has an index of 0, the letter b has an index of 1, and the letter
    c has an index of 2.


    When using string.charAt, if you enter an index position that is not a number
    from 0 to the last index in the string, ActionScript will return an empty string.


    You use the string.charCodeAt to retrieve the code for the character at a specified
    location in a string. The value returned is an integer from 0 to 65535. The string.charAt
    and the string.charCodeAt method are the same, except the string.charCodeAt returns
    a code of the character


