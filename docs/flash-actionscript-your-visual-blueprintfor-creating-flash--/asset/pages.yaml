    # CHECK MOVIECLIP LOAD


    You have created movie clips A and B. Movie clip B is a large movie clip. You
    not want to load clip B into movie clip A. You do not want movie clip B to begin
    playing until it is completely loaded. Use the getBytesTotal to determine the
    size of movie clip B in bytes. Use the getBytesLoaded to obtain the number of
    bytes loaded by movie clip. When getBytesTotal equals getBytesLoaded, start movie
    clip B.


    obtain the bytes loaded or the total number of bytes. Together, getBytesTotal
    and getBytesLoaded enable you to monitor the progress of loading a movie clip.
    Note that it is not always necessary to wait for a movie clip to load completely
    before it starts. You can specify the exact number of bytes that need to load
    before starting a movie clip.


    Use the getBytesLoaded and getBytesTotal methods with movie clips that have been
    loaded - not with movie clips that are internal to the movie. If you use these
    methods with movie clips that are internal to the movie, the value for getBytesLoaded
    and getBytesTotal will be identical, because movie clips load automatically.


    The syntax for the MovieClip.getBytesLoaded method is


    ```

    MovieClip.getBytesLoaded();

