  md: '# STOP A MOVIE


    As soon as you load a Flash movie, it begins to play and continues to play unless
    you stop it. You can use the stop action to stop a movie. The syntax for the stop
    action is


    ```

    stop();

    ```


    The stop action does not take any arguments, so it has no parameters. You can
    use the stop action to stop the main Timeline or to stop a movie. If you want
    to stop the Timeline, simply use a stop action. If you want to stop a movie, the
    movie clip must be on the Stage, it must have an instance name, and you must target
    the movie clip. A name movie clip in the Instance panel. For more


    naming movie clips, see Chapter 1. Targeting a movie clip means you designate
    the movie clip on which you want ActionScript to perform an action. For more about
    targeting movie clips, see Chapter 10.


    You can stop a movie or movie clip at any point. Movies begin playing as soon
    as they load. You can stop a movie in the first frame and have user press a button
    when you are ready to start. Or you can stop a movie at the end of a frame and
    create buttons to determine the next scene to play. You can use the stop action
    to any button, frame or movie clip, however you will frequently use the stop action
    when you want to use buttons to control the action.


