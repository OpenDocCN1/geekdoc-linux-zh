  md: '# ASSIGN TARGET PATHS


    Flash defines a target path as the address of the Timeline you want to target.
    There are two types of target paths: absolute and relative. An absolutepath is
    a fixed address; it is always the same. A relativepath identifies the relative
    path based on the Timeline that calls it.


    triangleMC at the Timeline of the movie clip redMC, the absolute path to triangleMC
    would be _level1.redMC.triangleMC.


    There are two methods used to specify a target path: dot and slash syntax. Dot
    syntax separates each item in the path with a dot, _level0.redMC.triangleMC. Slash
    syntax separates each item in the path with a slash, _level0/redMC/triangleMC.


    ActionScript bases both absolute and relative target paths on the movie hierarchy.
    You can view the movie hierarchy using the Explorer list. An absolute path begins
    with the name of the level movie clip was loaded into and the name of each instance
    until it reaches the target. For example, if you place a movie clip with the name
    redMC on the main Timeline, the absolute path to redMC would be _level0.redMC,
    if you add an instance


    ActionScript bases a path on the relationship between the controller Timeline
    and the target Timeline. Use the only a relative path to target objects on the
    same level. A _parent path refers to the parent of the current Timeline. When
    using slash, use . to move up the hierarchy.


