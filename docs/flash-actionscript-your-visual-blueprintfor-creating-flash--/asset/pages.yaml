  md: '# USING THE SOUND OBJECT


    You can use sound to create characters that talk, narrate a movie, or play background
    music. Sound methods enable you to turn on and off, increase or decrease volume,
    or determine which sound plays. There are four steps to create sound using ActionScript.
    You name the sound and the sound export, create a Sound object, attach the sound,
    and then use it.


    Use the target argument to specify the movie clip instance to which the Sound
    object applies. If you do not specify a target, the Sound object controls all
    of the sounds on the global Timeline. If you want to control each sound independently,
    place each sound in a separate movie clip. Use the SoundName argument to specify
    the name of the Sound object.


    You name and set the sound export using Symbol Linkage Properties dialog. You
    access the Symbol Linkage Properties dialog through the Options menu of the Library.
    In the Symbol Linkage Properties dialog box, click Export to Symbol, and use the
    Identifier name to find the sound.


    Use the attachSound to create an instance of the sound. The syntaxes for the attachMethod
    is `soundName.attachSound("idName")`.


    You construct the new to create a Sound object. The syntax for the new Sound constructor
    is


    Use the SoundName argument to specify the name of the Sound object. Use the idName
    argument to specify the name of the new instance. In quotes you must specify the
    idName you gave to the Identifier field of the Symbol Linkage Properties dialog
    box.


    ```

    soundName = new Sound(target);

    ```


    ![](img/72fce958343eeb5d6d0322213ea85399_217_0.png)


