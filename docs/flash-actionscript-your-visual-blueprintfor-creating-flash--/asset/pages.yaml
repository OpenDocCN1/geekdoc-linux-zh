  md: '# USING THE OUTPUT WINDOW


    The Output window is part of the test environment. The Output window displays
    information to help you troubleshoot your movie. If you have syntax errors in
    your movie, error messages displays automatically when you enter the test environment.
    Errors help locate problems with your script.


    You can use trace action to evaluate an expression. This is useful when you are
    debugging your movie and you need to know what an expression returns. The results
    of the trace action displays in the Output window. The syntax for the trace action
    is


    ```

    trace(expression);

    ```


    Use the expression argument to specify the expression that you want to evaluate.
    For example, the following script increments the value of x each time the user
    clicks a button and sends the results to the Output window:


    ```

    (on release)

    trace(++x);

    ```


    The Output windows Menu provides you with options that enable you to copy the
    contents of the Output window to the clipboard, clear the Output window, save
    the contents of the Output window to a file, or print the contents of the Output
    window. Choosing to Save allows you to save the contents of the Output as a TXT
    or OG file.


    The Options also enables you to choose how in-depth the errors you receive to:
    Choose from None, Errors, Warnings, and Verbose. Choosing None turns off the display
    of errors.


    You can use the trace action to display messages to anyone who views using the
    test environment. For example, trace("hello") displays "hello" in the Output window.


    ![](img/72fce958343eeb5d6d0322213ea85399_285_0.png)


    # USING THE TRACE ACTION


    +   1. Select the frame, button, or movie to clip which you want to add ActionScript.

    2. Use the trace action to evaluate an expression.

    3. Move the test to environment.


    Note: This example uses file trace.fa, which you can find on the CD-ROM that accompanies
    this book.'
