  md: '# FLASH ACTIONSCRIPT

    OBTAIN THE LENGTH OF A STRING


    You can use the length property to count the number of characters in a string.
    This property is useful when validating input. For example, if the user enters
    a value that is exactly 10 characters long, you can evaluate the length and send
    an error message back to the user if the entry is more or less than 10 characters.


    Example:


    ```

    "Hello".length

    ```


    In 4, the length function is used to obtain the length of a string. The syntax
    for the length function is `length(expression)`; Use the expression argument to
    specify the expression or variable for which you want to obtain the length.


    To use the length property, simply precede the word length with the string or
    variable for which you want to obtain the length.


    Example: In the below example, "S2498" is assigned to the variable `studentID`.
    Then, the length property is used to obtain the value of the variable `studentID`.
    The variable `enteredLength` returns 5.


    Example:


    ```

    studentID = S249876

    enteredLength = length(studentID)

    ```


    The variable enteredLength returns 7.


    When calculating string length, spaces are included in the count. In this example,
    "Hello" would have a length of 6.


    The length function has been deprecated in Flash 5. If you are using a Flash 5
    environment, you should use the length property instead.


