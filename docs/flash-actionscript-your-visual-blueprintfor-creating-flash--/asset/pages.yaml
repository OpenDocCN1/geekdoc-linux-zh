  md: '# DEMYSTIFYING FUNCTIONS


    # Extra


    You can call a function from any Timeline, including the Timelines of loaded movies.
    To call a function from another Timeline, precede the function with the target
    path using dots.


    If object arguments during a function call, ActionScript passes the argument to
    the function as undefined. This can cause errors when you export your movie. If
    you send arguments during a function call, ActionScript ignores them.


    Example:


    ```

    _root.sampleMC.twoDigit(123.456);

    ```


    It is a good practice to document your functions with comments. Include the input,
    outputs, and purpose of the function in your comments.


    A function does not have to return a value. For example, you can create a function
    that initializes values.


    When creating a function, it is a good idea to use local variables. The scope
    of a local variable is limited to the curly braces it encloses. Using local variables
    in a function prevents other scripts from reading the variables. ActionScript
    treats arguments passed to a function as local variables.


