  md: '# FLASH ACTIONSCRIPT


    # ADD SOUND


    You can add spice to your Flash movie by adding sound. Flash lets you loop, edit,
    and compress your sound files and create sound effects.


    In the Sound panel, you can choose a sound effect, a synchronization type, and
    the number of times a sound should loop. There are four synchronization types:
    Event, Start, Stop, and Loop. When the player enters your sound frame, the sound
    begins and then plays in its entirety. Event will not be completed when the movie
    stops. The sound continues to play. The synchronization is the same as the Event,
    except if the sound is already playing when the player enters the frame, a new
    instance of the sound begins. Stop stops the playback of a sound. Flash synchronizes
    with an event: A Stream cannot play longer than the frames it contains. A Stream
    stops when the movie stops.


    You can import sounds. Imported sounds are stored in the Library. Sounds can be
    either event or stream sounds. Sound events are continuous play; they continue
    regardless of what happens in the movie. Event sounds must download completely
    before they begin. Synchronize sound with an event. Stream can begin playing before
    download complete.


    You can control the size and quality of import options to modify your movie. You
    can set various import options for individual sounds by double-clicking the Sound
    icon in the Library dialog box. You define the settings for all sounds in the
    Publish Settings dialog box.


    # ADD SOUND


    ![](img/72fce958343eeb5d6d0322213ea85399_31_0.png)


    ![](img/72fce958343eeb5d6d0322213ea85399_31_1.png)


