  md: '# CREATE A SYMBOL


    reating and using symbols enables you to share graphics, movie clips, buttons,
    and sounds among movies. A symbol is a reusable graphic, button, clip or sound.
    Every Flash has a Library, which stores symbols. When you create a symbol, it
    automatically becomes part of the Library.


    Graphics are static images. You can place graphics on the Timeline of a movie,
    but you cannot attach ActionScript to them.


    Buttons are interactive graphics that respond to user action. You use ActionScript
    to give instructions on how to respond when the user clicks, rolls the pointer
    over, or performs some other action in a button.


    Movie clips are reusable animations that have their own Timeline. You can place
    a movie clip on the Timeline


    to create an animated button. You use ActionScript to give Flash instructions
    on how to respond when the user clicks, rolls the pointer over, or performs some
    other action in a movie clip.


    Symbols speed up the playback of your movies, because symbols enable you to share
    graphics, movie clips, buttons, and sounds among movies without downloading them
    once. You can set up permanent libraries and use them in permanent libraries from
    any movie. Each Flash movie has a shared library to make the library items available
    from the current movie. Flash with several libraries containing buttons, graphics
    and clips that you can use in your movies.


    You can import a symbol, or convert an object into a symbol. You create symbols
    in the symbol editing mode.


    # CREATE A SYMBOL


    ![](img/72fce958343eeb5d6d0322213ea85399_23_0.png)


    ![](img/72fce958343eeb5d6d0322213ea85399_23_1.png)


    +   - Make sure nothing on the Stage is selected.


    +   - Click Insert New to open the symbol dialog box.


    +   - The Properties dialog box appears.


    +   - Type a symbol name.


    +   - Click OK.


    +   - Flash changes to the symbol-editing mode.


    +   - Click to select a behavior.'
  merge: -1
