  md: '# # FLASH ACTIONSCRIPT

    CONVERT A STRING TO A NUMBER


    You cannot perform mathematical calculations using a string if the value contained
    in the string is a number. If you need to perform a mathematical calculation using
    a string, you must convert the string to a number.


    You can use the number function to convert a string to a number. You can also
    use the number function to convert a Boolean to a number. The Boolean returns
    1 for true and 0 for false. The syntax for the number function is number(expression);


    Use the expression to specify the string or Boolean you want to convert. For more
    information on the number function, see Chapter 4.


    You can also use the parseFloat function to convert a string to a number. The
    parseFloat function converts a string to a floating-point number that contains
    decimal places. If the string contains both numeric and non-numeric characters,
    the parseFloat function starts at the left and converts each character until it
    reaches the first non-numeric character. The parseFloat


    function ignores spaces preceding the string. If the first character in the string
    is not a number, parseFloat returns NaN, which stands for not a number.


    The syntax for the parseFloat function is


    ```

    parseFloat(string);

    ```


    Use the expression argument to specify the string you want to convert.


    In addition to parseFloat and number functions, you can also use the parseInt
    function to convert a string to a number. The parseInt function converts a string
    to an integer. An integer is a number that does not contain decimal places. The
    syntax for the parseInt function is


    ```

    parseInt(expression, radix);

    ```


    Use the expression argument to specify the string you want to convert. Use the
    radix argument to specify the base from which you want to convert. Valid values
    are 2 to 36. The parseFloat function returns the value in base 10.


    # CONVERT A STRING TO A NUMBER


    ![](img/72fce958343eeb5d6d0322213ea85399_229_0.png)


