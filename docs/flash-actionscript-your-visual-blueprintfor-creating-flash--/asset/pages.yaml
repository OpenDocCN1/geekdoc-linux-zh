  md: '# CHECK FRAME LOAD


    You use the iframeLoaded action to make sure that the download of movie contents
    to the local computer has completed before you trigger an ActionScript statement
    or series of statements. Developers frequently use the iframeLoaded action to
    keep the movie moving until the browser has downloaded the movie contents. The
    syntax for the iframeLoaded action is


    ```

    iframeLoaded(scene, frame) =

    ```


    The scene argument is optional. You can specify the scene which you want to check.
    Use the frame argument to specify the frame number or frame label that Flash must
    load before Flash executes the statement. The statement argument to specify the
    series or statements to execute.


    You can create a preloader with the iframeLoaded action. A preloader is a short
    animation that plays while the rest of the animation is loading. For example,
    you can create a preloader that reads, Wait... Movie Loading. The preloader starts
    on the screen until the specified frames have downloaded completely. After the
    specified frames have downloaded, the animation begins. By using a preloader,
    place the preloader in the first frames on the timeline and create a loop that
    executes until the necessary frames have loaded. See page 48 for more about gotoAndPlay.


    You can also use the _frames property with an if to make sure the movie contents
    to the local computer has completed before you trigger an ActionScript statement
    or series of statements.


    # CHECK FRAME LOAD


