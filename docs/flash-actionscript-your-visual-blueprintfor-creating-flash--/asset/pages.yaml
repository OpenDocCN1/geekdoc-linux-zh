  md: '# VALIDATE A STRING


    An important part of collecting information from the user is validating the data.
    Strings may need to be of specific length or contain specific characters. For
    example, say you require a user to enter a product code. In your organization,
    product codes begin with a letter p, followed by 10, 20, or 30, a dash and a digit.
    The following is a valid product code: p2-1.


    The product code in the preceding example must be exactly six characters. You
    can use the String length to determine the length of the string. The first character
    of the product code must be a p. You can use the substring method to retrieve
    the value to determine if the user entered the letter. The next four characters
    must be digits, a dash, and you can use the substring method this time to determine
    if the entry is valid. You can retrieve the character of the entry and use the
    isNaN function to


    In this situation, if you submit an invalid product code, you can control the
    user to correct the code. You can validate user entries at entry to ensure that
    you do not receive invalid codes. Many of the string functions are useful when
    validating data, and you can use them in coordination with one validate user entries.


    After evaluate whether an entry is valid, if the user enters an invalid entry,
    you can use a dynamic text box to tell the user that the valid entries are and
    instruct the user to enter it again.


