  md: '# GETTING FAMILIAR WITH FLASH


    # CREATE A SCENE


    Using scenes enables you to separate your movie into sections. For example, you
    can have a scene that displays the title of the movie, a scene that plays the
    movie, and a final scene that lists the characters. Each scene has its own Timeline
    and can include its own animation.


    To create a scene, click Scene from the menu. A new Stage and Timeline appears
    in which you can create your scene. By default, Flash names scenes by assigning
    sequential numbers, for example, Scene 1 and Scene 2. You can use the Scene panel
    to add, remove, duplicate, rename, and change the order of scenes. To open the
    Scene panel, click Panels from the menu.


    # SCENE PANEL


    To create a scene, click View Goto from the menu and then choose the scene that
    you want to go to.


    # CHANGE THE ORDER OF A SCENE


    To change the order of a scene, click a scene name and drag it to a new location.


    ![](img/72fce958343eeb5d6d0322213ea85399_18_0.png)


    # RENAME SCENE


    To rename a scene, double-click the scene name and type a new name.


    # DELETE A SCENE


    To remove a scene, click the scene name to select it and then click the Delete
    Scene icon.


    # DUPLICATE A SCENE


    To duplicate a scene, click the Duplicate Scene icon.


    # ADD A SCENE


    To add a scene, click the Add Scene icon.'
  merge: -1
