  md: '# GET PROPERTIES


    movie clips have a number of properties, including height, width, location, and
    visibility. You can retrieve the property of a movie clip using the getProperty
    function.


    Retrieving clip properties enables you to perform actions based on the property
    value. For example, you can create a button that enables the user to toggle the
    size of an object small, medium, and large. Retrieving the current _height and
    _width properties returns the value. You can use the _x and _y properties of a
    movie clip to determine the location of the movie clip. The _x coordinate of a
    movie clip and the _y coordinate of a movie clip gives you the coordinate. You
    can add 5 to the x coordinate to move the movie clip five pixels to the right.
    You can subtract 5 from the x coordinate to move a movie clip five pixels to the
    left.


    You can use the getProperty function to retrieve any movie clip. The syntax for
    getProperty is


    ```

    function getProperty(instanceName, property);


    Use the instanceName argument to specify the instance for which you want to retrieve
    a property. Use the property argument to specify the property you want to retrieve.
    This retrieves the height property of a movie clip sampleMC:getProperty(sampleMC,
    _height);


    You can also retrieve clip properties by placing the instance name followed by
    a dot in front of the property. The syntax is: instanceName.property;


    Use the instanceName argument to specify the name of the instance for you want
    to retrieve a property. Use the property argument to specify the property you
    want to retrieve. This retrieves the height property of a movie clip sampleMC:sampleMC._height;

    ```


    ![](img/72fce958343eeb5d6d0322213ea85399_225_0.png)


    +   Select the frame, button or movie clip which you want to add ActionScript.


    +   This example uses a button.


    +   Click Window to open the Actions panel.


    +   You can use the getProperty function to retrieve a property, or you can proceed
    it with the movie clip name followed by a dot.


    Note: This example uses properties.fla, which you can find on the CD that accompanies
    this book.'
