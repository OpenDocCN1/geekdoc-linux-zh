    that contain ActionScript can become complex. Flash provides you with tools that
    can help troubleshoot your movie.


    The final chapter, Flash Action Script Reference, contains useful tables of reference
    material and a summary of commands.


    Chapter 7, Using the Movie Clip and Array, introduces the Movie Clip object, which
