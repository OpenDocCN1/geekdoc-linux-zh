    Use the ActionScript eval to retrieve a variable, property, object, or movie clip
    from a string. This function is particularly useful when you have concatenated
    strings to the variable, property, object, or movie clip.


    The syntax for the eval function is eval(expression); Use the expression to specify
    the variable property, object or movie clip you want to retrieve. If the expression
    argument represents a variable or object, eval returns a value. If the expression
    argument represents an object or movie clip, eval returns a reference to the object.
    If ActionScript cannot find the expression argument, returns undefined.


