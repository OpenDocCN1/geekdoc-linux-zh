  md: '# ADD COMMENTS


    Adding comments to your Flash movie is essential when you are collaborating with
    others in its creation or when your script is complex and you want to document
    the purpose of each step. Adding comments is also a good programming practice.
    The syntax for adding a comment is


    // comment or /* comment */


    You can precede single-line comments with // or you can precede them with /* and
    end with /. For multiline comments, begin each comment with /* and precede subsequent
    lines with * and end with /*. You can select the syntax from the Toolbox in Normal
    Mode. You can add comments to any button, or movie clip action. If you have colored
    text turned on, comments appear in the Actions list. When you


    execute your script, Flash ignores comments. When you are debugging, it is sometimes
    useful to comment out sections of code so you can execute the remaining code without
    the commented section. This can help you locate problems.


    You can place comments anywhere in your script. Comments do not affect the size
    of your exported movie. A frequent use of comments is documenting the writer of
    the script, the date written, and any revisions.


    In Flash, you can also add comments to frames on the Timeline. Here also, comments
    are useful when you are working in a collaborative environment. Flash does not
    export comments with the movie, they do not affect the size of the exported movie.
    You should put comments on a separate layer.


    ![](img/72fce958343eeb5d6d0322213ea85399_57_0.png)


    +   Select the frame, button, or movie clip which you want to add ActionScript.


    +   This example uses a frame.


    +   Click Window Actions to open the Actions panel.


    +   Click Actions.


    +   Double-click comment.


    +   Type your comment.


