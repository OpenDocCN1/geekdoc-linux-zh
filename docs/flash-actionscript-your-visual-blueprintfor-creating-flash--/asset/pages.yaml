  md: '# JUMP TO A FRAME OR SCENE


    You can use the goto action to create loops or give the user the ability to move
    to a desired location at will. The action has two options: Go Play and Go Stop.
    The syntax for the Go action is


    ```

    gotoPlay(scene, frame);

    gAndStop(scene, frame);

    ```


    You use the scene argument to tell ActionScript the scene to which you want to
    send the playhead. The scene argument is optional. If you do not enter a scene,
    the playhead goes to the specified frame in the current scene. The frame number
    tells ActionScript to which you want to send the playhead. It is best to use a
    label instead of a frame number to identify the frame. Labels with frames, but
    frame numbers if you add, or change the location


    of a frame. If you use a frame number to identify a frame, a change in the frame
    number can cause an error in your script. Use the Frame label to create a frame
    label. For more about frame labels, see Chapter 1.


    You can use an expression to define the frame you want to go to, for example,
    gotoStop(currentFrame + 10). The current frame property retrieves the number of
    the current frame. The example moves 10 frames ahead and stop the movie.


    You can use the goto action to create a loop by creating a frame that takes users
    to a particular frame or scene, you can create movies in users which you can jump
    from place to:


