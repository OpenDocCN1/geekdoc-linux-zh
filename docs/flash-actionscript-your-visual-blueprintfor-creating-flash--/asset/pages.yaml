  md: '# # DEMSTIFY TRIGONOMETRIC FUNCTIONS


    You can use the Math object sin and cos methods to manipulate objects. These trigonometric
    functions find the sine or cosine of a value. You can use them with the x and
    y properties to move objects; however, a formula that you can use to move objects
    located on the Stage: movieClip.x=1+Math.cos(s) movieClip.y=1+Math.sin(s)


    find the formula Math.PI/180 * 2 a good base from which you can adjust the speed
    of your object. For the sake of the examples that follow, Math.PI/180 * 2 is assigned
    to the variable s, as shown in the following:


    ```

    s = Math.PI/180 * 2;

    ```


    The l represents location, speed and area. Use movieClip to specify the movie
    clip you want to move. Use l to adjust the coordinate with which the move objects.
    Use s to adjust the speed at which the object moves. The higher the value of s,
    the faster the object will move. The higher the value of l, the larger the area
    in which the object will move.


    You can move an object in a clockwise cycle by setting each of the variables in
    the same formula. The following example is:


    ```

    _sampleMC._x = 200 + Math.cos(s)*100;

    _sampleMC._y = 200 + Math.sin(s)*100;

    ```


    In trigonometry, we use radians to measure the size of angles. You use the formula
    Math.PI/180 degrees to convert degrees to radians. Although not essential, you


    To move the object in a counterclockwise direction, need the speed value, as shown
    in the following:


    ```

    _sampleMC._x = 200 + Math.cos(-s)*100;

    _sampleMC._y = 200 + Math.sin(s)*100;

    ```


