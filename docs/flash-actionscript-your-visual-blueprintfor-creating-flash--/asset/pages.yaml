  md: '# GETTING FAMILIAR WITH FLASH


    # ASSIGN ACTIONSCRIPT TO A MOVIE CLIP


    Assigning ActionScript to a movie clip enables to have your movie perform a variety
    of tasks when you click or rolls the pointer over the movie clip. If you assign
    an action to a movie clip instance, instances of the symbol are not affected.


    When assigning actions to movie clips, you must use a handler to handle the event
    that will trigger the action. All movie clip begins with the word onClipEvent
    and the event to which the handler responds enclosed in parentheses. In Normal
    Mode, Flash assigns the onClipEvent(load) handler by default if you select an
    from the list without specifying a handler.


    Use the onClipEvent(enterFrame) handler to perform specified actions each time
    the play enters the frame. Use the onClipEvent(mouseMove) handler to perform specified
    actions every time the mouse moves. Use the onClipEvent(mouseDown) handler to
    perform specified actions when you presses the mouse. Use the onClipEvent(mouseUp)
    handler to perform specified actions when the user releases the mouse.


    The onClipEvent(keyDown) handler performs the specified actions when the user
    presses any key. The onClipEvent(keyUp) handler performs the specified actions
    after they. The onClipEvent(data) handler performs the specified actions when
    ActionScript receives data.


    The onClipEvent(load) handler executes the first time the movie clip appears on
    the Timeline. The onClipEvent(unload) handler executes specified actions in the
    first time after you remove the movie clip from


    You assign ActionScript to a movie clip by selecting clip and opening the Object
