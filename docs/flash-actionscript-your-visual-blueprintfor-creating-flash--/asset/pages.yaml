  md: '# USING MATHEMATICAL FUNCTIONS


    The Math object has methods that enable you to perform trigonometric functions.
    The functions included are sine, cosine, tangent, arc sine, arc cosine, and arc
    tangent. The methods for these are sin(), cos(), tan(), asin(), acos(), and atan().
    The Math object also includes methods to convert angle from radians to degrees.
    The cos, sin, and tan methods take the radian of an angle as an argument. Radians
    are used to measure an angle; 360 degrees is equal to 2 pi. You can pass the function
    of a measurement in radians, or you can use the formula to convert radians: Math.PI/180
    * degrees.


    Extra A constant is a value that does not change. The Math object includes several
    properties. All of the Math object properties are constants. You can use these
    to perform mathematical calculations.


    The Math object includes functions for working with logarithms and exponentials
    based on Euler''s constant. The log() method returns the logarithm of a number.
    The exp method returns Euler''s constant raised to the power of a number.


    | E—Euler’s constant | 2.718 |

    | LN2—Natural logarithm of 2 | .069 |

    | LOG2—The base of e | 1.442 |

    | LN10—Natural logarithm of 10 | 2.302 |

    | LOG10—The base of 10 of a circle to its diameter | .434 |

    | PI—The ratio of the circumference of a circle to its diameter | 3.14159 |

