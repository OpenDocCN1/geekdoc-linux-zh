  md: '# FLASH ANSCRIPT


    # # TEST A MOVIE


    As you will want to test your movie, ensure that its animations and scripts work
    properly. You can test your movie in the authoring environment, in the test environment,
    or in a Web browser.


    To test your movie in the authoring environment, use the controls on the Menu
    control. The Play option returns your movie to the first frame. The Step Back
    option returns your movie to the previous frame. The Step Forward moves your movie
    forward one frame. Loop Playback allows you to play continuously. The Play All
    Scenes option causes all scenes to stop. The Mute sounds option lets you play
    without sound. By default, Flash disables buttons and actions, enabling you to
    manipulate buttons, movie clips, and frames as you rate. Select Simple


    and Enable Simple Frame Actions to test buttons and actions in the authoring environment.


    When you click File>Save, Flash saves the movie you are authoring in FLA format
    and adds an FLA extension to the filename. To view your animation on the Web,
    your file must be in SWF format—use the SWF format.


    Not all animations and scripts work in the authoring environment. You must export
    your movie to its final SWF format for animations and scripts to work. Click Control>Test
    exports your movie to test, creating an SWF file in accordance with the setting
    you chose in the Publish Settings dialog box, and moves you to the test environment.
    Clicking Control>Test also creates a SWF file. Control, Test Scene tests you the
    current scene.


