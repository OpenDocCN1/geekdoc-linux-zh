  md: '# WORKING WITH VARIABLES AND STRINGS


    # NAME VARIABLES


    You are free to name your variables anything you like; however, when naming your
    variables, you must follow these rules:


    +   * The first character of your variable name must be a letter, underscore (_),
    or dollar sign ($).

    * Each subsequent character must be a letter, underscore (_), or dollar sign ($).

    * Your variable name cannot be a keyword.

    * Your variable name cannot be a Boolean literal.


    +   * Your variable name must be unique within its scope. Global variables must
    be unique within the movie. Local variables must be unique within the curly braces
    that enclose them.

    * Your variable name does not have to be in the format of first word beginning
    with a lowercase letter and subsequent words with capital letters; however, that
    is the convention in this book. If you develop a convention and use it consistently,
    you will have an easier time debugging your code.


    # DYNAMICALLY DISPLAY TEXT


    You can use variables to dynamically display text or to create forms. If you want
    to dynamically display text, you start by using the Tool to create a text box.
    After you have created the text box, click Window ⊞ Text Options on the menu.
    The Text Options


    panel opens. Select Dynamic Text as the text type and enter the name you want
    to assign to your variable in the Variable field. If you would like a border around
    your field, select Border/Bg. Any information you assign to the variable displays
    on the screen.


    # CAPTURE USER INPUT


    If you want to create a form to capture user input, you start by using the Text
    Tool to create a text box. The box will capture the user''s entry. After you have
    created the text box, click Window ⊞ Text Options on the menu. The Text Options
    panel opens. Select Input Text as the text type and enter the name of your variable
    in


    the Variable field. Any information the user types in the field is stored in the
    variable assigned. You reference Input Text variables and Dynamic variables the
    same way that you reference any other variable.'
