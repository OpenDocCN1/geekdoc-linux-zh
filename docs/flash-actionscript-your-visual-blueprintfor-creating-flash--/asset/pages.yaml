  md: '# ROTATE MOVIE CLIPS


    You use the _rotation property to rotate a movie or movie clip. The rotation value
    is the number of degrees a movie clip has been rotated from the original position
    when it was placed on the Stage.


    Before you set the value of the _rotation property of a movie clip, the movie
    clip must have a name. Use the instance name to name your movie clip instance.
    The syntax for setting the value of the _rotation property is


    ```

    instanceName.rotation = value;

    ```


    The instanceName argument is used to specify the name of the movie clip which
    you want to set the value of the _rotation value. Permit the instanceName to set
    the rotation value for the movie. The value argument to set the value of the _rotation
    property


    Note that setting the rotation value to 90 rotates the movie clip 90 degrees from
    its origin location, not its


    current location. If the rotation value is 90 and you set the rotation value to
    90, the movie clip will not rotate. To rotate the movie clip an additional 90
    degrees, you must set the rotation value to 180.


    You can retrieve the _rotation value. The syntax for retrieving it is


    ```

    instanceName.rotation;

    ```


    Use the instanceName argument to specify the name of the movie clip you want to
    rotate. Use the instanceName argument to retrieve the value of the movie.


    If you want to rotate a movie clip a number of degrees from your current location,
    retrieve the current value and add the number of degrees you want to rotate the
    movie clip. For example, sampleMC._rotation = sampleMC._rotation + 90; rotates
    the movie clip 90 degrees from its current location.


    ![](img/72fce958343eeb5d6d0322213ea85399_87_0.png)


    +   1. Select the frame, button, or movie clip to which you want to add ActionScript.


    +   This example uses file rotate.fla, which you can find on the CD that accompanies
    this book.


    +   2 Click Window Actions to open the Actions panel.


    Note: This example uses file rotate.fla, which you can find on the CD that accompanies
    this book.


    +   3 Click Properties _rotation.'
