  md: '# USING THE MOVIECLIP OBJECT


    The methods of the MovieClip object give you the ability to perform an action
    on a movie clip instance or to retrieve a value associated with a movie clip.
    Giving a unique name to each movie clip instance, you can target instances of
    a movie clip. You do not need a constructor to call MovieClip object methods;
    instead,


    precede each method with an instance name followed by a dot, for example:


    ```

    movieClipName.method(arguments);

    ```


    The MovieClip object methods in the table below give you the same functionality
    as standard actions.


    | MOVIECLIP OBJECT METHOD | FUNCTION |

    | --- | --- |

    | DuplicateMovieClip | Creates a new instance of the specified movie clip. The
    duplicated movie clip begins playing in frame 1. If you delete the parent movie
    clip, Flash will delete the duplicate movie clip. Flash does not copy variables
    in the parent movie clip to the duplicated movie clip. |

    | getURL | Opens a Web page in a browser. You can also use the getURL method to
    pass variables by using either the get or post method. |

    | gotoAndPlay | Moves to a frame within a specified scene and begins the movie
    clip. |

    | gotoStop | Moves to a frame within a specified scene and stops the movie clip.
    |

    | loadMovie | Loads the specified into the movie clip. |

    | loadVariables | Loads variables into a movie clip from an external file. |

    | nextFrame | Sends the play to the next frame in the movie clip and stops the
    movie clip. |

    | play | Starts the specified movie clip. |

    | prevFrame | Sends the play to the previous frame in the specified movie clip
    and stops the movie clip. |

    | removeMovieClip | Removes a movie clip created by the duplicateMovieClip action,
    duplicateMovieClip method, or attachMovie method. |

    | startDrag | Makes the specified movie clip draggable. |

    | stop | Stops a specified movie clip. |

    | stopDrag | Stops the dragging of the currently draggable movie clip. |

    | unloadMovie | Unloads a movie loaded with the loadMovie method. |'
