  md: '# USING THE KEY OBJECT


    The methods of the Key object enable you to detect the last key. You can use the
    Key object to create keyboard controls for Flash movies. The methods of the Key
    object are essential if you are programming games. Use the Key object to give
    you the ability to manage objects around the screen using the keyboard. Use the
    Key object to change the shape of objects using the board. Alternatively, use
    the Key object to respond to the user based on the key. You do not need to construct
    a script to access the Key object.


    the getCode method returns the virtual key of the last key. The syntax for the
    getCode method is getCode();


    The getCode does not take any arguments. The virtual key for k is 75. If the user
    presses k, the getCode method returns 75. Using the getCode method, you can move
    your people based on the key.


    ActionScript assigns virtual code to every physical key on the keyboard. Chapter
    14 provides a list of virtual keys. Virtual keys are the same across all platforms
    and languages. You use virtual keys to ensure that your move controls are the
    same across platforms and languages.


    The first 127 characters of every character have ASCII. The getAscii method returns
    the ASCII value for the last key. The ASCII value for k is 107. If the user presses
    k, getAscii returns 107.


