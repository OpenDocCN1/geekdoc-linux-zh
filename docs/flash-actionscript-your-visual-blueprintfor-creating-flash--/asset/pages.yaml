  md: '# CREATE A BUTTON


    Buttons enable you to add interactivity to your Flash movie. The user clicks a
    button to cause an action to occur. For example, the user can click a button to
    open a Web page.


    When you create a button, Flash presents you with a four-frame timeline, with
    one frame representing each of the button states. To define the appearance of
    a button state, you can create or import a graphic for each of the four states.
    You can use any graphic or movie clip when defining the appearance of a button.
    You can use movie clips to create animated buttons. You cannot use another button
    to define a button state. You can enable it by


    Buttons have four states: Up, Over, Down, and Hit. The Up is how the button appears
    to the user when the pointer is not over the button. The Over state is how the
    button appears to the user when the pointer is over the button. The Down state
    is how the button appears to the user when the user clicks it over the button.
    The Hit state defines the area that is large enough to encompass the graphics
    used in the other three states. Make sure that your Hit state is large enough
    to respond to users. You can make the Hit state larger than the other states.
    The Hit state is not visible to


    You use ActionScript to define the action that will occur when the user clicks
    the button. You can use buttons to analyze user input, respond to user input,
    load or unload a movie, or perform a myriad of other tasks.


    ![](img/72fce958343eeb5d6d0322213ea85399_27_0.png)


    ![](img/72fce958343eeb5d6d0322213ea85399_27_1.png)


