  md: '# FLASH ACTION SCRIPT


    # SWAP DEPTHS


    When you place objects on the Stage, Flash gives them a lower level and stacks
    them. Movie clips with a higher depth level appear to be in front of others. For
    example, if you use two photographs on the Stage and a movie clip to change the
    full screen view, you notice that the lower depth level will appear behind the
    image with a higher depth level when you increase it. A similar problem can occur
    when you have a number of draggable objects. Each object is on its own level.
    You may want the user to be able to drag any object on top. By using the swapDepths
    method you can change the stacking order of movie clips so that the images appear
    at the level you desire.


    The syntax for MovieClip.swapDepths is movieClipName.swapDepths(depth/target).


    Use the movieClipName argument to specify the name of the clip for which you want
    to swap the depth. Use the target argument to specify the movie clip with you
    want to swap the depth. In other words, if you want to swap the depth of clip
    A with movie clip B, use the syntax as follows: A.swapDepths(B); Alternatively,
    use the target argument to specify the depth instead of using the target.


    When using the swapDepths method, both movie clips must have the same parent.
    If a movie clip is tweening when you call the swapDepths method, the tween stops.


    ![](img/72fce958343eeb5d6d0322213ea85399_169_0.png)


    +   1 Select the frame, button, or movie clip which you want to add ActionScript.


    Note: This example uses swap.fla, which you can find on the CD that accompanies
    this book.


    Note: The script is associated with the button that has been converted to a movie
    clip. To see the example file, double-click the movie clip and open the Actions
    panel.


    +   2 Click Window Actions to open the Actions panel.


    +   3 Set the handler to the on (press ).


    +   4 Swap the depth of the movie clip.


    +   5 Increase the size of the movie clip.


    154'
