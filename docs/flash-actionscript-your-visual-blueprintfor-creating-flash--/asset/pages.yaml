  md: '# FLASH ACTIONSCRIPT


    # CHANGE COLORS


    You can use Color methods to change the color of movie clips located on the Stage.
    The Color object method enables you to change the color of movie clips as the
    movie plays.


    Changing the color of a movie clip is a two-step process. First you use the new
    Color() constructor to create an instance of the Color. Then you use the Color.setRGB
    method to specify the color to which you want to change the movie clip.


    The syntax for the new Color() constructor is


    ```

    objectName = new Color(target);

    ```


    You use the object argument to name the Color. Use the argument to specify the
    instance name of the movie clip for which you want to change the color.


    The syntax for the Color.setRGB method is


    ```

    objectName.setRGB(0RRGGGB);

    ```


    Use the objectName argument to specify the Color object. Each color has a hexadecimal
    value. RRGGGB to specify the hexadecimal value that represents the color to which
    you want to change the movie clip. There is a list of hexadecimal values in the
    Appendix of this book. Flash displays these values next to the selected color
    in the Stroke and Fill panels.


    The following examples change the color of a movie clip: newColor = new Color(sampleMC);
    newColor.setRGB(0xFF0000);


    You use the RGB method to retrieve the numeric value of the most recent setRGB
    call. The syntax for


    ```

    objectName.getRGB();

    ```


    Use the objectName argument to specify the Color object. The setRGB method returns
    the color value in base 10.


