  md: '# # ACTIONS APPENED WITH NUM


    When you use loadMovie,unloadMovie,loadVariables, or printAsBitmap in Normal Mode,
    ActionScript may substitute these actions with loadMovieNum,unloadMovieNum,loadVariablesNum,
    and printAsBitmapNum.


    automatically. In fact, Normal Mode does not list actions appended with Num in
    the Toolbox list. In the Expert mode, the programmer must decide whether to use
    the action name or action name appended with Num. The programmer uses the action
    name if specifying a target and the action appended with Num if specifying a target
    index.


    In Normal Mode, using the loadMovie,unloadMovie,loadVariables, or printAsBitmap
    uses the location to specify either a number or target value. A number is an integer.
    A path is a string. Flash Player needs to know if the location is a string or
    a number. ActionScript uses two versions of the action: the action name and Num.
    ActionScript uses the action name with strings and the action name appended with
    Num. In Normal Mode, if you select the target in the Location field ActionScript
    uses the action name. If you select in the Location field, ActionScript uses the
    action name appended with Num. ActionScript makes the selection


    Examples:

    loadVariableNum("http://www.entercompany.com/anymovie.swf", 3)

    loadVariable("http://www.entercompany.com/anymovie.swf", "root.targetClip")


    Note: If you specify the level using a string, loadVariable

    loadVariable("http://www.entercompany.com/anymovie.swf", "level1")


