  md: '# FLASH ACTIONSCRIPT


    # FIND THE MODULO


    the remainder of one expression divided by another is called the modulo. In ActionScript,
    you can use the modulo (%) to find the remainder. This operator is useful when
    you are working with numbers or writing scripts. When scripting, you might want
    a variable to update an action that occurs only if a number is divided by another.
    To use the modulo operator, place the % between two numeric expressions. The syntax
    for the modulo operator is


    ```

    numericExpression1%numericExpression2

    ```


    ActionScript divides numericExpression1 by numericExpression2 and returns the
    remainder, for example: ActionScript divides 13 by 5 and assigns 3, the remainder,
    to x.


    You use the modulo operator with numbers, variables and numbers. The numericExpression


    argument represents any number, integer, floating-point number, or string that
    converts to a number.


    If the numericExpression is not a number, ActionScript attempts to convert it
    to a number.


    In general, leap year occurs in years that are divided by four. You can use the
    modulo to help you determine if it is a leap year. You just divide the year by
    four and if the remainder is 0 then it is a leap year.


    You use the modulo when you want to execute a statement every time. For example,
    if you want to execute a statement every other time the user presses a button,
    increment a number — let say x — each time the user presses the button. Execute
    your statement only if the modulo of x divided by 2 is 0.


