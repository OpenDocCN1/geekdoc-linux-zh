    Flash uses antialiasing to smooth the edges of images. With antialiasing, Flash
    displays clear, images. However, because antialiasing requires a faster processor,
    it can slow down the playback of a movie. If you assign the toggleHighQuality
    action to enable antialiasing and speed up the playback of the movie. The syntax
    for `toggleHighQuality()` is:


    The `toggleHighQuality()` action does not do anything, so it has no parameters.
    Turning off antialiasing affects all of the movies in the player. You cannot adjust
    the quality of a single movie or clip. By assigning `toggleHighQuality` to a button,
    you can toggle antialiasing on and off by clicking it. If antialiasing is off,
    clicking the button turns it on.


    clicking the button turns it on. When a Flash movie is viewed in the stand-alone
    player, clicking View High Quality from the menu toggles antialiasing on and off.


    You can create an HTML file to view your movie on the Web. You can use Flash to
    create your HTML file by clicking File -> Publish and using the Publishing Settings
    box. If you click the HTML in the Publishing Settings box, you set the parameters
    for the HTML Document. Among the parameters you can specify the level of antialiasing
    to use when your movie plays on the Web. You can choose the level you want to.
