  md: '# FLASH ACTIONSCRIPT


    n Flash, the attributes of an object are properties. Movie clips have a large
    number of attributes — properties, such as height, width, location, and visibility.
    Using ActionScript, you can obtain the current value of a movie clip and you can
    change the value of many properties. Properties are read-only, which means you
    can retrieve the value but you cannot change it.


    Properties. The basic syntax for retrieving a property is to type the instance
    name followed by a dot and the property. The basic syntax for setting the value
    of a property is the instance name followed by a dot, an equal sign, and the value
    which you want to set the property.


    You retrieve and change movie clip properties for a variety of reasons: _x and
    _y tells you the location of a movie clip. Retrieving the height and width tells
    you the size of movie clip. Changing these properties enables you to adjust the
    size or move a movie clip.


    You can also use the setProperty action to set movie clip properties. The syntax
    for the setProperty action is


    ```

    setProperty(target, value).

    ```


    Use the argument to specify the instance name of the movie clip you want to target.
    Use the property argument to specify the property you want to set. Use the value
    argument to specify which value you want to set the property.


    To retrieve or set the property of a movie clip, you must give the movie clip
    instance name. You use the Instance name to move movie clips. In the ActionScript
    panel, the Toolbars lists movie clip properties


    You can use the getProperty function to retrieve the value you want to set. See
    Chapter 9.


