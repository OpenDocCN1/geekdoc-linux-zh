  md: '# UNDERSTAND PRECEDENCE


    operators are characters that you can use to combine, compare, or modify values.
    When using operators, you must be aware of precedence. In which ActionScript performs
    calculations, for example, x = 1 * 2 * 3;


    ActionScript performs multiplication and division before addition and subtraction,
    in accordance with its rules of precedence. In example, x is equal to 7. ActionScript
    multiplies 3 to get 6 and adds the 1. You can change the order of calculation
    by using parentheses. Parentheses override the normal order of precedence causing
    ActionScript to calculate the items enclosed in parentheses, for example, y =
    (1-2) * 3;


    In this example, x is equal to 9. ActionScript adds 1 plus 2 to get 3 and multiplies
    the result by 3. If you need parentheses, ActionScript evaluates the innermost
    first. If two or more operators have the same precedence, ActionScript uses associativity
    to determine the order in which to perform the calculation. An operator can have
    an associativity of either left to right or right to left. If an operator has
    an associativity of left to right, ActionScript performs the calculation from
    left to right, or vice versa for right to left.


    # TYPES OF OPERATORS


    Operators are characters that you use to combine, compare, or modify values. ActionScript
    calls the elements on which operators perform operations. There are three types
    of operators: unary, binary, and ternary.


    Unary operators accept one operand. Increment and decrement are unary operators.
    Most unary operators, however, can either prefix or suffix the operand, depending
    on the operation you want to perform. For more about increment and decrement,
    see pages 122 to 125.


    Binary operators are the most common type of operator. Binary operators accept
    two operands. You place binary operators between operands. Plus (+) and minus
    (-) are binary operators.


    Ternary operators accept three operands. The conditional operator (:) is a ternary
    operator. ActionScript evaluates expression1. If expression1 is true, ActionScript
    returns expression2; if not true, ActionScript returns expression3. For more on
    the conditional operator, see Chapter 6.'
