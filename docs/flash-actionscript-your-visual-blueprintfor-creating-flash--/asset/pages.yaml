  md: '# FLASH ACTIONSCRIPT


    # VALIDATE A DATE


    he 12 months of the year are usually numbered from 1 through 12, starting with
    January. With ActionScript, you enter 20 as the month, it will accept your entry
    as a valid. It will also accept an invalid for the number of days in a month,
    and are not limited to four digits. You can enter more than 24 hours in a day,
    the 60 minutes in an hour, the 60 seconds in a minute, and so on. Therefore, when
    you want to validate a date or time, you may want to validate the value the user
    has entered valid data.


    November do not exceed 30. February is limited to 28 days, and you want to account
    for Leap Year. The remaining months cannot have more than 31 days. If the user
    is entering a value, you want to do similar validations.


    These validations require conditional check. If the month is equal to 1 (January),
    the day must be greater than 0 but less than 32, but if the month is equal to
    4 (April), the day must be greater than 0 but less than 31. It is even more complicated
    for february; the day cannot be greater than 28 unless the year is a Leap Year.
    You can use the modulo operator to help determine whether the year is a Leap


