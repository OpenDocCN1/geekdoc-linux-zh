    You can name your file anything you want. Use AS for the file extension. The filename.as
    argument represents the relative path to the file. If the movie file and the ActionScript
    text file are in the same folder, the path to file is filename.as. If the ActionScript
    text file is in a subfolder, foldername/filename.as. When you test, publish, or
    export your movie, ActionScript replaces the #include statement with the contents
