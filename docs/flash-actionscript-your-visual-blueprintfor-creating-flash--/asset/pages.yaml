    # ACTIONS


    You use actions to send commands in ActionScript. You can use actions to start
    or stop a movie, or


    unload a movie, or perform other tasks. The following table lists the actions
    you can use in ActionScript.


    | ACTION | PURPOSE |

    | --- | --- |

    | loadMovie | Load and displays several movies at once or switches movies without
    losing Flash Player. |

    | break | Used with the for, ...in, do while, and while actions. The break action
    ActionScript breaks out of a loop. | loadVariables | Loads variables from an external
    file. |

    | comment | Enables to select a movie clip handler. |n| comment | Enables to add
    text to your script. Comments have no effect on your script. Use comments to document
    your script. | play | Plays a movie. |

    | continue | Used with while and do, ...loops. With loops, causes ActionScript
    to return to the top of the movie. With loops, causes ActionScript to go to the
    bottom of the loop. | print | Prints a movie. |

    | removeMovieClip | Removes movie clip from the Stage. |

    | delete | return | Specifies the value returned by a function. |

    | duplicateMovieClip | Deletes an object or variable. | set variable | Enables
    to assign a value to a variable. |

    | else | Copies of a movie clip instance. | setProperty | Enables to set the property
    of a movie clip. |

    | else | Used with statements. Executes statements if all other conditions are
    not met. | startDrag | Makes an object draggable. |

    |evaluate | Creates a blank line with a semi-colon. | stop | Stops a movie from
    playing. |

    | for | Used to execute a statement or series of statements repeatedly. | stopAllSounds
    | Stop all sounds that are currently playing. |

    | ...in... | Loops through object properties or elements in an array. | stopDrag
    | Stops an action. |

    | FSCommand | Sends commands to Flash Player. | tellTarget toggleHighQuality |
    Toggles annotations on and off. |

    | function | Defines custom functions. | trace | Displays messages in the Output
    window. |

    | getURL | Opens a Web page. | unload | Unloads a movie. |

    | goto | Stops or plays a movie. | var | Declares a local variable. |

    | if | Runs a statement or series of statements if the condition is true, else
    evaluates a condition. |

    | ifFrameLoaded | Checks the status of a movie download. | with | Enables to execute
    a statement or series of statements on an object or movie clip. |

    | include | Includes script written with a text editor in your Flash movie. |
