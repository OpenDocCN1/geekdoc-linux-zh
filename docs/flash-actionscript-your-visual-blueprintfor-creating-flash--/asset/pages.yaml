  md: '# FLASH ACTIONASCRIPT


    # SEAR A TEXT BOX


    You can use the Selection.setFocus with the Selection.setSelection method, String.indexOf
    and length property to add a text box. A search feature allows the user to search
    the text box for a word or phrase. The user types the phrase into input and clicks
    a button, ActionScript finds and selects the word or phrase, or sends a message
    to the user stating the entry cannot be found. You can search the text box from
    top to bottom or bottom to top.


    Selection.setFocus method sets the focus to a specified text box. You must set
    the focus before you use the Selection.setSelection method. The syntax for Selection.setFocus
    method is


    ```

    Selection.getFocus(string)

    ```


    Use the argument to specify that names the variable associated with the text box
    you want to set.


    Selection.setFocus method selects an area in the text box that currently has.
    The syntax for the Selection.setFocus method is


    ```

    Selection.setSelection(start, end);

    ```


    Use the argument to indicate the index position at which you want to start the
    selection. Use the end argument to indicate the position at which you want to
    end the selection. The first position in the text box has an index of 0.


    The String.indexOf method searches for a string and returns the index position
    for that value. The syntax for the String.indexOf method is


    ```

    string.indexOf(value, start)

    ```


    Use the argument to specify the value to search. Use the value argument to specify
    the value for which you want to search. Use the start argument to specify the
    index position at which you want to begin. The String.indexOf method does not
    find the value, it returns -1.


    # SEARCH A TEXT BOX


    ![](img/72fce958343eeb5d6d0322213ea85399_263_0.png)


