  md: '# ENTER THE ENVIRONMENT


    A data in a frame are not downloaded when your movie reaches the frame will cause
    your movie to pause until the data downloads. In the environment, you can view
    a graphical representation of movie at various modem speeds. This enables you
    to see which frames may cause your movie to pause.


    The left side of the Bandwidth Profiler displays movie clip dimension, frame rate,
    size in frames and seconds, and the preloaded frames in seconds. The right side
    of the Bandwidth Profiler displays a graph. If the bar is below the red line,
    the line will stream in real-time. If the bar is above the red line, the frame
    must wait to stream.


    You select the speed you want to use. Typically, the stated mode is higher than
    the typical speed you use experiences. The Bandwidth Profiler estimates interval
    based on that speed. For example, Bandwidth Profiler uses 2.3KB/s for a 28.8 movie.
    The Bandwidth Profiler also has an option, which enables you to specify the speed
    and the performance you want to test.


    You can use streaming to simulate the number of frames loaded and the frame currently
    playing. You can click on any bar to display information about the frame. You
    can also view a graphical representation of each frame.


    The test environment also has options that enable you to play, rewind, step forward,
