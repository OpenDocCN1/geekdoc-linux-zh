    window.

    3 Click Open to open the file.


    +   Flash sends the sound file to the Library.

    4 Click to open the Library.

    5 Click the sound name to select the sound.


    +   6 Click ( ) to hear the sound.

    7 Drag the sound onto the Stage.

    8 The sound appears on the Timeline.


    16'
