  md: '# CREATE LAYERS


    When creating a Flash movie, you place individual images and animations on separate
    layers to prevent them from connecting, erasing, or segmenting each other. Also
    use separate layers for sounds, frames and labels. Layers are transparent sheets
    where you create the graphics and animations in your movie and you can hide each
    layer except when you add color.


    You work on the active layer. You make a layer active by clicking on the layer,
    or by moving to the Stage and placing a pencil icon on the layer. Flash name of
    the active layer. Only one layer can be active at a time.


    As you create, they are stacked on layer. An object on a lower layer will appear
    as if is behind an object


    on a higher layer. You can change the order of layers and the name of a layer.


    You can lock a layer to prevent changes to the layer. Flash uses a padlock icon
    to indicate a locked layer. You can also hide it. Hiding a layer is useful when
    you want to remove objects from the Stage to make it easier for you to create
    graphics. You can delete layers when you no longer need them.


    To assist you when drawing graphics, you can create layer guides. You can also
    create motion guides to assist you when creating motions. You may use layers to
    create spotlight. Flash provides you with an option that allows you to view a
    layer as an outline. You can specify the outline color. Adding layers does not
    increase the file size of your published movie.


    ![](img/72fce958343eeb5d6d0322213ea85399_19_0.png)


    ![](img/72fce958343eeb5d6d0322213ea85399_19_1.png)


    +   1 A new layer appears above the active layer.

    2 Double-click and type to change the layer.

    3 Click in the Show/Hide All Layers column to toggle between showing and hiding
    a layer.

    4 Click in the Lock/Unlock All Layers column to toggle locking between and unlocking
    layers.

    5 Click in the Show Layers column to toggle between Show Normal ( ) and Show Outline
    (□ ).'
