  md: '# CREATE AN INSTANCE


    Creating and using instances of a symbol can dramatically reduce the size of your
    Flash movie. An instance is a copy of a symbol. Each symbol can have an unlimited
    number of copies or instances. You can change the color, tint, size, rotation,
    function, and other properties of an instance. Changes you make to an instance
    do not change the symbol itself or other instances of the symbol.


    Brightness refers to the relative lightness or darkness of an image. Black has
    a brightness of -100 percent. Tint refers to the color or hue of an instance,
    for example, red, blue, or green. Alpha refers to the transparency of an instance.
    An alpha property of 0 is completely transparent. An instance with an alpha property
    of 100 is


    completely opaque. You use the Effect panel to change the brightness, tint, or
    alpha property of an instance.

    An instance can have a behavior type of graphic, button, or movie clip. Instances
    inherit their behavior type from the symbol. To change an instance behavior, use
    the arrow tool to select the instance, then open the instance panel. In Behavior
    field, select from Graphic, Button, or Movie clip.


    Using instances of a symbol dramatically reduces the size of your movie, because
    saving instances of an image requires less space than saving a complete description
    of an image each time you use it. You create an instance by opening the Library
    and dragging the instance from the Library onto the Stage.


    # CREATE AN INSTANCE


    ![](img/72fce958343eeb5d6d0322213ea85399_25_0.png)


    ![](img/72fce958343eeb5d6d0322213ea85399_25_1.png)


    +   1 Click to select a keyframe.


    +   2 Click Window Library to open the Library.'
