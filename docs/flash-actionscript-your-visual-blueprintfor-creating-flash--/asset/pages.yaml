  md: '# GETTING FAMILIAR WITH FLASH


    # Extra


    You can convert selection on the Stage into a symbol. To reduce the file size
    of your movies, consider turning background images into symbols you can reuse
    them. To convert an object on the Stage into a symbol, use the Arrow tool to select
    the object. Click Insert > Convert to Symbol to open the Properties dialog box.
    Click to select Movie Clip, Graphic, or Button as the behavior. Click OK.


    When you create a symbol from a selection on the Stage, the selection becomes
    an instance of the symbol. You will no longer be able to edit the object directly.
    To edit the symbol, you must move to the symbol-editing mode. To move to the symbol-editing
    mode, use the Arrow tool to select the symbol and click Edit > Edit Symbols. When
    you have completed your symbol, click Edit > Edit Mode to exit the symbol-editing
    mode. When you modify a symbol, Flash updates every instance of the symbol in
    the movie. When editing a symbol, you can use all of the drawing tools and you
    can import content.


