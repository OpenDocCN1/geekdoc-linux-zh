  md: '# USING THE ACTIONS PANEL (CONTINUED)


    You can change the size of the Toolbox list by dragging the vertical splitter
    bar that appears between the Toolbox list and the Actions list. You can expand
    or collapse the Toolbox list by clicking the left or right arrow that appears
    on the splitter bar.


    In Expert Mode, you type your statements in the Actions list just as if you were
    using a text editor. You can also add statements by selecting them from the Toolbox
    list or by using the Add Statement button. There is no Parameters panel to prompt
    you for arguments, and the Statement Order button is disabled. In addition, Expert
    Mode does not have a Basic Actions category.


    You can switch between Normal Mode and Expert Mode. Changing modes might change
    the format of your script, so it is best to stick to a single mode script. You
    cannot convert Expert Mode scripts with errors to Normal Mode. You can convert
    Normal Mode scripts with errors to Expert Mode, but you must correct the errors
