  md: '# FLASH ACTIONSCRIPT

    LOAD AND UNLOAD MOVIES

    AND MOVIE CLIPS (CONTINUED)


    The main Timeline for loading a movie is located at level0. When loading a movie,
    you can specify a level. You can use any level that you want, but only one movie
    can be on a given level at a time. When loading a movie use the location action
    to specify the level into which you load. When you load a movie level 0, the new
    movie will replace the current movie, and all other levels will be unloaded. When
    you load a movie into a level occupied by another movie, the new movie will replace
    it. When you load a movie into an unoccupied level, all movies will remain, and
    the new movie will be loaded.


    Use Send Using Post to specify variables separate from the URL. Send Using Post
    enables you to send a large number of variables. Use Don''t Send if you do not
    want to send any variables. Use the variable argument to specify the method that
    you want to associate with variables.


    Use the unload action to remove a movie using the loadMovie action. The syntax
    for the unloadMovie is


    ```

    unloadMovie(location);

    ```


    You can send variables to the CGI scripts using the loadMovie action. Variable
    in Normal Mode presents you with three choices: Send Get, Send Post, and Don''t
    Send. Use Send Get to append a small number of variables to the end of the URL.


    Use the location argument to specify the level of the target you want to unload.
    When in Normal Mode, Flash may substitute LoadMovieNum. For an explanation of
    LoadMovie and LoadMovieNum, see the appendix.


