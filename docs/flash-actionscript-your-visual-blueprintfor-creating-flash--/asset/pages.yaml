  md: '# DUPLICATE ACTIONSCRIPT


    # DUPLICATE MOVIE CLIPS


    If you want to make a copy of a movie clip that is currently on the Stage, use
    the duplicateClip action. The duplicateMovieClip action enables you to create
    a new instance of a movie clip while it is moving. The syntax for the duplicateClip
    action is


    ```

    duplicateMovieClip(target, newName, depth);

    ```


    Use the target to specify the name of the instance that you want to duplicate.
    Use the newName argument to specify what name you want to give to the new instance.
    The depth argument is used to specify stacking order. Stacking occurs when objects
    overlap. An object with a higher depth number will appear in front of objects
    with a lower number. Assign each object you duplicate a depth number. If you place
    instance on the same depth level as an existing instance, the new instance replaces
    the existing instance.


    ActionScript does not copy the variables in the parent movie clip to the child
    movie clip. If you delete the parent movie clip, ActionScript will automatically
    delete the child.


    ActionScript places the movie clip directly on top of the parent. You can use
    the _x and _y properties to change the location of the duplicated movie clip.
    Each instance of the duplicated movie clip must have an incrementing number to
    the new instance to make each instance unique.


    Use the removeMovieClip action to remove instances created with the duplicateMovieClip
    action. The syntax is as


    ```

    removeMovieClip(target);

    ```


    Use the target to specify the movie clip you want to remove. You can also use
    the removeClip action to remove clips created with the attachMovie and duplicateMovie
    methods.


    Duplicated movie clips always begin in frame 1.


    # DUPLICATE MOVIE CLIPS


