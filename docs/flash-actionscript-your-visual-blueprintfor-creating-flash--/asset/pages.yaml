  md: '# INTRODUCTION TO FLASH AND ACTIONSCRIPT


    Flash is a graphics and animation software that enables Web developers to design
    and deliver low-bandwidth animations and presentations referred to as. With Flash,
    you can create interactive Web pages with both motion and sound. This book is
    about


    ActionScript, the scripting language that enables you to add interactivity to
    your Flash movie. With ActionScript, you can have your Flash movie respond to
    mouse clicks and key request information from the user and have your Flash movie
    respond to the information provided.


    # FLASH INTERFACE


    When you open Flash, the screen shown here appears:


    # LAYER


    Layers are transparent sheets that you can see through the layer beneath until
    you color. You create the graphics and animations that you want to use in your
    movie on.


    ![](img/72fce958343eeb5d6d0322213ea85399_17_0.png)


    # TOOLBOX


    The toolbox provides you with tools that enable you to select objects on the Stage,
    draw and graphics, and create text boxes. Use the toolbox to create and modify
    graphics and text.


    # TIMELINE


    The Timeline enables you to lay out the sequence of your movie. The Timeline includes
    frames, layers, and a playback.


    # MODIFIERS


    Once you select a tool, modifiers enable you to change stroke colors, fill colors,
    and the effect of tools. Use modifiers to set tool effects.


    You store the individual images that make up a movie in frames. The playback moving
    through successive frames displays the contents of each frame.


    # FRAMES


    # PLAYHEAD


    # STAGE


    As the playhead moves across the Timeline, Flash displays the image in each frame
    on the Stage. You create animation by changing the image in successive frames.


    You can create or import graphics. Use the Stage to create your movie.'
