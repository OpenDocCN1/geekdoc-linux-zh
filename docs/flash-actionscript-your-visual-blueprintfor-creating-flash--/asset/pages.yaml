  md: '# FLASH ACTIONSCRIPT


    # INTRODUCTION TO ACTIONSCRIPT SYNTAX


    ActionScript is the language used to communicate with Flash. ActionScript can
    consist of a single statement or a series of statements. Statements provide Flash
    with instructions unless you tell Flash to execute in another order. You can use
    the if action and loops to change the normal top order of execution.


    An argument — also referred to a parameter — is a value associated with an action
    or function. These values clarify or provide additional instructions to Flash.
    For example, you use the gotoAndPlay action to tell Flash to start a movie. The
    gotoAndPlay action takes two arguments: scene and frame. You use the scene to
    tell Flash which frame you want to play. You use the movie or movie clip to begin
    playing. You separate the arguments associated with an action or function with
    commas and enclose them in parentheses. The values can be either; literal values
    are enclosed in quotes. For example, gotoAndPlay("Scene 2",5) tells Flash to go
    to Scene 2 and start playing the movie in Frame 5.


    Like spoken languages, ActionScript has punctuation and grammar rules. You must
    follow these rules for your script to execute properly. For starters, each ActionScript
    statement ends in a semicolon. If you omit the semicolon, the script will still
    execute in blocks of code. Enclose each block of code in curly braces. In ActionScript,
    only keywords are case-sensitive. For a complete list of keywords, see Chapter
    ten.


