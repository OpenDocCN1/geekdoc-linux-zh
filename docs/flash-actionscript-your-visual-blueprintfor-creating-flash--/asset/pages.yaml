  md: '# CHANGE THE CASE OF A STRING


    You can use the string.toLowerCase and string.toUpperCase methods to change the
    case of your text. When you are formatting output or when you want to compare
    strings without regard to case. The string.toLowerCase turns all characters that
    are not already lowercase to lowercase. The string.toUpperCase turns all characters
    that are not freely uppercase to uppercase.


    The syntax for the string.toUpperCase method is similar to the syntax for the
    string.toLowerCase method. To use the string.toUpperCase method simply precede
    the word toUpperCase with the string you want to convert to uppercase followed
    by a period. Then follow the word toUpperCase with parentheses.


    To use the string.toLowerCase method, simply precede the word toLowerCase with
    the string you want to convert to lowercase followed by a period. Then follow
    the word toLowerCase with parentheses.


    Example:


    ```

    userEntry = "hello";

    sampleText = userEntry.toUpperCase();

    ```


    Example:


    ```

    userEntry = "hello";

    sampleText = userEntry.toLowerCase();

    ```


    Result:


    hello


