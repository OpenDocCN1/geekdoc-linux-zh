  md: '# FIND THE LENGTH OF AN ARRAY


    Knowing the length of an array can be useful, particularly if you are looping
    through the data. Knowing the length helps determine how many times you need to
    loop. The length of an array is equal to the highest index plus one. If the highest
    index in an array is nine, the array has a length of ten. Array.length returns
    the length of an array.


    Use the arrayName argument to specify the name of the array. Use the length to
    specify an integer that represents the length of the array. For example, in trees
    = newArray(6), note that even if you have not assigned elements to an array, the
    array has a length of 6. The array has a length of 6 because ArrayScript reserves
    the space for the elements.


    The syntax for Array.length property is arrayName.length;


    Update the length automatically as you add elements to an array. For example,
    if you use the new Array constructor to create an array, the array has a length
    of 0. If you add index position [1], the array has a length of 1. If you add index
    position [2], the array has a length of 2. If you add index position [10], the
    array has a length of 10. Positions [3] through [9] do not have values assigned
    to them; however, ArrayScript reserves the space for these elements.


    Use the arrayName argument to specify the array whose length you want to obtain.


    You can create an empty array of a specified length by using the constructor new
    Array. The syntax for creating an empty array of specified length is


    ```

    arrayName = new Array(length);

    ```


