  md: "# FLASH ACTIONSCRIPT\n\n# DEBUG YOUR SCRIPT\n\nhere are techniques that you\
    \ can use to effectively create and debug ActionScript. For starters, you should\
    \ build your model in a modular fashion, testing each section as you develop.\
    \ This enables you to identify problems as they arise.\n\nAs you create your code,\
    \ you should save often, giving each save a different version number. If your\
    \ script gets extremely complex and throws, this enables you to go back to the\
    \ last working version of your script.\n\nIf a portion of script does not work,\
    \ try breaking it down into component parts. This enables you to determine which\
    \ portion of the script is faulty. You can also comment out portions of the script\
    \ and test again, which helps narrow down where the error is located.\n\nUse comments\
    \ to document your code. This is important when working with other developers.\
    \ Even if\n\nyou do not work with developers, comments are important. You may\
    \ need to revise your code weeks, months, or years later. It is very easy to forget\
    \ the logic that you developed use. Use comments to explain what you are doing\
    \ and why you are doing it.\n\nGive the arrays, functions, and objects you meaningful\
    \ names. This will make it easier for others and who view your code to understand\
    \ your code.\n\nDevelop a naming convention and stick with it. For example, you\
    \ can type the first word in a variable in small letters, and subsequent words\
    \ start with capital letters. The variable playerFirstName is an example of this.\n\
    \nWhen trying to debug a movie by someone else, use Explorer to find and fix ActionScript.\n\
