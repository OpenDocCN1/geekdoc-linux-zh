  md: '# FLASH ACTIONSCRIPT


    # CREATE OBJECTS USERS CAN DRAG


    You can use the startDrag action to create objects users can drag. Any movie clip
    or button can be draggable. The steps for the startDrag action is


    startDrag(target, lock, left, top, right, bottom)


    Use the target argument to specify the path to the movie clip or button you want
    to make draggable. You can use the this keyword to mark the object that ActionScript
    drags.


    Use the lock argument to specify the Boolean value true if you want Flash to lock
    the pointer to the center of the object as drags. Use the Boolean value false
    if you want Flash to lock the pointer to the point where you pressed the mouse
    button. The lock argument is optional.


    The left, right, top, and bottom arguments to specify the rectangle within which
    the user can drag the object. You specify the area using the number of pixels
    from the top and left borders of the movie. The upper corner of the movie has
    a value of 0, increasing as you move upward. The lower corner of the movie has
    a value of 0, increasing as you move downward. These arguments are optional.


    Only one object can be draggable at a time. An object remains draggable until
    you execute a stopDrag or another stopDrag action. Use the stopDrag action to
    stop the current drag operation.


    The syntax for the stopDrag action does not take any arguments, so it has no parameters.


