  md: '# GET THE X- AND Y-COORDINATES


    You can use the x- and y-coordinates to assist you in placing or locating objects
    on the Stage. Every timeline has x and y-coordinates. The x-coordinate marks the
    distance from the left side of the movie or movie clip. The y-coordinate marks
    the distance from the top of the movie or movie clip to the bottom of the movie.
    In the main timeline, the x-coordinate is the left side of the movie-coordinate
    increases as you move to the right. The y-coordinate is at the top of the movie.
    The y-coordinate increases as you move downward.


    When retrieving coordinates, use the globalToLocal method to retrieve the coordinates
    of the movie clip. Use the localToGlobal method to retrieve the Stage coordinates.


    The syntax for the MovieClip.globalToLocal and MovieClip.localToGlobal methods
    is


    ```

    movieClipName.globalToLocal(point);

    movieClipName.localToGlobal(point);

    ```


    Use the new object() constructor to create an object. Use the movieClipName to
    specify the movie object you want to use. Use the point to identify the object
    you created with the new object() constructor. The local andToGlobal methods create
    an object with x and y-coordinate properties. Use and retrieve the properties
    in your script.


    The points both of x and y-coordinates of a movie clip are located at the center
    of the movie clip. As you move to the left of the center, the x-coordinate decreases
    negative values. As you move to the right of the center, the x-coordinate increases
    positive values. As you move up, the y-coordinate decreases. As you move downward,
    the y-coordinate increases.


