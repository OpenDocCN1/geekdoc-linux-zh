  md: '# CREATE STATIC TEXT BOXES


    Text boxes enable you to include text in your movie, accept user input, and display
    text. You use static text boxes to display text that will not change, dynamic
    text boxes to change, and input boxes to request information from the user. Your
    text box can be single line fixed width or editable. Single line text wraps as
    you type. A round handle in the upper-right corner of a text box indicates that
    the box is a single line box. Fixed width text box wraps as you type. A square
    handle in the upper right corner of a text box indicates that the text is a fixed
    text box. Editable text box lets you accept user input or dynamically display
    text. A square or round handle in the bottom right corner of the text box indicates
    that the box is an editable text box.


    Flash gives you the ability to set the font, size, style, and alignment of your
    text, using the Text menu options. You can set the color of the font by using
    the color modifier.


    You can use embedded or device fonts. When you use a font that you installed on
    your system, Flash embeds the font in the movie. Flash does this to ensure the
    font will display properly as the movie plays. As an alternative to an embedded
    font, you can use a device font. When using a device font, Flash uses the font
    on the local computer where the movie is played. If Flash does not embed device
    fonts, they reduce your file size. Also, if the point size of your font is less
    than 10, using a device font can yield a crisper, sharper text. Flash supplies
