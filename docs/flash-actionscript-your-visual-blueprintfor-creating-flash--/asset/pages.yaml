  md: '# USING THE ACTIONS PANEL


    ActionScript is the scripting language that enables you to add interactivity to
    your movie and to control objects. You can use ActionScript statements to instruct
    how to respond to the user mouse clicks and key presses, or you can use ActionScript
    to have your movie respond to clicking a button.


    You can create ActionScript in the Action panel. ActionScript is always associated
    with a frame, button, or movie. With the Arrow tool, you select the frame, button
    with which to associate ActionScript; then you open the Action panel. The Action
    panel has two modes: Normal and Expert. In Normal Mode, fields in the Parameters
    panel prompt you for the correct statement arguments. In Expert Mode, you write
    and edit statements in a text box. Working in Expert Mode is similar to a text
    editor.


    In Normal Mode, you can select statements from the Toolbox list on the right side
    of the Action panel. The Toolbox list divides statements into the following categories:
    Basic Actions, Actions, Operators, Functions, Properties, and Objects. You can
    double-click statements to select them. You can also select statements by clicking
    the Add button with category statements the same way the Toolbox list does. You
    use the Delete button to delete statements. The Parameters panel shows selected
    statements.


    After you select a statement, the statement appears in the Actions list on the
    right side of the Action panel. You can change the order of statements by clicking
    the Order buttons. The up arrow moves the statements down. You can also move the
    statements by clicking and dragging them.


    ![](img/72fce958343eeb5d6d0322213ea85399_39_0.png)


    +   1 In the Toolbox list, click the category name to display the statements in
    the category.


    +   2 Double-click a statement to select it.


    +   3 Click the Add a Statement button (+ ) to display statement categories.


    +   4 Click a statement from the drop-down menu.'
