    You can use the logical operators logical AND and logical OR to compare two Boolean
    values and return a third Boolean value. Logical operators enable you to evaluate
    multiple conditions. They are often used with statements. ActionScript uses &&
    as the logical operator and || as the logical OR. To use AND or logical OR, place
    the operator between two expressions that can evaluate to true or false. The syntax
    for logical operators is


    When you use the logical AND, if expression1 evaluates to true and expression2
    evaluates to true, the logical AND returns true. If expression1 or expression2
    evaluates to false, the logical AND returns false. When you use OR, if expression1
    evaluates to true, the logical OR returns true. If expression1 and expression2
    evaluate to false, the logical OR returns false.


    ActionScript uses the NOT to reverse the value of an expression. If expression
    evaluates to true, an ! in front of the expression causes it to evaluate to false.
    If expression evaluates to false, a ! in front of the expression causes it to
    evaluate to true. The syntax for the logical NOT is


