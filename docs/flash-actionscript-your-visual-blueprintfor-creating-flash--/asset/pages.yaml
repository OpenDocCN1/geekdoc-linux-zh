  md: '# HOW TO USE THIS BOOK


    Flash ActionScript: Your visual blueprint for creating Flash-enhanced Web sites
    uses straightforward examples to teach you how to create powerful and dynamic
    Web sites. The coding style and examples found in this book are used for instructional
    purposes. Once you are comfortable working with Flash ActionScript, you can use
    the coding methods that suit your needs.


    To get the most out of this book, you should read each chapter in order, from
    beginning to end. Each chapter introduces new ideas and builds on the knowledge
    learned in previous chapters. Once you become familiar with Flash ActionScript,
    this book can be used as an interactive desktop reference.


    # Bold


    Indicates information that you may type.


    # Itics


    Indicates a new term being introduced.


    # Apply It


    An Apply section usually contains a segment of code that takes the lesson you
    just learned one step further. Apply It sections offer inside information and
    pointers that can be used to enhance the functionality of your code.


    # Extra


    An Extra section provides additional information about the task you just accomplished.
    Extra sections often contain interesting tips and tricks to make working with
    Flash ActionScript easier and more efficient.


    # Who This Book Is For


    If you are looking for a resource that will help you get started learning ActionScript,
    Flash ActionScript: Your visual blueprint for creating Flash-enhanced Web sites
    is for you. This book will walk you through the tasks you need to start and familiarize
    yourself with the essentials of working with Flash ActionScript.


    No experience with ActionScript is required, but familiarity with Flash is essential.


    Experience with programming languages is also an asset, even if you have no programming
    experience, you can use this book to learn the essentials you need to work with
    Flash ActionScript.


    # What You Need To Use This Book


    The tasks in this book are developed using Flash 5 for Windows 98, and NT. To
    perform the tasks in this book, you need Flash 5 and Flash Player installed on
    your computer. You should also have a Web browser with Internet Explorer or Netscape.


    # The Conventions In This Book


    A number of typography and layout styles are used throughout Flash ActionScript:
    Your visual blueprint for creating Flash-enhanced Web sites to distinguish different
    types of information.


    # Courier Font


    Indicates the use ActionScript.


    # The Organization Of This Book


    Flash ActionScript: Your visual blueprint for creating Flash-enhanced web contains
    14 chapters.


    The first chapter, Getting Familiar with Flash, provides a review of Flash introduces
    you to the ActionScript.


    Chapter 2, Programming with ActionScript, introduces you to ActionScript. Learn
    to move and stop movies, move quote by frame or to a URL, check if a frame is
    created, create separate objects, communicate with Flash, and Play Movies. This
    chapter illustrates ActionScript by stepping you through examples and explaining
    the syntax of selects.


    Chapter 3, Movie Clip Properties, demonstrates how you use properties. Properties
    are attributes associated with a movie clip. For example, the visible property
    determines whether a movie clip is visible or hidden. This chapter explains properties
    and steps you through sample scripts that use properties.


    Chapter 4, Working with Variables and Strings, shows how to use variables and
    manipulate string. Variables can be viewed as containers that store information.
    You can assign information to a variable or use a variable


    XIV'
