  md: '# INTRODUCTION TO VARIABLES

    AND DATA TYPES


    You use variables to store information for later use.

    The syntax for creating a variable is

    variableName = value;


    The variableName argument represents the name you give to the variable. The equal
    sign (=) is an assignment operator. The assignment operator tells ActionScript
    you want to assign to a variable. Value represents what you want to assign to
    the variable. Once a value has


    been assigned, whenever you use the variable name, the

    assigned value is retrieved. For example, if you make the

    following assignment:


    ```

    x = 2

    ```


    every time ActionScript sees the variable x, it interprets it as

    mean2. You can change the value assigned to a variable

    many times and at any point in your script.


    In ActionScript, a variable can store the following data

    types: string, Boolean, movie clip, or object. A

    string is any sequence of characters consisting of

    letters, numbers, or punctuation marks.

    A number is for which you can perform

    mathematical operations such as addition (+),

    subtraction (-), multiplication (*), division (/)

    %), increment (++), or decrement (--). A Boolean is

    value that is true or false. A movie clip is

    that can play flash animation. Objects are used to

    manipulate data, and movie clips.


    You do not have to define the variable type before

    assigning to a variable. ActionScript examines

    t expression and determines whether the variable is a

    number, string, Boolean, or movie clip. If you

    change the value assigned to a variable, if necessary,

    for example when assign x = 25; ActionScript

    evaluates the expression and determines that x is a

    number. If you change the assignment reevaluate the expression

    d determines that x is a string.


    ActionScript variables can be either global or local. A

    global variable can be referenced by any movie clip on

    time. Global variables are said to have an unlimited scope. A local variable can
    be referenced only

    within the braces that enclose its block of script.

    Local variables have a limited scope. Each variable

    have a unique name within its scope. Each global

    variable must be unique within the scope. Each

    braces enclose it.


    You use the assignment operator (=) to assign a value to

    a local variable. In the example here, the value

    25 is assigned to the local x.


    ```

    Example:

    var x = 25;

    ```


    You use the setVariables action or the assignment

    operator (= to declare global variables. The following

    two examples set global variables and are equivalent.


    Declaring a variable lets ActionScript know that

    a variable exists if no value has been assigned to it.

    You use the var statement to declare a local variable.

    in the example here, the variable x is declared as a

    local variable.


    ```

    Examples:

    x = 25

    set(x,25);

    ```


    Global variables are often initialized in the first frame of

    movie. Initializing a variable consists of

    initial value of the variable.


    ```

    Example:

    var x;

    ```'
