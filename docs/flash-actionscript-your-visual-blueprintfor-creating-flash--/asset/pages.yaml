  md: '# FLASH ACTIONSCICRIPT


    # NAME AN INSTANCE


    To change the properties, or target a movie clip, the movie clip instance must
    have a unique name. Each time you drag a movie clip from the Library into the
    Stage, you create a new instance of that movie. Each instance has a unique name,
    so you can use ActionScript to manipulate instances independently of the other
    instances. You can move instances while other instances remain motionless. You
    can change the color of instances, while the others are unaffected.


    number. You cannot view assigned names in the Instance panel. However, assigned
