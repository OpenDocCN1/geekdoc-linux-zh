  md: '# MAKE MOVIE CLIPS INVISIBLE


    You can use the _visible property to make a movie or movie clips visible or invisible
    to the user. Property is useful when you have a movie clip that do not want to
    see until the movie reaches a particular frame, or a particular action has occurred.


    you set the _visible property of a clip associated with a button''s up, down,
    and over state to false, users will not be able to see or click the button.


    Before you change the _visible property of a movie clip instance, the instance
    must have a name. You use the Instance panel to make a movie clip instance. The
    syntax for _visible property


    You retrieve the _visible property. When writing, you must retrieve the _visible
    property of movie clip to define what actionScript should perform. For example,
    you can create a button that toggles the visibility of a clip on and off. If the
    _visibility value is true, the script will set the visibility to false. If the
    _visible value is false, the script will set it to true. For retrieving the _visible
    property


    ```

    instanceName._visible = BooleanValue;

    ```


    instanceName argument used to specify the instance for which you want to change
    the _visible property. Use the BooleanValue argument to set the value to true
    or false. If you set the value to true, the movie clip is visible. If you set
    the value to false, the movie clip is not visible.


    ```

    instanceName._visible;

    ```


    Use the instanceName argument to specify the name of the instance for which you
    want to change the _visible property.


    A movie clip that is not visible is not active. The user cannot interact with
    it if it is not active.


    ![](img/72fce958343eeb5d6d0322213ea85399_85_0.png)


    +   1 Select the frame, button, or movie clip which you want to add ActionScript.


    +   This example uses visible file, which you can find on the CD that accompanies
    this book.


    +   2 Click Window to open the Actions panel.


    +   3 Click Properties to select the _visible property.'
