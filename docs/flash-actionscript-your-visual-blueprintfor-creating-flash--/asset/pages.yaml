  md: '# FLASH ACTIONSCRIPT


    # CREATE TRIGONOMETRIC SPECIAL EFFECTS


    You can use the Math object or cos methods with _xscale, _yscale, _height, _width,
    _rotation, and _alpha properties to create special effects. The _height and _width
    properties change the height and width of movie clip using pixels. The _xscale
    and _yscale properties change the height and width of movie clip using a percentage.
    Because these two methods provide different ways to achieve the same result,


    The _xscale property can produce the illusion of an object flipping from left
    to right. The _yscale property can produce the illusion of an object flipping
    up and down. The _height and _width properties shrink and grow an object. The
    _rotation produces a spinning effect. The object spins in one direction and spins
    in the opposite direction. The _alpha property fades in or out.


    ```

    movieClip._x = Math.sin(s)*nmovieClip._y = Math.cos(s)*

    ```


    The s represents an angle. Use movieClip to define the name of the movie clip
    you want to change. Use s to adjust the speed at which the properties change.
    The higher the value of s, the faster the movie will move. Use a to change the
    _height, _width the maximum size of the object. Remember, _height and _width use
    pixels, and _xscale and _yscale use a percentage. Use the rotation to adjust the
    number of rotations the object spins clockwise before spinning counterclockwise.


    You may use the formula Math.PI/180 * 2 as a base from which to adjust the speed
    of your object.


