  md: '# INTRODUCTION TO OBJECTS


    Objects enable you to access information, or graphically represent movie clips
    on the Stage. Flash predefines objects and you can create your own objects. Most
    of the objects predefined by Flash methods allow you to obtain values or perform
    actions. Objects can also have properties.


    ActionScript defines the following objects: Array, Boolean, Color, Date, Key,
    Movie, MovieClip, Object, Selection, Sound, XML and socket. Each object enables
    you to access certain types of information or perform actions. For example, the
    Math object has methods that help you manipulate numbers. The MovieClip object
    has methods that help you perform actions on movie clips.


    You can create a new object using the new operator. A constructor function is
    used to create objects. You can use the new operator to create an object from
    a predefined class. When using the new operator you must use it with a constructor
    function. Every predefined class has a constructor function.


    The syntax for the new operator is


    ```

    constructor().

    ```


    Use the constructor argument to specify the constructor function or the type of
    object to create. Examples include Color, Sound and Date. You pass arguments by
    placing them between parentheses. The syntax follows a Color object:


    ```

    newColor = new Color(sampleMC);

    ```


    Color is the constructor. The newVar Color holds the object. The instance sampleMC
    is the movie clip you want to target. Creating an object with the new operator
    instantiates the object or creates an instance of the object.


    An instantiated object has all of the properties and methods of the object from
    which it was created. Some of the objects predefined by Flash require you to instantiate
    the object before you can access the methods and properties of the object.


    ![](img/72fce958343eeb5d6d0322213ea85399_159_0.png)


