  md: '# FIND NUMERIC VALUES


    The Math.max method enables you to compare two numbers to determine which is larger.
    The Math.min method enables you to compare two numbers to determine which is smaller.
    When an expression returns a value and you need to know the larger or the smaller
    of the two, use Math.max or Math.min.

    The syntax for the Math.max method is Math.max(x, y, ...);

    The syntax for the Math.min method is Math.min(x, y, ...);


    If you need to know the positive value of a number regardless of the sign of the
    value, use the Math.abs method. If you send a negative number to the Math.abs
    method, Math.abs returns a positive number. Math.abs always returns a positive
    number regardless of the value sent to it. The syntax for it:

    Math.abs(x);


    Use the x argument to specify the number or expression you want to compare. For
    example, Math.max(23, 4) compares 23 and 4 and Math.min(23, 4) compares 23 and
    4; if you send two values, Math.max and Math.min will return the value you sent.
    You can compare non-numeric characters. If you send a non-numeric value to Math.max
    or Math.min, the method will return NaN.


    You can use the Math.abs method with integers or floating-point numbers. If you
    assign a non-numeric value to Math.abs, it will return NaN.


    ![](img/72fce958343eeb5d6d0322213ea85399_211_0.png)


