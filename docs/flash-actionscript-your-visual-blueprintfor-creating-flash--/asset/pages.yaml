  md: '# FLASH SCRIPTING


    # # CREATION ROTATION EFFECTS


    It is obvious that you can use movie clips to create special effects. What may
    not be as obvious is how easy it is to create them. For example, you can use the
    rotation property to set the value of an object. When you place an object on the
    Stage, it has a rotation value of 0. To rotate the object clockwise, increase
    the value. To rotate the object counterclockwise, decrease the value.


    fact, you should try it with each of the movie clip and button stations.


    If you add some additional script to the _rotation = _rotation + x expression,
    you can create an object that rotates when you roll it and stops rotating when
    you release the mouse.


    You can make many interesting effects using the expression _rotation = _rotation
    + x, where x is equal to the speed you want the object to rotate. The higher the
    value of x, the faster the object will rotate. Negative x rotates the object counterclockwise.


    If you use the _rotation = _rotation + y expression along the property or _y value,
    you can rotate object at the same time. However, you will have to add some additional
    code to limit the area in which the object can move, or your object may move off
    the Stage. You can also use the expression _rotation = _mouse to create an interesting
    effect.


    Use _rotation = _rotation + x with onClick(enterFrame) to create an object that
    rotates continuously. You can use mouse to rotate the object when you move mouse.
    Use mouse to rotate the object by clicking your mouse.


    Keep in mind that a rotating object rotates around its registration point. You
    can change the registration point to change the angle.


