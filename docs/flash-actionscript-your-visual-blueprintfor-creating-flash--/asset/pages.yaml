  md: '# FLASH ANICSCRIPT


    # Convert SYMBOLS


    But buttons have several handlers that you can use to trigger actions. Movie clips
    also have handlers that you can use to trigger actions. There are times when you
    need to use both movie and button handlers. In such cases, you must convert a
    button to a movie clip or vice versa.


    Creating a button that executes a continuous action is a good example of when
    you need to convert a button to a movie clip. If you convert a button that executes
    a continuous action, such as rotating the object when the user clicks the object
    and rotating the object as the user holds the button down, you need to use the
    button on(press) and (release) handlers and the movie clip onClipEvent(enterFrame)
    handler.


    The on(press) handler triggers actions when the user clicks the object. The on(release)
    handler triggers actions when the user releases the mouse. Use on(press) to start
    a continuous action and on(release) to stop continuous action.


    A handy technique for creating continuous actions is to create a one-frame movie
    or movie clip with the onClipEvent(enterFrame) handler. When you use the onClipEvent(enterFrame)
    handler with a one-frame movie, the actions in the frame execute continuously,
    creating a continuous action.


    To use these actions with one another, you must create the button that starts
    and stops the action, and then convert the button to a movie clip. Use the Properties
    dialog box to convert a button to a movie clip.


    Creating an object that users can click and drag is another common example of
    when you need to convert a button into a movie clip. For more information on creating
    a draggable object, see Chapter 2.


