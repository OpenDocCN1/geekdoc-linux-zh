  md: '# CREATE ANIMATION


    You use Flash to animate. You can rotate or move objects, fade them in and out,
    or change their size or shape. You can animate objects independently or have them
    move and change in concert.


    You creating animation by changing the content of successive frames. Flash uses
    two types of animation: frame-by-frame and tweening. In frame-by-animation, you
    place an image in each successive frame of the animation. In tweening, you place
    an image in two frames and Flash interpolates the frames between them by varying
    size, location, or other attributes. Tweened animation utilizes significantly
    less space than frame-by-animation, because Flash stores only the values for the
    changes in the animation. With frame-by-animation, Flash stores values for each
    frame.


    The two types of tweened animation are motion and shape. With motion tweening,
    you set the position, rotation, skew, color, or size of an object in a start frame;
    then you change the [properties] of an object in an end frame. Flash interpolates
    the frames between them. With shape tweening, you draw a shape in a start frame
    and an end frame; Flash interpolates the frames in between, changing the shape
    in the start frame to the end frame.


    The start and end frames of a tween are keyframes. If you change the number of
    frames between the start and end frames, Flash automatically tweens the frames
    again. You can tween instances and text.


    # CREATE ANIMATION


    ![](img/72fce958343eeb5d6d0322213ea85399_29_0.png)


    ![](img/72fce958343eeb5d6d0322213ea85399_29_1.png)


    +   1 Click to select a keyframe.


    +   2 Draw an object on the Stage or draw an instance from the Library.


    +   3 Click to select the Keyframe in where you placed the object.


    +   4 Insert > Create Motion Tween.

    If you draw an object on the Stage, Flash automatically converts the object to
    a symbol and names the object Tween 1.


    +   5 Click in the frame in which you want the animation to end.'
  merge: -1
