  md: '# SETTING MOVIE CLIP PROPERTIES


    # Extra


    You can use the Flash menu to rotate an object. Select an object, handles then
    click Modify -> Rotate. Handles will appear around the object. Use the mouse to
    grab the handles then drag to rotate. Select an object and click Modify -> Transform
    -> Rotate 90 CW to rotate an object 90 degrees clockwise. Select an object and
    click Modify -> Transform -> Rotate 90 CCW to rotate an object 90 degrees counterclockwise.
    You can also use the Arrow tool rotate to rotate objects.


    Every symbol and instance of a symbol has a registration point. By default, the
    registration point is the center of the object. Objects rotate around their registration
    point. To change the registration point, select the object, click Modify -> Edit
    Center from the menu, and drag the registration point to a new location.


