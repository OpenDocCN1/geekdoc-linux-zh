  md: '# VIEW THE HIERARCHY OF MULTIPLE MOVIES


    You create Flash movies on a Timeline. ActionScript refers to the main Timeline
    as level0. You create other levels when you use the loadMovie command to load
    SWF files. You assign newly created levels as a number. You can use any level
    number, but only one movie can be on a given level at time.


    You can turn a Flash movie into a movie clip. You can embed a movie clip symbol
    within a Flash movie, and you can embed multiple instances of a movie clip inside
    other clips. Load movies can have movie clips on their Timeline. In addition,
    those movie clips have clips on their Timelines.


    Flash Player organizes the movies and movie clips in your hierarchy, called the
    display list. Movie


    When you place a movie or movie clip on the Timeline of another movie or movie
    clip, they form a relationship. The Timeline on which you place the movie or movie
    clip is the parent. Any change that you make to the parent will affect the child.


