  md: '# SET VOLUME AND PANNING


    actionScript provides methods that enable you to adjust volume and panning or
    to give you the ability to adjust the volume and panning. You use the setVolume
    method to adjust sound volume. The syntax for the setVolume method is


    ```

    soundName.setVolume(volume);

    ```


    Use the soundName argument to specify the name of the sound object. Use the pan
    argument to specify an integer between -100 and 100. A pan of -100 only uses the
    left speaker. A pan of 0 equals the center between the two speakers. You can use
    setPan to fade sound from one speaker to the other.


    Use the soundName argument to specify the name of the sound object. Use the volume
    argument to specify an integer between 0 and 100 represents the volume level.
    A value of 100 represents full volume. A value of 0 represents no volume. The
    default is 100.


    To obtain the current volume level, use the getVolume method. The syntax for the
    getVolume method is


    ```

    soundName.getVolume();

    ```


    Use the getPan method to obtain the current pan value. The syntax for the getPan
    method is


    ```

    soundName.getPan();

    ```


    The getVolume method returns a value between 1 and 100 that represents the current
    volume.


    ActionScript includes a soundbuffer action. The soundbuffer action establishes
    the number of seconds of streaming to buffer. The default is 5 seconds. The syntax
    for the soundbuffer action is


    You use the setPan method to control how sound is played in each speaker. The
    syntax for the setPan method is


    ```

    soundbuffer = integer;

    ```


