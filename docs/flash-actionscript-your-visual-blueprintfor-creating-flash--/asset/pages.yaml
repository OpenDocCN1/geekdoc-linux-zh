  md: '# USING THE DEBUGGER


    Correcting errors — often referred to as debugging — is a normal part of writing
    a program. Flash provides several tools to help you debug ActionScript. Use the
    Debugger to display a list of loaded movies, clips, properties, and instances.
    The Debugger enables you to view and adjust the properties and variables as the
    movie runs during debugging. You can then return to your script and make the necessary
    changes.


    The Debugger consists of a status bar, display list, Properties tab, and Watch
    list. The status bar displays the URL or path to a movie or clip.


    The display list displays all levels and instances that are currently loaded.
    As you add or remove movies and clips from the Stage, the display list automatically
    updates. A splitter enables you to open, close, or resize the display list.


    The Properties tab displays all the properties associated with a movie clip. You
    can change a property value by double-clicking the property value and typing a
    new value. You cannot use an expression to change a value when using the Debugger.
    You must enter a string, Boolean, or number. When you change a property value,
    Flash reflects the change on the Stage immediately. You can


    The Variables tab displays all the variables and the current values of the variables.
    You can change the value of a variable by double-clicking the variable and typing
    a new value. Object and array values are displayed, but you cannot change


    If you have variables that you want to track, you can place them on the Watch
    list. The Watch list enables you to track a specified list of variables.


    ![](img/72fce958343eeb5d6d0322213ea85399_283_0.png)


    ![](img/72fce958343eeb5d6d0322213ea85399_283_1.png)


    +   1 Click Window -> Debugger to open the Debugger.


    +   2 Click Control -> Debug Movie to activate the Debugger.'
