    13. Do not use the name assigned to the instance by Flash in your script. Use
    the name assigned to the instance to use the movie clip and in your script.


    You can use the name to rename a movie clip instance. The syntax for renaming
    a movie clip instance is instanceName=newName;


    The instance name argument is used to specify the instance for which you want
    to change the name. Use the following changes the name of a movie clip to sampleMC._name=yourMC;


    You use the instance name of instances of movie clips. When you select a movie
