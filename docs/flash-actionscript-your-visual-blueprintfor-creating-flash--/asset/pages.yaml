    Control ⌤ Debug Mode.


    You can use the Flash Debug Player as a standalone player. If you choose Debugging
    Permitted the tab of the Publish Settings dialog box, you can use the Debugger
    as you play your movie. Just click Control ⌤ Debugger in the Flash Debug Player
    menu. When using Debugger with the Flash Debug Player, Flash must be open. You
    may want to password-protect your movie because anyone using the Flash Debug Player
    will also be able to view your property and variable settings. The Flash tab of
