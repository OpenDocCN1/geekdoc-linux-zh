  md: '# ATTACH A MOVIE CLIP


    You can use the attachMovie method to add an instance of a symbol located in the
    Library to a movie clip located on the Stage. This method when you want to place
    an instance of a symbol that is not already on the Stage. Use this method instead
    when you want to start your movie with a blank Stage and add movie clips as the
    movie plays.


    the symbol in the Library to place on the Stage. The name you should correspond
    to the name in the Symbol Linkage Properties dialog box. you must set the symbol
    to Export in the Symbol Linkage Properties box. Use the name to specify the instance
    you want to give to the new instance. Use the depth to specify an integer that
    represents the length on which you want to place the new instance. the MovieClip
    argument if you want to attach the movie.


    Before you attach, you must assign an identifier and linkage type. Use the Symbol
    Linkage dialog box to assign the identifier and linkage type.


    You can use the attachMovie method to create multiple instances of the same clip
    and place them on the Stage. Use the _x and/or _y properties to set the location
    of the movie clip.


