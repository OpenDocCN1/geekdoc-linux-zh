    Note: This example uses file search.fla, which you can find on the CD-ROM that
    accompanies this book.


    +   Assign the result to a variable.


    +   Assign the variable with a text box.


    +   Initialize the variable.


    This example uses the startV variable to specify where the search should start.
    The variable startV is used as the indexOf argument.


