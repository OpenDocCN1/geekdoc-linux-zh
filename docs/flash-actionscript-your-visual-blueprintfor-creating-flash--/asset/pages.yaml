    false as an index of the variable arrayName="George", 23, false);


    Use the arrayName to specify the variable that names the array. Arguments e0 to
    eN specify the elements in the array.


    Each value in an array is an element. ActionScript assigns each element a unique
    number called an index. The first item in an array has an index of [0], the second
    index of [1], and so on. The variable that is [0, 23] has an index of [1]; and
    false has an index of [2].


