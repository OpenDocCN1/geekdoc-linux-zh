  md: '# OPERATORS


    You use operators to combine, compare, or modify values. The table that follows
    lists operators and their purpose.


    | OPERATOR NAME | PURPOSE |

    |---|---||

    | ! | Logical Not | Converts an expression that returns true to false and an expression
    that returns false to true. |

    | != | Inequality | Used to compare values. Returns true if two values are not
    equal. Returns false if they are equal. |

    | == | Quotes | Used to enclose strings. |

    | % | Modulo | Returns the remainder of expression divided by another expression.
    |

    | && | Short-Circuit AND | Evaluates two expressions. Returns true if expression
    1 and expression 2 true. |

    | () | Parenthesis | Groups expressions to control precedence. Encloses arguments.
    |

    | * | Multiplication | Multiplies expression1 by expression 2. |

    | + | Addition | Adds expression 1 to expression 2. |

    | ++ | Increment | Adds 1 to a value and returns the original value. |

    | - | Minus | Negates a number or subtracts expression 2 from expression 1. |

    | -- | Decrement | Subtracts 1 from a value and returns the original value. |

    | / | Division | Divides expression by expression 2. |

    | < | Less than | Compares two expressions. Returns true if expression 1 is less
    than expression 2. Returns false if expression 1 is not less than expression 2.
    |

    | <= | Less than equal to | Compares two expressions. Returns true if expression
    1 is less than equal to expression 2. Returns false if expression 1 is not less
    or equal to expression 2. |

    | != | Inequality | Used to compare two expressions. Returns true if the values
    are not equal and false if they are equal. |

    | == | Equality | Compares two expressions. Returns true if the expressions are
    equal; returns false if the expressions are not equal. |

    | > | Greater than | Compares two expressions. Returns true if expression 1 is
    greater than expression 2. Returns false if expression 1 is not greater or equal
    to expression 2. |

    | >= | Greater than equal to | Compares two expressions. Returns true if expression
    1 is greater than or equal to expression 2. Returns false if expression 1 is not
    greater or equal to expression 2. |

    | and | | Evaluates two expressions. Returns true if expression 1 and expression
    2 return true. Deprecated in Flash 5. |

    | not | | Converts an expression that returns true to false and an expression
    that returns false to true. Deprecated in Flash 5. |

