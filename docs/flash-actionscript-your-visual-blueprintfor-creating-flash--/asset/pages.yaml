    you can use to manipulate symbols and data. For example, the Math object is used
    to manipulate numbers. You can use the Math object to round a number. The Color
    object is used to manipulate color. You use the methods of the Color object to
    change the color of a movie clip.


    Chapter 1 provides a brief overview of how to create text, text boxes, dynamic
    text boxes, and movie clips. Since this chapter also covers Know Flash, all of
    the text, text boxes, and movie clips used in the samples have been created for
    you.


    Chapter 9, Demystifying Functions, teaches you how to create custom functions.
    Functions are blocks of ActionScript. You can pass values to a function and obtain
    values. For example, you can use a function to get the version of Flash Player.
    This chapter explains functions steps you through sample scripts that use functions.


    The sample files have all an FLA extension. Copy the files to the directory of
