    look as follows:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_13_0.png)


    As you can see, **wlan0** is the wireless interface created for the wireless adapter.
    Type in *ifconfig wlan0* to bring the interface up.


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_13_1.png)


    +   2. The MAC address 00:c0:ca:3e:bd:93 should match the MAC address written
    under your Alfa card. I am using the Edimax that gives me the'
