    ```


    The output will be as follows:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_158_0.png)


    +   **7.** Once it is started, the tool runs through all the possible combinations
    for the WPS and attempts to authenticate. Once it does this, it will return the
