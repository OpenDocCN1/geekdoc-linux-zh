    ## 关于作者

    塔哈·纳西尔是来自伊拉克的安全研究员，在Web应用、基础设施及移动安全评估方面拥有丰富的实操经验。他曾任伊拉克EarthLink电信公司安全部门主管的助理，还曾为伊拉克的私营机构开展关于EarthLink电信安全实验室、基础设施及渗透测试的培训课程。他是获奖的计算机与网络安全专业人士，所属安全团队因一系列针对网络犯罪、恶意软件、互联网威胁、网络攻击、身份盗窃及数据库安全的防护项目获奖。

    他童年时期仅用3年就掌握了计算机基础知识。后来，他成功攻破一个为近2120名用户提供服务的无线网络的安全系统，导致该无线网络中断18天。本书撰写时，他就读于伊拉克安巴尔大学人文学院英语系。

    他购置了大量IT安全相关书籍，经过7年的研读，他的能力得到提升，符合全球知名IT安全行业的认证标准。目前，他持有6项全球顶尖的IT安全认证，分别是CISSP（注册信息系统安全专家）、CISA（注册信息系统审计师）、CompTIA
    Security+、CompTIA Network+、CEH（注册道德黑客）、OSCE（进攻性安全认证专家）。

    ## 免责声明

    本书内容仅供教育用途，旨在帮助用户检测自身系统面临的信息安全威胁，保护IT基础设施免受类似攻击。本书作者不对读者不当使用本书学习材料所引发的任何行为承担责任。

