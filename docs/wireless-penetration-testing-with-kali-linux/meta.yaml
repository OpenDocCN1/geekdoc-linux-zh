    +   3. This installer is similar to the GUI-based installers of most Linux systems
    and should be simple to follow. Select the appropriate options in every screen
    and start the installation process. Once the installation is done, restart the
    machine as prompted and remove the DVD.


    4. Once the machine restarts, a login screen will be displayed. Type in the login
    as *root* and the password as whatever you set it to during the installation process.
    You should now be logged into your installed version of Kali. Congratulations!


    > > You can also install Kali within virtualization software such as VMWare and
