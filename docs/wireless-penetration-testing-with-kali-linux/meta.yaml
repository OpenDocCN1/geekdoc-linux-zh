    我们创建了多个SSID相同但安全配置不同的蜜罐。具体连接到哪个蜜罐，取决于客户端为“无线实验”网络存储的是哪项配置。这项技术非常实用，因为在执行渗透测试时，你很难知晓客户端笔记本上存储了哪些安全配置。通过给客户端设置诱饵，你就能找到对应的配置。这项技术也被称为**WiFishing**。你可以为同一个SSID在客户端上设置不同的安全配置，进而检验你部署的这套蜜罐能否检测到它们。需要注意的一点是，许多Wi-Fi客户端不会主动探测其配置文件中存储过的网络，因此我们此前讨论的技术可能无法检测到这类网络。


