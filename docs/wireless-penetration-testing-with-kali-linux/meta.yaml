    \ identified\n\n## Compromising clients\nAfter enumerating and testing all wireless\
    \ systems, there are various types of engagements that would suit performing attacks\
    \ against clients. If necessary, after establishing which clients are vulnerable\
    \ to Karma attacks, create a Honeypot to force them to connect with the methods\
    \ laid out in the Attacking PEAP section in Chapter 8, Attacking WPA-Enterprise\
    \ and RADIUS. There are various useful pieces of information that can be gathered\
    \ through this method, but ensure that the collected data serves a purpose and\
    \ is stored, transmitted, and used in an ethical and safe manner.\n\n## Reporting\n\
    Finally, at the end of testing, it is necessary to report your findings to the\
    \ client. It's important to ensure that the report matches the quality of your\
    \ testing. As the client will only see the report, you have to give it as much\
    \ love and attention as you do to your testing. The following is a guideline to\
    \ the layout of the report:\n1. Management summary.\n2. Technical summary.\n3.\
    \ Findings:\n   - Vulnerability description\n   - Severity\n   - Affected devices\n\
    \   - Vulnerability type—software/hardware/configuration\n   - Remediation\n4.\
    \ Appendices.\n\nThe management summary should be aimed at talking to a senior\
    \ nontechnical audience with a focus on the effects and mitigations required at\
    \ a high level. Avoid language that is too technical and ensure that the root\
    \ causes are covered.\n\nThe technical summary should be a midpoint between the\
    \ management summary and findings list. It should be aimed at a developer or a\
    \ technical lead with a focus on how to fix the issues and broad solutions that\
    \ could be implemented. The findings list should describe each vulnerability at\
    \ a low level, explaining the methods to identify, and replicate, and vulnerabilities.\
    \ Appendices should contain any extra information that would be too long to describe\
    \ in a short description. This is where any screenshots, proof-of-concept code,\
    \ or stolen data should be presented.\n\n## Summary\nIn this chapter, we discussed\
    \ a methodology for performing a range of wireless tests and referred to the relevant\
    \ chapters for each step. We also listed methods for reporting vulnerabilities\
    \ and techniques for making technical data presentable. In the next and final\
    \ chapter, we will cover new techniques developed since the initial publication\
    \ of this book, WPS, and probe monitoring for surveillance.\n\n## Chapter 10:\
    \ WPS and Probes\nThis chapter incorporates the new techniques related to attacking\
    \ WPS and probe monitoring and also covers the pineapple tool that makes much\
    \ of wireless testing a lot easier. These attacks and tools have appeared since\
    \ the publication of the original book, and we'll be making sure we're being as\
    \ holistic as possible.\n\n## WPS attacks\nWireless Protected Setup (WPS) was\
    \ introduced in 2006 to help users without wireless knowledge to have secure networks.\
    \ The idea was that their Wi-Fi device would have a single hidden hardcoded value\
    \ that would allow access with key memorization. New devices would be authenticated\
    \ through a button press on the Wi-Fi router. Individuals outside the house without\
    \ access to the device would not be able to have access, thus reducing the issues\
    \ surrounding remembering WPA keys or setting short ones.\n\nIn late 2011, a security\
    \ vulnerability was disclosed enabling brute force attacks on the WPS authentication\
    \ system. The traffic required to negotiate a WPS exchange was spoofable, and\
    \ the WPS pin itself is only eight characters between 0-9. To start with, this\
    \ provides only 100,000,000 possibilities in comparison with an eight character\
    \ a-zA-Z0-9 password having 218,340,105,584,896 combinations. However, there are\
    \ further vulnerabilities:\n- Of the eight characters of the WPS pin, the last\
    \ character is a checksum of the previous seven and therefore predictable, leaving\
    \ a maximum of 10,000,000 options\n- In addition, the first four and the following\
    \ three of the remaining characters are checked separately, which means that there\
    \ are 10⁴ + 10³ options or 11,000\n\nThrough the two decisions made in the authentication\
    \ mechanism, we have gone from 100,000,000 possible combinations to 11,000. This\
    \ equates to a six hour difference when brute-forcing the algorithm. It is these\
    \ decisions that make attacks against WPS viable.\n\nFollow the given instructions\
    \ to get started:\n1. Before we attack a WPS-enabled access point, we need to\
    \ create one. The TP-Link we use has this feature turned on by default, which\
    \ is worrying but handy. To double-check this, we can log onto our router and\
    \ click on WPS. It should look like the following:\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_156_0.png)\n\
    2. Now we've confirmed that it's ready. We need to set up our target. We need\
    \ to set up our testing environment. We're going to use the Wash tool, and Wash\
    \ requires a monitoring interface to function. As we have done many times before,\
    \ we need to set up one with the following command:\n   ``` airmon-ng start wlan0\
    \ ```\n   The output will be as follows:\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_157_0.png)\n\
    3. We have a monitoring interface set up as mon0, and we can call Wash with the\
    \ following command:\n   ``` wash --ignore-fcs -i mon0 ```\n   The ignore FCS\
    \ option is due to an issue with an expected format for requests that Wash causes:\n\
    \   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_157_1.png)\n4. Wash will display\
    \ all the nearby devices that support WPS as well as whether they have WPS active\
    \ or unlocked and what version is running:\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_157_2.png)\n\
    5. We can see the Wireless Lab network supports WPS. It uses Version 1 and it's\
    \ not locked. Fantastic. We take note of the MAC address, which in my case is\
    \ E8:94:F6:62:1E:8E, as this will be used to target our next tool: reaver\n6.\
    \ Reaver attempts to brute-force the WPS pin for a given MAC address. The syntax\
    \ for starting this is as follows:\n   ``` reaver -i mon0 -b <mac> -vv ```\n \
    \  The output will be as follows:\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_158_0.png)\n\
    7. Once it is started, the tool runs through all the possible combinations for\
    \ the WPS and attempts to authenticate. Once it does this, it will return the\
    \ WPS code and the password, as shown in the following screenshot:\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_158_1.png)\n\
    8. With WPA-PSK in hand, we can authenticate normally now. I left my device with\
    \ the default WPA-PSK that matches the WPS pin. If, however, you want to authenticate\
    \ with the WPS pin, you can do this by specifying the pin in reaver with the following\
    \ command:\n9. ``` reaver -i mon0 -b <mac> -vv -p 88404148 ```\n   Replace my\
    \ pin with your own."
  mdcn: "\n用户可能进行身份验证或重新验证的时间段，通常包括：\n- 每天开始\n- 午休时段\n- 每天结束\n此时，请按照第4章《WLAN加密缺陷》中的说明配置WPA密钥获取方案。或者，也可以执行第6章《攻击客户端》中介绍的解除认证攻击。这种攻击方式噪音更大，在成熟的组织中更容易被发现。如果部署的是WPA-Enterprise，请注意你需要利用前期侦察收集的信息定位正确的网络，并按照第8章《攻击WPA-Enterprise与RADIUS》中“攻击PEAP”部分的说明搭建模拟企业级环境。你可以尝试破解所有密码，但要注意部分密码可能是无法破解的。测试完成后，请向无线管理员核对当前使用的密码，确认该密码是否安全，同时排查你是否因工具故障或运气不佳才未能破解。\n\
    \n## 攻击基础设施\n如果通过破解加密获得了网络访问权限，且该操作在测试范围内被允许，可执行标准的网络渗透测试，至少需要完成以下操作：\n- 端口扫描\n\
    - 识别运行的服务\n- 枚举所有开放服务，例如无需认证的FTP、SMB或HTTP服务\n- 利用已识别的易受攻击服务\n\n## 入侵客户端\n完成所有无线系统的枚举和测试后，可根据不同的任务类型对客户端发起攻击。如有必要，在确认哪些客户端易受Karma攻击后，可搭建蜜罐，按照第8章《攻击WPA-Enterprise与RADIUS》中“攻击PEAP”部分的方法强制这些客户端连接。通过这种方式可以收集到多种有用的信息，但要确保收集的数据有明确用途，且以合规、安全的方式存储、传输和使用。\n\
    \n## 报告撰写\n最后，测试结束后需要向客户提交测试发现的报告。要确保报告质量与测试质量匹配，这一点非常重要。由于客户只会看到报告，因此你需要像对待测试工作一样，对报告投入同等的重视和精力。以下是报告的结构参考：\n\
    1. 管理层概要\n2. 技术概要\n3. 发现项：\n   - 漏洞描述\n   - 严重等级\n   - 受影响设备\n   - 漏洞类型——软件/硬件/配置类\n\
    \   - 修复建议\n4. 附录\n\n管理层概要的受众是高级非技术人员，重点从宏观层面说明漏洞的影响和需要采取的缓解措施。避免使用过于专业的术语，确保覆盖根本原因。\n\
    技术概要的定位介于管理层概要与发现项列表之间，面向开发人员或技术负责人，重点说明问题的修复方法以及可落地的大范围解决方案。\n发现项列表需要详细描述每个漏洞，说明漏洞的识别、复现方法以及漏洞相关信息。\n\
    附录用于存放所有无法在简短描述中充分说明的额外信息，截图、概念验证代码或获取到的敏感数据可放在这部分。\n\n## 本章小结\n本章我们介绍了执行各类无线测试的方法论，并针对每个步骤关联了对应的参考章节，同时列出了漏洞报告的规范以及技术数据呈现的相关技巧。在接下来也是最后一章中，我们将介绍本书首版发布后出现的新技术，包括WPS攻击以及用于监听的探测帧监控技术。\n\
    \n## 第10章：WPS与探测帧\n本章将介绍与WPS攻击、探测帧监控相关的新技术，同时涵盖能让无线测试效率大幅提升的Pineapple工具。这些攻击手法和工具均是在本书首版发布后出现的，我们会尽可能全面地介绍相关内容。\n\
    \n## WPS攻击\n无线保护设置（WPS）于2006年推出，目的是帮助没有无线网络知识的用户搭建安全的网络。该方案的思路是，用户的Wi-Fi设备会内置一个唯一的隐藏硬编码值，用户无需记忆复杂密钥即可完成接入认证；新设备只需按下Wi-Fi路由器上的按键即可完成认证。没有设备访问权限的外部人员无法接入网络，从而解决了记忆WPA密钥或设置简单密钥的痛点。2011年末，有安全研究人员披露了该WPS认证系统的暴力破解漏洞：WPS协商过程所需的流量可被伪造，且WPS\
    \ PIN码仅由0-9的8位数字组成。仅从长度来看，PIN码的可能组合仅有1亿种，而同样是8位的a-zA-Z0-9格式密码则有218,340,105,584,896种组合。不过WPS还存在更多漏洞：\n\
    - WPS PIN码共8位，最后一位是前7位的校验和，因此可被预测，剩余的可能组合最多只有1000万种\n- 此外，剩余字符中前4位和后3位会被分别校验，这意味着仅需尝试10⁴\
    \ + 10³ = 11000种组合\n\n通过认证机制中的这两处设计，PIN码的可能组合从1亿种直接缩减到了11000种，暴力破解该算法的时间也从数小时级别大幅缩短。正是这些设计缺陷使得WPS攻击成为可能。接下来请按照以下步骤开始操作：\n\
    1. 在攻击支持WPS的接入点之前，我们需要先搭建一个。我们使用的TP-Link路由器默认开启了该功能，这虽然令人担忧，但也十分方便。要确认这一点，我们可以登录路由器后台，点击WPS选项，界面应如下图所示：\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_156_0.png)\n2. 现在我们已经确认路由器支持WPS。接下来需要配置攻击目标，也就是搭建我们的测试环境。我们将使用Wash工具，该工具需要监听接口才能运行。和之前的操作一样，我们需要通过以下命令配置监听接口：\n\
    ``` airmon-ng start wlan0 ```\n命令执行结果如下所示：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_157_0.png)\n\
    3. 现在我们已成功配置名为mon0的监听接口，可以通过以下命令调用Wash工具：\n``` wash --ignore-fcs -i mon0 ```\n\
    其中`--ignore-fcs`参数是为了规避Wash工具对请求格式的特殊要求导致的问题，命令执行结果如下：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_157_1.png)\n\
    4. Wash工具会显示附近所有支持WPS的设备，同时标注这些设备的WPS是否处于激活/解锁状态，以及运行的WPS版本，结果如下：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_157_2.png)\n\
    5. 我们可以看到Wireless Lab网络支持WPS，运行的是1版本且处于未锁定状态，非常理想。我们需要记下该网络的MAC地址，我测试环境中的地址是E8:94:F6:62:1E:8E，这个地址将用于我们接下来的工具Reaver的定向攻击。\n\
    6. Reaver工具会对指定MAC地址对应的设备的WPS PIN码发起暴力破解。工具启动的语法如下：\n``` reaver -i mon0 -b <mac>\
    \ -vv ```\n命令执行结果如下：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_158_0.png)\n7.\
    \ 工具启动后会遍历所有WPS PIN码的可能组合并尝试认证，一旦成功破解，就会返回WPS PIN码和对应的Wi-Fi密码，结果如下图所示：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_158_1.png)\n\
    8. 拿到WPA-PSK密码后，我们就可以正常接入网络了。我测试用的设备设置的默认WPA-PSK密码和WPS PIN码一致。如果你想直接用WPS PIN码接入，可以在Reaver命令中指定PIN码，语法如下：\n\
    9. ``` reaver -i mon0 -b <mac> -vv -p 88404148 ```\n请将示例中的PIN码替换为你实际破解到的PIN码。\n"
