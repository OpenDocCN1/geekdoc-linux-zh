    \ must be present in the dictionary file you are supplying to aircrack-ng. If\
    \ the passphrase is not present in the dictionary, the attack will fail!\n\n|\
    \ We set up WPA-PSK on our access point with a common passphrase: |\n|------------------------------------------------------------------|\n\
    | abcdefgh. We then use a deauthentication attack to have legitimate clients |\n\
    | reconnect to the access point. When we reconnect, we capture the four |\n| way\
    \ WPA handshake between the access point and the client. |\n\nAs WPA-PSK is vulnerable\
    \ to a dictionary attack, we feed the capture file that contains the WPA four-way\
    \ handshake and a list of common passphrases (in the form of a wordlist) to Aircrack-ng.\
    \ As the passphrase abcdefgh is present in the wordlist, Aircrack-ng is able to\
    \ crack the WPA-PSK shared passphrase. It is very important to note again that,\
    \ in WPA dictionary-based cracking, you are just as good as the dictionary you\
    \ have. Thus, it is important to compile a large and elaborate dictionary before\
    \ you begin. Though Kali ships with its own dictionary, it may be insufficient\
    \ at times and might need more words, especially taking into account the localization\
