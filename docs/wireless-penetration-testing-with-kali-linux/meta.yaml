  md: '# Speeding up WPA and WPA2 Cracking


    As we have already seen in the previous section, if we have the correct passphrase
    in our dictionary, cracking WPA-Personal will work every time like a charm. So,
    why don''t we just create a large elaborate dictionary of millions of common passwords
    and phrases people use? This would help us a lot and most of the time, we would
    end up cracking the passphrase. It all sounds great but we are missing one key
    component here— the time taken. One of the more CPU and time-consuming calculations
    is that of the Pre-Shared key using the PSK passphrase and the SSID through the
    PBKDF2. This function hashes the combination of both over 4,096 times before outputting
    the 256-bit Pre-Shared key. The next step in cracking involves using this key
    along with parameters in the four-way handshake and verifying against the MIC
    in the handshake. This step is computationally inexpensive. Also, the parameters
    will vary in the handshake every time and hence, this step cannot be precomputed.
    Thus, to speed up the cracking process, we need to make the calculation of the
    Pre-Shared key from the passphrase as fast as possible.


    We can speed this up by pre-calculating the Pre-Shared Key, also called the Pairwise
    Master Key (PMK) in 802.11 standard parlance. It is important to note that, as
    the SSID is also used to calculate the PMK, with the same passphrase and with
    a different SSID, we will end up with a different PMK. Thus, the PMK depends on
    both the passphrase and the SSID.


    # Speeding up the cracking process


    We can proceed with the following steps:


    +   1. We can pre-calculate the PMK for a given SSID and wordlist using the genpmk
    tool with the following command:


    ```

    genpmk –f <chosen wordlist> –d PMK-Wireless-Lab –s "Wireless Lab"

    ```


    This creates the PMK-Wireless-Lab file containing the pregenerated PMK:'
  merge: -1
  pgno: 80
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_81_0.png)


