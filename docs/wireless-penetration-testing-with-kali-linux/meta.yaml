  md: '# Sniffing data packets for our network


    We will learn how to sniff data packets for a given wireless network. For the
    sake of simplicity, we will look at packets without any encryption.


    Follow these instructions to get started:


    +   1. Switch on the access point we named **"Wireless Lab"**. Let it remain configured
    to use no encryption.


    +   2. We will first need to find the channel on which the Wireless Lab access
    point is running. To do this, open a terminal and run `airodump-ng --bssid <mac>
    mon0` where <mac>, which is the **MAC address of our access point**. Let the program
    run, and shortly you should see your access point shown on the screen along with
    the channel it is running on.


    +   3. We can see from the preceding screenshot that our access point Wireless
    Lab is running on Channel 11. Note that this may be different for your access
    point.


    In order to sniff data packets going to and fro from this access point, we need
    to lock our wireless card on the same channel, that is channel 11. To do this,
    run the `iwconfig mon0 channel 11` command and then run `iwconfig mon0` to verify
    it. You should see the **Frequency: 2.462 GHz** value in the output. This corresponds
    to Channel 11.


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_30_0.png)


    +   4. Now run **Wireshark** and start sniffing on the mon0 interface. After Wireshark
    has started sniffing the packets, apply a filter for the bssid of our access point
    as shown below using **wlan.bssid == <mac>** in the filter area. Use the appropriate
    MAC address for your access point.'
  merge: -1
  pgno: 30
