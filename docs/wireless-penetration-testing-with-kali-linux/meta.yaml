    \n- 3. 现在我们使用**aircrack-ng**和相同的字典文件，破解过程耗时超过22分钟。这显示了预计算带来的巨大性能提升。\n\n- 4. 为了在aircrack-ng中使用这些PMK，我们需要使用名为airolib-ng的工具。我们将使用以下选项：airolib-ng、PMK-Aircrack-import和cowpatty\
    \ PMK-Wireless-Lab，其中PMK-Aircrack是要创建的与aircrack-ng兼容的数据库，PMK-Wireless-Lab是之前使用genpmk创建的符合genpmk规范的PMK数据库。\n\
    \n- 5. 现在我们将该数据库提供给aircrack-ng，破解速度会显著提升。我们使用以下命令：\n```\naircrack-ng –r PMK-Aircrack\
    \ WPA Cracking Demo2-01.cap\n```\n\n- 6. Kali Linux上还有其他工具可以利用多CPU系统加速破解，例如Pyrit。对于Intel®\
    \ Core™ i7等处理器，可以完成更快的破解操作。我们使用`-r`选项指定pcap文件，使用`-i`选项指定符合genpmk规范的PMK文件。即使在使用之前工具的同一系统上，使用genpmk生成的相同PMK文件，Pyrit也能在约3秒内破解密钥。\n\
    \n> 除上述因素外，破解过程主要取决于WPA/WPA2预共享密钥的长度。较长的密码短语需要更长的时间来破解。\n\n我们研究了多种加速WPA/WPA2-PSK破解的工具和技术。核心思想是针对给定的SSID和我们字典中的密码短语列表，预计算PMK。\n\
    \n## Decrypting WEP, WPA, and WPA2 Packets\n到目前为止，我们已使用各种技术破解了WEP和WPA密钥。我们要如何利用这些信息？第一步是使用这些密钥解密我们捕获的数据包。我们将使用破解得到的密钥，解密同一份空中捕获的跟踪文件中的WEP和WPA数据包。我们可以按照以下步骤操作：\n\
    \n- 1. 我们将解密之前创建的WEP捕获文件WEPCrackingDemo-01.cap中的数据包。为此，我们将使用Aircrack-ng套件中的另一个工具airdecap-ng。我们将运行以下命令，使用之前破解的WEP密钥，如下图所示：\n\
    ```\nairdecap-ng -w abcdefabcdefabcdefabcdef12 WEPCrackingDemo-02.cap\n```\n\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_83_0.png)\n\n- 2. 解密后的文件存储在名为WEPCrackingDemo-02-dec.cap的文件中。我们使用**tshark**工具查看该文件中的前10个数据包。请注意，根据你的捕获内容，你可能会看到不同的内容：\n\
    \n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_83_1.png)\n\n- 3. WPA/WPA2 PSK的解密方式与WEP完全相同，同样使用**airdecap-ng**工具，命令如下，如下图所示：\n\
    ```\nairdecap-ng –p abcdefgh WPACrackingDemo-02.cap –e \"Wireless Lab\"\n```\n\
    \n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_84_0.png)\n\n我们刚刚了解了如何使用Airdecap-ng解密WEP和WPA/WPA2-PSK加密的数据包。有趣的是，我们也可以使用Wireshark完成同样的操作。我们建议你通过查阅Wireshark文档来探索如何实现这一点。\n\
    \n## Connecting to WEP, WPA, and WPA2 Networks\n在破解网络密钥后，我们还可以连接到授权网络。这在渗透测试中非常有用。使用破解的密钥登录授权网络，是你能提供给客户证明其网络不安全的最终证据。我们可以按照以下步骤操作：\n\
    \n- 1. 获取密钥后，使用**iwconfig**工具连接到WEP网络。我们破解的WEP密钥为abcdefabcdefabcdefabcdef12：\n\
    \n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_85_0.png)\n\n```\nroot@kali:~# iwconfig\
    \ wlan0 essid \"Wireless lab\" key abcdefabcdefabcdefabcdef12\nroot@kali:~#\n\
    root@kali:~# iwconfig wlan0\nwlan0 IEEE 802.11bgn ESSID:\"Wireless lab\" Mode:Managed\
    \ Access Point: Not-Associated Tx-Power=20 dBm Retry short limit:7 RTS thr:off\
    \ Fragment thr:off Encryption key:ABCD-EFAB-CDEF-ABCD-EFAB-CDEF-12 Power Management:off\n\
    root@kali:~#\n```\n现在我们已连接到WEP网络，太棒了！\n\n- 2. 对于WPA，情况会更复杂一些。iwconfig工具不支持WPA/WPA2\
    \ Personal和企业版，因此无法用于WPA连接。本次实验我们将使用名为WPA_supplicant的新工具。要使用WPA_supplicant连接网络，我们需要创建一个配置文件，如下图所示。我们将该文件命名为**wpa-supp.conf**：\n\
    \n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_85_1.png)\n\n```\n# WPA-PSK/TKIP\n\
    network={\n    ssid=\"Wireless Lab\"\n    key_mgmt=WPA-PSK\n    proto=WPA\n  \
    \  pairwise=TKIP\n    group=TKIP\n    psk=\"abcdefgh\"\n}\n```\n\n- 3. 然后我们将使用以下选项调用WPA_supplicant工具，连接我们刚刚破解的WPA网络：\n\
    \n- 4. `-D wext -i wlan0 -c wpa-supp.conf`。连接成功后，WPA_supplicant会给出提示：**Connection\
    \ to XXXX completed**。"
