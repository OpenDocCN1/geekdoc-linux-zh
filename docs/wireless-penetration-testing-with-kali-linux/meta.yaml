- md: 'We successfully sent deauthentication frames to both the access point and the
    client. This resulted in them getting disconnected and a full loss of communication
    between them. We also sent out Broadcast deauthentication packets, which will
    ensure that no client in the vicinity can successfully connect to our access point.
    It is important to note that, as soon as the client is disconnected, it will try
    to connect back once again to the access point, and thus the deauthentication
    attack has to be carried out in a sustained way to have a full denial of service
    effect. This is one of the easiest attacks to orchestrate but has the most devastating
    effect. This can easily be used in the real world to bring a wireless network
    down on its knees.


    Try to check how you can conduct Dis-Association attacks against the infrastructure
    using tools available on Kali. Can you do a broadcast disassociation attack?


    ### Evil twin and access point MAC spoofing

    One of the most potent attacks on WLAN infrastructures is the evil twin. The idea
    is to basically introduce an attacker-controlled access point in the vicinity
    of the WLAN network. This access point will advertise the exact same SSID as the
    authorized WLAN network. Many wireless users may accidentally connect to this
    malicious access point, thinking it is part of the authorized network. Once a
    connection is established, the attacker can orchestrate a man-in-the-middle attack
    and transparently relay traffic while eavesdropping on the entire communication.
    We will take a look at how a man-in-the-middle attack is done in a later chapter.
    In the real world, an attacker would ideally use this attack close to the authorized
    network so that the user gets confused and accidentally connects to the attacker''s
    network.


    An evil twin having the same MAC address as an authorized access point is even
    more difficult to detect and deter. This is where access point MAC Spoofing comes
    in! In the next experiment, we will take a look at how to create an evil twin,
    coupled with access point MAC spoofing. Follow these instructions to get started:


    - 1. Use airodump-ng to locate the access point''s BSSID and ESSID, which we would
    like to emulate in the evil twin:

    ```

    BSSID PWR Beacons #Data, #/s CH MB ENC CIPHER AUTH ESSID

    E8:94:F6:62:1E:8E -49 2 0 0 6 54e. OPN PSK Wireless Lab

    BSSID STATION PWR Rate Lost Frames Probe

    9C:D3:6D:2A:7B:C0 20:10:7A:45:36:61 -71 2e- 5e 0 9

    9C:D3:6D:2A:7B:C0 70:18:8B:08:47:B6 -59 0e- 0e 0 2

    ```

    - 2. We connect a Wireless client to this access point.

    - 3. Using this information, we create a new access point with the same ESSID
    but a different BSSID and MAC address using the airbase-ng command. Minor errors
    may occur with newer releases:

    ```

    root@kali:~# airbase-ng --essid Rogue -c 11 mon0

    15:56:06 Created tap interface at0

    15:56:06 Trying to set MTU on at0 to 1500

    15:56:06 Access Point with BSSID 80:1F:02:8F:34:D5 started.

    Error: Got channel -1, expected a value > 0.

    ```

    - 4. This new access point also shows up in the airodump-ng screen. It is important
    to note that you will need to run airodump-ng in a new window with the following
    command:

    ```

    airodump-ng --channel 11 wlan0

    ```

    - 5. Now we send a deauthentication frame to the client, so it disconnects and
    immediately tries to reconnect:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_96_0.png)

    - 6. As we are closer to this client, our signal strength is higher, and it connects
    to our evil twin access point.

    - 7. We can also spoof the BSSID and MAC address of the access point using the
    following command:

    ```

    airbase-ng -a <router mac> --essid "Wireless Lab" -c 11 mon0

    ```

    - 8. Now if we look through `airodump-ng`, it is almost impossible to differentiate
    between both visually.

    - 9. Even `airodump-ng` is unable to discern that there are actually two different
    physical access points on the same channel. This is the most potent form of the
    evil twin. We created an evil twin for the authorized network and used a deauthentication
    attack to have the legitimate client connect back to us, instead of the authorized
    network access point. It is important to note that, in the case of the authorized
    access point using encryption such as WEP/WPA, it might be more difficult to conduct
    an attack in which traffic eavesdropping is possible.


    # A rogue access point

    A rogue access point is an unauthorized access point connected to the authorized
    network. Typically, this access point can be used as a backdoor entry by an attacker,
    thus enabling them to bypass all security controls on the network. This would
    mean that the firewalls, intrusion prevention systems, and so on, which guard
    the border of a network, would be able to do little to stop him from accessing
    the network. In the most common case, a rogue access point is set to Open Authentication
    and no encryption. The rogue access point can be created in the following two
    ways:


    - Installing an actual physical device on the authorized network as a rogue access
    point. Also, more than wireless security, this has to do with breaching the physical
    security of the authorized network.

    - Creating a rogue access point in software and bridging it with the local authorized
    network Ethernet network. This will allow practically any laptop running on the
    authorized network to function as a rogue access point.


    Follow these instructions to get started:


    - 1. Let''s first bring up our rogue access point using *airbase-ng* and give
    it the ESSID Rogue:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_98_0.png)

    - 2. We now want to create a bridge between the Ethernet interface, which is part
    of the authorized network, and our rogue access point interface. To do this, we
    will first install *bridge-utils* files, create a bridge interface, and name it
    *Wifi-Bridge*. The following screenshot shows the required commands in action:

    ```

    apt-get install bridge-utils

    ```

    ```

    brctl addbr Wifi-Bridge

    ```

    Let''s see the following output of the command:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_98_1.png)

    - 3. We will then add both the Ethernet and the At0 virtual interface created
    by *Airbase-ng* to this bridge:

    ```

    brctl addif Wifi-Bridge eth0

    ```

    ```

    brctl addif Wifi-Bridge ath0

    ```

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_99_0.png)

    - 4. We will then bring these interfaces up to bring the bridge up with the following
    commands:

    ```

    ifconfig eth0 0.0.0.0 up

    ifconfig ath0 0.0.0.0 up

    ```

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_99_1.png)

    - 5. We will then enable IP forwarding in the kernel to ensure that packets are
    forwarded:

    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_99_2.png)

    - 6. Brilliant! We are done. Now, any wireless client connecting to our rogue
    access point will have full access to the authorized network using the wireless-to-wired
    **Wifi-Bridge** we just built. We can verify this by connecting a client to the
    rogue access point.

    - 7. We can now access any host on the wired network from this wireless client
    using this rogue access point.


    We created a rogue access point and used it to bridge all the authorized network
    LAN traffic over the wireless network. As you can see, this is a really serious
    security threat as anyone can break into the wired network using this bridge.


    # Pop Quiz – Attacks on the WLAN Infrastructure

    Q1. What encryption does a rogue access point use in most cases?

    1. None

    2. WEP

    3. WPA

    4. WPA2


    Q2. What is the advantage of having the same MAC address as the authorized access
    point in an evil twin?

    1. It makes detecting the evil twin more difficult.

    2. It forces the client to connect to it.

    3. It increases the signal strength of the network.

    4. None of the above.


    Q3. What do DoS attacks do?

    1. They bring down the overall throughput of the network.

    2. They do not target the clients.

    3. They can only be done if we know the network WEP/WPA/WPA2 credentials.

    4. All of the above.


    Q4. What do rogue access points do and how can they be created?

    1. They allow backdoor entry into the authorized network.

    2. They use WPA2 encryption only.

    3. They can be created as software-based access points or can be actual devices.

    4. Both 1 and 3.'
  mdcn: "\n我们成功向接入点和客户端双方都发送了去认证帧，导致二者断开连接、彼此之间的通信完全中断。我们还发送了广播去认证数据包，可确保周边没有任何客户端能够成功连接至我们的接入点。需要特别说明的是，客户端一旦断开连接，就会立刻尝试重新接入接入点，因此想要实现完全拒绝服务的效果，就必须持续发起去认证攻击。这是最容易实施的攻击之一，但破坏性极强，在真实场景中完全可以轻易用其让无线网络彻底瘫痪。你可以尝试了解如何使用Kali中现有的工具，针对网络基础设施发起解除关联攻击，你能完成广播解除关联攻击吗？\n\
    ### 邪恶双胞胎与接入点MAC地址欺骗\n针对WLAN（无线局域网）基础设施最具破坏力的攻击之一就是邪恶双胞胎攻击。这种攻击的核心思路是，在目标WLAN周边部署一个由攻击者控制的接入点，该接入点会广播与合法WLAN完全相同的SSID。许多无线用户可能会误将其连入该恶意接入点，以为其是合法网络的一部分。一旦建立连接，攻击者就可以发起中间人攻击，在透明转发流量的同时窃听全部通信内容。我们将在后续章节中介绍中间人攻击的具体实施方式。真实场景中，攻击者通常会选择在合法网络附近发起此类攻击，让用户混淆，误连入攻击者的网络。如果邪恶双胞胎与合法接入点拥有相同的MAC地址，检测和防范的难度会进一步提升，这也正是接入点MAC地址欺骗的用武之地！在下一个实验中，我们将了解如何创建邪恶双胞胎，并结合接入点MAC地址欺骗技术。请按照以下说明开始操作：\n\
    - 1. 使用airodump-ng定位我们希望在邪恶双胞胎中模拟的接入点的BSSID和ESSID：\n```\nBSSID PWR Beacons #Data,\
    \ #/s CH MB ENC CIPHER AUTH ESSID \nE8:94:F6:62:1E:8E -49 2 0 0 6 54e. OPN PSK\
    \ Wireless Lab \nBSSID STATION PWR Rate Lost Frames Probe \n9C:D3:6D:2A:7B:C0\
    \ 20:10:7A:45:36:61 -71 2e- 5e 0 9 \n9C:D3:6D:2A:7B:C0 70:18:8B:08:47:B6 -59 0e-\
    \ 0e 0 2 \n```\n- 2. 将无线客户端连接至该接入点。\n- 3. 利用这些信息，我们使用airbase-ng命令创建一个与前者ESSID相同、但BSSID和MAC地址不同的新接入点。新版本的软件可能会出现轻微报错：\n\
    ```\nroot@kali:~# airbase-ng --essid Rogue -c 11 mon0 \n15:56:06 Created tap interface\
    \ at0 \n15:56:06 Trying to set MTU on at0 to 1500 \n15:56:06 Access Point with\
    \ BSSID 80:1F:02:8F:34:D5 started. \nError: Got channel -1, expected a value >\
    \ 0. \n```\n- 4. 这个新接入点也会出现在airodump-ng的界面中。需要特别说明的是，你需要新开一个终端窗口，使用以下命令运行airodump-ng：\n\
    ```\nairodump-ng --channel 11 wlan0 \n```\n- 5. 现在向客户端发送去认证帧，使其断开连接并立刻尝试重新接入：\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_96_0.png)\n- 6. 由于我们距离该客户端更近，信号强度更高，客户端会连接至我们的邪恶双胞胎接入点。\n\
    - 7. 我们还可以使用以下命令欺骗接入点的BSSID和MAC地址：\n```\nairbase-ng -a <router mac> --essid \"\
    Wireless Lab\" -c 11 mon0 \n```\n- 8. 现在如果通过`airodump-ng`查看，几乎无法从视觉上区分两个接入点。\n\
    - 9. 即便是`airodump-ng`也无法识别出同一信道上实际存在两个不同的物理接入点。这是最为强大的邪恶双胞胎攻击形式。我们为合法网络创建了邪恶双胞胎，并通过去认证攻击让合法客户端放弃连接原本的合法网络接入点，转而连接至我们的设备。需要特别说明的是，如果合法接入点使用了WEP/WPA等加密方式，那么发起可窃听流量的攻击难度会更高。\n\
    # 恶意接入点\n恶意接入点是指连接至合法网络的未授权接入点。通常情况下，攻击者可以将其作为后门入口，从而绕过网络上的全部安全管控措施。这意味着 guarding\
    \ 网络边界的防火墙、入侵防御系统等安全设施几乎无法阻止攻击者访问网络。最常见的恶意接入点会设置为开放认证、无加密状态。恶意接入点可以通过以下两种方式创建：\n\
    - 在合法网络上部署实体物理设备作为恶意接入点。此外，这不仅是无线安全问题，更涉及对合法网络的物理安全防护的破坏。\n- 通过软件创建恶意接入点，并将其与本地合法网络的有线以太网网桥接。这种方式可以让几乎所有运行在合法网络上的笔记本电脑都摇身一变成为恶意接入点。\n\
    请按照以下说明开始操作：\n- 1. 首先我们使用*airbase-ng*启动恶意接入点，并将其ESSID设置为Rogue：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_98_0.png)\n\
    - 2. 现在我们想要在属于合法网络的有线接口与我们的恶意接入点接口之间创建网桥。为此，我们首先需要安装*bridge-utils*工具包，创建网桥接口并将其命名为*Wifi-Bridge*。以下截图展示了所需命令的执行过程：\n\
    ```\napt-get install bridge-utils \n```\n```\nbrctl addbr Wifi-Bridge \n```\n\
    以下是该命令的执行输出：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_98_1.png)\n- 3. 接下来我们将有线接口与*Airbase-ng*创建的At0虚拟接口都添加到该网桥中：\n\
    ```\nbrctl addif Wifi-Bridge eth0 \n```\n```\nbrctl addif Wifi-Bridge ath0 \n\
    ```\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_99_0.png)\n- 4. 接下来我们将启动这些接口以启用网桥，使用以下命令即可：\n\
    ```\nifconfig eth0 0.0.0.0 up \nifconfig ath0 0.0.0.0 up \n```\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_99_1.png)\n\
    - 5. 接下来我们将在内核中启用IP转发功能，确保数据包可以被正常转发：\n```\necho 1 > /proc/sys/net/ipv4/ip_forward\
    \ \n```\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_99_2.png)\n- 6. 大功告成！现在任何连接至我们恶意接入点的无线客户端，都可以通过刚刚搭建的无线-有线**Wifi-Bridge**完全访问合法网络。我们可以通过将客户端连接至恶意接入点来验证这一点。\n\
    - 7. 现在我们可以通过这个恶意接入手，从该无线客户端访问有线网络上的任意主机。我们创建了恶意接入点，并借助它将全部合法网络的局域网流量桥接至无线网络。由此可见，这是一个极为严重的安全威胁，任何人都可以通过该网桥入侵有线网络。\n\
    # 小测验——WLAN基础设施攻击\nQ1. 大多数情况下恶意接入点使用哪种加密方式？\n1. 无加密\n2. WEP\n3. WPA\n4. WPA2\n\
    Q2. 邪恶双胞胎与合法接入点拥有相同MAC地址的优势是什么？\n1. 会增加检测到邪恶双胞胎的难度\n2. 强制客户端连接至该接入点\n3. 提升网络的信号强度\n\
    4. 以上都不是\nQ3. DoS（拒绝服务）攻击的作用是什么？\n1. 会导致网络整体吞吐量下降\n2. 不会以客户端为目标\n3. 只有获取网络的WEP/WPA/WPA2凭据后才能发起\n\
    4. 以上全部\nQ4. 恶意接入点的作用是什么？可以通过哪些方式创建？\n1. 可以作为后门入口进入合法网络\n2. 仅使用WPA2加密\n3. 可以以软件接入点形式创建，也可以是实体设备\n\
    4. 1和3均正确\n"
