  mdcn: '

    ## 查看管理帧、控制帧和数据帧

    现在我们将学习如何在Wireshark中应用过滤器来查看管理帧、控制帧和数据帧。请按照以下说明逐步操作：

    - 要查看捕获的数据包中的所有**管理帧**，请在过滤窗口输入过滤器`wlan.fc.type == 0`，然后点击**应用**。如果你希望避免数据包滚动过快，可以停止数据包捕获。

    - 要查看控制帧，请将过滤器表达式修改为`wlan.fc.type == 1`。

    - 要查看数据帧，请将过滤器表达式修改为`wlan.fc.type == 2`。

    - 要额外选择子类型，请使用**wlan.fc.subtype**过滤器。例如，要查看所有管理帧中的Beacon帧，请使用以下过滤器：

    ```

    (wlan.fc.type == 0) && (wlan.fc.subtype == 8)

    ```

    - 或者，你也可以在中间窗口的任意表头字段上点击右键，然后选择**应用为过滤器 | 所选字段**，将其添加为过滤器。

    - 这将自动在Filter字段中为你添加正确的过滤器表达式。

    > 你可以查阅Wireshark的官方手册，了解更多可用的过滤器表达式及其使用方法。

    你可以尝试组合使用各种过滤器，直到你能够确信自己即使在非常大的数据包跟踪文件中，也能深入分析到任意层级的细节。


    ## 嗅探我们网络的数据包

    我们将学习如何嗅探指定无线网络的数据包。为简化操作，我们将查看未加密的数据包。请按照以下说明开始操作：

    - 打开我们命名为**“无线实验室”**的接入点，保持其配置为不启用加密。

    - 我们首先需要找到“无线实验室”接入点运行的频道。为此，请打开终端，运行`airodump-ng --bssid <mac> mon0`，其中<mac>是**我们接入点的MAC地址**。让程序持续运行，稍后你应该能在屏幕上看到你的接入点，以及它当前运行的频道。

    - 从前面的截图可以看到，我们的“无线实验室”接入点运行在11频道。请注意，你的接入点的频道可能与此不同。为了嗅探进出该接入点的数据包，我们需要将无线网卡锁定在相同的频道，也就是11频道。为此，请运行`iwconfig
    mon0 channel 11`命令，然后运行`iwconfig mon0`进行验证。你应该能在输出中看到**频率：2.462 GHz**的值，这对应11频道。

    - 现在运行**Wireshark**，开始在mon0接口上嗅探。Wireshark开始嗅探数据包后，请在过滤区域使用`wlan.bssid == <mac>`，为我们的接入点的BSSID应用过滤器。请使用对应你接入点的正确MAC地址。


    ## 从mon0捕获 [Wireshark 1.8.5]

    | 序号 | 时间 | 源地址 | 目的地址 | 协议 | 长度 | 信息 |

    | --- | --- | --- | --- | --- | --- | --- |

    | 14 | 3.104976000 | Netgear_2a:7b:c0 | Broadcast | 802.11 | 285 | Beacon |

    | 16 | 3.129059000 | Netgear_2a:7b:c0 | EdimaxTe_8f:34:d5 | 802.11 | 331 | Probe
    Re |


    ```

    Frame 14: 285 bytes on wire (2280 bits), 285 bytes captured (2280 bits) on interface
    0

    Interface id: 0

    WTAP_ENCAP: 23

    Arrival Time: Aug 25, 2014 20:39:45.512515000 BST

    ```


    ```

    0000 00 00 12 00 2e 48 00 00 00 02 9e 09 a0 00 b0 01 .....H..........

    0010 00 00 80 00 00 00 ff ff ff ff ff 9c d3 6d 2a ...........m*

    0020 7b c0 9c d3 6d 2a 7b c0 20 7b 98 c2 ed b2 53 00 {...m*.{..{..S.

    ```


    - 要查看我们接入点的数据包，请在过滤器中添加以下内容：`(wlan.bssid == <mac>) && (wlan.fc.type_subtype ==
    0x20)`。在客户端笔记本上打开浏览器，在地址栏输入接入点的管理界面URL。在我的案例中，正如我们在第1章《无线实验室搭建》中看到的，该地址是http://192.168.0.1。这将生成Wireshark会捕获的数据包。

    - 数据包嗅探使我们能够非常轻松地分析未加密的数据包，这也是我们在无线网络中需要使用加密的原因。

    > 我们刚刚使用Wireshark和多种过滤器在空中嗅探了数据包。由于我们的接入点没有启用任何加密，我们能够看到所有明文数据。这是一个重大的安全问题，因为任何处于接入点射频范围内的用户，只要使用Wireshark之类的嗅探器，就能查看所有数据包。

    > 请使用Wireshark进一步分析这些数据包。你会注意到客户端会发起DHCP请求，如果存在可用的DHCP服务器，服务器会返回一个地址。随后你会看到空中的ARP数据包以及其他协议数据包。这是在无线网络上进行被动主机发现的绝佳简便方式。能够查看数据包跟踪记录，并重构无线主机上的应用程序如何与网络其余部分通信，这一点非常重要。Wireshark提供的一个有趣功能是流跟踪能力，该功能允许你将属于同一TCP会话的多个数据包放在一起查看。此外，请尝试登录[雅虎网站](http://www.yahoo.com)或其他任意热门网站，分析其产生的数据流量。


    现在我们将演示如何向无线网络注入数据包。


    ## 数据包注入

    我们将使用*aireplay-ng*工具，该工具包含在**Kali**中。请仔细遵循以下说明：

    - 要进行注入测试，请先启动Wireshark，并应用过滤器表达式`(wlan.bssid == <mac>) && !(wlan.fc.type_subtype
    == 0x08)`。这将确保我们只能看到实验网络中非信标帧的数据包。

    - 现在请在终端中运行以下命令：`aireplay-ng -9 -e Wireless Lab -a <mac> mon0`。

    - 返回Wireshark，你现在应该能在屏幕上看到大量数据包。其中部分数据包是由我们启动的aireplay-ng发送的，其余则是“无线实验室”接入点响应注入的数据包而发送的。

    >> 我们刚刚使用aireplay-ng成功向测试实验网络注入了数据包。需要注意的是，我们的网卡无需实际连接到“无线实验室”接入点，就能将这些任意数据包注入网络。


    ## **WLAN嗅探与注入的重要注意事项**

    WLAN通常运行在三个不同的频段范围内：2.4 GHz、3.6 GHz以及4.9/5.0 GHz。并非所有Wi-Fi网卡都支持所有这些频段及其对应的频带。例如，Alfa网卡仅支持IEEE
    802.11b/g标准，这意味着该网卡无法在802.11a/n频段下工作。这里的关键是，你要嗅探或注入特定频段的数据包，你的Wi-Fi网卡需要支持该频段。

    Wi-Fi还有一个有趣的特点：在每个频段内都存在多个频道。需要注意的是，你的Wi-Fi网卡在同一时刻只能处于一个频道上，无法同时调谐到多个频道。我能想到的最恰当的类比就是汽车收音机：同一时间你只能调谐到其中一个可用频道，如果你想收听其他内容，就必须切换频道。同样的原理也适用于WLAN嗅探。由此我们可以得出一个重要结论：我们无法同时嗅探所有频道，需要选择我们感兴趣的频道。

    这意味着，如果我们关注的接入点运行在1频道，我们就需要将网卡设置为1频道。尽管我们在以上段落中已经讲解了WLAN嗅探的相关内容，但同样的原理也适用于数据包注入：要在特定频道注入数据包，我们需要将网卡的射频调谐到该频道。

    现在我们来做一些练习，练习内容包括将网卡设置为特定频道、频道跳频、设置监管域、功率等级等。

    '
