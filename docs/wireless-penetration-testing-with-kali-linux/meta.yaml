  md: '# Denial of service attacks


    WLANs are prone to **Denial of Service (DoS)** attacks using various techniques,
    including but not limited to:


    +   - deauthentication attack

    - Disassociation attack

    - CTS-RTS attack

    - Signal interference or spectrum jamming attack


    In the scope of this book, we will discuss deauthentication attacks on the Wireless
    LAN infrastructure using the following experiment:


    # Deauthentication DoS attacks


