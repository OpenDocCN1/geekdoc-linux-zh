    a large enough number of data packets, encrypted with this key, are made available
    to aircrack-ng.


    > We set up WEP in our lab and successfully cracked the WEP key. In order to do
    this, we first waited for a legitimate client of the network to connect to the
    access point. After this, we used the aireplay-ng tool to replay ARP packets into
    the network. This caused the network to send ARP replay packets, thus greatly
    increasing the number of data packets sent over the air. We then used the aircrack-ng
    tool to crack the WEP key by analyzing cryptographic weaknesses in these data
    packets.


    > Note that we can also fake an authentication to the access point using the Shared
    Key Authentication bypass technique we learnt in the last chapter. This can come
    in handy if the legitimate client leaves the network. This will ensure that we
    can spoof an authentication and association and continue to send our replayed
    packets into the network. In the previous exercise, if the legitimate client had
    suddenly logged off the network, we would not have been able to replay the packets
    as the access point will refuse to accept packets from un-associated clients.
    Your challenge will be to fake an authentication and association using the Shared
    Key Authentication bypass we learnt in the last chapter, while WEP cracking is
    going on. Log off the legitimate client from the network and verify that you are
    still able to inject packets into the network and whether the access point accepts
    and responds to them.


    ## WPA and WPA2


    WPA primarily uses the TKIP encryption algorithm. TKIP was aimed at improving
    WEP, without requiring completely new hardware to run it. WPA2 in contrast mandatorily
    uses the AES-CCMP algorithm for encryption, which is much more powerful and robust
    than TKIP. Both WPA and WPA2 allow either EAP-based authentication, using RADIUS
    servers (Enterprise) or a **Pre-Shared Key (PSK)** (personal)-based authentication
    schema. WPA/WPA2 PSK is vulnerable to a dictionary attack. The inputs required
    for this attack are the four-way WPA handshake between client and access point,
    and a wordlist that contains common passphrases. Then, using tools such as **Aircrack-ng**,
    we can try to crack the WPA/WPA2 PSK passphrase. An illustration of the four-way
    handshake is shown in the following screenshot:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_73_0.png)


    The way WPA/WPA2 PSK works is that it derives the per-session key, called the
    **Pairwise Transient Key (PTK)**, using the Pre-Shared Key and five other parameters—SSID
    of Network, **Authenticator Nonce (ANonce)**, **Supplicant Nonce (SNonce)**, Authenticator
    MAC address (Access Point MAC), and **Supplicant MAC address (Wi-Fi Client MAC)**.
    This key is then used to encrypt all data between the access point and client.
    An attacker who is eavesdropping on this entire conversation by sniffing the air
    can get all five parameters mentioned in the previous paragraph. The only thing
    he does not have is the Pre-Shared Key. So, how is the Pre-Shared Key created?
    It is derived by using the WPA-PSK passphrase supplied by the user, along with
    the SSID. The combination of both of these is sent through the **Password-Based
    Key Derivation Function (PBKDF2)**, which outputs the 256-bit shared key. In a
    typical WPA/WPA2 PSK dictionary attack, the attacker would use a large dictionary
    of possible passphrases with the attack tool. The tool would derive the 256-bit
    Pre-Shared key from each of the passphrases and use it with the other parameters,
    described earlier, to create the PTK. The PTK will be used to verify the **Message
    Integrity Check (MIC)** in one of the handshake packets. If it matches, then the
    guessed passphrase from the dictionary was correct; if not, it was incorrect.
    Eventually, if the authorized network passphrase exists in the dictionary, it
    will be identified. This is exactly how WPA/WPA2 PSK cracking works! The following
    figure illustrates the steps involved:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_74_0.png)


    We will take a look at how to crack a WPA PSK wireless network. The exact same
    steps will be involved in cracking a WPA2-PSK network using CCMP(AES) as well.


    ## Cracking WPA-PSK and WPA2-PSK passphrase


    Follow the given instructions to get started:


    - 1. Let''s first connect to our access point Wireless Lab and set the access
    point to use WPA-PSK. We will set the WPA-PSK passphrase to "abcdefgh" so that
    it is vulnerable to a dictionary attack:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_75_0.png)


    - 2. We start airodump-ng with the following command so that it starts capturing
    and storing all packets for our network:


    ```

    airodump-ng --bssid 00:21:91:D2:8E:25 --channel 11 --write WPACrackingDemo mon0

    ```


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_75_1.png)


    - 3. Now we can wait for a new client to connect to the access point so that we
    can capture the four-way WPA handshake, or we can send a broadcast deauthentication
    packet to force clients to reconnect. We do the latter to speed things up. The
    same thing can happen again with the unknown channel error. Again, use --ignore-negative-one.
    This can also require more than one attempt:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_76_0.png)


    - 4. As soon as we capture a WPA handshake, the airodump-ng tool will indicate
    it in the top-right corner of the screen with a WPA handshake followed by the
    access point''s BSSID. If you are using --ignore-negative-one, the tool may replace
    the WPA handshake with a fixed channel message. Just keep an eye out for a quick
    flash of a WPA handshake.


    - 5. We can stop the airodump-ng utility now. Let''s open up the cap file in Wireshark
    and view the four-way handshake. Your Wireshark terminal should look like the
    following screenshot. I have selected the first packet of the four-way handshake
    in the trace file in the screenshot. The handshake packets are the one whose protocol
    is EAPOL:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_77_0.png)


    - 6. Now we will start the actual key cracking exercise! For this, we need a dictionary
    of common words. Kali ships with many dictionary files in the **metasploit** folder
    located as shown in the following screenshot. It is important to note that, in
    WPA cracking, you are just as good as your dictionary. Kali ships with some dictionaries,
    but these may be insufficient. Passwords that people choose depend on a lot of
    things. This includes things such as which country users live in, common names
    and phrases in that region, the security awareness of the users, and a host of
    other things. It may be a good idea to aggregate country- and region-specific
    wordlists, when undertaking a penetration test:


