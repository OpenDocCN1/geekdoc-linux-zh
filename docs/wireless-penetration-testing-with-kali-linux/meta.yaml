    next thing we will learn.'
- md: "## Viewing management, control, and data frames\n\nNow we will learn how to\
    \ apply filters in Wireshark to look at Management, Control and Data Frames. Please\
    \ follow the below instructions step by step:\n\n- To view all the **Management\
    \ frames** in the packets being captured, enter the filter `wlan.fc.type == 0`\
    \ into the filter window and click **Apply**. You can stop the packet capture\
    \ if you want to prevent the packets from scrolling down too fast.\n- To view\
    \ Control Frames, modify the filter expression to read `wlan.fc.type == 1`.\n\
    - To view data frames, modify the filter expression to `wlan.fc.type == 2`.\n\
    - To additionally select a sub-type, use the **wlan.fc.subtype** filter. For example,\
    \ to view all the Beacon frames among all Management frames, use the following\
    \ filter:\n  ```\n  (wlan.fc.type == 0) && (wlan.fc.subtype == 8)\n  ```\n- Alternately,\
    \ you can right-click on any of the header fields in the middle window and then\
    \ select **Apply as Filter | Selected** to add it as a filter.\n- This will automatically\
    \ add the correct filter expression for you in the Filter field.\n\n> You can\
    \ consult Wireshark's manual to know more about available filter expressions and\
    \ how to use them. Try playing around with various filter combinations till you\
    \ are confident that you can drill down to any level of detail, even in a very\
    \ large packet trace.\n\n\n## Sniffing data packets for our network\n\nWe will\
    \ learn how to sniff data packets for a given wireless network. For the sake of\
    \ simplicity, we will look at packets without any encryption. Follow these instructions\
    \ to get started:\n\n- Switch on the access point we named **\"Wireless Lab\"\
    **. Let it remain configured to use no encryption.\n- We will first need to find\
    \ the channel on which the Wireless Lab access point is running. To do this, open\
    \ a terminal and run `airodump-ng --bssid <mac> mon0` where <mac> is the **MAC\
    \ address of our access point**. Let the program run, and shortly you should see\
    \ your access point shown on the screen along with the channel it is running on.\n\
    - We can see from the preceding screenshot that our access point Wireless Lab\
    \ is running on Channel 11. Note that this may be different for your access point.\
    \ In order to sniff data packets going to and fro from this access point, we need\
    \ to lock our wireless card on the same channel, that is channel 11. To do this,\
    \ run the `iwconfig mon0 channel 11` command and then run `iwconfig mon0` to verify\
    \ it. You should see the **Frequency: 2.462 GHz** value in the output. This corresponds\
    \ to Channel 11.\n- Now run **Wireshark** and start sniffing on the mon0 interface.\
    \ After Wireshark has started sniffing the packets, apply a filter for the bssid\
    \ of our access point as shown below using `wlan.bssid == <mac>` in the filter\
    \ area. Use the appropriate MAC address for your access point.\n\n\n## Capturing\
    \ from mon0 [Wireshark 1.8.5]\n\n| No. | Time | Source | Destination | Protocol\
    \ | Length | Info |\n| --- | --- | --- | --- | --- | --- | --- |\n| 14 | 3.104976000\
    \ | Netgear_2a:7b:c0 | Broadcast | 802.11 | 285 | Beacon |\n| 16 | 3.129059000\
    \ | Netgear_2a:7b:c0 | EdimaxTe_8f:34:d5 | 802.11 | 331 | Probe Re |\n\n```\n\
    Frame 14: 285 bytes on wire (2280 bits), 285 bytes captured (2280 bits) on interface\
    \ 0\nInterface id: 0\nWTAP_ENCAP: 23\nArrival Time: Aug 25, 2014 20:39:45.512515000\
