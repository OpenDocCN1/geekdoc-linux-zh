    The ignore fcs option is due to an issue with an expected format for requests
    that wash causes:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_157_1.png)


    4. Wash will display all the nearby devices that support WPS as well as whether
    they have WPS active or unlocked and what version is running:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_157_2.png)


    5. We can see the Wireless Lab network supports WPS. It uses Version 1 and it''s
    not locked. Fantastic. We take note of the MAC address,'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'which in my case is E8:94:F6:62:1E:8E, as this will be used to target our next
