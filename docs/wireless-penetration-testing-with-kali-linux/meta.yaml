    # **Quiz – WLAN Authentication**


    Q1. How can you force a wireless client to re-connect to the access point?


    +   1. By sending a deauthentication packet.

    2. By rebooting the client.

    3. By rebooting the access point.

    4. All of the above.


    Q2. What does Open Authentication do?


    +   1. It provides decent security.

    2. It provides no security.

    3. It requires the use of encryption.

    4. None of the above.


    Q3. How does breaking Shared Key Authentication work?


    +   1. By deriving the keystream from the packets.

    2. By deriving the encryption key.

    3. By sending deauthentication packets to the access point.

    4. By rebooting the access point.


    # **Summary**


    In this chapter, we learnt about WLAN Authentication. Hidden SSIDs are a non-security
    feature and are is relatively simple to beat. MAC address filters do not provide
    any security, as MAC addresses can be sniffed from the air from the wireless packets.
    This is possible because the MAC addresses are unencrypted in the packet. Open
    Authentication provides no real authentication at all. Shared Key Authentication
    is a bit tricky to beat but, with the help of the right tools, we can derive the
    store and the keystream, using which it is possible to answer all future challenges
    sent by the access point. The result is that we can authenticate without needing
    to know the actual key.'
  - '[PAGE 63]


    # # Chapter 4: WLAN Encryption Flaws


    Even with the best of intentions, the future is always unpredictable. The WLAN
    committee designed WEP and then WPA to be foolproof encryption mechanisms but,
    over time, both these mechanisms had flaws that have been widely publicized and
    exploited in the real world.


    WLAN encryption mechanisms have had a long history of being vulnerable to cryptographic
    attacks. It started with WEP in early 2000, which eventually was completely broken.
    In recent times, attacks are slowly targeting WPA. Even though there is no public
    attack available currently to break WPA in all general conditions, there are attacks
    that are feasible under special circumstances.


    In this chapter, we will take a look at the following topics:


    +   ✓ Different encryption schemas in WLANs


    +   ✓ Cracking WEP encryption


    +   ✓ Cracking WPA encryption


    # ## WLAN Encryption


    WLANs transmit data over the air and thus there is an inherent need to protect
    data confidentiality. This is best done using encryption. The WLAN committee (IEEE
    802.11) formulated the following protocols for data encryption:


    +   ➤ Wired Equivalent Privacy (WEP)


    +   ➤ Wi-Fi Protected Access (WPA)


    +   ➤ Wi-Fi Protection Access v2 (WPAv2)


    In this chapter, we will take a look at each of these encryption protocols and
    demonstrate various attacks against them.'
- md: "## WEP Encryption\nThe WEP protocol was known to be flawed as early as 2000\
    \ but, surprisingly, it is still continuing to be used and access points still\
    \ ship with WEP enabled capabilities. There are many cryptographic weaknesses\
    \ in WEP and they were discovered by Walker, Arbaugh, Fluhrer, Martin, Shamir,\
    \ KoreK, and many others. Evaluation of WEP from a cryptographic standpoint is\
    \ beyond the scope of this book, as it involves understanding complex math. In\
    \ this section, we will take a look at how to break WEP encryption using readily\
    \ available tools on the **Kali** platform. This includes the entire **aircrack-ng**\
    \ suite of tools—**airmon-ng**, **aireplay-ng**, **airodump-ng**, **aircrack-ng**,\
    \ and others. The fundamental weakness in WEP is its use of **RC4** and a short\
    \ IV value that is recycled every 2²⁴ frames. While this is a large number in\
    \ itself, there is a 50 percent chance of four reuses every 5,000 packets. To\
    \ use this to our advantage, we generate a large amount of traffic so that we\
    \ can increase the likelihood of IVs that have been reused and thus compare two\
    \ cipher texts encrypted with the same IV and key. Let's now first set up WEP\
    \ in our test lab and see how we can break it.\n\n## Cracking WEP Encryption\n\
    - 1. Let's first connect to our access point Wireless Lab and go to the settings\
    \ area that deals with wireless encryption mechanisms:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_65_0.png)\n\
    - 2. On my access point, this can be done by setting the **Security Mode** to\
    \ **WEP**. We will also need to set the WEP key length. As shown in the following\
    \ screenshot, I have set WEP to use **128-bit** keys. I have set the default key\
    \ to **WEP Key 1** and the value in hex to `abcdefabcdefabcdefabcdef12` as the\
    \ 128-bit WEP key. You can set this to whatever you choose:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_66_0.png)\n\
    - 3. Once the settings are applied, the access point should now be offering WEP\
    \ as the encryption mechanism of choice. Let's now set up the attacker machine.\n\
    - 4. Let's bring up wlan0 by issuing the following command:\n  ```ifconfig wlan0\
    \ up```\n- 5. Then, we will run the following command:\n  ```airmon-ng start wlan0```\n\
    - 6. This is done so as to create **mon0**, the monitor mode interface, as shown\
    \ in the following screenshot. Verify that the mon0 interface has been created\
    \ using the `iwconfig` command:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_67_0.png)\n\
    - 7. Let's run airodump-ng to locate our lab access point using the following\
    \ command:\n  ```airodump-ng mon0```\n- 8. As you can see in the following screenshot,\
    \ we are able to see the Wireless Lab access point running WEP:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_67_1.png)\n\
    - 9. For this exercise, we are only interested in the Wireless Lab, so let's enter\
    \ the following command to only see packets for this network:\n  ```airodump-ng\
    \ --bssid 00:21:91:D2:8E:25 --channel 11 --write WEPCrackingDemo mon0```\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_68_0.png)\n\
    \  ```root@kali:~# airodump-ng --bssid E8:94:F6:62:1E:8E --channel 11 --write\
    \ WEPCrackingDemo mon0```\n- 10. We will request airodump-ng to save the packets\
    \ into a pcap file using the `--write` directive:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_68_1.png)\n\
    \  | BSSID | PWR RXQ Beacons | #Data, #/s | CH | MB | ENC | CIPHER | AUTH | ESSID\
    \ |\n  |-------------------|-----------------|------------|----|-----|------|--------|------|----------------|\n\
    \  | E8:94:F6:62:1E:8E | -44 100 | 125 | 40 | 1 | 11 | 54e | WEP | WEP | Wireless\
    \ Lab |\n  | BSSID | STATION | PWR | Rate | Lost | Frames | Probe |\n  |-------------------|-------------------|-----|------|-----|--------|--------|\n\
    \  | E8:94:F6:62:1E:8E | 20:18:7A:45:36:61 | -77 | 54e-54e | 0 | 26 | |\n- 11.\
    \ Now let's connect our wireless client to the access point and use the WEP key\
    \ as `abcdefabcdefabcdefabcdef12`. Once the client has successfully connected,\
    \ airodump-ng should report it on the screen. In WEP cracking, we need a large\
    \ number of data packets, encrypted with the same key to exploit weaknesses in\
    \ the protocol. So, we will have to force the network to produce more data packets.\
    \ To do this, we will use the **aireplay-ng** tool.\n- 12. We will capture ARP\
    \ packets on the wireless network using **aireplay-ng** and inject them back into\
    \ the network to simulate ARP responses. We will be starting aireplay-ng in a\
    \ separate window, as shown in the next screenshot. Replaying these packets a\
    \ few thousand times, we will generate a lot of data traffic on the network. Even\
    \ though aireplay-ng does not know the WEP key, it is able to identify the ARP\
    \ packets by looking at the size of the packets. ARP is a fixed header protocol;\
    \ thus, the size of the ARP packets can be easily determined and can be used to\
    \ identify them even within encrypted traffic. We will run aireplay-ng with the\
    \ options that are discussed next. The `-3` option is for ARP replay, `-b` specifies\
    \ the BSSID of our network, and `-h` specifies the client MAC address that we\
    \ are spoofing. We need to do this, as replay attacks will only work for authenticated\
    \ and associated client MAC addresses:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_69_0.png)\n\
    - 13. Very soon you should see that aireplay-ng was able to sniff ARP packets\
    \ and started replaying them into the network. If you encounter channel-related\
    \ errors as I did, append *--ignore-negative-one* to your command, as shown in\
    \ the following screenshot:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_70_0.png)\n\
    - 14. At this point, airodump-ng will also start registering a lot of data packets.\
    \ All these sniffed packets are being stored in the WEPCrackingDemo files.\n \
    \ | BSSID | PWR | RXQ | Beacons | #Data | #/s | CH | MB | ENC | CIPHER | AUTH\
    \ | ESSID |\n  |-------------------|-----|-----|---------|-------|-----|----|----|------|--------|------|----------------|\n\
    \  | E8:94:F6:62:1E:8E | -49 | 100 | 3360 | 3090 | 10 | 11 | 54e | WEP | WEP |\
    \ | Wireless Lab |\n  | BSSID | STATION | PWR | Rate | Lost | Frames | Probe |\n\
    \  |-------------------|-------------------|-----|------|-----|--------|--------|\n\
    \  | E8:94:F6:62:1E:8E | 20:10:7A:45:36:61 | -79 | 54e-54e | 0 | 3091 | |\n- 15.\
    \ Now let's start with the actual cracking part! We fire up aircrack-ng with the\
    \ `WEPCrackingDemo.cap` file in a new window. This will start the aircrack-ng\
    \ software and it will begin working on cracking the WEP key using the data packets\
    \ in the file. Note that it is a good idea to have airodump-ng collect the WEP\
    \ packets, aireplay-ng do the replay attack, and aircrack-ng attempt to crack\
    \ the WEP key based on the captured packets, all at the same time. In this experiment,\
    \ all of them are open in separate windows.\n- 16. Your screen should look like\
    \ the following screenshot when aircrack-ng is working on the packets to crack\
    \ the WEP key:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_71_0.png)\n  | KB |\
    \ depth | byte(vote) |\n  |----|-------|------------|\n  | 0 | 0/17 | 12(6656)\
    \ 49(6656) 13(6400) 1C(6400) 84(6400) BA(6400) |\n  | 1 | 0/1 | 14(7424) A2(6400)\
    \ C3(6400) F3(6400) AC(6144) E3(6144) |\n  | 2 | 0/1 | C0(7680) 22(6656) 41(6656)\
    \ 50(6656) B2(6656) EF(6656) |\n  | 3 | 1/2 | 5F(6912) 17(6656) EC(6656) 7F(6400)\
    \ 92(6400) B3(6400) |\n  | 4 | 3/4 | F0(6912) A8(6400) DF(6400) 41(6144) 5E(6144)\
    \ 8D(6144) |\n- 17. The number of data packets required to crack the key is nondeterministic,\
    \ but generally in the order of a hundred thousand or more. On a fast network\
    \ (or using aireplay-ng), this should take 5-10 minutes at most. If the number\
    \ of data packets currently in the file is not sufficient, then **aircrack-ng**\
    \ will pause, as shown in the following screenshot, and wait for more packets\
    \ to be captured; it will then restart the cracking process:\n  | KB | depth |\
    \ byte(vote) |\n  |----|-------|------------|\n  | 0 | 37/38 | F3(5120) 47(4864)\
    \ 69(4864) 78(4864) 84(4864) 99(4864) |\n  | 1 | 12/1 | F3(5632) 32(5376) 3B(5376)\
    \ 47(5376) 48(5376) 74(5376) |\n  | 2 | 1/7 | B2(6400) 41(6144) 58(6144) 5A(6144)\
    \ EF(6144) FE(6144) |\n  | 3 | 9/19 | F2(5888) 0D(5632) 17(5632) 32(5632) 47(5632)\
    \ 80(5632) |\n  | 4 | 16/4 | E5(5632) 0E(5376) 1F(5376) 6E(5376) 83(5376) 9E(5376)\
