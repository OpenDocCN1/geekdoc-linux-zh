    # **What do we do if the client does not automatically connect to us?**


    We would have to send a **deauthentication** packet to break the legitimate client-access
    point connection and then, if our signal strength is higher, the client will connect
    to our spoofed access point. Try this out by connecting a client to a legitimate
    access point, and then forcing it to connect to your Honeypot.


    # The Caffe Latte attack


    In the Honeypot attack, we noticed that clients will continuously probe for SSIDs
    they have connected to previously. If the client had connected to an access point
    using WEP, operating systems such as Windows cache and store the WEP key. The
    next time the client connects to the same access point, the Windows wireless configuration
    manager automatically uses the stored key.


    The Caffe Latte attack is a WEP attack that allows a hacker to retrieve the WEP
    key of the authorized network, using just the client. The attack does'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'not require the client to be anywhere close to the authorized WEP network.

    It can crack the WEP key using just the isolated client.

    Next, we will retrieve the WEP key of a network from a client using the Caffe
    Latte attack.


    # Conducting a Caffe Latte attack


    +   1. Let''s first set up our legitimate access point with WEP for the network
    **Wireless Lab** with the ABCDEFABCDEFABCDEF12 key in Hex:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_108_0.png)


    +   2. Let''s connect our client to it and we can verify that the connection is
    successful using **airodump-ng**.


    +   3. Let''s unplug the access point and ensure that the client is in the un-associated
    stage and searches for the WEP network **Wireless Lab**.


    +   4. Now we use **airbase-ng** to bring up an access point with **Wireless Lab**
    as the SSID, with the parameters as shown here:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_108_1.png)


    +   5. As soon as the client connects to this access point, **airbase-ng** starts
    the Caffe Latte attack, as shown here:'
  merge: -1
  pgno: 108
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_109_0.png)


    +   6. We now start airodump-ng to collect the data packets from this access point
    only, as we did before in the WEP cracking scenario:


    ```

    root@kali:~# airodump-ng mon0 --bssid 4C:0F:6E:70:BD:CB -w keystream

    ```


    +   7. We also start **aircrack-ng** as in the WEP-cracking exercise we did before
    to begin the cracking process. The command line will be **aircrack-ng** filename,
    where the filename is the name of the file created by **airodump-ng**.


    We were successful in retrieving the WEP key from just the wireless client without
    requiring an actual access point to be used or present in the vicinity. This is
    the power of the Caffe Latte attack.


    In basic terms, a WEP access point doesn''t need to prove to a client that it
    knows the WEP key in order to receive encrypted traffic. The first piece of'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'traffic that will always be sent to a router upon connecting to a new network
    will be an ARP request to ask for an IP.


    The attack works by bit flipping and replaying ARP packets sent by the wireless
    client post association with the fake access point created by us. These bit flipped
    ARP Request packets cause more ARP response packets to be sent by the wireless
    client.


    Bit-flipping takes an encrypted value and alters it to create a different encrypted
    value. In this circumstance, we can take an encrypted ARP request and create an
    ARP response with a high degree of accuracy. Once we send back a valid ARP response,
    we can replay this value over and over again to generate the traffic we need to
    decrypt the WEP key.


    > Note that all these packets are encrypted using the WEP key stored on the client.
    Once we are able to gather a large number of these data packets, aircrack-NG is
    able to recover the WEP key easily.


    > Try changing the WEP key and repeat the attack. This is a difficult attack and
    requires some practice to orchestrate successfully. It would also be a good idea
    to use Wireshark and examine the traffic on the wireless network.


    # The Hirte attack


    We''ve already seen how to conduct the Caffe Latte attack. The Hirte attack extends
    the Caffe Latte attack using fragmentation techniques and allows almost any packet
    to be used.


    # Cracking WEP with the Hirte attack


    +   1. Create a WEP access point exactly as in the Caffe Latte attack using the
    airbase-ng tool. The only additional option is the -N option instead of the -L
    option to launch the Hirte attack:'
  merge: -1
  pgno: 110
- img_proc: true
  md: '```

    root@kali:~# airbase-ng -c 3 -a E8:94:F6:62:1E:8E -e "Wireless Lab" -L -W 1 mon0

    ```


    +   2. Start airodump-ng in a separate window to capture packets for the **Wireless
    Lab Honeypot**:


    ```

    root@kali:~# airodump-ng -c 3 --bssid 80:1F:02:8F:34:D5 --write Hirte mon0

    ```


    +   3. Now, airodump-ng will start monitoring this network and storing the packets
    in the Hirte-01.cap file:


    ```

    CH  3 ][ Elapsed: 0 s ][ 2014-11-08 16:54 ][ fixed channel mon0: -1

    BSSID              PWR RXQ  Beacons #Data, #/s  CH  MI INC  CIPHER AUTH ESSID

    80:1F:02:8F:34:D5  0   100    32      0    0   3  54    WEP    WEP W

    BSSID              STATION            PWR   Rate   Lost  Frames  Probe

    ```


    +   4. Once the roaming client connects to our Honeypot AP, the Hirte attack is
    automatically launched by **airbase-ng**:


    ```

    root@kali:~# airbase-ng -c 3 -e "Wireless Lab" -W 1 -N mon0

    16:52:48  Created tap interface at0

    16:52:48  Trying to set MTU on at0 to 1500

    16:52:48  Access Point with BSSID 80:1F:02:8F:34:D5 started.

    Error: Got channel -1, expected a value > 0.

    16:53:31  Client 00:EE:BD:B3:62:DE associated (WEP) to ESSID: "Wireless Lab"

    16:55:03  Client 00:EE:BD:B3:62:DE associated (WEP) to ESSID: "Wireless Lab"

    16:55:07  Starting Hirte attack against 00:EE:BD:B3:62:DE at 100 pps.

    ```


    +   5. We start aircrack-ng as in the case of the Caffe Latte attack and eventually,
    the key will be cracked.


    > > We launched the Hirte attack against a WEP client that was isolated and away
    from the authorized network. We cracked the key exactly the same way as in the
    Caffe Latte attack case.


    We recommend setting different WEP keys on the client and trying this exercise
    a couple of times to gain confidence. You may notice many times that you may have
    to reconnect the client to get it to work.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# AP-less WPA-Personal cracking


    In Chapter 4, we saw how to crack WPA/WPA2 PSK using aircrack-ng. The basic idea
    was to capture a four-way WPA handshake and then launch a dictionary attack.


    The question is: Would it be possible to crack WPA-Personal with just the client?
    No access point!


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_112_0.png)


    To crack WPA, we need the following four parameters from the four-way handshake—
    Authenticator Nonce, Supplicant Nonce, Authenticator MAC, and Supplicant MAC.
    Now, the interesting thing is that we do not need all of the four packets in the
    handshake to extract this information. We can get this information with four packets;
    packets 1 and 2 or just packets 2 and 3.


    In order to crack WPA-PSK, we will bring up a WPA-PSK Honeypot and, when the client
    connects to us, only Message 1 and Message 2 will come through. As we do not know
    the passphrase, we cannot send Message 3. However, Message 1 and Message 2 contain
    all the information required to begin the key cracking process:'
  merge: -1
  pgno: 112
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_113_0.png)


    Let''s start our job!


    +   1. We will set up a WPA-PSK Honeypot with the ESSID **Wireless Lab**. The
    `-z 2` option creates a WPA-PSK access point, which uses TKIP:


    ```

    root@kali:~# airbase-ng -c 3 -e "Wireless Lab" -W 1 -z 2 mon0

    16:56:44  Created tap interface at0

    16:56:44  Trying to set MTU on at0 to 1500

    16:56:44  Access Point with BSSID 80:1F:02:8F:34:D5 started.

    Error: Got channel -1, expected a value > 0.

    ```


    +   2. Let''s also start **airodump-ng** to capture packets from this network:


    ```

    root@kali:~# airodump-ng -c 3 --bssid 80:1F:02:8F:34:D5 --write AP-less-WPA-cracking
    mon0

    ```


    +   3. Now when our roaming client connects to this access point, it starts the
    handshake but fails to complete it after Message 2, as discussed previously; however,
    the data required to crack the handshake has been captured.


    +   4. We run the airodump-ng capture file through aircrack-ng with the same dictionary
    file as before; eventually, the passphrase is cracked as before.'
  merge: -1
