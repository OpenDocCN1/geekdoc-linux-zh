    ## 安装Kali Linux

    本书后续内容中，Kali系统都将安装在作为渗透测试人员工作机的笔记本电脑上。Kali的安装过程相对简单。我们先将Kali以Live DVD的形式引导启动，之后将其安装到硬盘中。请按以下步骤逐步操作：

    - 将下载好的**Kali ISO镜像**（我们使用的是64位Kali ISO镜像）刻录到可启动DVD中。

    - 用该DVD启动笔记本电脑，从**启动菜单**中选择**图形化安装**选项：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_9_0.png)

    - 如果启动成功，你将看到如下界面：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_10_0.png)

    - 该安装程序与大多数Linux系统的图形化安装程序类似，操作逻辑十分简单。请在每一个界面中选择对应选项，启动安装流程。安装完成后，按照提示重启设备并取出DVD。

    > 你也可以在VMware、VirtualBox等虚拟化软件中安装Kali。如果你不想将整台笔记本电脑专门用于运行Kali，这是最佳选择。虚拟化软件中的安装流程与物理机安装完全一致，唯一区别是需要提前在虚拟环境中做好预配置。你可以从www.vmware.com和www.virtualbox.org下载这些软件。


    ## 配置接入点

    现在我们将配置接入点。如前所述，本书中所有实验都将使用TP-LINK TL-WR941ND无线路由器，但你也可以使用其他任意接入点，其基本操作和使用原理是相同的。我们将把接入点配置为使用开放认证模式，SSID设置为Wireless
    Lab，请按以下步骤逐步操作：

    - 接通接入点电源，用网线将你的笔记本电脑连接到接入点的任意一个以太网端口。

    - 在浏览器中输入接入点配置终端的IP地址。TP-Link设备的默认IP是*192.168.0.1*，你也可以查阅你所用接入点的设置指南来获取其IP地址。如果你没有接入点的说明书，也可以在浏览器中访问[http://tplinklogin.net](http://tplinklogin.net)或[http://tplinkwifi.net](http://tplinkwifi.net)来登录路由器。网关IP地址通常就是接入点的IP。连接成功后，你将看到一个如下所示的配置门户：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_11_0.png)

    该门户的默认用户名和密码均为*admin*。

    - 如果你无法登录路由器，需要将其恢复为默认配置。操作方法为：按住无线路由器背面的复位键不放，持续约5秒后，路由器就会恢复到出厂默认设置。

    - 我们需要将SSID重命名为"Wireless Lab"，因此需要进入**无线**选项卡，再点击**无线设置**，操作路径如下：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_12_0.png)

    - 如前所述，我们需要将接入点的安全设置修改为"开放认证"。进入**无线**选项卡后，点击**无线安全**，选择**关闭安全防护**。关闭安全防护即表示接入点处于开放认证模式。

    - 保存接入点的修改，按需重启接入点。现在你的接入点应该已经正常运行，SSID为**Wireless Lab**。


    我们已成功完成接入点的配置，其SSID为**Wireless Lab**。接入点正在对外广播自身信号，我们的Windows笔记本电脑以及接入点**射频频段（RF）**覆盖范围内的其他设备都可以检测到该信号。需要注意的是，我们将接入点配置为了开放模式，这是安全性最低的配置。建议暂时不要将该接入点连接到互联网，因为射频频段范围内的任何人都可以通过该接入点访问互联网。


    ## 配置无线网卡

    配置无线网卡比配置接入点简单得多。优势在于Kali系统原生支持该网卡，且内置了所有必需的设备驱动，支持数据包注入和嗅探功能。我们将把该无线网卡用于渗透测试人员的笔记本电脑上。请按以下步骤逐步配置你的网卡：

    - 将网卡插入Kali笔记本电脑的任意USB端口后启动设备。登录系统后，打开控制台终端并输入*iwconfig*命令，你的界面应该如下所示：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_13_0.png)

    如图所示，**wlan0**是为该无线网卡创建的无线接口。输入*ifconfig wlan0*命令来启用该接口，操作后界面如下：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_13_1.png)

    - MAC地址00:c0:ca:3e:bd:93应当与你Alfa网卡背面标注的MAC地址一致。我使用的是Edimax网卡，对应的MAC地址为80:1f:02:8f:34:d5。通过这一步可以快速确认你已经启用了正确的接口。


    ## 连接接入点

    现在我们将了解如何使用无线网卡连接到接入点。我们的接入点SSID为**Wireless Lab**，且未使用任何认证方式。请按以下步骤将你的无线网卡连接到该接入点：

    - 首先查看无线网卡当前检测到的无线网络。执行*iwlist wlan0 scanning*命令，你将看到周边的网络列表。向下滚动列表即可找到Wireless
    Lab网络，在我的环境中该网络显示为Cell 11，你的环境中显示内容可能会有所不同。ESSID字段即网络名称。

    - 由于多个接入点可能使用相同的SSID，请核对你上方Address字段中标注的MAC地址是否与你接入点的MAC地址一致。快速获取MAC地址的方法是查看接入点背面的标注。

    - 现在执行*iwconfig wlan0* essid "**Wireless Lab**"命令，之后执行*iwconfig wlan0*命令查看状态。如果你已成功连接到接入点，在*iwconfig*命令输出的Access
    Point字段中，你应该能看到接入点的MAC地址。

    - 根据接入点说明书，我们知道其管理界面的IP地址为192.168.0.1，这一地址也是我们配置接入点时的默认路由器IP地址。现在执行*ifconfig wlan0*
    192.168.0.100 netmask 255.255.255.0 up命令，将我们的IP地址设置为同一子网下的地址。执行*ifconfig wlan0*命令查看输出结果，即可验证命令是否执行成功。

    - 现在执行*ping 192.168.0.1*命令ping接入点。如果网络连接配置正确，你应该能看到来自接入点的响应。你还可以执行`arp -a`命令来验证响应确实来自接入点，你应该能看到IP
    192.168.0.1对应的MAC地址就是我们之前记录的接入点MAC地址。需要注意的是，部分较新的接入点可能会默认禁用**互联网控制消息协议（ICMP）**的echo请求包响应，这么做是为了让接入点在最少配置的情况下也能保障开箱即用的安全性。遇到这种情况，你可以尝试打开浏览器访问其Web界面，验证连接是否正常：

    ```root@wireless-example:~# ping 192.168.0.1

    PING 192.168.0.1 (192.168.0.1) 56(84) bytes of data.

    64 bytes from 192.168.0.1: icmp_req=1 ttl=128 time=5.02 ms

    64 bytes from 192.168.0.1: icmp_req=2 ttl=128 time=1.48 ms

    64 bytes from 192.168.0.1: icmp_req=3 ttl=128 time=1.47 ms

    ^C

    --- 192.168.0.1 ping statistics ---

    3 packets transmitted, 3 received, 0% packet loss, time 2003ms

    rtt min/avg/max/mdev = 1.479/2.660/5.021/1.670 ms

    ```

    在接入点端，我们可以通过查看连接日志来验证连通性。如下方日志所示，MAC地址为`4C:0F:6E:70:BD:CB`的无线网卡已记录在路由器的DHCP请求日志中：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_15_0.png)

    '
