  mdcn: "\n## 测验 - 基础知识理解\nQ1. 执行完ifconfig wlan0命令后，如何验证无线网卡已启用且功能正常？\nQ2. 我们可以仅用Kali\
    \ live CD运行所有实验吗？我们能不能不把CD安装到硬盘上？\nQ3. arp -a命令会显示什么内容？\nQ4. 在Kali中我们应该使用什么工具连接到WPA/WPA2网络？\n\
    \n## 总结\n本章详细介绍了如何搭建你自己的无线实验室，此外，在这个过程中，你学习了以下基本步骤：\n- 将Kali安装到硬盘，并探索虚拟机、U盘等其他可选方案。\n\
    - 通过网页界面配置你的接入点。\n- 理解并使用多条命令来配置和使用你的无线网卡。\n- 验证无线客户端与接入点之间的连接状态。\n\n掌握系统配置的熟练度非常重要，如果你还不太熟练，建议你把前面的示例反复练习几遍。后续章节中，我们会设计更复杂的场景。下一章，我们将学习WLAN设计本身存在的安全缺陷，我们会使用网络分析工具Wireshark来结合实际理解这些概念。\n\
    \n## 第2章：WLAN及其固有安全缺陷\n基础不牢，地动山摇，放到我们讨论的场景中，就是建立在本身存在固有缺陷的系统上的安全体系都是不堪一击的。WLAN在设计上存在一些相对容易被利用的安全缺陷，例如数据包欺骗、数据包注入以及嗅探（这些攻击甚至可以在远距离发起），本章会深入探讨这些缺陷。\n\
    \n本章我们将学习以下内容：\n- 重温WLAN帧\n- 不同的帧类型与子类型\n- 使用Wireshark嗅探管理帧、控制帧和数据帧\n- 嗅探指定无线网络的数据包\n\
    - 向指定无线网络注入数据包\n\n让我们开始吧！\n\n## 重温WLAN帧\n由于本书聚焦无线网络安全，我们默认你已经掌握了相关协议和包头的基础知识。如果你还不熟悉，或者已经有一段时间没有接触过无线技术，现在是重新回顾这个主题的好时机。\n\
    \n现在让我们快速回顾一下大多数人可能已经了解的WLAN基础概念。在WLAN中，通信以帧为单位进行，帧的头部结构如下：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_17_0.png)\n\
    \n帧控制字段本身的结构更为复杂：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_18_0.png)\n\n类型字段定义了三种WLAN帧：\n\
    \n### 1. 管理帧：\n管理帧负责维持接入点与无线客户端之间的通信，管理帧包含以下子类型：\n- 认证\n- 解除认证\n- 关联请求\n- 关联响应\n\
    - 重关联请求\n- 重关联响应\n- 解除关联\n- 信标\n- 探测请求\n- 探测响应\n\n### 2. 控制帧：\n控制帧负责确保接入点与无线客户端之间的数据正常交换，控制帧包含以下子类型：\n\
    - 请求发送（RTS）\n- 允许发送（CTS）\n- 确认（ACK）\n\n### 3. 数据帧：\n数据帧承载在无线网络上传输的实际数据，数据帧没有子类型。\n\
    \n后续章节讨论不同攻击时，我们会进一步介绍每种帧的安全影响。现在我们来学习如何使用Wireshark在无线网络中嗅探这些帧。你也可以使用其他工具进行嗅探，例如Airodump-NG、Tcpdump或Tshark。不过本书主要使用Wireshark，也鼓励你自行探索其他工具的使用方法。\n\
    \n完成这一操作的第一步是创建监听模式接口，该接口会为我们当前的网卡创建一个适配接口，让我们能够读取空中所有无线帧，无论这些帧的目标是不是我们。在有线网络中，这种模式通常被称为**混杂模式**。\n\
    \n## 创建监听模式接口\n现在我们将无线网卡设置为监听模式，请按照以下步骤操作：\n1. 启动Kali时连接好你的网卡，进入控制台后输入`iwconfig`，确认网卡已被识别且驱动已正常加载。\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_20_0.png)\n2. 使用`ifconfig wlan1 up`命令启用网卡（其中*wlan1*是你的网卡名称），通过运行`ifconfig\
    \ wlan1`验证网卡是否已启用，你会在输出的第二行看到**UP**字样，如下方截图所示：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_21_0.png)\n\
    3. 要将网卡设置为监听模式，我们会使用Kali默认自带的airmon-ng工具，首先运行airmon-ng命令确认它是否能检测到可用的网卡，你会在输出中看到列出的wlan0接口：\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_21_1.png)\n4. 现在输入`airmon-ng start wlan1`命令创建与wlan0设备对应的监听模式接口，新的监听模式接口会被命名为mon0。（你可以再次运行不带参数的`airmon-ng`命令确认该接口是否创建成功）\n\
    ```root@kali:~# airmon-ng start wlan1\nFound 3 processes that could cause trouble.\
    \ If airodump-ng, aireplay-ng or airtun-ng stops working after a short period\
    \ of time, you may want to kill (some of) them!\n        e PID Name\n        2256\
    \ NetworkManager\n        2292 dhclient\n        3125 wpa_supplicant\n\nInterface\
    \ Chipset\tDriver\nwlan1\tRalink RT2870/3070\trt2800usb - [phy0] (monitor mode\
    \ enabled on mon0)\nroot@kali:~# airmon-ng\n```\n5. 此时运行`ifconfig mon0`命令，应该能看到名为**mon0**的新接口。\n\
    ```root@kali:~# ifconfig mon0\nmon0\tLink encap:UNSPEC  HWaddr 80-1F-02-8F-34-D5-00-00-00-00-00-00-00-00-00-00\
    \  \n\tUP BROADCAST RUNNING MULTICAST  MTU:1500  Metric:1\n\tRX packets:1352 errors:0\
    \ dropped:1385 overruns:0 frame:0\n\tTX packets:0 errors:0 dropped:0 overruns:0\
    \ carrier:0 collisions:0 txqueuelen:1000\n\tRX bytes:172082 (168.0 KiB)  TX bytes:0\
    \ (0.0 B)\n```\n\n> > 我们已经成功创建了名为**mon0**的监听模式接口，该接口将用于嗅探空中的无线数据包，这个接口是为我们的无线网卡创建的。你还可以用同一张物理网卡创建多个监听模式接口，你可以使用*airmon-ng*工具了解具体操作方法。接下来我们会使用**Wireshark**，通过刚刚创建的mon0监听模式接口嗅探空中的数据包。\n\
    \n## 嗅探无线数据包\n请按照以下步骤开始嗅探数据包：\n1. 启动我们在第1章《无线实验室搭建》中配置好的接入点无线实验室。\n2. 在控制台中输入*Wireshark*启动该工具，Wireshark启动后，导航到**捕获\
    \ | 接口**。\n3. 点击**mon0**接口右侧的**开始**按钮，选择从**mon0**接口捕获数据包（如上图所示），Wireshark将开始捕获，此时你会在**Wireshark**窗口中看到数据包。\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_23_0.png)\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_24_0.png)\n\
    4. 这些是你的无线网卡从空中嗅探到的无线数据包，要查看任意数据包的内容，只需在顶部窗口选中该数据包，完整的数据包内容就会显示在中间窗口。\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_25_0.png)\n\
    点击IEEE 802.11无线局域网管理帧前的三角形图标即可展开查看额外信息，查看数据包中的不同头部字段，并将其与你之前学习的WLAN帧类型和子类型对应起来。\n\
    \n我们刚刚完成了第一批空中数据包的嗅探！我们启动的Wireshark使用的是之前创建的mon0监听模式接口。查看Wireshark的底部区域，你可以看到当前数据包的捕获速率以及已捕获的数据包总数。\n\
    \nWireshark的追踪结果有时会让人望而生畏，哪怕是用户量适中的无线网络，你也可能嗅探到数千个数据包。因此，能够筛选出我们感兴趣的数据包非常重要，你可以通过Wireshark的筛选功能实现这一点。你可以探索如何使用这些筛选功能，在追踪结果中识别出唯一的无线设备，包括接入点和无线客户端。如果你还不会操作也没关系，这是我们接下来要学习的内容。\n"
