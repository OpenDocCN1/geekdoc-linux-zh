  md: '> > We created multiple Honeypots with the same SSID but different security
    configurations. Depending on which configuration the client had stored for the
    "Wireless Lab" network, it connected to the appropriate one. This technique can
    come in handy as, if you are doing a penetration test, you won''t know which security
    configurations the client has on its laptop. This allows you to find the appropriate
    one by setting a bait for the client. This technique is also called **WiFishing**.


    You can create different security configurations on the client for the same SSID,
    and check whether your set of Honeypots is able to detect them.


    It is important to note that many Wi-Fi clients might not actively probe for networks
    they have stored in their profile. It might not be possible to detect these networks
    using the technique we discussed here.


    # ## Quiz – Advanced wireless attacks


    Q1. In an MITM attack, who is in the middle?


    +   1. The access point.

    2. The attacker.

    3. The victim.

    4. None of the above.


    Q2. Dnsspoof:


    +   1. Spoofs DNS requests.

    2. Spoofs DNS responses.

    3. Needs to run on the DNS server.

    4. Needs to run on the access point.


    Q3. A wireless MITM attack can be orchestrated:'
  merge: -1
  pgno: 135
- img_proc: true
  md: '+   1. On all wireless clients at the same time.

    2. Only one channel at a time.

    3. On any SSID.

    4. Both 3 and 4.


    Q4. Which is the interface closest to the victim in our MITM setup?


    +   1. At0.

    2. Eth0.

    3. Br0.

    4. En0.


    # ## Summary


    In this chapter, we learned how to conduct advanced attacks using wireless as
    the base. We created a setup for a MITM attack over wireless and then used it
    to eavesdrop on the victim''s traffic. We then used the same setup to hijack the
    application layer of the victim (web traffic, to be specific) using a DNS poisoning
    attack.


    In the next chapter, we will learn how to conduct a wireless penetration test
    right from the planning, discovery, and attack to the reporting stage. We will
    also touch upon the best practices to secure WLANs.'
