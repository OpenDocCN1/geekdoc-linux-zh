    > > We just successfully injected packets into our test lab network using

    > aireplay-ng. It is important to note that our card injected these arbitrary

    > packets into the network without being actually connected to the access

    > point Wireless Lab.


    # **Important notes on WLAN sniffing and injection**


    WLANs typically operate within three different frequency ranges 2.4 GHz, 3.6 GHz
    and 4.9/5.0 GHz. Not all Wi-Fi cards support all these ranges and associated bands.
    For instance, an Alfa card only supports IEEE 802.11b/g. This would mean that
    this card cannot operate in 802.11a/n. The key here is to sniff or inject packets
    in a particular band; your Wi-Fi card will need to support it.


    Another interesting aspect of Wi-Fi is that, in each of these bands, there are
    multiple channels. It is important to note that your Wi-Fi card can only be on
    one channel at any given moment. It is not possible to tune into multiple channels
    at the same time. The best analogy I can give you is your car radio. You can tune
    it to only one of the available channels at any given time. If you want to hear
    to something else, you will have to change the channel. The same principle applies
    to WLAN Sniffing. This brings us to an important conclusion—we cannot sniff all
    channels at the same time; we will need to select the channel that is of interest
    to us. What this means is that, if our access point of interest is on channel
    1, we will need to set our card on channel 1.


    Though we have addressed WLAN sniffing in the above paragraphs, the same applies
    to injection as well. To inject packets on a specific channel, we will need to
    put the card radio on that channel.


    Let''s now do some exercises on setting our card to specific channels, channel
    hopping, setting regulatory domains, power levels etc.'
- md: '## Experimenting with your adapter

    Follow the instructions below carefully:

    - 1. Enter the `iwconfig wlan0` command to check the capabilities of your card.
    As you can see in the figure below, my adapter can operate in the b, g, and n
    bands.

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_34_0.png)

    - 2. To set the card on a particular channel, we use the `iwconfig mon0 channel
    X` commands.

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_34_1.png)

    - 3. The iwconfig series of commands does not have a channel hopping mode. One
    could write a simple script over it to make it do so. An easier way is to use
    Airodump-NG with options to either hop channels arbitrarily, use only a subset,
    or use only selected bands. All these options are illustrated in the screenshot
    below when we run `airodump-ng --help`:

    ```root@kali:~

    File Edit View Search Terminal Help

    Options:

    --ivs : Save only captured IVs

    --gpsd : Use GPSd

    --write <prefix> : Dump file prefix

    -w : same as --write

    --beacons : Record all beacons in dump file

    --update <secs> : Display update delay in seconds

    --showack : Prints ack/cts/rts statistics

    -h : Hides known stations for --showack

    -f <msecs> : Time in ms between hopping channels

    --berlin <secs> : Time before removing the AP/client from the screen when no more
    packets are received (Default: 120 seconds)

    -r <file> : Read packets from that file

    -x <msecs> : Active Scanning Simulation

    --manufacturer : Display manufacturer from IEEE OUI list

    --output-format <formats> : Output format. Possible values: pcap, ivs, csv, gps,
    kismet, netxml

    --ignore-negative-one : Removes the message that says fixed channel <interface:
    -1>


    Filter options:

    --encrypt <suite> : Filter APs by cipher suite

    ```

    | We understood that both wireless sniffing and packet injection depend on the
    hardware support available. This means that we can only operate on bands and channels
    allowed by our card. Also, the wireless card radio can only be on one channel
    at a time. This further means that we can only sniff or inject in one channel
    at a time. |

    | --- |

    | If you need to simultaneously sniff on multiple channels, you will require multiple
    physical Wi-Fi cards. If you can procure additional cards, then try to sniff on
    multiple channels simultaneously. |


    ## The role of regulatory domains in wireless

    The complexities of Wi-Fi don''t end here. Every country has its own unlicensed
    spectrum allocation policy. This specifically dictates allowed power levels and
    allowed users for the spectrum. In the US, for example, the **FCC** decides this
    and, if you use WLANs in the US, you have to abide by these regulations. In some
    countries, not doing this is a punishable offense. Now let''s look at how we can
    find the default regulatory settings and then how to change them if required.


    ## Testing with your adapter

    Follow these instructions carefully:

    - 1. Reboot your computer and do not connect your adapter to it yet.

    - 2. Once logged in, monitor the kernel messages using the *tail* command:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_36_0.png)

    Insert the adapter, and you should see something that resembles the following
    screenshot. This shows the default regulatory settings applied to your card:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_37_0.png)

    - 3. Let''s assume that you are based in the US. To change your regulatory domain
    to the US, we issue the command `iw reg set US` in a new terminal:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_37_1.png)

    If the command is successful, we get an output such as the one in the following
    screenshot in the terminal where we monitoring `/var/log/messages`:

    ```root@kali:~# tail -f -n 0 /var/log/messages

    Aug 25 20:00:37 kali kernel: [ 2751.341258] cfg80211: Calling CRDA for country:
    US

    Aug 25 20:00:37 kali kernel: [ 2751.350862] cfg80211: Regulatory domain changed
    to country: US

    Aug 25 20:00:37 kali kernel: [ 2751.350867] cfg80211: (start_freq - end_freq @
    bandwidth), (max_antenna_gain, max_eirp)

    Aug 25 20:00:37 kali kernel: [ 2751.350871] cfg80211: (2402000 KHz - 2472000 KHz
    @ 40000 KHz), (300 mBi, 2700 mBm)

    Aug 25 20:00:37 kali kernel: [ 2751.350916] cfg80211: (5170000 KHz - 5250000 KHz
    @ 40000 KHz), (300 mBi, 1700 mBm)

    Aug 25 20:00:37 kali kernel: [ 2751.350920] cfg80211: (5250000 KHz - 5330000 KHz
    @ 40000 KHz), (300 mBi, 2000 mBm)

    Aug 25 20:00:37 kali kernel: [ 2751.350923] cfg80211: (5490000 KHz - 5600000 KHz
    @ 40000 KHz), (300 mBi, 2000 mBm)

    Aug 25 20:00:37 kali kernel: [ 2751.350926] cfg80211: (5650000 KHz - 5710000 KHz
    @ 40000 KHz), (300 mBi, 2000 mBm)

    Aug 25 20:00:37 kali kernel: [ 2751.350929] cfg80211: (5735000 KHz - 5835000 KHz
    @ 40040 KHz), (300 mBi, 3000 mBm)

    ```

    - 4. Now try changing the card to channel 11; it will work. But, when you try
    changing it to channel 12, you get an error. This is because channel 12 cannot
    be used in the US.

    ```root@kali:~# iwconfig wlan1 channel 11

    root@kali:~#

    root@kali:~# iwconfig wlan1

    wlan1 IEEE 802.11bgn ESSID:off/any

    Mode:Managed Frequency:2.462 GHz Access Point: Not-Associated Tx-Power=27 dBm

    Retry long limit:7 RTS thr:off Fragment thr:off Encryption key:off Power Management:on

    root@kali:~# iwconfig wlan1 channel 12

    Error for wireless request "Set Frequency" (8B04) : SET failed on device wlan1
    ; Invalid argument.

    root@kali:~# iwconfig wlan1

    wlan1 IEEE 802.11bgn ESSID:off/any

    Mode:Managed Frequency:2.462 GHz Access Point: Not-Associated Tx-Power=27 dBm

    Retry long limit:7 RTS thr:off Fragment thr:off Encryption key:off Power Management:on

    root@kali:~#

    ```

    - 5. The same applies for power levels. The US only allows a maximum of 27 dBm
    (500 milliwatts); thus even though my adapter has an advertised power of 1 Watt
    (30 dBm), we cannot set the card to the maximum transmit power:

    ```root@kali:~# iwconfig wlan1 txpower 27

    root@kali:~#

    root@kali:~# iwconfig wlan1 txpower 30

    Error for wireless request "Set Tx Power" (8B26) : SET failed on device wlan1
    ; Invalid argument.

    root@kali:~#

    ```

    - 6. However, if we were in Bolivia, then we could transmit at a power of 1 Watt
    as this is allowed there. As we can see, once we set the regulatory domain to
    Bolivia—`iw reg set BO`—we can change the card power to 30 dBm or 1 Watt. We can
    also use channel 12 in Bolivia, which was disallowed in the US:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_40_0.png)

    Every country has its own regulations for the use of the unlicensed wireless band.
    When we set our regulatory domain to a specific country, our card will obey the
    allowed channels and power levels specified. However, it is easy to change the
    regulatory domain of the card and force it to work on disallowed channels and
    to transmit at a power level that is greater than allowed.

    | Exploring regulatory domains: |

    | --- |

    | Look at the various parameters you can set such as channel, power, regulatory
    domains etc. |

    | Using the *iw* series of commands on Kali, this should give you a firm understanding
    of how to configure your card when you are in various countries and require to
    change your card settings. |


    ## Quiz – WLAN packet and injection

    Q1. Which frame types are responsible for authentication in WLANs?

    - 1. Control

    - 2. Management

    - 3. Data

    - 4. QoS

    Q2. What is the name of the second monitor mode interface that can be created
    on wlan0 using airmon-ng?

    - 1. Mon0

    - 2. Mon1

    - 3. 1Mon

    - 4. Monb

    Q3. What is the filter expression to view all non-beacon frames in Wireshark?

    - 1. `!(wlan.fc.type_subtype==0x08)`

    - 2. `wlan.fc.type_subtype==0x08`

    - 3. (no beacon)

    - 4. `Wlan.fc.type== 0x08`


    ## Summary

    In this chapter, we have made some key observations about WLAN protocols. Management,
    Control and Data frames are unencrypted and thus can be easily read by someone
    who is monitoring the airspace. It is important to note here that the data packet
    payload can be protected using encryption to keep it confidential. We will talk
    about this in the next chapter. We can sniff the entire airspace in our vicinity
    by putting our card into monitor mode. As there is no integrity protection in
    Management and Control frames, it is very easy to inject these packets by modifying
    them or replaying them as-is using tools such as aireplay-ng. Unencrypted data'
