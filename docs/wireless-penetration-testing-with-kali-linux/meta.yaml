- md: "We created multiple Honeypots with the same SSID but different security configurations.\
    \ Depending on which configuration the client had stored for the \"Wireless Lab\"\
    \ network, it connected to the appropriate one. This technique can come in handy\
    \ as, if you are doing a penetration test, you won't know which security configurations\
    \ the client has on its laptop. This allows you to find the appropriate one by\
    \ setting a bait for the client. This technique is also called **WiFishing**.\
    \ You can create different security configurations on the client for the same\
    \ SSID, and check whether your set of Honeypots is able to detect them. It is\
    \ important to note that many Wi-Fi clients might not actively probe for networks\
    \ they have stored in their profile. It might not be possible to detect these\
    \ networks using the technique we discussed here.\n\n## Quiz – Advanced wireless\
    \ attacks\n\nQ1. In an MITM attack, who is in the middle?\n- 1. The access point.\n\
    - 2. The attacker.\n- 3. The victim.\n- 4. None of the above.\n\nQ2. Dnsspoof:\n\
    - 1. Spoofs DNS requests.\n- 2. Spoofs DNS responses.\n- 3. Needs to run on the\
    \ DNS server.\n- 4. Needs to run on the access point.\n\nQ3. A wireless MITM attack\
    \ can be orchestrated:\n- 1. On all wireless clients at the same time.\n- 2. Only\
    \ one channel at a time.\n- 3. On any SSID.\n- 4. Both 3 and 4.\n\nQ4. Which is\
    \ the interface closest to the victim in our MITM setup?\n- 1. At0.\n- 2. Eth0.\n\
    - 3. Br0.\n- 4. En0.\n\n## Summary\n\nIn this chapter, we learned how to conduct\
    \ advanced attacks using wireless as the base. We created a setup for a MITM attack\
    \ over wireless and then used it to eavesdrop on the victim's traffic. We then\
    \ used the same setup to hijack the application layer of the victim (web traffic,\
    \ to be specific) using a DNS poisoning attack. In the next chapter, we will learn\
    \ how to conduct a wireless penetration test right from the planning, discovery,\
    \ and attack to the reporting stage. We will also touch upon the best practices\
    \ to secure WLANs.\n\n## Chapter 8: Attacking WPA-Enterprise and Radius\n\nWPA-Enterprise\
    \ has always had an aura of unbreakable ability around it. Most network administrators\
    \ think of it as a panacea for all their wireless security problems. In this chapter,\
    \ we will see that nothing could be further from the truth. In this chapter, we\
    \ will learn how to attack WPA-Enterprise using different tools and techniques\
    \ available on Kali. In this chapter, we will cover the following topics:\n- Setting\
    \ up FreeRADIUS-WPE\n- Attacking PEAP on Windows clients\n- Security best practices\
    \ for Enterprises\n\n### Setting up FreeRadius-WPE\n\nWe will need a RADIUS server\
    \ for orchestrating WPA-Enterprise attacks. The most widely used open source RADIUS\
    \ server is FreeRADIUS. However, setting it up is difficult and configuring it\
    \ for each attack can be tedious. Kali doesn't naturally come with FreeRADIUS-WPE,\
    \ so you need to perform the following steps to set up FreeRADIUS-WPE:\n\n- 1.\
    \ Navigate to [https://github.com/brad-anton/freeradius-wpe](https://github.com/brad-anton/freeradius-wpe)\
    \ and you will find the downloaded link at [https://github.com/brad-anton/freeradius-wpe/raw/master/freeradius-server-wpe_2.1.12-1_i386.deb]:\n\
    \n- 2. Once it is downloaded, install it with `dpkg -i freeradius-server-wpe_2.1.12-1_i386.deb`\
    \ followed by `ldconfig`:\n```\nroot@kali:~# dpkg -i freeradius-server-wpe_2.1.12-1_i386.deb\n\
    Selecting previously unselected package freeradius-server-wpe.\n(Reading database\
    \ ... 345364 files and directories currently installed.)\nUnpacking freeradius-server-wpe\
    \ (from freeradius-server-wpe_2.1.12-1_i386.deb) ..\nSetting up freeradius-server-wpe\
    \ (2.1.12-1) ...\nProcessing triggers for man-db ...\n```\n\nLet's now quickly\
    \ set up the RADIUS server on Kali:\n\n- 3. Connect one of the LAN ports of the\
    \ access point to the Ethernet port on your machine running Kali. In our case,\
    \ the interface is eth0. Bring up the interface and get an IP address by running\
    \ DHCP, as shown in the following screenshot:\n```\nroot@kali:~# dhclient eth0\n\
    Reloading /etc/samba/smb.conf: smbd only.\nRTNETLINK answers: File exists\nroot@kali:~#\
    \ ping 192.168.1.1\nPING 192.168.1.1 (192.168.1.1) 56(84) bytes of data.\n64 bytes\
    \ from 192.168.1.1: icmp_req=1 ttl=128 time=0.992 ms\n64 bytes from 192.168.1.1:\
    \ icmp_req=2 ttl=128 time=0.820 ms\n^C\n--- 192.168.1.1 ping statistics ---\n\
    2 packets transmitted, 2 received, 0% packet loss, time 1001ms\nrtt min/avg/max/mdev\
    \ = 0.820/0.906/0.992/0.086 ms\nroot@kali:~#\n```\n\n- 4. Login to the access\
    \ point and set the security mode to WPA/WPA2-Enterprise, set **Version** to WPA2,\
    \ **Encryption** to AES. Then, under the EAP (802.1x) section, enter the **Radius\
    \ Server IP** address as your Kali build's IP address. The **Radius Password**\
    \ will be test, as shown in the following screenshot:\n\n- 5. Let's now open a\
    \ new terminal and go to the directory /usr/local/etc/raddb. This is where all\
    \ the FreeRADIUS-WPE configuration files are:\n```\nroot@kali:/usr/local/etc/raddb#\
    \ ls\nacct_users\nclients.conf\nldap.attrmap\nsites-available\nattrs\ndictionary\n\
    modules\nsites-enabled\nattrs.access_challenge\neap.conf\npolicy.conf\nsql\nattrs.access_reject\n\
    example.pl\npolicy.txt\nattrs.accounting_response\nexperimental.conf\npreproxy_users\n\
    sql.conf\nattrs.pre-proxy\nhints\nproxy.conf\nsqlippool.conf\ncerts\nhuntgroups\n\
    radiusd.conf\ntemplates.conf\n```\n\n- 6. Let's open eap.conf. You will find that\
    \ the default_eap_type command is set to MD5. Let's change this to peap:\n```\n\
    default_eap_type = peap\n```\n\n- 7. Let's open clients.conf. This is where we\
    \ define the allowed list of clients that can connect to our Radius server. Interestingly,\
    \ if you browse right to the bottom, ignoring the example settings, the secret\
    \ for clients in the range 192.168.0.0/16 defaults to test. This is exactly what\
    \ we used in step 2:\n```\nGNU nano 2.2.6\nFile: clients.conf\n\n# Un-comment\
    \ this section, and edit a \"listen\" section to add:\n# \"clients = per_socket_clients\"\
    . That IP address/port combination\n# will then accept ONLY the clients listed\
    \ in this section.\n#\n#per_socket_clients {\n#     client 192.168.3.4 {\n#  \
    \       secret = testing123\n#     }\n#}\nclient 192.168.0.0/16 {\n    secret\
    \ = test\n    shortname = testAP\n}\n```\n\n- 8. We are now all set to start the\
    \ RADIUS server with the `radiusd -s -X` command:\n```\nroot@kali:~# radiusd -s\
    \ -X\n```\n\n- 9. Once you run this, you will see a lot of debug messages on the\
    \ screen, but eventually the server will settle down to listen for requests. Awesome!\
    \ We are all set now to start our lab sessions in this chapter:\n\n```\n# root@kali:\
    \ ~                            File Edit View Search Terminal Help\n```\n\n```\n\
    listen {\n    type = \"acct\"\n    ipaddr = *\n    port = 0\n}\n```\n\n```\nlisten\
    \ {\n    type = \"control\"\n    listen {\n        socket = \"/usr/local/var/run/radiusd/radiusd.sock\"\
    \n    }\n}\n```\n\n```\nlisten {\n    type = \"auth\"\n    ipaddr = 127.0.0.1\n\
    \    port = 18120\n}\n```\n\n```\n... adding new socket proxy address * port 45609\n\
    Listening on authentication address * port 1812\nListening on accounting address\
    \ * port 1813\nListening on command file /usr/local/var/run/radiusd/radiusd.sock\n\
    Listening on authentication address 127.0.0.1 port 18120 as server inner-tunnel\n\
    Listening on proxy address * port 1814\nReady to process requests.\n```\n\n###\
    \ Attacking PEAP\n\nProtected Extensible Authentication Protocol (PEAP) is the\
    \ most popular version of EAP in use. This is the EAP mechanism shipped natively\
    \ with Windows. PEAP has two versions:\n- PEAPv0 with EAP-MSCHAPv2 (the most popular\
    \ as this has native support on Windows)\n- PEAPv1 with EAP-GTC\n\nPEAP uses server-side\
    \ certificates for validation of the RADIUS server. Almost all attacks on PEAP\
    \ leverage misconfigurations in certificate validation. Next, we will take look\
    \ at how to crack PEAP when certificate validation is turned off on the client.\
    \ Follow the given instructions to get started:\n\n- 1. We double-check the eap.conf\
    \ file to ensure that PEAP is enabled:\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_142_0.png)\n\
    \n- 2. We then restart the RADIUS server with `radiusd -s -X`:"
