  md: '> Use Wireshark to analyze the data packets further. You would notice that
    a DHCP request is made by the client and, if a DHCP server is available, it responds
    with an address. Then you would find ARP packets and other protocol packets on
    the air. This is a nice and simple way to do passive host discovery on the wireless
    network. It is important to be able to see a packet trace and reconstruct how
    applications on the wireless host are communicating with the rest of the network.
    One of the interesting features Wireshark provides is the ability to follow a
    stream. This allows you to view multiple packets together, that are part of a
    TCP exchange, in the same connection.


    Also, try logging into [www.yahoo.com](http://www.yahoo.com) or any other popular
    website and analyze the data traffic generated.


    We will now see a demonstration of how to inject packets into a wireless network.


    # Packet injection


    We will be using the *aireplay-ng* tool, which is available in **Kali**.


    Follow the instructions below carefully:


    +   1. In order to do an injection test, first start Wireshark and the filter
    expression `(wlan.bssid == <mac>) && !(wlan.fc.type_subtype == 0x08)`.


    This will ensure that we only see non-beacon packets for our lab network.


    2. Now run the following command `aireplay-ng -9 -e Wireless Lab -a <mac> mon0`
    on a terminal.


    3. Go back to Wireshark and you should see a lot of packets on the screen now.
    Some of these packets have been sent by aireplay-ng, which we launched, and others
    are from the access point Wireless Lab in response to the injected packets.'
