- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_96_0.png)


    +   6. As we are closer to this client, our signal strength is higher, and it
    connects to our evil twin access point.


    +   7. We can also spoof the BSSD and MAC address of the access point using the
    following command:


    ```

    `airbase-ng –a <router mac> --essid "Wireless Lab" –c 11 mon0`

