  md: '# Probe sniffing


    We have spoken about probes previously, and how they can be used to identify hidden
    networks and perform effective rogue access point attacks. They can also be used
    to identify individuals as targets or track them on a mass scale with minimal
    equipment.


    When a device wishes to connect to a network, it sends a probe request that contains
    its own MAC address and the name of the network it wishes to connect to. We can
    use tools such as airodump-ng to track these. However, if we wish to identify
    whether an individual was present at a specific location at a specific time or
    look for trends in Wi-Fi usage, we will need to use a different approach.


    In this section, we will utilize tshark and Python to collect data. You will receive
    the code and an explanation of what is being done.


    Follow the given instructions to get started:


    +   1. First of all, we need a device that''s looking for multiple networks. Generally,
    a normal smartphone such as an Android device or iPhone will do the trick. Desktops
    don''t generally make good targets as they tend to remain in one location. Newer
    iPhones and Android devices may have probe requests disabled or obfuscated, so
    do check before you give up.


    2. Once you have your device, make sure the Wi-Fi is turned on.


    3. Then set up your monitoring interface as we have done many times before:'
  merge: -1
  pgno: 159
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_160_0.png)


    4. The next thing to be done is to look for probe requests with tshark via the
    following command:


    ```

    tshark -n -i mon0 subtype probereq

    ```


    The screenshot of the following command is as follows:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_160_1.png)


    5. Your output at this point is a little rough, as the default output from tshark
    is not designed to be readable, just to have as much information in it as possible.
    It should look like the following:'
  merge: -1
  pgno: 160
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_161_0.png)


    +   6. You can clearly see the MAC address and SSID of the probe request; however,
    this output can be improved. We can use the following command to make it more
    readable:


    ```

    tshark -n -i mon0 subtype proberequest -T fields -e separator= -e wlan.sa -e wlan_mgt.ssid

    ```


    The screenshot of the following command is as follows:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_161_1.png)


    +   7. The output here is much more readable:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_161_2.png)


    # 8. So, now we have the output in a readable format, what next?


    What we do is create a Python script that will run the command and record the
    output for later analysis. Before running the code, you will need to ensure that
    you have your monitoring interface ready and that a file called results.txt is
    created in the directory you are in. The Python script is as follows:'
  merge: -1
  pgno: 161
- img_proc: true
  md: "```\nimport subprocess\nimport datetime\nresults = open(\"results.txt\", \"\
    a\")\nwhile 1:\n    blah = subprocess.check_output([\"tshark –n –i mon0 subtype\
    \ probereq –T fields –e separator= -e wlan.sa –e wlan_mgt.ssid –c 100\"], shell=True)\n\
    \    splitblah = blah.split(\"\\n\")\n    for value in splitblah[:-1]:\n     \
    \   splitvalue = value.split(\"\\t\")\n        MAC = str(splitvalue[1])\n    \
    \    SSID = str(splitvalue[2])\n        time = str(datetime.datetime.now())\n\
    \        Results.write(MAC+\" \"+SSID+\" \"+time+\"\\r\\n\")\n```\n\nLet's get\
    \ briefed on the python script:\n\n+   - import subprocess library and datetime\
    \ library: This allow us to refer to the subprocess and datetime libraries. The\
    \ subprocess library allows us to monitor the interface from the Linux command\
    \ line, and datetime allows us to get the accurate time and date readings.\n-\
    \ while 1: This line means run until stopped.\n- results = open(\"results.txt\"\
    , \"a\"): This opens a file with the append rights and assigns it to results.\
    \ The append rights only allow the script to add to the contents of the file.\
    \ This stops the file from constantly being overwritten.\n- blah = subprocess.check_output([\"\
    tshark –n –i mon0 subtype probereq –T fields –e separator= -e wlan.sa –e wlan_mgt.ssid\
    \ –c 100\"], shell=True): This opens a shell to perform our previously tested\
    \ tshark command. The only difference this time is –c 100. What this flag does\
    \ is it limit the command to 100 queries. This"
  merge: -1
  pgno: 162
- img_proc: true
  md: "allows us to return the results to ourselves without having to stop the program.\
    \ Since we said run forever after writing the results, the script will restart\
    \ again.\n\n+   - This line takes the output from the shell and assigns it to\
    \ the variable blah.\n- splitblah = blah.split(\"\\n\"): This takes the variable\
    \ blah and splits it by line.\n- for value in splitblah[1:]: This repeats the\
    \ following action for each line in the output, ignoring the first line that contains\
    \ headers.\n- splitvalue = value.split(\"\\t\"): This breaks each line into further\
    \ smaller chunks using the tab character as the delimiter.\n- The following three\
    \ lines take each chunk of text and assign it to a variable.\n  MAC = str(splitvalue[1])\n\
    \  SSID = str(splitvalue[2])\n  time = str(datetime.datetime.now())\n- results.write(MAC+\"\
    \ \"+SSID+\" \"+time+\"\\r\\n\"): This takes all the values, writes them to a\
    \ file separated by spaces, and ends with a return and a new line for neatness.\n\
    \nThe output will be neat lines of text written to the file.\n\nResearch which\
    \ tools are available that allow visualization or data analytics and are easily\
    \ integrated with Python. Tools such as Maltego have free versions that can be\
    \ used to plot information.\n\nSet yourself up a MySQL database to record the\
    \ data and reconfigure the preceding Python script to output the results to the\
    \ database. Then, build another script (or do it in the same one) to retrieve\
    \ the data and output it to Maltego.\n\nReconfigure the script to query WiGLE,\
    \ and collect geolocation data for probe requests. Output this data through **Maltego**."
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Make an attempt to set up a web-based frontend through Flask, Django, or PHP
    to display your results. Investigate currently existing solutions for presenting
    the data and attempting to emulate or improve them through a discussion with their
    creators.


    # ## Summary


    In this chapter, we discussed the attacks against WPS that have come about since
    the release of the original book and also performed an initial foray into integrating
    wireless tools with Python. Alas, we have come to end of the book, I hope it''s
    been informative and interesting.


    See you in another books and works.'
  merge: -1
