  md: '# Chapter 5: Attacks on the WLAN Infrastructure


    The WLAN infrastructure is what provides wireless services to all the WLAN clients
    in a system. In this chapter, we will take a look at the various attacks that
    can be conducted against the infrastructure:


    +   - Default accounts and credentials on the access point

    - Denial of service attacks

    - Evil twin and access point MAC spoofing

    - Rogue access points


    # Default accounts and credentials on the access point


    WLAN access points are the core building blocks of the infrastructure. Even though
    they play such an important role, they are sometimes the most neglected in terms
    of security. In this exercise, we will check whether the default passwords have
    been changed on the access point or not. Then, we will go on to verify that, even
    if the passwords have been changed, they are still easy to guess and crack using
    a dictionary-based attack.


    It is important to note that, as we move on to more advanced chapters, it will
    be assumed that you have gone through the previous chapters and are now familiar
    with the use of all the tools discussed there. This will allow us to build on
    that knowledge and try more complicated attacks!


    # Cracking default accounts on the access points


    +   1. Let''s first connect to our access point Wireless Lab and attempt to navigate
    to the HTTP management interface. We see that the access point model is TP-Link
    WR841N, as shown in the following screenshot:'
