    ## Preface

    Wireless Networks have become ubiquitous in today''s world. People use it worldwide
    every day at their homes, offices and public hotspots to logon to the Internet
    and do both personal and professional work. Even though wireless makes life incredibly
    easy and gives us such great mobility, it comes with risks. In recent times, insecure
    wireless networks have been used to break into companies, banks and government
    organizations. The frequency of these attacks is only intensified, as network
    administrators are still clueless when it comes to securing wireless networks
    in a robust and fool proof way. helping the reader understand the insecurities
    associated with wireless networks, and how to conduct penetration tests to find
    and plug them. This is an essential read for those who would like to conduct security
    audits on wireless networks and always wanted a step-by-step practical. As every
    wireless attack explained in this book is immediately followed by a practical
    demo, the learning is very complete. I have chosen Kali Linux as the platform
    to test all the wireless attacks in this book. Kali Linux is the world''s most
    popular penetration testing distribution. It contains hundreds of security and
    hacking tools, some of which we will use in this course of this book.


    ## What you need for this book

    To follow and recreate the practical exercises in this book you will need two
    laptops with built in Wi-Fi cards, a USB wireless Wi-Fi adapter, Kali Linux and
    some other hardware and software. As an alternate to the two laptops, you could
    also create a Virtual Machine housing Kali Linux and connect the card to it over
    the USB interface. This will help you get started with using this book much faster,
    but we would recommend a dedicated machine running Kali Linux for actual assessments
    in the field. From a prerequisite perspective, readers should be aware of the
    basics of wireless networks. This includes having prior knowledge about the basics
    of the 802.11 protocol and client-access point communication. Though we will briefly
    touch upon some of this when we setup the lab, it is expected that the user is
    already aware of these concepts.


    ## For whom is this book

    Though this book is a Beginner''s series, it is meant for all levels of users,
    from amateurs right through to wireless security experts. There is something for
    everyone. The book starts with simple attacks but then moves on to explain the
    more complicated ones, and finally discusses bleeding edge attacks and research.
    As all attacks are explained using practical demonstrations, it is very easy for
    readers at all levels to quickly try the attack out by themselves. Please note
    that even though the book highlights the different attacks, which can be launched
    against a wireless network, the real purpose is to educate the user to become
    a wireless penetration tester. An adept penetration tester would understand all
    the attacks out there and would be able to demonstrate them with ease, if requested
    by his client.


    ## Conventions

    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning. Code words in text, database table names, folder
    names, filenames, file extensions, pathnames, dummy URLs, user input, and Twitter
    handles are shown as follows: "Open a console terminal and type in `iwconfig`."
    Any command-line input or output is written as follows:

    ```

    airodump-ng -bssid 00:27:01:D4:8E:25 --channel 11 --write WEPCrackingDemo mon0

    ```


    ## CHAPTER 1: Wireless Lab Setup

    Behind every successful execution is hours or days of preparation, and wireless
    penetration testing is no exception. In this chapter, we will create a wireless
    lab that we will use for our experiments in this book. Consider this lab as your
    preparation arena before you dive into real-world penetration testing!


    Wireless penetration testing is a practical subject, and it is important to first
    set up a lab where we can try out all the different experiments in this book in
    a safe and controlled environment. It is important that you set up this lab first
    before moving on in this book.


    In this chapter, we will look at the following:

    - Hardware and Software requirements

    - Downloading and Installing Kali Linux

    - Setting up an access point and configuring it

    - Installing the wireless card

    - Testing connectivity between the laptop and the access point


    ### Hardware requirements

    We will need the following hardware to setup the wireless lab:

    - Two laptops with internal Wi-Fi cards: We will use one of the laptops as the
    victim in our lab and the other as the penetration tester''s laptop. Though almost
    any laptop would fit this profile, laptops with at least 4 GB RAM are desirable.
    This is because we may be running a lot of memory-intensive software in our experiments.

    - One wireless adapter (Optional): Depending on the wireless card of your laptop,
    we may need a USB Wi-Fi card that can support packet injection and packet sniffing,
    which is supported by Kali. The best choice seems to be the Alfa AWUS036H card
    from Alfa Networks, as Kali supports this out-of-the-box. This is available on
    www.amazon.com for a retail price of $30 at the time of writing. An alternative
    option is the TP-Link N150 Wireless High Gain USB Adapter (TL-WN722N), Panda 300Mbps
    Wireless N USB Adapter, and Edimax EW-7711UAN, which is smaller and, marginally,
    cheaper.

    - One access point: Any access point that supports WEP/WPA/WPA2 encryption standards
    would fit the bill. I will be using a TP-LINK TL-WR841N Wireless router for the
    purpose of illustration in this book. You can purchase it from www.amazon.com
    for a retail price of around $25 at the time of writing.

    - An active internet connection: This will help for performing research, downloading
    software, and for some of our experiments.


    ### Software requirements

    We will need the following software to set up the wireless lab:

    - Kali Linux: This software can be downloaded from the official website located
    at http://www.kali.org. The software is open source, and you should be able to
    download it directly from the website.

    - Windows 7/ Windows 8/ Windows 8.1 or Windows 10: You will need any one of Windows
    7, Windows 8, Windows 8.1, or Windows 10 installed on one of the laptops. This
    laptop will be used as the victim machine for the rest of the book. It is important
    to note that, even though we are using a Windows-based OS for our tests, the techniques
    learnt can be applied to any Wi-Fi-capable devices such as smart phones and tablets,
    among others.'
