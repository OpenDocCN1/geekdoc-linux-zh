    # ## Preface


    Wireless Networks have become ubiquitous in today''s world. People use it worldwide
    every day at their homes, offices and public hotspots to logon to the Internet
    and do both personal and professional work. Even though wireless makes life incredibly
    easy and gives us such great mobility, it comes with risks. In recent times, insecure
    wireless networks have been used to break into companies, banks and government
    organizations. The frequency of these attacks is only intensified, as network
    administrators are'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'still clueless when it comes to securing wireless networks in a robust and
    fool proof way.


    helping the reader understand the insecurities associated with wireless networks,
    and how to conduct penetration tests to find and plug them. This is an essential
    read for those who would like to conduct security audits on wireless networks
    and always wanted a step-by-step practical. As every wireless attack explained
    in this book is immediately followed by a practical demo, the learning is very
    complete.


    I have chosen Kali Linux as the platform to test all the wireless attacks in this
    book. Kali Linux, is the world''s most popular penetration testing distribution.
    It contains hundreds of security and hacking tools, some of which we will use
    in this course of this book.


    # What you need for this book


    To follow and recreate the practical exercises in this book you will need two
    laptops with built in Wi-Fi cards, a USB wireless Wi-Fi adapter, Kali Linux and
    some other hardware and software.


    As an alternate to the two laptops, you could also create a Virtual Machine housing
    Kali Linux and connect the card to it over the USB interface. This will help you
    get started with using this book much faster, but we would recommend a dedicated
    machine running Kali Linux for actual assessments in the field.


    From a prerequisite perspective, readers should be aware of the basics of wireless
    networks. This includes having prior knowledge about the basics of the 802.11
    protocol and client-access point communication. Though we will briefly touch upon
    some of this when we setup the lab, it is expected that the user is already aware
    of these concepts.'
  merge: -1
  pgno: 5
- img_proc: true
  md: '# ## For whom is this book


    Though this book is a Beginner''s series, it is meant for all levels of users,
    from amateurs right through to wireless security experts. There is something for
    everyone. The book starts with simple attacks but then moves on to explain the
    more complicated ones, and finally discusses bleeding edge attacks and research.
    As all attacks are explained using practical demonstrations, it is very easy for
    readers at all levels to quickly try the attack out by themselves. Please note
    that even though the book highlights the different attacks, which can be launched
    against a wireless network, the real purpose is to educate the user to become
    a wireless penetration tester. An adept penetration tester would understand all
    the attacks out there and would be able to demonstrate them with ease, if requested
    by his client.


    # ## Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning.


    Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: "Open
    a console terminal and type in `iwconfig`." Any command-line input or output is
    written as follows:


    ```

    airodump-ng -bssid 00:27:01:D4:8E:25 --channel 11 --write WEPCrackingDemo mon0

    ```'
