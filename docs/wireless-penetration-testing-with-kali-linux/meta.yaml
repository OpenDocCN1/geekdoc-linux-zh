  md: '# ## Chapter 8: Attacking WPA-Enterprise and Radius


    WPA-Enterprise has always had an aura of unbreakable ability around it. Most network
    administrators think of it as a panacea for all their wireless security problems.
    In this chapter, we will see that nothing could be further from the truth.


    In this chapter, we will learn how to attack WPA-Enterprise using different tools
    and techniques available on Kali.


    In this chapter, we will cover the following topics:


    +   - Setting up FreeRADIUS-WPE

    - Attacking PEAP on Windows clients

    - Security best practices for Enterprises


    # ### Setting up FreeRadius-WPE


    We will need a RADIUS server for orchestrating WPA-Enterprise attacks. The most
    widely used open source RADIUS server is FreeRADIUS. However, setting it up is
    difficult and configuring it for each attack can be tedious.


