    is that Kali supports this card out-of-the-box and ships with all requisite device
    drivers to enable packet injection and packet sniffing.


    We will be using the wireless adapter with the penetration tester''s laptop.


    Follow these instructions step-by-step to set up your card:


    +   1. Plug in the card to one of the Kali laptop''s USB ports and boot it.


