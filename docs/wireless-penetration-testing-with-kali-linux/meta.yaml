  md: '# ## Chapter 9: WLAN Penetration Testing Methodology


    This chapter will lay out the steps that go in to taking the techniques taught
    in the previous chapters and turning them into a full wireless penetration test.


    To perform a wireless penetration test, it is important to follow a defined methodology.
    Simply firing up the airbase or airodump command and hoping for the best will
    not satisfy the goals of a test. When working as a penetration tester, you must
    ensure that you adhere to the standards of the organization you''re working for,
    and if they don''t have any, then you should hold yourself to the highest standards.


    Broadly, we can break up a wireless penetration testing exercise into the following
    phases:


    +   ➤ Planning phase.

    ➤ Discovery phase.

    ➤ Attack phase.

    ➤ Reporting phase.


    # ### Planning


    In this phase, we must understand the following:


    +   ❖ Scope of the assessment:


    The penetration tester should work with the client to define a scope that is achievable
    and will also provide the greatest amount of insight into the security of a network.
    Typically, the following information is gathered:


    +   ■ Location of the penetration test

    ■ Total coverage area of the premises

    ■ Approximate number of access points and wireless clients deployed

    ■ Which wireless networks are included in the assessment?

    ■ Is exploitation in scope?

    ■ Are attacks against users in scope?'
  merge: -1
  pgno: 149
- img_proc: true
  md: '+   - Is denial of service in scope?


    # **Effort estimation:**


    Based on the scope defined, the tester will then have to estimate how much time
    is required. Bear in mind that re-scoping may occur following this estimate, as
    organizations may have limited resources available in terms of both time and money.


    # **Legality:**


    Prior to performing a test, the client must give consent. This should explain
    the testing to be covered and clearly define the level of indemnity, insurance,
    and the limitations of the scope. If you are unsure, you will need to speak to
    a professional in these areas. Most organizations will have their own versions
    that will likely also incorporate a Non-Disclosure Agreement (NDA).


    Once all of the preceding requirements are in place, we are ready to go!


    # ## Discovery


    In this phase, the aim is to identify and apply characteristics to the wireless
    devices and wireless networks within the scope.


    All the techniques to perform these have been laid out in the previous chapters
    but, in brief, the aim is to:


    +   - Enumerate visible and hidden wireless networks in the area


    +   - Enumerate devices in the area, along with those connected to the targeted
    networks


    +   - Map the range of the networks, where they are reachable from and whether
    there


    +   - are places a malicious individual could operate from to perform an attack,
    for example, a cafe.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'All of this information should be recorded. If the test is limited to the performance
    of reconnaissance only, the test will end here, and the tester will attempt to
    draw conclusions based on this information. Some statements that would be useful
    to a client are as follows:


    +   - The number of devices that have associations with open networks and the
    corporate network

    - The number of devices that have networks that can be linked to locations through
    solutions such as WiGLE

    - The existence of weak encryption

    - The networks set up are too strong


    # Attack


    Once reconnaissance has been performed, exploitation must be performed for proof
    of concept. If the attack is being performed as part of a red team or wider assessment,
    then exploitation should be performed to gain access to the network as surreptitiously
    as possible.


    In our attacking phase, we will explore the following:


    +   - Cracking the encryption

    - Attacking the infrastructure

    - Compromising clients

    - Finding vulnerable clients

    - Finding unauthorized clients


    # Cracking the encryption


    The first step is to retrieve the keys for any vulnerable networks identified.
    If networks with WEP exist, perform the WEP-cracking methods explained in Chapter
    4, WLAN Encryption Flaws. If WPA2-secured systems are present, you have two choices.
    If aiming to be stealthy, arrive on-site at'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'times when individuals are likely to be authenticating or re-authenticating.
    These times are likely to be:


    +   - Start of the day

    - Lunch time

    - End of the day


    At this time, set up your WPA key retrieval setup as shown in Chapter 4, WLAN
    Encryption Flaws. Alternatively, perform the deauthentication attack, as shown
    in Chapter 6, Attacking the Client.


    This is noisier and more likely to be detected in a mature organization.


    If WPA-Enterprise is in place, bear in mind you will have to use the information
    gathered from the reconnaissance to target the correct network and set up your
    dummy Enterprise setup as shown in the Attacking PEAP section in Chapter 8, Attacking
    WPA-Enterprise and RADIUS.


    You can attempt to break all passphrases but bear in mind that some will be unbreakable.
    Following the performance of the test, check with the wireless administrator for
    the passphrase in use. Check to see whether it is a secure passphrase and that
    you, as a tester, did not experience a tool failure or were merely unlucky.


    # Attacking Infrastructure


    If network access is gained through cracking the encryption, perform a standard
    network penetration test if allowed in scope. The following should be performed
    as a minimum:


    +   - A port scan

    - Identifying which services are running

    - Enumerating any open services, such as unauthenticated FTP, SMB, or HTTP

    - Exploiting any vulnerable services identified'
  merge: -1
  pgno: 152
- img_proc: true
  md: "# Compromising clients\n\nAfter enumerating and testing all wireless systems,\
    \ there are various types of engagements that would suit performing attacks against\
    \ clients.\n\nIf necessary, after establishing which clients are vulnerable to\
    \ Karma attacks, create a Honeypot to force them to connect with the methods laid\
    \ out in the Attacking PEAP section in Chapter 8, Attacking WPA-Enterprise and\
    \ RADIUS. There are various useful pieces of information that can be gathered\
    \ through this method, but ensure that the collected data serves a purpose and\
    \ is stored, transmitted, and used in an ethical and safe manner.\n\n# Reporting\n\
    \nFinally, at the end of testing, it is necessary to report your findings to the\
    \ client. It's important to ensure that the report matches the quality of your\
    \ testing. As the client will only see the report, you have to give it as much\
    \ love and attention as you do to your testing. The following is a guideline to\
    \ the layout of the report:\n\n+   1. Management summary.\n2. Technical summary.\n\
    3. Findings:\n   - Vulnerability description\n   - Severity\n   - Affected devices\n\
    \   - Vulnerability type—software/hardware/configuration\n   - Remediation\n4.\
    \ Appendices.\n\nThe management summary should be aimed at talking to a senior\
    \ nontechnical audience with a focus on the effects and mitigations required at\
    \ a high level. Avoid language that is too technical and ensure that the root\
    \ causes are covered."
  merge: -1
  pgno: 153
- img_proc: true
  md: 'The technical summary should be a midpoint between the management summary and
    findings list. It should be aimed at a developer or a technical lead with a focus
    on how to fix the issues and broad solutions that could be implemented.


    The findings list should describe each vulnerability at a low level, explaining
    the methods to identify, and replicate, and vulnerabilities.


    Appendices should contain any extra information that would be too long to describe
    in a short description. This is where any screenshots, proof-of-concept code,
    or stolen data should be presented.


    # Summary


    In this chapter, we discussed a methodology for performing a range of wireless
    tests and referred to the relevant chapters for each step. We also listed methods
    for reporting vulnerabilities and techniques for making technical data presentable.
    In the next and final chapter, we will cover new techniques developed since the
    initial publication of this book, WPS, and probe monitoring for surveillance.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Chapter 10: WPS and Probes


    This chapter incorporates the new techniques related to attacking WPS and probe
    monitoring and also covers the pineapple tool that makes much of wireless testing
    a lot easier. These attacks and tools have appeared since the publication of the
    original book, and we''ll be making sure we''re being as holistic as possible.


    # WPS attacks


    Wireless Protected Setup (WPS) was introduced in 2006 to help users without wireless
    knowledge to have secure networks. The idea was that their Wi-Fi device would
    have a single hidden hardcoded value that would allow access with key memorization.
    New devices would be authenticated through a button press on the Wi-Fi router.
    Individuals outside the house without access to the device would not be able to
    have access, thus reducing the issues surrounding remembering WPA keys or setting
    short ones.


    In late 2011, a security vulnerability was disclosed enabling brute force attacks
    on the WPS authentication system. The traffic required to negotiate a WPS exchange
    was spoofable, and the WPS pin itself is only eight characters between 0-9. To
    start with, this provides only 100,000,000 possibilities in comparison with an
    eight character azAZ09 password having 218,340,105,584,896 combinations.


    However, there are further vulnerabilities:


    +   - Of the eight characters of the WPS pin, the last character is a checksum
    of the previous seven and therefore predictable, leaving a maximum of 10,000,000
    options

    - In addition, the first four and the following three of the remaining characters
    are checked separately, which means that there are 104 + 103 options or 11,000'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'Through the two decisions made in the authentication mechanism, we have gone
    from 100,000,000 possible combinations to 11,000. This equates to a six-hours
    difference when brute-forcing the algorithm. It is these decisions that make attacks
    against WPS viable.


    Follow the given instructions to get started:


    +   1. Before we attack a WPS-enabled access point, we need to create one. The
    TP-Link we use has this feature turned on by default, which is worrying but handy.
    To double-check this, we can log onto our router and click on WPS. It should look
    like the following:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_156_0.png)


    +   2. Now we''ve confirmed that it''s ready. We need to set up our target. We
    need to set up our testing environment. We''re going to use the Wash tool, and
    Wash requires a monitoring interface to function. As we have done many times before,
    we need to set up one with the following command:


    ```

    airmon-ng start wlan0

    ```


    The output will be as follows:'
  merge: -1
