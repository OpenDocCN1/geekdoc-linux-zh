    - 4. 需要在接入点上运行


    Q3. 无线中间人攻击可以部署在：

    - 1. 所有无线客户端上同时进行

    - 2. 同一时间仅能在一个信道上进行

    - 3. 任意SSID上

    - 4. 3和4都正确


    Q4. 在我们的中间人攻击部署中，距离受害者最近的接口是？

    - 1. At0

    - 2. Eth0

    - 3. Br0

    - 4. En0


    ## 总结

    在本章中，我们学习了如何以无线网络为基础开展高级攻击。我们搭建了无线中间人攻击环境，并利用该环境窃听了受害者的流量。之后，我们使用同一套环境，通过DNS污染攻击劫持了受害者的应用层（具体为网页流量）。在下一章中，我们将学习如何开展无线渗透测试，涵盖从规划、侦察、攻击到报告撰写的全流程。我们还会介绍保护WLAN的最佳实践。


    ## 第8章：攻击WPA-Enterprise与RADIUS

    WPA-Enterprise一直给人一种坚不可摧的印象。大多数网络管理员将其视为解决所有无线安全问题的万能方案。在本章中，我们会看到这种认知大错特错。在本章中，我们将学习如何使用Kali中提供的不同工具和技术攻击WPA-Enterprise。本章将涵盖以下主题：

    - 搭建FreeRADIUS-WPE

    - 攻击Windows客户端上的PEAP

    - 企业安全最佳实践


    ### 搭建FreeRADIUS-WPE

    实施WPA-Enterprise攻击需要一台RADIUS服务器。最常用的开源RADIUS服务器是FreeRADIUS。然而，搭建FreeRADIUS难度较高，且每次攻击前配置相关参数的过程也很繁琐。Kali默认不预装FreeRADIUS-WPE，因此你需要执行以下步骤来搭建FreeRADIUS-WPE：

    1. 访问 [freeradius-wpe的GitHub仓库](https://github.com/brad-anton/freeradius-wpe)，你可以在该页面找到下载链接：[freeradius-server-wpe_2.1.12-1_i386.deb安装包下载地址](https://github.com/brad-anton/freeradius-wpe/raw/master/freeradius-server-wpe_2.1.12-1_i386.deb)

    2. 下载完成后，依次执行`dpkg -i freeradius-server-wpe_2.1.12-1_i386.deb`和`ldconfig`命令完成安装：

    ``` root@kali:~# dpkg -i freeradius-server-wpe_2.1.12-1_i386.deb Selecting previously
    unselected package freeradius-server-wpe. (Reading database ... 345364 files and
    directories currently installed.) Unpacking freeradius-server-wpe (from freeradius-server-wpe_2.1.12-1_i386.deb)
    .. Setting up freeradius-server-wpe (2.1.12-1) ... Processing triggers for man-db
    ... ```

    现在我们来快速在Kali上搭建RADIUS服务器：

    3. 将接入点的LAN口之一连接到运行Kali的设备的以太网口。在本例中，对应接口为eth0。启用该接口并通过运行DHCP获取IP地址，具体操作如以下截图所示：

    ``` root@kali:~# dhclient eth0 Reloading /etc/samba/smb.conf: smbd only. RTNETLINK
    answers: File exists root@kali:~# ping 192.168.1.1 PING 192.168.1.1 (192.168.1.1)
    56(84) bytes of data. 64 bytes from 192.168.1.1: icmp_req=1 ttl=128 time=0.992
    ms 64 bytes from 192.168.1.1: icmp_req=2 ttl=128 time=0.820 ms ^C --- 192.168.1.1
    ping statistics --- 2 packets transmitted, 2 received, 0% packet loss, time 1001ms
    rtt min/avg/max/mdev = 0.820/0.906/0.992/0.086 ms root@kali:~# ```

    4. 登录接入点，将安全模式设置为WPA/WPA2-Enterprise，将**版本**设为WPA2，**加密方式**设为AES。随后在EAP（802.1x）设置区域中，将**RADIUS服务器IP**填写为你的Kali设备的IP地址，**RADIUS密码**设置为test，具体操作如以下截图所示：

    5. 现在打开一个新的终端，进入`/usr/local/etc/raddb`目录，该目录下存放了所有FreeRADIUS-WPE的配置文件：

    ``` root@kali:/usr/local/etc/raddb# ls acct_users clients.conf ldap.attrmap sites-available
    attrs dictionary modules sites-enabled attrs.access_challenge eap.conf policy.conf
    sql attrs.access_reject example.pl policy.txt attrs.accounting_response experimental.conf
    preproxy_users sql.conf attrs.pre-proxy hints proxy.conf sqlippool.conf certs
    huntgroups radiusd.conf templates.conf ```

    6. 打开`eap.conf`文件，你会发现`default_eap_type`命令默认设置为MD5，我们将其修改为peap：

    ``` default_eap_type = peap ```

    7. 打开`clients.conf`文件，该文件用于定义可以连接我们RADIUS服务器的允许客户端列表。有趣的是，如果你滚动到文件底部，忽略示例配置，会发现网段192.168.0.0/16下的客户端默认密码为test，这正是我们在第2步中使用的配置：

    ``` GNU nano 2.2.6 File: clients.conf # Un-comment this section, and edit a "listen"
    section to add: # "clients = per_socket_clients". That IP address/port combination
    # will then accept ONLY the clients listed in this section. # #per_socket_clients
    { # client 192.168.3.4 { # secret = testing123 # } #} client 192.168.0.0/16 {
    secret = test shortname = testAP } ```

    8. 现在我们可以通过执行`radiusd -s -X`命令启动RADIUS服务器了：

    ``` root@kali:~# radiusd -s -X ```

    9. 执行该命令后，你会看到屏幕上输出大量调试信息，但最终服务器会稳定下来并开始监听请求。太棒了！现在我们已经准备好开始本章的实验操作了：

    ``` # root@kali: ~ File Edit View Search Terminal Help ```

    ``` listen { type = "acct" ipaddr = * port = 0 } ```

    ``` listen { type = "control" listen { socket = "/usr/local/var/run/radiusd/radiusd.sock"
    } } ```

    ``` listen { type = "auth" ipaddr = 127.0.0.1 port = 18120 } ```

    ``` ... adding new socket proxy address * port 45609 Listening on authentication
    address * port 1812 Listening on accounting address * port 1813 Listening on command
    file /usr/local/var/run/radiusd/radiusd.sock Listening on authentication address
    127.0.0.1 port 18120 as server inner-tunnel Listening on proxy address * port
    1814 Ready to process requests. ```


    ### 攻击PEAP

    受保护的可扩展认证协议（PEAP）是当前应用最广泛的EAP版本，也是Windows系统原生内置的EAP机制。PEAP有两个版本：

    - 搭配EAP-MSCHAPv2的PEAPv0（该版本因Windows原生支持而应用最广）

    - 搭配EAP-GTC的PEAPv1

    PEAP通过服务端证书验证RADIUS服务器的身份。几乎所有针对PEAP的攻击都利用了证书验证环节的配置错误。接下来我们将了解当客户端关闭证书验证时，如何破解PEAP。请按照以下指示开始操作：

