    \ Got channel -1, expected a value > 0.\n12:04:49 Client 20:10:7A:45:36:61 associated\
    \ (unencrypted) to ESSID: \"mitm\"\n```\n### 步骤9：通过Wireshark抓包验证流量管控\n有趣的是，由于所有流量都从无线接口转发到有线侧，我们可以完全掌控这些流量。我们可以通过启动Wireshark并在at0接口上抓包来验证这一点：\n\
