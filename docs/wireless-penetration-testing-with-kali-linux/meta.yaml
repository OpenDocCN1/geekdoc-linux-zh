    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_158_1.png)


    +   **8.** With WPA-PSK in hand, we can authenticate normally now. I left my device
    with the default WPA-PSK that matches the WPS pin. If, however, you want to authenticate
    with the WPS pin, you can do this by specifying the pin in reaver with the following
    command:


    +   **9.** `reaver -i mon0 -b <mac> -vv -p 88404148`


    Replace my pin with your own.'
