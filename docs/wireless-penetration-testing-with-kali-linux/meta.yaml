    # ## Quiz – WLAN packet and injection


    Q1. Which frame types are responsible for authentication in WLANs?


    +   1. Control

    2. Management

    3. Data

    4. QoS


    Q2. What is the name of the second monitor mode interface that can be created
    on wlan0 using airmon-ng?


    +   1. Mon0

    2. Mon1

    3. 1Mon

    4. Monb


    Q3. What is the filter expression to view all non-beacon frames in Wireshark?


    +   1. `!(wlan.fc.type_subtype==0x08)`

    2. `wlan.fc.type_subtype==0x08`

    3. (no beacon)

    4. `Wlan.fc.type== 0x08`


    # ## Summary


    In this chapter, we have made some key observations about WLAN protocols.


    Management, Control and Data frames are unencrypted and thus can be easily read
    by someone who is monitoring the airspace. It is important to note here that the
    data packet payload can be protected using encryption to keep it confidential.
    We will talk about this in the next chapter.


    We can sniff the entire airspace in our vicinity by putting our card into monitor
    mode. As there is no integrity protection in Management and Control frames, it
    is very easy to inject these packets by modifying them or replaying them as-is
    using tools such as aireplay-ng. Unencrypted data'
- md: "## Chapter 3: Bypassing WLAN Authentication\n\nA false sense of security is\
    \ worse than being insecure, as you may not be prepared to face the eventuality\
    \ of being hacked.\n\nWLANs can have weak authentication schemas that can be easily\
    \ broken and bypassed. In this chapter, we will take a look at the various basic\
    \ authentication schemas used in WLANs and learn how to beat them.\n\nIn this\
    \ chapter, we will take a look at the following topics:\n\n- Uncovering hidden\
    \ SSIDs\n- Beating MAC filters\n- Bypassing Open Authentication\n- Bypassing Shared\
    \ Key Authentication\n\n## Hidden SSIDs\n\nIn the default configuration mode,\
    \ all access points send out their SSIDs in Beacon frames. This allows clients\
    \ in the vicinity to discover them easily. Hidden SSIDs is a configuration where\
    \ the access point does not broadcast its SSID in Beacon frames. Thus, only clients\
    \ that know the SSID of the access point can connect to it.\n\nUnfortunately,\
    \ this measure does not provide robust security, but most network administrators\
    \ think it does. Hidden SSIDs should not be considered a security measure by any\
    \ stretch of the imagination. We will now take a look at how to uncover hidden\
    \ SSIDs.\n\n## Uncovering hidden SSIDs\n\nPerform the following instructions to\
    \ get started:\n\n1. Using Wireshark, if we monitor Beacon frames in the Wireless\
    \ Lab network, we are able to see the SSID in plain text. You should see Beacon\
    \ frames, as shown in the following screenshot:\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_44_0.png)\n\
    \n2. Configure your access point to set the Wireless Lab network as a hidden SSID.\
    \ The configuration option to do this may differ across access points. In my case,\
    \ I need to uncheck the Enable SSID Broadcast option, as shown in the following\
    \ screenshot:\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_44_1.png)\n\n3. Now\
    \ if you take a look at the Wireshark trace, you will find that the SSID Wireless\
    \ Lab has disappeared from the Beacon frames. This is what hidden SSIDs are all\
    \ about:\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_45_0.png)\n\n4. In order\
    \ to bypass Beacon frames, we will first use the passive technique of waiting\
    \ for a legitimate client to connect the access point. This will generate probe\
    \ request and probe response packets that will contain the SSID of the network,\
    \ thus revealing its presence:\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_46_0.png)\n\
    \n5. Alternately, you can use the `aireplay-ng` utility to send **deauthentication\
    \ packets** to all stations on behalf of the Wireless Lab access point by typing\
    \ `aireplay-ng -0 5 -a <mac> --ignore-negative-one mon0`, where `<mac>` is the\
    \ MAC address of the router. The `-0` option is used to choose a **deauthentication**\
    \ attack, and `5` is the number of deauthentication packets to send. Finally,\
    \ `-a` specifies the MAC address of the access point you are targeting:\n\n  \
    \ ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_46_1.png)\n\n6. The preceding deauthentication\
    \ packets will force all legitimate clients to disconnect and reconnect. It would\
    \ be a good idea to add a filter for deauthentication packets to view them in\
    \ an isolated way:\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_47_0.png)\n\n\
    7. The probe responses from the access point will end up revealing its hidden\
    \ SSID. These packets will show up on Wireshark as shown next. Once the legitimate\
    \ clients connect back, we can see the hidden SSID using the probe request and\
    \ probe response frames. You can use the filter `(wlan.bssid == 00:21:91:d2:8e:25)\
    \ && !(wlan.fc.type_subtype == 0x08)` to monitor all non-Beacon packets to and\
    \ from the access point. The `&&` sign stands for the logical AND operator and\
    \ the `!` sign stands for the logical NOT operator:\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_48_0.png)\n\
    \nEven though the SSID is hidden and not broadcasted, whenever a legitimate client\
    \ tries to connect to the access point, they exchange probe request and probe\
    \ response packets. These packets contain the SSID of the access point. As these\
    \ packets are not encrypted, they can be very easily sniffed from the air and\
    \ the SSID can be found.\n\nWe will cover using probe requests for other purposes\
    \ such as tracking in a later chapter. In many cases, all clients may be already\
    \ connected to the access point and there may be no probe request/response packets\
    \ available in the Wireshark trace. Here, we can forcibly disconnect the clients\
    \ from the access point by sending forged deauthentication packets on the air.\
    \ These packets will force the clients to reconnect back to the access point,\
    \ thus revealing the SSID.\n\n## MAC filters\n\nMAC filters are an age-old technique\
    \ used for authentication and authorization and have their roots in the wired\
    \ world. Unfortunately, they fail miserably in the wireless world.\n\nThe basic\
    \ idea is to authenticate based on the MAC address of the client. The MAC filter\
    \ is an identification code assigned to a network interface; a router will be\
    \ able to check this code and compare it to a list of approved MACs. This list\
    \ of allowed MAC addresses will be maintained by the network administrator and\
    \ will be fed into the access point. We will now take a look at how easy it is\
    \ to bypass MAC filters.\n\n## Beating MAC filters\n\nLet's follow the instructions\
    \ to get started:\n\n1. Let's first configure our access point to use MAC filtering\
    \ and then add the client MAC address of the victim laptop. The settings pages\
    \ on my router looks as follows:\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_49_0.png)\n\
    \n2. Once MAC filtering is enabled, only the allowed MAC address will be able\
    \ to successfully authenticate with the access point. If we try to connect to\
    \ the access point from a machine with a non-whitelisted MAC address, the connection\
    \ will fail.\n\n3. Behind the scenes, the access point is sending Authentication\
    \ failure messages to the client. The packet trace resembles the following:\n\n\
    \   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_50_0.png)\n\n4. In order to beat\
    \ MAC filters, we can use airodump-ng to find the MAC addresses of clients connected\
    \ to the access point. We can do this by issuing the `airodump-ng -c 11 -a --bssid\
    \ <mac> mon0` command. By specifying the bssid command, we will only monitor the\
    \ access point, which is of interest to us. The `-c 11` command sets the channel\
    \ to 11 where the access point is. The `-a` command ensures that, in the client\
    \ section of the airodump-ng output, only clients associated and connected to\
    \ an access point are shown. This will show us all the client MAC addresses associated\
    \ with the access point:\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_51_0.png)\n\
    \n5. Once we find a whitelisted client's MAC address, we can spoof the MAC address\
    \ of the client using the **macchanger** utility, which ships with Kali. You can\
    \ use the `macchanger -m <mac> wlan0` command to get this done. The MAC address\
    \ you specify with the `-m` command option is the new spoofed MAC address for\
    \ the wlan0 interface:\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_51_1.png)\n\
    \n6. As you can clearly see, we are now able to connect to the access point after\
    \ spoofing the MAC address of a whitelisted client.\n\n## Open Authentication\n\
    \nThe term Open Authentication is almost a misnomer, as it actually provides no\
    \ authentication at all. When an access point is configured to use Open Authentication,\
    \ it will successfully authenticate all clients that connect to it.\n\nWe will\
    \ now do an exercise to authenticate and connect to an access point using Open\
    \ Authentication.\n\n## Bypassing Open Authentication\n\nLet's now take a look\
    \ at how to bypass Open Authentication:\n\n1. We will first set our lab access\
    \ point Wireless Lab to use Open Authentication. On my access point, this is simply\
    \ done by setting **Security** Mode to **Disable Security**:\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_52_0.png)\n\
    \n2. We then connect to this access point using the `iwconfig wlan0 essid Wireless\
    \ Lab` command and verify that the connection has succeeded and that we are connected\
    \ to the access point.\n\n3. Note that we did not have to supply any username,\
    \ password, and or passphrase to get through Open Authentication."
  mdcn: "\n## 第3章：绕过 WLAN 认证\n\n虚假的安全感比不安全更糟糕，因为你可能没有做好面对被黑客攻击这一必然事件的准备。\n\nWLAN 可能存在薄弱的认证方案，这些方案很容易被破解和绕过。在本章中，我们将了解\
    \ WLAN 中使用的各种基本认证方案，并学习如何破解它们。\n\n在本章中，我们将讨论以下主题：\n\n- 揭开隐藏的 SSID\n- 击败 MAC 过滤\n\
    - 绕过开放认证\n- 绕过共享密钥认证\n\n## 隐藏的 SSID\n\n在默认配置模式下，所有接入点都会在 Beacon 帧中发送其 SSID。这使得附近的客户端能够轻松发现它们。隐藏\
    \ SSID 是一种配置方式，接入点不会在 Beacon 帧中广播其 SSID。因此，只有知道接入点 SSID 的客户端才能连接到它。\n\n不幸的是，这种措施并不能提供强大的安全性，但大多数网络管理员却认为它能。无论怎样，隐藏的\
    \ SSID 都不应被视为一种安全措施。现在，让我们来看看如何揭开隐藏的 SSID。\n\n## 揭开隐藏的 SSID\n\n按照以下步骤开始操作：\n\n\
    1. 使用 Wireshark，如果我们监控 Wireless Lab 网络中的 Beacon 帧，就能以明文看到 SSID。你应该能看到如下截图所示的 Beacon\
    \ 帧：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_44_0.png)\n\n2. 将你的接入点配置为将\
    \ Wireless Lab 网络设置为隐藏 SSID。执行此操作的配置选项可能因接入点而异。在我的情况下，我需要取消勾选 Enable SSID Broadcast\
    \ 选项，如以下截图所示：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_44_1.png)\n\n3. 现在，如果你查看\
    \ Wireshark 跟踪记录，你会发现 SSID Wireless Lab 已经从 Beacon 帧中消失了。这就是隐藏 SSID 的本质：\n\n \
    \  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_45_0.png)\n\n4. 为了绕过 Beacon 帧，我们将首先使用被动技术，等待合法客户端连接到接入点。这将生成\
    \ probe request 和 probe response 数据包，其中包含网络的 SSID，从而暴露其存在：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_46_0.png)\n\
    \n5. 或者，你可以使用 `aireplay-ng` 工具，通过输入 `aireplay-ng -0 5 -a <mac> --ignore-negative-one\
    \ mon0`，代表 Wireless Lab 接入点向所有站点发送**取消认证数据包**，其中 `<mac>` 是路由器的 MAC 地址。`-0` 选项用于选择**取消认证**攻击，`5`\
    \ 是要发送的取消认证数据包数量。最后，`-a` 指定你所针对的接入点的 MAC 地址：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_46_1.png)\n\
    \n6. 上述取消认证数据包将强制所有合法客户端断开连接并重新连接。最好添加一个取消认证数据包的过滤器，以便隔离查看它们：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_47_0.png)\n\
    \n7. 来自接入点的 probe response 最终将暴露其隐藏的 SSID。这些数据包将在 Wireshark 中显示如下。一旦合法客户端重新连接回来，我们就可以使用\
    \ probe request 和 probe response 帧看到隐藏的 SSID。你可以使用过滤器 `(wlan.bssid == 00:21:91:d2:8e:25)\
    \ && !(wlan.fc.type_subtype == 0x08)` 来监控所有发往和来自接入点的非 Beacon 数据包。`&&` 符号代表逻辑与运算符，`!`\
    \ 符号代表逻辑非运算符：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_48_0.png)\n\n尽管 SSID\
    \ 被隐藏且未被广播，但每当合法客户端尝试连接到接入点时，它们都会交换 probe request 和 probe response 数据包。这些数据包包含接入点的\
    \ SSID。由于这些数据包未加密，因此可以从空中非常容易地嗅探到，从而发现 SSID。\n\n我们将在后面的章节中介绍将 probe request 用于跟踪等其他目的。在许多情况下，所有客户端可能已经连接到接入点，Wireshark\
    \ 跟踪记录中可能没有可用的 probe request/response 数据包。在这种情况下，我们可以通过在空中发送伪造的取消认证数据包来强制客户端与接入点断开连接。这些数据包将迫使客户端重新连接到接入点，从而暴露\
    \ SSID。\n\n## MAC 过滤\n\nMAC 过滤是一种历史悠久的认证和授权技术，起源于有线网络世界。不幸的是，它在无线网络世界中惨遭失败。\n\n\
    其基本思想是根据客户端的 MAC 地址进行认证。MAC 过滤是分配给网络接口的识别码；路由器能够检查此代码并将其与已批准的 MAC 列表进行比较。这个允许的\
    \ MAC 地址列表将由网络管理员维护并输入到接入点中。现在，让我们来看看绕过 MAC 过滤是多么容易。\n\n## 击败 MAC 过滤\n\n让我们按照以下步骤开始操作：\n\
    \n1. 首先配置我们的接入点使用 MAC 过滤，然后添加受害者笔记本电脑的客户端 MAC 地址。我路由器上的设置页面如下所示：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_49_0.png)\n\
    \n2. 启用 MAC 过滤后，只有允许的 MAC 地址才能成功与接入点认证。如果我们尝试从一台 MAC 地址不在白名单中的机器连接到接入点，连接将会失败。\n\
    \n3. 在底层，接入点正在向客户端发送认证失败消息。数据包跟踪类似于以下内容：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_50_0.png)\n\
    \n4. 为了击败 MAC 过滤，我们可以使用 airodump-ng 来查找连接到接入点的客户端的 MAC 地址。我们可以通过发出 `airodump-ng\
    \ -c 11 -a --bssid <mac> mon0` 命令来实现。通过指定 bssid 命令，我们将只监控我们感兴趣的接入点。`-c 11` 命令将频道设置为接入点所在的\
    \ 11 频道。`-a` 命令确保在 airodump-ng 输出的客户端部分中，只显示与接入点关联并连接的客户端。这将显示与该接入点关联的所有客户端 MAC\
    \ 地址：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_51_0.png)\n\n5. 一旦我们找到白名单中客户端的\
    \ MAC 地址，我们就可以使用 Kali 自带的 **macchanger** 工具伪造该客户端的 MAC 地址。你可以使用 `macchanger -m\
    \ <mac> wlan0` 命令来完成此操作。你用 `-m` 命令选项指定的 MAC 地址就是 wlan0 接口的新伪造 MAC 地址：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_51_1.png)\n\
    \n6. 正如你清楚看到的，伪造白名单客户端的 MAC 地址后，我们现在能够连接到接入点了。\n\n## 开放认证\n\n开放认证（Open Authentication）这个术语几乎是一个误称，因为它实际上根本不提供任何认证。当接入点配置为使用开放认证时，它将成功认证所有连接到它的客户端。\n\
    \n现在，我们将进行一个练习，使用开放认证来认证并连接到接入点。\n\n## 绕过开放认证\n\n现在让我们来看看如何绕过开放认证：\n\n1. 我们将首先设置我们的实验接入点\
    \ Wireless Lab 使用开放认证。在我的接入点上，只需将**安全**模式设置为**禁用安全**即可完成：\n\n   ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_52_0.png)\n\
    \n2. 然后我们使用 `iwconfig wlan0 essid Wireless Lab` 命令连接到该接入点，并验证连接是否成功以及我们是否已连接到接入点。\n\
    \n3. 请注意，我们无需提供任何用户名、密码或口令即可通过开放认证。\n"
