  - '[PAGE 16]


    # Quiz - Understanding the basics


    Q1. After issuing the command ifconfig wlan0, how do you verify the wireless card
    is up and functional?


    Q2. Can we run all our experiments using the Kali live CD alone? Can we not install
    the CD to the hard drive?


    Q3. What does the command arp -a show?


    Q4. Which tool should we use in Kali to connect to WPA/WPA2 networks?


    # Summary


    This chapter provided you with detailed instructions on how to set up your own
    wireless lab. Also, in the process, you learned the basic steps for:


    +   - Installing Kali on your hard drive and exploring other options such as Virtual
    Machines and USBs.

    - Configuring your access point over the web interface.

    - Understanding and using several commands to configure and use your wireless
    card.

    - Verifying the connection state between the wireless client and the access point.


    It is important that you gain confidence in configuring the system. If you aren''t
    confident, it is advisable that you repeat the preceding examples a couple of
    times. In later chapters, we will design more complicated scenarios. In the next
    chapter, we will learn about inherent design-based insecurities in WLANs design.
    We will use the network analyzer tool, Wireshark, to understand these concepts
    in a practical way.'
  - '[PAGE 17]


    # CHAPTER 2: WLAN and its Inherent Insecurities


    Nothing great can be built on a weak foundation, and in our context, nothing secure
    can be built on something that is inherently insecure.


    WLANs, by design, have certain insecurities that are relatively easy to exploit,
    for example, by packet spoofing, packet injection, and sniffing (this could even
    happen from far away). We will explore these flaws in this chapter.


    In this chapter, we shall look at the following:


    +   - Revisiting WLAN frames

    - Different frame types and subtypes

    - Using Wireshark to sniff management, control, and data frames

    - Sniffing data packets for a given wireless network

    - Injecting packets into a given wireless network


    Let''s get started!


    # Revisiting WLAN Frames


    As this book deals with the security aspects of wireless, we will assume that
    you already have a basic understanding of the protocol and the packet headers.
    If not, or if it''s been some time since you worked on wireless, this would be
    a good time to revisit this topic again.


    Let''s now quickly review some basic concepts of WLANs that most of you may already
    be aware of. In WLANs, communication happens over frames. A frame would have the
    following header structure:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_17_0.png)


    The Frame Control field itself has a more complex structure:'
  - '[PAGE 18]


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_18_0.png)


    The Type field defines three types of WLAN frame:


    # 1. Management frames:


    Management frames are responsible for maintaining communication between access
    points and wireless clients. Management frames can have the following subtypes:


    +   - Authentication

    - Deauthentication

    - Association request

    - Association response

    - Reassociation request

    - Reassociation response

    - Disassociation

    - Beacon

    - Probe request

    - Probe response


    # 2. Control frames:


    Control frames are responsible for ensuring a proper exchange of data between
    access points and wireless clients. Control frames can have the following subtypes:


    +   - Request to Send (RTS)'
  - '[PAGE 19]


    +   - Clear to Send (CTS)

    - Acknowledgement (ACK)


    # 3. **Data frames**:


    Data frames carry the actual data that is sent on the wireless network.


    There are no subtypes for data frames.


    We will discuss the security implications of each of these frames when we discuss
    different attacks in later chapters.


    We will now look at how to sniff these frames over a wireless network using Wireshark.
    There are other tools—such as Airodump-NG, Tcpdump, or Tshark—that you can use
    for sniffing as well. We will, however, mostly use Wireshark in this book, but
    we encourage you to explore other tools as well. The first step to do this is
    to create a monitor mode interface. This will create an interface for our adapter,
    which allows us to read all wireless frames in the air, regardless of whether
    they are destined for us or not. In the wired world, this is popularly called
    **promiscous mode**.


    # Creating a monitor mode interface


    Let''s now set our wireless adapter into monitor mode.


    Follow these instructions to get started:


    +   1. Boot Kali with your adapter connected. Once you are within the console,
    enter `iwconfig` to confirm that your card has been detected and the driver has
    been loaded properly.'
  - '[PAGE 20]


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_20_0.png)


    +   2.  Use the `ifconfig wlan1 up` command to bring the card up (where *wlan1*
    is your adapter). Verify whether the card is up by running `ifconfig wlan1`. You
    should see the word **UP** in the second line of the output as shown in the following
    screenshot:'
  - '[PAGE 21]


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_21_0.png)


    **3.** To put our card into monitor mode, we will use the airmon-ng utility that
    is available by default on Kali. First run airmon-ng command to verify whether
    it detects the available cards. You should see the wlan0 interface listed in the
    output:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_21_1.png)


    **4.** Now enter `airmon-ng start wlan1` command to create a monitor mode interface
    corresponding to the wlan0 device. This new monitor mode interface will be named
    mon0. (You can verify if it has been created by running `airmon-ng` without arguments
    again).'
  - "[PAGE 22]\n\n```\nroot@kali:~# airmon-ng start wlan1\n\nFound 3 processes that\
    \ could cause trouble.\nIf airodump-ng, aireplay-ng or airtun-ng stops working\
    \ after\na short period of time, you may want to kill (some of) them!\n  -e\n\n\
    PID   Name\n2256  NetworkManager\n2292  dhclient\n3125  wpa_supplicant\n\n\nInterface\
    \    Chipset             Driver\n\nwlan1        Ralink RT2870/3070  rt2800usb\
    \ - [phy0]\n                         (monitor mode enabled on mon0)\n\nroot@kali:~#\
    \ airmon-ng\n```\n\n+   5. Also, running `ifconfig mon0` should now display a\
    \ new interface called **mon0**.\n\n```\nroot@kali:~# ifconfig mon0\n\nmon0  \
    \  Link encap:UNSPEC  HWaddr 80-1F-02-8F-34-D5-00-00-00-00-00-00-00-00-00-00\n\
    \        UP BROADCAST RUNNING MULTICAST  MTU:1500  Metric:1\n        RX packets:1352\
    \ errors:0 dropped:1385 overruns:0 frame:0\n        TX packets:0 errors:0 dropped:0\
    \ overruns:0 carrier:0\n        collisions:0 txqueuelen:1000\n        RX bytes:172082\
    \ (168.0 KiB)  TX bytes:0 (0.0 B)\n```\n\n> > We have successfully created a monitor\
    \ mode interface called **mon0**. This interface will be used to sniff wireless\
    \ packets off the air. This interface has been created for our wireless adapter.\n\
    \nIt is possible to create multiple monitor mode interfaces using the same physical\
    \ card. Use the *airmon-ng* utility to see how you can do this. We will use **Wireshark**\
    \ to sniff packets off the air using the mon0 monitor mode interface we just created."
  - '[PAGE 23]


    # # Sniffing wireless packets


    Follow the following instructions to begin sniffing packets:


    +   1. Power up the Access Point Wireless Lab that we configured in Chapter 1,
    Wireless Lab Setup.

    2. Start *Wireshark* by typing *Wireshark* in the console. Once Wireshark is running,
    navigate to **Capture | Interfaces**.


    3. Select packet capture from the **mon0** interface by clicking on the **Start**
    button to the right of the **mon0** interface as shown in the previous screenshot.
    Wireshark will begin the capture, and now you should see packets within the **Wireshark**
    window.


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_23_0.png)'
  - '[PAGE 24]


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_24_0.png)


    +   4. These are wireless packets that your wireless adapter is sniffing off the
    air. In order to view any packet, select it in the top window and the entire packet
    will be displayed in the middle window.'
  - '[PAGE 25]


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_25_0.png)


    # **Click on the triangle in front of IEEE 802.11 Wireless LAN management frame
    to expand and view additional information.**


    Look at the different header fields in the packet and correlate them with the
    WLAN frame types and sub-types you have learned earlier.


    We just sniffed out first set of packets off the air! We launched Wireshark, which
    used the monitor mode interface mon0 we created previously. You should notice,
    by looking at Wireshark''s footer region, the speed at which the packets are being
    captured and also the number of packets captured till now.


    Wireshark traces can be a bit daunting at times; even for a reasonably populated
    wireless network, you could end up sniffing a few thousand packets. Hence, it
    is important to be able to drill down to those packets that interest us. This
    can be accomplished using filters in Wireshark. Explore how you can use these
