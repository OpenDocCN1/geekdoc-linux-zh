  md: '# Setting up an access point


    Now we will set up the access point. As mentioned earlier, we will be using the
    TP-LINK TL-WR941ND Wireless Router for all the experiments in this book. However,
    feel free to use any other access point. The basic principles of operation and
    usage remain the same.


    We will set the access point up to use Open Authentication with an SSID of Wireless
    Lab.


    Follow these instructions step by step:


    +   1. Power on the access point and use an Ethernet cable to connect your laptop
    to one of the access point''s Ethernet ports.


    2. Enter the IP address of the access point configuration terminal in your browser.
    For the TP-Link, it is by default *192.168.0.1*. You should consult your access
    point''s setup guide to find its IP address. If you do not have the manuals for
    the access point, you can also access the router by accessing [http://tplinklogin.net](http://tplinklogin.net)
    or [http://tplinkwifi.net](http://tplinkwifi.net) from a web browser. The gateway
    IP address is typically the access point''s IP. Once you are connected, you should
    see a configuration portal that looks like this:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_11_0.png)'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'The default username and password are both *admin*. If you''re unable to access
    the router, then you need to reset it to its default configuration settings. To
    do this, there is a button behind the wireless router, keep pressing on it up
    to 5 seconds then the router will be restored to its default settings.


    +   3. We need to rename the SSID to "Wireless Lab", so we need to go to **Wireless**
    tab, then to **Wireless Settings**. As follows:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_12_0.png)


    +   4. As mentioned above, we need to change the security settings of the access
    point as "Open Authentication". Go to **Wireless** tab, then to **Wireless Security**
    and select **Disable Security**. Disabling security indicates that the access
    point is in Open Authentication Mode.


    +   5. Save the changes to the access point and reboot it if required. Now your
    access point should be up, running with an SSID **Wireless Lab**.


    We have successfully setup our access point with an SSID **Wireless Lab**. It
    is broadcasting its presence and this is being picked up by our Windows laptop
    and others within the **Radio Frequency (RF)** range of the access point.


    It is important to note that we configured our access point in Open mode, which
    is the least secure. It is advisable not to connect this access point to'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'the Internet for the time being, as anyone within the RF range will be able
    to use it to access the Internet.


    # Setting up the wireless card


