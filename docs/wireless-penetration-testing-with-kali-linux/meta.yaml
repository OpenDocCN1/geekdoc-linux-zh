    \n## 小测验 – WLAN加密漏洞\n### Q1. 哪种数据包用于包重放攻击？\n- 1. 解除认证数据包。\n- 2. 关联数据包。\n- 3. 加密ARP数据包。\n\
    - 4. 以上都不是。\n\n### Q2. 什么情况下可以破解WEP？\n- 1. 任何情况都可以。\n- 2. 仅当选择了弱密钥/口令时。\n- 3.\
    \ 仅在特殊情况下。\n- 4. 仅当接入点运行旧版软件时。\n\n### Q3. 什么情况下可以破解WPA？\n- 1. 任何情况都可以。\n- 2. 仅当选择了弱密钥/口令时。\n\
    - 3. 如果客户端搭载旧版固件。\n- 4. 即使没有客户端连接到无线网络。\n\n## 总结\n在本章中，我们学习了WLAN加密相关内容。WEP存在固有缺陷，无论WEP密钥是什么，只要有足够的数据包样本，就始终可以破解WEP。目前WPA/WPA2在密码学层面无法被破解；但在特殊情况下，例如WPA/WPA2-PSK选择了弱口令时，可以通过字典攻击获取口令。在下一章中，我们将了解针对WLAN基础设施的不同攻击类型，例如恶意接入点、邪恶双胞胎攻击、比特翻转攻击等。\n\
    \n## 第5章：WLAN基础设施攻击\nWLAN基础设施是为系统中所有WLAN客户端提供无线服务的组件。在本章中，我们将了解可针对基础设施发起的各类攻击：\n\
    - 接入点上的默认账户及凭证\n- 拒绝服务攻击\n- 邪恶双胞胎攻击与接入点MAC地址欺骗\n- 恶意接入点\n\n### 接入点上的默认账户及凭证\n\
    WLAN接入点是基础设施的核心组成部分。尽管它们发挥着如此重要的作用，但在安全层面却常常最容易被忽视。在本练习中，我们将检查接入点上的默认密码是否已被修改。之后，我们还会验证：即使密码已被修改，仍然可以通过基于字典的攻击轻松猜解和破解。需要注意的是，随着我们进入更高级的章节，将默认你已经完成了前面章节的学习，熟悉了其中讨论的所有工具的使用方法。这样我们就能基于已有知识，尝试更复杂的攻击！\n\
    \n### 破解接入点上的默认账户\n1. 首先连接到我们的名为Wireless Lab的接入点，尝试进入HTTP管理界面。我们发现该接入点型号为TP-Link\
    \ WR841N，如下图所示：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_89_0.png)\n2. 从厂商网站上，我们查得用户\"\
    admin\"的默认账户凭证为\"admin\"。我们在登录页面尝试输入该凭证，成功完成了登录。这说明使用默认凭证的账户有多么容易被入侵。我们强烈建议你在线获取该路由器的用户手册。这能让你了解渗透测试中要应对的对象，还能深入了解其他可排查的配置缺陷：\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_90_0.png)\n- 你可以将密码修改为难以猜测、在字典中找不到的内容，再尝试用暴力破解的方式看是否能破解它。\n\
    - 限制密码的长度和字符范围，这样你就有机会成功破解。\n- 用于破解HTTP认证的最常见工具之一是**Hydra**，该工具可在**Kali**系统中获取。\n\
    \n### 拒绝服务攻击\nWLAN容易遭受**拒绝服务（DoS）**攻击，攻击者可利用多种技术发起此类攻击，包括但不限于以下几种：\n- 解除认证攻击\n\
    - 取消关联攻击\n- CTS-RTS攻击\n- 信号干扰或频谱干扰攻击\n\n在本章的讨论范围内，我们将通过以下实验了解针对WLAN基础设施发起的解除认证攻击：\n\
    \n### 解除认证拒绝服务攻击\n1. 首先将Wireless Lab网络配置为使用开放认证且不加密。这样我们就可以轻松通过Wireshark查看数据包：\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_91_0.png)\n2. 将Windows客户端连接到接入点，我们可以在*airodump-ng*界面看到该连接：\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_91_1.png)\n3. 现在，在攻击者机器上，我们对该目标发起定向解除认证攻击：\n\
