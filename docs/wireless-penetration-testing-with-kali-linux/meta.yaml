    point''s setup guide to find its IP address. If you do not have the manuals for
    the access point, you can also access the router by accessing [http://tplinklogin.net](http://tplinklogin.net)
    or [http://tplinkwifi.net](http://tplinkwifi.net) from a web browser. The gateway
    IP address is typically the access point''s IP. Once you are connected, you should
    see a configuration portal that looks like this:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_11_0.png)'
