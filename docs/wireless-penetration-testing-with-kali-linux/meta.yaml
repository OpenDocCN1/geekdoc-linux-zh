- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_107_0.png)


    We just created a Honeypot using the probed list from the client and also using
    the same ESSID as that of neighboring access points. In the first case, the client
    automatically connected to us, as it was searching for the network. In the latter
