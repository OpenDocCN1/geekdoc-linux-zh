  md: '# ## Quiz – WLAN packet and injection


    Q1. Which frame types are responsible for authentication in WLANs?


    +   1. Control

    2. Management

    3. Data

    4. QoS


    Q2. What is the name of the second monitor mode interface that can be created
    on wlan0 using airmon-ng?


    +   1. Mon0

    2. Mon1

    3. 1Mon

    4. Monb


    Q3. What is the filter expression to view all non-beacon frames in Wireshark?


    +   1. `!(wlan.fc.type_subtype==0x08)`

    2. `wlan.fc.type_subtype==0x08`

    3. (no beacon)

    4. `Wlan.fc.type== 0x08`


    # ## Summary


    In this chapter, we have made some key observations about WLAN protocols.


    Management, Control and Data frames are unencrypted and thus can be easily read
    by someone who is monitoring the airspace. It is important to note here that the
    data packet payload can be protected using encryption to keep it confidential.
    We will talk about this in the next chapter.


    We can sniff the entire airspace in our vicinity by putting our card into monitor
    mode. As there is no integrity protection in Management and Control frames, it
    is very easy to inject these packets by modifying them or replaying them as-is
    using tools such as aireplay-ng. Unencrypted data'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'packets can also be modified and replayed back to the network. If the packet
    is encrypted, we can still replay the packet as-is, as WLAN by design does not
    have packet replay protection.


    In the next chapter, we will look at different authentication mechanisms that
    are used in WLANs such as MAC filtering and shared Authentication etc. and understand
    the various security flaws in them through live demonstrations.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Chapter 3: Bypassing WLAN Authentication


    A false sense of security is worse than being insecure, as you may not be prepared
    to face the eventuality of being hacked.


    WLANs can have weak authentication schemas that can be easily broken and bypassed.
    In this chapter, we will take a look at the various basic authentication schemas
    used in WLANs and learn how to beat them.


    In this chapter, we will take a look at the following topics:


    +   - Uncovering hidden SSIDs

    - Beating MAC filters

    - Bypassing Open Authentication

    - Bypassing Shared Key Authentication


    # Hidden SSIDs


    In the default configuration mode, all access points send out their SSIDs in Beacon
    frames. This allows clients in the vicinity to discover them easily. Hidden SSIDs
    is a configuration where the access point does not broadcast its SSID in Beacon
    frames. Thus, only clients that know the SSID of the access point can connect
    to it.


    Unfortunately, this measure does not provide robust security, but most network
    administrators think it does. Hidden SSIDs should not be considered a security
    measure by any stretch of the imagination. We will now take a look at how to uncover
    hidden SSIDs.


    # Uncovering hidden SSIDs


    Perform the following instructions to get started:


    +   1. Using Wireshark, if we monitor Beacon frames in the Wireless Lab network,
    we are able to see the SSID in plain text. You should see Beacon frames, as shown
    in the following screenshot:'
  merge: -1
  pgno: 43
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_44_0.png)


    +   2. Configure your access point to set the Wireless Lab network as a hidden
    SSID. The configuration option to do this may differ across access points. In
    my case, I need to uncheck the Enable SSID Broadcast option, as shown in the following
    screenshot:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_44_1.png)'
  merge: -1
  pgno: 44
- img_proc: true
  md: '3. Now if you take a look at the Wireshark trace, you will find that the SSID
    Wireless Lab has disappeared from the Beacon frames. This is what hidden SSIDs
    are all about:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_45_0.png)


    4. In order to bypass Beacon frames, we will first use the passive technique of
    waiting for a legitimate client to connect the access point. This will generate
    probe request and probe response packets that will contain the SSID of the network,
    thus revealing its presence:'
  merge: -1
  pgno: 45
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_46_0.png)


    5. Alternately, you can use the `aireplay-ng` utility to send **deauthentication
    packets** to all stations on behalf of the Wireless Lab access point by typing
    `aireplay-ng -0 5 -a <mac> --ignore-negative-one mon0`, where `<mac>` is the MAC
    address of the router. The `-0` option is used to choose a **deauthentication**
    attack, and `5` is the number of deauthentication packets to send. Finally, `-a`
    specifies the MAC address of the access point you are targeting:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_46_1.png)


    6. The preceding deauthentication packets will force all legitimate clients to
    disconnect and reconnect. It would be a good idea to add a filter for deauthentication
    packets to view them in an isolated way:'
  merge: -1
  pgno: 46
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_47_0.png)


    **7.** The probe responses from the access point will end up revealing its hidden
    SSID. These packets will show up on Wireshark as shown next. Once the legitimate
    clients connect back, we can see the hidden SSID using the probe request and probe
    response frames. You can use the filter `(wlan.bssid == 00:21:91:d2:8e:25) &&
    !(wlan.fc.type_subtype == 0x08)` to monitor all non-Beacon packets to anf fro
    from the access point. The `&&` sign stands for the logical AND operator and the
    sign stands for the logical NOT operator:'
  merge: -1
  pgno: 47
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_48_0.png)


    Even though the SSID is hidden and not broadcasted, whenever a legitimate client
    tries to connect to the access point, they exchange probe request and probe response
    packets. These packets contain the SSID of the access point. As these packets
    are not encrypted, they can be very easily sniffed from the air and the SSID can
    be found.


    We will cover using probe requests for other purposes such as tracking in a later
    chapter. In many cases, all clients may be already connected to the access point
    and there may be no probe request/response packets available in the Wireshark
    trace. Here, we can forcibly disconnect the clients from the access point by sending
    forged deauthentication packets on the air. These packets will force the clients
    to reconnect back to the access point, thus revealing the SSID.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# MAC filters


    MAC filters are an age-old technique used for authentication and authorization
    and have their roots in the wired world. Unfortunately, they fail miserably in
    the wireless world.


    The basic idea is to authenticate based on the MAC address of the client. The
    MAC filter is an identification code assigned to a network interface; a router
    will be able to check this code and compare it to a list of approved MACs. This
    list of allowed MAC addresses will be maintained by the network administrator
    and will be fed into the access point. We will now take a look at how easy it
    is to bypass MAC filters.


    # Beating MAC filters


    Let''s follow the instructions to get started:


    +   1. Let''s first configure our access point to use MAC filtering and then add
    the client MAC address of the victim laptop. The settings pages on my router looks
    as follows:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_49_0.png)'
  merge: -1
  pgno: 49
- img_proc: true
  md: '2. Once MAC filtering is enabled, only the allowed MAC address will be able
    to successfully authenticate with the access point. If we try to connect to the
    access point from a machine with a non-whitelisted MAC address, the connection
    will fail.


    3. Behind the scenes, the access point is sending Authentication failure messages
    to the client. The packet trace resembles the following:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_50_0.png)


    4. In order to beat MAC filters, we can use airodump-ng to find the MAC addresses
    of clients connected to the access point. We can do this by issuing the airodumpng
    -c 11 -a --bssid <mac> mon0 command. By specifying the bssid command, we will
    only monitor the access point, which is of interest to us. The –c 11 command sets
    the channel to 11 where the access point is. The -a command ensures that, in the
    client section of the airodump-NG output, only clients associated and connected
    to an access point are shown. This will show us all the client MAC addresses associated
    with the access point:'
  merge: -1
  pgno: 50
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_51_0.png)


    5. Once we find a whitelisted client''s MAC address, we can spoof the MAC address
    of the client using the **macchanger** utility, which ships with Kali. You can
    use the *macchanger -m <mac> wlan0* command to get this done. The MAC address
    you specify with the -m command option is the new spoofed MAC address for the
