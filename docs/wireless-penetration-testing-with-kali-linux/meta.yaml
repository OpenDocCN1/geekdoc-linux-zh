    正如上一节所学，如果我们的字典中包含正确的密码短语，破解WPA-Personal每次都能成功。那么，我们为什么不创建一个包含数百万用户常用密码和短语的大型详尽字典呢？这会对我们有很大帮助，大多数时候我们都能成功破解密码短语。这听起来很棒，但我们忽略了一个关键因素——耗时。其中较为消耗CPU和时间的是通过PBKDF2使用PSK密码短语和SSID计算预共享密钥（PSK）的过程。该函数会将两者的组合哈希4096次，最终输出256位预共享密钥。下一步破解过程会将该密钥与四次握手包中的参数结合，验证握手包中的MIC。这一步的计算成本很低。此外，握手包中的参数每次都会变化，因此这一步无法预计算。因此，为了加快破解速度，我们需要尽可能快地完成从密码短语到预共享密钥的计算。\n\
