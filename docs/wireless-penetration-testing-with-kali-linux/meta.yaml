    # # Attacking PEAP


    Protected Extensible Authentication Protocol (PEAP) is the most popular version
    of EAP in use. This is the EAP mechanism shipped natively with Windows.


    PEAP has two versions:


    +   - PEAPv0 with EAP-MSCHAPv2 (the most popular as this has native support on
    Windows)

    - PEAPv1 with EAP-GTC


    PEAP uses server-side certificates for validation of the RADIUS server. Almost
    all attacks on PEAP leverage misconfigurations in certificate validation.


    Next, we will take look at how to crack PEAP when certificate validation is turned
    off on the client.


    Follow the given instructions to get started:


    +   1. We double-check the eap.conf file to ensure that PEAP is enabled:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_142_0.png)


    +   2. We then restart the RADIUS server with radiusd -s -X:'
