- md: "### Probe sniffing\n\nWe have spoken about probes previously, and how they\
    \ can be used to identify hidden networks and perform effective rogue access point\
    \ attacks. They can also be used to identify individuals as targets or track them\
    \ on a mass scale with minimal equipment. When a device wishes to connect to a\
    \ network, it sends a probe request that contains its own MAC address and the\
    \ name of the network it wishes to connect to. We can use tools such as airodump-ng\
    \ to track these. However, if we wish to identify whether an individual was present\
    \ at a specific location at a specific time or look for trends in Wi-Fi usage,\
    \ we will need to use a different approach. In this section, we will utilize tshark\
    \ and Python to collect data. You will receive the code and an explanation of\
    \ what is being done. Follow the given instructions to get started:\n\n- 1. First\
    \ of all, we need a device that's looking for multiple networks. Generally, a\
    \ normal smartphone such as an Android device or iPhone will do the trick. Desktops\
    \ don't generally make good targets as they tend to remain in one location. Newer\
    \ iPhones and Android devices may have probe requests disabled or obfuscated,\
    \ so do check before you give up.\n- 2. Once you have your device, make sure the\
    \ Wi-Fi is turned on.\n- 3. Then set up your monitoring interface as we have done\
    \ many times before:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_160_0.png)\n\
    - 4. The next thing to be done is to look for probe requests with tshark via the\
    \ following command:\n  ``` tshark -n -i mon0 subtype probereq ```\n  The screenshot\
    \ of the following command is as follows:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_160_1.png)\n\
    - 5. Your output at this point is a little rough, as the default output from tshark\
    \ is not designed to be readable, just to have as much information in it as possible.\
    \ It should look like the following:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_161_0.png)\n\
    - 6. You can clearly see the MAC address and SSID of the probe request; however,\
    \ this output can be improved. We can use the following command to make it more\
    \ readable:\n  ``` tshark -n -i mon0 subtype proberequest -T fields -e separator=\
    \ -e wlan.sa -e wlan_mgt.ssid ```\n  The screenshot of the following command is\
    \ as follows:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_161_1.png)\n- 7. The\
    \ output here is much more readable:\n  ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_161_2.png)\n\
    - 8. So, now we have the output in a readable format, what next? What we do is\
    \ create a Python script that will run the command and record the output for later\
    \ analysis. Before running the code, you will need to ensure that you have your\
    \ monitoring interface ready and that a file called results.txt is created in\
    \ the directory you are in. The Python script is as follows:\n  ``` import subprocess\n\
    \  import datetime\n  results = open(\"results.txt\", \"a\")\n  while 1:\n   \
    \   blah = subprocess.check_output([\"tshark -n -i mon0 subtype probereq -T fields\
    \ -e separator= -e wlan.sa -e wlan_mgt.ssid -c 100\"], shell=True)\n      splitblah\
    \ = blah.split(\"\\n\")\n      for value in splitblah[1:]:\n          splitvalue\
    \ = value.split(\"\\t\")\n          MAC = str(splitvalue[1])\n          SSID =\
    \ str(splitvalue[2])\n          time = str(datetime.datetime.now())\n        \
    \  results.write(MAC+\" \"+SSID+\" \"+time+\"\\r\\n\")\n  ```\n\nLet's get briefed\
    \ on the python script:\n\n- import subprocess library and datetime library: This\
    \ allows us to refer to the subprocess and datetime libraries. The subprocess\
    \ library allows us to monitor the interface from the Linux command line, and\
    \ datetime allows us to get the accurate time and date readings.\n- while 1: This\
    \ line means run until stopped.\n- results = open(\"results.txt\", \"a\"): This\
    \ opens a file with the append rights and assigns it to results. The append rights\
    \ only allow the script to add to the contents of the file. This stops the file\
    \ from constantly being overwritten.\n- blah = subprocess.check_output([\"tshark\
    \ -n -i mon0 subtype probereq -T fields -e separator= -e wlan.sa -e wlan_mgt.ssid\
    \ -c 100\"], shell=True): This opens a shell to perform our previously tested\
    \ tshark command. The only difference this time is -c 100. What this flag does\
    \ is it limit the command to 100 queries. This allows us to return the results\
    \ to ourselves without having to stop the program. Since we said run forever after\
    \ writing the results, the script will restart again.\n- This line takes the output\
    \ from the shell and assigns it to the variable blah.\n- splitblah = blah.split(\"\
    \\n\"): This takes the variable blah and splits it by line.\n- for value in splitblah[1:]:\
    \ This repeats the following action for each line in the output, ignoring the\
    \ first line that contains headers.\n- splitvalue = value.split(\"\\t\"): This\
    \ breaks each line into further smaller chunks using the tab character as the\
    \ delimiter.\n- The following three lines take each chunk of text and assign it\
    \ to a variable. MAC = str(splitvalue[1]) SSID = str(splitvalue[2]) time = str(datetime.datetime.now())\n\
    - results.write(MAC+\" \"+SSID+\" \"+time+\"\\r\\n\"): This takes all the values,\
    \ writes them to a file separated by spaces, and ends with a return and a new\
    \ line for neatness. The output will be neat lines of text written to the file.\n\
    \nResearch which tools are available that allow visualization or data analytics\
    \ and are easily integrated with Python. Tools such as Maltego have free versions\
    \ that can be used to plot information. Set yourself up a MySQL database to record\
    \ the data and reconfigure the preceding Python script to output the results to\
    \ the database. Then, build another script (or do it in the same one) to retrieve\
    \ the data and output it to Maltego. Reconfigure the script to query WiGLE, and\
    \ collect geolocation data for probe requests. Output this data through **Maltego**.\n\
    \nMake an attempt to set up a web-based frontend through Flask, Django, or PHP\
    \ to display your results. Investigate currently existing solutions for presenting\
    \ the data and attempting to emulate or improve them through a discussion with\
    \ their creators.\n\n## Summary\n\nIn this chapter, we discussed the attacks against\
    \ WPS that have come about since the release of the original book and also performed\
    \ an initial foray into integrating wireless tools with Python. Alas, we have\
    \ come to the end of the book, I hope it's been informative and interesting. See\
    \ you in other books and works."
  mdcn: "\n### 探针嗅探\n我们之前讲过探针的相关内容，以及如何用它们识别隐藏网络、发起有效的恶意接入点攻击。还可以用极少的设备将个人指定为监控目标，或进行大规模追踪。\n\
    \n当设备想要连接网络时，会发送包含自身MAC地址、以及想要连接的网络名称的探测请求。我们可以使用airodump-ng这类工具来追踪这些请求。不过，如果我们想要确认某人在特定时间是否出现在特定地点，或是分析Wi-Fi的使用趋势，就需要换一种方法。\n\
    \n本节我们会用tshark和Python来收集数据，你将会获得相关代码以及操作说明。请按照以下步骤开始操作：\n- 1. 首先，我们需要一台会搜索多个网络的设备。通常普通的智能手机（比如安卓设备或iPhone）就可以胜任。台式机一般不适合作为目标，因为它们通常固定在一个位置。较新的iPhone和安卓设备可能会关闭或混淆探测请求，所以放弃之前记得先检查确认。\n\
    - 2. 准备好设备后，确保Wi-Fi处于开启状态。\n- 3. 然后按照我们之前多次操作的方法配置监控接口：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_160_0.png)\n\
    - 4. 接下来要用tshark通过以下命令查找探测请求：\n``` tshark -n -i mon0 subtype probereq ```\n该命令的运行截图如下：\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_160_1.png)\n- 5. 此时的输出结果还比较粗糙，因为tshark的默认输出并不是为了易读设计，只是尽可能多地包含信息。结果样式如下所示：\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_161_0.png)\n- 6. 你已经可以清楚看到探测请求里的MAC地址和SSID，但这个输出还可以优化。我们可以用以下命令让结果更易读：\n\
    ``` tshark -n -i mon0 subtype proberequest -T fields -e separator= -e wlan.sa\
    \ -e wlan_mgt.ssid ```\n该命令的运行截图如下：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_161_1.png)\n\
    - 7. 这里的输出结果易读性高了很多：\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_161_2.png)\n- 8.\
    \ 现在我们已经拿到了易读格式的输出，接下来要做什么呢？我们需要编写一个Python脚本，运行上述命令并记录输出结果，供后续分析使用。运行代码前，你需要确保监控接口已经配置完成，并且当前目录下已经创建了名为results.txt的文件。Python脚本如下所示：\n\
    ``` import subprocess\nimport datetime\nresults = open(\"results.txt\", \"a\"\
    )\nwhile 1:\n    blah = subprocess.check_output([\"tshark -n -i mon0 subtype probereq\
    \ -T fields -e separator= -e wlan.sa -e wlan_mgt.ssid -c 100\"], shell=True)\n\
    \    splitblah = blah.split(\"\\n\")\n    for value in splitblah[1:]:\n      \
    \  splitvalue = value.split(\"\\t\")\n        MAC = str(splitvalue[1])\n     \
    \   SSID = str(splitvalue[2])\n        time = str(datetime.datetime.now())\n \
    \       results.write(MAC+\" \"+SSID+\" \"+time+\"\\r\\n\") ```\n下面来简单介绍这个Python脚本的功能：\n\
    - 导入subprocess库和datetime库：这让我们可以调用这两个库。subprocess库支持我们从Linux命令行监控接口，datetime库则可以帮助我们获取精准的时间和日期读数。\n\
    - while 1：这行代码的含义是持续运行，直到手动终止。\n- results = open(\"results.txt\", \"a\")：这行代码会以追加模式打开文件，并将文件对象赋值给results变量。追加模式只允许脚本在文件原有内容的基础上添加新内容，避免文件被反复覆盖。\n\
    - blah = subprocess.check_output([\"tshark -n -i mon0 subtype probereq -T fields\
    \ -e separator= -e wlan.sa -e wlan_mgt.ssid -c 100\"], shell=True)：这行代码会打开shell执行我们之前测试过的tshark命令，本次唯一的区别是增加了`-c\
    \ 100`参数，该参数的作用是将命令的查询次数限制为100次。这样我们无需终止程序就能拿到返回结果，由于脚本在写入结果后会持续运行，因此会自动重新执行该命令。\n\
    - 这行代码会获取shell的输出结果，并将其赋值给变量blah。\n- splitblah = blah.split(\"\\n\")：这行代码会对变量blah的内容按行进行拆分。\n\
    - for value in splitblah[1:]：这行代码会遍历输出结果的每一行，跳过包含表头的第一行，对其余行重复执行后续操作。\n- splitvalue\
    \ = value.split(\"\\t\")：这行代码会以制表符为分隔符，将每一行内容拆分为更小的片段。\n- 接下来三行代码会将每个文本片段分别赋值给对应变量：\n\
    ``` MAC = str(splitvalue[1])\nSSID = str(splitvalue[2])\ntime = str(datetime.datetime.now())\
    \ ```\n- results.write(MAC+\" \"+SSID+\" \"+time+\"\\r\\n\")：这行代码会将所有值写入文件，值之间用空格分隔，末尾添加回车和换行符以保证格式整洁，最终写入文件的内容会是整齐的文本行。\n\
    \n你可以调研哪些工具支持可视化、数据分析且能轻松与Python集成，比如Maltego就有免费版本可以用来绘制信息图。你可以搭建MySQL数据库来存储收集到的数据，同时修改前面的Python脚本，将结果输出到数据库中。之后再编写另一个脚本（也可以和之前的脚本集成在一起）来读取数据库中的数据，并输出到Maltego中。接着修改脚本，使其可以查询WiGLE，收集探测请求对应的地理位置数据，再通过**Maltego**输出这些数据。你也可以尝试用Flask、Django或PHP搭建Web前端来展示你的结果。还可以调研当下已有的数据呈现方案，尝试通过和方案开发者交流的方式复现或优化这些方案。\n\
    \n### 总结\n本章我们讨论了自本书初版发布以来出现的针对WPS的攻击方式，也初步探索了如何将无线工具与Python集成。好啦，本书的内容就到这里了，希望你能有所收获、觉得内容有趣。我们在其他书籍和作品中再见吧。\n"
