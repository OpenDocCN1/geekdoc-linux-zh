    In the first part of the experiment, there was no listening process on port 80
    of the attacker''s machine and thus, Firefox responded with an error. Then, once
    we started the Apache server on the attacker''s machine on port 80 (the default
    port), the browser''s requested received a response from the attacker''s machine
