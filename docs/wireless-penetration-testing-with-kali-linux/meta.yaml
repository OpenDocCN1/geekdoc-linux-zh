- md: "## Quiz - Understanding the basics\n\nQ1. After issuing the command ifconfig\
    \ wlan0, how do you verify the wireless card is up and functional?\n\nQ2. Can\
    \ we run all our experiments using the Kali live CD alone? Can we not install\
    \ the CD to the hard drive?\n\nQ3. What does the command arp -a show?\n\nQ4. Which\
    \ tool should we use in Kali to connect to WPA/WPA2 networks?\n\n## Summary\n\n\
    This chapter provided you with detailed instructions on how to set up your own\
    \ wireless lab. Also, in the process, you learned the basic steps for:\n\n- Installing\
    \ Kali on your hard drive and exploring other options such as Virtual Machines\
    \ and USBs.\n- Configuring your access point over the web interface.\n- Understanding\
    \ and using several commands to configure and use your wireless card.\n- Verifying\
    \ the connection state between the wireless client and the access point.\n\nIt\
    \ is important that you gain confidence in configuring the system. If you aren't\
    \ confident, it is advisable that you repeat the preceding examples a couple of\
    \ times. In later chapters, we will design more complicated scenarios. In the\
    \ next chapter, we will learn about inherent design-based insecurities in WLANs\
    \ design. We will use the network analyzer tool, Wireshark, to understand these\
    \ concepts in a practical way.\n\n## CHAPTER 2: WLAN and its Inherent Insecurities\n\
    \nNothing great can be built on a weak foundation, and in our context, nothing\
    \ secure can be built on something that is inherently insecure.\n\nWLANs, by design,\
    \ have certain insecurities that are relatively easy to exploit, for example,\
    \ by packet spoofing, packet injection, and sniffing (this could even happen from\
    \ far away). We will explore these flaws in this chapter.\n\nIn this chapter,\
    \ we shall look at the following:\n\n- Revisiting WLAN frames\n- Different frame\
    \ types and subtypes\n- Using Wireshark to sniff management, control, and data\
    \ frames\n- Sniffing data packets for a given wireless network\n- Injecting packets\
    \ into a given wireless network\n\nLet's get started!\n\n## Revisiting WLAN Frames\n\
    \nAs this book deals with the security aspects of wireless, we will assume that\
    \ you already have a basic understanding of the protocol and the packet headers.\
    \ If not, or if it's been some time since you worked on wireless, this would be\
    \ a good time to revisit this topic again.\n\nLet's now quickly review some basic\
    \ concepts of WLANs that most of you may already be aware of. In WLANs, communication\
    \ happens over frames. A frame would have the following header structure:\n\n\
    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_17_0.png)\n\nThe Frame Control field\
    \ itself has a more complex structure:\n\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_18_0.png)\n\
    \nThe Type field defines three types of WLAN frame:\n\n### 1. Management frames:\n\
    \nManagement frames are responsible for maintaining communication between access\
    \ points and wireless clients. Management frames can have the following subtypes:\n\
    \n- Authentication\n- Deauthentication\n- Association request\n- Association response\n\
    - Reassociation request\n- Reassociation response\n- Disassociation\n- Beacon\n\
    - Probe request\n- Probe response\n\n### 2. Control frames:\n\nControl frames\
    \ are responsible for ensuring a proper exchange of data between access points\
    \ and wireless clients. Control frames can have the following subtypes:\n\n- Request\
    \ to Send (RTS)\n- Clear to Send (CTS)\n- Acknowledgement (ACK)\n\n### 3. Data\
    \ frames:\n\nData frames carry the actual data that is sent on the wireless network.\n\
    \nThere are no subtypes for data frames.\n\nWe will discuss the security implications\
    \ of each of these frames when we discuss different attacks in later chapters.\n\
    \nWe will now look at how to sniff these frames over a wireless network using\
    \ Wireshark. There are other tools—such as Airodump-NG, Tcpdump, or Tshark—that\
    \ you can use for sniffing as well. We will, however, mostly use Wireshark in\
    \ this book, but we encourage you to explore other tools as well. The first step\
    \ to do this is to create a monitor mode interface. This will create an interface\
    \ for our adapter, which allows us to read all wireless frames in the air, regardless\
    \ of whether they are destined for us or not. In the wired world, this is popularly\
    \ called **promiscuous mode**.\n\n## Creating a monitor mode interface\n\nLet's\
    \ now set our wireless adapter into monitor mode.\n\nFollow these instructions\
    \ to get started:\n\n1. Boot Kali with your adapter connected. Once you are within\
    \ the console, enter `iwconfig` to confirm that your card has been detected and\
    \ the driver has been loaded properly.\n\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_20_0.png)\n\
    \n2. Use the `ifconfig wlan1 up` command to bring the card up (where *wlan1* is\
    \ your adapter). Verify whether the card is up by running `ifconfig wlan1`. You\
    \ should see the word **UP** in the second line of the output as shown in the\
    \ following screenshot:\n\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_21_0.png)\n\
    \n3. To put our card into monitor mode, we will use the airmon-ng utility that\
    \ is available by default on Kali. First run airmon-ng command to verify whether\
    \ it detects the available cards. You should see the wlan0 interface listed in\
    \ the output:\n\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_21_1.png)\n\n4. Now\
    \ enter `airmon-ng start wlan1` command to create a monitor mode interface corresponding\
    \ to the wlan0 device. This new monitor mode interface will be named mon0. (You\
    \ can verify if it has been created by running `airmon-ng` without arguments again).\n\
    \n```\nroot@kali:~# airmon-ng start wlan1\n\nFound 3 processes that could cause\
    \ trouble.\nIf airodump-ng, aireplay-ng or airtun-ng stops working after\na short\
    \ period of time, you may want to kill (some of) them!\n  -e\n\nPID   Name\n2256\
    \  NetworkManager\n2292  dhclient\n3125  wpa_supplicant\n\n\nInterface    Chipset\
    \             Driver\n\nwlan1        Ralink RT2870/3070  rt2800usb - [phy0]\n\
    \                         (monitor mode enabled on mon0)\n\nroot@kali:~# airmon-ng\n\
    ```\n\n5. Also, running `ifconfig mon0` should now display a new interface called\
    \ **mon0**.\n\n```\nroot@kali:~# ifconfig mon0\n\nmon0    Link encap:UNSPEC  HWaddr\
    \ 80-1F-02-8F-34-D5-00-00-00-00-00-00-00-00-00-00\n        UP BROADCAST RUNNING\
    \ MULTICAST  MTU:1500  Metric:1\n        RX packets:1352 errors:0 dropped:1385\
    \ overruns:0 frame:0\n        TX packets:0 errors:0 dropped:0 overruns:0 carrier:0\n\
    \        collisions:0 txqueuelen:1000\n        RX bytes:172082 (168.0 KiB)  TX\
    \ bytes:0 (0.0 B)\n```\n\n> > We have successfully created a monitor mode interface\
    \ called **mon0**. This interface will be used to sniff wireless packets off the\
    \ air. This interface has been created for our wireless adapter.\n\nIt is possible\
    \ to create multiple monitor mode interfaces using the same physical card. Use\
    \ the *airmon-ng* utility to see how you can do this. We will use **Wireshark**\
    \ to sniff packets off the air using the mon0 monitor mode interface we just created.\n\
    \n## Sniffing wireless packets\n\nFollow the following instructions to begin sniffing\
    \ packets:\n\n1. Power up the Access Point Wireless Lab that we configured in\
    \ Chapter 1, Wireless Lab Setup.\n2. Start *Wireshark* by typing *Wireshark* in\
    \ the console. Once Wireshark is running, navigate to **Capture | Interfaces**.\n\
    3. Select packet capture from the **mon0** interface by clicking on the **Start**\
    \ button to the right of the **mon0** interface as shown in the previous screenshot.\
    \ Wireshark will begin the capture, and now you should see packets within the\
    \ **Wireshark** window.\n\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_23_0.png)\n\
    \n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_24_0.png)\n\n4. These are wireless\
    \ packets that your wireless adapter is sniffing off the air. In order to view\
    \ any packet, select it in the top window and the entire packet will be displayed\
    \ in the middle window.\n\n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_25_0.png)\n\
    \nClick on the triangle in front of IEEE 802.11 Wireless LAN management frame\
    \ to expand and view additional information.\n\nLook at the different header fields\
    \ in the packet and correlate them with the WLAN frame types and sub-types you\
    \ have learned earlier.\n\nWe just sniffed out first set of packets off the air!\
    \ We launched Wireshark, which used the monitor mode interface mon0 we created\
    \ previously. You should notice, by looking at Wireshark's footer region, the\
    \ speed at which the packets are being captured and also the number of packets\
    \ captured till now.\n\nWireshark traces can be a bit daunting at times; even\
    \ for a reasonably populated wireless network, you could end up sniffing a few\
    \ thousand packets. Hence, it is important to be able to drill down to those packets\
    \ that interest us. This can be accomplished using filters in Wireshark. Explore\
    \ how you can use these filters to identify unique wireless devices in the traces–\
