    to reconnect back to the access point, thus revealing the SSID.'
  - '[PAGE 49]


    # MAC filters


    MAC filters are an age-old technique used for authentication and authorization
    and have their roots in the wired world. Unfortunately, they fail miserably in
    the wireless world.


    The basic idea is to authenticate based on the MAC address of the client. The
    MAC filter is an identification code assigned to a network interface; a router
    will be able to check this code and compare it to a list of approved MACs. This
    list of allowed MAC addresses will be maintained by the network administrator
    and will be fed into the access point. We will now take a look at how easy it
    is to bypass MAC filters.


    # Beating MAC filters


    Let''s follow the instructions to get started:


    +   1. Let''s first configure our access point to use MAC filtering and then add
    the client MAC address of the victim laptop. The settings pages on my router looks
    as follows:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_49_0.png)'
  - '[PAGE 50]


    2. Once MAC filtering is enabled, only the allowed MAC address will be able to
    successfully authenticate with the access point. If we try to connect to the access
    point from a machine with a non-whitelisted MAC address, the connection will fail.


    3. Behind the scenes, the access point is sending Authentication failure messages
    to the client. The packet trace resembles the following:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_50_0.png)


    4. In order to beat MAC filters, we can use airodump-ng to find the MAC addresses
    of clients connected to the access point. We can do this by issuing the airodumpng
    -c 11 -a --bssid <mac> mon0 command. By specifying the bssid command, we will
    only monitor the access point, which is of interest to us. The –c 11 command sets
    the channel to 11 where the access point is. The -a command ensures that, in the
    client section of the airodump-NG output, only clients associated and connected
    to an access point are shown. This will show us all the client MAC addresses associated
    with the access point:'
  - '[PAGE 51]


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_51_0.png)


    5. Once we find a whitelisted client''s MAC address, we can spoof the MAC address
    of the client using the **macchanger** utility, which ships with Kali. You can
    use the *macchanger -m <mac> wlan0* command to get this done. The MAC address
    you specify with the -m command option is the new spoofed MAC address for the
    wlan0 interface:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_51_1.png)


    6. As you can clearly see, we are now able to connect to the access point after
    spoofing the MAC address of a whitelisted client.


    # Open Authentication


    The term Open Authentication is almost a misnomer, as it actually provides no
    authentication at all. When an access point is configured to use Open Authentication,
    it will successfully authenticate all clients that connect to it.


    We will now do an exercise to authenticate and connect to an access point using
    Open Authentication.'
  - '[PAGE 52]


    # Bypassing Open Authentication


    Let''s now take a look at how to bypass Open Authentication:


    +   1. We will first set our lab access point Wireless Lab to use Open Authentication.
    On my access point, this is simply done by setting **Security** Mode to **Disable
    Security**:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_52_0.png)


    +   2. We then connect to this access point using the *iwconfig wlan0 essid Wireless
    Lab* command and verify that the connection has succeeded and that we are connected
    to the access point.


    +   3. Note that we did not have to supply any username, password, and or passphrase
    to get through Open Authentication.'
- md: '## Shared Key Authentication


    Shared Key Authentication uses a shared secret such as the WEP key to authenticate
    the client. The exact exchange of information is illustrated in the following
    screenshot:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_53_0.png)


    The wireless client sends an authentication request to the access point, which
    responds back with a challenge. The client now needs to encrypt this challenge
    with the shared key and send it back to the access point, which decrypts this
    to check whether it can recover the original challenge text. If it succeeds, the
    client successfully authenticates; if not, it sends an authentication failed message.
    The security problem here is that an attacker passively listening to this entire
    communication by sniffing the air has access to both the plain text challenge
    and the encrypted challenge. He can apply the XOR operation to retrieve the keystream.
    This keystream can be used to encrypt any future challenge sent by the access
    point without needing to know the actual key. The most common form of shared authentication
    is known as **WEP** or **Wired Equivalent Privacy**. It is easy to break, and
    numerous tools have been created over time to facilitate the cracking of WEP networks.
    We will learn how to sniff the air to retrieve the challenge and the encrypted
    challenge, retrieve the keystream, and use it to authenticate to the access point
    without needing the shared key.


    ## Bypassing Shared Key Authentication


    Bypassing Shared Authentication is a bit more challenging than the previous exercises,
    so follow the steps carefully:


    1. Let''s first set up Shared Authentication for our Wireless Lab network. I have
    done this on my access point by setting the security mode as **WEP** and Authentication
    as **Shared Key**:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_54_0.png)


    2. Let''s now connect a legitimate client to this network using the shared key
    we have set in step 1.


    3. In order to bypass Shared Key Authentication, we will first start sniffing
    packets between the access point and its clients. However, we would also like
    to log the entire shared authentication exchange. To do this, we use the airodump-ng
    utility using the `airodump-ng mon0 -c 11 --bssid <mac> -w keystream` command.
    The `-w` option, which is new here, requests Airodump-NG to store the packets
    in a file whose name is prefixed with the word "keystream". Incidentally, it might
    be a good idea to store different sessions of packet captures in different files.
    This allows you to analyze them long after the trace has been collected:


    | BSSID | PWR | RXQ | Beacons | #Data | #/s | CH | MB | ENC | CIPHER | AUTH |
    E |

    |-------|-----|-----|---------|-------|-----|----|----|-----|--------|------|---|

    | 80:1F:02:8F:34:D5 | 0 | 100 | 32 | 0 | 0 | 3 | 54 | WEP | WEP | W | |


    | BSSID | STATION | PWR | Rate | Lost | Frames | Probe |

    |-------|---------|-----|------|------|--------|--------|


    4. We can either wait for a legitimate client to connect to the access point or
    force a reconnect using the deauthentication technique used previously. Once a
    client connects and the shared key authentication succeeds, airodump-ng will capture
    this exchange automatically by sniffing the air. An indication that the capture
    has succeeded is when the AUTH column reads **WEP**.


    5. The captured keystream is stored in a file prefixed with the words keystream
    file in the current directory. In my case, the name of the file is keystream-01-00-21-91-D2-8E-25.xor.


    6. In order to fake a shared key authentication, we will use the aireplay-ng tool.
    We run the `aireplay-ng -1 0 -e "Wireless Lab" -y keystream-01-00-21-91-D2-8E-25.xor
    -a <mac> -h AA:AA:AA:AA:AA:AA mon0` command. This aireplay-ng command uses the
    keystream we retrieved in step 5 and tries to authenticate with the access point
    with SSID Wireless Lab and MAC address 00:21:91:D2:8E:25, and uses an arbitrary
    client MAC address AA:AA:AA:AA:AA:AA. Fire up **Wireshark** and sniff all packets
    of interest by applying a `wlan.addr == AA:AA:AA:AA:AA:AA` filter. We can verify
    this using Wireshark. You should see a trace on the Wireshark screen, as shown
    in the following screenshot:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_56_0.png)


    7. The first packet is the authentication request sent by the aireplay-ng tool
    to the access point:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_57_0.png)


    8. The second packet consists of the access point sending the client challenge
    text, as shown in the following screenshot:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_58_0.png)


    9. In the third packet, the tool sends the encrypted challenge to the access point:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_59_0.png)


    10. As the `aireplay-ng` tool used the derived keystream for encryption, the authentication
    succeeds and the access point sends a success message in the fourth packet:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_60_0.png)


    11. After the authentication succeeds, the tool fakes an association with the
    access point, which succeeds as well:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_61_0.png)


    12. If you check the wireless logs in your access point''s administrative interface,
    you should now see a wireless client with the MAC address AA:AA:AA:AA:AA:AA connected.
    Access points have a maximum client count after which they start refusing connections.
    By writing a simple wrapper over aireplay-ng, it is possible to automate and send
    hundreds of connection requests from random MAC addresses to the access point.
    This will end up filling the internal tables and once the maximum client count
    is reached, the access point will stop accepting new connections. This is typically
    what is called a **Denial of Service (DoS)** attack and can force the router to
    reboot or make it dysfunctional. This can lead to all the wireless clients being
    disconnected and being unable to use the authorized network. Check whether you
    can verify this!


    ## **Quiz – WLAN Authentication**


    **Q1.** How can you force a wireless client to re-connect to the access point?


    - 1. By sending a deauthentication packet.

    - 2. By rebooting the client.

    - 3. By rebooting the access point.

    - 4. All of the above.


    **Q2.** What does Open Authentication do?


    - 1. It provides decent security.

    - 2. It provides no security.

    - 3. It requires the use of encryption.

    - 4. None of the above.


    **Q3.** How does breaking Shared Key Authentication work?


    - 1. By deriving the keystream from the packets.

    - 2. By deriving the encryption key.

    - 3. By sending deauthentication packets to the access point.

    - 4. By rebooting the access point.


    ## **Summary**


    In this chapter, we learnt about WLAN Authentication. Hidden SSIDs are a non-security
    feature and are relatively simple to beat. MAC address filters do not provide
    any security, as MAC addresses can be sniffed from the air in wireless packets.
    This is possible because the MAC addresses are unencrypted in the packet. Open
    Authentication provides no real authentication at all. Shared Key Authentication
    is a bit tricky to beat but, with the help of the right tools, we can derive the
    key and the keystream, using which it is possible to answer all future challenges
    sent by the access point. The result is that we can authenticate without needing
    to know the actual key.


    ## Chapter 4: WLAN Encryption Flaws


    Even with the best of intentions, the future is always unpredictable. The WLAN
    committee designed WEP and then WPA to be foolproof encryption mechanisms but,
    over time, both these mechanisms had flaws that have been widely publicized and
    exploited in the real world. WLAN encryption mechanisms have had a long history
    of being vulnerable to cryptographic attacks. It started with WEP in early 2000,
    which eventually was completely broken. In recent times, attacks are slowly targeting
    WPA. Even though there is no public attack available currently to break WPA in
    all general conditions, there are attacks that are feasible under special circumstances.
    In this chapter, we will take a look at the following topics:


    - Different encryption schemas in WLANs

    - Cracking WEP encryption

    - Cracking WPA encryption


    ### WLAN Encryption


    WLANs transmit data over the air and thus there is an inherent need to protect
    data confidentiality. This is best done using encryption. The WLAN committee (IEEE
    802.11) formulated the following protocols for data encryption:


    - Wired Equivalent Privacy (WEP)

    - Wi-Fi Protected Access (WPA)

    - Wi-Fi Protection Access v2 (WPAv2)


    In this chapter, we will take a look at each of these encryption protocols and
    demonstrate various attacks against them.'
  mdcn: '

    ## 共享密钥认证

    共享密钥认证使用共享密钥（如WEP密钥）对客户端进行认证。确切的信息交换过程如下图所示：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_53_0.png)

    无线客户端向接入点发送认证请求，接入点会回复一个质询。客户端现在需要使用共享密钥加密该质询，再发回给接入点，接入点会解密该内容以检查是否能还原原始质询文本。如果还原成功，则客户端认证成功；如果失败，接入点会发送认证失败的消息。

    这里存在的安全问题是，攻击者通过嗅探空中数据包被动监听整个通信过程，能够同时获取明文质询和加密后的质询。攻击者可以对两者执行异或（XOR）操作来获取密钥流。该密钥流可用于加密接入点后续发送的任意质询，无需知晓实际密钥即可完成。

    最常见的共享认证形式被称为**WEP（有线等效隐私）**。它容易被破解，多年来已开发出大量工具来辅助破解WEP网络。我们将学习如何嗅探空中数据包以获取质询和加密后的质询，提取密钥流，并利用它在无需共享密钥的情况下向接入点发起认证。


    ## 绕过共享密钥认证

    绕过共享密钥认证比之前的练习难度更高，请仔细按照以下步骤操作：

    1. 首先为我们的无线实验网配置共享认证。我已在接入点上完成配置：将安全模式设为**WEP**，认证方式设为**共享密钥**：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_54_0.png)

    2. 现在使用步骤1中设置的共享密钥，将合法客户端连接至该网络。

    3. 为绕过共享密钥认证，我们首先需要开始嗅探接入点与客户端之间的数据包。同时，我们也需要记录整个共享认证的交换过程。为此，我们使用airodump-ng工具，执行`airodump-ng
    mon0 -c 11 --bssid <mac> -w keystream`命令。其中`-w`选项是本次新增的，它要求Airodump-NG将数据包存储到以“keystream”为前缀命名的文件中。建议将不同会话的抓包数据存储到不同文件中，这样可以在抓包收集完成很久之后仍能对数据进行分析：

    | BSSID | 信号强度 | 接收质量 | 信标帧数 | 数据帧数 | 每秒帧数 | 信道 | 速率 | 加密方式 | 加密算法 | 认证方式 | 扩展
    |

    |-------|-----|-----|---------|-------|-----|----|----|-----|--------|------|---|

    | 80:1F:02:8F:34:D5 | 0 | 100 | 32 | 0 | 0 | 3 | 54 | WEP | WEP | W | |

    | BSSID | 客户端MAC | 信号强度 | 速率 | 丢包数 | 总帧数 | 探测帧 |

    |-------|---------|-----|------|------|--------|--------|

    4. 我们可以等待合法客户端连接到接入点，也可以使用之前用过的反认证技术强制客户端重连。一旦客户端连接且共享密钥认证成功，airodump-ng会自动通过嗅探空中数据包捕获该交换过程。捕获成功的标志是AUTH列显示为**WEP**。

    5. 捕获到的密钥流会存储在当前目录下，文件名以“keystream”为前缀。我这里的文件名为keystream-01-00-21-91-D2-8E-25.xor。

    6. 为了伪造共享密钥认证，我们将使用aireplay-ng工具。执行以下命令：`aireplay-ng -1 0 -e "Wireless Lab" -y
    keystream-01-00-21-91-D2-8E-25.xor -a <mac> -h AA:AA:AA:AA:AA:AA mon0`。该aireplay-ng命令会使用步骤5中提取的密钥流，尝试向SSID为Wireless
    Lab、MAC地址为00:21:91:D2:8E:25的接入点发起认证，并使用任意客户端MAC地址AA:AA:AA:AA:AA:AA。

    启动**Wireshark**，应用`wlan.addr == AA:AA:AA:AA:AA:AA`过滤器嗅探所有感兴趣的数据包。我们可以通过Wireshark验证结果，你会在Wireshark界面看到一条跟踪记录，如下图所示：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_56_0.png)

    7. 第一个数据包是aireplay-ng工具向接入点发送的认证请求：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_57_0.png)

    8. 第二个数据包是接入点向客户端发送的质询文本，如下图所示：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_58_0.png)

    9. 第三个数据包中，该工具向接入点发送加密后的质询：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_59_0.png)

    10. 由于`aireplay-ng`工具使用了推导出的密钥流进行加密，因此认证成功，接入点在第四个数据包中发送成功消息：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_60_0.png)

    11. 认证成功后，该工具会伪造与接入点的关联请求，该操作同样会成功：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_61_0.png)

    12. 如果你查看接入点管理界面的无线日志，现在应该能看到一个MAC地址为AA:AA:AA:AA:AA:AA的无线客户端已连接。接入点存在最大客户端连接数限制，达到上限后会拒绝新的连接请求。通过编写aireplay-ng的简单封装脚本，可以实现自动化操作，向接入点发送来自随机MAC地址的数百个连接请求。这将耗尽接入点的内部表项，一旦达到最大客户端数，接入点将停止接受新的连接。这就是典型的**拒绝服务（DoS）**攻击，可导致路由器重启或功能异常，使得所有无线客户端断开连接，无法使用授权网络。你可以尝试验证这一效果！


    ## **小测 – WLAN认证**

    **Q1.** 如何强制无线客户端重新连接到接入点？

    - 1. 发送反认证数据包。

    - 2. 重启客户端。

    - 3. 重启接入点。

    - 4. 以上所有选项。

    **Q2.** 开放认证的作用是什么？

    - 1. 提供可靠的安全性。

    - 2. 不提供任何安全性。

    - 3. 需要使用加密机制。

    - 4. 以上都不对。

    **Q3.** 破解共享密钥认证的原理是什么？

    - 1. 从数据包中推导出密钥流。

    - 2. 推导出加密密钥。

    - 3. 向接入点发送反认证数据包。

    - 4. 重启接入点。


    ## **总结**

    本章我们学习了WLAN认证。隐藏SSID是一种非安全特性，很容易被破解。MAC地址过滤无法提供任何安全性，因为无线数据包中的MAC地址可以被嗅探获取，这是因为数据包中的MAC地址是未加密的。开放认证完全不提供真正的认证功能。共享密钥认证的破解难度稍高，但在合适的工具辅助下，我们可以推导出密钥和密钥流，利用它可以应答接入点发送的所有后续质询，最终结果是我们无需知晓实际密钥即可完成认证。


    ## 第4章：WLAN加密缺陷

    即便初衷良好，未来也总是充满不确定性。WLAN委员会设计了WEP和WPA作为无懈可击的加密机制，但随着时间推移，这两种机制都存在已被公开并在现实世界中被广泛利用的缺陷。WLAN加密机制存在长期的密码学攻击漏洞历史。最早是2000年代初推出的WEP，最终被完全破解。近年来，攻击逐渐将目标转向WPA。尽管目前尚无能在所有通用条件下破解WPA的公开攻击方法，但在特定场景下存在可行的攻击方式。

    本章我们将学习以下主题：

    - WLAN中的不同加密方案

    - 破解WEP加密

    - 破解WPA加密


    ### WLAN加密

    WLAN通过空中接口传输数据，因此天然具有保护数据保密性的需求，而加密是实现这一目标的最佳方式。WLAN委员会（IEEE 802.11）制定了以下数据加密协议：

    - 有线等效隐私（WEP）

    - Wi-Fi保护访问（WPA）

    - Wi-Fi保护访问第2版（WPAv2）

    本章我们将逐一研究这些加密协议，并演示针对它们的各类攻击。

    '
