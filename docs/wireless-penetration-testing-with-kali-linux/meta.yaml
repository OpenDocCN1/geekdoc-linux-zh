  - '[PAGE 80]


    # Speeding up WPA and WPA2 Cracking


    As we have already seen in the previous section, if we have the correct passphrase
    in our dictionary, cracking WPA-Personal will work every time like a charm. So,
    why don''t we just create a large elaborate dictionary of millions of common passwords
    and phrases people use? This would help us a lot and most of the time, we would
    end up cracking the passphrase. It all sounds great but we are missing one key
    component here— the time taken. One of the more CPU and time-consuming calculations
    is that of the Pre-Shared key using the PSK passphrase and the SSID through the
    PBKDF2. This function hashes the combination of both over 4,096 times before outputting
    the 256-bit Pre-Shared key. The next step in cracking involves using this key
    along with parameters in the four-way handshake and verifying against the MIC
    in the handshake. This step is computationally inexpensive. Also, the parameters
    will vary in the handshake every time and hence, this step cannot be precomputed.
    Thus, to speed up the cracking process, we need to make the calculation of the
    Pre-Shared key from the passphrase as fast as possible.


    We can speed this up by pre-calculating the Pre-Shared Key, also called the Pairwise
    Master Key (PMK) in 802.11 standard parlance. It is important to note that, as
    the SSID is also used to calculate the PMK, with the same passphrase and with
    a different SSID, we will end up with a different PMK. Thus, the PMK depends on
    both the passphrase and the SSID.


    # Speeding up the cracking process


    We can proceed with the following steps:


    +   1. We can pre-calculate the PMK for a given SSID and wordlist using the genpmk
    tool with the following command:


    ```

    genpmk –f <chosen wordlist> –d PMK-Wireless-Lab –s "Wireless Lab"

    ```


    This creates the PMK-Wireless-Lab file containing the pregenerated PMK:'
  - '[PAGE 81]


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_81_0.png)


    +   2. We now create a WPA-PSK network with the passphrase **abcdefgh** (present
    in the dictionary we used) and capture a WPA-handshake for that network. We now
    use **Cowpatty** to crack the WPA passphrase, as shown in the following screenshot:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_81_1.png)


    It takes approximately 7.18 seconds for **Cowpatty** to crack the key, using the
    pre-calculated PMKs.


    +   3. We now use **aircrack-ng** with the same dictionary file, and the cracking
    process takes over 22 minutes. This shows how much we are gaining because of the
    pre-calculation.


    +   4. In order to use these PMKs with aircrack-ng, we need to use a tool called
    airolib-ng. We will give it the options airolib-ng, PMK-Aircrack-import, and cowpatty
    PMK-Wireless-Lab, where PMK-Aircrack is the aircrack-ng compatible database to
    be created and PMK-Wireless-Lab is the genpmk compliant PMK database that we created
    previously.'
  - '[PAGE 82]


    +   5. We now feed this database to aircrack-ng and the cracking process speeds
    up remarkably. We use the following command:


    ```

    aircrack-ng –r PMK-Aircrack WPA Cracking Demo2-01.cap

    ```


    +   6. There are additional tools available on Kali such as Pyrit that can leverage
    multi CPU systems to speed up cracking. For example, Intel® Core™ i7 processors
    can do faster cracking operations. We give the pcap filename with the –r option
    and the genpmk compliant PMK file with the -i option. Even on the same system
    used with the previous tools, Pyrit takes around 3 seconds to crack the key, using
    the same PMK file created using genpmk.


    > As well as to the mentioned above, the cracking process depends primarily on
    the length of the WPA/WPA2 Pre-Shared Key. Longer passphrases take longer time
    to be cracked.


    We looked at various different tools and techniques to speed up WPA/WPA2-PSK cracking.
    The whole idea is to pre-calculate the PMK for a given SSID and a list of passphrases
    in our dictionary.


    # Decrypting WEP, WPA, and WPA2 Packets


    In all the exercises we have done till now, we cracked the WEP and WPA keys using
    various techniques. What do we do with this information? The first step is to
    decrypt data packets we have captured using these keys.


    We will decrypt the WEP and WPA packets in the same trace file that we captured
    over the air, using the keys we cracked.


    We can proceed with the following steps:


    +   1. We will decrypt packets from the WEP capture file we created earlier:'
  - '[PAGE 83]


    WEPCrackingDemo-01.cap. For this, we will use another tool in the Aircrack-ng
    suite called airdecap-ng. We will run the following command, as shown in the following
    screenshot, using the WEP key we cracked previously:


    ```

    airdecap-ng -w abcdefabcdefabcdefabcdef12 WEPCrackingDemo-02.cap

    ```


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_83_0.png)


    +   2. The decrypted files are stored in a file named WEPCrackingDemo-02-dec.cap.
    We use the **tshark** utility to view the first ten packets in the file. Please
    note that you may see something different based on what you captured:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_83_1.png)'
  - '[PAGE 84]


    3. WPA/WPA2 PSK will work in exactly the same way as with WEP, using the **airdecap-ng**
    utility, as shown in the following screenshot, with the following command:


    ```

