    ## WEP 加密

    WEP协议早在2000年就被发现存在缺陷，但令人惊讶的是，它至今仍被广泛使用，且许多接入点在出厂时仍默认开启WEP功能。

    WEP存在大量密码学漏洞，这些漏洞由Walker、Arbaugh、Fluhrer、Martin、Shamir、KoreK及诸多其他研究者发现。

    从密码学角度评估WEP已超出本书范围，因为这涉及对复杂数学原理的理解。

    在本节中，我们将了解如何使用**Kali**平台上的现成工具破解WEP加密。这包括完整的**aircrack-ng**工具套件——**airmon-ng**、**aireplay-ng**、**airodump-ng**、**aircrack-ng**及其他相关工具。

    WEP的根本缺陷在于其使用了**RC4**算法以及每2²⁴帧就会循环复用的短IV（初始化向量）。虽然这个数值本身很大，但每5000个数据包中就有50%的概率会出现4次IV复用。为了利用这一特性，我们会生成大量流量，从而提高IV被复用的概率，进而对比用相同IV和密钥加密的两份密文。现在我们先在测试实验室中配置WEP，看看如何对其进行破解。


    ## 破解WEP加密

    - 1. 首先连接至我们的接入点Wireless Lab，进入处理无线加密机制的设置区域：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_65_0.png)

    - 2. 在我的接入点上，可以通过将**安全模式**设置为**WEP**来完成配置。我们还需要设置WEP密钥长度。如下方截图所示，我已将WEP设置为使用**128位**密钥。我将默认密钥设为**WEP密钥1**，十六进制值设为`abcdefabcdefabcdefabcdef12`作为128位WEP密钥，你可以根据需求自行修改：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_66_0.png)

    - 3. 设置应用完成后，接入点现在就会将WEP作为首选加密机制。接下来我们配置攻击者主机。

    - 4. 执行以下命令启用wlan0网卡：

    ```ifconfig wlan0 up```

    - 5. 然后执行以下命令：

    ```airmon-ng start wlan0```

    - 6. 这一步是为了创建**mon0**（监听模式接口），如下方截图所示。使用`iwconfig`命令验证mon0接口已成功创建：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_67_0.png)

    - 7. 执行以下命令运行airodump-ng，定位我们的实验室接入点：

    ```airodump-ng mon0```

    - 8. 如下方截图所示，我们能够看到正在运行WEP的Wireless Lab接入点：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_67_1.png)

    - 9. 本次实验中我们仅关注Wireless Lab，因此执行以下命令仅查看该网络的数据包：

    ```airodump-ng --bssid 00:21:91:D2:8E:25 --channel 11 --write WEPCrackingDemo
    mon0```

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_68_0.png)

    ```root@kali:~# airodump-ng --bssid E8:94:F6:62:1E:8E --channel 11 --write WEPCrackingDemo
    mon0```

    - 10. 我们将通过`--write`指令，让airodump-ng将数据包保存为pcap文件：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_68_1.png)

    | BSSID | 信号强度 接收质量 信标 | 数据包数, 每秒数据包数 | 频道 | 速率 | 加密方式 | 加密算法 | 认证方式 | ESSID |

    |-------------------|-----------------|------------|----|-----|------|--------|------|----------------|

    | E8:94:F6:62:1E:8E | -44 100 | 125 | 40 | 1 | 11 | 54e | WEP | WEP | Wireless
    Lab |

    | BSSID | 站点 | 信号强度 | 速率 | 丢包 | 帧数 | 探测 |

    |-------------------|-------------------|-----|------|-----|--------|--------|

    | E8:94:F6:62:1E:8E | 20:18:7A:45:36:61 | -77 | 54e-54e | 0 | 26 | |

    - 11. 现在让我们将无线客户端连接到接入点，使用WEP密钥`abcdefabcdefabcdefabcdef12`。客户端成功连接后，airodump-ng会在屏幕上显示其状态。在破解WEP时，我们需要大量用同一密钥加密的数据包来利用协议漏洞，因此我们必须迫使网络产生更多数据包。为此，我们将使用**aireplay-ng**工具。

    - 12. 我们将使用**aireplay-ng**捕获无线网络中的ARP数据包，并将其注入回网络以模拟ARP响应。如下方下一步截图所示，我们将在单独的窗口中启动aireplay-ng。将这些数据包重放数千次后，我们就能在网络上生成大量数据流量。尽管aireplay-ng不知道WEP密钥，但它可以通过数据包的大小识别ARP数据包。ARP是固定头部协议，因此ARP数据包的大小很容易确定，即使在加密流量中也能用于识别它们。接下来我们将讨论运行aireplay-ng时使用的参数：`-3`选项用于ARP重放，`-b`指定我们网络的BSSID，`-h`指定我们要伪装的客户端MAC地址。我们必须执行这一步，因为重放攻击仅对已认证且关联的客户端MAC地址有效：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_69_0.png)

    - 13. 很快你就会看到aireplay-ng成功嗅探到ARP数据包，并开始将其重放回网络。如果你遇到像我一样的信道相关错误，请在命令末尾追加*--ignore-negative-one*，如下方截图所示：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_70_0.png)

    - 14. 此时，airodump-ng也会开始记录大量数据包。所有嗅探到的数据包都将存储在WEPCrackingDemo文件中。

    | BSSID | 信号强度 | 接收质量 | 信标 | 数据包数 | 每秒数据包数 | 频道 | 速率 | 加密方式 | 加密算法 | 认证方式 | ESSID
    |

    |-------------------|-----|-----|---------|-------|-----|----|----|------|--------|------|----------------|

    | E8:94:F6:62:1E:8E | -49 | 100 | 3360 | 3090 | 10 | 11 | 54e | WEP | WEP | |
    Wireless Lab |

    | BSSID | 站点 | 信号强度 | 速率 | 丢包 | 帧数 | 探测 |

