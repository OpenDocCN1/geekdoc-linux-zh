  md: '# **Quiz – WLAN Authentication**


    Q1. How can you force a wireless client to re-connect to the access point?


    +   1. By sending a deauthentication packet.

    2. By rebooting the client.

    3. By rebooting the access point.

    4. All of the above.


    Q2. What does Open Authentication do?


    +   1. It provides decent security.

    2. It provides no security.

    3. It requires the use of encryption.

    4. None of the above.


    Q3. How does breaking Shared Key Authentication work?


    +   1. By deriving the keystream from the packets.

    2. By deriving the encryption key.

    3. By sending deauthentication packets to the access point.

    4. By rebooting the access point.


    # **Summary**


    In this chapter, we learnt about WLAN Authentication. Hidden SSIDs are a non-security
    feature and are is relatively simple to beat. MAC address filters do not provide
    any security, as MAC addresses can be sniffed from the air from the wireless packets.
    This is possible because the MAC addresses are unencrypted in the packet. Open
    Authentication provides no real authentication at all. Shared Key Authentication
    is a bit tricky to beat but, with the help of the right tools, we can derive the
    store and the keystream, using which it is possible to answer all future challenges
    sent by the access point. The result is that we can authenticate without needing
    to know the actual key.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# # Chapter 4: WLAN Encryption Flaws


    Even with the best of intentions, the future is always unpredictable. The WLAN
    committee designed WEP and then WPA to be foolproof encryption mechanisms but,
    over time, both these mechanisms had flaws that have been widely publicized and
    exploited in the real world.


    WLAN encryption mechanisms have had a long history of being vulnerable to cryptographic
    attacks. It started with WEP in early 2000, which eventually was completely broken.
    In recent times, attacks are slowly targeting WPA. Even though there is no public
    attack available currently to break WPA in all general conditions, there are attacks
    that are feasible under special circumstances.


    In this chapter, we will take a look at the following topics:


    +   ✓ Different encryption schemas in WLANs


    +   ✓ Cracking WEP encryption


    +   ✓ Cracking WPA encryption


    # ## WLAN Encryption


    WLANs transmit data over the air and thus there is an inherent need to protect
    data confidentiality. This is best done using encryption. The WLAN committee (IEEE
    802.11) formulated the following protocols for data encryption:


    +   ➤ Wired Equivalent Privacy (WEP)


    +   ➤ Wi-Fi Protected Access (WPA)


    +   ➤ Wi-Fi Protection Access v2 (WPAv2)


    In this chapter, we will take a look at each of these encryption protocols and
    demonstrate various attacks against them.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# WEP Encryption


    The WEP protocol was known to be flawed as early as 2000 but, surprisingly, it
    is still continuing to be used and access points still ship with WEP enabled capabilities.


    There are many cryptographic weaknesses in WEP and they were discovered by Walker,
    Arbaugh, Fluhrer, Martin, Shamir, KoreK, and many others. Evaluation of WEP from
    a cryptographic standpoint is beyond the scope of this book, as it involves understanding
    complex math. In this section, we will take a look at how to break WEP encryption
    using readily available tools on the **Kali** platform. This includes the entire
    **aircrack-ng** suite of tools—**airmon-ng**, **aireplay-ng**, **airodump-ng**,
    **aircrack-ng**, and others.


    The fundamental weakness in WEP is its use of **RC4** and a short IV value that
    is recycled every 224 frames. While this is a large number in itself, there is
    a 50 percent chance of four reuses every 5,000 packets. To use this to our advantage,
    we generate a large amount of traffic so that we can increase the likelihood of
    IVs that have been reused and thus compare two cipher texts encrypted with the
    same IV and key.


    Let''s now first set up WEP in our test lab and see how we can break it.'
  merge: -1
  pgno: 64
- img_proc: true
