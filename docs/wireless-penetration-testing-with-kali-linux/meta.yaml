- md: '## Summary

    - Compromising default accounts and credentials on access points.

    - Denial of service attacks.

    - Evil twins and MAC Spoofing.

    - Rogue access points in the enterprise network.


    In the next chapter, we will take a look at different attacks on the wireless
    LAN client. Interestingly, most administrators feel that the client has no security
    problems to worry about. We will see how nothing could be further from the truth.


    ## Chapter 6: Attacking the client

    In this chapter, we will shift our focus from the WLAN infrastructure to the wireless
    client. The client can be either a connected or isolated unassociated client.
    We will take a look at the various attacks that can be used to target the client.
    We will cover the following topics:

    - Honey pot and Mis-Association attacks

    - The Caffe Latte attack

    - The Hirte attack

    - AP-less WPA-Personal cracking


    ### Honey pot and Mis-Association attacks

    Normally, when a wireless client such as a laptop is turned on, it will probe
    for networks it has previously connected to. These networks are stored in a list
    called the **Preferred Network List (PNL)** on Windows-based systems. Also, along
    with this list, the wireless client will display any networks available in its
    range. A hacker may do one or more of the following things:

    - Silently monitor the probes and bring up a fake access point with the same ESSID
    the client is searching for. This will cause the client to connect to the hacker
    machine, thinking it is the legitimate network.

    - Create fake access points with the same ESSID as neighboring ones to persuade
    the user to connect to him. Such attacks are very easy to conduct in coffee shops
    and airports where a user might be looking to connect to a Wi-Fi connection.

    - Use recorded information to learn about the victim''s movements and habits.
    These attacks are called Honey pot attacks, because the hacker''s access point
    is mis-associated with the legitimate one.


    ### Orchestrating a Mis-Association attack

    1. Previously, we used a client that had connected to the Wireless Lab access
    point. Let''s switch on the client but not the actual Wireless Lab access point.
    Let''s now run *airodump-ng mon0* and check the output. You will very soon find
    the client to be in the not associated mode and probing for Wireless Lab and other
    SSIDs in its stored profile:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_103_0.png)

    2. To understand what is happening, let''s run Wireshark and start sniffing on
    the **mon0** interface. As expected, you might see a lot of packets that are not
    relevant to our analysis. Apply a Wireshark filter to only display Probe Request
    packets from the client MAC you are using:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_104_0.png)

    3. In my case, the filter would be `wlan.fc.type_subtype == 0x04 && wlan.sa ==
    <my mac>` . You should now see Probe Request packets only from the client for
    the previously identified SSIDs.

    4. Let''s now start a fake access point for the network Wireless Lab on the hacker
    machine using the following command:

    ```airbase-ng -c 3 -e "Wireless Lab" mon0```

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_105_0.png)

    5. Within a minute or so, the client should connect to us automatically. This
    shows how easy it is to have un-associated clients:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_105_1.png)

    6. Now we will try it in competition with another router. We will create a fake
    access point Wireless Lab in the presence of the legitimate one. Let''s turn our
    access point on to ensure that Wireless Lab is available to the client. For this
    experiment, we have set the access point channel to 3. Let the client connect
    to the access point. We can verify this from *airodump-ng*, as shown in the following
    screenshot:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_105_2.png)

    7. Now let''s bring up our fake access point with the SSID Wireless Lab:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_106_0.png)

    8. Notice that the client is still connected to Wireless Lab, the legitimate access
    point:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_106_1.png)

    9. We will now send broadcast deauthentication messages to the client on behalf
    of the legitimate access point to break their connection:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_106_2.png)

    10. Assuming the signal strength of our fake access point Wireless Lab is stronger
    than the legitimate one to the client, it connects to our fake access point instead
    of the legitimate access point:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_106_3.png)

    11. We can verify this by looking at the airodump-ng output to see the new association
    of the client with our fake access point:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_107_0.png)


    We just created a Honeypot using the probed list from the client and also using
    the same ESSID as that of neighboring access points. In the first case, the client
    automatically connected to us, as it was searching for the network. In the latter
    case, as we were closer to the client than the real access point, our signal strength
    was higher, and the client connected to us.


    ### **What do we do if the client does not automatically connect to us?**

    We would have to send a **deauthentication** packet to break the legitimate client-access
    point connection and then, if our signal strength is higher, the client will connect
    to our spoofed access point. Try this out by connecting a client to a legitimate
    access point, and then forcing it to connect to your Honeypot.


    ### The Caffe Latte attack

    In the Honeypot attack, we noticed that clients will continuously probe for SSIDs
    they have connected to previously. If the client had connected to an access point
    using WEP, operating systems such as Windows cache and store the WEP key. The
    next time the client connects to the same access point, the Windows wireless configuration
    manager automatically uses the stored key. The Caffe Latte attack is a WEP attack
    that allows a hacker to retrieve the WEP key of the authorized network, using
    just the client. The attack does not require the client to be anywhere close to
    the authorized WEP network. It can crack the WEP key using just the isolated client.
    Next, we will retrieve the WEP key of a network from a client using the Caffe
    Latte attack.


    ### Conducting a Caffe Latte attack

    1. Let''s first set up our legitimate access point with WEP for the network **Wireless
    Lab** with the ABCDEFABCDEFABCDEF12 key in Hex:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_108_0.png)

    2. Let''s connect our client to it and we can verify that the connection is successful
    using **airodump-ng**.

    3. Let''s unplug the access point and ensure that the client is in the un-associated
    stage and searches for the WEP network **Wireless Lab**.

    4. Now we use **airbase-ng** to bring up an access point with **Wireless Lab**
    as the SSID, with the parameters as shown here:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_108_1.png)

    5. As soon as the client connects to this access point, **airbase-ng** starts
    the Caffe Latte attack, as shown here:

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_109_0.png)

    6. We now start airodump-ng to collect the data packets from this access point
    only, as we did before in the WEP cracking scenario:

    ```root@kali:~# airodump-ng mon0 --bssid 4C:0F:6E:70:BD:CB -w keystream```

    7. We also start **aircrack-ng** as in the WEP-cracking exercise we did before
    to begin the cracking process. The command line will be **aircrack-ng** filename,
    where the filename is the name of the file created by **airodump-ng**. We were
    successful in retrieving the WEP key from just the wireless client without requiring
    an actual access point to be used or present in the vicinity. This is the power
    of the Caffe Latte attack. In basic terms, a WEP access point doesn''t need to
    prove to a client that it knows the WEP key in order to receive encrypted traffic.
