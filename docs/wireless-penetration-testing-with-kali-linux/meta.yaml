    ```


    +   4. This new access point also shows up in the airodump-ng screen.. It is important
    to note that you will need to run airodump-ng in a new window with the following
    command:


    ```

    airodump-ng --channel 11 wlan0

    ```


    +   5. Now we send a deauthentication frame to the client, so it disconnects and
    immediately tries to reconnect:'
