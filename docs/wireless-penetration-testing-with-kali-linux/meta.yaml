    ## 摘要

    - 攻占接入点的默认账户和凭据。

    - 拒绝服务攻击。

    - 邪恶双胞胎和MAC欺骗。

    - 企业网络中的恶意接入点。

    在下一章中，我们将了解针对无线局域网客户端的不同攻击。有趣的是，大多数管理员认为客户端不存在需要担忧的安全问题，但我们会看到事实远非如此。


    ## 第6章：攻击客户端

    在本章中，我们将把关注重点从WLAN基础设施转向无线客户端。客户端既可以是已连接的，也可以是隔离的未关联客户端。我们将了解针对客户端的各类攻击，涵盖以下主题：

    - 蜜罐与错误关联攻击

    - 拿铁攻击

    - 希尔特攻击

    - 无接入点WPA个人版破解


    ### 蜜罐与错误关联攻击

    通常情况下，当笔记本等无线客户端开机后，会扫描其曾经连接过的网络。这些网络会被存储在Windows系统中的一份名为**首选网络列表（PNL）**的列表中。此外，除了这份列表外，无线客户端还会显示其信号范围内的所有可用网络。

    黑客可能会采取以下一项或多项操作：

    - 静默扫描客户端的探测请求，启动与客户端正在搜索的网络ESSID相同的虚假接入点。这会导致客户端误以为该虚假接入点是合法网络，从而连接到黑客的设备。

    - 创建与周边网络ESSID相同的虚假接入点，诱使用户连接到该接入点。这类攻击在用户通常会寻找Wi-Fi连接的咖啡店、机场等场所极易实施。

    - 利用记录下来的信息获知受害者的行动轨迹与习惯。

    这类攻击被称为蜜罐攻击，因为黑客的接入点会与合法接入点产生错误关联。


    ### 实施错误关联攻击

    1. 此前我们曾使用过连接到Wireless Lab接入点的客户端。现在请开启客户端，但不启动实际的Wireless Lab接入点。随后运行*airodump-ng
    mon0*命令并查看输出结果，你很快会发现客户端处于未关联状态，正在扫描其存储配置文件中保存的Wireless Lab及其他SSID：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_103_0.png)

    2. 为了解当前发生了什么，我们运行Wireshark并开始在**mon0**网卡上抓包。不出所料，你会看到大量与分析无关的数据包。此时请应用Wireshark过滤规则，仅显示你所使用的客户端MAC地址发送的探测请求数据包：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_104_0.png)

    3. 我使用的过滤规则为`wlan.fc.type_subtype == 0x04 && wlan.sa == <my mac>`，此时你应该只能看到该客户端针对此前识别到的SSID发送的探测请求数据包。

    4. 现在我们在黑客设备上使用以下命令启动针对Wireless Lab网络的虚假接入点：

    ```airbase-ng -c 3 -e "Wireless Lab" mon0```

