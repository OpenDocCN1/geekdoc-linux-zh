  md: '# A rogue access point


    A rogue access point is an unauthorized access point connected to the authorized
    network. Typically, this access point can be used as a backdoor entry by an attacker,
    thus enabling him to bypass all security controls on the network. This would mean
    that the firewalls, intrusion prevention systems, and so on, which guard the border
    of a network, would be able to do little to stop him from accessing the network.


    In the most common case, a rogue access point is set to Open Authentication and
    no encryption. The rogue access point can be created in the following two ways:


    +   * Installing an actual physical device on the authorized network as a rogue
    access point. Also, more than wireless security, this has to do with breaching
    the physical security of the authorized network.

    * Creating a rogue access point in software and bridging it with the local authorized
    network Ethernet network. This will allow practically any laptop running on the
    authorized network to function as a rogue access point.


    Follow these instructions to get started:


    +   1. Let''s first bring up our rogue access point using *airbase-ng* and give
    it the ESSID Rogue:'
  merge: -1
  pgno: 97
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_98_0.png)


    # 2. We now want to create a bridge between the Ethernet interface, which is part
    of the authorized network, and our rogue access point interface. To do this, we
    will first install *bridge-utils* files, create a bridge interface, and name it
    *Wifi-Bridge*.


    The following screenshot shows the required commands in action:


    ```

    apt-get install bridge-utils

    ```


    ```

    brctl addbr Wifi-Bridge

    ```


    Let''s see the following output of the command:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_98_1.png)


    # 3. We will then add both the Ethernet and the At0 virtual interface created
    by *Airbase-ng* to this bridge:


    ```

    brctl addif Wifi-Bridge eth0

    ```


    ```

    brctl addif Wifi-Bridge ath0

    ```'
  merge: -1
  pgno: 98
- img_proc: true
  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_99_0.png)


    +   4. We will then bring with these interfaces up to bring the bridge up


    with the following commands:


    ```

    ifconfig eth0 0.0.0.0 up

    ifconfig ath0 0.0.0.0 up

    ```


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_99_1.png)


    +   5. We will then enable IP forwarding in the kernel to ensure that


    packets are forwarded:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_99_2.png)


    +   6. Brilliant! We are done. Now, any wireless client connecting to our rogue
    access point will have full access to the authorized network using the wireless-to-wired
    **Wifi-Bridge** we just built. We can verify this by connecting a client to the
    rogue access point.


    +   7. We can now access any host on the wired network from this wireless client
    using this rogue access point.


    | We created a rogue access point and used it to bridge all the authorized network
    LAN traffic over the wireless network. As you can see, this is a |

    |---------------------------------------------------------------------------------------------------------------------------------------------|

    | really serious security threat as anyone can break into the wired network |

    |---------------------------------------------------------------------------------------------------------------------------------------------|

    | using this bridge. |'
  merge: -1
  pgno: 99
