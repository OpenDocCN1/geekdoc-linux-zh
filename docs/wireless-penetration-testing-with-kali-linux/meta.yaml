    +   - The number of devices that have associations with open networks and the
    corporate network

    - The number of devices that have networks that can be linked to locations through
    solutions such as WiGLE

    - The existence of weak encryption

    - The networks set up are too strong


    # Attack


    Once reconnaissance has been performed, exploitation must be performed for proof
