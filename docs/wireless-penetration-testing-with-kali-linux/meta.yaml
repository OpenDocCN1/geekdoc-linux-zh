    5. For both the WEP and WPA networks, once you are connected, you can use **dhcpclient**
    to grab a DHCP address from the network by typing *dhclient3 wlan0*.


    # **Quiz – WLAN Encryption Flaws**


    # **Q1.** What packets are used for Packet Replay?


    +   1. Deauthentication packet.

    2. Associated packet.

    3. Encrypted ARP packet.

    4. None of the above.


    # **Q2.** When can WEP be cracked?


    +   1. Always.

    2. Only if a weak key/passphrase is chosen.

    3. Under special circumstances only.

    4. Only if the access point runs old software.


    # **Q3.** When can WPA be cracked?


    +   1. Always.

    2. Only if a weak key/passphrase is chosen.

    3. If the client contains old firmware.

    4. Even with no client connected to the wireless network.'
  - '[PAGE 87]


    # **Summary**


    In this chapter, we learnt about WLAN encryption. WEP is flawed and no matter
    what the WEP key is, with enough data packet samples: it is always possible to
    crack WEP. WPA/WPA2 is cryptographically un-crackable currently; however, under
    special circumstances, such as when a weak passphrase is chosen in WPA/WPA2-PSK,
    it is possible to retrieve the passphrase using dictionary attacks.


    In the next chapter, we will take a look at different attacks on the WLAN infrastructure,
    such as rogue access points, evil twins, bit-flipping attacks, and so on.'
  - '[PAGE 88]


    # Chapter 5: Attacks on the WLAN Infrastructure


    The WLAN infrastructure is what provides wireless services to all the WLAN clients
    in a system. In this chapter, we will take a look at the various attacks that
    can be conducted against the infrastructure:


    +   - Default accounts and credentials on the access point

    - Denial of service attacks

    - Evil twin and access point MAC spoofing

    - Rogue access points


    # Default accounts and credentials on the access point


    WLAN access points are the core building blocks of the infrastructure. Even though
    they play such an important role, they are sometimes the most neglected in terms
    of security. In this exercise, we will check whether the default passwords have
    been changed on the access point or not. Then, we will go on to verify that, even
    if the passwords have been changed, they are still easy to guess and crack using
    a dictionary-based attack.


    It is important to note that, as we move on to more advanced chapters, it will
    be assumed that you have gone through the previous chapters and are now familiar
    with the use of all the tools discussed there. This will allow us to build on
    that knowledge and try more complicated attacks!


    # Cracking default accounts on the access points


    +   1. Let''s first connect to our access point Wireless Lab and attempt to navigate
    to the HTTP management interface. We see that the access point model is TP-Link
    WR841N, as shown in the following screenshot:'
  - '[PAGE 89]


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_89_0.png)


    2. From the manufacturer''s website, we find the default account credentials for
    the user "admin" is "admin". We try this on the login page and we succeed in logging
    in. This shows how easy it is to break into accounts with default credentials.
    We highly encourage you to obtain the router''s user manual online. This will
    allow you to understand what you are dealing with during the penetration test
    and gives you an insight into other configuration flaws you could check for:'
  - '[PAGE 90]


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_90_0.png)


    We verified that the default credentials were never changed on this access point,
    and this could lead to a full network compromise. Also, even if the default credentials
    are changed, the result should not be something that is easy to guess or run a
    simple dictionary-based attack on.


    | |

    |--|

    | You can change the password to something that is hard to guess or find in a
    dictionary and see whether you can crack it using a brute-force approach. |

    | Limit the length and characters in the password so that you can succeed at some
    point. |

    | One of the most common tools used to crack HTTP authentication is called **Hydra**
    and is available on **Kali**. |'
  - '[PAGE 91]


    # Denial of service attacks


    WLANs are prone to **Denial of Service (DoS)** attacks using various techniques,
    including but not limited to:


    +   - deauthentication attack

    - Disassociation attack

    - CTS-RTS attack

    - Signal interference or spectrum jamming attack


    In the scope of this book, we will discuss deauthentication attacks on the Wireless
    LAN infrastructure using the following experiment:


    # Deauthentication DoS attacks


    +   1. Let''s configure the Wireless Lab network to use Open Authentication and
    no encryption. This will allow us to see the packets using Wireshark easily:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_91_0.png)


    +   2. Let''s connect a Windows client to the access point. We will see the connection
    in the *airodump-ng* screen:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_91_1.png)


    +   3. Now, on the attacker machine, let''s run a directed deauthentication attack
    against this:'
