  md: 'interface. This ensured that any wireless client connecting to the fake access
    point will perceive that it is connected to the Internet via the wired LAN.


    We bridged the wireless interface with a wired one. As we noted earlier, this
    is one of the possible connection architectures for an MITM. There are other combinations
    possible as well. An interesting one would be to have two wireless interfaces,
    one that creates the fake access point and the other interface that is connected
    to the authorized access point. Both these interfaces are bridged. So, when a
    wireless client connects to our fake access point, it gets connected to the authorized
    access point through the attacker''s machine.


    Please note that this configuration would require the use of two wireless cards
    on the attacker''s laptop.


    Check whether you can conduct this attack using the in-built card on your laptop
    along with the external one—bear in mind, you may not have the injection drives
    required for this activity. This should be a good challenge!


    # Wireless Eavesdropping using MITM


    In the previous lab, we learned how to create a setup for MITM. Now, we will take
    a look at how to do Wireless Eavesdropping with this setup.


    The whole lab revolves around the principle that all the victim''s traffic is
    now routed through the attacker''s computer. Thus, the attacker can eavesdrop
    on all the traffic sent to and from the victim''s machine.


    Follow these instructions to get started:


    +   1. Replicate the entire setup as in the previous lab. Fire up Wireshark. Interestingly,
    even the MITM-bridge shows up. This interface would allow us to peer into the
    bridge traffic, if we wanted to:'
