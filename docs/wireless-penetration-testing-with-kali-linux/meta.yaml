    无线网络在当今世界已无处不在。人们每天都在全球各地的家中、办公室和公共热点使用无线网络登录互联网，处理个人事务与工作。尽管无线技术让生活变得极为便捷，赋予我们出色的移动性，但它也伴随风险。近年来，不安全的无线网络被用于入侵企业、银行与政府机构。这类攻击的频率正不断升高，因为网络管理员们至今仍不清楚如何以稳健且万无一失的方式保障无线网络安全。本书旨在帮助读者了解无线网络存在的安全风险，以及如何开展渗透测试来发现并修复这些漏洞，是希望开展无线网络安全审计、一直想获得循序渐进实践指导的读者的必读之作。由于本书讲解的每一种无线攻击都会立即附带实操演示，因此学习内容非常完整。我选择Kali
    Linux作为本书测试所有无线攻击的平台。Kali Linux是全球最流行的渗透测试发行版，内置了数百种安全与黑客工具，其中部分工具将在本书后续内容中使用。


    ## 本书所需准备材料

    要完成并复现本书中的实操练习，你需要两台配备内置Wi-Fi卡的笔记本电脑、一个USB无线Wi-Fi适配器、Kali Linux系统以及其他部分软硬件。作为两台笔记本电脑的替代方案，你也可以搭建搭载Kali
    Linux的虚拟机，通过USB接口将无线网卡连接到虚拟机中。这种方式能让你更快上手本书内容，但如果你要进行实际的现场评估，我们仍推荐使用预装Kali Linux的专用设备。从前提要求来看，读者需要了解无线网络的基础知识，包括熟悉802.11协议的基础知识，以及客户端与接入点的通信原理。尽管我们在搭建实验环境时会简要涉及部分相关内容，但默认读者已经掌握这些概念。


    ## 本书适合人群

    尽管本书属于入门系列，但适合所有水平的用户，从初学者到无线安全专家均能从书中获益，每个人都能找到适合自己的内容。本书从简单的攻击讲起，循序渐进讲解更复杂的攻击技术，最后探讨前沿攻击技术与相关研究。由于所有攻击都通过实操演示讲解，各水平段的读者都能轻松自行尝试这些攻击。需要注意的是，尽管本书介绍了多种可对无线网络发起的攻击手段，但本书的真正目的是帮助读者成长为无线渗透测试人员。一名熟练的渗透测试人员需要了解所有现有攻击手段，若客户有相关要求，能够轻松演示这些攻击。


    ## 排版约定

    本书中你会看到多种不同样式的文本，用于区分不同类型的信息。以下是一些样式示例及其含义说明：

    正文中的代码术语、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟URL、用户输入以及Twitter用户名会以下列样式展示：“打开控制台终端，输入`iwconfig`。”

    所有命令行输入或输出会以下列样式展示：

    ```

    airodump-ng -bssid 00:27:01:D4:8E:25 --channel 11 --write WEPCrackingDemo mon0

    ```


    ## 第一章：无线实验环境搭建

    所有成功的实施都离不开数小时甚至数日的准备，无线渗透测试也不例外。在本章中，我们将搭建无线实验环境，用于本书后续的所有实验。你可以把这个实验环境当作进入真实渗透测试前的演练场！

    无线渗透测试是一门实践性极强的学科，首先搭建一个安全、可控的实验环境来试做本书中的所有实验至关重要。建议你在继续学习本书内容前先完成该实验环境的搭建。

    在本章中，我们将学习以下内容：

    - 硬件与软件需求

    - 下载并安装Kali Linux

    - 搭建并配置接入点

    - 安装无线网卡

    - 测试笔记本电脑与接入点之间的连通性


    ### 硬件需求

    搭建无线实验环境需要以下硬件：

    - 两台配备内置Wi-Fi卡的笔记本电脑：其中一台将作为实验中的受害者设备，另一台作为渗透测试人员的专用设备。尽管几乎所有笔记本电脑都符合要求，但我们推荐使用至少配备4GB内存的设备，因为实验中可能会运行大量内存密集型软件。

    - 一个无线适配器（可选）：根据你笔记本电脑原有无线网卡的性能，你可能需要一个支持Kali系统的USB Wi-Fi网卡，用于实现数据包注入与数据包嗅探功能。最佳选择是Alfa
    Networks旗下的Alfa AWUS036H网卡，Kali系统开箱即用支持该设备，截至本文写作时，该设备在www.amazon.com的零售价为30美元。备选方案包括TP-Link
    N150高增益USB无线适配器（TL-WN722N）、Panda 300Mbps无线N USB适配器，以及体积更小、价格略低的Edimax EW-7711UAN适配器。

    - 一个接入点：任何支持WEP/WPA/WPA2加密标准的接入点均可满足要求。本书中为方便演示，我将使用TP-LINK TL-WR841N无线路由器作为实验接入点。截至本文写作时，你可以在www.amazon.com以约25美元的零售价购买该设备。

    - 一条可用的互联网连接：可用于资料检索、软件下载以及部分实验操作。


    ### 软件需求

    搭建无线实验环境需要以下软件：

    - Kali Linux：该软件可从官网http://www.kali.org下载。该软件为开源项目，你可以直接从官网下载安装包。

    - Windows 7/Windows 8/Windows 8.1或Windows 10：你需要将上述四个系统中的任意一个安装到其中一台笔记本电脑上，这台设备将在本书后续所有内容中作为受害者设备使用。需要注意的是，尽管本次测试使用Windows操作系统，但所学技术可应用于任何支持Wi-Fi的设备，例如智能手机、平板电脑等。

