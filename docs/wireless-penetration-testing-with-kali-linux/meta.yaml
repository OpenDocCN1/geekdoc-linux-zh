  md: '# Installing Kali Linux


    Let''s now quickly take a look at how to get up-and-running with Kali.


    Kali will be installed on the laptop that will serve as the penetration tester''s
    machine for the rest of the book.


    Kali is relatively simple to install. We will run Kali by booting it as a Live
    DVD and then install it on the hard drive.


    Perform the following instructions step by step:


    Burn the **Kali ISO** (we are using the Kali 64-bit ISO) you downloaded onto a
    bootable DVD.


    +   1. Boot the laptop with this DVD and select the option **Graphical Install**
    from the **Boot menu**:


    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_9_0.png)


    +   2. If the booting was successful, then you should see a screen as follows:'
