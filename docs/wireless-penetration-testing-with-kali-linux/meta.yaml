  md: '![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_89_0.png)


    2. From the manufacturer''s website, we find the default account credentials for
    the user "admin" is "admin". We try this on the login page and we succeed in logging
    in. This shows how easy it is to break into accounts with default credentials.
    We highly encourage you to obtain the router''s user manual online. This will
    allow you to understand what you are dealing with during the penetration test
    and gives you an insight into other configuration flaws you could check for:'
