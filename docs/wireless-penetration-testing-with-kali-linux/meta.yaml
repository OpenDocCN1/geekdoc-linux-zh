    WEP 破解的同时，使用上一章学到的共享密钥认证绕过技术伪造认证与关联。将合法客户端从网络中注销，验证你仍然能够向网络注入数据包，以及接入点是否会接受并响应这些数据包。

    ## WPA 与 WPA2

    WPA 主要使用 TKIP 加密算法。TKIP 旨在改进 WEP，且无需完全更换硬件即可运行。相比之下，WPA2 强制使用 AES-CCMP 算法进行加密，其安全强度和稳定性远高于
    TKIP。WPA 和 WPA2 均支持两种认证方式：一种是通过 RADIUS 服务器实现的基于 EAP 的认证（企业级），另一种是基于**预共享密钥（PSK）**的认证（个人级）。

    WPA/WPA2 PSK 容易受到字典攻击。这类攻击所需的输入包括客户端与接入点之间的四次 WPA 握手数据，以及包含常见口令的词表。之后，我们可以使用**Aircrack-ng**等工具尝试破解
    WPA/WPA2 PSK 口令。四次握手的示意图如下所示：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_73_0.png)

    WPA/WPA2 PSK 的工作原理是：它使用预共享密钥和其他五个参数（网络 SSID、**认证方随机数（ANonce）**、**请求方随机数（SNonce）**、认证方
    MAC 地址（接入点 MAC）、**请求方 MAC 地址（Wi-Fi 客户端 MAC）**）派生出每会话密钥，即**成对瞬态密钥（PTK）**，该密钥用于加密接入点与客户端之间的所有数据。

    通过监听空口嗅探整个通信过程的攻击者可以获得上一段提到的全部五个参数，唯一无法获取的是预共享密钥。那么预共享密钥是如何生成的呢？它由用户提供的 WPA-PSK
    口令和 SSID 共同派生而来，这两者的组合会经过**基于密码的密钥派生函数（PBKDF2）**处理，最终输出 256 位的共享密钥。

    在典型的 WPA/WPA2 PSK 字典攻击中，攻击者会使用包含大量可能口令的字典配合攻击工具。工具会从字典中的每个口令派生出 256 位的预共享密钥，再将其与前文提到的其他参数结合生成
    PTK。PTK 将用于验证握手数据包中的**消息完整性校验（MIC）**，如果校验匹配，说明字典中猜测的口令是正确的；反之则错误。最终，如果授权网络的密码存在于字典中，就会被识别出来。这正是
    WPA/WPA2 PSK 的破解原理！下图展示了相关步骤：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_74_0.png)

    接下来我们将了解如何破解 WPA PSK 无线网络，使用 CCMP（AES）的 WPA2-PSK 网络的破解步骤完全相同。

    ## 破解 WPA-PSK 与 WPA2-PSK 口令

    按照以下说明开始操作：

    - 1. 首先连接到我们的接入点「Wireless Lab」，并将接入点设置为使用 WPA-PSK 认证。我们将 WPA-PSK 口令设置为 "abcdefgh"，使其易受字典攻击：

    ![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_75_0.png)

    - 2. 使用以下命令启动 airodump-ng，使其开始捕获并存储我们网络的所有数据包：

