  md: 'We successfully sent deauthentication frames to both the access point and the
    client. This resulted in them getting disconnected and a full loss of communication
    between them.


    We also sent out Broadcast deauthentication packets, which will ensure that no
    client in the vicinity can successfully connect to our access point.


    It is important to note that, as soon as the client is disconnected, it will try
    to connect back once again to the access point, and thus the deauthentication
    attack has to be carried out in a sustained way to have a full denial of service
    effect.


    This is one of the easiest attacks to orchestrate but has the most devastating
    effect. This can easily be used in the real world to bring a wireless network
    down on its knees.


    | Try to check how you can conduct Dis-Association attacks against the infrastructure
    using tools available on Kali. Can you do a broadcast disassociation attack? |


    # ## Evil twin and access point MAC spoofing


    One of the most potent attacks on WLAN infrastructures is the evil twin. The idea
    is to basically introduce an attacker-controlled access point in the vicinity
    of the WLAN network. This access point will advertise the exact same SSID as the
    authorized WLAN network.


    Many wireless users may accidently connect to this malicious access point, thinking
    it is part of the authorized network. Once a connection is established, the attacker
    can orchestrate a man-in-the-middle attack and transparently relay traffic while
    eavesdropping on the entire communication. We will take a look at how a man-in-the-middle
    attack is done in a later chapter. In the real world, an attacker would ideally
    use this attack close to the authorized network so that the user gets confused
    and accidently connects to the attacker''s network.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'An evil twin having the same MAC address as an authorized access point is even
    more difficult to detect and deter. This is where access point MAC Spoofing comes
    in! In the next experiment, we will take a look at how to create an evil twin,
    coupled with access point MAC spoofing.


    Follow these instructions to get started:


    +   1. Use airodump-ng to locate the access point''s BSSID and ESSID, which we
    would like to emulate in the evil twin:


    ```

    BSSID          PWR  Beacons  #Data, #/s  CH  MB   ENC  CIPHER AUTH ESSID


    E8:94:F6:62:1E:8E  -49  2        0        0   6  54e. OPN        PSK          Wireless
    Lab


    BSSID              STATION            PWR   Rate   Lost  Frames  Probe

    9C:D3:6D:2A:7B:C0  20:10:7A:45:36:61  -71   2e- 5e  0     9

    9C:D3:6D:2A:7B:C0  70:18:8B:08:47:B6  -59   0e- 0e  0     2

    ```


    +   2. We connect a Wireless client to this access point.


    +   3. Using this information, we create a new access point with the same ESSID
    but a different BSSID and MAC address using the airbase-ng command. Minor errors
    may occur with newer releases:


    ```

    root@kali:~# airbase-ng --essid Rogue -c 11 mon0

    15:56:06  Created tap interface at0

    15:56:06  Trying to set MTU on at0 to 1500

    15:56:06  Access Point with BSSID 80:1F:02:8F:34:D5 started.

