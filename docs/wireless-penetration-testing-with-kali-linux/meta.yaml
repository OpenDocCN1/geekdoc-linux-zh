    +   8. Now if we look at through `airodump-ng`, it is almost impossible to differentiate
    between both visually.


    +   9. Even `airodump-ng` is unable to discern that there are actually two different
    physical access points on the same channel. This is the most potent form of the
    evil twin.


    We created an evil twin for the authorized network and used a deauthentication
    attack to have the legitimate client connect back to us, instead of the authorized
    network access point.


    It is important to note that, in the case of the authorized access point using
    encryption such as WEP/WPA, it might be more difficult to conduct an attack in
    which traffic eavesdropping is possible.'
