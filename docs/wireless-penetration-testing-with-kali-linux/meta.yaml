    - 3. 现在可以等待新客户端连接到接入点以捕获四次 WPA 握手数据，也可以发送广播解除认证数据包强制客户端重新连接。我们选择后一种方式以加快进程。遇到未知信道错误时也会出现同样的情况，此时再次使用
