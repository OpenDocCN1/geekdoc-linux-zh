    \ mode with \"list\". hash bytes: 9052 NT hash: e18614f7c6811f043fbf54205e929052\
    \ password: abcdefghi ```\n\n我们使用FreeRADIUS-WPE搭建了蜜罐。企业客户端存在配置错误，未在PEAP中启用证书验证。这使得我们能够向客户端出示自定义的伪造证书，而客户端会直接接受。一旦该情况发生，作为内部身份验证协议的MSCHAP-v2就会启动。由于客户端使用我们的伪造证书加密数据，我们可以轻松恢复用户名、质询和响应的元组。MSCHAP-v2易受字典攻击。我们使用asleap工具破解质询和响应对，因为该哈希看起来是基于字典单词生成的。PEAP存在多种错误配置方式。即使启用了证书验证，如果管理员未在“连接到这些服务器”列表中添加可信服务器，攻击者也可以从列表中任意受信任的证书颁发机构获取其他域名的真实证书，客户端仍然会接受该证书。此类攻击的其他变体也有可能发生。\n\
    \n## 企业安全最佳实践\n我们已见识到大量针对WPA/WPA2（含个人版和企业版）的攻击。基于我们的经验，我们给出以下建议：\n- 对于小型办公/家庭办公（SOHO）网络及中小型企业，使用带有强密码的WPA2-PSK。您最多可使用63个字符，请充分利用这一字符空间。\n\
    - 对于大型企业，使用搭载EAP-TLS的WPA2-Enterprise。该方案同时采用客户端和服务器端证书进行身份验证，目前无法被破解。\n- 如果必须在WPA2-Enterprise中使用PEAP或EAP-TTLS，请确保已开启证书验证、选择了正确的证书颁发机构、使用经过授权的RADIUS服务器，同时关闭任何允许用户接受新RADIUS服务器、证书或证书颁发机构的设置。\n\
    \n## **测验 – 攻击WPA企业版与RADIUS**\n### Q1. 以下哪项是FreeRADIUS-WPE？\n- 1. 一个从头编写的RADIUS服务器。\n\
    - 2. FreeRADIUS服务器的一个补丁。\n- 3. 默认预装在所有Linux发行版中。\n- 4. 以上都不对。\n### Q2. 以下哪项可用于攻击PEAP？\n\
    - 1. 伪造凭据。\n- 2. 伪造证书。\n- 3. 使用WPA-PSK。\n- 4. 以上所有。\n### Q3. EAP-TLS使用什么？\n- 1.\
    \ 客户端证书。\n- 2. 服务器端证书。\n- 3. 仅上述1或2中的一个。\n- 4. 上述1和2均使用。\n### Q4. EAP-TTLS使用什么？\n\
    - 1. 仅客户端证书。\n- 2. 服务器端证书。\n- 3. 基于密码的身份验证。\n- 4. LEAP。\n\n## 第9章：WLAN渗透测试方法论\n\
    本章将介绍如何将前几章所学的技术转化为完整的无线渗透测试流程。执行无线渗透测试时，遵循明确的方法论至关重要。仅启动airbase或airodump命令然后碰运气，是无法满足测试目标的。作为渗透测试人员，你必须确保遵守所服务组织的相关标准，若组织没有相关标准，你应遵守最高的行业标准。\n\
    \n从整体上看，我们可以将无线渗透测试流程划分为以下阶段：\n- 规划阶段\n- 发现阶段\n- 攻击阶段\n- 报告阶段\n\n### 规划\n在此阶段，我们需要明确以下内容：\n\
    - 评估范围：渗透测试人员应与客户协同定义可实现、且能最大限度揭示网络安全状况的范围。通常需要收集以下信息：\n  - 渗透测试的地点\n  - 场所的总覆盖面积\n\
    \  - 已部署的接入点和无线客户端的大致数量\n  - 评估涵盖哪些无线网络？\n  - 漏洞利用是否在评估范围内？\n  - 针对用户的攻击是否在评估范围内？\n\
    \  - 拒绝服务攻击是否在评估范围内？\n- 工作量估算：根据定义的范围，测试人员需要估算所需时间。请注意，估算完成后可能会发生范围调整，因为组织在时间和资金方面的资源可能有限。\n\
    - 合法性：执行测试前，客户必须出具书面同意。同意书应说明测试覆盖范围，明确赔偿、保险的级别以及范围的限制。如果你不确定，需要咨询相关领域的专业人士。大多数组织都有自己的版本，通常还会包含保密协议（NDA）。一旦上述所有要求落实到位，我们就可以开展测试了！\n\
    \n### 发现\n此阶段的目标是识别范围内无线设备和无线网络的特征并为其标注。执行这些操作的技术在前面的章节中已有介绍，简而言之，目标如下：\n- 枚举区域内可见和隐藏的无线网络\n\
    - 枚举区域内的设备，以及连接到目标网络的设备\n- 绘制网络覆盖范围图，标注网络可从哪些位置接入，以及是否存在恶意攻击者可发起攻击的位置（例如咖啡馆）\n\
    \n所有上述信息都需要记录。如果测试仅限侦察工作，那么测试将在此结束，测试人员将尝试基于这些信息得出结论。对客户有用的表述示例如下：\n- 连接到开放网络和企业网络的设备数量\n\
    - 可通过WiGLE等解决方案关联到具体位置的网络数量\n- 弱加密的存在情况\n- 已建立的网络安全性过强\n\n### 攻击\n完成侦察工作后，需开展漏洞利用以验证概念。如果攻击是红队演练或更广泛评估的一部分，那么漏洞利用应尽可能隐秘地完成以获取网络访问权限。在我们的攻击阶段，我们将探索以下内容：\n\
    - 破解加密\n- 攻击基础设施\n- 入侵客户端\n- 查找易受攻击的客户端\n- 查找未授权客户端\n\n### 破解加密\n第一步是获取任何已识别易受攻击网络的密钥。如果存在WEP网络，请执行第4章《WLAN加密漏洞》中介绍的WEP破解方法。如果存在WPA2保护的系统，你有两个选择。如果追求隐秘性，请在抵达站点时\n"
