    \n![](img/f62f3d8a0c2560e2bb8d8daaee6b9939_81_0.png)\n\n- 2. 现在我们创建一个WPA-PSK网络，密码短语为**abcdefgh**（存在于我们使用的字典中），并捕获该网络的WPA握手包。接下来我们使用**Cowpatty**破解WPA密码，如下图所示：\n\
