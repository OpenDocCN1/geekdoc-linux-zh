    things for their exploitation. We have a wide variety of signing tools like jar
    signer in the Metasploit interface. Select any one of them and use the following
    command root @ examplelinux : msfvenom signer -ssh 23.2.2.1The signer tool has
    the following attributes which will be explained in the next section in detail: a)
    Type of certificateThere are a lot of certificate signs that need to be reviewed.
    You can use either an SHA way or by RSA way. b) -verifyThis command will make
    the tool to verify the app with the certification that the user has selected. Now
    after verification, you need to use aligning tools that can mix up the exploit
    that you have developed with the apk tool. c) alignAligning is a process of inserting
    the exploit into the application. There are a lot of exploits that are available
    in the Metasploit database. Or you can even create an own shell script that can
    send back information to our server. For the visual demonstration of this topic
    we will explain about a shell script that performs the following functions: a)
    The shell script should collect all the user contacts that are present on the
    phone. b) The shell script should identify any new messages that are received
    and should send them to the Metasploit server. Few might have got a doubt about
    how the Metasploit server works. It consists of a URL that is inserted into the
    exploit and we need to enter the same URL into the browser in that network. In
    this way, we can access all the information that is being sent to the server. d)
    PackingAfter aligning the exploit into an app, you need to repackage it so that
    the apk looks perfectly normal. There is maybe a small marginal change in the
    size of the apk. To get undetected by the antiviruses you may use additional security
    options that can spoof the phone security. You can use the following command to
    package the apk and exploit:root @ example : pack location seems.apkAfter packaging
    the app, you should find a smart social engineering technique to send it to the
    victim''s system. You can use an email with a rar file to send it to the phone.
    And when the victim successfully installs the application on his phone the app
    starts running in the background and will send all of the required data to the
    Metasploit server. That''s it about the exploit and its implementation using the
    Metasploit interface console. In the next chapter, we will give a brief introduction
    about the network sniffing tool known as wire shark and end this chapter. Wireless
    Network sniffing tools In a whole lot of kali Linux tools that are available,
    this stands among the most popular tools because of the huge expansion of wireless
    networks in the everyday world. From Bluetooth devices to wireless echo devices
    there are a lot of wireless devices that can be easily sniffed if they are connected
    to an unsecured wireless network. What is sniffing?Sniffing, in general, is a
    term that is defined for peeking into other stuff. In technical terms, sniffing
    means to look at network packets that are coming from other devices using tools
    like wire shark and air crack-ng. We will discuss both of these two tools in detail
    in this section a) WiresharkWireshark is a network sniffing tool that tracks every
    packet that the network is dealing with. After starting the sniffer tool you need
    to wait at least 24 hours so that the sniffer catches a sufficient number of packets
    for analysis. During analysis, one can easily find all the sensitive information
    like passwords and credit card numbers. There is also a chance of using sniffing
    tools to hack unencrypted files and emails that are being sent. This is the reason
    why hackers should use encrypted mail services and virtual private networks for
    better security. b) aircrack ngAircrack ng is another network sniffer tool that
    is extensively used to crack WiFi passwords. Usually, wpa2 WiFi routers are considered
    as the most secure network routers, unlike WPS routers which leave a bug to easily
    hack their passwords. This aircrack ng uses this vulnerability to boot scan the
    dictionary attacks and connect to the wireless network. Aircrack is one of the
    most popular wireless network programs that are available in the market right
    now. By this, we have completed a detailed tour of some of the most important
    kali Linux tools with an overview of practical applications that can be done using
    these tools. We hope that with this chapter you have gained a lot of meaningful
    information. This is the end of the book and I end this book with a clear explanation
    of what a hacker should try to be. A hacker learns skills and applies them with
    utmost hard work to crack into systems. Cracking doesn''t mean to be exploiting
    and using them for their mischief purposes. Cracking means checking whether the
    walls are built strong or not. That''s it that is what a hacker needs to remember
    all the time. All the best to our adventures of hacking! ConclusionThank you for
    making it through to the end of Hacking with Linux, let’s hope it was informative
    and able to provide you with all of the tools you need to achieve your goals whatever
    they may be.The next step is to use these concepts in real-world and exploit environments
    or protect them with goodwill. All the best!Finally, if you found this book useful
    in any way, a review on Amazon is always appreciated!'
