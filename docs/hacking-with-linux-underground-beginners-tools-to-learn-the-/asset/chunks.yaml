    software to report the pen testing reports.By this, we have completed a detailed
    explanation about how hackers work and even given a checklist of things that need
    to be done by or testers. In the next chapter, we will have a detailed introduction
    to web hacking and some of its tools. From the next chapter, we will be dealing
    with practical things so get ready to have fun with hacking. Let''s go!Chapter
    5:Web Hacking ToolsAfter a brief discussion of the hacking procedure in the previous
    chapter, we will now go a long discussion about web hacking in this chapter. As
    we all know in today''s world both web and mobile applications are the pioneers
    of technology. A lot of hackers try to find loopholes and exploit them for their
    personal use. So, a thorough understanding of the web is necessary for security
    professionals and wannabe hackers.For this reason, we will go in a practical approach
    to web hacking tools. We will discuss web hacking tools like Uniscan in detail.
    Let us enter into the world of web hacking. First of all, we will give a small
    introduction to the web and protocols.What is the web?The web is an interconnected
    system of networks that displays both static and dynamic information in the form
    of web applications nowadays.What are the protocols?It is just a way to transmit
    information between the client and the server.Http and HTTPS are the famous protocols
    that are used for web communication. We will look at six tools that do different
    tasks.Scanning of WebserversWeb servers are used to store information in particular.
    They consist of a lot of information both static and user-based information. If
    a hacker can get access to a web server, he can exploit any information he wants
    to.Usually, hackers do a brief fingerprinting test about the webserver before
    attacking. This is one of the most important hacking processes that need to be
    done. If webserver has any potential vulnerability it would be easy to crack into
    it using a payload.There will be a lot of web vulnerabilities that need to be
    checked on the target server. It will be time-consuming to check every one of
    them manually. So we can use a tool like Nikto to automate the work.Nikto is one
    of the famous web hacking tools that are pre-bundled with Kali Linux. It scans
    a webserver using its huge database that consists of potential vulnerabilities
    of web servers.Here we will describe some of the excellent features of the Nikto
    web server scanner.1) Saving reports XML, HTMLAll the reports that are obtained
    using the automatic web scanner can be easily converted to XML and HTML formats.2)
    Metasploit usageMetasploit is a console tool that can be used to make exploits.
    With this tool, you can insert Metasploit exploits.3) Mutation techniques to fish
    for content on web serversThere are techniques such as the mutation that can easily
    sniff or duplicate the content that is present in the web servers. Web servers''
    fish these things to display good results.4) Subdomain guessingThis web scanners
    also use techniques in a way such that the subdomains that are present can be
    easily found out. These web scanners also sometimes web servers that are not in
    the scope.5) Doing a test based on a tuning parameterIn this tool when we encounter
    a vulnerability or bug, we usually test it out. The testing of it sometimes does
    in a varied structure called turning parameters that has a huge ability to concern
    the things.Below is a brief process that takes place when an automatic scanner
    starts.A) Starting nikto on a webserverFor the starting of the web scanning server,
    you need to have a host address and hostname along with a tuning mechanism. By
    using this command, you can easily detect the versions of the webserver or the
    programming language that has been usedHere is the command for the starting of
    the Nikto :example@ linuxwar : start Nikto www.exampleweb.comB) Running all tasksUsually,
    there are a lot of hosts that we can attack. Hackers try to do things at a fast
    rate by attacking all of the hosts at once. For this reason, Nikto provided a
    tool that lets you insert the word file so that you can scan all of them at once.Here
    is the command that can be used to run all tasks:example@ linuxwar : run Nikto
    193.3234.33.23C) Running against multiple hostsWhere the prior command attacks
    on different servers at once with a single address in this process we will use
    different network addresses while attacking the host interfaces.Here is the command
    that explains this process.example@ linuxwar : run hosts host1 host2 host3With
    this, we have given a complete introduction to the manual web scanners and in
    the next section, we will start learning about Wordpress and its vulnerabilities
    in detail.Hacking a WordPress WebsiteNormally websites are developed from scratch
    using different web programming languages like PHP and javascript. But normally
    not every small business can afford good web programmers to write separate code
    for them.So, a lot of internet users rely on content management systems. And out
    of a lot that is available WordPress is the most famous. It is used in more than
    25℅ of the websites that are present.It offers good security features along with
    a lot of themes and plugins that can be used. However, WordPress is not fully
    safe from a few vulnerabilities. There are more chances of an XSS or CSRF vulnerability
    to be found. And the worst part of using WordPress is plugins and themes can be
    used to insert malicious code. A lot of hackers use this strategy to steal information
    from the WordPress servers.To get rid of this problem, we can use a tool called
    WPscan to scan WordPress websites.a) First of all, before starting the Wordpress
    scanner test you need to update the system so that there will be no way that any
    outdated vulnerabilities can be found.b) After using the update, you can start
    the real start with the scanner. All you need to do is to enter the Wordpress
    URL that needs to be scanned.Here is the command that needs to be usedexample@
    linuxwar : start wpscan www.exampleweb.comc) In the next step, we can use the
    tool to get the list of users who are present is the Wordpress system. Wordpress
    consists of a directory of systematic users that maintain or a part of that website.
    For this reason, this scanner should be used as an enumeration tool whenever it
    is possible.d) There are also options in the scanner that lets you brute force
    the system for root privilege or stop the enumeration system that is present on
    the website.If you are the owner of a Wordpress website, you can use this tool
    to check the security of your website and if it doesn''t turn out well you need
    to install web server security technologies like cloud fare for an additional
    layer of security mechanisms.websploitWebservers in common consist of directories.
    Directories consist of files. It should be noted that not all directories are
    visible to everyone. These are called hidden directories and can be only visible
    for the root user.Hidden directories consist of sensible configuration files that
    can compromise the system within a very short time. These hidden directories can
    also consist of private password details. We use a web split tool for making a
    cross-examination over the available networks.This software is made of python
    and is free to download from the wget package manager system. After installing,
    start it using the tool name in the Linux shell.Below is the command using apt
    shell command that will install the websploit framework:example@ linuxwar : wget
    websploit'
