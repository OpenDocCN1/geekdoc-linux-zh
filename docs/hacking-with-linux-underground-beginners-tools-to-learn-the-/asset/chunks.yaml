    Web sploit consists of a lot of modules such as wireless and network modules for
    example. It should be remembered that web sploit works in coincidence with the
    Metasploit. Metasploit is an exploit maker tool and can help users insert exploits
    in various files. We will learn about these Metasploit functionalities in detail
    in the last chapter.


    Now we will look at the procedure where hidden directories can be discovered.


    a) Before starting you can filter out the error options to wield out some of the
    most famous errors like `404` error not found.

    b) It is already installed in `Kali Linux` and can be found in the module’s directory.
    The directory scanner module, which is one of the most important modules in the
    `websploit` tool can be used to find out the directories and its syntax forms.


    Below we explain some of the commands that are present in the directory scanner
    module which can be used to scan hidden directories:


    1) **Show** - This command will display all the web modules that are present.
    When hackers deal with a lot of exploits they often get confused and mess up things.
    For this exact reason, web sploit consists of inbuilt modules that are used to
    find vulnerable directories. And this show command can help us find some of these
    for us.

    ```

    example@ linuxwar : show websploit www.exampleweb.com

    ```


    2) **Verbosity** - Verbosity is a simple statement that lets us set the number
    of results that can appear on the Linux shell. When we start searching hidden
    directories usually a lot are found and can make things confusing. To get away
    from this problem we can use verbosity command to display the custom directories.
    There is also an option that will make us look at all the things in a static form.


    3) **RUN** - And the next important command is `RUN` which helps us to run the
    exploits with the websites we desire. We can also use this network transmitting
    system.

    ```

    example@ linuxwar : run websploit www.exampleweb.com

    ```

    When you follow these commands with perfection then there are huge chances of
    websites getting compromised.


    ### Cloud flare web sploit


    We even have a second set of websploit commands that can be used to resolve cloud
    technology. Cloud fire is one of the most important security layers for websites
    and is now maintaining and securing the utmost two million websites from dangerous
    attacks.


    First of all, to use the cloud flare module you need to find for it in the web
    sploit modules list as shown below:

    ```

    example@ linuxwar : websploit select cloudfare www.exampleweb.com

    ```

    Now after getting the interface you can install cloud flare in any of the sample
    websites to check whether it works or not. The working process of cloud fare deals
    with changing the original network address of the system to one of its servers.
    Thus, if there are any injection attacks or brute force attacks it would stop
    or ban that address at once. Cloud fare acts like an intrusion detection system
    for the websites at a very low cost.


    #### Why the cloud flare is still easy to bypass?


    As we said before it just spoofs the attacker with an IP address. Many hackers
    started collecting hundreds of Cloudflare addresses and started to abandon them
    whenever they attack. Some tricks can be still used like using this cloud flare
    scanner to find all the IP addresses that the website hosts with.


    In the next, we will learn about `uniscan` one of the most important web fingerprinting
    tools.


    ### Uniscan


    `Uniscan` is used normally for the remote code execution or remote file insertion
    of the vulnerability scanners. It also can perform network commands like `ping`,
    `traceroute`, `software detection`.


    Here is the command that searches to determine the operating system using the
    `uniscan`:

    ```

    example@ linuxwar : uniscan select domain

    ```

    '
