    Linux building blocks in detail in the next sections starting with user management.User
    Management in Linux Linux offers a lot of options for maintaining its user groups.
    There can be both individual users with only reading abilities and individual
    users with writing ability. Groups can also be used for easy organization of workspaces
    and teams working on different projects on the same server system. Why user management
    matters to Hackers? Before learning in detail about the user management system
    in Linux it makes sense to know why hackers should know this. We will explain
    this in a simple scenario.Assume that an attacker wants to exploit a server system
    of a big software company. He uses simple port scanning at first (we will talk
    about this in later chapters) to find open ports. With the help of open ports,
    he will try to find access to the system. But if he tries to attack an open port,
    he may get detected by system administrators easily. So, to make things easy he
    needs to find user groups with reading abilities and get access to the system. In
    this similar way, professional hackers use the user management system to exploit
    the systems that they got access to. For this reason, a clear understanding of
    the user management system is important for anyone who takes hacking seriously.User
    management system in detail Linux uses a process called usernames to distinguish
    between different users. People can also use a password to protect their accounts. There
    are three types of users in normal in a Linux system which we will describe in
    detail. 1) Normal users:Normal users are the ones who can access their directory
    only. They can''t access other directories, if they are permitted to access other
    directories then they are restricted to write any files. Normal users are given
    a mandatory UID which will help others to recognize the user.2) Root users:Root
    users are the ones who are the administrators of the system. They are called super
    users and have an Id which is 0\. Root users can write and modify any part of
    the file. If a hacker can get access to a root user account, then he can completely
    delete the files that are present. Usually, server administrators are Superusers,
    so it is very tough for hackers to get administrative privileges of a system.3)
    System usersSystem users are not real users but users that are created by the
    programs that are run in the system. For example, when the Chrome browser is started
    certain system processes will start with the name of system Id. It is important
    to track and sort these system IDs for better usage of the user system that Linux
    provides. Below we will give a command that will help us understand the Linux
    user system: linuxexample @ host: systemid 2344Apart from users Linux also offers
    group systems. Groups are important for the management of a huge number of users
    working on the same project. It also helps to organize things in a better way.
    By default, every user in the Linux system belongs to a group. Every group is
    represented by GID in Linux. The only Root user can create groups and organize
    them in a definite way. However, a user can be in one or more groups according
    to specifications. Below we give some commands which can help to know your current
    user ID and group id: linuxexample @ host : get UIDlinuxexample @ host : get GIDAs
    discussed earlier every Linux system account needs a username and password. Passwords,
