    tools](#part0021.xhtml_toc146_Wireless_Network_sniffing_tools)[Conclusion](#part0022.xhtml)IntroductionCongratulations
    on choosing Hacking with Linux: Underground Beginners Tools to Learn the Basics
    of CyberSecurity and Become a Hacker by Breaking into Every Operating System with
    Ethical Linux and Precise Computer Configuration and thank you for doing so.The
    following chapters will discuss hacking with Linux systems in detail. Hacking
    is an art of exploitation and can be used in various useful and dangerous purposes.
    This book helps us to understand hacking concepts in layman terms. Apart from
    a thorough explanation, we will also get an example that will help us to expand
    the horizons of the topic.Hacking is usually complex and may take a lot of time
    to master. As a matter of fact, according to a recent anonymous study, it usually
    takes ten years to become a professional hacker. In the computer industries, there
    is obviously a lot of need for ethical hackers due to various reasons. For these
    reasons, you need to master hacking using Linux for better career opportunities.This
    book delivers a lot of topics in a smooth way. We will first discuss the importance
    of Linux and hacking in detail and then move forward with a lot of concepts.Why
    Linux is used in this book?You may have your reasons to avoid Linux but as far
    as hacking is considered Kali Linux is the best bet you can take. Also, Kali Linux
    is an operating system that is open-source and can work out things in a better
    way, unlike Windows which always block hacking tools via a firewall.How to get
    the most out of this book?This book at first will give a layman explanation to
    the topic and in the next step provide commands so that there will be no misunderstandings
    of the subject. Also, at the end of every chapter, a clear explanation of the
    things we have learned is described. So, do follow it.There are plenty of books
    on this subject on the market, thanks again for choosing this one! Every effort
    was made to ensure it is full of as much useful information as possible, please
    enjoy it!Chapter 1:Introduction to Linux and HackingThis introductory chapter
    in detail will introduce you to the world of Hacking and Linux in detail. Hacking
    is a process to exploit or take control of a system. Whereas Linux is an operating
    system that is used for various tasks that a usual everyday operating system like
    Windows or Mac does. In this chapter, we will give a brief description of hacking
    and how it works along with a brief step by step theoretical introduction on why
    Linux is the best operating system for hackers.Let us start the chapter now with
    a brief introduction to Linux in the next section. Remember to take notes while
    trying to learn this stuff as this is a layman''s introduction to the topic. Try
    to explain the concepts you learned in this book to someone who never studied
    the subject by using your own words to make a good foundation on the subject.
    Let us start now the exciting journey about Hacking using Linux.What is Linux?Linux
    is an operating system that is so much related to UNIX one of the few pioneers
    in the early computing industry. One of the most important things for the success
    of UNIX is its excellent portability. Anyone can obtain the source code and write
    their performing system in back those days unlike commercial operating systems
    like Windows and Mac OS. With the success of UNIX operating systems in the programmer''s
    arena, its creator has started the GNU project to expand the possibilities of
    the project. A lot of programmers enthusiastically participated in this small
    world. Out of those programmers, a college-going student Linux Torvalds has started
    writing his code for the project. And within few months he has released the code
    which got the immediate attention of the other enthusiasts. Due to its robust
    and simplistic nature, Linux has become everyone''s favorite within a short frame
    of time. Its creator has used repositories to let people contribute to the project.
    Within few years Linux has expanded into a level of the commercial operating system
    with the help of thousands of programmers voluntarily contributing the project.From
    then Linux has expanded into various Distros and different editions developed
    by different enthusiasts. At present, Linux is one of the most used software by
    programmers, database experts and most importantly by hackers. In the next section,
    we will discuss in detail the reasons why Linux has become popular? Why is Linux
    the Best Operating System?One of the most important success notions for Linux
    is that it has a great adaptability for server-side systems. Database administrators
    are more comfortable in using command-line interfaces than Graphical user interface
    systems which have become common. Below we will discuss other reasons in detail. 1)
    Open-sourcedLinux is one of the few open-source operating systems that are available.
    It means that anyone can download it for free and can use it to develop custom
    or third-party operating systems, for example like Red hat Linux. 2) Degree of
    Modularity Linux kernel consists of five different parts that can be changed or
    organized according to their actual needs. That is one can select or filter the
    functions that are important for them. This made individual users interact with
    the operating system more comfortable.3) Hardware supportcommercial operating
    systems need to update their hardware support after a few months. Whereas Linux
    operating system gives much before hardware linkage due to its large number of
    contributors that write code independently. Due to this reason, there are a lot
    of hardware systems that only work with Linux.4) SecurityPeople have a misconception
    that open-source systems are prone to vulnerabilities and easy attacks. But this
    works oppositely because Linux has more Authorization and administration security
    features than windows. Users can select their security features in both basic
    and advanced levels. 5) Multi-user & MultitaskingLinux can be used by different
    users and on different levels by the options they select. It doesn''t decrease
    the speed or change the way the system works. Apart from multi-user functionality,
    Linux is also very good at Multitasking. That is performing a lot of tasks in
    the stack.6) High level of portability As we said before Linux systems can be
    connected with any other systems from high-end servers to low-level Arduinos.
    This is the reason why Linux is loved by system programmers to robotic developers. In
    this section, we have given a detailed explanation about Linux and its characteristics
    that made it a favorite and famous operating system. In the next section, we will
    give a brief introduction to hacking and explain in the later section about why
    Linux is the most preferred system by hackers.What is Hacking?Hacking is one of
    the most controversial and creepy terms that has taken over our technological
    generation. A lot of years back when there are telephone lines and are used extensively
    for communication few people tried to exploit these networks of telephone lines
    with a system called phreaking so that they can make calls for free. This is one
    of the first methods of system exploiting that is known in a wide range to programmers
    who are developing software systems.Hackers by a definition mean that people who
    are trying to exploit the system either a network or software or hardware by using
    different techniques either by a program or devices. Hacking has been divided
    into a lot of hierarchies and types which we will discuss in detail in the next
    chapters. But for now, assume that hacking means to exploit systems by code. Who
    are Hackers?Hackers are the individuals who try to exploit systems or understand
    the loopholes in the system to fix them. People always treat hackers as bad guys
    but try to understand that all the security administrators who try to protect
    the billion-dollar servers and databases are also technically called Hackers.
    In the next, we will discuss the most important characteristics of hackers in
    detail.Important Hacking Skills to HaveThis section will in detail explain the
    most important areas where a hacker should be perfect. We will organize these
    characteristics in such a way that it would be easy for the reader to go through
    this book. Let us start! 1) Fundamentals of the operating system they are using.A
    good hacker will always have a sound knowledge about the operating system that
    he is using. It deals with a lot of technical knowledge like memory and process
    management along with a lot of commands that will make the work easier. A lot
    of professional hackers will have a detailed knowledge of the Kernel they are
    working on. So, try to consume the operating system knowledge as deep as you can.2)
    ScriptingA good hacker will always write his programs to automate the tasks that
