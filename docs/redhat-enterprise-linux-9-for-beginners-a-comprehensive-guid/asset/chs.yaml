  ## 第五章：文件的处理与管理


  ### 创建目录和子目录

  我们知道可以通过执行以下命令创建一个空目录：


  ```bash

  mkdir

  ```






  ## 创建目录


  在文件系统的任何位置，都可以创建一个空目录。若要在当前位置以外的地方创建目录，只需提供绝对路径或相对路径即可，例如 `mkdir /tmp/redhat`。无论当前工作目录是什么，前述命令都会在
  `/tmp` 下创建 `redhat` 目录。


  假设你处于家目录，并想在 `issue` 下创建一个子目录，请执行以下命令：

  ```bash

  mkdir redhat/Book/Chapter1

  ```

  在这里，`Book` 是 `redhat` 下的子目录，而 `Chapter1` 同样是 `Book` 的子目录。因此，在这里，目录在用户的家目录下嵌套了 3
  层。


  使用 `mkdir -p` 时，还可以同时创建多级父目录。假设你想创建一个名为 `heading2` 的目录，它嵌套在很深层级，但其父目录序列并不存在，请执行以下命令：

  ```bash

  mkdir -p /home/vishesh/Book/Chapter1/headings/heading1/heading2

  ```

  前述命令将创建创建 `heading2` 子目录路径上所有不存在的父目录。如果所有父目录都已存在，则 `-p` 选项不起作用，并会创建指定的目录。


  要删除一个空目录，可以使用 `rmdir` 命令：

  ```bash

  rmdir path and name

  ```





  要删除一个非空目录，你可以使用 `rm` 命令，我们将在本章稍后的部分介绍它。


  ### 列出目录内容

  要查看目录中存在哪些文件和子目录，使用 `ls` 命令。默认情况下，目录内容按字母顺序显示。要查看文件相关的元数据，你可以在使用 `ls` 命令时使用以下选项：


  - `-a`: 列出隐藏文件，即以点（.）开头的文件

  - `-t`: 按 `ctime`（状态变化）排序显示目录内容，而不是按字母顺序排序，这是默认的显示顺序

  - `-d`: 列出目录本身而不是其内容；你将看到一个单点，它代表目录本身

  - `-i`: 显示每个列出文件的 inode 号（节点号）

  - `-l`: 显示目录内容以及每个文件的许多属性

  - `-r`: 反反顺序显示目录内容

  - `-R`: 递归地列出目录内容；它将列出每个列出目录下的所有子目录和文件；列表将递归地在树结构中向下移动多层，直到列出所有文件为止

  - `-s`: 以块为单位显示每个文件的大小

  - `-S`: 按文件大小排序显示目录内容

  - `-h`: 与其他选项配合使用时，以用户可读的格式显示文件大小

  - `-t`: 按修改时间排序输出；`-t` 指定用于排序列表的时间字段；默认情况下，它按 `mtime`（修改时间）对列表排序

  - `-u`: 显示访问时间

  - `-1`: 每行列出一个文件


  以下是 `ls` 命令最常用的用法：


  ```bash

  $ls -l

  ```

  前述命令在多个字段中显示文件相关信息，如图 ![](img/image-fb1qfine.png) 所示

  带有 `-l` 选项的 `ls` 命令在七个字段中列了一些文件属性


  让我们理解它显示的每个字段。图 5.5 显示了 `ls -l` 命令的默认输出，总共七个字段：


  - **Permission（权限）**: 第一个字段包含与文件相关的权限集合。我们将在下一章学习文件权限。第一个字段第一个字符表示文件类型，正如我们之前学习的那样。这里，`abc`
  是普通文件，因为它包含一个 `-`；`Desktop` 是目录，因为它第一个字符是 `d`。

  - **Hard link（硬链接）**: 第二个字段显示硬链接数。

  - **Owner（所有者）**: 第三个字段显示用户名。

  - **Group（组）**: 第四个字段显示文件的组所有者。

  - **File（文件）**: 下一个字段显示以字节为单位的文件大小。

  - **Date（日期）**: 它以 `mon dd hh:mm` 格式显示文件修改时间的日期，其中 `mon` 是月份的三个字母缩写，`dd` 是两位数的日期，`hh:mm`
  是一天的小时和分钟用冒号分隔。

  - **Name（名称）**: 最后一个字段将显示文件名。如果任何文件具有符号链接，该字段可能会显示扩展输出。


  要查看当前工作目录的信息，请使用 `ls` 配合 `-d` 选项：


  ```bash

  [vishesh@192 redhat]$ cd redhat

  [vishesh@192 redhat]$ ls -ld

  drwxrwxrwx. 3 vishesh vishesh 40 Nov 8 13:14.

  ```

  前述命令显示当前工作目录的信息。它在第一个字段中显示了 `redhat` 目录的权限。第一个字段第一个字符包含 `d`，这清楚输出是一个目录。列出的目录名为单点。接下来的六个字段的解释方式与我们刚刚讨论的普通文件相同。从第二个字段开始，按顺序显示目录的硬链接数、所有者和组所有者、目录大小以及目录修改时间。目录名在最后一个字段中单独列出。


  `ls -h`

  `ls -h` 将显示大小列并带有 `K`、`M` 和 `G` 等单位。通过查看输出，你可以轻松确定哪些文件占用了 GB 级的磁盘空间。


  `ls -li`

  使用 `-i` 选项配合 `ls` 的 `-l` 选项将提供一个额外的列，显示每个列出文件的 inode 号。


  `ls -lc`

  前述命令列出更改时间戳或 `ctime` 字段，而不是默认时间戳。


  `ls -lu`

  前述命令显示访问时间戳而不是默认时间戳。


  要按访问时间列出内容，请使用以下命令：

  ```bash

  ls -ltu

  ```

  要按更改时间列出目录内容，请使用以下命令：

  ```bash

  ls -ltc

  ```


  ### 文件相关操作

  在本节中，我们将看到如何移动、重命名、复制、删除以及压缩或解压缩文件。


  #### 重命名文件和目录

  `mv` 命令可重命名或移动文件到不同位置。重命名或移动文件使用以下语法：


  ```bash

  mv <source> <destination>

  ```

  在这里，`source` 和 `destination` 可以是文件名或目录名，以及它们的访问路径。路径可以是相对路径或绝对路径。


  重命名名为 `abc` 的普通文件只需使用以下命令：


  ```bash

  mv abc xyz

  ```

  前述命令会将 `abc` 重命名为 `xyz`。

  如果 `abc` 是目录，那么该目录将被重命名为 `xyz`，并且 `abc` 的所有内容将移动到 `xyz`。如果 `xyz` 目录已经存在，则连同它的所有内容将被移动到
  `xyz` 下。如果 `abc` 是文件而 `xyz` 是现有目录，则 `abc` 文件将移动到下面。


  现在，将 `abc` 移动到不同的位置，输入以下命令：


  ```bash

  mv abc /tmp/redhat/

  ```

  在这里，`abc` 将移动到 `/tmp/redhat/`。

  如果你想更改 `redhat` 目录下 `abc` 文件的名称，如下所示提供 `abc` 文件的新名称：


  ```bash

  mv abc /tmp/redhat/xyz

  ```

  **Caution**：注意，如果目标文件已存在，`mv` 将覆盖它，因此在使用 `mv` 命令时要小心。


  为了避免静默覆盖目标文件和目录，请使用 `mv` 命令的 `-i` 选项。它会询问你确认是否覆盖现有文件。按下 `y` 或 `n`。


  以下是可配合 `mv` 命令使用的其他选项：

  - `-v`: 开启详细模式；使用 `-v` 配合 `mv` 命令以知道发生了什么。

  - `-u`: 仅当源较新时移动文件。

  - `-i`: 交互模式


  **思考**这两个命令的区别：(i) `mv abc dir` 和 (ii) `mv abc dir/`，如果 `abc` 是目录？


  #### 复制文件和目录

  要将文件从一个位置复制到另一个位置，使用 `cp` 命令。它具有以下语法：


  ```bash

  cp <filename and path> <destination>

  ```

  如果 `abc` 是普通文件，从当前位置复制 `abc` 到另一个位置，使用以下命令：


  ```bash

  cp abc redhat/

  ```

  前述命令会将 `abc` 复制到 `redhat/`。如果源文件不存在，将报错：`cp: cannot access ''abc''`。如果目标目录不存在，将报错：`cp:
  cannot create directory ''redhat/''`。


  `cp` 命令还可以在复制时重命名文件，如下：


  ```bash

  cp abc redhat/xyz

  ```

  在这里，`abc` 文件将复制到 `redhat/` 并具有不同的名称。要从一个位置复制目录到另一个位置，使用相同的语法：


  ```bash

  cp -r <source> <destination>

  ```

  假设你在主目录下有一个 `test` 目录，想将其复制到相同位置的 `redhat` 目录，使用：


  ```bash

  cp -r test redhat/

  ```

  如果 `test` 目录是空的，该命令将成功执行；否则会报错：`cp: -r not specified ''test''`。如果你想复制一个非空目录，使用 `cp`
  的 `-r` 选项：


  ```bash

  cp -r test redhat/

  ```

  执行前述命令后，`test` 目录及其所有内容将复制到 `redhat/`。


  #### 删除文件和目录

  `rm` 命令用于删除任何文件或目录。删除普通文件，使用以下命令：


  ```bash

  rm abc

  ```

  如果 `abc` 是目录，命令将失败并报错：`rm: cannot remove ''abc'': Is a directory`。删除目录，使用 `-r` 选项：


  ```bash

  rm -r abc

  ```

  在无提示的情况下删除非空目录，使用 `-f` 选项：


  ```bash

  rm -rf abc

  ```

  **Caution**：`rm -rf` 命令将进行询问，请谨慎使用。


  #### 比较两个文件

  `diff` 命令用于比较两个文件并显示它们之间的差异。


  ```bash

  diff file1 file2

  ```

  如果文件相同，`diff` 不输出。如果它们不同，它将显示不同的行。你可以使用各种选项来格式化输出：

  - `-n`: 以统一格式输出。

  - `-c`: 列出更改时间 `ctime` 字段而不是默认时间戳。

  - `-u`: 显示访问时间而不是默认时间戳。


  按访问时间查看内容，使用以下命令：


  ```bash

  diff -ltu file1 file2

  ```

  按更改时间查看，使用以下命令：


  ```bash

  diff -ltc file1 file2

  ```


  #### cmp

  `cmp` 命令用于逐字节比较两个文件。它将返回第一个差异字节，如图 5.6 所示。


  ```bash

  cmp file1 file2

  ```

  如果文件相同，`cmp` 不输出。如果不同，它将显示差异行和字节数。


  #### comm

  `comm` 命令对两个已排序的文件逐行比较。它产生三列输出：第一列第一个文件有的，第二列第二个文件有的，第三列两个文件共有。如果文件未排序，将报错：`comm:
  files are not sorted`。在将文件传递给 `comm` 之前必须对其进行排序。


  ```bash

  comm file1 file2

  ```

  要查看两个文件共有的行，使用 `-12` 选项：


  ```bash

  comm -12 file1 file2

  ```

  要仅查看第一个文件有的行，使用 `-1` 选项：


  ```bash

  comm -1 file1 file2

  ```

  要仅查看第二个文件有的行，使用 `-2` 选项：


  ```bash

  comm -2 file1 file2

  ```


  #### 压缩文件

  `zip` 命令用于压缩文件和文件夹。


  ```bash

  zip archive.zip file1

  ```

  `zip` 命令将创建一个名为 `archive.zip` 的存档。压缩目录使用 `-r` 选项：


  ```bash

  zip -r archive.zip directory/

  ```

  解压缩 zip 文件，使用 `unzip` 命令：


  ```bash

  unzip archive.zip

  ```

  `gzip` 命令用于压缩文件。


  ```bash

  gzip file1

  ```

  解压缩 gzip 文件，使用 `gunzip` 命令：


  ```bash

  gunzip file1.gz

  ```

  `tar` 命令用于创建文件和目录的存档。


  ```bash

  tar -cvf archive.tar file1 directory2

  ```

  提取 tar 存档，使用 `-x` 选项：


  ```bash

  tar -xvf archive.tar

  ```

  列出 tar 存档的内容，使用 `-t` 选项：


  ```bash

  tar -tvf archive.tar

  ```


  #### 编辑器：vim

  `vim` 是一个用于编辑各种纯文本文件的编辑器。


  ```bash

  vim filename

  ```

  `vim` 在许多模式下工作：

  - **Normal mode（普通模式）**: 用于导航和执行命令。

  - **Insert mode（插入模式）**: 用于输入文本。按下 `i` 进入插入模式。

  - **Command mode（命令模式）**: 用于编辑命令。按下 `:` 进入命令模式。


  保存文件并退出，使用：


  ```vim

  :wq

  ```

  不保存退出，使用：


  ```vim

  :q!

  ```

  保存文件，使用：


  ```vim

  :w

  ```

  删除一行，使用：


  ```vim

  :dd

  ```

  撤销更改，使用：


  ```vim

  :u

  ```

  复制，使用：


  ```vim

  :y

  ```




  用于在创建或访问归档时指定目录





  排除匹配给定模式的文件。在文件添加到归档后删除这些文件。以下是 `tar` 命令的用法之一：


  ```bash

  tar -A -f book.tar somefile.tar

  ```

  上述命令将 `somefiles.tar` 的内容追加到归档中；它将一个 tar 文件追加到另一个 tar 文件。


  ```bash

  tar --delete backup -f home_vishess.tar

  ```

  上述命令从指定的 tar 文件中删除名为 `backup` 的文件。接下来的命令向已存在的 tar 文件添加一个名为 `newfile` 的新文件：


  ```bash

  tar -r newfile -f home_vishesh.tar

  ```

  要验证新文件的添加，请列出归档内容。接下来的命令在文件添加到归档后删除源文件：


  ```bash

  tar --remove-files -cvf somefile.tar io.out iostat.out

  ```

  上述命令使用当前位置的 `io.out` 和 `iostat.out` 创建一个名为 `somefile.tar` 的归档。在将它们添加到归档后，它们从源位置删除。


  ### 恢复丢失的文件


  在 Linux 系统上工作时，可能会误删许多重要文件。使用 `rm` 命令删除文件是永久的，无法撤销。如果你在 `gnome` 环境下工作并误删了文件，你可以随时从垃圾箱恢复它，但使用
  `rm` 的删除是无法撤销的。你不会在垃圾箱中找到使用 `rm` 删除的文件。如果你有完善的备份系统，可以立即恢复文件，而不会产生太多数据丢失。你可以使用上一节中提到的任何工具来恢复重要文件。如果你的文件系统损坏，可以使用
  `xfs_repair` 实用程序修复 `xfs` 文件系统，或使用 `e2fsck` 实用程序修复 `ext2`、`ext3` 或 `ext4` 文件系统。这些工具已经在第
  2 节“Linux 文件系统”中讨论过。


  每当文件从系统中删除时，它并不会立即从磁盘上删除。如果存储文件数据的区域没有被覆盖，仍然有恢复丢失文件的希望。如果你立即采取行动，就可以找回丢失的文件。作为立即措施，你可以卸载磁盘或停止磁盘上所有的写入操作，并使用
  `TestDisk` 等工具恢复永久删除的文件。该工具的使用超出了本书的范范围。


  ### 使用日志文件（LogFiles）进行故障排除


  日志文件对于系统管理员进行故障排除和调试起着至关的作用。它们是系统发生的事件、操作和错误的记录。因此，为了未来的分析，保护这些文件至关重要。在本节中，我们将讨论如何保护和保留日志文件，以便在需要进行任何故障排除时能够读取和分析它们。


  #### 读取日志


  在早期的章节中，我们讨论了在哪里找到日志文件以及如何查看日志。`systemd-journald` 是 RHEL 9 中默认的日志收集器和管理器。让我们重新回顾查看
  `systemd` 收集日志的命令。`journalctl` 实用程序用于从日志中获取全部日志或选日志。


  在终端上只需输入 `journalctl` 命令即可显示所有收集到的日志条目。要查看与可执行文件相关的日志，例如输入：


  ```bash

  journalctl /usr/sbin/sshd

  ```

  要查看与设备文件相关的日志，例如输入：


  ```bash

  journalctl /dev/sda1

  ```

  要查看当前启动的日志，使用如下的 `-b` 选项：


  ```bash

  journalctl -b

  ```

  要查看上一次启动的日志，输入以下：


  ```bash

  journalctl -b -1

  ```

  要仅检索内核消息，使用以下命令：


  ```bash

  journalctl -k

  ```

  要查看与 `systemd` 单元相关的日志，例如使用如下 `-u` 选项：


  ```bash

  journalctl -u sshd.service

  ```

  要查看与 `crond` 服务相关的日志，输入以下：


  ```bash

  journalctl -u crond.service

  ```

  `journalctl` 还支持许多选项，这对系统管理员分析日志非常有帮助。它们如下：

  - `-g`: 显示匹配给定模式的条目

  - `-p`: 显示具有指定优先级或更高优先级的条目

  - 显示指定设施（facility）的条目

  - `-S`: 显示不早于指定日期的条目

  - `-U`: 显示不晚于指定日期的条目


  你可以通过 `man` 页探索更多 `journalctl` 的用法。


  #### 保留和轮转日志文件


  日志是我们的救救星。当系统管理员想要知道系统问题的原因时，读取和分析可用日志是执行的首要任务。日志文件不仅用于保存系统生成的日志，还可以被开发者用于存储应用程序相关的信息，例如应用程序正在做什么、什么导致了应用程序错误，以及它生成了哪些消息。在需要排除与应用程序相关的问题时，这些数据非常重要。由于日志不断记录系统和用户生成的日志，它们会不断增长，占用大量磁盘空间。打开和检查较大的日志文件变得很繁琐，因此当日志文件大小达到指定阈值时，切换到新的日志文件是有关重要的。旧日志文件可以以归档形式保留在更安全的地方，以便在需要分析时进行检索。每个应用程序都知道要写入的日志文件名称。要开始写入新的日志文件，可以将旧日志文件重命名或移动到更安全的位置，并且新文件必须接收旧日志文件的文件名，以便系统继续向该文件写入。系统在后台为你执行所有操作，使用一个名为
  `logrotate` 的服务单元。当 `logrotate` 通过指定的标准时，它会自动创建一个新文件。旧日志仅会被轮转以创建新的日志。要轮转日志文件，只需通过添加当前时间戳后缀对当前日志文件进行重命名，并创建一个具有原始文件名的新文件。默认情况下，日志文件按指定间隔（如
  `daily`、`weekly`、`monthly` 等）进行轮转。你还可以配置 `logrotate` 在日志文件变大或达到指定大小时进行轮转。在深入研究 `logrotate`
  的配置之前，让我们探索 `/var/log` 目录，该目录存放了重要的系统日志。该目录也保留了轮转后的日志，如图。输入 `ls` 查看 `/var/log` 内部的文件是如何轮转的。


  #### 理解 logrotate


  `logrotate` 设计用于简化日志管理。它允许对日志文件进行自动轮转、压缩、删除和归档。它们被归档以便在需要时可以参考。`logrotate` 的主配置文件是
  `/etc/logrotate.conf`。该文件中的设置决定了应用于所有日志文件的全局设置。要覆盖任何日志文件的设置，请将相关的配置文件放在 `/etc/logrotate.d`
  目录中。该目录用于存放应用程序特定的配置文件。应用程序特定文件中的设置会覆盖主文件中的相同设置。


  # 第 17 章 Web 服务器和数据库服务器


  #### 简介


  Apache HTTP Server 是由 Apache 基金会支持的一个协作项目。Apache HTTP Server 也称为 `httpd`。它是一个开源跨平台的
  Web 服务器软件，用于托管网站并向互联网用户提供 Web 内容。它是一种广受欢迎的 Web 服务器，因为它可以在多个平台之间工作。通过添加模块，就可以增强 Apache
  Web 服务器提供的功能。本节将讨论 `httpd` 服务器的安装及其配置。


  （此处省略安装与配置部分的重复性码逻辑）


  RHEL 9.0 包含了 Apache HTTP Server。你可以使用我们之前创建的仓库安装它。执行以下命令进行安装：


  ```bash

  dnf install httpd

  ```

  正如我们所知，它会自动解析包依赖并安装 `httpd` 以及所有未安装的依赖项，如图。图 17.1 显示将安装 HTTP 版本 2.4.51。在列出所有依赖包后，它将显示此安装将占用的总大小和安装大小。在提示确认时按
  `y` 将安装 Apache httpd。


  要验证安装的 `httpd` 版本，使用以下命令：


  ```bash

  httpd -v

  Server version: Apache/2.4.51 (Red Hat Enterprise Linux)

  Server built: Mar 21 2022 00:00:00

  ```


