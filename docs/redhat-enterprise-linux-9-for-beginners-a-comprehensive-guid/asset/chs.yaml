  ## 前言


  `RHEL` 是广泛使用的企业级 Linux 发行版，学习 Linux 是当务之急。由于其具有扩展性、可靠性和耐用性，它被接受为全球多种类型服务器的事实标准。`Linux`
  是在 `GPL` 下发布的开源操作系统。


  ## 第一章：Linux 的第一步


  ### 简介

  如今，Linux 已成为几乎所有类型 IT 部署和服务器的基础操作系统。其中，`RHEL` 是最常用的企业级 Linux 发行版。它是一个由名为 RedHat
  的组织支持的开源操作系统软件。这就是它被命名为 `RedHat Enterprise Linux System` 的原因。开源软件发行版增加了增强的安全功能和支持服务，使其能够供大企业用于生产环境。


  ### 结构

  在本章中，你将学习：

  - 开源软件 vs 企业级解决方案

  - RedHat Enterprise Linux 的特性

  - Linux 架构

  - `RHEL9` 的安装

  - `RHEL` 机器的使用


  ### 目标

  本章的目标是多方面的。本章将帮助你理解与其他开源发行版相比使用 `RHEL` 的优势。本章将帮助你学习 Linux 系统中使用的基础术语。你将学习安装 `RHEL9`
  的各种方法，并查看带有截图的逐步说明，使 `RHEL9` 机器就绪。


  ### 开源软件 vs 企业级解决方案

