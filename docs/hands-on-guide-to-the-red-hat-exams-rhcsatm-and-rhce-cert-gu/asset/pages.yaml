- img_proc: true
  md: 'While locking down the number of hosts that can access a particular server,
    you don''t want to go crazy either; otherwise, you''ll end up with a management
    nightmare! A common solution in the real world is to use the domain name in which
    servers and clients are members to provide with basic management. You can restrict
    it to hosts from particular domains with the following:


    ```

    sshd : .example.com

    ```


    With this line in your /etc/hosts.allow file, you allow any system on the example.com
    domain to access this. When troubleshooting TCP Wrappers, you can use the /var/log/secure
    file to view any information that is recorded. It helps you determine if something
    is wrong or being blocked for a specific reason. You should not use TCP Wrappers
    as your only line of security because there are ways to fool it; however, it is
    a great layer of security. Combined with a firewall and SELLinux, TCP Wrappers
    is a nice addition to hardening your servers.


    # EXAM TIP


    When taking the exam, make sure that you remember the order in which TCP Wrappers
    applies rules. This information is really helpful when troubleshooting issues
    with system access.


    # Firewall Rules Using iptables


    Most people think that having a firewall at the edge of their network will protect
    them from everything. This notion couldn''t be more wrong, but having a host-based
    firewall helps increase your system and network''s security. By default, Red Hat
    has a built-in firewall called iptables, is enabled by default as well. Managing
    the firewall is essential because many services depend on being able to interact
    with the outside world or the rest of your network. Because the firewall is set
    up by default, you don''t need to install it, but you should verify that the package
    is installed anyway.


    +   Step 1. Verify the installation:


    ```

    # rpm -qa | grep iptables

    iptables-ipv6-1.4.7-3.el6.x86_64

    iptables-1.4.7-3.el6.x86_64

    ```


    +   Step 2. You should also take a moment to verify that iptables is set to start
    when the system boots up:


    ```

    # chkconfig iptables --list

    iptables 0:off 1:off 2:on 3:on 4:on 5:on

    6:off

    ```'
