  md: '# MIGRATION TIP


    For RHEL5, you need to disable the SELinux service protection to be able to utilize
    basic web services.


    **Step 1.** Query for the Boolean value you need to change:


    ```

    # getsebool -a | grep httpd_dis

    httpd_disable_trans  --> off

    ```


    **Step 2.** Disable the SELinux protection:


    ```

    # setsebool -P httpd_disable_trans=1

    ```


    **Step 3.** Verify that the Boolean has changed:


    ```

    # getsebool -a | grep httpd_dis

    httpd_disable_trans  --> on

    ```


    When you''re working with web services, there is an additional requirement when
    it comes to SELinux. Apache may use file contexts of the different web content
    because the context of any newly created directory needs to be set for the web
    user to be able to access properly. For example, suppose you create the following
    two directories to hold your customer websites.


    **Step 1.** Create the customer directories:


    ```

    # mkdir /var/www/site1

    # mkdir /var/www/site2

    ```


    **Step 2.** Check the current context of the files:


    ```

    # ls -Z /var/www

    drwxr-xr-x. root root system_u:object_r:httpd_sys_script_exec_t:s0 cgi-bin

    drwxr-xr-x. root root system_u:object_r:httpd_sys_content_t:s0 error

    drwxr-xr-x. root root system_u:object_r:httpd_sys_content_t:s0 html

    drwxr-xr-x. root root system_u:object_r:httpd_content_t:s0 icons

    drwxr-xr-x. root root unconfined:object_r:httpd_sys_content_t:s0 site1

    drwxr-xr-x. root root unconfined:object_r:httpd_sys_content_t:s0 site2

    ```


    You can change the context of the customer sites to match the default site (the
    html directory).


    **Step 3.** Use the chcon to change the context of the user and domain:


    ```

    # chcon -Rvu system_u site1

    changing security context of ''site1''

    ```


    ```

    # chcon -Rvu system_u site1

    changing security context of ''site1''

    ```'
