    # Post Install


    One great benefit of using the kickstart is that you can have your kickstart file
    execute scripts upon the completion of your system. At the end of your kickstart
    file, you would define a %post section. Anything in the %post section is treated
    as if you were typing it at the console of a system. You can perform customizations
    or execute other scripts for further configuration of your system.

    While %post is usually a more useful section because the system is already installed,
    you should know that there is also a %pre section that is executed before the
    installation begins.


    # Advanced Partitioning


    Kickstart also enables you to create more advanced partitions. In the kickstart
    file, you need to use the commands outlined in the web page mentioned earlier
    to carve out drives and create your advanced partitions. As an example, let''s
    create some LVM partitions for the client.


