    }\n```\n\nAgain, let's look at each of these options and what they do:\n\n+  \
    \ - option host-name Defines the fully qualified domain name of the client\n\n\
    +   - hardware ethernet Defines the MAC address of the client\n\n+   - fixed-address\
    \ Specifies the IP address that you want the client to receive\n\nThese three\
    \ options are defined in a host subsection, just like you defined a subnet earlier.\
    \ The DHCP server offers a particularly nice feature built into the startup scripts;\
    \ it can check the syntax of your config file for errors. This capability is nice\
    \ because prior to actually starting the service, you can check to make sure nothing\
    \ is set incorrectly.\n\nCheck the config file for any errors:\n\n```\n# service\
    \ dhcpd configtest\nSyntax: OK\n```\n\nIf the DHCP service finds errors, it attempts\
    \ to tell you which in the config file the error exists. Open your config file\
    \ and remove the brace }) that ends the network section. Save your config file\
    \ and run the syntax check on your config file again:\n\n```\n# service dhcpd\
    \ configtest\nInternet Systems Consortium DHCP Server V3.0.5-RedHat\nCopyright\
    \ 2004-2006 Internet Systems Consortium.\nAll rights reserved.\nFor info, please\
    \ visit http://www.isc.org/sw/dhcp/\n/etc/dhcpd.conf line 18: unexpected end of\
    \ file\n```\n\nConfiguration file errors encountered exiting"
