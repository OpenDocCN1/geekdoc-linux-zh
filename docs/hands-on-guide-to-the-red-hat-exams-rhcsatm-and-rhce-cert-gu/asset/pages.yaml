    Let''s now focus to FTP host-based and user-based security.


    # FTP Security


    After you configure SELinux properly for the vsftpd service, you should also configure
    some basic security. When dealing with security for FTP, you can run into a little
    trouble if you don''t plan things ahead of time.


    The FTP protocol supports two different types of file transfers. The first is
    active mode, which uses port 20 to connect back to the client. The second is known
    as passive mode, which uses a custom-defined range of ports above 1024. Because
    there are two modes for FTP, you need to decide which mode you want to use so
    that you can configure the correct security settings and open the correct ports
    on the firewall. Back in the configuration section, the option connect_from_port_20
    is set to YES by default. This means that, by default, active mode is used for
    the vsftpd service.


    Let''s look at some other options that can be used for basic security. You can
    disable the anonymous_enable option to prevent unauthorized users from accessing
    the FTP server. The local_enable option, which is enabled by default, allows local
    system users to log in to the FTP server. Keeping this is usually safe option
    so that you don''t need to maintain a second list of users that you want to be
    able to log in to the FTP server.


    There is one other security step you should take for the FTP server. The userlist_enable
    option, which is set to YES by default, allows the vsftpd service to consult the
    /etc/vsftpd/user_list file. When this option is used in conjunction with the userlist_deny
    option, all users in this file are denied access to the server and not prompted
    for a password. If you want to change this setting, you could set the userlist_deny
    option to NO. Then all users except those listed in /etc/vsftpd/user_list are
    denied access. This setting is useful if you only select individuals to be able
    to log in and not all your system users.


    Here is what the file contains by default:


    ```

    # cat user_list

    # vsftpd userlist

    # If userlist_deny=NO, only allow users in this file

    # If userlist_deny=YES (default), never allow users in this file, and

    # do not prompt for a password.

    # Note that the default vsftpd pam config also checks /etc/vsftpd/ftpusers

    # for users that are denied.

    ```'
