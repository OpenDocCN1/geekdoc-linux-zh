  md: 'Chapter 7: User Administration 207


    # REAL-WORLD TIP


    You can log in to the root user account using the su command with no parameters.
    So what is the difference between su and su -? The su command moves you into the
    root user''s account without initializing any of root''s path or shell variables.
    When you use su -, everything is initialized as if you were logging in from the
    console.


    After you enter the root password, you are logged in the root user. Suppose, however,
    that you don''t want to become the root user, but you need to run a command with
    elevated privileges for it to work. You can use the sudo command to run a single
    command as root. For example, only the root user can create users. To create a
    new user with a normal user account, you can use the following command:


    ```

    # sudo useradd username

    ```


    To help determine which user you are logged in, look at the command prompt. You
    can always tell that you are the root user if the command prompt starts with a
    # instead of $, which means you are a normal user.


    By now, you should be an expert in user management! We have covered user creation,
    modification, and deletion. User management is crucial to working with Red Hat
    or any Linux distribution for that matter. Make sure you are comfortable working
    with users and groups for the Red Hat exams. Many system administrators create
    scripts for user creation because this process requires customization and usually
    follows a standard.


    # User Account Initialization


    In the previous section, we discussed creating users and groups. Now let''s look
    a little deeper at what happens during this creation process and how it can be
    customized. When a user is created, everything from the /etc/skel directory is
    copied to the user''s newly created home directory (/home/<username>). You can
    modify these “skeleton” files or add any custom files. The benefit here is that
    user creation becomes standardized, ensuring that policies are adhered to. The
    customizable files are broken down into two different sections: user-specific
    files and system-wide settings.


    # User-Specific Files


    After a user is created and his home directory is populated, that user can now
    customize those files to fit his own personal needs. For example, the user might
    like to'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# 208 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and
    Lab Manual


    have certain PATH values or specific environment variables set. The following
    three files allow a user to customize the login experience to his own style:


    +   ~/.bashrc Functions and aliases


    +   ~/.bash_profile Sets environment variables


    +   ~/.bash_logout Defines any commands that should be executed before the user
    logs out


    Editing these files allows each user to be unique in how he operates. Because
    each file is stored in the user''s home directory, that file is limited to that
    single user. What happens, though, if there is a standard that you''d like set
    when users start out? Glad asked.


    # Global User Configuration


    Just as in the /etc/skeleton directory


    +   /etc/bashrc Defines functions and aliases


    +   /etc/profile Sets environment variables


    +   /etc/profile.d Specifies a directory that contains scripts that are called
    by the /etc/profile file


    These files help make sure that your users receive everything they need when they
    get started. If you require that settings be changed for your users, customizing
