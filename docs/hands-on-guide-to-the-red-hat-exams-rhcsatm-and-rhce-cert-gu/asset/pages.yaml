- img_proc: true
  md: 'During boot, the /etc/rc.d/init.d/iptables script executes and starts the iptables
    service with the rules found in /etc/sysconfig/iptables. There are a few issues
    that you should understand before we jump into any examples. The iptables command
    is actually the tool used to manage a networking subsystem within the Linux kernel
    called netfilter. This subsystem is used to filter packets at different levels
    and is what actually implements the firewall portion.


    # Configuring iptables


    To start, let''s look at the syntax for iptables.


    Syntax: iptables [options] [chain] -j [target]


    Options:


    +   - A chain Appends to the chain

    -D chain Deletes from the chain

    -I chain Inserts into the chain

    -L chain Lists all rules

    -p proto Uses the protocol specified

    - m match Matches the extended expression

    -s address Defines a source address

    -d address Defines a destination address


    Chains:


    +   - INPUT Packets coming into the system

    - OUTPUT Packets leaving the system

    - FORWARD Incoming packets that should be forwarded


    Targets:


    +   - ACCEPT Allows the packets

    - DROP Drops the packets and gives no response

    - REJECT Rejects the packets and sends a rejection response


    First, note that these are not all the options; however, they are the most commonly
    used and are absolutely necessary to work with services on the system.'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'When you’re defining an iptables rule, there are a few factors to take into
    consideration: which direction the packet is heading, the action that should be
    taken, the protocol in use, and the port being used. You can create your own chains
    from the ones listed here, which is what Red Hat has done for its version of Linux.
    The default INPUT chain for Red Hat is INPUT.


    # EXAM TIP


    Before you start configuring rules, you can view any existing firewall rules with


    ```

    # iptables --list

    ```


    The reason it is not used here is that RHEL6 has no firewall rules except for
    incoming SSH connections by default.


    # MIGRATION TIP


    For RHEL5, the default INPUT chain is actually RH-Firewall-1-INPUT.


    Let’s look at a basic iptables example to see how a rule is created.

    Allow SSH connections over TCP port 22:


    ```

    # iptables -I INPUT -p tcp -m tcp --dport 22 -j ACCEPT

    ```


    Breaking down this rule, you can see that it is inserting this rule (I); using
    the default Red Hat input chain (INPUT); matching only TCP connections (-m tcp);
    using the TCP protocol (-p tcp); looking for incoming connections on port 22 (-dport
    22); and, if a packet is found, jumping (-) to the acceptance chain (ACCEPT) to
    allow the packet. In terms, this rule allows TCP connections on port 22 of this
    system. After you work with a few rules, creating firewall rules will become easier.
    I chose this rule for a particular reason: because it is a rule you will use all
    the time.


    The SSH service, which is discussed in Chapter 13, “Remote Access,” is used heavily
    in the Linux world to remotely administer servers. You need a firewall rule to
    allow incoming connections to your system to be able to connect remotely, and
    the preceding rule does just that.


    # REAL-WORLD TIP


    Here is a great tip to use when working with iptables and firewall rules. Suppose
    you are testing rules for a remote location and you accidentally lock yourself
    out. Do you really want to explain to your boss why you need to take tomorrow
    off to fly'
  merge: -1
