  md: 'As an example, you can use the following two locations to export to the clients:


    /home The home directory containing your users'' data

    /opt/company_data The directory created earlier in the book that holds company
    data


    # Step 4. Set up your exports in the /etc/exports files to be available to any
    client on the network:


    ```

    # nano /etc/exports  *(ro,sync)

    /home

    /opt/company_data  *(rw,sync)

    ```


    Here, you define two resources that you will make available. The first line defines
    the /home directory to be exported and allows read-only access to all clients.
    The second line provide the /opt/company_data directory to all clients with read
    and write permissions. After finishing defining all the resources you want to
    export, save and close the file.


