  md: "over your network. To help with this situation, BIND allows you to create an\
    \ ACL that controls access and allows the use of a “name” instead of IP addresses\
    \ and subnets.\n\n# Step 1. Define an ACL directive:\n\n```\nacl \"home-lab\"\
    \ { 127.0.0.1; 172.168.1.0/24 };\nacl \"local-srv\" { 127.0.0.1; 172.168.1.1;\
    \ };\nacl \"slave-srv\" { 172.168.1.1; };\n```\n\nNow you can replace these directives\
    \ within the /etc/named.conf file for easier use.\n\nNow here is part of the /etc/named.conf\
    \ file reworked:\n\n```\n/* Global options for the BIND Server */\noptions {\n\
    \    listen-on port 53 { local-srv };\n    allow-query { home-lab };\n\n    allow-transfer\
    \ { slave-srv };\n\n    directory \"/var/named\"; // the default\n    dump-file\
    \ \"data/cache_dump.db\";\n    statistics-file \"data/named_stats.txt\";\n   \
    \ statistics-file \"data/named_mem_stats.txt\";\n};\n```\n\nNow that you have\
    \ configured some additional options, you can move on file ownership to secure\
    \ the BIND server. All the files should be owned by the named user, which runs\
    \ as a system user.\n\n# Step 2. After finish configuring all the files and zones\
    \ you need, you can simply use the following commands:\n\n```\n# chown root:named\
    \ /etc/named/*\n# chown root:named /var/named/*\n```\n\nAll the files that relate\
    \ to the BIND setup should now be owned correctly. To take it first step, you\
    \ could use an additional SELinux step to lock down the main config file. If you\
    \ change the SELinux context of the main config file, only the named user is able\
    \ to have access to it.\n\n# Step 3. To change the context, do the following:\n\
    \n```\n# chcon -t named_conf_t named.conf\n```\n\nAnother piece of BIND security\
    \ that we discuss is rnd for local management of your DNS server. Although it\
    \ is included with the installation of the BIND package, you have to do a few\
    \ things to set it up correctly. First, you need to include a line in your /etc/named.conf"
