    # Troubleshooting DHCP


    Not all configurations go smoothly as you might like. When you''re troubleshooting
    the DHCP server, there are a few things to watch out for. For example, in the
    main config file, /etc/dhcpd.conf, make sure that you end all your options with
    a semicolon (;). If you don''t, the service throws an error when you check the
    config file. Also, make sure that you test the DHCP server after the firewall
    rules are in place. For client troubleshooting, the DHCP server provides a client
    leases file. This file contains all the lease information about each client that
    has obtained an IP address from the server. When you have a client that has a
