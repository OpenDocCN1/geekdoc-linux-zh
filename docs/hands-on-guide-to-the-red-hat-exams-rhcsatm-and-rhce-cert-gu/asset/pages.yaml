  md: '# Step 2. Using the sysctl command, change the option:


    ```

    # sysctl -w net.ipv4.ip_forward=1

    net.ipv4.ip_forward = 1

    ```


    Note there is no whitespace between the parameter, equal sign, or value.

    Verify that the value has changed:


    ```

    # sysctl -a | grep net.ipv4.ip_forward

    net.ipv4.ip_forward = 1

    ```


    You can see that the value has indeed been changed. Because you shouldn''t mess
    with the system settings at the moment, you can change the value back or reboot
    the system so that the original value is restored.

    Step 4. Return the parameter to its original value:


    ```

    # sysctl -w net.ipv4.ip_forward=0

    net.ipv4.ip_forward = 0

    ```


    An alternative to adding options to the /etc/sysctl.conf file would be to compile
    a custom kernel. This would include the custom parameters in the kernel permanently
    so that they don''t need to be set automatically at boot time. You can also remove
    options that you aren''t using and give your system better performance. Compiling
    a kernel is not an easy task and is also not part of the Red Hat exams. There
    are some great books and online documentation available, though, if you are interested.


    # Summary


    Although customization and compiling custom kernels are something you are not
    likely to see on the Red Hat exam, you should be comfortable with updating a kernel
    and ensuring that the system survives a reboot. You should also be comfortable
    tuning kernel parameters via the /proc/sys file system. If you find yourself looking
    for better performance or wanting to learn some more advanced usage of the kernel,
    I suggest you compile a kernel for yourself on the lab system. Just remember that
    this is not a simple task and takes time to get.'
