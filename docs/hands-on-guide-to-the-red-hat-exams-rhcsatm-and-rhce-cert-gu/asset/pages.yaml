  md: '# System Logging, Monitoring, and Automation


    How do you know when something goes wrong on your system? You look at the logs,
    of course! In all seriousness, understanding system logging is important so that
    you can troubleshoot when something goes wrong. Logs are kept for almost everything
    that you can think of, including the kernel, boot process, and different services
    that are running. Aside from logs, there are also utilities you can use to monitor
    and check the status of your system. This chapter looks at how you can use these
    tools and logging to troubleshoot anything that is thrown your way. The chapter
    also touches on how to automate some of these tasks.


    # Working with Syslog


    Whenever something goes wrong—and sometimes when things go right—on the system,
    a message is generated by the syslog service. These messages are used to keep
    track of how the system is performing, what actions are taking place, and if there
    is a problem with something. Red Hat comes with a syslog service built in and
    already set to start at boot. In RHEL6, the syslog package is installed by default
    and is the primary logging service used.


    > MIGRATION TIP

    In RHEL5, the default logging service was split between two daemons: syslog and
    klogd. Syslog was used for system messages and klogd for kernel messages. In RHEL6,
    these have both been replaced with the syslog daemon, which handles both types
    of messages. If you are still on RHEL5, you can install the syslogd package.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and Lab
    Manual


    The rsyslog service has a main config file,/etc/rsyslog.conf, that controls where
    messages are sent when they are generated. Logging is a critical piece of the
    operating system, it is installed by default as part of the core packages.


    **Step 1.** Just out of good habit, you should verify that the package is installed:


    ```

    # rpm -qa | grep syslog

    rsyslog-4.6.2-2.el6.x86_64

