  md: '# REAL-WORLD TIP


    The default LogLevel is set to warn, but you can change it to info or debug to
    see detailed information about what is going on. Be very careful when changing
    this, though, because it can produce a huge amount of data and negatively impact
    your system or lock it entirely.


    Another useful tool to troubleshoot web server issues is the elinks browser. This
    text-based browser lets you easily check websites. To make use of this utility,
    you need to install an additional package.


    +   Step 1. Install the required package:


    ```

    # yum install -y elinks

