    # Task 3 – System Services


    Perform the following system service-related actions:


    +   **Step 1.** On all systems in your lab, make sure that the SSH service (sshd)
    starts when the system boots.


    +   **Step 2.** On Client01, prevent the YUM updater (yum-updatesd) service from
    starting when the system boots.'
