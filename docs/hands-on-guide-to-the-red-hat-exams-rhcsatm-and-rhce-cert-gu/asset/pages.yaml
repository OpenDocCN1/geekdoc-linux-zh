  md: '# Step 8. Should something go seriously wrong and you need to take the RAID
    array offline completely, you can use the following command:


    ```

    # mdadm -vS /dev/md0

    mdadm: stopped /dev/md0

    ```


    You might also want to take an array offline to perform some maintenance on the
    file system. After you finishing all changes, you can bring the array back online.
    Now your array is ready for use just like any other disk. You can format it and
    create a file system just as you would a regular partition (except you point to
    /dev/md0 instead of a single partition).


    # Deleting a RAID Array


    Now that you have successfully implemented a RAID array, you can take it apart
    by deleting the array.


    Step 1. To delete an array, first stop it:


    ```

    # mdadm -vS /dev/md0

    mdadm: stopped /dev/md0

    ```


    Step 2. Then remove the RAID array device:


    ```

    # mdadm - remove /dev/md0

    ```


    You should also remove the partitions created for the RAID array. If you forget
    how, refer to the section "Deleting a Partition," earlier in the chapter on how
    to delete partitions. Don''t forget to use fdisk (parted) to verify that the partitions
    have been removed successfully.


    > WARNING: When you are creating RAID arrays, there is only one restriction to
    them. The /boot partition that contains the files necessary to boot the system
    can be located only on a RAID 1 or basic partition. The reason is that the bootloader
    (GRUB) understands how to handle only RAID 1 and basic partitions. If you try
    to create the /boot partition on a RAID 5 array, you get an error message.'
