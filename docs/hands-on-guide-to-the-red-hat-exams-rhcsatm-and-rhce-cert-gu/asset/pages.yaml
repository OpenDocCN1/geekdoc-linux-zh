    # Configuring NFS


    The n and rpcbind services both control a number of daemons on the system

    when they are started. Let''s look at the different daemons these two services
    are

    composed of:


    +   - rpcbind Forwards incoming requests to the appropriate service

    - rpc.idmapd Maps the UID and GID to users and groups

    - rpc.lockd Manages file locks and releases in case of client disconnect

    - rpc.nfsd Responds to client requests for file access

    - rpc.quota Provides Statistics on disk quotas to clients

    - rpc.statd Works with rpc.lockd to provide recovery services


    Let''s also look at the config files that you will be dealing:

    /etc/sysconfig/nfs Contains the main config files for the NFS service

    /etc/exports Contains a list of resources that will be exported (made available)
    to clients


    Here are some additional files that you will use when working with NFS:

    /var/lib/nfs/etc Contains a list of currently exported resources

    /var/lib/nfs/rmatab Contains a list of remotely mounted resources


    For the first configuration step, you need to make a few changes to the main con-fig
    file.


    Step 1. Open the main config file for editing:

    # nano /etc/sysconfig/nfs'
  merge: -1
  pgno: 385
- img_proc: true
  md: '# 354 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and
    Lab Manual


    Step 2. Uncomment the following lines:


    ```

    MOUNT_NFS_V1="no"

    MOUNT_NFS_V2="no"

    MOUNT_NFS_V3="no"


    RPCNFCSDSARGS="-N 2 -N 3"

    ```


    The first three lines disable the mount daemon from accepting anything version
    4. The last line disables the NFS service from even advertising anything that
    version 4 as well.


    # MIGRATION TIP


    If you are still on RHEL5, there is an unresolved bug that causes strange errors
    if you disable all versions of the mount daemon from being advertised. For RHEL5,
    I recommend uncommenting only the following lines:


    ```

    MOUNT_NFS_V1="no"

    MOUNT_NFS_V2="no"

    ```


    Step 3. Save the file and exit.


    Next, let''s work with the /etc/exports file because this defines what resources
    will be available to your clients. If the file doesn''t exist, you can create
    it. The syntax of the /etc/exports file is

    <mountpoint><host><permissions/options>>


    > WARNING: Notice there is no space between the <host> field and the <permissions/options>
    field. If you include a space, you receive a syntax error and the resource will
    not export properly.


    Mount Options:


    | rw | Sets read/write permissions |

    | ro | Sets read-only permissions |

    | insecure | Allows the use of ports over 1024 |

    | sync | Specifies that all changes must be written to disk before a command completes
    |

    | no_wdelay | Forces the writing of changes immediately (useful for logs if something
    crashes) |

    | root_squash | Prevents root users |'
