  md: '# 60 Hands-on Guide to the Red Hat®: RHCS™ and RHCE® Cert Guide and Lab Manual


    the correct time, or something more complex, as sharing a file system over the
    entire network for your users NFS. Knowing how to manage services is a big part
    of the Red Hat exams (as defined by the Red Hat Prep Guide), but it is also a
    critical system administrator skill in the real world. In Linux, services are
    also called daemons. The reason for this is that some services are actually composed
    of multiple daemons. One example of this is NFS, which you see in Chapter 15,
    "NFS." You can usually tell if something is a daemon because it (the service name)
    ends in a d. An example of this would be the SSH service (sshd) or the Apache
    web service (httpd).


    Let’s look again at the different runlevels and how they deal with services during
    the boot process. The preceding section showed by moving the system into runlevel
    3, why don''t we start looking in the /etc/rc.d/rc3.d directory which correlates
    to runlevel 3:


    ```

    # /etc/rc.d/rc3.d/

    K01dnsmas K08ibasm K09pand S08iptables

    02avahi-dnscconf K05netconsole K08redis S08cmstrans

    K02NetworkManager K06prcvcgssd K91kapi S09isndn

    K02oddjobd K73yybnd K99readahead_later S10network

    K05conman K74nscd S00microcode_ctl S11auditd

    K05sslaudauth K08mddmp S02imv2-monitor S12restorecord

    K10apsack K07multipath S04readahead_early S12syslog

    K10tcd K08wpa_supplicant S05kuzdu S13irbalance

    K20infs K09wound S06cpuspeed S13portmap

    K24irda K08netplug S01|iptables S14insflock

    ```


    You would know these are all soft links to scripts on the system, usually within
    the /etc/rc.d/init directory. You can also see from the output that each link
    has an interesting syntax. The syntax is something like


    ```

    [K|S]##serviceName

    ```


    The K stands for Kill and the S stands for Start. The ## are any number between
    01 and 99, including duplicates. Finally, there is the name of the service. When
    you pull all this together, you get a listing of every service that is stopped
    (K) or started ($) when the system enters runlevel 3. The numbers indicate the
    order in which a service is stopped or started, with all Kills processed first
    (in numerical order from 1 to 99), and then all Starts being processed second
    (in numerical order from 1 to 99). If the number order is the same, the alphabetical
    sort dictates the order.


    Now suppose you have the following services listed in your directory:


    +   - K15httpd

    - S10network

    - S55sshd'
