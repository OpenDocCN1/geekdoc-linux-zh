  md: '# 394 Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and
    Lab Manual


    At this point, you need to decide what type of DNS server you would like to set
    up. According to Red Hat, there are two types of nameservers:


    +   - Authoritative—These nameservers answer resource records that are part of
    their zones only. This includes both primary (master) and secondary (slave) nameservers.


    +   - Recursive—These nameservers offer resolution services but are not authoritative
    for any zone. All queries are cached in memory for a fixed period of time.


    There is another way you classify nameservers:


    +   - Master—This nameserver stores original and authoritative zone records for
    a particular namespace. It also answers queries about the namespace from other
    nameservers. Each domain must have at least one master.


    +   - Slave—Although this nameserver receives its namespace information from a
    master nameserver, this nameserver type can answer queries for which it has authority.
    Used for load balancing and redundancy.


    +   - Caching—This nameserver has no authority and is primarily used for name-to-IP
    resolution. All resolutions are cached for a fixed period of time. Heavily used
    by Internet providers (ISPs).


    +   - Forwarding—This nameserver has no authority and is used only to forward
    requests to specific nameservers for resolution.


    Each domain for which your server has authority is called a zone and the information
    for that zone is kept in ..zone files. The DNS server requires an additional package
    to be installed, let''s start by setting up a master DNS server and its first
    zone. Each zone file also requires that you use the fully qualified domain name
    (FQDN) when defining hostnames. Although we usually address the configuration
    first, let''s look the SELinux and firewall requirements instead because the configuration
    of BIND can become complex.


    # Firewall and SELinux Configuration


    For your clients to query the DNS server, you need to open a single port on the
    firewall, but for both protocols. The DNS clients can use both TCP and UDP port
    53.


    **Step 1.** Use the iptables to create your firewall rules:


    ```

    # iptables -I INPUT 5 -p udp -m --dport 53 -j ACCEPT

    # iptables -I INPUT 5 -p tcp -m --dport 53 -j ACCEPT

    ```


    **Step 2.** Save the rules you just created:


    ```

    # service iptables save

    Saving firewall rules to /etc/sysconfig/iptables:  [ OK ]

    ```'
  merge: -1
  pgno: 426
- img_proc: true
  md: '# Step 3. Restart the firewall service for the changes to take effect:


    ```

    # service iptables restart

    iptables: Flushing firewall rules:      [ OK ]

    iptables: Setting chains to policy ACCEPT: filter [ OK ]

    iptables: Unloading modules:           [ OK ]

    iptables: Applying firewall rules:      [ OK ]

    ```


    For the DNS server, there is only a single SELinux Boolean value that you can
    change:


    ```

    named_write_master_zones      Allow zone files to be written

    ```


    If you would to have a dynamic DNS server or allow zone transfers, you

    need to disable this value; otherwise, you can leave the default protection as
    is.


    # MIGRATION TIP


    In RHEL5, an additional SELinux Boolean provides protection to the DNS server.

    You need to adjust it for the DNS service to work properly.


    # Step 1. Query for the Boolean value that you need to change:


    ```

    # getsebool -a | grep named_dis

    named_disable_trans --> off

    ```


    # Step 2. Disable the SELinux protection:


    ```

    # getsebool -P named_disable_trans=1

    ```


    # Step 3. Verify that the Boolean has changed:


    ```

    # getsebool -a | grep named_dis

    named_disable_trans --> on

    ```


    > TIP: For additional security, you can set SELinux to allow only the named system

    user to be able to read the /etc/named.conf file. This ensures additional security

    you should need it. To allow only the named user to be able to read the

    /etc/named.conf file, use the following command:


    ```

    # chcon -t named_conf_t /etc/named.conf

    ```


    Verify with this command:


    ```

    # ls -Z /etc | grep named_conf

    ```'
