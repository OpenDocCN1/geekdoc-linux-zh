    # Summary


    This chapter describes the boot process, the GRUB, and service management during
    and after the boot process. Knowing how to troubleshoot boot issues through GRUB
    and service management during boot are listed in multiple places in the Hat Prep
    Guide; clearly, they are a good area on which to focus. You should now know how
    to move between runlevels, manage services, and fix common boot issues, and pass
    arguments to the kernel during the boot process. In the following chapters, we
    look at some more troubleshooting topics pertaining to the boot process and how
    to resolve them.


    # Review Questions


    +   1. GRUB has three stages. Can you name them?

    2. What option at the GRUB boot menu can you use to append something to a kernel?

    3. The old SysInit scripts have been replaced in Red Hat Enterprise Linux 6 for
    new boot utility?

    4. Runlevel 0 reboots the system. True or False?

    5. If your system crashes and becomes unbootable, you have to reinstall the whole
    operating system. True or False?

    6. What command can you use to manage system services?'
