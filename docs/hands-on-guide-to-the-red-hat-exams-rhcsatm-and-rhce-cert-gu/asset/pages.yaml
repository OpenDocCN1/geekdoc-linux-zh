  md: '# Firewall and SELinux Configuration


    When it comes to remote management in Linux, SSH is the standard. Because SSH
    is installed by default in Red Hat and there is a firewall rule already in place
    for you to begin remote management, you do not need to create any additional rules.
    As is good practice, though, you should verify that the rule is, in fact, in place.


    Because SSH uses TCP port 22 for remote access, you should query any rule from
    the /etc/sysconfig/iptables:


    ```

    # /etc/sysconfig/iptables | grep 22

    -A INPUT -m state --state NEW -m tcp -p tcp --dport 22 -j ACCEPT

    ```


    With the firewall rule already in place, you also need to look at SELinux restrictions
    on the SSH service.


    +   **Step 1.** Query the Boolean values associated with SSH:


    ```

    # getseboolean -a | grep ssh

    allow_ssh_keysgen -> off

    sftpd_write_ssh_home -> off

    ssh_sysadmn_login -> off

    ```


    > **EXAM TIP**

    The sftpd_write_ssh_home Boolean is new to RHEL6, and the run_ssh_inetd has been
    removed.


    You need to change only one of the options here. Later in this chapter, we discuss
    host-based security through the use of public and private keys, which requires
    the first Boolean to be turned on.


    +   **Step 2.** Enable the required Boolean value:


    ```

    # setseboolean -P allow_ssh_keysign=1

    ```


    +   **Step 3.** Verify that the value has changed:


