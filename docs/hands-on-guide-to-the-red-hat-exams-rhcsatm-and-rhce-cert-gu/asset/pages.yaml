  md: 'When the system moves to runlevel 3, the first thing that would happen be the
    system stopping the httpd service (httpd is the Apache Web Server). Next, the
    network service would be started, bringing up the network interfaces (this includes
    assigning an system IP address). Finally, the sshd service would be started, providing
    you with an SSH server for remote management. This order should make sense because
    you can''t connect to a server for remote management unless the network interfaces
    are up with an assigned IP address first!


    # EXAM TIP


    As a troubleshooting tip, if you are making your own services or entries in the
    /etc/rc/rc#. directories, make sure that you pay attention to the order in which
    you start and stop your service. Attempting to start or stop a service when there
    are other dependencies could have strange effects on the system or cause the service
    to just fail completely.


    Now that you have an understanding of how the different services are stopped and
    started at different runlevels, we can look at the final management utilities,
    which provides a means for enabling and disabling services at each runlevel. Going
    back to the previous example with the three services, you would need to make an
    entry for each of these three services in /etc/rc/rc[1-6].d directory. That comes
    out to 18 entries alone. Can you imagine how long would take you for all the services
    on the system? To the management of services at each runlevel, you can use the
    chkconfig command.


    Syntax: chkconfig [option] service_name


    Options:


    +   - [name] Shows the status of the service at each runlevel

    - add <name> Adds a service to be managed by the chkconfig command

    - del <name> Removes a service from being managed by the chkconfig command

    - level <levels> Enables or disables the service at the given levels

    - <name> <on|off> Enables or disables the service at levels 2-5


    The options for this command are a little different than you would normally see
    for a utility. The easiest way to explain how to use this command is through examples.


    Step 1. Check the status of the sshd service:


    ```

    # chkconfig --list sshd

    ```'
