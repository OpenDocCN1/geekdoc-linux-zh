  md: '# 120 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and
    Lab Manual


    You have made two directories here that you can now use as mount points for the
    file systems. You can mount /dev/hdb1 to the company_data directory and /dev/hdc1
    to the backup directory.


    Syntax: mount [options] DEVICE MOUNT_POINT


    Options:


    +   -r Mounts as read-only

    -w Mounts as read/write (the default)

    -L LABEL Mounts the file system with the name LABEL

    -v Provides verbose output


    **Step 2.** Mount the file systems:


    ```

    # mount /dev/hdb1 /opt/company_data

    # mount /dev/hdc1 /opt/backup

    ```


    Notice that you don''t specify a file type or any mount options. The reason is
    that the mount command automatically detects the file system type and mounts it
    for you. By default, the file system is also mounted with the defaults option.
    This is a good option to go with for most file systems because it covers many
    options you would normally want a file system mounted with. They include


    +   rw Mounts a file system as read/write

    uid Enables running setuid and setgid programs

    dev Interprets device files on the file system

    exec Permits binary file execution

    auto Mounts the file system when the -a option is specified

    nouser Disallows any normal user from (un)mounting the file system

    async Allows all file system I/O to occur asynchronously


    With the file systems now mounted, you can use them as if they were a regular
    directory. Removing or unmounting a file system is a little more complex because
    users might be actively using that file system. You can use the fuse and lsof
    commands to check for open files and users that are currently using files on a
    file system that you are trying to mount.


    Syntax: mount'
