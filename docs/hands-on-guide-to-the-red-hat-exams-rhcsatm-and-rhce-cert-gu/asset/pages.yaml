    the following guidelines:


    +   a. The IP address should be 172.168.1.10.

    b. The subnet mask should be 255.255.255.0.

    c. The gateway should be set to 172.168.1.1


    The task is complete when all interfaces can be pinged successfully.


    # Task 2 – Client DNS


    **Step 1.** Set up RHEL01 with the following guidelines:


    +   a. Your DNS server should be 192.168.1.1.

    b. Set the secondary DNS server to a public DNS server (you can find many online).


    The task is complete when all sites and hosts resolve successfully.


    # Task 3 – Packet Capture


    **Step 1.** Using the tcpdump utility on any system, perform the following actions:


    +   a. Set up tcpdump to capture packets (they must be written to a file).

    b. Ping any host on the local subnet until you get a reply.

    c. Close the tcpdump program.


    The task is complete when you have a packet capture file that contains the ping
    going across the local subnet.'
