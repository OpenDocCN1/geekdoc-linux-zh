    # MIGRATION TIP


    In RHEL5, the /etc/crontab file was used as the root user''s crontab. This crontab
    followed a different format from that of all other users. The /etc/crontab has
    an extra field between the last time field and command field. In this extra field,
    you must specify which user you want the job to run as.


    Here is what the /etc/crontab file looks like for RHEL systems:


    ```

    # /etc/crontab

    SHELL=/bin/bash

    PATH=/bin:/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    HOME=/

    ```


    ```

    # run-parts

    01 * * * * root-parts /etc/cron.hourly

    02 4 * * * root-parts /etc/cron.daily

