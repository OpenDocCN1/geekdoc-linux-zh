    # File Permission Basics


    Just like every operating system, Linux comes with a set of permissions to protect
    files, directories, and devices on the system. These permissions can be manipulated
    to allow (or disallow) access to files and directories on different parts of the
    system. Here are some of the commands you can use to work with permissions:


    chmod Changes the permissions of files or directories


    chown Changes the owner and group of files or directories


    ls -1 Displays file permissions and ownership of files or directories


    11 Same as ls -1


    umask Defines the default permissions for creation of files or directories


    Before starting to use commands, let''s look at how permissions work first. Linux
    permissions are implemented through the properties of files and defined by two
    separate categories. They are broken down into the following:


    +   - User Person who owns the file


    +   - Group Group that owns the file


    +   - Other All other users on the system'
