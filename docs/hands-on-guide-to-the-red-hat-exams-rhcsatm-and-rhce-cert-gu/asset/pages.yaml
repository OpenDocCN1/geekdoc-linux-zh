  md: '# Chapter 18: DNS 407


    Although four types of DNS servers have been described up to this point, I''m
    going to assume you still have a master DNS server configured. For this reason,
    you can use your utilities to check the setup and configuration of the master
    DNS server to verify that everything is working properly. The most basic test
    after the DNS server has been set up properly is ping the hostname of the nameserver
    and the domain itself. If both return a reply, your nameserver is querying properly.


    Step 1. Ping the hostname of the nameserver for your network—in this case, RHEL01:


    ```

    # rhel01

    PING rhel01.example.com (172.168.1.1) 56(84) bytes of data.

