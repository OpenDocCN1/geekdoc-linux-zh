    In the /etc/sysconfig/autofs file, you can define some default values for the
    service, including timeout, name of the maps file, logging, and more. Following
    is what the file should look like default:


    ```

    # cat /etc/sysconfig/autofs | grep -v #

    TIMEOUT=300

    BROWSE_MODE="no"

    MOUNT_NFS_DEFAULT_PROTOCOL=4

    USE_MIC_DEVICE="yes"

    ```


    These values are good for the default configuration with comments and other options
    commented out of the file. You just need the basic service, which is what these
    default values provide. When you''re working with AutoFS, four different map files
    are available:


    +   - master Default map file that contains other types of map files

    - special Map file that allows for group mounts without defining each one

    - direct Map file that requires a restart before mount changes are recognized

    - indirect Map file used to mount resources under a common parent directory


    Here is what my /etc/auto.master file looks like:


    ```

    # cat auto.master | grep -v "#"

    /misc /etc/auto.misc

    /net -hosts

    +auto.master

    ```


    The first entry here is an indirect map. The first part of the entry (/misc) defines
    the common parent directory where you''d like to have all your resources mounted.
    Next, you specify the file that holds the actual resources, including their locations,
    permissions, and a name. The /etc/auto.misc already exists and contains some samples
