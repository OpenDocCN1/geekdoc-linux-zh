  md: '# Samba


    As a Linux administrator, when you think Windows, you should also think Samba.
    Samba is a great technology that you can run on Linux allowing you to communicate
    and interact with Windows servers and clients. A Samba server can host Windows
    shares, as a print server, and in some more advanced cases act as a backup domain
    controller for Windows domains. This chapter examines how to set up Samba for
    basic use providing your clients with network shares similar to NFS. The biggest
    difference here, though, is the ability for Windows systems to also access to
    your shares. We will also look at how to secure these shares just like we did
    in the previous chapter with NFS.


    # Samba


    Samba, which uses the CIFS/SMB protocol, is commonly brought up when you want
    Linux and Windows machines to be able to share files together. From the file sharing
    users, Samba also has built-functionality to run as a member server on a Windows
    domain, print server, or file server. Let''s get started with the setup.


    +   Step 1. Install the required packages for Samba:


    ```

    # yum install -y samba samba-common samba-client

    ```


    +   Step 2. Verify the package installation:


    ```

    # rpm -qa | grep samba

    samba-client-3.5.48.el6.x86_64

    samba-3.5.48.el6.x86_64

    samba-winbind-clients-3.5.48.el6.x86_64

    samba-common-3.5.48.el6.x86_64

    ```


    +   Step 3. Enable the service to start on booting:


    ```

    # chconfig smb on

    ```


    +   Step 4. Verify that the service is set to start on booting:


    ```

    # chconfig smb --list

    smb 0:off 1:off 2:on 3:on 4:on 5:on

    6:off

    ```'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Configuring Samba


    If you have never worked with Samba before, the number of options can seem overwhelming.
    First, let''s look at the two services responsible for running Samba:


    +   - smbd Samba server daemon

    - nmbd NetBIOS service daemon


    There are also a handful of config files:


    +   - /etc/samba/smb.conf Contains the main config file

    - /etc/samba/smbusers Maps Samba and Red Hat users

    - /etc/samba/smbpasswd Contains Samba user passwords


    I''m sure you have guessed by now that no service complex comes with a group of
    management commands as well:


    +   - mount.cifs Mounts a Samba resource without root privileges

    - smbclient Connects to a Samba resource

    - smbpasswd Configures Samba users and passwords

    - smbstatus Displays the status of Samba connections

    - testparm Tests the syntax of the main config file for issues

    - umount.cifs Unmounts a Samba resource without root privileges


    Now that you are completely overwhelmed with config files and commands, let''s
    take a step back and see what these things are actually used for. You need to
    edit the main config file to set up the Samba server and directories that you''d
    like to make into Samba shares. Here is a sample /etc/samba/smb.conf config file
    you can use (just read through it for now):


    ```

    # cat /etc/samba/smb.conf

    ### Global Data Section ###


    [global]


    ### Define our workgroup and hostname information ###


    workgroup = INET

    server string = My Samba Server

    netbios name = RHEL01

    ```'
