  md: '# Chapter 2: System Initialization 53


    config file, but this is one area where RHEL6 has changed. First, let''s look
    at a ver- sion of the old grub conf file:


    ```

    # /boot/grub/grub.conf

    deault=0

    timeout=5

    plashimage=(hd0,0)/grub/splash.xpm.gz

    hidden

    title Red Hat Enterprise Linux Server (2.6.18-92.el15)

    root (hd0,0)

    kernel /vmlinuz-2.6.18-92.el15 root=/dev/VolGroup00/LogVol00 rhgb quiet

    initrd /initrd-2.6.18-92.el15.img

    ```


    In the preceding example, you can see that there is a single option to boot from,
    defined by the title entry. This is also known as entry0, so it becomes the default
    kernel to boot. You can also see the version of the kernel that you are using
    and the place where the root partition will be mounted during the boot process.
    If you want to add additional options into boot, you can append another other
    title with options for a second boot choice. This grub.conf contains everything
    you need to make the boot process work smoothly.


    Now let''s look at the new version of the grub.conf file for RHEL6:


    ```

    # grub.conf

    deault=0

    timeout=5

    splashimage=(hd0,0)/grub/splash.xpm.gz

    hidden

    title Red Hat Enterprise Linux (2.6.32-71.el16.x86_64)

    root (hd0,0)

    kernel /vmlinuz-2.6.32-71.el16.x86_64 root=/dev/mapper/vg_rhel01-lv_root

    rd_DM_LV=vg_rhel01/lv_root rd_DM_LV=vg_rhel01/lv_swap rd_NO_LUKS rd_NO_DM

    rd_DO_DN KEYTABLE=en_US.UTF-8 FONT=laterecyrb-sun16 KEYBOARDTYPE=pc

    initrd /initramfs-2.6.32-71.el16.x86_64.img

    ```


    Notice that almost everything is the same for the line containing the kernel boot
    parameters. This new version defines additional options such as encryption, RAID,
    and use of the /dev/mapper for LVM management. Again, it is important to take
    note of the new changes in RHEL6 because you need to be able to troubleshoot the
    grub.conf file something goes wrong with the system. In both versions of Red Hat,
    you can also edit the config file from within the GRUB command line as well. Using
    the c option to enter the GRUB command line, you can make changes to the config
    file, restart GRUB, or repair a broken config file.'
