    # Security Configuration


    Before any of the clients can start an IP address from the DHCP server,

    you need to deal with the security requirements for the DHCP server. They-include
    a firewall rule with iptables and disabling any SELinux options to

    prevent the DHCP service from running. For the firewall rule, you need to know

    at the DHCP server listens on UDP port 67 for incoming DHCP requests.


    **Step 1.** Use iptables to create the firewall rule:


    ```

    # iptables -I INPUT 5 -p udp -m udp --dport 67 -j ACCEPT

    ```


    **Step 2.** Save the firewall rule you just created:


    ```

    # service iptables save

    Saving firewall rules to /etc/sysconfig/iptables: [ OK ]

    ```


    **Step 3.** Then restart the iptables service:


    ```

    # service iptables restart

    iptables: Flushing firewall rules: [ OK ]

    iptables: Setting chains to policy ACCEPT: filter [ OK ]

    iptables: Unloading modules: [ OK ]

    iptables: Applying firewall rules: [ OK ]

    ```


    With the firewall rules in place, you can shift your focus to SELinux.

    Well, wouldn''t you know...there are no SELinux requirements for a

    DHCP server.


    TIP: As you have seen in numerous chapters already, RHEL5 requires some

    SELinux configuration. For the DHCP server to function, you need to disable

    SELinux protection of the DHCP service itself.'
