  md: '# Network Services


    Need the time? How about an IP address for your client system? TFTP server? These
    are all network services that can be provided to different systems on your network.
    This chapter looks at the different network services that can be offered in Red
    Hat, including DHCP for IP addressing; NTP for time; and xinetd, which provides
    multiple services. These types of service are commonly found on many networks
    of different sizes. Each service plays a particular role in keeping the network
    functioning and clients with different needs. Although xinetd, and TFTP servers
    aren''t explicitly defined on any of the Red Hat Exam Prep Guides, they are important
    pieces to a real-world network, which is why they are covered in this chapter.


    # Xinetd: The Master Service


    As a system administrator, you will most likely need to provide your users with
    network and Internet services. These services may include FTP, HTTP, or Telnet.
    Although some software packages like Apache provide a single service (HTTP), there
    is also a master service called xinetd that can run multiple services at the same
    time. Although the Red Hat Exam Prep Guide doesn''t specify any particular xinetd
    service, you may need to configure basic services on the exam. It is a widely
    used service in the real world, particularly when it comes to automating the installation
    of Red Hat. There are really a few things that you need to know to be able to
    use the xinetd service. This package doesn''t always come installed by default,
    so let''s install it first.


    +   Step 1. Install the xinetd package:


    ```

    # yum install -y xinetd

    ```


    +   Step 2. Verify that the package is installed correctly:


    ```

    # rpm -qa | grep xinetd

    xinetd-2.3.14-29.el16.x86_64

    ```


    With the service, you can shift your focus to the config files. The xinetd service
    has a master file (/etc/xinetd.conf), which inherits all the settings of the services
    that it controls. Aside from this'
