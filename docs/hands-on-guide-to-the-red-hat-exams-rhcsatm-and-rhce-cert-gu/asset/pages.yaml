    nameserver 172.168.1.1\n```\n\n# BIND Security\n\nThe BIND DNS server offers plenty\
    \ of ways in to make your DNS server\nmore secure. When you are creating your\
    \ /etc/named.conf file, there is a section\nwhere you can define options that\
    \ you'd like to use with the server. I purposely left\nout options at the beginning\
    \ of this chapter as to show the security they\nprovide by adding them in. You\
    \ can create a more refined list of hosts and subnets\nthat you'd like to allow\
    \ access to perform particular actions or tasks against your\nDNS server.\n\n\
    The first option you can use is listen-on, which defines the port and IP\naddress(es)\
    \ that your server will listen on. This limits the subnets on which the\nDNS server\
    \ can be reached from. You can also use the allow-query option to limit\nwhich\
    \ subnets have access to the DNS server to begin with. A third option,\nallow-transfer,\
    \ defines the slave servers that are allowed to query data from the\nmaster and\
    \ transfer its zone file. This should not be allowed from any other host\nyour\
    \ network.\n\nHere is part of the /etc/named.conf file:\n\n```\n* Global options\
    \ for the BIND Server * /\noptions\n{\n  listen-port 53 { 127.0.0.1; 172.168.1.1;\
    \ };\n  allow-query { 127.0.0.1; 172.168.1.0/24; };\n\n  allow-transfer { 172.168.1.2;\
    \ };\n\n  directory \"/var/named\"; // the default\n  dump-file \"data/cache_dump.db\"\
    \n  statistics-file \"data/named_stats.txt\"\n  memstatistics-file \"data/named_mem_stats.txt\"\
    \n\n};\n```\n\nAlthough being able to query from any system on the network might\
    \ seem convenient,\nit can become a huge pain to remember IP addresses and subnets\
    \ that are all"
