    # Rescue and Recovery Runlevels


    Sometimes things go wrong with the system to the point where it refuses to boot.
    For those users who are just starting out with Linux, this is a major red flag
    that throws them off their balance because they aren''t quite sure how to handle
    such a crash. At this point, you can use the lower levels for rescue or recovery.
    If your system boots into runlevel 3, you can bring yourself into a recovery runlevel


    ```

    # init 1

    ```


    If the system doesn''t even get that far, you can boot up, enter a at the GRUB
    boot menu, and append the word single to the kernel that you want to boot into.
    This approach has the same effect as booting into a recovery runlevel. After you
    get into the recovery runlevel, you can perform maintenance or repairs on your
    system (such as figuring out what is preventing the system from booting). For
    the exam, keep the following in mind the recovery runlevel:


    +   - You can reset or change the root user''s password.


    +   - You can adjust system files or partitions that are normally locked when
    the system is in use.


    +   - You can repair system files by replacing them with working copies from a
    backup or the Red Hat installation CD.


    After you finish any changes or repairs, if you reboot the system and whether
    it returns to normal working state. If it doesn''t, you can re-enter the recovery
    runlevel to try again. You can also access this rescue environment by booting
    the first Red Hat installation CD.


    Now that you have an understanding of runlevels and how to move between them,
    we can shift focus to service management, which deals with different system services
    starting and stopping at the different runlevels.


    # Service Management


    On any system it is important to manage the running services. Managing services
    enables you to ensure the stability and reliability that your system will offer.
    A service can range from something simple, such as providing your local system
    with'
