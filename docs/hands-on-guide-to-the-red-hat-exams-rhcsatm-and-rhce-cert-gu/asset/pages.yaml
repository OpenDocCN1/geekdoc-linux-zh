    # Troubleshooting Apache


    One of the best tools available for troubleshooting Apache is its logs file. Each
    log file has a separate directory from the other files on the system, which makes
    them easy to pick out. There are two basic files you can use to troubleshoot with:


    +   - /var/log/httpd/access_log all to the server

    - /var/log/httpd/error_log Logs error messages from the server


    Usually, these two logs provides you with enough information when troubleshooting
    to resolve your issues. In the main config file, there is also a section for logging
    that enables you to change the information recorded by the httpd service. If you''d
    like different output (or more output), you can adjust the logging accordingly.


    If you''re using a secure site, there are three additional files for SSL.


    +   - /var/log/httpd/ssl_access_log Logs access to the secure site

    - /var/log/httpd/ssl_error_log Logs error messages from the secure site

    - /var/log/httpd/ssl_request_log Logs requests made to the server from clients


    As you have already seen, you can use the config-test parameter when looking for
    errors in the main config file. One common error that everyone sees to get when
    starting the service is about the ServerName option not being set, the web server
    assumes 127.0.0.1 by default. To correct this, you should set the ServerName option
    within the main config file to the name of your server. You can also change the
    amount of output generated in the log files by changing the LogLevel option within
    the main config file.'
