  md: '# 16 Hands-on Guide to the Red Hat®: RHCSA™ and RHCE® Cert Guide and Lab Manual


    The hardest thing to understand when you''re starting regex is how to build a
    pattern to find what you''re looking for. You not only need to know which option
    to use when calling the grep command, but also need to understand pattern options.
    Let’s go through what some of these options include.


    Metacharacters:


    +   [ ] Matches anything inside the brackets, individually or as a whole, including
    letters or numbers. Be aware that lower- and uppercase letters are different.


    +   - Creates a range; for example, one through nine would be 1-9. This dash can
    also be used to search for a range of letters such as a-z or A-Z. There are no
    spaces between characters using a range.


    +   ^ Negates a sign when used inside brackets. The caret is outside brackets
    to find only lines that begin with a given string.


    +   * Similar to a caret outside brackets, finds lines based on their ending character
    string.


    +   . Finds any character in its position.


    +   * Matches any character zero or more times.


    +   ( ) Combines multiple patterns.


    +   | Finds left or right values, which is very useful in combination with ( ).


