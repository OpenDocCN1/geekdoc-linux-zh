    any issue on Linux, not just Red Hat. When you''re trying to find an issue or
    resolve one, the log files should always be your first step.


    # Monitoring System Performance


    Every time a program or command is run, a process is created for it. These processes
    are all unique and identified by the process identification (PID) that becomes
    allocated to it. System processes are critical to keeping the system up and running
    or providing services to clients. Management of processes can help keep the system
    stable or help when the system becomes unstable. Here are some of the process
    commands you can use:


    +   - ps Displays information about running processes

    - kill Terminates a process

    - pgrep Finds a process based on its PID

    - pidof Displays all processes related to a service or command

    - top Monitors system resources (similar to Task Manager in Windows)

    - renice Adjusts the priority of a particular process'
