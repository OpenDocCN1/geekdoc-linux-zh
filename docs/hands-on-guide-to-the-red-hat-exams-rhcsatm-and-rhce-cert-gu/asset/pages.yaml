    nameserver 192.168.1.1

    nameserver 172.168.1.1

    ```


    The search option is the name of the domain that will be searched by default.
    If your client is trying to access a hostname that is not fully qualified (such
    as RHEL01.example.com), and the DNS server returns an error that it can''t find
    the specified host, adding the search <domain> option. This is a common setup
    when clients and servers belong to a domain. The second listing of the nameserver
    option just specifies a secondary DNS server in case the first is not available.


