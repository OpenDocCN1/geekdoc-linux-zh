    in this file are not allowed to log in but still receive a login and password
    prompt allowing them to submit their credentials over the network in clear-text.


    # REAL-WORLD TIP


    If you''d like to control user security through the use of PAM modules, vsftpd
    comes with /etc/pam.vsftpd. This file defines the requirements that a user must
    meet to log in to the FTP server.


    For additional security, the vsftpd service supports the use of TCP Wrappers,
    which can be used for access control. Although you don''t need to configure TCP
    Wrappers for the service in lab, it is good to know that the service supports
    it.


    # Troubleshooting FTP


    Now that the setup is complete, you need to test the FTP server from one of the
    clients, Client01. To save time during the exam and when testing in the real world,
    you can use the command-line FTP client lftp. This command includes many features
    for quick testing and verification that the FTP server is functioning properly.


    +   Step 1. Install the lftp package on the Client01 system:


    ```

    # yum install -y lftp

    ```'
