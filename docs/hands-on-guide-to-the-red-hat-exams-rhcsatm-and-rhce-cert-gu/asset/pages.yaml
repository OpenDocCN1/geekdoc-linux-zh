    6:off


    # Configuring the Web Server


    Now the web server is installed, we can shift attention to the config files and
    directories. During the installation, a directory (/var/www) is created with a
    set of subdirectories. This directory tree is the place where you store your websites.
    There are a few config files to look at:


    +   -etc/httpd/conf/httpd.conf    Main config file

    -/var/log/httpd            Log file directory for the web server

    -/usr/lib64/httpd/modules  Modules for Apache


    The main config file for Apache is completely usable out of the box, which is
    great if you''d like to just get up and running. You should spend some time looking
    through the main file because it provides many options and documentation in the
    comments. The top of the config file is grouped into three sections.


    From the /etc/httpd/conf/httpd.conf file:


    +   # configuration directives are grouped into three basic sections:

    # 1. Directives that control the operation of the Apache server process as a

    # whole (''global environment'').

    # 2. Directives that define the parameters of the ''main'' or ''default'' server,

    # which responds to requests that aren''t handled by a virtual host.

    # These directives also provide default values for the settings

    # of all virtual hosts.'
