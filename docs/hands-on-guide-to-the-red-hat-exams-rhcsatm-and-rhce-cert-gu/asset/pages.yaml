    # Runlevel Utilities


    Let''s now look at the many system utilities that help you manage the system in
    different runlevels. These management commands include the following:


    +   - shutdown Brings the system to a powered-off state or can reboot the system

    - halt Powers down the system

    - reboot Reboots the system

    - poweroff Works the same as the halt command

    - chkconfig Manages what runlevels services start and stop at

    - runlevel Displays the current and previous runlevels

    - init Changes runlevels

    - ntsys Works similarly to chkconfig in that it is a menu-driven service management


    Let''s start with management of the two easiest runlevels again: 0 and 6. To manage
    these particular runlevels, you can use the shutdown command to bring the system
    to a powered-off state or reboot the system. The shutdown command also has options
    to alert users on the system when it is going down and to set up a shutdown at
    a particular time.


    Syntax: shutdown [options] time


    # Options:


    +   -k Doesn''t shut down; just warns

    -h Halts the system after shutdown

    -r Reboots instead of turning off the system

    -F Forces a file system check on reboot

    -n Kills all processes quickly (not recommended)

    -t SECS Sends a shutdown message but delays shutdown by x seconds'
