  md: 'see here that you define a masters option, which is actually the master DNS
    server.

    The slave DNS server will periodically check with the master DNS server, pull
    the data for a zone, and create the file if it doesn''t exist. The slave zone
    files exist in the /var/named/slaves directory.


    **NOTE:** Make sure your named.ca, named.localhost, and named.loopback are in
    place on RHEL02.


    # **Step 1.** With the files in place, you can check for syntax errors:


    ```

    # service named configtest

    zone localhost/IN: loaded serial 42

    zone 0.127.in-addr.arpa/IN: loaded serial 1997022700

    ```


    # **Step 2.** Start the named service:


    ```

    # service named start

    Starting named: [ OK ]

    ```


    # **Step 3.** Check the /var/named/slaves directory to see if the zone files copied
    over from the master DNS server:


    ```

    # ls /var/named/slaves

    example.com.revzone example.com.zone

    ```


    You can manually pull the zones from the master DNS server using the dig command
    to perform a zone transfer. We look at the full syntax of the dig command, but
    here you can see how to manually transfer a zone file:


    ```

    # dig -t axfr example.com @rhel01


    ; DIG 9.3.6-P1-RedHat-9.3.6-4.P1.el5 << @rhel01 example.com axfr

    ;; (1 server found)

    ;; global options: printcmd

    example.com. 86400 SOA rhel01.example.com.

    root.example.com. 201020711 86400 7200 241920 3600

    example.com. 86400 NS rhel01.example.com.

    example.com. 86400 A 172.168.1.1

    client02.example.com. 86400 A 172.168.1.20

