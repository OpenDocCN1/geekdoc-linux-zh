  md: '# Miscellaneous


    This section covers numerous different issues you might run into while running
    Linux.


    I Can''t Remote into My System


    When you run into issues with SSH, you need to follow a process to determine the
    problem. When you''re trying to track down an issue, think of the path that a
    packet would take from your remote system to enter your server via SSH. Ask yourself
    the following questions:


    +   - Are TCP Wrappers being used?

    - Are the firewall rules set up correctly?

    - Is the service running?

    - Am I connecting over the correct port?

    - I am using the correct authentication mechanism (public/private key versus password)?

    - Is there an issue with the config file?


    By working your methodically through this list, you can narrow down where the
    issue lies and train your mind to look for certain circumstances when troubleshooting
    services. If you make any changes to config files, don''t forget to restart the
    service.


    I Can''t Access Service X


    One of the most frustrating issues with Linux is that you might not always remember
    the security mechanisms that can be used. Many times you will configure a service,
    set up security for that, configure firewall rules, and the service still not
    work. You may realize only after hours of troubleshooting that you never disabled
    the SELinux protection for the service in the way you intended it to. When setting
    up the security for any service, use the following list of questions to troubleshoot:


    +   - Are firewall rules required? Are they correct?

    - Is TCP Wrappers in play?

    - Is SELinux protecting a function or the whole service?

    - Have you verified whether the Boolean values for SELinux are set correctly?

    - What host-based security is in place?

    - What user-based security is in place?

    - Is the service running, and who is it running as?'
  merge: -1
  pgno: 500
- img_proc: true
  md: '# Chapter 21: Troubleshooting


    Many times you will find that answering one of these questions when configuring
    or troubleshooting, which is the cause of your issue. Don''t forget that all troubleshooting
    is a methodical process.


    # When I Start a Service, It Tells Me “Cannot Bind to Address”


    All services in Linux have a config file somewhere on the system. Those that allow
    access to them over the network also need to use an IP address and a port to service
    properly. When a service tells you that it can''t bind to an address, it usually
    indicates that the IP or port is already in use.


    +   Step 1. Verify your current IP address:


    ```

    # ifconfig

    ```


    +   Step 2. Look at the current list of ports being used by the system:


    ```

    # netstat -tuapie

    ```


    +   Step 3. View the log file, the service, or the general log file to find out
    which port is in conflict:


    ```

    # tail /var/log/messages

    ```


    # I Get the Error Message “No Route to Host”


    Although you might think right that there is a routing issue if you receive the
    “No route to host”, many times isn’t. To make sure, however, verify your IP address.


    +   Step 1. View the current IP address:


    ```

    # ifconfig

    ```


    +   Step 2. View the current routes:


    ```

    # route

    ```


    If your IP, subnet, and gateway are, in fact, set up correctly, this error indicates
    a firewall rule blocking you. When a service is blocked by the firewall, not allowing
    clients to connect, this is a common error message. You can create a rule on the
    firewall using the iptables command if you know which is causing the issue, or
    you can simply stop the firewall temporarily to verify that it is causing the
    problem.


    +   Step 3. Stop the firewall services:


    ```

    # service iptables stop

    iptables: Flushing firewall rules: [ OK ]

    iptables: Setting chains to policy ACCEPT: filter [ OK ]

    iptables: Unloading modules: [ OK ]

    ```'
  merge: -1
  pgno: 501
- img_proc: true
  md: '# 470 Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and
    Lab Manual


    **Step 4.** Test the service or connection, and then restart the firewall:


    ```

    # service iptables start

    iptables: Applying firewall rules: [ ]

    ```


    My Ping to Another Host Has Failed


    When you are unable to ping a particular host in the network, the problem boils
    down to a few items. Use the following questions to find the answer:


    +   * Is the network interface I am using up and running?

    * Does my network interface have a valid IP and netmask?

    * Is my gateway set correctly?

    * If pinging by hostname, is the /etc/hosts or DNS server entry correct?

    * Is there a firewall rule blocking ICMP requests?


    # Summary


    This chapter touched on a few different areas that commonly need troubleshooting.
    Although it doesn''t cover everything, each individual chapter has a troubleshooting
    section that you can refer to. The topics covered here commonly cause issues,
    and the advice here can be viewed as quick steps to fix each one. The next, and
    final, chapter in this book deals with virtualization and KVM.'
