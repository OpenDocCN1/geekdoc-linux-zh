- img_proc: true
  md: '# 150 Hands-Guide to the Red Hat® RHCS™ and RHCE® Cert Guide and Lab Manual


    NETWORKING_IPV6=yes

    HOSTNAME=RHEL0


    The output here should be reasonably straightforward. The first two lines tell
    the system whether or to enable networking for IPv4 and IPv6. By default, they
    are both enabled and can remain that unless otherwise noted. I prefer to disable
    IPv6 if it is not in use so as not add extra traffic to the network. The third
    dimension defines what the system is going to be. One additional option not listed
    here is GATEWAY. The reason that it doesn''t appear on the system here (or may
    not be yours) is that the option is set by the DHCP server, in which case it doesn''t
    appear. If you use a static IP address, see the GATEWAY option listed here. You
    may also define the gateway yourself to override any other gateway settings.


    # EXAM TIP


    When you change the hostname of your computer, you don''t have to reboot. If you
    do not reboot, there are numerous places that you need to change the hostname.
    If the system is not mission critical (or you have extra time on the Red Hat exam),
    you should restart the system and allow it to make all the adjustments for you.


    Let''s jump over to the /etc/sysconfig/network-scripts directory, where we find
    the remaining important files that deal with networking. Each network interface
    has its own config file in this directory that follows ifcfg-ethX, where X is
    the number of the network card. For example, my primary network card contains
    the following in its config file:


    ```

    # cat /etc/sysconfig/network-scripts/ifcfg-eth0

    DEVICE=eth0

    BOOTPROTO=dhcp

    HWADDR=08:00:27:30:74:AA

    ONBOOT=yes

    DHCP_HOSTNAME=RHEL0

    TYPE=Ethernet

    ```


    There are two important elements to note in this file. The first is the DEVICE
    option, which specifies which interface you are working with. Here, the first
    interface is specified, and by looking at the next line, you can see the protocol
    in use. This interface uses the DHCP protocol, which means that the IP address
    is leased from a DHCP server on the network (automatically during boot). Suppose
    you want to change this to a static IP address? You could edit this file by hand,
    but for basic configuration, there is a faster method.'
