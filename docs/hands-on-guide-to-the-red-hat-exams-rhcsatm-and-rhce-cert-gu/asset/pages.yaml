  md: '# Service and Boolean Options


    Now that we''ve looked at the contexts related to files and directories, let''s
    look at the Boolean options associated with services. Each service controls certain
    actions with a set of options defined as Boolean values (which can either be on
    or off). This section covers how to work with Boolean options for services and
    is the most important when it comes to the Red Hat exam because it shows you how
    to enable access to different services.


    To view these Boolean options, you can use the getsebool command combined with
    grep to look for specific options.


    Syntax: getsebool -a | boolean


    Although you have not installed a web server yet, let''s look at the Boolean options
    from it anyway. The reason behind this is it has many options, making for a good
    example.


    Query the Boolean options available for the httpd service (Apache):


    ```

    # getsebool -a | grep http

