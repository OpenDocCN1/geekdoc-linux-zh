    \ version 4, you need to statically define ports in the /etc/sysconfig/nfs file\
    \ for each of the daemons required for the NFS service to run. You also need to\
    \ add these ports to the /etc/services file and create a firewall rule for each\
    \ one. For all trouble, you are better off using NFS version 4 instead.\n setup\
    \ of NFS can vary slightly based on other firewall rules and security restrictions\
    \ that you might have in place, testing with these options will help.\n\n# Exam\
    \ Tip\n\nIf you are using NFS version 4 and having issues with firewall rules,\
    \ you can take the following steps:\n**Step 1.** Define static ports in /etc/sysconfig/nfs\
    \ for each of the four required demons.\n**Step 2.** Create a firewall rule for\
    \ the rpcbind server (TCP and UDP port 111).\n**Step 3.** Create a firewall rule\
    \ for the MOUNT_PORT you specified (TCP and UDP).\n**Step 4.** Create a firewall\
    \ rule for the STATD_PORT you specified (TCP and UDP).\n**Step 5.** Create a firewall\
    \ rule for the LOCKD_TCPPORT you specified (TCP).\n**Step 6.** Create a firewall\
    \ rule for the LOCKD_UDPPORT you specified (UDP)."
