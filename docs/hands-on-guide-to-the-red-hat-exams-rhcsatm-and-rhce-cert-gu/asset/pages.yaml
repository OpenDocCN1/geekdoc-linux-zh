    # Mounting LUKS at Boot


    As you have already seen, the /etc/fstab file is responsible for keeping track
    of which partitions are mounted during boot. When you are working with an encrypted
    partition, nothing really changes, except that you need to make an entry in the
    /etc/crypttab file as well. The /etc/crypttab file uses the following syntax:


    ```

    <mount point> <partition> none

    ```


    When the system boots, it checks the /etc/crypttab file to see whether it contains
    any entries. If it does, the system prompts you for a password to decrypt the
    partition during boot.


    # Managing File System Quotas


    As you''ve done in all the sections so far, you need to install the required packages
    before you use quotas on your system.


    +   Step 1. To install the quota package, use the following:

    # yum install - y quota


    +   Step 2. Verify that the package was installed successfully:

    # rpm -qa grep quota

    quota-3.17-10.el6.x86_64


    Although Red Hat supports quotas in the kernel by default, it is always a good
    idea to verify things for yourself. Should you find yourself working on a system
    with a custom kernel, you will know how to verify the kernel supports quotas.


    +   Step 3. You can query quota support from the kernel with the following command:

    # grep -i config_quota /boot/config-uname -r

    CONFIG_QUOTA=y

    CONFIG_QUOTACTL=y


    You should see a y next to the options to show that the kernel does indeed support
    quotas. After verifying that the package is installed and you can start configuring
    the system to use them. For a working example, you can configure quotas on the
    /opt/company_data file system so that you can limit the amount of data that users
    can store in the company''s directory.


    # Setting Up Quotas


    To start using quotas, let''s look at some the commands you can use with them:


    +   quotaon Turns on quota tracking

    quotaoff Turns off quota tracking'
