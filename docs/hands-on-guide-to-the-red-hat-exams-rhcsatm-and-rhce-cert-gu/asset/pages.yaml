    # Configuring the Proxy


    When setting up your proxy server, you need to know the following:


    | /etc/sysconfig/squid | Startup options for the config file |

    | /etc/squid/squid.conf | Main config file for the service |

    | /var/spool/squid | Cache location on the proxy server |

    | /var/log/squid | Log files for the proxy server |


    As with most services you configure, the first item on the agenda is the main
    config file. I want to warn you first that although this config file has huge
    amounts of documentation and numerous examples, it contains over 4,000+ lines,
