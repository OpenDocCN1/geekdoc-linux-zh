  md: 'Preface xxix


    In case you''re thinking you don''t have the hardware to host this number of machines
    or you don''t know how you''ll visualize an entire lab, think again. These four
    virtual machines each use 384MB of RAM (1.5GB total). The host machine I use is
    a laptop so that my lab is portable, and it has a dual-core processor with 3GB
    of RAM. I have also tested this lab setup on a Pentium 4 with 4GB of RAM. Both
    machines were able to run the full virtual lab with no problems or delays. If
    you have some trouble with performance, you can also drop the memory on RHEL02,
    Client01, or Client02 to 256MB of RAM. The primary host (RHEL01) is the only machine
    that really needs the extra memory.


    CAUTION Don''t create the 4GB drives for host RHEL01 just yet! One of the limitations
    in VirtualBox is that you can have four devices attached to a system at one time.
    To get the operating system installed, you need to have a CD-ROM device attached,
    and if you create the four drives listed here, you will have no room left for
    the CD-ROM. When you complete Chapter 1, you can remove the CD-ROM device and
    create the extra 4GB drives that you will need later.


    # Who Should Read This Book?


    The Red Hat exams are some of the most challenging exams in the Linux arena. This
    book is meant to be used as a hands-on lab guide for readers with all types of
    backgrounds. Whether you are starting out or are a seasoned system administrator,
    this book helps you learn or fine-tune your skills to take the Red Hat exams.
    Although those starting out to put in more effort to learn some of the skills
    discussed in this book, it is possible to gain the required skills for the exams.
    While this book teaches you the necessary skills, the key to passing the Red Hat
    exams is practice, practice, practice.


    # How This Book Is Organized


    This book is laid out in a logical format that flows from cover to cover. Although
    you could jump around, each chapter builds on where the previous one left off,
    allowing you to build a system and understand how it works from the ground up.
    Each chapter covers a different set of objectives, the first half of the book
    (Chapters 2 through 12) deals primarily with the RHCSA. The second half of the
    book (Chapters 13 through 21) covers the RHCE exam.


    Chapter 1, "Installation," is an introductory chapter designed to help you install
    the Red Hat Enterprise Linux system and set up your virtual lab. The virtual lab
    that you set up will help you with the labs in each chapter, allowing you to build
    your hands-on skills for the real exams.'
  merge: -1
