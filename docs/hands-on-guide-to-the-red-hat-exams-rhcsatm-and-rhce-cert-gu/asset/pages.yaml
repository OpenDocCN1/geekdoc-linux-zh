  md: '# Chapter 7: User Administration 201


    To view the user you just created, use the following command:


    ```

    # cat /etc/passwd | grep user02

    user02:x:501:501:Joe:/home/user02:/bin/bash

    ```


    When making users, including system users, you can always check this file to ensure
    that all the options specified during user creation are been properly. You can
    see that all is present here. The password file is actually just a placeholder
    (with an x). The reason is that the passwords are actually stored in a different
    file, /etc/shadow.


    # The Shadow File


    Syntax of /etc/shadow:


    ```

    <username>:<encrypted password>:<last passwd

    change:<min>:<max>:<warn>:<inactive>:<expires>:<not used>

    ```


    With the exception of the username and password fields, all values are in days.

    To view the information about a user you created, use the following:


    ```

    # cat /etc/shadow | grep user02

    user02:$S1cSM6t6LSOXcgSPmd2v/VXkEjm201:14767:0:9999:7:::

    ```


    You can see the username and encrypted password. The next field, 14767, is the
    number of days since the password has been changed. Well, you just made this user
    account, so where did that large number come from? This number is actually based
    on the number of days since epoch time (January 1, 1970), which is a standard
    for keeping track of how long it''s been since something has elapsed. Also, notice
    that the two fields show the minimum number of days before you can change your
    password (0) and the number of days your password is valid (99999 is basically
    forever, so the password won''t expire). The difference between the max days and
    expires field is that max requires you to change your password, whereas the expires
    field disables, or expires, your account. You can edit and manage the password
    expiration details with the chage command.


    Syntax: chage [options] USER


    Options:


    +   -d LAST_DAY Indicates the day the password was last changed

    -E EXPIRE_DATE Sets the account expiration date

    -I INACTIVE Changes the password in an inactive state after the account expires

    -l Shows account aging information

    -m MIN_DAYS Sets the minimum number of days between password changes'
