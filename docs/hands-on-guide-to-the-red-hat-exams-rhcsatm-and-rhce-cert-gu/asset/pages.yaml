  md: '# CHAPTER 17


    # FTP


    There are many different ways you can share files with users on your network.
    This capability is important because you don''t always want your users storing
    things locally on their desktop or laptop. Should something happen to your users’
    systems, they would lose all their work...not to mention that it would cause a
    backup strategy nightmare. An easier solution for management and security would
    be to store all files in a centralized location. In this chapter, we look at File
    Transfer Protocol (FTP) and how it can be used to share files or provide them
    in an easy manner


    # File Transfer Protocol


    While we''re on the topic of sharing files (we covered file sharing in Chapters
    15, "NFS," and 16, "Samba"), let''s finish out file sharing in this chapter by
    diving into FTP. In my opinion, this is one of the easiest to use, most convenient,
    and completely secure protocols (because it tends to be set up insecurely). With
    that being said, let''s look at how these things hold true.


    To transfer a file using the FTP protocol, a user must log in to an FTP server,
    which can be done with credentials or anonymously. When the user is connected,
    he can traverse the directory structure for any directory or file for she has
    permissions. If the protocol is not configured properly, this can leave your system
    open to attack and make it hard to track if the attack is done through any anonymous
    connection!


    The second big issue with the FTP protocol is that when the user logs in with
    a username and password, they are passed over the network in clear-text, meaning
    that anyone listening can see them.


    So, why use the FTP protocol at all? It''s easy to set up, and when used correctly,
    it''s highly effective for delivering files to end users. Almost all major computer
    makers (HP, Dell, Apple) offer drivers for their systems over FTP, which allows
    for simple download by end users and organized structure on the back end for the
    drivers themselves.'
  merge: -1
  pgno: 415
