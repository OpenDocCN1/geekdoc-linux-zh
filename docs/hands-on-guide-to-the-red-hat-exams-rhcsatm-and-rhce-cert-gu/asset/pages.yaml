  md: '# Web Services


    The most commonly used web server in the world today is Apache—and with good reason.
    Built with security in mind, Apache is a solid and stable web server that has
    been around for years. The module design allows for scalability and ease of use.
    Apache can also be used to host multiple websites at a single time through the
    use of its virtual hosts feature. There is also an option to use the SSL protocol,
    making websites safe and secure. This secure base provides a platform for developers
    to use writing secure code for banks, retail sites, and so on. Because Apache
    has all these great options, it means there is a lot to cover, which is why this
    chapter focuses on the Apache web server and Squid, a web proxy.


    # The Apache Web Server


    Today, with Web 2.0 on the rise and Software as a Service (SaaS) becoming more
    prevalent, Apache has begun to play a larger role. It is important to know how
    to install and secure Apache correctly. To start, let''s look at some of the new
    features in Red Hat 6:


    +   - Apache has been upgraded to version 2.2 (from 2.0).

    - It has improved caching modules: mod_cache and mod_disk_cache.

    - It provides support for proxy load balancing through mod_proxy_balancer.

    - It provides support for large files, allowing web servers to handle files larger
    than 2GB.

    - It has improved authentication and authorization support.


    These features help increase the scalability and security that Apache is known
    for.


    # Installing Apache


    When you''re working with Apache, you need two packages. The first is httpd, which
    actually installs the Apache web server. The second is the mod_ssl1 package, which
    provides the ability to create secure websites later in this chapter.'
  merge: -1
  pgno: 357
