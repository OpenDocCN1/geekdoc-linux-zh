- img_proc: true
  md: '# Working with NAT


    One final use for iptables is network address translation (NAT). This allows you
    to use a server as a gateway to a subnet, essentially controlling what goes in
    and out of your network. You actually use this in the lab that all systems can
    use RHEL01 as a gateway to get in and out of the private network.


    Earlier, we described the syntax of iptables:


    ```

    Syntax: iptables [options] -j [target]

    ```


    However, there is actually one extra piece to the table:


    ```

    Syntax: iptables -t [table-type] [options] [chain] -j [target]

    ```


    The reason I left off the table-type filter originally is that there are two types
    of tables: filter and nat. By default, a filter table is used, which is why you
    don''t have to specify it. Because you''re working with NAT, however, you need
    to specify the table type along with your iptables rule. NAT rules are created
    on what type of rule you need. Destination NAT (DNAT) uses the PRERUTING chain
    to manipulate the destination IP address. Source NAT (SNAT) uses the POSTROUTING
    chain to manipulate the source IP address. With SNAT, packets are adjusted before
    they are about to be routed. You need to create a firewall rule that makes use
    of this to allow all your clients on the internal network to be able to communicate
    with the outside world.


    +   Step 1. Use the following rule to implement NAT for the internal network:


    ```

    # iptables -t nat -I POSTROUTING -o eth0 -s 172.168.1.0/24 -j MASQUERADE

    ```


    The interface eth0 contains the outside IP address (172.168.1.5 for me). The internal
    network is 172.168.1.0/24 (which is configured on eth1). This rule allows clients
    on the internal network to point to this system (RHEL01) as the default gateway
    and have their requests for outside traffic, such as a web page or package download,
    forwarded to the correct external network. You also need to make an adjustment
    to the kernel for this NAT rule to function properly.


    +   Step 2. Make the following change to the kernel:


    ```

    # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    The preceding change is valid only until the system is rebooted. If you want the
    kernel parameter change to become permanent, you need to modify the kernel parameter
    on boot. Make sure that you save and restart the firewall service for the changes
    to take effect.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '> **TIP:** For the IP forward change to be persistent across reboots, add the
    following line to /etc/sysctl.conf:


    ```

    net.ipv4.forward = 0

    ```


    Whenever the system boots, the parameter is automatically changed in the kernel
    for you.


    Although you won''t see too much NAT configuration unless you are on a small home
    or office network, you should still know how it works and be able to troubleshoot
    it should there be a problem.


    # Pluggable Authentication Module


    Pluggable Authentication Module (PAM) includes a set of dynamically loadable modules
    that can be used to enforce security on the system. This does this by using a
    set of configuration files that check for different criteria (depending on the
    application or service being called). These config files are located in /lib/security
    for 32-bit systems and /lib64/ for 64-bit systems. Here are some of the available
    modules:


    +   # ls /lib/security

    pam_access.so pam_oddjob_mkhomerdir.so

    pam_creds.so pam_passwdqc.so

    pam_chroot.so pam_permit.so

    pam_console.so pam_pkcs11.so

    pam_cracklib.so pam_postgresok.so

    pam_debug.so pam_pwhistory.so

    pam_deny.so pam_rhosts_auth.so

    pam_echo.so pam_rhosts.so


    This is not the full list, but you can tell what of these modules do by just looking
    at their names. If a service can use of PAM, you can find a config file available
    in the /etc/pam.d directory. Again, there are many files located here that you
    can work with. To work with and make of PAM, you need to understand how the config
    files work.


    # Securing Access


    Each config file contains four columns using the following syntax:


    ```

    module_type          control_flag          module_name          [arguments]

    ```


    Further breaking down different options, there are four different module types
    used as a security mechanism:'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# 302 Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and
    Lab Manual


    | auth | Establishes identity |

    | account | Allows or denies access |

    | password | Manages password policies |

    | session | Applies settings to an application |


    There are also five different control flags that determine the action to be taken
    on success or failure:


    | required | Proceeds if passed; continues even on fail |

    | requisite | Stops on failure |

    | sufficient | Requires no other verification if true |

    | optional | Ignores success or failure |

    | include | Includes all module-type directives from another file |


    The third column is name of a file that should be called (usually the dynamic
    library file), including any optional arguments as well. Let''s look at one of
    the config files as an example:


    ```

    # /etc/pam.d/reboot

    #%PAM-1.0

    auth sufficient pam_rootok.so

    auth required pam_console.so

    #auth include system-auth

    account required pam_permit.so

    ```


    This PAM config file handles who can reboot the system. The first line uses the
    pam_rootok.so module, which returns true if the user who calls the command is
    the root user. If you are not the root user because of the “sufficient” control
    flag, no other requirements are necessary and the system reboots. If you are not
    the root user, the next line is called; it checks to see that you are logged in
    to console. The logic here is that you wouldnt want to reboot the system and have
    it come up in an unstable state without having physical console access. If this
    is the case, the final line is called (pam_permit.so), which always returns true
    so the system will reboot.


    PAM modules and their config files aren''t hard to use, but knowing how to read
    them and what they mean can take some practice. Make sure you understand the module
    types and control flags.'
  merge: -1
  pgno: 334
- img_proc: true
