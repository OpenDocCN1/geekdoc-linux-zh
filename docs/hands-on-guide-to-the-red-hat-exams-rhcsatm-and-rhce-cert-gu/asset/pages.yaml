  md: '# Updating the Kernel


    We all know how important it is to keep up with the patching process on our systems.
    It prevents people from breaking in and doing malicious things, not to mention
    it keeps the boss from yelling at us, too! To update the kernel package in Red
    Hat is fairly straightforward.


    Step 1. View the current version of the kernel:


    ```

    # uname -r

    2.6.32-71.el16.x86_64

    ```


    As learned in Chapter 6, "Package Management," you can use the yum command to
    query information about packages in the repository. You know from the preceding
    output that you are using version 71 of the kernel on Red Hat Enterprise Linux
    6. You can check to see what information the yum command can provide on the most
    recent version of the kernel package in the repositories.


    Step 2. To view kernel package information, use the following:


