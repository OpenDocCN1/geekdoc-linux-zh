    The last topic that we address is modifying the kernel through the use of /proc/sys
    file system.


    # Tuning the Kernel with /proc/sys


    One of the great things about Linux is that it works on so many different types
    of hardware out of the box. Although this is a great feature of Linux, it also
    requires developers of different distributions, such as Red Hat, to generalize
    settings for their versions of the operating system. This generalization is fine
    in most cases, but those who want extra processing power and better performance
    should tune your kernel.


    The kernel has a virtual file system, /proc/sys, that allows you to tune the kernel
    while the system is running. The kernel creates the /proc/sys virtual file system
    when the system boots up, which holds all the parameters of the kernel. This virtual
    file system is used to manipulate kernel parameters for testing purposes (these
    changes are valid only until the system reboots). When you have the kernel tuned
    the way you''d like, you can simply have your settings applied when the system
    boots (through a special config file), or compile your own kernel built permanently.
    As you are testing kernel changes, make sure you don''t rely on any settings within
    the /proc/sys file system because they are erased when the system reboots. During
    testing, you can use the echo command to change the values of the kernel while
    the system is running.


    Let''s look at an example showing how to allow the system to temporarily forward
    packets.


    +   Step 1. View the current value in the kernel:


    ```

    # cat /proc/sys/net/ipv4/ip_forward

    ```


    +   Step 2. Change the kernel option that controls packet forwarding:


    ```

    # echo 1 > /proc/sys/net/ipv4/ip_forward

    ```'
