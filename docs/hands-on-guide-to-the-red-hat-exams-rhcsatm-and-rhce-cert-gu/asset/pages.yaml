    Now user02, group user01, and everyone else on the system have read and write
    access to this file. You might be wondering where I 666 for the permissions? When
    you assign permissions with numerical values, you add up the values of the permissions
    for each section. Because I wanted to keep the user and group permissions and
    make sure that each read (4) and write (2) permissions (4+2=6). Because I want
    the "other" group to be the same, continued with the same numerical value, where
    is the 666 permissions come from. Being able to manipulate permissions is a difficult
    task may take some practice to understand at first.


    The last command that we look at is umask. You might be wondering where the permissions
    came from we first created file1 and file2? They were 664 as default permissions
    upon creation, where did that number come from? When users are created, they are
    assigned a umask value that defines all permissions for files and directories
    that users create. Let''s look at how that works.


    When files are created, they are given the default permissions 666 or rw-rw-rw-
    and directories are given the default permissions 777 or rwxrwxrwx. The umask
    command takes the default permissions and modifies them according to its mask
    value (through subtraction). Here is an example of how they are calculated:


    |File''s default permissions | 666 = 110 110 110 (in binary)

    Subtract the umask | 002 = 000 000 010 (in binary)

    Value you get afterward | 664 = 110 110 100 (in binary)|


    Now you have the default permissions 664 as shown previously. This calculation
    is the same with the directories:


    |Directory''s default permissions | 777 = 111 111 111 (in binary)

    Subtract the umask | 002 = 000 000 010 (in binary)

    Value you get afterward | 775 = 111 111 101 (in binary)|


    Now you have the default permissions 775 as shown previously.


    # Step 8. You can display the current value of umask to find out what it is by
    calling the umask command:


    ```

    # umask

    0002

