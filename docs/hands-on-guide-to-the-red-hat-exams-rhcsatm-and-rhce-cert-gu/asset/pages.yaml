  md: '# 134 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and
    Lab Manual


    These two files are automatically created in the top-level directory of the file
    system where you are turning on quotas—in this case, the /opt/company_data file
    system. To start the quota system, you use the quotacheck command.


    Syntax: quotacheck [options] <partition>


    +   - c Don''t read existing quota files

    - u Checks only user quotas

    - g Checks only group quotas

    - m Doesn''t remount the file system as read-only

    - v Provides verbose output


    The quotacheck command shouldn''t be run on file systems that are actively being
    used because it can cause corruption. Due to this logic, quotacheck tries to mount
    the file system as read-only to prevent damage. Because you don''t want the /opt/company_data
    partition to become read-only, you can use the -m option. You also know that there
    are no pre-existing quota files, so there is no chance that they might corrupt.


    +   Step 5. Create the quota files:

    # quotacheck -ugm /opt/company_data/


