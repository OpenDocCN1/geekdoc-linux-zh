- img_proc: true
  md: 'Look at the label for the SSH service main config file:


    ```

    # 11 -Z /etc/ssh/sshd_config

    -rw-r---- root root system_u:object_r:etc_t:s0    /etc/ssh/sshd_config

    ```


    Going through the label, you will see that the role is system_u (a user), the
    role is object_r (a file), and the domain is etc_t. Any service that has access
    to the etc_t is able to access this file. Systems usually are the only ones aside
    from the root user who has access to the /etc directory, so a domain of etc_t
    makes sense.


    # REAL-WORLD TIP


    In RHEL5, the SSH config file has a domain of unconfined_t while the SSH server
    has a domain of etc_t. You might be wondering why the SSH service has access even
    though it is in another domain (unconfined_t). The reason is that the unconfined_t
    domain is unprotected, making available to anyone. In RHEL6, many of the services
    and their config files have their labels changed.


    Although you haven''t installed a web server (that''s in Chapter 14, “Web Services”),
    contexts are important when creating websites because if the site doesn''t have
    the correct context, it is not accessible by the web server. To change the context
    of a file or directory, you can use the chchon command.


    Syntax: chchon [options] CONTEXT FILE


    Options:


    +   -f Suppresses error messages


    +   -u Sets user context


    +   -r Sets role context


    +   -t Sets type context (domain)


    +   -R Changes recursively


    +   -v Provides verbose output


    Let''s look at an example.


    Step 1. Change the user context from normal user to system user:


    ```

    # cd

    # touch myfile

    # ls -Z myfile

    -rw-r--r-- root root unconfined_u:object_r:home_t:s0 myfile

    ```


    Step 2. Now change the context:


    ```

    # chchon -vu system_u myfile

    context of myfile changed to system_u:object_r:user_home_t

    ```'
