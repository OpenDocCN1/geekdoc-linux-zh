    # The Upstart Conversion


    As already discussed, the new Upstart program uses jobs and events to run different
    services. The biggest issue with using Upstart is that there is no standard currently
    in place for store files. Currently, you can find jobs located in the /etc/init
    directory, you can find events located in the /etc/event.d directory, and there
    are still the traditional SysV Init directories. With the release of RHEL6, a
    few services have been moved over to use the new Upstart utility (such as the
    syslog service, which is responsible for system logs). Each job can include events
    that trigger additional jobs or system scripts. Let''s look at a sample job:


    ```

    # cat control-alt-delete.conf

    # control-alt-delete - emergency keypress handling

    #

    # This task is run whenever the Control-Alt-Delete key combination is

    # pressed. Usually to shut down the machine.

    ```


    ```

    start on control-alt-delete

    ```


    exec /sbin/shutdown -r now "Control-Alt-Delete pressed"

    You can see from the output that this job handles the pressing of the Control-Alt-Delete
    keys. exec defines the command executed when the key combination is pressed. From
    jobs, you can also define events:


    ```

    # ck-log-system-start

    # Upstart event

    # ck-log-system-start - write system start to log

    #

    ```'
