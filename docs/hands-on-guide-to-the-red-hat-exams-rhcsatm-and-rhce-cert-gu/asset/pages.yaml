  md: '# Chapter 4: File Systems and Such 119


    If you want to turn off the swap, you can use the swapoff command. I do not show
    how to use it here because you just set up the swap space.


    Syntax: swapoff [options] DEVICE


    Options:


    +   - Enables all swap devices

    - Silently skips devices that don''t exist

    - Verifies that the swap is running


    # REAL-WORLD TIP


    The big difference between the two swap types is that file system is easier to
    manage because you just move the swap file to any disk if you want. The swap partition
    would need to be removed, re-created, and so on. Although Red Hat recommends using
    a partition swap, file swaps are fast enough days with less administrative overhead
    to use them instead. One word of caution, is that you can use only one swap (of
    either type) per physical disk.


    # Mounting a File System


    You have created your partitions and given them all a file system to use. Now
    you''d like to use them. No problem! Before you use your new file systems, though,
    you need to connect them to the directory hierarchy through the use of the mount
    command. They can be mounted to any directory, which is referred to as a mount
    point. If you mount a file system on a directory that is not empty, everything
    within that directory becomes inaccessible. Therefore, you should create a new
    directory as a mount point for each of your file systems. There are only two commands
    for mounting file systems:


    | mount | Counts a file system |

    | umount | Unmounts a file system |


    So far, you have created a few file systems plus some swap partitions. Let''s
    get these file systems mounted on the system.


    +   Step 1. Start by going to the /opt directory, where you can make some directories
    serve as mount points.


    ```

    # cd /opt

    # mkdir company_data

    # mkdir backup

    ```'
