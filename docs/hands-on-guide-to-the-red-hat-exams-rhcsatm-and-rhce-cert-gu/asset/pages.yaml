    # Making Your Own RPM


    A key skill for a system administrator is being able to deploy your own custom
    software. However, you first need to build an RPM package that contains your custom
    software. This can seem like a large undertaking at first, but after a few times
    the process is pretty simple. To build an RPM, you must do the following:


    +   **Step 1.** Create a directory hierarchy.

    **Step 2.** Copy or create your source code into the directory hierarchy.

    **Step 3.** Create a spec file.

    **Step 4.** Build the RPM.


    The hierarchy that you create must meet the rpmbuild specification, which is composed
    of the following directories:


    +   BUILD contains scratch space used to compile software

    RPMS contains the binary RPM that is built

    SOURCES holds the source code for the RPM

    SPECS contains the spec file(s) (one per RPM)

    SRPMS contains the source RPM built during the process


    > REAL-WORLD TIP

    Notice that the directory names are shown in uppercase. This is a standard that
    you should follow when creating the directory hierarchy.'
