    # Firewall and SELinux Configuration


    The firewall and SELinux requirements for Squid are actually quite simple. Squid
    uses port 3128 by default for its communication, so you should open this port
    on the firewall. Both the TCP and UDP protocols are used.


    **Step 1.** Use the iptables command to create your firewall rules:


    ```

    # iptables -INPUT 5 -p tcp -m tcp dport 3128 -j ACCEPT

    # iptables -INPUT 5 -p udp -m udp dport 3128 -j ACCEPT

    ```'
