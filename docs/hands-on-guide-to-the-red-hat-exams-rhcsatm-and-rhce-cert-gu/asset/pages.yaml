    # Extra File System Commands


    From time to time, you need to perform maintenance on your file systems to en-

    sure reliability and optimal performance. Usually, for any maintenance purposes,

    you take the file system offline by unmounting it. Suppose your boss just came

    and tell you that you need to perform maintenance on the /dev/hdb1 file system

    this weekend.


    +   Step 1. Take your file system offline:


    ```

    # unmount /dev/hdb1

    ```


    Now let''s look at some of the different maintenance tasks you can per-

    form. Here are the file system maintenance commands you have to

    work with:


    blkid Displays block device attributes


    df Shows usage of the file system(s)


    e2fsck Checks ext file systems


    e2label Modifies the label on an ext file system


    finds Allows you to locate a specific file system


    resize2fs Resizes an ext file system attributes


    tune2fs Tunes each file system attributes


    First, you need to label the file system. Labels enable you to determine

    specific file system more easily with a common name, instead of

    /dev/hdb1. An added benefit is the system being able to keep its label

    even if the underlying disk is switched with a new one. To label a file

    system, use the e2label command.


