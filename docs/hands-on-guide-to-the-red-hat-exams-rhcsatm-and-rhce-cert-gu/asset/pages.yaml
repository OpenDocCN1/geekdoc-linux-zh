    # Automation with cron and at


    In any operating system, it is possible to create jobs that you want to reoccur.
    This process, known as job scheduling, is usually based on user-defined jobs.
    For Red Hat, this process is handled by the cron service, which can be used to
    schedule tasks (also called jobs). By default, Red Hat comes with a set of predefined
    jobs that occur on the system (hourly, daily, weekly, monthly, and with arbitrary
    periodicity). As an administrator, however, you can define your own jobs and allow
    your users to create them as well.


    Step 1. Although the cron package is installed by default, check to make sure
    it is installed on your system:


    ```

    # rpm -qa | grep cron

    cronie-1.4.2.e16.x86_64

    cronie-anacron-1.4.2.e16.x86_64

    crontabs-1.10.32.1.e16.noarch

    ```'
