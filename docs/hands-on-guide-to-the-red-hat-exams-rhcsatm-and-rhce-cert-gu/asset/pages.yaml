  md: '# Disks and Partitioning


    Disk partitioning is one of the many steps you must take when preparing a system
    for use. In each system the physical disk drives are divided up logically into
    partitions that allow you to store data on them (after a file system has been
    created, of course, but in the next chapter). There are also special types of
    partitions such as RAID that allow for increased performance, redundancy, or both.
    Lym, like RAID, is an advanced form of partitioning that eases management and
    makes growing for increased storage capacity simple. One key to remember is to
    always plan ahead. Will your partitions need to be bigger in the future? How should
    your drive be organized? Planning ahead will make you a better system administrator
    and also ease the pain of partition migration and management down the road.


    # Basic Partitions


    Working with disks is an important part of maintaining storage space on your system.
    Partitions determine how your storage space is carved out for use later by the
    system and its users. When adding storage or creating it for the first time, you
    should partition your disk into a logical format for use later. Many installers
    come with an "automated" partitioning option for those that don’t need a custom
    layout; however, most system administrators will want to lay out their own partitions.
    In the lab, RHEL01 is configured with four hard disks. You will use three of these
    drives (the smaller ones) to set up custom partitions. All are IDE (/dev/hdx)
    versus /dev/sdx for SCSI/SATA users. Before you begin partitioning, you should
    look at the drives currently available for use as well as the current partitions
    on any of these. You can use two different utilities when partitioning disks:


    ```

    fdisk Disk-partitioning utility

    ```


    ```

    part Another disk-partitioning utility

    ```'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'While fdisk is more common, it is slowly replaced by parted, which is more
    flexible. You can also use cat to check the output of various files on the /proc
    file system for information. The /proc file system is created by the kernel when
    the system boots and holds current information about the system (you learn more
    about the /proc file system in Chapter 10, “The Kernel”).


    To view information about the current partition layout, use the following command:


    ```

    # cat /proc/partitions | grep hd

    8 0 2097152 hda

    8 1 512000 hda1

    8 2 20458496 hda2

    8 16 8388608 hdb

    8 32 8388608 hdc

    8 48 8388608 hdd

    ```


    If you are using SCSI disks instead of IDE disks, you can just change the command
    to


    ```

    # cat /proc/partitions | grep sd

    ```


    As you can see from the output, you get a listing of four different disks: hda,
    hdb, hdc, and hdd.


    > NOTE: The first two letters represent whether the disk is a SCSI (sd) or IDE
    (hd) the third letter represents which disk it actually is. If there is a number
    after the three letters, it is the number of the partition. For the lab, you can
    see that they are all hdd disks, meaning they are IDE. There are also four physical
    devices: a, b, c, and d. Because no partitions are created yet on the last three
    disks (hdb, hdc, and hdd), there are no numbers. Meanwhile, you can see sda has
    three partitions.


    In this case, you want to partition the last three disks, so you need to view
    their current partitions to see if any exist. You can use the fdisk command to
    accomplish this.


    Syntax: fdisk [options] [device]


    Options:


    +   -b Specifies the sector size of the disk

    -h Specifies the number of heads on the disk

    -l Lists current partition tables'
  merge: -1
