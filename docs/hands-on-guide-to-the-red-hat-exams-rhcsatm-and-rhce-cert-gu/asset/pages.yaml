    # Logical Volume Manager


    LVM is a form of advanced partition management. The benefit to using LVM is ease
    of management due to the way disks are set up. Working with LVM, however, is one
    of the more complex topics to understand the first time you do it. After you have
    some practice, you will find that LVM makes life easier. When you set up your
    system for the first time, you have a number of physical disks (the lab has four
    for this book). These disks are the base of the LVM structure and referred to
    as physical volumes. The next layer in the structure is volume groups, where physical
    volumes are combined into a single pool of storage. The final layer in the structure
    is logical volumes, which are the actual partitions on the system.


    # GENERAL INFO


    Aside from physical disks, a partition can serve as a physical volume as well.'
