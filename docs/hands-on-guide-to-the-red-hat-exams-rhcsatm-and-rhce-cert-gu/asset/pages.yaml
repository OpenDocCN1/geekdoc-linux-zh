- img_proc: true
  md: 'most important point to understand, especially for the exam, how to add and
    troubleshoot firewall rules so that your services can function properly on the
    system. If you''re having difficulty figuring out why something is blocked, you
    can quickly disable the firewall to verify that it is indeed the firewall causing
    the trouble.


    Look at another real-world example, suppose you need to allow SSH access to your
    server but you would like to restrict it to the subnet that can connect.


    **Step 1.** You could do something like this:


    ```

    # iptables -I INPUT 5 -s 172.168.1.1/24 -p tcp --dport 22 -j ACCEPT

    ```


    This rule is a little more complex than the previous one. Here, you are appending
    to the input chain that rules anything from the source (-s) network 172.168.1.1/24,
    using the TCP protocol (-p tcp) allow port 22 (-dport 22). The end of this chapter
    explains iptables rules to help you gain a better understanding. If you get further
    into this book, you need to start configuring iptables rules for different services,
    learning how to work with the rules will only help you in the long run. When creating
    rules with iptables, make sure that you save and restart the iptables service
    after you finish editing rules because the new rules do not take effect until
