  md: 'Instructions: This lab is based on the lab setup outlined in the introduction
    to this book. It requires that you have a basic Red Hat installation on host RHEL01
    and RHEL02. You have 2.5 hours to complete this lab.


    Task 1: On RHEL01, create a kickstart server and a DHCP server. Using this kickstart
    server, perform a basic installation (no desktop managers) on Client02.


    Task 2: On RHEL02, implement the following:


    +   - Create the directory /opt/server_data.


    +   - Create a cron job that outputs the amount of free disk space in a file called
    data in the /opt/server_data directory.


    +   - This script should run every day at 3 p.m.


    Task 3: On RHEL01, configure an NTP server using GMT as the time zone.


    Task 4: Sync Client01 to the time server RHEL01.


    Task 5: On RHEL02, implement the following:


    +   - Set up an Apache web server.


    +   - Create two customer websites: csite_1 and csite_2 (these sites must be located
    in the /var/www/html directory).


    +   - Customer site 2 (csite_2) should be accessible only through the HTTPS protocol.'
  merge: -1
  pgno: 516
- img_proc: true
  md: '# Lab Exam 2


    **Task 6**: Set up a Samba server on RHEL02. It should have two shares: /opt/company_data
    and /opt/paychecks. The first share should be accessible by any user and have
    read/write permissions for the share. The second share should have read-only permissions.
    The two shares should be accessible only by hosts on the local subnet.


    **Task 7**: Set up RHEL01 as a caching-only DNS server for the local 172.168.1.0/24
    subnet. The domain should be example.org.


    **Task 8**: On RHEL02, set up user quotas in the /home directory. Create two users
    called user01 and user04. These users should not be able to create more than 20MB
    worth of data in their home directories (hard limit).


    **Task 9**: On RHEL01, create virtual hosts called example.com and example.net.
    Each site should have its own directory and be accessible over the HTTP protocol
    only. Block Client01 from accessing either website.


    **Task 10**: On RHEL01, set up a Squid proxy server on port 2228. Client01 and
    Client02 should be able to access the Web through this proxy.


    **Task 11**: On RHEL01, set up an SMTP server. Users from Client01 and Client02
    should be able to send out mail using this SMTP server (no TLS required).


    **Task 12**: On RHEL02, create a user called bjones. Generate a public/private
    key for bjones (no password required for key), and set up RHEL02 to allow only
    public key authentication from RHEL02. The user bjones should be able to connect
    into RHEL01 via SSH public key authentication.


    **Task 13**: On RHEL02, set up an NFS 4 version server. Create shares called /opt/students
    and /opt/teachers. All users from Client01 and Client02 should have read/write
    access to the /opt/students. The /opt/teachers share should be read-only. RHEL01
    should have no access to this NFS server. In addition, no root user from any remote
    system should have access to this server.'
