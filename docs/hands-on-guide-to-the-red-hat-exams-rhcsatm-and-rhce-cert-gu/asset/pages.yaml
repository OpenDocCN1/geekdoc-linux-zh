  md: 'biggest benefit using to the Red Hat Network is that it provides a central
    place to manage all your systems with ease. Each system you registers the network
    every four hours by default, although this setting can be changed. When it notices
    updates, it automatically adjusts to what has been configured for it through the
    web interface. This can also be a great help when you have satellite offices that
    are hard to get to or manage.


    # Registering Your System


    To register your system to the Red Hat Network, you must have an active subscription
    with Red Hat. You can register during the installation of your system or manually
    after the system has already installed. Use the rhn_register command to begin
    the registration process. After you finish, you can visit http://rhn.redhat.com
    to start managing your system(s) through the Web. You need to make sure that the
    rhnsd daemon is running in order for it to be managed.


    +   Step 1. Set the daemon to boot on start:


    ```

    # chkconfig rhnsd on

    ```


    +   Step 2. You should verify whether the service is currently running:


    ```

    # service rhnsd status

    rhnsd (pid 1985) is running...

    ```


    +   Step 3. If it is, you are all set; otherwise, start the service manually:


    ```

    # service rhnsd start

    Starting rhnsd:

    [ OK

    ```


    # Summary


    Learning to work with software is important because the rest of this book and
    the Red Hat exams you to install and configure different software packages. You
    also need to be verify that packages have been installed successfully and fix
    them when they are not. The package management process is not difficult and can
    be very useful for keeping your systems in order. As you become more skilled with
    package management, you will start to get a feel for what packages can also be
    safely removed from your system to prevent security attacks (this is called system
    hardening). When we get to network installs, you can also pick and choose specific
    packages through config files, making the install process much faster on your
    system.'
