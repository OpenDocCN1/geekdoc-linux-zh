    Step 2. Save the rules you just created:


    ```

    # service iptables save

    Saving firewall rules to /etc/sysconfig/iptables:    [ OK ]

    ```


    Step 3. Restart the firewall service for the changes to take effect:


    ```

    # service iptables restart    [ OK ]

    iptables: Flushing firewall rules:    [ OK ]

    iptables: Setting chains to policy ACCEPT: filter [ OK ]

    iptables: Unloading modules:          [ OK ]

    iptables: Applying firewall rules:     [ OK ]

    ```


    By default, you do not have to change SELinux for your Squid setup. You should
    know what the available options are, though:


    +   - squid_use_tproxy Squid to run as a transparent proxy (TPROXY)

    - squid_connect_any Allows Squid to connect to all ports, not just HTTP, FTP,
    and Gopher ports


    If you want to enable either of these features, make sure to adjust the SELinux
    Boolean value appropriately.


    > TIP: In RHEL5, you need to enable SELinux protection for the Squid service for
    it to work.

    Step 1. Query for the Boolean value you need to change:


    # getboolean -a | grep squid_dis

