    Okay, enough with the theory; let''s get started.


    # Creating an RPM


    Create an RPM by following these steps:


    +   **Step 1.** Install the required packages to build an RPM package:

    ```bash

    yum install -y rpm-build make

    ```


    +   **Step 2.** Verify the packages are installed correctly:

    ```bash

    rpm -qa | grep rpm-build

    rpm-build-4.8.0-12.e16.x86_64

    rpm -qa | grep make

    make-3.81-19.e16.x86_64

    ```


    Create the directory hierarchy to build in the /usr/src/redhat (which is a personal
    preference to build packages under the /usr/src/src directory).


    +   **Step 3.** Create the required directories:

    ```bash

    mkdir -p /usr/src/redhat/{BUILD,RPMS,SOURCES,SPECS,SRPMS,tmp}

    ```


    The temp directory is used as a temporary build directory as well. When building
    a package, you need some additional items. The SOURCES directory is a compressed
    file (.tar.gz) that contains the source files of the software which you want to
    create a package. Note that the Red Hat require you to be able to build only a
    single-file RPM, so you don''t need a full software suite to make this work.


    +   **Step 4.** Create a directory with sample files that you''d like in the package:

    ```bash

    mkdir /usr/src/redhat/mysample

    cd /usr/src/redhat/mysample

    touch first_second_keys config_file

    ```


    +   **Step 5.** Create an archive file based on your sample source:

    ```bash

    cd /usr/src/redhat

    tar cf mysample.tar.gz mysample

    m mysample.tar.gz SOURCES/

    ```


    +   **Step 6.** One final step before package creation involves the creation of
    a spec file. The spec file is the set of instructions used to create the actual
    package itself. If you couldn''t guess, this file must be located in the SPECS
    directory. Here is a sample spec file to use for this package:


    Summary: This package is a sample for the Red Hat exams.

    Name: mysample

    Version: 1.0

    Release: 0'
