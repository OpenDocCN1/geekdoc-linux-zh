  md: '# Chapter 13: Remote Access 317


    When the public key is in place, you also need to adjust your main con-

    fig on the SSH server (RHEL01) to allow authentication via

    public/private keys.


    +   Step 3. In the sshd_config file, change the following options:

    PasswordAuthentication no

    PubKeyAuthentication yes


    This change prevents users from logging on with anything but their

    public/private key combination.


    +   Step 4. Restart the SSH service for the settings to take effect:

    # service sshd restart

    Stopping sshd: [ OK ]

    Starting sshd: [ OK ]


    +   Step 5. Try to connect to RHEL01 as user01 from the Client02 host to ensure

    that the key authentication is working properly:

    # ssh user01@172.168.1.1

    user01@172.168.1.1:password:

    Last login: Thu Jun 3 06:22:22 2010 from 172.168.1.20

    [user01@RHEL01 ~]$


    # Port Forwarding


    As already mentioned, port forwarding allows you to connect to a centralized gate-

    way forming additional connections within your network. This capability

    increases security by forcing all connections to flow through a centralized gateway

    where auditing usually takes place to keep track of who is logged in. This central-

    ized management is accomplished through the use of port forwarding, where each

    connection is made to the gateway and then forwarded to another.


    Syntax: ssh username@hostname -L local-port:remote-hostname:remote-port


    Let''s look at an example. Suppose on RHEL01 you want to create a port forward

    to RHEL01 and allow SSH connections to come only from RHEL01. You can use

    t following command to use the initial tunnel on RHEL01:


    ```

    # ssh user01@172.168.1.2 -L 1234:172.168.1.2:22

    ```


    After executing this command on RHEL01, you should now have a tunnel forwarded
    to RHEL02. Other users can now use SSH locally on RHEL01 to be forwarded to

    RHEL02.


    Another example would be sending all traffic to a specific site:


    ```

    # ssh -N -L 8080:localhost:80 <site>

    ```'
