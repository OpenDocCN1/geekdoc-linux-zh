  md: 'The first half of the book, Chapters 2 through 12, covers the following topics:


    +   Chapter 2, “System Initialization”—This chapter focuses on how to manage system
    services, system levels, and everything that occurs during the boot process. It
    also looks at how services work and are started and stopped.


    +   Chapter 3, “Disks and Partitioning”—This chapter addresses partitioning Red
    Hat systems. It discusses basic partitions, LVM, and RAID. Also covered are swap
    partitions and advanced use of LVM for in-depth storage management. This chapter
    prepares you to work with systems in Chapter 4.


    +   Chapter 4, “File Systems and Such”—This chapter follows up where Chapter 3
    left off. It describes file systems, how they work, and how to manage them. Also
    discussed are the LUKS encryption options and file system security.


    +   Chapter 5, “Networking”—This chapter is all about networks. Nothing can happen
    unless you can communicate with other systems. This chapter describes how to set
    up and troubleshoot network connections and client-side DNS problems.


    +   Chapter 6, “Package Management”—This chapter examines how to install, search
    for, and remove software from Red Hat systems. It covers many ways to work with
    packages, including building your own packages and repositories.


    +   Chapter 7, “User Administration”—No system would be complete without its users.
    This chapter covers user administration (creating, managing, and deleting). Also
    covered are switching between users and client-side authentication.


    +   Chapter 8, “Network Installs”—To make life easier, you can use installations.
    This chapter covers kickstart and how it can aid in the installation of Red Hat
    Enterprise Linux. Also covered is hands-free installation with DHCP and PXE boots.


    +   Chapter 9, “System Logging, Monitoring, and Automation”—This chapter dives
    into system logging and monitoring and how to interpret that data. It looks at
    different ways to find problems (or their answers). Also discussed is the automation
    of system monitoring.


    +   Chapter 10, “The Kernel”—This chapter discusses updating and tuning the kernel
    properly. Although the kernel is not a huge topic, it is important to address
    critical security issues with any system.


    +   Chapter 11, “SELinux”—This chapter covers one of the most complex topics in
    the book. It describes how to set up and work with SEL without giving you a headache.
    Also covered is how to work with SELinux Boolean values to allow services to run
    properly.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Preface xxxxi


    +   Chapter 12, "System Security"—This chapter talks about all system security,
    including TCP Wrappers, firewall rules, and security policies. Because firewall
    rules play a heavy role in all systems, the second half of the book covers this
    topic in particular.


    The second half of the book, Chapters 13 through 21, covers the following topics:


    +   Chapter 13, "Remote Access"—This chapter demonstrates how to remotely and
    manage your Red Hat systems. It covers SSH, the most popular remote management
    tool in Linux. Also covered is VNC for remote desktop management.


    +   Chapter 14, "Web Services"—This chapter discusses how to set up and manage
    Apache web servers. Because it is the most widely deployed web server in the world,
    this also covers the Squid proxy and how to use it in conjunction with Apache.


    +   Chapter 15, "NFS"—This chapter discusses network file systems. A great choice
    for centralized servers, NFS has many benefits over its SMB and FTP counterparts.
    Also covered in this chapter is connecting clients to NFS servers.


    +   Chapter 16, "Samba"—This chapter discusses Samba and how to set it up. Samba
    progresses more and more, integration with Windows becomes easier for Linux systems.
    The chapter describes how to set up basic shares and printer services for Windows
    and Linux systems.


    +   Chapter 17, "FTP"—This chapter explains how to set up and use an FTP server.
    FTP is great for sharing files both securely and insecurely. The chapter describes
    the benefits of more, including how to troubleshoot FTP issues.


    +   Chapter 18, "DNS"—This chapter discusses DNS works, server setup, and management
    of DNS servers. Although this is one of the most complex topics in the book, it
    is one of the easiest to work with you understand it. This chapter also delves
    into different types of DNS servers.


    +   Chapter 19, "Network Services"—This chapter discusses setting up the core
    network services for your network. Topics include DHCP servers, NTP for time management,
    and more.


    +   Chapter 20, "Email Services"—This chapter explains how to properly set up
    different types of mail servers. Because email is one of the most critical business
    components, it is essential to understand how to work with this technology. The
    chapter also covers how to secure your mail servers so you don''t get overun by
    spammers.


    +   Chapter 21, "Troubleshooting"—This chapter discusses different troubleshooting
    steps for a variety of topics. Although this chapter doesn''t cover all troubleshooting
    discussed throughout the book, it does cover the big topics that you should know
    for the exam.'
