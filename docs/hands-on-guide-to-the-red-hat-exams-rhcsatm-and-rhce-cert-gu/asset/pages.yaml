    by using the following:

    # mount i grep quota_data

    /dev/hdb1 /opt/company_data type ext4 (rw,usquota,grpquota)


    With the quota options now in place in the /opt/company_data file system, you
    can begin setting quotas for users. There are two files that maintain quotas for
    users and groups:


    +   aquota.users User quota file

    aquota.group Group quota file'
