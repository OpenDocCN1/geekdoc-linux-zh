    # Managing a Virtual Client


    As much as you can create virtual guests, you also need to manage them after they
    have been created. Management includes tasks such as starting/stopping, rebooting,
    taking a snap-shot (also saving), and migrating. These tasks can all be accomplished
    through the virt-manager utility, but on the command line, you can use the virsh
    command.'
  merge: -1
  pgno: 509
- img_proc: true
  md: '# 478 Hands-on Guide to the Red Hat® Exams: RHCS™ and RHCE® Cert Guide and
    Lab Manual


    Syntax: virsh [options] [commands]


    Options:


    +   -c Connects to a hypervisor

    -r Connects with a read-only connection

    -q Opens in quiet mode

    -1 Outputs logging to a file


    Similar to the virt-install command, virsh has way too many subcommands to list
    here. Let''s look at only the management commands for now:


    +   help Prints basic help information

    list Lists all the virtual guests

    dumpxml Outputs the XML config file for a guest

    create Creates a virtual guest based on an XML file

    start Starts an inactive guest

    destroy Forces a guest to stop

    define Outputs the XML config file for the guest

    dmid Displays the guest ID

    duuid Displays the guest UUID

    ddominfo Displays the guest information

    domain Displays the guest''s name

    domstate Displays the state of the state

    quit Quits the interactive terminal

    reboot Reboots a guest

    restore Restores a previously saved guest from a file

    resume Resumes a paused guest

    save Saves the present state of a guest

    shutdown Shuts down a guest gracefully

    sus Pauses a guest

    undefined Deletes all files relating to a guest

    migrate Migrates the guest to another host (live migration possible)'
  merge: -1
  pgno: 510
- img_proc: true
  md: '# Chapter 22: Virtualization with KVM


    You can see that this is a hefty list, but you should know most of these commands
    if you''ve worked with virtualization previously. Before you can use the virsh
    command to manage your virtual guests, you need to connect to the correct hypervisor
    (on the physical host) to gain access to the virtual guests.


    Connect to the hypervisor on RHEL03, the physical host:


    ```

    # virsh connect RHEL03

    ```


    Now that you have connected, you can manage any of the virtual hosts attached
    to this hypervisor.


    # REAL-WORLD TIP


    After you attach to a hypervisor, use the list command to display all available
    virtual guests:


    ```

    # virsh list --all

    ```


    # Monitoring Virtual Resources


    If you recall the way back in Chapter 9, “System Logging, Monitoring, and Automation,”
    we discussed tools and commands that could be used to monitor system resources.
    When you''re dealing with virtualization, there is also a need to monitor system
    resources; however, this time you want to see what''s going on with all your virtual
    guests, not just the physical host. To accomplish this, let''s look at the virsh
    command again with a different set of options.


    | setmem | Sets the allocated memory for a guest |

    | setmaxmem | Sets the maximum memory limit for the hypervisor |

    | setvpus | Changes the number of virtual CPUs assigned to a guest |

    | vcpuinfo | Displays virtual CPU information about a guest |

    | vcpupin | Controls the virtual CPU affinity of a guest |

    | domstat | Displays block device statistics for a guest |

    | domifstat | Displays network interface statistics for a guest |

    | attach-device | Attaches a device to a guest |

    | attach-disk | Attaches a new disk to a guest |

    | attach-interface | Attaches a new network interface to a guest |'
  merge: -1
