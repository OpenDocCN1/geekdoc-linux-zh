    Another useful tool can help test whether your DNS server is functioning properly
    is the host command.


    Syntax: host [option] HOSTNAME


    Options:


    +   - Allows you to perform zone transfers

    - r Disables recursive processing

    - t Specifies the query type

    - v Provides verbose output'
