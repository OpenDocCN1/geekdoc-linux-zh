  md: '# CHAPTER 12


    # System Security


    I''d like to start off this chapter by saying that because I''m a person who is
    nuts about security, I think this is one of the most important chapters in the
    book. One of the biggest reasons for system compromise these days isn''t that
    some elite hacker is breaking in and circumventing the multiple layers of security
    on your network; it''s that some system administrators couldn''t take five minutes
    to close the door! We look at defense in depth, starting with TCP Wrappers, iptables
    (which are used to set up the firewall), and the Plgable Authentication Module
    (PAM). If there is one chapter that you should spend a good deal of time reading,
    and not just for the exam, this is the one.


    # Security Through TCP Wrappers


    TCP Wrappers is a host service that can be used to limit or control access from
    remote hosts. Although it is installed by default, verifying things manually is
    always good. First, check for the TCP Wrappers package to make sure it is installed:


    ```

    # rpm -qa | grep wrappers

    tcp_wrappers-7.6-56.3.el16.x86_64

    tcp_wrappers-libs-7.6-56.3.el16.x86_64

    ```


    Now that you know the service is installed, you can begin to configure it for
    access control. You can limit access to either users or hosts via the /etc/hosts.allow
    and /etc/hosts.deny file (you can match and both users and hosts in file). The
    order in which items are defined within these two files is important! The TCP
    Wrapper service scans the two files in the following fashion:


    +   - Search the hosts.allow file.

    - Search the hosts.deny file.

    - If not found in either, allow.


    The TCP Wrapper service itself uses the following syntax in the two already-mentioned
    files:


    ```

    <daemon_list> : <client_list>

    ```'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 292 Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and
    Lab Manual


    Aside from being able to define a hostname or IP address in the client_list_field,
    you can also define any of the following six keywords:


    +   - ALL: Specifies all networks


    +   - LOCAL: Specifies the local network


    +   - EXCEPT: Excludes a particular user/client


    +   - KNOWN: Indicates hosts that can be resolved by the system


    +   - UNKNOWN: Indicates hosts that can''t be resolved by the system


    +   - PARANOID: Specifies that the forward and reverse lookup IP address not


    These keywords can be used to help keep your rule under control. Instead of defining
    each host within your network, you can just use the keyword LOCAL instead.


    Let''s look at a few examples to help drive the home point. Suppose that you want
    to restrict access to the SSH service and allow connections only from the local
    network. In this case, you would use the following rule in /etc/hosts.allow:


    ```

    sshd : 172.168.1.1.

    ```


    First


    ```

    sshd : 172.168.1.1

    ```


    With the preceding line, connections would be allowed only from the host 172.168.1.0/24
    subnet.


    > REAL-WORLD TIP

    In the real world, it is highly recommended that you use TCP Wrappers to lock
    things like SSH to your local subnets. This prevents people on the side from accessing
    the servers unless they are on the correct subnet. Usually, end users are on their
    own subnet, denying them access to any management connections.


    Going further with this example, what if you want to allow all users from the
    172.168.1.0/24 network except the 172.168.1.100 host? Then you could use the following
    rule in /etc/hosts.allow:


    ```

    sshd : 172.168.1.1 EXCEPT 172.168.1.100

    ```'
