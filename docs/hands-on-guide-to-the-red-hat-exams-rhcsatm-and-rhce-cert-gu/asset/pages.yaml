    # VNC Servers


    Having remote access to a server is great, but what happens if an end user calls
    in says she''s having problems with her system? Chances she isn''t using just
    a shell and the server has become messed up. You don''t have to use SSH to fix
    the problem remotely because there is always an alternative: VNC. The VNC server
    allows you to remote into the user''s system and view her desktop. With the end''s
    desktop view, you can more easily troubleshoot issues she is having. Setting up
    a VNC server isnt hard, and in fact, it sometimes comes preinstalled as part of
    a desktop package.


