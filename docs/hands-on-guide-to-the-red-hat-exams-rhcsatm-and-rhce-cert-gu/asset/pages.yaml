  md: '# # Introduction


    Everyone has to start somewhere, and Linux administrators and engineers are no
    exception. If you have purchased this book, I imagine that your goal is to pass
    the Red Hat exams (RHCSA and RHCE) while acquiring or improving your current Linux
    skills. This introduction covers user-level commands that you will be required
    to know before you embark on your journey of becoming a system administrator or
    engineer. These skills and commands are all essential for knowing how to work
    with Linux, not just Red Hat. Although the current Red Hat Exam Prep Guide doesn''t
    list (and can''t) all the commands covered in this introduction, everything covered
    is required for you to get through the rest of this book. This is no way a complete
    list of every user-level command, but it is everything you need to get started.
    Many of the topics here are also covered later in the book. If you already have
    a decent set of Linux skills, most of this introduction will probably be a review
    for you.


    # # File and Directory Management


    For you to be able to work with different parts of the system, you need to know
    how to get around the system! In this section, we look at the following commands:


    +   - `ls` Displays the contents of a directory

    - `cp` Copies files or directories from one location to another

    - `mv` Moves or renames files and directories

    - `cd` Changes the current location

    - `rm` Deletes files or directories

    - `touch` Creates empty files

    - `mkdir` Creates a directory

    - `pwd` Shows the present working directory

    - `file` Displays the type of a file

    - `head` Displays the beginning of a file

    - `tail` Displays the end of a file'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# 4 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and Manual


    This might seem like a lot of commands to start with; however, they are all simple
    to use, which makes explaining them easy. First, let''s start displaying a directory
    on the system using the ls command.


    Step 1. List the contents of the current directory:


    ```

    # ls

    Desktop Documents Downloads Music Public Templates

    Videos

    ```


    Although you can''t tell because this book is black and white, these directories
    are displayed in blue, alerting the user to the fact that they are indeed directories.
    Although it''s great to have all these directories, how do you know where you
    are on the system? To view your current location, you can use the pwd command.


    Step 2. Show the current location:


    ```

    # pwd

    /home/user01

    ```


    Presently, you are in user01''s home directory, the output of the ls command was
    all directories that belong to user01. Let''s move out of user01''s home directory
    into one of the subdirectories. Using the cd command, you can move between different
    directories.


    Step 3. Move down one level into the Documents directory:


    ```

    # cd Documents/

    ```


    > REAL-WORLD TIP

    The trailing slash (/) is optional when you''re using the cd command. It indicates
    that the name being specified is a directory.


    Step 4. Now view the current location again:


    ```

    # pwd

    /home/user01/Documents

    ```


    What if you want to move up one level to the directory you just came from? If
    you use ls, you don''t see the user01 directory listed. You can, however, view
    two special directories.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Step 5.


    View all hidden directories with the ls -a command:


    ```

    # ls -a

    ..

    ```


    Notice what seems like just a bunch of dots? They actually stand for two special
    types of directories. The first—the single —stands for the current directory.
    The second—double ..—is the directory where you are located.


    # Step 6.


    To get back to the previous user0 directory, use the following:


    ```

    # cd ..

    ```


    # Step 7.


    Verify with the pwd command:


    ```

    # pwd

    /home/user0

    ```


    Now you should be able to navigate around the system.


    Let''s move on creating files and directories. First, let''s look at directory
    creation.


    Syntax: mkdir [option] DIRECTORY


    Options:


    +   - -p Creates a parent directory as needed

    - -v Provides verbose output


    # Step 1.


    Create a new directory called test:


    ```

    # mkdir test

    ```


    # Step 2.


    Create a new set of directories within another:


    ```

    # mkdir -p another/quick/test

    ```


    Because none of the directories you just chose exist, they are all created, including
    the subdirectories named quick and test.


    # Step 3.


    Verify the directory creation with the ls command:


    ```

    # ls another

    quick

    ```'
  merge: -1
