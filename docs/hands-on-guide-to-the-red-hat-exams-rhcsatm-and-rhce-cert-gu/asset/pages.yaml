    | | | |

    |---|---|---||

    | LV | Logical Vol | Logical Vol | LV |

    | Volume Group | | |

    | Physical Volume | Physical Volume | Physical Volume


    **Figure 3-1** The LVM structure.


    There are many commands and management utilities for working with LVM. Here is
    an overview of them:


    +   * pvs Displays physical volumes

    * vgs Displays volume groups

    * lvs Displays logical volumes

    * pvdis Displays detailed information on physical volumes

    * vgdisplay Displays detailed information on volume groups

    * lvdis Displays detailed information on logical volumes

    * pvcreate Creates a new physical volume

    * vgcreate Creates a new volume group

    * lvcreate Creates a new logical volume

    * vgxtend Extends an existing volume group

    * lvxtend Extends a logical volume

    * lvresize Resizes a logical volume

    * lvreduce Reduces a logical volume

    * lvrename Renames a logical volume

    * pmove Moves/migrates data from one physical volume to another'
