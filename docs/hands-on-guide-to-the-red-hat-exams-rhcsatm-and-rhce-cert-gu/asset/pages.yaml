  md: '# CHAPTER 11


    # # SELinux


    Security Enhanced Linux (SELinux) is another layer of security for the Linux operating
    system. Developed by the National National Security Agency (NSA), it adds protection
    for different files, applications, processes, and so on. Many users are just starting
    out to turn off SELinux because it is a complex system that can take much time
    and effort to get used to. Instead of turning it off, however, you could use SELinux
    in “permissive” mode, which allows everything to function normally but logs warnings
    when actions or commands would be blocked. Running in this mode is good for troubleshooting
    and gaining an understanding of how SELinux works. For the Red Hat Exam, however,
    you need to know how to work with SELinux enabled and enforcing.


    # ## Understanding SElinux


    As already stated, SELinux can be quite complex. Let’s start with some of the
    basics of understanding SELinux. It can run in three different modes:


    +   - disabled SELinux is turned off and doesn''t restrict anything.

    - permissive SELinux is turned on, but it logs warnings only when an action normally
    would been blocked.

    - enforcing SELinux is turned on and blocks actions related to services.


    Aside from these three modes, there are numerous commands that you can use for
    the management of SELinux:


    +   - sestatus Shows the current status of SELinux

    - getenforce Shows the enforcing status of SELinux

    - setenforce Changes the enforcing status of SELinux

    - getsebool Returns the Boolean value of a service option

    - setsebool Sets the Boolean value of a service option

    - chcon Changes the context of a file, directory, or service

    - restorecon Resets the context of an object'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'Before you start using commands, you should look at the further breakdown of
    SELinux. Each file, directory, and service on your system has a context that is
    used to prevent or allow actions (see Figure 11-1). SELinux verbose these contexts
    along with Boolean values to permit certain actions or services to run.


    ![](img/6f327e3a1ee7ed861fc5243dfa758aa6_310_0.png)


    **Figure 11-1** Files, directories, and all services have contexts.


    Let’s start by looking at the current mode that SELinux is running in. For this,
    we can use the sestatus command.


    Syntax: `setstatus [options]`


