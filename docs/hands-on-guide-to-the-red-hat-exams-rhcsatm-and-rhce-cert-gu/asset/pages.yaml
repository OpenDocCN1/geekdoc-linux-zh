  md: 'strength “credits.” By default, you get only one credit for each category,
    but you can also adjust that. Here are the available configurable options:


    +   - minlen Controls the minimum password length (default is 6)


    +   - retry Specifies the number of times to retry before an error is issued


    +   - difok Specifies the number of characters that need to be different between
    password changes (default is 5)


    +   - dcredit Credit for digits in password (default is 1)


    +   - ucredit Credit for uppercase letters in password (default is 1)


    +   - lcredit Credit for lowercase letters in password (default is 1)


    +   - ocredit Credit for special characters in password (default is 1)


    You can edit each option to give credit (or not) when creating a user password.
    You need to consult your company’s password policy to determine which options
    should be set. You can practice editing each option to see how they will affect
    the complexity of your system passwords.


    # # Summary


    Dealing with security for the Red Hat exam or in the real world is no small task.
    In the first section, we described TCP Wrappers, which helps with securing services
    that support it. Next, we looked at firewall rules with iptables and NAT, which
    help to enforce security on the system. Finally, we discussed PAM, which provides
    modules for securing of different services and actions on the system. Each part
    of this chapter plays a role in providing security to different parts of the system.
    It takes practice and experience to learn the proper way to configure, monitor,
    and troubleshoot security effectively. Security is also important throughout the
    rest of the book because you need to use what you learned here to work with the
    other services.


