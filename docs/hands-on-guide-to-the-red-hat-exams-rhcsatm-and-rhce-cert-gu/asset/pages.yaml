    # MIGRATION TIP


    In RHEL5, there was a Boolean with the value <service>_disable_trans. This one
    Boolean protects each service and prevents it from being accessed unless the value
    is changed. In RHEL6, this Boolean no longer exists for each service, but the
    number of Booleans for each service has expanded, offering more detailed protection.
    If you are still using RHEL5, you need to change the <service>_disable_trans Boolean
    to have a value of on for the service to work correctly.


    After deciding which Boolean you''d like to change, you need to enable or disable
    the value appropriately. To enable or disable a Boolean, you can use the setbool
    command. When using the command, you also need to use the -P option for the change
    to be persistent.


    Syntax: setbool [options] {boolean = <on (1) | off (0)>


    Option:


    +   -P Makes changes persistent


    From the option listed here, suppose you want to be able to access your home directory
    through the web server. In that case, you need to adjust httpd_enable_homedirs
    Boolean for this to happen. Change the value to disable protection of this particular
    option:


    ```

    # setbool -P httpd_enable_homedirs

    Notice that this command uses the -P option to make sure that the changes are
    persistent until reboot. Verify that it has been enabled:

    ```


    ```

    # getbool httpd_enable_homedirs

    httpd_enable_homedirs -> on

    ```


    Now the web server allows you to access your home directory through the Web, making
    it easy to share files. Although this isn''t something I recommend doing, it does
    serve as a good example of how Booleans work in conjunction with services. As
    you have already seen in earlier chapters, Booleans are important for different
    services. The following chapters of this book will deal with different services
    and cover the exact Booleans you need to know for each service to make them work
    properly.'
