  md: '# Troubleshooting File Systems


    This section covers details about file system and partition issues.


    The System Complains About a File System Label


    When creating entries in the /etc/fstab file (which are at boot time), you can
    use a label instead of the actual partition path to make things easier for you
    to read and find. If some reason, the label changes and you haven''t updated the
    /etc/fstab file, you receive an error. If this error is on the root file system,
    you need to enter single-user mode and adjust the /etc/fstab file before the system
    boots properly.


    The Superblock Has Become Corrupt


