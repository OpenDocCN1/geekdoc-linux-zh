  md: '# 6 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and Manual


    ```

    # cd another

    # ls

    Test

    ```


    **Step 4.** Return to the home directory:


    ```

    # cd /home/user01

    #pwd

    /home/user01

    ```


    As you will see throughout this book, there are a lot of quick tricks to navigating
    the system. Because the directories are all created successfully, let''s move
    on to files. Using the touch command, you can create blank files.


    **Step 5.** Create a file called test1:


    ```

    # touch test1

    ```


    **Step 6.** Verify its existence:


    ```

    # ls

    test1

    ```


    Sometimes files need to be created before you can use them, which is why the touch
    command is useful. You might also want to use a blank file as a placeholder for
    something later. If you are unsure what type of file something is, you can use
    the **file** command to find out.


    **Step 1.** Check the file type of test1:


    ```

    # file test1

    test1: empty

    ```


    **Step 2.** Check the type of /etc/passwd file on the system:


    ```

    # file /etc/passwd

    asswd: ASCII text

    ```


    Along with being able to create and determine file types, however, when you don''t
    need to read them as well. There are many times, you don''t need to read the whole
    file (think log files), but instead just view a few entries from that file. Using
    the **tail** and **head** commands, you can view either the beginning or the end
    of a file.


    Syntax: `head [options] FILE


    Options:


    +   -n Specifies the number of files to print


    +   -v Provides verbose output'
