  md: "# Chapter 2: System Initialization 49\n\nThings start to get tricky here. In\
    \ Red Hat Enterprise Linux 6 (RHEL6), the boot sequence has changed to now use\
    \ Upstart. Because many systems will still be using Red Hat Enterprise Linux 5\
    \ (RHEL5) for a while, you should also know how the traditional SysV Init process\
    \ works. Understanding both can also help with migration issues. Let's continue\
    \ for the moment with the traditional SysV Init first and then look at the new\
    \ implementation with Upstart.\n\nThe init program is the first process created\
    \ by the kernel. It is responsible for the rest of the boot process and setting\
    \ the environment for the user. First, it consult the /etc/initab file, which\
    \ defines how the rest of the boot process will go. The /etc/initab file lists\
    \ the default runlevel to boot into and the system initialization script (/etc/rc.d/rc.sysinit).\
    \ I describe what a runlevel is and how it is used later in this. Let's look at\
    \ the /etc/initab file to see what the init process goes:\n\n```\n# cat /etc/initab\n\
    # initab This file describes how the INIT process should set up the system in\
    \ a certain run-level.\n# Author:      Miquel van Smorengenberg, <miquels@drinkel.nl.mugnet.org>\n\
    \                     Modified for RHEL Linux by Marc Ewing and Donna Barnes\n\
    ```\n\nDefault runlevel. The runlevels used by RHS are:\n\n+   # 0 - halt (DO\
    \ NOT set initdefault to this)\n# 1 - Single user mode\n# 2 - Multiuser, without\
    \ NFS (The same as 3, if you do not have networking)\n# 3 - Full multiuser mode\n\
    # 4 - unused\n# 5 - X11\n# 6 - reboot (DO NOT set initdefault to this)\n\n```\n\
    id:5:initdefault.\n\n# System initialization.\nsii::sysinit:/etc/rc.d/rc.sysinit\n\
    \n10:0:wait:/etc/rc.d/rc 0\n11:1:wait:/etc/rc.d/rc 1\n12:2:wait:/etc/rc.d/rc 2\n\
    13:3:wait:/etc/rc.d/rc 3\n14:4:wait:/etc/rc.d/rc 4\n15:5:wait:/etc/rc.d/rc 5\n\
    16:6:wait:/etc/rc.d/rc 6\n```"
