    # Compression and Archiving


    One of the great things about Linux is that many things don''t have a standard.
    This allows for various implementations and customizations among many different
    software programs and practices. This can also be a downfall. As you will learn
    when you become a system administrator, backups are the number one priority. If
    something should crash or become corrupt and you can''t restore it because you
    aren''t keeping up with your backups or you don''t just keep, you may be looking
    for a new job. Although we don''t address backup programs here, this is a good
    lead into archiving and compression. For that task, we look at a single command
    in this section:


    tar Used for compressing and archiving files and directories


    The tar utility has a monstrous number of options, so it would be impossible to
    cover them all here. Instead, let''s focus on some common options used in this
    book.


    Syntax: tar [options] [FILE]'
  merge: -1
  pgno: 55
- img_proc: true
  md: '24 Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    Options:


    +   - c Creates a new archive


    +   - d Finds differences between the archive and file system


    +   - f Specifies the archive file to use


    +   - p Preserves file and directory permissions


    +   - t Lists the files in an archive


    +   - v Produces verbose output


    Right away, you should be able to see that this little utility would be perfect
    to create an archive of files and directories that you could keep as a backup.
    Although using this solely as a backup strategy isn''t recommended, it is useful
    for transferring a group of files and directories quickly. Let''s look at some
    examples showing how to use the tar command.


    Step 1. Create some random blank files:


    ```

    # touch cvf file1 file2 file3 another_file

    ```


    Step 2. With the files in place, create a simple archive containing these files:


    ```

    # tar cvf sample.tar file1 file2 file3 another_file

    file1

    file2

    file3

    ```


    Step 3. Of course, you know that you can also use some of the other tricks you
    learned already to make this task easier:


    ```

    # tar cvf sample.tar <file>

    another_file

    file1

    file2

    file3

    ```


    When an archive is created, you can also apply compression to reduce the amount
    of space the archive takes up. Although multiple types of compression are supported
    with the use of tar, we look only at gunzip (.gz) and bzip2 (bz) here.


    Step 4. Let''s re-create the archive using the gunzip compression:


    ```

    # tar cvf sample.tar.gz <file>

    another_file

    file1

    file2

    file3

    ```'
