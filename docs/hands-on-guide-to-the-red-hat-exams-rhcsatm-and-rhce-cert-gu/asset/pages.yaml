  md: 'Assuming your permissions and security restrictions are correctly in place,
    you should now be able to move into the /mnt/company_data directory and actually
    access the NFS share on the server. If you don''t want to always mount NFS shares
    after your system has booted, you can, of course, add an entry to the /etc/fstab
    file to have them mounted automatically at system boot.


    **Step 1.** In the /etc/fstab, add the following line:


    ```

    # nano /etc/fstab

    rhel1:/opt/company_data             /opt/company_data   nfs

    rw,sync 0 0

    ```


    You should recall the syntax of this file from Chapter 4, "File Systems and Much."
    It mounts the remote /opt/company_data to the local /mnt/company_data directory.


    **MIGRATION TIP**nAgain, if you are on RHEL5, make sure you specify the version
    of NFS that you want to use (nfs for version 2 and 3; nfs4 for version 4).

    rhel1:/opt/company_data      /opt/company_data  nfs4  rw,sync 0 0


    **Step 2.** Save your file and exit.


    **Step 3.** Using the mount command, you can verify that the resource was mounted
    properly:


    ```

    # mount | grep nfs

    sunrpc on /var/lib/nfs/rpc_pipefs type rpc_pipefs (rw)

    nfsd on /proc/fs/nfs type nfsd (rw)

    172.168.1.1:/home on /mnt/temp type nfs

    (rw,vers=4,addr=172.168.1.1,clientaddr=172.168.1.10)

    172.168.1.1:/opt/company_data on /mnt/company_data type nfs

    (rw,vers=4,addr=172.168.1.1,clientaddr=172.168.1.10)

    ```


    The remote resource should now be available just as it was a local resource.'
