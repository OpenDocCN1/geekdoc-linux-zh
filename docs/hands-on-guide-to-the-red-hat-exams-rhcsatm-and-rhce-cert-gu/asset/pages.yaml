    License: GPL

    Packager: Joe Tester

    Group: Development/Tools

    Source: %(name).tar.gz

    BuildRoot: /usr/src/redhat/tmp/%{name}--%{version}


    ```

    %description

    This package is just a sample for the Red Hat exams.

    ```


    ```

    %prep

    setup -n mysample

    ```


    ```

    %install

    mkdir -p "SPRM_BUILD_ROOT/opt/sample_package"

    cp -R "SPRM_BUILD_ROOT/opt/sample_package"

    ```


    ```

    %files

    /opt/sample_package

    ```


    ```

    %clean

    rm -rf "SPRM_BUILD_ROOT"

    ```


    ```

    %post

    chown user0:root -R /opt/sample_package

    chmod 775 -R /opt/sample_package

    ```


    This finely needs some explaining. The first main section is all information required
    for a package, which you already saw information from a package. The Source and
    BuildRoot are both significant because they play a role in how the package is
    built. The Source is the archive file that the package will use; in this case
    it is named after the mysample.tar.gz file created and moved into the SOURCES
    directory. BuildRoot is the directory that will be used to actually build the
    software (you could use the BUILD directory as well).


    The rest of the spec file contains details with a %. First up is the %description
    section, which provides a description for the package that you are trying to build
    (I''m sure you guessed). The %prep and %setup sections move the SOURCE into the
    BUILD directory and decompress the archive file. The -n option specifies the name
    of the directory that will be entered upon decompression. The %install section
    is normally the place where your software is compiled and installed on your current
    system. When it is installed, the files need to be collected so they can be deployed
    via the package you are building, which leads us to the %files section. Here,
    you need to include any file that you want in your package. Any directory that
    you specify here includes all files and subdirectories below it as well. Because
    you are building a package with only a few files, you can just specify the directory
    previously created (/opt/sample_package) in the %install section.'
