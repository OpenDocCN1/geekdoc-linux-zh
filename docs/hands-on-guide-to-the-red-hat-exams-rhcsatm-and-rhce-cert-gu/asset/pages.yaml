    \ port 953\n  allow { 127.0.0.1; keys \"rndckey\"; };\n}\n```\n\ninclude \"/etc/rndc.key\"\
    ;\nnThe controls statement specifies which hosts or subnets are allowed to manage\
    \ the DNS server through the rndc utility. The final line references the file\
    \ so that anyone tries to read the /etc/named.conf file won't see the secret key.\n\
    \n**Step 9.** Like the /etc/named.conf file, these two files that you have just\
    \ created for rndc should be owned only by the user name:\n\n+   * chown root:named\
    \ /etc/rndc.*\n\n**Step 10.** You should also limit the rndc files to readably\
    \ only by the root user:\n\n+   * chmod 400 /etc/rndc.*\n\n**Step 11.** While\
    \ you're at it, also change the SELLinux context for enhanced security:\n\n+ \
    \  * chcon t_named_conf_t rndc.conf rndc.conf\n\nAlthough rndc should be set up,\
    \ you need to create a firewall rule on port 953 for it to function properly (and\
    \ for your clients to be able to connect and manage the DNS server).\n\n**Step\
    \ 1.** Use iptables to create the additional firewall rules:\n\n+   * iptables\
    \ -I INPUT 5 -p udp -m udp --dport 953 -j ACCEPT\n\n**Step 2.** Save the firewall\
    \ rules you created:\n\n```\n* service iptables save\nSaving firewall rules to\
    \ /etc/config/iptables: [ OK ]\n```\n\n**Step 3.** Then restart the iptables service:\n\
    \n```\n* service iptables restart\niptables: Flushing firewall rules: [ OK ]\n\
    iptables: Setting chains to policy ACCEPT: filter [ OK ]\niptables: Unloading\
    \ modules: [ OK ]\niptables: Applying firewall rules: [ OK ]\n```\n\nA few bits\
    \ of housekeeping finish this off."
