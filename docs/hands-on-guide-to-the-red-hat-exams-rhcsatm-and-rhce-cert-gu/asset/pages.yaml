  md: '4. What does the following firewall rule accomplish: iptables -I INPUT 5 -p
    tcp -m tcp --dport 80 -j ACCEPT?


    5. What is the last rule in the iptables file?


    6. What is PAM used for?


    7. What is NAT? How is it used?


    8. The following firewall rule works under Red Hat Enterprise Linux 6: iptables
    -I RH-Firewall-1-INPUT -p tcp -m tcp --dport 22 -j ACCEPT. True or False?


    # Answers to the Review Questions


    +   1. False. A service needs to support for TCP Wrappers to be able to use it.


    +   2. False. The firewall service is enabled by default.


    +   3. True. For Red Hat Enterprise Linux 6, SELinux comes up in enforcing mode.
    when installing Red Hat Enterprise Linux 5, you have the option to choose which
    mode you''d like to operate in.


    +   4. The firewall rule is inserted into the fifth line of the iptables rules
    and opens up TCP port 80 (for the HTTP service) on the firewall to allow incoming-connections.


    +   5. The last rule is always an implicit deny statement rejecting anything that
    wasn’t matched by previous rules.


    +   6. PAM is used as a modular layer to leverage security. In this chapter, the
    main function we discussed for managing password policies and complexity.


    +   7. Network address translation (NAT) maintains a table that allows the use
    ofinternal IP addresses to a multiple public IP address (called address-translation).
    It can also be used for one-to-one or one-to-many relationships as well.


    +   8. False. The INPUT chain being used is the default under Red Hat Enterprise
    Linux 5. This rule generates errors under Red Hat Enterprise Linux 6.'
