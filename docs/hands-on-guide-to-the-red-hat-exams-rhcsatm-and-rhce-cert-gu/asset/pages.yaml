    \ 18:24:10;\n    binding state free;\n    hardware ethernet 08:00:27:74:5b:11;\n\
    }\n\nlease 172.168.1.199 {\n    starts 4 2010/05/20 11:24:03;\n    ends 4 2010/05/20\
    \ 17:24:03;\n    tstp 4 2010/05/20 17:24:03;\n    binding state free;\n    hardware\
    \ ethernet 08:00:27:2f:00:8c;\n}\n```\n\nAs you can see from the file output,\
    \ two clients have active leases. When viewing the leases, you should be careful\
    \ that all times in the dhcpd.leases file are in UTC (GMT). The reason for this\
    \ is that there is no daylight savings in that time zone, making it internationally\
    \ usable. Make sure you pay attention to this issue if you are trying to troubleshoot\
    \ this file. As a final tip, make sure you use the config option to test the syntax\
    \ of your config files before restarting the service. This prevents any errors\
    \ when you try to start the service.\n\n# REAL-WORLD TIP\n\nYou may want to consider\
    \ setting up a secondary DHCP server as a failover. It provides you with a backup\
    \ should your primary server fail (don't just rely on this secondary; make sure\
    \ you test it). If you create a failover server, you should follow the 80/20 rule:\
    \ 80% of your IP addresses should be used on your primary server, and 20% should\
    \ be used on your secondary server.\n\n# Network Time Protocol\n\nDo you know\
    \ what time it is? If not, that's okay because we're going to discuss the network\
    \ time protocol (NTP) service. This service is responsible for maintaining your\
    \ system time, which is highly important in any environment because many things\
    \ rely on time (logs, error messages, applications, and so on). There are a few\
    \ rules that your system can have when using NTP. They include\n\n+   Primary\
    \ NTP Server | Provides time to NTP servers or clients\n\n+   Secondary NTP Server\
    \ | Provides time to clients; helps load balance primary NTP servers\n\n+   NTP\
    \ Peer | Provides and receives time\n\n+   NTP Client | Receives time from primary\
    \ or secondary NTP servers"
