    # Users Can''t Create Files in Their Home Directories


    If users can''t create files in home directories, your first thought should be
    that the partition is out of space. When it comes to users hoarding files in their
    home directories, they tend to keep everything, which eats away at file space.


    +   Step 1. Verify that the partition isn''t full:

    # df -h


    +   Step 2. If the partition isn''t full, check to see whether the user has reached
    his quota:

