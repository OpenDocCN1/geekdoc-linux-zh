  md: "# Chapter 4: File Systems and Such 129\n\nyour partitions. If you select this\
    \ option, you are required to enter a password. You will be prompted for this\
    \ password every time the system boots to decrypt the partitions for use by the\
    \ system.\n\n> WARNING: Do not lose this password! If you do, anything you have\
    \ encrypted will be completely inaccessible.\n\nJust because your partitions are\
    \ encrypted with LUKS doesn't ensure that they are protected when the system is\
    \ turned on. LUKS protects the system only when it is off (or if the partition\
    \ is not mounted in single-mode). When the system has booted and the partition\
    \ is decrypted (which it has to do make the data accessible), it is no longer\
    \ protected by LUKS. You can use file-based encryption in combination with LUKS\
    \ to provide additional security when the system is on. Later in this chapter,\
    \ we discuss GnuPG, which is an open source file-based encryption using PGP.\n\
    \n# Creating Encrypted Partitions\n\nEven after you have installed Red Hat, you\
    \ can still create encrypted partitions. By default, RHEL uses AES 128-bit encryption\
