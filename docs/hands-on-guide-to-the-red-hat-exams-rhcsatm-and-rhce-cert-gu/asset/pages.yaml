  md: '# Remote Access


    You walk into the server room and install Red Hat on your new server. After the
    installation is complete, you need to configure numerous packages and then begin
    setting up users. All these tasks take time, and if you work in a data center,
    chances your office is located somewhere else. Remote access to any system that
    you work on makes managing and troubleshooting much easier because you don''t
    physically need to be in the same location as your systems. In this chapter, we
    discuss SSH for command-line remote access and VNC for graphical remote access.


    # Secure SHell (SSH)


    You know that at some point or another you will need to be able to administer
    remotely, and you wouldn''t want to do this without some sort of security in place,
    right? SSH can protect the traffic that passes from your computer to a remote
    computer, making the tunnel secure for administration. The tunnel SSH uses for
    communication is encrypted, unlike protocols such as Telnet dont employ any encryption.
    SSH is a fairly easy service to set up and is useful in many different ways. Although
    it is usually installed by default, you also


    +   Step 1. Verify the SSH server package is installed:


