    becomes highly impractical after you start managing a large number of servers
    and clients. Instead, you can use hostnames (the name of the system), which can
    be used in place of an IP address. The lookup and translation of an IP address
    to a hostname happens automatically via your network. Although this section doesn''t
    cover DNS in its entirety; it describes client-side DNS issues and ways to troubleshoot
    them. There are some key files that make name resolution occur on the system.
