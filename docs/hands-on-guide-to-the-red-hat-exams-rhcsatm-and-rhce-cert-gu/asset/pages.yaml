  md: '# Firewall and SELinux Configuration


    For your web server to become fully functional, you need to make some security
    changes. First and foremost, the firewall needs to be opened on port 80.


    +   **Step 1.** Use iptables to create the additional firewall rules:

    # iptables -I INPUT 5 -p tcp -m tcp --dport 80 -j ACCEPT


    +   **Step 2.** Save the firewall rules you have created:

    # iptables save

    Saving firewall rules to /etc/sysconfig/iptables: [ OK ]


    +   **Step 3.** Then restart the iptables:

    # service iptables restart

    iptables: flushing firewall rules: [ OK ]

    iptables: Setting chains to policy ACCEPT: filter [ OK ]

    iptables: Unloading modules: [ OK ]

    iptables: Applying firewall rules: [ OK ]


    Additionally, you need to look at SELinux protection for the web server. Table
    14-1 presents the available options.


    # Table 14-1 SELinux Options


    | Option | Description |

    | httpd_can_network_relay | Allow httpd to act as a relay. |

    | httpd_can_network_connect_db | Allow httpd scripts and modules to connect to
    databases over the network. |

    | httpd_use_gpg | Allow httpd to run gpg in the gpg-web domain. |

    | httpd_enable_cgi | Allow httpd CGI support. |

    | httpd_use_cifs | Allow httpd to access CIFS file systems. |

    | allow_httpd_mod_auth_pam | Allow Apache to use mod_auth_pam. |

    | allow_httpd_anon_write | Allow Apache to modify public files for public file
    transfers. Directories/Files must be labeled public_rw_content_t. |

    | httpd_enable_homedirs | Allow httpd to read home directories. |

    | allow_httpd_sys_script_anon_write | Allow Apache scripts to write to public
    content. Directories/Files must be labeled public_rw_content_t. |

    | httpd_dbus_avahi | Allow Apache to communicate with the avahi service via dbus.
    |

    | httpd_unified | Unify httpd handling of all content files. |'
