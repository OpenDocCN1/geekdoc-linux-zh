- img_proc: true
  md: 'This now relays your mail through the specified host server. If you''d like
    to add a little security here, you can also configure the relay to work with SASL
    for a secure connection. Again, edit the /etc/postfix/main.cf config file:


    ```

    # nano /etc/postfix/main.cf

    relayhost = mail.example-a.com

    smt_use_tls = yes

    smt_sasl_auth_enable = yes

    smt_sasl_password_maps = hash:/etc/postfix/smtp_auth

    smt_sasl_security_options = noanonymous

    ```


    You can see that these changes force the use of SASL so that the connection will
    be secure. They also define a file (/etc/postfix/smtp_auth) to keep the credentials
    for authentication purposes.


    Create the credentials file and populate it:


    ```

    # nano /etc/postfix/smtp_auth

    mail.example-a.com <account_number | account_info>:<password>

    ```


    Notify the Postfix service you want to add the newly created credentials with
    the postfix map command:


    ```

    # postmap /etc/postfix/smtp_auth

    ```


    Finally, restart the Postfix service for the changes to effect:


    ```

    # service postfix restart

    Shutting down postfix: [ OK ]

    Starting postfix: [ OK ]

    ```


    Although this section doesn''t describe all the security features Postfix provides,
    it''s a good start and will give you the basics for protecting your mail server.


    # Alias Mapping


    Postfix is able to use aliases for managing domains and users. The /etc/aliases
    file contains the current mappings and should be edited to reflect any changes
    required for your network. Using the newaliases command, you can view the statistics
    of the file or update the aliases database. You can use the aliases to create
    distribution groups or redirect mail to users who no longer exist in your domain.
    For example, add the following line to /etc/aliases file:


    ```

    helpdesk: user0, user2

    ```


    Then run the newaliases command to update the database:


    ```

    # newaliases

    ```


    Now when you email helpdesk@example.com, the message goes to both users.'
