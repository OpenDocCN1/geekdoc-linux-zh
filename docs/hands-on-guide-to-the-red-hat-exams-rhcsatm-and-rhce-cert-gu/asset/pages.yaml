    7. What command can you use to create a new SSL certificate?


    # Answers to the Review Questions


    +   1. The SMTP service runs on TCP port 110.

    2. alternatives --config mta

    3. The two main config files are master.cf and main.cf.

    4. False. The default SMTP service has been changed to Postfix in Red Hat Enterprise
    Linux 6.

