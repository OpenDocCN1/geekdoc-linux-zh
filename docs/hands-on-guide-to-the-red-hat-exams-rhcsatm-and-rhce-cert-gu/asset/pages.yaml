  md: '# CHAPTER 7


    # # User Administration


    Every system goes into a way to add users, giving each person the ability to sign
    in to the system and work productively. This chapter looks at ways you can create
    users and groups in Red Hat and reasons you would want specific users and groups;
    in addition, it covers system accounts used to run services and special applications.
    Aside from normal and service users, there is the root user, which is the main
    administrator account for Linux systems.


    As a system administrator, you will spend a fair amount of time managing user
    and group accounts, because those accounts determine what files and directories
    users or groups have access to. You could add a bunch of different users and groups
    to allow for project collaboration. When users are created, they are also given
    a standard set of files. These files can be customized to deliver particular documents
    or notices to your users upon creating their accounts. A lot goes into creating
    a user account, so many system administrators tend to script account creation,
    automating the process. Although it''s good to create user accounts and groups
    are local to your system, how will your users access other network hosts? Will
    you have to create all those accounts and groups all over again? To solve this
    problem, can you add your system to a domain, which contains all user accounts
    and groups in a centralized database, making administration easier.


    # Users and Groups


    In Red Hat, there are three different types of user accounts: root, normal user,
    and system (or some people like to call "pseudo-user") accounts. The root account
    is the equivalent of the Administrator or Enterprise Admin account in the Windows
    world. It is the most powerful account on the system and has access to everything.
    You should already realize that of the power of this account, you should never
    use it. Ever!


    When Red Hat is installed for the first time, you are asked to create the first
    user account (if you install a desktop manager). If you installed your system
    through an automated process (such as a network install) or without a desktop'
  merge: -1
  pgno: 227
- img_proc: true
  md: '196 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and Lab
    Manual


    manager package, you need to create an account for yourself. Either way, you should
    have a normal user account for yourself that has permissions to perform the actions
    you need to accomplish as a system administrator.


    Later in this chapter, you will see how you can delegate controls of the system
    to this user or any other users by allowing them to perform actions as if they
    were the root user. This not only makes your system more secure, but also makes
    it easier to break-in attempts and forces accountability of all users through
    their individual user accounts. Normal user accounts have no access to anything
    on the system except their home directory (they can read and explore more of the
    system, however), which is created when the user account is added. As an administrator,
    you can assign access rights to different files and directories, allowing your
    users to gain access to different areas of the system (outside their home directory).


    A system account is similar to a normal user account. The main difference is that
    system users normally don''t have a home directory and can''t log in the normal
    way users do. Many system users are created or associated with applications or
    services to help run them more securely. Think of the situation this: if a system
    service (the Apache service) becomes compromised, the attacker will access only
    the web server and its config files. This could be worse if the Apache service
    was running as the root user; in that case, the attacker would have full access
    to the system. These are some additional reasons why you should never truly need
    the root account unless there is a problem with the system.


    # Users


    When dealing with users, you need to create the accounts, give them passwords
    (and manage password settings), modify your account settings, and delete your
    accounts when they are no longer needed. To manage user accounts, you can use
    the following commands:


    +   - useradd creates user or system accounts

    - usermod modifies user accounts

    - userdel removes a user or system accounts


    Imagine a user walks up to you in the office and says he''d like to log in to
    one of the servers so he can install new software and try it out. You cannot give
    him your credentials because you are the administrator, and giving out the root
    credentials is also out of the question. Clearly, you need some user accounts.
    Let''s start by making a few users for the sample system and looking at the different
    options you can use when creating a user account. To create a user account, you
    can use the useradd command.


    Syntax: useradd [options] LOGIN'
