  md: "406 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Guide and Lab Manual\n\
    \n# Step 2. Now you can start the service:\n\n```\n# service named start\nStarting\
    \ named:\n```\n\n> WARNING: If you set a caching-only nameserver, you should now\
    \ switch your /etc/named.conf file back to the master DNS server configuration.\
    \ The rest of this chapter deals with DNS security and troubleshooting assuming\
    \ that you still have the master DNS server in place.\n\n# Forwarding-Only Server\n\
    \nA forwarding-only server does not actually handle any queries, but instead forwards\
    \ them to the correct location. This might be something you see if you work for\
    \ an ISP that handles thousands of requests at a time. Forwarding-only servers\
    \ are actually the easiest to set up because they require almost no configuration.\
    \ In the named.conf file, let's set up the following section:\n\n```\noptions\
    \ {\n  directory \"/var/named\";n  forwarders { 172.168.1.0/24; forward first;\
    \ };n}\n```\n\nThis section sends all queries to the first DNS server in the match-list\
    \ and to the root DNS servers if no match is made. You can also specify forward\
    \ to check only the match-list servers and no root DNS server. If you don't include\
    \ the directive, it defaults to forward first. If you are going to allow the query\
    \ of root DNS servers, you must have the /var/named/named.ca file, which contains\
    \ a list of root DNS servers. This is the entire setup required for a forwarding-only\
    \ DNS server.\n\n# DNS Utilities and Troubleshooting\n\nFor the server and client,\
    \ there are a handful of utilities you can use to verify the functionality of\
    \ DNS. These utilities include\n\n+   dig DNS lookup utility\nhost DNS lookup\
    \ utility\nping Network or hostname verification utility\nslookup Utility to lookup\
    \ a hostname from an IP addresses\nhostname Utility to sets or show the system\
    \ hostname (FQDN)"
