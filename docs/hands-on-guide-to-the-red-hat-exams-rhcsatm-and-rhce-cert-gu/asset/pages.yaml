  md: "# 364 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and\
    \ Lab Manual\n\nYou can also use the nfsiostat command for similar statistics.\
    \ In addition, if you want some detailed debug information about mounted NFS shares,\
    \ you can use the mountstats command. This would be useful only if you are looking\
    \ to fine-tune NFS or track down a serious problem, though.\n\n# Connecting Clients\n\
    \nSetting a client to use NFS is relatively simple when you have the NFS server\
    \ in place. Let's use the Client01 system to use a share on RHEL01 NFS server.\n\
    \n+   Step 1. To start, you need to install the required packages:\n\n```\n# yum\
    \ install -y nfs-utils nfs4-acl-tools\n```\n\nThese two packages include the necessary\
    \ files to connect to the NFS server and the exported resources. On the client\
    \ side, you need to use the rpcbind service to mount NFS resources on the server.\n\
    \n+   Step 2. Ensure that the required service is set to start on boot:\n\n```\n\
    # chconfig rpcbind\n```\n\nYou can now create some directories to hold the NFS\
    \ shares on the local system.\n\n+   Step 3. Create two local directories:\n\n\
    ```\n# mkdir /mnt/{company_data,temp}\n```\n\n+   Step 4. Mount the company_data\
    \ NFS share:\n\n```\n# mount -t nfs 172.168.1.1:/opt/company_data /mnt/company_data\n\
    ```\n\n> MIGRATION TIP\n RHEL5, the mount command uses NFS version 3, so you need\
    \ to specify the version. You should use the following command:\n# mount -t nfs\
    \ nfsvers=4 172.168.1.1:/opt/company_data /mnt/company_data\nIn RHEL6, version\
    \ 4 is used by default, so there is no need to specify."
