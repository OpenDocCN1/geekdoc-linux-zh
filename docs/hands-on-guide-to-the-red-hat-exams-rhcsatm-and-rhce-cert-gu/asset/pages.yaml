  md: '# Troubleshooting NTP


    When you want to troubleshoot the NTP service, there are a few commands that can
    help you out. First, if you want to update the time manually, you can use the
    ntpdate command.


    Syntax: ntpdate <server>


    > MIGRATION TIP

    RHEL6 comes with the ntpdate package installed by default, but RHEL5 does not.


    > WARNING: Before you run the ntpdate command, you must stop the NTP service!


    +   Step 1. Stop the NTP service:

    # service ntpd stop

    Shutting down ntpd: [ OK ]


    +   Step 2. Specify the upstream server that you want to sync against:

    # ntpdate 0.rhel.pool.org

    23 Aug 16:29:15 ntpdate[7047]: adjust time server 209.234.249.11 offset 0.031852
    sec


    +   Step 3. Start the service again:

    # service ntpd start

    Starting ntpd: [ OK ]


    +   Step 4. Verify that the time is accurate with the date command:

    # date

    Mon Aug 23 16:29:34 GMT 2010


    The next troubleshooting command is ntpq -p, which enables you to query for other
    NTP servers. Here, the only concern is the -p option, which polls for all other
    NTP servers:


    ```

    ntpq -p

    remote               refid      st t      delay  offset jitter

    pool-ntp.o .INIT      16 u 64 0  0.000 0.000 0.061

    knowledge.global     .INIT      16 u 64 0  0.000 0.000 0.061

    bindcat.fushu.edu     .INIT      16 u 64 0  0.000 0.000 0.061

    LOCAL(0)             .LOCL      10 1 64 0  0.000 0.000 0.061

    ```


    Finally, you can also go really in depth by tracing where the NTP server is getting
    its time sync from. To do this, you can use the ntptrace command.'
