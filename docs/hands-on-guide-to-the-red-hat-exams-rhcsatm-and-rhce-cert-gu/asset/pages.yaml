- img_proc: true
  md: '# Chapter 11: SELinux 279


    RHEL02, you should leave SELinux set to enforcing. If you run into any problems
    where you suspect SELinux of causing the issue, you can troubleshoot using different
    systems. On the exam, you are required to work with SELinux to enforce, so you
    need to understand how to troubleshoot and fix any issues that arise.


    # Configuring SELinux


    You can change the mode in which SELinux operates by changing the config file.
    The main config file is /etc/selinux/config.


    View the details of the /etc/selinux/config file:


    ```

    # cat /etc/selinux/config

    # This file controls the state of SELinux on the system.

    # SELINUX= can take one of three values:

    # enforcing SELinux security policy is enforced.

    # permissive SELinux prints warnings instead of enforcing.

    # disabled SELinux is fully disabled.

    SELINUX=enforcing

    # SELINUXTYPE= type of policy in use. Possible values are:

    # targeted Only targeted network daemons are protected.

    # strict Full SELinux protection.

    SELINUXTYPE=targeted

    ```


    You can see that the three SELinux modes are listed in the comments of the file
    and the current mode is enforcing. At any time, you can change the mode that SELinux
    runs, but a reboot is required for it to take effect. After you change the mode
    in which SELinux is running and reboot the system, SELinux relab the file system
    to change the context of the files. This process can be time consuming on the
    size of your directory and the number of files it contains, so planning ahead
    with the mode to run SELinux is always advised. Aside from editing the config
    file, you can use the setforce command to change the status.


    Syntax: setforce [ Enforcing | Permissive | 1 | 0 ]


    If the current mode is permissive, you can change it to enforcing with the following:


    ```

    # setforce enforcing

    ```


    Regardless of which method you use when changing the mode in which SELinux runs,
    you are still required to reboot the system. Now that you know how to find and
    change the mode in which SELinux operates, let''s move on to file contexts.


    # File Contexts


    SELinux uses three different contexts to enforce security: user, role, and domain
    (also called type). New to RHEL6 is the addition of a fourth context as level
    (this level represents the sensitivity level of a file or directory). These can
    be further expanded to define values for each context.'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'User:


    unconfined_u Unprotected user


    system_u System user


    user_u Normal user


    Role:


    object_r File


    system_r Users and processes


    Domain:


    unconfined_r Unprotected file or process


    > NOTE: For the domain section listed here, unconfined_r is only one type of text
    that can be used. More restrictive values can be used, but unconfined_r is the
    most general, which is why it''s listed here.


    Each file, folder, and service has an associated label that contains all three
    contexts. In this section, we look at the SSH service as an example because it
    is installed with the system by default. You can use the ps command described
    in Chapter 9, “System Logging, Monitoring, and Automation,” to view the labels
    associated with a service.


    Check the SELinux labels with SSH service:


    ```

    ps -Z sshd

    LABEL PIDTY TIME CMD

    system_u:system_r:sshd_t:s0-s0:c0.c123 1421 ? 00:00:00 sshd

    system_u:system_r:sshd_t:s0-s0:c0.c123 4977 ? 00:00:00 sshd

    system_u:system_r:sshd_t:s0-s0:c0.c123 4982 ? 00:00:00 sshd

    ```


    The first field you see is system_u, which you can tell from the expanded text
    section, is a system user. The second field contains system_r, which again you
    can refer to see that it is a user or, in this case, a process. The third field
    shows unconfined_t as the domain. You can ignore the fourth field for the moment.


    Let’s look a little further at the domain context. The domain is simply a way
    of categorizing which contexts talk to one another. Another example should make
    this clearer.'
  merge: -1
