    # Installing an FTP Server


    In this chapter, we use the vsftpd package, which stands for Very Secure FTP Daemon.
    This particular FTP server offers additional features that make it more secure
    if you have to use FTP. As all services that you''d like to offer to your network
    users, you need to make sure that the appropriate packages are installed. Here''s
    how.


    +   Step 1. Grab the required package:

    # yum install -y vsftpd


    +   Step 2. When the installation is complete, verify it was installed successfully:

    # rpm -qa i grep vsftpd vsftpd-2.2.2-e16.x86_64


    +   Step 3. Ensure the service will start on system boot:

    # chconfig vsftpd on


    +   Step 4. Verify the service starts on boot:

    # chconfig vsftpd --list

    vsftpd 0:off 1:off 2:on 3:on 4:on 5:on 6:off


    # Configuring vsftpd


    To start the configuration of the FTP server, you need to look at the config file.
    For vsftpd, there is only one config file; it is located at /etc/vsftpd/vsftpd.conf,
    which is where you configure the settings of the FTP server.


    +   Step 1. Look at what options are available in the config file:


    ```

    # grep -v # vsftpd.conf

    anonymous_enable=YES

    local_enable=YES

    write_enable=YES

    local_umask=022

    dirmmage_enable=YES

    connect_from_port_20=YES

    xferlog_std_format=YES

    listen=YES

    pam_service_name=vsftpd

    userlist_enable=YES

    tcp_wrappers=YES

    ```


    +   Step 2. Now let''s go over what each of these options can be used for:


    anonymous_enable=YES

    The default; sets security, although it should be to NO for better host-based
    security


    local_enable=YES

    Allows users to log in'
