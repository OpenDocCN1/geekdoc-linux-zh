  md: 'default-lease-time Specifies how long each client keeps its lease until a renewal
    is requested (in seconds)


    max-lease-time Specifies the maximum amount of time a client can keep a lease
    (in seconds)


    range dynamic-boot Specifies the range of IP addresses that can be given out to
    clients


    With a config file in place, you have everything you need for the DHCP server
    to function properly. Although this section does not describe anywhere near all
    the options available for the DHCP service, this is a good start to getting a
    DHCP server up and running. For the exams, you can always reference the documentation
    if you forget the name of an option. Although I hate pointing you to many pages,
    it is impossible to remember everything for every service. Knowing where to find
    information when you need it is critical on the exams and in the real world. Here
    are the three pages you should know:


    ```

    # dhcpcd.conf

    # dhcpcd.leases

    # dhcp-options

    ```


    If you want to have multiple subnets, you can just define a new subnet section
    with its own set of options. There is no limit to the number of sections you can
    have.


    # REAL-WORLD TIP


    If you want to set up multiple subnets, you usually have multiple interfaces on
    the server. If this is the case and you would like to service multiple subnets
    of clients, you need to adjust the /etc/sysconfig/dhcpcd.conf. In this case, you
    need to edit the following daemon option:


    ```

    DHCPDARGS="eth0"

    ```


    Change this option to include all the interfaces for which you want to offer clients
    leases in different subnets. If you have two interfaces in two different subnets,
    for example, your option might look like this:


    ```

    DHCPDARGS="eth0 eth1"

    ```


    The options we''ve covered so far are really all you need to set up your DHCP
    server to work. Even though the DHCP server is set to run, there is another example
    to consider. It is common in the real world to have to reserve an IP address for
