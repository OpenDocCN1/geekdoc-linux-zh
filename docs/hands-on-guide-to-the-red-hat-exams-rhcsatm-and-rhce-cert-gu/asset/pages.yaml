    out of hand from a management perspective when the number of machines to update
    and keep track of grows quickly. I''m sure you could have guessed, the next logical
    step is to let the system query a DNS server instead of the local hosts file.
    The /etc/resolv.conf file contains the IP address of the DNS server. This allows
    systems to resolve DNS queries instead of a local lookup in the hosts file.


    Let''s look at what is in the /etc/resolv.conf file:


    ```

    # cat /etc/resolv.conf

