  md: '314 Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    # SSH Security


    SSH has many different options when it comes to security. First, let''s look at
    some host security. The SSH service can make use of the TCP Wrappers service for
    additional protection when you are setting it up. Suppose you want to allow connections
    only from the 172.168.1.0/24 network to the RHEL01 host.


    Step 1. Use TCP Wrappers to limit the hosts that can connect to the server:


    ```

    # echo "sshd:172.168.1.1" >> /etc/hosts.allow

    # echo "ALL: ALL" >> /etc/hosts.deny

    ```


    This allows all clients within the 172.168.1.0/24 subnet to connect to the SSH
    server (provided you have a valid user account), and it allows any other host
    outside this subnet. Although TCP Wrappers is a good starting point for host-security,
    you should also change a feature of the options in the config file to really improve
    the security of your SSH server. You should take into account the default port
    that the SSH service will use, the IP address that the server listens on, and
    the protocol.


    Step 2. Change the options discussed to improve security:


    ```

    Protocol 2

    Port 2222

    ListenAddress 172.168.1.1

    ```


    When you change these options, the default port isn''t known to every-one, and
    only the internal network adapter listens for connections. Be careful not to lock
    yourself out from the external network, though.


    Let''s switch focus for a second and look at user-based security. Although this
    type of security is not in the config file by default, you can also limit the
    users or groups that you''d like to connect to your SSH server. The SSH service
    processes these options in the following order:


    ```

    DenUsers AllowUsers DenyGroups AllowGroups

    ```


    Step 3. Add the following to your config file to allow only specific users to
    connect:


    ```

    AllowUsers user01,user02

    ```


    Now only the two users who have been listed are allowed to connect to the SSH
    server. Although security for SSH is great, make sure that you have documented
    your security somewhere because hardened systems tend to lead to connection issues
    if not planned properly. You need to be able to review what security mechanisms
    you have in place when troubleshooting.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Troubleshooting SSH


    When it comes to troubleshooting SSH, the service tends to work or not work. A
    key part of working with SSH is also being able to troubleshoot it. The first
    place to always look with SSH is in the log file located /var/log/secure. The
    file should provide you with any information as to why you cannot connect to a
    remote machine. If you run into errors about the remote host refusing the connection,
    the problem is most likely blocking your connection. This could be due to the
    service not running, firewall rules being incorrect, or extra security measures
    as TCP Wrappers. Another common error that occurs often when testing is the remote
    key of the server changing. If the key changes on the remote host, you get a warning
    message:


    > WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!

    IT POSSIBLE THAT SOMEONE IS DOING SOMETHING NASTY!

    Someone could be eavesdropping on you right now (man-in-the-middle attack)!

    It is also possible that the RSA key has just changed.


    If this is the case, you can open the ~/.ssh/known_hosts file to edit or delete
    the line that has changed.


    WARNING: The known_hosts file contains ONE KEY PER line!


    The reason I''m warning you here is that not all displays are long enough to display
    the full length of the key, so they wrap, giving the illusion of a multiline key.
    It would not be a good thing to try to delete the four- or five-line key from
    this file in the nano text editor because you would actually end up erasing everything
    low.


    # SSH Security Revisited


    The previous section described ways to set up an SSH server, configuration, and
    some ways to make SSH more secure. Here, we look at two additional steps that
    can be added to the SSH server to increase security further. These two features
    are key authentication and port forwarding. With key authentication, users have
    a private key (on their local client machines) and a public key (on the server
    that they want to connect to). When a user tries to log in to the server, the
    two keys used (with an optional passphrase) allow the user to log in. This provides
    additional security because it requires you not only know a user''s password,
    but also have a copy of that user''s private key. With port forwarding, you can
    set up a management gateway requiring you to connect to the gateway first before
    connecting to any'
