  md: '# Setting Up RAID


    So far, we have addressed basic partitions, including swap, and how to set them
    up. Now let''s move on to the final type of advanced partitioning: RAID. RAID
    partitions allow for more advanced features such as redundancy and better performance.
    Before we describe how to implement RAID, let''s look at the different types of
    RAID:


    +   - RAID 0 (Striping) disks are grouped together to form one large drive. This
    offers better performance at the cost of availability. Should any single disk
    in the RAID fail, the entire set of disks becomes unusable. Two disk minimum.

    - RAID 1 (Mirroring) disks are copied from one to another, allowing for redundancy.
    Should one disk fail, the other disk takes over, having an exact copy of data
    from the original disk. The downside is here slow writes. Two disk minimum.

    - RAID 5 (Striping with parity) disks are similar to RAID 0 and join together
    to form one large drive. The difference is here that 25% of the disk is used for
    a parity bit, which allows the disks to be recovered should a single disk fail.
    Three disk minimum.


    While RAID can be implemented at the hardware level, the Red Hat exams are not
    hardware based and therefore focus on the software implementation of RAID through
    the MD driver. Next, let''s use the three free disk drives from the previous section
    (hdb, hdc, and hdd) to set up a RAID array.


    +   Step 1. Install the following package:


    ```

    ```bash

    # yum install -y mdadm

    ```

    ```


    +   Step 2. Verify the install:


    ```

    ```bash

    # rpm -qa | grep mdadm

    mdadm-3.1.3-1.el6.x86_64

    ```

    ```


    This package should have already been installed with the system, so you may be
    able to justify its existence. To start, you first need to create partitions on
    the disk you want to use (yes, I know you had erase them at the end of the previous
    section...think of it as practice). You start with a RAID 5 setup, so you need
    to make partitions on at least three disks.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    # REAL-WORLD TIP


    If you are just starting out with RAID, it is worth noting that you can create
    partitions on a single disk and use them to create RAID just to see how it is
    implemented. In the real world, however, making a RAID setup on a single disk
    completely defeats the purpose of the RAID because it exists for performance and
    redundancy, which you can achieve with all your partitions on a single disk.


