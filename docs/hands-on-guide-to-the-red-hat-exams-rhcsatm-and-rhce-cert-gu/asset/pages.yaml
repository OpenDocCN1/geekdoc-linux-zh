    By looking through the firewall rules, you might notice a few things. First, you
    should notice the default reject-rules at the end of this file. These can be found
    on any set of firewall rules and are usually referred to as "cleanup" rules. Second,
    make sure you always check this to ensure your rule is included. As already mentioned,
    there is only a single rule for SSH by default. Like TCP Wrappers, the firewall
    rules are parsed in order, so it does matter where you append and in-rules.


    # EXAM TIP


    A mistake that many people (including myself) make is using the -A option to append
    a new rule to the firewall rules and not understanding why the new rule isnt working.
    My suggestion is to check the iptables file and find out where in the file your
    rule is located because times it ends up on the bottom, below the REJECT rule.
    If this is the case, your rule will never be hit because no packet will ever get
    past the catchalls REJECT rule.


    The last line of this file is COMMIT, which writes the rules into memory for the
    system.


    Dealing with iptables is probably one of the hardest tasks until you have worked
    with them for a while. There are many ways to configure rules, and understanding
    how they work from start to finish can be overwhelming. In fact, many companies
    firewall appliances based on Linux and custom versions of iptables, which goes
    to show you how powerful yet complex Linux can be. The'
