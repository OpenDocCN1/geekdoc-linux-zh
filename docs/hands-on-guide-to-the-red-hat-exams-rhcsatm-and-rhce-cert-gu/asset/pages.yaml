  md: '# Chapter 14: Web Services 343


    ErrorLog Specifies the location for the error log


    CustomLog Specifies the location for a custom log


    Many of these options are similar to options provided in the main server section
    of the config file. If an option is not defined in the virtual host section, it
    defaults to whatever is set in the main server section.


    Setting up virtual hosts is easy; just do the following:


    +   Step 1. Copy the main server default site as an example:


    ```

    <VirtualHost *:80>

    ServerAdmin webmaster@example.com

    DocumentRoot /var/www/site1

    ServerName www.site1.com

    ErrorLog logs/site1_error_log

    CustomLog logs/site1_access_log common

    </VirtualHost>

    ```


    +   Step 2. Don''t forget to verify the syntax before running with the config:


    ```

    # httpd -S

    VirtualHost configuration:

    wildcard NameVirtualHosts and _default_servers:

    *:80 www.site1.com

    (/etc/httpd/conf/httpd.conf:985)

    Syntax OK

    ```


    +   Step 3. If you have multiple virtual host sites, you can check them with the
    following:


    ```

    # httpd -D DUMP_HOSTS

    VirtualHost configuration:

    wildcard NameVirtualHosts and _default_servers:

    *:80 www.site1.com

    (/etc/httpd/conf/httpd.conf:985)

    Syntax OK

    ```


    # Squid Web Proxy


    A proxy server is a device that usually sits between a client and the destination
    the user is trying to reach. It can provide security, anonymity, and even protection
    for the client behind the proxy. To help in this process is Squid, which is a
    web proxy server for Red Hat. It sits between the client and web server that the
    user is trying to connect to. Many times these devices are used when you want
    to control access to the Internet (think web filtering). As a web proxy, it can
    also cache data that users request from the Web and make it locally available,
    reducing the load on'
