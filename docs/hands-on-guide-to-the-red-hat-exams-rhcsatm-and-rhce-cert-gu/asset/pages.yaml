    # Deleting a Partition


    In the next section, we discuss Logical Volume Manager (LVM), in which you use
    multiple drives and partitions. Because you have created a bunch of different
    partitions in this section, the last thing is to deleting partitions so that you
    can clean off all drives before beginning the section on LVM. Deleting a partition
    is much easier than creating one because you need to specify only the partition
    number you want to delete.


    **Step 1.** Start the fdisk utility:


    ```

    # fdisk /dev/hdd

    ```


