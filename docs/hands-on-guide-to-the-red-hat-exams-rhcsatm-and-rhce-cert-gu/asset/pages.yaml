  md: '# Options:


    +   - b Sets the base directory for the new user account home directory


    +   - c COMMENT Creates a description/label for the user account


    +   - e EXPIRE_DATE Sets the date when the account will expire


    +   - m Creates a home directory for the new user account


    +   - r Creates a system account


    +   - s SHELL Defines what shell the user will log in to


    +   - u UID Forces the use of the UID for the new user account


    To make the first user account, you can use the following:


    ```

    # useradd -c "Avg Joe" -m -s /bin/bash user02

    ```


    This command creates a user account user02 and a home directory for the user,
    sets the user''s shell to BASH, and adds a description to the user called Avg
    Joe. There is more actually going on in the background as well. All users have
    a unique ID that defines them (this is known as the UID) and a group ID (this
    is as the GID). In Red Hat, UIDs start at 500 for normal users and extend into
    the thousands. For system users, the UIDs start at 1 and goes to 499. Red Hat
    also uses a policy Private Groups that assign the UID to be the same as the username.
    Although the GID doesn''t match, it frequently does. ensures that all users maintain
    security over their own files. Aside from the UID/GID being assigned, a home directory
    named after the user is created in the /home directory. You can check the new
    user''s home directory by using the following:


    ```

    # ls /home

    user02

    ```


    Now create another user user03 with a home directory:


    ```

    # useradd -m user03

    ```


    # REAL-WORLD TIP


    As a good practice, you should provide a label or some description for each account;
    otherwise, after time, you will forget what it is for.


    Now that the user is created, suppose you want to make an adjustment to the user
    account. Let''s add a description to the user account you just created. Because
    the user already exists, you can use the usermod command to modify the account
    information.'
