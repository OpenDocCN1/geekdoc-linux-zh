  md: '# Chapter 9: System Logging, Monitoring, and Automation 241


    All the messages sent to the rsyslog service are stored in the /var/log directory,
    and each message section has its own file or subdirectory. You can also define
    your own log files or directories. The biggest problem that arises from using
    any logging service is the files can become uncontrollable if unchecked. Being
    able to log different alerts and to obtain information from logs, in my opinion,
    is an art unto itself. There are so many ways to customize logs, and each network
    setup is different. You should know that there are different alerts that the syslog
    service uses. These alerts can be produced by different network devices and Red
    Hat systems.


    The nine severity levels of syslog include the following:


    +   - emerg

    - alert

    - crit

    - err

    - warning

    - notice

    - info

    - debug

    - none


    # The Config File


    The /etc/rsyslog.conf file is broken down into the following parts:


    | Modules | Indicate whether they can be loaded or unloaded (rsyslog is modular)
    |

    | Global directives | Specify config options that apply to the daemon (all start
    with a $) |

    | Rules | Indicate cooperation of a selector and an action |

    | Selector | Is based on <facility>.<priority> |

    | Action | Defines what to do with messages after they''re sorted by the selector
    |


    Let''s look at the default config-file config file to see some examples:


    ```

    # cat /etc/rsyslog.conf

    rsyslog v3 config file

    ```


    # if you experience problems, check'
