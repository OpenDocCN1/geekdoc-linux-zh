- img_proc: true
  md: '# CHAPTER 20


    # Email Services


    The world today runs on email, and without it, we would have a hard time functioning.
    Because of this, we need solid and reliable email servers to ensure that our email
    is processed correctly and either delivered or received on time. This chapter
    covers the different email services that can be used on Red Hat and how the email
    process works as a whole. For Red Hat, Sendmail is the default for sending mail
    and Dovecot is the default for receiving. Here, we focus more on Postfix for sending
    and Dovecot for receiving. Let''s start with an overview of how email services
    work.


    # Email Service Overview


    The system is divided into three different parts: MUA, MDA, and MTA. The mail
    user agent (MUA) deals specifically with end users. It is what they use to type
    and read emails they receive. The MUA is a mail client of some sort, such as Thunderbird
    or Evolution. The mail delivery agent (MDA) handles the delivery of mail from
    the receiving mail server to the spool where the mail sits until an MUA picks
    it up for the user. The mail transfer agent (MTA) is responsible for moving mail
    from one server to another until it arrives at its destination. In the next sections,
    we cover the setup of Postfix and Dovecot to provide mail functionality needed
    for the network.


    # SMTP with Postfix


    Red Hat provides both Sendmail and Postfix as viable mail programs. We focus only
    on Postfix in this book for multiple reasons. Postfix provides for easier administration,
    allows increased security, and supports virtual domains. It is also the default
    mail program on RHEL6.'
  merge: -1
  pgno: 475
- img_proc: true
  md: '# MIGRATION TIP


    Up until RHEL5, Sendmail was the default mail program for the Red Hat operating
    system, but this has changed to Postfix with the release of RHEL6.


    # EXAM TIP


    For the exam, you can use either Postfix or Sendmail as long as the system functions
    properly and the required task is met. As pointed out in the preceding tip, Sendmail
    is no longer the default, so it may be easier to learn Postfix if you aren''t
    really familiar with it.


    Step 1. To get started, you just need to verify that Postfix is installed correctly:


    ```

    # rpm -qa | grep postfix

    postfix-2.6.6-2.el6.x86_64

    ```


    If the package isn''t installed for some reason, you should install it now with
    the following:


    ```

    # yum install -y postfix

    ```


    Step 2. The service should already be ready to start during system boot, so you
    should just verify that:-


    ```

    # chkconfig postfix --list

    postfix 0:off 1:off 2:on 3:on 4:on 5:on 6:off

    ```


    If the service isn''t set to start on boot, you can enable it with the:-


    ```

    # chkconfig postfix on

    ```


    Because the Postfix service comes installed by default, you really don''t need
    to do much to get started.


    # MIGRATION TIP


    Because RHEL5 has Sendmail set up as the default mail program, you need to take
    some additional steps before moving on configuring Postfix.


    Step 1. Install the Postfix package because it isn''t there by default:


    ```

    # yum install -y postfix

    ```


    Step 2. Verify that the package installed correctly:


    ```

    # rpm -qa | grep postfix

    postfix-2.3.3-2.1.el5_2

    ```'
  merge: -1
  pgno: 476
- img_proc: true
  md: '# Step 3. Because you are going to use Postfix in place of the default Sendmail,
    you also need to stop the Sendmail service:


    ```

    # service sendmail stop

    Shutting down sm-client:      [ OK ]

    Shutting down sendmail:      [FAILED]

    ```


    # Step 4. You also need to prevent it from starting system boot:


    ```

    # chconfig sendmail off

    ```


    # Step 5. Verify:


    ```

    # chconfig sendmail --list

    sendmail      0:off 1:off 2:off 3:off 4:off 5:off 6:off

    ```


    # Step 6. Change the default mail program to Postfix:


    ```

    # alternatives --config mta

    ```


    There are 2 programs which provide ''mta''


    | Selection | Command |

    | --- | --- |

    | *+ 1 | /usr/sbin/sendmail.sendmail |

    | 2 | /usr/sbin/sendmail.postfix |


    Enter to keep the current selection[], or type selection number: 2


    # Step 7. Verify that the current default for mail is Postfix:


    ```

    # alternatives --display mta | grep current

    link currently points to /usr/sbin/sendmail.postfix

    ```


    # Configuring Postfix


    Postfix actually starts a service called master, which is its main service. This
    master service starts three other services itself: nmqueue, pickup, and smtpd.
    The nmqueue service is responsible for mail transmission, relay, and delivery.
    The pickup service transfers messages, and the smtpd service directs incoming
    mail. There are numerous things to know when working with Postfix, so let''s take
    a look.


    Here are the management commands for Postfix:


