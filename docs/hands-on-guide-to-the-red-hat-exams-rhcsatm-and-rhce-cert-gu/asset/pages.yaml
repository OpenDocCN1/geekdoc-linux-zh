  md: "# Setting Up the Lab\n\nThroughout this book, I show you how to use different\
    \ systems to set up services, perform configurations, and implement security.\
    \ In many forums I often see people asking how to set up labs or practice for\
    \ the Red Hat Exams. The Lab used throughout this book is built completely on\
    \ top of VirtualBox. VirtualBox is like VMware in it allows you to visualize systems.\
    \ If you don't have VirtualBox, you should grab a copy because it is free to use\
    \ and very helpful when practicing labs.\n\n+   - VirtualBox\n  - http://www.virtualbox.org/wiki/Downloads\n\
    \nBecause you will be using many different machines in the lab environment, Chapter\
    \ 1 describes how to set up Red Hat Enterprise Linux (RHEL). You can install RHEL\
    \ on your own or follow along in Chapter 1 to completely set up the lab.\n\nTable\
    \ P-2 presents a layout of the lab used here. Each ID is a different virtual machine.\n\
    \n# Table P-2 Lab Layout\n\n| ID | Hostname | Red Hat Version | IP Address | Network\
    \ |\n|---|---|---|---|--|\n| 1 | RHEL01 | RHEL6 | | 172.168.1.1 | Internal |\n\
    | 2 | RHEL02 | RHEL6 | 172.168.1.2 | Internal |\n| 3 | Client01 | RHEL5 | 172.168.1.10\
    \ | Internal |\n| 4 | Client02 | RHEL6 | 172.168.1.20 | Internal |\n\nAs you can\
    \ see, four machines are used. The first is a dual-homed server that also serves\
    \ as the gateway for all the internal clients. A majority of the configuration\
    \ work takes place on this server, and you use the second server (RHEL02) as a\
    \ backup. The two client machines are to simulate users on the network. The reason\
    \ I set up the network like this is that you all testing and configuration are\
    \ done in a controlled environment (which is a good habit to get into). If something\
    \ happens on the internal network, it doesn't affect the rest of the external\
    \ (home) network. Some other details for the lab setup include those shown in\
    \ Table P-3."
