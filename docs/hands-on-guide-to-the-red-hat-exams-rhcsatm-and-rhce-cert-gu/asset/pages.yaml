    In this chapter, we looked at the cron and at commands, each of which can be used
    for scheduling jobs. Using these tools, you can track down problems that arise
    and look for trends of reoccurring issues. In the next chapter, we look at the
    kernel, the brains behind the Red Hat operating system.


