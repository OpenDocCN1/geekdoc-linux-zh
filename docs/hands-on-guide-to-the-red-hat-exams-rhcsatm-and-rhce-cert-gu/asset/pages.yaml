    edquota Edits the settings of a user''s quota


    quota Allows each user to see his disk consumption


    repquota Generates a report of quota usage


    quotacheck Initializes a quota database


    Now that you have a listing of the commands you can use, you first first need
    to edit the /etc/fstab file to specify which file systems you want to utilize
    quotas. You can have quotas that limit users, groups, or both. For this chapter,
    you can enable both by adding the usquota option and the grpquota option to the
    /etc/fstab file. You don''t have to enable both, but it doesn''t hurt to enable
    both in case you find a need for the other later.


    +   **Step 1.** In the /etc/fstab file, edit the following line:

    /dev/hdb1 /opt/company_data ext4

    defaults,usquota,grpquota 1 2


    +   **Step 2.** Save and close the file.


    > WARNING: When you are working on files in text editors, they often have a bad
    habit of wrapping the line you''re working on. Make sure that this DOES NOT happen!
    If a line wraps in the /etc/fstab file, it will be as two different lines. This
    makes your /etc/fstab file corrupt, and your system will not boot! This is a very
    common cause of issues when you are editing text files. You can see this problem
    come to light again when dealing with kickstart files in Chapter 8, "Network Installs."


    You now need to remount the /opt/company_data file system before the changes take
    effect.


    +   **Step 3.** You can accomplish this using the mount command:

    # mount -o remove /opt/company_data


