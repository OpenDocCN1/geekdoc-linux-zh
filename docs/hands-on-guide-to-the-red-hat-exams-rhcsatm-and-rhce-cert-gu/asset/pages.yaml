  md: '# Runlevels


    When the system boots up, it queries for the default runlevel, which is defined
    in the /etc/initab file. When that default runlevel is located, the system boots
    into that particular runlevel. The different runlevels are essentially “states,”
    which allow services to be started or stopped depending on the runlevel you are.
    There are six runlevels in total, which are shown in the /etc/initab file. Each
    runlevel has a directory called /etc/rc.d/rc#,d, where # is the runlevel (from
    0 to 6). These different directories contain entries to tell the system services
    should be started or stopped at the particular runlevel. Let’s look at the different
    runlevels:


    +   0 Halt

    1 Single-user mode

    2 Multiuser with partial services

    3 Full multiuser with networking (text mode)

    4 Not used

    5 Full multiuser graphical mode (provides a GUI desktop login)

    6 Reboot


    The easiest runlevels to understand are 0 and 6. These two runlevels are called
    by the same command with different input. In runlevel 0, essentially the system
    is off (the powered off “state” if you will). In runlevel 6, the system is restarting
    (the reboot “state”). Runlevel 1 is used to enter single-user mode, which you
    can also enter if there are issues with the system and you’d like to perform maintenance.
    You can also reset the user’s password in this runlevel. The remaining runlevels—2,
    3, and 5—provide various states for services to run. There is also a runlevel
    4, which is for used. The best way is to get a feel for what is started in each
    of these runlevels is to look in /etc/rc.d/#d directory for each runlevel. These
    directories contain files that define whichservices should be started or stopped.
    These files are actually soft links to the service init scripts on the system.
    Upstart is the program that actually starts and stops services at each runlevel
    now. The /etc/init/rc.conf file shows how each set of scripts is called:


    ```

    # cat rc.conf

    ## rc - System V runlevel compatibility

    #

    # This task runs the old sys-rc runlevel scripts. It

    # is usually started by the telinit compatibility wrapper.


    start runlevel [0123456]

    ```'
  merge: -1
