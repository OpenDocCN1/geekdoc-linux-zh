    an ISO), and boot from the CD. If you do not press Enter at the first screen,
    it will begin to boot automatically after the timeout threshold (about 3 seconds).
    The installation process should begin at this point.


    +   Step 3. The first option should be obvious because choosing a language affects
    the rest of the installation process. You also need to choose your keyboard layout
    at this point.


    +   Step 4. Next comes the storage layout of the system. You don''t need any crazy
    configuration here, so choose the basic option and move on (see Figure 1-1).'
