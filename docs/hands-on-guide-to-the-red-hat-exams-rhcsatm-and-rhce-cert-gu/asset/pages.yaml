  md: 'Instructions: This lab is based on the lab setup outlined in the introduction
    to this book. It requires that you have a basic Red Hat installation on host RHEL01
    and RHEL02. You have 2.5 hours to complete this lab.


    Task 1: Using RHEL02 as your server, perform a network install of host Client01
    using the FTP protocol. No desktop manager (Gnome or KDE) is required for Client01
    during the installation.


    Task 2: Run the t_root_password script on RHEL02. The root password should be
    changed to something random. Recover the root password and change it to SecurePass.


    Task 3: On Client01, change the default system level to 3.


    Task 4: Create a new user called User03. Give the user any password, but force
    it to expire and be changed on the first login of User03.


    Task 5: On RHEL02, output the status of each network service at each runlevel
    to a file called runlevel_stats.


    Task 6: On RHEL01, implement the following:


    +   - On /dev/hdb, configure this disk to LVM and create three logical volumes
    of equal size.


    +   - Give the second logical volume name backups.


    +   - On /dev/hdc, create the following basic partitions: one partition 3GB in
    size, a swap 2GB in size, and one partition 1GB in size.


    +   - Create ext4 file systems on all created partitions except the swap partition.


    +   - Enable the swap partition.


    Task 7: Modify the default timeout for kernel selection during boot to be 20 seconds.
    Also, create a second entry in the GRUB config file that allows you to boot into
    single-user mode.


    ![](img/6f327e3a1ee7ed861fc5243dfa758aa6_514_0.png)'
  merge: -1
  pgno: 514
- img_proc: true
  md: '# Lab Exam 1


    **Task 8:** Create a user called jsmith on Client01. Create the directory /opt/jsmith.
    When the user logs in to the system, his home directory should be /opt/jsmith.


    **Task 9:** Create the following files: /opt/secret_data and /opt/salaries. Create
    an ACL on both files so that user0 and jsmith can both read them, can write to
    them, and the files must be owned by root.


    **Task 10:** Set up SELinux to be enforcing RHEL01 and RHEL02. All other systems
    on the network should have SELinux disabled.


    **Task 11:** Create a user called user02 on RHEL02. Create a script that will
    output the amount of free disk space and write the results to the file /opt/free_space.
    Have user02 create a cron job running the newly created script once every three
    hours.


    **Task 12:** Set up an FTP server on RHEL01. Create the directory /opt/ftp_data
    and make it the only accessible directory to the FTP server. Anonymous access
    should be allowed to the FTP server.


    **Task 13:** Create the following firewall rule:


    +   - All systems on the 172.168.1.0/24 subnet should have access to the FTP server
    on RHEL01. All other systems should be denied access.


    +   - Users from Client01 should be able to remote into RHEL01 via SSH. No other
    systems should have SSH access to RHEL01.


    +   - On RHEL02, open TCP port 69 for the IP 172.168.1.50 only.'
  merge: -1
