    # PAM Troubleshooting


    No one is expected to remember what all the modules for PAM do or what their options
    are. Knowing where to look when you need to troubleshoot PAM will help you quickly
    resolve or customize whatever you need with PAM. First, you should know that the
    /usr/share/doc/pam-<version>/txt directory contains readme files that provide
    details and arguments for each of the PAM modules you can use. This information
    helps when trying to figure out exactly what a particular module does. Second,
    you know that PAM logs to a separate log, making it easier to find issues. The
    /var/log/secure log provides information relating to PAM events. If you’re troubleshooting
    or customizing something, you can use this log file as a reference to make sure
    that everything is working properly. One last issue to check with PAM is to see
    whether'
