    # Postfix Security


    Because mail servers are omnipresent, it is vital that you understand how to lock
    down particular features of them. For outgoing mail servers that deal with the
    SMTP protocol like Postfix, you should make sure that it is not open to be used
    as a mail relay. This would allow outsiders to use your server for spam. To do
    this, you can open the /etc/postfix/access file and allow the hostname or IP address
    of any server(s) that you''d like to be allowed to relay mail through your outgoing
    mail server.


    If you want to allow RHEL02 to relay mail, but not either of the client systems,
    you could do the following:


    ```

    # nano /etc/postfix/access

    172.168.1.2 RELAY

    172.168.1.10 REJECT

    Client02 REJECT

    ```


    For additional security, you can also use the following options in /etc/postfix/main.cf:


    These settings limit access to your mail server to only those within your network.
    They also limit the number of recipients that can be addressed in a single message.


    Aside from locking down your mail server, you can also relay mail through another
    SMTP server. In the /etc/postfix/main.cf config file, define a relayhost with
    the name of the smartest you''d like to relay through:


    ```

    # nano /etc/postfix/main.cf

    relayhost = mail.example-a.com

    ```'
