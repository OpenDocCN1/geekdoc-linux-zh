  md: '# System Initialization


    The boot process can be quite complex if you have never worked with it before.
    That being said, it is important to understand so that you can troubleshoot the
    system should it not boot properly. When a computer boots up, the BIOS is the
    first program that is run. After it is loaded, the BIOS begins to test the system
    through the Power On Self Test (POST) and then starts loading peripheral devices.
    The BIOS then contains the master boot record (MBR), which starts to boot the
    system via the bootloader. From here, the Grand Unified Bootloader (GRUB, the
    boot manager) looks into the kernel that is labeled as the default. Finally, the
    kernel calls the init process (the first process to be spawned on a Linux system),
    which boots the rest of the system. Aside from troubleshooting the boot process,
    you also need to understand how services are started and stopped, how to add system
    services to the boot process, and how to manage the bootloader itself.


    # The Boot Process


    Let''s look again at the boot process, but this time we can examine each area
    more in depth, with the GRUB bootloader. The Grand Unified Bootloader has the
    default bootloader for Red Hat, Ubuntu, and many other versions of Linux as well.
    The bootloader can be used to boot into different operating systems (usually called
    a multiboot system), for system recovery, and boot the kernel using special arguments.
    When GRUB loads, you are given a list of kernels and additional operating systems
    (if available) from which you can choose to boot (see Figure 2-1).


    By default, there is a configurable 5-second timeout value that chooses the default
    kernel if you don''t make a selection and the timeout threshold is reached.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# 48 Hands-on Guide to the Red Hat® Exams: RHCSSA™ and RHCE® Cert Guide and
