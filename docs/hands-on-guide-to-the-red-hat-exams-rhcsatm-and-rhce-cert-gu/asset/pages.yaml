  md: '# 328 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and
    Lab Manual


    The options defined within this section apply specifically to the website and
    directory structure, defined by the Directory option. For the preceding example,
    this site located in the /var/www/html directory. If you want to change the directory
    where your site is located, you need to change the DocumentRoot option as well
    as the Directory option. The default option is


    ```

    DocumentRoot "/var/www/html"

    ```


    There is also a way to have multiple sites using virtual hosts, as you see later.
    When your config file is completely set up as you want it, you can use the http
    service to test your config file. Using the configtest argument, the service parses
    the main file for any errors and reports back if something is found. It is always
    a good idea to check your config file before trying to use it it will prevent
    the server from starting if it contains any errors.


    Test the config file:


    ```

    # service http configtest

    Syntax OK

    ```


    There is another cool option that the httpd service has (many services have it,
    but it is more useful). Normally, for a service to use a new config file, it requires
    that the service is restarted. This restart actually stops the service from running
    before starting over again. Normally, this isn''t a big deal, when hundreds of
    people are hitting your site, can you afford even a two-second outage? To circumvent
    this issue, you can use the reload argument, which allows the main config file
    to be reاد without the actual service being brought down. This is why it is important
    to test your config files first.


    To restart the httpd service, use the following command:


    ```

    # service httpd restart

    Stopping httpd: [ OK ]

    Starting httpd: [ OK ]

    ```


    To reload the service and reread the config file, use this command instead:


    ```

    # service httpd reload

    Reloading httpd: [ OK ]

    ```


    One other option to keep in mind is the graceful parameter. It restarts the web
    server, allowing it to read the new config file changes without disconnecting
    any currently connected clients. The only downfall here is that the active connections
    use the old config file until they terminate their connection and reconnect. You
    can use it as follows:


    ```

    # service httpd graceful

    ```'
