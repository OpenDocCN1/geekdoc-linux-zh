  md: '# Chapter 6: Package Management 173


    Now let''s install the new version downloaded from the Web:


    ```

    # rpm -ivh nano-2.2.6-1.x86_64.rpm

    Preparing... ####################################### [100%]

    1:nano ############################################### [100%]

    ```


    Again, you can query for the package to see that the version has changed, indicating
    that the package has been updated:


    ```

    # rpm -qa | grep nano

    nano-2.2.6-1.el16.x86_64

    ```


    # REAL-WORLD TIP


    If you have worked with package management before, you might be wondering why
    I suggest not using the single -q option to query for the package:


    ```

    # rpm -q nano

    ```


    The reason to stay away from this is that you get results only if you know the
    exact name of the package. For example, say you query to see whether the text
    editor vim is installed:


    ```

    # rpm -q vim

    ```


    You get no results, making you think that the package is not installed. Now query
    the other way:


    ```

    # rpm -qa | grep vim

    vim-enhanced-7.0.109-6.el16.x86_64

    vim-common-7.0.109-6.el16.x86_64

    vim-minimal-7.0.109-6.el16.x86_64

    ```


    You can see that it is, fact, installed and the package is named something other
    than what you thought it was. The grep command uses regex to check among all installed
    packages, giving you for a second more accurate results.


    Let''s take a step back and if your boss tells you that you just installed the
    postfix package from that you had never heard before? You can query information
    that is provided by the package, providing details of what the package does. This
    way, you don''t have to ask your boss and can see some detailed information on
