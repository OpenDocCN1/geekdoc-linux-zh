  md: '# Task 2 – RAID


    Step 1. Disk /dev/hdc on RHEL01 needs to be partitioned. Use the following guidelines
    while partitioning the disk:


    +   - There should be three equal-sized partitions that consume the whole disk.


    +   - The third partition should be set up a swap partition.


    +   - The first two partitions should be set up in a RAID 1 array.


    The task is complete when the partitions and RAID array have been created and
    can be verified.


    # Task 3 – LVM


    Step 1. Set up LVM on your system using the following guidelines:


    +   - Create a physical volume on /dev/hdd.


    +   - Create a volume group called VolGroup22.


    +   - Create two logical volumes within VolGroup22.


    +   - The first logical volume should have the default name.


    +   - The second logical volume should be named Company_Data.


    +   - Both logical volumes should be 2,048MB in size.


    Step 2. Make the following changes to your LVM structure:


    +   - Extend your LVM structure by adding /dev/hdb3 into the volume group (VolGroup22).


    +   - Grow your Company_Data volume to fill the rest of the volume group.


    The task is complete when the logical volumes, volume groups, and physical volumes
    can all be verified.'
