  md: '# Virtualization with KVM


    Kernal-based Virtualization Module (KVM) is a kernel module built for RHEL6. Because
    support for KVM is officially built into the RHEL6 kernel only, if you''re still
    on RHEL5, you need to upgrade before proceeding in this chapter. KVM can be used
    to create and manage virtual systems built on the physical host with the KVM package.
    This capability is useful for consolidating servers and keeping costs down. There
    is also a security and ease of management benefit as well. Although Red Hat doesn''t
    require you to virtualization in depth, there are some basic requirements. This
    chapter covers the basics of setting up a physical host and creating virtual machines.
    We also look at how to manage virtual resources.


    # Working with Virtual Machines


    When choosing a system to serve as your physical host for any number of virtual
    clients, you need to do some planning. Your host system requires enough resources
    to support itself and the virtual machines. Ensure that you have sufficient CPU
    processing power, memory, and storage space. You need to plan how many virtual
    machines you would like to build on top of your host and scale your physical host
    system accordingly.


    # Setting Up the Physical Host


    The creation of virtual machines is done through the use of a hypervisor. This
    hypervisor allows the sharing of resources between the physical and virtual systems.
    In RHEL6, the KVM hypervisor requires a 64-bit host system with the correct extensions
    (Intel 64 or AMD64).


    When you''re getting started with virtualization, there are a few packages that
    need to be installed (and many different ways to do it). If you install Red Hat
    from the DVD, you can select the Virtual Host option to install the required packages
    automatically. If you''re installing from a kickstart file, you can use the @kvm
    directive to accomplish the same thing. Another option is to install the files
    from the repositories as normal if your installation is already in place.'
  merge: -1
  pgno: 505
- img_proc: true
  md: '# 474 Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and
    Lab Manual


    > **WARNING:** You won''t receive any updates from Red Hat unless you have a virtual-ization
    entitlement license.


    **NOTE:** Because you are using virtual machines already to emulate the lab, you
    won''t be able to follow along with the commands in this chapter unless you have
    a separate side machine lying around.


    To start, install the required packages for KVM:


    ```

    # yum install -y python-virtint virt-manager libvirt-client

    Verify that the packages were installed correctly:

    ```


    ```

    # rpm -qa | grep libvirt

    libvirt-client-0.8.1-27.el6.x86_64

    libvirt-0.8.1-27.el6.x86_64

    python-virtint-0.500.3-7.el6.noarch

    libvirt-python-0.8.1-27.el6.x86_64

    virt-manager-0.8.4-8.el6.noarch

    ```


    # Installing a Virtual Client


    If you''ve worked in VMware or VirtualBox before, you''re probably thinking of
    looking for the GUI to set up your clients. For purposes of this chapter, first
    install the client from the command line and then do it again using the GUI front
    end. Using KVM from the command line makes for easier administration (mostly you
    can automate processes through scripts). Using the virt-install, you can create,
    manage, and automate the virtual machines.


    Syntax: virt-install --name NAME RAM STORAGE INSTALL [options]


    One problem is there are tons of options for this command, so there is not enough
    room to list them all. For a complete list of options, use the following:


    ```

    # virt-install --help

    ```


    This command can be used interactively or through scripts, making it easy to create
    virtual guests. Aside from the virt-install command, you can also use virt-manager,
    which can accomplish many of the same tasks. This GUI virt-manager utility (front
    end) is used to create virtual guests. If you have an average-connection to the
    command line, you can use the virt-manager utility to achieve the same results.
    Regardless of which method you use, there are a few things that remain constant.
    You can install virtual guests as you would any normal physical host: through
    local installation media, network installation, or PXE.'
  merge: -1
  pgno: 506
- img_proc: true
  md: '# Chapter 22: Virtualization with KVM


    REAL-WORLD TIP

    Red Hat recommends that you use the /var/lib/libvirt/images directory to hold
    the virtual guest image files. These image files are the virtual disks to run
    each virtual guest. You can also store ISO files here for local installation.
    This location is preconfigured for use with SELinux, so other location requires
    a custom policy within SELinux to work (which is beyond the scope of this book).


    Let''s create a single virtual guest using virt-install:


    ```

    # virt-install --name Client03 --ram 512 --disk path=/var/lib/libvirt/images/client03.img,size=8
    --network network=default --cdrom /dev/cdrom

    ```


    This looks like a lot to take in for one command; however, it is quite simple
    when you break down the parts. This command creates a virtual guest Client03 with
    512GB of memory and 8GB of storage. The network interface is set to the default
    (which is the first network adapter), and the installation occurs from the DVD
    mounted on /dev/cdrom. Remember that you can also use the virt-manager utility
    if you are more comfortable with a graphical interface.


    Give your guest a name and choose the install media, as shown in Figure 22-1.


    ![](img/6f327e3a1ee7ed861fc5243dfa758aa6_507_0.png)


    Figure 22-1 Choosing a name.


    Provide a storage path to the virtual disk (see Figure 22-2).'
  merge: -1
