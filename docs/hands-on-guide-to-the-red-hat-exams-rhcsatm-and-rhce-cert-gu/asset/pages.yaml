    # Group Collaboration


    Group collaboration is an essential part of any business and for any system administrator
    who knows users. Knowing how to set up group collaboration is definitely a key
    skill to have. Here we look at three key features about file and directory permissions,
    which allow you to let users work together:


    +   - setuid This flag is used to allow multiuser access.


    +   - setgid This flag is used to allow multigroup access.


    +   - sticky bit This flag prevents accidental delete by users or groups.


    For group collaboration, you need two key commands as follows:


    +   - chmod Changes permissions on files and directories


    +   - chown Changes ownership of files and directories


    The first feature is setuid, which is set on the owner level with the chmod command.
    This allows executables to be run with the privileges of the file''s owner. For
    example, if you have a script that generates reports for your company, but the
    script must be run as user01 you can set the setuid bit to enable other users
    to run this command as though they were user01.


    Create a file to hold the report script:


    ```

    # touch reporting_script

    ```'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# 210 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Cert Guide and
    Lab Manual


    Next, set the setuid bit:


    ```

    # chmod 4755 reporting_script

    ```


    You could also use the following:


    ```

    # chmod u+s reporting_script

    ```


    Now view the permissions of the file:


    ```

    # 11

    ```


    ```

    total 12

    -rsw-xr-x 1 user user01 0 Jun 8 17:20 reporting_script.sh

    ```


    In the file''s owner, notice that there is an s in place of the x. This shows
    that the file has the setuid flag set. Now if you''re logged in as user02, you
    can still run this command as though you are user01.


    > REAL-WORLD TIP

    Although the example we just looked at works properly, you can''t use the setuid
    flag on scripts owned by the root user. You can, however, use it on binaries owned
    by the root user.


    > REAL-WORLD TIP

    As security tip, you can search your entire system for all files with the setuid
    bit to see what your users have access to run as another user.

    To find setuid files, use the following:


    ```

    # find / -perm 4000

    ```


    Next, let''s look at setgid, which is similar to setuid but set at the group level
    instead. With this bit, all users of the group are able to execute the file instead
    of just the user who owns it. The setgid bit allows users to collaborate on files.
    Let''s create a directory for users to share and then assign it the correct permissions.


    Step 1. As root, create the directory:


    ```

    # mkdir /tmp/Sales

    ```


    Step 2. Create the group and add users to it:


    ```

    # groupadd Sales

    # usermod -G Sales user02

    # usermod -G Sales user03

    ```


    Step 3. Assign the permissions for collaboration:


    ```

    # chown nobody:Sales Sales/

    # chmod 2770 /tmp/Sales

    ```'
