- img_proc: true
  md: '![](img/6f327e3a1ee7ed861fc5243dfa758aa6_508_0.png)


    Set the memory amount and number of CPUs to use (see Figure 22-3).


    ![](img/6f327e3a1ee7ed861fc5243dfa758aa6_508_1.png)


    Choose the storage size (see Figure 22-4).


    Choose the network adapter to use (see Figure 22-5).


    At this point, your virtual guest is created back on the main window. If you view
    the settings, you see additional options that you can edit for your virtual machine.'
