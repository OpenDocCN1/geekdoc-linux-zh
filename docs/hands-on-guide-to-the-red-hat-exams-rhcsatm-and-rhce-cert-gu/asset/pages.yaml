  md: 'If you want to upgrade this package (because you know that it is already installed),
    you can substitute the -i option for -U. This command upgrades the package or
    in-stalls if the package is not already installed:


    ```

    # rpm -Uvh nano-2.2.6-1.x86_64.rpm

    ############################################ [100]

    Preparing...                             #############################################
    [100]

    nano:

    ```


    You might decide that you no longer want the package installed. In that case,
    you can use the -e option to remove it:


    ```

    # rpm -e nano

    ```


    You can always reinstall the package at a later date if you keep the .rpm file
    on your system (or you can download it again).


    # REAL-WORLD TIP


    A common situation to run into the job is installing a package that is already-ready.
    You don''t have to go through the trouble of uninstalling the package first to
    reinstall it. You can use the -replacepkgs option alongside the regular install
    options to overwrite an existing installation:


    ```

    # rpm -ivh -replacepkgs nano-2.2.6-1.x86_64.rpm

    ```


    You just installed the latest version of a package and want to make sure it is
    properly installed. How do you check? You can use the query and verification options
    for the rpm command, of course. This time, jump back to the installation of nano
    for a second. before you install the package, you can query the currently installed
    system packages to verify whether nano is already installed. If you already installed
    the newer version of nano, your output might look slightly different from mine.


    Query the installed system packages for nano:


    ```

    # rpm -qa | grep nano

    nano-1.3.12-1.el16.x86_64

    ```


    The -q option tells rpm that you are querying for something, and the -a option
    tells rpm to query all packages installed on the system. You don''t want to list
    every single package, however, you can use the grep to pick out only the package(s)
    you are hunting for. The benefit of using grep is great that it is actually a
    pattern match, so it returns multiple results matching what you are looking for
    (giving you all the installed packages on the system relating to nano or whatever
    you are hunting for). If the package doesn''t exist, no results are returned.
    As you can see here, the package does exist and it is at version 1.3.12.'
