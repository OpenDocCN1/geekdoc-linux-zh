  md: '# Chapter 9: System Logging, Monitoring, and Automation 257


    Here, the root user is defined to run the specified commands. This user field
    is now optional in RHEL6.


    What do you think happens if you set up cron jobs to run during the night (say,
    to run some reports) and you shut down the system right before you go home? It
    turns out there is another great feature of cron. The /etc/anacontab file defines
    jobs that should be run every time the system is started. If your system is turned
    off during the time that a cron job should run, when the system boots again, the
    cron service will call /etc/anacontab to make sure that all missed cron are run.


    Let''s look at the /etc/anacontab file:


    ```

    # cat anacontab

    SHELL=/bin/sh

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    # the maximum random delay added to the base delay of the jobs

    RANDOM_DELAY=45

    # the jobs will be started during the following hours only

    START_HOURS-RANGE=3-22

    ```


    | period in days | delay in minutes | job-identifier |

    |---|---|-|

    | 1 | 5 | cron.daily run-parts /etc/cron.daily |

    | 7 | 25 | cron.weekly run-parts /etc/cron.weekly |

    | @monthly | 45 | cron.monthly run-parts /etc/cron.monthly |


    The comments in this file make it easy to understand how jobs are defined. If
    your system is constantly on and you don''t require anacron to be run, you can
    uninstall the cronie-anac package, which controls just the anacron commands for
    the cron service.


    # MIGRATION TIP


    In RHEL5, anacron was a separate service from cron. The anacron service alone
    called when the system booted and similarly ran the /etc/anacontab file. Its looks
    similar to the RHEL6 version without any comments:


    ```

    # cat anacontab

    SHELL=/bin/sh

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    ```


    | 1 | 65 | cron.daily run-parts /etc/cron.daily |

    | 7 | 70 | cron.weekly run-parts /etc/cron.weekly |

    | 30 | 75 | cron.monthly run-parts /etc/cron.monthly |'
