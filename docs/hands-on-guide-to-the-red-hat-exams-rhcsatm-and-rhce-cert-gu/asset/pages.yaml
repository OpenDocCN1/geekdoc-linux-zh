    When you''re comfortable working with processes, you can then make some advanced
    adjustments, such as changing the priority of a particular process. Let''s say
    that you use a custom application running on your system. You can use the renice
    command to give that particular process higher priority on the CPU.


    Syntax: renice <priority> [options]


    Options:


    +   - p PID Changes process priority for a particular PID

    -u user Changes process priority for a particular user(s)


    The priority values range from -20 (first priority) to 20 (last priority). Only
    the root user may set processes to a priority under 0. Going back to the example,
    you can give the extra priority by using the following:


    ```

    # renice -2 3874

    ```


    This command changes the application process (3874) to have better priority than
    its default priority of 0. Knowing how to work with system and extract information
    from your system will help you become a better system administrator. It can also
    help you troubleshoot after the Red Hat exams.


