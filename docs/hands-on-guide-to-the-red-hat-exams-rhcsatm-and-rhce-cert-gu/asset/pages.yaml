    # EXAM TIP


    Whenever you make changes to the Samba users, you need to restart the service
    before you can use them.


    At this point, everything should be in place for your Samba server. You just need
    to make sure that the directories you specified to be a Samba share exists because
    you created /opt/company_data back in Chapter 4, "File Systems and Such")


    **Step 1.** If you haven''t done so already, start the Samba service:


    ```

    # service smb start

    Starting services:

    ```


    **Step 2.** Verify that the service is running:


    ```

    # service smb status

    smbd (pid 3145) is running...

    SELinux and Firewall Configuration

    ```


    If you are accustomed to Windows systems, you should already know what ports you
    need to open on the firewall:


    **Step 1.** Use the iptables command to create your firewall rules:


    ```

