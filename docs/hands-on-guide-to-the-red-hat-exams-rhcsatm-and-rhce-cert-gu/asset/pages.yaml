- img_proc: true
  md: '# Apache Security


    In the previous section, we addressed the firewall rules and SELinux policy changes
    required to get the httpd service working. This section goes more in depth with
    Apache security because it is such a large topic. For the exam and particularly
    in the real world, you need to be able to configure host-based and user-based
    security for Apache. You are also required to set up a secure website using the
    HTTPS protocol.


    # Host-Based Security


    To start, you can limit the IP address on which the server can listen for incoming
    connections. You use the Listen option to define an IP address and a port, usually
    80. This capability is helpful if you have multiple IP addresses because it allows
    access only to the IP address and that network, you specify.


    On the RHEL01 system, there are two IP addresses: 172.168.1.1 and 192.168.1.5.
    Let''s configure this Apache server to allow clients to access it only from the
    172.168.1.0/24 network:


    ```

    Listen 172.168.1.1:80

    ```


    Now RHEL01 will only listen on the 172.168.1.1 IP address on port 80 for incoming
    requests.


    Next, look at the <Directory> section, which holds options pertaining to the main
    server config. Within this section, the first thing you do is to restrict the
    networks, IP addresses, or domains that have access to the web server. In the
    <Directory> section, let''s set up Allow from and Deny from options.


    +   Step 1. Allow all hosts to connect:

    Allow from all


    +   Step 2. To allow only a specific IP or host, use the following:

    Allow from 172.168.1.2


    +   Step 3. You could also use the hostname:

    Allow from RHEL02


    +   Step 4. You can also specify a domain:

    Allow from .example.com


    +   Step 5. The deny options work in the same manner. To deny from a whole subnet,
    use the following:

    Deny from 192.168.1.1'
  merge: -1
  pgno: 366
- img_proc: true
  md: "# Chapter 14: Web Services\n\n**WARNING:** There are two things to watch out\
    \ for here. First, when you're specifying a domain to allow or deny from, make\
    \ sure you include the leading dot (;); otherwise-wise, the restriction won't\
    \ work properly. Second, when you specify a subnet, there is no ending dot (.)\
    \ or last octet.\n\nAfter you determine the hosts that you want to allow or deny\
    \ access to your web server, you need next to define which order they are applied\
    \ in:\n\n+   - Order allow, deny: Allows first and then denies everything else\n\
    - Order deny, allow: Denies first and then allows everything else\n\nBecause the\
    \ goal is to make the web server more secure, let's use the first option, which\
    \ denies everything by default. To finish the <directory> section, let's look\
    \ at general options and the AllowOverride option. The default setup in the config\
    \ file is pretty secure:\n\n+   - Options Indexes: Allows indexing of directories\
    \ and allows symlinks outside this <directory> section\n- AllowOverride None:\
    \ Does not allow any normal user to make changes in DocumentRoot\n\nThere are\
    \ quite a few different option settings you can define here. I suggest spending\
    \ some time in the man pages and the default config file, which contains detailed\
    \ documentation to the different options for Apache.\n\nThe complete <directory>\
    \ section looks like this:\n\n```\n<Directory \"/var/www/html\">\n  Options Indexes\
    \ FollowSymLinks\n  AllowOverride None\n  Order allow,deny\n  Allow from 172.168.1\n\
    </Directory>\n```\n\nThe options we have covered allow you to have a more secure\
    \ server through host-based security. Don't forget that these options are specific\
    \ to this one <directory> section and they can be different in each section. If\
    \ you want to define the defaults for any further subsections you want to have,\
    \ you can define all your options in the <Directory> section, which is the default\
    \ option.\n\n**NOTE:** By default, the httpd service runs with the following credentials:\n\
    \n+   - User apache\n- Group apache"
  merge: -1
  pgno: 367
- img_proc: true
  md: "This is a great default setting because it allows the http service to run only\
    \ as the Apache user. Should something on the server get compromised, the hacker\
    \ will be able to access only resources that the Apache user has access to, which\
    \ usually isn't anything outside the web directories.\n\n# User-Based Security\n\
    \nNow that we have configured host-based authentication, we can move on to user-based\
    \ authentication. This provides a way to allow only certain users or groups to\
    \ access the web server or portions of the web server. Here are the options that\
    \ can be used for based security:\n\n| AuthType | Defines the authentication type\
    \ |\n| AuthName | Adds a comment for the user to see on login |\n| UserFile |\
    \ Specifies the file used to define username and password |\n| AuthGroup | Is\
    \ similar to the user file but for groups |\n| Require | Specifies the users or\
    \ groups that can log in |\n\nLet's look at an example to make the usage of these\
    \ options more clear. Suppose you want to protect the main site because it contains\
    \ information for human resources (HR) that shouldn't get out.\n\n**Step 1.**\
    \ Define the following under the main server section in the config file:\n\n```\n\
    <Directory '/var/www/html>\n  AuthType Basic\n  AuthName \"Password Restricted\
    \ Area\"\n  UserFile /etc/httpd/userfile\n  Require user01\n</Directory>\n```\n\
    \nNow you can go over to the /etc/httpd directory and create a userfile to hold\
    \ the user accounts. You can use the htpasswd command to create the user and group\
    \ accounts.\n\n**Step 2.** Create the sole user who will need access to this site:\n\
    \n```\n# htpasswd -cm /etc/httpd/userfile user01\nNew password:\nRe-type new password:\n\
    Adding password for user01\n```"
  merge: -1
  pgno: 368
- img_proc: true
  md: "There are two very important issues to note here. First, notice the -c\noption\
    \ when calling this command, which creates the file and populates\nit with the\
    \ first user and password. DO NOT use this option again\nwhen creating subsequent\
    \ users; otherwise, it will completely override\nthe file and you will lose all\
    \ users in file. The second is the -m op-\ntion, which uses MD5 encryption when\
    \ writing the passwords to the\nfile. You should use this otherwise; otherwise\
    \ anyone will be able to see the\nusername and password combo in clear-text!\n\
    \n# Step 3. Restart the web server:\n\n```\n# service http reload\nReloading httpd:\
    \ [ OK ]\n```\n\nAccess the main page by pointing your browser from any system\
    \ on\n172.168.1.0/24 network to http://172.168.1.1/index.html. You should\be prompted\
    \ for a username and password. It is great! You now have\na secure site, and HR\
    \ can begin posting documents here. There is\na problem, Suppose HR would like\
    \ the site to be fully\naccessible to the company, for public news. But they also\
    \ want to have\na section where only HR employees can go to view things (like\
    \ everyone's\nsalary). Not a problem. You can just make a few changes to make\
    \ all\nthis happen.\n\n# Step 4. Open your main config file and change your <Directory>\
    \ section:\n\n```\n<Directory> /var/www/html>\n\nAllowOverride authconfig\n\n\
    </Directory>\n```\n\n# Step 5. Save your config file and navigate to your web\
    \ directory structure.\n\n# Step 6. Here, create a new directory to hold the documents\
    \ for the HR group:\n\n```\n# cd /var/www/html\n# mkdir hr\n```\n\nNow, you need\
    \ to create a file called .htaccess that defines who has ac-\ncess to this directory.\
    \ This is allowed on a per-directory basis because\nyou are allowing this file\
    \ to \"override\" the default access of anyone (this\nis why you choose the AllowOverride\
    \ option in the main config file).\n\n# Step 7. Enter the following into the file:\n\
    \n```\n# nano .htaccess\nAuthType Basic\nAuthName \"Password Restricted Area\"\
    \nAuthGroupFile /etc/httpd/groupfile\nRequire group hr_users\n```"
  merge: -1
  pgno: 369
- img_proc: true
  md: 'Like the user-defined access, this allows only users from the hr_users group,
    defined in the /etc/httpd/groupfile. Save this file and close it. The last step
    you need to do is add a few user accounts for the HR users to the already-existing
    userfile and then allow the hr_users in the group file.


    # Step 8. Create a few user accounts:


    ```

    # htpasswd -m /etc/httpd/userfile hr0

    New password:

    Re-type new password:

    Adding password for user hr01

    ```


    ```

    # htpasswd -m /etc/httpd/userfile hr02

    New password:

    Re-type new password:

    Adding password for user hr02

    ```


    # Step 9. In /etc/httpd/groupfile, add the following:

    h_users: hr01 hr02


    # Step 10. With everything in place, you can restart the web server:


    ```

    # service httpd reload [ OK ]

    Reloading httpd:

    ```


    Now if you try to access http://172.168.1.1/index.html, you will have no problem.
    This area is no longer password-protected. However, if you were to go over http://172.168.1.1/test.html,
    you would be prompted for a username and password. You will also notice, however,
    that if you used user01 as the username, you are not able to access this area.
    The reason is that you used the Require option, which requires a member of the
    hr_users group you defined.


    There is one other option that falls under user security that you should be aware
    of in case it comes up on the exam. The option is called UserDir, and when it''s
    enabled, allows users to browse and access the public_html directory within their
    home folder. This option could be useful if you want each user to share some files
    over the Web, but I shouldn''t even need to tell you what security issue this
    is if left unchecked. By default, this option is disabled, and with good reason.


    If you need to be able to share content out of a user''s home directory for the
    exam, set the following option in the main config file:


    Userdir public_html'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'Then navigate to any user account on the system, create a public_html directory

    it doesn''t exist, and set the appropriate permissions:


    ```

    # cd /home/user01

    # mkdir public_html

    # chmod 701 /home/user01

    # chmod 705 -R /home/user01/public_html

    ```


    > CAUTION: I can''t stress to the importance of not using this UserDir option.

    You would be allowing your user''s home directory to be executable and your

    public_html would be readable and executable. This just screams security problem!

    The only reason I cover in this book is that you are aware of the option for the

    exam. In the real world, use caution when setting up this option!


    # Setting Up HTTPS


    Aside from normal websites, you can also have secure websites with the HTTPS

    protocol. Configuring secure websites in Apache is simple. If you haven''t already

    installed the mod_ssl package, you need to do so before anything. When this

    package is installed, the /etc/httpd/conf.d/ssl.conf file is added to your system.

    This file contains the configuration settings for your secure web server.


    Here is what the default file looks like:


    ```

    # grep -v ^# /etc/httpd/conf.d/ssl.conf


    LoadModule mod_ssl modules/mod_ssl


    Listen 443


    SSLPassPhraseDialog builtin


    SSLSessionCache shm:/var/cache/mod_ssl/scache(512000)

    SSLSessionTimeout 300


    SSLMutex default


    SSLRandom startup file:/dev/urandom 256

    SSLRandom connect builtin


    CryptoDevice builtin


    <VirtualHost _default_:443>


    ErrorLog logs/ssl_error_log

    TransferLog logs/ssl_access_log

    ```'
  merge: -1
  pgno: 371
- img_proc: true
  md: 'LogLevel warn


    SSLEngine on


    SSLProtocol all -SSLv2


    SSLCipherSuite ALL:ADH:EXPORT:!SSLv2:RC4+RSA:+HIGH:+MEDIUM:+LOW


    SSLCertificate /etc/pki/tls/certs/localhost.crt


    SSLCertificateKeyFile /etc/pki/tls/private/localhost.key


    ```

    <Files ".cgi(shtml|plhtml|php)?$">

    SSLOptions +StdEnvVars

    </Files>

    <Directory /var/www/*cgi-bin*>

    SSLOptions +StdEnvVars

    </Directory>

    ```


    ```

    SetEnvIf User-Agent ".MSIE.*" \

    nokeepalive ssl-un-shutdown \

    dngrade-1.0 force-response-1.0

    ```


    ```

    CustomLog logs/ssl_request_log \

    "%t %{SSL_PROTOCOL}x %{SSL_CIPHER} \%r" "%b"

    ```


    ```

    </VirtualHost>

    ```


    The most important elements here are the Listen option and the options defined
    within the <VirtualHost _default:443> </VirtualHost> tags. By default, the secure
    site is hosted as a virtual host (which is nice because you have to run it alongside
    other unsecured sites). We cover virtual hosts later in this chapter.


    You should also take note of the following options:


    SSLCertificate /etc/pki/tls/certs/localhost.crt

    SSLCertificateKeyFile /etc/pki/tls/private/localhost.key


    They define the options and locations of your certificate file and key, which
    are used when hosting a secure website. Although the default options will work,
    if you change the IP address or domain name pair, you will need to generate a
    new certificate and key. Installing the crypto-utils package provides you with
    the openssl and genkey commands required to accomplish this. Because this topic
    isn''t part of the exam, however, I don''t go through the full steps.'
  merge: -1
