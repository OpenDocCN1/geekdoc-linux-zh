  md: '# Chapter 12: System Security 299


    # REAL-WORLD TIP


    In the real world, you will work with firewall rules constantly. One important
    point to remember is when testing firewall rules, you will not always be in front
    of the system you''re working on. When tuning or creating your rules, you need
    to be careful that you do not create a rule that will lock out of your system!
    Nothing is worse than tuning a rule and saving it, only to realize later that
    you have locked yourself out of the system and need to drive three hours to your
    disaster recovery site because you can''t get access to your server!


    # Troubleshooting Firewall Rules


    When troubleshooting firewall rules and connections, you can temporarily disable
    the firewall to make sure that the firewall is really what is causing your problem
    in the first place. You can also use the status option of the service command
    to see the current status of iptables.


    ```

    # service iptables status

    Table: filter

    Chain INPUT (policy ACCEPT)

    num target opt source destination state

    1 ACCEPT all -- 0.0.0.0/0.0.0.0

    RELATED,ESTABLISHED

    2 ACCEPT icmp -- 0.0.0.0/0.0.0.0

    3 ACCEPT all -- 0.0.0.0/0.0.0.0

    4 ACCEPT tcp -- 0.0.0.0/0.0.0.0 state NEW tcp dpt:22

    5 REJECT all -- 0.0.0.0/0.0.0.0 reject-with-icmp-

    host-prohibited

    ```


    ```

    Chain FORWARD (policy ACCEPT)

    num target opt source destination

    1 ACCEPT all -- 0.0.0.0/0.0.0.0 PHYSDEV match --

    physdev-is-bridged

    2 REJECT all -- 0.0.0.0/0.0.0.0 reject-with-icmp-

    host-prohibited

    ```


    ```

    Chain OUTPUT (policy ACCEPT)

    num target opt source destination

    ```


    You can also check the /var/log/messages file to look for any messages that iptables
    produces because this is the default log file. If there is a lot going with the
    system, it may be difficult to pick out messages because this file houses logs
    for many different services. While this topic isn''t on the exam, it is really
    useful in the real world to get solid feedback from the firewall service.'
  merge: -1
