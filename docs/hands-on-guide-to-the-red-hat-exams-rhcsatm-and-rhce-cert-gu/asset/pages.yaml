  md: '# Chapter 7: User Administration 203


    When you create or delete users, sometimes things don''t always work properly.
    This can cause the password files to become inconsistent. You can use the pwck
    command to verify the consistency between the /etc/passwd file and the /etc/shadow
    file:


    ```

    # pwck

    user admin: directory /var/adm does not exist

    user news: directory /etc/passwd does not exist

    user uucp: directory /var/spool/uucp does not exist

    pwck: no changes

    ```


    One topic along the lines of passwords is locking and unlocking user accounts.
    This can be done by manipulating users'' passwords in the /etc/shadow file (usually
    through the usermod command, by hand). As a real-world example, suppose you are
    hiring two new people next week. The boss says, "I want two accounts for these
    two new people so that they are ready to go and don''t have to wait on anything
    to be set up." You should already know that creating accounts without passwords
    is not an option, and sometimes administrators are obsessive with security and
    don''t like to leave open accounts with default passwords. In this case, you create
    the two new users as you normally would with a standard default password (usually
    defined by policy) and then lock their accounts.


    +   Step 1. Create a user account:

    # useradd -c "New User" user06


    +   Step 2. Set the user''s default password:

    # password user06

    Changing password for user user06.

    New UNIX password:

    Retype new UNIX password:

    password: all authentication updated successfully.


    +   Step 3. Now lock the user''s account:

    # usermod -L user06


    Locked accounts have passwords that start with an exclamation point (!) in the
    /etc/shadow file.


    +   Step 4. Verify that the account is locked:

    # /etc/shadow grep user06

    user06::$s1$t9We02vMob3YrqtNp66n9ALudti:14805:0:99999:7:::


    Now when the user starts working Monday morning, you can simply unlock the user''s
    account and she is up and running.


    +   Step 5. Unlock the account:

    # usermod -U user06'
