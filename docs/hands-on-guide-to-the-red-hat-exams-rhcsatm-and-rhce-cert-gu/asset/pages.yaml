    ![](img/6f327e3a1ee7ed861fc5243dfa758aa6_80_0.png)


    **Figure 2-1** GRUB boot selection.


    # REAL-WORLD TIP


    Although the default is 5 seconds, some older video cards take just 5 seconds
    to display the screen. I recommend that you set the default to at least 5 seconds
    and 10 for older systems.


    After GRUB loads the kernel, it passes control over to the kernel, which in turn
    begins to initialize and configure the computer''s hardware. Depending on how
    your GRUB configuration file is set up, you may or not see anything during this
    process. There is a "quiet" option in GRUB that hides this process from the user
    (using a graphic of some sort is shown in its place, such as the Red Hat logo).
    During the boot process, everything is logged to the /var/log/dmesg file. You
    can also use the dmesg command to query information about the boot process after
    the system has booted. When the system''s drivers are in place, the kernel executes
    /sbin/init program.


    # REAL-WORLD TIP


    Although the Red Hat exams do not test on hardware, you can use the insmod command
    to troubleshoot in the real world if you are having a hardware problem.


    # GENERAL INFO


    In Red Hat 6, the boot process has been replaced by a new utility called Upstart
    instead of the traditional SysV init scripts. This utility decreases the time
    that it takes the system to boot and is already being used on other versions of
    Linux such as Ubuntu.'
  merge: -1
