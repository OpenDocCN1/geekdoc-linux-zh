  md: '# 434 Hands-on Guide to the Red Hat® Exams: RHCSA® and RHCE® Guide and Lab
    Manual


    According to the Red Hat Exam Prep Guide, you need to be able to synchronize clients
    with a higher-stratum server. The term stratum is used to define different levels,
    from 1 to 15, of time servers that are available to sync with. A stratum 1 time
    server is the most accurate. For load balancing and redundancy, you would probably
    want to configure a primary NTP server and a secondary NTP server to sync with
    a stratum 1 server (which is located off your network). Now let''s look more closely
    at both the server and client side of NTP.


    # Installing a Time Server


    Usually, the NTP package comes installed as part of your Red Hat system, but it
    is always good to know how to install it should you ever need to.


    If you need to, install the package:


    +   **Step 1.**  # yum install -y ntp


    +   **Step 2.**  Verify that the package has been installed:

    # rps -qa grep ntp

    tpdate-4.2.4p8-2.el16.x86_64

    tpdate-4.2.4p8-2.el16.x86_64


    +   **Step 3.**  Make sure that the service will start when the system boots up:

    # chconfig ntppd on


    +   **Step 4.**  Verify the service starts on boot:

    # chconfig ntppd --list

    tppd 0:off 1:off 2:on 3:on 4:on 5:on 6:off


    Before starting the service, let''s configure the system first.


    # Configuring NTP


    To configure the primary NTP server, let''s look at the config file that comes
    with the system:


    ```

    # cat /etc/ntp.conf

    ...

    server 0.rhel.pool.ntp.org

    server 1.rhel.pool.ntp.org

    server 2.rhel.pool.ntp.org

    ...

    #server 127.127.1.0

    #fudge 127.127.1.0 stratum 10

    ```'
  merge: -1
  pgno: 466
- img_proc: true
  md: 'The first three lines shown here are the Internet (public) NTP servers that
    you sync with for the correct time. The fourth server option, which is commented
    out, defines a local clock driver that you can use to update the time. This is
    usually based on the BIOS clock used. The final option, fudge, defines the stratum
    level to which your server is set. The server is set here at a stratum level of
    10; a local system clock is also defined, and there are three public Internet
    servers you can sync with for accurate time.


    # MIGRATION TIP


    In RHEL6, the local server and fudge options are both commented out by default.


    For now, just let the system sync with the public Internet time servers.


    +   Step 1. Start the NTP service:


    ```

    # service ntpd start

    Starting ntpd: [ OK ]

    ```


    With the server configured, you can turn your attention to one of the client systems.
    For this example, use the Client01 system to sync with the RHEL01 primary NTP
    server. On Client01, you need to verify that the NTP package is already installed:


    ```

    # rpm -qa | grep ntp

    tp-4.2.4p8-2.el6.x86_64

    ```


    With the client installed, again look at the config file. Instead of public servers,
    you can set the RHEL01 system as the primary server to sync with.


    +   Step 2. Define RHEL01 as the primary time server and make sure the driftfile
    line is uncommented:


    ```

    # cat /etc/ntp.conf

    ...

    Server                  172.168.1.1

    driftfile               /var/lib/ntp/drift

    ```


    Now the client is looking at RHEL01 to sync its time. The additional option, driftfile,
    is a scratch place for the NTP service to calculate time checks and errors for
    accuracy. It is recommended for better results but not required.


    # MIGRATION TIP


    In RHEL6, there is no longer a driftfile defined by default in the config file.'
  merge: -1
  pgno: 467
- img_proc: true
  md: '# EXAM TIP


    Configuration of the /etc/ntp.conf file works the same for NTP servers or clients.
    Regardless of which you are configuring, the steps are still the same; the difference
    comes when choosing upstream server to sync.


    Step 3. Now that the client is configured, you just need to start the service:


