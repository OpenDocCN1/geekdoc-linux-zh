  md: '# Preface


    This book was written as a lab guide to help individuals pass the RHCSA (EX200)
    and RHCE (EX300) exams. It is meant for those with different amounts of experience,
    from novice to expert, and is structured to make it easy for any reader to find
    what he is looking for. The book contains 22 chapters and two full-length labs


    # Book Features


    Each chapter includes the following elements to aid your learning:


    +   **Opening topics list**—This list defines the topics to be covered in the
    chapter; it also lists the corresponding Red Hat objectives.


    +   **Review Questions**—Review questions reinforce what you learned and help
    you identify what you may need to review.


    +   **Answers to Review Questions**—Answers are provided for each of the review
    questions.


    +   **Labs**—Chapters conclude with several lab-based exercises that provide hands-on
    training and also help you to see what questions on the actual exam might be like.


    The labs include scripts that can help you with troubleshooting. The scripts use
    the following syntax:


    +   `v_script_name` Used to verify a service or configuration


    +   `t_script_name` Used to cause trouble on your system


    I have also included two full-length labs at the end of the book intended to give
    you an experience like that of the real exam as well as examples of what the real
    exam might cover.


    I have also produced an additional set of scripts that you can download that purposely
    cause trouble on your system. You can download them from


    +   http://sourceforge.net/projects/rhcelabscripts/


    # Exam Registration and Costs


    To register for the Red Hat exams, you must visit Red Hat''s site at http://www.redhat.com/training
    and enroll online. The price for the new RHCSA exam is $399, and it is 2 hours
    in length. With the addition of the RHCSA certification, the price of the RHCE
    exam has been reduced to $399 (down from $799).'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'The RHCE exam is also 2.5 hours in length. Each exam performance based, meaning
    it is given in the form of labs. With the addition of the RHCSA certification,
    you are now required to obtain the RHCSA before you can become RHCE certified.
    You can still take the RHCE exam; however, you will not receive the certification
    until you have completed and passed both exams.


    # LPIC, RHCE, and Other Things You Should Know


    The Red Hat exams are a big undertaking, particularly if you have never taken
    a performance-based exam before. There is the unknown element of what to expect
    on the exam plus the amount of material you need to be familiar with. Before sitting
    for either of the Red Hat exams, you might want to consider completing the LPIC-1
    exam series. Why? The Red Hat test experience and skill, not just your ability
    to memorize content within a book. There is also a certain skill set that you
    need before you take the Red Hat exams. You are expected to know basic Linux commands,
    to be able to navigate a system, and to be able to perform basic file operations.
    Being effective using some form of text editor is a good thing, though.


    The LPIC-1 certification is broken down into two exams: LPIC 101 and LPIC 102.
    The material covered in both of these is equivalent to the knowledge a junior
    system administrator should have, and it gives you a solid foundation for taking
    on the Red Hat exam material. Although many topics overlap between the LPIC-1
    material and the Red Hat exams, this will only help to reinforce your understanding
    of particular topics. You should look through each objectives of the LPIC-1 exams
    to gain a better understanding of some of the prerequisite skills required. The
    objectives for the LPIC-1 exams are very detailed, so they will help you identify
    any weak areas you might have:


    +   - LPIC-101

    ://www.lpi.org/certification/the_lpic_program/lpic_1/exam_101_detailed_objects


    +   - LPIC-102

    ://www.lpi.org/certification/the_lpic_program/lpic_1/exam_102_detailed_objects


    If you already have a solid set of Linux skills, you have no problem starting
    out here. If you don''t, you can still proceed with this book but will need to
    put in some extra effort areas to fully understand. One question I frequently
    see is, “Should I take the LPIC exams if I''m an RHCSA/RHCE?” My answer is always
    yes! The reason behind this is that the Red Hat exams are vendor specific, whereas
    the LPIC-I exams are vendor neutral. They focus on implementing services'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'working with Linux from an unbiased perspective. Holding both certifications
    adds diversity to your resume, and the exams shouldn''t be hard to pass with the
    amount of overlap in the material between the Red Hat exams and the LPIC-1 exams.


    You should know the following topics (prerequisites) before you start studying
    for the Red Hat exams. This is by no means a complete list!


    +   - How to use a text editor (vim, emacs, or nano)

    - File system hierarchy structure

    - Different types of media (/dev/sda versus /dev/hda)

    - File operations:


    | pwd find w |

    | path cat locate who |

    | ls more cp |

    | echo less mv |

    | cd tail ln |

    | sort head wc |


    +   - How to search with grep

    - Command piping

    - The basics of sed and awk

    - Compression:


    +   - tar

    - gunzip

    - bzip2


    +   - Networking basics:

    - ping

    - netstat

    - ifconfig


    +   - IP addresses, subnets, and gateways

    - How to use a command line and a GUI-based email client


    If you lack the experience, the introduction to this book covers a majority of
    prerequisite commands. Although it shouldn''t count as a replacement for learning
    all these commands individually, the introduction can get you up to speed quickly
    if you have little to no current Linux experience.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Self-Study and Experience


    One of the biggest debates I see among those studying for the Red Hats exams is,
    “Should I self-study or take a course?” I am a self-study person and have yet
    to find half decent course for a price that wouldn''t give you a heart attack.
    The problem that most people seem to encounter with taking a course is the cost.
    Simply put, they are not cheap! The average price for a Red Hat training course
    is around $300, and a course typically consists of four to five days of classroom
    training (which means footing the bill and taking time off).


    > NOTE Red Hat offers an eLearning (or online version) of its training course
    about half the price. I highly recommend that you DO NOT take this class because
    the learning experience is very different from that given in the classroom.


    The benefits of taking a course, however, are that it is tailored specifically
    for the exams and the instructors can help you with questions. With the self-study
    option, you have to balance what important topics are (more likely to be tested
    on) versus less important topics (not likely to appear on the exam). This is really
    a strong point of the LPIC-1 exams: They list a “weight” for each topic, so you
    know how heavily it will count on each. If you spend the time researching the
    experience others have had on the Red Hat exams and read through the Red Exam
    Prep Guide, you will start to get a feel for what topics are more likely to appear
    on the exam.


    Experience plays another big factor in the Red Hat exams. After much research
    and talking to those who have taken the exams, I believe the amount of experience
    presented in Table P-1 would be required for each exam.


    | Table P-1 Experience Recommended for the Red Hat Exams |

    | Exam | Years of Experience |

    | LPIC-101/102 | 0–1 year |

    | LPIC-201/202 | 2 years |

    | RHCSA | 2 years |

    | RHCE | 3 years |


    Although these are only my recommendations, you will probably find, with a little
    research on the Web, they are pretty accurate. As you probably know too, everyone
    is different and learns at different rates. The biggest difference between the
    two exams is that the Red Hats are all hands-on (performance based), whereas'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'LPIC-1 exams are multiple choice. Unless you truly know what you are doing
    and have experience in the technologies listed in the Red Hat Exam Prep Guide,
    you will not pass the Red Hat exams. Don''t worry though, because a little experience
    (either at home or on the job) and some lab work will fix that. I hope that you
    will have both, which makes the learning process slightly easier and more rewarding.


    # Materials from Red Hat


    No exam would be complete without a listing of what you should know. In Red Hat''s
    case, the company has created a prep guide that lists the topics you need to know
    for the exams. With the release of Red Hat Enterprise Linux 6 and the addition
    of the RHCSA, the exam prep guide has become more specific about what you are
    required to know for the Red Hat exams. This book covers every topic you need
    to know for each exam. Before you begin studying, review the prep guide for each
    exam. If you don''t have one printed out or saved, you can get it here:


    +   - Red Hat RHCSA Prep Guide

    https://www.redhat.com/certification/rhcsa/objectives/


    +   - Red Hat RHCE Exam Prep Guide

    https://www.redhat.com/certification/rhce/objectives/


    I have also included a copy of each in the next two sections of this preface.
    If you have taken an earlier version of the RHCE, you may notice that the required
    objectives have become more specific about what you need to know. This is good
    because they leave you with less guessing to do. One of the great benefits of
    the Red Hat exams is that they not list any specific technology that you must
    know. For example, if the exam requires you to block access to a particular service,
    you can choose to use TCP Wrappers, iptables, or the security of the service itself.
    This approach is good because, in the real world, there is always more than one
    way to doing something. Another example might be the exams which require you to
    set up outgoing mail using SMTP. You could use the Sendmail service or Postfix.
    As long as the system is allowed to send out mail, the exams don''t care how you
    accomplish how to use it. The only exception, of course, is unless the exams specifically
    ask you to use a particular service. These requirements will be useful as you
    study and practice for the exams in case you already have experience with a particular
    service.


    # EXAM TIP


    It is worth noting although you have some freedom on the exam to implement different
    technologies, Red Hat may ask you to do something in a particular way. Going back
    to the example of blocking something on the system, you may use any method you
    like, unless Red Hat says that you need to specifically use iptables.'
  merge: -1
  pgno: 20
- img_proc: true
