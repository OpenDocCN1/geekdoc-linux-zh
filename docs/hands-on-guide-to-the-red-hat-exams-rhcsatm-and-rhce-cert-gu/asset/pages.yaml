    Finally, you just need to edit the /etc/nsswitch.conf file and specify that you
    want your users and groups to be authenticated against the NIS domain, and if
    that’s not available, then locally. Open the file for editing:


    ```

    # nano /etc/nsswitch.conf

    ```


    Edit the following lines to look like this:


    ```

    passwd:                nis files

    ```'
