    # Centralized Logging


    If you''d like to set up a centralized syslog server, you need to choose which
    server you''d like to store all your logs on. For this example, you can use the
    RHEL01 systems as the centralized server and configure it to receive logs from
    the other systems on the network.


    **Step 1.** Look at a section of the /etc/syslog.conf file again:


    ```

    #### MODULES


    $Mod imuxsock.so # provides support for local system logging (e.g. via logger
    command)

    $Mod imklog.so # provides kernel logging support (pre-ously by rklogd)

    $Mod immark.so # provides --MARK-- message capability


    # Provides UDP syslog reception

    $Mod imdup.so

    $UDPServerRun 514


    # Provides TCP syslog reception

    $Mod imtcp.so

    $InputTCPServerRun 514

    ```


    In the modules section, you can see two areas that provide the ability to receive
    logs from other systems. The standard is to use the UDP protocol on port 514.
    By uncommenting the section related to UDP reception, you can essentially provide
    a way for the syslog server to become the centralized server for the network.


    **Step 2.** Uncomment the following two lines:


    ```

    $Mod imdup.so

    $UDPServerRun 514

    ```'
