    # Caching-Only Server


    The setup of a caching-only server is a little different from what you have done
    already. The first thing we mentioned before starting any configuration is that
    you back up the /etc/named.conf file (RHEL6 only) This original /etc/named.conf
    file is actually a sample named.conf file for name caching-only servers! On RHEL1
    again, make a backup of any current named-conf file:


    ```

    # cp /etc/named.conf /etc/named.conf

    Restore the original named.conf file:

    # mv /etc/named.conf.orig /etc/named.conf

    ```


    > TIP: If you are on RHEL5, you need to install an additional package to get the
    caching-only nameserver config files.

    **Step 1.** Install the required package:

    # yum install -y caching-nameserver

    **Step 2.** As with all installs, verify:

    # rpm -qa | grep caching

    caching-nameserver-9.3.6-4.P1.el5_4.2

    **Step 3.** Copy the sample file:

    # cp /etc/named.conf-caching-nameserver.conf /etc/named.conf


    Using the following as your caching-only nameserver /etc/named.conf config file:


    ```

    * General options for our caching-only name server */

    {

    listen-on port 53 { 127.0.0.1 };

    listen-on-v6 port 53 { ::1 };

    directory "/var/named";

    dump-file "/var/named/data/cache_dump.db";

    statistics-file "/var/named/data/named_stats.txt";

    statistics-file "/var/named/data/named_mem_stats.txt";

    allow-query { localhost };

    recursion yes;

    };

    ```'
