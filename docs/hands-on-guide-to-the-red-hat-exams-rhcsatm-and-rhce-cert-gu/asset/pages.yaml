  md: 'subnet 172.168.1.0 netmask 255.255.255.0 {


    ```

    # Parameters for the local subnet

    option routers 172.168.1.1;

    option subnet-name 255.255.255.0;


    option domain-name "example.com";

    option domain-name-servers 172.168.1.1;


    default-lease-time 21600;

    max-lease-time 43200;

    ```


    ```

    # Client IP range

    range dynamic-boot 172.168.1.100 172.168.1.200;

    ```


    }


    Let''s break down this file into sections. The first section contains two options
    for the DHCP server itself, also called global options:


    +   - ddns-update-style: This means that the DHCP server won''t update client
    records.


    +   - authoritative: This informs the client that the DHCP server contains legitimate
    information.


    # REAL-WORLD TIP


    > If the server doesn''t contain an authoritative option and the client switches
    subnets, it is not able to obtain a new IP address until its old lease has fully
    expired. There are also security benefits of sending a DHCPNAK to incorrectly
    configured clients.


    The next section defines a subnet. Any options that you list in a subnet are specific
    to the subnet you define them. If you want to set global options (such as authoritative),
    you need to define them outside the subnet section. In this section, the following
    options are used:


    +   - option routers: Defines the default gateway to the subnet

    - option subnet-mask: Defines the subnet mask for the subnet

    - option domain-name: Defines the name of the domain

    - option domain-name-servers: Defines the DNS server for the subnet'
