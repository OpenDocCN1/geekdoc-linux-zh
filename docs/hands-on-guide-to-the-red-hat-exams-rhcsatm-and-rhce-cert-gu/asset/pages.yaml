    Because you can see that it is installed, you should also check on other issues.


    **Step 2.** First, make sure the service is set to start when the system boots:


    ```

    # chconfig rsyslog --list

    rsyslog 0:off 1:on 2:on 3:on 4:on 5:on

    6:off

    ```


    **Step 3.** Second, make sure the service is currently running:


    ```

    # service syslog status

    syslogd (pid 1279) is running...

    ```


    For RHEL05:


    **Step 1.** Verify the installation of the package:


    ```

