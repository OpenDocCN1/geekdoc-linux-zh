  md: '# Step 7. Now you should be able to unmount the file system:


    ```

    # ummount /opt/backup

    ```


    > **WARNING:** By killing all the open connections, you are essentially terminating
    anything users have open. If they are working on something that has not been saved
    (as a Word or PowerPoint document), all the changes are lost. It''s good practice
    to send out to your users to alert them when file system maintenance will occur;
    that, they are responsible for saving and closing all their documents beforehand.


    Now you know how to mount and unmount file systems, there is something else you
    need to look at. If you reboot your system right now, the file systems that you
    just mounted will no longer be available when the system comes back up. Why? The
    mount command is not persistent, so anything that is mounted with it will no longer
    be available across system reboots. I suppose you want to know how to fix that,
    right? The system looks at two config files. One deals with the mounting of file
    systems during the boot process, and the other keep track of currently mounted
    systems:


    +   - /etc/mtstab Contains a list of all currently mounted file systems

    - /etc/fstab All listed file systems with options at boot time


    Let''s look at the /etc/mtstab file. Every time you mount or unmount a file system,
    this file is updated to reflect what is currently on the system.


    # Step 1. View the /etc/mtstab file:


    ```

    # cat /etc/mtstab

    /dev/mapper/vg_root-lv_01_lv_root ext4 rw 0 0

    /proc /proc rw 0 0

    sysfs /sys/sysfs rw 0 0

    devpts /dev/pts devpts rw,gid=62 0 0

    tmpfs /dev/shm tmpfs rw,rootcontext=system_u:object_r:tmpfs:s0: 0 0

    /dev/hdc1/boot ext4 rw 0 0

    none /proc/sys/fs/binfmt_misc binfmt_misc rw 0 0

    sunrpc /var/lib/nfs/rpc_pipefs rpc_pipefs rw 0 0

    /dev/hdc1/opt/company_data ext4 rw 0 0

    /dev/hdc1 /opt/backup ext3 rw 0 0

    ```


    # Step 2. You can also query to check whether a particular file system is mounted
    with the grep command:


    ```

    # cat /etc/mtstab | grep backup

    /dev/hdc1 /opt/backup ext3 rw 0 0

