  md: '# DNS


    When you''re trying to access a website, you type in the name you are looking
    for and it comes up. In the background, though, Domain Name Service (DNS) is what
    translates website name into an IP address so that the site may be accessed. This
    translation also occurs when you are connecting to other systems on your network
    through their hostnames instead of their IP addresses. DNS plays a critical role
    not only in your networks, but also on the Internet as a whole. Knowing how to
    set up, maintain, and troubleshoot such a server is vital to any network. The
    root DNS servers for the world run BIND as their DNS software choice, so naturally
    Red Hat includes it on the exams. This chapter covers BIND in great detail because
    it is a critical network component.


    # Setting Up BIND


    Just as with any service, you need to install the packages for BIND first.


    +   Step 1. Install the required packages:

    # yum install -y bind-utils bind-libs


    +   Step 2. Verify that the packages have been installed:

    # rpm -qa | grep bind

    bind-utils-9.7.0-52.el16.x86_64

    bind-9.7.0-52.el16.x86_64

    bind-libs-9.7.0-52.el16.x86_64


    +   Step 3. Ensure that the service is set to start on system boot:

    # chkconfig on


    +   Step 4. Verify that the service is set to start on boot:

    # chkconfig --list named

    named 0:off 1:off 2:on 3:on 4:on 5:on 6:off'
