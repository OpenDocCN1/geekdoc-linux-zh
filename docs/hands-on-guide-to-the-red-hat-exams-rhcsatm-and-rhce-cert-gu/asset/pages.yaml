    **WARNING:** The iptables command does have a GUI version, which generating rules
    and putting them in a snap. I want to warn you, however, using the GUI version
    overwrites any custom rules that you have in the iptables file. For example, if
    you write out a few rules using a shell and then make one addition via the GUI,
    only the GUI rule shows up when you open the iptables file. Again, I caution you
    away using the GUI tool unless you are going to make all rules in one shot using
    this tool.'
