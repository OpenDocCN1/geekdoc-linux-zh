  md: '# Chapter 4: File Systems and Such 135


    Let''s briefly discuss the two different limits you can have when dealing with
    quotas:


    +   - Soft Limit—Has a grace period that acts as an alarm, signaling when you
    are reaching your limit. If your grace period expires, you are required to delete
    files until you are again under your limit. If you don''t specify a grace period,
    the soft limit is the maximum number of files you can have.


    +   - Hard Limit—Required only when a grace period exists for soft limits. If
    the hard limit does exist, it is the maximum limit that you can hit before your
    grace period expires on the soft limit.


    With these two limits in mind, you can begin creating limits for your users. First,
    you should create a quota for user01. The edquota command to set it up. Because
    users don''t access to this file system yet, they aren''t taking up any space.
    To work with quotas and groups, you need do some conversions in your head. Each
    block is equal to 1KB. If you''re not good at the conversions, remember that 1000KB=1MB.
    So if you are taking up 40KB of space. If you also want to restrict the number
    of files that user01 can create, you can set a soft and hard limit on the inodes
    side. For purposes of this example, let''s create a limit only on space for user01
    at 20MB. Also, let''s set a hard limit command. Set the limits for user01 by the
    edquota command.


    > NOTE: Although the users we describe in this section (user01, user02, and user03)
    may not yet exist on your system, you will create them later.


    Syntax: edquota [-u -g] [username | groupname]


    Step 2. Change the line for the /dev/hdb1 file system to look like the following:


    ```

    # edquota -u user01 (uid 500):

    Filesystem blocks soft hard inodes soft hard

    /dev/hdb1 0 20000 25000 0 0

    ```


    Step 3. Save your changes and close the file.


    EXAM TIP By default, the edquota command uses the vi editor. If you''re not familiar
    with it, you need to press i to enter insert mode. In insert mode, you can edit
    the text of'
