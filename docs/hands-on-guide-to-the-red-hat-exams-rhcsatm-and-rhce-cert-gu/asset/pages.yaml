    # Enabling Quotas


    Normally, you would have to call the quotaon and quotaoff to have the quota system
    enforced, but they are automatically called when the system boots up and shuts
    down. Also, the quotaon command can''t be called until the quota files are created
    in the root directory of the quota file system.


    +   Step 1. Run the command manually the first time to make sure that quotas are
    turned on:


