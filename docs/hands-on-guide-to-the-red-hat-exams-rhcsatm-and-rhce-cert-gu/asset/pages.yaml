    Migrating Data


    Suppose you have a drive that is old and dying and you''d like to remove it from

    system. On a system with normal partitions, you would have to copy all the data

    one disk to another while the disk is offline (because of file locks). Having

    LVM makes this easier because you can migrate your data from one disk to an-\other,
    even while the disk is online! This capability is very useful when you need to

    replace a disk. If you want to replace /dev/hdb because it''s failing, you can
    use the

