  md: '# Network Installs


    Installing Red Hat Enterprise Linux is an important topic, even though it is no
    longer included on the Red Hat exams. Network installations are still included,
    however, knowing which method to use when can help you by saving time on installations.
    Using kickstart is also key in deploying RHEL in the real world because it is
    a heavily used technology. This chapter covers kickstart installations in depth
    and wraps up by looking at other types of network installation methods.


    # Kickstart Server Setup


    The most used network installation setup for Red Hat is done through a kickstart
    server. It enables you to perform network installations with flexible options
    such as pre- and post-package customization, custom scripts, logging, and more.
    It also has the benefit of being fully automated. This section covers the basics
    for setting up a kickstart server and performing a simple network install.


    Kickstart enables you to install Red Hat over the network via the HTTP, FTP, or
    NFS protocols. I chose to use the HTTP protocol here because it was the quickest
    to set up and slightly easier than the other two protocols. An HTTP kickstart
    server also has fewer configuration steps, for those attempting this for the first
    time.


    +   Step 1. To start, you need to install the Apache web server:


    ```

    # yum install -y httpd

    ```


    +   Step 2. Verify the package was installed:


    ```

    # rpm -qa | grep httpd

    httpd-2.2.15-5.el16.x86_64

    httpd-tools-2.2.15-5.el16.x86_64

    ```


    Because this chapter isn''t about the Apache web server, I don''t want to go into
    specifics here, except to say that I''m pretty much using all the defaults provided
    with Apache.'
  merge: -1
  pgno: 253
- img_proc: true
