    Step 2. Disable the SELinux protection:


    # setseboolean -P squid_disable_trans=1

    Step 3. Verify that the Boolean has changed:


    # getboolean -a | grep squid_dis

    squid_disable_trans -> on


    As you can see, the firewall rules and SELinux requirements are really light for
    Squid. Before starting the service, though, we need to cover Squid security a
    bit more in depth.


    # Web Proxy Security


    Squid uses host-based security through the use of access control lists. These
    ACLs are configured in the main config file, /etc/squid/squid.conf. In the config
    file, you can define an ACL for your network and give all other networks access
    to the proxy server.'
