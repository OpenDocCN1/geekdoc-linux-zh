  md: '# Dynamic Host Configuration Protocol


    One of the basics elements found on all networks is a Dynamic Host Configuration
    Protocol (DHCP) server, making it an important part of any network. DHCP makes
    network administration easy because you can make changes to a single point (the
    DHCP server) on your network and let those changes filter down to the network.
    Although DHCP is not explicitly covered in the Red Hat Exam Prep Guide, it is
    an integral part of any network and a core functionality that every network contains.


    Before you begin the installation or setup of a static IP address, you need to
    verify that the server is configured with a static IP address. To verify this,
    you can look at the interface config cat:


    ```

    # /etc/sysconfig/network-scripts/ifcfg-eth1

    DEVICE="eth1"

    NM_CONTROLLED="yes"

    ONBOOT=yes

    ADDR=00:0C:29:8E:F1:FD

    TYPE=Ethernet

    BOOTPROTO=static

    DEROUTE=yes

    PEERNS=yes

    PEEROUTS=yes

    IPV4_FAILURE_FATAL=yes

    IPV6INIT=no

    NAME="System eth1"

    UUID=5fb66bd0-0b60-7ffb-a5f1-d6edd665f3e3

    ```


    If your network adapter is not set with a static IP address, check Chapter 5,
    “Networking,” to see how to configure it. Your server should have a static IP
    address, however if you have been following along in all the labs. With your static
    IP in hand, you can begin the installation of the DHCP server.


    # Installing a DHCP Server


    Strangely, the DHCP server package is called dhcp, while the service is called
    dhcpd.


    +   Step 1. Start by installing the dhcp package:

    # yum install -y dhcp

    Step 2. Verify that the package is installed correctly:

    # rpm -qa | grep dhcp

    dhcp-4.1.1-12.P1.e16.x86_64'
