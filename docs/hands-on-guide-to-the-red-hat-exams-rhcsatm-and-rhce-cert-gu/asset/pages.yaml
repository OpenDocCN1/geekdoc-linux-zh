  md: "# Troubleshooting\n\nThis chapter is all about troubleshooting the system.\
    \ Although there is no wrong or right way to go about accomplishing this, there\
    \ are some common issues to look at here. This chapter covers a variety of issues\
    \ that could arise while you're working or configuring services. This chapter\
    \ is also written in a slightly different format, using a problem-and-answer style.\
    \ Let's get started.\n\n# Boot Issues\n\nMany issues can arise when you are working\
    \ with the boot process of the system. Here are some of the common issues you\
    \ might run into the exam or in the real world.\n\nI Lost My Root User Password\n\
    If you forget your root user password or you are taking over a system where the\
    \ root password isn't documented, you can still get into the system. You need\
    \ to perform the following actions at the physical console of the system.\n\n\
    +   **Step 1.** Boot into single-user mode by appending the command line during\
    \ boot with the following:\nsingle\n\n+   **Step 2.** When you are presented with\
    \ a command prompt, change the root user password:\n```\n# passwd root\nChanging\
    \ password for user root.\n password:\nRetype new password:\\passwd: all authentication\
    \ tokens updated successfully.\n```\n\n+   **Step 3.** Reboot the system and validate\
    \ that the new root password works correctly:\n```\n# reboot\n```"
