  md: '480 Hands-on Guide to the Red Hat® Exams: RHCSA™ and RHCE® Cert Guide and Lab
    Manual


    detach-device Detaches a device from a guest


    detach-disk Detaches a disk from a guest


    detach-interface Detaches a network interface from a guest


    Just as when you''re managing virtual guests, you need to connect to a hypervisor
    before you can begin using these commands. Within each virtual guest, you have
    available the same utilities discussed in Chapter 9; however, these additional
    options for virsh give you an external view of what is going on the physical and
    host guest system. When monitoring system resources, you also have the option
    of using the virt-manager utility. This utility has all the options, but it allows
    you to see them in a graphical form. It is important to create a baseline with
    your virtual guests when you create them for the first time. This allows you to
    monitor resources and determine if there is a problem by comparing the current
    utilization to the baseline of the system. This is an important skill to have,
    especially when you''re trying to determine whether your current hardware is enough
    to support your virtual guest systems.


    # Summary


    In this chapter, we discussed how to use KVM on RHEL6 to create and manage virtual
    guests. We also discussed how to monitor these virtual guests after they have
    been created. Although there is a separate Red Hat certification based on virtualization,
    system administrators need to understand the basics of creating and managing virtual
    machines, particularly in today''s world where virtualization is everywhere. If
    you have an interest in virtualization using Red Hat technologies, I suggest you
    look at the RHCVA certification and training courses.


    # Review Questions


    +   1. The virt-install package allows you to manage virtual machines via a GUI
    interface. True or False?


    +   2. By default, all virtual machines are created with the same amount of RAM.
    True or False?


    +   3. What is the virsh command used for?


    +   4. What does virsh reboot Client@4 do?


    +   5. How can you display all virtual guests after they''re connected to a hypervisor?'
  merge: -1
  pgno: 512
- img_proc: true
  md: '# Answers to the Review Questions


    +   1. False. The virt-install package allows you to manage virtual machines via
    the command line. The virt-manager package allows you to manage virtual machines
    via a GUI interface.


    +   2. False. You must dictate the amount of RAM you want allocated to your virtual
    machine when you create it.


    +   3. The virsh command is used to manage virtual guests.


    +   4. This command reboots virtual guest Client04.


    +   5. After you connect to a hypervisor, you can use virsh —all to list all virtual
    guests.


    # Lab 22


    # Task 1 – KVM


    +   Step 1. Open the GRUB config file in any text editor.


    +   Step 2. Add a new entry to the config file:

    na. The new entry should have the title Red Hat Recovery.

    nb. The new entry should not be the default.

    nc. The recovery entry should allow you to boot into recovery mode.


    +   Step 3. Change the timeout of the boot selection to 10 seconds.


    The task is complete when the system boots with both entries in the GRUB menu
    and they work correctly.


    # Task 2 – Boot Issues


    +   Step 1. Make sure you have your Red Hat installation CD available. Delete
    the /etc/inittab file, and reboot the system.


    You will receive an error message that the system can''t find the CD.


    +   Step 2. Boot from the Red Hat installation into recovery mode.


    +   Step 3. Replace the file from the CD into the correct location on the system.


    +   Step 4. You may need to use the command mount /dev/cd-rom /mnt to access the
    CD drive.


    The task is complete when the system boots up again.'
