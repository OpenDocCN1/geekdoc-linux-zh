    To start working with cron, you first need to look at the two config files that
    control access to the cron service. These two files are:

    /etc/cron.allow

    /etc/cron.deny


    The /etc/cron.allow file:


    +   - If it exists, only these users are allowed (cron.deny is ignored).

    - If it doesn''t exist, all users except cron.deny are permitted.


    The /etc/cron.deny file:


    +   - If it exists and is empty, all users are allowed (Red Hat Default).

    For both files:

    - If neither file exists, root only.


    > EXAM TIP

    The rules surrounding these two files can be kind of confusing at first, so you
    might want to create some sample jobs to get a better understanding of how changing
    these two files affects the permissions of the cron service.'
