    +   Step 2. When it''s installed, you can test your site with the following:


    ```

    # elinks 172.168.1.1

    ```


    After running the command, you should see the screen shown in Figure 14-1.


    ![](img/6f327e3a1ee7ed861fc5243dfa758aa6_365_0.png)


    **Figure 14-1** Test page for the Apache HTTP server.


    +   Step 3. If you don''t specify between HTTP and HTTPS, normal HTTP is assumed.
    If you want to test for a secure site, you can use the following:


    ```

    # elinks https://172.168.1.1

    ```


    +   Step 4. To quit the browser, just press q.'
