  md: '# CHAPTER 4


    # File Systems and Such


    In the preceding chapter, we spent a lot of time working with partitions and setting
    the layout of the different disks for the system. Now to be able to use these
    disks, we need to create a file system for each one, mount it somewhere in the
    file hierarchy, and set it so that it will always be available when the system
    boots up. This chapter also describes file permissions, access control lists (ACLs),
    and quotas. All these tools together help you manage your system and storage more
    efficiently.


    # File System Setup


    In the preceding chapter, we set up different types of partitions for the system.
    The partitions are essentially the disk space carved out for you to use. Before
    the partitions can be used, however, you need to create a file system for each
    one. The default file system for RHEL5 is ext3 and has been changed to ext4 for
    RHEL6. Both of these file systems offer a journaling option, which has two main
    advantages. First, it can help speed recovery if there is a disk failure because
    journaling file systems keep a "journal" of the file system''s metadata. Second,
    it check drives faster after the system boot process. The journaling feature isn''t
    available on older file systems such as ext2. The creation of ext3 and ext4 is
    exactly the same, so moving between the two shouldn''t be a big deal. Because
    we made a mess with partitions in the preceding chapter, we need a new partition
    layout on which to create file systems. Create the partitions in Table 4-1 if
    they don''t already exist.


    Table 4-1 Partitions Needed


    | Partition | Size | Comment |

    | /dev/hdb1 | 8GB | Normal partition |

    | /dev/hdc1 | 4GB | Normal partition |

    | /dev/hdc2 | 4GB | Swap partition |

    | /dev/hdd* | 5GB | Logical volume using LVM |

    | /dev/hdd1 | 8GB | Normal partition |'
  merge: -1
