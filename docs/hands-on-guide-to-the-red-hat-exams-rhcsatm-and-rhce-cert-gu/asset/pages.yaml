  md: 'NOTE: For some reason, the first time you start the NFS services, they don''t
    always produce an output showing that they started successfully. If you want to
    verify that they have started successfully, you can restart the service to view
    the correct output on the console screen.


    If you already started the services before creating an /etc/exports file, you
    can also use the exportfs command to manually export any new resources added to
    the /etc/exports file.


    Syntax: exportfs [options]


    Options:


    +   - a Exports or unexports all directories

    - r Reexports all directories

    - u Unexports one or more directories

    - v Provides verbose output


    Step 1. Here is what a manual export of resources would look like:


    ```

    # exportfs -avr

