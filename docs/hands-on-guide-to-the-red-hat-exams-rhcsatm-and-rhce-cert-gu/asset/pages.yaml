    # Regex


    From time to time, you need to hunt down something specific on your system, whether
    it is a file itself, something within a file, or through a script. In Linux, you
    can use regular expressions (also known as regex) that enable you to find specific
    information. Regex uses special expressions in combination with any of the following:


    +   - Literal Any character used in a search or matching expression

    - Metacharacter One or more special characters with special meaning

    - Escape sequence Use of metacharacters as a literal


    Regex is one of those topics that you pick up or it causes tones of frustration
    and headaches. Just like anything else, the more you practice and look at examples,
    the more you should begin to pick up how it works and how to use it more efficiently.


    In this section, we look at only a single command grep, which can be used with
    regex. To start, let''s look at the options that can be used with it.


    ```

    Syntax: grep [options] PATTERN [file]

    ```


    Options:


    +   - -W Forces PATTERN to match whole words only

    - -X Forces PATTERN to match lines only

    - -E Makes PATTERN an extended regular expression

    - -f Obtains PATTERN from a file

    - -v Inverts the match (prints nonmatching lines)

    - -m [NUM] Stops after NUM matches

    - -R Acts recursively when searching through directories

    - --color=[WHEN] Displays output in color; WHEN is always, auto, or never'
