  md: '# 180 MkLinux: Microkernel Linux for the Power Macintosh


    playback method, but it is very handy if you are trying to make copies or edited
    collages of audio CDs for personal use, etc. (Just be sure to comply with any
    relevant copyright laws).


    To use the CD-ROM drive, press firmly on the eject button, located below the right-hand
    end of the drive. This will send a signal to the operating system software, requesting
    that the drive be opened for access. The system will then request the drive to
    open, allowing you to insert a CD-ROM disc.


    Center the disc in the CD-ROM drive''s access tray, with the printed side Be sure
    the disc is sitting down in the well of the tray; a mis-aligned disc could be
    damaged when the tray retracts.


    Now, press firmly on the eject button, requesting the system to retract the drive.
    The drive will also interpret a slight inward pressure as a request to retract
    the tray; be careful, however, not to push too hard, lest you damage the drive
    mechanism.


    # Ejecting a CD-ROM


    Although the built-in CD-ROM drive has an eject button, it is mostly used to open
    an empty drive for insertion of a disc. If the drive does not respond to the button,
    there are two likely problems:


    +   * The operating system is not responding to the eject button.


    +   * The drive is not responding to the operating system.


    If you are doing all the right things and the drive still won''t eject, the system
    might simply be confused. A system reboot is a drastic, but often effective, way
    to clean up this sort of problem.'
