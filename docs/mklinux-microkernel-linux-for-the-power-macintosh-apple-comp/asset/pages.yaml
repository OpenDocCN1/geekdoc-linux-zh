    In a simple connection, the hardware configuration is such that only one-way communication
    is possible (for example, from a computer to a printer that cannot send status
    signals back to the computer). In a half-duplex connection, two-way transfer of
    data is possible, but only in one direction at a time. That is, the parties to
    the connection take turns transmitting and receiving data. In a full-duplex connection,
    both parties can transmit and receive data simultaneously. Most modern communication
    links are based on full-duplex connections.


    **Flow Control Methods.** Because a sender and receiver can''t always process
    data at the same rate, method of negotiating to start and stop transmission is
    required. Most serial drivers support two methods of controlling data flow. One
    method relies on the serial port hardware, the other is implemented in software.


