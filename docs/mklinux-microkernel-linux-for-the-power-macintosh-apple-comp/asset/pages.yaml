- img_proc: true
  md: '# Preface


    There are some differences, to be sure. For instance, MkLinux is remarkably free
    of BIOS incompatibilities, conflicting DMA vectors and IRQs, and the host of jumper
    settings that seems to be required for Intel-based machines to operate. But then,
    you''ll all get used to these differences in time (–).


    # Mac OS And MkLinux


    Although Mac OS and MkLinux both run on Power Macintosh hardware, they have very
    different historical backgrounds, goals, and (in general) user communities. In
    fact, they are an interesting study in contrasts:


    +   Access to source code

    Mac OS source code is highly proprietary and very carefully protected. Even Apple
    engineers do not have freely access to system code.


    MkLinux source code is free software. The source code can be examined, modified,
    and even incorporated into other software, as long as certain minimal restrictions
    are met.


    +   Administration

    Mac OS typically requires little or no system administration, save for the occasional
    backup. Network servers require some administration.


    Small (e.g., single-user) MkLinux systems require little administration. Larger
    systems tend to require more administrative effort, depending on the number of
    users and services supported.


    +   Application software

    Mac OS does not include very many bundled applications. Macintosh Performa systems
    remedy this, including a large amount of software. Thousands of commercial applications
    are available for Mac OS.


    The Mac OS community has developed a large amount of shareware and freely redistirable
    applications. In general, this is distributed only in binary form.


    MkLinux includes hundreds of commands, ranging from data analysis and document
    preparation tools to a complete software development environment. No commercial
    applications are available at present, but some are reported to be on the way.'
