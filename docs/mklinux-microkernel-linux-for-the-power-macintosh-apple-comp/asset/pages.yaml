  md: '# Chapter 10: MkLinux Overview


    # Status On The Intel Platform


    The two main missing pieces of functionality are virtual consoles, which seem
    necessary for X11 support, and the dynamic buffer cache support (the shrinking
    part). The performance is reasonable, although there is plenty of room for improvements.


    We will address both the functionality and performance issues as soon as possible.


    # Status On The Power Mac Platform


    At the time we write this paper, the Power Mac has just started booting Linux
    with a minimal file-system. It reaches the “login” prompt and is able to run most
    of the commands we have. We have a minimal set of drivers; we use a serial line
    as console and can access the SCSI disks. No floppy, CD-ROM, graphics, or network
    drivers are available for the moment, but work is in progress on this.


    # Linux Code Base


    The Linux is currently based on the 1.2.13 Linux kernel version. It can be seen
    as a port of the Linux kernel to new architectures: osfmach3_i386 and osfmach3_ppc.


    Because we have always taken care to minimize the changes to Linux kernel releases,
    We will provide a Linux server based on the latest 1.3 kernel (or may 1.4) as
    soon as possible, but our current priority is to complete the ports to the Power
    Mac.


    # Linux Device Drivers


    A team at Columbia University has developed a framework to include Linux device
    into Mach with virtually no changes. This work was done on Mach 4, but should
    be fairly easy to adapt to OSF MK. This would greatly improve the supported hardware
    list of the microkernel for the Intel x86 platform.


    # Development Environment


    The OSF uses its own development environment, called ODE (OSF Development Environments).
    ODE is available for free from the OSF, and is cur-'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# 168 MkLinux: Microkernel Linux for the Power Macintosh


    rntly required for building OSF MK. Although this still requires more work, OSF
    MK should compile for the x86 and Power Mac platforms from an Intel x86 system
    running Linux (server or monolithic), using a GCC compiler.


    The Linux server is built using the same method and tools as the regular Linux
    kernel.


    Being isolated from the hardware by the microkernel, the Linux server can share
    the machine with other operating system servers. In fact, it was developed as
    a regular OSF/1 process, started from a shell and debugged with a Mach-aware version
    of GDB (which can handle multi-threaded applications). There is no need to reboot
    the machine before each test and it provides full user mode debugging possibilities;
    is possible to debug the Linux server with GDB from its very first interaction.


    Although Linux does not support multi-threaded tasks (at least not in the way
    we would like it), we were able to start a Linux server from another Linux server.
    And, or more generally, one could run any desired system personalities in parallel
    on a single machine.


    The microkernel can be debugged using the powerful (although afflicted with weird
    syntax) kernel debugger on the Intel x86 platform, or using a remote GDB for the
    Power Mac.


    # Availability


    The OSF MK microkernel and the ODE development environment are protected by the
    OSF Free Copyright, allowing free usage of sources and binaries, copying and distribution
    under certain conditions, and some restrictions on commercial use. The Linux server
    is protected by the GNU General Public License.


    They are both freely available from the OSF Open Software Mall (www.osf.org/mall/).


