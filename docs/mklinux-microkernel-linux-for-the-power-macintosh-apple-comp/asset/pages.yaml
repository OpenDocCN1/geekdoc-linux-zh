  md: '198 MkLinux: Microkernel Linux for the Power Macintosh


    # Busses


    Before we begin our tour of Power Macintosh digital interfaces, we should discuss
    a few basic concepts and definitions regarding busses. Although any digital interface
    can be used to link to a single device, most of the interfaces discussed in this
    chapter can support communication with multiple devices.


    This greatly increases their utility; if an interface can handle several devices,
    fewer interfaces will be needed. In addition, busses commonly support abstract
    (as opposed to device-specific) protocols. This allows busses to support many
    types of devices at the same time.


    For our purposes, a bus is a digital interface that supports multi-way transfers
    of information. In contrast, a point-to-point interface (such as a serial line
    connecting a computer to a modem) is not a bus. This definition is very broad.
    It does not specify the number of wires, speed, or method of arbitration. It does
    not hand over, does it provide a common frame of reference.


    A bus may have one or more lines, carrying control signals and/or data. Busses
    which have only a single data line (or one in each direction) are known as serial
    busses, because the data goes serially down a single wire. ADB falls into this
    category.


    Busses which use multiple data lines are known as parallel busses, because some
    amount of data (e.g., the bits in a byte) is transmitted in parallel down a set
    of wires. The SCSI bus and all internal (system) busses fall into this category.


    In most busses, all of the lines pass from device to device until they reach the
    end. This is commonly called daisy-chaining, but see below. Ethernets that use
    co-axial cable (e.g., 10Base-2) operate in this manner.


    A central hub is used, with a set of point-to-point interfaces, to achieve the
    same result. This is often called a star configuration and is commonly seen in
    twisted-pair (e.g., 10Base-T) Ethernet systems.


    The individual lines in a bus may be shared or daisy-chained. If a line is shared,
    all devices are connected to it at all times. A daisy-chained line must, in contrast,
    be allowed past each device to reach the next device.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Chapter 14: Digital I/O


    Most lines are shared; daisy-chaining is used mostly for bus arbitration, signalling
    lines, etc.


    **Note:** The term daisy-chaining originally referred to a flower-arranging technique
    in which daisies are tied in long sequences by their stems. In the case of devices
    that are interconnected, it is commonly used to mean that a cable passes by several
    devices in sequence (e.g., SCSI or coax-based Ethernet). In the case of busses
    and device interface cards, however, it takes on the meaning that the signal must
    be gated through circuitry on each card.


    Busses that operate at speeds above one Mbps require **termination**. In an unterinated
    (or improperly terminated) line, a signal may go to the end, reflected back, and
    cause interference with succeeding data bits. Loosely speaking, termination damps
    out these reflections. SCSI and coax-based Ethernet require termination, as do
    system busses.


    **Note:** Termination is also required for LocalTalk, but the requirement to do
    so is with need to have a continuous DC bias on an RS-485 bus than with any of
    reflections.


    If all devices on the bus transmit data according to a common, shared **clock**
    signal, the bus is said to be **synchronous**. If each device controls its own
    timing, the bus is said to be **asynchronous**.


    Asynchronous busses are generally more efficient than synchronous busses. Because
    asynchronous busses are more likely to exhibit **race conditions** (unpredictable,
    timing-dependent behavior), however, they can be more difficult to design in a
    reliable manner.


