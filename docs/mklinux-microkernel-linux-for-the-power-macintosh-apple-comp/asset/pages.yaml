  md: 'sheets, high-end graphics programs, or digital imaging software, will require
    fast floating-point performance to stay competitive.


    In the future, fast floating-point performance will likely prompt the development
    of new versions of existing applications, as well as new classes of applications.
    These new applications will enable advanced telecommunications, video, and speech
    capabilities. Examples of this type of software include Apple''s PlainTalk speech-recognition
    software and Georgetown communications software, which are part of Apple AV Technologies.
    As users adopt these new applications, fast floating-point performance will become
    essential.


    The market research firm InfoCorp looked at the various factors likely to influence
    the performance of Pentium and PowerPC over the next few years. The chart below
