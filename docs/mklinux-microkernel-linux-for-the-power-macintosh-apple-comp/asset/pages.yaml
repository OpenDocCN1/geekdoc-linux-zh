  md: 'MkLinux does not currently have real-time support; future versions are expected
    to gain access to real-time features of the Mach kernel.


    +   - SecuritynMac OS has very little explicit support for security. Anyone who
    has physical access to a Mac OS system has complete authority to make any desired
    (or other :-) changes. Because Mac OS has no internal firewalls, it is quite susceptible
    to attacks by viruses, trojan horses, etc.



    On the other hand, because Mac OS does not provide support for remote logins or
    may network services, Mac OS systems are relatively safe from attack over network
    links.



    MkLinux has a comprehensive and reasonably robust security system, with internal
    firewalls, user accounts, file and directory permissions, network access controls,
    etc. For proper security, however, all of these features must be carefully administered.


    +   - StructurenMac OS is a rather monolithic system, with very little externally
    visible structure. Modifications to system behavior are made by installing Extensions
    (e.g. drivers) and by installing and/or interacting with Control Panels.



    MkLinux consists of thousands of files, any of which can be examined, modified,
    or replaced as desired. Typically, modifications to system behavior are made by
    editing textual control files.


    +   - User interfacenMac OS and its applications are strongly oriented toward
    graphical user interfaces, making heavy use of pull-down menus, dialog boxes,
    and mouse interaction.



    Mac OS is highly optimized for interactive use, but has little support for “batch
    processing”. Thus, users can perform simple tasks quickly, but may find themselves
    repeating actions for larger tasks. Most users tend to stay in single programs
    for extended periods of time.'
