    Because Mac OS is so well tuned to the interactive needs of individual users,
    it has gained a substantial and loyal following among "the rest of us", its chosen
    audience. In particular, Mac OS has become the dominant operating system in the
    fields of commercial art, graphic design, etc.


    Over roughly the same period of time, UNIX has been ported to almost every modern
    computer system. It is available for many personal computers, most scientific
    and technical workstations, and a variety of mainframes, supercomputers, and large-scale
    multiprocessor systems.


    In contrast to Mac OS, which was developed by a single company, UNIX was developed
    by companies, universities, and research laboratories around the world. In the
    process, it acquired a diverse set of data analysis and manipulation tools, along
    with subsystems for document preparation, software development, and more.


    Not surprisingly, UNIX has developed a large and dedicated following in the scientific
