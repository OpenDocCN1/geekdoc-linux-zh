    # # Upgrades And Enhancements


    Unlike many commercial operating system products (but in common with most Linux
    distributions!), MKLinux release can really be considered a “final” product. MKLinux
    is constantly changing; bug fixes and enhancements are made frequently, updates
    are posted regularly, new applications are ported and added to the application
    base. For this reason, we refer to the published MKLinux releases as snapshots.
    Like their photographic counterparts, MKLinux snapshots represent static images,
    taken of the ongoing, ever-changing, “moving target” of MKLinux development.


    Unlike physical photographs, however, MKLinux snapshots are frequently updated
    and enhanced. As mentioned above, updates are posted frequently by the MKLinux
    development team. This may include bug fixes or enhancements (new features) not
    in the latest snapshot. So, be sure to stay current with the latest MKLinux updates;
    this will help ensure that your MKLinux system is operating at optimum reliability
    and performance.


    A MKLinux snapshot distribution consists of the operating system (including the
    Mach kernel and Linux Server) and a basic set of tools and application programs.
    Each snapshot also includes installable, optional “Extras” – programs the Apple
    MKLinux team thought were interesting but not appropriate for inclusion in the
    basic installation set. These programs are shipped as RPM archives, in source
    and (often) binary form.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    RPM stands for the **RedHat Package Manager**, a tool that creates, uses, and
    manages a convenient form of archives for application packages. **Binary RPM archives**
    contain only executable applications. Source RPM archives contain source code,
    which you can examine, use, and/or modify as you (subject, of course, to any redistribution
    or other legal restrictions).


    If all this isn''t enough, MkLinux is almost infinitely customizable, assuming
    that you possess some programming capability and wish to go exploring. A wealth
    of *freware packages* is available on the Internet. Some FTP sites contain broad-spectrum
    collections, including many kinds of freely redistributable software. Other, more
    esoteric sites, may host only one or two specialized packages.


    The bad news is that it may require considerable programming skill to post some
    of these packages to MkLinux. The good news is, once you have ported them, you
    can post your results so that others may benefit from your explorations (and laud
    your achievements)! Again, be sure to pay attention to any restrictions before
    you post a package.


    # Snapshots


    As described above, a **snapshot** is a single, documented point in the MkLinux
    development process. All updates, bug fixes, and enhancements to date are sifted,
    collected into a coherent whole, packaged with an installer and various documentation
    files, tested, and distributed.


    Snapshots involve quite a bit of work for everyone involved: the MkLinux Team
    must create them and the MkLinux user community must install them, often removing
    the existing MkLinux system in the process. Consequently, snapshots occur fairly
    infrequently: historically, they have been at least three months apart.


    +   Once a snapshot is ready for distribution, it is made available in two forms:

    * **FTP** – snapshots are made available for anonymous FTP downloading at `ftp.mklinux.apple.com/pub/`
    (the official MkLinux FTP site) and various mirror sites, in the `Full_Release`
    subdirectory.


    Dartmouth''s Fetch utility, included on the FTP Reference disc, allows FTP under
    Mac OS; under MkLinux, use the `ftp` command.'
  merge: -1
