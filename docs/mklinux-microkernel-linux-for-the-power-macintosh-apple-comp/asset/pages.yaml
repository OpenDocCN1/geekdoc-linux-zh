    # Platform Components


    The basic PowerPC compatible platform consists of a hardware implementation containing
    a PowerPC processor, memory, PCI bridge, a set of mandatory I/O connectors often
    placed on the system board (e.g., non-volatile memory), a set of mandatory I/O
    devices and connectors, a set of optional I/O devices and connectors, and firmware
    which provides platform-independent services to OSs and device drivers. The platform
    layering is shown in Figure 1.


    The hardware is at the base, with a layer of software known as Run-Time Abstraction
    Services (RTAS) on top of it. The Operating System depends on RTAS to access certain
    basic platform hardware. The OS accesses this directly only if it is “platform-aware”,
    that is, has knowledge of some specific hardware component(s) of the platform
    and has specific code to handle it. The Device Drivers will use OS and RTAS services
    to access basic platform features, and will directly address added-on I/O interface
    hardware. Applications sit on top of this layer of system software, never seeing
    anything but standard programming interfaces. Platforms can be constructed in
    a wide variety of ways. See [3] for an example which shows a sample platform.
    It is common for people to confuse block diagrams with the PowerPC Platform specification.
    The actual specification is not a block diagram or specific platform design, and
    in fact does not mandate this block diagram or other. It mandates specific software-visible
    interfaces and user-features, and leaves remaining details of implementation which
    are not software-visible to the hardware/platform designers. Thus, multiple busses,
    additional I/O, multiple processors and caches, and other system features are
    accommodated. This gives the hardware designers a great deal of freedom to exploit
    better component pricing, trade off features for cost, or optimize performance
    for a particular end.


