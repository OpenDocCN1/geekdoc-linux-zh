  md: 'xxiv MkLinux: Microkernel Linux for the Power Macintosh


    Mac OS is a proprietary operating system; its source code is available only within
    Apple. UNIX source code is available for license, but the cost is insignificant.
    Consequently, neither operating system is available for casual inspection and/or
    modification by most programmers.


    For more than a decade, the GNU Project has been assembling the components of
    the GNU system, a freely redistributable clone of UNIX. In addition, a recent
    court decision has made the vast majority of the source code base for “Berkeley
    UNIX” (4.4BSD) available to any and interested parties.


    Parallel development of major components such as Mach (CMU, OSF) and the X Window
    System (MIT), along with the efforts of hundreds of spirited programmers, have
    added dramatically to this base. As a result, interested programmers are free
    to work with complete operating systems (e.g., Linux, FreeBSD, and NetBSD) and
    a large body of add-on programs (e.g., perl, gcc, http, tcp).


    MkLinux is a natural outgrowth of these developments. It is based on Linux, so
    it can take advantage of the immense amount of freely redistributable source code
    that is available for Linux (and UNIX-related) systems. At the same time, because
    of its Mach roots, it is able to expand the already substantial capabilities and
    portability of Linux. Finally, because it runs on the powerful and highly integrated
    Power Macintosh, it can bring new ease of installation and use to the Linux community.


    # ### Linux And MkLinux


    MkLinux runs on Power Macintosh hardware, using the Mach microkernel to handle
    low-level resource allocation tasks. The Linux kernel is rebuilt as a user-mode
    “single server”. How similar can such a system be to traditional Intel-based Linux?
    What problems should the aspiring MkLinux administrator, programmer, or user to
    encounter?


    Once Linux is running, it is essentially indistinguishable from Linux. It has
    all the same commands, library functions, and system calls. Source code that builds
    and runs correctly on Intel-based Linux systems generally has a few problems building
    and running on MkLinux. The most common problems–byte ordering and signed-character
    dependencies are typically trivial to resolve.'
  merge: -1
