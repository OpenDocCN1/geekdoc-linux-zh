    # Power Macintosh Product Families


    Apple recognizes several families of Power Macintosh systems, defined largely
    in terms of their packaging and manner of use:


    +   * **The Power Macintosh** system is typically found in an institutional (e.g.,
    office and/or academic) environment. It consists of a processor chassis with several
    bus (e.g., NuBus or PCI slots), a keyboard, and a mouse. Some Power Mac systems
    have built-in monitors. Anything else, extra disk drives or application software,
    is optional.


    +   * Each WorkGroup Server configuration is based on a Power Macintosh system.
    It may include a tape drive, different complements of disk and/or RAM. It may
    also include some network-specific software.


    +   * **The Network Server** is not really a Macintosh, in the usual sense. It
    is a highly redundant system designed for high availability and ease of maintenance.
    It is normally used with **AIX** (IBM''s version of UNIX) and a small amount of
    network-specific software.


    +   * **The Performa** is packaged (and sometimes specially engineered) to be
    an end-user system. It is bundled with a large amount of application'
