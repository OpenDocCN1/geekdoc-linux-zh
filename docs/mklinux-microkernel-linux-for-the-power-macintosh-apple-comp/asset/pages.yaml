    # Introduction


    In 1989, OSF chose the Mach 2.5 kernel [Ace86a] to be the basis of the OSF/1 operating
    system. Mach is a modern, message passing, operating system microkernel. It is
    a scalable kernel intended for multiprocessing systems ranging from desktop workstations
    to supercomputers. As a microkernel, Mach provides a subset of the functionality
    found in the typical operating system. File systems, network protocol services
    such as sockets, administration tools such as quota services, and security policies
    are not provided. Instead, Mach strives to provide a core collection of powerful
    OS-neutral abstractions upon which can be built operating system servers. These
    abstractions (tasks, threads, memory objects, messages and ports), provide mechanisms
    to manage and manipulate virtual memory (VM), scheduling, and inter-process communication
    (IPC).


    In addition to the advanced features already present in the Mach microkernel,
    such as SMP transport-transparent IPC, and support for application-specific paging
    policies, the promise of a microkernel architecture was very appealing. OSF''s
    customers have interests in many different operating systems. We needed a way
    to pursue a program of operating systems research that was not only operating
    system specific. Operating system-specific behavior needed to be separated from
    OSF independent functionality. Our hope was that a microkernel-based architecture
    would prove to be more portable and modular than the monolithic systems that were
    prevalent at the time.'
