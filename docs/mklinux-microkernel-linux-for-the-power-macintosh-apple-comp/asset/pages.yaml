  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    **Note:** X11 may look like the Mac OS Finder, but it does not act at all like
    it. X11 uses more buttons on the mouse (emulating them via keyboard combinations,
    if need), has totally different scrolling, cut-and-paste, and other semantics,
    and is able to operate over a network to applications running on other computers.


    So, let''s try out the X11 Window System. Start up the X11 server for penguin:


    ```

    [linux@penguin linux]$ startx

    ```


    By default, MkLinux sets up you with **KDE** (K Desktop Environment), a (mostly)
    free collection of window management software, productivity tools, etc. See one
    of the references on X for information on customizing KDE and other X commands.
    In the meantime, here are some useful pointers on our default X setup:


    +   To bring a terminal window, first click the “K” icon on the left-hand end
    of the toolbar. Select “Terminal” from the “Utilities” menu. Browse around in
    the K menu to see what other facilities are available.


    +   KDE''s windows, like those of Mac OS, are “click to type”. If the cursor is
    over a window, that “hears” the keyboard. Different window managers have different
    ways of changing this; see the appropriate documentation.


    +   X expects the mouse to have three buttons. If you are using a one-button mouse,
    use Option-2 and Option-3 to emulate the “middle” and “right” buttons, respectively.


    **Note:** MkLinux supports mice (and other pick devices) that conform to the **ADB
    multi-button mouse protocol**. Before you buy a multi-button device, be sure to
