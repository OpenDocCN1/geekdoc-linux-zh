  md: '# Chapter 12: Controls And Devices


    # Keyboard


    The Keyboard is connected to the computer by means of the Apple Desktop Bus (ADB),
    discussed later in this chapter. Apple keyboards are rather conventional in appearance
    and function, with a few small exceptions:


    +   - The Option and Command keys, which can act as modifiers of other keyboard
    characters.

    - The Power key, which can be used to power the computer on and off, and (when
    combined with other keys) sends interrupts to the system.


    Apple offers several keyboards, ranging from compact (“Apple Keyboard II”) through
    extended (“Design Keyboard”). Third-party vendors offer a number of variations,
    including ergonomically contoured keyboards, keyboards with built-in trackballs
    or touch pads, etc.


    You may want to keep an extended keyboard around; function keys can be very handy
    for applications like Microsoft Word. Otherwise, we don''t find most Apple-compatible
    keyboards well suited for use with MkLinux. The Control, Escape, and Tilde keys
    are generally awkward to reach, while the Caps Lock is placed where it is almost
    certain to be hit by accident.


    If this alarms you, try to acquire one of Apple’s discontinued “UNIX” keyboards
    (Model M0116, also known as 6610383). Look for a compact keyboard with no function
    keys and a Caps Lock key in the lower-left-hand corner. We have heard that the
    Apple IIS (also discontinued) is both ADB-compatible and UNIX-friendly. You may
    be able to get one of these keyboards from a used equipment dealer as Pre-Owned
    Electronics:


