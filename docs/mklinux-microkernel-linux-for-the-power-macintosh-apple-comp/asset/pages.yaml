  md: '# MklLinux: Microkernel Linux for the Power Macintosh


    +   - How much data can you afford to lose? Your data is changing constantly;
    anything short of instantaneous backup (e.g., mirrored disk drives or a RAID system)
    may lose some amount of data.


    +   - How often can you take your system down? Backups are best done while the
    system is quiescent, kicking off your users too often has a cost, as well. You
    may want to take your chances on a few files being in transition during the occasional
    backup.


    +   - How much resources do you want to allocate to doing backups? Your time has
    value, even if you''re not getting paid for it. If you pay operators to load,
    fill, and inventory tapes, there is a real cost involved.


    Like other form of insurance, backups must be evaluated on a cost-benefit basis.
    Decide how much you are willing to sustain and how much effort you are willing
    to spend in risk reduction. Just don''t let the decision made by default; you
    may not like the results!


    **Backup methods.** MklLinux has several programs that can be used for backups,
    including:


    +   - **cpio - The cpio utility will archive a specified list of files. It combines
    well with the **find** command, which can create file lists according to assorted
    criteria. The pass-through mode is particularly useful for making identical copies
    of directory trees.


    +   - **dd - The dd utility is able to copy a bit-for-bit image of a disk partition
    (or even an entire disk drive).


    > Note: This is seldom a useful tool for general-purpose backups, but it can be
    quite useful for, say, copying one hard disk (partition) to another.


    +   - **tar - The tar utility is very facile at archiving specified directory
    trees, omitting specified sub-trees, etc.


