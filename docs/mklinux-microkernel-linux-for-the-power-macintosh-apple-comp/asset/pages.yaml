  md: '# Chapter 1: Introduction


    been working since 1984 to make one. The GNU Manifesto set forth the goal of developing
    a free UNIX-like system, and after more than a decade of work, we have one.


    Most free software projects have the goal of developing a particular program for
    a particular job. For example, Linus Torvalds set out to write a UNIX-like kernel
    (Linux); Donald Knuth set out to write a text formatter (TeX); Rob Scheffler set
    out to develop a window system (X). It''s natural to measure the contribution
    of this kind of project by specific programs that came from the project.


    If the GNU project was a project of this kind, and its contribution were be measured
    in this way, what conclusions would follow? One CD-ROM counted how much of their
    "Linux distribution" was GNU software. They found that GNU software was the largest
    single contingent, around 28% of the total source code, and this included some
    of the essential major components without which there could be no system. Linux
    itself was about 3%.


    So if you wanted to pick a name for the system based on credit for the programs
    in the system, what name would be "GNU".


    But choosing the name in this way would overlook a fundamental distinction. The
    GNU project was not a project to develop specific software. It was not a project
    to develop a C compiler, although we developed one. It was not a project to develop
    a text editor, although we did so. The GNU project''s aim was to develop a complete
    UNIX-like system. And that is what we have done, more or less with many people''s
    help.


    Many people have made major contributions to the free software in the system,
    and all deserve credit. But the reason it is a system - and not just a collection
    of useful programs - is because the GNU project set out to make it one. We chose
    what programs to write based on what was needed to get a complete free system.
    We wrote essential but exciting major components, such as the assembler and the
    C library, because you can''t have a complete free system without them.


    By the early 90''s, when Linux was ready, we had put together the whole system,
    aside from the kernel (and we were working on a kernel, the GNU Hurd, which runs
    on Mach). So it was possible to put Linux, a free kernel,'
  merge: -1
