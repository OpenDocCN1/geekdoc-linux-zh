- img_proc: true
  md: '# Preface


    The Power Macintosh is a very widely deployed system. Several million systems
    are already in place and millions more are installed every year. The Power Mac
    is particularly popular in the research and higher education communities, where
    dozens of Power Mac systems can be found in virtually-every building.


    In addition, the Power Macintosh platform''s integrated nature allows it to support
    true plug-and-play installation. Intel-based personal computers may have several
    useless busses, use any combination of controller cards, and in general offer
    a wealth of opportunities for confusion and error. The Power Mac, in contrast,
    is delivered as a reasonably complete system, with few additions that are likely
    to cause problems.


    Finally, the Power Macintosh is based on the PowerPC CPU architecture. The price/performance
    ratio of the PowerPC is already far better than that of the Pentium; this disparity
    will grow larger over time. Several key differences contribute to this disparity:


    +   - Competition - The PowerPC, although standardized in architecture, is being
    designed and produced in a competitive manner. This encourages innovation, while
    keeping PowerPC prices below those of Intel''s proprietary offerings.


    +   - Historical baggage - Unlike the Pentium, the PowerPC is not required to
    emulate a series of processors going nearly two decades into the past.


    +   - RISC vs CISC - The RISC architecture of the PowerPC allows it to take advantage
    of hardware developments that the Pentium cannot.


    +   - Simplicity - The PowerPC uses far fewer transistors than the Pentium for
    its base logic. This translates to lower power consumption, smaller size dies,
    more room for cache, and many other benefits.


    In summary, MkLinux brings together good hardware, good software, and a pair of
    substantial and enthusiastic user communities.


    # Product Abstract


    MkLinux: Microkernel Linux for the Power Macintosh is a combination of three items:


    +   - The Apple MkLinux disc - a MkLinux snapshot, with source code'
