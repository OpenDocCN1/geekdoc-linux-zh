    # Linux And The GNU Project


    Richard M. Stallman

    The GNU Project


    Many computer users run a GNU system every day, without realizing it. Through
    a peculiar turn of events, the version of GNU which is widely used today is more
    often known as “Linux”, and many users are not aware of the extent of its connection
    with the GNU project.


    There really is a Linux; it is a kernel, and these people are using it. You can’t
    use a kernel by itself; a kernel is useful only as part of a whole system. The
    system in Linux is typically used is a modified variant of the GNU system – a
    Linux-based GNU system.


    Many users are not fully aware of the distinction between the kernel, which is
    Linux, and the whole system, which they also call “Linux”. The ambiguous of the
    name doesn’t contribute to understanding.


    Programmers generally know that Linux is a kernel. But since they have generally
    heard the whole system called “Linux” as well, they often assume there must be
    a good reason for this. For example, some believe that once Linus Torvalds finished
    writing the kernel, his friends looked around for available free software, and
    just happened to find everything necessary to make a UNIX-like system.


    What they found was no accident – it was the GNU system. The available free software
    added up to a complete system because the GNU project had'
