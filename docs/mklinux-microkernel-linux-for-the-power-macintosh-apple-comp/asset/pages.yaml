  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    If you need a device entry that is not present, try to use the MAKEDEV script,
    located in /dev. If this does not meet your needs, you can use the mknod command
    to make a file system node for a device and the chmod command to set appropriate
    permissions. (If you are getting this far into things, you should either be a
    UNIX guru or have one!)


    **Making a file system.** If a disk partition is to be used, it must be partitioned
    into MkLinux file systems. The **mkfs** and **mke2fs** commands to do this, setting
    up the asserted control blocks and directories thatLinux needs. (You normally
    should use mke2fs.)


    **Creating a free directory.** When a file system is "mounted" on a directory,
    the original contents of the directory disappear. The contents reappear when the
    disk is dismounted, you might want to look at them before then. So, it is generally
    appropriate to create an empty directory to be used as the **mount point** for
    the new file system. (MkLinux provides /mnt as a mount point for temporary purposes.)


    The mount point directory can have any desired name, but short names are preferable.
    Some administrators prefer to name mount points for the SCSI device ID and partition
    involved (e.g., /1a); others like to name them topologically (e.g., /wombats).
    Be sure to set the mode of the directory to 777; other modes can cause the mounted
    file system to behave weirdly:


    ```

    # mkdir /1a

    # chmod 777 /1a

    ```


    **Mounting the file system on a directory.** Use the **mount** command to mount
    file systems, and the **umount** command to unmount them. If the mount command
    fails, check for shell session (or a subsidiary process) whose current directory
    lies within the mounted file system. (MkLinux will not unmount a file system that
    is currently in use.) If you cannot find the guilty process, you can always do
    a reboot, but don''t do this rashly...


    If a file system is going to be mounted frequently, you should add a line for
    it in /etc/fstab. Use the **noauto** flag if the file system should *not* be mounted
    automatically at system boot.'
