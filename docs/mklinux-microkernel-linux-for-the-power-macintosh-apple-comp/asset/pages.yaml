  md: '# 162 MkLinux: Microkernel Linux for the Power Macintosh


    The inode pager is currently a single thread running in the Linux server task.
    It manages the relation between a Mach memory object and a Linux inode, and replies
    to microkernel paging requests.


    When a page-in request comes in, the inode pager reads the required data from
    the disk and sends it back. For a page-out request, the microkernel sends the
    page inside the page-out message and the inode pager writes it back to disk. Of
    course, the microkernel only sends back dirty pages and silently discards clean
    ones, so the inode pager never has to write back text pages, for example.


    The inode pager is also responsible for flushing a memory object from the microkernel
    cache when needed, for example when a mapped binary is recompiled.


    # Dynamic Buffer Cache


    The dynamic buffer cache was a decisive point when we chose Linux as the free
    UNIX to port on OS MK. We had already tried a dynamic buffer cache on the OSF/1
    server with excellent results, but with some problems related to the OSF/1 file
    system design (it derived from BSD and is parallelized). We looked forward to
    making an easier experiment with Linux, where everything was already in place.


    The challenging part of a dynamic buffer cache for a Mach-based OS is that the
    buffer cache (in the Linux server) and the VM (in the microkernel) need to interact
    to let the system make the best use of the available mem-ory.


    Letting the buffer cache grow is the easy part: the Linux server manages all virtual
    memory and can therefore provide the buffer cache with more pages than there are
    in the physical memory. The tricky part is to get the buffer cache to shrink when
    the system is short on memory and before it starts paging.


    # Advisory Page Out


    The microkernel does not report memory shortage. When it really needs a page,
    it selects a physical page and sends a page-out request to the appropriate memory
    manager. The Linux server had no way to know that the system was short on memory
    before paging was already started.'
