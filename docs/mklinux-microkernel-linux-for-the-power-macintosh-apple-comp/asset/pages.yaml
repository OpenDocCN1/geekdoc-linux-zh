  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    **Initial Permissions.** The permissions acquired by a newly created file are
    results in permissions of the creator''s current **umask** (usage mask), as set
    by the **umask** command: Thus, a mask value


    ```

    # umask 077 create files as "rwx------"

    # umask 027 create files as "rxr-x--"

    # umask 002 create files as "rw-rw-rw-"

    ```


    The argument to mask is interpreted as one value. Each bit in the value masks
    (by means of an **exclusive or**) the default permission (777), yielding the permission
    bits for the resulting file. Thus, a mask value of 27 results in permissions rwx---,
    as:


    | Octal | Binary | Permissions | Notes |

    |---|---|---||

    | 777 | 111 111 111 | rwx rwx rwx | default (all on) |

    | 027 | 000 010 111 | --w- rwx | mask value |

    | == == | == == == == == == == |

    | 750 | 111 101 000 | rwx r-x --- | resulting value |


    **Changing Permissions.** The owner of a file (or root) may change the permissions
    on a file, using the **chmod** command. Permissions may be specified either symbolically
    or numerically:


    ```

    # chmod go+x foo

    # chmod 750 foo

    ```


    See the chmod manual page for more detailed coverage of its usage.


    A file group may also be changed by means of the **chgrp** command:


    ```

    # chgrp staff foo

    ```


    The file''s owner can change a file''s group to any group of which the owner is
    a member.(Group membership is controlled by the /etc/passwd and /etc/group files.)


    Predictably, root may change a file''s group to any group at all, even if it isn''t
    listed in /etc/group:


    ```

    # chgrp fubar foo

    # chgrp 12345 bar

    ```'
