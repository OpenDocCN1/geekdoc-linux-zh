    Permissions. Access to files and directories is controlled by their permissions

    by those on the directories above. (To access a file, a user must

    satisfy the restrictions on the file and on each directory on its path.)


    MkLinux supports three sets of permissions: user, group and other.These are

    checked, in order, with the first matching test. That is, if younare the file''s
    owner, only the first set of bits will be checked for you.


    Each set contains three mode bits: read (r), write (w), and execute (x). The

    interpretation of these bits varies somewhat, depending on the nature of the

    item. For files, the bits are interpreted as follows:


    +   - Read permission allows data to be read from a file.


    +   - Write permission allows data to be written into an existing file.


    +   - Execute permission allows a file to be run as a command. In the case of

    shell scripts, read permission is also needed.


    For directories, the interpretations are analogous, but a bit more subtle:


    +   - Read permission allows a directory to be read, as by ls or shell wild-carding
    (use of pattern-matching meta-characters).


    +   - Write permission allows a directory to be written to, as in creating

    removing files.


    +   - Execute permission allows a directory to be used in a pathname (passed

    through the way to a file).


    Note: It is a relatively common practice to remove read permission from a

    directory, while retaining execute permission. This keeps stray users from

    snooping around, but allows the owner to say “Pick up ~linux/A123fw” to

    a friend without much fear of any unauthorized party gaining access.'
