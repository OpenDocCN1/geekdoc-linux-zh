    # # Foreword


    This Foreword is adapted from an article that is scheduled for publication in
    the Linux Journal in early Spring of 1997. PTF thanks both the author and the
    magazine for permission to include this material.


    # # Linux? On the Macintosh? With Mach?


    Victoria L. Brown

    Apple Computer, Inc.


    Although MkLinux has been under development for a few years, it has only been
    available to the general public for a short while. Apple’s first public announcement
    concerning MkLinux was made at the Free Software Foundation''s First Conference
    on Free Redistributable Software (February 1996).


    Apple announced that it was supporting a project with the Open Software Foundation
    (OSF; now merged with X/Open to form The Open Group) to port Linux to a Mach base
    and port Mach to a variety of Power Macintosh products. The project was initiated,
    sponsored, and funded by Apple Computer.


    OSF provided the Mach 3.0 microkernel (developed by Carnegie Mellon University
    and the OSF Research Institute) and the engineering team to do the ports. (An
    OSF paper on MkLinux – Linux on the OSF Mach 3 Microkernel – was presented at
    the conference and is reproduced in the Mach Overview chapter.)'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    Apple''s February announcement predicted that the first port of MkLinux would
    become available in the Summer of 1996. Exceeding expectations, the first general
    release of MkLinux (Developer Release 1) became available in May. MkLinux DR1
    was followed by DR2, released in September 1996. DR3 is currently scheduled for
    release in Spring of 1997.


    MkLinux releases tend to incorporate large numbers of changes. Hundreds of megabytes
    of new or changed material must be acquired, whether by FTP or CD-ROM. A complete
    re-installation is typically necessary. Consequently, full MkLinux releases are
    made on a relatively infrequent basis (only when warranted by a sufficiently large
    or fundamental set of changes).


    Between releases, Apple issues minor updates via FTP. Some provide bug fixes;
    others introduce new, experimental features. In either case, they are meant to
    be used in conjunction with a specific MkLinux release.


    # What Is MkLinux?


    At this point, you may be wondering exactly what MkLinux is. Does it run the Mac
    OS Finder? Does it run X11? Are all the commands I know and love available? For
    that matter, how is the name itself pronounced?


    First things: MkLinux is officially pronounced M K (em-kay) Linux, but is often
    pronounced McLinux. This is in line with Linux tradition, which permits Linux
    itself to be pronounced in any of several ways. (Li-nooks, Lee-nooks are also
    commonly heard.)


    In any event, MkLinux is a complete port of Linux, with a full set of GNU tools
    and accessories, including X11r, running on top of the Mac microkernel. He, Mc
    (microkernel) Because MkLinux is really just Linux, it doesn''t run the Finder
    (yet:-). On the other hand, does it run just about any Linux command you could
    imagine. (Commands which require Intel-based hardware are, of course, non-functional.)


    # A Mach Primer


    The Mac microkernel provides an abstract layer over which other operating systems
    can be ported. It also provides multiprocessor support, kernel-level support,
    distributed and cluster computing, and other interesting features. For porting
    Mach to the Power Macintosh, Apple has cleared'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Foreword


    the way is for a variety of research and even commercial operating systems to
    run on the platform.


    The Mach 3 microkernel was developed at Carnegie Mellon University. Since then,
    it has been enhanced extensively by the Open Software Foundation (OSF) Research
    Institute. MKLinux currently uses MK7.2, a variant of the Mach 3.0 microkernel,
    but there are prospects for inclusion of a more advanced microkernel.


    The Mach microkernel performs only a small set of functions. It handles inter-process
    communication, low-level I/O (e.g., access to SCSI and other busses), Higher-level
    functions (file systems, networking, etc.) are performed by one or more "servers".


    Mach servants are user-mode processes that provide all or part of an operating
    system''s "personality". They do not talk directly to the underlying hardware;
    in general, no Mach process does that. Instead, they communicate with the Mach
    microkernel by means of "messages".


    Thus, when cat performs a write system call, the interrupt is caught by the Mach
    microkernel. The relevant information is then packed into a message and passed
    to the appropriate server. Some action of, interrupts, and messages then take
    place, involving the microkernel and the relevant server(s). Only when the write
    has been accomplished (or fails), does the microkernel restart the cat process.


    In MKLinux, in nearly all Mach-based systems, the OS personality is provided by
    a "single server". This is Mach terminology for a single process that handles
    all of a given operating system''s personality.


    The FSF''s Hurd, also based on Mach, uses a "multiple server" design, with a small
    number of processes sharing the OS duties. (We have received some interest, by
    the way, in parting the Hurd out OSF Mach 3 alongside MKLinux. Could be interesting...)


    # The MKLinux Server


    The server that Linux looks quite a bit like a standard Linux kernel. In fact,
    it is a copy of the Linux kernel, modified to use Mach''s low-level functionality.
    In the first two Developer Releases, the MKLinux server was based on Linux 1.2.13.
    Current updates to DR2, however, as all the new'
  merge: -1
