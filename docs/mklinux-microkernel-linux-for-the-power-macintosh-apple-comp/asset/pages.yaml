    # Preparation


    Unlike Linux-based systems, MkLinux has few requirements that aren''t met by standard
    system hardware. Basically, if MkLinux has been ported to your system, you won''t
    need to add much in the way of new hardware. Nor, in general, will you need to
    spend so much time preparing your system. A bit of disk formatting is all you
    need to do.


    # System Requirements


    MkLinux requires a Power Macintosh (or equivalent) system with at least eight
    megabytes of RAM (found on all Power Macintosh systems) and 100 MB of free disk
    space. For best results, you should have at least 16 MB of RAM and 500-MB or more
    of free disk space, preferably on a separate drive.


    DR3 supports most Power Macintosh (including Performa and PowerBook) systems;
    many clones also work, but add-in boards are unlikely to function. Support for
    IDE drives is speedy; USB is not supported at all. For current information, see
    the MkLinux web site (www.mklinux.apple.com).


    # File System Basics


    By default, each Mac OS disk drive contains a single file system. MkLinux disk
    drives, in contrast, frequently have multiple file systems, each located on its
    own physical partition. In particular, the main system drive drive'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    will have at least two partitions and may well have three or more. The added partitions
    allow the administrator to:


    +   - back up selected subsets of the system data.


    +   - increase the efficiency of file allocation on very large disk drives (by
    reducing the minimum block size).


    +   - prevent problem areas (e.g., spool directories) from causing the rest of
    the system to run out of space.


    A skeletal MkLinux system can be made to work in 100 MB of disk space; however,
    this will be almost unusable for most purposes. We recommend a minimum of 500
    MB (preferably, more) if you intend to load a full system, install additional
    software, add user accounts, re-build kernels, etc.


    You may use **Apple HD SC Setup** or any disk partition that your target drive
    may have any legal SCSI ID (0-6). The MkLinux distribution also contains a copy
    of **Apple Drive Setup**; this can be used to initialize and partition IDE drives.


    **Note:** Although MkLinux uses the Linux EXT2 file system, the partition map
    is not compatible with Intel-based Linux systems. Upcoming versions of MkLinux
    may address this issue, however.


    Existing Macintosh drives usually come pre-configured such that the entire drive
    is taken up with one or more Mac OS (HFS format) file systems. This does not work
    for MkLinux, which uses a number of file systems, typically in its own formats
    (e.g., EXT2 or swap). Consequently, your disk must be properly partitioned in
    order for you to install and use MkLinux.


    **Note:** Partitioning is a tricky business. Be sure to save any important files
    that are on the drive (programs, data files, etc.) *before* you try to partition
    the disk!


    Unfortunately, at this writing, partitioning is a manual process that must be
    performed before you begin the actual installation. The process you will create
    the disk partitions will vary, depending on the utility you are using. MkLinux
    currently uses the same basic partitioning structure that was used for Apple''s
    A/UX product, but most utilities should support setting up the partitions.'
  merge: -1
