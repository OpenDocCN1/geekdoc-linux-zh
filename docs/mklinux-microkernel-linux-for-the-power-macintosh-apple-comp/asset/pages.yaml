    the thread that is the current head of the chain is located, in this case thread
    D, it is suspended and an exception upcall is made to the thread D a chance to
    respond in a timely fashion to the event that triggered the alert. By using upcalls
    instead of messages, the time constraints of the target thread can be propagated
    to the exception handler. The exception processing can proceed without risk of
    a scheduling anomaly. The return value in the reply from the exception upcall
    indicates whether the alert was successfully handled or not. If it was not handled,
    then thread D is terminated (just as with thread C, the new head of the chain.
    Alerts will be back propagated up the chain until the thread originally alerted
    is reached.


    # Orphans


    Node failures or other events such as task or thread termination can result in
    broken chains. Detecting and eliminating the orphaned chain fragment in a timely
    fashion is important in real-time systems. Responding to whatever failure or event
    caused the chain to break is as important as responding to any other external
    event. In some systems, timely response to failures is more important than the
    processing of ordinary events.


    When a chain is broken, the rooted portion of the chain is immediately restarted.
    It returns from the RPC invocation with an error indicating the chain was broken,
    taking whatever action is deemed appropriate by the application.


    An orphaned alert is posted to the head of the orphaned chain. The alert is propagated
    to the head of the chain where an orphaned exception is generated. This is a fatal
    alert that cannot be handled correctly, i.e., when the orphaned exception handler
    returns, the thread is terminated and the alert is raised on the next thread up
    the chain. This gives each thread on the'
