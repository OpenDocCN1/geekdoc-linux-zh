  md: '# Chapter 14: Digital I/O


    Each Ethernet device listens for an “open space” in the interchange. When it finds
    a gap, it starts to transmit, listening to the result. If it detects a collision
    (i.e., simultaneous transmission by another device), it stops and waits a pseudo-random
    amount of time (back-off period) before trying again.


    There is no absolute guarantee that a device will ever get to transmit its data.
    This may concern real-time designers, causing them to use other (e.g., token ring)
    networks. In practice, however, moderately loaded Ethernet allow all packets to
    get through with minimal delays.


    Somewhat obviously, Ethernets cannot be expected to carry anything like their
    theoretical bandwidth if more than one device is trying to talk. In practice,
    Ethernet runs best at traffic levels below five Mbps.


    Ethernet packets have several mandatory components:


    +   - Preamble (62 bits) – a series of alternating ones and zeroes. This is generated
    by the transmitting chip and is used by the receiving chip to acquire byte synchronization.


    +   - Start Of Frame Delimiter (2 bits) – two consecutive ones bits. This is generated
    by the transmitting chip and is used by the receiving chip to acquire byte synchronization.


    +   - Destination Ethernet Address (6 bytes) – address of the intended receiver
    (all ones for broadcast packets).


    +   - Source Ethernet Address (6 bytes) – address of the transmitting chip.


    +   - Length or Type field (2 bytes) – For IEEE 802.3, this is the number of bytes
    of data. For Ethernet I and II, this is the packet type code. To avoid interpretation
    as length values, type codes are always greater than 1500.


    +   - Data (46 to 1500 bytes) – Short packets must be padded to 46 bytes.


    +   - Frame Check Sequence (4 bytes) – a 32 bit Cyclic Redundancy Code (CRC) checksum,
    calculated using the AUTODIN II polynomial. The FCS field normally is generated
    by the transmitting chip.


    Aside from the fact that all Ethernet packets must have the same basic format,
    there is no requirement that the packets sent by one application (or'
