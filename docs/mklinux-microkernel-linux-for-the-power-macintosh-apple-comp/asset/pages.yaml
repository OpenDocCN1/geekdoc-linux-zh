    # The pdisk Utility


    The MkLinux pdisk utility provides a useful supplement to the partitioning tools
    described above. As DR3, pdisk cannot install a driver nor build an HFS file system.
    On the other hand, you are free to supplement pdisk with other tools, using each
    for its strengths.


    Now for some of pdisk''s highlights. pdisk is a menu-driven, interactive program
    that runs under Mac OS and MkLinux. It is available as freely redistributable
    source code, allowing you to examine, modify, and/or port it'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# Chapter 2: Preparation


    to another system. pdisk generates “A/UX-style” partitions by default, reporting
    partition numbers in MkLinux-compatible form.


    If you are partitioning a secondary drive, intended solely for use under Mk-Linux,
    pdisk can do the entire job by itself. However, however you wish to use the drive
    under Mac OS, you will need to create Mac OS (HFS) file systems and possibly install
    a Mac “driver”. These can be accomplished in one of two ways, depending on your
    needs and preferences:


    +   Partition the drive with a Mac OS-specific tool, creating any desired HFS
    file systems and (if desired) installing a Mac OS driver. Then, pdisk to add A/UX-style
    partitions.


    +   Use pdisk to partition the drive and create the desired partitions. Then,
    use Disk First Aid to create any desired HFS file systems.


    The pdisk manual page is the official word on detailed usage instructions and
    late-breaking changes to the program’s capabilities. Here, however, is a gentle
    introduction to pdisk’s user interface, when used under MkLinux.


    Like many MkLinux tools, pdisk is happy to tell any your version number and commonly
    used options:


    ```

    linux@penguin linux$ /usr/sbin/pdisk --version

    version 0.4a2 (15 January 1997)

    linux@penguin linux$ /usr/sbin/pdisk --help

    pdisk [-h|--help]

    pdisk [-v|--version]

    pdisk [-l|--list [name ..]]

    pdisk [-r|--readonly] name ...

    pdisk.name

    ```


    > Note: /usr/sbin is not on most user’s search paths, we have filled the path
    to the command. The directory is on root’s search path, however, the commands
    below do not require this.


    Before you can get pdisk to examine, let modify a disk drive, you will need to
    become root. For a safe walkthrough, try using pdisk in “readonly” mode:


    ```

    root@penguin /root]# pdisk -r /dev/sda

    /dev/sda

    Command (? for help): ?

    ```'
