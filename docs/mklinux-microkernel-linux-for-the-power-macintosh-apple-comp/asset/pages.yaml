  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    An **ADB command** is a 1-byte value that specifies an ADB device address and
    encodes an action the target device should perform. In some cases, additional
    data may follow an ADB command. For example, the computer may transmit data to
    the device or the device may respond by transmitting one or more bytes of data
    back to the computer. It''s important to remember, however, ADB devices never
    issue commands to the computer. At most, the device can assert a service request
    signal, asking that computer poll the bus for any devices wishing to transmit
    data.


    The computer can send any of four bus commands to an ADB device. Three of these
    commands, Talk, Listen, and Flush, are addressed to specific registers on a specific
    device. The fourth command, SendReset, applies to all ADB devices.


    +   **Talk**. The computer sends a Talk command to a device to fetch user input
    (or other data) from the device. The Talk command requests that a specified device
    send the contents of a specified device register across the bus. After the device
    sends data the computer places the data into a buffer in RAM, which the computer
    makes available for device drivers or (in rare cases) programs. In the case of
    a Talk Register 0 command, the ADB device should respond to the computer only
    if it has new data to send.


    +   **Listen**. The computer sends a Listen command to a device to instruct it
    to prepare to receive additional data. The Listen command indicates which register
    is to receive the data. After sending a Listen command, the computer then transfers
    data from a buffer in RAM to the device. The device must overwrite the existing
    contents of the specified register with the new data.


    +   **Flush**. The computer sends a Flush command to a device to force it to flush
    any user-input data from a specified device register. The device should prepare
    itself to receive any further input from the user.


    +   **SendReset**. The computer uses a SendReset command to force all devices
    on the bus to reset themselves to their startup states. Each device should clear
    any of its pending actions and prepare to accept new ADB commands and user input
    data immediately. Note that the ADB device does not actually receive the SendReset
    command but recognizes that it should reset itself when the bus is driven low
    by the (3 ms.) **reset pulse**.'
