    # Booting


    Compatible platforms use Open Firmware [4], [5] to provide basic booting services.
    Open Firmware is capable of loading a little- or big-endian boot image (typically
    an OS or diagnostics) into memory from a variety of disk partitioning formats
    (Mac OS, FAT 41, AIX, and OS 9660 are presently supported). Once the boot image
    is in memory, the image can call back to Open Firmware to obtain I/O services
    to boot devices, perform platform-dependent services, and free up Open Firmware’s
    memory resources. After the image is fully in ownership of the platform, RTAS
    firmware is initialized prior to this act, and remains available after call Open
    Firmware is gone. One of the most important functions Open Firmware performs is
    to provide an inventory of the platform hardware, in the form of the Open Firmware
    Device Tree, to the boot image. OSs typically use this to dynamically load drivers
    for any hardware they recognize on the platform. Open Firmware also participates
    in some power management related functions, and offers a low-level user interface
    if desired.


    # Platform System Board Devices


    Some devices which typically appear on a platform system board are abstracted
    by RTAS calls. Such devices are then available in a “least common denominator”
    fashion to all OSs. Because the programming details of these devices are hidden
    from the OS, the hardware implementation is not dictated by the PowerPC platform
    specification. So long as the hardware is capable of implementing the specified
    requirements, and firmware can implement the necessary functions using it, the
    designer can use any devices he or she wants.


    Specific devices supported in this fashion include NVRAM, Time-of-Day Clock (TC),
    switches, lights, audible-beep device, power management hardware, simple number
    and text output, and PCI bridge and memory controller error status registers.
    These are described in the RTAS section of the specification.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Chapter 17: PowerPC Platform


    In the event that an OS has a custom driver for a particular system board device,
    it may choose to access the device directly and never call the RTAS routine(s)
    which abstract it. This approach is a very useful feature of the specification,
    as it keeps the "least common denominator" functionality small while giving vendors
    freedom to put sophisticated functions in their platforms for platform-aware OSs.


    # Basic I/O Devices


    There are many traditional "PC" and Macintosh I/O devices which are de-facto industry
    standards. These include asynchronous I/O, parallel port I/O, basic timers, sound
    generation, and third-party ISA DMA. Little if any innovation in these devices,
    little is to be gained by modifying them, and OS drivers generally exist which
    support all of them. Several devices are mandated by the specification, others
    are simply defined at the register level in providing a defined programming model
    for software. Note that the hardware implementor is not constrained to use a particular
    chip, or bus, to implement these functions. The specification only defines the
    programming model. Thus, platform designers are free to combine functions into
    different ASICs or packages in any way which makes their product design easier
    or cheaper, providing they maintain their programming models.


    # Other I/O Devices


    OS devices are described in the Open Firmware device tree to determine the hardware
    configuration, then locate OS-specific device drivers for devices which it intends
    to use. These drivers are generally loaded dynamically by modern OSs. The PowerPC
    Platform specification does not attempt to provide a BIOS with device drivers
    for platform I/O, as has been done historically in PC platforms. In a multi-OS
    standard like PowerPC Platform, there is no single device driver standard which
    would work for all OSs. Past experience has also shown that device drivers in
    BIOS ROMs tend to quickly become out-dated, and are generally replaced by dynamically
    loaded drivers away for production use. This topic is discussed further in a later
    section.


    In a few cases, the specification does define certain types of I/O as being optionally
    present, or even required to be present, but does not define a pro-'
  merge: -1
  pgno: 306
- img_proc: true
  md: "gramming model. Such requirements are not to simplify OS developers’ jobs,\b\
    ut were put into the specification for the benefit of users. Note that Open\n\
    Firmware must have a device driver for any device from which the plat-\nis to\
    \ boot. For system board bootable devices, the system firmware\nprovide such a\
    \ driver. For plug-cards, the required approach is to put an\nOpen Firmware driver\
    \ into the Plug-and-Play ROM on the card. The Plug\nand standard provides for\
    \ this capability. If a complete driver is not\nprovided in ROM, most Open Firmware\
    \ implementations will provide-\nnate to load the necessary driver (e.g., floppy\
    \ disk). However, no\nspecific method is mandated by the PowerPC Platform specification\
    \ itself.\n\n# Minimum System Requirements And System Classes\n\nThe specification\
    \ defines three classes of platforms: portables, desktops,\nand servers. The commercially\
    \ interesting configurations, and in fact the\\yspace available for connectors\
    \ and other I/O attachments, is usually vastly\ndifferent for platforms of these\
    \ different classes. The specification recog-\nnizes this, and provides different\
    \ definitions of the minimum hardware\nmust be present in a platform of each class.\n\
    \nFor example, a portable machine does not have space for a large number of\n\
    connectors, so the minimum requirement for external ports is reduced below\nthat\
    \ of a desktop. Similarly, a server may have no directly-attached users,\nso its\
    \ minimum requirements for I/O devices need not include a graphics dis-\nplay\
    \ or keyboard. The specification includes a table that relates the key\nhard requirements\
    \ for each class of platform. Note that there is no difference in\nfirmware requirements\
    \ for different platform classes.\n\n# Infrastructure-Induced Requirements\n\n\
    A major purpose of the PowerPC Platform specification was to allow the\ncoexistence\
    \ of the Macintosh and PC worlds in a single PowerPC micropro-\nbaser platform.\
    \ The desktop and portable machines which are built\nto the specification must\
    \ be to live in every world. I/O devices exist\ntoday with specific PC or Macintosh\
    \ interfaces. Mice and keyboards may\nuse PS/2 or Macintosh ADB connectors, asynchronous\
    \ serial I/O uses 9-pin\nD-shell connectors on a PC, but uses a mini-DIN 9 pin\
    \ connector on a Macin-\nt. The PC world uses almost exclusively IDE disks, the\
    \ Macintosh world\nuses almost exclusively SCSI disks. Differences in interface\
    \ reach"
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Chapter 17: PowerPC Platform


    deeply into the infrastructure supporting both families of machines, and in fact,
    all the way into the homes of owners of each type of computer. All the user experience,
    dealer knowledge, stock on shelves, and factories putting out PC peripheral hardware
    or Macintosh peripheral hardware will not stop overnight. Acknowledging the presence
    of these two infrastructures, and the fact that they will not go away quickly,
    was necessary for the specification to be effective. Much thought went into how
    to make it economical.


    The PowerPC Platform specification did not adopt a “converged” I/O model in which
    only one way was present to any given I/O function because the necessities of
    infrastructure dictate multiple approaches. The specification permits freedom
    of choice of specific hardware ports by hardware implementors, but ensures that
    users will find the support they need in their operating system and applications.
    In general, the approach taken is that OS will support both the Macintosh and
    PC ways of doing key interfaces, such as keyboards and mice, so that the hardware
    is present it will perform as well. The Minimum System Requirements section of
    the specification details the platform requirements, taking into account the different
    uses which laptop, desktop, and server computers are put.


    Although the specification does not require it, platform vendors choose to provide
    ports to connect both Macintosh and PC peripherals to a system may add some cost
    to the platform. However, the actual amount of cost added is likely to be quite
    small. This cost also generates genuine benefit to end users, as it increases
    the variety and number of external ports they have available to connect to external
    peripherals. This gives them greater freedom of choice in peripheral purchases,
    which can translate to a lower total system cost.


    # OS-Influenced Requirements


    Each of the OSs targeted for PowerPC Platforms has a legacy of past platforms,
    and places certain requirements onto any platform it runs upon. These include
    Mac OS, which has always run on Apple-designed platforms, the PC-compatible OSs
    such as Netware, OS/2, Solaris x86, and Windows NT, which run on systems built
    with commodity PC-based chips, and server operating systems such as AIX and Solaris,
    which have typically run on customized hardware. To keep potential costs low,'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 270 MkLinux: Microkernel Linux for the Power Macintosh


    tion sometimes adopted existing interfaces that were supported by most of the
    operating systems, forcing a few OSs to adapt. For example, the specification
    defines a traditional PC programming model for the floppy disk controller. In
    a few cases, the specification describes new interfaces, where no existing mechanism
    fulfilled most of the requirements. In this latter case, most or all of the operating
    systems must adapt. An example of this is the use of a new memory map.


    An example of adopting both new and old interfaces is the interrupt controller.
    Since the traditional PC-based interrupt scheme does not work efficiently for
    multiprocessor systems and does not efficiently provide a large number of interrupts
    for larger desktop and server configurations, the PowerPC Platform specification
    adopted the OpenPIC interrupt controller [6] as its primary interrupt mechanism.
    This permits multiprocessor systems to be built, and is extensible to very large
    server configurations. Because almost all of the operating systems already had
    implementations in place for the PC-style cascaded-8259 interrupt scheme, it was
    included in the specification. This was included mainly as a legacy item and is
    not used for future I/O expansion. While this was technically unnecessary, the
    8259 functionality is usually buried inside already-present chips, and therefore
    adds negligible cost.


    # System States


    The PowerPC Platform specification implicitly and explicitly defines a few of
    the behaviors which buyers of platforms can expect. Since many user-visible details
    of system operation are defined by each operating system, some of these behaviors
    are described as being possible, but are not mandated, by the specification.


    # Time-Related States


    The platform goes through several important stages in the process of being powered-up
    from an initially reset and powered-off state. This is depicted in Figure 2. As
    shown, from the initial powered-off state, a system typically enters a power-on
    self-test (POST) phase, then boots an operating system into memory, then discards
    Open Firmware and enters a fully-controlled state in which it runs for an indefinite
    time, and finally enters either a low-power state ready for a rapid resumption,
    or powers off into a fully reset state. Variations permitted within the specification
    to'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Chapter 17: PowerPC Platform


    these simple states include such as automatically running diagnostics after a
    failure, more complex power management states, or multi-boot (i.e., running different
    OSs) without power-down. Note that RTAS Firmware is available during the period
    that the OS is running, unlike Open Firmware, which may or not be present.


    ![](img/3b7ec884f28e528f7ed894bd752c196a_310_0.png)


    Figure 2 - Time Line of OS/System Firmware Control (DARK)


    # Power-Related States


    In addition to the time-related states described above, a platform may also implement
    a set of power management related states. In practice, all operating systems have
    their own power management concepts and implementation. The PowerPC Platform philosophy
    is that power management policy is strictly the province of the operating system
    and its utility programs.


    Interface to the power management mechanism: that is, we the policy decisions
    are carried out in hardware, this is the job of either I/O device drivers (for
    some devices), or the RTAS abstraction firmware. Hardware is not expected to autonomously
    make power management decisions and carry them out without OS knowledge.


    # Direction For The Next PowerPC Platform Revision


    The PowerPC Platform specification was produced by a multi-company group of system
    architects, with significant input from industry partners. All the participants
    were interested in protecting their engineering and customer bases from unwarranted
    change and from loss of functionality. This is'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'a major strength of the specification. Many portability or adoption problems
    that might be faced by OS and application writers, hardware engineers, and end
    users were considered and solved for the PowerPC Platform specification. However,
    it is a goal of the current and future PowerPC Platform specification work that
    new technologies be introduced and embraced. The PowerPC Platform specification
    will evolve with time to include new technologies; this section describes some
    of the issues which may drive this change.


    Some of the things we would have liked to do in the first version of the PowerPC
    Platform specification were simply not reasonable for a first issue. Not only
    did the specification itself have to be produced in a reasonable time, but the
    platforms have to be implemented, OSs to be ported, and some new infrastructure
    needed to be created. We chose to start with a straightforward first version.
    With the benefit of user feedback and open discussion, the specification will
    evolve to meet future market needs. When adding new functionality, the transition
    from prior to new approach will be smooth, permitting vendors and customers to
    adapt the new features at their own pace.


    An example of a change that might be considered the simplification to the architecture
    is to simplify the interrupt structure by completely eliminating the traditional
    8259 interface, and using the OpenPIC controller for all interrupts. This will
    be difficult to do quickly, as it requires all I/O chips to make their interrupt
    sources accessible to connect to an OpenPIC controller. Some ISA bridge chips
    already contain the 8259 controller as well as some interrupt sources. As an optimization,
    eliminating the 8259 interface would improve OS performance, reduce the number
    of I/O pins and gates required, and give vendors more freedom in chip partitioning,
    helping them in their quest to build very-low-count platforms.


    # New Technology


    As new and important developments arise in the industry, such as online videoconferencing,
    embedded video, and new I/O interfaces, we must constantly decide if a technology
    is yet at the point where it is a de-facto or de-jure standard (and therefore
    no longer an “added-value” product differentiator). If it is, we will consider
    adopting it into the PowerPC Plat-'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'form specification to reduce the variety of implementations and consolidate
    software implementations. This is an on-going activity.


    # Conclusions


    The PowerPC Platform specification allows the PowerPC industry to migrate to a
    set of platforms that all present a common set of programming models to all OSs.
    This permits shrink-wrap OSs to be ported to the specification, and to run on
    compatible platforms, without having to do further platform-specific ports.


    The first release of the specification satisfies its objectives, and is well-suited
    to the marketplace. Future additions and changes to the specification will be
    made in order to lead and follow the industry, in order to reduce the complexity
    and cost of building platforms to an absolute minimum while increasing their functionality.


