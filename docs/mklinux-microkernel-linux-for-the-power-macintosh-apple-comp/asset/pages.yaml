  md: '# Chapter 3: Installation


    At this point, the installer will present you with a list of collections of packages.
    Use the Space bar to select the collections that seem appropriate for your installation.


    At the very end of the list, there is an item labelled “Everything”. Selecting
    this item will install every package (all 420 of them!) in the main package set,
    even those not represented in the other groups.


    There is also a box that is labelled “Select individual packages”. If this box
    is checked when you leave this screen, you will go to a set of screens where you
    can select packages individually.


    Note: Be sure to scroll down and view all of the selections!


    # “Install log” Screen


    This is just an informative message explaining that an installation log will be
    saved and will be viewable after the installation in the file “tmp/install.log”.


    # “Install System” Screens


    At this point, the installer will proceed to create the filesystems in your MkLinux
    partitions, then install the packages that you selected. A progress bar will be
    displayed, along with estimates of how much time it will take to complete installing
    the packages.


    > Note: A few packages write to the installer screen, making the display somewhat
    messy. You may safely ignore these messages.


    # “Configure Mouse” Screen


    Choose ADB Mouse.


    > Note: The “emulate three buttons” option is not applicable under DR3.


    # “Network Configuration” Screen


    If your MkLinux system is connected to a TCP/IP-based Local Area Network, and
    you want to configure your system to operate on this network at this time, choose
    “Yes”.'
