  md: '# Chapter 1: Introduction


    day. Much of the power of MkLinux is a direct result of decisions made by the
    early UNIX programmers.


    It may be a bit daunting, but try to imagine the environment these folks had to
    work with. Instead of a bit-mapped screen, picture a ten character per second
    teletype machine with a handy (!) paper-tape reader/punch.


    No soft-touch keyboard on this baby; these keys go Ker-CHUNK! (It has been suggested
    that the awkward nature of these early keyboards was largely responsible for the
    fabled brevity of UNIX command names.)


    For your multiple-megabyte memory system, substitute about that many kilobytes
    of core memory. Perform equally drastic over the disk space.


    Now think about writing an operating system for this turkey. Lessee now, the first
    things we need are what, a cross-assembler and a program loader? Yeah, we can
    assemble the code down the hall and carry over the paper tapes. Once we get that
    working, we can start on a file system...


    Then, step by step, claw your way up to the sort of system described in the quote
    above, moving to better hardware when it is made available. Sort of thing is said
    to build character, but we applaud the character of these early pioneers, however
    they came by it!


    After a fairly brief incubation period, UNIX emerged from the Labs. It was not
    a commercial, supported operating system; far from it! Instead, it was a source
    code tape, a license agreement, and the Lab''s best wishes. (Not too different
    from the present-day situation with MkLinux, for that matter:-)


    Possibly in response to this rather lack of formal support, UNIX hackers in libraries
    and universities around the world got to fixing their own bugs, writing their
    own tools, and helping each other out. This tradition, which is largely missing
    from today''s binary-only commercial UNIX systems, endures today in the freeware
    (e.g., Linux) community.


    # The UNIX Dialectic


    With so many people doing UNIX development, it is not surprising that multiple
    solutions were developed to many of the same problems. Human nature being what
    it is, it was all too frequently “impossible” for these differences to be reconciled.'
  merge: -1
  pgno: 42
