  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    Some network administrators may also choose MkLinux for LAN servers (compute,
    file, etc.), Internet servers (FTP, WWW, etc.), and other systems of that nature.
    MkLinux combines:


    +   - the strengths of traditional UNIX (preemptive multitasking, multi-user support,
    security controls, etc.)

    - the low cost and source availability of Linux,

    - the portability, programming features, and robustness of Mach,

    - and the known reliability of Power Macintosh hardware.


    # Why Mach, Linux, Power Macintosh?


    MkLinux combines several disparate technologies. It is reasonable to ask why these
    particular technologies were chosen and why, in any case, they should be put together
    in this fashion.


    The Mach microkernel is efficient, powerful, and mature. Originally developed
    by Carnegie Mellon University, it now forms the basis for several commercial and
    research operating systems. Mach provides (at least potential-) features such
    as:


    +   - Portability to several platforms

    - Real-Time capabilities

    - Robustness

    - Scalability (SMP, clusters, etc.)

    - Security

    - Unique OS debugging capabilities (e.g., multiple Linux servers)

    - User-mode system extensions


    Linux is a popular and rapidly developing "clone" of UNIX, based on the aforementioned
    GNU system. Linux source code, being protected by the GNU General Public License,
    cannot be "taken proprietary" by commercial enterprises. Many Linux programmers
    consider this to be an important part of their reason for contributing development
    work to the Linux community.'
