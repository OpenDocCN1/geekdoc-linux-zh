    # Overview


    The PowerPC Platform (formerly known as the Common Hardware Reference Platform)
    specification defines a family of computer systems on which Macintosh, PC, and
    UNIX-based Operating Systems (OSs) can run without platform-specific tailoring.
    This makes it easy to build a system based on the PPC microprocessor that can
    run a variety of OSs but can still be optimized for price, and have additional
    value-added features. This paper gives an informal overview of the specification.


    # Introduction


    A major goal of the PowerPC Platform architecture is to permit hardware platform
    vendors to build platforms which will run multiple operating systems, such as
    AIX, Mac OS, NetWare, OS/2, Solaris, and Windows NT, without requiring the OS
