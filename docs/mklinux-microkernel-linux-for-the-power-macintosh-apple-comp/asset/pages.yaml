  md: '# Chapter 15: PowerPC CPU


    fornia market researcher. But as software tailored specifically for RISC PCs becomes
    available, “and as people start to buy strictly on performance, it’s the beginning
    of the end for the x86”, he says, referring to the standard Intel chip design.


    -Wall Street Journal, April 29, 1993, page B1


    # The benefits of multiple-source manufacturing


    Sole-source manufacturing can be compared with multiple-source manufacturing by
    looking at the price of the product and the possibilities for future product improvement.


    # Pricing and future products


    Customers benefit from competition between producers in the market – it drives
    down prices and speeds up product improvement cycles. Intel, as the sole-provider
    of Pentium, will likely have little incentive to lower prices. On the other hand,
    Motorola and IBM will offer competitive versions of PowerPC processors, which
    tend to drive down prices. In the case of PowerPC and Pentium, the next generation
    of the PowerPC processor is expected to ship in 1994, while the next generation
    of Pentium processors from Intel are not expected to ship until 1995 at the earliest
    (PC Week, September 13, 1993, page 22). Motorola and IBM have already shown samples
    of the next version of PowerPC – the PowerPC 603 chip – and announced the PowerPC
    604 and 620.


    # Process technologies


    The combined technology and production resources of two of the largest semi-conductor
    manufacturers in the world – IBM and Motorola – suggest that PowerPC customers
    will benefit from the most advanced process technology. The PowerPC 601 chip is
    available from both Motorola and IBM, using state-of-the-art process technology.
    Motorola and IBM are continuing work to improve their process technology even
    further to produce the next generation of PowerPC chips.


    # Conclusion


    After comparing the architectures, performance ratings, and business issues of
    Pentium and PowerPC, PowerPC emerges with the distinct advantage for the following
    reasons'
