    # Characterization Tools (ETAP)


    ETAP (Event Trace Analysis Package) [Car95a] is a tool for characterizing the
    performance and behavior of real-time applications as well as the system software.
    ETAP is straightforward in design. The kernel reserves a block of memory as a
    circular message buffer. The size of the buffer is configurable. The kernel has
    been instrumented with a variety of probes. Probe entries contain a type field,
    a time-stamp, a thread ID tuple, and probe specific information. Probes can be
    used to capture a wide range of information such as context switching events,
    system calls, lock events, device events, etc. There are global and per-thread
    probes. Any subset of the probes can be dynamically activated or deactivated.
    Applications write to the buffer. There is a second task that reads the buffer
    and records it on disk where the information can be subsequently analyzed using
    different report generation programs. When configured the kernel, inactive probes
    incur an insignificant overhead (approximately 1 percent) when running AIM III.


    The thread ID tuple identifies the thread and its shuttle or RPC chain. The RPC
    chain identifier allows us to determine which client thread a server is acting
    for. This is an invaluable tool for tracking the causal dependency in a client/server
    system. It has also become a valuable tool for debugging the kernel and applications.


