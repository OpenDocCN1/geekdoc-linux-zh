    # Introduction


    This paper documents the user visible architecture of the Mach 3 kernel. It is
    assumed that the reader is familiar with the basic ideas of Mach as are found
    in:


    +   - Mike Accetta, Robert Baron, William Bolosky, David Golub, Richard Rashid,
    Avadis Tevanian, Michael Young, “Mach: A New Kernel Foundation for UNIX Development”,
    in Proceedings of the Summer 1986 USENIX Conference, Atlanta, GA.


    The notion of operating system functionality provided by a Mach user server can
    be found in:


    > David Golub, Randall Dean, Alessandro Forin, Richard Rashid, “UNIX as an Application
    Program”, in Proceedings of the Summer 1990 USENIX Conference, Anaheim, CA.


    Mach was developed as a new foundation for operating systems. It provides extensible
    memory management, multiple points of control (threads) and an extensive process
    (task) to process communication facility (IPC). The goals of Mach include:


