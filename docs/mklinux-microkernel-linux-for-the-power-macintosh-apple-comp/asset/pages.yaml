  md: '# Business issues


    Pentium and PowerPC will impact the personal computer industry in different ways,
    because the companies that manufacture the chips have different business strategies.
    Intel, as the sole source provider of Pentium and the PowerPC alliance (Apple,
    IBM, and Motorola), as a joint collaboration, have different resources and development
    strategies for their microprocessors.


    # Resources


    We can compare the resources behind Pentium and PowerPC in the following two important
    areas.


    # Budget


    Published annual reports show that Apple, IBM, and Motorola had a combined 1992
    research and development (R&D) budget of more than $8 billion, while Intel''s
    1992 R&D budget was approximately $780 million. Though only a portion of each
    budget is devoted to advancing these microprocessors, it''s clear that the Apple,
    IBM, and Motorola alliance have combined R&D resources that exceed Intel''s.


    # Market opportunities


    A larger R&D budget does not necessarily ensure a more successful processor. The
    difference between a sole-source provider and an alliance in terms of resources
    can have more to do with channels and market opportunities than R&D dollars. Intel
    has only its own resources to concentrate on development of its products.


    On the other hand, the combined resources of Apple, IBM, and Motorola make advances
    possible that could be too costly or too risky for one company to undertake -
    as developing other implementations of the PowerPC microprocessor. The PowerPC
    processor is being considered for use in cars, household appliances, and several
    other applications. The desire to address these high-volume markets allows Apple,
    Motorola, and IBM to justify high levels of spending to advance the architecture
    and drive down the cost of PowerPC even further.


    > "Pentium will immediately benefit from Intel''s enormous market inertia", says
    Michael Slater, principal of MicroDesign Resources, a Cali-'
  merge: -1
