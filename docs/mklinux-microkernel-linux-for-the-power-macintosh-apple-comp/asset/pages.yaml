- img_proc: true
  md: '# Chapter 5: Essential System Administration 65


    +   - Delta backups – Some backup programs allow you to save only files that have
    been modified since the last full backup. If your data is relatively stable, this
    can greatly reduce the backup effort.


    +   - “disk-to-disk” backups – Many risks (human error, hardware and software-problems,
    etc.) can be reduced by automated disk-to-disk backups. Have cron run your backup
    program during the middle of the day, compress the output, and you can save it
    on a different drive. (To save space, you can do most daily backups...)


    Media considerations. Your backups are important; handle them with care:


    +   - media security – Treat your backup media with care. You don’t want it to
    be stolen, damaged, examined, or modified by malicious persons.


    +   - multiple media – Your system could crash during the backup process. Alternatively,
    your backup tape (disk, etc.) could develop an error and become unusable. If you
    only have one backup, you could be in big trouble. Use sets of at least three
    tapes, cycling through them as you perform your backups.


    +   - off-site storage – If your building burns down, will you still have copies
    of your data? It is very easy to save copies of your backups in another location;
    the hard part is remembering to do it.


    +   - retiring tapes – Even with occasional use, your tapes will wear out over
    time. Sheer age will also cause your tapes to degrade. Keep track of the age and
    usage of your tapes; after a few dozen or a couple of years, take them out of
    service.


    > Note: Many sites are starting to use write-once media (processable CD-ROMs)
    for archival purposes. These devices are physically robust, have long shelf lives,
    and are quite resistant to tampering.


    +   - data retention – If you are taking frequent backups and saving them forever,
    you could easily run out of room to store them! On the other hand, how important
    is data from several months or years ago? In most cases, we recommend that you
    save some snapshots, but refrain from trying to save everything.


    Backup frequency, etc. How often, and when should backups be done? These aren’t
    easy questions; several interrelated factors are:'
