    # Networking With CORDS


    The support for networks in Mach 3.0 was limited to the packet filter. Protocols
    and network transparent IPC were expected to be implemented as user-servers. This
    had a negative effect on the performance of most uses of the network. The architecture
    also presented significant obstacles to a correct implementation of network IPC.
    In OSF MK, we have added an object-oriented framework for network protocols, Communication
    Objects for Reliable, Distributed Systems (CORDS) [Tra94a]. CORDS is derived from
    the xkernel, developed by the University of Arizona [Hut91a].


    The CORDS framework has many features to simplify the task of implementing networking-protocols.
    Complex protocols can be decomposed into a graph of micro-protocols. A protocol
    graph can be extended across protection boundaries, permitting portions of a protocol
    graph to exist in a task while other parts exist in the kernel.


    There is a notion of a path that describes the route a message will take through
    the protocol graph. Resources such as message buffers and threads can be attached
    to paths, allowing the protocol designer to manage the resources needed to guarantee
    the end-to-end quality of service needed by the application. Paths also provide
    a natural means for the treatment of protocol parallelism. We have used the framework
    to develop a real-time distributed clock protocol based on the Cristian algorithms,
    node-alive protocol, ordered reliable broadcast protocols, Mach IPC, and RPC protocols
    among others.'
