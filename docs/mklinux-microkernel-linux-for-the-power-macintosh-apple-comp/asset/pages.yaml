  md: '# 216 MkLinux: Microkernel Linux for the Power Macintosh


    SCSI commands are contained in a command descriptor block (CDB), a data structure
    which can be 6, 10, or 12 bytes in size. The first byte specifies the desired
    operation; remaining bytes hold parameters used by the operation.


    A single SCSI command may cause a peripheral device to undertake a relatively
    large amount of work. For example, the read command can specify multiple blocks
    of data rather than just one.


    The primary difference between the SCSI protocol and other interfaces typically
    used for storage devices is that SCSI commands address a device as a series of
    logical blocks rather than in terms of heads, tracks, and sectors. Each physical
    characteristics of the device allows the SCSI protocol to be used with a wide
    variety of devices.


    The SCSI standard specifies a number of possible messages between initiator and
    target. SCSI messages are small blocks of data, often just one byte in size, indicate
    the successful completion of an operation (the command message), or a variety
    of other events, requests, and status information. All messages are sent during
    the message phase.


    The complete message is required in all SCSI implementations. This message is
    sent from the target to the initiator and indicates that a command (or series
    of linked commands) has been completed, either successfully or unsuccessfully.
    Success or failure of the command is indicated by status information sent earlier
    during the status phase.


