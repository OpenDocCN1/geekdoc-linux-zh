  md: '# Modifying the MkLinux Server


    Before you modify any part of the MkLinux server, you should do a complete build
    of the existing server. This ensures that your base distribution is complete,
    correctly installed, etc. It also ensures that all of the object files are available,
    with appropriate date stamps, etc.


    +   - Add the tools to your PATH. Some Math tools are needed to build the MkLinux
    server. They are in:


    ML/osfmk/tools/ppc/ppc_linux/hostbin


    You need to add this path to your PATH environment variable. A good way to do
    that is to execute the commands in the script ML/set_ode_path.sh script as part
    of ~/.bashrc. Just add the following line to the file:


    ```

    /usr/src/ML/set_ode_path.sh

    ```


    > Note: The PATH cannot always be set to the same value. In some situations (e.g.,
    building the microkernel), you will need to use the ODE make command. In others
    (e.g., building the MkLinux server), you will need to use the MkLinux make command.
    For more details, see the notes in the section above on "Building the Microkernel".


    +   - Building multiple configurations. We usually build multiple configurations
    of the server. The development (dev) version has CONFIG_OSFMACH3_DEBUG turned
    on; the production (prod) version does not.


    The easiest way to do this is to leave the original MkLinux source tree untouched
    (never build in it), but create some shadow trees that are fully populated with
    symbolic links to the original source tree.


    Shadow trees can be built with a utility provided with X (lindir) or an ODE utility
    (mklinks). Run one of these for each desired tree:


    ```

    $ cd /usr/src/ML

    $ mkdir ml_dev ml_prod

    $ cd ml_dev

    $ lindir ../mklinux

    $ cd ../ml_prod

    $ lindir ../mklinux

    ```'
