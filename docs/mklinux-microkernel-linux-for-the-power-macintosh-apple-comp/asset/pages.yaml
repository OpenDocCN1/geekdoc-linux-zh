    # Analog I/O


    All Power Macintosh systems support audio input and output and video output (i.e.,
    support for a monitor). Some Power Mac systems (especially Performa''s) support
    additional analog facilities, including television input and/or output.


    It may be a while, however, before these capabilities are available under MkLinux.
    Several levels of problems must be solved:


    +   - **Real-time support.** Real-time applications (such as audio input) must
    be guaranteed a certain amount of CPU time on a controlled and predict-able basis.
    Because Mac OS allows applications to take over the entire machine, it has no
    problem solving this requirement.


    MkLinux, in contrast, does **preemptive multi-tasking**, switching the CPU between
    processes according to constantly changing levels of priority. This gives MkLinux
    better overall performance than Mac OS, but prevents it from supporting real-time
    applications. We expect, however, that improvements to the Mach microkernel underlying
    MkLinux may solve this problem.


    +   - **Drivers.** There is yet no driver software for any audio or video hardware.
    We expect this to show up over time, but it is not likely to get much attention
    from the AppleLinux Team until the majority of Power Macintosh platforms have
    been made to work under MkLinux.


    +   - **Applications.** Although Mac OS has a great deal of software to support
    audio and video, these applications will not function under MkLinux. Thus, we
    expect that the Linux (and more generally, UNIX) community will be the best source
    of audio-visual support software.'
