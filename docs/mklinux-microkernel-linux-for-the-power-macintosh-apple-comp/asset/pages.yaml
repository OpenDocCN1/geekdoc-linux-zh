    # Adding User Accounts


    Initially, MkLinux has only one login account, root. The root account is very
    powerful; it can read (and write!) any file at all.


    So, unless you never make mistakes (-), you probably should not stay logged in
    root all the personal username for your regular system use. In theory, your username
    can contain:


    +   - lower-case letters (a-z)


    +   - digits (0-9)


    +   - periods (.) and underscores (_)


    In practice, it''s best to use only letters, avoiding those that aren''t found
    in English (i.e., 8-bit characters). You will be giving your username to folks
    around the world; pick something they can use and remember!


    If at all possible, let users pick their own usernames. First names (brett) and
    nicknames (lion) work very well on smaller systems. They tend to be short, memorable,
    and emotionally satisfying.


    If you are administering a system on a network or there are lots of users on your
    system, consider using initials (vlb) or combinations of first initials and surnames
    (gcville). Avoid using artificial usernames (q123456); they are hard to remember
    and tend to depersonalize your users.


    **Note:** Teach users how to change their passwords. Instruct them to set a new
    password **whenever** the current one may become compromised!


    To add a user (create a home directory, etc.), use the **adduser** command, then
    use `passwd` to set an (initial, if for someone else) password:


    ```

    [root@penguin /root]# adduser linux

    ...

    [root@penguin /root]# passwd linux

    ```'
