  md: '# # Chapter 11:


    +   - Compatibility Issues

    - Come Help!

    - Hardware Information


    # ## Hardware Overview


    Many Mac OS users have no interest whatsoever in the hardware that lies beneath
    their operating system and applications. If you wish to approach MkLinux in the
    same manner, we have no objections whatsoever. We are, in fact, very happy that
    MkLinux allows this kind of usage!


    Some MkLinux users may want to peek under the covers a bit. If you are in this
    camp, you should find the next few chapters very useful and interesting. We cover
    a spectrum of hardware issues, ranging from devices and controls through interfaces
    to processor descriptions and chip use.


    In addition, the PTF Reference disc contains a number of Apple documents that
    have useful hardware information. If you are willing to skip past the Mac OS-specific
    sections, you may find exactly the information you need.


    # ### Compatibility Issues


    Apple''s engineers work hard (and quite successfully!) at hiding the differences
    among different Macintosh processors. Nonetheless, there are quite significant
    differences between the different models. Both the Mac OS and MkLinux programming
    staff need to address these issues very carefully, lest their users (and third-party
    programmers) fall into the gaps.


    Because the Power Macintosh has been available for several years, the Apple MkLinux
    Team has quite a lot of catching up to do. Nonetheless, we expect that they will
    make good on their promise to support the entire range of Power Macintosh systems.
    To understand how much work is involved, it may be useful to review a bit of personal
    computer history.


    The initial "IBM PC" computers were in fact manufactured by International Business
    Machines (IBM). And, for much of the PC''s history, IBM was the'
  merge: -1
  pgno: 214
- img_proc: true
  md: "de facto defining authority. No official standards bodies existed; indeed,\n\
    IBM was not all that eager to publish its specifications.\n\nConsequently, as\
    \ various vendors attempted to market \"PC-compatible\"\nmach, users settled on\
    \ a simple, if somewhat brutal test: \"All my soft-\nware work the same way on\
    \ this machine as it does on a 'real' IBM\nPC.\" If a computer passed this test,\
    \ it was compatible; if not, it was not\nback to the vendor as defective.\n\n\
    Two results emerged from this testing process. First, PC hardware engineers\n\
    learned to design \"bug-for-bug compatible\" motherboards and interface\ncards,\
    \ which were not a totally desirable result, but it did serve the PC users'\n\
    immediate need for cheap, functional, and reliable machines.\n\nThe other result,\
    \ which plagues operating system writers to this day, is,\nthat hardware vendors\
    \ only felt it necessary to test their hardware on the\n popular software: MS-DOS\
    \ and a small suite of applications. If any\nother operating system could not\
    \ deal with the vagaries of a particular\nPROM set, that was just too bad!\n\n\
    Meanwhile, engineers at companies like Apple and Sun faced a totally\ndifferent\
    \ set of constraints: pack the maximum capability into the smallest\n(read, cheapest)\
    \ number of chips and devices. If a software interface got\nchanged in the process,\
    \ no problem. The operating system code can always\nbe modified to deal with hardware\
    \ changes (It's just a simple matter of\nsoftware! :-\n\nGiven the variety of\
    \ machine architectures produced by these vendors, it's\nrather amazing that the\
    \ system software was capable of dealing with all\nt hardware combinations, let\
    \ alone handling new hardware features and\n(Oh, yeah!) adding new software (e.g.,\
    \ user interface) bells and whistles.\n\nNow, we have to present. A small band\
    \ of programmers at\nApple Computer and the Open Group Research Institute are\
    \ tasked with\nmaking a Mach-based Linux variant work on the entire range of PowerPC-\n\
    based Macintosh systems. Said systems collectively use more than three\ndozen\
    \ special-purpose chips, in addition to several CPU implementations\nand a varying\
    \ complement of off-the-shelf support chips.\n\nClearly, the MkLinux porting team\
    \ has a lot of work to do. Equally clearly,\nmembers of the MkLinux user community\
    \ will have to help with some of the"
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Chapter 11: Hardware Overview


    more esoteric issues (e.g., audio support on a particular Performa model) if they
    are not willing to wait quite while for a solution.


    The Apple MkLinux Team is miniscule; just a few engineers. Consequently, the MkLinux
    community is expected to test releases, report bugs, and (if possible) suggest
    solutions. By actively employing the services of several thousand testers, we
    can help the Team to ferret out bugs, hardware design peculiarities, etc. Once
    this is done, we can get on with porting application software and even (gasp!)
    using the system...


    # Come Help!


    If you are interested in getting involved in the porting effort, visit the MkLinux
    Web site. It has an area devoted to projects that are currently being done, as
    well as projects that have not yet been taken on.


    If a project sounds interesting to you, contact the appropriate parties, telling
    them of your background, interests, etc. If there seems to be a match, you will
    be given a task to perform. A good job and your name will go up in lights. Fail,
    and you will languish in well-deserved obscurity (-).


    Seriously, there is an immense amount of room for interested programmers (both
    kernel and application) to help make MkLinux a better system. Many kinds of drivers
    are needed, hundreds of application packages need to be ported, and a zillion
    useful HOWTOs have yet to be written. Come help!


    # Hardware Information


    The next chapters contain information on computer hardware, with particular emphasis
    on Power Macintosh systems. Much of this material was adapted from Apple documentation,
    including the Inside Macintosh and Reference Library (Developer CD Series) CD-ROMs.


    For the original versions of these documents, see the PTF Reference disc and /
    the Apple publications themselves. Please note, however, that the original versions
    contain a large amount of Mac OS-specific information and that you will need to
    search carefully (as we did) to find the nuggets of hardware-specific information.'
