  md: 'If you have rebooted the system (under both Mac OS and MkLinux, in case only
    one of them is confused) and still cannot get the drive to open, you should have
    your system inspected by a qualified technician.


    # Emergency measures


    If you need to retrieve a disc from a CD-ROM drive that will not open, you may
    wish to try the following trick (at your own risk!):


    +   - Unwind and straighten a little more than 2” of a wire paper clip.


    +   - Slide the straightened end into the small hole just to the left of the eject
    button.


    +   - Hunt around, pressing the wire gently against obstructions. With a bit of
    patience and luck, you should encounter a mechanical release that reacts to pressure
    from the end of the paper clip. Press on this until the tray has come out far
    enough to be grasped by your hand. Then, (very gently!) pull the drawer out until
    it stops.


    +   - Remove the disc, then press firmly on the eject button. If you are lucky,
    the tray will slide back into the unit, indicating that the drive may once again
    be working normally. If not, it''s time to call in the aforementioned technician.


    +   - If the tray now closes on command, a few open/close cycles might be in order,
    to make sure the problem has been resolved.


    # Floppy Disk Drive


    Apple''s floppy disk drive uses an industry-standard 3.5” floppy disk, but it
    is capable of reading and writing in a distinctly non-standard manner. For compatibility
    with **PC floppy disks**, the Apple drive handles DOS-compatible **Modified Frequency
    Modulation (MFM)** format as well as Apple’s **Group Code Recording (GCR)** format.


    As a MkLinux user, you will probably need to worry about the fine points of these
    recording formats. Just be aware that there are two kinds of disks around, and
    they may be physically identical, but act differently.


    On most floppy (or, for matter, hard) disks, there are several levels of data
    formatting that must be in agreement before the disk can be read:'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'Partitioning. Disks that contain file systems commonly have a label, or partition
    map, that tells the operating system which disk blocks are used for what purpose.
    This labelling is generally unique to particular families of operating systems.


    Note: MkLinux currently uses Mac OS-style partitioning for its hard disks. The
    Intel-based Linux system, in contrast, uses a DOS-based scheme. The Apple MkLinux
    Team is working on this problem; watch the web site (www.mklinux.apple.com) for
    future developments.


    File System. Each file system (e.g., EXT2, HFS) has its own unique way of encoding
    file names, offset information, etc. In addition, file systems from different
    architectures (e.g., Intel and PowerPC Linux) may be written with incompatible
    byte ordering. See the installation documentation (on the Apple MkLinux disc)
    for current information.


    In addition, under Mac OS, a file has multiple (e.g., data and resource) forks.
    In other, operating systems will not know how to interpret, let alone create,
    resource fork information.


    +   Line Termination. Mac OS terminates lines with Carriage Returns (octal 15),
    UNIX uses Line Feeds (octal 12), and MS-DOS uses a Carriage Return / Line Feed
    sequence. You may need to change the line termination on a file before you can
    use it on a different machine.


    To use the built-in floppy drive, simply insert the disk into the drive''s access
    slot. Make sure the metal slide goes in first and that the opening for the disk''s
    hub is on the bottom of the disk. If you intend to write on the disk, make sure
    that the write lock slider (on the upper-right corner of the disk) has slid downward
    completely, obscuring the hole.


    # Ejecting a floppy disk


    To eject a floppy disk, use the appropriate eject system command. (On MkLinux,
    this should be the eject command; see the online manual pages for details.) If
    the disk does not eject, there are two likely problems:


    +   The operating syetem is not responding to the eject command.


    If you are using Mac OS, this is normal behavior. Mac OS expects you to eject
    floppy disks by dragging their icons to the Trash. If you are using'
