  md: '# Chapter 12: Controls And Devices


    On some Apple monitors, the above controls are adjusted by software (e.g., a Mac
    OS Control Panel). This functionality may not be present in MkLinux; if necessary,
    reboot into Mac OS to perform the needed adjustments.


    # Mouse


    The mouse is connected to the computer by means of the Apple Desktop Bus (ADB).
    The standard Apple mouse, designed for use with Mac OS, has only one button. This
    is a nuisance under MkLinux, however, because the Windows System expects mice
    to have (at least) three buttons. For convenience, Option-2 and -3 are interpreted
    as mouse buttons 2 and 3.


    Fortunately, now several multi-button mice, trackballs, and other pick devices
    are available for ADB. In general, MkLinux supports all multi-button pick devices
    that conform to Apple’s multi-button mouse protocol. For the latest information
    on supported pick devices, see the MkLinux Web site.


    # Power Switch


    The power switch is used to control the supply of AC power to the computer. It
    should *not*, in normal circumstances, be used to shut down the computer. (The
    OS needs to put things away and generally tidy up!) So, shut down the system by
    means of the appropriate operating system command.


    It is quite useful, however, to have a switched power strip dedicated to your
    entire computer system. Being able to power down all of your peripherals at a
    single stroke is very convenient and tends to reduce errors. More critically,
    it gives you a single switch to flip something in your system starts to smoke!


    # Power-on Light


    The power-on light indicates that the computer is receiving AC power, that the
    power switch is turned on, and that the appropriate line on the ADB has been momentarily
    grounded (typically by the power key on the keyboard).


    # Reset Button


    The reset button sends a hardware reset signal to the PowerPC CPU. The interpretation
    of this signal is controlled by hardware; regardless of the operating system or
    other software being run, the computer will reboot.'
