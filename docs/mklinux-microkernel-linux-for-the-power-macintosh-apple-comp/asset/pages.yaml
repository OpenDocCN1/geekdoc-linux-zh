    # And Prospects


    The current version (DR3) supports most Power Macintosh systems, including most
    Power Macintosh systems, many PowerPC-based Performas, and some PowerBooks. Apple
    continues to port the MkLinux to new systems as they emerge, as well as filling
    in some of the empty spots in the line-up.


    +   Apple''s MkLinux team has taken on the responsibility for this effort. With
    members of The Open Group Research Institute, they are porting the Mach kernel
    to a wide range of Power Macintosh systems, adding support for common-devices,
    and generally solving a large number of low-level technical problems.


    The MkLinux Team is also looking at areas, such as ease of use and hardware-support,
    where MkLinux can take advantage of traditional Apple and Macintosh strengths.
    The team''s access to internal Apple information is of course very valuable to
    these sorts of efforts.


    With the advent of MacOS X, the Mach microkernel has become of greatly heightened
    interest to Apple. MkLinux has served Apple well as an experimental Mach-based
    platform. As Mac OS X develops, we may see it return-ing the favor, in terms of
    device drivers, microkernel enhancements, etc.'
