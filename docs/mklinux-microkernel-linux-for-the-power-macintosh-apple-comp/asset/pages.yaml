  md: '# # Chapter 7:


    +   - Preparatory Steps

    - Building The Microkernel

    - Modifying The MkLinux Server


    # # Building The System


    Although the name of this chapter follows conventional UNIX practice, which may
    be misleading to the unwary. A "system build" in UNIX parlance is not the creation
    of binaries for the entire operating system, let alone the placement of these
    and other files into their designated places in the file system.


    Rather, it is the creation of the operating system kernel, a low-level program
    which is responsible for managing low-level system resources such as memory use
    and for making these resources available to processes, via system calls.


    In MkLinux, even these two functions are separated. The Mach microkernel is responsible
    for managing low-level system resources such as memory use and processor time,
    as well as device and inter-process communication.


    Higher-level functions (e.g., file systems, networking) are provided by server
    tasks, whose binary files generally reside in /mach_servers:


    +   - default_pager Swap manager for virtual memory

    - mach_init Used by vmlinux to launch first MkLinux process (/etc/init, PID 1)

    - mach_perf Performance test suite, used for testing Mach microkernel (independently
    of any other tasks)

    - vmlinux MkLinux "single server",


    It is very unlikely that you will need to modify any of the first three programs.
    If you need to build one of these, the last part of the section on Building the
    Microkernel.'
