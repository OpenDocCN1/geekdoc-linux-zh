  md: '# Backing Up And Restoring Files


    There are several reasons for doing backups, but the essential reason is risk
    avoidance. If you have adequate backups, few problems can do serious harm to your
    data. If you do not, almost anything can cause you serious grief.


    Here is a sampling of the risks your data faces:


    +   * Human error – MkLinux is quite willing to let users damage or delete their
    own files. More files are damaged by slipping fingers than by any other cause.
    And, of course, the root account can remove anything on the system.

    * Software problems – If a data structure gets damaged, MkLinux may get confused
    and lose one or more files. Alternatively, program could crash, damaging its working
    files.

    * Hardware problems – Hard drives sometimes start getting errors; less frequently,
    they jam and start smoking.

    * Environmental problems – Mother nature can cause real problems for your data.
    How well are you prepared for an earthquake, fire, flood, wind storm, or other
    natural disaster?

    * Intentional damage – Arson is always a possibility, as are theft and malicious
    tampering. Physical security reduces these threats, but can not entirely eliminate
    them.


    It is quite possible to do complete system backups on a daily basis. It is a lot
    of work, however, and is probably inappropriate for most MkLinux systems. We recommend
    a mixed backup strategy, which should meet your needs at a lower cost (and far
    less effort!) than a brute-force approach:


    +   * Full backups – Every so often, you should make a full backup of your system.
    This ensures that you don''t overlook something that may later turn out to be
    critically important.

    * Partial backups – By selecting important parts of your system for backup, you
    can reduce the amount of work involved. How many copies of the /usr partition
    do you really need?'
