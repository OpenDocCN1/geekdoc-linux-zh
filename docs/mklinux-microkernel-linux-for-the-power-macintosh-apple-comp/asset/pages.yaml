  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    The first two MkLinux Developer Releases were fairly complete, in terms of the
    base operating system and command set, but were still lacking in a few areas.
    As noted above, these versions were based on Linux 1.2.13, a some-dated version
    of the Linux server. Linux 2.0 support has recently been added, however (officially
    as of the December 1996 update). The MkLinux kernel changes have been offered
    to Linux Torvalds for inclusion in future revisions of Linux; we hope they will
    be incorporated soon.


    From the beginning, MkLinux has had full SCSI support, including the ability to
    mount (and eventually boot) removable disks such as Iomega''s It supports a wide
    range of monitors connected to the motherboard video or the HPV and A/V cards.
    It includes serial support for DMA and modem control, plus support for SLIP and
    PPP connections, as well as Ethernet. The X11R6 implementation supports a wide
    range of multiple-button pointing devices, as long as they conform to Apple''s
    ADB protocol.


    Several things are still missing, to sure. Both Audio and Floppy support are still
    in development. Serial support does not extend to printing. At this time, multiple
    monitors are not supported; in fact, no NuBus or PCI cards are supported. Shared
    libraries are almost ready; they should be available in Developer Release 3.


    To the dismay of early adopters, MkLinux initially lacked support for most current
    Power Macintosh models. DR1 and (as shipped) DR2 supported only the NuBus, PowerPC
    601-based systems (Power Macintosh 6100, 7100, 8100 series, Power Computing 100
    and 120 clones). The Apple products were discontinued shortly before MkLinux was
    announced, making it impossible for users to buy a new system "MkLinux".


    Following the release of DR1, however, the AppleLinux Team posted a survey, asking
    the MkLinux user (and prospective user) community to help choose the next set
    of machines to be ported. Not surprisingly, the overwhelmingly popular choice
    was the latest and fastest family of machines – the PCI-bus, PowerPC 604-based
    systems (Power Macintosh 7200, 7500, 7600, 8200, 8500, 9500, and clones).


    Things always take longer than hoped; DR2 was released in September, still without
    PCI support. We promised support by Christmas, however, and managed to keep our
    promise. The DR2 update in mid-December contained (beta) support for the aforementioned
    PCI-based machines, rolled in'
  merge: -1
