- img_proc: true
  md: '# Chapter 6: Upgrades And Enhancements


    +   - CD-ROM – Prime Time Freeware publishes MkLinux snapshots as of its CD-ROM
    “MkLinux Snapshot” distributions.


    As each snapshot is released, it becomes the new baseline upon which all future
    updates and enhancements will be made. Support, in the form of bug fixes and enhancements,
    is typically reduced (or nonexistent) for previous snapshots. Bug reports may
    still be accepted for recent snapshots, but reports receive far more attention
    if the problem has been reproduced under the current version of MkLinux.


    Each snapshot has a release designation, such as DR1, DR2, or 1.0. This gives
    the MkLinux community a point of reference to use in discussing issues, porting
    applications, filing bug reports, or sharing ideas on the various mailing lists
    and similar forums.


    # Updates


    Because MkLinux is constantly evolving, a given snapshot isn’t completely current
    for very long. Big fixes, enhancements, and updates are posted frequently (typically,
    every few weeks), replacing or augmenting portions of the current snapshot.


    To keep your MkLinux system up to date, try to download and apply these updates
    on a regular basis. More critically, be sure you’re updating the latest snapshot!
    Each set of updates is expected to be applied to the most recent snapshot, sometimes
    in a particular order.


    Because updates happen so frequently, PTF does not include them on our CD-ROMs.
    Even if we tried to do so, it is likely a new update would be posted before the
    discs were ready for shipping! In particular, the snapshot CD-ROM associated with
    this Reference Release contains only the most current snapshot at the time of
    this writing.


    # RPM Binary Archives


    The MkLinux Installer loads your MkLinux system disk drive, by default, with the
    MkLinux operating system (including the Mach kernel and Linux Server) and a basic
    set of tools and applications. However, the distribution also contains additional
    packages which you may (or not!) find useful and interesting.'
