- img_proc: true
  md: '# Chapter 2: Preparation


    The two most important partitions are Swap and Root – you cannot run MkLinux without
    these. The Swap partition is used as backing store for the MkLinux virtual memory
    system. The Root partition holds the core elements of the Linux system: utilities,
    drivers, etc.


    It is common to create a Us partition for the more dynamic portions of the operating
    system, leaving relatively static items on the root partition. Local applications
    should go into the /usr/local directory. This allows them to be backed up for
    safety, updates, etc.


    The swap partition must be at least 8 MB and usually will be at least 32 MB. It
    can be no larger than 128 MB, but additional swap partitions can be used. The
    Root partition normally should be at least 100 MB; Us should be at least 350 MB.
    If you combine these into a single Root&Us partition, set the size to at least
    400 MB.


    Other partitions can/may exist but we''re not going to cover those in any detail
    here in any case note that MkLinux currently supports fifteen partitions per disk.
    These additional partitions may be used for personal(user) files, source code
    building, or other desired uses.


    If you have trouble setting up your partitions, review the documentation for your
    partitioning utility. If you are still having trouble, look for help on our web
    site. Finally, the various MkLinux mailing lists (e.g., mklinux-setup :-) stand
    ready to help you get things running.


    Creating partitions in preparation for installing MkLinux will require your becoming
    intimately familiar with a disk drive setup utility. You may want to use HD SC
    Setup, which came with your Macintosh (and we''ve included on the Apple CD-ROM)
    or Drive Setup (which ships with later Power Macintosh systems and Mac OS System
    Software releases).


    No matter what utility you use, you will need to go into the partition setup portion
    of the utility. You will also, in all probability, need to use the more advanced
    (e.g., custom) modes of partitioning. The Apple MkLinux Team hopes to simplify
    this process in a future release of MkLinux.


    The first step in partitioning is making sure there is enough free space available
    on the drive. This does not mean free space as listed in the Finder window. Instead,
    it refers to space that is not assigned for any filesystem such as HFS. You may
    have to shrink or delete existing Mac OS file'
