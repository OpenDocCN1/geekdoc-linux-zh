    # Drive Setup


    Drive Setup is the standard partitioning utility that is shipped with Mac OS.

    It can create multiple Mac OS partitions on your drive, leave free partition

    space (e.g., for use by pdisk), deposit the latest Apple disk drivers onto the

    disk, and create actual Mac OS standard and extended volumes in created

    partitions. It can partition (Apple-branded) SCSI and IDE drives.


    Drive Setup cannot create the A/-UX type partitions by MkLinux. One

    common method is to use Drive Setup to create free partition space on your

    drive, then use pdisk to create MkLinux partitions in the free space. Alterna-

    tively, you can have Drive Setup create extra Mac OS partitions, then use

    pdisk to change them to MkLinux partitions before use.'
