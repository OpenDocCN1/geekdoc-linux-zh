  md: '# xxii MkLinux: Microkernel Linux for the Power Macintosh


    ting and desirable additions. We''re happy to count these developers as members
    of the MkLinux team.


    Last, but not least, our thanks to all the MkLinux users who bravely download
    and install each new update as it is posted. In a small project such as MkLinux,
    we don''t have access to Apple''s dedicated software testing organizations. We''ve
    tried to test and debug our Developer Releases and updates before they are released,
    but we rely on our community to stress test our releases in a wide range of network
    environments and hardware configurations. We''ve been most impressed by the helpful
    comments, willingness to get involved, cogent bug reports, and sensible Email
    we''ve received from all of these folks.


    # You Can Join Our Team!


    The MkLinux team currently numbers over 15 registered developers, some 4000 registered
    users, and 5000 mailing list subscribers. (We admit that some of the mailing list
    subscribers are also registered users :-) If you haven''t joined our team, we''d
    be happy to welcome you.


    Visit our web site (www.mklinux.apple.com) and look around, then join some email
    lists. We strongly recommend that you join mklinux-announce and mklinux-answers;
    these are moderated lists (low in volume, high in relevant information) which
    will keep you abreast of important events in the MkLinux community. The remaining
