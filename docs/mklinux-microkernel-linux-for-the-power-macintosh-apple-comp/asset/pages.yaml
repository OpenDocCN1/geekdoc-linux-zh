    # Priority Inversion


    Kernel pre-emption created a new problem - a type of scheduling anomaly sometimes
    referred to as priority inversion [Vaha]. Priority inversions can occur when a
    high priority thread became dependent or blocked by a lower priority, preempted
    thread. We designed a straightforward priority-boosting protocol inside the kernel
    with priority inversions. Priority boosting propagates across dependencies, not
    just locks. If a thread blocks another thread, then the thread controlling the
    dependency is boosted. If the boosted thread is blocked by another thread, the
    boosting propagates down the dependency chain. A thread remains boosted until
    it releases its last dependency.


    This algorithm is not perfect in that some threads remain boosted longer than
    absolutely necessary. But it is very simple and inexpensive.'
