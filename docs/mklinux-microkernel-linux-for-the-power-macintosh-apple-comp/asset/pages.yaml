  md: '# Commands And Shells


    As you have no doubt noticed, MkLinux requires users to enter **commands** (e.g.,
    adduser, exit, passwd, su) in order to request desired actions. We think of these
    commands as verbs, asking the system to perform one or more desired actions. **Command
    lines** frequently include **arguments** (nouns) and/or **flags** (adverbs), which
    specify and/or modify the requested behavior.


    MkLinux commands may be built into the **shell** (command line interpreter). Alternatively,
    they may be pre-defined macro strings (also known as **aliases** or **shell functions**)
    or names of application programs.


    **Note:** Mac OS and MkLinux both have aliases, but they are quite different in
    nature. Specifically, a Mac OS alias is approximately what MkLinux would call
    a **symbolic link**. More generally, be careful not to confuse Mac OS and MkLinux
    jargon!


    Viewed from a distance, all shells are pretty equivalent. They all support a common
    set of **built-in commands** and they are all able to invoke application programs.
    The differences between shells lie in their interactive and programming features.


    **Note:** If you are familiar with other shells (e.g., **csh** or **ksh**), you
    may find **bash** (the default MkLinux shell) a little peculiar. Give **bash**
    a chance; it combines the programming power of **ksh** with the interactive features
    of **tsh**.


    # Trying Out Some Commands


    ```

    [linux@penguin linux]$ pwd

    /home/linux

    ```


    The **pwd** command allows MkLinux to Print (to the screen) the Working (current)
    Directory. The prompt lists **linux** as your current directory, pwd reveals the
    **full path** to be **/home/linux**. This is the complete name of your home directory,
    loosely equivalent to a Mac OS name like **penguin:home/linux.


    ```

    [linux@penguin]$ cd /\n[linux@penguin /]$ ls

    bin home mach_servers root usr

    dev lib mnt sbin var

    ```'
