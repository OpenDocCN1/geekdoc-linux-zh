- img_proc: true
  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    DR2.1, are based on Linux 2.0 (specifically, 2.0.28). This kernel has many new
    features, with large improvements in performance and stability.


    Operating system developers will be pleased to know that 2.0-based MkLinux allows
    more than one (e.g., Linux or Hurd) to run at the same time. This is extremely
    convenient to anyone who wishes to debug a new server.


    With this capability, you can start the debug version alongside of the production
    version. If (when :-) the debug version goes down in flames, the system just continues
    to work, saving you a great deal of time and trouble. Not only that, you can simply
    "fire up" gdb and debug the second server as you would any ordinary application.


    # Linux Goodies


    Operating system elitists (read, some kernel hackers) may disagree, but the rest
    of us know that a kernel, however wonderful, isn''t enough. We need more: shells,
    utilities, a window system, and all those other toys we''ve grown to love. Don''t
    worry; MkLinux has everything you''ve come to love in Linux.


    Based largely on the RedHat Linux distribution, and making heavy use of the RedHat
    Package Manager (RPM), the default MkLinux installation includes a full set of
    user commands, as well as the X11R6 Window system. Many other commands are available
    in RPM archives, either on the Apple MkLinux CD-ROM or from FTP at ftp.mklinux.com.


    In fact, a complete MkLinux system is anything but small or spartan. Even the
    Developer Releases are quite substantial. (The Installation Guide recommends 16
    MB of RAM and at least 500 MB of dedicated disk space.)


    # So, Why Linux?


    Need you ask? Linux is the overwhelming favorite among users of free UNIX clones.
    MkLinux provides UNIX features as true multitasking, virtual memory, shared libraries,
    demand loading, TCP/IP networking, and many other advanced features. Versions
    of Linux have been ported to a wide variety of platforms, including other PowerPC-based
    computers, making the Power Macintosh port that much easier.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Foreword


    The Linux community is large, growing, active, and involved. This community promotes
    development and exchange of software and ideas, making it an excellent environment
    for a new OS product. And, last but not least, Linux is covered by the GNU General
    Public License, ensuring that Apple''s contributions will not be used in some
    other vendor''s proprietary product.


    # GNU... And Apple?!


    We have to admit, Apple and the GNU Project have had their differences in the
    past. Now can we suggest that Apple has given up on the idea of proprietary software.
    So, it comes as a surprise to many (and a shock to some!) that Apple is only funding
    a project to develop MkLinux and port it to the entire family of Macintosh systems.


    Not only that; except for the chance to sell more Macintosh systems (a strong
    inducement indeed -). Apple is not making any profit from the MkLinux port. Distribution
    and sales of the Apple Linux disc, as well as this product, are being handled
    by Prime Time Freeware.


    In full compliance with the best freeware etiquette, Apple is releasing the source
    code for all of their Linux and Mach changes under the appropriate (GPL, OS, etc.)
    licenses. The entire distribution, in fact, is available via anonymous FTP. Third
    parties are encouraged to mirror the site, create their own CD-ROM distributions,
    or share the software with their friends. This is free software at its finest.


    # Why Power Macintosh?


    You may be asking yourself: “Why would I want to run Linux on Power Macintosh?”
    After all, the Linux community is overwhelmingly oriented toward Intel hardware.
    Why change?


    For one thing, it’s good for Apple and Apple enthusiasts. As noted above, Linux
    opens the door to a new Macintosh market. Many researchers and scientists, who
    might find the Macintosh a useful tool, cannot justify the purchase of a second
    computer system. If their shop runs UNIX, a Macintosh didn’t fit in – until now!


    University laboratories and dorm rooms are another target. With the availability
    of MkLinux, users can benefit from the best of both worlds: using Linux for research
    and batch data processing and Mac OS for graphi'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# xviii MkLinux: Microkernel Linux for the Power Macintosh


    cal applications, desktop publishing, and much more. So, Apple may sell the machine,
    but you get the fun. Think of all those cool Mac OS applications, just waiting
    to be explored, not to mention the joy of using the Power Mac’s multimedia capabilities
    under (Mk)Linux!


    In keeping with Apple’s traditions, the highly integrated Power Macintosh hardware
    easily eases Linux system administration. Power Macs are delivered as complete
    systems. Thus, a Power Macintosh can normally run MkLinux “straight out of the
    box”, without the addition of cards, chips, and other components. Because Power
    Macs use intelligent busses such as NuBus and PCI, the OS can deal with hardware
    configuration concerns such as DMA addressing and interrupt vectors.


    In fact, as we tell folks at trade: “Once you’ve installed it, MkLinux is really
    just Linux. You’ll have to give up a few things, of course – DMA vectors, IRQ
    settings, jumpers, incompatible BIOS code – basically, it’s just Linux…”


    # What About Intel?


    By porting MkLinux to the Power Macintosh, Apple opens the doors for a new market,
    but that’s only half of the story. The Linux community’s Intel orientation, Apple
    has also made sure that an Intel port of MkLinux is available. In fact, the Linux/Intel
    port was developed first and was completely funded by Apple. The Intel port is
    tracking the Power Macintosh version; although you may not see it prominently
    displayed on the Apple Web pages, it’s still quite alive.


    By porting Linux to the Intel platform, Apple also opens the door for Intel and
    Power users to try each other’s systems, trade software and ideas, and generally
    enlarge the Linux world. For instance, we expect some valuable and interesting
    interchange in PCI driver software and multimedia applications.


    # Nitty Gritty Details


    OK, you’re almost convinced. You understand why Apple is funding a Linux project,
    and you’ve begun to believe in Linux on the Power Macintosh. But it’s still called
    a Developer Release. How complete is MkLinux? Are all Power Macintoshes supported?
    What’s there, and perhaps more impor-'
  merge: -1
