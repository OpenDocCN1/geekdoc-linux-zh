    channel consisting of a (bounded length) queue that holds messages. A message
    is a collection of data, memory regions and port rights. A port right is a name
    by which a task holds the right names the port. A task can manipulate a port only
    if it holds the appropriate port rights. Only one task can hold the receive right
    for a port. This one task is allowed to receive (read) messages from the port
    queue. Multiple tasks can hold send rights to the port that allow them to send
    (write) messages into the queue. A task communicates with another task by building
    a data structure that contains a set of data elements, and then performing a message-send
    operation on a port for which it sends rights. Some later time, the task with
    rights to that port will perform a message-receive operation. Note that this message
    transfer is an asynchronous operation. The message is logically copied into the
    receiving task (possibly with copy-on-write optimizations). Multiple threads within
    the receiving task can be attempting to receive messages from a given port, but
    only one thread will receive any given message.


