    # Task To Task Communication


    Communication between tasks is a very important element of the Mach philosophy.
    Mach believes in a client/server system architecture in which tasks (clients)
    access services by making requests of other tasks (servers) via messages sent
    over a communication channel. Since the Mach kernel provides very few services
    of its own (in particular, no file service), a Mach task will need to communicate
