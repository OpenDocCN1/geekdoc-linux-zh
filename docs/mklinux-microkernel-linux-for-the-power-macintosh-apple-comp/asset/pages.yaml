    # Pentium and PowerPC upgrades


    Many manufacturers of 80486-based personal computers include a socket on their
    logic boards to accommodate a future Pentium upgrade, called Pentium OverDrive.
    The high thermal output of Pentium, and the reduced performance a user can expect
    when installing a 66-megahertz, 64-bit processor on a 33-megahertz board designed
    for a 32-bit processor, has made it necessary for Intel to redefine the socket
    specifications for the processor, possibly delaying the availability of upgrades
    for 80486-based systems (PC Week, September 13, 1993, page 22).


    Apple has announced that low-cost PowerPC logic board upgrades (starting under
    $1,000) will be available for current Macintosh computers, and third-party manufacturers
    are developing PowerPC upgrades for other Macintosh models. Because the PowerPC
    601 chip has a thermal output not significantly higher than current high-end 68040
    processors, heat dissipation should not be an issue.


