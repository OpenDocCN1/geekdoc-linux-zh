    # IDE


    IDE (Integrated Drive Electronics) is a very popular disk interface in the PC
    area. It is used by Macintosh PowerBooks for internal and plug-in disk drives.
    IDE is also found on some desktop systems or can be added by means of interface
    cards.


    The principle benefit of IDE is cost; small IDE disks tend to be noticeably cheaper
    than their SCSI equivalents. On the other hand, the cost of larger IDE and SCSI
    drives is essentially the same. The drawbacks of IDE are:


    +   * It is not suitable for external devices.

    * It only handles two devices per interface.

    * It only handles disks disks (and things that act like them).

    * It involves disk drivers in low-level issues like cylinders, heads, sectors,
    and tracks.


    These limitations make IDE a poor choice for Power Macintosh systems. Its cost
    advantages are negligible on the larger drives used with either Mac OS or MkLinux.
    Consequently, we recommend that you use SCSI-based disk drives, where possible.


    # LocalTalk


    LocalTalk is a low-performance (~250 Kbps) version of AppleTalk, transmitted by
    means of an Apple serial port. for small, low-performance LANs, it is largely
    a historical relic: most modern Apple LANs are based on EtherTalk, which uses
    Ethernet as the transmission method.


