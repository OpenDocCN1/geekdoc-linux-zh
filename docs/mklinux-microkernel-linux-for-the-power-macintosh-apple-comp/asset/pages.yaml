    # Space Considerations


    In selecting predefined partitions or creating custom partitions, remember to
    include enough space for the basic MkLinux installation. If your root and usr
    filesystems are combined, we recommend 400 MB for the Root&Usr filesystem. If
    they are not combined, we recommend at least 100 MB for the Root filesystem and
    350 MB for Usr.


    In determining the size of your partitions, note that filesystems require a certain
    amount of overhead or free space. If you are creating any “Free UNIX” partitions,
    to be used for user data, be sure to include this overhead in your calculations.


    The free space is used by the operating system to ensure efficient access to the
    files in the file system. The recommended free space is the minimum sizes of the
    Root and Usr filesystems includes this overhead.


    Be sure to create a Swap partition. MkLinux uses space on a hard disk to increase
    the computer''s effective memory (RAM) capacity. This space is used to exchange,
    swap, data in the computer''s memory with copies being kept temporarily on the
    hard disk.


    The swap space must be at least 16 MB; 32 MB is about right for a 16 MB system.
    To take advantage of the MkLinux virtual memory system, you should allocate 1-3
    MB of swap space for each megabyte of RAM. Thus, a system'
