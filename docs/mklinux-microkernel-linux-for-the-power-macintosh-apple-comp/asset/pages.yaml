  md: '# Foreword


    xxi


    The 2.0 Linux server, and was a major hit with our long-waiting and patient

    MkLinux fans.


    With PCI support well underway, the team can concentrate on supporting

    t remaining systems (primarily Performas and Powerbooks) and begin to

    think about the upcoming CHRP (Common Hardware Reference Platform)

    systems. The only difficult decision will be which to work on.


    Unfortunately, although many machines seem similar on the surface (and

    Apple''s System Software teams do an excellent job at making them look the

    same!), they''re all a little bit different inside. So, it may take a

    while... the team is committed to making MkLinux avail-

    able on all of the Power Macintosh platforms in time.


    # The History And The Team


    MkLinux was started as the dream of Brett Halle, then manager of Apple''s

    kernel team within the Modern OS department. With the blessings of

    Apple vice president Ike Nassi, began sponsoring a handful of OSF

    Research Institute employees to port the Mach 3.0 microkernel, and Linux,

    to the first Power Macintosh platform. Several months into the project, the

    first Apple engineer, Michael Burg, came on board to work part-time on the

    MkLinux effort.


    +   * Shortly before the DR1 release, Apple decided that the project was

    more a little backing, and Apple''s Leveraged Technologies Group is now up to
    five (!)

    dicated team. employees (with two additional engineers at the OSF Research Institute)

    hopes for reasonable growth in the future.


    Unfortunately for our anxious and growing body of MkLinux fans, this is

    till very small team. While we concentrate on pouring the next series of

    Power Macintoshes, keeping our Web pages and FTP site up to date, and

    managing the whole project, many interesting developments are “resource-limited”.


    Fortunately, this is Linux, where “everything is done by someone else.

    The MkLinux Developer''s Corner is a small but intrepid band of MkLinux pro-\grammers
    who are willing to take on (and complete!) needed projects. Our

    Developers Corner has provided us with the X116 port, netatalk, GNU-\step for
    MkLinux, HFS filesystem utilities, and a number of other interes-'
  merge: -1
