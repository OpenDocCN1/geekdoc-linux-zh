    # Some History


    The following quote, by Dennis Ritchie and Ken Thompson''s landmark paper, the
    UNIX Time-Sharing System, rather understates the current situation. On the other
    hand, knowing that it was written in 1978, we can appreciate its prescience and
    its charming modesty:


    > UNIX is a general-purpose, multi-user, interactive operating system ... It offers
    a number of features seldom found in larger computer systems, including:


    (i) A hierarchical file system incorporating demountable volumes,

    (ii) Compatible file, device, and inter-process I/O,

    (iii) The ability to initiate asynchronous processes,

    (iv) System command language selectable on a per-user basis,

    (v) Over 100 subsystems including a dozen languages,

    (vi) High degree of portability.


    Bell Laboratories’ withdrawal from the Multics project left Ken Thompson and Dennis
    Ritchie, among others, without access to a time-sharing system. Fortunately for
    all of us, Ken and Dennis had the energy, initiative, and creativity to do something
    about it.


    Equally fortunately, their managers and colleagues assisted and supported their
    efforts. This early crew of UNIX users established a tone and a way of doing things
    that continues in the better parts of UNIX (and Linux) to this'
