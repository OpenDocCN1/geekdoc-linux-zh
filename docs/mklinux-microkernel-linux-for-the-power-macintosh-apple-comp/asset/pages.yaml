    - Compatibility with existing software environments (BSD).

    - Portability.


    In versions 2.5 and earlier, Mach was combined with Unix to deliver a complete
    operating environment. Version 3, however, provides Mach as a pure kernel with
    no other operating system functionality. Particular operating environments are
    provided by means of user space servers. To date, servers have been prototyped
    for BSD, SVR4, Sprite, OSF/1, and DOS.


    Mach as a foundation technology for diverse operating environments subscribes
    to the philosophy of:


    +   - A simple, extensible communication kernel.

    - An object basis with communication channels as object references.

    - A client/server programming model, using synchronous and asynchronous inter-process
    communication.

    - User mode tasks performing many traditional operating system functions (e.g.
    file system, network access).


    The fundamental idea is that of the Mach project to move more and more functionality
    out of the kernel, until everything is done by user mode tasks communicating via
    the kernel. Of course, even in the extreme, the kernel must provide other support
    besides task to task communication, in particular:


    +   - Management of points of control (*threads*).

    - Resource assignment (*tasks*).

    - Support of address spaces for tasks.

    - Management of physical resources (physical memory, processors, device channels,
    clocks).'
