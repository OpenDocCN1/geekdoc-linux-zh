    # Setting The root Password


    Even if your computer isn''t on a network, it is still vulnerable to straying
    fingers. If it''s on a network, the fingers could stray onto your system anywhere
    in the world. For safety, therefore, set the root password:


    ```

    [root@penguin /root]# passwd

    Changing password for root

    New password (? for help): [...silent...]

    New password (again): [...silent...]

    Password changed for root

    root@penguin /root]#

    ```


    The password you enter is not echoed to the screen. In fact, unlike Mac OS practice,
    Linux doesn''t print bullets to show how many characters you have typed. This
    might seem a bit awkward, but it is a valuable precaution. Someone might be looking
    over your shoulder at the screen or even when you''re not around! Why give them
    any clues (including the number of characters) about your password?


    When picking a password, use a (six or more) character string to remember. Avoid
    passwords that can be guessed easily (e.g., names, birthdays, etc.) or found in
    a dictionary. Some reasonable strategies are:


    +   - including numbers of UPPER and lower-case alphabetic characters


    +   - including numbers and special characters


    +   - combining words


    Thus, you might create a password such as nonegood, lm_D_Bo$$$, or Its4sure. Of
    course, be sure not to use one of these examples (-).'
