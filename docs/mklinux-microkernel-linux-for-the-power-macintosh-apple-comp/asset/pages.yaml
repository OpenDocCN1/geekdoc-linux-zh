  md: '# 238 MkLinux: Microkernel Linux for the Power Macintosh


    +   - PowerPC is a high-performance RISC architecture that is poised for future
    growth.

    - The PowerPC 601 chip is less expensive to manufacture than Pentium.

    - The PowerPC 601 outperforms Pentium by a wide margin in floating-point tasks,
    and has comparable performance for integer tasks.

    - PowerPC offers the benefits of being provided by multiple sources – giving it
    the benefit of more resource dollars, lower manufacturing costs, faster product
    development, and advanced process technologies.


    Apple, IBM and Motorola have invested in the future of RISC technology to develop
    and market PowerPC. This commitment is based on the superiority of the PowerPC
    processor in the areas of price, time to market, multiple sourcing, and scalability
    to higher performance levels will dramatically change the personal computer industry.
    Customers cannot afford to be constrained by the outdated CISC architecture when
    newer, higher-performance, and more cost-effective solutions will be adopted by
    their competitors. PowerPC is the first RISC processor to enter the mainstream
    personal computer market, and its endorsement by these three leading-edge companies
    attest to its promise as the new standard for desktop computers.


