    # Linux Server Architecture


    # A Single Server


    Our Linux server is a **single server**, meaning that the entire Linux functionality
    resides in one Mach task. The alternative to this design is the **multi-server**
    design, where functionality is split between smaller specialized tasks communicating
    through Mach RPC.


    The multi-server design takes better advantage of the Mach architecture and allows
    one to re-use more code between different OS servers, for example a generic terminal
    server code be shared by most OS servers, for example. The drawbacks lie in the
    cost of the extra communication between the various servers. Because servers can
    call each other in random ways, complex RPC chains are created, making it hard
    to implement even some aspects of the OS functionality, like interrupting a system
    call for example. One has to implement potentially complex mechanisms to chase
    the system call through the various servers and abort it in a sensible way.


    Although we are convinced that multi-servers are the way to go to produce high-quality
    operating systems on top of Mach, this strategy was not applicable in our case
    because we started from an existing monolithic kernel and we wanted to maximize
    the code reuse ratio to make it easier to track new releases of Linux and leverage
    the Linux community effort.'
