    # Memory Management


    The Mach kernel provides the mechanisms to support large, potentially sparse virtual
    address spaces. Each task has an associated address map (maintained by the kernel)
    which controls the translation of virtual addresses in the task''s address space
    into physical addresses. As is true in virtual memory systems, the contents of
    the entire address space of any given task is most likely not completely resident
    in physical memory as a cache for the virtual address spaces of tasks. Unlike
    traditional virtual memory designs, the Mach kernel does not implement all the
    elements of this caching itself; it endeavors to allow user mode tasks to participate
    in these mechanisms.


    Unlike other resources in the Mach system, virtual memory is not referenced via
    ports. Memory can be referenced only using virtual addresses as indices into a
    particular task''s address space. The memory (and the associated address map)
    that defines a task''s address space can be partially shared with other tasks.


    A task can allocate new ranges of memory within its address space, deallocate
    them, and change protections on them. It can also specify inheritance properties
    for the ranges.


    A new task is created by specifying an existing task as a base from which to construct
    the address space for the new task. The inheritance attribute of each range of
    the memory of the existing task determines whether the new task has that range
    defined and whether that is virtually copied or shared with the existing task.


    Within Mach, most virtual copy operations for memory are actually achieved through
    copy-on-write optimizations. A copy-on-write optimization is accomplished by not
    directly copying the range, but by protected sharing. The two tasks share the
    memory to be copied, but with read-only access. When either task attempts to modify
    a portion of the range, that portion is copied at that time. This lazy evaluation
