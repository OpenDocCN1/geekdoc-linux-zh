  md: '# 40 MkLinux: Microkernel Linux for the Power Macintosh


    Although we don''t recommend writing passwords on whiteboards or miscellaneous
    pieces of paper, you should prepare some method for obtaining the root password
    in case of emergencies. Here is one effective strategy:


    +   - Write the root password on a piece of paper, fold the paper (to make opaque),
    then put it in an envelope.


    +   - Give the envelope to some person who is trustworthy, well-organized, and
    typically available during normal working hours. Alternatively, put it in a place
    with guaranteed limited access.


    +   - Allow any of a small set of authorized persons the privilege of “signing
    out” the envelope and retrieving the password. Require them to report why they
    needed the password and (specifically!) how they used it.


    +   - Set a new root password and repeat the setup procedure. Analyze the report
    to see if your administration needs need improvement.


    > Note: MkLinux will not save your password, per se. Instead, it will encrypt
    and save the encrypted form. Then, the next time you log in, it can encrypt your
    entered password and see if the result matches what it has saved. This distinction
    is very important: a MkLinux administrator cannot find out a user’s password,
    even by looking in the password file (/etc/passwd). S/he can only install a new
    password and then ask the user to change it promptly. Consequently, losing the
    root password is a real problem!


    # Setting The Time Zone


    By default, MkLinux is set to use the Pacific Time Zone. To change the time zone
    to the appropriate configuration for your location, create a symbolic link from
    /etc/localtime to the correct timezone file for your location.


    For example, to set the correct time zone for Apple Computer in Cupertino, California,
    USA, type:


    ```

    # cd /etc

    # ln -fs /usr/lib/zoneinfo/US/Pacific localtime

    ```


    To set the correct time zone for the Open Group Research Institute in Grenoble,
    France, type:


    ```

    # cd /etc

    # ln -fs /usr/lib/zoneinfo/Europe/Paris localtime

    ```'
