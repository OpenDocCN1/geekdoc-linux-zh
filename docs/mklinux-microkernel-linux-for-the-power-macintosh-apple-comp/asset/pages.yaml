- img_proc: true
  md: '# Chapter 4: Getting Started


    Many MkLinux commands also have GNU-style flags, as well. These flags are entire
    words, preceded by a pair of dashes (--). Because GNU-style flags require more
    typing (and cannot be combined for brevity) you may not wish to use them on the
    command line. Their meanings tend to be obvious on inspection, however, making
    them very helpful in shell scripts.


    The -l flag uses ls to give a very complete listing. The listing is similar to
    the Mac OS View by Name, but it also shows MkLinux characteristics such as file
    type, modes (also known as permissions), links, owner name, and group name.


    ```

    [linux@penguin]$ ls -l

    total 29

    drwxr-xr-x 2 root 1024 Aug 21 10:12 bin

    drwxr-xr-x 2 root 5120 Aug 25 21:23 dev

    ```


    Note: Using other commands (e.g., chmod), you can adjust some of these characteristics
    (e.g., modes), allowing files to be read/or written as you desire. Group access,
    for instance, can be used to let a selected set of users access a given file or
    directory. Managing files is an important part of MkLinux system administration.


    ```

    [linux@penguin] /$ cd /root

    bash:/root: Permission denied

    ```


    The command asks MkLinux to Change our Directory to /root. This is an instance
    of the use of a command-line argument (sometimes called a parameter). The argument
    tells the command what entity (file, directory, etc.) to act upon.


    As mentioned above, /root is the home directory of the root account. It is used
    for private administrative information and should not be accessible to ordinary
    users. Consequently, MkLinux denies us permission to enter /root.


    Note: The word root has two separate meanings in MkLinux. All files and directories
    in the entire file system are connected to the root directory (/ pronounced slash).
    The root account, in contrast, is the all-powerful administrative login account.


    ```

    [linux@penguin] /$ cd /tmp

    [linux@penguin] /tmp]$ touch foo

    ```'
