  md: '# Combo


    The Combo custom IC combines the functions of the SCC IC (85C30 Serial Communications
    Controller) and the SCSI controller IC (53C80). The SCC portion supports the serial
    I/O port. The SCSI portion supports an internal SCSI hard drive; it is needed
    for upgrades to older PowerBook Duo models.


    # Control


    The Control custom IC provides addressing and control for the video subsystem.


    # CSC


    The CSC (color support chip) custom IC is a display controller, providing the
    data and control interface to the LCD panel. It contains a 256-entry CLUT, RAMDAC,
    display buffer controller, and flat panel control circuitry.


    # Cuda


    The Cuda IC is a custom version of the Motorola MC68HC05 microcontroller. It provides
    several system functions, including


    +   - management of the Apple Desktop Bus (ADB)

    - management of system resets

    - maintenance of parameter RAM

    - management of the real-time clock

    - on/off control of the power supply (soft power), possibly from an external signal
    from either Apple GeoPort serial port

    - the programming interface to devices on the IIC (interintegrated circuit) bus


    The devices on the IIC bus include the AWACS sound IC, the digital video decoder
    and scaler (DESC) on the video input module, and the Cyclops IC, which is the
    controller for the remote control receiver. The computer reads and writes status
    and control information to those devices by commands to the Cuda IC.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Curio


    The Curio is a custom multipurpose I/O chip that contains a Media Access Controller
    for Ethernet (MACE), a SCSI controller, and a Serial Communications Controller
    (SCC). The SCC section of the Curio includes 8-byte FIFO buffers for both transmit
    and receive data streams. The Curio supports DMA transfers between its I/O ports
    and the computer’s main memory.


    # ECSC


    The ECSC (enhanced color support chip) is a custom Display Controller IC that
    provides the data and control interface to the LCD panel. The ECSC IC is similar
    to the CSC used in the PowerBook 520 and 540 models except that it can address
    1 MB of video RAM. The ECSC contains a 256-entry CLUT, RAMDAC, display buffer
    controller, and flat panel control circuitry.


    # Grand Central


    The Grand Central I/O system IC provides an interface between the standard Macintosh
    I/O devices and the PCI bus. The Grand Central IC performs the following functions:


    +   - support for the Cuda IC (the VIA registers)

    - central system interrupt collection

    - support for descriptor-based DMA for I/O devices

    - floppy disk interface (SWIM III)


    The Grand Central IC contains a DMA controller. It provides support for all I/O
    devices, including transfers through its internal I/O controllers as well as transfers
    through the Curio IC for other I/O devices.


    The SWIM III floppy disk controller in the Grand Central IC is an extension of
    the SWIM II design used in earlier Macintosh models. The SWIM III controller supports
