  md: '# Hard Disk Drive


    Power Macintosh hard drives get larger with each new product release. Many current
    models have drives which are a gigabyte or even larger. (We have seen third-party
    SCSI drives in excess of 20 GB!) The Apple file system format, has not grown to
    keep pace.


    A single partition, formatted for Apple’s Hierarchical File System (HFS), holds
    a maximum of 64 K files. Although this may not seem like a problem, remember that
    this sets the minimum file size on a 2 GB disk to 32 KB (2 GB /64 K). If your
    system has very large partitions and lots of small files, you are wasting a great
    deal of space.


    Consequently, you should consider splitting large hard disk drives into multiple
    partitions. Just remember to balance convenience against the desire for efficiency.
    That is, if you have a relatively small number of large files, considering using
    very large partitions, etc.


    And, given that you are reading this book, you will have to split at least one
    drive into multiple partitions. Apple supplies copies of HD SC Setup and/or Drive
    Setup as part of the MkLinux distribution, but you can use Silverlinining or some
    other partitioning tool if you desire. Just be sure to create all the partitions
    needed by MkLinux (See the Preparation chapter and online Installation Notes for
    up-to-date information.)


    > Note: If you are considering using a hard disk to transfer data between systems,
    be sure to read the format-related notes in the section on Floppy Disk, above.


    # Interrupt Button


    The Interrupt button sends a non-maskable interrupt (NMI) for the PowerPC CPU.
    The interpretation of this interrupt is controlled by software:


    +   - On Mac OS, this button typically brings up a debugger (e.g., MacBug).


    +   - On DEBUG MkLinux systems, this button starts up the kernel debugger.


    +   - On PRODUCTION MkLinux systems, this button is ignored.


    Unless you are debugging the kernel, you can safely ignore this button.'
  merge: -1
