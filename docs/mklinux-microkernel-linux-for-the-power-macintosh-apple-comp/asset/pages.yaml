    # CISC RISC microprocessor architecture


    The history of these architectures provides a foundation on which we can examine
    the pros and cons of Pentium and PowerPC.


    # Defining CISC


    CISC stands for Complex Instruction Set Computing. All of today''s personal computers
    are built on CISC microprocessors. To understand why CISC architectures rose to
    prominence in the 1970s, we need to look at the market conditions that prevailed
    then. Current CISC architectures were originally developed in the 1960s and 1970s,
    when a typical computer''s available random-access memory was both limited and
    expensive. Many of the processor design decisions made at the time were based
    on minimizing program memory requirements. One way to reduce program memory requirements
    was to simplify software as much as possible by building more complexity into
    the processor. Though increasing the complexity of the processor had a negative
    impact on processor performance, this trade-off was reasonable at the time. After
    all, it didn''t matter how fast a processor could run if there wasn''t enough
    memory left to load data and run programs.


    As the price and availability of random-access memory improved dramatically during
    the 1980s and into the 1990s, processor designers reexamined performance and complexity
    trade-offs. An architecture that made sense in the 1970s, when a computer might
    have only 16 or 32 kilobytes of memory, is not necessarily an optimal architecture
    in the 1990s. An optimal architecture is RISC, which takes advantage of the 4
    to 8 megabytes of memory that''s now standard in most personal computers.


    # Defining RISC


    RISC stands for Reduced Instruction Set Computing. The goal of a RISC architecture
    is to enable instructions to be executed as fast as possible. One way to accomplish
    this goal is to simplify the type of instructions the processor executes. The
    shorter and simpler “reduced” instructions of a RISC processor can run faster
    than the longer and more complex instructions of a CISC processor. RISC architectures
    enable higher performance through the use of pipelining and superscalar execution,
    techniques that allow more'
