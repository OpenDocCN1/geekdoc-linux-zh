  md: '# Chip Descriptions


    The text below is an alphabetically-sorted list of brief chip descriptions, covering
    some of the more notable chips used in Power Macintosh computers.


    # AMIC


    The Apple Memory-Mapped I/O Controller (AMIC) is a 160-pin gate array chip that
    performs most I/O logic and control for Power Macintosh computers. It supports
    the following functions:


    +   - handling interrupts received through Versatile Interface Adapter (VIA) channels

    - DMA for Ethernet I/O

    - DMA for the SWIM III floppy disk drive controller

    - DMA for the Serial Communications Controller (SCC) I/O

    - DMA for Small Computer System Interface (SCSI) device support

    - DMA for sound I/O

    - monitor support


    The AMIC does not support the extended transfer protocols of the PowerPC 601 processor;
    using these protocols will cause a transfer error exception.


    # Ariel


    The Ariel custom Video Output IC contains the video CLUT (color lookup table)
    and DAC. The Ariel IC takes the serial video data from the VRAM and generates
    the actual RGB signals for the external video monitor. The Ariel is pin and software
    compatible with the AC843 but does not support 24 bits per pixel.


    # Ariel II


    The Ariel II custom Video IC provides a color lookup table (CLUT) and digital-to-analog
    converter (DAC) for driving an AudioVision monitor.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Chapter 17: Power Mac Systems


    # AWAC


    See AWACS.


    # AWACS


    The audio waveform amplifier and converter (AWACS) is a custom IC that combines
    a waveform amplifier with a 16-bit digital sound encoder and decoder (codec).
    It conforms to the IT&T ASCO 2300 Audio-Stereo Codec Specification and furnishes
    high-quality sound input and output. For information about the operation of the
    AWACS IC, see Chapter 3 of Developer Note: Power Macintosh Computers, available
    on the developer CD-ROM and as part of Macintosh Developer Note Number 8.


    # Baboon


    The Baboon custom Disk Drive IC provides the interface to the expansion bay. The
    IC performs 4 functions:


    +   * controls the expansion bay

    * controls the IDE interfaces, both internal and in the expansion bay

    * buffers the floppy-disk signals to the expansion bay

    * decodes addresses for the PCMCIA slots and the IDE controller


    The Baboon IC controls the power to the expansion bay and the signals that allow
    the user to insert a device into the expansion bay while the computer is operating.


    The Baboon IC controls the interface for both the internal IDE hard disk drive
    and a possible second IDE drive in the expansion bay. The IC also handles the
    signals to a floppy disk drive installed in the expansion bay.


    The address decode portion of the Baboon IC provides address decoding for the
    IDE controller portion of the IC. It also provides the chip select decode for
    the TREX custom IC and address decoding for the two PCMCIA slots.


    # Bandit


    The Bandit custom PCI Bridge IC is the interface between the the PCI bus and the
    main processor and memory subsystem. The Bandit IC provides buf-'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    fering and address translation between the processor bus and the PCI bus. The
    Bandit IC supports burst transfers, in both directions, of up to 32 bytes in length
    – the size of a cache block.


    A separate logic device (gate array) provides the priorities for bus arbitration
    as follows:


    +   1. Grand Central IC (I/O device controller); highest priority


    +   2. PCI slots and Bandit master, in round-robin sequence: that is, each in
    turn, with equal priority


    The PCI expansion slots are connected directly to the PCI bus.


    # BART


    The BART custom NuBus controller chip provides the data gateway between NuBus
    and the CPU bus. It acts as a CPU bus master, transferring one- or four-cycle
    transactions. It is compliant with IEEE Standard 1196.


    # Chaos


    The Chaos custom IC provides data bus buffering between the video-system and the
    processor bus.


    # CIVIC


    The Cyclone Integrated Video Interfaces Controller (CIVIC), used in the AV card,
    is a custom CMOS chip in a 144-pin package. The CIVIC


    +   * manages from 1 MB to 4 MB of video RAM (VRAM)


    +   * controls data transfers between VRAM and the SAA7194 chip and between VRAM
    and the Sebastian video color palette chip


    +   * provides 32-bit or 64-bit data paths between VRAM and the main processor;
    supports data bursts from the main processor in all transfer modes


    +   * controls convolution of graphics data for line-interleaved displays


    +   * provides NTSC and PAL timing signals


    +   * generates vertical blanking and video-in interrupt signals'
