    # Architectural Model


    This section provides a brief, non-formal model of the system architecture supported
    by the Mach kernel. It attempts to discuss each feature of the kernel in an isolated
    way, building to an understanding of the programming model supported, without
    suggesting any particular method of use.


    Like all systems, the Mach system has, as its primary responsibility, the provision
    of points of control that execute instructions within some framework. In Mach,
    these points of control are called threads. Threads execute in a virtual environment.
    The virtual environment provided by the Mach kernel consists of a virtual processor
    that executes all of the user space accessible hardware instructions, augmented
    by emulated instructions (system traps) by the kernel; the virtual processor accesses
    a set of (virtualized) registers and some virtual memory that otherwise responds
    as the machine''s physical memory; all other hardware resources are accessible
    only via special combinations of memory accesses and emulated instructions. Note
    that all resources provided by the Mach kernel are virtualized.


    # Elements


    The Mach kernel provides an environment consisting of the following elements:


    +   - thread – An execution point of control. A thread is a light-weight entity;
    most of the state pertinent to a task is associated with its containing task.


    +   - task – A container to hold references to resources in the form of a port
    name space, a virtual address space and a set of threads.


    +   - security – Not really a kernel object. The privileged security port is used
    when setting (changing) task identity.


    +   - ledger – A resource accounting device that counts and limits the amount
    of a type of kernel resource that may be consumed.


    +   - port – A unidirectional communication channel between tasks.'
