- img_proc: true
  md: '# 8 MkLinux: Microkernel Linux for the Macintosh


    together with the GNU system which had everything but the kernel, to make a complete
    free system.


    Putting them together sounds simple, but it was not a trivial job. The GNU C library
    had to be changed substantially. And integrating a complete system as a distribution
    that would work "out of the box" was a big job, too. It required addressing the
    issue of how to install and boot the system - a problem we had not tackled, because
    we hadn''t yet reached that point. The people-who developed the various system
    distributions made a substantial contribution. Seen in perspective, their contribution
    was to combine Linux and the GNU system to produce a Linux-based GNU system.


    Aside from GNU, one other project has independently produced a free UNIX operating
    system. This system is known as BSD, and was developed at UC Berkeley. The BSD
    developers were inspired by the example of the GNU Project, and occasionally encouraged
    by GNU activists, but their actual work had little overlap with GNU. BSD systems
    today use some GNU software, just as GNU systems use some BSD software; but taken
    as wholes, they are two different systems which evolved separately. A free operating
    system that exists today is most likely either a GNU system or a BSD system.


    We use Linux-based GNU systems in the GNU project today, and we encourage you
    to use them too. But please don''t confuse people by using the name "Linux" ambiguously.
    Linux is the kernel, one of the essential major components of a system. The system
    is GNU.


