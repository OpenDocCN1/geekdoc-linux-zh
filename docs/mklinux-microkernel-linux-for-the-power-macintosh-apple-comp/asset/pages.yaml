  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    Complicating the issue somewhat. AT&T changed the licensing terms on UNIX, making
    it much more expensive for license-holders to upgrade than to stick with the version(s)
    they already had. This hardened divisions that already existed, forming the basis
    for the current BSD/SYSV schism.


    Although the differences in UNIX versions have devdeviled programmers and users
    alike for nearly two decades, they also have a positive side. With two major (and
    many minor) versions of UNIX around, there has been plenty of room for experimentation
    and intellectual interchange.


    Developer conferences on by vendors of proprietary operating systems tend to rather
    one-way in nature. Vendors announce and demonstrate their wonderful new technology.
    Audience members may complain, but do not have any sort of veto capability. More
    to the point, they don''t have copies of the source code!


    UNIX conferences, in contrast, are check of hackers telling each other about the
    wonderful new ways they have found to “improve” the kernel or some other part
    of UNIX. Heated arguments can develop over these ideas, though a tradition of
    academic respect tends to prevent outright violence.


    This ferment has led to the creation of thousands of pages of papers and untold
    numbers of lines of source code. More to the point, it has polished and honed
    UNIX into the sturdy, powerful system it is today. Consequently, although we support
    standardization heartily, we are equally fervent in our desire to see this intellectual
    anarchy continue!


    # Richard M. Stallman


    The existence of free UNIX-like systems today is largely due to the idealism of
    Richard M. Stallman (rms), who in the 1980s worked persistently towards this goal,
    even though most of us thought it was an impossible dream. By doing a large part
    of the job himself, he showed us it wasn''t too far to aim for, and then we could
    do the rest.


    The free software community owes a tremendous debt to this pioneering work. rms
    has made fundamental contributions to the technical, organizational, and legal
    aspects of free software. It is unlikely that the freewareware community would
    have developed anything like its current form, to say saying nothing of its current
    size and robust state of health, without him.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Chapter 1: Introduction


    rms has written (and overseen the development of) immense amounts of free software,
    including substantial and innovative software systems. GNU Emacs and the GNU C
    Compiler (GCC) are just two examples of his work. The utility and overall quality
    of this software is so high that it is often used by commercial developers in
    preference to proprietary software.


    rms founded the Free Software Foundation and the GNU Project, creating an organizational
    framework for collecting, developing, and distributing free software. The mission
    of the project was the creation of the GNU system: a freely redistributable, UNIX-like
    operating system. To this end, the project created dozens of commands, ranging
    from trivial to very complex, and is now working on an advanced Mach-based kernel,
    known as the Hurd.


    By instigating and promoting the use of the GNU General Public License (GPL),
    rms allows individuals and organizations to examine, use, and modify the free
    software it covers. Even allows companies such as PTF to sell collections of free
    software.


    The GPL does not, however, allow anyone (save, in general, the original author)
    to distribute binaries without source code, modify the licensing terms, or in
    any other way convert free software into proprietary products.


    It is important to realize that the Linux operating system, more commonly known
    as Linux, is really a Linux-flavored version of the GNU system, with historical
    roots going back more than a decade. GNU utilities form a large fraction of the
    code of every Linux system; without these, it is very unlikely that Linux would
    exist.


    It is also important to understand why rms and his compatriots did all the hard
    work of writing compilers, assemblers, and libraries. After all, much of this
    work is not glamorous computer science!


    Although each of the GNU developers has his or her own motivation, rms is motivated
    by the belief that proprietary software is inimical to good in society; that the
    presence of software on his system which he is forbidden to share with his neighbors
    prevents him from living ethically.


    By writing software, founding organizations, and establishing a legal basis for
    protecting free software, rms has changed the landscape of the computer'
