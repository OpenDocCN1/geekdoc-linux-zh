  md: '# Chapter 14: Digital I/O


    ers, scanners, magnetic tape drives, and other devices that need to transfer large
    amounts of data.


    The SCSI standard specify the hardware and software interfaces at an abstract
    level, minimizing implementation dependencies. In fact, from a programming point
    of view, SCSI devices are pleasantly "object-oriented", conversing with the driver
    software by means of a message-based protocol.


    A SCSI bus is a bus that conforms to the physical and electrical specifications
    of the SCSI standard. A SCSI device refers to any unit connected to the SCSI bus,
    either a peripheral device or a computer. Each SCSI device on the bus is assigned
    a SCSI ID, an integer value from 0 to 7 that uniquely identifies the device during
    SCSI transactions.


    The Macintosh computer is always assigned the SCSI ID (address) of 7, and its
    internal hard drive is normally assigned the SCSI ID value of 0. In general, only
    one Macintosh computer can be connected to a SCSI bus at a time, and most Macintosh
    models support only a single SCSI bus.


    When two SCSI devices communicate, one device acts as the initiator and the other
    as the target. The initiator begins a transaction by selecting a target device.
    The target responds to the selection and requests a command. The initiator sends
    a SCSI command, and the target carries out the action. After acknowledging the
    command, the target controls the remainder of the transaction. The role of initiator
    and target is fixed for each device, and does not usually change. In general,
    the computer acts as initiator, with peripheral devices acting as targets.


    SCSI transactions involve interaction between bus signals, bus phases, SCSI commands,
    and SCSI messages. The following sections briefly summarize the elements of a
    SCSI transaction.


    The SCSI specification defines 50 bus signals, half of which are tied to ground.
    The table below describes the 18 SCSI bus signals that are relevant to SCSI transactions.
    Nine of these signals are used to initiate and control transactions; the other
    nine are used for data transfer (eight data bits plus a parity bit).


    | Signal | Name | Description |

    | BSY | Busy | Indicates that the bus is in use. |'
