  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    These packages, known as RPM binary archives, contain pre-built application programs
    which are believed to run on MkLinux. Many of these are included on the CD-ROM,
    ready to be installed at your convenience. RPM binary archive files typically
    have names like:


    ```

    apache-1.1.13a.ppc.rpm

    ```


    The name includes the package name (apache), version (1.1.1), (ppc), release number
    (3a), machine architecture, and archive type (rpm).


    Additional package archives may be made available on the MkLinux site, in the
    contrib directory; these packages have been ported by MkLinux users and made available
    to the rest of the MkLinux community. If you port a package to MkLinux, consider
    making it available. See the MkLinux web site (www.mklinux.apple.com) for information
    on uploading processes. Be sure to include all appropriate attributions, including
    your contact information, with any uploaded archive.


    More RPM packages may be found on other FTP sites. However, you should understand
    the RPM packaging mechanism is used for many kinds of Linux systems. Most frequently,
    RPM binary packages are intended for use on Intel-based Linux systems. Because
    of architectural issues, a binary archive intended for use on an Intel machine
    will not work on MkLinux.


    If you find an RPM binary archive on a non-MkLinux FTP site, check carefully to
    see if the binary is known to work on MkLinux (or at least PowerPC Linux) before
    attempting to install and run it. Look for the ppc architecture specification
    in the name. While this is no guarantee that the package is supported, it''s a
    good starting point.


