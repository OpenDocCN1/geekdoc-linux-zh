  md: '# Biography


    François Barbou des Places received the MSc. in Computer Science from the University
    of Paris XI, Orsay, France in 1987 and a Diplome d''Etudes Approfondies from the
    University of Grenoble, France in 1989. He also graduated from the Ecole Nationale
    Superieure d''Informatique et de Matématiques Appliques in Grenoble in 1989. He
    is currently a Research Engineer at the OSF Research Institute in Grenoble.


    Nick Stephen received a first class honours BSc. in Computer Science from the
    University of Southampton, England in 1990. He is currently a Research Engineer
    at the OSF Research Institute in Grenoble, France. His research interests include
    microkernel operating systems and distributed systems.


    Franklin Reynolds has been involved in the computer industry for over twenty years.
    For the last six years he has been employed at the Open Software Foundation''s
    Research Institute in Cambridge, MA. His current research interests include real-time
    and highly available distributed systems and active networks.


    The work described in this paper (the Linux server and the port of the microkernel
    to the Power Mac) was partly supported by Apple Computer, Inc., who also provided
    useful technical information on the Power Mac.'
