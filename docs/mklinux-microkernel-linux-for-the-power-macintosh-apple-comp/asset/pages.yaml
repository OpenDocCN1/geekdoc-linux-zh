    new type of lock: a mutex lock. A mutex lock is an inexpensive, mutual-exclusion
    blocking lock. The difference between a simple lock and a mutex lock is that a
    kernel thread can be pre-empted while holding a mutex. Most of the algorithms
    that used simple locks were converted to the new mutex locks.


