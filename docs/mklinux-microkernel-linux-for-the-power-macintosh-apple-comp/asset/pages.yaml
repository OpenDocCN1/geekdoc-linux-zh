    # Controls And Devices


    Power Macintosh systems, unlike conventional PCs, are equipped by default with
    a substantial number of controls and devices. At this writing, Linux does not
    support all of these items. We expect, however, that they will be supported in
    the relatively near future.


    This chapter, in any event, is a high-level summary of these items, with some
    emphasis on their technical characteristics. The exact complement of controls
    and devices on a Power Macintosh system may vary. Nonetheless, any Power Macintosh
    system will have most of the controls and devices covered in this chapter:


    > Note: For specific information on the exact complement and placement of controls
    and devices on your system, review the descriptions and drawings in the User''s
    Guide (or equivalent document) that came with your system.


    # CD-ROM Drive


    Apple''s built-in CD-ROM drive is capable of reading both CD-ROMs and Audio CDs.
    The control and status functions of the drive are accessed via the SCSI bus. Digital
    data is read over the SCSI bus; audio signals are fed through the computer''s
    audio input subsystem.


    > Note: Some CD-ROM drives (e.g., the Apple CD300) are capable of sending audio
    data blocks over the SCSI bus. This is not particularly useful as a'
