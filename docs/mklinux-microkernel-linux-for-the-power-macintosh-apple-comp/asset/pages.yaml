  md: '# MkLinuxux: Microkernel Linux for the Power Macintosh


    ```

    [linus@penguin /tmp]$ ls -l foo

    -rw-rw-r-- 1 linux root 0 Aug 25 21:56 foo

    [linus@penguin /tmp]$ touch /foo

    touch: Permission denied

    ```


    The system lets us go to /tmp, and even touch (create and/or update the time and
    date stamp) on a file, because /tmp is a shared community work space. On the other
    hand, although the root directory is readable by ordinary users, it is not writable
    by them. So, we can''t create /foo.


    ```

    [linus@penguin /tmp]$ rm foo

    [linus@penguin /tmp]$ ls -l foo

    ls: foo: No file or directory

    ```


    **Note:** MkLinux systems, unlike Mac OS, believe that users know what they are
    doing. If we tell MkLinux to remove (rm) it will do so at once (assuming, of course
    that we have the necessary permissions). It won''t ask if we''re sure, put if
    we have wandered off to some far corner of the file system, trying to put a file
    into a temporary holding area (e.g., Trash), trying to protect us from the consequences
    of our actions. MkLinux commands are like sharp knives, invaluable in a kitchen,
    but not to be handled carelessly.


    # The Home Directory


    When used without arguments, cd returns us to our home directory. This can be
    very useful if we have wandered off to some far corner of the file system.


    ```

    [linus@penguin /tmp]$ cd

    [linus@penguin linux]$

    ```


    The home directory is the user''s primary storage area for private files. Although
    the root account is perfectly free to examine (and indeed, modify) any file in
    the system, the files in users'' home directories are generally considered to
    be private. In short, your home directory is the proper place to put your working
    files and directories.


    **Note:** If you are working on multi-person project, you may wish to create a
    shared area for project files. You can use group access permissions to protect
    the files from unauthorized intrusion. Just warn the project members to be careful,
    lest two of them modify the same file at the same time!


    Let''s take a look at the contents of our home directory:


    ```

    [linus@penguin linus]$ ls

    ```'
