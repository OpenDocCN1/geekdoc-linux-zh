    | Bedford, MA 01730 | |


    # Monitor


    Any Power Macintosh system will have at least one monitor, capable of at least
    medium-resolution graphical display. Many older Apple monitors have fixed syncron
    frequencies, making them unsuitable for use with other systems. Recent monitors
    typically support multisync (automatic sync detection), which greatly increases
    their versatility.'
