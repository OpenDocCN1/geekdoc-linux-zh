  md: '# Chapter 2: Preparation


    Most third-party disks are delivered in initialized, but not partitioned. If a
    disk is partitioned, it typically will be set up as a single Mac OS volume. Your
    decision to initialize and partition your hard disk depends on the current status
    of your hard disk:


    +   - If you have a hard disk with a partitioning scheme that can accommodate
    all of MinLinux, there is no need to prepare the hard disk. This is the most likely
    case if you have already installed and been running a new release of MinLinux.
    If so, you may proceed to the next chapter, which covers MinLinux installation.

    - If you have a new hard disk that has not been initialized, you will need to
    initialize the disk and create disk partitions. This is the most likely case if
    you purchased a new hard disk from a vendor who does not specialize in Macintosh
    products.

    - If you have a new hard disk that is already initialized, you will need to create
    disk partitions. This is the most likely case if you purchased a new hard disk
    from a vendor who specializes in Macintosh.

    - If you have a hard disk that has been previously used with an operating system
    other than MinLinux or Mac OS, or if you''ve been trying to use the disk with
    MinLinux or Mac OS but it is giving you trouble, go through the initialization
    procedure to ensure the hard disk is initialized with the current software, and
    then create partitions.

    - If you have a Mac OS disk with enough space to support a set of MinLinux partitions,
    you will need to (a) back up any information you wish to retain, (b) partition
    the disk as needed, and (c) reload any partitions that have been damaged.


    Even if you do not intend to move or resize an existing partition, be sure to
    back it up! (A backup is cheap insurance against a disaster.)


