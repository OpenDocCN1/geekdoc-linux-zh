    # Where Things Live


    Unlike Mac OS, MkLinux views all of its file systems as parts of a unified “tree”.
    The root file system forms the base of the tree, but other file systems can be
    added as desired. Once a file system has been mounted, its directories act just
    like directories on the root file system. In fact, very few MkLinux commands can
    determine whether a file is on a mounted file or not.


    By unifying the file systems, MkLinux can keep its file names very consistent.
    Here are some sample full path names:


    ```


    /bin

    /bin/cp

    /usr

    /usr/bin

    /usr/bin/vi

    ```


    Although /usr is frequently stored on a separate file system, nothing in these
    names indicates the fact. This allows users and programs to ignore the exact hardware
    configuration, preventing problems when and if it changes.


    MkLinux file trees are generally drawn with the root directory at the top. This
    may seem peculiar, at first glance, but it turns out to be very convenient. Here,
    in any event, is a simplified summary of the distributed MkLinux file tree:


    +   /n

    bin critical commands

    dev devices and special files

    etc system administration data and commands

    home user directories, etc.

    lib libraries, programs, etc.

    lost+found fsck drop-off point for /filesystem

    mach_servers Server processes (mlinux, etc.)

    mnt convenient (temporary) mount point'
