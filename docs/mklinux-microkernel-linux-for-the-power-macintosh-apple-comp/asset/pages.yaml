  md: '# Chapter 4: Getting Started


    +   - Alternatively, you can log in as root and shut down (halt) the system:


    ```

    penguin login: root

    Password: [...silent...]

    root@penguin /root]# shutdown -h now

    ```


    This will kill off any running programs, shut down MkLinux, and power down the
