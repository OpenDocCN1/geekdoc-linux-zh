  md: '# Chapter 10: MkLinux Overview


    OSF extended the external memory manager to offer advisory page out. Instead of
    un-mapping a page and sending it to the memory manager, the microkernel can now
    leave the page in place, send a discard request to the memory manager, and let
    it take any appropriate action. The Linux server can then use the try_to_free_page
    routine and free a page other than the one selected by the microkernel. Of course,
    the microkernel cannot rely on an external memory manager to eventually free a
    page. If the memory manager does not free a page in time, the microkernel will
    send the data to the default pager, a privileged and trusted memory manager.


    On the Linux server side, the only major change required is to allocate the buffer
    caches from a separate memory object, the size of the physical memory, and backed
    by another external memory manager.


    # Avoiding Double Paging


    Apart making the best use of the available memory, a dynamic buffer cache also
    fixes a classic problem of Mach servers: double paging. The memory in the buffer
    cache comes from the disk and will eventually go back to the disk. There is some
    space reserved on disk for this data. Without a dedicated memory manager, buffer
    cache pages could be paged-out to the default pager''s paging space when the microkernel
    decides to discard a buffer''s memory. And, when the Linux server decides to re-use
    this buffer (either to write it back to disk if it''s dirty, or to overwrite it
    with another disk block), the page fault will cause the page to be read from the
    paging space. With a dynamic buffer cache, we get the opportunity to write the
    buffer back to disk (if dirty) or just discard it without any useless paging activity.


