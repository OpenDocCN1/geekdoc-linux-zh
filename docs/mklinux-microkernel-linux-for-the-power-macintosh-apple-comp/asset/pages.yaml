    # Linux


    Linux is named for Linus Torvalds, the principal author of the kernel. As he would
    be quick to point out, however, the kernel is the joint creation of dozens of
    volunteer programmers, in more or less formal capacities. If you care to look
    at the Linux source code, you will see some of these names.


