  md: '# A Multi-Threaded Server


    A server on top of Mach simply receives and replies to requests from user tasks
    or from the microkernel. It has no explicit control on scheduling nor hardware
    interrupts, it cannot decide what it needs or wants to do at a given time. We
    do not want to add code everywhere to check if there is something more important
    to do (like receive an incoming network packet or disk lock) or to manage context
    switches when we can rely on Mach threads and the user-mode threads library. This
    library offers various synchronization primitives (simple locks, mutexes and condition
    variables) and hides most of the necessary synchronization of the underlying kernel
    threads.


    The Linux server has dedicated threads to handle the following tasks:


    +   * keep track of time (jiffies)

    * process replies to asynchronous device requests

    * process incoming network packets

    * process pager requests

    * dispatch fake interrupts

    * idle thread, to wake up timed out tasks and tasks with pending signals

    * process system call and exception messages from user tasks.


    Most of these threads wait on a dedicated Mach port to receive messages. The system
    call threads are managed as a pool and wait on a port set regrouping all the user
    tasks'' exception ports. A system call thread is not dedicated to a given user
    task.


    The system is serialized by a global mutex. Server threads must acquire it before
    doing anything sensible and release it when to block.


