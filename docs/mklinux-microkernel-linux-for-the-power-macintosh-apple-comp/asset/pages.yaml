    cost of enabling pre-emption in an SMP environment was measured by a standard
    benchmark like AIM III. In a uni-processor environment, the cost of pre-emption
    is identical to the cost of enabling SMP locks, i.e., approximately 10%. Since
    our pre-emption mechanisms are integrated so closely with the SMP locking mechanisms,
