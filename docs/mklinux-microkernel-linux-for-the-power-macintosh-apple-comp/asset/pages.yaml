  md: '# Preface


    Note: Mac OS programmers should be aware of Apple’s Open Scripting Architecture
    (OSA), a powerful cross-platform messaging and scripting system that can support
    multiple scripting languages. OSA has three basic components: the Apple events
    messaging system, the Apple events object model, and one or more scripting systems.


    MkLinux has a command-line interface, supplemented by the X Windows system, a
    mouse-driven windowing environment. Only a few MkLinux applications use the mouse.


    MkLinux is highly optimized for batch use. MkLinux users frequently make use of
    “shell scripts” and “wild cards”, greatly reducing the number of commands that
    have to be typed. Nonetheless, a typical Linux session may involve dozens or hundreds
    of commands.


    # Audience


    MkLinux isn’t an attempt to dislodge Mac OS from its traditional audience; that
    would be silly. It can, however, open up the Power Macintosh to additional users
    and to additional forms of use. Many computer science students and programming
    professionals will be very happy that they can run Linux on their Power Macintosh
    systems.


    By the same token, MkLinux is not for everyone. Casual computer users, users of
    commercial packages, and game enthusiasts will not find much in MkLinux to delight
    them. On the other hand, some (adventurous) users will find MkLinux very pleasant,
    indeed.


    The target MkLinux user is interested in gaining access to the world of Linux
    software, while retaining the benefits of the well-designed, powerful, and highly-integrated
    Power Macintosh platform. This user probably owns at least one Power Macintosh,
    but may purchase one for use with MkLinux.


    We expect many students and computer professionals to use MkLinux as an economical
    way to experiment with Linux. The Linux distribution is very economical (even
    free, via FTP). The additional hardware (typically, 500 MB of disk storage) is
    very cheap, especially when compared to the cost of a dedicated system. This sort
    of user may alternate between Mac OS and MkLinux, depending on the nature of the
    tasks to be performed.'
