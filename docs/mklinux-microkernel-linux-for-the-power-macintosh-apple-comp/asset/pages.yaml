  md: '# Apple Computer Reference of MkLinux for the Power Macintosh


    Computers / Operating Systems / UNIX / Linux


    # MkLinux


    MkLinux, a freely redistributable family of computers, for the Power Macintosh,
    combines a continual Linux 2.0 kernel with the Mach 3.0 (Mk) microkernel. MkLinux
    benefits from each part of its heritage:


    > “Linux has been successful as a cultural phenomenon and as a technical design.
    MkLinux demonstrates yet again the strength of the Linux design and the power
    of the Linux phenomenon. I look forward to the innovations it enables for PowerPC-based
    personal computers.


    # Linux


    At heart, MkLinux is a conventional Linux release, inheriting:


    +   * hundreds of well-tested utilities, including document preparation tools,
    a substantial software development suite, and more.


    +   * freely available source code, primarily covered by the GNU General Public
    License (GPL) and University-style copyright notices.


    +   * a substantial community of users and programmers, supporting a wide range
    of email lists, USEN groups, Web sites, and more.


    +   * an immense body of supporting literature, covering the usage and internal
    structure of UNIX in general and MkLinux in particular.


    # Mach


    Being on Mach, MkLinux is very portable and has access to Mach’s advanced programming
    features. MkLinux will also be able to take advantage of Mach’s real-time and
    multiprocessor capabilities.


    # Power Macintosh


    MkLinux is very easy to install, set up, and administer. It has no of the manual
    hardware setup issues (jumps, DMA vectors, video refresh rates, etc.) or related
    problems that plague administrators of PC-based Linux.


    Apple Computer, which is supporting the porting effort, has authorized Prime Freeway
    to produce this release of the system, providing introductory and reference material
    that is unavailable in any other publication. The reference release includes:


    +   * a printed volume of introductory and reference material, edited by Prime
    Time Freeway


    +   * an Apple-edited CD-ROM containing the complete MkLinux distribution


    +   * a PTF-edited CD-ROM containing online reference material on Linux, Mach,
    and NextStep, Power Macintosh hardware and interfaces, more.


    > “Not since the day I got my first Mac, back in 1985, have stayed up into the
    wee hours, marveling at the wonders hidden within my computer. Hurrah to the OSF
    and to Apple for this admirable effort.”


    Michael Tieemann, Co-founder Cygnus Support, USA (Author of GNU C++)


    Max Newell, Principal Kafka Design, USA


