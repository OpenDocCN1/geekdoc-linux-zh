- img_proc: true
  md: '# Chapter 1: Introduction


    system. The folks at UC Berkeley''s Computer Science Research Group (UCB CSRG)
    reacted to this situation in a characteristically upfront manner.


    They performed triage on the code base, dividing it (roughly) into clean, doubtful,
    and dirty. The clean code was released (in BSD NET1). The doubtful code was re-examined,
    cleaned up, and released (in NET2). The dirty code was recapitulated or, in some
    cases, ignored.


    AT&T brought suit, alleging CSRG was giving away material covered by trade secret,
    unpublished copyrights, etc. To make a long (and rather interesting) short story,
    they lost. CSRG then published 4.4BSD-Lite, an almost complete (and freely redistributable!)
    subset of 4.BSD.


    Meanwhile, Linus Torvalds wrote his own kernel, Linux. Many OS hackers, tired
    of waiting for the AT&T/UCB legal battle to sort itself out, decided to get involved
    with Linux, instead. But, by the time 4.4BSD-Lite emerged, a healthy and popular
    competitor was already in place.


    NET1, NET2, and 4.4BSD-Lite are the bases for the current raft of BSDish UNIX
    clones: 386BSD, FreeBSD, NetBSD, OpenBSD, etc. They also supply a large part of
    the application code today''s Linux systems. Finally, Apple''s Mac OS X is largely
    based on 4.4BSD-Lite technology. Look at any current UNIX (or clone) system, in
    fact, and you will find a great deal of BSD-derived technology.


    # Convergence?


    The UNIX community has a long history of incompatible programming interfaces,
    proprietary user interfaces, and other compatibility problems. It is unclear whether
    the current organizational arrangement will resolve any of the problems than previous
    ones have.


    The Open Group, formed of X/Open and the Open Software Foundation, is the current
    owner of the name “UNIX” and the POSIX standards which attempt to define it. Most
    commercial operating system vendors are looking for ways in which they can adapt
    and then certify their systems for POSIX compliance.


    The free software community has been very supportive of standardization in general
    and POSIX in particular. Until recently, however, few freeware'
