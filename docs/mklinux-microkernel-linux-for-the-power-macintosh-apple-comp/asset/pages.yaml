  md: '# # Chapter 3:


    +   - MkLinux Installation


    # # Installation


    The current (DR3) MkLinux system installation procedure, although very flexible,
    is quite a bit more complex than the previous (DR2,1) one. On the other hand,
    it is still far simpler than the installation would be on an IBM PC.


    This chapter, in any case, describes the procedures for installing MkLinux DR3.
    It is not guaranteed to be accurate for any succeeding release. Be sure to read
    the README files and any other initial documentation on the Apple MkLinux disc
    before starting your installation!


    There are five files in the Mac Files folder over the CD-ROM:


    +   - The MkLinux Booter starts up the MkLinux system. The Mach Kernel takes over
    the booting process and performs the interprocess communication, low-level I/O,
    scheduling, and virtual memory functions of MkLinux. Copy these files to the Extensions
    folder.


    +   - The MkLinux Control Panel controls your system''s booting behavior (via
    MkLinux.prefs ). Copy the MkLinux file to the Control Panels folder.


    +   - lilo.conf is a text file which is read by the Mach Kernel. It contains settings
    which control the default behavior of Linux (e.g., the boot device). Copy this
    file to the Preferences folder.


    +   - MkLinux.prefs is a text file which is read by the MkLinux Booter. It controls
    the default operating system and timeout behavior of the MkLinux splash screen.
    Copy this file to the Preferences folder.


    The initial boot of MkLinux runs the installer. In DR3, it is set up to install
    from a SCSI CD-ROM drive. If your system has a SCSI CD-ROM drive, you will not
    need to change anything; skip ahead to “MkLinux Installation”. (If you aren''t
    sure which kind of CD-ROM drive you have, read on...)'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# MkLinux: Microkernel Linux for the Power Macintosh


    # ATAPI CD-ROM Drives


    Several of Apple''s more recent machines have ATAPI CD-ROM drives. For example,
    if you have one of the following machines, you probably have an ATAPI CD-ROM drive:


    +   - PowerBook 3400 or G3

    - Power Macintosh 4400 or G3

    - “Tanzania”-based clone


    To determine whether your machine has an ATAPI CD-ROM drive, insert a disc into
    your drive, click once on the disc''s icon, and run “Get Info” (from the File
    menu). If the “Where:” line ends in “ATAPI...), you have an ATAPI drive and you
    will need to change a setting.


    To change MkLinux so that it will retrieve the installer from an ATAPI CD-ROM,
    launch the MkLinux Control Panel and select “Custom... SimpleText will be launched
    to edit your lilo.conf file. Change your root device (rootdev) according to the
    instructions in the lilo.conf file.


    # MkLinux Installation


    Before you begin the installation, make sure that your primary monitor is set
    to “256 colors”. Use the “Monitors and Sound” Control Panel to choose a 256-color
    scheme. The first page of the installer should display a blue background and a
    white text window with black characters.


    Restart your Macintosh. Upon reboot, you will see the MkLinux “splash screen”.
    By default, it is set to boot into Mac OS. Click on the “MkLinux” button; the
    MkLinux installer should run from your CD-ROM drive.


    The DR3 installer is adapted from the well-known “Red Hat Linux” installer, originally
    written by Red Hat Software. The installer was ported to MkLinux with the intent
    of making as few changes as possible.


    Consequently, there are still many references to “Red Hat Linux”, as well as options
    that are inappropriate for MkLinux. Don’t worry; with some basic instruction,
    you will be able to get your system installed with the desired complement of packages.


    The following keys will help you navigate while using the installer:'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Chapter 3: Installation


    | Tab | Move to the next field |

    | Return | Select the current highlighted choice |

    | Up/Down Arrow | Move up/down in a list of items |

    | Space | Check/uncheck the selected list item |


    # Installation Screens


    The installer will present you with a series of screens, generally requiring some
    sort of decision. The entries below are a step-by-step description of the installation
    screens you should encounter. Review them carefully before attempting your MkLinux
    installation.


    # “Welcome to MkLinux” Screen


    Simply press Return to continue to the next screen.


    # “Keyboard Type” Screen


    Select a keyboard type. This controls the keyboard mapping. Not all of the listed
    keyboard mappings work properly. If you find that this is the case for your selection,
    start over and select “us” as your keyboard type. You should then be able to continue
    through the installation.


    # “Installation Method” Screen


    Since the packages to be installed reside on the CD-ROM, choose “Local CD-ROM”.


    # “Installation Path” Screen


    Choose “Install”. The other option, “Upgrade”, adds packages to an already installed
    Red Hat system, and is not supported under DR3.


    # “Partition Disks” Screen


    The installer will show you a list of disks on your system that MkLinux has recognized.
    If you select one and choose “Edit”, you will be able to view and optionally change
    that disk’s partition map, using the MkLinux version of pdisk. When you have finished
    viewing/editing the partition maps on various disks, choose “Done”.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'Note: Don’t confuse this screen with the “Partition Disk” screen, below.


    # “Select Root Partition” Screen


    The installer will list every partition that is appropriate for an MkLinux filesystem.
    Pick one to use for your “root” partition.


    # “Partition Disk” Screen


    This page will list the other partitions that are available to be mounted. Use
    the arrow keys to highlight a particular partition, then press Return. A follow-on
    dialog will tell the installer where you would like to have the filesystem on
    this page to mount Mac OS Standard (HFS) volumes. You may also use this tool.
    Please note, however, that the HFS volumes will be mounted read-only.


    Note: Don’t confuse this screen with the “Partition Disks” screen, above.


    # “Active Swap Space” Screen


    The installer will give you a list of every partition that is suitable to be a
    MkLinux swap partition. Remember, use the Space bar to set/unset which partitions
    you want to use for swap.


    # “Find installation files” Screen


    This isn’t a real screen (that is, you aren’t being asked to decide anything).
    However, you may notice a significant pause here. Be patient.


    # “Format Partitions” Screen


    The installer will give you a list of partitions. You will need to use the arrow
    keys and space bar to select which partitions to format. If you have never used
    MkLinux in these partitions, you must reform all of them. If you have used MkLinux
    DR2.1 (or an earlier version), we suggest that you reformat all your MkLinux partitions.
    If you have used MkLinux “pre-DR3”, we suggest that you format at least the operating
    system partitions, such as / (the root partition), /usr, or /var.


    # “Components to Install” Screen'
