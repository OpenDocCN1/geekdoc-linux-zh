  md: 'Chapter 5: Essential System Administration


    # # Setting Up Disks


    MkLinux allows disks to be added, but a number of things have to be done correctly,
    and in the right order, as:


    **Wiring it up.** A MkLinux system will have one or more **SCSI** busses, each
    of which can support several devices. Each device is addressed by means of its
    **SCSI ID**. Devices on the bus are “daisy-chained”, usually by means of external
    cables. **Termination** must be provided at each end of the bus.


    Each device on a given SCSI bus must have its own unique ID, ranging from 0 to
    6 (the CPU uses). Most external devices have switches to set the ID. Internal
    devices typically use removable jumpers for this purpose.


    SCSI devices are commonly “daisy-chained”, with several units linked in series.
    Each end of the bus must be terminated by a set of resistors or an active (solid-state)
    terminator. The inboard (CPU) end of the SCSI bus is normally terminated by the
    vendor; terminating the outboard end is the responsibility of the user.


    Some SCSI devices are shipped with removable packs of resistors or other “internal”
    termination. We suggest that any termination be removed or disabled, as it is
    a frequent source of confusion. Use an external terminator (preferably an active
    one), attached to the last device in the chain.


    **Formatting, labelling, etc.** A newly acquired disk is a bit of an unknown.
    It may have bad tracks, inappropriate sectoring, or any number of other problems.
    Fortunately, Apple and other vendors provide tools for dealing with these issues.
    If your disk was manufactured by Apple, you will be able to use **Apple HD SC
    Setup, Drive Set,** or **disk**, shipped with MkLinux, for this purpose. If so,
    you may not need to acquire a third-party product. (See the Preparation chapter
    for detailed information on these topics.)


    Disk formatting sets up the disk correctly for the system, scans for bad spots,
    and generally reads the disk for use. On Mac OS and MkLinux systems, disk labelling
    is then performed. The label allows the system to know what kind of disk is being
    used, how it is laid out (partitioned), etc.


    **Making a node for the device.** MkLinux wants to find all of its devices in
    /dev, even the disks themselves. In, however, any needed entries will be present
    in the standard MkLinux system.'
