    done, the server was able to start to boot on the Power Mac.


    Being able to use the Linux server on Power Mac machines was not simply a question
    of porting the server; commands and libraries were also needed, together with
    a file-system from which Linux could boot. We added some code to the Mach kernel
    to recognize the disk label and partition tables on a Macintosh disk, and ported
    the tool from the Minix distribution to create an initial populated file-system.
    As for commands and libraries, we were able both to build themselves and also
    recover commands and libraries from an early binary distribution of native Linux
    on the PowerPC. Below is a list of steps taken in porting the Linux Server to
    the Power Mac:


    +   * porting the include files

    * porting the server''s processor-dependent state

    * recognizing Mac disk labels and partitions

    * creating a file-system

    * booting the Linux server from the file-system

    * running init (first server system call)

    * paging file found

    * running /etc/rc.S (first signal taken)

    * single user # prompt

    * multi-user

    * networking

    * self-hosting


    The work to generate a minix file system on a Mac disk was done in parallel to
    the port of the Linux server, using mach_perf as the server to boot from the file
    system. Reaching the multi-user # prompt took less than three engineer-weeks from
    the start of the port to the Power Mac.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Differences With The Native Linux


    It is still a little easy to give a complete listing of functional differences
    between native Linux on other PowerPC platforms and the Linux server on Power
    Macs, especially since both projects are under constant development. One current
    difference is that the Linux server offers the full 32-bit address space to user
    processes, rather than the restricted 31-bit address space offered by native Linux.


    # Performance


    We have not had time to make extensive performance measurements and analysis for
    the Linux server, but we ran a few benchmarks to get an idea of the critical areas.
    We used the NONAIM benchmark, derived from the AIM III benchmark, which measures
    the behavior of the system under an increasing workload, trying to simulate real
    life user behavior.


    We also ran the Byte benchmarks, which give finer results on the relative performance
    of more specific parts of the system.


    The benchmarks were run on a DEC PC450, with a 50MHz i486 and SCSI disks, running
    a Slackware 3.0 ELF distribution. The benchmarks themselves were in a.out format
    and we ran them on a 1kB-block ext2 file-system.


    We profiled the microkernel and Run Linux server during these benchmarks and performed
    quick optimizations in two areas:


    +   - system call path,

    - access to user memory.


    These optimizations improved some benchmarks and we now have reasonable performance
    for AIM III throughput when the system is not I/O-bound. The Linux server reaches
    93% of the AIM III performance of the native Linux kernel.


    Next, we started investigating disk I/O performance. The default-system block
    size is one kilobyte on Linux. The Linux kernel is able to group disk requests
    into larger requests and doesn''t suffer from the small block size. Neither the
    Linux server nor the micro-kernel perform such an optimization currently, and
    the penalty is made even worse by the extra-'
  merge: -1
  pgno: 204
- img_proc: true
  md: '166 MkLinux: Microkernel Linux for the Power Macintosh


    head of Mach device interfaces. The result is that we read only one block

    per disk revolution.


    # Conclusion


    Although the Byte results show there is still room for performance

    improvement, the AIM results are encouraging. Even with the huge system

    overhead penalty and the currently poor disk I/O performance, we are

    still within arm''s reach of the native Linux kernel.


    We plan to do more exhaustive performance measurements and analysis in

    the future and to extend our tests to multi-processor platforms.


    # Status And Future Work


    # Portability


    It took approximately five engineer-months to convert Linux into a Linux

    server on the Intel x86 platform and two more engineer-weeks to port the

    Linux server to the Power Mac.


    Admitted, this port was able to re-use some of the machine-dependent

    files from the Linux /PowerPC project, but it is a fact that the code that

    requires a lot of work when porting is not used by the Linux server. Boot-

    strap issues, device drivers, context switching, trap handling, and, last not

    least, virtual memory management are all handled by the microkernel

    and what is left of these components in the Linux server is mostly machine

    independent.


    What is left to port is:


    +   - a few header files describing some VM constants, like page size and

    mask

    - the system call and exception handling routine, which has to fill the

    Linux registers structure from the Mach thread state structure

    - the copy_thread routine, to initialize the state of the new Mach

    during a fork system call

    - the signal delivery routine, which pushes the signal handler stack

    frame on the user stack.'
