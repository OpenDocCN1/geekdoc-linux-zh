  md: '# Chapter 14: Digital I/O


    +   - **Command.** During this phase, the target requests a command from the initiator.


    +   - **Data.** The data phase occurs when the target requests a transfer of data
    to or from the initiator.


    +   - **Status.** This phase occurs when the target requests that status information
    be sent to the initiator.


    +   - **Message.** The message phase occurs when the target requests the transfer
    of a message. Messages are small blocks of data that carry information or requests
    between the initiator and a target. Multiple messages can be sent during this
    phase.


    Together, the last four phases (command, data, status, and message) are known
    as the information transfer phases. The figure below shows the relationship of
    the SCSI bus phases.


