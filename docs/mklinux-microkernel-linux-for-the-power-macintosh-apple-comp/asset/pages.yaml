  md: '# Real-time RPC


    The Real-Time RPC [Bur94a] is not layered on top of message-based IPC.

    Implementing RT-RPC as a new kernel service had important advantages:


    RPC-specific optimizations can be made along the entire RPC path (our RPC is twice
    as fast as the Mach 3.0 RPC optimizations).Real-time specific behaviors, such
    as alerts, orphan detection, predictable delivery, and nested constraint propagation
    are possible. An efficient, unified programming model for invoking operations
    across module boundaries within a task, across the task/kernel boundary, or across
    task boundaries is possible.


    The client side of a RT RPC is very similar to a message-based RPC. In both cases,
    threads invoke RPCs using ports and the client thread waits for the server to
    process the request and reply. The server side is somewhat different. Instead
    of a pool of threads waiting in a message receive loop, a server creates a pool
    of threads. These threads have no scheduling state. When a client invokes a server
    and a server thread is available, the kernel chains the client and server threads
    together and upcalls the server immediately. Many thread attributes, such as scheduling
    attributes, are propagated well as the normal RPC parameters associated with the
    server''s operational interface. When the server completes the service requested
    by the RPC and replies, the server thread becomes empty and a candidate for future
    upcalls. The reply parameters are propagated back to the client which returns
    from the invoke and resumes execution.


    If no servers are available, then the client is blocked. When a server eventually
    becomes available, the scheduling policy selects the appropriate client thread
    based on its scheduling attributes and chains it to the server. In this way, client
    threads are serviced in the correct order. This avoids the anomalies introduced
    by Mach IPCs port queues and ordered message delivery guarantees, making it possible
    for servers to provide service according to client-specified time constraints.


