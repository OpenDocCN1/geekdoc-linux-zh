    You will need to know an IP address for your system, the Net Mask, a Default Gateway
    address, and a DNS nameserver address. If you do not know these values, you should
    ask your Network Administrator.


    Checking “Configure device with bootp” (with the Space bar) indicates that you
    want to query the network for a set of values appropriate for your machine.


    “Configure Network” screen allows you to enter your domain name and host name.
    Hostnames normally consist of 1-8 lower-case alphabetic characters [a-z] and/or
    digits [0-9] (e.g., penguin). Avoid 8-bit characters (e.g., alphabetic characters
    with accents, etc.). If you have any alternate nameservers, you should enter them
    on this screen.


    # “Configure Timezones” Screen


