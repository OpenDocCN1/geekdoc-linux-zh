    A SCSI bus phase is an interval in time during which, by convention, certain control
    signals are allowed or expected, and others are not. The SCSI bus can never be
    in more than one phase at any given time.


    For each of the bus phases, there is a set of allowable phases that can follow.
    For example, the bus free phase can only be followed by the arbitration phase
    or by another bus free phase. A data phase can be followed by a command, status,
    message, or bus free phase.


    Control signals direct the transition from one phase to another. For example,
    the reset signal invokes the bus free phase, while the attention signal invokes
    the message phase.


    The SCSI standard specifies eight distinct phases for the SCSI bus:


    +   **Bus free.** This phase means that no SCSI devices are using the bus and
    the bus is available for another SCSI operation.


    +   **Arbitration.** This phase is preceded by the bus free phase and permits
    a SCSI device to gain control of the SCSI bus. During this phase, all devices
    wishing to use the bus assert /BSY signal and put their SCSI ID onto the bus (using
    the data signals). The device with highest SCSI ID wins the arbitration.


    +   **Selection.** This phase follows the arbitration phase. The device that won
    arbitration uses this phase to select another device to communicate with.


    +   **Reselection.** This optional phase is used by systems that allow peripheral
    devices to disconnect and reconnect from the bus during lengthy operations.'
