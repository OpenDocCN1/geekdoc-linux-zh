    # Performance


    Comparing Pentium performance with PowerPC performance


    > “Early benchmark tests show the PowerPC running about 1.5 to nearly 5 times
    faster than a Pentium, depending on the operation.


    BYTE, August 1993, page 64


    Though Pentium was originally touted as the fastest mainstream microprocessor
    for personal computers, PowerPC is challenging that position with equal or superior
    performance ratings when running identical applications. Especially notable is
    that PowerPC outperforms Pentium by as much as 30 percent when running floating-point
    calculations in applications such as computer-aided design, and other computation-intensive
    programs. (See the “PowerPC 601 versus Pentium” chart). Pentium is faster than
    the 80486 in floating-point calculations, but significantly slower than the PowerPC
    601.


    It is true that floating-point performance is not critical for some of today''s
    desktop computing programs, such as word processing or basic spreadsheet applications,
    so the Pentium disadvantage in floating-point performance is not critical for
    these applications (or at least for the versions of these applications that have
    been thus far). But the many professionals who use sophisticated applications,
    such as complex spread-'
