    Aha! By using the **a flag**, we get Linux to list all the files and directories
    in the directory. By default, items names begin with periods (usually pronounced
    as "dot"), as in "dot-aliases". The **G flag**, by the way, suppresses printing
    of group information.


    The first two directories we see are . and .. directories. We can tell that they
    are directories by the leading **d** in the first (permissions) field. The first
    of these directories (..) is an alternative name for the **current directory**
    (wherever we might be).


    The second directory (..) is an alternative name for our **parent directory**.
    So, if you know that a file **bar** is located in a sibling directory named **foo**,
    you can access it as **../foo/bar**.


    Although everything else in the listing is owned by **linux**, the parent directory
    is owned by **root**. Most of the directories and files in MLLinux are owned by
    administrative accounts like **root** and **bin**, with read-only permissions
    for the rest of the world. This allows ordinary users to examine the files, but
    not to modify them, lest critical files be damaged or lost.


    The rest of the list is taken up by user configuration files of one sort or another.
    The **bashrc** file, for instance, is read by **bash** whenever it starts up a
    new instance of the shell.


