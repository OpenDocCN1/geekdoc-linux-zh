    # Kernel Abstractions


    Although it is a goal of the Mach kernel to minimize abstractions provided by
    the kernel, it is not a goal to be minimal in the semantics associated with those
    abstractions. As such, each of the abstractions provided a rich set of semantics
    associated with it, and a complex set of interactions with the other abstractions.
    Although this makes it difficult to identify key ideas, the main kernel abstractions
    are considered to be the following:


    +   - The unit of resource allocation: large address space, port rights.


    +   - Thread - The unit of CPU utilization, lightweight (low overhead).


    +   - Port - Communication channel, accessible only via send/receive capabilities
    (rights).


    +   - Message - Collection of data objects.


    +   - Memory object - Internal unit of memory management.


    The kernel provides some memory management, of course. Memory is associated with
    tasks. Memory objects are the means by which tasks take over memory management.


    # Tasks And Threads


    The Mach kernel does not provide the traditional notion of the process. This is
    for two main reasons:


    +   - Any given operating system environment has considerable semantics associated
    with a process (such as user ID, signal state, etc.). It is not the purpose of
    the Mach kernel to understand or provide these extended semantics.


    +   - Many systems (BSD, for example) equate a process with an execution point
    of control. Some systems (POSIX 1003.4a, for example) do not. Mach wishes to support
    multiple points of control in a way separate from any given operating system environment''s
    notion of process.'
