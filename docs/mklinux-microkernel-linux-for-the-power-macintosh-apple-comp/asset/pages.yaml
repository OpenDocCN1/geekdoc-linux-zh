    # Getting Started


    If you are an old hand at Linux, feel free to skim this chapter; it is a very
    brief introduction to MkLinux in particular and Linux in general, aimed largely
    at Mac OS users.


    If you are new to Linux, you should read this introduction fairly, then follow
    up your reading with a few exploratory sessions. We suggest The UNIX Programming
    Environment as a clear and concise introductory text on UNIX command syntax, tools,
    and philosophy.


    More generally, you should look over the extensive lists of reading and other
    resources included in the Hardware and Software Bibliography chapters at the end
    of this book. MkLinux is a very large system, but it is well served by books,
    magazines, mailing lists, web sites, and other sources of information. You are
    not alone...


    # Logging In


    Unlike Mac OS, MkLinux will not interact with a user until the user has logged
    in. Further, it allows different users to log in, maintaining unique sets of information
    for each login session. Finally, when a user is finished with a session, s/he
    is responsible for logging out, as discussed below.'
