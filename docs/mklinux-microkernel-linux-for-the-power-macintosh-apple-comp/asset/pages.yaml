  md: '# xxvi MkLinux: Microkernel Linux for the Power Macintosh


    MkLinux is able to use a wealth of Linux (and more generally, UNIX) freeware,
    which is available as source code.


    +   - Learning curve

    Mac OS has a very shallow learning curve. Mac OS users are famous for their habit
    of running applications long before they read the manual.

    MkLinux has a long and steep learning curve, supported by a vast body of online
    and printed documentation. Novice users who ask too many questions are typically
    advised to “Read The Fine Manual” (RTFM).


    +   - Multiple users

    Mac OS is a single-user operating system; only one person may use the computer
    at a given time.

    MkLinux is capable of supporting dozens or even hundreds of users at the same
    time, limited only by the hardware’s speed and memory capacity.


    +   - Multitasking

    Mac OS does not currently support pre-emptive multitasking. Each application must
    tell Mac OS when it is willing to be interrupted.

    MkLinux supports fully pre-emptive multitasking. Programs may be interrupted by
    the system, re-scheduled, and even swapped out.


    +   - Network support

    Mac OS systems can share resources (e.g., files and devices) with each other and
    with systems which emulate Apple’s protocols. By means of third-party programs,
    Mac OS systems can support FTP, HTTP, PPP, Telnet, and other networking protocols.

    MkLinux can share files with other NFS-capable systems. MkLinux has built-in support
    for most common networking protocols.


    +   - Networked applications

    Mac OS and its applications are not, in general, designed to be used over a network.
    X Window servers are available from third-party vendors.'
