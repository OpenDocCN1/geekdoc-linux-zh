  md: '# 90 MkLinux Microkernel Linux for the Power Macintosh


    Other configurations are possible; see


    ML/osfmk/src/mach_kernel/conf/POWMAC/


    for more information. Now, unless you are building an MP-capable microkernel,
    issue the build command, as:


    ```

    $ build -here mach_kernel \\

    MACH_KERNEL_CONFIG=DEBUG

    ```


    Note: Kernels which include debugging support suppress of DMA on the serial ports.
    The modem and printer ports are used for remote debugging and console interaction,
    respectively. They should be hooked up to a terminal or to another machine (standard
    RS-232, 9600 baud).


    +   * Building an MP-capable microkernel.


    If you have a microprocessor, you may wish to build an MP-capable microkernel.
    This allows programs to run on different CPUs, yielding improved performance (i.e.,
    throughput and response time).


    DR3 supports two-way (2 CPUs) multiprocessing on the Power Macintosh 9500/180MP
    and 9600/200MP, as well as certain third-party processor replacement cards that
    are based on the Daystar design.


    > Note: As DR3, the code to operate Daystar-style cards is under non-disclosure
    agreement between Apple Computer and Daystar. Consequently, only the object file
    (MP_2p.o) is distributed with the release.


    The build process for MP-capable microkernels is substantially more complicated
    than the normal build. You must create a dummy source file (MP_2p.s), do a partial
    build, wait for the link stage to fail, then add in the object file (MP_2p.o)
    and restart the build. Here goes...


    ```

    $ touch mach_kernel/ppc/POWMAC/mp/MP_2p.s\n$ build -here mach_kernel \\

    MACH_KERNEL_CONFIG=DEBUG+MP+KDB\n\n$ su

    Password: [...silent...]

    # mount /mnt/cdrom

    # cp /mnt/cdrom/mkilinux_source/MP_2p.o \\

    ../obj/powermac/mach_kernel/DEBUG+MP+KDB/

    ```'
