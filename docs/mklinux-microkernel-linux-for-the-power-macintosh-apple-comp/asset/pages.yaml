  md: '# Chapter 5: Essential System Administration


    **Inspecting Files.** Unlike Mac OS, MkLinux allows many sorts of things to reside
    in the system file. The file `/dev/cual`, for instance, is actually a connection
    to driver for the modem serial port. The file `/dev/modem`, in contrast, is a
    symbolic link (alias, in Mac OS terms) to `/dev/cual`


    This provides great convenience and flexibility for programmers and users. On
    occasion, however, it''s nice to know exactly what a given item is. We can inspect
    any item in the system file by the ls command:


    ```

    % ls -al --linux/foo

    -rwxr-x--x linus staff ... /linux/foo

    ```


    The first character in the output line is the file type flag, which indicates
    what kind of "file" this is. Here are some common file type flags:


    +   - ordinary file

    - b special file

    - c character special file

    - d directory

    - 1 symbolic link

    - p named pipe special file


    In this case, the "file" is really a file. Further, it is owned by a user named
    linus, has group staff, and has permissions -rwxr-x--. (For more information on
    the flags and output of the ls command, try `man 1 ls`).


    We discussed file mode bits again. Now we get to look at the file''s owner (linus)
    to read, write, and execute the file. The first set of mode flags (rwx) allows
    him to execute the file. The second set (x--) allows any member of the staff group
    to read and execute the file. Finally, the third set (--) prevents anyone from
    accessing the file in any way.


    The actual situation is a bit more complicated, of course. To gain access to the
    file, a user must also satisfy the permissions on directories /, /u, and /u/linux.
    And, of course, root can almost entirely ignore permissions.'
