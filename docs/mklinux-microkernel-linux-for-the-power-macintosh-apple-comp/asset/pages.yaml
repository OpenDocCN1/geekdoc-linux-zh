  md: '# 44 MkLinux: Microkernel Linux for the Power Macintosh


    etc lost+found proc tmp


    The cd command lets us Change to a specified Directory. The ls command gives a
    minimal listing of the contents of the current directory, showing both files and
    directories. To get a more complete listing, we can add a flag to the command
    line (e.g., `ls -1`).


    **Note:** Both MkLinux and Mac OS allow the use of mixed case in file names. Under
    MkLinux, however, case is significant. That is, MkLinux treats “foo”, “Foo”, and
    “FOO” as three different entities, whereas Mac OS does not. In addition, MkLinux
    allows the use of special characters in file names, you should be conservative
    in using them, as the shell may see them as wild cards, token separators, etc.


    Each command has its own unique set of flags, which can be used to modify aspects
    of the command''s operation. There are no universal rules regarding flag formation
    or meaning, but there are a couple of common conventions.


    Traditional UNIX flags consist of single letters, each prefaced with a dash (-).
    You generally can combine these flags for brevity (e.g., writing “-a-1” as “-a-1”).


    If more than one of the flags takes an argument, however, be careful to keep the
    arguments in the same order as the flags. Thus, a set of flags and arguments such
    as:


    +   - foo -b -c bar


    may be combinable as:


    +   - abc foo bar


    In general, however, it is best to keep your flag use simple, at least until you
    are quite comfortable with the syntax and range of possible parameters for the
    command in question.


    **Note:** You will see a bit of foo and bar in this book and elsewhere in the
    UNIX community. Derived from fubar (Fouled Up Beyond Recognition), these are used
    as “placeholder” names, when no specific file is intended. For accurate, enlightening,
    and frequently amusing definitions of assorted UNIX jargon, see *The New Hacker’s
    Dictionary*.'
  merge: -1
