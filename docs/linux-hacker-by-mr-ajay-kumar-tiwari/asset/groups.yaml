    \n服务器构建时间：Jul 14 2008 15:36:56\n\n## Hack 83. 按需加载特定模块\n\n有时你可能不想在 Apache 中加载所有模块。例如\n\
    \n你可能只想在测试 LDAP 时才向 Apache 加载与 ldap 相关的模块。这可以按如下方式实现。\n\n修改 httpd.conf 并添加名为 load-ldap\
    \ 的 IfDefine 指令（你可以随意命名）。\n\n```\n<IfDefine load-ldap>\nLoadModule ldap_module\
    \ modules/mod_ldap.so\nLoadModule authnz_ldap_module modules/mod_authnz_ldap.so\n\
    </IfDefine>\n```\n\n当你正在测试 ldap 并希望加载与 ldap 相关的模块时，将 load-ldap 传递给选项 -D，如下所示：\n\
    \n```\n# httpd -k start -e debug -Dload-ldap -f /etc/httpd/conf/httpd.conf.debug\n\
    ```\n\n```\n[Sun Aug 17 14:14:58 2008] [debug] mod_so.c(246):\nloaded module ldap_module\n\
    ```\n\n```\n[Sun Aug 17 14:14:58 2008] [debug] mod_so.c(246):\nloaded module authnz_ldap_module\n\
    ```\n\n[注意：传递 -Dload-ldap 以将 ldap 模块加载到 Apache]\n\n```\n# apachectl start\n```\n\
    \n[注意：如果不想加载 ldap 模块，请正常启动 Apache。]\n\n## 第 11 章：Bash 脚本\n\n## Hack 84. .bash_*\
    \ 文件的执行顺序\n\n以下文件的执行顺序是什么？\n\n- /etc/profile\n- ~/.bash_profile\n- ~/.bashrc\n\
    - ~/.bash_login\n- ~/.profile\n- ~/.bash_logout\n\n### 交互式登录 shell 的执行顺序\n\n以下伪代码解释了这些文件的执行顺序。\n\
    \n```\nexecute /etc/profile\nIF ~/.bash_profile exists THEN\n  execute ~/.bash_profile\n\
    ELSE\n  IF ~/.bash_login exist THEN\n  execute ~/.bash_login\n  ELSE\n  IF ~/.profile\
    \ exist THEN\n  execute ~/.profile\n  END IF\n  END IF\nEND IF\n```\n\n当你退出交互式\
    \ shell 时，执行顺序如下：\n\n```\nIF ~/.bash_logout exists THEN\n  execute ~/.bash_logout\n\
    END IF\n```\n\n请注意，/etc/bashrc 由 ~/.bashrc 执行，如下所示：\n\n```\n# cat ~/.bashrc\n\
    if [ -f /etc/bashrc ]; then\n. /etc/bashrc\nfi\n```\n\n### 交互式非登录 shell 的执行顺序\n\
    \n启动非登录交互式 shell 时，执行顺序如下：\n\n```\nIF ~/.bashrc exists THEN\n  execute ~/.bashrc\n\
    END IF\n```\n\n注意：当非交互式 shell 启动时，它会查找 ENV 环境变量，并执行 ENV 变量中提到的文件名值。\n\n## Hack\
    \ 85. 如何在 bash shell 中生成随机数\n\n使用 $RANDOM bash 内置函数生成 0 – 32767 之间的随机数，如下所示。\n\
    \n```\n$ echo $RANDOM\n106\n$ echo $RANDOM\n22543\n$ echo $RANDOM\n25387\n$ echo\
    \ $RANDOM\n647\n```\n\n## Hack 86. 调试 shell 脚本\n\n要调试 shell 脚本，请在脚本顶部使用 set -xv。\n\
    \n无调试命令的 Shell 脚本：\n\n```\n$ cat filesize.sh\n#!/bin/bash\nfor filesize in $(ls\
    \ -l . | grep \"^-\" | awk '{print $5}')\ndo\n  let totalsize=$totalsize+$filesize\n\
    done\necho \"Total file size in current directory: $totalsize\"\n```\n\n无调试命令的\
    \ Shell 脚本输出：\n\n$ ./filesize.sh\n当前目录总文件大小：652\n\n带有调试命令的 Shell 脚本：\n\n现在在 shell\
    \ 脚本中添加 set -xv 以调试输出，如下所示。\n\n```\n$ cat filesize.sh\n#!/bin/bash\nset -xv\n\
    for filesize in $(ls -l . | grep \"^-\" | awk '{print $5}')\ndo\n  let totalsize=$totalsize+$filesize\n\
    done\necho \"Total file size in current directory: $totalsize\"\n```\n\n带有调试命令的\
    \ Shell 脚本输出：\n\n```\n$ ./fs.sh\n++ ls -l .\n++ grep '^-'\n++ awk '{print $5}'\n\
    + for filesize in '$(ls -l . | grep \"^-\" | awk '{print $5}')'\n+ let totalsize=+178\n\
    + for filesize in '$(ls -l . | grep \"^-\" | awk '{print $5}')'\n+ let totalsize=178+285\n\
    + for filesize in '$(ls -l . | grep \"^-\" | awk '{print $5}')'\n+ let totalsize=463+189\n\
    + echo 'Total file size in current directory: 652'\nTotal file size in current\
    \ directory: 652\n```\n\n使用调试选项执行 Shell 脚本：\n\n除了在 shell 脚本内部给出 set -xv 外，你也可以在执行\
    \ shell 脚本时提供它，如下所示。\n\n```\n$ bash -xv filesize.sh\n```\n\n## Hack 87. 引号\n\n\
    不带特殊字符的 echo 语句。\n\n```\n$ echo The Geek Stuff\n```\n\nThe Geek Stuff\n\necho\
    \ 语句带有一个特殊字符 ; 。分号是 bash 中的命令终止符。在以下示例中，“The Geek” 对 echo 有效，而 “Stuff” 被视为单独的\
    \ Linux 命令并导致命令未找到。\n\n```\n$ echo The Geek; Stuff\n```\n\nThe Geek\n\n-bash:\
    \ Stuff: command not found\n\n为避免这种情况，你可以在分号前添加 \\，这将移除分号的特殊含义并仅将其打印出来，如下所示。\n\
    \n```\n$ echo The Geek\\; Stuff\n```\n\nThe Geek; Stuff\n\n### 单引号\n\n当你想逐字打印单引号内的所有内容时，使用单引号。即使是\
    \ $HOSTNAME 这样的特殊变量也会被打印为 $HOSTNAME，而不是打印 Linux 主机的名称。\n\n```\n$ echo 'Hostname=$HOSTNAME\
    \ ; Message=\\$ is USD'\n```\n\nHostname=$HOSTNAME ;\n\nMessage=\\$ is USD\n\n\
    Current User=`whoami` ;\n\n### 双引号\n\n当你想显示特殊变量的真实含义时，使用双引号。\n\n```\n$ echo \"\
    Hostname=$HOSTNAME ; Message=\\$ is USD\"\nCurrent User=`whoami` ;\n"
