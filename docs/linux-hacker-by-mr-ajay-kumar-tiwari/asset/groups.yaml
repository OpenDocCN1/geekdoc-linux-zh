    以下是 ssh-copy-id 的一些小烦恼。


    - 默认公钥：ssh-copy-id 使用 ~/.ssh/identity.pub 作为默认公钥文件（即当未向选项 -i 传递值时）。相反，我希望它使用 id_dsa.pub
    或 id_rsa.pub 或 identity.pub 作为默认密钥。也就是说，如果其中任何一个存在，它应该将其复制到远程主机。如果存在两个或三个，它应该将
    identity.pub 作为默认值。

    - 代理中没有身份：当 ssh-agent 正在运行且 ssh-add -L 返回“代理中没有身份”（即没有密钥添加到 ssh-agent）时，ssh-copy-id
    仍会将消息“代理中没有身份”复制到远程主机的 authorized_keys 条目中。

    - authorized_keys 中的重复条目：我希望 ssh-copy-id 验证远程主机的 authorized_keys 中的重复条目。如果你多次在本地主机上执行
    ssh-copy-id，它会在不检查重复的情况下不断将相同的密钥附加到远程主机的 authorized_keys 文件中。即使有重复条目，一切仍按预期工作。但我希望我的
