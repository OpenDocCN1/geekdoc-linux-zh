  - '[PAGE 149]


    # Linux Hack


    The Geek Stuff


    Ajay Kumar Tiwari


    Echo statement with a special character ; . semi-colon is a command terminator
    in bash. In the following example, “The Geek” works for the echo and “Stuff” is
    treated as a separate Linux command and gives command not found.


    ```

    $ echo The Geek; Stuff

    ```


    The Geek


    -bash: Stuff: command not found


    To avoid this you can add a \ in front of semi-colon, which will remove the special
    meaning of semi-colon and just print it as shown below.


    ```

    $ echo The Geek\; Stuff

    ```


    The Geek; Stuff


    # Single Quote


    Use single quote when you want to literally print everything inside the single
    quote. Even the special variables such as $HOSTNAME will be print as $HOSTNAME
    instead of printing the name of the Linux host.


    ```

    $ echo ‘Hostname=$HOSTNAME ;

    Message=\$ is USD’

    ```


    Hostname=$HOSTNAME ;


    Message=\$ is USD


    ```

    Current User=`whoami` ;

    ```


    Current User=`whoami` ;


    # Double Quote


    Use double quotes when you want to display the real meaning of special variables.


    ```

    $ echo “Hostname=$HOSTNAME ;

    Message=\$ is USD”

    Current User=`whoami` ;

    ```'
