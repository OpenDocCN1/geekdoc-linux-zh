    \ shell script as shown below.\n\n```\n$ bash -xv filesize.sh\n```\n\n## Hack\
    \ 87. Quoting\n\necho statement without any special character.\n\n```\n$ echo\
    \ The Geek Stuff\n```\n\nThe Geek Stuff\n\nEcho statement with a special character\
    \ ; . semi-colon is a command terminator in bash. In the following example, “The\
    \ Geek” works for the echo and “Stuff” is treated as a separate Linux command\
    \ and gives command not found.\n\n```\n$ echo The Geek; Stuff\n```\n\nThe Geek\n\
    \n-bash: Stuff: command not found\n\nTo avoid this you can add a \\ in front of\
    \ semi-colon, which will remove the special meaning of semi-colon and just print\
    \ it as shown below.\n\n```\n$ echo The Geek\\; Stuff\n```\n\nThe Geek; Stuff\n\
    \n### Single Quote\n\nUse single quote when you want to literally print everything\
    \ inside the single quote. Even the special variables such as $HOSTNAME will be\
    \ print as $HOSTNAME instead of printing the name of the Linux host.\n\n```\n\
    $ echo 'Hostname=$HOSTNAME ; Message=\\$ is USD'\n```\n\nHostname=$HOSTNAME ;\n\
    \nMessage=\\$ is USD\n\nCurrent User=`whoami` ;\n\n### Double Quote\n\nUse double\
    \ quotes when you want to display the real meaning of special variables.\n\n```\n\
    $ echo \"Hostname=$HOSTNAME ; Message=\\$ is USD\"\nCurrent User=`whoami` ;\n"
