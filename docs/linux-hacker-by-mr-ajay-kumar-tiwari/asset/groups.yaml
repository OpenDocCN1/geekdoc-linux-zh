    \ = 8225280 bytes\nDevice Boot\n/dev/sda1\nStart\n1\nEnd\n34893\nBlocks\n280277991\n\
    Id\n83\nSystem\nLinux\nCommand (m for help): q\n```\n\n## Hack 66. Format a partition\
    \ using mke2fs\n\nAfter partitioning the disks, it is still not ready for usage,\
    \ as we need to format the disk. At this stage, if you try to view the disk information,\
    \ it will give the following error message indicating that no valid superblock\
