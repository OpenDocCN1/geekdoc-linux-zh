    \ and swap memory.\n\nSyntax: free [options]\n\n### What is the total RAM on my\
    \ system?\n\nIn the example below, the total physical memory on this system is\
    \ 1GB. The values displayed below are in KB.\n\n```\n# free\n              total\
    \       used       free     shared    buffers     cached\nMem:       1034624 \
    \   1006696      27928          0      174136     615892\n-/+ buffers/cache:\n\
    Swap:      2031608          0     2031608\n```\n\n### What is the total memory\
    \ on my system including RAM and Swap?\n\nIn the following command:\n\n- option\
    \ m displays the values in MB\n- option t displays the \"Total\" line, which is\
    \ sum of physical and swap memory values\n\noption o is to hide the buffers/cache\
    \ line from the above example.\n\n```\n# free -mto\n```\n\nOutput:\n\n| | total\
    \ | used | free | shared | buffers | cached |\n|---|---|---|---|---|---|---|\n\
    | Mem | 1010 | 983 | 27 | 0 | 170 | 601 |\n| Swap | 1983 | 0 | 1983 | | | |\n\
    | Total | 2994 | 983 | 2011 | | | |\n\n## Hack 90. Top Command\n\ntop command\
    \ displays real time information about various performance metrics of the system\
    \ such as CPU Load, Memory Usage, Processes list etc.\nSyntax: top [options]\n\
    \n### How to view my current system status including CPU usage?\n\nExecute top\
    \ without any option from the command line, which will display the output shown\
    \ below. The top command output will keep displaying the real-time values, until\
    \ you press \"Control + c\" or q to exit from the command output.\n\n```\n# top\n\
    top - 13:10:13 up 171 days, 20:21, 3 users, load average: 0.01, 0.05, 0.00\nTasks:\
    \ 194 total, 1 running, 193 sleeping, 0 stopped, 0 zombie\nCpu(s): 0.6% us, 0.7%\
    \ sy, 0.0% ni, 98.7% id, 0.0% wa, 0.0% hi, 0.0% si\nMem: 1034624k total, 1007420k\
    \ used, 27204k free, 174540k buffers\nSwap: 2031608k total, 0k used, 2031608k\
    \ free, 615904k cached\nPID USER PR NI VIRT RES SHR S %CPU %MEM TIME+ COMMAND\n\
    11912 apache 15 0 31828 13m 3916 S 10.2 0:46.35 httpd\n19299 oracle 19 0 279m\
    \ 18m 17m S 10.2 0:00.03 oracle\n11398 jsmith 16 0 107m 28m 6404 S 0.4 0:03.07\
    \ perl\n```\n\n### How to read the output of the top command shown above?\n\n\
    - Line 1 \"top\", indicates that the system has been up and running for 171 days.\n\
    - Line 2 \"Tasks\", displays the total number of processes along with a breakdown\
    \ of running, sleeping, stopped and zombie processes count.\n- Line 3 \"Cpu(s)\"\
    \ displays the current CPU utilization of the system. In this example, CPU is\
    \ 98.7% idle\n- Line 4 \"Mem\" and line 5 \"Swap\" provides the memory information.\
    \ This is the same information from the free command.\n\nThe rest of the lines\
    \ display all the active processes on the system, sorted default by CPU usage\
    \ (%CPU column). i.e the most CPU intensive processes will be displayed on the\
    \ top by default.\n\nThere are several command line options and interactive options\
    \ available for top commands. Let us review couple of essential options for top\
    \ command.\n\n### How to identify the most memory intensive processes?\n\nWhile\
    \ the output of the top command displayed, press F, which will display the following\
    \ message and show all fields available for sorting, press n (which is for sorting\
    \ the processes by Memory) and press enter. This will display the processes in\
    \ the top output sorted by memory usage.\n\nCurrent Sort Field: K for window 1:Def\n\
    \nSelect sort field via field letter, type any other key to return\n\n### How\
    \ to add additional fields (for e.g. CPU Time) to the top output?\n\nWhile the\
    \ top command is running, press f, which will display the following message and\
    \ show all fields available for display, press l, which will add the CPU Time\
    \ to the display columns in the top output.\n\nCurrent Fields: AEHIOQTWKNMbcdfgjplrsuvyzX\
    \ for window 1:Def\n\nToggle fields via field letter, type any other key to return\n\
    \n### How to get the full path name and parameters of the running processes?\n\
    \nWhile the top command is running, press c, which will display full pathname\
    \ of running processes as shown below in the command column. i.e Instead of httpd,\
    \ it displays /usr/local/apache2/bin/httpd.\n\n```\nPID USER PR NI VIRT RES SHR\
    \ S %CPU %MEM TIME+ COMMAND\n11912 apache 15 0 31828 13m 3916 S 0.2 0:46.35 /usr/local/apache2/bin/httpd\n\
    ```\n\n### How to view the individual CPUs in the top command?\n\nWhile the top\
    \ command is running, press 1 (number one), which will display the performance\
    \ data of the individual CPUs on that machine as shown below.\n\n```\ntop - 13:10:13\
    \ up 171 days, 20:21, 3 users, load average: 0.01, 0.05, 0.00\nTasks: 194 total,\
    \ 1 running, 193 sleeping, 0 stopped, 0 zombie\nCpu0 : 10.2% us, 2.6% sy, 0.0%\
    \ ni, 86.8% id, 0.3% wa, 0.0% hi, 0.0% si\nCpu1 : 9.6% us, 8.0% sy, 0.0% ni, 82.4%\
    \ id, 0.0% wa, 0.0% hi, 0.0% si\nCpu2 : 1.3% us, 1.3% sy, 0.0% ni, 95.0% id, 2.3%\
    \ wa, 0.0% hi, 0.0% si\nCpu3 : 0.0% us, 0.0% sy, 0.0% ni, 100.0% id, 0.0% wa,\
    \ 0.0% hi, 0.0% si\nMem: 1034624k total, 1007420k used, 27204k free, 174540k buffers\n\
    Swap: 2031608k total, 0k used, 2031608k free, 615904k cached\n```\n\n## Hack 91.\
    \ Ps Command\n\nps command (process status) will display snapshot information\
    \ of all active processes.\n\nSyntax: ps [options]\n\n### How to display all the\
    \ processes running in the system?\n\nUse \"ps aux\", as shown below.\n\n```\n\
    # ps aux | more\n```\n\n```\nUSER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND\n\
    root 1 0.0 0.0 2044 588 ? Ss Jun27 0:00 init [5]\napache 31186 0.0 1.6 23736 17556\
    \ ? S Jul26 0:40 /usr/local/apache2/bin/httpd\napache 31187 0.0 1.3 20640 14444\
    \ ? S Jul26 0:37 /usr/local/apache2/bin/httpd\n```\n\nYou can also use \"ps -ef\
    \ | more\", to get a similar output\n\n### Print the Process Tree\n\nYou can use\
    \ either ps axuf or ps -ejH to display processes in a tree format.\n\nThe tree\
    \ structure will help to visualize the process and it's parent process immediately.\
    \ For clarity purpose, few columns have been cut-off in the output below.\n\n\
    ```\n# ps axuf\n```\n\n```\nroot\nroot\nroot\nroot\nroot\nroot\nroot\nroot\nroot\n\
    511\n511\nOct14\nOct14\nOct14\nOct14\nOct14\nOct 14\nDec03\nDec22\n23:35\n23:35\n\
    0:00 /opt/VRTSralus/bin/beremote\n0:00 \\_/opt/VRTSralus/bin/beremote\n0:00\\\
    _/opt/VRTSralus/bin/beremote\n0:00\\_/opt/VRTSralus/bin/beremote\n0:01\\_/opt/VRTSralus/bin/beremote\n\
    0:00\\_/opt/VRTSralus/bin/beremote\n0:01 /usr/local/sbin/sshd\n1:08 /usr/local/sbin/sshd\n\
    0:00 \\_/usr/local/sbin/sshd\n0:00\\_ -bash\n\\_ ps axuf\n```\n\nNote: You can\
    \ also use pstree command to display process in tree structure.\n\n### View Processes\
    \ Owned by a Particular User\n"
