    ### Vmstat procs 部分


    r 字段：可运行进程的总数


    b 字段：阻塞进程的总数


    ### 内存部分


    Swpd 字段：已使用的交换空间


    Free 字段：可用空闲 RAM


    Buff 字段：用于缓冲区的 RAM


    Cache 字段：用于文件系统缓存的 RAM


    ### 交换部分


    Si 字段：每秒从磁盘交换到内存的内存量


    So 字段：每秒从内存交换到磁盘的内存量


    ### IO 部分


    Bi 字段：从磁盘接收的块数


    Bo 字段：发送到磁盘的块数。


    ### 系统部分


    In 字段：每秒中断数。


    Cs 字段：每秒上下文切换数。


    127


    ## Linux 技巧

