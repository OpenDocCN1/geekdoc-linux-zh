    \ of var-log.zip.\n\n## Hack 48. Tar 命令基础\n\ntar 命令（tape archive，磁带归档）用于将一组文件转换为归档。\n\
    \n语法：tar [options] [tar-archive-name] [other-file-names]\n\n如何为我的主目录下的所有文件和子目录创建一个单一的备份文件？\n\
    \n以下命令在 /tmp 下创建一个名为 my_home_directory.tar 的单一归档备份文件。该归档将包含 /home/jsmith 下的所有文件和子目录。\n\
    \n- 选项 c 表示创建归档。\n- 选项 v 表示详细模式，在执行命令时显示额外信息。\n- 选项 f 表示命令中提到的归档文件名。\n\n```\n\
    # tar cvf /tmp/my_home_directory.tar /home/jsmith\n```\n\n67\n\n## Linux 技巧\n\n\
    Ajay Kumar Tiwari\n\n### 如何查看 tar 归档中的所有文件？\n\n选项 t 将显示 tar 归档中的所有文件。\n\n```\n\
    # tar tvf /tmp/my_home_directory.tar\n```\n\n### 如何从 tar 归档中提取所有文件？\n\n选项 x 将从\
    \ tar 归档中提取文件，如下所示。这将把内容提取到执行命令时的当前目录位置。\n\n```\n# tar xvf /tmp/my_home_directory.tar\n\
    ```\n\n### 如何将 tar.gz 文件提取到特定目录？\n\n```\n# tar xvfz /tmp/my_home_directory.tar.gz\
    \ -C /home/ramesh\n```\n\n## Hack 49. 使用 tar 结合 gzip、bzip2\n\n### 如何使用 tar 与 gzip？\n\
    \n处理 tar.gz 压缩文件时，在 tar 命令中添加选项 z。\n\n```\n# tar cvfz /tmp/my_home_directory.tar.gz\
    \ /home/jsmith\n```\n\n```\n# tar xvfz /tmp/my_home_directory.tar.gz\n```\n\n\
    ```\n# tar tvfz /tmp/my_home_directory.tar.gz\n```\n\n注意：与 bzip2 相比，使用 gzip 更快。\n\
    \n## Linux 技巧\n\nAjay Kumar Tiwari\n\n### 如何使用 tar 与 bzip2？\n\n处理 tar.bz2 压缩文件时，在\
    \ tar 命令中添加选项 j。\n\n```\n# tar cvfj /tmp/my_home_directory.tar.bz2 /home/jsmith\n\
    # tar xvfj /tmp/my_home_directory.tar.bz2\n# tar tvfj /tmp/my_home_directory.tar.bz2\n\
    ```\n\n注意：与 gzip 相比，使用 bzip2 提供了更高级别的压缩。\n\n## Linux 技巧\n\nAjay Kumar Tiwari\n\
    \n## 第 8 章：命令行历史\n\n当你经常使用 Linux 命令行时，有效地使用历史记录可以大幅提升生产力。事实上，一旦你掌握了我在此提供的 15 个示例，你会发现使用命令行更有趣、更有乐趣。\n\
    \n### Hack 50. 使用 HISTTIMEFORMAT 在历史记录中显示时间戳\n\n通常当你从命令行输入 history 时，它会显示命令编号和命令。出于审计目的，如下所示同时显示时间戳可能有益。\n\
    \n```\n# export HISTTIMEFORMAT='%F %T '\n# history\n1\n2\n3\n4\n| more\n2008-08-05\n\
    2008-08-05\n2008-08-05\n2008-08-05\n19:02:39\n19:02:39\n19:02:39\n19:02:39\nservice\
    \ network restart\nexit\nid\n```\n\n```\ncat /etc/redhat-release\n```\n\n注意：你也可以设置以下别名来查看最近的历史命令。\n\
    \n```\nalias h1='history 10'\n```\n\n```\nalias h2='history 20'\n```\n\n```\n\
    alias h3='history 30'\n```\n\n### Hack 51. 使用 Control+R 搜索历史记录\n\n我坚信这可能是你最频繁使用的历史记录功能。当你已经执行了一个很长的命令时，你只需使用关键字搜索历史记录并重新执行该命令，而无需完全输入它。按\
    \ Control+R 并输入关键字。\n\n在以下示例中，我搜索了 red，它显示了历史记录中包含单词 red 的上一个命令“cat /etc/redhat-release”。\n\
    \n### 注意：从命令行提示符按 Ctrl+R，这将显示如下所示的 reverse-i-search 提示符\n\n```\n(reverse-i-search)`red':\
    \ cat /etc/redhat-release\n```\n\n### 注意：当你看到你的命令时按 Enter，这将从历史记录中执行该命令\n\n```\n\
    # cat /etc/redhat-release\n```\n\nFedora release 9 (Sulphur)\n\n有时你想在执行历史记录中的命令之前编辑它。例如，你可以搜索\
    \ httpd，这将显示命令历史中的 service httpd stop，选择此命令并将 stop 改为 start，然后再次重新执行，如下所示。\n\n\
    ### 注意：从命令行提示符按 Ctrl+R，这将显示 reverse-i-search 提示符\n\n```\n(reverse-i-search)`httpd':\
    \ service httpd stop\n```\n\n### 注意：当你看到你的命令时按左右箭头键中的任意一个，这将在执行之前显示命令供你编辑\n\n\
    ```\n# service httpd start\n```\n\n## Linux 技巧\n\nAjay Kumar Tiwari\n\n### Hack\
    \ 52. 使用 4 种不同方法快速重复上一个命令\n\n有时由于各种原因你可能会重复之前的命令。以下是重复上一个已执行命令的 4 种不同方法。\n\n-\
    \ 1. 使用上箭头查看上一个命令并按 Enter 执行它。\n- 2. 在命令行输入 !! 并按 Enter\n- 3. 在命令行输入 !-1 并按 Enter。\n\
    - 4. 按 Control+P 将显示上一个命令，按 Enter 执行它\n\n## Linux 技巧\n\nAjay Kumar Tiwari\n\n\
    ### Hack 53. 从历史记录中执行特定命令\n\n在以下示例中，如果你想重复命令 #4，按如下所示执行 !4。\n\n```\n# history\n\
    1\n2\n3\n4\n| more\nservice network restart\nexit\nid\ncat /etc/redhat-release\n\
    # !4\ncat /etc/redhat-release\nFedora release 9 (Sulphur)\n```\n\n## Linux 技巧\n\
    \nAjay Kumar Tiwari\n\n### Hack 54. 执行以特定单词开头的上一个命令\n\n输入 ! 后跟你想要重新执行的命令的开头几个字母。在以下示例中，输入\
    \ !ps 并按 Enter，执行了以 ps 开头的上一个命令，即 'ps aux | grep yp'。\n\n```\n# !ps\nps aux |\
    \ grep yp\n  root16947 0.0\nSl13:100:00 ypbinding\n  root17503 0.0\nS+19:190:00\
    \ grep yp\n0.1\n0.0\n36516\n4124\n1264 ?\n740 pts/0\n```\n\n### Hack 55. 使用 HISTSIZE\
    \ 控制历史记录中的总行数\n\n将以下两行附加到 .bash_profile 并重新登录 bash shell 以查看更改。在此示例中，只有 450 条命令将被存储在\
    \ bash 历史记录中。\n\n```\n# vi ~/.bash_profile\nHISTSIZE=450\nHISTFILESIZE=450\n```\n\
    \n### Hack 56. 使用 HISTFILE 更改历史文件名称\n\n默认情况下，历史记录存储在 ~/.bash_history 文件中。将以下行添加到\
    \ .bash_profile 并重新登录 bash shell，以将历史命令存储在 .commandline_warrior 文件中而不是 .bash_history\
    \ 文件中。我尚未弄清楚此功能的实际用途。我认为当你想使用不同的历史文件名跟踪不同终端中执行的命令时，这会很有用。\n\n```\n# vi ~/.bash_profile\n\
    HISTFILE=/root/.commandline_warrior\n```\n\n### Hack 57. 使用 HISTCONTROL 从历史记录中消除连续重复的条目\n\
    \n在以下示例中，pwd 被输入了三次，当你执行 history 时，你可以看到它的全部 3 次连续出现。为了消除重复，将 HISTCONTROL 设置为\
    \ ignoredups，如下所示。\n\n```\n# pwd\n# pwd\n# pwd\n# history | tail -4\n  44 pwd\n\
    \  45 pwd\n  46 pwd\n  47 history | tail -4\n```\n\n[注意：如上所示执行 pwd 3 次后，历史记录中有三个\
    \ pwd 命令]\n\n```\n# export HISTCONTROL=ignoredups\n# pwd\n# pwd\n# pwd\n# history\
    \ | tail -3\n  56 export HISTCONTROL=ignoredups\n  57 pwd\n  58 history | tail\
    \ -4\n```\n\n## Linux 技巧\n\nAjay Kumar Tiwari\n\n[注意：即使如上所示执行 pwd 3 次，历史记录中也只有一个\
    \ pwd 命令]\n\n### Hack 58. 使用 HISTCONTROL 在整个历史记录中删除重复项\n\n上面显示的 ignoredups 仅在命令连续时才删除重复项。要在整个历史记录中消除重复项，将\
    \ HISTCONTROL 设置为 erasedups，如下所示。\n\n```\n# export HISTCONTROL=erasedups\n# pwd\n\
    # service httpd stop\n# history | tail -3\n  38 pwd\n  39 service httpd stop\n\
    \  40 history | tail -3\n# ls -ltr\n# service httpd stop\n# history | tail -6\n\
    \  35 export HISTCONTROL=erasedups\n  36 pwd\n  37 history | tail -3\n  38 ls\
    \ -ltr\n  39 service httpd stop\n  40 history | tail -6\n```\n\n[注意：pwd 之后的之前的\
    \ service httpd stop 被删除了]\n\n"
