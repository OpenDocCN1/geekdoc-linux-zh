    ### 技巧 6. 使用“shopt -s cdspell”自动纠正 cd 命令中输入错误的目录名


    使用 shopt -s cdspell 自动纠正 cd 命令中的拼写错误，如下所示。如果你打字不好且经常出错，这将非常有帮助。


    ```

    # cd /etc/mall

