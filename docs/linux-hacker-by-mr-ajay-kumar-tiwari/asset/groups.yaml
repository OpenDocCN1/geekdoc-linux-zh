    \ the history.\n\nPlease note that adding ls to the HISTIGNORE ignores only ls\
    \ and not ls -l. So, you have to provide the exact command that you would like\
    \ to ignore from the history.\n\n```\n# export HISTIGNORE=\"pwd:ls:ls -ltr:\"\n\
    # pwd\n# ls\n# ls -ltr\n# service httpd stop\n# history | tail -3\n```\n\n```\n\
