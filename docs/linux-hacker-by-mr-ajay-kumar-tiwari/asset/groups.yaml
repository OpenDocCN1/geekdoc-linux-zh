  mdcn: "\n## Linux 技巧\n\nAjay Kumar Tiwari\n\n## Hack 59. 使用 HISTCONTROL 强制历史不记录特定命令\n\
    \n当你执行命令时，可以通过将 HISTCONTROL 设置为 ignorespace 并在命令前输入一个空格来指示历史忽略该命令，如下所示。我看到很多初级系统管理员对此感到兴奋，因为他们可以从历史记录中隐藏命令。\n\
    \n了解 ignorespace 的工作原理是好的。但作为最佳实践，不要故意从历史记录中隐藏任何内容。\n\n```\n# export HISTCONTROL=ignorespace\n\
    # ls -ltr\n# pwd\n#\nservice httpd stop\n```\n\n[Note: service 命令开头有一个空格，用于忽略该命令不被记录到历史]\n\
    \n```\n# history | tail -3\n67 ls -ltr\n68 pwd\n69 history | tail -3\n```\n\n\
    ## Hack 60. 使用 -c 选项清除所有之前的历史记录\n\n有时你可能想要清除所有之前的历史记录。然而你可能仍然希望历史记录继续向前。\n\n```\n\
    # history -c\n```\n\n## Hack 61. 替换历史命令中的单词\n\n在浏览历史记录时，你可能想要执行不同的命令，但使用刚刚搜索到的命令中的相同参数。\n\
    \n在下面的示例中，vi 命令旁边的 !!:$ 会将前一个命令的参数获取到当前命令。\n\n```\n# ls anaconda-ks.cfg\nanaconda-ks.cfg\n\
    # vi !!:$\nvi anaconda-ks.cfg\n```\n\n在下面的示例中，vi 命令旁边的 !^ 会将前一个命令（即 cp 命令）的第一个参数获取到当前命令（即\
    \ vi 命令）。\n\n```\n# cp anaconda-ks.cfg anaconda-ks.cfg.bak\nanaconda-ks.cfg\n\
    # vi !^\nvi anaconda-ks.cfg\n```\n\n## Hack 62. 为特定命令替换特定参数\n\n在下面的示例中，!cp:2 会在历史记录中搜索以\
    \ cp 开头的上一个命令，取出 cp 的第二个参数并将其替换为 ls -l 命令，如下所示。\n\n```\n# cp ~/longname.txt /really/a/very/long/path/long-filename.txt\n\
    ```\n\n```\n# ls -l !cp:2\n```\n\n```\nls -l /really/a/very/long/path/long-filename.txt\n\
