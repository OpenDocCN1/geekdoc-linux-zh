    ## Hack 92. Df Command


    df command (disk free) displays the amount of total and free disk space available
    on the mounted filesystems.


    Syntax: df [options] [name]


    ### How much GB of disk space is free on my system?


    Use df -h as shown below. Option -h displays the values in human readable format
    (for example: K for Kb, M for Mb and G for Gb). In the sample output below, /
    filesystem has 17GB of disk space available and /home/user filesystem has 70GB
    available.


    ```

    # df -h

    ```


    | Filesystem | Size | Used | Avail | Use% | Mounted on |

    |------------|------|------|-------|------|------------|

    | /dev/sda1 | 64G | 44G | 17G | 73% | / |

    | /dev/sdb1 | 137G | 67G | 70G | 49% | /home/user |


    ### What type of filesystem do I have on my system?


    Option -T will display the information about the filesystem Type. In this example
    / and /home/user filesystems are ext2. Option -a will display all the filesystems,
    including the 0 size special filesystem used by the system.


    ```

    # df -Tha

    ```


    | Filesystem | Type | Size | Used | Avail | Use% | Mounted on |

    |------------|------|------|------|-------|------|------------|

    | /dev/sda1 | ext2 | 64G | 44G | 17G | 73% | / |

    | /dev/sdb1 | ext2 | 137G | 67G | 70G | 49% | /home/user |

    | none | proc | 0 | 0 | - |  | /proc |

    | none | sysfs | 0 | 0 | - |  | /sys |

    | none | devpts | 0 | 0 | - |  | /dev/pts |

    | none | tmpfs | 2.0G | 0 | 2.0G | 0% | /dev/shm |


    ## Hack 93. Kill Command


    kill command can be used to terminate a running process. Typically this command
    is used to kill processes that are hanging and not responding.


    Syntax: kill [options] [pids|commands]


    ### How to kill a hanging process?


    First, identify the process id of the particular process that you would like to
    kill using the ps command. Once you know the process id, pass it as a parameter
    to the kill command. The example below shows how to kill the hanging apache httpd
    process. Please note that typically you should use “apachectl stop” to stop apache.


    ```

    # ps aux | grep httpd

    USER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND

    apache 31186 0.0 1.6 23736 17556 ? Jul26 0:40 /usr/local/apache2/bin/httpd

    apache 31187 0.0 1.3 20640 14444 ? Jul26 0:37 /usr/local/apache2/bin/httpd

    # kill 31186 31187

    ```


    Please note that the above command tries to terminate the process graciously by
    sending a signal called SIGTERM. If the process does not get terminated, you can
    forcefully terminate the process by passing a signal called SIGKILL, using the
    option -9 as shown below. You should either be the owner of the process or a privileged
    user to kill a process.


    ```

    # kill -9 31186 31187

    ```


    Another way to kill multiple processes easily is by adding the following two functions
    to the .bash_profile.


    ```

    function psgrep ()

    {

    ps aux | grep "$1" | grep -v ''grep''

    }


    function psterm ()

    {

    [ ${#} -eq 0 ] && echo "usage: $FUNCNAME STRING" && return 0

    local pid

    pid=$(ps ax | grep "$1" | grep -v grep | awk ''{ print $1 }'')

    echo -e "terminating ''$1'' / process(es):\n$pid"

    kill -SIGTERM $pid

    }

    ```


    Now do the following, to identify and kill all httpd processes.


    ```

    # psgrep http

    ```


    ```

    # psterm httpd

    terminating ''httpd'' / process(es):

    31186

    31187

    ```


    ## Hack 94. Du Command


    du command (disk usage) will print the file space usage for a particular directory
    and its subdirectories.


    ### How much space is taken by my home directory and all its subdirectories?


    In the following example, option -s stands for summary only. i.e it displays only
    the total size of /home/jsmith and not the individual sizes of all the subdirectories
    inside the /home/jsmith. Option -h displays the information in a human readable
    format. i.e K for KB, M for MB and G for GB. The ~ indicates the user home directory.
    This command is same as “du -sh /home/jsmith”


    ```

    # du -sh ~

    320M /home/jsmith

    ```


    To get the subdirectories under /home/jsmith listed, execute the above command
    without the s option.


    ## Hack 95. lsof commands.


    Lsof stands for ls open files, which will list all the open files in the system.


    The open files include network connection, devices and directories. The output
    of the lsof command will have the following columns:


    - COMMAND process name.

    - PID process ID

    - USER Username

    - FD file descriptor

    - TYPE node type of the file

    - DEVICE device number

    - SIZE file size

    - NODE node number

    - NAME full path of the file name.


    ### View all open files of the system


    Execute the lsof command without any parameter as shown below.


    ```

    # lsof | more

    ```


    ```

    COMMAND PID USER FD TYPE DEVICE SIZE NODE NAME

    init 1 root cwd DIR 8,14 0962 /

    init 1 root rtd DIR 8,14 0962 /

    init 1 root txt REG 8,1 32684 983101 /sbin/init

    init 1 root mem REG 8,1 106397 166798 /lib/ld-2.3.4.so

    init 1 root mem REG 8,1 1454802 166799 /lib/tls/libc-2.3.4.so

    init 1 root mem REG 8,1 53736 163964 /lib/libsepol.so.1

    init 1 root mem REG 8,1 56328 166811 /lib/libselinux.so.1

    init 1 root 10u FIFO 0,13 972 /dev/initctl

    migration 2 root cwd DIR 8,14 0962 /

    skipped...

    ```


    The lsof command by itself without may return lot of records as output, which
    may not be very meaningful except to give you a rough idea about how many files
    are open in the system at any given point of view as shown below.


    ```

    # lsof | wc -l

    ```


    3093


    ### View open files by a specific user


    Use lsof -u option to display all the files opened by a specific user.


    ```

    # lsof -u ramesh

    ```


    ```

    vi 7190 ramesh ...

    sshd 7163 ramesh ...

    ```


    A system administrator can use this command to get some idea on what users are
    executing on the system.


    ### List Users of a particular file


    If you like to view all the users who are using a particular file, use lsof as
    shown below. In this example, it displays all users who are currently using vi.


    ```

    # lsof /bin/vi

    ```


    ```

    COMMAND PID USER FD TYPE DEVICE SIZE NODE NAME

    vi 7258 root txt REG 8,1 474608 475196 /bin/vi

    vi 7300 ramesh txt REG 8,1 474608 475196 /bin/vi

    ```


