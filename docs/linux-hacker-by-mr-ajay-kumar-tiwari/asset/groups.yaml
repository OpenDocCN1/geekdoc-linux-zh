    ```\n\n[Note: History did not display pwd and ls]\n\n## Chapter 9: System Administration\
    \ Tasks\n\n## Hack 65. Partition using fdisk\n\nAfter you’ve installed brand new\
    \ disks on your server, you have to use tools like fdisk to partition it accordingly.\n\
    \nFollowing are the 5 typical actions (commands) that you can execute inside fdisk.\n\
