    向上移动 3 级目录并使用 ..（两个点）向上移动 1 级目录。将以下别名添加到你的 ~/.bash_profile 并重新登录，使 .....（五个点）能正常工作。


    ```

    alias ..="cd .."

    ```


    ## Linux 技巧


    ```

    alias ...="cd ../.."

    alias ....="cd ../../.."

    alias .....="cd ../../../.."

    alias ......="cd ../../../../.."

    ```


    Ajay Kumar Tiwari


    ```

    # cd /tmp/very/long/directory/structure/that/is/too/deep

    # .....

    # pwd

    /tmp/very/long/directory/structure/

    ```


    [注意：使用 .....（五个点）向上移动 4 级目录]


    ### 方法 3：使用 cd 后跟连续的点向上导航目录


    以下示例中，cd.....（cd 后跟五个点）用于向上移动 4 级目录。将 5 个点用于向上移动 4 个目录结构非常容易记住，因为当你输入前两个点时，你在想“向上移动一个目录”，之后每增加一个点，就向上移动一级。因此，使用
    cd....（cd 后跟四个点）向上移动 3 级目录，使用 cd...（cd 后跟三个点）向上移动 2 级目录。将以下别名添加到你的 ~/.bash_profile
    并重新登录，使上述 cd.....（五个点）能正常工作。


    ```

    alias cd..="cd .."

    alias cd...="cd ../.."

    ```


    ```

    alias cd...="cd ../.."

    alias cd....="cd ../../.."

    alias cd.....="cd ../../../.."

    # cd /tmp/very/long/directory/structure/that/is/too/deep

    # cd.....

    ```


    [注意：使用 cd..... 向上移动 4 级目录]


    # pwd

    /tmp/very/long/directory/structure

    12


    ## Linux 技巧


    Ajay Kumar Tiwari


    ### 方法 5：使用 cd 后跟数字向上导航目录


    以下示例中，cd4（cd 后跟数字 4）用于向上移动 4 级目录。


    ```

    alias cd1="cd .."

    alias cd2="cd ../.."

    alias cd3="cd ../../.."

    alias cd4="cd ../../../.."

    alias cd5="cd ../../../../.."

    ```


    ### 技巧 3. 使用单个命令执行 mkdir 和 cd


    有时当你创建新目录时，你可能会立即 cd 到新目录以执行某些工作，如下所示。


    ```

    # mkdir -p /tmp/subdir1/subdir2/subdir3

    # cd /tmp/subdir1/subdir2/subdir3

    # pwd

    /tmp/subdir1/subdir2/subdir3

    ```


    将 mkdir 和 cd 合并到单个命令中不是很好吗？将以下内容添加到 .bash_profile 并重新登录。


    ```

    $ vi .bash_profile

    function mkdircd () { mkdir -p "$@" && eval cd "\"\$@\""; }

    ```


    现在，使用单个命令同时执行 mkdir 和 cd，如下所示：


    ## Linux 技巧


    ```

    # mkdircd /tmp/subdir1/subdir2/subdir3

    ```


    Ajay Kumar Tiwari


    [注意：这会自动创建目录并 cd 到它]


    ```

    # pwd

    /tmp/subdir1/subdir2/subdir3

    ```


    ### 技巧 4. 使用“cd -”在最后两个目录之间切换


    你可以使用 cd - 在最后两个当前目录之间切换，如下所示。


    ```

    # cd /tmp/very/long/directory/structure/that/is/too/deep

    # cd /tmp/subdir1/subdir2/subdir3

    # cd -

    # pwd

    /tmp/very/long/directory/structure/that/is/too/deep

    # cd -

    # pwd

    /tmp/subdir1/subdir2/subdir3

    # cd -

    # pwd

    /tmp/very/long/directory/structure/that/is/too/deep

    ```


    ### 技巧 5. 使用 dirs、pushd 和 popd 操作目录栈


    你可以使用目录栈将目录推入其中，然后稍后从栈中弹出目录。本示例中使用了以下三个命令。


    ## Linux 技巧


    - dirs：显示目录栈

    - pushd：将目录推入栈

    Ajay Kumar Tiwari

    - popd：从栈中弹出目录并 cd 到它


    dirs 总是会打印当前目录，然后是栈的内容。即使目录栈为空，dirs 命令仍会仅打印当前目录，如下所示。


    ```

    # popd

    -bash: popd: directory stack empty

    # dirs

    ~

    # pwd

    /home/ramesh

    ```


    如何使用 pushd 和 popd？让我们先创建一些临时目录并将它们推送到目录栈，如下所示。


    ```

    # mkdir /tmp/dir1

    # mkdir /tmp/dir2

    # mkdir /tmp/dir3

    # mkdir /tmp/dir4

    ```


    ```

    # cd /tmp/dir1

    # pushd .

    # cd /tmp/dir2

    # pushd .

    # cd /tmp/dir3

    # pushd .

    # cd /tmp/dir4

    # pushd .

    ```


    ## Linux 技巧


    Ajay Kumar Tiwari


    ```

    # dirs

    ```


    /tmp/dir4 /tmp/dir4 /tmp/dir3 /tmp/dir2 /tmp/dir1


    [注意：dir 命令输出的第一个目录（/tmp/dir4）始终是当前目录，而不是来自栈的内容。]


    此时，目录栈包含以下目录：


    - /tmp/dir4

    - /tmp/dir3

    - /tmp/dir2

    - /tmp/dir1


    最后推送到栈的目录将在顶部。当你执行 popd 时，它会 cd 到栈中顶部的目录条目并将其从栈中移除。如上所示，最后推送到栈的目录是 /tmp/dir4。因此，当我们执行
    popd 时，它会 cd 到 /tmp/dir4 并将其从目录栈中移除，如下所示。


