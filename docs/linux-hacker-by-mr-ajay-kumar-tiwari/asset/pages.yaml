    # Hack 96. Sar Command


    Sar commands comes with the sysstat package. Make sure sysstat is installed.


    If you don’t have sar installed on your system, get it from Sysstat project.


    Sar is an excellent monitoring tool that displays performance data of pretty much
    every resource of the system including CPU, memory, IO, paging, networking, interrupts
    etc.,


    Sar Collects, Reports (displays) and Saves the performance data. Let us look at
    all the three aspects separately


    # Sadc - System activity data collector


    /usr/lib/sadc (System activity data collector) command collects the system data
    at a specified time interval. This uses the daily activity data file that is located
    under /va/log/sa/sa[dd], where dd is the current day.


    # Sa1 shell-script


    /usr/lib/sa1 in-turn calls the /usr/lib/sadcs. sa1 is invoked from the crontab
    as shown below. Run this every 5 minutes or 15 minutes depending on your need.
    I prefer to schedule it for every 5 minutes in the cron tab as shown below.


    ```

    */5 * * * * root /usr/lib/sa/sa1 1 1

    ```


    # Sa2 shell-script


    /usr/lib/sa2 is a shell script that will write a daily report in the /var/log/sa/sa[dd]
    file, where dd is the current day. Invoke the sa2 from the crontab once a day
    at midnight.


    ```

    # 59 23 * * * root /usr/lib/sa/sa2 -A

    ```'
