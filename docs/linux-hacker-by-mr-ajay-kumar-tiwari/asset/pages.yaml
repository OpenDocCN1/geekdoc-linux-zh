    # Chapter 10: Apachectl and Httpd Examples


    After you have installed Apache2, if you want to use apachectl and httpd to it’s
    maximum potential, you should go beyond using start, stop and restart. The 9 practical
    examples provided in this chapter will help you to use apachectl and httpd very
    effectively.


    Apachectl acts as SysV init script, taking arguments like start, stop, restart
    and status. It also acts as front-end to httpd command, by simply passing the
    command line arguments to httpd. So, all the commands you execute using apachectl,
    can also be executed directly by calling httpd.


    If you don’t have Apache, refer to the tutorials: install apache from source or
    install LAMP stack using yum.


