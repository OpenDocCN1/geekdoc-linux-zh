    # Chapter 3: SSH Client Commands


    # Hack 12. Identify SSH Client Version


    Sometimes it may be necessary to identify the SSH client that you are currently
    running and it’s corresponding version number. Use ssh –V to identify the version
    number. Please note that Linux comes with OpenSSH.


    The following example indicates that this particular system is using OpenSSH:


    ```

    $ ssh -V

    ```


    OpenSSH_3.9p1, OpenSSL 0.9.7a Feb 19 2003


    The following example indicates that this particular system is using SSH2:


    ```

    $ ssh -V

    ```


    ssh: SSH Secure Shell 3.2.9.1 (non-commercial version)


    on i686-pc-linux-gnu


    # Hack 13. Login to Remote Host using SSH


    The First time when you login to a remotehost from a localhost, it will display
    the host key not found message and you can give “yes” to continue. The host key
    of the remote host will be added under .ssh2/hostkeys directory of your home directory,
    as shown below.


    ```

    localhost$ ssh -l jsmith remotehost.example.com

    ```


    Host key not found from database.


    Key fingerprint:


