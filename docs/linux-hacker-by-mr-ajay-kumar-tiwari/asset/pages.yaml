    # Hack 100. Nice Command


    Kernel decides how much processor time is required for a process based on the
    nice value. Possible nice value range is: -20 to 20. A process that has a nice
    value of -20 is very high priority. The process that has a nice value of 20 is
    very low priority.


    Use ps axl to display the nice value of all running process as shown below.


    ```

    # ps axl

    FUIDPID PPID PRI NIVSZ RSS WCHAN STAT TTY

    TIME COMMAND

    4010 160 2172 552 -S?

    0:17 init [5]

    1031 34 1900 ksofti SN?

    3:18 [ksoftirq/0]

    101015 -1000 worker S<?

    0:01 [events/0]

    40 51451 25 10 32124 18592 -SNs ?

    0:08 /usr/bin/python /usr/bin/rhn-applet-gui —sm-client-id

    default4

    40 5147 5142 160 3528 604 -S?

    0:00 /sbin/pam_timestamp_check -d root

    1503 17552 4180 160 14208 3920 -S?

    0:01 /home/www/apache2/bin/httpd -f

    /home/www/apache2/conf/httpd.conf -k start

    ```


