    ```


    /tmp/dir4 /tmp/dir4 /tmp/dir3 /tmp/dir2 /tmp/dir1


    [Note: The first directory (/tmp/dir4) of the dir command output is always the
    current directory and not the content from the stack.]


    At this stage, the directory stack contains the following directories:


    +   - /tmp/dir4

    - /tmp/dir3

    - /tmp/dir2

    - /tmp/dir1


    The last directory that was pushed to the stack will be at the top. When you perform
    popd, it will cd to the top directory entry in the stack and remove it from the
    stack. As shown above, the last directory that was pushed into the stack is /tmp/dir4.
    So, when we do a popd, it will cd to the /tmp/dir4 and remove it from the directory
    stack as shown below.


    ```

    # popd

