  \ | 手动和自动配置网络接口并设置默认路由。 |\n| 基础网络故障排除 | 4 | 排除客户端和主机上的网络问题 | 调试与网络配置相关的问题。 |\n|\
  \ 配置客户端 DNS (域名服务) | 2 | 在客户端/主机上配置 DNS | 修改名称解析的顺序，查询远程服务器并配置 DNS。 |\n\n表 2-10\
  \ 领域 109 拆解\n\n为了充分应对这些主题，请关注以下文件、术语和工具：`/etc/hostname``/etc/hosts``/etc/nsswitch.conf``/etc/resolv.conf``/etc/services`、`dig`、`ftp`、`host`、`hostname`、`ifconfig`、`ifdown`、`ifup`、`netstat`、`ping`、`route`、`telnet`、`tracepath`\
  \ 和 `traceroute`。\n\n在学习该领域时，以下需要了解的前十项内容：\n\n*   IPv4 使用分为四个字节的 32 位地址。第一个字节识别地址类别（A、B、C）。地址可以是公共私有的。\n\
  *   `ifconfig` 工具可查看网卡的当前 Internet 协议 (IP) 配置。\n*   `ping` 工具是一个用于测试连接性的全能工具。它向指定的主机发送回显消息以检查其是否可以到达。`ping`\
  \ 可配合回环地址 (127.0.0.1) 使用来测试内部配置。\n*   除了使用 `ping`，您可以使用 `traceroute` 查看到达特定主机的路由。\n\
  *   `route` 工具显示路由表并允许对其进行配置。\n*   `netstat` 工具显示端口的当前状态——打开的端口、监听的端口。\n*   主机名在\
  \ `/etc/hostname` 中配置，可以使用 `hostname` 命令查看。\n*   可以使用 `telnet` 登录到另一个主机，但由于安全性问题不再建议使用。\n\
  *   FTP 服务器可以从一个主机传输文件。\n*   DNS 用于解析名称。\n\n# 安全\n\n表 2-11 显示了此主题的子主题、权重、描述和知识领域。\n\
  \n| **子主题** | **权重** | **描述** | **关键领域** |\n| --- | --- | --- | --- |\n| 执行安全任务\
