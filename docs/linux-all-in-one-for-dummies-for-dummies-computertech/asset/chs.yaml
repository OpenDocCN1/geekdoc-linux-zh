  \ 和 `syslogd`。\n\n在学习该领域时，以下需要了解的前十项内容：\n\n*   网络时间协议 (NTP) 守护进程 (`ntpd`) 维护所有使用\
  \ NTP 的服务器上的时间。\n*   `hwclock` 命令可显示系统硬件时钟（也称为*实时时钟*）的日期和时间。\n*   时区在 `/etc/timezone`\
  \ 文件中配置。本地时间同样在 `/etc/localtime` 中配置。\n*   `sendmail` 服务是一个通用的 SMTP 程序，用于在服务器之间发送电子邮件。\n\
  *   `mailq` 命令显示邮件队列中的消息列表，并与 `sendmail` 一起工作。\n*   `newaliases` 命令为邮件别名文件构建数据库。\n\
  *   可以使用 `.forward` 文件将邮件从一个电子邮件地址转发到另一个地址。\n*   行式打印机已很少使用，但对其仍保持支持。与它们相关的主要的实用程序过去/现在是：`lpr`（提交打印作业）、`lpq`（查看打印队列）和\
