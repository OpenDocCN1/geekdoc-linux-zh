- "# Linux 初学者指南\n\n\n\n![](img/cover.jpg)\n\n![cover.eps](img/cover.jpg)\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n# Linux® 傻呆指南 (For Dummies)\n\n\n\n\n\n\n![check](img/check.png)\
  \ **检查硬件**\n\n![check](img/check.png) **为 Linux 预留硬盘空间**\n\n![check](img/check.png)\
  \ **尝试 Ubuntu Live CD**\n\n![check](img/check.png) **在外部驱动器上安装 Linux**\n\n今天的大多数\
  \ PC 都预装了 `Microsoft Windows` 而不是 Linux。虽然这种安排让大众开箱即用更加方便，但意味着如果你想使用 Linux，通常需要自己安装。\n\
  \n你可能对在 PC 上安装新的操作系统感到有些担心，因为这个过程有点像脑手术——或者像植入一个新大脑，因为你可以在安装 `Microsoft Windows`\
  \ 的基础上安装 Linux。当你安装两个操作系统时，你可以在启动 PC 时选择启动其中一个。在带有 `Windows` 的 PC 上添加 Linux 最令人头疼的问题创建一个新的磁盘分区，这意味着为\
  \ Linux 预留硬盘的一部分空间。安装的其余部分是常规操作——只需按照说明操作即可。如果你想尝试任何 Live 介质版本，不需要进行任何磁盘分区；只需从 Live\
  \ DVD/CD/闪存盘启动 PC 即可。但首先，深吸一口气，然后慢慢呼出。你没什么好担心的。\n\n## 遵循安装步骤\n\n安装任何 Linux 发行版都涉及几个步骤，我会简要带你了解这些步骤，而不涉及细节。然后你可以按照特定发行版的详细步骤来安装你想要的内容。\n\
  \n![distributionspecific](img/distributionspecific.png) 某些 Linux 发行版要求你在安装前准备好关于\
  \ PC 硬件的相关信息。如果你计划安装 `Debian`，请在开始安装之前收集 PC 及其外围组件的信息。幸运的是，大多数 Linux 安装程序都能检测并处理大多数\
  \ PC 外围设备。尽管如此，了解你的 PC 硬件也是个主意，这样在安装过程中出现问题时你可以进行故障排除。\n\n第一步是为你的发行版刻录介质。你可以在任何带有相应刻录机的系统上刻录\
  \ DVD 或 CD。（如果你想刻录 DVD，必须有一个 DVD 刻录机，但 DVD 刻录机可以刻录 CD 和 DVD。）通常，如果你有一台带有 CD/DVD\
  \ 刻录机的 `Windows` PC，可以直接使用该系统刻录 CD。\n\n![remember](img/remember.png) 第二步是确保你的 PC\
  \ 可以从介质所在的驱动器启动。大多数新 PC 可以直接从 DVD/CD 驱动器启动，但某些 PC 可能需要你的干预。通常，PC 可能被设置为从硬盘而非 DVD/CD\
  \ 驱动器启动，你必须进入 Setup（设置）来更改启动设备顺序。\n\n要设置 PC 从 DVD 驱动器启动，你需要在 PC 启动时进入 Setup。进入 Setup\
  \ 和设置启动设备的具体步骤每台 PC 都不同，但通常涉及按下某个键，例如 `F2`。当 PC 启动时，会有一条短消息提示你按哪个键进入 Setup。在 Setup\
  \ 中，你可以将 DVD/CD 驱动器指定为启动设备。当你的 PC 设置好从 DVD 驱动器启动后，只需将 DVD/CD 放入驱动器并重启 PC。\n\n\n\n\
  \n\n在完成几个配置步骤（例如设置网络和时区）后，选择要安装的软件包，然后让安装程序完成剩余的安装工作。某些发行版让过程变得简单；它们取消了软件选择步骤，转而安装一组默认的软件包。\n\
  \n安装完成后，重启电脑。在运行自动配置之前，有时需要先重启电脑。\n\n当 Linux 首次运行时，你将有机会执行一些额外的配置步骤并安装额外的软件包。\n\n\
  ## 检查你的 PC 硬件\n\n如果你担心你的 PC 可能无法运行 Linux，这里是你开始安装 Linux 之前需要考虑的 PC 上的一些关键组件：\n\n\
  - **DVD 驱动器：** 你必须有一个 DVD 驱动器（DVD-ROM 还是 DVD 刻录机），并且 PC 必须能够从该驱动器启动。\n  具体的型号并不重要。重要的是\
  \ DVD 驱动器是如何连接到 PC 的。大多数新 PC 具有连接到硬盘控制器的 DVD 驱动器（`IDE`，集成驱动电子，或 `ATA`，附加附件）。如果你添加了外部\
  \ DVD 驱动器，它最可能连接到 USB 端口。任何 `IDE`/`ATA` 或 `USB` DVD 驱动器在 Linux 中都可以工作。\n\n- **硬盘：**\
  \ 任何 `IDE` 磁盘驱动器在 Linux 中都可以工作。另一种类型的硬盘控制器是 `SCSI`（小型计算机系统接口），Linux 也支持它。为了舒适地安装和玩\
  \ Linux，你需要大约 5GB 的硬盘空间。另一方面，要尝试 Linux 的 Live CD 版本，你不需要在硬盘上留任何空间。\n- **键盘：** 所有的键盘都兼容\
  \ Linux 和 X Window 系统。\n- **显示器：** 显示器的类型不是特别关键，除非它无法能够显示显卡所使用的屏幕分辨率。屏幕分辨率以水平和垂直方向像素元素（`pixels`）的数量表示（例如\
  \ 1024 x 768）。安装程序可以检测大多数现代显示器。如果安装程序没有检测到你的显示器，你可以选择具有特定分辨率的通用显示器类型（例如 1024 x 768）。你也可以通过显示器的品牌和型号来指定，这些信息可以在显示器的背面找到。\n\
  - **鼠标：** 安装程序可以检测鼠标。所有类型的鼠标（如 `PS/2` 或 `USB`）都能兼容 Linux 和 X Window 系统。\n- **网卡：**\
  \ 虽然并非所有的 PC 都有网卡，但现在很难找到不带网卡的电脑。只要你的 PC 有网卡，安装程序可能就能检测并使用该卡，无论它是 `Wi-Fi` 还是有线的。如果你遇到问题，请尝试找到网卡的品牌和型号，以便你可以在网上搜索有关\
  \ Linux 是否支持该卡的信息。\n- **处理器：** 处理器速度以 `MHz`（兆赫）或 `GHz`（吉赫）表示，只要超过 700 `MHz` 就不重要；过去几年制造的大多数处理器速度远高于此。作为一个一般规则，越快越好。Linux\
  \ 可以运行在其他 Intel 兼容处理器上，例如 `AMD` 和 `VIA` 处理器。\n- **内存：** `RAM` 是系统拥有的内存量。和速度一样，`RAM`\
  \ 越大越好。安装 Linux 和 X Window 系统最少需要 512MB。对于某些发行版，最小限制会更高，你仍然需要更多内存才能舒适地运行 GUI 桌面。\n\
  - **SCSI 控制器：** 一些高性能 PC 和旧式工作站具有 `SCSI` 控制器，将硬盘和其他外设设备连接到 PC。如果你的 PC 恰好有一个 `SCSI`\
  \ 控制器，你可能想找出控制器的品牌和型号。\n- **声卡：** 如果你的 PC 有声卡，并且你想在 Linux 中获得声音，你必须确保该卡是兼容的。在成功安装\
  \ Linux 后，你可以配置声卡。\n- **显卡：** Linux 在文本模式下与所有显卡（也称为显示适配器）运行良好良好，但如果你想要 GUI，你需要一张兼容\
  \ X Window 系统的显卡。安装程序可以检测支持的显卡并正确配置 X Window 系统。如果安装程序无法检测你的显卡，知道显卡的品牌和型号会有帮助。\n\
  - **打印机：** 你需要知道计划在 Linux 中使用的任何打印机的品牌和型号。\n\n![tip](img/tip.png) 许多发行版（例如 Debian\
  \ GNU/Linux）可以在任何兼容 Linux 内核的硬件上运行。\n\n![distributionspecific](img/distributionspecific.png)\
  \ 要检查 PC 硬件是否兼容特定的发行版，请访问该厂商的网站查看其硬件兼容列表。\n\n## 为 Linux 留出空间\n\n在典型的 Windows PC\
  \ 中，Windows 位于一个大分区上，占据了整个硬盘。你想缩小该分区为 Linux 腾出空间。在 Linux 安装期间，安装程序将空闲空间用于 Linux\
  \ 分区。\n\n![distributionspecific](img/distributionspecific.png) 要尝试任何 Live CD 发行版（如\
  \ Ubuntu），你不需要对硬盘进行重新分区。只需从 Live CD 启动 PC 即可。安装程序可以无破坏地缩小 Windows 分区，因此你不需要提前执行重新分区步骤。如果你计划在硬盘上安装\
  \ Fedora、Debian 或任何其他 Linux 发行版，必须对硬盘进行重新分区。如果你想在 Windows 下调整分区大小，可以使用商业产品，或者启动\
  \ Linux 发行版并使用 GParted。\n\n在 Ubuntu 启动且 GUI 桌面出现后，按照以下步骤减少 Windows 分区的大小：\n\n1.\
  \ **从 Ubuntu 桌面选择 System -> Administration -> GParted。**\n   出现 GParted 窗口，该工具显示在你的\
  \ PC 上找到的硬盘。第一块硬盘显示为设备 `/dev/sda`；第二块显示为 `/dev/sdb`，依此类推。\n2. **在 GParted 窗口右侧的设备列表中选择硬盘。**\n\
  3. **在分区列表中，选择你想调整大小的分区。**\n   该分区通常是最大的分区。\n4. **选择 GParted -> Resize/Move。**\n\
  5. **设置分区的新大小，然后点击 Resize/Move。**\n   你应该选择一个在分区后留出 4GB 或更多空闲空间的大小。空闲空间的大小显示在对话框的\
  \ Free Space After 字段中。\n6. **当你指定了所有想要做的更改后，点击 Apply 开始操作。**\n7. **当警告出现时，点击 Apply。**\n\
  \   所有等待的操作都将执行，分区将发生更改，你在 Windows 分区后获得了空闲空间。\n\n\n\n\n\n在安装任何内容之前，你会发现尝试 Live\
  \ CD 或可启动的 USB 版本是值得的。除了可以感受一下 Linux 桌面之外，你通常还可以进行一些额外的安装前准备工作。\n\n例如，要启动 Ubuntu，请从\
  \ Live CD 启动你的电脑。会出现一个菜单，允许你进入各种选项来控制启动过程或检查你的系统以查看是否符合硬件要求。你应该选择默认的启动 Ubuntu 选项（如果你在\
  \ 30 秒菜单超时前未做选择，将自动执行）。\n\n几分钟后，你将看到 Ubuntu 使用的 GNOME GUI 桌面，你可以开始探索 Ubuntu。如果你点击\
  \ `Examples` 文件夹，你会发现 Ubuntu 可以完成的几个功能。你还可以选择 `System⇒  Administration⇒  GParted`\
  \ 来重新配置硬盘。\n\n当你完成 Ubuntu 的使用后，选择 `System⇒  Quit`。Ubuntu 关闭时移除 DVD 并按下 `Enter`。如果你决定要安装\
  \ Ubuntu，点击桌面上的 Install 图标开始该过程。\n\n# 在闪盘上安装 Linux\n\n我曾有一段时间是 Linux 发行版 Live CD\
  \ 版本的粉丝，但现在不再了。我喜欢 Live CD 是因为它们让我能够创建廉价的介质分发给学生和用户。这种做法让他们能够在自己的机器上享受 Linux 体验，而无需安装操作系统、改变他们的习惯或承担损坏的风险。此外，这个用户群可以快速从\
  \ Fedora 切换到 Ubuntu、openSUSE 等。我最讨厌 Live CD 发行版的一点是它们运行极其缓慢，并且无法方便地保存配置更改。由于这些重大问题，我一直在寻找更好的解决方案。幸运的是，我找到了：可启动的\
  \ USB 发行版。\n\n可启动 USB 发行版已经存在一段时间了，但它们的缺点曾阻碍我拥抱它们。然而，较新的工具，例如 Fedora Media Writer\
  \ ([`github.com/MartinBriza/MediaWriter``](https://github.com/MartinBriza/MediaWriter))，简化了创建方法，使得大多数用户可以在没有引导的情况下完成。安装过程是非破坏性的，允许你保留\
  \ USB 闪盘上的现有文件，并且保留更改（数据持久化）非常简单。\n\n在本章的剩余部分中，我将向你展示如何创建一个可启动的闪盘并在自己的环境中使用它。\n\n\
  ## 创建可启动的闪盘\n\n虽然你可以在 Linux 中使用命令行方法创建可启动的闪盘，但简单的方法是使用 Windows。（我意识到建议从 Windows\
  \ 制作 Linux 启动介质听起来像是异端邪，但大多数对 Linux Live USB 实现感兴趣的用户可能运行 Windows。）按照以下步骤创建可启动的闪盘：\n\
  \n1. **下载你想要使用的启动程序。**\n2. **安装并运行该程序。**\n3. **在目标设备（Target Device）部分，选择闪盘。**\n\
  \   闪盘可能会以 `TravelDrive` 等名称出现。\n4. **选择镜像（ISO 文件）的来源。**\n   如果你的互联网连接较慢，可以使用一个\
  \ Live CD 来提取 ISO 文件。如果互联网连接更快，使用 Download 选项访问当前的 ISO 文件。\n5. **如果提示，请设置持久化存储（Persistent\
  \ Storage）大小。**\n   *持久化存储*是分配给安装的始终可用的存储空间。我建议至少使用 300MB 的值。（我不知道为什么默认是 0MB。）\n\
  6. **点击 Create Live USB 按钮，坐在旁边观察进度。**\n   准备好等待十分分钟完成完成。驱动器上通常会创建两个文件夹：`syslinux`（小于\
  \ 7MB，负责启动）和 `LiveOS`（大小取决于你的存储设置）。\n7. **关闭应用程序，并测试新的启动盘。**\n\n## 排除工作站故障\n\n我尝试了几个闪盘，只要安装后剩余至少\
  \ 1GB 的可用空间，就没有遇到过任何一个问题。较小的驱动器（2GB 或更小）通常以 FAT（文件分配表）出厂格式，较大的则用 FAT32 格式化；据我所知，格式化对安装或可用性没有任何影响。\n\
  \n你必须确保工作站设置允许机器从 USB 启动，这通常需要重新配置 BIOS。按照以下步骤操作：\n\n1. **重启工作站，并按下进入 BIOS 配置的键。**\n\
  \   通常，此键是 `F12` 或 `DEL`；有时是 `F1` 或 `F2`。\n2. **打开启动菜单，并选择 Boot USB Devices First（优先启动\
  \ USB 设备）或类似的设置。**\n   ![tip](img/tip.png) 在某些电脑上，闪盘隐藏在启动 BIOS 的硬盘部分。在这种情况下，选择 `Boot⇒ Hard\
  \ Drives`；将主硬盘更改为存储介质；然后确保 USB 是启动设备列表下的第一个选项。如果从 USB 启动的选项是 Enable/Disable（启用/禁用），选择\
  \ `Enable`；进入启动设备顺序；并将 USB 选择移动到硬盘选择之上。\n3. **保存更改并退出 BIOS 配置。**\n   此时，工作站将继续重启，并且（如果你的\
  \ USB 闪盘已插入）应该会启动 Fedora。\n   ![tip](img/tip.png) 如果你看到单行条目 `Boot Error` 而没有发生其他情况，请根据制造商的说明更新系统\
  \ BIOS。\n\n## 使用新驱动器工作\n\n当你的系统启动时，Fedora 环境的加载速度比通过 Live CD 加载得多。USB 闪盘显示在其上创建的新文件夹，其他设备也可以像常一样访问。Install\
  \ to Hard Drive（安装到硬盘）图标仍留在桌面上，如果你决定这样做，可以快速永久切换到 Fedora。\n\n![tip](img/tip.png)\
  \ 使用操作系统不需要连接互联网，但我强烈建议连接网络，因为大多数用户会想要下载额外的程序来进一步测试操作系统的功能。\n\n恭喜你！你可以开始使用 Linux\
  \ 了。\n\n# 第 3 章：Linux 的故障排除与配置\n\n## 本章内容\n\n![check](img/check.png) **安装故障**\n\
  ![check](img/check.png) **配置 X Window 系统**\n![check](img/check.png) **解决安装问题**\n\
  ![check](img/check.png) **设置你的打印机**\n![check](img/check.png) **管理你的 DVD 和 CD-ROM**\n\
  ![check](img/check.png) **安装额外的软件包**\n\n在安装 Linux 期间，安装程序会尝试检测关键硬件组件，例如网卡和任何已安装的外设。根据检测到的情况，安装程序引导你通过一系列安装步骤。例如，如果安装程序无法检测网卡，它通常会跳过网络配置步骤。如果你确实没有网卡，这种遗漏是可以的；但如果你有网卡而安装程序错误地认为你没有，那么你就遇到了安装问题。\n\
  \n另一个安装问题可能发生在你重启电脑并看到文本终端而不是图形登录界面时。此错误意味着 X Window 系统配置出现问题。\n\n此外，Linux 安装程序通常不包含对\
  \ PC 系统上每个硬件的配置程序。例如，大多数安装在安装期间不会设置打印机。\n\n在本章中，我将向你展示一些解决安装问题的方法。你将学会如何配置 X Window\
  \ 系统以图形用户界面（GUI）屏幕启动，以及如何配置打印机。\n\n\n\n\n\n你可能还需要安装额外的软件包包，因此本章将引导你了解如何安装不同格式的软件包，例如红帽软件包管理器\
  \ (RPM) 和 Debian 软件包——这是大多数 Linux 软件分发的两种格式。\n\n## 使用文本模式安装\n\n大多数 Linux 安装程序都会尝试使用\
  \ X Window 系统 (X) 来显示图形化安装界面。如果安装程序无法检测到显卡，例如 X 就不会启动。如果由于此或其他任何原因安装程序无法启动 X，你始终可以回退到文本模式安装。然后，你可以手动指定显卡，或稍后使用单独的配置程序配置\
  \ X。你也可以通过编辑其文本配置文件来配置 X。\n\n[`表 3-1`] 列出了如何进入文本模式安装界面。通常，文本模式的安装顺序与本微型书[第 2 章]概述的图形化安装顺序相似。你需要根据提示进行操作并执行安装。\n\
  \n| **发行版** | **如何进入文本模式安装程序** |\n| --- | --- |\n| Debian | 默认以文本模式运行。 |\n| Fedora\
  \ | 从 Fedora CD 或 DVD 启动 PC 后，在 `boot:` 提示符处输入 `text`。 |\n| Knoppix | 在 `boot:`\
  \ 提示符处输入 `knoppix 2` 以文本模式启动 Knoppix（因为 Knoppix 是一个式发行版，你不需要安装它）。 |\n| SUSE | 在第一个安装界面，按\
  \ `F3`，使用方向键选择文本模式选项，然后按 `Enter`。 |\n| Ubuntu | 默认以文本模式运行。 |\n\n[`表 3-1`] 某些 Linux\
  \ 发行版中的文本模式安装\n\n## X 的故障排除\n\n每当我在旧款 PC 上安装 Linux 时，GUI 安装在安装过程中运行良好，但在安装完成后首次重启\
  \ PC 时，图形化登录界面并没有出现。相反，我最终面对的是文本登录界面，或者是一个中间有一个有一个小 X 的黑屏，又或是启动过程似乎卡在了灰色屏幕上。如果这个问题发生在你身上，可以按照以下方法进行故障排除：\n\
  \n1. **按 `Ctrl+Alt+Delete` 重启 PC。**\n   PC 开始启动。你将进入一个 `GRUB`（全局统一引导加载程序）提示你启动哪个操作系统的界面。（如果该发行版使用\
  \ `LILO` 作为引导加载程序，你将看到文本提示符。）\n\n2. **对于 `GRUB`，按 `A` 键添加一个告诉 Linux 内核启动到提示符的；对于\
  \ `LILO`，跳过此步骤。**\n   `GRUB` 引导加载程序会显示 Linux 内核命令行并提示你添加想要的内容。\n\n3. **对于 `GRUB`，输入空格和单词\
  \ `single` 并按 `Enter`；对于 `LILO`，输入 `linux single` 并按 `Enter`。**\n   Linux 内核以单用户模式启动并显示一个以井号结尾的提示符，如下：\n\
  \   ```\n   #\n   ```\n   现在你可以准备配置 X 了。\n\nX 使用配置文件（`XF86Config-4` 或 `xorg.conf`，取决于发行版）来确定显示卡、显示器以及你想要的屏幕分辨率。Linux\
  \ 安装程序会准备配置文件，但有时配置是不正确的。\n\n要快速创建一个可用的配置文件，请遵循以下步骤：\n\n1. **输入以下命令：**\n   ```\n\
  \   X -configure\n   ```\n   X 服务器运行并创建一个配置文件。屏幕变为空；随后 X 服务器在显示一些消息后退出。在 Fedora\
  \ 中，消息的最后一行显示：\n   ```\n   To test the server, run 'X -config ///etc/xorg.conf.new'\n\
  \   ```\n\n2. **使用 `vi` 等文本编辑器编辑 `///etc/xorg.conf.new` 文件，并在 `Section \"Files\"\
  ` 行之后插入以下行：**\n   ```\n   FontPath \"unix/:7100\"\n   ```\n   在 Fedora 中，你还必须将 `/dev/mouse`\
  \ 改为 `/dev/input/mice`。\n\n3. **输入 `xfs &` 启动 X 字体服务器。**\n\n4. **通过输入以下行尝试新配置文件：**\n\
  \   ```\n   X -config ///etc/xorg.conf.new\n   ```\n   如果你看到一个带有 X 形光标的空白屏幕，说明配置文件工作正常。\n\
  \n5. **按 `Ctrl+Alt+Backspace` 杀死 X 服务器。**\n\n6. **使用以下命令将新配置文件拷贝到 `/etc/X11` 目录：**\n\
  \   ```\n   cp ///etc/xorg.conf.new /etc/X11/xorg.conf\n   ```\n\n7. **按 `Ctrl+Alt+Delete`\
  \ 或输入 `reboot` 重启 PC。**\n   如果一切顺利，你应该能看到图形化登录界面。\n\n![tip](img/tip.png) 使用 X 服务器的\
  \ `-configure` 选项创建的 X 配置没有以最佳分辨率显示。要精调配置文件，你必须在重启系统后运行实用程序来调整显示设置。使用哪种实用程序取决于 Linux\
  \ 发行版，但大多数发行版都包含一个可以通过 GUI 配置显卡、显示器和显示设置的实用程序。\n\n## 解决其他安装问题\n\n我确定没有列尽所有隐藏的安装问题。没有人能做到。Intel\
  \ x86 PC 中存在这么多组件，根据墨菲定律实际上要求存在某些安装程序无法处理的硬件组合。在本节中，我列了一些已知问题。对于其他问题，我建议你去 Google\
  \ Groups ([`groups.google.com`](https://groups.google.com/)) 并输入故障的某些症状。假设其他人也遇到了类似的问题，你可以获得关于如何解决你特定困境的启示。\n\
  \n### 使用 Knoppix 启动命令\n\nKnoppix Live CD 是一个很好的故障排除工具，因为 Knoppix 擅于检测硬件，并且可以直接从启动介质（CD/DVD/USB）运行。\n\
  \n![tip](img/tip.png) 如果启动 Knoppix 有困难，尝试在 `boot:` 提示符处输入 Knoppix 启动命令。例如，如果 Knoppix\
  \ 在尝试检测 SCSI 卡时卡住，可以在 `boot:` 提示符处输入 `knoppix noscsi` 来禁用 SCSI 探测。或者，如果你想让 X 服务器加载\
  \ `nv` 模块（用于 NVIDIA 芯片的图形），可以在 `boot:` 提示符处输入 `knoppix xmodule=nv`。\n\n[`表 3-2`]\
  \ 列了一些常用的 Knoppix 启动命令。\n\n| **启动命令** | **其功能** |\n| --- | --- |\n| `expert` | 以专家模式启动，允许用户交互式地设置和配置\
  \ Knoppix。 |\n| `failsafe` | 在不尝试检测硬件启动（启动 Linux 所需的最基本硬件除外）。 |\n| `fb1280x1024`\
  \ | 在指定的分辨率下使用固定帧缓冲区图形。（指定你需要的分辨率，例如 1024 x 768 或 800 x 600。） |\n| `knoppix 1` |\
  \ 以运行级别 1（单用户模式）启动 Knoppix，你可以用它来执行救援操作。 |\n| `knoppix 2` | 在运行级别 2 启动，提供文本模式 shell\
  \ 提示符。 |\n| `knoppix acpi=off` | 禁用 ACPI（高级配置电源接口）。 |\n| `knoppix atapicd` | 使用\
  \ ATAPI CD-ROM 接口而不是为 IDE CD-ROM 驱动器模拟 SCSI 接口。 |\n| `knoppix desktop=wmname` |\
  \ 使用指定的窗口管理器代替默认的 `KDE desktop=wmname`（*wmname* 为 `fluxbox`、`icewm`、`kde`、`larswm`、`twm`、`wmaker`\
  \ 或 `xfce`）。 |\n| `knoppix dma` | 为所有 IDE 驱动器启用直接内存访问 (DMA)。 |\n| `knoppix floppyconfig`\
  \ | 从软盘运行名为 `knoppix.sh` 的 shell 脚本。（该脚本包含你想运行的 Linux 命令。） |\n| `knoppix fromhd=/dev/hda1`\
  \ | 从之前拷贝到指定硬盘分区的 Live CD 镜像启动。 |\n| `knoppix hsync=80` | 为 X 使用 80 kHz 的水平刷新率。（输入你想让\
  \ X 使用水平刷新率。） |\n\n\n\n\n\n| `knoppix lang=xx` | 将键盘语言设置为双字母代码 `xx`（其中 `xx` 为 `cn`\
  \ = 简体中文，`de` = 德语，`da` = 丹语，`es` = 西班牙语，`fr` = 法语，`it` = 意大利语，`nl` = 荷兰语，`pl` =\
  \ 波兰语，`ru` = 俄罗斯语，`sk` = 斯洛伐克语，`tr` = 土耳其语，`tw` = 繁体中文，或 `us` = 英语）。 |\n| `knoppix\
  \ mem=256M` | 指定电脑内存内存（兆字节）。 |\n| `knoppix myconf=/dev/hda1` | 从 `/dev/hda1` 分区运行壳脚本\
  \ `knoppix.sh`。（输入存放 `knoppix.sh` 文件的分区名称。） |\n| `knoppix myconf=scan` | 让 Knoppix\
  \ 搜索名为 `knoppix.sh` 的文件，如果存在，则扫描并执行该文件中的命令。 |\n| `knoppix noeject` | 在停止 Knoppix\
  \ 后不弹出 Live CD。 |\n| `knoppix noprompt` | 在停止 Knoppix 后不提示你移除 Live CD。 |\n| `knoppix\
  \ nowheel` | 为 PS/2 鼠标或触控板强制使用 PS/2 协议（而不是自动检测鼠标）。 |\n| `knoppix noxx` | 让 Knoppix\
  \ 跳过硬件检测的特定部分（其中 `xxx` 指定不应探测的硬件或服务器：`apic` = 高级可编程中断控制器，`agp` = 加速图形端口，`apm` =\
  \ 高级电源管理，`audio` = 声卡，`ddc` = 显示数据通道，`dhcp` = 动态主机配置协议，`fstab` = 文件系统表，`firewire`\
  \ = IEEE 1394 高速串行总线，`pcmcia` = PC 卡，`scsi` = 小型计算机系统接口，`swap` = 用于虚拟内存的硬盘空间，`usb`\
  \ = 通用串行总线）。 |\n| `knoppix pci=bios` | 对损坏的 PCI 控制器直接使用 BIOS。 |\n| `knoppix pnpbios=off`\
  \ | 跳过即插用 (PnP) BIOS 初始化。 |\n| `knoppix screen=resolution` | 设置像素屏幕分辨率（其中 `resolution`\
  \ 是你想要的分辨率，如 `1024x768`、`800x600`、`640x480` 等）。 |\n| `knoppix testcd` | 使用 MD5 校验检查\
  \ Live CD 的数据完整性。 |\n| `knoppix tohd=/dev/hda1` | 将 Live CD 复制到指定的硬盘分区并运行（分区分区 1GB\
  \ 空闲空间）。通过将 `tohd` 改为 `toram` 并利用 RAM 可以获得性能提升。 |\n| `knoppix toram` | 将 Live CD\
  \ 复制到 RAM（内存）并从那里运行（需要 1GB 的 RAM）。 |\n| `knoppix vga=ext` | 使用 50 行文本模式显示。 |\n|\
  \ `knoppix vsync=60` | 为 X 使用 60 Hz 的垂直刷新率。（输入你希望 X 使用的垂直刷新率。） |\n| `knoppix wheelmouse`\
  \ | 为滚轮鼠标启用 IMPS/2 协议。 |\n| `knoppix xmodule=modname` | 让 X 服务加载由 `modname` 指定的模块以便\
  \ X 在你的显卡上运行（其中 `modname` 为 `ati`、`fbdev`、`i810`、`mga`、`nv`、`radeon`、`savage`、`svga`\
  \ 或 `s3`）。 |\n| `knoppix xserver=progname` | 启动由 `progname` 指定 X 服务（其中 `progname`\
  \ 为 XFree86 或 XF86_SVGA）。 |\n\n### 常用 Knoppix 启动命令\n\n![tip](img/tip.png) 当你想发布多个\
  \ Knoppix 启动命令时，只需将其合并一行。要指定跳过 SCSI 自动检测、关闭 ACPI、使用美国键盘、使用滚轮鼠标并要求 X 服务加载 `nv` 模块，在\
  \ `boot:` 提示符处输入：\n\n```\nknoppix noscsi acpi=off lang=us wheelmouse xmodule=nv\n\
  ```\n\n### 处理致命信号 11 错误\n\n在安装过程中，某些人遇到致命信号 11 错误消息，导致进程完全停止。此错误通常发生在启动屏幕之后，因为安装程序正在启动其\
  \ GUI 或文本界面。安装期间信号 11 错误可能的原因是与内存或 CPU（微处理器）缓存相关的硬件错误。\n\n![technicalstuff](img/technicalstuff.png)\
  \ Linux 可能会出现信号 11 或 `SIGSEGV`（段错误信号的缩写）错误。当进程访问无效内存时，就会发生段错误。\n\n### 解决问题\n\n|\
  \ **启动选项** | **功能** |\n| --- | --- |\n| `allowcddma` | 为 CD/DVD 驱动器启用 DMA。 |\n|\
  \ `apic` | 解决 Intel 440 组问题。 |\n| `acpi=off` | 在发生问题时禁用 ACPI。 |\n| `dd` | 提示驱动磁盘。\
  \ |\n| `display=IP_address:0` | 让安装程序 GUI 出现在由 IP 地址指定的远程系统上。 |\n| `enforcing=0`\
  \ | 关闭安全 Linux (SELinux)。 |\n| `expert` | 允许你对移除介质进行分区并提示驱动磁盘。 |\n| `ide=nodma`\
  \ | 禁用所有 IDE 设备上的 DMA。 |\n| `ks` | 使用 DHCP 配置以太网卡并从 NFS 服务器运行 kickstart 安装。 |\n\
  | `ks=kickstartfile` | 使用 kickstart 文件运行 kickstart 安装。 |\n| `lowres` | 强制安装程序 GUI\
  \ 以较低分辨率（640 x 480）运行。 |\n| `mediacheck` | 提示检查 CD 镜像的完整性。 |\n| `mem=xxxM` | 覆盖内核在电脑上检测到的内存量。\
  \ |\n| `nmi_watchdog=1` | 启用内置内核死锁检测器。 |\n| `noapic` | 防止内核使用高级可编程中断控制器 (APIC) 芯片。\
  \ |\n| `nofirewire` | 不加载对 FireWire 的支持。 |\n\n\n\n\n\n| `noht` | 禁用超线程（`hyperthreading`），该功能允许单个处理器在硬件层上充当多个虚拟处理器。\
  \ |\n| `nomce` | 禁用通过机器检查异常（`MCE`）对 CPU 执行的自诊断检查。在某些机器上，这些检查执行得过于频繁，需要禁用。 |\n| `nomount`\
  \ | 在救援模式下，不自动挂载任何已安装的 Linux 分区。 |\n| `nopass` | 不将键盘和鼠标信息传递给安装程序的第 2 阶段。 |\n| `nopcmcia`\
  \ | 忽略系统中任何 PCMCIA 控制器。 |\n| `noprobe` | 禁用自动硬件检测，并提示用户提供 PC 上安装的 SCSI 和网络硬件信息。你可以通过这种方法向模块传递参数。\
  \ |\n| `noshell` | 在安装期间禁用虚拟控制台 2（通过 Ctrl+Alt+F2 进入的终端）上的 shell 访问。 |\n| `nousb`\
  \ | 在安装期间禁用 USB 支持。（如果安装程序在过程中早期挂起，则不带 USB 支持的启动可能有用。） |\n| `nousbstorage` | 在安装程序的加载器中禁用\
  \ `usbstorage` 模块。此选项可能有助于 SCSI 系统上的设备排序。 |\n| `reboot=b` | 更改内核尝试重启 PC 的方式，即使内核在系统关机期间挂起也能重启。\
  \ |\n| `pci=noacpi` | 导致内核不使用 ACPI 路由中断请求。 |\n| `pci=biosirq` | 导致内核使用 BIOS 设置路由中断请求（`IRQs`）。\
  \ |\n| `rescue` | 以救援模式启动内核，你可以获得 shell 提示符并尝试修复问题。 |\n| `resolution=HHHxVVV` |\
  \ 使安装程序 GUI 在指定的视频模式下运行（`HHH` 和 `VVV` 是标准分辨率数字，如 `640x480`、`800x600` 或 `1024x768`）。\
  \ |\n| `selinux=0` | 禁用 SELinux 内核扩展。 |\n| `serial` | 在安装期间开启串口控制台支持。 |\n| `skipddc`\
  \ | 跳过显示器的显示数据通道（DDC）探测。（如果探测导致问题，则此选项有用。） |\n| `vnc` | 启动 VNC（虚拟网络计算）服务器，以便你可以从另一个运行\
  \ VNC 客户端的联网系统控制 GUI 安装程序。 |\n\n表 3-3:  Linux 启动选项\n\n### 使用 Linux 内核启动选项\n\n当你从\
  \ DVD 或第一张 CD-ROM 启动 PC 进行 Linux 安装时，你会看到一个带有 `boot:` 提示符的文本屏幕。通常，你在该提示符处按回车或什么都不做，安装很快就会开始。然而，你可以在\
  \ `boot:` 提示符处指定各种选项。这些选项控制 Linux 内核启动的各个方面，例如禁用对问题硬件的支持或使用特定的 X 驱动程序模块启动 X 服务器。其中一些启动选项对于跳过你在安装过程中可能遇到的问题非常有帮助。\n\
  \n要使用这些启动选项，你通常输入 `linux` 后紧跟启动选项。要执行文本模式安装并告诉内核你的 PC 有 512MB 内存，你在 `boot:` 提示符处输入以下内容：\n\
  \n```\nlinux text mem=512M\n```\n\n请参阅本章前面的表 3-3 以获取某些 Linux 启动选项的简要总结。你可以使用这些命令开启或关闭某些功能。\n\
  \n![tip](img/tip.png) 虽然我在排排除安装问题的背景下提到这些 Linux 内核启动命令，但当你启动运行任何 Linux 发行版的 PC 时，可以使用其中许多命令来开启或关闭特定功能。\n\
  \n## 设置打印机\n\n在大多数 Linux 发行版中，你只有在安装发行版后才能设置打印机。以下章节概述了 Ubuntu 的打印机配置步骤，对于所有发行版也都是类似的。\n\
  \n按照以下步骤设置打印机：\n\n1. **从桌面开始，选择 设置 ⇒ 设备 ⇒ 打印机。**\n\n   如果你没有以 `root` 登录，打印机配置工具通常会提示你输入\
  \ `root` 密码。如图 3-1 所示的打印机配置工具名为 `system-config-printer`。\n\n2. **点击添加按钮配置新打印机。**\n\
  \n   如果可以识别设备，它将出现在列表中。如果无法识别设备，你仍然可以安装并手动添加所需的驱动程序和配置数据。图 3-2 显示 Epson Stylus 打印机正在连接到串口。\n\
  \n3. **点击下一步继续。**\n\n   系统会搜索驱动程序并根据它认为你正在安装的内容提供选择。\n\n   在以下示例中，主机正在连接到本地打印机。\n\
  \n4. **选择适当的驱动程序（见图 3-3），然后点击下一步。**\n\n5. **输入打印机名称和描述变量（见图 3-4），然后点击下一步。**\n\n\
  \   描述和位置变量是可选的，但如果你在跨网络配置，它们将非常有帮助。\n\n6. **打印测试页以确保一切运行正常。**\n\n   对图 5 所示的设置进行任何修改。\n\
  \n7. **当打印机按要求配置后，退出打印机工具。**\n\n![tip](img/tip.png) 图 3-1：打印机配置界面。\n图 3-2：介质位置。\n\
  图 3-3：安装驱动程序。\n图 3-4：唯一的配置是打印机名称。\n图 3-5：编辑配置工具。\n\n## 管理 DVD、CD-ROM 和 U 盘\n\nGUI\
  \ 桌面使得使用 DVD、CD-ROM 和 U 盘变得简单。只需将外部介质放入驱动器，桌面上就会出现图标。然后你可以通过双击图标访问介质。\n\n在某些 Linux\
  \ 发行版中，在你插入 CD 或 DVD 后，GUI 会立即在文件管理器中打开介质内容。如果你看到驱动器图标，右键点击该图标获取上下文菜单。从该菜单你可以弹出介质。\n\
  \n## 安装其他软件\n\n安装软件的具体步骤取决于软件分发的类型。大多数 Linux 软件采用 RPM 文件或 Debian 包的形式。RPM 文件具有 `.rpm`\
  \ 扩展，而 Debian 包具有 `.deb` 扩展。\n\n大多数发行版都提供 GUI 安装程序来简化安装新软件包的过程。在本节中，我提供了一个适用于大多数发行版的添加软件的快速概述。（你不想在\
  \ Live 发行版中添加软件，因为 Live 发行版从 ROM 或介质运行，每次启动都是全新的。）\n\n![remember](img/remember.png)\
  \ Fedora 和 SUSE 使用 RPM 包。Debian、Ubuntu 和 Xandros 都是基于 Debian 的发行版，正如所期的，它们通常使用 Debian\
  \ 包。\n\n\n\n\n在 Debian 以及基于 Debian 的发行版（如 Ubuntu）中，管理软件包的最佳方法是使用高级软件包工具（APT），你通常通过\
  \ `apt-get` 命令来控制它。\n\n当你安装 Debian 时，最后的步骤之一是配置 APT 源。APT 源是互联网服务器（包括 FTP 和 Web\
  \ 服务器），APT 在这里查找软件软件包，以便将其下载并安装到你的系统中。假设 APT 配置恰当，且你的系统具有高速互联网连接，你可以在终端窗口中输入以下命令来开始安装任何软件包：\n\
  \n```\napt-get install pkgname\n```\n\n`pkgname` 是你想要安装的软件包名称。如果你不知道软件包的名称，请先在终端窗口中输入以下命令：\n\
  \n```\napt-cache search keyword\n```\n\n`keyword` 与你想要安装的软件包相关。要搜索描述中包含 `screenshot`\
  \ 单词且包含 `KDE,` 单词的软件包，请输入以下内容。（我使用 `grep` 来搜索输出结果中 `KDE.` 文本出现的位置。）\n\n```\napt-cache\
  \ search screenshot | grep KDE\n```\n\n此命令将输出以下行作为结果：\n\n```\nksnapshot - Screenshot\
  \ application for KDE\n```\n\n这一行显示 `ksnapshot` 软件包正是你需要的。如果该软件包尚未安装，你可以通过输入以下命令进行安装：\n\
  \n```\napt-get install ksnapshot\n```\n\n简而言之，这就是你如何使用命令行工具在 Debian 中查找和安装软件包。\n\
  \n![distributionspecific](img/distributionspecific.png) Debian 和旧版本的 Ubuntu 还带有一个用于\
  \ APT 的 GUI 软件包安装器，名为 Synaptic 软件包管理器（Synaptic Package Manager），它的用法非常直观：\n\n* \
  \  **Debian:** 根据你的版本，你可以从 GNOME 桌面选择应用程序⇒  系统工具⇒  Synaptic Package Manager，或者从桌面⇒  管理⇒  Synaptic\
  \ Package Manager。\n\n*   **Ubuntu:** 在旧版本（11.10 之前）中，选择选择系统⇒  管理⇒Synaptic Package\
  \ Manager。当 Ubuntu 提示输入密码时，输入你的普通用户密码，因为 Ubuntu 没有 `root` 用户。在较新版本中，你可以使用以下命令下载它：\n\
  \n```\nsudo apt-get install synaptic\n```\n\n当 Synaptic 软件包管理器启动时，它会显示一个快速介绍对话框，简要告诉你如何标记软件包进行安装、升级或删除，以及如何进入菜单执行这些操作。读完介绍后，点击“关闭”以消除该对话框并进入\
  \ Synaptic 软件包管理器。\n\n或者，你可以使用“软件与更新”工具（如图 3-6（c03.xhtml_c03-fig-0006）所示）来管理你的软件。\n\
  \n![image](img/9781119490463-fg010306.png)\n\n图 3-6: 软件与更新。\n\n从这里，你可以选择指定任何想要通过\
  \ APT 下载并安装的软件，如图 3-7](#c03.xhtml_c03-fig-0007）所示。\n\n![image](img/9781119490463-fg010307.png)\n\
  \n图 3-7: 指定要下载和安装的软件。\n\n## 在 Fedora 中安装软件\n\n大多数 Fedora 软件都以 RPM 文件的形式提供。RPM（红帽软件包管理器）文件是一个单一软件包，包含了安装软件产品所需的所有文件和配置信息。\n\
  \n通过 GNOME 桌面，你可以使用“软件”（Software）实用，这是一个用于安装和卸载 RPM 的图形化工具。按照以下步骤操作：\n\n1.  **选择系统⇒  管理⇒  软件。**\n\
  \n    如果你没有以 `root` 身份登录，对话框会提示你输入 `root` 密码。“软件”应用将启动并收集有关系统中已安装软件包状态的信息。在处理完所有已安装软件包的信息后，该工具将显示软件包管理器对话框，其中列出了所有软件包。\n\
  \n2.  **要安装未安装的软件包组，请选择该软件包组名称左侧的复选框。**\n\n    ![tip](img/tip.png) 对于部分卸载的软件包组，点击软件包名称右侧列中出现的“详情”链接（或“可选软件包”按钮）。\n\
  \n    会出现一个对话框，显示软件包组中软件包的详情。\n\n3.  **在对话框中，通过点击名称选择你想要安装或删除的软件包。**\n\n4.  **点击“关闭”退出对话框。**\n\
  \n    你返回软件包管理对话框，如果你添加或删除了任何软件包，“更新”（或“应用”）按钮将变为激活状态。\n\n5.  **点击“更新”（或“应用”）按钮，根据你在软件包列表中所做的任何添加或删除来更新软件包。**\n\
  \n## 在 SUSE 中安装软件\n\n在 SUSE 中，按照以下步骤安装或删除软件：\n\n1.  **从主菜单中选择 YaST 以启动 YaST 控制中心。**\n\
  \n    YaST 控制中心在左侧显示任务类别，右侧显示该类别的特定任务。\n\n2.  **点击左侧的“软件”类别，使右侧显示软件选项。**\n\n3. \
  \ **点击右侧的“软件管理”图标。**\n\n    YaST 会显示一个新窗口，你可以在其中搜索软件包。\n\n4.  **通过名称搜索软件包，或通过浏览可用软件包选择软件包。**\n\
  \n    要按名称搜索软件包，在窗口左上角的“搜索”字段中输入关键字，然后点击“搜索”。YaST 会在窗口右侧显示匹配的软件包。要浏览软件包，点击左上角的“过滤”，从下拉菜单中选择“软件包组”，并点击某个组以查看该组内各个独立软件包的列表。\n\
  \n5.  **点击右下角的“接受”按钮开始安装选定的软件包。**\n\n    YaST 在安装软件包之前会检查 `dependencies`（依赖）——如果软件包需要其他软件包才能正确安装。如果你想查看点击“接受”后发生发生变化，请点击“过滤”并选择“安装摘要”。\n\
  \n# 第 4 章：尝试 Linux\n\n## 本章\n\n![check](img/check.png) **启动 Linux 并登录**\n\n![check](img/check.png)\
  \ **熟悉 Shell**\n\n![check](img/check.png) **关闭系统**\n\n你正坐在电脑前，准备开机。你知道这台电脑安装了 Linux。（也许是你自己安装的，但有谁在记录呢？）你正想知道开机后会发生什么，以及之后该做什么。别担心。如果你是第一次使用\
  \ Linux，本章将教你如何登录、查看图形桌面、尝试一些晦涩的 Linux 命令，以及（最后）关闭电脑。\n\n如果你正在尝试 Live 发行版，只需从可启动介质（优\
  \ 盘/DVD/CD）启动，正如第一本书 [第 2 章] 所示，你可以尝试该发行版，而无需安装或覆盖你现有的操作系统。\n\n对于那些已经有些 Linux 知识的人，翻阅本章，看看是否有新发现。你永远不知道自己可能不知道什么！\n\
  \n## 启动\n\n\n\n当你打开电脑时，它会执行正常的上电序列并加载引导程序，取决于你的 Linux 发行版以及你在安装期间的选择，引导程序可能是 `GRUB`\
  \ 或 `LILO`。*引导程序*（曾称为引导加载程序）是一个微小的计算机程序，从硬盘将操作系统的其余部分加载到内存中。启动计算机的过程被称为*引导*（booting）。\n\
  \n![distributionspecific](img/distributionspecific.png) 对于 Live 发行版，引导程序通常是 `ISOLINUX`，一种设计用于\
  \ ISO 9660 CD-ROM 运行的引导程序。\n\n\n\n\n`LILO` 和 `GRUB` 引导加载程序会显示图形界面，列出引导加载程序可以加载的操作系统名称。如果你的\
  \ PC 同时安装了 Windows 和 Linux，你会看到这两个名称，并可以使用上方向键和下方向键选择你想要使用的操作系统。如果 PC 设置为默认加载 Linux，只需等待几秒，引导加载程序就会启动\
  \ Linux。更准确地说，引导加载程序会将 `Linux kernel`（Linux 内核——Linux 操作系统的核心）加载到 PC 的内存中。\n\n其他引导加载程序（如\
  \ `ISOLINUX`）可能会显示一个文本 `boot:` 提示符，可以在其中输入启动命令来加载特定的操作系统，并向你加载的任何操作系统传递选项。\n\n当\
  \ Linux 内核启动时，你会看到一长串启动消息，通常被称为 `boot messages`（启动消息）（你可以通过在终端窗口中输入 `dmesg` 命令随时查看这些消息）。这些消息包含了\
  \ Linux 检测到的设备名称。启动消息中的前几行之一是：\n\n```\nCalibrating delay loop … 4997.12 BogoMIPS\n\
  (lpj=2498560)\n```\n\n`BogoMIPS` 是 Linux 术语，用于衡量时间（在本节的实用侧边栏中会有详细解释）。`BogoMIPS`\
  \ 之前的数字取决于你 PC 处理器的速度。当内核需要等待某些事件发生的一段时间时间（例如等待磁盘控制器准备好并返回响应）时，它会使用 BogoMIPS 测量值。\n\
  \n启动消息出现后，某些 Linux 发行版会切换到图形启动屏幕，显示系统启动进度信息。当你从安装后首次启动某些 Linux 发行版时，会得到一个配置程序，引导你完成一些配置步骤，例如设置日期和时间以及添加用户。要完成这些首次配置步骤，你只需要输入要求的信息。\n\
  \n![distributionspecific](img/distributionspecific.png) Linux 启动后，你通常会进入图形登录界面。对于某些发行版（如\
  \ `Knoppix`），你不需要作为用户登录即可进入桌面。在其他 Live 发行版中，你必须登录。\n\n图 4-1 显示了从 Ubuntu Live 发行版启动\
  \ PC 并插入额外闪存盘后（在桌面上显示为 `HP v125w`）的 Ubuntu 桌面。对于某些发行版，你可能会自动登录。对于其他发行版，会出现图形登录界面，要求你输入安装期间（或安装后的任何时候）提供的用户名和密码进行身份验证。\n\
  \n![image](img/9781119490463-fg010401.png)\n\n图 4-1： Ubuntu Live 桌面。\n\n每个发行版都使用\
  \ `root` 用户名，它恰好是 `superuser`（管理员账户）。无论是你自己安装 Linux 还是别人为你安装，你都需要知道 `root` 密码。没有它，你就无法完成许多了解\
  \ Linux 如何工作所需的必要任务。\n\n![warning](img/warning.png) 通常你不应该以 `root` 身份登录。当你以 `root`\
  \ 登录时，可能会意外损坏系统，因为当你是 `root` 时可以做任何事情。请始终以普通用户登录。当你需要以 `root` 身份执行任何任务时，在终端窗口中输入\
  \ `su -` 然后输入 `root` 密码。\n\n![distributionspecific](img/distributionspecific.png)\
  \ 在 Ubuntu 中，你只定义一个普通用户账户；Ubuntu 不提供让你定义 `root` 用户账户的机会。每当你想要执行任何需要 `root` 权限的任务时，你都必须使用\
  \ `sudo` 命令（`superuser do` 的缩写）。`root` 的默认密码是你安装操作系统时提供的那个。\n\n例如，要以用户 `spiderman`\
  \ 登录，请在第一个文本字段中输入 `spiderman` 并按回车。（在开始输入之前将光标移动到登录对话框。）然后输入 `spiderman` 的密码并按回车。你会看到初始图形用户界面（GUI）。你得到的内容取决于选择的\
  \ GUI：`GNOME` 或 `KDE`。如果有人替你做了选择，不要担心；`GNOME` 和 `KDE` 都非常好且功能丰富。\n\n第 2 本中的第 1 章\
  \ 和第 2 章 将了 GUI 桌面——首先是 `GNOME`，然后是 `KDE`。本节专注于命令行，如果你在加载图形桌面时遇到问题，命令行是你唯一可以访问的接口。\n\
  \n## 玩 Shell\n\nLinux 基本上就是 Unix，除非你可以在文本终端中输入晦涩的命令，否则 Unix 感觉并不像 Unix。尽管 `GNOME`\
  \ 和 `KDE` 做了很多努力带你进入窗口、图标、鼠标和指针（亲切地称为 `WIMP`）的世界，但有时，你只能面对一个带有提示符的纯文本屏幕，它看起来像这样（当你以\
  \ `edulaney` 身份登录时）：\n\n```\nedulaney@linux:/etc>\n```\n\n当 X Window 系统出现问题时，你最常看到文本屏幕，X\
  \ Window 系统是运行你通常看到的窗口和菜单的机机制。在这些情况下，你必须与 shell 交互，并了解一些晦涩的 Linux 命令。\n\n你可以在终端窗口中尝试一些\
  \ Linux 命令，为意料之外的 shell 遇到做好准备，当你在 `GNOME` 或 `KDE` 中。\n\n### 启动 Shell\n\n简单来说，`shell`\
  \ 是一个命令解释器——一个读取你输入的内容、解释这些文本并执行命令应执行的操作程序。\n\n在开始玩 shell 之前，打开一个终端窗口。在 `GNOME`\
  \ 或 `KDE` 中，面板通常包含一个类似显示器的图标。当你点击该图标时，你会看到一个带有提示符的窗口，如图 4-2 所示。该窗口是一个终端窗口，它的工作方式就像传统的终端。一个\
  \ shell 程序正在运行并准备接受你输入的文本。输入文本并按回车，就会发生变化（取决于你输入的内容）。\n\n![image](img/9781119490463-fg0102.png)\n\
  \n图 4-2： 终端窗口等待输入。\n\n![tip](img/tip.png) 如果桌面上的 `GNOME` 或 `KDE` 面板没有启动终端或 shell\
  \ 的图标，请搜索主菜单；你应该能找到标记为 `Console` 或 `Terminal` 的项。选择该项将打开一个终端窗口。\n\n你看到的提示符取决于终端中运行的\
  \ shell。默认 Linux shell 是 `bash`（代表 `Bourne-Again Shell`）。\n\n`bash` 理解大量的标准 Linux\
  \ 命令，你可以使用这些命令查看文件、在目录间移动、查看正在运行的程序（以及其他登录用户）以及许多其他。\n\n除了 Linux 命令外，`bash` 还可以运行存储在可执行文件中的任何程序。`bash`\
  \ 还可以执行 `shell scripts`——包含 Linux 命令的文本文件。\n\n### 理解 shell 命令\n\n由于 shell 解析你输入的内容，了解\
  \ shell 如何识别你输入的文本是非常重要的。所有的 shell 命令都遵循这种通用格式：\n\n```\ncommand option1 option2\
  \ … optionN\n```\n\n这样的单行命令通常被称为命令行（command）。在命令行上，你输入一个命令并跟着一个或多个可选参数（或 `arguments`）。此类命令行选项（或参数）帮助你指定你想让命令执行的操作。\n\
  \n\n\n\n\n一条基本规则是，你必须使用空格或制表符将命令与选项分开，并将选项彼此分开。如果你想使用包含嵌入空格的选项，则必须将该选项放在引号内。例如，要在密码文件中搜索两个单词，请输入以下\
  \ `grep` 命令。（`grep` 是那些用于在文件中搜索文本的晦涩命令之一。）\n\n```\ngrep \"WWW daemon\" /etc/passwd\n\
  ```\n\n当 `grep` 打印包含这些单词的行时，它看起来如下。（你在系统上看到的内容可能与我展示的有所。）\n\n```\nwwwrun:x:30:8:WWW\
  \ daemon apache:/var/lib/wwwrun:/bin/false\n```\n\n如果你以自己的名字创建了用户账户，可以尝试以你的名字作为参数输入\
  \ `grep` 命令，但记住如果名字中包含空格，请将其包含在引号中。\n\n### 尝试一些 Linux 命令\n\n在你打开终端窗口时，可以尝试运行几个 Linux\
  \ 命令来玩玩。我将引导你通过一些示例，让你感受一下在 shell 提示符下可以做什么。\n\n要查看 Linux  自从上次启动以来已运行了多久，输入以下命令。（**注意：**）我用粗体显示输入的命令，其后是该命令的输出。\n\
  \n```\nuptime\n```\n\n```\n12:06:34 up 59 days, 16:23, 4 users, load average: 0.56,\
  \ 0.55, 0.37\n```\n\n`up 59 days, 16:23` 部分告诉你有这台电脑已经运行了近两个月。嗯……Windows 能做到吗？\n\n\
  要查看你的系统运行的是什么版本的 Linux 内核，使用 `uname` 命令：\n\n```\nuname -srv\n```\n\n此代码运行了带有三个选项的\
  \ `uname` 命令：`-s`、`-r` 和 `-v`（如示例所示组合为 `-srv`）。`-s` 选项使 `uname` 打印内核名称，`-r` 打印内核发布版本，`-v`\
  \ 打印内核版本号。该命令在我的一个 Linux 系统上生成以下输出：\n\n```\nLinux 4.13..0-16-generic #19-Ubuntu\
  \ SMP Wed Oct 11 18:35:14 UTC 2017\n```\n\n在这种情况下，系统运行的是 Linux 内核版本 4.13.0。\n\n\
  要读取文件，使用 `more` 命令。例如，输入 `more /etc/passwd` 来读取 `/etc/passwd` 文件。产生的输出类似于下面：\n\n\
  ```\nroot:x:0:0:root:/root:/bin/bash\nbin:x:1:1:bin:/bin:/bin/bash\ndaemon:x:2:2:Daemon:/sbin:/bin/bash\n\
  lp:x:4:7:Printing daemon:/var/spool/lpd:/bin/bash\nmail:x:8:12:Mailer daemon:/var/spool/clientmqueue:/bin/false\n\
  news:x:9:13:News system:/etc/news:/bin/bash\nuucp:x:10:14:Unix-to-Unix Copy system:/etc/uucp:/bin/bash\n\
  … lines deleted …\n```\n\n要查看系统上正在运行的所有程序列表，使用 `ps` 命令，如下：\n\n```\nps ax\n```\n\n\
  `ps` 命令接受许多选项，你可以在不加通常的横线前缀的情况下提供它们。此示例使用了 `a` 和 `x` 选项。`a` 选项列出你正在运行的所有进程，`x` 选项显示其余进程。结果是\
  \ `ps ax` 打印出系统上运行的所有进程列表，如下 `ps ax` 命令的示例输出所示：\n\n```\nPID TTY STAT TIME COMMAND\n\
  1 ? S 0:01 init [5]\n2 ? SN 0:00 [ksoftirqd/0]\n3 ? S< 0:00 [events/0]\n4 ? S< 0:00\
  \ [khelper]\n9 ? S< 0:00 [kthread]\n22 ? S< 0:00 [kblockd/0]\n58 ? S 0:00 [kapmd]\n\
  79 ? S 0:00 [pdflush]\n80 ? S 0:00 [pdflush]\n82 ? S< 0:00 [aio/0]\n… lines deleted\
  \ …\n5325 ? Ss 0:00 /opt/kde3/bin/kdm\n5502 ? S 0:12 /usr/X11R6/bin/X -br -nolisten\
  \ tcp :0 vt7 -auth /var/lib/xdm/authdir/authfiles/A:0-p1AOrt\n5503 ? S 0:00 -:0\n\
  6187 ? Ss 0:00 /sbin/portmap\n6358 ? Ss 0:00 /bin/sh /usr/X11R6/bin/kde\n6566 ?\
  \ Ss 0:00 /usr/sbin/cupsd\n6577 ? Ssl 0:00 /usr/sbin/cupsd\n… lines deleted …\n\
  ```\n\n### 关机当你完成会话后，应该正常关闭系统。要此操作，请使用 `shutdown` 命令。你可以使用 `shutdown now` 立即关机，或使用\
  \ `shutdown +10` 计划在 10 分钟后关机。\n\n如果你想重启，请使用 `shutdown -r now` 命令。\n\n\n\n\n\n##\
  \ 4. 使用图形和图像应用\n\n## 6. 第 6 章：使用文本编辑器\n\n### 1. 使用 GUI 编辑器\n### 2. 使用 ed 和 vi 进行文本编辑\n\
  \n# 第 1 章：GNOME 及其衍生版本\n\n本章\n\n![check](img/check.png) **发现 GNOME 的共同特性** 所有![check](img/check.png)\
  \ **理解 GNOME 面板** 所有![check](img/check.png) **查看 Unity**\n![check](img/check.png)\
  \ **探索 Cinnamon**\n![check](img/check.png) **寻找 MATE**\n\n在过去的日子里，Linux 发行版通常会带有一个（或两个）流行的图形用户界面（GUI）：GNOME\
  \ 和 KDE。GNOME 和 KDE 就像微软 Windows，但在一个方面独一无二：与微软 Windows 不同，Linux 允许你选择自己的 GUI。如果你不喜欢\
  \ GNOME，可以使用 KDE；如果你不喜欢 KDE，可以使用 GNOME。当两个 GUI 都安装好后，你可以在几秒钟内它们之间切换。在微软 Windows\
  \ 上尝试一下吧！\n\n时如今，这种 GUI 的选择通常仍然适用，只是有几个大例外：GNOME 衍生了几个变体，而 KDE 有几个选择（最著名的是 Plasma）。GNOME\
  \ 被广泛使用，但你会发现某些发行版包含了如 Unity、Cinnamon 和 MATE 等桌面。当你遇到这些桌面时，只需知道它们最初都是 GNOME，并为了适应某些特定目的进行了修改。这些桌面具有相同的基本结构；我将在本章中带你熟悉它们。\n\
  \n![remember](img/remember.png) GNOME 和 KDE 是独立于 Linux 开发的，它们运行在 Linux 以外的 Unix\
  \ 操作系统上。你也可以选择在 Linux 中安装如 FVWM 和 Xfce 这样的 GUI。访问 [`https://www.freedesktop.org/wiki/Desktops`](https://www.freedesktop.org/wiki/Desktops/)\
  \ 查看其他 X 桌面列表（运行在 X 窗口系统上的桌面）。\n\n本章探讨了 GNOME 及其变体的主要特性；第 2 卷，第 2 章 对 KDE 执行了同样的工作。了解这些\
  \ GUI 的最好方法是开始使用它们。无论你决定使用哪种 GUI，所有的 GUI 应用——无论它们基于 GNOME 还是 KDE——都能运行在所有的 GUI 桌面。。换句话说，你可以在\
  \ GNOME 下运行 KDE 应用，反之亦然。唯一的障碍是 GNOME 和 KDE 应用可能默认没有安装。\n\n![distributionspecific](img/distributionspecific.png)\
  \ 每个 Linux 发行版通常默认安装一个 GUI。每个发行版还会对该 GUI 进行自定义，以创建一个该发行版独特的桌面。由于这个原因，你在发行版中看到的与我在本章中描述的内容之间可能存在细微、小的差异。\n\
  \n## 了解 GNOME 桌面\n\nGNOME 的初始桌面看起来与其他任何流行的 GUI 相似，例如微软 Windows 或 macOS 桌面。图 1-1\
  \ 显示了一个典型的 GNOME 桌面。\n\n![image](img/9781119490463-fg020101.png)\n\n图 1-1： Ubuntu\
  \ 中简洁的 GNOME 桌面。\n\n如果你运行的是 Live（现场）发行版，你将看不到某些在安装该操作系统后才会出现的图标。当系统安装后，桌面最初会显示你的计算机、主文件夹和用于删除文件的垃圾桶图标。与其他某些发行版不同，Fedora\
  \ 力求减少桌面图标的数量并保持整洁。\n\n当你右键点击对象或桌面的任何部分时，GNOME 桌面会显示上下文菜单。根据你右键点击的位置，菜单可能会提供以下选择：\n\
  \n*   **新建文件夹：** 在目录中创建一个新文件夹\n*   **属性：** 显示文件或文件夹的属性，包括权限\n*   **打开：** 打开文件夹或文件\n\
  *   **压缩：** 减小文件大小\n*   **创建链接：** 创建快捷方式\n\n图 1-2 显示了典型 GNOME 文件夹中的上下文菜单。如果任何菜单选项带有右指向的箭头，当你将鼠标指针悬停在箭头上时，会出现其他菜单。\n\
  \n![image](img/9781119490463-fg020102.png)\n\n图 1-2： GNOME 文件夹的标准菜单选项。\n\n无论你点击哪个图标，此上下文菜单上的许多项目都是相同的，但右键点击某些图标（如垃圾桶图标）会产生有些不同的菜单。对于垃圾桶图标，图标上下文菜单通常提供一个永久删除垃圾桶中项目的选项。（你有机会说“是”或“否”。）\n\
  \n![tip](img/tip.png) 我打赌你在这里发现了一个模式：右键点击。无论你在 GUI 桌面的哪个位置，*在选择之前始终右键点击。*当你右键点击时，一定会发现有用的东西！\n\
  \n## 理解 GNOME 面板\n\nGNOME 桌面有面板，每个面板就像 Windows 任务栏。顶部面板左侧有菜单选项，中间是时间显示，右侧是常用选项的图标。在左菜单和时间之间，面板显示你已启动的任何应用程序（或自动为你启动的程序）。\n\
  \n### 顶部面板\n\n顶部面板横跨 GNOME 桌面顶部的长条。图 1-3 显示了 GNOME 顶部面板的典型视图。\n\n![image](img/9781119490463-fg020103.png)\n\
  \n图 1-3： GNOME 顶部面板。\n\n面板是图标的停放处。点击某些图标会启动程序；另一些图标显示状态（如正在运行哪些程序）以及日期和时间等信息。\n\n\
  ### 桌面\n\n当你选择“活动”（Activities）后，GNOME 桌面左侧区域区域显示可以在面板中打开的应用程序，你可以将该面板称为*主菜单*。主菜单面板就像微软\
  \ Windows 中的开始按钮，是你通常可以在这里找到应用程序的地方，它们被组织在子菜单中。\n\n在 Live 发行版的情况下，此主菜单（也称为“收藏”）上的默认图标通常包含以下内容：\n\
  \n*   Firefox 网页浏览器\n*   Rhythmbox\n*   软件\n*   帮助\n*   你文件的快捷方式\n*   你文档的快捷方式\n\
  *   安装图标\n*   指向你最近应用程序的链接\n\n你可以点击任何图标来启动关联的应用程序，或右键点击在新窗口中启动它或从菜单中移除它。\n\n###\
  \ 底部面板\n\n除了顶部面板，GNOME 还包含一个底部面板。如果不开启它，它默认不会出现在屏幕上（与 KDE 的布局不同），但可以使用它来寻找重要信息。图\
  \ 1-4\n\n图 1-4： GNOME 中的底部面板。\n\n## 查看 Unity\n\n就像从 Windows 7 到 Windows 10 的 Windows\
  \ 桌面之间存在差异一样，GNOME 桌面也有变体。这些变体中的第一个是 Unity。Unity 由 Canonical 和 Mark Shuttleworth（分别是\
  \ Ubuntu 背后的组织及其负责人）创建。通过它保持了 GNOME 相同的整洁桌面外观。不同的是 Unity 的制作者努力让没有以前知识的用户尽可能容易使用，这使得它对于笔记本电脑和桌面电脑都是理想的。\n\
  \n这个桌面最大的优点之一是 Unity 支持触摸。\n\n## 查看 Cinnamon\n\nCinnamon 桌面看起来非常像几个版本之前的 GNOME 过去的样子，并且在\
  \ Linux Mint 中很受欢迎。Cinnamon 看起来像 Windows XP 时代的 Windows。\n\n\n\n\n\n底部面板左侧的图标是 `Main\
  \ Menu`（主菜单）按钮。主菜单按钮类似于 Microsoft Windows 中的开始按钮，你通常可以在这里找到所有的应用程序，并且这些程序按子菜单组织。点击主菜单按钮弹出一级菜单；然后将鼠标悬停在任何带有箭头的菜单项上即可弹出下一级菜单，依此类推。你可以浏览菜单层级并在最终菜单中做出选择。\n\
  \n除了底部面板显示与`Main Menu`相关的标准选项外，Cinnamon 的底部面板还提供以下额外命令：\n\n- `Show Desktop`: 隐藏（但不关闭）所有窗口并显示桌面\n\
  - `Firefox Web Browser`: 快速访问网络\n- `Terminal`: 打开终端窗口\n- `Files`: 显示你的文件\n- `Open\
  \ Windows`: 在任何打开的窗口之间来回切换\n- `Active Icons`: 执行任务，如弹出驱动器、调整音量和查看电池电量\n\n## 观察 MATE\n\
  \n与 Cinnamon 类似，MATE 桌面通常与 Linux Mint 关联；两者看起来非常相似。\n\n生活是如此，Linux 亦然：选择使用哪种桌面就像开什么汽车、喷什么香水或买什么衣服一样，完全取决于个人喜好。对于你经常交互的界面，感到舒适并学会尽可能地使用它是非常重要的。\n\
  \n# 第 2 章：KDE Plasma 桌面\n\n## 本章内容\n\n- ![check](img/check.png) **探索 Plasma 的常用功能**\n\
  - ![check](img/check.png) **介绍主菜单**\n- ![check](img/check.png) **配置面板和桌面**\n\n正如书籍\
  \ 2 的第 1 章所示，Linux 发行版带有两种流行的图形用户界面（GUI）之一或两者：GNOME（或其一个或多个变体）和 KDE 的 Plasma。当两个界面都安装时，你可以在几秒钟内进行切换。如果你不喜欢\
  \ GNOME，可以使用 Plasma；如果你不喜欢 Plasma，可以使用 GNOME。\n\n本章将探讨 Plasma 的主要功能，正如书籍 2 的第 1\
  \ 章探讨 GNOME 那样。我强烈建议你在决定使用哪一个更习惯之前，先尝试这两种 GUI。\n\n![remember](img/remember.png)\
  \ 你可以在 GNOME 下运行 Plasma 应用，反之亦然。几种安装程序允许你选择安装想要使用的两个界面中的任意一个。默认安装一个界面可以实现更快速、更简单的设置和安装；你以后可以回来安装另一个界面。\n\
  \n![distributionspecific](img/distributionspecific.png) 每个发行版都会对桌面进行定制，因此你看到的界面与我在本章描述的内容之间可能存在细微的差异。\n\
  \n## 了解 Plasma 桌面\n\n几年前，KDE 桌面简单被称为 KDE，就像 GNOME 被称为 GNOME 一样。然而随着时间的推移，KDE 背后的组织开始负责桌面之外越来越多的事情。这种情况在有人提到\
  \ KDE 时导致了困惑：不清楚他们是在讨论桌面，还是该组织管理的完全不同的东西。为了减少困惑，KDE 决定将桌面命名为 Plasma。\n\n尽管减少困惑的尝试值得赞赞，但术语仍然可能让人困惑，因为行业中的许多人继续按照旧名称称呼桌面。为了清晰起见，请记住\
  \ KDE、KDE Plasma 和 Plasma 现在都是指 KDE 提供的桌面。\n\nPlasma 的初始桌面看起来像任何其他流行的 GUI 一样，例如\
  \ Microsoft Windows 桌面或 macOS X 桌面。图 2-1 显示了一个典型的 Plasma 桌面。\n\n![image](img/9781119490463-fg020201.png)\n\
  \n图 2-1: 清洁的 Plasma 桌面。\n\n![technicalstuff](img/technicalstuff.png) `KDE` 代表 `K\
  \ Desktop Environment`。KDE 项目始于 1996 年 10 月，旨在为使用 X Window 系统的 Unix 系统开发通用的 GUI。KDE\
  \ 的第一个测试版本在一年后的 1997 年 10 月发布。KDE 1.0 版本于 1998 年 7 月发布。2014 年 7 月，KDE 分为三个部门：KDE\
  \ Plasma（这是我在这里关注的重点）、KDE Frameworks 和 KDE Applications。\n\n图 2-1 源自一台上网笔记本，它尽可能减少桌面图标的数量。根据你的发行版，你可能会看到一些其他功能。桌面的底部通常是\
  \ `panel`（面板），类似于 Windows 任务栏的顶部和底部栏。面板左侧有按钮（各种程序的快捷方式）、一组指向可用桌面的按钮、一个任务区域、一个时间显示，以及（右侧）提供音量控制和访问\
  \ Plasma 剪贴板管理器 `Klipper` 的图标。面板中间是你启动的（或为你自动启动的）任何应用程序的按钮。\n\n### 桌面上下文菜单\n\n当你右键点击桌面空白区域时，Plasma\
  \ 桌面会显示上下文菜单。该菜单包含一个子菜单，提供以下选项（在不同发行版之间略有差异）：\n\n- `Run Command`（运行命令）\n- `Lock\
  \ Screen`（锁定）\n- `Leave`（退出桌面）\n- `Desktop Settings`（设置壁纸等屏幕上功能）\n\n图 2-2\n\n图 2-2:\
  \ Plasma 中的上下文菜单。\n\n### 图标上下文菜单\n\n在 Plasma 中，右键点击任何图标都会显示另一个菜单，如图 2-3\n\n图 2-3:\
  \ 图标的弹出菜单。\n\n带有向右箭头的桌面菜单选项在你将鼠标指针悬停在箭头上时会出现其他菜单。你可以执行以下典型任务：\n\n- `Open a folder\
  \ in file manager`（在文件管理器中打开文件夹）\n- `Open a file with an application that you choose`（使用你选择的应用程序打开文件）\n\
  - `Cut or copy`（剪切或复制）\n- `Rename the icon`（重命名图标）\n- `Move the icon to the trash`（将图标移至垃圾箱）\n\
  - `View the properties of that icon`（查看该图标的属性）\n\n对于 CD-ROM 设备图标类似设备，图标上下文菜单通常提供弹出介质的选项。\n\
  \n![tip](img/tip.png) 无论你在 GUI 桌面的什么位置，在选择之前始终右键点击。右键点击时一定会发现有用的东西！\n\n## 理解 Plasma\
  \ 面板\n\n`panel`（面板）是横跨桌面底部的长条。图 2-4 显示了 Plasma 面板的典型视图。\n\n![image](img/9781119490463-fg020204.png)\n\
  \n图 2-4: Plasma 面板。\n\n面板是图标的停车场。某些图标在你点击时会启动程序；另一些显示状态（如正在运行哪些程序）以及日期时间等信息。\n\n\
  ![tip](img/tip.png) 如果你将鼠标指针停留在图标上方，会弹出一个帮助气泡，提供关于该图标的有用提示。\n\n### 主菜单按钮\n\nPlasma\
  \ 面板最左侧的图标是 `Main Menu`（主菜单）按钮。（文档将主菜单按钮称为 `Application Starter`）。类似于 Microsoft\
  \ Windows 中的开始按钮，主菜单按钮是你通常可以找到所有应用程序的地方，这些程序按子菜单组织。主菜单按钮通常标记为 K，但该字母可以根据发行版更改。\n\
  \n\n\n\n\n点击“主菜单”按钮查看一级菜单；然后将鼠标悬停在带有箭头的任何菜单项上弹出下一级菜单，以此此类推。你可以遍历菜单层次结构并在最终菜单中做出选择。\n\
  \nKickOff 启动器允许你比传统的菜单层次结构更快地访问频繁使用的应用程序。在大多数桌面系统中，点击“主菜单”按钮打开 KickOff 会显示以下顶级类别：\n\
  \n*   **收藏：** 快速访问频繁使用的应用程序和文档。要快速将文件添加到收藏中，请右键点击该文件并在右键菜单中选择“添加到收藏”。\n*   **应用程序：**\
  \ 安装在你的系统上的程序和工具。点击带有右向箭头的子类别可打开更多选项。\n*   **计算机：** 访问硬盘、可移动存储设备以及垃圾箱。\n*   **最近使用：**\
  \ 按时间顺序显示最近打开的文档和应用程序。\n*   **退出：** 注销、重启、关机电脑等选项。\n\n在“应用程序”选项卡中，你会找到以下菜单子类别（取决于你使用的发行版，可能还有其他几项）：\n\
  \n*   **游戏：** 游戏菜单（而且种类非常多），如街机游戏、棋盘游戏和纸牌游戏。\n*   **图形：** 程序如 Flickr、KolourPaint\
  \ 和 KSnapshot（用于本章节的截图）。\n*   **互联网：** 互联网应用程序，如网络浏览器、邮件阅读器和即时通讯工具。\n*   **多媒体：**\
  \ 多媒体应用程序，如 CD 播放器、混音器、录音器和音量控制。\n*   **办公：** 办公应用程序，如 LibreOffice 办公套件（包含 Writer\
  \ 文字处理器、Calc 电子表格、Impress 幻灯片程序和 Draw 绘图程序）。\n*   **系统：** 系统配置所需的实用。\n*   **工具：**\
  \ Plasma 可以使用的其他杂项工具，包括文本转语音工具、个人闹钟调度和屏幕放大镜。\n\n![remember](img/remember.png) 可能还会存在三个\
  \ Plasma 菜单选项——管理、设置和系统——它们可以帮助你配置所需的任何内容。这些选项并非每个发行版中都存在，因为某些发行版选择了自己的界面来完成这些任务。\n\
  \n在每个发行版中，主菜单和 KickOff 的类别不同，但菜单结构相同，因此你通常应该能找到你需要的内容。\n\n### 面板图标\n\n除了主菜单按钮外，Plasma\
  \ 面板还有几个图标（如图 2-4）。你可以通过将鼠标悬停在图标上并阅读弹出的描述来识别任何图标。最常见的图标如下：\n\n*   **桌面分页器：** 在工作区或虚拟桌面之间切换。\n\
  *   **打开窗口：** 显示所有打开的窗口。\n*   **活动窗口：** 切换到另一个运行中的应用程序或窗口。\n*   **网络连接：** 显示当前有线或无线连接的信息。\n\
  *   **音量：** 显示音量控制条，你可以通过拖动滑块更改声音大小。\n*   **通知和任务：** 显示当前任务的进度，如文件传输或打印文档。\n*  \
  \ **时间：** 显示时间。点击图标会显示显示当前日期的日历。\n*   **面板工具箱：** 调整面板的大小、位置和控制。\n\n## 配置 Plasma\
  \ 底部面板\n\n尽管 Plasma 面板具有强大的功能，它也具有极大的灵活性。如果你在面板的空白处点击右键，就会出现一个右键菜单。你可以使用此菜单向面板添加项目或删除项目。你甚至可以创建一个额外的面板，允许你配置桌面外观和工作方式，尽可能像\
  \ GNOME。\n\n最强大的菜单选项是“面板选项”。选择“面板选项⇒面板设置⇒更多设置”将显示一个实用程序，允许你将面板放置在底部以外的位置、调整面板对齐方式、自动隐藏面板、选择窗口出现在面板的前面还是后面等。\n\
  \n## 配置 Plasma 桌面\n\n在桌面的空白处点击右键后，你可以从右键菜单中选择“桌面设置”。此选项显示配置工具，允许你配置背景以及在桌面上执行有用功能的特殊鼠标操作等项目。\n\
  \n要进行更彻底的桌面配置，选择“主菜单⇒配置桌面”来显示配置选项，用于设置屏幕尺寸、调整多桌面设置、更改屏幕保护程序以及调整桌面效果。这些设置按类别组织，例如常用外观和行为、工作区外观和行为、网络连接和硬件。点击项目以查看该项目的子类别；点击子类别项之一进行更改。做出更改后，点击“应用”按钮即可生效。如果你不喜欢结果，通常可以点击“重置”回到原始设置。\n\
  \n![tip](img/tip.png) 根据你的发行版，你可能还想使用可下载程序（如 SAX2）进行桌面配置。SAX2 ([`en.opensuse.org/Archive:SaX2`](https://en.opensuse.org/Archive:SaX2))\
  \ 是一个简化配置的开源程序。\n\n第 3 章\n\n# Shell 命令\n\n## 本章\n\n![check](img/check.png) **打开终端窗口或虚拟控制台**\n\
  ![check](img/check.png) **发现 bash shell**\n![check](img/check.png) **使用 Linux 命令**\n\
  ![check](img/check.png) **编写 shell 脚本**\n\n有时，事情运行并不完美，问题就会出现。如果由于这些问题图形界面 (GUI)\
  \ 桌面不再响应你的点击，该怎么办？如果 GUI 完全无法启动，该怎么办？一切并没有丢失：你仍然可以告诉你的 Linux 系统做什么，但你必须通过在文本屏幕上输入命令来实现。在这些情况下，你与\
  \ shell —— 即 Linux 命令解释器工作。本章介绍了 `bash` shell，它是大多数 Linux 发行版的默认 shell。\n\n在你学会了如何与\
  \ shell 工作之后，你甚至可能开始喜欢 Linux 命令的简单和强大。那时，即使是一个 GUI 狂热爱好者，不久后的某天你可能也会发现自己打开了一个终端窗口，并通过由奇怪标点符号连接的两个或三个字母的命令让系统唱跳起来。\n\
  \n## 打开终端窗口和控制台\n\n首要任务。如果你在 GUI 桌面（如 GNOME 或 KDE）中工作，你在哪里为 shell 输入命令？问得好。\n\n\
  进入 shell 最简单的方法是打开一个 `terminal`（也称为 `console`）窗口。大多数发行版的 GNOME 和 KDE GUI 包含一个打开终端窗口的图标（或主菜单选项）。点击该图标或选择菜单选项以获取终端窗口。如果你在\
  \ GNOME 中没有看到此类图标，请选择“应用程序⇒辅助工具⇒终端”。现在你可以随心所欲地输入命令了。\n\n由于某种原因，GUI 似乎`挂起`了（你点击并输入，但没有任何反应），你可以转向虚拟控制台。（物理控制台是显示器和键盘的组合。）虚拟控制台允许你在多个文本控制台之间切换，即使你只有一个物理控制台。无论你是否运行\
  \ GUI，都可以使用不同的文本控制台来输入不同的命令。\n\n\n\n\n\n从 GNOME 或 KDE 桌面进入第一个虚拟控制台，请按下 `Ctrl+Alt+F1`；然后按下\
  \ `Ctrl+Alt+F2` 进入第二个虚拟控制台，依此类推。每个虚拟控制台都是文本界面，你可以在其中登录并输入 Linux 命令执行各种任务。完成后，输入\
  \ `exit` 退出。\n\n![tip](img/tip.png) 你最多可以使用六个虚拟控制台。在大多数发行版中，第七个控制台用于 GUI 桌面。要返回\
  \ GUI 桌面，请按下 `Ctrl+Alt+F7`。\n\n## 使用 bash Shell\n\n如果你用过 MS-DOS，你可能熟悉 `COMMAND.COM`，它是\
  \ DOS 的命令解释器。该程序会显示臭名昭彰的 `C:\\>` 提示符。在 Windows 中，如果你打开命令窗口就能看到这个提示符。（要在 Microsoft\
  \ Windows 中打开命令窗口，请选择开始⇒  运行，在文本框中输入 `command`，然后点击确定。）\n\nLinux 自带有一个与 DOS 中的 `COMMAND.COM`\
  \ 相似的命令解释器，但它的功能强大得多。Linux 命令解释器被称为 `shell`（外壳）。\n\n许多 Linux 发行版的默认 shell 是 `bash`。当你打开终端窗口或在文本控制台登录时，`bash`\
  \ shell 会提示你输入命令。然后，当你输入一个命令时，shell 就会执行该命令。\n\n![technicalstuff](img/technicalstuff.png)\
  \ 就像 Linux 有多个 GUI（GNOME 或 KDE）可用一样，你也可以选择 `bash` 以外的 shell。例如，有些人更倾向于使用 `C` shell。你可以通过\
  \ `chsh` 命令轻松更改你的默认 shell。\n\n除了执行标准的 Linux 命令外，`bash` 还可以执行任何计算机程序。在 shell 提示符处输入应用程序名称（名称通常比你在\
  \ GNOME 或 KDE 菜单中看到的更晦涩），shell 就会启动该程序。\n\n### 理解 shell 命令的语法\n\n由于 shell 会解释你输入的内容，因此了解\
  \ shell 如何处理你输入的文本非常重要。所有的 shell 命令都具有以下通用格式（但某些命令没有选项）：\n\n`command` [`option1`]\
  \ [`option2`] … [`optionN]`\n\n发布此类命令的过程通常被称为 `command line`（命令行）。在命令行上，你输入一个命令，后面跟着零或多个选项（或\
  \ `arguments`）。这些选项字符串——`command-line options`（或命令行参数）会修改命令运行的方式，以便让它执行特定的任务。\n\n\
  shell 使用空格或制表符来区分命令和选项，因此你必须使用空格或制表符将命令与选项、选项与选项之间分开。\n\n如果选项包含空格，你需要将该选项放在引号内。例如，要在密码文件中搜索我的名字，请输入以下\
  \ `grep` 命令（`grep` 用于在文件中搜索文本）：\n\n```\ngrep \"Emmett Dulaney\" /etc/passwd\n```\n\
  \n当 `grep` 打印出包含我名字的那行时，它看起来如下：\n\n```\nedulaney:x:1000:100:Emmett Dulaney:/home/edulaney:/bin/bash\n\
  ```\n\n如果你用自己的用户名创建一个用户账户，请以用户名作为参数输入 `grep` 命令，以查找 `/etc/passwd` 文件中的用户名。\n\n![technicalstuff](img/technicalstuff.png)\
  \ 在 `grep` 命令的输出中，你会在最后一个冒号（`:`）之后看到 shell 的名称（`/bin/bash`）。因为 `bash` shell 是一个可执行文件，它位于\
  \ `/bin` 目录；你必须提供它的完整路径。\n\n命令行选项的数量和格式取决于具体的命令。通常，这些选项看起来像 `-X`，其中 `X` 是单个字符。例如，你可以在\
  \ `ls` 命令中使用 `-l` 选项。该命令列出目录的内容，选项提供了额外的详细信息。以下是在用户目录下输入 `ls -l` 的结果：\n\n```\ntotal\
  \ 0\ndrwxr-xr-x 2 edulaney users 48 2018-09-08 21:11 bin\ndrwx------ 2 edulaney\
  \ users 320 2018-09-08 21:16 Desktop\ndrwx------ 2 edulaney users 80 2018-09-08\
  \ 21:11 Documents\ndrwxr-xr-x 2 edulaney users 80 2018-09-08 21:11 public_html\n\
  drwxr-xr-x 2 edulaney users 464 2018-09-17 18:21 sdump\n```\n\n如果一个命令太长无法在单行显示，你可以按下反斜杠键（`\\\
  `）然后按回车，在下一行继续输入命令。输入以下命令，每行结束后按回车：\n\n```\ncat \\\n/etc/passwd\n```\n\n`cat` 命令显示\
  \ `/etc/passwd` 文件的内容。\n\n你可以通过分号（`;`）分隔命令，从而在单行上 `concatenate`（连接）多个较短的命令。\n\n\
  ```\ncd; ls -l; pwd\n```\n\n该命令将当前目录更改到主目录，列出该目录的内容，并...\n\n\n\n\n要将命令的输出保存到文件中，可以将标准输出重定向到文件。输入\
  \ `cd` 切换到主目录，然后输入以下命令：\n\n```\ngrep typedef /usr/include/* > typedef.out\n```\n\
  \n此命令在 `/usr/include` 目录下的所有文件中搜索文本 `typedef` 的出现情况，并将输出保存到名为 `typedef.out` 的文件中。大于号（``>`）将\
  \ `stdout` 重定向到文件。此命令还演示了 `bash` 的另一个特性：当你使用星号（`*`）时，`bash` 会将星号替换为指定目录下所有文件名的列表。因此，`/usr/include/*`\
  \ 意味着 `/usr/include` 目录下的所有文件。\n\n![tip](img/tip.png) 如果你想将命令输出追加到现有文件的末，而不是保存到新文件中，请使用两个大于号（`>>`），如下所示：\n\
  \n```\ncommand >> filename\n```\n\n![tip](img/tip.png) 另一种将 `stdout` 发送到文件的有趣方法是使用\
  \ `cat` 命令快速准备小型文本文件。假设你想创建一个新的文本文件，用于存储你输入的行，直到你输入 `ZZ` 并按回车。以下是实现该任务的方法：\n\n```\n\
  cat <<ZZ > input.txt\n```\n\n输入此命令后，你可以继续输入行，并在完成后另起一行并输入 `ZZ`。你输入的所有内容都会保存到 `input.txt`\
  \ 文件中。\n\n## 将错误信息保存到文件中\n\n有时，当你输入命令时，它会产生大量的错误信息，滚动速度快到你根本无法判断发生了什么。查看所有错误信息的一种方法是将它们保存到文件中，这样你就能看到到底发生了什么。你可以通过将\
  \ `stderr` 重定向到文件来实现这一点。\n\n输入以下命令：\n\n```\nfind / -name COPYING -print 2> finderr\n\
  ```\n\n此命令在文件系统中查找名为 `COPYING` 的文件，并将所有错误信息（如果有）保存到 `finderr` 文件中。数字 `2` 后跟大于号（`2>`）将\
  \ `stderr` 重定向到文件。\n\n![tip](img/tip.png) 如果你想丢弃错误信息而不是将其保存到文件中，请使用 `/dev/null`\
  \ 作为文件名，如下所示：\n\n```\nfind / -name COPYING -print 2> /dev/null\n```\n\n![technicalstuff](img/technicalstuff.png)\
  \ 这个 `/dev/null` 是特殊文件（通常称为 *bit bucket*，有时被美化为 *天上的大位桶*），它只是简单的丢弃接收到的任何内容。现在当你听到像“你的邮件可能进了位桶”这样的短语，你就知道是什么意思了。\n\
  \n## 通过自动命令补全减少输入\n\n许多命令接受文件名作为参数。例如，要查看 `/etc/modprobe.conf` 文本的内容，输入以下命令：\n\n\
  ```\ncat /etc/modprobe.conf\n```\n\n`cat` 命令显示 `/etc/modprobe.conf` 文件。对于任何接受文件名作为参数的命令，你都可以使用\
  \ `bash` 特性来避免输入整个文件名。你只需要输入足够在该目录中唯一标识该文件的字符。\n\n要查看示例，输入 `cat /etc/mod` 但不要按回车；而是按\
  \ Tab 键。`bash` 会自动补全文件名，因此命令变为 `cat /etc/modprobe.conf`。然后按回车运行命令。\n\n![tip](img/tip.png)\
  \ 每当你输入文件名时，在文件名的前几个字符后按 Tab 键。`bash` 可能补全文件名，这样你就不需要输入整个名称。如果你输入的字符不足以唯一标识该文件，`bash`\
  \ 会发出响声。多输入几个字符然后再次按 Tab 键。\n\n## 尽情使用星号和问号\n\n你还有另一种避免输入长文件名的方法。（毕竟，为用户减少工作正是我们使用计算机的原因，不是吗？）\n\
  \n这个特殊技巧涉及使用星号（`*`）和问号（`?`）。这些特殊字符是*通配符*，因为它们匹配文本行中的零个或多个字符。\n\n如果你熟悉 MS-DOS，你可能使用过诸如\
  \ `COPY *.* A:` 的命令将当前目录下的所有文件复制到 A: 盘。`bash` 接受文件名中类似的通配符。正如你所预期的，`bash` 比 MS-DOS\
  \ 命令解释器多多的通配符选项。当然，较新的计算机（特别是笔记本电脑，尤其是上网本）已经没有 A 和 B 盘了，这剥夺了整整一代人尝试将大文件拷贝到软磁盘的乐趣！\n\
  \n你可以在 `bash` 中使用三种通配符：\n\n*   星号（`*`）：匹配文件名中的零个或多个字符。星号表示目录中的所有文件。\n*   问号（`?`）：匹配任何单个字符。如果你输入\
  \ `test?`，`bash` 会匹配任何以 *test.* 开头的五字符文本。\n*   中括号中的字符集：匹配该集合中的任何单个字符。例如，字符串 `[aB]`\
  \ 仅匹配命名为 `a` 或 `B` 的文件。然而，字符串 `[aB]*` 匹配任何以 `a` 或 `B` 开头的文件名。\n\n当你想要对许多文件执行操作时，通配符非常方便。例如，要将\
  \ `/media/cdrom` 目录下的所有文件复制到当前目录，输入以下内容：\n\n```\ncp /media/cdrom/* .\n```\n\n`bash`\
  \ 将通配符 `*` 替换为 `/media/cdrom` 目录下的所有文件名。命令末尾的点表示当前目录。\n\n## 重复之前的命令\n\n为了让你更方便地重复之前的长命令，`bash`\
  \ 会存储多达 500 条旧命令作为*命令历史*（旧命令列表）的一部分。要查看命令历史，输入 `history`。`bash` 会显示带编号的旧命令列表，包括你在之前登录期间输入的命令。\n\
  \n如果命令列表太长，你可以限制想要看到的旧命令数量。要只查看最近的 10 条命令，请输入此命令：\n\n```\nhistory 10\n```\n\n要重复\
  \ `history` 命令显示的列表中的某个命令，输入感叹号（`!`），然后跟上该命令的编号。例如，要重复编号为 3 的命令，输入 `!3`。\n\n你可以在不知道命令编号的情况下重复命令。假设你几分钟前输入了\
  \ `more /usr/lib/X11/xdm/xdm-config`，现在你想再次查看该文件。要重复上一个 `more` 命令，输入以下内容：\n\n```\n\
  !more\n```\n\n\n\n\n通常，你想要重复上一次输入的命令，可能还会对其进行细微修改。例如，你可能使用 `ls -l` 命令显示了目录内容。要重复该命令，只需输入两个感叹号，如下：\n\
  \n`!!`\n\n有时，你想重复上一个命令但要为其添加额外的参数。假设 `ls -l` 显示的文件太多。重复该命令，但将输出通过 `more` 命令进行处理，如下：\n\
  \n`!! | more`\n\n`bash` 会将两个感叹号替换为上一个命令，并在该命令后附加 `| more`。\n\n![tip](img/tip.png)\
  \ 这里是找回以前命令的最简单方法：按向上箭头键。`bash` 会不断向回遍历你输入的命令历史。要在命令历史记录中向前移动，请按向下箭头键。\n\n## 发现和使用\
  \ Linux 命令\n\n你在 shell 提示符（shell prompt）处输入 Linux 命令。我所说的 `Linux 命令`是指 `bash` shell\
  \ 能够理解的某些命令，以及随 Linux 一带的命令行工具。在本节中，我将介绍几类主要的 Linux 命令。\n\n我无法在本章中涵盖每一个 Linux 命令，但我想通过向你展示常用的\
  \ Linux 命令，让你对这些命令的广泛性有所了解。表 3-2 按类别列出了常用的 Linux 命令。在你开始背诵任何 Linux 命令之前，请先浏览此表。\n\
  \n| **命令名称** | **作用** |\n| --- | --- |\n| **查找帮助和缩写** |  |\n| `apropos` | 为指定的关键字查找在线手册页。\
  \ |\n| `info` | 显示关于指定命令的在线帮助信息。 |\n| `man` | 显示在线帮助信息。 |\n| `whatis` | 仅搜索完整单词并查找在线手册页。\
  \ |\n| `alias` | 为长命令定义缩写。 |\n| `type` | 显示命令的类型和位置。 |\n| `unalias` | 删除用 `alias`\
  \ 定义的缩写。 |\n| **管理文件和目录** |  |\n| `cd` | 切换当前目录。 |\n| `chmod` | 修改文件权限。 |\n| `chown`\
  \ | 修改文件所有者和所属组。\n| `cp` | 复制文件。 |\n| `ln` | 创建文件和目录的符号链接。 |\n| `ls` | 显示目录内容。 |\n\
  | `mkdir` | 创建目录。 |\n| `mv` | 重命名文件并将文件从一个目录移动到另一个目录。 |\n| `rm` | 删除文件。 |\n| `rmdir`\
  \ | 删除目录。 |\n| `pwd` | 显示当前目录。 |\n| `touch` | 更新文件的时间戳。 |\n| **查找文件** |  |\n| `find`\
  \ | 根据指定的标准（如名称和大小）查找文件。 |\n| `locate` | 使用定期更新的文件名数据库查找文件。（该数据库由 `updatedb` 程序创建。）\
  \ |\n| `whereis` | 在存放 `executable` 可执行文件，也称为 `binary` 文件）的典型目录中查找文件。 |\n| `which`\
  \ | 在 `PATH` 环境变量列出的目录中查找文件。 |\n| **处理文件** |  |\n| `cat` | 在标准输出中显示文件（可将多个文件合并为一个大文件）。\
  \ |\n| `cut` | 从文件中每行的文本中提取指定的部分。 |\n| `dd` | 将数据块从一个文件复制到另一个文件（用于从设备复制数据）。 |\n\
  | `diff` | 比较两个文本文件并找出任何差异。 |\n| `expand` | 将所有制表符（tabs）转换为空格。 |\n| `file` | 显示文件中数据的类型。\
  \ |\n| `fold` | 将每行文本折行以适应指定的宽度。 |\n| `grep` | 在文本文件中搜索正则表达式。 |\n| `less` | 每次页显示一个文本文件。（按\
  \ `b` 向后移动。） |\n| `lpr` | 打印文件。 |\n| `more` | 每次页显示一个文本文件。（仅向前移动）。 |\n| `nl` | 为文本文件中所有非空行进行编号，并将行打印到标准输出。\
  \ |\n| `paste` | 合并多个文件中的对应行。 |\n| `patch` | 使用原始文件和修订版文件之间的差异更新文本文件。 |\n| `sed`\
  \ | 在应用指定编辑命令的同时将文件复制到标准输出。 |\n| `sort` | 对文本文件中的行进行排序。 |\n| `split` | 将文件拆分为多个指定大小的小型文件。\
  \ |\n| `tac` | 反转文件（最后一行在前，依此类推）。 |\n| `tail` | 显示文件的最后几行。 |\n| `tr` | 在整个文件中用一组字符替换另一组字符。\
  \ |\n| `uniq` | 消除文本中的重复行。 |\n| `wc` | 统计文本文件的行数、单词和字符数。 |\n| `zcat` | 显示压缩文件（解压后）。\
  \ |\n| `zless` | 每次页显示一个压缩文件。（按 `b` 向后移动。） |\n| `zmore` | 每次页显示一个压缩文件。 |\n| **归档和压缩**\
  \ |  |\n| `compress` | 压缩文件。 |\n| `cpio` | 归档或复制到归档。 |\n| `gunzip` | 解压缩文件。 |\n\
  | `gzip` | 使用 Zip 压缩文件。 |\n| `tar` | 创建一个或多个目录的档。 |\n| `uncompress` | 使用 `compress`\
  \ 解压缩文件。 |\n| **管理文件** |  |\n| `bg` | 在后台运行进程。 |\n| `fg` | 在前台运行进程。 |\n| `free`\
  \ | 显示系统的空闲和已内存。 |\n| `halt` | 停止 Linux。 |\n| `kill` | 向进程发送信号（通常用于终止它）。 |\n| `ldd`\
  \ | 显示运行程序所需的共享库。 |\n| `nice` | 以较低的优先级运行进程（称为 nice 模式）。 |\n| `ps` | 显示运行进程列表。 |\n\
  | `printenv` | 显示环境变量。 |\n| `pstree` | 显示父子进程关系。 |\n| `reboot` | 停止 Linux 并重启。 |\n\
  | `shutdown` | 关闭 Linux。 |\n| `top` | 显示处理器和内存密集型进程。 |\n| `uname` | 显示系统和 Linux\
  \ 内核信息。 |\n| **管理用户** |  |\n| `chsh` | 修改 shell（解释器）。 |\n| `groups` | 包含指定用户的组列表。\
  \ |\n| `id` | 显示用户和组 ID。 |\n| `passwd` | 更改密码。 |\n| `su` | 以另一个用户启动新 shell。（如果不带任何参数，假设用户为\
  \ `root`。） |\n| **管理文件系统** |  |\n| `df` | 总结所有挂载设备的空闲可用空间。 |\n| `du` | 显示磁盘使用信息。\
  \ |\n| `fdformat` | 格式化软磁盘。 |\n| `fdisk` | 对硬盘分区。 |\n| `fsck` | 并修复文件系统。 |\n| `mkfs`\
  \ | 创建新的文件系统。 |\n| `mknod` | 创建设备文件。 |\n| `mkswap` | 为文件或硬盘分区创建交换空间。 |\n| `mount`\
  \ | 将设备（如 CD-ROM）挂载到文件系统中的目录。 |\n| `swapoff` | 禁用交换空间。 |\n| `swapon` | 激活交换空间。 |\n\
  | `sync` | 将缓冲（保存在内存）数据写入文件。 |\n| `tty` | 显示当前终端的设备名称。 |\n| `umount` | 从文件系统卸载设备。\
  \ |\n| **显示日期和时间** |  |\n| `cal` | 显示指定月份或年份的日历。 |\n| `date` | 显示当前日期时间或设置新的日期时间。\n\
  \n### 成为 root（超级用户）\n\n当你想要执行任何需要高权限级别的操作（例如管理系统）时，你必须成为 `root`。通常，你以你的普通用户用户名登录。但当你需要超级用户的权限时，使用以下命令成为\
  \ `root`：\n\n`su -`\n\n\n\n\n\n该命令是 `su` 后面跟一个空格和减号（或连字符）。shell 会提示你输入 `root` 密码。输入密码并按回车。\n\
  \n当你完成以 `root` 身份想要执行的任何操作（且你有以 `root` 身份执行任何操作的权限），输入 `exit` 返回你的普通用户名。\n\n![technicalstuff](img/technicalstuff.png)\
  \ 与其通过 `su -` 命令变为 `root`，你可以输入 `sudo` 后紧跟你想要以 `root` 身份运行的命令。在 Ubuntu 中，你必须使用 `sudo`\
  \ 命令，因为在安装 Ubuntu 时你并没有设置 `root` 用户。如果你在 `/etc/sudoers` 文件被列为授权用户，`sudo` 将执行该命令，就像你已经以\
  \ `root` 身份登录一样。输入 `man sudoers` 可以阅读更多关于 `/etc/sudoers` 文件的信息。\n\n### 管理进程\n\n\
  每当 shell 执行你输入的某个命令时，它都会启动一个进程。shell 本身是一个进程，shell 运行的任何脚本或程序也是。\n\n使用 `ps ax` 命令查看进程列表。当你输入\
  \ `ps ax` 时，`bash` 会向你显示当前的进程。以下是我输入 `ps ax --cols 132` 时出现的几行输出。（我包含了 `-cols 132`\
  \ 选项以确保你能看到完整的命令。）\n\n```\nPID TTY STAT TIME COMMAND\n1 ? S 0:01 init [5]\n2 ? SN\
  \ 0:00 [ksoftirqd/0]\n3 ? S< 0:00 [events/0]\n4 ? S< 0:00 [khelper]\n9 ? S< 0:00\
  \ [kthread]\n19 ? S< 0:00 [kacpid]\n75 ? S< 0:00 [kblockd/0]\n115 ? S 0:00 [pdflush]\n\
  116 ? S 0:01 [pdflush]\n118 ? S 0:00 [aio/0]\n117 ? S 0:00 [kswapd0]\n711 ? S 0:00\
  \ [kseriod]\n1075 ? S< 0:00 [reiserfs/0]\n2086 ? S 0:00 [kjournald]\n2239 ? Ss 0:00\
  \ /sbin/udevd -d\n… lines deleted …\n6374 ? S 1:51 /usr/X11R6/bin/X :0 -audit 0\
  \ -auth /var/lib/gdm/:0.Xauth\n-nolisten tcp vt7\n6460 ? Ss 0:02 /opt/gnome/bin/gdmgreeter\n\
  6671 ? Ss 0:00 sshd: edulaney [priv]\n6675 ? S 0:00 sshd: edulaney@pts/0\n6676 pts/0\
  \ Ss 0:00 -bash\n6712 pts/0 S 0:00 vsftpd\n14702 ? S 0:00 pickup -l -t fifo -u\n\
  14752 pts/0 R+ 0:00 ps ax --cols 132\n```\n\n![tip](img/tip.png) 在此列表中，第一列标题为 `PID`，并显示每个进程的数字。`PID`\
  \ 代表 `process ID`（进程标识符），是 Linux 内核分配的顺序数字。如果你查看 `ps ax` 命令的输出，你会发现 `init` 命令是第一个进程，其\
  \ PID 为 `1`。出于这个原因，`init` 被称为所有进程之父。\n\n\n\n\n\n你可以使用 `sort` 命令对文本文件中的行进行排序。要查看\
  \ `sort` 命令如何工作，请先输入 `more /etc/passwd` 来查看 `/etc/passwd` 文件的当前内容。然后输入 `sort /etc/passwd`\
  \ 即可按字母顺序对行进行排序。如果你想对文件进行排序并将排序后的版本保存到另一个文件中，必须使用 `bash` shell 的输出重定向功能，如下所示：\n\n\
  ```\nsort /etc/passwd > ~/sorted.text\n```\n\n该命令对 `/etc/passwd` 文件中的行进行排序，并将输出保存到你家目录下名为\
  \ `sorted.text` 的文件中。\n\n### 从文件中替换或删除字符\n\n另一个很有用的命令是 `tr`，它可以在整个文件中将一组字符替换为另一组字符（或删除选定的字符）。假设你偶尔需要在\
  \ Linux 系统上使用 MS-DOS 文本文件。虽然你可能认为可以在任何系统上无障碍地使用文本文件，但你发现了一个问题：DOS 使用回车符（carriage\
  \ return）跟随换行符（line feed）来标记每行的结束，而 Linux 只使用换行符。\n\n![tip](img/tip.png) 在 Linux\
  \ 系统上，你可以使用带有 `-d` 选项的 `tr` 命令删除 DOS 文本文件中额外的回车符。本质上，要将名为 `filename.dos` 的 DOS 文本文件转换为名为\
  \ `filename.linux` 的 Linux 文本文件，请输入以下：\n\n```\ntr -d '\\015' < filename.dos > filename.linux\n\
  ```\n\n在此命令中，`'\\015'` 表示八进制表示法的回车字符代码。\n\n### 将文件分成若干个小文件\n\n当你想要复制一个文件但该文件太大无法作为邮件附件发送时，`split`\
  \ 命令就非常有用。你可以使用 `split` 命令将文件分成较小的文件。\n\n默认情况下，`split` 将每个文件分为 1,000 行。新拆分的文件按字母组组命名：`aa`、`ab`、`ac`\
  \ 等。你可以为文件名指定前缀。要将一个名为 `hugefile.tar` 的大文件拆分为较小文件，如下所示使用 `split`：\n\n```\nsplit\
  \ -b 9999k hugefile.tar part.\n```\n\n该命令将 `hugefile.tar` 文件拆分为 9999KB 的块。该命令创建了名为\
  \ `part.aa`、`part.ab`、`part.ac` 等的文件。\n\n要将拆分的文件合并为单个文件，如下所示使用 `cat` 命令：\n\n```\n\
  cat part.?? > hugefile.tar\n```\n\n在这种情况下，两个问号（`??`）匹配文件名中任何两个字符的扩展名。换句话说，文件名 `part.??`\
  \ 匹配所有文件名，例如 `part.12`、`part.aa`、`part.ab` 和 `part.2b`。\n\n## Shell 脚本\n\n如果你用过\
  \ MS-DOS，可能记得 MS-DOS 批处理（包含 MS-DOS 命令的文本文件）。同样，shell 脚本是大量 shell 命令的文本文件。\n\n如果你不是程序员，可能会对编程感到畏惧，但\
  \ shell 编程可以像在文件中存储几个命令一样简单。现在，你可能还没有编写复杂 shell 脚本的能力，但完全可以尝试一个简单的 shell 脚本。\n\n\
  要尝试一下 shell 编程，请在 shell 提示符处完全按照所示输入以下文本，完成后按 Ctrl+D：\n\n```\ncd\ncat > simple\n\
  #!/bin/sh\necho \"This script's name is: $0\"\necho Argument 1: $1\necho Argument\
  \ 2: $2\n```\n\n按下 Ctrl+D。\n\n`cd` 命令将当前目录更改为家目录——如果不指定选项，`cd` 默认指向家目录。然后 `cat`\
  \ 命令会在按下 Ctrl+D 之前显示后续输入的任何其他行。在这种情况下，你使用 `> simple` 将输出发送到名为 `simple` 的文件中。按下 Ctrl+D\
  \ 后，`cat` 命令结束，你会看到 shell 提示符。你创建了一个名为 `simple` 的文件，包含以下 shell 脚本：\n\n```\n#!/bin/sh\n\
  echo \"This script's name is: $0\"\necho Argument 1: $1\necho Argument 2: $2\n```\n\
  \n第一行让 Linux 运行 `bash` shell 程序（名为 `/bin/bash`）。然后 shell 读取脚本中的其余行。\n\n就如同大多数 Linux\
  \ 命令接受命令行选项一样，`bash` 脚本也接受命令行选项。在脚本内部，你可以将选项引用为 `$1`、`$2` 等。特殊名称 `$0` 指向脚本本身。\n\n\
  要运行此 shell 脚本，首先使用以下命令使文件具有可执行权限（即将其转换为程序）：\n\n```\nchmod +x simple\n```\n\n输入 `./simple\
  \ one two` 来运行脚本，它将显示以下输出：\n\n```\nThis script's name is: ./simple\nArgument 1:\
  \ one\nArgument 2: two\n```\n\n脚本名称中的 `./` 前缀表示 `simple` 文件位于当前目录。\n\n该脚本打印脚本名称以及用户在脚本名称后输入的前两个命令行选项。\n\
  \n接下来，尝试带有几个参数运行脚本，如下：\n\n```\n./simple \"This is one argument\" second-argument\
  \ third\n```\n\n```\nThis script's name is: ./simple\nArgument 1: This is one argument\n\
  Argument 2: second-argument\n```\n\n\n\n\n\n![remember](img/remember.png) 在 Linux\
  \ 中，你可以拥有长文件名（多达 256 个字符），且文件名区分大小写。文件名通常有多个扩展名，例如 `sample.tar.Z`。Unix 文件名有多种形式，例如：`index.html`、`Makefile`、`binutils-2.15.92.0.2-5.i386.rpm`、`vsftpd_2.0.3-1_i386.deb`、`.bash_profile`\
  \ 以及 `httpd_src.tar.gz`。\n\n定位文件不仅需要文件名，还需要关于目录层次结构的信息。显示指向文件的完整目录层次结构的扩展文件名是 `pathname`（路径）。正如其名称所示，它是通过文件系统迷宫到达文件的路径。图\
  \ 4-2 显示了 Linux 中一个文件的典型路径。\n\n![image](img/9781119490463-fg020402.png)\n\n图 4-2：\
  \ 文件路径显示了指向文件的目录序列。\n\n如图 4-2 所示，路径包含以下部分：\n\n*   **`root` 目录**，由正斜杠 (`/`) 表示。\n\
  *   **目录层次结构**，每个目录名之间用正斜杠 (`/`) 分隔。在最后一个目录名后会出现一个 `/`。\n*   **文件名**，包含一个名称和一个或多个可选的扩展名。（在每个扩展名之前有一个点。）\n\
  \nLinux 文件系统拥有一组定义良好的顶层目录，其中某些目录具有特定用途。如果你了解这些目录的用途，在文件系统中穿行就会变得更容易。当你面对新情况时，你也会擅长猜测去哪里寻找特定类型的文件。表\
  \ 4-1 简要描述了 Linux 文件系统中的顶层目录。\n\n| **目录** | **包含** |\n| --- | --- |\n| `/` | 文件系统的基根。无论物理位置如何，所有文件和目录逻辑上都包含在\
  \ `root` 或 `/` 目录中。 |\n| `/bin` | Linux 操作系统的一部分的可执行程序。许多 Linux 命令——如 `cat`、`cp`、`ls`、`more`\
  \ 和 `tar`——都在 `/bin` 中。 |\n| `/boot` | Linux 内核以及 LILO 和 GRUB 引导管理器需要的文件。内核和其他文件可以位于任何地方，但将它们放在\
  \ `/boot` 目录是习惯。 |\n| `/dev` | 代表连接到系统的设备的特殊文件。 |\n| `/etc` | 大多数系统配置文件和初始化脚本（位于\
  \ `/etc/rc.d` 子目录中）。 |\n| `/home` | 所有用户的家目录。例如，用户 `edulaney` 的家目录是 `/home/edulaney`。\
  \ |\n| `/lib` | 启动 Linux 所所需的 `/sbin` 和 `/bin` 目录中所有程序的库文件（包括可加载的驱动模块）。 |\n| `/lost+found`\
  \ | 丢失的文件。每个磁盘分区都有一个 `lost+found` 目录。 |\n| `/media` | `/media/cdrom` 或 `/media/cdrom0`\
  \ 目录用于挂载 CD/DVD-ROM 驱动器。如果你有 CD/DVD 刻录机，你会发现 `/media/cdrecorder` 而不是 `/media/cdrom`，可能还会发现\
  \ `/media/DVD`。media` 用于挂载移动介质上的文件系统，如 CD/DVD-ROM 驱动器、优盘、外部驱动、软磁盘和 Zip 驱动器。如果你有一台带有软盘器的老机器，还存在用于挂载软磁盘的\
  \ `/media/floppy` 目录。 |\n| `/mnt` | 临时挂载的文件系统。 |\n| `/opt` | 大型应用程序软件包的存储空间。例如，某些发行版将\
  \ LibreOffice Suite 安装在 `/opt` 目录。 |\n| `/proc` | 关于 Linux 系统运行进程的各种信息。 |\n| `/root`\
  \ | `root` 用户的家目录。 |\n| `/sbin` | 通常用于系统管理任务并供 `root` 用户使用的可执行文件。如 `halt` 和 `shutdown`\
  \ 等命令位于 `/sbin` 目录。 |\n| `/srv` | 本系统提供的服务（如 Web 和 FTP）的数据。 |\n| `/sys` | Linux\
  \ 内核所看到的设备信息。 |\n| `/tmp` | 任何用户都可以作为 `scratch` 目录使用的临时目录，这意味着该目录的内容被认为是不重要的，并且通常在每次系统启动时被删除。\
  \ |\n| `/usr` | 许多重要程序的子目录，例如 X Window 系统（位于 `/usr/X11R6` 目录中）和在线手册。(表 4-2 显示了 `/usr`\
  \ 中的一些标准子目录。） |\n| `/var` | 各种系统文件（如日志），以及存放其他信息的目录，例如 Web 服务器和匿名 FTP 服务器的文件。 |\n\
  \n表 4-1 Linux 文件系统中的顶层目录\n\n`/usr` 和 `/var` 目录包含子目录。表 4-2 显示了 `/var` 类似的拆分情况。\n\n\
  | **子目录** | **描述** |\n| --- | --- |\n| `/usr/bin` | 不属于核心内核的可执行程序。 |\n| `/usr/games`\
  \ | 一些游戏。 |\n| `/usr/include` | C 和 C++ 的头文件。 |\n| `/usr/lib` | 许多应用程序库。 |\n| `/usr/local`\
  \ | 在你的系统上开发的任何程序的本地文件。 |\n| `/usr/sbin` | 许多管理命令。 |\n| `/usr/share` | 共享数据，例如许多应用程序的默认配置文件和图像。\
  \ |\n| `/usr/share/man` | 在线手册（你可以使用 `man` 命令阅读）。 |\n| `/usr/src` | Linux 内核的源代码。\
  \ |\n\n表 4-2 重要的 `/usr` 子目录\n\n| **子目录** | **包含** |\n| --- | --- |\n| `/var/cache`\
  \ | 应用程序缓存存储区域。 |\n| `/var/lib` | 与应用程序当前状态的信息。 |\n| `/var/lock` | 锁文件，确保资源只被一个应用程序使用。\
  \ |\n| `/var/log` | 分类在子目录中的日志文件。 |\n| `/var/mail` | 用户邮件文件。 |\n| `/var/opt` | 存储在\
  \ `/opt` 目录中的软件包的可变数据。 |\n| `/var/run` | 自启动以来描述的数据。 |\n| `/var/spool` | 等待某种处理的数据。\
  \ |\n| `/var/tmp` | 系统重启间保留的临时文件。 |\n| `/var/yp` | 网络信息服务 (NIS) 数据库文件。 |\n\n表 4-3\
  \ 重要的 `/var` 子目录\n\n\n\n\n虽然像 `Nautilus`（在 GNOME 中）或 `Konqueror`（在 KDE 中）这样的 GUI\
  \ 文件管理器易于使用，但只有在拥有可用的 GUI 桌面时你才能使用它们。有时，你没有可以运行图形文件管理器的图形环境。你可能通过文本终端登录，或者 `X` 在你的系统上未运行。在这种情况下，你必须依赖\
  \ Linux 命令来处理文件和目录。即使在图形环境中，你也可以随时使用 Linux 命令；你只需要打开终端窗口并输入 Linux 命令即可。\n\n在本节中，我将简要描述一些在\
  \ Linux 文件系统中移动的 Linux 命令。\n\n## 目录导航命令\n\n在 Linux 中，当你以 `root` 身份登录时，你的主目录是 `/root`。对于其他用户，主目录通常在\
  \ `/home` 目录下。我的主目录（当我以 `edulaney` 登录时）是 `/home/edulaney`。这些信息存储在 `/etc/passwd`\
  \ 文件中。默认情况下，只有你有权限在你的主目录中保存文件，且只有你可以在主目录中创建子目录来进一步组织你的文件。\n\nLinux 支持*当前*目录的概念，即所有文件和目录命令所属的目录。例如，在你登录后，当前目录就是主目录。要查看当前目录，输入\
  \ `pwd` 命令。\n\n要更改当前目录，使用 `cd` 命令。要将当前目录更改为 `/usr/lib`，输入以下内容：\n\n```bash\ncd /usr/lib\n\
  ```\n\n然后，要切换到 `/usr/lib` 下的 `cups` 子目录，输入此命令：\n\n```bash\ncd cups\n```\n\n现在如果你使用\
  \ `pwd` 命令，该命令将显示 `/usr/lib/cups` 为当前目录。\n\n这两个示例说明你可以通过两种方式引用目录名称：\n\n*   **绝对路径：**\
  \ 示例是 `/usr/lib`，它是目录树中一个精确的目录。将绝对路径想象成包裹的完整邮件地址，邮政服务将其投递到你的邻居处。\n*   **相对目录名：**\
  \ 示例是 `cups`，它代表当前目录下的 `cups` 子目录（无论当前目录在哪里）。将相对目录名想象为为邮员提供从你家到邻居家的路线，以便邮员投递包裹。\n\
  \n如果我在 `/usr/lib` 中输入 `cd cups`，当前目录将变为 `/usr/lib/cups`。如果我在 `/home/edulaney` 中输入相同的命令，shell\
  \ 将尝试将当前目录更改为 `/home/edulaney/cups`。\n\n![tip](img/tip.png) 不带参数使用 `cd` 命令可以将当前目录切回你的主目录。无论你在哪里，在\
  \ shell 提示符下输入 `cd` 即可回到家！\n\n![technicalstuff](img/technicalstuff.png) 波浪号字符 (`~`)\
  \ 代表你的主目录。因此，你可以通过命令 `cd ~` 将当前目录更改为主目录。你可以通过在波浪号后添加用户名来引用另一个用户的主目录。例如，`cd ~superman`\
  \ 将当前目录更改为 `superman` 的主目录。\n\n![tip](img/tip.png) 等等——还有。单点（`.`）和双点（`. .`）——通常被巧妙地称为*点点*——也有特殊含义。单点（`.`）表示当前目录，而双点（`.\
  \ .`）表示父目录。如果当前目录是 `/usr/share`，你可以通过输入以下内容返回上一级 `/usr`：\n\n```bash\ncd . .\n```\n\
  \n## 目录列表和权限命令\n\n你可以使用 `ls` 命令获取目录列表。默认情况下，不带选项的 `ls` 命令会以紧凑的多列格式显示当前目录的内容。输入接下来两个命令来查看\
  \ `/etc/X11` 目录的内容：\n\n```bash\ncd /etc/X11\nls\n```\n\n输出如下，控制台上的某些项目以不同的颜色显示：\n\
  \n```\nX Xsession.d cursors rgb.txt xkb\nXF86Config-4 Xsession.options default-display-manager\
  \ rstart xserver\nXresources Xwrapper.config fonts sysconfig xsm\nXsession app-defaults\
  \ gdm xinit\n```\n\n从这个列表中，如果没有颜色的情况下，你无法判断某个条目是文件还是目录。要区分目录和文件，请对 `ls` 使用 `-F`\
  \ 选项，如下：\n\n```bash\nls -F\n```\n\n这一次，输出为你提供了关于文件类型的更多线索：\n\n```\nX@ Xsession.d/\
  \ cursors/ rgb.txt xkb/\nXF86Config-4 Xsession.options default-display-manager rstart/\
  \ xserver/\nXresources/ Xwrapper.config fonts/ sysconfig/ xsm/\nXsession* app-defaults/\
  \ gdm@ xinit/\n```\n\n`ls -F` 的输出在目录名后附加了斜杠 (`/`)。纯文件名按原显示。文件名后附加的 @ 符号 (`@`)（例如名为\
  \ `X` 的文件）表示该文件是指向另一个文件的链接。换句话说，这个文件名只是指向另一个文件；它是快捷方式。星号 (`*`) 附加到可执行文件。（例如，`Xsession`\
  \ 就是一个可执行文件）。shell 可以运行任何可执行文件。\n\n你可以通过 `-l` 选项查看更详细的信息：\n\n```bash\nls -l\n```\n\
  \n输出如下，控制台上的某些项目以不同的颜色显示：\n\n```\ntotal 84\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00\
  \ .\ndrwxr-xr-x 3 root root 4096 Oct 12 09:50 ..\nlrwxrwxrwx 1 root root 12 Oct\
  \ 12 09:59 X -> /run/X11\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00 Xsession.d\n\
  drwxr-xr-x 2 root root 4096 Oct 12 10:00 cursors\n-rw-r--r-- 1 root root 12 Oct\
  \ 12 10:00 rgb.txt\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00 xkb\n-rw-r--r-- 1 root\
  \ root 287 Oct 12 10:00 XF86Config-4\n-rw-r--r-- 1 root root 150 Oct 12 10:00 Xsession.options\n\
  -rw-r--r-- 1 root root 200 Oct 12 10:00 default-display-manager\n-rwxr-xr-x 1 root\
  \ root 45 Oct 12 10:00 rstart\n-rwxr-xr-x 1 root root 120 Oct 12 10:00 xserver\n\
  -rw-r--r-- 1 root root 300 Oct 12 10:00 Xresources\n-rw-r--r-- 1 root root 250 Oct\
  \ 12 10:00 Xwrapper.config\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00 fonts\ndrwxr-xr-x\
  \ 2 root root 4096 Oct 12 10:00 sysconfig\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00\
  \ xsm\n-rw-r--r-- 1 root root 180 Oct 12 10:00 Xsession\ndrwxr-xr-x 2 root root\
  \ 4096 Oct 12 10:00 app-defaults\ndrwxr-xr-x 2 root root 4096 Oct 12 10:00 gdm\n\
  -rwxr-xr-x 1 root root 80 Oct 12 10:00 xinit\n```\n\n从这个列表中，如果没有颜色，你无法判断一个条目是文件还是目录。要区分目录和文件，请对\
  \ `ls` 使用 `-F` 选项，如下：\n\n```bash\nls -F\n```\n\n这一次，输出为你提供了关于文件类型的更多线索：\n\n```\n\
  X@ Xsession.d/ cursors/ rgb.txt xkb/\nXF86Config-4 Xsession.options default-display-manager\
  \ rstart/ xserver/\nXresources/ Xwrapper.config fonts/ sysconfig/ xsm/\nXsession*\
  \ app-defaults/ gdm@ xinit/\n```\n\n`ls -F` 的输出在目录名后附加了斜杠 (`/`)。纯文件名按原显示。文件名后附加的\
  \ @ 符号 (`@`)（例如名为 `X` 的文件）表示该文件是指向另一个文件的链接。换句话说，这个文件名只是指向另一个文件；它是快捷方式。星号 (`*`) 附加到可执行文件。（例如，`Xsession`\
  \ 就是一个可执行文件）。shell 可以运行任何可执行文件。\n\n\n\n\n*   **最左侧的 `rwx` 组：** 控制文件所有者的读、写和执行权限。句话说，如果你在该位置看到\
  \ `rwx`，则文件所有者可以读取(`r`)、写入(`w`)并执行(`x`)该文件。字母位置上的连字符表示没有该权限。因此，字符串 `rw-` 意味着所有者具有读取和写入权限，但没有执行权限。虽然可执行程序（包括\
  \ shell 程序）通常具有执行权限，但目录将执行权限等同于*使用*权限。用户在打开和读取目录内容之前，必须对该目录具有执行权限。\n*   **中间的 `rwx`\
  \ 组：** 控制属于文件组的任何用户的读、写和执行权限。\n*   **最右侧的 `rwx` 组：** 控制所有其他用户（统称为*世界*）的读、写和执行权限。\n\
  \n因此，权限设置为 `rwx------` 的文件仅对文件所有者可访问，而权限设置为 `rwxr--r--` 则允许世界上的人读取该文件。\n\n`ls` 命令的一个有趣特性是，它不会列出任何以点开头的文件。要查看这些文件，你必须使用带有\
  \ `-a` 选项的 `ls` 命令，如下：\n\n```\nls -a\n```\n\n在你的主目录下尝试此命令，然后将结果与不使用 `-a` 选项时看到的结果进行比较：\n\
  \n1.  **输入** `cd` **切换到你的主目录。**\n2.  **输入** `ls -F` **查看主目录中的文件和目录。**\n3.  **输入**\
  \ `ls -aF` **查看所有内容，包括隐藏文件。**\n\n![tip](img/tip.png) 大多数 Linux 命令使用单字符选项，每个选项以连字符作为前缀。当你想要使用多个选项时，输入一个连字符并将选项字母一个接一个*连接*在一起。因此，`ls\
  \ -al` 等同于 `ls -a -l` 也等同于 `ls -l -a`。\n\n### 修改权限和所有权的命令\n\n你可能需要更改文件的权限设置以保护其不受他人干扰。使用\
  \ `chmod` 命令更改文件或目录的权限设置。\n\n为了有效使用 `chmod`，你必须指定权限设置。一种很好的方法是按照表 4-4 中所示的顺序（对象/操作/权限）连接列中的字母。\n\
  \n| **对象** | **操作** | **权限** |\n| --- | --- | --- |\n| `u` (用户) | `+` (添加) | `r`\
  \ (读取) |\n| `g` (组) | `–` (移除) | `w` (写入) |\n| `o` (其他) | `=` (分配) | `x` (执行) |\n\
  | `a` (全部) | `s` (设置用户 ID) |  |\n\n表 4-4 文件权限字母代码\n\n![technicalstuff](img/technicalstuff.png)\
  \ 你仅使用每列中的单字符；括号中的文字仅用于解释。\n\n要让每个人对目录下的所有文件读取权限，从第一列选择 `a`（代表*所有*），从第二列选择 `+`（代表*添加*），从第三列选择\
  \ `r`（代表*读取*），从而得到权限设置 `a+r`。然后使用 `chmod` 配合这些选项，如下：\n\n```\nchmod a+r *.\n```\n\
  \n另一方面，要允许所有人执行一个特定的文件，请输入\n\n```\nchmod a+x filename\n```\n\n![tip](img/tip.png)\
  \ 假设你想保护一个名为 `mystuff` 的文件。如果你按照顺序输入以下命令，可以使其除你以外的任何人无法访问：\n\n```\nchmod a-rwx mystuff\n\
  chmod u+rw mystuff\n```\n\n第一条命令关闭了所有权限，第二条命令开启了所有者（你）的读取和写入权限。输入 `ls -l` 以验证更改已生效。（你会看到权限设置为\
  \ `-rw--------------`。）\n\n有时，你必须更改文件的用户或组所有权才能让一切正常工作。假设你被指示（通过手册，还能什么？）创建一个名为\
  \ `cups` 的目录，并赋予其用户 ID `lp` 和组 ID `sys` 的所有权。你应该如何做？\n\n嗯，你可以以 `root` 身份登录并使用 `mkdir`\
  \ 命令创建 `cups` 目录：\n\n```\nmkdir cups\n```\n\n如果你使用 `ls -l` 命令检查文件详情，你会看到用户和组所有权是\
  \ `root root`。\n\n![tip](img/tip.png) 要更改所有者，使用 `chown` 命令。要将 `cups` 目录的所有权更改为用户\
  \ ID `lp` 和组 ID `sys`，请输入\n\n```\nchown lp.sys cups\n```\n\n### 处理文件的命令\n\n将文件从一个目录复制到另一个目录，使用\
  \ `cp` 命令。如果你想将文件复制到当前目录但保留原始名称，请使用点 (`.`) 作为 `cp` 命令的第二个参数。因此，以下命令将 `/etc/X11`\
  \ 目录下的 `Xresources` 文件复制到当前目录：\n\n```\ncp /etc/X11/Xresources .\n```\n\n`ls` 命令的一个有趣特性是，它不会列出任何以点开头的文件。要查看这些文件，你必须使用带有\
  \ `-a` 选项的 `ls` 命令，如下：\n\n```\nls -a\n```\n\n在你的主目录下尝试此命令，然后将结果与不使用 `-a` 选项时看到的结果进行比较：\n\
  \n1.  **输入** `cd` **切换到你的主目录。**\n2.  **输入** `ls -F` **查看主目录中的文件和目录。**\n3.  **输入**\
  \ `ls -aF` **查看所有内容，包括隐藏文件。**\n\n![tip](img/tip.png) 大多数 Linux 命令使用单字符选项，每个选项以连字符作为前缀。当你想要使用多个选项时，输入一个连字符并将选项字母一个接一个*连接*在一起。因此，`ls\
  \ -al` 等同于 `ls -a -l` 也等同于 `ls -l -a`。\n\n### 修改权限和所有权的命令\n\n你可能需要更改文件的权限设置以保护其不受他人干扰。使用\
