  \ | 3 | 理解安全技术 | 封装。 |\n\n表 2-11 领域 110 拆解\n\n为了充分应对这些主题，请关注以下文件、术语和工具：`/etc/allow``/etc/deny``/etc/inetd.conf``/etc/inetd.d/*``/etc/init.d/*``/etc/ittab``/etc/nologin``/etc/passwd``/etc/shadow``/etc/ssh/ssh_host_dsa_key``/etc/ssh/ssh_host_rsa_key``/etc/ssh/known_hosts``/etc/sudoers``/etc/xinetd.conf``/etc/xinetd.d/*``~/.gnupg/*``~/.ssh/authorized_keys``~/.ssh/id_dsa``~/.ssh/id_rsa`、`chage`、`find`、`gpg`、`id_dsa.pub`、`id_rsa.pub`、`lsof`、`netstat`、`nmap`、`passwd`、`ssh`、`ssh_host_dsa_key.pub`、`ssh_host_rsa_key.pub`、`ssh-add`、`ssh-agent`、`ssh-keygen`、`su`、`sudo`、`ulimit`\
  \ 和 `usermod`。\n\n在学习该领域时，以下需要了解的前十项内容：\n\n*   在标准权限上加上 1000 可开启粘位，而 2000 可开启 SGID\
  \ 权限，4000 可开启 SUID 权限。\n*   使用 `ln` 命令创建链接*硬链接*仅仅是文件的别名（共享索引节点）。符号链接通过 `ln -s` 创建，是一个具有自己索引节点的实际文件。符号链接包含指向原始文件的指针，并可以跨文件系统（而硬链接不能）。\n\
  *   使用 `passwd` 命令更改密码。旧系统将密码存储在 `/etc/passwd` 中，但现在密码存储在 `/etc/shadow` 中，这样更安全。\n\
  *   可以使用 `last` 命令查看谁最近登录且可能仍然在线。\n*   `su` 命令允许您变成另一个用户（通过 `exit` 返回）。如果没有指定其他用户名，则隐含\
  \ `root` 用户 ——因此，`su` 代表 *superuser*。\n\n\n\n\n\n*   要以另一个用户（通常是 `root`）身份运行命令而不是变成该用户，请使用\
  \ `sudo` 而不是 `su`。\n*   `who` 命令显示当前登录的用户；`w` 命令显示了 `who` 与 `uptime`（运行时间）相结合的信息。\n\
  *   你可以使用 `hosts.allow` 文件（仅允许列出的特定主机连接）或 `hosts.deny` 文件（仅禁止列出的特定主机连接）来限制哪些主机可以进行远程连接。\n\
  *   `ulimit` 工具可以显示 Linux 中允许的打开文件数量限制。你可以使用相同的命令来更改该值。\n*   `usermod` 命令更改用户的属性并修改用户账户。\n\
  \n# 第 3 章\n\n# 其他 Linux 认证\n\n本章内容\n\n![check](img/check.png) **厂商中立认证概述**\n\n![check](img/check.png)\
  \ **厂商特定认证概述**\n\n之前的章节查看了 Linux Essentials 考试——由 Linux 专业人员协会 (LPI) 提供的较低级别认证——以及更高级别的入门级\
  \ CompTIA Linux+ 认证（由 LPI LX0-103 和 LX0-104 考试组成）。尽管这些考试很重要，但它们远非唯一的 Linux 认证。\n\
  \n在本章中，我首先介绍其他厂商中立的认证，然后介绍一些最流行的厂商特定 Linux 认证。\n\n## 厂商中立认证\n\n正如 CompTIA Linux+\
  \ Powered by LPI 认证是基础知识的极佳入门认证一样，CompTIA 的大多数其他认证也是如此。CompTIA 提供的唯一针对特定操作系统的认证是\
  \ Linux+，但它还提供如 A+（硬件）、Network+（计算机网络）和 Security+（主机和客户端安全）等认证。所有这些认证在市场上都得到了广受认可的代表，是增加简历分量的良好选择。\n\
  \nLPI 还提供了高于 LPIC-1 种的认证。LPIC-2 需要通过另外两个考试（分别称为 201 和 202：考试代码分别为 201-450 和 202-450），侧重于网络配置、文件存储、故障排除和系统安全等高级主题。LPIC-3\
  \ 是面向高级管理员的，让你在获得 LPIC-2 认证后能够专注于某个特定的领域，例如虚拟化和高可用性或安全性。你选择的每场考试都涵盖一个特定的专业领域，如虚拟化或安全性。\n\
  \n其他一些厂商中立的 Linux 认证曾经存在并很流行，但现在大多数现在都已淘汰（不再提供或不再更新）。尽管对于目前持有这些认证的人来说，它们可能具有价值，但对于目前正寻求第三方验证其知识和技能的人来说，应该避免这些认证。\n\
  \n## 厂商特定认证\n\n几家厂商提供了验证其特定 Linux 发行版专业化能力的认证。以下是其中三个厂商及其最流行的认证：\n\n*   **红帽 (Red\
  \ Hat):** 最受认可的认证来自红帽。在入门级别，公司提供红帽认证系统管理员 (RHCSA) 认证。更受认可的红帽认证工程师 (RHCE) 构建在 RHCSA\
  \ 之上，顶级认证是红帽认证架构师 (RHCA)。\n*   **SUSE:** 来自 Novell 的 SUSE 认证有多个级别：SUSE 认证管理员 (SCA)、SUSE\
  \ 认证工程师 (SCE) 和 SUSE 企业级架构师 (SEA)。SCA 和 SCE 都有多个方向：企业级 Linux、OpenStack、企业级存储和系统管理。要获得\
  \ SEA 认证，你必须拥有两个 SCE 认证、三个 SCA 认证以及来自任何其他方向的一个认证。\n*   **甲骨文 (Oracle):** 收购了 Sun\
  \ Microsystems 及其丰富的 Linux 历史的 Oracle 公司提供了 Oracle 认证关联师 (OCA) 和 Oracle 认证专家 (OCP)\
  \ 认证。\n\n## 关于作者\n\n**Emmett Dulaney** 是一位大学教授，《认证杂志》的专栏作家。作为操作系统和认证领域的专家，他是《CompTIA\
