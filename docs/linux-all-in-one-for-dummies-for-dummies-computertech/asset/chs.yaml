  \ 以及其他应用程序配合。\n- GNOME 屏幕键盘器 (`GOK`) 是另一种辅助技术，它与 XML 文件配合并可以动态创建键盘以适应用户需求。\n- 可以为键盘偏好配置慢键\
  \ (`Slow keys`)，只有在按住键时才接受输入，防止误触计为输入。可以配置跳键 (`Bounce keys`) 来忽略快速的重复按键；粘滞键 (`sticky\
  \ keys`) 可模拟同时按键。\n\n## 行政管理任务\n\n表 2-8 显示了此主题的子主题、权重、描述和关键知识领域。\n\n| 子主题 | 权重 |\
