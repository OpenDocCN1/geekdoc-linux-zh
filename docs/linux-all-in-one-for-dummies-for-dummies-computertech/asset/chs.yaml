  \ `newgrp` 命令将用户从一个组移动到另一个组。\n- 要调度无人模式下运行一次的任务，可以使用 `at` 命令。\n- 调度的作业可以使用 `atq`\
  \ 命令查看，并在执行前使用 `atrm` 删除。\n- 通过创建 `at.allow` 文件并在其下方列出有效用户名，可以限制谁可以使用 `at` 服务 (`atd`)。\n\
  - 你可以创建一个 `at.deny` 文件——而不是 `at.allow`——并在其中列出不能使用该 `at` 服务的用户（这意味着未列在其中的用户仍然可以使用它）。\n\
  - 如果你需要调度按任何定期间隔运行的无人作业，可以为它创建一个 `crontab` (`cron` 表）条目。\n- `crontab` 文件由 `cron`\
  \ 守护进程读取，它每分钟检查一次是否有作业需要运行。\n- 通过创建 `cron.allow` 或 `cron.deny` 文件，可以限制谁可以使用 `cron`。\n\
  \n\n\n\n\n*   `cron` 表中的每个条目有六个字段：任务运行的分钟（0 到 59）、任务运行的小时（0 到 23）、每月的第几天（1 到 31）、年的月份（1\
  \ 到 12）、星期中的第几天（0 到 6）以及要运行的可执行文件路径。\n\n## 核心系统服务\n\n表 2-9 显示了此主题的子主题、权重、描述和知识领域。\n\
