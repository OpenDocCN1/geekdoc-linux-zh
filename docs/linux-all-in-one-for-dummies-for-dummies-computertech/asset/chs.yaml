  \ 上最流行的语音接口之一。\n- `xdpyinfo` 工具可查看有关 X 服务器的信息。它可以配合 `all` 选项来查看服务器支持的所有扩展信息。\n-\
  \ 可以使用 `xwininfo` 工具查看 X 的窗口信息。使用 `-all` 选项可显示所有可能的信息。\n- X 的服务器访问控制程序是 `xhost`。该程序用于连接到跨网络的主机并在图形界面内工作。\n\
