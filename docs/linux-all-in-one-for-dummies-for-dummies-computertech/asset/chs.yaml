  \ Linux+ Powered by LPI 认证考试\n    1. CompTIA Linux+ 考试概览\n    2. 系统架构\n    3. Linux\
  \ 安装与包管理\n    4. GNU 和 Unix 命令\n    5. 设备、Linux 文件系统、文件系统层次级标准\n    6. Shell、脚本与数据管理\n\
  \    7. 用户界面与桌面\n    8. 管理任务\n    9. 基本系统服务\n    10. 网络基础\n    11. 安全\n3. 第 3 章：其他\
  \ Linux 认证\n    1. 厂商中立认证\n    2. 厂商特定认证\n\n# 第 1 章\n\n# 准备 Linux Essentials 认证考试\n\
  \n本章内容\n\n![check](img/check.png) 获取 Linux Essentials 考试的概览\n\n![check](img/check.png)\
  \ 查看每个部分的细节\n\n正如你可以获得多个级别的 Linux 认证（助理级、学士、硕士）一样，你也可以获得 Linux Essentials 的等级。本章提供了考试的整体展望，并探讨了相关主题。\n\
  \n## Linux Essentials 概览\n\nLinux Essentials 成就证书由 Linux 专业人员协会 (LPI) 创建，旨在吸引学术界。截至本文编写时，当前版本为\
  \ 1.5，考试代码为 010。\n\n![remember](img/remember.png) Linux Essentials 是一种成就证书，旨在作为一个比\
  \ LPIC 低得多的（子集）认证。虽然建议学习 Linux Essentials，但它并不是其他认证的先决条件。\n\n考试分为五个领域，称为主题。接下来的章节将更详细地查看每个主题。\n\
  \n\n\n\n| ICT 技能与 Linux 环境工作 | 2 | 基础信息与通信技术（ICT）技能以及 Linux 环境工作 | 桌面技能、进入命令行、Linux\
  \ 的行业用途，以及云计算和虚拟化（主题包括使用浏览器、隐私问题、配置选项、网络搜索和保存内容。） |\n\n### 主题 1 的详细拆解\n\n在学习该领域时，以下是需要了解的十大要点：\n\
  \n- Linux 是迄今开发出的（且仍在开发中）最著名的开源软件示例。\n- `shell` 是位于用户和操作系统之间的命令解释器。虽然有很多 `shell`\
  \ 可用，但今天最常用的是 `bash` shell`。\n- 各种 Linux 发行版都提供了大量的应用程序和工具供使用。其中许多工具也是开源的。\n- Apache\
  \ 软件基金会在 Apache 自由和开源（FOSS）许可证下发布开源软件。\n- 自由软件基金会 (FSF) 支持在 GNU 通用公共许可证下的自由（开源）软件运动和反版权复制（copyleft）。`copyleft`\
  \ 使得在对软件进行修改的同时，能够在衍生作品中保留相同的权利。\n- 开源倡议组织 (OSI) 也支持开源软件运动，GNOME 基金会、Ubuntu 基金会以及许多组织也是如此。\n\
  - OpenOffice.org 曾是一个流行的开源办公软件套件。LibreOffice 是 OpenOffice 的分支，它在人气上已超过了后者。\n- Samba\
  \ 使 Linux 系统能够与 Windows 系统共享文件。\n- Thunderbird 是由 Mozilla 基金会创建的流行的邮件和新闻客户端。\n-\
  \ Linux 有许多浏览器可用，其中最流行的之一是 Mozilla Firefox。\n\n## 在 Linux 系统中找到路径\n\n表 1-3 显示了该主题的子主题、权重、描述和关键知识领域。\n\
  \n| 子主题 | 权重 | 描述 | 关键领域 |\n| --- | --- | --- | --- |\n| 命令行基础 | 3 | 使用 Linux 命令行\
  \ | 基础 shell、命令行语法、变量、通配符（globbing）和引用（主题包括 `bash`、`echo`、`history`、`PATH`环境变量、`export`\
  \ 和 `type`。） |\n| 使用命令行获取帮助 | 2 | 运行帮助命令并导航各种帮助系统、man 和 info | 主题包括：`man` 文件、`info`\
  \ 命令、`/usr/share/doc` 和 `locate` |\n| 使用目录和列出文件 | 2 | 导航主目录和系统目录并列出各种位置的文件 | 文件、目录、隐藏文件和目录、主目录以及绝对路径和相对路径（主题包括\
  \ `ls` 的常用选项、递归列表、`cd`、`.` 和 `..`、`home` 和 `-`。） |\n| 创建、移动和删除文件 | 2 | 在主目录下创建、移动和删除文件\
  \ | 文件和目录、大小敏感以及简单的通配符和引用（主题包括 `mv`、`cp`、`rm`、`touch`、`mkdir` 和 `rmdir`。） |\n\n\
  ### 主题 2 的详细拆解\n\n在学习该领域时，以下是需要了解的十大要点：\n\n- 正则表达式——通常称为 `globbing`——可以配合 Linux\
  \ 中可用的 shell 匹配通配符。在可能的通配符中，星号（`*`）匹配任意数量的字符；问号（`?`）仅匹配一个字符。\n- Linux 是区分大小敏感的操作系统。\n\
  - 通过在文件名前加单个点（`.`）可以隐藏文件。但在路径名中，单个点（`.`）表示当前目录，两个点（`..`）表示父目录。\n- 绝对路径提供资源的完整路径，而相对路径提供从当前工作位置开始的。绝对路径的示例是\
  \ `/tmp/eadulaney/file`，相对链接的示例是 `../file`。\n- 可以 `cp` 复制文件或使用 `mv` 移动文件。可以使用 `rm`\
  \ 删除文件，并使用 `rmdir` 删除目录（使用 `mkdir` 创建的）。可以使用 `rm –r` 进行递归删除。\n- 要切换目录，请使用 `cd` 命令。当不带参数使用该命令时，它会将你带到主目录。要查看当前所在的目录，请使用\
  \ `pwd`（当前工作目录）命令。\n- `ls` 命令有许多选项允许你列出文件。`-a` 选项列出所有文件（包括隐藏文件）。\n-可以通过帮助手册（通过 `man`\
  \ 命令访问）和 `info`（显示存储在 `/user/info` 下的帮助文件）获取帮助。\n- `whatis` 命令显示某个条目可用的手册页，`whereis`\
  \ 显示文件及所有相关文件（包括任何手册页）的位置。\n- 许多标准实用程序允许输入可执行文件名后跟 `\"--help\"` 以获取关于语法的帮助。\n\n\
  ## 命令行的力量\n\n表 1-4 显示了该主题的子主题、权重、描述和关键知识领域。\n\n| 子主题 | 权重 | 描述 | 关键领域 |\n| --- |\
  \ --- | --- | --- |\n| 在命令行中归档文件 | 2 | 用户主目录下的文件 | 文件、目录、存档和压缩（主题包括 `tar` 以及常用的\
  \ tar 选项，`gzip`、`bzip2`、`zip` 和 `unzip`。） |\n| 从文件中搜索和提取数据 | 3 | 从主目录文件中搜索并提取数据\
  \ | 命令行管道、I/O 重定向和基础正则表达式（主题包括 `grep`、`less`、`cat`、`head`、`tail`、`sort`、`cut` 和\
  \ `wc`。） |\n| 将命令转换为脚本 | 4 | 将重复命令转换为简单脚本 | 基础 shell 脚本和对常用文本编辑器的了解（主题包括 `#!`、`/bin/bash`、变量、参数、`for`\
  \ 循环、`echo` 和退出状态。） |\n\n### 主题 3 的详细拆解\n\n在学习该领域时，以下是需要了解的十大要点：\n\n- 标准输入（`stdin`）传统上是键盘，标准输出（`stdout`）传统上是显示器。两者都可以通过符号\
  \ `>`、`>>`、`<` 和 `|` 重定向，标准错误（`stderr`）也是如此。\n- 命令可以通过分号（`;`）在命令行上连接，每个命令独立运行。你还可以使用管道（`|`）将一个命令的输出作为另一个命令的输入。\n\
  - `cut` 命令可以提取文件的字段，可以使用 paste 或 join 连接字段。后者比前者功能更多，并可以结合条件使用。\n- `wc` 命令可以统计文件的行数、单词和字符数。\n\
  - `grep` 实用程序（及其对应的 `egrep` 和 `fgrep`）可用于在文件中查找字符串匹配。\n- `find` 命令用于在系统中搜索符合任意数量标准的目录/目录。当找到这些实体时，可以使用\
  \ `xargs` 命令在其中深入查找其他值（例如结合 `grep` 使用时）。\n- 你可以使用 `tar` 命令（可以将多个文件合并为单个存档）进行备份。\n\
  - 除了归档，你还可以使用 `gzip` 或 `pack` 命令压缩文件。要解压缩文件，请使用 `uncompress`、`gunzip` 或 `unpack`。\n\
  - 可以在命令行给定变量并引用为 `$1`、`$2` 等或者通过 `read` 命令将其输入到执行文件中。\n- 可以通过 `test` 或 `[` 测试条件来向脚本添加逻辑。命令可以通过\
  \ `if-then-fi` 分支或循环（`while`、`until` 或 `for`）执行。你可以使用 `exit` 命令退出脚本，或使用 `break`\
  \ 退出循环。\n\n## Linux 操作系统\n\n\n\n\n\nTable 1-5 显示了此主题的子主题、权重、描述和关键知识领域。\n\n| `子主题`\
  \ | `权重` | `描述` | `关键领域` |\n| --- | --- | --- | --- |\n| 选择操作系统 | 1 | 主要操作系统和 Linux\
  \ 发行版的知识 | Windows、Mac 和 Linux 的区别；发行版生命周期管理（主题包括 GUI 与命令行、桌面配置；维护周期以及 Beta 和稳定版。）\
  \ |\n| 理解计算机硬件 | 2 | 熟悉构建桌面计算机和服务器计算机的组件 | 硬件（主题包括主板、处理器、电源、光驱驱动器、外围设备、硬盘和分区、`/def/sd*`\
  \ 以及驱动程序。） |\n| 数据存储位置 | 3 | Linux 系统上各种类型信息的存储位置 | 程序和配置、软件包和包数据库、进程、内存地址、系统消息和日志（主题包括\
  \ `ps`、`top`、`free`、`syslog`、`dmesg`、`/etc/`、`/var/log/`、`/boot//`、`/proc/`、`/dev/`\
  \ 以及 `/sys/`。） |\n| 网络上的你的计算机 | 2 | 查询关键网络设置并确定局域网 (LAN) 计算机的基本要求 | 互联网、网络、路由器、查询\
  \ DNS 客户端配置以及查询网络配置（主题包括 `route`、`ip route show`、`ifconfig`、`ip addr show`、`netstat`、`/etc/resolv.conf`、`/etc/hosts`、IPv4、IPv6、`ping`\
  \ 和 `host`。） |\n\nTABLE 1-5 主题 4 详解\n\n以下是在学习该领域时需要掌握的十项核心内容：\n\n- 运行时，每个命令至少跨越一个进程；可以使用\
  \ `ps` 或 `top`（动态更新显示）查看进程。\n- 任务可以在前台或后台运行，并在两者之间移动。在前台运行的任务可以通过按下 `Ctrl+Z` 挂起。\n\
  - IPv4 使用 32 位地址，每个地址分为四个字节。第一个字节识别地址类别（A、B 或 C）。地址可以是公有的也可以是私有的。\n- 可以使用 `ifconfig`\
  \ 工具查看网卡的当前 IP 配置。\n- `ping` 工具是一个用于测试连接性的通用工具。它向指定主机发送回显消息以检查该主机是否可达。你可以配合环回地址\
  \ (127.0.0.1) 使用 `ping` 来测试内部配置。\n- `route` 工具显示路由表并允许对其进行配置。\n- `netstat` 工具显示端口的当前状态——开放的、监听的等。\n\
  - 系统日志为 `/var/log/messages`，该日志是系统日志守护进程 (`syslogd`) 写入大多数事件的地方。路由到那的消息可以使用 `dmesg`\
  \ 命令查看。\n- `logrotate` 命令可根据 `/etc/syslog.conf` 中的配置自动归档日志文件并执行维护。\n- 你可以使用 `logger`\
  \ 命令手动向日志文件写入记录。\n\n## 安全与文件权限\n\nTable 1-6 显示了此主题的子主题、权重、描述和关键知识领域。\n\n| `子主题`\
  \ | `权重` | `描述` | `关键领域` |\n| --- | --- | --- | --- |\n| 安全与识别用户类型 | 2 | 理解 Linux\
  \ 系统上的各种类型用户 | Root、标准用户和系统用户（主题包括 `/etc/passwd`、`/etc/group`、`id`、`who`、`w`、`sudo`\
  \ 和 `su`。） |\n| 创建用户和组 | 2 | 在 Linux 系统上创建用户和组 | 用户组命令以及用户 ID（主题包括 `/etc/passwd`、`/etc/shadow`、`/etc/group`、`/etc/skel`、`id`、`last`、`useradd`、`groupadd`\
  \ 和 `passwd`。） |\n| 管理文件权限和所有权 | 2 | 理解并操作文件权限和所有权设置 | 文件/目录权限和所有者（主题包括 `ls –l`、`ls\
  \ –a`、`chmod` 和 `chown`。） |\n| 特殊目录和文件 | 1 | 理解 Linux 系统上的特殊目录和文件，包括特殊权限 | 使用临时文件和目录以及符号链接（主题包括\
  \ `/tmp`、`/var/tmp`、粘位 Sticky Bit、`ls –d` 和 `ln –s`。） |\n\nTABLE 1-6 主题 5 详解\n\n\
  以下是在学习该领域时需要掌握的十项核心内容：\n\n- 使用 `chmod` 命令更改文件和目录权限（接受数值和符号值）。\n- 在标准权限上添加 1000 会开启粘位（sticky\
  \ bit）；添加 2000 会开启 `SGID` 权限。添加 4000 会开启 `SUID` 权限。\n- 使用 `ln` 命令创建链接。硬链接仅仅是文件的别名（共享相同的\
  \ inode）。`ln –s` 命令创建符号链接，它是一个具有自己独立 inode 的实际文件。符号链接包含指向原始文件的指针并可以跨越文件系统；硬链接则不能。\n\
  - 可以通过手动编辑配置文件或使用 `useradd` 命令添加用户账户；可以使用 `userdel` 它们。\n- 可以使用 `groupadd` 工具创建组，使用\
  \ `groupdel` 组。可以使用 `groupmod` 修改组，并使用 `newgrp` 命令将用户从一个组移动到另一个组。\n- 使用 `passwd`\
  \ 命令更改密码。旧系统将密码存储在 `/etc/passwd` 中；现在密码存储在 `/etc/shadow` 中，那里更安全。\n- 使用 `last` 命令查看最近登录且可能仍在网络的用户。\n\
  - `su` 命令允许你变成另一个用户（通过 `exit` 返回）。如果没有指定其他用户名，则默认为 root 用户——因此 `su` 代表 superuser。\n\
  - 当你想以另一个用户（通常是 `root`）运行命令但无需变成该用户时，使用 `sudo` 代替 `su`。\n- `who` 命令显示谁登录了；`w` 命令显示结合\
  \ `who` 和 `uptime` 信息。\n\n# 第 2 章\n\n# 为 CompTIA Linux+ 基于 LPI 的认证考试学习\n\n## 本章内容\n\
  \n- **CompTIA Linux+ 考试概述**\n- **深入研究每个领域**\n\n上一章考察了 Linux Essentials 考试——由 Linux\
  \ 专业协会 (LPI) 提供的较低级别的认证。虽然它不是强制要求的，但该认证应被视为更高级考试的跳板。来自 CompTIA 的 Linux+ 认证考试——由\
  \ LPI LX0-103 和 LX0-104 考试组成——此类高级测试的理想示例。\n\n在本章中，我将提供这两个考试的概述，然后探索每个领域的主题。\n\n\
  ## CompTIA Linux+ 考试概述\n\n该认证的正式名称是 CompTIA Linux+ Powered by LPI，虽然读起来很绕口，但它是简历中一项很有意义的补充。该认证由\
  \ CompTIA 颁发；由 LPI 的两个考试组成：LX0-103 和 LX0-104。因此，在考试时，候选人可以选择将测试成绩转发给 LPI 并同时获得一级认证\
  \ (LPIC-1)。\n\n记录由 LPI 和 CompTIA 分别维护。如果你选择不转发分数，你可以获得 Linux+ 认证但不是 LPIC-1 认证。\n\
  \n每场考试都由 60 道题组成，必须在 90 分钟内回答。及格分为 200 到 800 分之间的 500 分，且强烈建议（并非强制）候选人拥有 12 个月的\
  \ Linux 管理经验。最后，在参加 LX0-104 考试之前，必须通过 LX0-103 考试。\n\n一个考试包含四个领域，另一个考试包含六个领域。Table\
  \ 2-1 显示了每场考试的领域及其相应的预期权重。\n\n| `考试` | `领域` | `权重` |\n| --- | --- | --- |\n\n\n\n\
  \n\n| LX0-103 | 101 系统架构 | 14% |\n|  | 102 Linux 安装与包管理 | 18% |\n|  | 103 GNU 和\
  \ Unix 命令 | 43% |\n|  | 104 设备、Linux 文件系统、文件系统层级标准 | 25% |\n| LX0-104 | 105 Shell、脚本编写与数据管理\
  \ | 17% |\n|  | 106 用户界面与桌面 | 8% |\n|  | 107 行政任务 | 20% |\n|  | 108 基础系统服务 | 17%\
  \ |\n|  | 109 网络基础 | 23% |\n|  | 110 安全 | 15% |\n\n表 2-1 Linux+ 考试中的领域\n\n接下来的章节将详细详细介绍这些主题中的每一个。\n\
  \n## 系统架构\n\n表 2-2 显示了该主题的子主题、权重、描述和关键知识领域。\n\n| 子主题 | 权重 | 描述 | 关键领域 |\n| --- |\
  \ --- | --- | --- |\n| 确定并配置硬件设置 | 2 | 内内核加载选项和启动步骤的概念理解 | 能够处理外设、存储设备以及用于配置它们的工具。\
  \ |\n| 启动系统 | 3 | 梳理启动过程 | 了解常用的启动命令、启动序列和启动日志。 |\n| 更改运行级别/启动目标并关机或重启系统 | 3 | 切换到单用户模式、关机和重启系统，并知道应该提醒用户运行级别的变化以及需要妥善终止进程\
  \ | 设置默认运行级别，更改运行级别，并了解如何终止。 |\n\n表 2-2 领域 101 的细分划分\n\n为了充分应对这些主题，请关注以下文件、术语和工具：`/dev`、`/etc/init.d`、`/etc/inittab`、`/proc`、`/sys`、`/var/log/messages`、BIOS、引导程序、`dmesg`、`init`、`kernel`、`lsmod`、`lspci`、`lsusb`、`modprobe`、`shutdown`\
  \ 和 `telinit`。\n\n在学习该领域时，以下是十大重点：\n\n* 系统日志为 `/var/log/messages`，该日志是系统日志守护进程 (`syslogd`)\
  \ 写入大部分事件的地方。路由到那的消息可以使用 `dmesg` 命令查看。\n* `logrotate` 命令可以根据 `/etc/syslog.conf`\
  \ 中的配置自动归档日志文件并进行维护。\n* 你可以使用 `logger` 命令手动向日志文件写入条目。\n* `init` 守护进程负责维持在指定的运行级别上维护守护进程的正常运行。系统在每次启动时都会尝试运行到\
  \ `/etc/inittab` 文件中指定的默认运行级别。\n* 可以使用 `init` 和 `shutdown` 命令更改运行级别。\n* 定义为标准的有效运行级别包括：0（关机）、1（单用户模式）、2（无网络文件系统的多用户）、3（带\
  \ NFS 的多用户）、5（X 环境）和 6（重启）。\n* `lsmod` 命令用于列出已加载的模块。`insmod` 命令用于安装模块。`rmmod` 命令用于从系统中移除模块。`modinfo`\
  \ 命令显示有关模块的信息。\n* `modprobe` 工具可以探测并安装模块及其依赖项，而 `depmod` 工具用于确定并显示任何存在的模块依赖。\n*\
  \ 内核软件通常命名为 `linux-*x*.*y*.*z*`，其中 *x.y.z* 代表版本号。\n* `make config` 命令执行一个面向命令行视图，并允许你与内核构建进行交互式响应。\n\
  \n## Linux 安装与包管理\n\n表 2-3 显示了该主题的子主题、权重、描述和关键知识领域。\n\n| 子主题 | 权重 | 描述 | 关键领域 |\n\
  | --- | --- | --- | --- |\n| 设计硬盘布局 | 2 | 为 Linux 系统设计磁盘分区方案 | 分配文件系统和交换空间，根据系统的预定用途进行设计定制。\
  \ |\n| 安装引导管理器 | 2 | 选择、安装和配置引导管理器 | 与引导程序、GRUB Legacy 和 GRUB 2 交互。 |\n| 管理共享库 |\
  \ 1 | 确定可执行程序依赖的共享并在必要时安装它们 | 识别共享库、典型位置以及如何加载。 |\n| 使用 Debian 包管理 | 3 | 了解 Debian\
  \ 包工具 | 安装、升级和卸载 Debian 二进制包，并获取包信息，如版本、内容、依赖项、包的完整性和安装状态。 |\n| 使用 RPM 和 Yum 包管理\
  \ | 3 | 了解 RPM 和 Yum 工具 | 使用 RPM 和 Yum 安装、升级和删除包；确定包提供了哪些文件；查找特定文件来自哪个包。 |\n\n表\
  \ 2-3 领域 102 的细分划分\n\n为了充分应对这些主题，请关注以下文件、术语和工具：`/(root)` 文件系统、`/boot/grub/menu.lst`、`/etc/apt/sources.list`、`/etc/ld.so.conf`、`/etc/yum.conf`、`/etc/yum.repos.d/`、`/home`\
  \ 文件系统、`/var` 文件系统、`apt-cache`、`apt-get`、`aptitude`、`dpkg`、`dpkg-reconfigure`、`grub-install`、`LD_LIBRARY_PATH`、`ldconfig`、`ldd`、`MBR`、挂载点、分区、`rpm`、`rpm2cpio`、超级块、交换空间、`yum`\
  \ 和 `yumdownloader`。\n\n在学习该领域时，以下是十大重点：\n\n* `ldd` 命令用于查看程序依赖哪些库。\n* `ldconfig`\
  \ 命令用于更新和维护共享库数据的缓存。可以使用命令 `ldconfig —p` 查看当前缓存。\n* 流行的包管理器包括红帽的包管理器 (`rpm`) 和 Debian\
  \ 的 (`dpkg`)。两者的目的都是简化软件操作。\n* `rpm` 可用选项包括：`—i`（安装包）、`-e`（删除包）、`-q`（查询哪些包属于哪些文件）、`-b`（构建包）和\
  \ `--p`（打印/显示信息）。\n* 使用 `dpkg` 时，你可以使用 `dselect` 命令使用图形界面。你也可以使用命令行选项，包括 `--i`（安装包）、`-l`（列出包信息）、`-r`（删除包）和\
  \ `--c`（列出包中的所有文件）。\n* 高级包工具 (`apt`) 设计为 `dpkg` 的前端，但现在同时支持 `.deb` 和 `.rpm` 包。\n\
  * `Yum`（Yellow dog Updater, Modified）可以在命令行下载 `rpm` 包。\n* 超级块包含有关文件系统类型、大小、状态和元数据的信息。\n\
  * GRUB（GNU Grand Unified Bootloader 的缩写）引导程序允许多个操作系统存在于同一台机器上，并让用户在启动时选择想要启动哪一个。最新版本是\
  \ GRUB 2。\n* Linux 同时使用交换分区和交换文件作为交换空间。可以使用 `swapon` 命令开启关闭指定的交换空间。可以使用 `mkswap`\
  \ 创建交换空间区域。\n\n## GNU 和 Unix 命令\n\n表 2-4 显示了该主题的子主题、权重、描述和关键知识领域。\n\n| 子主题 | 权重\
  \ | 描述 | 关键领域 |\n| --- | --- | --- | --- |\n| 命令行工作 | 4 | 与 shell 和命令交互，使用命令行和 bash\
  \ shell | 使用单个 shell 命令和单行命令序列，修改 shell 环境并使用/编辑命令历史，在定义路径内部和外部调用命令。 |\n| 使用过滤器处理文本流\
  \ | 3 | 对文本流应用过滤器 | 将文本文件和输出流通过文本工具过滤器。 |\n| 执行基础文件管理 | 4 | 使用基础 Linux 命令管理文件和目录\
  \ | 单逐或递归地复制、移动和删除文件及目录。 |\n\n\n\n\n\n| 主题 | 权重 | 描述 | 关键领域 |\n| :--- | :--- | :---\
  \ | :--- |\n| 使用流、管道和重定向 | 4 | 重定向流并连接它们，包括标准输出、标准输入和标准错误 | 将一个命令的输出管道到另一个命令的输入，并将输出同时发送到标准输出和文件。\
  \ |\n| 创建、监控和杀死进程 | 4 | 执行基本的进程管理 | 在前台和后台运行作业，向进程发送信号，监控活动进程，并对进程进行选择和排序显示。 |\n\
  | 修改进程执行优先级 | 2 | 管理进程执行优先级 | 以比默认值更高或更低的优先级运行程序，并更改正在运行进程的优先级。 |\n| 使用正则表达式搜索文本文件\
  \ | 2 | 理解正则表达式及其使用方法 | 创建简单的正则表达式，并通过文件系统和/或通过文件进行搜索。 |\n| 使用 `vi` 执行基础文件编辑操作 |\
  \ 3 | 理解 `vi` 的导航、编辑、复制、删除等 | 使用基本的 `vi` 模式进行插入、编辑、复制、删除和查找文本。 |\n\n### 表 2-4 (#c31.xhtml_rc31-tbl-0004)\
  \ 领域 103 细解\n\n为了充分应对这些主题，请关注以下文件、术语和工具：`&`, `.`, `bash`, `bg`, `bzip2`, `cat`,\
  \ `cp`, `cpio`, `cut`, `dd`, `echo`, `egrep`, `env`, `exec`, `expand`, `export`,\
  \ `fg`, `fgrep`, file, 文件通配 (file globbing), `find`, `fmt`, `free`, `grep`, `gunzip`,\
  \ `gzip`, `head`, `history`, `jobs`, `join`, `kill`, `killall`, `ls`, `man`, `mkdir`,\
  \ `mv`, `nice`, `nl`, `nohup`, `od`, `paste`, `pr`, `ps`, `pwd`, `regex(7)`, `renice`,\
  \ `rm`, `rmdir`, `sed`, `set`, `sort`, `split`, `tail`, `tar`, `tee`, `top`, `touch`,\
  \ `tr`, `uname`, `unexpand`, `uniq`, `unset`, `uptime`, `vi`, `wc`, 和 `xargs`。\n\
  \n在学习该领域时，以下是需要掌握的重点：\n\n* 每个命令在运行时至少跨越一个进程，可以使用 `ps` 或 `top`（会持续动态更新显示）查看进程。\n\
  * 作业可以在前台或后台运行，并在两者之间移动。在前台运行的作业可以通过 Ctrl+Z 挂起。\n* 使用 `cp` 可以复制文件，或使用 `mv` 移动文件。可以使用\
  \ `rm` 删除文件，目录（使用 `mkdir` 创建）可以使用 `rmdir` 删除。可以使用 `rm —r` 进行递归删除。\n* 切换目录请使用 `cd`\
  \ 命令。在不带参数使用时，该命令会将你带到主目录。要查看当前所在的目录，请使用 `pwd`（当前工作目录）命令。\n* `ls` 命令有许多选项允许你列出文件。`—a`\
  \ 列出所有文件（包括隐藏文件）。\n* `cut` 命令可以从文件中提取字段，可以使用 `paste` 或 `join` 组合字段。后者比前者功能更多，并可以配合条件使用。\n\
  * `wc` 命令可以统计文件的行数、单词数和字符数。\n* `grep` 工具（及其对应的 `egrep` 和 `fgrep`）可用于在文件中查找字符串。\n\
  * `find` 命令可用于搜索系统中符合任意数量标准的文件/目录。当找到这些实体时，可以使用 `xargs` 命令在其中深入查找其他值（例如与 `grep`\
  \ 结合使用）。\n* 使用工具可以将数据从一个值转换为另一个值。最常用的工具包括 `tr`（翻译）和 `sed`（流编辑器）。\n\n## 设备、Linux\
  \ 文件系统、文件系统层级标准\n\n[表 2-5 (#c31.xhtml_c31-tbl-0005)] 显示了该主题的子主题、权重、描述和关键知识领域。\n\n\
  | 子主题 | 权重 | 描述 | 关键领域 |\n| :--- | :--- | :--- | :--- |\n| 创建分区和文件系统 | 2 | 配置磁盘分区\
  \ | 使用各种 `mkfs` 命令设置分区并创建文件系统，管理 MBR 分区表。 |\n| 维护文件系统的完整性 | 2 | 维护标准文件系统和日志相关的额外数据\
  \ | 了解文件系统的监控、完整性和修复，并监控可用空间和节点 (inodes)。 |\n| 控制文件系统的挂载和卸载 | 3 | 配置文件系统的挂载 | 手动挂载、卸载和配置移动文件系统，并配置启动时的文件系统挂载。\
  \ |\n| 管理磁盘配额 | 1 | 管理用户配额 | 配置配额，并生成、编辑和检查报告。 |\n| 管理文件权限和所有权 | 3 | 使用权限和所有权控制文件访问\
  \ | 修改文件创建掩码，处理特殊文件，并使用组字段授予组成员文件权限。 |\n| 创建和更改硬链接和符号链接 | 2 | 管理文件的链接 | 使用链接支持系统管理，并能够区分文件的复制和链接。\
  \ |\n| 查找系统文件并将文件放置在正确位置 | 2 | 理解文件系统层级标准 (FHS) | 理解文件的正确位置以及重要目录的用途。 |\n\n### 表\
  \ 2-5 (#c31.xhtml_rc31-tbl-0005) 领域 104 细解\n\n为了充分应对这些主题，请关注以下文件、术语和工具：`/etc/fstab`,\
  \ `/etc/updated.conf`, `/media`, `chgrp`, `chmod`, `chown`, `debugfs`, `df`, `du`,\
  \ `dump32fs`, `e2fsck`, `edquota`, `ext2/ext3/ext4`, `find`, `fsck`, `ln`, `locate`,\
  \ `mke2fs`, `mkfs`, `mkswap`, `mount`, `quota`, `quotaon`, `reiserfs v3`, `repquota`,\
  \ `tune2fs`, `type`, `umask`, `umount`, `updated`, `vfat`, `whereis`, `which`, `xfs`,\
  \ 和 `xfs tools`。\n\n在学习该领域时，以下是需要掌握的重点：\n\n* 文件和目录权限可以使用 `chmod` 命令更改（该命令接受数字和符号值）。\n\
  * 可以 `chown` 命令更改组所有者，而 `chgrp` 命令允许更改与文件关联组。\n* `du` 命令可以显示磁盘使用了多少空间。\n* `df` 命令显示磁盘剩余多少可用空间。\n\
  * 排除磁盘问题的主要工具是 `fsck`，它可以检查文件系统结构，包括节点 (inodes)。\n* 挂载文件系统使用 `mount` 命令，卸载则使用 `umount`。要实现启动时自动挂载，请将条添加到\
  \ `/etc/fstab`。\n* 配额可以限制用户或组在磁盘上使用的空间量。配额使用 `quota` 命令初始化，并通过 `quotaon` 和 `quotaoff`\
  \ 开启或关闭。可以使用 `edquota` 修改配额，使用 `repquota` 生成报告。\n* 创建文件时，默认权限等于 666 减去任何 `umask`\
  \ 值。目录的默认权限等于 777 减去任何 `umask` 值。\n* `mke2fs` 工具可创建文件系统。\n* Linux 支持多种文件系统，包括 ext2,\
  \ ext3, ext4 和 reiserfs。\n\n## Shell、脚本和数据管理\n\n[表 2-6 (#c31.xhtml_c31-tbl-0006)]\
  \ 显示了该主题的子主题、权重、描述和关键知识领域 —— 这是 104 考试中的第一个。\n\n| 子主题 | 权重 | 描述 | 关键领域 |\n| :---\
  \ | :--- | :--- | :--- |\n| 自定义并使用 shell 环境 | 4 | 修改全局和用户配置文件 | 设置环境变量并在 bash 中工作，设置命令搜索路径，并为新用户账户维护骨架目录。\
  \ |\n| 自定义或编写简单脚本 | 4 | 自定义现有的 bash 脚本并编写新脚本 | 能够编写包含循环和测试以及命令替换和条件邮件的代码。 |\n| SQL\
  \ 数据管理 | 2 | 使用 SQL 查询数据库并操纵数据 | 了解基础 SQL 命令并执行基础数据操作。 |\n\n### 表 2-6 (#c31.xhtml_rc31-tbl-0006)\
  \ 领域 105 细解\n\n\n\n\n\n为了充分应对这些主题，请关注以下文件、术语和工具：`/etc/profile`, `~/.bash_login`,\
  \ `~/.bash_logout`, `~/.bash_profile`, `~/.bashrc`, `~/.profile`, `alias`, `delete`,\
  \ `env`, `export`, `for`, `from`, `function`, `group by`, `if`, `insert`, `join`,\
  \ `lists`, `order by`, `read`, `select`, `seq`, `set`, `test`, `unset`, `update`,\
  \ `where`, 以及 `while`。\n\n在学习该领域时，以下是需要了解的十大项目：\n\n- 可以通过 `test` 或 `` 测试条件来向脚本添加逻辑。可以使用\
  \ `if-then-fi` 分支或通过循环（`while`、`until` 或 `for`）执行命令。你可以使用 `exit` 命令退出脚本，或使用 `break`\
  \ 退出循环。\n- 可以在命令行处提供变量并通过 `$1`、 `$2` 等进行引用，或者通过 `read` 命令将其输入到执行文件中。\n- `alias`\
  \ 命令可为命令创建别名，以便以另一个名称运行（例如可以输入 `dir` 并执行 `ls —l`）。\n- 可以使用 `env` 命令查看环境变量。\n- 可以通过\
  \ `set` 命令和 `export` 将变量添加到环境中；通过使用 `unset` 将其移除。\n- `/etc/profile` 配置文件在用户每次登录时都会执行。\n\
  - 对于使用 `bash` shell 的用户，shell 首先查找 `.bash_profile`；如果找不到该配置文件，则会查找 `.bash_login`。\n\
  - 当 `bash` 用户注销时，shell 会查找 `.bash_logout` 并执行其中找到任何命令。\n- 其他配置文件仅在用户登录或注销时运行，而 `.bashrc`\
  \ 文件可以在每次运行 shell 时执行。\n- Shell 脚本必须具有执行权限才能运行，或者必须由 shell 调用（如 `sh script`）。任何脚本或应用程序的正常退出状态均为\
  \ 0；其他任何值均表示非正常退出。\n\n## 用户界面与桌面\n\n[表 2-7 显示了此主题的子主题、权重、描述和关键知识领域。\n\n| 子主题 | 权重\
