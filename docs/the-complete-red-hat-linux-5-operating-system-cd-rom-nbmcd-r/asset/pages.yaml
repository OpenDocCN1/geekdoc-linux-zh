  md: '+   your video card - The card''s make and model number (or the video chips
    it uses), and the amount of video RAM it has.


    +   your monitor - The unit''s make and model number, along with allowable ranges
    for horizontal and vertical refresh rates.


    # 2.2.3 Network-related Information


    If you will be connected to a network, be sure you know your:


    +   IP address - Usually represented as a set of four numbers separated by dots,
    such as 10.0.2.15.


    +   netmask - Another set of four numbers separated by dots. An example netmask
    would be 255.255.248.0.


    +   gateway IP address - Yet another set of four dot-separated numbers. For instance,
    10.0.2.254.


    +   one or more name server IP addresses - One or more sets of dot-separated numbers.
    10.0.2.1 might be the address of a name server.


    +   domain name - The name given to your organization. For instance, Red Hat Software
    has a domain name of redhat.com.


    +   hostname - The name of your computer. A computer might have a name like pooh,
    for instance.


    Please Note: The information given above is an example only! Do not use it to
    install Red Hat Linux! If you don''t know the proper values for your network,
    ask your network administrator.


