    # 4.3.1 Using Druid


    If you selected Disk Druid, you will be presented with a screen that looks like
    figure 4.3 on the facing page. While it may look overwhelming at first, it really
    isn''t. Let''s go over each of Disk Druid''s three sections, and you''ll see that
    there''s nothing to be scared of.


    # The “Current Disk Partitions” Section


    Each line in the “Current Disk Partitions” section represents a disk partition.
    You''ll note that this section has a scroll bar to the right, which means that
    might be more partitions than can be displayed at one time. If you use the arrow
    keys, you can see if there are any additional partitions. Each line in this section
    has five different fields:


    Mount Point – This field indicates where the partition will be mounted when Red
    Hat Linux is installed and running.


    Device – This field displays the partitions device name.


    Requested – The “Requested” field shows the minimum size requested when the partition
    was defined.'
  merge: -1
