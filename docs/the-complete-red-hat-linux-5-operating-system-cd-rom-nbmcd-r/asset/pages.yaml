  md: '# Things You Should Know


    in order to prevent any surprises during the installation, you should collect
    some information before attempting to install Red Hat Linux. You can find most
    of this information in the documentation that came with your system, or from the
    system''s vendor or manufacturer.


    Note: The most recent list of hardware supported by Red Hat Linux can be found
    at Red Hat Software''s World Wide site at http://www.redhat.com/hardware. It’s
    a good idea to check your hardware against this list before proceeding.


    # 2.1 Basic Hardware Configuration


    you should have a basic understanding of the hardware installed in your computer,
    including:


    +   **hard drive(s)** – Specifically, the number, size, and type. If you have
    more than one, it’s helpful to know which one is first, second, and so on. It
    is also good to know if your drives are IDE or SCSI.

    - **memory** – The amount of RAM installed in your computer.

    - **CD-ROM** – Most importantly, the unit’s interface type (IDE, SCSI, or other
    interface) and, for non-IDE, non-SCSI CD-ROMs, the make and model number.

    - **SCSI adapter** (if one is present) – The adapter’s make and model number.

    - **network card** (if one is present) – The card’s make and model number.

    - **mouse** – The mouse’s type (serial, PS/2, or bus mouse), protocol (Microsoft,
    Logitech, MouseMan, etc.), and number of buttons; also, for serial mice, the com
    port it connected to.


    # 2.2 Video Configuration


    you will be installing the X Window System, you should also be familiar with the
    following:'
