    # 9.2 File System Configuration


    The file system configuration tool shown in Figure 9.4 allows you to easily examine
    and manipulate file system mount points, types, options, etc. It is very useful
    for manipulating a large number of file systems. You probably won''t want to do
    this unless you are an experienced system administrator. If you know what you
    are doing, it should be fairly straightforward as to how to mount, un and add
    devices.


    The Reload entry in the FSM menu causes the file system configuration tool to
    reload /etc/fstab from your hard drive. If you edit /etc/fstab by hand while the
    file system configuration tool is running (which you shouldn''t do), you probably
    want to reload.


    To use the buttons along the bottom of the window, select a filesystem in the
    main window, and click on one of the buttons. The buttons perform the following
    functions:


    +   - **Info**: Displays information on the filesystem, including the device,
    partition type, filesystem type, mount point and options, size, percent used etc.


    +   - **Check**: Performs a filesystem check (fsck) on the partition. You can
    do this only on unmounted partitions — if the partition is mounted, you will get
    an error and you will have to unmount it first.


    +   - **Mount**: Mounts the selected filesystem.


    +   - **Unmount**: Unmounts the selected filesystem.


    +   - **Format**: Creates a new filesystem on the selected partition. This will
    erase all data on the selected partition! You can do this only on unmounted partitions
    — if the partition is mounted, you will get an error and you will have to unmount
    it first.'
