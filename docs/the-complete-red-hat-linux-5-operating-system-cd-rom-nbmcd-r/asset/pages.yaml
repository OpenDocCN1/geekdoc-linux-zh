    Red Hat system administration tools require the python and pythonlib packages.
    To make sure your system has all the packages it needs in order to be fully functional,
    Red Hat Linux checks dependencies each time you install or remove software packages.


    After you have finished selecting packages to install, the installation program
    checks the list of selected packages for dependencies. If any package requires
    another package which you have not selected to, the program presents a list of
    these unresolved dependencies and gives you the opportunity to resolve them (see
    Figure 4.17 on page 69). If you simply press OK, the program will resolve them
    automatically by adding all required packages to the list of selected packages.'
  merge: -1
