  md: 'Red Hat Linux Frequently Asked Questions


    # D.2.14 Does Red Hat Linux include source code?


    Yes. We include the exact source that was used to build the distribution. From
    release 2.0 on, Red Hat Linux is built with a packaging system RPM that ONLY uses
    pristine source (the same as what you''d find at the author''s site) and possibly
    a patch by Red Hat Linux. Complete information on RPM is available on http://www.redhat.com.


    # D.2.15 Does Red Hat Linux support UMSDOS installs?


    No. It is not a good performance idea.


    # D.3 Installation Questions


    # D.3.1 How do I get my IDE CD-ROM on my SB16 to work?


    The Creative Labs kit comes with the IDE Interface set to the third IDE port by
    default (IDE2, I think). This won''t work under Linux as it only recognizes two
    IDE ports. What you need to do is move a jumper on the card to configure it for
    IDE (the secondary IDE port). I''m not sure if you have to make changes under
    DOS for this configuration to work, but your manuals should help with this (it
    will still work, but you may have to edit a file or two).


    You may also have to specify command line parameters like:


    ```

    boot: linux hdX=cdrom

    ```


    If you have one IDE drive, X is most likely "b" in this case (ie "linux hdb=cdrom")
    If you have two, then it will be "c".


    # D.3.2 How do I run the install program again?


    Reboot your machine using the disk that you made for the installation. You will
    most likely need to completely reinstall your system.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# 3 Installation Questions


    you just want to reconfigure networking or install more packages, try using the
    control-panel tools.


    # 3.3 Why am I missing some programs?


    by doing a ''df'' at the shell prompt. If you have "/" or "/usr" showing up as
    100% used, the chances are your partition was too small for the entire install.
    Unfortunately, this does not result in any type of error messages unless you are
    watching closely which most people don''t when the thing you it is to take 2 hours
    to install (-). You will most likely need to reinstall and do one of things: a)
    make your root or "/usr" larger or b) install fewer packages.

    Also, if none of the partitions you made for Linux is full, you are probably just
    missing some packages. You will need to use glint or rpm to install those.


    # 3.4 How do I mount my CD-ROM?


    you installed from CD-ROM, you should be able to do:


    mount /mnt/cdrom


    you get an error that says the mount point does not exist, do:


    dir /mnt/cdrom


    you did an install via NFS: You need to know what type of CD-ROM you have. The
    best way is to watch the boot messages as you reboot, or look at

    /var/adm/messages (more /var/adm/messages). You most likely have an IDE CD-ROM
    that will show up as /dev/hdc or /dev/hdd, or you have a Soundaster type that
    is /dev/sbpcd, or you have a SCSI device that is /dev/scd0.


    any case, you can do the following:


    ```

    mount -t iso9660 /dev/xxxx /mnt/cdrom

    ```


    substitute xxxx for YOUR DEVICE. You can then: cd /mnt/cdrom and then:

    sand you will be looking at the contents of the CD-ROM.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# D.3.5 Why does Linux only see part of my RAM?


    There are a couple of things that could be wrong. On some 386''s, you need to
    compile your kernel with “Limit memory to 16M?” enabled. Some AMI BIOS motherboards
    have a option to split memory into two segments. I''m not sure what the option
    is called, but it has something to do with "linear". You''ll find it in your BIOS
    setup. You may need to specify the amount of memory to the kernel at boot time
    fino. To try this, type: linux mem=32M at the lilo prompt. If that works, you
    can add that line to the append in /etc/lilo.conf and rerun lilo. The example
    from above would be:


    ```

    append = "mem=32M*

    ```


    Don''t forget to run ‘lilo’ after editing the file.


    # D.3.6 How do I install to my DOS partition?


    You can''t. None of the current Red Hat releases support UMSDOS installs. If you
    have one drive that has one big DOS partition with free space you want to use,
    you have two options. One is to backup all your DOS data somehow and then repartition
    the drive into smaller partitions and restore the DOS data back to a DOS partition.
    You then have a free partition for linux. The second choice is to use fips. fips
    is a program that will let you change your partition size of a DOS partition without
    harming the data on it. It is STRONGLY suggested that you backup your data before
    using ips. Red Hat Software makes no warranties or claims to the suitability of
    using fips for this purpose nor can we guarantee that data will remain unharmed.
    I haven''t heard of anyone having a bad experience with fips, but I won''t guarantee
    it either.


    # D.3.7 How do I use the NYS/NIS system that comes with Red-Hat?


    Please see the NYS-Tips. You can find it at http://www.redhat.com.'
  merge: -1
