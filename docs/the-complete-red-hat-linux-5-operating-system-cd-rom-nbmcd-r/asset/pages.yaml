    Figure 4.9: Sample Output From fdisk


    # Numbering Partitions


    Linux refers to disk partitions using a combination of letters and numbers which
    may be confusing to inexperienced users. Here is a summary:


    **First Two Letters** – The first two letters of the partition name indicate the
    type of device on which the partition resides. You’ll normally see either hd (for
    IDE disks), or sd (for SCSI disks).


    **The Next Letter** - This letter indicates which device the partition is on.
    For example, /dev/hda (the first IDE disk) or /dev/sdb (the second SCSI disk).


    **The number** denotes the partition. The first four (primary or extended) partitions
    are numbered 1 through 4. Logical partitions start at 5. E.g., /dev/hda3 is the
    third primary or extended partition on the first IDE hard disk; /dev/sdb6 is the
    second logical partition on the second SCSI hard disk.'
