    # 2.4.3 One Last Wrinkle: LILO


    LILO (the LinLoader) is the most commonly used method to boot Red Hat on Intel-based
    systems. Being an operating system loader, LILO operates “outside” of any operating
    system, using only the Basic I/O System (or BIOS) built into the computer hardware
    itself.


    # BIOS-Related Limitations Impacting LILO


    LILO is subject to some limitations imposed by the BIOS in most Intel-based computers.
    Specifically, most BIOSes can''t access more than two hard drives and they can''t
    access any data stored beyond cylinder 1023 (the 1024th cylinder) of any drive.
    Note that some recent BIOSes do not have these limitations, but this is by means
    universal.


    All the data LILO needs to access at boot time (including the Linux kernel) is
    located in the /boot directory, which is normally part of the root partition known
    as (/). Here are the guidelines you must follow if you are going to use LILO to
    boot your Red Hat Linux system:


    On First Two IDE Drives – If you have two IDE (or EIDE) drives, /boot must be
    located on one of them. Note that this two-drive limit also includes any IDE CD-ROM
    drives on your primary IDE controller. So, if you have one hard drive, and one
    CD-ROM on your primary controller, /boot must be located on the first hard drive
    only, even if you have other hard drives on your secondary IDE controller.


    On First IDE Or SCSI Drive – If you have one IDE (or EIDE) and one or more SCSI
    drives, /boot must be located either on the IDE drive or the SCSI drive at ID
    0. No other SCSI IDs will work.


    On First Two SCSI Drives – If you have only SCSI hard drives, /boot must be located
    on a drive at ID 0 or ID 1. No other SCSI IDs will work.


    Partition Completely Below Cylinder 1023 – No matter which of the above configurations
    apply, the partition that holds /boot must be located entirely'
