    that matter), you''ll need solid introductory information on basic Unix concepts.
    For example, O''Reilly and Associates

    (http://www.ora.com/) produce a wide variety of Linux and Unix-related books.
    Give them more general titles a try.


    # Some Linux Experience


    If you''ve used other Linux distributions (or a Linux operating system), you''ll
    probably find what you''re looking for in more in-depth reference material available.
    Red Hat Software''s Documentation and Linux Man are great for overall documentation,
    while O''Reilly''s more specialized titles are valuable when you need a lot of
    information on particular subject.


    # Old Timer


    If you''re a long-time Red Hat Linux user, you probably don''t need us telling
    you what documentation to read. Thanks for reading this far!


    # 2.6 A Note About Kernel Drivers


    During installation of Red Hat Linux, there are some limits placed on the filesystems
    and other drivers supported by the kernel. However, after installation there is
    support for all file systems available under Linux. At install the modular kernel
    has support for (E)IDE devices, (including ATAPI CD-ROM drives, SCSI adapters,
    and network cards). Additionally, all mice, SLIP, CSLIP, PPP, PLI, FPU emulation,
    console selection, ELF, SysV IPC, IP forwarding, firewalling and accounting, reverse
    ARP, QIC tape and parallel printers, are supported.


    Please Note: Because Red Hat Linux supports installation on many different types
    of hardware, many drivers (including for SCSI adapters, network cards and many
    CD-ROMs) are not built into the kernel used during installation, rather they are
    available as modules and loaded as you need them during the installation process.
    If necessary, you will have the chance to specify these modules at the time they
    are loaded, and in fact these drivers will ignore any options you you specify
    for them at the boot: - prompt.


    After the installation is complete you may want to rebuild a kernel that includes
    support for your specific hardware configuration. See Section 6.1 on page 87 for
    information on building a customized kernel.'
