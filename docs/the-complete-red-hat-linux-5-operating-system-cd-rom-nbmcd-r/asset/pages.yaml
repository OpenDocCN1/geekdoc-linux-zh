  md: '# Getting Documentation


    **/home partition** - This is where users'' home directories go; the size of /home
    depends on how many users you plan to have on your Red Hat Linux system and what
    they might store in their home directories.


    Additionally, you may wish to create any of the following:


    **/usr/local partition** - Traditionally, /usr/local has been used to hold things
    you wish to keep separate from the rest of your Red Hat Linux system, such as
    software that is not available as an RPM package. The size depends on the amount
    of software you anticipate putting on your system.


    **/usr/src partition** - There are two things that are stored in /usr/src on a
    Red Hat Linux system:


    +   **Linux Kernel Sources** - The complete sources for the Linux kernel are stored
    here, and new kernels are built.


    +   **Sources For RPM-Based Packages** - If a source package file (aka SRPM) is
    installed, the files are stored here. Note that, unless specified otherwise, any
    packages built also use a build directory located here.


    Again, the size of this partition would depend on the amount of software you anticipate
    building.


    **/tmp partition** - As the name implies, the /tmp partition is for temporary
    files. Creating a partitioning dedicated to /tmp is a good idea for larger, multiuseruser
    systems or network server machines. The reason is that many active users can fill
    the root partition (/), which is where /tmp is located. It''s not necessary to
    dedicate a partition to /tmp on single-user workstations.


    # Getting Documentation


    Red Hat Linux is a powerful, full-featured operating system. Unless you''re a
    Linux wizard, you''re going to need documentation to make the most of your Red
    Hat Linux system. Everyone should review Chapter 7 on page 111 for more information
    on available Linux documentation. While many people find the resources described
    in chapter 7 to be very helpful, people who are just starting to use Linux will
    likely need additional information. The information that will be most helpful
    depends on your level of Linux expertise:'
