    as you go. The upgrade procedure starts out identically to the installation procedure;
    you will be directed to choose an installation or upgrade after booting the installation
    program and answering a few questions.


    There are five things you should do prior to installing Red Hat Linux:


    +   1. Make sure you have access to the Red Hat Linux components required for
