  md: '# 5


    # Finishing the Installation


    #  5.1 Configuring a Mouse


    Next, the installation program will probe your system and try to find a mouse.
    If one is found, a dialog box is displayed showing the port on which the mouse
    was found. Press Space to continue.


    If necessary you''ll be asked to give additional information about the mouse,
    such as the mouse''s protocol and number of buttons.


    If you wish to change your mouse configuration after you have booted your Red
    Hat Linux system, you may use the /usr/sbin/mouseconfig command.


    #  5.2 Configuring X Windows


    After setting up your mouse, if you installed the X Windows packages, you will
    have the opportunity to configure your X server. If you did not choose to install
    the X Window System, you may skip to Section 5.3 on page 73.'
