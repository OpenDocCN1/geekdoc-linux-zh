    # 1.1 Filesystem Structure


    Hat Software is committed to the Linux File System Standard, a collaborative

    document that defines the names and locations of many files and directories. We\ll
    continue to track the standard to keep Red Hat compliant.


    mile compliance with the standard means many things, the two most impor-

    t are compatibility with other compliant systems, and the ability to mount the

    sr partition read-only. The /usr partition contains common executables and

    not meant to be changed by users. Because of the, the /usr partition can be

    unted from the CD-ROM or from another machine via read-only NFS. The cur-

