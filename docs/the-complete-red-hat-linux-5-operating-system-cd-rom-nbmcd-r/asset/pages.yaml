  md: '# User Authentication with PAM


    # User Authentication with PAM


    Programs which give users access to privileges of any sort need to be able to
    authenticate the users. When you log into a system, you provide your name and
    password, the login process uses those to authenticate the login—to verify that
    you are who you say you are. Other forms of authentication than passwords exist,
    and it is possible for the passwords to be stored in different ways.


    PAM, which stands for “Pluggable Authentication Modules”, is a way of allowing
    system administrator to set authentication policy without having to recompile
    programs which do authentication. With PAM, you control which modules are plugged
    into the programs by editing a configuration file.


    Most of Red Hat Linux users will never need to touch this configuration file.
    When you use RPM to install programs that need to do authentication, they automatically
    make the changes that are needed to do normal password authentication. However,
    you may want to customize your configuration, in which case you need to understand
    the configuration file.


    # 4.4.1 Modules


    There are four types of modules defined by the PAM standard. auth modules provide
    the actual authentication, perhaps asking for and checking a password, setting
    “credentials” such as group membership or kerberos “tickets”. account modules
    check to make sure that the authentication is allowed (the account has expired,
    the user is allowed to log in at this time of day, etc.). password modules are
    used to set passwords. session modules are used once a user has been authenticated
    to make it possible for them to use their account, perhaps mounting the user''s
    home directory or making their mailbox available.


    These modules can be stacked, so that multiple modules are used. For instance,
    login normally makes use of at least two authentication methods: if “hosts” authentication
    succeeds, it is sufficient to allow the connection; if it fails, then standard
    password authentication is done.


    New modules can be added at any time, and PAM-aware applications can then be made
    to use them. For instance, if you have a one-time-password calculator system,
    and you can write a module to support it (documentation on writing modules is
    included with the system), PAM-aware programs can use the new module and work
    with the new one-time-password calculators without being recompiled or'
