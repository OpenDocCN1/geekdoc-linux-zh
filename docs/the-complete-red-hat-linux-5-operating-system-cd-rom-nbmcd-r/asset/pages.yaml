    # # A Word From the Developers


    We would like to thank all our beta testers for entrusting their systems to early
    versions of Red Hat Linux for taking the time to submit bug reports from the front,
    especially those of you who have been with Red Hat since the "Halloween" release
    and earlier. We would also like to thank Linus Torvalds and the hundreds of developers
    around the world for creating, truly, one of the wonders of distributed development.


    And, again, we''d like to thank you for your interest in Red Hat Linux!


    The Red Hat Development Team


    # # Notes from the Editor


    Starting with this manual, Red Hat Software has dedicated full-time resources
    to producing documentation. Those of you who have read previous versions of this
    manual will gladly notice that some changes have been made; we hope you''ll like
    them. Our goal is to evolve this manual into a comprehensive document that can
    serve the needs of anyone wishing to install Red Hat Linux, no matter what their
    level of experience.


    # # We Need Feedback!


    As we move towards this goal, there are sure to be mistakes. If you spot one,
    or if you''ve thought of a way to make this manual better, we''d love to hear
    from you! Please send mail to:


    docs@redhat.com


    Be sure to mention the manual''s title, along with your suggestion. If you''ve
    found an error, please include the page number so we can find it easily. We may
    not be able to respond to every message sent to us, but you can be sure that we''ll
    be reading them all!'
