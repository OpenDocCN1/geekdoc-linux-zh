- img_proc: true
  md: '# io=0x210 irq=10


    You can use multiple ethernet cards in one machine . If each card uses a different
    driver (e.g., 3c509 and the DE425), you simply need to add aliases (and possible
    options) for each card to /etc/conf.modules; for example:


    ```

    alias eth0 3c509

    options 3c509 io=0x210 irq=10

    alias eth1 de4x5

    options de4x5 io=0

    ```


    See Section 9.6 on page 146 for more information.


    However, if any two ethernet cards use the same driver (e.g., two 3c509''s or
    3c595 and a 3c905), you will need to compile a custom kernel with the ethernet
    driver built in. In that case, you can use the "classic" LILO boot parameters
    in the form:


    ```

    ether=irq,base.addr,interface

    ```


    For example:


    ```

    LILO boot: linux ether=10,0x210,eth0 ether=11,0x300,eth

    ```


    (For more information about using more than one ethernet card, see the Multiple
    Ethernet mini-HOWTO.)'
  merge: -1
