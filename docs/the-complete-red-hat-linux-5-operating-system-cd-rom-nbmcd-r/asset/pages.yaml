  md: '# 1.3 System Administration-Related Enhancements


    # 1.3.2 Improved Shadow Utilities


    Support for shadow passwords has been enhanced significantly for Red Hat Linux
    5.0. The shadow-utils package contains a number of utilities that support:


    +   - Conversion from normal to shadowed passwords and back (pwconv, pwinconv).

    - Verification of the password, group, and associated shadow files (pwck, grpck).

    - Industry-standard methods of adding, deleting, and modifying user accounts (useradd,
    usermod, and userdel).

    - Industry-standard methods of adding, deleting, and modifying groups (groupadd,
    groupmod, and groupdel).

    - Industry-standard method of administering the /etc/group file (gpasswd).


    Please Note: There are a few additional points of interest concerning these utilities:


    +   - The utilities will work properly whether shadowing is enabled or not.

    - The utilities have been slightly modified to support Red Hat Software''s user
    private group scheme. For a description of the modifications, please see the useradd
    man page. For more information on user private groups, please turn to Section
    11.3.3 on page 169.

    - The adduser script has been replaced with a symlink to /usr/sbin/useradd.


    # 1.3.3 New Initscript Utility


    The chkconfig utility provides a simple command-line tool for maintaining the
    /etc/rc.d directory hierarchy. It relieves system administrators from having to
    directly manipulate the numerous symlinks in /etc/rc.d.


    Please see the chkconfig man page for more information.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 1.3.4 New Backup Script


    For more information on rhbackup, please consult the rhbackup man page.


    # 1.3.5 Improved network configuration utility


    The network configuration utility netcfg has been enhanced. It now has the ability
    to clone network interfaces. Consider the following example:


    A laptop is connected to a corporate LAN most days. Sometimes, the laptop''s owner
    travels to a division of the company, and would like to use the laptop on the
    division''s LAN. In addition, at night, the laptop''s owner would like to connect
    the laptop to a LAN at home.


    In the past, this situation would have required a fair bit of effort to accommodate.
    With clone interfaces, it''s only necessary to create two clones of the original
    Ethernet interface, and give them the appropriate information. This is by selecting
    the interface to clone and pressing the clone button. After giving the clone device
    a name (such as "home"), you will see a window similar to the one in Figure 1.4.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_23_0.png)


    Figure 1.4: Clone Interface Setup


    As you can see, you can specify an alternate IP address and netmask (the network
    and broadcast addresses are calculated automatically), or use bootp or dhcp to
    configure the interface. In addition, the clone device may be configured to start
    on boot.'
