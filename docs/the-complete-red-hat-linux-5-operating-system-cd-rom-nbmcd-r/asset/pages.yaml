  md: '# 2.1.3 No Boxed Set? No Problem!


    Of course, not everyone purchases a Red Hat Linux boxed set. It''s entirely possible
    to install Red Hat Linux using a CD created by another company, or even via FT.
    In these cases, you may need to create one or more diskettes to get started.


    For people installing Red Hat Linux/Intel, you''ll need a boot diskette, and optionally
    a supplemental diskette. It is also possible to start the installation directly
    from the CD, under certain conditions. We''ll discuss this in more detail when
    we outline the various installation methods available.


    # 2.1.4 Checking for Updated Diskette Images


    From time to time, we find that the installation may fail, and that a revised
    diskette image is required in order for the installation to work properly. In
    these cases, we will make special images available via the Red Hat Linux Errata.


    Since this is a relatively rare occurrence, you will in general save time if you
    try to use the standard diskette images first, and then review the Errata only
    if you experience problems completing the installation.


    There are two ways to review the Errata:


    +   1. **World Wide Web** - By pointing your web browser at http://www.redhat.com/errata,
    you can read the Errata online, and download diskette images easily.


    +   2. **Electronic Mail** - By sending an empty mail message to errata@redhat.com,
    you will receive a mail message containing the complete Errata. Also included
    are URLs to each updated package and diskette image in the Errata. By using these
    URLs, you can download any new necessary diskette images. Remember to use binary
    mode when transferring your diskette image!


    For now, concentrate only on the Errata entries that include new diskette images
    (the filenames always end in .img). If you find an entry that seems to apply to
    your problem, get a copy of the diskette images, and create them using the instructions
    in Appendix A on page 181.'
  merge: -1
