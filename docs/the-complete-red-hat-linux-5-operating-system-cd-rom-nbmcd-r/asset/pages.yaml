  md: '# 9 Control Panel


    The control panel is a launching pad for a number of different administration
    tools. They make your life easier by letting you configure things without remembering
    configuration file formats and awkward command line options.


    To start the control-panel, start the X Window System as root with startx and
    type control-panel in xterm. You will need to run the control-panel tools successfully.
    You can do this as if you already have X running as a normal user. Just type su
    -c control-panel and then type the root password when prompted. If you plan to
    do other tasks as root, you could type su - followed by the root password when
    prompted. You will then be given a root shell. Here, you will need to type DISPLAY=:0
    control-panel & to get the control panel to work. The "DISPLAY" part tells the
    control panel to use your display. This syntax works only for a Bourne-compatible
    shell bash. If you run tcsh, you would enter setenv DISPLAY=:0; control-panel
    &.


    Double clicking on an icon starts a tool. Please note that


