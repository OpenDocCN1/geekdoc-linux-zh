    service is already up and running! Just point your web browser at http://localhost.


    The default page is shown as /home/httpd/html/index.html. You can edit this file
    (or replace it) to your liking. All the CGI programs, icons, and html pages are
    stored in /home/httpd, but this can be changed in /etc/httpd/conf/. Logs of all
    http activity, all of which are stored in /var/log/httpd/. Setting up your web
    site is as easy as adding your own HTML pages and links to the /home/httpd/html/
    directory. For more information on customizing your web server we recommend a
    reference such as HTML: The Definitive Guide by Chuck Musiano & Bill Kennedy,
    published by O''Reilly & Associates.


    # 6.9 NFS Configuration


    NFS stands for Network File System, and is a way to share files between machines
    as if they were on your local hard drive. Linux can be both an NFS server and
    an NFS client, which means that it can export filesystems to other systems, and
    mount filesystems exported from other machines.'
