  md: '# 1


    # # New Features Of Red Hat Linux 5.0


    This chapter describes features that are new to Red Hat Linux 5.0.


    # ## 1.1 Installation-Related Enhancements


    There have been many changes made to make the Red Hat Linux installation process
    easier. Here''s a list:


    +   * Automatic probing of PCI devices

    * Expert installation mode

    * Kickstart installation mode

    * New method of configuring partitions and mount points

    * Daemons can be configured to run at boot or not

    * Enhanced XFree86 configuration'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 1.1.1 Automatic Probing of PCI devices


    The installation program can probe computers with PCI devices. If desired, auto-probing
    can be disabled by running the installation in expert mode (see Section 1.1.2


    # 1.1.2 Expert Installation Mode


    By entering expert at the initial boot : prompt, you can run the installation
    pro-gram in expert mode. Expert mode causes the installation program to revert
    to an installation style very similar to that used with Red Hat Linux 4.2. This
    means most of the new auto-probing code is replaced with dialog boxes that prompt
    the user to manually enter device information. These dialog boxes also include
    a field allowing the user to enter options to be passed to the driver module loaded.
    Therefore, if a particular hardware configuration requires module options, an
    expert-mode installation should be used.


    # 1.1.3 Kickstart Installation Mode


    It''s possible to automate Red Hat Linux installations by using kickstart mode.
    In-stead of asking the user questions during the installation, kickstart mode
    reads a file that contains all the information necessary to install Red Hat Linux.
    This is handy when installing many similarly-configured systems. For more information
    on kickstart mode, please read /doc/README.ks on the Red Hat Linux CD-ROM.


    # 1.1.4 Configuring Partitions and Mount Points


    In the past, the installation program used fdisk to set up disk partitions, and
    a series of dialog boxes to define mount points. While that functionality is still
    available in Red Hat Linux 5.0, there is an alternative. Disk Druid provides both
    mount point definition and partition configuration in one concise screen. In-dition,
    Disk Druid supports the concept of “growable partitions” – partitions that can
    grow beyond a minimum size to allocate all remaining space on a hard disk.


    For more information on Disk Druid, please refer to Section 4.3.1 on page 52.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# New User-Mode Tools


    # 1.1.5 Configuring Services to Run at Boot Time


    In prior versions of Red Hat Linux, if you installed a particular service (such
    bind, samba, etc.) while installing Red Hat Linux, that service configured to
    automatically start once the installation was complete and the system rebooted.
    Now, you will have the option, during the installation, to select which services
    should start and which should not. During the installation, you will be asked
    to select which services should be started whenever the system is booted. For
    more information, refer to Section 5.5 on page 74.


    # 1.1.6 Enhanced XFree86 Configuration


    The XFree86 configuration utility Xfigurator has been enhanced. It will now attempt
    to probe your system to automatically determine what type of video card is installed.
    In addition, Xfigurator will now determine the optimal display resolution and
    color depth for your hardware configuration.


    # 1.2 New User-Mode Tools


    One of the biggest stumbling blocks to a new Red Hat Linux user is that many tasks
    can only be performed by the root account, by knowing an arcane set of commands,
    or both. To make life easier, there are several new tools that can be used by
    any user to perform common tasks:


    +   * User information tool

    * User password tool

    * Filesystem mount tool

    * Network device tool


    # 1.2.1 User Information Tool


    The user information tool is used to set the "gecos" information in a user''s
    passwd record. Figure 1.1 on the following page shows it in action.


    As you can see, you can enter your:'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# New Features Of Red Hat Linux 5.0


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_19_0.png)


    Figure 1.1: User Information Tool


    +   - Full Name

    - Office

    - Office Phone

    - Home Phone

    - Shell


    To use this tool, run /usr/bin/userinfo.


    # 1.2.2 User Password Tool


    As the name implies, the user password tool is used to change passwords. The tool
    displays a pop-up message identifying the user whose password is being changed,
    followed by prompts for the current and new password. To use the password tool,
    run /usr/bin/userpasswd.


    # 1.2.3 Filesystem Mount Tool


    This program makes it easy to mount and unmount filesystems. It will display Mount
    and Format buttons for each filesystem in /etc/fstab that has been configured
    with the user option. In Figure 1.2 on the next page, the CD-ROM drive has been
    mounted (and can be unmounted with a click of the Unmount button).'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 1.3 System Administration-Related Enhancements


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_20_0.png)


    Figure 1.2: Filesystem Mount Tool


    The **Format** button is active for all writeable, unmounted media, and will format
    the media when pressed.


    To use this tool, run /usr/bin/usermount.


    # 1.2.4 Network Device Tool


    It is easy to start and stop network interfaces when using this tool. Every network
    interface available to users is displayed, along with a colored button representing
    its status (see Figure 1.3 on the following page). Clicking on the interface''s
    button toggles that interface (ie, it turns on when it is off, and vice versa).
    Clicking on the status info button forces an update on that interface''s status
    (though the status will also update automatically). When done, click **Exit**
    to exit.


    To use this tool, run /usr/bin/usermount.


