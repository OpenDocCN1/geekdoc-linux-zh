    carries the domain down to the Host name field. Enter the hostname you are using
    in front of the domain name to form a fully qualified domain name (FQDN). If your
    network has more than one nameserver, you may enter IP addresses for additional
    nameservers in the Secondary nameserver and Tertiary nameserver fields. Choose
