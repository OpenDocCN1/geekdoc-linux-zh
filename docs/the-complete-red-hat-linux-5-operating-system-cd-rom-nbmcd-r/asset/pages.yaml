  md: '# 4.6 Selecting and Installing Packages


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_82_0.png)


    # 4.6.4 Package Installation


    After all package dependencies are resolved, the installation program presents
    a dialog box telling you that log file containing a list of all packages installed
    will be written to /tmp/install.log on your Red Hat Linux system. Select Ok and
    Space to continue.


    At this point, the installation program will format every partition you selected
    for formatting. This can take several minutes (and will take even longer if you
    directed the installation program to check for bad blocks).


    Once all partitions have been formatted, the installation program starts to install
    packages. A window entitled "Install Status" is displayed with the following information:


    **Package** – The name of the package currently being installed.


    **Size** – The size of the package (in kilobytes).


    **Summary** – A short description of the package.


    **Package Installation Progress Bar** – A bar showing how complete the current
    package installation is.'
