    Package Management with RPM


    Hat Package Manager (RPM), is an open packaging system available for anyone to
    use, and works on both Red Hat Linux as well as other Linux and UNIX systems.
    Red Hat Software encourages other vendors to take the time to look at RPM and
    use it for their own products. RPM is distributable under the terms of GPL.


    the end user, RPM provides many features that make maintaining a system far easier
    than it has ever been. Installing, uninstalling, and upgrading RPM packages is
    all one line commands, and all the messy details are taken care of for you. RPM
    maintains a database of installed packages and their files, which allows you to
    perform powerful queries and verification of your system. During RPM upgrades
    configuration files specially, so that you never lose your customizations- feature
    that is impossible with straight .tar.gz files.


    the developer, RPM allows you to take source code for software and package into
    source and binary packages for end users. This process is quite simple and driven
    from a single file and optional patches that you create. This clear definition
    of "pristine" sources and your patches and build instructions eases the'
