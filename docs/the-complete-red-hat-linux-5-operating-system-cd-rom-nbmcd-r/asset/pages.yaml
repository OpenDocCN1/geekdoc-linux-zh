  md: '# Red Hat Software, Inc.''s Role in Linux Development


    # Red Hat Software, Inc.''s Role in Linux Development


    Red Hat Linux distribution is also issued under the GPL. We see our role making
    the Linux OS easy to install, configure, and maintain for professional developers,
    system administrators, and students. Red Hat Linux is available at cost and few
    restrictions (the GPL) It is also available on CD from Red Hat Software http://www.redhat.com
    (919) 7-0012 and most of the Linux Archive CD vendors.


    Red Hat Software, Inc. provides support for users of the Linux OS, from individuals
    running a single workstation to large organizations running hundreds of worked
    machines, in a variety of programs.


    We gratefully acknowledge the support that we have received from the Linux development
    community including Linux Torvalds, everyone on the contributors list, and the
    thousands of other developers who helped make Linux what it is today. We would
    also like to acknowledge the growing contribution of commercial developers to
    our efforts including Digital Equipment Corporation, Reilly & Associates, Metro
    Linux Inc, and others. We are encouraged by Red Hat''s Linux distribution, to
    develop and add features, or simply package programs that you need or that you
    think others would appreciate. Please do not hesitate to contact us for any help
    you require.


    You can contact Red Hat Software directly at: info@redhat.com.


    # Further Reading


    There are Internet based listings of both the freely distributable and commercial
    software available for Linux in documents such as the Linux Journal, the Commercial
    HOWTO, the Linux Software Map, and from many Linux vendors, including Red Hat
    Software''s retail distribution. Many third party and commercial products can
    be purchased through Red Hat''s web site, including Motif, database development
    systems, editors, and more. Info can be obtained by sending a fax request to (919)
    2-6726, and the web site is located at http://www.redhat.com.


    For more information on Linux please see:


    +   * Running Linux, M. Welsh, O''Reilly & Associates, 1995.'
