  md: '# 6


    # Post Installation Configuration


    After installation your system is fully functional, but you may still want to
    do some additional configuration. This chapter describes some of the various system
    configuration tasks you may need to do.


    # 1 Building a Custom Kernel


    With the introduction of modularization in the Linux 2.0.x kernel there have been
    some significant changes in building customized kernels. In the past you were
    required to compile support into your kernel if you wanted to access a particular
    hardware or filesystem component. For some hardware configurations the size of
    the kernel could reach a critical level. To require support for items that were
    only occasionally used was an inefficient use of system resources. With the capabilities
    of the 2.0.x kernel, if there are certain hardware components or systems that
    are used infrequently, driver modules for them can be loaded on demand. For information
    on handling kernel modules see Chapter 9, Section 9.6.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# 6.1.1 Building a modularized kernel


    These instructions provide you with the knowledge to take advantage of the power
    and flexibility available through kernel modularization. If you do not wish to
    take advantage of modularization, please see Section 6.1.3 for explanation of
    the different aspects of building and installing a monolithic kernel. It is assumed
    that you have already installed the kernel-headers and kernel-source packages
    and you issue all commands from the /usr/src/linux/directory/


    It is important to begin a kernel with the source tree in a known condition. Therefore,
    it is recommended that you begin with the command make proper to remove any configuration
    files along with the remains of previous builds that may be scattered around the
    source tree. Now you must create a configuration file that determines which components
    to include in your new kernel. Depending upon your hardware and personal preferences
    there are three methods available to configure the kernel.


    +   - make config An interactive text program. Components are presented as you
    answer with Y (yes), N (no), or M (module).


    +   - make menuconfig A graphic, menu driven program. Components are listed in
    menu categories, you select the desired components in the same manner used in
    the Red Hat Linux installation program. Toggle the label corresponding to the
    item you included; Y (yes), N (no), or M (module).


    +   - make xconfig An X Windows program. Components are listed in levels of menus,
    components are selected using a mouse. Again, select (yes), N (no), or M (module).


    **Post Note:** In order to use kerneld (see Section 9.6 for details) and kernel
    modules you must answer Yes to kernel support and module version (CONFIG_MODVERSIONS)
    support in the configuration.


    **Post Note:** If you are building a Linux/Intel kernel on (or for) a machine
    that uses a "clone" processor (for example, one made by Ciryx or AMD), it is recommended
    to choose a Processor type of 386.


    If you wish to build a kernel with a configuration file (/usr/src/linux/.config)
    that you have already created with one of the above methods, you can omit the
    make proper and make config commands and use the command make followed by make
    clean to prepare the source tree for the build.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Building a Custom Kernel


    the next step consists of the actual compilation of the source code components
    to a working program that your machine can use to boot. The method described is
    the easiest to recover from in the event of a mishap. If you are interested in
    other possibilities details can be found in the Kernel-HOWTO or in the Makefile
    /usr/src/linux on your Linux system.


    +   - Build the kernel with make boot.


    +   - Build any modules you configured with make modules.


    +   - Move the old set of modules out of the way with:


    ```

    rm -rf /lib/modules/2.0.29-old

    mv /lib/modules/2.0.29-old /lib/modules/2.0.29-old

    ```


    Of course, if you have upgraded your kernel, replace 2.0.29 with the version you
    are using.


    +   - Install the new modules (even if you didn''t build any) with

    make modules.install.


    you have a SCSI adapter and make your SCSI driver modular, build a new initrd
    image (see Section 6.1.2; note that there are few practical reasons to make the
    eSCSI driver modular in a custom kernel).


    order to provide a redundant boot source to protect from a possible error in new
    kernel you should keep the original kernel available. Adding a kernel to LILO
    boot menu is as simple as renaming the original kernel in /boot, copying the new
    kernel to /boot, adding a few lines in /etc/lilo.conf and running

    bin/lilo. Here is an example of the default /etc/lilo.conf file shipped with The
    Red Hat Linux


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b


    prompt

    timeout=100

    image=/boot/vmlinuz

    label=linux

    root=/dev/hdal

    read-only

    ```'
