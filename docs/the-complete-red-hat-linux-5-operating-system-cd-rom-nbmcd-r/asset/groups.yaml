    # Metro X 配置文件


    增加数量 x，然后向垂直同步起始（Vertical Sync Start）和垂直同步结束（Vertical Sync End）值中各加上 x 的一半。


    - 图像水平过宽：要缩小水平过宽的图像（图像超出了左右边缘），请将水平总宽度（Horizontal Total）减少 x，然后从水平同步起始（Horizontal
    Sync Start）和结束（Sync End）值中各减去 x 的一半。


    - 图像垂直过高：要缩小垂直过高的图像（图像超出了上下边缘），请将垂直总高度（Vertical Total）减少 x，然后从垂直同步起始（Vertical
    Sync Start）和垂直同步结束（Vertical Sync End）值中各减去 x 的一半。


    扩展配置位于 /usr/lib/Metro/X11/Extensions。大多数扩展都是动态加载的；也就是说，如果需要，它们会自动加载，无需额外的手动配置。“开启”的扩展在服务器启动时加载且永不卸载。标记为“DYN”的扩展在
    X 客户端调用 XQueryExtension 请求时按需加载。这些扩展可以通过 XListExtensions 或 xdpyinfo 显示。标记为“OFF”的扩展不被使用，也不会通过
    XListExtensions 或 xdpyinfo 显示。


    # 注意事项


    - 多缓冲（Multi-Buffering）和双缓冲（DOUBLE-BUFFER）无法动态加载。它们必须被设置为“ON”或“OFF”。


    - GLX (OpenGL)可以动态加载，但 GLX 取决于 DOUBLE-BUFFER 是否“ON”。因此，要使用 GLX，请将 DOUBLE-BUFFER
    设置为“ON”并将 GLX 设置为“DYN”。


    - X3D-PEX (PEX)可以动态加载，但 X3D-PEX 取决于多缓冲是否“ON”。因此，要使用 X3D-PEX，请将多缓冲设置为“ON”并将 X3D-PEX
    设置为“DYN”。


