- md: '

    ## Beginning the Installation


    Note that this method will not work if run in a DOS window - the autoboot.bat
    must be executed with DOS as the only operating system. In other words, windows
    cannot be running.


    Note: The Red Hat Linux/Intel CD-ROM can also be booted by newer computers that
    support bootable CD-ROMs. Not all computers support this feature, so, if you can''t
    boot from CD-ROM, you''ll have to use a boot diskette (or reboot from DOS) to
    get things started.


    ## Beginning the Installation


    After booting, the installation program begins by asking if you are using a color
    monitor (see Figure 3.2). Yes is the default - you should see a cursor or highlight
    text to the Yes button. If you don''t see a cursor or highlight press Tab once
    to select No, and then Enter to proceed.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_52_0.png)


    Figure 3.2: Beginning the Installation


    Next, the installation program displays a welcome message. Press Enter to begin
    the installation. If you wish to abort the installation process at this time,
    simply select the boot diskette now and reboot your machine.


    ### 3.3.1 Selecting a Keyboard Type


    After the welcome dialog, the installation program gives you an opportunity to
    select a keyboard type (see Figure 3.3). Using the Tab and keys, select the appropriate
    keyboard type for your Red Hat Linux system. Note the scroll bar to the right
    of the keyboard types - it indicates that there are more types than can be displayed
    at one time. You''ll be seeing scroll bars throughout the installation.


    After selecting the appropriate keyboard type, press Enter, the keyboard type
    you select will be loaded automatically both for the remainder of the installation
    process. If you wish to change it after booting your Red Hat Linux system, you
    can change your keyboard type after you have booted your Red Hat Linux system,
    using the /usr/sbin/kbdconfig command.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_53_0.png)


    Figure 3.3: Selecting a Keyboard Type


    ### 3.3.2 PCMCIA Support


    Next, the installation program will probe your system to determine if your system
    requires PCMCIA (also known as PC Card) support. If a PCMCIA controller is found,
    you will be asked to insert the supplemental diskette - Select OK when you are
    done so.


    ## Selecting an Installation Method


    The installation program will then display a progress bar as the supplemental
    diskette is loaded.


    Please Note: If you are performing an installation in expert mode, you will be
    asked whether PCMCIA support is required. You must answer Yes if you are using
    a PCMCIA device for installation (for example, a PCMCIA ethernet card for installing
    via NFS, or a PCMCIA SCSI card for installing from a SCSI CD).


    Next, you are asked what type of installation method you wish to use (see Figure
    3.4). Highlight the appropriate choice and select OK, or press Enter. You can
    install Red Hat Linux via any of four basic methods (see Section 2.3 on page 20),
    some of which require the use of a supplemental diskette. To summarize, you can
    Red Hat Linux from:


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_54_0.png)


    Figure 3.4: Selecting an Installation Method


    - CD-ROM - If you have a CD-ROM drive and the Red Hat Linux CD-ROM. Does not require
    a supplemental diskette. Please refer to Section 3.4.1 on the next page to select
    the CD-ROM installation method.

    - NFS - If you are installing from an NFS server which is exporting the Red Hat
    Linux CD-ROM or a mirror of Red Hat Linux from the Red Hat FTP site. Does not
    require a supplemental diskette. Please refer to Section 3.4.2 on the facing page
    to select the NFS installation method.

    - **Hard Drive** - If you copied the Red Hat Linux files to a local hard drives.
    Requires a supplemental diskette. Please refer to Section 3.4.8 on page 44 to
    select the hard drive installation method.

    - **FTP** - If you are installing directly from an FTP server. Requires a supplemental
    diskette. Please refer to Section 3.4.2 on the facing page to select the FTP installation
    method.


    ### 3.4.1 Installing From CD-ROM


    If you are going to install Red Hat Linux from CD-ROM, select "CD-ROM", and select
    Ok. The installation program will probe your system, and attempt to identify your
    CD-ROM drive. If it cannot, you will be asked what type of CD-ROM you have. You
    can choose from the following types:


    - **IDE (ATAPI)** Most CD-ROM drives available for Intel-based PCs are IDE (also
    known as ATAPI). If this type is selected, the installation program will check
    for all available IDE devices for a CD-ROM drive.

    - **SCSI** Select this if your CD-ROM is attached to a supported SCSI adapter;
    the installation program asks you to choose a SCSI drive. Choose the driver that
    most closely resembles your adapter. You may specify options for the driver if
    necessary; however, most drivers will detect your SCSI adapter automatically.

    - **Other** If your CD-ROM is neither an IDE nor a SCSI CD-ROM, it’s "other".
    Sound cards with proprietary CD-ROM interfaces are examples of this CD-ROM type.
    The installation program identifies your CD-ROM, and once it has been identified,
    you will be asked to insert the supplemental diskette. Turn to Chapter 4 on page
    49 to continue installing Red Hat Linux.


    ## Selecting an Installation Method


    NFS and FTP-based installations are similar, in that both require network information.
    Therefore, we''ll discuss them together. Highlight the installation method you
    prefer, select OK. If you''re going to do an NFS installation, skip ahead to 3.4.4
    on the next page. If you''re going to do an FTP installation, read on.


    ### 3.4.2 Installing Over Network


    If you are going to install Red Hat Linux from an NFS-served filesystem, highlight
    the “NFS image” and select OK.


    ### 3.4.3 Installing via FTP


    If you are going to install Red Hat Linux from an FTP site, highlight “FTP”, and
    select OK. The installation program will display a progress bar as the supplemental
    diskette is loaded.


    ### 3.4.4 Installing NFS


    If you are going to install Red Hat Linux from an NFS-served filesystem, select.


    ### 3.4.5 Network Driver Configuration


    Next, the installation program will probe your system and attempt to identify
    your network card. Most of the time, the driver can locate the card automatically.
    If it is not able to identify your network card, you''ll be asked to choose the
    driver that supports your network card and to specify any options necessary for
    the driver to locate and recognize it.

    '
