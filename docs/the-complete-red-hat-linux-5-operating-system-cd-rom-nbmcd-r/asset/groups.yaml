    # 1.4.1 Modular Sound Drivers


    In Red Hat Linux 5.0, the standard OSS/Free sound drivers have been modified to
    be completely modular. This allows for such things as loading and unloading the
    various sound drivers without recompiling the kernel tree or rebooting. The work
    was performed by Alan Cox and was sponsored by Red Hat Software, Inc.'
