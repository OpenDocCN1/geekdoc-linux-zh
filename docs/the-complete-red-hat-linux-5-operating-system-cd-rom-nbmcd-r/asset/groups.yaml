    # 多屏幕配置


    Metro-X 支持多达四个屏幕，并可以通过单个键盘和鼠标同时控制所有屏幕。这允许你运行许多应用程序而不会产生窗口重叠，对于图像处理工作特别有用。对于使用的每个屏幕，必须为该屏幕的显示器和显卡创建单独的配置。关于显卡要求请参见第
    C.1.4 节。


    # 添加屏幕


    Metro-X 默认采用单屏设置。第一个配置的屏幕被标记为 Screen 0。当你添加第二个屏幕时，其所有默认配置都将复制 Screen 0 的当前设置。因此，如果所有屏幕的硬件相同，你可以在添加其他屏幕之前先配置
    Screen 0，从而节省时间。同样，随着屏幕的增加，每当你添加另一个屏幕时，当前激活的屏幕的设置将决定新屏幕的默认设置。


    - 1. 按 Alt-S 显示屏幕拉取菜单。

    - 2. 输入 A 进行添加（Add）。

    - 3. Screen 0 的显示器和显卡图标变为轮廓，而 Screen 1 显示两个全彩色图标。

    - 4. 如果需要对新屏幕的配置进行任何更改，请参考本章前面介绍的步骤。

    - 5. 使用 Page Down 和 Page Up 键移动到每个屏幕的配置页面。


    # 删除屏幕


    当删除一个屏幕时，所有编号更高的屏幕都会立即向下移动一个位置。例如：你配置了屏幕 0、1 和 2，然后删除了屏幕 1。该屏幕及其所有的配置信息将消失。屏幕
    2 随后变为屏幕 1，但保留其自身的配置。你最后将剩下屏幕 0 和屏幕 1。


    # 使用 Metro-X 进行 X Window 配置


    - 1. 使用 Page Down 或 Page Up 键激活你想要删除的屏幕图标组。

    - 2. 按 Alt-S 显示屏幕拉取菜单。

    - 3. 输入 D 进行删除（Delete）。

    - 4. 一组显示器和显卡图标消失。编号更高的屏幕（如果有）将立即填补被删除屏幕留下的空隙。


    # 布局


    屏幕布局（Screen Layout）窗口允许你指定多个屏幕在工作区中的排列方式，以便鼠标在屏幕之间的移动是合理的。


    - 1. 按 Alt-S 显示屏幕拉取菜单。

    - 2. 输入 L 进入布局（Layout）。

    - 3. 屏幕布局窗口出现。

    - 4. 按 Ctrl 和 Alt 查看你屏幕的各种布局组合。

    - 5. 当显示你所需的布局时，按 Enter键选择它。


    # 字体路径


    如果需要，你可以在 Metro-X 配置工具内部编辑字体路径。如果你正在使用字体服务器代替或额外使用现有的字体，这将是必要的。


    - 1. 按 Alt-C 显示配置拉取菜单，然后按 Enter。

    - 2. 字体路径（Font Path）窗口出现。

    - 3. 根据系统需要对文件进行编辑。Metro-X 按照文件中列出的目录的顺序查找字体。如果你使用字体服务器，请将其作为第一行输入：


    ```

    tcp/<fontserver>:7000

    ```


    # 安装后配置


    如果端口号不是默认的 7000，请更改为适用于系统的端口号。


    - 4. 按 Tab 在底部按钮之间移动，按 Enter 选择一个。如果信息正确，选择 OK 按钮。如果你想忽略已所做的更改，选择 Cancel 按钮。如果你编辑了字体路径并想回到原始设置，选择
    Load Defaults 按钮。


    # 保存并退出


    - 1. 按 Alt-F 显示文件拉取菜单。

    - 2. 输入 S 保存并退出（Save and Exit）。

    - 3. 更改已保存，Metro-X 配置工具关闭，你的系统现在准备好运行 Metro-X！


    # 不保存退出


    - 1. 按 Alt-F 显示文件拉取菜单。

    - 2. 输入 Q 退出（Quit）。

    - 3. 出现警告框：在退出前保存当前配置！

    - 4. 按 Tab 移动到 No 按钮，按 Enter 确认不保存更改并退出 Metro-X 配置工具。


    # 6.4 鼠标配置


    要配置你的鼠标（或在安装后重新配置），输入命令 /usr/sbin/mouseconfig。使用方向键向下滚动列表，直到你的鼠标类型被高亮。如果你连接的是
    PS/2 类型的端口，应选择 PS/2。如果你连接的是 ATI 视频显卡，应选择 ATI。


    # 5.5 鼠标


    同时点击左和右鼠标按钮使用 Tab 键移动光标，按空格键切换选择。


    # 6.5 Sendmail


    默认的 sendmail.cf 文件将安装在 /etc/。默认配置对于大多数 SMTP 站点有效，但对于 UUCP 站点无效；如果你需要使用 UUCP 传输，请生成新的
    sendmail.cf。如果你需要安装 m4 软件包，请生成新的 sendmail 源。关于创建 sendmail 配置的更多信息，请阅读 README 文件。一种常见的
    sendmail 配置是让单台机器作为网络上所有机器的网关。例如，Red Hat Software 有一台机器接收并处理所有邮件。在那台机器上，我们只需要在
    /etc/sendmail.cf 中添加所有机器的名称。如下：


    ```

    # sendmail.cw - include all aliases for your machine

    torgo.redhat.com

    poodle.redhat.com

    devel.redhat.com

    ```


    然后在其他机器 torgo、poodle 和 devel 上，我们需要编辑 /etc/sendmail.cf 在发送邮件时“伪装”为 redhat.com，将任何本地邮件转发到
    redhat.com。在 /etc/sendmail.cf 中找到 DR 和 DM 行并进行编辑：


    ```

    # who send unqualified names to

    # (null means deliver locally)

    DRmailredhat.com

    ```


    ```

    # who send unqualified names to

    # (null means deliver locally)

    DRmailredhat.com

    ```


    ```

    # who send unqualified names to

    # (null means deliver locally)

    DRmailredhat.com

    ```


    ```

    # who send unqualified names to

    # (null means deliver locally)

    DRmailredhat.com

    ```


    ```

    # who send unqualified names to

    # (null means deliver locally)

    DRmailredhat.com

    ```


    通过此配置，所有从 redhat.com 发出的邮件看起来都是从 DMredhat.com 发出的。请注意，如果你将你的系统伪装为 redhat.com，任何邮件将发送到
    redhat.com。此配置允许来自 redhat.com 机器的所有连接。它还允许来自所有机器的 talk、finger 和 ftp 请求。


    ```

    ALL: redhat.com

    in.talked: ALL

    in.fingerd: ALL

    in.ftpd: ALL

    ```


    # 6.6 控制访问


    作为一种安全措施，大多数网络服务由一个名为 TCP wrapper 的保护程序管理。受保护的服务是 /etc/inetd.conf 中列出的指定 /usr/sbin/tcpd
    的服务。tcpd 可以根据请求源使用 /etc/hosts.allow 和 /etc/hosts.deny 允许或拒绝访问。默认情况下，Red Hat Linux
    允许所有服务。这是一个示例：


    ```

    ALL: ALL

    in.talked: ALL

    in.fingerd: ALL

    in.ftpd: ALL

    ```


    tcpd 允许更复杂的访问控制，结合 /etc/hosts.allow 和 /etc/hosts.deny。详细信息请查阅 tcpd(8) 和 hosts.access
    手页。


    # 匿名 FTP


    # 匿名 FTP


    设置匿名 FTP 非常简单。你只需要安装 anon-ftp 软件包（你可能在安装时已经完成了）。一旦安装完成，匿名 FTP 就会运行。你可能希望编辑几个文件来配置你的
    FTP 服务器。


    /etc/ftpass 该文件定义了 FTP 服务器的大部分访问控制。你可以执行的操作包括：设置逻辑“组”以控制来自不同站点的访问、限制并发连接数、配置传输日志等。详细信息请查阅
    ftpass 手页。


    /etc/fhosts fhosts 文件用于允许或拒绝来自各种主机的某些帐户的访问。详情请查阅 fhosts 手页。


    /etc/ftusers 该文件列出了所有不允许 FTP 到你机器的用户。例如，root 默认列在 /etc/ftusers 中。这意味着你不能 FTP 到你的机器并以
    root 身份登录。这是一个很好的安全措施，但某些管理员倾向于从文件中移除 root。


    # 万维网


    万维网是当今互联网最火热的话题之一。Red Hat 让你能够通过两种方式参与其中——作为 Web 浏览器和作为 Web 服务器。让我们来看看这两者。


    # 万维网浏览器


    Linux 有多种 Web 浏览器，包括 arena、lynx 和 grail 等免费分发的浏览器。最流行的商业浏览器是来自 Netscape Communications
    Corporation 的。你可以从他们的 ftp 站点获取评估版和非商业用途版本：


    ```

    http://www.netscape.com/download/client.download.html

    ```


    你也可以直接从 Netscape 获取两个完全授权的版本。


