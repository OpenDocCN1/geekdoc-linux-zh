    VisualClass 1


    should be added to the Xconfig file.


    # Metro X Configuration File


    # 2.4 Modes


    the last section of the Xconfig file is the Mode database (Modes). It contains
    ISA timing specifications for various resolutions. The default values work for
    graphics cards, but they can be tweaked to center the image and adjust it on the
    monitor. Most of the Metro-X servers use this database to configure graphics mode.
    The numbers indicate which clock to use from the Displayconfig file''s CLOCKS
    line, and also show the horizontal and vertical timing values. More specifically,
    an example of the numbers are:


    ```

    "1024x768" 65 1024 1092 1220 1344 768 786 791 810

    ```


    the following table shows the definition of each Modes from the prior example.


    | VALUE | Meaning |

    |---|---|

    | 1024x768 | Screen Resolution in Pixels |

    | 65 | Pixel Clock (MHz) |

    | 1024 | Pixels Displayed (H) |

    | 1092 | Sync Start (H) |

    | 1220 | Sync End (H) |

    | 1344 | Total (H) |

    | 768 | Pixels Displayed (V) |

    | 786 | Sync Start (V) |

    | 791 | Sync End (V) |

    | 810 | Total (V) |


    Figure C.3: Modes Definitions


    these numbers represent the ranges the electron beam traverses per refresh of
    the screen. They determine where the image is positioned on the screen, and what
    the refresh rate is.


    # Adjusting the Image Position


    you can edit the Modes numbers if the screen does not properly center the image.
    Be sure to center the image before stretching or shrinking it. Any adjustments
    you make will go into effect after restarting the X server.


    Centering the Image: The Pixels Displayed numbers must match the desired physical.
    The Sync Start and Sync End numbers must be increased or decreased (to move left
    or right; up or down) at the same time by the same amount, and stay within the
    range of the Displayed and Total values.


    - - Image too far right: To adjust an image that is too far to the right, increase
    the Horizontal Sync Start and Horizontal End values equally.


    - - Image too far left: To adjust an image that is too far to the left, decrease
    the Horizontal Sync Start and Horizontal End values equally. For example, to adjust
    an image that is too far to the left, you could begin the process by adding 8
    to the two horizontal timing numbers (Sync Start and Sync End). Make sure that
    the Sync End number does not exceed the Horizontal Total number.


    - - Image too low: To adjust an image that is too far to the bottom, decrease
    the Vertical Sync Start and Sync End values equally.


    - - Image too high: To adjust an image that is too far to the top, increase the
    Vertical Sync Start and Sync End values equally. For example, to adjust an image
    that is too high, you could begin the process by adding 8 to the two vertical
    timing numbers (Sync Start and Sync End). Make sure that the Sync End number does
    not exceed the Vertical Total number.


    Stretching or Shrinking the Image: The Pixels Displayed numbers must match the
    desired physical screen resolution. The Total value is increased or decreased
    to stretch or shrink the image. In addition, to center the position, the Sync
    Start and Sync End numbers must be increased or decreased, equally based on one-half
    of the changed Total value. For instance, adding 10 to the Horizontal Total value,
    you would also add 5 to the Horizontal Sync Start and 5 to the Horizontal Sync
    End value.


    - - Image too narrow horizontally: To stretch an image that is too narrow horizontally
    (extra space appears on the left and right), increase the Horizontal Sync Start
    and Horizontal End values. Total by amount x, then add one-half of x to both the
    Horizontal Sync Start and Horizontal Sync End values.


    - - Image too narrow vertically: To stretch an image that is too narrow vertically
    (extra space appears on the top and bottom), increase the Vertical Sync Start
    and Vertical Sync End values.

