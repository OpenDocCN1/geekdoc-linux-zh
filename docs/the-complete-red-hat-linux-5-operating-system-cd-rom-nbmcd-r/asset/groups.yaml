- md: '

    # New Linux


    If this is your first time using Linux (or any Linux-like operating system, for
    that matter), you''ll need solid introductory information on basic Unix concepts.
    For example, O''Reilly and Associates

    (http://www.ora.com/) produce a wide variety of Linux and Unix-related books.
    Give them more general titles a try.


    # Some Linux Experience


    If you''ve used other Linux distributions (or a Linux operating system), you''ll
    probably find what you''re looking for in more in-depth reference material available.
    Red Hat Software''s Documentation and Linux Man are great for overall documentation,
    while O''Reilly''s more specialized titles are valuable when you need a lot of
    information on particular subject.


    # Old Timer


    If you''re a long-time Red Hat Linux user, you probably don''t need us telling
    you what documentation to read. Thanks for reading this far!


    # 2.6 A Note About Kernel Drivers


    During installation of Red Hat Linux, there are some limits placed on the filesystems
    and other drivers supported by the kernel. However, after installation there is
    support for all file systems available under Linux. At install the modular kernel
    has support for (E)IDE devices (including ATAPI CD-ROM drives, SCSI adapters,
    and network cards). Additionally, all mice, SLIP, CSLIP, PPP, PLI, FPU emulation,
    console selection, ELF, SysV IPC, IP forwarding, firewalling and accounting, reverse
    ARP, QIC tape and parallel printers, are supported.


    Please Note: Because Red Hat Linux supports installation on many different types
    of hardware, many drivers (including for SCSI adapters, network cards and many
    CD-ROMs) are not built into the kernel used during installation, rather they are
    available as modules and loaded as you need them during the installation process.
    If necessary, you will have the chance to specify these modules at the time they
    are loaded, and in fact these drivers will ignore any options you you specify
    for them at the boot: prompt.


    After the installation is complete you may want to rebuild a kernel that includes
    support for your specific hardware configuration. See Section 6.1 on page 87 for
    information on building a customized kernel.


    # 7 One Last Note...


    please read all of the installation instructions before starting; this will prepare
    you any decisions you need to make and should eliminate potential surprises.


    # 3 Starting the Installation


    This chapter explains how to start the Red Hat Linux installation process. We''ll
    cover the following areas in this chapter:


    - Getting familiar with the installation program''s user interface.

    - Starting the installation program.

    - Selecting an installation method.


    By the end of this chapter, the installation program will be running on your system,
    and the appropriate installation method will have been selected.


    # The Installation Program User Interface


    The Red Hat Linux installation program uses a screen-based interface that includes
    most of the on-screen "widgets" commonly found on graphical user interfaces. You''ll
    see:


    - Windows

    - Buttons

    - Text regions (with or without scrollbars)

    - Check boxes

    - Text input boxes


    We''ll point out these features as we encounter them in the installation. Note
    that because the installation program must run on a wide variety of computers,
    the user interface is not graphical-based but is character-based. In addition,
    some computers may not have a mouse, so the installation program uses keystrokes
    for getting around.


    ### 3.1.1 Using the Keyboard to Navigate


    You can navigate around the installation dialogs using a simple set of keystrokes.
    In most dialog boxes there is a cursor or highlight which you can move around
    using arrow keys. By using Tab, and Alt+Tab, you can cycle forward backward through
    each widget on the screen. In addition, summaries of available shortcuts and function
    keys are presented at the bottom of each screen.


    To “press” a button, position the highlight over the button (using Tab) and press
    Enter. To select an item from a list of items, move the highlight to the item
    you wish to select and press Enter. To select an item by a check box, move the
    highlight to the check box and press Space. To deselect, press Space a second
    time.


    Pressing F12 accepts the current values and proceeds to the next dialog; it is
    equivalent to pressing the OK button.


    Please Note: Unless a dialog box is waiting for your input, do not press any key
    during the installation process – it may result in unpredictable behavior.


    ### 3.1.2 A Note About Consoles


    There is more to the installation program than the dialog it presents as it guides
    you through the installation. In fact, the installation program makes several
    different kinds of consoles available for viewing. These consoles can be very
    helpful if you encounter a problem while installing Linux.


    | Console | Keystroke | Contents |

    | :--- | :--- | :--- |

    | 1 | Alt-F1 | installation dialog |

    | 2 | Alt-F2 | shell prompt |

    | 3 | Alt-F3 | installation log |

    | 4 | Alt-F4 | system log |

    | 5 | Alt-F5 | other messages |


    # 2 Starting the Installation


    When it''s time to start installing Red Hat Linux. Before we start, please make
    sure have all the resources you''ll need. If you''ve already read Chapter 2, you
    should be ready.


    # 1 Booting the Installation Program


    To start the installation, insert your diskette into your computer''s diskette
    drive and reboot. After a short delay, a screen containing the boot options should
    appear. The screen contains information on a variety of options. Each boot option
    also has one or more help screens associated with it. To view a given help screen,
    press the appropriate function key as listed in the bottom of the screen.


    The initial screen will automatically start the installation program if you take
    no action within the first minute. To disable this feature, press one of the screen
    function keys:


    - If you press a help function key, there will be a slight delay as the screen
    is read from diskette.


    Normally, you''ll only need to press Enter to boot. Watch the boot messages to
    see whether the kernel detects your hardware. If it does not properly detect your
    hardware, you may need to restart the installation in "expert" mode. Expert mode
    disables most hardware probing, and gives you the option of entering options for
    the drivers loaded during the installation. Expert mode can be entered using the
    following shell prompt:


    ```

    boot: expert

    ```


    **Please Note:** The initial boot messages will not contain any references to
    SCSI network cards. These devices are supported by modules that are loaded during
    the installation process.


    Options can be passed to the kernel. For example, to instruct the kernel to use
    all the RAM in a 128 MB system, enter:


    ```

    boot: linux mem=128M

    ```


    After entering any options, press Enter to boot using those options. If you do
    need to specify boot options to identify your hardware, please make note of them
    - they will be needed later.


    **Installing Without Using a Boot Diskette** Alternately, if you have MS-DOS installed
    on your computer, you can boot the installation system directly from CD without
    using any diskettes.


    To do this, use the following commands (assuming your CD is drive d:):


    ```

    C:\> d:

    D:\> cd \dosutils

    D:\dosutils> autoboot.bat

    ```

