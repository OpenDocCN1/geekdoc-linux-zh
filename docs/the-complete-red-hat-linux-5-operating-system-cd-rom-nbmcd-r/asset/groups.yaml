    ## 1.3.5 Improved network configuration utility


    The network configuration utility netcfg has been enhanced. It now has the ability
    to clone network interfaces. Consider the following example:


    A laptop is connected to a corporate LAN most days. Sometimes, the laptop''s owner
    travels to a division of the company, and would like to use the laptop on the
    division''s LAN. In addition, at night, the laptop''s owner would like to connect
    the laptop to a LAN at home.


    In the past, this situation would have required a fair bit of effort to accommodate.
    With clone interfaces, it''s only necessary to create two clones of the original
    Ethernet interface, and give them the appropriate information. This is by selecting
    the interface to clone and pressing the clone button. After giving the clone device
    a name (such as "home"), you will see a window similar to the one in Figure 1.4.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_23_0.png)


    Figure 1.4: Clone Interface Setup


    As you can see, you can specify an alternate IP address and netmask (the network
    and broadcast addresses are calculated automatically), or use bootp or dhcp to
    configure the interface. In addition, the clone device may be configured to start
    on boot, automatically at boot time, and can be set so that any user may bring
    the interface up or down.


    ## 1.3 System Administration-Related Enhancements


    ## 1.3.6 New Diskette Group


    Red Hat Linux 5.0 also includes a group that system administrators can use to
    give certain users access to the system''s diskette drive. This can be done explicitly,
    or via the pam.env module.


    ## 1.3.7 Anti-spam changes to sendmail


    Sendmail 8.8.7 is included with Red Hat Linux 5.0. Also included are rules that
    discourage the distribution of unsolicited commercial e-mail (also known as "spam").
    These rulesets were created by Claus Aßmann. Although some information is included
    below, please consult Claus'' web page documenting his changes at:


    http://www.informatik.uni-kiel.de/~7Eca/email/check.html


    **Please Note:** In this release of Red Hat Linux, sendmail does not relay by
    default. Because of this, if your Red Hat Linux system must act as a relay, please
    review the following information.


    ### Overview


    This release has been configured to take advantage of the latest changes to send-mail
    to prevent spam by the addition of new sendmail rulesets.


    The following rulesets have been added to the S98 (local additions) section of
    /etc/sendmail.cf:


    - - junk

    - check.mail

    - check.rcpt

    - remove_local

    - * junkIP

    - check_relay


    The actions of these rulesets are controlled by the following files in the /etc/mail/
    directory:


    - * ip_allow

    - name_allow

    - relay_allow

    - deny


    Let''s take a look at each of these files.


    ### ip_allow


    This is a flat text file that contains the addresses or networks of hosts that
    are allowed to use this host as a relay.


    The format for this file is:


    ```

    hhh.hhh.hhh.hhh

    ccc.ccc.ccc

    bbb.bbb

    aaa

    ```


    These lines represent a host address, a class C network, a class B network and
    a class A network, respectively.


    ### name_allow


    This is a flat text file that contains the hostnames or domain names of hosts
    that are allowed to use this host as a relay.


    The format for this file is:


    ```

    hostname.domain.com

    domain.com

    ```


    These lines represent a hostname and a domain.


    **Please Note:** Hosts not ''included'' in either ip.allow or name.allow will
    be given an error message of "551: xxx, we do not relay" where xxx is the RCPT
    address that was given.


    ### relay.allow


    This is a flat text file that contains the hostnames, domain names, host addresses
    networks for which this machine will relay to:


    the format for this file is:


    ```

    hostname.domain.com

    domain.com

    hhh.hhh.hhh.hhh

    ccc.ccc.ccc

    bbb.bbb

    aaa

    ```


    the formats in this file are the same as for the ip.allow and name.allow files
    described earlier.


    **Please Note:** Since ip.allow, name.allow and relay.allow are plain text files,
    any changes to them will necessitate restarting sendmail. This can be accomplished
    by executing the following commands:


    ```

    /etc/rc.d/init.d/sendmail stop; /etc/rc.d/init.d/sendmail start.

    ```


    This is a flat text file that must be converted into a hash database file with
    smap(6) before use. This file contains a set of email addresses, hostnames, domain
    names, host addresses, or network addresses separated by a tab from error message.


    the format for this file is:


    ```

    user@domain.com<tab>error message 0

    hostname.domain.com<tab>error message 1

    domain.domain.com<tab>error message 2

    hhh.hhh.hhh.hhh<tab>error message 1

    ccc.ccc.ccc<tab>error message 3

    bbb.bbb<tab>error message 4

    aaa<tab>error message 5

    ```


    Each line represents the identification of a spammer. The following command can
    be used to create the hash database of this file:


    ```

    smap -v /etc/mail/deny < /etc/mail/deny > /etc/mail/deny.db

    ```


    To use the database, add the following line to /etc/sendmail.cf:


    ```

    relay = /etc/mail/deny.db

    ```


    As you can see, you can specify an alternate IP address and netmask (the network
    and broadcast addresses are calculated automatically), or use bootp or dhcp to
    configure the interface. In addition, the clone device may be configured to start
    on boot automatically at boot time, and can be set so that any user may bring
    the interface up or down.


    ## 3 System Administration-Related Enhancements


    ### 1.4.1 Modular Drivers


    In Red Hat Linux 5.0, the standard OSS drivers have been modified to be modular.
    This allows for such as loading and unloading the various drivers without recompiling
    the kernel or rebooting. The work was performed by Alan Cox and was sponsored
    by Red Hat, Inc.


    For additional information, please consult the README files in the sndconfig directory.
    The latest information can always be found at http://ftp.redhat.com/pub/sound/


    If you have any issues concerning the modular drivers, please send mail to sound-bugs@redhat.com.
    There is also a mailing list associated with the modular drivers (sound-list@redhat.com).
    To subscribe, send mail to sound-list-request@redhat.com with "subscribe" as the
    subject line.


    ### 1.4.2 Sound Configuration Tool


    Also included in Red Hat Linux 5.0 is sndconfig, a screen-oriented utility that
    can properly configure sound card drivers.


    There are a few things you should know about sndconfig:


    Plug and Play Aware – sndconfig is able to detect and configure Plug and Play
    cards such as the Sound Blaster 16 PnP. Please note, however, that the present
    version of sndconfig creates a new version of the file /etc/isapnp.conf with only
    the sound card settings uncommented. Therefore, if you have other Plug and Play
    devices on your system, you must do one of two things:


    - You can manually add your sound card''s PnP information to your existing using
    /etc/isapnp.conf, and run sndconfig using the --nprobe option.

    - You can run sndconfig without the --nprobe option, and uncomment the configuration
    information for your other PnP cards in the /etc/isapnp.conf file created by sndconfig.


    In any case, note that sndconfig saves your original /etc/isapnp.conf file as
    /etc/isapnp.conf.bak.


    **Modifies** /etc/conf.modules - sndconfig modifies the module configuration file
    /etc/conf.modules by adding information about the module options required for
    your sound card. Note that sndconfig saves your original /etc/conf.modules file
    as /etc/conf.modules.bak.


    To set up your sound card, run /usr/sbin/sndconfig.


    ### 1.4.3 Window Manager Enhancements


    Enhancements have been made to the supplied window managers and their menus.


    ### Supported Sound Cards


    At present, the following sound cards are supported:


    - Sound Blaster 1.0

    - Sound Blaster 2.0

    - Sound Blaster Pro

    - Sound Blaster 16

    - Sound Blaster 16 PnP

    - Sound Blaster AWE32/AWE64 (In SB-16 mode only)

