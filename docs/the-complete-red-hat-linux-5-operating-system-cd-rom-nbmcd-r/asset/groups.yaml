    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_153_0.png)


    Figure 9.7: Adding a Local Printer


    For remote printers, fill in the following information:


    +   * Remote Host: Hostname of the remote machine hosting the printer.

    * Remote Queue: Name of the queue to print to on the remote machine.


    The remote machine must be configured to allow the local machine to print on the
    desired queue. Typically /etc/hosts.lpd controls this.


    For SMB printers, fill in the following information:


    +   * Hostname of Printer Server: Name of the machine to which the printer you
    want to use is attached.

    * IP number of Server: The IP address of the machine to which the printer you
    want to use is attached; this is optional.

    * Printer Name: Name of the printer on which you want to print.

    * User: Name of user you must login to access the printer (typically guest for
    Windows servers, or nobody for samba servers).

    * Password: Password (if required) to use the printer (typically blank). Someone
    should be able to tell you this if you do not already know it.'
  - '[PAGE 154]


    # 3 Printer Configuration


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_154_0.png)


    Figure 9.8: Configuring a Print Filter


    Note: If you need to use a username and password for an SMB (LAN manager) print
    queue, they are stored unencrypted in a local script and must be passed on the
    command line to the smclient program. Thus, it is possible for another person
    to learn the username and password. It is therefore recommended that the username
    and password for use of the printer not be the same as that for your user account
    on the local Red Hat Linux system, so that the only possible security compromise
    would be unauthorized use of the printer. If there are file shares on your SMB
    server, it is recommended that they also use a different password than that for
    the print queue.


    After you have added your print queue, you may need to restart the printer daemon
    (lpd). To do so, choose Restart lpd from the lpd menu.


    You may print a test page for any print queue you have configured. Select the
    type of test page you would like to print from the Tests menu.'
