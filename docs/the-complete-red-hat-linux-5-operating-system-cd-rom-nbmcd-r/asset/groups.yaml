    ## 10

    ## Glint


    Hat provides a graphical tool to aid in package installation and removal. It''s
    glint (Graphical Linux INstallation Tool) and runs under the Windows system. It
    allows easy installation, uninstallation, upgrading, querying, and verification
    of packages. The interface is similar to the one found in many popular file managers
    and is simple to use.


    Operations are performed in glint by selecting the packages to operate on and
    then selecting the operation to perform via pushbuttons. Installing a package
    places all components of that package on your system. Uninstalling one removes
    components of the package except for configuration files you have modified. Upgrading
    a package installs the newly available version and uninstalls all other versions
    that were previously installed. This allows quick upgrading to the latest release
    packages.


    The query operation lets you examine the details of both installed or available
    package. You can view the description of the package, where and when it was installed,
    the files in the package, and other attributes. All of the configuration and documentation
    components of each package are clearly marked as such to reduce time you spend
    looking for them.


    The way to perform all of these operations is the same as using rpm to do them
    from the command line. However, the graphical nature of glint often makes these
    operations easier to perform.


    The normal way to handle glint is to display the available packages and files,
    selecting the ones you want to operate on, and then press a button or choose a
    menu item that performs the operation. For instance, you can install several packages
    with a few button clicks.


    ## 10.1 Starting glint


    To start glint, simply run glint & from any X terminal window. That will bring
    up a window that looks like the one in figure 10.1. Any user can use glint to
    query and verify packages, but if you need to install, uninstall, or upgrade packages
    you must run glint as root.


    There are two main parts of the glint interface. The first, on the left, allows
    you to browse and select the packages installed on your system. The right side
    contains buttons that manipulate the selected packages.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_165_0.png)


    Figure 10.1: Main Glint Window


    ## 10.2 The Package Display


    Each folder icon in glint represents a group of packages. Each group can contain
    other groups, which allows for flexible locations of packages. Groups are used
    to organize packages that perform similar functions in similar locations. For
    example, Applications includes many application programs such as editors and spreadsheets.
    Most of the text based ones appear in the "Applications" group. Inside of that
    group, there is other grouping for all of the editors that are shipped.


    By convention, groups are written in the same way as UNIX paths. The topmost group
    is written first, and subsequent groups follow with a slash separating the names.
    This means that an X-based drawing program appears in the /Applications/Graphics
    group.


    To view the packages and subgroups within a group, double click the left mouse
    button on a group''s folder icon. The window changes to show what that package
    contains. The top line of the package display shows which group you''re currently
    looking in, as well as the groups leading to the current one. To return to the
    previous group you were looking at, double click the "Back" folder, which is in
    the upper left hand corner of the folder area (though it often gets scrolled away).


    If you''d like to examine a subgroup in a new window, double click the middle
    mouse button on its folder. If your mouse has only two buttons, click both. This
    will create a new window with that group in it.


    ### 2.1 Context Sensitive Menus


    Pressing the right mouse button on any icon in the package window brings up a
    small, context sensitive menu. The exact items it contains depends on exactly
    where you press it. They all contain options to select or deselect the item, and
    will let you install, uninstall, query, upgrade, or verify the item. There''s
    more information on how to do these.


    Choose an item from a context sensitive menu, press and hold the right button.
    While still holding the right, move the mouse over the item you''d like (which
    will then highlighted). To select an item, click the left button and make the
    menu disappear.


    ### 2.2 Selecting Packages


    Select a single package, click the left button on it. You''ll notice a thin border
    appear around the package''s icon which shows it''s selected. To unselect it,
    click the left button and the border will disappear. The number of packages currently
    selected is always displayed at the bottom of the window. A group''s folder icon
    shows the number of packages inside that have been selected.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_167_0.png)


    Figure 10.2: Selecting Packages


    The context sensitive menu for a group also allows easy selection and unselection
    of all packages in that group. Using these menu options makes selecting groups
    of packages much quicker than selecting each package individually.


    ### 10.2.3 Viewing Available Packages


    To see what packages are available for you to install, choose the Available button
    from any glint window. After a few moments, a new window, like the one shown in
    figure 10.3, will appear. The differences in the title and buttons indicate that
    this window is listing packages you may install. Navigating through these packages
    and selecting them is the same as in the other glint windows.


    If you get an error message from glint saying that it can''t find any RPMs, see
    the section below on Configuration.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_168_0.png)


    Figure 10.3: Available Window


    ## 3 Configuration


    The only configuration information glint needs is the path to new RPMs. When using
    your Red Hat Linux CD-ROM, this will probably be /mnt/cdrom/RedHat/RPMS, which
    is the default path for glint. If you download RPMs from the Internet or want
    to install RPMs via a mounted CD-ROM, the path will be different for you.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_168_1.png)


    Figure 10.4: Configuration Window


    To change this path, first be sure to close all of the windows listing available
    packages you may have open. Then choose the Configuration option from one of remaining
    windows. This will open a dialog box like the one shown in 4. Here you can type
    the full path to the RPMs you''d like to look at. Choosing Save button will save
    this path, making it the default for future glint sessions. The Default button
    restores the path to the one that glint used when it started.

