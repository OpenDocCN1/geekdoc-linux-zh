    ## 11

    ## System Administration


    This chapter is an overview of the Red Hat Linux system. It will illustrate things
    at you may not know about the system and things that are somewhat different from
    other UNIX systems. Note that most system administration task are performed with
    the control-panel, which is covered in chapter 9.


    ### 1.1 Filesystem Structure


    Red Hat Software is committed to the Linux File System Standard, a collaborative
    document that defines the names and locations of many files and directories. We''ll
    continue to track the standard to keep Red Hat compliant.


    Compliance with the standard means many things, the two most important are compatibility
    with other compliant systems, and the ability to mount the /usr partition read-only.
    The /usr partition contains common executables and is not meant to be changed
    by users. Because of this, the /usr partition can be mounted from the CD-ROM or
    from another machine via read-only NFS. The current Linux Filesystem Standard
    (FSTND) document is the authoritative reference for any FSSTND compliant filesystem,
    but the standard leaves many areas undefined or extensible.


    In this section we provide an overview of the standard and a description of the
    parts of the filesystem not covered by the standard.


    The complete standard can be viewed at:


    ```

    http://www.pathname.com/fhs/

    ```


    ### 11.1.1 Overview of the FSSTND


    The directories and files noted here are a small subset of those specified by
    the FSSTND document. Check the latest FSSTND document for the most up to date
    and complete information.


    ### The /etc Directory


    The /etc directory is reserved for configuration files that are local to your
    machine. No binaries are to be put in /etc. Binaries that were in the past put
    in /etc should now go into /sbin or possibly /bin.


    The X11 and skel directories should be subdirectories of /etc:


    ```

    /etc

    |- X11

    +- skel

    ```


    The X11 directory is for X11 configuration files such as XF86Config. The skel
    directory is for "skeleton" user files, which are files used to populate a home
    directory when a user is first created.


    ### The /lib Directory


    The /lib directory should contain only those libraries that need to execute the
    binaries in /bin and /sbin.


    ### 1.1 Filesystem Structure


    #### /sbin Directory

    /sbin directory is for executables used only by the root user, and only those
    execut needed to boot and mount /usr and perform system recovery operations. The
    FSSTND says:


    > "/sbin typically contains files essential for booting the system in addition
    to the binaries in /bin. Anything executed after /usr is known to be mounted (when
    there are no problems) should be placed in /usr/sbin. Local-only system administration
    binaries should be placed into /usr/local/sbin."


    At a minimum, the following programs should be in /sbin:


    clock, getty, init, update, mkswap, swapon, swapoff, halt, reboot, shutdown, fdisk,
    fsck.*, mkfs.*, lilo, arp, ifconfig, route


    #### /usr Directory

    /usr directory is for files that are shareable across a whole site. The /usr directory
    usually has its own partition, and it should be mounted read-only. The following
    directories should be subdirectories of /usr:


    - X11R6

    - bin

    - dict

    - doc

    - etc

    - games

    - include

    - info

    - lib

    - local

    - man

    - sbin

    ```

    |- share

    +- src

    ```


    The X11R6 directory is for the X Window System (XFree86 on Red Hat Linux), bin
    is for executables, doc is for random non-man-page documentation, etc is for site-wide
    configuration files, include is for C header files, info is for GNU info, lib
    is for libraries, man is for man pages, sbin is for system administration binaries
    (those that do not belong in /sbin), and src is for source code.


    ### The /usr/local Directory


    The FSSTND says:


    > "/usr/local hierarchy is for use by the system administrator when installing
    software locally. It needs to be safe from being overwritten when the system software
    is updated. It may be used for programs and data that are shareable amongst a
    group of machines, but not found in /usr."


    The /usr/local directory is similar in structure to the /usr directory. It has
    the following subdirectories, which are similar in purpose to those in /usr directory:


    ```

    /usr/local

    |- bin

    |- doc

    |- games

    |- include

    |- info

    |- lib

    |- man

    |- sbin

    |- src

    ```


    ### 1.1 Filesystem Structure


    #### /var directory

    Since FSSTND requires that you be able to mount /usr read-only, any programs that
    write log files or need spool or lock directories should write them to the /var
    directory. FSSTND says /var is for variable data, which includes spool directories,
    administrative data, and transient files.


    The following directories should be subdirectories of /var:


    - log

    - catman

    - lib

    - local

    - named

    - run

    - tmp

    - cron

    - lpd

    - mail

    - queue

    - uucp

    - news


    log files such as wtmp and lastlog go in /var/log. The /var/lib directory also
    contains databases. Man pages go in /var/man, and lock files go in /var/lock.
    The /var/spool directory has subdirectories for various systems that need to store
    data.


    ### 11.1.2 /usr/local in Red Hat Linux


    Red Hat Linux, the intended use for /usr/local is slightly different from that
    specified by the FSSTND. FSSTND says that /usr/local should remain safe from system
    upgrades. Instead, we recommend you use /usr/local for software that is local
    to your machine. For instance, let''s say you have mounted /usr/local via read-only
    NFS, but you are not allowed to write to it. Later, if you''ve managed to install
    a program under /usr, you can uninstall it from /usr.


    ### 11.2 Special Red Hat File Locations


    In addition to the files that reside in /var/lib/rpm (see chapter 8), there are
    two other special locations for Red Hat Linux configuration and operation. The
    control-panel and related tools put lots of stuff here that you would want to
    edit. It is mostly small scripts and text files. The other location, /etc/sysconfig,
    stores configuration information. The major files in this directory are scripts
    that run at boot time. It is possible to edit these by hand, but would be better
    to use the proper control-panel tool.


    ### 11.3 Users, Groups and User-Private Groups


    Managing users and groups has traditionally been tedious. Red Hat Linux has a
    few tools and conventions that make user and groups easier to manage, and more
    useful. The easiest way to manage users and groups is through the Users and Groups
    module of the control-panel (see section 9 for details on the control-panel and
    security). You can also use adduser to create a new user from the command line.


    ### 11.3.1 Standard Users


    11.3.1 lists the standard users set up by the installation process (this is the
    /etc/passwd file). The group ID (GID) in this table is the primary group of the
    user. See section 11.3.3 for details on how groups are used.


