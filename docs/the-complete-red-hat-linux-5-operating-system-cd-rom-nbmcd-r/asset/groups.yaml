    # 9 控制面板


    控制面板是许多不同管理工具的启动平台。它们允许你配置各项，而无需记忆配置文件的格式和复杂的命令行选项，从而让你的生活变得更加轻松。


    要启动控制面板，请以 root 身份通过 startx 启动 X Window 系统，并在 xterm 中输入 `control-panel`。你需要成功运行
    `control-panel` 工具。你可以像已经作为普通用户运行 X 一样进行操作：只需输入 `su -c control-panel` 并在提示时输入
    root 密码。如果你计划以 root 身份执行其他任务，可以输入 `su -` 并在提示时输入 root 密码。你将获得一个 root  shell。在这里，你需要输入
    `DISPLAY=:0 control-panel &` 来让控制面板工作。“DISPLAY”部分告诉控制面板使用你的显示器。此语法仅适用于兼容 Bourne
    的 shell bash。如果你运行的是 tcsh，则输入 `setenv DISPLAY=:0; control-panel &`。


    双击图标可启动工具。请注意：


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_144_0.png)


    # 控制面板


    图 9.1 所示的工具并没有阻止用户启动任何工具的两个实例，但这样做是非常糟糕的主意，因为你可能会尝试在两个地方编辑同一个文件，从而覆盖你自己的更改。如果不小心启动了工具的第二个副本，应该立即退出它。此外，在工具运行时，不要手动编辑由控制面板工具管理的任何文件。同样，在工具运行时，不要运行任何可能更改这些文件的其他程序。


    # 9.1 用户和组配置


    图 9.1 所示的工具管理你系统上的用户和组。从某种意义上说，它是 /etc/passwd 和 /etc/group 的图形编辑器，如果你启用了影子密码，还包括
    /etc/shadow。通过此工具，你可以添加和删除用户及组，设置登录 shell、全名、主目录、uid、gid 等。


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_145_0.png)


    图 9.1：用户和组配置面板


    # 9.1.1 添加或编辑用户


    相同的界面也用于添加和编辑用户。要添加用户，点击主窗口中的 Add（添加）按钮。会弹出一个类似于图 9.2 所示的对话框，用于输入用户名，并已填充了一些默认值。要编辑现有用户，双击主窗口中的用户，或者点击用户后再点击
    View/Edit（查看/编辑）按钮。


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_146_0.png)


    图 9.2：添加用户对话框


    这并不是用户的名和姓；它是它登录系统时使用的 ID。不要包含任何空格或冒号，且输入长度不要超过 8 个字符。完成后按回车键，大多数其他字段将将用默认值填充。你可以根据需要更改它们，但并非必要。你可以根据选择输入用户的全名、办公室和电话号码。登录
    shell 可以通过从下拉菜单中选择更改默认的 /bin/bash，或者像其他字段一样直接输入它。


    你需要对密码进行处理。Password（密码）菜单上有五个选项：Original（原始密码）、Change（更改）、No Password（无密码）、Lock（锁定）和
    Unlock（解锁）。如果你想更改密码，选择 Change。如果你想移除密码，选择 No Password。如果你想禁用账户，选择 Lock。如果你想启用账户，选择
    Unlock。如果你想保留当前密码，选择 Original。


    如果你想删除用户，在主窗口中选择该用户并点击 Remove（删除）。你将看到图 9.3 所示的对话框，其中你可以采取三种类型的操作。你可以忽略用户的主目录并保持原样，可以将其存档并压缩成
    .tar.gz 文件，或者根据你的意愿删除用户的邮件池。这两个操作将在删除后立即执行，在要求更多输入之前完成。你可以搜索文件系统中主目录以外的部分属于该用户的文件并授予权限。如果你选择搜索该用户的文件，可以将错误报告发送给
    root。这是因为搜索将在后台进行；可能会花费很长时间。要查找属于 nobody 的文件，执行以下命令：


    ```

    find / (-group nobody -o -user nobody \) -print

    ```


    有时只想临时移除用户，并打算以后恢复。Lock 和 Unlock 函数可以处理这个问题。当你激活用户时，密码会在前面加一个 * 号被锁定，防止用户登录。你还可以选择用
    tar 和 gzip 压缩主目录，这可以节省空间。当你停用用户时，密码锁定将被移除；如果主目录被压缩，它将恢复正常。当你锁定用户时，你会看到与删除用户相同的选项，但通常不需要删除任何文件。


    # 9.1.2 删除用户


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_147_0.png)


    图 9.3：删除用户框


    # 1.3 创建新组


    要创建新组，通过选择主窗口顶部的 Groups（组）切换到组编辑。点击 Add 会弹出一个对话框来指定组详情。为新组输入一个名称。和用户名一样，组名不应包含空格或冒号，且长度不超过
    8 个字符。你可以设置组密码；如果设置了，不是组成员的用户可以使用 newgrp 程序并提供密码来假设该组身份。要向组添加成员，请在用户列表字段中输入他们的姓名。选完所有组成员后，点击
    Done（完成）。


