- md: "\nNow you must update /etc/lilo.conf. If you built a new initrd image you must\
    \ tell LILO to use it. In this example of /etc/lilo.conf we have added four lines\
    \ at the bottom of the file to indicate another kernel to boot from. We have renamed\
    \ /boot/vmlinuz to /boot/vmlinuz.old and changed its label to old. We have also\
    \ added an initrd line for the new kernel:\n\n```\nboot=/dev/hda\nmap=/boot/map\n\
    install=/boot/boot.b\nprompt\ntimeout=100\nimage=/boot/vmlinuz\n    label=linux\n\
    \    initrd=/boot/initrd\n    root=/dev/hda\n    read-only\nimage=/boot/vmlinuz.old\n\
    \    label=old\n    root=/dev/hda\n    read-only\n```\n\nNow when the system boots\
    \ and you press Tab at the LILO boot: prompt two choices will be shown:\n\n- LILO\
    \ boot:\n  linux old\n\nTo boot the new kernel (linux) simply press Enter, or\
    \ wait for LILO to time out. If you want to boot the old kernel (old), simply\
    \ enter old and press Enter.\n\nHere is a summary of the steps:\n\n- mv /boot/vmlinuz\
    \ /boot/vmlinuz.old\n- cp /usr/src/linux/arch/i386/boot/zImage /boot/vmlinuz\n\
    - edit /etc/lilo.conf\n- run /sbin/lilo\n\nYou can begin testing your new kernel\
    \ by rebooting your computer and watching the messages to ensure your hardware\
    \ is detected properly.\n\n## 6.1 Building a Custom Kernel\n\n### 6.1.2 Making\
    \ an initrd image\n\nAn initrd image is needed for loading your SCSI module at\
    \ boot time. The shell /sbin/mkinitrd can build a proper initrd image for your\
    \ machine if the following conditions are met:\n\n- The loopback block device\
    \ is available.\n- The /etc/conf.modules file has a line for your SCSI adapter;\
    \ for example:\n  - alias scsi_hostadapter BusLogic\n\nTo build the new initrd\
    \ image, run /sbin/mkinitrd with parameters such as this:\n\n```\n/sbin/mkinitrd\
    \ /boot/newinitrd-image 2.0.12\n```\n\nwhere /boot/newinitrd-image is the file\
    \ to use for your new image, and 2.0.12 is the kernel whose modules (from /lib/modules)\
    \ should be used in the initrd image (not necessarily the same as the version\
    \ number of the currently running kernel).\n\n### 6.1.3 Building a monolithic\
    \ kernel\n\nTo build a monolithic kernel you follow the same steps as building\
    \ a modularized kernel with a few exceptions.\n\n- When configuring the kernel\
    \ only answer Yes and No to the questions (don't make anything modular).\n- Omit\
    \ the steps:\n  - make modules\n  - make modules_install\n- Edit the file /etc/rc.d/rc.sysinit\
    \ and comment out the line depmod -a by inserting a \"#\" at the beginning of\
    \ the line.\n\n## 6.2 X Window Configuration with XFree86\n\nThere are four methods\
    \ for configuring XFree86 on your machine:\n\n- Xconfigurator\n- XF86Setup\n-\
    \ xf86config\n- by hand\n\nXconfigurator, XF86Setup, and xf86config are functional\
    \ equivalents and should work equally well. If you are unsure of anything in this\
    \ process, a good source of additional documentation is:\n\nhttp://www.xfree86.org\n\
    \nXconfigurator is a full-screen menu driven program that walks you through setting\
    \ up your X server. XF86Setup is a graphical setup program distributed with XFree86\
    \ which requires the VGA 16-color server in order to run. xf86config is a line\
    \ oriented program distributed with XFree86. It isn't as easy to use as Xconfigurator,\
    \ but it is included for completeness. If these utilities fail to provide a working\
    \ XF86config file, you may have an unsupported card or you may need to write the\
    \ config file by hand. Usually the former is the case, so check and make sure\
    \ your card is supported before attempting to write the config file yourself.\
    \ If your card is not supported by XFree86 you may wish to consider a commercial\
    \ X server, such as the Metro-X server which accompanies Red Hat Linux/Intel.\
    \ If you have questions about whether or not your video card is supported you\
    \ can check out http://www.xfree86.org for information on XFree86, and http://www.metrolink.com\
    \ for information on Metro-X.\n\n### 6.2.1 The X Server\n\nProvided you selected\
    \ the proper video card at install time, you should have the proper X server installed.\
    \ When later running Xconfigurator or xf86config, you need to make sure you select\
    \ the same video card or the autoprobe will fail.\n\nIf you think you installed\
    \ the wrong X server for your video card, you will have to install the correct\
    \ one before it can be configured. For instance, if the CD is mounted on /mnt/cdrom,\
    \ and you need to install the S3 server, enter the following commands:\n\n```\n\
    cd /mnt/cdrom/RedHat/RPMS\nrpm -ivh XFree86-S3-3.1.2-1.i386.rpm\nln -sf ../usr/X11R6/bin/X86_S3\
    \ /etc/X11/X\n```\n\nThis will install the S3 server and make the proper symbolic\
    \ link.\n\n### 6.2.2 Xconfigurator\n\nTo configure X you must first select your\
    \ video card. Scroll down the list of supported cards until you locate the card\
    \ in your machine. Section 6.2.2 may help you determine the video server that\
    \ matches your hardware. If your card is not listed it may not be supported by\
    \ XFree86. In this case you can try the last card entry on the list (Unlisted\
    \ Card) or a commercial X Windows server, such as Metro- .\n\nThe next step is\
    \ to select your monitor. If your monitor is not listed you can select one of\
    \ the generic monitor entries or \"Custom\" and enter your own parameters. Custom\
    \ monitor configuration is recommended only for those who have a sound understanding\
    \ of the inner workings of CRT displays. The average user probably uses one of\
    \ the generic selections from the list. After selecting a monitor you need to\
    \ tell Xconfigurator how much video memory you have. Move the highlight to the\
    \ appropriate list entry and press Enter or F12 to continue. For the next step\
    \ it is recommended that you select the video modes you want.\n\nIf you are unsure\
    \ about whether or not your video card is supported you can check out http://www.xfree86.org\
    \ for information on XFree86, and http://www.metrolink.com for information on\
    \ Metro-X.\n\n## 6.3 X Window Configuration with Metro-X\n\nBy special arrangement,\
    \ a license to install a single copy of the Metro-X server is included with the\
    \ Red Hat Linux/Intel. Please note that, unlike the XFree86 server (also included),\
    \ Metro-X is commercially licensed software. Metro-X supports many video cards\
    \ that are not supported by XFree86. The configuration utility can be run in graphical\
    \ mode (configX) or text mode (configX.curses).\n\n### 3.1 System Requirements\n\
    \n8 megabytes of RAM minimum; 16 megabytes are recommended. The base server requires\
    \ 12 megabytes of disk space.\n\n### 3.2 configX.curses\n\nconfigX.curses is a\
    \ simple graphical tool for configuring Metro- The configX.curses utility does\
    \ not provide support for configuring multiple screens or choosing the number\
    \ of buttons on your mouse. If you need these features use configX. To run configX.curses\
    \ type the command:\n\n```\nconfigX.curses\n```\n\nThe opening screen has information\
    \ on Metro Link, Inc. and brief instructions on how to configure Metro-X. Press\
    \ the Enter key to begin the configuration. The screen will display the current\
    \ configuration information at the top and the configuration menu at the bottom.\
    \ Use the arrow keys to move the highlight and down the menu and the Enter key\
    \ to select the highlighted item.\n\n#### Graphics Card\n\nWhen you select Graphics\
    \ Card from the configuration menu, a list of supported cards will be displayed.\
    \ Select your video card as above. After selecting your video you will be asked\
    \ to select a video mode from a list of defaults. The resolution is a matter of\
    \ personal preference. The smaller the numbers are the larger the on the display\
    \ will be. Some combinations of video cards and video modes support virtual screens\
    \ larger than the physical display. If your combination is one these you will\
    \ be asked to select the virtual screen size.\n\n#### Mouse\n\nConfiguring your\
    \ mouse with Metro-X requires that you know what type of mouse you have and how\
    \ it is connected to your computer. When you select a mouse type the default device\
    \ will be provided in the configuration window. If you are in doubt accept the\
    \ default and make adjustments later if needed.\n"
  mdcn: "\n现在你必须更新 `/etc/lilo.conf`。如果你构建了新的 initrd 镜像，你必须告诉 LILO 使用它。在这个 `/etc/lilo.conf`\
    \ 的示例中，我们在文件末尾添加了四行，以指示另一个要启动的内核。我们将 `/boot/vmlinuz` 重命名为 `/boot/vmlinuz.old`\
    \ 并将其标签（label）改为 old。我们还为新内核添加了 initrd 行：\n\n```\nboot=/dev/hda\nmap=/boot/map\n\
    install=/boot/boot.b\nprompt\ntimeout=100\nimage=/boot/vmlinuz\n    label=linux\n\
    \    initrd=/boot/initrd\n    root=/dev/hda\n    read-only\nimage=/boot/vmlinuz.old\n\
    \    label=old\n    root=/dev/hda\n    read-only\n```\n\n现在当系统启动你在 LILO 启动界面按下\
    \ Tab 键时，将显示 prompt: 两个选择：\n\n- LILO boot:\n  linux old\n\n要启动新内核 (linux)，只需按\
    \ Enter 键，或等待 LILO 超时。如果你想启动旧内核 (old)，只需输入 old 并按 Enter 键。\n\n以下是步骤总结：\n\n- mv\
    \ /boot/vmlinuz /boot/vmlinuz.old\n- cp /usr/src/linux/arch/i386/boot/zImage /boot/vmlinuz\n\
    - edit /etc/lilo.conf\n- run /sbin/lilo\n\n你可以通过重启电脑并观察信息来测试你的新内核，以确保硬件被正确检测。\n\
    \n## 6.1 构建自定义内核\n\n### 6.1.2 生成 initrd 镜像\n\n启动时需要 initrd 镜像加载 SCSI 模块。如果满足以下条件，脚本\
    \ `/sbin/mkinitrd` 可以为你的机器构建正确的 initrd 镜像：\n\n- 回环块设备可用。\n- `/etc/conf.modules`\
    \ 文件中有一行对应 SCSI 适配器的配置；例如：\n  - alias scsi_hostadapter BusLogic\n\n要构建新的 initrd\
    \ 镜像，运行带有如下参数的 `/sbin/mkinitrd`：\n\n```\n/sbin/mkinitrd /boot/newinitrd-image\
    \ 2.0.12\n```\n\n其中 `/boot/newinitrd-image` 是用于新镜像的文件，`2.0.12` 是 initrd 镜像中使用的内核模块（来自\
    \ `/lib/modules`）对应的内核（不一定与当前运行内核的版本相同）。\n\n### 6.1.3 构建单体内核\n\n构建单体内核时你遵循与构建模块化内核相同的步骤，但有少数例外。\n\
    \n- 在配置内核时，仅对问题回答 Yes 或 No（不要将任何内容模块化）。\n- 忽略以下步骤：\n  - make modules\n  - make\
    \ modules_install\n- 编辑 `/etc/rc.d/rc.sysinit` 文件，通过在行首插入 `#` 来注释掉 `depmod -a`\
    \ 行。\n\n## 6.2 使用 XFree86 配置 X Window\n\n有四种方法可以在你的机器上配置 XFree86：\n\n- Xconfigurator\n\
    - XF86Setup\n- xf86config\n- 手动配置\n\nXconfigurator、XF86Setup 和 xf86config 功能上等效，且工作效果同样良好。如果你对此过程中的任何内容不确定，获取额外文档的一个良好来源是：\n\
    \nhttp://www.xfree86.org\n\nXconfigurator 是一个全屏菜单驱动程序，引导你设置 X 服务器。XF86Setup 是随\
    \ XFree86 分发的图形化设置程序，它需要 VGA 16 色服务器才能运行。xf86config 是随 XFree86 分发的命令行程序。它不像 Xconfigurator\
    \ 那么易用，但为了完整性被包含在内。如果这些工具无法提供可用的 XF86config 文件，你可能使用的是不支持的显卡，或者你可能需要手动编写配置文件。通常是前者，因此在尝试自己写配置文件之前，请检查并确保你的显卡受支持。如果你的显卡不支持\
    \ XFree86，你可能希望考虑商业级 X 服务器，例如随 Red Hat Linux/Intel 附带的 Metro-X 服务器。如果你对显卡是否支持疑问，可以访问\
    \ http://www.xfree86.org 获取有关 XFree86 的信息，访问 http://www.metrolink.com 获取有关 Metro-X\
    \ 的信息。\n\n### 6.2.1 X 服务器\n\n只要你在安装时选择了正确的显卡，你就已经安装了正确的 X 服务器。稍后运行 Xconfigurator\
    \ 或 xf86config 时，你需要确保选择相同的显卡，否则自动探测（autoprobe）将失败。\n\n如果你认为你为显卡安装了错误的 X 服务器，你必须在配置之前安装正确的。例如，如果\
    \ CD 挂载在 `/mnt/cdrom`，且你需要安装 S3 服务器，输入以下命令：\n\n```\ncd /mnt/cdrom/RedHat/RPMS\n\
    rpm -ivh XFree86-S3-3.1.2-1.i386.rpm\nln -sf ../usr/X11R6/bin/X86_S3 /etc/X11/X\n\
