    # 2 Metro X 配置文件


    BackingStore 这关闭后台存储（backing store）。后台存储是一个服务器功能，允许程序创建复杂的图形并让服务器自动处理显示请求，防止长时间的重绘周期。它使用系统内存来保存窗口内容，如果内存有限可能会减慢系统。


    CursorWrap 在多屏幕配置中，此设置防止光标从屏幕 1 绕回到 0。


    FontCache 此设置关闭字体缓存。


    Keyboard 此设置禁用键盘输入。


    LEDs PixmapCache 这关闭位图和点纹缓存。


    PrimaryMonitor 对于虚拟终端支持不进行控制台处理。这通常用于 X 运行在未驱动唯一显示器的显卡上。


    option <string> 这指定传递给服务器的特殊选项。它可能会指定显卡型号或通常不使用的特定功能。通常 configX 解析 Xconfig 文件中正确的选项。


    option HardwarePex 向 Xconfig 文件添加此行，以便 Matrox MGA Impression Plus 显卡使用硬件 Z fer。此文件条目必须紧跟
    Driver MGA 条目。


    option NoHardwareCursor 添加此行以禁用硬件光标支持。此文件条目必须紧跟 Driver 条目。


    mapCursorPad 此配置导致 X 服务器对键盘方向键和光标板方向键发送不同的返回代码。这是对协议的轻微偏，但允许区分这些按键。


    ffFormat <number> <number> <number> Metro-X X11.5 可以读取 X11.4 F（服务器自然格式）字体。由于 SNF
    字体没有标准，可以调整以下四个数字来读取大多数 SNF 字体。这四个数字参数代表以下值，通常在编译时构建到服务器中：


    ```

    BITMAP_BIT_ORDER

    IMAGE_BYTE_ORDER

    GLYPHADBYTES

    ```


    # BITMAP_SCANLINE_UNIT


    例如，要读取 SCO SNF 字体，向 Xconfig 文件添加此行：


    SnfFormat 1 0 1 1


    或者，要读取与 Interactive Systems Corporate 的 X11 R4 兼容的 SNF 字体，向 Xconfig 文件添加此行：


    SnfFormat 1 1 4 4


    Terminate导致最后一个客户端断开连接时服务器退出。通常 xinit 在最后一个客户端断开连接、服务器重置之前杀死 X 服务器。


    Trace <number> 这打印额外的调试信息。


    VideoRam <number> 这指定显卡上的显存量，以 1024 字节为单位指定（1 MB 等于值 1024）。X 服务器通常会检测显卡上有多少内存。


    VisualClass <number> 使用来自 /usr/include/X11/X.h 的默认 VisualClass，基于下表：


    | VISUAL CLASS | NUMBER |

    |---|---|

    | StaticGray | 0 |

    | GrayScale | 1 |

    | StaticColor | 2 |

    | PseudoColor | 3 |

    | TrueColor | 4 |

    | DirectColor | 5 |


    图 C.2: Visual Classes


    在单色显示器上，应该将行


    VisualClass 1


    添加到 Xconfig 文件中。


    # Metro X 配置文件


    # 2.4 模式


    Xconfig 文件的最后一部分是 Mode 数据库（Modes）。它包含了各种分辨率的 ISA 计时规范。默认值适用于显卡，但可以进行微调以使图像居中并在显示器上调整。大多数
    Metro-X 服务器使用此数据库来配置图形模式。数字表示使用 Displayconfig 文件中 CLOCKS 行的哪个时钟，并显示水平和垂直计时值。具体来说，数字的示例为：


    ```

    "1024x768" 65 1024 1092 1220 1344 768 786 791 810

    ```


    下表显示了之前示例中每个 Modes 的定义。


    | VALUE | Meaning |

    |---|---|

    | 1024x768 | 像素屏幕分辨率 |

    | 65 | 像素时钟 (MHz) |

    | 1024 | 显示像素 (H) |

    | 1092 | 同步开始 (H) |

    | 1220 | 同步结束 (H) |

    | 1344 | 总计 (H) |

    | 768 | 显示像素 (V) |

    | 786 | 同步开始 (V) |

    | 791 | 同步结束 (V) |

    | 810 | 总计 (V) |


    图 C.3: Modes 定义


    这些数字代表电子束在每次屏幕刷新时扫过的范围。它们决定了图像在屏幕上的位置，以及刷新率。


    # 调整图像位置


    如果屏幕未能将图像正确居中，你可以编辑 Modes 数字。在拉伸或缩小图像之前，请确保图像已居中。你所做的任何调整将在重启 X 服务器后生效。


    居中图像：Pixels Displayed 数字必须与所需的物理值匹配。Sync Start 和 Sync End 数字必须同时以相同的量增加或减少（以向左或向右；向上或向下），并保持在
    Displayed 和 Total 的范围内。


    - - 图像太右：要调整太右的图像，等量增加 Horizontal Sync Start 和 End 值。


    - - 图像太左：要调整太左的图像，等量减少 Horizontal Sync Start 和 End 值。例如，要调整太靠左的图像，可以从向两个水平计时数字（Sync
    Start 和 Sync End）增加 8 开始。确保 Sync End 数字不会超过 Horizontal Total 数字。


    - - 图像太低：要调整太靠下的图像，等量减少 Vertical Sync Start 和 End 值。


    - - 图像太高：要调整太靠上的图像，等量增加 Vertical Sync Start 和 End 值。例如，要调整太靠上的图像，可以从向两个垂直计时数字（Sync
    Start 和 Sync End）增加 8 开始。确保 Sync End 数字不会超过 Vertical Total 数字。


    拉伸或缩小图像：Pixels Displayed 数字必须与所需的物理屏幕分辨率匹配。通过增加或减少 Total 值来拉伸或缩小图像。此外，为了居中位置，Sync
    Start 和 Sync End 数字必须根据变化的 Total 值的一半等量增加或减少。例如，如果 Horizontal Total 增加了 10，则你对
    Horizontal Sync Start 和 Horizontal Sync End 各增加 5。


    - - 图像水平太窄：要拉伸水平太窄的图像（两侧出现额外空间），增加 Horizontal Sync Start 和 End 值。总计增加 x，然后对 Horizontal
    Sync Start 和 Horizontal Sync End 各增加 x 的一半。


    - - 图像垂直太窄：要拉伸垂直太窄的图像（顶部和底部出现额外空间），增加 Vertical Sync Start 和 End 值。


