    ## 5.3.1 Network Configuration Dialogs


    If you elected to configure networking at this time, you will be presented with
    a series of dialog boxes. Please turn to Section 3.4.6 on page 43 for more information.


    ## 5.4 Configuring the Clock


    Next, the installation program presents a dialog to help you configure your Red
    Hat Linux system''s timezone (see Figure 5.2 on the facing page).


    If you wish to set the hardware (CMOS) clock to GMT (Greenwich Mean Time, also
    known as UTC, or Coordinated Universal Time), select Hardware clock set to GMT.
    Setting your hardware clock to GMT means your Red Hat Linux system will properly
    handle daylight savings time, if your timezone uses it. Most networks use GMT.


    Select the timezone your system will be operating in, the list, and press Enter.


    If you wish to change your timezone configuration after you have booted your Red
    Hat Linux system, you may use the /usr/sbin/timeconfig command.


    ## 5.5 Selecting Services for Start on Reboot


    Next you''ll see a dialog box entitled “Services” (see Figure 5.3 on page 76).
    Display in this box is a list of services with a check box by each. Scroll through
    this list, and check every service that you would like automatically started every
    time your Red Hat Linux system boots. If you''re not sure what a particular service
    is, move the highlight to it and press F1. You''ll then get a brief description
    of the service.


    Note that you can run /usr/sbin/ntysysvr or /sbin/sbin/chkconfig after the installation
    to change which services automatically start on reboot.


    ## 5.6 Configuring a Printer


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_90_0.png)

    Figure 5.2: Configuring Timezones


    After you have set up networking, the installation program asks whether you would
    like to configure a printer. If you choose Yes, a dialog box will ask you to indicate
    how the printer is connected to your computer (see Figure 5.4 on page 77).


    Here is a brief description of the three types of printer connections available:


    - **Local – lpd** – This printer is directly connected to your computer.

    - **Remote lpd** – This printer is connected to your local area network (either
    through another computer, or directly), and is capable of communicating via 1lpr/lpd.

    - **LAN Manager** – This printer is connected to another computer which shares
    the printer via LAN Manager (or SMB) networking.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_91_0.png)

    Figure 5.3: Selecting Services


    After selecting a printer type, you''ll be presented with a dialog box titled
    “Standard Printer Options” (see Figure 5.5 on page 78). Enter the name of the
    queue and the spool directory you''d like to use, or accept the default information.


    The dialog box you''ll see next depends on the printer connection type you selected.
    Turn to the section that corresponds to your printer connection type:


    - **Local** – Section 5.6.1.

    - **Remote – lpd** – Section 5.6.2 on the next page.

    - **LAN Manager** – Section 5.6.3 on the facing page.


    ## 5.6.1 Locally Attached Printers


    If you select “Local” as your printer’s connection type, you''ll see a dialog
    box similar to the one in Figure 5.6 on page 79.


    Enter the printer device name in the field provided. As a convenience, the installation
    program attempts to determine which printer ports are available on your computer.
    Select Next, and press Space. Now turn to Section 5.6.4 on page 78 to continue.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_92_0.png)


    ## 5.6.2 Remote lpd Printers


    If you selected "Remote lpd" as your printer’s connection type, you’ll see a dialog
    box similar to the one in Figure 5.7 on page 80.


    Enter the name of the computer to which the printer is directly connected in the
    "Remote hostname" field. The name of the queue on the remote computer that is
    associated with the remote printer goes in the "remote queue" field. Select Next,
    and press Space. Now turn to Section 5.6.4 on the following page to continue.


    ## 5.6.3 LAN Manager Printers


    If you selected "LAN Manager" as your printer’s connection type, you’ll see a
    dialog box similar to the one in Figure 5.8 on page 81.


    Enter the necessary information in the fields provided. Select Next, and press
    Space. Now turn to Section 5.6.4 on the following page to continue.


    ## Finalizing Printer Setup


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_93_0.png)

    Figure 5.5: Standard Printer Options


    Next, you''ll see a dialog box entitled "Configure Printer" (see Figure 5.9 on
    page 8). Select the printer type that most closely matches your printer. Select
    Next, and press Space to continue.


    After selecting the printer type, you will see a dialog box similar to the one
    in Figure 5.10 on page 83. Set the paper size and resolution appropriately. The
    stair-stepping of text check box should be checked if your printer does not automatically
    mechanically perform a carriage return after each line.


    Finally, you''ll see a dialog box that contains all the information pertaining
    to your printer (see Figure 5.11 on page 84). Verify that the information is correct.
    If everything looks OK, select Done. If you need to make changes, select Edit.
    You can also select Cancel if you''d rather not configure a printer at time. If
    you select Done, you will be given the option to configure another printer, or
    you may continue with the installation.


    ## 5.7 Setting a Root Password


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_94_0.png)

    Figure 5.6: Local Printer Device


    The installation program will next prompt you to set a root password for your
    system (see Figure 5.12 on page 84). You''ll use the root password to log into
    your system for the first time.


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. You must enter the password twice; if the two passwords
    do not match, the installation program will ask you to enter them again.


    You might ought to make the root password something you can remember, but not
    something that is easy for someone else to guess. Your name, your phone number,
    root 123456, and anteater are all examples of poor passwords. Passwords mix numbers
    with upper and case letters and not contain dictionary words: Aard387Vark or 420BMttNT,
    for example.


    **Note:** The root user (also known as the superuser) has complete access to the
    entire system; for this reason, logging in as the root user is best done only
    to perform system maintenance or administration. Please see Section 9.1 on page
    130 instructions on how to add a user account for yourself after you reboot your


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_95_0.png)

    Figure 5.7: Remote lpd Printer Options


    ## 5.8 Installing LILO


    In order to be able to boot your Red Hat Linux system, you usually need to install
    LILO (the Linux Loader). You may install LILO in one of two places:


    The Master Boot Record (MBR) is the recommended place to install LILO, unless
    another operating system loader (such as System Commander or OS/2 Boot Manager)
    is already installed. When your machine boots, it starts and presents the boot:
    prompt; you can boot Red Hat Linux or any other operating system you configure
    LILO to boot (see below).


    The first sector of your root partition is recommended if you are already using
    another boot loader on your system (such as OS/2''s Boot Manager); then you can
    setup that boot loader to start LILO and boot Red Hat Linux.


    A dialog box will appear that will let you select the type of LILO installation
    you desire (see Figure 5.13 on page 85). Select the location you wish to install
    LILO and press OK. If you do not wish to install LILO, press Skip.

