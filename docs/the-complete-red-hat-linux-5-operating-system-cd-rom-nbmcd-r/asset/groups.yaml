    20 页第 2.3 节），其中某些方法需要使用辅助磁盘。总结来说，你可以从以下位置安装 Red Hat Linux：


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_54_0.png)


    图 3.4：选择安装方法


    - CD-ROM - 如果你有 CD-ROM 驱动器和 Red Hat Linux CD-ROM。不需要辅助磁盘。请参考下一页的 3.4.1 节选择 CD-ROM
    安装方法。

    - NFS - 如果你从 NFS 服务器安装，该服务器正在导出 Red Hat Linux CD-ROM 或 Red Hat FTP 站点上的 Red Hat
    Linux 镜像。不需要辅助磁盘。请参考对页的 3.4.2 节选择 NFS 安装方法。

    - **Hard Drive** - 如果你将 Red Hat Linux 文件复制到了本地硬盘上。需要辅助磁盘。请参考第 44 页的 3.4.8 节选择硬盘安装方法。

    - **FTP** - 如果你直接从 FTP 服务器安装。需要辅助磁盘。请参考对页的 3.4.2 节选择 FTP 安装方法。


