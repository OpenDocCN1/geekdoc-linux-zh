    ## 2.6 How do I get new updates to Red Hat as they happen?


    keep your eye on:

    http://www.redhat.com/errata

    new information we''ve made available since the current CD was pressed. Also check
    the contrib directory on our FTP mirrors for packages that users have computed.
    We also make periodic announcements to the redhat-announce-list with updates.


    ## 2.7 What do I do if I have media (manual or CD) problems?


    If you are experiencing problems with the product you received (e.g., your manual
    is missing pages or your CD is scratched), please contact Red Hat Software at
    sales@redhat.com or by phone using the above contact information. The problem
    will be rectified promptly. Please not report these problems on the red-list or
    to Red Hat Support, as they are likely isolated and your product will simply need
    to be replaced.


    (Note: This is not a common problem, but it does happen from time to time.)


    ## 2.8 What''s the quickest and best way to get support for Red Hat?


    - The Red Hat Software WWW site (http://www.redhat.com)

    - The Red Hat Linux Users'' Mailing Lists; see http://www.redhat.com/mailing-lists/


    ## 2.9 How do I report a bug?


    Send email to bugs@redhat.com.


