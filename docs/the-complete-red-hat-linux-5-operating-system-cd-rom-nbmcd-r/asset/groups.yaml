    ## 11

    ## 系统管理


    本章是 Red Hat Linux 系统的概述。它将向你介绍你可能不了解系统特性，以及与其他 UNIX 系统略有不同的之处。请注意，大多数系统管理任务都是通过控制面板完成的，这将在第
    9 章中介绍。


    ### 1.1 文件系统结构


    Red Hat Software 致力于 Linux 文件系统标准（FSTND），这是一份协作文档，定义了许多文件和目录的名称和位置。我们将继续跟踪该标准以保持
    Red Hat 的兼容性。


    符合标准意味着许多含义，其中最重要的两点是与其他符合标准的系统兼容性，以及将 /usr 分区挂载为只读的能力。/usr 分区包含常用的可执行文件，不供用户修改。正因如此，/usr
    分区可以从 CD-ROM 或通过只读 NFS 从另一台机器上挂载。当前的 Linux 文件系统标准 (FSTND) 文档是任何符合 FSTND 的文件系统的权威参考，但该标准留下了许多未定义或可扩展的领域。


    在本节中，我们提供了该标准的概述，并对标准未涵盖的文件系统部分进行了描述。


    完整标准可以在以下地址查看：


    ```

    http://www.pathname.com/fhs/

    ```


    ### 11.1.1 FSSTND 概述


    此处提到的目录和文件是 FSSTND 文档指定内容的一个小子集。请检查最新的 FSSTND 文档以获取最新且完整的信息。


    ### /etc 目录


    /etc 目录保留给本地机器的配置文件。/etc 中不应放置任何二进制文件。过去放在 /etc 中的二进制文件现在应该放入 /sbin 或可能放入 /bin。


    X11 和 skel 目录应该是 /etc 的子目录：


    ```

    /etc

    |- X11

    +- skel

    ```


    X11 目录用于 X11 配置文件，例如 XF86Config。skel 目录用于“骨架”（skeleton）用户文件，这些文件在首次创建用户时用于填充家目录。


    ### /lib 目录


    /lib 目录应该只包含执行 /bin 和 /sbin 中二进制文件所需的库。


    ### 1.1 文件系统结构


    #### /sbin 目录

    /sbin 目录用于供 root 用户使用的可执行文件，且仅限启动和挂载 /usr 以及执行系统恢复操作所需的那些文件。FSSTND 规定：


    > "/sbin 通常包含除 /bin 中的二进制文件外，启动系统所必需的文件。在 /usr 已知挂载（无问题时）之后执行的任何程序都应放在 /usr/sbin。仅限本地的系统管理二进制文件应该放在
    /usr/local/sbin。”


    至少，以下程序应该在 /sbin 中：


    clock, getty, init, update, mkswap, swapon, swapoff, halt, reboot, shutdown, fdisk,
    fsck.*, mkfs.*, lilo, arp, ifconfig, route


    #### /usr 目录

    /usr 目录用于在整个站点共享的文件。/usr 目录通常有自己的分区，并且应该挂载为只读。以下目录应该是 /usr 的子目录：


    - X11R6

    - bin

    - dict

    - doc

    - etc

    - games

    - include

    - info

    - lib

    - local

    - man

    - sbin

    ```

    |- share

    +- src

    ```


    X11R6 目录用于 X Window 系统（Red Hat Linux 上的 XFree86），bin 用于可执行文件，doc 用于随机的非 man 页文档，etc
    用于站点范围的配置文件，include 用于 C 头文件文件，info 用于 GNU info，lib 用于库，man 用于 man 页，sbin 用于系统管理二进制文件（那些不属于
    /sbin 的文件），src 用于源码。


    ### /usr/local 目录


    FSSTND 规定：


    > "/usr/local 层级结构供系统管理员在本地安装软件时使用。它需要确保在系统软件更新时不被覆盖。它可以用于一组机器之间共享的程序和数据，但在 /usr
    中未找到它们。”


    /usr/local 目录的结构与 /usr 目录相似。它具有以下子目录，其目的与 /usr 目录中的目录相似：


    ```

    /usr/local

    |- bin

    |- doc

    |- games

    |- include

    |- info

    |- lib

    |- man

    |- sbin

    |- src

    ```


    ### 1.1 文件系统结构


    #### /var 目录

    由于 FSSTND 要求你能够以只读方式挂载 /usr，任何写入日志文件或需要池（spool）或锁目录的程序都应该将其写入 /var 目录。FSSTND 规定
    /var 用于可变数据，包括池目录、管理数据和临时文件。


    以下目录应该是 /var 的子目录：


    - log

    - catman

    - lib

    - local

    - named

    - run

    - tmp

    - cron

    - lpd

    - mail

    - queue

    - uucp

    - news


    如 wtmp 和 lastlog 等日志文件进入 /var/log。/var/lib 目录还包含数据库。man 页进入 /var/man，锁文件进入 /var/lock。/var/spool
    目录具有各种需要存储数据的子目录。


    ### 11.1.2 Red Hat Linux 中的 /usr/local


    Red Hat Linux 对 /usr/local 的预期用途与 FSSTND 指定的略有不同。例如，建议你将 /usr/local 挂载为只读，但你允许向其写入。


    ### 11.2 特殊文件位置


    除了位于 /var/lib/rpm（见第 8 章）的文件外，还有两个用于 Red Hat 配置和操作的特殊位置。/etc/sysconfig 目录存储在启动时运行的脚本。该目录中的大部分文件是可以手动编辑的，但最好使用正确的控制面板工具。


    ### 11.3 用户、组


    管理用户和组传统上非常繁琐。Red Hat Linux 提供了一些工具和规范，使得用户和组的管理变得更容易且有用。管理用户和组的最简单方法是通过控制面板的用户和组模块（见第
    9 章）。你也可以从命令行使用 adduser 创建新用户。


