    # Anonymous FTP


    # Anonymous FTP


    Setting up anonymous FTP is simple. All you need to do is install the anon-ftp
    connection package (which you may have already done at install time). Once it
    is installed, anonymous FTP will be up and running.


    There are a few files you might wish to edit to configure your FTP server.


    /etc/ftppass This file defines most of the access control for your ftp server.
    Some of the things you can do are: set up logical “groups” to control access from
    different sites, limit the number of simultaneous connections, configure transfer
    logging, and much more. Read the ftppass man page for complete details.


    /etc/fthosts The fthosts file is used to allow or deny access to certain accounts
    from various hosts. Read the fthosts man page for details.


    /etc/ftusers This file lists all the users that are not allowed to ftp into your
    machine. For example, root is listed in /etc/ftusers by default. This means that
    you can not ftp to your machine and log in as root. This is a good security measure,
    but some administrators prefer to remove root from this file.


