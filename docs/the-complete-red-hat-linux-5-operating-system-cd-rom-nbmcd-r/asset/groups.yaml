    ## Installation Methods


    ### 3.1 PCMCIA Support During the Installation


    The PCMCIA section is specific to Intel-based computers only.


    Most Intel-based laptop computers support PCMCIA (also known as PC Card). Computers
    supporting PCMCIA devices contain a controller having one or more slots in which
    a PCMCIA device can be installed. These devices may be modems, AN adapters, SCSI
    adapters, and so on.


    When installing Red Linux/Intel on a PCMCIA-capable computer, it is important
    to note if a PCMCIA device will be used during installation. For example, if you
    want to install Red Linux/Intel from a CD-ROM, and your CD-ROM drive is connected
    to a PCMCIA adapter, the installation program will require PCMCIA support. Likewise,
    if you are going to use one of the network-based installation methods, you will
    need PCMCIA support if your network adapter is PCMCIA-based.


    PCMCIA support is dependent on two things:


    - 1. The type of PCMCIA controller in your computer system.

    - 2. The type of PCMCIA device that you wish to use during the installation.


    While nearly every PCMCIA controller and most popular PCMCIA devices are supported,
    there are some exceptions. For more information, please consult the Red Hat Linux
    Hardware Compatibility List at http://www.redhat.com/hardware.


    The main thing to keep in mind is that if you require PCMCIA support, you will
    need the supplemental diskette.


    ### 3.2 Installing From a CD-ROM


    If you have a Red Hat Linux CD-ROM and your computer has a supported CD-ROM drive,
    you should consider this installation method. Installing directly from CD-ROM
    is the most straightforward approach. When installing from CD-ROM, the packages
    you select are read from the CD-ROM, and are installed on your hard drive.


    #### How To Do It


    As the name implies, you''ll need a Red Hat Linux CD-ROM, a supported CD-ROM drive,
    and a means of starting the installation program.


    Intel systems will need to use the boot diskette (and the supplemental diskette
    if PCMCIA support is required). There is an alternate method of installing from
    a ROM that uses no diskettes, but requires that the system is running DOS. We
    will discuss this approach (known as autoboot) in Chapter 3 on page 33. Note,
    not that PCMCIA support is not available when using autoboot.


    If you''ve determined that this installation method is most applicable to your
    situation, please skip ahead to Section 2.4 on page 24.


    ### 2.3.3 Installing From an FTP Site


    If you don''t have a Red Hat Linux CD-ROM or a CD-ROM drive, but you do have network
    access, then an FTP installation may be for you. When installing via FTP, the
    Red Hat Linux packages you select are downloaded (using FTP) across the network
    to your computer, and are installed on your hard drive.


    #### How To Do It


    When doing an FTP install, you''ll need LAN-based access to a network: a dial-up
    connection via modem won''t cut it. If your Local Area Network has Internet access,
    you can...


    If your LAN doesn''t have Internet access, all is not lost. If there is a computer
    on your LAN that can accept anonymous FTP requests, simply load the Red Hat Linux
    kernel on that system, and you''re ready to go.


    For an FTP installation, you must use both the boot and supplemental diskettes.
    You will need to have a valid nameserver configured or you must specify the address
    of the FTP server you will be using. You will also need the path to the Red Hat
    Linux directory on the FTP server.


    If you''ve determined that this installation method is most applicable to your
    situation, please skip ahead to Section 2.4 on page 24.


    ### 3.4 Installing From an NFS Server


    If your system doesn''t have a CD-ROM drive, but you do have network access, then
    an NFS installation may be for you. When installing via NFS, the Red Hat Linux
    packages you select are NFS-served to your computer from an NFS server. The packages
    are then installed on your hard drive.


    #### How To Do It


    If you wish to perform an NFS installation, you will need to mount the Red Hat
    Linux CD-ROM on a machine that supports ISO-9660 file systems with Rock Ridge
    extensions. The machine must also support NFS. Export the CD-ROM file system to
    NFS. You will need to have a nameserver configured, or know the NFS server''s
    address, as well as the path to the exported CD-ROM.


    For an NFS installation, you will need a boot diskette only. If you''ve determined
    that this installation method is most applicable to your situation, please skip
    ahead to Section 2.4 on the next page.


    ### 3.5 Installing From a Hard Drive


    If none of the other installation methods will work for you, but you have some
    means of getting the Red Hat Linux package files written to your system''s hard
    drive, you can install from your hard drive. In this installation method, the
    Red Hat Linux packages you select are read from one partition on a hard drive,
    and are installed on another partition (or set of partitions).


    #### How To Do It


    The hard drive installation method requires a bit of up-front effort on your part;
    you must copy all the necessary files to a partition before starting the Red Hat
    Linux installation program. You must first create a RedHat directory at the top
    level of your directory tree. Everything you will install should be placed in
    that directory. First copy the base subdirectory and its contents.


    Next, copy the packages you want to install to another subdirectory called RPMS,
    where you can use available space on an existing DOS partition or a Linux partition
    that is not required in the install procedure (for example, a partition that would
    be used for data storage on the installed system).


    If you are using a DOS filesystem, you will not be able to use the full Linux
    names for the RPM packages. The installation process does not care what the filenames
    are like, but it is a good idea that you keep track of them.


    You''ll need a boot and supplemental diskette when installing from a hard drive.


    ## 2.4 Disk Partitions


    In order to install Red Hat Linux, you must make disk space available for it.
    The disk space needs to be separate from the disk space used by other operating
    systems you may have installed on your computer, such as Windows, OS/2, or ever
    different version of Linux.


    A disk can be divided into different partitions. Each partition can be accessed
    if it was a separate disk. Furthermore, each partition has a type that is used
    to indicate how information is stored in the partition. There are different partition
    types used by DOS, OS/2, and Linux.


    Even if you will be installing Red Hat Linux on its own disk, or on a computer
    with no operating system, you''ll still need to create partitions. In this case
    it''s pretty easy, as there are no other partitions to worry about.


    On the other hand you may wish to install Red Linux on a disk which already contains
    software. Things can get a little trickier in this situation, not mention the
    data they contain!


    During the installation process, you''ll be given the chance to create partitions
    for Red Hat. At this point, your main concern is making sure you have enough disk
    space. Let''s review the different ways to free up space.


    ### 2.4.1 Repartitioning Strategies


    There are three possible scenarios you may face when attempting to repartition
    your hard disk:


    - Unpartitioned space is available.

    - An unused partition is available.

    - Free space from an active partition is available.


    #### Using Unpartitioned Space


    In this situation, the partitions defined do not span the entire disk, leaving
    unallocated space that is not part of any partition. If you think about it, an
    unused hard drive also falls into this category; the only difference is that all
    the space is unallocated.


    In this case, you can simply create the necessary partitions from the unused space.


    #### Using An Unused Partition


    Last year you replaced that tiny 150MB hard drive on your Windows system with
    a 2GB monster. You partitioned it into two equal parts, figuring that you''d use
    the C: drive (really the drive''s first partition) for Windows, and the D: drive
    (really the drive''s second partition) for your collection of freeware programs
    downloaded from the Internet. Well, you''d been so used to using C that you never
    put anything of substance on D.


    If you find yourself in this situation, you can use the space allocated to the
    unused partition. You''ll need to delete the partition and create the appropriate
    Linux partitions in its place.


    #### Using Free Space From An Active Partition


    This is the most common situation. It is also, unfortunately, the hardest to deal
    with. The main problem is that you have enough free space, but it''s already allocated
    to a partition that is in use. If you purchased a computer with pre-installed
    software, the hard disk most likely has one massive partition holding the operating
    system and data.


    Aside from adding a new hard drive to your system, you have two choices:

