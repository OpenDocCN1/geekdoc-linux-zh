    \ 必须位于 IDE 驱动器上。\n\n- 在两个 SCSI 驱动器上 —— 如果你有两个 SCSI 驱动器，`/boot` 必须位于其中一个上。\n\n\
    - 完全位于 1023 磁道的分区 —— 无论何种情况，存放 `/boot` 的分区必须位于 1023 磁道以下。如果存放 `/boot` 的分区跨越了 1023\
    \ 磁道，由于某些因素，LILO 将无法工作。正如前面提到的，某些 BIOS 允许这种操作，但由于 `/boot` 所在的位于 1023 磁道以上，可能会。\n\
    \n## 2.4.4 多少个分区？\n\n虽然你可以在单个大分区上安装 Red Hat Linux，但建议采用以下布局，这在单分区简单性与多分区灵活性之间的一种折中：\n\
    \n- 交换分区 —— 交换分区用于支持虚拟内存。如果你的计算机内存为 16 MB 或更少，必须创建一个交换分区。即使你有更多内存，仍然建议设置交换分区。交换分区的大小应与内存相等或较大者为。\n\
    \n- 根分区 —— 根分区是 `(/)` 所在地。它只需要包含启动所需的文件。对于大多数系统，50 MB 到 80 MB 的根分区即可。\n\n- /usr\
    \ 分区 —— `/usr` 分区是 Red Hat Linux 上大部分软件所在地。此分区应该在 200 MB 到 500 MB 之间，取决于你计划安装的包数量。如果可能，请为\
    \ `/usr` 分区留出空间。\n\n- home 分区 —— 这是用户目录所在地；`/home` 的大小取决于你计划在系统中使用的用户以及他们可能存储的内容。此外，你可能希望创建以下任何分区：\n\
    \n- usr/local 分区 —— 传统上，`/usr/local` 被用于存放与系统其他部分隔离的物品，例如未以 RPM 包提供的软件。其大小取决于你预期放在系统上的软件。\n\
    \n- usr/src 分区 —— 在 Red Linux 系统上，`/usr/src` 有内容：\n    - 内核源码：Linux 内核的完整源码存储在这里，并在此构建内核。\n\
    \    - 包源码：如果安装了源包（即 SRPM），文件将存储在这里。请注意，除非另有说明，任何构建的包也会使用此处的构建目录。再次，该分区的大小取决于你预期构建的软件。\n\
    \n- tmp 分区 —— 正如名称所示，`/tmp` 分区用于临时文件。对于多用户系统或网络服务器，创建一个专用 `/tmp` 分区是一个好主意。这是因为许多活跃用户可能会填满\
    \ `/tmp` 所在的根分区。对于单用户工作站，没有必要为 `/tmp` 划分分区。\n\n"
