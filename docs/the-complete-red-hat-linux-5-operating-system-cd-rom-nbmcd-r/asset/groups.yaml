    ## 11.5 The Boot Process, Init, and Shutdown


    ### 11.5.1 System V Init


    This section is a brief description of the internals of the boot process. It basically
    covers in detail how the machine boots using SysV Init and the differences between
    the original init used in older Linux releases.


    Init is the program that gets run by the kernel at boot time. It is in charge
    of starting all the normal processes that need to run at boot time. These include
    the getty as allow you to log in, NFS daemons, FTP daemons, and anything else
    you want to run when your machine boots.


    SysV Init is fast becoming the standard in the Linux world to control the startup
    of software at boot time. This is because it is easier to use and more powerful
    and flexible than the traditional BSD init.


    init also differs from BSD init that in the config files are in a subdirectory
    of /etc instead of residing directly in /etc. This directory is called rc.d. In
    there you will find rc.sysinit and the following directories:


    ```

    init.d

    rc0.d

    rc1.d

    rc2.d

    rc3.d

    rc4.d

    rc5.d

    rc6.d

    ```


    init.d contains a bunch of scripts. Basically, you need one script for each service
    you may need to start at boot time or when entering another runlevel. Services
    include things like networking, sendmail, nfs, http, etc. Services do not include
    things like setserial that must only run once and then exited. Things like that
    should go in rc.local or rc.serial.


    if you want rc.local, it should be in /etc/rc.d. Most systems include one though
    it doesn''t do much. You can also include an rc.serial in /etc/rc.d if you need
    to do serial port specific things at boot time.


    the chain of events is as follows:


    * The kernel looks in several places for init and runs the first one it finds

    * init runs /etc/rc.d/rc.sysinit

    * rc.sysinit does a bunch of necessary things and then runs rc.serial (if it exists)

    * init runs all the scripts for the default runlevel.

    * init runs rc.local


    the default runlevel is decided in /etc/inittab. You should have a line close
    the top like:


    ```

    id:3:initdefault:

    ```


    From this, you could look in the second column and see that the default runlevel
    3, as should be the case for most systems. If you want to change it, you can edit
    /etc/inittab by hand and change the 3. Be very careful when you are messing with
    the inittab. If you do mess up, you can fix it by rebooting and doing:


    LILO boot:    linux single


    This should allow you to boot into single user mode so you can fix inittab.


    Now, how does it run all the right scripts? If you enter ls -1 on rc3.d, you might
    see something out like:


    ```

    lrwxrwxr-x root root 17 Jan 3:11 .../init.d/network

    lrwxr-xr-x root root 17 Jan 3:11 .../init.d/syslog

    lrwxrwxr-x root root 17 Jan 3:11 .../init.d/cron

    lrwxrwxr-x root root 17 Jan 3:11 .../init.d/inet

    lrwxrwxr-x root root 17 Jan 3:11 .../init.d/nfs

    lrwxrwxr-x root root 17 Jan 3:11 .../init.d/nfs

    lrwxrwxr-x root root 17 Jan 3:11 .../init.d/lpd

    lrwxrwxr-x root root 17 Jan 3:11 .../init.d/local

    ```


