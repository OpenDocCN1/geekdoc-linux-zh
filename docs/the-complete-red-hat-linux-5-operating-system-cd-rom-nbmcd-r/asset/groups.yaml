    \n按下 F1 接受当前值并继续。\n\n注意：除非对话框正在等待输入，否则不要在安装过程中按下任何键——可能会导致不可预测的行为。\n\n###1.2 关于控制台的说明\n\
    \n安装程序在引导你安装时提供的功能更多。事实上，它提供了几种类型的控制台供查看。如果你在安装 Linux 时遇到问题，这些控制台将非常有帮助。\n\n|\
    \ 控制台 | 按键 | 内容 |\n| :--- | :--- | :--- |\n| 1 | Alt-F1 | 安装对话 |\n| 2 | Alt-F2\
    \ | 提示符 |\n| 3 | Alt-F3 | 安装日志 |\n| 4 | Alt-F4 | 系统日志 |\n| 5 | Alt-F5 | 其他消息 |\n\
    \n# 2 开始安装\n\n该开始安装 Red Hat Linux 了。在我们开始之前，请确保已准备好所需资源。如果你已经读过第 2 章，应该准备好了。\n\
    \n# 1 启动安装程序\n\n要启动安装，将软盘插入计算机的驱动器并重启。延迟后，会出现一个包含启动选项的屏幕。该屏幕包含各种选项。每个启动选项都有相关的帮助屏幕。要查看特定的帮助屏幕，请按下底部列出的相应功能键。\n\
    \n如果在分钟内没有操作，初始屏幕将自动启动安装程序。要禁用此功能，请按下屏幕功能键：\n\n- 如果你按下功能键，从磁盘读取屏幕将会有延迟。\n\n通常，你只需要按下回车即可启动。观察启动消息查看内核是否检测到了你的硬件。如果它没有正确检测到你的硬件，你可能需要以“专家”模式重新安装。专家模式禁用了大多数硬件探测，并提供了安装期间加载的驱动程序的选项。可以使用以下提示符进入专家模式：\n\
