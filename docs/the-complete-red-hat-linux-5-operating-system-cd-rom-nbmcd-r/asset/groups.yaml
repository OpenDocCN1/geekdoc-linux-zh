  - "[PAGE 105]\n\nNow you must update /etc/lilo.conf. If you built a new initrd image\
    \ you must tell LILO to use it. In this example of /etc/lilo.conf we have added\
    \ four lines at the bottom of the file to indicate another kernel to boot from.\
    \ We have renamed /boot/vmlinuz to /boot/vmlinuz.old and changed its label to\
    \ old. We have also added an initrd line for the new kernel:\n\n```\nboot=/dev/hda\n\
    map=/boot/map\ninstall=/boot/boot.b\nprompt\ntimeout=100\nimage=/boot/vmlinuz\n\
    \    label=linux\n    initrd=/boot/initrd\n    root=/dev/hda\n    read-only\n\
    image=/boot/vmlinuz.old\n    label=old\n    root=/dev/hda\n    read-only\n```\n\
    \nNow when the system boots and you press Tab at the LILO boot: prompt two choices\
    \ will be shown:\n\n+   - LILO boot:\n  linux old\n\nTo boot the new kernel (linux)\
    \ simply press Enter, or wait for LILO to time out. If you want to boot the old\
