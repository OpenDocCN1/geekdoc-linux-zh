    There have been several now. Here''s a rundown:


    - Preview (or Beta) - Summer 1994

    - Halloween - Fall 1994

    - Mother''s Day 1.0 - Summer 1995

    - Mother''s Day 1.1 - Late Summer 1995

    - Red Hat Linux 2.0beta - Late Late Summer 1995

    - Red Hat Linux 2.0 - Early Fall 1995

