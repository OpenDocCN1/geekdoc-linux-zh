    written to disk. You will be asked to confirm your changes before Disk Druid rewrites
    your hard partition table(s). In addition, any mount points you''ve defined are
    passed to the installation program, and will eventually be used by your Red Hat
    Linux system to define the filesystem layout.


    Cancel - This button causes Disk Druid to abort without saving any changes you''ve
    made. When this button is selected, the installation program will present a dialog
    box that permits you to choose what action you''d like to take next.


    Please Note: You will need to dedicate at least one partition to Red Hat Linux,
