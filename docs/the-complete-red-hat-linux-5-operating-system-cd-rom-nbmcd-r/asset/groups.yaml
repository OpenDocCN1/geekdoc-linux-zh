    extensions are configured in the /usr/lib/Metro/X11/Extensions file. Most extensions
    are dynamically loaded; that is, if they are needed they are loaded automatically
    without any additional manual configuration. An extension that is “ON” is loaded
    at server startup and never unloaded. An extension that is “DYN” is dynamically
    loaded on request by an X client XQueryExtension call. These extensions display
    with XListExtensions or xdpyinfo. An extension that is “OFF” is not used, nor
    is it displayed with XListExtensions or xdpyinfo.


    # Special Notes


    - Multi-Buffering and DOUBLE-BUFFER cannot be dynamically loaded. They must be
    set to “ON” or “OFF”.


    - GLX (OpenGL) can be dynamically loaded, however GLX depends on DOUBLE-BUFFER
    being “ON”. Therefore, to use GLX, set DOUBLE-BUFFER to “ON” and GLX to “DYN”.


    - X3D-PEX (PEX) can be dynamically loaded, however X3D-PEX depends on Multi-Buffering
    being “ON”. Therefore, to use X3D-PEX, set Multi-Buffering to “ON” and X3D-PEX
    to “DYN”.


    # Red Hat Linux Frequently Asked Questions


    ## 1 Introduction


    This is the Official Red Hat Linux FAQ. It is maintained by Q-maintainer@redhat.com;
    all comments or suggestions for this FAQ should be sent to that address. A recent
    version of this FAQ is available from http://www.redhat.com, or by email from
    faq@redhat.com.


    ## 2 General Questions


    ## 2.1 Where can I get information on Red Hat Linux?


    - Via the Web: http://www.redhat.com

    - Via FTP: ftp://ftp.redhat.com


    ## 2.2 How Can I Get Red Hat Linux?


    Red Hat Linux is available on CD from Red Hat Software and various Red Hat Linux
    resellers; it is also available via FTP from http://ftp.redhat.com and its many
    mirror sites.


