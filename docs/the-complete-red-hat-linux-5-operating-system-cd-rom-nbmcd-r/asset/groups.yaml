    \ 5.13: Installing LILO\n\n![](img/8ae7f5fad98006e6a164a7db64fb5e18_100_1.png)\n\
    \nFigure 5.14: LILO options\n\n## 6 Post Installation Configuration\n\nAfter installation\
    \ your system is fully functional, but you may still want to do some additional\
    \ configuration. This chapter describes some of the various system configuration\
    \ tasks you may need to do.\n\n### 1 Building a Custom Kernel\n\nWith the introduction\
    \ of modularization in the Linux 2.0.x kernel there have been some significant\
    \ changes in building customized kernels. In the past you were required to compile\
    \ support into your kernel if you wanted to access a particular hardware or filesystem\
    \ component. For some hardware configurations the size of the kernel could reach\
    \ a critical level. To require support for items that were only occasionally used\
    \ was an inefficient use of system resources. With the capabilities of the 2.0.x\
    \ kernel, if there are certain hardware components or systems that are used infrequently,\
    \ drivers can be loaded.\n\n#### 6.1.1 Building a Modularized Kernel\n\nIt is\
    \ important to begin with the source tree. Now you must create a configuration\
    \ file. The method described is the easiest to recover from a possible error in\
    \ new kernel. If you wish to build a kernel monolithic kernel. Depending on your\
    \ hardware and personal preferences, there are three methods to configure the\
    \ kernel:\n\n- make config An interactive text program. Components are presented\
    \ as you answer with the Red Hat Linux.\n- make menuconfig A graphic, menu driven\
    \ program. Components are listed in menus, you select the components.\n- make\
    \ xconfig An X program. Components are listed in levels, you select using mouse.\n\
    \n#### 6.1.2 Building a Monolithic Kernel\n\nIf you have a SCSI adapter and make\
    \ your SCSI driver modular, build a new initrd image (see Section 6.1.1; note\
    \ that there are few practical reasons to make the eSCSI driver modular in a custom\
    \ kernel). Order to provide a redundant boot source to protect from a possible\
    \ error in new kernel you should keep the original kernel available. Adding a\
    \ kernel to LILO boot menu is as simple as renaming the original kernel in /boot,\
    \ copying the new kernel to /boot, adding a few lines in /etc/lilo.conf and running\
    \ bin/lilo. Here is an example of the default /etc/lilo.conf file shipped with\
    \ The Red Hat Linux\n\n```\nboot=/dev/hda\nmap=/boot/map\ninstall=/boot/boot.b\n\
    \nprompt\ntimeout=100\nimage=/boot/vmlinuz\nlabel=linux\nroot=/dev/hdal\nread-only\n\
    ```\n\nThe next step consists of the actual compilation of the source code to\
    \ a working program that your machine can use. Use make clean to prepare the source\
    \ tree. The method described is the easiest to recover from a possible mishap.\
    \ If you are interested in other possibilities, details can be found in the Kernel-HOWTO\
    \ or in the Makefile in /src/linux.\n\n- Build the kernel with make boot.\n- Build\
    \ any modules you configured with make modules.\n- Move the old set of modules\
    \ out of the way:\n```\nrm -rf /lib/modules/2.0.29-old\nmv /lib/modules/2.0.29-old\
    \ /lib/modules/2.0.29-old\n```\nOf course, if you have upgraded your kernel, replace\
    \ 2.0.29 with the version you are using.\n\n- Install the new modules (even if\
    \ you didn't build any) with make modules.install.\n"
  mdcn: "\n\n## 5.8 安装 LILO\n\nRed Hat Linux (OS) 7.2) Red Hat Software 配置打印机\n\n\
    要打印到局域网打印机，你需要提供打印服务器的局域管理器主机名（这与主机名并不相同）或 IP 地址，以及你想要访问的打印机共享名称以及任何相关的用户名和密码。\n\
    \n- 局域管理器主机: foo.redhat.com\n- 局域管理器 IP: 10.0.2.15\n- 共享名称: PRINTER\n- 用户名: \n\
    - 密码:\n\n![](img/8ae7f5fad98006e6a164a7db64fb5e18_96_0.png)\n\n(Tab)/Alt 切换元素\
    \ (Space) 选择 (F12) 下一个项目\n\n图 5.8：局域管理器打印机选项\n\n注意：如果你选择跳过（Skip），你将无法直接启动 Red\
    \ Hat Linux 系统，而需要使用其他启动方法（如启动磁盘）。请自风险使用此选项！\n\n### 5.8.1 为 LILO 启动命令行添加选项\n\n\
    最后，安装程序会询问你是否希望为 LILO 启动命令添加默认选项（参见第 85 页的图 5.14）。你输入的任何选项将在每次 Linux 启动时传递给 Linux内核。如果你有\
    \ LBA 驱动器，请勾选使用线性模式（Use linear mode）。完成后选择 OK 并按 Space 键。\n\n### 5.8.2 LILO 的替代方案\n\
    \n如果你不想使用 LILO 启动你的 Red Hat Linux 系统，有几种替代方案：\n\nLOADLIN 可以从 MS-DOS 加载 Linux；遗憾的是，它要求\
    \ MS-DOS 分区上有一个 Linux 内核副本（如果你有 SCSI 适配器，还需要一个初始 ram 磁盘）。实现此点的唯一方法是使用其他方法启动你的\
    \ Red Hat Linux 系统（例如，从软盘上的 LILO 启动，然后将内核复制到 MS-DOS 分区）。LOADIN 可以从 ftp://sunsite.unc.edu/pub/Linux/system/boot/dualboot/\
    \ 以及 sunsunite 的各种镜像站点获取。\n\nSYSLINUX 是一个与 LOADIN 非常相似的 MS-DOS 程序；它也可以从 ftp://sunsite.unc.edu/pub/Linux/system/boot/dualboot/\
    \ 以及 sunsunite 的各种镜像站点获取。\n\n一些常见的引导加载程序（如 System Commander）也能启动 Linux（但可能仍需要在你的\
    \ Linux 根分区中安装 LILO）。\n\n## 5.9 完成...\n\n在完成 LILO 安装后，安装程序将重建你的系统。不要忘记移除磁盘驱动器中可能存在的任何软盘。\n\
    \n在 boot: 提示符（the boot: 提示符）处，按 Enter 键并观察你的 Red Hat Linux 系统启动。当它出现 login: 提示符时，输入\
    \ root。在 Password: 提示符处，输入你在第 79 页第 5.7 节为机器设置的 root 密码。\n\n![](img/8ae7f5fad98006e6a164a7db64fb5e18_98_0.png)\n\
    \n图 5.10：打印机设置\n\n恭喜！你的 Red Hat Linux 安装完成了！\n\n![](img/8ae7f5fad98006e6a164a7db64fb5e18_99_0.png)\n\
    \n图 5.11：验证打印机信息\n\n![](img/8ae7f5fad98006e6a164a7db64fb5e18_99_1.png)\n\n<Tab>/Alt-Tab\
    \ 切换元素 (Space) 选择 <F12> 下一个屏幕\n\n图 5.12：Root 密码\n\n![](img/8ae7f5fad98006e6a164a7db64fb5e18_100_0.png)\n\
    \n图 5.13：安装 LILO\n\n![](img/8ae7f5fad98006e6a164a7db64fb5e18_100_1.png)\n\n图 5.14：LILO\
    \ 选项\n\n## 6 安装后配置\n\n安装后，你的系统已完全可以运行，但你可能仍想进行一些额外的配置。本章描述了你可能需要的一些各种系统配置任务。\n\
    \n### 1 构建自定义内核\n\n随着 Linux 2.0.x 内核引入模块化机制，构建自定义内核发生了一些重大变化。在过去，如果你想访问特定的硬件或文件系统组件，则需要将支持编译到内核中。对于某些硬件配置，内核的大小可能会达到关键水平。对仅偶尔使用的项目提供支持是对系统资源的低效利用。凭借\
    \ 2.0.x 内核的能力，如果某些硬件组件或系统使用频率较低，可以加载相应的驱动程序。\n\n#### 6.1.1 构建模块化内核\n\n从源码树开始是重要的。现在你必须创建一个配置文件。所描述的方法是从新内核可能出现的错误中恢复容易的方法。如果你希望构建单体内核（monolithic\
    \ kernel），根据你的硬件和个人偏好，有三种方法来配置内核：\n\n- make config 一个交互式文本程序。当你回答关于 Red Hat Linux\
    \ 的提问时，组件会呈现出来。\n- make menuconfig 一个图形化的、菜单驱动的程序。组件列在菜单中，由你选择组件。\n- make xconfig\
    \ 一个 X 程序。组件按层级列出，你使用鼠标进行选择。\n\n#### 6.1.2 构建单体内核\n\n如果你有 SCSI 适配器并使 SCSI 驱动程序模块化，请构建新的\
    \ initrd 镜像（参见节 6.1.1；注意，在自定义内核中使 SCSI 驱动程序模块化的理由很少）。为了防止新内核出现错误提供冗余启动源，你应该保持原始内核可用。将内核添加到\
    \ LILO 启动菜单只需：重命名 /boot 中的原始内核，将新内核复制到 /boot，在 /etc/lilo.conf 中添加几行并运行 bin/lilo。以下是\
    \ Red Hat Linux 自带的默认 /etc/lilo.conf 文件示例：\n\n```\nboot=/dev/hda\nmap=/boot/map\n\
    install=/boot/boot\n\nprompt\ntimeout=100\nimage=/boot/vmlinuz\nlabel=linux\n\
    root=/dev/hdal\nread-only\n```\n\n下一步是将源代码编译为机器可以使用程序。使用 make clean 准备源码树。所描述的方法容易恢复。如果你对其他可能性感兴趣，可以在\
    \ Kernel-HOWTO 或 /src/linux 中的 Makefile 中找到详细信息。\n\n- 使用 make boot 编译内核。\n- 编译你配置的所有模块。\n\
    - 将旧模块集移出：\n```\nrm -rf /lib/modules/2.0.29-old\nmv /lib/modules/2.0.29-old /lib/modules/2.0.29-old\n\
    ```\n当然，如果你升级了内核，请将 2.0.29 替换为你正在使用的版本。\n\n- 使用 make modules.install 安装新模块（即使你没有编译任何模块）。\n\
    \n"
