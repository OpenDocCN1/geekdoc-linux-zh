    \n图 4.2：选择磁盘设置方法\n\n## 4.3.1 使用 Druid\n\n如果你选择了 Disk Druid，将看到一个与对对页图 4.3 类似的屏幕。虽然初看起来可能很复杂，但其实并非如此。让我们逐一查看\
    \ Disk Druid 的三个部分，你会发现没什么好怕的\n\n### “当前磁盘分区”部分\n\n“当前磁盘分区”部分中的每一行代表一个磁盘分区。你会注意到该部分右侧有一个滚动条，这意味着分区的数量可能比一次能显示的数量要多。如果你使用方向键，可以查看是否有额外的分区。该部分中的每一行都有五个不同的字段：\n\
    \n- 挂载点（Mount Point） – 此字段表示当 Red Hat Linux 安装并运行时，分区将挂载的位置。\n- 设备（Device） – 此字段显示分区的设备名称。\n\
    - 请求（Requested） – “请求”字段显示在定义分区时请求的最小大小。\n- **实际**（Actual） - “实际”字段显示当前分配给分区的空间。\n\
    - **类型**（Type） - 此字段显示分区的类型。\n- **其他类型的分区**（Another Type of Partition） 当你滚动“当前磁盘分区”部分时，可能会看到“未分配的请求分区”标题栏，随后是一个或多个分区。这意味着这些分区已被请求，但由于某种原因，它们尚未被分配。导致未分配分区的常见原因是缺乏为该分区提供足够的空闲空间。在任何情况下，分区未分配的原因将显示在分区挂载点之后。\n\
    \n### “驱动器摘要”部分\n\n“驱动器摘要”部分中的每一行代表系统上的一个硬盘。\n每行包含以下字段：\n\n- **驱动器**（Drive） –\
    \ 此字段显示硬盘的设备名称。\n- **几何结构 [C/H/S]**（Geom） – 此字段显示硬盘的几何结构。几何结构由三个数字组成，代表硬盘报告的磁道、磁头和扇区数量。\n\
    - **总计**（Total） - “总计”字段显示硬盘上的总可用空间。\n- **已用**（Used） – 此字段显示硬盘空间中有多少当前已分配给分区。\n\
    - **空闲**（Free） – “空闲”字段显示硬盘上有多少空间尚未被分配。\n- **条形图**（Bar Graph） – 此字段提供了硬盘当前使用空间的视觉化表示。方括号内的\
    \ `#` 号越多，空闲空间越少。在前一页的图 4.3 中，条形图显示没有空闲空间。\n\n### Disk Druid \n\n这些按钮控制 Disk Druid\
    \ 的操作。它们用于添加和删除分区以及更改分区属性。此外，还有按钮用于接受你所做的更改、放弃这些更改或完全退出 Disk Druid。让我们顺序查看每个按钮。\n\
    \n- 添加（Add） - “添加”按钮用于请求新分区。选中后，将出现一个包含必须填充字段的对话框。\n- 添加 NFS（Add NFS） - 此按钮用于向你的\
    \ Red Hat Linux 系统的挂载点集中添加一个只读的 NFS 服务的共享文件系统。选中后，将出现一个包含必须填充字段的对话框。\n- 编辑（Edit）\
    \ - “编辑”按钮用于修改“当前磁盘分区”部分中当前高亮分区的属性。选中此按钮将出现一个对话框。根据分区信息是否已写入磁盘，“编辑分区”框中的某些或所有字段都可能被更改。\n\
    - 删除（Delete） - “删除”按钮用于删除“当前磁盘分区”部分中当前高亮的分区。选中此按钮将出现一个对话框，要求你确认删除操作。\n- 重置（Reset）\
    \ - 此按钮用于放弃你在 Disk Druid 中进行的所有更改，并将分区列表恢复为从硬盘分区表（分区表）中读取的内容。选中后，你将被要求确认是否要放弃这些更改。注意，你指定的任何挂载点将丢失，并需要重新输入。\n\
