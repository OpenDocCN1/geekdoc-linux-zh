    ## 1.4 The “locate” Command


    When you don''t know the full name of a command or file, but need to find it,
    you usually find it with locate. locate uses a database to find all files on your
    system. Normally, this database gets built from a cron job every night. This won''t
    happen, however, if your machine isn''t booted into Linux all the time. So, if
    that is the case, you may occasionally want to run the following all command:


    ```

    /etc/cron.daily/updateddb.cron

    ```


    You will need to be root on your system when doing that. That will allow locate
    to work properly.


    If you know you need to find all the “finger” files, you could run:


    ```

    locate finger

    ```


    which should return something like:


    ```

    /usr/bin/finger

    /usr/lib/irc/script/finger

    /usr/man/man1/in.finger.1

    /usr/man/man8/in.fingererd.8

    /usr/sbin/in.fingererd

    ```


    One thing to note, however, is that locate not only returns hits based on file
    name, but also on path name. So if you have a /home/djb/finger/ directory on your
    system, it would get returned along with all files in the directory.


    ## 1.5 “info” Pages


    While man is the most ubiquitous documentation format, info is much more powerful.
    It provides hypertext links to make reading large documents much easier and many
    features for the documentation writer. There are some very complete info documents
    on various aspects of Red Hat (especially the portions from the GNU project).


    To read info documentation, use the info program without any arguments. It will
    present you with a list of available documentation. If it can''t find something,
    it''s probably because you don''t have the package installed that includes that
    documentation. Install it with RPM and try again.


    If you''re comfortable using emacs, it has a built-in browser for info documentation.
    Use `Ctrl-h` `Ctrl-i` to see it.


    The info system is a hypertext based system. Any highlighted text that appears
    is a link leading to more information. Use `Tab` to move the cursor to the link,
    and `Enter` to follow the previous page, `m` moves to the next page, and `u` goes
    up one level of documentation. To exit info, press `Ctrl-x` `Ctrl-c` (control-x
    followed by control-c).


    The best way to learn how to use info is to read the info documentation on. If
    you read the first screen that info presents you you''ll be able to get started.


    ## 7.2 Help from the Internet Community


    ### 7.2.1 Red Hat Mailing Lists


    If you can''t find help for your problem on line and have WWW access, you should
    see http://www.redhat.com/support/mailing-lists/. Here you can search the archives
    of the redhat-list. Many questions have already been answered.


    The subscription address for each of our lists is:


    ```

    redhat-list-request@redhat.com

    redhat-digest-request@redhat.com

    redhat-announce-list-request@redhat.com

    redhat-devel-list@redhat.com

    rpm-list-request@redhat.com

    axp-list-request@redhat.com

    sparc-list-request@redhat.com

    ```


    To subscribe, send mail to the address of the list you want to subscribe to with
    subscribe in the Subject: line.


    To unsubscribe, send mail to the address of the list you want to unsubscribe from
    with unsubscribe in the Subject: line.


    To send mail to the list, you just send it to the address above without the request
    in the name. The only exception to this is the redhat-digest which only a digest
    version of the redhat-list. In that case the address is redhat-list@redhat.com.


    ## 2.2 USENET Newsgroups


    A very good source of help is the comp.os.linux hierarchy on USENET. If you are
    familiar with news, you should check it out.


    # 8

    # Package Management with RPM


    The Red Hat Package Manager (RPM), is an open packaging system available for anyone
    to use, and works on both Red Hat Linux as well as other Linux and UNIX systems.
    Red Hat Software encourages other vendors to take the time to look at RPM and
    use it for their own products. RPM is distributable under the terms of GPL.


    For the end user, RPM provides many features that make maintaining a system far
    easier than it has ever been. Installing, uninstalling, and upgrading RPM packages
    is all one line commands, and all the messy details are taken care of for you.
    RPM maintains a database of installed packages and their files, which allows you
    to perform powerful queries and verification of your system. During RPM upgrades
    configuration files are specially, so that you never lose your customizations-feature
    that is impossible with straight .tar.gz files.


    For the developer, RPM allows you to take source code for software and package
    into source and binary packages for end users. This process is quite simple and
    driven from a single file and optional patches that you create. This clear definition
    of "pristine" sources and your patches and build instructions eases the maintenance
    of the package as new versions of are released.


    ## 8.1 RPM Design Goals


    Before trying to understand how to use RPM, it helps to have an idea of what design
    goals are.


    **Upgradability** With RPM you can upgrade individual components without reinstalling.
    When a new version of a program comes out, such as Red Hat, you don''t necessarily
    have to start from scratch to compile it. Configuration files are preserved during
    upgrades.


    **Powerful Querying** RPM is also designed to have powerful querying options.
    You can search through your entire database for certain files to find what package
    belongs to and where it came from.


    **System Verification** Another powerful feature is the ability to verify packages.
    If you are worried that you deleted an important file, simply verify the package.
    At that point you will be notified of any anomalies.


    **Pristine Sources** A crucial design goal was to allow the use of pristine sources
    as distributed by the original authors. With RPM, you have the pristine sources
    along with patches that were used, plus build instructions. This is a big advantage
    for several reasons.


    This goal may only seem important for developers, but it results in higher quality
    software for end users too. We would like to thank the folks from the BOGUS distribution
    for originating the pristine source concept.


    ## Using RPM


    RPM has five basic modes of operation (not counting package building): installing,
    uninstalling, upgrading, querying, and verifying. This section contains an overview
    of each mode. For complete details and options try rpm --help, and see the rpm
    man page and the (previously mentioned) RPM book.


    ### 3.2.1 Installing


    RPM packages typically have file names like foo-1.0-1.i386.rpm, which includes
    the package name (foo), version (1.0), release (1), and architecture (i386). Installing
    a package is as simple as:


    ```

    $ rpm -ivh foo-1.0-1.i386.rpm

    foo

    ******************

    ```


    As you can see, RPM prints the name of the package (which is not necessarily the
    same as the file name, which could have been foo.rpm), and then prints a succession
    of hash marks as the package is installed, as a sort of progress meter. Installing
    packages is designed to be simple, but you can get a few errors:


    # Package Already Installed


    if the package is already installed, you will see:


    ```

    $ rpm -ivh foo-1.0-1.i386.rpm

    foo package foo-1.0-1 is already installed

    error: foo-1.0-1.i386.rpm cannot be installed

    ```


    if you really want to install the package anyway, you can use --replacepkgs on
    the command line, which tells RPM to ignore the error.

