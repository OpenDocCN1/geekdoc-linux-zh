    ## E.1 The Free Software Model


    Probably the best feature of Linux and the GNU utilities in general and Red Hat
    Linux in particular is that it is distributable under the terms of the GNU Public
    License (GPL). This feature has allowed research institutions, universities, commercial
    enterprises, and hackers, to develop and use Red Hat and related technologies
    co-operatively without fear that their work would someday be controlled and restricted
    by a commercial vendor.


    In short, the GPL changes the model of software development and distribution to
    one much like the model our Legal system and its industry. If a lawyer designs
    an argument that wins his case in front of the supreme court his reward is not
    only the fees he pays but also the additional clients that his achievement attracts
    to his practice. The "argument" he becomes available for any other lawyer to use
    without restriction, and in facts becomes part of our legal heritage.


    This new model is already a new industry with companies like Cygnus Support (see
    http://www.cygnus.com) becoming multi-million dollar enterprises on the deis of
    providing support and services for large commercial users of GPL and other "freely
    distributable" software. Red Hat Software, Inc.''s rapid growth is based, similarly,
    on our development and support of the Red Hat Linux distribution, a product that
    we distribute worldwide on CD and over the Internet under terms of the GPL.


    ## E.2 The evolution of "Free Software"


    The Unix operating system was also developed on a cooperative basis by AT&T with
    the active support of many universities and research establishments. Many of the
    early Unix contributors were disappointed when AT&T began in the late 1970s and
    1980s, to enforce their copyright terms over the use and distribution of Unix.
    This eventually resulted in the long and bitter legal battle between AT&T (and
    subsequently Novel who bought the Unix copyrights from AT&T in 1991) and the University
    of California at Berkeley. In a partial response to this problem of individual
    control of a public software development project, the Massachusetts Institute
    of Technology (MIT) in Cambridge, MA has, since 1984, supported Richard Stallman''s
    efforts to launch a movement in the software development. This resulted in the
    establishment of The Free Software Foundation (the FSF), and its GNU project.


    ## E.3 The GNU Public License


    GNU, which follows in an early Unix tradition of using recursive acronyms as program
    names, stands for Gnu''s Not Unix. The FSF continues to be head-quartered at MIT,
    GNU C++, Emacs, and many other products, many of which form substantial building
    blocks of the Linux operating system. Richard Stallman insists, that some justification,
    Linux should correctly be known as a GNU system.


    There are many other "free software" licenses that some of the code in Red Hat
    Linux has licensed under. The most of these are the University of California at
    Berkeley BSD License whereby the copyright holder remains the owner but where
    no restrictions on further distribution are imposed on the user of the code.


    Also coming from MIT, but not related to the FSF or the GPL, is the X Consortium,
    which is a Unix industry sponsored to build and maintain the X Window system.
    In turn, a group called the XFree86 Project has taken the responsibility to port
    the X Window System to the Internet platform. We have included copies of each
    of these licenses in the appendix of this manual for your convenience. Linux is
    continuing to progress very rapidly because of the contributions of this wide
    development effort, to which you and your company or school are encouraged to
    contribute.


    Red Hat Software, Inc. has chosen to license its code under the GPL for two reasons.
    One is that this is the easiest thing to do since the Linux kernel is licensed
    in this way and our code interacts with other GPL''d code sufficiently to make
    other Licensing scheme difficult. The other is for the purpose of cooperative
    development purposes we genuinely feel that the GPL is in fact the most effective
    format.


    The purpose of the GPL is much like any standard copyright license, to define
    what you can and cannot use the product for. However it differs substantially
    from commercial licenses because instead restricting your use of the software
    its purpose is to guarantee your use of the software.


    In no way restricts the use of standard commercially licensed software with Linux
    or other GPL''d code. Only the changes that you make to the code that you borrowed
    from someone else that was licensed under the GPL must be made available to others
    under the same unrestricted rules defined by the GPL. Any Red Hat and Freely Distributable
    Software-product that simply uses or operates on top of Linux can be-licensed
    under any commercial rules you chose.


    There are many leading commercial software developers who are actively supporting
    their commercial products on Linux for which you must purchase a license, such
    as Motif for the OSF, Empress RDBMS from Empress Software, WordPerfect, and recently
    Appixware - the Office Suite from Applic Inc. and Red Hat Software. You will find
    a complete copy of the GPL in section F.


    ## E.4 Will Linux Replace Commercial OSes?


    The huge development effort and wide distribution of the Linux OS will ensure
    that it takes its place as a real, viable, and significant alternative to commercially
    restricted operating systems. The open development model, availability of source,
    and of license restrictions are “features” of the Linux OS that commercial developers
    simply cannot offer. Software development groups who need this model include groups
    from government affiliated research organizations, to academic research and teaching
    projects, to commercial software application developers.


    The recent rapid increase in new applications becoming available for Linux and
    the rapidly growing user base of these technologies are causing even the largest
    industry organizations to take Linux seriously. Even Datapro (a McGraw-Hill Company)
    in their recent 1996 Survey of the UNIX industry concluded that “Programmers are
    taking a hard look at the visibility of Linux now that Linux costs less than Microsoft
    and has added benefits of UNIX, such as great performance, inherent tool sets,
    and communication capabilities”.


    The new distribution and development model that Linux, the GPL and other "freely
    distributable" software represent is already competing with the older commercially-restricted
    model. We are pleased that you are now part of.


    ## Red Hat Software, Inc.''s Role in Development


    Red Hat distribution is also issued under the GPL. We see our role making the
    Linux OS easy to install, configure, and maintain for professional developers,
    system administrators, and students. Red Hat Linux is available at cost and few
    restrictions (the GPL) from Red Hat Software and most Linux CD vendors.


    Red Hat Software, Inc. provides support for users of the Linux OS, from individuals
    running a single workstation to large organizations running hundreds of machines,
    in a variety of programs.


    We gratefully acknowledge the support that we have received from the Linux community
    including Linux Torvalds, everyone on the contributors list, and the thousands
    of other developers who helped make Linux what it is today. We would also like
    to acknowledge the growing contribution of commercial developers to our efforts
    including Digital Equipment Corporation, Reilly & Associates, Metro Linux Inc,
    and others. We are encouraged by Red Hat''s Linux distribution, to develop and
    add features, or simply package programs that you need or that you think others
    would appreciate. Please do not hesitate to contact us for any help you require.


    You can contact Red Hat Software directly at: info@redhat.com.


    # Further Reading


    There are Internet based listings of both the freely distributable and commercial
    software available for Linux in documents such as the Linux Journal, the Commercial
    HOWTO, the Linux Software Map, and from many Linux vendors, including Red Hat
    Software''s retail distribution. Many third party and commercial products can
    be purchased through Red Hat''s web site, including Motif, database development
    systems, editors, and more. Info can be obtained by sending a fax request to (919)
    2-6726, and the web site is located at http://www.redhat.com.


    For more information on Linux please see:


    - *Running Linux, M. Welsh, O''Reilly & Associates, 1995.

    '
