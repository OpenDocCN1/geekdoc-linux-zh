    - **IDE (ATAPI)** 大多数适用于 Intel 基础 PC 的 CD-ROM 驱动器都是 IDE（也称为 ATAPI）。如果选择此类型，安装程序将检查所有可用的
    CD-ROM 驱动器 IDE 设备。

    - **SCSI** 如果你的 CD-ROM 连接到支持的 SCSI 适配器，请选择此项；安装程序要求你选择 SCSI 驱动程序。选择与你的适配器最相似的驱动。如有必要，你可以为驱动指定选项；大多数驱动会自动检测你的
    SCSI 适配器。

    - **Other** 如果你的 CD-ROM 既不是 IDE 也不是 SCSI CD-ROM，就是“其他”。具有专用 CD-ROM 接口的声卡是这种类型的示例。安装程序将识别你的
    CD-ROM，一旦识别，将被要求插入辅助磁盘。转到第 49 页第 4 章继续安装 Red Hat Linux。


    ## 选择安装方法


    基于 NFS 和 FTP 的安装是相似的，因为两者都需要网络信息。因此，我们将它们放在一起讨论。高亮你偏好的安装方法并选择 OK。如果你要进行 NFS 安装，请跳到下一页的
    3.4.4。如果你要进行 FTP 安装，请继续阅读。


    ### 3.4.2 通过网络安装


    如果你打算从 NFS 服务的的文件系统安装 Red Hat Linux，请高亮“NFS image”并选择 OK。


    ### 3.4.3 通过 FTP 安装


    如果你打算从 FTP 站点安装 Red Hat Linux，请高亮“FTP”并选择 OK。在加载辅助磁盘时，安装程序将显示进度条。


    ### 3.4.4 安装 NFS


    如果你打算从 NFS 服务的的文件系统安装 Red Hat Linux，请选择。


    ### 3.4.5 网络驱动配置


    接下来，安装程序将探测你的系统并尝试识别你的网卡。大多数情况下，驱动可以自动定位网卡。如果它无法识别你的网卡，将被要求选择支持你网卡的驱动程序，并为驱动程序定位和识别网卡所需的任何选项。


