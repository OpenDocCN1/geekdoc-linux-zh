    ## 4.6 Selecting and Installing Packages


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_80_0.png)


    ### 4.6.1 Selecting Components


    Components group packages together according to the functionality they provide.
    For example, C Development, Networked Workstation, or Web Server. Select each
    component you wish to install and deselect Space (which can be found at the end
    of the component list) to install all packages included in Red Hat Linux (see
    Figure 4.15 on page 68).


    If you wish to select or deselect individual packages, choose Select individual
    packages.


    ### 4.6.2 Selecting Individual Packages


    After selecting the components you wish to install, you may select or deselect
    individual packages. The installation program presents a list of the package groups
    available; select a group to examine and press Enter. The installation program
    presents a list of the packages in that group, which you may select or deselect
    using Space (see Figure 4.16 on page 69). You may view a detailed description
    of a package by pressing F1. When you are finished selecting individual packages,
    press OK in the Select Group dialog box.


    **Please Note:** Some packages (such as the kernel and certain libraries) are
    required for every Red Hat Linux system and are not available to select or deselect.


    Continuing the Installation


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_81_0.png)


    Figure 4.13: Initializing Swap Space


    ### 4.6.3 Package Dependencies


    Many software packages, in order to work correctly, depend on other software packages
    or libraries that must be installed on your system. For example, many of the graphical
    Red Hat system administration tools require the python and pythonlib packages.
    To make sure your system has all the packages it needs in order to be fully functional,
    Red Hat Linux checks dependencies each time you install or remove software packages.


    After you have finished selecting packages to install, the installation program
    checks the list of selected packages for dependencies. If any package requires
    another package which you have not selected, the program presents a list of these
    unresolved dependencies and gives you the opportunity to resolve them (see Figure
    4.17 on page 69). If you simply press OK, the program will resolve them automatically
    by adding all required packages to the list of selected packages.


    ## 4.6 Selecting and Installing Packages


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_82_0.png)


    ### 4.6.4 Package Installation


    After all package dependencies are resolved, the installation program presents
    a dialog box telling you that a log file containing a list of all packages installed
    will be written to /tmp/install.log on your Red Hat Linux system. Select Ok and
    Space to continue.


    At this point, the installation program will format every partition you selected
    for formatting. This can take several minutes (and will take even longer if you
    directed the installation program to check for bad blocks).


    Once all partitions have been formatted, the installation program starts to install
    packages. A window entitled "Install Status" is displayed with the following information:


    - **Package** – The name of the package currently being installed.

    - **Size** – The size of the package (in kilobytes).

    - **Summary** – A short description of the package.

    - **Package Installation Progress Bar** – A bar showing how complete the current
    package installation is.


    Continuing the Installation


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_83_0.png)


    Statistics Section - This section has three rows labeled "Total", "Completed",
    and "Remaining". As you might guess, these rows contain statistics on the total
    number of packages that will be installed, statistics on the number of packages
    that have been completely installed, and statistics on the packages that have
    not yet been installed. The information tracked on these three rows includes:


    - Packages - The number of packages.

    - Bytes - The size.

    - Time - The amount of time.


    Overall Progress Bar - This bar changes color showing how close to completion
    the entire installation is.


    If you''re doing an FTP installation, a message box will pop up as each package
    is retrieved from the FTP site.


    At this point there''s nothing left for you to do until all the packages have
    been installed. How quickly this happens depends on the number of packages you''ve
    selected, and your computer''s speed. Once all the packages have been installed,
    please turn to the next chapter to finish your installation of Red Hat Linux.


    ## 4.6 Selecting and Installing Packages


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_84_0.png)


    Figure 4.16: Selecting Packages


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_84_1.png)


    Figure 4.17: Unresolved Dependencies


    # 5

    # Finishing the Installation


    ### 5.1 Configuring a Mouse


    Next, the installation program will probe your system and try to find a mouse.
    If one is found, a dialog box is displayed showing the port on which the mouse
    was found. Press Space to continue.


    If necessary you''ll be asked to give information about the mouse. If you wish
    to configure your mouse after you have booted, you may use the mouse configuration
    command.


    ### 5.2 Configuring Windows


    After setting up the mouse, the installation program asks if you want to configure
    Windows. If you choose No, your Red Hat Linux system will be a standalone workstation.
    If you choose Yes, you may configure networking as described below.


    ### 5.2.1 Configuring the X Server


    If you are installing from CD-ROM or from a local hard disk, the installation
    program asks if you want to configure networking. If you choose No, your Red Hat
    Linux system will be a standalone workstation. If you choose Yes, you may configure
    networking as described below.


    ### 5.2.2 Configuring an X86 Server


    If you are installing Red Hat Linux via NFS or FTP, you have already entered temporary
    networking information. The install program offers you three choices (see Figure
    5.1):


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_88_0.png)


    Figure 5.1: Network Configuration Options


    - **Keep this setup** - Keeps the network configuration you used during the installation.
    All the networking information you entered previously becomes part of your system''s
    permanent configuration.

