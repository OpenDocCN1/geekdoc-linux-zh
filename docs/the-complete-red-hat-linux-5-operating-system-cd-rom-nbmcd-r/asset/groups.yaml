    systems is available in several HOWTOS and Mini-HOWTOS, available on the Red Hat
    Linux CD in the doc/HOWTO and doc/HOWTO/mini directories. In particular, the Mini-HOWTOS
    whose name start with Linux+ are quite helpful.


    If Red Hat Linux/Intel will coexist on your machine with OS/2, you must create
    your disk partitions with the OS/2 partitioning software—otherwise, OS/2'
