    # 6.2 X Window Configuration with XFree86


    There are four methods for configuring XFree86 on your machine:


    +   - Xconfigurator

    - XF86Setup

    - xf86config

    - by hand


    Xconfigurator, XF86Setup, and xf86config are functional equivalents and should
    work equally well. If you are unsure of anything in this process, a good source
    of additional documentation is:


    http://www.xfree86.org


    Xconfigurator is a full-screen menu driven program that walks you through setting
    up your X server. XF86Setup is a graphical setup program distributed with XFree86
    which requires the VGA 16-color server in order to run. xf86config is a line oriented
    program distributed with XFree86. It isn''t as easy to use as Xconfigurator, but
    it is included for completeness. If these utilities fail to provide a working
    XF86config file, you may have an unsupported card or you may need to write the
    config file by hand. Usually the former is the case, so check and make sure your
    card is supported before attempting to write the config file yourself. If your
    card is not supported by XFree86 you may wish to consider a commercial X server,
    such as the Metro-X server which accompanies Red Hat Linux/Intel. If you have
    questions about whether or not your video card is supported you can check out
    http://www.xfree86.org for information on XFree86, and http://www.metrolink.com
    for information on Metro-X.


