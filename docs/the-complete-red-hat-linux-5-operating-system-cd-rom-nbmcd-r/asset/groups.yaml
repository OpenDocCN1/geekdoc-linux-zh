    and to change partition attributes. In addition, there are buttons that are used
    to accept the changes you''ve made, discard those, or exit Disk Druid entirely.
    Let''s take a look at each button in order.


    Add - The "Add" button is used to request a new partition. When selected, a dialog
    box will appear containing fields that must be filled in.


    Add NFS - This button is used to add a read-only NFS-served filesystem to the
    set of mount points on your Red Hat Linux system. When selected, a dialog box
    will appear containing fields that must be filled.


    Edit - The "Edit" button is used to modify attributes of the partition currently
    highlighted in the "Current Disk Partitions" section. Selecting this button will
    cause a dialog box to appear. Some or all of the fields in the "Edit Partition"
    box may be changed, depending on whether the partition information has already
    been written to disk or not.


    Delete - The "Delete" button is used to delete the partition currently highlighted
    in the "Current Disk Partitions" section. Selecting this button will cause a dialog
    box to appear asking you to confirm the deletion.


    Reset - This button is used to discard all changes you have made in Disk Druid,
    and return the list of partitions to those read from the partition table(s) on
    your hard disk(s). When selected, you''ll be asked to confirm whether you want
    the changes discarded or not. Note that any mount points you specified will be
    lost, and will need to be reentered.'
