    ## 11.6.1 Through LILO


    If your system boots, but does not allow you to log in when it has completed booting,
    you can use the single or emergency boot option. At the LILO boot prompt, type
    linux single in order to boot in single-mode. In single-user mode, local filesystems
    will be mounted, and your network will not be activated. In emergency mode, almost
    nothing will be set up. Only the root filesystem will be mounted, and it will
    be read-only.


    ## 11.6.2 Emergency Boot Diskettes


    The installation diskette can also be used as a rescue disk set. When you boot
    the boot diskette, type rescue at the boot prompt (on non-Intel platforms, add
    rescue as an option to the kernel you are booting, for example, linux rescue),
    and the install process will ask a few questions, request that you insert the
    second disk, and set up shells on VC 1 and VC 2. The shell that is running is
    ash, a minimal bourne shell with no history or command-line editing.


    The PATH environment variable is set so that once you have mounted your root partition
    /mnt, binaries from your root partition will be run if they do not exist on the
    diskette. Also, the libraries in /mnt/lib and /mnt/usr/lib will be used if needed.
    You may wish to change your PATH to not include /bin and /usr/bin, leaving /mnt/bin,
    /mnt/usr/bin, etc., while you are working on repairing your system. If you do
    that, you will need to use /bin/mount to unmount /mnt.


    Limited versions of important utilities are available before you /mnt:


    - mount The mount command does not require that the device node mounted already
    exist, and doesn''t require the full name of the device. It assumes ext2 filesystems
    unless told otherwise.


    ```

    mount /dev/sda1 /mnt -t ext2

    ```


    is functionally equivalent to


    ```

    mount sda1 /mnt

    ```


    - ash: The full version

    - cat: Does not accept any options


    ## 6 Rescue Modes


    - mod: The chmod command does not accept symbolic mode names, only octal ones.

    - io: The full version

    - fsck: The full version

    - disk: The full version

    - ip: The full version

    - nzip: The full version

    - smod: The full version

    - The full version

    - mod: Does not accept any options

    - dir: No GNU long options

    - e2fs: The full version

    - mod: The mod command does not accept symbolic mode names, only octal ones.

    - en: The full version

    - No GNU long options

    - mod: The full version

    - Symlink to ash


    ## Sandy Trick


    Have you ever rebuilt a kernel and, eager to try out your new handiwork, before
    running LILO? And you didn''t have an entry for an older kernel in lilo.conf?
    Read on...


    There''s a handy trick. In many cases, it''s possible to boot your Red Hat Linux/Intel
    Red Hat Linux boot diskette with your root filesystem mounted and ready. Here''s
    how:


    enter the following command at the boot diskette boot prompt:


    ```

    linux single root=/dev/hdXX initrd=

    ```


    (Replace the XX in /dev/hdXX with the appropriate letter and number for your root
    partition.)


    What does this do? First, it starts the boot in single-user mode, with the root
    partition set to your root partition. The empty initrd specification bypasses
    the installation-related image on the boot diskette, which will cause you to enter
    single-user mode immediately.


    Is there a downside to this trick? Unfortunately, yes. Because the kernel on the
    Red Hat Linux diskette only has support for IDE built-in, those of you with SCSI-based
    systems won’t be able to use this trick. In that case, you’ll have to use the
    boot diskette’s normal rescue mode (which also requires the supplemental diskette).


    ## Making Installation Diskettes


    sometimes necessary to create a diskette from an image file (for example, you
    need to use updated diskette images obtained from the Red Hat Linux).


    The name implies, an image file is a file that contains an exact copy (or image)
    of the diskette''s contents. Since a diskette contains filesystem information
    in addition to data contained in files, the image file is not usable until it
    has been written to diskette.


    To start, you''ll need a blank, formatted, high-density (1.44 MB), 3.5-inch diskette.

    You''ll need access to a computer with a 3.5-inch diskette drive, and capable
    of running a DOS program, or the dd utility program found on most Linux-like operating
    systems.


    image files are found in the following directories on your Red Hat Linux CD:


    - images-: Contains the boot and supplemental images for Red Hat Linux/Intel.


    If you''ve selected the proper image, it''s time to transfer the image file onto
    a diskette. As mentioned previously, this can be done on a DOS-capable system,
    or on a system running a Linux-like operating system.


    ## A.1 Making a Diskette Under MS-DOS


    To make a diskette under MS-DOS, use the rewrite utility included in the Red Hat
    Linux CD in the dosutils directory. First, label a blank, formatted 3.5-inch diskette
    appropriately (eg. "Boot Diskette", "Supplemental Diskette", etc). Insert it into
    the disk drive. Then, use the following commands (assuming your CD is d:):


    ```

    C:\> d:

    D:\> cd dosutils

    D:\dosutils> rewrite

    Enter disk image source file name: images\boot.img

    Enter target diskette drive: a:

    Please insert a formatted diskette into drive A: and press --ENTER--: Enter

    D:\dosutils>

    ```


    rewrite first asks you for the filename of a diskette image; enter the directory
    and name of the image you wish to write (for example, images\boot.img). Then rewrite
    asks for a diskette drive to write the image to; enter a:. Finally rewrite asks
    for confirmation that a formatted diskette is in the drive you selected. After
    pressing Enter, rewrite copies the image file onto the diskette. If you need to
    make another diskette, label another diskette and run write again, specifying
    the appropriate image file.


    ## A.2 Making a Diskette Under a Linux-like O/S


    To make a diskette under Linux (or any other Linux-operating system), you must
    have permission to write to the device representing a 3.5-inch diskette drive
    (known as /dev/fd0 under Linux). First, label a blank, formatted diskette appropriately
    (eg. "Boot Diskette", "Supplemental Diskette", etc). Insert it into the diskette
    drive (but don''t issue a mount command). After mounting the Red Hat Linux CD,
    change to the directory containing the desired image file, and run the following
    command:


    ```

    dd if=images/boot.img of=/dev/fd0 bs=1440

    ```


    If you need to make another diskette, label another diskette and run dd again,
    specifying the appropriate image file.


    ## General Parameters


    This appendix is provided to illustrate some of the possible parameters that may
    be used by drivers. It should be noted that, in most cases, these additional parameters
    are unnecessary.


    Please keep in mind that if a device you are attempting to use requires one of
    these parameters, and support for that device is not compiled into the kernel,
    the traditional method of adding the parameter to LILO command will not work.
    Modules require that these parameters are specified when the module is loaded.
    The Red Hat Linux installation program gives you the option to specify module
    parameters when a driver is loaded.


    More information concerning the device support compiled into the kernel, please
    refer to Section 2.6 on page 30.


    Of the more commonly used parameters, the hdx=cdrom parameter, can be used at
    the boot prompt, as it deals with support for IDE/ATAPI CD-ROMs.


    ## B.1 CD-ROM parameters


    | Hardware | Parameter |

    | --- | --- |

    | Mitsumi CD-ROM | mcd=port,irq |

    | Sony CDU 31 or 33 CD-ROM | cdu31a.port=base_addr cdu31a.irq=irq |

    | Aztec CD268 | aztcd=port |

    | SB Pro or 16 compatible | sbpcd=io_addr,sb.pro_setting |

    | ATAPI/IDE CD-ROM Drives | hdx=cdrom |


    Examples of the above would be:


    | Configuration | Example |

    | --- | --- |

    | non-IDE Mitsumi CD-ROM on port 340, IRQ 11 | mcd=0x340,11 |

    | Sony CDU 31 or 33 at port 340, no IRQ | cdu31a.port=0x340 cdu31a.irq=0 |

    | Aztec CD-ROM at port 220 | aztcd=0x220 |

    | ATAPI/CD-ROM, jumped as master on 2nd interface | hdx=cdrom |

    | Panasonic-type CD-ROM on a SoundBlaster at port 230 | sbpcd=0x230,1 |


    Please Note: Most newer Sound Blaster cards come with IDE interfaces. You do not
    need to use sbpcd parameters, only use hdx parameters.

