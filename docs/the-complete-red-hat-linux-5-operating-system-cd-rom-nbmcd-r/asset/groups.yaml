    # General Questions


    - Red Hat Linux 2.1 - Late Fall 1995

    - Red Hat Linux/AXP 2.1-Beta - Late Fall 1995

    - Red Hat Linux/AXP 2.1 - January 1996

    - Red Hat Linux 3.0.3 (Picasso) - March 1996

    - Red Hat Linux Rembrandt (beta) - August 1996

    - Red Hat Linux (Intel/Alpha/SPARC) 4.0 - October 1996

    - Red Hat Linux (Intel/Alpha/SPARC) 4.1 - January 1997

    - Red Hat Linux (Intel/Alpha/SPARC) 4.2 - May 1997

    - Red Hat Linux (Intel/Alpha/SPARC) 5.0 - December 1997


    ## 2.11 What hardware does Red Hat Linux support?


    For a current list of supported hardware, please see:

    http://www.redhat.com/hardware


    ## 2.12 Why won''t my Adaptec (274x, 284x) work?


    The Adaptec 274x and 284x are supported but may need to be reconfigured to work
    properly. It has been reported that the wide negotiation on these cards is not
    working, so it should be disabled.


    ## 2.13 What applications are there for Red Hat Linux?


    There are many applications for Linux available. Please see

    http://www.redhat.com/linux-info and go to the "Linux Applications and utilities"
    section. This section is maintained by a private individual that is not affiliated
    to Red Hat in any way. You will find information on nearly every product available
    for Linux on his pages.


    Red Hat Linux Frequently Asked Questions


    ## D.2.14 Does Red Hat Linux include source code?


    Yes. We include the exact source that that was used to build the distribution.
    From release 2.0 on, Red Hat Linux is built with a packaging system RPM that ONLY
    uses pristine source (the same as what you''d find at the author''s site) and
    possibly a patch by Red Hat Linux. Complete information on RPM is available on
    http://www.redhat.com.


    ## D.2.15 Does Red Hat Linux support UMSDOS installs?


    No. It is not a good performance idea.


    ## D.3 Installation Questions


    ## D.3.1 How do I get my IDE CD-ROM on my SB16 to work?


    The Creative Labs kit comes with the IDE Interface set to the third IDE port by
    default (IDE2, I think). This won''t work under Linux as it only recognizes two
    IDE ports. What you need to do is move a jumper on the card to configure it for
    IDE (the secondary IDE port). I''m not sure if you have to make changes under
    DOS for this configuration to work, but your manuals should help with this (it
    will still work, but you may have to edit a file or two).


    You may also have to specify command line parameters like:


    ```

    boot: linux hdX=cdrom

    ```


    If you have one IDE drive, X is most likely "b" in this case (ie "linux hdb=cdrom")
    If you have two, then it will be "c".


    ## D.3.2 How do I run the install program again?


    Reboot your machine using the disk that you made for the installation. You will
    most likely need to completely reinstall your system.


    ## 3 Installation Questions


    you just want to reconfigure networking or install more packages, try using the
    control-panel tools.


    ## 3.3 Why am I missing some programs?


    by doing a ''df'' at the shell prompt. If you have "/" or "/usr" showing up as
    100% used, the chances are your partition was too small for the entire install.
    Unfortunately, this does not result in any type of error messages unless you are
    watching closely which most people don''t when the thing you it is to take 2 hours
    to install (-). You will most likely need to reinstall and do one of things: a)
    make your root or "/usr" larger or b) install fewer packages.


    Also, if none of the partitions you made for Linux is full, you are probably just
    missing some packages. You will need to use glint or rpm to install those.


    ## 3.4 How do I mount my CD-ROM?


    if you installed from CD-ROM, you should be able to do:


    ```

    mount /mnt/cdrom

    ```


    if you get an error that says the mount point does not exist, do:


    ```

    dir /mnt/cdrom

    ```


    if you did an install via NFS: You need to know what type of CD-ROM you have.
    The best way is to watch the boot messages as you reboot, or look at /var/adm/messages
    (more /var/adm/messages). You most likely have an IDE CD-ROM that will show up
    as /dev/hdc or /dev/hdd, or you have a Soundaster type that is /dev/sbpcd, or
    you have a SCSI device that is /dev/scd0.


    in any case, you can do the following:


    ```

    mount -t iso9660 /dev/xxxx /mnt/cdrom

    ```


    substitute xxxx for YOUR DEVICE. You can then: cd /mnt/cdrom and then you will
    be looking at the contents of the CD-ROM.


    ## D.3.5 Why does Linux only see part of my RAM?


    There are a couple of things that could be wrong. On some motherboards, you need
    to limit memory to 16M. I''m not sure what the option is, but you can find it
    in /etc/lilo.conf. You may need to add "mem=32M" to append. If that works, you
    can delete it.


    ```

    append "mem=32M"

    ```


    ## D.3.6 How do I install MSDOS?


    You can''t. None of the current Red Hat releases support UMSDOS. If you want to
    use it, you must backup your data first. The second choice is to use a different
    partition.


    ## D.3.7 How do I use the system that comes with Red Hat?


    Please see http://www.redhat.com.


    ## 3.8 Why can''t I get into Linux now that I''ve installed it?


    you need to boot Linux off a floppy and run fdisk. That should show you your partition
    size.


    ## 3.9 Why does my video card do odd things under X?


    if you experience problems with XFree6, you may need to check /etc/X11Config.


    ## 3.10 Where can I find a list of known problems?


    find solutions to known problems, please see:


    http://www.redhat.com/errata


    look for both a “General Errata” page and a platform-specific Errata page for
    your version of Red Hat.


    ## 3.11 I installed Xwm, now how do I use it?


    to get the startx command to use Xwm instead of XFree6 you must make /etc/X11/X
    a symbolic link to /usr/X11R6/bin/Xwm:


    ```

    rm /etc/X11/X

    ln -s ../../usr/X11R6/bin/Xwm /etc/X11/X

    ```


    ## D.4 Using Red Hat Linux


    ## D.4.1 Why doesn''t the xmh shipped with Red Hat work properly?


    We only ship xmh because it is part of the standard X11 distribution, and it is
    basically shipped as-is and broken. We''ve found that there are several better
    alternatives. If you want to use mh mail, install the mh RPM and the exmh RPM.
    exmh is a much better GUI mail reader than xmh


    ## D.5 Copyright Notice


    This document is Copyright (C) 1997 by Red Hat Software. Redistribution of this
    document is permitted as long as the content remains completely intact and unchanged.
    In other words, you may reformat and reprint or redistribute it.


    # Red Hat Freely Distributable Software.


    ## 0.1 Red Hat History


    linux, like Unix itself, is a very modular operating system. The skills required
    to select, compile, link, and install, the various components that are needed
    for a complete Linux OS are beyond the experience of most people who might want
    to use Linux. The various Linux distributions go a long way towards solving this
    for the average Linux user, but most do not address the problem of how to upgrade
    your Linux system once you get it successfully installed. Most users found it
    easier to delete their whole Linux system and reinstall from scratch when they
    needed to upgrade.


    The Red Hat distribution makes Linux easier to install and maintain by providing
    the user with advanced package management, graphical (point and click!) system
    installation and control, and system administration tools.

    '
