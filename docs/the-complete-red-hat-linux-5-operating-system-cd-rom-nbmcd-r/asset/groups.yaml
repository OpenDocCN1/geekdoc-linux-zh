    resolution.


    Each graphics card configuration consists of five elements:


    +   - The graphics card (make and model).

    - The number of colors supported on screen simultaneously (color depth).

    - The virtual resolution of the screen (width x height).

    - The physical resolution of the screen (width x height).

    - The screen refresh rate (Hz).


    Non-interlaces modes give a better screen appearance than refresh rates which
    are labeled "Interlaced". The highest refresh rate that your monitor supports
    will give the best image. At higher resolutions a higher refresh rate is particularly
    important to prevent the screen from visibly flickering. The highest refresh rate
    supported by the selected monitor is automatically displayed. Graphics Card'
  - '[PAGE 115]


    The default graphics card setting is IBM VGA.


    2. Press Tab to display the list of graphics cards.


    3. Press Tab or Tab to scroll to your graphics card entry, then press Enter to
    select it.


    4. Press Tab to move to the next field.


    # Colors


    Not all graphics cards can support all color depths (number of colors). Only the
    options for the color depths supported by your card will be sensitive in this
    field. The other options will be gray out.


    +   - Only one color option can be selected (due to design limitations of X).


    +   - In some cases the color options available will be limited by the physical
    resolution(s) you choose, based on the capabilities of your graphics card. Not
    all color depths are available at high resolutions.


    +   1. The default setting setting is at the lowest value for your card.


    +   2. Decide which available color setting you want to use.


    +   3. Press Tab to move to that color setting, then press Enter to select it.
    (The previous setting will be canceled.)


    +   4. Press Tab to move to the next field.


    # Virtual Resolution


    The Virtual Resolution setting allows you to have an on-screen work area that
    is actually larger than your physical screen. Windows can extend beyond the screen''s
    physical boundaries and are viewed by scrolling into the extended areas. Only
    the options for the virtual resolutions supported by your card will be sensitive
    in this field. The other options will be gray out. If you don''t want to use this
    feature, select the Disabled option.


    +   - Only one virtual resolution can be selected.'
  - '[PAGE 116]


    # X Window Configuration with Metro-X


    +   * In some cases the virtual-resolution options available will be limited by
    the physical resolution(s) you choose, since the virtual resolution must always
    be greater than the highest physical resolution.


    +   - The default setting for virtual resolution is *Disabled*.

    - Decide which available virtual resolution you want to use.

    - Press `Tab` to move to that setting, then press `Enter` to select it. (The previous
    setting will be canceled.)

    - Press `Tab` to move to the next field.


