    error: foo-1.0-1.i386.rpm cannot be installed

    ```


    To cause RPM to ignore that error, use --replacefiles on the command line.


    ## Unresolved Dependency


    RPM packages can “depend” on other packages, which means that they require other
    packages to be installed in order to run properly. If you try to install a package
    for which there is an unresolved dependency, you''ll see:


    ```bash

    $ rpm -ivh bar-1.0-1.i386.rpm

    failed dependencies:

    foo is needed by bar-1.0-0

    ```


    To handle this error you should install the requested packages. If you want to
    force the installation anyway (a bad idea since the package probably will not
    run correctly), use --nodeps on the command line.


    ## 8.2 Uninstalling


    Uninstalling a package is just as simple as installing:


    ```bash

    $ rpm -e foo

    ```


    Notice that we used the package name “foo”, not the name of the original package
    file “foo-1.0-1.i386.rpm”.


    You can encounter a dependency error when uninstalling a package if some other
    installed package depends on the one you are trying to remove. For example:


    ```bash

    $ rpm -e foo

    removing these packages would break dependencies:

    foo is needed by bar-1.0-1

    ```


    to cause RPM to ignore that error and uninstall the package anyway (which is a
    bad idea since the package depend on it will probably fail to work properly) use
    --nodeps on the command line.


    ## 2.3 Upgrading


    Upgrading a package is almost just like installing.


    ```bash

    $ rpm -Uvh foo-2.0-1.i386.rpm foo

    ```


    What you don''t see above is the fact that RPM automatically unalls old versions
    of the package. In fact you may want to always use -U to install packages, since
    it works fine even if there are no previous versions of the package installed.


    Since RPM performs intelligent upgrading of packages with configuration files,
    you may see a message like:


    ```text

    saving /etc/foo.conf as /etc/foo.conf

    ```


    This means that your changes to the configuration file in the package are saved
    with the new one. You should investigate and resolve the differences between the
    two files as soon as possible to ensure that your system continues properly.


    Since upgrading is really a combination of uninstalling and installing, plus one
    more: If RPM thinks you are trying to upgrade a package with an older version
    number, you will see:


    ```bash

    $ rpm -Uvh foo-1.0-1.i386.rpm

    error: foo-2.0-1 (which is newer) is already installed

    ```


    to cause RPM to upgrade anyway, use --old on the command line.


    ## 8.2.4 Querying


    Querying the database of installed packages is accomplished with rpm -q. A simple
    use is rpm -q foo which will print the package name, version, and release number
    of the installed package:


    ```bash

    $ rpm -q foo

    ```


    Instead of specifying the package name, you can use the following options with
    -q to specify what package(s) you want to query. These are called Package Options:


    - -a queries all installed packages.

    - -f <file> queries the package owning <file>.

    - -F is the same as -f except it takes filenames via stdin (e.g. find /usr/bin
    | rpm -QF).

    - -p <logfile> queries the package <logfile>.

    - -P is like -p except it takes filenames from stdin (e.g. find /mnt/cdrom | rpm
    -QF).


    There are a number of ways to specify what information display about queried packages.
    The following options are used to select the information you are interested in.
    These are called Information Options:


    - -i displays package information such as name, description, release, size, build
    date, install date, vendor, and other miscellaneous information.

    - -l displays the list of files that the package “owns”.

    - -s displays the state of all the files in the package. There are only two states,
    normal and missing.

    - -d displays a list of files marked as documentation (man pages, info pages,
    etc.).

    - -c displays a list of files marked as configuration files. These are the files
    you change after installation to adapt the package to your system (sendmail.cf,
    passwd, inittab, etc.).


    For options that display file lists, you can add -v to your command line to see
    the lists in a familiar ls -l format.


    ## 2.5 Verifying


    Verifying a package compares information about files installed from a package
    with the same information from the original package. Among other things, it compares
    the size, MD5 sum, permissions, type, owner and group of each file.


    -V verifies a package. You can use any of the Package Selection Options listed
    to specify the packages you wish to verify. A simple use is rpm -V verifies that
    all the files in the foo package are as they were originally installed. For example:


    - To verify a package containing particular file:

    ```bash

    rpm -Vf /bin/vi

    ```


    - To verify ALL installed packages:

    ```bash

    rpm -Va

    ```


    - To verify an installed package against an RPM package file:

    ```bash

    rpm -Vp foo-1.0-1.i386.rpm

    ```


    This can be useful if you suspect that your RPM databases are corrupt. If verified
    properly there will be no output. If there are any discrepancies they will be
    displayed. The format of the output is a string of 8 characters, possible "c"
    denoting a configuration file, and then the file name. Each of the characters
    denotes the result of a comparison of one attribute of the file to the value of
    that attribute recorded in the RPM database. A single "." means the test passed.
    The following characters denote failure of certain tests:


    - MD5 checksum

    - File size

    - Symbolic link

    - F modification time

    - D Device

    - U User

    - G Group

    - M Mode (includes permissions and file type)


    If you see any output, use your best judgment to determine if you should remove
    or reinstall the package, or somehow fix the problem.


