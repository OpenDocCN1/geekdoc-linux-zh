- md: '

    # Multiple-Screen Configuration


    Metro-X supports up to four screens which can all be controlled simultaneously
    with a single keyboard and mouse. This allows you to run many applications without
    overlapping windows, and is particularly useful for image-processing work. For
    each screen used, a separate configuration must be created for that screen''s
    monitor and graphics card. See section C.1.4 for graphics card requirements.


    # Adding a Screen


    Metro-X defaults to a single-screen setup. The first screen configured is labeled
    Screen 0. When you add a second screen, all of its configuration defaults will
    duplicate the current settings of Screen 0. So if your hardware is the same on
    all screens, you can save time by configuring Screen 0 before adding the other
    screens. Similarly, as more screens are added, the settings of whichever one is
    currently active when you add another screen will determine the default settings
    of the new screen.


    - 1. Press Alt-S to display the Screen pull-down menu.

    - 2. Type A for Add.

    - 3. The Monitor and Graphics Card icons for Screen 0 become outlines, and two
    full-color icons appear for Screen 1.

    - 4. Refer to the procedures described earlier in this chapter if any changes
    need to be made to the new screen''s configuration.

    - 5. Use the Page Down and Page Up keys to move to the configuration pages of
    each screen.


    # Deleting a Screen


    When a screen is deleted, all screens with higher screen numbers immediately drop
    down one slot. For instance: You have screens 0, 1, and 2 configured and you delete
    screen 1. That screen and all of its configuration information disappears. Screen
    2 then becomes screen 1, but retains its own configuration. You are left with
    screens 0 and 1.


    # X Window Configuration with Metro-X


    - 1. Use the Page Down or Page Up key to activate the set of icons for the screen
    you want to delete.

    - 2. Press Alt-S to display the Screen pull-down menu.

    - 3. Type D for Delete.

    - 4. One set of Monitor and Graphics Card icons disappears. Higher-numbered screens
    (if any) immediately fill the gap of the deleted screen.


    # Layout


    The Screen Layout window lets you specify how the multiple screens are arranged
    in your workspace so mouse movement from screen to screen will be appropriate.


    - 1. Press Alt-S to display the Screen pull-down menu.

    - 2. Type L for Layout.

    - 3. The Screen Layout window appears.

    - 4. Press Ctrl and Alt to view the various layout combinations for your screens.

    - 5. When the layout you want is displayed, press Enter to select it.


    # Font Path


    needed, you can edit your font path from within the Metro-X Configuration utility.
    This will be necessary if you are using a font server instead of or in addition
    your existing fonts.


    - 1. Press Alt-C to display the Configuration pull-down menu, then press Enter.

    - 2. The Font Path window appears.

    - 3. Edit the file as necessary for your system. Metro-X looks for fonts in the
    order in which the directories are listed in this file. If you are using a font
    server, enter this as the first line:


    ```

    tcp/<fontserver machine>:7000

    ```


    # Post Installation Configuration


    If your port number is not the default 7000, change it to the appropriate port
    number for your system.


    - 4. Press Tab to move to and amongst the bottom buttons, press Enter to select
    one. If the information is correct, select the OK button. If you want to disregard
    the changes you''ve made, select the Cancel button. If you''ve edited your font
    path and want to go back to the original settings, select the Load Defaults button.


    # Save and Exit


    - 1. Press Alt-F to display the File pull-down menu.

    - 2. Type S for Save and Exit.

    - 3. Your changes are saved, the Metro-X Configuration Utility closes, and your
    system is now ready to run Metro-X!


    # Quit Without Saving


    - 1. Press Alt-F to display the File pull-down menu.

    - 2. Type Q for Quit.

    - 3. A precautionary dialog box appears: Save current configuration before exiting!

    - 4. Press Tab to move to the No button, press Enter to confirm that you want
    to exit the Metro-X Configuration Utility without saving your changes.


    For more details on features of Metro X and the format of the Xconfig file see
    Appendix C.


    # 6.4 Mouse configuration


    To configure your mouse (or reconfigure your mouse after installation) enter the
    command /usr/sbin/mouseconfig. Scroll down the list with the arrow keys until
    your mouse type is highlighted. If you have any mouse connected to a PS/2 style
    port you should select PS/2 as your mouse type. If you have a mouse-connected
    to a mouse port on an ATI video card you should select ATI Bus Mouse.


    # 5.5 Sendmail


    have a 2 button mouse and want to emulate the third (middle) mouse button with
    a simultaneous click of the left and right mouse buttons use Tab to move to the
    cursor to the Emulate 3 Buttons checkbox and press Spacebar to toggle the selection.


    # 6.5 Sendmail


    a default sendmail.cf file will be installed in /etc/. The default configuration
    should work for most SMTP-only sites. it will not work for UUCP sites; you will
    generate a new sendmail.cf if you need to use UUCP mail transfers. no generate
    a new sendmail.cf if you need to install m4 and the sendmail source package. Read
    the README file in the sendmail sources for more details in creating sendmail
    configuration files. Also, O''Reilly & Associates publishes a good sendmail reference
    entrusted by Bryan Costales.


    One common sendmail configuration is to have a single machine act as a gateway
    for all the machines on your network. For instance, Red Hat Software have a machine
    mail.redhat.com that does all our mail. On that machine we simply need to add
    the names of machines for which mail.redhat.com will receive and handle to /etc/sendmail.cf.
    Here is an example:


    ```

    # sendmail.cw - include all aliases for your machine

    # here.

    torgo.redhat.com

    poodle.redhat.com

    devel.redhat.com

    ```


    then on the other machines, torgo, poodle, and devel, we need to edit /etc/sendmail.cf
    to "masquerade" as mail.redhat.com when sending mail, to forward any local mail
    processing to redhat.com. Find the DR and DM lines in /etc/sendmail.cf and edit
    them thus:


    ```

    # who I send unqualified names to

    # (null means deliver locally)

    DRmail.redhat.com

    ```


    ```

    # who I send unqualified names to

    # (null means deliver locally)

    DRmail.redhat.com

    ```


    ```

    # who I send unqualified names to

    # (null means deliver locally)

    DRmail.redhat.com

    ```


    ```

    # who I send unqualified names to

    # (null means deliver locally)

    DRmail.redhat.com

    ```


    ```

    # who I send unqualified names to

    # (null means deliver locally)

    DRmail.redhat.com

    ```


    With this configuration, all mail sent from redhat.com will appear as if it were
    sent from DMredhat.com. Please be aware that if you configure your system masquerading
    as redhat.com, any mail will be sent to redhat.com.


    ```

    DMredhat.com

    ```


    This configuration allows all connections from redhat.com machines. It also allows
    talk, finger, and ftp requests from all machines.


    ```

    ALL: redhat.com

    in.talked: ALL

    in.fingerd: ALL

    in.ftpd: ALL

    ```


    # 6.6 Controlling Access to Services


    A security measure, most network services are managed by a protective program
    called TCP wrapper. The protected services are those listed in /etc/inetd.conf
    that specify /usr/sbin/tcpd. tcpd can allow or deny access based on the origin
    of the request, using /etc/hosts.allow and /etc/hosts.deny. By default Red Hat
    Linux allows all services. Here is an example:


    ```

    ALL: redhat.com

    in.talked: ALL

    in.fingerd: ALL

    in.ftpd: ALL

    ```


    tcpd allows much more sophisticated access control, using a combination of /etc/hosts.allow
    and /etc/hosts.deny. Read the tcpd(8) and hosts.access man pages for complete
    details.


    # Anonymous FTP


    # Anonymous FTP


    Setting up anonymous FTP is simple. All you need to do is install the anon-ftp
    package (which you may have already done at install time). Once it is installed,
    anonymous FTP will be up and running. There are a few files you might wish to
    edit to configure your FTP server.


    /etc/ftpass This file defines most of the access control for your ftp server.
    Some of the things you can do are: set up logical “groups” to control access from
    different sites, limit the number of simultaneous connections, configure transfer
    logging, and much more. Read the ftpass man page for complete details.


    /etc/fhosts The fhosts file is used to allow or deny access to certain accounts
    from various hosts. Read the fhosts man page for details.


    /etc/ftusers This file lists all the users that are not allowed to ftp into your
    machine. For example, root is listed in /etc/ftusers by default. This means that
    you cannot ftp to your machine and log in as root. This is a good security measure,
    but some administrators prefer to remove root from this file.


    # World Wide Web


    The world wide web is one of the hottest aspects of the Internet today. Red Hat
    lets you get in on the action in two ways – as a web browser, and as a web server.
    Let''s look at both.


    # World Wide Browsers


    A variety of web browsers are available for Linux, including freely distributable
    browsers such as arena, lynx, and grail. The most popular commercial browsers
    are those from Netscape Communications Corporation. It is available for evaluation
    and non-commercial use from their ftp site:


    ```

    http://www.netscape.com/download/client.download.html

    ```


    It is also available in two fully licensed versions directly from Netscape.

