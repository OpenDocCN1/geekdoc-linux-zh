    ## 9.1.4 Editing an Existing Group


    To edit an existing group, double-click on the group in the main window, click
    on the group and then on View/Edit. The same interface is used to edit an existing
    group as to create a new group.


    ## 9.2 File System Configuration


    The file system configuration tool shown in Figure 9.4 allows you to easily examine
    and manipulate file system mount points, types, options, etc. It is very useful
    for manipulating a large number of file systems. You probably won''t want to do
    this unless you are an experienced system administrator. If you know what you
    are doing, it should be fairly straightforward as to how to mount, unmount and
    add devices.


    The Reload entry in the FSM menu causes the file system configuration tool to
    reload /etc/fstab from your hard drive. If you edit /etc/fstab by hand while the
    file system configuration tool is running (which you shouldn''t do), you probably
    want to reload.


    To use the buttons along the bottom of the window, select a filesystem in the
    main window, and click on one of the buttons. The buttons perform the following
    functions:


    - **Info**: Displays information on the filesystem, including the device, partition
    type, filesystem type, mount point and options, size, percent used etc.

    - **Check**: Performs a filesystem check (fsck) on the partition. You can do this
    only on unmounted partitions — if the partition is mounted, you will get an error
    and you will have to unmount it first.

    - **Mount**: Mounts the selected filesystem.

    - **Unmount**: Unmounts the selected filesystem.

    - **Format**: Creates a new filesystem on the selected partition. This will erase
    all data on the selected partition! You can do this only on unmounted partitions
    — if the partition is mounted, you will get an error and you will have to unmount
    it first.


    ## Printer Configuration


    - **Edit**: Brings up a dialog box where you can edit the mount point, mount options,
    comment, etc.


    ## 2.1 Adding NFS Mounts


    To mount a filesystem via NFS, select Add Mount from the NFS menu. A dialog box
    will appear and you will have to fill in the following values:


    - **Device**: Enter the host name and path, separated by a colon. For example,
    foo.bar.com:/usr/exported indicates the /usr/exported directory on foo.bar.com.

    - **Mount Point**: Enter the directory on your machine where you want to mount
    the NFS filesystem. For example, /mnt/foo.

    - **Options**: Enter the mount options for this filesystem. The default is soft,
    intr, rw. The rw means the filesystem is read-write, and soft, intr are options
    that make your system a little more resilient when the remote server goes down.
    See the mount man page for a complete list of available options.

    - **Comment**: This optional field can be used to store a small comment.


    Filling everything out properly, click on OK. At this point the entry is made
    in /etc/fstab, but the filesystem is not actually mounted. To mount it, select
    in the main window and click on Mount.


    ## 2.3 Printer Configuration


    The printer configuration tool (printtool) maintains /etc/printcap, print tool
    directories, and print filters. The filters allow you to print many different
    types of files, including:


    - plain text (ASCII) files

    - PostScript files

    - TeX.dvi files


