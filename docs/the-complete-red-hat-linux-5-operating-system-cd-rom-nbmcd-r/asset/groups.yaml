    # 5.2.2 Configuring an XFree86 Server


    If you wish to use XFree86, the installation program launches the Xconfigurator
    utility, which is described in detail in Section 6.2 on page 92.


    Xconfigurator first probes your system in an attempt to determine what type of
    video card you have. Failing that, Xconfigurator will present a list of video
    cards. Select your video card from the list and press Enter. If your video card
    does not appear on the list, XFree86 may not support it. However, if you have
    technical knowledge about your card, you may choose Unlisted and attempt to configure
    it.


    Once you have selected your video card, the installation program installs the
    appropriate XFree86 server, and Xconfigurator presents a list of monitors. If
    your monitor appears on the list, select it and press Enter. Otherwise, select
    Custom. If you select Custom, Xconfigurator prompts you to select the horizontal
    sync range and vertical sync range of your monitor (these values are generally
    available in the documentation which accompanies your monitor, or from your monitor''s
    vendor or manufacturer).


    > Note: It is not recommended to select a monitor "similar" to your monitor unless
    you are certain that the monitor you are selecting does not exceed the capabilities
    of your monitor. If you do so, it is possible you may overclock your monitor and
    damage or destroy it.


    Next, Xconfigurator prompts you for the amount of video memory installed on your
    video card. If you are not sure, please consult the documentation accompanying
    your video card. It will not damage your video card by choosing more memory than
    is available, but the XFree86 server may not start correctly if you do.


    If the video card you selected might have a video clockchip, Xconfigurator presents
    a list of clockchips. The recommended choice is No Clockchip Setting.'
