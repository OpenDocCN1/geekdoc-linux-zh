    # 1.1.1 Automatic Probing of PCI devices


    The installation program can probe computers with PCI devices. If desired, auto-probing
    can be disabled by running the installation in expert mode (see Section 1.1.2


    # 1.1.2 Expert Installation Mode


    By entering expert at the initial boot : prompt, you can run the installation
    pro-gram in expert mode. Expert mode causes the installation program to revert
    to an installation style very similar to that used with Red Hat Linux 4.2. This
    means most of the new auto-probing code is replaced with dialog boxes that prompt
    the user to manually enter device information. These dialog boxes also include
    a field allowing the user to enter options to be passed to the driver module loaded.
    Therefore, if a particular hardware configuration requires module options, an
    expert-mode installation should be used.


    # 1.1.3 Kickstart Installation Mode


    It''s possible to automate Red Hat Linux installations by using kickstart mode.
    In-stead of asking the user questions during the installation, kickstart mode
    reads a file that contains all the information necessary to install Red Hat Linux.
    This is handy when installing many similarly-configured systems. For more information
    on kickstart mode, please read /doc/README.ks on the Red Hat Linux CD-ROM.


    # 1.1.4 Configuring Partitions and Mount Points


    In the past, the installation program used fdisk to set up disk partitions, and
    a series of dialog boxes to define mount points. While that functionality is still
    available in Red Hat Linux 5.0, there is an alternative. Disk Druid provides both
    mount point definition and partition configuration in one concise screen. In-dition,
    Disk Druid supports the concept of “growable partitions” – partitions that can
    grow beyond a minimum size to allocate all remaining space on a hard disk.


    For more information on Disk Druid, please refer to Section 4.3.1 on page 52.'
