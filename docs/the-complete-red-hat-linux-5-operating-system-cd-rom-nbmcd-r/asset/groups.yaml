    no power reduction.

    - Standby Mode - First phase of DPMS, which provides moderate power reduction
    by disabling the horizontal sync signal to the monitor.

    - Suspend Mode - Second phase of DPMS, which provides significant power reduction
    by disabling the horizontal sync signal to the monitor.

    - Monitor Off - Final phase of DPMS, which provides maximum power reduction by
    disabling both the horizontal and vertical sync signals to the monitor.


    + 1. In the X Screen Saver Delay field, press Enter to toggle this option on or
    off.

