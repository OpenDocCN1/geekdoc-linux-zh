    注意：Red Hat Linux/Intel CD-ROM 也可以通过支持启动 CD-ROM 的较新计算机启动。并非所有计算机支持此功能，因此，如果你无法从
    CD-ROM 启动，则必须使用启动磁盘（或从 DOS 重启）来开始。


    ## 开始安装


    启动后，安装程序将开始询问你是否使用彩色显示器（见图 3.2）。默认选择“Yes”——你应该看到光标或“Yes”按钮被高亮。如果你没有看到光标或高亮，按一次
    Tab 键选择“No”，然后按 Enter 确认。


