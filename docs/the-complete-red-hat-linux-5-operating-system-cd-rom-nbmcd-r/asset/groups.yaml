    ## 3.4 选择安装方法


    ### 3.4.6 配置 TCP/IP 网络


    在安装程序配置完您的网卡后，它会显示几个对话框供您配置系统的 TCP/IP 网络。图 3.6 包含了网络配置信息的示例。


    | 字段 | 示例值 |

    | :--- | :--- |

    | IP 地址 | 10.0.2.15 |

    | 子网掩码 | 255.255.255.0 |

    | 默认网关 | 10.0.2.254 |

    | 主 DNS 服务器 | 10.0.2.1 |

    | 域名 | redhat.com |

    | 主机名 | pooh.redhat.com |


    图 3.6：示例网络信息


    请注意，图 3.6 中的信息仅为示例！您应该从网络管理员处获取正确的信息。


    第一个对话框要求您输入 IP 和其他网络地址（参见下一页图 3.7）。输入您在安装期间使用的 IP 地址并按回车。安装程序会尝试根据您的 IP 地址猜测子网掩码；如果掩码不正确，您可以进行修改。按回车。安装程序会根据您的
    IP 地址和子网掩码猜测默认网关和主 DNS 服务器地址；如果不正确，您可以进行修改。


    如果您的局域网有启动服务器，且您已经为要安装 Red Hat Linux 的计算机添加了条目，可以勾选“使用 Bootp”复选框。


    无论哪种，选择 OK 继续。


    在第一个对话框之后，您可能会看到第二个对话框。它将提示您输入域名、主机和其他网络信息（参见第 45 页图 3.8）。输入系统的域名并按回车，安装程序会将域名带到主机名字段。在域名之前输入您正在使用的主机名，以形成完全限定域名
    (FQDN)。如果您的网络有多个 DNS 服务器，您可以在“备用 DNS 服务器”和“三级 DNS 服务器”字段中输入附加服务器的 IP 地址。选择 OK
    继续。


    # 开始安装


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_59_0.png)


    图 3.7：配置 TCP/IP


    如果您正在进行 FTP 安装，请回到第 41 页的第 3.4.3 节，从上次继续。如果您正在进行 NFS 安装，请继续阅读。


    ### 3.4.7 NFS 服务器信息


    下一个对话框要求提供 NFS 服务器的信息（参见第 49 页图 3.9）。输入您的 NFS 服务器的名称或 IP 地址，以及包含 Red Hat Linux
    CD 的导出目录的名称。例如，如果 NFS 服务器将 Red Hat Linux CD 挂载在 /mnt/cdrom，则在 Red Hat Linux 目录中输入
    /mnt/cdrom。如果 NFS 服务器导出的是 Red Hat Linux 安装的镜像而非 CD，请输入包含 RedHat 目录的目录。例如，如果您的
    NFS 服务器包含 /mirrors/redhat/i386/RedHat 目录，请输入 /mirrors/redhat/i386。


    稍等后，将下一个对话框。转到第 49 页的第 4 章继续安装 Red Hat Linux。


    ### 3.4.8 从硬盘安装


    如果您将从本地连接的硬盘安装 Red Hat Linux，请高亮“hard drive”（硬盘）并选择 OK。


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_60_0.png)


    图 3.8：配置网络


    在启动安装程序之前，您必须先将所有必要文件复制到本地连接硬盘的一个分区上。如果您尚未这样做，请参考第 23 页的第 2.3.5 节。从硬盘安装需要辅助盘片；如果提示要求插入，请将其插入计算机的软驱驱动器并选择
    OK。在加载辅助盘片时将显示进度条。


    接下来，转到第 49 页的第 4 章，并按照那里的说明操作直到包括第 63 页的第 4.4 节。然后返回此处。


    此时，您已经执行了以下步骤：


    - 选择了安装。

    - 加载了计算机上任何 SCSI 设备的支持。

    - 使用 Disk Druid 或 edisk 设置了磁盘分区和挂载点。

    - 识别了可用的交换分区并对其进行了初始化。


    此时，将显示一个名为“Select Partition”（选择分区）的对话框（参见第 47 页图 3.10）。输入存放 RedHat 目录树的分区的设备名称。还有一个标记为“Directory”（目录）的字段。如果
    RedHat 目录不在分区的根目录下（例如 /test/new/RedHat），请输入 RedHat 目录的路径（在我们的示例中为 /test/new）。


    如果安装程序无法在指定的分区和目录上找到必要文件，您将返回到“Select Partition”对话框进行必要的修正。


    如果所有内容都已正确指定，您将看到一个消息框，指示正在扫描软件包。现在转到第 64 页的第 4.5 节继续安装 Red Hat Linux。


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_62_0.png)


    <Tab>切换元素 | <Space>选择 | <F>下一步


    图 3.10：硬盘安装选择分区


    ## 4

    ## 继续安装


    ### 4.1 升级或安装


    在您选择安装方法后（如果您通过网络并配置了网络信息），安装程序将提示您是升级还是安装（参见下页图 4.1）。


    #### 4.1.1 安装


    您通常在干净的分区上安装 Red Hat Linux。**注意**：在另一个安装上安装 Linux 不会保留任何文件。如果您想执行完整安装，请选择 Install。**注意**：某些升级包需要其他包。跳转到第
    51 页的 4.2。


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_65_0.png)


    图 4.1：升级或安装


    #### 4.1.2 升级


    升级过程通过 .rpmsave 后缀重命名（例如 sendmail.cf.rpmsave）来保留配置文件，并在 /tmp/upgradelog 中留下其采取的操作。


    ### 4.2 SCSI 支持


    在您选择执行升级或完整安装后，安装程序将探测系统的 SCSI 适配器。在某些情况下，安装程序会询问您是否有 SCSI 适配器。如果您选择 Yes，接下来的对话框将显示驱动程序列表。选择最符合您的
    SCSI 适配器的驱动程序。安装程序随后允许您为所选驱动程序指定选项。


    ### 4.3 为 Red Hat Linux 创建分区


    此时，有必要让安装程序知道要在哪里安装 Red Hat Linux。这是通过为安装 Red Hat Linux 的一个或多个分区定义挂载点来实现。您可能还需要创建和/删除分区。


    安装程序随后显示对话框，允许您从两个磁盘分区工具中选择（参见下页图 4.2）。


    - Disk Druid - 这是 Red Hat Linux 新的运行时磁盘管理实用。它可以根据用户需求创建和删除磁盘分区，并管理每个分区的挂载点。

    - fdisk - 这是传统的 Linux 磁盘分区工具。虽然它比 Disk Druid 灵活一点，但缺点是 fdisk 假设您具有某些磁盘分区经验，并且习惯其较为简洁的用户界面。


    除了某些特殊方案，Disk Druid 可以处理典型 Red Hat Linux 安装的分区需求。


    选择要使用的磁盘分区工具并按回车。如果您选择 Disk Druid，请继续阅读。如果您更想使用 fdisk，请转到第 59 页的第 4.3.2 节。


    '
