    Figure 9.6: Selecting a Printer Type


    ter choosing the printer type, a dialog requests further information about the
    print queue. All types of print queues require the following information:


    +   - Queue Name: What the queue will be called. Multiple names can be specified
    with the | (pipe) character separating entries.


    +   - Spool Directory: This is the directory on the local machine where files
    are stored before printing occurs. Be careful not to have more than one printer
    queue use a given spool directory.


    +   - File Limit: Maximum size print job accepted, in kilobytes (1 kb = 1024 bytes).
    A size of 0 indicates no limit should be imposed.


    +   - Input Filter: Converts printed files into a format the printer can handle.
    Select to choose the filter that best matches your printer.


    In addition to configuring print queue to print graphical and PostScript output
    you can configure a text-only printer, which will only print plain ASCII text.
    Most printer drivers are also to print ASCII text without converting it to PostScript
    first; simply choose Fast text printing when you configure the filter. Please
    Note: This only works for non-PostScript printers.


    +   - Suppress Headers: Check this if you don''t want a header page to be printed
    at the beginning of each print job.


