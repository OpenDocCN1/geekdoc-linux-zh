    CD-ROM - If you have a CD-ROM drive and the Red Hat Linux CD-ROM. Does not require
    a supplemental diskette. Please refer to Section 3.4.1 on the next page to select
    the CD-ROM installation method.


    NFS - If you are installing from an NFS server which is exporting the Red Hat
    Linux CD-ROM or a mirror of Red Hat Linux from the Red Hat FTP site.'
