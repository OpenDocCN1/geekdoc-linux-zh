    # # 4


    # ## Continuing the Installation


    # ### 4.1 Upgrading or Installing


    After you choose an installation method (and, if you''re installing via the network,
    after you configure networking information), the installation program prompts
    you to either install or upgrade (see Figure 4.1 on the following page).


    # #### 4.1.1 Installing


    You usually install Red Hat Linux on a clean disk partition or set of partitions,
    or over another installation of Linux.


    **Please Note:** Installing Red Hat Linux over another installation of Linux (including
    Red Hat Linux) does not preserve any information from the prior installation.
    Make sure you save any important files!


    If you wish to perform a full install, choose Install, and skip to section 4.2
    on page 51.'
  - '[PAGE 65]


    # Continuing the Installation


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_65_0.png)


    Figure 4.1: Upgrading or Installing


    # 4.1.2 Upgrading


    The installation process for Red Hat Linux 5.0 includes the ability to upgrade
    from prior versions of Red Hat Linux (version 2.0 and later) which are based on
    RPM technology. Upgrading your system installs the modular 2.0.x kernel as well
    as updated versions of the packages which are currently installed on your machine.
    The upgrade process preserves existing configuration files by renaming them using
    a .rpmsave extension (e.g., sendmail.cf.rpmsave) and leaves a log telling what
    actions it took in /tmp/upgradelog. As software evolves, configuration formats
    can change, so you should carefully compare your original configuration files
    to the new files before integrating your changes.


    If you wish to upgrade your Red Hat Linux system, choose Upgrade.

    **Please Note:** Some upgraded packages may require that other packages are also
    installed for proper operation. The upgrade procedure takes care of these dependencies,
    but it may need to install additional packages. You will be shown the names of
    the required packages, and you may then decide to install them or not.'
  - '[PAGE 66]


    # 4.2 SCSI Support


    # 4.2 SCSI Support


    After you choose to perform an upgrade or a full install, the installation program
    will probe your system for SCSI adapters. In some cases, the installation program
    will ask you whether you have any SCSI adapters. If you choose Yes, the following
    dialog presents a list of SCSI drivers. Choose the driver that most resembles
    your SCSI adapter. The installation program then gives you an opportunity to specify
    options for the SCSI driver you selected; most SCSI drivers detect your hardware
    automatically, however.


    # 4.3 Creating Partitions for Red Hat Linux


    At this point, it''s necessary to let the installation program know where it should
    install Red Hat Linux. This is done by defining mount points for one or more partitions
    in which Red Hat Linux will be installed. You may also need to create and/or delete
    partitions at this time.


    The installation program then presents a dialog box that allows you to choose
    from two disk partitioning tools (see Figure 4.2 on the following page). The two
    choices you have:


    +   **Disk Druid** - This is Red Hat Linux''s new install-time disk management
    utility. It can create and delete disk partitions according to user-supplied requirements,
    in addition to managing mount points for each partition.


    +   **fdisk** - This is the traditional Linux disk partitioning tool. While it
    is somewhat-more flexible than Disk Druid, the downside is that fdisk assumes
    you have some experience with disk partitioning, and are comfortable with its
    somewhat terse user interface.


    With the exception of certain esoteric solutions, Disk Druid can handle the partitioning
    requirements for a typical Red Hat Linux installation.


    Select the disk partitioning tool you''d like to use, and press Enter. If you
    choose Disk Druid, continue reading. If you''d rather use fdisk, please turn to
    Section 4.3.2 on page 59.'
- md: "\n# Continuing the Installation\n\nRed Hat Linux (C) 1997 Red Hat Software\n\
    \n## Setup Filesystems\n\n![](img/8ae7f5fad98006e6a164a7db64fb5e18_67_0.png)\n\
    \nFigure 4.2: Selecting Disk Setup Method\n\n## 4.3.1 Using Druid\n\nIf you selected\
    \ Disk Druid, you will be presented with a screen that looks like figure 4.3 on\
    \ the facing page. While it may look overwhelming at first, it really isn't. Let's\
    \ go over each of Disk Druid's three sections, and you'll see that there's nothing\
    \ to be scared of.\n\n### The “Current Disk Partitions” Section\n\nEach line in\
    \ the “Current Disk Partitions” section represents a disk partition. You'll note\
    \ that this section has a scroll bar to the right, which means that there might\
    \ be more partitions than can be displayed at one time. If you use the arrow keys,\
    \ you can see if there are any additional partitions. Each line in this section\
    \ has five different fields:\n\n- Mount Point – This field indicates where the\
    \ partition will be mounted when Red Hat Linux is installed and running.\n- Device\
    \ – This field displays the partition' device name.\n- Requested – The “Requested”\
    \ field shows the minimum size requested when the partition was defined.\n- **Actual**\
    \ - The \"Actual\" field shows the space currently allocated to the partition.\n\
    - **Type** - This field shows the partition's type.\n- **Another Type of Partition**\
    \ As you scroll through the \"Current Disk Partitions\" section, you might see\
    \ an \"Unallocated Requested Partitions\" title bar, followed by one or more partitions.\
    \ This implies, these are partitions that have been requested but, for one reason\
    \ or another, have not been allocated. A common reason for having an unallocated\
    \ partition is a lack of sufficient free space for the partition. In any case,\
    \ the reason the partition is unallocated will be displayed after the partition's\
    \ mount point.\n\n### The \"Drive Summaries\" Section\n\nEach line in the \"Drive\
    \ Summaries\" section represents a hard disk on your system.\nEach line has the\
    \ following fields:\n\n- **Drive** – This field shows the hard disk's device name.\n\
    - **Geom [C/H/S]** – This field shows the hard disk's geometry. The geometry consists\
    \ of three numbers representing the number of cylinders, heads, and sectors as\
    \ reported by the hard disk.\n- **Total** - The \"Total\" field shows the total\
    \ available space on the hard disk.\n- **Used** - This field shows how much of\
    \ the hard disk's space is currently allocated to partitions.\n- **Free** - The\
    \ \"Free\" field shows how much of the hard disk's space is still unallocated.\n\
    - **Bar Graph** - This field presents a visual representation of the space currently\
    \ used on the hard disk. The more pound signs there are between the square braces,\
    \ the less free space there is. In Figure 4.3 on the page before, the bar graph\
    \ shows no free space.\n\n### Disk Druid's Buttons\n\nThese buttons control Disk\
    \ Druid's actions. They are used to add and delete partitions, and to change partition\
    \ attributes. In addition, there are buttons that are used to accept the changes\
    \ you've made, discard those, or exit Disk Druid entirely. Let's take a look at\
    \ each button in order.\n\n- Add - The \"Add\" button is used to request a new\
    \ partition. When selected, a dialog box will appear containing fields that must\
    \ be filled in.\n- Add NFS - This button is used to add a read-only NFS-served\
    \ filesystem to the set of mount points on your Red Hat Linux system. When selected,\
    \ a dialog box will appear containing fields that must be filled.\n- Edit - The\
    \ \"Edit\" button is used to modify attributes of the partition currently highlighted\
    \ in the \"Current Disk Partitions\" section. Selecting this button will cause\
    \ a dialog box to appear. Some or all of the fields in the \"Edit Partition\"\
    \ box may be changed, depending on whether the partition information has already\
    \ been written to disk or not.\n- Delete - The \"Delete\" button is used to delete\
    \ the partition currently highlighted in the \"Current Disk Partitions\" section.\
    \ Selecting this button will cause a dialog box to appear asking you to confirm\
    \ the deletion.\n- Reset - This button is used to discard all changes you have\
    \ made in Disk Druid, and return the list of partitions to those read from the\
    \ partition table(s) on your hard disk(s). When selected, you'll be asked to confirm\
    \ whether you want the changes discarded or not. Note that any mount points you\
    \ specified will be lost, and will need to be reentered.\n- Ok - The \"Ok\" button\
    \ causes any changes made to your systems partitions to be written to disk. You\
    \ will be asked to confirm your changes before Disk Druid rewrites your hard partition\
    \ table(s). In addition, any mount points you've defined are passed to the installation\
    \ program, and will eventually be used by your Red Hat Linux system to define\
    \ the filesystem layout.\n- Cancel - This button causes Disk Druid to abort without\
    \ saving any changes you've made. When this button is selected, the installation\
    \ program will present a dialog box that permits you to choose what action you'd\
    \ like to take next.\n\nPlease Note: You will need to dedicate at least one partition\
    \ to Red Hat Linux, and optionally more. This is discussed more completely in\
    \ Section 2.4.4 on page 28.\n\nNow let's see how Disk Druid is used to set up\
    \ partitions for your Red Hat Linux system.\n\n## Adding a Partition\n\nTo Add\
    \ a new partition, select the Add button, and press Space. A dialog box will appear\
    \ containing fields that must be filled in.\n\nFigure 4.3: Disk Druid Main Screen\n\
    \n![](img/8ae7f5fad98006e6a164a7db64fb5e18_67_0.png) (Wait, the image link seems\
    \ repeated or misplaced in OCR, keeping context)\n\n- **Mount Point** - This field\
    \ indicates where the partition will be mounted. For example, root or /usr.\n\
    - **Size (Megabytes)** - This field shows the size in megabytes.\n- **Growable?**\
    \ - This check box indicates whether the partition should expand to fill available\
    \ space on the hard disk.\n- **Type** - This field contains a list of partition\
    \ types (e.g., ext3, ext4, swap).\n- **Allowable Drives** - This field contains\
    \ a list of hard disks installed on your system. If a hard disk's box is not checked,\
    \ the partition will never be created on that disk.\n- **Ok** - Select this when\
    \ you are satisfied with the partition's settings.\n- **Cancel** - Select this\
    \ when you don't want to create the partition.\n\n**Problems When Adding a Partition**\
    \ If your attempt to add a partition and Disk Druid can't carry out your request,\
    \ you will see a dialog box like the one in 4.5. In the box are listed partitions\
    \ that are unallocated, along with the reason they could not be allocated. Select\
    \ the Ok button, and press Space to continue. Note that the unallocated partition(s)\
    \ are also displayed on Disk Druid's main screen.\n\n## Deleting a Partition\n\
    \nTo delete a partition, highlight the partition in the \"Current Disk Partitions\"\
    \ section, select the Delete button, and press Space. \n\n## Editing a Partition\n\
    \nTo change a partition's settings, highlight the partition in the \"Current Disk\
    \ Partitions\" section, select the Edit button, and press Space. You will be presented\
    \ with a dialog box very similar to the one shown in Figure 4.4 on page 55. Make\
    \ the appropriate changes, select Ok, and press Space.\n\nPlease Note: If the\
    \ partition already existed on your hard disk, you will only be to change the\
    \ partition's mount point. If you want to make any other changes, you will need\
    \ to delete the partition and recreate it.\n\n## Adding an NFS Mount\n\nTo add\
    \ a read-only NFS-served filesystem, select the Add NFS button, and press Space.\
    \ If you have not selected a network-related installation method, you will be\
    \ presented with several dialog boxes concerning network configuration. Fill them\
    \ in appropriately. You will then see a dialog box entitled, \"Edit Network Mount\
    \ Point\" (see Figure 4.6 on the next page. In this dialog box you will need to\
    \ enter the NFS server name,\n"
