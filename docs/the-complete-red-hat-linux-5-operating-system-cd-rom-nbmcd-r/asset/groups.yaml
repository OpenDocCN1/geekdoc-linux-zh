    # I Couldn''t Have Done it Without...


    Thanks goes out to the past authors of this manual. A great deal of their work
    is still here. A great, big “Thank You” is also owed to the Red Hat Linux 5.0
    development team for putting up with the many questions, comments, and pleading
    requests for reviews of this manual. Thanks, guys!


    Last but far from least is the support group at Red Hat Software. They have given
    many insightful suggestions regarding this manual, based on extensive experience
    with thousands of Red Hat Linux customers. So if you find yourself breezing through
    the installation chapters, it’s due in no small part to their input. I thank them.


    Edward C. Bailey


    # 1


    ## New Features Of Red Hat Linux 5.0


    This chapter describes features that are new to Red Hat Linux 5.0.


    ## 1.1 Installation-Related Enhancements


    There have been many changes made to make the Red Hat Linux installation process
    easier. Here''s a list:


    - Automatic probing of PCI devices

    - Expert installation mode

    - Kickstart installation mode

    - New method of configuring partitions and mount points

    - Daemons can be configured to run at boot or not

    - Enhanced XFree86 configuration


    ### 1.1.1 Automatic Probing of PCI devices


    The installation program can probe computers with PCI devices. If desired, auto-probing
    can be disabled by running the installation in expert mode (see Section 1.1.2).


    ### 1.1.2 Expert Installation Mode


    By entering expert at the initial boot prompt, you can run the installation program
    in expert mode. Expert mode causes the installation program to revert to an installation
    style very similar to that used with Red Hat Linux 4.2. This means most of the
    new auto-probing code is replaced with dialog boxes that prompt the user to manually
    enter device information. These dialog boxes also include a field allowing the
    user to enter options to be passed to the driver module loaded. Therefore, if
    a particular hardware configuration requires module options, an expert-mode installation
    should be used.


    ### 1.1.3 Kickstart Installation Mode


    It''s possible to automate Red Hat Linux installations by using kickstart mode.
    Instead of asking the user questions during the installation, kickstart mode reads
    a file that contains all the information necessary to install Red Hat Linux. This
    is handy when installing many similarly-configured systems. For more information
    on kickstart mode, please read /doc/README.ks on the Red Hat Linux CD-ROM.


    ### 1.1.4 Configuring Partitions and Mount Points


    In the past, the installation program used fdisk to set up disk partitions, and
    a series of dialog boxes to define mount points. While that functionality is still
    available in Red Hat Linux 5.0, there is an alternative. Disk Druid provides both
    mount point definition and partition configuration in one concise screen. In addition,
    Disk Druid supports the concept of “growable partitions” – partitions that can
    grow beyond a minimum size to allocate all remaining space on a hard disk.


    For more information on Disk Druid, please refer to Section 4.3.1 on page 52.


    ### 1.1.5 Configuring Services to Run at Boot Time


    In prior versions of Red Hat Linux, if you installed a particular service (such
    as bind, samba, etc.) while installing Red Hat Linux, that service configured
    to automatically start once the installation was complete and the system rebooted.
    Now, you will have the option, during the installation, to select which services
    should start and which should not. During the installation, you will be asked
    to select which services should be started whenever the system is booted. For
    more information, refer to Section 5.5 on page 74.


    ### 1.1.6 Enhanced XFree86 Configuration


    The XFree86 configuration utility Xfigurator has been enhanced. It will now attempt
    to probe your system to automatically determine what type of video card is installed.
    In addition, Xfigurator will now determine the optimal display resolution and
    color depth for your hardware configuration.


    ## 1.2 New User-Mode Tools


    One of the biggest stumbling blocks to a new Red Hat Linux user is that many tasks
    can only be performed by the root account, by knowing an arcane set of commands,
    or both. To make life easier, there are several new tools that can be used by
    any user to perform common tasks:


    - User information tool

    - User password tool

    - Filesystem mount tool

    - Network device tool


    ### 1.2.1 User Information Tool


    The user information tool is used to display the gecos information in /etc/passwd.
    Figure 1.1 on the following page shows it. As you can see:


    - Name

    - Office

    - Phone

    - Shell


    ### 1.2.2 User Password Tool


    The password tool is used to change the password in /etc/passwd. For more information,
    see the password man page.


    ### 1.2.3 Filesystem Mount Tool


    The mount tool makes it easy to mount and unmount filesystems in /etc/fstab. Figure
    1.2 shows the following:


    ### 1.2.4 Network Device Tool


    The network tool is used to start and stop network interfaces. Figure 1.3 on the
    following page shows it. For more information, see the network tool man page.

