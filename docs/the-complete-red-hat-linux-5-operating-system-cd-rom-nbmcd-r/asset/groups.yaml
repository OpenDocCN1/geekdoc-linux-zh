    ## 6.9 NFS Configuration


    NFS stands for Network File System, and is a way to share files between machines
    as if they were on your local hard drive. Linux can be both an NFS server and
    an NFS client, which means that it can export filesystems to other systems, and
    mount filesystems exported from other machines.


    ## 9 NFS Configuration


    ### 9.1 Mounting NFS Filesystems


    use the mount command to mount a NFS filesystem from another machine:


    ```

    mount porky:/mnt/export /mnt/local

    ```


    this command, porky is the hostname of the NFS fileserver, /mnt/export the filesystem
    that porky is exporting, and /mnt/local is a directory on my local machine where
    we want to mount the filesystem. After the mount command and runs (and if we have
    the proper permissions from porky) we can enter ls in /mnt/local and get a listing
    of the files in /mnt/export on porky.


    ### 9.2 Exporting NFS Filesystems


    the file that controls what filesystems you wish to export is /etc/exports. Its
    format is:


    ```

    directory hostname(options)

    ```


    the (options) are optional. For example:


    ```

    /mnt/export speedy.redhat.com

    ```


    would allow speedy.redhat.com to mount /mnt/export, but


    ```

    /mnt/export speedy.redhat.com(ro)

    ```


    would just allow speedy to mount /mnt/export read-only.


    each time you change /etc/exports, you need to tell the NFS daemons to examine
    it for new information. One simple way to accomplish this is to just stop and
    start the daemons:


    ```

    /etc/rc.d/init.d/nfs stop

    /etc/rc.d/init.d/nfs start

    ```


    the following will also work:


    ```bash

    killall -HUP rpc.nfsd rpc.mountd

    ```


    See the following man pages for more details: nfsd(8), mountd(8), exports(5).

    Another good reference is Managing NFS and NIS Services by Hal Stern, published

    by O''Reilly & Associates.


    ## 6.10 Running Programs at Boot Time


    The file /etc/rc.d/rc.local is executed at boot time, after all other initialization
    is complete, and whenever you change runlevels. You can add additional daemons,
    or initialize a printer. In instance, you may want to start up additional in addition,
    if you require serial port setup, you can edit /etc/rc.d/rc.serial, and it will
    be executed automatically at boot time.


    The default /etc/rc.d/rc.local simply creates a nice login banner with your kernel
    version and machine type.


    ## 6.11 Color-ls Setup


    color-ls is now part of the standard ls command. To get colorized directory listings,
    simply issue the command (in bash):


    ```bash

    alias ls=''ls --color=tty''

    ```


