    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_155_1.png)


    Figure 9.10: Printing a Test Page


    ## 9.4 Network Configuration


    The network configuration tool (netcfg) shown in Figure 9.11 is designed to allow-easy
    manipulation of parameters such as IP address, gateway address, and network address,
    as well as name servers and /etc/hosts.


    Network devices can be added, removed, configured, activated, deactivated and
    aliased. Ethernet, arcnet, token ring, pocket (ATP), PPP, SLIP, PLIP and loopback
    devices are supported. PPP/SLIP/PLIP support works well on most hardware, but
    some hardware setups may exhibit unpredictable behavior. When using the Network
    Configuration Tool, click Save to write your changes to disk; to quit without
    making any changes, select Quit.


    ### 9.4.1 Managing Names


    The Names panel of the Network Configuration tool serves two primary purposes:
    setting the hostname and domain of the computer, and determining which name server
    will be used to look up other hosts on the network. The Network tool is not capable
    of configuring a machine as a nameserver. To edit a field or add information to
    a field, simply click on the field with the left mouse button and type the new
    information.


    ## 4 Network Configuration


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_156_0.png)


    Figure 9.11: Network Configuration Panel


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_156_1.png)


    Figure 9.12: Adding/Editing Hosts


    ### 9.4.2 Managing Hosts


    In the *Hosts* management panel, you have the ability to add, edit, or remove
    hosts from the /etc/hosts file. Adding or editing an entry involves identical
    actions. An edit dialog box will appear, simply type the new information and click
    Done when you are finished. See Figure 9.12 for an example.


    ### 9.4.3 Adding a Networking Interface


    If you have added a networking interface to your machine since installing Red
    Hat Linux, or if you didn''t configure your ethernet card at install time, you
    can configure it with a few clicks of a mouse.


    Note: You may need to configure the kernel to load a driver for the network interface
    you are adding (e.g., eth0); see Section 9.6 for more information.


    Begin adding an interface by clicking on Interfaces in the main panel. This will
    bring up a window of configured devices with a row of available options, see figure
    9.13.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_157_0.png)


    Figure 9.13: Configured Interfaces


    To Add a device, first click the Add button, then select the type of interface
    you want to configure from the box that appears (See Figure 9.14).


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_158_0.png)


    Figure 9.14: Choose Interface Type


    #### PP Interface


    Adding a PPP interface can be as simple as supplying the phone number, login name
    and password in the Create PPP Interface dialog shown in Figure 9.15. If you need
    to use PAP authentication for your PPP connection, choose Use PAP authentication.
    In many cases, some degree of customization will be needed to establish a PPP
    connection. Choosing the Customize button will allow you to make changes to the
    hardware, communication, and networking settings for the PPP interface.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_158_1.png)


    Figure 9.15: Create PPP Interface


    #### SLIP Interface


    In order to configure a SLIP interface, you must first supply a phone number,
    login name, and password. This will supply the initial parameters for the chat
    script needed to establish a SLIP connection. When you choose Done, a dialog titled
    Edit SLIP interface appears that enables you to further customize the hardware,
    communication and networking parameters for your SLIP interface.


    #### PLIP Interface


    To add a PLIP interface to your system, you only have to supply the IP address,
    the remote IP address, and the Netmask. You can also select if you want to activate
    the interface at boot time.


    #### Ethernet, Arcnet, Token Ring and Pocket Adaptor Interfaces


    If you are adding an ethernet, arcnet, token ring or pocket adapter to your computer,
    you will need to supply the following information:


    - Device: This is determined by netconfig based on the devices already configured.

    - IP Address: Enter an IP address for your network device.

    - Netmask: Enter the network mask for your network device.

    The network and broadcast addresses are calculated automatically based on the
    IP address and netmask you enter.

    - Activate interface at boot time: If you want the device to be configured automatically
    when your machine boots, select this by clicking on it.

    - Allow any user to (de)activate interface: If you want the device to be configured
    automatically when your machine boots, select this by clicking on it.

    - Interface protocol: If you have a DHCP server and would like to use it, configure
    the interface, as documented in section 6.1.

