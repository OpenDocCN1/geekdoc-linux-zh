    ## Users, Groups and User-Private Groups


    ### 1.3.3 User Private Groups


    Linux uses a user private group (UPG) scheme, which makes UNIX groups much easier
    to use. The UPG scheme does not add or change anything in the standard UNIX way
    of handling groups. It simply offers a new convention for handling groups. Whenever
    you create a new user, by default, he or she has a unique group. The scheme works
    as follows:


    Each user has its own primary group, to which only it is a member. The traditional
    UNIX umask is 022, which prevents other users and members of a user''s primary
    group from modifying a user''s files. Since every user has their own private group
    in the UPG scheme, "group protection" is not needed. A umask of 002 prevents users
    from modifying other users'' private files. The umask is set in /etc/profile.


    SGID bit on Directories: If you set the SGID bit on a directory (chmod g+s directory),
    files created in that directory will have group set to the directory''s group.


    Most computing sites like to create a group for each major project and assign
    users to the groups traditionally. Managing files has been difficult, though,
    because when someone creates a file it is owned by the primary group she belongs
    to. When a single person works on multiple projects, it becomes hard to make the
    files owned by that group that is associated with that project. In the UPG scheme,
    groups are automatically assigned to files on a project-by-project basis, which
    makes managing projects very simple.


    Suppose you have a big project called devel, with many people editing the devel
    in a devel directory. Make a group called devel, chgrp the devel directory and
    add all the developers to the devel group. Now, all the developers will be able
    to edit the devel files and create new files in the devel directory, and these
    files will always retain their devel group. Thus, they will always be editable
    by other users.


    If you have multiple projects like devel, and users who are working on multiple
    projects, these users will never have to change their umask or group when they
    move from project to project. The SGID bit on each project''s main directory sets
    the proper group.


    Since each user’s HOME directory is owned by the user and their private group,
    it is safe to set the SGID bit on the HOME directory. However, by default, files
    are created with the primary group of the user, so the SGID bit would be redundant.


    ## User Private Group Rationale


    Since the UPG scheme is new, many people have questions about it, and they wonder
    why it is necessary. The following is the rationale for the scheme.


    - You''d like to have a group of people work on a set of files in say, the /usr/lib/emacs/site-lisp
    directory. You trust a few people to mess around in there, but certainly not everyone.

    - So you enter:

    ```chown -R root:emacs /usr/lib/emacs/site-lisp```

    and you add the proper users to the group.

    - To allow the users to actually create files in the directory you enter:

    ```chmod 775 /usr/lib/emacs/site-lisp```

    - But when a user creates a new file it is assigned the group of the users'' default
    group (usually users). To prevent this you enter:

    ```chmod 2775 /usr/lib/emacs/site-lisp```

    which causes everything in the directory to be created with the "emacs" group.

    - But the new file needs to be mode 664 for another user in the emacs group to
    be able to edit it. To do this make the default umask 002.

    - Well, this all works fine, except that if your default group is "users", every
    file you create in your home directory will be writable by everybody in "users"
    (usually everyone).

    - To fix this, you make each user have a "private group" as their default group.


    At this point, by making the default umask 002 and giving everyone a private default
    group, you can easily set up groups that users can take advantage of without doing
    any magic. Just create the group, add the users, and do the above mentioned chmod
    on the group’s directories.


    ## User Authentication with PAM


    Programs which give users access to privileges of any sort need to be able to
    authenticate the users. When you log into a system, you provide your name and
    password, the login process uses those to authenticate the login—to verify that
    you are who you say you are. Other forms of authentication than passwords exist,
    and it is possible for the passwords to be stored in different ways.


    PAM, which stands for “Pluggable Authentication Modules”, is a way of allowing
    system administrator to set authentication policy without having to recompile
    programs which do authentication. With PAM, you control which modules are plugged
    into the programs by editing a configuration file.


    Most of Red Hat Linux users will never need to touch this configuration file.
    When you use RPM to install programs that need to do authentication, they automatically
    make the changes that are needed to do normal password authentication. However,
    you may want to customize your configuration, in which case you need to understand
    the configuration file.


    ### 4.4.1 Modules


    There are four types of modules defined by the PAM standard. auth modules provide
    the actual authentication, perhaps asking for and checking a password, setting
    “credentials” such as group membership or kerberos “tickets”. account modules
    check to make sure that the authentication is allowed (the account has expired,
    the user is allowed to log in at this time of day, etc.). password modules are
    used to set passwords. session modules are used once a user has been authenticated
    to make it possible for them to use their account, perhaps mounting the user''s
    home directory or making their mailbox available.


    These modules can be stacked, so that multiple modules are used. For instance,
    login normally makes use of at least two authentication methods: if “hosts” authentication
    succeeds, it is sufficient to allow the connection; if it fails, then standard
    password authentication is done.


    New modules can be added at any time, and PAM-aware applications can then be made
    to use them. For instance, if you have a one-time-password calculator system,
    and you can write a module to support it (documentation on writing modules is
    included with the system), PAM-aware programs can use the new module and work
    with the new one-time-password calculators without being recompiled or otherwise
    modified in any way.


    ### 11.4.2 Services


    Each program which uses PAM defines its own "service" name. The login program
    defines the service type login, ftp defines the service type ftp, etc. In general,
    the service type is the name of the program used to access the service, not (if
    there is a difference) the program used to provide the service.


    ### 11.4.3 The Configuration Files


    The directory /etc/pam.d is used to configure all PAM. This used to be /etc/pam.conf
    in earlier PAM versions; while the pam.conf file is used if no /etc/pam.d/ entry
    is found, its use is deprecated.) Each application (really, each service) has
    its own file. A file looks like this:


    ```

    ##PAM-1.0

    auth required /lib/security/pam_security.so

    required /lib/security/pam_pwdb.so shadow

    auth required /lib/security/pam_nologin.so

    account required /lib/security/pam_pwdb.so

    password required /lib/security/pam_cracklib.so

    password required /lib/security/pam_pwdb.so shadow

    ock use_authtok

    session required /lib/security/pam_pwdb.so

    ```


    The first line is a comment. Any line that starts with a # character is a comment.
    The next three lines stack up three modules to use for login authorization. The
    first line makes sure that if the user is trying to log in as root, the tty on
    which they are logging is listed in the /etc/security file if that exists. The
    second line causes the user to be asked for a password and the password checked.
    The third line checks to see if the file /etc/nologin exists, and if it does,
    displays the contents of the file, and if the user is not root, does not let him
    or her log in.


    Note that all modules are checked, even if the first module fails. This is a security
    decision—it is designed to not let the user know why their authentication was
    disallowed, because knowing why it was disallowed might allow them to break the
    authentication more easily. You can change this behavior by changing

