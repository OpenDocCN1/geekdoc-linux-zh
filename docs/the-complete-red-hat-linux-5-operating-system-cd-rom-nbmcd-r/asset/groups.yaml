    is called, but it has something to do with "linear". You''ll find it in your BIOS
    setup. You may need to specify the amount of memory to the kernel at boot time
    fino. To try this, type: linux mem=32M at the lilo prompt. If that works, you
    can add that line to the append in /etc/lilo.conf and rerun lilo. The example
    from above would be:


    ```

    append = "mem=32M*

    ```


    Don''t forget to run ‘lilo’ after editing the file.


    # D.3.6 How do I install to my DOS partition?


    You can''t. None of the current Red Hat releases support UMSDOS installs. If you
    have one drive that has one big DOS partition with free space you want to use,
    you have two options. One is to backup all your DOS data somehow and then repartition
    the drive into smaller partitions and restore the DOS data back to a DOS partition.
    You then have a free partition for linux. The second choice is to use fips. fips
    is a program that will let you change your partition size of a DOS partition without
    harming the data on it. It is STRONGLY suggested that you backup your data before
    using ips. Red Hat Software makes no warranties or claims to the suitability of
    using fips for this purpose nor can we guarantee that data will remain unharmed.
    I haven''t heard of anyone having a bad experience with fips, but I won''t guarantee
    it either.


    # D.3.7 How do I use the NYS/NIS system that comes with Red-Hat?


    Please see the NYS-Tips. You can find it at http://www.redhat.com.'
  - '[PAGE 226]


    # Installation Questions


    # 3.8 Why can''t I get to Unixware now that I''ve installed Linux?


    you need to boot Unixware off of a boot floppy and run `fdisk /mbr`. That should
    show you how to get back into Unixware, but will not let you access Linux.


    # 3.9 Why does my Diamond video card do odd things under X Windows?


    you experience problems with XFree86 and your Diamond video card, you may be putting:


    > "Option Diamond"


    your /etc/X11/X86Config (or in /etc/X86Config if you use that).


    # 3.10 Where can I find an list of known problems?


    find solutions to known problems, please see:


    http://www.redhat.com/errata


    look for both a “General Errata” page and a platform-specific Errata page for
    your version of Red Hat Linux.


    # 3.11 I installed Metro-X, now how do I use it?


    get the startx command to use Metro-X instead of XFree86 you must make /etc/X11/X
    a symbolic link to /usr/X11R6/bin/Xmetro:


    ```

    rm /etc/X11/X

    ln -s ../../usr/X11R6/bin/Xmetro /etc/X11/X

    ```'
  - '[PAGE 227]


    # D.4 Using Red Hat Linux


    # D.4.1 Why doesn''t the xmh shipped with Red Hat work properly?


    We only ship xmh because it is part of the standard X11 distribution. xmh is bas
    ically shipped as-is from the X11 distribution, and is most likely broken. We''ve
    found that there are several better alternatives. If you want to use mh mail,
    install the mh RPM and the exmh RPM. exmh is a much better GUI mail reader than
    xmh


