    ## E.1 自由软件模型


    Linux 以及广义上的 GNU 工具特别是红帽 Linux（Red Hat Linux），最好的特性可能是它可以根据 GNU 公共许可证（GPL）条款进行分发。这一特性允许研究机构、大学、商业企业和黑客能够合作地开发和使用红帽及相关技术，而无需担心他们的工作某日会被商业供应商控制和限制。


    简而言之，GPL 将软件开发和分发模型转变为非常类似于我们法律体系及其行业模式的模式。如果一个律师设计了一个在最高法院赢得诉讼的论点，他的报酬不仅是他收取的费用，还包括他的成就为他的执业吸引的额外客户。他提出的“论点”可以供任何其他律师无限制地使用，事实上已成为了我们法律遗产的一部分。


    这种新模型已经成为了一个新行业，像 Cygnus Support（访问 http://www.cygnus.com）这样的公司已成为价值数百万的企业，其业务是为
    GPL 以及其他“自由分发”软件的大型商业用户提供支持和服务。红帽软件公司（Red Hat Software, Inc.）的快速增长同样基于我们对红帽 Linux
    发行版的开发和支持，该产品我们根据 GPL 条款通过 CD 和互联网在全球范围内分发。


    ## E.2 “自由软件”的演变


    Unix 操作系统也是由 AT&T 在合作的基础上开发的，并得到了许多大学和研究机构的积极支持。许多早期的 Unix 贡献者在 AT&T 于 20 世纪 70
    年代末和 80 年代初开始对 Unix 的使用和分发执行版权条款时感到失望。这最终导致了 AT&T（以及随后在 1991 年从 AT&T 手中购买了 Unix
    版权的 Novel）与加州大学伯克利分校之间长期而痛苦的法律斗争。作为对这种个人控制公共软件开发项目控制问题的部分回应，位于马萨诸塞州剑马诸塞理工学院（MIT）自
    1984 年以来一直支持理查德·斯尔曼（Richard Stallman）在软件开发领域发起运动的努力。这导致了自由软件基金会（FSF）及其 GNU 项目的建立。


    ## E.3 GNU 公共许可证


    GNU 遵循了早期 Unix 使用递归缩写作为程序名称的传统，代表 "Gnu''s Not Unix"（GNU 不是 Unix）。FSF 总部继续位于 MIT，GNU
    C++、Emacs 以及许多其他产品，其中许多产品构成了 Linux 操作系统的实质性构建模块。理查德·斯尔曼坚持认为，基于某些理由，Linux 应该被正确地称为一个
    GNU 系统。


    还有许多其他“自由软件”许可证，红帽 Linux 中的某些代码是在这些许可证下授权的。其中大多数是加州大学伯克利分校的 BSD 许可证，通过该许可证版权持有者仍是所有者，但对代码的用户不实施进一步分发施加任何限制。


    同样来自 MIT 但与 FSF 或 GPL 无关的是 X 联盟（X Consortium），这是一个由 Unix 行业赞助构建和维护 X 窗口系统的组织。相反，一个名为
    XFree86 项目的团体承担了将 X 窗口系统移植互联网平台的责任。为了方便起见，我们在手册的附录中包含了这些许可证的副本。由于这一广泛开发努力的贡献，Linux
    正在继续非常快速地进步，鼓励你和你的公司或学校做出贡献。


    红帽软件公司（Red Hat Software, Inc.）选择在 GPL 下授权其代码出于两个原因。其这是最容易实现的，因为 Linux 内核是以这种方式许可的，而且我们的代码与其他
    GPL 代码有足够的交互，以至于其他许可方案变得困难。另一个是为了合作开发，我们真发地认为 GPL 实际上是最有效的格式。


    GPL 的目的非常像任何标准的版权许可证，定义了你可以和不可以如何使用产品。然而，它与商业许可证有本质区别，因为它不是限制你对软件的使用，其目的是保证你对软件的使用。


    它完全不限制在 Linux 或其他 GPL 代码上使用标准的商业许可软件。只有你对从他人那里借用的、受 GPL 许可的代码所做的修改，必须根据 GPL 定义的相同无限制规则提供给他人。任何仅使用或运行在
    Linux 之上的红帽和自由分发软件产品都可以根据你选择的任何商业规则进行许可。


    有许多领先的商业软件开发者在 Linux 上支持他们的商业产品，你必须为这些产品购买许可证，例如 OSF 的 Motif、来自 Empress Software
    的 Empress RDBMS、WordPerfect，以及最近来自 Applic Inc. 和红帽软件的 Appixware 办公套件。你将在 F 部分找到
    GPL 的完整副本。


    ## E.4 Linux 会取代商业操作系统吗？


    Linux 操作系统的巨大开发努力和广泛分发将确保它作为商业限制性操作系统的真实、可行且重要的替代品。开放的开发模型、源码的可用性以及许可证限制的缺失是 Linux
    操作系统的“特性”，而商业开发人员根本无法提供。需要这种模型的软件开发组包括从政府附属研究机构到学术研究和教学项目的各类团体。由于这一广泛开发努力的贡献，Linux
    正在继续快速进步，这甚至让最大的行业组织开始认真对待 Linux。Datapro（麦格威尔公司）在最近的 1996 年行业调查中得出结论：“由于 Linux
    的可见，它比微软便宜，并且具有 UNIX 的优势，例如优秀的性能、工具集和通信能力”。这种新的分发和开发模型已经在与旧的商业限制模式竞争。我们很高兴你现在加入了。


    ## 红帽公司在开发中的作用


    红帽发行版也根据 GPL 发布。我们的角色是让专业开发人员、系统管理员和学生能够轻松安装、配置和维护 Linux。Linux 通过红帽软件和大多数 Linux
    供应商以低成本且限制少获取。


    红帽公司（Red Hat Software, Inc.）为 Linux 操作系统的用户提供支持，从运行单个工作站的个人到运行数百台机器的大型组织。


    我们感谢来自 Linux 社区的支持，包括 Linux·托瓦尔斯（Linux Torvalds）、贡献者列表上的所有人，以及帮助 Linux 变成今天千的其他开发者。我们还想感谢商业开发者对我们工作的日益增加的，包括数字设备公司、Reilly
    & Associates、Metro Linux 等。我们受到红帽 Linux 发行版的鼓励，开发并添加功能，或者只需打包你或认为其他人需要的程序。如果你需要任何帮助，请随时联系我们。


    你可以通过以下方式直接联系红帽：info@redhat.com。


    # 进一步阅读


    互联网上有适用于 Linux 的自由分发和商业软件列表，如《Linux 杂志》、《商业 HOWTO》、《Linux 软件地图》以及许多 Linux 供应商（包括红帽软件的零售版）。许多第三方和商业产品可以通过红帽网站购买，包括
    Motif、数据库开发系统、编辑器等。


    有关 Linux 的更多信息，请参阅：


    - *Running Linux, M. Welsh, O''Reilly & Associates, 1995.*


    '
