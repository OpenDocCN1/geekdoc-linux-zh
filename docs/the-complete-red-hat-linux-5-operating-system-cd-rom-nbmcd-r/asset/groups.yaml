    # 2 Before You Begin


    While installing Red Hat Linux is a straightforward process, taking some time
    prior to starting the installation can make things much more smoothly. In this
    chapter, we''ll discuss the steps that should be performed before you start the
    installation.


    If you are currently running a version 2.0 (or greater) Red Hat Linux system,
    you can perform an upgrade. Skip this chapter to review basic issues relating
    to installation and read the following chapters in order, following the directions
    as you go. The upgrade procedure starts out identically to the installation procedure;
    you will be directed to choose an installation or upgrade after booting the installation
    program and answering a few questions.


    There are five things you should do prior to installing Red Hat Linux:


    - 1. Make sure you have access to the Red Hat Linux components required for installation.

    - 2. Make sure you know your computer''s hardware configuration and networking
    information.

    - 3. Decide, based on the first two tasks, what method you will use to install
    Red Hat Linux.

    - 4. Determine where on your hard drive(s) Red Hat Linux will reside.

    - 5. Make sure you have sufficient documentation to effectively use your Red Hat
    Linux system after the installation.


    Let''s start by making sure you have everything you need to install Red Hat Linux


    ## 2.1 Getting the Right Red Hat Linux Components


    If you''ve purchased the Red Hat Linux boxed set, you''re ready to go! However
    mistakes occasionally happen, so now is a good time to double-check the contents
    of your boxed set. If you haven''t purchased a Red Hat Linux boxed set, skip to
    Section 2.1.3 on page 18.


    ### 2.1.1 Contents of the Red Hat Linux Boxed Set


    The Red Hat Linux boxed set contains the following items:


    - The installation guide.

    - Red Hat Linux CDs 1 and 2.

    - Boot and supplemental diskettes.

    - License and Registration card.

    - Sticker with registration number.


    Let''s take a quick look at each item:


    ### Installation Guide


    The Red Hat Linux Installation Guide is what you''re currently reading. It contains
    the information necessary to install Red Hat Linux. In addition, it contains information
    about aspects of the operating system that are unique to Red Hat Linux.


    ### 1 Getting the Red Hat Linux Components


    ### CD 1 and 2


    these two Compact Discs contain the entire Red Hat Linux distribution, including
    source code. CD 1 contains all the binary packages built for the type of computer
    Intel, Alpha, or SPARC that you have. CD 2 contains the source packages that were
    used to build the binary packages on CD 1.


    ### boot and Supplemental Diskettes


    these diskettes are used to start the installation process for Red Hat Linux/Intel.
    depending on your computer''s configuration and the type of installation you select,
    you may only need the boot diskette, the boot and supplemental diskettes, or one
    at all. When we discuss the different installation methods later in this chapter,
    we''ll explain which diskettes are needed for each type of installation.


    ### license and Registration card


    this card contains the license terms for Red Hat Linux, in addition to the license
    terms for any commercial software that may be included on the Red Hat Linux CD.
    this is where you''ll also find any late-breaking information about Red Hat Linux.


    ### registration Sticker


    the alphanumeric registration string on this sticker is used to register you for
    installation support from Red Hat Software.


    ## 1.2 Missing Something?


    If you''ve purchased the Official Red Hat Linux boxed set from Red Hat Software
    or one of its distributors, and you''re missing one or more of the items listed
    above, please let us know! call us at 1-888-733-4281 (+1-919-547-0012 outside
    the USA), or send mail to sales@redhat.com.


    If your Red Hat Linux boxed set is complete, please skip ahead to section 2.1.4
    on the following page.


    ### 2.1.3 No Boxed Set? No Problem!


    Of course, not everyone purchases a Red Hat Linux boxed set. It''s entirely possible
    to install Red Hat Linux using a CD created by another company, or even via FTP.
    In these cases, you may need to create one or more diskettes to get started.


    For people installing Red Hat Linux/Intel, you''ll need a boot diskette, and optionally
    a supplemental diskette. It is also possible to start the installation directly
    from the CD, under certain conditions. We''ll discuss this later.


    ### 2.1.4 Checking for Disk Images


    If you''re installing Red Hat Linux from a CD or via network, you''ll need to
    check that the image is correct. You can use the `sum` utility to do this.


    If you''re installing Red Hat Linux from a floppy, you''ll need to check that
    the disk is not corrupted. You can use the `fsck` utility to do this.


    If you''re installing Red Hat Linux from a hard drive, you''ll need to check that
    the partition is not corrupted. You can use the `fdisk` utility to do this.


    ## 2.1 Hardware Configuration


    Before you install Red Hat Linux, you should have a basic understanding of the:


    - **hard drive(s)** – Specifically, size, and type.

    - **memory** – The amount of RAM.

    - **CD-ROM** – Most importantly, interface (IDE or SCSI).

    - **SCSI adapter** (if one is present) – The adapter’s make and model number.

    - **network card** (if one is present) – The card’s make and model number.

    - **mouse** – The mouse’s type (serial, PS/2, or bus), protocol (Microsoft, Logitech,
    etc.), and number of buttons; also, for serial mice, the port it connected to.


    ### 2.2 Video Configuration


    If you will be installing the X Window System, you should also be familiar with
    the:


    - **video card** – The card''s make and model number (or the video chips it uses),
    and the amount of video RAM it has.

    - **monitor** – The unit''s make and model number, along with allowable ranges
    for horizontal and vertical refresh rates.


    ### 2.2.3 Network-related Information


    If you will be connected to a network, be sure you know your:


    - **IP address** - Usually represented as a set of four numbers separated by dots,
    such as 10.0.2.15.

    - **netmask** - Another set of four numbers separated by dots. An example netmask
    would be 255.255.248.0.

    - **gateway IP address** - Yet another set of four dot-separated numbers. For
    instance, 10.0.2.254.

    - **one or more name server IP addresses** - One or more sets of dot-separated
    numbers. 10.0.2.1 might be the address of a name server.

    - **domain name** - The name given to your organization. For instance, Red Hat
    Software has a domain name of redhat.com.

    - **hostname** - The name of your computer. A computer might have a name like
    pooh, for instance.


    ## 2.3 Installation Methods


    You can install or upgrade Red Hat Linux via any of several different methods.
    Each method works best in different situations, and has different requirements.
    But before we discuss each installation method, let''s take a look at an issue
    that may affect some of you.

    '
