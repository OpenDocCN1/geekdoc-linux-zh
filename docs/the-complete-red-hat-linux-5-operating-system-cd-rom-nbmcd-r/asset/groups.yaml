    # 前言


    欢迎！感谢你对红帽 Linux（Red Hat Linux）的关注。我们认为自己拥有当今市场上最好的 Linux 发行版，并一直努力工作以保持这一领先。红帽
    Linux 5.0 是红帽软件长长系列产品中的最新作。我们希望你喜欢它，并能像我们投入精力制作它一样，享受使用红帽 Linux 的乐趣。


    有趣的是，尽管 Linux 在某些特定的计算机用户群体中非常流行且广为人知，但仍有很多人直到现在才听说 Linux。对于这部分人群，接下来的章节将提供足够的背景知识，帮助你熟悉
    Linux 和红帽软件。如果你想了解更多关于 Linux 如何开发和分发的信息，请参阅第 213 页的附录 E 获取更多信息。


    ## 什么是 Linux？


    1991 年 8 月，一位来自芬兰的学生在 comp.os.minix 新闻组中发布了一个帖子，内容如下：


    > 大家好，所有使用 minix 的朋友——

    > 我正在做一个（免费的）操作系统（只是一个爱好），

    > 它将不会像 gnu 那样庞大和专业，

    > 针对 386(486) AT 仿隆机。


    这位学生就是林斯·托瓦兹（Linus Torvalds），他所说的“爱好”最终变成了我们今天所知的 Linux。


    Linux 是一个功能齐全且符合 POSIX 标准的操作系统，它不仅是由林斯开发的，还由全球成百上千的程序员共同开发的。有趣的是，这种巨大的全球开发工作在很大程度上是没有协调的。当然，在涉及内核（Linux）方面，林斯说了算，但
    Linux 不仅仅是内核。它没有管理基础设施；一个俄罗斯的学生获得了一块新主板，编写了一个驱动程序来支持该主板的新功能。马里兰州的一个系统管理员需要备份软件，于是他自己写了一个，并免费提供给任何需要的人。正确的事情似乎会在正确的时间发生。


    另一个有趣点是，Linux 完全不需要花钱就能获得。没错，对于任何有时间和意愿下载它的人来说，大多数软件都是（免费）提供的。但并不是每个人都有那么多时间……


    ## 什么是红帽 Linux？


    现在是一组位于北卡罗莱纳州的程序员小组。他们的目标是让人们更容易尝试 Linux。许多其他小组的方法是将所有必要的零散部分整合成一个凝聚的发行版，让“新手”从在个人电脑上启动新操作系统的某些晦涩的方面中解脱出来。


    然而，与其他发行版不同，这个发行版在根本上是不同的。区别在于？它不是一个存有运行中的 Linux 副本的硬盘快照，也不是从操作系统不同部分导出的磁盘镜像，这个发行版是基于包（packages）的。


    每个包都提供不同的软件部分，经过完全测试、配置并已就绪运行。想尝试一个新的编辑器？下载该包并安装它。几秒钟内，你就可以试用一下。不喜欢？执行单条命令，包就会被移除。


    如果就此而已，这个发行版已经很棒了。但基于包意味着它还有一个额外的优势：


    这个 Linux 发行版可以很容易地升级。


    Linux 世界的软件开发节奏很快，因此旧软件的新版本不断涌现。在其他发行版中，升级软件是一件痛苦的事——完全升级通常意味着删除硬盘上的所有内容并重新开始。


    到这里，你可能已经猜到了，位于北卡罗莱纳州的红帽软件程序员小组以及基于包的发行版就是红帽 Linux。


    自红帽 Linux 在 1994 年夏天推出以来，红帽和红帽软件经历了飞速增长。许多事情发生了变化：对更冷门硬件的支持、可靠性的极大提高，以及全球公司对 Linux
    的日益增长。


    但许多仍然保持不变。Linux 仍然由全球的人们开发。自红帽 Linux 以来，红帽和红帽软件已经取得了飞速发展。（注：此处原文重复翻译翻译翻译翻译翻译翻译翻译翻译翻译翻译翻译翻译，红帽
    Linux 翻译翻译翻译翻译翻译翻译翻译红帽 Linux 翻译翻译翻译翻译翻译翻译翻译翻译翻译翻译翻译翻译。）


