    \n在开始之前请阅读所有的安装指令；这将为你需要做的决策做好准备，并消除潜在的意外。\n\n# 3 开始安装\n\n本章解释了如何启动 Red Hat Linux\
    \ 安装过程。我们将在本章中涵盖以下领域：\n\n- 熟悉安装程序的用户界面。\n- 启动安装程序。\n- 选择安装方法。\n\n在本章结束时，安装程序将在你的系统上运行，并且已选择合适的安装方法。\n\
    \n# 安装程序用户界面\n\nRed Hat Linux 安装程序使用基于屏幕的界面，包含了图形用户界面中常见的大多数屏幕“小部件”。你将看到：\n\n\
    - 窗口\n- 按钮\n- 文本区域（带或不带滚动条）\n- 选选框 \n- 文本输入框\n\n我们会在安装过程中遇到这些功能时进行指出。请注意，由于安装程序必须在各种计算机上运行，因此用户界面不是基于图形的，而是基于字符的。此外，某些计算机可能没有鼠标，因此安装程序使用按键进行导航。\n\
    \n### 3.1.1 使用键盘导航\n\n你可以使用一组简单的按键组合在安装对话框中进行导航。在大多数对话框中，有一个光标或高亮区域，你可以使用方向键移动。通过使用\
