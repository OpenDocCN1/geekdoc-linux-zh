    # 9 Control Panel


    The control panel is a launching pad for a number of different administration
    tools. They make your life easier by letting you configure things without remembering
    configuration file formats and awkward command line options.


    To start the control-panel, start the X Window System as root with startx and
    type control-panel in xterm. You will need to run the control-panel tools successfully.
    You can do this as if you already have X running as a normal user. Just type su
    -c control-panel and then type the root password when prompted. If you plan to
    do other tasks as root, you could type su - followed by the root password when
    prompted. You will then be given a root shell. Here, you will need to type DISPLAY=:0
    control-panel & to get the control panel to work. The "DISPLAY" part tells the
    control panel to use your display. This syntax works only for a Bourne-compatible
    shell bash. If you run tcsh, you would enter setenv DISPLAY=:0; control-panel
    &.


    Double clicking on an icon starts a tool. Please note that


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_144_0.png)


    # Control Panel


    the tool shown in Figure 9.1 users are not prevented from starting two instances
    of any tool, but doing so is a very bad idea because you may try to edit the same
    files in two places and end overwriting your own changes. If you do accidentally
    start a second copy of a tool, you should quit it immediately. Also, do not manually
    edit any files managed by the control-panel tools while the tools are running.
    Similarly, do not run any other programs that may change those files while the
    tools are running.


    # 9.1 User and Group Configuration


    The tool shown in Figure 9.1 manages the users and groups on your system. In a
    sense, it is a graphical editor for /etc/passwd and /etc/group, and for /etc/shadow
    if you have enabled shadow passwords. With this tool you can add and remove users
    and groups, set login shells, full names, home directories, uid, gid, etc.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_145_0.png)


    Figure 9.1: User and Group Configuration Panel


    # 9.1.1 Adding or Editing a User


    The same interface is used to add and edit users. To add a user, click on the
    Add button in the main window. A dialog box will pop up like the one in figure
    9.2 which will enter the username, with some defaults already filled in. To edit
    an existing user, double-click the user in the main window, or click on the user
    and then on the View/Edit button.


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_146_0.png)


    Figure 9.2: Add User Dialog Box


    This is not the user''s first and last name; it is the id it will use to log on
    the system. Do not include any spaces or colons, and do enter more than 8 characters.
    Press the enter key when you are finished, and most of the other fields will be
    filled with default values. You may change them you wish, but it is not necessary.
    You can, at your option, enter the user''s full name, office, and phone numbers.
    The login shell can be changed from the default /bin/bash either by choosing a
    selection from the drop-down menu or simply typing it in like the others.


    You need to do something about the password. There are five options on the Password
    menu: Original, Change, No Password, Lock, and Unlock. If you want to change the
    password, select Change. If you want to remove the password, select No Password.
    If you want to disable the account, select Lock. If you want to enable the account,
    select Unlock. If you want to keep the current password, select Original.


    If you want to delete a user, select the user in the main window and click on
    Remove. You will be presented with the dialog box shown in Figure 9.3 there are
    three types of action you may take. You may ignore the user''s home directory,
    leaving it alone, you can archive and compress it into a .tar.gz file, or you
    can delete the user''s mail spool if you like. These two actions will take place
    immediately after the deletion, before it asks more input. You can search for
    files owned by the user on parts of the filesystem other than the home directory
    and give ownership to them. If you choose to search for the user''s files, you
    have the option of mailing a report of the errors to root. This is important because
    searching will be done in the background as you continue to work; it may take
    long time. To find files owned by nobody, execute the following command:


    ```

    find / (-group nobody -o -user nobody \) -print

    ```


    times you may just want to temporarily remove a user, with the intention of reinstating
    the user later. The Lock and Unlock functions handle this. When you activate a
    user, the user''s password is locked by prepending a ''*'' to it, preventing the
    user from logging in. You also have the option of "collapsing" the home directory
    with tar and gzip, which can save some space. When you deactivate a user, the
    password locking is removed, and the home directory was collapsed, it is expanded
    back to normal. When you lock a user, you are presented with the same options
    as when you delete a user, but you are unlikely to want to delete any files.


    # 9.1.2 Removing a User


    ![](img/8ae7f5fad98006e6a164a7db64fb5e18_147_0.png)


    Figure 9.3: Delete User Box


    # 1.3 Creating a New Group


    create a new group, switch to group editing by selecting the Groups at the top
    of the main window. Clicking Add brings up a dialog box to specify the group details.
    Enter a first name for the new group. Just like a user name, a group name should
    have no spaces or colons, and should be no longer than 8 characters. You can set
    a group password; if you do, users who are not members of the group may assume
    group membership using the newgrp program and providing it with the password.
    To add members to the group, enter their names in the user list field. When you
    have selected all the group members, click Done.

