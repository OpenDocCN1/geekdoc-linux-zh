    select the hard drive installation method.


    **FTP** - If you are installing directly from an FTP server. Requires a supplemental
    diskette. Please refer to Section 3.4.2 on the facing page to select the FTP installation
    method.


    # 3.4.1 Installing From CD-ROM


    If you are going to install Red Hat Linux from CD-ROM, select "CD-ROM", and select
    Ok. The installation program will probe your system, and attempt to identify your
    CD-ROM drive. If it cannot, you will be asked what type of CD-ROM you have. You
    can choose from the following types:


    **IDE (ATAPI)** Most CD-ROM drives available for Intel-based PCs are IDE (also
    known as ATAPI). If this type is selected, the installation program will check
    for all available IDE devices for a CD-ROM drive.


    **SCSI** Select this if your CD-ROM is attached to a supported SCSI adapter; the
    installation program asks you to choose a SCSI drive. Choose the driver that most
    closely resembles your adapter. You may specify options for the driver if necessary;
    however, most drivers will detect your SCSI adapter automatically.


    **Other** If your CD-ROM is neither an IDE nor a SCSI CD-ROM, it’s "other". Sound
    cards with proprietary CD-ROM interfaces are examples of this CD-ROM type. The
    installation program presents a list of drivers for supported CD-ROMs – choose
    a driver and, if necessary, specify any driver options.


    Once your CD-ROM drive has been identified, you will be asked to insert the Red
    Hat Linux CD-ROM into your CD-ROM drive. Select Ok when you have done so. After
    a short delay, the next dialog box will appear. Turn to Chapter 4 on page 49 to
    continue installing Red Hat Linux.'
