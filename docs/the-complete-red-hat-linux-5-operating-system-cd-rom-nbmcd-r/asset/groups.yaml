    如果你打算从 CD-ROM 安装 Red Hat Linux，请选择“CD-ROM”并选择 Ok。安装程序将探测你的系统并尝试识别你的 CD-ROM 驱动器。如果无法识别，将被询问你拥有的是种类型的
