  md: '# # Chapter 21


    # ## Password Hacking


    Every email, computer system, database, bank account, server and account that
    needs to be protected has a password. A password is used to access an account
    or system. People often set passwords that are easy for them to remember. They
    may use the names of their family members, their date of birth, mobile number
    and other easily accessible information. This makes the password quite simple
    to hack. Therefore, every user should try their best to create a strong password
    to protect their accounts from hackers.


