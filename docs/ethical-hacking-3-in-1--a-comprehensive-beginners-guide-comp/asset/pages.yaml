    Now, let''s see how an ethical hacker can protect a system from DNS poisoning.


    # How to Avoid DNS Poisoning


    As an ethical hacker, it''s important that you look at how you can prevent the
    possibility of penetration testing in a network. Your knowledge as an attacker
    will enable you to protect the system from the techniques that you employ.


    There are multiple things to keep in mind when trying to protect the system from
    a penetration test. One piece of information you should remember is a hardware-switched
    network to protect the most vulnerable parts of the network will help to isolate
    the traffic in the network into a collision domain and single segment. Also, the
    IP DHCP snooping tool on a switch will prevent ARP spoofing and poisoning attacks.


    When you deploy a wireless access point in the network, all the traffic on the
    network can be sniffed using a sniffing tool. Additionally, you should encrypt
    the sensitive data in the network and use the IPsec or SSH protocol to encrypt
    the data.


    You can also use port security to protect those switches. These switches are used
    to program specific MAC addresses and allow them to send and receive data on the
    ports in the network.


    Bear in mind that IPv6 is a safer protocol when compared to the IPv4 protocol.
    You should try to replace different protocols like Telnet and FTP'
  merge: -1
  pgno: 92
- img_proc: true
  md: with that can prevent sniffing. You can use SSH or other protocols that have
    IPsec, and you can also use a VPN (Virtual Private Network) to defend the system
    from sniffing by encrypting the packets of data. Lastly, it is a good idea to
    use a combination of SSL and IPsec.
