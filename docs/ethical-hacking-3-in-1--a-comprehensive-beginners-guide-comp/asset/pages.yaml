  md: '# # Chapter 29


    # # Penetration Testing


    Penetration testing is a process or tool that many companies use to identify or
    minimize the security breaches in a network or organization. The organization
    can hire a professional who will try to hack the network and the systems to identify
    the loopholes or vulnerabilities that need to be fixed. Before the company performs
    a penetration test, it will have an agreement with the ethical hacker that addresses
    the following parameters:


    +   - When the test should be performed

    - What the IP Address of the source system should be

    - What fields the hacker is allowed to penetrate


    A penetration test is always conducted by a professional hacker who will use open-source
    and commercial tools, perform manual checks and automate some tools. Since the
    objective of this test is to identify all the vulnerabilities of the system, there
    are no restrictions made on the tools that the hacker can utilize.


    # ## Types of Penetration Testing


    There are fives types of penetration tests that can be performed on a network
    or system. These include the black box, grey box, white box, external penetration
    testing, and internal penetration testing.


    # ## Black Box


    During black box testing, the ethical hacker has no initial information about
    the network or the infrastructure of the organization that he or she is trying
    to penetrate. Therefore, the hacker will try different methods to learn about
    the network or infrastructure of the organization.


    # ## Grey Box'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'In this type of test, the ethical hacker has some information about the network
    and infrastructure of the target organization. For instance, the hacker may have
    the domain name server.


    # White Box


    In the white box test, the ethical hacker has all the information that she needs
    about the network and infrastructure of the target organization that she’s trying
    to penetrate.


    # External Penetration Testing


    During external penetration testing, the ethical hacker focuses on the network
    server and infrastructure of the target organization and also on information about
    the operating system. The hacker will need to attack the organization using public
    networks and will attempt to hack the infrastructure of the organization’s web
    servers, public DNS servers, webpages, etc.


    # Internal Penetration Testing


    In this type of testing, the hacker is already within the network, and he performs
    his tests on the organization from there.


    Penetration testing can lead to numerous problems, including loss of data, crashing
    the server or systems, and system malfunctioning. Therefore, a company must always
    calculate the risk before it decides to perform a penetration test on the network.
    The risk can be calculated using the following formula: Risk = Threat * Vulnerability.


    # Example


    For this example, we will assume that you are working on developing an e-commerce
    website. You may want to perform a penetration test before the website goes live.
    In this instance, you’ll need to weigh the advantages and disadvantages of performing
    the test. When you do perform it, you will interrupt the services offered by the
    website. If you do not want to perform it, you should accept the risk that there
    may be some unpatched vulnerability in the system that will always be a threat.


    Before you carry out the test, you must ensure that you put the scope of it in
    writing so that both you and the company are aware of what’s being tested.'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'For instance, if the company uses a remote access technique, or a VPN, you
    should test it to ensure it doesn’t become a vulnerability.


    The application will certainly use a webserver with a database, so you should
    test the database for any injection attacks. It’s important to perform this test
    on a web server. You can also check if a web server is protected from a denial-of-service
    attack.


    # Quick Tips


    You should consider doing the following when you choose to begin a penetration
    test on the target network or system:


    +   Understanding the requirements, and list and evaluate the risks associated
    with performing this test


    +   Hiring a certified hacker or professional to conduct the test since they are
    aware of all the methods they need to use to identify the vulnerabilities in the
    system or network


    +   Ensuring that you sign an agreement before you begin the test'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Chapter 30


    # How to Code a Keylogger Using C


    A keylogger is a computer program that captures keystrokes made by every user
    in real time. The hacker can then decide to send these logs to FTP addresses or
    emails depending on the type of keylogger they''re using (whether it a remote
    keylogger or a physical keylogger).


    A physical keylogger is useful when the hacker has access to the system and can
    retrieve these logs personally. A remote keylogger can be accessed from anywhere
    in the world, but it requires that the system you are working on has Internet
    access. This chapter will help you develop a C program to build a physical keystroke
    logger or keylogger. Once we understand this logic, we will extend it and build
    a remote keylogger that will allow you to send logs to emails and FTPs.


    Let’s first look at how a simple keylogger works.


    # Algorithm to Write the Code


    Before you begin to write the code, you should understand and identify the steps
    you need to follow.


    +   - To store the keylogs, you should initialize an empty log file.

    - Use the GetAsyncKeyState() function to intercept the keys that the user presses.

    - Create a file to store these intercepted values.

    - To make the running window undetectable, you should hide it.

    - To make the program run in all conditions, use the while loop.

    - To reduce the usage of CPU to 0%, introduce the Sleep() function.'
