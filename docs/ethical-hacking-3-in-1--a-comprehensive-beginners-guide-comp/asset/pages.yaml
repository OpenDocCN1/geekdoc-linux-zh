    issues. Hackers can easily sniff the network and look at the packets of data without
    accessing the network directly. Since a wireless network communicates using radio
    waves, it''s easy for a hacker to sniff the network. Hackers use network sniffing
    to hack a wireless network. A wireless card in sniffing mode is said to be in
    the monitor mode.


