  md: '# Consequences of Receiving a Spoofed Email


    Spoofed emails, if taken seriously by the recipients, can have dangerous consequences.


    +   - An email about a bomb spoofed from your email ID and sent to a security
    agency can result in you spending the rest of your life in prison.

    - Spoofed emails between partners or spouses containing hurtful information can
    result in a breakup or a divorce.

    - A spoofed email from your email ID containing a resignation letter sent to your
    boss can have bad consequences.

    - Spoofed emails can be used for fraudulent activities leading to monetary losses.


    # Identifying a Spoofed Email


    The header of every email contains complete details of the path an email has traversed
    before landing in your inbox. It is very important that if you see an email that
    you feel does not belong in your inbox or promises things that are too hard to
    be true, as a thumb rule, you go through the headers of the email. The headers
    will help you identify the original source of an email and will also display the
    forged source of the email. Headers will help you understand if the email was
    sent using an email service or an email script as they will display the name of
    the website on which the email script was executed.


    There are simpler ways of identifying a spoofed email as well. The following flags
    should trigger your senses and let you know that the email is spoofed.


    If the subject of the email matches something like:


    +   - Your email account has been hacked. Reset your password immediately!

    - Your personal details have been hacked.

    - Your bank account details have been hacked.


    Or if the email requests you for information along the lines of:


    +   - Your personal or bank account details.

    - The email requests you to deposit money in a particular account for'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'pending dues.


    +   - Visit a link to reset your password or verify your credentials.


    +   - A job portal link for a job profile you never looked up.


    In addition to this, there are certain technical parameters in the header of an
    email that will help you understand if the email is spoofed too.


    Let us have a look at the following part of an email header received by gmail.


    Received-SPF: pass (google.com): best guess record for domain of postmaster@mail-sor-f69.google.com
    designates 209.85.220.69 as permitted sender client-ip=209.85.220.69;


    Authentication-Results: mx.google.com;


