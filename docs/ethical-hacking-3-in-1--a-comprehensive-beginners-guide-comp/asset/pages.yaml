    # Network Protocols and How they work


    It is important to understand how network protocols work before launching server-side
    exploitation. There are three main protocols that you will come across during
    your hack – TCP (Transmission Control Protocol), UDP (User Datagram Protocol),
    and ICMP (Internet Control Message Protocol).


    TCP is involved with internet traffic. The protocol guarantees secure communication,
    and it is part of most of the protocols you come across every day, such as HTTP,
    SMTP, Telnet, and FTP. Whenever reliable communication between a client and a
    server is needed, TCP is used. You can refer to the three-way handshake in Chapter
    6.


    UDP, on the other hand, enhances faster communication. It is ideal for communication,
    as video streaming. While UDP is less secure compared to TCP, it is way faster.
    Unlike TCP, UDP does not perform the three-way handshake and, as such, does not
    guarantee that the packet will get to its destination. Common UDP protocols are
    DNS and SQL server.


    ICMP is the last common network protocol that you will come across during an ethical
    hack. Unlike TCP and UDP, which run on layer 4, ICMP runs on'
