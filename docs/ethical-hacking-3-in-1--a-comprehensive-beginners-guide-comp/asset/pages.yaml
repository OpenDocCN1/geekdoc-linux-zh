  md: '# Obtaining Hashes in Post-Exploitation


    In computer systems, passwords are stored either as plain texts or in hash values
    in a database or a file system. A hash is an irreversible cryptographic algorithm
    – which means that once a plain text password is sent across a hash algorithm,
    it cannot go back to its plain text format. The only way to crack the password,
    therefore, is by guessing numbers and letters and passing them through a hashing
    program them manually comparing the hashed passwords.


    Hashing algorithms come in different types, the most common one being MD5 and
    SHA-1. You can tell the hashing algorithm used by looking at the length of the
    hashed passwords – MD5 will have 32 characters or less, while SHA-1 will have
    41 characters or less.


    Besides looking at the length, you can use the Hash Analyzer tool to identify
    the hash type. The tool compares hashes based on lengths and makes guesses for
    hashes with the same length.


    # Cracking Hashes


    Once you have found the hash algorithm, you now need to crack the hashes to get
    passwords and access services like RDP, VNC, and telnet. You will use some of
    the methods we looked at earlier in chapter seven, including brute force and dictionary
    attacks. However, brute force and dictionary attacks are not effective means of
    cracking hashes because of the salt value. A salt value is a random string added
    to a password before it is encrypted. The string might be anything such as a username
    or session ID. Even when two users have the same password, the salt will be different,
    meaning it is extremely challenging to crack hashes using brute force.


    As an attacker, if you get to the database table where hashes are stored, you
    can dump the salts, and you could use them to generate a password.


    Rainbow Tables help you crack passwords. They have a precomputed list of hashes
    for different words. Unlike brute force where you have to try random words, with
    Rainbow Tables, you try the most likely word. However, Rainbow Tables can be large.


    John the Ripper is another tool that you can use to crack hashes. The tool'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'does both brute force and dictionary-based attacks.


    # Data Mining


    In ethical hacking, you need to collect sensitive information from the system
    of the target to show that you had access to the system. You can use data mining
    to exploit the target further. To get the data you need, target shared drives,
    home directories, databases, and file servers. You can use meterpreter to enumerate
    confidential data from the victim''s machine.


    To gather information about the OS, for instance, you can use the scraper or winenum
    scripts on meterpreter. That can be done by running the command:


    ```

    meterpreter> run winenum

    ```


    # Exploiting Further Targets


    Most targets exposed to the internet highly sensitive data. Seeing most of these
    targets are not accessible from outside, you can reach out to them through the
    compromised target. This process is referred to as pivoting. You can use the commands
    you have learned so far to find mode details about other targets on the same network
    as the target. On Windows, you can use the ipconfig command and ifconfig command
    in Linux.


    To identify these other targets, you can use the “ARP_Scanner” script on meterpreter.
    The script employs an ARP scan to identify other hosts on a network.


    Once you have found these other targets, you will need to use the autoute script
    on meterpreter to route traffic from the compromised machine to these other machines
    on the same network.


    With these other targets, you can use the remote exploitation techniques discussed
    in chapter SEVEN to compromise the other targets.'
