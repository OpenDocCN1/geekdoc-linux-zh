    effective. Simply put, DNS Cache Snooping is the process of querying a DNS server
    to determine whether or not it has cached resources. This way, an ethical hacker
    can identify all websites that a target has visited recently. These records come
    in the form of A record, CNAME, or txt record. In most cases, an attacker is concerned
