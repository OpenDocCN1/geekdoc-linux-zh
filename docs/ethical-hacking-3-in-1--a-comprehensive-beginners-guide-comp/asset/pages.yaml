    # TCP Three-Way Handshake


    The Transmission Control Protocol, TCP, was developed to enhance communication
    reliability. It is employed on a variety of protocols on the internet, and it
    ensures that communications are reliable through its three-way handshake. To understand
    how port scanning works, you need to understand TCP in-depth. In communication
    between two hosts:


    +   - The first host sends the second host a SYN packet.

    - The second host sends a SYN/ACK packet as indication that the packet was received.

    - Then the first host sends an acknowledgment packet to complete the connection.


    When you understand TCP in-depth, it will help you execute your ethical hack with
    much ease. Some of the TCP flags you need to know include: SYN, which initiates
    a connection; ACK, which acknowledges receipt of a packet; RST, which resets connections
    between hosts, and FIN, which completes the connection.


