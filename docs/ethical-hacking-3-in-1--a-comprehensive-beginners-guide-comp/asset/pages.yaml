  md: '# Conclusion


    I sincerely hope you enjoyed this book and that it helped you to get jump-started
    into the world of ethical hacking. The tools mentioned in every chapter of the
    penetration testing lifecycle are the most popular and commonly used tools by
    ethical hackers. You can use them as a foundation to explore other tools available
    in Kali Linux that will help you in every stage of the penetration testing lifecycle.


    I would like to conclude by saying that ethical hacking is a noble profession
    and not a criminal activity as misinterpreted by the masses. While it is a fact
    that malicious hacking is a crime and should be considered as a criminal activity,
    ethical hacking never was, and will never be categorized as a crime. The main
    aim of ethical hacking is to help companies with IT policies and industry regulations.


    Ethical hacking was designed to prevent malicious hacking. Malicious hacking should
    be prevented, but at the same time, ethical hacking, which encourages innovation,
    research, and technological breakthroughs, needs to be promoted so that the masses
    can be made aware of this noble profession.


    Now that you know how to get started with hacking, it is my responsibility to
    tell you to use the skills for a good reason. There are many job opportunities
    out there, and there is a lot of respect for ethical hackers, so make use of your
    talent and hone your skills.


    I wish you good luck with your hacking endeavors.'
