  md: '# Chapter 26


    # Cross-Site Scripting


    A cross-site scripting, is an attack performed on the target system''s browser
    by executing a malicious JavaScript. This is a type of code injection attack.
    In cross-site scripting, the hacker will not target the vulnerable system directly,
    but will instead exploit the vulnerability in a website that''s accessed by the
    victim. He will then use that vulnerability to inject the script into the target''s
    system.


    The malicious JavaScript will look like a legitimate part of the website that
    the victim is viewing. Hackers can perform this attack using JavaScript, HTML,
    Flash, ActiveX or VBScript, though most hackers prefer to use JavaScript. The
