    # EtherPeek


    EtherPeek is a tool that helps to simplify network analysis that is performed
    on a heterogeneous network environment. This is a very small tool that can be
    installed on any system in a few minutes. One can use this tool to sniff the traffic
    packets on any network and supports different protocols, including IP, AppleTalk,
    UDP, NBT packets, IP Address Resolution Protocol (ARP), NetBEUI, TCP and NetWare.


    # SuperScan


    SuperScan is a powerful tool that can be used to resolve hostnames and scan'
