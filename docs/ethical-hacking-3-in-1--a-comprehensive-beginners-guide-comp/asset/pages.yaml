  md: '# Chapter 34


    # Tips to Become a Professional Hacker


    There are a number of mistakes an amateur can easily make when hacking into a
    system. This can wreak havoc on their hacking outcomes, professional or not. This
    chapter identifies some of the deadliest mistakes that are commonly made by amateurs.


    # No Written Approval


    If you want to hack into a system, it’s always important to get approval from
    the upper management or the customer. This is your “get-out-of-jail-free card”.
    You will need to obtain the following documents for approval:


    +   - A laid out plan mentioning the systems that will be affected as a result
    of the hack

    - Sign-off by your plan by an authorized decision maker agreeing to the terms
    and conditions to avoid being held liable if anything were to go wrong

    - The original copy of the agreement


    There are no exceptions here.


    # Finding All Vulnerabilities


    There are a number of vulnerabilities that exist in systems – some are well known,
    while there are others that aren’t so obvious. It would be impossible for the
    hacker to find all the vulnerabilities in the system. You should not guarantee
    that you’ll find all the vulnerabilities in a system. Otherwise, you’ll be starting
    something you can never finish. Therefore, you have to ensure that you stick to
    the following tenets:


    +   - Always be realistic.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '+   - Use effective tools.

    - Understand the system better and improve your techniques.

    - Assume that you can eliminate all vulnerabilities.


    Computers are never 100 percent secure, and in reality, there will never be a
    time when they are. Therefore, it''s impossible for you as a hacker to prevent
    all security vulnerabilities. There are a few things you will need to keep in
    mind while advancing your career as a hacker:


    +   - Always follow the best practices.

    - Harden and protect your systems.

    - Apply a number of countermeasures as possible.


    # Performing Tests Only Once


    Hacking helps you obtain a snapshot of the state of security. There are a number
    of new threats and vulnerabilities that surface almost every day; therefore, it''s
    important that you perform the necessary tests to ensure that your system is able
    to keep up with any new threat that comes into existence.


    # Pretending to Know It All


    No one working with computers or information security knows it all. It''s basically
    impossible to keep up with all the software versions, hardware models and new
    technologies emerging all the time, not to mention all the associate security
    vulnerabilities. Professional hackers know their limitations, and they know what
    they don''t know everything; however, they certainly find out where to go to get
    the answers (try Google first).


    # Always Look at Things from a Hacker’s Perspective


    Think about how an outside hacker can attack your network and computers. You may
    need a little bit of inside information to test some things reasonably, but try
    to limit this as much as possible. Get a fresh perspective, and think outside
    that proverbial box. Study hacker behaviors and common hack attacks so that you
    know what to test for.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Not Using the Right Tools


    Without the right tools for the task, it''s almost impossible to get anything
    done - at least, not without driving yourself nuts! Download the free tools mentioned
    throughout this book and in the list within Appendix A. Buy commercial tools if
    you have the inclination and the budget. No security tool does it all, build up
    your toolbox over time and get to know your tools well. This will save you gobs
    of effort, and you can also impress others with your results.


    # Hacking at the Wrong Time


    One of the best ways to lose your job or customers is to run hack attacks against
    production systems when everyone is using them. Mr. Murphy''s Law will pay a visit
    and take down critical systems at the absolute worst time. Make sure you know
    when the best time is to perform your testing. It may be in the middle of the
    night. (Being a professional hacker is never easy!) This could be used as a reason
    to justify the usage of certain security tools and technologies that would automate
    different hacking tasks.


    # Outsourcing Testing


    Outsourcing is great, but you must stay involved. It''s a bad idea to hand the
    reins over to a third party for your security testing without following up and
    staying updated on what''s taking place. You won''t be doing anyone except your
    outsourced vendors by staying out of their hair. You should always remain involved
    in the testing.


    # How to Woo the Management


    Show how vulnerable the organization is


    If you''re trying to work as a professional hacker for a company, show the company
    how dependent the organization is on its information systems. Create what-if scenarios
    (kind of a business-impact assessment) to show what can happen and see how long
    an organization can go without using computers, network and data. You should ask
    the upper-level managers what they would do if they didn''t have IT personnel
    and computers.


    Show them real-world anecdotal evidence on hacker attacks, including'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'malware, physical security, and social-engineering issues, but be positive
    about it. Don’t approach this in a negative way with FUD. You should keep them
    informed about any changes that you’re making to the security in their company.
    You should also keep a record of how the industry is doing and inform the clients
    accordingly. Find stories related to similar businesses or industries so that
    they can relate. Collect magazine and newspaper articles.


    # Google is a great tool to find practically everything you need here


    Show management that the organization has what a hacker wants, and be sure to
    point out the potential costs from damage caused by hacking. These can include:


    +   - Missed opportunity costs

    - Loss of intellectual property

    - Liability issues

    - Legal costs

    - Lost productivity

    - Clean-up time and costs

    - Costs of fixing a tarnished reputation


    **Be adaptable and flexible**

    You should prepare yourself for rejection and skepticism - it happens a lot, especially
    from upper managers such as CFOs and CEOs, who are often completely disconnected
    from IT and security in the organization.


    You shouldn’t get defensive. You must remember that security is a long-term process
    that cannot be completed over a single assessment. Start small with a limited
    amount of resources as budget, tools and time, if you must, and then build the
    program over time.


    # **Get involved with the business**


    You should understand the business and learn how it operates. Identify the key
    players and study the politics involved in the organization. It’s vital that you
    do the following:'
  merge: -1
  pgno: 180
- img_proc: true
  md: '+   - Attend the meetings and make yourself known; this can help prove that
    you’re concerned about the business.

    - Be a person who wants to contribute to the business.

    - Know your opposition. Again, use the “know your enemy” mentality; if you understand
    what you’re dealing with, buy-in is much easier to get.


    # Always speak to them at their level


    Always talk to your customers in layman’s terms. Do not use jargon to explain
    the concepts; that doesn’t impress anybody. Always talk in terms of the business.
    This is a key skill to develop since you will be able to make them understand
    what it is that you do exactly and how it’s going to help their company.


    Most often, IT and security professionals lose the interest of upper-level managers
    as soon as they start speaking. A megabyte here, a stately inspection there; packets,
    packets everywhere; the data in this section of the database - talking about such
    things is a terrible idea. You should try to relate every security issue to regular
    business processes and other job functions.


    # Show value in your efforts


    Here’s where the rubber meets the road. If you can show people what you’re doing
    and how it improves their business, you can maintain a good rapport with the team.
    This will ensure that you don’t have to plead to keep your professional hacking
    program going consistently. You should keep the following points in mind:


    +   - Always document your involvement in the information security departments;
    create a report for the upper-level managers regarding the state of security in
    the organization, and give them examples of how their systems will be secured
    from known attacks.

    - You should outline all the tangible results and present vulnerability assessment
    reports that you’ve run on the systems or on security tool vendors.'
  merge: -1
  pgno: 181
