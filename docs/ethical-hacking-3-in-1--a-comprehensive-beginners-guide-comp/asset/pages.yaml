  md: '# Chapter 6


    # Sniffing Traffic Across a Network


    To understand this chapter, you need in-depth knowledge of how TCP/IP works. Most
    of the techniques you employ to sniff a network only works on the local area network
    and not across the internet. As such, you and your target need to be on the same
    local area network to make the attacks successful.


    Simply put, network sniffing is an attack where an ethical hacker captures packets
    across a network in a bid to get access to unencrypted credentials passing across
    a network. These attacks target HTTP, FTP, and SMTP. Webmasters use protocols
    that encrypt communication, ensuring that if an attacker sniffs traffic, they
    are not able to use the data they get. However, will the right tools, it is possible
    to sniff traffic even from encrypted communications.


    Sniffing can be active or passive.


    Active sniffing involves interacting with the target machine directly through
    techniques such as MAC flooding and APR spoofing. In passive sniffing, the attacker
    monitors the network and captures packets sent or received from the target.


    # Hub-Based and Switch-Based Networks


    There are two types of networks that you need to understand – hub-based and switch-based
    networks. Hubs operate on layer 1 of the OSI model while switches operate on layer
    2 of the OSI model.


    In a hub-based network, say the setup above, for host A to communicate with host
    B, all traffic will be forwarded to the hub. In this case, a hub is the center
    for all traffic, meaning when it receives traffic, it broadcasts to all the hosts
    on the network. If the information header refers to host B, all other devices
    that might receive the communication will drop it. Since the hub broadcasts communication
    to all devices in a network, a lot of bandwidth is'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'utilized. Again, an attacker can use a sniffer tool to capture traffic and
    access details they can use to launch an attack.


    Unlike hubs, switches do not broadcast traffic to all devices/hosts in a network.
    Instead, it forwards traffic only to the host it is destined for.


    To capture traffic, you also need to differentiate between promiscuous and non-promiscuous
    modes, which are modes associated with network cards. Networks cards are non-promiscuous
    by default, which means that you can only capture network destined for your computer.
    If you need to capture traffic not destined for your computer forcefully, your
    network card needs to be promiscuous.


    # MITM (Man-In-The-Middle) Attack


    For you, as an ethical hacker, to launch a MITM attack, you need to place yourself
    in the middle of the communication between the client and the server. Any communication
    initiated between the two will pass through the attacker. When you successfully
    place yourself in the middle, you can launch any attack, including denial of service
    attacks, DNS spoofing, traffic capture, and session hijacking among others.


    # Understanding ARP Protocol


    ARP is short for Address Resolution Protocol. The protocol resolves an IP address
    to a MAC address. In a switch-based network, if a host (A) with an IP address
    192.168.1.2 wants to communicate with another host (B), with an IP address 192.168.1.3,
    host A needs to have the MAC address of host B. When sending the communication,
    Host A will look in its ARP cache to see it has Host B''s MAC address. If the
    address is missing in the cache, host A will send an ARP request to all devices
    on the network requesting the MAC address of host B. Once host B receives the
    ARP request, it will send its MAC address to host A.


    An ethical hacker can launch ARP attacks. There are two types of attacks, including:


    +   * MAC Flooding

    * ARP Spoofing/ARP Poisoning'
