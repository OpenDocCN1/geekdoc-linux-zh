    # Brute Force Attacks


    Brute force attacks are techniques used to guess the password of your target.
    These attacks are divided into three:


    **Traditional brute force attacks** are where you try out as many username/password
    combinations as possible. Where the password is long, the process can take years
    – which is why this technique should be avoided.


    **Dictionary attacks** involve a custom wordlist that contains all possible username/password
    combinations. It is faster than traditional brute force attacks, but it will not
    work if the password is not present. In Chapter 3, we looked at different ways
    of collecting passwords.


    **Hybrid attacks** are the third category of brute force attacks. Here, you combine
    both traditional brute force and dictionary attacks. This way, you can apply traditional
    brute force on a dictionary list.


    Some of the protocols that you can target with brute force attacks include FTP,
    SMTP, VNC, SSH, SMB, HTTP, RDP, MS SQL, and MySQL. The methodology of attacking
    these protocols is the same; all you need is to change a few parameters in the
    tools you use.


