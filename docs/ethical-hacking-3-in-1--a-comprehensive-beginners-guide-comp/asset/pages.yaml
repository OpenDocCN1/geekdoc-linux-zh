- img_proc: true
  md: '# Chapter 6


    # Ethical Hacking Process


    Like every IT project, ethical hacking should always be planned. You have to determine
    the strategic and tactical issues in the process. Regardless of what the test
    is (whether it is a simple password-cracking test or a penetration test on an
    application on the Internet), you must plan the process.


    # Formulating the Plan


    It is essential that you get approval before you begin the ethical hacking process.
    You have to ensure that what you are doing is known and visible to the system
    owners. The first step to working on the project is to obtain sponsorship. You
    can connect with an executive, manager, customer or even with yourself if you
    are your own boss. All you need is to have someone who can back you up and sign
    off on your plan. Otherwise, there’s a possibility that someone may call everything
    off, stating that they never permitted you to test the devices.


    If you''re testing the systems in your office, you need a memo from your boss
    that gives you permission to perform them. If you are testing for a customer,
    you must ensure you have a signed contract that states the customer’s approval.
    It is pertinent that you obtain written approval so your effort and time don’t
    go to waste. Also, this way, you will learn more about what you need to ensure
    that you stay out of trouble.


    It is essential to have a detailed plan, because if you make one mistake, the
    systems can crash. However, this doesn’t mean that you need to include the different
    testing procedures you intend on using. A well-defined plan or scope should include
    the following information:


    +   * Which systems need to be tested

    * The risks involved'
  merge: -1
  pgno: 41
- img_proc: true
  md: '+   - When the tests will be performed and how long they will run for


    +   - How the tests will be performed


    +   - How much knowledge you have about the systems


    +   - What you''ll do if you come across a major vulnerability


    +   - The deliverables, like security-assessment reports, high-level reporting
    of general vulnerabilities that the company should address and countermeasures
    that the organization should implement


    You must always begin the testing with the most vulnerable and critical systems.
    For example, it is best to start with social engineering attacks or computer passwords
    before you move on to more detailed issues. It''s always a good idea to have a
    contingency plan in mind if something goes astray. There''s a possibility that
    you may take the firewall down when you are assessing it; or you may close a web
    application while testing; this will reduce employee productivity and system performance
    since the system would then be unavailable for use. There have been times this
    has led to bad publicity, loss of data and loss of data integrity.


    You should handle DoS and social engineering attacks carefully. You have to determine
    how these attacks will affect the system you''re testing and the organization.
    You must also determine when the tests should be performed. Do you want to test
    the systems early in the morning or late at night to avoid affecting the production
    of employees? Is it ideal to involve the people in the organization to be certain
    that they approve of the timing?


    You have to remember that crackers do not attack your system during a limited
    period. Therefore, in this approach, you can run any type of test aside from social
    engineering, physical and unlimited attack approach. physical and DoS tests. You
    should never stop with one security hole since that will lead to a false sense
    of security. You have to continue to test to see what other vulnerabilities you
    can discover. This doesn''t imply that you should continue to hack until all your
    systems crash. You should simply pursue the path that you are on and hack until
    you can no longer hack the system.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'One of the goals you should keep in mind when you perform these tests is to
    ensure that nobody detects the attack. For instance, you can perform your tests
    on a remote system or from a remote office when you''re trying to avoid letting
    system users know what you''re doing. If the users are aware of what you''re up
    to, it will affect the outcome as they will then be on their best behavior.


    You must be confident that you understand the system well enough to perform the
    hack. This will help to ensure that you protect the systems when you are testing
    them. If you are hacking your own system, it''s not difficult to understand it.
    If you are hacking a customer''s system, you will need to spend some time to understand
    how the system functions. Customers will never ask you to give them a blind assessment,
    because people are scared of these assessments. You should base all the tests
    you want to perform on the customer''s needs and these assessments.


    # Selecting Tools


    As with any project, you have to select the right tools if you want to complete
    the task successfully. That being said, you will not necessarily identify all
    the vulnerabilities in the system simply because you use the right tools. You
    must know the technical and personal limitations of your customer. Many security-assessment
    tools generate negative outcomes and false positives. Some tests won''t locate
    the vulnerabilities. For example, if you perform a social engineering test or
    a physical-security test, it is easy to miss some weaknesses.


    Certain tools focus only on specific tests, but no one tool can be used for everything.
    You cannot use a word processor to scan the network for any open ports, because
    that does not make sense. It is for this reason that you need specific tools for
    the test you wish to perform. Your ethical hacking efforts become easier when
    you have more tools at your disposal.


    However, it is vital that you remember to choose the right tool for the task.
    You need to use tools like pwdump, LC4 or John the Ripper to crack passwords.
    SuperScan, which is a general port scanner, will not crack all passwords. If you
    want to perform an in-depth analysis of a web application, you should use tools
    like WebInspect or Whisker since they''re more appropriate when compared to network
    analyzers like Ethereal.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'When you need to select the right tools for a task, you should ask for advice
    from other ethical hackers, or you can post your questions on online forums and
    decide on the best tool to use.


    Another option is using security portals like SearchSecurity.com, SecurityFocus.com
    and ITSecurity.com, or a simple Google search, to learn more about the different
    tools available for your tests. Experts provide their feedback and also give insights
    on the different types of tests an ethical hacker can perform.


    Let''s look at a list of some freeware, open-source and commercial security tools:


    +   * Nmap

    * EtherPeek

    * SuperScan

    * QualysGuard

    * WebInspect

    * LC4 (formerly L0phtrack)

    * LANGuard Network Security Scanner

    * Network Stummer

    * ToneLoc


    We will learn more about some of the tools listed above over the course of the
    book when we look at different types of hack attacks. Most people often misunderstand
    the capabilities of these hacking and security tools. This is because of the incorrect
    assumption that tools like Nmap (Network Mapper) and SATAN (Security Administrator
    Tool for Analyzing Networks) have gained bad publicity.


    Some of these tools are complex, and you should familiarize yourself with each
    before you begin to use them. Here are some ways to do just that:


    +   * Read the online help files or the readme files for the tools.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '+   * Go through the user guide for any commercial tool.

    * Join an online or formal class to learn more about the tool.


    # Executing the Plan


    You need to be patient and have enough time on your hands to perform the hack.
    You also have to be careful while performing the hack. An employee looking over
    your shoulder or a hacker in the network will always watch what''s going on, and
    this person will use the information they have obtained against you.


    You cannot expect to perform an ethical hack when there are no crackers in the
    network, because that does not happen. You have to ensure that you keep everything
    private and quiet. This is critical when you are deriving, transmitting and storing
    the results of the test. You should try to encrypt these files and emails using
    tools like Pretty Good Privacy (PGP) and others. The least you can do is to protect
    the files using a password.


    You''re on a mission to get as much information as you can about the system you''re
    testing. This is what a cracker will do. You should begin with a broad perspective
    and then narrow your focus:


    +   1. Look for the name of the organization, computer, network system and the
    IP Address; this information will often be available on Google.


    +   2. Now, narrow the scope and target the systems that you''re testing. A casual
    assessment will turn up information about the system, regardless of whether you
    are assessing web applications or physical-security.


    +   3. Narrow the focus with a critical eye and perform an actual scan. You should
    also perform detailed tests on the system.


    +   4. If you want to perform an attack, do it now.


    # Evaluating the Results


    You should now assess the results of your hack to identify what you''ve discovered.
    It’s advised that you make the assumption that these'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'vulnerabilities were never uncovered before; this is where the results count.
    You need more experience to evaluate the results and identify the correlation
    between the vulnerabilities, and then you''ll know your systems better than anybody
    else. The final step is to submit a formal report to your customer or to the upper
    management and outline your results. You must always keep both parties in the
    loop to show them that their money was well spent.


    # Moving On


    When you have finished the ethical hacking test, you''ll need to implement the
    analysis and also give the customer some recommendations. This will help to ensure
    the security of your systems. When you run these tests, new security vulnerabilities
    will appear. The information systems will always change, and these will become
