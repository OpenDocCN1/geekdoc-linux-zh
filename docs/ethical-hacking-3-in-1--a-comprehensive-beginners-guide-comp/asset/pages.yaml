  md: '# Step 3: Scanning


    Automated scanning will help reduce the time required to scan an entire system
    for vulnerabilities. There are several applications available to scan web servers,
    and a good ethical hacker should not rely on just a single application. A single
    application can never uncover thousands of security flaws and list down all the
    vulnerabilities of a system. It is a good practice to use at least two or three
    tools to scan web applications. Scanning applications such as Nessus, WebInspector,
    and Retina are industry leaders but are expensive. Kali Linux has a set of inbuilt
    scanning tools that can be used for the purpose of scanning.


    Let us go through a few of them.


    # Arachni


    The Arachni tool is a web application scanner that runs from a graphical interface
    just like the Nessus. The only difference is that unlike Nessus, Arachni can perform
    a single scan on a single host on a single port at a given time. If the target
    system has multiple web services on multiple ports, you will need to repeat the
    scan every time with new port parameters. For example, if http://helloworld.com
    has a web service hosted on port 80 and phpMyAdmin is running on port 443 (HTTPS),
    you will have to run two individual scans. There are several settings and plugins
    available for Arachni that allow specific scanning. All the plugins are enabled
    by default. Arachni also supports reporting in a click to export reports in all
    popular file formats.


    You can launch the Arachni web application scanner in Kali Linux as follows.


    Click on Applications > Kali Linux > Web Applications > Web Vulnerability Scanners
    > arachnid_web


    ```

    > Starting the Arachni Dispatch server...

    > Starting the Arachni UI server...

    > The web interface is at: http://127.0.0.1:4567

    > --- It may take a while to startup, try refreshing the page a couple of times.

    > Hit Ctrl+C to shut everything down.

    ```'
  merge: -1
