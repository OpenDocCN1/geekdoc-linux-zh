    # Maintain Meterpreter Session Stability

    Meterpreter sessions die or get killed. If you compromised a target using aurora
    exploit on Internet Explorer 6, your session would die when the victim closes
    IE6. However, you can stop that by migrating your session to a stable process
    such as explorer.exe or svchost.exe. On Metasploit post/windows/manage/migrate
    directory, there is a script that can help you migrate. You will only need to
    run the command below:


    ```

    meterpreter> run post/manage/migrate

    ```


    To migrate to a certain process, you need first to run the "ps" command to search
    for process IDs. Now down the ID of the process you need to migrate to. For instance,
    svchost.exe is on ID 856, you will run the command below:


    ```

    meterpreter> Migrate 856

    ```


    After successful migration, you will get a message like the one below:


    ![](img/d52d8402f5bef7b14bcbab9bcc53820f_292_0.png)


    Once your session is stable, you can now escalate privileges and accessing more
    parts of the victim’s system.


    # Escalate Privileges


    Now that your session is stable, you can now escalate privileges. The fastest
    way to do that is to use the "getsystem" command, which has a list of techniques
    you can use to get the highest privilege level on the system. When you enter the
    "getsystem -h," you will see the techniques used by meterpreter to escalate privileges.


    To use a specific technique, introduce the -t parameter, which should be followed
    by the technique number on the list provided. However, you can use the -t parameter
    without any number so that it can test all the techniques to save time.'
