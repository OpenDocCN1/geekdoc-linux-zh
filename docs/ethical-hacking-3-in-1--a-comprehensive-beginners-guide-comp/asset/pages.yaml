    # Quick Fix


    A DDoS attack is one of the most prevalent attacks performed on vulnerable networks
    and systems. Unfortunately, there''s no way to fix this problem quickly. If the
    system is under an attack, you should never panic, but instead start looking at
    the matter step by step.'
