    ```


    You can confirm whether IP forwarding is enabled by running the cat command. If
    the cat command results to “1” then forwarding is enabled. If the results show
    “0”, then forwarding is disabled.


    ```

    cat >/proc/sys/net/ipv4/ip_forward

    ```


    After enabling IP forwarding, you will need three pieces of information to launch
    an attack – the attacker’s IP, the victim’s IP, and the default gateway. The IP
    attacker’s IP address is the address on your BackTrack, while the default gateway
    is the IP address of the attacker’s router. You will also need to gather the MAC
    address of the victim from the ARP cache.


    To use ARP Spoof, you will need to use the interface below:


