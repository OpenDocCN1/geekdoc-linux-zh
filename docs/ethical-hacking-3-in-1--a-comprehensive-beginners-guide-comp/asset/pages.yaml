  md: '# # Chapter 8


    # # Techniques To Exploit The Client


    In Chapter SEVEN, we looked at different techniques to exploit the server. However,
    servers are becoming stronger each day. In instances where a client hides under
    NAT, Router, or Firewall, and they are not directly reachable, you will need to
    rely on client-side exploitation. Human is to error, as the saying goes – means
    your victim will make a mistake that will give you access to their system.


    For client-side exploitation to work, you will need to gather personal details
    about your victim, including their likes, dislikes, their friends, place of work,
    pet names, and any other personal detail that may help you launch an attack. Social
    media is a great place to find all these details.


    # ## Client-Side Exploitation Attack Scenarios


    There are many methods you can use to attack your victim.


    # ## Emails with Malicious Attachments


    Here, you will send your victim malicious files in the form of PDFs, mp3, or exe.
    If the victim opens the files, downloads them, and executes them, you will have
    a meterpreter session, which will give you access to the victim’s system.


    # ## Malicious Links in Emails


    In this method, you will send a link to your victim with the hope that they will
    click on the link. The link can direct your victim to a fake login page or a server
    with malicious code. When you are hosting a web server, the code will be executed
    on the victim’s browser, and this will give you a meterpreter session from where
    you can control your victim’s system.


    # ## Compromising Updates


    If this case, you will need to ensure that your victim downloads a malicious'
  merge: -1
