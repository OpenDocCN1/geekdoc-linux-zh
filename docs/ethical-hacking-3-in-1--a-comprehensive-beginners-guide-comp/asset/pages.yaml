    spmf=pass (google.com): best guess record for domain of postmaster@mail-sor-f69.google.com
    designates 209.85.220.69 as permitted sender smtp.helo=mail-sor-f69.google.com;


    dmarc=pass (p=QUARANTINE sp=QUARANTINE dis=NONE) header.from=googlemail.com

    ```


    DKIM-Signature: v=1; a=rsa-sha256; c=relaxed/relaxed;


