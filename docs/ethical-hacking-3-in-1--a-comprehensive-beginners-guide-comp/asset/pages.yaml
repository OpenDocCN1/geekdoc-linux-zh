- img_proc: true
  md: 'are expensive.


    # Lawful Interception


    Lawful Interception, LI, is a legal way to access any communication network data,
    including email messages and telephone calls. LI has existed since the advent
    of electronic communications and was once called wiretapping. There must be a
    legal binding contract that allows a hacker to analyze or obtain evidence from
    the target network. Therefore, this is a process whereby the network service provider
    or operator will give notice of official permission to access any confidential
    information or any communication between the organization and the individual.


    Many countries have drafted a legislation, and some have enacted legislation,
    to regulate any LI procedures. There are some standardization groups that are
    creating technology specifically for LI. Most LI activities are performed for
    the sake of cyber security and infrastructure protection, and there are some private
    network operators who are allowed to perform LI within their network.


    # Sniffing Tools


    Hackers use different tools to sniff a target network, and each of these tools
    has its own features. These features make it easier for a hacker to analyze the
    traffic and understand the information better. A sniffing tool is a common application,
    and this section lists some of the tool most implemented.


    # BetterCAP


