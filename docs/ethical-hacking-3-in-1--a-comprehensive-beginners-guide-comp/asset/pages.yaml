    types of MITM attacks on the target network. It can also be used to manipulate
    the HTTPSPS, TCP and HTTP traffic in the network, sniff the network for credentials
    and much more.


    # Ettercap


    Ettercap is a comprehensive suite of tools that can be used to perform man-in-the-middle
    attacks. This suite sniffs out the connections, filters the content on the website
    and performs many other interesting tricks. It also supports both passive and
    active dissections of different protocols and includes many features that will
    enable the hacker to perform a host and'
