  md: '# # How to Bypass User Access Control


    User Access Control is one of the security features on Windows Vista and later
    that ensures malware does not compromise the system. With UAC, all applications
    are assigned standard user privileges until the administrator grants them more
    privileges.


    It is easy to configure the UAC irrespective of the OS you are running. To do
    that, you only need to search for the keyword "uac" on the search box. On default,
    UAC is on level 3 and will notify you whenever a program needs to make changes
    to your computer. On Windows, the interface will look like the one.


    ![](img/d52d8402f5bef7b14bcbab9bcc53820f_293_0.png)


    You cannot use the “getsystem” technique on any operating because UAC will stop
    the commands. Fortunately, you can bypass UAC using the “bypassuasac” module on
    Metasploit. You will need to run the command below to bypass the security.


    ```

    metermeter> run post/windows/escalate/bypassuasac

    ```


    After bypassing UAC, you can now try to use the “getsystem” technique.


    # ## Impersonating the Token


