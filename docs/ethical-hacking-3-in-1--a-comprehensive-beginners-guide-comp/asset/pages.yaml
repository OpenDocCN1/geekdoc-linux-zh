    # Ping Sweep


    Ping sweeps are a way to scan the network to determine the IP address of the target
    system from a group of hosts. This is also called an ICMP sweep. Most hackers
    use the command ''fping'' to perform a sweep. This uses the ICMP, or Internet
    Control Message Protocol, echo to confirm if a host is active. This is different
    from the regular ping command since you can specify the file that contains the
    list of hosts or simply specify a list of hosts on the command line. If the host
    does not respond in a specific time limit, the command will determine that they
    are inactive.


    # Quick Fix


    If you want to disable a ping sweep on a network, it will be easy to block any
    ICMP echo from an external source. To do this, you should create a firewall in
    the iptables. This can be done by using the following command:


    ```

