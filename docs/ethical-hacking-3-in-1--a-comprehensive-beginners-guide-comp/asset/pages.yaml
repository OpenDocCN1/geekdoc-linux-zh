  md: '# Chapter 23


    # # Wireless Hacking


    Every wireless network has at least one or devices connected to it, and each device
    has a different radio wave in a limited space range. The devices in this type
    of network can continue to work but will need to be connected to the network and
    allow data to be shared between the systems in the network. Wireless networks
    are widely used around the world, and it''s easy for any user to set up one of
    these networks. They adhere to the IEEE 802.11 standards, and a wireless router
    is used to connect different systems to the network. In every wireless network,
    there are access points that are used as extensions for a wireless range. These
    points are analogous to logical switches.


    ![](img/d52d8402f5bef7b14bcbab9bcc53820f_123_0.png)


