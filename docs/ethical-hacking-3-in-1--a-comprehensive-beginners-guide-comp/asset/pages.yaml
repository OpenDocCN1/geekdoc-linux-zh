  md: '# Chapter 2


    # Types of Hackers


    A hacker can be placed into one of the following categories: black hat, grey hat
    or white hat. Each hacker is classified based on their intent. These terms are
    borrowed from the Old West when a good cowboy would wear a white hat while a bad
    cowboy would do a black hat.


    # White Hat Hackers


    A white hat hacker, who is also called as an ethical hacker, does not want to
    harm the system. His motive is to identify the weakness in any network system
    or computer through different vulnerability assessments and penetration testing.
    Ethical hacking is legal, and, in fact, many companies hire ethical hackers to
    find vulnerabilities.


    # Black Hat Hackers


    A black hat hacker, who is also known as a cracker, is someone who wants to hack
    a network or a system to gain unauthorized access. This type of hacker wishes
    to harm the system or steal some sensitive information. Black hat hacking is illegal
    since the person who is hacking the system does it with bad intentions. This includes
    violating privacy, blocking any communication on the network, stealing corporate
    data, damaging systems, etc.


    # Grey Hat Hack


    A grey hat hacker is a blend of both a white hat and a black hat. These hackers
    do not have any malicious intent but hack a network or a system merely for fun.
    They want to exploit the vulnerabilities in the system without actually taking
    permission from the owner. Usually, their goal is to inform the owner of any weaknesses
    and gain appreciation and/or a sum of money from them.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Miscellaneous Hackers


    Apart from the list of hackers detailed above, there are a few other categories
    of hackers that should be mentioned. These include script kiddies, intermediate
    hackers, elite hackers, hacktivists, cyberterrorists, and hackers involved in
    organized crime.


    # Script Kiddies


    These hackers are computer novices who use the different tools and documentation
    available on the Internet to perform a hack. They do not know what happens behind
    the scenes and only comprehend enough to cause minimal harm. They are often sloppy,
    so they leave digital fingerprints everywhere. These are the hackers you hear
    about in the news. They need very minimal skills to attack a system since they
    use what is already made available to them.


    # Intermediate Hackers


    These hackers know just enough to cause some serious issues. They have knowledge
    about networks and computers and use this knowledge to carry out well-known exploits.
    Some intermediate hackers want to be experts at the process; if they put in some
    effort, they can certainly become elite hackers.


    # Elite Hackers


    Elite hackers are experts. They’re the people who develop several hacking tools
    and write scripts and programs. Script kiddies use these very tools and programs
    to perform their own attacks. Elite hackers write codes to develop malware like
    worms and viruses. They know how to break into a system and cover their tracks
    or pretend that someone else was responsible for the attack.


    Elite hackers are secretive and only share information if they believe their subordinates
    are worthy. For some lower-level hackers to be evaluated as worthy, they should
    possess some special information that an elite hacker can use to perform an attack
    on a high-profile system. Elite hackers are the worst type of hackers. However,
    there are not too many of them in the world compared to the number of script kiddies.


    # Hacktivists


    These hackers disseminate social or political messages through their attacks.
    A hacktivist always finds a way to raise awareness about a given issue. Some'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'examples of hacktivism are the many websites that had the “Free Kevin” messages.
    These hacktivists wanted the government to release hacker Kevin Mitnick from prison.
    Some other cases include the protests against the U.S. Navy Spy Plane that collided
    with a Chinese fighter jet in 2001, attacks against the U.S. White House website
    for years, hacker attacks between Pakistan and India and messages supporting the
    legalization of marijuana.


    # Cyberterrorists


    Cyberterrorists attack government computers or other public utility infrastructures
    like air-traffic control towers and power grids. They steal classified government
    information or crash some critical systems. Countries have started to take cyberterrorist
    threats seriously, ensuring that power companies and other similar industries
    always have information-security controls in place. These controls will protect
    systems from such attacks.


    # Organized Crime


    Some groups of hackers can be hired to perform an organized crime. In 2003, the
    Korean police busted one of the largest hacking rings on the Internet. This ring
    had close to 4,400 members. In addition to that group, the Philippine police busted
    a multimillion-dollar hacking ring that sold cheap phone calls made through the
    lines that the ring had hacked into. These types of hackers are always hired for
    a large amount of money.'
  merge: -1
