    scanners are and how they do their work. Put simply, a vulnerability scanner is
    a tool that scans computers, applications, or networks in search of weaknesses
    that an attacker can exploit or to compromise their target. The scanner works
    by sending a set of data to the target and analyzes the response received to determine
    details such as open ports, OS, services, and vulnerabilities.


    One advantage of using a vulnerability scanner is that it gives you details all
