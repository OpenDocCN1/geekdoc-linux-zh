    This header contains two parameters that are used by email servers to identify
    the authenticity of an incoming email.


    # Received-SPF


    An SPF record is a TXT based DNS record that is provided by an email provider
    to be added in the DNS zone of a domain name. The SPF record syntax has IP addresses
    that are allowed to send emails on behalf of the domain name.


    In the above example, when gmail.com is analyzing the incoming email, it is checking
    the SPF record of the sender''s domain name and see that the IP 209.85.220.69
    is allowed to send the email on the domain''s behalf. If the source IP of the
    incoming email were to be something else, gmail.com would have classified the
    email as spam.


    # DKIM-Signature


    The DKIM signature is another parameter that holds a publicly available key with
    which the sender''s domain has been signed. When gmail.com receives the incoming
    email, it sends a request to the sender''s server to match this key with the sender
    domain''s respective key on the originating server. If the key matches, the email
    is believed to be genuine again.


    # Email Phishing


    Email Phishing is the process of sending an email to a person claiming to be'
  merge: -1
  pgno: 405
- img_proc: true
  md: 'someone and tricking them into disclosing sensitive information such as their
    personal details or bank account details. Essentially, email phishing is a product
    of email spoofing. The attacker will send you an email; they may do this by manipulating
    the headers of the email to look like a legitimate source. Alternatively, if they''re
    not that at hacking, they will try to send an email from an email address that
    is very similar to legitimate email addresses. For example, they will create an
    email address like info@citibank.com. At first glance, this looks like a genuine
    email address for Citibank, but if you look closely, there are two I''s in it.
    If you are not very careful, you may end clicking on a malicious link in the body
    of the email planted by the attacker to redirect you to a website where you will
    be asked for your banking details. The website, however, is a fake website developed
    by the attacker only to steal your information.


    # Phishing Scams


    What do some of the most common phishing emails look like? Phishing emails mostly
    have content that promises you that you have something big. Attackers rely on
    how gullible a target is to be successful in phishing scams.


    In early 2000, African attackers sent out a lot of emails to users claiming that
    they were someone with a lot of wealth and wanted to give it away to common people
    in their dying moments. The sum would be as big as USD 100,000. Gullible recipients
    would fall for this and reply to these emails expecting to make some easy money.
    However, as the process progresses, the attackers would request the winners in
    a minimal amount of money, which would be needed to transfer the winning amount
    to the user''s bank account. This would be a sum like USD 100, and the users would
    send this amount to the attackers, only to never hear from them ever again.


    # Prevention against Phishing


    You can follow some basic precautions to protect yourself against phishing scams.


    +   - Make sure that you read an email carefully and double-check the sender of
    the email. If the sender is a known friend, but the email looks a bit odd, call
    them up and check with them if they sent you'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'any such email.


    +   If the email contains links, carefully examine the link before clicking on
    it.


    +   If you have somehow clicked on a link and landed on a website requesting you
    to enter your login details, examine the URL in the browser to check if it is
    indeed a URL that you are familiar with.


    +   Login into websites that have a digital certificate installed on them and
    work on the HTTPS protocol.


    # Securing your Email Account


    Simple measures can go a long way in protecting yourself from email hacking. Some
    simple steps to be careful while working with emails are as follows.


    +   When you set up a new email account, always configure a secondary email account
    or an alternate email account to help you with email recovery in case the primary
    account is hacked.


    +   Do not take the security questions section of setting up a new email account
    lightly. Set up real questions from your life with real answers as the security
    questions will help you recover an email account if it is hacked or if you have
    forgotten your password.


    +   As a thumb rule, avoid opening emails from strangers.


    +   Always use your personal computer to check emails and do not use anyone else’s
    computer as you may end leaving your email account logged in on their computer.


    +   No matter how much you trust a person, never reveal your passwords to them.'
