    You will be able to change your partitioning scheme when your system is live,
    but that may damage your system and files on it, if not done properly.


    After clicking Continue, you will see a progress bar screen with the progress,
    and the installer will begin copying files to your hard disk. The time taken to
    complete this depends on your hardware.


    # Configuring the Packet Manager


    After the installer finishes copying files to your hard disk, the next screen
    will show you a prompt to configure the package manager for your Kali Linux system.
    The package manager is very crucial for your system. It comes into when Kali Linux
    needs to update its package repository as per the new updates on its software.
    It is advisable to use the network mirror that is inbuilt in Kali Linux, as it
    will have access to the official Kali Linux package sources for updates.'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'You can click on Yes to Continue. You will be prompted with another screen
    to specify a third party network package URL. This is again used when your Kali
    Linux system is part of a corporate system that stores a local repository for
    Kali Linux packages on its local server. You can just leave it blank and click
    on Continue to proceed with the installation.


    # Installing the GRUB Loader


    On the next screen, you will be asked if you wish to install the GRUB bootloader
    for your Kali Linux system. The GRand Unified Bootloader, which is also known
    as GRUB, is the main screen that appears every time the Kali Linux system boots
    up. It gives you a menu to continue into the system and can be used for some advanced
    settings before the boot as. It is not required for advanced users, but for new
    users, it is recommended.


    Select Yes and click on Continue.


    # Completing the Installation


    Finally, you will reach the completion screen. You can click on Continue, and
    your system should reboot. Eject your DVD or USB stick and continue with the reboot.
    You should now be presented with the Kali Linux welcome screen after the reboot.
    Log in as the root user with the password you had set up and voila: you are done!
    Welcome to Kali Linux.


    # USB Drive Installation


    A USB drive, also known as a USB thumb drive or a USB stick, is a storage device
    that can be plugged into the USB port of a computer system. We recommend that
    you use a USB drive with at least 8 GB storage or more for installing Kali Linux.
    All new computer systems today can boot from a USB device. You can select set
    boot priority for your USB device from the BIOS settings for your computer.


    We will go through the installation process for Kali Linux on a USB drive using
    a Windows machine and a Linux machine. You can check the official documentation
    provided for this on the Kali Linux website to understand it in detail.


    While using USB drives to boot an operating system, two important terms come into
    the picture: persistence and non-persistence.'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'Persistence refers to the ability of the system to retain changes or modifications
    made to its files, even after a reboot. Non-persistence means that the system
    will lose all changes made earlier after it goes through a reboot. In this book,
    the USB drive installation of Kali Linux through a Linux machine will be persistent,
    and through a Windows machine will be nonpersistent. This will ensure that you
    learn about methods.


    # Windows Non-Persistent Installation


    Before you can proceed with installing Kali Linux on a USB drive through Windows,
    you will need to download the Win32 Disk Imager. You can download it from the
    following URL


    https://sourceforge.net/projects/win32diskimager/


    After you have downloaded the Kali Linux ISO just like you did in the case of
    Hard Drive installation, plug in your USB drive in your computer system, and Windows
    will automatically detect it and assign a drive letter to it. Next, launch the
    Win32 Disk Imager application. Click on the folder icon to browse through your
    files and select the Kali Linux ISO you have downloaded earlier and click on the
    OK. From the drop-down, select the drive assigned by Windows to your USB drive.
    Click on the Write button to start writing the Kali Linux operating system to
    your USB drive.


    The process will take some time depending on your system hardware. After the Win32
    Disk Imager has completed writing the ISO to the USB drive, reboot your computer
    system and select the highest priority for your USB drive from the BIOS settings.
    Every computer system has a different user interface for BIOS settings depending
    upon the manufacturer. So carefully select the boot priority settings. After you
    have done that, reboot the system again, and it should give you a Kali boot menu.
    You can select the Live option, which is mostly the first option to boot into
    the Kali Linux desktop from the Live USB directly.


    # Windows Persistent Installation


    I would like to emphasize that size matters a lot while building a persistent
    USB drive for a Kali Linux installation. Depending upon your Linux operating system
    that you will use to create the Kali USB drive, ensure'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'that you have the GParted application installed on your system. If you encounter
    difficulties installing GParted, go through the documentation. You may use one
    of the following commands to install GParted via the terminal.


    ```

    apt-get install gparted

    aptitude install gparted

    yum install gparted

    ```


    After you have downloaded the Kali Linux ISO, plug in the USB drive into your
    computer system. Use the following command on the Linux terminal to figure out
    the location of the USB drive.


    ```

    mount | grep -i udisks | awk ''{print $1}''

    ```


    You should get the file location of the USB drive like something /dev/sdb1. Be
    careful as it could differ for your system. In the next command, remove any numbers
    at the end, which is sdb1 to sdb.


    Use the dd command to write the Kali Linux ISO to the USB drive as follows.


    ```

    dd if=kali_linux_image.iso of=/dev/sdb bs=12k

    ```


    Launch GParted application using the following command.


    ```

    gparted /dev/sdb

    ```


    The drive should show one partition already with the Kali Linux image installed
    on it. You need to add another partition to the USB drive by'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'selecting New from the menu that appears after you select the Partition Menu
    on the Menu Bar. Steps may vary slightly depending upon the manufacturer, but
    the steps mostly stay as below.


    +   - Click on the unallocated grey space.

    - Click on New from the partition drop-down menu.

    - Use the graphical sliders or specify a size manually.

    - Set the File System to ext4.

    - Click on Add.

    - Click on the Edit drop-down menu and select Apply All Operations.

    - Click OK when you see a prompt. This will take a few minutes to complete.


    You can add a persistence function to the USB drive using the following commands.


    ```

    mkdir /mnt/usb

    mount /dev/sdb2 /mnt/usb

    echo "/ union" .. /mnt/usb/persistence.conf

    umount /mnt/usb

    ```


    That is it. You have now created a persistent Live Kali Linux USB. Reboot your
    system, and you should be able to boot the Kali Linux operating system from the
    USB drive.'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# Chapter Three


    # The Penetration Testing Life Cycle


    An Ethical Hacker is also known as a Penetration Tester in the industry. Ethical
    hackers are proficient with the penetration testing lifecycle. An organization
    hires ethical hackers so that they can conduct several penetration tests on the
    organization’s digital infrastructure with the management’s approval and discover
    vulnerabilities in the system so that they can be patched before a real attacker
    targets the system.


    There is a common misconception among masses that an ethical hacker or a penetration
    tester just needs to sit on a computer, run a piece of code, and they can gain
    access to any system in the world. People have this notion mostly because of things
    they see in movies, but it is far away from truth. Professionals in this field
    are very careful and precise with their approach to discover and uncover exploits
    in a computer system.


    Over the years, a definite framework has been established, which has been adopted
    by ethical hackers. The first four stages of this framework guide an ethical hacker
    to discover vulnerabilities in a system and understand to what level these vulnerabilities
    can be exploited. In comparison, the final stage ends up documenting the actions
    of the first four in a neat report to be presented to the senior management of
    the organization. This framework has not only created a proper planning and execution
    structure for an ethical hacker. Still, it has also proved to be very efficient
    for conducting penetration tests at multiple levels of an organization’s digital
    infrastructure.


    Every stage gathers inputs from the previous stage and further provides inputs
    to the next stage. The process runs in a sequence, and it is not uncommon for
    ethical hackers to return to a previous stage to analyze previously discovered
    information.


    Patrick Enbretson has clearly defined the first four stages of the penetration
    testing lifecycle in his book The Basics of Hacking and Penetration Testing.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'The steps are called Reconnaissance, Scanning, Exploitation, and Maintaining
    Access. This book explains the first four stages as per Patrick''s book but expands
    to an additional stage called Reporting.


    If you have read the five-phase process defined by the EC-Council in its popular
    course names Certified Ethical Hacker or CEH, you may argue that this book does
    not contain the final stage from it Covering Tracks. We have intentionally left
    that out from this book to add more focus on the first four stages and also introduce
    Reporting, which is not covered in most of the other books available on Ethical
    H on the market today.


    The other difference you may see in this book is that the penetration testing
    lifecycle has been represented using a linear version instead of a cyclic one.
    We have done so because we believe that an ethical hacker linearly encounters
    things during their engagement. The process begins with reconnaissance or gathering
    information about the target system and ends with the ethical hacking team presenting
    a report to the senior management about their discoveries through the process.


    In this chapter, we will draw out a basic view of all the five stages of the penetration
    testing lifecycle, and we will then have a dedicated chapter devoted to each of
    these stages. The dedicated chapters will also introduce you to the most common
    tools used by ethical hackers in each stage. In this way, you will not only understand
    the five stages of the penetration testing lifecycle but also have an idea of
    the tools used by security professionals when you engage in penetration testing.


    # The Five Stages of the Penetration Testing Lifecycle


    We will discuss the five stages of the penetration testing lifecycle with an analogy
    to the functioning of an army in a war situation on the international borders.


    # Stage 1: Reconnaissance


    Imagine a dimly lit room, where analysts and officers are going through the map
    of a foreign territory. Other analysts in the room are watching the news on numerous
    televisions and taking down notes from the incoming news. There is a final group
    in this room, which is preparing a final draft of all the information that has
    been gathered by every group about the target.'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'scenario tells you what happens during military reconnaissance but is very
    similar to what an ethical hacker will do in the reconnaissance stage of the penetration
    testing lifecycle.


    An organization will hire a team of penetration testers or ethical hackers, and
    every member of the team will be working on discovering as much information about
    the target that can be gathered from public sources. This is executed by searching
    the Internet for publicly available information about the target and conducting
    passive scans on the target''s network. In this stage, an ethical hacker does
    not breach the target''s network but just scans it and documents all the information
    to be used in the next stages.


    # Stage 2: Scanning


    Continuing with the military analogy, imagine there is a hilltop behind the enemy
    lines, and there is one soldier from your army who is hidden in the bushes using
    camouflage. The soldier brings back reports of the enemy camp''s location, the
    objectives of this particular camp, and the kind of activities being done on each
    tent of this camp. The soldier also brings in information about all the routes
    that lead you in and out of this camp and the kind of security around it.


    The soldier in this analogy was given a mission based on the information provided
    to him, from the information that was gathered in the reconnaissance stage. This
    holds for the scanning stage of the penetration testing lifecycle. An ethical
    hacker uses the information gathered in stage one to scan the networks and the
    systems of the target. The tools available for scanning help to gather precise
    information about the target''s network and system infrastructure, which is further
    used in the exploitation stage.


    # Stage 3: Exploitation


    Four soldiers from your army make their way through an open field under a cloudy
    sky at night, with a sliver of moonlight. They have their night goggles on and
    can see everything in a green glow. They break their into the enemy camp through
    a gap in the fence and get inside through an open back door. They spend some time
    inside the camp and then make their way out with information about the enemy troops
    for the immediate future.


    This is again what an ethical hacker will do in the exploitation stage. The motive
    of this stage is just to get into the target system and quickly get out'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'with information without getting detected. The stage successfully exploits
    the system and provides information to the ethical hacker to break into the system
    again.


    # Stage 4: Maintaining Access


    Based on the enemy plans provided by the four soldiers, an engineering team digs
    a hole in the earth to make a way to the room in the enemy camp that had all this
    information. The purpose of this tunnel is to provide continuous and easy access
    to this room full of information. An ethical hacker does the same in the maintaining
    access stage. The ethical hacker discovered how to get into the target system
    in the exploitation stage and how to get in and out of the system. If they keep
    repeating this process, they are bound to get some time. Therefore, with the information
    gathered in the exploitation stage, they automate a way to keep their access continued
    to the target system.


    # Stage 5: Reporting


    The commander of the team of soldiers now stands in front of his higher officers,
    such as generals and admirals, and explains the details of the raid to them. Every
    step is explained in detail, and every detail is further expanded to explain the
    details of how the exploitation was successful. At the end of the penetration
    testing lifecycle, ethical hackers also need to create a report that explains
    each stage of the hacking process, the loopholes discovered, the vulnerabilities
    exploited, and the systems that were targeted. In certain other cases, a senior
    member of the ethical hacking team may be required to provide a detailed report
    to the senior management of the organization and suggest steps to be taken to
    make the infrastructure secure.


    The next few chapters will explain all these stages in more detail. You will understand
    the advantages of every stage and the tools used in every stage using the process
    that is drawn for the penetration testing lifecycle.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Chapter Four


    # Reconnaissance


    In this chapter, you will understand the reconnaissance stage of the penetration
    testing lifecycle in depth. The process of reconnaissance will help an ethical
    hacker discover all kinds of information about a target organization and its infrastructure.
    The information collected in this stage will be used in the later stages of the
    penetration testing lifecycle to engage with the organization.


    Just as a military analyzes all information available to them before creating
    a strategy for battle, an ethical hacker needs to gather all publicly available
    information about a target system before planning a penetration test on it. Many
    times, the required information can be obtained from search engines like Google
    and social media. The nameservers of a domain name are responsible for routing
    a user to a particular website on the Internet. Therefore, these nameservers can
    be used to fetch information as well.


    Emails that are routed through an organization can be used to discover information
    too. An ethical hacker can also download the publicly available front end of a
    target organization and maintain it offline to retrieve as much information from
    it as possible. The information gathered from these sources can be used as input
    for social engineering, if social engineering is approved by the management, as
    per the rules of engagement.


    When the reconnaissance stage begins, the ethical hacking team knows very few
    details about the target. The details provided from only the name and website
    of the target organization to detailed information about the target''s network
    and information systems, and even the technologies used in the target organization.
    The penetration test will always be limited by the Rules of Engagement (ROE) that
    are defined by the management. The ROE may limit an ethical hacking team from
    conducting destructive tests like the Denial of Server (DoS) and Distributed Denial
    of Service (DDoS) attacks on the target infrastructure.'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'The main objective of the reconnaissance stage is to discover as much information
    about the target organization as possible. Some important things about the target
    organization that need to be determined are as follows.


    +   - The structure of the organization. This would include detailed information
    about the departments and the organizational charts of various teams in the organization.

    - The digital infrastructure of the organization. This would include the IP space
    of all devices and the network topology.

    - The various technologies used for both software and hardware.

    - Email addresses of all employees.

    - The commercial partners of the organization.

    - The various physical locations of the organization.

    - Any available phone numbers.


    # Trusted Agent


    A trusted agent is the person who hired the ethical hacking team to conduct penetration
    tests for the organization. They are mostly individuals who are representatives
    of the organization. They provide guidelines to the ethical hacking team and will
    not disclose information about the penetration test to the rest of the organization.


    Let us now understand how you can begin with the process of reconnaissance as
    an ethical hacker.


    # Start with Target''s Website


    The target''s profile can be created by gathering information from their website
    as it is a huge treasure of information, to begin with. For example, many organizational
    websites openly display the hierarchy of their organization with the profiles
    of their key leaders. This information should be used as the foundation to create
    target profiles. How? The information available on the organizational leaders
    can be further used to know more about them on social media websites and to execute
    social engineering later on. This should, however, be supported by the rules of
    engagement.


    One very useful section of an organizational website is the job opportunities'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'or the career page. This page can provide detailed information about the technologies
    used in the organization. For example, if there is an opening for a Linux Systems
    Administrator and the requirements include knowledge of the Red Hat Linux flavor,
    you can be sure that the organization has Linux servers that use the Red Hat flavor.
    Moreover, if there are openings for systems administrators for servers running
    technology like Windows Server 2000 or 2003, this would trigger an ethical hacker
    almost instantly as these are operating systems that are more vulnerable to attacks.


    Every organizational website must be checked for a webmail URL as most webmail
    URLs have the syntax webmail.domainname.com. If the URL leads you to a webpage
    for an Outlook Web Access login, you can be sure that the backend is using Microsoft
    Exchange servers for their emails. Alternatively, if a Gmail login page is displayed,
    you know that the email service is outsourced to G Suite and will be outside the
    limitations defined by the rules of engagement. It is very important to lay down
    boundaries before beginning engagement. If the ethical hacking team has questions
    about crossing boundaries, they should always consult the trusted agent before
    any kind of engagement.


    # Website Mirroring


    There are times when it is just more efficient to download the target’s entire
    website and evaluate it offline. A set of automated tools can be run on the offline
    copy to fetch relevant information, or this can just help to have an offline copy
    in case the organization makes changes to the live website. Kali Linux has command-line
    tools such as the wget command that will copy all the HTML and CSS files of a
    website and store them locally on your hard drive. The wget tool is available
    in Kali Linux by default and is very easy to use well. You can use the following
    command to copy all the HTML and CSS files. Note that this command will not copy
    any code, such as a PHP script that is used on the server-side.


    ```

    wget -m -p -E -k -K -np http://example.com

    ```


    In the example mentioned above, the wget command is followed by several'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'options and switches. You can use the command’s man page in Kali Linux to know
    more about the functions of these options.


    ```

    man wget

    ```


    This will pop up the man page for the command, and you can use the arrow keys
    to navigate through the description and function of each option. The man page
    would give you the following description of the options used in the example, mentioned
    above.


    +   -m enables settings to mirror a website

    -p prerequisites or page, this option ensures all files are downloaded including
    image files

    -E extension, this option ensures that all downloaded files are stored with the
    .html extension

    -k this option converts links and makes them suitable for local viewing

    -K this option creates a backup of the original files with a .orig extension


    The files copied from an organization’s website will be stored in a folder with
    the same name as that of the website being copied. When pages are being copied,
    there can be errors when a page containing a PHP is being downloaded. This happens
    when a front-end page depends too much on server-side scripting to display the
    content of the page. Such pages cannot be accessed by tools that clone a website.


    After you download the files, it is very important to keep it limited to the ethical
    hacking team for evaluation. Reposting such a website online again can violate
    copyright-related laws.


    # Google Search


    The advanced search operators available for Google search can be leveraged to
    a great extent for reconnaissance. You can locate the Google Advanced'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'Search on the following URL.


    ```

    https://www.google.com/advanced search

    ```


    This will open a webpage. The top half of this tool will help you find web pages
    by including or excluding terms or numbers. The bottom half of this tool will
    help you make your search more specific. An ethical hacker can use all possible
    combinations of input fields in this tool to create a search string as per their
    requirement. Using multiple input fields will make the search complex but more
    accurate.


    Let us go through all the fields available in the Google Advanced search tool
    by one one.


    # All These Words


    This input can be used to find a web page that contains all the words typed by
    you in the field. Their location on the web page does not matter, and it''s also
    not necessary for the words to be in the same order as typed by you; they just
    need to be on the web page.


    To execute this search, type any number of words in the All These Words input
    field, and it would get converted into a search string by Google''s engine.


    # This Exact Word or Phrase


    Providing an input of words to a phrase in this field will result in a Google
    search for web pages containing those words or phrases in the same order as typed
    by you. This search works in the exact opposite way of the All These Words search.
    This searches a search string by placing all your words or the phrase inside quotes,
    so they are treated as a single string.


    # Any of These Words


    Inputs provided in this field provide results with either/or query. Google will
    look for web pages that contain any of the words typed by you in this field. The
    Google search query places an OR connector between the words'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'typed by you before sending a search query.


    # None of These Words


    This is the opposite of Any of These Words search parameters. Google search will
    exclude web pages that contain the words typed by you and will show all the web
    pages that do not contain any of those words. Google search query places a minus
    sign before the words typed by you before sending a search query.


    # Numbers Ranging From


    This search field contains two fields for inputs. Needless to say, you can enter
    a range of numbers using the two input fields. This search can be further improved
    by using units of measurement as miles, centimeters, or even currency. If you
    want to conduct the same search using the regular Google search method, you need
    to separate the two numbers with two period characters, which will instruct Google
    that it is a range. The result of this search will contain web pages that have
    the range specified by you.


    # Language


    When you choose a specific language from the drop-down menu, the search result
    will contain web pages that have the language you have selected. This option is
    useful to ethical hackers when they target an organization from a particular region.
    For instance, if the target organization is a French firm, you can select the
    French language, which will help you conduct penetration tests in the next stages.


    # Region


    Selecting a particular region will give search results of web pages that have
    been hosted in a particular region. If you do not specify the language in the
    language dropdown, search results for the region will give web pages irrespective
    of the primary language used in that region. You can conduct a more focused search
    if you provide input for both language and region.


    # Last Updated


    The time provided in this field narrows down the search results to'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'contain web pages that have been modified in the specified time frame. This
    helps you exclude old websites and ensure that you get results for web pages after
    a key event has occurred for an organization. For example, if there is news about
    an organization''s merger with another organization on a particular date, or if
    they have switched to a newer technology on a particular date, you can specify
    a timestamp to get all possible information about that organization after the
    event has occurred.


    # Site or Domain


    This input field can prove to be very helpful to narrow down search results. For
    instance, if your search is about a government-based organization, you can specify
    the .gov domain to narrow down results to show only websites hosted on a .gov
    domain name. You can perform the same search in the regular Google search method
    by using a search restrictor. For example, if you want your search to provide
    results restricted to facebook.com, you can use the search restrictor as: facebook.com.


    # Safe Search


    There are two options available for safe search.


    +   - Show the most relevant results

    - Filter explicit


    If you use the explicit filter option, web pages containing sexual content will
    be filtered out. Conversely, selecting the most relevant results will not filter
    out web pages containing sexual content.


    # Terms Appearing


    This option can be used to direct your search query to a particular section of
    the web page. Goes without saying that if you select the option “anywhere on the
    page,” there will be no real restrictions set, and the search will target the
    entire web page.


    Let us go through the different sections of a web page that can be targeted to
    get results.


    # In the title of the page'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'As the phrase suggests, this search will focus your search only on the title
    of web pages. The title of a web page is a short description of the web page,
    which is embedded in the browser tab for a web page. This search can be conducted
    through the regular search method by using the operator intile: in the search
    box.


    # In the text of the page


    When you use this limiter, your Google search will target web pages only for text
    content and exclude other content like images, videos, documents, etc. It will
    also exclude the title of the page. However, if an image is referenced using a
    hyperlink on the web page, the hyperlink will be returned as it is in the text
    format. This search can be conducted through the regular search method by using
    the operator intext: in the search box.


    # In URL of the page


    This search will limit your search strings to the uniform resource locator section
    of a web page. The URL is the address of a web page that appears in the address
    bar of a web browser. This search can be conducted through the regular search
    method by using the operator inurl: in the search box.


    # In links to the page


    This will return the results of other web pages that have links to your search
    criteria.


    # Reading Level


    The search results for this option will return the results of web pages as per
    the complexity of the words on those pages.


    Let us go through the different options available under this search option.


    # No reading level displayed


    This will ensure that no reading level is applied to your search criteria at all.


    # Annotate results with reading level


    This will display the results, but the web pages will all display the reading
    level for the text on that page.


    The Google algorithm is not as great as other tools developed for language'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'refined searches, but it can classify the reading levels into three types:
    basic, intermediate, and advanced. If you conduct a penetration test focusing
    on the reading level of a target, this option can be very useful. For example,
    if your target is a research-based organization, you can keep the reading level
    as advanced so that you do not get search results for unnecessary simple web pages.


    # File Type


    This is another very useful option for an ethical hacker for reconnaissance. This
    search parameter helps you to restrict your search results to display web pages
    that contain specific file types such as a pdf, docx, ppt, etc. You can use several
    file types in this search criteria to get a lot of information. For example, usernames
    and passwords are often stored in an excel file with the xls or xlsx extension.
    If you are lucky, using the excel file extension in your search criteria may return
    files that contain sensitive information of users.


    # Usage Rights


    This search criterion restricts the result of your search to content that is reusable
    based on the copyrights. If you select the option “Free to use, share, or modify,”
    the search result will have content that can be reused without any restriction
    or content that can be shared or modified without any kind of fee. If you select
    the option “Commercial” for your search, it will return web pages that allow them
