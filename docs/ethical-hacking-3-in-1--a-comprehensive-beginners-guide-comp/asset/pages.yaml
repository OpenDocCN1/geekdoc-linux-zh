  md: '# # Chapter 9


    # ## Exploiting Targets Further

    After Gaining Access


    This is the last step in ethical hacking – post-exploitation. Once you have exploited
    your target and you have access to their system, what should you do next? After
    you have access, you need to exploit the target further to have more access, escalate
    privileges, and penetrate the internal network deeper.


    For most post-exploitation processes, we will use Meterpreter. There are many
    built-in scripts in Meterpreter that will help you conduct post-exploitation with
    ease. The scripts are written in ruby, and you can also modify the scripts to
    meet your needs.


    This chapter will focus on how to maintain access and how to dig deeper into the
    internal network.


    # Gathering Information on the Host


    After exploitation and gaining access to the target’s system, you need to find
    more information about the location of the host. Such information would include
    interfaces, hostname, routes, and services that the host of listening to. This
    kind of situation awareness will help you enumerate better.


    # Enumerating Windows Machine


    Most corporations and organizations use Windows. You will need to enumerate the
    network to find out about the host, interfaces, and services, among other details.
    If, for instance, you compromise a Windows host using ms08 _ 067 – netapi exploit,
    you will have a meterpreter session open. From the session, you can execute the
    shell command to open the command prompt. From the command prompt, you can run
    a few commands to find out more about the target’s system. Some of the common
    commands include:


    +   - ipconfig – The command will list interfaces, IP address, MAC'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'address, and gateways.


    +   - ipconfig/all – This command will show additional information about interfaces
    such as DNS servers.


    +   - ipconfig/playdns – Displays the DNS cache.


    +   - arp –a – Displays ARP cache.


    +   - Route Print – Displays our computer’s routing table. You can also use the
    netstat –r command to display the table.


    +   - tasklist/svc – Enumerates all services running on your target’s computer.


    +   - net start/net stop – The net start command will display all services running
    on the target’s computer. You can use the net stop command to stop services such
    as antiviruses.


    +   - netsh – Gathers information on Firewall rules. You can also use the command
    to turn off the firewall with the command “netsh opmode to disable.”


    # Enumerating Local Groups and Users


    You only need two commands to enumerate local groups and users:


    +   - net user – Command lists all local users, including administrators and guests.


    +   - net localgroup – Shows all local groups. For instance, you can run the command
    “net localgroup administrators” to display local groups for administrators.


    +   - To identify domain admins, you can run the command “net \domain.”


