  md: '# # Chapter 3


    # # Gathering Information the Right Way


    The first step in ethical hacking is gathering information. For you to conduct
    a successful hack, you need to gather as much information as possible. You will
    need to know as many details about the target as you can, including their online
    presence, which in turn will lead you to access more details. The details you
    need to gather will depend on whether you are conducting a network hack or a web
    application hack. In the case of a network ethical hack, you need to collect as
    much information about the network as possible – the same applies to web application
    hacks.


    In this chapter, we will study more on how you can gather information about your
    target from the real world. Information gathering techniques are classified into
    two:


    +   - Active information gathering

    - Passive information gathering


    Active Information Gathering involves directly engaging the target. Here, you
    can find details such as ports are open on your target, services that the target
    is running, the OS they are using, and any other details you can get when you
    engage the target. While active information gathering gives you what you need
    to execute a hack fast, the techniques applied are detected by IPS, IDS, and firewalls.
    These techniques also generate a log of presence, making them not ideal when you
    need less noise.


    Passive information gathering does not engage the target. Instead, you gather
    information without the client knowing what you are up to. Here, you can use search
    engines, social media, or any other website that will help you gather information
    about a target. This information gathering technique is recommended seeing that
    it not leave a log of presence. For instance, you can use Facebook, LinkedIn,
    and Twitter to collect employees'' details including their likes and dislikes.
    Later, you can use the information collected'
  merge: -1
