    Enumeration is the first phase in the ethical hacking process. This is when you
    can gather information. In this process, the attacker should establish or build
    a live connection with the target system or network to discover the attack as
    much as possible. This is then used to exploit the target system.


    Enumeration is one of the best ways to gather information about:


    +   * Network shares

    * IP tables

    * SNMP data (if it''s not well-secured)

    * Password policy lists

    * Usernames on different systems


    An enumeration attack is always dependent on the different services that are offered
    by the system. These services include:


    +   * DNS enumeration

    * NTP enumeration

    * SNMP enumeration

    * Linux/Windows enumeration

    * SMB enumeration


