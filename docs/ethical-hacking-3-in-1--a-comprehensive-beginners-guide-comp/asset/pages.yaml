  md: '# Chapter 11


    # Fingerprinting


    OS fingerprinting is defined as the method used in ethical hacking to learn more
    about the operating system that a remote system uses. This can be done through
    either active or passive fingerprinting.


    # Active Fingerprinting


    You can actively fingerprint a remote system by sending some packets of data to
    the target system. These packets should be specially crafted. It’s important that
    you then note the responses and analyze the information that’s accumulated. This
    will help you understand the operations of the remote system.


    In this chapter, we will go into detail about how you can identify the operating
    system of a target system.


    # Passive Fingerprinting


    Passive fingerprinting is done using a sniffer trace like Wireshark on the remote
    system. By using the trace, you can obtain data about the operating system of
    the target host or system.


    You must look at the following elements to learn more about the operating system:


    +   - Window size: This will provide information about the size that is set by
    the operating system for the window.


    +   - TOS: This will provide information about the types of services offered by
    the operating system.


    +   - TTL: This will give you information about the time-to-live on an outbound
    packet.'
  merge: -1
  pgno: 70
- img_proc: true
