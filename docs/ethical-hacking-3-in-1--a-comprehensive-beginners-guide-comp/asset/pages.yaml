- img_proc: true
  md: '# Chapter 7


    # Phases of Ethical Hacking


    As mentioned earlier, there is a process that you should follow before beginning
    to hack a system or network ethically. This chapter covers the different phases
    of the ethical hacking process, which will help you or any other ethical hacker
    plan an attack. Every organization or company has a security manual that will
    explain the process differently. Most certified ethical hackers follow the six
    phases that will be discussed in this chapter.


    # Reconnaissance


    The first phase of the process is the reconnaissance phase. This phase is also
    called the information-gathering phase. It’s in this phase that hacker should
    collect as much information as they can about the target system or network. Information
    is often accumulated about the following groups:


    +   1. Host

    2. Network

    3. People


    Reconnaissance can be categorized into two types: active and passive.


    # Active Reconnaissance


    In this type of reconnaissance, the hacker will interact directly with the target
    system or computer to gather information. For example, the hacker can use the
    Nmap tool to scan the network or system.


    # Passive Reconnaissance


    In this type, the hacker will try to gather information about the system or network
    without interacting directly with the network, collecting data from websites,
    social media, etc.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Scanning


    In this phase, the hacker will need to probe the target system and look for any
    vulnerabilities that it can exploit. For this purpose, the hacker can utilize
    Nexpose, Nessus and the Nmap tool.


    # Getting Access


    Once the hacker identifies a vulnerability in the system or network, he or she
    will need to exploit that vulnerability to find out if they can enter the system.
    For this purpose, most hackers use a tool called Metasploit.


    # Maintaining Access


    Once the hacker has gained access into the system, he or she will need to install
    a back door, or trap door. This will allow the hacker to enter the system whenever
    required in the future. Most prefer to use Metasploit during this phase.


    # Clearing Tracks


    This is the unethical part of the process where the hacker will need to delete
    the log of every activity that they performed during the process of hacking the
    system.


    # Reporting


    The last phase of the ethical hacking process is reporting. In this phase, the
    ethical hacker will need to prepare a report with all their findings and will
    also need to specify the tools and methods that were used to perform the hack.
    The report should include the vulnerabilities found in the system and also list
    the solutions the hacker wants to implement.


    It is important to remember that the phases mentioned above are not set in stone.
    As an ethical hacker, you can always change the process or use different tools.
    You need to ensure that you are comfortable with the process. As long as you achieve
    the results you are looking for, you don''t have to worry about sticking to the
    steps mentioned in this chapter.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Chapter 8


    # Developing the Ethical Hacking Plan


    As mentioned earlier, it''s important for an ethical hacker to plan his or her
    efforts before they begin their task. You don''t have to create a detailed plan
    but should provide information regarding what you''re going to do as a part of
    the exercise. You should mention why it''s important to perform the ethical hack
    and structure the process well.


    Regardless of whether you are testing a group of computers or a web application,
    you must mention your goal and define the scope of your test. You should also
    determine the standards you''ll be using to test the product. When you have written
    the plan down, you should gather different tools and familiarize yourself with
    those tools. This chapter will provide information on how you can create an environment
    that will improve the ethical hacking process to ensure that you''re successful.


    # Getting the Plan Approved


    It''s important to get the plan approved, and the first step to do so is obtaining
    sponsorship. This approval should come from an executive, a customer, a manager
    or yourself. The testing may be canceled otherwise, or someone may deny authorization
    for these tests. There are times when there can be legal consequences for any
    unauthorized hacking. You have to ensure that you know what you''re doing and
    that all your actions are viable.


    This permission can be a simple memo from the senior management if you''re running
    these tests on your systems. If you perform these tests for a customer, you should
    have a signed agreement in place with the customer''s permission and authorization.
    It''s important to obtain written approval to ensure your time and effort don''t
    go to waste.


    If you have a team of ethical hackers or are an independent consultant, you should
    purchase professional liability insurance from agents who specialize in business
    insurance coverage. This type of insurance is expensive, but it''s'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'very important to have the coverage.


    # Determining What Systems to Hack


    You probably wouldn''t want to evaluate the safety of all your systems at once.
    It could lead to more problems and is a difficult task. This isn’t to say that
    one shouldn’t eventually check every computer and application that’s present;
    rather, it’s suggested that when the time comes, one should break down their ethical
    hacking tasks into smaller tasks to ensure that it is easy to manage.


    You may decide the systems you want to test depending on the risk analysis and
    answers to questions like:


    +   * Which are your most important systems?

    * If a system is hacked, what would be the biggest loss or lead to the most trouble?

    * Which system is most vulnerable to attacks?

    * Which systems are not strongly administered?


    After the goals have been established, you can decide what systems need to be
    tested. This step helps one to carefully plan out their person’s expectation is
    established and to be certain the time and resources required for the job can
    be estimated as well.


    The list mentioned below includes applications and systems that you should consider
    executing the hacking tests on:


    +   * Firewalls

    * Routers

    * Network infrastructure as a whole

    * Wireless access points and bridges

    * Applications, Web servers and database servers

    * Workstations, laptops, and tablet PCs

    * E-mail and file/print servers'
  merge: -1
  pgno: 50
- img_proc: true
  md: '+   - Mobile devices (such as PDAs and cell phones) that have confidential
    information


    +   - Client and server operating systems


    +   - Client and server applications, such as e-mail or other in-house systems


    Selecting the systems to test depends on several factors. If the network you’re
    working on is small, everything can be tested from the get-go. It is better to
    test hosts that are open to the public such as web servers, emails and other associated
    apps. Hacking is flexible and all decisions should be made based on things that
    make the most sense business wise.


    The first places to start are the most vulnerable spots. You should consider the
    following questions:


    +   - Where on your network does your computer or application reside?


    +   - Which apps and operating system does it run?


    +   - What type of important information is saved on it?


    If the system that’s being hacked is your own or a customer’s, a previous security-risk
    assessment or vulnerability test would have generated this information. If this
    has been done, such documentation will help to point to systems needing further
    testing.


    Ethical hacking is always a few steps above the higher-level information risk
    assessments and vulnerability testing. You should get first information about
    all the systems, including the entire organization, and then assess the systems
    that appear to be the most vulnerable.


    It’s ideal to begin with systems that have the best visibility. It makes sense
    for you to focus on a file server or database that stores customer or any other
    critical or information. You can then focus on web servers, applications or firewalls
    after that.


    # Timing'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'It''s often said that it''s all about the timing. This is particularly true
    for an ethical hacker. While these tests are being performed, disruptions to any
    information systems, businesses and people must be minimal. Certain situations
    should be avoided at all costs, such as using the wrong timing for tests. Triggering
    a DoS attack in the middle of the day against a fullfledged e-commerce site or
    compelling yourself or others to perform tests to crack passwords at ungodly hours
    is a bad idea. Believe it or not, a 12-hour time difference can make a lot of
    difference! Every person involved must accept the complete timeline before you
    start. This helps everyone start together and thus set the right expectations.


    Internet Service Providers (ISP) or Application Service Providers (ASPs) that
    are involved must be notified before any tests are performed on the Internet.
    This way, ISPs and ASPs will be aware of the tests that are taking place, and
    thus will minimize the chances that they will block your traffic if a malicious
    behavior is suspected and starts showing up on their firewalls or Intrusion Detection
    Systems (IDSs).'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Chapter 9


    # Reconnaissance


    As mentioned earlier, the reconnaissance phase is where the hacker will understand
    the system and gather the information necessary to hack the system. This phase
    includes a set of processes: footprinting, scanning and enumeration. Each of these
    processes will be covered in detail in the next few chapters.


    During reconnaissance, the hacker should do his her best to gather the necessary
    information about the target network or system. For this, the hacker should follow
    the steps given below:


    +   1. Gather the initial information

    2. Determine the range of the network

    3. Identify the active machines on the network

    4. Discover the access points and open ports in the network

    5. Fingerprint the operating system

    6. Uncover any services offered by the port

    7. Map the network


    We will look at these steps in the next few chapters of the book. Let''s now go
    into detail about what active and passive reconnaissance are and the different
    tools used to perform these activities.


    # Active Reconnaissance


    As mentioned earlier, active reconnaissance is where the hacker will interact
    directly with the system or network to obtain information. The information gathered
    should be accurate and relevant to the system or network. There is, however, a
    chance that the hack will be detected if the hacker doesn''t have permission from
    the owner. The system administrator can take action against the hacker if it''s
    spotted.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Tools used


    # SQLMap


    This tool is a penetration-testing tool that is open source. A hacker can use
    this tool to detect a SQL injection attack and exploit the flaws in that attack.
    This tool comes with many niche features, including a powerful detection engine,
    which is necessary for any penetration-testing data to have. It also comes with
    different switches, including fetching data from the attacked or weak database,
    accessing different files and executing sensitive commands on the operating system
    using out-of-band connections and database fingerprinting.


    # Nessus


    Nessus was once source and free, but it''s now a product sold by Tenable. Hackers
    use it to discover all the assets available on a network, including those that
    are hard to find, like VMs, containers guest devices and mobile devices. This
    tool will provide the hacker with information about the vulnerabilities of the
    network and will help him or her determine which of the vulnerabilities should
    be fixed. This tool can be used to scan clouds or on-premise networks. Most hackers
    pitch this tool to the customers as a vulnerability scanner.


    # Passive Reconnaissance


    As previously stated, in passive reconnaissance, the hacker can gather the required
    information about a system without interacting with it directly.


