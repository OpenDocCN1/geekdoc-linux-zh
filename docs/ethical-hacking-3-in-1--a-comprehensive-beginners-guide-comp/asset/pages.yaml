    The main objective of the scanning stage is to fetch specific information on the
    target organization related to their network and information systems. Throughout
    this stage, an ethical hacker needs to focus on getting information about live
    hosts, device types (laptop, desktop, router, mobile, etc.), operating systems,
    software, public-facing services offered (SMTP, FTP, web applications, etc.).
    If possible, they should even try to find preliminary vulnerabilities. Vulnerabilities
    discovered during the scanning stage are known as low hanging fruit. There are
    several tools available for scanning, but we will focus on effective tools like
    Nmap, HPing, etc. in this chapter. The goal of the scanning stage is to have information
    that can be passed onto the next stage of the penetration testing lifecycle.


    # ## Network Traffic


    It is important to have a basic understanding of network traffic to be able to
    understand the process and tools used in the scanning stage. The electronic communication
    that takes place between various computer systems through various methods is known
    as network traffic. Wired Ethernet and Wireless Ethernet are the most popular
    methods of networking today. You will be introduced to firewalls, ports, Internet
    Protocols such as Internet Control Management Protocol (ICMP), User Datagram Protocol
    (UDP), and'
