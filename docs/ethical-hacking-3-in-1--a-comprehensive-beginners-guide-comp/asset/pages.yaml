- img_proc: true
  md: 'mechanisms for input and output), Links (which is a system that makes a file
    visible in multiple parts of a system), Sockets (which allow inter-process network),
    and Pipes which allows processes to communicate with each other.


    The file types in Linux are shown in the form of symbols including:


    +   - For a regular file

    - **d** for Directory

    - **l** for link

    - **c** for special file

    - **s** for socket

    - **p** for named pipe

    - **b** for block device


    # Directories Inside the Root Directory


    +   - **/bin** is a directory that holds common programs shared by users, systems,
    and system administrators.

    - **/boot** carries startup files and kernel, vmlinuz, and grub data in some distros.

    - **/dev** holds references to CPU peripheral hardware and is represented as files
