    # # Metasploit Payloads


    In simple terms, a payload is a simple or small script that a hacker can use to
    interact with the target system. You can transfer the data from the attacker system
    to the victim system. There are three types of Metasploit payloads:


    # ## Singles


    A single Metasploit payload is small, and it’s designed to begin some communication
    between the target and attacker system. It will then move to the next stage. For
    instance, it can be used to create a user.


    # ## Staged


    This is a payload, which is implemented by an attacker to upload large files into
    the target system.


    # ## Stages


    A stage is a payload component that is often downloaded using a stager module.
    Every stage of the payload provides some advanced features that have no limit
    in size, like the VNC injection or the Meterpreter.


    # ## Example of Payload Usage


    In this example, we’ll use the show payloads command. You can see the different
    payloads that you’re allowed to use and also look at the different payloads that
    can allow a hacker to upload or execute different files on the target network
    or system.'
