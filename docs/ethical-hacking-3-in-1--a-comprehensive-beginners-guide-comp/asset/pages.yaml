- img_proc: true
  md: '# # Chapter 5


    # ## Ethical Hacking Skills


    This chapter covers the ten most important skills every hacker needs to possess
    and consistently improve on to become a professional in the field.


    # ### Basic Computer Skills


    You are probably laughing at this skill; however, it is extremely important for
    a hacker to understand the basic functions of a computer. You''ll need to learn
    how to use command lines in windows and also understand how to edit the registry
    and set the networking parameters. These may seem like simple skills, but they''re
    actually very difficult to master. If you make an error in the command line, you
    will mess up the entire hacking process and make the system more vulnerable than
    it was initially.


    This is a skill that professional hackers build on every chance they get. They
    believe there is always room for improvement. Amateurs, on the other hand, may
    believe they have learned everything there is about computers and rarely rely
    on the knowledge they already have.


    # ### Networking Skills


    Once you have mastered your computer skills, you''ll need to improve your skills
    with networking. It''s important to know how a network functions and how to tweak
    it to make better. The skills mentioned in this section are important to know;
    DNS, NAT, subnetting, DHCP, IPv4, IPv6, and routers and switches are all things
    you need to know about. You can learn many of the skills addressed in this section
    online.


    As previously mentioned, oftentimes, amateurs are unaware of the different networking
    skills they will need to build upon. They may learn one or two of the skills mentioned
    and then fumble while hacking if they come across a different network. Therefore,
    any hacker who wants to improve should be aware of the various networking skills
    they need to have.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Linux Skills


    Hackers often use Linux as their operating system. In fact, most tools developed
    for hackers are only designed for the Linux operating system. Linux can help the
    hacker achieve his end goal, unlike Windows. So, it''s always a good idea to learn
    Linux. Any professional hacker should be adept at using Linux to hack into a system
    and identify its vulnerabilities.


    # Wireshark


    Wireshark is a packet analyzer that is an open source tool. It''s used by hackers
    to troubleshoot any network issues, analyze software and communications protocols
    and also to develop certain protocols for the system.


    Expert hackers are versed in utilizing this analyzer to create protocols with
    ease for the system they are hacking into.


    # Virtualization


    Virtualization is the art of making a virtual version of anything, like a server,
    storage device, operating system or networking resource. This helps the hacker
    test the attack that is going to take place before making it live. This also helps
    the hacker check if or she has made any mistakes and revise the attack.


    Professional hackers use this skill to enhance the effect of the hack they are
    about to perform. This gives them a perspective on the damage they can do to the
    software while protecting themselves. An amateur hacker usually does not learn
    how to cover his tracks. A perfect example for this is the boy from Mumbai who
    released an episode of Game of Thrones from season 7. Had he covered his tracks
    better, he would have been able to protect himself. This is why it''s important
    to learn about all virtualization.


    # Security Concepts


    It''s vital that a hacker learns about different security concepts and the changes
    made to technology. A person who has a strong hold on security will be able to
    control different barriers set by the security'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'administrators for the system they are hacking into.


    Learning skills like Secure Sockets Layer (SSL), Public Key Infrastructure (PKI),
    firewalls, Intrusion Detection System (IDS) and other skills are important for
    hackers to learn. If you''re an amateur, it is advised that you take courses like
    Security +.


    # Wireless Technology


    This is a technology everybody is familiar with – information is sent using invisible
    waves as the medium. If you are trying to hack into a wireless device, you have
    to understand the functioning of that device. Therefore, it''s vital that you
    learn the following encryption algorithms: WPA2, WPA WEP, WPS and the four-way
    handshake. It is also pertinent to understand the protocol connections, authentication
    and restrictions that surround wireless technology.


    # Scripting


    This is a skill that every hacker must possess, especially the professionals.
    If a hacker were to use the scripts written by another hacker, he or she would
    be discredited for that. Security administrators are always vigilant about any
    hacking attempt and will identify a new tool, which will help them cope with that
    attack.


    A professional hacker needs to build on this skill and ensure that he or she is
    good at scripting. Amateurs often depend on the scripts written by other hackers.
    They may or may not understand the script, which would land them in big trouble.


    # Database


    A database helps you store data in a structured manner on a computer that can
    be accessed in various ways. If a hacker wishes to hack into a system''s database,
    he or she would need to be adept at different databases and also understand their
    functioning. Databases often use SQL to retrieve information whenever necessary.
    Therefore, it''s important to learn these skills before you decide to hack into
    a database.'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'Professional hackers always need to know their way around a database to ensure
    that they make no mistakes and avoid getting caught.


    # Web Applications


    Web applications are software through which you can access the Internet via your
    browser (Chrome, Firefox, etc.). Over the years, web applications have also become
    a prime target for hackers. It is extremely advisable that you spend some time
    understanding the functioning of web applications, as well as the databases that
    back those applications. This will help you make websites of your own either for
    phishing or for any other use.


    The skills mentioned in this chapter are most important for hackers to develop.
