    The -n and -t5 parameters will speed up the scan. It is worth noting that OS fingerprinting
    scans are very loud and might be detected by IPS and IDS.


    # POF


    POF is short for passive OS fingerprinting. Because OS fingerprinting is a loud
    process, POF passively tries to detect the OS. Instead of directly engaging the
    target, try and identify the TCP stack. From the TCP stack type, POF can figure
    the OS in use.


