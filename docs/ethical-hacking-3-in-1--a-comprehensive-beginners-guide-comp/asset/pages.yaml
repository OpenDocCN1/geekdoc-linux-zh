  md: '# # Chapter 13


    # ## ARP Poisoning


    ARP, or Address Resolution Protocol, is often used by hackers to resolve any IP
    address that is mapped to a machine. Every device on this network will need to
    communicate with the ARP through queries to find the addresses for any other system
    on the network. This process is also called ARP spoofing.


    This is how ARP spoofing works:


    +   1. When a machine needs to pass information to another machine, it will look
    at the ARP table.

    2. If the address of the system is not found in the table, ARP_request will be
    broadcasted over the complete network.

    3. Every machine in the network will then need to compare the IP and MAC addresses.

    4. If there is a machine in the network that can identify this address, it will
    respond to the request with the MAC and IP addresses.

    5. The computer requesting this information will store the IP and MAC address
    as a pair in the ARP table; this will help the system communicate with the target
    system.


    # ### What Is ARP Spoofing?


    An ARP packet can be used to forge the data and send it back to the perpetrator’s
    machine.


    +   * ARP spoofing will construct a large number of requests. It will then reply
    to the packets to create an overload on the switch or port.

    * This switch is always set in the mode where it will forward the data. Once the
    ARP table is flooded with different responses,'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'attacker will then sniff all the packets of data in the network.


    An attacker will flood the target network or computer''s ARP cache using some
    forged entries. This method uses the man-in-the-middle approach to poison the
    network.


    # What Is MITM?


    A man-in-the-middle attack (also abbreviated as MITM, MiTM, MiM, MIM and MITMA)
    is an active attack that''s performed on a network. During the MITM attack, a
    hacker will impersonate the user and create a connection between the source and
    the victim''s system, and it will send messages between the two. In this case,
    the target networks or systems will be under the impression that they''re communicating
    with other target networks or systems. However, in reality, it''s the attacker
    that controls all the communication that takes place in the network.


    ![](img/d52d8402f5bef7b14bcbab9bcc53820f_84_0.png)


    There is another person who exists in the entire framework who will monitor and
    control the communication taking place between the parties. Systems can implement
    an SSL protocol to prevent this attack.


    # ARP Poisoning – Exercise


    In this section, we will use the BetterCAP tool to perform this attack in the
    LAN environment. This is done using the VMware workstation where the Kali Linux
    and Ettercap tools have been installed. The latter is used to sniff the traffic
    in the network.'
