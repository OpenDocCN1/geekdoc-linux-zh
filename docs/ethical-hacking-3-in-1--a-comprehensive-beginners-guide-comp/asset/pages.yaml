  md: '# # Chapter 33


    # # How to Make Money

    Through Ethical Hacking


    Now that you''ve identified different platforms through which you can perform
    ethical hacking and know what to keep an eye out for when you perform these tests,
    let''s see how you can make a living from this knowledge. The good news is that
    you can profit from ethical hacking if you are responsible.


    There are many hackers who have made a lot of money from a variety of hosts like
    PayPal, Yahoo and Google, including teenage hackers. The business is legal, and
    every responsible hacker can make enough money to sustain their livelihood if
    they want to. This is because of the unending cycle of cyber attacks that these
    websites have suffered.


    Before everything else, you should remember the concepts of black and white hackers.
    If you play by the rules, you can legally make enough money to live off of through
    hacking.


    # ## Bug Bounty Business


    Bug hunting is a business that most young hackers are a part of, and through this
    type of work, they''re making a lot of money. Hackers will snoop around massive
    websites like Facebook, Twitter, Yahoo and Google and look for bugs that can harm
    the website or leak information to hackers. Once they find the bugs, they report
    the vulnerability to the company immediately and get paid for it. You should think
    of it as someone scaling your house to see if there are any holes in the house
    (before you find out about some other way), and then paying for person letting
    you know that there are holes in your house.


    A couple years ago, Google decided to award a bug bounty hunter $2.7 million every
    year. In 2017, the company decided to run this contest all year'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'round. An unlimited prize pool has been assigned for this, meaning that the
    money will only be given to a hacker once a bug is identified. There were days
    when a bug bounty program would attract informal rewards like a free t-shirt,
    thank you note, an online shoutout or a few hundred dollars.


    It is because of startups like Bugcrow, Crowdcurrency, HackerOne and Synack that
    companies can now pay the bug bounty hunter winner a steady income. Some companies
    that pay bug hunters include:


    +   - BitGo: $100-$1,000

    - Dropbox: $216-$4,913

    - Facebook: $500+

    - FastMail: $100-$5,000

    - Pinterest: $50-$1,500

    - Magento: $100-$10,000

    - Microsoft: $500-$100,000

    - Paypal: $100-$100,000

    - Spotify: $250+

    - Stripe: $200-$1,000

    - Tumblr: $100-$5,000

    - Western Union: $100-$5,000


    There are black markets and real markets for bug bounties.


    # Government Funding


    Just like an individual company, governments are also worried about being hacked.
    Therefore, they may decide to fund hackers and ask them to keep watch and ensure
    that the systems won''t be hacked. If you say that you''re using a thief to catch
    a thief, you are probably thinking correctly. Governments around the world sometimes
    uses hackers to perform tasks or to track other hackers down. The tasks are often
    classified as national security and can include stealing military data or even
    economic or industrial espionage. (Did you hear that Russia hacked the U.S. elections?)
    That is one'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'way an ethical hacker can make money while working for the government.


    # Working on a Company Payroll


    As a white hacker, you''ll be employed by many companies to perform various tasks.
    One of the many reasons a company will employ a white hat hacker is to test the
    security of the website. The hackers will check the systems and network to see
    if there are any loopholes and identify digital fingerprints if any exist.


    There are some companies that will sometimes ask you to steal information from
    other companies. They may ask you to obtain information like reports, prototypes
    or anything else.


    # Writing Security Software


    It''s always good to understand that programmers and hackers are different people.
    A hacker can write codes that will improve the security of the company, while
    a programmer is able to design software. The scripts that white hat hackers write
    are used to protect the system and network from black hat hackers. These securities
    are specific to a company or for a certain use. White hat hackers can also decide
    to write these scripts and sell them to companies.


    # Teaching Security and Ethical Hacking


    This is not an example of making money through hacking, but is more about how
    you can pass your knowledge on to your peers. After all, what''s the point of
    being knowledgeable if you are not passing that wisdom along? As a white hacker,
    it is your responsibility to teach other hackers how ethical hacking works.'
  merge: -1
  pgno: 176
