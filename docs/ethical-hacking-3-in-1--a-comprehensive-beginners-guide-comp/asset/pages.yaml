  md: '# Chapter 2


    # Linux and Its Use in Ethical Hacking


    # Introduction


    To be a competent ethical hacker, you need to understand the basics of Linux.
    Linux is not only a powerful operating system but also supports many of the tools
    and software you need for ethical hacking. Other operating systems such as Mac
    and Windows will only support a few of the software and tools that are important
    to an ethical hacker. If you already use Linux on your computer or you are familiar
    with it, you can skip this small chapter. This chapter only looks at the basics
    of the operating system to help you install the tools you need to get with ethical
    hacking.


    The first thing you might need to know if you are a Linux newbie is the distro
    to use. There are many Linux distros, including Ubuntu, Knoppix, Fedora, and BackTrack.
    Most of the distros work the same, and you can use any distro you need to execute
    an ethical hack. However, BackTrack is more common with ethical hackers as it
    encompasses the perspective of an ethical hacker.


    Some of the Linux-based distros that you will come across include:


    +   * Redhat ideal for administrative purposes

    * Debian Linux for use in open-source software

    * Ubuntu which is great for personal computers

    * Solaris for commercial computers

    * Mac OS X is ideal for Apple computers

    * BackTrack which is ideal for an ethical hacker


    # File Structure in Linux


    One thing that makes Linux an exception operating system for hackers is its file
    system - on Linux, everything appears in the form of a file or a process. The
    only exception to the file system in Linux include Directories (which are files
    in the list of other files), Special File such as /dev (which are the'
  merge: -1
