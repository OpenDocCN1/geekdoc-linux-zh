  md: '# Chapter One


    # Overview of Hacking


    In this chapter, you will get an overview of hacking, ethical hacking, the ddifferent
    types of hackers, and the terminologies involved with hacking and the ethical
    hacking.


    # What is Hacking?


    Hacking can be defined as the art of exploring and exploiting various security
    breaches in a system or its associated network. The Internet was invented to make
    life convenient for people, but it also gave an online platform for criminals
    to expand their criminal activities. Criminals started using online channels such
    as email, online messengers, etc. to target unsuspecting common people to pick
    them into providing information about their bank accounts and credit cards. As
    technology advanced, these criminals started developing notorious computer applications
    to do their manual work, and this laid the foundation for the term hacking.


    # Who is a Hacker?


    In a simple world, you may describe a hacker as an antisocial and introverted
    teenager who is just curious about things. However, there are various ways to
    describe a hacker in the digital world. Various things motivate an individual
    hacker to hack into a system, and every hacker employs his own set of methods
    and skills to do. The common nature binding all hackers is that they are sharp-minded
    and curious to learn more about technology.


    There are two meanings for the term hacker.


    +   1. Traditionally speaking, a hacker is someone curious to learn new things
    and, therefore, likes to delve into the technology to know its workings. They
    usually like to play with computer systems and like to understand how things function
    electronically.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '2. In recent times, the term hacker has taken to a new meaning - someone who
    likes to execute malicious attacks on systems for personal benefits. Technically
    speaking, they are called crackers, which is short for criminal hackers.


    Criminal hackers break into systems for personal benefits, popularity, or even
    revenge. They break into a system to modify, delete, or steal information, making
    the lives of people miserable while doing so.


    # Difference Between a Hacker and a Cracker


    The word hacker has been used several times incorrectly when the actual term to
    be used should have been a cracker. Owing to this, it is a common misconception
    that a hacker is someone who breaks into systems to steal information. This is
    not true and damages the reputation of talented hackers all around the globe.


    A hacker is curious to learn about the functioning of a computer’s operating system
    and is usually trained in programming languages. The knowledge of programming
    helps the hacker to discover loopholes in a system and the reasons for these loopholes.
    Hackers constantly try to gain knowledge about breaches in new systems or software
    and share what they have discovered with developers. They never have the intention
    of damaging a system or stealing information.


    In contrast, a cracker or a criminal hacker is a person who breaks into systems
    to damage the system and steal information for personal benefits. Crackers gain
    unauthorized access to a system or its associated network, steal information,
    stop services of the system affecting genuine clients, and wreak havoc for the
    owner of the system. It is very easy to identify crackers because of their malicious
    actions.


    # Types of Hackers


    Hackers are classified into various categories based on their knowledge. We are
    some of the common ones:


    # Coders


    Coders are highly trained software engineers and know how to compile code'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'to hack a system. They may or not use their knowledge to hack a system. However,
    they are constantly improving their skills and knowledge and are par with the
    changing technology. They mostly create applications to identify the exploits
    in a system. They further study the exploits to come up with ways to patch the
    vulnerabilities permanently. Coders have core knowledge of the TCP/IP stacks and
    OSI Layer Model.


    # Script Kiddies


