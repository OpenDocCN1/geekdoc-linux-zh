  md: '# DNS Enumeration


    DNS, or Domain Name Server, is analogous to an address book or map. This is like
    a database that has been distributed. It can be used to translate a named website
    to an IP address and vice versa. This is a process of locating every DNS server
    and obtaining information about the corresponding record for the organization.
    The aim is to gather as much information as possible about the target before you
    initiate an attack.


    To obtain information about the host and the DNS, you can use the command ‘nslookup’
    on Linux and use the script DNSenum to obtain some detailed information about
    any domain. This script can be used to perform the operations listed below:


    +   - Get the MX record

    - Obtain the addresses of the hosts

    - Obtain the nameservers

    - Perform an axfr query on a nameserver

    - Perform a reverse lookup on net ranges

    - Obtain the names of domains and subdomains using Google scraping

    - Calculate the C-Class domain network ranges

    - Perform queries using WHOIS on the network ranges

    - Brute force subdomains from a file


    # Quick Fix


    Unfortunately, there is no quick fix for a DNS enumeration, and the only fix that
    exists beyond the scope of this book. It''s difficult to prevent DNS enumeration
    on any system. If you don''t secure your DNS, you will lose a lot of sensitive
    information about the organization or network since any unauthorized DNS zone
    transfer can take place.'
  merge: -1
