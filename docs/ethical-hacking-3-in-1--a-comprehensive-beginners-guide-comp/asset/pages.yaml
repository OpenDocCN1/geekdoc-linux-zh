  md: '# Types of XSS Attacks


    There are three types of XSS attacks, including persistent XSS, reflected XSS
    and DOM-based XSS.


    # Persistent XSS


    In a persistent XSS attack, the malicious string will be found in the database
    linked to the website.


    # Reflected XSS


    A reflected XSS attack involves the malicious string being created based on the
    victim''s request.


    # DOM-Based XSS


    In this type of attack, the vulnerability is not present at the server side of
    the code, but can be found at the client''s side of the code.


    One can identify a cross-site scripting attack using a vulnerability scanner like
    Burp Suite or Acunetix. Therefore, you don''t have to manually add a JavaScript
    on the website. If you do choose to perform a manual check, you can enter the
    following code:


    ```

    <script>

    alert(''XSS'')

    </script>

    ```


    # Quick Tip


    You must practice the following if you wish to prevent an XSS attack:


    +   - Validate and check every field present in a form, such as headers, query
    strings, cookies and hidden forms


    +   - Implement a security policy and set a limit on the number of characters
    that can be entered into a field.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Chapter 27


    # SQL Injection


    An SQL injection attack is a set of commands written in the SQL format. These
    are placed in the URL of the website and are used to retrieve the responses that
    the hacker wants to obtain from the database that’s connected to the web application.
    This type of attack often takes place on a webpage that’s developed using ASP.NET
    or PHP. This attack is most commonly done for the following reasons:


    +   - To modify the information present in a database

    - To dump the contents in the database

    - To perform queries on the database that are often not allowed by the system


    SQL injection attacks usually work since most applications don’t validate or sanitize
    the inputs before they’re passed on to an SQL query or statement. An injection
    is often found in a data field, address bar or search field. One of the easiest
    ways to verify if there is an SQL injection attack is to use the ‘ ’ character
    in any string and check if there are any errors.


    Let’s now delve further into the concept of SQL injection using a few examples.


