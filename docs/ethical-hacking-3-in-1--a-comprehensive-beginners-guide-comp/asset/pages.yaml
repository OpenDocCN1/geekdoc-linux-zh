  md: '# Chapter 31


    # How to Script Using Perl


    If you want to become a better hacker, you should develop the skills to script.
    It''s always convenient to use another hacker''s tools, but you should always
    make sure to focus on developing your own tools. You can only do this if you expand
    your scripting skills.


    # History


    Perl is one of the most widely used languages in the Linux environment. This is
    not an acronym, though there are some who believe that it stands for “Practical
    Extraction and Report Language”. This language was developed in 1987 by a linguist
    Larry Wall, who was interested in designing a language that could pull text from
    multiple sources to generate a report. This is something we take for granted now,
    but it was anything but simple in a heterogeneous enterprise in the late 80s.


    # Why Is Perl Important in Linux?


    Nearly everything in Linux is either a simple file or a collection of simple files.
    For this reason Perl is useful in the Linux environment. In addition to this,
    Perl gives the user the capability to utilize some shell scripting commands in
    a script. This makes the language useful to develop hacking tools that are used
    for scripting. If you need to develop a tool to manipulate text or use shell commands,
    it''s advised that you use Perl.


    Perl is also the source of some useful regex or regular expressions that can be
    employed in hacking tools, security tools and Linux applications. These expressions
    give you the power to identify text patterns in a variety of applications like
    MySQL and Snort. They were first developed in Perl and, in some cases, are called
    PCRE or Perl Compatible Regular Expressions.


    # Perl on Your System'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'Since Perl is used in Linux, every distribution of Linux comes installed with
    a Perl interpreter, Kali is no exception. If you use Windows, you can download
    Perl at the following location: http://www.activestate.com/activeperl/downloads/


    This language has been used to develop many hacking tools, including adminfinder,
    fierce, snmpenum, onesixighty, nikto and many others. This is a language that
    users favor for its ability to send SQL queries from one web application to a
    backend database. If you want to look for every Perl script in Kali, you can execute
    the following code:


    ```

    kali > locate *.pl

    ```


    You''ll most likely notice that there are thousands of scripts that have been
    written for various purposes in Kali. This demonstrates the importance of Perl
    scripts in Linux administration and hacking.


    # Creating a Script


    # Step 1


    You can develop a Perl script on every platform if you have the Perl interpreter
    installed in the system. You should also include emacs, vim, gedit, kate, etc.
    In the examples in this book, we will be using a Leafpad, which is a text editor.
    Leafpad is built into Kali to develop simple Perl scripts. When you become more
    advanced, you''ll need to use an IDE that will make the development of scripts
    and debugging more productive.


    First, open Leafpad by following this path: Application -> Accessories -> Leafpad.
    Next, type the following in Leafpad:


    ```

    #! /usr/bin/perl


    print "Hello User!\n";

    ```


    The first line of the code will tell the system which interpreter it needs to
    run the code that you write. The first segment of the code is called the “shebang”.
    In the example in this chapter, you''ll want the Perl interpreter to translate
    the code. This is precisely why the “shebang” is followed by “/usr/bin/perl”.'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'The second line of the code is a print statement where you want to type “Hello
    User!" on the screen. The code ends with "\n", terminating the line. Save this
    file using the name “firstperlscript".


    # Step 2


    Now, you should set the permissions. Let’s first navigate to the directory in
    which you saved the file and type “ls -”.


    You’ll notice that the script has been saved using the default permission 644.
    If you want to execute the script, you’ll first need to change the permission,
    which will allow you to do so. The permission should be changed to 755 using the
    following syntax:


    ```

    chmod 755 firstperl

    ```


    # Step 3


    It’s time to execute the scripts now that you have changed the permission. You
    can run the script by typing the following line of code: ./firstperlscript’”


    The output will be “Hello User!" just as you intended.


    # Step 4


    There are many special characters in Perl that you can use. In the above script,
    you’ve used "\n" which tells the interpreter that the character should move to
    the next line. There are numerous operators available in Perl; below is a sample
    list of the special characters in Perl:


    +   - \0xx - the ASCII character whose octal value is xx

    - \a - an alarm character

    - \e - an ESCAPE character

    - \n - a NEWLINE character

    - \r - a RETURN character

    - \t - a TAB character


    # Step 5


    Once you have executed the script, you can include some complexity and'
  merge: -1
