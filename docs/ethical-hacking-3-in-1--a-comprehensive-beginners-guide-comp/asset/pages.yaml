  md: '# # Chapter 24


    # # Social Engineering


    Let''s look at a couple examples of social engineering attacks to better understand
    the concept.


    # Example One


    A hacker or social engineer can pretend to be a valid user or an employee using
    a fake identification card. These attackers can access a restricted area, which
    can lead to further attacks.


    # Example Two


    There is another type of hacking called shoulder surfing where the hacker will
    be around you and will peek into your system when you are typing some sensitive
    information like your account PIN, password, user ID, etc.


    # Phishing Attack


    Phishing attacks are social engineering attacks that are computer-based. During
    this particular attack, the hacker uses an email to hack the target system or
    network. The emails sent by the hacker will appear to be completely legitimate,
    but they''ll lead the user to a proxy (a fake website). If you are not careful
    and type your user ID and password on the proxy site, the hacker will store that
    information and hack your account.


