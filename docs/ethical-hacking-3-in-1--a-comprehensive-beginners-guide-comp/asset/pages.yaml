  md: '# Chapter 25


    # Distributed Denial-of-Service Attack


    A distributed denial-of-service, or DDoS, attack is performed by overloading a
    network or server with large volumes of traffic from different users and sources.
    Unlike a DoS, or denial-of-service, attack where only one Internet connection
    and one computer is used, different Internet connections and different computers
    are employed during a DDoS attack.


    # Types of Attacks


    A DDoS attack can be placed in one of two categories:


    +   - Volume-based attacks

    - Application layer attacks


    # Volume-Based Attacks


    A volume-based DDoS attack includes ICMP floods, UDP Floods, spoofed packet floods
    and TCP floods. These attacks are commonly known as Layer 3 and 4 attacks. The
    magnitude of an attack is measured in bits per second (bps).


    # UDP Flood


    A UDP flood attack is often used to flood any random port on a remote host server.
    This attack is performed by sending UDP packets to the server, especially to the
    port number 53. You can use a specialized firewall to block or filter any malicious
    UDP packets of data.


    # ICMP Flood


    This type of attack is similar to the UDP flood and is often used to attack a
    remote host by sending several ICMP echo requests. In this type of attack, both
    the incoming and outgoing bandwidth is used, and a large number of ping requests
    will slow the system down.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# HTTP Flood


    In an HTTP flood attack, the hacker will send an HTTP POST and HTTP GET request
    to the target system or network in large volumes. The server cannot handle these
    volumes, and this will lead to a denial of any additional connections from a legitimate
    client.


    # Amplification Attack


    In an amplification attack, a hacker will request the server, website or network
    to generate a large response and include a DNS request for PDFs, HTTP GET requests
    for images, TXT records and other data files.


    # Application Layer Attacks


    There are many types of application layer attacks, including DDoS attacks targeting
    Apache, Windows, zero-day DDoS attacks, Slowloris, and others. The goal of the
    hacker is to crash the web server. The magnitude of the attack is measured in
    requests per second.


    # Slowloris


    The attacker will send numerous HTTP headers to the target network or server,
    but no request is ever complete. The target server will need to keep all these
    connections open, which will lead to an overflow in the connection pool. This
    will ensure that the server does not accept any additional connections.


    # Application Attack


    An application attack (also known as a Layer 7 attack) is where the hacker will
    overload any application through search requests, excessively logging in or a
    large amount of database lookups. It''s hard to identify this attack since it
    resembles legitimate traffic.


    # NTP Amplification


    In this type of attack, the hacker will exploit the NTP as it''s accessible to
    the public. The hacker will perform actions that aim to overwhelm the target server.


    # Zero-Day DDoS Attacks'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'A zero-day vulnerability is a flaw in either the application or the system
    that was unknown to the user, and this vulnerability has not yet been patched
    or fixed. There are many types of attacks that are currently being identified
    that explore different vulnerabilities in the system.


    # How to Overcome a DDoS Attack


    There are numerous DDoS protection tools that one can use depending on the type
    of attack. You can prevent a DDoS by identifying the vulnerabilities in an operating
    system and closing them. You must also ensure that you every port connected to
    your system, thereby removing the probability of unwanted access to the system.
    You can also hide the system behind a VPN or proxy server.


    If the DDoS attack is low, you can use a firewall to filter out all the traffic
    that was sent to the network for the purpose of DDoS. If the magnitude of the
    attack is high, you should use a DDoS protection service provider. This tool will
    offer a proactive, genuine and holistic approach. You should always be careful
    when you select a DDoS protection service provider since there are quite a few
    who only want to take advantage of your situation. These providers will offer
    you numerous services at high costs if you let them know your system was a victim
    of a DDoS attack.


    You should look for a DDoS protection service provider that can be used to configure
    the CNAME and A records for the website. You should also look for a CDN provider
    that can monitor and analyze the DDoS traffic and will protect your system from
    an attack.


    Let’s assume that the IP address is AAA.BBB.CCC.DDD. You should configure the
    address in the following way:


    +   Create an “A Record” using a DNS identifier, and ensure that you keep it secret.


    +   Next, use the CDN provider to assign a URL to the DNS identifier.


    +   Lastly, use the CDN URL to create a CNAME record.


    You can ask your system administrator to help you with this task and verify'
  merge: -1
