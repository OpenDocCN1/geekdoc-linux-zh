  md: '# Chapter 4


    # Ethical Hacking Tools


    Now that you know what ethical hacking is, let''s look at some of the different
    tools that are available for you to use to prevent any unauthorized access to
    the network system or computer.


    # Nmap


    Nmap, or Network Mapper, is a tool that is used for security auditing and network
    discovery. It is an open source tool that was designed to scan a large network.
    It also works well with single hosts. A network administrator is used for different
    tasks, including managing service upgrade schedules and network inventory and
    monitoring or host uptime.


    Nmap can determine the following using raw IP packets:


    +   * The different hosts available on the network

    * The operating systems that the hosts run on

    * The different services offered by those hosts

    * The different firewalls that the hosts use and any other characteristics


    This tool can run on most operating systems, including Linux, Windows and Mac
    OS X.


    # Metasploit


    Metasploit, another powerful exploitation tool, is a Rapid7 product. Many of the
    resources used can be found on the source website: www.metasploit.com. The tool
    has a commercial and free version and can be used with Web UI or command prompt.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'You can perform the following operations using Metasploit:


    +   * Penetration tests on small networks

    * Check the vulnerability in some systems

    * Discover any import or network scan data

    * Run individual tests on a host or look at the different modules that one can
    exploit


    # Burp Suite


    Burp Suite is a tool that''s used by both malicious and ethical hackers to perform
    a security test of any web application. This suite has different tools that work
    together to support the process of testing, right from the mapping to the analysis
    of the application''s surface. It''s often used to exploit or locate any vulnerabilities
    in the application. This suite is simple to use and gives an administrator full
    control to combine different techniques to improve testing. Burp can be configured
    easily, and it has different features that can help an experienced tester with
    their work.


    # Angry IP Scanner


    Angry IP scanner is a cross-platform and lightweight port and IP address scanner.
    This tool can scan an IP address in any range and can be used or copied anywhere.
    It utilizes a multithreading approach to increase the speed of scanning. In this
    approach, a separate scanning thread is employed for every address. Angry IP scanner
    checks if an IP address is active by pinging the address, and it will determine
    the MAC address and scan ports and resolve the hostname. The data that is gathered
    using this tool can be saved to an XML, TXT, IP-Port List or CSV file. You can
    gather information about any IP using this tool.


    # Cain and Abel


    Cain and Abel is a tool used in Microsoft Operating Systems for password recovery.
    This tool helps to retrieve passwords using one of the following methods:'
