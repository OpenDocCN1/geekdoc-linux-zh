    # Installing Backtrack on Virtual Box


    Virtual Box not only occupies less space on your computer but also lets you switch
    between operating systems with great ease. If you need BackTrack to run alongside
    Windows OS or Linux Redhat, VM Virtual Box will make that possible. For starters,
    download VM Virtual Box and install it on your computer — the tool is available
