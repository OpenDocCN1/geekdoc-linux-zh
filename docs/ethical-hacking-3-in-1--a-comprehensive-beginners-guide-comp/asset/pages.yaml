    # Linux Password Storage


    Passwords in Linux/Unix are held in the /etc/passwd file or can also be in /etc/shadow
    file. Modern Unix-based systems only store passwords in the /etc/shadow file,
    but you might find some older versions that still store passwords in the /etc/passwd
    file. In password storage, a hash follows the username depending on the version
    of Linux you are running on your computer. In most Linux versions, MD5 is the
