  md: '# Chapter 18


    # Trojan Attacks


    A trojan is a virus that does not replicate. This means that it does not reproduce
    itself by attaching to other files or executable programs. A trojan often operates
    silently without the knowledge of the owner and will hide itself in a healthy
    process. It is important to remember that this virus can only affect a machine
    if the user has opened a file, downloaded an attachment, clicked on a link that
    was sent by an unknown user or plugged in a USB without scanning the device. A
    Trojan can perform many malicious attacks, some of which are described below:


    +   - They can create a backdoor or a trap door to the target network or system;
    malicious or ethical hackers can use these doors to access the files or the operating
    system.


    +   - A Trojan can steal sensitive data such as financial information, including
    transaction details, account details, payment related information, etc. This type
    of virus is called a Trojan Banker.


    +   - These viruses can be used to attack the target system using a denial-of-service
    attack.


    +   - They can encrypt every file in the target system, and the hacker can demand
    to decrypt the files in the system for money. This is called Ransomware Trojan.


    +   - A Trojan can be used to send an SMS from your mobile phone to any third
    party; this is called an SMS Trojan.


    # Trojan Information


    If there is a virus on your system, and you want to learn more about the function
    of that virus, you can review the following databases; they will provide all necessary
    information:'
  merge: -1
  pgno: 108
- img_proc: true
