    +   - Normal format

    - Greppable format

    - XML format


    The normal format allows Nmap results to be output in a text file. For instance,
    after the SYN scan below, the results will show in a text file called jay.txt


    ```

    Nmap -sS -PN <targetIP> -oN jay.txt

    ```


    The greppable format is based on Unix-based systems - Unix-based systems have
    the "grep" command, which searches specific results in hosts and ports.'
