    ```


    If the IP address set is small, you can define a smaller range as a target for
    the scan. For example, if you want to scan the first 50 IP addresses in a range,
    you can use the command as follows.


    ```

    nmap 10.0.2.1 -50

    ```


    # Scan List


    You can also provide a text file as an input to your Nmap scan command. The text
    file will include a list of IP addresses that are target systems. If you assume
    that the following IP addresses are stored as a list in a target.txt file,


    +   - 10.0.2.1

    - 10.0.2.15

    - 10.0.2.55

    - 10.0.2.100


    The Nmap command syntax will look as shown below.


    ```

    nmap -iL target.txt

    ```


    # Port Selection'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'The -p switch can be used in the Nmap command structure to specify the ports
    to be scanned. You can use a dash to specify a range of ports or individual ports
    can be specified as comma-separated values.


    ```

    nmap -sS -p 1-100

    nmap -sU -p 53, 25, 143, 80

    ```


    Or you can use both in combination as follows.


    ```

    nmap -sS -p 1-100, 53, 25, 143, 80

    ```


    # Output Options


    By default, the scan results of the Nmap command will be printed on the screen
    that is the terminal window. However, it is not always convenient to have the
    output printed on the screen, and as an ethical hacker, you may want it to be
    saved to a file. You can use the pipe | command to redirect the output from a
    scan to a file. However, there are built-in options in the Nmap scan to redirect
    the output and save it to a file. Let us go through these options one by.


    # -oN Normal Output


    This output will create a normal text file where the output is stored. This text
    file can be used for output evaluation or can be used as an input to other programs.


    ```

    nmap -oN output.txt 10.0.2.111

    ```


    # -oX Extensible Markup Language (XML) Output


    Many applications use an XML file as an input, and therefore this option is very
    useful to store the output in an XML format.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '```

    nmap -oX output.txt 10.0.2.111

    ```


    # -oS Script Kiddie Output


    Script Kiddie output files are not used in serious penetration testing but can
    be fun to use. The output file generated from this syntax should not be used for
    industrial penetration testing.


    ```

    nmap -oS output.txt 10.0.2.111

    ```


    # Nmap Scripting Engine


    Building custom scripts for Nmap is beyond the scope of this book, but you can
    always use preconfigured Nmap scripts to run penetration tests. You can locate
    a set of preconfigured Nmap scripts on the following URL.


    ```

    https://nmap.org/nsedoc/

    ```


    For example, you can use the script to fetch the NetBIOS and the MAC address information
    of a target system. You can use the --script flag with the Nmap command followed
    by the script name to use it as follows.


    ```

    nmap --script nstat.nse 10.0.2.111

    ```


    As an ethical hacker, you would also want your script database to be updated at
    all times. It is advisable to update the Nmap script database before every new
    penetration testing assignment. You can use the following command to do so.


    ```

    nmap --script -updateddb

    ```'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Chapter Six


    # Exploitation


    In this chapter, we will learn about the third stage of the penetration testing
    lifecycle known as exploitation. We aim to make you understand the fundamental
    difference between attack types and attack vectors. You will learn about some
    Kali Linux tools that can be used for exploitation. You will learn about a very
    important exploitation tool called Metasploit as well.


    The National Institute of Science and Technology (NIST), Special Publication 80030,
    Appendix, B, page B-13 defines vulnerability as a weakness in an information system,
    system security, internal processes, or implementations that can be exploited
    by an attacker. This definition defines a broad scope of exploitation and demands
    a deeper explanation. Errors lead to vulnerability. Eros can be found in multiple
    places in an information system, or it can be a human error committed by people
    who use or administer the information system daily.


    # Vulnerabilities Scan


    +   * Exist inside or outside of an information system.

    * Be a part of some poor lines of software code.

    * Be generated through incorrect configuration.

    * Be completely outside the technical infrastructure created via social channels.


    Vulnerability is synonymous with the word weakness. The whole act of exploitation
    is simply taking advantage of the weakness in an information system to gain access
    to and render it useless to genuine users via a denial of service. The only limitation
    an attacker will have while exploiting the system is their power to continuously
    carry an attack against the security systems protecting the information system.
    The best tool for an ethical hacker or a penetration tester to use for the exploitation
    stage is their brain. When you see that one attack surface is closed, move to
    the next one. Exploitation'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'can be one of the toughest tasks for an ethical hacker to learn. It takes knowledge,
    experience, and a great amount of persistence to learn all the attack types that
    can be used on a single target.


    # Attack Vectors and Attack Types


    There is a small line between attack vectors and attack types that is often misunderstood
    and misinterpreted by everyone. The two terms can be often perceived as synonymous
    with each other, but proper clarification and differentiation will help to understand
    how exploits can be classified into the two categories. Generally speaking, a
    vector is a channel of transmissions such as a tick, a mosquito, or any other
    pathogen, but the delivery method for all these is same: a single bite. Every
    pathogen has similar instinctive instructions to carry out the bite, but there
    will be a difference for each. ethical hacking and information systems, an attack
    vector is a category for classifying groups of attack types within every category
    of an attack vector.


    | Attack Vector | Attack Types |

    | --- | --- |

    | Code Injection | Viruses

    > Buffer Underrun

    > Buffer Overflow

    > Malware |

    | Web-Based | Cross-Site Scripting (XSS)

    > Cross-Site Request Forgery (CSRF)

    > Defacement

    > SQL Injection |

    | Network-Based | Denial of Service (DoS)

    > Distributed Denial of Service (DDoS)

    > Theft of passwords and sensitive data

    > Theft or counterfeit of credentials |

    | Social Engineering | Phishing

    > Impersonation

    > Spear Phishing |'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Intelligence Gathering


    When you understand not only the type of attack but the means through which that
    attack can be carried out, you will understand exploitation properly.


    # Local Exploits


    An exploit that requires you to have local access to the computer system, server,
    mobile phone, etc. is called a local exploit. Local access to a system can also
    be established through a remote session. In other words, if the ethical hacker
    is personally sitting near the target system or is logged into via SSH, a Remote
    Desktop Protocol (RDP) session, or a Virtual Private Network (VPN), the exploit
    can be called local. A local exploit can increase your privilege on the target
    system, disrupt service, upload malicious files, or steal information from the
    system. Do note that a local exploit cannot be implemented from a network unless
    you have established a session over the network like the ones we mentioned earlier.
    If you try to implement a local exploit on a system without executing the code
    on the local system that is vulnerable will cause the code to fail. This may set
    off a few alarms in the security systems of the target system, and when an alert
    sets off, it is considered a waste of time and effort for an ethical hacker.


    There is a misunderstanding amongst the masses about how to leverage local exploits.
    It is not necessary that a local exploit has to be executed by the ethical hacker.
    An ethical hacker can employ social engineering and other deceptive methods to
    trick the locally logged in user to execute the exploit on their behalf. A common
    example of this is a Trojan backdoor embedded in a regular PDF document file or
    a Microsoft Excel spreadsheet. A USB drive driven on an employee’s name that is
    plugged into the corporate system can also be used to carry out a local exploit.
    The possibilities of a local exploit are only limited by the imagination of an
    ethical hacker or a penetration tester. Local exploits are mostly deployed when
    remote exploits fail due to an unavailability of a network connection to the target
    system.


    # Searching for Local Exploits


    There are more than a thousand ways to exploit a system locally, and choosing
    the most efficient one can seem a little difficult in the beginning.'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'The Metasploit tool by Rapid7 has made this simple by developing an application
    called Searchploit. Kali Linux makes using this application even simpler. You
    can use searchploit in the Kali Linux terminal to look for exploits in a system.


    The steps are as follows:


    +   - Launch a terminal window.

    - Type the searchploit command, followed by up to three keywords.

    - The search returns the vulnerability with a dynamic link library in a Windows
    system running the IIS web server and using the PHP 5.2.0 version. You can exploit
    this vulnerability to execute a buffer overflow causing a denial of service on
    the host system.


    # Remote Exploits


    An exploit that targets a computer system, server, mobile phone, etc. from outside
    the base operating system of the respective device is called a local exploit.
    It is also known as a network exploit since it is always carried out over a network.
    In simple words, when an exploit is not local, it is always a remote exploit.
    Remote exploits are used to target computer systems, servers, or network devices
    and also web applications, web services, databases, mobile phones, printers, and
    any other device that can connect to a network. The number of devices that can
    be targeted using a remote exploit is increasing with the advancement in technology.
    For instance, gaming consoles such as the Microsoft Xbox, The Sony Playstation,
    smart TVs, music systems, and the list just goes on.


    Another example is the use of computer systems in the latest cars. If there is
    a computer system in a car that connects to a public network, some attacker in
    the world is already trying to hack it, mostly to create some nuisance. We will
    have a detailed example of remote exploits further in this chapter when we learn
    about the Metasploit tool.


    # Metasploit Overview


    Metasploit is one of the most powerful tools in the toolkit of an ethical hacker.
    It has harnessed power from multiple years of trials by ethical hackers, penetration
    testers, governments, and researchers from all over'
  merge: -1
  pgno: 365
- img_proc: true
  md: 'world. From the Black Hat side of the spectrum to the White Hat side of it
    and everything in between, every hacker has at one point laid their hands on the
    Metasploit framework. The Metasploit tool was developed by a company Rapid7. The
    company spared no expense when they developed this cool, which makes Metasploit
    capable of executing all the stages required for a successful penetration testing
    activity. Over and above the attack stages, Metasploit also have report templates
    and compliance checks to meet government requirements. You will be amazed while
    using Metasploit if this is your first time.


    # Versions of Metasploit


    There are currently two versions available for Metasploit. The first version is
    called the express framework that is installed by default and is free to use.
    This version is mostly focused on catering to the needs of students, researchers,
    and private users. The second version is called the professional version that
    meets the needs of those in the professional and commercial sectors, and government
    sectors. The professional version offers additional features such as group collaboration,
    reporting, compliance checks, and other tools for advanced control. There is a
    cost associated with the professional version, and therefore, if you use Metasploit
    for personal use, there is no need to purchase the professional version. Both
    the express version and the professional version contain the same exploit modules.


    # Nexpose and Compliance


    Security auditors know the requirements of compliance in and out. Nexpose facilitates
    auditors to simplify the risk management associated with the security of a company.
    Nexpose has more features than just scanning for vulnerabilities in Metasploit.
    Nexpose classifies them for analysis of the impact they may have and converts
    them into a neat report. In addition to vulnerability scanning, Nexpose also ensures
    regulatory compliance such as Payment Card Industry Data Security Standard (PCI
    DSS), the North American Electrical Reliability Corporation Standards (NERC),
    the Health Insurance Portability and Accountability Act (HIPPA), the United States
    Government Configuration Baseline (USGCB), the Federal Information Security Management
    Act of 2002 (FISMA), the Security Content Automation Protocol (SCAP), the Federal
    Desktop Core Configuration (FDCC), and many more.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# The Basic Metasploit Framework


    Metasploit works on modules. You will be able to picture the framework better
    if you visualize it to be a vehicle. Consider the framework to be the chassis
    of an Aston Martin owned by James Bond. The chassis provides a container for all
    the other modules that are used by the car. The nooks and corners around the engine
    are stocked with an arsenal of tools. Even if one of the modules in the car malfunctions,
    the car will still function with the available tools unleashing the attacks.


    There are five types of modules in Metasploit.


    +   1. Exploit Modules

    2. Auxiliary Modules

    3. Payloads

    4. Listeners

    5. Shellcode


    # Exploit Modules


    Predefined packages of code in a database that can be used to find a vulnerability
    in a target system, be it local or remote, to compromise the system are known
    as exploit modules. Exploit modules can facilitate denial of service (DoS) access
    to sensitive information, or uploads of payload modules that can be used for further
    exploitation.


    # Auxiliary Modules


    Auxiliary modules do not require a payload to function, as in the case of exploit
    modules. Auxiliary modules instead have programs such as fuzzers, scanners, and
    SQL injection tools. Auxiliary modules also have some very powerful tools that
    need to be used with extreme caution. Ethical hackers can use the vast set of
    scanners available in auxiliary modules to understand the vulnerabilities in a
    target system and then smoothly transition to exploit modules.


    # Payloads'
  merge: -1
  pgno: 367
- img_proc: true
  md: 'If you refer to James Bond''s Aston Martin as the complete Metasploit framework,
    the exploit modules and the auxiliary modules would be its rocket launchers. In
    this sense, payloads would refer to communication equipment that can be planted
    on a target to maintain tracking and communication. When you are executing an
    exploit on a vulnerable machine, a payload is sent as an attachment to the exploit.
    The payload has instructions to be carried out by the exploited system. There
    are different types of payloads. Some of them will be a few lines of code, while
    others may be fullyfledged applications like the Meterpreter Shell. There are
    over 200 different types of payloads built into the Metasploit framework.


    # Listeners


    Even Bond had to take orders from agent M. Listeners are handlers available in
    the Metasploit framework. When a payload is planted on a target system, it creates
    a session, and listeners are used for interacting with these sessions. A listener
    is a dormant bind shell that waits for an incoming connection, or it can actively
    listen for incoming connections from the session on the target system. It would
    not be possible to have two-way communication between the ethical hacker''s system
    and the target system without a listener. Fortunately, the Metasploit framework
    deals with setting up the listener and requires little human interaction.


    # Shellcode


    Shellcode is not exactly an independent module by itself. It is embedded as a
    submodule within the payloads of the Metasploit framework. The explosive material
    present in the missile from the Aston Martin, a shellcode is the explosive inside
    of a payload module. The shellcode is the explosive that creates a hole, uploads
    malicious code, and executes the commands through a payload to generate a session
    or a shell on the target system. All payloads do not need to contain a shellcode.
    For example, the “windows/adduser” payload will create just users on the target
    system.


    # Accessing Metasploit


    There are several ways to access the Metasploit application. Until you have understood
    Metasploit deeply, we recommend using the graphical user interface method. You
    can access the GUI by selecting Metasploit Community/Pro from the Kali Linux desktop
    as follows.'
  merge: -1
  pgno: 368
- img_proc: true
  md: 'Applications > Kali > Exploitation > Metasploit > Metasploit Community/Pro


    Alternatively, it can also be accessed via the web browser on port 3720 by navigating
    to the following URL.


    ```

    https://local-host: 3790/

    ```


    Note: Since Metasploit works on the localhost, there is no valid certificate installed
    for Metasploit. The browser may prompt you with the “Connection Insecure” message.
    You can click on “I Understand the Risks” and continue with “Add Exception.” If
    prompted, click on the “Confirm Security Exception” button.


    The first launch of Metasploit will prompt you to set up a username and password.
    There will be some other optional parameters too. The optional parameters are
    used for reporting. After you have provided all the input parameters, click on
    “Create Account” to continue.


    # Startup/Shutdown


    As an ethical hacker, you may need to restart Metasploit at times. Metasploit
    is a resource-intensive application, and there are several applications on your
    Kali Linux system that may need the network service, causing Metasploit to freeze
    at times. If you encounter network errors, you can always restart Metasploit.


    Begin with checking the current status of Metasploit. You can run the following
    commands from the Kali Linux terminal for the same.


    +   To check the status of the service


    +   Service metasploit status


    +   To restart the service


    +   Service metasploit restart'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# To stop the service


    Service metasploit stop


    # Updating the Metasploit Database


    Rapid7 develops Metasploit, but several inputs to it come daily from community
    users. There, it is advisable to update the Metasploit database before every use.
    Simply type the following command on the Kali Linux terminal.


    ```

    msfupdate

    ```


    You just need to sit and wait after typing the command and hitting enter. If you
    are already in the graphical user interface of Metasploit, you can click on Software
    Updates from the top right-hand corner of the web page and then click on Check
    for updates on the next page.


    Metasploit will instantly download and install the updates. We recommend that
    you restart the Metasploit service after every update for the changes to come
    into effect. For the Metasploit web interface, simply close the browser and open
    the Metasploit interface again.


    # Using Metasploit


    Now that the Aston Martin is locked and loaded, its is time to get on the field
    and begins scanning. When you log in to the web interface of Metasploit using
    the username and password you created, you will be presented with the login page.
    The page has a summary of current projects, target folders, possible vulnerabilities
    discovered, etc. As a first time, you will only see a default project. The projects
    will start piling up on the landing page as when you take up more projects using
    the New Project button. New users are recommended to use the default project to
    get started. This will help you transition smoothly to other tools required during
    the exploitation.


    To begin scanning, click on the Scan button in the Discovery section of the default
    project page. You will also see a Target Settings section, which allows you to
    provide inputs for hosts or a group of hosts just like in Nmap.'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'However, you should know about certain important and useful fields available
    in the Advanced Target Settings, which can be found when click on the Show Advanced
    Options button at the center of the page.


    # Excluded Targets


    Any IP specified by you in this field will be excluded from the scan. You do not
    want scan machines that are not a target and waste time on it. You can input the
    IP address of your attack system and any other team member''s IP address in this
    field. Furthermore, the rules of engagement may have defined certain machines
    that have sensitive information and should not be scanned at all. You can enter
    those IP''s here as well.


    # Perform Initial Portscan


    When you scan a target system for the first time, check this box. When you repeat
    a scan on any target system, you can uncheck it, so you don''t waste time.


    # Custom Nmap Arguments


    An ethical hacker can use this option when custom modules need to be run. Individual
    switches for the scan can be defined here.


    # Additional TCP Ports


    The default Metasploit scan will target the most common ports. If an ethical hacker
    has information from the reconnaissance stage about a unique port, it can be added
    here to be included in the scan.


    # Exclude TCP Ports


    The rules of engagement may define certain ports that should be excluded from
    the scan. These can be defined here.


    # Custom TCP Port Port Range


    If you have an ethical hacking team with several members, you may split the port
    assignments amongst yourselves and define a range per person setting up the scan
    parameters.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Custom TCP Source Port


    Sometimes you may want to disguise the source port of your system to show some
    other port. This is useful to bypass access control lists set up on firewalls.


    After you begin the scan, it may take some time to complete based on your system
    and state of the network. Metasploit is very efficient, but it has a huge number
    of processes running in the background.


    After the scan completes, click on the Overview tab at the top of the Metasploit
    webpage. Our example gave us the result as follows. The discovery section shows
    that one host was scanned, which had over 30 services, and one vulnerability was
    discovered. A good result considering this was just a default scan. If custom
    parameters would be included, more vulnerability may be found. Given this was
    the first scan, we did not even do a compliance check using Nexpose.


    If you click on the Analysis tab, you will get a list of all scanned hosts. If
    you click on the host''s IP, you will get more information.


    There are six important sections to this host information section that provides
    you with the following information.


    # Services


    The information available in the services section will tell you about the software
    and their versions on the target system. Some services may have hyperlinks as
    there was more information retrieved about them during the scan.


    # Vulnerabilities


    All the vulnerabilities discovered in the target system will be listed here. The
    vulnerabilities listed here will already have a Metasploit exploit module linked
    to them for direct exploitation.


    # File Shares


    If there are file shares advertised on the target system, they will get listed
    here. However, file shares on Linux systems are not advertised as openly as'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'they are advertised on a Windows system.


    # Notes


    Security settings, service accounts, shares, and exports discovered during scanning
    are listed here.


    # Credentials


    If the scan captured any credentials, they would be listed here.


    # Modules


    The modules section is not only related to exploiting modules, but it directly
    lets you launch an exploit related to a vulnerability that has been discovered.
    If you click on the hyperlink, an exploit will be launched automatically, and
    it will try to establish a session with the target system.


    Click on the Launch hyperlink, which is right next to module. Our scan returned
    “Exploit: Java RMI Server Insecure Default Configuration Java Code Execution”
    vulnerability. You will be presented with a page that describes the nature of
    the vulnerability and will fill up all other information needed to exploit the
    discovered vulnerability. By default, a generic payload, along with the Meterpreter
    shellcode, will be used by Metasploit. After you have reviewed the settings, click
    on the Run Module.


    If the exploit is successful, you should see a message as “Success! 1 session
    has been created on the host.”


    This indicates that you successfully exploited the target system’s vulnerability,
    and it has now been compromised. When the target system was exploited, a Meterpreter
    shell was planted on it, and you will now see #1 in the Sessions Tab, which can
    be used to interact with the target system. Click on Session to view all active
    sessions.


    The Sessions web page will display all the available sessions along with its associated
    shells that are available for interaction with the target system. There is a small
    description that lists the account that is available to access the target system.
    Click on the Session 1 hyperlink, which will launch a webbased interaction with
    the Meterpreter shell on the target system.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Meterpreter Shell - Session Management


    After the Meterpreter shell has been planted on the target system, an ethical
    hacker can access a shell via session management in Meterpreter. However, many
    advanced functions can be driven through mere button clicks, and they also help
    to speed up the management of exploitation.


    As an ethical hacker, you need to find perfect balance between time and execution.
    If you execute the wrong steps, security alarms may go off in the target system.
    And if you do not execute the required action, session time will be wasted.


    An ethical hacker sees all available actions to be executed on the target system
    as well as session history and tabs for modules to be used after exploitation.
    Any action you execute through this session gets logged for future references.
    You can also export these logs for reporting in the last stage of penetration
    testing lifecycle.


    Session 1 on 192.168.56.101

    | Session Type | meterpreter (payload/java/meterpreter/reverse_tcp) |

    | Information | root @ metasploable |

    | Attack Mode | exploits/multi/msf/java_msx_server |


    Available Actions

    | Collect System Data | Collect system evidence and sensitive data (screenshots,
    passwords, system system) |n| Access Filesystem | Browse the remote filesystem
    and upload, download, and delete files |

    | Command Shell | Interact with a remote command shell on the target (advanced
    users) |

    | Create Proxy Pivot | Pivot attacks through the remote host as a gateway (TCP/UDP)
    |

    | Create VPN Pivot | Pivot traffic through the remote host (ether/IP) |

    | Terminate Session | Close this session. Further interaction requires exploitation
    |


    History

    | Session History | Post-Exploitation Modules |

    | Event Time | Event Type | Session Data |


    # Actions Inside a Session

    You will be able to execute the following actions inside of a session.


    # Collect System Data

    This will collect sensitive and critical data from a target system, such as passwords,
    screenshots, and system information. This button is the equivalent of a first
    stop and shop feature. You don''t need get information about the'
  merge: -1
  pgno: 374
- img_proc: true
  md: 'root account in every session. Therefore, it is always useful to pull up all
    available system information to understand the target system better.


    # Access File System


    This button will let you access the file system of the target system and upload,
    download or delete files on it. If the target system is a web server, uploading
    keyloggers, Trojans, backdoors, and other malicious tools will always help you
    to exploit the system further. Just ensure that you do not upload something like
    your resume here.


    # Command Shell


    This option is for advanced ethical hackers. It lets you interact with a command
    shell on the target system. If root credentials are not available, an ethical
    hacker will have to get dirty on the system’s command line.


    # Create Proxy Pivot


    Pivot attacks using the target system as a gateway. If the target system was a
    proxy to the network of other computer systems on the network, it can serve as
    a gateway to access all the other systems and exploit the other systems as well.


    # Create VPN Pivot


    You can convert the target system into a VPN gateway and direct traffic through
    it. This is very similar to the Create Proxy Pivot button except that all traffic
    is directed through an encrypted VPN tunnel. This helps when an ethical hacker
    manages to evade intrusion detection systems.


    # Terminate Session


    This button will terminate all sessions on the target system and delete the Metaspreter
    shell from it. If an ethical hacker leaves behind malicious software on the target
    system, the target system is still compromised. Therefore, it is important to
    delete all such software or files before terminating the session.


    This is it. Metasploit is one of the superpowers for an ethical hacker to possess.
    There are more than 400 tools available in Kali Linux, and yet, there are entire
    books dedicated to Metasploit alone. It will take you time and patience to get
    experienced with the Metasploit framework, and it will be'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'worth it.


    # Exploiting Web Servers and Web Applications


    Software is nothing but a million lines of code written by humans. Irrespective
    of the language used to code software or of the function of software, it is prone
    to have vulnerabilities. Web applications are software running in a web browser.
    The only difference from regular local applications is that web applications have
    more public-facing entry points on the Internet. This allows an attacker to inject
    malware into the application, access the network, destroy the websites, or steal
    information from the server on which the web application is hosted. It is not
    sufficient to secure an operating system. If the applications running on a system
    are not secure, the security of an operating system is useless.


    # OWASP


    The Open Web Application Security Project or OWASP is a nonprofit organization
    working towards the security of software. There is an annual listing of the top
    10 vulnerabilities released by OWASP that are commonly exploited by attackers.
    At the time of writing this book in 2020, the top 10 vulnerabilities are as follows.


    +   1. Injection

    2. Broken Authentication

    3. Sensitive Data Exposure

    4. XML External Entities (XXE)

    5. Broken Access Control

    6. Security Misconfiguration

    7. Cross-Site Scripting (XSS)

    8. Insecure Deserialization

    9. Using Components with Known Vulnerabilities

    10. Insufficient Logging and Monitoring'
  merge: -1
  pgno: 376
- img_proc: true
  md: 'You can read more about the top 10 vulnerabilities in 2020 on https://owasp.org/www-project-top-ten/


    Additionally, OWASP also has local chapters worldwide to create awareness about
    software security. The chapters have members who discuss new methods for testing
    software, conduct training, develop secure applications, etc. You just need to
    show up at a group meeting to become a member of an OWASP chapter. You can visit
    the OWASP website from the URL mentioned above and click on the link that says
    Chapters to search for local OWASP groups around you.


    # Testing Web Applications


    There are several tools available in Kali Linux at the convenience of a click
    to test web applications, but the power of a tool is great only when you know
    when to use it and how to use it. The penetration testing methodology for testing
    web applications is the first three stages of ethical hacking methodology viz.
    Reconnaissance, Scanning, and Exploitation. Cases may also make use of the last
    two stages viz. Maintaining Access and Reporting.


    Moreover, while testing a web application, an ethical hacker needs to test every
    page on the website and not just the home pages or the login pages. If you secure
    the login page of a website, it is not an indication that you have secured the
    entire web application, and you can conclude the testing process. There are multiple
    incentives for an attacker to target websites today. Therefore, you should leave
    no stone unturned while testing a website or a web application.


    Let us go through the steps of testing a web application.


    # Step 1: Manual Review


    When you run a port scan on a target system, it may return a result that says
    that HTTP is running on port 80. This does not necessarily mean that the website
    is running on port 80 as well. You can launch a browser and navigate to port 80
    of the target system to check if it is serving on that port. This is true for
    just port 80, but a port scan may return results of several web services that
    are running on ports other than ports 80 or 443. Ensure that you can scan through
    all available links on a website as they may contain'
  merge: -1
  pgno: 377
- img_proc: true
  md: 'information. If you are prompted for a password by the access control mechanism
    of the website, try up to 10 passwords or just press the Escape key to see if
    you can directly bypass the authentication. Open the source code for every web
    page and check if there are any notes by the developer. This can be a time consuming
    and boring process, but there are no automation tools in the word that can identify
    any vulnerabilities. Therefore, it is a critical first step to review a website
    or a web application manually.


    # Step 2: Fingerprinting


    A manual review of a website will not give you details about the web server, the
    web application, or the operating system. Fingerprinting using Kali Linux can
    help you determine all three of these.


    # NetCat (nc)


    NetCat is a tool available in Kali Linux that can be used as a fingerprinting
    tool as well as a listener for incoming connections. The syntax to use the NetCat
    command on a Kali Linux terminal is as follows.


    ```

    nc {host} {port}

    ```


    Example: nc 192.168.56.102 80


    This command will establish a connection with the host at IP 192.168.56.102, but
    no results will be returned until the command is sent across to the webserver.
    There are several techniques for fingerprinting with NetCat. You can use the following
    commands to fetch information about the web server and the operating system of
    the target system.


    ```

    nc 192.168.56.102 80

    ```


    Press Enter


    HEAD / HTTP/1.0


    Press the Enter key twice.'
  merge: -1
  pgno: 378
- img_proc: true
  md: 'In the result of this command in our example, the target system was running
    Apache 2.2 on an Ubuntu Linux operating system and with PHP version 5.2.4-2ubuntu.50.
    This information will help an ethical hacker to narrow down the tools and attacks
    they want to use against a target system.


    # SSLScan (sslscan)


    If you see that a website is using an SSL certificate, it is good to understand
    the kind of SSL encryption being used by the website. A lock symbol in the address
    bar of your web browser just before the URL of a website is an indicator that
    a website is using an SSL certificate.


    ![](img/d52d8402f5bef7b14bcbab9bcc53820f_379_0.png)


    The SSLScan tool queries services on a server for TLSv1, SSLv2, and SSLv3, checks
    if there are any preferred ciphers, and returns the SSL certificate being used
    by the website. The SSLscan command that can be used in a Kali Linux terminal
    is as follows.


    ```

    sslscan {ipaddress} {port}

    ```


    Example: sslscan 192.168.56.102 80'
  merge: -1
