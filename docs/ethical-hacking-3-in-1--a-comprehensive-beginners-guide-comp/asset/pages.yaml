  md: '# Chapter 32

    Hacking with PHP


    In this chapter, you''ll learn how to use PHP to perform a system analysis and
    gather information to rectify any problems. To work on the programs in this chapter,
    you''ll need the following:


    +   * A text editor

    "* Any browser

    "* An Apache web server with PHP


    # What Is PHP?


    PHP is a scripting language that works on the server. The code that you write
    in PHP will only be executed on the server. The client will not see the code,
    which is why this is the perfect tool to use to test the security of a server
    or network in an organization.


    # Finding the IP Address


    In this book, we will refer to the IP address as “yourip". You should replace
    the IP address with the local host or “127.0.0.1" if you are using a browser on
    the same system on which you have Apache; otherwise, you will need to know what
    the local IP address is. In order to find it, you should execute the following
    command:


    ```

    ifconfig | grep ''inet addr:''

    ```


    The IP address is the string of numbers that comes after the “inet addr:" on the
    line that doesn''t contain the address “127.0.0.1".


