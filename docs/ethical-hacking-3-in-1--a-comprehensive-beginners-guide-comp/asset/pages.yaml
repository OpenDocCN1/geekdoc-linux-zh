    # Server Protocols


    Server protocols fall under either of the two categories below:


    +   - Text-based protocols

    - Binary protocols


    Text-based protocols are those that you and I can read. As an ethical hacker,
    this is where you need to spend more time seeing that these protocols are easy
    to understand. Some of these protocols include FTP, HTTP, and SMTP.


    Binary protocols, on the other hand, are not easy to understand, and a human cannot
    read them. As an ethical hacker, you need to focus more on text-based protocols
    and not binary protocols. Some of the common text-based protocols are explained
    below:


    FTP is for File Transfer Protocol. The protocol, which is typically used for uploading
    and downloading files from a server, runs on port 21. In any network, FTP is the
    weakest link since that communication is unencrypted – you can use a network sniffer
    to capture traffic.


    SMTP is short for Simple Mail Transfer Protocol. Most of the mailing servers today
    use SMTP, which runs on port 25. During an ethical hack, you will encounter SMTP
    a lot, and it carries sensitive information.


    HTTP is the third of text-based protocols. This protocol, which runs on port 80,
    helps you connect to website. When you are conducting web hacking, this is the
    protocol you need to compromise.


