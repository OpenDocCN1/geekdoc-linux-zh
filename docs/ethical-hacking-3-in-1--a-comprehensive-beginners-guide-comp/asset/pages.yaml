    # Traceroute


    Traceroute employs the ICMP ping command to figure out how many network devices
    lie between the computer system initiating the trace and the target system. The
    traceroute command functions by manipulating the Time To Live value of a network
    packet, also known as TTL. TTL indicates the number of times the same network
    packet can be broadcast again by the next host on the network before the packet
    expires. The command assigns an initial TTL value of 1 to the packet indicating
    that the packet can be broadcast only by one more device between the initiating
    system and the target system. The receiving device will send back an ICMP type
    11 code 0 packet indicating time exceeded, and the packet has been logged. The
    sender then increases the TTL of the packet by one and sends the next set of packets.
    The packets reach the next hop on the network as per their time to live. As a
    result of this, the receiving router sends another reply indicating time exceeded.
    This process continues until the packets reach the target, and all hops on the
    route have been logged. It leads to printing a list of devices that exist between
    the initiating system and the target system. This command can help a penetration
    tester to understand the kind of devices that are present on the network. The
    default TTL of Windows-based devices is 128, Linux-based devices are 64, and Cisco
    networking devices is 255.


