  md: '# # Introduction


    Thank you for purchasing the book, Ethical Hacking - A Comprehensive Beginners
    Guide to Learn and Understand the Concept of Ethical Hacking.


    If you are looking to hack another person''s system to obtain information illegally,
    please stop reading this book right away. You should continue to read the book
    if you want to learn more about how to test the vulnerabilities in a system or
    network and fix those vulnerabilities. This book provides information on different
    techniques an ethical hacker can use to identify any in a system or network and
    identify a way to fix those vulnerabilities. Most organizations perform this exercise
    to prevent a malicious hack on the organization''s network and infrastructure.
    This book only talks about ethical hacking, which is a legal way of testing the
    vulnerabilities in a system. You must understand that both computer and network
    security constantly evolve. Therefore, you must ensure that you always secure
    your computer and network from criminal hackers or crackers.


    This book lists different tools and techniques that you can use to test the system
    or network for any vulnerabilities. Once you identify the vulnerabilities, you
    can work towards improving network security. If you do not know how a hacker thinks,
    you may not be able to test the system well. If this is the case for you, then
    you should spend some time to understand how a hacker thinks and use that knowledge
    when you are assessing the system.


    Ethical hacking is also penetration testing or white hacking, and it is used by
    many organizations to ensure that their network and systems are secure. This book
    will provide information about different software and tools that you can use when
    you are performing an ethical hack. There are some sample exercises and programs
    in the book that you can use to begin the ethical hacking process.


    I hope you are able to gather all the information you need from this book. Once
    again, please refrain from using the content within for any illegal purposes.'
