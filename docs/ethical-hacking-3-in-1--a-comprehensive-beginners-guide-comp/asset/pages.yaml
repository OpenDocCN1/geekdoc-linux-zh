  md: '# # Chapter 3


    # # Ethical Hacking Terminologies


    This chapter briefly details some of the common and important terms that are used
    in the field of hacking.


    # ## Adverse


    Hackers use this software to display advertisements on a system by force.


    # ## Attack


    Hackers perform this action to access a system and extract some sensitive data
    from that system.


    # ## Back Door


    A back door, which is also referred to as a trap door, is an entry port into software
    or a computer. This port does not require any login information or password, and
    as a result, it can bypass all security measures.


    # ## Bot


    A bot is a type of program that is used to automate any action, thereby increasing
    the number of times it can be performed. This means that the bot will perform
    the function for a longer time when compared to a human operator. For instance,
    hackers use bots to call a script that can be used to create an object or send
    an FTP< Telnet or HTTP file at a higher rate.


    # ## Botnet


    Botnets, which are also called zombie armies, are a group of computers that can
    be controlled without the knowledge of the owner. These are used to perform denial-of-service
    attacks or send spam.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Brute Force Attack


    A brute force attack is possibly the simplest attack that a hacker can perform
    to gain access to a system or application. This attack is an automated attack,
    and this means that it will try different usernames and passwords repeatedly until
    it can access the system or application.


    # Buffer Overflow


    The buffer overflow is a flaw that can be observed when a lot of data is written
    onto a single block of memory. This means that the memory can no longer hold onto
    that data.


    # Clone Phishing


    Clone phishing is a type of legitimate and existing email that has a false link.
    This link will trick a recipient into providing some personal information that
    the hacker can use to disarm the system or network.


    # Cracker


    A cracker is a type of hacker that modifies any software to access some features
    of a system, such as copy protection features.


    # DoS or Denial-of-Service Attack


    A denial-of-service, or DoS, attack is used by a hacker to ensure that a network
    resource or server is not available to the user. This is done by suspending the
    services of that server or resource.


    # DDoS


    DDoS stands for distributed denial-of-service attack.


    # Exploit Kit


    An exploit kit is a system that a hacker designs to run on some web servers. This
    system is used to identify any vulnerabilities in a client machine that is communicating
    with the web server. It will then exploit those vulnerabilities and afterwards,
    execute some malicious code in the system.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Exploit


    An exploit is a part of code or a chunk of data or software that will take advantage
    of a vulnerability or a bug in the system and network which, in turn, compromises
    the security of that system or network.


    # Firewall


    A firewall is a type of filter that is placed on a network. This filter helps
    to keep unwanted intruders away from the system or network. In addition, it will
    ensure that the communication between the users and systems inside the firewall
    are safe.


    # Keystroke Logging


    Keystroke logging is a process during which a hacker tracks how the keys are pressed
    on the keypad. This process will help the hacker develop a blueprint of the human
    interface. It is often used by both black and grey hat hackers to record some
    passwords. A keylogger is most commonly delivered onto a system using a phishing
    email or a Trojan horse.


    # Logic Bomb


    A logic bomb is a type of virus that is added to a system that will trigger a
    malicious attack if some conditions are met. A common example of a logic bomb
    virus is a time bomb.


    # Malware


    Malware is a term that describes a variety of intrusive and hostile software,
    including Trojan horses, spyware, scareware, adware, virus, ransomware, worms
    and any other malicious programs.


    # Master Program


    Master programs are those programs that black hat hackers use to transmit commands
    into zombie drones (explained later in the chapter). These drones carry spam attacks
    or denial-of-service attacks.


    # Phishing'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Phishing is a fraud method where the hacker sends an email out to the target.
    The hacker will use this email to gather some personal or financial information
    from the user.


    # Phreaker


    A phreaker is a normal computer hacker. These hackers often break into telephone
    networks and either tap the phone lines or make long-distance phone calls.


    # Rootkit


    Rootkit is a software that is often malicious. A hacker designs this software
    to hide some processes or programs from any normal detection method. This will
    ensure that the rootkit is stored on a system and has privileged access to the
    system.


    # Shrink Wrap Code


    A shrink wrap code attack is a way to exploit the holes in a poorly configured
    or unpatched software.


    # Social Engineering


    A hacker uses social engineering to deceive another person. The hacker uses this
    technique to acquire some personal information about the user, like credit card
    details or passwords.


    # Spam


    Spam is an unsolicited email. This is also called junk email and is often sent
    to a large group of people without their consent.


    # Spoofing


    Spoofing is a technique that a hacker uses to gain access to a system or network.
    The hacker will send a message to the computer using an IP address, and this address
    will indicate to the system that the message is being sent from a trusted host.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Spyware


    Spyware is a software that''s used to gather information about an organization
    or person without their knowledge. This software can be utilized to send sensitive
    information to any entity without the consent of the customer. It can also be
    used to assert control over a system.


    # SQL Injection


    SQL injection is an injection technique code that is written in SQL. This tool
    is used to attack any data-driven application. It includes some malicious SQL
    statements that are entered into a field in the data. An example of an SQL injection
    would be dumping all data into the attacker''s folders.


    # Threat


    Threats are possible dangers to a system or network. These can be used by hackers
    to exploit vulnerability and compromise the security of a network or system.


    # Trojan


    A Trojan horse, or Trojan, is a program that is designed to look like a normal
    program. Differentiating between a Trojan and a regular program is difficult.
    This tool can be used to alter information, destroy files and steal sensitive
    information like passwords.


    # Virus


    A virus is a piece of code or a full program that is malicious. It copies itself
    in the system and has a detrimental effect on it as a result. A virus can destroy
    data and corrupt the system.


    # Vulnerability


    A vulnerability is a weakness in the system or network that allows a hacker to
    compromise the security of that system or network.


    # Worms


    Worms are like every other virus in the sense that it can replicate itself in
    the'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'system. It resides in the active memory but does not make any changes

    to the files and will only duplicate itself.


    # Cross-Site Scripting


    Cross-site scripting, or XSS, is a security vulnerability that is often found
    in a

    web application. This vulnerability gives the hacker the ability to inject

    script into a web page that is viewed by users.


    # Zombie Drone


    A zombie drone is used by hackers as a soldier to perform a malicious

    activity. This drone is a hijacked computer that is used by some hackers to

    distribute unwanted spam emails.'
  merge: -1
