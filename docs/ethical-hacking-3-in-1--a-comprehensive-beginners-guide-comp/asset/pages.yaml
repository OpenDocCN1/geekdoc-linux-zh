    +   - Symantec virus encyclopedia: https://www.symantec.com


    +   - F-secure: https://www.f-secure.com


    #  Quick Tips


    +   - You should always install an antivirus and ensure that it''s consistently
    updated.


    +   - Never open an email if it comes from an unidentified source.


    +   - Never accept an invitation from unknown people on any social media platform.


    +   - Never open a URL that was sent in any form to you by an unknown person.'
