    A traceroute applies a TTL (time to live) field on the IP header to determine
    the location of the system. TTL value will decrease whenever it reaches a hop
    on the network. Traceroutes are available in three types:


    +   1. ICMP Traceroute as used on Windows


    +   2. TCP traceroute


    +   3. UDP traceroute


    # ICMP Traceroute


    ICMP is the default location tracking service on Windows. However, the service
    gives you a timeout after several requests. Timeout indicates that a firewall
    or a device such as IDS might be blocking your echo requests.


    # TCP Traceroute


    Because many devices typically block ICMP Traceroute, you need to try another
    service such as TCP or UDP traceroutes – these are referred to as 4-layer traceroutes.
    By default, Linux BackTrack has TCP Traceroute. To find it, use the following
    command:


    ```

    apt-get install tcptraceroute

    ```


    To locate a website, you need to use the following command from the command line:


    ```

    traceroute www.website.com

    ```


    # UDP Traceroute


    UDP is a Linux traceroute utility, which, unlike in Windows, uses UDP protocol.
    In Windows, the command is “tracer,” but in Linux, the command is “traceroute.”


    To search a website, use the command below:


    ```

    traceroute www.targetwebsite.com

