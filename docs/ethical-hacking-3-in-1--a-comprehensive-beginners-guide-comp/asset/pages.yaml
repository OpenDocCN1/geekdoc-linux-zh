  md: '# # Chapter 1


    # # What is Ethical Hacking?


    Today, when you talk of a hacker, the picture that comes to the mind of many people
    who breaks into the security systems to obtain information illegally. In the 1990s,
    however, a hacker was someone with immense knowledge on programming and who would
    build complex algorithms. With the word “hacker” gaining negative hype, now a
    hacker is a bad guy.


    However, a hacker is not always a bad guy, as the media has made everyone believe.
    You will hear news about a hacker when hacking results in stolen personal details
    or cyber theft. For many years, hackers have been breaking into security systems
    of corporates to highlight vulnerabilities that help better the systems. A hacker,
    therefore, is a creative person, can solve complex problems, and can find ways
    to compromise the security systems of targets.


    There are three main types of hackers based on why they do what they do:


    **White hacker** – A white hacker does penetration testing to uncover vulnerabilities
    in a security system. These hackers are employed by organizations as security
    professionals to find loopholes that malicious attackers might to gain access
    to the system.


    **Black hacker** – This is also known as a cracker. A back hacker will use the
    knowledge they have to break into security systems for negative purposes. They
    might steal and sell information or allow access to other people who are eagerly
    malicious.


    **Gray hacker** – A person who hacks security systems for negative purposes and
    at the same time offers their services as security professionals to organizations
    is a gray hacker. At one time, a gray hacker is “the good guy,” and the next time,
    “the bad guy.”


    Besides the above three categories, there are other types of hackers, including:'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'Hacktivist – These are groups of hackers who break into systems to have their
    voices heard. The motivation might be political, human rights, freedom of speech,
    or any other cause that activists fight for.


    Script Kiddie – This is a hacker who can compromise a target created by other
    people. However, this hacker lacks knowledge of how exploits work – they cannot
    create or modify exploits.


    Elite hacker – An elite hacker has a deep understanding of exploits and hacking
    software. This is a hacker who can create or modify hacking software and break
    into a security system with ease. When an exploit is not working, this hacker
    finds a way to modify it even if the exploit was written by someone else.


    # Understanding Hacking Terminologies


    There are terms that you need to understand to help you go through this guide.


    # Vulnerability


    This refers to a weakness or a loophole in the security system of an organization.
    It is a port through which attackers gain access to information on an organization.
    The vulnerability can lead black hat hackers into the systems resulting in data
    compromise.


    # Asset


    An asset refer to data or device that holds information in an organization. Assets
    need protection from anyone except those authorized to view and manipulate data.


    # Threat


    Threats are imminent dangers to the computer security systems that organizations
    have put in place. This may represent a malicious hacker who has tried to gain
    unauthorized access to a computer system or statements from malicious people who
    say they will get access to a system.


    # Exploit


    An exploit is something that allows a hacker to gain access to a computer'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'system. This exploit comes in the form of software or an algorithm. With an
    exploit, a hacker takes advantage of vulnerabilities in a computer system.


    # Risk


    After a successful exploit, what damages will a hacker cause? These damages to
    the asset comprise comprise of risks.


    # Penetration Testing


    In penetration testing, an ethical hacker poses as a black hacker to expose and
    document vulnerabilities in a computer system. It comprises of a set of methods
    and techniques that a hacker applies to test the security of an organization.


    # Pre-Engagement and Rules of Engagement


    Unlike black hacking, where the hacker picks any system to break into, ethical
    hacking involves an agreement between a hacker and an organization. To hack into
    a security system, an ethical hacker and their client need to agree. After the
    agreement, the hacker needs to ensure that they follow all the rules of engagement.
    These rules comprise of the methodologies to use, hacking duration, goals and
    milestones, and liabilities and responsibilities of a hacker, among others.


    Some of the rules of engagement that hackers need to agree with their clients
    include:


    +   - Signing a “nondisclosure” and “permission to hack” form both parties.


    +   - The section of the computer system to be tested or hacked.


    +   - How long the hacking should take – that is, start and end date.


    +   - The method the hacker will use.


    +   - Allowed and disallowed techniques.


    +   - Liabilities and responsibilities. If you break into a system that should
    not be accessible or you access information such as credit card details, liabilities,
    and responsibilities, keep you from using'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'the information.


    Because you need to carry out the ethical hack in stages, you need to set milestones
    to help you track your progress. You can carry out your hack into phases, each
    taking a set duration. These phases might include:


    +   - Scope definition

    - Reconnaissance

    - Scanning

    - Exploitation

    - Post Exploitation

    - Reporting


    As an ethical hacker, you will give each of the above phases enough time based
    on the section of the computer system that you will hack.


    # Ethical Hacking Methodologies


    You can carry out an ethical hack using different methodologies, including:


    # OSSTMM – Open source security testing methodology manual


    This methodology includes the majority of the steps carried out in a penetration
    test – it is an in-depth security test that includes hacking into almost all components
    of a computer system. This methodology is intense almost cumbersome, and in most
    cases, it is not possible in everyday ethical hacking. Again, the method requires
    a lot of resources which most companies are not able or willing to give.


    # NIST


    NIST is a more comprehensive ethical hacking methodology carried out in four simple
    steps – planning, discovery, attack, and reporting. In the first step, planning,
    an ethical hacker decides on the engagement to be performed. After planning is
    the discovery phase where the hacker gathers information, scans the network, identifies
    service, detects the OS, and then assesses the vulnerability of the computer system.


    After discovery, now the actual hacking starts. The attack phase is detailed'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'and includes gaining access, escalating privileges, system browsing, and installation
    of additional tools. If you compromise a target and the system has multiple interfaces,
    you will go back to the discovery phase and start all again on a different interface.
    The NIST ethical hacking methodology involves reporting after planning and reporting
    after the attack.


    # OWASP


    OSSTMM and NIST methodologies focus more on network hacking rather than application
    hacking. OWASP is a simple methodology that involves testing the security of an
    application. This methodology, which is developed by web application researchers,
    is an in-depth methodology that follows all the steps in web application testing.


    # Categories of Ethical Hacking


    In hacking, an organization hires your services to test how secure their systems
    are. While defining the scope of the hack, the hack engagement is also defined
    along with it. The hack can be divided into the white box, black box, or gray
    box, depending on how the client wants to hack and the security paradigm tested.


    # Black Box Ethical Hacking


    A black box ethical hack is where the client gives no information except a few
    details about the organization. Here, a hacker is only given the IP ranges they
    need to test. The hacker will, therefore, find all other details they need to
    hack the system. In case a web application needs an ethical hack, the client does
    not provide the source code of the application. This form of an ethical test is
    common during external penetration tests.


    # White Box/Ethical Hacking


    Here, the organization provides all details a hacker needs to perform the hack.
    These details include the server version, target operating system, an application
    running, etc. If the hacker is to test a web application, the source code of the
    application is provided. White bot hacking is common in internal system testing
    where an organization is not afraid of leaking information.


    # Gray Box hacking'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'In gray box hacking, some details are provided, and others are withheld. The
    client might disclose the application running and the operating system, but they
    might not disclose versions of all the running applications. In the case of web
    application testing, details such as test accounts, databases, and back end servers
    are provided.


    # Different Ethical Hacking Environments


    # Network Hacking


    In-network hacking, a hacker targets a network environment to check vulnerabilities
    and threats. The ethical hacker will test the external and internal properties
    of a network. In external testing, the hacker tests the external IP addresses
    while in internal, the hacker joins an internal network and uncovers its vulnerabilities.
    Depending on the engagement rules, the hacker might be VPN access to the network,
    or they might have to visit the network environment to conduct the hack physically.


    # Web Application Hacking


    Most applications online hold critical data, which, if stolen, will compromise
    the privacy of a lot of people. The data includes usernames, passwords, and credit
    card numbers. Granted, web application pen tests are so common today.


    # Mobile App Ethical Hacking


    Today, most organizations use some form of iOS or Android-based mobile application.
    Mobile application ethical hack is a new test conducted to ensure these apps are
    100-percent secure from attacks. Seeing that most of the applications hold personal
    details, they must be tested.


    # Social Engineering Tests


    Social engineering hacks might be part of network hacks. Here, an organization
    pays you to find tricks to attack users in the network. You will use browser exploits
    and speared phishing, among other methods, to get users to do things they would
    otherwise not do.


    # Physical System Hacking'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'Physical testing is not common. Here, you will be asked as an ethical hacker
    to walk into an organization and test physical security controls such as RFID
    mechanisms and locks.


    After every ethical hacking project, you will need to write a report highlighting
    the vulnerabilities in the systems and what should be done to keep the systems
    safe. In the report, you will give a detailed analysis of the vulnerability and
    clearly show its root cause. In that report, you will include evidence of the
    vulnerability. With this report, the organization will know how to rectify the
    vulnerabilities and stay free of threats. Even better, you will have to include
    recommendations in the remediation section of the report.


    # Conclusion


    This chapter introduced hacking, the different types of hacking, basic terminologies
    used in hacking. We also looked at the different methodologies you can use during
    an ethical hack. In the next chapter, we will look at the tools that you need
    to hack.'
