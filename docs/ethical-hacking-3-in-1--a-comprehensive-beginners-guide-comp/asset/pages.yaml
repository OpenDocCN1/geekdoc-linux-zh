    # Firewalls and Ports


    The most common implementation in any organization to protect its network and
    information systems is by placing a firewall between its internal network and
    the external network, which is mostly the Internet. A firewall is a software or
    hardware, which has rules to serve as a gatekeeper to a network. There are access
    control rules defined in a firewall to monitor inbound and outbound traffic called
    egress. The traffic that satisfies these access control rules is allowed to pass
    through the firewall while the rest of it is dropped or discarded. This is done
    by opening and closing ports on the firewall that allow or reject traffic.


    Ports can be defined as communication channels used by computers to communicate
    with each other. A computer system has 65,535 ports each for TCP and UDP that
    can be used for communication. Some of these ports are reserved for specific functions
    but are not restricted by any one other function. For example, port 80 is a TCP
    port that is used for Regular traffic over hypertext transfer protocol (HTTP).
    You can, however, allow other traffic over port 80 and HTTP traffic can be transmitted
    over other ports too.


    A simple analogy is to think of ports as different rooms to a big office building.
    Every room has a designated staff doing specific work and specific functions.
    The room with suite number 80 marked on it allows all web page requests through
    it. However, it is possible to move these functions to a different room, say suite
    number 8080, and perform the same function out of suite 8080. Meanwhile, a different
    set of staff can move into suite 80 and just lock it and do nothing. People trying
    to visit the web team will need to go to suite 8080 instead of suite 80 now to
    get their work done.


    A visitor trying to get web information from suite 80 will not get any information
    as the team in there will be a wrong team, or the room will be simply locked.
    Other times people requesting web information from room 8080 will get the information
    they came looking for.


    # IP Protocols


    Protocols in simple terms mean rules, applied to real-life or information'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'systems and networks. High-ranking officials or politicians have staff members
    in place to handle protocol for them. The people working in protocol offices ensure
    that a visitor or their message is processed in a manner of proper format and
    with respective titles and honors.


    Similarly, in the digital world, protocols ensure that communication between the
    computer systems takes place as per rules that are defined. There are a huge number
    of protocols followed by computer systems, but in this chapter, we will focus
    on the three most important of them all, TCP, UDP, and ICMP.


    # TCP


    Transmission Control Protocol is one of the most important protocols in networking.
    TCP is a connection-based communication protocol. What this means is computer
    systems on either side of a connection acknowledge each other and that they can
    receive messages from each other.


    Let us understand this with a phone call analogy.


    +   - Phone rings

    - Alice: Hello

    - Bob: Hi, is Alice there?

    - Alice: This is Alice


    This is a very old analogy, but it depicts the three-way handshake that happens
    between two systems in a TCP communication stream. In a TCP three-packet handshake,
    a computer system initiates communication with another computer system, by sending
    a synchronization packet known as SYN. The computer system at the other end of
    the connection, if available, will reply to the SYN packet with an acknowledgment
    packet and send another SYN packet to the first computer system. This is known
    as the SYN/ACK packet. Finally, the first computer system that initiated the communication
    will receive the SYN/ACK packet and send a final ACK packet back to the second
    computer system and establish a communication channel.


    A three-way handshake ensures a connection has been established properly, and
    the computer systems at both ends are synchronized with each other. This'
  merge: -1
  pgno: 348
- img_proc: true
  md: 'process continues throughout the session so that all packets sent by one system
    are received by the other system, and packets that fail can be resent again.


    # UDP


    User Datagram Protocol is a protocol that is less loaded compared to TCP connections.
    If the TCP protocol is analogous to a phone call with a two-way communication
    happening over a session, a UDP protocol would be more like a radio broadcast
    where communication is being sent out without requiring any verification from
    the sender or the receiver about the network packet.


    Radio Station: It will be cloudy with a chance of snowfall today.


    This broadcast is sent over the air, and it is not a concern if the recipient
    did not receive it. The recipient would not request the retransmission of a packet
    if they failed to receive it. In short, in UDP communication, the receiving end
    does not confirm if they received or dropped the packet during transmission.


    The UDP communication method is preferred for services that do not need to keep
    checking if a packet arrived properly or if it arrived in a particular order.
    Given that the applications using UDP protocol value higher speed compared to
    overhead, UDP is mostly used in applications that stream music or videos.


    # ICMP


    Internet Control Management Protocol is a health and maintenance protocol for
    the network by its design. The protocol checks if a device on a given network
    is functional. Most users never get to use applications that deal with ICMP directly,
    but applications like Ping and Traceroute are exceptions to this rule. Another
    huge difference in ICMP concerning UDP and TCP is that it does not carry any user
    data. ICMP transfers system messages on the network between computer systems.


    There are specific codes and types for every ICMP message that is contained in
    the ICMP header. These codes either ask questions or provide information to the
    various devices on the Internet. The code and typesets can help an ethical hacker
    figure out the kind of devices that exist on a target network.


    Let us go through these types and codes in an ICMP header.'
