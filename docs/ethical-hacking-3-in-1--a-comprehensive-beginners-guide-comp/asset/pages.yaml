  md: '# MAC Flooding


    MAC flooding is the simpler of the two attacks. Here, you will need to send many
    ARP replies to a switch-based network. With so many replies, the switch gets overloaded
    and “switches” to a hub-based network where it sends traffic to all devices on
    the network. At this point, the attacker can use a sniffer tool to capture the
    traffic. However, newer switches come with protection against this kind of attack.


    One of the tools you can use to launch a MAC flooding attack is Macof.


    Macof will fill the cam table with ARP replies in less than a minute – it sends
    up to 155,000 replies in a minute. To use this tool, use the macof command from
    your terminal.


    ```

    - macof

    ```


    After flooding the table, you need to open Wireshark and capture all the traffic.
    By default, Wireshark will capture all traffic in promiscuous mode, but when the
    network switches to a hub mode, you do not need to capture the traffic in promiscuous
    mode.


    # ARP Poisoning


    ARP poisoning is an attack where the attacker stays in the middle of communication.
    An attacker will trust that communication comes from the right device. The Protocol
    is not stable and can be compromised. As an attacker, you will need to send a
    spoofed ARP reply to a computer on a network associated with a given MAC address.
    By doing so, you will poison the ARP cache that resolves IP to MAC address.


    Simply, an attacker sends an ARP reply to a host (say host A) in the network telling
    the host that another host (say host B) is at the MAC address of the hacker, and
    sending a reply to host B, giving them the MAC address of the hacker.


    # Network Sniffing Tools


    When an attacker needs to place themselves in the middle of a communication, here
    are some tools they can use:


    # Dsiff'
