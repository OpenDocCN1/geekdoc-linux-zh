  md: '# Chapter 1


    # An Introduction to Ethical Hacking


    This book focuses solely on ethical hacking. It will detail how you can use different
    techniques to test your system or network for any vulnerabilities and then fix
    those vulnerabilities before a cracker exploits them. Most people misuse the word
    "ethical", often not understanding what it means. The definition given in the
    Merriam Webster dictionary suits the purpose of this book. An ethical hacker can
    perform the different tests mentioned in the book once the system owner gives
    him or her permission to perform the hack.


    # Who Do Hackers Beget Ethical Hacking?


    Everyone has heard about hackers, and many people have even suffered losses because
    of the actions of a hacker. So, who is a hacker, and why is it important for people
    to learn more about what a hacker does? The next few sections in the book will
    help you understand the process of hacking and the different types of hackers
    in the industry.


    # Who Is a Hacker?


    The word "hacker" can be defined in two ways. A hacker is someone who tinkers
    with software and electronic systems to understand how they work. They also look
    for ways to improve the functioning of a network and electronic system. They love
    the challenge of discovering new ways to make systems work. In recent times, the
    term "hacker" has taken on a new meaning. Hackers are people who want to break
    into a system or network for malicious purposes. These hackers are called crackers
    or criminal hackers. A cracker will only break into a system or network to steal,
    delete or modify some confidential information, which can lead to huge losses
    for an organization or individual.


    This book will use the terms "hacker" and "ethical hacker", so it''s important
    that you understand what each means and that they differ from one another.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'hacker is someone who attacks a system with malicious intent, while an ethical
    hacker will attack a system to test and fix the vulnerabilities.


    An ethical hacker, or a white hacker, does not like to be called a hacker because
    people perceive the word negatively. Crackers claim that they are only helping
    the system or network owner by hacking it, but that''s untrue since they are electronic
    thieves.


    Hackers will always attack a system that they believe they can compromise. Most
    hackers like to attack a prestigious or well-protected system since it''s like
    a game for them. Also, when a hacker can attack a critical website or database,
    or his status will increase in the hacker circle.


    # What Is Ethical Hacking?


    Every system or network must always be updated and patched to protect from a cracker.
    An ethical hacker is someone who knows how to protect the system or network. An
    ethical hacker possesses the mindset, tools and the skills of a hacker, but this
    type of hacker is trustworthy as they only hack systems to run security tests.


    If you perform an ethical hacking test for a customer or want to add a certification
    to your resume, you can sign up for the ethical hacking certification that is
    sponsored by the ECCouncil. To learn more about the certification, visit their
    website: www.eccouncil.org/programs/certified-ethical-hacker-ceh.


    Ethical hacking (also called penetration testing or white hacking) uses the same
    tricks, techniques and tools to test the system. The main difference is that ethical
    hacking is legal. This type of hacking is performed only when the owner grants
    the hacker permission. As mentioned earlier, ethical hacking helps the system''s
    owner discover the vulnerabilities in the system from a hacker''s perspective,
    helping to improve the system''s security. This process is part of the risk management
    program, which helps the organization or the system owner enhance the system''s
    security. Ethical hacking backs a vendor''s claim that the products being sold
    by the vendor are legitimate.


    If you want to hack your system the way a cracker would, you should know how they
    think. After all, it''s always important for you to be familiar with'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'your enemy.


    # Why Should You Hack Your System?


    You must remember that the law of averages does not work in favor of security.
    The number of hackers and the amount of knowledge they have is increasing by the
    day. If you combine that with the number of vulnerabilities in the system, there
    will come a time when every computer system is compromised in one way or another.
    Protecting your system from a cracker is impossible. However, this does not mean
    that you should only look at the general vulnerabilities that people are aware
    of. Once you know how a cracker works, you will know how vulnerable your system
    really is.


    Ethical hacking helps you identify weak security practices and discover any areas
    needing attention. Encryption, Virtual Private Networks (VPN) and firewalls often
    create a false sense of security. However, these systems only focus on traffic
    and viruses through a firewall, which does not affect the work of a cracker. If
    you want to make your systems more secure, you should carry out the attack in
    the same way a cracker would. This is the only way you can harden the security
    of your system. If you fail to identify these weaknesses, it''s only a matter
    of time before the system''s vulnerabilities will surface.


    You should expand your knowledge in the same way a hacker does. You should think
    like one of them if you want to effectively protect your system. As an ethical
    hacker, you should understand the activities that a cracker will carry out and
    then identify ways to end their efforts. You must always ensure that you are aware
    of what you''re looking for. That being said, you cannot expect to protect your
    system from everything - that''s impossible. The only way you can protect your
    system from absolutely all threats is to unplug it and lock it up in a cupboard
    it is never touched. Let''s face it, that isn''t the best approach to secure your
    information. You should only learn to protect your system from common cracker
    attacks and other well-known vulnerabilities. Some cracker attacks are still unknown,
    but that doesn''t mean you should give up on testing your system. Try to use different
    combinations and test the entire system instead of looking at the individual units
    alone. You will discover more vulnerabilities in your system when you test it
    as a whole.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'It’s advisable that you don’t take ethical hacking too far. For example, if
    you don''t have too many people working in an office and don''t have an internal
    web server, you needn''t worry too much about an attack through the web. However,
    you should never forget about any malicious employees who will threaten the security
    of your company.


    All in all, your goals as an ethical hacker should be as follows:


    +   - Use a nondestructive approach to hack systems.

    "- Identify vulnerabilities and use these vulnerabilities to prove that systems
    need improvements.

    "- Apply the results and remove any vulnerabilities to improve security.


    # Ethical Hacking Commandments


    There are a few commandments that an ethical hacker must abide by. If a hacker
    does not abide by those commandments, there will be negative consequences. In
    the cases that an ethical hacker doesn''t follow these commandments, the results
    are not beneficial.


    # Working Ethically


    In this context, the word “ethical” refers to working with high morals and principles.
    Regardless of whether you are performing ethical hacking tests on your system
    or someone you hired to test their system, you must ensure that the steps you
    take support the goals of the individual or organization. In other words, you
    cannot have a hidden agenda. You have to ensure that you are honest and never
    should you misuse any information you find on the system; that is precisely what
    crackers do.


    # Respecting Privacy


    You must always respect the information that you gather. All the data that you
    are granted access during testing should be keep private, right from clear-text
    passwords to web-application log files. You should never use this information
    to peek into confidential information or people’s private lives. If you sense
    that there is an issue, you should share that information with the right person.
    Additionally, you should make a habit of involving other people'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'in your process to ensure that the owner of the system can trust you.


    # Not Crashing Systems


    Many people crash their systems because they don''t have a plan in mind when they
    begin their testing. These testers have either misunderstood the documentation
    or have not read it whatsoever. As a result, they don''t know how to use different
    tools to test the security of their systems. If you run too many tests on your
    system, you can create a DoS condition that causes a system lockup. You should
    never rush into it or assume that a specific host or network can bear the beating
    that the vulnerability assessment and network scanner tools dish out.


    Many security assessment tools control how tests are performed on systems at the
    same time. These tools are handy if you need to run a test on systems during business
    hours. You can create a system lock condition or lock the account by forcing someone
    to change their password. These people will not realize that they have agreed
    to lock their system.


    # Advantages of Hacking


    Hacking is a useful process when you:


    +   * Perform a penetration test to identify any vulnerabilities in the network
    and computer security

    * Recover any lost information, mainly in the case of a lost password

    * Identify protection or preventive measures that can be implemented to prevent
    any breaches in security

    * Prevent any unauthorized access from malicious hackers


    # Disadvantages of Hacking


    If hacking is done with negative intention, it can lead to the following issues:


    +   * Privacy violations

    * Unauthorized access to private information on a system'
  merge: -1
  pgno: 21
- img_proc: true
  md: '+   - Denial-of-service attacks

    - Massive security breaches

    - Malicious attacks on the system, leading to loss of important information

    - Hampering the operations of the system'
