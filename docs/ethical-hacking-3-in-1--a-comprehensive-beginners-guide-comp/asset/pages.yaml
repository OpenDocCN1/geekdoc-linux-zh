  md: '# # Chapter 12


    # # Sniffing


    The process of observing, listening, monitoring and capturing the packets of data
    passing through a network using different tools is called sniffing. This is analogous
    to tapping a phone wire and listening to the conversation. This process is also
    called wiretapping a computer network. If there is an open port or open switch
    on any network, it''s easy for any employee to sniff the traffic out and analyze
    that traffic. If there is someone who''s in the same location as the open port
    or uses the same ethernet cable to access the network, that person can sniff the
    full traffic from the network.


    In other words, sniffing will allow you to see both unprotected and protected
    traffic. If you follow the right rules and conditions and have the right protocols
    in place, you can attack a system and gather all the information necessary for
    any future attacks.


    # ## What Can Be Sniffed?


    The following sensitive information can be sniffed from a network:


    +   - Email traffic

    - Telnet passwords

    - Web traffics

    - Chat sessions

    - DNS traffic

    - Router configuration

    - FTP passwords


    # ## How Does Sniffing Work?


    Snifers often change the mode of the system to the promiscuous mode. This option
    gives the hacker a chance to observe the data that''s transmitted on the network.
    The promiscuous mode is a unique way in which an Ethernet'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'hardware allows the network to receive the traffic on the Internet, even if
    the data isn’t assigned to that network. It does this using a Network Interface
    Card, or NIC. During this process, the destination addresses of the hardware address
    and the ethernet packet are compared. That being said, if the network is on the
    non-promiscuous mode, it will be difficult for the tool to monitor and analyze
    the traffic in the network.


    ![](img/d52d8402f5bef7b14bcbab9bcc53820f_77_0.png)


    Sniffers can be used to monitor the traffic on any network continuously using
    an NIC. These sniffers will decode the information that is encapsulated in the
    packets of data.


    # Types of Sniffing


    Like the earlier methods, sniffing can be either active or passive.


    # Passive Sniffing


    In passive sniffing, a hacker can lock the traffic but cannot alter it in any
    way. This means that the hacker can listen or observe the traffic. This method
    is used on hub devices. The traffic on a hub device is sent to every port in the
    network. The network uses hub to connect multiple systems, which means that every
    host on the network can view the traffic. Therefore, it’s easy for a malicious
    hacker to capture all the information that’s passing through the network. Most
    hub devices are obsolete today, which makes passive sniffing ineffective.


    # Active Sniffing'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'In active sniffing, the traffic is monitored and locked, and the hacker has
    the authority to alter that traffic. This type of switching is used on a switch-based
    network and involves injecting an ARP, or Address Resolution Packet, into the
    target network. This packet will flood the switch’s CAM, or Content Addressable
    Memory, table. This table is used to track the connection between a host and a
    port.


    The following techniques are used for active sniffing:


    +   - DHCP attacks

    - MAC flooding

    - ARP poisoning

    - Spoofing attacks

    - DNS poisoning


    # Protocols Affected Due to Sniffing


    Most protocols, including the TCP/IP, were never designed securely. Therefore,
    they can be used by a hacker, ethical or malicious, to enter the network. These
    protocols are easy to attack using a sniffer.


    # HTTP


    The HTTP protocol is used to send information across the network from one system
    to the other without encrypting the data. This makes this protocol an easy target.


    # SMTP


    SMTP, or Simple Mail Transfer Protocol, is used to transfer data by emails. It
    protects the data by encrypting it but does not protect the data from sniffing
    tools.


    # NNTP


    NNTP, or Network News Transfer Protocol, is used for any communication taking
    place across the Internet. The main issue with this protocol is that all the data
    (including passwords) are shared as clear text across the Internet.


    # POP'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'POP, or Post Office Protocol, is only used to receive emails. It doesn’tnprovide
    any protection against sniffing. Therefore, it can be trapped.


    # FTP


    FTP, or File Transfer Protocol, is only used to send and receive any folders or

    files across a network. It does not protect the data, so the information can be

    stolen by a hacker.


    # IMAP


    IMAP, or Internet Message Access Protocol, is like the SMTP in the way it

    functions. It is vulnerable to sniffing.


    # Telnet


    Telnet is a protocol that sends all the information across the network in clear

    text. This information includes usernames, keystrokes and passwords.

    Therefore, it can be sniffed easily.


    A sniffer is not a tool that is only used to view live traffic; it can also be
    used

    to analyze the data in each packet, save the information and review it

    henever necessary.


    # Hardware Protocol Analyzers


    Before we understand more about sniffers, it’s important that we look at

    hardware protocol analyzers. An analyzer is plugged into the hardware and\used
    to access the network. By utilizing an analyzer, one can obtain

    information about the traffic in a network and can also monitor that traffic.


    Hardware protocol analyzers are used for the following purposes:


    +   * To identify or monitor any malicious traffic in the network (done

    using a hacking software that is present in the target system)

    * To capture packets of data, decode those packets and analyze the

    contents based on some rules

    * To allow a malicious hacker to look at individual data bytes of

    the packets of data passing through the network


    A hardware device isn’t accessible to most hackers of any kind, since they'
  merge: -1
