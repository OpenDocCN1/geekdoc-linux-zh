  md: '# Chapter 14


    # DNS Poisoning


    With DNS poisoning, the attacker can trick the server into believing that the
    network has received authentic information from the network even though it hasn''t.
    This will result in the substitution of the false IP address for every website,
    allowing the attacker to change the IP address for a target website on a server
    with the IP address of another server control. The attacker will then need to
    create a DNS entry that is fake and has some malicious content.


    For example, a user may use www.google.com in the browser, but he could be sent
    to a website other than Google. In other words, DNS poisoning will always redirect
    a user to a fake page that''s managed by an attacker.


    # DNS Poisoning


    This section will detail the process of DNS poisoning. For this process, we will
    use the sniffing tool Ettercap. DNS poisoning is ARP poisoning, and to start the
    former, you will need to begin the latter. To do this, follow the steps laid out
    in the previous chapter. Ettercap has a plugin called DNS spoof, which we will
    use in this exercise.


    # Step One


    You should open the terminal and type the following: ‘nano etter.dns’. All the
    DNS addresses that are used by Ettercap are present in this file. This file is
    used to resolve every domain name address. For the purpose of this exercise, we
    will include a fake entry named “Facebook” to this file. If any person chooses
    to open Facebook, he will be routed to a different website.


    ```

    root:~# locate etter.dns

    /etc/ettercap/etter.dns

    root:~# nano /etc/ettercap/etter.dns

    ```


    # Step Two'
