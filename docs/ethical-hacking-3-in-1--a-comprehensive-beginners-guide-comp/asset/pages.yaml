  md: '# Keyloggers


    Keylogging is a process through which keystrokes of a user or system administrator
    are logged while they are using a system. There are several third party keylogging
    applications available, most of which brag about their ability to go undetected.
    While this is true, the installation of a keylogger on a system requires it to
    have some applications to attach a listening device physically to it. The third-party
    applications do not account for the virus scanners or intrusion detection systems
    on the target system while making their claims. There is an in-built tool in Metasploit
    known as the keyscan. If an ethical hacker has managed to establish a session
    with the target system, then the commands to use the keyscan tool are simple.


    +   1. Keyscan_start

    2. Keyscan_dump

    3. Keyscan_dump (repeat as necessary)

    4. Keyscan_stop


    We hope this chapter has served as an introduction to the stage of maintaining
    access. This is still a very small portion of a universe full of malware. The
    development of malware can send a researcher to the darkest corners of the Internet,
    but also help an ethical hacker to a secure environment for computer systems throughout
    the world. When you create Trojans and backdoors using the Metasploit framework,
    you understand the thought process of malicious attackers because the want of
    the job as an ethical hacker is that you and the malicious attacker think alike.'
  merge: -1
  pgno: 392
- img_proc: true
  md: '# Chapter Eight


    # Reporting


    Technical expertise is very important for conducting a penetration test as it
    gets you the desired results to validate the security settings of an organization’s
    digital infrastructure. The senior management of the organization is the authority
    that hires a team of ethical hackers to conduct penetration testing and pays them
    for their assessment. At the end of the penetration testing activity, it is expected
    that this management would want to see a report of the entire activity. Similarly,
    the technical heads of departments in the organization will want to understand
    vulnerabilities discovered in the systems administered by them or the software
    developed by them so that they can make the necessary corrections if needed. This
    makes Reporting a very important stage of the penetration testing lifecycle. The
    test reported is divided into a few sections, and we will discuss them in this
    chapter.


    Let us go through the various sections of a penetration test report one by one.


    # The Penetration Test Report


    Executive Summary


    The highlights of the penetration testing activity are mentioned in the executive
    summary section of the penetration test report. It provides an overview of the
    assessment. This mainly includes details such as


    +   - The location of the test

    - If the test was remote or local

    - Details of the members of the ethical hacking team

    - Advanced description of the security settings of the information systems and
    the vulnerabilities discovered


    This section also serves as a good place to suggest data through visual'
  merge: -1
  pgno: 393
- img_proc: true
  md: 'representation, such as graphs and pie charts that show all the exploits that
    were executed on the target system. You should limit this section to three paragraphs.
    This section goes at the beginning of the report but is mostly composed after
    all the other sections of the penetration test report have been completed.


    # Engagement Procedure


    This section will contain the engagements of the ethical hacking team along with
    the limits encountered and the various other processes. The section will describe
    the various types of tests that were conducted on the target system. It will have
    answers to questions such as “Was social engineering a part of the test?” “Was
    there a Denial of Service DoS attack conducted?” etc. The section will let everyone
    know of the various attack surfaces and where on those surfaces, vulnerabilities
    were discovered. For example, an ethical hacker conducted a test from a remote
    location on a web application via the Internet, or a wireless attack was conducted
    by getting inside the range of an organization’s wireless network.


    # Target Architecture


    This section is optional and includes information about the target’s infrastructure,
    such as their hardware, operating systems, services offered by the systems, open
    ports, etc. If there were network maps developed by the ethical hacking team during
    the penetration test, this section is a good place to put it.


    # Findings


    All the vulnerabilities discovered during the penetration test are listed in this
    section. It is important to categorize these depending on the systems where they
    were identified so that the respective teams have the information required to
    correct the flaws. If it is possible, the security issues should be associated
    with regulatory compliance, as that will help to trace the costs to a source of
    funding. This section will also give the system owners an estimate of the costs
    involved in patching the weaknesses.


    # Recommended Actions


    This section defines the corrective actions to be taken for each vulnerability
    that has been discovered. This can be a section of its own with a description
    of every vulnerability, followed by the recommendation on how to fix it. The'
  merge: -1
  pgno: 394
- img_proc: true
  md: 'corrective action should not define the exact technical fix but should be a
    generic fix so that the system owners can figure out the exact fix on their own.
    For instance, a finding of a default password should have a recommendation that
    enforces a strong password policy for the employees.


    # # Conclusion


    This section will summarize the vulnerabilities and the corrective actions proposed
    in a few lines. You can also put down critical findings in this section that system
    owners can pay extra attention to them.


    # # Appendices


    This section will cover all the information that supports the report and is information
    that cannot be part of the main body. This will include raw test data, information
    about the ethical hacking team, glossary, definitions, list of acronyms, and professional
    biographies of every individual ethical hacker on the team.


    # # Presentation


    Most management would want a briefing of the outcomes of the penetration activity
    to be presented in a formal or semi-formal manner. This could also contain a presentation
    slideshow that will accompany the ethical hacker giving the briefing. If an out
    brief is required, it should be conducted professionally. As an ethical hacker
    who is aware of all the weaknesses in the infrastructure, you should avoid attacking
    the owners of those systems during your presentation. You should not target associates
    from the system administration or software engineering team, as they will be the
    ones calling on you for recurring tests on their infrastructure. It is therefore
    important to maintain a good relationship with all of them. Instead, you can present
    facts and numbers that will replace any emotions and will not accuse anyone. In
    short, just talk about the shortcomings of the system and ways to fix them efficiently.


    Other times, the management may not want a presentation and will simply expect
    the report to be delivered to. In such a case, ensure that the report is correct,
    printed properly, and presentable to the management. Copies of the report, both
    soft and hard, may be requested at times. A count should be maintained for all
    the copies that have been created, and it should be'
  merge: -1
  pgno: 395
- img_proc: true
  md: 'documented as to who all have a copy of the report. A penetration test report
    has a lot of information that could be catastrophic if it got into the wrong hands.
    Therefore, the accountability of every copy of the report should be maintained.


    # Storage of Report and Evidence


    Certain organizations will want the ethical hacking team to maintain a copy of
    the report of the penetration testing activity. If this is the case, the ethical
    hacking team needs to take special care while preserving the report. The minimum
    expectation would be to protect the report with some kind of encryption, and it
    would be even better if the encrypted file were stored in an offline location
    to add another level of security.


    Some other organizations may request the deletion of the report. An ethical team
    should do this after consulting a legal team, as there are legal consequences
    that could befall an ethical hacking team based on things that were missed or
    not covered in the penetration testing report. If the legal counsel specifies
    that report deletion is acceptable, ensure that the disk that had the report was
    formatted multiple times and overwritten with other data. It is also a good practice
    to have at least two people verify the deletion of data and is known as two-people
    integrity.


    Conducting a penetration test on a system can be very beneficial and will help
    the system owners to produce a better quality of systems and software. It is important
    to route the findings and the report to the correct people. The result of reporting
    must be a report that documents the vulnerabilities and corrective measures in
    a way that will help system owners take action in a way that will make the entire
    organization more secure.'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# # Chapter Nine


    # ## Email Hacking


    Email Hacking is not a big part of the ethical hacking domain, but it is the most
    common time of hacking that common people fall prey to daily. Email hacking is
    mostly executed by black-hat hackers, but as a white-hat hacker or an ethical
    hacker, knowledge about email hacking will help you educate the employees of an
    organization on how to take precautions against email hacking. we thought it is
    very important to include a chapter on Email Hacking in this course so that you
    gain sufficient knowledge about it. Our motive with this book is to cover all
    categories of hacking.


    ### How does Email work?


    Email servers control the sending and receiving of emails. An email service provider
    will do several configurations on the server before they make the server live
    for people to create accounts, sign in their accounts, and begin to send and receive
    emails. Once the email service provider is satisfied with the settings on their
    server, they release the server in a live environment for people to register on
    their service. Once a user has created a fully functional email account with their
    details, they can connect with other users all over the globe.


    ### How does Email work technically?


    Let us say that we have two providers, serverone.com and usertwo.com, and there
    is a user called username on serverone.com and usertwo on servertwo.com. Let us
    say that username@serverone.com logs into their email account and composes a mail
    to usertwo@servertwo.com and hits the send button, and within a minute, the email
    is received by usertwo@servertwo.com in their email inbox.


    But what has happened technically behind the scenes? Is it that simple? When user
    sends an email to usertwo, serverone.com looks up for server2.com on the Internet
    using the Domain Name System or DNS and establishes a connection with usertwo.com
    and tells'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'it about the email for usertwo@sertwo.com. This is when servertwo.com looks
    up for usertwo in its domain, and if usertwo exists, it further delivers the email
    in the inbox of usertwo@sertwo.com.


    After this, when usertwo sits on their computer and logs in to their email account,
    they find the email from userone@serverone.com lying in their inbox.


    There are email service providers who set up email servers to provide an email
    service to users. For example, companies like Google, Hotmail, Yahoo, are the
    biggest email providers in the world today. They have set up data centers with
    their email servers to support the massive amount of email traffic that passes
    through their infrastructure every day.


    However, an email server has custom developed or open-source email software that
    runs on it and makes sending and receiving of emails possible. You can convert
    your personal computer into an email server by using software like HMail Server,
    Post Cast Server, Surge Mail.


    H Server is an email server developed for a system running Windows as its operating
    system. It allows you to manage an email service all by yourself without relying
    on a third-party email service provider. Additionally, HMail also has features
    for spam control so that you do not have to worry about receiving spam emails.


    # Email Service Protocols


    # SMTP


    SMTP or Simple Mail Transfer Protocol is an email protocol that is used when an
    email is sent out using an email client as Microsoft Outlook or Mozilla Thunderbird.
    SMTP comes into the picture when a user wants to send out an email to another
    user. SMTP works on port number 25 or 587 and port number 465 with SSL.


    # POP3


    POP3 or Post Office Protocol allows a user to download emails from an email server
    onto their local email client on their computer. This is a simple protocol that
    is only used for downloading emails. Users usually use the POP3 protocol when
    they have limited disk space on their email server'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'provided by their email provider and want to keep it free for newer emails.
    Therefore, they use POP3 to download the emails from their email server to their
    local machines at regular intervals so that the disk on the email server can be
    free. POP3 protocol uses port number 110 without SSL and port number 995 with
    SSL.


    # IMAP


    IMAP or Internet Message Access Protocol is a feature much like POP3 used to retrieve
    emails from the email server to a local email client. However, it differs from
    POP3 in the sense that IMAP keeps the emails between the email server and email
    client synchronized. While using the IMAP protocol, the emails in the email account
    on the email server and those on the email client are mirror copies of each other.
    This means that any action executed by the user on the server will be reflected
    in the email client and vice versa. IMAP protocol uses port number 142 without
    SSL and port number 993 with SSL.


    # Email Security


    Email is one of the fastest means of communication in the world today, but how
    secure is it? Attackers have a bunch of attacks that can be applied via emails.
    Attackers have mastered every trick possible to be used with email as a medium
    and target innocent people who are unserving of such attacks and fall prey to
    their traps. It is important to educate employees of an organization not to become
    easy targets to email attacks. The security of an organization also depends on
    its weakest link, and sometimes an unaware employee can become the weakest link
    to the organization’s security.


    Sometimes people feel that it is all right for their email to get hacked because
    it does not contain any critical information. This attitude needs to change because
    an email, when hacked, can be used by the hacker to send out misleading emails
    to all your contacts in your email account. The recipients will believe that the
    email is from you and end disclosing information to the hacker that should have
    been private between you and contacts. Often, hackers hack email IDs, not for
    the data, but to steal an identity to use further for malicious activities. You
    may have heard about email cases where a person receives an email with a link
    from their friend’s email ID, and they are redirected to the attacker’s website
    and end downloading malware from there.'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# Email Spoofing


    Email Spoofing, as discussed earlier, is the manipulation of an email header to
    make the email look like it came from an authentic source even when it came from
    a malicious source. Spammers usually employ email spoofing to get unsuspecting
    recipients to open their emails and even reply to their solicitations. The most
    dangerous part about spoofing is that there are legitimate ways available to spoof
    an email. Using a FROM for which you don''t even know the password. The Internet
    is a vulnerable place, and it is indeed possible to send a threatening or a malicious
    email to someone spoofing an email ID that does not even belong to you.


    # Email Spoofing Methods


    There are many methods to spoof emails, but let us discuss the two most used methods.


    # Open Relay Server


    An Open Relay Server is a server with a way with Simple Mail Transfer Protocol
    running on it and is configured in a way that anyone can send an email without
    necessarily being a user that exists on it. This means that unknown users can
    also send emails through it. An attacker can connect on an open relay server using
    telnet and type in a set of instructions to send an email through it. There is
    no password authentication required to send an email through an open relay server.


    # Email Scripts


    The second most popular way of spoofing emails is via email scripts. Email scripts
    were originally developed to send genuine emails, but attackers soon realized
    that an email script does not require password authentication, it could be used
    for email spoofing as well. An attacker just to procure a web-hosting service
    from a hosting provider and set up an email script to modify the email headers
    as per their requirement. Many hosting providers have realized that this may result
    in an unclean reputation for their server and have started putting restrictions
    on their hosting servers that the FROM address in the mail script needs to match
    the domain name of the web hosting package and cannot be any other domain name.


    Let us look at an example of a PHP mail sending script.'
  merge: -1
  pgno: 400
- img_proc: true
  md: "```\n<?\n$mailto=\"some-name@yourdomain.com\";\n\n$pcount=0;\n\n$gcount=0;\n\
    \n$subject = \"Mail from Enquiry Form\";\n\n$from=\"some-name@abc.com\";\n\nwhile\
    \ (list($key,$val)=each ($_POST)) {\n    $pstr = $pstr.\"$key :$val \\n \\n  \
    \  ++$pcount;\n}\n\nwhile (list($key,$val)=each ($_GET)) {\n    $gstr = $gstr.\"\
    $key :$val \\n \\n    ++$gcount;\n}\n\nif ($pcount > $gcount) {\n```"
  merge: -1
  pgno: 401
- img_proc: true
  md: '```

    $message_body=$pstr;


    mail($mailto,$subject,$message_body,"From:".$from);


    echo "Mail has been sent";


    }


    else

    {


    $message_body=$gstr;


    mail($mailto,$subject,$message_body,"From:".$from);


    echo "Mail has been sent";

    }

    ?>

    ```


    If you look at this PHP mail script, you will see that it has the following parameters
    that essentially are the most important parts in an email header.


    +   - mailto

    - from

    - subject

    - message_body


    An attacker can simply host this script on a web-hosting server as a PHP file
    and replaces these parameters with the parameter of their choice to send emails.
    To give you an idea, they can use the from parameter of the header info@amazon.com,
    and the recipient will believe that they have received a genuine email from amazon.com.'
