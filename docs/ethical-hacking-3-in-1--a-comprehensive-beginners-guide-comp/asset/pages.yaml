- img_proc: true
  md: 'capability to it. When you run any script, you’ll need to declare some variables
    to hold information. The variables in Perl are the same as those in Linux, so
    you should declare them in the same way as you would in Linux, and that is with
    a “$” symbol before the label.


    Enter the following code into the text editor:


    ```

    #!/usr/bin/perl

    ```


    Print “Welcome back, user!\n";


    Print “Which website do you want to use to hack?\n";


    $name = <STDIN>;


    Chomp name;


    Print “Thank you, $name is one of the websites I use too!\n";


    Let’s examine each line in the script:


    +   The first line will indicate to the system that it should use a specific script
    interpreter while it’s executing a script.


    +   The second line will print a statement on the screen.


    +   The third line will print the statement on the screen.


    +   The fourth line will allow the user to enter a variable.


    +   In the fifth line of the code, the chomp function will remove potential new
    line characters that the user may have entered when it answers the questions.


    +   The last line of the code will print your response with the user’s inputs.


    # Step 6


    You should now save this new script and change its permission as you did for the
    previous scripts. Finally, execute the script by running the following code: ./secondperlscript.'
