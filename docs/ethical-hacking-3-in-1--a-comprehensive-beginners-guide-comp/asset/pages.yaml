  md: '# Introduction


    Hacking, ethical or otherwise, sounds as a complex process where you have to learn
    every code there is in the world. To a person who is new to hacking, you might
    feel that you need a lot of prerequisite knowledge on hacking software, programming
    languages, algorithms and syntaxes, and a lot of other complex elements that only
    geniuses can decipher. However, you may not need to be of or know all to some
    extent. This book introduces simple steps and tricks to complete an ethical hack,
    also called penetration testing.


    You do not need prior hacking knowledge to decipher the skills taught in this
    book. In it, you will learn how to use modern hacking tools and interpret the
    results of these tools, including Backtrack Linux, Nmap, MetaGoofil, dig, Nessus,
    Google, Reconnaissance, Metasploit, Netcat, and Hacker Defender rootkit. You will
    learn how to use these tools to unearth offensive security systems.


    While with no prior knowledge might find this book a challenge at first, the steps
    explained in this book are simple, and they target beginners. The aim of writing
    this book is to teach beginners simple steps and tricks to execute an ethical
    hack. The book looks at the basics of hacking allowing you to break into weak
    security systems. You will not only learn what ethical hacking involves but also
    how to perform penetration testing with ease.


    An ethical hacker helps point out loopholes in the security system of computers.
    Unlike black and gray hat hacking, an ethical hacker only seeks to gain access
    to security systems so they can point out where problems lie. In short, ethical
    hacking prevents the black and gray hat hackers. This book comes as a result of
    years of experience performing penetration tests successfully.


    Happy reading!'
  merge: -1
  pgno: 187
