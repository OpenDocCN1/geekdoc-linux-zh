  md: '# Create a Directory


    Use the command `mkdir directoryname` as you would in Windows.


    # Change the Directories


    Use the `cd/pentest/enumeration` command as you would in Windows. However, while
    you would use \ in Windows, you would use / in Linux.


    # Create a Text File


    Use the command `touch hack.txt` to create a text file with the name hack.


    # Copy a File


    Use the command `cp /var/www/filename /pentest/web/filename` to copy a file from
    the /var/www directory to /pentest/web/directory.


    # Accessing the Current Working Directory


    Use the command `pwd` to open the current working directory.


    # Renaming a File


    On Linux, there is no specific command that lets you rename files. However, you
    can issue the `mv` command, mv oldfile.txt new.txt, to rename a file.


    # Move a File


    Use the command `mv hack.txt/pentest/enumeration/` to move the file hack.txt into
    the enumeration directory.


    # Removing a File


    Use the command `rm file name` – it works the same for all directories.


    # Locating Files Inside BackTrack


    If you need to locate files in BackTrack, you can use the locate command. Let’s
    say you need to access a tool, the Harvester. Use the command, `locate harvester.`


    # Accessing Text Editors on BackTrack'
