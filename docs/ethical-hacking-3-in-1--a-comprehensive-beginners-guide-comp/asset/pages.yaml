  md: '# # Chapter 19


    # ## TCP/IP Hijacking


    TCP/IP hijacking is a type of attack performed on the network connection used
    by the victim. In this attack, one user tries to access an unauthorized network
    connection. This is done to avoid password authentication. Let''s look at the
    basics of the TCP/IP connection:


    ![](img/d52d8402f5bef7b14bcbab9bcc53820f_110_0.png)


    One can hijack or attack this connection in one of two ways:


    +   - The hacker can look for a sequence and see if there''s a way to increase
    the count by one without giving the user a chance to predict it.

    - They can use a man-in-the-middle attack or a network sniffing attack. Ettercap
    or Wireshark can be used for the purpose of this attack.


    # ### Example


    A hacker will use TCP/IP hijacking to monitor the flow of data across the network
    and will obtain the IP addresses of the devices that are part of the connection.
    Once the hacker obtains information about one of the systems in the network, he
    can attack the other system using a DoS attack. He can then continue to attack
    the target system using a spoof.'
  merge: -1
