- pgno: 71
  md: 'The process of converting assembly code into machine code is called *assembling*.
    A program which takes assembly language as input and produces machine language
    as output is called an *assembler*. It is similar to a compiler but it operates
    at a lower level.


    Conversely, the process of turning machine code into assembly language is called
    *unassembling*. A program which does this is called an *unassembler*.


    # ## 5.1 Assembling Simple Programs


    To tell the whole story of the machine code for the x86 processors involves a
    lot of tricky detail. However, it is quite easy to specify machine code for the
    subset of the x86 assembly language used in all the numbered programs used in
    sections 4.3 through 4.5. Coding for this portion of x86 assembly language is
    given in Table 5.1. Most of the machine code is given in hex, but some of the
    bytes have to be given in binary. The number of bytes varies from one to six.
    The first line of the table, for example, shows that the code for *MOV* reg,reg
    is a two-byte code, the first of which is given in hex and the second in binary.
    The bytes given in binary are those which incorporate register codes. S S S in
    the binary coding represents the three-bit code for the *source* register. D D
    D represents the three-bit code for the *destination* register. The register codes
    are given at the bottom. Each "imm" occurring in a command specifies four additional
    bytes, which must be supplied by the programmer. Examples follow. Using Table
    5.1, Program 5.1 can be machine assembled as follows:


    **Table 5.1. Some 32-Bit Machine Coding**


    | | First Byte | Second Byte | 4 More |

    |---|---|---|---|

    | MOV | reg,reg | 89 | 11 S S D D D | |

    | MOV | reg, imm | 1 0 1 1 D D D | | |

    | ADD | reg,reg | 01 | 1 1 S S D D D | |

    | ADD | reg, imm | 81 | 1 1 0 0 D D D [1] | |

    | SUB | reg,reg | 29 | 1 1 S S D D D | |

    | SUB | reg, imm | 81 | 1 1 1 0 1 D D D [1] | |

    | INC | reg | 0 1 0 0 D D D | | |

    | DEC | reg | 0 1 0 0 1 D D D | | |

    | IN | EAX, [DX] | ED | | |

    | OUT | [DX], EAX | EF | | |

    | RET | | C3 | | |

    | INP | imm | E9 | 84 | |

    | JZ | imm | 0F | 84 | |

    | JNZ | imm | 0F | 85 | |

    | JS | imm | 0F | 88 | |

    | JNS | imm | 0F | 89 | |


    [1] If reg is EAX, there is a shorter machine code.


    # ### 5.1.1 Register Codes


    The first byte of the first command, BA, is encoded using the 1011 1DDD code given
    for *MOV* reg,imm. The DDD bits are filled in with the register code 010 for DX,
    which results in a binary code of 1011 1010 or a hex code of BA.


    The second *MOV* command, *MOV* ECX, EAX is encoded as 89 C1 using the first line
    of the chart which specifies the second byte as 11 SSS DDD. EAX is the source
    register and its code is 000. ECX is the destination register and its code is
    001. The resulting second byte is 11 000 001, which is C1.


