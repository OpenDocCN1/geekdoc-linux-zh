    # **8.8 Object Files in ELF Format**


    Most programs are not written completely from scratch. They rely on programs which
    have already been written and are used over and over again, such as `printf()`
    . Files which need other code in order to run are called *object code files*.
    It is the job of the *linker* to combine object code from different files into
    an executable file. The code for `printf()` , for example, is located in `/lib/libc.so`.
    Typically the programmer creates one or two of these object code files using `gcc`
    or an assembler, and the rest are retrieved by the linker from standard libraries
    stored on the system. This process is not obvious from the command line since
    the linker is called by `gcc`.


    It is important to realize that the creation of an object code file is the main
    purpose of an assembler. In section 8 we shall discuss assembler commands for
    shaping object files will be discussed. But first, object code files themselves
    need to be described. Just as the format of an executable file is prescribed by
    ELF, so is the format of an object code file. Figure 8-10 shows the structure
    of an ELF object code file. The ELF Header in an object file is the same as the
    ELF header in an


