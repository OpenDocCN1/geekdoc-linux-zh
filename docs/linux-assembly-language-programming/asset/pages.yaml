    User programs which bypass one or more of these layers risk a loss in portability.
    A program which calls directly to the hardware may not run on a machine with different
    hardware. The strongest reason a software developer has for sacrificing portability
    is that bypassing software layers reduces execution time. Execution time is still
    a problem in connection with video processing. That is one reason that the video
    buffer became standardized. So much software wrote to it directly that moving
    it would have made the graphics hardware with the old video buffer missing difficult
    to sell.


    # **12.4.3 The Real Mode Interrupt Table**


    When an interrupt occurs, the interrupt number is used as an index into the interrupt
    table. The interrupt table contains the locations of all the service routines.
    The first entry in the table is for interrupt number 0, the second is for interrupt
    number 1, etc. The Linux interrupt table is described briefly in chapter 9, section
    9.2.1. The real mode interrupt table differs from the protected mode interrupt
    table used by Linux in several respects.


    ![](img/165a4f637c5eaccb372f5a82ca458a05_171_2.png)


    Every entry in the real mode interrupt table occupies four bytes. The first two
    bytes are a little endian offset value and the next two are a little endian segment
    value designation.'
