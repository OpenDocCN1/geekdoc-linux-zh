    | I | 9 | R | 90 | | |


    B + C = E

    K + L = N and

    T + U = W


    and all represent essentially the same basic fact. But this is only a problem
    when notations themselves are used to do calculations (as we do with pencil and
    paper). When calculations are done with physical tokens, such as beads on an abacus
    or with pebbles, this is no longer a problem. In fact, this kind of notation may
    have served to prevent reading errors. Anyone who has received $20.00 when cashing
    a $200.00 check will understand this point.


    But when the notations themselves are used to do the calculations, it is better
    to have a notational system which brings out such basic similarities as the following:


    2 + 3 = 5

    20 + 30 = 50

    200 + 300 = 500


    Placeholding systems do this. Placeholding numerals, sometimes less sympathetically
    referred to as "heathen cyphers," were popularized in Europe around the year 1200
    by Leonardo of Pisa, also known as Fibonacci. Fibonacci was presumably relying
    on a work written in Arabic by al-Khwārizmī (whose name we see in the word algorithm)
    around the year 820 in Baghdad. Like all European scholars of the day, Fibonacci
    was necessarily versed in Arabic.


    All the numeration systems discussed in this book, including the decimal system
    we use every day, are placeholding systems. Before proceeding to nondecimal systems,
    let us consider the role that base ten plays in the U.S. monetary system.


    # 2.1.1 Purely Decimal Money


    The current U.S. monetary system was adopted following the introduction of the
    metric system in France in the Revolution of 1789. The purpose of both of these
    extensions of the decimal system was to simplify calculations by bringing monetary
    and measurement units into harmony with the decimal system used to represent numbers.


    To bring the alignment of the monetary and numeral systems into sharp relief,
    let us imagine a pared down version of the U.S. monetary system that includes
    only pennies, dimes, $1 bills, $10 dollar bills, $100 dollar bills, $1000 dollar
    bills, and so on.


    1 dime = 10 pennies

    1 dollar bill = 10 dimes

    = 100 pennies

    1 ten dollar bill = 10 dollar bills

    = 100 dimes

    = 1000 pennies

    and so on


    In this purely decimal monetary system, each denomination except pennies is worth
    exactly ten times the next smaller unit. Denominations correspond to place values
    in the base ten numeration system, and vice versa. Pennies are ones, dimes are
    tens, dollars are hundreds, etc.


    To carry exact change for any possible transaction in this bare bones monetary
    system, one would need nine items of each denomination. For example, to make a
    purchase whose cost was $56.78, or 5,678 cents, would require 5 ten dollar bills,
    6 dollar bills, 7 dimes, and 8 pennies.


    If we actually used this system, our change purses would need to be bulkier than
    they are. The existence of'
