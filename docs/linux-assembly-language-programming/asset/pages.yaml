  md: 'Real mode allows the programmer to use physical memory addresses. Memory addresses
    specified in real mode are used on the address bus, just like I/O addresses. This
    gives the programmer unimpeded access to memory. In this section, as an exercise
    in the use of real mode addresses, we consider two areas of memory which are defined
    by fixed physical addresses: the video buffer and the keyboard buffer. The location
    of the video buffer is fixed in the hardware. But the keyboard buffer is only
    fixed by DOS, and hence it can be moved. Referring to Figure 12-1, programs which
    access these physical memory areas directly are definitely "rude" programs as
    opposed to "polite" programs.


    # Figure 12-1. Unprotected Operating System such as DOS


    ![](img/165a4f637c5eaccb372f5a82ca458a05_167_0.png)


    # 12.3.1 Video Buffer


    On standard PCs, there is a region of memory starting at the address B8000H called
    the video buffer. In the most commonly used video text mode, the video buffer
    holds the text information which is displayed on the screen. A very simple, but
    somewhat tedious, way to output information on a PC is to store ASCII codes in
    this buffer. (See Table 11.1.)


    The address B8000H is the actually address of the ASCII code for the character
    in the upper left-hand corner of the screen. See Figure 12-3. The next byte, which
    is at B8001H, contains the attribute information for this same character. Table
    12.2 shows how the eight bits of an attribute byte are used. B8002H is the ASCII
    code of the second character in the first row; B8003H is its attribute byte, and
    so on. The top row consists of 80 characters, or 160 bytes, since each character
    takes two bytes of storage. One screenful is 25 rows × 80 columns × 2 bytes per
    character = 4000 bytes. The buffer actually contains 4096 bytes = 1000H.


    # Figure 12-3. Upper Left at B8000 through Lower Right at B8F9E


    ![](img/165a4f637c5eaccb372f5a82ca458a05_167_1.png)'
