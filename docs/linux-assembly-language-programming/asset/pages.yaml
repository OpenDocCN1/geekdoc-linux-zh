    # 9.3 ISA Architecture


    The *ISA architecture* is essentially the architecture of the IBM AT computer.
    The AT is an 80286-based computer introduced in 1984. The name ISA, or *Industry
    Standard Architecture*, arose in reaction to the introduction by IBM of a new
    architecture called *MicroChannel* in their PS/2 computers. *MicroChannel* was
    intended to replace the very popular architecture of the AT. Many third parties
    manufactured cards which could be inserted into the expansion slots of an AT,
    or an AT clone. The reaction of these third parties to IBM''s new architecture,
    which would have made all their AT cards obsolete, was to band together and rename
    the AT architecture the Industry Standard Architecture. As a result, the lifespan
    of the AT architecture was given a considerable extension. Many important architectural
    features were standardized in the *ISA*, including


    +   - the interrupt controller circuit

    +   - many IRQ assignments

    +   - many I/O port assignments

    +   - the signals and connections made available to expansion cards

    +   - the physical connectors used on expansion cards


    Many of these features have been retained in all subsequent x86 computers.


    # 9.3.1 The 8259 Interrupt Controller


    The *ISA* interrupt controller circuit is based on the Intel 8259 PIC, or *programmable
    interrupt controller*. The 8259 is the interrupt controller circuit used in the
    original IBM PC. 8259s may be used either singly as in the PC or combined into
    a two-tiered structure with one *master* and anywhere from one to eight *slaves*,
    as shown in Figure 9-4. In the original PC there was a single 8259. A one master-one
    slave configuration became fixed as a part of the *ISA* architecture. The *ISA*
    interrupt controller circuit is shown in Figure 9-5. In this configuration there
    are 15 IRQ lines which feed into the two 8259 circuits.


    Figure 9-4. General 8259 Configuration


