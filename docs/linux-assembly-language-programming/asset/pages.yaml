    Because the stack pointer points to the last occupied location rather than the
    first unoccupied location of the stack, a *PUSH* must be carried out by subtracting
    from the stack pointer first and then transferring the bytes to the stack rather
    than the other way around. Having the stack pointer point to the first available
    location would be a reasonable policy if all pushes and pops were the same size.
    But since pushes and pops may be either two or four bytes, this is not a tenable
    policy.


    # 7.1.2 The POP Command


    The opposite operation is called a *pop*. Like the *PUSH* instruction, *POP* takes
    register and memory operands, which may be either two or four bytes. Unlike *PUSH*,
    it does not take immediate operands. As with pushes, the size of the operand determines
    the number of bytes to be popped. Since BX is a two-byte register, *POP* BX pops
    two bytes off the stack.


    ```

    POP BX

    ```


    is very similar to


    ```

    MOV BX, [ESP]

    ADD ESP, 2

    ```


