  md: '# **13.2.1 Protected Mode Memory Segments**


    The most important characteristics of a protected mode memory segment is its *base
    address* and its *limit*. See Figure 13-1 for an example of a 1 Meg segment situated
    at the halfway point of a 64 Meg memory. Suppose that the DS register contains
    a selector selecting a descriptor for this memory segment. Then the command


    ![](img/165a4f637c5eaccb372f5a82ca458a05_176_0.png)


    ```

    MOV  EAX,  [DS:80000H]

    ```


    would access the four bytes located at the addresses 2080000H through 2080003H.
    On the other hand, the command


    ```

    MOV  EAX,  [DS:180000H]

    ```


    would cause a general protection fault, a hardware exception which generates interrupt
    number 13. See chapter 9, section 9.4. This is because the all four offset addresses
    referenced by the command exceed the limit. For example,


    ```

    180003H > FFFFFH

    ```


    The command is trying to read from a location 1.5 Meg from the beginning of a
    segment which is only 1 Meg in length. Because the hardware enforces these segment
    boundaries, the segmentation system can be used to protect one task''s memory
    from another''s. It was used to protect kernel memory from user processes in versions
    of Linux before version 2.1.39, but is no longer used for memory protection in
    Linux. Segments in Linux now use a base address of 0 and a limit of FFFFFFFFH,
    i.e. all 4 Gig.


    A more complete list of the characteristics of a protected mode memory segment
    is as follows:


    +   1.  Base. This is the address of the first byte of the segment. It is the
    address corresponding to the offset of zero, [0]. In real mode, the base address
    is obtained by just appending a zero to the four hex digits stored in the segment
    register.


    +   2.  Limit. This is the last valid offset address. It is one less than the
    number of bytes in the segment. It is thanks to this parameter that segments are
    not necessarily 64K any more. The limit needed to specify a 1 Meg segment, for
    example, is FFFFFH.'
