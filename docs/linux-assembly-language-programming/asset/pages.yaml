- pgno: 102
  md: "![](img/165a4f637c5eaccb372f5a82ca458a05_102_0.png)\n\nPaging works by copying\
    \ temporarily idle portions of memory onto disk. As suggested by its name, it\
    \ works in units called *pages*.\n\n# 4K Pages\n\nOn an x86 machine, a page is\
    \ 4,096 bytes. In order to set up a paging system, four areas need to be divided\
    \ up into pages:\n\n+   1. The available physical memory is broken up into pages.\
    \ Since $4,096 = 2^{12} = 4K = 1000H$, every page starts at an address ending\
    \ in three hex zeros. Pages in physical memory are sometimes called *page frames*.\n\
    \n+   2. Each task's 4 Gig virtual address spaces is also divided into pages.\
    \ 4 Gig corresponds to 1 Meg of pages.\n+   $$4 \\mathrm{Gig} \\div 4 \\mathrm{K}\
    \ = \\left(4 \\times 2^{30}\\right) \\div \\left(4 \\times 2^{10}\\right) = 2^{32}\
    \ \\div 2^{12} = 2^{20} = 1 \\mathrm{Meg}.$$ \n+   Again, every page starts at\
    \ an address ending in three hex zeros.\n\n+   3. The portion of the hard disk\
    \ used for paging is also divided into pages. This portion is often called the\
    \ *swap space*. Since most disks are formatted into 512-byte sectors, this means\
    \ the number of sectors allocated to the swap space must be a multiple of eight.\
    \ $4,096 = 8 \\times 512$.\n\n+   4. The page tables used to translate virtual\
    \ addresses are themselves set up in units of pages. These tables are described\
    \ in section 8.3.1.\n\nNote that pages of virtual memory, physical memory, and\
    \ disk all have the same size. This facilitates data transfers in page size quantities.\n\
    \n# 8.2.2 Paging vs. Swapping\n\nThe term *swap space* is unfortunate since \"\
    swapping\" traditionally refers to copying entire processes to and from the disk.\
    \ When demand for memory on a multitasking system exceeds the available RAM, a\
    \ very simple solution to this problem is to just copy some process out to the\
    \ disk. That is what swapping does. Swapping does not increase memory efficiency.\
    \ It just prevents memory from overloading. It can be done by the operating system\
    \ on its own. It does not require any special hardware support. Swapping was common\
    \ in Unix systems before paging was invented. Linux does not use swapping and\
    \ never has.\n\nAlthough swapping solves the problem of memory unavailability,\
    \ it does not do very well in terms of making memory usage efficient. Copying\
    \ whole processes into and out of memory tends to fragment memory just as copying\
    \ files onto and off of a disk tends to fragment a disk. Furthermore, by creating\
    \ processes as wholes, it misses out on the possibility that by keeping just the\
    \ most important parts of each process in memory, it may be possible to run all\
    \ the processes without much ongoing disk access. Failing this, it may at least\
    \ be possible to greatly reduce the fraction of the processor's time which is\
    \ wasted in servicing memory faults.\n\n# Page Faults\n\nUsing paging, all the\
    \ processes are run as though they were all in memory simultaneously. When a machine\
    \ instruction is encountered which refers to a memory location actually on disk,\
    \ this is called a *page fault*."
