    The number of bits in a word is called the *word size*. The word size of the memory
    in Figure 2-1 is four bits. A computer with such a memory would be said to have
    *four-bit words*. Each word in this memory holds a number representable in four
    binary digits, i.e. a number from 0 through 15. So for example, a processor requesting
    the word located at the address 3 would be given the number 8. When designing
    a chess playing computer, for example, it might be a good idea to use 64-bit words,
    one bit for each location on the chess board.


    Words in computer memory are numbered consecutively, starting from zero. These
    numbers are called *addresses*. In Figure 2-1, the addresses are the integers
    from 0 through 5. A computer with $n$ words will have addresses from 0 through
    $n-1$. When requesting data transfers into or out from memory, computer processors
    use addresses to specify which data words are to be transferred.


    The total capacity of a computer memory is the number of words in the memory times
    the word size, length times width. The little memory in Figure 2-1 has a capacity
    of 24 bits. Memory capacity is often measured in *bytes* instead of bits. One
    byte of memory is the same as eight bits.


    Computers based on Intel processors use eight-bit words. A warning note is in
    order here. Because documentation from Intel and Microsoft use the term *word*
    to refer to a 16-bit object, this usage has become fairly standard. This is unfortunate.
    It is better to leave the term with its machine-dependent meaning. In any case,
    the number of bytes in the memory of an Intel-based machine is the same as the
    number of addresses.


    Because the number of words in a computer memory is typically a large power of
    two or a small multiple thereof, several names for these large powers of two have
    been adapted from the metric system. For example, $2^{10}$ is 1024 and 1024 is
    approximately 1000. In the metric system the letter K, from *kilo*, is used to
    stand for 1000. In reference to computer memory, kilo means 1024. Other metric
    prefixes which have been adapted are shown in the following table.


    | $2^{10}$ | 1,024 | K | kilo | thousand |

    |---|---|---|---|---|

    | $2^{20}$ | 1,048,576 | M | mega | million |

    | $2^{30}$ | 1,073,741,824 | G | giga | billion |

    | $2^{40}$ | 1,099,511,627,776 | T | tera | trillion |

    | | | | Large Powers of Two | |


    The use of the approximate equalities in this table makes possible simplified
    computations involving large'
