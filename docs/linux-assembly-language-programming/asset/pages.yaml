- pgno: 132
  md: 'As with the ADD commands, a memory operand can take the place of one register
    operand. Also like the ADD command, the two operands must have the same size.
    For example, suppose that the AL register contains 0F5H and BL contains 0C3H.
    Then the command


    ```

    AND AL, BL

    ```


    would store the result 0C1H into AL and leave BL unchanged.


    Except for the fact that they apply different operations, the OR and XOR commands
    are the same as the AND command. The NOT instruction takes only one operand, register
    or memory.


    Edlinas can be used to check the results of applying these commands. For example,


    ```

    MOV EAX, 0F5H

    MOV EBX, 0C3H

    AND AL, BL

    ```


    should result in the storage of 0C1H in AL.


    All these logic commands clear the overflow and carry flags. They set the sign
    flag if the most significant bit of the result is 1, and clear it otherwise. They
    set the zero flag if the result is 0 and clear it otherwise. The zero flag is
    often used to determine conditional jumps following logic commands.


    For example, we can use the AND command to determine whether a number stored in
    a register is even or odd. A number represented in binary is even when its least
    significant bit is zero. If we have a one-byte register, then the AND instruction
    can be applied to it, using the binary number 0000 0001 as the source operand.


    Then all the bits of the result will be 0, except possibly the least significant
    bit. This bit will be 0 if the number being tested is even.


    ```

    MOV BL, AL ;Prepare to test AL for evenness

    AND BL, 1 ;The zero flag is set if BL = 0

    JZ EVN ;Jump if AL is even.

    ```


    The TEST instruction is like the CMP instruction in that it sets flags without
    storing the result. CMP is an unstored SUB instruction. TEST is an unstored AND
    instruction. Using TEST, the three instructions used to test the evenness of AL
    can be shortened to just two.


    ```

    TEST AL, 1

    JZ EVN ; Jump if AL is even.

    ```


    # 10.3 Bit Setting and Testing


    One virtue of logic operations is that they give the programmer control over individual
    bits of memory or I/O registers.


    # 10.3.1 Turning the Speaker On and Off


    The system board speaker is another relatively fixed feature of the standard PC.
    Its audio signal comes from a 1.19318 MHz square wave. To get control over the
    speaker''s pitch, this signal is divided by the number stored in the two-byte
    register located at I/O address 42H. This register must be written to using two
    successive one-byte writes, most significant byte first. Whether the speaker is
    turned on or not is controlled by the bottom two bits of a very important one-byte
    register located at I/O address 61H. Some of the bits of this register indicate
    parity errors in memory. Reports of these errors cause the system to halt! Consequently,
    we don''t want to flip one of them illy or accidentally. The AND and OR instructions
    are perfectly suited for changing some bits and leaving the others alone. For
    example, to turn the speaker on, the following three commands are needed:'
