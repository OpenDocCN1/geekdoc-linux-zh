    # 3.9 Memory Circuits


    The latch circuit shown in Figure 3-7 has the property that if a logic 0 is applied
    to the Freeze/Copy# line, then the value on the Input propagates through to the
    Output. On the other hand, if a logic 1 is applied to the Freeze/Copy# line, then
    the Output signal is held to whatever value it had at the time of the "freeze."
    This value is in storage and the input is ignored.


    ![](img/165a4f637c5eaccb372f5a82ca458a05_44_0.png)


    To see how this circuit might serve as one bit of a memory circuit, imagine many
    of these circuits arranged in a rectangle, each row forming a word of memory.
    Each row would respond to a selection signal picking that row out from all the
    other rows in memory. The memory would be required to remain dormant whenever
    the selection signal was not present. To use this circuit as one bit of a memory,
    let us suppose we have a W/R# control signal and a selection signal, Sel. W stands
    for write, which means that the processor wants to write to the memory circuit.
    R stands for read and means that the processor wants to read from the memory circuit.
    All the circuits in the entire memory will be connected to the same W/R# signal,
    but only the circuits in the same word are connected to a single Sel signal.'
