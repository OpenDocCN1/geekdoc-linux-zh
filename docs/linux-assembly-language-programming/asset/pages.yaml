    # 2.2.1 Native Addition


    Using the native arithmetic, however, is easier than this, especially when the
    numbers get larger. About all that''s necessary to remember is that five of any
    one unit must be carried by converting it to one of the next larger unit:


    ![](img/165a4f637c5eaccb372f5a82ca458a05_13_0.png)


    The ones (or pennies) column totals seven, which is 12, which is 2 carry 1:


    ![](img/165a4f637c5eaccb372f5a82ca458a05_13_1.png)


    1 + 2 + 3 is six, which is 11, which is 1 carry 1:


    ![](img/165a4f637c5eaccb372f5a82ca458a05_13_2.png)


    And 1 + 4 + 3 is eight, which is 13, which is 3 carry 1:


    ![](img/165a4f637c5eaccb372f5a82ca458a05_13_3.png)


    Clearly, the native arithmetic is easier once we understand it.


