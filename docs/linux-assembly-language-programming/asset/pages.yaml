  md: '# 8.7.1 The ELF Header


    The ELF header identifies the file as an ELF file and specifies what kind of ELF
    file it is. It also specifies the size and location of the program header table
    and the section header table.


    +   - The first entry is an identifier string containing ELF.


    +   - The second entry is a number which is 1 if the file is an object file, 2
    if the file is an executable file, 3 if the file is a shared object file, and
    4 if it is a core file. Shared object files are discussed in chapter 11. Core
    files are produced whenever a program crashes. They are created for debugging
    purposes.


    +   - The third entry number specifies the machine architecture. The number 3
    stands for the x86 architecture.


    +   - There are 11 more entries in the ELF header file, including entries for
    the size and location of the program header table and the section header table.


    # 8.7.2 The Program Header Table


    The program header table has one entry for each segment. Each entry in the program
    header table contains eight items of information:


    +   1. Type. The type is 1 if the segment is to be loaded when the file is executed.
    Other types are not loaded into memory.


    +   2. File Offset. This offset gives the location of the segment within the file.
    Like all offsets, it is the number of bytes from the beginning.


    +   3. Virtual Address. This is the address where the first byte of the segment
    is to be loaded.


    +   4. Physical Address. For x86 Linux systems this entry is a misnomer. It is
    ignored.


    +   5. File Size. This is the number of bytes in the segment before it is loaded.


    +   6. Memory Size. This is the number of bytes in the segment after it is loaded.


    +   7. Permissions. This code contains the read-write-execute permissions.


    +   8. Alignment. The segment must begin on a multiple of this entry.


    As an example, Table 8.1 lists the Program Header table for *chmod*. Like most
    Unix commands, the *chmod* command is actually an executable file. On most systems
    it is located in */bin*. Table 8.1 was produced by running the *ob* program on
    this file.


    # 8.7.3 ELF Segments


    In Linux 2.0 an executable file typically has five segments. Segment 0 is always
    the Program Header table. Note that in *Table 8.1* the value of the *Type* field
    for Segment 0 is 6 for *program header*.


    Segments have *read-write-execute* permissions associated with them, just as files
    in Unix do. The seventh item in each entry of the Program Header table is the
    permission code for that entry. It is easily understood when written as a binary
    number. For example, a permission code of 6 means permission to read and write
    but not to execute.


    # Table 8.1. Program Header Table for *chmod*'
