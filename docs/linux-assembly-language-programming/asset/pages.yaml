    # 11.1.2 Bad Old Files


    The fact that information is handled using absolute addresses, one sector at a
    time, stands out in our programming of the floppy drive. Space on the disk is
    used in chunks of 512 bytes. It would be very natural then if all 1.4 MB floppy
    disk files had lengths which were multiples of 512 bytes and were referenced using
    the absolute addresses of the sectors which they occupied. It would also be natural
    to store the information about which sectors were occupied into the "file," along
    with the rest of the information. This kind of information constituted what was
    called a *file control block*. In Unix this kind of information is held by the
    system in special system memory areas called *inodes* and is not integrated with
    the data in the file.


    When this kind of information is included as a part of the data, elementary operations
    such as copying a file from one device to another become problematic. File copying
    programs become device-specific just as programs to convert wordprocessor documents
    are software package-specific. Copying a file can easily change its length, for
    example. Residual problems of exactly this nature exist in connection with *text
    files* in C, where line boundaries may be marked either by system information—the
    device holding the file may have an intrinsic line structure—or by end of line
    characters, in which are internal to the data file. Copying text files in C is
    not guaranteed to preserve length. One reason that the C preprocessor concatenates
    strings is so that intrinsic end of line boundaries can be overcome. *The Standard
    C Library* by Jim Plauger, its title notwithstanding, contains some fascinating
    historical asides on these issues.


    The point here is that these "bad old files" are shaped by the devices on which
    they are stored. A device-independent file, on the other hand bears, no imprint
    of the device on which it is stored. A device-independent file can be copied from
    one device to another without undergoing change. Device-independent files originated
    in the Multics operating system, the immediate predecessor of Unix.


    # 11.1.3 * Direct Memory Access


    The reader interested in getting on to device drivers may skip ahead to section
    11.2. The reader curious about what keeps the floppy drive, or other peripherals
    for that matter, from interrupting the processor after every fetched byte should
    read the next two paragraphs.


    In addition to the IRQ line, the 8272 also has an output line called *DMARQ, for
    DMA request*. DMA stands for *direct memory access*. Instead of using the IRQ
    line, the 8272 may be programmed to use the DMARQ line instead. The DMARQ line
    runs from the 8272 to a processor called a *DMA controller* which is equipped
    to issue, bus control signals and thus initiate Memory Write bus cycles. It can
    therefore relieve the CPU of the task of transferring bytes one at a time from
    the floppy drive into memory. In order that the use of the bus cycle machinery
    by the DMA controller not interfere with the CPU, which is constantly using the
    buses to fetch instructions, there is a *HOLD* line running from the DMA controller
    to the CPU and a *HOLDA* (hold acknowledge) line running from the CPU to the DMA
    controller. To use the buses, the DMA controller must ask for permission using
    the HOLD line and receive it on the HOLDA line. Incidentally, the processor may
    instruct the CPU to withhold permission by using the "no DMA"'
