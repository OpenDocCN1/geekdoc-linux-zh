  md: '![](img/165a4f637c5eaccb372f5a82ca458a05_182_0.png)


    Reviewing briefly, the operating system protects the memory belonging to one task
    from access by another task by using local descriptor tables. A new task would
    receive a local descriptor table containing descriptors of all the segments to
    which that task is allowed access. So long as the operating system did not put
    the same descriptor in the local table belonging to some other task, that segment
    would then be private. A task can only access a segment if a descriptor for that
    segment is in the global table or its own local table.


    This system of protection is incomplete, however. Locking the front door to your
    house doesn''t lock the house if the back door is unlocked. Since all tasks can
    access the global table, there must be something to prevent a rogue task from
    reading the descriptors defining the local descriptor tables belonging to other
    tasks.


    Consider this code:


