    | 0010 | 2 | 2 |

    | 0011 | 3 | 3 |

    | 0100 | 4 | 4 |

    | 0101 | 5 | 5 |

    | 0110 | 6 | 6 |

    | 0111 | 7 | 7 |

    | 1000 | 8 | 8 |

    | 1001 | 9 | 9 |

    | 1010 | A | 10 |

    | 1011 | B | 11 |

    | 1100 | C | 12 |

    | 1101 | D | 13 |

    | 1110 | E | 14 |

    | 1111 | F | 15 |


    Suppose you had to read one of these to a hardware support person over the phone,
    or copy it onto a postcard. Is there any doubt that using hex would be easier
    and less liable to error?


    Computer programs originally consisted of line after line of binary code. There
    is a bittersweet irony here. Filling out coding sheets with zeros and ones was
    a job typically done by women. As a result, many women got in on the very beginning
    of the computer programming field.


    # 2.6.4 Why not Octal?


    Octal numbers can be converted back and forth from binary in the same way as hex
    numbers, merely grouping by threes instead of fours. Octal also has the advantage
    over hex in that no alphabetic numerals are needed. However, the increasingly
    widespread use of the byte as the fundamental unit of memory has led to a decrease
    in the importance of octal.


    # 2.7 Base Distinguishing Notations


    Since all the digits in decimal are valid in hexadecimal, it is not possible to
    determine without additional information whether numeration, such as "50", is
    intended as decimal or hex. A common convention for indicating hexadecimal is
    the use of an appended H. When this convention is used, ''50'' just means fifty;
    but ''50H'' means fifty in hex, i.e., eighty. Occasionally, particularly with
    assemblers, B and D are appended to indicate binary and decimal. Appending O for
    octal would obviously not be a good idea. In the C language, octal is indicated
    by prepending a 0 and hexadecimal is indicated by prepending a 0x. This book places
    primary reliance on decimal, hexadecimal, and binary numeration. To distinguish
    these bases, the following conventions will be used:


    +   * Hexadecimal, except in C programs, will always be indicated by an appended
    H. (In addition, because of a problem discussed in section 3.11, hex numeration
    used in the assembly language will also have a prepended 0.)

    +   * Binary will be indicated by grouping digits into clumps of four, separated
    by spaces.

    +   * Base ten numeration is the default. It is assumed for all numeration whose
    base is not otherwise indicated.


