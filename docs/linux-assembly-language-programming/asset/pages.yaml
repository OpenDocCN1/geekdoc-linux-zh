    \ methods. Consider the conversion of 207 into base five. To understand this conversion,\
    \ it may help to look at the answer before we start:\n\n1312 = 1·5³ + 3·5² + 1·5¹\
    \ + 2·5⁰\n\nWe can see that 5 can be factored out of this sum, except for the\
    \ 2 at the end:\n\n1312 = (1·5² + 3·5¹ + 1·5⁰)·5 + 2\n\nBut this just says what\
    \ the quotient and remainder of 207 divided by 5 are. Notice that the remainder\
    \ is our units digit. Furthermore, we can calculate this quotient and remainder\
    \ using base ten, which is what we have available when we start this conversion:\n\
