    # ## 9.4 Internal and Software Interrupts


    Interrupts which do not arise as the result of an external signal on an interrupt
    pin also exist.


    # ### 9.4.1 Exceptions


    Suppose that the fetch-execute cycle encounters the machine code F0FH. This machine
    code is not defined. Suppose a *MOV* instruction attempts to access a memory address
    to which the operating system has not given permission. Suppose that the *DIV*
    command produces a quotient which is too big for the destination register. Suppose
    that the stack overflows. These are situations where the designers of the x86
    preferred to delegate to the operating system the decision as to what action should
    be taken. In fact, they forced the operating system to take over at these points
    by assigning interrupt numbers to these *exceptions*. These interrupt numbers
    are built into the x86 processors. Exceptions do not use interrupt acknowledge
    bus cycles. But they must be handled by numbered ISRs, just as external interrupts
    are.


