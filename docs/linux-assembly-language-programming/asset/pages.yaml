    \ which colors the screen yellow on blue by writing to all the attribute bytes\
    \ in the video buffer. It begins at FFFH and counts down by twos.\n\n# 12.3.2\
    \ Keyboard Buffer\n\nWhen a key is either pressed or released, an interrupt is\
    \ generated. On an ISA machine this interrupt is allotted, IRQ #1, which in turn\
    \ is reported by the interrupt controller as interrupt number 9. (See Table 9.3.)\n\
    \nThe DOS interrupt service routine 9 interrogates the keyboard at I/O port 64H\
    \ and deposits characters it receives from there in a tiny buffer located at 41EH.\
    \ The\n\ncharacters come in from the keyboard as scan codes. The ISR converts\
    \ each scan code to an ASCII character and stores both a scan code and an ASCII\
    \ code in the\n\n```\nProgram 12.1\nUSE        .= 16\nDTO        .= COM\n;\n;\
    \ Write Hello by storing ASCII codes into the video buffer.\n;\n        MOV AX,\
    \ 0B886H ; First 4 digits of B8868H\n        MOV DS, AX\n        MOV DI, 8   \
    \   ; Last digit of B8868H\n        MOV AH, 72     ; ASCII for H\n        MOV\
    \ [DI], AH   ; Store the character.\n        ADD DI, 2      ; Next odd address\n\
    \        MOV AH, 101    ; ASCII for e\n        MOV [DI], AH   ; Store the character.\n\
    \        ADD DI, 2      ;\n        MOV AH, 108    ; ASCII for l\n        MOV [DI],\
    \ AH   ; Store the character.\n        ADD DI, 2      ;\n        MOV AH, 108 \
    \   ; ASCII for l\n        MOV [DI], AH   ; Store the character.\n        ADD\
    \ DI, 2      ;\n        MOV AH, 111    ; ASCII for o\n        MOV [DI], AH   ;\
    \ Store the character.\n        RET            ; Return to DOS\n```\n\nbuffer.\
    \ From this buffer, the keys are picked up by the application program or the command\
    \ line interpreter. The two bytes stored at 41A point to the next departing bytes.\
    \ In Figure 12-4, there is one key waiting to be picked up. It is the letter C,\
    \ whose ASCII code is 43H. 2E is its scan code. The two bytes stored at 41C point\
    \ to the location where the next arriving bytes will be stored. Since the departing\
    \ pointer is only two bytes behind the arrival pointer, this means there is only\
    \ one character in the buffer, C in this case. Both pointers wrap around when\
    \ they reach 43E. For this reason, the buffer is called a circular buffer.\n\n\
    # Figure 12-4. DOS Keyboard Buffer\n\nKeyboard Buffer (ASCII - Scan)\n41E 41F\
    \ 420 421 422 423 ... 43C 43D\n31 02 43 2E 4C 26 ... 5A 2C"
