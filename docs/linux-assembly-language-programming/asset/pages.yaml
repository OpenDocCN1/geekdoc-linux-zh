    Notice that although the first bit in a two''s complement system is a sign bit,
    it is not just a sign bit. For example, if we change the sign bit on 1011, we
    get 0011. This changes -5 to 3, not 5.


    # 3.6.5 Signed vs. Unsigned Numbers


    If all arithmetic done on computers were done using two''s complement representation,
    there would never be any problem interpreting the contents of a numerical register.
    But unfortunately this is not the case. Sometimes arithmetic is done and it is
    assumed that the numbers are represented using the plain binary system. So when
    a four-bit register has a 1011 in it, does this mean -5 or 11? If we are using
    two''s complement, then we know it is -5. But we could be using just plain binary!
    Then we have 11. Computing practice is not consistent about this. Both systems
    are used. It could be either one. It is up to the software to make the distinction.
    The terminology signed vs. unsigned is often used. Signed integers are two''s
    complement integers. Unsigned integers are plain binary integers.


    Although when we are adding numbers, it doesn''t matter if the numbers are signed
    or unsigned — the adding hardware works either way — many other operations require
    different implementations depending on whether the operand is intended as a signed
    or an unsigned number. Consider inequality testing. Suppose four-bit hardware
    is asked to determine whether 1011 < 0010 is true or not. While 0010 represents
    2 in both the signed and the unsigned systems, 1011 is -5 as a signed number and
    11 as an unsigned number. The signed interpretation, -5 < 2, yields a true, whereas
    the unsigned interpretation, 11 < 2, yields a false. The hardware must make a
    different response in the two cases. This means that a single "less than" command
    cannot work. Two are needed, one for signed numbers and one for unsigned numbers.
    This issue comes up over and over again in assembly language.


    In the C language, integers may be declared as unsigned int or as signed int .
    The unspecified int declaration means the same as signed int.


    # 3.7 Subtraction Using Negation'
