    # ### 3.13.3 Negative Numbers and Congruences


    Two''s complement representation is used for negative numbers, in part because
    it allows addition and subtraction hardware to be used irrespective of whether
    the bits being operated on are intended as signed integers or as unsigned integers.
    The mathematical explanation for why two''s complement representation works like
    this is based on a concept due to C. F. Gauss, a remarkable nineteenth century
    mathematician.


    Gauss defined $a \equiv b$ (mod m) to mean that $a$ and $b$ differ only by some
    exact multiple of m. In two''s complement representation, a negative number and
    the positive number used to represent it differ by the turnover value of the registers
    being used. If four-bit registers are being used, then each negative and its positive
    representation differ by $2^4$, or 16, as shown in Table 3.9. In Gauss'' notation,
    for example, $-5 \equiv 11$ (mod 16). So when the computer does $(-2) + (-3)$
    as $14 + 13$, it depends on the fact that $14 + 13 = 27 \equiv -5$ (mod 16). The
    four-bit addition hardware produces 11 because a carry of 16 is lost. But that
    is okay. Eleven is the correct representative for -5.


    # **Congruence Addition Theorem**


    This reasoning is summarized in the following theorem due to Gauss:


    > $$\begin{aligned} &\text{If } a \equiv b \text{ (mod m) and } c \equiv d \text{
    (mod m)} \\ &\text{then } a + c \equiv b + d \text{ (mod m)} \end{aligned}$$


    This theorem says that congruences can be added just like equations. Gauss devised
    the congruence notation in order to make the point that a congruence is similar
    to an equation.


    # **Congruence Multiplication Theorem**


    The following theorem states that congruences can also be multiplied just like
    equations.


    > $$\begin{aligned} &\text{If } a \equiv b \text{ (mod m) and } c \equiv d \text{
    (mod m)} \\ &\text{then } a \cdot c \equiv b \cdot d \text{(mod m)} \end{aligned}$$


    Because of this nice theorem, we should be able to use both signed and unsigned
    numbers with MUL just like ADD and have no problems! Except for one thing.


