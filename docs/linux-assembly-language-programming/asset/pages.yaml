    \ DOS can be accomplished without disrupting applications programs, provided that\
    \ the DOS interrupt is rewritten so that it affords the same functionality to\
    \ the applications program. These layers afford applications programmers, systems\
    \ programmers, and hardware designers a modest degree of independence from one\
