- pgno: 45
  md: '![](img/165a4f637c5eaccb372f5a82ca458a05_45_0.png)


    When Sel is 0, the NOT gate outputs a 1, which freezes the circuit. When Sel is
    1 and the W/R# input is 0, meaning the processor wants to read, then again the
    circuit remains frozen. When Sel is 1 and the W/R# is 1, then the NOT gate outputs
    a 0, which causes the Data In to be stored.


    This circuit would work allright except for the fact that the number of Data wires
    for the entire memory is the same as the number of bits in one word. For example,
    this means that the least significant bit of the word must share its Data Out
    wire with the corresponding Data Out wire from every other word in memory as well
    as with the corresponding Data In wire. The same goes for each of the other bits.
    A memory with four-bit words has only four data wires, regardless of how many
    words it has. To avoid causing massive conflicts, circuits which have what is
    called a *tri-state output* are used.


    # 3.9.1 Tri-State Outputs


    Figure 3-2 shows a generic logic gate. The output of this gate can be switched
    either to the positive or the negative power terminal. Because its output has
    two possible values, it is called a *two-state gate*. Figure 3-8 shows a generic
    tri-state logic gate. Its output has three possible values. The output of this
    gate can be a logic 1 or a logic 0, but the output can also be switched to a disconnected
    state so that the output is not hooked up to anything. This is sometimes referred
    to as a *don’t care* state and is sometimes denoted by the letter X. When a logic
    gate switches to this state, it releases control over its output. If there is
    conflict on the horizon, switching to this state is a good way to avoid it. A
    simple tri-state circuit is the tri-state buffer whose truth table is given in
    Table 3.12. The symbol for this circuit is


    Figure 3-8. A Tri-State Logic Gate


    ![](img/165a4f637c5eaccb372f5a82ca458a05_45_1.png)


    Table 3.12. Truth Table for Tri-State Buffer


    | Control | Input | Output |

    | --- | --- | --- |

    | 0 | 0 | X |

    | 0 | 1 | X |

    | 1 | 0 | 0 |

    | 1 | 1 | 1 |'
