  md: '# Further Reading


    Advanced Assembly Language Programming. AlienWyatt, Sr., Que: 1992.


    # Chapter 13. LINUX BOOT TIME PROGRAMS


    In chapter 12, we discussed the main differences between the environment provided
    to user programs which run under Linux and the environment under which DOS programs
    run. We saw how very different these two environments are. Much of the difference
    between these two environments is due to the fact that a different operating system
    is running in each. But there is also a difference at the hardware level. DOS
    was written for the 8086 processor. In order for DOS to run on a machine, that
    machine must act like an 8086. Linux is a multitasking system. In order for it
    to run on a machine, that machine must have hardware support for the protection
    of one task from another. The x86 processors, from the 80386 on, support both
    of these operating systems by running in two distinct operating modes, real mode
    which emulates an 8086 and protected mode, which has multitasking support.


    # 13.1 Changing to Protected Mode


    Whether an x86 processor runs in real or protected mode is determined by the bottom
    bit of the CR0 register. This register is a 32-bit extension of the 16-bit Machine
    Status Word register on the 80286. The least significant bit in this register
    is actually the most significant bit on the entire processor. If it is cleared,
    the processor operates in real mode. If it is set, the processor operates in protected
    mode.


    Table 13.1 shows the bit allocations of the CR0 register in the 486.


    To change to protected mode from DOS is easy.


    # Program 13.1


    ```

    MOV EAX, CR0

    OR EAX, 1 ; Make the least significant bit 1.

    MOV CR0, EAX ; Here goes!

    ```


    But changing to protected mode should not be attempted without preparation. The


    # Table 13.1. 486 CR0 Register


    | Bits | Label | Full Name |

    |---|---|---|

    | 31 | PG | Paging Enable |

    | 30 | CD | Cache Disable |

    | 29 | NW | No Write Through |

    | 18 | AM | Alignment Mask |

    | 15 | WP | Write Protect |

    | 5 | NE | Numeric Error Enable |

    | 4 | ET | Extension Type (287 vs. 387) |

    | 3 | TS | Task Switched |

    | 2 | EM | Emulate Math Chip |

    | 1 | MP | Math Chip Present |

    | 0 | PE | Protected Mode Enable |


    machine will promptly crash if Program 13.1 is run before the following steps
    are taken.


    # Step 1.


    In protected mode, all memory references depend on memory segment descriptor tables,
    particularly on the global descriptor table. Memory references, including those
    used in code fetching, will not'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'work until these tables are set up. These tables are discussed in section 13.2.


    # **Step 2.**


    In protected mode, the use of a radically different addressing system means that
    instructions will be fetched from a different CS segment. Code must be stored
    in the new CS segment.


    # **Step 3.**


    In protected mode, each entry in the interrupt table is a specially formattated
    eight-byte entry. So the DOS interrupt table where each entry is just a four-byte
    address will not work. Before going into protected mode, a new interrupt table
    must be created.


    This is why all x86 processors boot in real mode.


    Note that switching to protected mode does not start paging. As checking Table
    13.1 shows, paging is turned on using the top bit of CR0.


    # **13.2 Protected Mode Segmentation**


    An assembler programmer working on an 8086 has access to whatever memory the machine
    has. All addresses are accessible. To get around problems caused by the misfit
    of the 20-bit addresses and 16-bit address registers, addressing on the 8086 uses
    64K memory segments. The location of these memory segments is specified by the
    segment registers. Once a segment register is loaded, one can read to or write
    from the specified memory segment. Since on an 8086 the programmer can write to
    any segment register at will, a programmer can read from or write to any location
    in memory, (except for physically read-only memory). This means that memory protection
    on an 8086 is impossible.


    Beginning with the 80286, the segmentation mechanism was completely redesigned
    for the purpose of turning it into a memory protection mechanism. Memory segments
    on a 286 have access permissions somewhat like Unix file permissions. They also
    have an access privilege level. Memory segments are no longer required to be 64K
    in length, but can be whatever length the operating systems programmer decides
    upon. Memory segments are defined by eight-byte data structures called a *segment
    descriptors* or sometimes just a *descriptors*. These descriptors are stored in
    tables called *descriptor tables*. Descriptor tables are located in memory just
    like the interrupt table. (See *chapter 9, section 9.2.*)


    Segment registers are used to store pointers into these descriptor tables. These
    pointers are called *selectors*. They select segment descriptors from the descriptor
    table. See *Figure 13-2*.


    *Figure 13-2. Selector Picks Segment Descriptor from the Descriptor Table*


