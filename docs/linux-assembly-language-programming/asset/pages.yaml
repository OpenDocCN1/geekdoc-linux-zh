- pgno: 117
  md: "Without interrupt pins, I/O communication would have to rely on processor instructions\
    \ such as the `IN` and `OUT` commands.\n\n# 9.1.1 Data Ports\n\nSuppose that a\
    \ processor is sending characters from a buffer located at ABC to a printer located\
    \ at port 378H, and that to do this it issues one-byte `OUT` commands from a loop,\
    \ as shown in Program 9.1. Then assuming one instruction per machine cycle, each\
    \ execution of the loop would take five machine cycles. At a clock rate of 100\
    \ MHz, all 100,000 characters would be sent to the printer in .005 seconds. This\
    \ is enough time for the printer to print one or two of them. The printer would\
    \ be swamped, and most of the output to the printer would be lost.\n\nPrinters\
    \ are slow in comparison to processors. So are most other I/O devices.\n\n# 9.1.2\
    \ Status Ports\n\nTo prevent data loss, a printer must have a status port as well\
    \ as a data port. The processor will then be required to inquire of the status\
    \ port whether or not the printer is ready to receive another character. The processor\
    \ will only output another character when the printer is ready.\n\n# Program 9.1\n\
    \n```\nMOV EDX, 378H  ; Printer Data Port\nMOV ECX, 0     ; Use ECX as the loop\
    \ counter.\nXYZ:  MOV AL, [ABC + ECX]\n      ; ABC is the beginning of the memory\
    \ area\n      ; that characters are being printed from.\nOUT [DX], AL   ; Send\
    \ a character to the printer.\nINC ECX\nCMP ECX, 100000; Print this many characters.\n\
    JL XYZ\n```\n\nSuppose that the printer with the data port at port 378H also has\
    \ a status port at port 379H and responds to an inquiry to this port with a 1\
    \ when it is ready and with a 0 when it’s not. In this case the output loop might\
    \ look like this: A loop\n\n# Program 9.2\n\n```\nMOV EDX, 379H  ; Printer status\
    \ port\nMOV ECX, 0\nXYZ:  IN AL, [DX]     ; Ask the printer if it's ready\nCMP\
    \ AL, 1           ; 1 means it's ready\nJNE XYZ             ; If not try again\n\
    MOV AL, [ABC + ECX]\nDEC EDX             ; Data port is 378H\nOUT [DX], AL   \
    \     ; Send one byte!\nINC ECX\nINC EDX             ; Put back the status port\n\
    CMP ECX, 100000\nJL XYZ\n```\n\nlike this solves the problem of lost data by reducing\
    \ processor throughput down to the speed of the printer. Most of the processor’s\
    \ time is spent executing the three instructions following the XYZ label.\n\n\
    Successively querying one I/O device after another about its status is called\
    \ *polling*. Polling makes a modest improvement on this situation by putting an\
    \ inquiry to all pending I/O devices into one status inquiry loop. But it is still\
    \ clearly a waste of processor time.\n\n# 9.2 External Interrupts"
  merge: -1
