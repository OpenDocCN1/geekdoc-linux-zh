    In chapter 3, section 3.3, circuits and truth tables for the Boolean operations
    AND, OR, NOT, and XOR were discussed. The truth table for AND is


    | p | q | (p AND q) |

    | :-- | :-- | :-- |

    | 1 | 1 | 1 |

    | 1 | 0 | 0 |

    | 0 | 1 | 0 |

    | 0 | 0 | 0 |


    and is implemented using the Boolean circuit


    ![](img/165a4f637c5eaccb372f5a82ca458a05_131_0.png)


    If eight of these Boolean circuits are used in parallel, then two eight-bit numbers,


    ```

    ```

    1111  0101

    1100  0011

    ```

    ```


    when fed into the eight AND gates, result in one eight-bit output:


    ```

    ```

    1100  0001

    ```

    ```


    The operation is carried out as shown in Figure 10-1. In hex notation, the bytes
    F5H and C3H used as inputs to a one-byte AND operation have produced the output
    C1H. This operation can be applied to any number of bits. The Boolean operations
    OR, XOR, and NOT can also be applied in bitwise parallel fashion.


    # Figure 10-1. Bitwise AND Operation


    ![](img/165a4f637c5eaccb372f5a82ca458a05_131_1.png)


    # 10.2 The AND, OR, NOT, and XOR Commands


    High-level programming languages include support for Boolean operations such as
    AND, OR, and NOT. They rely on assembler and machine-level implementation of these
    operations.


    The AND instruction applies the AND operation to two operands in much the same
    way that the ADD instruction adds two operands. The following forms are all valid
    for the AND command:


    ```

    ```

    AND  reg, imm

    AND  reg, reg

    ```

    ```'
