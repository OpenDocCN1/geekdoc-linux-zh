- pgno: 178
  md: 'The global descriptor table is used for storing descriptors of memory segments
    which are accessed by all tasks on the system, as well as all LDTs and TSS descriptors.


    As we can see from Figure 13-3, there can be only one global and one local descriptor
    table in effect at any given time. When a task switch occurs, the local descriptor
    table is changed, just like the page tables are changed. But the global descriptor
    table stays the same.


    The IDT, the interrupt descriptor table, and its entries are described in *chapter
    9*.


    The global descriptor table and interrupt descriptor table also have base addresses
    and limits, and hence, there are registers for them. But these addresses are never
    coded into descriptors, so there is no point in having selectors for them. Intel
    does not consider the global descriptor table or the interrupt descriptor table
    to be segments because they are not accessed using selectors.


    # 13.2.3 Selectors


    In real mode, segment registers such as DS specify segments by holding the first
    four hex digits of the base address of the segment. In protected mode segment,
    registers specify segments by holding pointers to their descriptors. Each descriptor
    consists of a complete definition of the segment. The pointer points into a descriptor
    table. The table may either be the global descriptor table or the local descriptor
    table.


    A very simple way to implement a pointer like this would be to use the offset
    from the beginning of the descriptor table. This is what is shown in Figure 13-2.
    Although the value 24 shown in the figure would work just as illustrated, it is
    not the case that the selector is simply an offset.


    Suppose that a descriptor we want to point to were located 48 bytes from the beginning
    of a descriptor table. In that case, the offset 48 would make a very good pointer
    to that descriptor, assuming we know which table the descriptor is located in.
    Since each descriptor occupies eight bytes of storage, all such offsets are multiples
    of 8. Hence in binary, the three least significant bits of each offset are zero.
    The x86 takes advantage of this fact and puts those three bits of the selector
    to work carrying other information. Bits 0 and 1 carry a privilege level. Bit
    2 is the table indicator bit which determines whether the selector is a pointer
    into the global table or the local table, 1 = local, 0 = global. To recover the
    offset from the selector, the bottom three bits must be zeroed back out again.
    Figure 13-4 illustrates the example where DS contains 51, or 33H. As a 16-bit
    binary number, it is The pointer into the descriptor table is the table offset,
    48 in this case, or 30H.


    ![](img/165a4f637c5eaccb372f5a82ca458a05_178_0.png)


    The three least significant bits are zeroed out. To locate the descriptor for
    the DS segment, we would get the address of the global descriptor table from the
    GDT base address register and add 30H.


    There is one selector which does not use the format just described.


    It is desirable that one selector value be a null-value. That makes it possible
    to shut down unused segments. A selector which points to offset zero in the global
    table is by definition a null selector. Storing a null selector in a segment register
    disallows the use of that segment. All attempts to access a segment marked with
    a null selector cause a general protection fault. This, incidentally, makes it
    impossible for any selector'
