  md: '| 31 | 12 | 11 | 2 | 1 | 0 |

    |---|---|---|---|---|---|

    | Address of Page | | U | W | P |

    | | | S | R | |


    This bit, if it is 1, does not block access. If it is 0, it is checked against
    a two-bit privilege, value stored in a special register called the CPL register.
    This register and the privilege levels stored in it are discussed in chapter 9,
    section 9.6. Access is blocked if the value in the CPL register is 3. When user
    programs are running, the CPL register holds 3. This is the basic protection that
    kernel memory has against access by user programs.


    # 8.3.8 Paging Page Tables


    Entries in the page table table look just like entries in the page table. The
    present bit in each means the same thing. If it is cleared it means that the sought
    after item is not present. Just as a page of some process''s memory can be paged
    out to disk, so can a page table. Just as 4K of address space in a page can be
    marked as unallocated, so can the 4 Meg of address space under a page table be
    marked as unallocated.


    A missing page table causes a page fault or a segmentation fault, just like a
    missing page of user memory.


    # 8.4 Program Segments


    Consider Program 8.1. When this program is run, the line labelled ABC wipes itself
    out. This program is an example of self-modifying code Once upon a time in the
    bad old days, self-modifying code was sometimes used to save a few bytes of memory
    space. Today self-modifying code is not considered good programming. Tom Shanley
    put it more bluntly when he wrote that programmers who create selfmodifying code
    should be "cast into the pits." Ordinarily, the only reason that a running program
    is modified is that something has gone wrong. Running programs should not get
    modified.


    **Program 8.1**


    ```

    ```

    ; Program which self-destructs.

    ;

    IN AL, [0]

    ABC:  MOV [ABC], AL

    RET

    ```

    ```


    # 8.4.1 Non-Writable Memory


    Unix requires that running programs be protected from accidental modification
    by being stored in memory which is "not writeable." Linux uses bit 1 of the page
    table entry to implement this requirement. This is the bit marked "W_R" for Write
    Read in the diagram. If this bit is cleared, the indexed page is not writeable.
    When the processor encounters a write command such as


    ```

    ```asm

    MOV [87654321H], AL

    ```

