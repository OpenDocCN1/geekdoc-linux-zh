  md: '![](img/165a4f637c5eaccb372f5a82ca458a05_48_0.png)


    If we imagine this as the memory of a tiny little computer, then this computer
    would have a four-bit data bus, a two-bit address bus, and a one-bit control bus.
    To fetch an item from memory the processor for this little computer would put
    its W/R# pin at logic 0 and a two-bit address on the address bus. This would activate
    the Sel signal for exactly one word of memory. If we imagine a fetch-execute cycle
    in progress, the processor would need a two-bit register to keep track of the
    address of the instruction it was executing. All processors performing the fetch-execute
    cycle need such a register. It is often called the Program Counter. In Intel machines,
    it is called the Instruction Pointer.


    # Definition of Memory Capacity


    Any physical memory is an object or device which is stable in more than one state.
    Its capacity is the number of its stable states. Since a computer memory is laid
    out as a rectangle of objects with two stable states each, the number of stable
    states in the memory is $2^{l\times w}$, where $l$ and $w$ are the length and
    width of the rectangle. $l$ is also called the number of words, and $w$ is the
    width of each word in bits. For convenience, the capacity is often given (in bits)
    as just $l\times w$, i.e. the base two logarithm of the number of stable states.
    The capacity in bytes, of course, is one eighth of the capacity in bits.


    # SRAM vs. DRAM


    When memory circuits are built out of logic circuits, it is called static memory
    or SRAM. Memory circuits can also be made out of capacitors. A charged capacitor
    represents a stored 1; a discharged capacitor represents a stored 0. Since fewer
    transistors are required, these circuits can be packed with greater density on
    a chip. Small, closely packed capacitors have the disadvantage that they discharge
    rapidly. They require constant rechecking. Every capacitor which is not completely
    discharged must be pumped back up again. Because the memory is being constantly
    "refreshed," it is called dynamic memory, or DRAM. Dynamic memory is like a bookshelf
    without the shelf; except that in the case of a book falling four feet, say, to
    the floor, you would have .5 seconds to catch it before it hit the floor. These
    little capacitors discharge in .0001 seconds. The memory refresh must be done
    approximately every 100 μs. Unlike many developments which have numerous contributors,
    dynamic memory was invented by a single person, Ted Hoff, around 1970. Dynamic
    memory is cheaper and slower than static memory. Static memory is usually used
    for cache memory, while dynamic memory is used for RAM.


    One drawback of DRAM is that it makes hardware debugging much more difficult.
    The simplest way to do hardware debugging would be to slow the computer''s clock
    way down. Aberrant behavior could then be observed as it happened. But because
    of DRAM''s rapid refresh requirements, there is no easy way to do this.


    # 3.10 x86 General Registers and their Ancestry


    One of the reasons behind the market success of the Intel x86 line of processors
    has been that each new processor in the line was designed subject to the requirement
    that it be compatible with previous processors. Intel never wiped the slate clean
    and started from scratch as Motorola and IBM did with the PowerPC chip and DEC
    did with the Alpha processor. This minimized the amount of hardware and software
    retooling necessitated by an upgrade. Consequently, a description of the x86,
    and in particular its registers lends itself to a historical approach. We begin
    with the 8080 processor.


