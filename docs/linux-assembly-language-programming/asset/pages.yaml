  img_proc: true
- pgno: 66
  md: 'if and only if AL < BL. There is an x86 command for this jump. The mnemonic
    for it is JL, which stands for jump if less than.


    # 4.6.3 The CMP Command


    When a subtraction is performed only for the sake of a comparison, it may be done
    with the CMP instruction. This command sets the flags in the exact same way as
    SUB but has the advantage of not wasting register space by storing an unneeded
    result. Using the JL and CMP instructions we can rewrite the Program 4.4 as follows:


    # Program 4.6


    ```

    ; If the first input is larger output 1

    ; If the second input is larger output 2

    ; The program uses subtraction:

    ; B < A is true if and only if B - A is negative.

    MOV EDX, 0

    IN EAX, [DX]

    MOV EBX, EAX ;The first input is now in EBX

    IN EAX, [DX] ;The second input is now in EAX.

    CMP EBX, EAX ; This is first - second.

    JL SIB ; Second is Bigger

    MOV EAX, 1 ; Otherwise First is Bigger

    JMP END ; Don''t drift into the other case!

    SIB: MOV EAX, 2 ;

    END: MOV EDX, 1 ; Either way now EAX is ready.

    OUT [DX], EAX

    RET

    ```


    Program 4.6 works correctly for all numbers in the unsigned four-byte range.


    # 4.6.4 More Jump Commands


    Following a CMP EAX, EBX command, the JL command executes a jump if the condition
    EAX < EBX is true. The commands


    ```

    CMP EAX, EBX

    JL ABC

    ```


    mean


    Compare EAX to EBX and


    Jump if EAX is less than EBX .


    What is going on here is subtraction and flag checking, but the well-designed
    syntax allows us to overlook that. The less than condition is not the only condition
    conveniently accessed following a CMP command. A list of several other conditional


    jump commands is given here.


    ```

    JL less than EAX < EBX

    JLE less than or equal EAX ≤ EBX

    JG greater than EAX > EBX

    JGE greater than or equal EAX = EBX

    JE equal EAX = EBX

    JNL not less than EAX ? EBX

    JNLE not less than or equal EAX ? EBX

    JNG not greater than EAX ? EBX

    JNGE not greater than or equal EAX ? EBX

    JNE not equal EAX ? EBX

    ```'
