    Default segments exist in 32-bit code as well. In fact, that is what makes it
    possible to do programming without reference to segments, as is done in chapter
    8. The Linux programs there all make use of a default segment. It is actually
    a 4 Gig segment. Setting up big segments like this is discussed in chapter 13.
    In x86 Linux, the CS, DS, ES, and SS segments all refer to the same 4 Gig segment.
    So the programmer has no options, and the default segment is always okay.


    # 12.2 Edlinas Environment Variables


    Many assemblers have directives which allow variables to be defined and then used
    in subsequent expressions. In NASM, the syntax for such a directive is


    ```

    var equ value

    ```


    In Edlinas, it is


    ```

    var . = value

    ```


    In Edlinas, there are built-in variables whose values control the behavior of
    the assembler and the simulator. One of these is USE, which determines whether
    the assembler uses 16-bit or 32-bit coding. The default is 32. DOS programs require
    16.


    NASM uses a directive called BITS. For example, to specify 16-bit code in NASM,
    the line


    ```

    BITS 16

    ```


    does the trick. Another environment variable is DOTO. It determines the format
    of .o files saved by Edlinas. The default is ELF. DOS needs the COM format.


    NASM governs the format of the output file using a command line switch. To get
    a COM format in NASM, the -f bin switch works. It is also the default so that
    no switch at all will do the same thing. A file with this format has essentially
    no extra code at all. It is just a plain binary file.


    Edlinas environment variables may also be defined in an EDL.INI file or from the
    > prompt.


