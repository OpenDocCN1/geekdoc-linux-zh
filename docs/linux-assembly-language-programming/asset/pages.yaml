- pgno: 60
  md: 'The close similarity of memory and I/O transfers is not fully reflected in
    x86 assembly language, which has many commands involving memory access but only
    a few, `IN` and `OUT` for example, controlling I/O access. The use of `MOV` and
    many other commands to access memory is discussed in chapter 6, section 6.2. The
    `IN` and `OUT` commands are discussed next.


    # 4.2.2 The `IN` Command


    The input command transfers data from an I/O port into the processor. There are
    six valid forms of this command


    ```

    IN EAX, [DX]

    IN AX, [DX]

    IN AL, [DX]

    IN EAX, [imm]

    IN AX, [imm]

    IN AL, [imm]

    ```


    where `imm` is any one-byte number. Notice that the general


    COMMAND destination, source


    format is adhered to in this instruction. The valid destination registers are
    EAX, AX, and AL. The I/O device whose port number is stored in DX or given by
    `imm` is the source.


    Notice that DX is a 16-bit register. This makes sense because a port number is
    a 16-bit number. Most Intel assemblers, including NASM, do not use brackets around
    the port number. If you do, however, you can think of the command IN AL, [DX],
    for example, as


    let AL = [DX]


    where the [DX] refers to data located at the address DX. This is done in Edlinas
    for the sake of consistency. Memory commands use brackets in the same way. Brackets
    become a dereferencing operator like * in the C language. In both Edlinas and
    NASM, all references to data in memory by means of an address use brackets around
    the address. NASM does not use brackets for I/O references. Hence, in using NASM,
    the brackets in the IN and OUT instructions are omitted.


    Because the `imm` forms of the `IN` command accept only one-byte ports, only the
    bottom 256 of the 65.536 ports are accessible using the `imm` forms. Notice that
    the `IN` command was not given as IN reg, [reg]. This is because forms such as
    IN EBX, [DX] and IN EAX, [CX] are *not* valid.


    # 4.2.3 The Out Command


    The output command transfers data from the processor to an I/O device. The six
    valid forms of this command are


    ```

    OUT [DX], EAX

    OUT [DX], AX

    OUT [DX], AL

    OUT [imm], EAX

    OUT [imm], AX

    OUT [imm], AL

    ```


    where again `imm` is any one-byte number. The order of the operands is opposite
    to what it is in the `IN` command because the data is flowing in the opposite
    direction. The source is either the EAX, the AX, or the AL register, and the destination
    is an I/O device. Again, NASM doesn''t use brackets with `OUT`.


    # 4.2.4 Memory Mapped I/O'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'When addresses in the memory address space are connected, in fact, to I/O devices,
    this is referred to as *memory mapped I/O*. The video buffer on the standard PC
    is an example. Characters stored at the 4000 bytes starting at the memory address
    B8000H are output to the monitor.


    Using a separate address space for I/O devices is not the only conceivable approach
    to I/O addressing. Many architectures use a single set of addresses and simply
    reserve some of them for I/O.


    Reserved addresses are also used on PCs for ROM, or *read-only memory*. If memory
    writes are done to read only memory, the processor will send the appropriate write
    signals out onto the buses, but no change will be made in the "stored" data.


    # 4.3 Simple Assembly Language Programs


    Simple high-level language programs often have a three-part format: input data,
    do calculations, and then output the results. Using Edlinas, simple programs of
    the same style can be written in x86 assembly language.


    # 4.3.1 Edlinas Ports


    The imaginary machine simulated by Edlinas uses only two port numbers.


    +   - 0 is the port for the keyboard input.

    +   - 1 is the port for the screen output.


    Keyboard input is echoed at the lower left of the screen and output is displayed
    at the lower right. When `IN EAX, [DX]` is used with Edlinas, the value stored
    in DX should be 0. When port 0 is addressed, the user is prompted for an input
    value. When `OUT [DX], EAX` is used, the value stored in DX should be 1. When
    port 1 is used, the output value is displayed in base ten at the bottom right
    of the screen. The use of these two ports allows very simple programs to be written
    in genuine x86 assembly language and run on the Edlinas simulator.


    Programs using Edlinas ports will not run under DOS or Unix. In chapter 8, section
    8.4.7 it is shown how these I/O commands to the simulated machine may be replaced
    by calls to the C library functions `scanf()` and `printf()`. In this way, simple
    Edlinas programs using real I/O can be run under Linux.


    # 4.3.2 The RET Command


    Programs are set in motion by the operating system. When the program is finished,
    it must return control to the operating system. RET does this. Subprograms also
    use RET to return control to a calling program. RET works using the stack and
    is discussed in chapter 7, section 7.2.


    # 4.3.3 Program to Add Two Numbers


    We now have all the commands we need to write some simple but complete programs.
    Here is an Edlinas program to add two numbers:


    # Program 4.2


    ```

    MOV EDX, 0      ;Making all 32 bits zero makes DX zero.

    IN EAX, [DX]    ;User enters the first number via port zero.

    MOV EBX, EAX    ;Get the first number out of the way.

    IN EAX, [DX]    ;User enters the second number.

    ADD EAX, EBX    ;Add the first number to the second.

    MOV EDX, 1      ;The Edlinas output port is one.

    OUT [DX], EAX   ;The result is output to the user.

    RET             ;End the simulation.

    ```'
  merge: -1
  img_proc: true
