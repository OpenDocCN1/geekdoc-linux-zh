    # Segments and Segmentation


    +   - Program segment. Since chapter 8, we have applied the term *segment* to
    a chunk of an executable file. This is standard usage. Programs typically have
    text and data segments.

    +   - Segmentation process. In this book, the term *segmentation* is applied only
    to an address processing mechanism which has the effect of dividing memory into
    chunks.

    +   - Memory segment. It is customary to apply the term *segment* to the chunks
    of memory produced by the segmentation process. In this book, memory segments
    will always be referred to in connection with a special kind of register called
    *segment register*.


    On an x86 processor, segmentation is controlled by segment registers.


    # 12.1.1 Segment Registers


    On the 8086, four of the general registers can be used for addresses: BX, BP,
    SI, and DI. That is, they can be used in brackets to refer to memory. For example,
    the commands


    ```

