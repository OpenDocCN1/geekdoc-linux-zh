    \ given only a partial load, `buffer_end` allows the driver to quit on time without\
    \ running all the way to the end of the `buffer`.\n\n+   • cq_wait_q: The last\
    \ component, `cq_wait_q`, is there because although the text `buffer`, `buffer`\
    \ [`CQ_BUFFER_SIZE`], is a good idea, it does not completely solve the problem\
    \ of accessing the user's text. When all the text in the `buffer` has been sent\
    \ to the speaker and there is more to go, then we're back where we were before\
    \ when we had no `buffer`, trying to get ahold of user's text when the user's\
    \ process is not running (and hence the user's address space is not functional).\n\
    \nThe `buffer` in device memory does not eliminate the need to do task switches.\
    \ It can only reduce the number of them. We can do this by making the `buffer`\
    \ larger. The bigger the `buffer`, the less often a task switch is needed. But\
    \ a bigger `buffer` increases the size of kernel memory. We have here a typical\
    \ time vs. space trade off.\n\nThe user-called process, which fills the `buffer`,\
    \ and the timer-handler, which empties the `buffer`, are an example of what is\
    \ called a producer–consumer pair.\n\n# 11.3.5 Wait Queues\n\nWait queues were\
    \ designed to allow processes to suspend operation in such a way that they can\
    \ be easily reactivated when needed. For example, a producer can suspend operation\
    \ when it has produced a surplus and be reactivated by a consumer when the supply\
    \ is exhausted.\n\nA process may suspend its own operation by calling `sleep_on()`.\
    \ It can be reactivated using `wake_on()`.\n\nIn the case of our speaker driver,\
    \ the producer `cq_write()` fills `cq_area.buffer`, the speaker's text `buffer`,\
