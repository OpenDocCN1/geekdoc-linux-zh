    # 8.8.1 Section Header Table


    The Section Header table lists all the sections in the object file. The table
    shown in Table 8.2 was produced by running ob on `.o` file for Program 8.6. The
    Flags item contains attribute bits, which are somewhat like the permission bits
    in the program header table of the executable file. Bit 2 is 1 if a section is
    executable. In Table 8.2 the only section with bit 2 set is section 1, which is
    in fact the text section. Bit 0 is 1 for writeable sections. Only sections 3 and
    4 are writeable. Section 3 turns out to be the data section.


    # 8.8.2 Sections


    When the linker creates a text segment, it combines the text sections from the
    object code files. When it creates a data segment, it combines data sections.
    The linking process involves collating.


    When the gnu linker links `.o` files, it needs to designate an address where execution
    is to commence. The programmer can designate this by using the label main and
    making sure it is visible to the linker by using the global assembler directive.


    # Further Reading


    > Understanding ELF Object Files and Debugging Tools, MaryLou Nohr, Prentice Hall:
