    # 5.1.2 Little Endian Immediate Codes


    The first and last MOV commands in this program both contain immediate values.
    Both of these store four-byte values in four-byte registers. Notice in the last
    MOV command, the four-byte immediate value 00000001H is stored as 01 00 00 00.


    # 5.1.3 Relative Jumps


    The jump encoding used by x86 processors uses relative rather than absolute addresses
    when this is feasible. All the jump instructions in this program encode jumps
    as relative jumps. An absolute jump would specify an actual address as the target
    of a jump, whereas relative encoding specifies the number of bytes to jump starting
    from the beginning of the next instruction. This value may be interpreted as a
    signed number, a negative value for a backwards jump. The encoded value is added
    by the processor to the address of the next instruction to obtain the address
    of the instruction being jumped to. For example, the JMP NXT instruction has a
    little endian encoded 4; counting four bytes from the 89 byte that begins the
    MOV EAX, ECX, brings you to the 89 byte that begins MOV EDX, EAX. This command
    is the target of JMP NXT. The JMP ORD instruction contains the relative jump value
    FFFFFFFH = -25. Counting backwards 25 bytes from the 89 byte that begins the MOV
    EAX, EDX, brings you to the 29 byte that is the first byte of the code for SUB
    EAX, ECX.


    # 5.1.4 Short Jumps


    The relative jump values in the program are each encoded in four bytes, in spite
    of the fact that the values 17, 4, and -25 fit easily in the one-byte signed range.
    There are alternate encodings which can be used to save space on one-byte jumps.
    These jumps are called short jumps. The short jump encoding for the JNS NXT instruction,
    for example, is 79 04. The machine codes for the conditional short jumps can be
    obtained from their 32-bit counterparts by dropping the OF byte and subtracting
    10H from the second byte. The short code for the JMP command is EB. In Edlinas,
    a long jump can be converted to a short jump using the s key. In NASM, the unadorned
    JMP instruction always means a short jump. A JMP instruction which can''t be encoded
    in one-byte gets an error message. To specify a jump which uses the longer encoding,
    JMP NEAR is used. In the present context, jumping "far" would seem to make more
    sense than jumping "near", but a far jump actually refers to a jump which uses
    absolute encoding as will be seen in chapter 12.


    Since most jumps are no more than 128 bytes, it makes sense to have a special
    encoding for them. The instruction set for the 8086 actually had only the short
    versions of the conditional jumps. The OF long jump'
