  md: '```

    ADD

    EV, rmv

    ```


    We can use this entry to assemble the ADD EDI, EAX command. The ADD EDI, EAX command
    requires a ModRM byte. The m in the second operand position specifies not only
    that the second operand may be a memory operand, but also that it must be encoded
    in the M bits of the ModRM byte. Since the second operand is the register EAX,
    the bit code for EAX, 000, occupies the M bits in the ModRM byte. Since we are
    using a register for the M bits, the two Mod bits must be 11. The first operand,
    which as the r indicates must be a register, is therefore encoded in the R bits
    of the ModRM byte. EDI is the first operand and its code is 111. Consequently
    the ModRM byte is:


    | Mod | R | M |

    |---|---|---|

    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | 1 | 1 | 1 | 1 | 1 | 0 | 0 | 0 |

    | 1111 1000 = F8H |


    Combining the 03 with the ModRM byte yields the code 03 F8 for ADD EDI, EAX.


    If in this code we change the two Mod bits from 11 to 00, we get the code for
    ADD EDI, [EAX]. Here the M bits are used for an actual memory operand. The codes
    01 and 10 are used to code for immediate displacements such as ADD EDI, [EAX +
    5], where the displacement is either of type ib or iv. Hence the code for ADD
    EDI, [EAX + 5] is 03 78 05. The code for ADD EDI, [EAX + 87654321H] is 03 B8 21
    43 65 87. If this coding were done uniformly, however, it would leave no room
    in the coding space for the complicated formats seen in chapter 6, section 6.2.3.
    To make space for coding these formats, the code for the ESP register is removed
    to provide an escape into another byte of the coding space called the SIB byte.


