    \nThe *Freeze/Copy#* label in this figure uses the Intel # convention that when\
    \ a signal is labeled with a meaningful word, then the meaning truthfully applies\
    \ when the line is at logic 1, unless the label has a # appended, and then the\
    \ opposite is the case. So the *Freeze/Copy#* label tells us that logic 1 means\
    \ *Freeze* and logic 0 means *Copy*.\n\n+   When the *Freeze/Copy#* line is zero,\
    \ the OR gates are opened and the circuit is turned into a flip-flop, where the\
    \ input is either set or reset. The NOT gate makes the S and R inputs opposite\
    \ to each other.\n+   \n+   The input value is copied to the output.\n\n+   When\
    \ the *Freeze/Copy#* line becomes 1, both OR gates are forced to 1 and this freezes\
    \ the output.\n+   \n+   When the output is frozen, subsequent changes in the\
    \ input have no effect on the circuit. The output value remains just what it was\
    \ the last time the *Freeze/Copy#* line turned from 1 to 0, i.e. the last time\
    \ it froze.\n+   \n+   That output value is in storage.\n\n# 3.5.3 Registers\n\
    \nFour latches used together in parallel can store four bits. This is an example\
    \ of a *register*. A four-bit register is a collection of circuits that can store\
