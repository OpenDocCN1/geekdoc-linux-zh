    least significant bits of the selector in AX is inferior to the privilege level
    written into the descriptor of the segment. Because the local descriptor table
    is implemented as a segment, access to it requires that a selector for it be loaded
    into a segment register. Since the local descriptor table is a special segment,
    not just any segment register will do. There is a segment register dedicated to
    the local descriptor table, the LDT register. To load the LDT register, the following
    command is used,


    ```

    LLDT rm2

    ```


    where **rm2** must be a two-byte register or memory location containing a selector
    referencing an entry in the global descriptor table. This entry should be a descriptor
    for a local descriptor table. Because the command uses the global table, it only
    works in protected mode. For example, if AX contains a selector which points at
    a descriptor located in the global descriptor table and this descriptor describes
    a local table, then


    ```

