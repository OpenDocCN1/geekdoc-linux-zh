    # Logic Value Conventions


    Because the two power terminals on the logic gate are always connected to the
    corresponding terminals on the battery or power supply, the output terminal always
    supplies a connection to either the positive or the negative battery or power
    supply terminal. For circuits in this book


    +      - A gate terminal connected directly or indirectly to the positive battery
    or power supply terminal is described as being "at logic 1."

    +      - A gate terminal connected directly or indirectly to the negative battery
    or power supply terminal is described as being "at logic 0."


    Because the input terminals are generally connected directly or indirectly to
    the battery or power supply terminals just like output terminals, they can also
    be described as being at logic 1 or at logic 0. The fact that the input terminals
    are designed to be at logic 1 or logic 0 has a further consequence that the output
    of one logic gate can be connected to the input of another with predictable results.


    # 3.1.2 Behavior of the NOT Gate


    The NOT gate is a logic gate which has one input terminal. To describe the behavior
    of the NOT gate, all that is needed is to describe how its input determines its
    output. The rules are:


    +      - If the input is at logic 1, the output is at logic 0.

    +      - If the input is at logic 0, the output is at logic 1.


    We can now put a flashlight together by hooking the output of the NOT gate to
    a bulb and the input to a mechanical switch. *Figure 3-3* illustrates this hookup.
    When wires in a diagram are shown crossing at a black dot, it means that the wires
    are connected. When wires cross and there is no black dot, it means that they
    are not in contact with each other. The flashlight in this figure is ultimately
    controlled by a mechanical switch, just like the flashlight in *Figure 3-1*. When
    the switch is in the down position as shown in the figure, the flashlight is on.
    The down position connects the input terminal of the NOT gate to the negative
    battery terminal, which puts it at logic 0. Therefore, because of the way a NOT
    gate works, the output is at logic 1. This means that the output terminal is connected
    internally by the NOT gate to the positive power terminal and therefore to the
    positive end of the battery. Hence the bulb gets current and the flashlight is
    on.


