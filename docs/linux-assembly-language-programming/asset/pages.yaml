    ```\n$$10011 = (1 \\cdot 8 + 0 \\cdot 4 + 0 \\cdot 2 + 1 \\cdot 1) \\cdot 2 +\
    \ 1$$\n```\n\nSo if we are working with nineteen using base ten, we have\n\n```\n\
    $$\\mathbf{19} = \\mathbf{9} \\cdot \\mathbf{2} + \\mathbf{1}$$\n```\n\nSuppose\
    \ we convert 19 to binary. The 1 in the above equation is the units digit of 19's\
    \ binary form. We got the 9 by dividing by 2.\n\n```\n$$\n\\begin{array}{r}\n\
    9 \\quad 1 \\\\\n\\sqrt[\\overline{18}]{2 \\sqrt{19}} \\\\\n\\overline{1} \n\\\
    end{array}\n$$\n```\n\nRepeating the process and writing down the remainder each\
    \ time gives us the rest of the digits.\n\n```\n$$\n\\begin{array}{rrrrr}\n\\\
    sqrt[\\overline{8}]{4 \\quad 11} & \\sqrt[\\overline{0}]{2 \\quad 011} & \\sqrt[\\\
    overline{0}]{1 \\quad 0011} & \\sqrt[\\overline{1}]{0 \\quad 10011} \\\\\n2 \\\
    sqrt{9} & 2 \\sqrt{4} & 2 \\sqrt{2} & 2 \\sqrt{1}\n\\end{array}\n$$\n```\n\nThe\
    \ conversion is done by dividing by 2 repeatedly. Each remainder furnishes one\
    \ binary digit.\n\n# 2.5 Memory as a Rectangle of Bits\n\nOn all electronic computers,\
