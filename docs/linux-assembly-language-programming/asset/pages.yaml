    |---|---|---|---|---|---|

    | B | 2 | K | 20 | T | 200 |

    | C | 3 | L | 30 | U | 300 |

    | D | 4 | M | 40 | V | 400 |

    | E | 5 | N | 50 | W | 500 |

    | F | 6 | O | 60 |   |   |

    | G | 7 | P | 70 |   |   |'
