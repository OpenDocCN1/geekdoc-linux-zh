- pgno: 172
  md: 'In real mode, the table is customarily located starting at address zero in
    memory. So the address of the interrupt service routine for interrupt 0 is stored
    in bytes 0 through 3. The address of the routine for interrupt 1 is stored in
    bytes 4 through 7. In general, if $n$ is the number of an interrupt, then the
    address of the entry number $n$ in the interrupt table is $4\times n$. For example,
    if the interrupt number is 33H then the address of the ISR #33 is to be found
    in bytes CCH to CFH. The largest valid interrupt number is 255. The address for
    that routine is stored in bytes 1020 through 1023, or 3FCH through 3FFH. $4 \times
    255 = 1020$.


    # Interrupt Vectors


    The term *interrupt vector* is often used in connection with this table. Unfortunately,
    many conflicting meanings of the term are in use. The term has been used to mean


    +   - the interrupt table itself

    +   - one of the 256 entries contained in the table

    +   - a memory location containing an entry in the table

    +   - a number in the range 0-255 used as an index into the table


    The term has been damaged beyond repair and it is best to just not use it any
    more.


    Knowledge of this table makes it possible to write a program which supercedes
    a DOS or BIOS interrupt. By changing the stored ISR address from that of the DOS
    or BIOS interrupt, the new program can take the place of the old one. A new program
    can also insert itself as a layer by calling the old program after it has done
    whatever it wants with the original function call.


    # 12.5 Checking DOS Memory


    One simple but useful application of the shift commands is the conversion of the
    contents of a register into a four-digit sequence of hex characters. For example,
    to print out the first digit of the number stored in BX, say 3C4DH, we can make
    a copy of BX and shift it 12 bits to the right and get 0003H. The ASCII code for
    $3 = 30H + 3 = 33H$. We can then send this code to the screen either directly
    using the video buffer, as in section 12.3, or as an interrupt, as in section
    12.4. To get the second digit, we can shift a copy of BX eight bits to the right
    and get 003CH. To mask out all but the bottom four bits, we can AND with 000FH.


