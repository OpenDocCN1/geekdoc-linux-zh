    the operand size prefix discussed in chapter 5, section 5.5.


    # 6.2.5 CISC vs. RISC


    An x86 computer is generally considered to be a complex instruction set computer
    (CISC). This is partly because of complicated addressing, as in the [EDX + 4*ESI
    + ABC] memory operand. Machines such as the SUN and MIPS workstations are based
    on the idea that by simplifying the instructions and having fewer of them, they
    become easier and faster to execute. This can more than make up for the fact that
    it takes more of these little instructions to write a program. Computing based
    on this philosophy is called RISC, reduced instruction set computing. The RISC
    vs. CISC issue is not an either-or issue like little endian vs. big endian. RISC
    is a set of features which may be adopted partially, in varying degrees. One reason
    that the 486 and Pentium processors were able to compete with the early RISC PowerPC
    processors is that they adopted a picoeical RISC philosophy. Although CISC instructions
    are allowed on a Pentium, it works faster if programmed using a RISC-like subset
    of the total instruction set.


    Their names notwithstanding, the Pentium II and Pentium Pro have gone over to
    a totally RISC architecture. The instruction set used internally is a pure RISC
    instruction set. Traditional x86 instructions are converted internally to RISC
    instructions before they are executed. In a sense, the "end of the line" tag hung
    on the Pentium by Apple marketers was correct. But ironically, 386 assembly language
    is now stronger than ever.


    # 6.3 Operand Size Ambiguity


    In most two-operand instructions, both operands must have the same size. So when
    a memory operand is used in such a context, the number of bytes it refers to can
    be determined if the other operand is a register operand. For example, in ADD
    [EBX], AX the memory operand [EBX] must refer to two bytes of memory since AX
    is a two-byte register. However, when a memory operand is used with an immediate
    operand, the result is ambiguous. For example, the following command is ambiguous:


    ```

    MOV [EBX], 5

    ```


    Similarly, when a memory operand is used with a unary operation such as NEG (which
    takes the two''s complement of a number), the operand size is indeterminate. An
    instruction such as


    ```

    NEG [EBX]

    ```


    might well refer to one, two, or four bytes of memory. Under these circumstances,
    an assembler has to make a choice. NASM chooses to produce an error message. In
    32-bit code Edlinas defaults to a four-byte reference when the reference is ambiguous.
    In 16-bit code, the default is two-byte. To indicate the one-byte case in Edlinas
    you may use the customary but clumsy notation


    ```

    NEG BYTE PTR [EBX]

    ```


    In NASM, the code is


    ```

    NEG BYTE [EBX]

    ```


    To indicate a four-byte reference in NASM, the code is


    ```

    NEG DWORD [EBX]

    ```


    A two-byte reference is indicated using WORD as a qualifier. These qualifiers
    clearly do the job. The implied concession that a word is 16 bits is unfortunate.
    In light of notation such as BYTE PTR, the AT&T practice of adding a letter to
    the mnemonic doesn''t seem so bad. In fact, the Intel assembler does use mnemonics
    of this sort in a few cases such as LODSB and STOSB (load string byte and store
    string byte).


