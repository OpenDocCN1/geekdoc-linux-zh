    \ USER PROGRAMS\n\nAt the beginning of chapter 6 it was noted that memory addresses\
    \ used in Linux user programs are not true memory addresses. The main reason for\
    \ this is that Linux needs to prevent the user from having direct access to memory.\
    \ See Figure 8-1.\n\n![](img/165a4f637c5eaccb372f5a82ca458a05_98_0.png)\n\nLinux\
    \ is a multitasking system. A multitasking system has many user jobs and an operating\
    \ system, which are all running at once. On a machine where any job can overwrite\
    \ the memory belonging to another job, a multitasking system is impossible. Multitasking\
    \ requires memory protection. Linux uses paging to implement a memory protection\
    \ system.\n\nPaging was originally designed as a system for economizing on memory.\
    \ Linux uses it for this purpose as well as for memory protection. Paging works\
    \ by intercepting each memory access encountered in the user's machine code. In\
    \ other words, every memory reference in a user program is turned into a request\
    \ for memory access which is required to go across the desk of the paging system\
    \ for approval. This means that paging gets control over memory access. In order\
