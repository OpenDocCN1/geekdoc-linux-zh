    global table. ; Bits 0 and 1 are 0 ; That''s system level privilege. HAK: LLDT
    AX ; ; AX is pointing at some descriptor ; It could be a local table descriptor
    ; If so it''s probably not our own local table. ; And in that case we have just
    borrowed someone ; else''s private descriptor table and we can

    ```'
