- pgno: 103
  md: 'When a page fault occurs, some page frame in RAM has to be chosen so that the
    needed page may be loaded into it from the disk. If no page frame is free, then
    some page of memory has to be chosen for transfer to the disk so as to free up
    a page frame. This memory page is copied to the disk and the page containing the
    missed address is copied into RAM. There are many different algorithms in use
    which choose pages to be expelled from memory. Such algorithms are referred to
    as *paging algorithms*. Many paging algorithms choose pages for expulsion on the
    basis of usage. Unused pages get expelled.


    # 8.2.3 Kernel Addresses


    Although Linux may and often does allocate the same virtual addresses to different
    tasks, it uses a special set of virtual addresses for kernel memory and these
    are never duplicated.


    +   Kernel addresses lie in the range from C0000000H to FFFFFFFH, i.e., 3 to 4
    Gig.


    +   User addresses in the range from 0 to BFFFFFFH, i.e., 0 to 3 Gig.


    *Figure 8-4* illustrates this memory policy from the standpoint of a single process.
    Figure 8-5 shows it from the standpoint of the entire system. User virtual addresses
    are allotted individually. Kernel addresses are system-wide.


    ![](img/165a4f637c5eaccb372f5a82ca458a05_103_0.png)'
