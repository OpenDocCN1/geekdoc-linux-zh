    undue delay.


    One more detail needs fixing in order to make sure the driver responds to signals.


    # 11.3.7 States of a Process


    A very important component of `struct task_struct` is `state`. Its most important
    values are assigned in `/usr/src/linux/include/linux/sched.h`:


    ```

    #define TASK_RUNNING 0

    #define TASK_INTERRUPTIBLE 1

    #define TASK_UNINTERRUPTIBLE 2

    #define TASK_ZOMBIE 4

    #define TASK_STOPPED 8

    ```


    Tasks which are on the run-queue, i.e. those which are now taking turns using
    the processor, have TASK RUNNING as the value of their `state` component. When
    a task puts itself onto a wait queue, `state` may take either `TASK_INTERRUPTIBLE`
    or `TASK_UNINTERRUPTIBLE` as values. And it makes a big difference.


    Although we might reasonably suppose that the difference has to do with interrupts,
    it doesn''t. It has to do with signals.


    If `state` has the value `TASK_UNINTERRUPTIBLE`, then its `signal` component will
    not be altered by a Ctrl-C or a kill. Unfortunately, this is the value assigned
