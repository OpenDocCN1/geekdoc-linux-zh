    # 2.4.2 Binary Subtraction


    Suppose we want to subtract five from twelve:


    1100

    - 101


    It requires borrowing:


    10 (two for the ones column)

    1 (one for the twos column)

    1000

    - 101


    Doing the subtraction in the first column yields


    10 (two for the ones column)

    1 (one for the twos column)

    1000

    - 101

    1


    In the two''s column we subtract zero from one:


    1 (one for the twos column)

    1000

    - 101

    11


    The fours column requires another borrowing:


    10

    1101

    — 101

    111


    This is how to subtract five from twelve in binary. But it is not at all how computers
    do this arithmetic. Computers do subtractions using negatives like this:


    12 − 5 = 12 + (−5)


    Since the method that we learned in school for adding a negative was to convert
    it to a subtraction, this might seem to be a distinction without a difference.
    However, computers use a different representation for negatives than just sticking
    a minus sign in front of the number, so there really is a difference. Representation
    of negative numbers is discussed in chapter 3, section 3.6.'
