  md: 'should end with an IRET instruction which is like a RET instruction except
    that it pops the flags register.


    The flags register is a 32-bit register named EFLAGS, which contains all the flags.
    It is an extension of the 16-bit FLAGS register. Table 9.2 shows the flags in
    the EFLAGS register on a 486.


    The reason for the x86''s special flag behavior when responding to interrupts
    has to do with the problem of interrupt arbitration.


    # 9.2.2 Interrupting an Interrupt


    What happens when an interrupt occurs while an ISR is already executing? Can one
    device interrupt another''s ISR? Imagine two devices, each refusing to be preempted
    by the other''s ISR. The processor would get bounced back and forth from one ISR
    to the other until the accumulation of pending return addresses on the stack overflowed
    and caused the system to crash.


    Table 9.2. EFLAGS Register

    | Bits | Label | Full Name |

    | :--- | :--- | :--- |

    | 18 | AC | Alignment Check |

    | 17 | VM | Virtual 8086 Mode |

    | 16 | RF | Restart Flag |

    | 14 | NT | Nested Task |

    | 13-12 | IOP L | I/O Privilege Level |

    | 11 | OF | Overflow Flag |

    | 10 | DF | Direction Flag |

    | 9 | IF | Interrupt Enable Flag |

    | 8 | TF | Trap Flag |

    | 7 | SF | Sign Flag |

    | 6 | ZF | Zero Flag |

    | 4 | AF | ASCII Overflow Flag |

    | 2 | PF | Parity Flag |

    | 0 | CF | Carry Flag |


    # The Interrupt Enable Flag


    The design of the 8086 allows for a very simple way to avoid this situation. The
    idea would be to enforce a strict "one-at-a-time" interrupt policy. It would work
    by automatically blocking interrupt signals while an ISR is running, and then
    unblocking them when it is finished. One of the flags on the x86 processor is
    called the *interrupt enable flag*. When this flag is cleared, all signals on
    the general-purpose interrupt pin are ignored. When an 8086 enters an ISR, this
    flag is automatically cleared. That is why the processor pushes the flags register
    onto the stack just before entering an ISR. It allows the interrupt enable flag
    to be restored to its original state when the ISR is done. When the interrupt
    enable flag is set, interrupts are handled normally.


    The one-at-a-time interrupt policy would make life easy for the interrupt controller.
    The controller could process an incoming interrupt by just passing it along to
    the processor until it was acknowledged. As soon as the interrupt acknowledge
    was received, the controller could wash its hands of that interrupt because the
    processor could be counted upon to work on it nonstop until it was done.


    Although the one-at-a-time policy is very easy to implement on an x86 processor,
    standard PCs do not use it. The problem with it is that interrupts that need a
    quick response can be kept waiting. If a serial port is getting ready to start
    trashing data because its buffer is full, then it should not be made to wait while
    a floppy drive looks for a good sector. A processor with a one-at-a-time interrupt
    policy can be like a household with a single, occupied bathroom. Unlike the situation
    with bathrooms, however, interrupting an ISR is not necessarily rude. It sometimes
    makes good sense to interrupt an ISR.'
