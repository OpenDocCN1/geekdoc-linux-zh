    # ### **3.3.4 Propagation Delay**


    Some essential features of logic circuit behavior are left out of any description
    based only on Boolean expressions and truth tables. One such feature is the propagation
    delay, the time required for a change in an input signal to cause a change in
    the output. The propagation delay of a gate used in a 100 MHz processor, for example,
    must be less than 10 nanoseconds. This is because 100 MHz means 100 million cycles
    per second (cps). So the length of each processing cycle is $\frac{1}{100,000,000}$
    second, which is the same as $\frac{10}{1,000,000,000}$ second or 10 nanoseconds.


    | Frequency | | Cycle Length |

    |---|---|---|---|

    | 1 Hz | 1 cps | 1 s | 1 sec |

    | 1 kHz | 1,000 cps | 1 ms | $\frac{1}{1,000}$ sec |

    | 1 MHz | 1,000,000 cps | 1 $\mu$s | $\frac{1}{1,000,000}$ sec |

    | 1 GHz | 1,000,000,000 cps | 1 ns | $\frac{1}{1,000,000,000}$ sec |


    Considering that the execution of one processing cycle might require a signal
    to pass through, say, five such gates in succession, the limit could drop to 2
    nanoseconds or less. Reducing this time delay is one of the main goals in current
    fabrication technology. The less the propagation delay, the faster the clock speed
    at which a circuit can be run.


    Also important is the amount of power dissipated. When many circuits are packed
    together on a chip, the temperature may increase to unacceptable levels unless
    the power dissipated by each circuit is reduced to a very low level. Reducing
    power dissipation is another primary goal of processor design.


    The architecture point of view leaves these problems out of the picture. From
    that standpoint, all we need to know about a Boolean circuit is contained in its
    truth table. The architecture point of view is more often suitable in computer
    science than in electrical engineering.


