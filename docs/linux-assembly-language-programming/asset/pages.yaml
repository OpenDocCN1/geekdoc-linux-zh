    We learn that instructions matching Table 5.5 contain 80486, Pentium, and MMX
    instructions as well as 80386 instructions. For example, the XADD and BSWAP instructions
    first appeared on the 80486 and the CPUID and RDTS C first appeared on the Pentium.


    # 5.5 32-Bit vs. 16-Bit Code


    To this point we have discussed machine codes for commands involving 32-bit general
    registers only. We are now ready to consider the coding of the 16-bit general
    registers.


    The MOV ECX,EAX command, as noted in section 5.1, can be encoded as 89 C1. The
    corresponding 16-bit command is MOV CX, AX. Surprisingly, the code for this command
    is also 89 C1! The 80386 was designed to use the same encodings for the 16-bit
    registers as for the 32-bit registers. Clearly there is a problem with this. When
    the processor fetches the bytes 89 C1, which instruction should be executed, MOV
    ECX, EAX or MOV CX, AX? It so happens that the decision is based on a single bit
    in the processor. This bit determines whether code is interpreted as 32-bit code,
    in which case 89 C1 means MOV ECX, EAX, or 16-bit code, in which case 89 C1 means
    MOV CX, AX.


    When the bit is set it does not mean that the instruction MOV CX, AX is unavailable.
    To encode the fact that the 32-bit coding presumption is wrong a one-byte prefix
    66 is used. So in 32-bit code 66 89 C1 is the code for MOV CX, AX. Similarly the
    MOV ECX, EAX instruction is available in 16-bit code. The code for it is 66 89
    C1. This prefix is called the operand size prefix. It means that the operand size
    is not the default size.


    Typically the bit is set while running Linux for example, and cleared while running
    DOS. Except where specifically stated otherwise, code given in this book assumes
    the processor’s bit is set for the 32-bit default. Hence, 89 C1 means MOV ECX,
    EAX and 66 89 C1 means MOV CX, AX. Now that we see how the code 89 C1 can have
    either one of two possible meanings, it is easy to explain the


    # Table 5.6. 32- vs. 16-Bit Coding Example


    | | 32-Bit Code | 16-Bit Code |

    |---|---|---|

    | MOV ECX, EAX | 89 C1 | 66 89 C1 |

    | MOV CX, AX | 66 89 C1 | 89 C1 |'
