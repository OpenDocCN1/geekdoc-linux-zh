- pgno: 99
  md: '# ### 8.1 Multitasking


    Before multitasking operating systems existed, computer programs were executed
    in sequence, i.e., one after the other. No program was able to begin executing
    until the program ahead of it was finished. Operating systems which ran programs
    in series like this were called *batch* operating systems. A multitasking system
    allows programs to take turns using processors. An operating system program called
    the *scheduler* acts as a referee and forces user programs to yield to one another
    even when they are not finished. At any given moment, there may be many user programs
    taking turns and waiting for processor time. Each of these programs is called
    a *task* or a *process*. A distinction has to be made between a program and a
    process since one program can be called several times by several users all at
    once. Each separate instance of a program is a process. In Linux we can list the
    processes by using the


    ```

    `linuxbox$ ps aux`

    ```


    command. Or to conduct a more detailed examination, we can explore the `/proc`
    directory.


    A multitasking system such as Linux is continually juggling its processor resources,
    passing them from process to process. Each time a process gets bumped from a processor,
    it has to save its current state. Part of the work of saving is done by a hardwired
    routine which is executed when the x86 does a *task switch*. It saves all current
    registers to a region in memory called the *task state segment*. The task state
    segment holds the frozen state of a task which is not currently running. Every
    task has its own task state segment. These task state segments make it possible
    to switch from one task to another. Figure 8-2 shows the basic layout of a task
    state segment, including the space for all the general registers, and a register
    called the *CR3 register*. Some space that is unmarked in this figure is discussed
    in chapter 13.


    ![](img/165a4f637c5eaccb372f5a82ca458a05_99_0.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: '<br>


    # 8.2 Paging


    As discussed in chapter 4, section 4.2, x86 I/O addresses do not undergo processing.
    If the DX register contains a number such as FC30H, then the execution of the
    `IN AL, [DX]` command causes the 16 bits of DX to be applied directly to the address
    bus.


    FC30H = 1111 1100 0011 0000


    So on the address bus we get


    <br>


    The top 16 bits are just 0.


    Memory addresses on the other hand are not handled in such a straightforward fashion.
    A `MOV AL, [0FC30H]` will not result in these same bits being pumped out onto
    the address bus. Memory addresses undergo a two-step process.


    +   1. Segmentation


    +   2. Paging


    Only at the end of this process, and then only if everything goes well, is there
    a physical address which can be pumped out onto the address bus. Since Linux does
    not use segmentation, discussion of it is deferred to chapter 12.


    # 8.2.1 Virtual Memory


    All addresses lie in the 0 to 4 Gig range. Although it would make sense that different
    tasks be required to use different parts of the 4 Gig space, Linux does not work
    this way. Linux may allocate the same addresses to different tasks at the same
    time. These addresses are not real. They are called virtual addresses. Just as
    a fraudulent accountant keeps two sets of books, one for the auditors and one
    for the true state of affairs, Linux must keep a set of virtual addresses for
    *each* task, plus one set of real addresses for the actual physical locations
    on disk and in RAM.


    ![](img/165a4f637c5eaccb372f5a82ca458a05_100_0.png)'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/165a4f637c5eaccb372f5a82ca458a05_101_0.png)


    The translation between the virtual addresses and the real ones is done using
    extensive sets of tables called *page tables*. Each process has its own set of
    tables.


    Figure 8-5 shows the situation which results. The reader will note that memory
    has been seriously overbooked. There are typically many processes running. Each
    process uses potentially 4 Gig of virtual address space. But the typical computer
    has much less RAM than would be needed to supply all processes with 4 Gig! At
    first sight, paging seems to be a very bad idea. But in fact it economizes greatly
    on memory usage and is one of the reasons computers are able to run big programs
    as fast as they do. Airlines overbook in order to keep their planes occupied.
    The cost of free airline tickets now and then to bumped passengers is more than
    paid for by keeping the seats full. Likewise, the occasional *page fault* is more
    than made up for by keeping memory busy.


    # Figure 8-5. Linux Virtual Memory System


    ![](img/165a4f637c5eaccb372f5a82ca458a05_101_1.png)'
