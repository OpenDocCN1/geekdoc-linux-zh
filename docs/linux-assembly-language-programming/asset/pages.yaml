    | b + 24 | Gate # 3 |  |


    | b + 32 | Gate # 4 |  |


    | b + 40 | Gate # 5 |  |


    | \vdots |  |  |


    | b + 2040 | Gate # 255 |  |


    It is the responsibility of the operating system to create this table. It is also
    responsible for loading into memory the interrupt service routines whose addresses
    are listed in this table. These two jobs are done as a part of the system boot.
    If they have not been done, the system will be unable to respond to interrupts.
    When Edlinas displays a "Processor halted" message, it is usually because it is
    trying to respond to an interrupt and no interrupt table has been built.


    # The Interrupt Descriptor Table


    The x86 has a dedicated register which stores the address of the interrupt descriptor
    table, or IDT. It is called the IDT register. There are special commands for accessing
    this register. The command


    ```

    LIDT mem

    ```


    loads the register. The command


    ```

    SIDT mem

    ```


    stores the contents of this register. The LIDT command is used in setting up the
    operating system at boot time. Once an interrupt descriptor table has been created,
    the LIDT command can point the processor to it. In responding to an interrupt,
    the x86 uses the fact that each table entry occupies eight bytes of space. Consequently,
    if $b$ is the address stored in the IDT register, then in response to the interrupt
    numbered $n$, the x86 fetches the eight bytes starting at the address $b + 8 \times
    n$. These eight-byte entries are called gates.


    # ISR Execution


    Once the address of the interrupt service routine is obtained, it is treated almost
    like a CALL instruction treats an address. Before jumping to a target address
    a CALL instruction pushes the next address after its own address onto the stack.
    This means that the called routine may return to the instruction following the
    CALL by reading its address off the stack. Since an interrupt service routine
    also needs to execute a return the address of the instruction which would otherwise
    have been executed, had the interrupt not arrived, is pushed onto the stack before
    the ISR is executed. But in the case of an interrupt, the flags register is pushed
    also. The interrupt service routine does whatever business is demanded by the
    interrupt. An interrupt service routine should end with a reti instruction which
    is like a ret instruction except that it pops the flags register'
