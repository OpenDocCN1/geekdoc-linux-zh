    \ without copying 4K of memory. The DOS function calls takes responsibility for\
    \ accessing the current page; the BIOS call does not.\n\nFigure 12-5 illustrates\
    \ the typical sequence of function calls. The fact that DOS programs call BIOS\
    \ programs and not directly to the hardware leaves hardware designers free to\
    \ make at least minor changes in their hardware without the necessity for changes\
    \ in DOS. By revising the BIOS programs so as to maintain the same functionality\
