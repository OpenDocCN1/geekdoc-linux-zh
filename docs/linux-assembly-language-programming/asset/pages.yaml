    Text and data segments of a program are stored on separate pages of memory, not
    separate segments of memory. In x86 Linux, the error message "Segmentation Fault"
    does not refer to a segmentation fault; it refers to a page protection fault.
    Worst of all is the term logical segment which accurately specifies nothing at
