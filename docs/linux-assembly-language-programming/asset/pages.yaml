    # 9.4.3 Faults and Traps


    When the service routine for an external interrupt or a software interrupt finishes,
    control is transferred to the next instruction following the interrupt just as
    it would be following the completion of a subroutine call. This is usually not
    the case with hardware exceptions. When the service routines for most exceptions
    are completed, the instruction giving rise to them is retried. Hardware exceptions
    for which this is true are called *faults*. A good example of a fault is a page
    fault. A page fault occurs when a failure to access memory has occurred because
    it has been paged out to the disk. The interrupt service routine pages it back
    in again, and then the original instruction is retried.


    A few hardware exceptions are like ordinary interrupts, and pass control to the
    next instruction when they finish. These are called *traps*. An example of a trap
    is division overflow on an 8086.


    # 9.5 System Calls


    One of the basic functions of an operating system is to provide access to hardware
    devices, as illustrated in Figure 8-1. In Unix all access to hardware devices
    is provided by way of what are called *system calls*. Users ordinarily get access
    by using either standard Unix commands, such as `cat`, or `ls`, or by using C
    library functions, such as `printf()`, or `scanf()`. But both Unix commands and
    C library functions rely on system calls to gain hardware access. See Figure 9-6.
    `read()` and `write()` are examples of system calls. The `write()` system call
    takes three parameters: a file to be written to, a memory buffer to be written
    from, and the number of bytes to be written. It appears to be an ordinary C function
    and can be used as though it were. Program 9.3 illustrates a "Hello world" program
    using the `write()` system call.


