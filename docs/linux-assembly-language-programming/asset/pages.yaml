    ```


    Suppose we have a computer with 64 Meg of memory and we want a 1 Meg segment starting
    at the beginning at the halfway point, i.e., at the address 32 Meg.


    +   Base: 02000000H (Start at 32 Meg)


    +   Limit: 000FFFFFH (1 Meg Segment)


    +   Permissions: Read and Write


    +   Privilege Level: User


    This information can be coded into an eight-byte descriptor. This descriptor can
    then be added to a descriptor table. For a user program to access this segment,
    it must have the index or *selector* of this descriptor stored in a segment register
    such as DS. The offset address used in accessing the segment must be less than
    the limit defined in the descriptor.


    # **13.2.5 Descriptor Encoding**


    ![](img/165a4f637c5eaccb372f5a82ca458a05_180_0.png)


    The two main items that need to be encoded into the memory segment descriptor
    are the base and the limit. Since these are both four-byte numbers and the descriptor
    is an eight-byte structure, it would appear that the space available is all used
    up by just these two items. By squeezing on the limit encoding, however, extra
    bits are freed up. Instead of allowing all eight hex digits of the four-byte limit
    value to be configurable, the segment designer is allowed only five digits to
    play with. This saves three hex digits or 12 bits. These three hex digits are
    allowed to be either 0s tacked on at the front or Fs tacked on at the end. The
    first is called *byte granularity* and the second is called *page granularity*.
    Specifying which of these two granularities is used costs one more bit. This bit
    is called the *granularity* bit. As an example of how this descriptor format is
    used, let us encode the sample 1 Meg segment just described. The four-byte base
    value 02000000H would be stored in bits 16-39 and 56-63, 24 bits plus eight bits.
    (This odd fracture is a vestige of the 24-bit addressing used on the 80286.) Displaying
    all eight bytes as a 16-digit hex number, using X for undetermined digits yields


    ```

    02 XX XX 00 00 00 XX XX

    ```


    The 32-bit limit values are coded into 21 bits by restricting the number of allowable
    limit values. The 20 bits from 0-15 and 48-51 encode five hex digits. Bit 55,
    G for granularity, determines whether the three'
