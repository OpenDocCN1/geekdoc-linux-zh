  md: '# 3.10.2 **8086 Registers**


    Although the Altair was a nearly pure example of an eight-bit computer, the 8080
    processor did have some 16-bit features. In particular, it was designed so that
    it could be used with a 16-bit memory addressing system. It did this by allowing
    two of the eight-bit registers, the H and the L, to pair up and form a 16-bit
    register, which could then be used for addresses. When this high-byte-low byte
    pair was referenced by a command, an X was used in the command. For example the
    16-bit increment command was INX. The eight-bit command was INR. The X stood for
    *extended*, and was used whenever 16-bit register pairs were being referenced.
    When the 16-bit 8086 processor, shown in Figure 3-13, was designed this X was
    recruited for use in the 16-bit register designations AX, BX, CX, and DX. The
    16-bit registers AX, BX, CX, and DX are pairs of high and low byte registers AH
    and AL, BH and BL, CH and CL, DH and DL. The other 16-bit registers, SP, BP, SI,
    and DI, have no X in their names and are not byte pairs. The data bus has 16 wires.
    Also shown are the 65,536 (= 2¹⁶) memory locations in one 8086 memory segment.
    In spite of the above picture, the 8086 is not really a good example of a 16-bit
    computer. The address bus has 20 wires, and there is a clumsy mechanism for using
    a handful of segments at a time. So the memory is not actually limited to 64K,
    but there is no convenient way to use all 2²⁰ bytes at once.


