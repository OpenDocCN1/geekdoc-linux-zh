    of DMA service to avoid placing unnecessary demands on the processor, a DMA handling
    circuit, very similar to the interrupt handling circuit shown in Figure 9-5, with
    a Master and a Slave DMA controller exists in the ISA architecture. There is a
    DMARQ line for each device which gets DMA service. These DMA lines are called
    *DMA* channels.


    # Figure 11-2. Floppy Controller Using DMA instead of an Interrupt


    ![](img/165a4f637c5eaccb372f5a82ca458a05_138_0.png)


    # 11.2 Devices as Files


    A device-independent file is a list of bytes with a name, and that''s all it is.
    As such, it is an abstraction. It soon proved to be a very useful abstraction.
    Immediately in the wake of the device-independent file concept followed another
    innovation of the Multics operating system. This was the idea that it should be
    possible for a programmer to treat I/O devices (printers, terminals, etc.) as
    device-independent files. This idea is the basis of the Unix device driver. Inputting
    data from a device can then be done just as you would "read" from a file. Outputting
    data to a device can be done just as you would "write" to a file. Turning file
    operations into generic device operations makes using devices easy for the applications
    programmer and also clarifies the role of the device driver. Its role is to provide
    the kernel with device specific versions of *read()*, *write()*, *open()*, etc.,
    that can be accessed when it is processing those generic system calls which come
    from user programs.


    For example, in section 11.3 where a Morse code speaker device is defined, the
    function *cq_write()* is defined. This function is called by the kernel when the
    system call *write()* is used to access the Morse Code speaker. This might happen,
    for example, when a user sends a string of text to the speaker.


    ```

    linuxbox$ echo "Hello world" > /dev/cq

    ```


    Because most devices are idiosyncratic in at least some respect or other, there
    must be room left over for features that do not fit into the generic read and
    write type system calls. The system call *ioctl()* is designed to take care of
    these leftovers. Each idiosyncratic feature is assigned a unique number called
    a *magic number*. An idiosyncratic feature of the speaker, for example, is its
    pitch. When *ioctl()* calls the speaker function *cq_ioctl()* using the correct
    magic number, the pitch-setting function is called.


    The connotations of the term *magic number* are unfortunate, putting as they do
    an aura of mystery around a mere detail and value on privileged information where
    a value on openness would be more socially responsible. *Stupid number* would
    be better. But, be that as it may, magic numbers are at least not hard to find.
    They are, by convention, given in #define statements where their usage is explained.
    POSIX conventions require that magic numbers be not only unique for a device,
    but systemwide unique.'
