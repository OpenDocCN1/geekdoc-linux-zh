- pgno: 177
  md: "+   3. Access Permissions. Permissions to read, write, and execute can be specified.\n\
    \n+   4. Access Privilege Level. This privilege level is the least privileged\
    \ value the CPL may have in order for access to be granted.\n\n+   5. Miscellaneous.\
    \ There are four or five functional bits in the descriptor unused by items 1 through\
    \ 4. In the case of executable segments, one of these bits determines whether\
    \ the code stored in the segment will be executed using a 16-bit or a 32-bit default,\
    \ (see section 5.5).\n\nIn order to carry out base plus offset computations and\
    \ offset versus limit comparisons without the delay which would be caused by a\
    \ memory access, each segment register has associated with it base and limit registers\
    \ which are reloaded every time the segment register is changed to reference a\
    \ different segment. Figure 13-3 shows these registers. Although Figure 13-3 shows\
    \ only base address and limit registers, there are also registers for all the\
    \ other permission and privilege bits defined by the segment descriptor.\n\n![](img/165a4f637c5eaccb372f5a82ca458a05_177_0.png)\n\
    \n# 13.2.2 Special Memory Segments, the GDT and the IDT\n\nShown in Figure 13-3\
    \ are registers for the task state segment, the local and global descriptor tables,\
    \ and the interrupt descriptor table, the TSS, LDTS, GDT, and IDT. None of these\
    \ are memory segments in the sense that they can be used in an ordinary memory\
    \ access command. For example,\n\n```\n    MOV EAX, [TSS:10h]\n```\n\nis not valid\
    \ code. But they are chunks of memory that have base addresses and limits. Since\
    \ the GDT and the IDT are not accessed via selectors, they are not called memory\
    \ segments. The TSS and the LDT are referred to as special memory segments.\n\n\
    The task state segment is used in task switches. The task being exited saves its\
    \ registers in its task state segment. The base address and limit of the TSS is\
    \ defined by a segment descriptor, just like other memory segments.\n\nThe local\
    \ descriptor table (segment), LDTS, is used to store descriptors of segments which\
    \ are not shared with all other tasks on the system."
