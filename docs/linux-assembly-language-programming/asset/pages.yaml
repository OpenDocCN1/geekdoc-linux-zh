- pgno: 118
  md: 'In order to allow programmers to avoid relying on polling, processors have
    at least one input pin which allows I/O devices to signal the processor when they
    need the processor to do something. Such a pin is called an *interrupt pin*. An
    interrupt pin makes it possible for an I/O device to initiate communication with
    the CPU. A CPU without an interrupt pin has been compared to a telephone without
    a bell.


    Suppose that a printer is connected to an interrupt pin on the CPU, as shown in
    Figure 9-1. With the printer hooked up to the CPU in this way, the CPU would be
    able to ignore the printer until it received a signal. It could then process a
    printer character and return to its main job. There would be relatively little
    wasted time. This setup would work fine if the printer were the only I/O device
    which ever needed attention. But of course there are many such devices.


    # Figure 9-1. A Computer with Only One Interrupt


    ![](img/165a4f637c5eaccb372f5a82ca458a05_118_0.png)


    To allow for several I/O devices, one might expect there to be several interrupt
    pins on the processor. The x86 architecture does not do things this way. It has
    only one general-purpose interrupt pin. It delegates the arbitration of interrupt
    signals to an external circuit called the *interrupt controller circuit*, as shown
    in Figure 9-2. This figure also shows an IRQ bus from the I/O system to the interrupt
    controller circuit. An IRQ bus consists of wires from various I/O devices. Each
    device that needs interrupt service is given one of the wires on this bus, assuming
    that there are enough of them to go around, that is. The IRQ bus wires are numbered
    IRQ0, IRQ1, etc. IRQ stands for *interrupt request* line. The numbers 0, 1, etc.,
    encountered in this context are called *IRQ numbers*.


    # Figure 9-2. A Computer with an Interrupt Controller


    ![](img/165a4f637c5eaccb372f5a82ca458a05_118_1.png)


    The interrupt controller allows several I/O devices to have a signal path to the
    CPU even though the x86 has only one general-purpose interrupt pin.


    # 9.2.1 x86 Interrupt Handling


    When an x86 processor receives an interrupt signal, it first completes the instruction
    it is currently working on. Then, provided a special flag has not been cleared,
    it handles the interrupt in three steps.


    **Step 1.**


    It reads the number of the interrupt responsible for the interrupt signal from
    the interrupt controller.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '**Step 2.**


    It fetches the address of the correct interrupt service routine from the interrupt
    table in memory.


    **Step 3.**


    It transfers control to the interrupt service routine.


    Once the interrupt has been handled, it resumes processing where it left off.
    Interrupt service routines are somewhat like ordinary subroutines. One important
    difference is that they are called on signal from the hardware.


    **The Interrupt Acknowledge Bus Cycle**


    Since the x86 receives its general interrupts all via one pin, it cannot tell
    from a single "knock on the door" which I/O device is signaling for attention.
    As shown in *Figure 9-2*, the interrupt controller circuit is connected to the
    data bus just like memory and I/O. To get the required identification from the
    interrupt controller, the processor performs a read, which is analogous to a memory
    or an I/O read. It is called the *interrupt acknowledge bus cycle*. Just as the
    processor uses the M/IO# pin to indicate whether it is commanding a memory or
    an I/O read, it uses the D/C# pin to distinguish an I/O controller read from the
    memory and I/O read cycles. D is for data and C is for code. The complete list
    of the bus cycles defined by the D/C#, M/IO#, and W/R# pins is given in *Table
    9.1*.


    When the processor receives an interrupt, it initiates an interrupt acknowledge
    bus cycle. Only the interrupt controller may respond to an interrupt acknowledge
    bus cycle. It responds by depositing a one-byte number on the bottom eight bits
    of the data bus. This number is called the *interrupt number*. It is not the same
    as an IRQ number. The processor reads the interrupt number off the data bus.


    Table 9.1. 486 Bus Cycle Definition Pins


    | | D/C# | M/IO# | W/R# |

    | :--- | :---: | :---: | :---: |

    | Interrupt Acknowledge | 0 | 0 | 0 |

    | Halt/Special Cycle | 0 | 0 | 1 |

    | Code Read | 0 | 1 | 0 |

    | reserved | 0 | 1 | 1 |

    | I/O Read | 1 | 0 | 0 |

    | I/O Write | 1 | 0 | 1 |

    | Memory Read | 1 | 1 | 0 |

    | Memory Write | 1 | 1 | 1 |


    **ISR Address Fetching**


    The processor then takes this number and uses it as an index into a table called
    the Interrupt Descriptor Table. This table contains the addresses of the Interrupt
    Service Routines. See Figure 9-3. Since the interrupt number is an eight-bit number,
    the valid interrupt numbers range from 0 to 255.


    Figure 9-3. Interrupt Descriptor Table, b = IDT register


    **Address**


    | *b* | **Gate # 0** |

    | :---: | :---: |

    | *b* + 8 | **Gate # 1** |

    | *b* + 16 | **Gate # 2** |

    | *b* + 24 | |'
