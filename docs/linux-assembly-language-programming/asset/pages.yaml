  img_proc: true
- pgno: 67
  md: 'Because these various jump commands are so easily interpreted, they turn the
    compare command into a kind of syntactical windfall.


    # 4.7 Unsigned Comparisons


    In section 4.6 it was shown how flags could be used to determine the truth values
    of inequalities so that these inequalities could be used in conditional jumps.
    The conditions obtained work for unsigned numbers.


    But suppose we consider the same example


    ### 100 < -50


    that we considered in the last section and note that when this same inequality
    is stated in terms of unsigned numbers it becomes


    ### 100 < 206


    This inequality has the opposite truth value. So a "jump if less than" command
    for unsigned numbers must execute a jump in this case. The $J_{L}$ command will
    not do so. The signed jump commands of the previous section do not work for unsigned
    numbers. If $AL = 64H = 100$ and $BL = CEH = 206$, then a $J_{L}$ will not execute
    a jump because it is acting on $100 < -50$. An unsigned "jump if less than" is
    needed.


    # 4.7.1 The Carry Flag


    In the case of unsigned numbers, the inequality $A < B$ turns out to be easier
    to test than its signed counterpart. Since a subtraction of unsigned numbers $A
    - B$ cannot go out of range on the high side, it is out of range if and only if
    it is negative. Out of range errors for unsigned numbers are called *carry errors*.
    Hence $A < B$ is true if and only if the subtraction $A - B$ produces a carry
    error. So a flag which signals carry errors will signal negative results of a
    subtraction. The x86 processors have a carry flag to indicate these errors. Using
    $CF$ to denote the value of this carry flag, we can easily state the condition
    used to implement the unsigned "jump if less than" command as "jump if $CF$."


    Like the sign flag, the zero flag, and the overflow flag, the carry flag responds
    to conditions occurring whenever $ADD$ or $SUB$ are used. Unlike these other three
    flags, it is unaffected by the $INC$ and $DEC$ commands.


    # 4.7.2 Out of Range Flag Summary


    Arithmetic commands such as $ADD$ and $SUB$ are performed on binary bits without
    any information specifying whether the bits are being used to represent signed
    or unsigned numbers. It is the responsibility of the software to keep track of
    this.


    When the software uses the processor to do arithmetic on signed numbers, then
    it should consult the overflow flag to determine whether or not an out of range
    error has occurred. When the software uses the processor to work on unsigned numbers,
    then the software should consult the carry flag to check for an out of range error.


    The hardware has no way of knowing whether the numbers are signed or unsigned.
    And it doesn''t matter.


    For example, on one-byte registers the command to add $FFH$ to $FFH$ may be coming
    from software that is working with signed numbers. In this case the sum $FEH$
    is not a problem. The software sees the arithmetic that has just happened as


    ### -1 + -1 = -2.'
