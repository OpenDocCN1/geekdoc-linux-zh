    \    32\n     8\n```\n\nTo demonstrate the easy convertibility of base two into\
    \ base sixteen, we again consider the number 1000, only this time we convert it\
    \ into base two:\n\n```\n500 0     250 00    125 000    62 1000\n2)1000    2)500\
    \     2)250      2)125\n   1000      500       250        124\n    0         0\
    \         0          1\n\n31 01000   15 101000    7 1101000\n2)62      2)31  \
    \       2)15\n   62        30          14\n    0         1          1\n\n3 11101000\
    \   1 111101000   0 1111101000\n2)7         2)3            2)1\n   6         \
    \ 2             0\n   1          1             1\n```\n\nThe fact that dividing\
    \ by 2 four times is essentially the same thing as dividing by 16 suggests that\
    \ four stages of this conversion must correspond to one stage of hexadecimal conversion.\
    \ If we group the binary digits into fours, we do in fact observe this relationship.\n\
    \n|       |       |        |\n|-------|-------|--------|\n| 11    | 1110  | 1000\
