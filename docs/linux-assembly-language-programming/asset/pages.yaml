- pgno: 106
  md: 'As just explained in section 8.3.3, a table entry for this address is obtained.
    This entry is four bytes in size. Its least significant bit is called the present
    bit. In the diagram shown here, it is marked "P P" for page present.


    When the present bit is set, it means that the sought after page is located in
    RAM. In this case the calling program is lucky and the page table entry just read
    provides the physical address of the page containing the required byte. Since
    all page frames in physical memory are stored at addresses whose bottom 12 bits
    are zero, the address can be given using its upper 20 bits. That is what the top
    20 bits of the page table entry provide. Once the address of the page is determined,
    the memory read is completed as shown in section 8.3.3.


    # 8.3.5 Memory Protection


    When the present bit is not set, there are two possibilities:


    +   1. It may mean that the page containing the sought after byte is located on
    disk. In this case, a Page Fault results.

    +   2. It may also mean that the address is not valid at all! In this case, a
    Segmentation Fault results.


    The first possibility is no surprise. The idea of paging is to put some memory
    pages out onto the disk. When a program tries to access them, this is of course
    a problem. Problems like this are dealt with in chapter 9, section 9.4.


    The second possibility is somewhat foreign to the idea of paging as a memory economizing
    feature. But it brings out exactly what we mean when we say that Linux uses paging
    to "protect" memory. Because the page tables are under the control of the operating
    system, it gives the operating system an opportunity to intercept every single
    memory request. This is how Linux keeps potentially overwhelming demands for memory
    under control. Only addresses on pages which it has allocated to processes will
    have the present bit in the page tables set. Any reference to an unallocated page
    results in the dreaded "Segmentation Fault" error message.


    # 8.3.6 The CR3 Register


    Translation begins at the page table table. Each task has its own page table table.
    The physical address of the page table table is stored in a register called CR3.
    CR stands for control register. The control registers were added to the x86 processors
    starting with the 386. For more discussion of these registers see chapter 13,
    section 13.1.


    CR3 is reloaded automatically every time the x86 processor changes from one task
    to another. This is what makes it possible for each task to have its own set of
    virtual addresses. The kernel memory in the last one-fourth of the address space
    (see section 8.2.3) is there because Linux puts it there. This address space is
    shared because the page tables which translate these addresses are shared. The
    last one-quarter of every page table table on the system is identical.


    # 8.3.7 Kernel Memory Access


    The fact that kernel addresses are stored in all the page tables on the system
    might lead us to believe that kernel memory can be used by all processes on the
    system. In a way this is true. In chapter 9, section 9.7 we will see how user
    code may invoke system calls to get access to kernel memory. However, user code
    by itself does not have this kind of access. It is blocked by the U_S user-supervisor
    bit of the table entries for kernel memory. (See Figure 8-8.)


    ![](img/165a4f637c5eaccb372f5a82ca458a05_106_0.png)'
