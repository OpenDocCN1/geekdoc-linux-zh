    | Codes for 8-Bit Registers |

    | :---: | :---: |

    | AL | 000 | AH | 100 |

    | CL | 001 | CH | 101 |

    | DL | 010 | DH | 110 |

    | BL | 011 | BH | 111 |


    the entry in the first chart for the code 89:


    ```

    MOV

    \_rmv,r\_v

    ```


    The v in each operand marker stands for variable where variable refers to the
    fact that the size may be either 16 or 32 bits. Similarly the e in register designations
    such as eax refers to the fact that in 32-bit coding EAX is intended and in 16-bit
    coding AX is intended.


    # 5.6 The 8-Bit Registers


    Although the 32-bit and 16-bit register commands are forced to share opcodes,
    the eight-bit registers generally have dedicated opcodes. For example, the opcode
    8A designates an eight-bit MOV instruction. The entry in Table 5.2 for 8A is


    ```

    MOV

    \_rb,rmb

    ```


    rb stands for register byte and is coded for in the register bits of the ModRM
    byte. rmb stands for register or memory byte and is coded for in the memory bits
    of the ModRM byte. 8A C1 is the code for MOV AL, CL. Table 5.7 lists the eight-bit
    register codes. The code for CL goes into the M bits and the code for AL goes
    into the R bits.


    | Mod | R | M |

    | :---: | :---: | :---: |

    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | 1 | 1 | 0 | 0 | 0 | 0 | 0 | 1 |


    Combining the two bytes yields 8A C1.


    # 5.7 Linux . o Files


    Programs in C which include calls to functions such as printf() or scanf() require
    linking to the compiled code for these functions. This code is stored in libraries
    such as libc.so. Once this linking is done, the program becomes much longer. In
    order to examine the machine code of a program, it is easier to look at the code
    before this linking is done because there is so much less of it. This code is
    stored in object modules with a . o file extension. The analogous files in DOS
    are the .OBJ files. To instruct the gnu C compiler to produce a . o file, the
    -c switch can be used. The command


    ```

    linuxbox$ gcc -c mult.c

    ```


    produces a mult.o file. This file contains the machine code of the program, in
    addition to tables which allow the linker to do its job.


    To examine an object code file, one may use either the ob program (object dump)
    which comes with this book or the od program (octal dump) which is a standard
    Unix utility. To get od to display in hex, use the switches -tx and -Ax.


    ```

    linuxbox$ od -tx -Ax mult.o

    ```'
