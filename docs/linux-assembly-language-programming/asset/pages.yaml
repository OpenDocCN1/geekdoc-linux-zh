    \ The modified file was compiled using using gcc.\n\n```\nlinuxbox$ gcc mult.s\n\
    ```\n\nThe resulting program was run and the computation of $5 \\times -7$ took\
    \ 76.14 seconds on the same machine.\n\n# **4.8.1 The Pentium's Dual Pipeline**\n\
    \nIf we look at the time for each instruction to execute, in the first case we\
    \ get\n\n![](img/165a4f637c5eaccb372f5a82ca458a05_70_0.png)\n\nThis arithmetic\
    \ assumes that the program spent all of its time in the loop. Comparing this with\
    \ the length of one clock cycle,\n\n![](img/165a4f637c5eaccb372f5a82ca458a05_70_1.png)\n\
    \nwe find the amazing result that the time for two instructions to execute, 8.606\
    \ nanoseconds, is just a little over one clock cycle. Since one instruction per\
    \ clock cycle is ideal under ordinary circumstances, what we have here is something\
    \ special. It is an illustration of the Pentium's dual pipeline. When possible,\
    \ the Pentium pairs instructions off and executes two at once. This is how rates\
    \ of more than one instruction per clock cycle can be achieved. (There is actually\
    \ another pipeline for floating point numbers.) The instruction pairing also explains\
    \ why the 2:1 improvement we might have expected when we reduced the number of\
    \ instructions in the loop from six to three did not materialize. What happened\
    \ apparently was that the number of instruction pairs went from three to two,\
    \ one of the two \"pairs\" being half-empty. The time 76.14 nanoseconds is .687\
    \ of 110.9 nanoseconds. This is approximately two-thirds, suggesting the use of\
    \ two instruction pairs instead of three for each pass through the loop.\n\n#\
    \ **Chapter 5. MACHINE LANGUAGE**\n\nMachine language is the language seen by\
    \ the processor. The bytes fetched in the fetch-execute cycle are bytes of machine\
    \ code. Assembly language can be defined as language which gives the programmer\
    \ control over the machine code. Assembly language specifies machine code. This\
    \ characteristic feature of assembly language will not be apparent without some\
    \ familiarity with machine language. In this chapter the main features of x86\
