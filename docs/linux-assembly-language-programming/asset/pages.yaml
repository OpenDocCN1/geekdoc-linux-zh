    | -9 | 99,991 |

    | -10 | 99,990 |

    | -11 | 99,989 |

    | -12 | 99,988 |

    | ... | ... |

    | etc. | |


    The obvious solution is x = -5. However, there is an odometer interpretation of
    this equation as well. Suppose you drive 10 miles in your car and the odometer
    reads 5 when you finish, then what did it read when you began? It must have read
    99.995. Similarly if you have a car whose odometer reads 10 miles and you drive
    it 99.995 miles (!) then the odometer should read 5 miles when you finish. The
    point here is that 99.995 acts just like -5 when added on the odometer. Table
    3.8 shows what odometer negatives look like. Notice that to get the number that
    works as the negative of a number x, you subtract x from 100,000.


    Arithmetic on the odometer works this way because the odometer turns over at 100,000
    miles. Computer registers turn over also— but not at 100,000.


    # 3.6.4 Register Arithmetic


    A four-bit register turns over at binary 1 0000 = 24 = 16. The table of negatives
    for a four-bit register can easily be listed completely. See Table 3.9. The only
    difference between this table and the odometer table is that 16 is a lot smaller
    than 100,000. As with the odometer, you can use subtraction instead of the table
    to find the number which works as the negative of some number x. In the case of
    a four-bit register, you subtract x from 16 instead of from 100,000. Otherwise
    it is the same.


    But in one respect, Table 3.9 is a little alarming. For example, it gives us the
    fact that 11 works the same as -5. This means we now have a serious ambiguity.
    If a four-bit register contains 1011, we cannot tell whether this actually means
    11 or -5. Some convention is needed. The convention that is used is to take the
    first bit as a kind of sign bit. When the first bit is 0, the number is positive
    (or zero). When the first bit is 1, the number is negative. The resulting system
    is called the two''s complement system. When the two''s complement system is used,
    the ambiguity is


