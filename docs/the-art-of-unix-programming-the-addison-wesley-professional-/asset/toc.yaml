  - 1.6 Unix 哲学的要素
- - '###'
  - 1.6.1 模块化规则：编写通过清洁接口连接的简单部分。
- - '###'
  - 1.6.2 清晰规则：清晰优于巧妙。
- - '###'
  - 1.6.3 组合规则：设计能够与其他程序连接的程序。
- - '###'
  - 1.6.4 分离规则：将策略与机制分离；将接口与引擎分离。
- - '###'
  - 1.6.5 简单规则：为了简单而设计；仅在必须时如此。
- - '###'
  - 1.6.6 节约规则：只有在明确证明没有其他方案时，才编写大型程序。
- - '###'
  - 1.6.7 透明性规则：为了可见性而设计，以便更容易检查和调试。
- - '###'
  - 1.6.8 健壮性规则：健壮性是透明性和简单性的孩子。
- - '##'
  - 1.7 Unix 哲学基础
- - '###'
  - 1.7.9 表示规则：将知识折叠到数据中，让程序逻辑变得愚蠢且健壮。
- - '###'
  - 1.7.10 最小惊讶规则：在接口设计中，始终选择最不惊讶的事。
- - '###'
  - 1.7.11 沉默规则：当程序无话可说时，它应该保持沉默。
- - '###'
  - 1.7.12 优化规则：先原型后打磨。在优化之前，先让它运行起来。
- - '###'
  - 1.7.13 多样性规则：不信任任何关于“唯一正确途径”的主张。
- - '###'
  - 1.7.14 可扩展性规则：为未来设计，因为它会比你想象的要早得多。
