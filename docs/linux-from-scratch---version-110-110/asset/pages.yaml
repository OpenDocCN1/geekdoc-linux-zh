  md: '# 70. Man-DB-2.9.4


    The Man-DB package contains programs for finding and viewing man pages.

    Approximate build time: 0.4 SBU

    Required disk space: 38 MB


    # 8.70.1. Installation of Man-DB


    Prepare Man-DB for compilation:


    ```

    ./configure --prefix=/usr

    --doccdir=/usr/share/doc/man-db-2.9.4

    --sysconfdir=/etc

    --disable-setuid

    --enable-cache-owner=bin

    --with-browser=/usr/bin/lynx

    --with-vgrind=/usr/bin/vgrind

    --with-grap=/usr/bin/grap

    --with-systemdtmpfilesdir=

    --with-systemdunitdir=

    ```


    The meaning of the configure options:


    +   --disable-setuid

    This disables making the man program setuid to user man.

    --enable-cache-owner=bin

    This makes the system-wide cache files be owned by user bin.

    --with-...


    These parameters are used to set default parameters. lynx is a text-based browser
    (as BLFS for installation instructions), vgrind converts programs to Groff input,
    and grap is useful for typesetting graphs in Groff documents. The vgrind and grap
    programs are not normally needed for viewing manual pages. They are not part of
    LFS or BLFS, but you should install them yourself after finishing LFS if you wish
    to do so.

    --with-systemd...


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make check

    ```


    Install the package:


    ```

    make install

    ```


    # 8.70.2. Non-English Manual Pages in LFS


    The following table shows the character set that Man-DB assumes manual pages installed
    under /usr/share/man/<11> will be encoded. In addition to this, Man-DB correctly
    determines if manual pages installed in that directory are UTF-8 encoded.'
