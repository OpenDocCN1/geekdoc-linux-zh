  md: '# 1.5.3. Compilation Problems


    Both the screen output and the contents of various files are useful in determining
    the cause of compilation problems. The screen output from the `configure` script
    and the `make` run can be helpful. It is not necessary to include the entire output,
    but do include enough of the relevant information. Below is an example of the
    type of information to include from the screen output from `make`:


    ```

    gcc -DALIASPATH="/mnt/lfs/usr/share/locale:"

    -DLOCALEDIR="/mnt/lfs/usr/share/locale"

    -LLDBDIR="/mnt/lfs/usr/lib"

    -DINCLUDEDIR="/mnt/lfs/usr/include" -DHAVE_CONFIG_H -I. -I.

    -g -o2 -c getoptl.c

    gcc -g2 -static make ar arscan commands.o dir.o

    expand.o file.o function.o signature.o implicit.o job.o main.o

    misc.o read.me rule.o variable.o vpath.o

    default.o remote-sub.version.o optl.o

    -lutil job:`load_too_high`:n`/lfs/tmp/make-3.79.1/job.c:1565: undefined reference

    to `getloadvay`

    collect2: ld returned 1 exit status

    make[2]: *** [make] Error 1

    make[2]: Leaving directory `/lfs/tmp/make-3.79.1/

    make[1]: *** [all-recursive] Error 1

    make[1]: Leaving directory `/lfs/tmp/make-3.79.1/

    make: *** [all-recursive] Error 2

    ```


    In this case, many people would just include the bottom section:


    ```

    make [2]: *** [make] Error 1

    ```


    This is not enough to properly diagnose the problem because it only notes something
    went wrong, not what went wrong. The entire section, as in the example above,
    is what should be saved because it includes the command that was executed and
    the associated error message(s).


    An excellent article asking for help on the Internet is available online at http://catb.org/-esr/faqs/smart-questions.html.
    Read and follow the hints in this document to increase the likelihood of getting
    the help you need.'
