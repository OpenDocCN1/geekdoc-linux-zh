  md: 'A few operations, from "Changing Ownership" to "Entering the Chroot Environment"
    must be done for the root user, with LFS environment variable set for the rootuser.


    When entering chroot, the LFS environment variable must be set for root. The LFS
    variable is not used afterwards.


    The virtual file systems must be mounted. This can be done before or after entering
    chroot by changing to a host virtual terminal, and as root, running the commands
    in Section 7.3.2, "Mounting and Populating /dev" and Section 7.3.3, "Mounting
    Virtual Kernel Systems".


    # 2.4. Creating a New Partition


    Like most operating systems, LFS is usually installed on a dedicated partition.
    The recommended approach to building an LFS system is to use an empty partition,
    or create one.


    A minimal system requires a partition of 10 gigabytes (GB). This is enough to
    store all the source tarballs and compile the packages. However, if the LFS system
    is intended to be the primary Linux system, additional software will probably
    be installed which will require additional space. A 30 GB partition is a reasonable
    size to provide for growth. The LFS system itself will not take up much room.
    A large partition is required to provide free temporary storage as well as for
    adding capabilities after LFS is complete. Additionally, compiling packages requires
    a lot of disk space which will be reclaimed after the package is installed.


    Because there is not always enough Random Access Memory (RAM) for compilation
    processes, it is a good idea to use a small disk partition as swap space. The
    swap is used by the kernel to store seldomused data and leave more memory for
    active processes. The swap partition for LFS can be the same as the one used by
    the host system, in case it is not necessary to create another.


    Start a partition program such as cfdisk or fdisk with a command option naming
    the hard disk on the new partition will be created—for example /dev/sda for the
    primary disk drive. Create a Linux partition and a swap partition, if needed.
    Please refer to cfdisk (8) or fdisk (8) if you do not know how to use the programs.


    > For experienced users, other partitioning schemes are possible. The new LFS
    system can be on a software RAID array or an LVM logical volume. However, some
    of these require an advanced topic. These partitioning methodologies are not recommended
    for first time LFS users.


    Remember the designation of the new partition (e.g., sda5). This book will refer
    to this LFS partition. Also remember the designation of the swap partition. These
    names will be needed later for the /etc/fstab file.


    # 2.4.1. Other Partition Issues


    Requests for advice on system partitioning are often posted on the LFS mailing
    lists. This is a highly subjective topic. The default for most distributions is
    to use the entire drive with the exception of one swap partition. This is not
    optimal for LFS for several reasons. It reduces flexibility, makes sharing of
    data across multiple distributions or LFS builds difficult, backups more time
    consuming, and can waste disk space through inefficient allocation of file system
    structures.


    # 2.4.1.1. The Root Partition


    A root LFS partition (not to be confused with the /root directory) of twenty gigabytes
    is a good compromise for most systems. It provides enough space to build LFS and
    most of BLFS, but is small enough that many partitions can be easily created for
    experimentation.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# 2.4.1.2. The Swap Partition


    Most distributions automatically create a swap partition. Generally the recommended
    size of the swap partition is about twice the size of physical RAM, however this
    is rarely needed. If disk space is limited, hold the swap partition to two gigabytes
    and monitor the amount of disk swapping.


    If you want the hibernation feature (suspend-to-disk) of Linux, it writes the
    contents of RAM to the partition before turning off the machine. In this case
    the size of the swap partition should be at least as large as the system''installed
    RAM.


    Swapping is never good. For mechanical drives you can generally tell if a system
    is swapping by listening to disk activity and observing how the system reacts
    to commands. For an SSD you will not be able to hear swapping but you can tell
    how much space is being used by the top or free programs. Use of an SSD for a
    swap partition should be avoided if possible. The first reaction to swapping should
    be to check for an unreasonable command as trying to edit a five gigabyte file.
    If swapping becomes a normal occurrence, the best solution is to purchase more
    RAM for your system.


    # 2.4.1.3. The Grub Bios Partition


    If the boot disk has been partitioned with a GUID Partition Table (GPT), then
    a small, typically 1 MB, partition must be created if it does not already exist.
    This partition is not formatted, but must be available for GRUB for using installation
    of the boot loader. This partition will normally be labeled ''BIOS Boot'' if using
    fdisk or have a code of EF02 using gdisk.


    > The Grub Bios partition must be on the drive that the BIOS uses to boot the
    system. This is not necessarily the same drive where the LFS root partition is
    located. Disks on a system may use different partition table types. The requirement
    for this partition depends only on the partition type of the boot disk.


    # 2.4.1.4. Convenience Partitions


    There are other partitions that are not required, but should be considered when
    designing a disk layout. The following list is not comprehensive, but meant as
    a guide.


    +   - Highly recommended. Use this partition to store kernels and other booting
    information. To minimize potential problems with larger disks, make this first
    partition on your first disk drive. A partition of size 200 megabytes is quite
    adequate.

    - Highly recommended. Share your home directory and customization across multiple
    distributions or LFS builds. The size is generally large and depends on available
    disk space.

    - In LFS, /bin, /lib, and /sbin are symbols to their counterpart in /usr. So /usr
    contains all binaries needed for the system to run. For LFS a separate partition
    for /usr is normally not needed. If you need it, you should make a partition large
    enough to fit all programs and libraries in the system. The root partition can
    be very small (maybe just one gigabyte) in this configuration, it is suitable
    for a client or diskless workstation (where /usr is mounted from a remote server).
    However you care that initrams (not covered by LFS) will be needed to boot a system
    with separate /usr partition.

    - This directory is most useful for BLFS when multiple installations of large
    packages like Gnome or KDE can be installed without embedding the files in the
    /usr hierarchy. If used, 5 to 10 gigabytes is generally adequate.'
  merge: -1
