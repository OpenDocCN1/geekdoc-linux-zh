  md: 'Linux From Scratch - Version 11.0


    target

    is only used for compilers. It is the machine compiler produces code for. It may
    be different from both build

    hand host.


    As an example, let us imagine the following scenario (sometimes referred to as
    "Canadian Cross"); we may have a\compiler on a slow machine one, let''s call the
    machine A, and the compiler ccA. We may have also a fast machine

    (B), but with no compiler, and we may want to produce code for another slow machine
    (C). To build a compiler for

    machine C, we would have three stages:


    | Stage | Build | Host | Target | Action |

    | 1 | A | A | B | build cross-compiler cc1 using ccA on machine A |

    | 2 | A | B | C | build cross-compiler cc2 using machine A |

    | 3 | B | C | C | build compiler ccC using cc2 on machine B |


    Then, all the other programs needed by machine C can be compiled using cc2 on
    the fast machine B. Note that unless

    B can run programs produced for C, there is no way to test the built programs
    until machine C itself is running. For

    example, for testing ccC, we may want to add a fourth stage:


    | Stage | Build | Host | Target | Action |

    | 4 | C | C | C | rebuild and test ccC using itself on machine C |


    In the example above, only cc1 and cc2 are cross-compilers, that is, they produce
    code for a machine different from the

    one they are run on. The other compilers ccA and ccC produce code for the machine
    they are run on. Such compilers

    are called native compilers.


