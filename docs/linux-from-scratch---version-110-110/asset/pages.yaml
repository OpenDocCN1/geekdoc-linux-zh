    To remove the "h no name!", start a new shell. Since the /etc/passwd and /etc/group
    files have been created, your user name and group name resolution will work:


    ```

    exec /bin/bash --login +h

    ```


    Note the use of the -h directive. This tells bash not to use its internal path
    hashing. Without this directive, bash would remember the paths to binaries it
    has executed. To ensure the use of the newly compiled binaries as soon as they
    are installed, the -h directive will be used for the duration of this and the
    next chapter.


    The login, aget, and init programs (and others) use a number of log files to record
    information such as who was logged into the system and when. However, these programs
    will not write to the log files if they do not already exist. Initialize the log
    files and give them proper permissions:


    ```

    touch /var/log/{btmp, lastlog, faillog, wtmp}

    chgrp -v utmp /var/log/lastlog

    chmod -v 664 /var/log/lastlog

    chmod -v 600 /var/log/btmp

    ```


    The /var/log/wtmp file records all logins and logouts. The /var/log/lastlog file
    records when each user last logged in. The /var/log/faillog file records failed
    login attempts. The /var/log/btmp file records bad login attempts.


    > Note

    The /run/utmp file records the users that are currently logged in. This file is
    created dynamically in the boot scripts.


