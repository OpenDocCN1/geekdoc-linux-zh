  md: '# 5.6. Libstdcc++ from GCC-11.2.0, Pass 1


    Libstdcc++ is the standard C++ library. It is needed to compile C++ code (part
    of GCC is written in C++), but we had to defer its implementation when we built
    gcc-pass1 because it depends on glibc, which was not yet available in the target
    directory.


    Approximate build time: 0.4 SBU

    Required disk space: 1.0 GB


    # 5.6.1. Installation of Target libstdcc+


    > Note

    Libstdcc++ is part of the GCC sources. You should first unpack the GCC tarball
    and change it to the gcc-11.2.0 directory.


    Create a separate build directory for libstdcc++ and enter it:


    ```

    mkdir -v build

    cd build

    ```


    Prepare libstdcc++ for compilation:


    ```

    ./libstdcc++-v3/configure \

    --host=$LFS_TGT \

    --build=$(../config.guess) \

    --prefix=/usr \

    --disable-multilib \

    --disable-nls \

    --disable-libstdccxx-pch \

    --with-gxx-include-dir=/tools/$LFS_TGT/include/c++/11.2.0

    ```


    The meaning of the options:


    ```

    --host=...

    --disable-libstdccxx-pch

    --with-gxx-include-dir=/tools/$LFS_TGT/include/c++/11.2.0

    ```


    Specifies the cross compiler we have just built instead of the one in /usr/bin.

    This switch prevents the installation of precompiled files, which are not needed
    at this stage.

    This is the location where the C++ compiler should search for the standard include
    files. In a normal build, this information is automatically passed to the libstdcc++
    configure options from the top level directory. In our case, this information
    must be explicitly given.


    Compile libstdcc++ by running:


    ```

    make

    ```


    Install the library:


    ```

    make DESTDIR=$LFS install

    ```


    Details on this package are located in Section 8.26.2, “Contents of GCC.”'
