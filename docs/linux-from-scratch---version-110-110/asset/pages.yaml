  md: '# # 10.4. Using GRUB to Set Up the Boot Process


    > > Note: If your system has UEFI support and you wish to boot LFS with UEFI,
    you should skip this page, and config GRUB with UEFI support using the instructions
    provided in the BLFS page.


    # ## 10.4.1. Introduction


    > > Warning: Configuring GRUB incorrectly can render your system inoperable without
    another boot device such as a CD-ROM or bootable USB drive. This section is not
    required to boot your LFS system. You may just want to modify your boot loader,
    e.g. Grub-Legacy, GRUB2, or LILO.


    Ensure that an emergency boot disk is ready to “rescue” the computer if the computer
    becomes unusable (unbootable). If you do not have a boot device, you can create
    one. In order for the procedure below to work, you need to jump ahead to BLFS
    and install the libosburn package.


    ```

    cd /Tmp

    grub-mkrescue --output=grub-img.iso

    xorriso -as cdrmarc -v dev=/dev/cdrw blank=as_needed grub-img.iso

    ```


    # ## 10.4.2. GRUB Naming Conventions


    GRUB uses its own naming structure for drives and partitions in the form of (hdn,m),
    where n is the hard drive number and m is the partition number. The hard drive
    number starts from zero, but the partition number starts from one for normal partitions
    and five for extended partitions. Note that this is different from earlier versions
    where both numbers started from zero. For example, partition da1 is (hd0,1) to
    GRUB and sdb3 is (hd1,3). In contrast, Linux, GRUB does not consider CD-ROMs to
    be drives. For example, if you have a CD on a second hard drive on hdc, that second
    hard drive would be hdb1 (hd2,1).


    # ## 10.4.3. Setting Up the Configuration


    GRUB works by writing data to the first partition of the hard drive. This area
    is not part of any file system. The programs access GRUB modules in the boot partition.
    The default location is /boot/grub.

    The recommendation is to use a small separate (suggested size 200 MB) partition
    for boot information. That way each build, LFS or some commercial distro, can
    access the same boot files and access can be made from any booted system. If you
    choose to do this, you must mount the separate partition, move all files in the
    current /boot directory (e.g the linux kernel you built in the previous section)
    to the new partition. You will then need to update the partition and remount it
    as /boot. If you do, this is to update /etc/fstab.


    Using the current L partition will also work, but configuration for multiple systems
    is more difficult.

    Using the above information, determine the appropriate designation for the root
    partition (or boot partition, if a separate one is used). For the example, it
    is assumed that the root (or separate boot) partition is sda2.

    Install the GRUB files into /boot/grub and set up the boot track:'
