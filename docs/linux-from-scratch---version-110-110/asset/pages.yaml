    export ...

    While the above commands set some variables, in order to make them visible within
    any sub-shells, we

    export them.


    > Important

    Several commercial distributions add a non-documented instantiation of /etc/bash.bashrc
    to the

    initalization of bash. This file has the potential to modify the lfs user''s environment
    in ways that can

    afect the building of critical LFS packages. To make sure the LFS user''s environment
    is clean, check the

    presence of /etc/bash.bashrc and, move it out of the way. As the root user, run:


    ```

    [ ! -e /etc/bash.bashrc ] || mv -v /etc/bash.bashrc /etc/bash.bashrc.NOISE

    ```


    After use the lfs user is finished at the beginning of Chapter 7, you can restore
    /etc/bash.bashrc

    (if desired).


    Note that the LFS package we will build in Section 8.34, "Bash-5.1.2" is not configured
    to load or

    execute /etc/bash.bashrc, so this file is useless in a completed LFS system.


    Finally, to have the environment fully prepared for building the temporary tools,
    source the just-created user profile:


    ```

    source ~/.bash_profile

