  md: '# Linux From Scratch - Version 11.0


    A good hint explaining how to deal with TFS is available at https://www.linuxfromscratch.com/hints/downloads/files/time.txt.
    It explains such as time zones, UTC, and the TZ environment variable.


    # Note


    The CLOCKPARAMS and UTC parameters may also be set in the /etc/sysconfig/rc.site
    file.


    # ## 9.6.5. Configuring the Linux Console


    This section discusses how to configure the console bootstrap sets up the keyboard
    map, console font, and console kernel level. For non-ASCII characters (e.g., the
    copyright sign, the British pound and Euro symbol) will be used and the keyboard
    is a U.S. one, much of this can be skipped. Without the configuration (or equivalent
    settings in rc.site), the console bootstrap will do nothing.


    The /etc/sysconfig/console file should contain lines of the form: VARIABLE="value".
    The following variables are recognized:


    # LOGLEVEL


    This variable specifies the log level for kernel messages sent to the console
    as set by dmesg -n. Valid ranges are from "1" (no messages) to "8". The default
    level is "7".


    # KEYMAP


    This variable specifies the arguments for the loadkeys program, typically the
    name of keymap to load, e.g., "it". If variable is not set, the bootscript will
    not run the loadkeys program, and the default kernel keymap will be used. Note
    that a few keymaps have multiple versions with the same name (cz and its variants
    in qwerty/ and qwerty/ in olpc and trf in fGlod and qwerty/). In these cases the
    parent directory should also be specified (e.g. qwerty/) to ensure the proper
    keymap is loaded.


    # KEYMAP_CORRECTIONS


    This (rarely used) variable specifies the arguments for the loadkeys program.
    This is useful if the key map is not completely satisfactory and a small adjustment
    must be made. E.g., to include the Euro sign into a keymap that normally doesn''t
    have it, set this variable to "euro2".


    # FONT


    This variable specifies the arguments for the setfont program. Typically, this
    includes the font name, "m", and the name of the application character map to
    load. E.g., in order to load the "lat16" font together with the "8859-1" character
    map (as it is appropriate in the USA), set this variable to lat16 -m 8859-1. In
    UTF-8 mode, the kernel uses the application character map for conversion of 8-bit
    code in the keymap to UTF-8, and thus the argument of "-m" parameter should be
    set to the encoding of the composed key codes in the keymap.


    # UNICODE


    Set this variable to "1", "yes" or "true" in order to put the console into UTF-8
    mode. This is useful in UTF-8 based locales and harmful otherwise.


    244'
