    Now make sure that we''re set up to use the correct starts:


    ```

    grep -o ''/usr/lib.*crt[1]. *succeeded'' dummy.log

    ```


    The output of the last command should be:


    ```

    /usr/lib/gcc/x86_64-pc-linux-gnu-11.2.0/../../..//lib/crt1.o succeeded

    /usr/lib/gcc/x86_64-pc-linux-gnu-11.2.0/../../..//lib/crti.o succeeded

    /usr/lib/gcc/x86_64-pc-linux-gnu-11.2.0/../../..//lib/crtn.o succeeded

    ```


    Depending on your machine architecture, the above may differ slightly. The difference
    will be the name of the directory under /usr/lib/gcc. The important thing to look
    for is that gcc has all three crt*.o files under the /usr/lib directory.


