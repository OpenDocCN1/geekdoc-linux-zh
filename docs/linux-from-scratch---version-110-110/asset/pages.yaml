  md: '# ## 8.15. Tcl-8.6.11


    The Tcl package contains the Tool Command Language, a robust general-purpose scripting
    language. The Expect package is written in the Tcl language.


    **Approximate build time:** 3.7 SBU

    Required disk space:** 80 MB


    # ### 8.15.1. Installation of Tcl


    This package and the next two (Expect and DejaGNU) are installed to support running
    the test suites for binutils and GCC and other packages. Installing packages for
    testing purposes may seem excessive, but it is very reassuring, if not essential,
    to know that the most important tools are working properly.


    First, unpack the documentation using the following command:


    ```

    tar -xf ../tcl8.6.11-html.tar.gz --strip-components=1

    ```


    Prepare Tcl for compilation:


    ```

    SRCDIR=$$(pwd)

    cd unix

    ./configure --prefix=/usr \\

    --mandir=/usr/share/man \\

    $ [ "$(uname -m)" = x86_64 ] && echo --enable-64bit

    ```


    The meaning of the configure options:


    ```

    $ [ "$(uname -m)" = x86_64 ] && echo --enable-64bit

    ```


    The Construct $(<shell command>)$ is replaced by the output of the shell command.
    This output is empty if running on a 32 bit machine, and is --enable-64bit if
    running on a 64 bit machine.


    Build the package:


    ```

    make


    sed -e "s|$$SRCDIR/unix/usr/lib|" \\

    -e "s|$$SRCDIR/unix/usr/include|" \\

    -i tclConfig.sh


    sed -e "s|$$SRCDIR/unix/pkgs/tdbcl.1.2/|/usr/lib/tdbcl.1.2/" \\

    -e "s|$$SRCDIR/pkgs/tdbcl.1.2/generic/|/usr/include|" \\

    -e "s|$$SRCDIR/pkgs/tdbcl.1.2/library/|/usr/lib/tcl8.6|" \\

    -e "s|$$SRCDIR/pkgs/tdbcl.1.2/|/usr/include|" \\

    -i pkgs/tdbcl.1.2/tdbConfig.sh


    sed -e "s|$$SRCDIR/unix/pk/itcl4.2.1/|/usr/lib/itcl4.2.1/" \\

    -e "s|$$SRCDIR/pkgs/itcl4.2.1/generic/|/usr/include|" \\

    -e "s|$$SRCDIR/pkgs/itcl4.2.1/|/usr/include|" \\

    -i pkgs/itcl4.2.1/itclConfig.sh

    ```


    ```

    unset SRCDIR

    ```'
