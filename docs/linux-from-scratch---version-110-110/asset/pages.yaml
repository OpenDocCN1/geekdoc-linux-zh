  md: '# 8.62. Kbd-2.4.0


    The Kbd package contains key-table files, console fonts, and keyboard utilities.


    Approximate build time: 0.2 SBU

    Required disk space: 33 MB


    # 8.62.1. Installation of Kbd


    The behaviour of the backspace and delete keys is not consistent across the keymaps
    in the Kbd package. The following patch fixes this issue for i386 kernels


    ```

    patch -Npl -i ../kbd-2.4.0-backspace-1.patch

    ```


    After patching, the backspace key generates the character with code 127, and the
    delete key generates a well-known escape sequence.


    Remove the redundant resizecons program (it prevents the defunct svgalib to provide
    the video mode files - for normal setfont the console appropriately) together
    with its manpage.


    ```

    sed -i ''/RESIZECONS_PROGS=/s/yes/no/'' configure

    sed -i ''s/resizecons.8 //'' docs/man/man8/Makefile.in

    ```


    Prepare Kbd for compilation:


    ```

    ./configure --prefix=/usr --disable-vlock

    ```


    The meaning of the configure option:


    ```

    --disable-vlock

    ```


    This option prevents the vlock utility from being built because it requires the
    PAM library, which isn''t available in the chroot environment.


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make check

    ```


    Install the package:


    ```

    make install

    ```


    > Note For some languages (e.g., Belarusian) the Kbd package doesn''t provide
    a useful keymap for the "by" keymap assumes the ISO-8859-5 encoding, and the CP1251
    keymap is normally used. Users of such languages have to download working keymaps
    separately.


    If desired, install the documentation:


    ```

    mkdir -v /usr/share/doc/kbd-2.4.0

    cp -R docs/doc/* /usr/share/doc/kbd-2.4.0

    ```'
  merge: -1
