  md: '# 10.3. Linux-5.13.12


    The Linux package contains the Linux kernel.


    **Approximate build time:** 1.5 - 130.0 SBU (typically about 12 SBU)

    **Required disk space:** 1200 - 8800 MB (typically around 1700 MB)


    # 10.3.1. Installation of the kernel


    Building the kernel involves a few steps—configuration, compilation, and installation.
    Read the README file in the kernel source tree for alternative methods to what
    this book configures the kernel.


    Prepare for compilation by running the following command:


    ```

    make mrproper

    ```


    This ensures that the kernel tree is absolutely clean. The kernel team recommends
    this command be used prior to each kernel compilation. Do not rely on the kernel
    source being clean after un-tarring.


    There are several ways to configure the kernel options. Usually, this is done
    through a menu-driven interface, for example:


    ```

    make menuconfig

    ```


    **The meaning of optional make environment variables:**


    ```

    LANG=<host_LANG_value> LC_ALL=

    ```


    This establishes the locale setting to the one used on the host. This may be needed
    for proper menuconfig curses interface line drawing on a UTF-8 text console.

    If used, be sure to replace `<host_LANG_value>` by the value of the $LANG variable
    from your host. You can alternatively use instead the host''s of $LC_ALL or $LC_CTYPE.


    **make menuconfig**


    This launches an ncurses-driven interface. For other (graphical) interfaces, type
    **make help**.


    For general information on kernel configuration see https://www.linuxfromscratch.org/hints/downloads/files/kernel-configuration.txt.
    BLFS has some information regarding particular kernel configuration requirements
    of packages outside of LFS at https://www.linuxfromscratch.org/blfs/view/11.0/longindex.html#kernel-config-index.
    Additional information about building and the kernel can be found at http://krowhow.com/ln/


    > Note

    A good starting place for setting up the kernel configuration is to run **make
    defconfig**. This will set the base configuration to a state that takes your current
    system architecture into account.

    Be sure to enable/disable the following features or the system might not work
    correctly or boot at all:


    ```

    Device Drivers --->

    Generic Driver Options --->

    [] Support for uevent helper [CONFIG_UEVENT_HELPER]

    [*] Maintain a devtmpfs filesystem to mount at /dev [CONFIG_DEVTMPFS]

    ```'
