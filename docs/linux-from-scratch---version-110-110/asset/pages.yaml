- img_proc: true
  md: '* /tmp – A separate directory is rare, but useful if configuring a thin client.
    This partition, if used, will not need to exceed a couple of gigabytes.


    * /usr – This is very useful for providing a location to BLFS source files and
    share them across LFS builds. It can also be used as a location for building BLFS
    packages. A reasonably large partition of 30-50 gigabytes allows plenty of room.


    Any separate partition that you automatically mounted upon boot needs to be specified
    in the /etc/fstab. Details about how to specify partitions will be discussed in
    Section 10.2, “Creating the /etc/fstab”.


    # 2.5. Creating a File System on the Partition


    Now that a partition has been set up, the file system can be created. LFS can
    use any file system recognized by Linux kernel, the most common types are ext3
    and ext4. The choice of file system can be complex and depends on the characteristics
    of the files and the size of the partition. For example:


    ext2

    is suitable for small partitions that are updated frequently such as /boot.


    ext3

    is an upgrade of ext2 that includes a journal to help recover the partition’s
    status in the case of an unclean shutdown. It commonly used as a general purpose
    file system.


    ext4

    is the latest version of the ext file system of partition types. It provides several
    new capabilities including very large files (16 TB), and nano-second timestamps,
    and speed improvements.


    Other file systems, FAT32, NTFS, ReiserFS, JFS, and XFS are used for specialized
    purposes. More information about these file systems can be found at http://en.wikipedia.org/wiki/Comparison_of_file_systems.


    LFS assumes that the root system (/) is of type ext4. To create an ext4 file system
    on the LFS partition, run the


    ```

    mkfs -v -t ext4 /dev/<xxx>

    ```


    Replace <xxx> with the name of the LFS partition.


    If you are using a swap partition, there is no need to format it. If a new swap
    partition will be initialized with this command:


    ```

    mkswap /dev/<yy>

    ```


    Replace <yy> with the name of the swap partition.


    # 2.6. Setting The $LFS Variable


    Throughout this book, the environment variable LFS will be used several times.
    You should ensure that this variable is always defined before the L build process.
    It should be set to the name of the directory where you will be building your
    LFS system - we will use /mnt/lfs as an example, but the directory choice is up
    to you. If you are building LFS on a separate partition, this directory will be
    the mount point for the partition. Choose a directory location and set the variable
    with the following command:


    ```

    export LFS=/mnt/lfs

    ```'
