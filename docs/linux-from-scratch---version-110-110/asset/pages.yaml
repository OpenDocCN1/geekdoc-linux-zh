  md: '# 8.41. Perl-5.34.0


    The Perl package contains the Practical Extraction and Report Language.


    Approximate build time: 10 SBU

    Required disk space: 226 MB


    # 8.41.1. Installation of Perl


    First, apply a patch that fixes an issue highlighted by recent versions of gdbm-


    ```

    patch -Np1 -i ../perl-5.34.0-upstream_fixes-1.patch

    ```


    This version of Perl now builds the Compress::Zlib and Compress::Zip modules.
    By default Perl will use an internal copy of the sources for the build. Issue
    the following command so that Perl will use the libraries installed on the system:


    ```

    export BUILD_ZLIB=False

    export BUILD_BZIP=0

    ```


    To have control over the way Perl is set, you can remove the "des" options from
    the following command and hand-pick the way this package is built. Alternatively,
    use the command as below to see the defaults that Perl auto-detects:


    ```

    sh Configure -des \

    -Dvendorprefix=/usr \

    -Dvendorprefix=/usr/lib/perl15/5.34/core_perl \

    -Darchlib=/usr/lib/perl15/5.34/core_perl \

    -Dsite_lib=/usr/lib/perl15/5.34/site_perl \

    -Dsitearch=/usr/lib/perl15/5.34/site_perl \

    -Dvendorlib=/usr/lib/perl15/5.34/vendor_perl \

    -Dvendorarch=/usr/lib/perl15/5.34/vendor_perl \

    -Dman1dir=/usr/share/man/man1 \

    -Dman3dir=/usr/share/man/man3 \

    -Dpager="usr/bin/less -isR" \

    -Duseshrplib \

    -Dusetethreads

    ```


    The meaning of the configure options:


    +   -Dvendorprefix=/usr


    This ensures perl knows how to tell packages where they should install their perl
    modules.


    +   -Dpager="usr/bin/less -isR"


    This ensures that less is used instead of more.


    +   -Dman1dir=/usr/share/man/man1 -Dman3dir=/usr/share/man/man3


    Since Grief is not installed yet, Configure thinks that we do not want man pages
    for Perl. This overrides this default.


    +   -Duseshrplib


    Build a shared libperl by some perl modules.'
