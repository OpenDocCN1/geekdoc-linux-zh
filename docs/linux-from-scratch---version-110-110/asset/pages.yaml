  md: '# Caution


    At this point, it is imperative to stop and ensure that the basic functions (compiling
    and linking) of the new toolchain are working as expected. Perform a sanity check,
    run the following commands:


    ```

    echo ''int main(){'' dummy.c

    $LFS_TGT-gcc dummy.c

    readelf -l a.out | grep ''/ld-linux''

    ```


    If everything is working correctly, there should be no errors, and the output
    of the last command will be of the form:


    ```

    [Requesting program interpreter: /lib64/ld-linux-x86-64.so.2]

    ```


    Note that for 32-bit machines, the interpreter name will be /lib/ld-linux.so.2.

    If the output is not shown above or there there is no output at all, then something
    is wrong. Investigate and retrace the steps to find out where the problem is and
    correct it. This issue must be resolved before continuing

    Once all is well, clean up the test files:


    ```

    rm -v dummy.c a.out

    ```


    # Note


    Building packages in the next chapter will serve as an additional check that the
    toolchain has been built properly. If some package, especially binutils-pass2
    or gcc-pass2, fails to build, it is an indication that something has gone wrong
    with the previous Binutils, GCC, or Glibc installations.


    Now that our cross-toolchain is complete, finalize the installation of the limits.h
    header. For doing so, run a utility provided by the GCC developers:


    ```

    $LFS/tools/libexec/gcc/$LFS_TGT/11.2.0/install-tools/mkheaders

