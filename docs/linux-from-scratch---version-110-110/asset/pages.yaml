  md: '# Linux From Scratch - Version 11.0


    The installation will work, the dependent packages may not link to libfoo as you
    would. If a package that links against libfoo you may notice that it is linked
    to /usr/pkg/libfoo/1.1/lib/libfoo.so.1 instead of /usr/lib/libfoo.so.1 as you
    would expect. The correct approach is to use the DESTDIR strategy to make fake
    installation of the package. This approach works as follows:


    ```

    ./configure --prefix=/usr

    make

    make DESTDIR=/usr/pkg/libfoo/1.1 install

    ```


    Most packages support this, but there are some which do not. For the non-compliant
    packages, you may need to manually install the package, or you may find that it
    is easier to install problematic packages in /opt.


    # 8.2.2.4. Timestamp Based


    In this technique, a file is timestamped before the installation of the package.
    After the installation, a simple use of the find command with the appropriate
    options can generate a log of all the files installed after the timestamp file
    was created. A package manager written with this approach is install-log.


    Though this scheme has the advantage of being simple, it has two drawbacks. During
    installation, the files are installed with any timestamp other than the current
    time, files will not be tracked by the package manager. This scheme can only be
    used when one package is installed at a time. The logs are not reliable if two
    packages are being installed on different consoles.


    # 8.2.2.5. Tracing Installation Scripts


    In this approach, the installation scripts perform recorded. There are two techniques
    that one can use:


    The LD_PRELOAD environment variable can be set to a library to be preloaded before
    installation. During installation, this library tracks the packages that are being
    installed by attaching itself to various executables such as cp, install and tracing
    the system calls that modify the filesystem. For this approach to work, all the
    executables must be dynamically linked without the sudo or gid bit. The library
    may cause unwanted side-effects during installation. Therefore, it is advised
    that one performs tests to ensure that the package manager does not break anything
    and logs all the appropriate files.


    The second technique is to use strace, which logs all system calls made during
    the execution of the installation scripts.


    # 8.2.2.6. Creating Package Archives


    In this scheme, the installation is faked into a separate tree as described in
    the Symlink style management. After installation, a package archive is created
    using the installed files. This archive is then used to install the package on
    the local machine or can be used to install the package on other machines.


    This approach is used by most of the package managers found in the commercial
    distributions. Examples of package managers that follow this approach are RPM
    (which, incidentally, is required by the Linux Standard Base Specification), pkg-utils,
    Debian''s apt, and Gent''s Package system. A hint describing how to adapt this
    style of package management for LFS is located at https://www.linuxfromscratch.org/hints/downloads/fakeroot.txt.


    Creation of packages that include dependency information is complex and is beyond
    the scope of LFS.


    Slackware uses a base system for package installation. This system purposely does
    not handle package dependencies as more complex package managers do. For details
    of Slack package management, visit http://www.slackbook.org/html/package-management.html.


    95'
