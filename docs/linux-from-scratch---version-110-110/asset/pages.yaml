  md: 'Normally, all files in the /tmp directory are deleted at boot. Depending on
    the number of files or directories present, this can cause a noticeable delay
    in the boot process. To skipping these files set the variable SKIPMTCLEAN=y.


    During startup, the init process sends a TERM signal to each program it has started
    (e.g. waits for a set time (3 seconds), and each process a KILL signal and waits.
    This process is repeated in the signalscript for any processes that are not shut
    down by their owners. The delay for init can be set by passing a parameter. For
    example to remove the delay in init, set the -t0 when shutting down or rebooting
    (e.g.). The delay for the signalsignal script can be skipped by setting the parameter
    KILLDELAY=0.


    # 9.7. The Bash Startup Files


    The shell program /bin/bash (referred to as the “shell”) uses a collection of
    startup files to create an environment to run in. Each file has its specific use
    and may affect login and interactive environments. Different files in the /etc
    directory provide global settings. If an equivalent file exists in the home directory,
    it may override the global settings.


    An interactive login shell is started after a successful login, using /bin/login,
    or reading the /etc/passwd file. An interactive non-login shell is started at
    the command-line (e.g., [prompt]#bin/bash). A non-interactive shell is usually
    present when a shell script is running. It is non-interactive because it is processing
    a script and not waiting for user input under commands.


    For more information, see info under the Bash Startup Files and Interactive Sections.


    The files /etc/profile and ~/.bash_profile are read when the shell is invoked
    as an interactive login shell. The /etc/profile below sets some environment variables
    necessary for native language support. Setting them properly results in:


    +   * The output of programs translated into the native language

    * Correct classification of characters into letters, digits, and other classes.
    This is necessary for bash to accept non-ASCII characters in command lines in
    non-English locales

    * The correct alphabetical sorting order for the country

    * Appropriate default paper size

    * Correct formatting of monetary, time, and date values


    Replace <LL> with the two-letter code for the desired language (e.g., “en”) and
    <CC> with the two-letter code for the appropriate country (e.g., “GB”). <charmap>
    should be replaced with the canonical format for your chosen locale. Optional
    modifiers such as “@euro” may also be present.


    The list of all locales supported by Glibc can be obtained by running the following
    command:


    ```

    locale -a

    ```


    Charmaps can have a number of aliases, e.g., “ISO-8859-1” is also referred to
    as “iso8859-1” and “iso88591”. Some applications cannot handle the various synonyms
    correctly (e.g., require that “UTF-8” is written as “UTF-8”, not “utf8”), so it
    is safest in most cases to choose the canonical synonym for a particular locale.
    To determine the canonical name, run the following command, <locale name> is the
    output given by locale -a for your preferred locale (“en_GB.iso88591 in our example).


    ```

    LC_ALL=<locale name> locale charmap

    ```'
