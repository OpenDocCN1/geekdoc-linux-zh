  md: 'Now that our final toolchain is in place, it is important to ensure that compiling
    and linking will work as expected.

    We do this by performing some sanity checks:


    ```

    echo ''int main() {} > dummy.c

    cc dummy.c -v -WI,--verbose & dummy dummy.

    readelf -l a.out | grep '': /lib''

    ```


    There should be no errors, and the output of the last command will be (allowing
    for platform-specific differences in the dynamic linker):


    ```

