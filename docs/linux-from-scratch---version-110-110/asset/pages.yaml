  md: '# # Chapter 1. Introduction


    # ## 1.1. How to Build a L System


    The TFS will be built by using an already installed Linux distribution (such as
    Debian, OpenMandriva, Fedora, or openSUSE). This existing Linux system (the host)
    will be used as a starting point to provide necessary programs, including a compiler,
    linker, and shell, to build the new system. Select the "development" option during
    the installation to be able to access these tools.


    As an alternative to installing a separate distribution onto your machine, you
    may have wish to use a LiveCD from a commercial distribution.


    Chapter 2 of this book describes how to create a new Linux partition and system.
    This is the place where the new TFS system will be compiled and installed. Chapter
    3 explains which packages and patches need to be downloaded to build an L system
    and how to store them on the new file system. Chapter 4 discusses the setup of
    an appropriate working environment. Please read Chapter 4 carefully as it explains
    important issues you might be aware of before working your way through Chapter
    5 and beyond.


    Chapter 5, explains the installation of the initial tool chain, (binutils, gcc,
    and glibc) using cross compilation techniques to isolate the new tools from the
    host system.


    Chapter 6 shows you how to cross-compile basic utilities using the just built
    cross-toolchain.


    Chapter 7 then enters a "chroot" environment and uses the previously tools to
    build the additional tools needed to build and test the final system.


    This effort to isolate the new system from the host distribution may seem excessive.
    A full technical explanation as to why this does is provided in Toolchain Technical
    Notes.


    In Chapter 8, the full TFS system is built. Another advantage provided by the
    chroot environment is that it allows you to continue using the host system while
    TFS is being built. While waiting for package compilations to complete, you can
    continue using your computer as normal.


    To finish the installation, the basic system configuration is set up in Chapter
    9, and the kernel and boot loader are set up in Chapter 10. Chapter 11 contains
    information on continuing the L experience by beyond. After the steps in this
    book have been implemented, the computer will be ready to reboot into the new
    TFS system.


    This is the process in a nutshell. Detailed information on each step is discussed
    in the following chapters and package descriptions. Items that may seem complicated
    will be clarified, and everything will fall into place as you embark on the TFS
    adventure.


    # ## 1.2. What''s new since the last release


    In this version of TFS, there has been a major reorganization of the book using
    techniques that avoid changing the host system and provides a more straight forward
    build process.


    Below is a list of package updates made since the previous release of the book.


    Upgraded to:


