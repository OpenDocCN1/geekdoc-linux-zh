  md: 'Feel free to modify the boot process works (after all, it is your own LFS system).
    The files given here are an example of how it can be done.


    # 9.6.3. Udev Bootscripts


    The `/etc/rc.d/init.d/udev` starts **udev**, triggers any "coldplug" devices that
    have already been created by the kernel and handles any rules you want to control.
    The script also uses the uevent handler from the default of `/sbin/hotplug`. This
    is done because the kernel no longer needs to call out to an external binary.
    **udev** will listen on a netlink socket for events that the kernel raises.


    The `/etc/init.d/udev_retry` script starts care of re-triggering events for subsystems
    whose rules may rely on filesystems that are mounted (like `/var` or may this).
    This script runs after the mounts script, so rules (if re-triggered) should execute
    the second time around. It is configured from `/etc/sysconfig/udev_retry` file;
    any words in this file other comments are considered system names to trigger at
    retry. To find the system of a device, use **udevadm --attribute-walk <device>**
    where `<device>` is an absolute path in `/dev` such as `/dev/sda0` or `/sys/class/.


    For information on kernel loading and udev, see Section 9.3.2, "Module Loading".


    # 9.6.4. Configuring the System Clock


    The setclock reads the time from the hardware clock, also known as the BIOS or
    the Complementary Metal Oxide Semiconductor (CMOS) clock. If the hardware clock
    is set to UTC, this script will convert the hardware clock to the local time using
    the `/etc/localtime` file (which the **hwclock** program uses to time). There
    is no way to detect whether or not the hardware clock is set to UTC, so this needs
    to be configured manually.


    If you cannot remember whether or not the hardware clock is set to UTC, find out
    by running the **hwclock --localtime --show** command. This will display the current
    time is according to the hardware clock. If your local time matches what your
    watch shows, then the hardware clock is set to local time. If the output from
    **hwclock** is not local time, chances it is set to UTC. Verify this by adding
    or subtracting the amount of hours for the timezone by **hwclock**. For example,
    if you are currently in the MST timezone, it is also known as GMT -0700, add seven
    hours to the local time.


    Create a new `/etc/sysconfig/clock` by running the following:


    ```

    cat > /etc/sysconfig/clock << "EOF"


    # /etc/sysconfig/clock


    UTC=1


    # Set this to any options you might need to give to hwclock,

    # such as machine hardware clock type for Alphas.

    CLOCKPARAMS=


    # End /etc/sysconfig/clock

    EOF

    ```'
