  md: '# # 81. Proccs-ng-3.3.17


    The Proccs-ng package contains programs for monitoring processes.


    > > Note: This package extracts to the directory `proccs-3.3.17`, not the expected
    `proccs-ng-3.3.17`.


    Approximate build time: 0.5 SBU

    Required disk space: 19 MB


    # ## 87.1.1. Installation of Proccs-ng


    Prepare proccs-ng for compilation:


    ```

    ./configure --prefix=/usr \

    --docdir=/usr/share/doc/proccs-ng-3.3.17 \

    --disable-static \

    --disable-kill

    ```


    The meaning of the configure option:


    `--disable-kill` This switch disables building the **kill** command that will
    be installed by the Util-linux package.


    Compile the package:


    ```

    make

    ```


    To run the test suite, run:


    ```

    make check

    ```


    Five tests related to pkill are known to fail due to a problem with tests that
    were not updated.


    Install the package:


    ```

    make install

    ```


