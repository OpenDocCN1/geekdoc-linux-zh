  md: '# Prerequisites


    Building an LFS is not a simple task. It requires a certain level of existing
    knowledge of Unix administration in order to resolve problems and correctly execute
    the commands listed. In particular, as an absolute minimum, you should already
    have the ability to use the command line (shell) to copy or move files and directories,
    list directory and file contents, and change the current directory. It is also
    expected that you have a reasonable knowledge of using and installing Linux software.


    Because the LFS book assumes least this basic level of skill, the various LFS
    support forums are unlikely to be able to provide you with much assistance in
    these areas. If you find that your questions regarding basic knowledge go unanswered
    or you will be referred to the LFS essential pre-reading list.


    Before building-LFS, we recommend reading the following:


    +   * Software-Building-HOWTO http://www.tldp.org/HOWTO/Software-Building-HOWTO.html


    This is a comprehensive guide to building and installing "generic" Unix packages
    under Linux. Although it was written some time ago, it provides a good summary
    of the basic techniques needed to build and install software.


    +   * Beginner''s Guide to Installing from Source http://mov.linux.net/linux/beginners-installing-from-source/


    This guide provides a good summary of basic skills and techniques needed to build
    software from source code.


    # LFS and Standards


    The structure of LFS follows Linux standards as closely as possible. The primary
    standards are:


    +   * POSIX-1-2008.

    * Filesystem Hierarchy Standard (FHS) Version 3.0

    * Linux Standard Base (LSB) Version 5.0 (2015)


    > Note

    The LSB has four standards: Core, Desktop, Runtime Languages, and Imaging. In
    addition to generic requirements there are also architecture specific. There are
    also two areas for trial: Gtk3 and Graphics. LFS attempts to conform to the architectures
    discussed in the previous section.


    > Many do not agree with the requirements of the LSB. The main purpose of defining
    it is to ensure that proprietary software will be able to be installed and run
    properly on a compliant system. If LFS is source based, the user has control over
    what packages are desired and may choose not to install some packages that are
    specified by the LSB.


    Creating a complete LFS capable of passing the LSB certifications is possible,
    but without many additional packages that are beyond the scope of LFS. These additional
    packages have installation instructions in BLFS.


    # Packages supplied by LFS needed to satisfy the LSB Requirements


    LSB Core:


    Bash, Bc, Binutils, Coreutils, Diffutils, Find, Gutils, Gawk, Grep, Gzip, M4,
    Man-DB, Ncurses, Procps, Psmisc, Sed, Shadow, Tar, Util-linux, Zlib


    LSB Desktop:


    None'
