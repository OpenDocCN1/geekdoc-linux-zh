  md: '# 8.5. Glibc-2.34


    The Glibc package contains the main C library. This library provides the basic
    routines for allocating memory, searching directories, opening and closing files,
    reading and writing files, string handling, pattern matching, arithmetic, and
    so on.


    **Approximate build time:** 21 SBU

    Required disk space: 2.4 GB


    # 8.5.1. Installation of Glibc


    First, fix a security problem identified upstream:


    ```

    sed -e ''/^NOTIFY_REMOVED/\s*\\\&& data.attr != NULL)/'' ''\''

    -i sysdeps=/usr/sys/linux/mq_notif.c

    ```


    Some of Glibc programs use the non-FHS compliant `/var/db` directory to store
    their runtime data. Apply the following patch to make such programs store their
    runtime data in the FHS-compliant locations:


    ```

    patch -Npl1 -i ../glibc-2.34-fhs-1.patch

    ```


    The Glibc documentation recommends building Glibc in a dedicated build directory:


    ```

    mkdir -v build

    cd build

    ```


    Ensure that the **ldconfig** and **sln** utilities are installed into `/usr/sbin:


    ```

    echo "rootsbindir=/usr/sbin" > config.parms

    ```


    Prepare Glibc for compilation:


    ```

    ../configure --prefix=/usr \

    --disable-error \

    --enable-kernel=3.2 \

    --enable-stack-protector=strong \

    --with-headers=/usr/include \

    libc_cv_slibdir=/usr/lib

    ```


    --disable-error

    This option disables the -Werror option passed to GCC. This is necessary for running
    the test suite.


    --enable-kernel=3.2

    This option tells the build system that glibc may be used with kernels as old
    as 3.2. This means generating workaround in a system call introduced in a later
    version cannot be used.


    --enable-stack-protector=strong

    This option increases system security by adding extra code to check for buffer
    overflows, such as stack smashing attacks.


    --with-headers=/usr/include

    This option tells the build system where to find the kernel API headers.'
