  md: '# Chapter 11. The End


    # 11.1. The End


    Well done! The new LFS system is installed! We wish you much success with your
    shiny new custom-built Linux system.


    It may be a good idea to create an /etc/lfs-release file. By having this file,
    it is very easy for you (and for us if you need to ask for help at some point)
    to find out which LFS version is installed on the system. Create this file by
    running:


    ```

    echo 11.0 > /etc/lfs-release

    ```


    Two files describing the installed system may be used by packages that can be
    installed on the system, either in binary form or by building them.


    The first shows the status of your new system with respect to the Linux Standards
    Base (LSB). To create this file, run:


    ```

    cat > /etc/lfs-release << "EOF"

    DISTRIB_ID="Linux From Scratch"

    DISTRIB_RELEASE="11.0"

    DISTRIB_CODENAME="<your name here>"

    DISTRIB_DESCRIPTION="Linux From Scratch"

    EOF

    ```


    The second one contains roughly the same information, and is used by systemd and
    some graphical desktop environments. To create this file, run:


    ```

    cat > /etc/os-release << "EOF"

    NAME="Linux From Scratch"

    VERSION="11.0"

    ID=lfs

    PRETTY_NAME="Linux From Scratch 11.0"

    VERSION_CODENAME="<your name here>"

    EOF

    ```


    Be sure to put some sort of customization for the fields ''DISTRIB_CODENAME''
    and ''VERSION_CODENAME'' to make the system uniquely yours.


    # 11.2. Get Counted


    Now that you have finished the book, do you want to be counted as an LFS user?
    Head over to https://www.linuxfromscratch.org/cgi-bin/lfscounter.php and register
    as an LFS user by entering your name and the first LFS version you have used.


    Let''s reboot into LFS now.'
  merge: -1
  pgno: 281
- img_proc: true
  md: "# 11.3. Rebooting the System\n\nNow that all of the software has been installed,\
    \ it is time to reboot your computer. However, you should be aware of a few things.\
    \ The system you have created is quite minimal, and most likely not have the functionality\
    \ you would need to be able to continue forward. By installing a few extra packages\
    \ from the BLFS book while in your current chroot environment, you can leave yourself\
    \ in a much better position to continue on once you reboot into your LFS installation.\
    \ Here are some suggestions:\n\n+   - A text browser such as Lynx will allow you\
    \ to easily view the BLFS book in one virtual terminal, while building packages\
    \ in another.\n- The make-ca package will allow you to set up local trusted anchor\
    \ certificates, allowing the system to verify SSL certificates provided by remote\
    \ servers (for example, a website using HTTPS).\n- The GPM will allow you to perform\
    \ copy/paste actions in your virtual terminals.\n- If you are in a situation where\
    \ dhcpconfig does not match your networking requirements, installing a package\
    \ such as dhcpcd or the client portion of dhcp may be useful.\n- Installing sudo\
    \ may be useful for building packages as a non-root user and easily installing\
    \ the resulting packages in your system.\n- If you want to access your new system\
    \ from a remote system within a comfortable GUI environment, install openssh.\n\
    - To make fetching files from the internet, install wget.\n- To connect to a wireless\
    \ access point for networking, install wpa_supplicant.\n- Finally, a review of\
    \ the following configuration files is also appropriate at this point:\n  - /etc/bashrc\n\
    \  - /etc/dircors\n  - /etc/fstab\n  - /etc/hosts\n  - /etc/inputrc\n  - /etc/profile\n\
    \  - /etc/resolv.conf\n  - /etc/vimrc\n  - /root/bash_profile\n  - /root/bashrc\n\
    \  - /etc/sysconfig/ifconfig.eth0\n\nNow that we have said, let's move on to booting\
    \ our shiny new LFS installation for the first time! Exit from the chroot environment:\n\
    \n```\nlogout\nUnmount the LFS file system hierarchy:\numount -Rv $LFS\n```"
