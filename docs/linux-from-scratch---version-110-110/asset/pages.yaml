    +   **free** Reports the amount of free and used memory (both physical and swap
    memory) in the system


    +   **pgrep** Looks processes based on their name and other attributes


    +   **pidof** Reports the PIDs of the given programs


    +   **pkill** Signals processes based on their name and other attributes'
