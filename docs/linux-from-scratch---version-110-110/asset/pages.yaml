  md: '# Linux From Scratch - Version 11.0


    consider a package whose compilation time is 4.5 SBUs. This means that if a system
    takes 10 minutes to compile and install the first pass of binutils, it will take
    approximately 45 minutes to build this example package. Fortunately, most builds
    are shorter than the one for binutl


    In general, SBUs are not entirely accurate because they depend on many factors,
    including the host system''s version of GCC. They are provided here to give an
    estimate of how long it might take to install a package, but the numbers can vary
    by as much as dozens of minutes in some cases.


    > For many modern systems with multiple processors (cores) the compilation time
    for a package can be reduced by performing a "parallel make" by either setting
    an environment variable or telling the program how many processors are available.
    For instance, an Intel i5-6500 CPU can support four simultaneous processes with:


    ```

    export MAKEFLAGS=''-j4''

    ```


    or just building with:


    ```

    make -j4

    ```


    When multiple processors are used in this way, the SBU units in the book will
    vary even more than they normally would. In some cases, the make will simply fail.
    Analyzing the output of the build process will be even more difficult because
    the lines of different processes are interleaved. If you run into a problem with
    a build step, revert back to a single processor to properly analyze the error
    messages.


    #  6. About the Test Suites


    Most packages provide a test suite. Running the test suite for a newly built package
    is a good idea because it can provide a "sanity check" indicating that everything
    compiled correctly. A test suite that passes its set of cases usually proves the
    package is functioning as the developer intended. It does not, however, guarantee
    that the package is totally bug free.


    Some tests are more important than others. For example, the test suites for the
    core toolchain packages—GCC, binutils, and glibc—are of the utmost importance
    due to their central role in a properly functioning system. The suites for GCC
    and glibc can take a very long time to complete, especially on slower hardware,
    but are strongly recommended.


    > Running the test suites in Chapter 5 and Chapter 6 is impossible, since the
    programs are compiled with a cross-compiler, so are not supposed to be run on
    the build host.


    A common issue with test suites for binutils and GCC is running out of pseudo
    terminals (PTYs). This can result in a high number of failing tests. This may
    happen for several reasons, but the most likely is that the host system does not
    have the devpts file system set up correctly. This issue is discussed in greater
    detail at https://linuxscratch.org/lfs/faq.html#no-ptys.


    Sometimes test suites will fail, for reasons which the developers have deemed
    non-critical. Consider the logs located at https://linuxscratch.org/lfs/build-logs/11.0/
    to verify or not these failures are expected. This site is valid for all tests
    throughout this book.


    35'
