  md: '# 8.25. Shadow-4.9


    The Shadow package contains programs for handling passwords in a secure way.

    Approx build time: 0.2 SBU Required disk space: 45 MB


    # 8.25.1. Installation of Shadow


    > Note If you would like to enforce the use of strong passwords, refer to https://www.linuxfromscratch.org/blfs/view/11.0/postifs/cracklib.html
    for installing CrackLib prior to building Shadow. Then add --with-libcrack to
    the configure command.


    Disable the installation of the groups program and its pages, as Coreutils provides
    a better alternative. Also, prevent the installation of manuals already installed
    in Section 8.3, "Man-pages-5.13"


    ```

    sed -i ''/s/groups$ (EXEEXT) //'' src/Makefile.in

    find man -name Makefile.in -exec sed -i ''/s/groups\.1 / /'' {} \

    find man -name Makefile.in -exec sed -i ''/s/getspnam\.3 / /'' {} \\

    find man -name Makefile.in -exec sed -i ''/s/password\.5 / /'' {} \

    ```


    Instead of using the crypt method, use the more secure SHA-512 for password encryption,
    which also allows passwords longer than 8 characters. It is also necessary to
    change the obsolete /var/spool/mail location used currently. Get rid of /bin and
    /sbin from PATH, since they are symlinks to their counterpart in /usr.


    > Note If /bin and /sbin are preferred to be left over for some reason, modify
    PATH in .bashrc after LTS is.


    ```

    sed -e ''s:ENCRYPT_METHOD DES:ENCRYPT_METHOD SHA512: '' \\

    -e ''s:/var/spool/mail:/var/mail:'' '' \\

    -e ''/PATH={s/sbin:@;s/bin:@}'' \\

    -i etc/login.defs

    ```


    > Note If you chose to build Shadow with Cracklib support, run the following:


    ```

    sed -i ''s:DICTPATH:*:DICTPATH\t/lib/cracklib/pw_dict: etc/login.defs

    ```


    Fix a simple programming error by modifying a file with following command:


    ```

    sed -e "224s/rounds/min_rounds/" -i libmisc/salt

    ```


    Prepare Shadow for compilation:


    ```

    touch /usr/bin/passwd

    ./configure --sysconfdir=/ \

    --with-group-name-max-length=52

