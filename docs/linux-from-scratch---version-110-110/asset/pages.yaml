  md: '# 8.2.2.7. User Based Management


    This scheme, unique to LFS, was devised by Matthias Benmann, and is available
    from the Hints Project. In this scheme, each package is installed as a separate
    user into the standard locations. Files belonging to a package are identified
    by checking the user ID. The features and shortcomings of this approach are too
    complex to describe in this section. For the details please see the hint at https://www.linuxfromscratch.org/hints/downloads/files/more_control_and_pkg_man.txt.


    # 8.2.3. Deploying LFS on Multiple Systems


    One of the advantages of an LFS system is that there are no files that depend
    on the position of files on a disk system. Cloning an LFS build to another computer
    with the same architecture as the base system is as simple as using tar on the
    LFS partition that contains the root directory (about 250MB uncompressed for a
    base LFS build), copying that file via network transfer or CD-ROM to the new system
    and expanding it. From that point, a few configuration files will have to be changed.
    /etc/hosts, /etc/fstab, /etc/passwd, /etc/shadow, /etc/ld.so.conf, /etc/sysconfig/rc.site,
    /etc/sysconfig/network, and /etc/sysconfig/ifconfig.eth0.


    A custom kernel may need to be built for the new system depending on differences
    in system hardware and the original kernel configuration.


    > Note

    There have been some reports of issues when copying between similar but not identical
    architectures. For instance, the instruction set for an Intel system is not identical
    with an AMD processor and later versions of some processors may have instructions
    that are unavailable in earlier versions.


    Finally the new system has to be made bootable by Section 10.4, “Using GRUB to
    Set Up the Boot Process”.'
