  md: '# # 8.57. Findultis-4.8.0


    The Findultis package contains programs to find files. These programs are provided
    to recursively search through a directory tree to create, maintain, and search
    a database (often faster than the recursive find, but is unreliable if the database
    has not been recently updated).


    **Approximate build time:** 0.9 SBU

    **Required disk space:** 52 MB


    # # 8.57.1. Installation of Findultis


    Prepare Findultis for compilation:


    ```

    ./configure --prefix=/usr --localstatedir=/var/lib/locate

    ```


    The meaning of the configure options:


    --localstatedir

    This option changes the location of the locate database to be in /var/lib/locate,
    which is FHS-compliant.


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    chown -Rv tester .

    su tester -c "PATH=$PATH make check"

    ```


    Install the package:


    ```

    make install

    ```


    # # 8.57.2. Contents of Findultis


    **Installed programs:** find, locate, updatedb, and xargs

    **Installed directory:** /var/lib/locate


    Short Descriptions


    +   - find: Searches given directory trees for files matching the specified criteria


    +   - locate: Searches through a database of file names and reports the names
    that contain a given string or match a given pattern


    +   - updatedb: Updates the locate database; it scans the entire file system (including
