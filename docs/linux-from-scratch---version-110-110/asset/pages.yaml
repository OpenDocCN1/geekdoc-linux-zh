  md: "# 68. Vim-8.2.2337\n\nThe Vim package contains a powerful text editor.\n\n\
    **Approximate build time:** 2.3 SBU\n**Required disk space:** 199 MB\n\n> Alternatives\
    \ to Vim\nIf you prefer another editor—such as Emacs, Joe, or Nano—please refer\
    \ to https://www.linuxfromscratch.org/blfs/vim/11.0/postlfs/editors.html for suggested\
    \ installation instructions.\n\n# 68.1.1 Installation of Vim\n\nFirst, change\
    \ the default location of the `vimrc` configuration file to /etc:\n\n```\necho\
    \ '#define SYS_VIMRC_FILE \"/etc/vimrc\"' >> src/feature\n```\n\nPrepare vim for\
    \ compilation:\n\n```\n./configure --prefix=/usr\n```\n\nCompile the package:\n\
    \n```\nmake\n```\n\nTo prepare the tests, ensure that user `tester` can write\
    \ to the source tree:\n\n```\nchown -Rv tester .\n```\n\nNow run the tests with\
    \ `tester` user:\n\n```\nsu tester -c \"LANG=en_US.UTF-8 make -j1 test\" & vim-test.log\n\
    ```\n\nThe test suite outputs lot of binary data to the screen. This can cause\
    \ issues with the settings of the current terminal. The problem can be avoided\
    \ by redirecting the output to a log file as shown above. A successful test will\
    \ result in \"ALL DONE\" in the log file at completion.\n\nInstall the package:\n\
    \n```\nmake install\n```\n\nMany users are used to use `vi` instead of `vim`.\
    \ To allow execution of `vim` when users habitually enter `vi`, create a symlink\
    \ for both the binary and the man page in the provided locations:\n\n```\nln -sv\
    \ /usr/bin/vim\nfor L in /usr/share/man/{*,}man1; do\n  ln -sv $L $1 $(dirname\
    \ $L)/vi.1\ndone\n```\n\nBy default, vim's documentation is installed in /usr/share/vim/.\
    \ The following symlink allows the documentation to be accessed via /usr/share/doc/vim-8.2.2337,\
    \ making it consistent with the location of documentation for other packages:\n\
    \n```\nln -sv ../vim/vim82/ /usr/share/doc/vim-8.2.2337\n```"
  merge: -1
  pgno: 223
- img_proc: true
  md: "If an X Window System is going to be installed on the LFS system, it may be\
    \ necessary to recompile vim after installing X. Vim comes with a GUI version\
    \ of the editor that requires X and some additional libraries to be installed.\
    \ For more information on this, refer to the vim documentation and the vim installation\
    \ page in the BLFS book at https://www.linuxscratch.org/blfs/view/11.0/postifs/vim.html.\n\
    \n#  8.62. Configuring Vim\n\nBy default, vim runs in vi-compatible mode. This\
    \ may be new to users who have used other editors in the past. The \"incompatible\"\
    \ setting is included below to highlight the fact that a new behavior is being\
    \ used. It also reminds them would change to \"compatible\" mode that it should\
    \ be the first setting in the configuration file. This is necessary because it\
    \ changes other settings, and overrides must be made after this. Create a default\
    \ vim configuration file by running the following:\n\n```\ncat /etc/vimrc << \"\
    EOF\"\n  Begin /etc/vimrc\n  Ensure defaults are set before customizing settings,\
    \ not after\n  source $VIMRUNTIME/defaults.vim\n  let skip_defaults_vim=1\n\n\
    set incompatible\nset backspace=2\nset mouse=\nsyntax on\nif ($term == \"xterm\"\
    ) || (&&term == \"putty\")\n  set background=dark\nendif\n\n  End /etc/vimrc\n\
    EOF\n```\n\nThe set incompatible makes vim behave in a more useful way (the default)\
    \ than the vi-compatible manner. Remove the \"no\" to keep the old behavior. The\
    \ set backspace=2 allows backspacing over line breaks, autoindents, and the start\
    \ of an insert. The syntax on enables vim's syntax highlighting. The set mouse=\
    \ enables proper pasting of text with the mouse when working in groot or a remote\
    \ connection. Finally, the if statement with the set background=dark corrects\
    \ vim's guesses about the background color of some terminal emulators. This gives\
    \ the highlighting a better color scheme for use on the black background of these\
    \ programs.\n\nDocumentation for other available options can be obtained by running\
    \ the following command:\n\n```\nvim -c ':options '\n```"
  merge: -1
  pgno: 224
