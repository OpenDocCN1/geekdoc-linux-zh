  md: '# Prepare GCC for compilation:


    ```

    ./configure \

    --target=$LFS_TGT \

    --prefix=$LFS/tools \

    --with-glibc-version=2.11 \

    --with-sysroot=$LFS \

    --with-newlib \

    --without-headers \

    --enable-initfini-array \

    --disable-nls \

    --disable-shared \

    --disable-multilib \

    --disable-decimal-float \

    --disable-threads \

    --disable-libatomic \

    --disable-libgomp \

    --disable-libquadmath \

    --disable-libsssp \

    --disable-libvtv \

    --disable-libstdcxx \

    --enable-languages=c,c++

    ```


    The meaning of the options:


    --with-glibc-version=2.11

    This option ensures the package will be compatible with the host''s glibc. It
    is set to the minimum glibc requirement specified in the Host System Requirements.


    --with-newlib

    Since a working C library is not yet available, this ensures that the inhibit_lib
    constant is defined when building libgec. This prevents the compiling of any code
    that requires lib support.


    --without-headers

    When creating a complete cross-compiler, GCC requires standard headers compatible
    with the target system. For our purposes these headers will not be needed. This
    switch prevents GCC from looking for them.


    --enable-initfini-array

    This switch forces the use of some internal data structures that are needed but
    cannot be detected when building a cross compiler.


    --disable-shared

    This switch forces GCC to link its internal libraries statically. We need this
    because the standard libraries require glibc, which is not installed on the target
    system.


    --disable-multilib

    On x86_64, LFS does not support a multilib configuration. This switch is harmless
    for x86.


    --disable-decimal-float, --disable-libatomic, --disable-

    libomp, --disable-libquadmath, --disable-libsssp, --disable-libvtv, --disable-

    libstdcxx


    These switches disable support for the decimal floating point extension, threading,
    libgomp,

    libquadmath, libsssp, libvtv, and the C++ standard library respectively. These
    features will fail to compile when

    building a cross-compiler and are not necessary for the task of cross-compiling
    the temporary libc.'
