  md: '# Preface


    # Foreword


    My journey to learn and better understand Linux began back in 1998. I had just
    installed my first Linux distribution and had quickly become intrigued by the
    whole concept and philosophy behind Linux.


    There are always many ways to accomplish a single task. The same can be said about
    Linux distributions. A great many have existed over the years. Some still exist,
    have morphed into something else, yet others have been relegated to our memories.
    They do all things differently to suit the needs of their target audience. Because
    so many different ways to accomplish the same end goal, I realize I longer had
    to be limited by any one implementation. Prior to discovering Linux, we simply
    put up with other Operating Systems as we had no choice. It was what it was, whether
    you liked it or not. With Linux, the concept of choice became again. If you were
    free, encouraged to change it.


    I tried a number of distributions and could not decide on any. They were great
    systems in their own right. It wasn''t a matter of right and wrong anymore. It
    had become a matter of personal taste. With all that choice, it appeared that
    would not be a single system that would be perfect for me. So I set out to create
    my own Linux system that would fully conform to my preferences.


    To make it my own, I resolved to compile everything from source code instead of
    using pre-compiled binary packages. This "perfect" system would have the strengths
    of various systems without their perceived weaknesses. At first, the idea was
    rather daring. I remained committed to the idea that a system could be built.


    After sorting issues such as circular dependencies and compile-time errors, I
    finally built a custom-built Linux system. It was fully operational and perfectly
    usable like any of the Linux systems out there the time. But it was my creation.
    It was very satisfying to have put together such a system myself. The only thing
    better would have to create each piece of software myself. This was the next best
    thing.


    As I shared my goals and experiences with other members of the Linux community,
    it became apparent that there was a sustained interest in these ideas. It quickly
    became plain that such custom-built Linux systems serve not only to meet specific
    requirements, but also serve as an ideal learning opportunity for programmers
    and system administrators to enhance their (existing) Linux skills. Of this broadened
    interest, the Linux From Scratch Project was born.


    Linux From Scratch book is the core that project. It provides the groundwork and
    instructions necessary for you to design and build your own. This book provides
    a template that will result in a correctly working system, you are free to alter
    the instructions to suit yourself, which is, in an important part of this project.
    You remain in control; we just lend a helping hand to get you started on your
    journey.


    I sincerely hope you will have a great time working on your own Linux From Scratch
    system and enjoy the numerous benefits of having a system that is truly yours.


    ```

    --

    Gerard Beekemans

    gerard@linuxfromscratch.org

    ```


    # Audience


    There are many reasons why you would want to read this book. One of the questions
    many people raise is, "why go through the hassle of manually building a Linux
    system from scratch when you can just download and install an existing one?"'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Linux From Scratch - Version 11.0


    One reason for this project''s existence is to help you learn how Linux works
    from the inside out. Building an LFS system helps demonstrate how Linux tick,
    and how things work and depend on each other. One of the best things that this
    learning experience can provide is the ability to customize a Linux system to
    suit your unique needs.


    Another key benefit of LFS is that it allows you to have more control over the
    system without relying on someone else''s implementation. With LFS, you are in
    the driver''s seat and act despite every aspect of the system.


    LFS allows you to create great Linux systems. When installing real distributions,
    you are often forced to install many programs which are probably never used or
    understood. These programs waste resources. You may argue that with today''s hard
    drive and CPUs, resources are no longer a consideration. However, you are still
    constrained by size considerations if nothing else. About bootable CDs, USB sticks,
    and embedded systems. Those are areas where LFS can be beneficial.


    Another advantage of a custom built Linux system is security. By compiling the
    entire system from source code, you are empowered to audit and apply all the security
    patches. It is no longer necessary to wait for somebody to compile binary packages
    that fix a security hole. Unless you examine the path and implement it yourself,
    you have no guarantee that the new binary package was built correctly and fixes
    the problem.


    The goal of Linux From Scratch is to build a complete and usable foundation-level
    system. If you do not wish to build your own Linux system from scratch, you may
    nevertheless benefit from the information in this book.


    There are many other good reasons to build your own LFS system to list them all
    here. In the end, education is by far the most powerful of reasons. As you continue
    in your LFS experience, you will discover the power that information and knowledge
    truly bring.


    # LFS Target Architectures


    The target architectures of LFS are the AMD/Intel x86 (32-bit) and x86_64 (64-bit)
    CPUs. On the other hand, the instructions in this book are also known to work,
    with some modifications, with the Power PC and ARM CPUs. To build a system that
    utilizes one of these CPUs, the maine requirement, in addition to those on the
    next page, is an existing Linux system such as an earlier LFS installation, Ubuntu,
    Red Hat/SUSE, or other distribution that targets the architecture that you want.
    Also note that a 32-bit distribution can be installed and used as a host system
    on a 64-bit AMD/Intel computer.


    For building LFS, the gain of building on a 64-bit system compared to a 32-bit
    system is minimal. For example, in the build of LFS9.1 on an i7-4790 CPU based
    system, using 4 cores, the following statistics were measured:


    | Architecture | Build Time | Build Size |

    |---|---|---|n| 32-bit | 239.9 minutes | 3.6 GB |

    | 64-bit | 233.2 minutes | 4.4 GB |


    As you can see, on the same hardware, the 64-bit build is only 3% faster and 22%
    larger than the 32-bit build. If you plan to use LFS as a LAMP server, or as a
    firewall, a 32-bit CPU may be sufficient. However, if you use LFS as a desktop,
    the editors recommend building on a 64-bit system.


    The default 64-bit build results from LFS is considered a "pure 64-bit system".
    That is, building a "multi-lib" system requires compiling many applications twice,
    once for a 32-bit system and once for a 64-bit system. This is not directly supported
    in LFS because it would interfere with the educational objective of providing
    the instructions needed for a straightforward base Linux system. Some LFS/editors
    maintain a fork of LFS for multilib, which is accessible at https://www.linuxfromscratch.org/~thomas/multilib/index.html.
    But it is an advanced topic.'
  merge: -1
