  md: '# Linux From Scratch - Version 11.0


    System.map is a symbol file for the kernel. It maps the function entry points
    of every function in the kernel API, as well as the addresses of the kernel data
    structures for the running kernel. It is used as a resource when investigating
    kernel problems. Issue the following command to install the file:


    ```

    cp -iv System.map /boot/System.map-5.13.12

    ```


    The kernel configuration file .config produced by the make menuconfig step contains
    all the configuration selections for the kernel that was compiled. It is a good
    idea to keep this file for future reference:


    ```

    cp -iv .config /boot/config-5.13.12

    ```


    Install the documentation for the Linux kernel:


    ```

    install -d /usr/share/doc/linux-5.13.12

    cp -r Documentation/* /usr/share/doc/linux-5.13.12

    ```


    It is important to note that the files in the kernel source directory are not
    owned by root. When a package is unpacked as root (which we did inside chroot),
    the files have the user and group IDs of whatever they were on the packer''s computer.
    This is usually not a problem for any package to be removed after installation.
    However, the Linux source tree is often retained for a long time. Because of this,
    there is a chance whatever user ID the package used will be assigned to somebody
    on the machine. That person would then have access to the kernel source.


    > Note

    In many cases, the configuration of the kernel will need to be updated for packages
    that will be installed later in BLFS. Unlike other packages, it is not necessary
    to remove the kernel source tree after the newly built kernel is installed.

    If the kernel source tree is going to be retained, run chown -R 0:0 on the linux-5.13.12
    directory to ensure all files are owned by user root.


    > Warning

    Some kernel documentation recommends creating a symlink from /usr/src/pointing
    to the kernel source directory. This is specific to kernels prior to the 2.6 series
    and must not be created on an LFS filesystem as it can cause problems for packages
    you wish to build over your BLFS system complete.


    > Warning

    The headers in the system''s include directory (/usr/include) should always be
    the ones against which libc was compiled, that is, the sanitised headers installed
    in Section 5.4, "Linux-5.13.12 API Headers". Therefore, they should never be replaced
    by either the raw kernel headers or any other kernel sanitized headers.


    # 10.3.2. Configuring Linux Module Load Order


    Most of the Linux modules are loaded automatically, but sometimes it needs specific
    direction. The program that loads modules, modprobe or insmod, uses /etc/modprobe.d/usb.conf
    for this purpose. This file needs to be created so that the USB drivers (ehci_hcd,
    ohci_hcd and uhci_hcd) have been built as modules, they will be loaded in the
    correct order; ehci_hcd needs to be loaded prior to ohci_hcd and uhci_hcd in order
    to avoid a warning at boot time.'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'Create a new file /etc/modprobe.d/usb.conf by running the following:


    ```

    install -v -m755 -d d /etc/modprobe.d

    cat /etc/modprobe.d/usb.conf << "EOF"

    # Begin /etc/modprobe.d/usb.conf

    ```


    ```

    install ohci_hcd /sbin/modprobe ehci_hcd ; /sbin/modprobe -i ohci_hcd ; true

    install uhci_hcd /sbin/modprobe ehci_hcd ; /sbin/modprobe -i uhci_hcd ; true

    ```


    ```

    # End /etc/modprobe.d/usb.conf

    EOF

    ```


    # 10.3.3. Contents of Linux


    Installed files: config-5.13.12, vmlinuz-5.13.12-lfs-11.0, and System.map-5.13.12

    Installed directories: /lib/modules,/usr/share/doc/linux-5.13.12


    # Short Descriptions


    config-5.13.12 Contains all the configuration selections for the kernel


    vmlinuz-5.13.12-lfs-11.0 The engine of the Linux system. When turning on the computer,
    the kernel is the first part of the operating system that gets loaded. It detects
    and initializes all components of the computer''s hardware, then makes these components
    available as a tree of files to the software and turns a single CPU into a multitasking
    machine capable of running scores of programs seemingly at the same time


    System.map-5.13.12 A list of addresses and symbols; it maps the entry points and
    addresses of all the functions and data structures in the kernel'
