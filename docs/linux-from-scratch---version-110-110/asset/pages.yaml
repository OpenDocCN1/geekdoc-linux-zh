  md: '# Important


    In this section, the test suite for GCC is considered critical. Do not skip it
    under any circumstance.


    One of tests in the GCC test suite is known to exhaust the default stack, so increase
    the stack size prior to running the tests:


    ```

    ulimit -s 32768

    ```


    Test the results as a non-privileged user, but do not stop at errors:


    ```

    chown -Rv tester .\nsu tester -c "PATH=$PATH make -k check"

    ```


    To receive a summary of the test suite results, run:


    ```

    ../contrib/test_summary

    ```


    For only the summaries, pipe the output through grep -A7 Summ.


    Results can be compared with those located at https://www.linuxfromscratch.org/lfs/build-logs/11.0/
    and https://gnu.org/ml/gcc-lfs-testresults/


    Eight tests related to analyzer known to fail.


    One named asan_test.C is known to fail.


    In libstdc++, one named 49745.cc is known to fail because the header dependencies
    in glibc have changed.


    In libstdc++, one numpunct test and six tests related to get_time are known to
    fail. These are all because the locale definitions in glibc have changed but libstdc
    does not currently support those changes.


    A few unexpected failures cannot be avoided. The GCC developers are usually aware
    of these issues, but have not resolved them yet. Unless the tests are very different
    from those above the URL, it is safe to continue.


    Install the package and remove an unnecessary directory:


    ```

    make install\nrm -rf /usr/lib/gcc/$(gcc-dumpmachine)/11.2.0/include-fixed/bits/

    ```


    The GCC directory is owned by tester now and the ownership of the installed header
    directory (and its content) will be correct. Change the ownership to root user
    and group:


    ```

    chown -v -R root:root \n/usr/lib/gcc/*linux-gnu-nnu-11.2.0/include,-fixed

    ```


    Create a symlink required by the FHS for "historical" records:


    ```

    ln -svr /usr/bin/cpp /usr/lib

    ```


    Add a compatibility symlink to enable building programs with Link Time Optimization
    (LTO):


    ```

    ln -sfv ../../libexec/gcc/$(gcc-dumpmachine)/11.2.0/libto_plugin.so \n/usr/lib/bfd-plugins/

    ```'
