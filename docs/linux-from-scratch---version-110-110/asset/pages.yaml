  md: '# Chapter 7. Entering Chroot and Building Additional Temporary Tools


    # 7.1. Introduction


    This chapter shows how to build the last missing bits of the temporary system:
    the tools needed by the build machinery of various packages. Now that all circular
    dependencies have been resolved, we can use a "chroot" environment, completely
    isolated the host operating system used for the build, except for the running
    kernel.


    For proper operation of the isolated environment, some communication with the
    running kernel must be established. This is done through the so-called Virtual
    Kernel File Systems, which must be mounted when entering the chroot environment.
    You may want to check that they are mounted by issuing `fmount`.


    Until Section 7.4,"Entering the Chroot Environment", the commands must be run
    as `root`, with the IFS variable set. After entering chroot, all commands are
    run as root, fortunately without access to the OS of the computer you built LFS.
    Be careful anyway, as it is easy to destroy the LFS system with badly formed commands.


    # 7.2. Changing Ownership


    > Note The commands in the remainder of this book must be performed while logged
    in as user root and no longer as user lfs. Also, double check that $IFS is set
    in root''s environment.


    Currently, the whole directory hierarchy in $IFS is owned by the user root, a
    user that exists only on the host system. If the directories and folders under
    $IFS are kept as they are, they will be owned by a user ID without a corresponding
    account. This is dangerous because a user account created later could get this
    same user ID and would own all the files under $LFS, exposing these files to malicious
    manipulation.


    To address this issue, change the ownership of the $LFS/* directories to user
    root by running the following command:


    ```

    chown -R root:root $IFS/{usr,lib,var,etc,bin,sbin,tools}

    case $(uname -m) in

    x86_64) chown -R root:root $LFS/lib64 ;;

    esac

    ```


    # 7.3. Preparing Virtual Kernel File Systems


    Various file systems exported by the kernel are used to communicate to and from
    the kernel itself. These file systems are virtual in that no disk space is used
    for them. The content of the file systems resides in memory.


    Begin by creating directories onto which the file systems will be mounted:


    ```

    mkdir -pv $IFS/{dev,proc,sys,run}

    ```'
  merge: -1
  pgno: 92
- img_proc: true
  md: "# 7.3.1. Creating Initial Device Nodes\n\nWhen the kernel boots the system,\
    \ it requires the presence of a few device nodes, in particular the console and\
    \ null devices. The device nodes must be created on the hard disk so they are\
    \ available before the kernel /dev/, and additionally when Linux is started with\
    \ init=/bin/bash. Create the devices by running the following commands:\n\n```\n\
    mknod -m 600 LFS/dev/console 5 1\nmknod -m 666 LFS/dev/null c 1 3\n```\n\n# 7.3.2.\
    \ Mounting and Populating /dev\n\nThe recommended method of populating the /dev\
    \ directory with devices is to mount a virtual filesystem (such as tmpfs) on the\
    \ /dev directory, and allow the devices to be created dynamically on that virtual\
    \ filesystem as they are detected or accessed. Device creation is generally done\
    \ during the boot process by Udev. Since this new system does not have Udev yet,\
    \ it is necessary to mount and populate /dev manually. This is accomplished by\
    \ binding the host system's /dev directory. A bind mount is a special type of\
    \ mount that allows you to create a mirror of a directory or mount point to some\
    \ other location. Use the following command to achieve this:\n\n```\nmount -v\
    \ --bind /dev LFS/$dev\n```\n\n# 7.3.3. Mounting Virtual Kernel File Systems\n\
    \nNow remain virtual kernel filesystems:\n\n```\nmount -v --bind /dev/pts LFS/$dev/pts\n\
    mount -vt proc proc LFS/$proc\nmount -vt sysfs sysfs LFS/$sys\nmount -vt tmpfs\
    \ tmpfs LFS/$run\n```\n\nIn some systems, /dev/shm is a symbolic link to /run/shm.\
    \ The run tmpfs was mounted so in this case only a directory needs to be created.\n\
    \n```\nif [ -h LFS/$dev/shm ]; then\n  mkdir -pv LFS/$(readlink LFS/$dev/shm)\n\
    fi\n```\n\n# 7.4. Entering the Chroot Environment\n\nNow that all the packages\
    \ which are required to build the rest of the needed tools are on the system,\
    \ it is to enter the chroot environment by installing the remaining temporary\
    \ tools. This environment will be in use also for the final system. As root, run\
    \ the following command to enter the environment that is, at the moment, populated\
    \ with only the temporary tools:\n\n```\nchroot \"LFS\" /usr/bin/env -i \\\nHOME=/root\
    \ \\\nTERM=$TERM \\\nPS1=' (lfs chroot) \\u:\\w\\$ \\\nPATH=/usr/bin:/usr/sbin\
    \ \\\n/bin/bash --login +h\n```"
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Linux From Scratch - Version 11.0


    The -i option given by the env command will clear all variables of the chroot
    environment. After that, the HOME, TERM, PS1, and PATH variables are set again.
    The TERM=$TERM construct will set the TERM inside chroot to the same value as
    outside chroot. This variable is needed for programs like vim and less to operate.
    If other variables are desired, such as CFLAGS or CXXFLAGS, this is a good place
    to set them again.


    From this point on, there is no need to use the LFS variable anymore because all
    work will be restricted to the LFS file system. This is because the Bash shell
    identifies that $ is now the root (/) directory.


    Notice that /tools/bin is not in the PATH. This means that the created toolchain
    will no longer be used in the chroot environment. This occurs when the shell does
    not “remember” the locations of executed binaries—for this reason, hashing is
    switched off by passing the +h option to bash.


    > Note

    It is important that all the commands throughout the remainder of this chapter
    and the following chapters are run from within the chroot environment. If you
    leave this environment for any reason (rebooting over example), ensure the virtual
    kernel filesystems are mounted as explained in Section 7.3.2, “Mounting and Populating
    /dev” and Section 7.3.3, “Mounting Virtual Kernel File Systems” and enter chroot
    before continuing with the installation.


    # 7.5. Creating Directories


    It is time to create the full structure in the LFS file system.


    Create some root-level directories that are not in the limited set required in
    the previous chapters by issuing the following command:


    ```

    mkdir -pv /{boot,home,mnt,opt,srv}

    ```'
