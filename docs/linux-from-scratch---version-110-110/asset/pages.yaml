  md: '# Note


    By default, vim only installs spell files for the English language. To install
    spell files for your preferred language, download the *.spl and optionally, the
    *.s files for your language and character encoding from http://ftp.vim.org/pub/runtime/spell/
    and save them to /usr/share/vim/vim82/spell/.


    To use these spell files, some configuration in /etc/vimrc is needed, e.g.:


    ```

    set spellang=en,ru

    set spell

    ```


    For more information, see the appropriate README file located at the URL above.


