  md: '# 8.39. Inutils-2.1


    The Inutils package contains programs for basic networking.


    Approximate build time: 0.3 SBU

    Required disk space: 30 MB


    # 8.39.1. Installation of Inutils


    Prepare Inutils for compilation:


    ```

    ./configure --prefix=/usr \

    --bindir=/usr/bin \

    --localstatedir=/var \

    --disable-logger \

    --disable-whois \

    --disable-rcp \

    --disable-rexec \

    --disable-login \

    --disable-rsh \

    --disable-servers

    ```


    The meaning of the configure options:


    --disable-logger

    This option prevents Inutils from installing the logger, which is used by scripts
    to pass messages to the System Log Daemon. Do not install it because Utill-linux
    installs a more recent version.


    --disable-whois

    This option disables the building of the Inutils whois client, which is out of
    date. Instructions for a better whois are in the BLFS book.


    --disable-r*

    These parameters disable the building of obsolete programs that should not be
    used due to security issues. The functions provided by these programs can be provided
    by the openssh package in the BLFS book.


    --disable-servers

    This disables the installation of the various network servers included as part
    of the Inutils package. These servers are deemed inappropriate in a basic LFS
    system. They are insecure by nature and are only considered safe on trusted networks.
    Note that better replacements are available for these servers.


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make check

    ```


    Install the package:


    ```

    make install

    ```'
