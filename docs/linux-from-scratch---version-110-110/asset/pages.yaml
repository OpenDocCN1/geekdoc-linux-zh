  md: 'Create the required set of subdirectories below the root-level by issuing the
    following commands:


    ```

    mkdir -pv /etc/{opt,sysconfig}

    mkdir -pv /lib/firmware

    mkdir -pv /media/{floppy,cdrom}

    mkdir -pv /usr/{local/{include,src}

    mkdir -pv /usr/local/{bin,sbin}

    mkdir -pv /usr/{local,}/share/{core,dict,doc,info,locale}

    mkdir -pv /usr/{local,}/share/{misc,tmp,zoneinfo}

    mkdir -pv /usr/{local,}/share/man/{1..8}

    mkdir -pv /var/{cache,log,mail,opt,spool}

    mkdir -pv /var/lib/{color,misc,locate}

    ```


    ```

    ln -sfv /run /var/run

    ln -sfv /run/lock /var/lock

    ```


    ```

    install -dv -m 0750 /root

    install -dv -m 1777 /tmp /var/tmp

    ```


    Directories are, by default, created with permission 755, but this is not desirable
    for all directories. In the commands above, two changes are made—one to the home
    directory of root, and another to the directories for temporary files.


    The first mode ensures that no one can enter the /root directory—the same as a
    normal user would do with his or her directory. The second change makes sure that
    any user can write to the /tmp and /var/ directories, but cannot remove another
    user''s files from them. The latter is protected by the so-called "sticky bit,"
    the highest bit (1) in the 1777 bit.


    # 7.5.1 FHS Compliance Note


    The directory tree is based on the Filesystem Hierarchy Standard (FHS) (available
    at https://refspec.linux.foundation/org/fhs.html). The FHS also allows the optional
    existence of some directories such as /usr/local/games and /usr/share/games. We
    create only the directories that are needed. However, free to create these directories.


    # 7.6. Creating Essential Files and Symlinks


    Historically, Linux maintains a list of mounted files in the file /etc/mtab. Modern
    kernels maintain this internally and export it via the /proc filesystem. To satisfy
    utilities that expect the presence of /etc/mtab, create the following symbolic
    link:


    ```

    ln -sv /proc/self/mounts /etc/mtab

    ```


    Create a basic /etc/hosts file to be referenced in some tests, and in one of Perl''s
    configuration files as:


    ```

    127.0.0.1  localhost $(hostname)

    ::1        localhost

    EOF

    ```


    In order for root to be able to login and for the name "root" to be recognized,
    there must be relevant entries in the /etc/passwd and /etc/group files.'
