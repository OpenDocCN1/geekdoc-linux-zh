  md: '# Linux From Scratch - Version 11.0


    Before we make a backup, unmount the virtual systems:


    ```

    umount $LFS/dev/{pts,}

    umount $LFS/{sys,proc,run}

    ```


    Create the backup archive by running the following command:


    > Note

    The backup archive is compressed, it takes a relatively long time (over 10 minutes)
    even on a reasonably fast system.

    Also, ensure the $LFS environment variable is set for the root user.


    ```

    cd $LFS

    t -cJf $HOME/lfs-temp-tools-11.0.tar.xz

    ```


    Replace $LFS by a directory of your choice if you do not want to have the backup
    stored in root’s home directory.


    # 7.14.3. Restore


    In some mistakes have been made and you need to start over, you can use this backup
    to restore the system and save some recovery time. Since the sources are located
    under $LFS, they are included in the backup archive as well, they do not need
    to be downloaded again. After checking that $LFS is set properly, restore the
    backup by executing the following commands:


    > Warning

    The following commands are extremely dangerous. If you run rm -rf/* as the root
    user and you do not change the $LFS directory or the LFS environment variable
    is not set for the root user, it will destroy your entire host system. YOU ARE
    WARNED.


    ```

    cd $LFS

    rm -rf ./

    t -xpf $HOME/lfs-temp-tools-11.0.tar.xz

    ```


    Again, double check that the environment has been set properly and continue building
    the rest of the system.


    > Important

    If you left the chroot environment to create a backup or restart building using
    a restore, remember to check that the virtual filesystems are still mounted (findmnt
    | grep $LFS). If they are not mounted, remove them now as described in Section
    7.3, “Preparing Virtual Kernel File Systems” and re-enter the chroot environment
    (see Section 7.4, “Entering the Chroot Environment”) before continuing.


