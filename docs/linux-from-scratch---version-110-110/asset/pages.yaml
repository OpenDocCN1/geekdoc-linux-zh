    # 8.34.1. Installation of Bash


    Prepare Bash for compilation:


    ```

    ./configure --prefix=/usr \

    --docdir=/usr/share/doc/bash-5.1.8 \

    --without-bash-malloc \

    --with-installed-readline \

    ```


    The meaning of the new configure option:

    --with-installed-readline

    This option tells Bash to use the readline library that is already installed on
    the system rather than using its own readline version.


    Compile the package:


    ```

    make

    ```


    Skip down to "Install the package" if not running the test suite.

    To prepare the tests, ensure that the tester user can write to the sources tree:


    ```

    chown -Rv tester

    ```


    The testsuite of the package is designed to run as a non-root user who owns the
    terminal connected to standard input. To satisfy the requirement, spawn a new
    pseudo terminal using Expect and run the tests as the tester user:


    ```

    su -s /usr/bin/expect tester << EOF

    set timeout -1

    spawn make tests

    expect eof

    lassign [wait] -- -- value

    exit $value

    EOF

    ```


    Install the package:


    ```

    make install

    ```


    Run the newly compiled bash program (replacing the one that is currently being
    executed):

    exec /bin/bash --login +h


    > Note

    The parameters used make the bash process an interactive login shell and continues
    to disable hashing so that new programs are found as they they become available.'
