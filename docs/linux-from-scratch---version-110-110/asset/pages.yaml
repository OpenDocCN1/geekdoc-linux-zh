    # ## 8.2.2. Package Management Techniques


    The following are some common package management techniques. Before making a decision
    on a package manager, do some research on the various techniques, the drawbacks
    of the particular scheme.


    # ### 8.2.2.1. It is All in My Head!


    Yes, this is a package management technique. Some folks do not find the need for
    a package manager because they know the packages and know what files are installed
    by each package. Users also do not need package management because they rely on
    rebuilding the entire system when a package is changed.


    # ### 8.2.2.2. Install in Separate Directories


    This is a simplistic package management that does not need any extra package to
    manage the installations. Each package is installed in a separate directory. For
    example, package foo-1.1 is installed in /usr/pkg/foo-1 and a symlink is made
    from /usr/pkg/foo to /usr/pkg/foo-1. When installing a new version foo-1.2, it
    is installed in /usr/pkg/foo-1.2 and the previous symlink is replaced by a symlink
    to the new version.


    Environment variables such as PATH, LD_LIBRARY_PATH, MANPATH, INFOPATH and CPPFLAGS
    need to be expanded to include /usr/pkg/foo. For a few few packages, this scheme
    becomes unbearable.


    # ### 8.2.2.3. Symlink Style Package Management


    This is a variation of the previous package management technique. Each package
    is installed similar to the previous scheme. But instead of making the symlink,
    each is symlinked into the /usr hierarchy. This removes the need to expand the
    environment variables. Though the symlinks can be created by the user to automate
    the creation, package managers have been using this approach. A few of the popular
    ones include Stow, Epkg, Graft, and Depot.


    The installation needs to be fake, so that the package that it is installed in
    /usr though in reality it is installed in the /usr/pkg hierarchy. Installing in
    this manner is not a trivial task. For example, consider that you are installing
    a package libfoo-1.1. The following instructions may not install the package properly:


    ```

    ./configure --prefix=/usr/pkg/libfoo/1.1

    make

    make install

    ```'
