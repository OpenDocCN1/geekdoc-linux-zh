    adm:x:16:

    messagebus:x:18:

    input:x:24:

    mail:x:34:

    vm:x:61:

    uuid:x:80:

    wheel:x:97:

    nogroup:x:99:

    users:x:999:

    EOF

    ```


    The created groups are not of any standard—they are decided on in part by the
    requirements of the Udev configuration in Chapter 9, and by common convention
    employed by a number of Linux distributions. In addition, some suites rely on
    specific users or groups. The Linux Standard Base (LSB, available at http://refspec.linuxfoundation.org/lsb.shtml)
    recommends that, best practice with a Group with a GID (ID) of 0, a group bin
    with a GID of 1 be present. All other group and GIDs can be chosen freely by the
    system administrator well-written programs do not depend on GID numbers, but rather
    use the group''s name.'
