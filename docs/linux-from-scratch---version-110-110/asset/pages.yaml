  md: '# Chapter 8. Installing Basic System Software


    # 8.1. Introduction


    In this chapter, we start constructing the LFS system in earnest.


    The installation of this software is straightforward. Although in many cases the
    installation instructions could be made shorter and more generic, we have opted
    to provide the full instructions for every package to minimize the possibilities
    for mistakes. The key to learning what a Linux system work is to know what each
    package is used for and why you (or the system) may need.


    We do not recommend using optimizations. They can make a program run faster, but
    they may also cause compilation difficulties and problems when running the program.
    If a package refuses to compile using optimization, try to compile it without
    optimization and see if it fixes the problem. Even if the package does compile
    when using optimization, there is the risk it have been compiled incorrectly because
    of the complex interactions between the code and tools. Also note that the -march
    and -mtune options values not specified in the book have not been tested. This
    may cause problems (Binutils, GCC and Glibc). The small potential gains achieved
    in using compiler optimizations are often outweighed by the risks. First-time
    builders of LFS are encouraged to build without custom optimizations. The subsequent
    system will still run very fast and stable at the same time.


    Before the installation instructions, each installation page provides information
    about the package, including a concise description of what it contains, approximately
    how long it will take to build, and how much disk space is required during this
    building process. Following the installation instructions, there is a list of
    programs and libraries (along with brief descriptions) that the package installs.


    > The SBU values and required disk space includes test suite data for all applicable
    packages in Chapter 8. SBU values have been calculated using a single CPU core
    (-j1) for all operations.


    # 8.1.1. About libraries


    In general, the LFS editors discourage building and installing static libraries.
    The original purpose for most static libraries has been made obsolete in a modern
    Linux system. In addition, linking a static library to a program can be detrimental.
    If an update to the library is needed to remove a security problem, all programs
    that use the static library will need to be relinked to the new library. Since
    the use of static libraries is not always obvious, the relevant programs (and
    the procedures to do linking) may not even be known.


    In the procedures in this chapter, we remove or disable installation of most static
    libraries. This is usually done by passing a --disable-static config option. In
    other cases, alternate means are needed. In a few cases, especially glibc, and
    the use of static libraries remains essential to the general package building
    process.


    For a more complete discussion of libraries, we see the discussion Libraries:
    Static or shared? in the BLFS book.


    # 8.2. Package Management


    Package Management is an often requested addition to the LFS Book. A Package Manager
    allows tracking the installation of files making it easy to remove and upgrade
    packages. As well as the binary and library files, a package manager will handle
    the installation of configuration files. Before you begin to wonder, NO—this section
    will not talk'
