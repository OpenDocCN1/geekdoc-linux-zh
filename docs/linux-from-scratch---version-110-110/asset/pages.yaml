  md: '# 6.3. Ncurses-6.2


    The Ncurses package contains libraries for terminal-independent handling of character
    screens.


    Approximate build time: 0.7 SBU

    Required disk space: 48 MB


    # 6.3.1. Installation of Ncurses


    First, ensure that gawk is found first during configuration:


    ```

    sed -i s/mawk// configure

    ```


    Then, run the following commands to build the “tic” program on the build host:


    ```

    mkdir build

    pushd build

    ../configure

    make -C include

    make -C progs tic

    popd

    ```


    Prepare Ncurses for compilation:


    ```

    ./configure --prefix=$usr /

    --host=$LFS_TGT /

    --build=$(./config.guess) /

    --mandir=/usr/share/man /

    --with-manpage-format=normal /

    --with-shared /

    --without-debug /

    --without-ada /

    --without-normal /

    --enable-widec /

    ```


    The meaning of the new configure options:


    --with-manpage-format=normal


    This prevents Ncurses installing compressed manual pages, which may happen if
    the host distribution has itself compressed manual pages.


    --without-ada


    This ensures that Ncurses does not support build for the Ada compiler which may
    be present on the host but will not be available when we enter the chroot environment.


    --enable-widec


    This switches wide-character libraries (e.g., libcursesw.so.6.2) to be built instead
    of normal ones (e.g., libcurses.so.6.2). These wide-character libraries are usable
    in both multibyte and traditional 8-bit locales, normal libraries work only in
    8-bit locales. Wide-character and normal libraries are source-compatible, but
    not binary-compatible.


    --without-normal


    This switch disables building and installing most static libraries.'
