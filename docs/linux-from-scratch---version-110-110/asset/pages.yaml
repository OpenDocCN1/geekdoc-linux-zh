  md: "# Linux From Scratch - Version 11.0\n\nabout not recommend any particular package\
    \ manager. What it provides a roundup of the most popular techniques\nand they\
    \ work. The perfect package manager for you may be among these techniques or may\
    \ be a combination of\ntwo or more of these techniques. This section briefly mentions\
    \ issues that arise when upgrading packages.\nReasons why no package manager is\
    \ mentioned in LFS or BLFS include:\n\n+   - Dealing with package management takes\
    \ the focus away from the goals of these books—teaching how a Linux\nsystem is\
    \ built.\n- There are multiple solutions for package management, each having its\
    \ strengths and drawbacks. Including one that\nsatisfies all audiences is different.\n\
    \nThere are some hints written on topic of package management. Visit the Hints\
    \ Pocket and see if one of them\nyour need.\n\n# 8.2.1. Upgrade Issues\n\nA Package\
    \ Manager makes it easy to upgrade to newer versions that are released. Generally\
    \ the instructions in\nt LFS and BLFS books can be used to upgrade to the newer\
    \ versions. There are some points that you should be aware\nof upgrading packages,\
    \ especially on a running system.\n\n+   - If kernel needs to be upgraded (for\
    \ example, 5.10.17 to 5.10.18 or 5.11.1), nothing else needs to be\nrebuilt. The\
