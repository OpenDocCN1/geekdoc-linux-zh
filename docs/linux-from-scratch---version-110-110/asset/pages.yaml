  md: '# # Chapter 10. Making the LFS System Bootable


    # ## 10.1. Introduction


    It is time to make the LFS system bootable. This chapter discusses creating the
    `/etc/fstab` file, building a kernel for the

    new LFS system, and installing the GRUB boot loader so that the LFS system can
    be selected for booting at startup.


    # ## 10.2. Creating the /etc/fstab File


    The `/etc/fstab` file is used by some programs to determine which file systems
    are be mounted by default, in

    order, and which must be checked (for integrity entries) prior to mounting. Creating
    a new file systems table like this:


    ```

    cat > /etc/fstab << "EOF"

    # Begin /etc/fstab

    # file system mount-point type options dump fsck order

    /dev/<xxx> / <fff> defaults 1 1

    /dev/<yyy> swap swap pri=1 0 0

    /proc /proc proc nouid,noexec, nodev 0 0

    sysfs /sys sysfs nouid,noexec, nodev 0 0

    devpts /dev/pts devpts gid=5,mode=620 0 0

    tmpfs /run tmmpfs defaults 0 0

    devmtmps /dev devmtmps mode=0755,nosuid 0 0

    # End /etc/fstab

    EOF

    ```


    Replace `<xxx>`, `<yyy>`, and `<fff>` with the values appropriate for the system,
    for example, `sda2`, `sda5`, and `ext4`.

    For the details in this file, you must see `man fstab`.


    Filesystems with MS-DOS or Windows origin (i.e. vfat, nfsfs, cifs, iso9660, udf)
    need a special option, utf8

    in order for non-ASCII characters in file names to be interpreted properly. For
    non-UTF-8 locales, the value of

    iocharset should be set to be the same as the character set of the locale, adjusted
    in such a way that the kernel

    stands it. This works if the relevant character set has been compiled into the
    kernel or as a module. However, if the character set

    the locale is UTF-8, the option `iocharset=utf8` would make the file system sensitive.
    To

    this, use the special option `utf8` of `iocharset=utf8`, for UTF-8 locales. The
    "codepage" option is also

    needed for vfat and smbfs filesystems. It should be set to the codepage number
    used under MS-DOS in your country.

    For example, in order to mount USB drives, a `_RU_KOI8-R` user would need the
    following options in partition


    ```

    noauto,user,quiet, showexec, codepage=866, iocharset=koi8r

    ```


    The corresponding options fragment for `_RU_UTF-8` users is:


    ```

    noauto,user,quiet, showexec, codepage=866, utf8

    ```'
  merge: -1
