  md: '# 58. Groff-1.22.4


    The Groff package contains programs for processing and formatting text.

    Approximate build time: 0.5 SBU

    Required disk space: 88 MB


    # 5.58.1. Installation of Groff


    Groff expects the environment variable PAGE to contain the default paper size.
    For users in the United States, PAGE=letter is appropriate. Elsewhere, PAGE=A4
    may be more suitable. While the default paper size is configured during compilation,
    it can be overridden by echoing “A4” or “letter” to the /etc/papersize file.


    Prepare Groff for compilation:


    ```

    PAGE=<paper_size> .configure --prefix=/usr

    ```


    This package does not support parallel build. Compile the package:


    ```

    make -j1

    ```


    This package does not come with a test suite.


    Install the package:


    ```

    make install

    ```


    # 5.58.2. Contents of Groff


    Installed programs:


    addftinfo, afmotid, chem, eqn, eqn2graph, giffmk, glylipond, gperl, gpinyin, graph2graph,
    grn, godvi, groff, gropper, grog, golbp, golj4, grops, grotty, hpfdotinfo, indxbib,
    lkbib, lookbib, mroff, neqn, nroff, pdfdm, pdfroff, pbtfops, pic, pic2graph, post-grohtml,
    pre-grohtml, refer, roff2rdi, roff2html, roff2pdf, roff2ps, roff2text, roff2x,
    soelim, tbl, tmfotdid, and troff


