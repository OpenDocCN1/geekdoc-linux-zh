  md: '# 9.3. Overview of Device and Module Handling


    In Chapter 8, we installed the udev package when eudev was built. Before we go
    into the details regarding how this works, a brief history of previous methods
    of handling devices is in order.


    Linux systems in general traditionally used a static device creation method, whereby
    a great many device nodes were created under /dev (sometimes thousands of nodes),
    regardless of whether the corresponding devices actually existed. This was typically
    done via a MAKEDEV script, which contains a number of calls to the mknod program
    with the relevant major and minor device numbers for every possible device that
    might exist in the world.


    Using udev, method only devices which are detected by the kernel dev device nodes
    for them. Because these device nodes will be created each time the system boots,
    they will be stored on a dev.tmpfs file system (a virtual file that resides entirely
    in system memory). Device nodes do not require much space, so the memory is used
    is negligible.


    # 9.3.1. History


    In February 2000, a new filesystem called devfs was merged into the 2.3.4 kernel
    and was made available during the 2.4 series of stable kernels. Although it was
    present in the kernel source itself, this method of creating devices dynamically
    never received overwhelming support from the core kernel developers.


    The main problem with the approach adopted by devfs was the way it handled device
    detection, connection, and naming. The latter issue, that of device naming, was
    perhaps the most critical. It is generally accepted that if names are allowed
    to be configurable, the device naming policy should be up to a system administrator,
    not imposed by any particular developer(s). The devfs file also suffered from
    race conditions that were inherent in its design and could not be fixed without
    a substantial revision to the kernel. It was marked as deprecated for a long period
    – due to a lack of maintenance – and finally removed from the kernel in June,
    2006.


    With the development of the unstable 2.5 kernel tree, later released as the 2.6
    series of stable kernels, a new filesystem called sysfs came to be. The job of
    sysfs is to export a of the system''s hardware configuration to users processes.
    With this sysfs-visible representation, the possibility of developing a sysfs
    replacement for devfs became more realistic.


    # 9.3. Udev Implementation


    # 9.3.2.1. Sysfs


    The sysfs filesystem was mentioned briefly above. One may wonder how sysfs knows
    about the devices present on a system and what device numbers should be for them.
    Drivers that have been compiled into the kernel directly register their objects
    with a sysfs (devtmpfs internally) as they are detected by the Kernel. For drivers
    compiled modules, this registration will happen when the module is loaded. The
    sysfs filesystem is mounted on (/sys), which data drivers register with sysfs
    are available to users processes and to udev for processing (modifications to
    device nodes).


    # 9.3.2. Device Node Creation


    Device files are created by the kernel by the devtmpfs filesystem. Any driver
    that wishes to register a device node will go through the devtmpfs (via the driver
    core) to do it. A devtmpfs instance is mounted on /dev, the device node will initially
    be created with a fixed name, permissions, and owner.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Linux From Scratch - Version 11.0


    A short time later, the kernel will send a event to udev. Based on the rules in
    the files with /etc/udev/rules.d, /usr/lib/udev/rules.d, and /run/udev/rules.d
    directories, udev will create additional symlinks to the device node, or change
    its permissions, owner, or group, or modify the initial udev database entry (name)
    for object.


    The rules in these directories are numbered and all three directories are merged
    together. If udev can''t find a rule for the device it is creating, it will leave
    the permissions and ownership at whatever devtmpfs was initially.


    # 9.3.2. Module Loading


    Device drivers as modules may have aliases built into them. Aliases are visible
    in the output of the modinfo program and are usually related to the bus-specific
    identifiers of devices supported by a module. For example, the snd-f801 driver
    supports PCI devices with device ID 0x0139 and device ID 0x0801, and has an alias
    of :pci:v0001139d0000801x*sdbc4c011*. For most devices, the bus driver exports
    the aliases of the driver that would handle the device via sysfs. E.g., /sys/bus/pci/0000:00:0d.0/devices
    might contain the string "pci:v0001139d0000801xv0000139d0000139b04c0100". The
    default rules with udev will use udev to call out /sbin/modprobe with the contents
    of the MODALIAS environment variable thus loading all modules whose aliases match
    this string wildcard expansion.


    In this example, that in addition to snd-f801, the obsolete (and unwanted) forte
    driver will be loaded if it is available. See below for ways in which loading
    of unwanted drivers can be prevented.


    The kernel itself is also able to load modules for network protocols, filesystems,
    and NLS support on demand.


    # 9.3.4. Handling Hotpluggable/Dynamic Devices


    When you plug in a device, such as a Universal Serial Bus (USB) MP3 player, the
    kernel recognizes that the device is now connected and generates a uevent. This
    event is then handled by udev as described above.


    # 9.3.3. Problems with Loading and Creating Devices


    There are a few possible problems when it comes to automatically creating device
    nodes.


    # 9.3.1. A kernel module is not automatically loaded


    Udev will only load a module if it has a bus-specific alias and the bus driver
    exports the necessary aliases to sysfs. In other cases, one should trigger module
    loading by others. With Linux-5.13.12, udev is known to load well-written drivers
    for INPUT, PCI, USB, SCSI, SERIO, and FireWire.


    To determine if the device requires the necessary support for udev, run modinfo
    with the same name as you. Now the kernel will call out to /sys/bus and check
    whether there is a modalias file.


    If the modalias file exists in sysfs, the driver supports the device and can talk
    to it directly, but doesn''t have the aliases, it is a buggy. Load the driver
    without the help of udev and expect the issue to be fixed later.


    If there is no modalias file in the relevant directory under /sys/bus, this means
    that the kernel developers have not added modalias support to this type. With
    Linux-5.13.12, this is the case with ISA buses. This issue is to be fixed in later
    kernel versions.


    Udev is not intended to load "wrapper" drivers as snd-pcm-oss and non-hardware
    drivers as loop at all.


    233'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# 9.3.3.2. A kernel module is not loaded automatically, and udev is not intended
    to load


    If the "wrapper" module only enhances the functionality provided by some other
    module (e.g., snd-pcm enhances the functionality of the snd-pcm by making the
    sound available to OSS applications), configure modprobe to load the wrapper after
    udev loads the wrapped module. To do this, add a "softdep" to the line /etc/modprobe.d/<filename>.conf.
    For example:


    ```

    softdep snd-pcm post: snd-pcm-oss

    ```


    Note that the "softdep" command also allows pre: dependencies, or a mixture of
    pre: and post: dependencies. See the modprobe.d(5) manual page for more information
    on "softdep" syntax and capabilities.


    If the module in question is not a wrapper and is used by itself, configure the
    modules bootstrap to load this module on system boot. To do this, add the module
    name to the /etc/sysconfig/modules file on a separate line. This works for modules
    too but is suboptimal in that case.


    # 9.3.3.3. Udev loads some unwanted module


    Either do not build the module, or blacklist it in a /etc/modprobe.d/blacklist.conf
    file as done with the forte module in the example below:


    ```

    blacklist forte

    ```


    Blacklisted modules can still be loaded manually with the explicit modprobe command.


    # 9.3.3.4. Udev creates a device incorrectly, or makes a wrong symlink


    This usually happens if a rule unexpectedly fails to match a device. For example,
    a poorly-written rule can match both a device (as desired) and the corresponding
    SCSI device (incorrectly) by vendor. Finding the rule and making it more specific,
    with the help of the udevadm info command.


    # 9.3.3.5. Udev creates rules unnecessarily


    This may be another manifestation of the previous problem. If not, and your rule
    uses sysfs attributes, it may be a kernel timing issue, to be fixed in later kernels.
    For now you can work around it by creating a rule that waits for the sysfs attribute
    and appending it to the /etc/udev/rules.d/10-wait_for_sysfs.rule (create this
    file if it does not exist). Please notify the Udev Development list if you do
    so and helps.


    # 9.3.3.6. Udev does not create a device


    Further text shows that the device is built into the kernel or already loaded
    as a module, and that that does not export its data to sysfs.


    Udev has no information to create a device node if a kernel driver does not export
    its data to sysfs. This is common with third party drivers from outside the kernel.
    A static device node in /usr/lib/udev/devices with the appropriate major/minor
    numbers (see the devices.txt inside the kernel documentation or the documentation
    provided by the third party driver vendor). The static device will be copied to
    /dev udev.


    # 9.3.3.7. Device naming order changes randomly after rebooting


    This is due to fact that udev, by design, handles events and loads modules in
    parallel, and thus in an unpredictable order. This will never be "fixed". You
    should not rely on the kernel device name being stable. Instead, create your own
    rules to make symlinks with stable names based on some attributes of the device,
    such as a serial number or the output of *_id utilities installed by udev. See
    Section 9.4, "Managing Devices" and Section 9.5, "General Network Configuration"
    for examples.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 9.3.4. Useful Reading


    Additional helpful documentation is available at the following sites:


    +   - A Userspace Implementation of devfs http://www.roah.com/linux/talks/ols_2003_udev_paper/Reprint-Koah-Hartman-OLS2003.pdf

    - The sysfs Filesystem http://www.kernel.org/pub/linux/kernel/people/doc/papers/ols-2005-mchel.pdf


    # 9.4. Managing Devices


    # 9.4.1. Network Devices


    Udev, by default, names network devices according to Firmware/BIOS data or physical
    characteristics the bus, slot, or MAC address. The purpose of this naming convention
    is to ensure network devices are named consistently and not based on the time
    the network card was discovered. For example, on a computer having two network
    cards made by Intel and Realtek, the network card manufactured by Intel may become
    eth0 and the Realtek cards become eth1. In some cases, after a reboot the cards
    could get renamed the other way.


    In the new naming scheme, typical network device names would then be becoming
    emp5s0 or wlp3s. If naming is not desired, the traditional naming scheme or a
    custom scheme can be implemented.


    # 9.4.1.1. Disabling Persistent Naming on the Kernel Command Line


    The traditional naming scheme using eth0, eth1, can be restored by adding net.ifnames=0
    on the kernel command line. This is most appropriate for systems that have only
    one device of the same type. Laptops often have multiple ethernet connections
    that are named eth0 and wlan0 are also candidates for this method. The command
    is passed in the GRUB configuration file. See Section 10.4.4, “Creating the GRUB
    Configuration”.


    # 9.4.1.2. Custom Udev Rules


    The naming scheme can be customized by creating custom udev rules. A script has
    been included that generates the initial rules. These rules can be modified:


    ```

    bash /usr/lib/udev/init-net-rules

    ```


    Now, inspect the /etc/udev/rules.d/70-persistent-net.rules file, to find which
    name was assigned to your network device:


    ```

    cat /etc/udev/rules.d/70-persistent-net.rules

    ```


    > Note

    In some cases such as when MAC addresses have been assigned to a network card
    manually or in a virtual environment such as Qemu or Xen, the network rules file
    may not have been generated because addresses are not consistently assigned. In
    these cases, this method cannot be used.


    The file begins with a comment block followed by two lines for each NIC. The first
    line for each NIC is a comment showing its hardware IDs (e.g. its PCI vendor and
    device IDs, if it’s a PCI card), along with its driver in parentheses, if the
    driver can be found. Neither the hardware ID nor the driver is used to determine
    which name to give an interface; this information is only for reference. The second
    line is the udev rule that matches this NIC and actually assigns it a name.'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'All dev rules are made up of several keys, separated by commas and optional
    whitespace. This rule''s keys and an explanation of each of them as follows:


    +   - SUBS="net" - This tells udev to ignore devices that are not network cards.


    +   - ACTION="add" - This tells udev to ignore this rule for a uevent that isn''t
    an add (remove) and change) uevent also, but don''t need to rename interfaces.


    +   - DRIVERS="*" - This exists so that udev will ignore VLAN or bridge sub-interfaces
    (because these sub-interfaces do not have drivers). These sub-interfaces are skipped
    because the name that would be assigned would collide with their parent devices.


    +   - ATTR(address) - The value of this key is the NIC''s MAC address.


    +   - ATTR(type="interface") - This ensures the rule only matches the primary
    interface in the case of wireless drivers which create multiple virtual interfaces.
    The secondary interfaces are skipped for the same reason that VLAN and bridge
    sub-interfaces are skipped: this would be a name collision otherwise.


    +   - NAME - The value of this key is the name that udev will assign to this interface.


    The value of NAME is the important part. Make sure you know which name has been
    assigned to each of your network cards before proceeding, and be sure to use NAME
    value when creating your configuration files below.


    # 9.4.2. CD-ROM symlinks


    Some that you might want to install (e.g., various players) should not use /dev/cdrom
    and /dev/dvd symlinks, to point to a CD-ROM or DVD-ROM device. Also, it may be
    convenient to refer to symlinks into /etc/fstab. Udev has a script that will generate
    rules to create these symlinks for you, depending on the capabilities of each
    device, but you will need to decide which of two modes of operation you wish to
    use the script.


    First, the script can operate in "by-path" mode (used by default for USB and FireWire
    devices), where the rules it depends on the physical path to the CD or DVD device.
    Second, it can operate in "by-id" mode (default for IDE and SCSI devices), where
    the rules it depends on create identification strings stored on the CD or DVD
    device. The path is determined by udev''s path_id script, and the identification
    strings are read from the hardware by its ata_id or scsi_id devices, depending
    on which type of device you have.


    There are advantages to each; the correct approach will depend on what kinds of
    changes may happen. If you use the "by-path" mode, you you plan on moving the
    device to a different IDE port or a different USB connector, then you should use
    the "by-id" mode. On the other hand, if you expect the device''s identification
    to change, for example it may die, and you would replace it with a different device
    with the same capabilities and which is plugged into the same connectors, then
    you should use the "by-path" mode.


    If either type of change is possible with your drive, then choose a mode based
    on the type of change you expect to have more.


    > External devices (for example, a USB-connected CD drive) should not use by-path
    persistence, because each time the device is plugged into a new external port,
    its physical path will change. All-connected devices will have this problem if
    you write udev rules to recognize them by their physical path; the problem is
    not limited to CD and DVD drives.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'If you wish to see the values the udev scripts will use, then for the corresponding
    CD-ROM device, the corresponding directory under /sys (e.g., this can be /sys/block/hddn)
    and run a command similar to the following:


    ```

    udevadm test /sys/block/hdd

    ```


    Look at the lines containing the output of *_id programs. The "by-id" mode will
    use the ID_SERIAL value if it exists and is not empty, otherwise it will use a
    combination of ID_MODEL and ID_REVISION. The "by-path" mode will use the ID_PATH
    value.


    If the default mode is not suitable for your situation, then the following modification
    can be made to the /etc/udev/rules.d/83-cdrom-symlinks.rules file, as follows
    (where mode is of "by-id" or "by-path")


    ```

    sed -e ''/write_cd_rules/"write_cd_rules mode/'' \

    -i /etc/udev/rules.83-cdrom-symlinks.rules

    ```


    Note that it is important to create the rules or symlinks at this time because
    you have bound-mounted the host''s /dev directory into the LFS system and we assume
    the system exists on host. The rules will be created the first time you boot your
    LFS system.


    However, if you have multiple CD-ROM devices, then the symlinks generated at that
    time may point to different devices than they point on your host because the system
    will be stable, this is only if you need the symlinks on both to point to the
    same device. If you need that, then inspect (possibly edit) the /etc/udev/rules.d/70-persistent-cd.rules
    file before booting, to make all symlinks match what you want.


    # 9.4.3. Dealing with duplicate devices


    As explained in Section 9.3, "Overview of Device and Module Handling," the order
    in which devices with the same function appear in /dev is random. E.g., if you
    have a USB camera and a TV tuner, sometimes /video0 refers to the camera and /video1
    refers to the tuner, and sometimes a reboot changes the order. For all classes
    of hardware except sound cards and network cards, this is fixable by creating
    udev rules for custom persistent links. The case of network cards is covered separately
    in Section 9.5, "General Network Configuration," and sound configuration can be
    found in BLFS.


    For each of your devices that is likely to have this problem if the problem does
    not exist in your current Linux distribution), find the corresponding directory
    under /sys/class or /sys/block. For video devices, then check the attributes that
    identify the device (usually, vendor and ID products) and assign names works:


    ```

    udev info -a -p /sys/class/video4linux/video0

    ```


    Write rules that create the symlinks, e.g.:


    ```

    cat > /etc/udev/rules.83-duplicate_devices.rules << "EOF"


    # Persistent links for webcam and tuner

    KERNEL="video*", ATTRS(idProduct)="1910", ATTRS(idVendor)="0d81", SYMLINK+="video"

    KERNEL="video*", ATTRS(device)="0306f", ATTRS(vendor)="0109e", SYMLINK+="tuner"


    EOF

    ```'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'The result is /dev/video0 and /dev/video1 devices still refer to the tuner
    and the web camera (and thus should not be used directly), there are symlinks
    /dev/tvtuner and /dev/webcam that always point to the correct device.


    # 9.5. General Network Configuration


    # 9.5.1. Creating Network Interface Configuration Files


    Which interfaces are brought up and down by the network script usually depends
    on the files in /etc/sysconfig/. This directory should contain a file for each
    interface to be configured, such as ifconfig.xyz, where "xyz" describe the network
    card. The interface name (e.g. eth0) is usually appropriate. Inside this file
    are attributes to the interface, such as its IP address(es), subnet masks, and
    so forth. It is necessary that the stem of the filename be ifconfig.


    > Note\If the procedure in the previous section was not used, udev will assign
    network card interface names based on system physical characteristics as en2s1.
    If you are not sure what your interface name is, you can always run ip link or
    ls /sys/class/net after you have booted your system.


    The following command creates a sample file for the eth0 device with a static
    IP address:


    ```

    cd /etc/sysconfig/

    cat > ifconfig.eth0 << "EOF"

    ONBOOT=yes

    IFACE=eth0

    SERVICE=ipv4-static

    IP=192.168.1.2

    GATEWAY=192.168.1.1

    PREFIX=24

    BROADCAST=192.168.1.255

    EOF

    ```


    The values in italics must be changed in every file to match the proper setup.


    If the ONBOOT variable is set to "yes" the System network script will bring the
    Network Interface Card (NIC) during the system boot process. If set to anything
    but "yes" the NIC will be ignored by the network script and not automatically
    brought up. The interface can be manually started or stopped with the ifup and
    ifdown commands.


    The IFACE variable defines the interface name, for example, eth0. It is required
    for all network configuration files. The filename extension must match this value.


    The SERVICE variable defines the method used for obtaining the IP address. The
    LFS-Bootscripts package has a modular IP assignment format, and creating additional
    files in /lib/services/ directory allow other IP assignment methods. This is commonly
    used for Dynamic Host Configuration Protocol (DHCP), which is addressed in the
    BLFS book.


    The GATEWAY variable should contain the default gateway IP address, if one is
    present. If not, comment out the variable entirely.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Linux From Scratch - Version 11.0


    The PREFIX variable contains the number of bits used in the subnet. Each octet
    in an IP address is 8 bits. If the netmask is 255.255.255.0, then is using the
    first three octets (24 bits) to specify the network number. If the netmask is
    255.255.255.240, it is using the first 28 bits which are commonly used by DSL
    and cable-based Internet Service Providers (ISPs). In this example (PREFIX=24),
    the netmask is 255.255.255.0. Adjust the PREFIX variable according to your specific
    subnet. If omitted, the PREFIX defaults to 24.


    For more information, see the *ifup* man page.


    # 9.5.2. Creating the /etc/resolv.conf File


    The system will need means of obtaining Domain Name Service (DNS) name resolution
    to resolve Internet domain to IP addresses, and vice versa. This is achieved by
    placing the IP address of the DNS server, available from the ISP or network administrator,
    into `/etc/resolv.conf`. Create the file by running the following:


    ```

    cat /etc/resolv.conf << "EOF"

    # Begin /etc/resolv.conf


    domain <Your Domain Name>

    nameserver <IP address of your primary nameserver>

    nameserver <IP address of your secondary nameserver>


    # End /etc/resolv.conf

    EOF

    ```


    The Domain statement can be omitted or replaced with a search statement. See the
    page for /etc/resolv.conf for more details.


    Replace `<IP address of the nameserver>` with the IP address of the DNS most appropriate
    for the setup. There will be more than one entry (required secondary nameserver
    for fallback capability). If you only need or one DNS server, remove the second
    nameserver line from the file. The IP address may also be a router on the local
    network.


    > Note The Global Public IPv4 DNS addresses are 8.8.8.8 and 8.8.4.4.


    # 9.5.3. Configuring the system hostnam


    During the boot process, the file `/etc/hostname` is used for establishing the
    system’s hostname.


    Create the `/etc/hostname` file and enter a hostname by running:


    ```

    echo "<hostname>" > /etc/hostname

    ```


    <hostname> needs to be replaced with the name given to the computer. Do not enter
    the Fully Qualified Domain Name (FQDN) here. Information is put in the `/etc/hosts`
    file.


    # 9.5.4. Customizing the /etc/hosts File


    Decide on the IP address, fully-qualified domain name (FQDN), and possible aliases
    for use in the `/etc/hosts` file. The syntax is:


    ```

    IP_address myhost.example.org aliases

    ```'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'Unless the computer is ever to be visible to the Internet (i.e., there is a
    registered domain and a value block of IP addresses—most users do not have this),
    make sure that the IP address is in the private network address range. Valid ranges
    are:


    | Private Network Address Range | Normal Prefix |

    | 10.0.0.1 - 10.255.255.254 | 8 |

    | 172.x.0.1 - 172.x.255.254 | 16 |

    | 192.168.y.1 - 192.168.y.254 | 24 |


    x can be any number in the range 16-31, y can be any number in the range 0-255.


    A valid private IP address could be 192.168.1.1. A valid FDN for this IP could
    be lfs.example.


    Even if not using a network connection, a valid FDN is still required. This is
    necessary for certain programs to operate correctly.


    Create the /etc/hosts file by running:


    ```

    cat > /etc/hosts << "EOF"

    # Begin /etc/hosts


    127.0.0.1 localhost.localdomain

    127.0.1.1 <FQDN> <HOSTNAME>

    <192.168.1.1> <FQDN> <HOSTNAME> [alias1] [alias2 ...]

    ::1 localhost ip6-localhost ip6-loopback

    ff02::1 ip6-allnodes

    ff02::2 ip6-allrouters


    # End /etc/hosts

    EOF

    ```


    The <192.168.1.1>, <FQDN>, and <HOSTNAME> values need to be changed for specific
    uses or requirements (if assigned an IP address by a network/system administrator
    and the machine will be connected to an existing network). The optional alias
    name(s) can be omitted.


    # 9.6. System V Bootstrap Usage and Configuration


    # 9.6.1. How Do the System V Bootscripts Work?


    Linux uses a special booting named SysVinit that is based on a concept of run-levels.
    It can be different from one system to another, so it cannot be assumed that things
    worked in one particular Linux distribution, they should work the same in its
    own way of doing, but it respects generally accepted standards.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'SysInit (which will be referred to as “init” from now on) works using a run-level
    scheme. There are seven (numbered 0 to 6) run-levels (actually, there are more
    run-levels, but they are for special cases and are not generally used). See init
    (8 for details), and each one of those corresponds to the actions the computer
    is supposed to perform when it starts up. The default runlevel is 3. Here are
    the descriptions of the different run-levels as they are implemented:


    ```

    0: halt the computer

    1: single-user mode

    2: multi-user mode without networking

    3: multi-user mode with networking

    4: reserved for customization, otherwise does the same as 3

    5: same as 4, it is usually used for GUI login (like X’s xdm or KDE’s kdm)

    6: reboot the computer

    ```


    # 9.6.2. Configuring Sysinit


    During the kernel initialization, the first program that is run is either specified
    on the command line or, by default init. This program reads the initialization
    file /etc/initab. Create this file with:


    ```

    cat > /etc/initab << "EOF"

    # Begin /etc/inittab

    id3:initdefault:


    s::sysinit:/etc/rc.d/init.d/rc


    10:0:wait:/etc/rc.d/init.d/rc 0

    11:1:wait:/etc/rc.d/init.d/rc 1

    12:2:wait:/etc/rc.d/init.d/rc 2

    13:3:wait:/etc/rc.d/init.d/rc 3

    14:4:wait:/etc/rc.d/init.d/rc 4

    15:5:wait:/etc/rc.d/init.d/rc 5

    16:6:wait:/etc/rc.d/init.d/rc 6


    ca:12345:ctrlaltdel::/bin/shutdown -tl -a -r now


    su:SO106:once:/sbin/sulogin


    1:2345:respawn:/sbin/agetty --nuclear tty1 9600

    2:2345:respawn:/sbin/agetty tty2 9600

    3:2345:respawn:/sbin/agetty tty3 9600

    4:2345:respawn:/sbin/agetty tty4 9600

    5:2345:respawn:/sbin/agetty tty5 9600

    6:2345:respawn:/sbin/agetty tty6 9600


    # /etc/inittab

    EOF

    ```'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'An explanation of this initialization file is in the main page for inittab.
    For LFS, the command that is run is rc. The initialization file above will instruct
    rc to run all the scripts starting with an S in the /etc/rc.d/ followed by all
    the scripts starting with an S in the /etc/rc.d/? where the question mark is specified
    by the default value.


    As a convenience, the rc script reads a library of functions in /lib/ls/init-functions.
    This library also reads an optional configuration file, /etc/sysconfig/rc.site.
    Any of the system configuration parameters described in subsequent sections can
    be alternatively placed in this file consolidation of all system parameters in
    this one.


    As a debugging convenience, the functions script logs all out to /run/var/bootlog.
    The /run directory is a tmpfs, this file is not persistent across boots, however
    it is appended to the more permanent file /var/log/boot.log at the end of the
    boot process.


    # 9.6.2. Changing Run Levels


    Changing run-levels is done with init <runlevel>, where runlevel is the target
    run-level. For example, to reboot the computer, a user could use the init 6 command,
    which is an alias for the reboot command. Likewise, init 0 is as for the halt
    command.


    There are a number of directories under /etc/rc.d that look rc?.d(where ? is the
    number of the run-level) and rcysinit.d, all containing a number of symbolic links.
    Some begin with a K, the others begin with an S and M to start a service. The
    numbers determine the order in which the scripts are, from 00 to 99–the lower
    the earlier it executed. When init switches to another run-level, the appropriate
    services are either started or stopped, depending on the chosen runlevel.


    The real scripts are in /etc/rc.d/init.d. They do the actual work, and the symlinks
    all point to them. K links and S links point to the same script in /etc/rc.d/init.d.
    This is because the scripts can be called with different parameters like start,stop,restart,reload,and
    status. When a K is encountered, the appropriate script is run with the stop argument.
    When an S link is encountered, the appropriate script is run with the start argument.


    There is one exception to this explanation. Links that start with an S in the
    rc.0 and rc6.d directories will not cause anything to be started. They will be
    called with the parameter to stop. The logic behind this is that when a user is
    to reboot or halt the system, the system only needs to be stopped.


    These are descriptions of what the arguments make the scripts do:


    +   start

    The service is started.

    stop

    The service is stopped.

    restart

    The service is stopped and then started again.

    reload

    The configuration of the service is updated. This is used after the configuration
    file of a service was modified, when the service does not need to be restarted.

    status

    Tells if the service is running and with which PIDs.'
