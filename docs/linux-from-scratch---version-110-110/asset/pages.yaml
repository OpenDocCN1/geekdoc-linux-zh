  md: 'Linux From Scratch - Version 11.0


    Some tests in Chapter 8 need a regular user. We add this user here and delete
    it at the end of that chapter.


    ```

    echo tester:x:101::/home/tester:/bin/bash" >> /etc/passwd

    echo tester:x:101: >> /etc/group

