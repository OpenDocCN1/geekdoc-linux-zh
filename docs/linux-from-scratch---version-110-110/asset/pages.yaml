    # # 8.78. Cleaning Up


    Finally, clean up some files left over after running tests:


    ```

    rm -rf /tmp/*

    ```


    Now log out and reenter the chroot environment with an updated chroot command.
    From now on, use this chroot command any time you need to reenter the chroot environment
    after exiting:


    logout


    ```

    chroot "$LFS" /usr/bin/env -i \

    HOME=/root "$TERM" \

    PS1=(lfs chroot) \u:\w\\$ \

    PATH=/usr/bin:/usr/sbin \

    /bin/bash --login

    ```


    Here the +h option is not used anymore, since all the previous programs have been
    replaced: hashing is therefore possible.


    If the virtual kernel files systems have been unmounted, either manually or through
    a reboot, ensure that the virtual kernel file systems are mounted when reentering
    the chroot. This process was explained in Section 7.3.2, "Mounting Virtual Kernel
    File Systems and Populating /dev" and Section 7.3.3, "Mounting Virtual Kernel
    File Systems"


    There are also several files installed in the /usr/lib and /usr/libexec directories
    with a file extension of .la. These are "libtool archive" files. As already said,
    they are only useful when linking with static libraries. Are unneeded, and potentially
    harmful, when using dynamic shared libraries, specially when using also non-autobuild
    systems. To remove them,


    ```

    find /usr/lib /usr/libexec -name *.la -delete

    ```


    For more information about libtool archive files, see the BLFS section "About
    Libtool Archive (.la) files".


    The compiler built in Chapter 6 and Chapter 7 is still partially installed and
    not needed anymore. Remove it with:


    ```

    find /usr -depth -name $(uname -m)-lfs-linux-gnu* | xargs rm -rf

    ```


    Finally, remove the temporary ''tester'' user account created at the beginning
    of the previous chapter.


    ```

    userdel -r tester

    ```'
