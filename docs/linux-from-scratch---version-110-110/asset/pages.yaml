    # # 1.4. Resources


    # ## 1.4.1. FAQ


    If the building of the LFS system you encounter any errors, have any questions,
    or think there is a typo in the book, please start by consulting the Frequently
    Asked Questions (FAQ) that is located at https://www.linuxfromscratch.org/qfaq/.


    # ## 1.4.2. Mailing Lists


    The linuxfromscratch.org server hosts a number of mailing lists used for the development
    of the LFS project. These lists include the main development and support lists,
    among others. If the FAQ does not solve the problem you are having, the next step
    would be to search the mailing lists at https://www.linuxfromscratch.org/search.html.


    For information on the different lists, how to subscribe, archive locations, and
    additional information, visit https://www.linuxfromscratch.org/mail.html.


    # ## 1.4.3. IRC


    Several members of the LFS community offer assistance on Internet Relay Channel
    (IRC). Before using this, please make sure your question is not already answered
    in the LFS FAQ or the mailing archives. You can find the IRC network at irc.libera.chat.
    The support channel is named #LFS-support.'
