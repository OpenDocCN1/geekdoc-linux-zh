  md: '# Important Preliminary Material


    # Introduction


    This part is divided into three stages: first building a cross compiler and its
    associated libraries; second, this cross toolchain to build several utilities
    in a way that isolates them from the host distribution; third, enter the cross
    environment, which further improves host isolation, and build the remaining tools
    needed to build the final system.


    > Important

    With this part begins the real work of building a new system. It requires much
    care in ensuring that the instructions are followed exactly as the book shows
    them. You should try to understand what they do, and whatever your eagerness to
    finish your work, you should refrain from blindly type them as shown, but rather
    read documentation when there is something you do not understand. Also, keep track
    of your typing and of the output of commands, sending them to a file, using the
    tee utility. This allows for better diagnosing if something gets wrong.


    The next section gives a technical introduction to the build process, while the
    following contains very important general instructions.


    # Toolchain Technical Notes


    This section explains some of the rationale and technical details behind the overall
    build method. It is not essential to immediately understand everything in this
    section. Most of this information will be clearer after performing an actual build.
    This section can be referred to at any time during the process.


    The overall goal of Chapter 5 and Chapter 6 is to provide a temporary area that
    contains a known-good set of tools that can be isolated from the host system.
    By using chroot, the commands in the remaining chapters will be contained within
    that environment, ensuring a clean, trouble-free build of the LFS system. The
    build process is designed to minimize the risks for new readers and to provide
    the most educational value at the same time.


    The build process is based on the process of cross-compilation. Cross-compilation
    is normally used for building a compiler and its toolchain for a machine different
    from one that is used for the build. This is not strictly needed for LFS, since
    the machine where the new system will run is the same as the one used for the
    build. But cross-compilation has the great advantage that is cross-compilation
    cannot depend on the host environment.


    # About Cross-Compilation


    Cross-compilation involves some concepts that deserve a section on their own.
    Although this section may be omitted in a first reading, it is strongly suggested
    to come back to later in order to get a full grasp of the build process.


    Let us define some terms used in this context:


    +   - build

    is the machine where we build programs. Note that this machine is referred to
    as the “host” in other sections.

    host

    is the machine/system where the built programs will run. Note that this use of
    “host” is not the same as in other sections.'
