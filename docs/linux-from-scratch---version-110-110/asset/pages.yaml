    # # Typography


    To make things easier to follow, there are a few typographical conventions used
    throughout this book. This section contains some examples of the typographical
    format found throughout Linux From Scratch.


    ```

    .//configure --prefix=/usr

    ```


    This form of text is designed to be typed exactly as unless otherwise noted in
    the surrounding text. It is also used in the explanation sections to identify
    which of the commands is being referenced.


    In some cases, a line is extended to two or more physical lines with a backslash
    at the end of the line.


    ```

    CC=gcc -B/usr/bin/" /binutils-2.18/configure \\ --prefix=/usr --disable-nls --disable-error

    ```


    Note that the backslash must be followed by an immediate return. Other whitespace
    characters like space or tab will create incorrect results.


    ```

    install-info: unknown option ''--dir-file=/mnt/lfs/usr/info/dir''

    ```


    This form of text (fixed-width text) shows screen output, as the result of commands
    issued. This format is used to show filenames, as /etc/ld.so.conf.


    Emphasis


    This form of text is used for several purposes in the book. Its main purpose is
    to emphasize important points or items.


    https://www.linuxfromscratch.org/

    This format is used for hyperlinks both within the LFS community and external
    pages. It includes HOWTOs, download locations, and websites.


    ```

    cat $LFS/etc/group << "EOF"

    root:x:0:

    bin:x:1:

    ...

    EOF

    ```


    This format is used when creating configuration files. The first command tells
    the system to create the file $LFS/etc/group from whatever is typed on the following
    lines until the sequence End Of File (EOF) is encountered. Therefore, this entire
    section is generally typed as seen.


    ```

    <REPLACED TEXT>

    ```


    This format is used to encapsulate text that is not to be typed as seen or for
    copy-and-paste operations.


    ```

    {OPTIONAL TEXT}

    ```


    x'
