- img_proc: true
  md: 'Note that using iocharset is the default for iso8859-1 (which keeps the file
    system case insensitive), the utf8 option tells the kernel to convert the file
    names using UTF-8 so they can be interpreted in the UTF-8 locale.


    It is also possible to specify default codepage and iocharset values for some
    filesystems during kernel configuration. The relevant parameters are named "Default
    NLS Option" (CONFIG_NLS_DEFAULT), "Default Remote NLS Option" (CONFIG_SMB_NLS_DEFAULT),
    "Default codepage for FAT" (CONFIG_FAT_DEFAULT_CODEPAGE), and "Default iocharset
    for FAT" (CONFIG_FAT_DEFAULT_IOCHARSET). There is no way to specify these settings
    for the nfs filesystem at kernel compilation time.


    It is possible to make the ext3 filesystem reliable across power failures for
    some hard disk types. To do this, the barrier=1 mount option to the appropriate
    entry in /etc/fstab. To check if the disk drive supports this option, run hdparm
    on the applicable disk drive. For example, if:


    ```

    hdparm -I /dev/sda | grep NCQ

    ```


    returns non-empty output, the option is supported.


    Note: Logical Volume Management (LVM) based partitions cannot use the barrier
    option.'
  merge: -1
