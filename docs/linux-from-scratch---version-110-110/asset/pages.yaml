  md: '# # Appendix C. Dependencies


    Every package built in LFS relies on one or more other packages in build and install
    properly. Some packages participate in circular dependencies, the first package
    depends on the second which in turn depends on the first. Because of these dependencies,
    the order in which packages are built in LFS is very important. The purpose of
    this page is to document the dependencies of each package built in LFS.


    For each package that is built, there are three, and sometimes up to five types
    of dependencies listed below. The first list lists what packages need to be available
    in order to compile and install the package in question. The second list lists
    packages that must be available when any programs or libraries from the package
    are used at runtime. The third list lists packages, in addition to those on the
    first list, need to be available in order to run the test suites. The final list
    of dependencies is packages that require this package to be built and installed
    in its final location before they are built and used within their scripts. In
    some cases, if not built in a certain order, this could result in paths of /tools/bin/[binary]
    being placed inside scripts installed to the final system. This is only not desirable


    The last list of dependencies are optional packages that are not addressed in
    LFS, but could be useful to the user. These packages may have additional mandatory
    or optional dependencies of their own. For these dependencies, the recommended
    practice is to install them after completion of the LFS book and go back and rebuild
    the LFS package. In several cases, re-installation is addressed in BLFS.


    # ## Acl


    +   **Installation depends on:** Attr, Bash, Binutils, Coreutils, GCC, Getext,
    Grep, M4, Make, Perl, Sed, and Texinfo

    **Required at runtime:** Attr and Glibc

    **Test depends on:** Automake, Diffutils, Findutils, and Libool

    **Must be installed before:** Coreutils, Sed, Tar, and Vim

    **Optional dependencies:** None


    # ## Attr


    +   **Installation depends on:** Bash, Binutils, Coreutils, GCC, Glibc, Grep,
    M4, Make, Perl, Sed, and Texinfo

    **Required at runtime:** Glibc

    **Test depends on:** Automake, Diffutils, Findutils, and Libool

    **Must be installed before:** Acl and Libcapac

    **Optional dependencies:** None


    # ## Autoconf


    +   **Installation depends on:** Bash, Coreutils, Grep, M4, Make, Perl, Sed, and
    Texinfo

    **Required at runtime:** Bash, Coreutils, Grep, M4, Make, Sed, and Texinfo

    **Test depends on:** Automake, Diffutils, Findutils, GCC, and Libool

    **Must be installed before:** Automake

    **Optional dependencies:** Emacs'
