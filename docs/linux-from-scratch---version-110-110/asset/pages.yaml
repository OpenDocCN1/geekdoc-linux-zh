    # 4.5. About S


    Many people would like to know beforehand approximately how long it takes to compile
    and install each package.

    Because Linux From Scratch can be built on many different systems, it is impossible
    to provide accurate time estimates.

    The biggest package (Glibc) will take approximately 20 minutes on the fastest
    systems, but could take up to three days

    on slower systems! Importance of providing actual times, the Standard Build Unit
    (SBU) measure will be used.


    The SBU measure works as follows. The first package to be compiled from this binutils
    in Chapter 5. The time

    itakes to compile this package is what will be referred to as the Standard Build
    Unit or SBU. All other compile times

    be expressed relative to this time.


