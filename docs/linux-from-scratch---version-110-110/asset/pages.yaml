  md: '# 9.6.6. Creating Files at Boot


    At times, it is desirable to create files at boot time. For instance, the /tmp/.ICE-unix
    directory is often needed. This can be done by creating an entry in the /etc/sysconfig/createfiles
    configuration script. The format of this file is embedded in the comments of the
    default configuration file.


    # 9.6.7. Configuring the syslog Script


    The syslog script invokes the syslog program as a part of System V initialization.
    The -m option turns off the periodic timestamp mark that syslog writes to the
    log files every 20 minutes by default. If you want to turn on the periodic timestamp
    mark, for instance edit /etc/sysconfig/rc.site and define the variable SYSLOG_PARMS
    to the desired value. To remove all parameters, set the variable to a null value:


    ```

    SYSLOG_PARMS=

    ```


    See syslog for more options.


    # 9.6.8. The rc.site File


    The optional /etc/rc.site file contains settings that are automatically set for
    each System boot script. It can alternatively set the values specified in the
    hostname, console, and clock files in the /etc/sysconfig/ directory. If the associated
    variables are present in these separate files and rc.site, the values in the script
    specifies have precedence.


    rc.site also contains parameters that can customize other aspects of the boot
    process. Setting the PROMPT variable will enable selective running of bootscripts.
    Other options are described in the file contents. The default version of the file
    is:


    ```

    # rc.site

    # Optional parameters for boot scripts.


    # Distro Information

    # These values, if specified here, override the defaults

    #DISTRO="Linux From Scratch" # The distro name

    #DISTRO_CONTACT="lfs-dev@linuxfromscratch.org" # Bug report address

    #DISTRO_MINI="LFS" # Short name used in filenames for distro config


    # Define custom colors used in messages printed to the console


    # Please consult `console_codes` for more information

    # under the `ECMA-48 Set Graphics Rendition` section

    # Warning: when switching from an 8 bit to a 9 bit font,

    # the linux console will reinterpret the bold (1); to

    # the top 256 glyphs of the 9 bit font. This does

    # not affect framebuffer consoles


    # These values, if specified here, override the defaults

    #BRACKET="\033[1;34m" # Blue

    #FAILURE="\033[1;31m" # Red

    #INFO="\033[1;36m" # Cyan

    ```'
