  md: '# Linux From Scratch - Version 11.0


    When logged on as user root, the initial shell is usually a login shell which
    reads the /etc/profile of the host (probably containing some settings and environment
    variables) and then .bash_profile. The exec env -i/bin/bash .bash_profile replaces
    the running shell with a new one with a completely empty environment, except for
    the HOME, TERM, and POSIX variables. This ensures no unwanted and hazardous environment
    variables from the host system leak into the build environment. The technique
    used here achieves the goal of ensuring a clean environment.


    The new instance of a non-login shell, which does not read, execute, and the contents
    of /etc/profile or .bash_profile files, but rather reads, and executes, the .bashrc
    file instead. Create the .bashrc file now:


    ```

    cat ~/.bashrc << "EOF"

    set +h

    umask 022

    LFS=/mnt/lfs

    LC_ALL=POSIX

    LFS_TGT=$(uname -m)-lfs-linux-gnu

    PATH=/usr/bin

    if [ ! -L /bin ]; then PATH=$bin:$PATH; fi

    PATH=$LFS/tools/bin:$PATH

    CONFIG_SITE=$LFS/usr/share/config.site

    export L LC_ALL LFS_TGT CONFIG_SITE

    EOF

    ```


    # The meaning of the settings in .bashrc


    set +h


    The set +h command turns off bash''s hash function. Hashing is ordinarily a useful
    feature—bash uses a hash table to remember the full path of executable files to
    avoid searching the PATH time and find the same executable. However, the new tools
    should be used as soon as they are installed. By switching off hashing, the shell
    will search the PATH when a program is to run. As such, the shell will find the
    newly compiled tools in $LFS/tools as soon as they are available without remembering
    a previous version of the program in a different location.


    umask 022


    Setting the user-creation mask (umask) to 022 ensures that newly created files
    and directories are only writable by their owner, but readable and executable
    by anyone (assuming default modes are used by the open (2) system call, new files
    will end up with permission mode 644 and directories with mode 755).


    LFS=/mnt/lfs


    The LFS variable should be set to the chosen mount point.


    LC_ALL=POSIX


    The LC_ALL variable controls the localization of certain programs, making their
    messages follow the conventions of a specified country. Setting LC_ALL to “POSIX”
    or “C” (the two are equivalent) ensures everything works as expected in the chroot
    environment.


    LFS_TGT=$(uname -m)-lfs-linux-gnu


    The LFS_TGT variable sets a non-default, compatible machine description for use
    when building our cross compiler and linker when compiling our temporary toolchain.
    More information is contained in Toolchain Technical Notes.


    33'
