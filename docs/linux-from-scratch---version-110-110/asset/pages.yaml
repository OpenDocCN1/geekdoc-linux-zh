    This build of GCC has installed a couple of internal system headers. Normally
    one of them, limits.h, would turn include the corresponding system system limits.h
    header, in this case, $LFS/usr/include/limits.h. However, at the time of this
    build of GCC $LFS/usr/include/limits.h does not exist, the internal header that
    has just been installed is a partial self-contained file and does not include
    the extended features of the system header. This is adequate for building glide,
    but the full internal header will be needed later. Create a full version of the
    internal header using a command that is identical to what the GCC build system
    does in normal circumstances:


