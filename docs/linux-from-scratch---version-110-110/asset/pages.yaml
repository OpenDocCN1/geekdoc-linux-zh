  md: '# 87. About Debugging Symbols


    Most programs and libraries are, by default, compiled with debugging symbols included
    (with gcc -g option). This means that when debugging a program or library that
    was compiled with debugging information, the debugger can provide not only memory
    addresses, but also the names of the routines and variables.


    However, the inclusion of these debugging symbols enlarges a program or library
    significantly. The following is an example of the amount these symbols occupy:


    +   - A bash binary with debugging symbols: 1200 KB


    +   - A bash binary without debugging symbols: 480 KB


    +   - Glibc and GCC files (/lib and /usr/lib) with debugging symbols: 87 MB


    +   - Glibc and GCC files without debugging symbols: 16 MB


    Sizes may vary depending on which compiler and C library were used, but when comparing
    programs with and without debugging symbols, the difference will usually be a
    factor between two and five.


    # 87. Stripping


    This option is optional. If the intended user is not a programmer and does not
    plan to do any debugging on the system software, the system size can be decreased
    by about 2 GB by removing the debugging symbols from binaries and libraries. This
    causes no inconvenience other than not being able to debug the software anymore.


    Most people who use the commands mentioned below do not experience any difficulties.
    However, it is easy to make a typo and render the new system unusable, so before
    running the strip commands, it is a good idea to make a backup of the LFS system
    in its current state.


    The debugging symbols for selected libraries are placed in separate files. This
    debugging information is needed if running regression tests using valgrind or
    gdb later in BLFS.


    Note that strip will overwrite the binary or library file it is processing. This
    can crash the processes using code or data from the file. If the process running
    strip itself is affected, the binary or library being stripped can be destroyed
    and make the system completely unusable. To avoid it, we will copy some libraries
    and binaries into /tmp, strip them there, and install them back with the install
    command. Read the related entry in Section 8.2.1, “Upgrade Issues” for the rationale
    to use the install command here.'
  merge: -1
