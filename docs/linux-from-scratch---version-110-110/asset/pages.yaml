  md: 'Linux From Scratch - Version 11.0


    # The meaning of the command line options:


    -s /bin/bash


    This makes bash the default shell for user lfs.


    -g lfs


    This option adds user lfs to group lfs.


    -m


    This creates a home directory for lfs.


    -k /dev/null


    This parameter prevents possible copying of files from a skeleton directory (default
    is /etc/skel) by changing the input location to the special device.


    lfs


    This is the actual name for the created user.


    To log in lfs (as opposed to switching to user lfs when logged in as root, which
    does not require the lfs user to have a password), give lfs a password:


    ```

    passwd lfs

    ```


    Grant lfs full access to all directories under $LFS by making lfs the directory
    owner


    ```

    chown -v lfs $LFS/(/*),lib,var,etc,bin,sbin,kernels

    case $ (uname) - in

    x86_64 chown -v lfs $LFS/lib64 ;;

    esac

    ```


    If a separate working directory was created as suggested, give user lfs ownership
    of this directory:


    ```

    chown -v lfs $LFS/sources

    ```


    > Note

    In some systems, the following command does not complete properly and suspends
    the login to the Lfs user to the background. If the prompt "lfs:~" does not appear
    immediately, entering the fg command will fix the issue.


    Next, log in as lfs. This can be done via a virtual console, a display manager,
    or with the following switch/user command to create a new


    ```

    su - lfs

    ```


    The "-\ instructs su to start a login shell as a non-login shell. The difference
    between these two types of shells can be found in detail in bash (1) and info
    bash.


    # 4.4. Setting Up the Environment


    Set up a good working environment by creating two new startup files for the bash.
    While logged in as user lfs, follow the following command to create a new .bash_profile:


    ```

    cat ~/.bash_profile << "EOF"

    exec env -i HOME=$HOME TERM=$PS1=''\u:\w\$'' /bin/bash

    EOF

    ```


