  md: '# # 14. Cleaning up and Saving the Temporary System


    # ## 7.14.1. Cleaning


    First, remove the currently installed documentation to prevent them from ending
    up in the final system, and to save about 35 MB:


    ```

    rm -rf /usr/share/{info,man,doc}/*

    ```


    Second, the .la files are only used when linking with static libraries. They are
    unnecessary and potentially harmful when using dynamic shared libraries, especially
    when using non-autobuild systems. While still in chroot, remove those files now:


    ```

    find /usr/lib, libexec -name *.la -delete

    ```


    The current system size is now about 3 GB, however the /tools directory is no
    longer needed. It uses about 1 GB of disk space. Delete it now:


    ```

    rm -rf /tools

    ```


    # ## 7.14.2. Backup


    > > Note

    All the remaining steps in this section are optional. Nevertheless, as soon as
    you begin installing packages in Chapter 8, the temporary files will be overwritten.
    So it may be a good idea to do a backup of the current system as described below.


    The following steps are performed outside the chroot environment. That means,
    you have to leave the chroot environment before continuing. The reason for this
    is to access file locations outside of the chroot environment to store/read the
    backup archive which should not be placed within the $LFS hierarchy for safety
    reasons.


    > > Important

    All of the following instructions are executed by root. Take care about the commands
    you''re going to run as mistakes that may modify your host system. Be aware that
    the environment variable LFS is for user L by default but may not be for root.
    When commands are to be executed by root, make sure you have set LFS. This has
    been discussed in Section 2.6, "Setting the $LFS Variable".


    Now, if you are making a backup, leave the chroot environment:


    ```

    exit

    ```


    At this point the essential programs and libraries have been created and your
    current system is in a good state. In case of fatal failures in the subsequent
    chapters, it often turns out that removing everything and starting over (more
    carefully) is the best option to recover. Unfortunately, all the temporary files
    will be removed, to avoid spending extra time to redo something that has been
    built successfully, a backup.


    Make sure you have at least 1 GB free disk space (the source tarballs will be
    included in the backup archive) in the home directory of user root.'
