  md: '# LEGACY_CHARSET


    For many keyboard layouts, there is no stock Unicode keymap in the Kbd package.
    The console bootscript will convert an available keymap to UTF-8 on the fly if
    this variable is set to the encoding of the available non-UTF-8 keymap.


    Some examples:


    +   For a non-Unicode setup, only the KEYMAP and FONT variables are generally
    needed. E.g., for a Polish setup, one would use:


    ```

    cat /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    KEYMAP="pl22"

    FONT="lat2a-16 -m 8859-22"


    # End /etc/sysconfig/console

    EOF

    ```


    +   As mentioned above, it is sometimes necessary to adjust a stock keymap slightly.
    The following example adds the Euro symbol to the German keymap:


    ```

    cat /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    KEYMAP="de-latin1"

    KEYMAP_CORRECTIONS="euro2"

    FONT="lat0-16 -m 8859-15"

    UNICODE="1"


    # End /etc/sysconfig/console

    EOF

    ```


    +   The following is a Unicode-enabled example for Bulgarian, where a stock UTF-8
    keymap exists:


    ```

    cat /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    UNICODE="1"

    KEYMAP="bg_bds-utf8"

    FONT="LatArCyrHeb-16"


    # End /etc/sysconfig/console

    EOF

    ```'
