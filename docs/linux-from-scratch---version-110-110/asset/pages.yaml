    ```

    LC_ALL=<locale name>  locale language

    LC_ALL=<locale name>  locale charset

    LC_ALL=<locale name>  locale int_curr_symbol

    LC_ALL=<locale name>  locale int_prefix

    ```


    The above commands should print the language name, the character encoding used
    by the locale, the local currency, and the prefix to dial the telephone number
    in order to get into the country. If any of the commands above fail with a message
    similar to the one below, it means that your locale was either not installed in
    Section 8.5, "Glibc-2.34" or is not supported by the default installation of Glibc.


    ```

    locale: Cannot set LC* to default locale: No file or directory

    ```


    If this happens, you should install the desired locale using the localef command,
    or consider choosing a different locale. Further instructions assure that there
    are no such error messages from Glib.


    Other packages can also function incorrectly (but may not display any error messages)
    if the locale name does not meet their expectations. In these cases, investigating
    how other Linux distributions support your locale might provide some useful information.


    Once the proper locale settings have been determined, create the /etc/profile
    file:


    ```

