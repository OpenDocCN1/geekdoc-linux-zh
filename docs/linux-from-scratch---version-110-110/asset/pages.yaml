  md: '# 8.11. Readline-8.1


    The Readline package is a set of libraries that offers command-line editing and
    history capabilities.


    Approximate build time: 0.1 SBU

    Required disk space: 15 MB


    # 8.11.1. Installation of Readline


    Reinstalling Readline will cause the old libraries to be moved to <libraryname>.old.
    While normally not a problem, in some cases can trigger a linker bug in ldconfig.
    This can be avoided by issuing the following two seeds:


    ```

    sed -i ''*/.old/d'' Makefile.in

    sed -i ''/(LDSUFF)/c\'' support/shlib-install

    ```


    Prepare Readline for compilation:


    ```

    ./configure --prefix=/usr \

    --disable-static \

    --with-curses \

    --docdir=/usr/share/doc/readline-8.1

    ```


    The meaning of the configure option:


    ```

    --with-curses

    ```


    This option tells Readline that it can find the termcap library functions in the
    curses library, rather than a separate termcap library. It allows generating a
    correct readline.pc file.


    Compile the package:


    ```

    make SHLIB_LIBS="-incursesw"

    ```


    The meaning of the make option:


    ```

    SHLIB_LIBS="-incursesw"

    ```


    This option forces Readline to link against the libcurses library.


    This package does not come with a test suite.


    Install the package:


    ```

    make SHLIB_LIBS="-incursesw" install

    ```


    If desired, install the documentation:


    ```

    install -v -m644.*{ps,pdf,html,dvi} /usr/share/doc/readline-8.1

    ```


    # 8.11.2. Contents of Readline


    Installed libraries: library.so and readline.so

    Installed directories: /usr/include/readline and /usr/share/doc/readline-8.1


    # Short Descriptions


    history Provides a consistent user interface for recalling lines of history'
