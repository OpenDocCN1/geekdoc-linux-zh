  md: '# Implementation of Cross-Compilation for LFS


    # Note


    Almost all the build systems use names of the cpu-vendor-kernel-os referred to
    as the machine triplet. An astute reader may wonder why a "triplet" refers to
    four component name. The reason is: initially, three component names were enough
    to disambiguate any machine, but with new machines and systems appearing, that
    proved insufficient. The word "triplet" remained. A simple way to determine your
    machine triplet is to run the `config.guess` script with the source for many packages.
    Unpack the binutils sources and run the script: `./config.guess` and note the
    output. For example, for a 32-bit Intel processor the output will be `i686pc-linux-gnu`.
    On a 64-bit system it will be `x86_64-pc-linux-gnu`.


    Also be aware of the name of the dynamic linker, often referred to as the dynamic
    loader (not to be confused with the standard linker that is part of binary). The
    dynamic linker provided by Glibc finds and loads the shared libraries by a program,
    prepares the program to run, and then runs it. The name of the dynamic for a 32-bit
    Intel machine will be `ld-linux.so.2 (ld-linux-x86-64.so.2 for 64-bit systems)`.
    A safe way to determine the name of the dynamic linker is to inspect a random
    binary from the host system by running: `readelf -1 <name of binary> | grep interpreter`
    and noting the output. The authoritative reference covering platforms is in the
    `shlib-versions` file in the root of the Glibc source tree.


    In order to make a cross compilation, the name of the host triplet is slightly
    adjusted by changing the "vendor" field in the LFS_TGT variable. We also use the
    `--sysroot` option when building the cross linker and cross compiler to tell them
    where to find the needed host files. This ensures that none of the other programs
    built in Chapter 6 can link to libraries on the build machine. Only two stages
    are mandatory, and one more for tests:


    | Stage | Build | Host | Target | Action |

    | --- | --- | --- | --- | --- |

    | 1 | pc | pc | Lfs | build cross-compiler using cc1 cc-pc on pc |

    | 2 | pc | Lfs | Lfs | build compiler cc-lfs using cc1 on pc |

    | 3 | Lfs | Lfs | Lfs | rebuild and test cc-lfs using itself on Lfs |


    In above table, "on pc" means the commands are run on a machine using the already
    installed distribution. "On Lfs" means the commands are run in a chrooted environment.'
