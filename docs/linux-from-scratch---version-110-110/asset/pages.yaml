  md: '# 5.2. Binutils-2.37 - Pass 1


    The Binutils package contains a linker, an assembler, and other tools for handling
    object files.


    Approximate build time: 1 SBU

    Required disk space: 602 MB


    # 5.2.1. Installation of Cross Binutils


    +   Note

    Go back and re-read the notes in the section titled General Compilation Instructions.
    Understanding the notes labeled important can save you of problems later.


    It is important that Binutils be the first package compiled because both Glibc
    and GCC perform various tests on the available linker and assembler to determine
    which of their features to enable.


    The Binutils documentation recommends building Binutils in a dedicated directory:


    ```

    mkdir -v build

    cd build

    ```


    +   Note

    In the SBU values listed in the rest of the book to be of any use, and including
    the first install, measure the time it takes to build this package from the configuration,
    To achieve this, wrap the commands in a time command like: time { ..configure
    ... make && make install; }


    Now prepare Binutils for compilation:


    ```

    --prefix=$LFS/tools \

    --with-sysroot=$LFS \

    --target=$LFS_TGT \

    --disable-nls \

    --disable-werror

    ```


    The meaning of the configure options:


    --prefix=$LFS/tools

    This tells the configure script to prepare to install the binutils programs in
    the $LFS/tools directory.

    --with-sysroot=$LFS

    For cross compilation, this tells the build system to look in $LFS for the target
    system libraries as needed.

    --target=$LFS_TGT

    Because the machine description in the $LFS_TGT variable is slightly different
    than the value returned by the config.guess script, this switch will tell the
    configure script to adjust binutils'' build system for building a cross linker.


    --disable-nls

    This disables internationalization as i18n is not needed for the temporary tools.

    --disable-werror

    This prevents the build from stopping in the event that there are warnings from
    the host''s compiler.'
