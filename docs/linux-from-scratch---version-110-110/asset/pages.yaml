    # 85.25. Configuring Shadow


    This package contains utilities to add, modify, and delete users and groups; set
    and change their passwords; and perform other administrative tasks. For a full
    explanation of what shadowing means, see the doc/HOWTO file within the unpacked
    source file. Using Shadow support, keep in mind that programs need to verify passwords
    (display managers, FTP programs, pop3 daemons, etc.) must be Shadow-compliant.
    They, need to be able to work with shadowed passwords.


    To enable shadowed passwords, run the following command:


    ```

    pwconv

    ```


    To enable shadowed group passwords, run:


    ```

    grpconv

    ```


    Shadow''s stock configuration for the useradd utility has a few caveats that need
    some explanation. The first action for the useradd utility is to create the user
    and a group of the same name as the user. By default the user ID (UID) and group
    ID (GID) numbers will be 1000. If you don''t pass parameters to useradd, each
    user will be a member of a unique group on the system. If this is undesirable,
    you will need to pass the -g parameter to useradd. The default parameters are
    stored in the /etc/default/useradd file. You may need to modify two parameters
    in this file to suit your particular needs.


    /etc/default/useradd Parameter Explanations


    ```

    GROUP=1000

    ```


    This parameter sets the setting of group numbers used in the /etc/group file.
    You can modify it to anything you desire. Note that useradd will never reuse a
    UID or GID. If the number identified in this parameter is used, it will use the
    next number after this. Note also that if you don''t have a group 1000 on your
    system the first time you use useradd without the -g parameter, you will get a
    message displayed on the terminal that: useradd: unknown GID 1000. You may disregard
    this message and group number 1000 will be used.


    134'
