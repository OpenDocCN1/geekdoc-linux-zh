  md: '# Linux From Scratch - Version 11.0


    This format is used to encapsulate text that is optional.


    passwd (5)


    This format is used to refer to manual (man) page. The number inside parentheses
    indicates a specific section inside the manuals. For example, passwd has two man
    pages. Per Linux installation instructions, two man pages will be located at /usr/share/man1/passwd.1
    and /usr/share/man5/passwd.5. When the book uses passwd(5) it is specifically
    referring to /usr/share/man5/passwd.5. man password will print the first man it
    finds that matches "passwd", which will be /usr/share/man1/passwd.1. For this
    you will need to run man 5 in order to refer the page being specified. Note that
    man pages do not have duplicate page names in different sections. Therefore, man
    <program name> is generally sufficient.


    # Structure


    This book is divided into the following parts.


    # Part I - Introduction


    Part I explains a few important notes on how to proceed with the L installation.
    This section also provides meta-information about the book.


    # Part II - Preparing for the Build


    Part II describes how to prepare for the building process—making a partition,
    downloading the packages, and compiling temporary tools.


    # Part III - Building the LFS Cross Toolchain and Temporary Tools


    Part III provides instructions for building the tools needed for constructing
    the final LFS system.


    # Part IV - Building the LFS System


    Part IV guides the reader through the building of the LFS system—compiling and
    installing all the packages by one, setting up the boot scripts, and installing
    the kernel. The resulting Linux system is the foundation on which other software
    can be built to expand the system as desired. At the end of this book, there is
    an easy to use reference listing of all the programs, libraries, and important
    files that have been installed.


    # Part V - Appendices


    Part V provides information about the book itself including acronyms and terms,
    acknowledgments, package dependencies, a listing of LFS boot scripts, licenses
    for the distribution of the book, and a comprehensive index of packages, programs,
    libraries, and scripts.


    # Errata and Security Advisories


    The software used to create an LFS system is constantly updated and enhanced.
    Security warnings and bugs may become available after the LFS book has been released.
    To check whether the package versions or instructions in this release of LFS need
    any modifications to accommodate security vulnerabilities or other bugs, please
    visit https://www.linuxfromscratch.org/lfs/errata/11.0/ before proceeding with
    your build. You should note any changes shown and apply them to the relevant section
    of the book as you progress building the LFS system.'
