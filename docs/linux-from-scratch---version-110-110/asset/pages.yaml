  md: '# Linux From Scratch - Version 11.0


    Having this variable set is beneficial in commands as `mkdir -v $LFS/tools` can
    be typed literally. The shell will automatically replace `$LFS` with `/mnt/lfs`
    (whatever the variable was set to) when it processes the command line.


    ![](img/90c16c5211ed43f9cbbafd1d6becc299_37_0.png)


    # Caution


    Do not forget to check that LFS is set whenever you leave and reenter the working
    environment (such as doing a su to root or another user). Check that the LFS variable
    is set up properly with:


    ```

    echo $LFS

    ```


    Make sure the output shows the path to your LFS system''s build location, which
    is `/mnt/lfs` if the provided example was followed. If the output is incorrect,
    use the command earlier on this page to set `$LFS` to the correct directory name.


    ![](img/90c16c5211ed43f9cbbafd1d6becc299_37_1.png)


    # Note


    One way to ensure that the LFS variable is always set is to edit the .bash_profile
    file in your home directory or in /root/.bash_profile and enter the export command
    above. In addition, the shell specified in the `/etc/passwd` file for all users
    who need the LFS variable needs to be bash to ensure that the /root/.bash_profile
    file is incorporated as a part of the login process.


    Another consideration is that the method is used to log the host system. If logging
    in a graphical display manager, the user''s .bash_profile is not used when a virtual
    terminal is started. In this case, add the export command to the .bashrc file
    for the user and the root. In some distributions have instructions not to use
    the .bashrc in a non-interactive bash. Be sure to add the export command before
    the test for non-interactive use.


    # 2.7. Mounting the New Partition


    Now that a file system has been created, the partition needs to be made accessible.
    In order to do this, the partition needs to be mounted at a chosen point. For
    the purposes of this book, it is assumed that the file system is mounted under
    the directory specified by the LFS environment variable as described in the previous
    section.


    Create the mount point and mount the LFS file system by running:


    ```

    mkdir -pv $LFS

    mount -v t ext4 /dev/<xxx> $LFS

    ```


    Replace <xxx> with the designation of the partitions for / LFS partition.


    If using multiple partitions for LFS (e.g., one for / and another for /home),
    mount them using:


    ```

    mkdir -pv $LFS

    mount -v t ext4 /dev/<xxx> $LFS

    mkdir -v t $LFS/home

    mount -v t ext4 /dev/<yyy> $LFS

    ```


    Replace <xxx> and <yyy> with the appropriate partition names.


    Ensure that this new partition is not mounted with permissions that are too restrictive
    (such as the nosuid or nodev options). Run the mount command without any parameters
    to see what options are set for the mounted LFS partition. If nosuid and/or nodev
    are set, the partition will need to be remounted.


    1'
