  md: '# # Chapter 3. Packages and Patches


    # ## 3.1. Introduction


    This chapter includes a list of packages that need to be downloaded in order to
    build a basic Linux system. The version numbers correspond to versions of the
    software that are known to work, and this book is based on their use. We highly
    recommend against using newer versions because the build commands for one version
    may not work with a newer one. The newest package versions may also have problems
    that require work-arounds. These work-arounds will be developed and stabilized
    in the development version of the book.


    Download locations may not always be accessible. If a download location has changed
    since this book was published, Google (https://www.google.com/) provides a useful
    engine for packages. If this search is unsuccessful, try one of the alternatives
    of downloading at https://www.linuxscratch.org/lfs/mirrors.html#.


    Downloaded packages and patches need to be somewhere that is conveniently throughout
    the entire book. A working directory is also required to unpack the sources and
    build them. `$LFS/sources` can be used as the place to store the tarballs and
    as a working directory. By using this directory, the required elements will be
    located on the LFS partition and will be available during all stages of the building
    process.


    To create this directory, execute the following command, as *root*, before starting
    the download session:


    ```

    mkdir -v $LFS/sources

    ```


    Make this directory writable and sticky “Sticky” means that even if multiple users
    have write permission on a directory, only the owner of a file can delete the
    file within a sticky directory. The following command will enable the write and
    sticky modes:


    ```

    chmod -v awt $LFS/sources

    ```


    There are several ways to obtain the necessary packages and patches to build LFS:


    +   * The files can be downloaded individually as described in the next two sections.

    * For stable versions of the book, a tarball of all the needed files can be downloaded
    from one of the LFS mirrors listed at https://www.linuxscratch.org/mirrors.html.

    * The files can be downloaded using *wget* and a wget-list as described below.


    To download all of packages and patches by using *wget* as an input to the *wget*
    command, use:


    ```

    wget --input-file=wget-list --directory-prefix=$LFS/sources

    ```


    Additionally, starting with LFS-7.0, there is a separate file, *md5sums*, which
    can be used to verify that all the correct packages are available before proceeding.
    Place that file in `$LFS/sources` and run:


    ```

    pushd $LFS/sources

    md5sum -c md5sums

    pop

    ```


    This check can be used after retrieving the needed files with any of the methods
    listed below.


    # ## 3.2. All Packages


    Download or otherwise obtain the following packages:'
