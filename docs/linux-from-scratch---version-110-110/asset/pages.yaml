  md: '# Chapter 4. Final Preparations


    # 4.1. Introduction


    In this chapter we will perform a few additional tasks to prepare for building
    the temporary system. We will create a set of directories in $LFS for the installation
    of the temporary tools, add an unprivileged user to reduce risk, and create an
    appropriate build environment for that user. We will also explain the unit of
    time we use to measure how long LFS packages take to build or “SBUs”, and give
    some information about package test suites.


    # 4.2. Creating a limited directory layout int filesystem


    The first task in the LFS partition is to create a limited directory hierarchy
    so that programs compiled in Chapter 6 (as glibc and libstdc++ in Chapter 5) will
    be installed in their final location. This is needed so that temporary programs
    are overwritten when rebuilding them in Chapter 8.


    Create the required layout by running the following as *root*:


    ```

    mkdir -pv $LFS/{etc,var} $LFS/{usr/{bin,lib,sbin}


    for i in bin lib sbin; do

    ln -sv usr $LFS/

    done


    case $(uname -m) in

    x86_64) mkdir -pv $LFS/lib64

    esac

    ```


    > Note

    The above command is correct. The ln command has a few syntactic versions, so
    be sure to check info coreutils ln and man ln(1) before reporting what you might
    think is an error.


    Programs in Chapter 6 will be compiled with a cross-compiler (more details in
    section Toolchain Notes). In order to separate this cross-compiler from the other
    programs, it will be installed in a special directory. Create this directory:


    ```

    mkdir -pv $LFS/tools

    ```


    # 4.3. Adding the LFS User


    When logged in as root, making a single mistake can damage or destroy your system.
    Therefore, the packages in the next two chapters are built as an unprivileged
    user. You could use your own name, but to make it easier to set up a clean working
    environment, create a new user lfs as a member of a group (also named lfs) and
    use this user during the installation process. As root, issue the following commands
    to add the new user:


    ```

    groupadd lfs

    useradd -s /bin/bash -g lfs -m -k /dev/null lfs

    ```'
