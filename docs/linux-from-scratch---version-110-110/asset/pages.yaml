  md: 'Now, there is more cross-compiling: The C language is not just a compiler,
    but also defines a standard library. In this book, the GNU C library, glibc, is
    used. This library must be compiled for the If machine, that is, using the cross
    compiler cl. But the compiler uses an internal library implementing complex functions
    not available in the assembler instruction. This internal library is libibc, and
    must be linked to the glibc library to be fully functional! Furthermore, the standard
    library for C++ (lib++) also needs to be linked to glibc. With this chicken and
    egg problem it is first to build a degraded libc, lacking some functionalities
    as threads and exception handling), then build glibc using this degraded glibc
    (glibc is not degraded), then libstdc++. But this library will lack the same functionalities
    as glibc.


    This is not the end of the story: the conclusion of the preceding paragraph is
    that cl is needed to build a fully functional lib++, but this is the only compiler
    available for building the C/C++ libraries during stage 2! Of, the compiler build
    during stage 2, cc-fs, would be able to build those libraries, but (1) the build
    system of GCC does not know that it is usable on and (2) using it on pc would
    be at risk of linking to the pc libraries, since cc-fs is a native compiler. So
    we have to build libstdc++ later, hereof.


    # Other procedural details


    The cross-compiler will be installed in a $LFS/tools directory, since it will
    not be part of the final system.


    Binutils is installed first because the configure runs of both GCC and Glibc perform
    various feature tests on the assembler and linker to determine what features to
    enable or disable. It is much more important than first realize. An incorrectly
    configured GCC can result in a subtly broken tool, where the impact of breakage
    might not show up until the end of the build of an distribution. A test suite
    will highlight this error before too much additional work is performed.


    Binutils installs its assembler and linker in order. $LFS/tools/bin and $LFS/$FS_TGT/bin.
    The tools in one are linked to the other. An important factor of the linker is
    its library search order. Detailed information can be obtained from id by passing
    the --verbose flag. For example, $LFS_TGT-ld --verbose SEARCH will illuminate
    the current search paths and order. It shows which files are linked by id compiling
    a dummy program and passing the --verbose switch to the linker. For example, $LFS_TGT-gcc
    dummy.c --WI,--22&1 | grep will show all files successfully opened during the
    linking.


    The next package is installed gl. An example of what can be seen during your run
    is:


    ```

    checking assembler to use... /mnt/lfs/tools/i686-lfs-linux-gnu/bin

    checking linker to use... /mnt/lfs/tools/i686-lfs-linux-gnu/bin/bin

    ```


    This is for the reasons mentioned above. A configure script does not search the
    PATH directories to find tools to use. However, during the actual operation of
    gcc itself, the same search paths are not necessarily used. To find out which
    library gcc will use, $LFS_TGT-gcc-print-name=id.


    Detailed information can be obtained from gcc by passing the --command line option
    while compiling a dummy program. For example, gcc -v dummy.c will show detailed
    information about the preprocessor, compiler, and assembly stages, gccs included
    search paths and order.


    Next is installed sanitized Linux API headers. These allow the standard C library
    (Glibc) to interface with features that the Linux kernel will provide.


    The next package installed is Glibc. The most important considerations for building
    Glibc are the compiler, binary tools, and kernel headers. The compiler is generally
    not an issue since Glibc will always use the compiler relating to the --host parameter
    to its configure script; e.g. in one case, the compiler will be $LFS_TGT-gcc.
    The binary tools and kernel headers can be a bit more complicated. Take no risks
    and use the available switches to enforce the correct selections. After the run
    of configure, check the contents of the config.file in the build'
