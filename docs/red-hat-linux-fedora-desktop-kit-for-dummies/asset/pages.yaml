- img_proc: true
  md: '# Appendix C: Filing Your Life Away


    # Figuring out where you are


    Log in to your Red Hat Linux computer and open a GNOME Terminal session. In this
    case, you log in as the example user lidia. To find out where you are in the Linux
    file system, simply type `pwd` at the command prompt:


    ```

    [lidia@cancun lidia]$pwd

    ```


    You receive this response:


    ```

    /home/lidia

    [lidia@cancun lidia]$

    ```


    This response indicates that you are logged in as lidia and are in the /home/lidia
    directory. Unless your alter ego is out, you should be logged as yourself and
    be in the /home/yourself directory, where yourself is your login name.


    The `pwd` command stands for *print working directory*. Your working directory
    is the default directory where Linux commands perform their actions; the working
    directory is where you are in the file system when you type a command. When you
    type the `ls -l` command, for example, Linux shows you the files in your working
    directory. Any file actions on your part occur in your working directory unless
    you are root. For security reasons that we don''t go into, the root user isn''t
    configured to be able to work on the current working directory. You can change
    this setting, but the root user generally must explicitly specify the working
    directory. For example, if you are root and are in the /etc directory and you
    want to indicate the hosts file, you must type `cat /etc/hosts` rather than just
    `cat hosts`.


    Type this command:


    ```

    ls -la

    ```


    You see only the files in your working directory. If you want to specify a file
    that isn''t in your working directory, you have to specify the name of the directory
    that contains the file in addition to the name of the file. For example, this
    command lists the `passwd` file in the /etc directory:


    ```

    ls -la /etc/passwd

    ```'
