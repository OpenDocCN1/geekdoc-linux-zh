  md: '# Appendix E


    # Revving Up RPM


    +   In This Appendix

    - RPM explained

    - What RPM does

    - The Red Hat Package Manager

    - Manually using RPM


    This appendix introduces you to the Red Hat Package Manager (RPM). Red Hat, Inc.,
    developed RPM in conjunction with another Linux distributor, Calder Systems. RPM
    makes a grand effort to reduce the amount of work you have to do when you install
    software. RPM makes installing, updating, and removing software an automatic process.
    Woo-hoo!


    Although other package managers are available, RPM has become the most popular
    system for installing, modifying, and transporting Linux software. This handy-dandy
    tool is a big reason that Red Hat is the de facto Linux distribution leader. Motor
    through this chapter to find out everything you need to know about RPM.


    # Introducing RPM


    The primary reasons that the Red Hat Linux distribution became popular was that
    it added value for its customers with technologies such as Red Hat Package Manager
    (RPM).


    All the software that was installed during the Red Hat installation process is
    stored in RPM''s giving format, called packages. Packages are a collection of
    individual software (applications, libraries, and documentation, for example)
    contained in one file.


    The package-management concept has been around for quite a while, with all the
    major Unix vendors supplying their own systems. The idea is to distribute software
    in a single file and have a package manager do the work of installing,'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# 346 Part VI: Appendixes


    or uninstalling, managing the individual files. The Linux world has benefited
    greatly from this system, which simplifies the distribution and use of software.


    ![](img/453364505e32ffec24f7d88ac7824962_367_0.png)


    You can install software without RPM, but we''re not sure why you would want to
    — the RPM package contains everything you need to install and run an application.
    For example, if you didn''t have the RPM package, installing Mozilla would work
    a little something like this: You would have to install the individual pieces
    that make the Mozilla system, which can require dozens or more steps. You can
    also install, update, or uninstall RPM software (see the following section for
    details).


    ![](img/453364505e32ffec24f7d88ac7824962_367_1.png)


    We remember, back in the day, when we used the Linux operating system for the
    first time. We had to install all the software using the dreaded tape archive
    system (tar). Trust us: Installing, maintaining, and upgrading Linux with tar
    was a difficult task. RPM has made life easy.


    ![](img/453364505e32ffec24f7d88ac7824962_367_2.png)


    The /mnt/cdrom/RedHat/RPM directory contains all the RPM packages.


    # Taking a Look at What RPM Does


    RPM performs three basic functions: it installs, upgrades, and removes packages.
    In addition to these functions, it can find out sorts of information about installed
    and yet-to-be-installed packages. (All this, and what wishes windows too.) Here''s
    a brief rundown of each function:


    +   - Installing packages: RPM installs software. Software systems, such as Mozilla,
    have files of all types that must be put into certain locations in order to work
    properly. For example, using Red Hat, some (but not all) of the Mozilla files
    need to go into the /usr/bin directory. RPM performs this organizational stuff
    automatically, without any fuss or mess.


    ![](img/453364505e32ffec24f7d88ac7824962_367_3.png)


    +   - RPM not only installs files in their proper directories but also performs
    tasks as creating the directories and running scripts to the things that need
    to be done. (It''s such a tidy and organized little scant)

    - Upgrading packages: Gone are the days when updating a system was worse than
    going to the dentist. RPM acts like the personal Linux assistant you wish had
    by updating existing software packages for you. RPM also keeps track of, in a
    database of its own, all the packages you installed. When you upgrade a package,
    RPM does all the bookkeeping chores and replaces only the files that need to be
    replaced. It saves the configuration files it replaces.


    +   - Removing packages: The package database RPM keeps is also useful in removing
    packages. To put it simply, RPM takes out the trash. (Keeping was never so easy.)
    RPM goes to each file and uninstalls it. Directories belonging to the package
    are also removed when no files from other packages occupy them.'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# Appendix E: Revving Up RPM


    +   - Querying packages and files: RPM can also give you a great deal of information
    about a package and its files. You can use the query function to find out the
    function of a package and which files belong to it. RPM can also work on the RPM
    packages themselves, regardless of whether they have been installed.


    +   - Verifying packages: RPM can validate an installed package with a checksum
    (a fingerprint) to see whether and how it has changed. This feature is useful
    for security reasons. If you suspect that a file or system has been hacked, you
    can use RPM to find out how it has changed.


    ![](img/453364505e32ffec24f7d88ac7824962_368_0.png)


    RPM packages often include configuration files as part of their installation.
    If you erase an RPM package, those configuration files are not deleted but instead
    are renamed by appending the suffix .rpmsave to the end of the original filename.
    For example, removing the Kerberos package, krbafs, saves the configuration file
    by renaming /etc/krb.conf to /etc/krb.conf.rpmsave.


    When you remove a package


    The package manager displays all the Red Hat package groups installed by your
    system. Individual packages are organized into groups, such as the X Window System
    and GNOME. When the check box to the left of a group is active, designated by
    a plus sign (+), or more packages from that group is installed. The number to
    the right of the package group shows how many packages of the total number in
    that group are installed.'
