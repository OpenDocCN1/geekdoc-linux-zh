  md: '# Chapter 11


    # Surfin’ the Net andnGroovin’ to Tunes


    # In This Chapter


    +   * A brief history of the Web

    * Using Mozilla to surf the Web

    * Plugging in plug-ins

    * Playing your CDs

    * Building your sound system

    * Working with CDs


    In this chapter, we introduce the open source Mozilla web browser. Mozilla provides
    all the capabilities of other popular browsers. We show you how to set up Mozilla
    for your Red Hat Linux computer so that you can surf the Net. You can use your
    computer as a multimedia device. After working with Mozilla, we describe how to
    configure your Linux box to listen to music and create CDs.


    Our goal in this chapter is to describe how to use the basic Mozilla features.
    However, we want you to know that Mozilla can do far more than we describe here.
    For more information about Mozilla, check out the features available on the Help
    menu, such as the Reference Library or Help contents.


    ![](img/453364505e32ffec24f7d88ac7824962_164_0.png)


    # Making the World Wide Web Possible


    Once upon a time, a company named Netscape created a browser to surf the Internet.
    The browser was originally named Navigator, Communicator, and later, Millions.
    Millions of people downloaded it from the Internet for free. Netscape put in the
    hands of millions of people (including us, your authors) the power to access the
    exploding number of web servers. Netscape made history and changed the world because
    it changed the Internet from a medium that served scientists into a tool that
    anyone can use.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# 144 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    Even though Netscape Communicator is freely distributed to anyone who wants it,
    it isn''t open source software in the same way that Linux is. Quite simply, Netscape
    Communicator is a moneymaking venture, and Netscape considers the way the software
    works to be proprietary.


    On the other hand, Netscape recognizes the importance of the open source dynamic,
    which is why it released an open source version of Netscape, named Mozilla. Now,
    countless numbers of people are developing and enhancing Mozilla, the default
    browser for Red Hat computers.


    The DVD that comes with this book includes Mozilla, the open brother to Netscape
    Communicator. Netscape and Mozilla are quite similar, although they have a slightly
    different look and feel.


    # Surfin'' '' the Net with Mozilla


    If you have ever browsed the internet (and who hasn''t, these days?), the first
    thing you want to do is tailor Mozilla to your preferences. You can complete this
    task without connecting to the Internet. Follow the steps in this section to customize
    Mozilla to your liking and set up Mozilla to your e-mail client.


    When you connect to the Internet, the first page you see is your home page. You
    have the option to set your home page to a Web page you want to see rather at
    a page that someone else wants to see. You may also want to tweak your history
    settings for whatever reason (but certainly not a paranoid one). These steps explain
    what you need to do:


    +   1. Start Mozilla by clicking the blue globe icon on the GNOME Panel.

    Welcome to Red Hat Linux screen appears in Mozilla. You can use this page to find
    out more information about Red Hat and its products.

    Concentrate on configuring Mozilla and skip over all the Red Hat information;
    lots of good information is there, however, explore its world at your leisure.

    2. Choose Edit:Preferences.

    On the left side of the Preferences window is a list of categories, which you
    can think of as a map of where you are in the Preferences window.

    3. Click the arrow plus sign next to the Navigator category to expand it.

    Here, you determine which Web page appears when you start Mozilla and which Web
    page loads when you click the Home button on the Navigation toolbar.


    ![](img/453364505e32ffec24f7d88ac7824962_165_0.png)'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Chapter 11: Surfin'' the Net and Groovin'' to Tunes 145


    4. In the Home Page area of the Preferences window, fill in the Location field
    with the URL of the Web page you want to be your home page.


    You can also surf to the site of your choice, click Preferences, and then click
    the Use Current page.


    For example, type **www.linuxworld.com** and see interesting information about
    Linux whenever you start up your browser or click the Home button, in the upper-left
    corner of the Mozilla window.


    Mozilla remembers you have been and lets you select (and go to) a previous location.
    How long Mozilla remembers (and how big the list becomes) depends on how many
    days of history you choose. The History configuration option determines the number
    of days that the locations you visit are saved. If you''re short on disk space,
    choose a lower History number, such as one or two days. Otherwise, leave the default
    alone.


    If your Linux computer is connected to a network with a proxy firewall, you have
    to configure Mozilla to work with. To do so, from the Preferences window choose
    Advanced>Proxies. Click the Manual Proxy configuration radio button and enter
    the name of your firewall. enter **proxy.mynetwork.com** in the HTTP Proxy text
    box (if that''s the name of your firewall) and enter **80** in the Port text box.
    You don''t have to perform this configuration if you''re using the Red Hat default
    firewall or the packet-filtering firewalls we describe in this book.


    ![](img/453364505e32ffec24f7d88ac7824962_166_0.png)


    ![](img/453364505e32ffec24f7d88ac7824962_166_1.png)


    # Plugging In Plug-Ins


    Mozilla performs the tasks you expect from a browser, like displaying graphics
    along with text. Without help, Mozilla doesn''t go the extra mile and display
    things like animation and JavaScript. When it comes to special functions, Mozilla
    is a blank slate.


    However, with a little help from friends such as you, Mozilla can go that extra
    mile. That help comes in the form of plug-ins. A *plug-in* is software Mozilla
    uses when needed to perform extra functions. To make use of plug-ins, all you
    need to do is — sorry — plug it in.


    The plug-in process is straightforward:


    +   - Obtain the plug-in and place it in the Mozilla plug-in directory.

    - Optionally, configure the Mozilla preferences to use the plug-ins.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# 146 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    We describe how to download and install several popular — and necessary plug-ins.
    Let''s start with the popular Macromedia Shockwave Flash plug-in. Mozilla can
    show animation and other cool stuff. Follow these steps:


    +   1. Start up Mozilla and your Internet connection (if necessary) and then check
    to see which plug-ins already has access to by clicking the Help>About Plug-ins
    menu.

    Mozilla shows that only the default plug-in, libnullplugin.so, is installed. You
    need to download and install some useful plug-ins.

    Clicking the Netscape.com link at the top of the Installed Plug-ins page sends
    you to the Netscape plug-in Web page. That page describes what plug-ins do and
    which popular ones are available.

    2. Enter the address www.macromedia.com/downloads in the text box and press Enter.

    The Macromedia download page opens.

