  md: '# 166 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    ![](img/453364505e32ffec24f7d88ac7824962_187_0.png)


    Okay, so OpenOffice has lots of great features. How good are they? Can they do
    the job done? Well, we wrote this edition of the book using OpenOffice, and we
    wrote the preceding edition using StarOffice. That''s not a bad testimonial to
    the capabilities of OpenOffice.


    # Getting to Know OpenOffice


    If you''re familiar with Microsoft Office, you should be able to find your way
    around OpenOffice. The look and feel are a little different, but the idea is the
    same. OpenOffice is also morally superior to Office because it''s free and a part
    of open source. This section briefly describes some of the most common functions
    of OpenOffice.


    The next few sections provide only a basic introduction to the things you can
    do with OpenOffice. No, we''re not lazy; it''s just that it would take too much
    space to describe it all in detail. Please experiment with your own test documents
    and consult the online help system for more information.


    # Firing up and using OpenOffice


    Red Hat Linux provides OpenOffice and installs it by default. Click the GNOME
    Menu button and then Choose-OpenOffice'
