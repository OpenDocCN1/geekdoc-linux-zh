    # Resizing Windows NT, 2000, and XP NTFS partitions with a little PartitionMagic


    Resizing NTFS requires the use of commercial tools, such as Norton Ghost (www.norton.com)
    or PartitionMagic (www.powerquest.com). PartitionMagic works by shrinking the
    Microsoft Windows partition, leaving free space for a new partition. Ghost 2003,
    however, doesn''t dynamically modify your existing NTFS file system. Instead,
    it backs up your existing Windows partition (takes a "snapshot") and then creates
    one or more new partitions over. Ghost requires a storage device on which to save
    the snapshot image. If your Windows installation is relatively small (less than
    2GB), you may be able to use a Zip drive, Zip drive, or a writable CD-ROM as a
    storage device. However, you have to use a second hard drive, tape backup, or
    other backup mechanism for larger installations.


    We describe in this section how to use PartitionMagic. Norton Ghost is an excellent
    tool, but beyond the scope of this book because we can''t assume that you have
    the backup resources to use it. You need backup media large enough to store your
    entire Windows installation.) PartitionMagic doesn''t give you the warm fuzzies
    of getting a backup along with your resizing, but it still works well. We have
    used it number of times with good results.


    These steps describe how to install PartitionMagic:


