  md: '# # Red Hat® Linux® Fedora™ For Dummies®


    # Cheat Sheet


    # ## Systems administration commands


    The following list shows several commonly used Linux commands that help you to
    manage disks, shut down your computer, and gather information about your computer
    system. You enter these commands from a GNOME terminal prompt. Consult Chapter
    4 for more information about how to enter commands.


    | | |

    |--- |--- |

    | mount [options] device_file_system | Mount a file system. |umount [option] file_system
    | Unmount a file system. |

    | fsck [options] file_system | Check the structure and integrity of a specified
    file system. |

    | mkfs [options] file_system | Put a directory structure on a low-level formatted
    disk. |

    | shutdown | Shut down the system now than wait for a message to be sent. (Ctrl+Del
    does the same thing). |

    | vmstat [options] | Look at the virtual memory performance. |

    | procinfo | Gather information about processes.


    # ## File permissions


    The following examples show different file permission combinations. Consult Appendix
    C and D for more information about files and file permissions.


    +   - -rwxrwxrwx Creates, write, and execute permissions for the user, the group,
    and the rest of the world (mode 777)

    - drwxr-xr-- Creates a directory that is completely open to its owner and can
    be read and searched by the group and (not searched) by the world (mode 754)

    - crw-r--r-- Creates a character-special file that the owner can read or write
    but that the group and the world can only read (mode 644)

    - br------- Creates a block-special file that only the owner can read and write
    to (mode 600)


