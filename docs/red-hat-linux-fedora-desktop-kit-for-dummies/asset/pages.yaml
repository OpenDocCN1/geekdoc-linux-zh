    # Audio by proxy: Getting XMMS to work through your firewall


    Firewalls are necessary to fight the evil guys who lurk on the Internet, but they
    can put a kink in your listening pleasure. A firewall is used to prevent unauthorized
    access from the outside — in most cases, the Internet — from reaching your computer
    or network.


    any mechanism specifically designed to work with proxies.


    To configure XMMS to work with proxy firewalls, follow these steps:


    The firewall we show you how to build in Chapter 8 and the default Red firewall
    doesn''t affect either of the players described in this chapter. However, many
    LANs are connected through proxy firewalls, which intercept packets sent to the
    Internet and rewrite them according to certain rules; our firewall filter packets
    based on their source and destination addresses and ports.


    +   1. Start XMMS, right-click the XMMS window, and choose Options▸Preferences.


    +   2. Click the Egg Vorbis plug-in in the Input Plug-ins subwindow and click
    Configure.


    The Egg Vorbis Configuration window opens. You need to enter the address of your
    proxy server. You may need to contact your friendly neighborhood systems administrator
    to get that information.


    If you Red Hat Linux workstation sit on a network with a proxy-firewall, such
    as the one you have installed in Chapter 8, you don''t need to modify XMMS. The
    key is that the filtering firewall allows all outgoing TCP and UDP connections
    (or ports). However, if your network uses a proxy-based firewall, you may modify
    XMMS. (gmplayer doesn''t have


    +   3. Click the Use Proxy button and enter the proxy server address in the Host-window.


    +   4. Click the Use Authentication radio button and enter your username and password
    in their respective subwindows if your proxy requires them.


