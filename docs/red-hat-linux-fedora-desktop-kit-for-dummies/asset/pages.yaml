  md: '# Chapter 8


    # Only You Can Prevent Network Break-Ins


    In This Chapter


    +   - Introducing firewalls

    - Using the iptables firewall system

    - Designing and viewing your filtering rules

    - Automatically starting your firewall


    After connecting to the Internet, you run the very real risk that bad guys will
    try to break into or otherwise harm your computer. The bad guys wear black hats,
    just like in the movies (as opposed to red hats, which are a bit odd but still
    good). You may also have heard them called hackers, crackers, the Joker, and whatever.
    Whatever their names and whatever their intentions, the Internet is getting more
    dangerous every day, so ya protect yourself.


    A firewall is a device that enables you to use the Internet while minimizing the
    possibility that the Internet will use. Firewalls basically allow your network
    communications to go out but minimize the possibility of anyone making unwanted
    connections to your computer or private network.


    This chapter describes, surprisingly, how to build a firewall to protect your
    Red Hat Linux computer or your guests. First, in case you doubt that you truly
    need a firewall, we explain why firewalls are important. We introduce you to iptables,
    the Linux firewall system, and describe how to set up your firewall-filtering
    rules. After you set up your filters, you need to know how to run the firewall
    automatically. You do that by setting up a script—something we explain in this
    chapter. And, of course, what good would your firewall be if it didn''t work?
    So, we show you how to do a simple test to make sure that your firewall is burning
    brightly.


    The firewall described in this chapter is designed to protect a single Red Hat
    Linux computer that''s connected to the Internet. The firewall isn''t designed
    to protect an entire network. Chapter 15 describes how to modify this firewall
    to protect your private network.


    ![](img/453364505e32ffec24f7d88ac7824962_124_0.png)'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# 104 Part II: Got Net?


    # Understanding Why You Need a Firewall in the First Place


    You may think that there''s safety in numbers. After all, literally millions of
    people, businesses, and organizations are connected to each other at any given
    time through networks and the Internet. What do you, an individual with a simple
    computer and possibly a small network connected to the Internet have to be concerned
    about? The bad guys are usually interested in big money or big publicity, right?


    Well, that''s mostly true, and chances that you may never get hacked. If you subscribe
    to that world view, you''re — in technical jargon relying on security by obscurity.


    Many hackers use tools that automatically scan and attack entire networks. The
    happy hacker doesn''t have to work hard to search large numbers of networks to
    find and exploit unprotected computers. Don''t risk getting owned — when your
    computer gets broken into and controlled — by a hacker, especially when Linux
    provides effective tools for protecting yourself.


    Using a firewall is one simple but quite effective method for protecting yourself
    when you connect to the Internet. A firewall allows you to connect to the Internet
    while blocking unnecessary and unwanted connections from coming in.


    Firewalls provide bang-for-the-buck protection. However, they''re not the only
    security measure you should take. For example, locking your doors certainly helps
    protect against burglars but it''s not 100 percent effective — they can still
    break through a window. You best bet comes using layers of security, such as locking
    your windows, alarms, and keeping tabs on neighborhood activities. The idea is
    to have each layer reinforce the others. Chapter 17 describes how to add security
    layers to your computer.


    # Building an Effective Firewall


    Linux comes bundled with a simple but extremely effective firewall system named
    Netfilter/iptables. The Netfilter part refers to the firewall system that''s built
    into the Linux operating system — the kernel, to be exact — and Iptables is the
    interface that controls it. We refer to the overall system as Iptables because
    that is the part that you work with.


    ![](img/453364505e32ffec24f7d88ac7824962_125_0.png)'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Chapter 8: Only You Can Prevent Network Break-Ins 105


    # Designing filtering rules: Permissive and restrictive methods


    Firewall-filtering rules are like the bricks (or asbestos, as you prefer) that
    your firewall. Basically, filtering rules determine what network communication
    can go out of and come into your computer.


    restrictive method is, from a security standpoint, the best way to create a firewall
    because you know exactly what access you''re allowing. However, the restrictive
    method can also create problems because you may unintentionally prevent or wanted
    network traffic from reaching your computer.


    When designing firewall-filtering rules, you can choose between two philosophies:


    +   - Allow all connections by default and then deny specific access.


    +   - Deny all connections by default and then allow specific access.


    Allowing all connections takes the view that you should start by allowing all
    communication with your computer and then denying connections by one.(This method
    is used by the Red Hat firewall, which you during the installation process.) The
    danger with this method is that you unintentionally allow dangerous traffic to
    reach your machine. The alternative method is to start by denying all communication
    and then selectively allowing certain traffic.


    We explain in this chapter how to use the restrictive method, for several reasons:


    +   - It''s the safest method. The restrictive method is safer because it minimizes
    all external contact with your Internet-connected computer. For example, it minimizes
    the information about your firewall port scanning and other tricks to prevent
    to hackers.


    +   - It''s easier to configure. Because iptables provides stateful filtering,
    you have to configure only two rules to create a safe firewall. However, you have
    to configure numerous individual rules when using the permissive method. Extra,
    unnecessary complexity reduces security.


    The iptables system filters IP packets, (IP stands for Internet Protocol, in fact).
    When you''re connected to the Internet, all the information (graphics and text)
    that you send and receive is sent in the form of IP packets. All the information
    that enters and leaves your computer via the Internet is packaged in the form
    of IP packets. You can use iptables to accept or deny IP packets based on their
    destinations, source addresses, and ports.


    The iptables system is effective because it uses stateful filtering, which means
    that the firewall can keep track of the state of each connection. It''s a technical
    way of saying that iptables knows which IP packages are valid and which are not.
    For example, if you''re browsing dummies.com, iptables keeps track of all packets
    that belong to that connection. The ipt utility can deny packets that are trying
    to reach your computer but don''t belong to your connection, thus preventing any
    hackers from sneaking packets through your firewall.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 106 Part II: Got Net?


    Red Hat Linux installs an Iables-based firewall by default. The installation system
    configures a medium level of protection during the installation process. You may
    recall from Chapter 3 that we advise you to use the default firewall configuration.
    However, the default firewall is not secure as we would prefer for connecting
    to the Internet. Therefore, we describe in this chapter how to construct a more
    comprehensive and secure firewall.


    ![](img/453364505e32ffec24f7d88ac7824962_127_0.png)


    The concept of ports is an essential part of the Internet Protocol. Ports are
    used to organize the communication between clients and servers. For example, when
    you click a Web page, your browser communicates with the web server by using a
    port. That''s a gross simplification, of course, but it describes the basic idea.
    Suffice it to say that ports are used to control the internal workings of the
    Internet for such tasks as Web browsing.


    ![](img/453364505e32ffec24f7d88ac7824962_127_1.png)


    # Setting Up a Firewall


    You know that you need a firewall and want to create one. What''s next? The following
    sections explain how to set up an Iables-based firewall by the restrictive model.
    This section describes how to manually create the firewall-filtering rules. When
    you''re setting up your rules, the section "Saving your filtering rules to a script,"
    later in this chapter, so that you don''t have to enter these rules every time
    you turn on your computer.


    In this section, you design an Iables-based firewall that turns off all incoming
    connections on your modem and still enables you to establish an outgoing connection
    to the Internet. You then back off the total restriction of incoming communication
    to allowing incoming Secure connection. (Secure Shell encrypted communications.)


    ![](img/453364505e32ffec24f7d88ac7824962_127_2.png)


    Don''t execute these instructions from a remote connection! You must run these
    commands from your computer''s console. That is, you must be sitting at your computer
    and not working on it over a network connection. The reason is that these firewall
    rules shut off external network connections before restoring them.


    These instructions describe how to build your firewall, brick by brick:


    +   1. Log in to your computer as root and open a GNOME Terminal window, by right-clicking
    any empty portion of the desktop and choosing New Terminal from the menu.

    2. Make sure that you''re not already running a firewall, by entering these rules
    at the command prompt in the terminal window:


    ```

    iptables --flush

    iptables --flush -t nat

    ```'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Chapter 8: Only You Can Prevent Network Break-Ins


    The iptables entries remove any existing filtering or Network Address Translation
    (NAT) rules. NAT rules masquerade your network address as another address, making
    your computer appear to be used by someone else. NAT is frequently used to make
    your computer appear to be coming from your ISP so that you don''t have to register
    your computer for an official Internet Protocol (IP) address.


    # 3. Filter out all network communication to, from, and through your computer
    by entering these rules:


    ```

    iptables --policy INPUT DROP

    iptables --policy OUTPUT DROP

    iptables --policy FORWARD DROP

    ```


    These commands set the default policy of your firewall to not allow any traffic
    into (the INPUT rule) or out of (the OUTPUT rule) any network interface; nor is
    any traffic allowed to pass between network interfaces (the FORWARD rule) if you
    have them. At this point, you have an extremely safe firewall. Your computer is
    useless in using it for any network-related tasks. The next step opens the firewall
    a little bit so that you can access the Internet (or any network you''re attached
    to) in a safe way.


    # 4. Enter these rules to allow network traffic to pass through the loopback device:


    ```

    iptables -A OUTPUT -j ACCEPT -o lo

    iptables -A INPUT -j ACCEPT -i lo

    ```


    Linux computers use an internal network, called a loopback interface (lo). The
    loopback isn''t a physical device, but rather a virtual one. Linux uses lo for
    internal communications. (A great deal goes on behind the scenes on a Linux computer.)


    # 5. Turn on all outgoing communication from your computer:


    ```

    iptables -A OUTPUT -m state --state NEW,RELATED,ESTABLISHED -j ACCEPT

    iptables -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT

    ```


    These rules don''t specify any particular network interface. However, because
    the filter is stateful, these rules effectively work on your Ethernet, wireless,
    or a dial-up Point-to-point (PPP) interface.


    The first filter rule permits all outgoing communication. The --state NEW, RELATED,
    ESTABLISHED option tells the firewall to allow packets of both new and already
    established connections to pass. (Packets are the basic part of all network communication.)
    Packets that are related to existing connections but use a different port, such
    as FTP data transfers, are also permitted.'
