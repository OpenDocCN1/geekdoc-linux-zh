  md: '# Understanding URLs


    Have you ever wondered what the various parts of a URL mean? Using a URL like
    http://localhost:8000/track1.ogg to access a streaming audio server, we thought
    we dissect what the various parts mean and do. This list describes the function
    of each URL element:


    or in numeric form. For example, you could replace localhost with its numeric
    address, 127.0.0.1.


    +   * Protocol: Icecast2 uses HyperText Protocol — packets to encapsulate audio
    streams. HTTP is a good choice because it''s easy to configure your firewalls
    to allow HTTP connections.


    +   * Port: The port number Icecast2 uses to listen for TCP connection requests.
    Icecast2 uses port 8000 by default; you can easily change the port by modifying
    the Icecast2 configuration.


    +   * Address: The Icecast2 server''s IP address. The address can either be a
    domain name


    +   * MountPoint: This component specifies the Icecast2 stream to connect to.
    Icecast2 is capable of playing two streams. In this example, you use the content
    file track1.ogg, which you may have created in the preceding section.


