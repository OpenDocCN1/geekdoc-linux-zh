  md: "# Part V: The Part of Tens\n\n# # Linux can't find a shell script (or a program)\
    \ \n\nProblem: You type a command name, but Linux can't find the command, even\
    \ if it's in the current directory.\n\nSolution: When you type a shell or binary\
    \ command name, Linux looks for the name in specific places and in a specific\
    \ order. To find out which directories Linux looks in, and in which order, type\
    \ this command:\n\n```\necho $PATH\n```\n\nYou see a stream similar to this one:\n\
    \n```\n/bin:/usr/bin:/usr/local/bin\n```\n\nLinux looks at these directories to\
