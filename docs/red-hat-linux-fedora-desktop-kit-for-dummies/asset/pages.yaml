    # Building a Print Server


    Linux can share printers to other Linux (Unix) computers without using Samba;
    you can select the Unix Style print queue to create a Linux print server. However,
    Windows doesn''t speak Unix, and using Samba enables all Linux, Unix, and Windows
    computers to use the Linux print server.'
