    example, if you click any of the Shoutcast streams (at www. shoutcast.com), Mozilla
    saves the playlist to the /tmp directory, starts MPlayer, and directs it to play
    the playlists. The playlist MIME type -x-scpls, was inserted into Mozilla as a
