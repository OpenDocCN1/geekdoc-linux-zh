    This list provides more detail on each component in the system:


    +   - **Multimedia client**: The client connects to the multimedia server and
    plays the feed. For example, XMMS connects to Icecast2.


    +   - **Multimedia server**: The server is responsible for accepting requests
    from a client and then streaming multimedia information to the client. The server
    converts the original multimedia content into Internet Protocol (IP) packets in
    order to route it across a network or the Internet.


    +   - **Multimedia content**: Your multimedia server isn''t very useful without
    a content source. Your source may be a music CD or a DJ — you, for example. Sources
    are either fixed or dynamic. For example, a music CD is a fixed source. If you
    decide to switch carriers and become a DJ, you''re a dynamic source. The Ices2
    application reads from a fixed source and feeds it to Icecast2.


    # Creating a Music Source


    Before you create your server, you have to create something to play. This section
    describes how to create an Ogg Forbis file to play. We assume that you want to
    create a file from a commercial music CD. This practice is legal, and does not
    violate copyright law because you do not create a server that is broadcast on
    the Internet. Instead, you''re creating a server that is broadcast to a private
    network (yours). As far as we know, you''re still allowed to listen to your own
    CDs.


    ![](img/453364505e32ffec24f7d88ac7824962_301_1.png)


    The Ogg Vorbis audio formatting system is similar in function to MP3. However,
    Ogg Vorbis — or Ogg, for short — is an open source format (also known as a codec)
    and, unlike MP3, doesn''t have any proprietary algorithms or protocols. Ogg also
    provides higher fidelity than other formats. Ogg Vorbis is really two separate
    entities: Ogg is an audio compression format, and Vorbis is an encoding


    Follow these steps to create an Ogg-Vorbis-formatted music file:


