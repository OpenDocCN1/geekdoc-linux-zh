  md: '# 82 Part II: Got Net?


    # How cable modems work


    Modern cable modems do more than just network packets. They transmit data packets
    by modulating and demodulating electrical signals over the cable wires — thus,
    the name modem (modulate/demodulate). Cable modems now use the industry standard
    Data Over Cable Service Interface Specification


    (DOCSIS) protocol to deliver electrical signals across the cable network. The
    electrical signal carries the actual bits and bytes that comprise the network
    packets. A good analogy is an AM-FM radio system. DOCSIS–based electrical signals
    carry data packets just like radio waves transmit speech or music.


    The instructions we provide later in this chapter are designed for DOCSIS modems.


    Setting up your cable modem is usually a straightforward process. Modern DOCSIS
    cable modems act as network bridges. A network bridge simply rebcasts network
    packets in both directions — incoming and outgoing. One side of the bridge connects
    to the cable TV company. The other side connects to your computer through your
    Ethernet NIC; you can also connect through a network switch or hub (LAN). If your
    modem is the bridge type — we believe that the industry in the United States most
    uses that system — it doesn''t require any configuration.


    # Setting up Internet protocols


    You don''t have to configure your cable modem for it to work. What you do need
    to do, is tell your Red Hat Linux computer how to connect to the modem. Cable
    modems typically connect to your computer via an Ethernet network interface. Therefore,
    you need to connect the cable modem to your computer using an Ethernet-based network.


    You need to configure your Red Hat Linux computer''s Ethernet adapter using the
    Dynamic Host Configuration Protocol (DHCP); you will need an Ethernet adapter,
    of course, installed on your computer. Your cable modem sets the IP address of
    your Ethernet NIC by using DHCP. These instructions show how to do that:


    +   1. Log in to your computer.


    +   2. Click the GNOME Menu button (the button in the lower-left corner of your
    screen that looks like a red fedora) and choose System Settings Network.'
