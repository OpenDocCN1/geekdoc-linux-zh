  md: '# Appendix F


    # About the DVD


    The DVD-ROM that comes with this book contains the full Red Hat Linux 10 (named
    Fedora Core) distribution. This appendix describes the minimum computer configuration
    you need in order to install Red Hat Linux and also some of what you get on the
    companion DVD-ROM.


    If your computer is not capable of reading DVD-ROMs, you can get the Red Hat Linux
    10 (Fedora Core) distribution on CD-ROMs by sending the coupons in the back of
    this book.


    Although the DVD-ROM contains the Linux kernel and supporting GNU programs and
    applications, it doesn''t carry some applications described in this book. You
    must download from the Internet applications such as Wine and Icecast2. We describe
    where and how to download all the applications we discuss in this book that aren''t
    on the companion DVD-ROM.


    # System Requirements


    Make sure that your computer meets the minimum system requirements listed here
    and in Chapter 3. More resources are needed for a graphical workstation. If your
    computer doesn''t match up to most of these requirements, you may have problems
    installing and running Red Hat Linux:


    +   - A Pentium-class PC with a 133MHz or faster processor is recommended

    - For reasonable performance using the Windows System, we recommend at least 64MB,
    and preferably 256MB of main memory. You can never have too much memory, and these
    numbers are the least you should have

    - You can run Linux on less than 32MB of memory if you don''t want graphics. Non-graphical
    Linux systems are typically used as servers'
  merge: -1
