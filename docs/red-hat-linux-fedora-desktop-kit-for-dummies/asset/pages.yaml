  md: '# 350 Part VI: Appendixes


    Until the advent of the RPM (and the Debian package manager on Debian systems),
    Linux software was distributed only by tar archives, which are sometimes referred
    to as tarballs, or more descriptively, hairballs. The tar file storage mechanism
    stores one or more files in a single file in a tar format. A tar file has the
    .tar suffix; if the file is compressed, it has a suffix .tgz or .tar.gz. Using
    the tar-based distribution system is sufficient if your software doesn''t change
    often and you''re young. But when you need to upgrade or change software or work
    with complex software systems, tar bears become quite difficult to work with.
    With rather than spending your life spitting out hairballs, use systems such as
    RPM to greatly simplify your life.


    # Removing an RPM package


    You can remove Red Hat packages as easily as you install them. Use the RPM erase
    (-e) function, which is the opposite of the install (-i) function. The package
    manager removes a package when you unselect an installed package. These steps
    describe how to remove a package:


    +   1. Click the GNOME Menu button and choose System Settings-> Add/Remove Packages.

    2. Enter the root password in the Information window, if you''re prompted.

    The Package Management window opens.

    3. Click the Remove Software button to open the Remove Package groups.

    4. Click the Remove button to select the package group that contains the package
    you want to remove.

    For example, to remove a package in the Mail Server group, select the option to
    the left of the Mail Server group, if it''s blank. (Leave the radio button if
    it''s already selected).

    5. Select the radio button to the left of the package you want to remove.

    The check mark disappears.

    6. Click the Remove Packages button.

    The Preparing System Update dialog box opens briefly, and you return to the Completed
    System Preparation window.

    7. Click the Continue button.

    The package (or packages) is removed

    8. Click the Continue button in the Completed System Preparation window.

    The package (or packages) is removed.

    9. After the package-removal process is finished, click the OK button.

    You return to the Add or Remove Software window.'
