    After you have installed Red Hat Linux is a good time to spend a few minutes perusing
    some basics. This chapter covers enough of the Linux fundamentals to get you started,
    including topics such as starting and stopping Red Hat Linux and understanding
    the difference between graphical and nongraphical applications.


    We start by introducing the system Linux uses to store information on a disk.
    Linux, like Windows, uses files and directories to store and organize information
    and applications. The following section describes the Linux file system.


    # Introducing the Linux File System Tree


    Linux sees all its parts, except its network, as files. Linux accesses files,
    directories, and devices as file addresses. Linux refers to drives and drive partitions
    by using a system of letters and numbers; for example, /dev/hda may be the name
    of the first IDE hard drive, and /dev/sdb may be the name of the second SCSI hard
    drive.'
