  md: '# Chapter 7: Connect Locally, Communicate Globally: Connecting to a LAN


    # Wireless network warning


    Wi-Fi, the standard for wireless technology, uses an encryption system named wireless
    equivalent privacy (WEP) to provide security. WEP encrypts communication between
    wireless devices to prevent someone with the right equipment from listening to
    and using your wireless network. But WEP is flawed and can be broken using tools
    available on the Internet (that''s a big surprise). If a hacker breaks into your
    Wi-Fi network, he can read your communications. Your problems don''t end. Hackers
    can use your wireless network to connect to both your private network and the
    Internet; you give the bad guys a free lunch and a launch pad to the Internet.


    On the other hand, wireless networking is so useful that many people make accommodations
    for the risk. The logic? If you assume that your wireless network has already
    been hacked, you don''t have to worry about when it might be hacked in the future.

    You should use OpenSSH, Secure Sockets Layer (SSL), and virtual private network
    (VPN) — all bundled with Red Linux — to conduct your internal and external communication.
    Keep in mind that using SSL, SSL and VPN protects your information, but doesn''t
    prevent anyone from connecting to your network. The next generation of Wi-Fi,
    802.11g, is supposed to fix the WEP weakness. Until the WEP problems are solved,
    be aware of the risks.


    # Configuring your Ethernet or wireless NIC


    To get your Red Linux computer working on a LAN, you must first configure its
    network interface card, or NIC. The NIC is the device that electronically connects
    your computer to your LAN. To work with the other computers on your network, your
    Ethernet or wireless adapter must be given a network address and a few other pieces
    of information.


    We have divided the configuration instructions between Ethernet and wireless (or
    Wi-Fi) NICs. The instructions start by explaining how to start the Red Hat Network
    Configuration Utility. We devote a subsection aplace to describing the particulars
    of configuring Ethernet and wireless devices. After we cover the device specifics,
    we discuss general configuration issues. The overall configuration process is
    outlined in these steps:


    +   1. Start the Configuration Utility.

    2. Configure your Ethernet or wireless device.

    3. Configure your computer''s host name.

    4. Configure your computer''s domain name service.

    5. Restart your network.'
