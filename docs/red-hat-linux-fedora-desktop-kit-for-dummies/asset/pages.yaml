  md: '# 300 Part V: The Part of Tens


    Enter the new password when prompted. Note that anyone who has physical access
    to your computer can use this method to break into it! If you use your computer
    in public or semipublic places, you should set your BIOS password. Setting a BIOS
    password doesn''t make using this method to break in impossible, but it does make
    it harder.


    # I want to change the GRUB boot order


    Problem: You created a dual-boot computer with Red Hat Linux and Windows, and
    you want to change which one boots by default.


    Solution: Modify the /etc/grub/grub.conf file on your Linux computer. The grub.conf
    should look similar to this example:


    ```

    default=0

    timeout=10

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Red Hat Linux (2.4.20-20.1)

    root (hd0,1)

    kernel /vmlinux-2.4.20-20.1 root=LABEL=/1 hdb-ide-

    scsi

    inititrd/inititrd-2.4.20-20.1.img

    title DOS

    rootnofify(hd0,0)

    default=0

    timeout=10

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Red Hat Linux (2.4.x)

    root (hd0,1)

    kernel /vmlinux-2.4.x root=/dev/sda7 hdb-ide-scsi

    inititrd/inititrd-2.4.x.img

    title Windows 2000

    chainloader +1

    rootnofify(hd0,0)

    ```


    In this case, Linux is the operating system that boots by default, unless you
    select otherwise; default = 0 corresponds to the first operating system in the
    list - the first Title line. To change the order, simply change the default value
    from 0 to 1:


    ```

    default=1

    timeout=10

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Red Hat Linux (2.4.20-20.1)

    root (hd0,1)

    ```'
  merge: -1
