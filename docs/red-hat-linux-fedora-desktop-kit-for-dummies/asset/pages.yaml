    Speaking of tunes, the next section shows how to play music from your CD-ROM.


    # Groovin'' to Tunes with CD Player


    Imagine that you''re sitting alone, working at your computer. Or, you could be
    reading a book that''s boring you. It''s Saturday night too, of course. What a
    drag. Want some diversion? Perhaps some music; but we can show you how to use
    your computer to listen to some tunes.


    In the following sections, we show you the tools Red Linux provides to make your
    workstation into a sound system, including all the necessary applications to play
    CDs, and tools for connecting your PC to a sound card and speakers. Start by making
    sure that your computer can play music.


    # Setting up your sound system


    Red Linux should have automatically configured your computer''s sound system during
    the post installation process we describe in Chapter 3. However, you may run into
    problems — especially on older computers — so Red Hat provides a sound card detection
    utility.'
  merge: -1
