  md: '# # Chapter 21


    # # Ten Security Vulnerabilities


    **In This Chapter**


    +   * Simplifying your system

    * Encrypting your communications

    * Using firewalls

    * Updating your software

    * Backing up your data

    * Introducing buffer overflows

    * Getting social

