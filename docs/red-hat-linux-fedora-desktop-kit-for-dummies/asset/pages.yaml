  md: '# 32 Part I: Installing Red Hat Linux


    ![](img/453364505e32ffec24f7d88ac7824962_53_0.png)


    # For installation purists only


    You can run the Red Hat installation system from either a graphical or text-based
    interface. If the installation process successfully detects your graphics hardware,
    the graphical method is selected automatically, and that''s what we discuss in
    this chapter. In addition to the ease of using a mouse to point and click, the
    graphical method groups similar configuration choices. For example, the keyboard
    and mouse selections are presented within one window, not two, as in the text-based
    installation.

    nYou may have to use the text-based installation, for these reasons:


    +   - Red Hat Linux installation system can''t use your graphics adapter. You
    figure out this situation when the graphical installation window doesn''t appear,
    but a text-based window does appear; use the keyboard to enter information and
    the cursor (arrow) to move from step to step. It doesn''t happen any more because
    the folks at Red Hat have done their homework and refined the installation process.
    However, manufacturers occasionally introduce new graphics systems that the installation
    system can''t use.


    +   - Your mother told you never to point and click.


    +   - You can select the text-based installation method by typing text at the
    boot prompt.


    # Choosing an Installation Type


    Red Hat provides several installation types to choose from. Although we think
    that you can probably get away with less space on your system, we decided to give
    you the minimum disk space requirements Red Hat suggests for each installation
    type:


    +   - Server: Creates an operating system environment for computers that provide
    services such as hosting Web pages. This installation requires 850MB of free space
    if you want minimal bells and whistles, at least 1.4GB of free space if you want
    to install all the bells and whistles but not the graphical X Window System, and
    at least 2.1GB to install all the bells and all the whistles and throw in the
    Acme Bell and Whistle Factory (which includes GNOME and KDE).


    +   - Custom: Installs the minimum base of software and requires you to select
    additional services, utilities, and applications. A second option installs everything
    on the companion discs. The former requires at least 475 MB, and the latter, 5.0GB.


    +   - Upgrade: Updates the Red Hat Linux software''s already installed on a computer
    but leaves all existing settings, users, and data alone. You can optionally choose
    to install additional packages.'
