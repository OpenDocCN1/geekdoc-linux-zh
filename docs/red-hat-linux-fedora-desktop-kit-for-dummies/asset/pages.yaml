  md: '# Part IV: Revenge of the Nerds


    # Building a Samba File Server


    Early in the game, Linux gained popularity by acting as a file server for both
    Windows and Linux computers. It did that by dancing the Samba. Samba is more than
    just a dance routine — it''s a suite of programs that speaks the same file-sharing
    language (the protocol) of Microsoft Windows. Using Samba produces a way to share
    the Linux file system on a network.


    This section describes how to install and configure Samba on your Red Hat Linux
    computer. Samba comes bundled with Red Hat Linux, of course, so installation is
    a breeze. Samba is also configured to automatically share the ubiquitous /home
    directory, so configuration is also easy.


    ![](img/453364505e32ffec24f7d88ac7824962_241_0.png)


    Samba is based on the client-server model in which a computer (server) provides
    services to one or more computers (clients). Samba uses the term share (which
    comes from the Microsoft Windows world) to refer to any object it exports to a
    network. An object can be a directory or a printer.


    # Installing and starting Samba


    Samba consists of several programs, configuration files, and documentation files.
    The complete Samba package consists of four RPM files that come bundle on the
    DVD-ROM accompanying this book. This list describes the purpose of each RPM file:


    +   * samba-client: This package contains the utility and other supporting software
    to connect a Linux computer to a Samba server. You can use the interactive utility
    smclient to connect to a Samba share. The default Red Hat Linux installation installs
    this package by default.

    * samba: The Samba server software is included in this package. All the programs
    for sharing files, directories, and printers are included here; the two essential
    daemons are smbd and nmbd; the essential configuration file is smb.conf. The utilities
    for controlling the daemons are also included.

    * samba-swat: You can manually configure the Samba configuration file, smb.conf,
    if you''re an expert. However, Samba provides a Web-based system that is much
    easier to use and produces clean and readable configuration files.

    * samba-common: All the software required by the other three packages is included
    in this file. This package is also installed by default.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Chapter 16: Creating Basic Linux Network Services


    Samba was originally designed and coded by Andrew Tridgill, of Australia. Samba
    instantly became popular worldwide and became too much for a few people to handle.
    Thus, the Samba project was started in order to take care of the phenomenon. You
    can find more information about Samba at www.samba.org.


    Follow these steps to dance the — er, install, configure, and use — Samba:


    +   1. Log in as root and insert this book''s companion DVD-ROM.

    2. Open a terminal emulator window and enter this command:

    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/samba-client*

    ```

    The Samba server consists of two daemons: smbd and nmbd. You must start both daemons
    before anyone can access your Samba server.

    3. Enter this command to start the daemons:

    ```

    /etc/init.d/smb start

    ```

    You can stop the daemons by substituting the stop option for the start option.
    You can restart the Samba server using the restart option:

    ```

    /etc/init.d/smb restart

    ```

    4. Automate the startup of the Samba daemons by creating these links with the
    chkconfig utility:

    To start Samba for Level 3 (nongraphical) and Level 5 (running the graphical X
    server); Samba is started whether your Linux computer starts in graphical or nongraphical
    mode:

    ```

    chkconfig --level 35 smb on

    ```

    Samba is configured by default to use its own password file. You must create the
    password file by using the mksmbpasswd.sh script.

    5. Use the smpasswd program to create the Samba user account and password.

    The -a option tells the script to add the user account to the smpasswd file:

    ```

    smbpasswd -a paul

    ```

    You are prompted to enter a password twice.'
