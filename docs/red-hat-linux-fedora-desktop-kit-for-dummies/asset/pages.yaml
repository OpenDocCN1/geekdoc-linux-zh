  md: '# Chapter 11: Surfin'' the Net and Groovin'' to Tunes 153


    # Burn, Baby, Burn: Burning CDs


    The steps in this section describe how to create, or burn, a CD-ROM. You can copy
    any kind of file to your CD-R or CD-RW:


    +   1. Log in as any user and insert a CD-R or CD-RW disc into your CD writer
    drive. (Close the Burn:/// when it opens.)


    What can you burn? The world''s your oyster, and you can make a CD of anything
    you want: data, software, or music. A good place to start is by backing up your
    /home directory on CD.


    +   2. Click the GNOME Menu button and choose System Tools:More System Tools:CD
    Writer.


    The GNOME Toaster window opens, as shown in Figure 11-4; An Information dialog
    box that you can read and close by clicking the OK button opens.


    +   3. Click the Folder icon, near the lower-left side of the window.


    Gtoaster owns its own file manager.


    +   4. Find the file or directory you want to record by clicking the directory
    where it''s stored.


    For example, double-click /home and the paul/ogg/Pat Metheny directory.


    +   5. Click and drag the files or directory (the rh18fd directory, in this example)
    to the Folder subwindow you opened in Step 3.


    You don''t have to use the GNOME Toaster file manager to select the file or files
    to record. You can open a Nautilus window and drag the file over to the Track
    subwindow.


    +   6. Click the CD icon, immediately below the Track button in the lower-left
    corner of the window.


    The Record subwindow opens and replaces the Track subwindow. You''re presented
    with several options that control the CD-R/RW drive. The default settings should
    work for your ISO image. ISO (International Organization for Standards) is in
    this context a type of file system that can be read by many different types of
    computer operating systems.


    +   7. Click the Record button and the CD recording process counts down.


    You have nine seconds to abort your mission.


    +   8. You can stop the process by pressing the Stop button.


    Your home directory is burned to the CD, creating a simple, reliable, and effective
    backup system. It''s easy to use.'
