- img_proc: true
  md: '# Appendix C: Filing Your Life Away


    +   - Special files: Represent either hardware devices (such as disk drives, tape
    drives, or keyboards) or some type of placeholder that the operating system uses.
    The /dev directory holds many of these special files. You can see this directory
    by running this command at a command prompt:


    ```

    ls -l /dev

    ```


    +   - Executable files: Contain instructions (usually called programs or shell
    scripts) for your computer. When you type the name of one of these files, you''re
    telling the operating system to execute the instructions. Some executable files
    look like gibberish, and others look like long lists of computer commands. Many
    of these executable files are located in /bin, /usr/bin, /sbin, and /usr/sbin.


    # Understanding files and directories


    If you live in the Windows world, you can think of a Linux file system as one
    huge folder that contains files and other file folders, which in turn contain
    files and other folders, which in contain files and — well, you get the point.
    In fact, the Linux file system is generally organized in this way. One big directory
    contains files and directories, and all the other directories in turn contain
    files and directories.


    # Directories and subdirectories


    A directory contained, or nested, in another directory is a subdirectory. For
    example, the directory named /mother may contain a subdirectory named /child.
    The relationship between the two is referred to as parent and child. The full
    name of the subdirectory is /mother/child, which would make a good place to keep
    a file named /mother/child/reunion that contains information about a family reunion.


    # The root directory


    In the tree structure of Linux, DOS, and Unix, the big directory at the bottom
    of the tree is the root directory. The root directory is (the poor guy must be
    exhausted) and is represented by a single / symbol (pronounced "slash"). From
    the root directory, the whole directory structure grows like a tree, with directories
    and subdirectories branching off like limbs.


    If you could turn the tree so that the trunk is in the air and the branches are
    the ground, you would have an inverted tree — which is how the Linux file system
    is normally drawn and represented (with the root at the top). If we were talking
    about Mother Nature, you would soon have a dead tree. Because the subject is computer
    technology, however, you have something that looks like an ever-growing, upside-down
    tree.


    ![](img/453364505e32ffec24f7d88ac7824962_350_0.png)'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# 330 Part VI: Appendixes


    # What''s in a name?


    You almost directories in the same way as you name files, following the same rules.
    The only way you can tell whether a name is a filename or a directory name is
    the way the slash character (/) is used to show directories nested in other directories.
    For example, usr/local means that local is in the directory. You know that usr
    is a directory because the trailing slash character tells you; however, you do
    not know local is a file or a directory.


    If you issue the ls command with the -f option, Linux lists directories with a
    slash character at the end, as in local/, so you know local is a directory.


    ![](img/453364505e32ffec24f7d88ac7824962_351_0.png)


    The simplest way to tell whether the slash character indicates the root directory
    or subdirectories, or directories and to see whether anything appears before the
    slash character in the directory path specification. If nothing appears before
    the slash, you have the root directory. For example, you know /usr is a subdirectory
    or a file in the root directory because it has only a single slash character in
    front of it.


    # Home again


    Linux systems have a directory named /home, which contains the user''s home directory,
    where she can


    +   * Store files

    * Create more subdirectories

    * Move, delete, and modify subdirectories and files


    Linux system files and files belonging to other users are never in a user''s /home
    directory. Linux decides where the /home directory is placed, and that location
    can be changed only by a superuser (root), and Linux is dictatorial because it
    has to maintain order and keep a handle on security.


    # Moving Around the File System with pwd and cd


    You can navigate the Linux file system without a map or the Global Positioning
    System (GPS). All you need to know are two commands: pwd and cd. (You run these
    commands from the command line.) However, you also need to know where to start;
    hence, the usefulness of the next section.'
