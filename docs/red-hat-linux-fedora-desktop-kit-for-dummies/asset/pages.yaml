  md: '# Chapter 5: Dial-Up Modems Still Get the Job


    # If you''re buying a modem


    Dial-up modems are an old technology, but still the most common method for making
    personal or small-business Internet connections. This state may not be true much
    longer because the number of users with broadband connections is rising fast,
    and most large businesses also use broadband services.


    Internal ones are generally less expensive than external ones, but external modems
    have several advantages. You can easily turn them on and off, you can connect
    them to a computer without opening the computer case, and if your phone line is
    straight by lighting, the charge passing through the modem doesn''t damage your
    computer. On the other hand, internal modems need only a telephone line, whereas
    external modems require a telephone line, a serial connection, and power-supply
    cables.


    An internal modem plugs into a PCI or ISA slot on your computer''s motherboard
    and receives power from the computer. An external modem comes in its enclosure,
    requires its own power supply (sometimes clunky, bulky plugs), and connects to
    the computer via a serial (RS232) connection. Both types of modems use your phone
    jack to connect to the internet.


    A third type of serial line modem is a PCMCIA card (sometimes called a PC card).
    These cards are used most often with laptop computers. Most laptops come with
    internal modems already installed.


    Now is a good time to verify that your own telephone service is billed at a flat
    rate and not metered; you should make sure that the dial-up number you use isn''t
    a long-distance call either. If you have metered service or end making a long-distance
    toll call, you run up huge bills while you''re spending hours chatting about gone
    lumen and reading about interdimensional travelers.


    After you choose your Internet Service Provider and arrange payment, the ISP provides
    certain pieces of information, including


    +   - Telephone access numbers

    - A username (usually the one you want)

    - A password (usually the one you supply)

    - An e-mail address, your username added to the ISP''s domain name

    - A primary Domain Name Server (DNS) number, which is a large number separated
    by periods into four groups of digits

    - A secondary Domain Name Server (DNS) number, which is another number separated
    by periods into four groups of digits

    - An SMTP (mail) server name


