  md: '# Danger, Will Robinson! Detecting intruders


    Everybody needs a loyal, vigilant robot to sound the alert when aliens, monsters,
    Dr. Smith, and hackers come after you. You can have literal robots (or can you?),
    you can have an intrusion-detection system (IDS).


    matter and relatively easy-to-use systems that provide good bang for your buck:
    Snort and Tripwire.


    Intrusion detection is the flip side of intrusion prevention. You can depend on
    not getting hacked unless you turn off your computer and lock it in your pocket
    room. Remember that no silver bullet exists in the world of computer security.
    You have to take measures to detect whether and when you get compromised.


    Snort is a network-based IDS. It looks for patterns in your network traffic that
    indicate hacker probes and break-in attempts. Snort isn''t perfect and does report
    false alerts. You''re going to spend time identifying and eliminating false-positives
    if you want to use Snort. However, that time will be well spent because Snort
    is considered an excellent IDS by system administrators and security professionals.
    Go to www.snort.org to find more information.


    Intrusion detection requires more on-going work than any of the security systems
    we discuss in this book. The other systems, such as firewalls and password protection,
    require some up-front work, but then run without additional work. An IDS, however,
    requires some initial installation and configuration and then continual review.
    You have to monitor an IDS daily if you want it to be of any use to you.


    Tripwire works by securing the fingerprints of files and directories and comparing
    them to subsequent ones. Any differences between the current and original fingerprint
    indicates the file has changed and might have been compromised. The fingerprints
    are called checksums, which are unique mathematical values calculated from the
    contents of a file or directory. You can find Tripwire at www.tripwire.com.


    Many IDS — far too many to describe here — can give you extra security. We suggest
    two


