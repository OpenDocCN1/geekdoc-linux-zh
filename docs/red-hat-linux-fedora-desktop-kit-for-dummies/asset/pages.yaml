    # Reducing your exposure: Removing and reducing services


    Hackers look for computer vulnerabilities by probing for vulnerable services.
    Network services — such as Apache, Samba, and DHCP — are, of course, designed
    to respond to network queries. Therefore hackers can readily find out what services
    you run and then find which, if any, attacks to use.


    We describe elsewhere how keeping software updated minimizes vulnerability. However,
    you can go one step better and make a service invulnerable by turning it off.
    One simple security rule is “Keep it simple.” The fact is that if you don''t need
    to run a service, you shouldn''t.


    We describe in this section how to eliminate or reduce both network and non-network
    services. This section describes how to use the chkconfig utility to change when,
    how, and whether a network service starts at boot time:


    +   1. Click the GNOME Menu and choose System Settings:Server Settings: Enter
    the root password if you''re prompted.


    +   2. Select an unnecessary service and shut it off by clicking the Stop button.


    +   3. Click the OK button when the confirmation window appears.


    +   4. Click the check mark to the left of the service to remove the check mark.
    Removing the check mark prevents the service from starting automatically at boot
    time.


    +   5. Repeat Steps 2–4 for each unnecessary service.


    +   6. When you have turned off each unnecessary service, click the Save button.


    +   7. Choose Quit from the File menu.


    Which services you turn off depends on your needs, of course. For example, if
    you''re unintentionally running a web server, turn off the httpd service. You
    generally should be able to turn off these services:'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Chapter 17: Securing Your Future


    +   - The Advanced Power Management Daemon (APMD): APMD is useful if you — like
    most people — regularly power-off your personal workstation or laptop. However,
    APMD is generally unnecessary on servers that run continuously. You want to keep
    APMD in the former case (workstation or laptop) and remove it in the latter (server).


    +   - GPM: This service allows you to use a mouse when running in nongraphical
    mode. You are running in graphical mode, so turn it off.


    +   - The job queue daemon: The attd daemon is used to schedule one-time cron-like
    jobs. If you need at, you know it. Otherwise, turn it off.


    +   - Network File Sharing (NFS): You need only services such as nfs, nlockd,
    portmap, and autofs when you''re running an NFS server or client. The last thing
    you want to do is share files to the Internet, for example.


    +   - Print services: Many people don''t run the printer daemon on servers. Turn
    off cups or lpd when you don''t need to print.


    +   - Samba: Just like with NFS, you should turn off Samba if you don''t need
    it.


    The rest is up to you. Terminate services with a vengeance.


    You can''t modify a service when it isn''t running. You can toggle the check mark
    on a nonrunning service, but it doesn''t have any effect if it''s not running.


    You can use the CLI-based chkconfig utility. Open a GNOME Terminal session and
    log in as root (su -):


    +   - List the services by running the chkconfig --list command.


    +   - List an individual service by specifying the service after the --list option:
    chkconfig -- list apmd.


    +   - Stop a service with the --add option: chkconfig -- add apmd.


    +   - Delete a service with the --del option: chkconfig -- del apmd.


    # Using a Secure Shell client


    You may be most familiar with graphical network communication applications, like
    the Mozilla browser and Evolution e-mail clients. However, a world of text-based
    tools is available, such as Secure Shell, Telnet, and FTP. Those applications
    provide an interactive method for connecting to other computers across networks
    and the Internet using a command-line interface (CLI); refer to Chapter 4 for
    more information about CLIs.


    ![](img/453364505e32ffec24f7d88ac7824962_266_0.png)'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# 246 Part IV: Revenge of the Nerds


    Interactive communication is effective for performing tasks on remote machines.
    For example, the primary way to work on Linux machines originally was via the
    CLI. CLI. The CLI is often the best way to perform tasks.


    CLI-based communication used to be primarily carried out over the insecure Telnet,
    FTP, and rsh connections. Services used unencrypted connections, and passwords
    were readily detected. The rsh service also used a system of interchange trust.
    That trust allowed hackers, like the infamous Kevin Mitnik, to “own” a network
    by breaking into one machine and then logging in to additional ones without authentication.


    Open Secure Shell (SSH) provides an encrypted channel to perform all those tasks.
    Red Hat bundles OpenSSH by default. We describe how to use the OpenSSH client
    to communicate with other machines and, second, create an OpenSSH server.


    You (dare we say must?) use encrypted channels when communicating over the Internet
    and wireless networks. Both the Internet and Wi-Fi connections are inherently
    insecure, and you have to protect your communications.


    ![](img/453364505e32ffec24f7d88ac7824962_267_0.png)


    # Connecting to a Secure Shell server


    Start by using OpenSSH as a client. Suppose that you want to log in to your ISP
    server, ssh.mysisp.com, with OpenSSH:


    +   1. Open a GNOME Terminal session.

    2. Enter this command:


    ```

    ssh ssh.mysisp.com

    ```


    Your mileage may vary, of course. You may have to use the -l option if, for example,
    your ISP user account name is different from your local computer. If your username
    on your local machine is lidia, but it''s lmaura at your ISP, enter this line:


    ```

    ssh -l lmaura ssh.mysisp.com

    ```


    The first time you connect to a remote server, you are prompted to accept the
    server''s fingerprint.


    +   3. Enter yes when you''re prompted.

    4. Enter your password when you''re prompted, and you are logged in.


    For example, you can now use a text-based e-mail client, like pine, to read your
    messages. This program is useful if you want to read your e-mail securely but
    can''t connect to your ISP with an SSL-enabled Mozilla or Evolution e-mail client.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Chapter 17: Securing Your Future


    # # Tunneling X across a network


    That was a simple and useful way to use OpenSSH, but you can do more. The Red
    Hat SSH client is automatically configured to forward X across your secure connection.
    While logged on to your ISP, you can run X Window client software and view it
    on your local machine:


    +   1. Log in to your ISP (or any machine running a Secure Shell server) as just
    described.


    +   2. Run an X Window application, such as xclock.


    The simple xclock window is displayed on your desktop. OpenSSH also bundles the
    file-transfer applications Secure Copy (scp) and Secure FTP (sftp). Secure Copy
    is non-interactive and copies files to from a remote machine. Secure FTP is a
    secure version of FTP and is also interactive. This list describes how to copy
    files between two machines:


    +   * Copy from a local machine to a remote one: To transfer your files from a
    local machine to a remote one, use Secure Copy (scp):


    ```

    scp abcacct@remote.mysisp.com

    ```


    This command copies the filename abc from the directory you are working in to
    myacct.mysisp.com home directory on the remote machine. You can specify either
    or both of commands the file from the local and remote directories. For example,
    this copies the file abc from the /tmp directory on the local machine to the /var/tmp
    directory on the remote machine and renames it to xyz:


    ```

    scp myacct@remote.mysisp.com:/tmp/abc /var/tmp/xyz

    ```


    The scp syntax is important. If you leave out the colon (:), your file is not
    copied to the remote machine but simply copied to a file named myacct@remote.mysisp.com
    in your local directory.


    +   * Copy from a remote to a local machine: Reverse the order of the parameters
    to copy from a remote machine. The following example copies the file abc from
    your home directory to your current working directory on the local machine:


    ```

    scp myacct@remote:abc

    ```


    The sftp program works like the old standby FTP, but uses encryption, of course.
    Follow these steps to perform simple file transfers with sftp:


    +   1. Open a GNOME Terminal session.


    +   2. Enter this command:


    ```

    sftp ssh@mysisp.com

    ```'
