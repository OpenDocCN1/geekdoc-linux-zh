- img_proc: true
  md: '# 312 Part V: The Part of Tens


    +   - The second line of defense is to update your Red Hat Linux computer as often
    as possible. Red Hat posts package updates, as they become available, as they
    fix vulnerabilities. Buffer overflow fixes comprise many of the package updates.
    Updating your system fixes many buffer overflow vulnerabilities.


    # Social Engineering 1010101010


    Hackers don''t have to discover supertechnical tricks to break into your computer.
    Many smart hackers aren''t deterred when they encounter a well-protected computer
    or network. What does a poor hacker in these security-aware times have to do into
    your system?


    Some hacker techniques don''t rely on technological means. One such technique
    is social engineering, which is a fancy way of saying "I plan to trick you or
    your associates have to giving me information to use against you."


    Social engineering can be as simple as a hacker calling to see whether you are
    at home or in the office. If you are not physically present, the hacker or burglar
    can drop by, break in and steal the computer or its disks. After someone gains
    physical possession of your computer, most security precautions can be easily
    defeated.


    Another social engineering technique hackers employ is to call a corporation''s
    help desk and pretend to be a VIP. The poor minimum-wage employee can often be
    bullied or coerced into giving out a password or other important information.


    ![](img/453364505e32ffec24f7d88ac7824962_333_0.png)


    The moral of the story is to exercise good security hygiene and be careful of
    strangers. Don''t give out information unless it''s essential and you can verify
    the authenticity of the request.


    # Bad Passwords


    Probably the easiest to avoid, and most often abused, vulnerability is poor or
    non-existent passwords. Passwords are your first line of defense. If your password
    is easily guessed or even worse — blank, someone will break in.


    Bad passwords are easy to fix. Start by assigning a password to every account
    you create — especially root. Make it a habit to use "good" passwords. Passwords
    can be cracked by brute force because computers have become very fast. Because
    you connect to the Internet, hackers can steal your /etc/passwd file, which contains
    the encrypted version of your text-based passwords and then use a computer to
    crack them.'
