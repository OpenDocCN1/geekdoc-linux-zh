    # "When I boot into Windows, 1 I get the recovery process"


    **Problem:** You have a dual-boot computer with Microsoft Windows as the alternative
    operating system. When you boot into Windows, you get the Windows recovery screen.
    "Help, I''m scared!"


    **Solution:** Relax — you probably haven''t lost your mind or your Windows partition.
    What happened is that the Red Linux installation process mistakenly selected the
    recovery partition from which to boot Windows. Most computers now come with a
    preinstalled Windows recovery partition (rather than a recovery CD-ROM), so Red
    Hat Linux sees at least two Windows partitions when configuring GRUB, and it made
    the wrong choice. For example, you have hdal and hda2, and GRUB thinks that hdal
    is the Windows partition; hdal is the recovery partition, however, and hda2 is
    the Windows C: drive.


    You have to reconfigure GRUB to point to the correct Windows partition to make
    it work correctly. You may have this /etc/grub/grub.conf file for example:


    ```

    default=0

    timeout=10

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Red Linux (2.4.20-20.1)

    root (hd0,0)

    kernel /vmlinuz-2.4.20-20.1 root=LABEL=/1 hdb=ide-

    scsi

    initrd /initrd-2.4.20-20.1.img

    title DOS

    rootnoverify (hd0,0)

    chainloader +1

    ```


    Change the **rootnoverify** (hd0,0) parameter to **rootnoverify** (hd0,1) and
    reboot your computer. This technique should fix your problem.'
  merge: -1
