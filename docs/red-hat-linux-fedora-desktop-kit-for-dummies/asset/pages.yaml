  md: '# Part IV: Revenge of the Nerds


    ![](img/453364505e32ffec24f7d88ac7824962_289_0.png)


    > > The blind leading the blind Paul’s colleague Ken Hatfield once said, "One
    of the side benefits from lots of troubleshooting comes from what I call ‘the
    value of blind alleys.’ Most often in troubleshooting, you go down blind alleys
    or, in your tree example, the wrong branches of the solution tree. But in doing
    so, you learn something. In the future, when you encounter a different problem,
    that previous blind alley may be the road to the solution.” Well Here’s an example:
    Paul recently had a server that was having lots of problems. The /var file


    system had filled up, which caused some programs to fail. When space on /var was
    freed up, most of the programs started to do their jobs again. But one program
    didn’t work. Paul spent a long time trying to figure out why it didn’t work even
    after the problem was fixed. As it turned out this particular program’s real problem
    was that its license had expired. He had not only walked down a blind alley but
    also kept trying to go forward. D’oh!


    # # Ticking through Your Networking Checklist


    We describe in this section some common network problems and symptoms. We start
    with simpler network problems and move on to more complex ones. After cataloging
    the problems, we look at one of the branches of the fault tree to solve a problem.


    # Is the power turned on?


    First, verify that you turned on the power. It sounds simple, but, hey, sometimes
    the simplest things go wrong.


    # Is your network cable broken?


    Make sure that your network cables aren’t broken or cut. Check the connectors
    to make sure that they’re okay. You should also make sure that you’re using the
    correct network cable, which should be Category 5 (8-wire) straight-through cable.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Chapter 18: Bringing In the Red Hat Linux Repair Man


    # Is your Ethernet hub or switch working?


    Your Ethernet hub or switch should also be turned on. Ensure that the network
    cables are also connected securely.


    If you''re stuck in the Middle Ages (with us!) and are using that coaxial network
    cable named Thinnet or 10Base-2, for geeks — you don''t have to check an Ethernet
    switch or hub because you don''t have one. Thinnet connects NIC (computer and
    printer, for example) to every other NIC on the subnet. In other words, each computer
    that is on a Thinnet cable is connected electrically to all other computers in
    the network. If any part of that bus is compromised, all traffic ceases. For example,
    if you disconnect the terminator at either end of the cable, communication ends.
    The best way to troubleshoot type of problem is to start at one end and work your
    way down the line. Try to get just two computers working together, then three,
    and so on. Eventually, you find the problem.


    Determining whether your network cable has been compromised requires you to address
    these issues:


    +   - If you''re using Thinnet, make sure that the BNCs (Bayonet Nut Connectors)
    are securely attached.


    +   - Look at the interface between the cable and Ethernet switch or hub or the
    BNC connector, if you''re using Thinnet — to make sure that they''re in good physical
    contact. Sometimes, the cable can pull out a little and break the connection.


    +   - Look at the cable itself and make sure that it hasn''t been cut or crushed.


    +   - If you''re using Thinnet, make sure that each end of the cable has a 50
    ohm terminator attached to it. Thinnet must be terminated; otherwise, it doesn''t
    work right, just if it is broken. The reason is that the radio frequency (RF)
    signal reflects from the unterminated end and interferes with the incoming signals.
    If you have a spare cable that you know good, try substituting it. The idea is
    to eliminate as many segments that you''re sure about as possible. If you have
    two computers in close proximity and suspect a problem with the cable you''re
    using, all you can do is try another cable. If the computers are far apart and
    rely on several segments or a long cable, try moving them closer together and
    using one short segment. If you have three or more computers, getting just two
    of them working together. Then try adding another one. Proceed until you find
    the faulty segment.'
