  md: '# 134 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    Nautilus is the GNOME file and Internet navigator system. Nautilus follows the
    tradition of all good file managers by graphically displaying the files and directories
    on your computer. You can copy, move, delete, and execute files by pointing and
    clicking; creating directories and viewing file details are a snap too. Nautilus
    even goes a step further: You can use it to configure your GNOME desktop. And,
    that''s not all! Nautilus can also navigate the Internet, access multi-media applications,
    and slice and dice! It''s not a bad deal, considering that it works for free.


    # Waking up Nautilus


    Red Hat configures Nautilus to start automatically when you log in. Nautilus appears
    towards the end of the login process and works as a file manager (see Figure 10-1,
    which shows the contents of your home directory). If you want to start it manually
    — after you have closed it, for example — right-click anywhere on the desktop
    background and choose New Window.


    ![](img/453364505e32ffec24f7d88ac7824962_155_0.png)


    Figure 10-1: The Nautilus File Manager.


    The main menu follows familiar formats (File and Edit, for example) and does all
    the things you would expect those menus to do. The toolbar immediately below the
    main menu enables you to quickly move up one directory (Up) and skip back to previous
    menus (Back and Forward). It also lets you rescan a directory, to your home directory,
    and change the way icons are displayed.


    The Reload function is useful if you create to create a new file — for example,
    via a terminal emulator. The file does not show up in the File Manager until you
    move to another directory and return, or else reload.'
  merge: -1
