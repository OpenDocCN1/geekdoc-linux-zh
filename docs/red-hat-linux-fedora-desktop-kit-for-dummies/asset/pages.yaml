  md: "# Playing CDs\n\nEveryone wants a little music in their life. But you went\
    \ ahead and bought a computer rather than a stereo system. D'oh! No problem: It\
    \ happens that you indeed spent your money wisely because Red Hat Linux computer\
    \ functions well as a stereo system. This section describes how to set up your\
    \ computer to play music CDs.\n\nRed Hat bundles two open source CD players for\
    \ Linux users: CD Player and XMMS. We describe CD Player in this chapter because\
    \ it automatically starts when you insert a CD in your computer. (We don't ignore\
    \ XMMS, however, because we show you in Chapter 12 how to use it to play Internet\
    \ audio streams.\n\nAnyway, these steps show how to start playing music:\n\n+\
    \   1. Log in as any user and play a CD into the CD drive.\n   The GNOME CD Player\
    \ application appears.\n2. Listen as your CD starts playing.\n\nThose are the\
    \ easiest steps in this book. However, if you exit from CD Player, you have to\
    \ restart it manually (unless you insert another CD, in which case CD Player starts\
    \ automatically again). You can start CD Player by clicking the GNOME Menu button\
    \ and choosing Sound & Video>CD Player. Nothing to it!\n\nThe CD Player controls\
    \ should be familiar territory for anyone born in the 20th century. Here is a\
    \ quick refresh for those cavepeople out there:\n\n+   * To change the volume,\
    \ click the vertical slide bar on the right side of the CD Player window. Hold\
    \ the mouse button while you adjust the volume.\n* The crossed tools (a screwdriver\
    \ and wrench) button toward the middle-left area of the window, to open the Preferences\
    \ window. You can then select how CD Player reacts when you start and stop it.\
    \ You can also control the default CD device (the default is /dev/cdrom, but many\
    \ may want to change it to /dev/cdrom1, or other devices, depending on your computer\
    \ hardware). You can also select the theme of the CD Player skin. A simple system\
    \ is available too.\n* The remaining controls are self-explanatory: start, stop,\
