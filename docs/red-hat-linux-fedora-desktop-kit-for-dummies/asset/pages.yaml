    or coffee cup coaster. Whatever you use it for, we hope that you have had fun.


    # About This Book


    This book is designed to be a helping-hands tutorial. It provides a place to turn
    for help and solace in those moments when, after two hours of trying to get your
    network connection working, your dog bumps into the cable and it magically starts
    working.


    > Note: Red Hat Inc. has merged its Red Hat Linux distribution with the Open Source
    Fedora Core Project to create the new Fedora Core distribution. Red Hat sponsors
    and maintains editorial control over the project, while the public provides technical
    development and support. Although the book refers to the product as Red Hat Linux,
    it is the same product.


    We tried our hardest to fill up this book with the things you need to know about,
    as how to


