  md: '# Red Hat Linux Fedora For Dummies


    That line means to enter the command `chown` and press the Enter (or Return) key.
    The command is then executed.(Throughout this book, we say "press the Enter key"
    whenever you want to execute a command; the Enter key is synonymous with the Return
    key.)


    Commands not shown in the text, but set off on lines by themselves, like this:


    ```

    pwd

    ```


    Here''s a rundown of the command syntax in Linux:


    +   * Text not surrounded by `[ ]` or `( )` brackets must be typed exactly as
    shown.


    +   * Text inside brackets `[ ]` is optional.


    +   * Text in *italics* indicates the part of a command that must be replaced
    with appropriate text. You should not type verbatim the italicized part of a command.
    If we say "Enter the command **more somefile**, we mean for you to replace *somefile*
    with the name of the file you are interested in. For example, you may end up entering
    the command `more /etc/passwd`, where you substitute `/etc/passwd` for *somefile*.


    +   * Text inside brackets `( )` indicates that you must choose one of the values
    inside and separated by the `|` sign. For example


    +   * An ellipsis `..` means and so on or or to repeat the preceding command line
    as needed.


    Don''t concern yourself too much with these conventions for now. In most chapters
    in this book, you don''t need to know these particulars. When you do to know something
    about a particular syntax, come back to this introduction for a refresher course.


    # Keystrokes and such


    Keystrokes are shown with a plus sign between. For example, Ctrl+Alt+Delete means
    that you should press the Ctrl key, Alt key, and Delete key all at the same time.
    (No, we don''t make you press any more than three keys at the same time.)'
