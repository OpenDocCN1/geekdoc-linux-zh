- img_proc: true
  md: '# 222 Part VI: Appendices


    them, the truth is that they''re not terribly complex. When you break down the
    parts that make up a PC, you see that each part performs a specific task. The
    sum of the parts equals a computer. This list outlines the subsystems that comprise
    a computer:


    +   **Central processing unit (CPU):** The CPU, or microprocessor, is often referred
    to as the brains of a computer because the CPU controls, in minute detail, everything
    the computer does. CPUs are controlled by software that is essentially a recipe
    for doing tasks as simple as detecting keyboard input or as complex as communicating
    across networks to display pictures in a web browser.


    The most common CPUs are now Intel Pentiums, which you''re using to run your PC.
    Generally, the faster the CPU, the faster your computer. CPU speed is measured
    in megahertz (MHz), which means millions of cycles per second. To perform complex
    tasks such as sending e-mail, a CPU has to perform many simple tasks, or instructions,
    in order to complete the larger one. Although the simplest instructions require
    a single CPU cycle, however, the MHz measurement is a reasonable measure of how
    fast a microprocessor runs.


    +   **Hard disks:** Hard disks—also referred as hard drives—store all the information
    on a computer. Hard disks are metal platters that store bits and bytes in tiny
    magnetic domains (spots). The disk spins, and a magnetic head that floats on a
    cushion of air reads and writes from the disk. The spinning disk allows the head
    to quickly access any location on the disk and also creates the air cushion.


    +   **Disk controllers:** The disk controller connects the drive to the computer''s
    microprocessor. Several types of controllers are commonly used: IDE, USB, FireWire,
    and SCSI. Most PCs come with IDE internal hard drives. Higher-performance computers
    tend to use SCSI-based drives because they''re faster (and more expensive). IDE
    controllers can connect as many as four drives.


    +   **CD-ROM:** CD-ROMs store information like hard drives do, but in optical
    rather than magnetic form. Most PCs use IDE-based CD-ROMs. SCSI CD-ROMs are faster,
    just like SCSI hard disks. Because the prices of USB and FireWire CDROMs are dropping
    fast, they''re becoming more common.


    +   **RAM, or Random Access Memory:** RAM is much faster than hard disks and CD-ROMs.
    Because RAM is used to store temporary information, programs, data, and other
    types of information are stored in RAM—it "forgets" everything when power to the
    computer is turned off. RAM is measured in megabytes (MB). A megabyte is roughly
    one million bytes.


    +   **Mouse:** Which type of mouse do you have—bus, PS/2, or serial? How many
    buttons does it have? If you have a serial mouse, which COM port is it attached
    to, and which protocol (Microsoft or Logitech) does it use?'
