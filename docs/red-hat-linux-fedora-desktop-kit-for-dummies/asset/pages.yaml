  md: '# Chapter 21: Ten Security Vulnerabilities 313


    Use passwords that don''t use any word found in a dictionary. Simple words of
    any language are extremely easy to crack. For example, don''t use the password
    redhat80. Instead, you can change the e in red to 3 and the a to @. Your password
    becomes r3dh@80, which means that the cracking software has to use brute force,
    rather than a mere dictionary search, to discover it.


    # Scan Me


    Information is king when it comes to people hacking into systems and keeping them
    out. Hackers use knowledge about your computer and network to break into your
    systems. One common and powerful tool for gaining information about which type
    of operating system you have and the services it runs is nmap. This port-scanning
    tool can discover a wealth of information about individual computers and networks.


    Nmap is included in the Red Hat Linux distribution. Install it by logging in as
    root, mounting the DVD (insert the DVD into the DVD/CD-ROM drive), and entering
    this command:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/nmap*

    ```


    You can scan yourself, or any computer on your private network (if you have one).
    If you''re logged into cancun, for example, you can run this command:


    ```

    nmap localhost

    ```


