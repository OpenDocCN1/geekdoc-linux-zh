    ```

    wine notepad.exe

    ```


    Running the Wine program — for example, wine notepad.exe — for the first time
    creates a .wine directory in your home directory. The .wine directory contains
    all the configuration information that the Wine system needs in order to run.
    The configuration information is contained in the config file. Several additional
    files — all with the .reg suffix — mimic the Windows Registry. The Windows operating
    system uses the Registry to organize its configuration parameters; Linux on the
    other hand,


