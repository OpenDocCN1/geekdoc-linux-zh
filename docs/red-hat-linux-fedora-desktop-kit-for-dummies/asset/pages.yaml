  md: '3. Enter your username and password.


    4. Enter the help command at the sftp prompt.


    You see a list of sftp commands. The ones you use most are cd, lcd, dir, ls, get,
    and put. These commands work in similar fashion to their Linux equivalents.


    Using sftp is self-explanatory. Use get to transfer a file, directories or others
