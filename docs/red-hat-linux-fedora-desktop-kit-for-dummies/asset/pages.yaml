  md: '# Chapter 5: Dial-Up Modems Still Get the Job Done


    # Locating Your Modem with Linux


    Linux uses device files to communicate with peripherals. Device files occupy the
    /dev directory and are somewhat equivalent to Windows drivers: You need them so
    that your hardware works.


    Your modem can connect to one of four serial ports available on your PC. A serial
    port is the mechanism your computer uses to communicate with a device, such as
    a modem. An external modem is generally connected to port /dev/ttyS0 or /dev/ttyS1,
    although configuring it as /dev/ttyS2 or /dev/ttyS3 is possible. If you have an
    internal modem, it can be any one of the tty devices.


    During the boot process, Red Hat Linux provides the kudzu utility, which automatically
    tries to locate new devices on your system. The kudzu utility is good at detecting
    equipment like modems (both internal and external). When kudzu detects a new device,
    it prompts you to configure the device, and you should let it do.


    If the Linux hardware detection system kudzu cannot find your modem during the
    boot process, the process of elimination; it''s crude, but effective. The following
    two numbered lists describe how to find your modem. The first method, for an external
    modem, involves sending a string of characters to the modem and watching for the
    light-emitting diodes (LEDs) to light up. The second method is for internal modems,
    which don''t have LEDs, so you have to use the hideoous screeching sound of your
    modem to track it down.


    To use kudzu to find an external modem, follow these steps:


    +   1. Open a terminal emulator window by the clicking GNOME Menu button and choosing
    System Tools: Terminal.

    2. Run this command from a command prompt in the terminal:

    echo "anything" > /dev/ttyS0

    Hestly, it doesn''t matter what you put between the quotation marks in the preceding
    commands. It just has to be some text.


    If your modem is connected to the target serial port, you see the send-receive
    LEDs (sometimes marked as RX/TX) light up in a short burst.


    +   3. In the unlikely situation that your modem isn''t found, trying the string
    to /dev/ttyS1, /dev/ttyS2 and finally, to /dev/ttyS3 by altering the number at
    the end of the command in Step 1 to match the port you''re targeting.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# 74 Part II: Got Net?


    Life is a bit harder if you have an internal modem because you don''t have a visual
    response. You can, however, listen to the modem''s speaker to find out what''s
    going on. Follow these steps:


    +   1. Open a terminal emulator window by clicking the GNOME Menu button and choosing
    System Tools✜ Terminal.


    +   2. Enter this command at a command prompt:

    echo `atdt55555309` > /dev/ttyS0


    If you hear the modem pick up and dial, you have won the game of hide-and-seek
    and know which device the modem is connected to. You can skip to Step 4.


    +   3. If you don''t hear anything, make sure that you have the speaker turned
    on by entering the following command and then retry Step 1:

    echo `atv` > /dev/ttyS0


    If you hear the modem pick up and dial, skip to Step 4.


    +   4. If you still can''t hear anything, try using the other serial ports by
    trying again, substituting ttyS1, ttyS2, and ttyS3 in the command.


    +   5. After your modem is found, send this command to the modem to kill the connection:

    echo `atz` > /dev/ttyS0


