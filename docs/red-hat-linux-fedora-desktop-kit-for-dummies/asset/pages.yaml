    # Introducing password etiquette


    Your password must be at least six characters long, but you should use at least
    eight characters: The more characters you use, the harder the password is to be.
    If you''re concerned about security, we recommend that you use a combination of
    uppercase and lowercase letters, symbols, and numbers to make your password as
    difficult as possible to compromise. In addition, don''t choose anything you can
    find in a dictionary or names that are easy to associate with. In other words,
    your name, your name spelled backward, your birthday, your dog''s name, or any
    word in any language are all poor choices. Beer, for example, is a poor selection
    for Jon''s password, even though it has both uppercase and lowercase letters,
    because Jon and beer are usually seen in close proximity with each other.


    A good way to come up with a good password is to select a phrase and destroy it.
    For example, make “I am not a number” into something immune. Even though the result
    doesn''t spell out in the phrase any way, it gives you the essentially random
    characters (“I” = “am”, “not” = “Not”, “a” = “u”, and number = #). Other common
    substitutions are 3 for a, 9 for g, 1 for b, and 5 for s. In this way, you can
    create passwords with s0utbhb4y (southbay) and 14mn0qt4g33k (iamnotagk).


    Also, be sure to write down your password where it won''t get lost or easily found
    or stolen. Save your work passwords at home or store them in a locked desk or
    safe. Do not write your password on a sticky note and attach it to your computer
    monitor!


