    The following list describes the process for getting an ADSL connection working.(Please
    note that we use the generic acronym DSL interchange with ADSL. Most consumer
    DSL connections are really ADSL, and that''s the type of connection we describe
    in this chapter.)Follow these steps to set up DSL service:


    +   1. Find a DSL provider.


    You need to find out whether you live or work close enough to the DSL provider''s
    equipment to get a connection. DSL providers check your address and tell you they
    can take your business.


    +   2. Connect your DSL modem to your telephone jack and your computer.


    Your DSL modem acts as the intermediary between your computer and your DSL service
    provider. You must connect one to the phone jack and the other to your computer''s
    Ethernet NIC.


    +   3. Configure your Red Hat Linux computer to communicate with the DSL modem.


    Your Red Hat Linux computer connects to the DSL modem via an Ethernet NIC. You
    must configure your Ethernet NIC to work with the modem.


    +   4. Set up the DSL modem and administrative passwords.


    DSL뎀 provide a reasonable level of security. You should take advantage of this
    security by assigning your own password to the modem. That action prevents hackers
    from breaking into your modem and causing problems.


    +   5. Set up your ISP PPP account name and password.


    You must authenticate your DSL modem to your ISP. DSL connections get logged on
    to your ISP just like traditional analog modems. You configure your DSL modem
    with your ISP username and password.'
