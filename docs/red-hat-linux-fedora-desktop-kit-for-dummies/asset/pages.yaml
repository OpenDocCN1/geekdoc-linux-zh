    # The DSL Option


    The world is wired — for telephones, that is. DSL modems take advantage of this
    old, but by common, technology to provide a high-speed Internet connection to
    consumers. The DSL option uses special equipment to pump much more data through
    the POTS lines than a traditional analog modem.


    The telephone system is referred to as plain old telephone service (POTS) in the
    telecommunication industry.


    DSL provides high-speed Internet connections by electronically converting your
    computer''s digital information into a form that can be transmitted from your
    home or business to the telephone company. When your data finds its way to the
    telephone company, it''s converted into another form and sent to your ISP.


    DSL uses frequencies in the millions of cycles per second — the megahertz (MHz)
    range compared to traditional analog modems, which work with signals in the thousands
    of cycles per second (KHz). You get much higher connection speed when you use
    higher frequencies. The problem is, however, that the telephone system wasn''t
    designed to work with higher frequencies.'
