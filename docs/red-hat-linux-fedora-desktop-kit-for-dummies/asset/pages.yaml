  md: '# 296 Part V: The Part of Tens


    # Books and more books


    When we were working with computers many years ago, the number of books about
    computers could fill more than one bookshelf, and they were mostly about the electronics
    of the hardware itself. Networking books concentrated on such subjects as the
    probability of two Ethernet packets colliding and not how to build simple networks.
    Hardly any books about computers were ever in the popular bookstores. Thousands
    of books about computers are available now; most describe the software and its
    interactions, with the hardware taking a back seat. Books like the ones in the
    For Dummies series aren''t just for bookstores you more. You can also find them
    in mass-market venues, such as your local bookstore.


    One great source for information about For Dummies books is the television series
    The Simpsons. That loves For Dummies authors in particular and provides an amazingly
    accurate portrait of us. D''oh!


    Perhaps you looked at other books before you bought this and were intimidated
    by their use of technical terms. Or, you thought that the other books were too
    general for what you want to do and you want something more task oriented. You
    may want to look over those books again because your knowledge level should be
    higher after reading this book. TCP/IP networking, compiler design, operating
    system theory, formal language theory, computer graphics, and systems administration
    training are all topics you can study in greater depth when you have a Linux computer
    at your disposal.


    Many books specifically about the Unix operating system are partially or completely
    applicable to Linux, such as books about Perl, a comprehensive interpreter. By
    getting one (or more) books about Perl and sitting down with your Linux system,
    you have both a new tool for doing your work and a new appreciation for a complete
    programming language. If you want to find out how to write Perl, you can just
    view the source code.


    # Linux HOWTOs and Red Hat manuals


    Don''t forget about the Linux HOWTOs, which come in the commercial version of
    Red Hat Linux. These excellent guides to Linux are covered under the Linux Documentation
    Project (LDP) copyleft, which means that you can print them.


    Red Hat also provides online versions of the manuals you get when you purchase
    your full distribution. Look at www.redhat.com/docs/manuals/linux/RHL-10-Manual
    for information about nearly every aspect of Red Hat.


    ![](img/453364505e32ffec24f7d88ac7824962_317_0.png)'
