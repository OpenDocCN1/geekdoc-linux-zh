  md: '# 204 Part IV: Revenge of the Nerds


    Going wireless means


    +   - Not having to string cables around your house or office: You don''t have
    to spend money and time pulling wires through walls, ducts, attics, and cells,
    for example. (The authors have enjoyed all these activities.) You also save the
    cost of the cables themselves.


    +   - Geographical freedom: You have the freedom to use your computers anywhere,
    regardless of where your server or Internet gateway or printers are located. Ah,
    life is easier when you can sit out on a nice day and clavier away at the keyboard.


    +   - Looking good: You can use high-tech even if you''re not. You can impress
    your friends and family.


    The process of constructing a wireless network is straightforward. You have to
    decide how to connect your wireless devices to your private network. You can do
    that in two ways:


    +   - Use a wireless access point: A wireless access point (WAP) is a device through
    which wireless devices communicate. An access point provides a single point of
    contact through which all other devices communicate.


    An access point uses network connections. One is an Ethernet port that connects
    to your private LAN through a Cat 5 Ethernet cable, and the other point connects
    to your wireless devices. The access point serves as a common connection point
    to your LAN.


    +   - Point-to-point (ad-hoc) communication: Contrary to popular opinion, you
    can create a wireless network without an access point. Wireless NICs are designed
    to communicate directly with each other as well as through an access point. You
    configure each NIC to know a common network name and a common encryption key,
    and the NICs form their own ad hoc network by communicating directly with each
    other. We show you how, later in this section.


    Point-to-point communication is referred to as ad hoc mode. The term ad hoc means
    that you put something together with what you have in whatever way you can. Using
    wireless ad hoc mode means that each wireless device can communicate with the
    other wireless devices. (Setting up a network with wireless NICs is less expensive
    than using WAPs.)


    You can purchase an access point to construct your wireless LAN. That''s simple
    and quick, at a little expense. If you choose that route, it leaves up to you
    to follow the access point''s instructions for connecting other computers to it.
