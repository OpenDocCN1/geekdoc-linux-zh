  md: '# In this part...


    After you have created your Red Hat Linux workstation, it''s time to get to work.
    The chapters in this part show three different ways to connect to the Internet:
    the traditional, slow dial-up (analog) modem; a fast broadband DSL or cable modem;
    or an existing Local Area Network (LAN) that''s connected to the Internet.


    Chapter 5 concentrates on telephone-based modems. Modems are much like old, reliable
    pick-up trucks: They may not be the fastest way of getting somewhere, but they
    still get you there. In fact, modems provide the simplest, most economical and
    effective Internet connection.


    Chapter 6 introduces broadband Internet connections. Telephone, cable, and other
    types of companies now provide broadband service to many communities. For not
    altogether unreasonable prices, you can get high-speed, always-service.


    Many people have access to existing computer Local Area Networks (called LANs)
    at work, school, and home. Chapter 7 shows how to connect your computer to a LAN,
    and if your LAN has an Internet connection, you can find out how to configure
    your workstation to use it.


    Your computer becomes vulnerable after you connect to the Internet. This statement
    is especially true if you use a service, such as DSL, that is constantly connected.
    The difference is similar to living on a quiet street versus a busy one. You''re
    more vulnerable on the busy street. That''s why we show you in Chapter 8 how to
    build a firewall.'
  merge: -1
