  md: '# Chapter 3: Ready, Set, Install!


    ![](img/453364505e32ffec24f7d88ac7824962_58_0.png)


    Linux disk partitions are analogous to Windows disk partitions. The well-known
    C: drive is placed on a disk partition. The Linux equivalent is the root (/) partition.
    The two operating systems use different terminology, and the analogy isn''t perfect,
    although the concept is the same.


    Follow these steps to continue the installation:


    +   1. Select the Workstation option in the Installation Type window and then
    click the Next button.


    The Partitioning Setup window appears. The Red Hat installation system must partition
    your hard drive in order to install its software. Partitions divide a hard drive
    into one or more parts. The divisions are used to organize the software and data
    (user files, for example) that comprise the operating system.


    Red Hat has two partitioning methods: automatic and manual. The manual method
    uses the Red Hat Druid utility. Using the Disk Druid requires you to make several
    decisions to select your partitions, so we use the automatic method, which is
    simpler to use. The automatic method is easier to use, and we recommend it unless
    you''re lucky (or want to experiment or have the experience of manually partitioning
    your hard drive).


    +   2. Select the Automatically Partitioning option and click the Next button.


    If you''re using a new disk that has never been partitioned or your existing disk''s
    partition table has become corrupted in some way, a Warning dialog appears.


    +   3. Click the Yes button and a new partition table is created. (Selecting No
    stops the installation process and reboots your computer.)


    The Automatic Partitioning window appears. You have three options:


    +   Remove all partitions on this system: This option leaves any Windows partitions
    (FAT, VFAT, and NTFS) unmodified while erasing any existing Linux partitions.
    Use this option if you''re reinstalling Red Hat Linux (in either a dual boot or
    solo configuration).


    +   Remove all partitions on this system: This option is the most dangerous because
    it erases everything on your hard disk. Use this option only if you''re absolutely
    sure that you don''t have, or don''t want to save, anything on your disk. Your
    new Red Hat Linux installation is the only operating system on the hard disk if
    you use this option.


    +   Keep all partitions and use existing free space: Use this option if you used
    the nondestructive repartitioning (using FIPS, Norton Ghost, or PartitionMagic,
    for example) described in Chapter 2 to shrink your Windows partition.'
