  md: '# Appendix E: Revving Up RPM 351


    ![](img/453364505e32ffec24f7d88ac7824962_372_0.png)


    Be sure that you really want to get rid of the package because when you remove
    a package, it''s gone — as in gone. Okay, okay, okay, maybe we''re being a little
    dramatic. You can always go online to a site like www.freshmeat.net or www.redhat.com.
    From there, you can download more packages to install. We recommend that you do
    so. Some new tool is always coming out that can help optimize your Red Hat Linux
    computing experience.


    # Manual Shifting with RPM


    The first part of this chapter concentrates on using Red Hat Package Manager to
    install and remove packages. But you also have the option using the rpm command.
    You can use rpm to install, update, remove, and query packages. This section provides
    examples of how to use the manual rpm command.


    # Manually installing and upgrading packages


    The -i parameter indicates that an installation will take place. You can add Verbose
    mode (which provides additional information) by using the -v option. (You can
    combine options into a single group; for example, -i -v can become -iv.) Follow
    these instructions to install and upgrade packages:


    +   1. Log in as root.


    +   2. Open a terminal emulator window by clicking the terminal icon in the GNOME
    Panel (refer to Chapter 4 for instructions).


    The GNOME Terminal window opens.


    +   3. To add the package, type this command from a terminal window:


    ```

    rpm -iv /mnt/cdrom/RedHat/RPMS/mozilla-mail*

    ```


    Alternatively, you can upgrade a package that has already been installed on your
    system. Substitute the RPM upgrade option, -U, in place of the install option,
    -i. For example, this command updates the Mozilla E-mail package:


    ```

    rpm -U /mnt/cdrom/RedHat/RPMS/mozilla-mail*

    ```


    The files that constitute the newer Mozilla-mail package overwrite the older version.
    Existing configurations, however, are saved by adding the .rpmsave suffix to the
    configuration file.'
