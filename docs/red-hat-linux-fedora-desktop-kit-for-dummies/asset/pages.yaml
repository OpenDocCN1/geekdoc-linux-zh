- img_proc: true
  md: '# 232 Part IV: Revenge of the Nerds


    You can use any available DNS server on the Internet. For example, you can use
    Albuquerque''s finest ISP Southwest Cyberport DNS server, 198.59.115.2, from anywhere
    on the Internet. You should use your own ISP''s servers because it has fewer routers,
    or hops, to go through, which results in better reliability and speed.


    ![](img/453364505e32ffec24f7d88ac7824962_253_0.png)


    +   4. Linux requests the IP address for www.redhat.com from the name server.


    +   5. If the name server doesn''t know the IP address of www.redhat.com, it asks
    a root server for the address of an authoritative name server for the redhat.com
    domain.


    +   6. The root server returns the address of the Red Hat authoritative name server,
    the first of which is nsl.redhat.com (66.187.233.210).


    +   7. The name server asks nsl.redhat.com for the address of www..


    +   8. The name server nsl.redhat.com returns the www.redhat.com address.


    +   9. Using the numeric www.redhat.com IP address, your browser starts communicating
    with the web server.


