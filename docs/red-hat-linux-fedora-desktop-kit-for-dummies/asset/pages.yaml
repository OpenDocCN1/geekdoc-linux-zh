    # Understanding IP forwarding and network address translation (NAT)


    An Internet gateway requires a Linux computer that has two network connections.
    You need one Ethernet or wireless NIC to connect to your LAN. The other network
    connection is used to make the Internet connection; this connection may be a traditional
    telephone-based modem, a DSL modem, or a cable modem. You use an Ethernet NIC
    to make the second connection.


    Suppose that you open Mozilla on the sample Red Hat Linux computer Cancun (with
    the IP address 192.168.1.1) and enter the URL redhat.com. Network packets bound
    around your LAN and then fly out to the Internet (and back again), and Mozilla
    ends up displaying the Red Hat Web page.


    Lots of things have to happen to make all these things work. Here''s a simplified
    version of how it works:


    +   1. Mozilla asks to look up the address — via the Domain Name Service (DNS)
    — which translates www.redhat.com to the numeric IP address 66.187.232.56.


    +   2. Linux compares the IP address to its internal routing table. The operating
    system directs network traffic to the default route if the address doesn''t match
    its local networks. In other words, if the IP address belongs to a machine on
    the private network, Linux directs its communication to the Ethernet device connected
    to the LAN. However, if the IP address is external to the LAN, Linux forwards
    the packets to the appropriate router.'
