    meaning of certain funny-looking symbols.


    # Typing code


    We show you how to use graphical interfaces to run most of the programs, utilities,
    and applications we describe in this book. Sometimes, however, running commands
    from a text-based interface is better or necessary. In Chapter 4, for example,
    we describe how to start a terminal emulator in which to run the command. In anticipation
    of running text-based commands, we describe the conventions we use.


    When you see filenames, directories, commands, and parameters in the text, they''re
    formatted in `monospace type`. That helps differentiate those items from the general
    text.


    When you see words in boldface, they indicate something you would type; for example:


    ```

    Type `man chown` at the command prompt and press Enter.

