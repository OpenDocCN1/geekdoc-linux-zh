    \ and want to execute it (and assuming that you have set the permission bits to\
    \ make bark executable by you). You have a couple of choices (although you have\
    \ more than two choices, we list the safest ones). One choice is to type this\
    \ line on the command line:\n\n```\n./bark\n```\n\nThis line tells Linux to look\
    \ in this directory (/) and execute bark.\n\nYour second choice is to move bark\
    \ to one of the directories in the PATH variable, such as /usr/local/bin, and\
    \ then enter bark at the prompt again.\n\n# # I don't know how to make the X Window\
