  md: '# 336 Part VI: Appendixes


    # Removing files and directories


    The command for removing, or deleting, a file is rm. Using rm is straightforward.
    Create a dummy file to erase:


    ```

    touch junk

    ```


    You can delete the file with this command:


    ```

    rm junk

    ```


    You have removed the dummy file from the current directory. To remove a file from
    another directory, you need to provide a relative filename or an absolute filename.
    if you want to expunge now from the veracruz directory, you type like this:


    ```

    rm ../veracruz/now

    ```


    You can use metacharacters (similar in many ways to Windows wildcards) with rm,
    but be careful if you do so! When files are removed in Linux, they are gone forever
    — kaput, vanished — and cannot be recovered.


    This command removes everything in the current directory and all directories under
    it that you have permission to remove:


    ```

    [lidia@cancun ~]$rm -r *

    ```


    Do not give command as root (the superuser!) You should be careful when running
    any command as root, but be especially careful with commands that can erase entire
    directories and file systems.


    To decrease the danger of removing files inadvertently when you use metacharacters,
    be sure to use the -i option with rm, cp, mv, and various other commands. The
    -i option, which makes interactive, lists each filename to be removed (with the
    rm command) or overwritten (with the mv or cp command). If you answer either y
    or Y to the command, the file is removed or overwritten, respectively. If you
    answer anything else, Linux leaves the file alone.


    You can remove not only files but also directories. Suppose that you have an old
    directory, /tmp/junk, you don''t need any more. You can remove it and all its
    contents:


    ```

    [lidia@cancun ~]$rm -rf /tmp/junk

    ```


    Giving the rm command these options (r and f) removes the /tmp/junk directory
    and all files and directories under it. The r option means to remove recursively,
    in recursion, the command works through every subdirectory in the parent directory.
    The f option issues the command forcefully. No prompts are


    ![](img/453364505e32ffec24f7d88ac7824962_357_0.png)


    ![](img/453364505e32ffec24f7d88ac7824962_357_1.png)


    ![](img/453364505e32ffec24f7d88ac7824962_357_2.png)'
