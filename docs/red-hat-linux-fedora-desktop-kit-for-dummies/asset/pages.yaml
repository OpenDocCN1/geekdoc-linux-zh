  md: '# 272 Part IV: Revenge of the Nerds


    Your wireless network should work as long as you set these parameters correctly
    and your computer is within range of the other devices on your LAN. The other
    parameters are either self generating or unimportant in getting the card to work.


    # Maybe the physical connections aren''t set up right


    If you don''t see the line containing lo, which is the loopback interface, or
    eth0, which is your network adapter, your physical network connections aren''t
    set up right. The loopback interface isn''t a physical device; it''s used for
    the network software''s internal workings. The loopback interface must be present
    for the network adapter to be configured.


    If the loopback interface isn''t present, type this command:


    ```

    ifconfig lo 127.0.0.1

    ```


    If the network adapter — generally an Ethernet card — isn''t present, type this
    command:


    ```

    ifconfig eth0 192.168.1.1

    ```


    Because this address is a class C network address, ifconfig automatically defaults
    to the 255.255.255.0 netmask. If you have an unusual network, which you shouldn''t,
    type this command:


    ```

    ifconfig eth0 192.168.1.1 netmask 255.255.255.0

    ```


    Type ifconfig and your network adapter should be displayed correctly. If it isn''t,
    examine the manual page on ifconfig. You display this manual page by typing this
    command and then pressing Enter:


    ```

    man ifconfig

    ```


    You can page through the document in several ways: Press Enter to go line by line,
    press the spacebar to go forward one page at a time, press Ctrl+B to go backward,
    or press Q to quit. The ifconfig man page shows a great deal of information about
    what ifconfig is and how it works. If you''re still having problems, look at the
    Linux startup information by running this command:


    ```

    dmesg | more

    ```


    Note that you pipe (use the | symbol) the output from dmesg to the more command.
    Linux pipes are used to transmit the output command to the input of another. After
    you run the preceding command, you see the information that was displayed during
    the boot process. The more command shows one page of information at a time; press
    the spacebar to display each subsequent page.


    ![](img/453364505e32ffec24f7d88ac7824962_293_0.png)'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Chapter 18: Bringing In the Red Hat Linux Repair 273


    # Maybe you have a hardware problem


    If you don''t see your Ethernet adapter, you may have a hardware problem. Check
    your adapter. Reseat it (take it out and put back in) and see whether it works.
    If not, you probably need a new NIC. If you see the NIC, look inside the Linux
    kernel and see which devices it has. Type this command to change to a special
    directory named /proc/, where process information is located:


    ```

    cat /proc/devices

    ```


    You should see a line with your network adapter listed. If you don''t, Linux doesn''t
    know that it exists.


    Try to run your Ethernet NIC again. If it still doesn''t run, you have to find
    out more information.


    # Maybe you have an interrupt or address conflict


    You may have an interrupt or address conflict. Look at the list of interrupts
    and then the I/O addresses of all the devices that the kernel knows about, by
    typing these commands:


    ```

    cat /proc/interrupts

    cat /proc/ioports

    ```


    The I/O address is the location in memory where the device, such as the network
    adapter, is accessed by the microprocessor (for example, your Pentium chip). The
    interrupt communicates to the microprocessor that it should stop whatever it''s
    doing in order to process information that has arrived at the device sending the
    interrupt.


    When your Ethernet adapter receives a packet, it sends an interrupt to the microprocessor
    to signal that an event has occurred. Your Pentium stops what it''s doing and
    processes the new information. The microprocessor even interacts with Linux to
    do the processing.


    Type cat /proc/interrupts to show both the interrupts and the I/O addresses with
    Red Hat Linux is familiar. The output should look like this:


    0: 378425 timer

    1: 1120 keyboard

    2: 0 cascade

    10: 16077 3c509

    13: 1 math error

    14: 63652 + ide0


    This listing shows that the Ethernet NIC (3c509) exists. That''s a good sign.


    ![](img/453364505e32ffec24f7d88ac7824962_294_0.png)'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# 274 Part IV: Revenge of the Nerds


    Typing cat /proc/iports shows the input-output ports used by Red Hat Linux to
    interact with the computer''s devices. This output shows the I/O ports used on
    this computer:


    ```

    0000-001f : dma1

    0020-003f : pic1

    0040-005f : timer

    0060-006f : keyboard

    ```


    Look for your network adapter. In this case, it''s 3c509. If the adapter is working,
    you shouldn''t have any conflicts. If the I/O ports of two devices overlap, a
    conflict exists and you have to reconfigure the adapter. Run your Ethernet NIC
    configuration program and set the adapter''s parameters in EEPROM. Older adapters
    may have jumpers or little switches, called DIP switches, If you think you have
    to do this, remember to write down all the other devices'' interrupts and I/O
    addresses so that you don''t end up conflicting with something else.


    # Perhaps you have a funky kernel


    You may be using a kernel that doesn''t have networking installed. This situation
    is virtually impossible with Red Hat Linux 10 because the kernel automatically
    loads networking — and other modules — on demand (it''s mature technology). But
    go ahead and look at these files to gain an understanding of how Linux works.


    Display the networking devices by typing this command:


    ```

    cat /proc/net/dev

    ```


    If you don''t see the Ethernet interface, you may have an unsupported network
    adapter or a defective or misconfigured one. The Red Hat Linux kernel, by default,
    automatically loads modules as they''re needed. You can look back at the results
    of your boot process using the dmesg command. Look for a message that says delaying
    eth0 configuration. This message likely means that Linux wasn''t able to load
    the network adapter module or that the adapter isn''t working.


    Display the information about your devices using the cat /proc/net/dev command.


    The next step is to make sure that your network routing is configured correctly.
    This area is another spot where you can easily get confused. You don''t have to
    set up routing outside your LAN yet, but Linux needs to know where to send packets
    on its own network. Look at your routing table by typing this command:


    ```

    netstat -nr

    ```'
  merge: -1
