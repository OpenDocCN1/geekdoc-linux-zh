  md: '# # Chapter 3


    # # Ready, Set, Install!


    **In This Chapter


    +   - Deciding which Red Hat Linux installation type to use

    - Starting the Red Hat Linux installation process

    - Automatically selecting Linux partitions

    - Configuring your network

    - Configuring your system options

    - Going beyond the point of no return

    - Configuring your graphics system

    - Finishing the installation


    Installing Red Hat Linux 10 isn''t rocket science — it''s more like astrophysics.
    No, no — just kidding. Don''t run — relax, sit down, grab your favorite drink,
    and contemplate the fun you will have installing Red Hat Linux. After you''re
    done, you will have a powerful computer that''s capable of performing most, if
    not all, of your daily computing chores — all for the cost of this book! That''s
    pretty amazing when you think about it: For a few dollars, you get the same amount
    of operating power that cost megabucks just a few years ago.


    This chapter walks through the process of installing Red Hat Linux. The process
    involves inserting the companion Red Hat Linux DVD-ROM disc, pow-ering on your
    computer, and answering some questions.


    This book comes with a companion DVD-ROM disc that contains the entire Red Hat
    distribution. The single DVD-ROM replaces several CD-ROMs and reduces the need
    to continually swap CD-ROMs during the installation process; it also makes installing
    the software easier by eliminating the need to find the particular CD-ROM that
    contains the needed package. If your computer can''t handle DVD-ROMs, however,
    you can obtain the Red Hat distribution on CD-ROMs by mailing the coupon in the
    back of this book.


    The Red Hat Linux installation process has a point of no return. That time comes
    toward the end of the configuration process, after which the disks are partitioned
    and the software is written to your hard drive (see the later section "Installation
    Stage 5: The Point of No Return”). If you stop at or before that point, you save
    whatever operating system (or systems) exists on your computer.


