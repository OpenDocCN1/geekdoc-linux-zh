  md: '# Using Evolution for your e-mail


    Red Hat uses Evolution as its default e-mail client. Evolution makes it easy for
    you to configure one or more e-mail accounts. These steps describe how to configure
    Evolution to send messages to and receive messages from your e-mail account:


    +   1. Log in to your Red Hat Linux computer as a regular user (not root) and
    click the Evolution Email icon on the left side of the GNOME panel the first time
    you start Evolution, the Setup Assistant (wizard) opens.

    2. Click the Forward button. Enter your name and e-mail address in the appropriate
    text boxes in the Identity window and click the Forward button.

    3. You can optionally enter your organization and signature file (a file where
    you keep personal or business information to be appended to the end of every message
    you send).

    Figure 10-2 shows some sample entries in the Identity window.

    The Receiving Mail window opens.

    4. Click the Server Type drop-down menu and choose the option that matches your
    ISP''s e-mail system. Most ISPs use the Internet Message Access Protocol (IMAP)
    server type.

    The Receiving Mail window expands so that you can enter more information about
    your ISP''s e-mail system.

    5. Enter the host name of your ISP''s e-mail server and your ISP username. Figure
    10-3 shows a sample screen in this window.

    Your ISP provides you with the name of your incoming and outgoing e-mail servers
    when you first subscribe. You need to enter the incoming server name in the Host
    box. For example, your ISP incoming server may be mail.mysisp.com or imap.mysisp.com.

    Your ISP username may be different from your username on your Linux computer.
    For example, your ISP username may be based on your first initial and last name
    — garagon — but your home Linux computer user-name may be just your first name
    — gabe.

    6. Click the Forward button.

    The Receiving Email window opens.

    You can change options, such as having Evolution automatically look for incoming
    messages, by selecting the Automatically check for new mail option.

    7. Make any necessary changes and click the Forward button.

