  md: '# 298 Part V: The Part of Tens


    # User groups


    User groups are springing up all over the country. Some are more active than others,
    but most hold meetings at least once a month. Some groups are Linux only; others
    are connected to a larger computer group — either Unix or a more general computer
    users'' association. User groups offer a great opportunity to ask questions. User
    groups also tend to stimulate new ideas and ways of doing tasks.


    You can find whether a Linux user group is in your area by checking with GLUE
    (Groups of Linux Users Everywhere), a service run by Specialized Systems Consultants,
    Inc. (SSC), which publishes Linux Journal. You can find GLUE, an automated map
    of user groups, at www.ssc.com.


    When you arrive at the site, click the Resources link, which takes you to the
    Linux Journal site. Then check out the Resources area there, to find out the user
    group closest to you meets.


    ![](img/453364505e32ffec24f7d88ac7824962_319_0.png)


    No user group in your area? Post a message at your local university or college
    saying that you want to start one; other people in your area may decide to join
    you. Terrified at the thought of trying to start a user group? Group leaders often
    aren''t the most technically knowledgeable members but are simply good planners.
    They organize the meeting space, find (or hound) speakers, send out notices, locate
    sponsors, arrange refreshments (usually beer), and perform other organizational
    tasks. Sometimes, the leader seems like a thankless job, but when a meeting goes
    really well, it makes all the work worthwhile. So, as a newbie to Linux, you may
    not know a grep from awk, but you may still make a good chairperson.


    # Fixing Common Problems


    This section describes how to fix several common problems. Each of the following
    sections outlines the problem and then describes the solution.


    # "I forgot my password"


    Problem: You have to remember a billion passwords at work and home. Unfortunately,
    you can''t remember your Linux password.


    Solution: The solution is simple if you have forgotten a user account password
    but still remember the root password. In that case, simply log in as root'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Chapter 20: Ten Problem Areas and Solutions 299


    reset the user password. For example, if your user name is rod, run the command
    passwd rod and enter the new password (for example) likes coffee.


    The solution is more difficult when you forget the root password. You have to
    become a hacker and break into your computer to fix the problem. Fortunately,
    Red Hat provides two possible solutions: Either boot into single-user mode via
    GRUB or boot from the first Red Hat installation disc.


    # I forgot my root password!”


    You can''t reset a regular user''s password if you can''t log in as the root (superuser).
    However, you can easily circumvent having to log in as the root user by booting
    your Red Hat Linux computer into Single User mode.


    Turn on or restart your computer and use the cursor keys to select the Linux operation
    system when the GRUB boot screen appears; Linux is automatically if you''re not
    using a dual-boot system (you installed only Linux). Next, press the e key to
    edit the GRUB configuration. You see three lines, the middle of which starts with
    the kernel line with the cursor keys when the 3-line menu appears. Press the e
    key again, press the spacebar, and then enter the number 1 at the end of the line.
    Press the Enter key and return to the original GRUB window. Finally, press the
    b key to boot your system into single-user mode.


    ![](img/453364505e32ffec24f7d88ac7824962_320_0.png)


    You can tell Linux to boot into nongraphical — rather than single-user — mode
    by substituting 3 for 1 when you''re editing the GRUB boot mechanism.


    # I need to break into my own computer!”


    Power on or reset your computer. Change your BIOS to boot from CD-ROM, if necessary.
    Before your computer starts the GRUB boot system, insert the companion DVD in
    the DVD/CD-ROM drive. When the Red Hat installation process starts, use linux
    rescue at the boot: prompt.


    Red Hat boots into single-user mode and mounts your Linux partitions. You can
    access and use your computer''s root file system by entering this command:


    ```

    chroot /mnt/sysimage

    ```


    You now have complete control over your computer. For example, you can reset the
    root password:


    ```

    passwd

    ```'
