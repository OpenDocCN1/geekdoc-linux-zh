    \ became immensely popular because of the World Wide Web (WWW).\n\nThe Web isn't\
    \ as mysterious as it may seem at first. It's essentially all the world's web\
    \ servers that are connected to the Internet. The Internet serves the same function\
    \ as the world's telephone system: It interconnects everyone. You can think of\
    \ web servers as the telephones that allow people to contact each other, businesses,\
    \ and other organizations. Just as you can start a business or organization and\
    \ let people contact you via your phone, you can also allow people to contact\
    \ you via your web server. This section describes how to construct a simple web\
