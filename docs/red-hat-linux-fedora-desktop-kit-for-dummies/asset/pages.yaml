  md: '# Dedication


    Jon ''maddog'' Hall: To Mom & Pop (TM), whose aversion to things electronic is
    well known, and who can still call their son Jon rather than maddog.


    Paul G. Sery: To my wife, Lidia Maura Vazquez de Sery.


    # Author''s Acknowledgments


    I want to thank my wife, Lidia, for her patience, support, and good advice, all
    of which have made writing this book possible. Without her, I would still be the
    pocket-protector-wearing, busted-eye-glass-fixed-with-tape-looking, “Star Trek”-tracking,
    wrinkled-shirt-suffering, spaghetti-in-the-pot-over-the-sink eating, Saturday-night-hacking
    sorry sorta guy. Well, I was never into "Star Trek," and I am peaking at this
    keyboard on Saturday night, but my beautiful wife would have made me a better
    man.


    I would also like to thank Anne Hamilton and Laura Lewin, who gave me the chance
    to write in general and this book in particular. Both showed great confidence
    and patience in me. I am very grateful and wish them success in their ventures.


    And, of course, I want to thank the staff at Wiley Publishing, who provided considerable
    and essential help, too. Terri Varver and Rebecca Whitney provided constant and
    essential assistance.


    I want to acknowledge a total lack of assistance in writing this book from my
    dog, the infamous Oso Maloso, eater of many things that should have ended his
    long career early, including but not limited to any poison, Devil, many pounds
    of Tousie Rolls on one Halloween, several bags of chicken bones at one party,
    beer, and other assorted items; escape of many fences and gates; and of the late,
    great Paunchy (whose name you see throughout this book) and other local dogs.


    How useful Oso? Well, one night while working on this dog I got a phone. Leaving
    my apple pie behind next to the keyboard, I went downstairs to take the call and
    passed him on his way up. I should have known something was up because because
    he had a cell phone with him, and no one answered when I picked up the call. I
    went up the stairs while he went down. The apple pie was gone. Oso 1, human 0.


    — Paul G. Sery'
