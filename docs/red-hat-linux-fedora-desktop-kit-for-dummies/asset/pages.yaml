  md: '# Chapter 10: Gnowing More Applications


    Nautilus is programmed to recognize numerous Multipurpose Internet Mail Extensions
    (MIME) types, and they define what type of information a file stores — in other
    words, MIME keeps its own Rolex, of sorts. For example, when you click a .doc
    file, Nautilus recognizes that the .doc suffix corresponds to a Word document
    MIME type and opens the OpenOffice word processor (as described in Chapter 13),
    which loads the .doc file.


    Nautilus provides the ability to bookmark your favorite locations. The Nautilus
    bookmark function works just like Mozilla''s or any other web browser. Go to any
    directory and click bookmarks Add Bookmark. You only have to click Bookmarks and
    select the particular bookmark to that location. You can modify existing bookmarks
    by choosing Bookmarks Edit Bookmarks.


    # Running programs


    Nautilus is such a hard worker that happily launches commands for you. Right-click
    the icon you want to run in order to open a submenu and choose Open. For example,
    if you click the xclock icon in the /usr/bin/x11 directory, xclock appears on
    your desktop. (Double-clicking the icon also works.)


    Managers are generally not very smart. But Nautilus is smarter than the average
    manager, and it knows what to do when it encounters various file types. If you
    open a non-executable file, such as a PDF file, File Manager knows which program
    to use in order to view.


    # Come the Ximian Evolution Revolution


    The Ximian Evolution system is the new workhorse of GNOME and Linux world. Evolution
    provides the next significant step in the evolution of the Linux desktop by combining
    e-mail and calendar clients with other functions to create a single, integrated
    package. Evolution provides these capabilities:


    +   ✔ Calendar

    ✔ Contact manager

    ✔ E-mail client

    ✔ Personal Digital Assistant (PDA) manager

    ✔ Task master (to-do list)


    The following two sections describe how to configure the Evolution e-mail and
    PDA functions.'
