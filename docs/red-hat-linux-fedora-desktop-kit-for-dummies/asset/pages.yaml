  md: '# Chapter 13: Going to the Office


    Writer. You can choose some of, but not all, the other OpenOffice functions from
    this menu. (However, you can start the spreadsheet program, Calc, only from an
    OpenOffice window. From any window — Writer or Imp, for example — choose File:New::Spreadsheet
    to open Calc.) After thinking about a few seconds, the OpenOffice window appears.


    The first time you start OpenOffice, it asks whether you want to use the workstation
    or personal model. The former installs the OpenOffice programs in a central location
    accessible to all users; the latter option installs a copy of OpenOffice in your
    home directory. We use the workstation configuration in this section, but you
    can select the personal model.


    When you use OpenOffice for the first time, you''re also asked a few questions
    about importing an address book. We cancel the operation because we prefer to
    use the Xemian Evolution address book.


    You can access all OpenOffice functions by clicking the File button, in the upper-left
    corner of the window, and then the option you want.


    The following list introduces the functions. You''re probably familiar with the
    layout and operation of the menu if you have used Microsoft Office:


    +   - File: As may expect, you can open, close, save, and otherwise manipulate
    OpenOffice documents using the File menu. Writer files have the .SWX extension.
    Other file formats, such as Microsoft Word and HTML, must be imported and exported.


    +   - New: You can create a new document for any OpenOffice function. When you
    choose File:New, you''re given the option to create a new document, spreadsheet,
    presentation, or other function.


    +   - Edit: This menu provides all the functions you need to modify documents.
    Functions such as cut, copy, paste, and delete are all provided. The functions
    that are active at any time depend on whether you''re editing a document, spreadsheet,
    or presentation. For example, the cut, copy, and paste options aren''t active
    if you''re not editing a document (like when you start up OpenOffice and have
    not opened files).


    You can also track changes, just as you can in Microsoft Word. Choose Edit:Changes
    and you can track changes on a character-by-character basis. You can display changes
    or keep them from view. When you''re satisfied with your edits, you can make the
    changes permanent and save only the finished document to disk. It''s pretty cool.


    OpenOffice also provides the Find and Replace function from the Edit menu. The
    Find and Replace feature enables you to find text strings and either replace them
    with another string or delete them. You can search forward or backward through
    a document. You can replace one instance or all instances.'
