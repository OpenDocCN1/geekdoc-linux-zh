  md: '# Part I: Installing Red Hat Linux


    You can compare the Linux file system to a tree, as shown in Figure 4-1, which
    shows three subdirectories of root (more than a dozen subdirectories are in the
    root directory); a *subdirectory* is a directory. The top of the upside-down tree,
    represented by a / (slash), is the root directory. A series of lines, branches,
    and leaves extends below the root: Likes mount points, the branches that extend
    from the limbs are directories, and the leaves on those branches are your files.


    ![](img/453364505e32ffec24f7d88ac7824962_73_0.png)


    Figure 4-1:

    The Linux file system resembles an upside-down tree.


    Each *mount point* is a drive partition or remote file system (such as your DVD
    or CD-ROM drive) that is *mounted*, or made visible to, a directory of the limb
    above it. When a disk partition or remote file system is mounted on the directory
    branch, it turns that branch into another limb, allowing even more branches to
    be positioned and attached below the mount point.


    Red Hat Linux needs at least a root partition in your directory structure and
    a swap space partition. The root partition is used to store all your personal
    and system files and directories; Linux uses *swap space*, the Hamburger Helper
    of the computer world, to extend your memory below the limit of random access
    memory (RAM). If you have 512MB of RAM and 512MB of swap space, for example, you
    can run programs that use 1GB of memory.


    This configuration isn''t much different from the Windows and MS-DOS file systems.
    Windows uses the concept of a hierarchical directory tree. However, the syntax
    is somewhat different. The top-level directory in Red Hat Linux, is designated
    with a forward slash (/). Every subsequent subdirectory follows that initial slash.
    For example, the home directory is a subdirectory designated as /home. In the
    Windows world, the root directory is designated with an initial slash (\). The
    famous C: is synonymous with C:\ The theme for both operating systems is carried
    forward when dividing subdirectories: Linux uses forward slashes, and Windows
    uses backslashes. Your home directory is then shown as /home/me in Linux and as
    \user\me in Windows.'
