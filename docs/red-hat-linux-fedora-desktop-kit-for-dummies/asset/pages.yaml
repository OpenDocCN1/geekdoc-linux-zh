- img_proc: true
  md: '# Chapter 11: Surfin'' on the Net and Groovin'' to Tunes 149


    You can configure and test your sound card at the same time by following these
    steps:


    +   1. Log in to your Linux computer, click the GNOME Menu button, and choose
    System Settings > Soundcard Detection.

    2. Enter the root password, if prompted.

    The Audio Devices window opens, as shown in Figure 11-2.

    3. Click the Play test sound button.

    If you hear some mellow music, your computer is ready to rock.

    4. Click OK and you''re ready to go.


    ![](img/453364505e32ffec24f7d88ac7824962_170_0.png)


    If you''re pointed correctly and you repeated the steps, but still didn''t hear
    any sound, one of these reasons may explain why:


    +   * Your computer has an old, unrecognizable sound card.

    * You don''t have a sound card.

    * Someone else''s stereo is way too loud.


    You definitely have to purchase a sound card if you don''t have one. Using old
    sound cards is generally difficult, so we also recommend purchasing a replacement.
    We can help you with the third possibility.


    The Red Hat Esd daemon (referred to as ESD) is designed to allow multiple applications
    to use your computer''s sound system at the same time. Sometimes, an application
    may not be able to take advantage of this elegant system. For example, when you
    start XMMS, you may have to turn off the ESD daemon. You can turn off ESD by starting
    a GNOME Terminal window and entering this command:


    ```

    HUP esd

    ```'
