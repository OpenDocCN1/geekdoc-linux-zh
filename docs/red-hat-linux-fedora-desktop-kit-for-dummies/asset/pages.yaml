  md: '# 96 Part II: Got Net?


    IP addresses are analogous to street addresses: They provide a number that uniquely
    distinguishes your machine from all others. Private IP addresses don''t require
    any registration with the powers that be — the InterNIC that distributes IP addresses.
    Public IP addresses aren''t routed on the Internet and can be used for LANs for
    your own use.


    If you''re on a network with registered IP addresses, be sure to get an IP address
    from your system administrator. Otherwise, go ahead and use a private IP address.
    (Use any Class C address between 192.168.1.1 and 192.168.254.254; for example,
    192.168.1.20 or 192.168.32.5.) IP addresses in this range are designated for use
    by private networks. By design, private IP addresses don''t get routed (sent from
    one machine to another) through the Internet, and anyone can use them. Private
    IP addresses would wreak havoc on the Internet if they were used.


    +   6. Type 255.255.255.0 or the mask for your IP address in the Subnet text box.


    The Internet Protocol (IP) defines only three network classes: A, B, and C. Only
    Class C addresses are assigned by InterNIC. Use 255.255.255.0 mask for Class C
    networks, 255.255.0.0 for Class B, and 255.0.0.0 for Class A.


    Class C netmasks are used almost universally now, and we use only Class C addresses
    here. If you''re not using a Class C address, you probably experienced in the
    ways of TCP/IP and know which mask to use. Godspeed, otherwise, don''t fool with
    Mother Nature: Use a Class C address.


    +   7. In the Default Gateway Address text box, type the IP address of the Internet
    gateway for your LAN.


    The Internet gateway is the device (router or computer) that connects your network
    to your ISP and the Internet. Obtain the address from your system administrator
    if you''re at work and have one. If you have a home user, a typical convention
    is to assign the highest address — 254 — of a Class C subnet as the gateway. For
    example, type 192.168.1.254.


    Your TCP/IP Settings should look similar to the dialog box shown in Figure 7-2.


    +   8. Click the Forward button.


