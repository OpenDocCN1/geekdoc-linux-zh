    - Using Red Hat Linux network functions


    We see a penguin in your future. He''s an unassuming fellow who''s taking

    a rather splashy competitor — that other operating system — in the

    battle for the hearts, minds, and desktops of computer users. Red Hat Linux,

    with its splashy brand name and recognizable logo, is undeniably one of the

    driving forces behind the Linux revolution — and is by far the most popular

    Linux brand.


    This chapter introduces you to the latest and greatest Red Hat Linux,

    Linux 10. This book covers all the bases — a good number of them, at least —

    how to use Red Hat Linux as a desktop productivity tool, Internet portal,

    multimedia workstation, and basic network server. You can do lots of things

    with Red Hat Linux, and this chapter gives you an overview of the possibilities

    in addition to a brief look at the history of Linux.


    # History of the World —

    Er, Linux — Part II


    In the beginning of computder (said in a booming, thunderous voice),

    the world was filled with hulking mainframes. These slothful beasts lumbered

    through large corporations; required a special species of ultrannerds to keep'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# 12 Part I: Installing Red Hat Linux


    them happy; and ate huge chunks of space, power, and money. Then came the IBM
    PC and Microsoft, and the world changed. Power to the people — sort of.


    In 1991, a student at the University of Helsinki named Linus Torvalds became dissatisfied
    with the standard PC operating system. Torvalds thought that the Unix operating
    system might be better suited than MS-DOS or Windows to help him accomplish his
    work. Unix was invented in the 1970s and, although powerful, was expensive, he
    began writing his own version of Unix. *not*! After formulating the basic parts,
    Torvalds recruited a team of talented programmers through the Internet, and together
    they created a new operating system, or *kernel*, now named Linux.


    One of the most important decisions Torvalds made in the early days of Linux was
    to freely distribute the Linux kernel code for anyone to do as he wanted. These
    free Linux distributions were and still are available in several forms, mainly
    online.


    The only restriction imposed on the free distribution of his creation was that
    no version of the software can be made proprietary. *Proprietary* software is
    owned and developed by private companies that often rival Area 51 in security.
    *Open source code* is for “the people” — anyone can use and develop it without
    fear of violating copyrights). You can modify the heck out of it and also distribute
    it for fun or profit. You can''t stop anyone else from using, modifying, and distributing
    the software you have modified.


    Think of open source software as a chain. You can use the existing chain and add
    another link to the chain. However, you can''t stop anyone from using the chain
    or adding to it.


    The lack of proprietary restrictions on Linux has led to drastic improvements
    in its technology. Open source software, and Linux in particular, is transparent
    to all users and developers. This transparency allows people throughout the world
    to rapidly improve Linux and its associated subsystems. In contrast, proprietary
    operating systems are like a black box where no one except a small group of insiders
    knows what goes inside. Only that select group can make modifications, and that
    limits innovation and improvements.


    Go back to our history. In early spring 1994, the first real version of Linux
    (Version 1.0) was made available for public use. Even then it was an impressive
    operating system that ran smartly on computers with less than 2MB of RAM and a
    simple 386 microprocessor. Linux 1.0 also included free features for which other
    operating systems charged hundreds of dollars. Nowadays, tens of millions of users
    enjoy Linux at home and work.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Chapter 1: And in the Opposite Corner...a Penguin?


    By the way, if you''re wondering about the whole penguin thing, the answer is
    disappointingly simple. Linux loves penguins. The Linux world naturally started
    using it as its symbol. The friendly and familiar penguin — whose name is Tux,
    — now symbolizes All Linux.


    # Knowing What You Can Do with Red Hat Linux


    Linux is freely available software. The source code for Linux, which is the heart
    and soul of the operating system, is also publicly available. The Free Software
    Foundation (FSF) contributes much to the utilitarian software that makes using
    Linux easier — FSF is the brainchild of the great Richard Stallman.


    Fedora 1 combines all those pieces plus additional applications and then goes
    another step and adds a few of its own to create an integrated product Red Hat,
    Inc., combines the basic Linux operating system with software (some by other companies
    and made by Red Hat) to produce a package with a value that''s greater than the
    sum of its parts. That combination is known as a distribution, or flavor, of Linux.


    So that you can get up and running as quickly as possible, we have bundled the
    Fedora Core distribution on the DVD in the back of this book. It contains all
    the major parts of the full Red Hat distribution except the source code and some
    MS-DOS utilities (for example, the Windows File Allocation Table, or FAT, partitioning
    first nondestructive Interactive Partitions Splitting [FIPS] are included).


    If you can''t use DVD-ROMs, you can get the full Red Hat Linux distribution on
    CD-ROMs by sending the coupon in the back of this book.


    Red Hat was initially used almost solely to provide network services. However,
    Red Hat started working working to make Linux suitable for your everyday use.
    The result is that Red Hat Linux is now used in both server and desktop environments.
    It''s used by individuals, businesses, and governments to cut costs, improve performance,
    and just get work done.


    You can use Red Hat Linux as a desktop workstation, a network server, an Internet
    gateway, a firewall, the basis of an embedded system (such as a smart VCR or a
    robot), or even as a multiprocessor supercomputer. And, thanks to the many, many
    people who continually make refinements and innovations, Red Hat Linux continues
    to become more flexible and capable with each release.'
