  md: 'Red Hat permits you to register, for free, one computer for basic update service.
    Basic service allows you to download and install updated RPM packages. To update
    more machines, you have to purchase additional subscriptions at $60 per year.
    Note that you can register more machines under the Red Hat Network service, but
