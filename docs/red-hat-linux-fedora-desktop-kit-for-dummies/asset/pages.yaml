  md: '# Chapter 12


    # Live from the Net


    In This Chapter


    +   - Using XMMS to listen to Internet audio streams

    - Listening to live radio and playing DVDs with MPlayer


    One of the great innovations of recent times is the use of the Internet to transmit
    — stream — audio and video programs. Streaming technology provides the ability
    for anyone to create a radio or TV station unlimited in terms of geography and
    governmental approval; it also can be done inensively. Using streaming technology,
    computer users can listen to or view these broadcasts from anywhere.


    This chapter describes how to use your Red Hat Linux machine as both an audio
    radio receiver and a DVD video player. We use the open source XMMS and MPlayer
    applications to listen to the Net.


    # Using the XMMS Audio Player


    The open source XMMS (X Multimedia System) application is a great tool for listening
    to audio streams and files. XMMS plays .wav files produced by grip/cdparanoia
    by default. It also plays the up-and-coming open source Ogg/Vorbis format (codec).


    The Ogg codec doesn''t use any proprietary or patented algorithms. Ogg is free
    for anyone to use, and people and organizations that don''t want to depend on
    proprietary systems are discovering it; Ogg also produces higher-fidelity audio
    streams from other popular systems, such as MP3. Why depend on another corporation''s
    whims when you don''t have to?'
  merge: -1
