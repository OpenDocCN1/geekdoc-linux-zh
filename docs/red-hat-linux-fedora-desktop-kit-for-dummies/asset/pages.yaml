  md: '# Moving files and directories


    Moving a file or directory is as simple as clicking and dragging the item you
    want to move to the directory you want to move it. Release the button and you
    have moved your file or directory.


    You can move multiple files by clicking and dragging the mouse cursor over the
    files you want. The mouse cursor creates a rectangular outline and highlights
    all files within that box. Next, click anywhere within the highlighted box and
    drag the mouse cursor to the directory you want. Release the mouse button and
    the files move to the specified directory.


    # Copying files and directories


    Copying a file or directory is a bit more complicated than moving one. Rather
    than simply clicking and drag an icon somewhere, you have to right-click the file
    or directory icon and choose Copy from the menu that opens. Next, enter the directory
    you want to copy by double-clicking its icon. When the directory opens, right-click
    anywhere on the background and choose the Paste option. The file or directory
    is copied to the new location.


    You can copy multiple files and directories in the same manner as you copied individual
    ones. Trace a box around the files or directories you want to copy by clicking
    and dragging the mouse cursor. Next, click any of the blue highlighted icon names
    (not the white space around the icon and names themselves) and choose the Copy
    option. Double-click the directory to copy, right-click the background, and choose
    Paste. Release the mouse button and the files are copied to the specified directory.


    # Deleting files and directories


    Deleting files and directories is much the same process as copying them. You right-click
    the file or directory icon you want and choose Move to Trash from the menu that
    opens. The file or directory is moved to the Trash directory.


    > “Trashed” files and directories aren''t immediately deleted. When you use the
    Move to Trash to delete a file, for example, the file is moved to the Trash folder.
    Open the Trash directory by double-clicking its icon and then right-clicking the
    file or directory to delete. Choose the Delete from Trash option. The Delete from
    Trash window opens and prompts you to confirm the deletion. Click the Delete key
    and the file is erased.


    ![](img/453364505e32ffec24f7d88ac7824962_156_0.png)'
  merge: -1
