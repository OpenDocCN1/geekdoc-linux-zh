  md: '# How Many Daemons Can Dance on the Head of the Linux Process Table?


    Every commercial operating system company wants to make its operating systems
    easy to install and use. Operating systems are inherently complex animals, and
    Linux is no exception. (Of course, we''re not biased when we say that Linux is,
    overall, a simpler system than Windows, whether you measure simplicity by the
    number of lines of code or the transparency — the open source code — of its design.)
    Companies walk the tightrope of making systems easy to use and also making them
    reasonably secure — they sell more copies when they make it simple but buy your
    wrath when you get hacked.


    Ease of use and security often don''t get along. Your operating system is easier
    to use, for example, if you install and activate every software package and option.
    On the other hand, running every software package means you have more potential
    vulnerabilities. Entering your house is a breeze if you install 10 doors and 20
    windows, but that number of entrances also provides burglars with more opportunities
    to break in. The same logic applies to your computer''s operating system: The
    more software you install, the more someone has of getting inside your computer.


    We can''t think of a cure-all for this dilemma. The best answer from a security
    viewpoint is to not provide intruders with any openings: Place your computer in
    a locked room with no network or external connections and turn it off. Then you
    have a truly safe system whose only job is to hold the floor down.


    As with most things in life, the best answer is to use your best judgment and
    balance security with ease of use. Run only the services you need. For example,
    don''t run the Samba file system service if you don''t want to use your Red Hat
    computer as a (Windows) file server. Don''t run the text-based gpm mouse if you
    use the graphical X mode on your computer. The list is endless and is beyond the
    scope of this book to discuss in detail. You can find more info from these sources:


    +   - Web sites: Both www.sans.org and www.usenix.org deal with security issues.

    - HOWTOs: Go to the site www.redhat.com/docs/manuals/linux/RHL-10.0 Manual and
    open the Customization Guide and Reference documents to access security advice.

    - Books covering security: Browse through your local bookstore to find Linux books
    that discusses how to reduce services. Some good books are Red Hat Linux Security
    and Optimization, by Mohammed J. Kabir, and Linux Security Toolkit, by David A.
    Bandel, both published by Wiley Publishing, Inc.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Hide Your Communications with OpenSSH


    You might find it difficult to trust communication media that you don''t completely
    control — such as university LANs, wireless home networks, and the Internet. Our
    point: Trust no one!


    Any public network is potentially dangerous, especially the Internet. One way
    to protect yourself is to use encryption for all communication. You use encryption
    when you use credit card transactions or remote e-mail. Secure Socket Layer (SSL)
    communication is the standard encryption mechanism for secure Internet and e-commerce
    transactions.


    The Secure Shell (SSH) protocol is used to conduct encrypted CLI (commandline
    interface) terminal sessions and file transfers. Red Hat has the open source version
    of SSH called OpenSSH with its distributions. When you install Red Linux, you
    automatically get the OpenSSH client. You can use OpenSSH from a terminal session
    by entering the command ssh destination. The destination is the computer you communicate
    with. You can get information about OpenSSH from www.openssh.org.


    Using encryption is essential when you use wireless networking. Wi-Fi (also known
    as 802.11b) wireless networks use built-in encryption based on the WEP protocol.
    WEP does have significant security vulnerabilities, though. The only long-term
    answer is either to wait until the next standard comes along to fix the problem
    or to use OpenSSH to provide your own encryption. You''re much safer if you use
    OpenSSH and SSL for as much of your communication as possible.


    # Aha! No Firewall — Very, Very Good


    Broadband connections give you a quantum leap in speed and convenience when you''re
    connecting to the Internet. The two most popular choices for a broadband connection
    are DSL and cable modems. After you start using them, you may never go back to
    slow, Stone Age telephone-based modems.


    But every silver lining implies a dark cloud. Broadband connections give you not
    only fast Internet connections but also continuous ones. With a telephone-based
    modem, a hacker can attack your home computer and private network while you''re
    connected to the Internet. Using a 24/7 broadband connection means that every
    hacker in the Internet — that means every hacker in the world — can constantly
    bang on your computer and private network. That''s lots of vulnerability.


    ![](img/453364505e32ffec24f7d88ac7824962_330_0.png)


    ![](img/453364505e32ffec24f7d88ac7824962_330_1.png)'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# 310 Part V: The Part of Tens


    Firewalls provide your number-one protection from Internet-based attacks. The
    modern Netfilter/iptables packet-filtering firewall system gives you excellent
    protection when it''s properly configured. The Red Hat installation process installs
    a good Itables-based firewall by default, and Chapter 8 describes how to configure
    an even better one. You should never, ever connect to the Internet without first
    configuring your personal firewall.


    We don''t mean to imply that you''re invulnerable to attack if you use a telephone-based
    modem to connect to the Internet. Traditional modem connections are just as vulnerable
    as continuous broadband connections when they''re active. What we mean is that
    an unconnected modem is a safe modem.


    ![](img/453364505e32ffec24f7d88ac7824962_331_0.png)


    # Keeping Up with the Software Joneses


    Nobody''s perfect, and that goes for operating system vendors. Even open source
    Linux developers and excellent companies like Red Hat make mistakes. Vulnerabilities
    are found in software systems all the time and have to be fixed.


    Red Hat provides a way to keep up-to-date with current problem and security fixes
    through its Web site. Go to ftp.redhat.com/pub/redhat to find the newest and safest
    versions of all your system''s RPM packages. You can also find out how to use
    the Red Hat Linux Network, at rhn.redhat.com, so that it updates itself automatically
    — see Chapter 17 for details.


    # “Backups? I Don’t Need No Stinking Backups!”


    If you don''t regularly make backups of your computer''s contents, you face a
    security vulnerability, plain and simple. You may lose some or all of your valuable
    information if your computer is compromised. You should back up your data as frequently
    as possible.


    You can use one of many techniques and software for making backups, but that''s
    stuff we couldn''t possibly begin to cover in this book. We wouldn''t be able
    to cover Red Hat Linux if we even began to go into detail.


