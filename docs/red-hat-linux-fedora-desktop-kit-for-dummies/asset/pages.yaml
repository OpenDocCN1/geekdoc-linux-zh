  md: '# # Appendix C


    # # Filing Your Life Away


    **In This Appendix**


    +   - Finding out all about Linux files and directories

    - Finding your way through the Linux file system

    - Creating, moving, copying, and destroying directories and files

    - Changing file ownership and permissions


    In this appendix, you take your first steps through the Linux file and directory
    structure. Don''t worry: Linux may live a structured life, but it''s flexible.
    With a little bit of introduction, you begin to understand the Linux way of life.


    We also introduce you file types, subdirectories, and the root (which is not evil
    at all) directory. You are also shown the way home — to your home directory. After
    you''re oriented to the Linux files-and-directories structure, we show you how
    to make some changes, such as how to copy and move files and directories and how
    to — eeeek! — destroy them.


    # # Getting Linux File Facts Straight


    Linux files are similar to Unix, DOS, Windows, and Macintosh files. All operating
    systems use files to store information. Files allow you to organize your stuff
    and keep them separate. For example, the text that comprises this appendix is
    stored in a file; all other book elements are stored in their own files. Follow
    the bouncing prompt as we make short work of long files.


    # # Storing files


    We assume that you know that a file is a collection of information identified
    by a filename and that Linux can store multiple files in directories as long as
    the files have different names. Linux stores files with the same name in different
    directories.'
  merge: -1
