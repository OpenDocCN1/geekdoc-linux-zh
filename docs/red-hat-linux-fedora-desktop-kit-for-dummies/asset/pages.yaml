  md: '# Part I: Installing Red Hat Linux


    # Using Linux network tools and services


    Linux computers can provide many powerful and flexible network services. Your
    Red Hat Linux Publisher''s Edition DVD comes packed with the tools to provide
    these services:


    +   - Apache web server: Of all the web servers on the Internet, the majority
    are run by the open source Apache web server. You can start a simple web server
    by simply installing the bundled Apache software from this book''s companion DVD-ROM.

    - OpenSSH: The open source version of Secure Shell enables you to communicate
    securely over the Internet. Secure Shell is much safer than Telnet because Shell
    encrypts your communication (even when you log in to other computers), making
    much slimmer the chance that others can discover your passwords and other sensitive
    information. OpenSSH also provides other authentication and security features
    and enables you to securely copy files from machine to machine. With OpenSSH,
    you can prevent people from listening to your communication.

    - Internet accessing utilities: Red Hat Linux provides several configuration utilities
    that help you connect to the Internet. The utilities help you configure DSL, cable
    modems, and plain old telephone modems to connect to the Internet. They also help
    you to connect to Local Area Networks (LAN) using Ethernet adapters.

    - Firewalls: A firewall is a system that controls access to your private network
    from any outside network (in this case, the Internet) and to control access from
    your private network to the outside world. To keep the bad guys out, Red Hat Linux
    provides protection by giving you the tools to build your own firewall. Red Hat
    Linux is flexible in this regard, and many software packages are available, including
    the popular and simple-to-use netfilter/iptables filtering software, which is
    included on the companion DVD-ROM. Building a firewall is covered in Chapter 8.


    This list is just a sample of the network-y things you can do with Red Hat Linux.
    We describe many of them in this book, but it takes much more exploration to find
    them all!'
