- img_proc: true
  md: 'The second filter rule controls the packets coming back from outgoing connections.
    When you connect to a Web site, for example, your browser sends out packets and
    the web server responds to them. You may click a button on the Web site, and a
    new display pops up. Clicking a button sends a packet out, and the web server
    sends packets back. You have previously blocked packets from the Internet. This
    rule creates an exception that allows packets which belong to an existing connection
    — such as the connection that represents you clicking a button — through the firewall.
    Note that we don''t allow new connections (--state NEW) to be established because
    that would defeat the purpose of this firewall.


    +   6. (Optional) Use the following rule to allow SSH connections to your Linux
    computer:


    ```

    iptables -A INPUT tcp -m state --state NEW,ESTABLISHED

    -j ACCEPT --dport 22

    ```


    This rule permits SSH connections on Port 22 to enter your computer. You can install
    an OpenSSH server by logging in as root, mounting your companion DVD, and running
    this command:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/openssh-server*

    ```


    Start the OpenSSH server by running this command:


    ```

    /etc/init.d/sshd

    ```


    You can modify this rule to allow other types of incoming connections to your
    computer. For example, a new rule using --dport 80, and the firewall allows incoming
    HTTP packets. All you need to do is install the Apache web server (included on
    this book''s companion DVD-ROM and described in Chapter 16), and your workstation
    morph into a web server.


    You have created a simple, effective firewall that protects your computer from
    the werewolves of Netdom. ("They''ll rip your heart out, Jim!") Your firewall
