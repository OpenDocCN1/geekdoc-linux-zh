  md: '# 302 Part V: The Part of Tens


    # "My network is working, yet not working"


    Problem: You have configured and checked your network connection, and it appears
    to be okay. But you can''t connect to some or all of the machines or network services
    you want. You''re perplexed.


    Solution: Check your iptables-based firewall. Red Hat configures two different
    levels of firewalls during the installation. This book describes several different
    iptables firewall configurations too. If your firewall isn''t configured correctly,
    it prevents some or all network communications. Even if your firewall is configured
    correctly, it may be designed, in many cases, to block the type of communications


    Turn off your firewall with this command:


    ```

    /etc/init.d/iptables stop

    ```


    If your network connection instantaneously works, your firewall was most likely
    the culprit. In that case, you have to modify your firewall to make it work for
    your needs. Don''t forget to turn your firewall back on as soon as you fix the
    problem:


    ```

    /etc/init.d/iptables start

    ```


    A description of how to customize an iptables firewall is beyond the scope of
    this book. However, the firewalls we show you how to construct in this book may
    work for you and also be easier to understand and modify. Refer to Chapter 8 for
    more information about iptables-based firewalls.


    # "I want to make an emergency boot floppy disk"


    Problem: You skipped making an emergency boot disk when you installed Red Hat
    Linux and want one now.


    Solution: All is not lost if you read Chapter 3 and skipped making a boot disk.
    Nothing is lost because it''s easy, in fact, to make one. Log in to your computer
    as root and insert a floppy disk that you don''t mind erasing (losing everything
    on that disk). Run this command:


    ```

    uname -r

    ```'
