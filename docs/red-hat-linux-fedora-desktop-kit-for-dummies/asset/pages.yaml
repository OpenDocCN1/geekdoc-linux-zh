  md: '# Chapter 17: Securing Your Future


    This section outlines some additional building blocks you may consider adding
    to your process:


    +   - **Making backups**: Backups are part of the security process? Yes! Backups
    are an essential security tool in the sense that you can never eliminate the possibility
    of getting hacked. If and when your security is breached, you may lose all sorts
    of information and configurations. For example, your computer may be completely
    erased or worse, you may not know which files are good or bad. You must ensure
    your ability to recover from these types of catastrophes.


    One good backup method is to use the GNOME Toaster application, as we describe
    in Chapter 11. You can store your user account and configuration files on CD-R/RW.
    It is reliable and should last forever. The only limitation is its ability to
    store only 700MB to 800MB; you can store more data with compression,


    +   - **Security education**: Keeping up with security trends and topics helps
    you avoid getting bitten by new hacks. Knowing your adversaries and their techniques
    is essential.


    These URLs provide good security-based information; see Chapter 21 for some current
    security holes:


    +   - red.com/docs/manuals/linux/RHL-10-Manual/security-guide/

    - www.linuxsecurity.com

    - www.sans.org

    - www.nmap.org

    - www.securitytracker.com

    - www.infosyssec.com

    - www.cert.org


    +   - **Physical security**: We focus on network-based security in this book.
    We assume that your Red Hat Linux computer is running on your home network, in
    which case you have to worry most about Internet bad guys. However, in an office
    environment, you have to worry about physical security.


    Physical security involves preventing people from walking up and gaining unauthorized
    access to your computer. You should! set a BIOS password to prevent anyone from
    booting your computer into single-user mode, totally avoiding your Linux passwords.
    You should lock your computer in your office, if possible, to prevent anyone from
    stealing your hard drive. Don''t, under any circumstances, write your passwords
    in any accessible place (like on your desk or computer).'
