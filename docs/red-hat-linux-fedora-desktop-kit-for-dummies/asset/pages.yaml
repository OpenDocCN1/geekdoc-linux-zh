  md: '# Chapter 6: Broadband Rocks!


    # The many faces of DSL


    DSL comes in a variety of flavors. Most consumers end up using ADSL because it
    offers inexpensive Internet connections at reasonably high speeds. ADSL serves
    an individual computer''s Internet needs very well; it even provides a small business
    with adequate service. ADSL is, not surprisingly, the most available of all DSL
    flavors.


    The other types are more suited for business use. Most locals probably have access
    to only two or three of these services. This list describes DSL variations:


    +   ADSL (Asymmetrical DSL): The ADSL download (downstream) speed isn''t the same
    as its upload (upstream). (That''s why it''s asymmetrical.) The maximum ADSL speed
    is 8 Mbps, but it''s usually limited to less because of the POT infrastructure
    limitations.


    +   G.Lite: Also known as Universal DSL or splitterDSL, G.Lite is a low-speed
    version of ADSL that doesn''t require filtering out the POTS signal. It provides
    as much as 1.5 Mbps downstream and 512 Kbps upstream.


    +   HDSL (high-rate DSL): HDSL is a symmetrical protocol with equal upstream and
    downstream speeds. You can use HDSL as a substitute for T1 connections because
    it provides the same data rates of 1.544 Mbps.


    +   HDSL2 (high-rate DSL 2): HDSL2 provides the same specifications as HDSL but
    works over a single twisted-pair connection.


    +   IDSL (ISDN Digital Subscriber Loop): IDSL, the successor to the ISDN technology,
    using the same line encoding (2BQ) as ISDN and SDSL is used mostly to popular
    forms, such as ADSL and DSL, aren''t available. IDSL is capable of providing upstream
    and downstream speeds of 144 Kbps.


    +   SDL (Single-line DSL): DSL is commonly called Symmetric DSL because SDSL upstream
    and downstream speeds are the same.


    +   VDSL (Very high rate DSL): VDSL provides as much as 50 Mbps over distances
    up to 1,500 meters on short loops. VDSL is particularly useful for campus environments
    — universities and business parks. VDSL is now being introduced in market trials
    to deliver video services over phone lines. You can also configure VDSL in symmetric
    mode.


    +   xDSL xDSL is a generic term for all the DSL flavors.


