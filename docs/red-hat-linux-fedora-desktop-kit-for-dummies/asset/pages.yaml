    # Is another computer or device to talk to?


    Try to ping another computer — if one exists — on your network. Type the following
    command, let it run for 10 to 15 seconds, and stop it by pressing Ctrl+C:


    ```

    ping 192.168.1.2

    ```


    (This example assumes another computer has the IP address 192.168.1.2. Adjust
    the address you like to work with your network.)


    You should see respond like what''s shown in this bit of code:


    ```

