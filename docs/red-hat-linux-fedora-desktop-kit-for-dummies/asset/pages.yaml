- img_proc: true
  md: '# Chapter 18: Bringing In the Red Hat Linux Repair Man


    aid that helps you to eliminate all but the real cause of your problem. The fault
    tree looks like an upside-down tree, where the trunk of the tree represents the
    fault, or problem. The ends, or leaves, of the branches represent all the possible
    causes. After that''s done, solving the problem is virtually guaranteed.


    For example, Figure 18-1 shows part of a fault tree that points out which major
    subsystems you should examine. To find the solution to a problem, you have to
    systematically identify what''s working. You work your way to what''s not working
    and then when you find it, you usually solve your problem. The fault tree simply
    helps to formalize the process of problem solving.


    ![](img/453364505e32ffec24f7d88ac7824962_288_0.png)


    Here are some possible faults:


    +   - The first branch on the left involves problems with the physical connection.
    Do you have a network adapter? Is the cable connected properly to the adapter?
    Do you have a break in the cable? If you have to fix or replace the cable.

    - The second branch deals with the network interface configuration. Have you configured
    the IP address for your Ethernet adapter correctly? If so, is the netmask correct?

    - The third branch helps you to decide whether the problem exists with the network
    routing. Can you network packets be directed towards the correct network?


    The fault tree helps you to break down any big problem into several simpler ones.
    By eliminating each simple problem one by one, you should eventually locate the
    root cause.'
