  md: '# Changing your working directory


    We occasionally (often?) want to change your working directory. Why? We''re glad
    you asked — because changing it enables you to work with shorter relative pathnames.
    To do so, you simply use the `cd` (for change directory) command.


    To change from your working directory to the /usr directory, for example, type
    this command:


    ```

    cd /usr

    ```


    # Going home


    If you type `cd` without any directory name, you return to your home directory.
    Just knowing that you can easily get back to familiar territory is comforting.
    There''s no place like home.


    You can also use `cd` with a relative specification; for example:


    ```

    cd ..

    ```


    If you''re in the directory `/usr/bin` and type the preceding command, Linux takes
    you to the parent directory named `/usr`:


    ```

    [lidia@cancun lidia]$ cd /usr/bin

    [lidia@cancun bin]$ cd ..

    [lidia@cancun user]$ cd $

    ```


    Here are a couple of symbols: If you type `cd ~`, you go to your home directory
    (the tilde symbol `~` is synonymous with `/home/username`). If you type `cd ~username`,
    you can go to user''s home directory. On very large systems, this is useful because
    it eliminates the need for you to remember — and type directory specifications.


    This list describes the shell redirection symbols:


    +   > is known as redirect output. When you use it, you tell the computer “Capture
    the information that normally goes to the screen, create a file, and put the information
    in it.”

    >> is known as append standard output. When you use this symbol, you tell the
    computer “Capture the information that would normally go to the screen and append
    the information to an existing file. If the file doesn''t exist, create it.”

    < tells the command, “Feed the information from the specified file to standard
    in (also known as standard input), acting as though the information is coming
    from the keyboard.'
