    To get connected using a dial-up modem, you have to successfully hook up a modem
    to your computer and then find a good Internet Service Provider (ISP) to dial
    up. Odds are that you have an internal modem that came installed with your computer.
    If you don''t, you may want to consider upgrading. Check out Upgrading & Fixing
    PCs for Dummies, 6th Edition, by Amy Rathbone (Wiley Publishing, Inc.).


    The best way to find a good ISP is by word of mouth. Getting personal recommendations
    is a good way to find out both the good and bad points of an ISP that you can''t
    find from reading advertisements. Before you sign on with an ISP, make sure that
    the company supports Linux.


