    # Displaying Your Firewall Rules


    After you configure your firewall, you naturally want to verify that the filtering
    rules are set up correctly. To display the firewall rules, follow these steps:


    +   1. Open a GNOME Terminal window, by right-clicking any empty portion of the
    desktop and selecting the New Terminal menu.'
