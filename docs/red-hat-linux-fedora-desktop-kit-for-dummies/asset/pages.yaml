  md: '# Firing Up Your Firewall (And Dousing the Flames)


    The preceding section describes how to display your firewall-filtering rules.
    However, you certainly don''t want to manually enter these rules every time you
    reboot your computer. This section shows you how to automate your firewall. We
    show you how to make use of the Red Hat utilities that save the rules you just
    created and start up the firewall whenever you boot your computer.


    These instructions assume that you have configured the firewall as described in
    the preceding section and that the configuration is still in effect.


    # Saving your filtering rules to a script


    You need to save your rule set after you have created your firewall. Red Hat provides
    a utility for doing just that. The iptables-save utility reads your current firewall
    rules and converts them into script-compatible form. Red Hat also provides a script
    to start up your firewall whenever you start your computer. The /etc/init.d/iptables
    script is run whenever you start your computer, and thus, your firewall is started
    too. Follow these steps:


    +   1. Log in as root, if necessary, and open a GNOME Terminal window (refer to
    Chapter 4), if necessary.

    2. Run this command and ensure your firewall rules are saved to a script:

    iptables-save > /etc/sysconfig/iptables


    # Turning your firewall off and on


    Red Hat uses the /etc/sysconfig/d/iptables script to start Netfilter/iptables
    firewalls. The /etc/init.d/iptables script uses the filtering rules stored in
    the /etc/sysconfig/iptables file to implement the filtering rules.


    You can start the Netfilter/iptables firewall by running this iptables start:


    ```

    /etc/init.d/iptables start

    ```'
