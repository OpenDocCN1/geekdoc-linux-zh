  md: '# Appendix C: Filing Your Life Away 335


    # Moving and copying files and directories


    The commands for moving and copying directories and files are mv for move and
    cp for copy. If you want to rename a file, you can use the mv command. No, you''re
    not really moving the file, but in Linux (and Unix), the developers realized that
    renaming something was much like moving it. The format of the move is


    ```

    mv source destination

    ```


    Create a file that you can practice moving. The touch command updates the time
    stamp on an existing file or creates an empty file if it doesn''t exist. In this
    case, the file test doesn''t exist and will be created by touch:


    ```

    touch go

    ```


    Move the new file:


    ```

    mv go to

    ```


    This command leaves the file in the same directory and changes its name to to.
    The file wasn''t really moved — just renamed.


    Now try moving the file to the file the veracruz directory. To do that, you have
    to first move the file up and then move it into the veracruz directory. You can
    do it with one command:


    ```

    mv to ..veracruz

    ```


    The file file uses the double-dot (..) designation; every directory contains a
    double-dot directory that points to the parent directory. This command tells Linux
    to go up one directory level and look for a directory named veracruz and then
    put the file into that directory with the name newgoto because you didn''t specify
    any other name. If you do this:


    ```

    mv go ..veracruz/now

    ```


    the go file moves the veracruz directory named now. Note that in both cases (with
    the file maintaining its name of go or taking the new name now), your current
    directory is still cancun and all your filenames are relative to directory.


    Strictly speaking, the file still hasn''t moved. The data bits are still on the
    same part of the disk where they were originally. The file specification (the
    direc-ory path plus the filename) you use to talk about the file is different,
    so it appears to have moved.'
  merge: -1
