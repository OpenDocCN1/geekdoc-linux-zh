    The Red Hat problem was its lack of a full-blown office suite to work with word
    processing documents, spreadsheets, and similar documents. Fortunately, desktop
    productivity suites — such as OpenOffice and its sister application, StarOffice
    — have taken Linux out of the back office and into the front.


    # Opening Your Office


    OpenOffice desktop productivity suite does nearly everything Microsoft Office
    does, but for less money. How much less? Well, 100 percent less because it''s
    100 percent free. Sun Microsystems, Inc., sells the version named StarOffice and
    also provides an open source version named — you guessed — OpenOffice. OpenOffice
    is licensed under the GPL/LGPSL licenses. What do all those letters mean? They
    mean f-r-e, and they also mean that Linux can integrate office productivity features
    from OpenOffice and OpenOffice share the GPL license. You can find more information
    about the licenses at www.openoffice.org/project/license.html.


    OpenOffice is not only free (did we mention that it''s free?), but it''s also
    powerful, providing you with these functions:'
