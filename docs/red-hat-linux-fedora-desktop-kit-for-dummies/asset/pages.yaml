  md: '# Chapter 14: Days of Wine and Applications 181


    # Introducing CodeWeavers

    CrossOver Office


    The outstanding Wine system lets you tap the deep resources of the Windows world.
    Wine is developed under the open source system, volunteers provide countless hours
    of service to the computing world. The open source community, however, doesn''t
    limit the use of its software to only noncommercial use. Software developed under
    the General Public License (GPL) permits commercial use as long as no restrictions
    are placed on the original GPL software.


    The commercial use of open source software can provide an extra punch in certain
    circumstances. Open source for profit? Indeed. Companies such as CodeWeavers (www.codeweavers.com)
    and TransGaming (www.transgaming.com) deliver such a punch. Both have added features
    to the basic Wine software to make the installation simpler. CodeWeavers concentrates
    on making Wine easier to use on the general desktop; the company makes installing
    and using Microsoft Office, Internet Explorer, and various plug-ins easy. The
    TransGaming product WineX, on the other hand, provides a gaming-oriented system.


    This book is oriented toward using Linux as a useful day-to-day workstation. Our
    work is tilted toward using word processors and similar programs. We leave it
    to you to experiment with WineX. It suffices to say that our game-oriented colleagues
    find WineX useful.


    CodeWeavers produces two products: CrossOver Office and CrossOver Plugin. Office
    provides as an installation utility that helps with installing Windows applications.
    The Plugin product provides internally developed software that helps in using
    plug-ins. CrossOver Office uses unmodified Wine software, but provides a slick
    installation system. CrossOver Plugin uses its own custom libraries to make Windows
    plug-ins, such as QuickTime, with your Linux browser. CrossOver Office costs $54.95
    and Plugin costs $24.95. You can purchase both for $69.95. (These prices are for
    when you download the product from the Internet. The CD version costs $64.95,
    $34.95, and $79.95, respectively.)


    # Downloading the trial version

    of CrossOver Plugin


    CodeWeavers graciously provides a 30-day evaluation license for CrossOver Plugin
    and CrossOver Office. You can therefore test the full version of its products.
    These steps describe how to download the trial version of CrossOver:


    +   1. Log in to your Red Hat Linux computer as the superuser.'
