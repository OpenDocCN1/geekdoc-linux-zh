  md: '# 90 Part II: Got Net?


    # Introducing Local Area Networks


    The invention of Linux revolutionized computer networking. Creating a LAN

    before Linux existed was complicated and expensive. LANs were the nearly

    exclusive domain of big corporations, universities, and other monstrous

    organizations.


    ![](img/453364505e32ffec24f7d88ac7824962_111_0.png)


    But the TCP/IP networking protocols were built into Linux from the beginning.

    In the mid-1990s, if you could afford a couple of PCs, a cheap piece of coaxial

    cable, and fell to 10 Mbps (megabits per second) or faster Ethernet adapters,
    a

    LAN was born. Ethernet adapters, also commonly known as network interface

    cards (NICs), cost about $150 at the time. Prices, unfortunately, have crashed

    s then, falling to earth like Ziggy Stardust: A 100 Mbps NIC now costs as\little
    as $15, and you can buy an 11 Mbps NIC for less than $100.


    To get your Red Hat computer on a network, you have to configure only a

    handful of networking subsystems. Here are the tasks that need to be per-formed
    in order for your networking to work:


    +   - Load your wireless or Ethernet NIC kernel module. Red Hat Linux gener-ally
    detects your hardware and loads the correct kernel modules.


    +   - Configure your network interface card (NIC).


    +   - Configure your domain name service (DNS), which converts Internet

    names into Internet Protocol (IP) addresses.


    ![](img/453364505e32ffec24f7d88ac7824962_111_1.png)


    Wireless networking suffers from some security vulnerabilities. Consult the

    "Wireless network warning" sidebar, later in this chapter.


    Performing these steps is pretty heavy lifting. The load is eased considerably

    by using the graphical Network Configuration Utility system administration

    tool provided by Red Hat. Have fun!


    # Configuring Your NIC with the Red Hat Network Utility Utility


    To use your Red Hat Linux computer with an existing Local Area Network

    (LAN), you need a wireless or Ethernet NIC installed on your computer and

    a network hub, or switch, to which to connect it. After you set up the

    hardware, you will need to configure your Red Hat Linux network settings.


    ![](img/453364505e32ffec24f7d88ac7824962_111_2.png)


    If your Linux also has an Internet connection, you can set up that connection

    too. Although a high-speed Internet connection is best, in terms of the net-work
    connection the type of connection doesn''t matter.'
