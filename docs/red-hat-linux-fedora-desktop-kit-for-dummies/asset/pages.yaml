    # ## UMware: A Virtual Reality Machine


    Sometimes, you need to use an application that doesn''t run under Linux — even
    with the help of Wine. For example, one of us has to use a trouble-ticket system
    to fix customers'' problems. The problem is that the trouble-ticket application
    doesn''t run under Linux, or without Wine. That author must install both Windows
    and Linux on his computer (a dual-boot system) or maintain a separate one for
    the sole purpose of running the single application.


    Nothing is wrong with using a dual-boot computer, course, but it''s of a waste
    of time if you need to run one or two applications. Dual-boot computers also have
    to be rebooted when you need to use the other operating system. An alternative
    to dual booting is VMware, a commercial product from VMware, Inc. This program
    creates a virtual computer within a physical computer. The virtual computer runs
    as an application, just like OpenOffice or Mozilla.


    VMware looks and works just like a real PC. The virtual VMware PC can run an operating
    system, such as Linux or Windows, just like any real computer can. The operating
    system running on the virtual machine behaves just like the real operating system.
    Any applications it hosts, therefore, look and work just like the real applications!


    VMware is also good for running Linux books. Writing tech like this one requires
    you to use early versions of new releases during the initial draft phase. The
    old method required installing the beta on your computer and using it for both
    testing and writing; alternatively, you can use two computers-by-side. Both methods
    are clunky and cause numerous headaches when the beta does some funky thing. VMware
    solves the problem by allowing you to run the current production version of Red
    Hat Linux on your host computer and install the beta to your heart''s content
    while writing at the same time in OpenOffice — all on the same virtual computer.
    Updating from one beta version to another is a snap too.


    You can download the VMware Workstation product for free. It requires a license
    that costs approximately $300 for commercial use and $100 for educational use.
    It''s money well spent.'
