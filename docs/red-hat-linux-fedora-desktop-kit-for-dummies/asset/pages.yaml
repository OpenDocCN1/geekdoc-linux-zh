  pgno: 296
- img_proc: true
  md: '# Part IV: Revenge of the Nerds


    To set the route for the network adapter and your local network, type this command:


    ```

    route add 192.168.1.0 dev eth0

    ```


    This route is assigned automatically to your network adapter. You can assign the
    route to another NIC, if necessary; for example:


    ```

    route add 192.168.1.0 dev eth1

    ```


    Type netstat -rn to see your routing table. You should see entries for the loop-back
    and the Ethernet. If you don''t see a route to your network interface, try repeating
    the preceding steps. You may have to delete a route. To delete a route, type this
    command:


    ```

    route del 192.168.1.0 dev eth0

    ```


    Note that you use the network address rather than a host address here. The zero
    (0) designates the class C network address 192.168.1.1.


    # Doing the ping thing


    If the network adapter is configured correctly and the routing is correct, check
    the network. The best way to do it is to ping the loopback interface first and
    then the other computer. Type this command, let it run for a few seconds (one
    ping occurs per second), and stop it by pressing Ctrl+C:


    ```

    ping 127.0.0.1

    ```


    You should see a response like the one shown in the example in the preceding section.


    Each line shows the number of bytes returned from the loopback interface, the
    sequence, and the round-trip time. The last lines comprise the summary, which
    shows whether packets didn''t make the trip. This is a working system, but if
    you don''t see any returned packet, something is wrong with your setup and you
    should review the steps outlined in the preceding paragraphs.


    Next, try pinging your Ethernet interface by typing this command:


    ```

    ping 192.168.1.1

    ```


    You should see a response like what''s shown in this bit of code:'
  merge: -1
