  md: '# Part IV: Revenge of the Nerds


    # Connecting your Internet gateway


    After you configure your Internet gateway to forward network traffic from your
    private network to your Internet connection (see the preceding section), you need
    to make that connection. In this section, we describe how to use the Internet
    connections introduced in Chapters 5 and 6. You build on these instructions to
    connect your entire network to the Internet through these connections.


    From a functional viewpoint, the type of Internet connection you use — telephone,
    DSL, or cable — doesn’t matter because all these Internet connections send and
    receive the same network traffic. (Practically speaking, of course, the higher
    throughput and lower latency of broadband make it it more desirable than old telephone
    modems.) For this reason, you can treat as interchangeable the Internet connections
    you may have read about in Chapters 5 and 6.


    The forwarding we describe in the preceding section takes care of routing the
    packets to and from the Internet via your Internet gateway. Follow these steps
    to configure the Internet gateway:


    +   1. Install the Ethernet or Wi-Fi NIC on your Red Hat Internet gateway to connect
    it to your private network.

    2. Install the Ethernet NIC on your Red Hat Linux Internet gateway to connect
    it to your DSL or cable gateway.

