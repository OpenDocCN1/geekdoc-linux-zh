  md: '# 200 Part IV: Revenge of the Nerds


    In this chapter, we describe how to connect computers to form a LAN. However,
    you can connect many other devices to a network. Devices such as broadband Internet
    models (cable and DSL), routers, switches and hubs, network-capable printers,
    and even some personal digital assistants (PDAs) can all be connected to a network.
    In the future, we fully expect to be able to connect nearly every electronic device
    to a LAN. We discuss only computers here because we''re focusing on Red Hat Linux
    computers. However, remember that you''re not limited to just networking computers.


    ![](img/453364505e32ffec24f7d88ac7824962_221_0.png)


    # Designing and Building Your Private Network


    Private networks take on many shapes and sizes. As you may expect, the design
    of a LAN for a large- or medium-size organization is different than for a small
    office or home. Individuals and small organizations generally don''t require complex
    networks unless they perform complex work. For the purposes of this book, we assume
    that you want and need a simple network. We describe how to design a basic LAN
    that is both powerful and reliable. This network can be used for many small- or
    medium-size businesses and most households.


    This chapter shows you how to design a flat network. Flat refers to the fact that
    all the computers connected to the network communicate over a single subnetwork
    (or subnet, for short). Subnets can be combined within a single LAN, but that
    makes the network more complex to design, build, and maintain.


    The network we describe here is also designed to use a Red Hat Internet gateway.
    The Internet gateway is a computer that acts as a portal, connecting the private
    network to the Internet. The networked computers in the private network — also
    referred to as hosts or clients — are connected through one of two methods:


    +   * Wired connections: Hosts are connected to the LAN through a device called
    an Ethernet hub or Ethernet switch (hub or switch, for short). Switches are superior
    to hubs in performance and are becoming the standard. For your LAN, we suggest
    that you connect all computers (hosts), including the Internet gateway, by using
    an Ethernet switch. Figure 15-1 shows an example of our private network, where
    the interconnecting fabric is the Ethernet switch. In recent years, Ethernet switches
    have become inexpensive and common, and Ethernet hubs have been disappearing.

    * Wireless connections: Wireless devices make it possible to build a network without
    interconnecting cables. Wireless networks can take two forms:

    * Using an access point: Using a device called an an access point, you can connect
    wireless hosts to a LAN. This design has the hosts to connect


    ![](img/453364505e32ffec24f7d88ac7824962_221_1.png)'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Chapter 15: Building Your Own, Private Network


    the access point via radio frequency (RF) signals. The access point also connects
    to a wired network, and the wireless hosts communicate to the wired network through
    that connection.


    The RF signals used by wireless networks are the ones you tune in to your radio
    or communicate with your cell phone or open your garage door. The differences
    between the RF signals coming from an AM radio station and a wireless network
    device is its frequency and strength. The Federal Communications Commission (FCC)
    permits anybody to use the 5 GHz (billions of cycles per second) frequency portion
    of the spectrum for any purpose as long as the signal strength is low.


    Access points become the most popular system for creating wireless LANs. You can
    find access point devices in consumer electronics stores for much less than $100.


    **Using ad-hoc mode:** The alternative wireless-connection method, called ad-hoc
    mode, doesn''t require a separate access point, other than a wireless device for
    each host. Wireless hosts communicate directly with each other by using ad-hoc
