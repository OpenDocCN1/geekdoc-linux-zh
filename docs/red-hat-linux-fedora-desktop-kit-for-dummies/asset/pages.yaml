    Backslashes () are escape characters in the Linux world; in the Windows world,
    backslashes separate directory names. That is, they prevent Linux (the bash shell)
    from interpreting the following character literally. Without the backslash Linux
    (bash) interprets the directory name Program Files as two separate entities, Program
    and Files, because the bash shell figures that the space character is a separator
    and not part of a directory name or filename. Therefore, the combination of backslash
    and a space — Program—Files—allows Linux to process the directory name correctly:
    Program Files. The preceding command (refer to Step 8) is interpreted by Linux
    as wine C: Program Files/Microsoft Office/winword.exe.


