    hard to create. Refer to your system''s manual to find out how to back up your
    system and how to restore the data if necessary.


    # Resizing Windows 9x and Windows Me FAT partitions with FIPS


    FIPS resizes your FAT-based Windows partitions. Newer versions of Windows (some
    versions of Windows 95, Windows 98, and Windows Me) use a 32-bit file allocation
    table (called FAT32) and drive management tools that provide for single-drive
    configurations larger than 2GB. Older versions of Windows 95 use a 16-bit FAT
    (called FAT16, oddly enough); to use more space over and above 2GB, the hard has
    been repartitioned into logical drives of 2GB or less. Newer computers have hard
    drives much larger than the old 2GB limit. If the drive is repartitioned, the
    large drive-management system is disabled, and DOS and Windows partitions are
    again limited to 2GB.


    You need to use the ancient MS-DOS (Microsoft Disk Operating System) operating
    system — yes, one way or another, all of Windows-dom owes its existence to MS-DOS.
    The following instructions describe how to create an MS-DOS boot floppy disk,
    which you use to run FIPS:


    +   1. Insert a floppy disk and click the My Computer icon.


    Please be aware that these instructions permanently erase all information from
    the disk.'
