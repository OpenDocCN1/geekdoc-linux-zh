  md: '# Chapter 3: Ready, Set, Install!


    # Confidential for Windows users


    If you''re installing Red Hat Linux in a dual boot configuration with Windows
    NT, Windows 2000, or Windows XP, your NT boot record is temporarily overwritten,
    which means that your boot Windows NT. Don''t panic: Your partition is not erased
    — it has been rendered unbootable. (An NT boot record is what enables a Windows
    system to start automatically when you start your computer.)


    You can install Red Hat Linux without overwriting the NT boot partition if you
    click the Change Boot Loader and select the Do Not Install a Boot Loader radio
    button. When you click the Next button, the Advanced Boot Configuration window
    opens. Select the First Sector of Boot Partition option and then click the Next
    button. Your windows boot configuration continues as before.


    In the following section, we show you how to configure your network for Red Hat
    Linux use. If you don''t have a network or don''t want to haggle with it right
    now, you may want to read the following section anyway because it makes your life
    easier if you create a network sometime in the future. If you''re still not interested,
    click Next and skip to the section after that, "Installation Stage 4: Configuring
    Your System."


    # Installation Stage 3: Configuring Your Network


