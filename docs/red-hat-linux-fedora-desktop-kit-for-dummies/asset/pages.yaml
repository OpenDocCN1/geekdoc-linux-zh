  md: '# 92 Part II: Got Net?


    +   - Adapter-to-wireless hub: This type, called infrastructure, provides a single
    entrance (an access point) into a LAN. An access point allows one or more computers
    to be connected to a network. However, unlike an ad hoc network, the individual
    computers can connect to any access point that allows them to.


    The wireless-configuration instructions we provide work with either the infrastructure
    or ad hoc connection methods. Your wireless NIC can connect to either the access
    point or other computers (Linux and Windows) as long as you correctly configure
    your Network ID (ESSID) and encryption key.


    # Choosing between ad hoc and infrastructure


    Using ad-hoc mode provides three advantages:


    +   - **Lower costs:** You don''t have to purchase an access point; an access
    point starts at $50. Computers using wireless NICs running in ad-hoc mode communicate
    directly with each other, eliminating the need for a common access point.


    +   - **Simpler configuration for Linux users:** Older access point devices could
    be configured using only Windows-based software — the simple network management
    protocol (SNMP), to be exact. You had to physically connect a Windows computer
    to the access point via a wired Ethernet network and then use the software supplied
    with the device. That was difficult if you didn''t have any Windows-based computers.
    Newer access points tend to use HTML-based configuration systems, so you can use
    Mozilla to configure these newer devices.


    +   - **No need to configure any access point:** You need to configure only the
    wireless NIC in each computer on your network. You can use the Red Hat Network
    Configuration Utility to configure a wireless NIC, which simplifies the process.
    Each NIC must have the same Network ID and encryption key.


    Ad hoc networks can also provide a bit more security because they connect to other
    networks — and the Internet — through a network router. Routers examine IP addresses
    and decide where to direct network traffic from one network to another. Bridges
    automatically pass on all traffic. Ad hoc networks can be configured to more tightly
    — but not completely — control network traffic than access-pointbased networks.
    You can configure ad networks with a firewall more easily than a network using
    an access point. (Many of the current crop of access points provide NAT and firewall
    support, however; using NAT effectively creates a firewall.)'
  merge: -1
