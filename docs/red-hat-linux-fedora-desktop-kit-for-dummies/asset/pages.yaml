- img_proc: true
  md: '# Chapter 18: Bringing In the Red Hat Linux Repair


    You see a listing of your routing table.


    This list briefly describes the elements in the routing table:


    +   - The destination is the location — IP address — to where you want to send
    packets. For example, the address 192.168.1.0 refers to your local network.

    - The gateway is the address (computer or router) where the packets will be sent
    so that they can find their way to their destination. In the case where the destination
    is the local network, the address 0.0.0.0 means no gateway.

    - The genmask is used to separate from the host number the parts of the IP address
    used for the network address.

    - The flags are used to indicate various interface information, like U for up
    and G for gateway. The metric is a measure of how far a packet has to travel to
    its destination (a number greater than 32 is considered to be infinite). The next
    two flags — Ref and Use — aren''t important for this discussion.

    - The Iface field shows which interface is used. (eth refers to an Internet adapter,
    and lo refers to the loopback interface. The loopback interface is used internally
    by the Linux kernel, and you shouldn''t have any need to use it directly.)


    The information about each interface — the routing table — is displayed below
    the headings. For example, the first line tells Linux to send packets destined
    for the addresses 192.168.1.0 through 192.168.1.255 to the Ethernet adapter (eth0).
    The second line deals with the kernel''s internal loopback interface. The third
    and last line, with the address 0.0.0.0, is known as the default route. It defines
    where all packets not covered by a specific route.


    If your table deviates from the example, you may have a routing problem. For example,
    if you don''t have the default route — 0.0.0.0 — you cannot communicate with any
    machines on your LAN or the Internet. If you lack a loopback — 127.0.0.1 — route,
    many internal processes are doomed to fail.


    # Defining a route to the loopback interface


    You must have a route to the loopback interface (also referred to as lo), which
    is the 127.0.0.0 address. If you''re missing either or both parameters, you must
    set them. Set the loopback device — which must be for the network adapter to work
    — type this command:


    ```

    route add -net 127.0.0.0

    ```'
