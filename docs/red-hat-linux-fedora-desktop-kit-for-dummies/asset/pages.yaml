  md: '# Introduction


    Most applications and utilities we describe in this book use a graphical user
    interface (GUI), such as GNOME, which allows you occasionally to control your
    computer by pointing and clicking with your mouse. Occasionally, however, we give
    nongographical instructions that require you to press keys on your keyboard. In
    those situations, we often simplify the instructions by saying "click OK." That
    instruction generally means that you press the Tab key, which moves the cursor
    to the OK button, and then press the Enter key. That two-step process is equivalent
    to clicking an OK button in a GUI.


    # How This Book Is Organized


    With all proper For Dummies books, this book is organized into independent parts.
    You can read the parts in any order. Heck, try reading them backward for a real
    challenge. This book is not meant to be read from front to back; rather, it''s
    meant to be a reference book that helps you find what you''re looking for when
    you''re looking for it. Between the Contents at a Glance page, the table of contents,
    and the index, you should have no problem finding what you need.


    If you do read the chapters in this book in order, you encounter the useful and
    interesting things first and the more technical items last. For example, after
    installing Red Hat Linux in Part I, you may want to proceed immediately to Part
    II to see how to connect Linux to the Internet or your local network. From there,
    you can use your new workstation to surf the Internet and use e-mail.


    The following sections describe each part.


    # Part I: Installing Red Hat Linux


    In Part I, you find out what Linux is and how to prepare your computer to install
    Red Hat Linux. We then walk you through the installation and show you the basics
    of working with Red Hat Linux.


