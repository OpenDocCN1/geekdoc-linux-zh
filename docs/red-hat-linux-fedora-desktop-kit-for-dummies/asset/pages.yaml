  md: '# 234 Part IV: Revenge of the Nerds


    # Creating a localhost zone file


    To create the localhost.zone file, follow these steps:


    +   1. From the Gedit text editor, choose File->New from the menu.

    2. Enter the following configuration. (Of course, you can select the machine names
    you want. The names are arbitrary. In fact, the IP addresses are arbitrary too.
    You can select any nonroutable address space you want.)


    ```

    $TTL 86400 @ root.localhost (

    @ IN SOA

    1 : serial

    28800 : refresh

    7200 : retry

    604800 : expire

    86400 : ttl

    )

    @ IN NS localhost.

    @ IN A 127.0.0.1

    ```


    Semicolons (;) indicate comments. All characters following a semicolon are treated
    as a comment and don''t affect the operation of the DNS configuration files.


    +   3. Save the configuration by choosing File->Save As.

    4. Enter /var/named/local.zone in the Selection box and click OK.


    # Creating the private network zone file


    Next, create the paunchy.zone file, which serves the private network. This file
    contains the A and C records for all machines in your zone (in this case, the
    zone maps directly to the paunchy.net domain).


    +   1. From the Gedit text editor, choose File->New from the menu.

    2. Enter the following configuration. (Of course, you can select your own machine
    names. The names are arbitrary. In fact, the IP addresses are arbitrary too. You
    can select any nonroutable address space you want.)


    ```

    $TTL 86400 @ IN SOA paunchy.net.

    @ root.paunchy.net. (

    200112211

    10800

    3600

    ```


