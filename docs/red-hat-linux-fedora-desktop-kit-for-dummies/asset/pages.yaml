  md: '# Chapter 6


    # Broadband Rocks!


    # In This Chapter


    +   - DSL and cable Internet connections

    - Using cable connections

    - Using DSL connections


    You''re probably familiar with the ubiquitous dial-up Internet connection: You
    log on to the Internet, hear that the screeching modem sound and — presto! whammo!
    — you are online. If you''re lucky, the entire dial-up process takes less than
    a minute, but it can take longer. And then there''s the fact that Web pages take
    so-o-o-ng to build onscreen.


    You have a better way to get online, called broadband. Broadband is a generic
    term for high-speed cable and digital subscriber line (DSL) connections. Cable
    connections are provided by cable television companies, and DSL by telephone companies.
    Both are much faster than dial-up connections, and both have their advantages
    and disadvantages.


    ![](img/453364505e32ffec24f7d88ac7824962_98_0.png)


    > broad in broadband means that wires and cables that connect a modem to the Internet
    have a wide bandwidth; they can handle more data at faster speeds and with greater
    reliability. Old telephone service (POTS) was created for transferring analog
    voice data. Needless to say, POTS just don''t do as well as broadband media when
    it comes to the Internet.


    The two most popular broadband connections you can use to access the Internet
    are cable modems (which use your existing cable television lines to transfer data)
    and DSL (which use fancy-schmancy digital phone lines). Broadband connections
    work from roughly 500 kilobits per second (Kbps) to several million bits per second
    (Mbps). That''s enough to transfer graphics-rich Web pages in a few seconds; it''s
    also enough to listen to several audio streams or to watch a low-resolution video
    stream.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# 78 Part II: Got Net?


    If you''re ready to make the switch to a DSL or cable Internet connection, believe
    us when we tell you you will never want to go back to a dial-up modem. This chapter
    describes how to obtain and configure a broadband connection.


    We recommend advising ISDN, satellite, and mental-telepathy Internet connections.
    The old ISDN technology is rapidly being replaced by DSL. ISDN also difficult
    to configure and isn''t much faster than a dial-up modem connection. Satellite
    Internet connections are just now being introduced and suffer from problems, such
    as transmission delays (latency), that wreak havoc with your communications. Some
    people say that mental telepathy works, but we don''t think that Intel makes a
    chip yet. Satellite systems may improve quickly, but until that happens, we recommend
    using a plain old dial-up modem or, if you can, a DSL or cable modem connection.


    # Introducing DSL and Cable Connections: The Proof Is in the Wiring


    Although the telephone network system is now modern in many ways, its underpinnings
    haven''t fundamentally changed since the early 20th century. The telephone network
    consists of pairs of copper wire that connect homes and businesses with a telephone
    company''s central offices (CO). The phone company use switches in its COs to
    connect to your destination when you make a call. The switches are designed to
    limit the range of frequencies — that a phone call can use. The bandwidth is roughly
    3,000 cycles per second (Hz), enough to recognize a voice but not much more. Those
    limits prevent today''s analog modems from pushing more than approximately 56,000
    bits per second, or 56 Kbps, through the telephone network. (That 56 Kbps speed
    varies, mostly downward, depending on the condition of the copper wires you''re
    connected to.)


    What does all this mean to you? Improve your modem and the wiring, and you get
    faster Internet access. Two of the most commonly used broadband alternatives


    +   Cable television (CATV): Although CATV companies do not provide service to
    as many residences and businesses as the telephone companies do, their fiber and
    coaxial cable networks can carry much more bandwidth than telephone wires can.
    CATV networks don''t have the 3- to 4-mile limits that DSL has. Typically, you
    can get Internet cable through your CATV company if the company offers it and
    if the company serves your neighborhood.'
