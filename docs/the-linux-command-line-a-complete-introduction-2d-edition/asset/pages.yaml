    # Here Documents


    We''ve looked at two different methods of outputting our text, both using the
    echo command. There is a third way called a *here document* or *here script*.
    A here document is an additional form of I/O redirection in which we embed a body
    of text into our script and feed it into the standard input of a command. It works
    like this:


    ```

    command << token

    text

    token

    ```


    where *command* is the name of command that accepts standard input and *token*
    is a string used to indicate the end of the embedded text. Here we''ll modify
    our script to use a here document:


    ```

    #!/bin/bash

    ```


    ```

    # Program to output a system information page

    TITLE="System Information Report For $HOSTNAME"

    CURRENT_TIME=$(date +"%x %xr %Z")

    TIMESTAMP="Generated $CURRENT_TIME, by $USER"

    ```


    ```

    cat << _EOF_

    <html>

    <head>

    <title>$TITLE</title>

    </head>

    <body>

    <h1>$TITLE</h1>

    <p>$TIMESTAMP</p>

    </body>

    </html>

    _EOF_

    ```


    Instead of using echo, our script now uses cat and a here document. The string
    _EOF (meaning *end of file*, a common convention) was selected as the token and
    marks the end of the embedded text. Note that the token must appear alone and
    that there must not be trailing spaces on the line.

    So, what''s the advantage of using a here document? It''s mostly the same as echo,
    except that, by default, single and double quotes within documents lose their
    special meaning to the shell. Here is a command line example:


    ```

    @linuxbox ~$ foo="some text"

    @linuxbox ~$ cat << _EOF_

    ```


