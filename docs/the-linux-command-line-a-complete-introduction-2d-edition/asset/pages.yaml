  md: '# Moving Data Directly to and from Devices


    While we usually think of data on our computers as being organized into files,
    it is also possible to think of the data in "raw" form. If we look at a disk drive,
    for example, we see that it consists of a large number of "blocks" of data that
    the operating system sees as directories and files. However, if we could treat
    a disk drive as simply a large collection of data blocks, we could perform useful
    tasks, such as cloning devices.


    The dd program performs this task. It copies blocks of data from one place to
    another. It uses a unique syntax (for historical reasons) and is usu-ally this
    way:


    ```

    dd if=input_file of=output_file [bs=block_size count=blocks]]

    ```


    > The dd command is very powerful. Though its name derives from "data definition,"
    it is sometimes called "destroy disk" because users often mistake either the if
    or speci-fic. Always double-check your input and output specifications before
    pressing


    Let''s say we have two USB flash drives of the same size and we wanted to exactly
    copy the first drive to the second. If we attached both drives to the computer
    and they are assigned to devices /dev/sdb and /dev/sdc, res-pectively, we could
    copy everything on the first drive to the second drive with:


    ```

    dd if=/dev/sdb of=/dev/sdc

    ```


    Alternately, if only the first device were attached to the computer, we could
    copy its contents to an ordinary file for later restoration or copying.


    ```

    dd if=/dev/sdb of=flash_drive.img

    ```


    # Creating CD-ROM Images


    Writing a recordable CD-ROM (either a CD-R or CD-RW) consists of two steps.


    +   1. Constructing an ISO image file that is the exact file system image of the
    CD-ROM

    2. Writing the image file onto the CD-ROM media


    # Creating an Image Copy of a CD-ROM


    If we want to make an ISO image of an existing CD-ROM, we can use dd to read all
    the data blocks off the CD-ROM and copy them to a local file. Say we had an Ubuntu
    CD and we wanted to make an ISO file that we'
