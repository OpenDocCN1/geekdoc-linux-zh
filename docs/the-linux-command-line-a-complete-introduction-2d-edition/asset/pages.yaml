- img_proc: true
  md: '# Mounting an ISO Image Directly


    There is a trick that we can use to mount an ISO image while it is still on our
    hard disk and treat it as though it were already on optical media. By adding the
    -o loop option to mount (along with the required -t iso9660 file system type),
    we can mount the image file as though it were a device and attach it to the file
    system tree.


    ```

    mkdir /mnt/iso_image

    mount -t iso9660 -o loop image.iso /mnt/iso_image

    ```


    In this example, we created a mounted point named /mnt/iso_image and then mounted
    the image file image.iso at that point. After the image is mounted, it can be
    treated just as though it were a real CD-ROM or DVD. Remember to unmount the image
    when it is no longer needed.


    # Blanking a Rewritable CD-ROM


    Rewritable CD-RW media needs to be erased or blanked before it can be reused.
    To do this, we can use wodim, specifying the device name for the CD writer and
    the type of blanking to be performed. The wodim program offers several types.
    The minimal (and fastest) is the “fast” type.


    ```

    wodim dev=/dev/cdrw blank=fast

    ```


    # Writing an Image


    To write an image, we again use wodim, specifying the name of the optical media
    device and the name of the image file.


    ```

    wodim dev=/dev/cdrw image.iso

    ```


    In addition to the device name and image file, wodim supports a large set of options.
    Two common ones are -v for verbose output, and -dao, which writes the disc in
    disc-at-once mode. This mode should be used if you are preparing a disc for commercial
    reproduction. The default mode for wodim is track-at-once, which is useful for
    recording music tracks.


    # Summing Up


    In this chapter, we looked at the basic storage management tasks. There are, of
    course, many more. Linux supports a vast array of storage devices and file system
    schemes. It also offers many features for interoperability with other systems.'
  merge: -1
