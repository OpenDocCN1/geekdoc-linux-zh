    # ## fmt—A Simple Text Formatter


    The fmt program also formats text, plus it accepts either files or

    standard input and performs paragraph formatting on the text stream.

    Basically, it fills and joins lines in text while preserving blank lines and

    indentation.


    To demonstrate, we''ll need some text. Let''s lift some from the fmt

    info page.


    `fmt reads from the specified FILE arguments (or standard input if none

    are given), and writes to standard output.


    By default, blank lines, spaces between words, and indentation are

    preserved in the output; successive input lines with different

    indentation are not joined; tabs are expanded on input and introduced on


    `fmt prefers breaking lines at the end of a sentence, and tries to avoid

    lines before the first word of a sentence or before the last word of a

    sent. A "sentence break" is defined as either the end of a paragraph

    or a word ending in \?, followed by two spaces or end of a line,

    ingoring any intervening parentheses or quotes. Like Tex, fmt enters into

    "paragraphs" before choosing lines; the algorithm is a variant of

    tby Donald E. Knuth and Michael F. Plass in "Breaking Paragraphs Into

    Lines", Software--Practice & Experience'' 11, 11 (November 1981), 1119-1184.


    We''ll copy this text into your text editor and save the file as fmt-info.txt.

    Now, let''s say we wanted to reform this text to fit a 50-character width

