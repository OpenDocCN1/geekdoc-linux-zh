  md: '# Returning a Process to the Foreground


    A process in the background is immune from interrupt terminal keyboard input,
    including any attempt to interrupt it with CTRL-C. To return a process to the
    foreground, use the fg command in this way:


    ```

    me[linuxbox ~]$ jobs xlogo &

    [1]+ Running

    me[linuxbox ~]$ fg %1

    xlogo

    ```


    The fg command followed by a percent sign and the job number (called a jobspec)
    does the trick. If we have only one background job, the jobspec is optional. To
    terminate xlogo, press CTRL-C.


    # Stopping (Pausing) a Process


    Sometimes we want to stop a process without terminating it. This is often done
    to allow a foreground process to be moved to the background. To stop a foreground
    process and place it in the background, press CTRL-Z. Let''s try it. At the command
    prompt, press xlogo, press ENTER, and then press CTRL-Z.


    ```

    me[linuxbox ~]$ xlogo xlogo

    [1]+ Stopped

    me[linuxbox ~]$

    ```


    After stopping xlogo, we can verify that the program has stopped by attempting
    to resize the xlogo window. We will see that it appears quite dead. We can either
    continue the program''s execution in the foreground, using the fg command, or
    resume the program''s execution in the background with the bg command.


    ```

    me[linuxbox ~]$ bg %1

    [1]+ xlogo &

    me[linuxbox ~]$

    ```


    As with the fg command, the jobspec is optional if there is only one job. Moving
