  md: "# Unanticipated Expansions\n\nIt's possible to have errors that occur only\
    \ intermittently in a script. Sometimes the script will run fine, and other times\
    \ it will fail because of the results of an expansion. If we return our missing\
    \ semicolon and change the value of number to an empty variable, we can demonstrate.\n\
    \n```\n#!/bin/bash\n```\n\n# trouble: script to demonstrate common errors\n\n\
    number=\n\n```\nif [ $number = 1 ]; then\n    echo \"Number is equal to 1\"\n\
    else\n    echo \"Number is not equal to 1\"\nfi\n```\n\nRunning the script with\
    \ this change results in the following output:\n\n```\n[me@linuxbox ~$] trouble\n\
    home/me/bin/trouble: line 7: [ : = unary operator expected\nNumber is not equal\
    \ to 1.\n```\n\nget this rather cryptic error message, followed by the output\
    \ of the second echo command. The problem is the expansion of the number variable\
    \ within the test command. When the following command:\n\n```\n$ number = 1 ]\n\
    ```\n\nundergoes expansion with number being empty, the result is this:\n\n```\n\
    [ = 1 ]\n```\n\nwhich is invalid and the error is generated. The = is a binary\
    \ operator (it requires a value on each side), but the first value is missing,\
    \ so the test command expects a unary operator (such as -z) instead. Further,\
    \ since the test failed (because of the error), the if command receives a non-zero\
    \ exit code and acts accordingly, and the second echo command is executed.\n\n\
    This problem can be corrected by adding quotes around the first argument in the\
    \ test command.\n\n```\n\"$number\" = 1 ]\n```\n\nThen when expansion occurs,\
    \ the result will be:\n\n```\n\"\" = 1 ]\n```"
