  md: '# WHY UNMOUNTING IS IMPORTANT


    If you look at the output of the free command, which displays statistics about
    memory usage, you will see a statistic called buffers. Computer systems are designed
    to go as fast as possible. One of the impediments to system speed is slow devices.
    Printers are a good example. Even the fastest printer is extremely slow by computer
    standards. A computer would be very slow indeed if it had to stop and wait for
    a printer to finish printing a page. In the early days of PCs (before multitasking),
    this was a real problem. If you were working on a spreadsheet or text document,
    the computer would stop and become unavailable every time you printed. The computer
    would send the data to the printer as fast as the printer could accept it, but
    it was very slow because printers don''t print fast. This problem was solved by
    the advent of the printer buffer, a device containing some RAM that would store
    between the computer and the printer. With the printer buffer in place, the computer
    would send the printer output to the buffer, and it would quickly be stored in
    fast RAM so the computer could go back to work without waiting. Meanwhile, the
    printer buffer would slowly pull the data from the buffer''s memory at the speed
    which the printer could accept it.


    Don''t let the occasionally write data to or from devices impede the speed of
    the system. Operating systems store data that has been read and is to write to
    storage devices for as long as possible before actually having to interact with
    the slower device. On a Linux system, for example, you will notice that the system
    seems to fill the memory longer it is used. This does not mean Linux is "using"
    the memory; it means that Linux is taking advantage of all the available memory
    to do as much buffering as it can.


    This buffering allows writing to storage devices to be done very quickly because
    writing to the physical device is being deferred to a future time. In the meantime,
    the data destined for the device is piling up in memory. From time to time, the
    operating system will write this data to the physical device.


    Unmounting a device entails writing all the remaining data to the device so that
    it can be safely removed. If the device is removed without unmounting first, the
    possibility exists that not all the data for the device has been transferred.
    In some cases, this data may include vital directory updates, which will lead
    to file system corruption, one of the worst things that can happen on a computer.


    # Determining Device Names


    It''s sometimes difficult to determine the name of a device. In the old days,
    it device was always in the same place, and it didn''t change. Unix-like systems
    like it that way. When Unix was developed, "changing a disk drive" involving a
    forklift to remove a washing'
