  md: 'These are hard disk partitions. Each line of the file consists of six fields,
    as described in Table 15-1.


    # Table 15-1: /etc/fstab Fields


    | Field | Contents | Description |

    |---|---|---|n| 1 | Device | Traditionally, this field contains the actual name
    of a device file with the physical device, such as /dev/sda (the first partition
    of the first detected hard disk). With today''s computers, which have many devices
    that are hot pluggable (like USB drives), many modern Linux distributions associate
    a device with a text label instead. This label (which is added to the storage
    media when it is formatted) can be either a simple text label or a randomly generated
    UUID (Universally Unique Identifier). This label is read by the operating system
    when the device is attached to the system. That way, no matter which device file
    is assigned to the actual physical device, it can still be correctly identified.
    | Mount point | The directory where the device is attached to the system tree.
    | Options | Most native Linux file systems are Fourth Extended File System (ext4),
    but others are supported, such as FAT16 (isdos), FAT32 (vfat), NTFS (ntfs), CD-ROM
    (iso9960), etc. | File systems can be mounted with various options. It is possible,
    for example, to mount file systems as read-only or to prevent any programs from
    being executed from them (a security feature for removable media). | Frequency
    | A single number that specifies if and when a file system is to be backed up
    with the dump command. | Order | A single number that specifies in what order
    file systems should be checked with the fsck command. |


