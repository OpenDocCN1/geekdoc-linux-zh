  md: '# 31


    # FLOW CONTROL:

    BRANCHING WITH CASE


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_426_0.png)


    In this chapter, we will continue our look at flow control. In Chapter 28, we
    constructed some simple menus and built the logic used to act on a user''s selection.
    To do this, we used a series of if commands to identify which of the possible
    choices had been selected. This type of logical construct appears frequently in
    programs—so much so that many programming languages (including the shell) provide
    a special flow control mechanism for multiple-choice decisions.'
  merge: -1
  pgno: 426
- img_proc: true
  md: "# The case Command\n\nIn bash, the multiple-choice compound command is called\
    \ case. It has the following syntax:\n\n```\ncase word in\n  [pattern | pattern]...)\
    \ commands ;;\nesac\n```\n\nIf we look at the read-menu program from Chapter 28,\
    \ we see the logic used to act on a user's selection.\n\n```\n#!/bin/bash\n\n\
    # read-menu: a menu driven system information program\n\nclear\necho \"\"\nPlease\
    \ Select: \n```\n\n+   1. Display System Information\n2. Display Disk Space\n\
    3. Display Home Space Utilization\n0. Quit\n\n```\nread -p \"Enter selection [0-3]\
    \ > \" \n\nif [[ \"$REPLY\" = ^[0-3] ]]; then\n  if [[ \"$REPLY\" == 0 ]]; then\n\
    \    echo \"Program terminated.\"\n    exit\n  fi\n  if [[ \"$REPLY\" == 1 ]];\
    \ then\n    echo \"Hostname: $HOSTNAME\"\n    uptime\n    exit\n  fi\n  if [[\
    \ \"$REPLY\" == 2 ]]; then\n    df -h\n    exit\n  fi\n  if [[ \"$REPLY\" == 3\
    \ ]]; then\n    if [[ \"$(id -u)\" -eq 0 ]]; then\n      echo \"Home Space Utilization\
    \ (All Users)\"\n    else\n      echo \"Home Space Utilization ($USER)\"\n   \
    \ du -sh \"$HOME\"\n    exit\n  fi\nelse\necho \"Invalid entry.\" >&2\n```"
  merge: -1
  pgno: 427
- img_proc: true
  md: "# exit 1\n\nfi\n\nUsing case, we can replace this logic with something simpler.\n\
    \n```\n#!/bin/bash\n\n# case-menu: a menu driven system information program\n\n\
    clear\necho \"\"\nPlease Select:\n\n1. Display System Information\n2. Display\
    \ Disk Space\n3. Display Home Space Utilization\n0. Quit\n\nread -p \"Enter selection\
    \ [0-3] >\"\n\ncase \"$REPLY\" in\n0)\n    echo \"Program terminated.\"\n    exit\n\
    \    ;;\n1)\n    echo \"Hostname: $HOSTNAME\"\n    uptime\n    ;;\n2)\n    df\
    \ -h\n    ;;\n3)\n    if [[ \"$(id -u)\\ -eq 0 ]]; then\n        echo \"Home Space\
    \ Utilization (All Users)\"\n        du -sh /home/*\n    else\n        echo \"\
    Home Space Utilization ($USER)\"\n        du -sh \"$HOME\"\n    fi\n    ;;\n*)\n\
    \    echo \"Invalid entry\" >&2\n    exit 1\n    ;;\nesac\n```\n\nThe case command\
    \ looks at the value of *word*, which in our example is the value of the REPLY\
    \ variable, and then attempts to match it against one of the specified *patterns*.\
    \ When a match is found, the commands associated with the specified pattern are\
    \ executed. After a match is found, no further matches are attempted.\n\n# Patterns\n\
    \nThe patterns used by case are the same as those used by pathname expansion.\
    \ Patterns are terminated with a ) character. Table 31-1 describes some valid\
    \ patterns."
  merge: -1
  pgno: 428
- img_proc: true
  md: "# Table 31-1: case Pattern Examples\n\n| Pattern | Description |\n|---|---|\n\
    | a) | Matches if *word* equals a. |\n| [[:alpha:]]) | Matches if *word* is a\
    \ single alphabetic character. |\n| ???)) | Matches if *word* is exactly three\
    \ characters long. |\n*.txt | Matches if *word* ends with the characters *.txt\
    \ |\n| *) | Matches any value of *word*. It is good practice to include this as\
    \ the last pattern in a case command to catch any values of *word* that did not\
    \ match a previous pattern, that is, to catch any possible invalid values. |\n\
    \nHere is an example of patterns at work:\n\n```\n#!/bin/bash\n\nread -p \"enter\
    \ word \" \n\ncase \"$REPLY\" in\n  [[:alpha:]]) echo \"is a single alphabetic\
    \ character.\"; \n  [ABC][0-9]) echo \"is A, B, or C followed by a digit.\"; \n\
    \  ???) echo \"is three characters long.\"; \n  *.txt) echo \"is a word ending\
    \ in .txt\"; \n  *) echo \"is something else.\";\nnesac\n```\n\nIt is also possible\
    \ to combine multiple patterns using the vertical bar as a separator. This creates\
    \ an \"or\" conditional pattern. This is useful for such things as handling both\
    \ uppercase and lowercase characters. Here's an example:\n\n```\n#!/bin/bash\n\
    \n# case-menu: a menu driven system information program\n\nclear\necho \"\"\n\
    Select:\nA. Display System Information\nB. Display Disk $space\nC. Display Home\
    \ Space Utilization\nQ. Quit\n\nread -p \"Enter selection [A, B, C or Q] \" \n\
    \ncase \"$REPLY\" in\n  q|Q) echo \"Program terminated.\"\n    exit\n  a|A) echo\
    \ \"Hostname: $HOSTNAME\"\n    uptime\n```\n\n398 Chapter 3"
