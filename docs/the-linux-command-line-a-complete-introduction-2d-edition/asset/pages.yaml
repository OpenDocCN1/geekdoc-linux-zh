    # aspell—Interactive Spellchecker


    The last tool we will look at is aspell, an interactive spelling checker. The
    aspell program is the successor to an earlier program named ispell and can be
    used, for the most part, as a drop-in replacement. While the aspell program is
    mostly used by other programs that require spellchecking capability, it can also
    be used effectively as a stand-alone tool from the command line. It has the ability
    to intelligently check various types of text files, including HTML documents,
    C or C++ programs, email messages, and other kinds of specialized texts.


    To spell a text file containing simple prose, it could be used like this:


    ```

    aspell check textfile

    ```


