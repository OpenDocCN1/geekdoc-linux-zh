  md: '# A Brief History of Printing


    To fully understand the printing features used in Unix-like operating systems,
    we must first learn some history. Printing on Unix-like systems goes back to the
    beginning of the operating system. In those days, printers and how they were used
    were much different from today.


    # Printing in the Dim Times


    Like computers, printers in the pre-PC era tended to be large, expensive, and
    centralized. The typical computer user of 1980 worked at a terminal connected
    to some distance away. The printer was located near the computer and was under
    the watchful eyes of the computer''s operators.


    When printers were expensive and centralized, they were often in the early days
    of Unix, it was common practice for many users to share a printer. To identify
    prints belonging to a particular user, a *banner page* displaying the name of
    the user was often printed at the beginning of each print job. The computer support
    staff would then load up a cart containing the day''s prints and deliver them
    to the individual users.


    # Character-Based Printers


    The printer technology of the 1980s was very different from today in two respects.
    First, printers of that period were almost impact printers. Impact printers used
    a mechanical mechanism that strikes a ribbon against the paper to form character
    impressions on the page. Two of the popular technologies of time were *daisy-wheel
    printing* and *dot-matrix printing*.


    The second, and more important, characteristic of early printers was that printers
    used a fixed set of characters that were intrinsic to the device. For example,
    a daisy-wheel printer could print only the characters molded into the petals of
    the daisy wheel. This made printers like high-speed typewriters. With most typewriters,
    they used monospaced (fixed-width) fonts. This means that each character has the
    same width. Printing was done at positions on the page, and the printarea of a
    page contained a fixed number of characters. Most printers printed 10 characters
    per inch (CPI) horizontally and 6 lines per inch (LPI) vertically. Using this
    scheme, a US-letter size of paper is 85 characters wide and 6 lines high. Taking
    into account a small margin on each side, 80 characters was considered the maximum
    width of a print line. This explains why displays (and our terminators) are normally
    80 characters wide. Using a monospaced font and an 80-character terminal provides
    a what-you-see-what-you-get (WYSIWYG), pronounced "whizzy-whizz" view of printed
    output.


    Data is sent to a typewriter-like printer in a simple stream of bytes containing
    the characters to be printed. For print an *a*, the ASCII character code 97 is
    sent. In addition, the low-numbered ASCII control codes provided a means of moving
    the printer''s carriage and paper, using codes for carriage return, line feed,
    feed, and so on. Using the control codes, it is possible to achieve some limited
    font effects,'
