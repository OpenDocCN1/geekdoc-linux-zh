    ```


    This is a simple script that displays the values of the variables $0–$9.

    Executed when no command line arguments, the result is:


    ```

    [me@linuxbox ~]$ posit-param

    $0 = /home/me/bin/posit-param

    $1 =

    $2 =

    $3 =

