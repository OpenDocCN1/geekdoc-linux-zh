  md: '# Creating New File Systems


    Suppose that we want to reformat the flash drive with a Linux native file system,
    rather than the FAT32 system it has now. This involves two steps.


    +   1. (optional) Create a new partition layout if the existing one is not to
    our liking.

    2. Create a new, empty file system on the drive.


    > **WARNING** In the following exercise, we are going to format a flash drive.
    Use a drive that contains you care about because it will be erased! Again, make
    absolutely sure you are specifying the correct device name for your system, not
    the one shown in the text. Failure to heed this warning could result in formatting
    (i.e., erasing your drive!)


    # Manipulating Partitions with fdisk


    fdisk is one of a host of available programs (both command line and graphical)
    allows us to interact directly with disk-like devices (such as hard drives and
