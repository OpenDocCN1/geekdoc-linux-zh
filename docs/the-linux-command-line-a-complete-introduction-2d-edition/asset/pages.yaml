  md: 'In this example, we copied the /etc, /home, and /usr/local directories from
    our system to our imaginary storage device. We included the --delete option to
    remove files that may have existed on the backup device that no longer existed
    on the source device (this is irrelevant the first time we have a backup but will
    be useful on subsequent copies). Repeating the procedure of attaching the external
    device and running this rsync command would be a (though not ideal) way of keeping
    a small system backed up. Of course, an alias would be helpful here, too. We could
    create an alias and add it to .bashrc file to provide this.


    ```

    alias backup=''rsync --delete /etc /home /usr/local/BigDisk/backup''

    ```


    Now all we need is to attach our external device and run the command to do the
    job.


    # rsync over a Network


    One of the real benefits of rsync is that it can be used to copy files over a
    network. After all, the r in rsync stands for "remote". Remote copying can be
    done in one of ways. The first way is with another system that has rsync installed,
    along with a remote shell program such as ssh. Let''s say we have another system
    on our local network with a lot of available drive space and want to perform our
    backup operation using the remote system instead of an external device. Assuming
    that it already had a directory /backup where we deliver our files, we could this:


    ```

    [linuxbox]$ sudo rsync -av --delete --rsh=ssh /etc /home /usr/local remote-sys:/backup

    ```


    We made changes to our command to facilitate the network copy. First, we added
    the --rsh=ssh option, which instructs rsync to use the ssh-encrypted tunnel to
    securely transfer the data from the local system to the remote host. Second, we
    specified the remote host by prefixing its name (in the case the remote host is
    named remote-sys) to the destination pathname.


    The second way is that rsync can be used to synchronize files over a network.
    rsync server can be configured to run as a daemon and listen to incoming requests
    for synchronization. This is often done allowing mirroring of a remote system.
    For example, Red Hat maintains a large repository of software packages under development
    for Fedora distribution. It is useful for testers to mirror this collection during
    the testing phase of the distribution release cycle. Since files in the repository
    change frequently (often more than once a day), it is desirable to maintain a
    local mirror by periodic synchronization rather than'
  merge: -1
  pgno: 253
