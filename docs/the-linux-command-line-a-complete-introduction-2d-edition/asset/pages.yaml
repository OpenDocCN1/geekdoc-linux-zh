  md: '# WORKING WITH COMMANDS


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_70_0.png)


    Up to this point, we have seen a series of mysterious commands, each with its
    own options and arguments. In this chapter, we will attempt to remove some of
    that mystery and even create our own commands. The commands introduced in this
    chapter are as follows:


    +   type Indicate how a command name is interpreted

    which Display which executable program will be executed

    help Get help for shell builtins

    man Display a command''s manual page

    apropos Display a list of appropriate commands

    info Display a command''s info entry

    whatis Display one-line manual page descriptions

    alias Create an alias for a command'
  merge: -1
