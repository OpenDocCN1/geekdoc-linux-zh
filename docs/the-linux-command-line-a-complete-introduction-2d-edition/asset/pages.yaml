    # Unary Operators


    There are unary operators, + and -, which are used to indicate whether a number
    is positive or negative, respectively. An example is -5.


    # Simple Arithmetic


    Table 34-3: Arithmetic Operators


    | Operator | Description |

    | --- | --- |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Integer division |

    | ** | Exponentiation |

    | % | Modulo (remainder) |


    Most of these are self-explanatory, but integer division and modulo require further
    discussion.

    The shell''s arithmetic operations operate only on integers, the results of division
    are always whole numbers.


    ```

    [me@linuxbox ~]$ echo $((5 / 2))

    2

    ```


    This makes the determination of a remainder in a division operation more important.


    ```

    [me@linuxbox ~]$ echo $((5 % 2))

    1

    ```


    By using the division and modulo operators, we can determine that 5 divided by
    2 results in 2, with a remainder of 1.'
