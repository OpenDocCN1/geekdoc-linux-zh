    The .c files contain the two C programs supplied by the package (style and diction),
    divided into modules. It is common practice for large programs to be broken into
    smaller, easier-to-manage pieces. The source code files are ordinary text and
    can be examined with less


    ```

    [me@linuxbox diction-1.11]$ less diction.c

    ```


    The .h files are known as header files. These, too, are ordinary text. Header
    files contain descriptions of routines included in a source file or library. For
    the compiler to compile the modules, it must receive a description of all the
    modules needed to complete the entire program. Near the beginning of the diction.c
    file, you see this line:


    ```

    #include "getopt.h"

    ```


    This instructs the compiler to read the getopt.h as it reads the source code in
    diction.c to "know" what''s in getopt.c. The diction.c file supplies routines
    that are shared by both the style and diction programs.'
