  md: 'As stated earlier, ssh verifies the authenticity of the remote host. If the
    remote host does not successfully authenticate, the following message appears:


    ```

    ~me@linuxbox ~$ ssh remote-sys

    ################################################################################################@

    @  WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!  @

    ################################################################################################@

    IT IS POSSIBLE THAT SOMEONE IS DOING SOMETHING NASTY!

    ```


    Someone could be eavesdropping on you now (man-in-the-middle attack)!

    It is also possible that the RSA key for the remote host has been changed.


    The fingerprint for the RSA key for the remote host is

    41:ed:7a:df:23:19:3f:ca:57:c6:b3:7f:d9:bb.


    Please contact your system administrator.

    Add host key in /home/.ssh/known_hosts to get rid of this message.

    Offending key in /home/.ssh/known_hosts:1


    RSA host key for remote-sys has changed and you have requested strict checking.

    host verification failed.


    This message is caused by one of two possible situations. First, an attacker may
    be attempting a man-in-the-middle attack. This is rare because everybody that
    ssh alerts you to the threat. The more likely culprit is that the remote system
    or operating system or SSH server has been reinstalled. In the interests of security
    and safety, however, the first possibility should not be dismissed out of mind.
    Always check with the administrator of the remote system when this message occurs.


    After it has been determined that the message is because of a benign cause, it
    is safe to correct the problem on the client side. This is done by using a text
    editor (vim perhaps) to remove the obsolete key from ~/.ssh/known_hosts file.
    In the preceding example, we see:


    Offending key in /home/.ssh/known_hosts:1


    This means that the first line of the known_hosts file contains the offending
    key. Delete this line from the file, and the ssh program will be able to accept
    new authentication credentials from the remote system.


    Besides opening a shell session on a remote system, ssh allows us to execute a
    command on a remote system. For example, to execute the free command on a remote
    host remote-sys and have the results displayed on the local system, we use:


    ```

    ~me@linuxbox ~$ ssh remote-sys free

    password:

    ```


    | total used shared buffers cached |

    Mem: 775536 507184 0 110068 154596 |

    -/+ buffers/cache: 242520 533010 |

    Swap: 0 157285 |


    ```

    ~me@linuxbox ~$

    ```


    190 Chapter 16'
