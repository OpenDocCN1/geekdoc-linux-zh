  md: "# Interactive mode This option will prompt the user for an output file-name\
    \ and will determine whether the specified file already exists. If it does, the\
    \ user will be prompted before existing the existing file is overwritten. This\
    \ option will be specified by -i or --interactive.\n\nHelp Either -h or --help\
    \ may be specified to cause the program to output an informative usage message.\n\
    \nHere is the code needed to implement the command line processing:\n\n```\nusage()\
    \ {\n  echo \"$PROGNAME: usage: $PROGNAME [-f file | -i]\"\n  return\n}\n\n# process\
    \ command line options\n\ninteractive=\nfilename=\n\nwhile [[ -n \"$1\" ]]; do\n\
    \  case \"$1\" in\n    -f | --file)\n      shift\n      filename=\"$1\"\n    \
    \  ;;\n    -i | --interactive)\n      interactive=1\n      ;;\n    -h | --help)\n\
    \      usage\n      exit\n      ;;\n    usage >&2\n      exit 1\n      ;;\n  esac\n\
    done\n```\n\nFirst, we add a shell function used to display a message when the\
    \ help option is invoked or an unknown option is attempted.\n\nNext, we begin\
    \ the processing loop. This loop continues while the positional parameter $1 is\
    \ not empty. At the end of the loop, we have a shift command to advance the positional\
    \ parameters to ensure the loop will eventually terminate.\n\nWithin the loop,\
    \ we have a case statement that examines the current positional parameter to see\
    \ whether it matches any of the supported choices. If a supported parameter is\
    \ found, it is acted upon. If an unknown option is found, the usage message is\
    \ displayed, and the script terminates with an error.\n\nThe -f parameter is handled\
    \ in an interesting way. When detected, it causes an additional shift to occur,\
    \ which advances the positional parameter $1 to the filename argument supplied\
    \ to the -f option.\n\nWe next add the code to implement the interactive mode."
  merge: -1
  pgno: 439
- img_proc: true
  md: "# # interactive mode\n\n```\nif [[ -n \"$interactive\" ]]; then\n    while\
    \ true; do\n        read -p \"Enter name of output file: \" filename\n       \
    \ if [[ -e \"$filename\" ]]; then\n            read -p \"$filename\" exists. Overwrite?\
    \ [y/n] \" REPLY\n            case \"$REPLY\" in\n                Y)\n       \
    \             break;\n                q)\n                    echo \"Program terminated.\"\
    \n                    exit\n                ;;)\n                    continue\n\
    \            esac\n        fi\n    elif [[ -z \"$filename\" ]]; then\n       \
    \ continue\n    else\n        break\n    fi\ndone\nfi\n```\n\nIf the interactive\
    \ variable is not empty, an endless loop is started, which contains the filename\
    \ prompt and subsequent file-handling code. If the desired output file already\
    \ exists, the user is prompted to overwrite, choose another filename, or quit\
    \ the program. If the user chooses to overwrite an existing file, a break is executed\
