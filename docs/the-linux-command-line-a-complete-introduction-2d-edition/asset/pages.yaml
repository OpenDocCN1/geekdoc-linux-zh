    |

    | drwxr-xr--- | A directory. The owner and the members of the owner group enter
    the directory and create, rename, and remove files within the directory. |

    | drwxr-xr-x--- | A directory. The owner may enter the directory and create, rename,
    and delete files within the directory. Members of the owner group may enter the
    directory but cannot create, delete, or rename files.|


    # chmod: Change File Mode


    To change the mode (permissions) of a file or directory, use the chmod command.
    Be aware that only the file''s owner or the superuser can change the mode of a
    file or directory. chmod supports two distinct ways of specifying mode changes.


    +   * Octal number representation

    * Symbolic representation


    We will cover octal number representation first. With octal notation, we use octal
    numbers to set the pattern of desired permissions. Because each digit in an octal
    number represents three binary digits, this maps nicely to the scheme used to
    store the file mode. Table 9-4 shows what we mean.'
