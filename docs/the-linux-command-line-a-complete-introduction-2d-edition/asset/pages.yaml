    # printf—Format and Print Data


    Unlike the other commands in this chapter, the printf command is not used for
    pipelines (it does not accept standard input) nor does it find frequent application
    on the command line (it''s mostly used in scripts). Why is it important? Because
    it is so widely used.


    printf (from the phrase print formatted) was originally developed for the C programming
    language and has been implemented in many programming languages including the
    shell. In fact, bash, printf is a builtin.


    printf "format" works this:


    The command is given string containing a format description, which is then applied
    to a list of arguments. The formatted result is sent to standard output. Here
    is a trivial example:


    ```

    [me@linux~$]$ printf "I formatted the string: %s\n" foo

    formatted the string: foo

    ```


    The string may contain literal text (like "formatted the string;"), escape sequences
    (such as \n, a newline character), and sequences beginning with the % character,
    which are called conversion specifications. In the preceding example, the conversion
    specification %s is used to format the string "foo" and place it in the command''s
    output. Here it is again:


    ```

    [me@linux~$]$ printf "I formatted ''%s'' as a string.\n" foo

    formatted ''foo'' as a string.

    ```


    As we can see, the % conversion specification is replaced by the string "foo"
    in the command''s output. The %s conversion is used to format string data. There
    are other specifiers for other kinds of data. Table 21-4 lists the commonly used
    data types.


    # Table 21-4: Common printf Data Type Specifications


    | Specifier | Description |

    |---|---|n| d | Format a number as a signed decimal integer. |

    | f | Format and output a floating-point number. |

    | o | Format an integer as an octal number. |

    | s | Format a string. |

    | x | Format an integer as a hexadecimal number using lowercase a to f where needed.
    |

    | X | Same as x but use uppercase letters. |

    | % | Print a literal % symbol (i.e., specify%%). |'
