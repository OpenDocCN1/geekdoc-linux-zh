    Once the less program starts, we can view the contents of the file. If the file
    is longer than one page, we can scroll up and down. To exit, press q. Table 3-3
    lists the most common keyboard commands used by less.


    # Table 3-3: less Commands


    | Command | Action |

    | PAGE up or b | Scroll back one page |

    | PAGE DOWN or space | Scroll forward one page |

    | Up arrow | Scroll up one line |

    | Down arrow | Scroll down one line |

    | G | Move to the end of the text file |

    | 1G or g | Move to the beginning of the text file |

    | /characters | Search forward to the next occurrence of characters |

