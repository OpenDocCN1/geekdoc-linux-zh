- img_proc: true
  md: 'Another interesting behavior of tar is the way it handles pathnames in archives.
    The default for pathnames is relative, rather than absolute. tar does this by
    simply removing any leading slash from the pathname when creating our archive.
    To demonstrate, we will re-create our archive, this time specifying an absolute
    pathname.


    ```

    @me@linuxbox$ cd

    @me@linuxbox~$ tar cf playground2.tar ~/playground

    ```


    Remember, ~/playground will expand into /home/me/playground when we enter, so
    we will get an absolute pathname for our demonstration. Next, we will extract
    the archive as before and watch what happens.


    ```

    @me@linuxbox ~$ cd foo

    @me@linuxbox~$ tar xf ../playground2.tar

    @me@linuxbox~$ ls

    home

    @me@linuxbox foo$ ls

    me

    @me@linuxbox foo$ ls home/me

    playground

    ```


    Here we can see that we have extracted our second archive, re-created the directory
    /home/me/playground relative to our current working directory,~/ not relative
    to the root directory, as would have been the case with an absolute pathname.
    This might seem like an odd way for it to work, but it''s actually more useful
    because it allows us to extract archives to any location rather than being forced
    to extract them to their original locations. Repeating the exercise with the inclusion
    of the verbose option (v) will give a clearer picture of what''s going on.


    Let''s consider a hypothetical, yet practical, example of tar action. Imagine
    we want to copy the home directory and its contents from one system to another
    and have a large USB drive that we can use for the transfer. On our modern Linux
    system, the drive is "automatically" mounted at the /media directory. Let''s also
    imagine that the disk has a volume name of BigDisk when we attach it. To make
    the tar archive, we can do:


    ```

    @me@linuxbox ~$ sudo tar cf /media/BigDisk/home.tar ~/home

    ```


    After the tar file is written, unmount the drive and attach it to the second computer.
    Again, it is mounted at /media/BigDisk. To extract the archive, we do:


    ```

    @me@linuxbox2 ~$ cd /

    @me@linuxbox2 ~$ sudo tar xf /media/BigDisk/home.tar

    ```


    What''s important to see here is that we must first change directory to / so that
    the extraction is relative to the root directory since all pathnames within the
    archive are relative.'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'When extracting an archive, it''s possible to limit what is extracted from
    the archive. For example, if we wanted to extract a single file from an archive,
    it could be done like this:


    ```

    tar x archive.tar pathname

    ```


    By adding the trailing pathname to the command, tar will restore only the specified
    file. Multiple pathnames may be specified. Note that the path-name must be the
    full, exact relative pathname stored in the archive. When specifying pathnames,
    wildcards are not normally supported; how-ever, the GNU version of tar (which
    is the version most often found in Linux distributions) supports them with the
    --wildcards option. Here is an example using our previous playground.tar file:


    ```

    @linux ~$ cd foo

    @linux foo$ tar x ../playground.tar --wildcards ''home/me/playground/dir-*/file-A''

    ```


    This command will extract only files matching the specified pathname and tar is
    used in conjunction with find to produce archives. In this, we will use find to
    produce a set of files to include in an archive.


    ```

    @linux ~$ find playground -name ''file-A'' -exec tar playground.tar ''{}'' ''+''

    ```


    Here we use find to match all the files in playground named file-A and then, using
    the -exec action, we invoke tar in the append mode (r) to add the matching files
    to the archive playground.tar.

    Using tar with find is a great way of creating incremental backups of a directory
    tree or an entire system. By using find to match files newer than a timestamp,
    we could create an archive that contains only files newer than the last, assuming
    that the timestamp is updated right after each archive is created.

    tar can also use both standard input and output. Here is a comprehensive example:


    ```

    @linux foo$ cd

    @linux ~$ find playground -name ''file-A'' | tar cf --files-from=- | gzip > playground.tgz

    ```


    In this example, we used the find program to produce a list of matching files
    and pipe them into tar. If the filename is specified, it is better to use standard
    input or output, as needed. By this way, convention of using standard input/output
    is used by a number of other programs, too. The --files-from option (which may
    be specified as -T) causes tar to read its list of pathnames from a file rather
    than the command line. Lastly, the archive produced by tar playground.tgz. The
    .tgz extension is the conventional extension given to gzip-compressed files. The
    extension .tar.gz is also used sometimes.'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'While we used the gzip program externally to produce our compressed archive,
    modern versions of GNU tar support gzip and bzip2 compression directly with the
    use of the z and j options, respectively. Using our previous example as a base,
    we can simplify it this way:


    ```

    [me@linuxbox ~]$ find playground -name ''file-A'' | tar czf playground.tgz -T
    -

    ```


    If we wanted to create a bzip2-compressed archive instead, we have done this:


    ```

    [me@linuxbox ~]$ find playground -name ''file-A'' | tar cjf playground.tbz -T
    -

    ```


    By simply changing the compression option from z to j (and changing the output
    file extension to .bz to indicate a bzip2-compressed file), we enabled bzip2 compression.


    Another interest of using standard input and output with the command involves
    transferring files between systems over a network. Imagine we had two machines
    running a Unix-like system equipped with tar and ssh. In such a scenario, we could
    transfer a directory from a remote system (named remote-sys for this) to our local
    system.


    ```

    [me@linuxbox ~]$ mkdir remote-stuff

    [me@linuxbox ~]$ cd remote-stuff

    [me@remote-sys ~]$ ssh remote-sys ''tar cf - Documents | tar xf -

    me@remote-sys password:

    [me@remote-stuff ~]$ ls

    Documents

    ```


    Here are how to copy a directory named Documents from the remote system-sys to
    a directory named remote-stuff on the local system. How did we do this? First,
    we launched the tar program on the remote system using ssh. You will recall that
    ssh allows us to execute a program remotely on a networked computer and "sec"
    on the local system—the standard output produced on the remote system is sent
    to the local system for viewing. We can take advantage of this by having tar create
    an archive (the c mode) and send it to standard output, rather than a file (the
    f option with the dash argument), transporting the archive over the encrypted
    tunnel provided by ssh to the local system. On the local system, we execute tar
    and have it expand an archive (the x mode) supplied from standard input (again,
    the f option with the dash argument).


    # zip


    The zip program is both a compression tool and an archiver. The file format used
    by the program is familiar to Windows users, as it reads and writes .zip files.
    In Linux, however, bzip2 is the dominant compression program, with bzip2 being
    a close second.


    In its most basic usage, zip is invoked like this:


    ```

    zip options zipfile...

    ```'
