  md: '# CREATING SYMLINKS WITH THE GUI


    The file managers in both GNOME and KDE provide an easy and automatic method of
    creating symbolic links. With GNOME, holding the CTRL-SHIFT keys while dragging
    a file will create a link rather than copying (or moving) the file. In KDE, a
    small menu appears whenever a file is dropped, offering a choice of copying, moving,
    or linking the file.


    # Summing Up


    We''ve covered a lot of ground here, and it will take a while for it all to fully
    sink in. Perform the playground exercise over and over until it makes sense. It
    is important to get a good understanding of basic file manipulation commands and
    wildcards. Feel free to expand on the playground exercise by adding more files
    and directories, using wildcards to specify files for various operations. The
    concept of links is a little confusing at first, but take the time to learn how
    they work. They can be a real lifesaver!'
