  md: '# Table 22-1: Common pr Options


    | Option | Description |

    | +first[:last] | Output a range of pages starting with first and, optionally,
    ending with last. |

    | -columns | Organize the content of the page into the number of columns specified
    by columns. |

    | -a | By default, multicolumn output is listed vertically. By adding the -a (across)
