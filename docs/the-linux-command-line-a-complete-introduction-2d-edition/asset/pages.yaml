    | h | Display help screen |

    | q | Quit |


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_49_0.png)


    > The less program was designed as an improved replacement of an earlier Unix
    program called more. The name less is a play on the phrase "less more"—a motto
    of modernist architects and designers. less falls into the class of programs called
    pagers, programs that allow the easy viewing of long text documents in a page-by-page
    manner. Whereas the more program could only page paging both forward and backward
    and has many other features as well.


    # Taking a Guided Tour


    The file system layout on a Linux system is much like that found on other Unix-like
    systems. The design is actually specified in a published standard called the Linux
    Filesystem Hierarchy Standard. Not all Linux distributions conform to the standard
    exactly, but most pretty close.'
