  md: 'All other characters are considered literals. With ERE, the following metacharacters
    (and their associated functions) are added:


    ```

    () { } ? |

    ```


    However (and this is the fun part), ( ), {, and } characters are treated as metacharacters
    in BRE if they are escaped with a backslash, whereas in ERE, preceding any metacharacter
    with a backslash causes it to be treated as a literal. Any weirdness that comes
    will be covered in the discussions that follow.


    Because the features we are going to discuss next are part of ERE, we are going
    to need use a different grep. Traditionally, this has been performed by the egrep
    program, the GNU version of grep also supports extended regular expressions when
    the -e option is used.


    # POSIX


    During the 1980s, Unix became a very popular commercial operating system, but
    by 1988, the Unix world was in turmoil. Many computer manufacturers had licensed
    the Unix source code from its creators, AT&T, and were supplying various versions
    of the operating system with their systems. However, in their efforts to create
    product differentiation, each manufacturer added proprietary changes and extensions.
    This started to limit the compatibility of the software. As always with proprietary
    vendors, each was trying to play a winning game of "lock in" with their customers.
    This dark time in the history of Unix is known as Balkanization.


    Enter the Institute of Electrical and Electronics Engineers (IEEE). In the mid1980s,
    the IEEE began developing a set of standards that would define what (and Unix-like)
    systems would perform. These standards, formally known as IEEE 1003, define the
    application programming interfaces (APIs), shell, and utilities that are to be
    found on a standard Unix-like system. The name POSIX, which stands for Portable
    Operating System Interface (with the X added to the end for extra snuffiness),
    was suggested by Richard Stallman (yes, that was and adopted by the IEEE.


    # Alternation


    The first of the extended regular expression features will be discuss called alternation,
    which is the facility that allows a match to occur among a set of expressions.
    Just as a bracket expression allows a single character to match a set of specified
    characters, alternation matches from a set of strings or other regular expressions.


    To demonstrate, we''ll use grep in conjunction with echo. First, let''s try a
    plain old string match.'
