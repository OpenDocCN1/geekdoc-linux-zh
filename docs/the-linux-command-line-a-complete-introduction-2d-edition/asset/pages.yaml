  md: "# Trying Some Alternative Prompt Designs\n\nWith this list of special characters,\
    \ we can change the prompt to see the effect. First, we'll back up the existing\
    \ prompt string so we can restore it later. To do this, we will copy the existing\
    \ string into another shell variable that we create ourselves.\n\n```\nme@linuxbox\
    \ ~]$ ps1_old=\"PS1\"\n```\n\nWe create a new variable called ps1_old and assign\
    \ the value of PS1 to it. We can verify that the string has been copied by the\
    \ echo command.\n\n```\nme@linuxbox ~]$ echo ps1_old\\n\\u \\ h \\$\\\n```\n\n\
    We can restore the original prompt at any time during our terminal session by\
    \ reversing the process.\n\n```\nme@linuxbox ~]$ PS1=\"$ps1_old\"\n```\n\nNow\
    \ that we are ready to proceed, let's see what happens if we have an empty prompt\
    \ string.\n\n```\nme@linuxbox ~]$ PS1=\n```\n\nIf we assign nothing to the prompt\
    \ string, we get nothing. No prompt at all! The prompt is still there but displays\
    \ nothing, just as we asked it to do. Because this is kind of disconcerting to\
    \ look at, we'll replace it with a minimal prompt.\n\n```\nPS1=\"\\ \n```\n\n\
    That's better. At now we can see what we are doing. Notice the trailing space\
    \ within the double quotes. This provides the space between the dollar sign and\
    \ the cursor when the prompt is displayed.\nLet's add a bell to our prompt.\n\n\
    ```\n$ PS1=\"\\[a\\]\\$ \"\n```\n\nNow we hear a beep each time the prompt is\
    \ displayed, though some systems disable this \"feature.\" This could be annoying,\
    \ but it might be useful if we needed notification when an especially long-running\
    \ command has executed. We noted that we included \\[ and \\ sequences. Since\
    \ the ASCII bell (a) does not \"print,\" that is, it does not move the cursor,\
    \ we need to tell bash so we can correctly determine the length of the prompt.\n\
    \nNext, let's try to make an informative prompt with some hostname and time-of-day\
    \ information."
