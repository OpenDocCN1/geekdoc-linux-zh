    \ -h)</pre>\nEOF\n  return\n}\n```\n\nThis function uses the df -h command to\
    \ determine the amount of disk space. Lastly, we'll build the report_home_space\
    \ function.\n\n```\nreport_home_space () {\ncat <<-EOF\n<h2>Home Space Utilization</h2>\n\
    <pre>$(du -sh //*)</pre>\nEOF\n  return\n}\n```\n\nWe use the du command with\
    \ the -sh options to perform this task. This, however, is not a complete solution\
    \ to the problem. While it will work on some systems (Ubuntu, for example), it\
    \ will not work on others. The reason is that many systems sets the permissions\
    \ of home directories to prevent them from being world-readable, which is a reasonable\
    \ security measure. On these systems, the report_home_space function, as written,\
    \ will only work if our script is run with superuser privileges. A better solution\
    \ would be to have the script adjust its behavior according to the privileges\
    \ of the user. We will take this in the next chapter."
