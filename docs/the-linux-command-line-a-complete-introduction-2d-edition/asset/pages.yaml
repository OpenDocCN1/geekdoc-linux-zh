  md: "In this script, we prompt the user to enter a username and use the environment\
    \ variable USER to provide a default value. When the script is run, it displays\
    \ the default string, and if the user presses ENTER, read will assign the default\
    \ string to the REPLY variable.\n\n```\n$melinuxbox ~]$ read-default\nWhat is\
    \ your user name? me\nYou answered: 'me'\n```\n\n# IFS\n\nNormally, the shell\
    \ performs word-splitting on the input provided to read. As we have seen, this\
    \ means that multiple words separated by one or more spaces become items on the\
    \ input line and are assigned to separate variables by read. This behavior is\
    \ configured by a shell variable IFS (for Internal Field Separator). The default\
    \ value of IFS contains a space, a tab, and a newline character, each of which\
    \ will split items from one.\n\nWe can adjust the value of IFS to control the\
    \ separation of fields to read. For example, the /etc/passwd file lines of data\
    \ that use the colon character as a field separator. By changing the value of\
    \ IFS to a single colon, we can read to input the contents of /etc/passwd and\
    \ successfully separate fields into different variables. Here we have a script\
    \ that does just:\n\n```\n#!/bin/bash\n\n# read-ifs: read fields from a file\n\
    \nFILE=/etc/passwd\n\nread -p \"Enter a username > \" user_name\n\nfile_info=$(grep\
    \ \"^$user_name:\" \"FILE\")\n\nif [ -n \"$file_info\" ]; then\n  IFS=\\: read\
    \ pw uid gid name home shell <<< \"$file_info\"\n  echo \"User = $pw\"\n  echo\
    \ \"UID = $uid\"\n  echo \"GID = $gid\"\n  echo \"Full Name = $name\"\n  echo\
    \ \"Home Dir. = $home\"\n  echo \"Shell = $shell\"\nelse\n  echo \"No such user\
    \ '$user_name' >&2\n  exit 1\n```"
