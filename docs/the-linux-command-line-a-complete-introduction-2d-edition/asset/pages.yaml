  md: 'command''s execution. By convention, a value of zero indicates success and

    an other value indicates failure. The shell provides a parameter that we

    use to examine the exit status. Here we see it in action:


    ```

    [me@linux ~$] ls -d /usr/bin

    usr/bin

    [me@linux ~$] echo $?

    0

    ```


    ```

    [me@linux ~$] ls -d /bin/usr

    ls: cannot access /bin/usr: No such file or directory

    [me@linux ~$] echo $?

    2

    ```


    In this example, we execute the ls command twice. The first time, the

    command executes successfully. If we display the value of the parameter $?

    we see that it is zero. We execute the ls command second time (specifying

    a nonexistent directory), producing an error, and examine the parameter

    $ again. This time it contains a 2, indicating that the command encountered

    er error. Some use different exit statuses to provide

    diagnostics for error, while many simply exit with a value of

    1 when they fail. Man pages often include a section titled "Exit Status,

    describing what codes are used. However, a zero always indicates success.


    The shell provides two extremely simple commands that do

    nothing except terminate with either a 0 or 1 exit status. The truecommand always
    executes successfully, and the false command always executes unsuccessfully.


    ```

    [me@linux ~$] true

    [me@linux ~$] echo $?

    0

    [me@linux ~$] false

    [me@linux ~$] echo $?

    1

    ```


    We can use these commands to see how the if statement works. What

    t statement properly evaluates the success or failure of commands.


    ```

    [me@linux ~$] if true; then echo "It''s true.\ fi

    It''s true.

    [me@linux ~$] if false; then echo "It''s true.\ fi

    [me@linux ~$]$

    ```


    The command echo "It''s true" is executed when the command following if executes
    successfully and is not executed when the command following

    is not execute successfully. If a list of commands follows if, the last command

    in in the list is evaluated.


    ```

    [me@linux ~$] if true; then echo "It''s true.\ fi

    It''s true.

    [me@linux ~$] if false; then echo "It''s true."; fi

    [me@linux ~$]$

    ```'
