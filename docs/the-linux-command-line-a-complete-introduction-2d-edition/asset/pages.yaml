- img_proc: true
  md: '```

    [me@linuxbox] $ foo="This string is long"

    [me@linuxbox] $ echo "\${foo} characters long"

    "This string is long." is 20 characters long.

    ```


    The following expansions are used to extract a portion of the string contained
    in parameter:


    ```

    ${parameter:offset}

    ${parameter:offset:length}

    ```


    The extraction begins at offset characters from the beginning of the string and
    continues until the end of the string, unless length is specified.


    ```

    [me@linuxbox] $ foo="This string is long"

    [me@linuxbox] $ echo \${foo:5}

    string is long.

    [me@linuxbox] $ echo \${foo:5:6}

    string

    ```


    If the value of offset is negative, it is taken to mean it starts from the end
    of the string rather than the beginning. Note that values must be preceded by
    a space to prevent confusion with the ${parameter:-word} expansion. length, if
    present, must not be less than zero.

    If parameter is @, the result of the expansion is length positional parameter,
    starting at offset.


    ```

    [me@linuxbox] $ foo="This string is long"

    [me@linuxbox] $ echo \${foo:-5}

    long.

    [me@linuxbox] $ echo \${foo:-5:2}

    lo

    ```


    The following expansions remove a leading portion of the string contained in parameter
    defined by pattern.


    ```

    ${parameter#pattern}

    ${parameter##pattern}

    ```


    pattern is a wildcard pattern like those used in pathname expansion. The difference
    in the two forms is that the # form removes the shortest match, while the ## form
    removes the longest match.


    ```

    [me@linuxbox] $ foo=file.txt.zip

    [me@linuxbox] $ echo \${foo*}

    txt.zip

    [me@linuxbox] $ echo \${foo##}.

    zip

    ```'
