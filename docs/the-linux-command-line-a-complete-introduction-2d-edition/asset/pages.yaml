- img_proc: true
  md: 'While many of the files on our system are familiar, for example, MP3 and JPEG
    files, there are many kinds that are a little less obvious and a few that are
    quite strange.


    # # Viewing File Contents with less


    The less command is a program to view text files. Throughout our Linux system,
    there are many files that contain human-readable text. The less program provides
    a convenient way to examine them.


    Why would we examine text files? Because many of the files that contain system
    settings (*called configuration files*) are stored in this format, and being able
    to read them gives insight about how the system works. In addition, some of the
    actual programs that the system uses (*called scripts*) are stored in this format.
    In later chapters, we will learn how to edit text files in order to write our
    own scripts, but for now we will just look at their contents.


    The less command is used like this:


    ```

    less filename

    ```


    # ## WHAT IS "TEXT"?


    There are many ways to represent information on a computer. All methods involve
    defining a relationship between the information and some numbers that will be
    used to represent it. Computers, after all, understand only numbers, and all data
    is converted to numeric representation.

    Some of these representation systems are very complex (such as pressed video files),
    while others are simple. One of the earliest and simplest is ASCII text. ASCII
    (pronounced "as-key") is short for American Standard Code for Information Interchange.
    This is a simple encoding scheme that was first used on Teletype machines to map
    keyboard characters to numbers.


    Text is a one-to-one mapping of characters to numbers. It is very complex. Cipher
    of text translates to bytes of data. It is important to understand that text only
    contains a simple mapping of characters to numbers. It is not the same as a word
    processor document as one created by Microsoft Word or LibreOffice. Those files,
    in contrast to simple ASCII, contain many non-text elements that are used to describe
    its structure and formatting. Plain ASCII text files contain only the characters
    themselves and a few rudimentary control codes as tabs, carriage returns, and
    line feeds.

    Throughout a Linux system, many files are stored in text format, and there are
    many Linux tools that work with text files. Even Windows recognizes the importance
    of this format. The well-known NOTEPAD.EXE program is an editor for plain ASCII
    text files.'
