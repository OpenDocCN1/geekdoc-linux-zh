- img_proc: true
  md: '# lpr-Print Files (Berkeley Style)


    The lpr program can be used to send files to the printer. It may also be used
    in pipelines, as it accepts standard input. For example, to print the results
    of our previous multicolumn directory listing, we could do this:


    ```

    @melinuxbox]$ ls /usr/bin | pr -3 | lpr

    ```


    The report would be sent to the system''s default printer. To send the file to
    a different printer, the -P option can be used like this:


    ```

    lpr -P printer_name

    ```


    Here, printer_name is the name of the desired printer. To see a list of printers
    known to the system, use this:


    ```

    @melinuxbox]$ lpstat -a

    ```


    Many Linux distributions allow you to define a "printer" that outputs files to
    PDF, rather than printing on the physical printer. This is handy for experimenting
    with printing commands. Check your printer configuration program to see whether
    it supports this configuration. On some distributions, you may need to install
    additional packages (such as cups-pdf) to enable this capability.


    Table 22-2 describes the common options for lpr.


    Table 22-2: Common lpr Options

    | Option | Description |

    | --- | --- |

    | -n | Set number of copies to number. |

    | -p | Print each page with a shaded header with the date, time, job name, and
    page number. This so-called pretty-print option can be used when printing text
    files. |

    | -P printer | Specify the name of the printer used for output. If no printer
    is specified, the system''s default printer is used. |

    | -r | Delete files after printing. This would be useful for programs that produce
    temporary printer-output files. |


    # lpr-Print Files (System V Style)


    Like lpr, it accepts either files or standard input for printing. It differs from
    lpr in that it supports a different (and slightly more sophisticated) option set.
    Table 22-3 describes the common options.'
  merge: -1
