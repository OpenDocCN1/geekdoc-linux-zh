  md: '# ftp


    One of the true "classic" programs, ftp gets its name from the protocol

    uses, the File Transfer Protocol. FTP was once the most widely used method of

    downloading files over the Internet. Most, if not all, web browsers support

    it, and you often see URIs starting with the protocol ftp://.


    Before there were browsers, there was the ftp program. ftp is used

    to communicate with FTP servers, machines that contain files that can be

    upload and downloaded over a network.


    FTP (in its original form) is not secure because it sends account names

    and passwords in cleartext. This means they are not encrypted, and anyone

    sning the network can see them. Because of this, almost all FTP done

    the Internet is done by anonymous FTP servers. An anonymous server allows

    to to log in using the login name "anonymous" and a meaningless

    password.


    In the example that we follow, we show a typical session with the ftp pro-

    gloading an Ubuntu iso image located in the /pub/cd_images/

    ubuntu-18.04 directory of the anonymous FTP fileserver:


    ```

