- img_proc: true
  md: 'the distribution, and the user is given the convenience of "one-stop shopping"
    for software, rather than having to search for each program''s website. Recently,
    major proprietary platform vendors have begun building application stores that
    mimic this idea.


    Device drivers are handled in the same way, except instead of being separate items
    in a distribution repository, they become part of the Linux kernel. Generally
    speaking, there is no such thing as a "driver disk" in Linux. Either the kernel
    supports a device or it doesn''t, and the Linux kernel supports a lot of devices—many
    more, in fact, Windows does. Of course, there is no consolation if the particular
    device you need is not supported. When that happens, you need to look at the cause.
    A lack of driver support is usually caused by one of three things:


    +   * **The device is too new.** Since many hardware vendors don''t actively support
    Linux development, it falls upon a member of the Linux community to write the
    kernel driver code. This takes time.


    +   * **The device is too exotic.** Not all distributions include every possible
    device driver. Each distribution builds its own kernels, and since kernels are
    configurable (which is what makes it possible to run Linux on everything from
    wristwatches to mainframes), they may have overlooked a particular device. By
    locating and downloading the source code for the driver, it is possible for you
    (yes), to compile and install the driver yourself. This process is not overly
    difficult, but it is rather involved. We''ll talk about this in a later chapter.


    +   * **The hardware vendor is hiding something.** It has neither released source
    code for a Linux driver nor has released the technical documentation for somebody
    to create one for them. This means the hardware vendor is trying to keep the programming
    interfaces to the device a secret. Because we don''t want secret devices in our
    computers, it is best that you avoid such products.'
