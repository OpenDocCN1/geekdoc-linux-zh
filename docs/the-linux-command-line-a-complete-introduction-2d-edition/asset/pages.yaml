- img_proc: true
  md: 'It''s possible to use this technique in more interesting ways, such as the
    following example in which we perform an ls on the remote system and redirect
    the output to a file on the local system:


    ```

    me@linuxbox ~$ ssh remote-sys ''ls * > dirlist.txt

    me@twin4~$ password:

    me@linuxbox ~$

    ```


    Notice the use of the single quotes in the preceding command. This is done because
    we do not want the pathname expansion performed on the local machine; rather,
    we wanted it to be performed on the remote system. Likewise, if we wanted the
    output redirected to a file on the remote machine, we could have placed the redirection
    operator and the filename within the single quotes.


    ```

    me@linuxbox ~$ ssh remote-sys ''ls * > dirlist.txt''

    ```


    # TUNNELING WITH SSH


    Part of what happens when you establish a connection with a remote host via SSH
    is that an encrypted tunnel is created between the local and remote systems. Normally,
    this tunnel is used to allow commands typed at the local system to be transmitted
    safely to the remote system and for the results to be transmitted safely back.
    In addition to this function, the SSH protocol allows most types of network traffic
    to be sent through the encrypted tunnel, creating a sort of virtual private network
    (VPN) between the local and remote systems.


    Perhaps the most common use of this feature is to allow X Window system traffic
    to be transmitted. On a system running an X server (which is, a machine displaying
    a GUI), it is possible to launch and run an X client (a graphical application)
    on a remote system and have its display appear on the local system. It is easy
    to do; here''s an example. Let''s say we are sitting at a Linux system called
    linuxbox that is running on a remote system named remote-sys to see the program''s
    graphical output on our local system. We could do this:


    ```

    me@linuxbox ~$ ssh -X remote-sys

    me@remote-sys~$ password:

    Last login: Mon Sep 10 13:23:11 2018

    me@remote-sys ~$ xload

    ```


    After the xload command is executed on the remote system, your window appears
    on the local system. On some systems, you may need to use the -Y option rather
    than the -X option to do this.'
