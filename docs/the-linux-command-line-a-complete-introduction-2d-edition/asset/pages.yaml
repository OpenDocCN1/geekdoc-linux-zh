    # POSIX Character Classes


    The traditional character ranges are an easily understood and effective way to
    handle the problem of quickly specifying sets of characters. Unfortunately, they
    don''t always work. While we have not encountered any problems with our use of
    grep so far, we might run into problems using other programs.


    In Chapter 4, we looked at how wildcards are used to perform path expansion. In
