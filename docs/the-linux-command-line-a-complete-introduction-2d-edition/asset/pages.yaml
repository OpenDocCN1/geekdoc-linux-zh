  md: '# Table 9-4: File Modes in Binary and Octal


    | Octal | Binary | File mode |

    |---|---|---|

    | 0 | 000 | --- |

    | 1 | 001 | --x |

    | 2 | 010 | -w- |

    | 3 | 011 | -wx- |

    | 4 | 100 | r-- |

    | 5 | 101 | r-x |

    | 6 | 110 | rw- |

    | 7 | 111 | rwx |


    By using three octal digits, we can set the file mode for the owner, group owner,
    and world.


    ```

    [me@linux ~] $ foo.txt

    [me@linux ~] $ ls -l foo.txt

    --rw---- 1 me 2018-03-06 14:52 foo.txt

    [me@linux ~] $ chmod 600 foo.txt

    [me@linux ~] $ ls -l foo.txt

    --rw------ 1 me 2018-03-06 14:52 foo.txt

    ```


    By passing the argument 600, we were able to set the permissions of the owner
    to read and write while removing all permissions from the group owner and world.
    Though mapping the octal to binary may seem inconvenient, you usually have to
    use only a few common ones: 7 (rwx), 6 (rw-), 5 (r-x), 4 (r--), and 0 (--- chmod
    also supports a symbolic notation for specifying file modes. Symbolic notation
    is divided into three parts.


    +   * Who the change will affect

    * Operation will be performed

    * What permission will be set


    To specify who is affected, a combination of the characters u, g, o, and a is
    used, as shown in Table 9-5.


    # Table 9-5: chmod Symbolic Notation


    | Symbol | Meaning |

    |---|---|

    | u | Short for "user" but means the file or directory owner |

    | g | Group owner |

    | o | Short for "others" but means world |

    | a | Short for "all." This is a combination of u, g, and o |'
