    \ have noticed that the variable i was chosen for each of the previous loop examples.\
    \ Why? No specific reason actually besides tradition. The variable used with for\
    \ can be any valid variable, but i is the most common, followed by j and k.\n\
    The basis of this tradition comes from the Fortran programming language. In Fortran,\
    \ undeclared variables starting with the letters I, J, K, L, and M are automatically\
    \ typed as integers, while variables beginning with any other letter are typed\
    \ as reals (numbers with decimal fractions). This behavior led programmers to\
    \ use the variables I, J, and K for loop variables since it was less work to use\
    \ them when a temporary variable (as loop variables often are) was needed.\nIt\
    \ also led to the following Fortran-basedistic: \"GOD is real, unless integer\"\
