    After entering the command, we enter the letters c, b, and a, and then we press
    CTRL-D to indicate end of file. We then view the resulting file and see that the
    lines now appear in sorted order.

    Because sort can accept multiple files on the command line as arguments, it is
    possible to merge multiple files into a single sorted whole. For example, if we
    had three text files and wanted to combine them into a single sorted file, we
    could do something like this:


    ```

    sort file1.txt file2.txt file3.txt > final_sorted_list.txt

    ```


    sort has several interesting options. Table 20-1 provides a partial list.


    # Table 20-1: Common sort Options


    | Option | Long option | Description |

    | --- | --- | --- |

    | -b | --leading-blanks | By default, sorting is performed on the entire line,
    starting with the first character in the line. This option causes sort to ignore
    leading spaces in lines and calculates sorting based on the first non-whitespace
    character on the line |

    | -f | --ignore-case | Make sorting case-insensitive |

    | -n | --numeric-sort | Perform sorting based on the numeric evaluation of a string.
    Using this option allows sort to be performed on numeric values rather than alphabetic
    values |

    | -r | --reverse | Sort in reverse order. Results are in descending rather than
    ascending order |

    | -k | --key=field1,[field2] | Sort based on a key field located from field1 to
    the entire line. See the following discussion |

    | -m | --merge | Treat each argument as the name of a presorted file. Merge multiple
    files into a single sorted result without performing any additional sorting |

    | -o | --output=file | Send sorted output to file rather than standard output
    |

    | -t | --field-separator=char | Define the field-separator character. By default
    fields are separated by spaces or tabs |


    Although most of these options are pretty self-explanatory, some are not. First,
    let''s look at the -n option, used for numeric sorting. With this option, it is
    possible to sort values based on numeric values rather than lexicographically.
    We can demonstrate this by the results of the du command to'
