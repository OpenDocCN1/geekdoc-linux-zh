    # Parameter Expansion


    We''re going to touch only briefly on parameter expansion in this chapter, but
    we''ll be covering it extensively later. It''s a feature that is more useful in
    shell scripts than directly on the command line. Many of its capabilities have
    to do with the system''s ability to store small chunks of data and give each chunk
    a name. Many such chunks, more properly called variables, are available for your
    examination. For example, the variable USER contains your username. To invoke
    parameter expansion and reveal the contents of USER, you would do:


