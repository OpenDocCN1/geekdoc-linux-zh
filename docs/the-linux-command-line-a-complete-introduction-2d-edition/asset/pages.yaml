- img_proc: true
  md: '# Why We Should Learn vi


    In this modern age of graphical editors and easy-to-use text-based editors such
    as nano, why should we learn vi? There are three good reasons.


    +   - vi is almost always available. If we have a system with no graphical interface,
    such as a remote server or a local system with a broken X configuration, this
    can be a lifesaver, nano, while increasingly popular, is still not universal.
    POSIX, a standard for program compatibility on Unix systems, requires that vi
    be present.

    - vi is lightweight and fast. For many tasks, it''s easier to bring up vi than
    to find the graphical text editor in the menu and wait for its megabytes to load.
    In addition, vi is designed for typing speed. As we will see, a skilled vi never
    has to lift their fingers on the keyboard while editing.

    - We don''t want other Linux and Unix users to think we are cowards.


    Okay, maybe two good reasons.


    # A Little Background


    The first version of vi was written in 1976 by Bill Joy, a University of California
    Berkeley student who later went on to cofound Sun Microsystems. vi derives its
    name from the word “visual,” because it was intended to allow editing on a video
    terminal with a moving cursor. Previous to visual editors, there were line editors
    that operated on a single line of text at a time. To specify a change, we tell
    a line editor to go to a particular line and describe what change to make, such
    as adding or deleting text. With the advent of video terminals (rather than printer-based
    terminals like terminals), visual editing became possible. vi actually incorporates
    a powerful line editor called ex, and we can use line editing commands while using
    vi.


    Most Linux distributions don''t include real vi; rather, they ship with an enhanced
    replacement called vim (which is short for “vi improved”) written by Bram Molenaar
    vim is a substantial improvement over traditional Unix vi and is usually symbolically
    linked (or aliased) to the name vi on Linux systems. In the discussions that follow,
    we will assume that we have a program-gram vi that is really vim.


    # Starting and Stopping vi


    To start vi, we simply enter the following:


    ```

    [me@linux ~]$ vi

    ```


    A screen like the following should appear.'
