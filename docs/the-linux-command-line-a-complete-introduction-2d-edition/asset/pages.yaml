- img_proc: true
  md: "to version 4.0, there was no way to case match more than one test. Modern versions\
    \ of bash add the ;;& notation to terminate each action, so now we can do this:\n\
    \n```\n#!/bin/bash\n```\n\n```\n#case4-2: test a character\n\nread -n 1 -p \"\
    Type a character > \" \necho\ncase \"$REPLY\" in\n  [[:upper:]]]) echo \"$REPLY\
    \ is upper case.\" ;;&  \n  [[:lower:]]]) echo \"$REPLY is lower case.\" ;;& \
    \ \n  [[:alpha:]]]) echo \"$REPLY is alphabetic.\" ;;&  \n  [[:digit:]]]) echo\
    \ \"$REPLY is a digit.\" ;;&  \n  [[:graph:]]]) echo \"$REPLY is a visible character.\"\
    \ ;;&  \n  [[:punct:]]]) echo \"$REPLY is a punctuation symbol.\" ;;&  \n  [[:space:]]])\
    \ echo \"$REPLY is a whitespace character.\" ;;&  \n  [[:xdigit:]]]) echo \"$REPLY\
    \ is a hexadecimal digit.\" ;;&\nesac\n```\n\nWhen we run this script, we get\
    \ this:\n\n```\nme@linuxbox ~$ case4-2\nType a character >\n  'a' is lower case.\n\
    \  'a' is alphabetic.\n  'a' is a visible character.\n  'a' is a hexadecimal digit.\n\
    ```\n\nThe addition of the ;;& syntax allows case to continue to the next test\
    \ rather than simply terminating.\n\n# Summing Up\n\nThe case command is a handy\
    \ addition to our bag of programming tricks. As we will see in the next chapter,\
    \ it's the perfect tool for handling certain types of problems."
