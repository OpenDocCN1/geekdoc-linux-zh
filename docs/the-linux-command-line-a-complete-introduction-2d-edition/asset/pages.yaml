  md: '# Interrupting a Process


    Let''s observe what happens when we run again xlog. First, enter the xlogo command
    and verify that the program is running. Next, return to the terminal window and
    press CTRL-C.


    ```

    [me@linuxux ~]$ xlog

    [me@linuxux ~]$

    ```


    In a terminal, pressing CTRL-C interrupts a program. This means we are politely
    asking the program to terminate. After we pressed CTRL-C, the xlogo window closed,
    and the shell prompt returned.


    Many (but not all) command line programs can be interrupted by using this technique.


    # Putting a Process in the Background


    Let''s say we wanted to get the shell prompt without terminating the xlogo program.
    We can do this by placing the program in the background. Think of the terminal
    as having a foreground (with stuff visible on the surface like the shell prompt)
    and a background (with stuff hidden behind the surface). To launch a program so
    that it is immediately placed in the background, follow the command with the ampersand
    (&) character.


    ```

    [me@linuxux ~]$ xlog &\n[1] 28236

    [me@linuxux ~]$

    ```


    After entering the command, the xlogo window appeared, and the shell prompt returned,
    but some funny numbers appeared too. This message is part of a shell feature called
    job control. With this message, the shell is telling us that we have started job
    1 ((1)) and that it has PID 28236. If we run ps, we can see our processes.


    ```

    [me@linuxux ~]$ ps

    PID TTY CMD

    10603 pts/1 00:00:00 bash

    28236 pts/1 00:00:00 xlog

    28239 pts/1 00:00:00 ps

    ```


    The shell''s job control facility gives us a way to list the jobs that have been
    launched from our terminal. Using the jobs command, we can see this:


    ```

    [me@linuxux ~]$ jobs

    [1]+ Running xlog &

    ```


    The results show that we have one job, numbered 1; that it is running; and that
    the command was xlog &.'
