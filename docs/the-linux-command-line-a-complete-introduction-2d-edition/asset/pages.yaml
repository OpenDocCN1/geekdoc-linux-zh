    # # PROCESSES


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_130_0.png)


    Modern operating systems are usually multitasking, meaning they create the illusion
    of doing more than one thing at once by rapidly switching from one executing program
    to another. The kernel manages this through the use of processes. Processes are
    how Linux organizes the different programs waiting for their turn at the CPU.


    Sometimes a computer will become sluggish or an application will stop responding.
    In this chapter, we will look at some of the tools available at the command line
    that let us examine what programs are doing and how to terminate processes that
    are misbehaving.


    This chapter will introduce the following commands:


    +   * ps Report a snapshot of current processes

    "* top Display tasks

    "* jobs List active jobs

    "* bg Place a job in the background"'
