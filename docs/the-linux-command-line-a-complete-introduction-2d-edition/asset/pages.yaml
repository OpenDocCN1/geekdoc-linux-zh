  md: '# Table 10-4: Common Signals


    | Number | Name | Meaning |

    |---|---|---|

    | 1 | HUP | Hang up. This is a vestige of the old days when terminals were attached
    to remote computers with phone lines and modems. The signal is used to indicate
    the controlling terminal has "hung up." The effect of this signal can be demonstrated
    by closing a terminal session. The foreground program running on the terminal
    will be sent the signal and terminate. This signal is also used by many daemons
    to cause a reinitialization. This means that when a daemon is sent this signal,
    it will restart and reread its configuration file. The Apache web server is an
    example of a daemon that uses the HUP signal in this way. |

    | 2 | INT | Interrupt. It performs the same function as CTRL-C sent from the terminal.
    It will usually terminate a program. |

    | 9 | KILL | Kill. This signal is special. Whereas programs may choose to handle
    signals sent to them in different ways, ignoring them all together, the KILL signal
    is never actually sent to the target program. Rather, the kernel terminates the
    process. When a process is terminated in this manner, it is given no opportunity
    to "clean up" itself or save its work. For this reason, the KILL signal should
    be used only as a last resort when other termination signals fail. |

    | 15 | TERM | Terminate. This is the default signal sent by the kill command.
    If a program is still "alive" enough to receive signals, it will terminate. |

    | 18 | CONT | Continue. This will restore a process after STOP or TSTP signal.
    This signal is sent by the bg and fg commands. |

    | 19 | STOP | Stop. This signal causes a process to pause without terminating.
    Like the KILL signal, it is not sent to the target process, and thus it cannot
    be ignored. |

    | 20 | TSTP | Terminal stop. This is the signal sent by the terminal when CTRL-Z
    is pressed. Unlike the STOP signal, the TSTP signal is received by the program,
    but the program may choose to ignore it. |


    Let''s try the kill command.


    ```

    [me@linuxbox ~]$ xlogo &

    [1] 13546

    [me@linuxbox ~]$ kill -1 13546

    [1]+ Hangup

    ```'
