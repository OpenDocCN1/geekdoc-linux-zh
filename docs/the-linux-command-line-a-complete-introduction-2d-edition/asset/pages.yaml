    # mkdir—Create Directories


    The mkdir command is used to create directories. It works like this:


    ```

    mkdir directory...

    ```


    Note that when three periods follow an argument in the description of a command
    (as in the preceding example), it means that the argument can be repeated. Thus,
    the following command:


    ```

    mkdir dir1

    ```


    would create a single directory named dir1. This command


    ```

    mkdir dir1 dir2 dir3

    ```


    would create three directories named dir1, dir2, and dir3.


    # cp—Copy Files and Directories


    The cp command copies files or directories. It can be used two different ways.
    The following:


    ```

    cp item1 item2

    ```


    copies the single file or directory item1 to the file or directory item2. This
    command:


    ```

    cp item... directory

    ```


    copies multiple items (either files or directories) into a directory.


