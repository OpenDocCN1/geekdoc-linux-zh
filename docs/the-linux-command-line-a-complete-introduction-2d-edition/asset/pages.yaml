    # Associative Arrays


    bash versions 4.0 and greater support associative arrays. Associative arrays use
    strings rather than integers as array indexes. This capability allows interest-new
    approaches to managing data. For example, we can create an array called colors
    and use color names as indexes.


    ```

    declare -A colors

    colors["red"]="#ff0000"

    colors["green"]="#00ff00"

    colors["blue"]="#0000ff"

    ```


    Unlike indexed arrays, which are created by merely referencing them, associative
    arrays must be created with the declare command using the new -A option. Associative
    array elements are accessed in the same way as integer-indexed arrays.


    ```

    echo ${colors["blue"]}

    ```


    In the next chapter, we will look at a script that makes good use of asso-ci arrays
    to produce an interesting report.


    # Summing Up


    If we search the bash page for the word array, we find many instances of where
    bash makes use of array variables. Most of these are rather obscure, but they
    may provide occasional utility in some special circumstances. In fact, the entire
    topic of arrays is rather under-utilized in shell programming'
