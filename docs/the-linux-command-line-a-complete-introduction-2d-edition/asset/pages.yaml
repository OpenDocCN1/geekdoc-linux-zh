    # Signals


    The kill command is used to “kill” processes. This allows us to terminate programs
    that need killing (that is, some kind of pausing or termination). Here''s an example:


    ```

    me@linuxbox ~]$ xlogo & \

    [1] 28401

    me@linuxbox ~]$ xkill 28401

    [1]+ Terminated

    xlogo

    ```


    We launch xlogo in the background. The shell prints the jobspec and the PID of
    the background process. Next, we use the kill command and specify the PID of the
    process we want to terminate. We could have specified the process using a jobspec
    (for example, x!) instead of a PID.

    While this is all quite straightforward, there is more to it than.

    The kill command doesn''t exactly “kill” processes; rather, it sends signals.
    Signals are one of several ways that the operating system communicates with programs.
    We have already seen signals in action with the use of CTRL-C and CTRL-Z. When
    the terminal receives one of these keystrokes, it sends a signal to the program
    in the foreground. In the case of CTRL-C, a signal called INT (interrupt) is sent;
    with CTRL-Z, a signal called TSTOP (terminal) is sent. Programs, turn “listen”
    for signals and may act upon them as they are received. The fact that a program
    can listen and act upon signals allows a program to do things such as save work
    in progress when it receives a termination signal.


    # Sending Signals to Processes with kill


    The kill command is used to send signals to programs. Its most common syntax looks
    like this:


    ```

    kill -signal PID ...

    ```


    If no signal is specified on the command, then the TERM (terminate) signal is
    sent by default. The kill command is most often used to send the signals listed
    in Table 10-4.'
