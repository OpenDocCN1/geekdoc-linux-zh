  md: '```

    [me@linuxbox ~]$ echo "AAA" | grep AAA

    AAA

    [me@linuxbox ~]$ echo "BBB" | grep AAA

    [me@linuxbox ~]$

    ```


    This is a pretty straightforward example, in which we pipe the output

    of into grep and see the results. When a match occurs, we see it printed

    out out; when no match occurs, we see no results.


    Now we''ll add alternation, signified by the vertical-bar metacharacter.


    ```

    [me@linuxbox ~]$ echo "AAA" | grep -E ''AAA|BBB''

    AAA

    [me@linuxbox ~]$ echo "BBB" | grep -E ''AAA|BBB''

    BBB

    [me@linuxbox ~]$ echo "CCC" | grep -E ''AAA|BBB''

    [me@linuxbox ~]$

    ```


    Here we use the regular expression ''AAA|BBB'', which means "match

    eier the string AAA or the string "BBB". Notice that this is an extended

    feature, we added the -E option to grep (though we could have used the

    grep program instead), and we enclosed the regular expression in quotes to

    prevent the shell from interpreting the vertical-bar metacharacter as a pipe

    operator. Alternation is not limited to two choices.


    ```

    [me@linuxbox ~]$ echo "AAA" | grep -E ''AAA|BBB|CCC''

    ```


    To combine alternation with other regular expression elements, we

    use () to separate the alternation.


    ```

    [me@linuxbox ~]$ grep -Eh ''^(bz|gz|zip)*'' dirlist*.txt

    ```


    This expression will match the filenames in our lists that start with

    e bz, gz, or zip. Had we left off the parentheses, the meaning of this

    regular expression changes to match any filename that begins with bz or

    contains gz or contains zip:


    ```

    [me@linuxbox ~]$ grep -Eh ''^bz|gz|zip\*'' dirlist*.txt

    ```


