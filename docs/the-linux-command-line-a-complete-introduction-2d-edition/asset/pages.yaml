  md: 'before the rm command to allow the command and its expanded argument list to
    be displayed, rather than the command actually being executed. This change allows
    safe execution of the code. At the end of the code fragment, we place an exit
    command to conclude the test and prevent any other part of the script from being
    carried out. The need for this will vary according to the design of the script.


    We also include some comments that act as "markers" for our test-related changes.
    These can be used to find and remove the changes when testing is complete.


    # Test Cases


    To perform testing, it is important to develop and apply good test cases. This
    is done by carefully choosing input data or operating conditions that reflect
    edge and corner cases. In our code fragment (which is simple), we want to know
    how the code performs under three specific conditions.


    +   * dir_name contains the name of an existing directory.

    * dir_name contains the name of a nonexistent directory.

    * dir_name is empty.


    By performing the test with each of these conditions, good test coverage is achieved.


    Just as with design, testing is a function of time, as well. Not every script
    feature needs to be extensively. It''s a matter of determining what is most important.
    Since it could be potentially destructive if malfunctioning, our code fragment
    deserves careful consideration during both its design and testing.


    # Debugging


    If testing reveals a problem with a script, the next step is debugging. "A problem"
    usually means that the script is, in some way, not performing to the programmer''s
    expectations. If this is the case, we need to carefully determine exactly what
    the script is actually doing and why. Finding bugs involves a lot of detective
    work.


    A well-designed script will try to help. It should be programmed defensively to
    detect abnormal conditions and provide useful feedback to the user. Sometimes,
    however, problems are quite strange and unexpected, and more techniques are required.


    # Finding the Problem Area


    In scripts, particularly long ones, it is sometimes useful to isolate the area
    of the script that is related to the problem. This won''t always be the actual
    error, but isolation will provide insights into the actual case. One technique
    that can be used to isolate code is "commenting out" sections of a script. For
    example, our file deletion fragment could be modified to determine whether the
    removed section was related to an error.'
