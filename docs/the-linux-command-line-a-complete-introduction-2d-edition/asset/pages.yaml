- img_proc: true
  md: 'This script prompts the user to enter the username of an account on the system
    and displays the different fields found in the user''s record in the /etc/passwd
    file. The script contains two interesting lines. The first is as follows:


    ```

    file_info=$(grep "^user_name:" $FILE

    ```


    This line assigns the grep command to the variable file_info. The regular expression
    used by grep assures that the username will match only a single line in the /etc/passwd
    file.

    The second line is this one:


    ```

    IFS=\: read pw uid gid name home shell <<< "$file_info"

    ```


    The line consists of three parts: a variable assignment, a read command with a
    list of variable names as arguments, and a strange redirection operator. We will
    look at the variable assignment first.

    The shell allows one or more variable assignments to take place immediately before
    a command. These assignments alter the environment for the command that follows.
    The effect is temporary, changing the environment only for the duration of the
    command. In our case, the value of IFS is changed to a colon character. Alternately,
    we could have coded this way:


    ```

    OLD_IFS="$IFS"

    IFS=":"

    read user pw uid gid name home shell <<< "$file_info"

    IFS="$OLD_IFS"

    ```


    where we store the value of IFS, assign a new value, and restore IFS to its original
    value. Clearly, placing the variable assignment in front of the command is a more
    concise way of doing the thing.

    The << operator indicates a here string. A string is like a here document, shortly
    consisting of a single string. In our example, the line of data from the /etc/passwd
    file is fed to the standard input of the read command. We might wonder why this
    rather oblique method was chosen rather this:


    ```

    echo "$file_info" | IFS=": read user pw uid gid name home shell

    ```


    Well, there''s a reason . . .'
