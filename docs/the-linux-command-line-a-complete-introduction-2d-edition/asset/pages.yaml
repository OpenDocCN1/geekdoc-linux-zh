  md: '# About the Author


    William Shots has been a software professional for more than 30 years and an avid
    Linux user for more than 20 years. He has an extensive background in software
    development, including technical support, quality assurance, and documentation.
    He is also the creator of LinuxCommand.org, a Linux education and advocacy site
    featuring news, reviews, and extensive support for using the Linux command line.


    # About the Technical Reviewer


    Jordi Gutiérrez Hermoso is a coder, mathematician, and hacker-errant. He runs
    Debian GNU/Linux exclusively since 2002, both at home and at work. Jordi has been
    involved with GNU Octave, a free numerical computing environment largely compatible
    with Matlab, and with Mercurial, a distributed version control system. He enjoys
    pure and applied mathematics, skating, swimming, and knitting. Nowadays he thinks
    a lot about environmental mapping, greenhouse gas emissions, and rhino conservation
    efforts.'
