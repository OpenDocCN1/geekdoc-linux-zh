    # PORTABILITY IS THE HOBGOBL OF LITTLE MINDS


    If you talk to "real" Unix people, you quickly discover that many of them don''t
    like Linux very much. They regard it as impure and unclean. One tent of Unix users
    is that everything is "portable." This means that any script you should be able
    to run, unchanged, on any Unix-like system.


    Unix people have good reason to believe this. Having seen proprietary extensions
    to commands and shells did to the world before POSIX, they are naturally aware
    of the effect of Linux on their beloved OS.


    But portability has a serious downside. It prevents progress. It requires that
    things are always done "lowest common denominator" techniques. In the case of
    shell scheming, it means everything compatible with sh, the original Bourne shell.


    This downside is the excuse that proprietary software vendors use to justify their
    proprietary extensions, only they call them "innovations." But they are really
    just lock-in devices for their customers.


    The GNU tools, such as bash, have no restrictions. They encourage portability
    by supporting standards and by being universally available. You can install bash
    and the other GNU tools on almost any kind of system, even Windows, without cost.
    So feel free to use all the features of bash. It''s really portable.


    # Control Operators: Another Way to Branch


    bash provides two control operators that can perform branching. The && (AND) and
    || (OR) operators work like the logical operators in the [[ ]] compound command.
    Here is the syntax for &&:


    ```

    command1 && command2

    ```


    Here is the syntax for ||:


    ```

    command1 || command2

    ```


    It is important to understand the behavior of the && operator, command1 is executed,
    and command2 is executed if, and only if, command1 is successful. With the ||
    operator, command1 is executed and command2 is executed if, and only if, command1
    is unsuccessful.'
