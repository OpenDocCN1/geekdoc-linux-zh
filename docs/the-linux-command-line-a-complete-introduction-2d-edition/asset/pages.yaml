    \ command is attempted only if the mkdir command is successful. Likewise, a command\
    \ like this:\n\n```\n[me@linuxbox ~]$ [[ -d temp ]] || mkdir temp\n```\n\nwill\
    \ test for the existence of the directory temp, and only if the test fails will\
    \ the directory be created. This type of construct is handy for handling errors\
    \ in scripts, a subject we will discuss more in later chapters. For example, we\
    \ could do this in a script:\n\n```\n[-d temp ]] || exit 1\n```\n\nIf the script\
    \ requires the directory temp and it does not exist, then the script will terminate\
    \ with an exit status of 1.\n\n# Summing Up\n\nWe started this chapter with a\
    \ question. How could we make our sys_info_page detect whether the user had permission\
    \ to read all home directories? With our knowledge of it, we can solve the problem\
    \ by adding this code to the report_home_space function:\n\n```\nreport_home_space\
    \ () {\nif [[ \"$(id -u)\" -eq 0 ]]; then\n  cat << _EOF\n    <h2>Home Space Utilization\
    \ (All Users)</h2>\n    <pre>$(du -sh /home/*)</pre>\n  _EOF\nelse\n  cat << _EOF\n\
    \    <h2>Home Space Utilization ($USER)</h2>\n    <pre>$(du -sh $HOME)</pre>\n\
    \  _EOF\n  fi\n  return\n}\n```\n\nWe evaluate the output of the id command. With\
    \ the -u option, id outputs the numeric user ID number of the effective user.\
    \ The superuser is always ID zero, and every other user is a number greater than\
    \ zero. Knowing this, we can construct two different documents, one taking advantage\
    \ of super privileges and the other restricted to the user's own home directory.\n\
    \nWe are going to take a break from the sys_info_page program, but don't worry.\
    \ It will be back. In the meantime, we'll cover some topics we'll need when we\
    \ resume our work."
