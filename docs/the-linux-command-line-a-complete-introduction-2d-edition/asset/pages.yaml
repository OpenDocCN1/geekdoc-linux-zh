  md: "Here we have an example program that validates various kinds of input:\n\n\
    ```\n#!/bin/bash\n```\n\n# read-validate: validate input\n\n```\ninvalid_input\
    \ () {\n    echo \"Invalid input '$REPLY\" >&2\n    exit 1\n}\n```\n\nread -p\
    \ \"Enter a single item > \"\n\n```\n# input is empty (invalid)\n[[ -z \"$REPLY\"\
    \ ]] && invalid_input\n```\n\n```\n# input is multiple items (invalid)\n(( \"\
    $(echo $REPLY\" | wc -w) > 1 )) && invalid_input\n```\n\n```\n# input is a valid\
    \ filename\nif [[ \"$REPLY\" =~ ^[[:alnum:]]+\\$ ]]; then\n    echo \"$REPLY is\
    \ a valid filename.\"\n    if [[ -e \"$REPLY\" ]]; then\n        echo \"And file\
    \ '$REPLY' exists.\"\n    else\n        echo \"However, file $REPLY does not exist.\"\
    \nfi\n```\n\n```\n# input is a floating point number?\nif [[ \"$REPLY\" =~ ^[[:digit:]]+\\\
    .[[:digit:]]+\\$ ]]; then\n    echo \"$REPLY is a floating point number.\"\nelse\n\
    \    echo \"$REPLY is not a floating point number.\"\nfi\n```\n\n```\n# input\
    \ is an integer?\nif [[ \"$REPLY\" =~ ^-?[[:digit:]]+\\$ ]]; then\n    echo \"\
    $REPLY is an integer.\"\nelse\n    echo \"$REPLY is not an integer.\"\nfi\n```\n\
    \necho \"The string '$REPLY' is not a valid filename.\"\n\nThis script prompts\
    \ the user to enter an item. The item is subsequently analyzed to determine its\
