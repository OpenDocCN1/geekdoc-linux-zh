  md: '# ACKNOWLEDGMENTS


    I want to thank the following people, who helped make this book possible.


    # First Edition


    First, the people who inspired me:


    Jenny Watson, acquisitions editor at Wiley Publishing who originally suggested
    that I write a shell scripting book.


    John C. Dvorak, noted columnist and pundit. In an episode of his video podcast,
    Cranky Geeks, noted Dvorak described the process of writing: "Hell. Write 200
    words a day, and in a year, you have a novel." This advice led me to write a page
    day until I had a book.


    Dmitri Popov wrote an article in Free Software Magazine titled "Creating a book
    template with Writer," which inspired me to use OpenOfficeorg Writer (and later,
    LibreOffice Writer) for composing the text. As it turned out, it worked wonderfully.


    Next, the volunteers who helped me produce the original, freely distributed version
    of this book (available at LinuxCommand.org):


    Mark Polesky performed an extraordinary review and test of the text.'
