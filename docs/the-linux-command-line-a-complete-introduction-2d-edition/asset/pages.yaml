  md: '# Table 21-3: fmt Options


    | Option | Description |

    | -c | Operate in crown margin mode. This preserves the indentation of the first
    two lines of a paragraph. Subsequent lines are aligned with the indentation of
    the second line. |

    | -p string | Format only lines beginning with the prefix string. After formatting,
    the contents of strings are prefixed to each reformed line. This option can be
    used to format text in source code comments. For example, any programming language
    or configuration file that uses a # character to delineate a comment could be
    formatted by specifying -p "# so that only the comments will be formatted. See
    the example that follows. |

    | -s | Split-one mode. In this mode, lines will only be split to fit the specified
    column width. Short lines will not be joined to fill lines. This mode is useful
    when formatting text such as code where joining is not desired. |

    | -u | Perform unity apply traditional "typewriter-style" formatting to the text.
    This means a space between words and two spaces between sentences. This mode is
    useful for removing justification, that text that has been padded with spaces
    to force alignment on both the left and right margins. |

    | -w width | Format text to fit within a column width characters. The default
    is 75 characters. Note: fmt actually formats lines slightly shorter than the specified
    width for line balancing.


    The -p option is particularly interesting. With it, we can select portions of
    a file, provided that the lines to be formatted all begin with the same sequence
    of characters. Many programming languages use the pound sign (# to indicate the
    beginning of a comment and thus can be formatted using this option. Let''s create
    a file that simulates a program that uses comments.


    ```

    [me@linuxbox ~]$ cat fmt-code.txt

    # This file contains code with comments.

    ```


    ```

    # This line is a comment.

    # Followed by another comment line.

    # And another.

    ```


    This, on the other hand, is a line of code.

    And another line of code.

    And another.


    Our sample file contains comments that begin with the string # (a # followed by
    a space) and lines of "code" that do not. Now, using fmt, we format the comments
    and lines of the code untouched.


    ```

    [me@linuxbox ~]$ fmt -w 50 -p ''# '' fmt-code.txt

    # This file contains code with comments.

    ```'
