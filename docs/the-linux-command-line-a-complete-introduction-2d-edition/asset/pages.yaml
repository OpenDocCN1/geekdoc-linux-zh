    # Variables and Constants


    There is an issue with our script, however. Notice how the string System Information
    Report is repeated? With our tiny script it was really long and we had multiple
    instances of this string. If we wanted to change the title to something else,
    we would have to change it in multiple places, which could be a lot of work. What
    if we could arrange the script so that the string appeared only once and not multiple
    times? That would make future maintenance of the script much easier. Here''s how
    we could do:


    ```

    #!/bin/bash


    # Program to output a system information page

    title="System Information Report"

    echo "<html>

    <head>

    <title>$title</title>

    </head>

    <body>

    <h1>$title</h1>

    </body>

    </html>"

    ```


    By creating a variable named title and assigning the value System Information
    Report, we can take advantage of parameter expansion and place the string in multiple
    locations.


