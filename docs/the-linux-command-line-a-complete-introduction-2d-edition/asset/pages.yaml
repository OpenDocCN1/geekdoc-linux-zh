  md: '# # 4\ MANIPULATING FILES AND DIRECTORIES


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_54_0.png)


    At this point, we are ready for some real work! This chapter will introduce five
    of the most frequently used Linux commands. The following commands are used for
    manipulating both files and directories:


    +   - `cp` Copy files and directories

    - `mv` Move/rename files and directories

    - `mkdir` Create directories

    - `rm` Remove files and directories

    - `ln` Create hard and symbolic links


    Now, to be frank, some of the tasks performed by these commands are more easily
    done with a graphical file manager. With a file manager, we can drag and drop
    a file from one directory to another, cut and paste files, delete files, and so
    on. So why use these old command line programs?'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'The answer is power and flexibility. While it is easy to perform simple file
    manipulations with a graphical file manager, complicated tasks can be easier with
    the command line programs. For example, how could we copy all the HTML files from
    one directory to another copy files that do not exist in the destination directory
    or are newer than the versions in the destination directory? It''s pretty hard
    with nearer a file manager but pretty easy with the command line.


    ```

    cp -u *.html destination

    ```


    # # Wildcards


    Before we begin using our commands, we need to talk about a shell feature that
    makes these commands so powerful. Because the shell uses so much, it provides
    special characters to help you rapidly specify groups of filenames. These special
    characters are called wildcards. Using wildcards (which is also known as *globbing*)
    allows you to select filenames based on patterns of characters. Table 4-1 lists
    the wildcards and what they select.


    Table 4-1: Wildcards


    | Wildcard | Meaning |

    | --- | --- |

    | * | Matches any characters |

    | ? | Matches any single character |

    | [characters] | Matches any character that is a member of the set characters
    |

    | ![characters] | Matches any character that is not a member of the set characters
    |

    | [[class:]] | Matches any character that is a member of the specified class |


    Table 4-2 lists the most commonly used character classes.


    Table 4-2: Commonly Used Character Classes


    | Character class | Meaning |

    | --- | --- |

    | [[:alnum:]] | Matches any alphanumeric character |

    | [[:alpha:]] | Matches any alphabetic character |

    | [[:digit:]] | Matches any numeral |

    | [[:lower:]] | Matches any lowercase letter |

    | [[:upper:]] | Matches any uppercase letter |


    Using wildcards makes it possible to construct sophisticated selection criteria
    for filenames. Table 4-3 provides some examples of patterns and what they match.'
  merge: -1
