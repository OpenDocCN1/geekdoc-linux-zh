  md: '# # 18


    # # ARCHIVING AND BACKUP


    ![](img/0cf46e6370424e4fc9bc72ba090b1e02_240_0.png)


    One of the primary tasks of a computer system''s administrator is keeping the
    system''s data secure. One way this is done by performing timely backups of the
    system''s files. Even if you''re not a system administrator, it is often useful
    to make copies of things and move large collections of files from place to place
    and from device to device.


    In this chapter, we will look at several common programs that are used to manage
    collections of files. These are the file compression programs:


    +   - **gzip** Compress or expand files

    - **bzip2** A block sorting file compressor


    These are the archiving programs:


    +   - **tar** Tape archiving utility

    - **zip** Package and compress files'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'This is the file synchronization program:


    rsync Remote file and directory synchronization


    # Compressing Files


    Throughout the history of computing, there has been a struggle to get the most
    data into the smallest available space, whether that space be memory, storage
    devices, or network bandwidth. Many of the data services we take for granted today,
    such as mobile phone service, high-definition television, or broadband Internet,
    owe their existence to effective data compression techniques.


    Data compression is the process of removing redundancy from data. Let''s consider
    an imaginary example. Suppose we have an entirely black picture with the dimensions
    of 100 pixels by 100 pixels. In terms of data storage (assuming 24 bits, or 3
    bytes per pixel), the image will occupy 30,000 bytes of storage.


    100 × 100 × 3 = 30,000


    An image that is all color contains entirely redundant data. If we were clever,
    we could encode the data in such a way that we simply describe the fact that we
    have a block of 10,000 black pixels. So, instead of storing a block of data containing
    30,000 zeros (black as zero), we could compress the data into the number 10,000,
    followed by a zero to represent our data. Such a data compression scheme is run-length
    encoding and is one of the most rudimentary compression techniques. Today''s techniques
    are much more advanced and complex, but the basic goal remains the same—get rid
    of redundant data. Compression algorithms (the mathematical techniques used to
    carry out the compression) fall into two general categories.


    +   * Lossless. Lossless compression preserves all the data contained in the original.
    This means that when a file is restored from a compressed version, the restored
    file is exactly the same as the original, uncompressed version.

    * Lossy. Lossy compression, on the other hand, removes data as the compression
    is performed to allow more compression to be applied. When a lossy file is restored,
    it does not match the original value; rather, it is a close approximation. Examples
    of loss compression are JPEG (for images) and MP3 (for music).


    In our discussion, we will look exclusively at lossless compression since most
    data on computers cannot tolerate any data loss.


    # gzip


    The gzip program is used to compress one or more files. When executed, it replaces
    the original file with a compressed version of the original.'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'corresponding gunzip program is to restore compressed files of their original,
    uncompressed form. Here is an example:


    ```

    [me@linux]$$ ls -1 /etc > foo.txt

    [me@linux]$$ ls -1 foo.*

    [-rw-r--] 1 me 15738 2018-10-14 07:15 foo.txt

    [me@linux]$$ gunzip foo.txt

    [me@linux]$$ ls -1 foo*.

    [-rw-r--] 1 me 3230 2018-10-14 07:15 foo.txt.gz

    [me@linux]$$ gunzip foo.txt

    [me@linux]$$ ls -1 foo*

    [-rw-r--] 1 me 15738 2018-10-14 07:15 foo.txt

    ```


    In this example, we create a text file foo.txt from a directory listing. Next,
    we run gunzip, which replaces the original file with a compressed version name
    foo.txt.gz. In the directory listing of foo*, we see that the original file has
    been replaced with the compressed version and the compressed version is about
    one-fifth of the original. Can also see that the compressed file has the same
    permissions and timestamp as the original.


    Next, we run the gunzip program to uncompress the file. Afterward, we can see
    that the compressed version of the file has been replaced with the original, again
    with the permissions and timestamp preserved. gzip has many options, as described
    in Table 18-1.


    # Table 18-1: gzip Options


    | Option | Long option | Description |

    |---|---|---|

    | -c | --stdout | Write output to standard output and keep the original files.
    |

    | | --to-stdout | |

    | -d | --decompress | Decompress. This causes gzip to act like gunzip. |

    | | --uncompress | |

    | -f | --force | Force compression even if a compressed version of the original
    file already exists. |

    | -h | --help | Display usage information. |

    | -l | --list | List compression statistics for each file compressed. |

    | -x | --recursive | If one or more arguments on the command line are directory,
    recursively compress files contained within them. |

    | -t | --test | Test the integrity of a compressed file. |

    | -v | --verbose | Display verbose messages while compressing. |

    | -number | | Set amount of compression. number is an integer in the range of
    1 (fastest, least compression) to 9 (slowest, most compression). The values 1
