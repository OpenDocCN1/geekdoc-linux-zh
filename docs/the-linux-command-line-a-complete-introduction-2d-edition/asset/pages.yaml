    \ Tokens\n\nAnother common mistake forgetting to complete a compound command,\
    \ such as if or while. Let's look at what happens if we remove the semicolon after\
    \ test in the if command:\n\n```\n#!/bin/bash\n\n# trouble: script to demonstrate\
    \ common errors\n\nnumber=1\n\nif [ $number = 1 ] then\n    echo \"Number is equal\
